  md: 'of good research that only came about as a result of commercial sponsor-ship.
    However, there are certain tendencies that have been identified when commercial
    funding is provided to individual research projects (Bastian, 2006; Langley &
    Parkinson, 2009).


    +   1. They tend to find results that are harmonious with the commercial priorities
    of the funders. This ‘funding bias’ isn’t necessarily a result of academic misconduct,
    although it can be. It’s more often a result of ‘loading the deck’ by funders
    who predominantly pick those researchers who had already published results favourable
    to the industry. See for example Lundh et al. (2017); Pisinger et al. (2019);
    and Turner and Spilich (1997).


    +   2. Commercial funding often comes with confidentiality agreements, requires
    the signing of non-disclosure agreements, and includes intellectual property exploitation
    as a cornerstone of the outputs through the seeking of patents (Washburn, 2008).
    Similarly, some companies may use confidentiality clauses to stop the publication
    of results that they do not desire (Langley & Parkinson, 2009).


    +   3. Conflicts of interest begin to become more significant (Babor & Robaina,
    2012). When reporting for example on experimental trials around a particular sponsored
    product, it is not always the case that these interests are fully disclosed (Krimsky
    & Rothenberg, 2001).


    At a sector level, other things also come into play (Langley & Parkinson, 2009):


    +   1. Commercial interests become one of the key elements in progressing a research
    agenda, rather than that which may be in the public’s interest.


    +   2. As universities reorganise to take advantage of these revenue streams,
    they are often compelled to disregard classic ‘academic’ virtues such as openness,
    objectivity, and the independence of researchers.


    +   3. Academic departments are increasingly orienting themselves to the needs
    of business, which means that corporations have greater ability to apply pressure
    because they are a major, or even the primary, generator of research funds.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Again, it is not our argument that commercial interests in academic research
    are necessarily bad – only that the benefits that come from having such funding
    available must be balanced against the risks both for individual studies and for
    the sector as a whole. In our case study, we can see one of the major issues –
    commercial confidentiality agreements have trumped the requirement for the professor
    to be open and transparent about his results.


    In this situation, we have a compartmentalised model of knowledge where many funding
    partners and collaborators are feeding in to a single pool of data. Only the professor,
    as gatekeeper and guardian of the data, can see the full sweep of what’s contained
    within. Each of the individual partners in the project would know what their own
    data is supposed to look like but would be blocked from viewing the data that
    might belong to their competitors. It’s not possible for someone to simply go
    back to the source here because the source data from one provider has long since
    been merged with the source data from others. It’s not impossible that someone
    may negotiate all the many legal obstacles that would prevent them from seeing
    the full, unprocessed data elements. It would though be prohibitively complicated
    and unlikely to be granted just to ensure ‘intellectual oversight’. As the only
    person who can view the data, only the professor knows how it’s been stored and
    processed. As Callum Sunderland tells us in the case study, the removing of outlier
    data is not in and of itself an unusual activity. Outliers are pieces of data
    that exist well outside the parameters of the body of data and thus are likely
    to be special cases, the result of incorrect measurement, transcription errors,
    or just general ‘noise’. A simple, straightforward analysis of a set of data that
    includes outliers may result in strange, or completely misleading, conclusions.
    The process of cleaning up a data set is a common part of the necessary curation
    of data.


    However, when this is done subjectively, it leads to a skewing of the results.
    In our case study, we’re told that the definition of an outlier was ‘open to interpretation’.
    The selection criteria for deciding what pieces of data should go into the analysis
    is important – it should be the case that two unrelated researchers can look at
    the raw data, assess it by the selection criteria, and end up with the same subset
    of data at the end (within a certain, usually small, margin of error). Where subjective
    criteria are used, this becomes increasingly unlikely as hundreds of individual
    mini-judgements are made. When one is too close to the data, it’s tempting to
    discard data points that are simply inconvenient. It might be possible to justify
    it to yourself and to others, but the question becomes ‘would you'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'have made the same decision if an equivalent outlier strengthened your theory
    rather than weakened it? It’s clear from what we know of the incident here that
    too much was left open to interpretation.


    As to what ‘bogus data’ means, we don’t yet know. We’ll await further details
    on this before we introduce it into our discussion. All we can really say at this
    point is ‘well, that doesn’t sound good’.


    What of our doctoral students then? They’ve found themselves at the centre of
    a scandal of which they may have had very little knowledge. The relationship between
    a supervisor and their students is one of the most intense that many young people
    experience – in its healthiest forms it’s a deep collaboration, coupled to a mentorship.
    Regular contact and support and guidance can lead to a productive partnership
    and a collegiate relationship that lasts for a career. In the unhealthiest forms,
    students experience distance, disappointment, and a feeling of being ungrounded.
    We know from our case study that there was at least some degree of collaboration,
    because the three of them published papers together in various different combinations.
    The nature of that collaboration however remains unknown for now.


    Their crime in this case appears to have been trusting data that was provided
    to them by their supervisor, and then publishing that data in academic journals
    and conferences. The extent of their guilt in this case is very tightly coupled
    to the extent of their knowledge as to what was happening. It’s unlikely that
    the professor has a blanket authorisation to provide full access to the data sets
    to his students, but we’ll find out for sure as the case study progresses. However,
    there are certain things that we might reasonably expect in the circumstances.
    The students had been publishing papers with the professor – that’s very valuable
    for young researchers looking to ‘make their bones’ in the cutthroat and competitive
    world of academia. Nobody is likely to be very interested in what they have to
    say about the topic, but Blackbriar is a different matter. If they publish along
    with Blackbriar, their names get associated with his work. If someone searches
    for Blackbriar’s research, they’ll likely find our postgraduates coming up in
    the search. After all, we know from the previous article that Blackbriar has tens
    of thousands of citations – that’s a lot, enough to put him in the upper echelons
    of his discipline. Such associations help tremendously in giving a new researcher
    a leg-up and a start on building their own reputation.


    This comes at a cost though – the expectation is that everyone whose name goes
    on a paper has signed off on the contents. As such, everyone'
