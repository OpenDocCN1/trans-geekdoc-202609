  md: '(Lee, 2007), deindividuation (Williams & Guerra, 2007), and simple weight of
    numbers. These elements come together without engineering but can also be corralled
    and directed as a specific unit of highly tailored harassment (Heron et al., 2014).


    In 2023, it was estimated that Twitter had an active user base of around 200m
    daily users, with 450m being active on a monthly basis. That may have dipped somewhat
    as the platform rebranded itself, mystifying many, to X. With such numbers even
    if we consider a particular event to be a ‘million to one’ occurrence, it’s still
    happening over 200 times a day. The sheer mass of activity on Twitter is its own
    system for amplification, and often not in positive directions. A study in 2016
    (Hewitt et al., 2016) suggested that messages that could be legitimately defined
    as misogynistic came in at a rate of 6.6 abusive tweets per minute. The pattern
    of abuse too is not uniform, and overwhelmingly directed at particular target
    demographics. With the mass of aggression and unpleasantness online, expecting
    it to be a fertile ground for reasonable exploration of a nuanced situation is
    optimistic at best.


    As a personal anecdote, one of the authors of this book was once branded as ‘ableist
    and misogynist’ by a Facebook user for giving prominence to issues of colour blindness
    on a website devoted to the accessibility of tabletop games. Social media removes
    the friction that exists in real-world interactions and permits both a kind of
    ‘drive by’ system of aggression and removes almost all of the social context that
    would moderate face-to-face discussions. Such a comment in the real world would
    be possible to discuss and dissect and would likely be delivered in a way less
    likely to instantly create friction. We are all more circumspect in our opinions
    when there are real-world social consequences that are linked to their expression.
    However, the nature of Facebook permits for such perceived ‘truth bombs’ to be
    dropped into a public space, detonated, and then for the source of the antagonism
    to disappear behind a shield of blocking and muting that prevents follow-up and
    meaningful discussion.


    Many platforms permit for injudicious comments to be deleted or edited. That doesn’t
    allow for commentators to undo the damage they may have done to themselves by
    interjecting an opinion into a fraught discussion space. Tweets and status updates
    may be screenshotted, and online services exist that archive tweets as they are
    made so that the fact of their removal or editing can be given undue prominence.
    Sometimes the act of recanting, or clarifying, will do little more than add fuel
    to a burning fire.'
