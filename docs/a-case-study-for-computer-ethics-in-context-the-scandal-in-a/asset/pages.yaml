  img_proc: true
- pgno: 269
  md: 'rejection than acceptance. CHI 2023, one of the most prominent conferences
    in human-computer interaction, had a 27.6% acceptance rate. In some recent years
    that has been as low as 20%. Nature, one of the most prominent journals for the
    natural sciences, has an 8% acceptance rate. Many other journals will hover around
    the 30% mark. Again – most of what people hear upon submitting a journal or conference
    paper is ‘no’. We hear ‘no’ when applying for jobs, where supply as we have discussed
    massively exceeds demands. Most of our ‘scholarly’ activities are done to a backdrop
    of rejection.


    The perceived value that we give to the world then is in many ways correlated
    with just how hard other things were rejected. Publishing at CHI is more prestigious,
    in the field, than publishing in a local conference. How could it not be, when
    your paper survived a gauntlet that crushed so many others? The truth, as it often
    is, is more complex than that. Many conferences/journals are defined by their
    ‘impact factor’, which is to say the average number of papers that cite its papers
    in a year. If a conference has an impact factor of ten, it means on average each
    paper at the conference gets ten citations. That’s a lot. You’d think impact factor
    correlates tightly with rejection rates, but it’s only somewhat true and the effect
    is difficult to observe across disciplines (Bjork & Catani, 2016). In short, while
    there is certainly academic prestige to be gained by publishing in outlets with
    a high rejection rate, it doesn’t seem to effectively translate into actual **scholarly
    impact**. It’s possible to publish in only the best journals and conferences and
    still receive few, if any, citations. The opposite is true too – a successful
    academic career can come from publishing in the outlets that other people actually
    read, as opposed to the places where people are mainly interested in seeing their
    own writing.


    Nonetheless, academics every day fight the stats to get their work out there because
    it’s how the system is described to those trapped within it. And realistically,
    almost everything in life that we associate with merit is the product of a rejection
    economy. This isn’t unique to academia.


    We value bands that make it through the AR process of a label. We provide greater
    cultural cachet to books that are published as opposed to self-hosted fan fiction.
    We value authentic awards over vanity awards. Rejection serves a powerful role
    in curating attention – in its best forms what it does is highlight the best at
    the expense of the worst. However, it is foolish to assume that poor quality is
    the main causative factor associated with rejection. The Beatles were rejected
    by Decca because ‘guitar bands were on the way out’. A Confederacy of Dunces by'
