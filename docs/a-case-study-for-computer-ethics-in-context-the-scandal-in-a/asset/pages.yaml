  md: 'untenable. In many cases, being fired for attempting to unionise is unlawful,
    but managers can often find a legal reason why a troublesome person should be
    made to vacate their job.


    Performance management serves an important and useful role in any organisation.
    It allows for employees and employers to reach a common understanding as to how
    well someone is doing. It allows for alignment of workers to the overall goals
    of the organisation. It can motivate high performance, if the review aligns with
    incentive structures. It can help employees become aware of contributions that
    they themselves would not have claimed. It allows for problems to be identified
    before they become disciplinary issues, and can identify opportunities for employees
    to grow into other roles within the institution. If employed in a 360-degree fashion,
    in which employees also review employers, it can offer chances for meaningful
    dialogue and systemic issues to be addressed on an ongoing basis. It is, inherently,
    not a problematic idea.


    However, the way in which that performance management is carried out often results
    in greater issues. We can likely accept that it is important to measure performance.
    The more difficult – and important – question is – **how**?


    To illustrate why the **how** is such a complicating factor, let’s briefly discuss
    three widely accepted managerial truisms:


    +   1. We value what we measure, because we often can’t measure what we value.

    +   2. When a measure of quality becomes a target, it ceases to measure quality.

    +   3. The standard you walk by is the standard you accept.


    There are lots of things that may be valued in an employee. Adherence to corporate
    culture is a common one – almost every institution will have a vaguely cult-like
    view of ‘who we are as a company’. We may value collegialism, or courtesy amongst
    the workforce. We might feel collaboration is important or we may think competition
    is the best. We might value ‘service’ on committees or as an ambassador within
    the wider culture. Universities increasingly prize ‘impact’, which is to say evidence
    that the work being done within a university has a benefit for the people outside
    academia. Perhaps a company may praise itself based on how well it supports a
    diverse workforce, or that it is especially friendly to families.'
