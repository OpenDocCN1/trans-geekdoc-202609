  md: 'There’s a lot to unpack here. There’s casual sexism in the way they describe
    Sharon McAlpine along with a nod to tokenism – that she might be worth picking
    because she’s a woman rather than the best candidate. There’s ableism and potentially
    legally actionable discrimination in the way James Duncan is portrayed, explicitly
    linking his recruitment to the department’s budget. We can also note the unsubtle
    way in which Dirk Tumblewood is linked to the VC with a ‘haha, don’t upset the
    boss’ comment that could be hand-waved away as a joke. Stan Templemore, in these
    circumstances, perhaps gets off lightly. However, it seems unlikely he’ll relish
    the public exposure of his unremarkability to an online audience of meme authors
    and snarky commentators.


    We also see that McManus was right to prep Blackbriar that the VC would not be
    happy about his nephew being overlooked, especially since the VC is now on record
    as having stated that he was hoping that the chosen appointments wouldn’t work
    out. His lack of participation in either selection or interviewing though gives
    him some deniability with regard to any pressure he may, or may not, have exerted.
    And in any case, he didn’t get his way in the end. Given that these two students
    were suspended though, one could argue a significant conflict of interest is being
    played out here in the aftermath. Undoubtedly that will be a pillar of the legal
    case being brought against the university if the lawyer Karan Chandra gets his
    way.


    And yet, while this situation has very poor optics, it’s also the case that it’s
    compatible in outcome if not in spirit with the expressed goals of almost any
    public body in the modern age. Almost every university will have a gender equality
    and diversity policy that is aimed at normalising the balance in the staff base
    and student body. Given the discussion in the previous section regarding the no-platforming
    of gender-critical and right-leaning scholars, it could be argued in this light
    that the policy directive to create a welcoming and inclusive campus requires
    the prohibition of the expression of certain viewpoints. The conflict here comes
    from the competing goals of creating a space for free intellectual inquiry and
    creating a welcoming home for minority groups. It is not possible to be both at
    the same time regardless of the hopeful perspectives demonstrated by surveys of
