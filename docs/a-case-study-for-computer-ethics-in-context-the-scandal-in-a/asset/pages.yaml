  md: 'the algorithms do not differentiate the sexual from the non-sexual unless explicitly
    designed to do so. Stable Diffusion in particular is a good case study in the
    complexity of interacting systems of ethics – it is an open-source platform, which
    means that its source-code can be forked and the protections against generating
    sexual imagery can be removed. In some versions of the tool, the filter can be
    disabled by changing a single line of code. The prosocial benefits of open source
    here come into collision with the need to protect the rights of individuals. In
    case you were wondering – yes, these tools can be used to edit photographs and
    yes they can be used to replace clothed people with naked people.


    One suspects that the potential for harm associated with deep fakes is something
    the university wants to control as much as possible and to ensure it’s clear that
    they do not endorse or support it. Imagine a speech from the principal in which
    he says, ‘Yes, Blackbriar was right. We screwed him over. And we’ll do it again!’.
    A combination of algorithms that control lip syncing, face transplants, and audio
    transformation could be employed to create additional levels of misinformation
    in an already complicated situation. The university can’t stop it happening, but
    it can certainly put rules in place that discourage people from doing it with
    the university’s own resources.


