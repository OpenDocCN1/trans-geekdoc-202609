    # ETHICS, MORALS, AND LAWS


    Let’s begin our exploration of this case study by reaffirming our philosophy –
    you won’t agree with everything that we say in this book. That’s good – it’s healthy,
    and readers should not fight their instinct to pick fault with the arguments put
    forward here. This is not a case study concerned with right versus wrong, or good
    versus evil. It’s about the context of ethics, especially those that touch on
    the design and deployment of computers and their software. By design, it’s full
    of grey areas – no significant person escapes the scenario without having at least
    some role in the emerging crisis. It’s also not about finding the right person
    to blame for what happened – everyone is to blame, in their own way. Some are
    more to blame than others, but who falls into that category should be a matter
    of'
