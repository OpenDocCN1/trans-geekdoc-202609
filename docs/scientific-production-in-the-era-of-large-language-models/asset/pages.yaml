- pgno: 1
  md: '# Productivity and publication


    Between January 2022 and July 2024, the number of arXiv preprints published monthly
    once an author had adopted LLMs in their writing increased by 36.2% relative to
    nonadopters (top). Since 2023, for LLM-assisted manuscripts, a greater writing
    complexity of arXiv manuscripts is correlated with a lower probability of being
    published. The relationship is inverted for non–LLM-assisted manuscripts (bottom).


    ![](img/cad18ae6e8c2bc4bc68d6edb15c55d57_1_0.png)


    We show that LLM adoption is associated with a large increase in researchers’
    scientific output in all three preprint repositories. The estimated coefficients
    for arXiv (see the first figure, top), bioRxiv, and SSRN (see fig. S1) are 36.2,
    52.9, and 59.8%, respectively, suggesting that LLM use is associated with sizable
    increases in productivity. Although estimated coefficients vary by the detection
    method and threshold used to identify LLM adoption, sensitivity analyses (see
    SM S5.3 to S5.6) demonstrate that a positive association is robust across analytical
    choices.


    A productivity jump may stem from the use of Gen AI across multiple research tasks,
    including idea generation, literature discovery, coding, data collection, or analysis.
    But to date, LLMs likely have had the largest impact in writing. To create distinctive
    scientific works, researchers must present compelling written arguments; link
    a manuscript’s arguments, methods, and results to prior literature; detail and
    contextualize the most important findings; and articulate what can be learned
    from the text. These complex writing tasks are time consuming, particularly for
    researchers who are communicating in a non-native language. We therefore ask whether
    the productivity impact of LLM adoption varies across authors’ native-language
    proficiencies.


    Because most high-impact research is published in English-language journals and
    proceedings, native speakers have had a substantial advantage in scientific communication.
    LLMs can mitigate disparities in English fluency, which should asymmetrically
    reduce the cost of writing across scientists’ linguistic backgrounds.


    To test for heterogeneity in productivity changes, we approximated the likelihood
    that an author is a native English speaker based on names and the institutions
    with which they are affiliated (see SM S2.5 to S2.6). Coefficients were broken
    out by researchers’ ethnicities and home geographies (see fig. S2). The effects
    remain statistically significant across all groups, but scholars with Asian names
    experienced the greatest productivity boost from LLM adoption. In bioRxiv and
    SSRN, effects were even more pronounced for scholars with Asian names and institutional
    affiliations in Asia, with bioRxiv showing a statistically significant additional
    productivity gain for Asian-named scholars in Asian institutions (relative to
    those in US, UK, Canadian, and Australian institutions). For Asian-named scholars
    affiliated with Asian institutions, the estimated LLM-related productivity gain
    ranged from a low of 43.0% in arXiv to 89.3% for bioRxiv and 88.9% for SSRN. Researchers
    with Caucasian names affiliated with institutions in English-speaking countries
    experienced more modest but still significant productivity gains of 23.7% (arXiv)
    to 46.2% (SSRN).


    We conclude that even the use of previous-generation LLMs—those available to scholars
    at the time the manuscripts in our dataset were drafted—are associated with productivity
    gains, particularly for researchers facing higher costs of writing. These findings
    concur with work showing that LLMs mitigate the impact of skill disparities, in
    this case, by reducing the cost of writing in a second language (8). Given considerable
    advances in the writing ability of present-generation LLMs and the more widespread
    availability of these systems, the productivity effects that we estimated are
    likely substantial enough to imply a shift in the market share of scientific production
    toward scholars in non-native English–speaking geographies.


    # LLM USE, SCIENTIFIC WRITING, AND PUBLICATION OUTCOMES


    LLMs are likely to reshape science production beyond productivity effects. High-quality
    writing is often construed as a signal of scientific merit (9). Papers with clear
    but complex language are perceived to be stronger and are cited more frequently.
    Because scientific advances are the product of years of knowledge refinement,
    the ability to precisely articulate scientific discoveries is a (very imperfect)
    proxy for the care taken during a scientific team’s work. The fact that LLMs can
    almost effortlessly produce polished, professional text describing any scientific
    topic raises an important question: Does LLM use reveal or conceal the quality
    of the underlying research?


    To assess this question, we investigated how writing complexity relates to research
    quality and whether LLM adoption changes the signaling power of writing complexity
    in scientific communication. We gauged writing complexity with the additive inverse
    of the Flesch Reading Ease score (see SM S2.7). This measure quantifies text complexity
    as a composite of average sentence length and syllables per word, with higher
    scores indicating more complex text. As a proxy for quality, we then created a
    binary outcome defined as publication in a peer-reviewed journal or conference
    by the end of our observation window (June 2024) for all preprints since 2023
    (see SM S2.8 and S5.9).


    When we correlated the additive inverse of the Flesch score with publication outcomes,
    three patterns emerged. First, writing-complexity scores in LLM-assisted manuscripts
    were significantly higher compared with papers written in natural language in
    all three archives (P < 0.001, all repositories, two-tailed t test) (see fig.
    S3, A to C). This underscores the remarkable capability of LLMs to produce complex
    scientific writing (7). Second, in non-LLM-assisted papers'
