    人工智能


    ## 大型语言模型时代的科学产出


    随着生产过程迅速演变，科学政策必须考虑机构如何演进


    Keigo Kusumegi¹, Xinyu Yang¹, Paul Ginsparg¹, Mathijs de Vaan², Toby Stuart²,
    Yian Yin¹


    尽管人们对生成式人工智能（Gen AI）在所有学术学科中的快速采用既兴奋又担忧，但经验证据仍然零散，对大型语言模型（LLMs）在各科学领域影响的系统性理解有限。我们分析了来自三个主要预印本库的大规模数据，以表明使用
    LLMs 加速了手稿产出，降低了非英语母语者的障碍，并使先前文献的发现多样化。然而，随着科学工作量的上升，传统的科学质量信号，如语言复杂性，正变得不可靠的价值指标。随着人工智能系统的进步，它们将挑战我们关于研究质量、学术交流以及智力劳动本质的基本假设。科学政策制定者必须考虑如何使我们的科学机构演进，以适应快速变化的科学生产过程。


    > ...LLM 采用与研究人员科学产出的大幅增加相关...


    科学事业与技术创新密切相关。例如，显微镜、计算技术的进步以及下一代测序仪推动了研究的边界。研究人员已在许多具体的科学背景下证明了人工智能的价值（1，2），例如蛋白质结构预测和材料发现。大型语言模型的最新进展使其在自然科学（3）和社会科学（4）中的广泛任务中得到应用。这项工作突出了
    LLMs 在特定科学任务中的巨大潜力，提出了一个开放性问题：LLMs 对科学事业的宏观层面的影响是什么？


    为了解决这个问题，我们收集了来自三个预印本库的大规模数据[涵盖 2018 年 1 月至 2024 年 6 月，详见补充材料（SM）S1.1 至 S1.3]：arXiv（1.2
    million preprints），包括数学、物理、计算机科学、电气工程、定量生物学、统计学和经济学；bioRxiv（221,000 preprints），涵盖生物学和生命科学的广泛子领域；以及
    Social Science Research Network（SSRN; 676,000 preprints），一个托管社会科学、法律和人文学科手稿的工作论文库。每个数据集在其领域内代表最大规模。总体而言，它们为检验
    LLMs 对众多科学领域科学生产力实践的部分影响提供了前所未有的经验证据基础。


    为了识别 LLMs 在科学手稿创作中的使用，我们对数据中的所有摘要应用了基于文本的 AI 检测算法（5）。我们使用了 2023 年之前提交的论文的摘要——ChatGPT
    时代之前——来估计人类撰写文本的 token（word）分布。然后我们提示 OpenAI 的 GPT-3.5turbo0125 模型重写这些摘要，生成 LLM
    撰写文本的 token 分布，并进行比较。这使我们能够量化 LLM 辅助写作与人类写作之间词分布的差异，并识别 ChatGPT 发布后可能由 LLM 辅助撰写的摘要。有关模型训练、验证、潜在局限性以及
    LLM 检测的替代方法的进一步细节已提供（见 SM S2.1、S4 和 S5）。


    ### LLM 使用与科学生产力


    我们预测采用 LLMs 的作者将经历生产力提升（6，7）。为了将 LLMs 的一般生产力效应与人工智能研究快速增长区分开来，我们首先从样本中排除核心 AI
    子学科的手稿（见 SM S1.1 和 S5.7）。然后我们将作者首次采用 LLMs 识别为第一个表现出 LLM 辅助统计特征（α）的手稿（m_i）所标记，使得
    α(m_i) > τ，其中 τ 为检测阈值。作者的采用状态在首次检测使用后的任何月份从 0 变为 1。基于这一衡量标准，我们在作者层面固定效应事件模型中（见
    SM S3.1）检查了采用前和采用后 LLM 采用者与相似非采用者之间手稿提交率的变化（见 SM S2.2 至 S2.4）。


    ### 生产力与发表


    2022 年 1 月至 2024 年 7 月之间，一旦作者在其写作中采用了 LLMs，arXiv 预印本的月度发表数量相对于非采用者增加了 36.2%（上图）。自
    2023 年以来，对于 LLM 辅助的手稿，arXiv 手稿的写作复杂性越高，被发表的概率越低。非 LLM 辅助手稿的关系则相反（下图）。


    ![](img/cad18ae6e8c2bc4bc68d6edb15c55d57_1_0.png)


    我们表明，LLM 采用与三个预印本库中研究人员科学产出的大幅增加相关。arXiv（见第一图，上图）、bioRxiv 和 SSRN（见 fig. S1）的估计系数分别为
    36.2、52.9 和 59.8%，表明 LLM 使用与生产力的显著提升相关。尽管估计系数因用于识别 LLM 采用的检测方法和阈值而异，但敏感性分析（见 SM
    S5.3 至 S5.6）表明，正相关在分析选择中是稳健的。


    生产力跃升可能源于 Gen AI 在多个研究任务中的使用，包括创意生成、文献发现、编码、数据收集或分析。但迄今为止，LLMs 可能在写作方面产生了最大影响。为了创造独特的科学作品，研究人员必须提出有说服力的书面论点；将手稿的论点、方法与结果与先前文献联系起来；详细说明并
    contextualize 最重要的发现；并阐明可以从文本中学到什么。这些复杂的写作任务耗时，尤其对于使用非母语进行交流的研究人员而言。因此我们询问 LLM
    采用的生产力影响是否因作者的母语熟练程度而异。因为大多数高影响力研究发表在英语期刊和会议论文集中，母语使用者在科学交流中具有显著优势。LLMs 可以缓解英语流利度的差异，这应不对称地降低科学家语言背景的写作成本。


    为了检验生产力变化的异质性，我们根据作者姓名及其所属机构近似估计作者为英语母语者的可能性（见 SM S2.5 至 S2.6）。系数按研究人员的种族和居住地理位置细分（见
    fig. S2）。效应在所有组中均保持统计显著，但亚裔姓名的学者从 LLM 采用中获得了最大的生产力提升。在 bioRxiv 和 SSRN 中，对于具有亚裔姓名且机构隶属于亚洲的学者，效应更为明显，其中
    bioRxiv 显示亚裔机构的亚裔姓名学者（相对于美国、英国、加拿大和澳大利亚机构的学者）具有统计显著的额外生产力增益。对于隶属于亚洲机构的亚裔姓名学者，估计的与
    LLM 相关的生产力增益从 arXiv 的 43.0% 低到 bioRxiv 的 89.3% 和 SSRN 的 88.9%。隶属于英语国家机构的白人姓名研究人员经历了更为适中但仍显著的生产力增益，从
    23.7%（arXiv）到 46.2%（SSRN）。


