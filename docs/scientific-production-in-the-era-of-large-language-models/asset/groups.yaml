    # ARTIFICIAL INTELLIGENCE


    # Scientific production in the era of large language models


    With the production process rapidly evolving, science policy must consider how
    institutions could evolve


    Keigo Kusumegi¹, Xinyu Yang¹, Paul Ginsparg¹, Mathijs de Vaan², Toby Stuart²,
    Yian Yin¹


    Despite growing excitement (and concern) about the fast adoption of generative
    artificial intelligence (Gen AI) across all academic disciplines, empirical evidence
    remains fragmented, and systematic understanding of the impact of large language
    models (LLMs) across scientific domains is limited. We analyzed large-scale data
    from three major preprint repositories to show that the use of LLMs accelerates
    manuscript output, reduces barriers for non-native English speakers, and diversifies
    the discovery of prior literatures. However, traditional signals of scientific
    quality such as language complexity are becoming unreliable indicators of merit,
    just as we are experiencing an upswing in the quantity of scientific work. As
    AI systems advance, they will challenge our fundamental assumptions about research
    quality, scholarly communication, and the nature of intellectual labor. Science
    policy-makers must consider how to evolve our scientific institutions to accommodate
    the rapidly changing scientific production process.


    > ...LLM adoption is associated with a large increase in researchers’ scientific
    output...


    (SSRN; 676,000 preprints), a working-paper repository that hosts manuscripts in
    the social sciences, law, and the humanities. Each of the three datasets represents
    the largest within its domain. Collectively, they offer an unprecedented empirical
    basis to examine some of the impacts of LLMs on scientific productivity practices
    across many scientific fields.


    To identify the use of LLMs in the creation of scientific manuscripts, we applied
    a text-based AI detection algorithm (5) to all abstracts in our data. We used
    abstracts from papers submitted prior to 2023—before the ChatGPT era—to estimate
    the token (word) distribution of human-written text. We then prompted OpenAI’s
    GPT-3.5turbo0125 model to rewrite these abstracts, generated the token distribution
    of LLM-written text, and compared the two. This allowed us to quantify differences
    in word distributions between LLM-assisted and human writing and identify probable
    LLM-assisted abstracts written after the release of ChatGPT. Further details on
    model training, validation, potential limitations, and alternative methods of
    LLM detection are provided (see SM S2.1, S4, and S5).


    The scientific enterprise is intimately connected with technological innovation.
    The microscope, advances in computing, and next-generation sequencers, for example,
    shifted the frontier of research. Researchers have demonstrated the value of AI
    in many specific scientific contexts (1, 2), such as protein-structure prediction
    and materials discovery. Recent advancements in LLMs have expanded their use across
    a wide range of tasks in the natural (3) and social sciences (4). This work highlights
    the incredible potential of LLMs across specific scientific undertakings, raising
    an open question: What is the macro-level impact of LLMs on the scientific enterprise?


    To address this question, we collected large-scale data from three preprint repositories
    [spanning January 2018 to June 2024, see supplementary materials (SM) S1.1 to
    S1.3 for details]: arXiv (1.2 million preprints), which includes mathematics,
    physics, computer science, electrical engineering, quantitative biology, statistics,
    and economics; bioRxiv (221,000 preprints), which spans a wide range of subfields
    in biology and the life sciences; and Social Science Research Network


    # LLM USAGE AND SCIENTIFIC PRODUCTIVITY


    We predicted that authors who adopted LLMs would experience increased productivity
    (6, 7). To isolate the general productivity effects of LLMs from rapid growth
    in research on AI, we first exclude manuscripts in core AI subdisciplines (see
    SM S1.1 and S5.7) from our sample. We then identified an author’s initial adoption
    of LLMs as marked by the first manuscript (m_i) that exhibited statistical signatures
    of LLM assistance (α), such that α(m_i) > τ, where τ is the detection threshold.
    An author’s adoption status changes from 0 to 1 for any months occurring after
    the first detected use. Based on this measure, we examined the change in manuscript
    submission rates between LLM adopters and similar non-adopters (see SM S2.2 to
    S2.4) before and after adoption in author-level fixed-effects event models (see
    SM S3.1).'
