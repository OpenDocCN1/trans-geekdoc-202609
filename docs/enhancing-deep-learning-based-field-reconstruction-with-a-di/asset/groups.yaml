    # 通过可微学习框架增强基于深度学习的场重构


    接收于：2024年10月1日


    作者列表及其单位出现在文章末尾


    接收于：2025年5月21日


    在线发表：2025年7月22日


    从稀疏传感器实现复杂高维场的精确重构仍然是一个长期面临的挑战。通常，重构性能主要受限于模型和布局。稀疏且昂贵的传感器布局限制了信息的质量，导致了极其艰巨（此处原文为formidable，意为严峻）重构任务。尽管基于深度学习的模型已取得进展，但它们通常缺乏协同优化神经网络参数与低维传感器布局的能力，这进一步增加了巨大的复杂性。在此，我们提出了一种通用的双层可微学习框架，该框架能够有效将模型与传感器布局优化（DSPO）集成，实现布局的搜索和精确的全局场重构。在该框架内，模型通过一个可微算子进行补充，以实现布局的可微性。基于梯度的优化器通过动态更新布局来赋予模型能力。采用交替优化策略来高效求解联合优化问题。我们在各种场景（包括周期性和循环性物理场、规则和不规则网格数据集，以及噪声和无标记观测）中展示了DSPO在基准模型上的效率和通用性。结果表明，DSPO显著提高了模型的重构精度和相对于基准模型的鲁棒性，性能与先进水平相当。我们的框架为神经网络和布局优化技术在现实世界中的应用提供了一种新的通用范式。


    - 检查更新


    来自有限观测的空间场重构为复杂高维系统的状态估计¹和控制设计²带来了巨大挑战。由于成本高昂，传感器对高度非线性现象的覆盖通常极稀疏，导致了严峻的重构任务。尽管传统的数值方法使用偏微分方程对现象进行建模，但重构问题是病态的且难以在数值上求解。随着近期深度学习的进展，基于神经网络（NN）的策略提供了有帮助的进展，并成为从离线数据学习以数据驱动的方式重构全局场的主要范式⁵。在多种重构技术³⁴⁶中已研究了各种架构。某些研究使用卷积神经网络（CNN）学习观测值与高维场之间的端到端布局，但这些技术仅分类高度非结构化的数据²。将机器学习感知（MLP）与CNN集成¹可以处理结构化数据，但它们往往难以处理反复和非线性的特征¹。另一种使用图卷积网络（GCN）的方法在处理循环和非结构化数据方面显示出前景³，但通常受到计算成本和需求的限制⁴，GCN在捕捉大规模图方面的效率有限。此外，当场相对较新时，大多数研究集中在傅里叶读取方法，以在傅里叶域中捕捉全局密度，为复杂高维问题提供了潜在解决方案。一种基于沃罗诺单元划分（Voronoi
    tessellation）的CNN方法解决了任意形状的局限性。然而，正如Veins提到的，跨空间移动传感器难以通过更少的传感器实现更好的预测²。尽管如此，光照、更新频率和传感器密度等要求仍然挑战，限制了它们的准确性。


