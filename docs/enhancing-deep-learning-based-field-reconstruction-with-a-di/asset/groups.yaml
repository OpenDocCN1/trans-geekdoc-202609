    2）。


    最后，执行正向和反向过程，直到目标函数不再改进或达到传感器的最大迭代次数 $N^{max}$。该框架赋予模型可微放置优化能力以处理。更新步骤由如下给出：


    一旦训练了神经网络模型，就可以使用输入观测值来预测新场。将估计的系数 $\hat{a}_i$ 代入 $u_i = \sum_j \hat{a}_{ij} \phi_j$，即可从
    POD 模的线性组合中解 $u$。


    CNN 已经成为一种强大的替代方案，能够高效地从稀疏观测中重构高维数据。上述方法在规则网格上存在局限性。因此，CNN 也被用于 Voronoi 嵌入以处理非结构化数据。随后，另一种方法将
    MLP 与 CNN 结合。由于使用了 MLP，我们使用基于 MLP 的编码器将输入特征转换为全局场表示。高维表示可以通过 MLP 和 $l+1$ 个卷积层获取，然后转换为卷积层。卷积层通过滤波操作提取输入数据的特征：


    ```

    $H^{(l+1)} = \sigma(W^{(l)}A^{(l)}H^{(l)})$

    ```


    其中 $A$ 是邻接矩阵，$I$ 是单位矩阵，$D$ 是 $A$ 的度矩阵。该层捕捉了更新和聚合邻居特征的特征，导致了网络中直接和间接的连接。


    ```

    $X^{(l)}_i = \sigma \left( \sum_{j \in \mathcal{N}(i)} \frac{1}{\sqrt{d_j}} W^{(l)}
    X^{(l-1)}_j + b^{(l)} \right)$

    ```


    其中 $X^{(l)}$ 和 $Y^{(l)}$ 是第 $l$ 层的输入和输出，$W$ 表示大小为 $H \times d$ 的滤波器，$b$ 表示偏置；$\sigma$
    表示非线性激活函数。


    FNO 是成功的深度学习架构之一，可以在无限维空间上学习无关架构。利用里叶变换，我们令 $\mathcal{I} \mapsto \mathcal{O}$
    为 FNO 以学习映射。


    F-SCNN 采用了编码器-解码器架构。空间编码器 $E_s$ 首先将位置 $x$ 映射到特征，基于注意力的编码器将特征映射到潜空间 $Z$。然后，基于注意力的解码器从查询位置
    $x$ 重构。该过程可以表述为：


    ```

    $Z = E_s(\mathbf{s}), \\ \mathbf{u} = D_s(Z, x)$

    ```


    编码器由 MLP 和多个注意力块组成，解码器由 MLP 和多个交叉注意力层组成。每个块都是包含查询、键和值的多头注意力层，用于学习映射 $\mathcal{S}
    \mapsto \mathbf{u}$。Senser 用于重构复杂场。更多细节见参考文献 22。


    核算子编码器通过里叶变换和反里叶变换处理输入。这里 $R$ 是里叶卷积的参数。解码器使用反里叶变换处理场。通过训练数据，我们利用 CNN 学习映射 $\mathcal{S}
    \mapsto \mathbf{u}$。GCNN 重构的概念流程见补充图 I-4。


    所有数据集包括层宽、湍流通道、流入冲刷、达西流、平板层表面温度，这些可以通过 Zenodo 获取（https://doi.org/10.5281/zenodo.3253970）（45）。源数据随论文提供。


    # 代码可用性


    代码已存档于 https://doi.org/10.5281/zenodo.2529285 (46)，并通过 codeCode 在 https://doi.org/10.24443/CC-0434598v2
    获取。


