    为了解决这些问题，我们提出了一种通用的双层框架，将重构模型与传感器布局（SPO）集成用于全局场重构。算子被引入双层框架中而没有引入任何额外参数。使用基于梯度的双层优化来训练和测试模型。我们的框架有三个主要贡献：(1)
    我们引入了一个基于SPO的联合重构与布局框架。(2) 通过交替优化不同的变量（块和布局），设计了交替优化策略以有效解决重构质量与传感器数量之间的权衡。(3)
    引入了微分算子来处理全局场相对于布局的不可微性。这使得端到端的双层框架能够根据全局观测值及其导数动态优化传感器布局，从而有效处理规则和不规则的场密度。该框架可以作为一个通用范式，为各种应用提供高度的通用性和灵活性。这项工作是首次在各种场景（包括周期性和循环性场、规则和不规则网格）中使用基于神经网络模型的系统性研究。全文中，我们通过将其应用于各种场景，证明了所提框架的有效性。


    传感器布局优化（SPO）的目标是放置传感器，以最大化用于重构的信息（目标函数），这是重构模型中最大的困难之一。大多数SPO策略具有基于减少传感器数量或最优性的各种标准⁵。其他策略使用通过QB限制传感器数量的方法确定基于MLP模型的传感器布局。另一些⁷使用增强的聚类算法优化传感器布局，并使用线性算子重构模型。每个标准都通过传感器布局模型训练与重构质量和误差差异相关，这有助于保证基于神经网络模型精度的提升。重构误差的检测也是评估重构效率的主要挑战之一。使用内层优化训练模型需要大量的计算。内层优化中昂贵的迭代可能导致模型收敛缓慢。快速方法可以在较少的迭代内相对收敛。然而，由于两个局限性，基于神经网络的模型对于传感器布局是不可微的。一个局限性是传感器布局的离散性，从索引中选择候选元素，这无法使观测值相对于布局平滑。Marcato等人¹¹⁰在离散搜索空间上提出了双层行走策略，通过双线性插值实现了可微的传感器布局。更大的局限性在于，由于在优化过程中没有传感器布局的高维神经网络参数所需的集合大小、更新频率和优化策略存在差异，传感器布局的覆盖范围和泛化性能受到限制。此外，使用...的双层插值


    # 工作


    重构模型旨在从一系列传感器观测值 $\mathbf{s}$（$\mathbf{x}_i \in \mathcal{X}, i=1,...,n$）捕捉全局场
    $\mathbf{y}$ 的特征，其中n表示高分辨率网格水平/垂直方向的点数，m表示传感器的数量。因此，SPO模型可以表述为双层优化。目标是通过在统一框架内优化模型和布局来增强重构质量。本研究的目标是提出一种通用的双层学习框架，分别高效地优化传感器布局和重构全局场。双层SPO框架定义如下
    (1)：


    $$\boldsymbol{\theta}^* = \arg\min_{\boldsymbol{\theta}} \mathcal{L}_f(\mathbf{y},
    \hat{\mathbf{y}}(\mathbf{s}; \boldsymbol{\theta}))), \text{ where } \boldsymbol{\phi}^*
    = \arg\min_{\boldsymbol{\phi}} \mathcal{L}_s(\boldsymbol{\phi}; \boldsymbol{\theta})$$


    其中 $\theta$ 表示全局场，$\phi$ 表示基于神经网络模型的训练/验证参数，$\mathcal{L}$ 表示评估重构性能的目标函数（标准）。在本工作中，重构误差被视为标准。


