    reverse process dynamically updates placement through a gradient-based optimizer,
    providing new placement for the forward process.


    The forward and reverse processes are executed asynchronously. b. Differentiable
    optimizer obtains the derivatives and activations at arbitrary locations on a
    discrete dataset. c. Validation of the framework with NN-based models. The main
    bodies of its main network networks are shown.


