    + \mu_j \mathbf{x}_j$ (Fig. 1b).


    $\mathbf{v}_i = \sum_{j=1}^M \mathbf{u}''_j s''_j$$


    $\mathcal{L}_0$ and $\mathcal{L}_1$ denote to validate the reconstruction error.
    It is noteworthy that when the model has only observations, the derivative $\nabla_{\mathbf{x}}
