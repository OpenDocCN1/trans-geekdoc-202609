    更广泛地说，我们的框架可以作为高效重构的范式。这种灵活性允许更多样化的场景和探索。此外，其他方法（如基于梯度的优化）可以与我们的框架无缝集成，以提高重构准确性并增强模型的鲁棒性。我们的工作在稀疏感知方面仅触及皮毛，这可以扩展到处理三维体素空间的重构。此外，通过引入流形策略，我们旨在在未来释放流形上重构的潜力。


    重构性能。可微算子设计用于获取任意位置的重构并计算导数。通过我们的方法，学习框架实现了算子相对于放置位置的可微性。这种使用基于梯度的优化技术来执行框架（通过求解方程
    (1) 中的优化任务），通通基于神经网络的模型开辟了新途径，推进了 SOTA（最先进水平）。


    # 方法


    ### 可微学习框架


    根据不同任务，基于神经网络的重构方法分为两类，这些方法或是端到端的（如 MLP 和 FCN），或是基于解码器的。在后者中，解码器表示为 $\mathcal{G}_{\theta}(s_i,
    x_i)$，对于 $\theta, s_i$ 和 $x_i$ 是可微。这里，$x_i$ 代表查询位置，对应我们全局框架中的所有全局坐标。


    # 框架验证


    所提出的框架在六个基于神经网络的模型上进行了验证，包括 MLP、PODN、FCN、GAN 和 SiN。我们总结了方法的概念流程，详细描述如下：


    **MLP。** 一项代表性工作是使用 MLP 进行流体重构，在无须重新处理原始数据的情况下展示了优越的性能特征。遵循相关工作，我们使用基于 MLP 的模型来验证所提出的全局流体重构框架（补充图
    1-C）。MLP 通过几个全连接层提取观测值的关键特征。


    ```

    $u^{(L)}(s) = \sigma(W^{(L)}\sigma(W^{(L-1)}(\dots + W^{(1)}s + b^{(1)})\dots)
    + b^{(L)}); \quad (1)$

    ```


