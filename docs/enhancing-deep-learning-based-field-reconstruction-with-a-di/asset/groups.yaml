    # Work


    The reconstruction model aims to capture the features of the global field $\mathbf{y}$
    from a number of sensor observations $\mathbf{s}$ at $\mathbf{x}_i \in \mathcal{X},
    i=1,...,n$, where n denotes the number of points in the horizontal/vertical direction
    of a high-resolution grid, and m denotes the number of sensors. For, the SPO models
    can be formulated as a bilevel optimization. The objective is to enhance the reconstruction
    quality by optimizing models and placement within a unified framework. The goal
    of this study is to propose a general bilevel learning framework that efficiently
    optimizes sensor placement and reconstructs global fields, namely, respectively.
    A bilevel SPO framework is defined as follows (1):


    $$\boldsymbol{\theta}^* = \arg\min_{\boldsymbol{\theta}} \mathcal{L}_f(\mathbf{y},
    \hat{\mathbf{y}}(\mathbf{s}; \boldsymbol{\theta}))), \text{ where } \boldsymbol{\phi}^*
    = \arg\min_{\boldsymbol{\phi}} \mathcal{L}_s(\boldsymbol{\phi}; \boldsymbol{\theta})$$


    where $\theta$ denotes the global field, $\phi$ denotes the train/validation parameters
    of NN-based models, and the $\mathcal{L}$ denotes the objective function (criterion)
    to evaluate the reconstruction performance. Reconstruction error is considered
    as the criterion in this work.

