    # Enhancing deep learning-based field reconstruction with a differentiable learning
    framework


    Received: 1 October 2024


    A list of authors and their affiliations appears at the end of the paper


    Accepted: 21 May 2025


    Published online: 22 July 2025


    Achieving accurate reconstructions of complex high-dimensional fields from sparse
    sensors remains a long-standing challenge. Frequently, reconstruction performance
    is mainly constrained by models and placement. The placement of sparse and prohibitive
    sensors restricts information quality, resulting in formidable reconstruction
    tasks. Despite deep learning-based models having made strides, they typically
    lack the ability to co-optimize neural network parameters versus low-dimensional
    sensor placement further poses significant difficulties. Here we present a general
    bilevel differentiable learning framework that effectively integrates models with
    sensor placement optimization (DSPO), enabling search for placement and accurate
    global field reconstruction. Within this framework, models are complemented with
    a differentiable operator to achieve the differentiability of placement. A gradient-based
    optimizer empowers models by dynamically updating placement. The alternating optimization
    strategy is adopted to efficiently solve the joint optimization. We demonstrate
    the efficiency and generalizability of the DSPO on baseline models across various
    scenarios, including periodic and cyclic physical fields, regular and irregular
    grid datasets, and noisy and nameless observations. Our results show that the
    DSPO significantly improves the reconstruction accuracy of models and robustness
    against baseline models comparable with the state-of-the-art performance. Our
    framework provides a new general paradigm for the use of neural networks and placement
    optimization techniques for real-world applications.


