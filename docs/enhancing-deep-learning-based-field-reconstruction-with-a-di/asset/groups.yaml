    u_i\}_i$ 由观测值和重构值的对组成。在足够的数据集下，我们的目标是学习一个 CNN 类损失函数 $\mathcal{L}(u, \hat{u}, \theta)$。该
    MLP 的学习过程在数学上表述为：


    **PODN。** 使用 PODN 的降阶模型是一类成熟且广泛使用的流体重构降阶模型技术——它被用于在线预测，以降低高维模拟的计算成本。此外，正交投影分解（POD）模型从一组快照（snapshots）中推导出，并使用神经网络来学习观测值与
    POD 系数之间的映射。


    ```

    $\theta^* \in \arg\min_{\theta} \sum_i ||a_i - a(s_i)||^2; \quad (2)$

    ```


    正向过程基于有限观测值重构全局流场，为当前放置提供最佳模型参数。默认情况下，使用均匀放置作为第一个模型的初始传感器。然后，通过迭代，使用随机自适应放置策略更新位置。


    反向过程最小化传感器位置并为正向过程提供部署。给定最佳模型参数 $\theta^*$ 用于计算梯度信息，即目标函数相对于放置位置 $s$ 的导数。因此，每次迭代
    $\gamma_t$ 执行放置的自动更新。在此过程中，聚合算子计算 $s$ 对于 $x_i$ 的导数，即 $\frac{\partial \mathcal{L}}{\partial
    x_i} = \frac{\partial \mathcal{L}}{\partial s} \frac{\partial s}{\partial x_i}$。


