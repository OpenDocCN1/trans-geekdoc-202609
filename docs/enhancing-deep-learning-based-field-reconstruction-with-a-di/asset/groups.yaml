    Spatial field reconstruction from limited observations provides a substantial
    challenge in state estimation¹ and control design² of complex high-dimensional
    systems. Due to prohibitive costs, sensors generally extremely sparse coverage
    for highly nonlinear phenomena, resulting in formidable reconstruction tasks.
    Although traditional numerical methods model phenomena using partial differential
    equations, the reconstruction problem is ill-posed and struggles to solve numerically.
    With recent advances in deep learning, neural network (NN) based strategies provide
    helpful advances and have become a major paradigm⁵ learn from offline data and
    reconstruct global fields in data-driven manner. Various architectures have been
    extensively investigated in a range of reconstruction techniques³⁴⁶ Some studies
    use a convolutional neural network (CNN) to learn the end-to-end placement between
    observations and high-dimensional fields, but techniques classify highly unstructured
    data². To incorporate the machine perception (MLP) with CNN¹, which handle structured
    data often struggle with erratic and nonlinear features¹. Another approach using
    graph convolutional networks (GCN) has shown promise in processing cyclic and
    unstructured data³, it is often hampered by computational costs and demands⁴ GCN
    has limited efficiency in capturing large-scale graphs. Furthermore, when the
    field is relatively new, most research focuses on the Fourier reader approach
    to capture global densities in the Fourier domain, offering potential solutions
    for complex high-dimensional problems. A CNN-based method using Voronoi tessellation
    addresses the limitations of arbitrary shapes. However, as noted by Veins, a across
    struggle to handle spatially moving sensors, achieving better predictions with
    fewer sensors². Despite these, requirements such as lighting, update frequency,
    and sensor density remain challenges, limiting their accuracy.


