    challenge in state estimation¹ and control design² of complex high-dimensional
    systems. Due to prohibitive costs, sensors generally extremely sparse coverage
    for highly nonlinear phenomena, resulting in formidable reconstruction tasks.
    Although traditional numerical methods model phenomena using partial differential
    equations, the reconstruction problem is ill-posed and struggles to solve


