    from the Eulji University Department of Medical IT, wrote a thesis on data preprocessing
    and hybrid machine learning. He finished the Microsoft Deep Learning (CNTK) course
    and Azure Machine Learning Studio course. He has gone through MIIC (Medical Intelligence
    Information R&D'
