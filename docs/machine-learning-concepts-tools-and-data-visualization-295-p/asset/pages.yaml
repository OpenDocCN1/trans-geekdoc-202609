    ability of artificial intelligence systems to perform successfully in simple situations.
    In all cases, however, when these early systems had to choose from a broader range
    of problems, it became more difficult for them to perform successfully, and they
    revealed their limitations. The reasons for this are as follows.


    +   First, the early artificial intelligence programs only succeeded in simple
    grammatical unification because they had a limited knowledge of the subject. The
    National Research Council in the United States financed the translation of the
    Russian language, but it was difficult to resolve the ambiguity of the language
