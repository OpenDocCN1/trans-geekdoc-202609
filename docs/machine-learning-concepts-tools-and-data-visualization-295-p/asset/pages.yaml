    # 12.3 Visualization for Data Analysis Using Power BI R Script


    Before applying visualizations for data analysis, let''s learn about variables.
    Variables are divided into numerical data and categorical data according to their
    characteristics.


    Numerical data such as length, power, and quantity is represented numerically,
    and category data such as gender and region is represented at predetermined levels.
    Numerical data has numerical values of attributes that are quantitative, and category
    data has levels of attributes that are qualitative.


    Depending on the number of variables, the plot can be different. Unariate data
    is having one variable, and multivariate data means composed of several variables.


    Let''s take advantage of the Power BI R Script function to visualize data analysis
    according to the characteristics of the data.'
