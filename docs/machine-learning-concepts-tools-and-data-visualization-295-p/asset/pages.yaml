    # ## 2.4 Unsupervised Learning


    Unsupervised learning is a way of making a computer learn with unlabeled data
    to discover hidden features or structures in the data. The classification of supervised
    learning described previously is the creation of discriminants for classification
    based on a labeled training data set. These discriminants are later used to predict
    the label of new unknown data. On the other hand, unsupervised learning classifies
    unlabeled data, so its purpose is to group data sets into groups with the same
    characteristics. A representative model of unsupervised learning is clustering.
    A clustering model is that in which the training data does not have a label. In
    a clustering model, how the input data forms a group is important. In other words,
    the function of the clustering model is to analyze the characteristics of the
    data obtained without labels and to group data with similar characteristics. Except
    for the absence of labels, clustering models serve the same purpose as classification
    models of supervised learning. In other words, the clustering model classifies
    data without labels. A comparison of classification and clustering is shown in
