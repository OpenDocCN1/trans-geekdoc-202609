    getting on and off at Gangnam station in the morning rush hours using the statistical
    data of people getting on and off at Line 1–4 (Seoul Metro) provided by the public
    data portal.


    Please access the website address below for the number of passengers getting on
    and off the subway lines 1–4.

    https://www.data.go.kr/dataset/15003169/fileData.do


    This data is of people getting on and off at Gangnam station between Jan. 1. 2016
    to Oct. 31. 2016; the number of rows in the data set is 610, and the attributes
    are different for each provided data set.


    The composition of the data set is shown in Table 9-3.


    | Attribute | Attribute description |

    | --- | --- |

    | Date | The passengers got on and off |

    | Station | The name of the station where passengers got on and off |

    | Line | The line of the station where passengers got on and off |

    | Type | The type of the getting on or off |

    | Discount | The distribution of passengers as general, child of school-going
    age, senior (January-May 2016) |

    | Time | The times passengers got on and off (unit = an hour) |


    Let’s take a look at how important attributes are configured before applying.

    Before applying the data to Azure Machine Learning Studio, preprocessing is needed.
    Since it is a data set provided by a public data portal, it is necessary to change
