    to solve larger or more difficult problems.


    The solution was to use more powerful domain-specific knowledge to make it easier
    to deal with cases that typically occur, and to allow for more significant inference.
    In this respect, in cases where someone is trying to solve a difficult problem,
    there is an eventual realization that they can only solve effectively by applying
    knowledge gleaned from someone who already knows the answer: in other words, by
    using expert knowledge.


    Buchanan’s “DENDRAL” program, announced around this time, is a prime example.


    The DENDRAL project was one of the earliest expert systems, and its primary aims
