    # 1.3 Classification of Artificial Intelligence


    From a philosophical perspective, AI can be divided into strong AI and weak AI.
    Strong artificial intelligence is defined as computer-based artificial intelligence
    that can think and solve problems, while weak artificial intelligence is defined
    as computer-based artificial intelligence that cannot do either of these tasks.


    # 1.3.1 Strong Artificial Intelligence


    The qualities of perception and self-awareness can then be said to specify forms
    of artificial intelligence. There is, therefore, a difference between this form
    and weak artificial intelligence, in that the former can actually think or solve
    problems. It is a form of artificial intelligence in which computer programs can
    act or think in a human-like manner.


    In other words, strong artificial intelligence is not simply a computer, but a
    computer that can think with human intelligence. Much like the machines in the
    movie “Terminator” that caused a war with humans, not only can artificial intelligence
    work on its own without being commanded, it can reject orders it deems to be irrational.
    Thus, there are two forms of AI: human-like AI; which involves computer programs
    behaving like human-like thoughts; and non-human AI, which involves computer programs
    developing perceptions and inferences that are different from humans.


    +   * Artificial General Intelligence (AGI)

    In the term Artificial Intelligence, “General” should be understood as meaning
    “general” rather than ‘normal’. In other words, unlike artificial intelligence
    that can be applied only under specific conditions, Artificial General Intelligence
    refers to artificial intelligence that can be used in all situations.'
