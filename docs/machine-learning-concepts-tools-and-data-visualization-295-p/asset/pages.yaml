    This is an example of a typical Monte Carlo method, using Monte Carlo to calculate
    the value of the circumference. Monte Carlo Tree Search is an algorithm designed
    to select a good course of action without needlessly searching for all possible
    states by applying the Monte Carlo technique to the behavior tree search using
    the aforementioned minimax algorithm.


    Let’s look at the most basic form of MCTS, and how MCTS uses randomness to construct
    a tree.


    The Monte Carlo Tree Search Diagram is shown in Figure 4-4. There are four basic
    steps in MCTS.


    +   - Selection: From the root to the Leaf Node by picking the most successful
    child node among the other nodes. In general, to avoid searching on only one side,
    MCTS is calibrated in such a way as give options randomly.

    - Expansion: If a leaf node is reached, and it is not the final node at the end
    of the game, create a child node for the next step, choose one of the child nodes
    among them, and move.

    - Simulation: Proceed with playing the game by performing random simulations in
    the current state. This is called playout, and one progresses through the game
    until the outcome of the game is decided (for example, whether you win or lose).'
