  md: '# Chapter 4


    # Case Study


    # 4.1 AlphaGo


    AlphaGo is an artificial intelligence Go program developed by Google’s DeepMind
    Technologies Limited.


    In October 2015, AlphaGo won all five times against Fan Hui of France, the three-time
    winner of the European Go Championships, becoming the first computer to beat a
    professional Go player without a handicap. In March 2016, it beat Lee Sedol in
    a five-game match, the first time a computer program has beaten a professional
    without a handicap. Although it lost to Lee Sedol in the fourth game, Lee resigned
    in the final game, giving a final score of 4 games to 1 in favor of AlphaGo. AlphaGo
    was awarded an honorary 9-day by the Korea Baduk Association. In addition, since
    it is registered as a guest competition held in Korea, it may participate in competitions
    in Korea at some point, although this is unlikely. Figure 4-1 shows the AlphaGo
    system that was used.


    Go is considered more difficult for computers to win than other games such as
    chess, because its much larger branching factor makes it prohibitively difficult
    to use traditional AI methods such as alpha–pruning, tree traversal and heuristic
    search.


    However, while data and computational power were essential to AlphaGo’s victory,
    algorithms for AI learning were the more decisive factor. The key was to reduce
    the number of cases, of which there originally were close to infinity. As such,
    AlphaGo was designed to allow trained DNN (Deep Neural Networks) to make the most
    advantageous choices through Monte Carlo Tree Search (MCTS). The system’s neural
    networks were initially bootstrapped from human gameplay expertise. AlphaGo was
    initially trained to mimic human play by attempting to match the moves of expert
    players from recorded historical games, using a database of around 30 million
    movements. By applying this technology, AlphaGo could beat humans at Go.'
