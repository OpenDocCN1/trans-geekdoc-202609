    # 9.2 Classify News Article Category


    This example uses the 2004 Reuters data set to classify categories. In addition,
    we will compare the application of the One-vs-All Classifier based on the Multiclass
    Decision Forest and the Two-class Decision Forest. The parameters of the algorithm
    were applied by default. This example is taken from Microsoft’s AI Gallery. For
    more information and for details on importing projects, access the links below.


    https://gallery.courainelligence.com/Experiment/Multiclass-Classification-News-categorization-2


    There are about 23,000 training data sets and over 781,000 test data sets. The
    existing data set has 103 categories, which belong to the following four categories.


    +   - Corporate-Industrial (CCAT)

    - Government and Social (GCAT)

    - Economics and Economic Indicators (ECAT)

    - Securities and Commodities Trading and Market (MCAT)


    The four values are used as labels.'
