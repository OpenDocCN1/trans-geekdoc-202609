- pgno: 25
  md: '# The Proposal states


    We propose a 2-month, 10-man study of artificial intelligence be carried out during
    the summer of 1956 at Dartmouth College in Hanover, New Hampshire. The study is
    to proceed on the basis of the conjecture that every aspect of learning or any
    other feature of intelligence can be precisely described that a machine can be
    made to simulate it. An attempt will be to find how machines use language, formal
    abstractions and concepts, solve problems now reserved for humans, and improve
