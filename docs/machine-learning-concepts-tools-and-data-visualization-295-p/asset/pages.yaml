  md: '# About the Author


    Prof. Min-soo Kang


    Professor Min-soo Kang, who is in the Department of Medical IT at Eulji University,
    serves as the Director of the Computing Center at the Eulji University Medical
    Center and the Editor-in-Chief of the Korean Artificial Intelligence Association.
    He is working on machine learning in the medical field with the Division of Rheumatology,
    Division of Laboratory Medicine at Eulji University Hospital. Professor Kang received
    a Ph.D. from the Department of Control and Instrumentation Engineering at Kwangwo
    University and is currently studying IoT and artificial intelligence. He is an
    adjunct professor at Hanyang University and a professor of Information and Communication
    Engineering at Hanyang Cyber University. He has also served as the RFID/USN Program
    Director in the Ministry of Knowledge Economy, which conducts the planning and
    evaluation of national R&D projects. His book publications are Getting Started
    with Machine Learning using Microsoft Azure Machine Learning, RFID Basics (a textbook
    approved by the Superintendent of Education in Seoul), Digital Circuit Design
    using VHDL, and RFID GL Qualification Test (Nationally Authorized) and so on.


    Assistant Research Engineer Eun-soo Choi


