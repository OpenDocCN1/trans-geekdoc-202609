  md: '# # Chapter 11


    # # Visualization with Power BI


    # ## 11.1 Introduction of Power BI


    In addition to successfully building predictive models, it is also important to
    visualize the results well. Even a model that shows good performance predictions
    may not convey unless the results are easily explained. Data visualization helps
    data scientists easily explain the results of predictive models to stakeholders
    or end users. Power BI, a business analytics solution, lets you visualize data,
    insights with your organization, or import data into apps or websites.


    # ## 11.2 Download and log in to Power BI Desktop


    Log in to Power BI, users need a work or school email address. Personal e-mail
    accounts as Gmail or Hotmail cannot be used. Go to https://powerbi.microsoft.com/en-us/
    to download Power BI Desktop.


    Click “START FREE”, as shown in Figure 11-1 to proceed with the download.


    Click the “DOWNLOAD FREE” button in Figure 11-2 to run the given MSI installation
    file. If you want to install a different language, or 32-bit or 64-bit version
    of the program, click on “ADVANCED DOWNLOAD OPTIONS” to get the installation file.


    Fill out the form shown in Figure 11-3 to create an ID and log in. If you already
    have a Microsoft account, click the “Sign in” button below to log in.


    Log in by entering your Microsoft account in the pop-up, as shown in Figure 11-4.


    Figure 11-5 shows a successful log.'
