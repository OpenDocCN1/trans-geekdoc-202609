    # 3.1.1 Perceptron


    The origin of the neural network can be traced to the perceptron proposed by Frank
    Rosenblatt in 1958. The concept behind the perceptron is that each input is weighted
    for n inputs, and one output is produced. This is how neurons transmit information
    as electrical signals. That is, for a model of supervised learning using labeled
    training data, the training data adjusts the weight of each input until the predicted
    value is equal to the actual result corresponding to the characteristic value.
    When a neuron receives an input signal, it transmits the signal using the dendrites
    and axons, and the perceptron weights the input. Figure 3-4 shows the concept
    of the perceptron.


    ![](img/3c3c87d78136583581b0cf0620f5ae66_55_0.png)


    Figure 3-4 The concept of the perceptron'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The difference between (a) and (b) of Figure 3-4 is that in (b), a weight is
    assigned to each of the n input signals. The perceptron outputs 1 when the sum
    of the signals after the calculation exceeds the threshold, 0 or -1 otherwise.


    Since the weights divide the boundaries of the thresholds, the weights serve as
    parameters for how much the inputs will affect the outputs. As such, this can
    be classified as a linear classification model it distinguishes cases in which
    a value is within the threshold and cases in which it is not, and therefore it
    can also be regarded as a form of supervised learning.


    In other words, the input values or neurons are entered into a net input function,
    weighted, and made into a single value. A net input function is defined as a function
    that combines the weighted inputs and outputs ''1'' if the result is greater than
    the threshold, or otherwise outputs ''-1'' (Figure 3-4). The perceptron marks
    the beginning of artificial neural networks, but with all beginnings, the perceptron
    began show limitations in solving very simple XOR models. Therefore, the multilayer
    perceptron would emerge.


    # 3.1.2 Multilayer Perceptron


    The multilayer perceptron was introduced so that the disadvantages of the perceptron
    could be overcome. The perceptron was unable to learn something as XOR, but with
    the multilayer perceptron, the solution would prove to be surprisingly simple.
    A multilayer perceptron has several layers, not just one. Therefore, it has many
    intermediate layers called hidden layers, and the more hidden layers there are,
    the greater the improvement in classification power. Figure 3-5 shows the concept
    of multilayer perceptrons.


    The introduction of multiple perceptrons solved the problem, but as the number
    of hidden layers increased, the weight also increased, and this learning became
    difficult. To solve this problem, the backpropagation method, similar to the feedback
    control theory of control theory, was applied to enable multilayer perceptron
    learning.


    In the field of deep learning, continuous research was conducted with these various
    methodologies, and new artificial neural networks appeared as the old control
    theory-based learning methods were re-examined. The Boltzmann machine³, an unsupervised
    learning method, was proposed and attracted the attention of the academic world.'
