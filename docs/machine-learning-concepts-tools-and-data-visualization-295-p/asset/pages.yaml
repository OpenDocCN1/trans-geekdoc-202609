    to classify. The k stands for the number of clusters.


    After the number of clusters to classify is determined, the initial centroid of
    each cluster is initialized. The centroid used in the k-means algorithm is a hypothetical
    group representing a cluster, and each learning data point becomes the reference
    point for determining the cluster to which it belongs. The initial centroid is
    set arbitrarily, and as learning progresses, it moves to the optimal center for
    each cluster. Figure 2-10 shows the procedure for performing the K-means algorithm.


    Finding the optimal centroid is the key to the k-means algorithm. The concept
    of finding the optimal centroid is very intuitive and simple. That is, after the
    distance of all data to k initial centroids are calculated, being determined arbitrarily,
    the nearest centroid is considered as the cluster to which it belongs. Once k
    clusters are determined, the average of the coordinate values of the training
    data to each cluster is obtained and set as the new centroid. The distance from
    all the training data to the k newly defined centroids is calculated, and the
    nearest centroid to each data point is defined as the cluster to which the data
    point belongs. These steps are repeated and repeated until the cluster members
    no longer change. The k-means algorithm is expressed as follows:


    +   1. After determining the number of clusters (k = n), n centroids are set randomly.

    2. The distance from all the data points respectively to n centroids is calculated
    and the nearest centroid to each data point is set as the cluster centroid to
    that data point belongs.

    3. The average of the coordinate values of the training data is calculated for
    each cluster and then set as the new centroid.'
