    # 7.2.1 Integrating the Web Service with the R Language


    The R Studio program can be downloaded from the R Language official site, https://www.r-project.org/.
    The libraries used are bitops, RCURL, and rjson, can be downloaded from R in Library
    Manager. To use the web service in R, Primary Key and Request-Respond values are
    required.


    If you write and run the above code, you can see the prediction result from the
    model created in Azure Machine Studio, as shown in Figure 7-24. You can use this
    to make your program more flexible.


    ```

    source <- source("C:\Users\optim\Desktop\azureWebService.R")

    [i]<-"Result"

    $Results

    $ResultsOutput

    $ResultsOutput[[i[1]]]

    $ResultsOutput[[i[1]]$<-"Scored Labels"

    [i]<-$SCORE


    $ResultsOutput[[i[1]]$<-"Scored Probabilities"

    [i]<-"0.003552b37111928*"

    ```


