    # ##2.6 Considerations for Performing Machine Learning


    It is important to consider the problems of underfitting and overfitting in analysis
    using machine learning. Underfitting means that the model is simple, so it cannot
    adequately explain the input data and is thus less predictive. Whether the model
    is underfitted or not can be judged according to the cost, which is the error
    between the model''s predicted value and its actual value. Model selection and
    the obtainment of additional training data may compensate, to some extent, in
    the case of underfitting. Overfitting is a case in which the model is too closely
    fitted to the training data. As shown in the figure below, the predictive power
    of the model is very high in training data, but when it is applied to actual field
    or test data, the result is that the predictive power is greatly reduced. The
    fundamental reason for overfitting is that major machine learning algorithms build
    models in an inductive manner. If you are analyzing using the machine learning
    method, you will have to go through a series of model validation procedures, keeping
    in mind that such overfitting problems can occur at any time.'
