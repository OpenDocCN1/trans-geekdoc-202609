    +   Galton data

    Galton (1886) presented these data in a table, showing a cross-tabulation of 928
    adult children born to 205 fathers and mothers, and their midparental height.
    We visually smoothed the bivariate frequency distribution and showed that the
    contours formed concentric and similar ellipses, thus setting the stage for correlation,
    regression, and the bivariate normal distribution. A data frame was created with
    928 observations on the following 2 variables:


