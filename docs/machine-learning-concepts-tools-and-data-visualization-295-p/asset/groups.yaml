    # (1) Linear Regression


    Figure 2-6 shows an example of linear regression. Linear regression is a regression
    technique that models the linear correlation of the dependent variable y with
    one or more independent variables (or explanatory variables) x.


    ![](img/3c3c87d78136583581b0cf0620f5ae66_41_0.png)


    For example, a company’s sales can be expressed through the independent variables
    of employee age, education and career. The dependent and independent variables
    must always be quantified. Linear regression analysis, which is used in statistics
    and data mining, is classified as a supervised learning model for learning with
    data sets in the field of machine learning. In statistics, data x is called an
    independent variable, and data y is called a dependent variable, while in machine
    learning, data x is called a characteristic, and data y is called a label. The
    process of obtaining arbitrary coefficients from these datasets is called regression
    estimation in statistics and learning in machine learning. After the training
    the predictive value for the new input data is predicted by the linear prediction
    model.


    # (2) Logistic Regression


    Figure 2-7 shows an example of logistic regression. Dependent variables of linear
    regression are generally used when they have a continuous normal distribution.
    If the dependent variable is expressed as categorical (yes/no, pass/fail, buy/nonpurchase),
    logistic regression is used. This is called the binary logistic regression model
    when the dependent variables fall into two categories.'
