    \ Dataset1\n\nmaml.mapOutputPort(\"data.set\")\n```\n\n使用图 8-14 中的可视化验证应用到 R 脚本的结果是完好的的。\n\
    你可以如图 8-15 所示看到结果没有问题。R Studio 和 Azure Machine Studio 的结果相同吗？\n\n132 机器学习：概念、工具与数据可视化\n\
