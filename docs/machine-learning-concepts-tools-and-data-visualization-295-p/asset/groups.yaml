    # Part I


    # Artificial Intelligence


    This page intentionally left blank


    # Chapter 1


    # Summary of Artificial Intelligence


    # 1.1 Definition of Artificial Intelligence


    Artificial intelligence has several definitions, including “machine-made intelligence”
    and “an artificial embodiment of some or all of the intellectual abilities possessed
    by humans.


    The various definitions of artificial intelligence can be summarized as follows:
    “machines equipped with human intelligence capable of understanding human judgment,
    behavior, and cognition”. Intelligence is said to be “the ability to apply prior
    knowledge and experience to achieve challenging new tasks.” This, ultimately,
    can be referred to human intellectual ability. This ability can be used to respond
    flexibly to a variety of situations and problems and is also related to learning
    ability.


    Learning ability is the ability to acquire skills or information that is difficult
    for others to learn, to learn the same content faster or more extensively. While
    intelligence itself is different from what an individual has learned, academic
    achievement, intellectual thinking and behavior depend on prior knowledge; so,
    intelligence can be changed through experience and learning.


    Therefore, intelligence generally starts with, and is defined as, “the ability
    to solve problems.” We need a high level of intelligence to solve various problems.
    For example, when you play chess, you will use information acquired from a variety
    of texts, numerous chess games, and the Internet to make predictions and then
    act accordingly. These behaviors are highly demanding of human intelligence and
    thought emerges as a result of this intelligence-based learning. Scientific explanations
    of “thought”, broadly define it as “consciousness”, comprehensively identifying
    it as “experience” of an object. Experience is also knowledge of a process, by
    which a person, who has had experience in a field, may learn in order to gain
    a reputation as an expert. Thus, intelligence is the recognition, analysis, and
    understanding of the thoughts that human beings may have, while


    Machine Learning: Concepts, Tools and Data Visualization


    that which is produced artificially is termed artificial intelligence. To create
    a machine that thinks like a human, it is necessary to study human thoughts and
    behaviors, including listening, speaking, seeing, and acting. It may seem easy,
    but for a computer to have the ability to listen, speak or act based on what it
    has heard or seen is a very difficult task, and so it would be to emulate what
    humans think.


    So, as a scientific approach, human-like thoughts and actions are required. To
    put this into practice, like a child learns experientially by thinking and acting
    on their own, there is a need for the study and investigation of processes of
    repeated learning and experimentation. Prof. Kathleen McKeon distinguishes four
    categories of human thought and behavior.


    - *Systems that think like humans*

    This is a cognitive modeling approach used with a system that is capable of human-like
    thinking and decision-making as defined by Hodgeland in 1985 and Bellman in 1978.
    Haugel (1985) described this approach as “the exciting new effort to make computers
    think...machines with minds, in the full and literal sense”, and Bellman (1978)
    described it as “the automation of activities that we associate with human thinking,
    activities such as decision-making, problem solving, learning”. The aim of this
    approach is to create a computer model based on artificial intelligence which
    can mimic human thought through actual experiments.


    - *Systems that think rationally*

    This is a law-of-thought approach to thinking used with a system with mental abilities
    such as perception, reasoning, and behavior which are based on a calculation model,
    as defined by Charniak and McDermott in 1985 and Winston in 1992. There are two
    main obstacles to this approach. First, it is not easy to inform knowledge and
    state it in the formal terms required by logical notation, particularly when one
    is less than 100% of the knowledge being handled in this way. Second, there is
    a big difference between being able to solve a problem “in principle” and so in
    practice. Charniak and McDermott (1985) have studied the simulation of mental
    faculties using computational models, and Winston (1992) have made a study of
    the computations that make it possible to perceive, reason, and act. The key to
    this approach is to format non-formatted items that they can be handled by the
    machine’s logical system, which can then draw its own conclusions as to what should
    be done. In this way, the human thought process can be programmed into a computer.


    - *Systems that act like humans*

    This is a Turing test approach, defined by Kurzweil in 1990 and Rich and Knight
    in 1991, featuring a system that allows the machine to mimic any action that requires


    Summary of Artificial Intelligence 5


    human intelligence. Alan Turing’s proposed test in 1950 is a method for determining
    whether a machine has intelligence based on how similarly it behaves when communicating
    with an actual human. That, to pass the Turing test, the machine must achieve
    the same level of performance as a human, the human believes it is a human. Kurzweil
    (1990) calls this “the art of creating machines that perform functions that require
    intelligence when performed by people”, while Rich and Knight (1991) calls it
    “the study of how to make computers do at which, now, people are better”.


    - *Systems that act rationally*

    This is a rational agent featuring a system that acts intelligently via a calculation
    model, as defined by Schalkoff in 1990 and Luger and Stubblefield in 1993. An
    agent is something that not just “programs,” but are unique in they operate under
    autonomous control, perceive the environment, survive for a long time, adapt to
    change, and mimic the goals of other agents. Schalkoff (1990), quoted in Pool
    et al. (1998) places this approach within “a field of study that seeks to explain
    and emulate intelligent behavior in terms of computational processes” while Luger
    and Stubblefield (1993), quoted in Nilsson (1998) places it within the “branch
    of computer science that is concerned with the automation of intelligence”. A
    rational agent is one that acts to get the best results, or in cases of uncertainty,
    the best-expected results. Artificial Intelligence, as a form of rational agent
    design, therefore, because correct inference is only a useful mechanism for achieving
    rationality, and not a necessary one. In conclusion, artificial intelligence is
    a technological or scientific field that studies the methodology or feasibility
    of producing intelligence by implementing machine-made human cognition, reasoning,
    and learning into computers or systems.


    # 1.2 History of Artificial Intelligence


    # 1.2.1 The Beginning of Artificial Intelligence


    The birth of artificial intelligence began in 1943 when Warren McCulloch and Walter
    Pitts began studying artificial intelligence. Their study of AI was prompted by
    three sources: knowledge of physiology and neuronal function in the brain; formal
    analysis of propositional logic according to Russell and Whitehead; and Turing’s
    Theory of Computation.

