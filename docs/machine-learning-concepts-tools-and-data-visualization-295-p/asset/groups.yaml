    # 2.3 Supervised Learning


    Supervised Learning is a learning model that takes a set of labeled training data
    and creates a discriminant that analyses the data using various algorithms and
    then uses the algorithms discovered on a new data set to produce results.


    Supervised learning is divided into regression and classification. Since both
    classification and regression are supervised models, they have in the common fact
    that they learn from labeled input data. The difference between classification
    and regression results in a fixed value, whereas regression means the resulting
    value can be any value within the range of the data set.


    That is, the resultant value of the classification is one of the labels included
    in the training dataset, and the resultant value of the regression is any value
    calculated by a function expression (regression formula) determined by the training
    dataset. Figure 2-3 compares classification and regression.


    More specifically, the classification model is designed to find the group to which
    the newly inputted data belongs after being trained on a data set in which


