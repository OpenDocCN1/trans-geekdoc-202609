    \nFigure 8-6 Data output result using R Script\n\n### 8.1.2 Implement Decision\
    \ Tree using R Script\n\nBefore applying the decision tree using R Script, let's\
    \ look at the iris data set as example data. Iris data is provided by the statistician\
    \ Fisher and summarizes the lengths of the sepal and petal for the three species\
    \ of iris, Setosa, Versicolor, and Virginica, as shown in Figure 8-7. Iris data\
    \ is easy to understand and is often used for machine learning due to the small\
    \ amount of data in the data set.\n\nTable 8-1 shows the description of the iris\
    \ dataset. More information on the iris dataset can be found at the link https://archive.ics.uci.edu/ml/datasets/iris.\n\
    \nBefore creating the model, import the iris data, as shown in Figure 8-8. Iris\
    \ data is also provided as sample data in Azure Machine Learning Studio.\n\n128\
    \ Machine Learning: Concepts, Tools and Data Visualization\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_144_0.png)\n\
    \nIris Versicolor\n\nIris Setosa\n\nIris Virginica\n\nFigure 8-7 Iris dataset\n\
    \n## Table 8-1 Iris data explanation\n\n| Column name | Mean | Data Type |\n|\
    \ --- | --- | --- |\n| Species | One of three species of iris, Setosa, Versicolor.\
    \ | String |\n| Sepal.Width | Iris’s sepal width | Number |\n| Sepal.Length |\
    \ Iris’s sepal length | Number |\n| Petal.Width | Iris’s petal width | Number\
    \ |\n| Petal.Length | Iris’s petal length | Number |\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_144_1.png)\n\
    \nFigure 8-8 Importing data\n\nCreating a Prediction model using Microsoft Azure\
    \ Machine Learning Script\n\nAfter inserting the data set, place the data imported\
    \ from the palette onto the canvas, as shown in Figure 8-9. Place a “Select Columns\
    \ in Dataset” block to define the columns apply the algorithm. After placing it\
    \ as shown in Figure 8-10, click “Column Selector”.\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_145_0.png)\n\
    \n![](img/3c3c87d78136583581b0cf0620f5ae66_145_1.png)\n\n130 Machine Learning:\
    \ Concepts, Tools and Data Visualization\n\nSelect all the columns to apply the\
    \ algorithm, as shown in Figure 8-11.\nPlace the “Execute R Script” block, as\
    \ shown in Figure 8-12, and click the small square in the R Script Properties\
    \ at the top to modify the R script.\nEnter the code at the bottom of the R Script\
    \ window, as shown in Figure 8-13.\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_146_0.png)\n\
    \nFigure 8-11 Select Columns for algorithm\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_146_1.png)\n\
    \nFigure 8-12 R Script modification\n\n131 Creating a Prediction Model using Microsoft\
    \ Azure Machine Learning Script Integration\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_147_0.png)\n\
    \nFigure 8-13 R Script editing\n\n# Source (rpart)\n\n```\nlibrary(rpart)\nDataset1\
    \ <- maml.mapInputPort(1)\nirisData <- rpart(Species~Sepal.Length + Sepal.Width\
    \ + Petal.Length + Petal.Width, method=\"class\",\ndata=Dataset1)\n\nprint(irisData)\n\
    plot(irisData)\nsummary(irisData)\n\nplot(irisData, uniform=TRUE, margin=0.1,\
    \ compress=TRUE, main=\"Classification Tree\")\ntext(irisData, use.n=TRUE, all=TRUE,\
    \ cex=0.8, pretty=1)\ndata.set = Dataset1\n\nmaml.mapOutputPort(\"data.set\")\n\
    ```\n\nUse the visualization in Figure 8-14 to verify that the results applied\
    \ to the R script are intact.\nYou can see that there are no problems with the\
    \ result, as shown in Figure 8-15. Are the results from R Studio and Azure Machine\
    \ Studio the same?\n\n132 Machine Learning: Concepts, Tools and Data Visualization\n\
    \n![](img/3c3c87d78136583581b0cf0620f5ae66_148_0.png)\n\nFigure 8-14 Visualization\
    \ of decision tree result\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_148_1.png)\n\
    \nFigure 8-15 Decision tree result using R Script (Azure Machine Studio)\n\nAs\
    \ you can see in Figure 8-16, the same result has been applied to R Studio. Figure\
    \ 8-17 shows the visualization of the decision tree applied to the iris data.\
    \ Three species of irises can be seen classified according to the criteria.\n\n\
    133 Creating a Prediction model using Microsoft Azure Machine Learning Script\
    \ Integration\n\nClassification tree:\nrpart(formula = Species ~ Sepal.Length\
    \ + Sepal.Width + Petal.Length + \nPetal.Width, data = irisData, method = \"class\"\
    )\n\nVariables actually used in tree construction:\n[1] Petal.Length.Petal.Width\n\
