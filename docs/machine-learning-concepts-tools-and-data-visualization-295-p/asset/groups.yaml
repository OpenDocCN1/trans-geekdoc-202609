    ### 12.3 使用 Power BI R 脚本进行数据分析的可视化


    在应用数据分析可视化之前，让我们学习学习变量。根据特征，变量分为数值型数据和分类数据。


    长度、功率和数量等数值数据以数值形式表示，性别和区域等分类数据则以预设的级别表示。数值数据具有定量的属性数值值，而分类数据具有定性的属性级别。


    根据变量的数量，图表可能会不同。单变量数据包含一个变量，多变量数据意味着由几个变量组成。


    让我们利用 Power BI R 脚本功能，根据数据特征对数据分析进行可视化。


    ### 12.3.1 数值单变量图


    在“获取数据”菜单中查找插入数据的额外支持，如图 12-6 所示。


