    # Chapter 10


    # Visualization


    # 10.1 Definition of Visualization


    In Wikipedia, Visualization is defined as “any technique for creating images,
    diagrams, or animations to communicate a message”. The most important point in
    data visualization is the communication of a message. This message is the information
    gleaned through data visualization. Especially in this age, data visualization
    is attracting a great deal of attention. There are many reasons for this, but
    the fact that the visual function is the most powerful information receptor among
    the human sensory organs, and that the response information receives depends on
    how it is transmitted the the most significant.


    # 10.2 Purpose and Function of Data Visualization


    # 10.2.1 Purpose of Data Visualization


    +   (1) Data analysis

    While visualization is often used to convey messages, it can be used function-ally.
    For example, you can visualize in a certain way to easily check if there is outlier
    data. In addition, you may draw a Q-Q plot to see if the numerical data follow
    a normal distribution.


    +   (2) Share data analysis results

    Visualization methods should be used to share data analysis results as much as
    possible to easily convey the meaning of the data to others, or to communicate
    the processed information from the data.'
  - '[PAGE 222]


    In general, points, lines, legends, titles, and units can be added. In this way,
    additional information can be expressed so that errors are avoided when plots
    are interpreted. This also helps the viewer to identify information more quickly.


    # 10.2.2 Function of Data Visualization


    +   (1) Communication

    Communication is a function that delivers information in data quickly and easily,
    which is possible through visualization. You can maximize the function of communication
    by making a plot with the user in mind.


    +   (2) Discovery

    Discovery is about presenting information to identify new facts. In other words,
    it is not information that one already knows, but information that delivers new
    facts from unknown data. In particular, it is a function frequently used in research
    fields.


    +   (3) Insight

    Insight is the expression of information in order to gain a better understanding
    in cases where information may be hidden, or already known.'
