    图 2-7 逻辑回归示例


    逻辑回归与线性回归分析不同，它可以被视为一种排序技术，因为因变量是分类的，且输入数据被划分为特定的类别。此时，智能体（agent）进行学习以最大化其奖励。


    ### 2.3.3 强化学习


    强化学习是一种包含在动态环境中收集数据的算法。它可以被认为与人类通过试错学习某些情况的方法最相似的算法。智能体通过观察环境状态并据此采取适当行动从环境中获得奖励。


    图 2-8 显示了智能体执行的一系列过程，当智能体重复“观察-动作-奖励”交互时，这些过程共同导致了智能体从环境中获得的奖励最大化。智能体经历的“观察-动作-奖励”过程也被称为经验。许多领域的研究推动了强化学习，其中行为心理学和控制理论的影响最大。


    行为心理学中的“试错”是人类和动物学习的原则，已应用于机器学习。智能体通过记住所有动作的奖励和惩罚来学习做出最佳决策。另一个对强化学习产生重大影响的研究领域是最优控制。


    最优控制是一种于 20 世纪 50 年代末的理论，涉及设计一种能够优化动态系统效率的控制设备。动态系统优化问题用于对随时间演的每个过程做出最优决策。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_43_0.png)


    图 2-8 强化学习类型


    美国数学家理查德·贝尔曼（Richard Bellman）通过引入马尔可夫决策过程（MDP）模型解决了离散时间问题。强化学习被用于对顺序事件做出决策，因为它是在随着事件的展开通过反馈来完成。


    一些人认为，基于试错的学习过程与人类学习的方式非常相似，因此是人工智能的最佳模型。强化学习模型在游戏和机器人领域应用得最有效。在机器学习方面，强化学习可以被视为使用基于控制的方法的监督学习，而不是具有数学基础，但它有时被认为是无监督学习。


    ## 2.4 无监督学习


    无监督学习是一种让计算机通过无标签数据进行学习，以发现数据中隐藏特征或结构的方法。之前描述的监督学习分类是基于标记训练数据集创建分类的判别器。这些判别器随后用于预测新未知数据的标签。相反，无监督学习对无标签数据进行分类，因此其目的是将数据集分成具有相同特征的组。无监督学习的一个代表性模型是聚类（clustering）。聚类模型是训练数据没有标签的模型。在聚类模型中，输入数据如何形成一个组至关重要。换句话说，聚类模型的功能是分析在没有标签的情况下获得的数据特征，并将具有相似特征的数据进行分组。除了缺少标签外，聚类模型与监督学习的分类模型具有相同的目的。换句话说，聚类模型对无标签数据进行分类。图
    2-9 显示了分类与聚类的比较。


    > * MDP是一种随机过程，如果只给定当前状态，系统的未来将取决于过去的历史。它是当给定的某些 S（状态）、A（动作）时，继续处于当前状态（从第一个状态到当前状态）的概率。


    | 分类 | 聚类 |

    |---|---|

    | 相似点 | 主要关注点是输入数据如何形成一个组 |

    | 区别 | 有标记数据 | 无标签数据 |

    | | 例：分类患者组 | 例：分类消费者类型 |


    ![](img/3c3c87d78136583581b0cf0620f5ae66_44_0.png)


    图 2-9 分类模型与聚类模型


    从聚类算法的角度来看，聚类模型分为两大类。第一类是划分聚类技术，第二类是层级聚类。k-means、k-medoids 和 DBSCAN 是划分聚类的代表。


    层级聚类通过凝聚聚类（agglomerative clustering）和分裂聚类（divisive clustering）来区分。聚类模型应用于许多领域。例如，区分人声和噪声以提高通话质量是无标签数据聚类的一个良好示例。在医学临床试验中，聚类模型可区分
    DRG（疾病相关组）或 HG（住院医生组），还可以用于营销领域的客户细分。


    最近，它被用于营销领域的市场和客户细分，而在 Facebook 等社交网络服务中，它被用于为兴趣相似的用户创建社区。Google 使用聚类模型将相同主题的新闻归类到同一类别。


    ### (I) K-means 聚类


    K-means 算法是一种将给定数据分为 k 个簇的算法。它是最简单的无监督学习算法之一。它对无标签数据分组是为了最小化每个簇之间距离差的方差。在使用 K-means
