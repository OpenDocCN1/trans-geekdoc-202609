    # (2) SVM


    In machine learning, SVM (Support-Vector Machines) are supervised learning models
    with associated learning algorithms that analyze data used for classification
    and regression analysis. Originally developed for binary classification, they
    are now widely applied to artificial intelligence. The reason for the popularity
    of SVM is that it provides the optimal hyperplane to solve problems in classification,
    so that the amount of data to be learned is easy to interpret, and also minimizes
    the empirical risk based on SRM (Structural Risk Minimization). The hyperplane
    is one dimension lower than the surrounding space. In three-dimensional space,
    hyperplanes are two-dimensional planes, and in the case of two-dimensional separation,
    hyperplanes are one-dimensional lines. The boundary is separated by a line, as
    shown in Figure 2-5 (a). In this way, the two-dimensional plane containing a mixture
    of black and white balls is divided into two parts, one containing the black balls,
    and one containing the white ones. Figure 2-5 (b) clarifies the border between
    the squares and the circles and gives the maximum to the border.


    The hyperplane in Figure 2-5 is a line for classifying data. The support vector
    and the margin are used to find the optimal hyperplane to separate the two classes.
    There are two ways to obtain a hyperplane, the Hard Margin method and the Soft
    Margin method. The Hard Margin method is a very strict method of separating two
    groups, which is difficult to use when there is noise. The Soft Margin method
    uses a little slack on the boundary where the Support Vector is located.


    Ultimately, in Figure 2-5, the final goal of SVM in Figure 2-5 is to find a split
    straight line that separates the two groups. The researcher should ensure that
    the hyperplane separates the two groups, but should position the hyperplane so
    that the two groups are as far apart as possible with the hyperplane in between.
    This is'
