    # Book Reviews


    Cisco Systems Korea, Vice President, Sin Ui Cho


    The history of machine learning is short but well-organized and explains Microsoft’s
    approach to the Microsoft Azure Machine Learning Studio program. Even people who
    don''t know a programming language can easily program if they are interested in
    machine learning. In Part 2, an example program is written step by step with Microsoft
    Machine Learning Studio. This example can be followed by the reader in order to
    get results. In addition, it is expected that the use of real data will be helpful
    to researchers in data science and analytics.


    Microsoft Korea IoT Solution Architect, Executive Managing Director, Geon Bok
    Lee


    While many books already explain AI, it was hard to find a book that is appropriate
    for developers in the age of AI’s democratization. This book provides a systematic
    approach to making AI easy for developers who do not have a deep knowledge of
    AI statistics. Reading this book is the best way to gain the vivid experience
    and know-how of a professional who has worked with Microsoft for years.


    LGU+, Senior Vice President/Enterprise Sales Group2, Sunguly Park,

    “Starting Machine Learning using Microsoft Azure Machine Learning Studio” begins
    with a history of artificial intelligence and proceeds to summarize the current
    state of knowledge in machine learning. It teaches the beginner in artificial
    intelligence how to write artificial intelligence programs and organize data,
    even if he or she does not possess the mathematical knowledge needed. The part
    about the visualization of data teaches the reader how to present their data analysis
    in a way that is easy to understand.'
