    # 机器学习：概念、工具与数据可视化


    分类模型根据所使用的算法可分为若干类。其中，K最近邻、支持向量机和决策树模型是最典型的模型。


    ## (1) K-NN 模型


    用于分类的 K-NN（K-最近邻）模型是机器学习模型中最直观、简单的模型之一。K-NN 是一种用于分类和回归的非参数方法。在这两种情况下，输入都包含特征空间中最最近的
    k 个训练示例。输出取决于 K-NN 是用于分类还是回归：在 K-NN 分类中，输出是类别成员身份。对象通过其多个邻居进行分类，将该对象分配给其 k 个最近邻居中最常见的类（通常是一个较小的正整数）。如果
    k=1，则该对象被简单地分配给唯一最近邻居所属的类。在 K-NN 回归中，输出是对象的属性值。该值是 k 个最近邻居值的平均值。K-NN 是一种基于实例（或懒惰学习），其函数仅在局部进行近似，所有的计算都推迟到分类时。这是因为计算机没有预先学习，而是在内存中保留学习所需的数据，然后在出现实例时才开始进行泛化。


    K-NN 是一种使用标记数据进行分类的算法。


    为了这一目的，对标记学习数据的特征进行量化，然后在坐标空间中表示。虚拟圆围绕新的数据点周围扩展，寻找附近的数据点进行比较。当找到距离新数据点最近的数据点时，该最近数据点所属的组（标签）即为新数据点所属的组（当
    k=1 时）。同样，虚拟圆不断扩大直到找到更多附近的数据点。然后，新数据点被归类为包含最多附近数据点的组。图 2-4 显示了 K-NN 算法的分类过程。


    在 K-NN 中，K 寻找与 K 数量相邻数据以识别新数据所属的组。但在选择 K 之前，必须选择距离度量。因此，接近性的概念应该基于一个标准，这被定义为欧几得距离。在定义欧几得距离时，必须考虑单位。与坐标相关的单位必须是距离，但其他单位也可以代表内存和权重等。此外，坐标中的距离可能会随着单位而变化。因此，在定义
    K-NN 算法时，针对数据选择的单位至关重要。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_39_0.png)


    图 2-4 K-NN 算法的分类过程


    ## (2) SVM


    在机器学习中，SVM（支持向量机）是监督学习模型，其相关的学习算法用于分析用于分类和回归分析的数据。它们最初是为二分类开发的，现在广泛应用于人工智能领域。SVM
    受欢迎的原因是它提供了解决分类问题的最优超平面，使得需要学习的数据量易于解释，并且基于 SRM（结构风险最小化）最小化了经验风险。超平面比周围空间的维度低一维。在三维空间中，超平面是二维平面；在二维分离的情况下，超平面是一维的直线。边界由一条线隔开，如图
    2-5 (a) 所示。通过这种方式，包含黑白球混合的二维平面被划分为两个部分，一部分包含黑球，另一部分包含白球。图 2-5 (b) 阐明了正方形和圆形之间的边界，并赋予边界最大值。


    图 2-5 中的超平面是用于分类数据的直线。支持向量和间隔（margin）用于寻找分离两个类的最优超平面。获取超平面有两种方法：硬边界（Hard Margin）方法和软边界（Soft
    Margin）方法。硬边界方法是一种非常严格的分组方法，在存在噪声时很难使用。软边界方法在支持向量所在的边界上允许少量的松弛（slack）。


    最终，在图 2-5 中，SVM 的最终目标是找到一条分离两个组的分割直线。研究人员应确保超平面分离了两组，但应该合理放置超平面的位置，使得两组在超平面之间尽可能远离。这是因为


    ![](img/3c3c87d78136583581b0cf0620f5ae66_40_0.png)


    因为两组之间的距离越远，确定任何新数据所属的组就越可靠。


    ## (3) 决策树


    因其树状的结构而命名，决策树分析数据点并将它们之间存在的模式以预测规则组合的形式呈现。它是统计学、数据挖掘和机器学习中常用的一种预测建模方法。


    决策树也可用于分类和回归。当你想找出数据属于哪一组时，就会使用决策树。它们通过将数据点划分为若干组具有特定特征的组并寻找每个组的特征来工作。它可以用于寻找可以预测未来事件的规则。


    ## 2.3.2 回归


    回归分析是一系列估计变量间关系的统计过程。回归推断“函数关系”，该关系决定了哪种函数生成了给定数据。今天，由于在经济学、医学和工程等多个领域的应用，回归是最常使用的统计模型。


    回归被用于表达假设，也被用作机器学习监督学习中的预测模型。例如，诸如“如果你吃得很多，就会胖”或“如果车速很快，事故发生的概率就很高”之类的陈述，当输入程度很高时，输出程度也会很高。


    ### (1) 线性回归


    图 2-6 显示了线性回归的一个示例。线性回归是一种回归技术，用于对因变量 $y$ 与一个或多个自变量（或解释变量）$x$ 之间的线性相关性建模。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_41_0.png)


    例如，公司的销售可以通过员工年龄、教育和职业等自变量来表示。因变量和自变量必须始终量化。用于统计学和数据挖掘的线性回归分析被归类为机器学习领域中基于数据集的监督学习模型。在统计学中，数据
    $x$ 称为自变量，$y$ 称为因变量；而在机器学习中，数据 $x$ 称为特征，$y$ 称为标签。从这些数据获取任意系数在统计中称为回归估计，在机器学习中称为学习。训练后，通过线性预测模型预测新输入数据的预测值。


    ### (2) 逻辑回归


    图 2-7 显示了逻辑回归的一个示例。线性回归的因变量通常用于具有连续正态分布的情况。如果因变量表示为分类（如是/否、通过/不通过、买/不买），则使用逻辑回归。当因变量分为两类时，这被称为二分类逻辑回归模型。


