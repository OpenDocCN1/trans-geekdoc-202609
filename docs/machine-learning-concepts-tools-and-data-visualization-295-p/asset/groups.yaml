    # 提案内容


    我们提议在1956年夏天于新罕布什尔州汉诺威的达特茅学院进行一项为期2个月、10人的人工智能研究。该研究基于以下假设进行：学习的每一个方面或智能的任何其他特征都可以被精确描述，使得机器可以对其模拟。将尝试寻找机器如何使用语言、形式抽象和概念来解决目前仅限人类处理的问题，并自我完善。我们认为，如果一组经过仔细挑选的科学家共同工作整个夏天，可以在这些问题中的一个或多个上取得重大进展。


    该提案讨论了计算机、自然语言处理、神经网络、计算理论、抽象和创造力。虽然 AI 在达特茅研讨会之后并没有产生显著结果，但研讨会不仅为研究的各个领域提供了直接的机会，还为美国麻省理工学院（MIT）、卡内基·梅隆大学、斯坦福大学和
    IBM 的下一阶段研究奠定了基础。


    # 1.2.2 早期人工智能


    计算机和编程工具开发的下一个阶段特点是原始但基础的计算能力的出现。此时，诺威尔（Nowell）和西蒙（Simon）已成功开发出一种名为“通用问题求解器”（GPS）的系统，该系统可以改变计算中的许多因素，从而减少预期结果与期望结果之间的差异。GPS
    是一个模拟人类解决问题过程的程序，与逻辑理论家（LT）不同。它是一个结合了搜索、目标导向行为和规则应用的推理程序。


    GPS 成为第一个实现人工智能目标的程序——一个可以像人类一样思考的系统。从卡内基·梅隆大学开始，认知科学方法和收敛研究表明人类认知技能最终将与计算机相同，这仍然是今天认知科学的基础。这些方法在生物学、语言学、心理学和计算机科学领域得到了研究。


    宣布人工智能开启马卡西在1958年从达特茅移动到 MIT 时取得了三大关键成就。首先是开发了人工智能编程语言 LISP，它成为了第二古老的编程语言。其次是引入了分时技术（Time
    Sharing），开始解决与计算机使用昂贵相关的问题。当时，使用计算机的费用很高；但分时意味着多个用户可以轮流短时间使用一台计算机。第三，在1958年，马卡西发表了他的第一本书《常常识程序》（Programs
    with Commonsense），这导致了完整的 AI 程序“建议者”（Advice Taker）的发展。该程序包含了知识表示和推理的所有基本原理，并在搜索过程中使用了这些知识来解决问题。


    # 1.2.3 人工智能的停滞


    从一开始，人工智能研究人员就预测了他们领域的成功，赫尔伯·西蒙（Herbert Simon）在1957年宣布“世界上拥有可以思考、学习和创造的机器”。西蒙的自信很大程度上基于人工智能系统在简单情况下成功执行的能力。然而，在所有情况下，当这些早期系统必须从更广泛的问题中选择时，它们成功执行变得变得更加困难，并暴露了自己的局限性。原因如下：


    - 首先，早期的人工智能程序仅在简单的语法统一上成功，因为它们对主题的知识有限。美国国家研究委员会资助了俄语翻译，但很难解决语言的歧义并理解句子内容。最终，在1966年，咨询委员会发布了一份报告，称“没有通用科学文本的机器翻译，也没有近期的前景”。政府对学术翻译项目的财政支持随后被取消了。


    - 第二，人工智能试图解决的问题是复杂的。早期的人工智能程序能够通过仅表达其基本事实来逐步解决问题，直到找到解决方案。简单的程序可以通过找到解决方案来解决问题，但复杂的
    AI 程序是不可能的。因此，当时人们希望更好的计算机或内存的改进将会可用。然而，随着计算复杂度的发展，人们发现仅用一个程序解决一个问题在时间和空间上并不是线性扩展的，而是取决于问题的难度。


    - 第三，用于生成智能行为的基本结构是局限的。


