    \ 基础》（经首尔市教育长批准的教科书）、《使用 VHDL 进行数字电路设计》以及《RFID GL 资格考试（国家授权）》等。\n\nEun-soo Choi助理研究员\n\
    \nEun-soo Choi助理研究员在 Eulji 大学医疗 IT 部门获得学士和硕士学位，撰写了关于数据预处理和混合机器学习的论文。他完成了微软深度学习\
    \ (CNTK) 课程和 Azure Machine Learning Studio 课程。他曾通过 MIIC（医疗情报研发中心），目前在智能空间研究中心担任免兵技术研究人员。现在，他正致力于基于深度学习的点云建模项目。此外，他还致力于基于\
    \ GIS 和 BIM 的机器学习应用。他的著作是《使用 Microsoft Azure Machine Learning 入门机器学习》。\n\n# 前言\n\
    \n人工智能作为第四次工业革命的主要驱动力，将把我们发展成为一个智能社会，从工业、教育到医疗的一切都将互联。人工智能通过创造模拟人类智能的机器来增加人类的潜力。人工智能成功的案例包括：1997年“深蓝”号赢得象棋、2015年\
    \ AlphaGo 的胜利、自动驾驶汽车的测试行驶成功、具有语音识别功能并响应语音指令的人工智能音箱，以及辅助医生的人工智能诊断支持。人工智能领域正在许多兴奋的发展，该领域的研究人员不断增加；但“机器学习”和“深度学习”等术语及其模糊的定义，使得研究人员难以进入该领域。作者也记得进入该领域有多困难；他曾学习的是机器人学中的控制理论。有一点是可以肯定的，即使是非人工智能专业的也想使用人工智能。\n\
    \n对于那些在没有特定应用目标的情况下开始人工智能的人，他们会认为学术方法是必要的。这些方法可能从人工智能的历史到人工智能术语的定义，再到人工智能的逻辑、数学和算法。然而，那些对应用感兴趣并开始学习人工智能的人，可能会觉得实际问题更有趣。\n\
    \n# viii 机器学习：概念、工具与数据可视化\n\n本书首先是为那些不懂数学和理论的人编写的，其次是为那些尝试过开源方法但遇到困难的人编写的。\n\n\
    本书介绍了什么是人工智能，以及如何在应用中利用数据。对于那些不懂数学或控制的人，本书将告诉他们如何使用机器学习。选择开源方法有优缺点。由于是开源的，这种方法不需要费用，但在所需的库或算法方面会有限制。闭源和开源方法的区别类似于\
    \ Windows/iOS 用户与 Linux 用户之间的区别。Windows/iOS 用户为操作系统付费，但有更多程序选择和支持；另一方面，Linux 用户不需要为操作系统付费，但系统不方便且难以使用。希望您理解我对闭源和开源方法的解释。\n\
    \n"
