    # Chapter 2


    # Machine Learning


    # 2.1 Definition of Machine Learning


    Machine Learning (ML) is the scientific study of algorithms and statistical models
    that computer systems use to perform a specific task without using explicit instructions,
    relying instead on patterns and inference. It is seen as a subset of artificial
    intelligence. It also focuses on representation and generalization. Representation
    is the evaluation of data, and generalization is the processing of data that is
    not yet known. The term Machine Learning was first used by Arthur Samuel, an IBM
    researcher in the field of artificial intelligence, in his paper “Studies in Machine
    Learning Using the Game of Checkers.”


    The machine is a computer that can be programmed and used as a server. The study
    of machine learning is characterized by three approaches. The first is the neural
    model, having started out in the form of the perceptron, are now moving towards
    deep learning models. Second is the study of the symbolic paradigm. This paradigm
    uses logic or graph structures instead of numerical or statistical theories and
    was the core approach of artificial intelligence from the mid-1970s up until the
    late 1980s. This is the intensive paradigm of modern knowledge. Third with the
    theory that knowledge has already been learned should be reused, rather than starting
    the process of learning from scratch, as neural models do.


    In the 1990s, practical machine learning research became more mainstream than
    real-world approaches that focused on computer learning methodologies. In the
    1990s, the paradigm of machine learning was largely computer base. Data mining,
    which analyzes data from a statistical perspective, shares a lot of theoretical
    elements with machine learning; the ease of securing digital data to the rapid
    spread of high-performance computers and the spread of the Internet also had a
    lot of influence on this movement.'
