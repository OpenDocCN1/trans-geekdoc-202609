    ![](img/3c3c87d78136583581b0cf0620f5ae66_102_0.png)


    ## Table 6-1 Terminologies and meanings used in performance evaluation


    | Terminology | Meaning |

    | --- | --- |

    | TP (True Positive) | If you predicted true and the data is true |

    | TN (True Negative) | If you predicted true and the data is false |

    | FP (False Positive) | If you predicted false and the data is true |

    | FN (False Negative) | If you predicted false and the data is false |

    | Accuracy — (TP+TN)/(TP+TN+FP+FN) | An indicator of whether the model finds the
    right prediction. |

    | Precision — TP/(TP+FP) | The ratio of what the model classifies as true to what
    is actually true. |

    | Recall — TP/(TP+TN) | The ratio of what is actually true to what the model predicts
    true. |

    | F1 Score | When data labels have an unbalanced structure, it can accurately
    evaluate the performance of the model and express the performance as a single
    number |


