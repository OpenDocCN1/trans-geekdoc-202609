    另一方面，机器学习基于数据进行归纳学习并修改权重。由于没有用于确定统计显著性的验证过程，为了确定机器学习的结果是否合适，必须通过构建由训练数据、验证数据和测试数据组成的集合来完成性能评估。图
    2-13 显示了机器学习流程。


