    knowledge by working in the specific field of organic chemistry. DENDRAL proposed
    the most likely candidate structures for new and unknown chemicals, and in some
    classes of organic materials, their performance measured up with that of human
    experts. The importance of DENDRAL lies in the notion that it was probably the
    first-ever successful knowledge-intensive system.


