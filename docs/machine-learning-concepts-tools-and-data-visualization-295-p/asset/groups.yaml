    # Preface


    Artificial intelligence, which is the primary driver of the fourth Industrial
    Revolution, will develop our society into an intelligent society where everything
    from industry to education to medicine is interconnected. Artificial intelligence
    is increasing human potential by creating machines which simulate human intelligence.
    Some examples of artificial intelligence successes include Deep Blue’s chess victory
    in 1997 and AlphaGo’s victory in 2015, the test drive success of autonomous vehicles,
    the development of artificial intelligence speakers with voice recognition capabilities
    which can respond to voice commands, and the implementation of artificial intelligence
    diagnosis support to help doctors. Many exciting developments are taking place
    in the field of artificial intelligence, the number of researchers in the field
    is increasing; still, terms such as ‘machine learning’ and ‘deep learning’, along
    with ambiguous definitions, are making it difficult for researchers to enter the
    field. The author, too, remembers how difficult it was to enter the field; he
    studied control theory in robotics. One thing for sure is that even non-artificial
    intelligence majors want to use artificial intelligence.


    For those start on artificial intelligence without any particular application
    in mind, they will think that academic approaches are necessary. These may range
    from the history of artificial intelligence to the definition of artificial intelligence
    terms to the logic, mathematics, and algorithms of artificial intelligence. However,
    those who start on artificial intelligence with an interest in its applications
    will probably feel that practical matters such as coding and algorithms, which
    can be applied to their fields, are of greater interest. I wrote a book which
    I hope will appeal to both these groups of people who have no expertise in artificial
    intelligence.'
  - '[PAGE 8]


    # viii Machine Learning: Concepts, Tools and Data Visualization


    This book, firstly, was written for those who do not know mathematics and the
    theory of control, secondly, for those who tried the open-source approach but
    had difficulties.


    People who don''t know mathematics or control theory will be told what AI is and
    how data can be used in the application of AI. For best results, they should follow
    the instructions in the book. Those who use open-source approaches read the text
    carefully and decide whether to choose the open-source approach or not. There
    are pros and cons to choosing an open-source approach. Because it is open-source,
    the approach will cost nothing, but there will be limitations in applying the
    required libraries or algorithms. The time spent finding alternative ways to perform
    tasks could be better invested in actual research. The difference between closed-source
    and open-source approaches is similar to the difference between Windows/iOS users
    and Linux users. Windows/iOS users pay for their OS but have a greater variety
    of programs and access to support. Linux users, on the other hand, do not pay
    for their OS, but OS is less convenient and more difficult to use. I hope you
    understand my explaining the difference between opensource and closed-source approaches.
    For this book, I have used Microsoft’s Azure Machine Learning program.


    This book consists of three parts. Part 1 introduces the history of artificial
    intelligence, machine learning, and deep learning, as well as algorithms. It explains
    how the data will be utilized i.e. in data science approaches as data mining and
    big data processing. Data mining and big data processing are ways of discovering
    patterns in large data sets involving methods at the intersection of machine learning,
    statistics, and database systems.


    Part 2 introduces Azure Machine Learning, how to use it, and some examples as
    needed. Azure Machine Learning makes it easy to use algorithms in supervised and
    unsupervised learning by selecting menus. So, Azure Machine Learning is explained
    and each step is illustrated so that we can study the example program from the
    beginning to the end. We also described examples of using actual public and medical
    data. If this book is read in its entirety, even beginners who have just started
    machine learning can use Azure Machine Learning programs.


    Part 3 introduces visualization and Power BI, which is a visualization tool. Data
    visualization is an essential technique in all areas of data handling. Visualization
    will help you lay the foundation of data science. Power BI is developed by Microsoft,
    and so can be integrated with Microsoft Azure Learning. Also, Power BI’s R Script
    feature enables complex computations for high-performance visualization.


    If you want to apply artificial intelligence rather than the theoretical approach,
    you will have to learn a program, not necessarily Azure Machine'
