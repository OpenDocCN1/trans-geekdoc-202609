    each instance of data is assigned a group name (label). Therefore, the result
    value of the classification model must be one of the labels from the training
    data. For example, if you have a data set labeled "bicycle", "cat", "dog", "book",
    and "desk", the result of the classification model should be one of five labels
    i.e. bicycle, cat, dog, book, or desk. For reference, when a data set is classified
    into two groups, it is referred to as binary classification or binomial classification,
    and when a data set is classified into more than three groups, it is referred
    to as polynomial classification.


    In statistical modeling, regression analysis is a set of statistical processes
    for estimating the relationships among variables. It includes many techniques
    for modeling and analyzing several variables, with the focus on the relationship
    between a dependent variable and one or more independent variables (predictors).
    The regression model aims to express the relationship between features and labels
    with the use of trained data. So, in a regression model that uses functional expressions,
    we look for specific patterns and predict what the dependent variables associated
    with particular independent variables should be according to those patterns. As
    such, it is more reliable when predicting something because of its habit of returning
    to the mean average. Thus, regression analysis is also called a predictive


    Regression analysis can also be applied to predict several categorical results,
    such as classification. The regression model in this case is called logistic regression.
    The logistic model is used to model the probability of a certain class or event
    occurring as pass/fail, win/lose, or healthy/sick. This can be extended to model
    several classes of events such as determining whether an image contains a cat,
    dog, lion, etc.


    # 2.3.1 Classification


    In machine learning and statistics, classification is the problem of identifying
    which of a set of categories (sub-populations) an observation belongs to, on the
    basis of training data containing observations (or instances) whose membership
    is known.


    Classification refers to the process of recognizing, differentiating, and understanding
    a concept or subject, implying that a subject is in a category, and usually has
    a specific purpose. As such, classification is essential for all kinds of interactions
    concerning language, speculation, reasoning, decision making, and the environment.
    In machine learning, classification is a representative technique of data analysis,
    which classifies objects which have multiple attributes into variables into a
    predetermined group or class.'
