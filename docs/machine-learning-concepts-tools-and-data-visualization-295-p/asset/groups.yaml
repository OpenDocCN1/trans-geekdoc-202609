    If users proceed to deploy Azure Machine Learning Studio web service with R Studio,
    they will be able to proceed without any problem. However, there are some limitations
    when using R''s visuals with Power BI Desktop:


    +   - Data size limitations—data used by the R visual for plotting is limited
    to 150,000 rows. If more than 150,000 rows are selected, only the top 150,000
    rows are used and a message is displayed on the image.


    +   - Calculation time limitation—if an R visual calculation exceeds five minutes
    the execution times out, resulting in an error.


    +   - Relationships—as with other Power BI Desktop visuals, if data fields from
    different tables with no defined relationship between them are selected, an error
    occurs.


    +   - R visuals are refreshed upon data updates, data filtering, and data highlighting.
    However, the image itself is not interactive and cannot be the source of cross-filtering.


    +   - R visuals respond when you highlight other visuals, but you cannot click
    on elements in the R visual in order to cross-filter other elements.

    - Only plots that are plotted to the R default display device are displayed correctly
    on the canvas. Avoid explicitly using a different R display device.


    +   - In this release, RRO installations are not automatically identified by the
    32-bit version of Power BI Desktop, so you must manually provide the path to the
    R installation directory in **Options and settings > Options > R Scripting.**'
