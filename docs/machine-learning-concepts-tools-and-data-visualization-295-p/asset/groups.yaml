    - Galton 数据

    Galton (1886) 以表格形式展示了这些数据，显示了 205 对父母出生的 928 名成年子女及其父母身高的交叉表。我们视觉上平滑了双变量频率分布，显示出形成的同心类似椭圆，从而为相关性、回归和双变量正态分布奠定了基础。创建了一个包含
    928 个观测值的数据框：

