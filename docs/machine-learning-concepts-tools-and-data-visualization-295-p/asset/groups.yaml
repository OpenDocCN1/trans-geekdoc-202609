    approved by the Superintendent of Education in Seoul), Digital Circuit Design
    using VHDL, and RFID GL Qualification Test (Nationally Authorized) and so on.


    ### Assistant Research Engineer Eun-soo Choi


    Assistant Research Engineer Eun-soo Choi, who received a B.S and an M.S degree
    from the Eulji University Department of Medical IT, wrote a thesis on data preprocessing
    and hybrid machine learning. He finished the Microsoft Deep Learning (CNTK) course
    and Azure Machine Learning Studio course. He has gone through MIIC (Medical Intelligence
    Information R&D Center) and is currently serving as a military service exempted
    technical research personnel at the Smart Geospatial Research Center. Now, he
    is working on a deep learning-based Point Cloud modeling project. Also, he is
    working on GIS and BIM-based machine learning applications. His book publication
    is Getting Started with Machine Learning using Microsoft Azure Machine Learning.


