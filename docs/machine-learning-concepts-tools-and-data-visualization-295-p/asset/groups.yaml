    深度学习。然而，实际上算法的计算方式比在此之前所看到的解释要复杂得多，而且并不是单一神经网络，而是由几个由互补结构组成的网络。


    让我们先看看 AlphaGo 内部的神经网络是如何组织的。


    首先，AlphaGo 有一个能够“预测当前状态下下一个落子位置”的网络（也就是说，它不仅预测对手会在当前状态下落在哪里，还预测我应该落在哪里）。在某些论文中，这被称为“策略网络”（policy
    network）。自然地，这个策略网络以 CNN（卷积神经网络）的形式存在，因此 AlphaGo 首先需要大量的数据。如前所述，CNN 需要大量的输入数据和相应的输出数据。为了获得输出数据，我们使用了来自“KGS”网站的围棋记录。


    利用这些对局记录，总共提供了 3000 万条关于下一步落子位置的数据，这些数据被用于学习策略网络。此外，我们还准备并让 AlphaGo 学习了一个名为“终局策略”（Rollout
    policy）的网络，它可以比策略网络更快地计算相同的问题。


    策略网络也非常有效。策略网络能够在不使用 MCTS（蒙特卡洛树搜索）的情况下以高胜率赢得比赛。然而，网络本身无法超越 AlphaGo。正如我们之前看到的，MCTS
    的搜索需要一个“价值网络”（value network），即计算玩家在当前状态下是否能胜的 $v(s)$。价值网络具有与策略网络类似的 CNN。


    然而，与策略网络不同，价值网络仅根据棋子的最后一个位置（作为末尾的输入）产生概率分布。为了学习这个网络，AlphaGo 保存了自对局游戏的数据记录，收集了胜负状态，将它们放入价值网络的学习数据中，并成功地完成了学习。因此，人们认为
    AlphaGo 使用了策略网络、终局策略和价值网络来进行 MCTS。


    每个网络按以下方式使用：


    -   **策略网络**：在原始的选择阶段，MCTS 使用选择最成功子节点的方法。然而，AlphaGo 的 MCTS 使用了一个术语，即“在当前状态下释放这枚棋子的概率”，该概率由策略网络计算。这使得它更倾向于高概率的动作。这可以被解释为
    AlphaGo 实现了一种传统计算机算法无法实现的人类直觉。


    MCTS 还通过对只访问一侧的玩家给予特定的惩罚，鼓励玩家向另一个方向搜索动作。这是为了防止搜索变得过于单一。


    -   **终局策略**：终局策略的性能远低于策略网络，但它具有计算速度快得多的优势。因此，在 MCTS 的评估阶段运行模拟时，会使用终局策略。


    -   **价值网络**：价值网络也被用于评估阶段。在评估阶段，终局策略和价值网络独立地计算分数，该状态的最终分数通过按特定比例两者相加得出。根据多篇论文，使用两者的组合（ELO
    评分 2900）来相加分数，比仅使用策略网络（单机上 ELO 为 2450 和 2200）或价值网络要好。


    在完成每一步的选择、扩展和评估过程后，将显示所选状态的评估分数。该分数用于更新回溯过程中访问的路径分数以及访问次数。在更新时间过去后，最终选择出 MCTS
    树中被访问最多的状态位置。


    上述描述的更新 MCTS 树的过程遗憾的是，它是通过分布式操作进行的。在最后一次开发中，AlphaGo 通过将计算分布在多个 CPU 和 GPU 上来执行
    MCTS，而不是在单台计算机上执行计算，这变成了具有如此“神级”搜索能力的人工智能，事实证明超出了甚至职业围棋手的理解范围。


    ## 4.2 IBM Watson


    Watson 以 IBM 的创始人兼首任首席执行官、工业家托马斯·J·沃森（Thomas J. Watson）命名。


    Watson 是一个能够回答自然语言问题的计算机系统，由首席研究员大卫·费鲁奇（David Ferrucci）领导的研究团队为 IBM 的 DeepQA 项目开发。系统最初是为了回答问答节目《危险边缘》（Jeopardy!）中的问题，并在
    2011 年 2 月 14 日的节目中登场。第一个在人类战斗中获胜的机器不是 AlphaGo。IBM 的深蓝（Deep Blue）击败了 1996 年世界象棋冠军加里·卡斯帕罗夫（Garry
    Kasparov）。AI Watson 是深蓝的升级版，在 2011 年击败美国问答节目最成功的两位冠军后，获得了《危险边缘》的决赛冠军。


    2004 年，在与同事共进晚餐时，IBM 研究经理查尔斯·利凯尔（Charles Lickel）注意到餐厅陷入了沉默。他发现了这种嫉妒沉默的原因：肯·杰宁斯（Ken
    Jennings），他当时正处于《危险边缘》节目中成功的 74 场连胜记录中。几乎整个餐厅的人都在吃饭中停下，聚集在电视机前观看这一现象。利凯尔对问答节目作为
    IBM 的一种可能挑战感兴趣，并将这个主意传了下去。2005 年，IBM 研究执行高管保罗·霍恩（Paul Horn）支持了利凯尔，推动他部门的某人接受与
    IBM 系统玩《危险边缘》的挑战。Watson 的实际开发始于 2005 年，事实证明这是一个比实时分析语言的廉价迭代要困难得多的过程。最重要的是，它是第一个击败人类的人工智能系统。图
    4-5 显示了 IBM“人机大战”挑战。


    IBM 正在将 Watson 扩展到认知计算，将人工智能与机器学习相结合。


