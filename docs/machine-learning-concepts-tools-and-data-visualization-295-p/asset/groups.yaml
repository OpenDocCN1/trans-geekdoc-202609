    The next stage of computer and programming tool development featured the emergence
    of primitive but elementary computing power. At this point, Nowell and Simon had
    been very successful in developing a system called the General Problem Solver
    (GPS) that could change many of the factors in calculations, thereby reducing
    the difference between desired and expected results. The GPS is a program that
    models the process of solving human problems, unlike the LT (Logic Theorist).
    It is an inference program that uses a combination of searching, goal-oriented
    behavior, and rule-application.


    GPS became the first program to achieve the first goal of artificial intelligence
    — a system that can think like a human. Beginning at Carnegie Mellon University,
    the cognitive science approach and convergence research, suggests that human cognitive
    skills will eventually become identical with those of computers, is still the
    basis of cognitive science today. These approaches are also studied in the fields
    of biology, linguistics, psychology and computer science.


    McCarthy, who announced the beginning of AI, made three critical achievements
    when he moved from Dartmouth to MIT in 1958. First was the development of the
    artificial intelligence programming language LISP, which became the second oldest
    programming language. Second was the introduction of Time Sharing, which began
    to solve problems relating to the expensive nature of computer usage. At the time,
    the fee for using a computer was high; however, Time meant that multiple users
    were able to take turns using one computer for short periods. Third, in 1958,
    McCarthy published his first book, “Programs with Commonsense,” which led to the
    development of the complete AI program “Advice Taker.” This program included all
    the essential principles of knowledge representation and reasoning, and knowledge
    was used in the search process to solve problems.


    # 1.2.3 The Stagnation of Artificial Intelligence


    From the beginning, artificial intelligence researchers predicted the success
    of their field, with Herbert Simon announcing in 1957 that “the world has machines
    to think, learn, and create”. Simon’s overconfidence was largely based on the
    ability of artificial intelligence systems to perform successfully in simple situations.
    In all cases, however, when these early systems had to choose from a broader range
    of problems, it became more difficult for them to perform successfully, and they
    revealed their limitations. The reasons for this are as follows.


    - First, the early artificial intelligence programs only succeeded in simple grammatical
    unification because they had a limited knowledge of the subject. The National
    Research Council in the United States financed the translation of the Russian
    language, but it was difficult to resolve the ambiguity of the language and to
    understand sentence content. Eventually, in 1966, the Advisory Committee issued
    a report saying “there is no machine translation of the general scientific text
    and no immediate outlook.” The government’s financial support for academic translation
    projects were then canceled.


    - Second, the problems that artificial intelligence was trying to solve were complicated.
    The early artificial intelligence programs were able to solve the problem step
    by step by expressing only the basic facts about it until a solution was found.
    A simple program could solve the problem by finding a solution, but a complex
    AI program was impossible. As such, at the time, was hoped that a better computer
    or improvements in memory would become available. However, the Computational Complexity
    developed over time, it was found that solving one problem using just one program
    did not linearly scale in time and space, depending on the difficulty of the problem.


    - Third, the basic structure used to generate intelligent behavior was limited.

