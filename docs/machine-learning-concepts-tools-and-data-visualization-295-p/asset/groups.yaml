    \ 折线与堆叠柱状图\n\n图 11-32 显示堆叠面积图。堆叠面积图有助于识别数据之间的趋势和贡献。\n\n图 11-33 显示折线与聚集柱状图。当数据值较宽时，折线与聚集柱状图有助于理解数据。\n\
