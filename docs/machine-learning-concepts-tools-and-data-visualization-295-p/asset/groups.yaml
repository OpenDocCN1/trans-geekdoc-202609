    that continually updates itself when new information is released and is learning
    new things by processing the language.


    ## 4.3 Practice Questions

    Q1. What is AlphaGo?

    Q2. Describe the Monte Carlo Tree Search (MCTS) which is implemented as AlphaGo
    algorithm.

    Q3. Describe the AlphaGo Pipeline.

    Q4. Describe Watson, an artificial intelligence system implemented by IBM.


    # Chapter 5

    ## Microsoft Azure Machine Studio


    ## 5.1 Introduction of Microsoft Azure Machine Studio

    Azure is a cloud computing platform from Microsoft that has been in service since
    2010. Following PaaS in 2011, IaaS service was launched in 2013. Of the more than
    600 services that the Azure platform provides, this book will focus on one of
    them, Azure Learning Studio. There are many open source libraries and tools for
    machine learning, why use Azure Learning Studio? The answer lies in the fact that
    Azure Learning Studio solves the following problems:


    - Lack of flexibility in computing resources

    - Difficulties in configuring GPU-based environments for learning

    - Difficulty installing and setting up tools for learning

    - Difficulty in experiment recording and versioning


    Figure 5-1 shows the workflow of Azure Machine Learning. Users can leverage the
    Azure platform to enable data collection and management in the cloud and use Machine
    Learning Studio to create predictive models and build web services easily. Unlike
    existing cloud platform and machine learning tools, it provides an easy-to-access
    GUI environment with user convenience in mind. Figure 5-2 shows that Azure ML
    Studio can easily create blocks in the form of drag-drop, unlike traditional machine
    learning tools and libraries. In addition, scripts written in R and Python languages
    can be inserted and used in blocks.


    ## Machine Learning: Concepts, Tools and Data Visualization

    ### Azure Machine Learning: Basic workflow

    Build models from data and operationalize machine learning solution


    | Data collection & management | Machine Learning service | Embedded ML model
    |

    | :--- | :--- | :--- |

    | Blobs & tables (Azure Storage) | ML STUDIO | |

    | Hadoop (Azure HDInsight) | Web service | |

    | Relational data (Azure SQL Database) | Output a web service that can run on
    a scheduled basis and connected to database | Add intelligence to apps or websites,
    or provide insights in BI tools |

    | Massive data stores (Azure Data Lake) | Create machine learning models | |


    **Figure 5-1** Azure Machine Learning workflow

    ![](img/3c3c87d78136583581b0cf0620f5ae66_80_0.png)


    **Figure 5-2** Canvas of Azure Machine Studio Experiment


    Thanks to its easy structure, users of all skill levels can easily create and
    distribute predictive models. The results can be visualized. Figure 5-3 shows
    the Azure AI Gallery where users can try projects developed by other users or
    import them into their own projects for modification. In addition, users can post
    projects shared in the Gallery on social media such as Facebook or Twitter, to
    request comments.


    Figure 5-4 shows the overall capabilities of Azure Machine Learning. Azure Machine
    Learning supports input, output and visualization, and prepares standard machine
    learning algorithms frequently used by data scientists. Users can develop and
    deploy the following steps:


    Microsoft Azure Machine Learning Studio 65

    ![](img/3c3c87d78136583581b0cf0620f5ae66_81_0.png)


    Figure 5-3 Azure AI Gallery

    ![](img/3c3c87d78136583581b0cf0620f5ae66_81_1.png)


    Figure 5-4 Diagram of Azure Machine Learning Studio

    (1) Import data: Users can take data for training models and import it into the
    Azure cloud for versatile use.

    (2) Data preprocessing: Users can preprocess data for situations in which there
    is missing data for training models.

    (3) Feature selection: To train a model, users can extract features according
    to the algorithm.

    (4) Evaluation: After training, the model is evaluated and checked for errors.

    (5) Web service deployment: The trained model can be distributed through a service.


    ## 5.2 Microsoft Azure Machine Learning Studio Sign-up

    Go to https://studio.azureml.net/ and click the ‘Sign up here’ link, boxed in
    Figure 5-5.

    ![](img/3c3c87d78136583581b0cf0620f5ae66_82_0.png)


    A pop-up window will be displayed, as shown in Figure 5-6. Users can enter as
    a guest for 8 hours free of charge, but it is recommended to use Free Workspace
    with a Microsoft account to store project and experiment data.


    ![](img/3c3c87d78136583581b0cf0620f5ae66_83_0.png)


    **Figure 5-6** Azure Machine Learning Studio selection pop-up


    If you log in successfully, you will see the workspace shown in Figure 5-7.

    ![](img/3c3c87d78136583581b0cf0620f5ae66_83_1.png)


    **Figure 5-7** Azure Machine Studio workspace


    ## 5.3 Introduction of Microsoft Azure Machine Studio Function

    Click the “+ NEW” in Figure 5-8 to display the Workspace features


    ![](img/3c3c87d78136583581b0cf0620f5ae66_84_0.png)


    Click the “+NEW” button to see the “DATASET”, “MODULE”, “PROJECT”, “EXPERIMENT”
    and “NOTEBOOK” functions as shown in Figure 5-9. The ‘DATASET’ allows users to
    upload experiment data files to the Azure cloud for use in their personal account.
    Users can also modularize Python scripts by inserting a compressed file (.zip)
