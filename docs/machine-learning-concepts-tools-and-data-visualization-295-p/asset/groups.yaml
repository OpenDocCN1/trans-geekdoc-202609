    from the last position of a stone, given as input at the end. To learn this network,
    AlphaGo saved the data records from self-play games, collecting the winning and
    losing states, put them into the value network''s learning data, and successfully
    completed the learning. As such, it is believed that AlphaGo conducted MCTS using
    Policy Networks, Rollout Policy, and Value Networks.


    Each network is used in the following manner.


    - Policy Network: In the original selection phase, MCTS uses the method of selecting
    the most successful child node. However, AlphaGo’s MCTS uses a term that for “the
    probability of releasing this stone in its current state”, calculated by the policy
    network. This causes it to move more towards a higher probability action. This
    can be interpreted as AlphaGo implementing a form of human intuition that could
    not be implemented by a conventional computer algorithm.


    MCTS also encourages players to search for actions in the other direction by giving
    them a certain amount of penalties a player visits only one side. This is to prevent
    a search from becoming too one-sided.


    - Rollout Policy: Rollout policy has much lower performance than a policy network
    but it does have the advantage of being able to calculate much faster. Therefore,
    when running simulations in the Evaluation stage of MCTS, a roll-out policy is
    used.


    - Value Network: Value networks are also used in the evaluation phase. In the
    evaluation stage, both rollout policy and a value network calculate the scores
    independently, and the final scores of this state are calculated by adding the
    two at a specific ratio. According to a number of papers, it is better to add
    the scores by using a combination of the two (ELO Rating 2900) rather than using
    only either (ELO 2450 and 2200 in a single machine) policy or a value network.


    After completing the selection, expansion, and evaluation process for each step,
    the score(s) evaluated for the selected state is displayed. This score is used
    to update the score of the path visited during the backup process and the number
    of visits. After the time for the update has elapsed, the most visited state position
    in the MCTS tree is finally selected.


    The process of updating the MCTS tree described above is, unfortunately, one that
    proceeds via a distributed operation. In its last development, AlphaGo performed
    MCTS by distributing calculations across multiple CPUs and GPUs instead of performing
    calculations on a single computer, this becoming a form of artificial intelligence
    with such a "god-like" degree of searching ability that it has proven outside
    the understanding of even professional Go players.


    ## 4.2 IBM Watson


    Watson was named after IBM''s founder and first CEO, industrialist Thomas J. Watson.


    Watson is a question-answering computer system capable of answering questions
    posed in natural language, developed for IBM''s DeepQA project by a research team
    led by principal investigator, David Ferrucci. The computer system was initially
    developed to answer questions on the quiz show Jeopardy! and was featured on its
    February 14, 2011 episode. The first machine to win in a battle with humans was
    not AlphaGo. IBM''s Deep Blue beat the 1996 World Chess Champion Garry Kasparov.
    AI Watson, the upgraded version of Deep Blue, won the Jeopardy! final championship
    after beating the American quiz show’s two most successful champions in 2011.


    In 2004, over dinner with coworkers, IBM Research manager Charles Lickel noticed
    that the restaurant they had fallen silent. He discovered the cause of this envious
    hiatus: Ken Jennings, who was then in the middle of his successful 74-game run
    on Jeopardy!. Nearly the entire restaurant had piled toward the televisions, mid-meal,
    to watch the phenomenon. Intrigued by the quiz show as a possible challenge for
    IBM, Lickel passed the idea on, and in 2005, IBM Research executive Paul Horn
    backed Lickel up, pushing for someone in his department to take up the challenge
    of playing Jeopardy! with an IBM system. Watson’s actual development started in
    2005 and proved to be a more difficult process than the cheap iteration it had
    to analyze the language in real time. Most importantly, it was the first artificial
    intelligence system to beat humans. Figure 4-5 shows the IBM “Man vs. Machine”
    Challenge.


    IBM is expanding Watson into cognitive computing that combines artificial intelligence
    with machine learning to enable inference and learning. The fusion of big data
    and AI makes Watson technology capable of analyzing huge amounts of data on its
    own and supporting human decision-making by accumulating knowledge while learning
    and evolving through human language. IBM Watson applies advanced natural language
    processing, information acquisition, knowledge representation, automated reasoning,
    and machine learning technologies to answer questions in unspecified areas.


    ![](img/3c3c87d78136583581b0cf0620f5ae66_73_0.png)


    Figure 4-5 Jeopardy! “Man vs. Machine” challenge


    (Source: http://stephsureads.blogspot.com/2011/02/jeopardy-ibm-challenge-and-what-it.html)


    ## Machine Learning: Concepts, Tools and Data Visualization


    In addition, through machine learning, IBM Watson continues to learn for itself,
    developing its expertise. Watson is now evolving while interacting with human
    language through speech recognition, image recognition and visualization techniques.


    Watson and AlphaGo are both deep learning technologies that play a prominent role
    in the field of health and games, respectively. AlphaGo’s core technology is a
    deep learning technology used to cluster or classify objects and data. AlphaGo
    uses deep learning to implement a value network, which calculates the odds of
    winning on the board, and a policy network, which calculates scores by location
    on the board.


    Google DeepMind used TensorFlow, an in-depth learning system, to create Alpha.
    TensorFlow is an open source library for machine learning and deep learning.


    This technology allows Google to adapt its general-purpose algorithm, AlphaGo,
    to a variety of fields. TensorFlow is the big data platform we all know.


    Watson’s core role is to build knowledge in specialized fields, such as medical
    terminology, and to generate optimal data to support human decision-making. When
    medical staff enter clinical information, Watson gives advice regarding a patient''s
    condition and possible course of treatment. Based on millions of diagnostics,
    patient records, medical books, etc. Watson makes judgments itself and informs
    users about the most effective course of treatment. Watson is helping to treat
    patients by reducing the time taken to interpret patient information and collect
    information from medical literature to just a few minutes.


    Table 4-2 IBM Watson Vs Google AlphaGo


    | IBM Watson | VS | AlphaGo |

    |---|---|---|

    | IBM | Development company | Google DeepMind |

    | David Ferrucci | Developer | Demis Hassabis |

    | Self-learning through machine learning | Learning method | Intensive learning
    using deep neural network technology |

    | Won the Jeopardy quiz game in 2011 | Competitive Record | Won a Go game against
    Lee Sedol in 2016 |

    | NLP (Cognitive computing) | Characteristic | Decision-making system |

    | Medical, Finance | Main Application Field | Games, Health |

    | Cloud | System Used | TensorFlow |

