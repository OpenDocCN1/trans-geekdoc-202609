    Watson 的技术水平足以分析非结构化数据，例如图片、视频、MRI 数据和患者移动轨迹，这些数据以前是难以分析的。


    ### Watson 是如何工作的？

    在专家的指导下，Watson 收集开发基于语料库知识所需的信息。因此，收集此类语料库的任务是将相关文献引导至 Watson。为了构建语料库，需要人工干预来查看收集的信息，并丢弃过时、评估不佳或与领域相关性较低的信息。


    这被称为内容策划（content curation）。为了让 Watson 正确学习，必须有效地执行内容策划。为了学习解释大量信息，需要专家培训。为了获得学习最优性能和搜索模式的能力，Watson
    成为专家的伙伴，并通过机器学习进行自我训练。机器学习是人工智能用于实现类人推理的应用，它始于 1984 年 Douglas Lenat 发起的的人工智能项目
    CYC。


    例如，取“每棵树都是植物”和“植物最终会死亡”这两个陈述。

    当被询问树是否死亡时，推理引擎（Inference Engine）可以得出确定结论并正确回答。专家以问/答格式将训练数据上传到 Watson，这些数据被用作验证数据。


    图 4-6 显示了人工智能中的基于知识的代理。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_75_0.png)


    图 4-6 人工智能中的基于知识的代理


    专家定期审查用户与 Watson 之间的交互，并向系统反馈以提高 Watson 解释信息的能力。这些规则是人工添加的。制定涵盖世界上所有差异知识的规则是不行的。但在
    Watson 的情况下，这是通过自然语言处理自动完成的。毕竟，Watson 是在新信息发布时不断更新自身的系统，并通过处理语言来学习新事物。


