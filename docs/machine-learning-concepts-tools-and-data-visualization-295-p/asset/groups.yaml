    和 2 mg/天），通过两种给药方法之一：橙汁或抗坏血酸（维生素 C 的一种形式，编码为 VC）。

    ToothGrowth 数据的属性是“len”（意味着牙齿长度）、“supp”（意味着支持类型 VC 或 OJ）和“dose”（意味着毫克/天的剂量数）。

