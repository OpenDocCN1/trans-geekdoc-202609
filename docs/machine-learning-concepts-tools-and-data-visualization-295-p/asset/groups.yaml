    The ToothGrowth data set contains the results from an experiment studying the
    effects of vitamin C on tooth growth in 60 Guinea pigs. Each animal received one
    of three dose levels of vitamin C (0.5, 1, and 2 mg/day) by one of two delivery
    methods, orange juice or ascorbic acid (a form of vitamin C and coded as VC).

    The attributes of the ToothGrowth data are “len", meaning tooth length, “supp",
    meaning support type (VC or OJ), and “dose", meaning the number of doses in milligrams/day.

    After loading, you can check the ToothGrowth data, as shown in Figure 12-9.

    After data importing is complete, users can note that data now appears in “Fields”
    as shown in Figure 12-10. Check the data in “Fields” on the right to import the
    data into the R Script.


