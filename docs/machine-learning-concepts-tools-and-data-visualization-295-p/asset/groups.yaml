    # 第1章


    # 人工智能总结


    # 1.1 人工智能的定义


    人工智能有多种定义，包括“机器制造的智能”以及“人类拥有的某些或全部智力的人工体现”。


    人工智能的各种定义可以总结为：“配备了人类智能、能够理解人类判断、行为和认知的机器”。智能被认为是“能够应用先验知识和经验来完成具有挑战性的新任务的能力”。这最终可以被称为人类的智力能力。这种能力可以灵活地应对各种情况和问题，并且与学习能力有关。


    学习能力是获取他人难以学习的技能或信息的能力，是更快或更广泛地学习相同内容的能力。虽然智能本身与个人所学的内容不同，但学术成就、智力思维和行为依赖于先验知识；因此，智能可以通过经验和学习发生改变。


    因此，智能通常始于并定义为“解决问题的能力”。我们需要高水平的智能来解决各种问题。例如，当你下国际棋时，你将利用从各种文本、大量棋局和互联网获取的信息来做出预测，然后采取相应的行动。这些行为对人类的智能和思维要求很高，而思维正是这种基于智能的学习产生的。科学上对“思维”的解释将其广泛定义为“意识”，并全面识别为对对象的“经验”。经验也是一种过程的知识，通过这种过程，在某个领域有经验的人可以学习以获得专家声誉。因此，智能是对人类可能产生的思维的识别、分析和理解，而


    机器学习：概念、工具与数据可视化


    那些人工产生的内容被称为人工智能。要创造一台像人类一样思考的机器，有必要研究人类的思维和行为，包括听、说、看和行。这看起来可能很简单，但让计算机具有根据它听到或看到的内容进行听、说或的能力是一项非常困难的任务，模拟人类的思考也是如此。


    因此，作为一种科学方法，需要类人的思维和行动。为了付诸实践，就像孩子通过自己的思考和行动进行经验性学习一样，需要对重复学习和实验的过程进行研究和调查。凯琳·McKeon
    教授将人类的思维和行为分为四类：


    - *类人思考的系统*

    这是一种认知建模方法，用于由 Hodgeland（1985年）和 Bellman（1978年）定义的能够进行类人思考和决策的系统。Haugel（1985年）将这种方法描述为“让计算机思考的令人兴奋的新努力……在完全和字面意义上拥有心灵的机器”，而
    Bellman（1978年）将其描述为“我们认为与人类思维相关的活动的自动化，如决策、解决问题、学习等活动”。这种方法的目的是创建一个基于人工智能的计算机模型，通过实际实验来模拟人类思维。


    - *理性思考的系统*

    这是一种思维法则的思考方法，用于由 Charniak 和 McDermott（1985年）以及 Winston（1992年）定义的具有感知、推理和行为等心理能力的系统，这些能力基于计算模型。这种方法有两个主要障碍。首先，将知识告知并用逻辑符号所需的正式术语陈述出来并不容易，特别是当信息少于
    100 个时。其次，在原则上解决问题与在实践之间存在巨大差异。Charniak 和 McDermott（1985年）研究了使用计算模型模拟心理功能，而 Winston（1992年）研究了使感知、推理和行动成为可能的计算。


    - *类人行动的系统*

    这是一种图灵测试方法，由 Kurzweil（1990年）和 Rich 和 Knight（1991年）定义，其特征是一个允许机器在与人类交流时模仿任何行动的系统。Kurzweil（1990年）将其称为“创造执行人类才能完成的功能机器的艺术”，而
    Rich 和 Knight（1991年）则将其称为“研究如何让计算机在人类方面做得更好”。


    人工智能总结 5


    - *理性行动的系统*

    这是一种理性代理，具有通过计算模型进行智能行动的系统，由 Schalkoff（1990年）和 Luger 和 Stubblefield（1993年）定义。理性代理是指为了获得最佳结果而行动，或者在不确定的情况下获得最佳预期结果。因此，人工智能作为理性代理设计的一种形式，因为正确的推理只是实现理性的有效机制，而非必要条件。总之，人工智能是一个技术或科学领域，研究通过在计算机或系统中实现机器人类认知、推理和学习来产生智能。


    # 1.2 人工智能的历史


    # 1.2.1 人工智能的开端


    人工智能的诞生于 1943 年，Warren McCulloch 和 Walter Pitts 开始研究人工智能。他们对 AI 的研究源于三个来源：脑部生理学和神经元功能的知识；根据
    Russell 和 Whitehead 的命题逻辑形式化分析；以及图灵的计算理论。


