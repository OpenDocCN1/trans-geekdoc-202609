    ## 第 3 章

    ## 深度学习


    ### 3.1 深度学习的定义与概念


    人工智能被定义为对人类判断、行动和认的理解，我们利用这些来赋予机器人类智能¹。最近关于机器学习和深度学习似乎存在很多困惑。因此，简单来说，人工智能是机器拥有人类智能的前提，它必须通过“学习”来产生这种人工智能。其中一类学习是机器学习，而深度学习是类似于机器学习神经网络的一类学习。图
    3-1 显示了这些关系。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_53_0.png)


    **图 3-1** 展示人工智能、机器学习和深度学习之间关系的图示


    > ¹在人工智能中，机器指的是微型计算机、个人电脑、服务器等。


    简而言之，深度学习是机器学习的一个子集，它将人类思维的方式引入计算机。它允许计算机自主学习，并基于用人工神经网络表示人类大脑的高级抽象。神经元是大脑中的神经细胞，是携带电信号信号的独特细胞。大脑是神经元的集合，约有
    1000 亿个细胞和 100 万亿次连接。这些神经元相互连接，结果网络被称为神经网络，而人工创建的则被称为人工神经网络。图 3-2 显示了带有神经元的神经网络。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_54_0.png)


    图 3-2 神经元


    神经元从树突接收信号并通过轴突传输信号，神经元之间存在突触。只有高于或等于阈值的信号会被传输，信息以电信号的形式传输或存储。

    人工智能的流程用数学术语和神经元形式表示，如图 3-3 所示。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_54_1.png)


    图 3-3 神经网络建模示例


    > 抽象总结了大量数据或复杂数据的关键内容或功能


    深度学习技术已被 Google、Facebook、Amazon 等全球 IT 公司广泛使用，并被认为在自然语言处理中特别有效，例如模式识别、照片识别、语音识别和机器翻译。


    深度学习分为感知机、多层感知机和现有的深度学习模型。


    ### 3.1.1 感知机


    神经网络的起源可以追溯到 Frank Rosenblatt 在 1958 年提出的感知机。感知机背后的概念是，对于 $n$ 个输入，每个输入都被加权，并产生一个输出。这就是神经元以电信号传输信息的方式。也就是说，对于使用标记训练数据的监督学习模型，训练数据会调整每个输入的权重，直到预测值等于特征值对应的实际结果。当神经元接收到输入信号时，它通过树突和轴突传输信号，感知机对输入进行加权。图
    3-4 显示了感知机的概念。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_55_0.png)


    图 3-4 感知机的概念


    图 3-4 中 (a) 和 (b) 的区别在于，在 (b) 中，为 $n$ 个输入信号每一个分配了一个权重。当计算后的信号和超过阈值时，感知机输出 1，否则输出
    0 或 -1。


    由于权重划分了阈值的边界，权重充当了输入对输出影响程度的参数。因此，这可以被归类为线性分类模型，它区分了值在阈值之内和不在阈值的情况，因此它也可以被视为监督学习的形式。


    换句话说，将输入值或神经元输入网络输入函数，进行加权并变为单个值。网络输入函数被定义为结合加权输入的一个函数，如果结果大于阈值，则输出 ''1''，否则输出
    ''-1''（图 3-4）。感知机标志着人工神经网络的开始，但与所有开始一样，感知机在解决非常简单的 XOR 模型时开始显示出局限性。因此，多层感知机应运而生。


    ### 3.1.2 多层感知机


    引入多层感知机是为了克服感知机的缺点。感知机无法学习如 XOR 这样的东西，但通过多层感知机，解决方案被证明是异常地简单。多层感知机有几层，而不只有一层。因此，它有许多称为隐藏层的中间层，隐藏层越多，分类能力的提升就越大。图
    3-5 显示了多层感知机的概念。


    多个感知机的引入解决了问题，但随着隐藏层数量的增加，权重也增加了，这种学习变得困难。为了解决这个问题，应用了类似于控制理论中反馈控制理论的反向传播法，使多层感知机学习成为可能。


    在深度学习领域，对这些各种方法进行了持续研究，随着对旧控制理论方法的重新审视，新的人工神经网络出现了。玻尔兹机³ 作为一种无监督学习方法被提出并引起了学术界的关注。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_57_0.png)


    图 3-5 多层感知机概念图


    ![](img/3c3c87d78136583581b0cf0620f5ae66_57_1.png)


    图 3-6 无监督学习的表示


    图 3-6 显示，Hinton 和 Terry 先对无标记数据进行了充分的学习，然后进行监督学习。

    这种方法解决了多层感知机的许多缺点，许多问题可以通过使用无标记数据进行无监督训练来解决。


    ## 机器学习：概念、工具与数据可视化


    ### 3.2 人工神经网络的类型


    人工神经网络有很多类型。它们由多个复杂的输入、定向反馈回路（单向或双向）以及各种层组成。然而，人工神经网络通常分为 DNN（深度神经网络）、CNN（卷积神经网络）和
    RNN（循环神经网络）。


    ### 3.2.1 DNN


    从感知机的角度来看，人工神经网络包含至少一个输入和一个输出层，之间至少有一个中间层。但在 DNN 中，输入层和输出层之间有多个隐藏层。


    基本上，DNN 是 RBM⁴，即一种去除了玻尔兹机层内连接的模型。RBM 是一种基于可见层和隐藏层组成的无向二分图形状机器，在通过先验学习进行某些修正后，通过微调过程计算最终权重。因此，即使没有足够的标记数据集，DNN
    也是一种适用的方法。


    图 3-7 显示了 DNN 模型。


    ![](img/3c3c87d78136583581b0cf0620f5ae66_58_0.png)


    图 3-7 常见 DNN 模型


    > ^4受限玻尔兹曼机（RBM）是 Geoff Hinton 提出的一种模型，可用于降维、分类、线性回归、协同过滤、学习和主题建模的算法。


