    # Machine Learning: Concepts, Tools and Data Visualization


    Classification models are divided into various models according to the algorithms
    used. Among them, K-Nearest Neighbor, Support Vector Machine, and Decision Tree
    models are the most typical.


    # (1) K-NN model


    The K-NN (K-Nearest Neighbor) model used in classification is one of the most
    intuitive and simple of the machine learning models. The K-NN is a nonparametric
    method used for classification and regression. In both cases, the input consists
    of the k-closest training examples in the feature space. The output depends on
    whether K-NN is used for classification or regression: In K-NN classification,
    the output is a class membership. An object is classified by a plurality of its
    neighbors, the object assigned to the class most common among its k-nearest neighbors
    (a positive integer, typically small). If k=1, then the object is simply assigned
    to the class of that single nearest neighbor. In K-NN regression, the output is
    the property value for the object. This value is the average of the values of
    k nearest neighbors. K-NN is a type of instance-based, or lazy learning, where
    the function is only locally approximated and all computation is deferred until
    classification. The reason for this is that the computer does not learn beforehand,
    but retains the data necessary for learning in its memory, and then starts to
    generalize when an instance occurs.


    K-NN is an algorithm that classifies using labeled data.


    For this purpose, the characteristics of the labeled learning data are quantified
    and then expressed in the coordinate space. The virtual circle extends around
    the new data point, searching for nearby data points to compare it to. When the
    nearest data point to the new data point is found, the group (label) to which
    the nearest data point belongs the group associated with the new data point (when
    k=1). In the same way, the virtual circle is expanded until more nearby data points
    are found. The new data point is then classified as belonging to the group that
    contains the most nearby data points. Figure 2-4 shows the classification process
    of the K-NN algorithm.


    In K-NN, K looks for as many adjacent data as K to identify the group to which
    the new data belongs. But before selecting K, it is necessary to select the distance
    scale. Therefore, the concept of proximity should be based on a standard, and
    this is defined as Euclidean distance. When defining Euclidean distance, the unit
    must be considered. The units associated with coordinates must be distances, but
    other units can also represent memory and weight, for instance. In addition, the
    distance in coordinates may change according to the unit. Therefore, the unit
    chosen with regard to the data is critical when defining the K-NN algorithm.'
