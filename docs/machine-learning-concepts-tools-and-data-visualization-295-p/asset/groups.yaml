    # Machine Learning: Concepts, Tools and Data Visualization


    Regarding machine learning, Arthur Samuel said it was a research area designed
    to give computers the ability to learn without explicitly coding programs. Tom
    Mitchell, “A computer program is said to learn from experience E with respect
    to some class of tasks T and performance measure P, if its performance at tasks
    T, as P improves with experience E.” For example, when a computer is trained to
    recognize letters, the machine classifies the newly typed letters (T) and experiences
    learning from pre-processed data sets (E). To do (P) is to say that the computer
    ‘learned.’ Ultimately, it is a way to improve the performance of a task experience.


    # 2.1.1 Machine Learning and Data Mining


    Machine learning is often mixed with data mining, probably because it uses the
    same methods, such as classification and clustering. In other words, solving problems
    using techniques, models, and algorithms as classification, prediction, and clustering
    is called machine learning in the field of computer science, and data mining in
    the field of statistics. The combination of machine learning and data mining began
    in the 1990s when computer scientists sought more efficient solutions for handling
    statistics when researching practical machine learning.


    The main difference between machine learning and data mining is that data mining
    focuses on discovering attributes, which are characteristics of data, while machine
    learning focuses on prediction using attributes known through training data.


    Figure 2-1 shows that machine learning and data mining use the same algorithms,
    but computer science focuses on prediction, while machine learning focuses on
    attribute discovery.


    # 2.2 Classification of Machine Learning


    Machine learning distinguishes between supervised learning and unsupervised learning,
    depending on whether the learning data has a label. The most significant difference
    between supervised learning and unsupervised learning is that in supervised learning,
    a label is provided. A label is an attribute that defines the class an instance
    from the training data belongs to.


    Figure 2-2 shows the classification of supervised and unsupervised learning.


    > mining is the process of discovering patterns in large data sets involving methods
    at the intersection of machine learning, statistics, and database systems.'
