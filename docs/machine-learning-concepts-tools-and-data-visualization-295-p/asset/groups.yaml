    # (3) Decision Tree


    Named as because of its tree-like appearance, decision trees analyze the data
    points and present patterns that exist between them as a combination of predictive
    rules. It is a predictive modeling approach used in statistics, data mining and
    machine learning.


    Decision trees can also be used for classification and regression. Decision trees
    are used when you want to find out which group the data belongs to. They work
    by dividing the data points into several groups with particular characteristics
    and finding the characteristics of each group. It can be used to find rules which
    can be used to predict future events.


    # 2.3.2 Regression


    Regression analysis is a set of statistical processes for estimating the relationships
    among variables. Regression infers the “function relationship”, which determines
    which function generates the given data. Today, regression is the most used statistical
    model as a result of its use in a variety of areas, including economics, medicine,
    and engineering.


    Regression is used to express a hypothesis and is also used as a predictive model
    in supervised learning in machine learning. For example, as in the case of statements
    like “If you eat a lot, you gain weight fat,” or “If the speed of the car is high,
    the probability of accidents is high”, when there is a high degree of input, there
    will be a high degree of output.'
