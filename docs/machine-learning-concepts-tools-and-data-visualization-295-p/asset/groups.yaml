    \n图 11-30 显示折线图。折线图适用于确定数据趋势。\n\n图 11-31 显示面积图。面积图有助于识别数据随时间的变化幅度。\n\n![](img/3c3c87d78136583581b0cf0620f5ae66_243_0.png)\n\
