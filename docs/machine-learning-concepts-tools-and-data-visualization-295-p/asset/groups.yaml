    |---|---|

    | Result | Predict one of the labels in the training data (discrete) | Prediction
    of continuous values |

    | Example | When the training data is A, B or C, the result is one of A, B, or
    C ex. Spam filtering on e-mail | The result can be any value ex. Stock price analysis
