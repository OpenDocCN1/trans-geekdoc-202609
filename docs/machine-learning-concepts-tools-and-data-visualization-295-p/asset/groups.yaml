    平台提供的 600 多项服务中，本书将重点介绍其中之一：Azure Learning Studio。机器学习有很多开源库和工具，为什么要使用 Azure Learning
    Studio 呢？答案在于 Azure Learning Studio 解决了以下问题：


    - 计算资源缺乏灵活性

    - 配置用于学习的基于 GPU 的环境困难

    - 学习工具的安装和设置困难

    - 实验记录和版本控制困难


