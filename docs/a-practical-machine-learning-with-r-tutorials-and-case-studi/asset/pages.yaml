  md: '# 4.7 Using Tidymodels for k-Nearest Neighbors


    4.7 Using Tidymodels for k-Nearest Neighbors


    This section will use R and a k-Nearest Neighbors model to classify wines into
    red and white wines based on only two chemical properties (Acidity and Sulfur).
    In Section 4.9, you will work with an interactive project and extend the analysis
    using more chemical properties.


    # 4.7.1 The tidymodels Package


    In the following chapters of this book, we will utilize the R tidymodels package
    for our analysis, before we develop our first machine learning model, we will
    provide a brief overview of the tidymodels package.


    tidymodels package provides a workflow with standardized syntax for a wide variety
    of machine learning models and data engineering tasks. This avoids learning new
    commands and workflows each time you use a new machine learning model or R package.


    +   - Randomly dividing observations into recipes for training and testing datasets.

    - Pre-processing data with recipes-where each recipe contains one or more step_commands
    to successively process the training and testing data in exactly the same way.
    These step_commands are available for various tasks. For example, step_naomit()
    for Z-normalization, step_normalize() can be used. You can find a list of data
    pre-processing steps: https://tidymodels.org/find/recipes/

    - Creating machine learning model-designs with only standardized commands. At
    the time of writing this book, Tidymodels supported more than 40 different machine
    learning models. Rather than building and coding these models separately, the
    tidymodels package wraps around existing machine learning packages and their models.
    The wrapper translates the tidymodels commands internally to a code required by
    the related package (machine learning model) and then executes the machine learning
    model. You can find a list of available machine learning at: https://www.tidymodels.org/find/parnip/#models

    - Tuning Hyper-parameters to choose hyper-parameters that need to be determined
    before the model is calibrated with the training data.

    - Assessing prediction quality of trained machine learning models with a set of
    predefined metrics.'
  merge: -1
