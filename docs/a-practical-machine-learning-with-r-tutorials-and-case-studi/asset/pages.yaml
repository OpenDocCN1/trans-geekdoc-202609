    FIGURE 2.1 Artificial Intelligence, Machine Learning, and Deep Learning


    Processing), Optical Character Recognition (OCR), self-driving cars, as the systems
    that can produce art (see, for example, Dall-E).¹


    Machine Learning is a sub-field of AI. It is data-based rather than rule-based.


    Data-based systems create the rules based on training data that are used to calibrate
    the machine learning model. Based on the training data, the algorithm finds the
    underlying rules internally.


    In contrast, rule-based systems rely on experts to define rules that determine
    what to do in that situation. Rule-based systems are not considered machine learning.


    Well-known machine learning algorithms include Ordinary Least Square (OLS) Regression,
    Logistic Regression, k-Nearest Neighbors, Neural Networks, Random Forest, and
    various cluster algorithms.


    Deep Learning is a sub-field of machine learning. It uses Neural Networks as the
    core methodology.


    > ¹ Dall-E is an AI system that can create realistic images and art from a description
    in natural language (see https://openai.com/dall-e-2/).'
