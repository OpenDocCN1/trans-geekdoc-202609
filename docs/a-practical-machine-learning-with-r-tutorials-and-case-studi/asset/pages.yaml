    ```\n\n# Activity of Hidden Neuron 2\n\n```\n$$ + \\frac{0.9}{1 + e^{-(0.1 + 0.8\
    \ - 0.3 + 0.6)}}$\n```\n\nNote the *effective inputs* are highlighted for better\
