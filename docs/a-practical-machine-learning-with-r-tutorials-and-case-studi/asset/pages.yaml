- pgno: 265
  md: "# 9.5 Build a Simplified Neural Network Model\n\nYou can find a link to a related\
    \ blog post and a simulation app that allows you to interactively adjust the $\b\
    eta$ values for the Neural Network from Figure 9.6 in the Digital Resource Section\
    \ 9.9.\n\nIt is important to mention that the procedure above is more like a proof\
    \ of concept than a real proof. The procedure shows only one way a Neural Network\
    \ can possibly operate. It is not likely that the parameters determined by the\
    \ Optimizer will actually form a staircase-like structure. Also, the mathematical\
    \ proof of Hornik et al. (1989) is better and more advanced.\n\nNow that we know\
    \ that Neural Networks with enough neurons can approximate any dataset to a very\
    \ high degree, the crucial question is, how well our fitted Neural Network can\
    \ predict the testing data — the Neural Network has never seen before.\n\nIn the\
    \ code block below, we use the augment() and the metrics() commands as when evaluating\
    \ training data performance, except that we evaluate the testing data (DataTest):\n\
    \n```\nDataTestWithPredNN=augment(ModelNN, new_data=DataTest)\nmetrics(DataTestWithPredNN,truth=Price,estimate=.pred)\n\
    ```\n\n```\n## A tibble: 3 x 3\n## .metric estimator 3 x 3\n## .chr <chr> <dbl>\n\
    ## 1 rmse standard 2202.\n## 2 rsq standard 0.709\n## 3 mae standard 1273.\n```\n\
    \nThe prediction result is not good. For instance, for the testing data, the mae,\
    \ our model on average/underestimates a diamond's price, is $1,273. This is a\
    \ typical case of overfitting; the training data approximation is (mae = 110.94),\
    \ the prediction quality based on the testing data is poor.\n\nNeural Networks\
    \ with a large number of parameters are prone to overfitting, especially when\
    \ the training dataset is relatively small.\n\nSection 9.7 will guide you through\
    \ an interactive project where you can tune a Neural Network to avoid overfitting.\
    \ You will use the diamonds dataset and utilize all four diamond attributes (Carat,\
    \ Clarity, Cut, and Color) as predictor variables. You will also use PyTorch with\
    \ the brute force instead of meet."
  merge: -1
  img_proc: true
