    ProbLight = 3.65 / 10 \cdot 10 \cdot 10 \cdot 10 \cdot 10 \cdot 10 \cdot 10 \cdot
    10 \cdot 10

    ProbLight = 3.65 / 10^6

    ProbLight = 3.65 \cdot 10^{-9}

