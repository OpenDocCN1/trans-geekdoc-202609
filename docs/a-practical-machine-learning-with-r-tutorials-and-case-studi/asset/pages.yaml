    # Numerical Data Type


    In the following exercises, you will assign numerical values to R objects and
    work with numerical objects and values.


    We can assign a value to an R object using the “=\”-sign. Remembering to interpret
    the "="sign as “assigned to” rather than an “equal to” sign in algebra is important.


    As mentioned before, an alternative to using the “=” symbol is the “<-” symbol.
    The latter emphasizes an assignment rather than an equality. However, throughout
    this book, we will use the “=\-symbol for simplicity, keeping in mind that it
    stands for assigned to.


    # Exercise 4:


    Below you find an example of how to assign a value of 23 to a variable called
    A, and then add 100 to this value:


    ```

    A=23

    A=A+100

    cat("R object A contains the numeric value", A)

    ```


    Look carefully at Line 2 of the exercise. Given that A=23 from Line 1, Line 2
    does not mean A equals A+100. Otherwise, considering Line 1: 23=23+100 — which
    is clearly not the case.


    The correct way to interpret Line 2 is an assignment. We assign a new value to
    A, which is 100 greater than the old value of 23.'
