    We discuss some more problems related to the interpretability of *Decision Trees*
    in Section 10.3.2. For now, let us focus on predicting the observations from the
    testing dataset.


    We start with taking a random observation from the testing dataset related to
    a nine-year-old boy traveling in *Third Class* and see how to predict his survival:


    From this test data observation, we know already that the boy survived (*Survived
    = TRUE*). However, we are interested in the *Decision Tree''s* prediction (*Survived*).


    Given that the passenger is male, younger than 13 years, and that he travels in
    *Third Class*, we can follow the observations through the *Decision Tree*. Starting
    at the *root node*, it moves to the left (male), then to the right (younger than
    13 years), and to the left (traveling in *Third Class*). The observation ends
    up in the second *terminal node* from the left and is predicted not to survive
    (*Survived = FALSE*).


    However, if you look at the observation above, you can see that the passenger
    actually did survive. So we count this observation as a *False Negative*.²


    If we guide all testing observations through the *Decision Tree*, we can generate
    predictions for all observations and augment the predictions to the testing data
    frame: `DataTest`


    ```

    DataWithPred=augment(WfTitanic, new_data=DataTest)

    head(DataWithPred)

