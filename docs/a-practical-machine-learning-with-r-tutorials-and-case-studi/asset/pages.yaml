  md: '# 6.5 Tuning the Complexity of a Polynomial Model


    # 6.5.2 Creating the Tuning Workflow


    In this and following sections, we will tune the *hyper-parameter* for the polynomial
    degree of the model covered in Section 6.4 using the same dataset. The only exception
    is the number of observations assigned to the training data. Instead of using
    an extremely small dataset, we will use a more realistic dataset. King County
    House Sale dataset (Kaggle (2015)), but now split the 21,613 observations into
    80% training and 20% testing data:


    ```

    library(tidymodels); library(rio); library(janitor)


    DataHousing:

    import("://ai.lang-analytics.com/data/HousingData.csv")

    clean_names(`upper_camel`)

    select(Price, Sqft=SqftLiving)


    set.seed(987)


    Split80<-DataHousing(

