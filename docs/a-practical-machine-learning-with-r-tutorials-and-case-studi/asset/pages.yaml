- pgno: 350
  md: '# 11 Interpreting Machine Learning Results


    Case: 1

    Prediction: 9.23620880622151

    Explanation Fit: 0.68


    ![](img/f240d449191f5add983daf6c380e4fe3_350_0.png)


    FIGURE 11.8 LIME Results for Observation Helga from the Wage Model


    In the upper-left corner of the LIME plot in Figure 11.8, you find the $r^2$ for
    the linear OLS model ($r^2 = 0.68$) and the predicted wage for Helga from the
    original Random Forest model ($pred = 9.24$).


    The bars in the diagram of Figure 11.8, together with the vertical axis labels,
    can be interpreted as:


    +   * The fact that Helga has a high education (Educ = 17) puts her in the upper
    quartile (Educ > 14), and it contributes about $2.50 (exact value is 2.38) to
    her predicted wage.


    +   * The fact that Helga has a high tenure (Tenure = 18) puts her in the upper
    quartile (Tenure > 7), and it contributes $1.50 (exact value is 1.51) to her predicted
    wage.


    +   * The fact that Helga is female, deducts about $1.50 (exact value is 1.53)
    from her predicted wage.


    If we retrieve the intercept from the linear OLS prediction from the LIME object


    ```

    cat("The Intercept from the linear OLS model is:",nLimeResults$model_intercept)

    ```'
