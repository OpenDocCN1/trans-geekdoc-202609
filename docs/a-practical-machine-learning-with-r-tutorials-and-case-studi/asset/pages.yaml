  md: '# 11.5 Visualizing the Impact of Changing Predictor Variables 309


    A Ceteris Paribus plot interprets the prediction for a specific observation (local
    interpretation). What if we want to get a global interpretation of the whole prediction
    model? The following section provides a tool for this purpose.


    # 11.5.2 Partial Dependence Plot


    The idea behind Partial Dependence Plots is first to create a Ceteris Paribus
    plot for every or at least many observations from the training dataset and create
    an ensemble of these individual plots.


    You can see the individual Ceteris Paribus plots in Figure 11.2 as the light grey
    lines. Each line represents a Ceteris Paribus plot for one of the training observations.
    The ensemble of grey lines in Figure 11.2 is called Individual Conditional Expectation
    (ICE) plot.


