    # Vector-Objects


    You learned that a sequence of numerical, character, or logical objects is a vector
    object.


    For the following exercises, we created four related vector objects: VecFirstNames,
    VecAges for their age, VecIsFemale to identify if sex is female (or not), and
    VecNumKids for the number of children they have. To assign values to the vector
    objects, we use the c(combine) command:


    ```

    VecFirstNames=c("Carsten", "Jose", "Jane")

    VecAges=c(45,54,23)

    VecIsFemale=c(FALSE,FALSE,TRUE)

    VecNumKids=c(1,2,1)

    ```


    The four vector objects are related because we used the same order for their values.
    The first value belongs to Carsten, the second value belongs to Jose, and the
    third to Jane. Therefore, we can deduce Jose is 54 years old, his sex is male
    (Female), and he has two kids.


    It is a little cumbersome that we always have to track the order of elements to
    interpret the vector values correctly. Fortune, this gets much easier when we
    use data frames in the following exercise section.


    For now, we just assume the order in each of the three vectors is the same and
    see what we can do with the vector-objects.'
