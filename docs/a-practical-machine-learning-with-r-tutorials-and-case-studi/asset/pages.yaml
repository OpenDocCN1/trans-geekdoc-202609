    \n## 2-sample test for equality of proportions\n## continuity correction\n##\n\
    ## data: c(FemSurv, MaleSurv) out of c(FemTotal, MaleTotal)\n## X-squared = 258,\
    \ df = 1, p-value < 2e-16\n## alternative hypothesis: two.sided\n## 95 percent\
    \ confidence interval:\n## 0.4913 0.6124\n## sample estimates:\n## prop 1 prop\
    \ 2\n## 0.7528 0.6193\n```\n\nReading the output backward, starting with the last\
    \ line, allows us to develop the final result step-by-step. The last line from\
    \ ModelPropFemaleVSMale object shows the different survival rates for female and\
    \ male passengers. The difference between these two survival rates is around 0.55.\
    \ The 95%-confidence interval ranges from 0.49 to 0.61. The probability of this\
    \ difference being zero (both survival rates would be the same) is expressed by\
    \ the P-value in Line 6 of the output. As the P-value shows, probability for the\
