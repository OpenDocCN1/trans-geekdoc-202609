  md: '3.2 Install and Set Up R and RStudio


    # 3.2 Install and Set Up R and RStudio


    A typical setup to work with R consists of two components:


    +   1. The R software which executes R code.

    2. RStudio, where you can write, debug, and test R code.


    These components are two different programs. Therefore, R and RStudio need to
    be installed separately. It is crucial to install R before RStudio.


    You can download R at: https://cran.r-project.org/bin/


    You can download RStudio at: https://www.rstudio.com/products/rstudio/download#download.


    If you have an older version of R or RStudio installed, upgrading to the latest
    version is highly recommended. Use your system''s uninstall procedure to uninstall
    R and RStudio before installing the latest versions. If you do not uninstall your
    old R version, the new version of R will be installed parallel to your old version,
    which is, in most cases, undesirable.


    Links to detailed installation guides are provided in the Digital Resource Sec-3.12
    at the end of this chapter.


    # 3.3 RStudio the Integrated Development Environment (IDE) for R


    RStudio is a software development environment that assists in writing R code in
    a straightforward and user-friendly way. It is the most commonly used IDE for
    the R language.


    # 3.3.1 The Window Layout in RStudio


    Regardless, if R and RStudio are installed on Windows, macOS, or Linux, the RStudio
    windows will look similar to the ones displayed in Figure 3.1.


    The lower-left window contains the R Console: Here, the user can execute R code
    by typing the code. For example, the user can type 1+2 and hit the Enter (return
    on Mac). R then executes the code and displays 3 as the result.'
