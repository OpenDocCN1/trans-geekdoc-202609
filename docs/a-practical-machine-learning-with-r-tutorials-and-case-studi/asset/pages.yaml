    In the code block below, we start with the workflow() command, and we add the
    recipe add_recipe(RecipeWine) and the model design add_model(ModelDesignKNN) to
    the workflow. Then we fit the workflow to the training data with fit(DataTrain)
    and save the fitted workflow model into the R object WFModelWine. We decided to
    build the object name with WFModelWine to indicate that this R object is a workflow
    model ready to be used for predictions.


    ```

    WFModelWine<-workflow()

    add_recipe(RecipeWine)

    add_model(ModelDesignKNN)

    fit(DataTrain)

    ```


    # ## 4.7.6 Predicting with a Fitted Workflow Model


    In this section, we will use the fitted workflow model from the previous section
    to predict the WineColor for the observations of the testing dataset DataTest.


    We use testing rather than training dataset because we want to assess the model''s
    prediction quality rather than how well the model can approximate the training
    data.


    To predict the wine color of different wines based on their acidity and sulfur
    dioxide content, we can use the predict() command. As you can see in the code
    block below, the predict() command only requires two arguments: the name of the
    trained workflow WFModelWine and the name of the data frame that contains the
    predictor variables for the prediction (DataTest):


    ```

    DataPred<-predict(WFModelWine, DataTest)

