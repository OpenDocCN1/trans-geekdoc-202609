  md: "# 2.4 Machine Learning Terminology\n\nvariable: $Sqft_i$). If the square footage\
    \ of this house is $Sqft_i = 2000$, a machine learning model might predict a price\
    \ of $750,000 (outcome variable $Price_i = 750,000$). Suppose we know from the\
    \ data that the true value for the outcome variable is $800,000 ($Price_i = 800,000$),\
    \ then we know that we underestimated the house price by $50,000 (more about prediction\
    \ errors in Section 5.3).\n\n**Model:** A model is what we use to predict the\
    \ value of an outcome variable based on values of predictor given certain assumptions.\n\
    \nSuppose we try to predict home prices based on the square footage of houses\
    \ using $OLS regression$, which assumes the relationship between the outcome price\
    \ $Price_i$ and the predictor square footage $Sqft_i$ is linear. Then the related\
    \ model could be expressed as:\n\n$Price_i = \beta_1 Sqft_i + \beta_2$$\n\nEquation\
    \ (2.1) is our model. It models the relationship between the predictor $Sqft_i$,\
    \ and the outcome $Price_i$. The model leads to a prediction of the house price\
    \ ($Price_i$). We can use Equation (2.1) to calculate a predicted price for any\
    \ value of the predictor variable $Sqft_i$, if we know the values for $\beta_1$\
    \ and $\beta_2$.\n\n**Fitted vs. Unfitted Model:** Let us return to the model\
    \ from Equation (2.1). Can we use the model to predict the price of a house if\
    \ we know the house's square footage? The answer is “no” because we do not know\
    \ the values for the $\beta$s (the parameters of the model).\n\nHowever, we can\
    \ use a machine learning algorithm to determine the values for the parameters\
    \ (the $\beta$s). Machine learning algorithms often generate parameters that minimize\
    \ the (squared) prediction error. Using the values for the parameters (the $\b\
    eta$s) provided by the machine learning algorithm allows for predicting the outcome\
    \ variable based on the value(s) of the predictor variable(s).\n\nFor example,\
    \ suppose an $OLS$ algorithm based on provided data determines $\beta_1 = 300$\
    \ and $\beta_2 = 150000$ then our model would look like:\n\n$Price_i = 300 - Sqft_i\
    \ + 150000$$\n\nA model where the parameters (the $\beta$s) have been determined\
    \ by a machine learning algorithm based on training data like the one in Equation\
    \ (2.2) is called a **fitted model**. A model where the parameters have yet to\
    \ be determined and that, therefore, cannot be used for prediction (yet) is called\
    \ an **unfitted model** (e.g., Equation (2.1))."
