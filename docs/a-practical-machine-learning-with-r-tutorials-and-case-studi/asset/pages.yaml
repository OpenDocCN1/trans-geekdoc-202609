- pgno: 26
  md: "For instance, the fitted model displayed in Equation (2,2) can be used to predict\
    \ the price for a house with a square footage of 2,000 sqft (predictor: $Sqft_i\
    \ = 2,000$, predicted outcome: $Price_i = 750,000$).\n\n**Parameters:** Parameters\
    \ are the $\beta s$ of a model. Machine learning algorithms generate the best\
    \ parameter values according to a predefined goal (e.g., minimize the average\
    \ squared error for all predictions for the provided dataset).\n\nConsequently,\
    \ machine learning can be (over)simplified into the following three steps:\n\n\
    +   1. Determine the model (most models are more complex than the one in Equation\
    \ (2.1)).\n\n+   2. Use a machine learning algorithm to determine the optimal\
    \ $\beta s$ to create a fitted model.\n\n+   3. Use the fitted model to predict\
    \ values for the outcome variable based on predictor variables.\n\n**Training\
    \ Data:** Calibrating the parameters ($\beta s$) of a machine learning model is\
    \ a critical step in the model calibration process. This process is called training\
    \ a model and requires training data. A training dataset consists of the known\
    \ values of the predictor variables and the corresponding known values of the\
    \ outcome variable. The training process calibrates the parameters to minimize\
    \ the difference between the model's predictions and the actual values of the\
    \ outcome variable from the training data. In other words, the training process\
    \ strives to minimize the prediction error (more about training data in Chapter\
    \ 6.3).\n\n**Testing Data:** When using the training data to calibrate the parameters,\
    \ but not all of the observations are used. Those observations that are not used\
    \ for training constitute the testing data. About 10%-40% of the total observations\
    \ are commonly used as testing data. They are usually randomly chosen from the\
    \ complete dataset. Testing data are never used to optimize model performance\
    \ in any way. Instead, they are a holdout dataset used to assess the predictive\
    \ quality of a model.\n\nNote, using training data to assess predictive quality\
    \ is not an option! This is because we would measure how well the model can approximate\
    \ the data it was trained with rather than assessing the predictive quality on\
    \ new data. That is, the testing data the model has never seen before (more about\
    \ testing data in Chapter 6.3)."
