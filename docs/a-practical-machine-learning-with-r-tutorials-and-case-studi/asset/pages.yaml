  md: '# 3.9 Data Wrangling with the tidyverse Package


    This command structure will help us when piping the commands select(), filter(),
    and mutate() together.


    ![](img/f240d449191f5add983daf6c380e4fe3_55_0.png)


    FIGURE 3.4 Piping in a Flowchart


    The idea behind piping "=" is displayed for our example in Figure 3.4:


    +   i) Left of the "=\-sign is the data frame that will eventually contain the
    result (DataFinalResults).

    ii) The right of the "=\-sign starts with the name of the data frame that is processed:
    DataTitanic.

    iii) The piping operator | pushes the data frame DataTitanic as the value for
    the first argument into the select() command. Consequently, the first argument
    in the select() command — the data argument — is omitted.

    iv) The output of the select() command is a data frame containing the variables
    Survived, Sex, Age, and FareInPounds.

    v) The piping operator | then pushes the output of the select() command into the
    filter() command as the value for its first argument (data argument). Therefore,
    the data argument itself is omitted in filter().

    vi) The filter() command pushes for female passengers and creates all female data
    frame.

    vii) The all-female data frame is pushed by the piping operator | as the first
    argument into the mutate() command.'
