    # 7.4 The Idea Behind Regularization


    In Chapter 6, we tuned hyper-parameters to avoid overfitting. In this chapter,
    we will tackle the problem with regularization.


    # Regularization


    Regularization is a technique applied during a model''s calibration. The goal
    is to generate optimal model-parameters (λ) that are smaller than the ones from
    the related unregulated model — possibly zero.


    Small model-parameters weaken the influence of the associated predictor variables
    or eliminate them if the parameter is zero.


    A model with fewer variables or seriously weakened influence of some variables
    is less flexible, and therefore overfitting becomes less likely.


    In essence, regularization minimizes or eliminates the influence of predictor
    variables with little explanatory power on the output variable, thereby improving
    predictive performance.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "# 7.4 The Idea Behind Regularization\n\nThe goal of $regularization$ — to generate\
    \ smaller or zero $\beta$ parameters — leads to the following question:\n\nHow\
    \ we influence the Optimizer to produce smaller model-parameters than the ones\
    \ that minimize the Mean Squared Error?\n\nThe answer is that we must give the\
    \ $Optimizer$ a different goal. Such a goal is formalized in the target function:\n\
    \n```\n$T^{target} = \\frac{1}{20}\\sum_{i=1}^{20} (Price_i - Price_i^*)^2 + \\\
    lambda Penalty \\quad (7.3)$\n```\n\nwith:\n$Price_i = \\beta_1 Sqft_i + \\beta_2\
    \ Sqft_i^2 + \\beta_3 Sqft_i^3 + \\beta_4 Sqft_i^4 + \\beta_5 Sqft_i^5 + \\beta_6$\n\
    \nYou can see now that the target function consists of the $MSE$ and a $penalty$\
    \ term ($Penalty$). Hence, we call it a $target$ function rather than an $error$\
    \ function. The goal for the $Optimizer$ is twofold:\n\n+   - Minimizing the $MSE$.\n\
    - Minimizing a penalty value which is high when the $model$-parameters (the $\b\
    eta s$) are large and low otherwise.\n\nThe $MSE$ and $P^{penalty}$ will still\
    \ only depend on the values for the $\beta s$. Therefore, the $Optimizer$ can\
    \ minimize the target function (7.3) as with systematic $trial-and-error$.\n\n\
    The $hyper-parameter \\lambda$ $(0 \\le \\lambda < +infty)$ determines the strength\
    \ of the $P^{penalty}$ relative to the $MSE$.\n\nTwo major approaches exist to\
    \ quantify the $penalty$:\n\n**Lasso:** The $penalty$ is calculated as the sum\
    \ of all (absolute) $\\beta$ values, except the one for the intercept $(\\beta_0)$:\n\
    \n```\n$P^{penalty}_{Lasso} = \\sum_{j=1}^{5} |\\beta_j| \\quad (7.4)$\n```\n\n\
    While reducing a large or a small $\\beta$ by the same amount has the impact on\
    \ the $penalty$.\n\n**Ridge:** The $penalty$ is calculated as the sum of all squared\
    \ $\\beta$ values, except the one for the intercept $(\\beta_0)$:\n\n```\n$P^{penalty}_{Ridge}\
    \ = \\sum_{j=1}^{5} \\beta_j^2 \\quad (7.5)$\n```"
  merge: -1
  img_proc: true
- pgno: 194
  md: "# 178    Ridge, Lasso, and Elastic-Net — Regularization Explained\n\nNote that\
    \ because of the squaring of the $\\beta s$, large parameters have overproportional\
    \ impact on the penalty. Thus, reducing a large $\beta$ parameter by one unit\
    \ has a bigger impact on the penalty than reducing a smaller $\beta$ parameter\
    \ by one unit. We will see later that this is an important difference between\
    \ Lasso and Ridge.\n\n# 7.4.1 Lasso Regularization\n\nWhen you substitute the\
    \ definition for the Lasso penalty from equation (7.4) into the target function\
    \ (7.3) you get your target for the Lasso approach:\n\n```\n$T^{target}_{Lasso}\
    \ = \\frac{1}{20}\\sum_{i=1}^{20}(Price_i - Price_i)^2 + \\lambda\\sum_{j=1}^{5}|\\\
    beta_j| \\quad MSE_{OLS}\\quad (7.6)\n```\n\nwith:\n$P^{penalty}_{Lasso} = \\\
    beta_1Sqft_1^2 + \\beta_2Sqft_2^2 + \\beta_3Sqft_3^2 + \\beta_4Sqft_4^2 + \\beta_5Sqft_5^2$,\n\
    \nYou can see that the target $(T_{Lasso})$ only depends on the $\beta$ values\
    \ which causes the values of the houses ($Price_i$) and their square footage ($Sqft_i$)\
    \ are known from the training data. Consequently, the Optimizer can use a systematic\
    \ trial-and-error process to find the $\\beta$ values that minimize the target\
    \ function (7.6).\n\nDuring the process, the Optimizer considers both the MSE\
    \ and $P^{penalty}_{Lasso}$ simultaneously. Therefore for all $\\lambda > 0$ the\
    \ optimal $\beta$ parameters will be smaller than in the case of an unregularized\
    \ optimization $(\\lambda = 0)$.\n\nBelow you will find the code to create a Lasso\
    \ model design and a fitted workflow model. For the recipe that created the various\
    \ powers of Sqft and normalized the resulting predictors, we use the recipe from\
    \ Section 7.3:\n\n```\nlibrary(glmet)\nset.seed(777)\nModelDesignLasso<-linear_reg(penalty=500,\
    \ mixture=1) |>\nset_engine(\"glnet\") |>\nset_mode(\"regression\")\n```\n\n```\n\
    WFModelLasso<-workflow() |>\nadd_model(ModelDesignLasso) |>\nadd_recipe(RecipeHouses)\
    \ |>\nfit(DataTrain)\n```\n\nNote, for the model design we again use the linear_reg()\
    \ command, but in"
