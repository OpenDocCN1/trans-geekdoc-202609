  md: '# 11.8 Local Interpretable Model-agnostic Explanations (LIME)


    workflow mine by extract_fit_engine(), the training data, and statistics calculated
    from the training data.


    ```

    library(Lime)

    set.seed(7777)

    Explainer=lime(DataTrainPredOnly,

    model=extract_fit_engine(WfModelWageRF))

    ```


    Again, the explainer object is only a class that contains the prediction model
    together with statistics about the training data.

    In the code below this explainer object is entered as an argument into the lime::explain()
    command which executes the LIME interpretation.22


    ```

    library(lime)

    set.seed(777)

    ObsHelgaPredOnly=select(ObsHelga, Educ,Tenure, Female)

    LimeResults=lime::explain(ObsHelgaPredOnly, explainer=ExplainerLime,

    n_features=3)

    ```


    Note before executing explain(), we used select() to create a data frame that
    exclusively excludes the predictor variables. This is needed because the lime::explain()
    command expects that type of data frame. We also set the argument n_features=3
    because we want to consider all three predictor variables. For an analysis with
    many predictor variables, only a subset of predictors is reasonable.


    The OLS prediction results are saved in the R object LimeResults. To visualize
    the results in Figure11.8 we use:


    ```

    plot_features(LimeResults)

    ```


    The bar diagram in Figure 11.8 shows the results of the LIME analysis. Each bar
    quantifies the contribution from Helga''s predictor variable values Educ=17, Tenure=18,
    and Female=1 to the predicted wage from the linear OLS model. The latter can be
    retrieved from the OLS object:


    ```

    cat("Helga''s predicted wage from the OLS model is:",nround(LimeResultsmodel_prediction[1,2))

    ```


    ## Helga''s predicted wage from the OLS model is: 7.82


    > 22We prefixed the explain() command with lime:: to determine that we would like
    to use the explain() command from the lime package and not from another package
    such as the tidyverse package or the DALEX package.'
