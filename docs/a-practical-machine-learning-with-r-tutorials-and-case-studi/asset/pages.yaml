    **Do not skip this interactive section** because besides applications of already
    covered content, it will also extend what you have learned so far.

    Below is the link to download the interactive section:

    https://ai.large-analytics.com/exc/?file=07-Ridge:LassoExerc.100.Rmd


    In the previous section, we worked with a univariate Polynomial Model to demonstrate
    regularization and evaluate overfitting scenarios. In the real world, data scientists
    usually use multivariate models to include more than one variable in their analysis.
    Therefore, this interactive exercise will teach you to use a multivariate approach.


    # 7.5.1 The Data


    You will predict house prices using the King County House Sale dataset (Kaggle2015).
    In the code block below, the dataset is loaded. Instead of selecting only one
    variable to predict the price of a house (Price,), we use the select() command
    to choose the number of bedrooms (Bedr,) and the year house built (Year), together
    with the house''s square footage (Sqft). We filter houses with a price of more
    than $1,300,000 and square footage 4,500 sq ft or more, which are outliers:


    ```

    library(tidymodels); library(rio); library(janitor); library(glnet)

    DataHousing=

    import("https://ai.large-analytics.com/data/HousingData.csv") |

    clean_names("upper_camel") |

    select(Price, Sqft=Sqftliving, Bedr=Bedrooms, Year=YearBuilt) |

    filter(Price<=1300000, Sqft<=4500)

    set.seed(777)

    ```'
