  md: '# 272 10 Tree-Based Models — Bootstrapping Explained


    Since we know for each passenger (observation of the testing dataset) if they
    survived or not, and also what the Decision Tree predicted (see the .pred_class
    column), we can generate a confusion matrix and also use the metric_set() command
    to calculate the metrics accuracy, sensitivity, and specificity for the testing
    data.


    ```

    conf_mat(DataTestWithPred, truth=Survived, estimate=.pred_class)


    ## Truth

    ## Prediction TRUE FALSE

    ## TRUE 63 14

    ## FALSE 23 123

    ```


    ```

    metricSetTitanic=metric_set(accuracy, sensitivity, specificity)

    metricSetTitanic(DataTestWithPred, truth=Survived, estimate=.pred_class)


    ## A tittle 3 x 3

    ## ..metric ..estimator .estimate

    ## <chr> <chr> <dbl>

    ## 1 accuracy binary 0.834

    ## 2 sensitivity binary 0.733

    ## 3 specificity binary 0.898

    ```


    With an overall accuracy of 83%, the prediction results are not bad. The model
    worked well in predicting passengers that did not survive (negative class: specificity).
    As you can see, specificity is higher than sensitivity. However, the difference
    is not big enough to consider the dataset as unbalanced.


    This leaves us with one topic that we have not touched so far:


    # How the Optimizer determine the decision rules?


    Decision rules are determined from the top of the Decision Tree down to the bottom.
    The Optimizer starts with finding the best decision rule for the root node, then
    moves down to the child nodes and finds the decision rule for each of the child
    nodes and then for the child nodes of the child nodes.³ The process stops when
    either the maximum level with the hyper-parameter level is reached (level=3 in
    our case) or when splitting a node further no increases the predictive quality.


    Decision rules consist of two components:


    +   1) The splitting variable. That is, the variable used to split the


    > Decision rules of the previous level are never reversed, even if this would
    allow for a better decision rule on the current level. There is no turning back
    to reverse a decision rule on a previous level. This type of algorithm is called
    a greedy algorithm.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 10.3 Decision Trees


    observations from the parent node into the child nodes. For example, Sex, Age,
    or Fare.


    2) The splitting value is relevant for continuous variables. For example, when
    the splitting variable is Age, we have to decide on the passenger''s age that
    determines if an observation is moved to the left or the right child node (13
    years or older for VES in our case; see Figure 10.1).


    To find the best splitting variable with the best splitting value, the Optimizer
    compares all combinations of splitting variables and splitting values.4


    # What criterion determines if a splitting variable/value combination is good?


    The Decision Tree algorithm from the r package uses Gini Impurity as a criterion
    for classification problems. Other measures that can be set Information Gain and
    Chi-Square.5 Here we focus on Gini Impurity.6


    The Titanic passengers were different in many ways. Some of their differences
    (e.g., their Sex) were crucial for survival, while others were less important.
    When we split a parent node (for instance, the root node) into two child nodes,
    we want the two nodes to be as different as possible regarding survival proportions.
    Ideally, we would like to get one child node with a survival proportion of 100%
    and the other with 0%. In that case containing one group of survivors and another
    group of non-survivors, Gini Impurity would be somewhat at the lowest level for
    both child nodes.


    Let us follow this unrealistic path by assuming that all men on the Titanic died
    and all women survived. A decision rule of Sex=male would create two pure nodes
    containing only non-survivors and the other containing only survivors. GiniImpurity
    should be 0 for both pure child nodes.


    Gini Impurity for an individual node is defined by the product of the proportions
    for the observation between two different classes (P_{Surv} and P_{NonSurv}),
    multiplied by two. In one case:7


    ```

    $G^{Imp} = 2P_{Surv}P_{NonSurv}$. (10.1)

    ```


    In our example we create two pure child nodes, Equation (10.1) shows the


    4There are a few shortcuts that avoid all variables of a variable as splitting
    values, which these secures the scope of this book.


    5See Sharna (2020) for an intuitive description of the different standards.


    6Singh (2021) provides an intuitive introduction about Gini Impurity.


    7Gini Impurity is calculated for an individual node and estimates "..." the probability
    that two entities taken at random from the dataset of interest (with replacement)
    represent (...) different types*(Wikipedia contributors (2023b).'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# 274 10 Tree-Based Models — Bootstrapping Explained


    Gini Impurity for the female child node would indeed be 0 ($P_{Surv}=1$ and $P_{NonSurv}=0$)
    and the same would be true for the male child node with only non-survivors ($P_{Surv}=0$
    and $P_{NonSurv}=1$).


    Let us use another example for a decision rule on the top level of the Decision
    Tree in Figure 10.1 and see how Gini Impurity changes from the root node to the
    two child nodes. We used type=$0$ instead of $sex=0$. Obviously, this decision
    rule would make little sense, since blue type will not influence the survival
    chance on the Titanic. The proportions of survivors in both child nodes would
    be approximately the same as in the parent node (root node): $P_{Surv}=0.39$ and
    $P_{NonSurv}=0.61$ (see Figure 10.1).


    Equation (10.1) shows that the resulting Gini Impurities would be the for the
    parent node and the two child nodes:


    ```

    $G_{parent}^{Imp} = G_{leftChild}^{Imp} = G_{rightChild}^{Imp} = 2 \cdot 0.61
    - 0.61 = 0.48$

    ```


    The value of Gini Impurity is not so crucial. Where is crucial that the decision
    rule is able to lower the Gini Impurity from the parent node to the child nodes.
    Gini impurity 0.48 in the parent node and the (weighted) average from the two
    child nodes is 0.48. The decision rule is useless!


    Finally, let us review the extreme examples and take a look at the decision rule
    $sex=male$ lower Gini Impurity? We already know from the last example that the
    root node has a Gini Impurity of $G_{root}^{Imp}=0.48$. According to Equation
    (10.1), the Gini Impurity for the left child node is (see Figure 10.1):


    ```

    $G_{male}^{Imp} = 2 \cdot 0.2 - 0.8 = 0.32$

    ```


    The Gini Impurity for the right child node is:


    ```

    $G_{female}^{Imp} = 0.73 \cdot 0.27 - 0.29 \cdot 0.37 = 0.35$

    ```


    The Gini Impurity for a decision rule is the average of the two child nodes weighted
    by the proportion of the observations that ended up in the two child nodes:


    ```

    $G_{male/female}^{Imp} = 0.64 \cdot 0.32 + 0.36 \cdot 0.39 = 0.35$

    ```


    Consequently, the decision rule $sex=male$ decreased the Gini Impurity by 0.13
    from $G_{root}^{Imp}=0.48$ to $0.35$.


    We know that the Optimizer calculated the Gini Impurity decrease for all possible
    splitting variable/value combinations. Therefore, a Gini Impurity decrease of
    0.13 must have been the largest. Otherwise, $sex=male$ would not have been chosen
    as the decision rule.'
  merge: -1
  img_proc: true
