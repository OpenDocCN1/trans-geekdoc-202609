    # 4.10.1 How Images Are Stored


    Before working with a k-Nearest Neighbors model, we first need to understand the
    problem we are trying to solve. This is when domain knowledge plays an important
    role. Domain knowledge is the knowledge about a specific field or discipline outside
    of machine learning. In the case of image recognition, domain knowledge involves
    understanding images can be stored in a dataset.


    In general, a gray-scale image can be stored in a raster format. A raster is a
    grid with two dimensions. The MNIST images are stored in a grid of 28 rows and
    28 columns. Each entry in this grid (called a pixel) identifies the brightness
    of the color in each. A value of 0 to 255 indicates black, a value of 255 indicates
    white, and values between 0 and 255 indicate some degree of gray.


    Figure 4.10 shows an example of how a handwritten “9” can be stored in an image
    file. The background colors in the cells of Figure 4.10 are only for demonstration
    purposes. An image file would only contain numbers between 0 and 255 in rows and
    columns separated by commas.


    There is a problem when working with images in a machine learning model. Machine
    learning models usually require that each observation is within a row of a data
    frame and the columns represent predictor variables. As explained above, images
    are stored in a 2D grid.


    The solution is to combine all the rows of an image into one long row of pixels.
    In our case, we start with the first row, append the second row of the image raster,
    append the third row, and so on, until we append the 28th row. Because the images
    initially have 28 rows and 28 columns, each image would be converted to one long
    row consisting of 784 (28-28) columns. This was done with the MNIST dataset. Each
    image is stored in one row. Each of the 784 pixels of an image is stored in one
    of 784 columns. These columns will the 784 predictor variables. The outcome variable
    (called Label) is stored in the first column of the data frame. It contains each
    image’s digit.


    Take a look at Table 4.1, which shows an excerpt from the MNIST data frame for
    the first six images. Note that the table does not show all 784 predictor variables
    (pixels). Instead, it only shows the pixel values for the first three pixels and
    the last two pixels for the six images. These pixels represent the upper-left
    and the right-lower corner for each of the six images. They are all 0 (black)
    because the digits were written with a white pen, and the corresponding pixels
    are more in the center of the image.'
  merge: -1
  img_proc: true
