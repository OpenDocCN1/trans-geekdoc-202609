- pgno: 201
  md: "# 7. The Idea Behind Regularization\n\n# 7.4.3 Elastic-Net — Combining Lasso\
    \ and Ridge\n\nIn the previous two sections, we introduced Lasso and Ridge. Lasso\
    \ tends to reduce $\beta$ parameter values to zero. Consequently, it eliminates\
    \ predictors from the model and makes overfitting less likely. It is the model\
    \ of choice if you want to reduce the number of predictors to those with the strongest\
    \ explanatory power. In contrast, Ridge lowers the $\beta$ parameter variables\
    \ to avoid overfitting without eliminating variables. If you like to keep all\
    \ predictor variables in the model, Ridge is the model of choice to avoid overfitting.\n\
    \nOften, we are ambivalent about keeping all predictor variables or not. The goal\
    \ is to maximize predictive performance and minimize overfitting. Therefore, it\
    \ is often difficult to determine which algorithm is superior. So why not combine\
    \ Lasso and Ridge?\n\nThis is exactly how the Elastic-Net approach does. It uses\
    \ both — the penalty for Lasso and the one for Ridge — adds their weighted average\
    \ to the MSE in the target function:\n\n```\n$T_{Elastic}^{2} = \\frac{1}{MSE}\
    \ \\sum_{i=1}^{20} (Price_{i} - Price_{i})^{2} + \\lambda (\\alpha \\frac{penalty_{Lasso}}{MSE}\
    \ + (1-\\alpha) \\frac{penalty_{Ridge}}{MSE})$  (7.8)\n```\n\n```\n$T_{Elastic}^{2}\
    \ = \\frac{1}{MSE} \\sum_{i=1}^{20} (Price_{i} - Price_{i})^{2} + \\lambda (\\\
    alpha \\sum_{j=1}^{5} |\\beta_{j}| \\frac{penalty_{Lasso}}{MSE} + (1-\\alpha)\
    \ \\sum_{j=1}^{5} \\beta_{j}^{2} \\frac{penalty_{Ridge}}{MSE})$  (7.9)\n```\n\n\
    with: $Price_{i} = \\beta_{1}Sqft_{i} + \\beta_{2}Sqft_{i} + \\beta_{3}Sqft_{i}\
    \ + \\beta_{4}Sqft_{i} + \\beta_{5}Sqft_{i} + \\beta_{6}$\n\nIn Equation (7.5)\
    \ you can see that the penalty for $penalty_{Lasso}$ and $penalty_{Ridge}$ is\
    \ calculated as a weighted average. The hyper-parameter $\\alpha$ ($0 \\le \\\
    alpha \\le 1$) determines the share of the Lasso penalty. For example, if $\\\
    alpha=0.5$ the share of the Lasso penalty is 50% and the share of the Ridge penalty\
    \ $(1-\\alpha)=0.5$ is also 50%. If $\\alpha=0.3$ the share of the Lasso penalty\
    \ is 30%, and the share of the Ridge penalty $(1-\\alpha)=0.7$ is 70%.\n\nThe\
    \ hyper-parameter $\\alpha$ corresponds to the argument mixture in the linear\\\
    _reg() function. Worked with it already in Section 7.4.1 when you set mixture=1\
    \ assigning a share of 100% to the Lasso penalty and a share of 0% $((1-\\alpha)=0)$\
    \ to the Ridge penalty — basically running a pure Lasso model.\n\nIn Section 7.4.2\
    \ you can run a pure Ridge by setting mixture=$\\phi$ ($\\alpha=0$) and thus implying\
    \ the share of the Ridge penalty is 100% $((1-\\alpha)=1)$."
  merge: -1
  img_proc: true
- pgno: 202
  md: "# 7 Ridge, Lasso, and Elastic-Net — Regularization Explained\n\nThe advantage\
    \ of the Elastic-Net approach is that you can run any mixture of Lasso and Ridge\
    \ regularization. The disadvantage is that you get to tune with $\\alpha$ (mixture)\
    \ another hyper-parameter that either needs to be set in the linear\\_reg command\
    \ or needs to be tuned together with the hyper-parameter $\\lambda$ (penalty).\n\
    \nYou will tune these hyper-parameters later in an interactive project with Section\
    \ 7.5. Here, in this section, we implement Elastic-Net into tidymodels by arbitrarily\
    \ setting the hyper-parameters to keep things simple.\n\nThe commands to set up\
    \ a tidymodels workflow for the Elastic-Net model are almost the same as in the\
    \ previous section, except we arbitrarily set penalty=10000 and mixture=0.5.\n\
    \n```\nseed(7777)\nModelDesignElasticNet=linear_reg(penalty=10000, mixture=0.5)\
    \ |>\n  set_engine(\"glmnet\") |>\n  set_mode(\"regression\")\n\nWFModelElasticNet=workflow()\
    \ |>\n  add_model(ModelDesignElasticNet) |>\n  add_recipe(RecipeMouses) |>\n \
    \ fit(DataTrain)\n```\n\nFor the recipe that creates the various powers of the\
    \ Sqft and normalizes the resulting predictors, we can use the recipe from Section\
    \ 7.3.\n\nSince the workflow WFModelRidge is a fitted workflow model (it was calibrated\
    \ with the training data), we can extract the model with the tidy() command:\n\
    \n```\ntidy(WFModelElasticNet)\n```\n\n```\n## # A tibble: 6 x 3\n## term estimate\
    \ penalty\n## <chr> <dbl> <dbl>\n## # 1 (Intercept) 509945. 10000\n## # 2 Sqft\
    \ 151417. 10000\n## # 3 Sqft2 89828. 10000\n## # 4 Sqft3 0 10000\n## # 5 Sqft4\
    \ 0 10000\n## # 6 Sqft5 -58923. 10000\n```\n\nAs expected, the $\beta$ parameters\
    \ (see estimate column) are much smaller than those from the unregularized benchmark\
    \ model in Section 7.3. The $\beta_3$ and $\beta_4$ parameters were set to zero,\
    \ eliminating the related predictor variables"
  merge: -1
  img_proc: true
