  md: "11.9 When and When Not to Use Interpretation 335\n\n# ## The Intercept from\
    \ the linear OLS model is: 5.463 5.463 5.463\n\nwe can show that the Intercept,\
    \ together with the quantitative impacts from Helga's predictor variables values,\
    \ add up to the prediction of the linear OLS model (.predOLS);\n\n| 5.46 | 2.38\
    \ | 1.51 | -1.53 | 7.82 |\n|---|---|---|---|--|\n| Intercept | ContrEduc | ContrTenure\
    \ | ContrFem | predOLS |\n\n# 11.9 When and When Not to Use Interpretation\n\n\
    We should always use interpretation algorithms to better understand why our model\
    \ predicts certain outcomes and quantify the impact of individual and cumulative\
    \ predictions. It is also a good practice to use interpretation methodologies\
    \ to check if the results are similar.\n\nFor choosing an appropriate interpretation\
    \ methodology, it is important to consider which type of questions we can answer\
    \ with which methodology. Below is a list that gives some points:^{23}\n\n+  \
    \ - Ceterisis Plots:\n    - Can be used to quantify the impact of variable change\
    \ for a specific observation.\n    - Model-agnostic and local.\n\n+   - Partial\
    \ Dependence Plots:\n    - Can be used to quantify the impact of variable change\
    \ for a complete model, but they are not specific individual observations.\n \
    \   - Model-agnostic and global.\n\n+   - Variable Importance Plots (VIP)\n  \
    \  - Analyze the importance of variables but not the quantitative impact on the\
    \ predictions.\n    - VIPs are well suited for deciding which predictor variables\
    \ stay in a model and which ones should be dropped.\n    - Model-specific (model-agnostic\
    \ versions also exist) and local.\n\n+   - SHAP Values\n    - Quantify the impact\
    \ of predictor variable values on a specific prediction.\n    - Model-agnostic\
    \ and global.\n\n+   - LIME.\n\n> ^23 See Molinar (2020) for a detailed overview\
    \ of interpretation methodologies."
  merge: -1
