- pgno: 37
  md: '# 3.5 How R Stores Data


    # 3.5.1 R Data Types


    To reiterate, *Data Types* determine which type of information is stored. In order
    to keep it simple, we will cover only the most commonly used *R Data Types*:


    +   - Numerical data type (num)

    - Character data type (chr)

    - Logic data type (logic)

    - Factor data type (factor)


    **Numerical Data type (num):**

    The *numerical* data type stores numerical values. Numerical values are used when
    performing any of arithmetic calculation. In contrast, ZIP codes are not numerical
    because they are not used for calculations. Numerical values can be discrete (*integer*)
    or continuous (*double*). Note that the distinction between integer and double
    is not very important for this book, but you should know that *integer* and *double*
    are both *numerical* values.


    **Character Data Type (chr):


    In R, an object that provides for storing a sequence of characters, numbers, and/or
    symbols that sometimes form a word or even a sentence is called a character data
    type. Examples include first or last names, street addresses, or ZIP codes. The
    latter could also be stored as a numerical data type, which is bad coding practice
    but will not cause problems in most cases.


    Note that what is called a *character* in *R* is often called a *string* in other
    programming languages.


    You must surround *character Data Types* with quotation marks to distinguish them
    from object names. For example, if you want to assign the characters “Hello world!”
    to an *R* object called *MyText*, you must write it as shown in the *R* code below:


    ```

    MyText<-"Hello world"

    print(MyText)


    ## [1] "Hello world!"

    ```


    In the example above, the `print()` command was used to output the object value
    of the MyText object to the *Console*.'
