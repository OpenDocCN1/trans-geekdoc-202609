- pgno: 331
  md: 'This reminds us to be careful when working with interpretation algorithms and
    look at the bigger picture and not so much at the details when interpreting the
    results.


    # 11.7 SHAP Contribution of Predictor Variables


    An interpretation methodology that can quantify the contributions of each predictor
    variable''s value to the outcome of a specific observation is the SHAP values
    methodology.


    The SHAP methodology is a recent approach to interpreting machine learning predictions
    (see Lundberg and Lee (2017)). However, the basic idea for the SHAP values methodology
    is based on a game theory approach called ShapLEY values after its original author
    Shapley (1953).


    In this section, we first introduce SHAPLEY values in Section 11.7.1. Then, in
    Section 11.7.2, we transfer the concept of SHAPLEY values to the concept of SHAP
    values.


    # 11.7.1 Shapley Values


    SHAPLEY values were developed by Shapley (1953). It is a game theory approach
    to divide a gain from a project among the individuals who contributed to the project.
    The idea is to use the marginal contribution to distribute the gain. The marginal
    contribution of an individual can be calculated when comparing the gain with without
    the contribution of that individual. The challenge is that marginal contributions
    for the same individual can differ depending on which level of project an individual
    starts, but this can be better explained with an example.


    Suppose, as an example, a business hires three economists: The three economists,
    Angela, Bruce, and Carsten, contribute to the company with their economic advice.
    Before any of the three economists, the business made a profit of 87 million (measured
    in thousands of dollars) and displayed as 7,000 at the top of the chart Figure
    11.5.


    We call a group of contributors to a project a coalition, and because none of
    the economists contributed in the scenario at the beginning of the flow chart
    Figure 11.5, this scenario is labeled as Coalition: none.


    In contrast, the scenario at the bottom of the flow chart in Figure 11.5 Coalition:
    ABC indicates that all three economists contribute, which leads to a profit of
    7,107. Comparing the profit from Coalition: none to Coalition: ABC shows that
    all economists'' contribution is 107.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 316


    # 11 Interpreting Machine Learning Results


    Given that the three economists have slightly different talents (Angela specializes
    in financial economics, Bruce specializes in health economics, and Carsten specializes
    in machine learning), we cannot equally divide the profit of 107 among the three
    economists. We have to find out the individual contribution of each economist.
    The marginal contribution is calculated as the difference between a coalition
    and a coalition where the same individual did not contribute. There is a problem:
    the contribution varies for each economist depending on which stage they joined
    the project.


    ![](img/f240d449191f5add983daf6c380e4fe3_332_0.png)


    FIGURE 11.5 The Shapley Graph


    For example, we follow the red path in the flow chart as Figure 11.5, we can see
    that Angela joins first, then Bruce; and Carsten. When Angela joins, the profit
    increases from Coalition: none by 66 to Coalition: A, where Angela is the only
    contributor (from 7,000 to 7,066). When Bruce joins, the profit increases by 19,
    and finally, with Carsten joins, the profit increases by 22. Therefore, Angela''s
    marginal contribution is 66, Bruce''s is 19, and Carsten''s is 22. Should Angela
    get 66 of the total contribution of 107? This is more than half and does not sound
    reasonable.


    Why this not reasonable becomes more clear when we look at the blue path in the
    flow chart Figure 11.5. Following that path, we see that Angela joins last and
    contributes only 26.


    The different results make sense: In the initial coalition, the company did not
    have an economist, so when Angela joins, she contributes all of the economics
    expertise. However, following the blue path, Angela joins last. Before'
  merge: -1
