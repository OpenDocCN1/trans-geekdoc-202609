    # 3.6 Naming Rules for R Objects


    After discussing different R objects, the remaining question is, are there any
    rules for naming these objects when writing code.


    Based on your experience with high school math, you might tend to write object
    names with a single character, such as X or Y. You are free to do this in R, and
    in some cases it might be a good choice. However, using multiple letters for object
    names is recommended in most cases, as this makes your code more readable. Long
    your object names should be a matter of style and taste. Too long convolutes your
    code; too short is not descriptive enough.


    In any case, it is recommended to follow the rules that are listed below:


    +   - An object name must start with a letter (mandatory) and no special characters
    such as space, "%", "$", "@", or "#" appear in object names unless required by
    the R syntax. The reason not to use special characters in object names is that
    some of them have a distinct meaning in R, and some are reserved for use with
    specific packages.


