    \n**Summary:** If we can combine two hidden neurons with ReLU activation functions\
    \ into a step function, we can expect the approximation properties from a Neural\
    \ Network with ReLU activation functions that are defined in Section 9.5 for Neural\
    \ Networks with Sigmoid functions.\n\nThe constant slope of a ReLU activation\
    \ function is a major advantage over a Sigmoid function. Let us compare the slope\
