    If we calculate for each Tenure value the average from the related values of the
    light grey lines (the Ceteris Paribus plots), we get the bold blue line, which
    is called a Partial Dependence Plot (PDP).


    The code to generate the ICE plot and the PDP plot is shown below:


    ```

