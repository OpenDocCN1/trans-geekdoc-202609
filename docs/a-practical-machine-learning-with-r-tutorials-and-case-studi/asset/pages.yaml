- pgno: 162
  md: "# 6 Polynomial Regression — Overfitting/Tuning Explained\n\n(blue line in Figures\
    \ 6.2 and 6.3) seemed to be superior to the Degree-5 and Degree-10 Polynomial\
    \ Model.\n\nHowever, this does not mean a linear model is always the best choice.\
    \ For example, when the underlying pattern that generated the data is non-linear,\
    \ a linear regression model is sub-par to fit the non-linear pattern.\n\nThis\
    \ raises the question:\n\nHow can we choose the right degree for a Polynomial\
    \ Model?\n\n# 6.5.1 Hyper-Parameters vs. Model Parameters\n\nThe appropriate degree\
    \ for a Polynomial Model cannot be found with the Optimizer $\beta$-parameters\
    \ (model parameters) because in order to run the Optimizer, we have to choose\
    \ the model first — including the polynomial degree. Therefore parameters like\
    \ the polynomial degree, that needs to be determined before the model calibration,\
    \ are called hyper-parameters rather than model parameters.\n\n![](img/f240d449191f5add983daf6c380e4fe3_162_0.png)\n\
    \n+   1. Hyper-parameters are parameters that change the design of a machine learning\
    \ model or the data pre-processing in a recipe. For example, the hyper-parameter\
    \ $k$ in a $k$-Nearest Neighbors model design or the degree of a Polynomial Model\
    \ in a recipe.\n2. Hyper-parameters often control the degree of non-linearity,\
    \ and thus the flexibility of the prediction function. Therefore, we often face\
    \ a trade-off between model flexibility and the risk of overfitting.\n3. Hyper-parameters\
    \ cannot be determined with an Optimizer based on training data. Therefore, we\
    \ must utilize a trial-error process to find suitable hyper-parameters. This process\
    \ is called hyper-parameter tuning.\n4. We cannot utilize the testing data for\
    \ hyper-parameter tuning because this can extend overfitting into the testing\
    \ data!\n\nFinding the best hyper-values is not specific to Polynomial Models\
    \ only; we ran into this challenge in Chapter 4 when deciding on the parameter\
    \ $k (the number of neighbors to consider) for k-Nearest Neighbors. Later, in\
    \ Chapter 9, when covering Neural Network models, we have to decide how many neurons\
    \ to consider when building a Neural Network. The number of neurons in a Neural\
    \ Network is also considered a hyper-parameter. In fact, most machine learning\
    \ models require finding best hyper-parameters at the model design stage. This\
    \ process is called hyper-parameter tuning."
  merge: -1
