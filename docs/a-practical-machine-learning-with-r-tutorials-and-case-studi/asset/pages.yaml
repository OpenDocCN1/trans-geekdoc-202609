  md: '# 4 k-Nearest Neighbors — Getting Started


    In the previous chapter, you learned the basics about R and RStudio. Now, you
    are probably keen to apply your knowledge to create a machine learning model.
    Therefore, we will postpone covering key concepts of machine learning models to
    Chapter 5 and jump right to create our first machine learning model.


    We start with a k-Nearest Neighbors model in Section 4.5 predicting whether a
    wine is red or white based on only two chemical properties (acidity and sulfur
    dioxide). This model allows us to introduce the underlying idea of k-Nearest Neighbors
    and in addition some essential machine learning concepts as:


    +   1) Splitting the available observations into training and testing data (see
    Section 4.3).


    +   2) The concept of scaling (see Section 4.6).


    +   3) Pre-processing data and designing machine learning models with the tidymodels
    package (see Section 4.7.1).


    +   4) Interpreting a confusion matrix (see Section 4.8).


    The last two 4.9 and 4.10 are designed to be hands-on and interactive. In Section
    4.9, you will write R in RStudio to improve the model from Section 4.5 by adding
    additional chemical properties as predictor variables. Section 4.10, you will
    work on a different project to apply Optical Character Recognition (OCR) to detect
    digits 0 – 9 from handwritten notes using k-Nearest Neighbors.


    # 4.1 Learning Outcomes


    This section outlines what you can expect to learn in this chapter. In addition,
    the corresponding section number is included for each learning outcome to help
    you to navigate the content, especially when you return to the chapter for review.'
  merge: -1
  img_proc: true
