- pgno: 310
  md: "# 10.6 When and When Not to Use Tree-Based Models\n\n+   * *Decision Trees*\
    \ have a high educational value because the graphical representation provides\
    \ an intuitive way to see which variables influenced the predictions.\n\n+   *\
    \ As a standalone model *Decision Trees* should not be used for solving *real-world*\
    \ problems. The reasons are:\n    - Although most *decision tree rules* are reasonably\
    \ interpretable, some *decision rules* might not make sense. This is a serious\
    \ drawback from the otherwise good interpretability of *Decision Trees*.\n   \
    \ - The structure of *Decision Trees* responds very sensitively to a change in\
    \ *hyper-parameters* such as the tree depth or changes in the data. With an unstable\
    \ tree structure, interpretation becomes challenging and is not credible.\n  \
    \  - *Decision Trees* are weak learners in the sense that other machine learning\
    \ models often perform better.\n\n+   * Although Decision Trees are weak learners,\
    \ combining many *Decision Trees* into an ensemble model such as *Random Forest*\
    \ or *Boosting Trees* often leads to excellent predictive results.\n\n+   * *Random\
    \ Forest* models are a good choice for regression and classification tasks. This\
    \ is especially true when non-linearity or predictor variable interactions are\
    \ suspected in the underlying data. Generally, using a linear *OLS* as a benchmark\
    \ is always a good idea to evaluate if the data present a linear process that\
    \ can be addressed with *OLS*.\n\n+   * For very complex models with many predictor,\
    \ *Deep Learning* models such as *Neural Networks* may be a better choice, and\
    \ these models should be run in addition to *Random Forest* as an alternative\
    \ to evaluate, they perform better.\n\n+   * If computing time is an issue when\
    \ running a *Random Forest model*, *Boosting Trees* algorithms such as *XGBoost*\
    \ might be the better choice. For example, *XGBoost* performs faster than *Random\
    \ Forest*, and its predictive quality is similar and often better than *Random\
    \ Forest*."
  merge: -1
  img_proc: true
