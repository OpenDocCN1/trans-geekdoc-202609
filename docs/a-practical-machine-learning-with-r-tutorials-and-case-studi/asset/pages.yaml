- pgno: 1
  md: '# Practical Machine Learning with R


    The textbook is a comprehensive guide to machine learning and artificial intelligence
    tailored for students in business and economics. It takes a hands-on approach
    to machine learning, emphasizing practical applications over complex mathematical
    concepts. Students are not required to have advanced mathematics knowledge such
    as matrix algebra or calculus.


    The author introduces machine learning algorithms, utilizing the widely used R
    language for statistical analysis. Each chapter includes examples, case studies,
    and interactive tutorials to enhance understanding. No prior programming knowledge
    is needed. The book leverages the tidymels package, an extension of R, to streamline
    data processing and model workflows. This package commands, making the logic of
    algorithms more accessible by minimizing programming syntax hurdles. The use of
    tidymod ensures a unified experience across various machine learning models.


    With interactive tutorials that students can download and follow at their own
    pace, the book provides a practical approach to apply machine learning algorithms
    to real-world scenarios.


    In addition to the interactive tutorials, each chapter includes a Digital Resources
    section, offering links to articles, videos, data, and sample R code snippets.
    A companion website further enriches the learning and teaching experience.


    This book is not just a textbook; it is a dynamic learning experience that empowers
    students and instructors alike a practical and accessible approach to machine
    learning in business and economics.


    # Key Features:


    +   - Unlocks machine learning basics without advanced mathematics — no calculus
    or matrix algebra required.

    - Demonstrates each concept with R and real-world data for a deep understanding
    — prior programming knowledge is needed.

    - Bridges the gap between theory and real-world applications with hands-on interactive
    projects and tutorials in every chapter, guided with hints and solutions.

    - Encourages continuous learning with chapter-specific online resources—video
    tutorials, R-scripts, blog posts, and an online community.

    - Supports instructors through a companion website that includes customizable
    materials as slides and handouts to fit their specific course needs.


    Carsten Lange is an economist at Cal Pomona with a keen interest in making data
    science and machine learning more accessible. He has authored multiple referred
    articles and four books, including his 2004 book on applying neural networks for
    economics. Carsten is passionate about teaching machine learning and artificial
    intelligence with a focus on practical applications and hands-on learning.'
