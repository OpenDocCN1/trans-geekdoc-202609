- pgno: 242
  md: '# 9 Deep Learning — MLP Neural Networks Explained


    +   * Convolutional Neural Networks (CNN): for image recognition and classification.


    +   * Recurrent Neural Networks (RNN): for sequence processing.


    +   * Long short-term memory (LSTM): a more advanced type of RNN for tasks that
    require sequence processing, as speech recognition and sentiment analysis.


    +   * Generative Adversarial Networks (GANs): for semantic image editing, style
    transfer, image synthesis.


    +   * Generative AI: a field that is still developing. Applications so far from
    generating reports, papers and art; all way to simulation of scientific experiments.
    The end of future applications is not in sight.


    Due to the complexity and the demanding computational resources, Deep Neural Networks
    are beyond the scope of this. Instead, we will explain the basic concepts of Deep
    Learning using a simpler Neural Network type called Multi-Layer Perceptron (MLP).


    MLP Neural Networks were among the first Neural Networks to be developed. The
    principles of MLP Neural Networks can also be applied to more complex and sophisticated
    Neural Networks. After reading this chapter you will have a good idea about the
    basic functionality of Deep Neural Networks.


    MLP Neural Networks consist of one or more layers, each layer contains at least
    one neuron. The layers in MLP Neural Networks are fully connected, meaning that
    each neuron in one layer can pass information to each neuron in the following
    layer. Figure 9.1 in Section 9.4.1 shows a basic example of a fully connected
    MLP Network with an input layer (2 neurons), a hidden layer (2 neurons), and an
    output layer (1 neuron).


    Neural Networks are used for classification and regression tasks. Here, we will
    focus on regression tasks. Throughout this chapter, we will use the diamonds dataset
    to predict diamond prices based on a diamond''s properties. We will introduce
    the diamonds dataset in detail in Section 9.3.


    In follows, MLP Neural Networks are covered in four parts:


    In Section 9.4, we introduce the idea behind Neural Networks in an intuitive way.
    We show the structure of a simplified Neural Network, demonstrating how a Neural
    Network predicts, and we describe the basic principle (Back Propagation/Steepest
    Gradient Descent) used by the Optimizer to find the best β parameters for a Neural
    Network.


    In Section 9.5 we use the next R package (Venables and Ripley (2002))


    > ^2All layers between the input and the output layers are called hidden layers.\3This
    dataset is built into the ggplot2 R package (Wickham (2016)).'
