- pgno: 255
  md: "# 9.4 The Idea Behind Neural Network Models\n\nHow can we iteratively change\
    \ the $\beta$s to gradually improve the Neural Network's predictive quality —\
    \ minimizing the MSE?\n\nThis is what we will cover in the following section.\n\
    \n# 9.4.4 How the Optimizer Improves the Parameters in a Neural Network\n\nFor\
    \ regression tasks, the Optimizer in a Neural Network (integrated in the tidymodels\
    \ workflow) aims to minimize the $MSE$ by adjusting the $\beta$ values\n\nTo give\
    \ a bias of how the Optimizer adjusts the $\beta$ values, we will use the first\
    \ iteration (the first adjustment of values 9.4.3) as an example. We start with\
    \ the randomly chosen $\beta$ values and show how the Optimizer changes these\
    \ values to a slightly lower $MSE$. This process can then be iteratively until\
    \ the $MSE$ is reasonably low.\n\nSo, let us assume the $\beta$ values are already\
    \ randomly chosen at the beginning of the adjustment process:\n\n$\beta_1 = 0.1,\
    \ \beta_2 = -0.9, \beta_3 = 0.5, \beta_4 = -0.1, \beta_5 = 0.8, \beta_6 = 0.6,\n\
    $\beta_7 = 0.1, \beta_8 = 0.9$\n\nThen we can use the definition of the $MSE$\
    \ in connection with prediction Equation (9.8) to calculate the $MSE$ for the\
    \ initial set of $\beta$s for the training dataset. This $MSE$ will be the benchmark\
    \ when the Optimizer adjusts the $\beta$s to produce a new set of $\beta$s that\
    \ (slightly) improves the $MSE$. For the set of randomly chosen $\beta$ parameters,\
    \ the equation to calculate the $MSE$ is:\n\n```\n$MSE = \\sum_{i=1}^{n} \\frac{(Price_i\
    \ - Price_i)^2}{N}$ (9.9)\n```\n\nwith:\n\n![](img/f240d449191f5add983daf6c380e4fe3_255_0.png)\n\
    \n> $^6Classification applications use different metrics to measure the predictive\
    \ quality in a Neural Network but this exceeds the scope of this chapter.\n\n\
    > $^7See Section 5.4 for details about the chapter."
  merge: -1
  img_proc: true
- pgno: 256
  md: "Note the *effective* inputs are highlighted for better readability.\n\nWe start\
    \ with using the prediction equation to calculate the predicted price for the\
    \ first observation in the training dataset ($P_i$). Since we know the true price\
    \ $P'_i$ for this diamond from the training data, we can calculate the related\
    \ squared error as $(P_i - P'_i)^2$.\n\nContinuing with the other observations,\
    \ we calculate the predicted price and the related squared error for the complete\
    \ training dataset and then calculate the mean from all $MSE$ for the training\
    \ dataset related to the initial set of $\beta_i$. This calculation shows again:\n\
    \n# For a given dataset, we can calculate the MSE for any set of chosen $\beta$\
    \ values.\n\nNext, we increase $\beta_1$ by a very small amount, leaving all other\
    \ $\beta$ values unchanged, and we calculate the new $MSE$ using Equation (9.9).\
    \ Consequently, the $MSE$ will either decrease or approach the benchmark $MSE$.\
    \ This provides us with information in which direction $\beta_i$ should be changed.\
    \ If increasing $\beta_i$ was successful and the $MSE$ decreased, mark $\beta_i$\
    \ to be increased.\n\nNext, we reset the value for $\beta_1$ and use the same\
    \ procedure for $\beta_2$ to find out if $\beta_2$ should be increased or decreased.\n\
    \nWe do the same for all $\beta$ parameters, and consequently, we will know for\
    \ each $\beta$ parameter if it should be increased or decreased.\n\nThe amount\
    \ of increase or decrease for each of the $\beta$ parameters is proportional to\
    \ the change of the $MSE$ they triggered when changed. In addition, to ensure\
    \ that the changes are not too large, we multiply these changes with a learning\
    \ rate — a constant smaller than one, for example, $0.001^8$.\n\nThis procedure\
    \ results in a new set of $\beta$ with a slightly smaller $MSE$. This new set\
    \ of $\beta$ becomes the benchmark and the procedure above is repeated.\n\nAfter\
    \ each iteration (also epoch), the $MSE$ slightly improves. We continue until\
    \ the $MSE$ is lowered to the desired level or until a preset number of epochs\
    \ is reached.\n\nThe process described above would work in most cases but is insufficient.\
    \ In reality, the *Optimizer* uses a more sophisticated algorithm based on the\
    \ *Steepest Descent algorithm* (sometimes called the *Back Propagation algorithm*).\
    \ The *Steepest Descent algorithm* follows the ideas outlined\n\n> 8 Changing\
    \ the $\beta$ parameters by too much, will still move them in the right direction,\
    \ but they might overshoot the optimum — leading to an oscillating and possibly\
    \ exploding $MSE$. How to find an appropriate learning rate to adjust the change\
    \ of the $\beta$ parameters exceeds the scope of this book. For more details see\
    \ Mansani (2021)."
  merge: -1
  img_proc: true
- pgno: 257
  md: "# 9.5 Build a Simplified Neural Network Model\n\nabove but utilizes calculus\
    \ (i.e., partial derivatives) to estimate the change of the MSE when a specific\
    \ $\beta$ value is changed.^9$\n\n# 9.5 Build a Simplified Neural Network Model\n\
    \nNow it is time to see a *Neural Network* in action. This section uses the $R$\
    \ net package (Venables and Ripley (2002)) to show a real-world application for\
    \ *Neural Networks*. In what follows, we will emphasize the outstanding approximation\
    \ properties of *Neural Networks* but also show how susceptible packages are overfitting.\n\
    \nWe use the next package in this section, also more advanced packages such as\
    \ *PyTorch* which has recently implemented in *R*. You will use PyTorch in the\
    \ interactive Section 9.7.\n\nThe reason to use next here is to stay compatible\
    \ with Section 9.4. That is, the net package supports Sigmoid activation functions.\
    \ In contrast, PyTorch only supports more advanced activation functions as Rectified\
    \ Linear Activation (ReLU) functions (more about ReLU in Section 9.7).\n\nAs we\
    \ start with loading the data and generating training and testing data:\n\n```\n\
    library(tidymels); library(janitor)\nset.seed(777)\nDataDiamonds<- diamonds |>\n\
    \  clean_names(\"upper_camel\") |>\n  select(Price, Carat, Clarity) |>\n  mutate(Clarity=as.numeric(Clarity))\
    \ |>\n  sample_n(500)\n\nSplit085 <- initial_split(DataDiamonds, prop=0.85)\n\
    DataTrain<-training(Split085)\nDataTest<-testing(Split085)\n```\n\nAs you can\
    \ see, we use only 500 observations from the diamond dataset and assign 25 observations\
    \ (prop=0.05; 0.05*500=25) to the training dataset. A training dataset with 25\
    \ observations is extremely small for a *Neural Network* application, but it is\
    \ well suited to demonstrate the overfitting problem later on.\n\n> ^9You can\
    \ find more information about *Gradient Descent*, including the mathematics behind\
    \ the algorithm, in Manassa (2021)."
  merge: -1
