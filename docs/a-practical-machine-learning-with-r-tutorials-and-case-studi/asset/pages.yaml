  md: '42 Introduction to R and RStudio


    # 3.10.1 Introduction: Was Chivalry Dead on the Titanic?


    In this interactive section, you will work on a small project to determine if
    chivalry was dead when the Titanic sank in 1912¹⁷. The background for the project
    is an article written by Hannah Furnness (Royal Correspondent at The Telegraph)¹⁸
    She cites a Swiss historian claiming, "It was not ''true'' that women and children
    on board the Titanic survived thanks to the gallantry of men." Hannah Furnness
    also provides evidence about men being in the lifeboats instead of women: "Over
    the starboard side, it was in a different story. On the last boats to leave, the
    majority were men." However, Furnness did not use any statistics to support her
    claim, although data are publicly available.


    It is your job to fill this gap. The question is:


    # Was the proportion of women surviving the Titanic disaster greater than the
    one of men?


    If true, that would strongly indicate that the ultimate chivalry — dying to protect
    a woman''s life — was still present when the Titanic sank and that Furnness''
    claim that chivalry was dead in 1912 is likely incorrect.


