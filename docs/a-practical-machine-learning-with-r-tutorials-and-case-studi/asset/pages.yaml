    \ this\nbook.\n- The shiny package (Chang et al. (2022)), which is needed together\
    \ with the\nlearner package (Aden-Buie et al. (2022)) for the interactive exercises\
    \ in this\nbook.\n\n# 5.3 The Basic Idea Behind Linear Regression\n\nThe basic\
    \ idea linear regression is to use a linear function with one (uni-\natevari)\
    \ or more (multivariate) predictor variables $x_i$ to predict a continuous\noutcome\
    \ variable $y$.\n\nEquations (5.1) and (5.2) are examples of predicting the outcome\
    \ $y_i$ with\ntwo predictor variables, respectively. Because regression Equations\
    \ (5.1)\nand (5.2) generate predictions for the true outcome variable $y_i$, the\
    \ variables\none on the left of the equations are marked with a hat (see $\\hat{y}_i$)\
    \ to indicate that the\nleft-hand-sides of Equations (5.1) and (5.2) are the results\
    \ of:\n\n```\n$y_i = \\beta_1 x_i + \\beta_2$\n$\\hat{y}_i = \\beta_1 x_i + \\\
    beta_2 x_i + \\beta_3$\n```\n\nWe know the numerical values for the predictor\
    \ variables $x_{i,j}$ for any given\nobservation in the training and testing dataset.\
    \ Consequently, we can plug in\nthe numerical values for the predictors $x_{i,j}$\
    \ into Equations (5.1) or (5.2)\ncalculate a prediction for the outcome ($\\hat{y}_i$).\n\
    \nHowever, this only works if and only if we know the values for the parameters\n\
    (the $\beta$s). Finding optimal values for the parameters result in\nthe best\
    \ prediction quality is the central objective for linear regression. It is\nsimilar\
    \ important for most machine learning algorithms.\n\n> ¹Strictly speaking, the\
    \ $\beta$s are also estimates and should be written as $\\hat{\beta}_j$. For simplicity,\n\
    what follows, we omit the hats on model-parameters."
