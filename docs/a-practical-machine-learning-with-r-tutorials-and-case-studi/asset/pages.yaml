  md: "# 9.4.3 Numerical Example: Predicting Prices for Diamonds with a Neural Network\n\
    \nIn this section, we will choose an individual diamond (see Table 9.1) and predict\
    \ its price based on the Neural Network displayed in Figure 9.2 and also based\
    \ on the prediction Equation (9.8).\n\n# Table 9.1 Sample Diamond from DataDiamonds\n\
    \n| Price | Carat | Clarity |\n|--- |--- |--- |\n| 506 | 0.3 | 3 |\n\nTable 9.1\
    \ shows that the diamond has 0.3 carats ($Carat_i = 0.3$) and a clarity of 3 ($Clarity_i\
    \ = 3$). All predictors are omitted for now. For the initial prediction that the\
    \ values of the $\beta$ parameters are all randomly chosen:\n\n```\n$\\beta_1\
    \ = 0.1, \\beta_2 = -0.9, \\beta_3 = 0.5, \\beta_4 = -0.1, \\beta_5 = 0.8, \\\
    beta_6 = 0.6,\\n\\beta_7 = -0.1, \\beta_8 = 0.8, \\beta_9 = 0.9$\n```\n\nThe prediction\
    \ process is displayed in Figure 9.2. The color of the connectors between the\
    \ neurons shows if the related parameter is positive (black) or negative (red).\
    \ The connector's thickness reflects whether the parameter — in absolute terms\
    \ is small or large. As an exercise, compare the connectors in Figure 9.2 with\
    \ the randomly chosen $\beta$ values.\n\n![](img/f240d449191f5add983daf6c380e4fe3_252_0.png)\n\
