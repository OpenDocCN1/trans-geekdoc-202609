  md: "Step 1 - Generate Training and Testing Data: Note, it is assumed that the data\
    \ frame MyData contains the data you are analyzing.\n\n```\nset.seed(087)\nSplit80<-MyData\
    \ |\n  initial_split(prop=0.8, strata=<OUTCOME VARIABLE>, breaks=5)\nDataTrain=training(Split80)\n\
    DataTest=testing(Split80)\n```\n\nSubstitute <OUTCOME VARIABLE> with the name\
    \ of your outcome variable for the strata. This ensures that the distribution\
    \ of your outcome variable is similar in the training and testing data.\n\nStep\
    \ 2 - Create a Recipe: In the code block below, substitute <OUTCOME VARIABLE>\
    \ with your outcome variable and <PREDICTOR VARIABLE($S)> with a list of your\
    \ predictor variables separated by \\+-signs.\n\nAdditionally, you can use a \"\
    -\", on the right of the \"-\" to use all predictor variables from the related\
    \ data frame.\n\n```\nRecipe<-recipe(<PREDICTOR VARIABLE($S)>>\n  data=DataTrain\
    \ |\n  step_<NAME OF STEP($S) OF STEP>)\n```\n\nNote that <NAME OF STEP> stands\
    \ for an optional pre-processing step of the predictor variables. <ARGUMENT(S)\
    \ OF STEP> represents optional arguments for the related step\\_command.\n\nIf\
    \ you plan to tune a hyper-parameter in a recipe you have to assign the <tune>placeholder\
    \ rather than a value to the related argument. For example, degree=tune in step\\\
