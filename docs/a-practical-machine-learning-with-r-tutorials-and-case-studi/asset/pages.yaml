    # 7.3 Unregularized Benchmark Model


    To demonstrate the idea behind regularization, we start by comparing an unregularized
    model that we introduce in this section to three different regularized models
    in Section 7.4.


    As in Chapter 6, our goal is to predict house prices based on the King County
    Sale dataset (Kaggle (2015)). The code block imports the dataset and selects the
    predictor variables. Afterward, the observations are split into training and testing
    datasets. Both datasets will be used for the unregularized model in this section
    as well as the three regularized models in Section 7.4.


    ```

    library(tidymodels); library(rio); library(janitor)

    DataHousing:

    import(\https://api.language-analytics.com/data/HousingData.csv") >

    clean_names("upper_camel") >

    select(Price, Sqft=SqftLiving)


    set.seed(????)

    Split01=initial_split(DataHousing, prop=0.001, strata=Price, breaks=5)

    DataTrain=training(Split01)

    DataTest=testing(Split01)

    ```


    Note that we set prop=0.001, resulting in a dataset with only 20 observations.
    We use a small training dataset purposely to create a scenario where overfitting
    becomes problematic, allowing us to show how regularization can mitigate an overfitting
    problem later.


    As in Chapter 6, we use a Degree-5 Polynomial Regression model:'
