    TABLE 5.1 Mockup Training Dataset

    | | $x_i$ | $\hat{y}_i$ | $y_i - \hat{y}_i$ | $(y_i - \hat{y}_i)^2$ |

    |---|---|---|---|--|

    | i | Grade | StudyTime | PreGrade | Error | ErrorSq |

    | 1 | 65 | 2 | 69 | 4 | 16 |

    | 2 | 82 | 3 | 73 | -8 | 81 |

    | 3 | 93 | 7 | 89 | -4 | 16 |

    | 4 | 93 | 8 | 93 | 0 | 0 |

    | 5 | 83 | 4 | 77 | -6 | 36 |


    enough to perform a reliable data analysis! However, to keep it simple, we will
    ignore this for now.


    The goal is to predict the outcome of an exam based on students'' study time.
    The predicted outcome variable is $\hat{y}_i$ (similar to $y_i$ in Equation (5.1))
    and the only predictor variable is $StudyTime$, (similar to $x_i$ in Equation
    (5.1)).


    Table 5.1 displays the observations for both variables, $Grade$ and $StudyTime$,
    in Columns 2 and 3.


    # 5.4.1 Predictions and Errors


    Before we analyze the relationship between $StudyTime$ and $Grade$ with linear
    regression, let us briefly introduce a few concepts related to predictions and
    the resulting errors:


    **Univariate Linear Regression** assumes we can predict an outcome based on a
    linear relationship between the outcome variable and **one predictor variable**.
    This can be expressed in an equation such as:


    > $$\hat{y}_i = \beta_1 x_i + \beta_2$\quad (5.3)


    When numerical values for $\beta_1$ and $\beta_2$ are selected, we can use Equation
    (5.3) to **predict the outcome $\hat{y}_i$** for each observation in the training
    or testing dataset (note, for simplicity, we do not consider a testing dataset
    here, but we will in Section 5.5).


    The **goal is to find optimal values** $\beta_{1,\text{opt.}}$ and $\beta_{2,\text{opt.}}$
    that maximize prediction quality.


    Prediction quality can be measured through the **Mean Square Error**, which is
    defined as:


    ```

    $MSE = \frac{\sum_{i=1}^N (y_i - \hat{y}_i)^2}{N}$

    ```'
