  md: '# # 9 Deep Learning — MLP Neural Networks Explained


    Deep Learning is an Artificial Intelligence (AI) methodology. It performs tasks
    that we all believed just a few years ago, could only be performed by humans.


    Deep Learning models are used in many different applications. For example, researchers
    use Deep Learning to analyze medical images to improve cancer diagnosis (image
    recognition); Amazon''s Alexa uses Deep Learning to understand human languages
    (Natural Language Processing (NLP)); and you can use Generative Pre-training Transformers
    (short: chatbots) like ChatGPT from OpenAI or Bard from Google to compose written
    text or just have a chat. These technologies are all based on Deep Learning.


    Deep Learning uses Neural Networks as an integral part. There would be no Deep
    Learning without Neural Networks. The term Neural Networks originated from early
    attempts of researchers (see for example McCulloch and Pitts (1943)) to create
    machine learning models that resemble the human brain.


    The human brain processes information as electric currents through neurons, and
    then passes it to other neurons connected by dendrites in a complex network with
    endless layers of neurons. Similarly, a Neural Network contains layers of interconnected
    nodes like neurons in the human brain. Each of these nodes, or artificial neurons,
    performs a mathematical operation on the data it receives, and then passes the
    results to other neurons in the network.


    Neural Networks research today focuses on improving predictive quality rather
    than attempting to resemble the human brain. Consequently, what follows, we will
    not discuss how little or how much a Network is similar to a human brain. For
    a brief description of this topic, see Haykin (1999), Section 1.2 and Chapter
    2.


    The word "deep" in Deep Learning refers to the number of layers in the Neural-structure
    structure. In general, Deep Learning algorithms are extremely complex with many
    layers and a very high number of parameters (sometimes billions or trillions of
    parameters)!¹ Here are some examples of deep Neural Networks:


    > ¹For example, it is believed that GPT-4 is trained on 1.7 trillion parameters.'
