    this when you return to the code block above and substitute Saft with 1501 instead
    of 1500 (leave *Grade = 9* and *Waterfront_yes = 0* unchanged). You will see that
    estimated price is $557,050 instead of $556,830, a change of $180.


    The same interpretation is true for $\beta_2$, a parameter for a building''s construction.
    If Grade increases by one unit (one grade), then the estimated price of that house
    increases increases by about $95,214 (confirm this in the code block).


    The interpretation of the parameter for the dummy variable Waterfront\_yes is
    a bit tricky. Technically, the dummy variable Waterfront\_yes increases by one
    unit, the estimated housing price would increase by $868,338.


    To better interpret this, we have to consider the limited range of a dummy variable:
    A dummy variable can only increase by one unit when it switches from 0 to 1. In
    the case of the Waterfront\_yes dummy variable 0 increases by one unit to 1. In
    short, if we hypothetically place a house that is not at the waterfront (Waterfront\_yes
    = 0) to a location at the waterfront (Waterfront\_yes = 1), the dummy variable
    Waterfront\_yes would increase by one unit the estimated housing price would increase
    by $868,338. In other words, houses at the waterfront are expected to be $868,338
    more expensive, on average.


    Lastly, we need to check if the parameters are significant. The P values in the
    rightmost column from the tidy() output above show the probabilities of the true
    parameters being zero (i.e., irrelevant). Since the P values are all very close
    to zero, this probability is extremely low, meaning the parameters are significant.


    The parameters'' interpretability and significance are strong points of linear
    regression. Unfortunately, other machine learning models do not allow us to interpret
    their parameters directly. This is the reason why in the past these models were
    called black box models.


    However, dramatic progress has been made in recent years that allows us to explain
    the predictions of machine learning models. We will introduce some important algorithms
    to interpret the predictions of machine learning models in Chapter 11.


    To assess the predictive quality of the fitted model on the testing dataset (DataTest),
    we again use the augment() command. It predicts the housing price and appends
    the predictions as column to the testing data. The resulting data frame is saved
    as DataTestWithPred.'
