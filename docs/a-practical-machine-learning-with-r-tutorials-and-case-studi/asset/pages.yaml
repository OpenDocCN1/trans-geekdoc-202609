    # ## Error: object ''Hello'' not found


    R complains by outputting the error message "Error: object ''Hello'' not found"
    and is correct because no object named Hello was defined. Instead, we should have
    assigned the character value "Hello" to the R object called MyText!


    Rather than printing an R object containing a text as we have done, we can alternatively
    print directly with print("Hello world!") or we use the cat() command that allows
    us to print a combination of objects and text separated by commas:


    # ## The content of the character object is: Hello world!


    The cat() command concatenates the character value "The content of the character
    object is:" with the content of the R object MyText and automatically adds a space
    between them.


    # Logic Data Type (logic):


    In R, the data type that stores TRUE and FALSE, is a logic data type. Different
    logic data types can be combined using "and" (&) and "or" (&). See, the Truth-Table
    displayed in Table 3.1, which shows many ways of True and False assigned to the
    R objects A and B are evaluated when connected with "and" (&) and "or" (&).


    Internally, R stores a value of 1 for TRUE and a value of 0 for FALSE. This allows
    calculations on logical data, such as TRUE+FALSE+TRUE, which evaluates to 2. If
    this confuses you, don''t worry. It will become clear when we work with R code
    later in Section 3.12.


    > Another term often used in mathematics for this data type is Boolean.'
