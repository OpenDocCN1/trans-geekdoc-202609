- pgno: 121
  md: '# 5 Linear Regression — Key Machine Learning Concepts


    This chapter focuses on linear regression. Linear regression is a machine learning
    algorithm just like k-Nearest Neighbors (see Chapter 4), Random Forests (see Section
    10.4), or Neural Networks (see Chapter 9). Assuming that most readers are familiar
    with the basics of linear regression, we will use linear regression as an example
    to introduce important machine learning concepts.


    Therefore, if you already have a good understanding of linear regression, you
    should read this chapter carefully as it introduces new machine learning concepts
    used in later chapters.


    Section 5.4 introduces linear regression for a univariate (one predictor variable)
    approach. Based on a mockup dataset, two different approaches are used to optimize
    the regression parameters:


    +   Ordinary Least Squares (OLS), which allows for calculating the regression
    parameters based on a formula.


    +   Trial-and-Error algorithms which systematically try different regression parameters
    to improve the predictions.


    We will introduce Grid Search and an Optimizer based trial-and-error algorithm.
    These algorithms are widely used for more advanced machine learning models. This
    chapter will explain both algorithms, which allows us to treat them as black box
    concepts when working with other machine learning models in the following chapters.


    In the interactive Section 5.5, you will work on an interactive project to extend
    the univariate model to a multivariate model using several predictor variables
    to estimate housing prices.'
