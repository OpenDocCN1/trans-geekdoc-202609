    ```

    count(DataTrainBal, Churn)


    ## A tibble: 2 x 2

    ## Churn n

    ## <fct> <int>

    ## 1 Yes 3621

    ## 2 No 3621

    ```


    As you can see comparing the printout with the contents of Table-8.2, the data
    set is balanced. However, we did not lose any observations because we increased
    the observations in the minority class.


    In this context, it is important to point out that we do not gain any new information,
    although we now have more observations. This is because we copied existing observations
    to increase the minority class. The information contained in the training data
    did not increase!


    Many data scientists believe that having identical observations through upsampling
    in the minority class is not the best solution. Consequently,'
