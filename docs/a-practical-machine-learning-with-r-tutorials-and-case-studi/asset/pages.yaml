    in Figure 6.1 where we plotted the 20 training data observations (red) together
    with a linear prediction function (blue) and the prediction function for the Polynomial
    Model (magenta).


    You can see that the magenta line (the Polynomial Model) approximates the training
    data better than the blue line (the linear model). This is because the non-linearity
    of the Polynomial Model gives it more flexibility. The magenta line bends downwards
    to better predict lower-priced houses between 1,300 sqft and 2,200 sqft. Then,
    it bends upwards to approximate higher priced houses with square footage between
