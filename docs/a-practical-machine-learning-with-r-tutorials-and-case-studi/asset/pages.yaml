  md: '10.4 Random Forest


    # 10.4 Random Forest


    A Random Forest is an ensemble model that can be used for classification and regression
    tasks. A Random Forest consists of many (sometimes hundreds or thousands) of slightly
    different Decision Trees. When these Decision Trees are created some randomness
    is involved. Thus the name Random Forest.


    Since the Decision Trees in a Random Forest are all slightly different, they produce
    slightly different predictions. The prediction of a Random Forest model is calculated
    as the aggregation of all the predictions from the various Decision Trees.


    +   - In the case of regression, the prediction from a Random Forest is calculated
    from the mean predictions of its Decision Trees.


    +   - In the case of binary classification, the class that is predicted by the
    majority of Decision Trees will be the predicted class of the Random Forest. Sometimes,
    this is called "vote of the Decision Trees" for a specific class.


    # 10.4.1 The Idea Behind Random Forest


    Although each Decision Tree inside the Random Forest is not well suited for prediction
    (weak learners), the idea is that the aggregation of Decision Trees leads to good
    predictive quality.


    The idea that a combination of weak learners can lead to a strong prediction is
    analogous to the Wisdom of Crowds phenomenon described in Galton (1907):


    Visitors at a stock and poultry exhibition in England submitted guesses about
    the weight of an ox. Although most of the visitors were off with their predictions,
    surprisingly, the mean of all predictions was very close to the actual weight
    of the ox.


    In order to generate different predictions the Decision Trees in a Random Forest
    must be diverse—similar to the diverse visitors of Galton''s stock and poultry
    exhibition. The question is:


    How Random Forest models ensure their Decision Trees are all (slightly) different?


    Two strategies are employed by the Random Forest model that ensure a diverse set
    of Decision Trees.


    Random Subspace Method: Every time a new Decision Tree is created (i.e., the decision
    rules for the tree), the Random Forest model does not consider all predictor variables.
    Instead, it uses only a random subset of predictor variables. So, for example,
    if we have seven predictor variables,'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 280 10 Tree-Based Models — Bootstrapping Explained


    the predictor variables are randomly selected as candidates for the best splitting
    rules for a specific Decision Tree. This limits the predictive quality of individual
    trees but increases diversity among trees.


    The number of predictor variables considered for each tree in tidy is by default
    $\sqrt{M}$ (rounded down if needed), where $M$ denotes the number of predictors
    in the model. So, for example, in a case where we have seven predictors, each
    Decision Tree will only consider two randomly chosen predictors ($\sqrt{7} = 2.65$;
    rounded down to 2). $M$ is a hyper-parameter and can be set or unset.


    **Bagging:** Every time a Decision Tree is created, the Random Forest model uses
    a different training dataset. These different training datasets are derived from
    the original dataset by drawing observations from the original dataset with replacement(!!)
    until the new training dataset contains the same number of observations as the
    original dataset. This procedure is called Bootstrapping.


    # Bootstrapping and Out-of-Bag Data


    The three tables show a training dataset and two Bootrap samples derived from
    it:


    | ID | Name | Sex | Age | Bootstrap Sample 1 ID | Name | Sex | Age | Bootstrap
    Sample 2 ID | Name | Sex | Age |

    |---|---|---|---|---|---|---|---|---|---|---|---||

    | 1 | Adam | m | 22 | 7 | Gert | m | 18 | 6 | Fiona | f | 87 |

    | 2 | Bertha | f | 54 | 7 | Mert | f | 18 | 3 | Carlos | m | 32 |

    | 3 | Carlos | m | 32 | 7 | Carlos | m | 32 | 5 | Ernst | f | 32 |

    | 4 | Dora | f | 21 | 6 | Fiona | f | 87 | 4 | Dora | f | 21 |

    | 5 | Ernst | m | 32 | 2 | Bertha | f | 54 | 6 | Fiona | f | 87 |

    | 6 | Gert | f | 87 | 2 | Gert | f | 87 | 1 | Adam | m | 22 |

    | 7 | Gert | m | 18 | 2 | Bertha | f | 32 | | | |


    Suppose the two bootstrap samples are used to build Decision Tree 1 and a Decision
    Tree 2, we see that Bootstrap Sample 1 contains the observations for Bertha, Carlos,
    and Gert. At the same time, the observations for Adam, Dora, and Ernst are not
    in this dataset. The observations for Adam, Dora, and Ernst are not used to train
    Decision Tree 1. Since these observations are not in the bag of the training data
    for Decision Tree 1, they are called Out-of-Bag data.


    **Out-of-Bag (OOB)** data are very useful because they can be used for validation
    purposes. After, they were never used to train the related Decision Tree. The
    number of OOB observations is also reasonably large because the expected value
    for the number of observations falling in the OOB dataset is 1/3 of the training
    dataset.


    As an exercise to find the OOB data for Decision Tree 2.


    > The OOB sample for Decision Tree 2 consists of Bertha and Gert.'
