    vector-objects as input. You cannot use variables from data frames directly. Therefore,
    to analyze variables in a data frame with commands such as mean() as a vector
    you must first extract the data frame variables as vectors before these commands
    can process them.


    Fortunately, this procedure is simple. To extract a variable from a data frame
    as a vector, you just need to provide the data frame''s name and the variable''s
    name, separated by a `$.


