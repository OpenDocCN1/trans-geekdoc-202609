    # 3.9.3 Mutate (Calculate) New Variables in a Data Frame


    The mutate() command provides something very similar to what we often do in Excel:
    We have an Excel table with data and want to add an extra column based on one
    or more columns.


    **Based on a data frame, mutate() calculates a new variable (column) based on
    existing variables (columns).** A command like *calculate* rather than mutate
    would likely show what the command actually does, but the name is — *mutate()*.


    Here is an example: The FareInPounds in the Titanic dataset reflects prices of
    1912 in pounds. How many are these prices in 2023 U.S. dollars? To get an approximate
    value, we have to multiply the British pound prices from 1912 by 108.5.


    Here are the detailed steps:


    +   - We need to create a new data frame DataTitanicNewFare that contains a variable
    (column) FareIn2023Dollars based on the data frame DataTitanicNarrow.

    - The new variable (column) FareIn2023Dollars is defined as: 108.5 * FareInPounds.\n-
    It would also be nice to delete the column FareInPounds afterward, as it is no
    longer useful.

    - We can accomplish all with the mutate() command:

    - The first argument of the mutate() command is (again) the data it operates on
    (DataTitanicNarrow).

    - The following arguments determine how to calculate new variables and update
    existing variables.

    - Subsequent definitions are separated by commas.


    The related R code and the output showing the new data frame is displayed below:


    > ¹The purchasing power of a British pound from the year 1912 was about 90.4 British
    pounds at the beginning of 2023 (see bank of England (2022)). Multiplying this
    with the exchange rate for the British pound at the beginning of 2023 ($1.2/Brit.
    pound) [see Federal Reserve of St. Louis (2023)] gives us the multiplier of 108.5.'
