    The output of the str() command shows that the data frame Diamonds contains 53,940
    observations and five different variables (columns) that describe properties of
    the diamonds together with their prices (in U.S.-).

    The variables *Clarity, Cut, and Color* chosen as predictors are also known as
    the four Cs of diamond appraisal:4


    +   1. Carat: A measurement used to describe a diamond''s weight. It is measured
    in metric grams (1 carat equal to 0.2 g) and is the most apparent factor when
    comparing diamonds.

    2. Clarity: A measurement for the visibility of natural microscopic inclusions
    and imperfections within a diamond. Diamonds with little to no inclusions are
    considered rare and highly valued. The clarity of the diamond is rated in eight
    categories measuring how clear the diamond is (II worst, SI, SSI, VS1, VS2, VVS1,
    IF (best)).5

    3. Cut: For a diamond''s facets, symmetry, and reflective qualities. The cut of
    a diamond is directly related to its overall sparkle and beauty. The cut of a
    diamond is rated in five categories as *Fair, Good, Ideal, and Super Ideal.

    4. Color: For the natural color or light of color visible in a diamond. The closer
    the diamond is to "colorless", the more expensive the diamond. Color is rated
    in seven categories from *D* (best) to *J* (worst).


    From the str() command output above, you can see that *Clarity, Cut, and Color*
    are stored as *R factor-type with 8, 7, and factor-levels-*


    > ^4The following description was retrieved from the Brilliant Earth website (https://www.brilliantearth.com/diamond/buying-guide/).

    5The clarity rating in the diamonds dataset is in line with the rating categories
    from the Gemological Institute of America (https://4cs.gia.edu/en-us/diamond-clarity/),
    except that the Flawless (IF) and the Inclusion (I) categories are not included
    in specific grades.'
