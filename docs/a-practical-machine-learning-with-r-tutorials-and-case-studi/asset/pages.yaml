    # 6.3 The Problem of Overfitting


    Machine learning aims to develop models that can be used to predict outcomes in
    the future. However, data scientists can only develop machine'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 6 Polynomial Regression — Overfitting/Tuning Explained


    learning models based on data from the past (training data).¹ They use the training
    data to calibrate a machine learning model''s parameters.


    This approach is not without problems. When too successfully calibrating a machine
    learning model to the training data (i.e., the error based on the training data
    is very small), the model is extremely specialized in approximating the training
    data, but it fails with new observations that are not part of the training dataset.
    This is the core of overfitting.


    To avoid overfitting in the stage of model development by adjusting the model
    design (i.e., choosing hyper-parameter values) is not easy. When we cannot use
    the testing data to assess different designs, since the testing data can only
    be used to finalize the model.


    Without being able to use the testing data, a second-best approach to minimize
    overfitting is Cross-Validation. This procedure utilizes the training data and
    randomly chooses part of the training data as a holdout validation dataset, to
    validate different model designs. This process is repeated on a rolling base until
    each observation was assigned to the validation dataset (about Cross-Validation
    in Section 6.5).


    # Circumstances that Can Lead to Overfitting


    Identifying conditions that make overfitting more likely helps with developing
    strategies to avoid it. In general, overfitting is more likely to occur:


    +   1. When the training data does not have a sufficient number of observations.

    2. When the model considers many variables and consequently contains many parameters
    to calibrate.

    3. When the underlying machine learning model is highly non-linear.


    # 6.4 Demonstrating Overfitting with a Polynomial Model


    To demonstrate how overfitting occurs and which problems result from overfitting,
    we use a Polynomial Model to predict housing prices.


    As in the interactive Section 5.5, we utilize the King County House dataset (Kaggle
    2015) and split the data into training and testing data:


    > ¹This is at least true for supervised models. Unsupervised models like reinforcement
    models that can improve during the production stage exceed the scope of this book.
    In an IBM blog article Dehn (2021) provides a brief comparison between supervised
    and unsupervised machine learning models.'
  merge: -1
  img_proc: true
