    ```


    Later, during the tuning process, the hyper-parameter values above will be pushed
    by one by the tuning workflow TuneModeHouses. Each value will fill in for the
    placeholder tune() and the workflow will be fitted. Next, its predictive quality
    will be evaluated. The workflow (the polynomial degree) with the best performance
    constitutes the best model.


    # 6.5.3 Validating the Tuning Results


    To find the best model, we need to validate each hyper-parameter value from the
    tuning results (each hyper-parameter combination in case we tune more than one
    hyper-parameter). This raises the question:


    > Which dataset should be used to validate the tuning results?


    You might be tempted to use the testing dataset to validate different values for
    hyper-parameters. However, keep in mind that the testing dataset should never
    be used for any type of optimization — including hyper-parameter tuning.


    If you ignore this rule, you might get a good performance on the testing data.
    But now the optimization is specialized for the testing data stage when you likely
    get poor results in the production stage with new data, which it had never seen
    before. This would be an example of pushing the overfitting problem from the training
    to the testing data.


    Using the complete training dataset to find the best hyper-parameter value is
    also not an option because the best performing hyper-parameter value would be
    the one that triggers the highest degree of overfitting.


    In what follows, we will introduce two strategies to assess various values of
    hyper-parameters without using the testing dataset or the complete training dataset⁵


    ⁵In what follows, we show how to create a validation dataset and how to perform
    Cross-Validation. For other procedures such as Bootstrapping or Leave-One-Out
    we refer to Kuhn and Silva (2022).'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Validation Dataset


    One option is to randomly choose a number of observations from the training dataset,
    exclude them from training, and assign them to an additional holdout dataset called
    the validation dataset.


    The validation dataset will never be used for training. Instead, the observations
    in the validation dataset are set aside to assess the predictive performance for
    different hyper-parameter values.


    A validation dataset is very similar to a testing dataset since both are used
    to assess the performance of a specific model. The difference is that the assessment
    is performed at different stages of development. The validation dataset is used
    during the model design stage to find the best hyper-parameter values, the validation
    dataset is used after the development of the machine learning is finalized to
    assess overall predictive quality.


    The validation_split() code below can be used to split the data into observations
    that are used for training (analysis observations) and those that are used to
    assess the predictive performance for various hyper-parameter settings (assessment
    observations). The command validation_split() is similar to the command initial_split().
    The argument prop=0.85 determines the percentage of observations leftover for
    training and the argument strat=Price ensures that house price levels are proportionally
    distributed between training and assessment. The splited observations are then
    stored in the data frame DataValidate.


    ```

    set.seed(879)

    DataValidate=validation_split(DataTrain, prop=0.85, strat=Price)

    ```


    The resulting data frame DataValidate includes the complete training dataset,
    but observations are internally marked with analysis to indicate that an observation
    will be used for training, and with assessment to indicate that the observation
    will be used as validation data to assess hyper-parameter performance.


    Using a validation dataset to compare hyper-parameter performance is appropriate
    for large datasets. For smaller datasets, there are a couple of disadvantages:


    +   1. Excluding observations from the training and earmark them for hyper-parameter
    assessment reduces the number of observations that are available for training.


    +   2. The observations used for the assessment of hyper-parameters are randomly
    chosen. This bears the risk that, by accident, an unusual validation dataset might
    be created (the risk is higher for smaller training datasets). Evaluating hyper-parameters
    based on unusual'
  merge: -1
  img_proc: true
