  md: "# 254 9 Deep Learning — MLP Neural Networks Explained\n\nalways smaller than\
    \ one, and it becomes very small when the effective input gets greater in absolute\
    \ terms (when approaching the red and blue lines in Figure 9.3).\n\nWhile the\
    \ small slope of Logistic activation functions is not a problem for Neural Networks\
    \ with one layer, it is a problem for Neural Networks with many layers.\n\nWhen\
    \ the Optimizer adjusts individual $\beta$ values in a multi-layer Neural Network\
    \ and calculates by how much each change from iteration to iteration, the weighted\
    \ slopes of the activation functions in different layers are multiplied.$^{14}$\
    \ If these weighted slopes are smaller than one, each multiplication brings the\
    \ change of the related $\beta$ smaller. With enough layers, the calculated change\
    \ get close to zero. Consequently, the $\beta$ parameters will not change anymore,\
    \ and the optimization process gets stuck. This problem is called the Vanishing\
    \ Gradient.$^{15}$\n\nSince ReLU activation functions have a constant slope of\
    \ one for positive effective inputs, the Vanishing Gradient is mostly mitigated\
    \ using ReLU activation functions.\n\nIn the following interactive Section 9.7,\
    \ you will work with a Neural Network with ReLU activation functions. You will\
    \ tune a Neural Network and estimate diamond prices.\n\n# 9.7 Using PyTorch to\
