- pgno: 17
  md: '# Introduction


    With rapid advancements in recent years, machine learning and artificial intelligence
    (AI) have become increasingly relevant and have already started transforming many
    businesses. Knowledge about machine learning and AI is critical not just for STEM
    (science, technology, engineering, and mathematics) also in many other fields,
    including business, economics, and other social science majors.


    To better prepare students for a future with AI, I started teaching machine learning
    in 2019 to help economics students understand and apply fundamental machine learning
    principles. My goal is to combine theoretical concepts with hands-on projects
    to equip the students with the skills to solve real-world problems. When looking
    for a textbook, I found some excellent books covering the foundations and mathematical
    theories behind machine learning. Unlike STEM students, business and economics
    students do not have the strong mathematical background required to make use of
    these books. On the other side of the spectrum, machine learning books that target
    majors are often too focused on applications and fall short of explaining quantitative
    methods. Recognizing that there is a need for a machine learning textbook that
    implements a hands-on approach, where students can interactively work step-by-step,
    and that the quantitative concepts in a less mathematical way gave me the idea
    to write this book.


    This book introduces machine learning algorithms and explains the concepts without
    using higher mathematics concepts like matrix algebra or calculus. Each chapter
    provides examples, case studies, and interactive tutorials. The examples and tutorials
    use the R language, which is widely used for statistical analysis and data science.
    R''s relatively simple syntax makes it easy for beginners to learn the language,
    making R a good choice for teaching machine learning. No prior programming skills
    are required to work with this book. A designated chapter introduces the R skills
    needed for the course. In addition, each chapter offers one or more interactive
    R tutorials. Students can work with real-world data and use the interactive environment
    to learn and experiment with R code in a web browser.'
