    ```

    DataTrain=training(Split70)

    DataTest=testing(Split70)

    ```


    In the code block above, we load the data and choose randomly 500 observations.
    Then we select the outcome variable (*Price*) and the predictor variables Carat,
    Clarity, Cut, and Color transforming the factor-levels of the last three variables
    to numerical values. Finally, we split the data into training and testing data.


    # Step 2 - Create a Recipe:


    We use the same recipe() command as in Section 9.5:


    ```

    RecipeDiamonds=recipe(Price-, data=DataTrain) |>

    step_normalize(all_predictors())

    ```


    After, we use step_normalize() for Z-score Normalization¹⁶ of all predictors.
    As explained in Section 9.5, the predictor variables for a Neural Network need
    to be scaled. Otherwise, the Optimizer likely will not generate suitable β¹⁷


    # Step 3 - Create a Model Design:


    In the code below, we create a model design. Like in Section 9.5, we use the mlp()
    command to create an MLP network model. However, we utilize the brulee package
    and therefore PyTorch rather than the net package set_engine(brulee):


    ```

    ModelDesignNN=mlp(hidden_units=tune(), dropout=tune()), |>

    epochs=100, penalty=0) |>

    set_engine(brulee) |>

    set_mode("regression")

    ```


    The hyper-parameters hidden_units and dropout are prepared for tuning since hidden_units=tune()
    and dropout=tune(). The hyper-parameter penalty is set to zero (no regularization)
    and epochs is set to 100 (the default).


    When you use the provided R script from the Digital Resource Section 9.9 to run
    the code in RStudio rather than in a browser, you can increase the values for
    epochs (e.g., epochs=100), and you can tune other hyper-parameters. For example,
    you can set penalty=tune() to introduce different degrees of


    > ¹⁶If you would like to review scaling procedures like Z-score Normalization,
    we recommend reading Section 4.6 about.


    > ¹⁷Internally, mlp() normalizes the predictor variables. So, omitting step_normalize()
    would not have created any damage. However, we used step_normalize() in the recipe
