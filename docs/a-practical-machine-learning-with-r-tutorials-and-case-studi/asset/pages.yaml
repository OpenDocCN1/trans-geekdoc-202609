  md: '# 10.1 Learning Outcomes


    This section outlines what you can expect to learn in this chapter. In addition,
    the corresponding section number is included for each learning outcome to help
    you to navigate the content, especially when you return to the chapter for review.


    In this chapter, you will learn:


    +   - How you can guide an observation through a Decision Tree (see Section 10.3.1).


    +   - How to use decision rules when observations are guided through a Decision
    Tree (see Section 10.3.1).


    +   - How you can use a training dataset to train a Decision Tree (see Section
    10.3.1).


    +   - How to use a trained Decision Tree to make predictions for new observers
    (see Section 10.3.1).


    +   - How sensitive the structure of a Decision Tree can react to small changes
    in the data or the hyper-parameters (see Section 10.3.2).


    +   - How several Decision Trees can be combined into an ensemble model like a
    Random Forest (see Section 10.4.1).


    +   - How you can use the Subspace Method and Bagging to create slightly different
    Decision Trees for a Random Forest (see Section 10.4.1).


    +   - How you can use Bootstrapping to create multiple Bootstrap samples and Out
    of Bag samples from one training dataset (see Section 10.4.1).


    +   - How to use a Random Forest model to predict vaccination behavior for the
    continental U.S. countries (see Section 10.4.2).


    +   - How you can use Gradient Boosting to combine Decision Trees into an ensemble
    where each Decision Tree adjusts for the errors of the previous Decision Tree
    (see Section 10.5).


    +   - How you use an interactive project to predict vaccination behavior with
    the ** XGBoost algorithm for the continental U.S. counties (see Section 10.5.2).'
