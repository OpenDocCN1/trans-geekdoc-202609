  md: '# 6.5 Tuning the Complexity of a Polynomial Model


    assessment observations might lead to a sub-par choice of hyper-parameter values.


    # Cross-Validation


    Instead of using one dataset where observations are earmarked for training or
    hyper-parameter assessment, the Cross-Validation procedure creates multiple training/assessment
    datasets folds or resamples. These folds differ only by which observations are
    chosen for training and which are used for hyper-parameter assessment. Figure
    6.4 shows the basic idea Cross-Validation for four folds.


    ![](img/f240d449191f5add983daf6c380e4fe3_167_0.png)


    **FIGURE 6.4** The Basic Idea Behind Cross-Validation


    Cross-Validation shuffles the training dataset and copies it N times, assigning
    each copy to one of N folds. Each of these has a different set of observations
    excluded from the training and used for the assessment of the various hyper-parameter
    combinations.


    Figure 6.4 shows an example for four folds. The shuffled training dataset is copied
    four times into Folds 1 – 4. In Fold 1, the last quarter of observations, are
    used for training. In Fold 2, the third quarter of observation is designed to
    be the assessment dataset, and the remaining quarter of observations are used
    for training. In Fold 3, the second quarter of observations is assigned to the
    assessment dataset, and in Fold 4, the first quarter. This assures that every
    observation is exactly used once in an assessment dataset.


    When a model is tuned, each value of the hyper-parameter values is assessed for
    all four folds (requires training of the model for each fold). The overall performance
    for a hyper-parameter value is calculated as the mean performance of the assessment
    observations in folds 1, 2, 3, and 4. The same process is repeated for the other
    hyper-parameter values.


    It is common to choose ten folds if the dataset is sufficiently big. For'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 6 Polynomial Regression — Overfitting/Tuning Explained


    smaller datasets, a lower number of folds can be selected. To compensate for a
    low number of folds, the process of shuffling the training data, creating folds,
    and training/assessing the models can be repeated several times. This requires
    setting the repeat= argument for the vfolds_cv() command to a value 1 (the default
    is repeat=1).


    The advantage of Cross-Validation is that different sets of observations are used
    for assessment (the mean prediction error is used to assess overall performance)
    and all observations of the training data at some stage of model assessment are
    used for validation. Therefore, the risk of an unusual assessment dataset is mitigated.


    The disadvantage of Cross-Validation is that each hyper-parameter setup needs
    to be trained and assessed separately for each of the folds. Computation time
    increases exponentially with the number of hyper-parameters tried out and proportionally
    with the number of used folds.


    Using the R code below, you can create the Cross-Validation folds for your Polynomial
    Model:


    ```

    set.seed(387)

    Folds=vfold_cv(DataTrain, v=4, strata=Price)

    ```


    For simplicity we generate four folds, although our dataset may be big enough
    to choose the common 10-fold setup. The command vfold_cv() creates the four folds
    (see the argument v=4). The strata ensures that the different house prices are
    proportionally represented in the various folds.


    # 6.5.4 Executing the Tuning Process


    Now that we have stored the four folds for training and hyper-parameter assessment
    to be tried out in the R object FoldsHouses and we can use the tune_grid() to
    evaluate each of the parameter values (degree 1–10). Given four folds and ten
    parameter values to evaluate, the tune_grid() command has to train and assess
    a total of 40/model/data variations.


    The command tune_grid() executes the workflow (see the R code below). It requires
    the name of the tuning workflow (TuneWFModelHouses) as the first argument. The
    data frame with the hyper-parameter values to be tried out must be provided with
    the grid argument (in our case: grid=GridGrid). Finally, an argument for the R
    object that holds the folds for training and assessment (resamples=FoldsHouses)
    is required. The metrics argument is optional. In the R code below, the argument
    metrics=metric_set(rmse,rsq,mae) determines that performance metrics for the'
