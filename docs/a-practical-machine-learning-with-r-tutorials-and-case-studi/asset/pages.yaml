    Tenure


    ![](img/f240d449191f5add983daf6c380e4fe3_324_0.png)


    **FIGURE 11.1** Ceteris Parabus Plot for the Variable Tenure


    Most interpretation algorithms work in two steps. First, an *explainer* object
    (here *Explainer RF*) is created, which is a container that stores the training
    data, the *model design*, and some other information that does not perform any
    interpretation tasks. In the second step, the interpretation is performed with
    another command based on the information from the explainer object.


    Note, when we create the explainer object with the command `explain()`, the command
    is prefixed with DALEX::. This ensures that both the `explain()` command from
    the DALEX package is used. It is necessary because both the tidyverse package
    and the time package that we use later in [Section 11.8] contain a command `explain()`.


    The *Ceteris Parabus* plot is created with the command `predict_profile()`. Arguments
    are the explainer (`explainer=ExplainerRF`), the observation used for the plot
    (`new_observation=OsHelga`), and the variable that is analyzed (`variables="Tenure""`).


    In the *Ceteris Parabus* plot in [Figure 11.1], Helga''s *Tenure/Wage* combination
    is marked with a blue dot. You can see that Helga''s wage would mostly stay the
    same if she had some more or less tenure. However, if Helga had much less tenure
    (*Tenure < 8*), her predicted wage would be much smaller. All this makes perfect
    sense for somebody with a high tenure and education.'
