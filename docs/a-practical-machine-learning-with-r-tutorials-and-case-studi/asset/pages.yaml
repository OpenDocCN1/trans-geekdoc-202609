- pgno: 315
  md: '# 11

    Interpreting Machine Learning Results


    In the previous chapters, you learned about different machine learning algorithms
    and applied machine learning models to predict continuous and categorical outcomes
    based on a set of predictor variables. We have also touched upon how to analyze
    and evaluate the performance of a machine learning model.


    This chapter examines how a model''s predictor variables impact the predictions
    of an outcome. In other words, what factors are most important for the model''s
    outcome, and how much do they contribute.


    Being able to interpret machine learning results is crucial for many applications.
    For example, mortgage lenders can use machine learning models to estimate default
    risk scores for loan applications.


    If a loan applicant is not approved, the bank must be able to explain the factors
    influencing the model''s prediction to ensure that the decision is fair and unbiased.


    Not long ago, many machine learning models, especially *Deep Learning* models,
    would be considered *black box* models, meaning that although they generate excellent
    prediction results, they fail to provide insights on how the predictions are derived,
    which variables are the most important ones, and how much each variable contributed
    to the predicted outcome. The *black box* problem caused some analysts to learn
    OLS models because their results are much more interpretable. However, this caused
    a dilemma. Although the prediction results from OLS models are more interpretable,
    they often do not produce a predictive quality comparable to non-linear machine
    learning models such as *Random Forest* or *Neural Network*.


    The good news is that researchers have made significant progress in recent years
    in machine learning interpretability. There are so many techniques to interpret


    > ¹The coefficients for the predictive variables show how a change of a variable
    will impact the prediction, the *P-values* indicate the significance of the prediction,
    and the overall contribution of the predictor variables is additive. You can find
    more about the interpretation of OLS and its limits in *Wooldridge (2020)*.'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'machine learning models that we can only cover a few selected algorithms in

    this book.


    In this chapter, we will introduce interpretation techniques to answer the

    three questions for specific machine learning models, such as tree-

    based models, also for machine learning models in general:


    # Impacts of Predictor Variable Change


    Question 1: If the value of a predictor variable changes, how will this impact

    the predicted outcome?


    In Section 11.5, we analyze how the prediction for a specific observation would

    change one of the values for one of the predictor variables changes. We will

    visualize the so-called Ceteris Paribus Plot.


    As an example, think about the loan application. How would the predicted

    risk score change if the applicant''s salary were higher or lower?


    We also use Partial Dependence Plots in Section 11.5 to quantify and visualize

    t impact on model predictions overall when the value for a predictor variable

    changes. Partial Dependence Plots are a summary of Ceteris Paribus Plots for

    al observations and thus explain the overall impact of a predictor variable''s

    change.


    # Predictor Variable Importance


    Question 2: Which variables are more or less important for the prediction,

    and which variables can potentially be dropped?


    Section 11.6 focuses on tree-based models, and we quantify how important each

    predictor variable is for the model''s outcome prediction. We results

    in a Variable Importance Plot (VIP) that shows a list of all predictor

    variables and their importance for the model prediction.


    We quantify variable importance in two ways:


    +   1) In Section 11.6.1, we use an impurity reduction measure to analyze

    how much each predictor variable reduces impurity when splitting

    t observations in the Decision Trees from parent nodes to the

    two child nodes.


    +   2) In Section 11.6.2, we estimate Variable Importance by the damage

    to the model''s predictive quality (increase of MSE) when the

    influence of a specific predictor variable is removed. The greater the

    damage, the higher the importance of that particular variable.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '11.1 Learning Outcomes


    # Predictor Variable Contribution


    Question 3: What is a predictor variable''s contribution to the predicted outcome
    of an observation?


    We will introduce two techniques quantifying the contribution of predictor variables
    to a specific prediction: SHAP (Shapley Additive Explanations) values and the
    LIME (Local Model-agnostic Explanations) approach.


    Section 11.7 introduces SHAP values. SHAP values measure how much predictor variable
    contributes to the result for an observation.


    Section 11.8 introduces LIME. In contrast to SHAP values, LIME does not interpret
    machine learning models directly. Instead, LIME approximates a machine learning
    model with a simpler interpretable model (e.g., a linear OLS) in the neighborhood
    of an observation. The simpler model is then used for interpretation.


    In the case of an applicant with the loan, SHAP values and LIME values could provide
    the following kind of information: Because of the applicant''s age, the risk score
    is higher by 17 units; because of the applicant''s low income, the risk score
    is higher by 5 units, and because the applicant never defaulted on a loan, their
    risk score is lower by 12 units.


    # 11.1 Learning Outcomes


    This section outlines what you can expect to learn in this chapter. In addition,
    the corresponding section number is included for each learning outcome to help
    you navigate the content, especially when you return to the chapter for review.


    In this chapter, you will learn:


    +   * How machine learning interpretation methodologies can be categorized into
    model-agnostic and model-specific methods (see Section 11.3).


    +   * How machine learning interpretation methodologies can be categorized into
    local methods (i.e., related to a specific observation) and global methods (i.e.,
    related to the complete model; see Section 11.3).


    +   * How you can generate and interpret Ceteris Paribus Plots to analyze the
    impact of changing predictor variables related to a specific observation (see
    Section 11.5.1).


    +   * How you can generate and interpret Partial Dependence Plots to analyze'
  merge: -1
  img_proc: true
