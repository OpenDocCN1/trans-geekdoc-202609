- pgno: 248
  md: "# 232 9 Deep Learning — MLP Neural Networks Explained\n\nneurons (H1 and H2),\
    \ and an output layer at the right of the network with one output neuron that\
    \ will later connect the diamond's predicted price (O1).\n\nThe three layers (input,\
    \ hidden, and output) are fully connected with the red and black lines, meaning\
    \ that each neuron of a previous layer is connected with each neuron of the following\
    \ layer. Considering that *perceptron* is a different neuron for *neuron*, you\
    \ can see where the name *Multi Layer* (input, hidden, output) *Perceptron* comes\
    \ from. The MLP in Figure 9.1 has only one hidden layer, but more complex MLP\
    \ networks have multiple hidden layers with many neurons inside each layer.\n\n\
    A Neural Network processes observations one by one and creates a prediction at\
    \ the output neuron (O1) for each observation. We will use Figure 9.1 to show\
    \ how a Neural Network can generate a prediction from the values of the predictor\
    \ variables of a given observation $i$. For now, we assume that values for the\
    \ parameters ($\beta$ ) are provided:\n\n**Step 1:** In the beginning of the prediction\
    \ process, the predictor variables of observation $i$ are loaded into the input\
    \ neurons (I1 and I2). For example, with a diamond with 0.3 clarity ($Carat=0.3$)\
    \ and rating of SII ($Clarity=3$), the input neuron I1 contains value of 0.3,\
    \ and the input neuron I2 contains value of a.\n\n**Step 2:** The values of the\
    \ input neurons are transmitted to the hidden neurons (H1 and H2), but before\
    \ they arrive, their values are weighted (multiplied) by the parameters $\beta_1,\b\
    eta_2,\beta_3, \\beta_4$, respectively. This way, the original value from the\
    \ input neuron are amplified or weakened, depending on whether the absolute values\
    \ for the $\beta$ are greater or smaller than one. A negative $\beta$ parameter\
    \ reverses the signs of the predictor variable values.\n\nIn the weighted inputs\
    \ ($Carat,\beta_2, Clarity,\beta_3, Carat,\beta_4$) that arrive at the hidden\
    \ neurons H1 and H2, the hidden neuron B1 sends a value that is equal to $\beta_3$\
    \ to hidden neuron H1 and a value of $\beta_4$ to hidden neuron H2. Because these\
    \ values are independent of the values for the predictor variables (I1 and I2)\
    \ always contain a value of one, the neurons B1 and B2 are biased neurons.\n\n\
    **Step 3:** As you can see in Figure 9.1 at the green $\\oplus$ signs in front\
    \ of the hidden neurons H1 and H2, three different weighted values arrive at each\
    \ before they are further processed. For each hidden neuron, the three values\
    \ are aggregated to single values called the *effective inputs* of the hidden\
    \ neurons by adding them up. This is symbolized by the green $\\oplus$ signs in\
    \ front of H1 and H2 in Figure 9.1. The *effective inputs* ($I_{1}^{eff}$ and\
    \ $I_{2}^{eff}$) for the hidden neuron H1 and H2 are:\n\n```\n$I_{1}^{eff} = \\\
    beta_1 + \\beta_2 Carat + \\beta_3 Clarity,$$\n```\n\n```\n$I_{2}^{eff} = \\beta_4\
    \ + \\beta_5 Carat + \\beta_6 Clarity,$$\n```\n\nand"
  merge: -1
  img_proc: true
- pgno: 249
  md: "# 9.4 The Idea Behind Neural Network Models\n\n**Step 4:** Two effective inputs\
    \ — one for each hidden neuron are now plugged into non-linear functions (called\
    \ *activation functions*) inside hidden neuron $H1$ and $H2$. The results are\
    \ called the *activities* ($A_{H1}^\\sigma$ and $A_{H2}^\\sigma$) of the neurons\
    \ $H1$ and $H2$. We will talk more about activation functions in a minute.\n\n\
    **Step 5:** The activities of the hidden neurons $A_{H1}^\\sigma$ and $A_{H2}^\\\
    sigma$ are transmitted to the output neuron (O1), but before they arrive, their\
    \ values are weighted by $\beta_1$ and $\beta_2$, respectively.\n\n**Step 6:**\
    \ Three values arrive at the @ sign in front of the output neuron (O1): the two\
    \ weighted *activities* from the hidden neurons ($\beta_1 A_{H1}^\\sigma$ and\
    \ $\beta_2 A_{H2}^\\sigma$) and the value from the bias neuron $B2$, which equals\
    \ $\beta_7$. These three values are aggregated (added up) to a single value, which\
    \ is the value of the output neuron O1, and the predicted price for the related\
    \ diamond.\n\nIn complex contexts, the output neuron O1 may also contain an activation\
    \ function, but here what goes into the output neuron comes without any transformation\
    \ ($O1 = f^\\sigma(O1)$).\n\nThe above, in connection with Figure 9.1 provide\
    \ a basic idea about how a Neural Network processes variables to generate a prediction\
    \ for an outcome variable. If the Neural Network contains more input and hidden\
    \ neurons, or more layers, the process is more complex, but the underlying idea\
    \ is the same.\n\nHowever, two questions have not been answered so far:\n\n**Question\
    \ 1:** We assumed that for the initial values of $\beta_j$: How are they determined?\n\
    \n**Answer:** The answer to this question is simple for the initial values of\
    \ $\beta_j$ (usually $-1 < \beta_j < 1$). This makes it possible to generate initial\
    \ predictions for all observations in the training dataset. The resulting initial\
    \ predictions are not very good. We need improvement by updating the $\beta$ parameters\
    \ in an iterative process. This updating process — called training the Network\
    \ — is a little more complex. We will discuss the underlying basics in Section\
    \ 9.4.4 after we cover a numerical example for a prediction in Section 9.4.3.\n\
    \n**Question 2:** How are the *activation functions* inside the hidden neurons\
    \ $H1$ and $H2$ transforming the *effective input values* ($I_{j,1}^\\sigma$ and\
    \ $I_{j,2}^\\sigma$) into the activities of the hidden neurons ($A_{H1}^\\sigma$,\
    \ and $A_{H2}^\\sigma$)?\n\n**Answer:** This is a bit more tricky: Various activation\
    \ functions can be used inside a hidden neuron to transform the *effective inputs*\
    \ $I_{j,i}^\\sigma$ into a activity $A_j^\\sigma$ ($j$ stands for the hidden neuron\
    \ number and $i$ for the observation number). Here, we use the Logistic function\
    \ — the same function we used"
  merge: -1
  img_proc: true
