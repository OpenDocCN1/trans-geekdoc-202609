    ```\n\nThe recipe utilizes step_update to create four additional variables that\
    \ are calculated as the square, cubic, quartic, and quintic of the variable Sqft:\n\
    \n+   - Sqft2=Sqft^2\n- Sqft3=Sqft^3\n- Sqft4=Sqft^4\n- Sqft5=Sqft^5\n\nBecause\
