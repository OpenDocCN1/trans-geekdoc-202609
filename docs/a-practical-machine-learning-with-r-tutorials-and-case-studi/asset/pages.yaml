- pgno: 233
  md: '# 8.5 Balancing Data with Downsampling, Upsampling, and SMOTE 217


    improved methods are needed to increase the number of observations in the minority
    class. One of these methods is SMOTE (Synthetic Minority Over-sampling Technique;
    see Chawla et al. (2002)). The idea behind SMOTE is to artificially generate new
    observations for the minority class, which is similar but not identical to existing
    observations. The SMOTE algorithm is implemented by the thesis package through
    step_smote() and works as:


    +   1. Randomly choose an observation from the minority class.

    2. Find the next neighbor to this observation using k-Nearest Neighbors (see Section
    4 for details about the k-Nearest Neighbors algorithm).

    3. Calculate a randomly weighted average for each predictor variable from the
    chosen observation from Step 1 and its nearest neighbor.

    4. Use the calculated values for the predictor variables to create a new observation
    for the minority class.


    Repeat Steps 1 – 4 until the number of observations in the minority class reaches
    the desired number of observations (the default is the same number as the majority
    class).

    The code block below is identical to the code blocks above, except that we use
    step_smote():


    ```

    library(thesis)

    set.seed(678)

    RecipeChurn=recipe(Churn-, data=DataTrain) |

    step_dummy(Gender) |

    step_smote(Churn)

    DataTrainBal=RecipeChurn |

    prep() |

    juice() |

    count(DataTrainBal, Churn)

    ```


    ```

    ## # A tibble: 2 x 2

    ## Churn n

    ## <fct> <int>

    ## 1 Yes 3621

    ## 2 No 3621

    ```


    The result in terms of observations in the minority and majority classes is the
    same as the one we got with step_upsample(). The improvement with SMOTE'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 8 Logistic Regression — Handling Imbalanced Data


    is that the observations in the minority class are now augmented with similar
    observations rather than identical copies of existing observations.


    Later, in Section 8.6, you can experiment with the balancing methods introduced
    here, such as step_downsample(), step_upsample(), step_smote(), and you can combine
    them as you wish.


    For the down- and upsampling commands step_downsample(), step_upsample(), step_smote(),
    you can also set the desired ratio between the majority and minority class.


    The Downsampling command uses the under_ratio= for the desired ratio. under_ratio
    is defined as:


    with: $N_{major} :=$ final number of observations for the majority class and $N_{minor}
    :=$ number of observations for the minority class


    For example, under_ratio=1 (the default) means that after downsampling is completed,
    the minority and the majority class have the same number of observations. over_ratio=1.2
    means that downsampling will be stopped when the number of majority observations
    is 20% bigger than the number of minority observations.


    For the two upsampling commands, step_upsample() and step_smote() the desired
    ratio is determined by argument over_ratio, which is defined as:


    ```

    $over_ratio = \frac{N_{minor}}{N_{major}}$

    ```


    with: $N_{minor} :=$ final number of observations for the minority class and $N_{major}
    :=$ number of observations for the majority class


    For example, over_ratio=1 (the default) means that after upsampling is completed,
    the minority and the majority class have the same number of observations. over_ratio=0.9
    means that upsampling will be stopped when the number of minority observations
    reaches 90% of the number of observations of the majority class.'
  merge: -1
  img_proc: true
