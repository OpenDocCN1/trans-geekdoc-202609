    # 3.7 How R Displays Very Big and Very Small Numbers


    Sometimes in data science projects, we work with big numbers and very small numbers.
    For example, at the writing of this book, the 2022 GDP (current dollars) of the
    U.S. is estimated to be $25.5 trillion or $25,500,000,000,000.


    An example of a small number is the chance of getting struck by lightning in the
    U.S. is about 0.0000000365 on any randomly chosen day.¹¹


    How we work in R with big or small numbers? Obviously, using them as they are,
    is not a good option. Instead, we can express numbers in scientific notation.


    Let us start with the GDP number: We could write the GDP as a number with one
    leading digit and state how many digits the decimal point should be moved to the
    right. So:


    > 2.55: decimal point 13 digits to the right


    This method might be a little better than writing it out a number, but it


