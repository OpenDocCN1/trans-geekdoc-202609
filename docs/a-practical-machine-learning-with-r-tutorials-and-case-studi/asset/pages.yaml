  md: "# 6 Polynomial Regression — Overfitting/Tuning Explained\n\nThe importance\
    \ of creating training and testing data, and how this can be done in R, was emphasized\
    \ in the previous chapters. Splitting the data into training and testing data\
    \ is necessary because you cannot use the same data to train (calibrate) a model's\
    \ parameters and assess a model's predictive quality. If you did, your model would\
    \ be overfitting!\n\n**Overfitting** is a situation where a fitted model approximates\
    \ the training data well, but fails on new observations, which it has never seen\
    \ before.\n\nIn this chapter, we first explain the problem of *overfitting* in\
    \ more detail (see Section 6.3). Then in Section 6.4, we use a univariate *Polynomial\
    \ Model* to demonstrate *overfitting* with an example. This model will predict\
    \ house prices based on various powers of the predictor variable square footage\
    \ (e.g., $Sqft^2$, $Sqft^3$, ...).\n\n| Polynomial Model |\n| A model that expresses\
    \ the relationship between the predicted outcome and the predictor variable(s)\
    \ as a polynomial function is called a Polynomial Model. A Polynomial Model involving\
    \ one predictor is called a univariate Polynomial Model. In contrast a Polynomial\
    \ Model involving two or more predictors is called a multivariate Polynomial Model.\
    \ |\n| Example - Multivariate Polynomial Model with predictor x: |\n\n```\n$\\\
    hat{y} = \beta_0 + \beta_1x + \beta_2x^2 + \beta_3x^3$\n```\n\nExample - Multivariate\
    \ Polynomial Model with two predictor variables ($x_1$ and $x_2$):\n\n```\n$\\\
    hat{y} = \beta_0 + \beta_1x_1 + \beta_2x_1^2 + \beta_3x_1x_2 + \beta_4x_2 + \b\
    eta_5x_2^2 + \beta_6$\n```\n\nThe term $x_1x_2$ is called an *interaction term*.\
    \ This is because it only has a high value (high influence on the outcome) if\
    \ $x_1$ and $x_2$ have high values. For example, to predict wage the two numerical\
    \ predictors skill level and years of experience could be modeled as an interaction\
    \ term because it requires both skill and experience to earn a high wage."
  merge: -1
  img_proc: true
