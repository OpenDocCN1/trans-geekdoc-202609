- pgno: 230
  md: 'The following section will introduce three algorithms that can help to fully
    or partially balance an imbalanced dataset. Afterward, in the interactive Section
    8.6, you will apply your knowledge and repeat the Logistic Regression analysis
    performed in this section but with a more balanced dataset.


    # 8.5 Balancing Data with Downsampling, Upsampling, and SMOTE


    In the previous section, due to an imbalanced dataset, predictions are biased
    toward the over-represented Churn = No class, called the majority class. The majority
    class represents the most prevalent classification in a dataset. In contrast,
    the minority class represents the classification that occurs rarely or in a dataset
    (Churn = Yes in the Telco dataset).


    A slightly imbalanced dataset does not cause any problems, but a dataset like
    the Telco dataset with 3,621 observations for the majority class and 1,038 observations
    in the minority class (see Table 8.2 further below) can cause predictions biased
    toward the majority class.


    The most common approaches to work with imbalanced datasets are removing from
    the majority class (downsampling) and/or adding observations to the minority class
    (upsampling):


    **Downsampling:** This procedure randomly deletes observations from the majority
    class until the ratio of the observations from the majority and the minority class
    reaches the desired ratio (e.g., 1:1).


    **Upsampling:** In its simplest version, upsampling creates new observations for
    the minority class by copying randomly chosen observations from the minority class
    until the ratio of the observations from the majority and the minority class reaches
    the desired ratio (e.g., 1:1).


    Often, a combination with up- and downsampling, we must decide to balance both
    the training and testing data or only the training data. The right decision is
    to balance the training data but not the testing data. This is because when the
    model is fully trained, the testing data is used to assess how the model will
    perform in the real world when facing new data in the production stage. Therefore,
    since the real world contains imbalanced data, the testing data should also contain
    imbalanced data neither treated with downsampling nor with upsampling


    In what follows, we will introduce one downsampling and two upsampling methods.
    These methods can be used in combination or individually. The thesis'
  merge: -1
  img_proc: true
- pgno: 231
  md: "# 8.5 Balancing Data with Downsampling, Upsampling, and SMOTE\n\nprovides the\
    \ related commands `step_downsample()`, `step_upsample()`, and `step_smote()`.\
    \ These commands process, by default, only the training data but not the testing\
    \ data.9\n\nLet us start with `downsampling`. In the code below, we first load\
    \ the recipe package (Hvitefeld (2023)) and then add `step_downsample()` to the\
    \ recipe that we use in Section 8.4 for the churn model.\n\n```\nlibrary(themisc)\n\
    set.seed(678)\nRecipe(Churn~, data=DataTrain) |\n  step_dummy(Gender)|\n  step_downsample(Churn)\n\
    ```\n\nLater, we will add a similar recipe to a workflow, and the workflow will\
    \ execute the recipe that balances the minority and majority classes.\n\nAt this\
    \ point, we want to find out if the recipe successfully changes the position of\
    \ the training data. To test this, we must explicitly apply the recipe to the\
    \ training data and store it in a new frame `DataTrainBal` for analysis.\n\nFor\
    \ this, we use the `juice()` command.10 It extracts the training data from the\
    \ recipe like a squeezes lemon juice out of a lemon. Note, you have to add prep(prepare)\
    \ after the recipe to ensure its execution before the data are extracted with\
    \ `juice()`.\n\n```\nDataTrainBal<-RecipeChurn |\n  prep(|\n  juice()\ncount(DataTrainBal,\
    \ Churn)\n```\n\n```\n# ## tibble: 2 x 2\n## Churn\n## <int>\n## 1 1388\n## 2\
    \ No 1388\n```\n\nAfter using the `juice()` command, you can see that the dataset\
    \ is now perfectly balanced. When you compare the data from `DataTrainBal`\n\n\
    > The skip argument determines if a `step_*` command is applied to the testing\
    \ data or if the testing data will be skipped. For most `step_*` commands, the\
    \ default is `FALSE` because usually, we want a `step_*` to be applied to the\
    \ training and testing data. However, the default for `step_downsample()`, `step_upsample()`,\
    \ and `step_smote()` is `isTRUE` to skip the testing data. You can change the\
    \ default values for `skip`, but it is not recommended.\n\n> 10In the book's following\
    \ chapters, we will not use `juice()`. Therefore, you do not need to memorize\
    \ the `juice()` command."
