  md: "for Logistic Regression in Chapter 8. We plug the effective inputs $I_{1,i}^{eff}$\
    \ and $I_{2,i}^{eff}$ into the Logistic function and calculate the activities\
    \ $A_{1,i}^{cl}$ and $A_{2,i}^{cl}$ for the hidden neurons $H1$ and $H2$:\n\n\
    ```\n$A_{1,i}^{cl} = \\frac{1}{1+e^{-I_{1,i}^{eff}}} \\quad (9.1)\\n$$A_{2,i}^{cl}\
    \ = \\frac{1}{1+e^{-I_{2,i}^{eff}}} \\quad (9.2)$\n```\n\n# 9.4.2 Transforming\
    \ the Graphic Approach Into a Prediction Equation\n\nFigure 9.1 and Step 3 above\
    \ show the structure of a *Neural Network*, but for using a computer to make predictions,\
    \ the graph needs to be transformed into a prediction equation, which is the goal\
    \ of this section.\n\nFigure 9.1 and 3 show how the *effective inputs* for the\
    \ two hidden neurons are calculated from the weighted predictor variables and\
    \ the bias neurons. From an observation, this can be expressed in the two equations\
    \ determining $I_{1,i}^{eff}$ and $I_{2,i}^{eff}$:\n\n```\n$I_{1,i}^{eff} = \\\
    beta_1 + \\beta_2Carat + \\beta_3Clarity, \\quad (9.3)\\n$$I_{2,i}^{eff} = \\\
    beta_4 + \\beta_5Carat + \\beta_6Clarity, \\quad (9.4)$\n```\n\nWe can substitute\
    \ $I_{1,i}^{eff}$ and $I_{2,i}^{eff}$ into Equations (9.3) and (9.4) into the\
    \ activation functions (9.1), and (9.2) and we get the *activities* for the hidden\
    \ neurons:\n\n```\n$A_{1,i}^{cl} = \\frac{1}{1+e^{-(\\beta_1+\\beta_2Carat+\\\
    beta_3Clarity)}} \\quad (9.5)\\n$$A_{2,i}^{cl} = \\frac{1}{1+e^{-(\\beta_4+\\\
    beta_5Carat+\\beta_6Clarity)}} \\quad (9.6)$\n```\n\nNote, the *effective inputs*\
    \ ($I_{1,i}^{eff}$ and $I_{2,i}^{eff}$) for the two hidden neurons are highlighted\
    \ to make the equations easier to read.\n\nEquations (9.5) and (9.6) show that\
    \ we can calculate the *activities* for the hidden neurons $H1$ and $H2$ entirely\
    \ based on the predictor values of an observation $\beta$ (and we do!)\n\nAfter\
    \ transforming the *activities* ($A_{1,i}^{cl}$ and $A_{2,i}^{cl}$) of the two\
    \ hidden neurons into formulas, we are only two steps away from predicting the\
    \ price of a diamond. As shown before in Steps 5 and 6, the predicted price can\
    \ be calculated from the *activities* of the hidden neurons and the bias neuron\
    \ as follows:"
