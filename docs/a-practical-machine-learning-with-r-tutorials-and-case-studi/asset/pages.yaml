- pgno: 138
  md: "5 Linear Regression — Key Machine Learning Concepts\n\n# ## 5.4.3.2 Finding\
    \ Optimal Parameters Using an Optimizer\n\nThe Grid Search algorithm tries all\
    \ possible pairwise $\beta$ combinations. However, as we saw, it can be very slow.\
    \ This raises the question if it is really necessary to calculate the $MSE$ for\
    \ all pairs or if there is a more systematic approach.\n\nDifferent types of $Optimizers$\
    \ fill this void. In general, the process for an $Optimizer$ to find an $MSE$-minimum\
    \ can be described in four steps:\n\n+   * The Optimizer uses a guess for the\
    \ parameters to start the Optimizer process.\n* For example, we use $\beta_1 =\
    \ 4$ and $\beta_2 = 61$ as a first guess.\n* The Optimizer uses the error function\
    \ to calculate the target $MSE$-value for the chosen parameters.\n* We will use\
    \ the function to calculate the $MSE$ based on the training data and the $\beta_1$\
    \ and $\beta_2$ parameters.\n* The Optimizer changes the parameters so that the\
    \ new result in a lower target value (a lower $MSE$).\n* Repeat Steps 2 and 3\
    \ until the target value ($MSE$) approximately reaches a minimum.\n\nThe process\
    \ described above leads to a local minimum. A local minimum guarantees that no\
    \ $\beta$-combination with a lower $MSE$ exists in the close vicinity of the minimum\
    \ (similar $\beta$). However, it is possible that the minimum found is not unique\
    \ and other local minima exist. Some or all of these local minima have a smaller\
    \ $MSE$.\n\nIn practices, the problem of a local minimum is negligible. In some\
    \ cases (including linear regression), we already know that only one minimum exists.\
    \ In other cases, the predictive quality is already good, and it is not very relevant\
    \ if we can improve it.\n\nMost importantly, a high approximation of the training\
    \ data might lead to overfitting — approximating the training data poorly (more\
    \ in Chapter 6). Therefore, finding the lowest minimum (global minimum) for the\
    \ $MSE$ for the training data might not be in our best interest. The old saying\
    \ “Perfect is the enemy of the good”, applies.\n\nThe good message is that $Optimizers$\
    \ are already integrated into almost all machine learning algorithms. They are\
    \ executed automatically and can be treated as a black box.\n\nIn addition, $R$\
    \ (like most statistical software packages) provides an $Optimizer$ as a command\
    \ that we can use to minimize error functions. The command"
  merge: -1
  img_proc: true
- pgno: 139
  md: "# 5.4 Univariate Mockup: Study Time and Grades\n\nis called optim(), and we\
    \ will only use it in this section to find the optimal parameters for the $\b\
    eta$s for the mockup example.\n\nIn its default mode, the optim() command requires\
    \ three arguments:\n\n+   - A vector with the initial guess of the values for\
    \ the $\beta$s. Here we use $\\beta_1 = 4$ and $\beta_2 = 61$ (if you like, you\
    \ can try to run the Optimizer with a different initial guess).\n- The name (without\
    \ the parentheses) of the $R$ function to be minimized. In this case, `fctMSE`.\n\
    - The name of the data frame that contains the training data. In this case, `data=DataMockup`\n\
    \n```\nlibrary(tidymodels)\nVecBetaFirst=c(4, 61)\nBestModel=optim(VecBetaFirst,\
    \ fctMSE, data=DataMockup)\ncat(\"Optimal parameters values for betal and beta2:\
    \ \\ BestModel$par)\n```\n\n> # Optimal parameters values for betal and beta2:\
    \ 3.963 64.18\n\n> ## Minimum MSE: 20.79\n\nThe optim() command's output is stored\
    \ in the $R$ object BestModel. We can extract the optimal parameters with BestModel$par\
    \ and the minimal $MSE$ with BestModel$value.\n\nYou can see the optimal parameters\
    \ $\beta_{opt,1}$ and $\beta_{opt,2}$ are similar to what we calculated in Section\
    \ 5.4.2 with $OLS$. Remember, these parameters were found by trial-error and not\
    \ calculated using the $OLS$ formula.\n\n# Optimizers as a Black Box\n\nMost machine\
    \ learning models have built-in Optimizers. We can treat them as black boxes.\n\
    An Optimizer is a black box. It finds the best parameters for an function that\
    \ only depends on the training data and a set of parameters.\nThis is all you\
    \ need to know about the fitting process of machine learning models.\nThe fit(dataTrain)\
    \ command from the tidymodels package pushes the training data to an internal\
    \ Optimizer. Then the Optimizer finds the optimal parameter values for the $\b\
    eta$s and creates a fitted workflow that can be used for prediction."
  merge: -1
  img_proc: true
