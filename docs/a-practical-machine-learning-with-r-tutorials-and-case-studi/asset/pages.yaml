  md: '# 7.4 The Idea Behind Regularization


    The glnet package is a highly efficient package developed by Friedman et al. (2010).
    It supports multiple machine learning algorithms including Lasso with linear_reg(mixture=1)
    and Ridge with linear_reg(mixture=0). We will discuss the hyper-parameter mixture
    in more detail in Section 7.4.3. In the code block above, we use mixture=1 to
    work with a Lasso model.


    The other hyper-parameter penalty in the code block above stands for the λ in
    Equation (7.6). This tidyeverse hyper-parameter name is a little confusing because
    it determines the strength of the penalty but not the penalty itself. Just remember,
    penalty and lambda are essentially the same.


    The hyper-parameter penalty can either be set to a specific numerical value or
    determined in the tuning process. In the case, tuning and regularization are combined.
    In the interactive project in Section 7.4.3 we will tune the penalty (the λ).
    In the code block above, we arbitrarily chose penalty=500 to keep things simple.


    Since the work WFModelLasso is a fitted workflow model (it was calibrated with
    the training data), we can extract the model parameters with the tidy() command:


    ```

    tidy(WFModelLasso)

    ## A tibble: 6 x 3

    ##   term estimate penalty

    ##   <chr> d dbl

    ## 1 (Intercept) 509945 500

    ## 2 Sqft -460508 500

    ## 3 Sqft2 1171967 0

    ## 4 Sqft3 0 500

    ## 5 Sqft4 0 500

    ## 6 Sqft5 -560318 500

    ```


    Notice that including the Lasso penalty, the β parameters (see column estimate)
    are smaller than those from the unregularized benchmark model in Section 7.1.
    Two parameters (β and β¹) are equal to zero, essentially eliminating the related
    predictor variables Sqft and Sqft⁴ from the prediction equation. This is more
    obvious when you plug in the Lasso β values into Equation (7.1):


    > Other than comparing the size of the parameters between the two models, the
    individual β parameters are not interpretable. This is because a univariate Degree-β
    Polynomial model is already too complex to be interpreted.'
