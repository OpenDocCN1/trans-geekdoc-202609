  md: '# 5.6 When and not to use Linear Regression


    the fact that it is used as a criterion to find the best parameters. However,
    the $MSE$ and the $rmse$ numerical values are not well suited for interpretation.


    The $r^2$ (rsq) expresses the proportion of the variance of the outcome variable
    ($Price$) explained by the prediction equation. In our case, the regression can
    explain 54% of the $Price$ variance.


    The most intuitive of the metrics calculated above is the mean absolute error
    ($mae$). The analysis performed shows that based on the observations from the
    testing data, the model over/underpredicted the true housing price on average
    by $163,358.


    # 5.6 When and not to use Linear Regression


    +   - OLS regression can predict an underlying linear relationship between a continuous
    variable and one or more predictor variables. The resulting parameters are interpretable,
    and significance tests are possible if certain conditions (the Gauss-Markov conditions)
    are fulfilled (see Gujarati and Porter (2009) for more details).


    +   - Linear regression is not a good choice if a classification problem like
    predicting if a wine is red or white. In Chapter 8 when Logistic Regression is
    covered, we explain in detail why linear regression is ill-suited for classification.


    +   - If the true relationship between the outcome and predictor variable(s) is
    nonlinear, OLS regression is, in most cases, not a good tool to use. Although
    we can introduce some degree of non-linearity into a linear regression by transforming
    data logarithmically while utilizing them as predictor and outcome variables,
    more complex non-linear relationships are unsustainable for OLS regression.


    You can see in Figure 5.2, where the underlying relationship between the outcome
    variable $Y$ and the predictor variable $X$ follows a parabolic trend (see the
    blue data points). Using $OLS$ on the data in Figure-5.2 would give the regression
    function. You can see that this regression function systematically underestimates
    smaller predictor values ($x \le 120$), overestimates for values in the middle
    ($120 < x \le 165$), and underestimates for larger values ($x \ge 180$).


    +   - It is possible to model basic interactions between predictor variables with
    $OLS$ by transforming the data and thus indirectly introducing non-linearities
    (Chapter 7 provides an example).


    However, using interaction terms, researchers must decide upfront'
  merge: -1
  img_proc: true
- pgno: 148
  md: '![](img/f240d449191f5add983daf6c380e4fe3_148_0.png)


    FIGURE 5.2 Estimating a Parabolic Trend with OLS Regression


    which interactions to consider. In addition, interpreting the significance of
    the interaction terms can be problematic.

    If the goal is to consider more complex interactions and upfront assumptions about
    the type of interactions are difficult, other machine learning algorithms such
    as *Neural Networks* (see Chapter 9) or tree-based algorithms (see Chapter 10)
    are superior to OLS.


    In many cases it is a good idea to use linear regression as a benchmark and then
    evaluate if more advanced machine learning models can deliver better predictive
    quality.


