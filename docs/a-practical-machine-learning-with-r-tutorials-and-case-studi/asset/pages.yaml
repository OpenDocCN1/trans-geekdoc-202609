  md: '# TABLE 8.2 Churn Count for Original Telco Training Dataset


    | Churn | n | Proportion |

    | Yes | 1308 | 0.2654 |

    | No | 3621 | 0.7346 |


    the original Telco training data (see Table 8.2), you can also see that we can
    lose observations from the minority class because the minority class was reduced
    to 1,308 observations of 3,621 observations. Of course, so many records means
    a lot of information.


    This brings to upsampling. The idea behind upsampling is to randomly copy observations
    in the minority class until the minority class reaches the desired number of observations
    (the default is the same as the minority class). The code block below is identical
    to the code blocks above, except that we use step_upsample() instead of step_dummy():


    ```

    library(thesis)

    set.seed(678)

    RecipeChurn=RecipeChurn(Churn-, data=DataTrain) |

    step_dummy(Gender) |

    step_upsample(Churn)


    DataTrainBal=RecipeChurn |

    prep() |

    juice()

