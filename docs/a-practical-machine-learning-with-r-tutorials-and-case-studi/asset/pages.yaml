- pgno: 124
  md: "108 — Linear Regression — Key Machine Learning Concepts\n\nIn linear regression\
    \ the term *coefficients* instead of *parameters* is often used for the $\beta$\
    \ values. We choose the term *parameters* to be compatible with other machine\
    \ learning algorithms in upcoming chapters.\n\nWe will introduce two methodologies\
    \ for finding the optimal $\beta$:\n\n+   **Method 1**: Using Ordinary Least Squares\
    \ (OLS) to calculate optimal values for the parameters $\beta$. $OLS$ is the default\
    \ method for almost all statistical programs for regression, including $R$.\n\n\
    +   **Method 2**: Using a systematic *trial-and-error process* to find optimal\
    \ $\beta$ parameters.\n\nBoth methods lead to approximately the same results.\
    \ Therefore, it seems redundant to introduce *trial-and-error* method when we\
    \ can calculate the results precisely with $OLS$.\n\nThe reason for introducing\
    \ *trial-and-error* approaches is that more complex machine learning algorithms\
    \ do not allow us to calculate the optimal parameters, and we have to fall back\
    \ onto *trial-and-error* approaches.\n\nThis chapter introduces two *trial-and-error*\
    \ algorithms. This will allow us to treat these as a *black box* when we use them\
    \ in the following chapters.\n\nIn the previous chapter, we used the *confusion\
    \ matrix* to assess prediction quality. Linear regression, this is not possible\
    \ because outcome variables are continuous. Various methods (see Section 6.4)\
    \ are available to measure prediction quality for a continuous variable. For simplicity,\
    \ we will only use the *Mean Squared Error* (MSE) to quantify prediction quality:\n\
    \n```\n$MSE = \\frac{\\sum_{i=1}^{N}(\\hat{y}_i - y_i)^2}{N}$\n```\n\nLooking\
    \ at the formula above, you can see that this metric is *Mean Squared Error*.\
    \ The term $(\\hat{y}_i - y_i)^2$ quantifies the [squared] error for each observation.\
    \ So, summing over all squared errors and dividing by the number of observations\
    \ gives us the Mean Squared Error.\n\n# 5.4 Univariate Mockup: Study Time and\
    \ Grades\n\nTo illustrate the OLS approach (see Section 5.4.2) and two different\
    \ *trial-and-error* approaches (Grid Search in Section 5.4.3.1) and an *Optimizer*\
    \ approach in Section 5.4.3.2), we use an extremely simplified mockup dataset\
    \ consisting of only five observations. In the real-world five observations are\
    \ surely not"
  merge: -1
  img_proc: true
