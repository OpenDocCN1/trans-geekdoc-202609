    Logistic Regression).


    # 2.4 Machine Learning Terminology


    In this book, we will limit machine learning terminology to include only the essential
    terms. Terminology is important because when we communicate, we need to agree
    on the meaning of specific terms. This prevents misunderstandings and avoids defining
    terms over and again.


    In what follows, we define eight important machine learning terms which will be
    used frequently throughout the book:


    **Prediction:** Predicting is to use the values of one or more known variables
    to estimate the value of an unknown variable (outcome). Predictions can be forecasts
    of an event in the future. For example, we might predict tomorrow''s weather based
    on today''s weather and today''s barometric pressure. Predictions are often imperfect.
    For example, predicting the price of a house (today) based on its square footage
    (today).


    **Predictor vs. Outcome Variables:** A predictor variable is a variable that is
    used to predict an outcome. The values of predictor variables are, and they are
    used to predict the value of the outcome variable for the related observation.
    If the value of an outcome is based on a prediction, we add a $\hat{}$ hat on
    top of the outcome variable. In contrast, if we know the value of the outcome
    from the data, we omit the hat.


    Here is an example: Assume we want to predict the outcome variable Price, for
    a specific single-family home (this house would be our observation $i$), and the
    prediction is based on the house''s square footage (predictor'
