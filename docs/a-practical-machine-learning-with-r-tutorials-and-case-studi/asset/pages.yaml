    # ## Birth years for Carsten Jose Jane: 1979 2001


    Run the code to estimate the birth years for Carsten, Jose, and Jane. The estimated
    birth years are calculated as the difference between the current year (the numeric
    value stored in the R object CurrentYear) and all three values stored in the vector
    object VecCages. Consequently, the result (VecBirthYears) contains three values
