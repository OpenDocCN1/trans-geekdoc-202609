    You can see in Figure 9.8 that more neurons lead to a mean average error, lower
    root mean squared error, and higher r². Figure 9.8 also shows that a higher dropout
    rate leads to a mean average error, higher root mean squared error, and lower
    r². This suggests trying more neurons and lower dropout rates.


