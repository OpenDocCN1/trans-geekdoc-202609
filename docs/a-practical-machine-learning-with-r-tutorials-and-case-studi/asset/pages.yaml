  md: '# 11.7 SHAP Contribution of Predictor Variables


    contributes negative $2.78 to her predicted wage ¹¹¹ All these contributions add
    up to 3.3 and explain why Helga''s wage is $3.30 higher than the wage of an average
    worker.


    Predicting wage for the remaining six coalitions in the chart Figure 11.6:


    We have already explained that the predicted wage for Coalition: none is calculated
    as the mean wage from the observations in the training dataset. We also showed
    that the wage prediction uses all predictor variables (Coalition: ETF) could be
    calculated as the prediction from the analyzed machine learning model (the Random
    Forest Model from Section 11.4 in our case).


    To calculate the predictions for the six coalitions in the flow Figure 11.6 using
    a very simplified approach.


    To create predictions for Coalition: E, and Coalition: F, we created three new
    Random Forest models designed for one predictor variable each. We then fitted
    each of the Random Forest models to the training data for the predictor variables
    Educ, Tenure, and Female, respectively. Afterward, we used the three Random Forest
    models to create the predictions for Helga''s wage based on Educ = 17 (Coalition:
    E), Tenure = 18 (Coalition: T), and Female = 1 (Coalition: F).


    For the wage predictions for Coalition: ETF, and Coalition: F, we proceeded in
    a similar fashion: We created three new Random Models for two predictors and then
    fitted each model with the related two predictor variables from the training dataset
    (ET, EF, and TF). As before, we used the corresponding predictor values from the
    observation Helga to generate the wage predictions for the three coalitions.


    The advantage of this simplified approach is that it is possible to showcase the
    approach in an R script (see the Digital Resource Section 11.10 for a link to
    a blog article that describes the approach in detail and provides the R script).
    The disadvantage is that this simplified approach has a conceptual and computational
    drawback.


    The Computational Drawback: Our goal is to generate SHAP values to explain the
    Random Forest model from Section 11.4—the one that was used for Coalition: ETF.
    However, for the six coalitions that used only one or two predictor variables,
    we used similar but different Random Forest models because these Random Forest
    models were designed for one and two predictor variables. This is conceptually
    problematic.


    The Computational Drawback: The simplified approach is not scalable.


    > ¹¹The fact that Helga''s reduces her wage by about $3 should not come as a surprise.
    The data are from 1976 and reflect sex discrimination during that time. To analyze
    discrimination in present times, we could use a similar methodology based on most
    recent data.'
