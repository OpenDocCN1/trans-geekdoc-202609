- pgno: 184
  md: '# 6 Polynomial Regression — Overfitting/Tuning Explained


    +   - Regular OLS models and basic Polynomial Models have the advantage that the
    coefficients are directly interpretable. This is not true anymore even for slightly
    more complex Polynomial Models.


    Since the advantage of direct coefficient interpretability is lost for more complex
    Polynomial models, it is recommended to use powerful machine learning models such
    as Neural Networks (see Chapter 9) or tree based models like Random Forest (see
    Chapter 10) when analyzing complex regression problems.


    # 6.9 When and not to Use Tuning


    +   - Anytime machine learning model has hyper-parameters from which you believe
    they have an impact on the predictive quality, you should use tuning.

    - Even if you have a small dataset, you can use tuning. Although the tuning procedures
    described here are not well suited for small datasets you can use procedures like
    Bootstrapping or Leave-One-Out (see Kuhn and Silge (2022) for details details
    for smaller datasets.

    - Deciding hyper-parameters to tune and how many values to try can be challenging.
    This is especially true when you tune more than one hyper-parameter. In that case,
    you have to try different combinations of the values for each hyper-parameter,
    and consequently, the number of models to tune can get very big very fast. The
    number of models times the number of hyper-parameter value combinations. For example,
    if you have ten folds and three hyper-parameters with five values each, and you
    want to try out all combinations of these hyper-parameter values, you have to
    fit 1250 model/data combinations (10·5·5=1250).


