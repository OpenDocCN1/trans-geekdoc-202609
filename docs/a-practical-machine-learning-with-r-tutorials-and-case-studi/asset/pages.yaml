  md: '# 3.11 Exercises: Working with R


    # Logical Data Type


    The following exercises cover logic R objects. We will assign TRUE and FALSE to
    different objects and combine them with &(AND) and | (OR) to see the result. We
    will also perform calculations with logic R objects. Remember that TRUE stands
    (internally) for 1 and FALSE for 0.


    # Exercise 7:


    Below TRUE is assigned to two logical R objects. These two R objects are combined
    with an AND (&), saved into another logical R object, and then printed to the
    Console with the cat() command:


    ```

    IsLifeGood=TRUE

    IsMoodGood=TRUE

    IsHappy=IsLifeGood & IsMoodGood

    cat("Happiness", IsHappy)

    ```


    Run the code above, and you will see the result for IsHappy is TRUE. This is because
    we require for happiness (IsHappy) that life is good and that the person is in
    a good mood. Both were the case; therefore, the result was TRUE for IsHappy.


    Your turn: Assume that life is still good, the person’s mood changes from good
    to not-good. Change TRUE and FALSE accordingly. What happens to the person’s happiness
    (IsHappy) when you execute the new code? Explain.


    # Exercise 8:


    Here is an example for OR (|):


    ```

    IsWeatherDry=TRUE

    IsIndoor=FALSE

    IsStayingDry=IsWeatherDry | IsIndoor

    cat("Person stays dry", IsStayingDry)

    ```


    If the weather provides sunshine or a person indoors, the person will get wet
    from rain and will stay dry. Only one of the two logical objects to be TRUE for
    IsStayingDry.


