    in Step 10 of the template. Please keep in mind that metrics based on testing
    data should only be used to assess the last model and not for tuning adjustments
    because this could lead to overfitting.


    # 9.8 When and When Not to Use Neural Networks


    +   * Neural Networks shine when they consist of many layers and hidden neurons
    (some Neural Networks like Natural Language Processing networks, often have millions
    or even billions of parameters). These networks are well suited to model highly
    complex non-linear relationships.'
