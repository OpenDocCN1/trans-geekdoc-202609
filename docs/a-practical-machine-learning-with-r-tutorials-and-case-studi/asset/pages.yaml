- pgno: 103
  md: '# 4.8 Interpreting a Confusion Matrix


    In the previous section, a *confusion matrix* was created to assess the predictive
    quality of the *k*-Nearest Neighbors model. The first classification class (red
    in our example) listed in a *confusion matrix* is usually called Positive Class,
    while the second class listed is the Negative Class (white in our example). However,
    which class is considered positive and which is considered *negative* is arbitrary
    and mostly not important as long as we agree on which one is positive and which
    is negative.


    The *confusion matrix* from the previous section is printed below. For easier
    readability, the four entries are labeled as *True Positives (TP)*, *False Positives
    (FP)*, *False Negatives (FN)*, and *True Negatives (TN)*.


    ```

    ## Truth

    ## Prediction red white

    ## red TP: 436 FP: 46

    ## white FN: 44 TN: 434

    ```


    Both (cells) in the *first row* of the confusion matrix represent the counts for
    predicting a wine as *red* (the positive class). The first entry shows 436 wines
    predicted as red which are actually red (*True Positives; TP*). On the other hand,
    the second entry of the first row represents 46 wines that are white and predicted
    as *red*, and are therefore falsely predicted because they are actually white
    (*False Positives; FP*).


    We can make similar statements for the *second row* in the confusion matrix. The
    second row represents the counts for wines that are predicted as *white* (the
    negative class). 44 wines are predicted as white, but because they are actually
    *red*, they are falsely predicted (*False Negatives; FN*), while 434 are correctly
    predicted as *white* (*True Negatives; TN).*^5


    We can calculate test *accuracy* and see that the result has improved compared
    to our visual attempts in Section 4.4.


    ```

    $Accuracy = \frac{TP + TN}{TP + FP + TN + FN} = 0.91$$

    ```


    **Warning: Be careful when interpreting accuracy as a single metric!**


    ^4In tidymodels, the positive class is the one that is listed first in the factor
    levels.

    5Hint: When trying to find out which cells in a *confusion matrix* TP, FP, TN,
    and FN, start with interpreting the rows (the *predictions*) and then interpret
    the columns (the truth).'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Confusion Matrix: Be Careful with Accuracy


    The made-up story clearly demonstrates a problem when only accuracy is used to
    evaluate a learning model.


    Dr. Nebula claims what he calls a 97% Machine Learning Gambling Prediction. Here
    is how it works: Gamblers can buy a prediction from Dr. Nebula for a fee of $5.
    Dr Nebula will then run his machine learning model and send an envelope with the
    prediction. The gambler is supposed to open the envelope right before placing
    a bet of $100 on a number in roulette. The envelope contains a message that states
    either "You will lose", which allows the gambler to act accordingly by either
    placing or not placing the bet.


    Dr. Nebula claims a "clinical trial" performed by 1,000 voters, who opened the
    envelope after they bet on a number in roulette, the machine learning model uses
    a *naive proxy*. It always predicts "You will lose".


    How could Dr. Nebula have such a proxy? The trick is that his machine learning
    model uses a *confusion matrix* from the 1,000 voters'':


    ```

    ### Prediction Loss

    ## Win | 0

    ## Loss | 27

    ```


    Roulette (including the zero) 37 numbers to bet on. Consequently, the chance to
    win is 1/37. This means that out of the 1,000 voters, 27 are expected to win.
    You can see that in the *confusion matrix* above, the accuracy promised by Dr.
    Nebula is high. When you divide the sum of the diagonal elements of the matrix
    by the observations, you get 0.973.


    However, when we look at the correct and negative rates separately, we see that
    Dr. Nebula''s *accuracy rate* (although correct) makes little sense.


    The negative rate (*specificity*) is 100% (out of 973 voters who lost, all were
    correctly predicted as "You will lose"). In fact, the positive rate (*sensitivity*)
    is 0% (out of the 27 winners, all were falsely predicted as "You will lose").
    This shows:


    When interpreting the confusion matrix, you must look at accuracy, and specificity
    simultaneously.


    In the example, Dr. Nebula intentionally misused the confusion matrix''s interpretation
    to his financial advantage.


    However, you can unintention run into the same problem because sometimes learning
    models "the easiest way" to generate a successful prediction, which could be the
    naive proxy.


    This is especially true when the outcome in the classification is unbalanced,
    meaning that values for one of the classes (negative or positive) occur dramatically
    more often than others. You will learn how to identify unbalanced datasets and
    how to mitigate this in Chapter 8.


    To make sure the high *accuracy rate* from our *k-Nearest Neighbors* model is
    not misleading, we will separately calculate *sensitivity* — the rate of correctly
    predicted positives (red wines) and *specificity — the rate of correctly predicted
    negatives (white wines).'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 4.9 Project: Predicting Wine Color with Several Chemical Properties


    We start calculating sensitivity from the *confusion matrix*: 480 wines (the sum
    of the left column) in the testing dataset are red wines (positive class). From
    these red wines, 436 were predicted correctly. We can calculate sensitivity as
    follows:


    ```

    $Specificity = \frac{TP}{TP + FN} = \frac{436}{436 + 44} = 0.9083$

    ```


    Specificity is calculated similarly, but we focus on the right column of the *confusion
    matrix*: 480 wines (the sum of the entries in the right column) in the testing
    dataset are white wines (negative class). From these white wines, 434 were predicted
    correctly. Therefore we can calculate specificity as follows:


    ```

    $Specificity = \frac{TN}{FP + TN} = \frac{434}{46 + 434} = 0.9042$

    ```


    To summarize, based on the dataset, the overall *accuracy* (proportion of correctly
    predicted wines) was 90.62%, *sensitivity* (proportion of correctly predicted
    red wines) was 90.83%, and *specificity* (proportion of correctly predicted white
    wines) was 90.42%.


    For the analysis in this section, we used only two predictor (sulfur dioxide content
    and acidity of the wines). In the following section, you will repeat the analysis
    with your own model, but you will use all available predictor variables to improve
    the predictive quality further.


