  md: "# 5 Linear Regression — Key Machine Learning Concepts\n\n```\n$MSE = \\frac{1}{N}\
    \ \\sum_{i=1}^{N} (\\hat{y}_i - y_i)^2$$\n$$\\longleftarrow \\text{Prediction\
    \ } i$$\n$$MSE = \\frac{1}{N} \\sum_{i=1}^{N} (\beta_1 x_i + \\beta_2 - y_i)^2\
    \ \\quad (5.9)$\n```\n\nEquation (5.9) provides the formula to calculate the *MSE*.\
    \ For a training dataset (all $y$ and $x_i$ are known), we can choose any pair\
    \ $\beta_1$ and $\beta_2$, and use Equation (5.9) to calculate the related *mean\
    \ squared error* (see Section 5.4 for details). However rather than arbitrarily\
    \ choosing values for $\beta_1$ and $\beta_2$, we will use more systematic approaches.\n\
    \nIn Section 5.4.3.1, we use Grid Search: First, we generate two vectors $\beta_1$\
    \ and $\beta_2$ containing various values, respectively. Then we will use R to\
    \ generate all possible combinations for $\beta_1$ and $\beta_2$ values. For each\
    \ of the results of $\beta_1$ and $\beta_2$, we will calculate the $MSE$ and finally\
    \ choose the pair with the lowest $MSE$.\n\nIn Section 5.4.3.2, we will use an\
    \ Optimizer to find optimal values for $\beta_1$ and $\beta_2$. An *Optimizer*\
    \ is an iterative computer algorithm that can minimize or maximize a target function.\
    \ In our case the $MSE$ function (5.9) is the target function.\n\n# 5.4.3.1 Finding\
    \ Optimal Parameters Using Grid Search\n\nThis section uses the *Grid Search*\
    \ algorithm to find the pair of $\beta_{1,opt}$ and $\beta_{2,opt}$ that minimizes\
    \ the $MSE$.\n\nLet us begin by deciding a range for $\beta_1$ and $\beta_2$ and\
    \ on how many values we would like to test for. At the beginning of this section,\
    \ we used $\beta_1 = 4$ and $\beta_2 = 61$, and the predictions were not too bad.\
    \ So, why not use a range around $3 - 5$ for $\beta_1$ and a range of $50 - 70$\
    \ for $\beta_2$? For each, $\beta_1$ and $\beta_2$, we will generate about 20\
    \ values in the chosen range.\n\nIn the code block below, we generate a sequence\
    \ of values for $\beta_1$ ranging from 3 to 5 with an increment of 0.1. For $\b\
    eta_2$, we choose values ranging from 50 to 70 with an increment of 1 in 21 values\
    \ for each, $\beta_1$ and $\beta_2$. These values are assigned to the $R$ vector\
    \ objects `vecBeta1Values` and `vecBeta2Values`, respectively.\n\n```\nvecBeta1Values=seq(3,\
    \ 5, 0.1)\nvecBeta2Values=seq(50, 70, 1)\n```"
  merge: -1
  img_proc: true
