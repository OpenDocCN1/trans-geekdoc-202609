  md: '# 9.6 NNet vs. PyTorch (brulee\)


    epochs= Determines the maximum number of epochs used by the Optimizer for training.
    Internally PyTorch generates a validation dataset and if the prediction error
    does not improve for five consecutive epochs, it stops the training even if the
    maximum number of epochs set by epochs has not been reached.


    hidden_neurons= This hyper-parameter determines the number of hidden neurons,
    and at the same time, the number of hidden layers. When working with only one
    hidden layer like here, you can assign a number to hidden_neurons, which determines
    the number of neurons for the only hidden layer (e.g., hidden_neurons=50 for the
    only hidden layer).


    Suppose you like to work with more than one layer. In that case, you must assign
    a vector to hidden_neurons where each element determines the number of hidden
    neurons for consecutive hidden layers (e.g., hidden_neurons=(25, 30, 28) for a
    Neural Network with three layers where the first layer contains 25 neurons, the
    second layer of 30 neurons, and the third of 20 neurons.


    dropout= PyTorch allows randomly switching off a predefined percentage of hidden
    neurons for each iteration of the Optimizer process. The value assigned to dropout
    determines the proportion of hidden neurons randomly switched off at each iteration.
    For example, dropout=0.25 indicates that the Optimizer randomly switches 25% of
    the hidden layer''s neurons at each iteration of the training process.


    penalty= Determines the weight of the penalty term compared to the MSE in the
    target function when regularization is used (see Chapter 7 for details). By default
    Ridge regularization is used with penalty=0.001.


    # 9.6.2 ReLU Activation Functions


    Unlike the next package, PyTorch supports ReLU activation functions. In this section,
    we will discuss ReLU activation functions and focus on:


    +   1. Introducing the ReLU activation function.

    2. Demonstrating that Neural Networks with ReLU activation functions have the
    same outstanding approximation properties as a Neural Networks with Sigmoid activation
    functions.

    3. Discussing the problem of the Vanishing Gradient in context of classic Sigmoid
    vs. ReLU activation functions. A Vanishing Gradient can lead to a situation where
    the Optimizer cannot change the parameters anymore, although they are still far
    from optimal.


    Let us start with a ReLU activation function determines the activity of a hidden
    neuron:'
