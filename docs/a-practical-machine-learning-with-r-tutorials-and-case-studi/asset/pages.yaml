- pgno: 262
  md: '# 9 Deep Learning — MLP Neural Networks Explained


    ![](img/f240d449191f5add983daf6c380e4fe3_262_0.png)


    # FIGURE 9.5 Diamond Data and Prediction Surface


    A *Neural Network* with a sufficiently large number of hidden neurons can take
    the form of a highly non-linear surface to approximate training data almost perfectly.
    In fact, a “(...) standard multilayer feedforward network architecture using arbitrary
    squashing functions can approximate virtually any function of interest to any
    desired degree of accuracy, provided sufficiently many hidden units are available”
    (Hornik et al. 1989).


    To intuitively understand the outstanding approximation ability of a *Neural Network*,
    consider that a *Neural network* consists of many hidden neurons and thus of many
    *Sigmoid* functions. *Sigmoid* functions are squashing functions because they
    squash all input values between two output values (0 and 1 in the case of the
    *Logistic* function). As Figure 9.3 shows, each *Sigmoid* function forms a step
    similar to a step in a staircase. Although smoother than a staircase step, a *Sigmoid*
    function like a staircase, is flat first, then upward (or possibly downwards),
    and finally flat again.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "# 9.5 Build a Simplified Neural Network Model\n\nChanging the $\beta$ values\
    \ that impact the *effective input* $z_{ij}$ of a specific *Sigmoid* activation\
    \ function and changing the $\beta$ value that weighs the resulting activity $(\b\
    eta A_{ij}^k)$, can move a (*Sigmoid function*) horizontally, increase or decrease\
    \ the step size, change the steepness, and also convert from up to a downward\
    \ step.\n\nSince a *Neural Network* consists of hidden neurons, many *Sigmoid*\
    \ (steps) functions can be combined into a staircase-like structure with smaller\
    \ and bigger steps as upwards and downward steps — depending on the $\beta$ parameter\
    \ values. This staircase-like structure — if it has enough steps — can approximate\
    \ a function in any given range to any degree.\n\nThe mathematical formula behind\
    \ which staircase-like structure is the *Neural Network* prediction function.\
    \ It combines the *Sigmoid* (steps) to approximate whatever continuous function\
    \ needs to be approximated (in a given range) with various up- and downward steps.\n\
    \nConsequently, with this procedure, a *Neural Network* can approximate a function\
    \ to any degree of smoothness in a given range by increasing the number of hidden\
    \ neurons.\n\nFigure 9.6 shows an example of the arguments outlined above. The\
    \ goal is to approximate a sine function (the orange dots in the upper diagram\
    \ in Figure 9.6) in an input range between 0 and 9 with a *Neural Network*. The\
    \ sine function to be approximated is:\n\n```\n$y_i = \\sin(x_i + 5) + 1$\n```\n\
    \nWe use a *Neural Network* with one input $(x_i)$, three hidden neurons with\
    \ *Logistic* activation functions, and one output $\tilde{y}_i$.\n\nWhen all $\b\
    eta$ values are appropriately chosen$^{11}$ the three $\beta$ weighted activation\
    \ functions of the three hidden neurons form three steps (the lower two diagrams\
    \ in Figure 9.6). When these steps are combined (added) together with the bias\
    \ for the output neurons $(\beta_0 = 2)$ they form the *Neural Network* prediction\
    \ function (the blue line in the upper diagram of Figure 9.6). As you can see,\
    \ we get a good approximation of the sine function. The *Neural Network* prediction\
    \ function forms a staircase-like structure with one step up, one step down, and\
    \ line in the upper diagrams of Figure 9.6). If we want to increase the smoothness\
    \ of the approximation, we could work with six hidden neurons (six steps). With\
    \ appropriate values for the $\beta$ parameters, we could form a staircase-like\
    \ structure with two (smaller) steps up, two (smaller) steps down, and two (smaller)\
    \ steps up.\n\n> $^{11}$The underlying $\beta$ values are not the result of an\
    \ *Optimizer* process. They have been chosen manually by *trial-and-error* to\
    \ generate a good approximation."
  merge: -1
  img_proc: true
