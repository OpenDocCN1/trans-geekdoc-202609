    Since the magenta curve looks like a step of a staircase, first horizontal, then
    (almost) vertical, and finally horizontal again, these types of curves are often
    called step functions. The scientific term is Sigmoid functions. Examples include⁴


    +   * The Logistic function⁶

    * The Hyperbolic Tangent function

    * The Arc Tangent function


