- pgno: 238
  md: '# 8.7 When and When Not to Use Logistic Regression


    +   * Logistic Regression is a straightforward algorithm and a good choice for
    predicting binary categorical variables. Because of its simplicity, Logistic Regression
    is also a fast algorithm in terms of required computing resources. Therefore,
    it can be used for large datasets.


    +   * If it is crucial to interpret the interpretation of predictor variables
    in addition to predicting an outcome, Logistic Regression is a good choice. This
    is because, in contrast to any other classification algorithms, Logistic Regression
    allows the interpretation of its parameters.


    +   * With logarithmic odds are estimated, Logistic Regression is algebraically
    similar to linear regression. This limits the non-linearity of the general prediction
    function. However, it also allows for a more straightforward interpretation of
    the predictor estimates.


    +   * Logistic Regression might not be a well-suited method for complex or highly
    non-linear estimation problems. The reason is that the Logistic function, in its
    middle section, is almost linear. Consequently, for highly non-linear estimation
    problems, models such as Random Forest (see Chapter 10) or Neural Networks (see
    Chapter 9) are likely to be better alternatives.


    +   * In general, a good strategy for classification problems is to start with
    Logistic Regression as a benchmark and then try to improve the results with other
    machine learning algorithms.


    +   * Probit and Tobit algorithms (see Hanck et al. (2023) and McDonald and Moffitt
    (1980)) are closely related to Logistic Regression. Because of their similarity
    with Logistic Regression they have similar strengths and weaknesses.


