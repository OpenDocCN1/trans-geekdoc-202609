  md: '# 10.4 Random Forest


    # 10.4.2 Predicting Vaccination Behavior with Random Forest


    Now it is time to showcase an application for Random Forest. In this section,
    we will use a Random Forest model to predict the U.S. vaccination rates during
    the COVID-19 pandemic. The analysis is based on research conducted by the author
    and his co-author, published in October 2022.


    The data are from September 2021 and the outcome variable is the proportion of
    fully vaccinated (two shots) residents in 2,630 continental U.S. counties (PercVacFull).


    The predictor variables were used:


    +   **Race/Ethnicity:** Proportion of African Americans (PercBlack), Asian Americans
    (PercAsian), and Hispanics (PercHisp) for the county.


    +   **Political Affiliation:** The proportion of voters who voted for the Republican
    presidential candidate (PercRep). Since only Republican and Democratic voters
    were considered, the proportion of voters who voted for the Democratic presidential
    candidate equals (1–PercRep).


    +   **Age Groups:** Proportion of young adults (20–25 years; PercYoung25) and
    proportion of older adults (65 years and older; PercOld65).


    +   **Income-related:** To control for income effects, we use the country’s proportion
    of households receiving food stamps (PercFoodSt).


    In the code below, we load the data, select the variables to use, and split the
    observations into training and testing data:


    ```

    DataVax=import("https://analytics.com/Data/Vax.rds") |

    select(PercVacFull, PercRep,

    PercAsian, PercBlack, PercHisp,

    PercYoung25, PercOld65,

    PercFoodSt, Population) |>

    mmutate(Population=frequency_weights(Population))

    set.seed(2021)

    Split8=initial_split(DataVax, prop=0.8, strata=PercVacFull, breaks=3)

    ```


    > 8 See Lange and Lange (2022).

    9Source: Centers for Disease Control and Prevention (CDC) (2021a).

    10Source: Centers for Disease Control and Prevention (CDC) (2021b).


    > 11Source for the raw data: Park, A. et al. (2021). The authors of Lange and
    Lange (2022) calculated the proportions.


    > 12Source: Centers for Disease Control and Prevention (CDC) (2021b).

    13Source: Earl (Environmental Systems Research Institute) (2023). The author thanks
    ESRI for the permission to use their proprietary data for the interactive sections
    of this book.'
