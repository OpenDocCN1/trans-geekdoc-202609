  md: '# 10.3 Decision Trees


    +   - The **root node** contains the training dataset, which is indicated by the
    label "100%" in the third row of the *root node*. The second label indicates that,
    sadly, the survival rate was only *0.39* (39%). Since the survival rate is less
    than 0.5, we would predict that a random passenger (observation) does not survive
    (Survived = FALSE); see the first label in the *root node*.


    +   - Next, all observations are moved from the *root node* to one of its child
    *nodes* depending if the *decision rule* *Sex=male* is fulfilled (left child)
    or not (right child).


    Consequently, male observations (passengers) are moved to the left child *node*
    and female observations to the *right child*. When reading the three labels from
    the *left child node*, we can see that 64% of the training observations ended
    up in this node (64% of passengers in the training dataset are male). The survival
    rate among them was only 0.2 (second label), and therefore, we would predict that
    an individual passenger does not survive (Survived = FALSE; 0.2 < 0.5).


    The *right child node* contains only female observations. From the training data
    observations, 36% are female. For these female passengers, the survival rate was
    0.73. Thus, for an individual female passenger, we would predict that she survives
    (Survived = TRUE; 0.73 > 0.5).


    In summary: After the first split by *Sex*, we can conclude that men''s survival
    chances were 20%, while the survival chances of women were 73%.


    +   - The process does not stop after the split for *Sex*. When you look at the
    *left child node* below the *root node*, you can see that the male passengers
    are further split into older nodes (13 years and older; moved to the left *child
    node*) and younger males (moved to the right *child node*).


    Checking the labels in the left child node (*a terminal node*), you can see that
    60% of the training observations were male and older than 13 years. The survival
    rate among them was only 0.17. Therefore, we would predict for an older male who
    does not survive (Survived = FALSE; 0.17 < 0.5).


    Checking the labels of the *right child node* (not a terminal node) below the
    *Age>=13* decision rule shows that 4% of the training observations were young
    males, and their survival rate was 0.57. Thus, for an individual young male (if
    we do not know in which class he traveled), we would predict that he survives
    (Survived = TRUE) because 0.57 > 0.5.


    +   - After all observations from the training dataset descend through the *Decision
    Tree*, they end up in one of the six *terminal nodes*. Note that the percentages
    of training data in the six *terminal nodes* add up to 100% (60% + 3% + 1% + 3%
    + 14% + 18% ≈ 100%).


    We know the survival rate for each *terminal node* based on the training observations
    that ended up in that node. Therefore, we can predict'
