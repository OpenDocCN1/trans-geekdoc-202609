- pgno: 355
  md: '# 12


    # Concluding Remarks


    I hope the previous chapters gave you a basic but sound foundation about how to
    use machine learning models for research or applications in your industry. Specifically,
    I hope that the book sparked your interest in exploring machine learning further.


    This leads to the question, where to go next? What is a good strategy to further
    extend your machine learning knowledge? There are many answers to this question.
    We will focus on six strategies:


    +   Extend your knowledge about the mathematical foundations of machine learning
    models. One of the standard machine learning books gives you a sound mathematical
    introduction to Statistical Learning by James et al. (2023).


    +   Extend your machine learning toolkit. We used the tidymodels package as a
    toolkit in the previous chapters of this book. The tidymodels package offers two
    distinctive strengths: i) It standardizes the data and modeling workflow, and
    ii) it provides many machine learning tools. We focused on the standardization
    aspect of machine learning that tidymodels provides. If you would like to take
    advantage of the analytical strength of tidymodels, then Tidy Modeling with R
    by Kuhn and Silge (2022) is the right place to start your journey.


    +   Apply machine learning directly to your field of research or a case in your
    industry, such as finance or marketing. For the latter fields, recommend Tidy
    Finance with R by Voigt et al. (2023) and Hands-On Data Science for Marketing
    by Hwang (2019), respectively.


    +   At some point in time, you might need to review topics from this book. The
    best way to find a topic you are interested in is to go to the Outcomes section
    of the related chapter. There, you can review the learning outcomes and then go
    to the section(s) you would like to read again.


    +   Take online classes. Although this can be expensive in some cases, free or
    relatively costly high-quality options are also available. For'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 12 Concluding Remarks


    example, *EdX* provides excellent online courses authored by faculty from Harvard,
    UC San Diego, and other top universities. One course we especially recommend Machine
    Fundamentals¹. It introduces machine learning in a more formal way than this book,
    but the course is still intuitive. *EdX* courses are free as long as you do not
    require a certificate.


    Another good source for online courses is *DataCamp*. The Data-Camp learning platform
    provides a wide range of data science and AI courses with readings, videos, and
    exercises. Some courses are free, and the first chapters of all courses are free
    to read. You can find this out if *DataCamp* is for you and if you want to subscribe
    for $25/month.


    +   6) Extend your machine learning skills with a more random strategy. As you
    know from machine learning (see *Bootstrapping* in Chapter 10), randomization
    can be a solid tool to reach a goal.


    For a more random learning strategy, signing up to *Medium* might be a good option.
    Depending on your preferences and history, you get a daily email with recommendations
    for articles to read. If you think you do not have the time, you could read in
    the evening in bed, and carve the needed time out of your busy schedule.


    Read the articles without pressure but with enjoyment. If you are tired after
    a few pages, stop reading and sleeping. Otherwise, read the complete article and
    sleep a little later. In any case, you either win by falling asleep smoothly or
    improving your skills. Signing up to *Medium* is free, and many articles are free
    to read. In addition, you can read up to three “members only” articles for free.
    If you would like read more, you can consider a subscription for $50/month.


    Whatever strategy you use to extend your knowledge in machine learning, I wish
    you an enjoyable journey.


    Happy Analytics!


    > ¹https://www.cdx.org/learn/machine-learning/the-university-of-california-san-diego-machine-learning-fundamentals


    > ²https://medium.com/'
