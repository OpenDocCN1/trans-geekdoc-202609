- pgno: 212
  md: "196 Ridge, Lasso, and Elastic-Net — Regularization Explained\n\nRegularization\
    \ will decrease the values of model-parameters possibly all the way to zero. Smaller\
    \ model-parameters will weaken (or eliminate) the influence of the related predictor\
    \ variables and thus help to avoid overfitting.\n\n+   - Considering computing\
    \ resources you should also consider that regularization adds one or more hyper-parameters\
    \ that need to be tuned (one extra hyper-parameter for Lasso or Ridge and two\
    \ for Elastic-Net).\n\n+   - If you have a large dataset compared to the number\
    \ of model-parameters to be optimized, regularization might not be necessary.\
    \ However, you can still use regularization in an attempt to improve predictive\
    \ quality further.\n\n+   - Using regularization for one or more hyper-parameters\
    \ is often a judgment call that should be guided by the required computing time,\
    \ and the expectation that smaller model-parameters improve predictive quality.\n\
    \n+   - If you use regularization, the question arises which regularization approach\
    \ to use.\n    - Use Lasso if your goal is to eliminate predictor variables for\
    \ the model.\n    - Use Ridge to lower the values of all β parameter values without\
    \ eliminating predictor variables.\n    - Use Elastic-Net to combine Lasso and\
    \ Ridge when you have no preference about eliminating predictor variables or not,\
    \ and your main goal is to improve predictive performance and to lower overfitting.\
    \ Consider that Elastic-Net adds an additional hyper-parameter (structure) that\
    \ might need tuning.\n\n+   - Some models, like k-Nearest Neighbors, do not optimize\
    \ an error function and are thus unsuitable for regularization.\n\n# 7.7 Digital\
