    \ Regression\n\nThe idea behind *Logistic Regression* can be best demonstrated\
    \ with an example. Let us start with creating a synthetic dataset based on a made-up\
    \ story:\n\nAfter a few years past graduation, eleven close friends reunite. Financially,\
    \ some of them are doing very well, while others are just doing OK. In Table 8.1,\
    \ you find the yearly salaries (in $1,000) for 10 of our 11 friends with their\
    \ names and an indicator if they own a yacht ($Yacht=1$) or not ($Yacht=0$). Note\
    \ that there are only 10 rows in Table 8.1 as one of the 11 friends, Nina, has\
    \ to arrive. We will talk more about Nina later.\n\nOur objective is to find a\
    \ machine learning algorithm that can predict for the 10 friends whether or not\
    \ they own a yacht. In Table 8.1, you can see that for Jack, all friends who own\
    \ a yacht have a six-figure income, and the ones who do not have low income. Therefore,\
    \ finding a machine learning algorithm that uncovers this rule should be relatively\
    \ easy.\n\nTo keep the simple example and because we do not aim to predict yacht\
    \ ownership over our group of friends, we use all of the data from Table 8.1 as\
    \ training data and do not use a testing dataset.\n\n# TABLE 8.1 Income and Yacht\
    \ Ownership\n\n| Name | Income | Yacht |\n|---|---||\n| Jack | 45 | 1 |\n| Sarah\
    \ | 50 | 0 |\n| Carl | 55 | 0 |\n| Eric | 60 | 0 |\n| Zoe | 67 | 0 |\n| James\
    \ | 250 | 1 |\n| Enrico | 280 | 1 |\n| Erica | 320 | 1 |\n| Stephanie | 370 |\
    \ 1 |\n| Susan | 500 | 1 |\n\nAn obvious — but as it turns out, suboptimal — approach\
    \ could use *OLS* to find a regression line with slope $\beta_1$ and intercept\
    \ $\beta_2$ that best approximates the data (minimizing the $MSE$). Figure 8.1\
    \ shows the resulting regression line for the data in Table 8.1 and Equation (8.1)\
    \ shows the related prediction equation:"
