    \ defeat the purpose of this interactive\n\n# 7.5.2 Unregularized Benchmark Model\n\
    \nAs a benchmark, we begin with an unregulated model. In this case, a multi-variate\
    \ Degree-2 Polynomial Model. It includes the variables Sqft, Bedr, and Year. They\
    \ are used in their original form, and as various interaction terms:\n\n```\n\
    Price = $\beta_1Sqft + \\beta_2Bedr + \\beta_3Year$\n$+ $\beta_4Sqft^2 + \\beta_5Bedr^2\
    \ + \\beta_6Year^2$\n$+ $\beta_7SqftBedr + \\beta_8SqftYear + \\beta_9BedrYear$\n\
    $+ $\beta_{10}Sqft^2Bedr + \\beta_{11}SqftBedr^2 + \\beta_{12}Sqft^2Bedr^2$\n\
    $+ $\beta_{13}SqftYear^2 + \\beta_{14}SqftYear^2 + \\beta_{15}Year^2\n$+ $\beta_{16}Bedr^2Year\
    \ + \\beta_{17}BedrYear^2 + \\beta_{18}BedrYear^2$ (7.10)\n```\n\nAfterward, we\
