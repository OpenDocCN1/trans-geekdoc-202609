- pgno: 131
  md: "# 5.4 Univariate Mockup: Study Time and Grades\n\nAt this point, we are not\
    \ yet ready to calculate $\beta_{opt}$ according to Equation (5.7) because the\
    \ formula also requires calculating the sum of the product of the observations\
    \ for $y_i$ and $x_i$ ($\\sum_{i=1}^N y_ix_i$) as well as the sum of the squares\
    \ of the $x_i$ values ($\\sum_{i=1}^N x_i^2$). However, we can use the mutate()\
    \ command to add these variables to the frame DataMockup and call the new result\
    \ frame DataMockup:\n\n```\nDataTable<-DataMockup |>\nmmutate(GradeStudyTime=Grade$StudyTime)\n\
    mmutate(StudySquared=StudyTime^2)\n```\n\nTable 5.2 shows the resulting data frame\
    \ DataTable.\n\nNext, we calculate the sums of $\\sum_{i=1}^N y_ix_i$ and $\\\
    sum_{i=1}^N x_i^2$ (see the code below). When we plug in these sums together with\
    \ the previously calculated sums $\\sum_{i=1}^N x_i$ and $\\sum_{i=1}^N y_i$ and\
    \ the value for $N = 5$ into Equation (5.7)\n\n```\nN=5\nSumOffsetY=sum(DataTable$Grade)\n\
    OfFX=sum(DataTable$StudyTime)\nSumOfXY=sum(DataTable$GradeStudyTime)\nSumOfSq=sum(DataTable$StudyTimeSquared)\n\
    \nBetaopt=(N*SumOfXY-SumOffsetY*SumOfFX)/(N*SumOfSq-SumOfFX^2)\n```\n\n> *Based\
    \ on the training dataset the optimal value for Beta = \\*\nBetaopt*\n\n## on\
    \ the training dataset the optimal value for Beta = 3.963\nAfterward, we can plug\
    \ in the value of $\beta_{opt}$, into Equation (5.8) together $\\sum_{i=1}^N y_i$\
    \ and $\\sum_{i=1}^N x_i$ to calculate $\beta_{2opt}$.\n\n```\nBeta2opt=(SumOffsetY-Betaopt*SumOfFX)/N\n\
    cat(\"Based on the training dataset the optimal value for Beta2 =\", Beta2opt)\n\
    ```\n\n## on the training dataset the optimal value for Beta2 = 64.188\nHurrah,\
    \ you used the OLS to find the optimal $\beta$-values for the mockup regression.\
    \ The good news is that you do not need to memorize these formulas. They are already\
    \ integrated into the statistical software $R$. To find the optimal parameters\
    \ with $R$, you can use the command linear\\_reg() from the tidy-models package.\
    \ The R code to create a linear regression workflow is mostly"
  merge: -1
