  md: '# 10.3 Decision Trees


    # 10.3.2 The Instability of Decision Trees


    You saw already one drawback of Decision Trees in the previous section — not all
    rules make sense.


    This section will show another drawback of Decision Trees. They react very sensitively
    to small changes. For example, in the code block below, the Titanic dataset is
    split into testing and training data:


    ```

    set.seed(888)

    Split7525=initial_split(Titanic, strata=Survived)

    DataTrain=training(Split7525)

    DataTest=testing(Split7525)

    ```


    ![](img/f240d449191f5add983daf6c380e4fe3_291_0.png)


    **Figure 10.2** Decision Tree for Titanic Survival with set.seed(888)


    The code is identical to from the previous section, except that the set.seed(777)
    command is changed from set.seed(777) to set.seed(888), resulting in a change
    in the composition of the testing and training data.


    Afterward, we processed the slightly changed training data with the same R code
    in the previous section and created a Decision Tree. When assessing the new Decision
    Tree based on the testing data by calculating a confusion matrix and the related
    metrics, we can see below that the results did not change very much.'
  merge: -1
  img_proc: true
