    \ thus\nto expect large prediction errors $(u_{0,i})$. We can calculate these\
    \ errors for\nall training observations because we know the true outcome for each\
    \ training\nobservation:\n\n```\n$u_{0,i} = Y_i - \\bar{Y}\\quad (10.3)\n```\n\
    \nNote that the index 0 in $u_{0,i}$ indicates that the errors for the $i$ observations\n\
    are related to the starting prediction in the *ensemble*. Equation (10.3) can\
    \ also be\nwritten as Equation (10.4), which states that at the initial stage,\
