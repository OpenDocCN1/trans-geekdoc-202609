- pgno: 333
  md: '# 11.7 SHAP Contribution of Predictor Variables


    she joined, the company had already hired two economists, contributing their economics
    knowledge and their specialties. When Angela joins, the profit goes up because
    she adds financial economics expertise, but economics, in general, was well covered
    by Bruce and Carsten.


    The order in which coalition members join could not influence their overall contribution.
    Therefore, we could look at every possible scenario where Angela can join, calculate
    her marginal contribution for each scenario, and then calculate the average as
    an estimate of Angela''s overall contribution.


    This is exactly the idea behind SHAP values, and you can see how it works in the
    table displayed in Figure 11.5. Since we have three economists, there are precisely
    six (3! = 1 · 2 · 3) scenarios for the order in which they can join the project,
    and these six scenarios are displayed in the rows of the table. When Angela joins
    first (Scenarios ABC and ACB), her contribution is 66. When she joins second (Scenarios
    BAC and CAB), her contribution is 21 and 20. When she joins last (Scenarios BCA
    and CBA) her contribution is 26. The average for all scenarios is 37, which is
    Angela''s estimated overall contribution — SHAP value.


    We can follow a similar procedure for Bruce and Carsten, and we get SHAPLEY values
    of 36 and 34, respectively. They are displayed in the last row of the table in
    Figure 11.5 and add up to the overall contribution of the three economists of
    107.


    SHAPLEY values always ensure that their sum adds up to the total contribution
    (107 in our case).


    # 11.7.2 From SHAPLEY to SHAP Values


    Now that you understand how SHAP values are calculated, it is a small step to
    understand SHAP values.


    The underlying idea of the SHAP values approach is to apply the SHAPLEY logic
    to the SHAP approach.¹10 This is reflected in the definition of SHAP values:


    **SHAP values quantify the contributions of all predictor variables'' values to
    the prediction for a specific observation.**


    Since the SHAP values approach is based on an individual observation, the SHAP
    algorithm is considered **local**.


    Since SHAP can be applied to any machine learning model that can generate predictions,
    the algorithm is considered **model-agnostic.**.


    > ¹⁰ O''Sullivan (2022a) compares the SHAPLEY and the SHAP approaches provides
    mathematical foundation for both approaches. He also discusses how SHAP values
    can be computationally approximated.'
