    # Step 4 - Add the Recipe and the Model Design to a Workflow:


    Below, we add the recipe and the model design to a workflow, which will be tuned
    in Step 7:


    ```

    TuneWFModelNN=workflow() >

    add_model(ModelDesignNN) >

    add_recipe(RecipeDiamonds)

    ```


    # Steps 5 — 10 in the code block are the steps you will execute (and potentially
    modify).


    It is recommended to execute the code unchanged in a first attempt. Then, you
    can start modifying the code and see what happens. To make small changes to see
    how the computing time responds on your machine. To use different values for the
    hyper-parameters, modify the Hyper-Parameter Grid in Step 5.


    +   # Step 5 - Create a Hyper-Parameter Grid:

    # To out different hyper-parameter values, change the

    # values that are assigned to the respective hyper-parameters

    # below

    ParGridNN=expand.grid(hidden_units=c(10, 20, 50), dropout=c(0, 0.25))


    +   # Step 6 - Create Resamples for Cross-Validation:

    # You can v= to consider a different

    # number of folds (e.g. v=10). Note, computing

    # time will change proportionally.

    set.seed(888)

    oldsForTurningNN=fold_cv(DataTrain, v=7, strata=Price)


    +   # Step 7 - Tune the Workflow and Train All Models:

    # (this step requires patience; run time 5-30 minutes)

    set.seed(888)

    TuneResultsNN=tune_grid(TuneWFModelNN, resamples=FoldsForTurningNN,

    grid=ParGridNN, metrics=metric_set(rmse, rsq, mae)


    +   # Step 8 - Extract the Best Hyper-Parameter(s)

    BestHyperNN=select_best(TuneResultsNN, "rmse")

    print("Best Hyper-Parameters:")

    print(BestHyperNN)'
