  md: "Instead, use validation data derived from the training dataset to evaluate\
    \ the performance of hyper-parameters. This is the underlying principle of tuning,\
    \ and in the next section, you will tune the workflow model to improve performance.\n\
    \n# 7.5.4 Tuning the Elastic-Net Polynomial Model\n\nIn this section, you will\
    \ use the 10-Step Template to tune the hyper-parameters penalty and mixture.\n\
    \n+   Step 1 - Generate Recipe and Training Data: The training and testing data\
    \ have already been generated (Section 7.5.3 above).\n\n+   Step 2 - Create a\
    \ Recipe: The recipe to create the predictors for the multivariate Degree-2 polynomial\
    \ model (RecipeHousesMultivar) was created in connection with the unregulated\
    \ model and can be reused. It establishes the predictors with various powers and\
    \ interactions.\n\n+   Step 3 - Create a Model Design: The model design from the\
    \ previous section needs slight modifications. You will have to add the tune()\
    \ placeholder for the hyper-parameters:\n\n```\nModelDesignElasticTune <- linear_reg(penalty=tune(),\
    \ mixture=tune()) |>\n  set_engine(\"glm\") |>\n  set_model(\"regression\")\n\
    ```\n\n+   Step 4 - Add the Recipe and the Model Design to a Workflow: Before,\
    \ we add the recipe and the (modified) model design to the workflow:\n\n```\n\
    TuneWorkflow <- workflow() |>\n  add_recipe(RecipeHousesMultivar) |>\n  add_model(ModelDesignElasticTune)\n\
    ```\n\n+   Step 5 - Create a Hyper-Parameter Grid: Previously, when only one hyper-parameter\
    \ was tuned, you added the values to be tried out in a data column with the same\
    \ name as the hyper-parameter. When you have more than one hyper-parameter, it\
    \ gets a little more complicated because you want to try different combinations\
    \ of hyper-parameters.\n\nIf you decide to try all combinations of the values\
    \ from two or more hyper-parameters, you can use the crossing() command. The arguments\
    \ of the crossing() command are the hyper-parameters you would like to try out.\
    \ The assigned values to these arguments are the values you want to try out for\
    \ each of the hyper-parameters. They are assigned to each argument as R vector\
    \ objects. The crossing() command then generates all possible combinations for\
    \ the values of the hyper-parameters."
  merge: -1
  img_proc: true
- pgno: 209
  md: "# Project: Predicting House Prices with Elastic-Net\n\nFor example, in this\
    \ project you will later try 66 penalty values from 15,000 to 80,000 with an increment\
    \ of 1,000 and three mixture values (0, 0.5, and 1). You can use the crossing()\
    \ command to generate all possible combinations:\n\n```\nParGridHouses=crossing(mixture=c(0,\
    \ 0.5, 1),\n              penalty=seq(15000, 80000, 1000))\n\n## A tibble: 198\
    \ x 2\n## mixture penalty\n## <table>\n## 1 15000\n## 2 16000\n## 3 17000\n##\
    \ 4 18000\n## 5 19000\n## 6 20000\n## 7 21000\n## 8 22000\n## 9 23000\n## 10 24000\n\
    ## i i 188 rows\n```\n\nThe R vector assigned to mixture is created with the c()\
    \ command by listing the related values. The R vector assigned to penalty is created\
    \ with the seq() command. The first value in seq() determines the sequence starts\
    \ (15,000) and the second where it ends (80,000). The third argument determines\
    \ the increment (the step size; 1,000).\n\nYou can see in the printout above that\
    \ crossing() generates all possible combinations of the penalty values and the\
    \ mixture values. Each of 198 combinations will be tried when you tune the workflow\
    \ later on.\n\nThe crossing() command is very helpful when controlling multiple\
    \ hyperparameters with several values. Imagine you want to create a grid with\
    \ all combinations of five hyper-parameters with ten values each, crossing() would\
    \ create 100,000 parameter combinations (10 · 10 · 10 · 10 · 10 = 10⁵) for you.\
    \ Be advised, tuning 1000 hyper-parameter combinations would use a lot of computing\
    \ time.\n\nIn general, computing time increases exponentially with the number\
    \ of hyperparameters, while computing time increases proportionally with the values\
    \ for each hyper-parameter increase. These facts must be considered when deciding\
    \ how many hyper-parameters you want to tune and how many values you like to consider\
    \ for each hyper-parameter."
  merge: -1
  img_proc: true
