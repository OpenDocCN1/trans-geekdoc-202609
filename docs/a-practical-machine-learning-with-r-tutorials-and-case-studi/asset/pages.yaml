  md: '# 2.3 Machine Learning Tasks


    A Neural Network processes training data through layers of weighted-linear functions
    (neurons). A learning algorithm successively updates the parameters of the Neural
    Network to improve the prediction quality (more about Neural Networks in Chapter
    9).


    If a Neural Network has many neurons (often millions or more) and if these neurons
    are organized into many layers, often with varying functionalities, the underlying
    algorithm is called a Deep Learning algorithm. Applications that use Deep Learning
    are Natural Language Processing (NLP), advanced image recognition, and programming
    completion.


    Figure 2.1 shows how above terms are related.


    # 2.3 Machine Learning Tasks


    Machine learning algorithms can be used for various purposes and can be categorized
    by the tasks they perform:


    Regression: A regression seeks to predict a continuous variable. The prediction
    goal is to predict how large (or small) such variable is based on the fact that
    we know the values of other variables. Regression analysis can be linear (OLS).
    Or regression analysis can be non-linear. Examples include Random Forest, Polynomial
    Regression, and Neural Networks.


    Classification: A classification algorithm seeks to predict a category. In many
    cases (including all cases covered in this book), the categories are limited to
    only two values, such as Yes/No, Red Wine/White Wine, or True/False. Most machine
    learning algorithms require the related variables to be stored as an R variable
    (more about factor variables in Section 3.5.1).


    Categories to be predicted can also have more than two values. Categories can
    be either ordered or not ordered. Examples of ordered categories include ratings
    such as Good/Fair/Poor or Strongly Agree/Disagree/Strongly Disagree. Examples
    of unordered categories include colors such as Red/Blue/Green or marital status
    such as Single/Widowed/Separated.


    Machine learning algorithms for classification include Logistic Regression, k-Nearest
    Neighbors, Random Forest, and Neural Networks.


    Cluster Analysis: An algorithm performing Cluster Analysis seeks to sort observations
    into a given number of groups (clusters) based on variable values for each observation.
    The characteristics of the clusters and how'
