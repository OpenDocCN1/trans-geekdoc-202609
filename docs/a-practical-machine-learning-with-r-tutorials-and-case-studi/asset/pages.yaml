    # 3.3.2 RStudio Configuration


    Using the RStudio menu (Tools -> Global Options), you can configure RStudio in
    many ways. We recommend being conservative with changing options when you are
    not sure about the consequences.


    However, it is strongly recommended to change the following settings:


    +   - Use Tools -> Global Options, and then disable Restore .RData into startup.

    - Set the Own workspace to .RData on exit. Never.


    Saving the R workspace (content of all R objects) when closing an R session is
    not necessary when working with R scripts as R objects can be re-created with
    a few clicks as long as the R script has been saved. Keeping R sessions between
    workspaces can lead to confusion and errors. Note that the Global Options as described
    above need only to be done once for any RStudio installation.


    Another good practice is to assign a specific hard drive to carry each data science
    project. You decide what you consider a project. Afterward, all files will always
    be saved into the specified R Project Folder.


    When you work with that project, RStudio will save and load all files from/into
    this project folder by default.


