  md: '# 11.3 Categorizing package Interpretation Methods


    +   - The ranger package (Wright and Ziegler (2017)) to create a Random Forest.

    - The parallel package (R Core Team (2022)) to perform parallel processing.

    - The DALEX package (Bieleck (2018)) to use various techniques, including SHAP
    values, to interpret machine learning results.

    - The DALEXTRA package (Makymyniuk et al. (2020)) extends the DALEX package. Extra
    functionality provided by DALEXTRA includes working directly with tidymodels.

    - The vip package (Greenwell and Boehke (2020)) to generate Variable Importance
    Plots.

    - The LIME package (Hvitfeldt et al. (2022)) to use the LIME approach to interpret
    machine learning models.


    # 11.3 Categorizing Interpretation Methods


    In what follows, we will introduce several interpretation methodologies. Not every
    methodology can be applied to all models. To help you decide which methodology
    to use for which interpretation task, we categorize them by tasks in this section.


    For example, some methods are only appropriate for explaining a prediction result
    for a specific observation (local interpretation methods). In contrast, others
    are only appropriate to help us understand a model in general and how it makes
    predictions overall (global interpretation methods).


    Going back to the previous example of lenders making a loan decision, we have
    to decide if to analyze why a specific applicant (observation) is not approved
    for a loan (local interpretation methods) or how, in general, the model predicts
    loan risk related to one particular predictor variable (global interpretation
    methods).


    # Local vs. Global Interpretation


    **Local Interpretation:** To analyze the prediction of a specific observation
    and to interpret the impact of predictor variables on that specific observation,
    we use local interpretation methodologies.


    **Global Interpretation:** To analyze the predictions of a machine learning model
    in general and to interpret the impact of predictor variables regardless of specific
    observations, we use global interpretation methodologies.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '304 11 Interpreting Machine Learning Results


    Another property of interpretation methodologies you need to consider whether
    the interpretation methodology is model-specific or model-agnostic. Some methodologies
    are developed for specific machine learning models (model-specific), and others
    can be applied to interpret almost every machine learning model (model-agnostic).
    For example, an impurity-based Importance Plot (see Section 11.6.1), which is
    related to decision rules in a Decision Tree, can be applied to tree-based models
    like Random Forest but cannot be applied to Neural Networks.


    In contrast, Ceteris Paribus Plot or a Partial Dependence Plot can be applied
    to any machine learning model as long as it generates predictions (model-agnostic).


    Model-Specific vs. Model-Agnostic Interpretation

    Model-Specific: Interpretation methodologies that can only be applied to a specific
    model type are called model-specific.

    Model-Agnostic: Interpretation methodologies that can be applied regardless of
    which model was used to generate the predictions are called model-agnostic.


    # 11.4 Data, Model Design, and Workflow-Model


    For all interpretation methodologies that we introduce in the following sequences,
    except for the interactive Section 11.7.3, we use the same dataset and the same
