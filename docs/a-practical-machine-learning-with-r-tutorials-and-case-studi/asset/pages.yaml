    we would get an error message because we try to select and rename PClass, but
    PClass does not exist anymore in DataTitanic. It was renamed before, when we executed
    the select() command first time.


    # 3.9.2 Filter Data


    When we used the select() command, we chose which variables (columns) to include
    in the resulting data frame. In contrast, the filter() command filters for observations
    (rows) in a data frame that fulfill specific criteria.


    As with the select() command, the first argument of the filter() command'
