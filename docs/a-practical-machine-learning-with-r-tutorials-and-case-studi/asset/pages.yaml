  md: '# How to predict the wage for the coalitions in Figure 11.6?


    We mentioned before the wage prediction for Helga''s wage based on three predictor
    variables could be calculated based on the fitting Forest model from Section 11.4:


    ```

    CoalitionETF=predict(WModelWageRF,new_data=ObsHelga)

    cat(''Helga''s predicted wage from Coalition ETF is:'',

    round(CoalitionETF[],2))

    ```


    ## Helga''s predicted wage from Coalition ETF

    To predict the wage for Coalition: none at the top of the flow chart in Figure
    11.6, we found that no information about Helga can be used for this coalition.
    Because of absence of information, the mean is often a reasonable way to predict
    a variable. Therefore, we use the mean of the training data for the wage prediction
    from Coalition: none.


    ```

    CoalitionNone=mean(DataTrainWage)

    cat(''Helga''s predicted wage for Coalition ''none'' is:'',

    round(CoalitionNone,2))

    ```


    ## Helga''s predicted wage for Coalition ''none'' is: 5.94

    Generating predictions for Helga''s wage for the remaining six coalitions is a
    bit more tricky, and we will talk about it a little later.


    Instead, we use the table in Figure 11.6 to calculate SHAP values for the predictor
    variables. Because all possible predictor orders have been considered in the rows
    of the table, we can calculate the overall contribution of Educ = 17, Tenure =
    18, and Female = 1 to the wage prediction as the mean of columns MargContE, MargContT
    and MargContF. You can find the resulting SHAP values in the "mean" row of table
    in Figure 11.6.


    It is a very useful property of the SHAP method that the SHAP values always add
    to the cumulative contribution of all predictor variables:


    3.94 + 2.14 + (-2.78) = 3.3

    SHAP Educ=17 SHAP Tenure=18 SHAP Female=1 SHAP Cumulativ


    We can use the SHAP values from the equation above to interpret the results from
    the SHAP approach: The fact that Helga has a high education (Educ = 18) contributes
    $3.94 to her predicted wage, the fact that she has a long tenure (Tenure = 18)
    contributes $2.14, and the fact that she is female (Female = 1)'
