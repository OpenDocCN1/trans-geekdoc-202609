    # ## 2.2 Machine Learning, Artificial Intelligence, and Deep Learning


    The terms Artificial Intelligence, Machine Learning, and Deep Learning are often
    used synonymously. However, there is a clear distinction and hierarchy related
    to these terms (see Figure 2.1 for an overview):


    Artificial Intelligence (AI) is defined as computer algorithms that perform tasks
    believed to be only performed by humans. This includes rule-based algorithms (e.g.,
    detailed instructions for a robot to assemble a car) as well as data-based algorithms
    (e.g., to use historical data to calibrate a prediction model). Following this
    definition, AI applications include tasks such as advanced home automation, speech
    recognition (Natural Language'
