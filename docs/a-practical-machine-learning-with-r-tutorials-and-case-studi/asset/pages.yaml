  md: "# 8 Logistic Regression — Handling Imbalanced Data\n\nIn this interactive section,\
    \ you are tasked to analyze churn behavior of customers of the Telco Telco is\
    \ a fictional telecommunications company that offers various phone and Internet\
    \ services. For your analysis, you will use the IBM Telco customer churn dataset\
    \ (see IBM (2021)). In this dataset, the *Churn* column indicates if a customer\
    \ departed within the last month (*Churn = Yes*) or (*Churn = No*). Other columns\
    \ contain predictor variables for the 7,043 customers, such as *Gender* (Female\
    \ or Male), *SeniorCitizen* (0 for No or 1 for Yes), *Tenure* (months of membership),\
    \ as well as *MonthlyCharges* (in U.S.$).\n\nThe code block below has been executed\
    \ in the background for you. It loads the required libraries and the data, which\
    \ are then stored in the R object DataChurn. Afterward, clean_names() changes\
    \ the variable names to UpperChurn, and select() chooses the variables for analysis.\
    \ Finally, mutate converts the outcome to type factor, which is necessary because\
    \ almost all classification models require the variable to be of type factor.\
    \ The argument levels=c(\"Yes\",\"No\") ensures that \"Yes\" is the positive class\
    \ and \"No\" as the negative class. This is important when you interpret metrics\
    \ such as sensitivity and specificity:\n\n```\nlibrary(rio); library(tidyverse);\
    \ library(tidymodels)\nDataChurn <- import(\"https://ai.lang-analytics.com/data/TelcoData.csv\"\
    ) |>\n  clean_names(\"upper_camel\") |>\n  select(Churn, Gender, SeniorCitizen,\
