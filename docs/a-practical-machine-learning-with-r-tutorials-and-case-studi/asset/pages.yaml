    eta$ values given, we are able to create a prediction for any observation — including\
    \ all observations from the training dataset. Since we also know the actual price\
    \ for the observations, we can calculate the (squared) error for any observation\
    \ in the training dataset.\n\nFor example, the squared prediction error for the\
    \ observation from Table 9.1 is:\n\n```\n$$Error_i^2 = (Price_i - Price_i)^2 =\
    \ (1.51 - 506)^2 = 254510.20$$\n```\n\nIf we use the *Neural Network* to generate\
    \ a prediction for each of the observations from the training dataset and consequently\
    \ can calculate the squared error for each of these observations, we can calculate\
    \ the *Mean Squared Error (MSE)* for the training data — for any given set of\
    \ $\beta$ values. This raises the question:"
