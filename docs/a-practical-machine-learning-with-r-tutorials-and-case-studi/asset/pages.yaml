    and select the variables Price, Sqft (renamed from SqftLiving), Grade, and Waterfront.


    It is unnecessary for a linear regression model to normalize the predictors we
    did for the k-Nearest Neighbors model. The reason is that OLS adjusts the coefficients
    (β parameters) to changing dimensions. You find more information on why it is
    not necessary to normalize predictors for linear regression in the Digital Resource
    section for this chapter.


