    **FIGURE 6.6** Pynomial Degree-6 vs. Linear Prediction Functions


    # 6.6 10-Step Template to Tune with tidymodels


    In the previous section, we used the tidymodels package to tune a polynomial machine
    learning model. tidymodels provides a unified analysis framework independent of
    the machine learning model, you can use the same set of commands for many other
    machine learning models.


    In this section, we provide a 10-Step Template to make it easy for you to develop
    a complete machine learning analysis that includes tuning hyperparameters and
    also assessing the results on the testing data. You can use the template for all
    machine learning models covered in this book and for other machine learning models
    not covered here as well.


    Below you find the 10-Step Template together with sample code. In the Digital
    Resources section for this chapter (see Section 6.10), you will find an R script
    that contains the code for the 10-Step Template together with an example.


    > ^At the writing of this book, tidymodels supported more than 30 machine learning
    models (see https://parnip.tidymodels.org/reference).'
  merge: -1
  img_proc: true
