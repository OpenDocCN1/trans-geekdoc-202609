  md: '# 10.5 Boosting Tree Algorithms


    ```

    $Y_i = \overline{Y} + u_{0,i}\n(10.4)

    ```


    Because we used a *weak learner*, the errors, $u_{0,i}$, most likely contain systematic
    impacts on the outcome. To integrate these systematic impacts, we can create a
    *Decision Tree* ($Dc^{Tree}(Obs_i)$) that uses the known errors (see Equation
    (10.3)) as values for the certain variable and variables from the training dataset
    as predictor variables ($Obs_i$). Predicting errors seems to be a little odd,
    but please bear with us. It will make perfect sense very soon.


    Below is the prediction equation for the initial errors based on the first *Decision
    Tree*:


    ```

    $u_{0,i} = D_i^{Tree}(Obs_i)\n(10.5)

    ```


    Since the *Decision Tree* in Equation (10.5) does not predict the initial errors
    $(u_{0,i})$ perfectly, it will also create its own prediction errors $(u_{1,i})$.
    Consequently, the true errors consist of the predictions from the first *Decision
    Tree* and the errors related to these predictions:


    ```

    $u_{0,i} = D_i^{Tree}(Obs_i) + u_{1,i}\nuu_{1,i}\n(10.6)

    ```


    Substituting Equation (10.6) into Equation (10.4) gives:


    ```

    $Y_i = \overline{Y} + D_i^{Tree}(Obs_i) + u_{1,i}\n\hat{Y}_i\n(10.7)

    ```


    Now, you can see why predicting errors makes sense. Equation (10.7) shows that
    the predictions $\hat{Y}_i$ is not only based on the mean of the outcome $(\overline{Y})$
    but also on the first *Decision Tree*''s prediction $(Dc^{Tree}(Obs_i))$.


    *Gradient Boosting* is a slight modification from the prediction in Equation (10.7).
    Gradient Boosting predicts the outcome at the stage of the first *Decision Tree*
    as:


    ```

    $Y_i = \overline{Y} + \gamma D_i^{Tree}(Obs_i) + u_{1,i} \text{ with: } 0 < \gamma
    < 1\n\hat{Y}_i\n(10.8)

    ```


    Equation (10.8) is identical to Equation (10.7), except that the influence of
    the *Decision Tree* is weakened by multiplying with the learning rate $\gamma$.
    The learning rate $\gamma$ is a tunable *hyper-parameter*. It is usually set to
    values considerably smaller than one. For example, the *Gradient Boosting* algorithm
    *XGBoost* in *tidymodels* uses $\gamma=0.3$ as the default learning rate.


    Since in Equation (10.8) $\gamma$ weakens the influence of the first only'
