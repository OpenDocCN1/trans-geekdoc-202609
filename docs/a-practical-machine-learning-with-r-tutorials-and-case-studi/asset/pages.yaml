- pgno: 244
  md: 'help you to navigate the content, especially when you return to the chapter

    for review.


    In this chapter, you will learn:


    +   * How to work with a graphical representation of a Neural Network

    (see Section 9.4.1).


    +   * How to transform the graphical representation into a Neural Network

    prediction function (see Section 9.4.2).


    +   * How to use an Optimizer in a Neural Network to change the network''s

    parameters to step-improve the approximation quality (the underlying

    method is called Steepest Gradient Descent or Back Propagation Algorithm;

    see Section 9.4.4)


    +   * Why Neural Networks have outstanding approximation qualities that

    allow them to approximate any continuous function with any degree of ac-

    uracy (see Section 9.5).


    +   * How and why the outstanding approximation quality of Neural Networks

    make them prone to overfitting (see Section 9.5).


    +   * How to work with the R package and with PyTorch to design and

    run a Neural Network (see Section 9.5 and Section 9.7).


    +   * Why a Neural Network with ReLU (Rectified Linear Unit) activation

    functions have the same outstanding approximation properties as a Neural

    Network with classic Sigmoid activation functions (see Section 9.6).


    +   * Why ReLU functions mitigate the possible inability of the Optimizer to

    change the values for the j parameters (Vanishing Gradient problem; see

    Section 9.6).


    +   * How to use PyTorch in an interactive project to estimate the prices of

    more than 50,000 diamonds based on four common predictors used in the

    apraisal industry (Carat, Charity, Cut, and Color; see Section 9.7).


