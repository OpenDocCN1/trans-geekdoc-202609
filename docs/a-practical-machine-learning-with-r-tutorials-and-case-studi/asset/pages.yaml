  md: '![](img/f240d449191f5add983daf6c380e4fe3_161_0.png)


    # # Overfitting Summary


    Overfitting occurs when a non-linear (flexible) model adjusts almost perfectly
    to a small number of training observations, but the adjustment is so specific
    that the model fails when predicting test data.

    Overfitting is sometimes compared to human learning behavior, whereby somebody
    learns by heart rather than understanding the underlying theory.

    If — after the completion of model development — a comparison of training and
    testing data reveals overfitting, the model development needs to start from scratch.

    The new model development includes generating new sets of training and testing
    data (change of the value in set.seed()). Otherwise, we risk extending the overfitting
    from training to the testing data.


