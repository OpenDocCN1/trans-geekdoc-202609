- pgno: 301
  md: '# 10.5 Boosting Trees Algorithms


    +   * AdaBoost: AdaBoost is an ensemble algorithm like Random Forest. The AdaBoost
    algorithm uses tree stumps (Decision Trees with one level depth) for its trees.
    It starts by using the outcome and predictor variables from the training dataset
    to create the first tree and following Decision Trees, the errors of the previous
    Decision Tree are used as outcome variables. When these Decision Trees are combined
    to generate a prediction, they are weighted according to their predictive quality.
    Higher weight is assigned to trees with better predictive quality. This weighting
    of the trees is in contrast to a Random Forest, which uses an unweighted average
    for combining the predictions from its Decision Trees.


    We mention AdaBoost because it was one of the earliest Boosting Trees algorithms.
    We will not go into more detail, meanwhile, while powerful Boosting Trees algorithms
    have been developed.¹¹⁷


    +   * Gradient Boosting: This is a very powerful algorithm. Gradient Boosting
    starts with a first prediction based on the mean of the training dataset''s output
    variable. To create the first tree, it uses the errors from the first prediction
    as output and the variables as predictor variables. After, it combines the initial
    prediction and the prediction from the first Decision Tree. Then, based on the
    resulting new prediction errors, it creates a second Decision Tree. After, based
    on the errors from the new prediction, it creates a third tree. This process continues
    until a predefined number of trees is created, or another stopping criteria is
    reached.


    We will cover Boosting in more detail in Section 10.5.1.¹¹⁸


    +   * XGBoost: The XGBoost algorithm¹⁹ is a variation of Gradient Boosting. The
    major difference is that it is optimized for performance as it supports parallelization
    using multiple computer cores, and it supports distributed computing on a cluster
    of computers. This makes XGBoost significantly faster than regular Boosting for
    large datasets. In addition, XGBoost penalizes complex models, which helps avoid
    overfitting.


    You will use the¹¹models of XGBoost in the interactive Section 10.5.2 to predict
    vaccination behavior with the same dataset that was used in the previous section
    with Random Forest.¹⁰


    +   * LightGBM and CATBoost: These two algorithms are mentioned here because they
    are improvements of XGBoost in terms of computer processing


    > ¹⁶ AdaBoost is based on a paper by Freund and Shapire (1996).

    ¹⁷ See Kurama (2018) for more details about AdaBoost.

    ¹⁸ See Vani (2019) for an introduction to Gradient Boosting.

    ¹⁹ See Chen and Guestrin (2016).

    ²⁰ See Mortede (2019) for an introduction to XGBoost.'
  merge: -1
  img_proc: true
