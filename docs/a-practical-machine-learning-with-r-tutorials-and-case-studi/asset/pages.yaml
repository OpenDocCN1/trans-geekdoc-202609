- pgno: 329
  md: '# 11.6 Variable Importance for Tree-Based Models


    The basic idea is to switch off a specific predictor variable and see how much
    this causes in terms of an increased error. Afterward, the procedure is repeated
    for all other predictor variables. The greater the damage caused by switching
    off a specific predictor variable, the greater the importance of this predictor
    variable.


    This raises the question, how can we switch off a predictor variable? Setting
    all values to zero is not an option because it would introduce bias. Setting the
    values to the mean or median of the predictor variable''s values would be an option,
    but it would wipe out information about the variable''s distribution.


    The permutation-based Variable Importance methodology approaches the problem is
    to scramble the values for the switched-off variable over all observations, maintaining
    mean, median, and the distribution of the switched-off variable. Afterward, the
    scrambled (switched-off) predictor variable and the other predictor variables
    are used to predict the outcome. The difference between the new prediction error
    and the original prediction error measures the damage done by scrambling and thus
    measures the Variable Importance.


    The procedure is repeated for all predictor variables, and the damage, i.e., the
    Variable Importance, is compared in the Variable Importance plot.


    Since permutation-based Variable Importance is calculated over a model, regardless
    of a specific observation, it is a global interpretation method.


    Permutation-based Variable Importance uses the Out-of-Bag data from each Decision
    Tree rather than the training data. This improves the generality of the methodology
    but also ties to tree-based models. Therefore, it is a model-specific interpretation
    method. However, model-agnostic approaches for permutation also exist. They usually
    use a validation dataset of the Out-of-Bag dataset.


    Remember, we set importance="impurity" in Section 11.4, when we created the workflow.
    Therefore, we have to create the workflow again with the changed argument and
    fit it to the training data:


    ```

    ModelDesignRF=rand_forest()

    set_engine("ranger", num.threads=detectCores),

    importance="permutation")

    set_mode("regression")

    ```'
  merge: -1
  img_proc: true
