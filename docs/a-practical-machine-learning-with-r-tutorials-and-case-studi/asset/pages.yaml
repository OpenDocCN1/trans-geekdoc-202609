  img_proc: true
- pgno: 122
  md: '# 5.1 Learning Outcomes


    This section outlines what you can expect to learn in this chapter. In addition,
    the corresponding section number is included for each learning outcome to help
    you navigate the content, especially when you return to the chapter for review.


    In this chapter, you will learn:


    +   - The basic concepts of linear regression (see Section 5.3).


    +   - How to calibrate parameters in a machine learning model to improve predictive
    quality (see Section 5.3).


    +   - How to calculate optimal regression parameters using OLS (see Section 5.4.2).


    +   - How to distinguish between unfitted and fitted models (see Section 5.4.2).


    +   - How to use a trial-and-error algorithm calibrated Grid Search in R to find
    optimal regression parameters (see Section 5.4.3.1).


    +   - How to use an Optimizer trial-and-error algorithm in R to find optimal regression
    parameters (see Section 5.4.3.2).


    +   - How to leverage the R tidymod to process data (recipes), to create a linear
    model (model design), to create a workflow, and to calibrate the workflow to the
    training data (see Section 5.4.2).


    +   - How to transform categorical data such as the survival of the Titanic passenger
    (died/survived) or the waterfront of a house (yes/no) into numerical dummy variables
    (see Section 5.5).


    +   - How to distinguish between dummy encoding and one-hot encoding (see Section
    5.5).


