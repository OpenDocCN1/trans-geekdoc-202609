    # 10.5 Boosting Trees Algorithms


    As mentioned, Boosting Trees algorithms are an improvement of Random Forest. They
    are based on many Decision Trees like Random Forest. However, the underlying Decision
    Trees are not randomly modified in Random Forest. Instead, they are boosted by
    weighing the training data used for Decision Tree or by changing how the Decision
    Trees are created and combined. Examples for Boosting Trees algorithms are:'
