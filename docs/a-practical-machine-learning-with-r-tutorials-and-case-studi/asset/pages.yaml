    ## <chr> <chr> <dbl>

    ## 1 accuracy binary 0.777

    ## 2 sensitivity binary 0.426

    ## 3 specificity binary 0.903

    ```


    At a first glance, everything looks good. Accuracy is about 78%, specificity is
    even 90%. However, the result for sensitivity is not good. 43% of the customers
    who churned were correctly identified. Simply flipping a coin to determine if
    a customer churn or would not have given us a sensitivity of 50%


    # What went wrong?


    Using the count(DataTrain, Churn) command in the code below provides the answer:


    ```

    ## Churn n

    ## 1 Yes 1308

    ## 2 No 3621

    ```


    You can see the training dataset is not balanced. The number of observations in
    the training dataset for customers, who did not churn, is triple the number of
    observations for customers who did churn. This imbalanced dataset leads to a biased
    Optimizer with a tendency to predict Churn = No.⁸


    > ⁸The info box in Section 4.8 provides further details about imbalanced datasets
    can cause prediction problems.'
