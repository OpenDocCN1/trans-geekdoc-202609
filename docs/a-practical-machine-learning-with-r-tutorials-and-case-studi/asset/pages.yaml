  md: '252      Deep Learning — MLP Neural Networks Explained


    $Act_{j,s} = max(0, f_{j,s}) \quad (9.10)$


    with $j :=$ hidden number and $i :=$ observation number


    Equation (9.10) shows that the algebraic form of a $ReLU$ activation function
    is limited if the *effective input* is greater than 0, the $ReLU$ function returns
    the *effective input* as $Act_{j,s} = f_{j,s}^+$. If the effective input is smaller
    than 0, the $ReLU$ function returns 0 ($Act_{j,s} = 0$). You can also see this
    in Figure 9.7 below. For all positive *effective inputs*, we get the *Linear-Parent-Function*
    graph ($y=x$-graph). For all negative values we get a straight line with $y=0$.


    Figure 9.7 shows, that the graph of the ReLU activation function is limited to
    depicting only half of a step. In contrast, the graph of a *Sigmoid activation
    function depicts a full step. Therefore the question arises if *Neural Networks*
    with $ReLU$ activation functions have the same outstanding approximation properties
    as *Neural Networks with Sigmoid* activation functions$^{13}$


    ![](img/f240d449191f5add983daf6c380e4fe3_268_0.png)


    # **FIGURE 9.7** The ReLU Activation Function


    The answer is that $ReLU$ activation functions have the same outstanding approximation
    properties. This is because we can combine two $ReLU$ functions into a complete
    step, and then they have the same approximation properties as classical *Sigmoid*
    (full-step) functions.


    > $^{13}$See Section 9.5 for the approximation properties of *Neural Networks
    with Sigmoid* activation functions.'
