    The workflow for the analysis follows almost the same steps as in the previous
    section. We create a recipe and a model design. Afterward, we add both to a workflow:


    ```

    RecipeHousesPolinomOLS=recipe(Price-, data=DataTrain)

    step_poly(Sqft, degree=tune())

    options=list(raw=TRUE)


    ModelInRegr=linear_reg())

    set_engine("lm")

    set_mode("regression")


    TuneWFModelHouses=workflow()

    add_model(ModelDesignInRegr)

    add_recipe(RecipeHousesPolinomOLS)

    ```


    However, there are two differences compared to the workflow in Section 6.4:


    +   1. In step_poly() where the argument degree determines the highest power of
    *Sqft* in the prediction equation, we do not assign a number'
