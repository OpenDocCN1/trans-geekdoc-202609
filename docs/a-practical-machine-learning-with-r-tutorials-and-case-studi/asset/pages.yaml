  md: '# 4 k-Nearest Neighbors — Getting Started


    ## 6 red 38 6.7


    First, we load the required packages using the library() commands. Then the wine
    dataset is downloaded from the Internet, and for better readability, variable
    names are changed to UpperCamel notation using the command clean_names() from
    the janitor package (see Section 3.6 for details). Next, we use select() to ensure
    that only the variables WineColor, Sulfur (renamed from TotalSulfurDioxide), and
    Acidity are included in the data frame. WineData.


    When working with data to build and test machine learning models, we work with
    datasets that contain observations. We use these observations for feature engineering,
    building the model''s hyper-parameters, and assessing the predictive quality of
    the final model.


    Can we use all of our observations for all of these purposes? The answer is “No”
    because we cannot use observations to optimize our model and then use the same
    observations to assess the model''s predictive quality.


    Suppose we would use the same observations to optimize the model and assess the
    model''s predictive quality. Then the assessment would show how well the model
    approximates the data rather than the model''s ability to predict new data.


    To avoid this type of ill-designed assessment, we withhold some data that are
    never used for training or optimizing the model. In other words, we set aside
    some data the model will never see during development. These data are called testing
    data, while the data used for training and optimizing the model are called training
    data.


    Kuhn and Silge (2022) use the concept of “spending” observations to explain the
    concept of training and testing data: Just like you can spend the same dollar
    once, you can spend (use) an observation from a dataset only once. You can either
    spend (use) an observation for optimizing a model (the observation becomes part
    of the training data) or for assessing the final model (the observation becomes
    part of the testing data) but not for both. Assigning observations to either the
    training or the testing dataset is usually done randomly.


    > ¹An exception is time series data, where the most up-to-date data are assigned
    to the testing dataset.'
