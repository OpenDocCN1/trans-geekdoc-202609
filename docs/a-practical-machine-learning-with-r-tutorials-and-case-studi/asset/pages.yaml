    # 11.6 Variable Importance for Tree-Based Models


    In the previous section, we used Ceteris Paribus plots and Partial Dependence
    Plots to analyze the quantitative impact of predictor variable changes. In contrast,
    Variable Importance Plots (VIP) focus on the relevance of a predictor variable
    rather than its quantitative impact on the outcome. As the name suggests, VIP
    focus on predictor variable importance.


    VIPs can help decide if a specific predictor variable is important enough to be
    kept in a model or if it should be dropped.


    # 11.6.1 Impurity-Based Variable Importance Plot


    When we covered Decision Trees in Section 10.3, the task was to predict survival
    on the Titanic—a classification task. For a classification task, every split that
    used in a tree reduces the impurity from the parent node (before the split) to
    the resulting child nodes (after the split). In Section 10.3, we used the Gini
    coefficient to measure impurity reduction.


    When using a Decision Tree to predict a continuous outcome, every split also reduces
    the impurity from the parent node (before the split) to the two resulting child
    nodes (after the split). However, we can no longer use the Gini coefficient to
    measure impurity reduction because it is a specific measure for classification
    only. An alternative for a continuous'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# 11.6 Variable Importance for Tree-Based Models


    outcome variable to measure impurity reduction is to use the variance of the outcome
    variable before and after the split.


    Let us use the wage prediction example to show how this works. Assume in a Decision
    Tree, we have already corrected for tenure and education at a higher level of
    the tree. Now we reach a decision rule that splits for sex=male. Assuming sex
    discrimination, this parent node would contain men with high salaries (positive
    deviation from the mean) and women with low salaries (negative deviation from
    the mean), leading to a high variance. If we split by sex=male, the left node
    would only contain men. Since the new mean for this left node would be higher,
    the deviation of the higher-paid male observations from the new mean would be
    relatively low. The same is true for the female node. The new mean in this node
    would be lower, the deviation from this mean for the lower-paid female workers
    would be relatively high. This reduced the variance and thus the impurity in the
    two child nodes compared to the parent node.


    Regardless we measure impurity with the Gini coefficient or through variance,
    in both cases, a more splitting rule can reduce the impurity from the parent node
    to the two children nodes, the more effective the related predictor variable.


    The importance of a variable in an impurity-based Variable Importance Plot measured
    as the average impurity reduction for all splits, where the variable was the splitting
    variable.


    Since all tree-based models consist of one or more Decision Trees and each Decision
    Tree consists of several splits, impurity-based Variable Importance. However,
    since it cannot be used for models that are not tree-based, it is a model-specific
    interpretation method.


    Since impurity-based Variable Importance is calculated for a whole model and not
    for a specific observation, it is a global interpretation method.


    Instead of using the training data to calculate the reduction of impurity for
    the predictor variables, the VIP package uses the Out-of-Bag data (see Section
    10.4.1) to calculate the Variable Importance. Using Out-of-Bag data rather than
    training data improves the quality of Variable Importance plots.


    The impurity is calculated at the time when the Decision Trees are created, to
    trigger the calculation of impurity reduction for every split, the importance="impurity"
    is required in the workflow command.8 If we want to use a different importance
    measure like importance="permutation" in the following section, we have to set
    the argument importance differently before the workflow is fit to the training
    data, or we have to repeat the fitting.


    > ^7 See Molnar (2020), Section 5.4.


    > ^8 We did this in Section 11.4.'
