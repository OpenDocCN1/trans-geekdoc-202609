    \ $\beta_{2,opt}$ for the mockup example using OLS. Afterward, in Section 5.4.3,\
    \ we will introduce two algorithms that a computer can use for a systematic trial-and-error\
    \ approach to find the optimal values $\beta_{1,opt}$ and $\beta_{2,opt}$.\n\n\
    # 5.4.2 Calculate Optimal Parameter Values Based on OLS\n\nThe most common method\
    \ to find optimal values for the parameters (such as $\beta_1$ and $\beta_2$)\
    \ in linear regression is based on the Ordinary Least Squares (OLS) method. With\
    \ OLS, a linear regression's optimal $\beta s$ can be determined using formulas\
    \ (closed-form solution). Unfortunately, OLS works only for"
