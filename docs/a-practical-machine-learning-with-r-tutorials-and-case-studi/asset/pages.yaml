  md: '# 7 Ridge, Lasso, and Elastic-Net — Regularization Explained


    In the previous chapter, you learned how to adjust hyper-parameters during the
    model design stage to avoid overfitting while still getting a good approximation
    of the training data.


    In this chapter, we will introduce regularization. Regularization is another technique
    to avoid overfitting, and it is applied at the training stage of a machine learning
    algorithm — when the optimal $\beta$ parameters are determined. Regularization
    adds penalties for large parameters to a machine learning model''s target function.
    Here we will cover the most common penalty types Lasso, Ridge, and Elastic-Net;
    the latter is a combination between Lasso and Ridge. These penalties limit the
    variability of the underlying regression model by eliminating or significantly
    weakening model-parameters $(\beta$) that are not crucial for the prediction quality.
    We will explain the idea behind regularization in Section 7.4.


    In Section 7.4.1, a Lasso regularized univariate Polynomial Regression model will
    be introduced, and in Section 7.4.2, a Ridge regularized Polynomial Regression
    model will be presented. Section 7.4.3 shows how Ridge and Lasso models be combined
    into the Elastic-Net approach.


    In the interactive Section 7.5, you will use a multivariate Elastic-Net regression
    model to estimate house prices. You can experiment with the hyper-parameters that
    control the mix of Ridge and Lasso in an Elastic-Net regression model. Afterward,
    you will tune the Elastic-Net model to optimize predictive quality.


    # 7.1 Learning Outcomes


    This section outlines what you can expect to learn in this chapter. In addition,
    the corresponding section number is included for each learning outcome to help
    you to navigate the content, especially when you return to the chapter for review.


    In this chapter, you will learn:'
  merge: -1
  img_proc: true
