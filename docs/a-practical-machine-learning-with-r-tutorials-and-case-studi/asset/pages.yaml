  md: '# Introduction to R and RStudio


    R is a free programming language and environment for statistical computing (R
    Core Team (2022)). R is usually used together with the Integrated Development
    Environment (IDE) RStudio (RStudio Team (2022)). RStudio provides a graphical
    interface for coding, debugging, and testing in R. Through this book, R is used
    together with RStudio to prepare data and to process machine learning algorithms.


    This chapter aims to provide the reader with the necessary R knowledge. The content
    will cover only R commands and functionality essential to work with the sample
    R code used in the book to keep it short and simple. For a comprehensive coverage
    of R, see Wickham and Grolemund (2017) and Wickham (2019).


    Every beginner or intermediate user of R is encouraged to thoroughly work through
    this chapter since it describes workflows used later when working with machine
    learning. Advanced R users should at skim through the chapter to get familiar
    with the workflows.


    Keep in mind that there is often more than one way to solve the problem in R.
    For the sake of simplicity, this chapter selects the method preferred by the author.
    The intention is not to claim that this method is the best, but to show examples
    that are adequate and clear.


    At the end of this chapter you will find two interactive sections (see Sections
    3.10 and 3.11). These interactive sections contain a project and exercises with
    code blocks that you can load, modify, and execute in RStudio. To understand a
    programming language like R, it is essential that you engage in hands-on experimentation
    with the language.


    You can find links to Digital Resources such as videos and other resources in
    Section 3.12. These resources will help you improve your knowledge of R further.'
