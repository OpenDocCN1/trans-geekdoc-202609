  md: '# 1.1 How the Book is Organized


    The order in which machine learning algorithms are introduced in this book does
    not follow the traditional order of other machine learning textbooks. Most machine
    machine learning books cover theoretical concepts and terminologies upfront before
    applying machine learning algorithms to solve problems.


    In my experience, a more effective way of teaching machine learning is to introduce
    the basics of an algorithm and apply the model immediately. Along the way, we
    will introduce the necessary terminology and theory when they may be relevant
    and contextual to the specific workflow which is being explained.


    A good example is the k-Nearest Neighbors algorithm, which is usually covered
    in the later part of most textbooks. Here, k-Nearest Neighbors is the first algorithm
    covered. k-Nearest Neighbors can be explained and applied without any prior knowledge
    in data science. With the k-Nearest Neighbors chapter, the concept of the confusion
    matrix is explained, which can be used to interpret the k-Nearest Neighbors results
    and is needed for some of the subsequent chapters.


    The principle of introducing essential data science concepts and terminology on
    a "when-needed basis" is reflected in the chapter titles. Most chapters are titled
    with the machine learning algorithm covered in the chapter — with a subtitle reflecting
    the data science concept(s) introduced in connection with the machine learning
    algorithm.


    # 1.2 Using tidymodels for Data Processing and Model Workflows


    The tidymodels package (Kuhn and Wickham (2020)), an extension of R is used throughout
    the book. This package unifies and limits the commands to to work with various
    machine learning algorithms regardless of which machine learning model is used.
    Only a few lines must be adjusted when a new machine learning model is introduced.
    The code is more intuitive and easy to read, which allows readers to focus on
    the logic of the algorithms rather than on programming syntax. Instead of reinventing
    the wheel and providing new machine learning libraries, tidymodels provides wrappers
    for the most common machine learning models in R. This way, the code is unified,
    but still,


    > The tidymodels package is the successor of the caret package (Kuhn (2008)).
    Like the caret package, it simplifies data processing and model workflow management,
    by tidymodels provides additional functionalities in a more systematic way.'
  merge: -1
  img_proc: true
