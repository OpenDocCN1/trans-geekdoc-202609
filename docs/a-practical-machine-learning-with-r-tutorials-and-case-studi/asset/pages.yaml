    The question remains is:


    # What is the advantage of the Logistic function compared to Sigmoid (step) functions?


    To answer this question, we must distinguish between odds and probabilities. You
    probably have heard about odds already in connection with sports betting.


    # Probabilities vs. Odds


    Both probabilities and odds measure the chance of a success (e.g., getting heads
    in a coin flip or rolling with a die). A probability measures the ratio between
    the expected number of successes occurring in relation to the total number of
    possible. For example, the probability of a head (success) in a coin flip is $\frac{1}{2}=\#Successes$,
    because we expect heads when we flip the coin twice. The probability of rolling
    a six with a die is $\frac{1}{6}=\#Successes$.


    ```

    $P^{prob} = \frac{\#Successes}{\#Successes + #NoSuccesses} (8.3)

    ```


    In contrast, odds measure the ratio between the number of successes occurring
    in relation to the number of no-successes occurring. One could also say odds are
    the number of events with "something happening" in relation to the number of events
    with "nothing happening".


    For example, the odds in a coin flip for heads are $\frac{\#Successes}{\#NoSuccesses}=1$.
    The odds for rolling a six with a die are $\frac{\#Successes}{\#NoSuccesses}$.
    We would say that the odds for heads are 1 to 1, often expressed as 1:1 and that
    the odds of rolling a six with a die are 1 to 5. You can calculate odds as:


    ```

    $Odds^{odds} = \frac{\#Successes}{\#NoSuccesses} (8.4)

    ```


    To derive how to convert probabilities to odds, we start with dividing numerator
    and denominator in Equation (8.4) by $(\#Successes +#NoSuccesses)$;


    ```

    $Odds^{odds} = \frac{P^{prob}}{1 - P^{prob}} = \frac{P^{prob}}{P^{no}} (8.5)

    ```


    You can see now that the main numerator in Equation (8.5) equals $P^{prob}$ and
    the main denominator equals $P^{no}$. Therefore, we can convert probabilities
    to odds as follows:


    ```

    $Odds^{odds} = \frac{P^{prob}}{P^{no}}$ with: $P^{no} = 1 - P^{prob} (8.6)

    ```'
  merge: -1
  img_proc: true
