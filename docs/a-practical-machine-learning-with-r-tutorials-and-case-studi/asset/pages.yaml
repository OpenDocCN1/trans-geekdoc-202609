    # 4.7.7 Assessing the Predictive Quality with Metrics


    The tidymodel package provides several commands to calculate metrics that reflect
    performance. Most of these compare the estimate with the truth and calculate the
    related metrics.


    For example, we can use the conf_mat() command from tidymodel to create a confusion
    matrix. The command requires two arguments:


    +   1. the name of the data frame that contains the estimate and the truth (e.g.,
    DataTestWithPred).

    2. The variable that contains the truth (e.g., DataWine)

    3. The variable that contains the estimate (e.g., _pred_class)


    The code below uses conf_mat() in combination with the data frame DataTestWithPred
    to generate a confusion matrix:


    ```

    ConfMatrixWine=conf_mat(DataTestWithPred, truth=WhiteColor, estimate=.pred_class)


    print(ConfMatrixWine)


    ## Truth

    ## Prediction red white

    ## red 436 46

    ## white 44 434

    ```


    The sum of the counts of the main-diagonal elements of the confusion matrix (the
    counts of correctly predicted wines) is very high, compared to the sum of the
    counts of the off-diagonal elements (the counts of the falsely predicted wines).
    This is the first indicator for a good prediction quality. However, as the following
    section will show, we have to analyze the matrix in more depth to gain an accurate,
    objective assessment about the prediction quality.'
