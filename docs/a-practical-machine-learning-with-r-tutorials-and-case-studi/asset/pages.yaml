    # 11.8 Local Interpretable Model-agnostic Explanations

    LIME)


    LIME (Local Interpretable Model-agnostic Explanations) is, as the name suggests,
    a local and model-agnostic interpretation algorithm. It was developed in 2016
    by Ribeiro et al. (2016).


    Because LIME is a local interpretation method, the goal is to explain the prediction
    for a specific observation from a complex model such as Neural Network or Random
    Forest. However, instead of interpreting the complex model directly, LIME uses
    a simpler but interpretable model such as linear OLS to interpret the observation
    of interest.


    The underlying assumption is that the complex model (e.g., Random Forest) can
    be approximated by the simpler model (e.g., OLS) in the neighborhood of the observation
    of interest. Neighborhood means, in this context, similar values for the predictor
    variables as the observation of interest. In short:


    > LIME uses an interpretable machine learning model (e.g., OLS) to approximate
    a complex machine learning model in the neighborhood of the observation of interest.


    The three steps will give you an idea how LIME accomplishes this task in R.¹19


    Step 1: Because not enough observations be available in the neighborhood of the
    observation of interest, LIME creates artificial predictor values with similar
    values as the observation of interest (5,000 observations by default).


    For each continuous predictor variable LIME analyzes the distribution of


    ¹⁹The R implementation is explained in detail in Hvitfeldt et al. (2022).'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# 11 Interpreting Machine Learning Results


    the training data using quantile bins. Then, for each continuous predictor variable,
    random values are generated that match the distribution of the training data.
    However, only the values that fall in the same quantile bin as the observation
    of interest are used to create the artificial observations. This ensures that
    no values are used that differ too much from the observation of interest.


    For categorical variables as *Female*, only the category that coincides with the
    one of the observation of interest (*Female* = 1 in our example) is used when
    artificial observations are created.


    Step 2: Since we want to explain the predictions of the complex model (e.g., *Random
    Forest*) in the neighborhood of the observation of interest, we need to create
    these predictions with the *Random Forest* model (complex) from artificial observations.


    Step 3: Finally, the dataset created in Step 2 is used with *OLS* (or another
    interpretable model) to analyze the prediction of the predictor variables on the
    predictions from the *Random Forest* (the complex model). The artificial observations
    are weighted on their similarity to the observation of interest. Similar observations
    receive a high weight, while dissimilar observations get a low weight. This ensures
    that the *OLS* model focuses on observations closer to the observation of interest.


    The result from the OLS model estimates of how much each predictor variable value
    from the observation of interest contributes to the related prediction.


