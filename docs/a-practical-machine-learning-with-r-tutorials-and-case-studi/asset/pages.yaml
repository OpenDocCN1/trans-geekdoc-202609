    \ the MSE\n\nMSE for the univariate OLS regression with $N$ observations can be\
    \ calculated as:\n\n> $MSE = \\frac{1}{N} \\sum_{i=1}^{N}(\\beta_1 x_i - y_i)^2$\
    \ with $x_i$ and $y_i$ known from the training dataset.\n\n+   1. When the training\
    \ data are given, only the choice of the $\beta$ parameters determines the MSE.\
    \ Since both — the values for $x_i$ and $y_i$ — are part of the training dataset,\
    \ the MSE depends only on the chosen values for the $\beta$ parameters.\n2. Since\
    \ different $\beta_1$ and $\beta_2$ generate different MSEs, the goal is to find\
