- pgno: 258
  md: "# 9 Deep Learning — MLP Neural Networks Explained\n\nNext, we define the recipe().\
    \ It will later be added to a workflow() for the analysis:\n\n```\nRecipeDiamonds=recipe(Price=,\
    \ data=DataTrain) |\nstep_normalize(all_predictors())\n```\n\nAs you can see,\
    \ we normalize the predictor variables. Most Neural Network applications require\
    \ careful scaling of the predictor variables. Why is this the case explained with\
    \ the Figure 9.3 and in the info box that follows.\n\n![](img/f240d449191f5add983daf6c380e4fe3_258_0.png)\n\
    \n**FIGURE 9.3** The Sigmoid Scaled Predictors\n\n# Why Neural Networks Need Large\
    \ values\n\nWhen some or all predictor variables contain large values, the effective\
    \ inputs can also become large. Suppose one of the inputs is the U.S. Gross Domestic\
    \ Product (GDP) measured in millions of U.S. Dollars ($20,600,000 million for\
    \ 2022). Such high values multiplied by the weights $\beta$ adds part of the effective\
    \ inputs for the hidden neurons. Consequently, these effective inputs will also\
    \ become large even if the absolute $\beta$ values that multiply the GDP are small\
    \ (e.g., 0.004–0.0002).\n\nYou can see the resulting problem in Figure 9.3. Effective\
    \ inputs smaller than -5 or greater than 5 will impact the activation function\
    \ at its (almost) horizontal sections, leading to activity values of 0 or 1."
  merge: -1
  img_proc: true
- pgno: 259
  md: "# 9.5 Build a Simplified Neural Network Model\n\nConsequently, for predictor\
    \ variables with large input values such as the GDP, a Neural Network will likely\
    \ create activities of either 0 or 1 for all observations. Afterwards, between\
    \ the hidden and the output layer (see Figure 9.1), these 0 or 1 activities will\
    \ be multiplied by the weights which do not change for the different observations\
    \ (they stay 0 or 1), the output of the Neural Network will remain constant regardless\
    \ of observation.\n\nIf this is not bad enough, the optimization process used\
    \ in Neural Networks (most of the time it varies when the slope of the Gradient\
    \ Descent algorithm) has difficulties when the slope of activation functions is\
    \ 0. Consequently, the beta that multiplies the inputs would not get (smaller)\
    \ during the iterations.\n\nTo make a numerical example, you can process two different\
    \ diamonds through the Neural Network (Clarity₁ = 0.1, Clarity₂ = 5 and Clarity₃\
    \ = 0.4, Clarity₄ = 6). Both diamonds will generate $A_1^1=A_2^1=1$ and, despite\
    \ being different, will have exactly the same predicted output.\n\n> As a rule\
    \ of thumb: When you get a zero or similar values for predictions for all of your\
    \ training data, it is often to have a lack of scaling or inappropriate scaling.\n\
    \n\"The Steepest Gradient algorithm changes beta based on partial derivatives.\
    \ When the slope of the activation function is zero, the partial derivatives are\
    \ also zero, and so is the beta of\n\nIn the recipe above we used step_normalize\
    \ and applied Z-score Normalization (see Section 4.6 for more details). The Z-score\
    \ Scaling method is often used for Neural Networks. Z-score Normalization is likely\
    \ to produce values smaller than -5 or greater than 5.¹ Additionally, the scaled\
    \ inputs are multiplied by absolute β β values smaller than one. Consequently,\
    \ effective inputs are not large and have a good chance to impact the activation\
    \ function at different points in the middle section. In this section the slope\
    \ is not zero and the generated activities discriminate between input values (see\
    \ Figure 9.3). Consequently, the Neural Network generates different outputs for\
    \ different observations.\n\nNext, we create a model design for the Neural Network\
    \ analysis:\n\n```\nModelDesignNN <- ml(hidden_units=50, epochs=10000, penalty=0)\
    \ |\n  set_engine(\"nnet\")\n  set_mode(\"regression\")\n```\n\nThe model command\
    \ for an MLP network is mlp(), and we use the net package (see set_engine(\"nnet\"\
    )). The argument hidden_units=50 determines that we use a hidden layer with 50\
    \ hidden neurons, epochs=10000 determines that the Optimizer runs 10000 epochs\
    \ (iterations), and penalty=0 determines\n\n> ¹For example, a normal-distributed\
    \ variable's probability of having a Z-score greater than 5 or smaller than -5\
    \ is 0.000057."
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 9 Deep Learning — Neural Networks Explained


    that we do not use regularization. The package meet supports regularization

    similar to Ridge regularization, and the value assigned to penalty determines

    how the penalty term and the MSE are weighted in the target function. All

    three arguments can be optimally tuned by assigning tune(). Here we keep

    simple and do not tune the Neural Network, but in the interactive Section

    9.7, you will tune a Neural Network using PyTorch.


    To fit a workflow model with the training data, we must add the recipe

    and use the built-in Optimizer and the training

    data (DataTrain) to find optimal parameters for the bs:


    ```

    WFModelNN=workflow() %>nadd_model(ModelDesignNN) |nadd_recipe(RecipeDiamonds)
    |nfit(DataTrain)

    ```


    Since the workflowModelNN is now a fitted workflow, we can use it for pre-

    dicting models.


    We start with generating predictions for the training dataset and evaluating

    how well the predictions approximate the true values in the training dataset.

    Again, we use the augment() command to create the predictions. These predic-

    t are augmented to the training dataset by creating an extra column

    pred. The resulting dataframe is saved as DataTrainWithPred.


    The metrics() command then compares for each observation the prediction

    (.pred) with the true value for the diamond (Price) and calculates the

    root of the mean squared error MSE, r^2 and the mean absolute error (mae)

    for the training:


    ```

    DataTrainWithPredNN=augment(WFModelNN, new_data=DataTrain)

    metrics(DataTrainWithPredNN, truth=Price, estimate=$pred)

    ```


    ```

    ## # tibble: 3 3

    ## .metric .estimator .estimate

    ## <chr> <chr> <dbl>

    ## 1 rmse standard 198.

    ## 2 mse standard 0.996

    ## 3 mae standard 111.

    ```


    As you can see, the Neural Network approximates the training data extremely

    well. For example, r^2 = 0.996.


    How such a (suspiciously) good approximation is possible, is illustrated in

    Figures 9.4 and 9.5. In Figure 9.4, you can see a 3D scatter plot of the training

    data. The two axes on the bottom of the 3D cube reflect Carat and Clarity.'
