    \ can also choose to continue reading either in the book or online, but you will\
    \ not benefit from the interactive learning experience.\n\n$14}$In terms of calculus:\
    \ The partial derivative for the related $\beta$ parameters contain (weighted)\
    \ products of the activities from multiple layers.\n$^{15}$The detailed explanation\
