    # ### Data Frame Object:


    R can store a complete data table with rows and columns in an object. We refer
    to such a table as a data frame object.


    A data frame is very similar to an Excel table. The first row of a data frame
    defines the names of the variables that are stored in the columns — similar to
    a title in Excel. The following rows of a data frame (starting with row two) contain
    the values for the observations stored in the data frame. Each row is one observation.


    Each data frame contains a named variable related to the observations. The variable''s
    name and values are stored in the following entries. These values can be of various
    Data Types such as char, numeric, or factor — you can have different Data Types
    for different columns. However, each column can have only one type.


    You can think of a data frame as a combination of R vectors arranged in the data
    frame''s columns. In fact, you can extract the data frame column as a vector and
    the column (name) separated with a $\$-sign.


