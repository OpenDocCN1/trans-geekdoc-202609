- pgno: 352
  md: '# 11 Interpreting Machine Learning Results


    +   - Uses an interpretation proxy model like linear OLS to quantify the impact
    of predictor variable values on a specific prediction.

    - Can be used together with SHAP values to verify if the results from both methodologies
    match.

    - Can be used as an alternative method to SHAP values when estimating SHAP values
    is computationally too expensive.

    - Model-agnostic and local.


