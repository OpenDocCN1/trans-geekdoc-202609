  md: '# 8 Logistic Regression — Handling Imbalanced Data


    Logistic Regression is a machine learning algorithm that can be used to classify
    binary categories such as Yes/No, Present/Not-Present, or Red Wine/White Wine.
    Logistic Regression is one of the classic machine learning algorithms for classification
    problems. The basic idea dates back almost 200 years (Verhulst (1845)). Nevertheless,
    Logistic Regression is among the most used algorithms for classifying binary events
    and is often successful in machine learning competitions.


    # 8.1 Learning Outcomes


    This section outlines what you can expect to learn in this chapter. In addition,
    the corresponding section number is included for each learning outcome to help
    you to navigate the content, especially when you return to the chapter for review.

    In this chapter, you will learn:


    +   * What are the basic ideas Logistic Regression (see Section 8.3).

    * Why Logistic Regression is better suited than OLS for predicting categorical
    variables (see Section 8.3).

    * How to distinguish between probabilities and odds (see Section 8.3).

    * How to convert probabilities to odds (see Section 8.3).

    * How you can transform the Logistic Regression equation into a form that is similar
    to the linear OLS regression equation (see Section 8.3).

    * How you can use the transformed equation to interpret a Logistic Regression''s
    model-parameters (see Section 8.3).

    * How to create a tidymodels workflow for Logistic Regression to analyze churn
    in the TELCO telecommunications company (see the interactive Section 8.4).'
  merge: -1
  img_proc: true
