  md: '(Survived = FALSE or Survived = TRUE) for each terminal node (see

    t first labels of the six terminal nodes).


    # Decision Tree Predictions for Binary vs. Continuous Variables


    The prediction for a specific node for a binary variable like Survived (TRUE or
    FALSE) can be derived as follows:


    Using all observations from the training dataset that end up in a specific node,
    the proportion for the last label TRUE. If this proportion is greater than 50%,
    predict TRUE for any observation that ends up in this node. Otherwise, predict
    FALSE.


    The prediction for a specific node for a continuous variable can be derived as
    follows:


    Calculate the mean for the outcome variable from all training data observations
    that ended up in a specific node. This is the prediction for an observation''s
    outcome that later ends up in that.


    Now that you know how the training data were guided through the tree to one of
    the terminal nodes, you should be able to interpret the Decision Tree as whole.
    Try to confirm the following five statements with the Decision Tree in Figure
    10.1.


    +   1. Adult male passengers 13 years or older, regardless of the class they traveled
    and the fare they paid, had only a survival rate of 0.17.


    +   2. Young male passengers (young than 13 years), regardless of which class
    they traveled and the fare they paid, had a survival rate of 0.57.


    +   3. Young male passengers (young than 13 years) traveling in Third Class had
    only a survival rate of 0.4 regardless of the fare they paid.


    +   4. Female passengers, regardless of age and not considering the class they
    traveled in or the fare they paid, had a survival rate of 0.73.


    +   5. When considering the class female passengers traveled in, we can see female
    passengers, regardless of age, had a survival rate of 0.95 when they traveled
    in First or Second Class regardless of the fare they paid.


    Note that not decision rules and nodes from the Decision Tree in Figure 10.1 make
    sense — a weakness of Decision Trees.


    For example, if you look at the rule that created the fourth and fifth terminal
    nodes and the related parent node, you can see that females traveling in Third
    Class had a lower survival rate when the fare they paid was more than 25 British
    pounds as compared to otherwise (5% vs. 60%). It makes little sense that a higher
    ticket price in the same class would lower somebody''s survival chances.'
