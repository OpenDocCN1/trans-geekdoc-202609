  \n在开始全系统扫描之前，您必须确保在“对象扫描”选项卡上已勾选“Disk boot sectors”（磁盘引导扇区）、“Hidden startup objects”（隐藏启动对象）和“C”。按下“Start\
  \ objects scan”（开始对象扫描）按钮以启动扫描。\n\n有些类型的恶意软件或广告软件能逃避杀毒软件的查杀。通常，这些威胁不如病毒激进，但仍然令人烦恼。例如，那些安装工具栏并将导航重定向到充满广告的网站的软件。为了对抗这类恶意软件，建议安装免费软件，如“Adwcleaner”和“Malwarebytes”。\n\
  \n### 如何手动从电脑中删除病毒\n\n要手动从电脑中删除病毒，您需要具备对计算机及其操作系统运作的高级知识。事实上，您需要识别受感染的文件并将其删除，或卸载包含该文件的程序。如果操作不当，可能会损害计算机的运行，最坏的情况下，将不得不重新格式化电脑，导致其中所有数据丢失。\n\
  \n#### 在 PC 上\n\n如果您使用的是 Windows，第一步是创建一个还原点，以便在操作系统稳定性受损时使用。\n\n同时按下 `Ctrl+Shift+Esc`\
  \ 键启动“任务管理器”。点击“详细信息”，然后点击“进程”选项卡。检查正在运行的进程列表，如果发现可疑项目，请记下并在 Google 上搜索。\n\n如果您确定正在运行的进程是病毒，请右键点击可疑进程，选择“打开文件位置”。访问\
  \ VirusTotal 网站，将可疑文件拖拽到网页区域。VirusTotal 将分析该文件，如果确认被感染，您必须将其删除。\n\n要删除受感染的文件，请转到“进程”选项卡，右键点击受感染文件的名称，从菜单中选择“结束进程树”，并点击“是”按钮确认。\n\
  \n如果受感染的文件属于某个程序，请进入“控制面板” > “程序和功能” > “卸载程序”。选择该程序并点击“卸载”。\n\n您也可以通过右键点击文件，同时按住“Shift”键选择“删除”，然后按“是”来删除受感染的文件。此过程可能会影响操作系统的运行，或留下不可见的病毒残留。\n\
  \n手动删除病毒后，重启计算机，并检查 Windows 启动时自动运行的程序。如果再次发现该程序，必须将其从启动列表中移除。\n\n如果您使用的是 Windows\
  \ 10，请进入“任务管理器”，点击“启动”，找到该文件，右键点击并选择“禁用”。\n\n如果您使用的是旧版 Windows，请同时按下 `Win+R`。将出现一个面板，输入命令\
  \ `msconfig`，按“回车”并点击“启动”选项卡。找到受感染的程序后，取消勾选，点击“确定”，然后点击“重新启动”以立即重启计算机。\n\n作为最后的检查，以验证受感染文件是否已完全删除，请检查您使用的浏览器的扩展程序。访问您正在使用的浏览器的设置：\n\
  \n\n\n\n#### 浏览器扩展管理\n\n##### Chrome\n点击右上角的按钮（`⋮`），进入`Other Tools > Extensions`菜单。\n\
  \n##### Firefox\n点击右上角的`☰`按钮，然后点击`Add-ons`，从左侧边栏选择`Extensions`。\n\n##### Microsoft\
  \ Edge\n按下按钮（`...`），从打开的菜单中点击`Extensions`项。\n\n#### 病毒删除故障排除\n\n如果在删除病毒时出现\"Access\
  \ denied\"或\"Cannot execute\"等错误消息，必须在\"Safe Mode\"（安全模式）下启动电脑，并从此模式下删除病毒。从电脑中永久删除病毒后，必须采取必要的预防措施，以免再次发生。\n\
  \n*   不要从未知和可疑网站下载程序，也不要打开通过电子邮件、社交网络收到的附件。\n*   始终保持操作系统为最新状态。\n*   安装优质的安全解决方案。\n\
  *   切勿禁用操作系统或防病毒保护。\n\n> **注意：** 如果仍然遇到电脑故障，说明病毒仍然存在。在这种情况下，需要干预\"Registry\"（注册表）。这是一个相当复杂和精细的操作。因此建议安装一款能在完全安全的情况下执行所有必要操作的防病毒软件。\n\
  \n#### Mac 病毒处理指南\n\n如果您使用的是 Mac，感染的概率非常低。但是，如果您的 Mac 被感染，首先要做的是使用 Mac `Activity\
  \ Monitoring`（活动监视器）实用程序检查所有当前正在运行的软件。\n\n1.  点击`Go > Finder Utility`菜单并启动`Activity\
  \ Monitoring`工具。\n2.  仔细观察所有正在运行的进程并识别可疑进程。\n3.  在 Google 上搜索以确认是否为威胁。\n4.  如果确认为病毒，返回`Activity\
  \ Monitoring`窗口，点击受感染的进程，然后点击顶部的按钮，最后点击两次`Exit`按钮。这将立即停用有害活动。\n\n##### 永久删除病毒\n\n\
  1.  进入 Mac 的`Applications`文件夹，识别\"有问题的\"程序。\n2.  右键点击相关文件，选择`Move to Trash`（移至废纸篓），然后选择`Empty\
  \ Trash`（清空废纸篓）。\n\n##### 检查 Safari 浏览器扩展\n\n作为最后检查以确保病毒已完全删除：\n\n1.  进入`Safari\
  \ > Preferences`菜单，转到`Extensions`选项卡。\n2.  选择受感染的扩展并点击`Uninstall`。\n\n##### Mac\
  \ 安全模式\n\n如果无法在浏览器中删除病毒及其扩展，则需要在\"Safe Mode\"（安全模式）下启动 Mac 并从此模式下删除病毒。\n\n**启动 Mac\
  \ 安全模式的方法：**\n在重新启动电脑时按住`Shift`键。当出现 Apple 徽标并看到登录窗口时，释放`Shift`键并像往常一样登录。\n\n#####\
  \ 验证 macOS 保护机制\n\n1.  打开 Mac `System Preferences`（系统偏好设置），选择`Security and Privacy`（安全性与隐私），点击`General`（通用）选项卡。\n\
  2.  检查`Gatekeeper`是否处于激活状态，方法是查看`App Store and identified developers`旁边是否有勾选标记。如果没有，点击页面底部的锁图标，输入您的帐户密码并勾选该框。\n\
  3.  最后，检查`Xprotect`数据库更新是否处于激活状态。进入`System Preferences`，然后进入`App Store`，勾选`Install\
  \ system data files and security updates`旁边的复选框。\n\n## 术语表\n\n*   **Antispam**（反垃圾邮件）：能够选择并丢弃包含恶意软件、广告等的电子邮件的程序和过滤器。\n\
  *   **Backup**（备份）：复制设备中包含的数据。\n*   **Banner**（横幅广告）：包含简单广告消息的框，但如果显示，可能包含感染计算机的恶意文件。\n\
  *   **Botnet**（僵尸网络）：一组感染了恶意软件的计算机，允许破解者利用它们来解密密码。\n*   **Cloud**（云）：一组允许通过互联网连接使用计算机资源的技术。\n\
  *   **USB Controller**（USB 控制器）：一种可以将计算机与通过 USB 端口连接的外部设备连接起来的设备。\n*   **Cracker**（破解者）：利用计算机技能进行犯罪目的的坏黑客。\n\
  *   **Data Recovery**（数据恢复）：为恢复损坏设备中包含的数据而实施的一组程序。\n*   **Exploit**（漏洞利用）：指从系统漏洞出发，控制信息系统所要执行的一组操作。\n\
  *   **Framework**（框架）：与操作系统集成并使所有通用功能可供应用程序使用的一组软件模块。\n*   **Hacker**（黑客）：拥有计算机技能，允许其进入系统并检查其漏洞的人。通常，在发现系统漏洞后，黑客会将其发现告知程序员并建议解决方案。\n\
  *   **Honeypot**（蜜罐）：作为陷阱捕捉试图闯入计算机系统者的网站或计算机网络。\n*   **Hotspot**（热点）：Wi-Fi 网络的接入点。\n\
  *   **HTML**：用于赋予网站文本形状的语言。\n*   **IP address**（IP 地址）：表示连接到网络的每个设备的识别号码。此数字代码可以是\
  \ 32 位（IPv4）或 128 位（IPv6）。\n*   **Javascript**：用于在网络上创建交互式应用程序的编程语言。\n*   **Keygen**（密钥生成器）：用于安装盗版软件的序列号生成器。破解者经常使用这些序列号生成器来传播病毒。实际上，Keygen\
  \ 会请求访问计算机文件的权限。一旦获得权限，Keygen 可以修改它想要的任何内容。\n*   **Keylogger**（键盘记录器）：一种安装在计算机上、记录键盘上输入的所有内容并将其传输给破解者的病毒类型。\n\
  *   **Malware**（恶意软件）：任何能够非法进入计算机并损害其运行的软件类型。\n*   **P2P**（点对点）：一组允许您使用各种协议非法交换受保护文件的服务。\n\
  *   **Patch**（补丁）：包含更新相关软件代码的软件包。更新可让您修复错误、消除漏洞并优化性能。\n*   **Payload**（有效载荷）：实施破解者犯罪意图的恶意软件部分。这发生在漏洞利用控制计算机之后。\n\
  *   **Plug-in**（插件）：更复杂软件的一个模块，添加最初未预见的功能。\n*   **Ransomware**（勒索软件）：最危险的恶意软件。它能够加密计算机上的所有数据，并以加密密钥为交换要求赎金。最后，它能够感染连接到网络的所有计算机。\n\
  *   **Registry**（注册表）：包含调节操作系统运行设置的 Windows 文件。\n*   **Spyware**（间谍软件）：一种未经用户同意收集其在线活动信息的软件类型。\n\
  *   **Social Engineering**（社会工程学）：破解者通过操纵人们的善意来获取信息所使用的一组技术。\n*   **Trojan Horse**（特洛伊木马）：伪装成数据文件的一种恶意软件类型。其特点是必须获得权限才能安装自身。\n\
  *   **Virus**（病毒）：一种能够自我安装并通过感染其他计算机进行自我复制的恶意软件类型。\n*   **VPN**（虚拟专用网络）：一种允许您像使用专用网络一样使用互联网的服务。\n\
  *   **Wi-Fi**：位于短距离内的计算机和外围设备之间的无线通信技术。在路由器的帮助下，本地 Wi-Fi 网络能够连接到互联网。\n*   **Worm**（蠕虫）：一种能够自我复制的特定类别的恶意软件。\n\
  *   **Zero day**（零日漏洞）：由破解者发现但程序员未知的软件安全缺陷。\n\n\n\n\n\n## 结论\n\n互联网并没有将任何事物变成“虚拟”的，而只是为每个人提供了一个非常多功能的工具，该工具在成本和便利性方面具有无可争议的优势，从而便利了我们的现实生活。如今，通过连接互联网的电脑或智能手机，我们可以做以前需要亲自到场才能完成的事情（例如转账、排长队缴费、预订假期等）。互联网就是现实生活，正如在现实生活中一样，我们必须采取预防措施。在现实生活中，我们知道要提防小偷，不轻信陌生人。即使在互联网上，我们也必须采取同样的预防措施：使用复杂的密码，不点击模棱两可的横幅广告，不打开未知邮件，不点击可疑链接。本书旨在提供所有可能的预防措施，以安全地浏览互联网。\n\
