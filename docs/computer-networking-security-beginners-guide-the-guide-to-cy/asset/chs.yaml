- "# 计算机网络安全初学者指南：自顶向下学习网络安全防御行动以保护自身免受网络危害指南\n\n\n\n\n\n\n\n\n\n\n\n\n## 简介\n\n恭喜您下载了《计算机网络安全》一书。您选择这本书来了解更多关于计算机安全的知识，这让我倍感欣慰。计算机网络是我们工作、学习甚至家庭生活的重要组成部分，这也是为什么许多人试图弄清楚如何保护他们的专业和个人信息。随着您继续阅读，您将发现保护我们的计算机/智能手机免受可能的攻击和信息窃取的重要性。互联网不仅仅是虚拟的，我们每天在网络上所做的事情（银行转账、购物等……）是真实的。\n\
  \n信息安全可以定义为确保用户身份验证以及以数字方式管理或交付的信息和服务保密性的一系列措施。这种做法旨在保护计算机、服务器和移动设备免受危险攻击。它也被称为电子信息安全。\n\
  \n网络安全旨在应对的威胁具有三重性质：\n\n1.  **网络犯罪**，即个人攻击系统以获取经济利益。\n2.  **网络战**，涉及为政治目的收集信息。\n\
  3.  **网络恐怖主义**，旨在破坏计算机系统以引发恐慌或恐惧。\n\n破解者控制计算机最常用的方法包括：\n\n-   **病毒和蠕虫**能够自我复制并破坏文件或系统。\n\
  -   **间谍软件和特洛伊木马**常被用于隐秘地收集数据。\n\n普通用户通常通过不需要的电子邮件附件，或通过下载看似合法实则携带恶意软件的程序，接触到恶意代码。\n\
  \n## 第 1 章：密码的创建、使用和管理\n\n### 如何使用密码\n\n密码或访问密钥，在计算机科学或密码学中，是一串用于访问计算机资源（互联网连接、电子邮件、网络、计算机、ATM、程序等……）的字母数字字符和特殊符号系列。通过密码和用户名，可以验证一个人的身份，从而允许访问各种类型的\
  \ IT 服务。密码也用于执行加密操作。\n\n使用密码保护我们的计算机数据至关重要，可避免外部人员（黑客）未经授权访问而导致的不愉快后果。后果可能从令人恼火的骚扰发展到真正的企业灾难。例如，如果同事发现了您的密码，并想利用您的电脑破坏公司，一切责任都在您，因为您有责任保管好您的密码。如果您的电子邮件密码被发现，入侵者可能会利用您的电子邮件地址发送计算机病毒，或以您的名义采取犯罪行动。案发后很难确定犯罪操作的责任人，因为他可以在任何地方操作，无需物理接触您的计算机。\n\
  \n一项统计调查显示，美国最常用的密码如下：\n\n| 123456 | password | 12345 | 12345678 | qwerty |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 123456789 | 1234 | baseball | 1234567 | abc123\
  \ |\n| 111111 | iloveyou | sunshine | princes | admin |\n| welcome | 666666 | football\
  \ | 123123 | monkey |\n| 654321 | !@#$%^&* | charlie | aa123456 | donald |\n\n\n\
  \n\n\n#### 密码安全指南\n\n##### 破解者的威胁\n\n破解者，即怀有非法意图的黑客，可以在几天内利用特殊程序发现您的简单密码，这些程序能够自动尝试每秒多达一千个密码。因此，如果破解者决定发现您的密码，您将毫无防备。如果破解者决定发起“暴力破解攻击”并利用技术规范，可以大幅缩短访问时间。\n\
  \n##### 选择密码\n\n选择密码时，重要的是避免常用单词，并确保选择不常见的术语。避免使用专有名词（子女、父母、配偶的名字）、球队名称、城市、电影、艺术家等。\n\
  \n选择强密码最有效的方法是使用自动生成器，创建不寻常且因此唯一的字符序列。这些密码通常难以记忆，但生成器**拥有一套存储生成密码的系统**。在这种情况下，您只需选择一个密码来激活生成器，然后访问其他密码。\n\
  \n为了选择唯一需要记住的主密码，我们推荐两种方法：\n\n1.  选择 4/5 个单词并将它们合并。它们不应是著名的句子，而是拼接在一起且不构成逻辑含义的不同单词。\n\
  2.  选择一首歌或诗的诗句，并仅使用每个单词的少数字母。\n\n您可以组合使用多种技术。\n\n##### 密码创建工具\n\n###### F-Secure\n\
  \n**F-Secure** 是一款可以为各类服务生成复杂密码、存储密码并将其与电子邮件地址、PIN 码、信用卡凭证和活期账户关联的程序。该程序使用 `AES-256`\
  \ 加密系统。此外，主加密密钥通过复杂算法从您的主密码获取，使得破解者几乎无法检测到它。\n\n###### LastPass 及其安装\n\n**LastPass**\
  \ 可通过浏览器官方扩展方便地使用，能在几秒钟内创建强健安全的密码。从官方网站下载软件后，按照浏览器提供的程序安装扩展。在浏览器中安装扩展后，您需要创建一个帐户以使用该服务。输入您的电子邮件地址，勾选“我同意\
  \ LastPass 条款和隐私政策”，然后点击“创建帐户”按钮。填写表单，输入您的主密码，然后点击“下一步”完成注册。\n\n注册后，您将能够生成自己的密码。点击\
  \ LastPass 图标并选择“生成安全密码”。设置各种选项，如密码长度、大小写字母、数字、特殊字符或避免歧义字符。创建密码后，点击“使用密码”按钮。LastPass\
  \ 会同步与同一帐户关联的所有设备上的密码，并提供移动应用程序。\n\n###### 其他软件或应用程序\n\n您还可以使用以下软件或应用程序：\n\n*  \
  \ 1Password\n*   PassworG\n*   Random Password Generator\n*   Password Creator\n\
  *   Norton Password Generator\n*   RoboForm Password Generator\n\n\n\n\n\n#### 如何管理您的密码\n\
  \n建议为您使用的每个服务（电子邮件账户、网上银行、信用卡等）使用不同的密码。如果您对所有服务使用单一密码，您将更加脆弱。事实上，您注册的任何普通网站（例如 Badoo）的安全系统，绝对比您银行的安全系统更脆弱。因此，如果您使用相同的密码，破解者更有可能渗透知名在线服务的用户数据库，然后尝试进入更具吸引力的服务。在过去几年中，破解者窃取了\
  \ LinkedIn、Yahoo、Adobe 数百万用户的访问数据，并在暗网上出售这些凭证。有一些网站允许您检查您的数据是否属于黑客攻击事件中被盗的数据。您可以用来检查密码是否在某次黑客攻击中被盗的网站是\
  \ `haveinbeenpwned.com`。如果破解者认为通过登录您的账户能赚大钱，他就会投入时间和资源来寻找您的密码。他可以调动“僵尸网络”工作，即受恶意软件控制的计算机网络，生成数千个密码，直到找到正确的那个。这样，最短的密码（8/10\
  \ 个字符）可以在几个月内被破解。\n\n为了使您的计算机系统更安全，您应该更改密码。这样，假设的窃贼将始终面临一扇新的待开启的门。有必要确定密码更改的频率。更改过于稀疏会给破解者留出破解密码的时间。更改密码过于频繁则会让您面临忘记密码的风险。公司通常采用的密码更改周期是每三个月一次。一切取决于要保护的数据。如果是简单的会计数据或类似数据，更改频率可以大于三个月。相反，如果数据对犯罪更具吸引力（商业机密、银行账户访问权限），那么更换周期肯定会小于三个月。请勿在公司使用与个人资料相同的密码。一种非常有效的对策是双因素认证。双因素认证通过两重控制来授予访问权限。接收我们访问请求的服务器可以向我们的手机发送一个代码，该代码需在第二级验证中输入，以确认访问并确认是我们本人在键盘前操作。\n\
  \n##### 如何保管您的密码\n\n通常，公司员工在存储用于访问其终端的密码方面存在完全的疏忽。密码经常被抄写在便利贴上，充其量贴在电脑键盘下。理论上，员工只应在公司办公室活动，但也可能有其他人进入，如信使、维修空调系统故障的技术人员、清洁工等。“社会工程学”常被黑客用来窃取访问公司网络的密码。黑客可以潜入办公室，例如伪装成信使，并使用访问数据。黑客使用的另一种“社会工程学”技术是通过虚假电话或发送虚假电子邮件获取信息。通常，这些技术在大型组织中不会引起特别的怀疑。事实上，在这种情况下，恶意黑客可以冒充前来核对账目的银行职员。未妥善保管的密码不仅可能被恶意外部人员窃取，也可能被想要破坏公司的同事窃取。在这种情况下，如果恶意同事从您的电脑对公司造成破坏，责任在于您，因为您没有尽一切可能防止他人知晓您的访问数据。将所有密码保存在一个文件中也是一种保管不善，因为恶意人员可以在您不知情的情况下将上述文件复制到\
  \ U 盘中，并在稍后从容地搜索所需内容。\n\n存储密码的最佳解决方案是使用密码管理工具，例如 `Key F-Secure Key`。它基于通过复杂的数学函数加密主密码，并通过输入随机数据添加基于\
  \ 256 位哈希的认证代码。\n\n###### 其他工具\n\n####### Google Smart Lock（Google 智能锁）\n\n此工具允许您将密码保存到云端，并在各种设备上同步。这样，无论您何时通过\
  \ Google Chrome 访问互联网或从 Android 设备访问，都可以使用您的密码。要激活 Smart Lock，向右滑动并进入“安全性”以在“设置”中激活“密码”，然后进入\
  \ Google 和 Google 账户。向下滚动至“访问其他网站的方式”并点击“已保存的密码”。在这里，您可以决定是启用还是停用“询问是否保存密码”。如果您想在电脑上设置此选项，请转到您的个人资料并点击“密码”。现在决定是启用还是停用“询问是否保存密码”选项。\n\
  \n####### iCloud Keyring（iCloud 钥匙串）\n\n这是一个 Apple 工具。要激活，请前往“设置”，点击您的姓名并按“iCloud”。在下一个屏幕上点击“钥匙串”并打开开关。如果您想在\
  \ Mac 上设置钥匙串，请前往左上角并点击 Apple 标志。选择“系统偏好设置”选项并勾选“钥匙串”复选框。\n\n## 第 2 章 如何防范受感染邮件的风险\n\
  \n邮件控制是每位员工每天早上到办公室时采取的首批行动之一。最严重的威胁可能通过电子邮件到达我们的计算机。通常，您的电子邮件提供商会清除垃圾邮件，如广告和包含恶意软件的邮件。然而，偶尔会有一些漏网之鱼到达我们的计算机。\n\
  \n### 警惕网络钓鱼\n\n网络钓鱼是破解者用来攻击计算机系统最古老、最有效的技术之一。打开一封包含病毒的电子邮件可能会给您的业务造成重大损害。例如，可能会收到一封带有\
  \ PDF 附件的电子邮件；邮件正文可能提示打开附件以获取更多详情。打开附件后，硬盘开始运转，几秒钟内我们所有的文档都被加密，并出现一个屏幕警告我们发生了事故，并要求支付赎金才能取回文档。与此同时，病毒到达服务器并感染整个公司网络。这种类型的病毒称为勒索软件。上述描述是可能出现的最坏情况。其他邮件可能包含各种类型的特洛伊木马病毒，如键盘记录器。这种病毒会记录您在计算机键盘上输入的所有内容，并将其传输给黑客，黑客随即掌握账户和密码。并非所有受感染的邮件都包含附件，但它们可能包含链接，点击链接的同时即会激活病毒。\n\
  \n### 预防警示\n\n首先要做的是拥有一个良好的反垃圾邮件系统。这通常由您的电子邮件提供商免费提供。如果您想提高安全性，提供商会提供具有高级安全功能的付费反垃圾邮件系统。以下是一些简单的建议，以防可疑邮件到达：\n\
  \n*   请勿回复那些欺骗性地看似来自银行的邮件，其中要求您确认凭证。银行知道您的数据，如需确认，他们会邀请您亲自前往银行。\n*   将光标移至发件人地址上方，您将看到地址发生变化。它不再是已知银行或快递公司的地址。\n\
  *   将光标悬停在可疑邮件内包含的链接上，将向您显示该网址并非邮件中显示的地址。\n*   对任何声称您中奖或继承遗产的邮件保持警惕。这听起来荒谬，但这类邮件仍在发送，说明仍有人上当受骗。\n\
  \n\n\n\n### 保护工具\n\n在大多数情况下，保持操作系统提供的保护处于激活状态即可：Microsoft 操作系统上的“Windows Defender”杀毒软件、Mac\
  \ 上的“Gatekeeper”保护系统以及 Android 上的“Google Play Protect”。一个优秀的电子邮件保护系统是 F-Secure 提供的“E-mail\
  \ and Server Security”，它能保护您公司的服务器、电子邮件和云系统。该工具基于行为分析以及白名单和黑名单的使用。安装杀毒软件可以保障您电子邮件的安全。您还可以添加反恶意软件以获得更高级别的安全性。这些程序可以定期运行，以检测任何隐藏良好和/或对杀毒软件不可见的运行中威胁。最强大有效的反恶意软件之一是\
  \ Malwarebytes。您可以在互联网上免费找到它。\n\n## 第 3 章：避免从不可靠来源下载软件或应用\n\n下载和安装盗版软件是法律禁止的，但考虑到海量的软件下载量，这并不是一个有效的威慑。最初，此类软件包含在\
  \ P2P 网络中（著名的 Torrent 和 eMule）。如今，我们也能在文件共享网络中找到它们（Rapidshare 的继任者）。通常，病毒隐藏在用于生成假序列号以激活主程序的程序中。当启动“Keygen”（注册机）时，它会请求更改系统的权限。此时，它可以为所欲为。它可以安装键盘记录器，甚至最坏的情况下安装勒索软件。即使安装合法软件也无法保护您免受风险。并非所有从\
  \ Play Store 下载的应用都是看起来那样。特别是著名应用和游戏的克隆版本往往是陷阱。这些克隆版本往往在官方 App 发布之前就已在平台上架。最脆弱的设备是智能手机和平板电脑等移动设备。特别是使用\
  \ Android 的设备，因为官方商店的审核不够严格，Google 往往只能在事后移除受感染的应用。您可以使用一些在线服务（如 VirusTotal）检查从商店下载的程序的可靠性，VirusTotal\
  \ 是一款在线杀毒软件，使用 68 种不同的杀毒引擎来检查任何类型的文件（或互联网地址）。所有这些完全免费，且无需任何注册。WOT 是一项在线服务，允许您通过用户的意见和评价来分析网站的可靠性。对于企业网络，理想的解决方案是实施关于各设备软件的精确企业策略。此外，建议用户账户不应为“管理员”类型。管理员权限保留给\
  \ IT 人员。我们始终建议部署“Client Security”和“Protection service for Business”等杀毒软件，它们能够扫描文件并提供更高的安全性，阻止试图执行危险操作的软件。\n\
  \n## 第 4 章：进行更新\n\n编写软件或 App 是一个如此庞大的过程，以至于几乎不可能预测所有可能的缺陷。所有软件或操作系统在编程时都包含关键点，即缺陷，黑客可利用这些缺陷潜入他人的计算机或计算机网络，并在用户毫不知情的情况下安装恶意程序。在计算机世界中，存在着一场持续的战争：一方是试图发现软件、操作系统和\
  \ App 中关键点并加以利用（通常用于非法目的）的黑客；另一方是测试程序以改进它们、检测缺陷并将其报告给制造商，以便制造商通过消除关键点来更新软件的白帽黑客。当黑客发现一个“关键点”，在行话中称为“零日漏洞”时，他会尝试准备一个“漏洞利用代码”。漏洞利用代码允许您进入\
  \ PC，成为其管理员。一旦进入 PC，黑客可以读取数据、修改或删除文件、窃取凭证或安装键盘记录器。在首批感染扩散后，软件制造商会通过消除关键点并更新程序来进行干预。随后，更新提醒会发送给所有用户。这就是执行更新的重要性。\n\
  \n### 更新类型\n\n一般来说，有两类更新。\n\n#### 主要更新\n\n这些更新用于提高性能并引入新功能。在进行此类更新之前，您需要检查计算机的兼容性。换句话说，可能需要更强大的功能。例如，如果操作系统受到此类更新的影响，可能需要更强大的内存或处理器。在这种情况下，如果涉及公司网络，您首先需要分析设备，然后在必要时进行更新。事实上，如果设备不达标，更新可能导致网络故障。\n\
  \n#### 次要更新\n\n这些更新用于修复错误、漏洞或安全漏洞。这些更新无预警发布，必须立即安装。在 App 中，通常会为这些类型的更新激活自动可用性通知。在版本更新的情况下，软件序列号的个位数增加。例如，Windows\
  \ 7 升级到 Windows 8。在从前一个版本进行有限更改或改进的情况下，软件序列号的第一位小数增加。例如，Windows 8 升级到 Windows 8.1。如果更新涉及安全性，则第二位小数增加。例如，Windows\
  \ 8.1.2。如果安全管理涉及计算机网络，我们建议使用集中管理系统，例如包含在 F-Secure 的“Protection Service for Business”和“Premium\
  \ Business Suite”中的“Software Updater”。\n\n### 智能手机\n\n升级智能手机意味着保护自己免受所有可能的危险。不仅是\
  \ Google，智能手机制造商也在不断更新其设备。此外，原因始终相同：更新修复漏洞并防范新威胁。没有理由拒绝下载更新。如果您认为官方市场上的应用完全安全，那您就错了。App\
  \ 可能包含受感染的链接，由于我们的粗心大意，我们甚至会下载来自未知来源的应用并打开链接。\n\n\n\n## 第 5 章 在互联网上安全冲浪\n\n在互联网上冲浪会增加受恶意软件影响的可能性，仅仅是访问一个网站就可能中招。最危险的网站并非人们通常能想到的那些，比如在线游戏网站或色情网站。事实上，这些网站非常警惕，会确保其用户免受恶意软件等潜在威胁的侵害。恶意软件更有可能在航空公司、报纸、食品或保险网站上感染。这些网站因产生高流量而更吸引破解者。通常，破解者利用\
  \ Javascript 攻击浏览器或其插件的漏洞，以下载并安装其恶意软件。破解者使用的另一种方法是通过视频编解码器下载受感染的文件，没有它就无法观看某部电影。在某些情况下，恶意软件可能包含在广告横幅中。最后，破解者可以创建真正的网站陷阱，通过\
  \ Facebook 上的消息引诱坏人访问这些网站，但使用缩短的地址，让你无法了解将要去往何处。一旦破解者成功安装恶意软件，他就可以为所欲为。\n\n为了防御网络上的潜在攻击，你需要保持浏览器和插件为最新版本。如果插件仅按需激活，效果会更好。为了阻止\
  \ Javascript 程序和广告横幅的执行，建议在前一种情况下安装“脚本拦截器”，在后一种情况下安装“广告拦截器”。我们可以编制一个“白名单”，并将所有我们信任的网站加入其中。优秀的杀毒软件结合优秀的反恶意软件，可保证对传入文件的保护和对互联网流量的控制，以阻止访问危险网站。客户端安全软件可以控制并阻止对网站的访问，并防范可执行文件。\n\
  \n### 免费 Wi-Fi 网络\n\n破解者青睐的狩猎场是免费 Wi-Fi 网络，即无需付费的网络。免费 Wi-Fi 网络易于接入，且不存在被识别的风险。事实上，在这些网络中，破解者可以实施中间人攻击。这包括让受害者以为自己已连接到\
  \ Wi-Fi，而实际上其数据流经过了破解者的计算机。反过来，破解者在检查并记录这些数据后，将其传递给热点，使偶然连接的人误以为自己直接连接到了 Wi-Fi 网络。最坏的情况是热点处于破解者的控制之下，甚至是由其创建以攻击所有连接者。在这种情况下，破解者控制着路由器。这种陷阱被称为“蜜罐”。也存在能够拦截尝试连接免费\
  \ Wi-Fi 网络设备的硬件设备，它们通过伪装成目标网络来响应连接尝试。最后，也有可能已感染恶意软件的计算机连接到网络，并试图将病毒传播给所有其他连接的终端。\n\
  \n#### 如何保护自己\n\n首先，建议在连接公共 Wi-Fi 网络时，避免进行敏感数据传输或访问各类服务的操作。使用 VPN 系统是在通过公共网络连接时确保安全的好工具。VPN\
  \ 会加密连接期间交换的数据，使其对破解者不可用。此外，VPN 也应用于 Https 连接，因为这些连接很容易被拦截和解码。其他应采取的预防措施包括：\n\n\
  *   禁用文件共享\n*   禁用自动连接免费 Wi-Fi 网络，这通常在各种终端上默认开启。\n\n所有这些预防措施都是必要的，因为无法知道公共 Wi-Fi\
  \ 网络是否安全。\n\n### 使用防火墙监控活动\n\n防火墙是一种保护系统，可以是软件或硬件，它通过保护两个不同的网络来防止未经授权的访问。操作系统 Windows\
  \ 和 macOS 都集成了一个默认激活的防火墙（如有必要可将其停用）。但也可以下载第三方防火墙，如所谓的 `Windows Firewall Control`（适用于\
  \ Windows）和 `Little Snitch`（适用于 macOS），它们扩展了计算机上默认防火墙的功能，并允许你更轻松地监控网络活动。\n\n## 第\
  \ 6 章 如何防范外部设备威胁\n\n外部组件，如 USB 记忆棒和光盘，易受感染。多年前，微软插入了一个名为 `Autorun.inf` 的文件，以简化非专家安装软件的过程。因此，当你插入外部组件时，Windows\
  \ 会检查它是否包含 `Autorun.inf` 文件并运行它。因此，想要进入计算机的破解者可以将受感染的文件放入自动运行中，并将其隐藏在 USB 记忆棒上。一旦\
  \ USB 记忆棒插入计算机，它就会启动自动运行中的文件并感染计算机。平板电脑和智能手机也可能通过 USB 端口被感染。当你通过将智能手机连接到 USB 端口进行充电时，例如在机场、酒店或公共场所，病毒可能会感染你的设备。理论上，这些\
  \ USB 端口应仅连接到简单的电源变压器。据报道，这些简单的 USB 充电端口背后竟是真正的控制器，能够连接设备并窃取其中的数据。此类行动需要组织严密的破解者团伙。\n\
  \n为防止可能的 USB 感染，建议通过更改“注册表”设置来禁用计算机上的自动运行。如果你无法处理“注册表”，应咨询专家。F-Secure 的“mobile security”软件旨在防止来自\
  \ USB 记忆棒的感染。为防止智能手机遭受此类感染，我们建议使用“USB 保护套”。即一种 USB 延长线，其中的数据连接线已被移除，仅保留电源线。这样就不存在发起数据连接的可能性。\n\
  \n### 硬件设备被盗或丢失时\n\n为了防止用于访问敏感数据的计算机被物理窃取，建议设置强密码以访问系统。然而，这并不能完全保护我们免受计算机上敏感数据被盗的威胁。因为蓄意作恶者可以将硬盘从计算机上拆下，并安装在另一台计算机上。这样他们就有可能访问数据。建议使用全盘加密。这样，即使将硬盘安装在另一台计算机上，没有访问密钥也无法读取数据。副作用是如果计算机故障，你可能无法恢复数据。这就是为什么始终建议备份数据。为增加安全性，你可以安装特定软件，在发生盗窃或丢失时擦除所有数据。为了保护智能手机免遭盗窃或丢失，已安装软件可将设备位置和使用者照片通过电子邮件发送给你。此外，在\
  \ Apple 和 Android 设备上，都引入了诸如“查找我的智能手机”之类的应用程序，允许你定位其位置。\n\n\n\n## 第 7 章 如何删除病毒\n\
  \n如果您怀疑病毒已感染您的电脑或手机，但不知道如何验证以及如何解决问题，应采取的措施如下。\n\n### 从智能手机中清除病毒\n\n#### Android\
  \ 系统\n\nAndroid 设备无需安装杀毒软件，因为系统设置会自动阻止安装可能损害设备的未知应用程序。要检查此设置，请进入“设置”，然后点击“安全”，查看“未知来源”选项是否已禁用。如果您使用的是\
  \ Android 8 或更高版本，请进入“设置” > “应用和通知” > “高级” > “特殊应用访问权限” > “安装未知应用”。确保列表中的所有应用均标记为“不允许”。如果不是，请将开关从左向右拨动。\n\
  \n我建议您不要对 Android 设备进行 Root 操作以获取所有权限。这种做法会使您的 Android 设备变得脆弱，并暴露于严重危险之中，因为它常被用来绕过某些\
  \ App 的保护系统。\n\nGoogle Play Protect 是面向所有 Android 系统的免费服务，它会定期扫描 Play Store 中的所有应用以及您设备上已安装的应用，以验证其安全性。要验证该服务是否处于激活状态，请打开\
  \ Play Store，从左上角的菜单中选择“Play 保护机制”。确保其旁边的“扫描设备以查找安全威胁”复选框处于激活状态。您还可以勾选下一项“提升有害应用检测功能”，以增强安全性。\n\
  \n为了识别并解决智能手机可能存在的问题，Android 允许您进入安全模式。没有标准的统一操作流程，以下提供两种方法。\n\n**方法 1**：长按 Android\
  \ 设备的物理电源/锁屏按钮。当选项出现时，长按“关机”选项，直到出现“重启进入安全模式”选项，然后点击“确定”。\n\n**方法 2**：在开机或关机时，一旦设备制造商的\
  \ Logo 出现，立即长按音量减键（或 Home 键）。屏幕将显示“安全模式”。\n\n进入安全模式后，检查已安装应用列表，看是否有您认为未自行安装的应用。请小心甄别，因为一些您不认识的应用可能对操作系统至关重要。如果您没有\
  \ Root 权限，反而更好，因为您将无法卸载系统应用。\n\n如果您找到了恶意应用，点击它，然后点击卸载。如果无法移除某个 App，它很可能拥有设备管理权限，因此您必须先撤销该权限，然后再卸载。要移除此权限，请进入“设置”\
  \ > “安全” > “设备管理器”。找到恶意 App 后，取消勾选。\n\n要退出安全模式，请重启手机。\n\n如果无法按照上述步骤删除病毒，建议执行恢复出厂设置。恢复出厂设置可将手机恢复到购买时的状态。购买后安装的所有数据和应用程序将被删除。因此，备份设备文件以防止数据丢失非常重要。\n\
  \n要开始此过程，请进入“设置” > “备份和重置” > “恢复出厂设置”。如果您使用的是 Android 8，请进入“设置” > “系统” > “重置选项”\
  \ > “擦除所有数据”。\n\n#### iOS 系统\n\nApple 设备的操作系统很安全，感染病毒的风险很低。一切取决于您如何使用设备；越狱和从非官方来源安装\
  \ App 始终是不推荐的。越狱允许您绕过 Apple 对其 iOS 操作系统施加的限制。这种做法会使系统变得脆弱，并可能导致设备损坏，进而引发恶意软件的安装。\n\
  \n### 从电脑中删除病毒\n\n我们假设防御潜在攻击的最佳方式是预防。安装一款优秀的杀毒软件绝对是最好的预防措施。\n\nBitdefender Free\
