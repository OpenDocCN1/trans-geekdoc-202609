  \ checking this box I agree to the license agreement lists above”（勾选此框即表示我同意上述许可协议），然后点击“Continue”（继续）。病毒库将更新，要开始扫描，请先点击“Scan\
  \ now”（立即扫描），然后点击“Start”（开始）。\n\n另一款自启动杀毒软件是 Kaspersky Rescue Disk。从官网下载程序，点击“Download\
  \ & Info”（下载与信息），然后点击“Distribute”（分发）按钮。选择将杀毒软件下载到 CD 还是 USB 闪存盘。\n\n重启系统并从新创建的介质启动。当出现“Press\
  \ any key to enter the menu”（按任意键进入菜单）提示时，按任意键。Kaspersky 将自动启动。按数字键 1 并选择“Kaspersky\
