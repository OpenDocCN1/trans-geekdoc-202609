- raw: 'Chapter 7 How to delete viruses If you suspect that, a virus has infected
    your computer or phone but do not know how to verify it and possibly how to solve
    the problem, the actions to be taken are as follows. Eliminate the virus from
    your smartphone Android System Android devices do not need to have an antivirus,
    as there are settings that automatically block the installation of unknown applications
    that could harm the device. To check this, go to "settings", then click on "security"
    and check if the entry "unknown sources is disabled. If you have an Android 8
    or later, go to "Settings" then "Apps and Notifications" > "Advanced" > "Special
    App Access" > "Install Unknown Apps". Make sure that all apps in the list are
    marked "not allowed". If not, move the stick from left to right. I recommend that
    you do not root your Android device to get all the permissions. This practice
    can make your Android device vulnerable and expose it to serious dangers, as it
    is often used to circumvent the protection systems of some Apps. Google Play Protect
    is a free system for all Android systems, which regularly scans all the Apps in
    the Play Store and those installed on your device to verify their security. To
    verify that this service is active, go to the Play Store and from the menu at
    the top left, select Play Protector. Make sure that the "Search for security threats"
    box next to it is active. You can also select the next item, "Enhance malicious
    app detection", for added security. To identify and resolve the possible problem
    with your smartphone, Android allows you to enter Safe Mode. There is no standard
    procedure. Here are two procedures. Procedure 1 : Press and hold the physical
    power off/lock screen button on your Android device. When the options appear,
    hold down the "power off" option until the "restart in safe mode" option appears
    and press “OK”. Procedure 2 : When turning your mobile phone on or off, as soon
    as the manufacturer''s logo for your device appears, press and hold the Volume
    Down key (or Home key). “Safe Mode" will appear. When in Safe Mode, check the
    list of installed Apps and see if there are any that, you think you have not installed.
    Be careful because some apps you do not know may be useful for your operating
    system. If you do not have root permissions, it is better because you will not
    be able to uninstall system Apps. If you have found the malicious app, tap on
    it and then tap on uninstall. If you cannot remove an App, it probably has permission
    to administer your device, so you will first have to remove that permission and
    then uninstall it. To remove this permission, go to Settings > Security > Device
    Administrators. Once you have found the malicious App, remove the check mark.
    To exit Safe Mode, restart your phone. If you cannot delete the virus following
    the procedure described above, it is advisable to do a factory reset . The factory
    reset allows you to reset your phone to the state it was in when you purchased
    it. All data and applications installed after purchase will be deleted. Therefore,
    it is important that you make a backup of your device''s files to avoid losing
    anything. To start this process, go to Settings > Backup & Restore > Factory Data
    Recovery. If you have an Android 8 go to Settings > System > Reset Options > Delete
    all data. iOS System The operating system of Apple devices is safe and the risk
    of getting into a virus is low. It all depends on how you use your device; jailbreaking
    and installing Apps from unofficial sources is always not recommended. The jailbreak
    allows you to circumvent the restrictions imposed by Apple on its iOS operating
    system. This practice makes the system vulnerable and can cause damage to the
    device, leading to the installation of malware. Deleting the virus from your computer
    We assume that the best way to defend ourselves against possible attacks is through
    prevention. Installing a good anti-virus is definitely the best prevention action.
    Bitdefender Free is a free anti-virus that defends against all aspects of the
    system: files opened and downloaded from the Internet, communications on instant
    messaging services, items downloaded via P2P and much more. After downloading
    the installation package called "Antivirus\_Free\_Edition.exe", click the Yes
    button and select the language from the drop-down menu. To get the free version
    of Bitdefender Free you need to register on MyBitdefender, otherwise the copy
    of the program will expire after 30 days of trial. To start a full PC scan, right-click
    on the newly installed program icon and select "full scan". At the end of the
    procedure, you will be shown a report that indicates all the files scanned, any
    threats detected and the actions taken. You can also scan individual files by
    dragging them directly onto the Bitdefender icon. Another good free antivirus
    is Avira free antivirus. It has the same functions as Bitdefender, but is heavier.
    Using "self-start" antivirus In some cases, it is not possible to delete the virus
    from the computer with the use of classic antivirus. It is necessary to intervene
    in a forced manner. That is, it is necessary to intervene before the computer,
    during the start-up phase, starts the operating system. This is possible with
    ad hoc tools, downloaded and installed on a CD or USB stick. The first tool I
    recommend is Bitdefender Recuse CD . This tool requires an active connection to
    the Internet, so it can update the list of viruses and detect the latest threats
    To download the program go to the website and click on "To create a Bitdefender
    Rescue CD on a CD/DVD you need the ISO image which care be downloaded from here".
    Then choose whether to burn the antivirus to a CD/DVD or copy it to a USB stick.
    If you decide to burn it to a CD, then use any burning program. If you decide
    to copy it to a USB stick, then you can download the free software provided by
    Bitdefender itself. Click on "Stickifier executable". Select the ISO image of
    the antivirus and then the stick to copy the files to. To scan your computer,
    insert the USB stick (or CD). When the antivirus screen appears, click Start the
    Bitdefender Rescue CD to start Bitdefender Rescue CD. If the screen does not appear,
    then you will need to make a change to your BIOS. Enter the BIOS and set the CD/DVD
    drive or USB port as the primary boot drive. In the window with the software license
    agreement check next to "By checking this box I agree to the license agreement
    lists above" and click on "Continue". The list of viruses will be updated and
    to start a scan click first on "Scan now" and then on "Star". Another self-starting
    antivirus Kaspersky Rescue Disk. Download the program from the website, then click
    on “Download & Info”, and then on the "Distribute" button. Choose whether to download
    the antivirus to CD or USB stick. Restart the system and boot from the newly created
    media. Press any key when the message "Press any key to enter the menu" appears.
    Kaspersky will start automatically. Press button 1 and select "Kaspersky Rescue
    Disk Graphic Mode". Click on "My update center" and then "Start" to start updating
    your antivirus definitions. Before starting a full system scan, you must make
    sure that you have selected the items "Disk boot sectors", "Hidden startup objects"
    and "C" on the Object scans tab. Press the "Start objects scan" button to start
    the scan. There are some types of Malware or Adware that escape antivirus control.
    Usually, these are less aggressive threats than viruses, but still annoying. For
    example, those who install toolbars and redirect navigation to sites full of advertising
    messages. To combat these types of malware, it is advisable to install free software
    such as "Adwcleaner" and "Malwarebytes". How to manually delete viruses from your
    computer To manually delete viruses from your computer, you need to have an advanced
    knowledge of your computer and the operation of your operating system. In fact,
    you need to identify the infected file and delete it or uninstall the program
    that contains that file. If this operation is not done in an exact manner, it
    can compromise the operation of the computer and in the worst case, it will be
    necessary to start a formatting of the computer with the consequence of losing
    all the data present in it. On Pc If you are using Windows, the first thing to
    do is to create a restore point, to be used if the stability of the operating
    system is compromised. Simultaneously press the Ctrl+Shift+Esc keys and start
    the "Task Manager". Click on "more details" and then on the "processes" tab. Check
    the list of running processes and if you notice something that you do not like,
    note it down and search on Google. If you find that, the running process is a
    virus, right-click on the suspicious process and select "Open file path". Connect
    to the VirusTotal website and drag the suspicious file to the website pane. VirusTotal
    will analyze the suspicious file and if you are infected, you must delete it.
    To delete the infected file, go to the "Processes" tab, right-click on the name
    of the infected file, select "End Processes Tree / End Activity Tree" from the
    menu and confirm by clicking the "Yes" button. If the infected file belongs to
    a program, go to Control Panel > Programs and Features > Uninstall a program.
    Select the program and click on "Uninstall". You can also delete the infected
    file by right-clicking on the file and holding down the "Shift" key select "delete"
    and press "Yes". This procedure may affect the functioning of the operating system
    or leave virus residues invisible. Once you have manually deleted the virus, restart
    your computer and check the programs that start when you start Windows. If you
    find the program again, you must remove it from the startup list. If you have
    Windows 10, go to "Task Manager", click on "Start" and locate the file, right
