    # Protective tools


    In most cases, it is sufficient to leave the protections offered by the operating
    system active: the antivirus "Windows Defender" on Microsoft operating systems,
    the protection system "Gatekeeper" on Macs and "Google Play Protect" on Android.
    A good email protection system is the one offered by F-Secure, "E-mail and Server
    Security", which protects your company''s servers, email and cloud systems. This
    tool is based on behavior analysis and the use of whitelists and blacklists. Installing
    an anti-virus can guarantee the security of your emails. You can also add anti-malware
    for a higher level of security. These programs can be run on an occasional basis
    to detect any running threats that are well hidden and/or invisible to the antivirus.
    One of the most powerful and effective malware around is Malwarebyte. You can
    find it free on the Internet.


    # Chapter 3: Avoid downloading Software or Apps from unreliable sources


    Downloading and installing pirated software is prohibited by law, but this is
    not a good deterrent given the huge amount of software that is downloaded. Initially,
    such software was contained in the P2P circuits (the famous Torrent and eMule).
    Today we also find them in file sharing circuits (heirs of Rapidshare). Generally,
    the virus is hidden in the program that generates the fake serial number to activate
    the main program. When the "keygen" is started, it asks permission to make changes
    to the system. At this point, it can do whatever it wants. It can install a Keylogger
    and at worst a Ransomware. Even the installation of legal software does not protect
    you from the risks. Not all Apps downloaded from Play store are what they seem.
    In particular, clones of famous apps and games are often traps. These clones are
    often available on the platform even before the official App came out. The most
    vulnerable devices are mobile ones like smartphones and tablets. In particular,
    those that use Android because the controls of the official store are not very
    thorough and often Google removes only afterwards the infected Apps. You can check
    the reliability of programs that are downloaded from the store with some online
    services such as VirusTotal, the online antivirus that uses 68 different antivirus
    engines to check any type of file (or Internet address). All this is completely
    free and without any registration. WOT is an online service that allows you to
    analyze the reliability of websites through the opinions and reviews of users.
    In the case of a corporate network, the ideal solution is the implementation of
    precise corporate policies regarding the software on the various devices. In addition,
    it is advisable that user accounts are not "administrator" type. Position riserve
    for IT staff. We always recommend the presence of an anti-virus such as "Client
    Security" and "Protection service for Business", able to scan files and provide
    greater security, blocking software that tries to perform dangerous operations.


    # Chapter 4: Making updates


    Programming a software or an App is such a broad process that it is almost impossible
    to predict all possible defects. All software or operating systems when they are
    programmed contain critical points, i.e. defects, which can be exploited by crackers
    to fit into other people''s computers or computer networks and install malicious
    programs without the user noticing anything. In the computer world, there is a
    continuous war that sees on one hand crackers trying to discover the critical
    points in software, operated systems and Apps, to exploit them to their advantage,
    usually illegal. On the other hand, there are hackers who test programs to improve
    them, detect defects and communicate them to manufacturers so that they can update
    software by eliminating critical points. When a cracker discovers a "critical
    point", which in jargon is called "zero day", he tries to prepare an "exploit".
    The exploit allows you to enter the PC, becoming its administrator. Once inside
    the PC, the cracker can read the data, modify or delete the files, steal credentials
    or install a keylogger. After the first infections have spread, the software manufacturer
    intervenes by eliminating the critical points and updating the program. Subsequently,
    the update alert is sent to all users. Here is the importance of performing updates.


    ## Types of updates


    In general, there are two types of updates.


    ### Major update


    These updates are used to improve performance and introduce new features. Before
    making such updates, you will need to check your computer for compatibility. In
    other words, features that are more powerful may be required. For example, if
    the operating system is affected by such updates, a more powerful memory or processor
    may be required. In this case, if this involves a company network, you will first
    need to analyze the devices and then update them if necessary. In fact, if the
    devices are not adequate, the update could cause a malfunction of the network.


    ### Minor update


    These updates are used to fix errors, bugs or vulnerabilities. These updates are
    issued without notice and must be installed immediately. In Apps, automatic availability
    notifications are usually activated for these types of updates. In the case of
    version updates, one unit increases the serial number of the software. Example,
    Windows 7 to Windows 8. In the case of limited changes or improvements from the
    previous version, the first decimal place of the serial number is increased. Example,
    Windows 8 to Windows 8.1. If the update concerns security, then the second decimal
    place is increased. Example, Windows 8.1.2. If the security management concerns
    a computer network, we recommend using a centralized management system such as
    "Software Updater" included in "Protection Service for Business" and "Premium
    Business Suite" of F-Secure.


    ## Smartphone


    Upgrading your smartphone means protecting yourself from all possible dangers.
    Not only Google, but also smartphone manufacturers are constantly updating their
    devices. Moreover, the reason is always the same: Updates correct leaks and protect
    against new threats. There is no reason to refuse to download updates. If you
    think that the applications in the official markets are completely safe, you are
    wrong. Apps can contain infected links and because of our superficiality, we download
    apps and open links even if they come from unknown sources.

