    \ is real.\n\nInformation Security can be defined as the set of measures to ensure\
    \ user authentication and confidentiality of information and services managed\
    \ or delivered digitally. This practice consists in defending computers, servers\
    \ and mobile devices from dangerous attacks. It is also called electronic information\
    \ security.\n\nThe threats that cyber security seeks to counter are threefold\
    \ in nature:\n\n1.  **Cybercrime**, when individuals attack systems for financial\
    \ gain.\n2.  **Cyber war**, which concerns the collection of information for political\
    \ purposes.\n3.  **Cyber-terrorism**, intent on undermining computer systems to\
    \ unleash panic or terror.\n\nThe most common methods used by crackers to control\
    \ computers are:\n\n-   **Viruses and worms** can self-replicate and damage files\
    \ or systems.\n-   **Spyware and Trojans** are often used to stealthily collect\
    \ data.\n\nThe average user generally comes into contact with malicious codes\
    \ through unwanted email attachments or through downloading programs that appear\
    \ legitimate but actually carry malware with them.\n\n## Chapter 1: Creation,\
    \ use and management of passwords\n\n### How to use passwords\n\nThe password\
    \ or access key is, in computer science or cryptography, a series of alphanumeric\
    \ characters and special signs used to access a computer resource (Internet connection,\
    \ email, networks, computers, ATMs, programs, etc...). With a password and user\
    \ name, the identity of a person is verified, allowing access to various types\
    \ of IT services. The password is also used to carry out encryption operations.\n\
    \nProtecting our computer data with a password is of paramount importance to avoid\
    \ unpleasant consequences that could result from unauthorized access by external\
    \ individuals (hackers). The consequences can range from unpleasant annoyances\
    \ to real corporate disasters. For example, if a co-worker discovers your password\
    \ and wants to cause damage to the company using your PC, the blame for everything\
    \ will be yours because you have a duty to keep your passwords. If your email\
    \ password is discovered, the intruder may use your email address to send computer\
    \ viruses or take criminal action on your behalf. It is very difficult to identify\
