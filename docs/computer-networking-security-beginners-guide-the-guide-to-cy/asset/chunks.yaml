    \ [Conclusion](#part0013.xhtml) \n\nIntroduction Congratulations on downloading\
    \ your copy of Computer Networking Security. It is a source of joy for me that\
    \ you have chosen this book to learn more about computer security. Computer networking\
    \ is an important part of our lives at work, at school and even at home, which\
    \ is why many people try to figure out how to protect their professional and personal\
    \ information. As you continue to read, you will discover the importance of protecting\
    \ our computers/smartphones from possible attacks and information theft. The Internet\
    \ is not only virtual but what we do every day on the network (bank transfers,\
    \ purchases etc. ...) is real Information Security can be defined as the set of\
    \ measures to ensure user authentication and confidentiality of information and\
    \ services managed or delivered digitally. This practice consists in defending\
    \ computers, servers and mobile devices from dangerous attacks. It is also called\
    \ electronic information security. The threats that cyber security seeks to counter\
    \ are threefold in nature: \n\n1.  Cybercrime, when individuals attack systems\
    \ for financial gain. \n\n2.  Cyber war, which concerns the collection of information\
    \ for political purposes. \n\n3.  Cyber-terrorism, intent on undermining computer\
    \ systems to unleash panic or terror. \n\nThe most common methods used by crackers\
    \ to control computers are: \n\n*   Viruses and worms can self-replicate and damage\
    \ files or systems \n\n*   Spyware and Trojans are often used to stealthily collect\
    \ data. The average user generally comes into contact with malicious codes through\
    \ unwanted email attachments or through downloading programs that appear legitimate\
    \ but actually carry malware with them. \n\nChapter 1 Creation, use and management\
    \ of passwords How to use passwords The password or access key is, in computer\
    \ science or cryptography, a series of alphanumeric characters and special signs\
    \ used to access a computer resource (Internet connection, email, networks, computers,\
    \ ATMs, programs, etc...). With a password and user name, the identity of a person\
    \ is verified, allowing access to various types of IT services. The password is\
    \ also used to carry out encryption operations. Protecting our computer data with\
    \ a password is of paramount importance to avoid unpleasant consequences that\
    \ could result from unauthorized access by external individuals (hackers). The\
    \ consequences can range from unpleasant annoyances to real corporate disasters.\
    \ For example, if a co-worker discovers your password and wants to cause damage\
    \ to the company using your PC, the blame for everything will be yours because\
    \ you have a duty to keep your passwords. If your email password is discovered,\
    \ the intruder may use your email address to send computer viruses or take criminal\
    \ action on your behalf. It is very difficult to identify the person responsible\
    \ for the criminal operations after the act has been carried out, because he can\
    \ operate from anywhere without the need for physical access to your computer.\
    \ A statistical survey has shown that the most commonly used passwords in the\
    \ USA are as follows: \n\n| 123456  || password  || 12345  || 12345678  || qwerty\
    \  |\n\n| --- | --- | --- | --- | --- |\n\n| 123456789  || 1234  || baseball \
    \ || 1234567  || abc123  |\n\n| 111111  || iloveyou  || sunshine  || princes \
    \ || admin  |\n\n| welcome  || 666666  || football  || 123123  || monkey  |\n\n\
    | 654321  || !@#$%^&\\*  || charlie  || aa123456  || donald  |"
