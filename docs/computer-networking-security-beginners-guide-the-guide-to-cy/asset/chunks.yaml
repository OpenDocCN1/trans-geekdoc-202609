    # 如何管理您的密码


    建议为您使用的每个服务（电子邮件账户、网上银行、信用卡等）使用不同的密码。如果您对所有服务使用单一密码，您将更加脆弱。事实上，您注册的任何普通网站（例如 Badoo）的安全系统，绝对比您银行的安全系统更脆弱。因此，如果您使用相同的密码，破解者更有可能渗透知名在线服务的用户数据库，然后尝试进入更具吸引力的服务。在过去几年中，破解者窃取了
    LinkedIn、Yahoo、Adobe 数百万用户的访问数据，并在暗网上出售这些凭证。有一些网站允许您检查您的数据是否属于黑客攻击事件中被盗的数据。您可以用来检查密码是否在某次黑客攻击中被盗的网站是
    `haveinbeenpwned.com`。如果破解者认为通过登录您的账户能赚大钱，他就会投入时间和资源来寻找您的密码。他可以调动“僵尸网络”工作，即受恶意软件控制的计算机网络，生成数千个密码，直到找到正确的那个。这样，最短的密码（8/10
    个字符）可以在几个月内被破解。


    为了使您的计算机系统更安全，您应该更改密码。这样，假设的窃贼将始终面临一扇新的待开启的门。有必要确定密码更改的频率。更改过于稀疏会给破解者留出破解密码的时间。更改密码过于频繁则会让您面临忘记密码的风险。公司通常采用的密码更改周期是每三个月一次。一切取决于要保护的数据。如果是简单的会计数据或类似数据，更改频率可以大于三个月。相反，如果数据对犯罪更具吸引力（商业机密、银行账户访问权限），那么更换周期肯定会小于三个月。请勿在公司使用与个人资料相同的密码。一种非常有效的对策是双因素认证。双因素认证通过两重控制来授予访问权限。接收我们访问请求的服务器可以向我们的手机发送一个代码，该代码需在第二级验证中输入，以确认访问并确认是我们本人在键盘前操作。


    ## 如何保管您的密码


    通常，公司员工在存储用于访问其终端的密码方面存在完全的疏忽。密码经常被抄写在便利贴上，充其量贴在电脑键盘下。理论上，员工只应在公司办公室活动，但也可能有其他人进入，如信使、维修空调系统故障的技术人员、清洁工等。“社会工程学”常被黑客用来窃取访问公司网络的密码。黑客可以潜入办公室，例如伪装成信使，并使用访问数据。黑客使用的另一种“社会工程学”技术是通过虚假电话或发送虚假电子邮件获取信息。通常，这些技术在大型组织中不会引起特别的怀疑。事实上，在这种情况下，恶意黑客可以冒充前来核对账目的银行职员。未妥善保管的密码不仅可能被恶意外部人员窃取，也可能被想要破坏公司的同事窃取。在这种情况下，如果恶意同事从您的电脑对公司造成破坏，责任在于您，因为您没有尽一切可能防止他人知晓您的访问数据。将所有密码保存在一个文件中也是一种保管不善，因为恶意人员可以在您不知情的情况下将上述文件复制到
    U 盘中，并在稍后从容地搜索所需内容。


    存储密码的最佳解决方案是使用密码管理工具，例如 `Key F-Secure Key`。它基于通过复杂的数学函数加密主密码，并通过输入随机数据添加基于 256
    位哈希的认证代码。


    ### 其他工具


    #### Google Smart Lock（Google 智能锁）


    此工具允许您将密码保存到云端，并在各种设备上同步。这样，无论您何时通过 Google Chrome 访问互联网或从 Android 设备访问，都可以使用您的密码。要激活
    Smart Lock，向右滑动并进入“安全性”以在“设置”中激活“密码”，然后进入 Google 和 Google 账户。向下滚动至“访问其他网站的方式”并点击“已保存的密码”。在这里，您可以决定是启用还是停用“询问是否保存密码”。如果您想在电脑上设置此选项，请转到您的个人资料并点击“密码”。现在决定是启用还是停用“询问是否保存密码”选项。


    #### iCloud Keyring（iCloud 钥匙串）


    这是一个 Apple 工具。要激活，请前往“设置”，点击您的姓名并按“iCloud”。在下一个屏幕上点击“钥匙串”并打开开关。如果您想在 Mac 上设置钥匙串，请前往左上角并点击
    Apple 标志。选择“系统偏好设置”选项并勾选“钥匙串”复选框。


    # 第 2 章 如何防范受感染邮件的风险


    邮件控制是每位员工每天早上到办公室时采取的首批行动之一。最严重的威胁可能通过电子邮件到达我们的计算机。通常，您的电子邮件提供商会清除垃圾邮件，如广告和包含恶意软件的邮件。然而，偶尔会有一些漏网之鱼到达我们的计算机。


    ## 警惕网络钓鱼


    网络钓鱼是破解者用来攻击计算机系统最古老、最有效的技术之一。打开一封包含病毒的电子邮件可能会给您的业务造成重大损害。例如，可能会收到一封带有 PDF 附件的电子邮件；邮件正文可能提示打开附件以获取更多详情。打开附件后，硬盘开始运转，几秒钟内我们所有的文档都被加密，并出现一个屏幕警告我们发生了事故，并要求支付赎金才能取回文档。与此同时，病毒到达服务器并感染整个公司网络。这种类型的病毒称为勒索软件。上述描述是可能出现的最坏情况。其他邮件可能包含各种类型的特洛伊木马病毒，如键盘记录器。这种病毒会记录您在计算机键盘上输入的所有内容，并将其传输给黑客，黑客随即掌握账户和密码。并非所有受感染的邮件都包含附件，但它们可能包含链接，点击链接的同时即会激活病毒。


    ## 预防警示


    首先要做的是拥有一个良好的反垃圾邮件系统。这通常由您的电子邮件提供商免费提供。如果您想提高安全性，提供商会提供具有高级安全功能的付费反垃圾邮件系统。以下是一些简单的建议，以防可疑邮件到达：


    *   请勿回复那些欺骗性地看似来自银行的邮件，其中要求您确认凭证。银行知道您的数据，如需确认，他们会邀请您亲自前往银行。

    *   将光标移至发件人地址上方，您将看到地址发生变化。它不再是已知银行或快递公司的地址。

    *   将光标悬停在可疑邮件内包含的链接上，将向您显示该网址并非邮件中显示的地址。

    *   对任何声称您中奖或继承遗产的邮件保持警惕。这听起来荒谬，但这类邮件仍在发送，说明仍有人上当受骗。


