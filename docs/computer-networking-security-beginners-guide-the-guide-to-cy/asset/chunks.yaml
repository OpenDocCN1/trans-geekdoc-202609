  trans: "\n\n## 结论\n\n互联网并没有将任何事物变成“虚拟”的，而只是为每个人提供了一个非常多功能的工具，该工具在成本和便利性方面具有无可争议的优势，从而便利了我们的现实生活。如今，通过连接互联网的电脑或智能手机，我们可以做以前需要亲自到场才能完成的事情（例如转账、排长队缴费、预订假期等）。互联网就是现实生活，正如在现实生活中一样，我们必须采取预防措施。在现实生活中，我们知道要提防小偷，不轻信陌生人。即使在互联网上，我们也必须采取同样的预防措施：使用复杂的密码，不点击模棱两可的横幅广告，不打开未知邮件，不点击可疑链接。本书旨在提供所有可能的预防措施，以安全地浏览互联网。\n\
