    \nCongratulations on downloading your copy of Computer Networking Security. It\
    \ is a source of joy for me that you have chosen this book to learn more about\
    \ computer security. Computer networking is an important part of our lives at\
    \ work, at school and even at home, which is why many people try to figure out\
