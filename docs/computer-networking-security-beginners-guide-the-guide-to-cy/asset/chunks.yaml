- raw: "Conclusion The Internet has not turned anything into \"virtual\", but has\
    \ simply provided everyone with a very versatile tool that has facilitated our\
    \ real life with undoubted advantages in terms of cost and convenience. Today,\
    \ with our computer or smartphone connected to the internet we can do things that\
    \ previously required our physical presence (such as making a transfer, making\
    \ endless queues to pay bills, booking a vacation, etc.). The Internet is real\
    \ life and as in real life, we must take precautions. In real life, we know that\
    \ we have to be careful of thieves and not to trust strangers. Even on the internet,\
    \ we must take the same precautions; use complex passwords, do not click on equivocal\
    \ banners, do not open unknown emails, do not click on suspicious links. This\
    \ book aims to provide all possible precautions to surf the Internet safely. \n\
    \nOther books: “Hacking Beginners Guide “ “The Basic Guide to Information Network\
    \ Security and the Basic Concepts of Kali Linux.”  Kindle Edition © Copyright\
    \ 2019 by Kevin Morgan “Computer Networking Beginners Guide” “The Complete Basic\
    \ Guide to Master Network Security, Computer Architecture, Wireless Technology,\
    \ and Communications Systems Including Cisco, CCNA and the OSI Model.”  Kindle\
    \ Edition © Copyright 2019 by Kevin Morgan"
