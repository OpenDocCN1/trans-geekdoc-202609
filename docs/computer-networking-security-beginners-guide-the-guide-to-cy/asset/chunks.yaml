    \n© 版权所有 2019 Kevin Morgan\n\n## 目录\n\n- 简介\n- 第 1 章\n  - 密码的创建、使用和管理\n  - 如何使用密码\n\
    \  - 选择您的密码\n  - 密码创建工具\n  - 如何管理您的密码\n  - 如何保管您的密码\n- 第 2 章\n  - 如何防范受感染邮件的风险\n\
    \  - 警惕网络钓鱼\n  - 预防警示\n  - 防护工具\n- 第 3 章\n  - 避免从不可靠来源下载软件或应用程序\n- 第 4 章\n  -\
    \ 进行更新\n  - 更新类型\n- 第 5 章\n  - 安全上网\n  - 免费 Wi-Fi 网络\n  - 如何保护自己\n  - 使用防火墙监控活动\n\
    - 第 6 章\n  - 如何防范外部设备\n  - 硬件设备被盗或丢失时\n- 第 7 章\n  - 如何删除病毒\n  - 清除智能手机中的病毒\n \
    \ - 清除计算机中的病毒\n  - 如何手动删除计算机中的病毒\n- 词汇表\n- 结语\n\n## 简介\n\n恭喜您下载了《计算机网络安全》一书。您选择这本书来了解更多关于计算机安全的知识，这让我倍感欣慰。计算机网络是我们工作、学习甚至家庭生活的重要组成部分，这也是为什么许多人试图弄清楚如何保护他们的专业和个人信息。随着您继续阅读，您将发现保护我们的计算机/智能手机免受可能的攻击和信息窃取的重要性。互联网不仅仅是虚拟的，我们每天在网络上所做的事情（银行转账、购物等……）是真实的。\n\
    \n信息安全可以定义为确保用户身份验证以及以数字方式管理或交付的信息和服务保密性的一系列措施。这种做法旨在保护计算机、服务器和移动设备免受危险攻击。它也被称为电子信息安全。\n\
    \n网络安全旨在应对的威胁具有三重性质：\n\n1.  **网络犯罪**，即个人攻击系统以获取经济利益。\n2.  **网络战**，涉及为政治目的收集信息。\n\
    3.  **网络恐怖主义**，旨在破坏计算机系统以引发恐慌或恐惧。\n\n破解者控制计算机最常用的方法包括：\n\n-   **病毒和蠕虫**能够自我复制并破坏文件或系统。\n\
    -   **间谍软件和特洛伊木马**常被用于隐秘地收集数据。\n\n普通用户通常通过不需要的电子邮件附件，或通过下载看似合法实则携带恶意软件的程序，接触到恶意代码。\n\
    \n## 第 1 章：密码的创建、使用和管理\n\n### 如何使用密码\n\n密码或访问密钥，在计算机科学或密码学中，是一串用于访问计算机资源（互联网连接、电子邮件、网络、计算机、ATM、程序等……）的字母数字字符和特殊符号系列。通过密码和用户名，可以验证一个人的身份，从而允许访问各种类型的\
    \ IT 服务。密码也用于执行加密操作。\n\n使用密码保护我们的计算机数据至关重要，可避免外部人员（黑客）未经授权访问而导致的不愉快后果。后果可能从令人恼火的骚扰发展到真正的企业灾难。例如，如果同事发现了您的密码，并想利用您的电脑破坏公司，一切责任都在您，因为您有责任保管好您的密码。如果您的电子邮件密码被发现，入侵者可能会利用您的电子邮件地址发送计算机病毒，或以您的名义采取犯罪行动。案发后很难确定犯罪操作的责任人，因为他可以在任何地方操作，无需物理接触您的计算机。\n\
    \n一项统计调查显示，美国最常用的密码如下：\n\n| 123456 | password | 12345 | 12345678 | qwerty |\n\
    | :--- | :--- | :--- | :--- | :--- |\n| 123456789 | 1234 | baseball | 1234567\
    \ | abc123 |\n| 111111 | iloveyou | sunshine | princes | admin |\n| welcome |\
    \ 666666 | football | 123123 | monkey |\n| 654321 | !@#$%^&* | charlie | aa123456\
    \ | donald |\n\n"
