- raw: "Chapter 5 Safely surfing on Internet Surfing the Internet increases the likelihood\
    \ of being affected by malware simply by visiting a website. The most dangerous\
    \ sites are not those that everyone can think of, such as online gaming sites\
    \ or porn sites. In fact, these sites are very vigilant in ensuring the safety\
    \ of their users from possible threats such as malware. Malware is more likely\
    \ to be contracted on airline, newspaper, food or insurance sites. These sites\
    \ are more attractive to crackers because they generate high traffic. Typically,\
    \ the cracker attacks the vulnerabilities of browsers or their plug-ins with Javascript\
    \ to download and install their malware. Another method used by crackers is to\
    \ download an infected file by passing it through a video codec, without which\
    \ it is not possible to see a certain movie. In some cases, malware can be contained\
    \ within advertising banners. Finally, crackers can create real web sites traps,\
    \ by conveying the bad guys with messages on Facebook inviting them to visit these\
    \ web sites, but using an abbreviated address that does not allow you to understand\
    \ where you are going. Once the cracker can get the malware installed, he is free\
    \ to do what he wants. To defend yourself from possible attacks on the web you\
    \ need to keep your browser and plug-ins up to date. Better still if the plug-ins\
    \ are activated only on demand. To block the execution of Javascript programs\
    \ and advertising banners, it is advisable to install a \"scriptblocker\" in the\
    \ first case, and an \"adblocker\" in the second case. We can compile a \"whitelist\"\
    \ and insert all the sites we trust. A good antivirus combined with a good anti-malware\
    \ guarantee the protection of incoming files and the control of internet traffic\
    \ to block access to dangerous sites. Client Security can control and block access\
    \ to websites and protect against executable files. Free Wi-Fi networks The hunting\
    \ grounds preferred by crackers are free Wi-Fi networks, i.e. not for a fee. Free\
    \ Wi-Fi networks are easy to access and there is no risk of being identified.\
    \ In fact, in these networks, the cracker can perform a MitM attack \"Man in the\
    \ middle\".  It consists of letting the bad person think that he is connected\
    \ to the Wi-Fi, while in reality its data flow passes through the cracker's computer.\
    \ In turn, the cracker, after checking and recording this data, passes it on to\
    \ the hotspot, making the person who happened to be connected directly to the\
    \ Wi-Fi network believe he is. The worst case is when the hotspot is under the\
    \ control of the cracker or even was created by it to attack all those who will\
    \ connect. In this case, the cracker has control of the router. A trap of this\
    \ kind is called a \"honeypot\". There are also hardware devices capable of intercepting\
    \ devices that try to connect to the free Wi-Fi network, and that respond to the\
    \ connection attempt by pretending to be the desired network. Finally, it is possible\
    \ that they will connect to the network computers already infected with malware\
    \ and will try to transmit the virus to all other connected terminals. How to\
    \ protect oneself As a first step, it is advisable to avoid, while connected to\
    \ a public Wi-Fi network, operations of transfer of sensitive data or information\
    \ access to various services. The use of a VPN system can be a good tool to ensure\
    \ security when connecting via public networks. The VPN encrypts the data exchanged\
    \ during the connection, making it unusable by crackers. In addition, the VPN\
    \ should also be used for Https connections because these can be easily intercepted\
