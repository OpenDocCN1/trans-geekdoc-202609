    # Chapter 5 Safely surfing on Internet


    Surfing the Internet increases the likelihood of being affected by malware simply
    by visiting a website. The most dangerous sites are not those that everyone can
    think of, such as online gaming sites or porn sites. In fact, these sites are
    very vigilant in ensuring the safety of their users from possible threats such
    as malware. Malware is more likely to be contracted on airline, newspaper, food
    or insurance sites. These sites are more attractive to crackers because they generate
    high traffic. Typically, the cracker attacks the vulnerabilities of browsers or
    their plug-ins with Javascript to download and install their malware. Another
    method used by crackers is to download an infected file by passing it through
    a video codec, without which it is not possible to see a certain movie. In some
    cases, malware can be contained within advertising banners. Finally, crackers
    can create real web sites traps, by conveying the bad guys with messages on Facebook
    inviting them to visit these web sites, but using an abbreviated address that
    does not allow you to understand where you are going. Once the cracker can get
    the malware installed, he is free to do what he wants.


    To defend yourself from possible attacks on the web you need to keep your browser
    and plug-ins up to date. Better still if the plug-ins are activated only on demand.
    To block the execution of Javascript programs and advertising banners, it is advisable
    to install a "scriptblocker" in the first case, and an "adblocker" in the second
    case. We can compile a "whitelist" and insert all the sites we trust. A good antivirus
    combined with a good anti-malware guarantee the protection of incoming files and
    the control of internet traffic to block access to dangerous sites. Client Security
    can control and block access to websites and protect against executable files.


    ## Free Wi-Fi networks


    The hunting grounds preferred by crackers are free Wi-Fi networks, i.e. not for
    a fee. Free Wi-Fi networks are easy to access and there is no risk of being identified.
    In fact, in these networks, the cracker can perform a MitM attack "Man in the
    middle". It consists of letting the bad person think that he is connected to the
    Wi-Fi, while in reality its data flow passes through the cracker''s computer.
    In turn, the cracker, after checking and recording this data, passes it on to
    the hotspot, making the person who happened to be connected directly to the Wi-Fi
    network believe he is. The worst case is when the hotspot is under the control
    of the cracker or even was created by it to attack all those who will connect.
    In this case, the cracker has control of the router. A trap of this kind is called
    a "honeypot". There are also hardware devices capable of intercepting devices
    that try to connect to the free Wi-Fi network, and that respond to the connection
    attempt by pretending to be the desired network. Finally, it is possible that
    they will connect to the network computers already infected with malware and will
    try to transmit the virus to all other connected terminals.


    ### How to protect oneself


    As a first step, it is advisable to avoid, while connected to a public Wi-Fi network,
    operations of transfer of sensitive data or information access to various services.
    The use of a VPN system can be a good tool to ensure security when connecting
    via public networks. The VPN encrypts the data exchanged during the connection,
    making it unusable by crackers. In addition, the VPN should also be used for Https
    connections because these can be easily intercepted and decoded. Other preventive
    actions to be taken are:


    *   Disabling file sharing

    *   Disable the automatic connection to free Wi-Fi networks, which is usually
    set as active on the various terminals.


    All these prevention measures are necessary because there is no way of knowing
    whether a public Wi-Fi network is secure or not.


    ## Use a firewall to monitor activity


    A firewall is a protection system, software or hardware, that prevents unauthorized
    access by protecting two different networks. The operating systems, Windows and
    macOS have integrated a firewall that is active by default (and that can be deactivated
    if necessary). But it is also possible to download third-party firewalls such
    as the so-called `Windows Firewall Control` (for Windows) and `Little Snitch`
    (for macOS), which extend the functionality of the default firewall on your computer
    and allow you to monitor network activities even more easily.


    # Chapter 6 How to protect oneself from external devices


    External components, such as USB sticks and CDs, are susceptible to infection.
    Years ago, Microsoft inserted a file called `Autorun.inf` to simplify the installation
    of software by non-experts. Therefore, when you insert a component external to
    your computer, Windows checks if it contains the `Autorun.inf` file and runs it.
    Therefore, the cracker who wants to enter a computer can put the infected file
    in autorun and hide it on a USB stick. As soon as the USB stick is inserted into
    the computer, it starts the file in autorun and infects the computer. Tablets
    and smartphones can also be infected through USB ports. When you charge your smartphone
    by connecting it to a USB port, for example in airports, hotels or public places,
    a virus may infect you. In theory, these USB ports should be connected to simple
    power transformers. There have been reports that behind these simple USB power
    ports were real controllers that could connect to the device and steal data from
    it. Such an operation requires well-organized groups of crackers.


    To prevent a possible USB infection, it is advisable to disable autorun on your
    computer by changing the settings on the "registry". If you are not able to handle
    the "registry", you should consult an expert. F-Secure''s "security for mobile"
    software is designed to prevent infections from USB sticks. To prevent such infections
    on smartphones, we recommend using a "USB condom". That is, a USB extension cable
    in which the cables for the data connection have been removed, leaving only those
    for power supply. In this way, there is no possibility of starting a data connection.


    ## In case of theft or loss of the hardware device


    To protect yourself against the physical theft of the computer used to access
    our sensitive data, it is advisable to enter robust passwords to access the system.
    However, this does not completely protect us from the theft of our sensitive data
    on your computer. Because the intentional evil can detach the hard disk from the
    computer and install it on another computer. This way you will have the possibility
    to access the data. It is advisable to use full disk encryption. This way, even
    if you install the hard disk on another computer, the data will be unreadable
    without the access key. The side effect would be not to recover your data if your
    computer fails. That is why it is always advisable to back up your data. To increase
    security, you can enter specific software that will erase all data in the event
    of theft or loss. To protect your smartphone from theft or loss, software has
    been installed to email you the location of your device and a photo of who is
    using it. In addition, on both Apple and Android, applications have been introduced
    such as "find my smartphone," that allows you to locate where it is.

    '
