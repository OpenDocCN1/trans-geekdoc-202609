    # How to manage your passwords


    The advice is to use a different password for each service you use (email account,
    home banking, credit cards, etc.). If you use a single password for all services,
    you will be more vulnerable. In fact, the security system of any normal website
    (ex. Badoo) where you register is definitely more vulnerable than the security
    system of your bank. So if you use the same password, it is more likely that a
    cracker will be able to penetrate the database of users of the well-known online
    service and can then try to get into more appetizing services. In the past years,
    crackers have stolen the access data of millions of users on LinkedIn, Yahoo,
    Adobe, selling those credentials on the dark web. There are websites that allow
    you to check if your data are part of those stolen in hacking episodes. A website
    that you can use to check if your passwords have been stolen in some hacking episode
    is `haveinbeenpwned.com`. If a cracker thinks he can make a lot of money by logging
    into your account, he can invest time and resources in finding your password.
    He can put a "botnet" to work, that is a network of computers under his control
    thanks to a malware, which generates thousands of passwords, until he finds the
    right one. In this way, the shortest passwords (8/10 words) can be decrypted in
    a few months.


    To make your computer system more secure, you should change your passwords. This
    way, a new door to open will always be presented to the hypothetical thief. It
    is necessary to determine how often passwords should be changed. A too thin change
    gives the cracker time to decode the password. Changing passwords too often exposes
    the cracker to the risk of forgetting them. The password change used by companies
    is usually every three months. Everything depends on the data to be protected.
    If it is simple accounting data or similar, the frequency of change can be greater
    than three months. If, on the other hand, the data is more attractive to crime
    (trade secrets, access to bank accounts), then the exchange rate will certainly
    be less than three months. Do not use the same passwords in your company as for
    personal profiles. A very valid and effective countermeasure is the double level
    authentication. Two-factor authentication performs two controls to give access.
    The server that receives our access request can send us on the mobile phone a
    code to be entered in the second level of verification to confirm access and confirm
    that it is we at the keyboard.


    ## How to keep your passwords


    Generally, there is a total superficiality on the part of employees of a company
    in storing passwords to access their terminal. Often passwords are transcribed
    into a post-it attacked at best under the computer keyboard. In theory, employees
    should only frequent a company’s offices, but it is possible for other people
    to come in as messengers, technicians to repair failures in air conditioning systems
    or cleaners, or more. “Social engineering" is often used by hackers to steal passwords
    to access the company network. Hackers can sneak into offices, for example as
    messengers, and use the access data. Another "social engineering" technique used
    by hackers is to obtain information by making a false phone call or sending false
    e-mails. In general, these techniques do not arouse particular suspicion in the
    case of large organizations. In fact, in these cases, the malevolent hacker can
    pass himself off as a bank employee who has to do accounting checks. Passwords
    that are not kept properly can be stolen not only by malevolent external individuals,
    but also by your colleagues who want to create damage to the company. Also in
    this case, if the malicious colleague creates damage to the company from your
    computer, the responsibility is yours because you have not done everything possible
    to prevent other people from becoming aware of your access data. Also keeping
    all your passwords in a file is a lack of custody because the evil intent can
    copy without your knowledge the above file in a USB and search for what it needs
    in a second momentum and calmly.


    The best solution to store passwords is to use a password manager tool such as
    `Key F-Secure Key`. It is based on encrypting the master password by subjecting
    it to a complex mathematical function and adding an authentication code based
    on 256-bit hashes, by entering causal data.


    ### Other tools


    #### Google Smart Lock


    This tool allows you to save passwords to the cloud and synchronize them on various
    devices. In this way, it allows you to use your passwords whenever you access
    the Internet via Google Chrome or from your Android device. To activate Smart
    Lock, scroll to the right and go to "Security" to activate "vases" on "settings",
    then on Google and Google accounts. Scroll to "how to access other sites" and
    click on "saved passwords". Here you can decide whether to enable or disable "Ask
    to save passwords". If you want to set this option on your PC, go to your profile
    and click on "password". Now decide whether to enable or disable the "Ask to save
    passwords" option.


    #### iCloud Keyring


    This is an Apple tool. To activate, go to "Settings" and click on your name and
    press "iCloud". On the next screen click on "keychain" and turn the switch on.
    If you want to set up the Keychain on your Mac, go to the top left and click on
    the Apple logo. Select the "System Preferences" option and check the "Keychain"
    box.


    # Chapter 2 How to prevent risks from infected emails


    Email control is one of the first actions that each employee takes every morning
    when they arrive at the office. The worst threats can reach our computer from
    e-mail. Usually, your email provider eliminates junk mail (spam), such as advertisements
    and emails that contain malware. However, every now and then some of them manage
    to get to our computer.


    ## Attention to phishing


    Phishing is one of the oldest and most effective techniques used by crackers to
    hack computer systems. Opening an email that contains a virus can cause significant
    damage to your business. For example, an email with a PDF attachment may arrive;
    perhaps in the email trap it is indicated to open the attachment for more details.
    When the attachment is opened, the hard disk is moved and in a few seconds all
    our documents are encrypted and a screen appears that warns us of the incident
    and that to get our documents back we have to pay a ransom. In the meantime, the
    virus reaches the server and infects the entire company network. This type of
    virus is called Ransomware. This described is the worst-case scenario that can
    arise. Other emails may contain Trojan viruses of various types such as keyloggers.
    This virus records everything you type on your computer''s keyboard and transmits
    it to hackers who then come into possession of accounts and passwords. Not all
    infected emails contain attachments, but they may contain links that activate
    the virus at the same time as you click on the link.


    ## Warnings to prevention


    The first thing to do is to have a good anti-spam system. This is usually offered
    free of charge by your e-mail provider. In case you want to improve your security,
    providers offer paid anti-spam systems that have advanced security features. Let
    us give you some simple tips in case suspicious emails arrive:


    *   Do not respond to emails that deceptively seem to come from banks, where you
    are asked to confirm your credentials. The banks know your data and in case of
    confirmation, they will invite you to go physically to the bank.

    *   Move the cursor over the sender''s address and you will see that the address
    changes. It is no longer the address of the known bank or courier.

    *   Passing the cursor over the link contained within the suspicious email will
    show you that the web address is not what appears in the email.

    *   Be wary of any emails that tell you they are winners or heirs of anything.
    It sounds absurd, but these types of emails are still being sent so it means that
    someone is still falling for them.

    '
