  trans: "\n\n# 第 6 章 Python 中的流程控制\n\n## 4. 其他流程控制工具除了刚才介绍的 `while` 语句，Python 还利用了在不同语言中常见的流控制语句，但也有某些不同。\n\
    \n### 4.1. if 语句\n最突出的语句类型是 `if` 声明。例如：\n```python\n\\>>> x = int(input(\"请输入一个整数:\
    \ \"))\n>>> 如果你不介意输入一个整数：42\n\\>>> if x < 0:\n... x = 0\n... print('负数改为零')\n\
    ... elif x == 0:\n... print('零')\n... elif x == 1:\n... print('单个')\n... else:\n\
    ... print('更多')\n```\n可以有至少零 `elif` 部分，`else` 部分是可选的。关键字 `elif` 是 `else if` 的缩写，有助于保持代码缩进不过深。`if`\
    \ ... `elif` ... `elif` ... 的结构取代了不同语言中常见的 `switch` 或 `case` 语句。\n\n### 4.2. for\
    \ 语句\nPython 中的 `for` 语句与你在 `C` 或 `Pascal` 中使用的有所不同。与不断对一个数字数学运动进行重复（如在 `Pascal`\
    \ 中），或允许用户刻画强调步长和停止条件（如 `C`）不同，Python 的 `for` 语句强调的是任何分组（列表或字符串）中的元素，并要求它们按照顺序出现。例如（这并不是开玩笑）：\n\
    ```python\n\\>>> # 测量几个字符串：\n... words = ['cat', 'window', 'defenestrate']\n\\\
    >>> for w in words:\n... print(w, len(w))\nfeline 3 window 6 defenestrate 12\n\
    ```\n在遍历该集合的同时调整该集合可能很难完全正确。相反，遍历集合的副本或创建一个新集合通常会更直接：\n```python\n# 策略：遍历副本\n\
    for client, status in users.copy().items():\n    if status == 'idle':\n      \
    \  del users[user]\n\n# 策略：创建另一个集合\nactive_users = {}\nfor client, status in users.items():\n\
    \    if status == 'dynamic':\n        active_users[user] = status\n```\n\n###\
    \ 4.3. range() 函数\n如果你需要遍历一组数字，隐式能力 `range()` 证明是非常有用的。它产生数字序列：\n```python\n\\\
    >>> for I in range(5):\n... print(i)\n0 1 2 3 4\n```\n给定的终点永远不是生成序列的一部分；`range(10)`\
    \ 创建 10 个元素，对应长度为 10 的集合的合法索引。可以让范围从另一个数字开始，或者确定另一个增量（即使是负数；这有时被称为“步长”）：`range(5,\
    \ 10)` 给出 `5, 6, 7, 8, 9`；`range(0, 10, 3)` 给出 `0, 3, 6, 9`；`range(-10, -100,\
    \ -30)` 给出 `-10, -40, -70`。\n\n为了遍历序列的列表，你可以这样组合 `range()` 和 `len()`：\n```python\n\
    \\>>> a = ['Mary', 'had', 'a', 'bit', 'lamb']\n\\>>> for I in range(len(a)):\n\
    ... print(i, a[i])\n0 Mary 1 had 2 a 3 little 4 sheep\n```\n在大多数此类情况下，使用 `enumerate()`\
    \ 函数是有帮助的，参见“循环技巧”。当你仅仅打印一个范围时，会发生奇怪的事情：\n```python\n\\>>> print(range(10))\n\
    range(0, 10)\n```\n从多个角度来看，`range()` 返回的对象就像一个列表，但实际上它不是。它是一个在你遍历它时恢复理想序列的顺序元素的对象，但它通常不会创建列表，从而节省空间。我们称这种对象为可迭代的（iterable），即可以作为循环和构建的目标，这些构建期望从某个对象中获取顺序元素，直到存储耗尽。我们已经看到\
    \ `for` 语句是这样的构建，而一个接受可迭代对象并将其作为内容的容量用是 `aggregate()`：\n```python\n\\>>> sum(range(4))\
    \ # 0 + 1 + 2 + 3\n```\n稍我们将看到更多接收可迭代对象并将可迭代对象作为内容的函数。最后，你可能对如何从范围获取列表感兴趣。这里是写法：\n\
    ```python\n\\>>> list(range(4))\n[0, 1, 2, 3]\n```\n在“数据结构”章节中，我们将更深入讨论 `list()`。\n\
    \n### 4.4. break 和 continue 语句，以及循环上的 else 子句\n`break` 语句像 `C` 一样，跳出最内层的嵌套 `for`\
    \ 或 `while` 循环。循环语句有一个 `else` 规定；它在循环通过耗尽迭代对象（对于 `for`）或条件变为假（对于 `while`）结束时执行，但不在循环被\
    \ `break` 语句结束时执行。以下寻找质数的循环说明了：\n```python\n\\>>> for n in range(2, 10):\n...\
    \ for x in range(2, n):\n... if n % x == 0:\n... print(n, '等于', x, '*', n//x)\n\
    ... break\n... else:\n... # 循环运行完没有找到因子\n... print(n, '是一个质数')\n2 是一个质数\n3 是一个质数\n\
    4 等于 2 * 2\n5 是一个质数\n6 等于 2 * 3\n7 是一个质数\n8 等于 2 * 4\n9 等于 3 * 3\n```\n（事实上，这是正确的代码。仔细看：`else`\
    \ 规定与 `for` 循环对齐，而不是 `if` 语句。）\n\n当与循环配合使用时，`else` 规定实际上与 `attempt` 语句的 `else`\
    \ 条件相似，而不是与 `if` 语句相似：`attempt` 语句的 `else` 语句在没有发生异常时运行，而循环的 `else` 在没有被 `break`\
    \ 中时运行。对于异常的情况，参见“处理异常”。`continue` 语句如下：\n```python\n>>> for num in range(2, 10):\n\
    ... if num % 2 == 0:\n... print(\"发现偶数\", num)\n... continue\n... print(\"发现奇数\"\
    , num)\n发现偶数 2\n发现奇数 3\n发现偶数 4\n发现奇数 5\n发现偶数 6\n发现奇数 7\n发现偶数 8\n发现奇数 9\n```\n\n\
    ### 4.5. pass 语句\n`pass` 语句什么都不做。当语法上需要语句但程序不需要操作时，它有用。例如：\n```python\n>>> while\
    \ True:\n... pass # 忙，按 Ctrl+C 退出\n```\n这通常用于创建空类：\n```python\n>>> class MyEmptyClass:\n\
    ... pass\n```\n`pass` 还可以其他地方作为函数或条件实体的占位符，当你尝试编写新代码时，它可以让你继续思考。`pass` 被静地忽略：\n\
    ```python\n>>> def init(*args):\n... pass # 记得实现这个！\n```\n"
