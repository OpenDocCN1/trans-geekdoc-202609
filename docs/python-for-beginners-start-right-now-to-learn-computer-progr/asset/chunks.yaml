    \ `Hello World!` 的简单程序。由于这是一个简单程序，通常用于让新手熟悉另一种语言。在任何内容管理器或 IDE 中输入以下代码并将其保存为 `hello`：\n\
    ```python\nprint(\"Hello World!\")\n```\n（省略）用文件名保存文档，例如 `hello.py`。测试准备就绪，你将在屏幕上看到\
    \ Hello World!\n\n### 声明和使用变量的步骤\n让我们看例子。我们将声明“an”并打印它。\n```\nf = 100\nprint(f)\n\
    ```\n\n## 变量\n在 Python 中，你可以绑定不同的数据类型，如字符串和数字。例如，我们将 \"Master\" 与数字 `99` 绑定。与要求将数字作为字符串的\
    \ Java 不同，Python 允许：\n```python\na = \"Master\"\nb = 99\nprint(a+b)\n```\n（省略）\n\
    在 Python 中，当你需要在程序的其余部分或模块中使用变量时，声明一个在作用范围内的 `f`。当函数结束时，更改的变量 `f` 仍然存在。\n```\n\
    print(f)\n```\n（省略）\n\n# 4. 类\n类名应遵循 `UpperCaseCamelCase`（大驼峰命名法）。Python 的内置类通常是小写单词。特殊情况类应以\
    \ `Mistake`（错误）结尾。\n\n### 5. 全局（模块级）变量\n全局因子应全小写。全局变量名中的单词应用下划线分隔。\n\n### 6. 实例变量\n\
    实例变量名应全小写。实例变量名中的单词应用下划线分隔。非公开实例因子应以单下划线开头。如果类名应该被破坏，双下划线可以作为名称开头。\n\n### 7. 方法\n\
    方法名应全小写。方法名中的单词应用下划线分隔。非公开方法应以单下划线开头。如果方法名应该被破坏，双下划线可以作为其名称开头。\n\n### 8. 参数\n\
    方法的第一个参数通常是 `self`。类方法的第一个参数是 `cls`。\n\n### 9. 容量\n容量名应全小写。容量名中的单词应用下划线分隔。\n\n\
    ### 10. 常量\n常量名必须全大写。常量名中的单词应用下划线分隔。\n\n# 命名 Python 命名规范\n## 1. 通用\n避免使用过度宽泛或冗长的名称。在两者之间寻找平衡。\n\
    - 糟糕：`data_structure`、`my_list`、`info_map`、`dictionary_for_the_purpose_of_storing_data`\n\
    - 优秀：`user_profile`、`menu_options`\n## 2. 包\n包名应全小写。当需要多个单词时，使用下划线分隔（例如 `HTTPServer`）。\n\
    ## 3. 模块\n模块名应全小写。当需要多个单词时，使用下划线分隔。通常建议使用短单词。\n## 4. 类\n类名应遵循 `UpperCaseCamelCase`。Python\
    \ 的内置类通常是小写单词。特殊情况类应以 `Mistake` 结尾。\n"
