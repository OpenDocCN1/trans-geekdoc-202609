    当你点击我们情况 "guru99.txt" 的内容文件时，它看起来像这样：Python FILE Tutorial: Create, Append, Read,
    Write


    ### 向文件追加数据的逐步指令

    你也可以向现有文档或新记录附加另一个内容。


    **阶段 1)** `f=open("guru99.txt", "a+")`

    你可以在代码中看到一个或多个加号，它显示如果文件不存在将创建另一个记录。但是，对于我们的情况，我们现在有了文件，所以不需要创建另一个记录。


    **阶段 2)** `for I in range(2): f.write("Appended line %d\\r\\n" % (i+1))`

    这将信息写入文件。


    Python FILE Tutorial: Create, Append, Read, Write

    你可以在 `"guru99.txt"` 文看到结果。代码的结果是之前的记录追加了新信息。


    ### 读取文件的逐步指令

    你不仅可以用 Python 创建 .txt 文件，还可以以“读取模式”(r) 调用 .txt 记录。


    **阶段 1)** 以读取模式打开文件 `f=open("guru99.txt", "r")`

    **阶段 2)** 我们在代码中使用模式函数来检查文件是否处于打开模式。如果确实，则在 `f.mode == ''r'':` 的情况下继续。

    **阶段 3)** 使用 `f.read` 读取记录信息并将其存储在因子 `substance =f.read()` 中。

    **阶段 4)** `print substance`

