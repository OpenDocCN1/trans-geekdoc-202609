    # 第 2 章 变量类型


    变量仅仅是用于存储估计值的内存区域。这意味着当你创建一个变量时，你就在内存中保存了部分空间。根据变量的信息类型，解释器会分配内存并选择哪些内容可以存放在持有的内存中。通过这种方式，通过为变量分配不同的信息类型，你可以在这些变量中存储整数、小数或字符。


    ## 给变量赋值


    Python 变量不需要显式声明来占据内存空间。当你向变量分配一个激励值时，赋值就会随之发生。等号（`=`）用于向变量分配值。`=`运算符的一侧的操作数是变量名，`=`运算符另一侧的操作数是存储在变量中的值。例如：


    ```python

    #!/usr/bin/python

    counter = 100 # 一个整数任务

    miles = 1000.0 # 一个浮点数名称

    name = "John" # 一个字符串

    print counter

    print miles

    print name

    ```


    在这里，`100`、`1000.0` 和 `"John"` 分别分配给 `counter`、`miles` 和 `name` 变量。这产生了如下结果：

    ```

    100

    1000.0

    John

    ```


    ## 多重赋值


    Python 允许你同时向几个变量分配同一个激励值。例如 `a = b = c = 1`。在这里，创建了一个值为 `1` 的数字项目，并且这三个变量中的每一个都被分配到了相同的内存区域。你同样可以将多个项目分配给不同的变量。例如
    `a,b,c = 1,2,"john"`。在这里，两个值为 `1` 和 `2` 的整数项目被分别分配给变量 `a` 和 `b`，而一个值为 `"john"`
    的字符串对象被分派给变量 `c`。


    ## 标准数据类型


    存储在内存中的信息可以是多种类型。例如，一个人的年龄被存储为数值，而他们的位置被存储为字母字符。Python 有不同的标准信息类型，用于刻描述在它们上可以执行的操作以及每种类型的处理能力。Python
    有五种标准信息类型：

    - 数字 (Numbers)

    - 字符串 (String)

    - 列表 (List)

    - 元组 (Tuple)

    - 字典 (Dictionary)


    ### Python 数字


    数字信息类型存储数值属性。当向它们分配一个激励值时，就会创建数字项目。例如：

    ```python

    var1 = 1

    var2 = 10

    ```


    你同样可以使用 `del` 语句删除对数字项目的引用。`del` 语句的语法是 - `del var1[],var2[],var3[],....,varN[]`。你可以利用
    `del` 语句删除单个项目或多个项目。例如：`del var`，`del var_a, var_b`。


    Python 支持四种不同的数值：

    - `int`（标记整数）

    - `long`（长整数，它们也可以用八进制和十六进制表示）

    - `float`（浮点实数属性）

    - `complex`（复数）


    以下是一些数字的例子：


    | int | long | float | complex |

    | :--- | :--- | :--- | :--- |

    | 100 | 51924361L | 0.0 | 3.14j |

    | 100 | -0x19323L | 15.20 | 45.j |

    | -786 | 0122L | -21.9 | 9.322e-36j |

    | 080 | 0xDEFABCECBDAECBFBAEl | 32.3+e18 | .876j |

    | -0490 | 535633629843L | -90. | -.6545+0J |

    | -0x260 | -052318172735L | -32.54e100 | 3e+26J |

    | 0x69 | -4721885298529L | 70.2-E12 | 4.53e-7j |


    Python 允许在 `long` 中使用小写的 `l`，但建议只使用大写的 `L` 以避免与数字 `1` 混淆。Python 用大写的 `L` 显示长整数。一个奇人的数字由一对有序的实数浮点组成，表示为
    `x + yj`，其中 `x` 和 `y` 是实数，`j` 是虚数单位。


    ### Python 字符串


    Python 中的字符串被识别为引号内说的字符边界集。Python 考虑单引号或双引号语句。字符串的子集可以使用切片运算符（`[]` 和 `[::]`）获取，文件从字符串开头的
    `0` 开始并从 `-1` 向末尾移动。加号（`+`）是字符串连接运算符，星号（`*`）是重复运算符。例如：


    ```python

    #!/usr/bin/python

    str = ''Hi World!''

    print str # 打印整个字符串

    print str[0] # 打印字符串的第一个字符

    print str[2:5] # 打印从第三到第五的字符

    print str[2:] # 打印从第三字符开始的字符串

    print str * 2 # 多次打印字符串

    print str + "TEST" # 打印连接字符串

    ```


    这将交付如下结果：

    ```

    Hi World! Hi Hi World! Hi World!Hello World! Hi World!TEST

    ```


    ### Python 列表


    列表是 Python 复合信息类型中最灵活的。列表包含用逗号分隔的项目，并封装在方括号 `[]` 中。某种程度上，列表类似于 C 语言中的数组。它们之间的区别在于，列表中具有位置的每一个项目可以是不同类型。存储在列表中的属性可以使用切片运算符（`[]`
    和 `[::]`）获取，列表从列表开头的 `0` 开始并向其 `-1` 移动。加号（`+`）是列表连接，星号（`*`）是重复运算符。例如：


    ```python

    #!/usr/bin/python

    list = [''abcd'', 786 , .23, ''john'', 70.2]

    tinylist = [123, ''john'']

    print list # 打印整个列表

    print list[0] # 打印列表的第一个元素

    print list[1] # 打印列表的第二个元素

    print list[2:] # 打印从第三元素开始的列表

    print list * 2 # 多次打印列表

    ```


    这将交付

    ```

    [''abcd'', 786, .23, ''john'', 70.2] [''abcd'', 786, .23, ''john'', 70.2] [''abcd'',
    786, .23, ''john'', 70.2]

    ```


    ### 元组


    元组是 Python 复合信息类型中不可变的。元组包含用逗号分隔的项目，并封装在括号 `()` 中。某种程度上，元组类似于列表。一个区别是，元组一旦创建就不能被更改。存储在元组中的属性可以使用切片运算符（`[]`
    和 `[::]`）获取，列表从元组开头的 `0` 开始并向 `-1` 移动。加号（`+`）是元组连接，星号（`*`）是重复运算符。例如：


    ```python

    #!/usr/bin/python

    tuple = (''abcd'', 786, .23, ''john'', 70.2)

    tupleuple = (123, ''john'')

    print tuple # 打印整个元组

    print tuple[0] # 打印元组的第一个元素

    print tuple[1] # 打印元组的第二个元素

    print tuple[2:] # 打印从第三元素开始的元组

    print tuple * 2 # 多次打印元组

    ```


    这将交付如下

    ```

    (''abcd'', 786, .23, ''john'', 70.2) (''abcd'', 786, .23, ''john'', 70.2) (''abcd'',
    786, .23, ''john'', 70.2)

    ```


    ### 字典


    字典是 Python 复合信息类型中最灵活的。字典包含键值对项目，并封装在花括号 `{}` 中。某种程度上，字典类似于 C 语言中的哈希表。一个区别是，字典中的每个键是唯一的。存储在字典中的属性可以使用键（`[]`）获取。例如：


    ```python

    #!/usr/bin/python

    dict = {''a'': ''abcd'', ''b'': 786, ''c'': .23, ''d'': ''john'', ''e'': 70.2}

    dictuple = {''a'': 123, ''b'': ''john''}

    print dict # 打印整个字典

    print dict[''a''] # 打印字典的第一个元素

    print dict[''b''] # 打印字典的第二个元素

    print dict[''c''::] # 打印从第三元素开始的字典项

    print dict * 2 # 多次打印字典

    ```


    这将交付如下

    ```

    {''a'': ''abcd'', ''b'': 786, ''c'': .23, ''d'': ''john'', ''e'': 70.2} {''a'':
    ''abcd'', ''b'': 786, ''c'': .23, ''d'': ''john'', ''e'': 70.2} {''a'': ''abcd'',
    ''b'': 786, ''c'': .23, ''d'': ''john'', ''e'': 70.2}

    ```


    ### 集合


    集合是 Python 复合信息类型中无序的。集合包含不重复的项目，并封装在花括号 `{}` 中。某种程度上，集合类似于 C 语言中的集合。一个区别是，集合中的项目是唯一的。例如：


    ```python

    #!/usr/bin/python

    set = {''abcd'', 786, .23, ''john'', 70.2}

    setuple = {123, ''john''}

    print set # 打印整个集合

    print set[0] # 打印集合的第一个元素

    print set[1] # 打印集合的第二个元素

    print set[2:] # 打印从第三元素开始的集合项

    print set * 2 # 多次打印集合

    ```


    这将交付如下

    ```

    {''abcd'', 786, .23, ''john'', 70.2} {''abcd'', 786, .23, ''john'', 70.2} {''abcd'',
    786, .23, ''john'', 70.2}

    ```


