    \n'Hello, Alice'\n>>> \"Hello, {}\".format(\"Bob\")\n'Hello, Bob'\n```\n\n## 编码\n\
    \nPython 支持各种字符编码：\n\n- `ASCII`：基础编码。\n- `UTF-8`：常用的编码，可以表示 Unicode 集中的任何字符。\n\
    \n将字符串编码为字节，使用 `encode()` 方法：\n\n```python\n>>> \"hello\".encode('utf-8')\n```\n\
    \n## 特殊字符\n\n某些字符具有特殊含义，必须使用反斜杠进行转义：\n\n- 反斜杠（`\\\\`）\n- 单引号（`\\'`）\n- 双引号（`\\\
