  trans: "\n\n# 第 1 章 Python 编程基础\n\n## 初学者 Python \n欢迎！你对编程来说完全是个新手吗？如果不是，那么我们假设你正在寻找关于为什么以及如何开始\
    \ Python 的信息。幸运的是，任何编程语言的熟练软件工程师（无论是哪种语言）都能快速上手 Python。对于初学者来说，它同样容易使用和适应，所以开始吧！\n\
    \n介绍 Python 通常非常简单，如今许多 Linux 和 UNIX 发行版都内置了 Python。事实上，甚至一些 Windows 电脑（特别是 HP\
    \ 的电脑）现在也预装了 Python。如果你确实需要安装 Python 但不确定如何操作，你可以在 `BeginnersGuide/Download` wiki\
    \ 页面上找到几条笔记，不过在大多数平台上，安装都是并不寻常的。\n\n### 学习\n在开始之前，你可能需要发现哪些 IDE 和内容工具适合修改 Python，查阅初始书籍列表，或者查看你认为有帮助的代码示例。在\
    \ `BeginnersGuide/Tutorials` 页面上有一份适用于经验丰富的软件工程师的教学练习列表。同样有一份不同语言的资源列表，如果英语不是你的母语，这些资源可能会有所帮助。在线文档是你获取权威数据的首选。有一份非常短的入门教程可以为你提供关于该语言的基本信息并让你入门。你可以通过查看库引用来全面描述\
    \ Python 的众多库，通过查看语言参考来对 Python 的语法结构进行全面（尽管有些许枯燥）的解释。\n\n如果你正在寻找基础的 Python 计划和示例，可以查阅\
    \ `ActiveState Python Cookbook`。如果你需要知道 Python 是否支持特定的应用程序或具有特定功能的库，有许多潜在的数据来源。Python\
    \ 网站提供了 `Python Package Index`（也称为 Cheese Shop，这是对同名 Monty Python 内容的引用）。此外，还有一个用于各种\
    \ Python 相关数据的搜索页面。不仅如此，只需在 Google 上搜索包含“python”一词的表达式，你可能就能得到你所需的结果。有疑问时，可以在\
    \ python 新闻组中提问，很有可能有人会帮帮你。\n\n## Python 的安装\n在继续之前，你可能需要打印这些指南，以便在下载和安装 Python\
    \ 时参考它们。或者，只需将此存档保存在你的程序目录中。在执行它所描述的操作之前，你应该仔细阅读每个步骤。本文展示了在 2019 年夏季在 Windows\
    \ `10` 上下载并安装 Python `3.7.4`。你应该下载并安装最新版本的 Python。目前的最新版本（截至 2019 年夏季）是 `Python\
    \ 3.7.4`。记住，你应该将 `Java`、`Python` 和 `Eclipse` 作为 64 位应用程序分别安装。\n\n### Python: 版本\
    \ 3.7.4\nPython 下载大约需要 25 Mb 的磁盘空间；将其保留在你的机器上，以防你需要重新安装。安装时，Python 大约额外额外 90 Mb\
    \ 的磁盘空间。\n\n### 下载 Python\n随后的页面将在程序中显示。\n![](img/Image00002.jpg)\n点击 Windows\
    \ 界面（`Download Python 3.7.4` 按钮下方的两行）。随后的页面将在程序中显示。\n![](img/Image00003.jpg)\n\
    点击左上方 Stable Releases 下方的 `Download Windows x86-64` 可执行安装程序链接。![](img/Image00004.jpg)\n\
    将弹出一个名为 `Opening python-3.74-amd64.exe` 的窗口。点击 `Save File`（保存文件）按钮。名为 `python-3.7.4-amd64.exe`\
    \ 的文件将开始下载到你的默认下载文件夹。此文件约为 30 Mb，如果你使用的是较慢的网络连接，可能需要很长时间才能完全下载（我通过调制解调器连接大约花了\
    \ 10 秒）。该文件应显示为 `Move this record to a permanent area`（将此记录移动到永久区域），这样你就可以安装 Python（以后需要时也可以重新安装）。不要犹豫进一步查看此页面；如果你只需继续安装，可以关闭此网页标签页。直接开始下方的安装指南。\n\
    \n### 安装\n双击标记为 `python-3.7.4-amd64.exe` 的文件。![](img/Image00005.jpg)\n将弹出一个 `Python\
    \ 3.7.4 (64-bit)` 安装窗口。确保勾选底部的 `Install launcher for all users (recommended)`（为所有用户安装启动器）和\
    \ `Add Python 3 to PATH`（将 Python 3 添加路径）复选框。如果 Python 安装程序发现你的电脑上安装了之前的 Python\
    \ 版本，`Install Now`（立即安装）消息可能会显示为 `Upgrade Now`（立即升级），且复选框不会显示。点击 `Install Now`（或\
    \ `Upgrade Now`）消息，然后点击。运行时，屏幕上可能会弹出一个用户账户控制窗口。我没捕捉到它的图片，但它询问：`Do you need to\
    \ permit this application to make changes to your gadget`（你是否允许此应用对你的设备进行更改）。点击\
    \ `Yes`（是）按钮。![](img/Image00006.jpg)\n另一个 `Python 3.7.4 (64-bit)` 安装窗口将弹出，带有安装消息和进度条。![](img/Image0007.jpg)\n\
    安装期间，它将显示不同的部分并移动进度条。最后，将弹出一个 `Setup was successful` 。点击 `Close`（关闭）按钮。Python\
    \ 现在已安装。\n\n### 检查\n要尝试检查安装，进入 `C:\\Users\\Pattis\\Local\\Programs\\Python\\Python37`（或相应的安装路径）。双击\
