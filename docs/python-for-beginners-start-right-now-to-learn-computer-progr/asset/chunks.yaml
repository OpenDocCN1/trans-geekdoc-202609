    打印的一系列字符，用于告诉它已准备好接受指令。`$` 表示当前工作目录。如果你不确定要去去哪里，它会将你带回主索引目录。


    现在，要创建一个名为 `Code` 的文件夹，你需要输入：`mkdir Code`。`mkdir` 部分意味着“创建目录”。目录非常类似于 Finder 中说的“文件夹”。如果你通过命令行创建一个目录，它将作为
    Finder 中的一个文件夹出现。`Code` 是该指令的参数。`mkdir` 需要我们指定一个作为新目录名称的字符串，因此我们向它传递了 `Code` 参数。与文件夹不同，如果我们没有提供名称，`mkdir`
    将向我们返回错误。所示，错误信息（第二行）告诉我们错误地使用了 `mkdir`，并向我们提供了如何正确使用它的建议。括号中的任何内容都是可选的，但目录名称不是的！


    ## 3. 安装 HOMEBREW


    Homebrew 是 OS X 的软件包管理器。软件包是一系列共同工作的代码记录。安装它们通常意味着运行一段内容（一段代码），将某些记录放置在不同的目录中。你将需要的许多软件包都有依赖项。这意味着它们要求你的电脑上预先安装了不同的软件包。Homebrew
