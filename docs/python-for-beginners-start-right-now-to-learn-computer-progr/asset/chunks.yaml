    \    i += 1\n```\n\n## 函数\n\n函数使用 `def` 关键字定义：\n\n```python\ndef greet(name):\n\
    \    return f\"Hello, {name}!\"\n\nprint(greet(\"Alice\"))\n```\n\n函数还可以带有带有默认值的参数：\n\
    \n```python\ndef add(a, b=10):\n    return a + b\n\nprint(add(5)) # 15\nprint(add(5,\
    \ 2)) # 7\n```\n\n### 列表\n\n列表是顺序的、可变的元素集合：\n\n```python\nfruits = [\"apple\"\
    , \"banana\", \"cherry\"]\nfruits.append(\"orange\")\nprint(fruits)\n```\n\n###\
    \ 元组\n\n元组是顺序的、不可变的集合：\n\n```python\ncoordinates = (10, 20)\n# coordinates[0]\
    \ = 30 # 这将引发错误\n```\n\n### 字典\n\n字典是无序的键值对：\n\n```python\nperson = {\"name\"\
    : \"Alice\", \"age\": 25}\nprint(person[\"name\"])\nperson[\"age\"] = 26 # 更新\n\
    person[\"city\"] = \"New York\" # 添加\n```\n\n### 集合\n\n集合是无序的唯一元素集合：\n\n```python\n\
    numbers = {1, 2, 3, 3}\nprint(numbers) # 输出: {1, 2, 3}\n```\n\n"
