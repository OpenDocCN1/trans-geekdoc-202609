    网站上阅读更多信息。现在，请使用以下代码安装 Homebrew：


    ```bash

    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

    ```


    所以这里发生了什么？最后一部分显然是一个 URL。如果你无意中在程序中打开了这个 URL，你只会看到代码。这是一段引导你的电脑安装 Homebrew 的 Ruby
    代码。`curl` 部分是一个利用 URL 移动文件的命令行工具。`- fsSL` 部分是 `curl` 四个选项标志的组合，用于决定如何处理 URL 中的记录。如果你需要了解这些标志的作用，请在命令行中输入
    `man curl`。（你可以在大多数指令之前使用 `man` 来打开该指令的手册页）。我们还需要真正执行这段 Ruby 代码，因此我们在开头使用了了 `ruby`
    指令。`- e` 是 `ruby` 的一个可选标志，用于将字符串作为单行代码执行，在这种情况下，就是 `"$(curl ...)"` 部分。你可能需要遵循另外几条指令来完成安装，但
    Homebrew 会帮助你完成这些操作。


    ## 4. 安装 PYTHON


    Python 随 OS X 自带，所以你可能不需要此步骤。你可以通过在 `Terminal` 中输入 `python --version` 来检查。如果你收到错误信息，则你必须安装
    Python。如果 `Terminal` 打印类似 `Python 2.7.3` 的内容（你看到的具体数字可能不同），你就可以继续第 5 步了。如果由于未知原因你没有
    Python，或者你需要获取最新版本，你现在可以使用 Homebrew 高效地完成这一点！每当你使用 Homebrew 时，都要以 `brew` 开始你的指令，后面跟着所需的
    Homebrew 指令。要安装最新版本的 python 2，只需输入：`brew install python`。如果你倾向于安装最新版本的 python
    3，请将 `python` 替换为 `python3`。


