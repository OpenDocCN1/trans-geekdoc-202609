    \ 引入后，在命令行输入 `python` 将产生提示符模式。（省略）要离开此模式，输入 `quit()` 并按回车。\n\n### 2. 在集成开发环境\
    \ (IDE)\n我们可以使用任何文本编辑器来编写 Python 内容。我们只需要以 `.py` 扩展名保存它。无论如何，使用 IDE 可以让我们的生活简单得多。IDE\
