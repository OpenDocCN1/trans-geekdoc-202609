  \n### 20.9 总结\n\n在本章中，我们考虑了两个黑盒优化的例子：进化策略和遗传算法，它们与基于解析梯度的方法不相上下。它们的优势在于即使在资源大量的情况下也能良好并行化，并且对奖励系统的假设较少。\n\
  \n在下一章中，我们将考虑强化学习（RL）研究的另一个领域，即高级探索。\n\n### 20.10 参考文献\n\n[1] Tim Salimans, Jonathan\
  \ Ho, Xi Chen, Szymon Sidor, Ilya Sutskever, *Evolution Strategies as a Scalable\
  \ Alternative to Reinforcement Learning*, arXiv:1703.03864\n\n[2] Felipe Petroski\
  \ Such, Vashisht Madhavan et al., *Deep Neuroevolution: Genetic Algorithms are a\
  \ Competitive Alternative for Training Deep Neural Networks for Reinforcement Learning*\
  \ arXiv:1712.06567\n\n[3] Lehman 和 Stanley, *Abandoning Objectives: Evolution Through\
  \ the Search for Novelty Alone*, Journal Evolutionary Computation Archive, Band\
  \ 19, Ausgabe 2, Sommer 2011, Seiten 189–223\n\n# 第 21 章：高级探索\n\n接下来，我们将讨论强化学习（RL）中的探索。探索与利用权衡（Exploration/Exploitation\
  \ Dilemma）在 RL 中至关重要且对高效学习具有重大意义，这一点已经多次提到。在之前讨论的例子中，我们采用了一种相当浅显的环境探索方法，即大多数情况下根据\
  \ `ϵ`-Greedy 策略选择动作。现在是时候深入探讨探索了。\n\n本章的主题包括：\n\n*   为什么探索对 RL 具有基础性意义\n*   研究 `ϵ`-Greedy\
  \ 方法的有效性\n*   替代方案及其在不同环境中的应用\n\n### 21.1 探索的重要性\n\n在书中研究了许多环境和方法，并且在几乎每一章中都提到了探索。你可能已经对为什么有效的环境探索如此重要有了某种概念，因此我在这里只列出主要原因。\n\
  \n在此之前，我们应该先确定“有效探索”这一词到底意味着什么。在 RL 理论中虽然有严格的定义，但其通用概念简单且直观。当探索不再浪费时间去寻找已经知道且熟悉的状态时，探索就是有效的。与其总是执行相同的动作，智能体应该寻找新的经验。因此，让我们简单探讨一下我们为什么对高效探索感兴趣。\n\
  \n首先，良好的探索对于我们能够学会良好的策略至关重要。如果奖励是稀疏的，但智能体在异常情况下获得了奖励，那么可能在很多回合中只获得一次奖励。\n\n在实践中经常发生的情况下，缺乏细致的探索会导致智能体永远无法获得奖励这使得所有的努力都是徒劳。如果没有良好的样本可供学习，即使是最有效的方法也只能学到无法获得奖励。这在许多感兴趣的任务中都是如此。\n\
  \n\n\n在基于策略的方法中，网络返回一个关于待执行动作的概率分布，我们采取了非常类似的策略。为了防止网络对自己的动作过于自信（即对某个特定动作的概率为 1，而对其他动作返回概率\
  \ 0），我们引入了熵损失（Entropy Loss），它是由概率分布的熵乘以一个超参数得出的。在训练早期，熵损失会引导网络向随机动作移动（通过对概率分布进行正则化），但在后期，当环境已得到充分探索且奖励相对较高时，策略梯度（Policy-Gradient）的影响将超过熵正则化的影响。这个超参数必须经过优化才能使其正常工作。\n\
  \n总的来说，这两种方法的作用相同：为了探索环境，我们根据随机原则执行动作。然而，最近的研究结果表明，这种方法并不理想：\n\n*   在值迭代算法中，随机动作会导致轨迹的某些部分对\
  \ Q 值估计产生偏差。贝尔曼方程假设后继状态的 Q 值是根据 Q 值最大的动作来确定的。换句话说：后续轨迹应该符合最优行为。但在 `ϵ`-Greedy 策略中，我们执行的可能不是最优动作，而是随机动作，而这部分轨迹会在重放缓冲区（Replay\
  \ Buffer）中存储很久，直到 `ϵ` 值下降且旧动作从缓冲区中移除。在此之前，我们将学习到错误的 Q 值。\n\n*   如果我们在轨迹中添加随机动作，我们的策略每一步都会发生变化。根据由\
  \ `ϵ` 的值或熵损失系数定义的频率，轨迹会在随机动作和我们当前的策略之间不断切换。这可能导致状态空间的覆盖不足，例如当需要多个步骤才能到达环境状态中的孤立区域时。\n\
  \n为了说明最后一个问题，我们考虑一个来自 Strehl 和 Littman 于 2008 年发表的论文 *An analysis of model-based\
  \ Interval Estimation for Markov Decision Processes* 的示例 [\\[1\\]](#21.xhtml#BGBFJCDG)。该示例名为“河流游泳”（River\
  \ Swim），涉及智能体需要穿越的河流。环境包含六个状态以及左、右两个动作。图 21.1 显示了前两个状态 1 和 2 的转移图。\n\n![\\Bild\n\
  \n**图 21.1：** 河流游泳环境中前两个状态的转移\n\n在第一个状态（第一个圈）中，智能体站在岸边。只有一个动作，即向右，这意味着逆水流游向状态 2。然而，水流很大，在状态\
  \ 1 成功执行“向右”动作的概率为 60%（从状态 1 指向状态 2 的箭头）。\n\n水流导致智能体有 40% 的概率留在状态 1（指向状态 1 自身的箭头）。\n\
  \n在第二个状态（第二个圈）中，有两个动作可用：向左（连接状态 2 和状态 1 的虚线箭头；该动作总是成功的）和向右，意味着逆水流游向状态 3。逆水流游泳是困难的，因此从状态\
  \ 2 到达状态 3 的概率只有 35%（连接状态 2 和 3 的箭头）。“向左”动作有 60% 的概率让智能体留在状态 2，但在某些情况下，尽管付出了努力，智能体仍回到了状态\
  \ 1，概率为 5%（连接状态 2 和 1 的箭头）。\n\n因此总共有六个状态，但状态 3、4 和 5 的转移与状态 2 相同。图 21.2 显示了完整的转移图。最后一个状态\
  \ 6 类似于状态 1，因此只有一个动作可用，即向左，意味着游回。\n\n![\\Bild\n\n**图 21.2：** 河流游泳环境的完整转移图\n\n对于状态\
  \ 1 到 5 之间的转移，智能体获得 1 的小额奖励。但如果它到达状态 6，作为对逆水艰苦游泳的补偿，它将获得 1,000 的高奖励。\n\n尽管这个环境如此简单，但它的结构给\
  \ `ϵ`-Greedy 策略带来了问题。\n\n\n\n\n\n- **基于计数的方法（Counter-based methods）**：记录智能体访问特定状态的频率。我们研究了两种方法：直接计数状态和伪计数器方法（Pseudo-counter\
  \ methods）。\n- **基于预测的方法（Prediction-based methods）**：尝试根据状态和预测的质量对某些情况进行预测。我们可以借此判断智能体对某个状态的熟悉程度。为了说明这种方法，我们来看一下所谓的`策略蒸馏方法`（Policy\
  \ Distillation method），该方法在探索如`Montez’s Revenge`等 Atari 游戏时已经达到了最先进的水平。\n\n在接一节中，我们将实现上述方法来解决一个名为`MountainCar`的练习题。这将有助于我们更好地理解这些方法、实现方式以及它们的行为。随后，我们将挑战一个属于\
  \ Atari 游戏件的更具挑战性的任务。\n\n### 21.3.1 噪声网络（Noisy Nets）\n\n我们先来看一个已经熟悉的方法。我在`第 8 章`中作为\
  \ `DQN` 扩展的一部分，讨论过这种被称为`噪声网络`的方法。其核心思想是在网络权重中添加正态分布的噪声，并通过反向传播以与权重相同学习噪声分布的参数（均值和方差）。在`第\
  \ 8 章`中，我们通过这种简单的方法显著加速了`Pong`的训练。\n\n总的来说，它与`ϵ`-Greedy 方法有许多相似之处，但论文作者指出，其区别在于网络内部产生随机性的方式。在`ϵ`-Greedy\
  \ 方法中，动作是随机的。而在噪声网络中，随机性被引入到网络的某些特定部分（以输出端附近多个全连接层的形式），这意味着为当前的`Policy`（策略）增加了随机性。此外，噪声参数是在训练过程中学习的，因此训练过程可以根据需要减少或增加`Policy`的随机性。\n\
  \n根据该论文，必须偶尔对噪声层进行随机采样，这意味着训练样本不是由当前的`Policy`生成的，而是由一个`Policies`集合（Ensemble of Policies）生成的。这样，探索就会朝着另一个方向进行，因为添加到权重中的随机值会产生不同的`Policy`。\n\
  \n### 21.3.2 基于计数的方法\n\n这一类方法基于这样一个观点：访问之前尚未探索过的状态。在状态空间较小的简单情况下，我们只需统计某个状态或“状态+动作”组合出现的次数，并优先访问这些数字较低的状态。\n\
  \n这可以通过`内在奖励`（intrinsic reward）的形式来实现，将其加到环境给与的奖励（在此语境下称为`外在奖励`）中。定义此类奖励的一种方法是`多老虎机探索方法`（Bandits-Exploration\
  \ approach，这是 RL 任务中的一个重要变体）：![\\[图像\\]](Images/21_03.jpg)。在这里，![\\[图像\\]](Images/21_04.jpg)是一个计数器或伪计数器，用于指示状态\
  \ `s` 出现的次数，而值 `c`定义了内在奖励的权重。\n\n如果状态数量较少（如`表格化学习` Tabular Learning 中），我们可以轻松地对它们进行计数。在更困难的情况下，如果状态数量过多，则必须引入状态的转换，例如`哈希函数`（Hashing\
  \ function）或状态的`嵌入`（Embedding）。\n\n在伪计数器方法中，![![\\[图像\\]](Images/21_04.jpg) 被因子化为密度函数与访问状态总数的乘积。这有多种实现方式，但实现可能很困难，因此我们在本章中不涉及这部分。如果你感兴趣，应该阅读\
  \ Georg Ostrovski 等人题为`Count-Based Exploration with Neural Density Models`的论文。\n\
  \n内在奖励的一个特殊情况是所谓的`好奇心驱动探索`（Curiosity-driven Exploration），这种方法完全不考虑环境的奖励。在这种情况下，训练和探索\
  \ 100% 地由智能体发现的新奇性驱动。惊讶的是，这种方法可能非常高效，不仅在发现环境的新状态方面，而且在学习一个相当不错的`Policy`方面。\n\n###\
  \ 21.3.3 基于预测的方法\n\n第三类探索方法基于另一个想法：根据环境数据对某些情况进行预测。如果智能体能够做出准确的预测，意味着它已经熟悉该情况，不值得再去探索。但如果发生了某些意外情况且预测偏离很大，这可能意味着我们应该更多关注当前状态。实现这一点的方法有很多种，但在本章中，我们将关注一项实现了此类方法的论文。该论文由\
  \ Yuri Burda 等人于 2018 年发表，标题为`Exploration by random network`。作者们在处理 Atari 游戏任务时取得了最先进的成果。\n\
  \n论文中采用的方法非常简单：我们添加一种内在奖励，其计算方式是根据一个训练中的`NN`来预测另一个随机初始化且未训练`NN`的输出。这两个网络的输入都是当前的观测值，内在奖励与均方误差（`MSE`）成比例。\n\
  \n## 21.4 MountainCar 实验\n\n在这一节中，我们将尝试实现不同的探索方法，并在一个简单但极具挑战性的环境中比较它们的效率。这个环境可以被归类为经典的\
  \ RL 任务，因为它与 CartPole 环境有许多相似之处。然而，从探索的角度来看，MountainCar 环境确实是一项挑战。\n\n图 21.3 说明了任务设置。\n\
  \n![\\[图像\\]](Images/21_05.jpg)\n\n图 21.3：MountainCar 环境\n\n\n\n\n\n在 Gym 中，该环境被称为\
  \ `MountainCar-v0`，它拥有一个非常简单的观测空间和一个同样简单的动作空间。观测值仅两个两个组成：第一个表示汽车的水平位置，第二个表示速度。可选动作有\
  \ 0、1 和 2 三种。0 表示汽车向左移动，1 表示不向汽车施加任何力，2 则导致汽车向右移动。以下是 Python 命令行中的一个非常简单的演示。\n\n\
  ```\n>>> import gym\n>>> e = gym.make(\"MountainCar-v0\")\n>>> e.reset()\narray([-0.53143793,\
  \  0.        ])\n>>> e.observation_space\nBox(2,)\n>>> e.action_space\nDiscrete(3)\n\
  >>> e.step(0)\n(array([-0.51981535, -0.00103615]), -1.0, False, {})\n>>> e.step(0)\n\
  (array([-0.52187987, -0.00206452]), -1.0, False, {})\n>>> e.step(0)\n(array([-0.52495728,\
  \ -0.00307741]), -1.0, False, {})\n>>> e.step(0)\n(array([-0.52902451, -0.00406722]),\
  \ -1.0, False, {})\n>>> e.step(1)\n(array([-0.53305104, -0.00402653]), -1.0, False,\
  \ {})\n>>> e.step(1)\n(array([-0.53700669, -0.00395565]), -1.0, False, {})\n>>>\
  \ e.step(1)\n(array([-0.54086181, -0.00385512]), -1.0, False, {})\n>>> e.step(1)\n\
  (array([-0.54458751, -0.0037257 ]), -1.0, False, {})\n```\n\n如你所见，我们每一步都会获得 -1 的奖励。因此，智能体必须学习如何尽可能快到达目标，以便获得尽可能少的负奖励。步数默认限制为\
  \ 200 步。如果未达到目标（通常情况下如此），我们就会获得 -200 的总奖励。\n\n### 21.4.1 采用 ϵ-Greedy 策略的 DQN 方法\n\
  \n我们研究的第一种方法是经典的 ϵ-Greedy 策略。它实现在 `Chapter21/mcar_dqn.py` 文件中。我在这里不再重复代码，因为你已经熟悉它了。在源文件中，实现了多种基于\
  \ DQN 方法的探索策略。通过选项 `-p`，你可以指定要使用的超参数。如果想使用普通的 ϵ-Greedy 策略，必须传递 `-p egreedy`。超参数规定了在最初\
  \ 10⁵ 步训练中，$ \\epsilon $ 会从 `1.0` 减小到 `0.02`。\n\n训练过程非常快：执行 10⁵ 步训练仅需三分钟。但从图 21.4\
  \ 和图 21.5 中的图表可以明显看出，在这 10⁵ 步（500 个回合）中，没有一次达到过目标状态。这是一个非常糟糕的消息，因为 $\\epsilon $\
  \ 已经减小，因此不再进行进一步的探索。\n\n剩余执行的 2% 随机动作显然不足，因为到达山顶需要数十个协调一致的步骤（最佳的 MountainCar 策略获得的奖励为\
  \ -80）。我们可以继续训练数百万步，但我们从环境中收到的唯一数据将始终是只有 200 步且奖励为 -200 的回合。这再次说明了探索（Exploration）的重要性。训练方法本身并不重要；如果没有适当探索，训练可能会失败。\n\
  \n![图像](img/21_06.jpg)\n\n**图 21.4：** 使用 ϵ-Greedy 策略进行 DQN 训练时的奖励和步数\n\n那么该怎么办呢？如果我们想坚持使用\
  \ ϵ-Greedy 策略，唯一的办法就是更长时间地探索环境。你可以尝试选项 `-p egreedy` 的超参数，但我将其推向了极端创建了一组新的超参数：`-p\
  \ egreedy-long`。\n\n我们使用值 $ \\epsilon = 1.0 $ ，直到在至少一个回合中获得比 -200 更好的奖励。如果是这样，我们按照常做法在最初的\
  \ 10⁶ 步中将 $\\epsilon $ 从 1.0 减小到 0.02。\n\n### 21.4.2 噪声网络的 DQN 方法\n\n为了将此方法应用于 MountainCar，我们只需要将层替换为\
  \ `NoisyLinear`。架构如下：\n\n```\nMountainCarDQN(\n  Sequential(\n    NoisyLinear(2,\
  \ 128, bias=True),\n    ReLU(),\n    NoisyLinear(128, 128, bias=True),\n    ReLU(),\n\
  \    NoisyLinear(128, 3, bias=True)\n  )\n)\n```\n\n`NoisyLinear` 类与 `Linear` 类的唯一区别在于它有一个\
  \ `sample_noise()` 方法来更新张量。我们在每次迭代中都会调用该方法。该 DQN 方法位于 `Chapter21(dqb_extra.py)`\
  \ 模块中。代码与之前相同，为了激活噪声网络，必须使用选项 `-p noisynet` 进行训练。\n\n图 21.6 到图 21.8 显示了我在小时后获得的结果。\n\
  \n![图像](img/21_08.jpg)\n\n**图 21.6：** 使用噪声网络进行 DQN 训练时的奖励\n\n![图像](img/21_09.jpg)\n\
  \n**图 21.7：** 训练回合的长度\n\n![图像](img/21_10.jpg)\n\n**图 21.8：** 训练期间的损失\n\n如你所见，训练过程未能达到\
  \ -130 的平均奖励（代码要求的），但仅需 20,000 个回合后就发现了目标状态，这与 ϵ-Greedy 策略相比是一个巨大的进步。事实上，目标状态在 10,000\
  \ 个回合后就被发现了（图 21.6 中曲线的微小上升），但该方法显然没有从这个例子中学到任何东西。\n\n\n\n\n我们应用于 `DQN` 的最后一种探索方法是基于计数的。由于状态空间仅由两个浮点数组成，我们通过将数值四舍五入到小数点三位来生成离散观测，这应该足够区分不同的状态，同时将相似的状态归为一类。对于每个状态，我们记录它出现的次数，并为智能体分配额外的奖励。在离线策略（Off-Policy）方法中训练期间修改奖励可能不是好主意，因此我们检查了其影响。\n\
  \n在这里我不像之前那样显示完整的代码，而是仅强调与标准版本相比的区别。首先，我们对环境应用封装（Wrapper）以跟踪计数并计算内部奖励。以下代码可以在 `Chapter21/lib/common.py`\
  \ 文件找到：\n\n```python\nclass PseudoCountRewardWrapper(gym.Wrapper):\n    def __init__(self,\
  \ env, hash_function = lambda o: o,\n                 reward_scale: float = 1.0):\n\
  \        super(PseudoCountRewardWrapper, self).__init__(env)\n        self.hash_function\
  \ = hash_function\n        self.reward_scale = reward_scale\n        self.counts\
  \ = collections.Counter()\n```\n\n在构造函数中，我们设置环境、可选应用于观测的哈希函数以及内部奖励。此外，我们创建了一个计数器容器类，将哈希后的状态映射到它们的次数。\n\
  \n```python\ndef _count_observation(self, obs) -> float:\n    h = self.hash_function(obs)\n\
  \    self.counts[h] += 1\n    return np.sqrt(1/self.counts[h])\n```\n\n随后，我们定义了一个辅助函数来计算状态的内部奖励。它将哈希函数应用于观测，更新计数器，并使用已知公式计算奖励。\n\
  \n```python\ndef step(self, action):\n    obs, reward, done, info = self.env.step(action)\n\
  \    extra_reward = self._count_observation(obs)\n    return obs, reward + self.reward_scale\
  \ * extra_reward, \\\n           done, info\n```\n\n封装的最后一个方法负责在环境中执行实际的步骤。它调用辅助函数获取奖励，并返回外部奖励与内部奖励之和。\n\
  \n要使用该封装，我们需要向它传递哈希函数，在当前情况下非常简单。\n\n```python\ndef counts_hash(obs):\n    r = obs.tolist()\n\
  \    return tuple(map(lambda v: round(v, 3), r))\n```\n\n四舍五入保留三位可能已经太多了，但你可以尝试其他状态哈希方法。\n\
  \n启动训练时，必须向程序传递 `-p` `counts`。我的结果相当意外：该方法仅需 27 分钟和 9,300 个回合（Episodes）就解决了环境。这确实令人印象深刻。我的输出结果如下：\n\
