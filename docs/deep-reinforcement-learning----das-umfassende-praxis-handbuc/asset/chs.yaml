  \ Actor 使用了不同的类。我的模型结果如下：\n\n```\nrl_book_samples/Chapter17$ adhoc/record_ddpg.sh\
  \ saves/ddpg-\nt5-simpler-critic/best_+3.933_248400.dat res/play-ddpg\npy build\
  \ time: Nov 12 2019 14:02:55\n1000 步, 5.346 奖励\n```\n\n## 17.6 分布梯度\n\n本章的最后一个方法基于\
  \ Gabriel Barth-Maron、Matthew W. Hoffman 等人在 2018 年发表的关于分布梯度（Distributional Gradients）的最新论文。可以通过\
  \ [`arxiv.org/abs/1804.08617`](https://arxiv.org/abs/1804.08617) 获取。该方法的全称是 Distributed\
  \ Deterministic Policy Gradients，简称 D4PG。作者针对 DDPG 方法提出了多项改进，以提高稳定性、收敛性和样本效率。\n\n\
  作者将 Q 值的表示调整为分布，这种方法源于 2017 年由 Mark Bellemare 等人发表的名为 *A Distributional Perspective\
  \ on Reinforcement Learning* 的论文（[`arxiv.org/abs/1707.06887`](https://arxiv.org/abs/1707.06887)）。我在第\
  \ 8 章 讨论 DQN 方法的改进时曾探讨过这种方法。核心思想是用概率分布来代替单个 Q 值。Bellman 方程被 Bellman 算子取代，该算子可以生成分布的表示。\n\
  \n第二个改进是应用 Bellman 方程来加速收敛，这我在第 8 章 中讨论过。相对于 DDPG 的另一个改进是使用优先经验回放（Prioritized Experience\
  \ Replay）而不是普通的池化，这源于 2017 年由 Hassel 等人发表的名为 *Rainbow: Combining Improvements in\
  \ Reinforcement Learning* 的论文（[`arxiv.org/abs/1710.0298`](https://arxiv.org/abs/1710.0298)）。D4PG\
  \ 结合了这些改进。\n\n\n\n\n正如你看到的，`softmax` 并不是网络的一部分，因为我们在训练过程中将使用更稳定的 `log_softmax()`\
  \ 函数。因此，只有当我们真正需要访问实际概率时，才应用 `softmax()`。D4PG 的 Agent 类要简单得多，而且不需要维护状态。\n\n```python\n\
  class AgentD4PG(ptan.agent.BaseAgent):\n    def __init__(self, net, device=\"cpu\"\
  , epsilon=0.3):\n        self.net = net\n        self.device = device\n        self.epsilon\
  \ = epsilon\n\n    def __call__(self, states, agent_states):\n        states_v =\
  \ ptan.agent.float32_preprocessor(states))\n        states_v = states_v.to(self.device)\n\
  \        mu_v = self.net(states_v)\n        actions = mu_v.data.cpu().numpy()\n\
  \        actions += self.epsilon * np.random.normal(\n            size=actions.shape)\n\
  \        actions = np.clip(actions, -1, 1)\n        return actions, agent_states\n\
  ```\n\n对于每一个需要转换为动作的状态，Agent 会应用 Actor 网络，并在动作中添加经过 Epsilon 值缩放的高斯噪声。在训练代码中，我们使用下面的超参数。我使用了一个大小为\
  \ 100,000 的较小的 Replay Buffer，效果良好。（在 D4PG 文章中，作者使用的是包含百万次转换的 Buffer。）该 Buffer 预先用环境中填充了\
  \ 10,000 个示例，然后启动了训练。\n\n```python\nENV_ID = \"MinitaurBulletEnv-v0\"\nGAMMA = 0.99\n\
  BATCH_SIZE = 64\nLEARNING_RATE = 1e-4\nREPLAY_SIZE = 100000\nREPLAY_INITIAL = 10000\n\
  REWARD_STEPS = 5\n\nTEST_ITERS = 1000\n\nVmax = 10\nVmin = -10\nN_ATOMS = 51\nDELTA_Z\
  \ = (Vmax - Vmin) / (N_ATOMS - 1)\n```\n\n在训练循环中，我们执行与之前相同的两个步骤：训练 Critic 和 Actor。区别在于\
  \ Critic 损失的计算方式。\n\n```python\nbatch = buffer.sample(BATCH_SIZE)\nstates_v, actions_v,\
  \ rewards_v, dones_mask, last_states_v =\n    common.unpack_batch_ddpg(batch, device)\n\
  \n# 训练 Critic\ncrt_opt.zero_grad()\ncrt_distr_v = crt_net(states_v, actions_v)\n\
  last_act_v = tgt_act_net.target_model(last_states_v)\nlast_distr_v = F.softmax(\n\
  \    tgt_crt_net.target_model(\n        last_states_v, last_act_v), dim=1)\n```\n\
  \n训练 Critic 的第一步，我们获取状态和执行动作的概率分布。该概率分布在计算交叉熵损失时作为输入。为了计算目标概率分布，我们需要计算上一个状态的概率分布并执行贝尔曼投影（Bellman\
  \ projection）。\n\n```python\nproj_distr_v = distr_projection(last_distr_v,rewards_v,\n\
  \        dones_mask, gamma=GAMMA**REWARD_STEPS, device=device)\n```\n\n投影函数有点复杂，将在观察训练循环后进行解释。无论如何，它计算了\
  \ `last_states` 概率分布的转换，该分布根据即时奖励进行偏移并根据折扣因子进行缩放。结果是我们的网络应该返回的目标概率分布。由于 PyTorch\
  \ 中没有通用的交叉熵损失函数，我们通过将输入概率的对数与目标概率相乘来手动计算。\n\n```python\nprob_dist_v = -F.log_softmax(\n\
  \    crt_distr_v, dim=1) * proj_distr_v\ncritic_loss_v = prob_dist_v.sum(dim=1).mean()\n\
  critic_loss_v.backward()\ncrt_opt.step()\n```\n\n训练 Actor 要简单得多，与 DDPG 方法的区别仅在于使用\
  \ `distr_to_q()` 函数将概率分布转换为单个平均 Q 值。\n\n```python\n# 训练 Actor\nact_opt.zero_grad()\n\
  cur_actions_v = act_net(states_v)\ncrt_distr_v = crt_net(states_v, cur_actions_v)\n\
  actor_loss_v = -crt_net.distr_to_q(crt_distr_v)\nactor_loss_v = actor_loss_v.mean()\n\
  actor_loss_v.backward()\nact_opt.step()\ntb_tracker.track(\"loss_actor\", actor_loss_v,\
  \ frame_idx)\n```\n\n现在是 D4PG 最复杂的部分：概率的投影。在循环中，我们必须处理投影值落在两个原子之间的情况。然后我们计算比例并将投影值分配到这些原子上。\n\
  \n```python\ndef distr_projection(next_distr_v, rewards_v, dones_mask, gamma, device):\n\
  \    proj_distr = np.zeros_like(next_distr_v)\n    batch_size = next_distr_v.shape[0]\n\
  \    for atom in range(N_ATOMS):\n        target_z = rewards_v + gamma**REWARD_STEPS\
  \ * (atom * DELTA_Z)\n        # ... (logic for projection)\n```\n\n\n\n[content]\n\
  `D4PG` 算法在收敛速度和获得的奖励方面均取得了最佳结果。在经过七小时的训练和约一百万次观测后，它达到了 7.2 的平均奖励。训练过程比本章中的其他方法要稳定得多，但不同运行之间的结果存在显著差异。例如，在为本书初版运行的实验中，我使用相同的代码，在两次百万次观测后获得了了\
  \ 12.9 的奖励。\n\n从图 17.8 到图 17.10 的图表显示了与之前算法类似的轨迹。\n\n![\\[Bild\\]](Images/17_21.jpg)\n\
