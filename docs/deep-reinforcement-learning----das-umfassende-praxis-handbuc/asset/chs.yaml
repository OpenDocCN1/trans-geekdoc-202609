  3: 奖励平均值=67.70, 奖励最大值=84.29,\n奖励σ=8.21, 速度=6070.31 f/s\n4: 奖励平均值=69.85, 奖励最大值=86.38,\n\
  奖励σ=9.37, 速度=6612.48 f/s\n5: 奖励平均值=65.59, 奖励最大值=86.38,\n奖励σ=7.95, 速度=6542.46 f/s\n\
  6: 奖励平均值=77.29, 奖励最大值=98.53,\n奖励σ=11.13, 速度=6949.59 f/s\n```\n\n在相同环境下的演变过程与 ES（进化策略）实验相似，并且在克服\
