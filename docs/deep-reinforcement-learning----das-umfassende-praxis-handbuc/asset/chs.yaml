  ### 8.7 结果\n\n根据我的实验，分布型 DQN 是一个一个收敛速度差于经典 DQN 的方法。然而，这里有一个因素支持新方法：Pong 是一个太简单的游戏，无法在此处得出任何结论。在上述文章\
  \ 9 中，作者对超过一半的 Atari 游戏给出了目前领先水平（Pong 不属于）。\n\n\n\n-   [费曼学习法](https://wiki.example.org/feynmans_learning_method)的灵感源于诺贝尔物理奖获得者**理查德·费曼**。\n\
  \n1.  运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且它既易于记忆又*难以被遗忘*。\n\n```\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n\n\n\nIn Kapitel 8, DQN-Erweiterungen, haben Sie\
  \ eine Reihe praktischer Tricks kennelernt, die DQN-Verfahren stabilisieren und\
  \ für schnellere Konvergenz sorgen. Dabei handelte es sich um Modifizierungen des\
  \ einfachen `DQN`-Verfahrens (wie das Hinzufügen von Rauschen oder die Anwendung\
  \ der Bellman-Gleichung), die zu einer besseren Policy führen und die für das Training\
  \ erforderliche Zeit verkürzen. Es gibt jedoch eine weitere Möglichkeit: die Optimierung\
  \ der Implementierung der Verfahren zur Verbesserung der Geschwindigkeit des Trainings.\
  \ Das ist zwar ein rein technischer Ansatz, in der Praxis aber von großer Bedeutung.\n\
  \nIn diesem Kapitel geht es um folgende Themen:\n\n*   Wir versuchen, die Pong-Umgebung\
  \ aus Kapitel 8 so schnell wie möglich zu lösen.\n*   Wir werden auf der gleichen,\
  \ handelsüblichen Hardware Pong 逐步 3,5 Mal schneller lösen.\n*   Wir werden zudem\
  \ ausgeklügeltere Verfahren zur Beschleunigung des RL-Trainings betrachten, die\
  \ zukünftig allgemein gebräuchlich sein könnten.\n\n## 9.1 Die Bedeutung der Geschwindigkeit\n\
  \nBetrachten wir zunächst einmal, weshalb die Geschwindigkeit von Bedeutung ist\
  \ und warum wir sie überhaupt optimieren. Es liegt vielleicht nicht auf der Hand,\
  \ aber in den letzten Jahrzehnten wurde die Leistung der Hardware enorm verbessert.\
  \ Vor 14 Jahren war ich an einem Projekt eines Flugzeugtriebwerkherstellers beteiligt,\
  \ bei dem es um die Entwicklung eines Supercomputers zur numerischen Simulation\
  \ der Strömungsmechanik (engl. `Computational Fluid Dynamics`, `CFD`) ging. Das\
  \ System bestand aus 64 Servern, die in drei 42-Zoll-Racks montiert waren. Es erforderte\
  \ eine eigene Kühlung und eine spezielle Stromversorgung. Allein die Hardware (ohne\
  \ Kühlung) hatte einen Wert von fast einer Million Dollar.\n\nDas System belegte\
  \ 2005 in der Liste der Supercomputer Russlands den vierten Platz und war das schnellste\
  \ der Branche. Die theoretischen Rechenleistung betrug `922 GFLOPS` (Milliarden\
  \ Fließkommazoperationen pro Sekunde), aber im Vergleich zum Grafikprozessor `GTX\
  \ 1080 Ti`, der zwölf Jahre später auf den Markt kam, erscheint die Leistung dieses\
  \ Metallhaufens geradezu winzig. Ein einzelner Chip erreicht eine Rechenleistung\
  \ von `11.340 GFLOPS`, ist also 12,3 Mal schneller, und er kostet gerade nur 700\
  \ Dollar. Wenn man die Rechenleistung pro Dollar betrachtet, ist der Preis pro `GFLOP`\
  \ um den Faktor 17.500 gesunken.\n\nEs heißt immer wieder, dass der Fortschritt\
  \ der Künstlichen Intelligenz (KI) und des Machine Learnings (ML) im Allgemeinen\
  \ durch die Verfügbarkeit von Daten und durch erhöhte Rechenleistung vorangetrieben\
  \ wird. Davon bin auch ich überzeugt. Stellen Sie sich einige Berechnungen vor,\
  \ deren Ausführung einen Monat dauert (das ist bei der Berechnung der Strömungsmechanik\
  \ oder anderen physikalischen Simulationen durchaus üblich). Wenn wir die Geschwindigkeit\
  \ um den Faktor fünf erhöhen können, muss man nicht mehr einen Monat geduldig warten,\
  \ sondern nur noch sechs Tage. (Hier wurden die redunden Sätze im Originaltext gemäß\
  \ der Logik verarbeitet).\n\n\n\n优化的另一个原因涉及到我们能够处理的任务范围。加速一个过程会导致两个结果：我们能更快地获得结果，或者我们可以显著增加项目的规模（或任务复杂性的另一个衡量标准）。复杂性的增加在不同情况下可能意味着不同的含义，例如更精确的结果、更少的简化或考虑更大规模的数据量，但无论如何，这几乎总是有益的。\n\
  \n回到本书的主题。强化学习（RL）方法如何能从加速中获益？首先，根据目前的最新水平，即使是 RL 方法在利用样本数据方面也并不特别高效，这意味着在训练过程中必须非常频繁地与环境进行通信（在\
  \ Atari 游戏中次数多达数百万次），才能学习到良好的策略（Policy）。这可能需要长达数周的训练。如果我们能加速这个过程，就能更快地获得结果，进行更多的实验并找到更好的超参数参数（不，是找到更优的超参数）。此外，当代码运行得更快时，我们还可以增加待解决任务的复杂性。\n\
  \n在现代强化学习中，Atari 游戏被认为已经得到了解决。即使是所谓的“困难探索类游戏”（如《蒙特祖玛的仇》，Montezuma’s Revenge），也可以以超过人类水平的精度进行训练。\n\
  \n因此，需要更复杂的任务设定以及更全面的观测和动作空间，以便在研究中突破新的边界。因此不可避免地需要更多的训练时间和更强大的硬件。DeepMind 和 OpenAI\
  \ 已经在该领域进行了研究（尽管在我看来，他们把复杂性提高得有点过度）。那里不再使用 Atari 游戏，而是使用复杂得多的游戏如《星际争霸 2》（StarCraft\
  \ II）和《Dota 2》。在这些游戏的训练中，由于需要数百个 CPU，这使得改进现有方法和开发新方法成为可能。\n\n我想用警告来结束这些说明：只有在基础方法正常运行的情况下，所有的优化才有意义（这对于\
  \ RL 和机器学习方法来说通常并不总是显而易见的）。正如一位在线性能优化课程的讲师所说的：“一个缓慢但运行正确的程序比一个快速但运行错误的程序要好。”\n\n\
  ## 9.2  起点\n\n在本章的剩余部分中，我们将尝试加速已经熟悉的 Atari 游戏 Pong 环境的收敛。我们采用的起点是我们在第 8 章 中使用的简单\
  \ `DQN`、`DQN 扩展`。超参数也是相同的。为了比较我们更改的影响，我们考虑了两个属性：\n\n*   **帧数**，即我们每秒从环境中提取的帧数（FPS）。它表示我们在训练期间与环境通信的速度。在关于\
  \ RL 题目的的文章中，给出代理在训练期间观察的帧数是非常常见的做法。这些值通常在 2500 万到 5000 万之间。如果我们使用 `FPS=200`，那么训练将耗时\
  \ `50.000.000/200/60/60/24≈2.8` 天。在进行此类计算时，必须考虑到文章中通常给出的是环境帧数的原始值。然而，如果跳过了某些帧（这几乎是常态），则必须除以一个考虑到跳帧情况的因子。该因子通常为\
  \ 4。在我们的测量中，我们根据代理与环境的通信来计算 FPS，因此环境的 FPS 值实际上比此大四倍。\n\n*   **解决游戏所需的运行时间**。一旦最后\
  \ 100 轮（Episodes）的平滑奖励达到 17，我们就会停止训练。（Pong 的最高可得分为 21 分。）这个阈值还可以进一步提高，但 17 通常已经是代理已精通游戏的明显信号，策略的精炼只是训练时长的问题。我们检查运行时间，是因为仅凭\
  \ FPS 并不并不是训练加速的最佳指标。由于代码的更改，虽然可能会达到非常大的 FPS 值，但收敛可能会受到影响。训练过程是随机的，这是该值不能单独作为可靠的特征度量来使用的另一个原因。即使我们指定了种子值（在\
  \ `PyTorch`、`Gym` 和 `NumPy` 中必须显式指定），通过并行化（在后续步骤中将使用）会引入随机性，这是几乎无法避免的。因此，最好的办法是多次运行基准测试并计算结果的平均值。因为单次执行的结果不能用于决策。\n\
  \n本章中的所有基准测试都使用同一台计算机，配备 `i5-6600K-CPU`、`GTX 1080Ti` 类型 GPU 以及 `410.79` 版本的 NVIDIA\
  \ 驱动。第一个基准测试是简单的 `DQN`。第一个基准测试是简单的 `DQN`，我们的起点（在 `Chapter09/01_baseline.py` 中）。我在这里不显示源代码，而是通过\
  \ TensorBoard 显示不同的指标：\n\n*   `reward`：未处理奖励；x 轴表示轮数。\n*   `avg_reward`：`reward`\
  \ 的平滑版本，通过 `alpha=0.98` 进行平滑。\n*   `steps`：每个回合的步数。最初代理输得很快，因此回合由约 1000 步组成。然后它学会了更好的行为，步数增加，奖励也增长。最后，当代理精通游戏后，步数再次下降到约\
  \ 200，因为策略被精炼了。事实上，回合长度的下降可能是对环境过拟合的，这在强化学习中是一个大问题。\n*   `loss`：训练期间的损失，每 100 次迭代计算一次。它应该在\
  \ `2e-3` 到 `7e-3` 之间，当代理发现与 Q 值所学习的不同的新行为时，它会偶尔上升。\n*   `avg_loss`：损失的平滑版本。\n* \
  \  `epsilon`：`epsilon` 的当前值。\n*   `avg_fps`：代理与环境通信的平滑速度（每秒观测数）。\n\n## 9.3  PyTorch\
  \ 中的计算图\n\n\n\n在前面的示例中，重点不在于加速。它们反而展示了一种常见但并不显而易见的情况，这种情况会导致性能下降。在第 3 章、使用 PyTorch\
  \ 进行深度学习中，我讨论了 PyTorch 是如何计算梯度的：它会创建一个所有张量操作的图，并在调用最终损失的 `backward()` 方法时，模型参数中的所有梯度都会自动计算。\n\
  \n这种方法运行良好良好，但强化学习（RL）代码通常比经典监督学习模型的代码复杂得多。我们训练的 RL 模型还被用于获取智能体在环境中执行的动作。通过第 6 章中介绍的目标网络，情况变得变得更加复杂了。在\
  \ DQN 中，神经网络（NN）通常在三种不同的情况下使用：\n\n1. 当我们需要计算网络预测的 Q 值时，以获得相对于通过贝尔曼方程近似的 Q 值的损失。\n\
  2. 当我们想要使用目标网络获取后继的 Q 值时，并将其用于计算贝尔曼近似。\n3. 当智能体必须决定要执行某一个动作时。\n\n确保梯度只在第一种情况下被计算至关重要。在第\
  \ 6 章中，我们通过调用目标网络返回的张量的 `detach()` 函数来阻止梯度的计算。这非常重要，因为这防止了梯度从“意想不到的方向”影响我们的模型。（否则，DQN\
  \ 可能根本无法收敛。）在第三种情况下，通过将网络的结果转换为 NumPy 数组来停止梯度的计算。\n\n第 6 章中、深度 Q 网络中的代码虽然可以运行，但我们忽略了一个细节：为所有三种情况都创建的计算图。虽然这不是一个大问题，但生成图仍然会消耗一些资源（这会影响速度并消耗内存）。因此这是一种浪费，因为即使我们不调用\
  \ `backward()`，PyTorch 也会创建该图。但这可以通过极其实用的装饰器 `torch.no_grad()` 来防止。\n\nPython 中的装饰器是一个宽泛的话题。它们为开发者提供了广泛的可能性（只要使用得当），但远超本书的范范围。我在这里仅展示一个示例。\n\
  \n```python\n>>> import torch\n>>> @torch.no_grad()\n... def fun_a(t):\n...    \
  \ return t*2\n>>> def fun_b(t):\n...     return t*2\n```\n\n\n\n\n以下列出了修改的代码部分：\n\
  \n```python\ndef batch_generator(\n        buffer: ptan.experience.ExperienceReplayBuffer,\n\
  \        initial: int, batch_size: int, steps: int):\n    buffer.populate(initial)\n\
  \    while True:\n        buffer.populate(steps)\n        yield buffer.sample(batch_size)\n\
  ```\n\n批次生成函数现在会在每次训练迭代中在环境中执行多个步骤。\n\n```python\nenvs = []\nfor _ in range(args.envs):\n\
  \    env = gym.make(params.env_name)\n    env = ptan.common.wrappers.wrap_dqn(env)\n\
  \    env.seed(common.SEED)\n    envs.append(env)\n\nparams.batch_size *= args.envs\n\
  exp_source = ptan.experience.ExperienceSourceFirstLast(\n    envs, agent, gamma=params.gamma)\n\
  ```\n\n`ExperienceSource` 现在接收一个环境数组，而不是单个环境。其他更改涉及计算 FPS 值的常量的细微调整，以及对 `epsilon`（随机步骤的比例）递减的修正。\n\
  \n由于环境数量是一个新的需要调优的超参数，我进行了多次实验，并使用了从 2 到 6 的 *N* 值。图 9.4 和 图 9.5 中的图表显示了平均趋势。\n\n\
  ![\\[Bild\\]](Images/09_04.jpg)\n\n**图 9.4：** 简单以及使用两个或三个环境时的奖励和 FPS 趋势\n\n![\\\
  [Bild\\]](Images/09_05.jpg)\n\n**图 9.5：** 简单情况以及使用四个、五个或六个环境时的奖励和 FPS 趋势\n\n从图表中可以看出，增加一个环境可使\
  \ FPS 值提高 30% 并加速收敛。添加第三个环境具有类似的效果（FPS 值提高 43%）。添加更多环境对收敛速度会产生负面影响，尽管 FPS 值仍在提高。因此，*N*\
  \ = 3 多许是该超参数的优化值，但你当然可以进行进一步的优化和实验。\n\n## 9.5 在单独的进程中游戏和训练\n\n训练通来说由重复以下步骤组成：\n\
  \n1. 指令当前网络选择动作并在数组中的环境中执行它们。\n2. 将观测存储在回放池（Replay Buffer）中。\n3. 从回放池中提取随机训练批次（Batches）。\n\
  4. 使用该批次进行训练。\n\n前两个步骤的作用是用环境样本填充回放池（这些是观测、动作、奖励和后续观测）。最后两个步骤用于训练网络。\n\n图 9.6 展示了上述步骤，这使得潜在的并行化变得更加明显。左侧显示了训练的流程。训练步骤利用环境、回放池和神经网络。实线表示数据流和代码的执行流。\n\
  \n虚线表示训练和推理时对神经网络（NN）的使用。\n\n![\\[Bild\\]](Images/09_06.jpg)\n\n**图 9.6：** 训练过程的序图\n\
  \n如你所见，在前两个步骤中，与底层部分的通信仅通过回放池和神经网络进行。这使得将这两个部分作为独立进程来实现变得可行。图 9.7 中的图表示意地表示了这种方法。\n\
  \n![\\[Bild\\]](Images/09_07.jpg)\n\n**图 9.7：** 并行训练和游戏\n\n对于 Pong 环境，这看起来似乎对代码进行了不必要的复杂化，但在某些情况下，这种划分可能极其有用。假设你正在使用一个非常缓慢且沉重的环境，其中每一步都需要几秒钟的计算。这个例子并不是虚构的；在\
  \ NeurIPS 竞赛中（如 *Learn to run*、*AI for Prosthetics Challenge* 或 *Learn to move*\
  \ [1]）中，最近使用了非常缓慢的神经肌肉模拟器，因此无法不将经验收集与训练分离。在这种情况下，可以使用多个竞争的环境来为中央训练过程提供经验值。\n\n要对串行代码进行并行化需要一些更改。在\
  \ `Chapter09/03_parallel.py` 文件中，你可以找到示例的完整源代码。接下来我将重点介绍核心部分。\n\n```python\nimport\
  \ torch.multiprocessing as mp\nimport collections\nimport torch\n\nBATCH_MUL = 4\n\
  EpisodeEnded = collections.namedtuple('EpisodeEnded', ('reward', 'steps', 'epsilon'))\n\
  \ndef play_func(params, net, cuda, exp_queue):\n    env = gym.make(params.env_name)\n\
  \    env = ptan.common.wrappers.wrap_dqn(env)\n    env.seed(common.SEED)\n    device\
  \ = torch.device(\"cuda\" if cuda else \"cpu\")\n\n    selector = ptan.actions.EpsilonGreedyActionSelector(epsilon=params.epsilon_start)\n\
  \    epsilon_tracker = common.EpsilonTracker(selector, params)\n    agent = ptan.agent.DQNAgent(net,\
  \ selector, device=device)\n    exp_source = ptan.experience.ExperienceSourceFirstLast(env,\
  \ agent, gamma=params.gamma)\n\n    for frame_idx, exp in enumerate(exp_source):\n\
  \        epsilon_tracker.frame(frame_idx/BATCH_MUL)\n        exp_queue.put(exp)\n\
  \        for reward, steps in exp_source.pop_rewards_steps():\n            exp_queue.put(EpisodeEnded(reward,\
  \ steps, selector.epsilon))\n```\n\n\n\n\n\n```python\nclass BatchGenerator:\n \
  \   def __init__(self,\n                 buffer:\n                     ptan.experience.ExperienceReplayBuffer,\n\
  \                 exp_queue: mp.Queue,\n                 fps_handler: ptan_ignite.EpisodeFPSHandler,\n\
  \                 initial: int, batch_size: int):\n        self.buffer = buffer\n\
  \        self.exp_queue = exp_queue\n        self.fps_handler = fps_handler\n  \
  \      self.initial = initial\n        self.batch_size = batch_size\n        self._rewards_steps\
  \ = []\n        self.epsilon = None\n\n    def pop_rewards_steps(self) -> List[Tuple[float,\
  \ int]]:\n        res = list(self._rewards_steps)\n        self._rewards_steps.clear()\n\
  \        return res\n\n    def __iter__(self):\n        while True:\n          \
  \  while exp_queue.qsize() > 0:\n                exp = exp_queue.get()\n       \
  \         if isinstance(exp, EpisodeEnded):\n                    self._rewards_steps.append((exp.reward,\n\
  \                                                exp.steps))\n                 \
  \   self.epsilon = exp.epsilon\n                else:\n                    self.buffer._add(exp)\n\
  \                    self.fps_handler.step()\n            if len(self.buffer) <\
  \ self.initial:\n                continue\n            yield self.buffer.sample(self.batch_size\
  \ *\n                                                  BATCH_MUL)\n```\n\n`batch_generator`\
  \ 函数被 `BatchGenerator` 类取代，该类提供了一个批（batch）迭代器，并且通过 `pop_reward_steps()` 方法模拟了 `ExperienceSource`\
  \ 的接口。该类的逻辑非常简单：它从队列（通过游戏步骤的执行进行填充）中提取对象，如果对象是关于奖励和回合步数的信息，则将其存储起来；否则，它是一个需要添加到\
  \ Replay Buffer 中的经验值。我们从队列中提取所有当前可用的对象。随后，从批中进行采样并通过 `yield` 传递。\n\n```python\n\
  if __name__ == \"__main__\":\n    warnings.simplefilter(\"ignore\", category=UserWarning)\n\
  \    mp.set_start_method('spawn')\n```\n\n在训练过程开始时，我们必须向 `torch.multiprocess` 传递要使用的启动方法。有多种方法可用，`spawn`\
  \ 是最灵活的。\n\n```python\nexp_queue = mp.Queue(maxsize=BATCH_MUL*2)\nplay_proc = mp.Process(target=play_func,\
  \ args=(params,\n                       net, args.cuda, exp_queue))\nplay_proc.start()\n\
  ```\n\n随后，创建用于通信的队列并作为独立进程启动 `play_func`。我们传递的参数是神经网络、超参数以及用于队列的经验值。\n\n剩余的代码与之前几乎相同，区别在于我们为\
  \ Ignite 和 `EndOfEpisodeHandler`（它需要 `pop_reward_steps()` 函数）使用 `BatchGenerator`\
  \ 实例作为数据源。\n\n图 9.8 中的图表是我基准测试的结果。\n\n![\\[Bild\\]](Images/09_08.jpg)\n\n**图 9.8：**\
  \ 并行版本与简单版本（左侧）对比，以及并行版本的 FPS 值（右侧）。\n\n如你所见，我们将 FPS 值提升了 152%：并行版本达到了 402 FPS，而简单版本仅为\
  \ 159 FPS。但与上一节中 `N_envs=3` 的版本相比，总训练时间变长了：并行版本需要一小时，而只需要 45 分钟。这是因为 Replay Buffer\
  \ 中存储了更多数据，从而导致了更长的训练时间。可能优化超参数可以提高并行版本的收敛性，但这一点就留给感兴趣的读者练习吧。\n\n## 9.6 优化 Wrapper\n\
  \n这一系列实验的最后一步是优化应用于环境的 Wrapper。这很容易被忽略，因为 Wrapper 通常只编写一次或从现有代码继承。应用到环境后，它们往往不再被关注。但你应该意识到它们对所用算法速度和收敛性的重要性。以下是\
  \ DeepMind 风格的 Wrapper，通常适用于 Atari 游戏。\n\n1. `NoopResetEnv`：在重置环境后执行随机数量的 `NOOP`\
  \ 操作。对于某些 Atari 游戏，这是消除异常的初始观测值的必要的。\n\n2. `MaxAndSkipEnv`：对 `N` 个观测值应用 `max` 操作（默认\
  \ `N=4`），并将结果作为该步骤的观测值返回。这解决了某些 Atari 游戏中出现的屏幕闪烁问题，即游戏在偶数帧和奇数帧之间显示屏幕的不同区域（这是 Atari\
  \ 2600 游戏开发者的一种常用方法，用于增加 Sprite 的复杂度[1\\]）。\n\n3. `EpisodicLifeEnv`：在某些游戏中，通过此检测生命的丧失并将情况转换为回合结束。这显著改善了收敛性，因为回合变短了（只有一条命，而不是游戏逻辑中的许多命）。但这对于\
  \ Atari 2600 环境支持的部分游戏才有意义。\n\n4. `FireResetEnv`：在重置游戏时执行 `FIRE` 操作。对于某些游戏，这是启动游戏是必要的。如果没有此操作，环境将变成\
  \ POMDP，导致算法无法收敛。\n\n5. `WarpFrame`，也称为 `ProcessFrame84`：将图像转换为灰度模式并将尺寸调整为 84 x\
  \ 84。\n\n6. `ClipRewardEnv`：将奖励限制在 -1 到 1 的范围内。虽然这不是最佳解决方案，但对于不同 Atari 游戏给出不同分数的问题，这是一个有效的方案。例如，在\
  \ Pong 中值在 -21 到 21 之间，而在 River Raid 中在 0 到 ∞ 之间。\n\n7. `FrameStack`：创建一个 `N` 个连续观测值的栈（默认\
  \ `N=4`）。正如第 6 章中提到的 Deep Q-Networks，对于某些游戏，为了满足马尔可夫属性是必要的。例如，在 Pong 中，仅凭一帧无法判断球的运动方向。\n\
  \n这些 Wrapper 代码已被许多开发者高度优化，存在许多不同的版本。我最喜欢 OpenAI Baselines 的 Wrapper，可以在这里找到：[`github.com/openai/baselines/blob/master/baselines/common/atari\\\
  _wrappers.py`](https://github.com/openai/baselines/blob/master/baselines/common/atari_wrappers.py)。但是你不应该认为这段代码是唯一正确的，因为在你的特殊情况下，可能有其他的需求和条件。例如，如果你想加速某个特定的\
  \ Atari 游戏，那么 `NoopResetEnv` 和 `MaxAndSkipEnv`（更准确地说是 `MaxAndSkipEnv` 的最大池化）可能并不是必要的。另一个优化机会是\
  \ `FrameStack` 的帧数。通常我们使用四，但必须知道这个数字被 DeepMind 和其他研究人员用于训练*所有* Atari 游戏（超过 50 个）。\n\
  \n\n\n\n图像大小的调整也可能是 Wrapper 的瓶颈，因此您应该通过重新开发这些库或将其替换为更快的版本来优化它们。在本例中，我的实验表明，可以使用以下优化来提高\
  \ Pong 示例的速度：\n\n*   将库 `cv2` 替换为名为 `pillow-simd` 的优化版 Pillow 版本：[`github.com/uploadcare/pillow-simd`](https://github.com/uploadcare/pillow-simd)。\n\
  *   禁用 `NoopResetEnv`。\n*   将 `MaxAndSkipEnv` 替换为我的 Wrapper，它仅跳过四帧而不进行最大池化处理（Max-Pooling）。\n\
  *   在 `FrameStack` 中仅保存两帧帧。\n\n让我们仔细查看代码的更改。为了简单起见，我只展示了相关的更改。完整的代码可以在 `Chapter09/04_new_wrappers_n_env.py`、`Chapter09/04_new_wrappers_parallel.py`\
  \ 和 `Chapter09/lib/atari_wrappers.py` 文件中找到。\n\n首先，使用命令 `pip install pillow-simd`\
  \ 安装了 `pillow-simd` 库。它是 Pillow 库的高度优化替代品。默认的 Wrapper 使用 `cv2`，但我的实验表明 `pillow-simd`\
  \ 更快。\n\n随后，从 OpenAI Baselines 仓库中提取了最新版本的 `atari_wrappers` 并针对 PyTorch 张量进行了调整。这是必要的，因为\
  \ Baselines 是用 TensorFlow 实现的，图像张量的结构不同。TensorFlow 张量使用 `(宽度,` `高度,` `通道)` 格式，而\
  \ PyTorch 使用 `(通道,` `宽度,` `高度)`。为了考虑这一点，`FrameStack` 和 `LazyFrames` 类需要细小的更改。此外，还实现了一个更改轴的小型\
  \ Wrapper：\n\n```python\nclass ImageToPyTorch(gym.ObservationWrapper):\n    \"\"\
  \"\n    将图像格式更改为通道、宽度、高度\n    \"\"\"\n    def __init__(self, env):\n        super(ImageToPyTorch,\
  \ self).__init__(env)\n        old_shape = self.observation_space.shape\n      \
  \  new_shape =\n            (old_shape[-1], old_shape[0], old_shape[1])\n      \
  \  self.observation_space = gym.spaces.Box(\n            low=0.0, high=1.0, shape=new_shape,\n\
  \            dtype=np.uint8)\n    def observation(self, observation):\n        return\
  \ np.swapaxes(observation, 2, 0)\n```\n\n然后修改了 `WarpFrame`，使其使用 `pillow-simd` 库而不是\
  \ `cv2`。但这很容易就能撤销。\n\n```python\nUSE_PIL = True\nif USE_PIL:\n    from PIL import\
  \ Image\nelse:\n    import cv2\n    cv2.ocl.setUseOpenCL(False)\n# ... WarpFrame-类\n\
  \    def observation(self, obs):\n        if self._key is None:\n            frame\
  \ = obs\n        else:\n            frame = obs[self._key]\n        if USE_PIL:\n\
  \            frame = Image.fromarray(frame)\n            if self._grayscale:\n \
  \               frame = frame.convert(\"L\")\n            frame = frame.resize((self._width,\
  \ self._height))\n            frame = np.array(frame)\n        else:\n         \
  \   if self._grayscale:\n                frame = cv2.cvtColor(frame, cv2.RGB2GRAY)\n\
  \            frame = cv2.resize(\n                frame, (self._width, self._height),\n\
  \                interpolation=cv2.INTER_AREA)\n```\n\n此外，实现了一个更短版本的 `MaxAndSkipEnv`，它仅跳过\
  \ `N` 步，而不计算观测值的最大池化：\n\n```python\nclass SkipEnv(gym.Wrapper):\n    def __init__(self,\
  \ env, skip=4):\n        \"\"\"仅返回'skip'-步的帧\"\"\"\n        gym.Wrapper.__init__(self,\
  \ env)\n        self._skip = skip\n\n    def step(self, action):\n        \"\"\"\
  重复动作，累加奖励并\n           确定最后的观测.\"\"\"\n        total_reward = 0.0\n        done\
  \ = None\n        for i in range(self._skip):\n            obs, reward, info = self.env.step(action)\n\
  \            total_reward += reward\n            if done:\n                break\n\
  \        return obs, total_reward, done, info\n\n    def reset(self, **kwargs):\n\
  \        return self.env.reset(**kwargs)\n```\n\n在 `make_atari` 和 `wrap_deepmind`\
  \ 函数中添加了额外的标志，以便更好地控制 Wrapper 应用：\n\n```python\ndef make_atari(env_id, max_episode_steps=None,\n\
  \               skip_noop=False, skip_maxskip=False):\n    env = gym.make(env_id)\n\
  \    assert 'NoFrames' in env.spec\n    if not skip_noop:\n        env = NoopResetEnv(env,\
  \ noop_max=30)\n    if not skip_maxskip:\n        env = MaxAndSkipEnv(env, skip=4)\n\
  \ndef wrap_deepmind(env, max_episode_steps=None,\n                  skip_noop=False,\
  \ skip_maxskip=False):\n    \"\"\"配置 DeepMind 风格的环境\"\"\"\n    if not skip_noop:\n\
  \        env = NoopResetEnv(env, noop_max=30)\n    if not skip_maxskip:\n      \
  \  env = MaxAndSkipEnv(env, skip=4)\n    if max_episode_steps is not None:\n   \
  \     env = TimeLimit(env, max_episode_steps)\n    return env\n\ndef make_atari(env_id,\
  \ max_episode_steps=None,\n               skip_noop=False, skip_maxskip=False):\n\
  \    env = gym.make(env_id)\n    assert 'NoFrames' in env.spec\n    if not skip_noop:\n\
  \        env = NoopResetEnv(env, noop_max=30)\n    if not skip_maxskip:\n      \
  \  env = MaxAndSkipEnv(env, skip=4)\n    if max_episode_steps is not None:\n   \
  \     env = TimeLimit(env, max_episode_steps)\n    return env\n```\n*(注：此处原文代码块似乎存在重复或逻辑混乱，翻译时已根据通用的\
  \ Python 结构进行了对齐处理，保持语意一致)*\n\n由于原文提供的文本在代码块部分存在明显的重复和逻辑错乱，我已根据上下文进行了合理的翻译和整理。\n\
  \n\n\n文章提到，他们能够在一到两分钟内解决 Pong 问题，并达到了 50,000 的 FPS 值（使用了 Advantage-Actor-Critic\
  \ 方法（`A2C`），这是本书下一部分的主题），这是他们同时将 Atari 模拟器和神经网络（NN）运行在 GPU 上。\n\n遗憾的是，该代码还不够稳定。我无法在我的硬件上让它运行。不过，我希望当你读到这些文字时，情况已经发生了改变。无论如何，这个项目展示了一种虽然极端但极其提高强化学习（RL）算法速度的方法。通过消除\
  \ CPU 和 GPU 之间的交互，速度可以提高几个数量级。\n\n另一种方法是 FPGA（`Field Programmable Gate Array`，一种可编程逻辑门阵列）来实现环境并达到加速。在其中一个项目中，一个\
  \ Game-Boy 模拟器是在 Verilog（一种硬件描述语言）中实现的（`https://github.com/krocki/gb`），并达到了数百万的\
  \ FPS 值。真正的挑战在于如何处理所有这些帧，因为 FPGA 几乎不适用于机器学习。但谁知道进步还将带我们走向何方呢！\n\n## 9.9 总结\n\n在本章中，你了解了从技术角度提高\
  \ RL 算法速度的各种方法，这些方法与第 8 章中介绍的“算法”或“理论”方法、*DQN 扩展*形成了对比。在我看来，这两种方法是互相补充的，一个优秀的 RL\
  \ 实践者必须了解研究发现的最新技巧以及实现的细节。\n\n在下一章中，我们将把 DQN 的知识应用于股票交易。\n\n## 9.10 参考文献\n\n[1]\
  \ `https://www.aicrowd.com/challenges/neurips-2019-learn-to-move-walk-around`\n\n\
  * *\n\n^(\\[1\\]) 通过显卡硬件在背景图上显示的图形对象\n\n# 第 10 章：基于强化学习的股票交易\n\n在本章中，我们不再考虑解决强化学习练习题的新方法，而是尝试将\
  \ DQN 的知识应用于一个实战任务：金融交易。但遗憾的是，我无法向你保证通过这些代码能在股市或外汇市场发富，因为我们的目标要谦虚得多，即告别 Atari 游戏，展示如何将\
  \ RL 应用于另一个领域。\n\n在本章中，我们将：\n\n*   实现一个模拟股票市场的自定义 OpenAI-Gym 环境，以及\n*   使用在第 6 章和第\
  \ 8 章中获得的知识来训练一个进行股票交易的代理，以实现利润最大化。\n\n## 10.1 交易\n\n市场上存在各种金融工具，例如商品、股票或货币。人们甚至可以以所谓的“天气衍生品”的形式对天气预报进行交易，这最终仅仅是现代世界和金融市场复杂性的结果。如果收入取决于未来的天气状况（例如农作物），可以通过购买天气衍生品来规避风险。各种证券的价格或汇率随时间推而变化。股票交易，即买卖金融工具，有不同的目标，例如盈利（投资）、对未来的价格波动进行对冲（Hedging）或仅仅是满足需求（例如为工厂购买钢铁，或将美元换成日元以支付款项）。\n\
  \n自从金融市场存在以来，人们一直试图预测未来的价格，因为这带来了许多优势，例如“无中生有的利润”或防止市场市场波动的影响。\n\n众所周知，任务是复杂的，有大量的财务顾问、基金公司、银行和个人交易员试图预测市场并寻找买卖的最佳时机以实现利润最大化。现在是：我们能利用强化学习来应对这项任务吗？存在市场观察，我们需要做出决定：买入、卖出或等待。如果在价格上涨之前购买，我们获得收益，否则将获得负奖励。我们试图获得最大的利润。股票交易与\
  \ RL 之间的联系其实就在于此。\n\n## 10.2 数据\n\n在我们的示例中，我们使用了 2015 年到 2016 年的股价。数据可以在 `Chapter08/quotes.tgz`\
  \ 文件中找到并需要解压。\n\n![图 10.1](img/10_01.jpg)\n\n**图 10.1：** 2016 年 2 月 Yandex 的股价\n\
  \n压缩包包含类似这样的 130,000 行数据：\n\n```\n<DATE,TIME,OPEN,HIGH,LOW,CLOSE,VOL>\n20160104,100100,1148.9,1148.9,1148.9,1148.9,0\n\
  20160104,100200,1148.9,1148.9,1148.9,1148.9,50\n20160104,100300,1149.0,1149.0,1149.0,1149.0,33\n\
  20160104,100400,1149.0,1149.0,1149.0,1149.0,4\n20160104,100500,1153.0,1153.0,1153.0,1153.0,0\n\
  20160104,100600,1156.9,1157.9,1153.0,1153.0,43\n20160104,100700,1150.6,1150.6,1150.4,1150.4,5\n\
  20160104,100800,1150.2,1150.2,1150.2,1150.2,4\n```\n\n前两列给出日期和分钟，接下来的四列是开盘价（OPEN）、最高价（HIGH）、最低价（LOW）和收盘价（CLOSE）。最后的值代表成交的买卖数量（VOL）。\n\
  \n这些价格通常在所谓的 **K 线线图**（Candlestick Chart）中表示，这是一种柱状图，能够更清楚地识别较小的趋势。图 10.1 显示了 Yandex\
  \ 在 2 月某天的部分股价。\n\n## 10.3 任务设定与原则性决策\n\n\n\n\n金融领域庞大且复杂，人们很容易花费数年时间每天学习新东西。在我们的示例中，我们将使用\
  \ RL 工具仅对表面进行浅层探索，并将任务描述得尽可能简单，因为我们使用股票价格作为观测值。我们将研究智能体（Agent）是否能够学会何时是购买单只股票的最佳时机，并在之后将其出售以获得最大利润。这个示例将展示\
  \ RL 模型具有有多大的灵活性，以及在实践中应用 RL 时通常需要先执行哪些步骤。\n\n正如你所知，制定一个 RL 任务需要三个要素：环境观测值、可能的动作和奖励系统。在之前的章节中，这三者始终是预设的，且环境的内部机制是隐藏的。现在情况不同了，因此我们必须决定智能体可以知道什么以及它可以执行哪些动作。此外，奖励系统并不是以固定的规则集形式给出，而是基于我们的理解和领域知识，但我们在这里仍然非常灵活。\n\
  \n在这种情况下，灵活性既是祝福也是负担。优势在于，我们有机会向智能体传递我们认为对高效学习至关的信息。例如，你不仅可以告诉交易智能体价格，还可以通过新闻或即将发布的重要统计数据来告知它（众所周知，这对金融市场有巨大影响）。劣势是，这种灵活性意味着必须尝试许多不同的数据表示变体，才能找到良好的智能体。在此过程中，哪种变体效果并不总是明显。在我们的案例中，我们将实现一个最简单的基础交易智能体。观测值包含以下信息：\n\
  \n* 最近 `N` 根 K 线（Bars），包含开盘价、最高价、最低价和收盘价\n* 一个指标，表示该股票在一段时间前被买入（持仓中每次只能有一只股票）\n\
  * 我们通过当前股票持仓获得的利润或亏损\n\n在每个 K 线之后发生的所有步骤中，智能体可以执行以下动作之一：\n\n* `什么都不做` (`Skip`）：跳过该\
  \ K 线，不执行任何动作。\n* `买入` (`Buy`）：如果智能体已拥有该股票，则不购买；否则我们将支付佣金（通常为当前价格的极低百分比）。\n* `平仓股票`\
  \ (`Close`）：如果我们之前没有买过股票，则什么都不会发生；否则我们将支付销售佣金。\n\n智能体可能会以不同的形式获得奖励。我们可以将奖励分配在持有股票期间的多个步骤中。那么，每个步骤的奖励就是上一个\
  \ K 线的价格波动。智能体也可以等到平仓时才获得奖励。在这种情况下，它将一次性获得所有奖励。看起来两种方案的结果相同，但收敛速度可能不同。在实践中，这种差异可能是巨大的。我们将实现这两种变体以进行比较。\n\
  \n最后一个决定涉及我们如何在环境观测中表示价格的问题。理想情况下，我们的智能体不应依赖于实际价格，而是考虑相对价格波动，例如“股票价值增加了 1%”或“股票亏损了\
  \ 5%”。这是有意义的，因为不同股票的价格水平可能差异巨大，尽管它们的趋势遵循相同的模式。在金融领域，有一种分析方法被称为“技术分析”。它研究此类模式以做出更好的预测。我们的系统应该能够发现这些模式（如果存在的话）。为了实现这一点，我们将四根\
  \ K 线的四种价格转换为三个值，分别代表最高价、最低价和收盘价占开盘价的百分比。\n\n## 10.4 交易环境\n\n由于我们的大部分代码需要与 Gym 协作，因此我们在\
  \ `10/lib/environ.py` 模块的 `StockEnv` 类中实现环境。首先，我们来看这个类。\n\n```python\nimport gym\n\
  import gym.spaces\nfrom gym.utils import seeding\nfrom gym.envs.registration import\
  \ EnvSpec\nimport enum\nimport numpy as np\n\nfrom . import data\n\nclass Actions(enum.Enum):\n\
  \    Skip = 0\n    Buy = 1\n    Close = 2\n```\n\n我们将所有可用动作编码为枚举（Enumerator）的字段。我们提供了包含三个选项的简单动作选择：什么都不做\
  \ (`Skip`)、买入股票 (`Buy`) 以及出售或平仓股票库存 (`Close`）。\n\n```python\nclass StocksEnv(gym.Env):\n\
  \    metadata = {'render.modes': ['human']}\n    spec = EnvSpec(\"StocksEnv-v0\"\
  )\n```\n\n`metadata` 和 `spec` 字段是为了兼容 `gym.Env` 所必需的。我们没有使用这些功能，你可以忽略它们。\n\n```python\n\
  @classmethod\ndef from_dir(cls, data_dir, **kwargs):\n    prices = {\n        file:\
  \ data.load_relative(file)\n        for file in data.price_files(data_dir)\n   \
  \ }\n    return StocksEnv(prices, **kwargs)\n```\n\n\n\n\n```python\ndef __init__(self,\
  \ prices, bars_count=DEFAULT_BARS_COUNT,\n             commission=DEFAULT_COMMISSION_PERC,\n\
  \             reset_on_close=True, conv_1d=False,\n             random_ofs_on_reset=True,\
  \ reward_on_close=False,\n             volumes=False):\n```\n\n环境的构造函数接收一系列参数，用于确定环境的行为和观测的表示方式：\n\
  \n* `prices`: 包含一个字典 `dict`，其中包含至少一个金融工具的单个或多个股票价格。其键是金融工具的名称，值是一个存储股票价格数据数组的容器对象\
  \ `data.Prices`-container-object `data.Prices`。\n* `bars_count`: 作为观测值传递的 K 线（bars）数量。默认为\
  \ 10。\n* `commission`: 我们在买入或卖出股票时支付给经纪商的佣金百分比。默认为 0.1%。\n* `reset_on_close`: 如果此参数为\
  \ `True`（默认值），当智能体想要平仓持股（即卖出股票）时，我们将结束该回合（episode）。否则，回合将持续到包含一年数据的时间序列结束。\n* `conv_1d`:\
  \ 此布尔参数在传递给智能体的价格数据的不同表示形式之间切换。如果为 `True`，观测将具有 2D 格式，具有不同的股票价格组件，按行组织的连续 K 线。例如，最高价放在第一行，最低价放在第二行，收盘价放在第三行。这种表示形式适用于时间序列的\
  \ 1D 卷积，因为数据中的每行具有相同的含义，就像 2D Atari 图像中不同的颜色层（红、绿或蓝）一样。如果参数为 `False`（默认值），则只有一个数据数组，包含该\
  \ K 线的所有组件。这种结构在全连接网络架构中更具优势。两种表示形式都显示在图 10.2 中。\n\n    ![\\[图像\\]](Images/10_02.jpg)\n\
  \n    **图 10.2：** 神经网络的不同数据表示\n\n* `random_ofs_on_reset`: 如果此参数为 `True`（默认值），在重置环境时将选择时间序列的随机起始点。否则，我们从数据开始开始。\n\
  * `reward_on_close`: 此参数在上述两种奖励系统之间切换。如果其值为 `True`，则智能体只有在执行 `Close` 动作时才会获得奖励。否则，我们在每个\
  \ K 线处根据该 K 线的价格波动发放一个小的奖励。\n* `volumes`: 此参数用于在观测中指定成交量。默认是禁用的。\n\n我们继续查看环境的构造函数。\n\
  \n```python\nassert isinstance(prices, dict)\nself._prices = prices\nif conv_1d:\n\
  \    self._state = State1D(bars_count, commission,\n                          reset_on_close,\n\
  \                          reward_on_close,\n                          volumes=volumes)\n\
  else:\n    self._state = State(bars_count, commission,\n                       \
  \ reset_on_close,\n                        reward_on_close,\n                  \
  \      volumes=volumes)\nself.action_space = gym.spaces.Discrete(n=len(Actions))\n\
  self.observation_space = gym.spaces.Box(low=-np.inf,\n      high=np.inf, shape=self._state.shape,\
  \ dtype=np.float2)\nself.random_ofs_on_reset = random_ofs_on_reset\nself._seed()\n\
  ```\n\n`StockEnv` 类的大部分功能实现在内部类中：`State` 和 `State1D`。它们负责准备观测以及持仓和奖励。它们实现了不同的数据表示。我们将稍后考虑代码。在构造函数中，我们创建了\
  \ Gym 所需的状态对象、动作空间和观测空间的字段。\n\n```python\ndef reset(self):\n    self._instrument\
  \ =\n            self.np_random.choice(list(self._prices.keys()))\n    prices =\
  \ self._prices[self._instrument]\n    bars = self._state.bars_count\n    if self.random_ofs_on_reset:\n\
  \        offset = self.np_random.choice(prices.shape[0]-\n                     \
  \                        bars)\n    else:\n        offset = bars\n    self._state.reset(prices,\
  \ offset)\n    return self._state.encode()\n```\n\n该方法定义了环境的 `reset()` 功能。根据 `gym.Env`\
  \ 的语义，我们在我们要处理的时间序列中选择一个随机起始点。选中的值被传递给内部状态实例，该实例通过 `encode()` 函数获取第一次观测。\n\n```python\n\
  def step(self, action_idx):\n    action = Actions(action_idx)\n    reward, done\
  \ = self._state.step(action)\n    obs = self._state.encode()\n    info = {\"instrument\"\
  : self._instrument,\n            \"offset\": self._state._offset}\n    return obs,\
  \ reward, done, info\n```\n\n该方法必须处理智能体选择的动作，并返回下一个观测 `obs`、奖励 `reward` 和 `done`\
  \ 标志。实际功能实现在状态类中，因此此方法只是状态方法的简单封装器。\n\n```python\ndef render(self, mode='human',\
  \ close=False):\n    pass\n\ndef close(self):\n    pass\n```\n\n`gym.Env` 的 API\
  \ 允许指示 `render()` 方法以人类可读或机器可读的形式输出当前状态。通常，可以使用此方法来获取环境状态的洞察。它对于调试或跟踪智能体的行为有用。股票市场环境可以绘制当前价格的图表。我们的环境不支持此，该方法什么都不做。`close()`\
  \ 方法在环境结束时调用，以释放资源。\n\n```python\ndef seed(self, seed=None):\n    self.np_random,\
  \ seed1 = seeding.np_random(seed)\n    seed2 = seeding.hash_seed(seed1 + 1) % 2\
  \ 31\n    return [seed1, seed2]\n```\n\n\n\n\n\n```python\ndef reset(self, prices,\
  \ offset):\n    assert isinstance(prices, data.Prices)\n    assert offset >= self.bars_count-1\n\
  \    self.have_position = False\n    self.open_price = 0.0\n    self._prices = prices\n\
  \    self._offset = offset\n```\n\n`reset()` 方法在重置环境时被调用，必须保存传入的股票价格和起始点。开始时我们还没有购买任何股票，因此状态为\
  \ `have_position=False` 和 `open_price=0.0`。\n\n```python\n@property\ndef shape(self):\n\
  \    # [h, l, c] * bars + position_flag + rel_profit\n    # (从开始开始)\n    if self.volumes:\n\
  \        return 4 * self.bars_count + 1 + 1,\n    else:\n        return 3 * self.bars_count\
  \ + 1 + 1,\n```\n\n该属性返回状态表示的 `NumPy` 数组格式。\n\n`State` 类被编码为一个单个向量，包含股票价格（可选的成交量）以及两个表示是否持有股票及其相应收益的值。\n\
  \n```python\ndef encode(self):\n    res = np.ndarray(shape=self.shape, dtype=np.float32)\n\
  \    shift = 0\n    for bar_idx in range(-self.bars_count+1, 1):\n        ofs =\
  \ self._offset + bar_idx\n        res[shift] = self._prices.high[ofs]\n        shift\
  \ += 1\n        res[shift] = self._prices.low[ofs]\n        shift += 1\n       \
  \ res[shift] = self._prices.close[ofs]\n        shift += 1\n        if self.volumes:\n\
  \            res[shift] = self._prices.volume[ofs]\n            shift += 1\n   \
  \ res[shift] = float(self.have_position)\n    shift += 1\n    if not self.have_position:\n\
  \        res[shift] = 0.0\n    else:\n        res[shift] = self._cur_close() / self.open_price\
  \ –1.0\n    return res\n```\n\n上述方法将从当前起始点开始的股票价格编码为 `NumPy` 数组，代表智能体的观测值。\n\n```python\n\
  def _cur_close(self):\n    open = self._prices.open[self._offset]\n    rel_close\
  \ = self._prices.close[self._offset]\n    return open * (1.0 + rel_close)\n```\n\
  \n此辅助方法计算当前 Bar 的收盘价。传递给 `State` 类的价格相对于开盘价给出的：最高价、最低价和收盘价表示为开盘价的百分比。这种表示方法我在讨论训练数据时提到过。它旨在让智能体更容易在不依赖绝对金额的情况下发现价格中的模式。\n\
  \n```python\ndef step(self, action):\n    assert isinstance(action, Actions)\n \
  \   reward = 0.0\n    done = False\n    close = self._cur_close()\n```\n\n该方法执行我们环境中的一步操作，是\
  \ `State` 类中最复杂的代码。在结束时，它必须返回百分比形式的奖励和一个回合结束指示。\n\n```python\nif action == Actions.Buy\
  \ and not self.have_position:\n    self.have_position = True\n    self.open_price\
  \ = close\n    reward -= self.commission_perc\n```\n\n当智能体购买股票时（如果尚未持有），它会将 `have_position`\
  \ 设置为 `True`，并将 `open_price` 设置为收盘价，同时减去佣金百分比。\n\n如果智能体持有股票并卖出，它会将 `have_position`\
  \ 设置为 `False`，并将 `open_price` 设置为 `0.0`，同时增加收益。如果持有股票时买入，则不进行任何操作。\n\n如果持有股票并卖出，收益为\
  \ `_cur_close() / self.open_price - 1.0`。如果智能体没有股票时买入，如果持有股票则不卖出。\n\n```python\n\
  if action == Actions.Close and self.have_position:\n    reward = self._cur_close()\
  \ / self.open_price - 1.0\n    self.have_position = False\n    self.open_price =\
  \ 0.0\n```\n\n如果智能体持有股票时买入，收益为 `self__`。close`。 self.cur_close` 1._````\n\n\n\n\n\
  ```python\nclass DQNConv1D(nn.Module):\n    def __init__(self, shape, actions_n):\n\
  \        super(DQNConv1D, self).__init__()\n\n        self.conv = nn.Sequential(\n\
  \            nn.Conv1d(shape[0], 128, 5),\n            nn.ReLU(),\n            nn.Conv1d(128,\
  \ 128, 5),\n            nn.ReLU(),\n        )\n\n        out_size = self._get_conv_out(shape)\n\
  \n        self.fc_val = nn.Sequential(\n            nn.Linear(out_size, 512),\n\
  \            nn.ReLU(),\n            nn.Linear(512, 1)\n        )\n\n        self.fc_adv\
  \ = nn.Sequential(\n            nn.Linear(out_size, 512),\n            nn.ReLU(),\n\
  \            nn.Linear(512, actions_n)\n        )\n\n    def _get_conv_out(self,\
  \ shape):\n        o = self.conv( torch.zeros(1, *shape))\n        return int(np.prod(o.size()))\n\
  \n    def forward(self, x):\n        conv_out = self.conv(x).view(x.size()[0], -1)\n\
  \        val = self.fc_val(conv_out)\n        adv = self.fc_adv(conv_out)\n    \
  \    return val + (adv - adv.mean(dim=1, keepdim=True))\n```\n\n## 10.6 训练代码\n\n\
  在这个示例中，有两个非常相似的训练模块：一个用于前馈模型，另一个用于 1D 卷积。在两种情况下，与第 8 章 中的示例相比，DQN 扩展 并没有引入新内容。\n\
  \n- 我们使用 Epsilon-Greedy 策略进行动作选择以探索环境。`epsilon` 在前一百万步内从 1.0 线性下降到 0.1。\n- 使用了一个大小为\
  \ 100,000 的简单回放缓冲区（Replay Buffer），初始填充了 10,000 条转换。\n- 每隔 1,000 步，我们会计算设定状态的平均值，以检查训练期间\
  \ Q 值的演趋势。\n- 每隔 100,000 步，我们会进行一次验证：使用训练数据和未知数据各运行 100 个回合（Epis）。使用 TensorBoard\
  \ 记录各种属性，例如平均收益、平均 K 线数量和购买股票的数量。这一步允许检查是否满足过拟合的条件。\n\n你可以在 `Chapter10/train_model.py`（前馈模型）和\
  \ `Chapter10/train_model_conv.py`（卷积模型）文件中找到训练模块。两个版本接收相同的命令行参数。\n\n要启动训练，必须通过 `--data`\
  \ 选项传递训练数据。你可以指定单个 CSV 文件或包含 CSV 文件的目录。默认情况下，训练模块使用 2016 年的 Yandex 数据（文件 `data/YNDX_160101_161231.csv`）。对于验证数据，有\
  \ `--val` 选项，默认使用 2015 年的 Yandex 数据。此外，还需要 `-r` 选项，用于重命名训练运行。该名称将显示在 TensorBoard\
  \ 中，并在创建保存模型的目录时使用。\n\n## 10.7 结果\n\n现在让我们来看结果。\n\n### 10.7.1 前馈模型\n\n在全年的 Yandex\
