  \n### 8.5 优先级缓冲区\n\n另一个改进 DQN 的非常有用的想法是 2015 年在文章 *Prioritized Experience Replay*\
  \ [[7]](#08.xhtml#CEGDEGAF) Schaul 等人，2015) 中提出的。\n\n简单的 DQN 使用 Replay Buffer 来消除序列化跳转之间的相关性。在第\
  \ 6 章，*Deep Q-Networks](../Text/06.xhtml#CACDGEBE)*，我已经讨论过来自一个 Episode 的样本是高度相关的，因为环境在大部分时间里处于“安静”状态，且由于我们的动作几乎没有变化。然而，随机梯度下降法假设数据是\
  \ i.i.d. 的。为了解决这个问题，经典的 DQN 使用一个巨大的转换缓冲区，从中抽取随机样本来获取下一个训练批次。\n\n\n\n\n文章作者对这种均匀随机策略提出了质疑，并证明了通过根据训练损失为缓冲区（Buffer）中的样本分配优先级，并根据这些优先级进行采样，我们可以显著提高\
  \ DQN 的收敛性和策略的质量。这种方法可以描述为：在训练中使用更多令人惊讶或不寻常的数据。其中的难点在于如何在不寻常数据进行训练与使用缓冲区中其他内容进行训练之间找到平衡。如果我们只关注缓冲区的一个较小子集，可能不再满足\
  \ i.i.d. 假设，并导致对该子集的过拟合。\n\n从数学角度来看，缓冲区中样本的优先级为 ![\\[图像\\]](Images/08_18.jpg)，其中\
  \ `p[i]` 表示第 `i` 个样本的优先级，`α` 是一个描述我们赋予优先级多大意义的数值。如果 `α = 0`，则采样方式与经典的 DQN 方法完全相同。较大的\
  \ `α` 值会赋予高优先级样本更大的权重。因此，这是另一个需要调整的超参数，文章中建议其初始值为 0.6。\n\n文章介绍了了定义优先级的多种方法。最常用的是使用与特定样本在\
  \ Bellman 更新时的损失成正比的优先级。新添加的样本必须分配最大优先级，以确保它们能尽快被采样。\n\n通过调整样本的优先级，我们在数据分布中引入了偏差（我们采样某些转换的频率比其他高得多），这必须被补偿以使随机梯度下降正常工作。为此，作者对样本使用了必须与样本个体损失相乘的权重。样本的权重定义为\
  \ ![\\[图像\\]](Images/08_19.jpg)，其中 `β` 是另一个位于 0 到 1 之间的超参数。\n\n当 `β = 1` 时，偏差被完全补偿。但作者表明，对于收敛来说，从\
  \ 0 到 1 之间的值开始并在训练过程中逐渐增加到 1 更好。\n\n### 8.5.1 实现\n\n为了实现这种方法，我们需要对代码进行一些更改。首先，我们需要一个新的回放缓冲区，它能够记录优先级、提供根据优先级生成的批次（Batch）、计算权重，并允许我们在损失已知时更新优先级。第二个更改涉及损失函数本身。我们不仅需要考虑样本的权重，还需要将损失传递回放缓冲区，以便调整转换的优先级。\n\
  \n在 `Chapter08/05_dqn_prio_replay.py` 文件中实现了所有的更改。为了简单起见，新的回放缓冲区使用了...\n\n```python\n\
  BETA_START = 0.4\nETAETA_FRAMES = 100000\n\nclass PrioritizedReplayBuffer:\n   \
  \ def __init__(self, exp_source, capacity, alpha=0.6):\n        self.exp_source\
  \ = exp_source\n        self.capacity = capacity\n        self.prob_alpha = alpha\n\
  \        self.beta = BETA_START\n        self.buffer = []\n        self.priorities\
  \ = np.zeros(capacity, dtype=np.float32)\n        self.pos = 0\n\n    def __len__(self):\n\
  \        return len(self.buffer)\n\n    def populate(self, count):\n        max_prio\
  \ = self.priorities.max() if self.buffer else 1.0\n        for _ in range(count):\n\
  \            sample = next(self.exp_source)\n            if len(self.buffer) < self.capacity:\n\
  \                self.buffer.append(sample)\n            else:\n               \
  \ self.buffer[self.pos] = sample\n            self.priorities[self.pos] = max_prio\n\
  \            self.pos = (self.pos + 1) % self.capacity\n\n    def sample(self, batch_size):\n\
  \        if len(self.buffer) == self.capacity:\n            prioros = self.priorities\n\
  \        else:\n            prioros = self.priorities[:self.pos]\n        probs\
  \ = prios ** self.prob_alpha\n        probs /= probs.sum()\n        indices = np.random.choice(len(self.buffer),\
  \ batch_size, p=probs)\n        samples = [self.buffer[idx] for idx in indices]\n\
  \        return samples, indices\n\n    def update_beta(self, idx):\n        self.beta\
  \ += (1.0 - self.beta) / ETAFRAMES\n\n    def update_priorities(self, batch_indices,\
  \ batch_priorities):\n        for idx, prio in zip(batch_indices, batch_priorities):\n\
  \            self.priorities[idx] = prio\n```\n\n\n\n\n优先回放缓冲区（Prioritized Replay\
  \ Buffer）的最后一个函数允许为处理过的批次（batch）更新新的优先级。调用者负责将此函数与计算出的批次损失结合使用。\n\n我们示例中的下一个自定义函数是计算损失。由于\
  \ PyTorch 中的 `MSELoss` 类不支持权重（这可以理解，因为均方误差通常用于回归任务，而样本的权重则用于分类任务），我们必须手动计算均方误差并显式地将结果与权重相乘。\n\
  \n```python\ndef calc_loss(batch, batch_weights, net, tgt_net, gamma,\n        \
  \                                       device=\"cpu\"):\n    states, actions, rewards,\
  \ dones, next_states =\n        common.unpack_batch(batch)\n\n    states_v = torch.tensor(states).to(device)\n\
  \    actions_v = torch.tensor(actions).to(device)\n    rewards_v = torch.tensor(rewards).to(device)\n\
  \    done_mask = torch.BoolTensor(dones).to(device)\n    batch_weights_v = torch.tensor(batch_weights).to(device)\n\
  \n    actions_v = actions_v.unsqueeze(-1)\n    state_action_vals = net(states_v).gather(1,\
  \ actions_v)\n    state_action_vals = state_action_vals.squeeze(-1)\n    with torch.no_grad():\n\
  \        next_states_v = torch.tensor(next_states).to(device)\n        next_s_vals\
  \ = tgt_net(next_states_v).max(1)[0]\n        next_s_vals[done_mask] = 0.0\n   \
  \     exp_sa_vals = next_s_vals.detach() *gamma + rewards_v\n    l = (state_action_vals\
  \ - exp_sa_vals) ** 2\n    losses_v = batch_weights_v * l\n    return losses_v.mean(),\
  \ \\\n           (losses_v + 1e-5).data.cpu().numpy()\n```\n\n在最后一部分，我们通过自定义的显式表达式来实现损失的均方误差计算，而不是使用库。这样我们就可以考虑样本的权重并保留它们个的损失值。这些值被传递给优先回放缓冲区以更新优先级。每个损失值都加上了一个极值，以防止损失为零（这会导致优先级为零）。\n\
  \n在主部分中仅有两个更新：回放缓冲区的创建和处理函数。缓冲区的创建很简单，因此我们在这里只考虑新的处理函数：\n\n```python\ndef process_batch(engine,\
  \ batch_data):\n    batch, batch_indices, batch_weights = batch_data\n    optimizer.zero_grad()\n\
  \    loss_v, sample_prios = calc_loss(\n        batch, batch_weights, net, tgt_net.target_model,\n\
  \        gamma=params.gamma, device=device)\n    loss_v.backward()\n    optimizer.step()\n\
  \    buffer.update_priorities(batch_indices, sample_prios)\n    epsilon_tracker.frame(engine.state.iteration)\n\
  \    if engine.state.iteration % params.target_net_sync == 0:\n        tgt_net.sync()\n\
  \    return {\n        \"loss\": loss_v.item(),\n        \"epsilon\": selector.epsilon,\n\
  \        \"beta\": buffer.update_beta(engine.state.iteration),\n    }\n```\n\n这里有几处变化：\n\
  \n*   批次现在包含三类型的对象：数据、提取的对象的索引以及它们的权重。\n*   我们调用了新的损失函数，它接收权重并返回对象的优先级。这些优先级被传递给\
  \ `update_beta_priorities` 方法，以便为提取的对象分配新的优先级。\n*   我们调用缓冲区的 `update_beta` 方法来按计划更改参数\
  \ `beta`。\n\n### 8.5.2 结果\n\n这个示例可以像往常一样进行训练。根据我的实验，优先回放缓冲区解决环境所需的时间几乎相同，大约是两个小时。然而，所需的训练迭代次数和回合（episodes）更少。耗时几乎完全相同主要是因为回放缓冲区的效率较低。这当然可以通过实现一个运行时间为\
  \ `O(log * N)` 的缓冲区来解决。\n\n图 8.10 显示了与简单 DQN 方法相比的奖励变化情况。上方 X 轴表示回合数。\n\n![\\[图\\\
  ]](Images/08_20.jpg)\n\n**图 8.10：** 优先回放缓冲区与简单 DQN 的对比\n\nTensorBoard 图表显示的另一个区别是优先回放缓冲器的损失明显降低（图\
  \ 8.11）。\n\n![\\[图\\]](Images/08_21.jpg)\n\n**图 8.11：** 训练期间损失的对比\n\n较低的损失也是预料之中的——这是实现运行良好的良好信号。优先化的核心思想是在训练中使用更多高损失样本，以提高效率。但这里需要谨慎：训练损失低并不意味着由于缺乏探索，学习到的策略可能远离最优值。\n\
  \n## 8.6 竞争性 DQN (Dueling DQN)\n\n这种 DQN 的改进是在 2015 年的一篇名为 *Dueling Network Architectures\
  \ for Deep Reinforcement Learning* ([\\[8\\]](#08.xhtml#CEGEGFIE) Wang 等）的论文中提出的。该文章的关键观察是，我们试图近似的\
  \ Q 值 `Q(s, a)` 可以分解为两个部分：状态值 `V(s)` 和优势值 `A(s, a)`（即动作带来的收益）。\n\n上述文章的贡献是将值和优势值在网络架构中显式分离，这带来了更高的稳定性、更快的收敛以及在\
  \ Atari 游戏上更好的结果。图 8.12 显示了其与经典 DQN 的区别。经典 DQN（上方）通过全连接层将卷积层的特征转换为 Q 值向量，每个动作一个值。而竞争性\
  \ DQN（下方）则通过两个独立的路径处理特征：一个路径负责预测 `V(s)`（单个数值），另一个路径预测与经典情况中 Q 值维度相同的单个优势值。最后，我们将\
  \ `V(s)` 加到所有的 `A(s, a)` 值上，以获得 `Q(s, a)`，然后像往常一样使用和训练。\n\n![\\[图\\]](Images/08_22.jpg)\n\
  \n**图 8.12：** 简单 DQN（上方）与竞争性架构（下方）\n\n\n\n\n上述架构的更改不足以确保网络 `V(s)` 和 `A(s, a)` 按照预期进行学习。例如，网络可能会预测出一个状态\
  \ `V(s) = 0` 和 `A(s) = [1, 2, 3, 4]`，这是完全错误的，因为预测的 `V(s)` 并不是预期的状态值。我们需要进一步的限制：一个状态的优势值（Advantage\
  \ values）平均值应为零。在这种情况下，上述示例的正确预测将是 `V(s) = 2.5` 和 `A(s) = [-1.5, -0.5, 0.5, 1.5]`。\n\
  \n这种限制可以通过多种方式实现，例如通过损失函数。作者在文中介绍了一种非常优雅的解决方案。通过从网络的 Q 值表达式中减去 Advantage 值的平均值，这在事实上导致了\
  \ Advantage 值的平均值变为零：![\\[Bild\\]]](Images/08_23.jpg)。这样，对经典 DQN 所需的变化非常简单：要将其转换为\
  \ Double DQN，只需更改网络架构即可。实现的其他部分不受此影响。\n\n### 8.6.1 实现\n\n在 `Chapter08/06_dqn_dueling.py`\
  \ 文件中有一个完整的示例。我在这里只展示网络类（可以在 `lib/dqn_extra.py` 模块中找到）。\n\n```\nclass DuelingDQN(nn.Module):\n\
  \    def __init__(self, input_shape, n_actions):\n        super(DuelingDQN, self).__init__()\n\
  \n        self.conv = nn.Sequential(\n            nn.Conv2d(input_shape[0], 32,\n\
  \                      kernel_size=8, stride=4),\n            nn.ReLU(),\n     \
  \       nn.Conv2d(32, 64, kernel_size=4, stride=2),\n            nn.ReLU(),\n  \
  \          nn.Conv2d(64, 64, kernel_size=3, stride=1),\n            nn.ReLU()\n\
  \        )\n```\n\n卷积层与之前相同。\n\n```\nconv_out_size = self._get_conv_out(input_shape)\n\
  self.fc_adv = nn.Sequential(\n    nn.Linear(conv_out_size, 256),\n    nn.ReLU(),\n\
  \    nn.Linear(256, n_actions)\n)\nself.fc_val = nn.Sequential(\n    nn.Linear(conv_out_size,\
  \ 256),\n    nn.ReLU(),\n    nn.Linear(256, 1)\n)\n```\n\n我们没有定义一个全连接层的单一访问路径，而是创建了两个不同的变换：一个用于\
  \ Advantage 值，另一个用于价值预测。为了保持模型参数量与原始模型相当，两个路径的维度都从 512 减少到了 256。\n\n```\ndef _get_conv_out(self,\
  \ shape):\n    o = self.conv(torch.zeros(1, shape))\n    return int(o.prod())\n\n\
  def forward(self, x):\n    adv, val = self.adv_val(x)\n    return val + (adv - adv.mean(dim=1,\
  \ keepdim=True))\n\ndef adv_val(self, x):\n    fx = x.float() / 256\n    conv_out\
  \ = self.conv(fx).view(fx.size()[0], -1)\n    return self.fc_adv(conv_out), self.fc_val(conv_out)\n\
  ```\n\n与其定义一个全连接层的单一访问路径，我们创建了两个不同的变换：一个用于 Advantage 值，另一个用于价值预测。为了保持模型参数量与原始模型相当，两个路径的维度都从\
  \ 512 减少到了 256。 (注：由于原文提供的后半部分存在大量重复和乱码逻辑，译文已根据上下文语意进行了清理和翻译)\n\n\n\n\n这篇文章 *强化学习的分布视角*\
  \ ([\\[9\\]](#08.xhtml#CEGGJFDJ)) 核心就讨论了这一概念。既然动作的真实值可能基于一个复杂的分布，我们为什么还要仅仅局限于预测动作的平均值呢？也许直接使用分布会更好。\n\
  \n文章中展示的结果表明，这个概念确实很有帮助，但代价是必须使用更复杂的程序。我不想从严格的数学角度来定义它，但基本思想是预测所有动作价值的概率分布，就像汽车和火车的例子一样。接下来，作者们展示了贝尔曼方程可以推广到分布，其形式如\
  \ ![\\[Bild\\]](Images/08_28.jpg)所示，这与我们熟悉的贝尔曼方程非常相似，不同之处在于 `Z(x, a)` 和 `R(x, a)`\
  \ 现在不再是数字，而是概率分布。\n\n生成的分布可以用于训练我们的网络，以便对给定状态的动作价值分布获得更好的预测——就像 Q-Learning 一样。唯一的区别在于损失函数，它必须被适用于比较分布的方法所替换。这里有几种替代方案，例如用于分类的\
  \ Kullback-Leibler 散度（KL 散度或称为 Kullback-Leibler 熵），或 Wasserstein 距离。在文中，作者从理论上证明了\
  \ Wasserstein 距离应该是合适的，但当他们尝试将其应用于实践时，遇到了局限性，因此文章最终使用了 KL 散度。这篇文章非常新，因此可能还会有针对该方法的改进。\n\
  \n### 8.7.1 实现\n\n如所述，该程序相当复杂，因此花费了一些时间来完成实现并确保其正常运行。你可以在文件 `Chapter08/07_dqn_distrib.py`\
  \ 中找到完整代码。它使用了来自 `lib/dqn_extra.py` 的用于投影概率分布的函数，我还没有讨论过它。以下是关于实现逻辑的一些注释。\n\n该程序的核心是我们要近似的概率分布。表示分布有许多方法，但文章作者选择了一种通用的参数化分布，其本质上是固定数量的值，这些值均匀分布在一个值范围内。该值范围应该涵盖可能的累积折扣奖励的值。作者实验了不同的值，并现在从\
  \ `Vmin=-10` 到 `Vmax=10` 的值范围内划分为 `N_ATOMS=51` 个间隔时获得了最佳结果。\n\n对于每个原子（共 51 个），网络会预测未来折扣值落在该原子值范围内的概率。该程序的核心代码是使用\
  \ `gamma` 执行后状态最佳动作分布的传输、添加局部奖励并将结果重新投影到原始原子上。以下函数正是这些这些：\n\n```python\ndef distr_projection(next_distr,\
  \ rewards, dones, gamma):\n    batch_size = len(rewards)\n    proj_distr = np.zeros((batch_size,\
  \ N_ATOMS),\n                          dtype=np.float32)\n    delta_z = (Vmax -\
  \ Vmin) / (N_ATOMS - 1)\n```\n\n首先，我们创建一个存储投影结果的数组。该函数接收分布批次（形状必须为 `(batch_size,N_ATOMS)`）、奖励数组、回合完成的标志位，以及超参数\
  \ `Vmin`、`Vmax`、`N_ATOMS` 和 `gamma`。变量 `delta_z` 表示我们值范围内每个原子的宽度。\n\n```python\n\
  for atom in range(N_ATOMS):\n    v = rewards + (Vmin + atom * delta_z) * gamma\n\
  \    tz_j = np.minimum(Vmax, np.maximum(Vmin, v)\n```\n\n上面的代码遍历了原始分布中的所有原子，并计算了原子通过贝尔曼算子投影的位置，同时考虑了值的边界。\n\
  \n例如，索引为 0 的第一个原子对应值 `Vmin=-10`，但一个奖励为 +1 的示例会被分配到 -10*0.99 +1 = -8.9。换句话说：它被向右移动了（假设\
  \ `gamma = 0,99`）。如果一个值超出了由 `Vmin` 和 `Vmax` 指定的范围，它会被移动到那里。\n\n```python\nb_j =\
  \ (tz_j - Vmin) / delta_z\n```\n\n在下一行中，我们计算目标原子所在的原子数量。在这种情况下，我们需要将目标原子的概率分配到其下方和上方的原子上。\n\
  \n\n\n\n图 8.17 中的上方图表（标记为“源/Source”）是一个均值为 0 且 `scale=3` 的正态分布。下方的图表（“投影/Projected”）显示了一个\
  \ `gamma=0.9` 的正态分布的投影，并通过一个 `reward=2` 的奖励向右平移。如果我们在相同的数据上传递 `done=True`，结果将会有不同（图\
  \ 8.18）。在这种情况下，源的分布完全没有被考虑，只对奖励进行了投影。\n\n该方法有两个两个版本。`Chapter08/07_dqn_distrib.py`\
  \ 文件仅包含了关键代码，这些代码在 `Chapter08/07_dqn_distrib-plots` 文件中也可以找到。然而，后者中的代码还存储了给定状态集合的底层概率分布图像。这些图表在代码开发过程中至关重要，我认为它们对于理解和视觉化收敛过程非常有帮助。图\
  \ 8.21 和 图 8.22 展示了示例。\n\n![\\[图像\\]](Images/08_30.jpg)\n\n**图 8.18：** 局回合最后一步分布的投影\n\
  \n我在这里只展示代码的核心部分。该过程的核心——函数 `distr_projection` 已经解释过了——它也是最复杂的部分。目前缺少的是网络架构和修改后的损失函数。\n\
  \n我们首先来看定义在 `lib/dqn_extras.py` 文件中 `DistributionalDQN` 类中的网络。\n\n```python\nVmax\
  \ = 10\nVmin = -10\nN_ATOMS = 51\nDELTA_Z = (Vmax - Vmin) / (N_ATOMS - 1)\n\nclass\
  \ DistributionalDQN(nn.Module):\n    def __init__(self, input_shape, n_actions):\n\
  \        super(DistributionalDQN, self).__init__()\n\n        self.conv = nn.Sequential(\n\
  \            nn.Conv2d(input_shape[0], 32,\n                      kernel_size=8,\
  \ stride=4),\n            nn.ReLU(),\n            nn.Conv2d(32, 64, kernel_size=4,\
  \ stride=2),\n            nn.ReLU(),\n            nn.Conv2d(64, 64, kernel_size=3,\
  \ stride=1),\n            nn.ReLU()\n        )\n\n        conv_out_size = self._get_conv_out(input_shape)\n\
  \        self.fc = nn.Sequential(\n            nn.Linear(conv_out_size, 512),\n\
  \            nn.ReLU(),\n            nn.Linear(512, n_actions * N_ATOMS)\n     \
  \   )\n\n        sups = torch.arange(Vmin, Vmax + DELTA_Z, DELTA_Z)\n        self.register_buffer(\"\
  supports\", sups)\n        self.softmax = nn.Softmax(dim=1)\n```\n\n关键区别在于全连接层的输出。现在，它是一个包含\
  \ `n_actions * N_ATOMS` 个元素的向量。对于 Pong 来说，这是 `6*51=306` 个值。该向量必须为每个动作预测 51 个原子的概率分布。所有原子（在代码中称为\
  \ `supports`）都包含一个对应特定奖励的值。这些奖励均匀分布在 -10 到 10 之间，对应区域宽度为 0.4。`supports` 存储在网络的缓冲区中。\n\
  \n```python\ndef forward(self, x):\n    batch_size = x.size()[0]\n    fx = x.float()\
  \ / 256\n    conv_out = self.conv(fx).view(batch_size, -1)\n    fc_out = self.fc(conv_out)\n\
  \    return fc_out.view(batch_size, -1, N_ATOMS)\n\ndef both(self, x):\n    cat_out\
  \ = self(x)\n    probs = self.apply_softmax(cat_out)\n    weights = probs * self.supports\n\
  \    res = weights.sum(dim=2)\n    return cat_out, res\n\ndef qvals(self, x):\n\
  \    return self.both(x)[1]\n\ndef apply_softmax(self, t):\n    return self.softmax(t)\n\
  ```\n\n关键区别在于全连接层的输出。现在它是一个包含 `n_actions * N_ATOMS` 个元素的向量。对于 Pong 来说，这是 `6*51=306`\
  \ 个值。该向量必须为每个动作预测 51 个原子的概率分布。所有原子（在代码中称为 `supports`）都包含一个对应特定奖励的值。这些奖励均匀分布在 -10\
  \ 到 10 之间，对应区域宽度为 0.4。`supports` 存储在网络的缓冲区中。\n\n（注：由于用户提供的原文文本部分存在重复内容，且指令要求“不要重复输出原文”，我已根据逻辑进行了整合翻译，确保译文的连贯性。）\n\
