  \n**图 10.14：** 卷积版本的验证奖励\n\n## 10.8 其他可能性\n\n如所述，金融市场是庞大且复杂的。我们尝试过的方法仅仅是一个初步的开始。使用强化学习（RL）开发一套完整且盈利的交易策略是一项系统性工程，可能需要几个月的密集工作。但这里提供了一些可以尝试的建议，以获得更深入的理解：\n\
  \n1. 我们的数据表示绝不完美。我们没有考虑到重要的价格校正，例如通过 `Support & Resistance`（支撑与阻力，技术分析中最常用的技术之一）产生的校正。将此类内容纳入观测结果可能是一项艰巨的任务。\n\
  \n2. 市场价格在非常不同的时间尺度上进行分析。如分钟级生成的 K 线数据充满了噪声（因为它们包含了许多由个人交易引起的微小价格波动）。这就像通过显微镜观察市场。在更大的时间尺度上（如小时或天），价格波动中的长期趋势会变得清晰，这对于股票价格预测可能是至关重要的。\n\
  \n3. 需要更多的训练数据。一年收集的股票数据仅对应 130,000 条 K 线，如果想捕捉所有可能的市场情况，这可能是不的。理想情况下，应该使用大量的数据来训练智能体，例如过去\
  \ 10 多年收集的数百只股票的数据。\n\n4. 尝试网络架构。卷积模型的收敛速度比前馈模型快得多，但仍有许多其他优化空间：层数、卷积核大小、残差架构（Residual-architecture）、注意力机制等。\n\
  \n## 10.9 总结\n\n在本章中，你学习了 RL 的一个实际示例，我们实现了一个交易智能体以及自定义的 Gym 环境。我们尝试了两种不同的架构：带有价格发展轨迹的前馈网络和一个\
  \ 1D 卷积网络。这两种架构都使用了 DQN 方法以及在 第 8 章 中描述的 DQN 扩展。\n\n这是该书第二部分的最后一个章节。在第三部分中，我们将涉及另一类类\
  \ RL 方法：策略梯度（Policy Gradients）。我们之前已经简要地考虑过这种方法，但在接下来的章节中，我们将更深入地探讨这个主题，并除了 REINFORCE\
  \ 方法外，还将研究该组中表现最好的的方法：A3C。\n\n# 第三部分：基于策略的方法\n\n### 本部分包含：\n\n* **第 11 章**\n   \
  \ 一种替代方案：策略梯度\n\n* **第 12 章**\n    Actor-Critic 方法\n\n* **第 13 章**\n    [异步优势 Actor-Critic\
  \ (A3C)]](../Text/13.xhtml#CIHJCCBA)\n\n* **第 14 章**\n    通过强化学习训练聊天机器人\n\n* **第\
  \ 15 章**\n    TextWorld 环境\n\n* **第 16 章**\n    Web 导航\n\n# 第 11 章：一种替代方案：策略梯度\n\
  \n在书的第三部分的第一章，我们将处理马尔可夫决策过程（`Markov Decision Process`, `MDP`）的替代方案，它们构成了一个完整的家族：策略梯度（`PG`）。\n\
  \n本章的主题：\n\n* 我们将对这些方法进行概述，并讨论为什么使用它们，以及它们与 DQN 相比的优缺点是什么。\n* 我们首先考虑一种名为 `REINFORCE`\
  \ 的简单 PG 方法，并尝试将其应用于 CartPole 环境，以便与 DQN 进行比较。\n\n## 11.1 值与策略\n\n在深入研究 PG 之前，我们应该回顾一下书中其他部分讨论过的属性。值迭代（Value\
  \ iteration）和 Q-Learning 的关键在于状态的值（`V`）或状态-动作对的值（`Q`）。值被定义为我们到达该状态可以获得或通过执行某个动作可以获得的折现总奖励。为了获得这些值，我们使用了贝尔曼方程，它通过通过一步的值来表示当前步的值。\n\
  \n在 第 1 章，什么是强化学习？ 中，我们将每个状态下的做法定义为策略（Policy）。就像 Q-Learning 方法一样，值决定了我们的行为并定义了我们的策略。形式上这可以表示为\
  \ `π(s) = arg max[a] Q(s, a)`，这意味着我们的策略在每个状态 s 下产生最大 Q 值的动作。\n\n策略与值之间的联系是显而易见的，因此我们没有进一步强调策略的独立性，而是重点关注了值及其近似方法。现在，我们将关注这种联系以及策略本身。\n\
  \n### 11.1.1 为什么是策略？\n\n探索策略主题有几个感兴趣的理由。当我们着一项 RL 任务时，我们首先寻找的是策略。当智能体接收到观测并必须决定下一步做什么时，我们需要的是策略，而不是状态或动作的值。虽然我们对总奖励感兴趣，但对于每个特定的状态，状态值可能几乎没有意义。\n\
  \n\n\n\n想象这样一个场景：你正走在丛林中，突然发现一只饥饿的老虎躲藏在灌木丛中。你有多种行动选择，例如逃跑、躲起来或尝试向它投掷背包，但如果去问“逃跑”这一动作的价值究竟是多少，以及它是否大于“无所事事”这一动作的价值，似乎有些愚蠢。你并不特别关心价值，因为你必须快速决定该做什么，此就了。Q-Learning\
  \ 方法试图通过计算状态价值的近似值来间接回答关于策略（Policy）的问题，然后选择最好的替代方案。但是，如果我们对价值根本不感兴趣，为什么还要费这个精力呢？\n\
  \n具有非常多动作（或在极端情况下具有连续动作空间）的环境可能是人们更倾向于使用策略而非价值的另一个原因。为了在 `Q(s, a)` 的情况下决定哪个动作最佳，我们需要解决一个简单的优化问题并找到使\
  \ `Q(s, a)` 最大的 `a`。对于具有不同离散动作的 Atari 游戏来说，这并不是问题。我们只需要计算所有动作价值的近似值，并选择 Q 值最大的那一个。但如果动作不属于一个离散的小集合，而是与一个标量值相关联，例如方向盘旋转的角度，或我们逃离老虎的速度，那么优化问题就会变得困难，因为\
  \ Q 值通常由高度非线性的神经网络（NN）表示。因此，找到使函数值最大化的论据可能是非常棘手的。在这些情况下，避免使用价值并直接使用策略更好。\n\n具有极强随机性（stochastisch）的环境也支持学习策略。从第\
  \ 8 节 中你已经知道，如果我们的智能体在类别分类 DQN（Categorical DQN）中使用 Q 值的分布，而不是预期的平均值，那么它将获益匪浅，因为我们的网络可以更好地捕捉底层的概率分布。在下一节中，我们将看到策略是如何自然地以动作概率的形式表示的，这代表了向分类\
  \ DQN 方法的一步。\n\n### 11.1.2 策略的表示\n\n现在你已经了解了策略的优点，我们可以尝试这种方法了。我们如何表示策略呢？Q 值是由神经网络参数化的，该网络返回动作价值作为标量。如果我们让网络对动作进行参数化，我们有多个选项可用。最简单的方法返回动作的名称或代码（对于离散动作），但这不是处理离散集合的最佳方法。一种更常用的解决方案（主要用于分类任务）是返回动作的概率分布。对于\
  \ `N` 个互斥的动作，我们返回 `N` 个数字，每个数字表示在特定状态（我们作为输入提供的状态）下执行该动作的概率。这种表示方法如图 11.1 所示。\n\n\
  ![\\[Bild\\]](Images/11_01.jpg)\n\n**图 11.1：** 使用神经网络对离散动作进行策略近似\n\n将动作表示为概率还提供了平滑表示（smooth\
  \ representation）的优势：当我们稍微改变网络权重时，网络的输出也会随之发生变化。对于离散数量的输出，权重的微调就可能导致另一个动作。相反，如果输出是概率分布，权重的微小变化通常会导致概率分布的小小变化，使得动作的概率仅发生轻微改变。这是一个非常理想的特性，因为基于梯度的优化方法核心就在于微调模型参数以获得更好的结果。在数学中，策略通常记为\
  \ `π(s)`，因此我们也使用这种记法。\n\n### 11.1.3 策略梯度（Policy Gradients）\n\n我们定义了策略的表示，但我还没有讨论如何通过更改网络参数来改进策略。在第\
  \ 4 节 讨论交叉熵（Cross-entropy）方法时，我们解决了一个非常相似的问题：我们的网络接收观测作为输入并返回动作的概率分布。实际上，交叉熵方法与书中此部分介绍的方法密切相关。首先，我们考虑一种名为\
  \ REINFORCE 的方法，它与交叉熵方法略有不同。但在之前，我们必须处理一些在本章及后续章节中将使用的数学符号。\n\n我们将 PG 定义为 `J` ![\\\
  [Bild\\]](Images/11_02.jpg)。当然，这有一个严格的证明，但在这里并不重要。我们更感兴趣的是这个表达式的含义。\n\nPG 定义了我们必须更改网络参数的方向，以改进策略，从而获得更高的累积奖励。梯度的缩放与执行动作的价值（上述公式中的\
  \ `Q(s, a)`）成正比。梯度本身是执行动作的对数概率的梯度。直观地意味着，我们正尝试增加那些带给我们良好奖励的动作的概率，并减少结果糟糕的动作的概率。公式中的期望算子\
  \ `E` 仅意味着我们在环境中执行多个步骤并计算梯度的平均值。\n\n从实践角度来看，PG 方法可以实现为损失函数 ![\\[Bild\\]](Images/11_02a.jpg)\
  \ 的优化。负号在这里很重要，因为损失函数在随机梯度下降中是被最小化的，但我们想要最大化策略梯度。在本章的后续以及后续章节中，我们将查看 PG 方法的代码示例。\n\
  \n## 11.2 REINFORCE 方法\n\n上述 PG 公式被大多数基于策略的方法使用，但在细节上存在差异。一个非常重要的点是如何计算关于 `Q(s,\
  \ a)` 的梯度。在第 4 节 的交叉熵方法中，我们运行了多个回合（episodes），分别计算了总奖励，并使用高于平均的回的回进行训练。这种训练对应于 PG\
  \ 方法：对于良好回合中的状态-动作对，`Q(s, a) = 1`；对于较差回合中的状态-动作对，`Q(s, a) = 0`。\n\n\n\n交叉熵方法即使在这些简化假设下也能运行，但其明显的改进在于，训练时不再简单地对\
  \ `Q(s, a)` 使用 0 和 1。为什么这有帮助？答案是，回合（episodes）之间的区分更加精细。例如，总奖励为 10 的回合中的转移对梯梯的贡献应该比奖励为\
  \ 1 的转移更大。第二个原因是不使用 0 和 1 来表示 `Q(s, a)`，而是增加了回合开始处良好动作的概率，并降低了靠近回合结束处的动作的概率（因为 `Q(s,\
  \ a)` 使用了折扣因子，因此较长动作序列的不确定性会被自动考虑进去）。这就是 REINFORCE 方法的核心思想。它包含以下步骤：\n\n1. 使用随机权重初始化网络。\n\
  2. 运行 `N` 个完整回合并保存 `(s, a, r, s')` 转移。\n3. 为所有回合 `k` 的每个步骤 `t` 计算后续步骤的折现总奖励：![\\\
  [Bild\\]](Images/11_03.jpg)\n4. 计算所有转移的损失函数：![\\[Bild\\]](Images/11_04.jpg)\n5.\
  \ 执行 `SGD` 以更新权重，以最小化损失。\n6. 从步骤 2 开始重复该过程，直到收敛。\n\n该算法与 Q-Learning 的区别在于以下几个重要方面：\n\
  \n* 它不需要显式的探索。在 Q-Learning 中，我们使用 Epsilon-Greedy 策略来探索环境并防止智能体陷入非最优策略。现在网络返回概率，探索会自动进行。开始时，网络用随机权重初始化并返回均匀分布。这种分布对应于智能体的随机行为。\n\
  * 它不使用回放池（Replay Buffer）。PG 方法属于同策略（On-Policy）方法类，因此不能使用从旧策略获得的数据进行训练。这有优有缺点。优点是此类方法通常收敛更快；缺点是它们通常比像\
  \ `DQN` 等离策略（Off-Policy）方法多得多的环境交互。\n* 不需要目标网络（Target Network）。我们在这里使用 Q 值，但它们源于环境中的经验。在\
  \ DQN 中，我们使用目标网络来消除近似 Q 值时的相关性，但这里没有近似。在下一节中，你将看到目标网络技巧在 PG 方法中也很有用。\n\n### 11.2.1\
  \ CartPole 示例\n\n为了看到 REINFORCE 方法的作用，我们用熟悉的 CartPole 环境对其进行测试。完整代码可以在 `Chapter11/02_cartpole_reinforce.py`\
  \ 文件中找到。\n\n```\nGAMMA = 0.99\nLEARNING_RATE = 0.01\nEPISODES_TO_TRAIN = 4\n```\n\
  \n首先，我们定义超参数（省略了导入部分）。`EPISODES_TO_TRAIN` 值决定了我们用于训练的多少个完整回合。\n\n```python\nclass\
  \ PGN(nn.Module):\n    def __init__(self, input_size, n_actions):\n        super(PGN,\
  \ self).__init__()\n\n        self.net = nn.Sequential(\n            nn.Linear(input_size,\
  \ 128),\n            nn.ReLU(),\n            nn.Linear(128, n_actions)\n       \
  \ )\n\n    def forward(self, x):\n        return self.net(x)\n```\n\n这个网络应该让你感到很熟悉。注意：虽然网络返回概率，但我们没有对输出应用\
  \ `softmax` 非线性变换。这是因为我们使用了 PyTorch 的 `log_softmax` 函数来计算 `softmax` 输出的对数。通过这样，计算在数值上要稳定得多，我们只需要不要忘记网络的输出不是概率，而是原始值（通常称为\
  \ Logits）。\n\n```python\ndef calc_qvals(rewards):\n    res = []\n    sum_r = 0.0\n\
  \    for r in reversed(rewards):\n        sum_r *= GAMMA\n        sum_r += r\n \
  \       res.append(sum_r)\n    return list(reversed(res))\n```\n\n这个函数稍微有点复杂。它接收整个回合的奖励列表，并为每个步骤计算后续步骤的折现总奖励。为了高效地完成这项任务，我们从奖励列表的尾开始计算。实际上，回合最后步骤的总奖励等于其局部奖励。在倒数第二个步骤，总奖励是...\n\
  \n\n\n\n## 准备工作\n\n在启动训练循环之前，我们还需要一些变量。第一组变量用于报告，负责记录回合的总奖励和已完成回合数。第二组用于收集训练数据。`cur_rewards`\
  \ 列表包含当前执行回合的本地奖励。当回合结束时，我们使用 `calc_qvals` 函数根据本地奖励计算折现后的总奖励，并将其添加到 `batch_qvals`\
  \ 列表中。`batch_states` 和 `batch_actions` 列表包含了来自上一次训练的状态和动作。\n\n```\nfor step_idx,\
  \ exp in enumerate(exp_source):\n    batch_states.append(exp.state)\n    batch_actions.append(int(exp.action))\n\
  \    cur_rewards.append(exp.reward)\n\n    if exp.last_state is None:\n        batch_qvals.extend(calc_qvals(cur_rewards))\n\
  \        cur_rewards.clear()\n        batch_episodes += 1\n```\n\n上述代码是训练循环的开始。我们从经验源中获取的经验值包括状态、动作、本地奖励和后续状态。如果到达了回合的结束，则后续状态为\
  \ `None`。对于未到达结束的条目，我们只在列表中存储状态、动作和本地奖励。在回合结束后，我们将本地奖励转换为 Q 值，并增加回合的计数器。\n\n```\n\
  new_rewards = exp_source.pop_total_rewards()\nif new_rewards:\n    done_episodes\
  \ += 1\n    reward = new_rewards[0]\n    total_rewards.append(reward)\n    mean_rewards\
  \ = float(np.mean(total_rewards[-100:]))\n    print(\"%d: reward: %6.2f, mean_100:\
  \ %6.2f, episodes: %d\"\n          % (step_idx, reward, mean_rewards, done_episodes))\n\
  \    writer.add_scalar(\"Belohnung\", reward, step_idx)\n    writer.add_scalar(\"\
  Belohnung_100\", mean_rewards,step_idx)\n    writer.add_scalar(\"Episoden\", done_episodes,\
  \ step_idx)\n    if mean_rewards > 195:\n        print(\"Gelöst in %d Schritten\
  \ und %d Episoden! \"\n              % (step_idx, done_episodes))\n        break\n\
  ```\n\n训练循环的这部分在回合结束时执行，负责在 TensorBoard 中显示进度和指标。\n\n```\nif batch_episodes < EPISODES_TO_TRAIN:\n\
  \    continue\n\noptimizer.zero_grad()\nstates_v = torch.FloatTensor(batch_states)\n\
  batch_actions_t = torch.LongTensor(batch_actions)\nbatch_qvals_v = torch.FloatTensor(batch_qvals)\n\
  ```\n\n如果自上次训练步骤以来已经完成了足够的回，我们就使用收集到的样本进行优化。第一步，我们必须将状态、动作和 Q 值转换为适用于 PyTorch 的格式。\n\
  \n```\nlogits_v = net(states_v)\nlog_prob_v = F.log_softmax(logits_v, dim=1)\nlog_prob_actions_v\
  \ = batch_qvals_v *\n                     log_prob_v[range(len(batch_states)),\n\
  \                     batch_actions_t]\nloss_v = -log_prob_actions_v.mean()\n```\n\
  \n随后，我们计算步进的损失。为此，我们指示网络将状态转换为 Logits，并在此计算对数和 `softmax`。在第三行中，我们选择已执行动作的对数概率，并用\
  \ Q 值进行缩放。在最后一行，我们计算这些缩放值的平均值并对结果取反，以获得需要最小化的损失。如所述，负号非常重要，因为我们必须最大化策略梯度（PG）以改进策略。由于\
  \ PyTorch 中的优化器是针对损失函数进行最小化的，因此我们必须对 PG 取反。\n\n```\n    loss_v.backward()\n    optimizer.step()\n\
  \    batch_episodes = 0\n    batch_states.clear()\n    batch_actions.clear()\n \
  \   batch_qvals.clear()\n\nwriter_close()\n```\n\n剩余的代码显而易见：我们进行反向传播以获取变量的梯度，并指示优化器执行\
  \ SGD 更新。在训练循环结束时，重置回合计数器并清空列表，以便收集新数据。\n\n### 11.2.2 结果\n\n作为一个示例，我使用了与 REINFORCE\
  \ 示例相同的超参数实现了 CartPole 环境的 DQN（文件 `Chapter11/01_cartpole_dqn.py`）。\n\n这两个示例不需要命令行参数，并且应该在一分钟内收敛。\n\
  \n```\nrl_book_samples/chapter01/01_cartpole_dqn.py\nrl_book_samples/chapter01/02_reinforce.py\n\
  ```\n\n\n\n\n正如你所看到的，并没有充分的理由去偏于其中某一种方法。在某些情况下，基于策略（policy-based）的方法更为自然，例如在具有连续值的控制任务中，或者可以快速方便地访问环境时。但在许多情况下，基于价值（value-based）的方法表现优异，正如\
  \ Atari 游戏中 `DQN` 变体的最新结果所示。理想情况下，你应该熟悉这两种方法，并了解它们的优缺点。\n\n在下一节中，我们将考虑 `REINFORCE`\
  \ 方法的局限性，探索改进方法，并将 `PG` 方法应用于 Pong 游戏。\n\n## 11.3 REINFORCE 的问题\n\n在上一节中，我讨论了 `REINFORCE`\
  \ 方法，它是交叉熵（cross-entropy）方法的一种自然扩展。遗憾的是，`REINFORCE` 方法和交叉熵方法都会带来一系列问题，限制了它们在简单环境的应用。\n\
  \n### 11.3.1 完整回合的必要性\n\n首先，我们必须等待一个回合（episode）完成才能开始训练。此外，当训练有更多可用回合时，`REINFORCE`\
  \ 和交叉熵方法的表现都更好。（这是因为更多的回提供了更多训练数据，从而导致更好的 `PG` 效果。）对于 CartPole 环境的短回合来说，这并不是问题，因为我们最初几乎无法走超过\
  \ 10 步；但对于 Pong 来说情况完全不同：每个回合可能持续几百甚至数千帧。这对训练来说也是不利的，因为批次（batches）会变得很大。此外，由于采样效率低，我们必须与环境进行大量的交互才能执行单次训练步骤。\n\
  \n需要完整回合的原因是为了获得尽可能准确的 `Q` 值估算。在 `DQN` 方法中，我们发现在实践中，通过贝尔曼方程 ![\\[图像\\]](Images/11_08.jpg)\
  \ 的估计来替换折现奖励的精确值是没问题的。为了估计 `V(s)`，我们 使用了自建的 `Q` 近似值，但在 `PG` 方法中，既没有 `V(s)` 也没有 `Q(s,\
  \ a)`。\n\n解决这个问题有两种方法。首先，我们可以指导网络去估计 `V(s)` 并使用该估计值来获取 `Q`。这种方法被称为 `Actor-Critic\
  \ 方法`，是 `PG` 方法族中最常用的方法。它将在下一章中讨论。\n\n其次，我们可以将贝尔曼方程应用于 `N` 个后续步骤，这利用了当 `gamma` 小于\
  \ 1 时，价值贡献会减少的特性。实际上，当 `gamma = 0.9` 时，十步后的价值系数仍为 `0.9¹⁰ = 0.35`。在第 50 步时，系数为 `0.9⁵⁰\
  \ = 0.00515`，这对总奖励的贡献非常微小。对于 `gamma = 0.99` 的情况，所需的步数会很多，但这种做法仍然可行。\n\n### 11.3.2\
  \ 梯度的高方差\n\n在 `PG` 公式 ![\\[图像\\]](Images/11_02.jpg) 中，梯度与给定状态的折现奖励成正比。然而，该奖励的范围很大程度上取决于环境。例如，在\
  \ CartPole 环境中，对于保持杆子直立的每一帧我们都会获得 1 的奖励。如果我们坚持了 5 步，就会获得 5 分（未折现的）奖励。如果我们的智能体足够聪明并坚持了\
  \ 100 步，总奖励就是 100。这些值之间相差了 20 倍，这意味着失败样本的数值范围比成功样本的小 20 倍。这种巨大的差异会对训练产生显著影响，因为一个特别成功的回合可能会剧烈地影响最终的梯度。\n\
  \n从数学角度来看，我们的 `PG` 方法具有高方差，在复杂环境中我们必须采取某些措施，否则训练过程可能会变得不稳定。为了处理这个问题，通常会从 `Q` 值中减去一个基准（`Baseline`）。对于这个基准，可以使用以下内容：\n\
  \n1. 一个常数值，通常是折现奖励的平均值\n2. 折现奖励的移动平均值\n3. 状态的价值 `V(s)` 值\n\n### 11.3.3 探索\n\n即使策略被表示为概率分布，智能体也有很大可能虽然收敛但只找到了局部最优策略，并停止了环境探索。在\
  \ `DQN` 中，我们使用了 `Epsilon-Greedy` 贪婪选择：智能体以 `epsilon` 的概率执行随机动作，而不是实际规定的动作。\n\n在信息论中，熵（entropy）是系统不确定性的衡量标准。对于策略而言，熵表示智能体对于应该执行哪个动作有多不确定。在数学符号中，熵定义为\
  \ ![\\[图像\\]](Images/11_09.jpg)。熵的值始终大于零。当策略分布均匀时，它达到最大值。换句话说：所有动作都是等等的。当策略对某个动作的概率为\
  \ 1 而其他所有概率为 0 时，熵最小，此时智能体对该做什么绝对确定。为了防止智能体停留在局部最小值，我们从损失函数中减去熵，以此惩罚过于自信的智能体。\n\n\
  ### 11.3.4 样本之间的相关性\n\n在本章中我讨论了来自同一回合的训练样本通常具有强相关性，这对 `SGD` 训练是有害的。在 `DQN` 中，我们通过一个包含十万到百万次观测的巨大回放缓冲区（replay\
  \ buffer）解决了这个问题。我们的训练数据也来自于这个数据池。这种解决方案对于 `PG` 方法不再适用，因为它们属于在线策略（On-policy）方法。简单来说：如果我们使用由旧策略产生的样本，我们得到的是旧策略的\
  \ PG，而不是当前策略的。\n\n## 11.4 使用 CartPole 使用 PG\n\n现在几乎没有人使用标准的 `PG` 方法了，因为有了更稳定的 `Actor-Critic`\
  \ 方法。尽管如此，我想介绍 `PG` 实现，因为它阐明了非常重要的概念，并提供了评估 `PG` 方法性能的可能性。\n\n### 11.4.1 实现\n\n\
  因此，我们首先考虑一个简化的 CartPole 环境，并在下一节中检查 Pong 游戏的性能。以下示例的完整代码可以在 `Chapter11/04_cartpole_pg.py`\
  \ 文件中找到。\n\n\n\n\n```\nGAMMA = 0.99\nLEARNING_RATE = 0.001\nENTROPY_BETA = 0.01\n\
  BATCH_SIZE = 8\nREWARD_STEPS = 10\n```\n\n除了已知的超参数外，还有两个新的。`ENTROPY_BETA` 值指定了熵奖励（Entropy\
  \ Bonus）的缩放因子，而 `REWARD_STEPS` 决定了应用 Bellman 方的后续步数，用于估计转换的折现总奖励。\n\n```python\n\
  class PGN(nn.Module):\n    def __init__(self, input_size, n_actions):\n        super(PGN,\
  \ self).__init__()\n\n        self.net = nn.Sequential(\n                      nn.Linear(input_size,\
  \ 128),\n                      nn.ReLU(),\n                      nn.Linear(128,\
  \ n_actions)\n                   )\n\n    def forward(self, x):\n        return\
  \ self.net(x)\n```\n\n网络架构与之前的 CartPole 示例完全相同：一个隐藏层包含 128 个神经元的二层网络。准备代码也与之前相同，只是指示经验源提前\
  \ 10 步应用 Bellman 方。以下部分与 `04_cartpole_pg.py` 的不同在于：\n\n```python\nexp_source = ptan.experience.ExperienceSourceFirstLast(env,\n\
  \                agent, gamma=GAMMA, steps_count=REWARD_STEPS)\n```\n\n在训练循环中，我们更新转换的折现奖励之和，并用它来计算策略缩放的基准（Baseline）。\n\
  \n```python\nfor step_idx, exp in enumerate(exp_source):\n    reward_sum += exp.reward\n\
  \    baseline = reward_sum / (step_idx + 1)\n    writer.add_scalar(\"baseline\"\
  , baseline, step_idx)\n    batch_states.append(exp.state)\n    batch_actions.append(int(exp.action))\n\
  \    batch_scales.append(exp.reward - baseline)\n```\n\n在计算损失时，我们使用与之前计算策略损失（负 PG）时相同的代码。\n\
  \n```python\noptimizer.zero_grad()\nlogits_v = net(states_v)\nlog_prob_v = F.log_softmax(logits_v,\
  \ dim=1)\nlog_prob_actions_v = batch_scale_v *\n               log_prob_v[range(BATCH_SIZE),\
  \ batch_actions_t]\nloss_policy_v = -log_prob_actions_v.mean()\n```\n\n随后，我们通过计算\
  \ Batch 的熵并将其从损失中减去，将熵奖励加入损失。由于熵在均匀分布时最大，而我们希望训练朝着这个方向发展，因此必须从损失中减去它。\n\n```python\n\
  prob_v = F.softmax(logits_v, dim=1)\nentropy_v = -(prob_v * log_prob_v).sum(dim=1).mean()\n\
  entropy_loss_v = -ENTROPY_BETA * entropy_v\nloss_v = loss_policy_v + entropy_loss_v\n\
  loss_v.backward()\noptimizer.step()\n```\n\n然后，我们计算新旧策略之间的 KL 散度（KL Divergence）。KL\
  \ 散度是一个衡量概率分布偏离预期概率分布程度的信息论指标。在我们的示例中，它被用于比较模型在优化步骤前后的返回的策略。KL 散度值较高通常是一个不好的信号，表明新策略偏离旧策略太远，这通常是有不利的，因为我们的神经网络是高维空间中的高度非线性函数，模型权重的大幅变化会对策略产生极大影响。\n\
  \n```python\nnew_logits_v = net(states_v)\nnew_prob_v = F.softmax(logits_v, dim=1)\n\
  kl_div_v = -((new_prob_v / prob_v).log() *\n                  prob_v).sum(dim=1).mean()\n\
  writer.add_scalar(\"kl\", kl_div_v.item(), step_idx)\n```\n\n最后，我们计算此训练步的梯度统计信息。通常显示梯度的最大值和\
  \ L2 范数是有意义的，以便对变化过程有一个直观认识。\n\n```python\ngrad_max = 0.0\ngrad_means = 0.0\ngrad_count\
  \ = 0\nfor p in net.parameters():\n    grad_max = max(grad_max, p.grad.abs().max().item())\n\
  \    grad_means += p.grad.mean().item()\n    grad_count += 1\n```\n\n\n\n\n在上一节中，我们发现虽然简单的\
  \ `PG` 方法在 `CartPole` 环境中表现良好，但在更复杂的环境中表现得惊人地糟糕。相对简单的 Atari 游戏 Pong，我们的 `DQN` 在百万帧后就能完全解决它，并且在仅经过\
  \ 100,000 帧后就获得了正奖励；相比之下，`PG` 方法则完全不收敛。由于 `PG` 训练存在不稳定性，寻找合适的超参数非常困难，而这些参数在初始化阶段具有极其重要的意义。\n\
  \n这并不是说 `PG` 方法普遍很糟糕，因为正如您在下一节中看到的，对网络架构相对于基准进行微小的优化，就可以使 `PG` 成为最好的方法之一（异步优势演员-评论算法，即\
  \ A3C 方法）。当然，始终存在所选超参数完全不适用、代码仍包含某些 Bug 或其他任何问题的问题。但尽管如此，失败的尝试也是有价值的，至少可以证明某种方法的收敛效果不好。\n\
  \n### 11.5.1 实现\n\n您可以在 `Chapter11/05_pong_pg.py` 文件中找到示例的完整代码。\n\n与之前的示例代码相比，三个关键区别如下：\n\
  \n*   基准（Baseline）通过最后百万（而不是所有）转换的移动平均来估计。\n*   同时使用了多个环境。\n*   对梯度进行了裁剪（Clipping），以提高训练的稳定性。\n\
  \n为了加速移动平均值的计算，创建了一个 `deque` 缓冲区。\n\n```python\nclass MeanBuffer:\n    def __init__(self,\
  \ capacity):\n        self.capacity = capacity\n        self.deque = collections.deque(maxlen=capacity)\n\
  \        self.sum = 0.0\n\n    def add(self, val):\n        if len(self.deque) ==\
  \ self.capacity:\n            self.sum -= self.deque[0]\n        self.deque.append(val)\n\
  \        self.sum += val\n\n    def mean(self):\n        if not self.deque:\n  \
  \          return 0.0\n        return self.sum / len(self.deque)\n```\n\n该示例的第二个区别是使用了多个环境。这一功能由\
  \ `PTAN` 库支持。我们只需要传递 `ExperienceSource` 类的 `Env` 对象数组即可。其他所有工作将自动完成。如果有多个环境，经验源将以轮询（Round-Robin）的方式获取转换，为我们提供相关性较低的训练样本。与\
  \ CartPole 示例的最后一个区别是梯度裁剪，是由 `torch.nn.utils` 包中的 PyTorch 函数 `clip_grad_norm` 完成的。\n\
  \n最佳版本的超参数如下：\n\n```python\nGAMMA = 0.99\nLEARNING_RATE = 0.0001\nENTROPY_BETA =\
  \ 0.01\nBATCH_SIZE = 128\n\nREWARD_STEPS = 10\nBASELINE_STEPS = 1000000\n\nGRAD_L2_CLIP\
  \ = 0.1\n\nENV_COUNT = 32\n```\n\n### 11.5.2 结果\n\n我们来看该示例的最佳运行。图 11.14 显示了奖励图。在这里可以看出，训练期间的奖励最初几乎保持不变，然后增加，并被极小奖励（-21）阶段中断。\n\
  \n![\\[图像\\]](Images/11_21.jpg)\n\n**图 11.14：** Pong 的奖励图\n\n在熵图（图 11.15\n\n**图\
  \ 11.15：** Pong 的 PG 方法的其他图\n\n![\\[图像\\]](Images/11_23.jpg)\n\n**图 11.16：** 基准、缩放及其标准差\n\
  \nKL 散度图显示出一些锯齿，大约发生在与熵为零的状态之间转换的时间点（图 11.17）。这表明策略（Policy）受到分布不规则性的强烈影响。\n\n![\\\
  [图像\\]](Images/11_24.jpg)\n\n**图 11.17：** KL 散度与损失\n\n### 11.6 总结\n\n在本章中，我们学习了处理\
  \ RL 任务的另一种方法：`PG` 方法，它在许多方面与基于价值的方法不同。我们探索了名为 `REINFORCE` 的基础方法，尽管它很简单，但在应用于 Pong\
  \ 时并没有产生良好的结果。在下一节中，我们将考虑通过结合基于价值和基于策略的方法来提高方法稳定性的可能性。\n\n# Actor-Critic 算法\n\n\
  在上一节中，我们研究了已知基于价值的方法的替代方案，即基于策略的方法。我们特别关注了一种名为 `REINFORCE` 的方法，它使用折扣奖励来获取策略梯度（梯度指示了我们为了改进策略所移动的方向）。两者在较小的\
  \ CartPole 环境中运行良好，但在更复杂的 Pong 环境中，收敛速度慢得令人痛苦。\n\n接下来我将讨论简单策略梯度方法的的一种扩展，它像魔术一样改进了新方法的稳定性和收敛速度。尽管修改非常微小，但它有自己的名字：`Actor-Critic\
  \ 算法`。它是深度强化学习中性能最好的方法之一。\n\n在本节中，我们将：\n\n*   探索基准如何影响指标和梯度的收敛，以及\n*   研究基准概念的扩展。\n\
  \n### 12.1 减少方差\n\n上一节中简要提到，减少梯度方差是提高稳定性的一种方法。为什么这很重要？减少方差意味着什么？在统计学中，方差定义为随机变量与其期望值之间偏差的期望。方差表示数值围绕平均值的离散程度。如果方差很大，随机变量可能会取到偏离平均值很多的值。图\
  \ 12.1 显示了三个具有相同均值 µ = 10 但方差不同的正态分布（高斯分布）。\n\n\n\n\n回到 PG 算法。在上一章中已经提到，该算法的核心思想是增加良好动作的概率并降低糟糕动作的概率。在数学表示法中，我们的\
  \ PG 表示为 ![\\[图像\\]](Images/12_03.jpg)。缩放因子 `Q(s, a)` 决定了我们想要在多大程度上增加或降低在特定状态下执行动作的概率。在\
  \ REINFORCE 算法中，我们使用了折扣总奖励来缩放梯度。为了增加稳定性，我们尝试性地从梯度中减去了平均奖励。为了理解为什么这样做有效，我们考虑一个特别简单的优化步骤，其中有三个不同折扣总奖励的动作：`Q[1]`、`Q[2]`\
  \ 和 `Q[3]`。现在我们根据这些 Q 值的相对值来考虑策略梯度（Policy Gradient）。\n\n![\\[图像\\]](Images/12_02.jpg)\n\
  \n**图 12.1：** 高斯分布中方差差的影响\n\n在第一个例子中，`Q[1]` 和 `Q[2]` 应该是较小的正数，而 `Q[3]` 是一个很大的负数。这意味着前两个步骤的动作导致了较小的奖励，而第三步并不算成功。这三个步骤产生的*组合*梯度现在将尝试让我们的策略远离第三步的动作，并将其略微移向前两个步骤的方向，这是完全合理的。\n\
  \n现在让我们假设奖励始终为正，只是数值的大小有所不同。这意味着我们为 `Q[1]`、`Q[2]` 和 `Q[3]` 加上了一个常数。在这种情况下，`Q[1]`\
  \ 和 `Q[2]` 是较大的正数，而 `Q[3]` 有一个较小的正值。这会导致策略在更新时发生变化。现在我们将努力让策略向前两个步骤的动作的方向移动，并稍微向第三步的动作方向移动。准确地说，我们不再试图避免第三步的动作——尽管相对奖励是相同的。\n\
  \n这种策略在更新时对加上奖励的常数的依赖性会显著减慢训练速度，因为我们可能需要更多的样本来平均抵消 PG 中这种位移的影响。更糟糕的是，当折扣总奖励随时间推移时（因为智能体正在学会做得更好），PG\
  \ 的方差可能会发生变化。例如，在 Pong 环境中，初始平均奖励为 -21...-20，因此所有动作看起来都几乎一样糟糕。\n\n为了解决这个问题，我们在上一章中从\
  \ Q 值中减去了平均总奖励，并将结果称为基准（Baseline）。这个技巧归一化了我们的 PG，因为如果平均奖励是 -21，那么 -20 的奖励对智能体来说就像成功，策略将向执行的动作的方向移动。\n\
  \n## 12.2 CartPole 环境的方差\n\n为了在实践中验证这一理论结论，我们创建了训练期间 PG 方差的图，包括带基准和不带基准的版本。完整示例位于\
  \ `Chapter12/01_cartpole_pg.py` 文件。大部分代码与第 11 章 相同。但在该版本中存在以下差异：\n\n* 您可以使用命令行选项\
  \ `--baseline`，它可以启用从奖励中减去平均值的功能。默认情况下它是关闭的。\n* 在每次运行训练循环时，我们计算策略损失的梯度，并使用这些数据来计算方差。\n\
  \n为了只使用策略损失的梯度而排除熵奖励（在探索时添加的），我们需要分两个阶段执行计算。幸运的是，这用 PyTorch 非常简单。下面仅列出了训练循环中具有意义的部分，以阐明思路。\n\
  \n```\noptimizer.zero_grad()\nlogits_v = net(states_v)\nlog_prob_v = F.log_softmax(logits_v,\
  \ dim=1)\nlog_p_a_v = log_prob_v[range(BATCH_SIZE), batch_actions_t]\nlog_prob_actions_v\
  \ = batch_scale_v * log_p_a_v\nloss_policy_v = -log_prob_actions_v.mean()\n```\n\
  \n我们像之前一样计算策略损失，通过对执行动作的概率取对数，并与策略值相乘（如果不使用基准或总奖励减基准，这些就是折扣总奖励）。\n\n```\nloss_policy_v.backward(retain_graph=True)\n\
  ```\n\n在下一步中，我们指示 PyTorch 对策略损失进行反向传播，计算梯度并将其存储在模型中。\n\n```\noptimizer.zero_grad()\n\
  logits_v = net(states_v)\nlog_prob_v = F.log_softmax(logits_v, dim=1)\nlog_p_a_v\
  \ = log_prob_v[range(BATCH_SIZE), batch_actions_t]\nlog_prob_actions_v = batch_scale_v\
  \ * log_p_a_v\nloss_policy_v = -log_prob_actions_v.mean()\n\nprob_v = F.softmax(logits_v,\
  \ dim=1)\nentropy_v = -(prob_v * log_prob_v).sum(dim=1).mean()\nentropy_loss_v =\
  \ -ENTROPY_BETA * entropy_v\nentropy_loss_v.backward()\noptimizer.step()\n```\n\n\
  随后我们只需要通过 TensorBoard 输出感兴趣的统计数据。\n\n```\ngrads = np.concatenate([p.grad.data.flatten()\
  \ for p in net.parameters() if p.grad is not None])\ng_l2 = np.sqrt(np.mean(np.square(grads)))\n\
  g_max = np.max(np.abs(grads))\nwriter.add_scalar(\"grad_l2\", g_l2, step_idx)\n\
  writer.add_scalar(\"grad_max\", g_max, step_idx)\nwriter.add_scalar(\"grad_var\"\
  , np.var(grads), step_idx)\n```\n\n如果我们运行示例两次，一次使用 `--baseline` 命令行选项，一次不使用，我们将得到\
  \ PG 方差的图表。图 12.2 和图 12.3 显示了奖励的趋势。\n\n![\\[图像\\]](Images/12_04.jpg)\n\n**图 12.2：**\
  \ 不带基准（左）和带基准（右）的节点奖励\n\n![\\[图像\\]](Images/12_04a.jpg)\n\n**图 12.3：** 两个版本的平滑奖励\n\
  \n\n\n\n\n### 图 12.4：两个版本梯度的 L2 范数（左侧）和最大值（右侧）\n\n![\\Bild\n\n### 图 12.5：两个版本梯度的方差\n\
  \n如你所见，带有 Baseline 的版本的方差比没有 Baseline 的版本小两到三个数量级。这使得收敛速度更快。\n\n## 12.3 Actor-Critic\n\
  \n减少方差的下一步是使用与状态相关的基准（Baseline）。这显然是有意义的，因为不同的状态可能有完全不同的基准。为了判断某个动作在某个状态下是否合适，我们使用该动作的折扣总奖励。然而，总奖励可以表示为状态的\
  \ `Wert`（价值）加上动作的 `Advantage-Wert`（优势值/Advantage 值）：`Q(s, a) = V(s) + A(s, a)`。我们在\
  \ 第 8 章 中讨论过这一点，以及 *DQN 扩展,*，当时涉及到关于简单 DQN 的扩展，特别是竞争性 DQN。\n\n但是，我们为什么不能使用 `V(s)`\
  \ 作为基准呢？在这种情况下，我们梯度的值将是优势 `A(s, a)`，它表示所执行的动作相对于平均状态价值好在何种程度上。因此，我们实际上可以这样做，这是改进\
  \ PG（策略梯度）方法的好主意。问题仅在于，我们不知道应该从折扣总奖励 `Q(s, a)` 中减去的状态价值 `V(s)`。为了解决这个问题，我们使用另一个神经网络来近似所有观测结果的\
  \ `V(s)`。对于训练，我们可以使用与 DQN 方法相同的步骤：我们执行贝尔曼步（Bellman step），然后最小化均方误差，以改进 `V(s)` 的近似值。\n\
  \n当我们知道一个状态的价值（或至少有一个近似值），我们就可以使用它来计算 PG 并更新我们的策略，以增加高优势值动作的概率，并降低低优势值动作的概率。策略网络（返回动作的概率分布）被称为\
  \ `Actor`（演员），因为它决定了如何行事。另一个网络被称为 `Critic`（评论员），因为它允许我们评估我们的动作执行得有多好。这种扩展以自己的名称为人知，即\
  \ Advantage-Actor-Critic 方法，它通常缩写为 A2C。在图 12.6 中展示了这种架构。\n\n![\\Bild\n\n### 图 12.6：A2C\
  \ 架构\n\n在实践中，策略网络和价值网络部分重叠，主要是出于效率和更好收敛性的考虑。在这种情况下，Actor 和 Critic 在网络的不同输出端处实现，并将共享网络（主体）的输出一个转换为概率分布，另一个则转换为一个表示状态价值的单一数字。\n\
  \n通过这种方式，两者都可以利用低级特征（例如 Atari 代理的卷积滤波器），但以不同的方式组合这些特征。这种架构在图 12.7 中所示。\n\n![\\Bild\n\
  \n### 图 12.7：带有共享网络的 A2C 架构\n\n对于训练，需要以下步骤：\n\n1. 随机初始化网络参数 `θ`。\n2. 让环境运行 `N` 步策略\
  \ `π`，并记录状态 `s` 和奖励 `r`。\n3. 当回合结束或达到 `t` 时，`R = 0`。\n4. 执行以下步骤：\n    * ![\\Bild\n\
  \    * 累加梯度 ![\\Bild\n    * 价值策略的梯度 ![\\Bild\n5. 使用累加的梯度更新网络参数 ![\\Bild。\n6. 从步骤\
  \ 2 重复，直到收敛。\n\n该算法是研究论文中给出的指南。在实践中还需要考虑其他因素：\n\n- 为了改进探索，增加了熵奖励：![\\Bild。\n- 为了稳定性，可以使用多个环境（如果从它们创建训练\
  \ batch）。\n- 策略、价值和熵的三个部分都将被最小化。\n\n\n\n\n```python\nclass AtariA2C(nn.Module):\n\
  \    def __init__(self, input_shape, n_actions):\n        super(AtariA2C, self).__init__()\n\
  \n        self.conv = nn.Sequential(\n            nn.Conv2d(input_shape[0], 32,\
  \ kernel_size=8,\n                                                   stride=4),\n\
  \            nn.ReLU(),\n            nn.Conv2d(32, 64, kernel_size=4, stride=2),\n\
  \            nn.ReLU(),\n            nn.Conv2d(64, 64, kernel_size=3, stride=1),\n\
  \            nn.ReLU()\n        )\n        conv_out_size = self._get_conv_out(input_shape)\n\
  \        self.policy = nn.Sequential(\n            nn.Linear(conv_out_size, 512),\n\
  \            nn.ReLU(),\n            nn.Linear(512, n_actions)\n        )\n    \
  \    self.value = nn.Sequential(\n            nn.Linear(conv_out_size, 512),\n \
  \           nn.ReLU(),\n            nn.Linear(512, 1)\n        )\n```\n\n我们的网络架构包含一个共享的卷积层和两个输出。第一个输出带有动作概率分布的策略（Policy），第二个输出一个单一数值，即状态值的近似值。该架构与第\
  \ 8 章中的竞争对手 DQN 相似，但训练过程不同。\n\n```python\ndef _get_conv_out(self, shape):\n    o\
  \ = self.conv(torch.zeros(1, *shape))\n    return int(np.prod(o.size()))\n\ndef\
  \ forward(self, x):\n    fx = x.float() / 256\n    conv_out = self.conv(fx).view(fx.size()[0],\
  \ -1)\n    return self.policy(conv_out), self.value(conv_out)\n```\n\n`forward()`\
  \ 返回一个包含两个张量的元组：`policy` 和 `value`。接下来是一个大型且重要的函数，它接收一个包含环境转换的批（batch），并返回三个张量：状态批、已执行的动作批以及根据公式\
  \ ![\\[Bild\\]](Images/12_14.jpg) 计算的 Q 值批。该 Q 值用于两个地方：用于计算损失的均方误差以像 DQN 一样改进近似，以及用于计算动作的优势值（Advantage）。\n\
  \n```python\ndef unpack_batch(batch, net, device='cpu'):\n    states = []\n    actions\
  \ = []\n    rewards = []\n    not_done_idx = []\n    last_states = []\n    for idx,\
  \ exp in enumerate(batch):\n        states.append(np.array(exp.state, copy=False))\n\
  \        actions.append(int(exp.action))\n        rewards.append(exp.reward)\n \
  \       if exp.last_state is not None:\n            not_done_idx.append(idx)\n \
  \           last_states.append(np.array(exp.last_state,\n                      \
  \                      copy=False))\n```\n\n在第一个循环中，我们遍历转换批并将字段复制到列表中。注意，奖励已经包含了\
  \ `REWARD_STEPS` 步后续步骤的折扣奖励，因为我们使用了 `ptan.ExperienceSourceFirstLast` 类。此外，我们必须处理回合的结束并存储回合尚未结束的批项索引。\n\
  \n```python\nstates_v = torch.FloatTensor(\n    np.array(states, copy=False)).to(device)\n\
  actions_t = torch.LongTensor(actions).to(device)\n```\n\n上述代码将收集到的状态和动作转换为 PyTorch\
  \ 张量，并在需要将其复制到 GPU。对 `np.array()` 的额外调用似乎是多的，但如果没有它，创建张量的时间会慢 5 到 10 倍。PyTorch 中的这个问题尚未解决（[`github.com/pytorch/pytorch/issues/13918`](https://github.com/pytorch/pytorch/issues/13918)），因此解决方案是传递单个\
  \ NumPy 数组而不是数组列表。\n\n剩余的函数在考虑已结束回合的情况下计算 Q 值。\n\n```python\nrewards_np = np.array(rewards,\
  \ dtype=np.float32)\nif not_done_idx:\n    last_states_v = torch.FloatTensor(\n\
  \        np.array(last_states, copy=False)).to(device)\n    last_vals_v = net(states_v)[1]\n\
  \    last_vals_np = last_vals_v.data.cpu().numpy()[:, 0]\n    last_vals_np *= GAMMA\
  \ ** REWARD_STEPS\n    rewards_np[not_done_idx] += last_vals_v\n```\n\n代码使用转换链中的最后一个状态查询网络\
  \ *V(s)* 的近似值。该值乘以折扣因子并加到奖励上。\n\n```python\nref_vals_v = torch.FloatTensor(rewards_np).to(device)\n\
  return states_v, actions_t, ref_vals_v\n```\n\n在函数结束时，我们返回状态、动作和值（注：此处原文为 values，应为\
  \ values，此处根据语境译为 ref_vals_v）。\n\n```python\nif __name__ == \"__main__\":\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument(\"--cuda\", default=False,\
  \ action=\"store_true\", help=\"启用 Cuda\")\n    parser.add_argument(\"-n\", \"--name\"\
  , required=True, help=\"运行名称\")\n    args = parser.parse_args()\n    device = torch.device(\"\
  cuda\" if args.cuda else \"cpu\")\n\n    make_env = lambda: gym.make(\"PongNokip-v4\"\
  )\n    envs = [make_env() for _ in range(NUM_ENVS)]\n    writer = SummaryWriter(comment=\"\
  -a2c_\" + args.name)\n\n    net = AtariA2C(envs[0].observation_space.shape, envs[0].action_space.n).to(device)\n\
  \    agent = ptan.agent.PolicyAgent(lambda x: net(x)[0], apply_softmax=True)\n \
  \   exp_source = ptan.experience.ExperienceSourceFirstLast(envs, agent, gamma=GAMMA,\
  \ steps_count=REWARD_STEPS)\n\n    optimizer = optim.Adam(net.parameters(), lr=LEARNING_RATE,\
  \ eps=1e-3)\n\n    batch = []\n\n    with common.RewardTracker(writer, stop_reward=18)\
  \ as tracker:\n        with ptan.common.utils.TBMeanTracker(writer, batch_size=10)\
  \ as tb_tracker:\n            for step_idx, exp in enumerate(exp_source):\n    \
  \            batch.append(exp)\n\n                new_rewards = exp_source.pop_total_rewards()\n\
  \                if new_rewards:\n                    if tracker.reward(new_rewards[0],\
  \ step_idx):\n                         break\n\n                if len(batch) <\
  \ BATCH_SIZE:\n                    continue\n```\n\n\n\n\n```\nstates_v, actions_t,\
  \ vals_ref_v =\n           unpack_batch(batch, net, device=device)\nbatch.clear()\n\
  optimizer.zero_grad()\nlogits_v, value_v = net(states_v)\n```\n\n首先，我们使用描述过的函数解包\
  \ Batch，并向网络查询该 Batch 的策略（Policy）和值（Values）。策略以未归一化的形式返回，因此我们需要应用 `softmax` 将其转换为概率分布。\n\
  \n我们将这一步推迟，直到我们使用 `log_softmax`，因为后者在数值上更稳定。\n\n```\nloss_value_v = F.mse_loss(value_v.squeeze(-1),\
  \ vals_ref_v)\n```\n\n值损失的计算非常直观：我们计算网络返回的数值与通过通过尔曼方程提前四步计算出的近似值之间的均方误差（`Mean Squared\
  \ Error`, `MSE`）。\n\n```\nlog_prob_v = F.log_softmax(logits_v, dim=1)\nadv_v = vals_ref_v\
  \ - value_v.detach()\nlog_p_a = log_prob_v[range(BATCH_SIZE), actions_t]\nlog_prob_actions_v\
  \ = adv_v * Log_p_a\nloss_policy_v = -log_prob_actions_v.mean()\n```\n\n在这里我们计算策略损失以获得策略梯度（PG）。我们获取策略的对数并计算动作的优势值（Advantage），其公式为\
  \ `A(s, a) = Q(s, a) – V(s)`。调用 `value_v.detach()` 是重要的，因为 PG 不应该影响近似输出。然后我们对执行动作的概率取对数，并用优势对其进行缩放。我们的\
  \ PG 损失等于这些缩放值的负平均值，因为 PG 指出了改进策略的方向，而损失应该被最小化。\n\n```\nprob_v = F.softmax(logits_v,\
  \ dim=1)\nent = (prob_v * log_prob_v).sum(dim=1).mean()\nentropy_loss_v = ENTROPY_BETA\
  \ * ent\n```\n\n我们损失函数的最后一部分是计算熵损失，它等于我们策略缩放熵的反符号。（熵是 ![\\[图像\\]](Images/12_15.jpg)..）\n\
  \n```\nloss_policy_v.backward(retain_graph=True)\ngrads = np.concatenate([p.grad.data.cpu().numpy().flatten()\n\
  \                        for p in net.parameters()\n                        if p.grad\
  \ is not None])\n```\n\n上面的代码计算并提取了我们策略的梯度，这些梯度用于记录方差和最大梯度的 L2 范数。\n\n```\nloss_v\
  \ = entropy_loss_v + loss_value_v\nloss_v.backward()\nnn_utils.clip_grad_norm_(net.parameters(),\
  \ CLIP_GRAD)\noptimizer.step()\nloss_v += loss_policy_v\n```\n\n作为训练的最后一步，我们对熵损失和值损失进行反向传播，裁剪梯度并指示优化器更新网络。\n\
  \n```\ntb_tracker.track(\"advantage\", adv_v, step_idx)\ntb_tracker.track(\"values\"\
  , value_v, step_idx)\ntb_tracker.track(\"batch_rewards\", vals_ref_v, step_idx)\n\
  tb_tracker.track(\"entropy\", entropy_loss_v, step_idx)\ntb_tracker.track(\"policy\"\
  , loss_policy_v, step_idx)\ntb_tracker.track(\"value\", loss_value_v, step_idx)\n\
  tb_tracker.track(\"total\", loss_v, step_idx)\ntb_tracker.track(\"grad_l2\", g_l2,\
  \ step_idx)\ntb_tracker.track(\"grad_max\", g_max, step_idx)\ntb_tracker.track(\"\
  grad_var\", g_var, step_idx)\n```\n\n\n\n\n在上一节中，我们解决了 Pong 问题——这经历了三个小时的优化以及对九百万帧数数据的处理。现在，我们应该优化超参数以加速收敛。这里的黄金法则是：每次只优化一个选项，并谨慎地得出结论，因为整个过程是随机的。\n\
  \n我们首先使用原始的超参数，并进行以下实验：\n* 增加学习率\n* 增加熵参数 `beta`\n* 更改收集经验的环境数量\n* 调整批次大小（Batch\
  \ size）\n\n严格来说，接下来的实验并不是真正的超参数优化，而是为了尝试更好地理解 `A2C` 收敛行为如何依赖于这些参数。在寻找最佳参数时，完全的网格搜索或随机采样可能会获得好得的结果，但这些方法需要更多的时间和资源。\n\
  \n### 12.6.1 学习率\n\n`学习率` (`LR`）的初始值为 `0,001`，我们可以预期较大的学习率会导致更快的收敛。在我的测试中，事实是正确的，但仅限于一定范围内：在达到\
  \ `0,003` 的值之前，收敛速度会增加。当值更大时，系统将完全不再收敛。\n\n以下是结果：\n* `LR = 0,002`: 480 万帧，1.5 小时\n\
  * `LR = 0,003`: 360 万帧，1 小时\n* `LR = 0,004`: 不收敛\n* `LR = 0,005`: 不收敛\n\n图 12.13\
  \ 显示了奖励和价值损失的下降曲线。较大的学习率会导致更小的损失，这表明使用两个优化器分别用于策略和价值（使用不同的学习率）可能会带来更稳定的学习。\n\n![\\\
  [图像\\]](Images/12_21.jpg)\n\n**图 12.13：** 不同学习率的实验（较大的学习率意味着更快的收敛）\n\n### 12.6.2\
  \ Beta\n\n我尝试了两个值：`0,02` 和 `0,03`。第一个值带来了改进，但使用第二个值时结果再次恶化。因此，最优值一定在两者之间。以下是结果：\n\
  * `beta = 0,02`: 680 万帧，2 小时\n* `beta = 0,03`: 1200 万帧，4 小时\n\n### 12.6.3 环境数量\n\
  \n多少数量的环境效果最好并不显而易见，因此我尝试了比初始值 `50` 大或小的不同值。结果是矛盾的，但显然更多的环境会导致更快的收敛：\n* `Envs =\
  \ 40`: 860 万帧，3 小时\n* `Envs = 30`: 620 万帧，2 小时（这里可能是因为随机数生成器选择了一个特别幸运的起始值，即“幸运的种子”）\n\
  * `Envs = 20`: 950 万帧，3 小时\n* `Envs = 10`: 不收敛\n* `Envs = 60`: 1160 万帧，4 小时（这里看起来像是一个“不幸运的种子”）\n\
  * `Envs = 70`: 770 万帧，2.5 小时\n\n### 12.6.4 批次大小\n\n批次大小的实验给出了意外的结果：较小的批次会导致更快的收敛，但在批次非常小时，奖励不再增加。从强化学习的角度来看，这是逻辑，因为对于较小的批次，我们需要更频繁地更新网络且需要的观测更少，但这对于深度学习来说是不合逻辑的，因为较大的批次通常意味着更多的训练数据：\n\
  * `Batch = 64`: 490 万帧，1.7 小时\n* `Batch = 32`: 380 万帧，1.5 小时\n* `Batch = 16`: 不收敛\n\
  \n## 12.7 总结\n\n在本章中，你学习了深度深度强化学习方法之一：`A2C`，它巧妙地将策略梯度（PG）更新与状态价值估计相结合。我们研究了 `A2C`\
  \ 方法的基本思想，并分析了基准（Baseline）对梯度行为和收敛的影响。随后，我们研究了扩展：`A2C`，其中网络的独立输出为我们提供了当前状态的基准。\n\
  \n在下一章中，我们将考虑在分布式系统中部署该算法的方法。\n\n# 第 13 章：异步优势 Actor-Critic\n\n本章致力于 Actor-Critic\
  \ 方法（`A2C`）的扩展，我在上一节中详细讨论了它。该扩展允许与环境进行真正的异步交互。其全称为 `Asynchronous Advantage Actor\
  \ Critic`，通常缩为 `A3C`。它是从业者最常用的方法之一。\n\n我们现在将考虑两种为简单的 `A2C` 方法添加异步行为的方法：数据并行和梯度并行。这两个方法具有不同的需求和特性，因此适用于不同的场景。\n\
  \n本章主题：\n* 为什么使用多个环境的训练数据对于策略梯度方法至关重要\n* 两种 `A3C` 方法的实现\n\n## 13.1 相关性与样本效率\n\n\
  提高策略稳定性的一个方法是同时使用多个环境。这源于我们在第 6 章、Deep Q-Networks* 中讨论过的基本问题，当我们处理样本的相关性时，这种相关性导致了\
  \ i.i.d. 假设不再成立，而该假设是随机梯度下降优化所需的。这种相关性的负面影响是梯度方差极大，这意味着我们的训练批次包含非常相似的样本，它们会将网络向同一个方向推。。从全局来看，这个方向可能是完全错误的，因为所有样本都来自一个特别好或特别坏的片段。\n\
  \n\n\n几年前，研究人员开始关注这一问题，并提出了许多解决思路。然而，我们距离解决方案仍然遥远。最常用的方法是从多个同时存在的环境中收集转换（transitions），这些环境都使用相同的当前策略（policy）。通过这种方式，单个回合（episode）内部的相关性被消除了，因为训练时使用了来自不同环境的不同回合。与此同时，我们仍然在使用当前的策略。这种方法有一个巨大的缺点，即`采样效率低下`，因为我们从上上丢弃了刚刚在当前训练中收集的所有经验。\n\
  \nDQN 和 PG 方法可以很容易比较。例如，在 DQN 方法中，如果我们对 Replay Buffer 使用了 100 万个样本，并且每个新帧的训练批次大小为\
  \ 32 个样本，那么每个单独的转换在从 Replay Buffer 中弹出之前，会被使用大约 32 次。在第 8 章中讨论的优先级回放缓冲区中，这个数字可能大得多，因为采样概率不是均匀分布的。在\
  \ PG 方法中，从环境中获得的每条经验只能使用一次，因为该方法需要新数据。因此，PG 方法的数据效率可能比基于值的 Off-Policy 方法小一个数量级。\n\
  \n另一方面，我们的 A2C 代理在 Pong 游戏中运行 800 万帧后就收敛，这仅仅是第 6 章和第 8 章中简单 DQN 100 万帧的八倍。这告诉我们，PG\
  \ 方法并非完全无用；它们只是不同，并且具有在选择方法时必须考虑的特性。如果代理与环境的交互简单（环境运行快、内存内存、可以并行等），PG 方法可能是更好的选择。相反，如果环境计算密集，且查询大量经验可能会降低训练速度，那么基于的方法可能更合适。\n\
  \n## 13.2 为 A2C 增加另一个 A\n\n从工程角度来看，与多个环境通信非常简单——我们在上一章中已经使用了它们，我没有显式指出。在 A2C 代理中，我们向\
  \ `ExperienceSource` 类传递了一个数组，使其能够以轮询（Round-Robin）的方式收集数据：当我们从经验源获取一个转换时，该类会使用数组中的下一个环境（当然，环境的状态会被保留）。这种简单的方法等同于与环境进行并行通信，但有一个关键区别：严格来说，通信不是并行的，而是串行的。然而，来自经验源的样本是混合过的。图\
  \ 13.1 展示了这一概念。\n\n这种方法运行良好，并帮助我们在 A2C 方法中实现了收敛，但在计算需求方面它仍然并不完美。如今，即使是配置基础的计算机也拥有多个可以用于计算的处理器，例如用于训练或与环境交互。另一方面，并发编程比具有明确执行顺序的传统范式难以实现。幸运的是，Python\
  \ 是一种非常强大且灵活的编程语言，有许多第三方库可以毫不困难地实现并发编程。\n\n![Bild\n\n**图 13.1:** 同时使用多个环境训练代理\n\n\
  同样令人高兴的是，PyTorch 通过 `torch.multiprocessing` 直接支持并行编程。并行编程和分布式计算是一个非常广泛的主题，远远超本书的范围。我们在这里仅仅接触了并行化的皮毛，但还有很多可以发现的内容。\n\
  \n在 Actor-Critic 方法的并行化方面，有两种方法：\n\n1.  **数据并行：** 我们可以使用多个进程，每个进程至少与一个环境通信并为我们提供转换（`s,\
  \ r, a, s'`）。所有这些示例都汇聚在一个训练进程中，该进程计算损失并通过 `SGD` 执行参数更新。随后，必须将神经网络（`NN`）更新后的参数传递给所有其他进程，以便在未来与环境通信时使用。\n\
  2.  **梯度并行：** 训练过程的目标是计算梯度以更新我们的 `NN`，因此我们使用多个进程为各自的训练示例计算梯度。然后对这些梯度进行求和，以便在一个进程中通过\
  \ `SGD` 执行更新。当然，更新的网络权重也必须传递给其他进程，以保持数据的最新。\n\n在图 13.2 和图 13.3 展示了这些方法。\n\n![Bild\n\
  \n**图 13.2:** 基于收集分布式示例的第一种\n\n![Bild\n\n**图 13.3:** 收集梯度的第二种\n\n## 13.3 Python\
  \ 中的 Multiprocessing\n\nPython 包含 `multiprocessing` 模块（通常缩写为 `mp`），它支持进程层面的并发以及所需的通信元素。在我们的示例中，我们使用了该模块中最重要的两个类：\n\
  \n*   `mp.Queue`：用于多个进程的 FIFO 队列，对其中放置的对象进行透明的序列化和反序列化\n\n\n\n\n\n*   `mp.Process`:\
  \ Ein als Kindprozess ausgeführter Codeabschnitt, der Methoden zur Steuerung vom\
  \ Elternprozess aus bietet.\n\nPyTorch stellt einen eigenen Wrapper für das `multiprocessing`-Modul\
  \ bereit, um die korrekte Behandlung von Tensoren und Variablen auf CUDA-Geräten\
  \ und für Shared Memory zu gewährleisten. Er bietet genau dieselbe Funktionalität\
  \ wie das `multiprocessing`-Modul der Standardbibliothek. Sie müssen also statt\
  \ `import multiprocessing` lediglich `import torch.multiprocessing` verwenden.\n\
  \n## 13.4 A3C mit Datenparallelität\n\nDie erste Version der A3C-Parallelisierung,\
  \ die wir testen (siehe Figure 13.2), besitzt einen Hauptprozess, der das Training\
  \ durchführt, sowie mehrere Kindprozesse, die mit den Umgebungen kommunizieren und\
  \ Erfahrungen für das Training sammeln.\n\n### 13.4.1 Implementierung\n\nAus Einfachheit\
  \ und Effizienz wird kein Broadcasting der Netzwerkgewichte durch den Trainingsprozess\
  \ verwendet. Anstatt die Gewichte explizit abzufragen oder an die Kindprozesse zu\
  \ versenden, wird das Netzwerk von allen Prozessen mithilfe der in PyTorch integrierten\
  \ Fähigkeiten gemeinsam genutzt. Sie ermöglichen es, dieselbe `nn.Module`-Instanz\
  \ samt allen Gewichten in verschiedenen Prozessen zu verwenden, indem wir beim Erstellen\
  \ des NN die `share_memory()`-Methode aufrufen. Diese Methode bedeutet keinen zusätzlichen\
  \ Aufwand für CUDA (der GPU-Speicher wird von allen Hostprozessen genutzt) oder\
  \ für Shared-Memory-IPC (Inter-Process Communication), im Fall einer CPU-Berechnung.\
  \ In beiden Fällen verbessert die Methode die Leistung, beschränkt unser Beispiel\
  \ jedoch beim Training und Datensammlung auf eine einzige Maschine und die Verwendung\
  \ nur einer GPU.\n\nDies stellt für unser Pong-Beispiel keine große Einschränkung\
  \ dar, aber wenn Sie bessere Skalbarkeit benötigen, sollte das Beispiel um explizite\
  \ gemeinsame Nutzung der Netzwerkgewichte ergänzt werden.\n\nEine weitere in diesem\
  \ Beispiel implementierte Verbesserung ist die Art und Weise, wie Trainingsbeispiele\
  \ von Kindprozessen an den Masterprozess übergeben werden. Man könnte sie als NumPy-Arrays\
  \ übergeben, das würde jedoch die Anzahl der Kopieroperationen erhöhen, was zu einem\
  \ Engpass werden könnte. Im Beispiel implementieren wir eine Vorbereitung der Daten.\
  \ Die Kindprozesse sind dafür verantwortlich, Mini-Batches der Daten zusammenzustellen,\
  \ sie auf die GPU zu kopieren und Tensoren in die Warteschlange einzurehen. Im Hauptprozess\
  \ verknüpfen wir diese Tensoren miteinander und führen das Training durch.\n\nDen\
  \ vollständigen Code finden Sie in der Datei `Chapter13/01_a3c_data.py`. Er verwendet\
  \ das Modul `Chapter13/lib/common.py` und bietet folgende Funktionalität:\n\n* \
  \  `class AtariA2C(nn.Module)`: Hier ist das Actor-Critic-NN-Modul implementiert.\n\
  *   `class RewardTracker`: Handles die undiskontierte Belohnung einer vollständigen\
  \ Episode, gibt sie über TensorBoard aus und prüft, ob das Spiel gelöst wurde.\n\
  *   `unpack_batch(batch, net, last_val_gamma)`: Diese Funktion konvertiert einen\
  \ Batch von Übergängen (Zustand, Belung, Aktion und letzten Zustand) von *n* Schritten\
  \ einer Episode in für das Training geeignete Daten.\n\nDer Code dieser Klassen\
  \ und Funktionen ist in früheren Kapiteln zu finden, deshalb wird er hier nicht\
  \ wiederholt. Sehen wir uns das Hauptmodul an, das die Funktion für Kindprozesse\
  \ und die Trainingsschleife enthält.\n\n```\n#!/usr/bin/env python3\nimport os\n\
  import gym\nimport ptan\nimport numpy as np\nimport argparse\nimport collections\n\
  from tensorboardX import SummaryWriter\n\nimport torch.nn.utils as nn_utils\nimport\
  \ torch.nn.functional as F\nimport torch.optim as optim\nimport torch.multiprocessing\
  \ as mp\n\nfrom lib import common\n```\n\nZunächst importieren wir die benötigten\
  \ Module. Hier gibt es nichts Neues, abgeshen davon, dass wir `torch.multiprocessing`\
  \ importieren.\n\n```\nGAMMA = 0.99\nLEARNING_RATE = 0.001\nENTROPY_BETA = 0.01\n\
  BATCH_SIZE = 128\n\nREWARD_STEPS = 4\nCLIP_GRAD = 0.1\n\nPROCESSES_COUNT = 4\nNUM_ENVS\
  \ = 8\nMICRO_BATCH_SIZE = 32\n\nENV_NAME = \"PongNokip-v4\"\nNAME = 'pong'\nREWARD_BOUND\
  \ = 18\n```\n\nEs gibt drei Hyperparameter:\n\n*   `PROCESSES_COUNT`: Legt die Anzahl\
  \ der Kindprozesse fest, die Daten sammeln. Diese Aufgabe wird hauptsächlich auf\
  \ der CPU ausgeführt, denn die rechenintensivste Operation ist die Vorarbeitung\
  \ der Atari-Frames, deshalb habe ich diesem Wert die Anzahl der Prozesserne zugewiesen.\n\
  *   `MICRO_BATCH_SIZE`: Legt die Anzahl der Trainingsbeispiele fest, jeder Kindprozess\
  \ erhält, bevor sie dem Hauptprozess übergeben werden.\n*   `NUM_ENVS`: Ist die\
  \ Anzahl der Umgebungen, die jeder Kindprozess verwendet. Das Produkt aus dieser\
  \ Zahl und der Anzahl der Prozesse ist die Gesamtzahl der Umgebungen, aus denen\
  \ wirdaten entnehmen.\n\n```python\ndef make_env():\n    return ptan.common.wrappers.wrap(ENV_NAME)\n\
  \nTotalReward = collections.namedtuple('TotalReward', 'reward')\n\ndef data_func(net,\
  \ device, queue):\n    envs = [make_env() for _ in range(NUM_ENVS)]\n    agent =\
  \ ptan.agent.PolicyAgent(lambda x: net(x)[0], device=device, softmax=True)\n   \
  \ exp_source = ptan.experience.ExperienceSourceFirst(envs, agent, gamma=GAMMA, steps_count=REWARD_STEPS)\n\
  \    micro_batch = []\n\n    for exp in exp_source:\n        new_rewards = exp_source.pop_total_rewards()\n\
  \        if new_rewards:\n            data = TotalReward(reward=np.mean(new_rewards))\n\
  \            queue.put(data)\n\n        micro_batch.append(exp)\n        if len(micro_batch)\
  \ < MICRO_BATCH_SIZE:\n            continue\n\n        data = common.unpack_batch(micro_batch,\
  \ net, device=device, last_val_gamma=GAMMA**REWARD_STEPS)\n        queue.put(data)\n\
  \        micro_batch.clear()\n```\n\nDie obige Funktion ist ganz einfach, aber etwas\
  \ Besonderes, weil sie im Kindprozess ausgeführt wird. (Wir verwenden die `mp.Process`-Klasse\
  \ um solche Prozesse im Hauptblock zu starten.) Wir übergeben drei Argumente: unser\
  \ Netz, das für Berechnungen zu verwendende Gerät (`cuda` oder `cpu`) als Text und\
  \ die Warteschange, die wir verwenden, um Daten vom Kindprozess an den Hauptprozess\
  \ zu übermitteln, der das Training ausführt.So viel zum Kindprozess. Betrachten\
  \ wir nun den Code für den Hauptprozess und die Trainingsschleife.\n\n\n\n\n\n```python\n\
  if __name__ == \"__main__\":\n    mp.set_start_method('spawn')\n    os.environ['OMP_NUM_THREADS']\
  \ = \"1\"\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--cuda\"\
  , default=False,\n                 action=\"store_true\", help=\"启用 CUDA\")\n  \
  \  parser.add_argument(\"-n\", \"--name\", required=True,\n                    \
  \             help=\"运行的名称\")\n    args = parser.parse_args()\n    device = \"cuda\"\
  \ if args.cuda else \"cpu\"\n    writer =\n        SummaryWriter(comment=f\"-a3c-data_pong_{args.name}\"\
  )\n```\n\n我们执行了常规步骤，并额外调用了一次 `mp.set_start_method`，以此通知 `multiprocessing` 模块我们想要使用的哪种并行类型。Python\
  \ 自带的 `multiprocessing` 库支持多种启动子进程的方法，但由于 PyTorch 在多进程处理方面的限制，如果想要使用 GPU，这里 `spawn`\
  \ 是唯一的选择。\n\n新增加的是赋值给 `OMP_NUM_THREADS` 的那行。这是一个环境变量，用于通知 OpenMP 库它允许启动多少线程。`Gym`\
  \ 和 `OpenCV` 库广泛使用了 OpenMP ([`www.openmp.org/`](https://www.openmp.org/)) 来加速在多核系统上的执行，这通常是一件好事。默认情况下，使用\
  \ OpenMP 的进程每个核心启动一个线程。但在在本情况下，这将适得其反，因为我们实现了自定义并行化。启动多个进程会导致线程通过频繁的上下文切换增加内核负担，会对性能产生负面影响。为了避免这种情况，我们显式地限制了\
  \ OpenMP 允许启动的线程数量。你可以对该参数进行实验。在我的系统上，如果去掉这一行，执行速度会减慢两到三倍。\n\n```python\nenv = make_env()\n\
  net = common.AtariA2C(env.observation_space.shape,\n                      env.action_space.n).to(device)\n\
  net.share_memory()\noptimizer = optim.Adam(net.parameters(),\n                 \
  \      lr=LEARNING_RATE, eps=1e-3)\n```\n\n随后，我们创建了神经网络，将其移动到 CUDA 设备上，并指示它与其他进程共享权重。CUDA\
  \ 张量默认是可以共享内存的，但在 CPU 模式下需要调用 `share_memory()`。\n\n```python\ntrain_queue = mp.Queue(maxsize=PROCESSES_COUNT)\n\
  data_proc_list = []\nfor _ in range(PROCESSES_COUNT):\n    data_proc = mp.Process(target=data_func,\n\
  \                           args=(net, device, train_queue))\n    data_proc.start()\n\
  \    data_proc_list.append(data_proc)\n```\n\n现在我们必须启动子进程，但在之前，我们创建一个用于传输数据的队列。队列构造函数的参数指定了它的容量。尝试向满的队列添加新对象将被阻塞。这对于确保我们的数据留存非常有用。在创建队列后，我们使用\
  \ `mp.Process` 类启动所需的数量的进程，并将它们存储在列表中以便能够正常关闭。在调用 `mp.Process.start()` 之后，我们的 `data_function`\
  \ 函数将由子进程执行。\n\n```python\nbatch_states = []\nbatch_actions = []\nbatch_vals_ref\
  \ = []\nstep_idx = 0\nbatch_size = 0\n\ntry:\n    with common.RewardTracker(writer,\
  \ REWARD_BOUND) as tracker:\n        with common.utils.TBMeanTracker(writer, 100)\
  \ as tb_tracker:\n            while True:\n                train_entry = train_queue.get()\n\
  \                if isinstance(train_entry, TotalReward):\n                    if\
  \ tracker.reward(train_entry.reward, step_idx):\n                        break\n\
  \                continue\n```\n\n在训练循环开始时，我们从队列获取下一个条目，并根据需要处理传递给 `RewardTracker`\
  \ 的 `TotalReward` 对象。\n\n```python\nstates_t, actions_t, vals_ref_t = train_entry\n\
  batch_states.append(states_t)\nbatch_actions.append(actions_t)\nbatch_vals_ref.append(vals_ref_t)\n\
  step_idx += states_t.size()[0]\nbatch_size += states_t.size()[0]\nif batch_size\
  \ < BATCH_SIZE:\n    continue\n\nstates_v = torch.cat(batch_states)\nactions_t =\
  \ torch.cat(batch_actions)\nvals_ref_v = torch.cat(batch_vals_ref)\nbatch_states.clear()\n\
  batch_actions.clear()\nbatch_vals_ref.clear()\nbatch_size = 0\n```\n\n由于队列只包含两种类型的对象（`TotalReward`\
  \ 和一个包含微批的元组），我们必须处理它们。在处理 `TotalReward` 对象后，一旦达到 `BATCH_SIZE`，我们将通过 TensorBoard\
  \ 收集这些数据。剩余的训练循环是计算 Actor-Critic 损失的。在最后一个章节中，我们计算策略损失、价值损失和熵损失之和。\n\n```python\n\
  log_probs = net(states_v).log_softmax(dim=-1)\naction_log = log_probs.gather(1,\
  \ actions_t.unsqueeze(1))\nloss = -(action_log * advantage).mean()\nvalue_loss =\
  \ F.mse_loss(vals_ref_v, target)\nentropy = -(probs * log_probs).sum(dim=-1).\n\
  loss = loss + 0.5 * value_loss + 0.01 * entropy\n```\n\n最后，我们将计算出的损失传递给 TensorBoard\
  \ 类，以监控它们。\n\n```python\nloss.backward()\nnn.utils.clip_grad_norm_(net.parameters(),\
  \ CLIP)\noptimizer.step()\noptimizer.zero_grad()\n```\n\n\n\n\n在收敛过程中，新版本的表现与具有多个环境的\
  \ `A2C` 方法相似，在观察 6 到 700 万次环境后就能解决 `Pong`。然而，这 700 万帧的处理时间在不到一小时内完成，而不是像上一章节的版本那样需要三小时。\n\
  \n![\\[图片\\]](Images/13_04.jpg)\n\n**图 13.4：** 数据并行版本的奖励（左侧）和总损失（右侧）\n\n![\\[图片\\\
  ]](Images/13_05.jpg)\n\n**图 13.5：** 训练期间的优势值（Advantage）\n\n## 13.5 梯度并行的 A3C\n\n\
  我们考虑的另一种 `A2C` 实现的并行化方法使用了多个子进程，但它们不是将训练数据输入到中央训练循环中，而是根据本地训练数据计算梯度，并将其传递给中央主进程。\n\
  \n该过程负责将梯度合并（本质上通过累加实现），并通过 `SGD` 更新共享网络。\n\n这种差异看起来可能微不足道，但这种方法的可扩展性要好得多，特别是当多台带有多个\
  \ GPU 的高性能计算机互连在一起时。在这种情况下，数据并行模型的中央进程会迅速成为瓶颈，因为损失计算和反向传播是计算密集型的。梯度并行允许将负载分布到多个\
  \ GPU 上，使得中央进程只需负责合并梯度的相对简单任务。\n\n### 13.5.1 实现\n\n完整的示例可以在 `Chapter13/02_a3c_grad.py`\
  \ 文件中找到。代码像上一个示例一样使用了 `Chapter13/lib/common.py` 模块。\n\n```\nGAMMA = 0.99\nLEARNING_RATE\
  \ = 0.001\nENTROPY_BETA = 0.01\n\nREWARD_STEPS = 4\nCLIP_GRAD = 0.1\n\nPROCESSES_COUNT\
  \ = 4\nNUM_ENVS = 8\n\nGRAD_BATCH = 64\nTRAIN_BATCH = 2\nENV_NAME = \"PongNoFrameskip-v4\"\
  \nREWARD_BOUND = 18\n```\n\n我们像往一样定义了超参数，它们大部分与上一个示例相同，但 `BATCH_SIZE` 被两个参数取代：`GRAD_BATCH`\
  \ 和 `TRAIN_BATCH`。`GRAD_BATCH` 的值决定了子进程计算损失和获取梯度时使用的 Batch 大小。第二个参数 `TRAIN_BATCH`\
  \ 指定了每次 `SGD` 迭代中合并子进程的多少个梯度 Batch。子进程创建的条目与我们的网络参数形状相同，我们累加了 `TRAIN_BATCH` 个值。因此，在每个优化步骤中，我们使用了\
  \ `TRAIN_BATCH * GRAD_BATCH` 个训练样本。由于损失计算和反向传播相当耗费资源，我们使用了较大的 `GRAD_BATCH` 值来提高效率。由于这个较大的\
  \ Batch，`TRAIN_BATCH` 应该保持较小，以保持更新是同策略（on-Policy）。\n\n```\ndef make_env():\n   \
  \ return ptan.common.wrappers.wrap_dqn(gym.make(ENV_NAME))\n\ndef grads_func(proc_name,\
  \ net, device, train_queue):\n    envs = [make_env() for _ in range(NUM_ENVS)]\n\
  \    agent = ptan.agent.PolicyAgent(lambda x: net(x))\n    # ... (省略部分代码逻辑)\n```\n\
  \n\n\n\n```\nif __name__ == \"__main__\":\n    mp.set_start_method('spawn')\n  \
  \  os.environ['OMP_NUM_THREADS'] = \"1\"\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument(\"--cuda\", default=False,\n                 action=\"\
  store_true\", help=\"激活 CUDA\")\n    parser.add_argument(\"-n\", \"--name\", required=True,\n\
  \                                      help=\"运行的名称\")\n    args = parser.parse_args()\n\
  \    device = \"cuda\" if args.cuda else \"cpu\"\n\n    env = make_env()\n    net\
  \ = common.AtariA2C(env.observation_space.shape,\n                          env.action_space.n).to(device)\n\
  \    net.share_memory()\n```\n\n在主进程开始时会创建网络。随后我们共享它的权重。正如上一个节所述，我们必须为 `torch.Multiprocesing`\
  \ 指定一种启动方法并限制 OpenMP 允许启动的线程数。\n\n```python\noptimizer = optim.Adam(net.parameters(),\
  \ lr=LEARNING_RATE,\n                                                    eps=1e-3)\n\
  train_queue = mp.Queue(maxsize=PROCESSES_COUNT)\ndata_proc_list = []\nfor proc_idx\
  \ in range(PROCESSES_COUNT):\n    proc_name = f\"-a3c-grad_pong_{args.name}#{proc_idx}\"\
  \n    p_args = (proc_name, net, device, train_queue)\n    data_proc = mp.Process(target=grads_func,\
  \ args=p_args)\n    data_proc.start()\n    data_proc_list.append(data_proc)\n```\n\
  \n然后我们创建通信队列并启动所需数量的子进程。\n\n```python\nbatch = []\nstep_idx = 0\ngrad_buffer = None\n\
  \ntry:\n    while True:\n        train_entry = train_queue.get()\n        if train_entry\
  \ is None:\n            break\n```\n\n与数据并行的 A3C 版本最大的区别在于训练循环，这里的循环要简单得多，因为复杂的计算由子进程完成。在循环开始时，我们必须考虑其中一个进程达到了所需的平均奖励并停止训练的情况。然后我们直接退出循环。\n\
  \n```python\nstep_idx += 1\n\nif grad_buffer is None:\n    grad_buffer = train_entry\n\
  else:\n    for tgt_grad, grad in zip(grad_buffer, train_entry):\n        tgt_grad\
  \ += grad\n```\n\n为了对不同子进程的梯度取平均值，我们对所有收到的 `TRAIN_BATCH`梯度调用优化器的 `step()` 函数。在中间步骤中，我们累加相应的梯度。\n\
  \n```python\nif step_idx % TRAIN_BATCH == 0:\n    for param, grad in zip(net.parameters(),\
  \ grad_buffer):\n        param.grad = torch.FloatTensor(grad).to(device)\n\n   \
  \ nn_utils.clip_grad_norm_(net.parameters(),CLIP_GRAD)\n    optimizer.step()\n \
  \   grad_buffer = None\n```\n\n当我们收集了足够的梯度后，将其将其转换为 PyTorch 的 `FloatTensor` 并赋值给网络参数的\
  \ `grad` 字段。之后，我们只需要调用优化器的 `step()` 方法，根据累积的梯度更新网络参数。\n\n```python\nfinally:\n \
  \   for p in data_proc_list:\n        p.terminate()\n        p.join()\n```\n\n在训练循环结束后，我们停止所有子进程，以确保即使在停止优化后它们也能关闭。这是为了防止残留进程占用\
  \ GPU 资源。\n\n### 13.5 结果\n\n此示例可以像之前一样启动。在短暂的延迟后，应该会输出速度和平均奖励。你必须明确，显示的信息对于每个子进程都是本地的，这意味着你必须将完成的游戏数和帧数乘以进程数。在我的测试中，每个子进程的速度大约为每秒\
  \ 450 到 500 帧，总计达到 1800 到 2200 FPS。\n\n```bash\nrl_book/samples/Chapter11$ ./02_a3c_grad.py\
