  \ Linear(in_features=2, out_features=64, bias=True)\n    (1): ReLU()\n    (2): Linear(in_features=64,\
  \ out_features=3, bias=True)\n  )\n  (critic): Sequential(\n    (0): Linear(in_features=2,\
