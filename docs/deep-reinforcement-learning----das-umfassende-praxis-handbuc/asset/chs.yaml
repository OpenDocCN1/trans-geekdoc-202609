  \ 871, 588, 2])]}\n```\n\n### Encoder\n\n`Encoder` 类通过 LSTM 层将 Token 转换为固定大小的向量。\n\
  \n```python\nclass Encoder(nn.Module):\n    def __init__(self, dict_size: int, emb_size:\
  \ int, out_size: int):\n        super(Encoder, self).__init__()\n\n        self.emb\
  \ = nn.Embedding(dict_size, emb_size)\n        self.net = nn.LSTM(emb_size, out_size,\
  \ batch_first=True)\n\n    def forward(self, x):\n        x = self.emb(x)\n    \
  \    _, hid_cell = self.net(x)\n        return hid_cell\n```\n\n### Preprocessor\n\
  \n`Preprocessor` 类结合多个 `Encoder` 实例来编码输入序列。\n\n```python\nclass Preprocessor(nn.Module):\n\
  \    def __init__(self, dict_size: int, emb_size: int, num_sequences: int, out_size:\
  \ int):\n        super(Preprocessor, self).__init__()\n\n        self.emb = nn.Embedding(dict_size,\
  \ emb_size)\n        self.encoders = []\n        for idx in range(num_sequences):\n\
  \            enc = Encoder(emb_size, out_size)\n            self.encoders.append(enc)\n\
  \            self.add_module(f\"enc_{idx}\", enc)\n        self.enc_commands = Encoder(emb_size,\
  \ out_size)\n\n    def _apply_encoder(self, batch: List[List[int]], encoder: Encoder):\n\
  \        dev = self.emb.weight.device\n        batch_t = [self.emb(torch.tensor(sample).to(dev))\n\
  \               for sample in batch]\n        batch_seq = rnn_utils.pack_sequence(\n\
  \            batch_t, enforce_sorted=False)\n        return encoder(batch_seq)\n\
  \n    def encode_sequences(self, batches):\n        data = []\n        for enc,\
  \ enc_batch in zip(self.encoders, zip(*batches)):\n            data.append(self._apply_encoder(enc_batch,\
  \ enc))\n        res_t = torch.cat(data, dim=1)\n        return res_t\n\n    def\
  \ encode_commands(self, batch):\n        return self._apply_encoder(batch, self.enc_commands)\n\
  ```\n\n\n\n\n现在我们来看看 `Preprocessor` 类是如何被使用的：\n\n```python\nIn [1]: from textworld.gym\
  \ import register_game\nIn [2]: import gym\nIn [3]: from lib import preproc\nIn\
  \ [4]: from textworld.envs.wrappers.filter import EnvInfos\nIn [5]: env_id = register_game(\"\
  games/simple1.ulx\", request_\ninfos=EnvInfos(inventory=True, intermediate_reward=True,\n\
  admissible_commands=True, description=True))\nIn [6]: env = gym.make(env_id)\nIn\
  \ [7]: env = preproc.TextWorldPreproc(env)\nIn [8]: prep = preproc.Preprocessor(\n\
  dict_size=env.observation_space.vocab_size, emb_size=10,\nnum_sequences=env.num_fields,\
  \ enc_output_size=20)\nIn [9]: prep\nOut[9]:\nPreprocessor(\n  (emb): Embedding(1250,\
  \ 10)\n  (enc_0): Encoder(\n    (net): LSTM(10, 20, batch_first=True)\n  )\n  (enc_1):\
  \ Encoder(\n    (net): LSTM(10, 20, batch_first=True)\n  )\n  (enc_commands): Encoder(\n\
  \    (net): LSTM(10, 20, batch_first=True)\n  )\n)\n```\n\n我们创建了一个 `Preprocessor`\
  \ 实例，它包含大小为 10 的嵌入，并将两个序列以及命令文本转换为大小为 20 的向量。为了使用它，我们必须将输入批传递给其中一个公共方法。\n\n```python\n\
  In [10]: obs = env.reset()\nIn [11]: prep.encode_sequences([obs['obs']])\nOut[11]:\
  \ torch.Size([1, 40])\nIn [12]: prep.encode_commands(\nobs['admissible_commands']).size()\n\
  Out[12]: torch.Size([12, 20])\n```\n\n输出的维度符合预期，因为带有两个序列的单个观测产生 `2 * 20 = 40` 个数字，而包含\
  \ 12 个命令的列表将编码为格式为 `(12, 20)` 的张量。\n\n### 15.3.3 DQN 模型和代理\n\n在完成所有准备工作后，DQN 模型的工作原理就很清晰了。它必须接收一个长度为\
  \ `num_sequences * encoder_size` 的向量并生成一个单一的标量值。然而，它与之前使用的 DQN 模型有一个不同，在于模型应用的方式。\n\
  \n```python\nclass DQNModel(nn.Module):\n    def __init__(self, obs_size: int, cmd_size:\
  \ int,\n                 hid_size: int = 256):\n        super(DQNModel, self).__init__()\n\
  \n        self.net = nn.Sequential(\n            nn.Linear(obs_size + cmd_size,\
  \ hid_size),\n            nn.ReLU(),\n            nn.Linear(hid_size, 1)\n     \
  \   )\n\n    def forward(self, obs, cmd):\n        x = torch.cat((obs, cmd), dim=1)\n\
  \        return self.net(x)\n\n    @torch.no_grad()\n    def q_values(self, obs_t,\
  \ commands_t):\n        result = []\n        for cmd_t in commands_t:\n        \
  \    qval = self(obs_t,\n                   cmd_t.unsqueeze(0))[0].cpu().item()\n\
  \            result.append(qval)\n        return result\n```\n\n`forward()` 方法接收两个批次（观测值和命令），并为每对生成\
  \ Q 值。另一个方法 `q_values()` 接收由 `Preprocessor` 类生成的观测值和命令张量，应用模型并返回每个命令 Q 值列表。\n\n\
  最后的类是 PTAN 代理，它将程序逻辑结合，并将观测（通过 `Preprocessor` 类）转换为动作列表。\n\n```python\nclass DQNAgent(ptan.BaseAgent):\n\
  \    def __init__(self, net: DQNModel,\n                 preprocessor: preproc.Preprocessor,\n\
  \                 epsilon: float = 0.0, device=\"cpu\"):\n        self.net = net\n\
  \        self._prepr = preprocessor\n        self._epsilon = epsilon\n        self.device\
  \ = device\n\n    @property\n    def epsilon(self):\n        return self._epsilon\n\
  \n    @epsilon.setter\n    def epsilon(self, value: float):\n        if 0.0 <= value\
  \ <= 1.0:\n            self._epsilon = value\n\n    @torch.no_grad()\n    def __call__(self,\
  \ states, agent_states=None):\n        if agent_states is None:\n            agent_states\
  \ = [None] * len(states)\n        # 为每个状态计算\n        actions = []\n        for state\
  \ in states:\n            commands = state['admissible_commands']\n            if\
  \ random.random() <= self.epsilon:\n                actions.append(random.randrange(len(commands)))\n\
  \            else:\n                obs_t = self._prepr.encode_sequences([state['obs']])\n\
  \                commands_t = self._prepr.encode_commands(commands)\n          \
  \      q_vals = self.net.q_values(obs_t, commands_t)\n                actions.append(np.argmax(q_vals))\n\
  \        return actions\n```\n\n### 15.3.4 代码\n\n`games/make_games.sh` 脚本默认生成 20\
  \ 个命名为 `simple1.ulx` 到 `simple20.ulx` 的游戏，以及一个名为 `simple-val.ulx` 的验证游戏。\n\n###\
  \ 15.3.5 训练结果\n\n首先，我们使用一个游戏和 `small` 超参数集来训练代理：\n\n```bash\n$ ./train_basic.py\
  \ -s 1 --cuda -r t1\n```\n\n\n\n\n选项 `-s` 指定了用于训练的游戏索引数量。在这种情况下，仅使用一个索引。当游戏中的平均步数低于值\
  \ 10 时，训练将停止，这意味着智能体找到了正确的步骤序列，并能够高效地到达游戏结束。\n\n如果只使用一个游戏，解决它只需要半小时，并且大约需要 300 个回合（Episodes）来完成任务。接下来的图表显示了训练过程中奖励的变化和步数的变化。\n\
