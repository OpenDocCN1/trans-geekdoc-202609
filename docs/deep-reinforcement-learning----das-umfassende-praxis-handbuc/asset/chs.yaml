  \          max(len(seq_batch[0]), 1)), dtype=np.int64)\nfor idx, seq in enumerate(seq_batch):\n\
  \    seq_arr[idx, :len(seq)] = seq\n    # 为空序列分配一个 #UNK-Token\n    if len(seq) ==\
  \ 0:\n        lens[idx] = 1\n```\n\n为了能够创建打包序列类，我们必须先创建一个包含`填充序列`的 Tensor。这是一个具有\
  \ `batch_size` 行的矩阵，其列数等于长序列的长度（`batch_size`, `len_of_longest_seq`）。我们将序列的 ID 拷贝到此矩阵中。\n\
  \n```python\nseq_v = torch.LongTensor(seq_arr).to(self.device)\nseq_p = rnn_utils.pack_padded_sequence(seq_v,\
  \ lens,\n                                       batch_first=True)\nreturn img_v,\
  \ seq_p\n```\n\n最后一步是根据 NumPy 矩阵创建 Tensor，并使用 PyTorch 辅助函数将其转换为打包格式。转换提供了两个对象：一个包含图像的\
  \ Tensor 和一个作为 Token 列表的文本打包序列。\n\n```python\ndef tokens_to_idx(self, tokens):\n\
  \    res = []\n    for token in tokens:\n        idx = self.token_to_id.get(token)\n\
  \        if idx is None:\n            if self.next_id == self.max_dict_size:\n \
  \               self.log.warning(\"字典达到最大限制，\n                     Token '%s'\n\
  \                     转换为 #UNK-Token\", token)\n                idx = 0\n      \
  \      else:\n                idx = self.next_id\n                self.next_id +=\
  \ 1\n                self.token_to_id[token] = idx\n        res.append(idx)\n  \
  \  return res\n```\n\n上述辅助函数必须将 Token 列表转换为 ID 列表。其难点在于，源自描述文本的字典大小是预先未知的。一种可能的方法是将单个字符输入\
  \ RNN，但这会导致产生过长而无法处理的序列。另一种解决方案是硬编码一个合理的字典大小（例如 100 个 Token），并为未知 Token 动态分配 Token\
  \ ID。在本次实现中，采用了后一种方法，但如果 MiniWoB 任务的描述文本中包含随机生成的字符串，该方法可能不再适用。\n\n```python\ndef\
  \ save(self, file_name):\n    with open(file_name, 'wb') as fd:\n        pickle.dump(self.token_to_id,\
  \ fd)\n        pickle.dump(self.max_dict_size, fd)\n        pickle.dump(self.next_id,\
  \ fd)\n\n@classmethod\ndef load(cls, file_name):\n    with open(file_name, \"rb\"\
  ) as fd:\n        token_to_id = pickle.load(fd)\n        max_dict_size = pickle.load(fd)\n\
  \        next_id = pickle.load(fd)\n\n        res = MultimodalPreprocessor(max_dict_size)\n\
  \        res.token_to_id = token_to_id\n        res.next_id = next_id\n        return\
  \ res\n```\n\n\n\n\n\n即使使用演示数据，没有描述文本的模型也只能获得 0.5 的平均奖励，这与随机点击对话框中的任何按钮几乎没有好坏。\n\
