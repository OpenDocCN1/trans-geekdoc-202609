  \ 12 到 15 次旋转的骰子，但在更复杂的任务中持续失败。可能通过更多的处理器核心和并行 MCTS 方法进一步改进结果。搜索过程被限制在 10 分钟内，并为每个旋转次数生成了五个随机状态。\n\
  \n![\\[图像\\]](Images/24_18.jpg)\n\n**图 24.11：** 两种方法求解的 3x3 骰子比例\n\n![\\[图像\\]](Images/24_19.jpg)\n\
  \n**图 24.12：** 3x3 骰子两种方法的求解步数对比\n\n\n\n\n\n图 24.12 显示了找到的最优解的长度。这里有两个值得关注的问题。例如，通过零目标法（Zero-Goal-Verfahren）找到的\
  \ 10 到 15 次旋转魔方的解，其长度比旋转次数大 10 到 15 倍。这意味着该模型无法找到生成测试题时所使用的旋转序列，但至少发现了一条通往目标状态的长路径序列。此外还可以观察到，本文描述的方法在处理旋转了\
  \ 12 到 18 次的魔方时，找到了比旋转时所用序列更短的解。这可能归因于退化的测试序列。\n\n### 24.9.3 进一步的改进与实验\n\n有很多可以尝试的方法：\n\
  \n*   增加输入并改进网络：魔魔方是一个复杂的物体，因此简单的前馈网络可能不是最佳模型。网络可能可能从卷积（Faltungen）中获益。\n*   震荡和不稳定：如果在一个步长内存在相关性，这可能是典型的\
  \ RL 问题信号。常见的解决方案是使用目标网络，它使用旧版本的网络来获取值（“引导/Bootstrapping”）。\n*   优先回放缓冲区（Replay\
  \ Buffer）可以提高训练速度。\n*   我的实验表明，样本的权重（与旋转次数成反比）可以导致更好的策略，该策略能够识别如何解决仅轻微旋转的魔方，但这可能会减慢对具有多次旋转状态的学习。可能可以调整权重，使其在训练的后期阶段表现得不那么激进。\n\
  *   可以给训练添加一个熵损失（Entropieverlust），以对策略进行正则化。\n*   2x2 魔方模型没有利用没有中心块的特性，因此可以旋转整个魔方。这在\
  \ 2x2 魔方上并不重要，因为状态空间很小，但对于 4x4 魔方来说这一点非常重要。\n*   为了获得更好的训练和 MCTS 参数，还需要进一步的实验。\n\
  \n## 24.10 总结\n\n在本章中，我描述了 RL 方法在离散优化任务中的应用，并使用了众为人知的魔方，它仍然是一项具有挑战性的任务。在书的最后一章节中，我们将讨论\
  \ RL 中的多智能体任务。\n\n# 第 25 章：多智能体 RL\n\n在上一章中，我们讨论了离散优化任务。在最后这一章中，我们将考虑强化学习中一个较新的研究方向，即多个智能体在环境中相互通信（多智能体环境）。\n\
  \n本章主题：\n\n*   经典单智能体任务与多智能体任务的共同点与差异概述\n*   由英中研究小组 Geek.AI 作为开源项目发布的多智能体环境 `MAgent`\n\
  *   使用 `MAgent` 环境在具有多组智能体的不同环境中训练模型\n\n## 25.1 多个智能体\n\n使用多个智能体是对我们在第 1 章中考虑过的熟悉的\
  \ RL 模型的自然扩展。通常情况下，有一个智能体与环境通信（通过观察、奖励、动作）。但在实践中经常遇到的某些任务中，有多个智能体参与到与环境交互交互。这里是一些具体的例子：\n\
  \n*   一局国际象棋，我们的程序试图击败对手\n*   市场模拟，例如产品广告或价格变化，其中我们的行动可能会导致其他市场参与者采取反制措施\n*   多参与者游戏，如\
  \ Dota 2 或星际争霸 II，智能体在与其他玩家竞争时必须同时控制多个事物。\n\n如果存在不受我们控制的其它智能体，我们可以将其视为环境的一部分，并保持使用单个智能体的普通\
  \ RL 模型。但在某些情况下，这种限制太大了，不是我们想要的结果。正如您从第 23 章 (`AlphaGo Zero`) 中知到的，自对弈是一种非常强大的方法，可以产生良好的策略，而无需环境方面付出巨大努力。\n\
  \n此外，最近的研究结果表明，一组简单的智能体可以以一种比预期复杂得的方式进行协作。一个例子是 OpenAI 博客文章 [`openai.com/blog/emergent-tool-use/`](https://openai.com/blog/emergent-tool-use/)\
  \ 以及捕获位于围栏后方的跳床板的智能体。\n\n### 25.1.1 通信形式\n\n智能体通信的方式可以分为两类：\n\n*   竞争：两个或多个智能体试图相互斗争以最大化自己的奖励。\n\
  *   协作：一组智能体必须共同努力以实现一个目标。\n\n有很多例子属于这些类别之一，但最有趣的情况通常是这两种行为的混合。对此也有许多例子，例如可以与其他玩家结盟的棋类游戏，直到假设百分百协作的现代企业。\n\
  \n游戏论的框架为两种形式奠定了基础。为了简单起见，我不会深入探讨，因为这是一个全面的研究领域，有一套自己的术语。如果你对此感兴趣：有很多相关的书籍和在线课程。这里仅举一个例子：您在第\
  \ 23 章 中已经熟悉的 Minimax 算法是游戏论的一个著名结果。\n\n### 25.1.2 RL 方法\n\n多智能体 RL（有时缩写为 `MARL`）是一个非常年轻的研究方向，尽管研究活动已经增加，保持关注应该是很有趣的。DeepMind\
  \ 和 OpenAI 对多玩家策略游戏（星际争霸 II 和 Dota 2）的兴趣是向这一方向迈出的明显一步。\n\n\n\n\n在本章中，我们将简要介绍 MARL（多智能体强化学习），并在简单的环境中进行一些实验。不过，如果你感兴趣，自然可以进行自己的实验。在我们的实验中，采用了一种简单直接的方法：智能体使用一个共同的策略（Policy），并对其进行优化。观测是从智能体的视角进行的，并包含了关于其他智能体位置的信息。通过这种简化，我们的\
  \ RL 算法保持不变，只需要对环境进行预处理并考虑多个智能体的存在。\n\n## 25.2 MAgent 环境\n\n在考虑第一个 MARL 示例之前，我将描述用于实验所使用的环境。\n\
  \n### 25.2.1 安装\n\n如果你想对 MARL 进行实验，选择其实相当有限。属于 Gym 的环境仅支持单个智能体。虽然 Atari 游戏 Pong\
  \ 有一些补丁可以激活双人模式，但它们并不是标准配置，反而是特例。\n\nDeepMind 与同暴雪公司一起公开了《星际争霸 II》（`https://github.com/deepmind/pysc2`）。该游戏是一个非常有趣且具有挑战性的实验环境。然而，对于刚开始接触\
  \ MARL 的人来说，这个游戏太复杂了。我发现 Geek.AI 的 MAgent 环境（`https://github.com/geek-ai/MAgent`）非常适合：它简单、快速且依赖极少，但仍然允许进行多个智能体的模拟实验。虽然其\
  \ API 与 Gym 不兼容，但我们实现了了自己的 API。\n\n本章中的示例都假设已安装了 MAgent（位于 `Chapter25/MAgent` 目录）。目前还没有相应的\
  \ Python 包，因此安装需要执行以下步骤：\n\n*   在 `Chapter25` 目录下执行命令 `git clone` `https://github.com/geek-ai/MAgent.git`。\n\
  *   在 `Chapter25/MAgent` 目录下输入 `bash build.sh` 来生成 MAgent。（在此之前，你可能需要安装 `https://github.com/geek-ai/MAgent`\
  \ 中提到的依赖项。）\n\n### 25.2.2 概述\n\nMAgent 的通用概念简单高效。它提供了一个“网格世界（Grid World）”的模拟，其中由二维智能体填充。你可以感知周围的观测结果（受其感知能力限制），从当前位置移动并攻击附近的其他智能体。\n\
  \n可能存在多组具有不同属性和交互参数的智能体。例如，我们将考虑的第一个模型是捕食者-猎物模型，其中老虎捕猎鹿并获得奖励。在环境配置中，可以设置种组的许多属性，例如感知能力、移动能力、攻击距离、一组智能体的初始健康状态、健康在移动和攻击下的消耗程度等。除了智能体外，环境还可以包含对智能体不可逾越的墙。\n\
  \nMAgent 具有良好的可扩展性，因为它内部使用 C++ 编写，但提供了 Python 接口。这意味着环境可以实现包含数千个智能体的种组，提供观测结果并执行动作。\n\
  \n### 25.2.3 一个随机环境\n\n为了演示 MAgent 的 API 和逻辑，我实现了一个带有老虎和鹿智能体的简单环境。两组智能体都由随机策略控制。\n\
  \n你可以在 `Chapter25/forest_random.py` 文件中找到该示例。它非常短，在这里完整列出。\n\n```python\nimport\
  \ os\nimport sys\nfrom magent.builtin import GridWorld\nfrom magent.config import\
  \ Config\nfrom magent.models import RandomActor\n\nsys.path.append(os.path.abspath(\"\
  ../Chapter25/MAgent\"))\n\nMAP_SIZE = 64\nenv = GridWorld(size=(MAP_SIZE, MAP_SIZE))\n\
  deer_handle, tiger_handle = env.get_handles()\n\nmodels = [\n    RandomActor(env,\
  \ deer_handle),\n    RandomActor(env, tiger_handle),\n]\n\nif __name__ == \"__main__\"\
  :\n    env.reset()\n    env.add_walls(method=\"random\", n=MAP_SIZE * MAP_SIZE *\
  \ 0.04)\n    env.add_agents(deer_handle, method=\"random\", n=5)\n    env.add_agents(tiger_handle,\
  \ method=\"random\", n=2)\n    env.set_dir(\"render\")\n\n    v = env.get_view_space(tiger_handle)\n\
  \    r = env.get_feature_space(tiger_handle)\n    print(\"Gesichtsfeld Tiger: %s,\
  \ Merkmale: %s\" % (v, r))\n\n    vv = env.get_view_space(deer_handle)\n    rr =\
  \ env.get_feature_space(deer_handle)\n    print(\"Gesichtsfeld Hirsch: %s, Merkmale:\
  \ %s\" % (vv, rr))\n```\n\n\n\n这意味着老虎将获得一个包含五个信息层的 9x9 矩阵。鹿的视野很短，因此它们只能获得一个 3x3\
  \ 矩阵。在观测时，智能体始终位于中心，因此显示的是智能体周围的网格部分。这五个信息层包含以下内容：\n\n*   墙：如果单元是墙则为 `1`，否则为 `0`\n\
  *   `组 1（智能体属于该组）：`如果单元被智能体所在组的成员占据则为 `1`，否则为 `0`\n*   `组 1 健康状态`：智能体在该单元格中的相对健康值\n\
  *   `组 2 敌对智能体`：如果单元被敌对智能体占据则为 `1`\n*   `组 2 健康状况`：敌人的相对健康值，如果单元为空则为 `0`\n\n如果定义了更多组，观测张量将包含额外的信息层。此外，`MAgent`\
  \ 提供了一个默认禁用的“微型地图”，显示所有组智能体的位置。`组 1` 和 `组 2` 的数据对应相应的智能体。在第二层信息中，鹿获得有关其他鹿的信息，而老虎则获得有关其他老虎的信息。这使得根据需要为两组群体训练单一策略成为可能。\n\
  \n观测的另一个部分是所谓的特征空间。然而，它不是空间性的，而是一个数值向量，包含了智能体 ID 的独热编码、上一次动作、奖励以及归一化后的位置。具体细节请参阅\
  \ MAgent 源代码，它们在此处并不起作用。\n\n我们继续描述代码。\n\n```\ndone = False\nstep_idx = 0\nwhile\
  \ not done:\n    deer_obs = env.get_observation(deer_handle)\n    tiger_obs = env.get_observation(tiger_handle)\n\
  \    if step_idx == 0:\n        print(\"Tiger obs: %s, %s\" % (tiger_obs[0].shape,\
  \ tiger_obs[1].shape))\n        print(\"Hirsche obs: %s, %s\" % (deer_obs[0].shape,\
  \ deer_obs[1].shape))\n    print(\"%d: Hirsche: %s\" % (step_idx, deer_obs[0][:,\
  \ 1, 2]))\n    print(\"%d: GP Tiger: %s\" % (step_idx, tiger_obs[0][:, 4, 4]))\n\
  ```\n\n我们开始循环，在其中获取观测值 (`obs`)。代码输出如下：\n\n```\nTiger obs: (2, 9, 5), (2, 20)\nHirsche\
  \ obs: (5, 3, 5), (5, 16)\n0: GP Hirsche: [1. 1. 1. 1. 1.]\n0: GP Tiger: [1. 1.]\n\
  ```\n\n由于有两只老虎和五只鹿，调用 `env.get_observation()` 返回对应格式的 NumPy 数组。与环境的通信因此变得高效，因为可以一次性获取整个组的观测。组的健康点\
  \ (`GP`) 取自包含智能体信息的第二层。输出向量显示了组的健康状况。\n\n```\ndeer_act = models[0].infer_action(deer_obs)\n\
  tiger_act = models[1].infer_action(tiger_obs)\nenv.set_action(deer_handle, deer_act)\n\
  env.set_action(tiger_handle, tiger_act)\n```\n\n在接几行中，模型被指示根据观测值选择动作（随机选择）并将其传递给环境。动作以整个组数值向量的形式表示。通过这种方式，我们可以控制大量的智能体。\n\
  \n```\nenv.render()\ndone = env.step()\nenv.clear_dead()\nt_reward = env.get_reward(tiger_handle)\n\
  d_reward = env.get_reward(deer_handle)\nprint(\"Belohnungen: Hirsche %s, Tiger %s\"\
  \ % (d_reward, t_reward))\nstep_idx += 1\n```\n\n在循环的剩余部分，我们执行不同的任务。首先，我们指示环境存储有关智能体及其位置的信息。然后，我们调用\
  \ `env.step()` 执行模拟中的一个时间步。该函数返回一个布尔标志，当所有智能体都“死亡”时，该标志变为 `True`。然后我们获取组的奖励向量，显示它并继续循环。\n\
  \n启动程序后，输出如下：\n\n```\nGesichtsfeld Tiger: (9, 9, 5), Merkmale: (20,)\nGesichtsfeld\
  \ Hirsche: (3, 3, 5), Merkmale: (16,)\nTiger obs: (2, 9, 5), (2, 20)\nHirsche obs:\
  \ (5, 3, 5), (5, 16)\n0: GP Hirsche: [1. 1. 1. 1. 1.]\n0: GP Tiger: [1. 1.]\nBelohnungen:\
  \ Hirsche [0. 0. 0. 0. 0.], Tiger [1. 1.]\n1: GP Hirsche: [1. 1. 1. 1. 1.]\n1: GP\
  \ Tiger: [0.95 0.95]\nBelohnungen: Hirsche [0. 0. 0. 0. 0.], Tiger [1. 1.]\n2: GP\
  \ Hirsche: [1. 1. 1. 1. 1.]\n2: GP Tiger: [0.9 0.9]\n...\n19: GP Hirsche: [1. 1.\
  \ 1. 1. 1.]\n19: GP Tiger: [0.05 0.05]\nBelohnungen: Hirsche [0. 0. 0. 0. 0.], Tiger\
  \ [1. 1.]\n20: GP Hirsche: [1. 1. 1. 1. 1.]\n20: GP Tiger: [0. 0.]\nBelohnungen:\
  \ Hirsche [0. 0. 0. 0. 0.], Tiger []\n```\n\n正如您所看到的，老虎的健康状况每个时间步都会恶化，在仅 20 步后，所有老虎都饿死了。\n\
  \n\n\n\n```python\nclass MAgentEnv(VectorEnv):\n    def __init__(self, env: magent.GridWorld,\
  \ handle,\n                reset_env_func: Callable[[], None],\n               \
  \ is_slave: bool = False,\n                steps_limit: Optional[int] = None):\n\
  \        reset_env_func()\n        action_space = self.handle_action_space(env,\
  \ handle)\n        observation_space = self.handle_obs_space(env,handle)\n\n   \
  \     count = env.get_num(handle)\n\n        super(MAgentEnv, self).__init__(count,\n\
  \              observation_space, action_space)\n        self.action_space = self.single_action_space\n\
  \        self._env = env\n        self._handle = handle\n        self._reset_env_func\
  \ = reset_env_func\n```\n\nDie Klasse erbt von `gym.vector.vector_env.VectorEnv`-Klasse,\
  \ die zwei Modi von vektorisierten Umgebungen unterstützt, nämlich synchron und\
  \ asynynchron. Unsere Kommunikation ist synchron, wir müssen bei der Implementierung\
  \ aber darauf achten, dass die Unterklassenbildung ordnungsgemäß erfolgt. Der Konstruktor\
  \ nimmt drei Argumente entgegen: die Instanz der MAgent-Umgebung, das Handle der\
  \ Gruppe, die wir kontrollieren wollen, und die Funktion `reset_env_func`, mit der\
  \ die MAgent-Umgebung in den Anfangszustand zurückgesetzt werden soll (das Gitternetz\
  \ löschen, Mauern errichten und Agenten platzieren). Für das Erstellen von Aktionen\
  \ und der Beschreibung des Beobachtungsraums werden Hilfsfunktionen verwendet.\n\
  \n```python\n@classmethod\ndef handle_action_space(cls, env: magent.GridWorld,\n\
  \                        handle) -> gym.Space:\n    return spaces.Discrete(env.get_action_space(handle)[0])\n\
  ```\n\nWir setzen voraus, dass der Aktionsraum eine diskrete Menge von Aktionen\
  \ ist, sodass wir die Größe mithilfe der Umgebung in Erfahrung bringen können.\n\
  \n```python\n@classmethod\ndef handle_obs_space(cls, env: magent.GridWorld,\n  \
  \                   handle) -> gym.Space:\n    v = env.get_view_space(handle)\n\
  \    r = env.get_feature_space(handle)\n    view_shape = (v[-1],) + v[:2]\n    view_space\
  \ = spaces.Box(low=0.0, high=1.0,\n                            shape=view_shape)\n\
  \    extra_space = spaces.Box(low=0.0, high=1.0, shape=r)\n    return spaces.Tuple((view_space,\
  \ extra_space))\n```\n\nDer Beobachtungsraum ist etwas komplizierter. Es gibt zwei\
  \ Bestandteile: den räumlichen, den wir mit Faltungsnetzen vorverarbeiten, und einen\
  \ Merkmalsvektor. Räumliche Merkmale müssen umgeordnet werden, damit sie der PyTorch-Konvention\
  \ (Kanal, Breite, Höhe) entsprechen. Dann erzeugen wir zwei `spaces.Box`-Instanzen\
  \ und kombinieren sie miteinander mithilfe von `spaces.Tuple`.\n\n```python\n@classmethod\n\
  def handle_observations(cls, env: magent.GridWorld,\n                        handle)\
  \ -> List[Tuple[np.ndarray,\n                                              np.ndarray]]:\n\
  \    view_obs, feats_obs = env.get_observation(handle)\n    entries = view_obs.shape[0]\n\
  \    if entries == 0:\n        return []\n    view_obs = np.array(view_obs)\n  \
  \  feats_obs = np.array(feats_obs)\n    view_obs = np.moveaxis(view_obs, 3, 1)\n\
  \n    res = []\n    for o_view, o_feats in zip(np.vsplit(view_obs, entries),\n \
  \                             np.vsplit(feats_obs, entries)):\n        res.append((o_view[0],\
  \ o_feats[0]))\n    return res\n```\n\nDiese Klassenmethode ist dafür verantwortlich,\
  \ anhand des aktuellen Zustands der Umgebung Beobachtungen zu erzeugen. Sie fragt\
  \ die Beobachtungen ab, kopiert beide Komponenten in NumPy-Arrays, ändert die Achsen,\
  \ unterteilt die beiden Beobachtungen nach der ersten Dimension und konvertiert\
  \ sie in eine Liste von Tupeln. Die Tupel in der zurückgebenen Liste enthalten Beobachtungen\
  \ aller aktiven Agenten. Diese Beobachtungen werden dem Replay Buffer hinzugefügt\
  \ und für das Training verwendet, deshalb wir sie aufteilen.\n\n```python\ndef reset_wait(self):\n\
  \    self._steps_done = 0\n    if not self._is_slave:\n        self._reset_env_func()\n\
  \    return self.handle_observations(self._env, self._handle)\n```\n\nDer verbleibende\
  \ Teil der Klasse verwendet die definierten Hilfsmethoden. Zum Zursetzen der Umgebung\
  \ rufen wir die `reset()`-Funktion auf und erstellen die Liste der Beobachtungen.\n\
  \n```python\ndef step_async(self, actions):\n    act = np.array(actions, dtype=np.int32)\n\
  \    self._env.set_action(self._handle, act)\n```\n\nDie `step()`Methode besteht\
  \ aus zwei Teilen: einem asynchronen, der die Aktionen für die MAgent-Umgebung bereitstellt,\
  \ und einem synchronen, der den eigentlichen Aufruf von `step()` ausführt und die\
  \ Informationen sammelt, die wir von der `step()`Methode in der Gym-Umgebung benötigen.\n\
  \n```python\ndef step_wait(self):\n    self._steps_done += 1\n    if not self._is_slave:\n\
  \        done = self._env.step()\n        if self._steps_limit is not None and self._steps_done\
  \ >= self._steps_limit:\n            done = True\n        else:\n            done\
  \ = False\n\n    obs = self.handle_observations(self._env, self._handle)\n    return\
  \ obs, {}, {}, done\n```\n\n\n\n\n程序 `Chapter25/forest_tigers_play.py` 可以读取存储的策略并录制老虎的动作。该程序加载模型，运行一个回合并将录制保存到\
  \ `Chapter25/render` 目录。录制的文本文件可以像之前描述的那样在浏览器中进行视觉化。由于书中无法显示动画，这里提供了训练不同阶段老虎策略的视频链接。\n\
  \n*   得分 23：[`www.youtube.com/watch?v=NJPAGCGVeDM`](https://www.youtube.com/watch?v=NJPAGCGVeDM)。老虎的移动几乎是随机的；只有一只老虎离鹿足够近，可以吃掉它并因此活得更久。\n\
  \n*   得分 39：[`www.youtube.com/watch?v=kkNrnIQ3j3U`](https://www.youtube.com/watch?v=kkNrnIQ3j3U)。老虎显然总是向左移动并吃掉它们能找到的所有东西。这种方式让老虎获得了更高的奖励并活得更久，但策略尚未达到最优。\n\
  \n*   得分 67：[`www.youtube.com/watch?v=W0aJ9mu1MwA`](https://www.youtube.com/watch?v=W0aJ9mu1MwA)。这是我能获得的最佳策略。老虎积极尝试吃掉鹿。最后的幸存者甚至从速度较慢的同类那里偷走了食物（视频五秒后）。\n\
  \n## 25.4 老虎的协作\n\n我实现的第二个实验旨在增加老虎处境的复杂性并促进协作。训练代码与播放代码一致；唯一的区别在于 MAgent 环境的配置。我使用了\
  \ MAgent 的 `double_attack` 配置文件 ([`github.com/geek-ai/MAgent/blob/master/python/magent/builtin/config/double_attack.py`](https://github.com/geek-ai/MAgent/blob/master/python/magent/builtin/config/double_attack.py))\
  \ 并对其进行了调整，使得老虎和鹿在每一步都能获得 0.1 的奖励。以下代码是 `Chapter25/lib/data.py` 文件中修改后的函数 `config_double_atack()`：\n\
  \n```python\ndef config_double_attack(map_size):\n    gw = magent.gridworld\n  \
  \  cfg = gw.Config()\n    cfg.set({\"map_width\": map_size, \"map_height\": map_size})\n\
  \    cfg.set({\"embedding_size\": 10})\n```\n\n我们创建配置对象并分配地图维度。Embedding 大小对应微地图的维度，在该配置下该未被激活。\n\
  \n```python\ndeer = cfg.register_agent_type(\"deer\", {\n    'width': 1, 'length':\
  \ 1, 'hp': 5, 'speed': 1,\n    'view_range': gw.CircleRange(1),\n    'attack_range':\
  \ gw.CircleRange(0),\n    'step_recover': 0.2,\n    'kill_supply': 8,\n    'step_reward':\
  \ 0.1,\n})\n```\n\n随后，我们注册鹿的代理组。它们只有少量血量（health points, `hp`）和较小的视野（`view_range`）。它们不能攻击，但随着时间能够恢复。我添加了\
  \ `step_reward` 参数来存储鹿动作的奖励。\n\n```python\ntiger = cfg.register_agent_type(\"tiger\"\
  , {\n    'width': 1, 'length': 1, 'hp': 10, 'speed': 1,\n    'view_range': gw.CircleRange(4),\n\
  \    'attack_range': gw.CircleRange(1),\n    'damage': 1, 'step_recover': -0.2,\n\
  \    'step_reward': 0.1,\n})\n```\n\n现在我们来看第二组，即老虎。它们获得更高的奖励，拥有更大的视野并且可以攻击，但每一步都会损失血量，因此它们需要食物。\n\
  \n```python\ndeer_group = cfg.add_group(deer)\ntiger_group = cfg.add_group(tiger)\n\
  a = gw.AgentSymbol(tiger_group, index='any')\nb = gw.AgentSymbol(tiger_group, index='any')\n\
  c = gw.AgentSymbol(deer_group, index='any')\n# 当老虎同时攻击一只\n# 鹿时，老虎获得奖励\ne1 = gw.Event(a,\
  \ 'attack', c)\ne2 = gw.Event(b, 'attack', c)\ncfg.add_reward_rule(e1 & e2, receiver=[a,\
  \ b], value=[1, 1])\nreturn cfg\n```\n\n接下来，我们创建了一条规则，规定两只老虎同时攻击一只鹿时，它们将获得奖励。在这里我们使用\
  \ `e1 & e2` 来定义同时条件。为了激活此模式，我们使用参数启动程序：\n\n```bash\n./forest_tigers_dqn.py --mode\
  \ double_attack\n```\n\n\n\n\n在下一个示例中，老虎和鹿由不同的 DQN 模型控制，这些模型同时进行训练。老虎通过捕食鹿来获得更长寿命的奖励，因为它们在模拟的每一步都会损失健康值。而鹿在每个时间步都会获得一个奖励。\n\
  \n你可以在 `Chapter25/forest_both_dqn.py` 文件中找到代码。它是上一个示例的一个相当简单的扩展。对于这两个智能体组，有两个 `Agent`\
  \ 类的不同实例与环境进行通信。由于这两个组的观测结果不同，我们使用了独立的网络、回放池（Replay Buffer）和经验源。在每个训练步骤中，我们从两个回放池中提取批次（batches），并独立地训练这两个网络。\n\
  \n我在这里不再列出代码，因为它与上一个示例相比只有细微的差别。如果你感兴趣，可以在 GitHub 上查看这些示例。图 25.9 到图 25.11 中的图表展示了结果。\n\
