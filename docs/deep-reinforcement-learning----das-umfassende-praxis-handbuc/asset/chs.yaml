  \n![\\[图像\\]](Images/21_16.jpg)\n\n**图 21.14:** 测试奖励的趋势\n\n### 21.4.5 带有噪声网络的 PPO\
  \ 方法\n\n我们可以将使用噪声网络进行探索的方法不仅应用于 DQN 方法，也将其应用于 PPO 方法。为此，我们必须将 Actor 的输出层替换为 `NoisyLinear`\
  \ 层。这里只影响 Actor，因为我们只想给策略添加噪声，而不是影响估计值。新的 PPO 网络如下：\n\n```\nMountainCarNoisyPPO(\n\
  \  (actor): Sequential(\n    (0): Linear(in_features=2, out_features=128, bias=True)\n\
  \    (1): ReLU()\n    (2): NoisyLinear(in_features=128, out_features=3,\n      \
  \               bias=True)\n  )\n  (critic): Sequential(\n    (0): Linear(in_features=2,\
  \ out_features=128, bias=True)\n    (1): ReLU()\n    (2): Linear(in_features=128,\
  \ out_features=1, bias=True)\n  )\n)\n```\n\n使用带有以采样的噪声网络时存在细微差别。当我们在第 8 章首次讨论噪声网络时，`NoisyLinear`\
  \ 层的每次 `forward()` 运行都会捕捉噪声。根据最初的研究，Off-Policy 方法是有问题的，但在 On-Policy 方法中可以通过其他方式处理。在\
  \ On-Policy 训练中，我们从当前策略生成训练样本，并计算引导策略改进的梯度。噪声网络试图确保随机性，但正如提到的，`NoisyLinear` 层中的随机组件不应每次\
  \ `forward()` 都更新，而应该更少地更新。在我的代码中，我在每个 PPO Batch（对应 2048 步）更新噪声。启动训练时使用之前相同的程序，但必须传递参数\
  \ `-p` `noisynet`。在我的实验中，解决环境花费了大约小时。\n\n```\nEpisode 29788: reward=-174, steps=174,\
  \ speed=3817.1 f/s, elapsed=0:54:14\nEpisode 29789: reward=-166, steps=166, speed=3793.8\
  \ f/s, elapsed=0:54:14\nEpisode 29790: reward=-116, steps=116, speed=3771.2 f/s,\
