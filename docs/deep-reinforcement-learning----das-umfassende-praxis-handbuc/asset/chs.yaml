  \n**图 1.6：** 带有转移概率的状态转移图\n\n在实践中，我们很少能幸运的确切知道转移矩阵。更现实的情况是，我们只有系统状态的观测，这些也被称为 `剧集\
  \ episodes*‌`：\n\n*   家里 → 咖啡 → 咖啡 → 聊天 → 咖啡 → 电脑 → 家里\n*   电脑 → 电脑 → 聊天 → 聊天 →\
  \ 咖啡 → 电脑 → 电脑 → 电脑\n\n\n\n\n参数 `gamma` 在强化学习（RL）中具有重要意义，我们将在后续章节中反复遇到它。你可以将 `gamma`\
  \ 想象成衡量我们对未来预判多远程度，用于估计未来回报（Return）的指标。该值越接近 1，我们考虑的未来时间步就越多。\n\n在实践中，`Return` 被证明并不特别有用，因为它是针对每一个观测到的马尔可夫奖励过程（MRP）的单条链定义的，因此即使对于同一个状态，它也可能剧烈波动。然而，如果我们计算所有状态的回报的数学期望值（通过对许多链取平均值），我们就能得到一个有用得多的值，即**状态值**（State\
  \ Value）：\n\n![图片]](Images/01_12.jpg)\n\n其解释非常简单：值 `V(s)` 表示当我们在执行马尔可夫奖励过程时，状态 `s`\
  \ 的平均（预期）回报。\n\n为了演示这些理论思考在实践中是如何运作的，我们为 Dilbert 过程增加了奖励，并使其成为一个 `Dilbert 奖励过程`（`DBP`）。这些奖励具有以下值：\n\
  \n* 家 → 家：1（因为待在家里很美好）\n* 家 → 咖啡：1\n* 电脑 → 电脑：5（努力工作是的）\n* 电脑 → 聊天：-3（分心不是好的）\n\
  * 聊天 → 电脑：2\n* 电脑 → 咖啡：1\n* 咖啡 → 电脑：3\n* 咖啡 → 咖啡：1\n* 咖啡 → 聊天：2\n* 聊天 → 咖啡：1\n*\
  \ 聊天 → 聊天：-1（长时间聊天会很无聊）\n\n图 1.7 显示了一个带有奖励的图表。\n\n![图片]](Images/01_07.jpg)\n\n**图\
  \ 1.7：** 带有概率（深色）和奖励（浅色）的状态转移图\n\n回到参数 `gamma`，考虑不同 `gamma` 值下的状态值，首先看一个简单的情况：`gamma\
  \ = 1`。在这里是如何计算状态值的？\n\n为了回答这个问题，我们考虑状态 `Chat`（聊天）。下一个转移可能是什么？答案是：*取决于随机性*。根据 Dilbert\
  \ 过程的转移矩阵，下一个状态再次是 `Chat` 的概率为 50%。`Kaffee`（咖啡）的概率为 20%， 30% 的情况下下一个状态是 `Computer`（电脑）。当\
  \ `gamma = 0` 时，我们获得的回报仅为下一个状态的值。因此，如果我们想计算 `Chat` 的状态值，必须将所有转移的值与其概率相乘并求和：\n\n\
  * `V(Chat) = -1 * 0,5 + 2 * 0,3 + 1 * 0,2 = 0,3`\n* `V(Kaffee) = 2 * 0,7 + 1 * 0,1\
  \ + 3 * 0,2 = 2,1`\n* `V(Zuhause) = 1 * 0,6 + 1 * 0,4 = 1,0`\n* `V(Computer) = 5\
  \ * 0,5 + (-3) * 0,1 + 1 * 0,2 + 2 * 0,2 = 2,8`\n\n因此，`Computer` 是值最高的状态（我们只考虑了紧随的奖励），这并不意外，因为\
  \ `Computer → Computer` 经常发生，且奖励很高，而转移到其他状态的概率不高。\n\n现在来了一个棘手的问题：当 `gamma = 1` 时，状态值有多大？请仔细思考。\n\
  \n答案是：所有状态的值都是无穷大的。我们的图中不包含汇（没有出口转移的状态），且当折减因子等于 1 时，我们考虑了无限数量的未来转移。正如我们在 `gamma\
  \ = 0` 情况中看到的，所有的短期值都是正的，无限正值之和无论初始状态如何都会得到一个无穷大的值。\n\n这种无限的结果就是为什么在马尔可夫奖励过程中引入\
  \ `gamma` 而不是仅仅累加所有未来奖励。在大多数情况下，可能会存在无限（或至少很多）次转移。由于处理无限的值非常不实际，我们希望限制转移的数量。小于 1\
  \ 的 `gamma` 值允许这种限制。我将在后面的章节中详细介绍这一点。不过，如果你处理的是有限环境，例如限制在最多 9 步的跳井字游戏，你可以轻松使用 `gamma\
  \ = 1`。另一个例子是一类只有一步的环境，被称为 `多臂老虎机`（Multi-Armed Bandit）。在这种环境中，每一步都必须在备选动作之间做出选择。\n\
  \n\n\nStellen Sie sich folgende vor, um einen Eindruck davon zu bekommen, warum\
  \ die Sache so kompliziert ist: Ein kleiner Roboter lebt auf einem 3 × 3 Felder\
  \ großen Gitter und kann die Aktionen `links drehen`, `rechts drehen` und `vorwärts\
  \ bewegen` ausführen. Der Zustand dieser Welt wird durch die Position des Roboters\
  \ und durch seine Blickrichtung (oben, unten, links, rechts) festgelegt. Es gibt\
  \ also 3 × 3 × 4 = 36 Zustände (der Roboter darf sich auf allendern aufhalten und\
  \ in alle Richtungen blicken).\n\n![Bild](img/01_09.jpg)\n\n**Abb. 1.9:** MDP der\
  \ Übergangswahrscheinlichkeiten\n\nNehmen Sie ferner an, dass die Motoren des Roboters\
  \ nicht ganz in Ordnung sind (das ist in der Realität tatsächlich häufig der Fall).\
  \ Wenn er eine der Aktionen `links 转向` oder `rechts drehen` ausführt, funktioniert\
  \ das in 90 Prozent der Fälle, aber mit einer Wahrscheinlichkeit von 10 Prozent\
  \ drehen die Räder durch und die Position des Roboters ändert sich nicht. Bei der\
  \ Aktion `vorwärts bewegen` verhält es sich nicht anders: In 90 Prozent der Fälle\
  \ funktioniert es, aber in 10 Prozent der Fälle verharrt der Roboter an seiner ursprünglichen\
  \ Position.\n\nIn Abbildung 1.10 ist ein kleiner Teil eines Übergangsdiagramms dargestellt,\
  \ der die möglichen Übergänge vom Zustand (*1, 1, oben*) zeigt. Der Roboter befindet\
  \ sich also in der Mitte des Git und blickt nach oben. Wenn er versucht, sich vorwärts\
  \ zu bewegen, beträgt die Wahrscheinlichkeit 90 Prozent, dass er sich anschließend\
  \ im Zustand (*0, 1, oben*) befindet, aber mit einer Wahrscheinlichkeit von 10 Prozent\
  \ drehen die Räder durch und er verbleibt an Position (*1,* *1, oben*).\n\nDamit\
  \ all diese Details über die Umgebung und mögliche Reaktionen auf die Aktionen des\
  \ Agenten richtig erfasst werden, verwendet ein MDP im Allgemeinen eine dreidimensionale\
  \ Übergangsmatrix mit den Dimensionen (*Quellzustand, Aktion, Zielzustand*).\n\n\
  ![Bild](img/01_10.jpg)\n\n**Abb. 1.10:** Die Umgebung in der »Grid World«\n\nUm\
  \ aus unserem MBP einen MDP zu machen, müssen wir unserer Belohnungsmatrix auf die\
  \ gleiche Weise wie bei der Übergangsmatrix Aktionen hinzufügen: Unsere Belohnungsmatrix\
  \ hängt nicht nur vom Zustand ab, sondern auch von der Aktion. Mit anderen Worten:\
  \ Die Belohnung, die der Agent erhält, hängt jetzt nicht mehr nur vom Endzustand\
  \ ab, sondern auch von der Aktion, die zu diesem Zustand führt.\n\nEs ist damit\
  \ vergleichbar, dass man an Wissen und Erfahrung gewinnt, wenn man Mühe in eine\
  \ bestimmte Sache investiert, selbst wenn man nicht allzu erfolgreich ist. Die Reward\
  \ könnte also besser ausfallen, wenn Sie etwas unternehmen, anstatt untätig zu bleiben,\
  \ selbst wenn das Ergebnis dasselbe ist.\n\nNun liegt ein formal definierter MDP\
  \ vor und wir sind bereit, die für RL und MDP wichtigste Sache einzuführen: die\
  \ `Policy`.\n\n### 1.6.5 Policy\n\nDie intuitive Definition einer Policy ist, dass\
  \ es sich um eine Menge von Regeln handelt, die das Verhalten des Agenten steuern.\
  \ Selbst in ziemlich einfachen Umgebungen kann es eine Vielzahl von Policies geben.\
  \ Im letzten Beispiel mit dem Roboter in der »Grid World« könnte es beispielsweise\
  \ verschiedene Policies für den Agenten geben, die zu unterschiedlichen Mengen der\
  \ besuchten Zustände führen. Der Roboter könnte etwa folgende Aktionen ausführen:\n\
  \n*   Sich unter allen Umständen blindlings vorwärts bewegen\n*   Hindernisse umgehen,\
  \ indem geprüft wird, ob die vorherige Aktion `vorwärts bewegen` gescheitert ist\n\
  *   Sich um die eigene Achse drehen, um den Programmierer zu unterhalten\n*   Zufällig\
  \ eine Aktion auswählen, um ein »betrunkener Roboter in der Grid World»-Scenario\
  \ zu modellieren und so weiter ...\n\nWie Sie wissen, ist es das Hauptziel des Agenten\
  \ beim RL, einen möglichst großen Return zu erzielen (der als diskontierte Summe\
  \ der Rewards definiert wurde). Verschiedene Policies führen also zu unterschiedlichen\
  \ Returns, deshalb ist es wichtig, sinnvolle zu finden. Aus diesem Grund sind Policies\
  \ von so großer Bedeutung und stehen im Mittelpunkt unseres Interesses.\n\nFormal\
  \ ist eine Policy als die Wahrscheinlichkeitsverteilung der Aktionen für alle möglichen\
  \ Zustände definiert:\n\n![Bild](img/01_13.jpg)\n\nSie ist als Wahrscheinlichkeit\
  \ definiert, nicht als konkrete Aktion, um dem Verhalten eines Agenten eine Zufallskomponente\
  \ hinzuzufügen. Ich komme später dazu, welches dies wichtig und nützlich ist. Schließlich\
  \ ist die deterministische Policy ein Sonderfall, bei dem die Wahrscheinlichkeit\
  \ für eine erforderliche Aktion 1 entsprechen muss.\n\nWenn die Policy `festgelegt`\
  \ ist und sich nicht ändert, wird aus unserem MDP ein MBP, weil wir die Übergangs-\
  \ und Belohnungsmatrizen durch die Verwendung der Policy-Wahrscheinlichkeiten vereinfachen\
  \ und auf die Aktions-Dimension verzichten können.\n\nHerzlichen Glückwunsch, dass\
