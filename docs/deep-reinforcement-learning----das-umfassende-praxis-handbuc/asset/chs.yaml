  \ 方法：损失 0.014547\n\n我的实验（使用 `solver.py` 程序）显示，损失较低的模型在解决随机旋转的骰子时，随着旋转次数的增加，其成功率更高。图\
  \ 24.8 显示了结果。\n\n下一个参数是求解所需的 MCTS 步数。Zero-Goal 方法通常需要的步骤更少。换句话说，学习到的策略更好。\n\n![\\\
