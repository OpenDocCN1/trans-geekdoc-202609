  \n为了增加网络的容量，我们需要另一个超参数集，该集合设置了更高维的嵌入（128 而不是 20）和更长的编码器向量（256 个元素而不是 20 个）。Replay\
  \ Buffer 也更大，`epsilon` 值的减少也需要更长时间。要使用此超参数集，必须指定命令行选项 `--params` `medium`。此选项定义了\
  \ `lib/common.py` 文件中字典的条目，以便你为实验添加自己的超参数集。\n\n为了比较增大模型容量的影响，我创建了在 25 个游戏训练时，针对超参数集\
  \ `small` 和 `medium` 的图表（如 图 15.8 所示）。\n\n![\\[Bild\\]](Images/15_08.jpg)\n\n**图\
  \ 15.8：** 不同超参数以及 25 个游戏训练时的奖励和步数\n\n在这里可以看出，大网络解决游戏的速度比小网络快近一倍。然而，接下来的验证图显示了相反的结果。小网络获得了比大网络更好的验证评分，这并不意外，因为大网络由于容量更大，具有更强的对训练回合过拟合（Overfitting）的倾向。\n\
  \n小网络必须找到其所有已知状态的高效表示，这对于未知的游戏更有用。\n\n从中我们可以在实践中学习到以下几点：如果你有机会利用环境中的所有已知区域进行训练，那么你可以考虑增大网络，使其学得更快。但如果可能出现新事物或异常情况，那么长时间训练一个较小的网络可能更安全，从而最终获得一个更健壮的网络。这当然不是解决强化学习（RL）泛化和处理未知数据这一难题的通用方案，但应该了解这种方法。\n\
