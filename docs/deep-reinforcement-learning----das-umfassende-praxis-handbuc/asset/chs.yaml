  Episode 29792: reward=-144, steps=144, speed=3727.0 f/s, elapsed=0:54:14\nTest done:\
  \ got -86.000 reward after 86 steps, avg reward -129.0\n```\n\n你可以从图 21.15 到图 21.17\
  \ 的图表中查看训练趋势。\n\n![\\[图像\\]](Images/21_17.jpg)\n\n**图 21.15:** 奖励和步数\n\n![\\[图像\\\
