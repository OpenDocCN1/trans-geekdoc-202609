  \ Q 值来移动它。\n\n![\\[Bild\\]](Images/15_11.jpg)\n\n**图 15.11：** 200 个游戏的验证结果\n\n##\
  \ 15.4 命令生成器模型\n\n在本节中，我们将简单模型扩展了一个用于生成 DQN 应该执行的命令的子模块。这些命令从来自环境信息的命令列表中提取。但也许我们可以使用上一章节相同的方法来生成命令。\n\
  \n图 15.12 显示了模型的架构。\n\n![\\[Bild\\]](Images/15_12.jpg)\n\n**图 15.12：** 带有命令生成器的\
  \ DQN\n\n与 图 15.3 相比，有一些变化。首先，预处理管道不再接收命令序列作为输入。第二个区别是预处理的输出不仅传递给 DQN，还通过了`命令生成器`子模块。\n\
  \n\n\n该模型与第 14 章中的示例非常相似。使用命令生成器的第一步是输入一个由隐藏 LSTM 层的编码器生成的观测向量。输入是一个标记序列开始的特殊标记（token）。LSTM\
  \ 的输出通过一个前馈网络进行转换，该网络生成标记词表（vocabulary）的概率分布。为了获得实际的标记，我们从该分布中提取它，并将其作为输入传递给后续的处理步骤。某些输出标记会被特殊处理。例如，标记序列结束的标记被用于分离命令。从本质上说，这是一个经典的语言模型，它从左到右应用于这些游戏指令。\n\
  \n该示例的训练分两个步骤进行：\n\n1.  首先，我们使用环境提供的合法命令对语言模型进行预训练和预处理。目标函数使用命令生成器生成的列表与实际合法命令列表之间的经典交叉熵损失（cross-entropy\
  \ loss）。如果在这一步达到了我们能够生成可以执行游戏的命令的程度，我们就进入下一步。\n2.  第二步也是最后一步，冻结预处理层和命令生成器的网络权重，并训练编码器（Encoder）以及深度\
  \ Q 网络（DQN）。\n\n这不是唯一的方法。我甚至不确定这是否最佳做法。为了简单起见，我选择了这种——你当然可以进行实验并尝试自己的想法。\n\n由于代码复杂且详尽，我将在下一节中仅展示实现的重要部分。完整的代码可以在\
  \ `Chapter15/train_lm.py` 文件以及它所依赖的模块中找到。\n\n### 15.4.1 实现\n\n首先轮到命令生成器，因为它是示例中最复杂的部分。你可以在\
  \ `lib/model.py` 文件的 `CommandModel` 类中找到代码。\n\n```python\nclass CommandModel(nn.Module):\n\
  \    def __init__(self, obs_size: int, dict_size: int,\n                 embeddings:\
  \ nn.Embedding, max_tokens: int,\n                 max_commands: int, start_token:\
  \ int,\n                 sep_token: int):\n        super(CommandModel, self).__init__()\n\
  \n        self.emb = embeddings\n        self.max_tokens = max_tokens\n        self.max_commands\
  \ = max_commands\n        self.start_token = start_token\n        self.sep_token\
  \ = sep_token\n\n        self.rnn = nn.LSTM(\n            input_size=embeddings.embedding_dim,\n\
  \            hidden_size=obs_size, batch_first=True)\n        self.out = nn.Linear(in_features=obs_size,\n\
  \                             out_features=dict_size)\n```\n\n构造函数接收许多参数。你定义了观测输入向量的维度、标记数量、嵌入（embedding）以及起始标记和分隔标记的标记\
  \ ID。参数 `max_tokens` 和 `max_commands` 限制了命令生成器的命令数量。这种限制是必要的，因为否则 `CommandModel`\
  \ 可能会产生非常长且毫无意义的命令。由于命令通常很短，我们可以进行此设置。在构造函数中，我们创建了 LSTM 和输出形成层。\n\n```python\ndef\
  \ forward(self, input_seq, obs_t):\n    hid_t = obs_t.unsqueeze(0)\n    output,\
  \ _ = self.rnn(input_seq, (hid_t, hid_t))\n    return self.out(output)\n```\n\n\
  `forward()` 方法虽然简单，但 `commands()` 方法却复杂且冗长。在 `forward()` 方法中，我们应用 LSTM 并观测向量传递给隐藏状态（hidden\
  \ state）。LSTM 层使用两个张量来描述 `hidden state` 和 `cell state`（单元状态）。为了简单起见，我直接将观测值作为输入，这并不是最优的。也许使用零张量作为\
  \ `cell state` 效果更好。\n\n现在我们来看类的最后一个方法，它为观测批次（batch）生成命令。这个方法非常复杂，因为我们逐个标记地生成命令，并且必须留意何时满足序列结束的条件。\n\
  \n```python\ndef commands(self, obs_batch):\n    batch_size = obs_batch.size(0)\n\
  \    commands = [[] for _ in range(batch_size)]\n    cur_commands = [[] for _ in\
  \ range(batch_size)]\n\n    inp_t = torch.full((batch_size, ), self.start_token,\n\
  \                       dtype=torch.long)\n    inp_t = inp_t.to(obs_batch.device)\n\
  \    inp_t = self.emb(inp_t)\n    # 添加时间维度 (dim=1, 作为 batch_first)\n    inp_t =\
  \ inp_t.unsqueeze(1)\n    # 隐藏状态插入第一维\n    p_hid_t = obs_batch.unsqueeze(0)\n  \
  \  hid = (p_hid_t, p_hid_t)\n```\n\n首先我们为完成的命令创建一个列表，并为正在生成的命令创建一个列表。随后创建一个张量 `inp_t`，它在第一步包含相同的标记，即起始标记。LSTM\
  \ 的隐藏状态根据提供的观测值创建。\n\n```python\nwhile True:\n    out, hid = self.rnn(inp_t, hid)\n\
  \    out = out.squeeze(1)\n    out_t = self.out(out)\n\n    cat = t_distr.Categorical(logits=out_t)\n\
  \    tokens = cat.sample()\n```\n\n在每次循环中，将 LSTM 应用于标记。输出是包含批次中所有标记的 `LongTensor`。\n\
  \n```python\n    for idx, token in enumerate(tokens):\n        token = token.item()\n\
  \        cur_commands[idx].append(token)\n        if token == self.sep_token or\n\
  \                len(cur_commands[idx]) >= self.max_tokens:\n            if cur_commands[idx]:\n\
  \                l = len(commands[idx])\n                if l < self.max_commands:\n\
  \                    commands[idx].append(cur_commands[idx])\n                cur_commands[idx]\
  \ = []\n            if token != self.sep_token:\n                tokens[idx] = self.sep_token\n\
  \n    if min(map(len, commands)) == self.max_commands:\n        break\n    # 将标记转换为输入张量\n\
  \    inp_t = self.emb(tokens)\n    inp_t = inp_t.unsqueeze(1)\nreturn commands\n\
  ```\n\n\n\n下一个新类是 `Agent`（代理），它使用命令生成器将观测转换为动作。在章节开始，你已经看到 `TextWorldPreproc` 类在很大程度上负责将由自由格式文本提供的动作空间转换为允许命令列表的索引。在此处，命令并不是从允许的列表中选择的，而是被生成的，因此在\
  \ `TextWorldPreproc` 构造函数中通过 `use_admissible_commands=False` 选项禁用了动作空间的转换。此外，该类还被扩展，以识别生成的命令在环境中何时是无意义的（识别生成的命令在环境中何时是无效的）。在这种情况下，我们会给智能体一个很小的负奖励。（请注意\
  \ `TextWorldPreproc` 中的 `reward_wrong_last_command` 选项是如何使用的。）\n\n接下来的类 `CmdAgent`\
  \ 在预训练阶段（Pretraining-Phase）中使用。它负责通过预处理流水线生成一个观测向量以及命令列表，并返回一个在环境中随机选择的命令。\n\n```python\n\
  class CmdAgent(pt.agent.BaseAgent):\n    def __init__(self, env, cmd: CommandModel,\n\
  \                 preprocessor: Preprocessor,\n                 device = \"cpu\"\
  ):\n        self.env = env\n        self.cmd = cmd\n        self.prepr = preprocessor\n\
  \        self.device = device\n\n    @torch.no_grad()\n    def __call__(self, states,\
  \ agent_states=None):\n        if agent_states is None:\n            agent_states\
  \ = [None] * len(states)\n\n        actions = []\n        for state in states:\n\
  \            obs_t = self.prepr.encode_sequences(\n                [state['obs']]).to(self.device)\n\
  \            commands = self.cmd.commands(obs_t)[0]\n            cmd = random.choice(commands)\n\
  \            tokens = [\n                self.env.action_space.id2w[t]\n       \
  \         for t in cmd\n                if t not in {self.cmd.sep_token,\n     \
  \                        self.cmd.start_token}\n            ]\n            action\
  \ = \" \".join(tokens)\n            actions.append(action)\n        return actions,\
  \ agent_states\n```\n\n代码并不复杂，因此我不会进行详细解释。预训练阶段的最后部分是损失的计算。这由 `lib/model.py` 文件中的\
  \ `pretrain_loss` 函数负责。\n\n```python\ndef pretrain_loss(cmd: CommandModel, commands:\
  \ List,\n                  observations_t: torch.Tensor):\n    commands_batch =\
  \ []\n    target_batch = []\n    min_length = None\n\n    for cmds in commands:\n\
  \        inp = [cmd.start_token]\n        for c in cmds:\n            inp.extend(c[1:])\n\
  \        commands_batch.append(inp[:-1])\n        target_batch.append(inp[1:])\n\
  \        if min_length is None or len(inp) < min_length:\n            min_length\
  \ = len(inp)\n\n    commands_batch = [c[:min_length-1]\n                      for\
  \ c in commands_batch]\n    target_batch = [c[:min_length-1]\n                 \
  \   for c in target_batch]\n```\n\n在函数的第一部分，Batch 中作为命令列表的对象被序列化，即转换为单个序列，我们的命令生成器需要学习这种序列。由于每个命令都包含开始和停止标记，我们可以从目标序列和输入序列中去掉它们。然后我们使用最短序列来还原\
  \ Batch。\n\n```python\ncommands_t = torch.tensor(commands_batch, dtype=torch.long)\n\
  commands_t = commands_t.to(observations_t.device)\ntarget_t = torch.tensor(target_batch,\
  \ dtype=torch.long)\ntarget_t = target_t.to(observations_t.device)\ninput_t = cmd.emb(commands_t)\n\
  logits_t = cmd(input_t, observations_t)\nlogits_t = logits_t.view(-1, logits_t.size()[-1])\n\
  target_t = target_t.view(-1)\nreturn F.cross_entropy(logits_t, target_t)\n```\n\n\
  在完成准备步骤后，我们将序列转换为张量，应用嵌入（embeddings），并使用命令生成器将结果转换为 logits。然后应用交叉熵损失，以便命令生成器向所需序列的方向进行调整。\n\
  \n### 15.4.2 预训练结果\n\n对于 `train_lm.py` 程序，默认以“命令生成”模式启动预训练。一旦达到 `-0.5` 的平均奖励，就会过渡到\
  \ DQN 训练。在训练期间，初始奖励为 `-5`，因为环境中有 50 步。对于每个未被环境理解的不当命令，智能体将获得 `-0.1` 的奖励。因此，`-0.5`\
  \ 的平均奖励意味着命令生成器工作足够良好，可以生成有效的命令，尽管这些命令并不一定能产生正奖励。\n\n\n\n\n```python\n@torch.no_grad()\n\
  def unpack_batch_dqncmd(batch, prep: preproc.Preprocessor,\n                   \
  \     cmd: CommandModel,\n                        cmd_encoder: preproc.Encoder,\n\
  \                        net: DQNModel, env: gym.Env):\n    observations, taken_actions,\
  \ rewards = [], [], []\n    not_done_indices, next_observations = [], []\n\n   \
  \ for idx, exp in enumerate(batch):\n        observations.append(exp.state['obs'])\n\
  \        taken_actions.append(\n            env.action_space.tokenize(exp.action))\n\
  \        rewards.append(exp.reward)\n        if exp.last_state is not None:\n  \
  \          not_done_indices.append(idx)\n            next_observations.append(exp.last_state['obs'])\n\
  \n    observations_t = prep.encode_sequences(observations)\n    next_q_vals = [0.0]\
  \ * len(batch)\n    if next_observations:\n        next_observations_t = \\\n  \
  \          prep.encode_sequences(next_observations)\n        next_commands = cmd.commands(next_observations_t)\n\
  \n        for idx, next_obs_t, next_cmds in \\\n                zip(not_done_indices,\n\
  \                    next_observations_t,\n                    next_commands):\n\
  \            next_embs_t = prep._apply_encoder(\n                next_cmds, cmd_encoder)\n\
  \            q_vals = net.q_values_cmd(\n                next_obs_t, next_embs_t)\n\
  \            next_q_vals[idx] = max(q_vals)\n    return observations_t, taken_actions,\n\
  \           rewards, next_q_vals\n```\n\n`unpack_batch_dqncmd` Funktion ist dafür\
  \ verantwortlich, den Beobachtungstensor, die Liste der auszuführenden tokenisierten\
  \ Befehle, die unmittelbare Belohnung und (das komplizierteste) die besten Q-Werte\
  \ für den Folgezustand des Zustandsüangs vorzubereiten. Um die besten Q-Werte zu\
  \ erhalten, erzeugen wir Befehle für den Folgezustand, evaluieren sie mithilfe des\
  \ DQN und wählen den maximalen Q-Wert aus.\n\n```python\ndef calc_loss_dqncmd(batch,\
  \ preprocessor, cmd,\n                     cmd_encoder, tgt_cmd_encoder,\n     \
  \                net, tgt_net, gamma, env, device=\"cpu\"):\n    obs_t, commands,\
  \ rewards, next_best_qs =\n        unpack_batch_dqncmd(batch, preprocessor, cmd,\n\
  \        tgt_cmd_encoder, tgt_net, env)\n    cmds_t = preprocessor._apply_encoder(\n\
  \        commands, cmd_encoder)\n    q_values_t = net(obs_t, cmds_t)\n    tgt_q_t\
  \ = torch.tensor(rewards) +\n              gamma * torch.tensor(next_best_qs)\n\
  \    tgt_q_t = tgt_q_t.to(device)\n    return F.mse_loss(q_values_t.squeeze(-1),\
  \ tgt_q_t)\n```\n\nZur Berechnung des Verlusts entpacken wir den Batch, wenden den\
  \ Encoder auf die ausgeführten Befehle an und berechnen den mittleren quadratischen\
  \ Fehler von vom Netz erzeugten Werten und mit der Bellman-Gleichung approximierten-Werten.\
  \ Hier gibt es eigentlich Neues, man sollte jedoch bei den Gradienten achtsam sein.\
  \ So könnte es beispielsweise verlockend sein, in der Funktion `unpack_batch_dqncmd`\
  \ den Encoder anzuwenden, das wäre jedoch verkehrt, weil dadurch Gradienten blockiert\
  \ werden, und das ist nicht, was wir wollen.\n\n### 15.4 Ergebnis des DQN-Training\n\
  \nNachdem beim Pretraining eine durchschnittliche Belohnung von `-0.5` erreicht\
  \ wird (oder Sie nicht länger warten und in der Konsole C drücken), geht das System\
  \ zum DQN-Training über. Vorher speichert es die Gewichte des Befehlsgenerators\
  \ und der Vorverarbeitung, damit sie später durch `save` mit der Kommandozeilenoption\
  \ `--load` eingelesen werden.\n\nAbbildung 15.17 und Abbildung 15.18 zeigen die\
  \ Ergebnisse meiner Experimente mit Modellen verschiedener Größe.\n\n![Bild](img/15_17.jpg)\n\
  **Abb. 15.17:** Belohnung und Verlust beim DQN-Training mit einem Spiel und dem\
  \ Hyperparameter-satz `small`\n\n![Bild](img/15_18.jpg)\n**Abb. 15.18:** Belohnung\
  \ und Verlust beim DQN-Training mit einem Spiel und dem Hyperparameter-satz `medium`\n\
  \nDie Diagramme zeigen die gleichen Ergebnisse wie zuvor: Die Lernkapazität des\
  \ größeren Netzes ist höher (es benötigte nur 30 Minuten, um eine durchschnittliche\
  \ Belohnung von `3.5` zu erreichen). Die Geschwindigkeit des DQN liegt bei etwa\
  \ 12 Beobachtungen. Das Diagramm in Abbildung 19 zeigt die Belohnung bei Validierung.\n\
  \n![Bild](img/15_19.jpg)\n**Abb. 15.19:** Belohnung bei Validierung\n\n### 15.5\
  \ Zusammenfassung\n\nNachdem beim Pretraining eine durchschnittliche Belohnung von\
  \ `-0.5` erreicht wird (oder Sie nicht länger warten und in der Konsole C drücken),\
  \ geht das System zum DQN-Training über. Vorher speichert es die Gewichte des Befehlsgenerators\
  \ und der Vorverarbeitung, damit sie später durch `save` mit der Kommandozeilenoption\
  \ `--load` eingelesen werden.\n\nIn diesem Kapitel haben Sie erfahren, wie sich\
  \ DQN auf komplexe Aufgaben an lässt, ein interessantes Feld, das NLP verknüpft.\
  \ Im nächsten Kapitel fahren wir mit der Erkundung von Reinforcement Learning fort\
  \ und untersuchen die Anwendbarkeit bei Browserautomatisierung.\n\n# Kapitel 16\
  \ Navigation im Web\n\nDieses Kapitel wirft einen Blick auf Reinforcement Learning\
  \ (RL): Navigation im Web. Die Themen in diesem Kapitel:\n\n* Navigation im Web\
  \ und Browserautomatisierung\n* Wie unser Programm die Navigation im Web erlernen\
  \ kann\n* Ein interessanter, wenleich oft übersehener Benchmark, der OpenAI implementiert\
  \ wurde\n\n## 16.1 Webnavigation\n\nWebnavigation ist grundsätzlich definiert als\
  \ der Vorgang, dass ein Benutzer mit einer Website oder mit mehreren Websites interagiert.\
  \ Der Benutzer kann Links anklicken, Text eintippen oder andere Aktionen ausführen,\
  \ um irgendeine Aufgabe zu erledigen, wie das Versenden einer E-Mail, das Jahr herauszufinden,\
  \ in dem die Französische Revolution stattfand, oder zu überprüfen, ob Facebook\
  \ neue Benachrichtigungen bereithält. All das erfolgt durch Navigation im Web, und\
  \ das wirft die Frage auf: Kann unser Programm die Navigation im Web erlernen?\n\
  \nAls das Web erfunden wurde, gab es lediglich ein paar Hyperlinks, die nur Text\
  \ enthielten. Wenn Sie neugierig sind, können Sie sich die erste Website an: [`info.cern.ch/`](http://info.cern.ch/).\n\
  \nEinige Jahre später, im Jahr 1995, veröffentlichte die Internet Engineering Task\
  \ Force (IETF) die Spezifikation für HTML 2.0 mit vielen Erweiterungen gegenüber\
  \ der Tim Berners-Lee erfundenen Original. Zu diesen Erweiterungen gehörten Formulare\
  \ und Formularelemente, die den Webdesignern ermöglichten, ihren Websites interaktive\
  \ Elemente hinuzufügen. Die Benutzer konnten Text eingeben und ändern, Checkbox\
  \ ankreuzen, Drop-down-Menüs verwenden und Buttons betätigen. Die Steuerunglemente\
  \ waren denen für minimalistische GUI-Anwendungen vergleichbar.\n\nUnd heute, mehr\
  \ als 24 Jahre später, gibt es JavaScript, HTML5-Canvas und im Browser laufende\
  \ Büroanwendungen. Der Unterschied zwischen Desktop und Web ist inzwischen so gering\
  \ und undeutlich, dass man manchmal gar nicht weiß, ob man eine HTML-Seite oder\
  \ ein natives Programm verwendet. Es ist jedoch noch immer der Browser, der HTML\
  \ beherrscht und über HTTP mit der Außenwelt kommuniziert.\n\n### 16.1.1 Browserautomatisierung\
  \ und RL\n\n\n\n\n自动化与网站的交互问题在很久以前就已经被尝试解决，即尝试通过解决实际任务：对网站进行测试和提取内容（即“网络爬虫”）。当你（或他人）开发的网站非常复杂，且你希望确保它能按预期运行运行时，测试是必不可少的。例如，如果你重新设计了一个实时网站的登录页面，你可能希望当有人输入错误密码、点击`我忘记了密码`按钮等时，新设计能够表现正常。一个复杂的网站可能潜在包含成百上千千用测试用例，这些用例在每次发布时都应该进行测试，因此自动化是非常理想的。\n\
  \n网络爬虫解决了从网站上大量提取特定数据的问题。例如，如果你想开发一个系统来收集大城市中所有披萨店的价格，你可能需要处理数百个不同的网站，而这些网站是难以管理的。网络爬虫工具试图解决与网站交互的问题。其功能从简单的\
  \ `HTTP` 请求及随后的 `HTML` 解析，到完全模拟用户行为（如移动鼠标指针、点击按钮、停顿思考等）。\n\n浏览器自动化的标准方法通常允许通过程序控制诸如\
  \ `Chrome` 或 `Firefox` 的浏览器，程序观察网页数据（如 `DOM-Tree`）或识别对象的屏幕位置并执行操作，如移动鼠标、按下按键、点击返回或简单执行某些\
  \ `JavaScript` 代码。这与强化学习（RL）任务的联系是显而易见的：我们的智能体通过执行动作和观察状态来与网页及浏览器进行交互。目前奖励是什么尚不清楚，但它应该是特定任务相关的，例如成功填写表单或到达所需信息的页面。\n\
  \n对于上述情况，一个可以学习在浏览器中完成任务的系统有很多实际应用。在测试非常大的网站时，通过“将鼠标指针向左移动五像素并点击左按钮”等低级动作来定义测试过程是极其费力的。实际上，人们想向系统演示操作方法，使其能够泛化并在相似的情况下重复演示的动作，或者至少足够健壮，能够识别更改的用户界面或更改的标签。此外，在许多情况下，任务预先完全未知，例如系统需要探索网站的弱点（如安全漏洞）。在这种情况下，RL\
  \ 智能体可以很快地尝试许多看似无意义的动作——比人类快得多。安全性测试的动作空间显然是巨大的，因此与丰富的人类测试人员相比，随机点击几乎没有竞争力。在这种情况下，RL\
  \ 智能体可以很快地尝试许多看似无意义的动作——比人类快得多。\n\n### 16.1 Mini of Bits\n\n据我所知，浏览器自动化领域只有一个测试被不该地遗忘了。为了弥补这一点，我们将在本章中对其进行深入探讨。2016\
  \ 年 12 月，OpenAI 发布了一个名为 `Mini of Bits` (`MiniWoB`) 的数据集，其中包含 80 个基于浏览器的任务。\n\n\n\
  \n\n\n尽管这是一个绝妙的主意，但 OpenAI MiniWoB 在最初发布后不久几乎就停止了。作为补偿的尝试，我们将更深入地查看测试，并学习编写一个可以解决某些任务的智能体。此外，我将讨论如何从人类用户处提取、预处理演示并整合到训练过程中，以及如何验证它们对智能体性能的影响。\n\
  \n但在我们处理智能体的强化学习之前，您必须理解 MiniWoB 是如何工作的。为此，我们将详细查看 OpenAI 的一个名为 OpenAI Universe\
  \ 的 Gym 扩展。\n\n## 16.2 OpenAI Universe\n\nOpenAI Universe 可以在 OpenAI 的 GitHub 仓库\
  \ [`github.com/openai/universe`](https://github.com/openai/universe) 中找到。其基本思想是使用\
  \ Gym 提供的类将通 GUI 应用程序封装在 RL 环境中。为此，使用 VNC 协议与运行在 Docker 容器中的 VNC 服务器建立连接，该服务器允许通过鼠标和键盘操作进行控制，并提供\
  \ GUI 应用程序的图像作为观察值。\n\n奖励由一个外部的“奖励者”守护进程 (`rewarder`) 提供，该进程运行在同一个容器中，并为智能体提供一个标量值作为奖励。可以在本地或通过网络同时运行多个容器，以并发收集回合数据，就像我们在\
  \ 第 11 章 中使用多个 Atari 模拟器来提高 Actor-Critic 算法的收敛性一样。图 16.2 阐明了这种架构。\n\n![\\[图像\\]](Images/16_02.jpg)\n\
  \n**图 16.2：** OpenAI Universe 架构\n\n这种架构允许将第三方应用程序快速集成到 RL 框架中，因为不需要对应用程序本身进行更改。您只需要将其封装为\
  \ Docker 容器并编写一个使用简单文本协议进行通信的小型奖励者守护进程即可。然而，这种方法比运行多个 Atari 模拟器要消耗资源得多，后者相对轻量且完全属于\
  \ RL 智能体过程的一部分。VNC 方法要求与应用程序一起启动 VNC 服务器。RL 智能体与应用程序之间的通信速度取决于 VNC 服务器的速度和网络数据吞吐量（如果您使用远程\
  \ Docker 容器）。\n\n### 16.2.1 安装\n\n由于 Universe 和 MiniWoB 已经停止维护，依赖项已很长时间没有更新，因此您为本书中的示例建立建立的环境在这里并不适用。Universe\
  \ 需要旧版本的 Gym，因为它包含了一些不向下兼容的更改。为了绕过这些问题，可以使用旧版本的 Gym。\n\n要安装环境，您可以使用 `pip`：\n\n```\n\
  pip install gym==0.21.1\n```\n\n此外，必须安装 Docker。要启动容器，请使用以下命令：\n\n```bash\ndocker\
  \ run -d -p 5900:5900 openai/universe\n```\n\n要设置虚拟环境，可以使用 `conda`：\n\n```\nconda\
  \ create -n wobenv python=3.7\nconda activate wobenv\n```\n\n### 16.2.2 动作与观察\n\n\
  与仅有离散动作的 Atari 游戏不同，OpenAI Universe 提供了一个更连续的动作空间。智能体可以控制鼠标移动并按下按键。\n\n\n\n\n要创建一个\
  \ Universe 环境，您必须再次调用 `gym.make()` 并传入环境 ID。MiniWoB 集合中的一个特别简单的任务是 `wob.mini.ClickDialog-v0`，在该任务中，您必须通过点击“X”关闭对话框。在使用环境之前，我们必须对其进行配置，并指定要在何处运行多少\
  \ Docker 实例。有一个名为 `configure()` 的特殊方法，它必须在环境的所有其他方法之前调用。它接收多个参数，最重要的的是这些：\n\n* \
  \  `remotes`: 一个参数，可以是数字或字符串。如果提供数字，它表示需要为环境启动多少个本地容器。如果是字符串，该参数可以指定已运行容器的 URL，环境将以以\
  \ `vnc://host1:port1+port2,host2:port1+port2` 的形式与之连接。第一个端口是 VNC 协议端口（默认值 `5900`）。第二个端口是奖励守护进程（reward\
  \ daemon）的端口（默认值 `15900`）。两个端口号可以在启动 Docker 容器时修改。\n*   `fps`: 该参数指定代理观测的每秒帧数（FPS）预期值。\n\
  *   `vnc_kwargs`: 一个包含额外 VNC 参数的字典，用于定义传输给代理的图像压缩率和质量。这些参数对性能非常重要，特别是在云端容器中。\n\n\
  为了说明，我们考虑一个非常简单的程序，它启动一个带有 `ClickDialog` 任务的单个容器并以图像形式获取其第一次观测。您可以在 `Chapter16/adhoc/wob_create.py`\
  \ 文件中找到该示例。\n\n```\n#!/usr/bin/env python3\nimport gym\nimport universe\nimport\
  \ time\n\nfrom PIL import Image\n```\n\n这个示例非常简单，我们只需要几个包。即使没有使用 `universe` 包，导入它也是必不可的，因为导入该包会在\
  \ Gym 中注册环境。\n\n```\nif __name__ == \"__main__\":\n    env = gym.make(\"wob.mini.ClickDialog-v0\"\
  )\n\n    env.configure(remotes=1, fps=5, vnc_kwargs={\n        'encoding': 'tight',\
  \ 'compress_level': 0,\n        'fine_quality_level': 100, 'subsample_level': 0\n\
  \    })\n    obs = env.reset()\n```\n\n我们创建环境并指示其进行配置。传递的参数表示，将只启动一个每秒五帧的本地容器，并且\
  \ VNC 连接不压缩图像。这意味着 VNC 服务器和 VNC 客户端之间会产生大量数据流量，但这样可以防止压缩伪影的出现。这对于显示小字体文本的 MiniWoB\
  \ 任务可能是必要的。\n\n```\nwhile obs[0] is None:\n    a = env.action_space.sample()\n \
  \   obs, reward, is_done, info = env.step([a])\n    print(\"环境正在重置 ...\")\n    time.sleep(1)\n\
  ```\n\n只要我们的唯一观测仍为 `None`（我们只期待一个观测，因为我们创建了一个容器），我们就向环境传递随机动作并等待图像出现。\n\n```\nprint(obs[0].keys())\n\
  im = Image.fromarray(obs[0]['vision'])\nim.save(\"image.png\")\nenv.close()\n```\n\
  \n当我们最终从服务器获取图像时，我们将其保存为 PNG 文件。对于 MiniWoB 任务，图像并不是我们收到的唯一观测。实际上，环境的观测是一个包含两个条目的字典：`vision`（一个带有图像像素的\
  \ NumPy 数组）和 `text`（任务的描述）。对于某些任务只需要图像，但在某些 MiniWoB 任务中，文本包含了关键信息，例如应该点击什么颜色或选择哪一个日期。图像经过了裁剪（也称为\
  \ cropping），因为观测的原始分辨率为 1024 x 768。\n\n![图像](img/16_03.jpg)\n**图 16.3:** MiniWoB\
  \ 观测的一部分\n\n### 16.2.4 MiniWoB 稳定性\n\n在我对 OpenAI 发布的最原始 MiniWoB Docker 镜像进行实验时，我遇到了一个严重的问题。控制浏览器的服务器端\
  \ Python 脚本偶尔会崩溃。这导致训练变得困难，因为环境会丢失与容器的连接。由于 OpenAI 不官方支持这些更改，我必须在容器内应用补丁来解决由于崩溃导致的连接。已修复补丁的镜像可以通过\
  \ Docker Hub 上的 `shmuma/miniwob:v2` 获取。如果您对此感兴趣，我在 `Chapter16/adhoc/wob_fixes` 目录下添加了补丁和示例。\n\
  \n## 16.3 简单点击\n\n作为首次演示，我们将实现一个简单的 A3C 代理（异步优势 Actor-Critic），它根据观测的图像决定点击哪里。这种方法只能解决一小部分\
  \ MiniWoB 任务，我们稍将详细讨论这种方法的局限性。为了让我们更好地理解任务，我们将像上一个章节一样不显示完整的代码，而是关注核心功能。完整的源代码在\
  \ GitHub 上可用。\n\n### 16.3.1 网格上的动作\n\n当我在讨论 Universe 的架构和组织时，提到了动作空间的丰富性和灵活性对强化学习代理是一个挑战。MiniWoB\
  \ 在浏览器中的活跃区域只有 160 x 210 像素（与 Atari 模拟器一样），但即使在如此小的区域内，我们的代理也可以被指示移动鼠标、执行点击、移动物体等。仅掌握鼠标可能就很困难，因为在极端情况下，代理可以执行几乎无限不同的动作。在我们的示例中，我们将极大简化任务，只考虑网页活跃区域内固定网格中的鼠标点击。图\
  \ 16.4 显示了动作空间网格的草图。\n\n![图像](img/16_04.jpg)\n**图 16.4:** 作为网格的动作空间\n\n这种方法在 Universe\
  \ 中已通过封装 `universe.wrappers.experimental.action_space.SoftmaxClickMouse` 实现。它使用了\
  \ MiniWoB 环境的默认设置，即向右偏移 10 像素并向下 75 像素（以考虑浏览器框架）的 160 x 210 像素区域。动作网格大小为 10 x 10，因此总共有\
  \ 256 个动作可供选择。\n\n\n\n\n除了动作的预处理器外，我们还需要一个用于观测的预处理器，因为 VNC 环境的输入图像是一个 1024x768x3\
  \ 张量，而活跃的 MiniWoB 区域仅有 160 x 210 像素。由于没有合适的裁剪（Cropping）函数，我在库模块 `Chapter16/lib/wob_vnc.py`\
  \ 中自己实现了一个类 `lib.wob_vnc.MiniWoBCropper`。代码非常简单：\n\n```\nWIDTH = 160\nHEIGHT = 210\n\
  X_OFS = 10\nY_OFS = 75\n\nclass MiniWoBCropper(vectorized.ObservationWrapper):\n\
  \    def __init__(self, env, keep_text=False):\n        super(MiniWoBCropper, self).__init__(env)\n\
  \        self.keep_text = keep_text\n\n    def _observation(self, observation_n):\n\
  \        res = []\n        for obs in observation_n:\n            if obs is None:\n\
  \                res.append(obs)\n                continue\n            img = obs['vision'][Y_OFS:Y_OFS+HEIGHT,\n\
  \                                X_OFS:X_OFS+WIDTH, :]\n            img = np.transpose(img,\
  \ (2, 0, 1))\n            if self.keep_text:\n                t_fun = lambda d:\
  \ d.get('instruction', '')\n                text = \" \".join(map(t_fun, obs.get(\n\
  \                       'text', [{}])))\n                res.append((img, text))\n\
  \            else:\n                res.append(img)\n        return res\n```\n\n\
  构造函数中的可选参数 `keep_text` 激活了保留任务描述文本的模式。我们目前不需要这一点，在智能体的第一个版本中，该模式始终处于禁用。在此模式下，`MiniWoBCropper`\
  \ 返回一个格式为 `(3, 210, 160)` 的 NumPy 数组。\n\n### 16.3.2 示例概述\n\n完成动作和观测后，下一步就很简单了。我们使用\
  \ A3C 算法来训练智能体，使其根据 160x210 的观测结果决定点击哪个网格单元。除了针对 256 个网格单元的概率分布策略（Policy）外，智能体还会估计状态值，该值用作策略梯度（PG）估计的基准。\n\
  \n在这个示例中有几个不同的模块：\n\n* `Chapter16/lib/common.py`: 本章示例使用的方法，包括已知的函数 `RewardTracker`\
  \ 和 `unpack_batch`。\n* `Chapter16/lib/model_vnc.py`: 包含模型定义，我们将在下一节中中讨论它。\n* `Chapter16/lib/wob_vnc.py`:\
  \ 包含 MiniWoB 特有的代码，如裁剪函数、配置环境的方法以及其他辅助函数。\n* `Chapter16/lib/wob_click_train.py`:\
  \ 训练模型的脚本。\n* `Chapter16/lib/wob_click_pay.py`: 加载模型权重并将其应用于环境、记录观测并计算奖励的脚本。\n\n\
  ### 16.3.3 模型\n\n模型非常简单，按照您在其他 A3C 示例中熟悉的模式工作。我没有在架构和超参数的优化与精调上花费太多时间，因此最终结果可能还有很大的改进空间。以下是带有两个卷积层、单层策略和单层输出的模型定义。\n\
  \n```\nclass Model(nn.Module):\n    def __init__(self, input_shape, n_actions):\n\
  \        super(Model, self).__init__()\n\n        self.conv = nn.Sequential(\n \
  \           nn.Conv2d(input_shape[0], 64, 5, stride=5),\n            nn.ReLU(),\n\
  \            nn.Conv2d(64, 64, 3, stride=2),\n            nn.ReLU(),\n        )\n\
  \n        conv_out_size = self._get_conv_out(input_shape)\n\n        self.policy\
  \ = nn.Linear(conv_out_size, n_actions)\n        self.value = nn.Linear(conv_out_size,\
  \ 1)\n\n    def _get_conv_out(self, shape):\n        o = self.conv(torch.zeros(1,\
  \ *shape))\n        return int(np.prod(o.size()))\n\n    def forward(self, x):\n\
  \        fx = x.float() / 256\n        conv_out = self.conv(fx).view(fx.size()[0],\
  \ -1)\n        return self.policy(conv_out), self.value(conv_out)\n```\n\n### 16.3.4\
