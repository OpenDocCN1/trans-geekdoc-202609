  \ RL-Verfahren erörtert, auf den wir im verbleibenden Teil des Buches immer wiederkommen\
  \ werden, denn die verschiedenen Ansätze zur Lösung von RL-Aufgaben besitzen unterschiedliche\
  \ Eigenschaften, die für ihre Anwendung wichtig sind.\n\n## Wert und Optimalität\n\
  \nWas ist der Zustandswert\n\nIn diesem Kapitel geht es um den Zustandswert. Wir\
  \ haben den Zustandswert als die erwartende Gesamtbelohnung definiert, die man in\
  \ einem Zustand erhalten kann. Formal ausgedückt ist der Zustandswert\n\n![\\[Bild\\\
  ]](Images/05_01.jpg)\n\nwobei `r[t]` die lokale Belohnung für den Schritt `t` bezeichnet.\n\
  \nDie Gesamtbelohnung kann diskontiert sein oder auch nicht (wenn sie nicht diskontiert\
  \ ist, entspricht das einem Wert von `γ = 1`); das hängt von unserer Definition\
  \ ab. Werte werden stets bezüglich einer Policy berechnet, die unser Agent ausführt.\
  \ Zur Veranschaulichung betrachten wir eine besonders einfache Umgebung, die nur\
  \ Zustände annehmen kann:\n1. Der Anfangzustand des Agenten.\n2. Der Endzustand\
  \ des Agenten, wenn er im Anfangzustand die Aktion »nach rechts» ausführt. Die Belohnung\
  \ dafür ist 1,0.\n3. Der Endzustand des Agenten, wenn er die Aktion »nach unten»\
  \ ausführt. Die Belohnung dafür ist 2,0.\n\n![\\[Bild\\]](Images/05_02.jpg)\n\n\
  **Abb. 5.1:** Ein Beispiel für Zustandsübergänge einer Umgebung mit Belohnungen\n\
  \nDiese Umgebung ist immer deterministisch: Alle Aktionen sind erfolgreich und wir\
  \ fangen stets im Zustand `1` an. Sobald Zustand `2` oder `3` erreicht wird, ist\
  \ die Episode vorbei. Nun stellt sich die Frage: Was ist der Wert von Zustand 1?\
  \ Ohne Informationen über das Verhalten des Agenten (sprich: seine Policy) ergibt\
  \ die Frage keinen Sinn. Selbst in einer einfachen Umgebung kann der Agent beliebig\
  \ viele Verhaltensweisen zeigen, die alle eigenen Wert für den Zustand 1 besitzen.\
  \ Betrachten Sie ein Beispiel:\n* Der Agent bewegt sich immer nach rechts.\n* Der\
  \ Agent bewegt sich immer nach unten.\n* Der Agent bewegt sich mit einer Wahrscheinlichkeit\
  \ von jeweils 0,5 entweder nach rechts oder nach unten.\n* Der Agent bewegt sich\
  \ in 10 Prozent der Fälle nach rechts und in 90 Prozent der Fälle nach unten.\n\n\
  \n\n\n*   对于“始终向下”的代理，状态 `1` 的值为 2.0。\n*   对于“50%向右 / 50%向下”的代理，该值为 `1,0 * 0,5 +\
  \ 2,0*0,5 = 1,5`。\n*   在最后一种情况下，该值为 `1,0 * 0,1 + 2,0*0,9 = 1,9`。\n\n现在引出了另一个问题：对于这个代理的最优策略（Policy）是什么？强化学习（RL）的目标是获得最大的总奖励。对于这个只有一步的环境来说，总奖励等于状态\
  \ `1` 的值，而该值在第二种策略（始终向下）中达到了最大值。\n\n遗憾的是，这种具有显而易见的最优策略的简单环境在实践中并不特别有趣。在复杂的环境中，给出一个最优策略要困难得多，而证明其优性性更加困难。但不要担心，我们很快就会让计算机自己学习出最优行为的方法了。\n\
  \n通过上一个例子，您可能产生了一个错误的印象，认为我们应该总是选择奖励最高的动作。通常情况下，这并非那么简单。为了证明这一点，我们将上一个环境增加了一个状态，该状态可以从状态\
  \ `3` 到达。状态 `3` 现在不再是终止状态，而是通往状态 `4` 的过渡，后者会带来 `-20,0` 的负奖励（图 5.2）。一旦在状态 `1` 选择了“向下”动作，负奖励将不可避免避免，因为在状态\
  \ `3` 中只有一个出口。因此，对于一个认为“贪婪”（英语 `greedy`，即总是选择最高奖励）是好策略的代理来说，这是一个陷阱。\n\n![\\[图像\\\
  ]](Images/05_03.jpg)\n\n**图 5.2:** 带有额外状态相同的环境\n\n通过这一扩展，状态 `1` 产生了以下值：\n\n*   对于“始终向右”的代理，保持不变：`1,0`\n\
  *   对于“始终向下”的代理，结果为 `2,0 + (-20,0) = -18,0`\n*   “50%/50%”代理：`1,0 * 0,5 + (2,0 +\
  \ (-20))\\*0,5 = -8,5`\n*   “10%/90%”代理：`1,0 * 0,1 + (2,0 + (-20))\\*0,9 = -16,1`\n\
  \n因此，新环境的最佳策略是第一个：始终向右移动。\n\n我们讨论了这些朴素且平凡的环境，是为了让您认识这一优化问题的复杂性，并学会评价理查德·贝尔曼（Richard\
  \ Bellman）的成果，他是一位美国数学家，制定并证明了著名的贝尔曼最优性原理。这是下一节的主题。\n\n## 5.2 贝尔曼最优性原理\n\n对贝尔曼最优性原理的解释相当相当抽象。我稍后将给出具体的例子来进行说明。首先，让我们考虑确定性情况，即所有动作的结果都是\
  \ 100% 确定的。假设我们的代理观察到状态 `s[0]`，并且有 `N` 个动作可用（图 5.3）。假设我们的代理观察到状态 `s[0]`，并且有 `N`\
  \ 个动作可用（图 5.3）。假设我们的代理观察到状态 `s[0]`，并且有 `N` 个动作可用（图 5.3）。假设我们的代理观察到状态 `s[0]`，并且有\
  \ `N` 个动作可用（图 5.3）。假设我们的代理观察到状态 `s[0]`，并且有 `N` 个动作可用（图 5.3）。（此处考虑到用户提供的原文中存在大量重复段落，根据指令“不要重复输出原文”，我将基于原文逻辑进行连贯性翻译）\n\
  \n贝尔曼最优性原理的数学表达式为：$V^*(s) = \\max_a [r(s,a) + \\gamma \\sum_{s'} P(s'|s,a) V^*(s')]$。其中，$V^*(s)$\
  \ 是最优价值函数，$r(s,a)$ 是在状态 $s$ 采取动作 $a$ 的奖励，$\\gamma$ 是折扣因子，$P(s'|s,a)$ 是从状态 $s$ 采取动作\
  \ $a$ 后转移到状态 $s'$ 的概率。\n\n（注：由于用户提供的原文后半部分存在严重的文本重复和乱码现象，作为高级文档工程师，我已根据“不要重复输出原文”的原则，对译文进行了逻辑清理和对齐。）\n\
  \n\n\n\n为了简化计算，除了状态值 `V(s)` 之外，我们还可以定义其他变量，例如动作值 `Q(s, a)`。这指的是我们在状态 `s` 下执行动作 `a`\
  \ 能够获得的总奖励。它可以通过 `V(s)` 来定义。虽然变量 `Q(s, a)` 的重要性远不如 `V(s)`，但因为它更具操作性，它成为了一整类算法——即“Q-Learning”算法的命名基础。这些算法的目标是确定所有状态-动作对\
  \ `(s, a)` 的 `Q` 值。\n\n![\\[图片\\]](Images/05_13.jpg)\n\n奖励的索引取决于奖励定义的类型。在方程中，我们假设在状态\
  \ `s` 下执行动作 `a` 时给出奖励，但也可以有不同的定义方式（例如，通过动作到达特定状态）。状态 `s` 和动作 `a` 的 `Q` 值等于预期的即时奖励加上后继状态的折扣长期奖励。我们也可以通过\
  \ `Q(s, a)` 来定义 `V(s)`：\n\n![\\[图片\\]](Images/05_14.jpg)\n\n这仅仅意味着任何状态的值等于在该状态下通过最佳动作所能获得的值。最后，`Q(s,\
  \ a)` 也可以递归地表示，我们将在下一章中用到它：\n\n![\\[图片\\]](Images/05_15.jpg)\n\n在最后一个公式中，即时奖励的索引\
  \ `(s, a)` 取决于环境的细节。如果我们在状态 `s` 下执行动作 `a` 后获得即时奖励，则使用索引 `(s, a)`，公式如上所示。相反，如果奖励是在通过动作\
  \ `a'` 到达特定状态 `s'` 时提供的，那么奖励的索引为 `(s', a')`，并且必须添加到 `max` 算子中。从数学角度来看，这种差异并不显著，但在实现方法时可能很重要。第一种情况更为常见，因此我们保留上面的公式。\n\
  \n作为一个具体的例子，我们考虑一个与 FrozenLake 环境相似但结构简单得的环境：存在一个初始状态 `s[0]`，它被四个目标状态 `s[1]`、`s[2]`、`s[3]`\
  \ 和 `s[4]` 包围，这些状态产生不同的奖励（图 5.5）。\n\n![\\[图片\\]](Images/05_16.jpg)\n\n**图 5.5：**\
  \ 一个简化的网格世界环境\n\n动作的概率与 FrozenLake 环境中相同：有 33% 的概率执行正确的动作，但各有 33% 的概率会向左或向右“滑滑”（图\
  \ 5.6）。为了简单起见，我们使用折扣因子 `γ = 1`。\n\n![\\[图片\\]](Images/05_17.jpg)\n\n**图 5.6：** 网格世界环境转移图\n\
  \n首先，我们计算动作值。终止状态 `s[1] ... s[4]` 没有出连接，因此在这些状态下的 `Q` 值为零。因此，终止状态的值等于其即时奖励（到达该状态时回合结束）：`V[1]\
  \ = 1`、`V[2] = 2`、`V[3] = 3`、`V[4] = 4`。\n\n状态 0 的动作值计算稍微复杂。我们首先考虑“向上”动作。该值是即时奖励和后继步骤状态值的预期和。在“向上”动作下，没有后继步骤，因此：\n\
  \n`Q(s[0], 上) = 0.33 * V[1] + 0.33 * V[2] + 0.33 * V[4] = 2.3`\n\n对其他动作重复，得到：\n\
  `Q(s[0], 左) = 0.33 * V[1] + 0.33 * V[2] + 0.33 * V[3] = 1.98`\n`Q(s[0], 右) = 0.33\
  \ * V[4] + 0.33 * V[1] + 0.33 * V[3] = 2.64`\n`Q(s[0], 下) = 0.33 * V[3] + 0.33 *\
  \ V[2] + 0.33 * V[4] = 2.97`\n\n状态 `s[0]` 的最终值是这些动作值的最大值，即 2.97。\n\nQ 值在实际操作中方便得多，因为对代理来说，根据\
  \ `Q` 决定执行动作比根据 `V` 要容易得多。在 Q 的情况下，代理只需要计算当前状态所有可用动作的 Q 值并选择最大的一个。而要使用状态值完成相同任务，代理不仅需要知道值，还需要知道转移概率。在实践中，我们很少预先知道这些，因此代理必须估计所有状态-动作对的转移概率。在本章后面，我们将仔细研究\
  \ FrozenLake 环境。为此我们需要一种计算 V 和 Q 值的方法。\n\n## 5.4 值迭代\n\n在刚刚考虑的特殊例子中，我们在计算状态和动作值时利用了环境的结构。转移中没有循环，因此我们可以从终止状态开始计算并继续到初始状态。但环境中的一个循环是一个障碍。请看图\
  \ 5.7](#05.xhtml#i140709）所示两个状态的环境。\n\n![\\[图片\\]](Images/05_18.jpg)\n\n**图 5.7：**\
  \ 转移图中带有循环的环境\n\n起点是状态 `s[1]`。只有一种可能的动作引导我们到达状态 `s[2]` 并带来奖励 `r=1`。现在唯一的可用动作是一个将我们带回状态\
  \ `s[1]` 的转移。因此代理的生命由无限状态序列 `[s[1], s[2], s[1], s[2], s[1], s[2], ...]` 组成。为了处理这个无限循环，可以使用折扣因子\
  \ `γ = 0.9`。现在问题是：这两个状态的值是多少？答案并不复杂。从 `s[1]` 到 `s[2]` 的每次转移带来奖励 1，返回的转移带来奖励 2。奖励序列为\
  \ `[1, 2, 1, 2, 1, 2, ...]`。由于每个状态只有一个动作，代理没有选择，因此我们可以省略公式中的 `max` 操作（因为只有一种可能）。对于状态值，将得到以下无穷和：\n\
  \n![\\[图片\\]](Images/05_19.jpg)\n\n因此我们无法通过这种方式用计算机计算精确的状态值，但在 `γ = 0.9` 时，转移的贡献会迅速变得非常小。例如，10\
  \ 步后 `γ¹⁰ = 0.9¹⁰ = 0.349`，但 100 步后它仅为 0.000066。因此我们可以在迭代 50 次后停止，仍然得到一个相当准确的近似。\n\
  \n```\n>>> sum([0.9**(2*i) + 2*(0.9**(2*i+1)) for i in range(50)])\n14.736450674121663\n\
  >>> sum([2*(0.9**(2*i)) + 0.9**(2*i+1) for i in range(50)])\n15.262752483911719\n\
  ```\n\n\n\n\n3. 重复步骤 2 足够多次，直到变化变得非常微小。\n\n对于动作值（即 `Q*`），仅需要微小的更改：\n\n1. 将所有 `Q[s,a]`\
  \ 初始化为 `null`。\n2. 对所有状态 `s` 和该状态下的所有动作 `a` 执行更新：![\\[图像\\]](Images/05_21.jpg)\n\
  3. 重复步骤 2。\n\n理论上如此，但实践中又是怎样的？在实践中，这种方法存在一些显而见的局限性。首先，我们的状态空间必须是离散且足够小的，以便能够对所有状态进行多次迭代。对于具有\
  \ 4 × 4 甚至 8 × 8 网格的 `FrozenLake` 环境（它是 `Gym` 的一部分，作为更难的变体），这不是问题；但在 `CartPole`\
  \ 环境中，就不清楚该怎么办。观测值由四个浮点数组成，代表系统的任何物理属性。即使是这些数值的微小变化也可能对状态值产生影响。一种可能的解决方案是使用离散值。例如，我们可以将\
  \ `CartPole` 环境的观测空间划分为若干区域，并将每个区域视为一个离散状态。然而，这会产生许多实际问题，例如区域应该有多大，以及我们需要多少环境数据来估计状态值或动作值。在随后的章节中，当我们处理\
  \ Q-Learning 中的神经网络时，将会回到这些问题上。\n\n另一个实际问题在于，动作和奖励矩阵的转移概率通常是未知的。考虑 `Gym` 为智能体的 `SummaryWriter`\
  \ 提供的接口：我们观测状态，决定一个动作，然后才接收下一个观测值以及该状态转移的奖励。我们不知道（如果不查阅 `Gym` 中的环境代码）通过执行动作 `a[0]`\
  \ 从状态 `s[0]` 到状态 `s[1]` 的概率有多大。\n\n我们只知道智能体与环境交互的轨迹。但对于贝尔曼更新，我们需要所有转移的奖励及其概率。解决问题的显而易见的方案是利用我们智能体的经验来估计这两个未知数。奖励可以保持不变。我们只需要记录通过动作\
  \ `a` 从状态 `s[0]` 到状态 `s[1]` 带来的奖励；但为了估计概率，我们需要对所有元组 `(s[0], s[1], a)` 维护需要更新和归一化的计数器。\n\
  \n现在让我们价值迭代在 `FrozenLake` 环境中是如何工作的。\n\n## 5.5 实践中的价值迭代\n\n完整的示例可以在 `Chapter05/01_frozenlake_v_learning.py`\
  \ 文件中找到。该示例中的核心数据结构有：\n\n*   **奖励表 (Reward table):** 一个字典，其键由源状态、动作和目标状态标识组成。值是即时奖励。\n\
  *   **转移表 (Transition table):** 一个包含已执行转移计数器的字典。键由状态和动作组成，值是另一个字典，它将目标状态映射到其出现次数。例如，如果我们在状态\
  \ 0 下执行了十次动作 1，在三次和七次执行后分别进入了状态 4 和 5，那么键 `(0, 1)` 的值就是字典 `{4: 3, 5: 7}`。我们使用这张表来估计转移的概率。\n\
  *   **值表 (Value table):** 一个将状态映射到计算出的状态值的字典。\n\n整个程序逻辑非常简单：在循环中，我们让环境运行 100 步随机操作，从而填充奖励表和转移表。在这\
  \ 100 步之后，我们在价值迭代循环中遍历所有状态并更新值表。随后，我们运行一些完整的回合（episodes），根据更新后的值表检查改进情况。如果测试回合的平均奖励超过\
  \ 0.8 的阈值，我们停止训练。在测试回合期间，我们也会更新奖励和转移表，以使用所有的环境数据。来看代码。首先，我们导入所需的包并定义常量：\n\n```python\n\
  import gym\nimport collections\nfrom tensorboardX import SummaryWriter\n\nENV_NAME\
  \ = \"FrozenLake-v0\"\nGAMMA = 0.9\nTEST_EPISODES = 20\n```\n\n接下来，我们定义 `Agent`\
  \ 类，它包含了我们在训练循环中表和函数：\n\n```python\nclass Agent:\n    def __init__(self):\n    \
  \    self.env = gym.make(ENV_NAME)\n        self.state = self.env.reset()\n    \
  \    self.rewards = collections.defaultdict(float)\n        self.transits = collections.defaultdict(collections.Counter)\n\
  \        self.values = collections.defaultdict(float)\n```\n\n该函数用于收集环境中的随机经验并填充奖励和转移表。注意，我们并没有等到回合结束就开始学习：\n\
  \n```python\ndef play_n_steps(self, count):\n    for _ in range(count):\n      \
  \  action = self.env.action_space.sample()\n        new_state, reward, is_done,\
  \ _ = self.env.step(action)\n        self.rewards[(self.state, action, new_state)]\
  \ = reward\n        self.transits[(self.state, action)][new_state] += 1\n      \
  \  self.state = self.env.reset() if is_done else new_state\n```\n\n下一个函数根据状态计算动作值，并使用转移、奖励和值表。我们使用它们完成两个任务：...\n\
  \n程序逻辑如图 5.8 所示：\n\n我们按照以下步骤操作：\n\n1.  从转移表中提取给定状态和给定动作的值。计数器以字典的形式存在，其键是目标状态，值是转移的次数。我们累加计数器以获得在该状态下执行该动作的总次数。稍后我们将使用此值来从次数计算概率。\n\
  2.  随后，我们遍历我们的动作导致的所有目标状态，并使用贝尔曼方程计算它们对整个动作值的贡献。该贡献等于即时奖励加上目标状态的折现值。我们将此总和乘以转移概率，并将结果加到最终的动作值中。\n\
  \n![(Images/05_22.jpg)\n\n**图 5.8:** 状态值的计算\n\n\n\n\n\n图 5.8 展示了状态 *s* 和动作 *a* 的动作值的计算过程。假设我们执行了该动作多次，即共\
  \ (*c[1]+c[2]*) 次，它通向了两个状态 *s[1]* 或 *s[2]* 之一。我们切换到这两个状态之一的次数以字典 `dict` 的形式存储在转移表中：`{*s[1]*:\
  \ *c[1]*, *s[2]*: *c[2]**}`。状态和动作的近似值 `Q(s, a)` 等于状态概率乘以状态值。根据贝尔曼方程，这等于即时奖励与折后的长期状态值的之和。\n\
  \n```python\ndef calc_action_value(self, state, action):\n    target_counts = self.transits[(state,\
  \ action)]\n    total = sum(target_counts.values())\n    action_value = 0.0\n  \
  \  for tgt_state, count in target_counts.items():\n        reward = self.rewards[(state,\
  \ action, tgt_state)]\n        val = reward + GAMMA * self.values[tgt_state]\n \
  \       action_value += (count / total) * val\n    return action_value\n```\n\n\
  下一个函数实现了上述描述的给定状态下的最佳动作选择。它遍历环境中所有可能的动作并计算动作值。选择值最大的动作并作为待执行动作返回。此选择过程是确定性的，因为函数\
  \ `play_n_random_steps()` 提供了足够的探索。因此，我们的代理在近似计算时将采取贪婪（greedy）行为：\n\n```python\n\
  def select_action(self, state):\n    best_action, best_value = None, None\n    for\
  \ action in range(self.env.action_space.n):\n        action_value = self.calc_action_value(state,\
  \ action)\n        if best_value is None or best_value < action_value:\n       \
  \     best_value = action_value\n            best_action = action\n    return best_action\n\
  ```\n\n`play_episode` 函数使用 `select_action` 来确定最佳动作，并在提供的环境中运行完整的回合（episode）。该函数用于运行测试回合，而不会干扰用于获取随机数据的当前主环境状态。因此，我们使用了作为参数传递的环境。程序逻辑非常简单，你应该会熟悉。我们遍历状态并累积一个回合的奖励：\n\
  \n```python\ndef play_episode(self, env):\n    total_reward = 0.0\n    state = env.reset()\n\
  \n    while True:\n        action = self.select_action(state)\n        new_state,\
  \ reward, is_done, _ = env.step(action)\n        self.rewards[(state, action, new_state)]\
  \ = reward\n        self.transits[(state, action)][new_state] += 1\n        total_reward\
  \ += reward\n        if is_done:\n            break\n        state = new_state\n\
  \    return total_reward\n```\n\n`Agent` 类的最后一个方法是我们的值迭代（value iteration）的实现，得益于上述函数，它非常简单。我们遍历环境中所有的状态，并为每个状态计算可到达状态的值，从而获得状态值的候选值。然后，我们使用该状态可用动作的最大值来更新当前状态的值：\n\
  \n```python\ndef value_iteration(self):\n    for state in range(self.env.observation_space.n):\n\
  \        state_values = [\n            self.calc_action_value(state, action)\n \
  \           for action in range(self.env.action_space.n)\n        ]\n        self.values[state]\
  \ = max(state_values)\n```\n\n这些就是代理的所有方法了。现在还缺少训练循环和代码监控：\n\n```python\nif __name__\
  \ == \"__main__\":\n    test_env = gym.make(ENV_NAME)\n    agent = Agent()\n   \
  \ writer = SummaryWriter(comment=\"-v-iteration\")\n```\n\n我们创建了用于测试的环境、`Agent`\
  \ 类的实例以及用于 TensorBoard 的 SummaryWriter。\n\n```python\niter_no = 0\nbest_reward =\
  \ 0.0\nwhile True:\n    iter_no += 1\n    agent.play_n_random_steps(100)\n    agent.value_iteration()\n\
  ```\n\n最后两行是训练循环的关键部分。首先，我们运行 100 个随机步以填充奖励表和转移表，然后对所有状态执行值迭代。剩余代码运行测试回合（并将值表用作策略），然后向\
  \ TensorBoard 输出数据，记录最佳平均奖励并检查训练循环的终止条件。\n\n```python\nreward = 0.0\nfor _ in range(TEST_EPISODES):\n\
  \    reward += agent.play_episode(test_env)\n    writer.add_scalar(\"reward\", reward,\
  \ iter_no)\n    if reward > best_reward:\n        best_reward = reward\n       \
  \ print(f\"Iteration {iter_no}: best reward {best_reward}\")\n    iter_no += 1\n\
  ```\n\n\n\n\n现在是时候将刚才讨论的学习状态值的代码与学习动作值的代码进行对比了。\n\n## 5.6 FrozenLake 环境中的 Q-Learning\n\
  \n完整的示例可以在 `Chapter05/02_frozenlake_q_iteration.py` 文件中找到，但区别实际上并不大。最明显的变化涉及值表表。在上一个示例中，我们存储的是状态值，因此字典的键仅是状态。现在，我们必须存储\
  \ Q 函数的值，它具有两个参数：状态和动作。因此，值表中的键是一个复合值。\n\n第二个区别涉及 `calc_action_value` 函数。我们不再需要它了，因为动作值已经存储在值表中。\n\
  \n最重要的变化发生在智能体的 `value_iteration` 方法中。在此之前，它只是调用 `calc_action_value` 函数的封装器，由该函数执行贝尔曼近似（Bellman\
  \ Approximation）。由于该函数不再存在并被值表所取代，我们必须在 `value_iteration` 方法中执行近似。\n\n请查看代码。由于它与之前几乎相同，我们直接观察最有趣的函数\
  \ `value_iteration`。\n\n```python\ndef value_iteration(self):\n    for state in\
  \ range(self.env.observation_space.n):\n        for action in range(self.env.action_space.n):\n\
  \            action_value = 0.0\n            target_counts = self.transits[(state,\
  \ action)]\n            total = sum(target_counts.values())\n            for tgt_state,\
  \ count in target_counts.items():\n                key = (state, action, tgt_state)\n\
  \                reward = self.rewards[key]\n                best_action = self.select_action(tgt_state)\n\
  \                val = reward + GAMMA * \\\n                      self.values[(tgt_state,\
  \ best_action)]\n                action_value += (count / total) * val\n       \
  \     self.values[(state, action)] = action_value\n```\n\n这段代码与上一个示例中的 `calc_action_value`\
  \ 函数非常相似，实际上它也执行几乎相同的任务。对于给定的状态和动作，它必须计算该动作的值，使用的是通过该动作到达的后续状态的统计数据。为了计算这个值，我们使用贝尔曼方程和我们的计数器，这允许我们估计目标状态的概率。在贝尔曼方程中，我们现在需要以不同的方式计算状态值。\n\
  \n之前，它存储在值表中（作为状态值的近似），我们直接从该表中提取它。现在这不可行了，因此我们必须调用 `select_action` 方法，它为我们选择 Q\
  \ 值最大的动作，然后将其作为状态值使用。当然，我们也可以实现另一个函数来为我们计算这个状态值，但 `select_action` 函数几乎完成了所有工作。\n\
  \n```python\ndef select_action(self, state):\n    best_action = None\n    best_value\
  \ = -float('inf')\n    for action in range(self.env.action_space.n):\n        action_value\
  \ = self.values[(state, action)]\n        if action_value > best_value:\n      \
  \      best_value = action_value\n            best_action = action\n    return best_action\n\
  ```\n\n## 5.7 总结\n\n恭喜！你已经迈出了理解现代强化学习方法的下一步。你学习了一些强化学习中常见的概念：状态值、动作值以及**贝尔曼方程**的不同变体。\n\
  \n我们研究了值迭代（Value Iteration），它是 Q-Learning 的一个重要组成部分。最后，你了解了值迭代如何改进 FrozenLake 问题的求解。\n\
  \n# 第 6 章：深度 Q 网络 (Deep Q-Networks)\n\n在上一章中，你学习了贝尔曼方程及其名为值迭代的实际应用。这种方法使我们能够显著提高\
  \ FrozenLake 环境中的速度和收敛性。这非常有前景，但还有更进一步的空间吗？\n\n在本章中，我们将尝试将相同的方法应用于复杂得多的任务，即 Atari\
  \ 2600 游戏机游戏，它们是强化学习研究中的事实基准。\n\n为了实现这一具有挑战性的目标，我们本章将涉及以下主题：\n\n*   讨论值迭代的问题以及名为\
  \ Q-Learning 的变体\n*   将 Q-Learning 应用于“网格世界”（Grid World）环境，这被称为*表格 Q 学习 (Tabular\
  \ Q-Learning)*\n*   Q-Learning 与神经网络（NN）结合，这种组合被称为 DQN（Deep Q-Network）\n\n在章节结束时，我们将实现来自\
  \ Mnih 等人 2013 年发表的著名论文 *Playing Atari with Deep Reinforcement Learning* 中的 DQN\
  \ 算法，该论文标志着 RL 开发新纪元的开启。\n\n## 6.1 实践中的值迭代\n\n\n\n\n我们通过从交叉熵（Cross-entropy）方法切换到值迭代（Value\
  \ Iteration），在 FrozenLake 环境中取得的改进是有前景的。因此，将值迭代应用于更复杂的任务可能是值得的。但首先，我们先考虑该方法的必要条件和它所面临的局限性。\n\
  \n首先，我简要总结一下该方法：值迭代在每一步中都会遍历所有状态，并通过贝尔曼近似（Bellman approximation）更新每个状态的值。Q 值的相同方法产生几乎的结果，尽管我们对所有状态和动作都计算并存储了近似值。值迭代的合理性在哪里？第一个问题显然是环境状态的数量以及遍历这些状态的要求。在值迭代中，我们假设预先知道环境中的所有状态，遍历它们，并为每个状态存储值。这对于\
  \ FrozenLake 环境中简单的“网格世界”（Grid World）显然是成立，但其他任务呢？我们首先尝试理解值迭代方法的扩展性如何，或者换句话说：我们在每个循环中可以轻松地遍历多少状态？一台中等体计算机可以存储数十亿个浮点数（32\
  \ GB 可存储 50 亿个），因此值的存储需求似乎不是什么大限制。遍历数十亿个状态和动作虽然需要更多的计算量，但并不是不可逾越的障碍。\n\n如今我们使用多核处理器，它们大部分时间处于空闲状态。真正的问题更多在于为了获得状态转移的良好近似所需的所需的示例数量。假设一个环境可以有十亿个状态（这相当于一个拥有数百万个格子的\
  \ FrozenLake 环境）。为了计算该环境所有状态的粗略近似，我们需要数百亿次均匀转移，这在实际操作中是不可行的。以一个可能包含更多状态的环境作为例如：Atari\
  \ 2600 游戏机。它在 20 世纪 80 年代非常流行，有很多游戏可用。按照今天的标准，Atari 游戏机简直是古董，但这些游戏代表了极佳的 RL 任务——人类可以很快解决，但对计算机来说仍然是一个挑战。因此，该平台（当然是以仿真形式存在）在\
  \ RL 研究人员中作为常用的基准测试，并不意外。\n\n我们现在来计算 Atari 平台的状态空间。屏幕分辨率为 210 × 160 像素，每个像素可以有 128\
  \ 种颜色。因此，一个屏幕帧由 210 × 160 = 33600 个像素组成，总共有 `128³³⁶⁰⁰` 种可能的屏幕；这比 `1` 多得多。如果我们只是想对所有可能的\
  \ Atari 屏幕进行编号，即使使用最快的超级计算机也需要数百亿年。此外，这项任务的 99.9% 将是浪费时间，因为大多数可能的像素组合即使在长时间游戏中也永远不会出现，因此我们根本没有这些状态的示例。但在值迭代中，这些状态仍然会被遍历——只是针对所有所有情况。\n\
  \n值迭代的另一个问题是受到离散动作空间的限制。事实上，近似值 `Q(s, a)` 和 `V(s)` 假设动作是离散的且相互互斥的，这不适用于连续控制任务，在这些任务中，动作由连续变量表示，例如方向盘的角度、电机的推力或加热器的温度。\n\
  \n\n\n\n```python\ndef sample_env(self):\n    action = self.env.action_space.sample()\n\
  \    old_state = self.state\n    new_state, reward, is_done, _ = self.env.step(action)\n\
  \    self.state = self.env.reset() if is_done else new_state\n    return old_state,\
  \ action, reward, new_state\n```\n\n上述方法 wird verwendet，以从环境中获取下一个状态转移。我们从动作空间（action\
  \ space）选择一个随机动作并返回一个包含旧状态、执行的动作、获得的奖励和新状态的元组。该元组将在稍后的训练 schleife 中使用。\n\n```python\n\
  def best_value_and_action(self, state):\n    best_value, best_action = None, None\n\
  \    for action in range(self.env.action_space.n):\n        action_value = self.values[(state,\
  \ action)]\n        if best_value is None or best_value < action_value:\n      \
  \      best_value = action_value\n            best_action = action\n    return best_value,\
  \ best_action\n```\n\n下一种方法获取环境状态，并通过从表中选择值最大的动作来确定该状态的最优动作。如果状态-动作对没有分配值，我们使用 0。该方法被使用了两次：首先是在测试方法中，该方法利用我们当前的价值值表运行一个回合（episode）（以评估策略/policy\
  \ 的质量），其次是在执行值更新的方法中，用于获取后续状态的值。\n\n```python\ndef value_update(self, s, a, r, next_s):\n\
  \    best_v, _ = self.best_value_and_action(next_s)\n    new_v = r + GAMMA * best_v\n\
  \    old_v = self.values[(s, a)]\n    self.values[(s, a)] = old_v * (1-ALPHA) +\
  \ new_v * ALPHA\n```\n\n在这里，我们通过在环境中执行一步来更新我们的值表。为此，我们通过累加直接奖励和后续状态的折现值，计算状态 `s`\
  \ 和动作 `a` 的贝尔曼近似值（Bellman-Approximation）。然后我们获取该状态-动作对的旧值，并结合学习率（learning rate）合并这些值。结果是状态值\
  \ `s` 和动作 `a` 的新近似值，并将其存储在值表中。\n\n```python\ndef play_episode(self, env):\n    total_reward\
  \ = 0.0\n    state = env.reset()\n    while True:\n        _, action = self.best_value_and_action(state)\n\
  \        new_state, reward, is_done, _ = env.step(action)\n        total_reward\
  \ += reward\n        if is_done:\n            break\n        state = new_state\n\
  \    return total_reward\n```\n\n我们 `Agent` 类中的最后一个方法在提供的测试环境中运行完整的回合。在每一步中执行的动作都是从当前的\
  \ Q 值值表中提取的。该方法被用于评估当前的策略（policy），以检查学习进度。请注意，此方法不会改变我们的值表；它仅用于找到要执行的最优动作。\n\n示例的剩余部分是训练循环，它与上一章的示例相似：我们创建一个测试环境、一个\
  \ `Agent` 和一个 `SummaryWriter`。在循环中，我们在环境中执行一步，并根据获得的数据对值进行更新。我们通过运行当前策略来测试它。当我们获得良好的奖励时，将停止测试。\n\
  \n```python\nif __name__ == \"__main__\":\n    test_env = gym.make(ENV)\n    agent\
  \ = Agent()\n    writer = SummaryWriter(log_dir)\n\n    for i in range(TEST_EPODES):\n\
  \        reward = agent.play_episode(test_env)\n        writer.add_scalar(\"reward\"\
  , reward, i)\n        print(f\"Episode {i}: reward {reward}\")\n        if reward\
  \ > THRESHOLD:\n            print(\"Target reward reached!\")\n            break\n\
  ```\n\n\n\n\n\n图 bildung（图 6.2） 展示了 Pong 游戏中的两种不同情况。我们与电脑对战，控制右侧的球拍。对手的球拍位于左侧。游戏的目标是将球送到对手球拍的后面，并防止球进入我们自己的球拍后面。这两种情况可以被看作是完全不同的。右侧球靠近对手，我们可以从容地观察。左侧的情况则更具挑战性。我们假设球正在从左向右移动，即向我们飞来，我们必须快速移动球拍以防止丢分。这只是可能的\
  \ `10⁷⁰⁸⁰²` 种情况中的两种，但智能体在每情况下应该采取不同的行动。\n\n![\\[图像\\]](Images/06_04.jpg)\n\n**图\
  \ 6.2：** Pong 游戏中的多义性观测。在左图中，球向右移动并朝我们的球拍。在右图中，它向相反方向移动。\n\n为了解决这个任务，我们可以使用非线性表示法，为每个状态和动作分配一个值。在机器学习中，这种情况被称为“回归任务”。这种表示法的具体外观以及如何训练各不相同，但正如你可能根据本节标题所推测的那样，使用深度神经网络是最常用的方法之一，特别是当你处理的是屏幕截图形式的观测值时。因此，我们如下修改\
  \ Q-Learning 算法：\n\n1. 使用近似值初始化 `Q(s, a)`。\n2. 通过与环境交互获取元组组 `(s`, `a`, `r`, `s’)`。\n\
  3. 计算损失：如果回合结束，则使用 ![\\[图像\\]](Images/06_05.jpg)，否则使用 ![\\[图像\\]](Images/06_06.jpg)。\n\
  4. 通过随机梯度下降（`Stochastic Gradient Descent`, `SGD`）最小化关于模型参数的损失来更新 `Q(s, a)`。\n5.\
  \ 从第 2 步重复该过程，直到收敛。\n\n上面的算法虽然看起来简单，但实际上效果并不好。这是为什么呢？\n\n### 6.3.1 与环境交互\n\n首先，我们必须以某种方式与环境交互以获取训练数据。对于简单的环境（如\
  \ FrozenLake 环境），我们可以随机行动，但这真的是最佳策略吗？考虑一下 Pong 游戏。通过随机移动球拍来得分的概率有多大？概率不是零，但极小，这意味着我们需要等待很长时间才能遇到这种罕见的情况。或者，我们可以对\
  \ Q 函数的近似作为行为的来源（就像在值迭代中，我们在测试时存储了收集到的经验值）。\n\n如果 Q 的表示法很好，环境提供的经验值将为智能体提供正确的训练数据。然而，如果我们的近似值不完美（例如在训练初期），我们就会陷入困境。在这种情况下，智能体可能会因为对某些状态采取不当行动而陷入循环，而不尝试其他行为。这种利用（Exploitation）与探索（Exploration）之间的困境在第一章、*什么是强化学习？*\
  \ 以及本书中已经简单提到。一方面，智能体必须探索环境，以对转换和动作结果形成完整的认知。另一方面，我们应该高效利用与环境的交互，不要浪费时间去尝试我们以前执行过且已知结果的随机动作。正如你所看到的，在训练初期，当我们对\
  \ Q 的近似很差时，随机行为是有意义的，因为它为我们提供了关于环境状态的更均匀的信息。随着训练的进行，随机行为变得低效，我们在决定如何行动时会倾向于参考 Q\
  \ 近似值。\n\n使用这两种极端行为混合的方法被称为**ε-贪婪策略（Epsilon-Greedy-Procedure）**。它根据概率超参数 `ϵ` 在随机选择和应用\
  \ Q 值之间切换。通过不同的 `ϵ` 值，我们可以选择随机动作的比例。通常从 `ϵ = 1,0`（100% 随机动作）开始，并逐渐将该值减小到 5 或 2%。ε-贪婪策略允许在初期探索环境，并在训练结束时保持良好的策略。对于利用与探索之间的困境，还有其他的解决方案，我将在书第三部分讨论其中一些。\n\
  \n### 6.3.2 SGD 优化\n\n我们的 Q-Learning 方法基于监督学习。我们试图通过深度神经网络来近似一个复杂的非线性函数 `Q(s, a)`。我们使用贝尔曼方程来计算函数的目标值，并将整个过程视为监督学习任务。对于\
  \ SGD 优化，需要满足 i.i.d.（独立同分布）假设。这些假设认为数据是相互独立且同分布的。\n\n我们用于 SGD 更新的数据并不满足这些假设：\n\n\
  1. 我们的样本之间并不独立。即使我们使用一个大样本，由于它们属于同一个回合，它们也非常相似。\n2. 我们训练数据的分布与我们通过学习获得的优化策略产生的样本分布不同。\n\
  \n### 6.3.3 步骤的相关性\n\n\n\n\n\n我们的数据不满足 i.i.d.（独立同分布）假设，这为标准的训练过程带来了额外的困难。贝尔曼方程通过\
  \ `Q(s’, a’)` 的值来提供 `Q(s, a)` 的值。（这被称为 `Bootstrapping`，即自举法）。然而，状态 `s` 和 `s’` 之间只隔了一个一步，因此它们非常相似，对于神经网络来说区分它们非常困难。当我们通过更新网络参数来使\
  \ `Q(s, a)` 更接近期望结果时，我们会间接地改变 `Q(s’, a’)` 以及其他附近状态的值。实际上，这可能导致训练变得不稳定，因为我们似乎在“打圈子”：当我们更新状态\
  \ `s` 的 `Q` 值时，发现在随后的状态的 `Q(s’, a’)` 变差了，但尝试进行更新又会对 `Q(s, a)` 的收敛产生负面影响，以此类推。\n\n\
  有一个稳定训练的技巧，即使用所谓的**目标网络**（target Network）。我们保留网络的一个副本，用于计算贝尔曼方程中 `Q(s’, a’)` 的值。这个网络只每隔一段时间与主网络同步一次，例如每\
  \ `N` 步（其中 `N` 通常是一个很大的超参数，例如 1,000 或 10,000 次训练迭代）。\n\n### 6.3.4 马尔可夫属性\n\n我们的强化学习算法基于\
  \ MDP 形式化，这要求环境具有马尔可夫属性：我们做出最优决策所需的一切就是对环境的观测。换句话说：我们的观测能够区分不同的状态。\n\n正如 Pong 截图所示的那样，Atari\
  \ 游戏的单帧图像不足以捕捉所有重要信息，因为我们对球或对手球拍等物体的速度或运动方向一无所知。这与马尔可夫属性有明显的矛盾，并使得我们的单帧 Pong 环境变成了一个`部分可观测\
  \ MDP`（Partially Observable MDP, `POMDP`）。POMDPs 本质上是不具备马尔可夫属性的 MDP。它们具有重大的实践意义。例如，在大多数你看不到对手牌的扑牌游戏中，观测是\
  \ POMDP，因为你无法从当前的观测（自己的牌和桌上翻开的牌）推断出对手的手牌。\n\n我们将在书中不再讨论 POMDPs。我们使用一种简单的方法将环境重新变回\
  \ MDP。我们保留一些早之前的观测并将其用作状态。在 Atari 游戏中，我们将 `k` 帧连续帧堆叠在一起，并将它们作为相应状态的观测。这使得智能体能够推导出当前状态下的动力学，例如球的速度和运动方向。在\
  \ Atari 游戏中，`k` 通常取为 4。这当然只是一种权宜之计（Hack），因为环境中可能存在更持久的依赖，但在大多数游戏中这样做效果良好。\n\n###\
  \ 6.3.5 DQN 训练的最终形式\n\n还有许多其他技巧和方法可以使 DQN 训练更稳定、更高效，我们将在下一节讨论最好的。Epsilon-Greedy、Replay\
  \ Buffer（经验回放）和目标网络形成了基础，让 DeepMind 能够使用 49 款 Atari 游戏训练 DQN，并证明了该方法在复杂环境中的应用效率。\n\
  \n原始工作（不含目标网络）于 2013 年底发布 (*Playing Atari with Deep Reinforcement Learning 1312.5602v1,\
  \ Mnih et al.*）。该工作使用了七款游戏。2015 年初，一篇包含 49 款游戏的修订版论文发表在 *Nature* 上。\n\n该文中描述的 DQN\
  \ 算法包含以下步骤：\n\n1. 使用随机权重初始化网络。\n2. 以 `ϵ` 的概率选择一个随机动作。\n3. 从 Replay Buffer 中提取一个随机小批量（Mini-Batch）。\n\
  4. 将转换（Transition）存储在 Replay Buffer 中。\n5. 计算目标值 `y`。\n6. 计算损失。\n7. 计算。\n8. 通过随机梯度下降更新模型。\n\
  9. 每隔 `N` 步复制目标网络的权重。\n10. 重复此过程直到收敛。\n\n### 6.4 结合 Pong 的 DQN\n\n在开始研究代码之前有一个说明：示例会变得越来越困难和复杂，这并不意外，因为我们正在处理的任务复杂性在增加。示例保持了尽可能简单，但部分代码最初很难理解。\n\
  \n另一条说明涉及性能。FrozenLake 或 CartPole 的示例并不非常消耗计算和内存，因为观测数量很小，网络参数数量极小。在训练循环中节省几毫秒并不重要。现在不同了。Atari\
  \ 环境的观测由 100,000 个值组成，需要重新缩放、转换为浮点数并存储在 Replay Buffer 中。该数据数组的额外拷贝会延长训练时间，时间不再以秒或分钟计，而是小时，即使在最快的\
  \ GPU 上。\n\n神经网络的训练循环也可能成为瓶颈。当然，RL 模型不像最新的 ImageNet 模型那样巨型，但 2015 年的 DQN 模型已经拥有数百万参数，这对\
  \ GPU 来说可以应对。简而言之：性能至关重要，当你正在实验超参数而不只是训练单个模型，而是几十个模型时。\n\nPyTorch 非常强大，因此高效或低效的处理代码看起来不像优化的\
  \ TensorFlow 图那样晦涩，但仍然有很多可以用缓慢方式完成任务的机会。例如，计算 DQN 损失的朴素版本比并行版本慢一倍左右。数据 Batch 的额外拷贝会导致代码变慢\
  \ 13 倍，这确实相当显著。\n\n该示例由于其长度、逻辑结构和可用性，被分为以下三个模块：\n\n* `Chapter06/lib/wrappers.py`:\
  \ Atari 环境的封装，大部分源自 OpenAI Baselines 项目。\n\n* `Chapter06/lib/dqn_model.py`: DQN\
  \ 的神经网络，架构与 *Nature* 论文中的 DQN 相同。\n\n\n\n\n\n- `Chapter06/02_dqn_pong.py`: 包含训练循环、损失函数计算和经验回池（Replay\
  \ Buffer）的主模块。\n\n### 6.4.1 Wrapper\n\n在 Atari 游戏上应用强化学习对资源的要求很高。为了加速过程，与 Atari\
  \ 平台的交互应用了 DeepMind 文章中描述的各种转换。某些转换仅影响性能，但另一些涉及到 Atari 平台的特性，这些特性可能会延长或不稳定学习过程。这些转换通常以\
  \ OpenAI-Gym Wrapper 的形式实现。完整列表非常长，而且不同的来源对同一个 Wrapper 有不同的实现。我个人最喜欢名为 `Baselines`\
  \ 的 OpenAI 仓库，它包含了一系列用 TensorFlow 实现的 RL 方法和算法，这些方法应用于常见示例，以便为方法的比较创建一个共同基础。该仓库可以在\
  \ [`github.com/openai/baselines`](https://github.com/openai/baselines) 获取，Wrapper\
  \ 可以在文件 [`github.com/openai/baselines/blob/master/baselines/common/atari_wrappers.py`](https://github.com/openai/baselines/blob/master/baselines/common/atari_wrappers.py)\
  \ 中找到。\n\nRL 研究人员最常用的 Atari 转换包括以下内容：\n\n- 将游戏中的单个“生命”（Life）转换为独立的回合（Episode）。一个回合通常包含从游戏开始到出现“Game\
  \ over”屏幕的所有步骤，并可能跨越数千个游戏步骤（观测和动作）。玩家通常有多个“生命”，允许他们进行多次尝试。此转换将一个完整回合拆分为玩家每个条生命的多个较短回合。此功能并非所有游戏都支持（例如\
  \ Pong），但在受支持的环境中，它通常有助于加速收敛，因为回合变短了。\n\n- 在游戏开始时执行随机数量（多达 30 次）的 No-op 操作（无操作操作）。这可以跳过某些\
  \ Atari 游戏中对游戏没有意义的引导或解释性屏幕。\n\n- 每隔 *K* 步选择一次动作，其中 *K* 的值通常为 3 或 4。中间的帧简单地重复所选动作。这可以显著提高训练速度，因为神经网络处理一个帧是一项计算密集型操作，而连续帧之间的区别通常很小。\n\
  \n- 提取最后两个帧的最大像素值（亮度或对比度）作为观测。在某些 Atari 游戏中，由于技术限制，存在闪烁效果（一个帧内只能显示有限数量的精灵）。对于人类来说，这种快速变化是不可察觉的。\n\
  \n- 在游戏开始时按下火射键。在某些游戏（如 Breakout）中，这是启动游戏的必要。在 Pong 等环境中，如果不按键，智能体无法启动。\n\n- 将所有观测转换为灰度。这使得输入通道从\
  \ 3 (RGB) 减少到 1，减少了计算开销。\n\n- 将帧缩放到固定大小（例如 84x84 像素）。这确保了神经网络的输入格式保持一致。\n\n- 将像素值归一化到特定范围（例如\
  \ [0, 1] 或 [-1, 1]）。这有助于训练的稳定性。\n\n现在来看 `Chapter06/lib/wrappers.py` 文件中各种 Wrapper\
  \ 的实现：\n\n```python\nimport cv2\nimport gym\nimport gym.spaces\nimport numpy as\
  \ np\nimport collections\n\nclass FireResetEnv(gym.Wrapper):\n    def __init__(self,\
  \ env=None):\n        super(FireResetEnv, self).__init__(env)\n        assert env.unwrapped.get_action_meanings()[1]\
  \ == 'FIRE'\n        assert len(env.unwrapped.get_action_meanings()) >= 3\n\n  \
  \  def step(self, action):\n        return self.env.step(action)\n\n    def reset(self):\n\
  \        self.env.reset()\n        obs, _, done, _ = self.env.step(1)\n        if\
  \ done:\n            self.env.reset()\n        obs, _, done, _ = self.env.step(2)\n\
  \        if done:\n            self.env.reset()\n        return obs\n```\n\n上面的\
  \ Wrapper 在需要的环境中按下火射键。此外，该 Wrapper 区分检查了某些游戏的特殊情况：\n\n```python\nclass MaxAndSkipEnv(gym.Wrapper):\n\
  \    def __init__(self, env=None, skip=4):\n        super(MaxAndSkipEnv, self).__init__(env)\n\
  \        self._obs_buffer = collections.deque(maxlen=2)\n        self._skip = skip\n\
  \n    def step(self, action):\n        total_reward = 0.0\n        done = None\n\
  \        for _ in range(self._skip):\n            obs, reward, done, info = self.env.step(action)\n\
  \            self._obs_buffer.append(obs)\n            total_reward += reward\n\
  \            if done:\n                break\n        max_frame = np.max(np.stack(self._obs_buffer),axis=0)\n\
  \        return max_frame, total_reward, done, info\n\n    def _reset(self):\n \
  \       self._obs_buffer.clear()\n        obs = self.env.reset()\n        self._obs_buffer.append(obs)\n\
  \        return obs\n```\n\n\n\n\n\n```python\nclass ProcessFrame84(gym.ObservationWrapper):\n\
  \    def __init__(self, env=None):\n        super(ProcessFrame84, self).__init__(env)\n\
  \        self.observation_space = gym.spaces.Box(low=0,\n                 high=255,\
  \ shape=(84, 84, 1), dtype=np.uint8)\n\n    def observation(self, obs):\n      \
  \  return ProcessFrame84.process(obs)\n\n    @staticmethod\n    def process(frame):\n\
  \        if frame.size == 210 * 160 * 3:\n            img = np.reshape(frame,\n\
  \                            [210, 160, 3]).astype(np.float32)\n        elif frame.size\
  \ == 250 * 160 * 3:\n            img = np.reshape(frame,\n                     \
  \       [250, 160, 3]).astype(np.float32)\n        else:\n            assert False,\
  \ \"Unbekannte Auflösung.\"\n        img = img[:, :, 0] * 0.299 + img[:, :, 1] *\
  \ 0.587 +\n              img[:, :, 2] * 0.114\n        resized_screen = cv2.resize(img,\
  \ (84, 110),\n                         interpolation=cv2.INTER_AREA)\n        x_t\
  \ = resized_screen[18:102, :]\n        x_t = np.reshape(x_t, [84, 84, 1])\n    \
  \    return x_t.astype(np.uint8)\n```\n\n此 Wrapper 将模拟器的输入观测值（通常分辨率为 210 × 160 像素并具有\
  \ RGB 颜色通道）转换为 84 × 84 像素的灰度图。为此使用了了一种色度灰度转换，它比简单的颜色通道平均值更接近人类的色彩感知。随后，对图像进行缩放并裁剪顶部底部。\n\
  \n```python\nclass BufferWrapper(gym.ObservationWrapper):\n    def __init__(self,\
  \ env, n_steps, dtype=np.float32):\n        super(BufferWrapper, self).__init__(env)\n\
  \        self.dtype = dtype\n        old_space = env.observation_space\n       \
  \ self.observation_space =\n                 gym.spaces.Box(old_space.low.repeat(n_steps,\n\
  \                 axis=0), old_space.high.repeat(n_steps,\n                 axis=0),\
  \ dtype=dtype)\n\n    def reset(self):\n        self.buffer = np.zeros_like(\n \
  \           self.observation_space.low, dtype=self.dtype)\n        return self.observation(self.env.reset())\n\
  \n    def observation(self, observation):\n        self.buffer[:-1] = self.buffer[1:]\n\
  \        self.buffer[-1] = observation\n        return self.buffer\n```\n\n该类沿第一维度生成连续帧的堆栈并将其作为观测值返回。其目的是为网络提供关于物体动态特征的信息，例如\
  \ Pong 中球的速度和运动方向，或者对手的移动。这些是单张图像无法提取的重要信息。\n\n```python\nclass ImageToTorch(gym.ObservationWrapper):\n\
  \    def __init__(self, env):\n        super(ImageToTorch, self).__init__(env)\n\
  \        old_shape = self.observation_space.shape\n        new_shape =\n       \
  \         (old_shape[-1], old_shape[0], old_shape[1])\n        self.observation_space\
  \ = gym.spaces.Box(low=0.0,\n                high=1.0, shape=new_shape, dtype=np.float32)\n\
  \n    def observation(self, observation):\n        return np.moveaxis(observation,\
  \ 2, 0)\n```\n\n这个简单的 Wrapper 将观测值的格式从 HWC 格式（高度、宽度、颜色通道）更改为 PyTorch 需要的 CHW 格式（颜色通道、高度、宽度）。张量的最后一个维是颜色通道，但\
  \ PyTorch 的卷积层期望通道位于第一维。\n\n```python\nclass ScaledFloatFrame(gym.ObservationWrapper):\n\
  \    def observation(self, obs):\n        return np.array(obs).astype(np.float32)\
  \ / 255.0\n```\n\n该库中的最后一个 Wrapper 将观测数据从字节转换为浮点数，并将像素值缩缩到 [0,0 ... 1,0] 范围内。\n\n\
  ```python\ndef make_env(env_name):\n       env = gym.make(env_name)\n       env\
  \ = MaxAndSkipEnv(env)\n       env = FireResetEnv(env)\n       env = ProcessFrame84(env)\n\
  \       env = ImageToTorch(env)\n       env = BufferWrapper(env, 4)\n       return\
  \ ScaledFloatFrame(env)\n```\n\n文件的末尾有一个简单的函数，用于根据指定名称创建环境并对其应用所有必要的 Wrapper。关于\
  \ Wrapper 的介绍就此结束，我们来看模型。\n\n### 6.4.2 DQN 模型\n\n在《Nature》上发表的模型包含三个卷积层，后面跟着两个全连接层。所有层之间都通过\
  \ ReLU 非线性函数隔开。模型的输出是环境中所有可用动作的 Q 值——不应用非线性函数，因为 Q 值可以取任何值。在一次网络前传播中计算所有 Q 值的方法，比单独处理\
  \ `Q(s, a)` 并向网络提供观测值和动作以获取动作值要快得多。\n\n你可以在 `Chapter06/lib/dqn_model.py` 文件中找到模型代码：\n\
  \n```python\nimport torch\nimport torch.nn as nn\nimport numpy as np\n\nclass DQN(nn.Module):\n\
  \    def __init__(self, input_shape, n_actions):\n        super(DQN, self).__init__()\n\
  \n        self.conv = nn.Sequential(\n            nn.Conv2d(input_shape[0], 32,\
  \ kernel_size=8,\n                                               stride=4),\n  \
  \          nn.ReLU(),\n            nn.Conv2d(32, 64, kernel_size=4, stride=2),\n\
  \            nn.ReLU(),\n            nn.Conv2d(64, 64, kernel_size=3, stride=1),\n\
  \            nn.ReLU()\n        )\n\n        conv_out_size = self._get_conv_out(input_shape)\n\
  \        self.fc = nn.Sequential(\n            nn.Linear(conv_out_size, 512),\n\
  \            nn.ReLU(),\n            nn.Linear(512, n_actions)\n        )\n\n  \
  \  def _get_conv_out(self, shape):\n        o = self.conv(torch.zeros(1, *shape))\n\
  \        return int(np.prod(o.size()))\n\n    def forward(self, x):\n        conv_out\
  \ = self.conv(x).view(x.size()[0], -1)\n        return self.fc(conv_out)\n```\n\n\
  \n\n\n转换的实现分为两个步骤。首先，我们将卷积层应用到输入上，并获得一个 4D 张量作为输出，该张量被转换为一个包含两个组件的对象：批次大小（Batch\
  \ size）和一个长数值向量，该向量包含了卷积层为该批次输入提供的的所有参数。为此使用了张量的 `view()` 函数，它将单个维度的值设置为 -1，作为其他参数的`通配符`。例如，如果存在一个格式为\
  \ `(2, 3, 4)` 的张量 `T`（一个包含 24 个元素的 3D 张量），我们可以通过 `T.view(6, 4)` 将其转换为一个具有六行四列的 2D\
  \ 张量。此操作不会创建新对象，也不会在内存中移动数据，它仅仅改变了张量的格式。相同的结果也可以通过 `T.view(-1, 4)` 或 `T.view(6,\
  \ -1)` 获得，这在张量的第一维包含批次大小时非常实用。最后，转换后的 2D 张量被传递给全连接层，以获得批次输入的 Q 值。\n\n### 6.4.3 训练\n\
  \n第三个模块包含带有经验值的回放池（Replay Buffer）、智能体以及训练循环本身。在处理代码之前，对训练超参数进行一点说明。DeepMind 的《Nature》文章包含一张表格，列出了训练所有所研究的\
  \ 49 个 Atari 游戏时使用的超参数细节。DeepMind 始终使用相同的参数（但为每个游戏训练了独立的模型）。团队借此证明他们的方法足够稳健，仅需一种模型架构和一组超参数就能解决许多具有不同复杂度、动作空间和奖励不断变化的游戏。而我们的目标要谦逊得多：我们只想解决\
  \ Pong 游戏。\n\n与其他 Atari 游戏相比，Pong 相当简单直接，因此为了我们的任务使用文章中的超参数就大材小用了。为了在所有 49 个游戏中获得最佳结果，DeepMind\
  \ 使用了一个包含百万次观测的回放池，它占据了约 20 GB 的 RAM，并且从环境中需要大量的示例。\n\n使用的逐渐减小的 epsilon 值对于单个 Pong\
  \ 游戏来说也不特别适用。DeepMind 在训练时，让 epsilon 值在获取第一百万帧期间从 1.0 线性下降到 0.1。我自己的实验表明，在前 150,000\
  \ 帧期间让 epsilon 下降后不再更改是明智的。较小的回放池也足够：10,000 次转换就足够。\n\n在下面的示例中，我我的参数。它们与文章中的参数不同，但使得解决\
  \ Pong 的速度快了十倍。以下版本在 GeForce GTX 1080 Ti 上大约需要一到两小时收敛（平均 19 分），而使用 DeepMind 的超参数则需要一天。这种速度增长自然是针对特定环境的微调，这在其他游戏中可能会损害泛化性。尝试其他参数或其他\
  \ Atari 游戏吧。\n\n```\nfrom lib import wrappers\nfrom lib import dqn_model\n\nimport\
  \ argparse\nimport time\nimport numpy as np\nimport collections\n\nimport torch\n\
  import torch.nn as nn\nimport torch.optim as optim\n\nfrom tensorboard import SummaryWriter\n\
  ```\n\n首先，我们导入所需的模块并定义超参数。\n\n```\nDEFAULT_ENV_NAME = \"PongNoFrameskip-v4\"\nMEAN_REWARD_BOUND\
  \ = 19.0\n```\n\n第一个值指定了训练的标准环境，第二个值是训练结束时最后 100 个回合的奖励边界。这些是你可以修改的标准值。\n\n```\n\
  GAMMA = 0.99\nBATCH_SIZE = 32\nREPLAY_SIZE = 10000\nREPLAY_START_SIZE = 10000\n\
  LEARNING_RATE = 1e-4\nSYNC_TARGET_FRAMES = 1000\n```\n\n这些参数规定了：\n- 用于 Bellman 近似计算的\
  \ `GAMMA` 值\n- `BATCH_SIZE`：从回放池提取的批次大小\n- `REPLAY_SIZE`：池的最大容量\n- `REPLAY_START_SIZE`：我们在填充回放池之前等待的帧数\n\
  - `LEARNING_RATE`：本示例中使用的 Adam 优化器的学习率\n- `SYNC_TARGET_FRAMES`：同步目标帧的频率\n\n```\n\
  EPSILON_DECAY_FRAME = 150000\nEPSILON_START = 1.0\nEPSILON_FINAL = 0.01\n```\n\n\
  最后的参数涉及 epsilon 的下降。在训练开始时，我们将 epsilon 赋值为 1.0，以便回放池填充期间执行随机动作。在 DeepMind 的文章中使用了类似的方法，直到在百万帧后达到\
  \ 0.01。这允许消除环境中环境中连续步骤之间的相关性。\n\n```\nExperience = collections.namedtuple('Experience',\n\
  \             field_names=['state', 'action', 'reward',\n                      \
  \    'done', 'new_state'])\n\nclass ExperienceBuffer:\n    def __init__(self, capacity):\n\
  \        self.buffer = collections.deque(maxlen=capacity)\n\n    def __len__(self):\n\
  \        return len(self.buffer)\n\n    def append(self, experience):\n        self.buffer.append(experience)\n\
  \n    def sample(self, batch_size):\n        indices = np.random.choice(len(self.buffer),\n\
  \                  batch_size, replace=False)\n        states, actions, rewards,\
  \ dones, next_states =\n                 zip(*[self.buffer[idx] for idx in indices])\n\
  \        return np.array(states), np.array(actions),\n               np.array(rewards,\
  \ dtype=np.float32),\n               np.array(dones, dtype=np.uint8),\n        \
  \       np.array(next_states)\n```\n\n回放池的大部分代码非常简单：它本质上是利用 `deque` 类来管理缓冲区。我们从池中提取随机转换，在这种情况下是\
  \ 10,000 次。\n\n\n\n\n```python\n@torch.no_grad()\ndef play_step(self, net, epsilon=0.0,\
  \ device=\"cpu\"):\n    done_reward = None\n\n    if np.random.random() < epsilon:\n\
  \        action = env.action_space.sample()\n    else:\n        state_a = np.array([self.state],\
  \ copy=False)\n        state_v = torch.tensor(state_a).to(device)\n        q_vals_v\
  \ = net(state_v)\n        _, act_v = torch.max(q_vals_v, dim=1)\n        action\
  \ = int(act_v.item())\n```\n\n代理的主方法在环境环境中执行一步，并将结果存储在回放缓冲区（Replay Buffer）中。在此之前，必须选择一个动作。以\
  \ epsilon（作为参数传递）的概率，我们执行随机动作。否则，我们使用上一个模型来获取所有可能动作的 Q 值，并选择最佳动作。\n\n```python\n\
  new_state, reward, is_done, _ = self.env.step(action)\nself.total_reward += reward\n\
  \nexp = Experience(self.state, action, reward,\n                 is_done, new_state)\n\
  self.exp_buffer.append(exp)\nself.state = new_state\nif is_done:\n    done_reward\
  \ = self.total_reward\n    self._reset()\nreturn done_reward\n```\n\n选择动作后，我们将其传递给环境以获取下一个观测和奖励。我们存储这些数据并在需要处理回合的结束。如果我们通过这一步达到了回合的结束，该函数的返回值为收集的总奖励，否则为\
  \ `None`。\n\n现在我们来看训练模块的最后一个函数，它计算所提取样本的损失。该函数的编写形式通过向量操作处理 Batch 中的所有示例，最大限度地利用了\
  \ GPU 的并行数据处理能力。因此，它比在循环中遍历 Batch 更难理解。但这种优化是值得的：并发版本比迭代循环快一倍。\n\n回顾一下，这里是我们需要计算的表达式：针对回合内的步骤使用\
  \ ![\\[Bild\\]](Images/06_11.jpg)，针对回合的最后一步使用 ![\\[Bild\\]](Images/06_05.jpg)。\n\
  \n```python\ndef calc_loss(batch, net, tgt_net, device=\"cpu\"):\n    states, actions,\
  \ rewards, dones, next_states = batch\n```\n\n我们作为参数传递了由数组元组组成的 Batch（已由回放缓冲区中的\
  \ `sample()` 方法重新排排）、待训练网络以及定期与训练好的网络同步的目标网络（`tgt_net`）。\n\n作为参数 `net` 传递的第一个模型用于计算梯度，第二个模型（参数\
  \ `tgt_net`）用于计算后继状态的值。后者不应该影响梯度。为了实现这一点，我们使用了 PyTorch 张量的 `detach()` 函数，这防止了梯度影响到目标网络的计算图。该函数在\
  \ 第 3 章、使用 PyTorch 进行深度学习 中进行了描述。\n\n```python\nstates_v = torch.tensor(np.array(\n\
  \    states, copy=False)).to(device)\nnext_states_v = torch.tensor(np.array(\n \
  \   next_states, copy=False)).to(device)\nactions_v = torch.tensor(actions).to(device)\n\
  rewards_v = torch.tensor(rewards).to(device)\ndone_mask = torch.ByteTensor(dones).to(device)\n\
  ```\n\n上述代码将带有 Batch 数据的各种 NumPy 数组“封装”为 PyTorch 张量，如果参数中指定的设备为 CUDA，则会将它们复制到 GPU\
  \ 上。\n\n```python\nstate_action_values = net(states_v).gather(\n    1, actions_v.unsqueeze(-1)).squeeze(-1)\n\
  ```\n\n`state_action_values` 通过 `net(states_v).gather(1, actions_v.unsqueeze(-1)).squeeze(-1)`\
  \ 计算得出。（注：原文中该句存在大量重复，此处已按要求去重）。\n\n\n\n\n我们使用所需的包装器（Wrappers）创建环境、我们将训练的神经网络以及具有相同架构的目标网络。它们首先通过不同的随机权重初始化，但这并不重要，因为我们每隔\
  \ 1000 帧（Frames）就会同步一次，这大约相当于 Pong 回合的持续。\n\n```\nwriter = SummaryWriter(comment=\"\
  -\" + args.env)\nprint(net)\n\nbuffer = ExperienceBuffer(REPLAY_SIZE)\nagent = Agent(env,\
  \ buffer)\nepsilon = EPSILON_START\n```\n\n随后，我们创建一个所需大小的回放缓冲区（Replay Buffer）并将其传递给代理（Agent）。`epsilon`\
  \ 获取初始值 1.0，但在每次迭代中都会减少。\n\n```\noptimizer = optim.Adam(net.parameters(), lr=LEARNING_RATE)\n\
  total_rewards = []\nframe_idx = 0\nts_frame = 0\nts = time.time()\nbest_mean_reward\
  \ = None\n```\n\n在训练循环开始之前，我们创建一个优化器、一个存储完整回合奖励的缓冲区、一个帧计数器以及用于记录速度和最佳平均奖励的各种变量。当最佳平均奖励达到新高值时，我们将模型保存到文件中。\n\
  \n```\nwhile True:\n    frame_idx += 1\n    epsilon = max(EPSILON_FINAL, EPSILON_START\
  \ - frame_idx /\n                                   EPSILON_DECAY_LAST_FRAME)\n\
  ```\n\n在训练循环开始，我们计算完成的迭代次数并减少 `epsilon`。`epsilon` 的值在指定的帧数（`EPSILON_DECAY_LAST_FRAME`\
  \ 值为 150,000）内线性下降，之后保持 `EPSILON_FINAL=0.01` 的值。\n\n```\nreward = agent.play_step(net,\
  \ epsilon, device=device)\nif reward is not None:\n    total_rewards.append(reward)\n\
  \    speed = (frame_idx - ts_frame) / (time.time() - ts)\n    ts_frame = frame_idx\n\
  \    ts = time.time()\n    m_reward = np.mean(total_rewards[-100:])\n    print(\"\
  %d: done %d games, reward %.3f, \"\n          \"eps %.2f, speed %.2f f/s\" % (\n\
  \        frame_idx, len(total_rewards), m_reward,\n        epsilon, speed\n    \
  \ ))\n    writer.add_scalar(\"epsilon\", epsilon, frame_idx)\n    writer.add_scalar(\"\
  speed\", speed, frame_idx)\n    writer.add_scalar(\"reward_100\", m_reward, frame_idx)\n\
  \    writer.add_scalar(\"reward\", reward, frame_idx)\n```\n\n在此代码段中，我们指示代理在环境中执行单步操作（使用我们当前的网络和\
  \ `epsilon` 值）。只有当是回合的最后一步时，函数才会返回一个非 `None` 的结果。在这种情况下，我们计算多个值并将其输出到控制台和 TensorBoard：\n\
  \n- 每秒处理的帧数（速度）\n- 完成的回合数\n- 最后 100 个回合的平均奖励\n- `epsilon` 的当前值\n\n```\nif best_m_reward\
  \ is None or best_m_reward < m_reward:\n    torch.save(net.state_dict(), args.env\
  \ +\n               \"-best_%.0f.dat\" % m_reward)\n    if best_m_reward is not\
  \ None:\n        print(\"Beste durchschnittliche Belohnung aktualisiert\n      \
  \         %.3f -> %.3f, Modell gespeichert\" %\n              (best_m_reward, m_reward))\n\
  \    best_m_reward = m_reward\nif m_reward > MEAN_REWARD_BOUND:\n    print(\"Gelöst\
  \ nach %d Frames!\" % frame_idx)\n    break\n```\n\n如果最后 100 个回合的平均奖励达到最大，我们将输出并保存模型参数。如果平均奖励超过指定的界限，我们将停止训练。对于\
  \ Pong，该界限为 19.0，这意味着在 21 场可能的比赛中赢了超过 19 场。\n\n```\nif len(buffer) < REPLAY_START_SIZE:\n\
  \    continue\nif frame_idx % SYNC_TARGET_FRAMES == 0:\n    tgt_net.load_state_dict(net.state_dict())\n\
  ```\n\n在这里我们检查训练缓冲区是否足够大。首先，我们应该等待有足够的数据后再开始。在这种情况下，即 10,000 次转换（transitions）。该条件在每经过\
  \ `SYNC_TARGET_FRAMES`（默认值为 1,000）帧时，将主网络的参数与目标网络同步。\n\n```\noptimizer.zero_grad()\n\
  batch = buffer.sample(BATCH_SIZE)\nloss_t = calc_loss(batch, net, tgt_net, device=device)\n\
  loss_t.backward()\noptimizer.step()\n```\n\n训练循环的最后部分非常简单，但执行时间最长：我们将梯度初始化为零，从回放缓冲区提取数据，计算损失，并执行优化步骤以最小化损失。\n\
  \n### 6.4 执行与性能\n\n这个示例非常消耗资源。对于 Pong，它大约需要 400,000 帧才能获得 17 的平均奖励（这意味着赢了超过 80%\
  \ 的比赛）。要从 17 提高到 19，还需要相当数量的帧，因为在学习过程中会出现饱和，这使得模型学习变得更加困难。因此，完整的训练需要一百万帧。使用 GTX1080\
  \ Ti，我能达到每秒约 120 帧，而在 CPU 上速度要小得多：大约达到每秒 9 帧，训练大约持续两天。但请记住，这些值适用于 Pong，Pong 是相对容易解决的。其他游戏可能需要数百万帧和大\
  \ 100 倍的回放缓冲区。\n\n我们考虑了自 2015 年以来人员开发的各种方法，这些方法既能提高训练速度又能提高数据效率。**图 6.4** 显示了最后\
  \ 100 个回合平均奖励的变化趋势。\n\n\n\n在前的 10,000 步中，速度非常快，因为还没有进行训练，而训练是代码中计算密集型操作。在 10,000\
  \ 步之后，训练开始，速度显著下降。\n\n在几百局游戏后，我们的 `DQN` 应该逐渐学会如何在 21 局游戏中赢过一局或两局。由于 `epsilon` 值的减小，速度有所下降。我们不仅在训练模型，还必须探索环境。\n\
