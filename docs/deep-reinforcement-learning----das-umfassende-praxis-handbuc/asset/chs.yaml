  ### 17.8 总结\n\n在本章中，我们概述了使用 RL 方法的连续控制任务这一非常有趣的领域，并将三种不同的算法应用于四足机器人任务。在我们的训练中，我们使用了仿真器，但也有由\
  \ Ghost Robotics 公司制造的这种机器人的真实模型。（观看 YouTube 上的酷视频：[`youtu.be/bnKOeMoibLg`](https://youtu.be/bnKOeMoibLg)。）我们将三种训练方法应用于一个环境中：`A2C`、`DDPG`\
  \ 和（结果最好的）`D4PG`。\n\n在下一章中，我们将涉及机器人领域中的强化学习。\n\n# 第 18 章：机器人领域中的 RL\n\n本章与本书的其他章节相比有些与常，原因如下：\n\
  \n* 花费了近四个月的时间来收集所有材料、执行实验、编写示例等。\n* 仅在本章中，我们将超越仿真环境，进入物理世界。\n* 在本章中，我们将开发一个由由易于获取的廉价组件组成的小型机器人，并通过\
  \ RL 方法进行控制。\n\n这个主题如此广泛且引人入胜，由于许多原因，在单本书中穷尽讨论是不可能的——更说在一个单短的章节内了。因此，本章完全不要求完整描述机器人技术。它仅仅是一个简短的介绍，旨在展示使用商业组件可以实现什么，并为未来的自己的实验或研究提供道路。此外，我并不是机器人专家，也从未在该领域工作过，因此我非常欢迎您的反馈。\n\
  \n### 18.1 机器人与机器人技术\n\n我相信你知道“机器人”一词的意思，并且在现实生活中，当然在科幻电影中遇到过机器人。真正的机器人被用于许多领域：工业、军事（如果你从未看过\
  \ Boston Dynamics 的视频，你应该去看看）、农业、医学以及家居环境。自动吸尘器、咖啡机、3D 打印机等许多应用都是通过逻辑控制的专用设备。通常，这些机器人具有我们将研究的特征。这种分类方法并非完美。正如如此，有很多“异常值”，它们很难被称为机器人。\n\
  \n首先，机器人通过任何传感器或其他通道与外部世界连接。没有这些连接，机器人就是盲目的，没有用处，因为无法以适当的方式对环境中的事件做出反应。有很多传感器可以非常简单但也极其复杂且昂贵。以下列表只是几个例子：\n\
  \n* **具有两种状态的简单开关：** 这在简单情况下是检测物理接触的常用方案。例如在 3D 打印机中通常有一个限位开关（开关），当移动部件超过特定点时会触发。内部软件，即固件（firmware），会对此做出反应，例如停止电机。\n\
  \n* **距离传感器：** 它们使用超声波或激光测量与物体距离。吸尘机器人通常具有防掉落功能，以防止设备掉楼梯。这是一个测量机器人下方地面距离的传感器。如果这个距离突然变大，机器人就会意识到向前移动是危险的，并对此做出反应。\n\
  \n\n\n\n### 摄像头\n摄像头可以像智能手机一样传输视频，但视频流通常需要由机器人的软件进行处理，以检测如角或边缘等物体。视频处理的计算量相对较大，因此会使用嵌入式\
  \ GPU 或其他专用硬件来加速神经网络的运行。摄像头成本较低，且能提供关于环境的丰富信息。\n\n### 物理值传感器\n这一类别包括加速度计、数字陀螺仪（陀螺仪）、气压计、温度计等。它们测量机器人周围的物理参数，通常非常紧凑、廉价且易于使用。所有复杂的细节通常隐藏在一个微小的芯片中，该芯片通过某种通信协议提供测量值。此类传感器在爱好者中非常受欢迎，也广泛用于许多玩具、消费电子设备和\
  \ DIY（自己动手做）项目。例如，无人机可以通过气压计测量飞行高度，通过磁力计确定水平方向，并通过 GPS 接收器确定其位置。\n\n这个列表还可以继续下去，但我认为你现在已经理解了这一概念。\n\
  \n### 对外部世界的影响\n机器人的第二个共同特征是它们通常能够影响外部世界。这可能是一些显而易见的操作，比如启动电机或让灯泡闪烁，也可能是一些非常复杂的操作，例如将天线对准地球，以传输距离达\
  \ 200 亿公里的无线信号，正如 NASA 的旅行者 1 号探测器经常做的那样。在这一类别中，机器人影响其环境有多种方法。以下是一些例子：\n\n*   各种类型的电机和执行器，例如非常廉价的小型伺服电机（如\
  \ 3D 打印机中的步进电机），或者用于工业机器人的极其复杂且精确的执行器。\n*   声音和光的产生，如闪烁的 LED 或触发蜂鸣器。通常其目的是将人类的注意力引导到某个状态上。由于\
  \ LED 属于最易使用的外部设备之一，它们在爱好者电子项目中经常被用于“你好，世界！”应用。\n*   加热器、水泵、喷嘴或打印机。\n\n### 软件与控制\n\
  第三类特征类别涉及将传感器和执行器连接起来的软件，以解决特定任务。机器人的理念是承担人类某些任务。它们可以被用于完全琐碎的任务，例如根据设定的时间表放下窗帘，也可以用于极其复杂的任务，如火星探测器“好奇号”的情况。根据\
  \ Rob Manning 和 William L. Simon 写的一本非常棒的书《火星探测器好奇号》，由于无线信号的延迟，机器人无法完全从地球进行控制。相反，任务控制中心每天会创建一个极其复杂的半自动程序并将其传输给机器人。在执行程序时，机器人拥有特定的决策选择，并会考虑环境条件。\n\
  \n在自动控制出现之前，人类必须根据自己的知识和目标操作杠杆并旋转按钮。这些活动被自动化软件取代，将人类从必须亲手影响一切的需要中解放出来。这种观点可能与常人的理解存在冲突。\n\
  \n\n\n\n这听起来非常有吸引力，特别是当我们考虑通常的强化学习（RL）任务时：我们拥有传感器观测数据，可以通过执行器执行动作，并且我们必须定义某种通用的奖励，这种奖励对于要解决的任务是有意义的。所有这些都由一个强化学习方法提供，然后大功告成！当然，我极大地简化了整个过程；其实有许多细节需要注意，但整体概念应该是显而易见的。\n\
  \n现在，让我们攻克本章的目标：将强化学习方法应用于简单的机器人任务上。\n\n## 18.1.2 硬件\n\n本书的目标是让 `RL` 方法被广泛的业爱好者、狂热者和研究人员所接触。这决定了示例的选择、它们的复杂性、软件需求（例如，使用开源的\
  \ `PyBullet` 而不是商业的 `MuJoCo`）以及影响书籍内容的其他因素。虽然大多数示例需要 `GPU`，但它们并不需要极端的计算性能。云端的一个单个\
