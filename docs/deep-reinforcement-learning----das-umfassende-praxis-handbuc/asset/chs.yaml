  \ HPC 和非 HPC 系统方面拥有丰富经验，并擅长用简单的语言和生动的例子来解释复杂的问题。目前，他正致力于相关领域的研究。\n\nMaxim 与家人生活在莫斯科。编写并出版这本书是一项挑战，感谢他的妻子\
  \ Olga、孩子们 Ksenia 和 Fedor 的耐心与支持。\n\n# 关于校对\n\n**Mikhail Yurushkins** 是罗斯托夫国立大学的讲师，研究领域为高性能计算和编译器开发。他在机器学习领域拥有多年经验。他的研究兴趣是机器学习、深度学习。他还关注计算机视觉和自然语言处理。\n\
  \n**Per-Arne Andersen** 是挪威 Agder 大学的博士生，专注于强化学习。他撰写了许多关于强化学习的技术论文，并被英国计算机学会评为优秀学生。Per-Arne\
  \ 自 2012 年起一直是该领域的专家。他目前的的研究兴趣是机器学习、深度学习。\n\n**Sergey Kolesnikov** 是工业界和学术界的研究人员，在机器学习、深度学习和强化学习方面拥有五多年经验。他目前致力于用于计算机视觉、自然语言处理和推荐系统的应用，并参与强化学习的研究。他是神经信息处理大会（NeurIPS）的竞赛获奖者，也是开源的支持者。此外，他还是\
  \ PyTorch 环境的开发者。\n\n**Friedhelm Schwenker** 是某某大学的应用科学教授。他在应用数学领域获得博士学位，并在机器学习领域从事研究和教学多年。他的研究领域是模式识别、数据挖掘以及基于神经网络的机器学习。近期，他还关注情感计算中的应用。他主编了\
  \ 19 本论文集和特刊，并发表了 200 多篇期刊和会议论文。\n\n# 引言\n\n\n\n\n\n本书旨在解决关于强化学习（RL）方法和策略的缺乏实践型和结构化信息的问题。全球范围内存在着广泛的科研活动，几乎每天都有新论文发表。诸如\
  \ NeurIPS（神经信息处理系统大会）或 ICLR（学习表示国际会议）等深度学习会议的大部分内容都致力于 RL 方法。目前有多个大型研究小组，他们专注于 RL\
  \  方法在机器人技术、医学和多智能体系统中的应用。\n\n虽然最新研究结果的信息在处处可见，但它们过于专业和抽象，以至于人们在不付出巨大努力的情况下无法理解。在\
  \ RL 应用的实践方面，情况更为糟糕，因为人们往往不清楚如何从研究论文中抽象的数学描述转化为能够真正解决任务的运行实现。\n\n这使得对该领域感兴趣的人难以直接理解文章或会议演讲中介绍的方法和概念。虽然有一些关于各种\
  \ RL 方法的非常优秀的博客文章，它们通过运行的示例进行了说明，但博客文章格式的局限性导致作者在不展示完整背景以及不同方法之间关系的情况下，无法描述超过一两个两个方法。本书是我尝试解决问题的尝试。\n\
  \n## 方法\n\n书的另一个方面是面向实践。所有方法都在不同的环境中实现，范围从完全简单到相当复杂不等。我尝试将示例设计得易于理解，这得益于 `PyTorch`\
  \ 的强大。示例的复杂性和要求针对那些无法获得超大规模算力（如 `GPU` 集群或高性能工作站）的 RL 兴趣者。通过这种方式，我希望 RL 这一非常有趣且令人兴奋的领域能够被更广泛的读者接触，而不仅仅是研究小组或大型人工智能公司。然而，这仍然涉及深度（Deep`）强化学习，因此建议使用\
  \ GPU。书中约一半的示例在 GPU 上运行会大获益。\n\n在强化学习中，通常使用中等规模的环境，例如 Atari 游戏或连续控制任务，但书中也包含了一些章节（`第\
  \ 10 章`、`第 14 章`、`第 15 章`、`第 16 章` 和 `第 18 章`），在其中描述了较大的项目，以说明 RL 方法如何应用于更复杂的环境和任务。然而，这些示例并非实践中的完整项目（否则它们将需要单独的一本书），而是更全面的任务，说明了\
  \ RL 范式在常规基准（Benchmarks）之外如何应用。\n\n在书的前三个部分的示例中，我尝试展示完整的源代码，以便示例具有独立性。在某些情况下，这会导致部分代码的重复（例如，大多数方法的训练循环是相似的），但我认为，直接跳转到感兴趣的方法比某些重复更重要。书中所有的示例都可以在\
  \ Github（`https://github.com/PacktPublishing/Deep-Reinforcement-Learning-Hands-On-Second-Edition`）上找到，欢迎您进行实验并贡献。\n\
  \n## 本书适合谁？\n\n本书主要面向那些拥有机器学习（Machine Learning）知识并对强化学习（Reinforcement Learning）感兴趣的人士。读者应该熟悉\
