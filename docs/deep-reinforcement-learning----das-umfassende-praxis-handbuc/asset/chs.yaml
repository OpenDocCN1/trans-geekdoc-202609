  **图 25.10:** 训练期间鹿网络（左）和老虎网络（右）的损失值\n\n![\\[图片\\]](Images/25_11.jpg)\n**图 25.11:**\
  \ 鹿（左）和老虎（右）的测试奖励\n\n如你从图 25.11 中看到的，鹿比老虎要成功得多。这并不意外，因为它们的速度一样，鹿只需要不断移动并等待老虎饿死即可。你可以通过增加老虎的速度或增加墙的数量来对环境设置进行实验。以下是一些模型记录和得分证明了这一点。\n\
