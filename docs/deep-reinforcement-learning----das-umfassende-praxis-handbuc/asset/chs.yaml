  \n环境通过 `libcube/cubes/_env.py` 文件中的 `CubeEnv` 类定义。\n\n```python\nclass CubeEnv:\n\
  \    def __init__(self, name, state_type, initial_state, is_goal, action_enum, transform_func,\
  \ inverse_func, render_func, encoded_shape, encode_func):\n        self.name = name\n\
  \        self._state_type = state_type\n        self.initial_state = initial_state\n\
  \        self._is_goal = is_goal\n        self.action_enum = action_enum\n     \
  \   self._transform_func = transform_func\n        self._inverse_func = inverse_func\n\
  \        self._render_func = render_func\n        self.encoded_shape = encoded_shape\n\
  \        self._encode_func = encode_func\n\n    def __repr__(self):\n        return\
  \ \"CubeEnv(%r)\" % self.name\n\n    def is_goal(self, state):\n        return self._is_goal(state)\n\
  \n    def transform(self, state, action):\n        return self._transform_func(state,\
  \ action)\n\n    def inverse_action(self, action):\n        return self._inverse_func(action)\n\
  \n    def render(self, state):\n        return self._render_func(state)\n\n    def\
  \ is_state(self, state):\n        return isinstance(state, self._state_type)\n\n\
  \    def encode_inplace(self, target, state):\n        return self._encode_func(target,\
  \ state)\n```\n\n正如您所看到的，魔方环境与 Gym API 并不兼容。我特意这样处理，是为了展示如何超越 Gym 的限制。\n\n`CubeEnv`\
  \ API 的某些方法仅仅是传递给构造函数的包装器。通过这种方式，可以在单独的模块中实现新环境，然后将其注册到环境注册表中，从而为其他代码提供一个统一的接口。\n\
  \n该类的所有其他方法都通过简单的操作提供了扩展的、统一的功能。\n\n\n\n\n```python\ndef sample_action(self, prev_action=None):\n\
  \    while True:\n        res = self.action_enum(\n            random.randrange(len(self.action_enum)))\n\
  \        if prev_action is None or\n                self.inverse_action(res) !=\
  \ prev_action:\n            return res\n```\n\nDiese Methode stellt die Funktionalität\
  \ bereit, eine zufällige Aktion zu erhalten. Wird das Argument `prev_action` übergeben,\
  \ schließen wir die Umkehhraktion von den möglichen Ergebnissen aus, was praktisch\
  \ ist, um die Erzeugung kurzer Schleifen wie beispielsweise `Rr` oder `Ll` zu verhindern.\n\
  \n```python\ndef scramble(self, actions):\n    s = self.initial_state\n    for action\
  \ in actions:\n        s = self.transform(s, action)\n    return s\n```\n\nDie Methode\
  \ `scramble()` wendet die Aktionen in der Liste auf den Originalzustand des Würfels\
  \ an.\n\n```python\ndef scramble_cube(self, scrambles_count,\n                 \
  \ return_inverse=False,\n                  include_initial=False):\n    state =\
  \ self.initial_state\n    result = []\n    if include_initial:\n        assert not\
  \ return_inverse\n        result.append((1, state))\n    prev_action = None\n  \
  \  for depth in range(scrambles_count):\n        action = self.sample_action(prev_action=prev_action)\n\
  \        state = self.transform(state, action)\n        prev_action = action\n \
  \       if return_inverse:\n            inv_action = self.inverse_action(action)\n\
  \            res = (depth+1, state, inv_action)\n        else:\n            res\
  \ = (depth+1, state)\n        result.append(res)\n    return result\n```\n\nDie\
  \ obige Methode ist ziemlich lang und stellt eine Funktionalität bereit, den Würfel\
  \ zufällig zu verdrehen, und gibt alle zwischenzeitlich eingenommenen Zustände zurück.\
  \ Falls das Argument `return_inverse` den Wert `False` hat, gibt die Funktion eine\
  \ Liste von `(depth,` `state)`-Tupeln für jeden Schritt beim Verdrehen zurück. Ist\
  \ das Argument `True`, gibt die Funktion ein Tupel mit drei Werten zurück: `(depth,`\
  \ `state,` `inv_action)`, die unter bestimmten Umständen benötigt werden.\n\n```python\n\
  def explore_state(self, state):\n    res_states, res_flags = [], []\n    for action\
  \ in self.action_enum:\n        new_state = self.transform(state, action)\n    \
  \    is_init = self.is_goal(new_state)\n        res_states.append(new_state)\n \
  \       res_flags.append(is_init)\n    return res_states, res_flags\n```\n\nDie\
  \ Methode `explore_state()` implementiert die Funktionalität für ADI und wendet\
  \ alle Aktionen an, die im angegebenen Zustand des Würfels möglich sind. Das Ergebnis\
  \ ist ein Tupel mit zwei Listen. Die erste enthält die verdrehten Zustände und die\
  \ zweite Flags, die angeben, ob es sich um den Zielzustand handelt.\n\nMit dieser\
  \ generischen Funktionalität kann eine ähnliche Umgebung implement und ohne großen\
  \ Aufwand in die vorhandenen Trainings- und Testmethoden integriert werden. Als\
  \ Beispiele habe ich den 2x2x2- und 3x3x3-Würfel bereitgestellt, die ich bei meinen\
  \ Experimenten verwendet habe. Den Code, den Sie in den Dateien `libcube/cubes/cube22.py`\
  \ und `libcube/cubes/cube33.py` finden, können Sie als Ausgangspunkt für die Implementierung\
  \ eigenen Umgebungen verwenden.\n\nAlle Umgebungen müssen sich registrieren, indem\
  \ eine Instanz der `CubeEnv`-Klasse erzeugt wird, die in der Datei `libcube/cubes/_env.py`\
  \ definierten Funktion `register()` übergeben wird. Der folgende Code stammt dem\
  \ `register()` 模块\n\n...（此处省略了重复的描述，直接根据要求翻译核心逻辑）...\n\n所有环境都必须注册，方法是创建一个 `CubeEnv`\
  \ 类的实例，并将其传递给文件 `libcube/cubes/_env.py` 中定义的 `register()` 函数。以下代码来自 `register()`\
