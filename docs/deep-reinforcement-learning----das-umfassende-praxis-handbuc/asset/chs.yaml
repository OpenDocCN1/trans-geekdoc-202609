  \ 21.6 总结\n\n在本章中，我讨论了为什么在某些情况下使用 $\\epsilon$-Greedy 方法进行探索并不是最佳方案，并考虑了替代方法。探索（Exploration）这个主题要广泛得多，还有许多我没有涉及有趣方法。但我希望你对这些新方法如何工作以及应该如何实现有了整体的印象。\n\
  \n在下一章中，我们将研究现代强化学习（RL）的另一个领域，即基于模型（model-based）的方法。\n\n## 21.7 参考文献\n\n[1] Strehl\
  \ und Littman, *An analysis of model-based Interval Estimation for Markov Decision\
  \ Processes*, 2008: [`www.sciencedirect.com/science/article/pii/S0022000008000767`](https://www.sciencedirect.com/science/article/pii/S0022000008000767)\n\
  \n[2] Meire Fortunato, et al., *Noisy Networks for Exploration* 2017, arxiv: 1706.10295\n\
  \n[3] Georg Ostrovski, et al., *Count-Based Exploration with Neural Density Models*,\
  \ 2017, arxiv:1703.01310v2\n\n[4] Yuri Burda, et al., *Exploration by random network\
  \ distillation*, 2018, arxiv:1810.1294\n\n# 第 22 章：超越无模型方法——想象（Imagination）\n\n\
  基于模型的方法通过在训练期间开发环境模型，能够减少与环境交互的范围。\n\n本章主题包括：\n\n* 强化学习（RL）中基于模型方法的概述\n* DeepMind\
  \ 在论文 [Imagination-Augmented Agents for Deep Reinforcement Learning](https://arxiv.org/abs/1707.06203)](https://arxiv.org/abs/1707.06203))\
  \ 中的实现\n\n## 22.1 基于模型的方法\n\n首先，我们来看之前使用无模型方法与基于模型方法的区别，讨论它们的优缺点以及适用场景。\n\n### 22.1.1\
  \ 基于模型与无模型方法\n\n在 强化 学习方法的分类 节中，我们根据以下标准对 RL 进行分类：\n\n* 基于值或基于策略\n* on-policy 和\
  \ off-policy\n* 无模型和基于模型\n\n对于第一两类，我们考虑了许多例子，但目前都是无模型方法。但这并不意味着无模型方法比其基于模型的方法更好。由于其样本效率，无模型方法被应用于机器人领域。在这里，硬件成本和样本获取的物理限制是考虑的因素。具有许多自由度的机器人很难获得，因此强化学习研究者更多地关注容易获取样本的游戏和其他环境。然而，来自机器人的许多想法已经得到了应用，基于模型的方法很快就会成为关注焦点。\n\
  \n\n\n\n在某种程度上，强化学习（RL）研究也涉及真实世界的模型，例如 `MuJoCo` 或 `PyBullet` 是物理模拟器，它们被用于训练智能体，而无需构建带有执行器、传感器和摄像头的真实机器人。在\
  \ Atari 游戏或赛车模拟器 `TORCS` 中也是如此：我们使用计算机程序对过程进行建模，以便能够快速简单地运行相应的模型。即使是 `CartPole`\
  \ 示例也是对带有杆子的真实小车的非常简化的近似。（顺便提一下，`PyBullet` 和 `MuJoCo` 中都有更真实的 `CartPole` 版本，具有三维运动和更精确的模拟。）\n\
  \n采用基于模型（model-based）而非无模型的方法有两个原因。第一个最重要的一点是对真实环境的依赖程度较低，从而提高了样本效率。如果我们有一个精确的模型，理想情况下，我们可以放弃真实世界，仅使用训练好的模型。在实际应用中，几乎不可能创建一个如此精确的环境模型，但即使是不完美的模型也能显著减少所需的示例数量。\n\
  \n在现实中，例如你不需要对动作有绝对精确的理解（如系鞋带或过马路），但它在规划和预测结果方面很有帮助。\n\n采用基于模型方法的第二个原因是环境模型到其他任务的可迁移性。如果你有一个针对机械手臂良好的模型，就可以将其用于许多不同的任务，而无需从头开始重新训练一切。\n\
  \n关于这些方法有很多细节。本章的目标是为您提供一个概述，并详细研究某项研究论文，该论文试图以巧妙的方式将无模型和基于模型的方法结合。\n\n## 22.2 模型的局限性\n\
  \n基于模型的方法中存在一个严重的问题：如果我们的模型犯错，或者在环境的特定区域太不准确，那么学习到的策略在实践中可能会是完全错误的。为了解决这个问题，有多种方法可用。最直接的方法是改进模型。但这意味着我们需要从环境中获取更多的观测值，而这正是我们想要避免的。环境中的行为越复杂、越非线性，对其进行正确建模就越越困难。\n\
  \n目前已经发现了应对这一问题的方法，例如局部模型方法组，其中一个大的环境模型被多个较小的、专门为特定环境区域定制的模型所取代，然后使用置信区域技巧（Trust-Region\
  \ Tricks）进行训练——就像 `TRPO` 方法一样。\n\n同样有趣的是通过基于模型的路径扩展无模型策略的环境模型。我们不再尝试为环境创建最好的模型，而是为智能体提供额外信息，让它自己决定这些信息在训练过程中是否有用。\n\
  \nDeepMind 通过 `UNREAL` 系统向这一方向迈出了第一步，该系统在 Max Jaderberg、Volodymyr Mnih 等人 2016 年发表的名为\
  \ *Reinforcement Learning with Unsupervised Auxiliary Tasks* 的论文中进行了描述。在这篇文章中，作者在正常训练期间让\
  \ `A3C` 智能体通过无监督学习解决额外的任务。智能体最重要的测试在一个部分可观测的环境中进行，在那个环境中，它的任务是在类似 Doom 的迷宫中获得收集物品或执行其他动作的奖励。\n\
  \n该研究论文方法的新颖之处在于，必须解决额外的任务，这些任务与强化学习方法的常规目标（价值最大化或折扣奖励化）没有关系。这些任务通过观测值进行无监督训练，包括以下内容：\n\
  \n*   预测即时奖励\n*   像素级控制\n*   特征自适应\n\n这些任务与强化学习方法的主要目标没有关系，但它们让 `UNREAL` 能够获得更好的结果。我们在章节中讨论的作品也由\
  \ DeepMind 发布。\n\n## 22.3 想象增强智能体 (Imagination-augmented Agent)\n\n名为 *Imagination-augmented\
  \ Agent* (`I2A`) 的新架构的基本思想是让智能体能够当前的观测想象未来的轨迹，并将这些路径纳入决策过程中。\n\n![图片](img/22_01.jpg)\n\
  \n**图 22.1:** I2A 架构\n\n\n\n\n\n单个展开（Rollout）的所有步骤都将传递给一个被称为“展开编码器”（Rollout-Encoder）的网络，该网络将步骤编码为固定大小的向量。在展开过程中，我们将这些向量连接起来，并将它们传递给智能体，由智能体为\
  \ A3C 算法确定策略（Policy）和价值估计。如你所见，这里有很多变化之处，因此我尝试在图 22.2 中针对两个展开步骤和一个具有两个动作的环境的情况对其进行了视觉化处理。在随后的章节中，我将详细介绍各个网络以及该方法执行的步骤。\n\
  \n![\\[图片\\]](Images/22_02.jpg)\n\n**图 22.2:** 想象架构（Imagination-Architecture）\n\n\
  ### 22.3.1 环境模型\n\n环境模型(`EM`)的任务是将当前观测和动作转换为下一个观测和即时奖励。在 I2A 的工作[[2]](#22.xhtml#BGBBEFDI)中，作者在两个环境中测试了\
  \ I2A 模型：推箱子游戏（Sokoban）和电子游戏 MiniPacman。在这两种情况下，观测都是像素，因此环境返回像素以及一个奖励的浮点值。为了将动作整合到卷积层，执行了独热编码（One-hot-Encoding）和广播（Broadcasting），以与观测的像素匹配（每个动作一个颜色层）。图\
  \ 22.3 展示了这种转换。\n\n![\\[图片\\]](Images/22_03.jpg)\n\n**图 22.3:** 环境模型的结构\n\n有多种方法可以训练这个环境模型。作者发现，使用部分训练的智能体作为环境样本源进行预训练，收敛最快。\n\
  \n### 22.3.2 展开策略\n\n在展开步骤中，我们必须决定在想象过程中执行哪些动作。第一步的动作是固定的，因为我们为每个动作创建了独立的展开过程，但在后续步骤中必须做出决策。理想情况下，这些动作应该与智能体的策略一致，但我们不能简单地指示智能体提供概率，因为在想象路径的过程中必须生成展开。为了解决这个困境，会训练一个独立的“展开策略”网络，它提供与智能体策略相似的输出。展开策略是一个具有类似于\
  \ A3C 架构的小型网络，它与实际的 I2A 网络并行训练，通过优化展开策略网络输出与主网络之间的交叉熵损失来实现。在项工作中，该训练过程被称为“策略蒸馏”（Policy-Destillation）。\n\
  \n### 22.3.3 展开编码器\n\nI2A 模型的最后一个组件是展开编码器，它接收展开步骤（观测-奖励对）作为输入，并生成包含展开信息的固定大小向量。在该网络中，每个展开步骤都通过一个小型卷积网络进行预处理，该网络提取观测特征，并使用\
  \ LSTM 网络将特征转换为固定大小的向量。\n\n展开的输出与无模型路径的特征相结合，并以类似于 A3C 方法的方式用于确定策略和价值估计。\n\n###\
  \ 22.3.4 工作结果\n\n为了测试想象对强化学习（RL）任务的影响，正如提到的，作者使用了两个需要规划的环境：推箱子和 MiniPacman。结果显示，想象架构提供了比标准\
  \ A3C 更好的结果。\n\n### 22.4 结合 Breakout 游戏的 I2A\n\n为了测试想象对强化学习任务的影响，正如提到的，作者使用了两个需要规划的环境：推箱子和\
  \ MiniPacman。结果显示，想象架构提供了比标准 A3C 更好的结果。\n\n### 22.4.1 标准 A2C 智能体\n\n训练的第一步有两个目标：确定一个用于评估\
  \ I2A 智能体并获取策略的基线（Baseline）。环境模型使用从环境中获取的元组 `(s, a, s', r)` 进行无监督训练。环境模型的最终质量很大程度上取决于训练它的数据。观测与智能体执行动作时的数据越接近，结果越好。\n\
  \n代码可以在 `Chapter22/01_a2c.py` 和 `Chapter22/lib/common.py` 文件中找到。这是我们多次使用的标准 A2C\
  \ 算法。为了能够在训练 I2A 智能体时重复使用生成训练数据的代码，我没有使用 PTAN 库的类，而是从头在 `common.iterate_batches()`\
  \ 函数中实现了生成。它负责收集环境观测并计算实际过程的折现奖励。\n\n\n\n\n测试环境的配置与训练时使用的环境有两点不同：首先，测试环境允许运行完整的回合（Episodes），而不仅仅是单个生命周期的，因此测试回合的最终奖励比训练时的奖励更高。第二个区别在于，测试环境不使用裁剪（clipped）奖励，以确保数值具有可解释性。裁剪是\
  \ Atari 游戏训练的一种标准方法，因为在某些游戏中得分可能会达到非常大的值，这会对优势值（Advantage value）方差的估计产生负面影响。\n\n\
  与经典的 Atari-A2C 代理相比，另一个区别是作为观测值传递的帧（Frames）数量。通常会传递四个连续的帧，但在我的实验中，我发现当在 Breakout\
  \ 游戏中使用如果只使用两个帧，收敛性几乎没有变化。这自然会快快，因此在这个示例中观测张量的维度为 `(2, 84, 84)`。\n\n为了确保训练的可重复性，简单代理为随机数生成器使用了固定的种子值。这在\
  \ `common.set_seed()` 函数中完成，该函数为 NumPy、PyTorch（CPU 和 GPU）以及所有其他环境分配种子。\n\n### 22.4.2\
  \ 环境模型的训练\n\nEM 使用基础代理提供的数据进行训练，您可以指定一个在上一步中保存的权重文件。它不非要是最好的模型，只需要“足够好”到能产生有意义的观测。\n\
  \nEM 定义在 `Chapter22/lib/i2a.py` 文件的 `EnvironmentModel` 类中。该架构本质上对应于 2 中为 Sokoban\
  \ 环境提出的架构。模型的输入是一个观测张量和一个作为整数值传递的待执行动作。动作被进行独热编码（One-hot encoding），并通过广播（Broadcasting）调整到观测张量的维度。然后，动作和观测沿着“通道”维度拼接，从而形成\
  \ `(6, 84, 84)` 输入张量，因为 Breakout 中有四种动作。\n\n该张量通过两个大小为 4x4 和 3x3 的卷积层处理，然后使用残差层（Residual\
  \ layer），其中输出通过 3x3 卷积处理并将结果加到输入上。生成的张量被输入两个路径：一个是反卷积（Deconvolution），它提供观测值；另一个由两个卷积层和两个全连接层组成，用于预测奖励。\n\
  \nEM 提供两个输出：即时奖励（单个浮点数）和下一个观测值。为了减少观测值的维度，预测的是与上一次观测值的差异。因此，输出是一个 `(1, 84, 84)`\
  \ 张量。除了我们需要预测的数值较少外，差异的优势在于它是以零为中心的，如果帧中没有发生变化，它将包含零值，这在玩 Breakout 时很常见，因为通常只有几个像素发生了变化（球、球拍或被击中的砖块）。图\
  \ 22.4 展示了 EM 架构。\n\n在这里您看到在 `Chapter22/lib/i2a.py` 模块中的模型实现：\n\n```\nEM_OUT_SHAPE\
  \ = (1, ) + common.IMG_SHAPE[1:]\n\nclass EnvironmentModel(nn.Module):\n    def\
  \ __init__(self, input_shape, n_actions):\n        super(EnvironmentModel, self).__init__()\n\
  \n        self.input_shape = input_shape\n        self.n_actions = n_actions\n\n\
  \        n_planes = input_shape[0] + n_actions\n        self.conv1 = nn.Sequential(\n\
  \            nn.Conv2d(n_planes, 64, kernel_size=4,\n                      stride=4,\
  \ padding=1),\n            nn.ReLU(),\n            nn.Conv2d(64, 64, kernel_size=3,\
  \ padding=1),\n            nn.ReLU(),\n        )\n        self.conv2 = nn.Sequential(\n\
  \            nn.Conv2d(64, 64, kernel_size=3, padding=1),\n            nn.ReLU()\n\
  \        )\n```\n\n![图像](img/22_04.jpg)\n\n**图 22.4：** EM 架构与输入预处理\n\n负责卷积的部分处理输入，该输入由观测的颜色平面以及独热编码动作的其他平面组成。由于模型在卷积层之间使用了残差连接，我们将它们存储在单独字段中。\n\
  \n```\n        self.deconv = nn.ConvTranspose2d(64, 64, kernel_size=3,\n       \
  \                   stride=4, padding=1)\n        self.reward_conv = nn.Sequential(\n\
  \            nn.Conv2d(64, 64, kernel_size=3, padding=1),\n            nn.ReLU()\n\
  \        )\n        self.reward_fc = nn.Linear(128, 1)\n\n    def _get_reward_out(self,\
  \ shape):\n        o = torch.zeros(shape)\n        o = self.reward_conv(o)\n   \
  \     return o\n\n    def forward(self, imgs, actions):\n        batch_size = actions.size()[0]\n\
  \        act_planes_v = torch.FloatTensor(batch_size,self.n_actions, *self.input_shape[1:])\n\
  \        act_planes.zero_()\n        act_planes_v = act_planes_v.to(actions.device)\n\
  \        act_planes_v[range(batch_size), actions] = 1.0\n        comb_input_v =\
  \ torch.cat((imgs, act_planes_v), dim=1)\n        c1_out = self.conv1(comb_input_v)\n\
  \        c2_out = self.conv2(c1_out)\n        c2_out += c1_out\n        img_out\
  \ = self.deconv(c2_out)\n        rew_conv = self.reward_conv(c2_out).view(batch_size,\
  \ -1)\n        rew_out = self.reward_fc(rew_conv)\n        return img_out, rew_out\n\
  ```\n\n在模型的 `forward()` 方法中，我们将不同的部分组合成图 22.4 所示的转换。\n\nEM 的训练过程非常简单。使用 16 个并行环境池来填充每个\
  \ 64 个样本的 Batch。每个 Batch 条目包含当前观测、下一个观测、执行的动作以及即时获得的奖励。观测损失是预测的下一个观测值差异与当前及下次观测之间实际差异之间的均方误差。奖励损失仍然是奖励的均方误差。为了突出观测的重要性，我们将其损失缩放了\
  \ 10 倍。\n\n### 22.4.3 想象代理\n\n训练的最后部分是 I2A 代理，它将无模型路径与在上一步中训练过的由 EM 生成的轨迹（Rollouts）结合起来。\n\
  \n#### I2A 模型\n\n该代理在 `Chapter22/lib/i2a.py` 模块的 `I2A` 类中实现：\n\n```\nclass I2A(nn.Module):\n\
  \    def __init__(self, input_shape, n_actions,\n                 net_em, net_policy,\
  \ rollout_steps):\n        super(I2A, self).__init__()\n```\n\n\n\n构造函数的参数提供了观测格式、环境中的动作数量以及在\
  \ rollout（展开）过程中使用的两个网络：`EM` 和 `Rollout-Policy`，最后是 rollout 时执行的步数。`EM` 和 `Rollout-Policy`\
  \ 网络将以特殊方式存储，以防止它们的权重进入 `I2A` 网络的参数。\n\n```python\nself.n_actions = n_actions\n\
  self.rollout_steps = rollout_steps\n\nself.conv = nn.Sequential(\n    nn.Conv2d(input_shape[0],\
  \ 32, kernel_size=8, stride=4),\n    nn.ReLU(),\n    nn.Conv2d(32, 64, kernel_size=4,\
  \ stride=2),\n    nn.ReLU(),\n    nn.Conv2d(64, 64, kernel_size=3, stride=1),\n\
  \    nn.ReLU(),\n)\n```\n\n上面的代码定义了生成观测特征的无模型路径。该架构类似于 Atari 游戏中的卷积结构。\n\n```python\n\
  conv_out_size = self._get_conv_out(input_shape)\nfc_input = conv_out_size + ROLLOUT_HIDDEN\
  \ * n_actions\nself.fc = nn.Sequential(\n    nn.Linear(fc_input, 512),\n    nn.ReLU()\n\
  )\nself.policy = nn.Linear(512, n_actions)\nself.value = nn.Linear(512, 1)\n```\n\
  \n生成智能体策略（Policy）和价值（Value）的输入由通过无模型路径和 rollout 获取的特征组成。roll 使用常量 `ROLLOUT_HIDDEN`（值为\
  \ 256），它对应 `RolloutEncoder` 类中 LSTM 层的维度。\n\n```python\nself.encoder = RolloutEncoder(EM_OUT_SHAPE)\n\
  self.action_selector =\n    ptan.actions.ProbabilityActionSelector()\nobject.__setattr__(self,\
  \ \"net_em\", net_em)\nobject.__setattr__(self, \"net_policy\", net_policy)\n```\n\
  \n构造函数的剩余部分生成 `RolloutEncoder` 类（将在本文节后续描述）并存储 `EM` 和 `Rollout-Policy` 网络。这两个网络不会与\
  \ `I2A` 智能体一起训练，因为 `EM` 网络完全不参与训练（它在之前的一步已经过预训练并保持不变），而 `Rollout-Policy` 网络在独立的“策略蒸馏”中进行训练。然而，PyTorch\
  \ 的 `Module` 类会自动注册并链接所有分配给类的字段。为了防止 `EM` 和 `Rollout-Policy` 网络被整合进 `I2A` 智能体，我们通过调用\
  \ `__setattr__()` 来存储引用。这在某种程度上是一个黑科技（Hack），但它恰恰完成了任务。\n\n```python\ndef _get_conv_out(self,\
  \ shape):\n    o = self.conv(torch.zeros(1, *shape))\n    return int(np.prod(o.size()))\n\
  \ndef forward(self, x):\n    fx = x.float() / 255\n    enc_rollouts = self.rollouts_batch(fx)\n\
  \    conv_out = self.conv(fx).view(fx.size()[0], -1)\n    fc_in = torch.cat((conv_out,\
  \ enc_rollouts), dim=1)\n    fc_out = self.fc(fc_in)\n    return self.policy(fc_out),\
  \ self.value(fc_out)\n```\n\n`forward()` 函数看起来非常简单，因为大部分工作在 `rollout_batch()` 方法中完成。`I2A`\
  \ 类的下一个也是最后一个方法要复杂一些。最初它的设计是顺序执行所有 rollout，但那个版本速度慢得痛苦。新版本同时执行所有 rollout，使速度提高了近五倍，但让代码稍微复杂了一些：\n\
  \n```python\ndef rollouts_batch(self, batch):\n    batch_size = batch.size()[0]\n\
  \    batch_rest = batch.size()[1:]\n    if batch_size == 1:\n        obs_batch_v\
  \ = batch.expand(\n            batch_size * self.n_actions, *batch_rest)\n    else:\n\
  \        obs_batch_v = batch.unsqueeze(1)\n        obs_batch_v = obs_batch_v.expand(\n\
  \            batch_size, self.n_actions, *batch_rest)\n        obs_batch_v = obs_batch_v.contiguous()\n\
  \        obs_batch_v = obs_batch_v.view(-1, *batch_rest)\n```\n\n在函数开头，我们希望对 batch\
  \ 中的观测执行 `n_actions` 次 rollout。因此，我们必须扩展观测 batch 并每个观测重复 `n_actions` 次。最有效的方法是使用\
  \ PyTorch 的 `expand()` 方法，它可以扩展维度为 1 的张量。如果 batch 只有一个样本，我们需要通过这种方式来复制数据以匹配后续操作。\n\
  \n\n\n当我们完成所有步骤后，列表 `step_obs` 和 `step_rewards` 将包含所有步骤的张量（tensor）。通过 `torch.stack()`\
  \ 函数，我们将它们合并到一个新的维度中。生成的张量以 Rollout 步骤作为第一维度，以 `batch_size` * `n_actions` 为第二维度。这两个张量被传递给\
  \ `RolloutEncoder`，它会为第二维度的所有条目生成一个编码向量。编码器的输出是一个 `(batch_size*n_actions, encoded_len)`\
  \ 张量，而我们希望将同一个 Batch 样本中不同动作的编码连接在一起。为了这个目的，我们重塑输出张量，使其第一维度为 `batch_size`，以便函数的输出格式变为\
  \ `(batch_size, encoded_len*n_actions)`。\n\n## Rollout-Encoder\n\n`RolloutEncoder`\
  \ 类接收两个张量：形状为 `(rollout_steps, batch_size, 1, 84, 84)` 的观测值和形状为 `(rollout_steps,\
  \ batch_size)` 的奖励，并在 Rollout 步骤上应用循环神经网络 (RNN)，将所有批处理序列转换为一个编码向量。在 RNN 之前，预处理器会提取\
  \ EM 提供的观测差（delta）的特征。奖励值被简单地附加在特征向量之后。\n\n```pythonclass RolloutEncoder(nn.Module):\n\
  \    def __init__(self, input_shape,\n                                hidden_size=ROLLOUT_HIDDEN):\n\
  \        super(RolloutEncoder, self).__init__()\n\n        self.conv = nn.Sequential(\n\
  \            nn.Conv2d(input_shape[0], 32, kernel_size=8,\n                    \
  \                              stride=4),\n            nn.ReLU(),\n            nn.Conv2d(32,\
  \ 64, kernel_size=4, stride=2),\n            nn.ReLU(),\n            nn.Conv2d(64,\
  \ 64, kernel_size=3, stride=1),\n            nn.ReLU(),\n        )\n```\n\n观测值的预处理器使用了\
  \ Atari 游戏中常见的卷积层，不同在于输入张量具有单个通道，该通道包含相邻相邻观测值之间的差。\n\n```python\nconv_out_size =\
  \ self._get_conv_out(input_shape)\n\nself.rnn = nn.LSTM(input_size=conv_out_size+1,\n\
  \                  hidden_size=hidden_size, batch_first=False)\n```\n\n编码器的 RNN\
  \ 是一个 LSTM 层。参数 `batch_first=False` 在某种程度上是冗余的，因为默认值已经是 `False`，但我们在这里保留它是为了考虑到输入张量的结构，这里的结构为\
  \ `(rollout_steps, batch_size, conv_features+1)`，因此时间维度位于索引 0。\n\n```python\ndef\
  \ _get_conv_out(self, shape):\n    o = self.conv(torch.zeros(1, *shape))\n    return\
  \ int(np.prod(o.size()))\n\ndef forward(self, obs_v, reward_v):\n    \"\"\"\n  \
  \  输入顺序为 (time, batch, ...)\n    \"\"\"\n    n_time = obs_v.size()[0]\n    n_batch\
  \ = obs_v.size()[1]\n    n_items = n_time * n_batch\n    obs_flat_v = obs_v.view(n_items,\
  \ *obs_v.size()[2:])\n    conv_out = self.conv(obs_flat_v)\n    conv_out = conv_out.view(n_time,\
  \ n_batch, -1)\n    rnn_in = torch.cat((conv_out, reward_v), dim=2)\n    _, (rnn_hid,\
  \ _) = self.rnn(rnn_in)\n    return rnn_hid.view(-1)\n```\n\n`forward()` 函数显然是编码器架构，它首先提取所有\
  \ `rollout_steps*batch_size` 个观测值的特征，并将 LSTM 应用序列。作为 Rollout 的编码向量，我们使用 RNN 返回的隐藏状态。\n\
  \n## A2 训练\n\n训练过程包含两个步骤：我们按照 A2C 知的方法训练 A2 模型，并使用一个独立的损失进行 Rollout 策略蒸馏。“蒸馏训练”是为了使在\
  \ Rollout 步骤中使用的动作接近真实情况。然而，在 Rollout 期间我们不能使用我们的模型来选择动作，因为模型必须执行额外的 Rollout。为了解决这个冲突，我们使用蒸馏，根据\
  \ A2 模型策略与训练策略之间的交叉熵进行简单的损失优化。对于这个训练步骤，有一个优化器仅负责 Rollout 策略。随后是负责蒸馏的训练部分，`mb_probe`\
  \ 包含了 A2 模型为观测值 `obs_v` 选择的动作概率。\n\n```python\nprobs_v = torch.FloatTensor(mb_probs).to(device)\n\
  policy_opt.zero_grad()\nlogits_v, _ = net_policy(obs_v)\npolicy_loss_v = -F.log_softmax(logits_v,\
  \ dim=1) *\n                probs_v.view_as(logits_v)\npolicy_loss_v = policy_loss_v.sum(dim=1).mean()\n\
  policy_loss_v.backward()\npolicy_opt.step()\n```\n\n另一个训练步骤将按照普通 A2C 的进行，忽略了 A2\
  \ 模型的所有内部状态：损失是预测的通过 Bellman 方程估计的折扣奖励的均方误差，而策略梯度的近似是通过优势值乘以所选动作的对数概率实现的。\n\n##\
  \ 22.5 实验结果\n\n在本节中，我们将查看多阶段训练过程的结果。\n\n### 22.5.1 基础代理\n\n运行 `Chapter22/01_a2c.py`\
