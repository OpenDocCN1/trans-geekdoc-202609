  \n[content]\n```bash\ndocker run -d -p 5900:5900 -p 15900:15900 --privileged --ipc\
  \ host --cap-add SYS_ADMIN <CONTAINER_ID> <ARGS>\n```\n\n参数的含义如下：\n\n- `-d`: 在后台模式（`detach`-模式）启动容器。如果您想查看容器的输出，可以用\
  \ `-t` 替换此选项。这样容器将以交互模式启动，并可以通过 Ctrl-C 停止。\n\n- `-p` `SRC_PORT:TGT_PORT`: 将主机的源端口转发到容器内部的目标端口。此选项允许在同一台机器上启动多个\
  \ MiniWoB 容器。所有容器都会启动 VNC 服务器和奖励进程（Reward Daemon），它们在端口 `5900` 或 `15900` 上监听。参数\
  \ `-p 5900:5900` 将主机（运行容器的计算机）上的端口 `5900` 提供给 VNC 服务器。对于第二个容器，您应该传递 `-p 5901:5900`，使服务器在端口\
  \ `5901` 上可用（因为 `5900` 已被占用）。容器内部的奖励进程也是，它在端口 `15900` 上监听。通过 `-p` ，您可以将主机的连接转发到容器的端口。\n\
  \n- `--privileged`: 此选项允许容器访问主机的设备。目前不清楚为什么启动 MinIWoB 任务需要此选项，可能是由于 VNC 服务器的要求。\n\
  \n- `--ipc` `host`: 允许容器与主机共享 IPC 命名空间（进程间通信）。\n\n- `--cap-add` `SYS_ADMIN`: 扩展容器更改主机配置设置的能力。\n\
  \n- `<CONTAINER_ID>`: 容器 ID。应该是 `shuma/miniwob:v2`。这是原始 `quay.io/openai/universe.world-of-bits:0.20.0`\
  \ 的补丁版本。请参阅第 16.2.4 节。\n\n- `<ARGS>`: 您可以向容器传递更多参数以更改其运行方式。我们稍后录制演示时需要这些。这里不需要。\n\
  \n就是这些！我们的训练脚本预期有八个容器运行并在端口 `5900` 到 `5907` 以及 `15000` 到 `15007` 上监听。启动时我使用以下命令（另见\
  \ `Chapter16/adhoc/start_docker.sh`）：\n\n```bash\n#!/usr/bin/env bash\nfor i in\
  \ 'seq 0 7'; do\n    p1=$((5900+i))\n    p2=$((15900+i))\n    docker run -d -p $p1:5900\
  \ -p $p2:15900 --privileged --ipc host --cap-add SYS_ADMIN shuma/miniwob -f 20\n\
