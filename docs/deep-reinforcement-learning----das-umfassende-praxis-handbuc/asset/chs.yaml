  \ typische Antworten auf die Eingaben des Benutzers.\n\n\n\n\nNLP（自然语言处理）具有一些与计算机视觉或其他领域不同的特殊之处。其中之一是处理长度可变的对象。在\
  \ NLP 中，不同层级都存在长度可变的对象，例如，一个单词由多个字母组成，句子由长度可变的单词序列组成，而段落或文档由数量不等的句子组成。这种可变性不仅存在于\
  \ NLP 中，也出现在其他领域，例如信号处理或视频处理。计算机视觉的标准任务也可以被视为一组对象序列，例如用于图像标记的神经网络（NN），它关注同一张图像的不同区域，以便在该地描述它。\n\
  \n循环神经网络是一个标准组件。`RNN` 是一个具有固定输入和输出的网络，它被应用于对象序列，并能与该序列传递信息。这些信息被称为**隐藏状态**（`hidden\
  \ state`）。通常，它是一个特定大小的数值向量。\n\n图 14.1 中的图展示了一个以数值向量作为输入、另一个数值向量作为输出的 `RNN`。它与普通前馈网络（Feedforward）或卷积网络的区别在于两个额外的门（Gates）：一个输入和一个输出。额外的输入将前一个对象的隐藏状态传递给\
  \ `RNN` 单元，而额外的输出为下一个序列提供转换后的隐藏状态。\n\n![\\[Bild\\]](Images/14_01.jpg)\n\n**图 14.1：**\
  \ RNN 组件的结构\n\n这种方法解决了可变长度的问题。由于 `RNN` 接收两个输入，因此通过将前一个条目的隐藏状态传递给后续条目，它可以适用于任意长度的输入序列。在图\
  \ 14.2 中，`RNN` 被应用于句子“Das ist eine Katze”（这是一只猫），并提供序列中所有单词的输出。在此过程中，同一个 `RNN` 应用所有的输入对象，但得益于隐藏状态，信息可以随序列传递。这与卷积网络类似，在卷积网络中相同的滤波器被应用于图像的不同区域，但卷积网络无法传递隐藏状态。\n\
  \n尽管该模型非常简单，但它为标准前馈模型增加了一个自由度。前馈网络在相同输入时总是产生相同的输出（当然是在测试模式下，而不是训练时）。然而，`RNN` 的输出不仅取决于输入，还取决于可能由网络本身改变的隐藏状态。因此，网络可以将信息从序列开头传递到结尾，并在不同的上下文中对相同输入产生不同的输出。这种上下文依赖性在\
  \ NLP 中非常重要，因为单个单词在不同的上下文中可能具有完全不同的含义，并改变整个句子的意思。\n\n![\\[Bild\\]](Images/14_02.jpg)\n\
  \n**图 14.2：** RNN 在句子上的应用\n\n这种灵活性是有代价的。循环神经网络训练通常需要更多时间，有时可能会表现出意想不到的行为，例如损失函数的波动或训练期间突然的“忘记”。然而，研究社区已经做了大量工作，并继续致力于使循环神经网络更具实用性且稳定。因此，它们可以被视为系统的标准组件。\n\
  \n### 14.3 词嵌入（Embeddings）\n\n嵌入（Embeddings）是许多深度学习系统的标准组件。在 NLP 中，我们通常需要将单词、字符或其他序列表示为数值。一种简单的方法是使用独热编码（one-hot\
  \ encoding），其中每个词表示为词表中的一个稀疏向量。然而，one-hot 编码有几个问题。\n\n首先，one-hot 编码在处理空间上是低效的。如果词表中有\
  \ 10,000 个词，那么每个词都需要长度为 10,000 的向量，其中只有一个元素为 1，其余全为 0。这会消耗大量的内存空间。\n\n其次，one-hot\
  \ 编码无法捕捉词与词之间的关系。例如，“猫”和“狗”在语义上很相似，但在 one-hot 空间中，它们是完全正交的，彼此没有任何相似性。此外，one-hot\
  \ 编码无法处理训练集之外的词（OOV, out-of-vocabulary）。如果出现一个训练时未见过的词，模型将无法处理。\n\n为了解决这些问题，我们使用词嵌入（Embeddings）。嵌入将单词映射到低维稠密向量空间。这些向量是通过学习得到的，使得语义相似的词在空间中距离更近。\n\
  \n目前有许多训练嵌入的方法，例如：\n1.  **word2vec**：由 Google 提出，通过预测上下文中的词或预测词的上下文来学习嵌入。\n2.  **GloVe**：由斯坦福大学提出，基于全局词共现矩阵。\n\
  3.  **FastText**：由 Facebook 提出，通过考虑子词（subword）信息来更好地处理 OOV 词。\n\n此外，我们也可以在训练神经网络时从头学习嵌入。在这种情况下，嵌入层是网络的一部分，通过反向传播进行更新。\n\
  \n\n\n\n另一种常见的 NLP 模型是 `Encoder-Decoder`（同样也是一种 `Seq2Seq` 方法）。它最初是为机器翻译设计的。该系统接收源语言的单词序列，并返回目标语言的序列。其核心思想是使用\
  \ `RNN` 来处理输入序列，并将该序列编码为固定长度的表示。这个 `RNN` 被称为 `Encoder`（编码器）。然后将编码后的向量输入到另一个 `RNN`——即\
  \ `Decoder`（解码器）中，由它生成目标语言的序列。图 14.3 显示了一个将句子翻译成俄语的示例。\n\n该模型（带有许多现代优化和扩展）在机器翻译中仍然是中流骨柱，但它具有足够的通用性，也可以应用于其他领域，例如音频处理、图像和视频的关键词标记等。在我们的聊天机器人示例中，我们将使用它根据输入的单词序列生成答案。\n\
  \n![\\Bild**图 14.3：** 机器翻译中的 Encoder-Decoder 架构## 14.4 Seq2Seq 训练这些都非常有趣，但它们与强化学习（Reinforcement\
  \ Learning）有什么关系？联系在于 `Seq2Seq` 模型的训练，但在转向现代的 `RL` 方法之前，我们必须简要回顾标准的训练流程。### 14.4.1\
  \ 对数似然训练假设我们想要开发使用 `Seq2Seq` 模型从一种语言（法语）翻译到另一种语言（英语）的机器翻译系统。我们拥有大量带有示例翻译（法语和英语句子）的数据，可以用来训练模型。我们该如何操作呢？编码的工作原理显而易见：我们将\
  \ `Encoder-RNN` 应用于第一个句子，得到句子的编码表示。这种表示的明显候选是 `RNN` 最后一次应用返回的隐藏状态（hidden state）。在编码时，我们忽略\
  \ `RNN` 的输出，只考虑其最后一次应用的隐藏状态。此外，我们用特殊标记 `<END>` 扩展句子，告知 `Encoder` 句子的结束（图 14.4）。![\\\
  Bild**图 14.4：** 编码过程为了开始解码，我们将编码表示传递给 `Decoder` 的隐藏状态。在此过程中，我们使用标记 `<BEG>` 作为启动解码的信号。在这一步中，`Decoder`\
  \ 必须返回翻译句子的第一个标记。在训练初期，当 `Encoder` 和 `Decoder` 用随机权重初始化时，`Dec` 的输出是随机的，我们的目标是通过\
  \ `SGD` 将其调整到正确翻译的方向。经典方法将此任务视为分类任务，其中我们的 `Decoder` 必须返回解码句子当前位置标记的概率分布。通常，我们通过一个扁平的馈馈网络（`Feedforward-Netz`）转换\
  \ `Dec` 的输出，并生成一个长度与我们字典大小相等的向量。然后我们使用该概率分布和标准的分类损失函数：交叉熵（cross-entropy）。对于通过输入标记\
  \ `<BEG>` 产生的解码序列的第一个标记，这很明确，但剩余的序列呢？这里有两种方法。第一种方案是传递目标句子的标记。例如，对于句子对 *Je ne mange\
  \ pas 六 jours -> I haven’t eaten for six days*，我们将标记（`I`、`haven’t`、`eaten`……）传递给\
  \ `Decoder`，并使用 `RNN` 输出与下一个标记之间的交叉熵损失。这种训练模式被称为 Teacher Forcing（教师强制）。在每一步，我们都传递一个正确翻译的标记并指示\
  \ `RNN` 提供下一个正确的标记。这一过程在图 14.5](img/#14.xhtml#i1412245) 中所示。\n\n![\\Bild\n\n**图\
  \ 14.5：** Teacher Forcing 下编码向量解码\n\n上述示例的损失计算如下：\n\n```\nL = xentropy(p1,\"I\"\
  )     + xentropy(p2,\"haven't\")\n  + xentropy(p3,\"eaten\") + xentropy(p4,\"for\"\
  )\n  + xentropy(p5,\"six\")   + xentropy(p6,\"days\")\n  + xentropy(p7,\"<END>\"\
  )\n```\n\n由于 `Encoder` 和 `Decoder` 都是可微的神经网络，我们可以进行反向传播，使它们在未来能更好地分类此类示例。\n\n\n\n\
  \n在我们讨论本章的主题（用于 Seq2Seq 程序的强化学习）之前，我们必须引入一种指标，该指标通常用于评估 NLP 任务中机器翻译的质量。该指标被称为 `BLEU`\
  \ (`Bilingual Evaluation Understudy`)，它是比较机器生成的输出序列与一组参考输出的标准方法之一。可以使用多个参考输出（一个句子可以有不同的方式进行翻译）。本质上，它计算生成输出与参考句子之间共同拥有的单字节（unigram）、双字节（bigram）等的比例。虽然有\
  \ CIDEr 和 ROGUE 等替代方案，但在本示例中，我们将使用 Python 的 `nltk` 库中的 BLEU 实现（包 `nltk.translate.bleu_score`）。\n\
  \n### 14.4.3 RL 与 Seq2Seq\n\nRL 和文本生成是不同的东西，但它们之间存在联系，可以用于改进训练的 Seq2Seq 模型的质量。首先要指出，我们的解码器在每一步都会输出概率分布，这与\
  \ PG（策略梯度）模型非常相似。从这个角度来看，我们的解码器可以被看作一个尝试在每个步骤决定生成哪个 token 的代理。\n\n对解码过程的这种解释具有一些优势。首先，如果我们将解码过程视为随机的，我们就可以自动考虑多个目标序列。例如，对于“你好，怎么样吗？”这个短语有许多可能的回答，而且都是正确的。通过优化对数似然（log-likelihood）目标值，我们的模型将尝试找到所有可能答案的某种平均值。然而，“谢谢，很好！”和“不太好”的平均值几乎不会产生有意义的句子。通过返回概率分布并从该分布中提取下一个\
  \ token，我们的代理可能会学习生成所有可能的变体，而不仅仅是找到平均答案。\n\n第二个优势是我们可以优化我们感兴趣的目标值。在对数似然训练中，我们最小化生成\
  \ token 与参考 token 之间的交叉熵，但在机器翻译和许多其他 NLP 任务中，我们实际上根本对对数似然感兴趣：我们想最大化生成序列的 BLEU 分。遗憾的是，BLEU\
  \ 分是不可微的，因此我们无法进行反向传播。像 REINFORCE (第 9 章) 这样的 PG 方法即使在奖励是不可微的情况下也能运行：我们只需要增加良好回合（episode）的概率并减少较劣回合的概率。\n\
  \n我们可以利用的第三个优势是，我们自己定义生成序列的方式并了解其内部机制。我们可以在解码过程中引入随机性并多次重复它，从而根据单个训练示例获得不同的解码场景。当训练数据量有限时，这非常有用，如果你不在\
  \ Google 或 Facebook 工作，情况几乎总是如此。\n\n为了理解我们如何将训练从对数似然目标值切换到 KL 场景，我们必须从数学角度来看。对数似然估计意味着通过改变模型参数来最大化\
  \ ![图像](img/14_07.jpg) 之和，这等同于最小化数据概率分布与模型参数化概率分布之间的 Kullback-Leibler 散度（KL 散度），可以写为最大化\
  \ ![图像](img/14_08.jpg)。\n\nREINFORCE 方法的目标是最大化表达式 ![图像](img/14_09.jpg)。这种联系是显而易见的，两者之间的区别仅在于取对数之前的缩放以及我们选择动作的方式（即我们词表中的\
  \ token）。\n\n在实践中，REINFORCE 用于 Seq2Seq 训练可以公式化如下算法：\n\n1. 使用 Encoder-RNN 确定数据集中所有示例的编码表示\
  \ `E`。\n2. 使用特殊的 `begin`-token 初始化当前 token `T = '<BEG>'`。\n3. 将输出序列初始化为空：`Out =\
  \ []`。\n4. 只要 `T != '<END>'`，就重复以下步骤：\n    * 通过传递当前 token 和隐藏状态确定概率分布和新的隐藏状态：`p,\
  \ H = Decoder(T, E)`。\n    * 从概率分布中提取 token `T[out]`。\n    * 存储概率分布 `p`。\n    *\
  \ 将 `T[out]` 添加到输出序列中：`Out += T[out]`。\n    * 分配当前 token：![图像](img/14_10.jpg)。\n\
  5. 计算 `Out` 与参考句的 BLEU 分：`Q = BLEU(Out, ref)`。\n6. 估计梯度 ![图像](img/14_11.jpg)。\n\
  7. 通过 `SGD` 更新模型。\n8. 重复该过程直到收敛。\n\n### 14.4.4 自批判训练（Self-critical Training）\n\n\
  尽管具有上述优势，但描述的方法仍面临一些困难。首先，从零开始训练一个系统几乎是徒劳。即使是简单的对话，输出序列通常也由五个或更多单词组成，这些词是从一个包含数千单词的词表中提取的。从一千词词表中选取五个单词可能的句子数量为\
  \ $5^{1000}$ —— 这略小于 $10^{700}$。因此，在训练开始获得正确答案（当编码器和解码器的权重仍为随机）的概率微乎其微。为了解决这个问题，我们可以结合对数似然方法和\
  \ RL 方法，首先用对数似然目标值训练我们的模型（并在 Teacher Forcing 和课程学习之间切换），一旦模型达到了一定的质量，就切换到 REINFORCE\
  \ 方法。通常情况下，这种方法可以被视为复杂 RL 任务的统一方法，当巨大的动作空间使得使用随机行为的代理无法实现目标时（因为这种代理随机实现目标的概率微乎其微）。\n\
  \n\n\n为了获得输出值，作者使用 `argmax` 模式下的解码器生成序列，随后这些序列被用于计算 BLEU 或类似的相似度指标。通过切换到 `argmax`\
  \ 模式，解码器变得完全确定性，并并通过以下公式为 REINFORCE 策略梯度提供输出值：\n\n![\\[Bild\\]](Images/14_12.jpg)\n\
  \n在接下来的章节中，我们将实现一个简单的聊天机器人，并使用来自电影对话的数据集进行训练。\n\n## 14.5 聊天机器人示例\n\n在本章开头，我们简要介绍了聊天机器人和\
  \ NLP，因此我们将尝试使用 Seq2Seq 和 RL 训练来实现一些内容。聊天机器人本质上分为两类：模仿人类的娱乐型机器人和目标导向型机器人。第一类旨在娱乐用户，并对言语做出类人的应答，而无需完全理解其含义。第二类机器人的实现要要困难得多，它们旨在解决用户的问题：获取信息、更改预订或开关家中的烤面包机。\n\
  \n工业界的努力主要集中在目标导向类上，但距离完全解决方案还很远。由于本章旨在介绍所述方法的简短示例，我们专注于训练一个使用提取自电影句子的数据集的娱乐机器人。\n\
  \n尽管任务简单，但此示例的代码非常详尽并涉及一些新概念，因此书中不包含完整的代码。我将主要关注负责模型训练和使用的核心模块，但许多功能也将在概述中进行介绍。\n\
  \n### 14.5.1 示例结构\n\n你可以在 `Chapter14` 文件夹中找到完整示例，其中包含以下内容：\n\n* `data`: 一个包含 `get_data.sh`\
  \ 脚本的目录，用于下载和解压示例中使用的数据集。该数据集大小为 10 MB，包含来自不同来源的结构化对话。它被称为 `Cornell Movie-Dialogue\
  \ Corpus`，可以在此处获取：[`www.cs.cornell.edu/~cristian/Cornell_Movie-Dialogs_Corpus.html`](https://www.cs.cornell.edu/~cristian/Cornell_Movie-Dialogs_Corpus.html)。\n\
  \n* `libbots`: 一个包含 Python 模块的目录，这些模块被示例的不同部分。将在下一节中进行描述。\n\n* `tests`: 一个包含库模块单元测试的文件夹。\n\
  \n* 根目录包含两个用于训练模型的程序：`train_crossent.py` 用于初期的模型训练，以及 `train_scst.py` 使用 REINFORCE\
  \ 算法对训练过的模型进行微调。\n\n* 用于显示数据集各种统计数据和数据的脚本：`cor_reader.py`。\n\n* 将训练好的模型应用于数据集并显示质量指标的脚本：`data_test.py`。\n\
  \n* 使用自定义句子使用模型的脚本：`use_model.py`。\n\n* 用于 Telegram 编译器的机器人，使用预训练模型 `telegram_bot.py`。\n\
  \n我们首先考虑示例中与数据的部分，然后查看两个训练脚本，最后我将讨论模型的使用。\n\n### 14.5.2 模块：cornell.py 和 data.py\n\
  \n`cornell.py` 和 `data.py` 是使用该数据集训练模型的两个库模块。它们处理数据并将其转换为适用于训练的形式，但在不同的层级上工作。\n\n\
  `cornell.py` 文件包含解析此类数据格式的低级函数，这些数据以适用于训练的形式表示。该模块的主要目的是加载对话。由于数据集包含元数据，我们可以根据不同标准进行过滤，这里实现了一个类型过滤器。对话以句子列表的形式表示，这里是一个句子示例：`[\"\
  hi!\", \"how\", \"are\", \"you?\"]`。\n\n句子转换为 Token 被称为标记。这个过程可能是复杂的，因为必须考虑标点符号、缩写、连字符以及自然语言的其他特性。幸运的是，`nltk`\
  \ 库提供了多种分词方法。将句子转换为 Token 列表只需调用合适的函数，这大大简化了我们的工作。`cornell.py` 中调用的主函数是 `load_dialogues()`，它带有可选的过滤器。\n\
  \n`data.py` 模块更加通用，不包含特定数据集的信息。它提供了在示例中几乎处处的功能：\n\n* Token 到整数 ID 的映射：保存和加载文件（save_emb_dict()`\
  \ 和 `load_emb_dict()`）、将 Token 编码为 ID 列表（encode_words()`）、将 ID 列表解码为 Token（decode_words()`）以及从训练数据生成字典（phrase_pairs_dict()`）。\n\
  \n* 使用训练数据：处理指定大小的批量（iterate_batches()`）以及将数据划分为训练集和测试集（split_train_test()`）。\n\n\
  * 加载对话数据并转换为适用于训练的句子-回答对：`load_data()` 函数。\n\n在加载数据和生成字典时，我们添加具有定义 ID 的特殊 Token：\n\
  \n* `#UNK`：用于不在任何字典中的未知单词。\n\n* `#BEG`：用于序列开头，置于所有序列之前。\n\n* `#END`：用于序列结束。\n\n\n\
  \n\n第二个应用于数据的过滤器针对的是词表。词表中单词的数量对性能和所需的 GPU 内存空间有显著影响，因为嵌入矩阵（包含词表中所有标记的嵌入向量）和投影矩阵（用于将\
  \ Decoder-RNN 的输出转换为概率分布）都将词表的大小作为一个决定性维度。通过减少词表中的单词数量，我们可以降低内存需求并提高训练速度。为此，我们计算了词表中单词的频率，并为所有出现少于\
  \ 10 次的单词分配未知 Token。随后，从训练数据集中移除所有带有该 Token 的训练对。\n\n## 14.5.3 BLEU 分数与 utils.py\n\
  \n使用 `nltk` 库来计算 BLEU 分。为了使计算更加方便，我们实现了两个封装函数：`calc_bleu(candidate_seq, reference_seq)`\
  \ 用于在存在候选序列和参考序列时计算分数，以及 `calc_bleu_many(candidate_seq, reference_sequences)` 用于在需要将候选序列与多个参考序列进行比较时确定分数。如果有多个候选序列，将计算并返回最佳\
  \ BLEU 分。\n\n为了特别反映我们数据集中短句的情况，BLEU 仅针对一元（Unigram）和二元（Bigram）计算。以下代码是 `utils.py`\
  \ 模块，负责 BLEU 计算，并包含了另外两个用于句子句子以及将 Token 列表转换为字符串的函数。\n\n```\nimport string\nfrom\
  \ nltk.translate import bleu_score\nfrom nltk.tokenize import TweetTokenizer\n\n\
  def calc_bleu_many(cand_seq, ref_sequences):\n    sf = bleu_score.SmoothingFunction()\n\
  \    return bleu_score.sentence_bleu(ref_sequences, cand_seq,\n                \
  \              smoothing_function=sf.method1,\n                              weights=(0.5,\
  \ 0.5))\n\ndef calc_bleu(cand_seq, ref_seq):\n    return calc_bleu_many(cand_seq,\
  \ [ref_seq])\n\ndef tokenize(s):\n    return TweetTokenizer(preserve_case=False).tokenize(s)\n\
  \ndef untokenize(words):\n    to_pad = lambda t: not t.startswith(\"'\") and\n \
  \                      t not in string.punctuation\n    return \"\".join([\n   \
  \     (\" \" + i) if to_pad(i) else i\n        for i in words\n    ]).strip()\n\
  ```\n\n## 14.5.4 模型\n\n训练过程和模型本身的功能定义在 `libbots/model.py` 文件中。它对于理解训练过程至关重要，并在下方进行了注释。\n\
  \n```\nHIDDEN_STATE_SIZE = 512\nEMBEDDING_DIM = 50\n```\n\n第一个超参数（`HIDDEN_STATE_SIZE`）定义了\
  \ Encoder 和 Decoder-RNN 使用的隐藏状态大小。在 PyTorch 实现中，该值确定了三个参数：\n\n* 期望输入并作为 RNN 单元输出的隐藏状态维度\n\
  * RNN 的输出维度。虽然维度相同，但 RNN 的输出与隐藏状态不同\n* 用于 RNN 变换的内部神经元计数器\n\n第二个超参数 `EMBEDDING_DIM`\
  \ 定义了嵌入的维度，即代表词表中所有 Token 的向量集合。在这个示例中，我们没有使用像 GLoVe 或 word2vec 的预训练嵌入，而是与模型一起训练。由于\
  \ Encoder 和 Decoder 接收 Token 作为输入，嵌入的维度也定义了 RNN 输入的大小。\n\n```\nclass PhraseModel(nn.Module):\n\
  \   def __init__(self, emb_size, dict_size, hid_size):\n       super(PhraseModel,\
  \ self).__init__()\n\n       self.emb = nn.Embedding(dict_size, emb_size)\n    \
  \   self.encoder = nn.LSTM(emb_size, hid_size, batch_first=True)\n       self.decoder\
  \ = nn.LSTM(hid_size, dict_size, batch_first=True)\n       self.output = nn.Linear(hid_size,\
  \ dict_size)\n```\n\n\n\n上述 `Funktion` 是一个辅助方法，用于访问输入批次中单个组件的隐藏状态。之所以需要它，是因为我们只需要通过一次调用（使用\
  \ `encode()` 方法）就可以对整个序列批次进行编码，但批次的解码是逐个完成的。该方法用于提取索引为 `index` 的批次元素的隐藏状态。这种提取的细节取决于\
  \ RNN 的实现。例如，在 LSTM 中，隐藏状态由一个包含两个张量的元组表示：单元状态（*cell state*）和隐藏状态本身。简单的 RNN 实现（如\
  \ `torch.nn.RNN` 类或稍显复杂的 `torch.nn.GRU` 类）使用单个张量来表示隐藏状态。因此，这些信息被封装在句方法中，当更改编码器或解码器的\
  \ RNN 类型时，应该对该方法进行调整。\n\n剩余的方法完全涉及各种形式的解码过程。首先是 Teacher-Forcing（教师强制）模式：\n\n```python\n\
  def decode_teacher(self, hid, input_seq):\n    # 前提：Batch 大小 = 1\n    out, _ = self.decoder(input_seq,\
  \ hid)\n    out = self.output(out.data)\n    return out\n```\n\n这是最简单且高效的解码方式。在这种模式下，我们直接将解码\
  \ RNN 应用于参考序列（训练示例的答案）。\n\n在 Teacher-Forcing 模式下，每一步的输入都是预先知的，RNN 在两个步骤之间仅依赖其隐藏状态，这使得能够非常高效地执行\
  \ RNN 变换，而无需在 GPU 或到 GPU 传输数据。CuDNN 库就是这样实现的。\n\n在其他的解码过程中，情况并非如此，因为解码器每一步的输出决定了下一步的输入。这种输出与输入之间的连接通过\
  \ Python 代码建立，因此解码是逐步进行的，并不一定需要传输数据（所有张量都在 GPU 内存中），但控制权在 Python 代码手中，而不是高度优化的 CuDNN\
  \ 库。\n\n```python\ndef decode_one(self, hid, input_x):\n    out, new_hid = self.decoder(input_x.unsqueeze(0),\
  \ hid)\n    out = self.output(out)\n    return out.squeeze(dim=0), new_hid\n```\n\
  \n上述方法对一个示例执行解码步骤。我们将隐藏状态（包含第一步时的编码序列）传递给解码器，以及带有输入 Token 嵌入向量的张量。解码器的结果由输出投影处理，并提供词表中\
  \ Token 的原始值。这并不是一个概率分布，因为我们没有应用 `softmax` 函数，而是原始值（也称为 Logits）。该函数的返回值是 Logits\
  \ 和解码器返回的新隐藏状态。\n\n```python\ndef decode_chain_argmax(self, hid, begin_emb, seq_len,\n\
  \                                         stop_at_token=None):\n    res_logits =\
  \ []\n    res_tokens = []\n    cur_emb = begin_emb\n```\n\n`decode_chain_argmax()`\
  \ 方法解码一个编码序列，并使用 `argmax` 将概率分布转换为 Token 索引。该函数接收以下参数：\n\n- `hid`: 编码器为输入序列返回的状态\n\
  - `begin_emb`: 用于开始解码的 `#BEG`-Token 的嵌入向量\n- `seq_len`: 解码序列的最大长度。如果解码器返回 `#END`-Token，生成的序列可能会更短，但也可能更长。\n\
  - `stop_at_token`: 一个可选的 Token-ID（通常是 `#END`-Token），用于停止解码过程\n\n该函数返回两个值：解码器在每一步返回的\
  \ Logits 张量，以及生成的 Token-ID 列表。第一个值用于训练，因为我们需要输出张量来计算损失。第二个值被传递给指标，在这种情况下是 BLEU 分。\n\
  \n```python\nfor _ in range(seq_len):\n    out_logits, hid = self.decode_one(hid,\
  \ cur_emb)\n    out_token_v = torch.max(out_logits, dim=1)[1]\n    out_token = out_token_v.data.cpu().numpy()[0]\n\
  \n    cur_emb = net.emb(out_token)\n\n    res_logits.append(out_logits)\n    res_tokens.append(out_token)\n\
  \    if stop_at_token is not None:\n        if out_token == stop_at_token:\n   \
  \         break\nreturn torch.cat(res_logits), res_tokens\n```\n\n在解码循环的每次迭代中，我们将解码\
  \ RNN 应用于单个 Token，并传递解码器的当前隐藏状态（初始为编码向量）以及当前 Token 的嵌入向量。解码器的结果由输出投影处理，并提供词表中 Token\
  \ 的原始值。这并不是一个概率分布，因为我们没有应用 `softmax` 函数，而是原始值（也称为 Logits）。该函数的返回值是 Logits 和解码器返回的新隐藏状态。为了从\
  \ Logits 导出 Token-ID，我们使用 `argmax`。如果使用采样，则可以使用以下代码：\n\n```python\ndef decode_chain_sampling(self,\
  \ hid, begin_emb, seq_len,\n                                     stop_at_token=None):\n\
  \    res_logits = []\n    res_tokens = []\n    cur_emb = begin_emb\n\n    for _\
  \ in range(seq_len):\n        out_logits, hid = self.decode_one(hid, cur_emb)\n\
  \        out_probs_v = F.softmax(out_logits, dim=1)\n        out_probs = out_probs_v.data.cpu().numpy()[0]\n\
  \        action = int(np.random.choice(out_probs.shape[0],\n                   \
  \                          p=out_probs))\n        action_v = torch.LongTensor([action])\n\
  \        action_v = action_v.to(begin_emb.device)\n        cur_emb = net.emb(action_v)\n\
  \n        res_logits.append(out_logits)\n        res_tokens.append(action)\n   \
  \     if stop_at_token is not None:\n            if action == stop_at_token:\n \
  \               break\n    return torch.cat(res_logits), res_tokens\n```\n\n在解码循环的每次迭代中，我们将解码\
  \ RNN 应用于单个 Token，并传递解码器的当前隐藏状态（初始为编码向量）以及当前 Token 的嵌入向量。解码器的结果由输出投影处理，并提供词表中 Token\
  \ 的原始值。这并不是一个概率分布，因为我们没有应用 `softmax` 函数，而是原始值（也称为 Logits）。为了从 Logits 导出 Token-ID，我们使用\
  \ `argmax`。如果使用采样，则可以使用上述代码：\n\n`decode_chain_sampling` 方法解码一个编码序列，不使用 `argmax`，而是根据概率分布进行采样。\n\
  \n除了 `PhraseModel` 类之外，`model.py` 文件包含了几个函数，用于为模型准备输入。输入必须以张量形式存在，以便 PyTorch 的 RNN\
  \ 机制正常工作。\n\n```python\ndef pack_batch_no_out(batch, embeddings, device=\"cpu\"\
  ):\n    assert isinstance(batch, list)\n    # 按第一个句子长度降序排序（为了 CuDNN）\n    batch.sort(key=lambda\
  \ s: len(s[0]), reverse=True)\n    input_idx, output_idx = zip(*batch)\n\n    #\
  \ 创建填充的输入矩阵\n    lens = list(map(len, input_idx))\n    input_mat = np.zeros((len(batch),\
  \ lens[0]), dtype=np.int64)\n    for idx, x in enumerate(input_idx):\n        input_mat[idx,\
  \ :len(x)] = x\n\n    return torch.LongTensor(input_mat).to(device)\n```\n\n\n\n\
  \nDann erstellen wir eine Matrix mit den Dimensionen `[batch, max_input_phrase]`\
  \ und weisen ihr unsere Eingabesätze zu. Weil die Sequenzen unterschiedlich lang\
  \ sind, wird die Matrix bei kürzeren Sequenzen bis zur maximalen Länge mit Nullen\
  \ aufgefüllt (als »Padding» bezeichnet).\n\n```python\ninput_v = torch.tensor(input_mat).to(device)\n\
  input_seq = rnn_utils.pack_padded_sequence(input_v, lens,\n                    \
  \                       batch_first=True)\n```\n\nDer nächste Schritt ist, die Matrix\
  \ als PyTorch-Tensor zu packen und spezielle Funktionen des RNN-Moduls zu verwenden,\
  \ um sie von der aufgefüllten in eine gepackte Form zu konvertieren. Die Sequenzen\
  \ werden dann spaltenweise gespeichert (also in transponierter Form), wobei die\
  \ Länge erhalten bleibt. In der ersten Zeile befinden sich beispielsweise die ersten\
  \ Tokens der Sequenzen. In der zweiten Zeile befinden sich die Tokens an der zweiten\
  \ Position von Sequenzen, die länger als 1 sind, und so weiter. Diese Repräsentation\
  \ ermöglicht es CuDNN, die rekurrenten neuronalen Netze äußerst effizient und einen\
  \ Batch von Sequenzen auf einmal zu verarbeiten.\n\n```python\n# Embeddings nachschlagen\n\
  r = embeddings(input_seq.data)\nemb_input_seq = rnn_utils.PackedSequence(\n    r,\
  \ input_seq.batch_sizes)\nreturn emb_input_seq, input_idx, output_idx\n```\n\nAm\
  \ Ende der Funktion konvertieren wir die Daten von Integer-Token-IDs in Embeddings,\
  \ was in einem Schritt erfolgen kann, denn die Token-IDs sind ja im Tensor »verpackt«.\
  \ Dann geben wir das resultierende Tupel mit drei Objekten zurück: die gepackte\
  \ Sequenz, dem dem Encoder übergeben wird, und zwei Listen mit den Integer-Token-IDs\
  \ für die Eingabe- und die Ausgabesequenz.\n\n```python\ndef pack_input(input_data,\
  \ embeddings, device=\"cpu\"):\n    input_v = torch.LongTensor([input_data]).to(device)\n\
  \    r = embeddings(input_v)\n    return rnn_utils.pack_padded_sequence(\n     \
  \   r, [len(input_data)], batch_first=True)\n```\n\nDie obige Funktion konvertiert\
  \ den als Liste von Token-IDs codierten Satz in die gepackte Sequenz, die zur Übergabe\
  \ an das RNN geeignet ist.\n\n```python\ndef pack_batch(batch, embeddings, device=\"\
  cpu\"):\n    emb_input_seq, input_idx, output_idx =\n                 pack_batch_no_out(batch,\
  \ embeddings, device)\n\n    # Ausgabesequenz mit entfernten #END-Tokens vorbereiten\n\
  \    output_seq_list = []\n    for out in output_idx:\n        s = pack_input(out[:-1],\
  \ embeddings, device)\n        output_seq_list.append(s)\n    return emb_input_seq,\
  \ output_seq_list, input_idx,\n                                                \
  \   output_idx\n```\n\nDie nächste Funktion verwendet die `pack_batch_no_out()`-Methode,\
  \ konvertiert aber zusätzlich die Ausgabeindizes in eine Liste gepackter Sequenzen,\
  \ die im Teacher-Forcing-Modus des Trainings verwendet wird. Bei diesen Sequenzen\
  \ ist das `#END`-Token entfernt.\n\n```python\ndef seq_bleu(model_out, ref_seq):\n\
  \    model_seq = torch.max(model_out.data, dim=1)[1]\n    model_seq = model_seq.cpu().numpy()\n\
  \    return utils.calc_bleu(model_seq, ref_seq)\n```\n\nUnd schließlich die letzte\
  \ Funktion in `model.py`, die den BLEU-Score anhand des Tensors mit Logits berechnet,\
  \ der der Decoder im Teacher-Forcing-Modus liefert. Die Logik ist ganz einfach:\
  \ Sie ruft `argmax` auf, um die Sequenzindizes zu erhalten, und verwendet dann die\
  \ Funktion zur Berechnung der BLEU aus `utils`.\n\n## 14.6 Daten überprüfen\n\n\
  Es ist immer sinnvoll, die Datenmenge aus verschiedenen Perspektiven zu betrachten\
  \ und beispielsweise Statistiken oder Diagramme zu erstellen oder sie nur genau\
  \ zu nehmen, um Aufgaben besser zu verstehen. Das Programm `cor_reader.py` unterstützt\
  \ eine minimale Funktionalität zur Datenanalyse. Wenn Sie es mit der Option `--show-genres`\
  \ ausführen, wird eine Liste aller Genres und die Anzahl dazhörigen Filme angezeigt,\
  \ die nach der Zahl der Filme in absteigenderfolge sortiert ist. Hier sind die ersten\
  \ Einträge:\n\n```bash\n$ ./cor_reader.py --show-genres\ndrama: 320\nthriller: 269\n\
  action: 168\ncomedy: 162\ncrime: 147\nromance: 132\nsci-fi: 120\nadventure: 116\n\
  mystery: 102\nhorror: 99\n```\n\nDie Option `--show-dials` zeigt Dialoge aus den\
  \ Filmen ohne Vorverarbeitung an, zwar in der Reihenfolge, in der sie in Datenbank\
  \ gespeichert sind. Die Anzahl der Dialoge ist groß, deshalb sollten Sie die Option\
  \ `-g` verwenden, um nach Genre zu filtern. Hier sind beispielsweise zwei Dialoge\
  \ aus Komödien:\n\n```bash\n$ ./cor_reader.py -g comedy --show-dials |\nhead -n\
  \ 10\nDialog 0 with 4 phrases:\ncan we make this quick? roxanne and barrett are\
  \ having\nan incredibly public break - up on the quad .\nwell , i thought we'd start\
  \ with pronunciation , that's okay with\nyou .\nnot the hacking and gagging and\
  \ spitting out.\nDialog 1 with two phrases:\nyou're asking me out . that's so cute\
  \ .\nwhat's name ?\n```\n\nDurch Angabe der Option `--show-train` können Sie die\
  \ Trainingspare überprüfen, die nach ersten Satz gruppiert und nach Anzahl in absteigfolge\
  \ sortiert sind. Auf die Daten wurden Filter für Häufigkeit (mindestens 10 Vommen)\
  \ und Satzlänge (höchstens 20 Tokens) angewendet. Hier ist ein Auszug der Ausgabe\
  \ für das Genre `family`:\n\n```bash\n$ ./cor_reader.py -g family --show-train |\n\
  head -n 20\nTraining pairs (558 total)\n0: #BEG yes . #END\n: #BEG you will ...\
  \ be safe . #END\n: #BEG oh well then , one won't matter . #END\n: #BEG you've gotta\
  \ stop this , there's absolutely wrong\nwith you ! #END\n: #BEG good . #END\n: #BEG\
  \ he's getting big . vada , come here and sit down for minute\n. #END\n: #BEG who's\
  \ that with your dad ? #END\n: #BEG for this . #END\n: #BEG didn't i tell you ?\
  \ i'm always right , you know , my dear ...\naren't i ? #END\n: #BEG oh , i hope\
  \ we got in time . #END\n: #BEG oh - look at him ! this is terrible ! #END\n1: #BEG\
  \ no . #END\n: #BEG were they pretty ? #END\n: #BEG it's there . #END\n: #BEG why\
  \ do you think she says that ? #END\n: #BEG come here , sit down . #END\n: #BEG\
  \ what's wrong with your eyes ? #END\n: #BEG maybe we should , just to see what's\
  \ the big deal . #END\n: #BEG why not ? #END\n```\n\nWie Sie sehen, gibt es schon\
  \ in kleinen Teilmenge der Daten Sätze mit mehreren Antwortmöglichkeiten. Die letzte\
  \ von `cor_reader.py` unterstützte Option ist `--show-dict-freq`, die ausgibt, wie\
  \ oft Wörter vorkommen (sortiert nach Häufigkeit).\n\n```bash\n$ ./cor_reader.py\
  \ -g family --show-dict-freq | head -n 10\nFrequency stats for 772 tokens in the\
  \ dict\n.: 1907\n,: 1175\n?: 1148\nyou: 840\n!: 758\ni: 653\n-: 578\nthe: 506\n\
  a: 414\n```\n\n## 14.7 Training: Kreuzentropie\n\nIn `train_crossent.py` ist das\
  \ Kreuzentropie-Verfahren als erste Näherung des Modells implementiert. Während\
  \ des Trainings wechseln wir zufällig zwischen Teacher-Forcing-Modus (mit Übergabe\
  \ der Zielsequenz als Eingabe des Decoders) und `argmax`-Decodierung (wobei wir\
  \ die Sequenz schrittweise decodieren und jeweils das Token mit der größten Wahrscheinlichkeit\
  \ in der Ausgabeverteilung auswählen).\n\n\n\n\n\n```python\ndef run_test(test_data,\
  \ net, end_token, device=\"cpu\"):\n    bleu_sum = 0.0\n    bleu_count = 0\n   \
  \ for p1, p2 in test_data:\n        input_seq = model.pack_input(p1, net.emb, device)\n\
  \        enc = net.encode(input_seq)\n        _, tokens = net.decode_chain_argmax(enc,\n\
  \            input_seq.data[0:1],seq_len=data.MAX_TOKENS,\n            stop_at_token=end_token)\n\
  \        bleu_sum += utils.calc_bleu(tokens, p2[1:])\n        bleu_count += 1\n\
  \    return bleu_sum / bleu_count\n```\n\n`run_test` 方法在每个 epoch 中被调用，用于计算保留数据量（默认为加载数据的\
  \ 5%）的平均 BLEU 分。\n\n```python\nif __name__ == \"__main__\":\n   fmt = \"%(asctime)-15s\
  \ %(levelname)s %(message)s\"\n   logging.basicConfig(format=fmt, level=logging.INFO)\n\
  \   parser = argparse.ArgumentParser()\n   parser.add_argument(\"--data\", required=True,\n\
  \                       help=\"训练的类别。 \"\n                       \"空字符串 = 完整数据集)\n\
  \   parser.add_argument(\"--cuda\", action='store_true',\n                     \
  \  default=False, help=\"启用 CUDA\")\n   parser.add_argument(\"-n\", \"--name\",\
  \ required=True,\n                        help=\"运行名称\")\n   args = parser.parse_args()\n\
  \   device = torch.device(\"cuda\" if args.cuda else \"cpu\")\n\n   saves_path =\
  \ os.path.join(SAVES_DIR, args.name)\n   os.makedirs(saves_path, exist_ok=True)\n\
  ```\n\n该程序允许指定要训练的电影类型，并为当前训练任务命名，以便在 TensorBoard 中显示以及定期保存模型参数的目录名称。\n\n```python\n\
  phrase_pairs, emb_dict =\n                       data.load_data(genre_filter=args.data)\n\
  log.info(\"%d 句子对，包含 %d 个唯一单词\",\n                            len(phrase_pairs),\
  \ len(emb_dict))\ndata.save_emb_dict(saves_path, emb_dict)\nend_token = emb_dict[data.END_TOKEN]\n\
  train_data = data.encode_phrase_pairs(phrase_pairs, emb_dict)\n```\n\n处理完参数后，我们加载指定类型的数据集，保存嵌入字典（Token\
  \ 字符串到 Token ID 的映射），并对句子对进行编码。现在数据存储在包含两个条目的元组列表中。而这些条目本身是 Token ID 列表。\n\n```python\n\
  rand = np.random.RandomState(data.SHUFFLE_SEED)\nrand.shuffle(train_data)\nlog.info(\"\
  训练数据转换完成，%d 个示例\",\n                                            len(train_data))\n\
  train_data, test_data = data.split_train_test(train_data)\nlog.info(\"训练集包含 %d 个句子，测试集包含\
  \ %d 个\",\n                            len(train_data), len(test_data))\n```\n\n\
  加载数据后，我们将其分为训练集和测试集，并使用固定的随机数生成器起始值进行打乱（以便在 RL 训练中重现相同的打乱顺序）。\n\n```python\nnet\
  \ = model.PhraseModel(emb_size=model.EMBEDDING_DIM,\n                          \
  \   dict_size=len(emb_dict),\n         hid_size=model.HIDDEN_STATE_SIZE).to(device)\n\
  log.info(\"模型: %s\", net)\nwriter = SummaryWriter(comment=\"-\" + args.name)\noptimiser\
  \ = optim.Adam(net.parameters(), lr=LEARNING_RATE)\nbest_bleu = None\n```\n\n然后我们创建模型，并传递嵌入维度、字典大小以及编码器和解码器的隐藏层大小。\n\
  \n```python\nfor epoch in range(MAX_EPOCHES):\n    losses = []\n    bleu_sum = 0.0\n\
  \    bleu_count = 0\n    for batch in data.iterate_batches(train_data,BATCH_SIZE):\n\
  \        optimiser.zero_grad()\n        input_seq, out_seq_list, _, out_idx =\n\
  \                     model.pack_batch(batch, net.emb, device)\n        enc = net.encode(input_seq)\n\
  ```\n\n我们的训练循环执行设定的 epoch 次，每个 epoch 遍历一批编码后的句子对。\n\n每个 batch 都通过 `model.pack_batch()`\
  \ 进行打包。该函数返回打包后的输入序列、打包后的输出序列以及包含输入和输出 Token 索引的列表。为了获取 batch 中输入序列的编码表示，我们调用 `net.encode()`。随后输入序列通过编码器，我们获得\
  \ RNN 最后一次应用的隐藏状态。该隐藏状态格式为 `(batch_size, model.HIDDEN_STATE_SIZE)`。\n\n```python\n\
  net_results = []\nnet_targets = []\nfor idx, out_seq in enumerate(out_seq_list):\n\
  \    # 在此处处理解码逻辑（伪代码逻辑示例）\n    if random.random() < TEACHER_PROB:\n        r = net.decode_teacher(enc)\n\
  \        bleu_sum += utils.calc_bleu(r, ref_indices)\n    else:\n        r, seq\
  \ = net.decode_chain_argmax(enc)\n        bleu_sum += utils.calc_bleu(seq, ref_indices)\n\
  ```\n\n在上面的代码中，我们随机决定使用哪种方法：Teacher Forcing 或课程学习。Teacher Forcing 模式下，`decode_teacher()`\
  \ 返回 logits。在课程学习模式下，`decode_chain_argmax()` 返回 logits 和 Token ID 列表。\n\n```python\n\
  net_results.append(r)\nnet_targets.extend(ref_indices)\nbleu_count += 1\n```\n\n\
  在序列处理结束时，我们将生成的 logits 和参考索引收集起来，稍后计算损失。\n\n```python\nresults_v = torch.cat(net_results)\n\
  targets_v = torch.LongTensor(net_targets).to(device)\nloss_v = F.cross_entropy(results_v,\
  \ targets_v)\nloss_v.backward()\noptimiser.step()\nlosses.append(loss_v.item())\n\
  ```\n\n此时一个 batch 的处理完成。\n\n```python\nbleu = bleu_sum / bleu_count\nbleu_test =\
