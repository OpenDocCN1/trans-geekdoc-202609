  \ f/s, elapsed=0:17:43\nEpisode 29480: reward=-136, steps=146, speed=4259.0 f/s,\
  \ elapsed=0:17:43\n```\n\n### 21.4.7 带有网络蒸馏的 PPO 方法\n\n\n\n\n作为探索 MountainCar 环境的最后一种方法，我实现了前述工作\
  \ [\\[4\\]](#21.xhtml#BGBBEBJH) 中提到的所谓网络蒸馏方法。在该方法中，使用了两个额外的 `NN`，它们将观测值映射到一个数值，就像价值（Values）输出一样。区别在于它们的使用方式。第一个\
  \ `NN` 使用随机值初始化且不进行训练，它作为参考 `NN`。第二个 `NN` 则经过训练，以最小化相对于第一个 `NN` 的 MSE 损失。此外，两个网络输出差的绝对值被用作内在奖励。\n\
  \n其基本原理非常简单：智能体对某个状态的探索越充分，第二个 `NN` 就能越好地预测第一个 `NN` 的输出。这导致内在奖励对总奖励的贡献变小，从而减小了分配给示例的策略梯度。\n\
  \n在相应论文中，作者建议训练不同的输出来预测内在奖励和外部奖励的值。然而，在本示例中，我决定不让任务复杂化，而是直接将两种奖励都添加到包装器中，就像基于计数器的探索方法一样。这最大限度地减少了对代码的修改次数。\n\
  \n对于额外的 `NN` 架构，我进行了一个小实验，并为两个 `NN` 尝试了不同的架构。使用三层参考 `NN` 和仅一层的已训练 `NN` 获得了最佳结果。这样可以更容易防止训练过的\
  \ `NN` 的过拟合，因为观测空间并不大。\n\n两个 `NN` 都实现在 `Chapter21/lib/ppo.py` 模块的 `MountainCarNetDestillery`\
  \ 类中。\n\n```python\nclass MountainCarNetDistillery(nn.Module):\n    def __init__(self,\
  \ obs_size: int, hid_size: int = 128):\n        super(MountainCarNetDistillery,\
  \ self).__init__()\n\n        self.ref_net = nn.Sequential(\n            nn.Linear(obs_size,\
  \ hid_size),\n            nn.ReLU(),\n            nn.Linear(hid_size, hid_size),\n\
  \            nn.ReLU(),\n            nn.Linear(hid_size, 1),\n        )\n      \
  \  self.ref_net.train(False)\n\n        self.trn_net = nn.Sequential(\n        \
  \    nn.Linear(obs_size, 1),\n        )\n\n    def forward(self, x):\n        return\
  \ self.ref_net(x), self.trn_net(x)\n\n    def extra_reward(self, obs):\n       \
  \ r1, r2 = self.forward(torch.FloatTensor([obs]))\n        return (r1 - r2).abs().detach().numpy()[0][0]\n\
  \n    def loss(self, obs_t):\n        r1_t, r2_t = self.forward(obs_t)\n       \
  \ return F.mse_loss(r2_t, r1_t).mean()\n```\n\n代码非常简单：除了返回两个 `NN` 输出的 `forward()`\
  \ 方法外，该类还包含两个辅助方法，用于计算内在奖励和确定两个网络的损失。\n\n要启动训练，必须向程序 `mcar_ppo.py` 传递参数 `-p distill`。在我的实验中，代码花费了四个小时解决了环境，虽然比其他方法慢，但这种变慢是由我们必须完成的额外任务造成的。它需要\
  \ 63,000 个回合（Epis），这与带有噪声的网络以及基于计数器的方法相当。\n\n像往常一样，我的实现中可能存在 Bug 和缺陷。因此欢迎大家改进它。\n\
  \n```\nEpisode 62991: reward=-66, steps=122, speed=2468.0 f/s, elapsed=4:11:50\n\
  Episode 62992: reward=-42, steps=122, speed=2487.0 f/s, elapsed=4:11:50\nEpisode\
  \ 62993: reward=-66, steps=116, speed=2505.0 f/s, elapsed=4:11:50\nEpisode 62994:\
  \ reward=-70, steps=123, speed=2522.0 f/s, elapsed=4:11:50\nEpisode 62995: reward=-66,\
  \ steps=118, speed=2540.0 f/s, elapsed=4:11:50\nEpisode 62996: reward=-70, steps=125,\
  \ speed=2556.0 f/s, elapsed=4:11:50\nTest done: reward=-118, steps=93, max_reward=15.8\n\
  ```\n\n## 21.5 Atari 实验\n\n对于 Atari 游戏，每个实验至少需要一天的时间来研究影响，因此我的代码和超参数并不理想。如果你发现了改进代码的方法，请在\
  \ GitHub 上分享你的发现。\n\n有两个程序：`Chapter21/atari_dqn.py` 实现了带有 $\\epsilon$-Greedy 和噪声网络的\
  \ DQN 方法，而 `Chapter21/atari_ppo.py` 实现了带有可选噪声网络和网络蒸馏的 PPO 方法。更改超参数需要命令行选项 `-p`。\n\
  \n以下是使用我的代码得到的 get。\n\n### 21.5.1 使用 ε-Greedy 方法的 DQN 方法\n\n惊讶的是，ε-Greedy 方法表现出了相当好的行为。通过使用具有百万条目容量的回放缓冲区以及在前百万步中从\
  \ `1.0` 减少到 `0.02` 的 $\\epsilon$ 值，我发现了环境是如何被激活的。在训练图表中，560 步的边界几乎不可见（在其他方法中可见的）。在训练\
  \ 13 小时后，ε-Greedy 方法能够获得 12 到 15 的平均奖励，这是一个相当不错的结果。然而，训练过程并不稳定，这可能表明需要优化超参数以获得更好的结果。\n\
  \n在 DQN 版本中，使用了带有 n 步（`n=4`）的竞争性双 DQN。\n\n\n\n\n## 图 21.24: Seaquest 环境下带有 $\\epsilon$-Greedy\
  \ 策略的 DQN 奖励与步骤\n\n遗憾的是，我没有对带有噪声的网络的 DQN 算法进行足够的测试，但该方法已经实现，并且可以通过选项 `-p` `noisynet`\
  \ 激活。在参数调优得当的情况下，它的表现可能会好得多。\n\n另一种改进方法是使用优先经验回放池（Prioritized Replay Buffer），因为实际上成功的案例相当稀少。无论如何，这里还有许多其他实验可以供你进行练习之用。\n\
  \n### 节 21.5.2 经典的 PPO 算法\n\n带有熵正则化的经典 PPO 算法在训练过程中表现出更稳定的行为。在训练 13 小时后，它达到了 18\
  \ 到 19 的平均奖励。同时，在回合步数（Episodenschritte）上存在一个明显的局限性，这在策略进一步改进时可能会导致问题。很可能是熵正则化系数（$\\\
  beta=0.1$）太大了，应该减小。\n\n![图片](img/21_27.jpg)\n\n**图 21.25:** 训练期间 PPO 算法的奖励与步骤\n\n\
