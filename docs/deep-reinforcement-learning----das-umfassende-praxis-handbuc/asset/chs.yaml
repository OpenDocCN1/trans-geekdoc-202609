  \ 2：训练期间的速度\n\n### 8.2 N 步 DQN\n\n我们所实现并评估的第一个改进已经相当久远了。它是在 Richard Sutton (1988)\
  \ 的论文 *Learning to Predict by the Methods of Temporal Differences* 中被提介绍的。为了理解它，我们再次看一眼\
  \ `Q-Learning` 中使用的 Bellman 更新：\n\n该方程是递归的，这意味着我们可以通过自我表示它。由此得出：\n\n值 `r[a,t+1]`\
  \ 表示执行动作 `a` 后在 `t+1` 时刻的局部奖励。然而，如果我们假设动作 `a` 在步长 `t+1` 时是最优的（或接近最优的），那么我们就可以省略\
  \ `max[a]` 操作并得到：\n\n该方程可以无限次应用，并用于更新我们的 DQN，其方法是将一个单步转换替换为一系列 `n` 步的转换序列。为了理解为什么这可以加速训练，我们查看图\
  \ 8.3。这是一个包含状态 `s[1]`、`s[2]`、`s[3]` 和 `s[4]` 的简单环境。在前三个状态中，只有动作 `a` 可用。在最后一个状态中没有动作可用，因为\
  \ `s[4]` 是终止状态。\n\n图 3：简单环境的转换图\n\n\n\n\n存在两大类算法：离策略（Off-Policy）和同策略（On-Policy）。离策略算法不取决于数据的时效性。例如，简单的\
  \ `DQN` 就是一种离策略算法。这意味着我们可以使用数百万步之前从环境中获取的旧数据。但这些数据仍然适用于学习。这是因为我们仅通过即时奖励和最佳动作的折现当前近似值来更新动作的值\
  \ `Q(s[t],a[t])`。即使动作 `a[t]` 是随机抽取的，也没有关系，因为对于状态 `s[t]` 下特定的动作 `a[t]` 来说，更新是正确的。因此，在离策略算法中，我们可以使用非常大的经验池（Buffer），使得我们的数据尽可能能够**独立同分布**（英文\
  \ *independent and identically distributed*, i.i.d.）。\n\n相比之下，同策略算法高度依赖于样本是根据当前策略从训练数据中提取。这是因为同策略算法试图间接地（如\
  \ N 步 DQN）或直接来改进当前策略（本书的第三部分专门介绍了这类算法）。\n\n哪类算法更好？这取决于情况。离策略算法允许利用现有的（甚至是较旧的）大量数据进行训练，但它们的收敛速度通常较慢。同策略算法通常更快，但需要来自环境中更多新的数据，而获取这些数据可能非常耗时。例如，想象一辆用同策略算法训练的自动驾驶汽车。在系统学会墙壁和树是应该避开的物体之前，会发生一系列碰撞损毁。\n\
  \n你可能会问，既然通过这 N 步操作会变成同策略算法，并让大型经验池变得无用，那么我们为什么还要研究 N 步 DQN 呢？在实践中，这并不是非黑即白的问题。你仍然可以使用\
  \ N 步 DQN，但在选择 `n` 时应该保持谨慎。像二或三这样的小值通常效果良好，因为经验池中过程的轨迹与单步转换的差异并不大。在这种情况下，收敛速度随 `n`\
  \ 成比例增加，但 `n` 的取值过大可能会导致训练失败。因此，步数必须精确确定，但由于收敛速度更快，这种努力通常是值得的。\n\n### 8.2.1 实现\n\
  \n由于 `ExperienceSourceFirstLast` 类已经支持将贝尔曼方程应用于多个后续步骤，因此我们的 N 步 DQN 版本特别简单。我们只需要进行两处修改即可将简单的\
  \ DQN 变为 N 步 DQN。\n\n*   必须通过参数 `steps_count` 向 `ExperienceSourceFirstLast` 传递步数。\n\
  *   必须向函数 `calc_loss_dqn` 传递正确的 `gamma` 值。这个变化非常容易忽略，但它对收敛至关重要。由于我们现在使用了 n 步，经验轨迹中最后一个状态的折现系数不再仅仅是\
  \ `γ`，而是 `γ^n`。\n\n文件 `Chapter08/02_dqn_n_steps.py` 包含了完整的示例。这里是修改后的行：\n\n```\n\
  exp_source = ptan.experience.ExperienceSourceFirstLast(env,\n            agent,\
  \ gamma=params['gamma'], steps_count=args.n)\n```\n\n值 `args.n` 是通过命令行传递的步数。默认使用四步。另一个修改涉及将\
  \ `gamma` 传递给函数 `calc_loss_dqn`：\n\n```\nloss_v = common.calc_loss_dqn(\n    batch,\
  \ net, tgt_net.target_model,\n    gamma=params.gamma**args.n, device=device)\n```\n\
