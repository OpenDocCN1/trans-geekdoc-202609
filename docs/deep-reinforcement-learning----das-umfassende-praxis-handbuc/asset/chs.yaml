  \ 15 欧元。\n\n（注：由于提供的原文中存在大量重复段落，译文已根据“不要重复输出原文”的指令进行了去重处理。）\n\n---\n\n这听起来非常有吸引力，特别是当我们考虑通常的强化学习（RL）任务时：我们拥有传感器观测数据，可以通过执行器执行动作，并且我们必须定义某种通用的奖励，这种奖励对于要解决的任务是有意义的。。所有这些都由一个强化学习方法提供，然后大功告成！当然，我极大地简化了整个过程；其实有许多细节需要注意，但整体概念应该是显而易见的。\n\
