  \ Verfahren\n\nWas ist Reinforcement Learning\n\nIn diesem Kapitel haben Sie das\
  \ erste RL-Verfahren kennengelernt, das Kreuzentropie-Verfahren, das zwar einfach\
  \ aber trotz seiner Einschränkungen ziemlich leistungsfähig ist. Wir haben es (sehr\
