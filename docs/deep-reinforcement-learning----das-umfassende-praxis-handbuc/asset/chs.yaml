  \ [`pytorch.org/ecosystem`](https://pytorch.org/ecosystem) 找到。\n\n从一开始就使用这些高级别库可能很有吸引力，因为它们允许用几行代码就解决典型任务，但这并非易事。如果你只知道如何使用这些高级库，而不理解底层实际上到底发生了什么，那么很容易在那些用标准程序就能解决的任务上遇到瓶颈。在机器学习（ML）这样一个如此活跃的领域，这种情况经常发生。\n\
  \n本书重点侧重于让你理解强化学习（RL）算法及其实现和适用性，因此我们将采用渐进式的方法。首先，我们将用纯 PyTorch 代码实现算法。然后我们将继续实现使用高级别库的示例。在强化学习中，我们将使用一个由我开发的微型库：`PTAN`\
  \ ([`github.com/Shmuma/ptan/`](https://github.com/Shmuma/ptan/))。\n\n\n\n首先，我们导入一些\
  \ Ignite 类。`Engine` 和 `Events` 已经过简要描述。`ignite.metrics` 包包含了用于使用训练过程指标的各种类，如混淆矩阵、准确率和召回率。在示例中，我们将使用\
  \ `RunningAverage` 类，它允许平滑时间序列的值。在上一个示例中，我们为了这个目的对包含损失函数值的数组应用了 `np.mean`，但 `RunningAverage`\
  \ 提供了一种更舒适（且数学上更正确）的方法来完成任务。此外，我们还从 Ignite 的 `contrib` 包（包含第三方贡献的功能）导入了 `tensorboard_logger`。\n\
  \n```python\ndef process_batch(trainer, batch):\n    gen_input_v = torch.FloatTensor(\n\
  \        BATCH_SIZE, LATENT_VECTOR_SIZE, 1, 1)\n    gen_input_v.normal_(0, 1).to(device)\n\
  \    batch_v = batch.to(device)\n    gen_output_v = net_gener(gen_input_v)\n\n \
  \   dis_optimizer.zero_grad()\n    dis_output_true_v = net_discr(batch_v)\n    dis_output_fake_v\
  \ = net_discr(gen_output_v.detach())\n    dis_loss = objective(dis_output_true_v,\
  \ true_labels_v) +\\\n               objective(dis_output_fake_v, fake_labels_v)\n\
  \    dis_loss.backward()\n    dis_optimizer.step()\n\n    gen_optimizer.zero_grad()\n\
  \    dis_output_v = net_discr(gen_output_v)\n    gen_loss = objective(dis_output_v,\
  \ true_labels_v)\n    gen_loss.backward()\n    gen_optimizer.step()\n\n    if trainer.state.iteration\
  \ % SAVE_IMAGE_EVERY_ITER == 0:\n        fake_img = vutils.make_grid(\n        \
  \    gen_output_v.data[:64], normalize=True)\n        trainer.tb.writer.add_image(\n\
  \            \"fake\", fake_img, trainer.state.iteration)\n        real_img = vutils.make_grid(\n\
  \            batch_v.data[:64], normalize=True)\n        trainer.tb.writer.add_image(\n\
  \            \"real\", real_img, trainer.state.iteration)\n        trainer.tb.writer.flush()\n\
  \    return dis_loss.item(), gen_loss.item()\n```\n\n下一步，我们需要定义一个处理函数，根据数据批次更新判别器和生成器模型。该函数可以返回任何想要在训练期间记录的数据。在这种情况下，这些是两个模型的损失函数值。在此函数中，我们还可以保存显示在\
  \ TensorBoard 中的图像。\n\n完成这些后，我们只需要创建一个 `Engine` 实例，设置必要的处理器并启动训练过程即可。\n\n```python\n\
  engine = Engine(process_batch)\ntb = tb_logger.TensorboardLogger(log_dir=None)\n\
  engine.tb = tb\nRunningAverage(output_transform=lambda out: out[0]).\\\n    attach(engine,\
  \ \"avg_loss_gen\")\nRunningAverage(output_transform=lambda out: out[1]).\\\n  \
  \  attach(engine, \"avg_loss_dis\")\n\nhandler = tb_logger.OutputHandler(tag=\"\
  train\",\n    metric_names=['avg_loss_gen', 'avg_loss_dis'])\ntb.attach(engine,\
  \ log_handler=handler,\n          event_name=Events.ITERATION_COMPLETED)\n```\n\n\
  该代码创建了一个 `Engine`，传递了处理函数并为两个损失函数值设置了两个 `RunningAverage` 转换。随后，每次调用 `RunningAverage`\
  \ 产生一个所谓的“指标”，即在训练过程中保留的派生值。平滑指标的名称为 `avg_loss_gen`（针对生成器）和 `avg_loss_dis`（针对判别器）。这两个值会在每次迭代后显示在\
  \ TensorBoard 中。\n\n```python\n@engine.on(Events.ITERATION_COMPLETED)\ndef log_losses(trainer):\n\
  \    if trainer.state.iteration % REPORT_EVERY_ITER == 0:\n        log.info(\"%d:\
  \ gen_loss=%f, dis_loss=%f\",\n                 trainer.state.iteration,\n     \
  \            trainer.state.metrics['avg_loss_gen'],\n                 trainer.state.metrics['avg_loss_dis'])\n\
  \nengine.run(data=iterate_batches(envs))\n```\n\n这段代码设置了另一个事件处理器，即我们的处理函数，它会在 `Engine`\
  \ 每次迭代完成后被调用。它会向日志中写入一行，其中包含迭代索引和平滑指标的值。最后一行启动了 `Engine`并将已定义的函数作为数据源传递进去（`iterate_batches`\
  \ 是一个返回批次正常迭代迭代的生成器，因此将输出作为参数 `data` 传递是完全没问题的）。\n\n就这些了。如果您想查看示例 `Chapter03/04_atari_gan_ignite`...\n\
  \n\n\n\n\n`modellfrei`（无模型）一词意味着，该方法并不开发环境模型或奖励状态转移模型；它仅仅是建立动作直接与观测值（或与动作相关的数值）之间的映射。换句话说：智能体对当前观测值进行计算，其结果就是应该执行的动作。相比之下，`modellbasierte`（基于模型）的方法试图预测下一次观测值和/或奖励。智能体尝试根据这些预测来选择最佳的动作。在此过程中，通常会进行多次预测，以展望更远远的未来。\n\
  \n这两种方法各有优缺点，但在确定性环境中，通常使用纯粹基于模型的方法，例如在规则严格的棋牌类游戏中。另一方面，无模型方法更容易训练，因为对于具有广泛观测值的复杂环境，要开发出良好的模型是非常困难的。本书中描述的所有方法都属于无模型类别，因为它们在过去几年里是最活跃的研究领域。直到最近，研究人员才开始尝试结合这两者的优点。（例如，参阅\
  \ DeepMind 关于智能体想象力的文章。）这种方法将在第 22 节中的`超越无模型方法——想象` 中进行描述。\n\n`Policybasierte`（基于策略）方法试图尽可能直接地实现智能体的策略（Policy），也就是说选择智能体在每一步中执行的尽可能合适的动作。策略通常由可用动作的概率分布来表示。\n\
  \n相比之下，一种方法也可以是`wertebasiert`（基于价值）的。在这种情况下，智能体不使用概率，而是计算所有可能动作的值，并选择值最好的那一个。这两种方法都很常见，我将在本书的下部分讨论基于价值的方法。第三部分的主题是关于基于策略的方法。\n\
  \n方法的另一项重要分类涉及 `on-policy`（策略内）和 `off-policy`（策略外）。这种区别的含义我将在本书的第二部分和第三部分讨论。首先，只需要明确，off-policy\
  \ 描述的是方法从旧数据（由智能体的早期版本生成、由人工记录或由同一智能体在之前获取的某些回合）中学习的能力。\n\n因此，交叉熵方法是无模型、基于策略且策略内的，这意味着：\n\
  \n* 没有对环境进行建模；仅告诉智能体在每一步中应该做什么。\n* 方法试图实现智能体的策略。\n* 方法需要来自环境的新数据。\n\n## 4.2 实践中的交叉熵\n\
  \n交叉熵方法的描述分为实操部分和理论部分。实操部分直观，而关于交叉熵方法如何工作以及为何生效的理论解释则更为复杂。\n\n如你所知，智能体在强化学习中起着至关重要的作用。它试图通过与环境交互来获得最大的奖励。在实践中，我们遵循常见的机器学习方法，用一个非线性的可训练函数来替代智能体所有复杂的部分，该函数将智能体的输入（环境观测值）映射到输出。该函数的输出具体细节取决于采用的方法，正如上一节所述（例如，是基于价值的还是基于策略的）。由于交叉熵方法是基于策略的，因此非线性函数（神经网络）提供了一个`Policy`，它本质上说明了在特定观测值下智能体应该执行哪个动作。\n\
  \n![\\[图像\\]](Images/04_01.jpg)\n\n**图 4.1:** 一种通 RL 方法\n\n在实践中，策略通常表示为动作的概率分布。这与分类任务有很相似之处，其中类别的数量对应可执行动作的数量。\n\
  \n这种抽象极大简化了我们的智能体：它将环境观测值传递给网络，获取动作的概率分布，从分布中提取一个随机动作并执行它。这为智能体增加了随机性，这是非常有意义的，因为在训练初期，权重很大程度上是随机的，智能体的行为是随机的。在智能体执行所选动作后，它会获得下一次观测值以及上一个动作的奖励。然后继续循环。\n\
  \n在智能体的生命周期内，会发生多个回合（Episodes）。每个回合代表一系列观测（智能体从环境接收的）、动作（它执行的）以及对这些动作的奖励。假设我们的智能体已经经历了几个这样的回合。对于每个回合，我们可以计算智能体获得的总奖励。它可能是折扣过的，也可能不是，为了简单起见，我们假设折扣因子\
  \ `γ = 1`，这意味着每个回合中的所有奖励都会被加总。总奖励显示了回合运行的良好坏程度。\n\n图 4.2 演示了四个回合。请注意，这些回合具有不同的 `o`、`a`\
  \ 和 `r` 值。\n\n![\\[图像\\]](Images/04_02.jpg)\n\n**图 4.2:** 观测 o、动作 a 和奖励 r 的示例\n\n\
  交叉熵方法的核心思想是丢弃差的回合，使用最好的回合。该方法包含以下步骤：\n\n1. 使用当前模型运行 *N* 个回合。\n2. 计算每个回合的总奖励，并确定一个奖励阈值。通常，我们使用一部分奖励，例如第\
  \ 50 或 70 百位数。\n3. 丢弃所有奖励低于此值的回合。\n4. 使用剩余的回合，将观测值作为输入，动作作为目标输出进行训练。\n5. 从步骤 1 开始重复整个过程，直到对结果满意为止。\n\
  \n## 4.3 CartPole 中的交叉熵\n\n\n\n\n此示例的完整代码可以在 `Chapter04/01_cartpole.py` 文件中找到。这里仅列出了最重要的部分。我们的模型是一个包含隐藏层、使用\
  \ ReLU 激活函数和 128 个隐藏神经元的神经网络（这些参数是在程度上是随机选择的）。其他超参数也是随机选择且并非最优的，因为该方法具有鲁棒性且收敛非常快。\n\
  \n```\nHIDDEN_SIZE = 128\nBATCH_SIZE = 16\nPERCENTILE = 70\n```\n\n在文件的开头，我们定义了常量：隐藏层中隐藏神经元的数量、我们在每次迭代中执行的回合数（16），以及我们用于筛选最佳回合的总奖励百分位数。我们选择了第\
  \ 70 百分位，这意味着我们保留了前 30% 的回合（按奖励排序）。\n\n```python\nclass Net(nn.Module):\n    def\
  \ __init__(self, obs_size, hidden_size, n_actions):\n        super(Net, self).__init__()\n\
  \        self.net = nn.Sequential(\n            nn.Linear(obs_size, hidden_size),\n\
  \            nn.ReLU(),\n            nn.Linear(hidden_size, n_actions)\n       \
  \ )\n    def forward(self, x):\n        return self.net(x)\n```\n\n该网络没有特殊之处；它接收单个环境观测作为输入向量，并为我们可以执行的每个动作计算一个数值。网络的输出是动作的概率分布，因此也可以通过简单的方法，在最后一层添加一个\
  \ Softmax 非线性函数来继续。在这里我们放弃了这样做，以提高训练过程的数值稳定性。我们没有分别计算 Softmax 函数（使用指数函数）和交叉熵损失（使用概率的对数），而是使用了\
  \ PyTorch 的 `nn.CrossEntropyLoss` 类，它将 Softmax 函数和交叉熵合并在一个单一的、数值更稳定的表达式中。`CrossEntropyLoss`\
  \ 不需要网络的归一化原始值（所谓的 Logits），其缺点是，当我们想要从网络输出获取概率时，不能忘记每次都应用 Softmax 函数。\n\n```python\n\
  Episode = namedtuple('Episode',\n                     field_names=['reward', 'steps'])\n\
  EpisodeStep = namedtuple('EpisodeStep',\n                     field_names=['observation',\
  \ 'action'])\n```\n\n在这里，我们使用标准库 `collections` 包中的具名元组（namedtuple）定义了两个辅助类：\n\n\
  * `EpisodeStep`：用于表示智能体在回合中执行的单个步骤。存储了环境观测和智能体执行的动作。我们使用最佳回合的步骤作为训练数据。\n* `Episode`：单个回合，作为一个不打折的总奖励。\n\
  \n以下是一个生成批次（batches）的函数：\n\n```python\ndef iterate_batches(env, net, batch_size):\n\
  \    batch = []\n    episode_reward = 0\n    episode_steps = []\n    obs = env.reset()\n\
  \    while True:\n        obs_tensor = torch.from_numpy(obs).float().unsqueeze(0)\n\
  \        probs = net(obs_tensor)\n        action = torch.multinomial(probs, 1).item()\n\
  \        next_obs, reward, done, _ = env.step(action)\n        episode_reward +=\
  \ reward\n        episode_steps.append(EpisodeStep(observation=obs, action=action))\n\
  \        obs = next_obs\n        if done:\n            e = Episode(reward=episode_reward,\
  \ steps=episode_steps)\n            batch.append(e)\n            episode_reward\
  \ = 0\n            episode_steps = []\n            obs = env.reset()\n         \
  \   if len(batch) == batch_size:\n                yield batch\n                batch\
  \ = []\n```\n\n\n\n在这种程序逻辑中，特别重要的一点是理解：网络的训练和回合的生成是*同时进行的*。虽然这并非完全并行的，但一旦循环收集了足够的回合（16\
  \ 个），它就会将控制权交还给函数的调用者，由该调用者通过梯度下降来训练网络。因此，当 `yield` 执行完成后，网络的表现（理想情况下）应该会好一点点。\n\
  \n我们不需要担心适当的同步问题，因为训练和数据收集是在同一个执行线程中运行，但你必须明确，在网络训练和应用之间存在着不断的切换。\n\n现在我们还需要定义另一个函数，然后就可以准备执行训练循环了。\n\
  \n```python\ndef filter_batch(batch, percentile):\n    rewards = list(map(lambda\
  \ s: s.reward, batch))\n    reward_bound = np.percentile(rewards, percentile)\n\
  \    reward_mean = float(np.mean(rewards))\n```\n\n该函数对于交叉熵方法至关重要：它根据给定的回合和百分位数计算出一个奖励边界，该边界用于筛选出最佳回合以进行训练。为了获得奖励边界，我们使用了\
  \ NumPy 的分位数函数，它根据值列表和百分位数计算分位数值。随后，我们计算平均奖励，这仅用于监控。\n\n```python\ntrain_obs = []\n\
  train_act = []\nfor reward, steps in batch:\n    if reward < reward_bound:\n   \
  \     continue\n    train_obs.extend(map(\n                       lambda step: step.observation,\
  \ steps))\n    train_act.extend(map(lambda step: step.action, steps))\n```\n\n接下来，我们过滤回合。我们检查\
  \ Batch 中的每个回合，判断总奖励是否大于奖励边界。如果是，我们就创建一个包含观测和动作的列表，用于训练。\n\n```python\ntrain_obs_v\
  \ = torch.FloatTensor(train_obs)\ntrain_act_v = torch.LongTensor(train_act)\nreturn\
  \ train_obs_v, train_act_v, reward_bound, reward_mean\n```\n\n函数的最后一步将最佳回合的观测和动作转换为张量，并返回一个包含四个值的元组：观测值、动作、奖励边界和平均奖励。最后两个值仅用于输出到\
  \ TensorBoard，以便检查我们智能体的性能。\n\n将所有内容连接在一起的剩余代码主要由训练循环组成：\n\n```python\nif __name__\
  \ == \"__main__\":\n    env = gym.make(\"CartPole-v0\")\n    # env = gym.wrappers.Monitor(env,\
  \ directory=\"mon\",\n    #                                      force=True)\n \
  \   obs_size = env.observation_space.shape[0]\n    n_actions = env.action_space.n\n\
  \n    net = Net(obs_size, HIDDEN_SIZE, n_actions)\n    objective = nn.CrossEntropyLoss()\n\
  \    optimizer = optim.Adam(params=net.parameters(), lr=0.01)\n    writer = SummaryWriter(comment=\"\
  -CartPole\")\n```\n\n首先，我们创建所有必要的对象：环境、我们的神经网络、目标函数、优化器以及用于 TensorBoard 的 SummaryWriter。被注释掉的两行创建一个用于记录智能体性能视频的监控。\n\
  \n```python\nfor iter_no, batch in enumerate(iterate_batches(env, net,\n       \
  \                                      BATCH_SIZE)):\n    obs_v, acts_v, reward_b,\
  \ reward_m = filter_batch(batch,\n                                             \
  \   PERCENTILE)\n    optimizer.zero_grad()\n    action_scores_v = net(obs_v)\n \
  \   loss_v = objective(action_scores_v, acts_v)\n    loss_v.backward()\n    optimizer.step()\n\
  ```\n\n在训练循环中，我们遍历我们的 Batch（一个 `Episode` 对象的列表）。我们使用 `filter_batch` 函数过滤出最佳回合。结果是包含观测、执行的动作、用于过滤的奖励边界以及平均奖励的变量。随后，我们将网络的梯度初始化为零，将观测值传递给网络并获取动作值。这些值被传递给目标函数\
  \ `objective`，该函数计算网络输出与智能体执行动作之间的交叉熵。其核心思想是：我们的网络倾向于执行带来高奖励的最佳动作。然后，我们计算损失的梯度并指示优化器调整我们的网络。\n\
  \n```python\nprint(\"%d: loss=%.3f, reward_mean=%.1f,\n                      reward_bound=%.1f\"\
  \ % (\n      iter_no, loss_v.item(), reward_m, reward_b))\nwriter.add_scalar(\"\
  loss\", loss_v.item(), iter_no)\nwriter.add_scalar(\"reward_mean\", reward_m, iter_no)\n\
  writer.add_scalar(\"reward_bound\", reward_b, iter_no)\n```\n\n连接所有内容的剩余代码主要由训练循环组成见上文）。智能体通常不需要超过\
  \ 50 个 Batch 就能解决环境。在我的实验中，只需要 25 到 45 个回合，这是非常好的学习性能。（记住我们每次只运行 16 个回合。）TensorBoard\
  \ ([图 4.3] 和 [图 4.4]) 显示我们的智能体正在不断进步，并在几乎每个 Batch 中都在提高边界（虽然会有退步，但大多数情况都是改进）。\n\n\
