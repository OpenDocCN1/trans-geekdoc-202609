  ## 15.3 简单 DQN\n\n在这个任务中，观测空间和动作空间构成了挑战。正如您从上一章所知，测试序列本身可能是有问题的。序列长度的多样性会导致循环神经网络出现梯度消失或爆炸式增长，从而减慢训练或引起收敛问题。此外，TextWorld\
  \ 环境为我们提供了不同的序列，我们必须单独处理它们。描述场景的字符串对于代理来说，可能与拥有物品的字符串具有完全不同的含义。\n\n另一个障碍是所提到的动作空间。从上一个节您知道\
  \ TextWorld 提供了一个允许的命令列表。这很大地缩小了动作空间，但仍存在其他复杂性。例如，允许命令列表会随情况而改变。\n\n\n\n\n* `lib/common.py`:\
  \ 用于初始化 Ignite 和超参数的常用辅助函数\n* `lib/preproc.py`: 数据预处理流水线，包括 Embedding 和 Encoder\
  \ 类\n* `lib/model.py`: DQN 模型和 DQN 代理以及辅助函数\n\n为了节省空间，此处未列出完整代码。在随后的章节中，将仅解释最重要或最具技巧的部分。\n\
  \n### 15.3.1 观测值的预处理\n\n我们从流水线左侧的部分开始。通过输入，我们获得了针对单个状态观测和要执行命令的多个 Token 列表。但正如你所知，TextWorld\
  \ 环境生成一个字符串和一个包含额外信息的字典，因此我们需要对字符串进行分词（tokenize），以消除无关信息。`TextWorldPreproc` 类负责这一点，它定义在\
  \ `lib/preproc.py` 文件：\n\n```python\nclass TextWorldPreproc(gym.Wrapper):\n\n  \
  \  log = logging.getLogger(\"TextWorldPreproc\")\n\n    def __init__(self, env:\
  \ gym.Env,\n                 encode_raw_text: bool = False,\n                 encode_extra_fields:\
  \ Iterable[str] = (\n                         'description', 'inventory'),\n   \
  \              use_admissible_commands: bool = True,\n                 use_intermediate_reward:\
  \ bool = True,\n                 tokens_limit: Optional[int] = None):\n        super(TextWorldPreproc,\
  \ self).__init__(env)\n        if not isinstance(env.observation_space,\n      \
  \                           tw_spaces.Word):\n            raise ValueError(\n  \
  \              \"Env sollte TextWorld-Beobachtung liefern, \"\n                \"\
  stattdessen wurde %s geliefert\"\n                        % env.observation_space)\n\
  \        self._encode_raw_text = encode_raw_text\n        self._encode_extra_field\
  \ = tuple(encode_extra_fields)\n        self._use_admissible_commands =\n      \
  \        use_admissible_commands\n        self._use_intermedate_reward =\n     \
  \         use_intermediate_reward\n        self._num_fields = len(self._encode_extra_field)\
  \ +\n                               int(self._encode_raw_text)\n        self._last_admissible_commands\
  \ = None\n        self._last_extra_info = None\n        self._tokens_limit = tokens_limit\n\
  \        self._cmd_hist = []\n```\n\n该类实现了 `gym.Wrapper` 接口，并将 TextWorld 环境的观测和动作转换为我们需要的格式。构造函数接收多个标志，以简化未来的实验。例如，你可以禁用允许命令或中间奖励的使用，限制\
  \ Token 的数量或更改观测中要处理的字段 set。\n\n```python\n@property\ndef num_fields(self):\n  \
  \  return self._num_fields\n\ndef _encode(self, obs: str, extra_info: dict) -> dict:\n\
  \    obs_result = []\n    if self._encode_raw_text:\n        tokens = self.env.tokenize(obs)\n\
  \        if self._tokens_limit:\n            tokens = tokens[:self._tokens_limit]\n\
  \        obs_result.append(tokens)\n    result = {}\n    for field in self._encode_extra_field:\n\
  \        if field in extra_info:\n            result[field] = extra_info[field]\n\
  \    result['obs'] = obs_result\n    if self._use_admissible_commands:\n       \
  \ adm_result = []\n        for cmd in extra_info['admissible_commands']:\n     \
  \       tokens = self.env.observation_space.tokenize(cmd)\n            adm_result.append(tokens)\n\
  \        result['admissible_commands'] = adm_result\n        self._last_admissible_commands\
  \ = adm_result\n    self._last_extra_info = extra_info\n    return result\n```\n\
  \n`_encode` 方法是观测值转换的核心。它接收字符串和额外信息字典，并返回一个包含以下内容的字典：\n\n* `obs`: 一个包含序列 Token ID\
  \ 列表的列表\n* `admissible_commands`: 当前状态下可用的命令列表\n\n此外，该方法存储了额外信息的字典和允许命令列表。它们在训练时不需要，但在应用模型时有用，可以根据命令索引确定命令文本。\n\
  \n```python\ndef reset(self):\n    res = self.env.reset()\n    self._cmd_hist =\
  \ []\n    return self._encode(res[0], res[1])\n\ndef step(self, action):\n    if\
  \ self._use_admissible_commands:\n        action = self._admissible_commands[action]\n\
  \    self._cmd_hist.append(action)\n    obs, r, is_done, extra = self.env.step(action)\n\
  \    if self._use_intermedate_reward:\n        r += extra.get('intermediate_reward',\
  \ 0)\n    if self._reward_wrong_last_command is not None:\n        # 该值在无效命令时存在\n\
  \        if extra.get('last_command', '') == 'None':\n            r += self._reward_wrong_last_command\n\
  \    new_extra = dict(extra)\n    fields = list(self._encode_extra_field)\n    fields.append('admissible_commands')\n\
  \    fields.append('intermediate_reward')\n    for f in fields:\n        if f in\
  \ new_extra:\n            new_extra.pop(f)\n    return self._encode(obs, extra),\
  \ r, is_done, new_extra\n```\n\n两个公共方法 `reset()` 和 `step()` 使用 `_encode()` 方法转换观测值。\n\
  \n允许命令已启用，期望的动作是允许命令列表中的索引。\n\n最后，还有两个属性提供了对存储状态的访问。\n\n```python\n@property\ndef\
  \ last_admissible_commands(self):\n    if self._last_admissible_commands:\n    \
  \    return tuple(self._last_admissible_commands)\n    return None\n\n@property\n\
  def last_extra_info(self):\n    return self._last_extra_info\n```\n\n\n\n\n\n```python\n\
