  \n**图 20.2:** 奖励的标准差（左侧）和平均策略更新\n\n### 20.4 使用 HalfCheetah 的 ES\n\n在下一个示例中，我们将超越最简单的\
  \ ES 实现，并考虑如何利用论文 [\\[1\\]](#20.xhtml#QUELLE01) 中提出的策略 `Shared Seed`（随机数生成器的共享起始值）对方法进行化。对于这种方法，我们将使用\
  \ Roboschool 库中的一个环境，我们已经在 第 19 章 中实验过它，即 `HalfCheetah`。这是一个连续控制任务，一个奇怪的双足生物在向前移动且不受伤的情况下会获得奖励。\n\
  \n我们首先考虑随机数生成器的 `Shared Seeds` 概念。ES 算法的性能主要取决于我们组装训练 batch 的速度。在此，我们提取随机样本并检查它们的总奖励。由于训练\
  \ batch 中的对象是相互独立的，我们可以轻松地并行化这一步，并将其分配到远程计算机的一系列进程中。（这与 第 13 章 中的示例有相似之处，在该章节我们收集了\
  \ A3C 工作进程的梯度。）然而，这种并行化的朴素实现需要在机器与工作进程以及一个中央 `Master` 之间传输大量数据，由该 Master 组合这些结果并执行策略更新。这些数据大部分是随机向量，其格式与我们的策略参数对应。\n\
  \n为了避免这种额外开销，上述论文的作者提出了一种优雅的解决方案。工作进程的随机样本通过伪随机数生成器产生，这使得我们能够设定随机数生成器的起始值（种子），从而重现随机生成的序列。工作进程只需要向\
  \ Master 传输用于生成序列的 `Seed`。\n\n\n\n\n\n```python\nfor noise, reward in zip(batch_noise,\
  \ norm_reward):\n    if weighted_noise is None:\n        weighted_noise = [reward\
  \ * p_n for p_n in noise]\n    else:\n        for w_n, p_n in zip(weighted_noise,\
  \ noise):\n            w_n += reward * p_n\nm_updates = []\noptimizer.zero_grad()\n\
  for p, p_update in zip(net.parameters(), weighted_noise):\n    update = p_update\
  \ / (len(batch_reward) * noise_std)\n    p.grad = -update\n    m_updates.append(torch.norm(update))\n\
  writer.add_scalar(\"update_l2\", np.mean(m_updates), step_idx)\noptimizer.step()\n\
  ```\n\n# PyTorch 优化器与训练函数\n\n训练函数中的另一个显著区别涉及 PyTorch 优化器的使用。为了理解为什么使用它们以及如何在如何在没有反向传播（Backpropagation）的情况下实现这一点，需要一些解释。\n\
  \n## ES 算法 vs SGD\n\n首先，ES 研究已经表明，ES 算法使用的优化方法与基于适应度函数的梯度下降（Gradient Descent）非常相似，但梯度的计算方式不同。\n\
  \n- **SGD 方法**：我们通常通过计算损失函数对网络参数的导数来获取梯度。这意味着网络和损失函数必须是可微的，而这并不总是如此，例如在 ES 方法中执行的排序转换（rank\
  \ order transformation）是不可微的。\n- **ES 方法**：另一方面，ES 方法的优化工作方式有所不同。我们通过添加噪声并计算适应度函数，从当前参数的邻域中提取随机样本。根据适应度函数的变化，我们调整参数使适应度值变大。结果与基于梯度的方法非常相似，但对适应度函数施加的限制并不严格：它只需要是可计算的。\n\
  \n## 使用 PyTorch 优化器\n\n然而，如果我们通过对适应度函数进行随机采样来估计梯度，那么就可以使用 PyTorch 的标准优化器。通常，优化器在调整网络参数时使用累积在\
  \ `grad` 字段中的梯度。这些梯度是在反向传播后累积的，但 PyTorch 非常灵活，对于优化器来说，梯度的来源并不重要。因此，我们只需要将估计的参数更新复制到\
  \ `grad` 字段，并指示优化器进行更新。请注意，复制的更新带有负号，这是因为优化器通常执行梯度下降（我们最小化损失函数），但在这种情况下，我们想要执行梯度上升。这与\
  \ Actor-Critic 方法非常相似，在那种方法中，估计的 PG（策略梯度）带有负号使用，因为它指向的是改进策略的方向。\n\n# 主进程与通信\n\n\
  最后一段不同的代码属于主进程执行的训练循环。它等待工作进程的数据，执行网络参数更新并将结果传递给工作进程。主进程与工作进程之间的通信通过两种队列实现：\n\n\
  1. **第一个队列**：每个工作进程有一个队列，主进程利用它传递当前使用的策略网络参数。\n2. **第二个队列**：由进程共享，用于传输上述的 `RewardItem`\
  \ 结构，该结构包含了随机数生成器的起始值和奖励。\n\n## 进程初始化\n\n```python\nparams_queues = [\n    mp.Queue(maxsize=1)\n\
  \    for _ in range (PROCESSES_COUNT)\n]\nrewards_queue = mp.Queue(maxsize=ITERS_PER_UPDATE)\n\
  workers = []\n\nfor idx, params_queue in enumerate(params_queues):\n    p_args =\
  \ (idx, params_queue, rewards_queue,\n              device, args.noise_std)\n  \
  \  proc = mp.Process(target=worker_func, args=p_args)\n    proc.start()\n    workers.append(proc)\n\
  \nprint(\"全部启动!\")\noptimizer = optim.Adam(net.parameters(), lr=args.lr)\n```\n\n\
  在主进程开始，我们创建这些队列并启动工作进程以及优化器。\n\n```python\nfor step_idx in range(args.iters):\n\
  \    # 传递网络参数\n    params = net.state_dict()\n    for q in params_queues:\n    \
  \    q.put(params)\n```\n\n每次迭代的开始始于传递网络参数。\n\n## 训练循环\n\n```python\nt_start = time.time()\n\
  batch_noise = []\nbatch_reward = []\nresults = 0\nbatch_steps = 0\nbatch_steps_data\
  \ = []\nwhile True:\n    while not rewards_queue.empty():\n        reward = rewards_queue.get_nowait()\n\
  \        np.random.seed(reward.seed)\n        noise, neg_noise = sample_noise(net)\n\
  \        batch_noise.append(noise)\n        batch_reward.append(reward.pos_reward)\n\
  \        batch_noise.append(neg_noise)\n        batch_reward.append(reward.neg_reward)\n\
  \        \n        if batch_steps == PROCESSES_COUNT * ITERS_PER_UPDATE:\n     \
  \       break\n    time.sleep(0.01)\n```\n\n随后，主进程在循环中等待工人。当有新结果出现时，我们调用 `train_step`。\n\
  \n\n\n\n训练过程在开始时策略（Policy）提升非常快。在仅需 100 次更新（对应 7 分钟的训练）后，智能体就能获得 700 到 800 分，但此后它陷入了停滞，无法从平衡模式（Cheetah\
  \ 在此可获得 900 到 1,000 的奖励）切换到跑步模式，后者能带来 2,500 及更高的奖励。\n\n![\\[图片\\]](Images/20_07.jpg)\n\
