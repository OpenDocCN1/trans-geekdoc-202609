  \ `gamma=0.9` 的正态分布的投影，并通过一个 `reward=2` 的奖励向右平移。如果我们在相同的数据上传递 `done=True`，结果将会有不同（图\
  \ 8.18）。在这种情况下，源的分布完全没有被考虑，只对奖励进行了投影。\n\n该方法有两个版本。`Chapter08/07_dqn_distrib.py`\
  \ 文件仅包含了关键代码，这些代码在 `Chapter08/07_dqn_distrib-plots` 文件中也可以可以找到。然而，后者中的代码还存储了给定状态集合的底层概率分布图像。这些图表在代码开发过程中至关重要，我认为它们对于理解和视觉化收敛过程非常有帮助。图\
