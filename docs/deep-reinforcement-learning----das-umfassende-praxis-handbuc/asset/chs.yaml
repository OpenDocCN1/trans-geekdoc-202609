  # Kapitel 1: Was ist Reinforcement Learning?\n\nReinforcement Learning (RL) ist\
  \ ein Teilgebiet des Machine Learning, das sich beschäftigt, mit der Zeit automatisch\
  \ Entscheidungen zu treffen. Dabei handelt es sich um ein allgemeines und gängiges\
  \ Problem, das in vielen wissenschaftlichen und technischen Fachgebieten untersucht\
  \ wird.\n\nIn unserer sich wandelnden Welt sind Aufgaben, die auf den ersten Blick\
  \ wie statische Eingabe-Ausgabe-Aufgaben aussehen, aus übergeordneter Sicht dynamisch.\
  \ Betrachten Sie beispielsweise die einfache Lernaufgabe, Bilder von Haustieren\
  \ entweder als Hund oder Katze zu klassifizieren. Sie haben die Trainingsdatenmenge\
  \ zusammengestellt und den Klassifizierer mit dem Toolkit Ihrer Wahl implementiert,\
  \ und nach einiger Zeit liefert das konvergierende Modell ausgezeichnete Ergebnisse.\
  \ Gut so? Aber sicher! Sie haben das Modell zur Anwendung gebracht und lassen es\
  \ laufen. Dann fahren Sie in den Urlaub, und nach Ihrer Rückkehr stellen Sie fest,\
  \ dass modische Hundehaarschnitte völlig anders aussehen und ein beträchtlicher\
  \ Teil Ihrer Bilder fehlklassifiziert wird. Sie müssen also Ihre Trainingsbilder\
  \ aktualisieren und den ganzen Vorgang wiederholen.\n\nDieses Beispiel soll zeigen,\
  \ dass auch ganz einfache Aufgaben beim Machine Learning (ML) eine verborgene zeitliche\
  \ Dimension besitzen, die häufig übersehen wird, bei einem Produktivsystem aber\
  \ zu einem Problem werden kann. Reinforcement Learning (RL) ist ein Ansatz, der\
  \ diese zusätzliche Dimension (für gewöhnlich die Zeit, das muss nicht so sein)\
  \ in den Gleichungen der Lernregeln berücksichtigt und damit der menschlichen Vorstellung\
  \ von einer künstlichen Intelligenz schon deutlich näher kommt.\n\nIn diesem Kapitel\
  \ geht es um die folgenden Themen:\n\n* Was RL mit anderen ML-Verfahren, nämlich\
  \ überwachtem und unüberwachtem Lernen, gemeinsam hat und wodurch es sich von ihnen\
  \ unterscheidet\n* Die wichtigsten RL-Formalismen und in welcher Beziehung sie zueinander\
  \ stehen\n* Die theoretischen Grundlagen des RL: der Markov-Entscheidungsprozess\n\
  \n\n\n\n监督学习（Supervised Learning）你可能已经熟悉，因为它是被研究最多、最为人知的机器学习任务。其核心问题是：如何自动找到一个函数，根据一组示例对将输入映射到特定的输出？虽然这个任务听起来很简单，但它涉及许多棘手的问题，计算机直到最近才能相当成功地解决这些问题。监督学习任务有许多例子，例如：\n\
  \n- **文本分类**：这封邮件是垃圾邮件还是不是？\n- **图像分类和目标检测**：这张图片显示的是猫、狗还是其他东西？\n- **回归（Regression）**：根据气象站的测量值，明天的天气将如何？\n\
  - **情感分析**：写下评论的客户满意度如何？\n\n这些问题可能有所不同，但其核心思想一致：存在许多输入及其对应输出的示例，我们希望学会为新的、未输入生成输出。之所以被称为*监督*学习，是因为系统是根据已知的答案进行学习的，因为这些示例被正确地标记了标签（Labels）。\n\
  \n## 1.2 无监督学习\n\n另一方面是无监督学习（Unsupervised Learning），其数据没有标记。它的目标是在现有数据中发现隐藏的结构。这种学习方法的一个常见例子是数据聚类（Clustering）。算法试图将数据对象分为不同的簇，并通过这种方式揭示数据中的关系。例如，你可以寻找相似的图片，或者行为相似的客户。\n\
  \n另一种日益受欢迎的无监督学习方法是生成对抗网络（`Generative Adversarial Networks`，简称 `GANs`）。其中有两个竞争的神经网络：第一个生成伪造数据，第二个则试图区分这些数据是伪造的还是属于真实数据集。随着时间的推移，这两个网络可以通过捕捉数据集中细微的模式，越来越好地完成各自的任务。\n\
  \n## 1.3 强化学习\n\nRL（Reinforcement Learning）介于完全监督学习和完全缺乏预定义标签之间。一方面，它使用了许多常见的监督学习方法，如用于函数近似的深度神经网络、随机梯度下降和反向传播，以学习数据表示。另一方面，这些方法通常以其他方式被应用。\n\
  \n在本章的接下来的两个部分中，我们有机会探索 RL 方法的某些细节，例如以数学严谨形式的假设和抽象。首先，我们将使用一种不那么正式且更直观的描述，将 RL 与监督学习和无监督学习进行比较。\n\
  \n假设有一个智能体（Agent），要在环境中执行特定的动作。迷宫中的一只机器人鼠是一个很好的例子，我们也可以想象一架试图执行飞行动作的自动直升机，或者一个学习如何击败大师的棋类程序。为了简单起见，我们保留机器人鼠的例子。\n\
  \n它的环境是一个迷宫，其中一些地方有食物，另一些地方有电击。机器人鼠可以执行不同的动作，例如向左或向右转或向前移动。它可以时刻观察迷宫的完整状态，以决定执行哪种动作（图\
  \ 1.1）。它试图尽可能找到多的食物，并尽可能避免电击。“食物”和“电击”信号是智能体（机器人鼠）从环境中接收的针对动作的额外`奖励`（Reward）。奖励在\
  \ RL 中是一个非常重要的概念，我将在本章稍后的部分还会讨论它。在这里只需要知道智能体的目标是获得尽可能大的累积奖励。在这个特殊例子中，老鼠可能会为了到达食物很多的地方而接受电击。这比仅仅呆在原地什么也找不到要结果更好的结果。\n\
  \n![图像](img/01_01.jpg)\n\n**图 1.1：**机器人鼠的迷宫\n\n我们不想将关于环境以及在特定情况下最佳动作的知识硬编码在机器人鼠中——那样太费了，而且如果迷宫发生轻微变化，它就会变得毫无用。相反，我们需要一些方法让机器人能够自己学会避免电击并尽可能找到食物。\n\
  \n强化学习提供了一种不同于监督和无监督学习方法的解决方案。它没有像监督学习那样的预定义标签。没有人对机器人看到的图像用“好”或“坏”进行标记。然而，我们并不像无监督学习那样完全盲目——存在一个奖励系统。奖励可以是正面的（找到食物）、负面的（电击）或中性的（什么都没有发生）。通过观察奖励并与动作建立联系，智能体可以学习如何执行动作以获得更多食物并减少电击。\n\
  \n自然地，强化学习的通用性和灵活性是有代价的。RL 被认为比监督和无监督学习困难得多。让我们简单看看为什么强化学习如此棘手。\n\n## 1.4 强化学习面临的挑战\n\
  \n首先必须注意到，RL 中的观测取决于智能体的行为，并且在某种程度上甚至是其行为的结果。如果你的智能体行为低效，观测并不能说明它哪里错了，以及应该采取什么措施来改进（智能体一直收到负面反馈）。如果智能体固执并继续犯错，观测可能会给出无法获得更大奖励的错误印象——但这可能是完全错误的。\n\
  \n在机器学习术语中，这被称为不满足 `i.i.d. 假设`。该假设认为数据是相互独立的（independent）且同同分布的（identically distributed），这对于大多数监督学习方法是必要的。\n\
  \n此外，智能体生活变得复杂，是因为它不仅要利用已学到的策略（英文 `exploit`），还必须主动探索环境（英文 `explore`），因为可能如果我们采取不同的方案，会获得显著更好的结果。问题在于，过度的探索可能会导致奖励的大幅减少。因此，我们必须在这两种方法之间找到某种平衡。\n\
  \n如何从这种利用（Exploitation）与探索（Exploration）的困境中找到出路，是 RL 中一个基础性的未解决问题之一。\n\n\n\n\nMenschen\
  \ müssen solche Entscheidungen ständig treffen: Soll ich zum Abendessen einen bekannten\
  \ Ort aufsuchen oder doch das schicke neue Restaurant ausprobieren? Wie häufig sollte\
  \ man den Arbeitsplatz wechseln? Sollte man sich mit einem neuen Fachgebiet befassen\
  \ oder auf dem jetzigen weiterarbeiten? Eine allgemeingültige Antwort auf diese\
  \ Fragen gibt es nicht.\n\nDer dritte Faktor, der die Sache verkomiziert, ist die\
  \ Tatsache, dass die Belohnung einer Aktion unter Umständen mit erheblicher Verzögerung\
  \ erfolgt. Beim Schach kann ein einziger starker Zug in der Mitte der Partie spielentscheidend\
  \ sein. Beim Lernen müssen wir so etwas erkennen, was schwierig sein kann, wenn\
  \ wir mit dem Spielverlauf und den Aktionen beschäftigt sind.\n\nTrotz all dieser\
  \ Hindernisse und Komplikationen hat RL in den letzten Jahren große Fortschritte\
  \ erzielt und wird immer mehr zu einem Fachgebiet für Forschung und praktische Anwendungen.\n\
  \nNeugierig geworden? Sehen uns die Details an und betrachten die RL-Formalismen\
  \ und die geltenden Spielregeln.\n\n## 1.5 RL-Formalismen\n\nBei jedem wissenschaftlichen\
  \ Fachgebiet gibt es bestimmte Annahmen und Einschränkungen. Im letzten Abschnitt\
  \ habe ich überwachtes Lernen erläutert, bei dem die Kenntnis der Eingabe-Ausgabe-Paare\
  \ vorausgesetzt wird. Es gibt für die Daten keine Labels? Nichts für ungutut, Sie\
  \ müssen die Labels irgendwie beschaffen oder einen anderen Ansatz verfolgen. Überwachtes\
  \ Lernen ist deswegen nicht besser oder schlechter als andere Verfahren, es ist\
  \ einfach nur für Ihre Aufgabe nicht einsetzbar. Es ist wichtig, diese `Spielregeln`\
  \ für verschiedene Verfahren zu kennen, da Sie dadurch sehr viel Zeit sparen können.\
  \ Allerdings gibt es auch viele Beispiele für praktische oder theoretische Durchbrüche,\
  \ die dadurch erzielt wurden, dass die Spielregeln auf kreative Art Weise missachtet\
  \ wurden. Man sollte aber auf jeden Fall alle Einschränkungen kennen.\n\nEs gibt\
  \ eine Reihe solcher Formalismen für RL, und jetzt ist es die Zeit, sie vorzustellen,\
  \ denn wir werden sie im verbleibenden Teil des Buchs von verschiedenen Perspektiven\
  \ analysieren. In Abbildung 1.2 sind der `Agent`, die `Umgebung` und ihre Kommunikationskanäle\
  \ dargestellt: `Aktionen`, `Belohnung` und `Beobachtungen`. Ich werde in den folgenden\
  \ Abschnitten ausführlich darauf eingehen.\n\n![\\[Bild\\]](Images/01_02.jpg)\n\n\
  **Abb. 1.2:** Agent, Umgebung und Kommunikationskanäle\n\n### 1.5.1 Belohnung\n\n\
  Als Erstes betrachten wir die Belohnung. Beim RL handelt es sich um einen skalaren\
  \ Wert, den wir regelmäßig von der Umgebung abfragen. Er kann positiv oder negativ\
  \ sein, groß oder klein, es ist einfach nur eine Zahl. Zweck der Belohnung ist es,\
  \ unserem Agenten mitzuteilen, wie gut er sich verhalten hat. Wir legen nicht fest,\
  \ wie oft der Agent eine Belohnung erhält; es könnte sekündlich sein oder aber nur\
  \ ein einziges Mal während seiner Lebensspanne. Es ist allerdings aus Komfort gängige\
  \ Praxis, dass der Agent die Belohnung in festen Zeitabständen erhält oder nach\
  \ jeder Interaktion mit der Umgebung. Bei einem Belohnungssystem, das nur am Ende\
  \ der Lebensspanne eine Belohnung gewährt, sind alle Belohnungen bis die letzte\
  \ Null.\n\nWie erwähnt, soll eine Belohnung dem Agenten Feedback über seinen Erfolg\
  \ liefern; sie spielt beim RL eine wichtige und zentrale Rolle. Der Begriff `Reinforcement`\
  \ (Verstärkung) wird verwendet, weil die von einem Agenten erhaltene Belohnung sein\
  \ Verhalten verstärken soll (auf positive oder negative Weise). Die Belohnung ist\
  \ stets `lokal`, das heißt, sie spiegelt den Erfolg der letzten Aktion des Agenten\
  \ wider, nicht alle Erfolge in den zurückliegenden Aktionen. Für eine Aktion eine\
  \ große Belohnung zu erhalten, bedeutet aber nicht, dass nicht eine Sekunde später\
  \ drastische Folgen der vorangegangenen Entscheidungen eintreten können. Es verhält\
  \ sich wie bei einem Überfall, bis man über Konsequenzen nachdenkt. Ein Agent versucht,\
  \ durch die Abfolge seiner Aktionen die größte kumulierte Belohnung zu erzielen.\
  \ Zwecks Veranschaulichung sind unten einige konkrete Beispiele aufgeführt:\n\n\
  - **Finanzhandel:** Ein Trader, der Aktien kauft und verkauft.\n- **Schach:** Hier\
  \ erhält man die Belohnung am Ende des Spiels in Form eines Sieges, einer Niederlage\
  \ oder eines Remis. Das ist natürlich proportional zur Spielstärke.\n- **Dopamin-System\
  \ im Gehirn:** Ein Teil des Gehirns, das limbische System, produziert Dopamin, wenn\
  \ es anderen Teilen des Gehirns ein positives Signal senden muss. Eine höhere Dopaminkonzentration\
  \ verursacht ein Wohlgefühl, was Aktivitäten verstärkt, die das System als `gut`\
  \ beurteilt. Sehr altmodisch sind Nahrung, Fortpflanzung und Dominanz, aber das\
  \ ist eine völlig andere Geschichte.\n- **Computerspiele:** Üblicherweise erhält\
  \ der Spieler offensliches Feedback, etwa die Anzahl der Gegner. Beachten Sie bei\
  \ diesem Beispiel, dass die Belohnung bereits kumuliert ist also `+1`, wenn ein\
  \ Gegner abgeschaltet wird, und bei anderen `0`.\n- **Navigation im Web:** Es gibt\
  \ bestimmte Aufgaben, die einen hohen Nutzen haben, nämlich im Web vorhandene Informationen\
  \ zu extrahieren. Suchmaschinen versuchen allgemein diese Aufgabe zu lösen, aber\
  \ in manchen Fällen muss man, um die gesuchten Daten zu gelangen, ein Formular ausfüllen,\
  \ mehreren Links folgen oder Captchas lösen, was Suchmaschinen Schwierigkeiten bereitet.\n\
  - **Suche optimaler neuronaler Netzwerkarchuren:** RL wurde erfolgreich zur Optimierung\
  \ neuronaler Netzwerkarchuren eingesetzt. Dabei ist das Ziel, die beste Leistungzahl\
  \ bei einem Datensatz zu erreichen. Zu diesem Zweck variiert man die Anzahl der\
  \ Schichten, verändert die Parameter, richtet zusätzliche Verbindungen zwischen\
  \ Schichten ein oder nimmt andere Änderungen an der Architektur des neuronalen Netzes\
  \ vor. Die Belohnung ist in diesem Fall die Klassationsrate.\n- **Hundedressur:**\
  \ Wenn Sie schon versucht haben, einen Hund zu dressieren, dann wissen Sie, dass\
  \ man ihm jedes Mal etwas geben muss (aber nicht zu viel), wenn er richtig gehorcht.\
  \ Es ist auch üblich, ein Haustier ein wenig zu bestrafen (negative Belohnung),\
  \ wenn es nicht gehorcht, allerdings haben neuere Studien gezeigt, dass diese Methode\
  \ nicht so effektiv ist wie eine positive Belohnung.\n- **Schulnoten:** Damit haben\
  \ wir alle Erfahrung! Schulnoten stellen ein Belohnungssystem dar, das Schülern\
  \ Feedback zu ihrem Lernen gibt.\n\n### 1.5.2 Agent\n\nEin Agent interagiert mit\
  \ der Umgebung, indem er Aktionen ausführt, die Umgebung beobachtet und schließlich\
  \ eine Belohnung erhält. In der Praxis ist der Agent in den meisten Fällen unsere\
  \ Software, die eine Aufgabe auf mehr oder weniger effiziente Weise lösen soll.\
  \ Bei den genannten Beispielen gibt es die folgenden Agenten:\n\n\n\n\n-   **金融交易：**\
  \ 一个交易系统或一个做出股票买卖决策的交易员。\n-   **象棋：** 一个棋手或一个计算机程序。\n-   **大脑中的多巴胺系统：** 大脑本身，它根据传感器数据判断某种体验是好是坏。\n\
  -   **电脑游戏：** 享受游戏的玩家，或者计算机程序（`Andrey Karpathy` 在一条推特中写道：“我们其实想让 AI 来完成工作，我们来玩游戏，但结果却是我们完成了所有的工作，而\
  \ AI 在玩游戏！”）。\n-   **网页导航：** 告诉浏览器点击了哪个链接、鼠标移动到何处或应该输入什么文本的软件。\n-   **基于神经网络架构的搜索：**\
  \ 用于控制被评估神经网络的具体架构的软件。\n-   **训犬训练：** 你决定狗是否获得奖励或惩罚，因此你就是智能体（Agent）。\n-   **学校：**\
  \ 一名学生或大学生。\n\n### 1.5.3 环境\n\n环境是指智能体之外的一切。从广义上讲，它是宇宙的其余部分，但在这里这样说太夸张了，即使使用未来的计算机也无法实现，因此我们保留通常的含义。\n\
  \n环境对于智能体来说是外部的，与环境的通信受限于奖励（由环境提供）、动作（由智能体执行）和观测（智能体从环境中获得的除奖励之外的其他的信息）。我已经解释过奖励了，现在我们来考虑动作和观测。\n\
  \n### 1.5.4 动作\n\n动作是智能体可以在环境中执行的行为。动作可以是根据游戏规则允许的走法（在某项游戏中），也可以是完成作业（如果是关于学校的话）。它们可以是简单的（“将兵兵向前移动一格”），也可以是复杂的（“填写明天上午的报税表单”）。\n\
  \n在强化学习（RL）中，我们区分两种动作：离散动作和连续动作。离散动作由智能体可能执行的相互斥动作的有限集合组成，例如向左或向右移动。连续动作包含一个值，例如在“转动方向盘”的指令中，指定汽车方向盘应该旋转的角度。不同的角度会导致一秒钟后的情况发生变化，因此“转动方向盘”这条指令是不够的。\n\
  \n### 1.5.5 观测\n\n除了奖励之外，环境的观测是智能体的第二个信息通道。现在你可能想，为什么需要一个独立的数据源？原因是方便性。观测是环境提供给智能体的信息，从中可以推断出正在发生什么。\n\
  \n这对于随后的奖励可能很重要（例如银行的通知，显示资金已到账），也可能不是。观测可能以模糊的形式包含有关奖励的信息，例如电脑游戏屏幕上显示的得分。分数只是像素，但我们潜在地可以将它们转换为奖励值；这使用现代深度学习方法来说并不困难。\n\
  \n然而，奖励不应被视为次要或不重要的，因为它是智能体学习过程的驱动力。如果奖励是错误的、充满噪声的或与实际目标不一致的，可能会导致训练向错误的方向发展。\n\n\
  此外，区分环境的状态（State）和观测（Observations）至关重要。环境的状态可能包含宇宙中的所有原子，这自然使得捕获整个环境变得不可能。即使我们限制了环境状态描述的复杂性，使其足够小，通常仍然无法获得完整信息，而且测量结果可能是带有噪声的。但这并不是问题，因为强化学习的设计初衷就是处理这种情况。让我们再次看这些例子来解释区别：\n\
  \n-   **金融交易：** 这里的环境是整个金融市场以及影响它的一切。这是一个非常长的列表：最新新闻、经济和政治状况、天气、食物供应或 Twitter 趋势。即使是你今天留在家中的里的决定，也可能潜在地间接影响金融系统（如果你相信“蝴蝶效应”的话）。然而，我们的观测仅限于股票价格、新闻等。我们无法获取环境状态的大部分信息，这使得股票交易变得如此困难。\n\
  \n-   **象棋：** 这里的环境是棋盘*以及*你的对手，包括他的棋艺、情绪、大脑状态、所选的战术等。观测是你看到的内容（棋盘上的局面），但我推测，通过一些经验，心理学知识和评估对手的能力也能提高胜率。\n\
  \n-   **多巴胺系统：** 这里的环境是你的大脑*以及*神经系统*以及*你所感知到的世界。观测是大脑内部状态以及传感器传递给你的信号。\n\n-   **电脑游戏：**\
  \ 这里的环境是计算机的状态，包括内存和硬盘上的数据。对于联网游戏，还包括其他人的计算机*以及*网络基础设施。观测是屏幕上的像素和声音，仅此而已。屏幕像素包含的信息量并不小（有人计算过，中等大小屏幕\
  \ `1024 × 768` 像素的可能性数量大于我们银系的原子数量），但整个环境的状态数量显然要得多。\n\n-   **网页导航：** 这里的环境是互联网，包括位于代理与网页服务器之间的整个基础设施。这是一个由数百万组件组成的巨大系统。观测通常是当前加载的网页。\n\
  \n-   **神经网络架构搜索：** 在这个例子中环境非常简单，包含了评估特定神经网络的工具包以及用于确定性能指标的数据量。相比互联网，这个环境显得非常微小。观测可以是不同的，并包含评估得到的测试或其他性能指标。\n\
  \n-   **训犬训练：** 这里的环境是狗（包括它的内在反应、情绪和经验，但这些几乎无法观测）以及它周围的一切，包括其他的狗和躲在木丛里的猫。观测是感官传递给你的信号以及你的记忆。\n\
  \n-   **学校：** 指学校本身、国家的教育体系、社会和文化遗产。观测与训犬训练相同：学生的感官感知和记忆。\n\n\n\n\n这是我们将在书的剩余章节中进行实验的环境。我假设您已经注意到，强化学习（RL）模型极具灵活性且通用，可以应用于许多场景。在我们深入研究\
  \ RL 模型之前，我们先来看一下 RL 与其他方法之间的关系。\n\n还有许多其他领域对 RL 做出了贡献或与其相关。最重要的几个领域已在图 1.3 中所示。它展示了六大领域，这些领域的方法和主题在决策方面有高度的重叠（内部的灰色圆）。这些相关但又不同的科学学科的交集构成了\
  \ RL，它是如此通用和灵活，以至于能够利用不同学科的所长之处：\n\n*   **机器学习 (ML)：** RL 是机器学习的一个分支，并利用了它的许多机制、技巧和方法。RL\
  \ 的本质目标是学习当仅提供不完全的观测数据时，智能体（Agent）应该如何行为。\n*   **工程（特别是最优控制）：** 允许确定一系列最优动作，以获得最佳结果。\n\
  *   **神经科学：** 我们把多巴胺系统作为一个示例。事实证明，人类大脑的工作方式与 RL 模型非常相似。\n*   **心理学：** 这里研究了不同条件下的行为，例如人类如何反应和适应，这与\
  \ RL 有着密切的联系。\n*   **经济学：** 最重要的主题之一是在现实世界知识不完全且条件不断变化的情况下，如何最大化奖励。\n*   **数学：**\
  \ 我们使用理想化的系统，并在运筹学中关注寻找最优条件。\n\n![\\[图像\\]](Images/01_03.jpg)\n\n**图 1.3：** 强化学习的不同领域\n\
  \n在本章的下一节中，您将熟悉 RL 的理论基础，这些基础使得能够开发解决 RL 任务的方法。这一节对于理解本书的其余部分非常重要。\n\n## 1.6 强化学习的理论基础\n\
  \n在本节中，我们将考虑 RL 的理论基础。首先，将介绍上述讨论过的形式化（奖励、智能体、动作、观测和环境）的数学表示和符号。在此基础上，我们将考虑进一步的 RL\
  \ 专业术语，如`状态` (State)、`回回` (Episode)、`轨迹` (Trajectory)、`价值` (Value) 和`收益` (Return)，我稍后将在书中书中反复使用这些术语来描述不同的方法。\n\
  \n### 1.6.1 马尔可夫决策过程\n\n马尔可夫决策过程的描述类似于俄罗斯娃娃：我们首先考虑最简单的`马尔可夫过程`情况，通过添加奖励将其扩展，使其成为`马尔可夫决策过程`。然后我们添加动作并将整体封装，从而产生`马尔可夫决策过程`。\n\
  \n一个系统要被称为 `MDP`，它必须具有`马尔可夫属性`。这意味着未来的变化仅取决于当前状态。在计算机科学中，`MDPs` 经常使用，因为它们的状态不仅取决于过去。\n\
  \n### 1.6.2 马尔可夫过程\n\n我们首先考虑最简单的情况`马尔可夫过程`。假设您有一个只能观测`状态`的系统。`马尔可夫属性`将我们的模型限制为仅表示被称为`状态空间`的情况。\n\
  \n因此，在一个晴天的日子，明天晴天的概率是 80%，下雨的概率是 20%。当我们观察到雨天时，天气好转的概率是 10%，明天还是雨天的概率是 90%。\n\n\
  就这些了。马尔可夫过程的正式定义如下：\n\n\n\n\n*   Es gibt eine Menge `S` von Zuständen, die das System\
  \ annehmen kann.\n*   Eine Übergangsmatrix `T` mit Übergangswahrscheinlichkeiten\
  \ legt das Verhalten des Systems fest.\n\nEin Graph mit Knoten, die den Zuständen\
  \ des Systems entsprechen und Kanten, die mit den Übergangswahrscheinlichkeiten\
  \ gekennzeichnet sind, ist eine nützliche visuelle Repräsentation eines Markov-Prozesses.\
  \ Wenn die Übergangswrscheinlichkeit 0 ist, wird die Kante nicht gezeichnet, weil\
  \ es keine Möglichkeit gibt, von dem einen Zustand zum anderen zu gelangen. Diese\
  \ Art der Darstellung wird auch zur Repräsentation endlicher Automaten verwendet,\
  \ die Gegenstand der Automatentheorie sind. bildung 1.4 zeigt den Graphen für unser\
  \ Wettermodell.\n\nWir sprechen hier wieder nur von Beobachtungen. Wir haben keine\
  \ Möglichkeit, das Wetter zu beeinflussen, deshalb beobachten wir nur und zeichnen\
  \ unsere Beobachtungen auf.\n\nAls etwas komplizierteres Beispiel betrachten wir\
  \ ein Modell für einen Büroangestellten (Dilbert, die Hauptfigur in Scott Adams\
  \ berühmten Cartoons, ist ein gutes Beispiel). Sein Zustandsraum sieht folgendermaßen\
  \ aus‌:\n\n*   **Zuhause:** Er ist nicht im Büro.\n*   **Computer:** Er arbeitet\
  \ im Büro an seinem Computer.\n*   **Kaffee:** Er trinkt im Büro einen Kaffee.\n\
  *   **Chat:** Er unterhält sich im Büro mit seinen Kollegen.\n\n![\\[Bild\\]](Images/01_04.jpg)\n\
  \n**Abb. 1.4:** Modell für sonniges oder regnerisches Wetter\n\nbildung 1.5 zeigt\
  \ den Graphen der Zustandsübergänge.\n\n![\\[Bild\\]](Images/01_05.jpg)\n\n**Abb.\
  \ 1.5:** Graph der Zustandsbergänge\n\nWir nehmen an, dass der Arbeitstag für gewöhnlich\
  \ mit dem Zustand `Zuhause` beginnt und dass er zunächst immer einen `Kaffee` trinkt\
  \ – und zwar ausnahmslos, deshalb gibt es die Kanten `Zuhause` → `Computer` bzw.\
  \ `Zuhause` → `Chat` nicht. Das Diagramm zeigt außerdem, dass der Arbeitstag immer\
  \ ausgehend vom Zustand `Computer` endet, also wieder der Zustand `Zuhause` erreicht\
  \ wird. Die Übergangsmatrix für das Diagramm in bildung 1.5 sieht folgendermaßen\
  \ aus:\n\n|  || Zuhause || Kaffee || Chat || Computer |\n| --- | --- | --- | ---\
  \ | --- |\n| **Zuhause** || 60% || 40% || 0% || 0% |\n| --- | --- | --- | --- |\
  \ --- |\n| **Kaffee** || 0% || 10% || 70% || 20% |\n| **Chat** || 0% || 20% || 50%\
  \ || 30% |\n| **Computer** || 20% || 20% || 10% || 50% |\n\nDie Übergangswahrscheinlichkeiten\
  \ können auch wie in bildung 1.6 direkt im Graphen der Zustandsübergänge angegeben\
  \ werden.\n\n![\\[Bild\\]](Images/01_06.jpg)\n\n**Abb. 1.6:** Graph der Zustandsübergänge\
  \ mit Übergangswahrscheinlichkeiten\n\nIn der Praxis haben wir nur selten das Glück,\
  \ die Übergangsmatrix genau zu kennen. Realistischer ist es, dass uns nur Beobachtungen\
  \ der Zustände des Systems zur Verfügung stehen, die auch als `Episoden*‌ bezeichnet\
  \ werden:\n\n*   Zuhause → Kaffee → Kaffee → Chat → Kaffee → Computer → Zuhause\n\
  *   Computer → Computer → Chat → Chat → Kaffee → Computer → Computer → Computer\n\
  \nAls etwas komplizierteres Beispiel betrachten wir ein Modell für einen Büroangestellten\
  \ (Dilbert, die Hauptfigur in Scott Adams berühmten Cartoons, ist ein gutes Beispiel).\
  \ Sein Zustandsraum sieht folgendermaßen aus‌:\n\n*   **Zuhause:** Er ist nicht\
  \ im Büro.\n*   **Computer:** Er arbeitet im Büro an seinem Computer.\n*   **Kaffee:**\
