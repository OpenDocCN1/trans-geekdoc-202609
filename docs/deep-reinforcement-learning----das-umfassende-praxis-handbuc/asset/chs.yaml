  \ 18.6 Experimente mit der Policy\n\nDas erste Modell habe ich mit dem Belohnungssystem\
  \ `Height` und ohne `zero_yaw` trainiert. Ein Video, das den Roboter bei der Ausführung\
  \ der Policy zeigt, ist hier verfügbar: [`www.youtube.com/watch?v=u5rDogVYs9E`](https://www.youtube.com/watch?v=u5rDogVYs9E).\
  \ Die Bewegungen wirken unnatürlich. Das vordere rechte Bein bewegt sich beispielsweise\
  \ überhaupt nicht. Dieses Modell ist in der Datei `Chapter18/hw/libhw/t1.py` verfügbar.\n\
  \nDa dieses Verhalten im Zusammenhang mit der Beobachtung der Gierung stehen könnte,\
  \ die sich während des Trainings und beim Schlussfolgern unterscheiden, habe ich\
  \ das Modell erneut mit der Kommandozeilenoption `--zero_yaw` trainiert. Das Ergebnis\
  \ ist etwas besser: Jetzt bewegen sich alle Beine, aber die Aktionen des Roboters\
  \ sind noch immer nicht sehr stabil. Das dazugehörige Video finden Sie unter [`www.youtube.com/watch?v=1JVVnWNRi9k`](https://www.youtube.com/watch?v=1JVVnWNRi9k)\
  \ und das Modell in der Datei `Chapter18/hw/libhw/t1zyh.py`.\n\nDas dritte Experiment\
  \ habe ich mit einem anderen Belohnungssystem ausgeführt, nämlich mit `HeightOrient`,\
  \ das nicht nur die Höhe berücksichtigt, sondern auch prüft, ob der Roboter parallel\
  \ zum Boden ausgerichtet ist. Das Modell finden Sie in der Datei `Chapter18/hw/libhw/t1zyho.py`.\
  \ Es lieferte schließlich das Ergebnis, das ich hatte: Der Roboter ist in Lage aufzustehen\
  \ und in aufrechten Haltung zu bleiben. Das Video finden Sie hier: [`www.youtube.com/watch?v=eA4q8FMmo`](https://www.youtube.com/watch?v=eA4q8FMmo).\n\
  \nIch habe auch ein wenig mit dem Belohnungssystem `MoveForward` experimentiert,\
  \ aber sogar in Simulationen sieht die resultierende Policy merkwürdig aus. Höchstwahrscheinlich\
  \ liegt das an ungeeeten Modellparametern, die verbessert werden müssen, um eine\
  \ realistere Simulation des Roboters zu erreichen. Während des Experiments ist die\
  \ result result result result,. Das Video zu hier: [`www.youtube.com/watch?v=eA4q8FMmo`](https://www.youtube.com/watch?v=eA4q8FMmo)\n\
  \n\n\n\n在本章中，我们将详细观察两个任务：`RoboschoolHalfCheetah-v1`（一种双足生物模型）和四条腿的 `RoboschoolAnt-v1`。状态空间和动作空间与第\
  \ 17 章中的 Minitaur 环境非常相似：状态包含关节属性，而动作是这些关节的激活。在这两种情况下，目标都是尽可能远地移动并最小化所需的能量。图 19.1\
  \ 展示了这两个环境的截图。\n\n![\\[图片\\]](Images/19_01.jpg)\n\n**图 19.1:** 两个 Roboschool 环境：`RoboschoolHalfCheetah`\
  \ 和 `RoboschoolAnt`\n\n安装 Roboschool 请参考 [`github.com/openai/roboschool`](https://github.com/openai/roboschool)\
  \ 上的指南。需要一些额外的组件，并且必须创建并使用修改过的 PyBullet 版本。\n\n安装 Roboschool 后，您应该能够在代码中使用 `import\
  \ roboschool` 来访问这些新环境。\n\n安装过程可能并不特别简单顺畅。在我的情况下，必须根据源代码编译包，因为预编译的 Python 包依赖于更高版本的\
  \ `libc`。无论如何，GitHub 上的指南都有帮助。\n\n## 19.2 标准 A2C 算法 为了确定基准值，我们将以与上一章类似的方式使用 A2C\
  \ 方法。\n\n### 19.2.1 实现\n\n您可以在 `Chapter19/01_train_a2c.py` 和 `Chapter19/lib/model.py`\
  \ 文件中找到完整代码。这种变与我们在上一章使用的版本之间存在一些差异。首先，训练时使用 16 个并行的环境来收集经验。第二个区别涉及模型结构以及我们进行探索的方式。为了说明，我们查看模型和代理类。\n\
  \nActor 和 Critic 是独立的网络，没有共享权重。它们遵循了上一章的方法，即 Critic 网络估计动作的均值和方差，但现在方差不再是网络的独立输出，而是模型的一个单一参数。该参数在训练过程中通过\
  \ `SGD` 进行调整，但它不依赖于观测值。\n\n```\nHID_SIZE = 64\n\nclass ModelActor(nn.Module):\n\
  \    def __init__(self, obs_size, act_size):\n        super(ModelActor, self).__init__()\n\
  \n        self.mu = nn.Sequential(\n            nn.Linear(obs_size, HID_SIZE),\n\
  \            nn.Tanh(),\n            nn.Linear(HID_SIZE, HID_SIZE),\n          \
  \  nn.Tanh(),\n            nn.Linear(HID_SIZE, act_size),\n            nn.Tanh(),\n\
  \        )\n        self.logstd = nn.Parameter(torch.zeros(act_size))\n\n    def\
  \ forward(self, x):\n        return self.mu(x)\n```\n\nActor 网络拥有两个隐藏层，每层有 64 个神经元，并使用\
  \ `Tanh` 函数作为非线性函数。方差被建模为独立的网络参数，并解释为标准差的对数。\n\n```\nclass ModelCritic(nn.Module):\n\
  \    def __init__(self, obs_size):\n        super(ModelCritic, self).__init__()\n\
  \n        self.value = nn.Sequential(\n            nn.Linear(obs_size, HID_SIZE),\n\
  \            nn.ReLU(),\n            nn.Linear(HID_SIZE, HID_SIZE),\n          \
  \  nn.ReLU(),\n            nn.Linear(HID_SIZE, 1),\n        )\n\n    def forward(self,\
  \ x):\n        return self.value(x)\n```\n\nCritic 网络同样拥有两个相同大小的隐藏层，输出单个值，即对 `V(s)`（折扣状态值）的估计。\n\
  \n```\nclass AgentA2C(ptan.agent.BaseAgent):\n    def __init__(self, net, device=\"\
  cpu\"):\n        self.net = net\n        self.device = device\n\n    def __call__(self,\
  \ states, agent_states):\n        states_v = ptan.agent.float32_preprocessor(states)\n\
  \        states_v = states_v.to(self.device)\n\n        mu_v = self.net(states_v)\n\
  \        mu = mu_v.data.cpu().numpy()\n        logstd = self.net.logstd.data.cpu().numpy()\n\
  \        rnd = np.random.normal(size=logstd.shape)\n        actions = mu + np.exp(logstd)\
  \ * rnd\n        actions = np.clip(actions, -1, 1)\n        return actions, agent_states\n\
  ```\n\n将状态转换为动作的代理只需询问预测的均值即可。\n\n### 19.2.2 结果\n\n默认使用 `RoboschoolHalfCheetah-v1`，您可以通过传递参数\
  \ `-e` 和所需的环境 ID 来更改它。\n\n\n\n\n\n![\\[图\\]](Images/19_09.jpg)\n\n**图 19.9：** 测试\
  \ RoboschoolAnt 环境期间的奖励（左侧）和回合步骤（右侧）\n\n### 19.2.3 视频录制\n\n一如既常，我们有一个辅助程序，用于评估已训练模型的性能并将智能体的动作录制成视频，即\
  \ `Chapter19/02_play.py` 文件。该程序适用于本章所示的所有方法（因为 `Actor-网络` 是致的）。通过 `-e` 选项，您可以更改环境的名称。\n\
  \n## 19.3 近端策略优化 (PPO)\n\n该方法最初由 OpenAI 团队开发，并在 TRPO（源于 2015 年）之后很久提出。PPO 比 TRPO\
  \ 简单得多，因此我们从这里开始。名为 *Proximal Policy Optimization* 的论文由 John Schulman 等于 2017 年发表（arXiv:1707.06347）。\n\
  \n与经典的 A2C 方法相比的关键改进是用于估计 Advantage 的表达式发生了。PPO 方法使用执行动作的对数概率的梯度，而是使用另一个目标值：新策略与旧策略之间的比例，并用\
  \ Advantage 值进行缩放。\n\n在数学形式上，A2C 方法的目标值记录为 ![图](img/19_10.jpg)。PPO 方法实现的目标值是 ![图](img/19_11.jpg)。如果我们现在盲目地最大化这个值，可能会导致策略权重的过度调整。为了限制更新，我们使用裁剪目标值。我们将新策略与旧策略的比例\
  \ ![图](img/19_12.jpg) 限制在 $[1-\\epsilon, 1+\\epsilon]$，这样我们可以通过 $\\epsilon$ 限制调整的大小。\n\
  \n另一个差异是 Advantage 值的估计。在 A2C 文章中，通过 *T* 步估计得到的 Advantage 形式为 ![图](img/19_14.jpg)。在\
  \ PPO 工作中，作者使用更通用的估计形式 ![图](img/19_15.jpg)，其中 ![图](img/19_16.jpg) 是。原始的 A2C 估计是\
  \ $\\lambda = 1$ 时建议方法的特例。\n\n此外，PPO 方法使用略有不同的训练过程：它从环境获取长序列，并在若干训练周期之前估计整个序列的 Advantage\
  \ 值。\n\n### 19.3.1 实现\n\n示例代码可以在 `Chapter19/04_train_ppo.py` 和 `Chapter19/lib/model.py`\
  \ 文件中找到。Actor 和 Critic 类与标准 A2C 相同。差异在于训练方法和 Advantage 值的计算，但首先考虑超参数。\n\n```\nENV_ID\
  \ = \"RoboschoolCheetah-v1\"\nGAMMA = 0.99\nGAE_LAMBDA = 0.95\n```\n\n您熟悉 `GAMMA`\
  \ 值，但 `GAE_LAMBDA` 是一个新常量，表示估计 Advantage 值时的 Lambda 因子。在 PPO 文章中使用 0.95 值。\n\n```\n\
  TRAJECTORY_SIZE = 204\nLEARNING_RATE_ACTOR = 1e-5\nLEARNING_RATE_CRITIC = 1e-4\n\
  ```\n\n该方法假设环境每次迭代都会提供大量的转换（如章节所示）。此外，我们为 Actor 和 Critic 使用了不同的优化器（因为它们不共享权重）。\n\
  \n```\nPPO_EPS = 0.2\nPPO_EPOCHS = 10\nPPO_BATCH_SIZE = 64\n```\n\n对于每个包含 `TRAJECTORY_SIZE`\
  \ 步的批，我们进行 `PPO_EPOCHS` 次迭代，每批包含 64 个回合。`PPO_EPS` 值规定了裁剪时新策略与旧策略的比例。\n\n```\nTEST_ITERS\
  \ = 1000\n```\n\n在每次从环境接收 1000 个观测后，我们执行测试以获得总奖励。下面的函数根据轨迹步骤确定 Actor 的 Advantage\
  \ 值和 Critic 训练的参考值。轨迹不是单个回合，而是包含多个相互关联的回合。\n\n```python\ndef calc_adv_ref(trajectory,\
  \ net_crt, states_v, device=\"cpu\"):\n    values_v = net_crt(states_v)\n    values\
  \ = values_v.squeeze().data.numpy()\n```\n\n首先，我们指示 Critic 将状态转换为值。\n\n```python\n\
  last_gae = 0.0\nresult_adv = []\nresult_ref = []\nfor val, next_val, (exp,) in zip(reversed(values[:-1]),\n\
  \                                 reversed(values[1:]),\n                      \
  \           reversed(trajectory)):\n```\n\n此循环将获取的值与经验值连接。对于轨迹的每一步，我们需要计算最后 _gae\
  \ 值。\n\n```python\nif exp.done:\n    delta = exp.reward - val\n    last_gae = delta\n\
  else:\n    delta = exp.reward + GAMMA * next_val - val\n    last_gae = delta + GAE_LAMBDA\
  \ * last_gae\nresult_adv.append(last_gae)\nresult_ref.append(last_gae + val)\n```\n\
  \n最后，我们反转列表以获取存储的 Advantage 值和参考值。\n\n```python\nadv_v = torch.FloatTensor(list(reversed(result_adv)))\n\
  ref_v = torch.FloatTensor(list(reversed(result_ref)))\nreturn adv_v.to(device),\
  \ ref_v.to(device)\n```\n\n\n\n\n当轨迹足够长以进行训练时（由超参数 `TRAJECTORY_SIZE` 决定），我们将状态和已执行的动作转换为张量，并使用前面描述的函数获取优势值（Advantage\
  \ values）和参考值（Reference values）。尽管轨迹相当长，但我们测试环境的观测非常紧凑，因此我们可以轻松地一步处理批次（batch）。对于\
  \ Atari 帧，这样的批次可能会导致 GPU 内存错误。\n\n在下一步中，我们计算已执行动作概率的对数。该值在 PPO 的目标函数中使用作为 `π[θ][old]`。此外，我们对优势值的平均值和方差进行归一化以以训练的稳定性。\n\
  \n```\nmu_v = net_act(traj_states_v)\nold_logprob_v = calc_logprob(\n    mu_v, net_act.logstd,\
  \ traj_actions_v)\ntraj_adv_v = traj_adv_v - torch.mean(traj_adv_v)\ntraj_adv_v\
  \ /= torch.std(traj_adv_v)\n```\n\n接下来的两行删除了轨迹的最后一个条目，以反映优势值和参考值比轨迹少一步的事（因为我们在 `calc_adv_ref`\
  \ 函数的循环中移动了这些值）。\n\n```\ntrajectory = trajectory[:-1]\nold_logprob_v = old_logprob_v[:-1].detach()\n\
  ```\n\n当所有准备工作完成后，我们使用轨迹进行若干轮（epochs）训练。在在每个批次中，我们提取相关数组的部分，并分别对 Critic 和 Actor\
  \ 进行训练。\n\n```\nfor epoch in range(PPO_EPOCHES):\n    for batch_ofs in range(0,\
  \ len(trajectory),\n                           PPO_BATCH_SIZE):\n         batch_l\
  \ = batch_ofs + PPO_BATCH_SIZE\n         states_v = traj_states_v[batch_ofs:batch_l]\n\
  \         actions_v = traj_actions_v[batch_ofs:batch_l]\n         batch_adv_v =\
  \ traj_adv_v[batch_ofs:batch_l]\n         batch_adv_v = batch_adv_v.unsqueeze(-1)\n\
  \         batch_ref_v = traj_ref_v[batch_ofs:batch_l]\n         batch_old_logprob_v\
  \ = \\\n             old_logprob_v[batch_ofs:batch_l]\n```\n\n为了训练 Critic 网络，我们只需要与之前确定的参考值计算均方误差（MSE）。\n\
  \n```\nopt_crt.zero_grad()\nvalue_v = net_crt(states_v)\nloss_value_v = F.mse_loss(value_v.squeeze(-1),\
  \ batch_ref_v)\nloss_value_v.backward()\nopt_crt.step()\n```\n\n在 Actor 训练中，我们最小化负的裁剪目标值：\n\
  \n![图片](img/19_19.jpg) 结合 ![图片](img/19_20.jpg)。\n\n以下几代码是该公式的直接实现。\n\n```\nopt_act.zero_grad()\n\
  mu_v = net_act(states_v)\nlogprob_pi_v = calc_logprob(mu_v, net_act.logstd, actions_v)\n\
  ratio_v = torch.exp(logprob_pi_v - batch_old_logprob_v)\nsurr_obj_v = batch_adv_v\
  \ * ratio_v\nc_ratio_v = torch.clamp(ratio_v, 1.0 - PPO_EPS,1.0 + PPO_EPS)\nclipped_surr_v\
  \ = batch_adv_v * c_ratio_v\nloss_policy_v = -torch.min(surr_obj_v, clipped_surr_v).mean()\n\
  loss_policy_v.backward()\nopt_act.step()\n```\n\n### 19.3.2 结果\n\n在我们的两个测试环境上进行训练后，PPO\
  \ 方法相比 A2C 方法有了显著的改进。图 19.10 和 图 19.11 显示了在 RoboschoolHalfCheetah-v1 环境中的训练进展。该方法在仅训练了两个小时且少于\
  \ 500 万次观测后，在测试回合中就就达到了 2,500 的奖励，这明显优于 A2C 方法，后者为此需要 1 亿次观测和 19 小时的训练。\n\n![图片](img/19_21.jpg)\n\
  \n**图 19.10：** HalfCheetah 在 PPO 训练期间的奖励（左）和步数（右）\n\n![图片](img/19_22.jpg)\n\n**图\
  \ 19.11：** HalfCheetah 在 PPO 测试期间的奖励（左）和步数（右）\n\n![图片](img/19_23.jpg)\n\n**图 19.12：**\
  \ 训练期间的奖励\n\n![图片](img/19_24.jpg)\n\n**图 19.13：** PPO 与 A2C 在训练期间（左）和测试期间（右）的奖励对比\n\
  \n在 RoboschoolAnt 环境中，PPO 相比 A2C 表现出更好的性能。\n\n\n\n\n\n```\nopt_crt.zero_grad()\n\
  value_v = net_crt(traj_states_v)\nloss_value_v = F.mse_loss(value_v.squeeze(-1),\
  \ traj_ref_v)\nloss_value_v.backward()\nopt_crt.step()\n```\n\n为了执行 TRPO 步，我们需要两个函数。第一个函数计算当前\
  \ Actor-Policy 的损失，它与 PPO 类似，使用了新旧策略的比例乘以优势估计（Advantage Estimation）。第二个函数计算旧策略与当前策略之间的\
  \ KL 散度。\n\n```python\ndef get_loss():\n    mu_v = net_act(traj_states_v)\n    logprob_v\
  \ = calc_logprob(\n        mu_v, net_act.logstd, traj_actions_v)\n    dp_v = torch.exp(logprob_v\
  \ - old_logprob_v)\n    action_loss_v = -traj_adv_v.unsqueeze(dim=-1)*dp_v\n   \
  \ return action_loss_v.mean()\n\ndef get_kl():\n    mu_v = net_act(traj_states_v)\n\
  \    logstd_v = net_act.logstd\n    mu0_v = mu_v.detach()\n    logstd0_v = logstd_v.detach()\n\
  \    std_v = torch.exp(logstd_v)\n    std0_v = std_v.detach()\n    v = (std0_v **\
  \ 2 + (mu0_v - mu_v) ** 2) / \\\n        (2.0 * std_v ** 2)\n    kl = logstd_v -\
  \ logstd0_v + v - 0.5\n    return kl.sum(1, keepdim=True)\n\ntrpo.trpo_step(net_act,\
  \ get_loss, get_kl, args.maxkl,\n               TRPO_DAMPING, device=device)\n```\n\
  \n因此，PPO 方法相当于一种 TRPO，它通过使用简单的策略比例裁剪（Clipping）来限制策略的调整，而不是使用复杂的共轭梯度法（Conjugate Gradient\
  \ Method）。\n\n### 19.4.2 结果\n\nTRPO 的奖励增长速度比 PPO 慢，但最终能够找到比 PPO 和 A2C 更好的策略。在运行\
  \ 20 小时和 7000 万次观测后，TRPO 在最后 10 个测试回合中的平均奖励达到了 2.804。\n\n图 19.14 显示了训练和测试期间奖励的变化。图\
  \ 19.15 将其与 PPO 优化进行了对比。\n\n![\\[图片\\]](Images/19_31.jpg)\n\n**图 19.14:** HalfCheetah\
  \ 上的 TRPO：训练期间（左）和测试期间（右）奖励\n\n![\\[图片\\]](Images/19_32.jpg)\n\n**图 19.15:** HalfCheetah\
  \ 上 TRPO 与 PPO 的对比：训练期间（左）和测试期间（右）奖励\n\nRoboschoolAnt-v1 环境的训练成功率明显较低。最初情况与 PPO\
  \ 相似，但在 30 分钟后训练过程开始发散，最高奖励仅为 600。图 19.16 和图 19.17 中的图表仅显示了 TRPO 训练以及补充的 PPO 图表。\n\
