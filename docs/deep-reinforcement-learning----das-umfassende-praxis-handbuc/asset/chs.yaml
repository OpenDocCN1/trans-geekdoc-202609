  \ D4PG：Actor 的损失（左）和 Critic 的损失（右）\n\n![\\[Bild\\]](Images/17_23.jpg)\n\n**图 17.10:**\
  \ 测试期间的奖励（左）和步数（右）\n\n### 17.6.4 视频录制\n\n为了记录模型活动的视频，你可以再次使用 `Chapter17/05_play_ddpg.py`\
