  另一种对模型进行实验的方法是使用 `use_model.py` 脚本，你可以向模型传递一个字符串并指示它生成一个回答。\n\n```\n$ ./use_model.py\
  \ -m saves/sc-comedy-e40-\nno-skip/epoch_080_0.841_0.124.dat -s 'how are you?'\n\
  very well. thank you.\n```\n\n如果你通过选项 `--self` 传递一个数字，模型将将其自己的回答作为输入，并以此生成对话。\n\n\
  ```\n$ ./use_model.py -m saves/sc-comedy-e40-no-\nskip/epoch_080_0.841_0.124.dat\
  \ -s 'how are you?' --self 10\nvery well. thank you.\n okay ... it's fine.\n hey\
  \ ...\nshut up.\n fair enough.\n so?\nso, i saw my draw.\nwhat are you talking about?\n\
  just one.\ni have a car.\n```\n\n默认情况下，生成使用 `argmax`，因此模型的输出是由输入标记（tokens）定义的。这并不总是所希望的，因此我们可以通过传递\
  \ `--sample` 选项为输出添加随机性。在这种情况下，解码器在每一步都将根据概率分布随机抽取下一个标记。\n\n```\n$ ./use_model.py\
  \ -m saves/sc-comedy-e40-no-skip/\nepoch_080_0.841_0.124.dat -s 'how are you?' --self\
  \ 2 –sample very well.\nvery well.\n$ ./use_model.py -m saves/sc-comedy-e40-no-skip/\n\
  epoch_080_0.841_0.124.dat -s 'how are you?' --self 2 –sample very well.\nthank you.\n\
  ok.\n```\n\nTelegram 机器人\n\n最后一步使用训练模型实现了 Telegram 机器人。你需要在虚拟环境中通过 `pip install`\
  \ 安装 `python-telegram-bot` 包来运行该程序。此外，你还需要通过注册机器人获得的 API 令牌。该令牌必须存储在配置文件 `~/.config/rl4_bot.ini`\
  \ 中。文件的结构在 [`core.telegram.org/bots/father`](https://core.telegram.org/bots/father)\
  \ 文档中描述。程序逻辑与其他模型实验工具几乎没有区别：该工具接收用户的句子并用解码器生成的序列进行回答。\n\n```python\n#!/usr/bin/env\
  \ python3\n# 此模块需要 python-telegram-bot\nimport os\nimport sys\nimport logging\n\
  import configparser\n\ntry:\n    import telegram.ext\nexcept ImportError:\n    print(\"\
  需要 python-telegram-bot 包\")\n    sys.exit()\n\nfrom lib import data, model, utils\n\
  import torch\n\n# 配置文件内容：\n# api=API_KEY\nCONFIG_DEFAULT = \"~/.config/rl4_bot.ini\"\
  \n\nlog = logging.getLogger(\"telegram\")\n\nif __name__ == \"__main__\":\n    fmt\
  \ = \"%(asctime)-15s %(levelname)s %(message)s\"\n    logging.basicConfig(format=fmt,\
  \ level=logging.INFO)\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\n\
  \        \"--config\", default=CONFIG_DEFAULT,\n        help=\"配置文件, \" + CONFIG_DEFAULT)\n\
  \    parser.add_argument(\"-m\", \"--model\", required=True,\n                 \
  \       help=\"加载模型\")\n    parser.add_argument(\"--sample\", default=False,\n \
  \      action='store_true', help=\"启用采样模式\")\n    prog_args = parser.parse_args()\n\
  ```机器人支持两种运行模式：`argmax` 解码（默认启用）和采样模式。在 `argmax` 模式下，机器人对相同的句子总是相同的相同的。如果启用了采样模式，会在每一步从概率分布中采样，增加回答的多样性。\n\
  \n```python\nconf = configparser.ConfigParser()\nif not conf.read(os.path.expanduser(prog_args.config)):\n\
  \    log.error(\"配置文件 %s 不存在\",\n              prog_args.config)\n    sys.exit()\n\
  \nemb_dict = data.load_emb_dict(\n    os.path.dirname(prog_args.model))\nlog.info(\"\
  加载了包含 %d 条目的嵌入字典\",\n         len(emb_dict))\nrev_emb_dict = {\n    idx: word for\
  \ word, idx in emb_dict.items()\n}\nend_token = emb_dict[data.END_TOKEN]\n\nnet\
  \ = model.PhraseModel(\n    emb_size=model.EMBEDDING_DIM, dict_size=len(emb_dict),\n\
  \    hid_size=model.HIDDEN_STATE_SIZE)\nnet.load_state_dict(torch.load(prog_args.model))\n\
  ```\n\n上述代码读取配置文件获取 Telegram API 令牌，加载嵌入并权重初始化模型。由于不需要训练，我们不需要加载数据集。\n\n```python\n\
  def bot_func(bot, update, args):\n    text = \" \".join(args)\n    words = utils.tokenize(text)\n\
  \    seq_1 = data.encode_words(words, emb_dict)\n    input_seq = model.pack_input(seq_1,\
  \ net.emb)\n    enc = net.encode(input_seq)\n```\n\n此函数由 `python-telegram-bot` 库调用，用于指示用户的输入。我们接收句子，对其进行分词并将其转换为适合模型的格式。然后使用编码器来确定解码器的初始隐藏状态。\n\
  \n```python\nif prog_args.sample:\n    _, tokens = net.decode_chain_sampling(enc,\n\
  \                input_seq.data[0:1], seq_len=data.MAX_TOKENS,\n               \
  \ stop_at_token=end_token)\nelse:\n    _, tokens = net.decode_chain_argmax(enc,\n\
  \                input_seq.data[0:1], seq_len=data.MAX_TOKENS,\n               \
  \ stop_at_token=end_token)\n```\n\n接下来我们根据命令行参数调用相应的解码方法。作为结果，两种情况下得到解码序列的整数标记 ID\
  \ 序列。\n\n```python\nif tokens[-1] == end_token:\n    tokens = tokens[:-1]\nreply\
  \ = data.decode_words(tokens, rev_emb_dict)\nif reply:\n    reply_text = utils.untokenize(reply)\n\
  \    bot.send_message(chat_id=update.message.chat_id,\n                     text=reply_text)\n\
  ```\n\n\n\n当我们获得解码后的序列后，只需要通过我们的字典将其转换为文本形式并显示给用户即可。\n\n```python\nupdater = telegram.ext.Updater(conf['telegram']['api'])\n\
  updater.dispatcher.add_handler(telegram.ext.CommandHandler\n                   \
  \      ('bot', bot_func, pass_args=True))\nlog.info(\"Bot initialisiert und zu Diensten\"\
  )\nupdater.start_polling()\nupdater.idle()\n```\n\n最后一段代码是 `python-telegram-bot`\
  \ 库注册我们机器人函数的机制。要使用该机器人，您必须在 Telegram 聊天中输入命令 `/bot` 。\n\n图 14.15 显示了一个由经过训练的模型生成的对话示例。\n\
  \n![\\[图片\\]](Images/14_21.jpg)\n\n**图 14.15:** 生成的对话\n\n## 14.11 总结\n\n尽管本章的示例非常简单且带有某种趣味性，但\
  \ Seq2Seq 是 NLP 及其他领域中非常广泛的模型。因此，替代的 RL 方法潜在上适用于许多任务。在本章中，我们仅触及了深度 NLP 模型及其相关概念的表面，这些内容远超此本书的范围。我讨论了\
  \ NLP 模型的基础知识，例如循环神经网络和 Seq2Seq 算法，并展示了训练它们的各种方法。\n\n在下一章中，您将学习 RL 方法在另一个领域的应用示例：交互式游戏。\n\
  \n# 第 15 章：TextWorld 环境\n\n在上一章中，您已经了解了如何将 RL 方法用于自然语言处理（`Natural Language Processing`,\
  \ NLP）任务，特别是如何改进聊天机器人的学习过程。在本章中，我们将继续探索 NLP，并使用 RL 来解决交互式文本谜谜游戏，我们将使用一个由微软研究院发布的名为\
  \ `TextWorld` 的环境。\n\n本章主题：\n\n* 交互式小说（`Interactive Fiction`）游戏类型历史的要概述\n* TextWorld\
  \ 环境\n* 实现一个简单的 DQN 方法，并尝试通过基于循环神经网络（RNN）的命令生成器对其进行改进。在这里可以清楚地看到 RL 如何应用于具有巨大观测空间的复杂环境。\n\
  \n## 15.1 交互式小说\n\n正如您所看到的，电脑游戏不仅对人类具有趣味性，对于 RL 研究人员来说，由于复杂的观测和动作空间、游戏过程中长长的决策序列以及奖励系统，它们也构成了挑战。\n\
  \n像 Atari 2600 这样的街机游戏只是游戏行业提供的许多类型之一。Atari 2600 平台的普及在 20 世纪 70 年代末和 80 年代初达到巅峰。随后是\
  \ Z80 处理器及其克隆时代，它们最终演变成了今天的 PC 平台和游戏机。\n\n随着时间的推移，电脑游戏在图形方面变得越来越复杂、丰富和详细，这导致了对硬件的更高要求。这种发展增加了研究人员和从业者将\
  \ RL 方法应用于新游戏的难度。例如，实际上任何人都可以训练 RL 代理解决 Atari 游戏，但为了解决《星际争霸 II》，DeepMind 必须投入数周能量来运行\
  \ GPU 集群。此类活动对于未来的研究是必不可少的，因为它们可以验证概念并优化方法，但《星际争霸 II》或 Dota 等游戏的复杂性使得它们对于大多数感兴趣的人来说过于昂贵。\n\
  \n对于这个问题，有多种解决方案。例如，可以研究复杂度介于 Atari 和 `TextWorld` 之间的游戏。（等待，文本在这里中断了，我将根据原文继续）。\n\
  \n*注意：提供的源代码在末尾中间截断了。我已根据规则对现有的文本进行了格式化处理。*\n\n\n\n2018 年 6 月，Microsoft Research\
  \ 发布了一个开源项目，旨在为研究人员和强化学习（RL）爱好者提供一种简单的方法，让他们使用熟悉的工具对文本游戏进行实验。\n\n该项目名为“TextWorld”，可以在\
  \ GitHub 上找到（[`github.com/microsoft/TextWorld`](https://github.com/microsoft/TextWorld)）。它提供了以下功能：\n\
  \n* 一个用于文本游戏的 `Gym` 环境，支持两种游戏格式：Z-Machine 字节码（版本 1 到 8）和 Glulx 游戏。\n\n* 一个游戏生成器，允许创建随机任务，并带有诸如特定数量的对象、描述的复杂度以及任务时长等要求。\n\
  \n* 能够通过观察游戏状态来调整生成游戏的复杂性。例如，当智能体向正确的方向移动一步时，可以激活额外的奖励。其中一些因素将在下一节中进行描述。\n\n* 用于处理观测空间和动作空间、生成的游戏等的各种辅助函数。\n\
  \n在本章中，我们将探索环境的能力，并实现不同版本的训练代码来解决生成的游戏。虽然游戏的复杂度不是特别大，但你可以将其作为自己实验的基础以及验证想法的工具。\n\
  \n![\\[图像\\]](Images/15_02.jpg)\n\n**图 15.2：** 游戏 Zork I（地下部分）的地图\n\n## 15.2 环境\n\
  \n目前，TextWorld 环境仅支持 Linux 和 macOS，内部基于 Inform 7 系统（[`inform7.com`](http://inform7.com)）。TextWorld\
  \ 项目有两个网站：一个是 Microsoft Research 的（[`www.microsoft.com/en-us/research/project/textworld/`](https://www.microsoft.com/en-us/research/project/textworld/)），包含了有关环境的通用信息；另一个是\
  \ GitHub （[`github.com/microsoft/TextWorld`](https://github.com/microsoft/TextWorld)），介绍了安装和使用方法。\n\
  \n### 15.2.1 安装\n\n指南说明，你可以在虚拟 Python 环境中输入 `pip install textworld` 来安装该包。但目前这行不通，因为\
  \ Inform 7 的 URL 已经发生了变化。希望在发布下一个 TextWorld 版本时能够解决这个问题。如果你遇到困难，可以通过输入以下命令安装我为本示例测试过的版本：\n\
  \n```\npip install git+https://github.com/microsoft/TextWorld@f1ac489fefeb6a48684ed1f89422b84b7b7a6e4b\n\
  ```\n\n安装完成后，可以在 Python 代码中导入该包。它还提供了两个命令行程序用于生成或运行游戏：`tw-make` 和 `tw-play`。如果你有宏大的计划去自己解决\
  \ [`ifarchive.org`](http://ifarchive.org) 上的交互式游戏，则不需要这些程序；但为了简单起见，我们将从人工生成的游戏开始。\n\
  \n### 15.2.2 生成游戏\n\n辅助程序 `tw-make` 允许生成具有以下属性的游戏：\n\n* 游戏场景：例如，你可以选择一个经典任务，目标是使用对象并遵循特定的操作流程。或者你可以选择“收集硬币”场景，玩家必须探索环境并找到硬币。\n\
  \n* 游戏主题（Theme）：你可以通过所谓的“主题”来设置游戏的内部结构。但目前只有“house”和“basic”可用。\n\n* 对象属性：你可以为对象分配形容词。例如，“钥匙”可以获得一个形容词。\n\
  \n* 对象数量：你可以规定游戏中存在的对象数量。\n\n* 游戏时长：你可以规定游戏应该持续多少步。\n\n* 环境复杂度：你可以影响环境的复杂度。\n\n\
  * 随机数生成器种子：你可以为随机数生成器设置一个种子值，以获得可复现的游戏。\n\n```\n$ tw-make --scenario collect --theme\
  \ house --objects 5 --duration 20 --seed 42\n```\n\n\n\n```python\nIn [1]: import\
  \ textworld\nIn [2]: from textworld.gym import register_game\nIn [3]: import gym\n\
  In [4]: env_id = register_game(\"t1.ulx\")\nIn [5]: env_id\nOut[5]: 'tw-v0'\nIn\
  \ [6]: env = gym.make(env_id)\nIn [7]: env\nOut[7]: <TimeLimit<TextworldGamesEnv<tw-v0>>>\n\
  In [8]: r = env.reset()\nIn [9]: r\nOut[9]:\n(\"\\n\\n\\n        ________  ________\
  \  __    __  ________\n\\n         |        \\|        \\|    \\  |  \\|       \
  \ \\\n\\n          \\$$$$$$$$| $$$$$$$$| $$  | $$ \\$$$$$$$$\n\\n           | $$\
  \   | $$__     \\$$\\/  $$   | $$\\\n\\n           | $$   | $$  \\     >$$  $$ \
  \   | $$\\\n\\n           | $$   | $$$$$    /  $$$$\\    | $$\\\n\\n           |\
  \ $$   | $$_____ |  $$ \\$$\\   | $$\\\n\\n           | $$   | $$     \\| $$  |\
  \ $$   | $$\\\n\\n            \\$$    \\$$$$$$$$ \\$$   \\$$    \\$$\n\\n      \
  \ __       __   ______   _______   __        _______\n\\n        |  \\  _  |  \\\
  \ /      \\ |       \\ |  \\      |    \n\\ \\ \\n       | $$ / \\ | $$|  $$$$$$\\\
  | $$$$$$$\\| $$      |\n$$$$$$$\\\\n       | $$/  $\\| $$| $$  | $$| $$__| $$| $$\
  \      |\n$$  | $$\\n      | $$  $$$\\ $$| $$  | $$| $$    $$| $$      |\n$$  |\
  \ $$\\n      | $$ $$\\$$\\$$| $$  | $$| $$$$$$$\\| $$    \n| $$  | $$\\\\n     \
  \  | $$$$  \\$$$$| $$__/ $$| $$  | $$| $$_____\n| $$__/ $$\\n       | $$$    \\\
  $$$ \\$$     $$| $$  | $$| $$\n    \\| $$    $$\\n       \\$$      \\$$  \\$$$$$$\
  \  \\$$   \\$$\n \\$$$$$$$$ \\$$$$$$$ \\n\\nGet ready to pick stuff up and put it\n\
  in places, because you've just entered TextWorld! First step,\ntry to take a trip\
  \ east. And then, head south. Next, make an\neffort to take a trip south. If you\
  \ can accomplish that, try\nto take a trip west. With that accomplished, recover\
  \ the coin\nfrom the floor of the chamber. Got that? Good!\\n\\n-=Spare\nRoom=-\\\
  nYou are in a spare room. An usual one.\\n\\n\\n\\nYou\ndon't like doors? Why not\
  \ try going east, that entranceway is\nunblocked.\\n\\n\\n\\n\",\n{})\n```\n\n我们已经在\
  \ `Gym` 游戏注册表中注册了该游戏，创建了环境并获取了第一个观测结果。是的，这片文本荒野就是我们的观测值，智能体必须从中选择下一个动作。如果你仔细查看 `reset()`\
  \ 方法的结果，你会发现它不是一个字符串，而是一个由字符串和字典组成的元组。\n\n这是导致 TextWorld 与 `Gym` API 不兼容的特性之一。实际上，`Env.reset()`\
  \ 应该只返回观测值，但 TextWorld 返回了观测值和*额外信息*，这些信息是以字典的形式提供的。在下一节中，我们将查看游戏的额外信息，并将为什么以这种方式实现。首先，请记住\
  \ `reset()` 会返回额外信息即可。我们继续探索环境。\n\n```python\nIn [10]: env.observation_space\nOut[10]:\
  \ Word(L=200, V=1250)\nIn [11]: env.action_space\nOut[11]: Word(L=8, V=1250)\nIn\
  \ [12]: env.action_space.sample()\nOut[12]: array([ 575, 527, 84, 1177, 543, 702,\
  \ 1139, 178])\nIn [13]: type(env.action_space)\nOut[13]: textworld.gym.spaces.text_spaces.Word\n\
  ```\n\n如你所见，观测空间和动作空间由 TextWorld 库提供的自定义类 `Word` 表示。该类存储了一个包含特定词汇单词的变长序列。在观测空间中，该单词序列的最大长度为\
  \ 200（在上面的代码中对应赋值 `L=200`），词汇包含 1250 个 Token (`V=1250`)。动作空间使用相同的词汇，但单词序列较短：它们最多包含八个\
  \ Token。\n\n从上一章中知道，在处理自然语言时，序列被表示为来自词汇的 Token ID 列表。可以通过 `Word` 类访问词汇。有以下几种方式：\n\
