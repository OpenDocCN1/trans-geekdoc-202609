  \ 值\n\n## 13.6 总结\n\n在本章中，我讨论了为什么对于 PG 方法，由于其属于同策略（On-Policy）方法，从多个环境中收集训练数据是关重要的。我们实现了两种不同的\
  \ A3C 方法来并行化和稳定训练过程。在本书的后续部分，当我们在第 20 章 处理黑盒方法时，我会再次提到并行化。\n\n在接下来的三个章节中，我们将讨论一些使用\
  \ PG 方法解决的问题。\n\n\n\n\nEs gibt zahlreiche Möglichkeiten: einen Chatbot, der sich\
  \ mit einem Benutzer unterhält, mehrere Chatbots, die miteinander unterhalten, usw.\
  \ Es könnte beispielsweise ein Bot sein, der technischen Support bietet und in der\
  \ Lage ist, frei formulierte Fragen der Nutzer zu beantworten. Chatbots besitzen\
  \ normalerweise bestimmte Eigenschaften, die einen Dialog ausmachen (der Benutzer\
  \ stellt eine Frage, aber der Chatbot kann nachfragen, um fehlende Informationen\
  \ zu erhalten), und verstehen natürliche Sprache – das ist der Unterschied zu Telefonmenüs,\
  \ bei denen man beispielsweise eine bestimmte Zahl tippen muss, um eine Funktion\
  \ auszuwählen, oder bei denen man die Nummer eines Bankkontos eingeben muss, um\
  \ den Kontostand zu überprüfen.\n\n## 14.2 Chatbot-Training\n\nDas Verständnis natürlicher\
  \ Sprache ist ein Konzept, das es in der Science-Fiction schon lange gibt. In Videospielen\
  \ unterhält man sich einfach mit dem Bordcomputer des Raumschiffs, um nützliche\
  \ und relevante Informationen über die jüngste Invasion zu erhalten – ohne irgendwelche\
  \ Tasten zu drücken. So beschreiben Autoren seit Jahrzehnten, aber in der Realität\
  \ gibt es solche Interaktionen mit Computern erst seit Kurzem. Mit einem Raumschiff\
  \ können Sie zwar noch nicht sprechen, aber Sie können zumindest Ihre Tastendrücke\
  \ ein- und aussch, was ein großer Schritt vorwärts ist!\n\nDass es so lange dauert,\
  \ bis Computer Sprache verstehen, liegt an der Komplexität der Sprache selbst. Selbst\
  \ wenn man etwas Einfaches wie `Toaster` sagen möchte, ist es im Allgemeinen sehr\
  \ schwierig, all diese Möglichkeiten und Sonderfälle durch herkömmliche Programierungstechniken\
  \ zu erfassen. Bei traditioneller Programmierung ist es leider notwendig, exakte\
  \ und eindeutige Anweisungen zu geben. Ein einziger Sonderfall oder geringste Unklarheit\
  \ kann dafür sorgen, dass Code nicht funktioniert.\n\nMachine Learning (ML) und\
  \ Deep Learning (DL) sind die ersten Schritte, um dieses Konzept zu ersetzen: Der\
  \ Computer findet die Muster in den Daten selbst. Dieser Ansatz hat sich in manchen\
  \ Bereichen als erfolgreich erwiesen, und jetzt fassen mit den neuen Verfahren und\
  \ ihren potenziellen Anwendungen. Deep Learning nahm seinen Ausgangspunkt im Bereich\
  \ Computer Vision, dehnt sich auf die Erkennung natürlicher Sprache aus und wird\
  \ zukünftig sicher weitere neue, nützliche Anwendungen geben.\n\nZurück zu den Chatbots:\
  \ Die Komplexität natürlicher Sprache war also das größte Hindernis für praktische\
  \ Anwendungen. Chatbots waren lange hauptsächlich Experimente der Softwareentwickler.\
  \ Eines der ältesten und bekanntesten Systeme dieser Art wurde in den 1960er-Jahren\
  \ `ELIZA` entwickelt ([`de.wikipedia.org/wiki/ELIZA`](https://de.wikipedia.org/wiki/ELIZA)).\n\
  \nAls Simulation eines Psychotherapeuten war `ELIZA` zwar erfolgreich, aber es gab\
  \ kein Verstehen der Sätze des Benutzers. Das System kannte lediglich einige gängige\
  \ Formulierungen und gab typische Antworten auf die Eingaben des Benutzers.\n\n\
