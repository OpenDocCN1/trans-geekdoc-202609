  \ BLEU %.3f, 测试 BLEU %.3f\",\n         epoch, np.mean(losses), bleu, bleu_test)\n\
  writer.add_scalar(\"loss\", np.mean(losses), epoch)\nwriter.add_scalar(\"bleu\"\
  , bleu, epoch)\nwriter.add_scalar(\"bleu_test\", bleu_test, epoch)\n```\n\n当所有 batch\
  \ 处理完毕后，我们计算训练的平均 BLEU 分，使用保留的数据进行测试并输出结果。\n\n```python\nif best_bleu is None or\
  \ best_bleu < bleu_test:\n    if best_bleu is not None:\n        out_name = os.path.join(saves_path,\n\
  \               \"pre_bleu_%.3f_%02d.dat\" % (bleu_test, epoch))\n        torch.save(net.state_dict(),\
  \ out_name)\n        log.info(\"新的最佳 BLEU %.3f\", bleu_test)\n    best_bleu = bleu_test\n\
  \nif epoch % 10 == 0:\n    out_name = os.path.join(saves_path,\n       \"epoch_%03d_%.3f_%.3f.dat\"\
