  *   `磁力计`（芯片 `LIS3MDL`）测量磁场相对于三个空间轴的方向，因此它本质上显示了北极所在的方向。\n*   `气压计`（`气压计`（芯片 `LPS331AP`）测量大气压，该压力可用于计算海海拔高度。对于我们的目的来说，我们不需要这个芯片，因为它的测量精度仅为\
  \ ±30 厘米。由于机器人并不打算从屋顶跳下，因此我们不使用该传感器。然而，对于其他应用，例如控制无人机或模型飞机，了解飞行高度可能具有重要意义。\n\n![\\\
