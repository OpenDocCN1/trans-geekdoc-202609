  \ Bilder angeben. Die vom Agenten ausgeführten Aktionen sind als Kreise an der Position\
  \ des Klicks dargestellt. Der Bereich auf der rechten Seite enthält Informationen\
  \ über die letzte Belohnung und die verbleibende Zeit bis zum Abbruch wegen Zeitüberschreitung.\
  \ Abbildung 16.9 zeigt ein Beispiel.\n\n![\\[Bild\\]](Images/16_09.jpg)\n\n**Abb.\
  \ 16.9:** Bildschirmfoto des Agenten in Aktion\n\n### 16.3.8 Probleme mit einfachem\
  \ Anklicken\n\nLeider kann der geführte Ansatz nur bei vergleichsweise einfachen\
  \ Aufgaben wie `ClickDialog` verwendet werden. Wenn Sie ihn auf komplizierte Aufgaben\
  \ anwenden, ist eine Konvergenz unwahrscheinlich. Dafür kann es mehrere Gründe geben.\
  \ Erst einmal ist unser Agent zustandslos, was im Wesentlichen bedeutet, dass er\
  \ die Entscheidung über eine Aktion nur von der Beobachtung abhängig macht, ohne\
  \ seine vorangegangenen Aktionen zu berücksichtigen. In Kapitel 1 habe ich die Markov-Eigenschaft\
  \ eines Markov-Entscheidungsprozesses (MDP) erörtert. Diese Eigenschaft ermöglicht\
  \ es, den vorangenen Verlauf zu verwerfen und nur die aktuelle Beobachtung zu behalten.\
  \ Selbst bei relativ einfachen MiniWoB-Aufgaben ist die Markov-Eigenschaft möglicherweise\
  \ nicht erfüllt. Es gibt beispielsweise eine Aufgabe namens `ClickButtonSequence-v0`,\
  \ bei der unser Agent erst auf den Button EINS und dann auf den Button ZWEI klicken\
  \ muss (Abbildung 16.10). Vielleicht hat der Agent... (注: Der Originaltext bricht\
  \ hier unvollständig/fragmentiert ab, die Übersetzung folgt der Struktur).\n\n\n\
  \n\n维度灾难可以通过多种方式来解决，例如通过更智能的探索方法、更高样本效率的训练（单次训练，One-shot-Training）、引入先验知识（迁移学习）以及其他方法。有大量的研究活动专注于改进和加速强化学习（RL），我们可以确信一些突破即将出现。在本节中，我们考虑一种比较经典的方法，即将人类执行的演示记录整合到训练过程中。\n\
  \n在第 4 章和第 7 章中，我讨论了策略内（On-Policy）和策略外（Off-Policy）的算法。这些算法对于人类演示这种方法至关重要，因为从严格来说来说，对于策略内算法（在本例中为\
  \ `A3C`），我们不能使用离策略数据（人类观测和动作的对）。这是由于策略内算法的特性决定的：它们根据当前策略收集的数据来估计策略梯度（PG）。如果我们只使用人类生成的数据进行训练，那么对人类策略的\
  \ PG 估计是有意义的，但对神经网络给出的当前策略没有意义。为了解决这个问题，我们必须稍微“作弊”，从监督学习的角度来看待我们的任务。具体来说，我们将使用对数似然目标值来驱动我们的网络利用演示数据。\n\
  \n在开始实现之前，我们必须澄清一个非常重要的问题：我们如何以尽可能合适的格式从演示中获取数据？\n\n### 16.4.1 演示记录\n\n记录演示没有万能的配方，因为它取决于观测细节和动作空间的具体情况。总的来说，我们应该存储人类或其他智能体可用的信息以及执行的动作。例如，如果我们想记录某人如何玩雅达游戏（游戏，我们必须存储显示器上显示的图像以及操作该图像时按下的按键。\n\
  \n在我们的 OpenAI-Universe 环境中，有一个基于 VNC 协议的优雅解决方案，用于通用数据传输。为了保存演示，我们必须录制 VNC 服务器发送给\
  \ VNC 客户端的图像以及客户端发送给服务器的鼠标和键盘动作。MiniWoB 通过 VNC 代理提供了这一功能（请参见图 16.13）。\n\n![\\[图像\\\
  ]](Images/16_13.jpg)\n\n**图 16.13：** 记录架构\n\n启动容器时，默认不会启动 VNC 代理，因为有一个独立的记录模式。要启动带有活动代理的容器，您必须传递它参数\
  \ `demonstration` `-e` `ENV_NAME`。此外，您必须启用端口转发，以便 VNC 代理监听的端口 `5899` 能够从容器外部访问。使用环境\
  \ `ClickTest2` 在记录模式下启动容器的完整命令行如下（另见 `Chapter16/adhoc/start_docker_demo.sh`）：\n\n\
  ```\ndocker run -e TURK_DB='' -p 5899:5899 --privileged --ipc host --cap-add SYS_ADMIN\
  \ shmuma/miniwob:v2 demonstration -e wob.mini.ClickTest2-v0\n```\n\n参数 `TURK_DB`\
  \ 是必需的，并且应该留空。\n（注：此处原文德语文本似乎存在部分重复或乱码，翻译已根据语境进行处理）\n\n\n\n\n最复杂的文件是 `client.fbs`\
  \ 和 `server.fbs`，因为它们以二进制格式存在，目前没有方便的显示程序可以处理这种格式（至少我不知道有这样的库）。VNC 协议正式名称为 `The\
  \ Remote Framebuffer Protocol`，并根据 `RFC6143` 标准化。你可以在 IETF 网站上的 [`tools.ietf.org/html/rfc6143`](https://tools.ietf.org/html/rfc6143)\
  \ 获取它。该协议定义了 VNC 客户端和服务器之间交换的消息，以便用户能够远程控制。客户端传输鼠标和键盘事件，而服务器负责发送桌面图像，以便客户端获取应用程序的最新视图。为了提高在慢网络连接下的性能，服务器通过选择性地压缩图像并仅发送图像中相关的（已变化的）部分来优化传输。\n\
  \n为了让演示记录在强化学习（RL）训练中更具可利用性，我们需要将 VNC 格式转换为一系列图像，并附带与时间对应的由用户触发的事件。为此，我使用二进制解析器语言\
  \ `KaiTai`（项目网站：[`kaitai.io/`](http://kaitai.io/)） 实现了一个针对 VNC 协议的小型解析器，它提供了一种使用声明式\
  \ YAML 格式语言读取复杂二进制文件格式的方法。如果你感兴趣，可以在 `Chapter16/ksy` 目录下找到客户端和服务器消息的源码。\n\n演示格式的\
  \ Python 代码位于 `Chapter16/lib/vnc_demo.py` 模块中。它包含了加载演示目录的高级函数，以及一组解释内部二进制格式的低级函数。`vnc_demo.load_demo()`\
  \ 函数返回一个元组列表。每个元组包含一个带有 MiniWoB 模型使用的观测值的 NumPy 数组，以及执行的鼠标动作索引。\n\n为了检查数据，有一个小型辅助程序\
  \ `Chapter16/ahdoc/demo_dump.py`。它加载包含 `client.fbs` 和 `server.fbs` 的演示目录，并将演示内容作为图像文件输出。以下命令行将我录制的演示转换为图像文件：\n\
  \n```\nrl_book_samples/Chapter16$ ./adhoc/demo_dump.py -d data/demo-CountSides/\n\
  -e wob.mini.CountSides-v0 -o count\n[2018-01-30 12:44:11,794] Making new env: wob.mini.CountSides-v0\n\
  [2018-01-30 12:44:11,796] Using SoftmaxClickMouse with action_region=\n(10, 125,\
  \ 170, 285), noclick_regions=[]\n[2018-01-30 12:44:11,797] SoftmaxClickMouse noclick\
  \ regions\n0 of 256 actions Loaded 64 demo samples\n[2018-01-30 12:44:12,191] Making\
  \ new env: wob.mini.CountSides-v0\n[2018-01-30 12:44:12,192] Using SoftmaxClickMouse\
  \ with action_region=\n(10, 125, 170, 285), noclick_regions=[]\n[2018-01-30 12:44:12,192]\
  \ SoftmaxClickMouse noclick regions\n0 of 256 actions\n```\n\n该命令生成了 64 个以 `count`\
  \ 为前缀的图像文件。图 16.14](#16.xhtml) 显示了该辅助程序生成的我录制的演示图像。\n\n![图像](img/16_14.jpg)\n\n\
  **图 16.14：** 点击位置用圆圈表示。这些记录的二进制数据位于 `Chapter16/demos/demo-CountSides.tar.gz` 文件中，在使用前需要对其进行解压。此外注意的是，我对\
  \ VNC 协议的实现是实验性的。它仅适用于使用 0.2 版本 MiniWoB 镜像创建的 VNC 文件，并且可能并未完全符合 RFC 的。此外，针对我们动作空间的读取过程是硬编码的，没有提供鼠标移动、按键或其他事件的示例。如果你认为有必要针对通用情况进行扩展，欢迎贡献。\n\
  \n### 16.4.3 通过演示进行训练\n\n现在我们知道了如何记录和读取演示数据，但问题仍然是，我们需要如何修改训练过程以使用人类演示的数据。最简单但效果惊人的好的解决方案是使用对数似然（Log-Likelihood）目标值，我们在第\
