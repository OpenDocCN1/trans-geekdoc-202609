  \ 610/s\n11773: 完成 3 局游戏，平均奖励 210，速度 485/s\n11803: 完成 4 局游戏，平均奖励 210，速度 359/s\n\
  11765: 完成 1 局游戏，平均奖励 210，速度 519/s\n11771: 完成 2 局游戏，平均奖励 210，速度 531/s\n...\n```\n\
  \n收敛趋势与之前的非常相似。观测值的总数约为 800 万到 1000 万，处理这些需要一个半小时。\n\n![图像](img/13_06.jpg)\n\n**图\
