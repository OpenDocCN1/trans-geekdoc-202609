  \n**图 20.4：** 奖励的标准差（左）和平均策略更新（右）\n\n## 20.5 遗传算法 (GA)\n\n遗传算法（GA）是另一类黑盒方法，最近它们已成为基于价值的方法和\
  \ PG 方法的广泛替代方案。这是一类大型优化算法算法，已经存在了二十多年，其核心思想是产生一个包含 `N` 个个体的种群，并为每个个体计算适应度函数（Fitness\
  \ function）。每个个体对应一组特定的模型参数。使用表现最好的个体子集来产生下一代种群。这被称为`Mutation.`。该过程重复，直到我们对种群的性能满意为止。\n\
  \n在遗传算法组中有多许多不同的方法，例如描述如何在变异时选择下一代种群的个体，或如何确定个体性能排名。我们考虑一种带有若干扩展的简单方法，该方法发表 Felipe\
  \ Petroski Such、Vashisht Madhavan 等人的题为 *Deep Neuroevolution: Genetic Algorithms\
  \ are a Competitive Alternative for Training Deep Neural Networks for Reinforcement\
  \ Learning* [\\[2\\]](#20.xhtml#QUELLE02) 的论文中。\n\n在这篇文章中，作者分析了一种简单的遗传算法，该算法在变异时对父代的权重应用正态分布扰动。在每次迭代中，不经修改复制性能最好的个体。简单\
  \ GA 的算法步骤可以表述如下：\n\n1. 初始化变异强度 `σ`、种群规模 `N`、选定的个体数量 `T`、具有 `N` 个随机分配策略的初始种群 `P⁰`\
  \ 以及适应度 ![\\[图片\\]](Images/20_09.jpg)。\n2. 对于每一代 `g = 1...G` 执行以下操作：\n    * 按适应度函数值\
  \ `F^(g-1)` 降序对种群 `P^(g-1)` 进行排序。\n    * 复制性能最好的个体：![\\[图片\\]](Images/20_10.jpg)。\n\
  \    * 对于个体 `i = 2...N` 执行以下操作：\n        * `k=` 从 `1...*T*` 中随机确定一个父代。\n       \
  \ * 从 ![\\[图片\\]](Images/20_11.jpg) 中提取样本。\n        * 对父代进行变异：![\\[图片\\]](Images/20_12.jpg)。\n\
  \        * 计算适应度 ![\\[图片\\]](Images/20_13.jpg)。\n\n论文 [\\[2\\]](#20.xhtml#QUELLE02)\
  \ 提出了对这种简单方法的各种改进，我们稍后会提到。首先，我们测试基础算法的实现。\n\n## 20.6 用于 CartPole 的 GA\n\n你可以在文件\
  \ `Chapter20/03_cartpole_ga.py` 中找到源代码。它与 ES 示例的代码有许多共同点。区别在于缺少梯度上升的代码，该部分被网络变异函数取代了：\n\
  \n```python\ndef mutate_parent(net):\n    new_net = copy.deepcopy(net)\n    for\
  \ p in new_net.parameters():\n        noise = np.random.normal(size=p.data.size())\n\
  \        noise_t = torch.FloatTensor(noise)\n        p.data += NOISE_STD * noise_t\n\
  \    return new_net\n```\n\n该函数的作用是通过向给定的策略权重添加随机噪声，创建一个策略的变异副本。父代的权重保持不变，但在副本中替换了随机选择。因此，网络以后可以被再次使用。\n\
  \n```python\nNOISE_STD = 0.01\nPOPULATION_SIZE = 50\nPARENTS_COUNT = 10\n```\n\n\
  这些超参数的数量比 ES 方法少。变异包含了标准差、种群大小和选定的个体数量。\n\n```python\nif __name__ == \"__main__\"\
  :\n    writer = SummaryWriter(\"-cartpole-ga\")\n    env = gym.make(\"CartPole-v0\"\
  )\n\n    gen_idx = 0\n    population = [\n        Net(env.observation_space.shape[0],\
  \ env.action_space.n)\n        for _ in range(POPULATION_SIZE)\n    ]\n\n    while\
  \ True:\n        rewards = []\n        for net in population:\n            rewards.append(evaluate(env,\
  \ net))\n        population.sort(key=lambda p: p[1], reverse=True)\n        reward_mean\
  \ = np.mean(rewards)\n        reward_max = np.max(rewards)\n        reward_std =\
  \ np.std(rewards)\n\n        writer.add_scalar(\"reward_mean\", reward_mean, gen_idx)\n\
  \        writer.add_scalar(\"reward_std\", reward_std, gen_idx)\n        writer.add_scalar(\"\
  reward_max\", reward_max, gen_idx)\n        print(f\"Gen {gen_idx}: mean={reward_mean:.2f},\
  \ max={reward_max:.2f}, std={reward_std:.2f}\")\n\n        if reward_mean > 199:\n\
  \            print(f\"Solved in {gen_idx} steps\")\n            break\n        gen_idx\
  \ += 1\n```\n\n### 20.6.1 结果\n\n尽管这种方法很简单，但它比 ES 方法更好，并在几代之后解决了 CartPole 环境。使用上述代码进行实验时，需要五到十五代即可解决。\n\
  \n```\nChapter20$03_cartpole_ga.py\n0: mean=39.90, max=131.00, std=32.97\n1: mean=82.00,\
  \ max=145.00, std=33.14\n2: mean=131.40, max=154.00, std=15.94\n3: mean=151.90,\
  \ max=200.00, std=19.45\n4: mean=170.20, max=200.00, std=32.46\n5: mean=194.00,\
  \ max=200.00, std=14.09\n6: mean=187.50, max=200.00, std=16.87\n7: mean=186.50,\
  \ max=200.00, std=15.41\n8: mean=191.50, max=200.00, std=1.67\n9: mean=199.50, max=200.00,\
  \ std=1.20\nSolved in 9 steps\n```\n\n\n\n\n## 20.7 GA 优化\n\n在论文 [[2]](#20.xhtml#QUELLE02)\
  \ 中，作者测试了对标准遗传算法（GA）的两种优化方法。第一种被称为 `Deep GA`，旨在提高实现的可扩展性；第二种名为 `Novelty Search`（即“新颖性搜索”），它尝试通过另一种评估回合（Episode）的指标来取代作为目标值的奖励机制。在接下来的示例中，我们将实现第一种改进，第二种则留给读者作为可选练习。\n\
  \n### 20.7.1 Deep GA\n\n由于遗传算法不需要梯度，当有多个 CPU 可用于优化时，它们的可扩展性可能甚至比进化策略（ES）方法更好。然而，我们考虑的简单\
  \ GA 与 ES 方法面临相同的瓶颈：工作进程之间必须交换策略（Policy）的参数。在上述的论文 [[2]](#20.xhtml#QUELLE02) 中，作者提出了一种类似于共享种子（Seed）的技巧，但将其推了了。他们将其称为\
  \ `Deep GA`。本质上，策略参数被表示为种子列表，这些种子用于生成该特定策略的权重。\n\n在第一代种中，初始网络权重实际上是随机生成的，因此列表中的第一个种子决定了初始化。在每一代种中，变异完全由种子决定。因此，重建权重我们只需要变异所需的种子。在这种方法下，我们必须在每个工作进程中重建权重，但这种开销通常远小于传输完整权重矩阵的开销。\n\
  \n### 20.7.2 Novelty Search\n\n论文中测试的另一种改进被称为 `Novelty Search`，由 Lehman 和 Stanley\
  \ 在 2011 年发表的一篇名为 *Abandoning Objectives: Evolution Through the Search for Novelty\
  \ Alone* [[3]](#20.xhtml#QUELLE03) 的论文中提出。\n\n新颖性搜索方法方法的核心思想是：不再将奖励视为优化过程的首要目标，而是用另一个目标来取代，并奖励智能体探索未知的行为（因此被称为“寻找新颖性”）。在穿越一个包含许多死胡同的迷宫任务的实验结果表明，新颖性搜索方法的效果远优于其他基于奖励的方法。\n\
  \n为了实现新颖性搜索，我们定义了一种所谓的行为特征 `π`（`Behaviour Characteristic`, `BC`），它描述了策略的行为并定义了两个策略之间的距离。然后使用\
  \ k 近邻（k-Nearest-Neighbors）方法来检查新策略的新颖性，并根据确定的距离将 GA 向某个方向移动。在原始论文 [[2]](#20.xhtml#QUELLE02)\
  \ 中，智能体必须进行充分的探索。解决强化学习（RL）任务时，新颖性搜索方法的结果比 ES 方法、GA 以及其他经典方法好得多。\n\n## 20.8 HalfCheetah\
  \ 的 GA\n\n在本章的最后一个示例中，我们将为 HalfCheetah 环境实现一个并行的 Deep GA。完整代码可以在 `Chapter20/04_cheetah_ga.py`\
  \ 文件中找到。该架构与并行 ES 方法非常，因为存在一个主进程和多个工作进程。工作进程的任务是评估一批网络并将结果提供给主进程，主进程负责将部分结果合并为完整的种群，根据获得的奖励对个体进行排序，并生成供工作进程评估的下一代种群。\n\
  \n\n\n\n主进程的代码也同样简单。在每一代迭代中，我们将当前种群的 `Seeds` 传递给工作进程以进行评估，并等待结果。随后，我们对结果进行排序，并根据最优的个体生成下一代种群。在主进程端，变异仅仅是一个随机生成的\
  \ `Seed` 值，该值会被附加到父代 `Seeds` 列表的末尾。\n\n```\nbatch_steps = 0\n0_population = []\n\
  while len(population) < SEEDS_PER_WORKER * WORKERS_COUNT:\n    out_item = output_queue.get()\n\
  \    population.append((out_item.seeds, out_item.reward))\n    batch_steps += out_item.steps\n\
  if elite is not None:\n    population.append(elite)\npopulation.sort(key=lambda\
  \ p: p[1], reverse=True)\n\nelite = population[0]\nfor worker_queue in input_queues:\n\
  \    seeds = []\n    for _ in range(SEEDS_PER_WORKER):\n        parent = np.random.randint(PARENTS_COUNT)\n\
  \        next_seed = np.random.randint(MAX_SEED)\n        s = list(population[parent][0])\
  \ + [next_seed]\n        seeds.append(tuple(s))\n    worker_queue.put(seeds)\n```\n\
  \n### 20.8.1 结果\n\n启动训练时只需运行源代码文件。控制台上将显示不同代的结果。\n\n```\nChapter20$ ./04_cheetah_ga.py\n\
