  \        tokens_batch.append((img_obs, idx_obs))\n    # 按序列长度对 batch 进行降序\n    tokens_batch.sort(key=lambda\
  \ p: len(p[1]), reverse=True)\n    img_batch, seq_batch = zip(*tokens_batch)\n \
  \   lens = list(map(len, seq_batch))\n```\n\n预处理器的任务是将一组 `(图像, 文本)` 元组转换为两个对象。第一个必须是具有格式为\
