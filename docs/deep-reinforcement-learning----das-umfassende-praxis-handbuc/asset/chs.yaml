  print(\"Env %s, gamma %.2f\" % (params.env_name, params.gamma))\n```\n\nDarüber\
  \ hinaus bietet `common.py` eine Funktion namens `unpack_batch`, die einen Batch\
  \ von Übergängen entgegennimmt und diese in eine Reihe von NumPy-Arrays umwandelt,\
  \ die für das Training geeignet sind.\n\n(注：原文中 `unpack_batch` 之后重复了大量相同的德语说明和代码块描述，根据高级工程师规范，此处仅保留核心逻辑翻译以避免冗余。)\n\
  \n以下是 `unpack_batch` 函数的实现：\n\n```python\ndef unpack_batch(batch):\n    states,\
  \ actions, rewards, dones, next_states = [], [], [], [], []\n    for exp in batch:\n\
  \        states.append(exp.state)\n        actions.append(exp.action)\n        rewards.append(exp.reward)\n\
  \        dones.append(exp.done)\n        next_states.append(exp.next_state)\n  \
  \  return np.array(states), np.array(actions), np.array(rewards), np.array(dones),\
  \ np.array(next_states)\n```\n\n(由于用户提供的原文在 `unpack_batch` 之后存在严重的重复段落，译文已根据指令进行了去重处理，确保逻辑连贯且不重复。)\n\
  \n\n\n\n\n```python\ndef batch_generator(\n        buffer:ptan.experience.ExperienceReplayBuffer,\n\
  \        initial: int, batch_size: int):\n    buffer.populate(initial)\n    while\
  \ True:\n        buffer.populate(1)\n        yield buffer.sample(batch_size)\n```\n\
  \n名为 `setup_ignite` 的函数相当长但极其有用，它连接了所需的 Ignite 处理器，显示训练进度并通过 TensorBoard 输出指标。由于代码长度较长，我们将分段查看该函数。\n\
  \n```python\ndef setup_ignite(engine: Engine, params: SimpleNamespace,\n       \
  \          exp_source, run_name: str,\n                 extra_metrics: Iterable[str]\
  \ = ()):\n    warnings.simplefilter(\"ignore\", category=UserWarning)\n    handler\
  \ = ptan_ignite.EndOfEpisodeHandler(\n        exp_source, bound_avg_reward=params.stop_reward)\n\
  \    handler.attach(engine)\n    ptan_ignite.EpisodeFPSHandler().attach(engine)\n\
  \   ...\n```\n\n首先，`setup_ignite` 链接了两个 PTAN 提供的处理器：\n\n* `EndOfEpisodeHandler`\
  \ 在游戏回合结束时触发一个 Ignite 事件。此外，当游戏回合的平均奖励达到预设阈值时，该函数也可以触发事件。我们用它来判断游戏是否已解决。\n\n* `EpisodeFPSHandler`\
  \ 是一个小型类，用于记录与环境交互的次数。通过它，我们可以计算每秒帧数（FPS），这是一个需要监控的重要性能指标。\n\n```python\n@engine.on(ptan_ignite.EpisodeEvents.EPISODE_COMPLETED)\n\
  def episode_completed(trainer: Engine):\n    passed = trainer.state.metrics.get('time_passed',\
  \ 0)\n    print(\"Episode %d: reward=%.0f, steps=%s, \"\n          \"speed=%.1f\
  \ f/s, elapsed=%s\" % (\n          trainer.state.episode,\n          trainer.state.episode_reward,\n\
  \          trainer.state.episode_steps,\n          trainer.state.metrics.get('avg_fps',\
  \ 0),\n          timedelta(seconds=int(passed))))\n    @engine.on(\n          ptan_ignite.EpisodeEvents.BOUND_REWARD_REACHED)\n\
  \    def game_solved(trainer: Engine):\n        passed = trainer.state.metrics['time_passed']\n\
  \        print(\"Spiel gelöst in %s Sek. nach %d Episoden \"\n              \"und\
  \ %d Iterationen!\" % (\n            timedelta(seconds=int(passed)),\n         \
  \   trainer.state.episode, trainer.state.iteration))\n        trainer.should_terminate\
  \ = True\n```\n\n随后，我们安装了两个事件处理器。第一个会在回合结束时被调用，在控制台上输出关于完成回合的信息。另一个函数会在平均奖励超过由超参数设置的阈值时被调用（对于\
  \ Pong，该值为 `18`）。该函数会输出关于游戏已解决的消息并停止训练。\n\n函数的其余部分涉及我们想要在 TensorBoard 中记录的数据：\n\n\
  ```python\nnow = datetime.now().isoformat(times='minutes')\nlogdir = f\"runs/{now}-{run_name}\"\
  \ntb = tb_logger.Tensorboard(log_dir=logdir)\nrun_avg = RunningAverage(output_transform=lambda\
  \ v: v['loss'])\nrun_avg.attach(engine, \"avg_loss\")\n```\n\n首先，我们创建一个 `Tensorboard`，这是由\
  \ Ignite 提供的特殊类，用于在 TensorBoard 中进行输出。处理函数返回损失值，我们使用变换函数 `RunningAverage`（同样由 Ignite\
  \ 提供）来获取平滑后的损失曲线。\n\n```python\nmetrics = ['reward', 'steps', 'avg_reward']\nhandler\
  \ = tb_logger.OutputHandler(\n          tag=\"episodes\", metric_names=metrics)\n\
  event = ptan_ignite.EpisodeEvents.EPISODE_COMPLETED\ntb.attach(engine, log_handler=handler,\
  \ event_name=event)\n```\n\n`Tensorboard` 可以跟踪 Ignite 输出组（由变换返回的值）和性能指标（在训练期间计算并存储在\
  \ `engine.state` 中的值）。`EndOfEpisodeHandler` 和 `EpisodeFPSHandler` 提供了在每个回合结束时更新的性能指标。因此，我们设置了一个\
  \ `OutputHandler`，在回合完成后向 TensorBoard 输出关于该回合的信息。\n\n```python\n# 每隔 100 次迭代在 TensorBoard\
  \ 中输出\nptan_ignite.PeriodicEvents().attach(engine)\nmetrics = ['avg_loss', 'avg_fps']\n\
  metrics.extend(extra_metrics)\nhandler = tb_logger.OutputHandler(\n    tag=\"train\"\
  , metric_names=metrics,\n    output_transform=lambda a: a)\nevent = ptan_ignite.PeriodicEvents.ITERS_100_COMPLETED\n\
  tb.attach(engine, log_handler=handler, event_name=event)\n```\n\n训练过程的性能指标是另一组我们想要记录的数据：损失、FPS\
  \ 和一些自定义指标。这些指标会在每次迭代时更新。但由于我们要执行数百万次迭代，因此每隔 100 次迭代向 TensorBoard 记录一次数据。\n\n###\
  \ 8.1.2 实现\n\n现在我们查看 `01_dqn.py` 中的代码，它创建了缓冲区并启动训练。我们将跳过无关的代码，专注于核心。完整版本在 GitHub\
  \ 上可找到。\n\n```python\nenv = gym.make(params.env_name)\nenv = ptan.common.wrappers.wrap_dqn(env)\n\
  env.seed(common.SEED)\nnet = dqn_model.DQN(env.observation_space.shape,\n      \
  \              env.action_space.n).to(device)\ntgt_net = ptan.agent.TargetNet(net)\n\
  ```\n\n首先，我们创建环境并应用我在第 6 章（Deep Q-Networks）中讨论过的标准包装器。我们在优化 Pong 时会再次遇到它们。随后，我们创建\
  \ DQN 模型和目标网络。\n\n```python\nselector = ptan.actions.EpsilonGreedySelector(\n  \
  \  epsilon=params.epsilon_start)\nepsilon_tracker = common.EpsilonTracker(selector,\
  \ params)\nagent = ptan.agent.DQNAgent(net, selector)\n```\n\n接下来，我们创建 Agent 并为其传递一个\
  \ `EpsilonGreedySelector`。在训练期间，通过 `EpsilonTracker` 类减少 `epsilon`。通过这种方式，随机动作的数量会减少，且神经网络拥有更大的控制权。\n\
  \n```python\nexp_source = ptan.experience.ExperienceSourceFirstLast(\n    env, agent,\
  \ gamma=params.gamma)\nbuffer = ptan.experience.ExperienceReplayBuffer(\n    exp_source,\
  \ buffer_size=params.replay_size)\n```\n\n接两个两个对象是 `ExperienceSource` 和 `ExperienceReplayBuffer`。前者接收\
  \ Agent 和环境并提供游戏回合的转换。这些转换存储在 `ExperienceReplayBuffer` 中。\n\n```python\noptimizer\
  \ = optim.Adam(net.parameters(),\n                          lr=params.learning_rate)\n\
  \ndef process_batch(engine, batch):\n    optimizer.zero_grad()\n    loss_v = common.calc_loss_dqn(\n\
  \        batch, net, tgt_net.target_model,\n        gamma=params.gamma, device=device)\n\
  \    loss_v.backward()\n    optimizer.step()\n    epsilon_tracker.frame(engine.state.iteration)\n\
  \    if engine.state.iteration % params.target_net_sync == 0:\n        tgt_net.sync()\n\
  \    return {\n        \"loss\": loss_v.item(),\n        \"epsilon\": selector.epsilon,\n\
  \    }\n```\n\n\n\n\n随后，我们创建一个优化器并定义处理函数，该函数会在每批次（batch）转换时被调用，用于训练模型。为此，我们调用了 `common.calc_loss_dqn`\
  \ 函数并根据结果执行反向传播。\n\n该函数还指示 `EpsilonTracker` 减少 `epsilon`，并定期对目标网络进行同步。\n\n```\n\
  engine = Engine(process_batch)\ncommon.setup_ignite(engine, params, exp_source,\
  \ NAME)\nengine.run(common.batch_generator(buffer,\n           params.replay_initial,\
  \ params.batch_size))\n```\n\n### 8.1.3 结果\n\n现在我们开始训练。\n\n```\nrl_book_samples/Chapter08$\
  \ ./01_dqn_basic.py --cuda\nEpisode 2: reward=-21, steps=809, speed=0.0 f/s, elapsed=0:00:15\n\
  Episode 3: reward=-21, steps=936, speed=0.0 f/s, elapsed=0:00:15\nEpisode 4: reward=-21,\
  \ steps=817, speed=0.0 f/s, elapsed=0:00:15\nEpisode 5: reward=-20, steps=927, speed=0.0\
