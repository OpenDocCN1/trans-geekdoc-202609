  \ 个 epoch 保存的模型（训练和测试分数分别为 0.72 和 0.121）进行微调，我将训练数据的 BLEU 分数从 0.124 提高到了 0.14。根据趋势判断，这还可以提高，但需要更多时间。\n\
  \n\n\n\n为了对模型进行实验，有两个辅助程序：`data_test.py` 和 `use_model.py`。`data_test.py` 加载一个模型，将其应用于指定类型中的所有句子，并输出平均\
  \ BLEU 分。在测试之前，句子对将根据第一个句子进行分组。以下是两个使用 `comedy` 类型训练的模型结果示例。第一个模型使用了交叉熵方法，第二个模型则通过\
  \ RL 方法进行了微调。\n\n```\n./data_test.py --data comedy -m saves/xe-comedy/epoch_060_0.112.dat\n\
