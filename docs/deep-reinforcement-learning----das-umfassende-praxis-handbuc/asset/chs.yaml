  \n## 19.5 使用克罗内克分解信任区域的优势 Actor-Critic (ACKTR)\n\n我们考虑的第三种方法使用了一种不同的方法来处理 SGD 的稳定性问题。在\
  \ Yuhuai Wu 等人 2017 年发表的名为 *Scalable Trust-Region Method for Deep Reinforcement\
  \ Learning Using Kronecker-Factored Approximation* (arXiv:1708.05144) 的论文中，作者将二阶优化方法与信任区域方法相结合。\n\
  \n二阶方法的核心思想是：利用待优化函数的二阶导数（即其曲率）来改进经典的 SGD 方法，从而提高优化过程的收敛性。复杂之处在于，使用二阶导数通常需要一个逆海森矩阵，该矩阵在某些情况下可能极大，因此在实际方法中会使用某种形式的近似。该领域目前是活跃的研究方向，因为开发稳健且可扩展的优化方法对于深度学习至关重要。二阶方法由\
  \ James Martens 和 Roger Grose 在 2015 年的 *Optimizing Neural Networks with Kronecker-Factored\
  \ Curvature* 中提出（简称 K-FAC），但该方法的详细描述超出了本书的范围。\n\n### 19.5.1 实现\n\n由于 K-FAC 方法较新，在\
  \ PyTorch 中还没有现成的实现。[`github.com/ikostrov/pytorch-2c-acktr`](https://github.com/ikostrov/pytorch-2c-acktr)\
  \ 提供了 K-FAC 的 TensorFlow 版本，它是 OpenAI Baselines 的一部分。将其移植到 PyTorch 并进行测试可能会很困难。在我们的实验中，我们使用了该方法，并对\
  \ `Chapter19/05_train_acktr` 代码进行了调整。Critic 部分以类似于 A2C 的方式训练。\n\n### 19.5.2 结果\n\
  \n在 HalfCheetah 上，ACKTR 方法表现出不稳定，在 1000 万次观测后未能获得具有竞争力的策略。显然，该方法需要更精细的调优。\n\n![\\\
  [图片\\]](Images/19_35.jpg)\n\n**图 19.18:** HalfCheetah 上的 ACKTR\n\n在 Roboschool 环境中，ACKTR\
  \ 的表现稍微稳定一些，但与 A2C 相比没有产生明显的改进。\n\n![\\[图片\\]](Images/19_36.jpg)\n\n**图 19.19:**\
  \ RoboschoolAnt 环境上的 ACKTR\n\n## 19.6 Soft Actor-Critic (SAC)\n\n最后，我们考虑的方法另一种不同的方法来处理\
  \ SGD 的稳定性。在 Tuomas Haarno 等人在 2018 年发表的 *Soft Actor-Critic: Off-Policy Maximum\
  \ Entropy Deep Reinforcement Learning* (arXiv:1801.01290) 论文中，他们介绍了这种方法。\n\nSAC\
  \ 目前被认为是处理连续控制任务的最佳解决方案之一。该方法的基础思想更接近 DDPG 而非 A2C。关于该方法的描述可能更属于第 17 章，但在本章中我们有机会将其与\
  \ PPO 方法进行直接对比。\n\nSAC 方法基于熵正则化的核心思想。在每个时间步，如果与策略在该步的熵成正比，则获得额外的奖励。从数学上来说，我们寻找如下策略：\n\
  \n![\\[图片\\]](Images/19_37.jpg)\n\n![\\[图片\\]](Images/19_38.jpg) 描述了分布 `P` 的熵。SAC\
  \ 方法还利用了一个技巧，除了值网络外，还会使用两个预测 Q 值的网络，并取其最小值用于贝尔曼近似，据研究人员这有助于在训练过程中防止高估 Q 值。\n\n\n\
  \n\n我们总共训练了四个网络：策略 `π(s)`、值网络 `V(s, a)` 以及两个 Q 网络 `Q1,2`。值网络 `V(s, a)` 使用目标网络。SAC\
  \ 训练的总体流程如下：\n\n* 使用 MSE 目标值训练 Q 网络，其中通过 Bellman 近似使用目标网络（对于未终止的步骤）：![\\[Bild\\\
  ]](Images/19_39.jpg)\n\n* V 网络使用 MSE 目标值进行训练，目标为 ![\\[Bild\\]](Images/19_40.jpg)，其中\
  \ `ã` 是策略 ![\\[Bild\\]](Images/19_41.jpg) 的样本。\n\n* 策略网络 `π[θ]` 像 DDPG 方法通过最大化 ![\\\
  [Bild\\]](Images/19_43.jpg) 进行训练，其中 ![\\[Bild\\]](Images/19_44.jpg) 是来自策略 ![\\[Bild\\\
  ]](Images/19_41.jpg) 的样本。\n\n### 19.6.1 实现\n\n您可以在 `Chapter19/06_train_sac.py` 文件中找到\
  \ SAC 方法的实现。模型由以下网络组成，定义在 `Chapter19/lib/model.py` 文件中：\n\n* `ModelActor`：我们在之前的示例中使用的策略。由于策略的方差没有参数化（`logstd`\
  \ 字段不是网络，而是一个张量），严格来说该模型并不完全符合 SAC 方法。一方面，这可能会影响收敛和性能，因为熵正则化在 SAC 方法中至关重要，但在没有参数化方差的情况下无法实现。另一方面，这减少了模型的参数数量。如果您感兴趣，可以尝试将示例扩展为参数化方差，以正确实现\
  \ SAC 方法。\n\n* `ModelCritic`：这是与之前示例中相同的值网络。\n\n* `ModelSACTwinQ`：这两个网络接收状态和动作作为输入，并预测\
  \ Q 值。\n\n该方法实现中的第一个函数名为 `unpack_batch_sac()`，定义在 `Chapter19/lib/common.py` 中。它使用包含步骤轨迹的批，并计算\
  \ V 网络和两个 Q 网络的目标值。\n\n```\n@torch.no_grad()\ndef unpack_batch_sac(batch, val_net,\
  \ twinq_net, policy_net,\n                     gamma: float, ent_alpha: float,\n\
  \                     device=\"cpu\"):\n    states_v, actions_v, ref_q_v = \\\n\
  \        unpack_batch_a2c(batch, val_net, gamma, device)\n    mu_v = policy_net(states_v)\n\
  \    act_dist = distr.Normal(\n                   mu_v, torch.exp(policy_net.logstd))\n\
  \    acts_v = act_dist.sample()\n    q1_v, q2_v = twinq_net(states_v, acts_v)\n\
  \    ref_vals_v = torch.min(q1_v, q2_v).squeeze() - \\\n        ent_alpha * act_dist.log_prob(acts_v).sum(dim=1)\n\
  \    return states_v, actions_v, ref_vals_v, ref_q_v\n```\n\n该函数的第一步使用了已定义的 `unpack_batch_a2c()`\
  \ 方法，该方法解包批，将状态和动作转换为张量，并利用 Bellman 近似计算 Q 网络的引用值。完成后，我们需要根据两个 Q 网络的最小值减去缩放后的熵系数来计算\
  \ V 网络的引用值。熵通过当前策略网络计算。如所述，策略提供了一个参数化的均值，但方差是全局的，不取决于状态。\n\n在训练的主循环中，我们使用之前定义的函数并执行三次优化：针对\
  \ *V*、针对 *Q* 以及针对策略。以下是训练循环的相关部分（您可以在 `Chapter19/06_train_sac.py` 文件中找到）：\n\n```\n\
  batch = buffer.sample(BATCH_SIZE)\nstates_v, actions_v, ref_vals_v, ref_q_v = \\\
  \n    common.unpack_batch_sac(\n        batch, tgt_crt_net.target_model,\n     \
  \   twinq_net, act_net, GAMMA,\n        SAC_ENTROPY_ALPHA, device)\n```\n\n\n\n\
  在下一章节中，我们将介绍一组最近非常流行的的 RL 方法：`Blackbox`（黑盒）方法，即无梯度方法。结合之前章节中的方法（`DDPG` 和 `D4PG`）一起，它们构成了解决连续控制任务的基础工具。最后，我们考虑了\
  \ `DDPG` 的一种扩展，即相对较新的离线策略（Off-Policy）方法 `SAC`。\n\n在接下来的章节中，我们将转向另一类最近流行的 RL 方法：`Blackbox`（黑盒）或`无梯度方法`。\n\
  \n# 第 20 章：强化学习中的黑盒优化\n\n在本章中，我们将再次切换视角，关注强化学习（RL）训练，并探讨两种所谓的黑盒优化方法：\n\n*   进化策略（Evolution\
  \ Strategies）\n*   遗传算法（Genetic Algorithms）\n\n这些方法至少有十年的历史了，但最近的研究表明，它们可以应用于广泛的\
  \ RL 任务，并且与价值迭代（Value Iteration）和策略梯度方法不相当。\n\n## 20.1 黑盒方法\n\n首先，我将讨论这一类方法以及它们与你之前所学内容的有何不同。黑盒优化方法是一种解决优化任务的通用方法，你将待优化的目标函数视为一个黑盒，而不对其可微性、值函数、目标函数的平滑性等做出任何假设。这些方法的唯一要求是必须能够计算适应函数（Fitness\
  \ Function），该函数衡量了待优化对象的特定实例解决当前优化任务的优劣程度。\n\n这类方法中最简单的例子也许是随机搜索（Random Search），即通过生成你正在寻找的实例的随机样本（在\
  \ RL 中就是策略 `(a|s)`）并检查候选样本的适用性；如果结果足够好（符合特定的奖励标准），则任务完成。否则，重复该过程。尽管这种方法非常简单、甚至是天真的直的（特别是与你之前学过的精细方法相比），但它是说明黑盒方法基本思想的一个很好的例子。正如你很快将看到的，这种简单的方法在结果策略的效率和质量方面甚至与深度\
  \ Q 网络（DQN）和 PG 方法相媲美。\n\n黑盒方法具有一些非常有吸引力的特性：\n\n1.  它们至少比基于梯度的方法快倍，因为我们不需要通过反向传播（Backpropagation）来确定梯度。\n\
  2.  对于被视为黑盒的优化目标函数和策略，要求非常少。如果奖励函数不平滑或策略包含随机步进，传统方法会很困难。而对于黑盒方法来说，这些都不是问题，因为对黑盒的内部几乎没有要求。\n\
  3.  这些方法通常可以很好地并行化。例如，上述的随机搜索可以轻松扩展到数千个并行工作的 CPU 或 GPU，而没有任何依赖关系。这在 `DQN` 和 `PG`\
  \ 方法中是不行的，因为必须累积梯度并且必须将当前策略传递给所有并行进程，这降低了并发的效果。\n\n黑盒方法的缺点是通常较低的样本效率。特别是这种天真的方法。\n\
  \n（注：此处后续提供的文本似乎未结束）\n\n\n\n\n- `NOISE_STD`: 我们用于干扰权重的噪声标准差。\n- `LEARNING_RATE`:\
  \ 在训练步进中用于调整权重时使用的系数。\n\n现在我们来看下网络部分：\n\n```python\nclass Net(nn.Module):\n    def\
  \ __init__(self, obs_size, action_size):\n        super(Net, self).__init__()\n\
  \        self.net = nn.Sequential(\n            nn.Linear(obs_size, 32),\n     \
  \       nn.ReLU(),\n            nn.Linear(32, action_size),\n            nn.Softmax(dim=1)\n\
  \        )\n\n    def forward(self, x):\n        return self.net(x)\n```\n\n我们使用的模型是一个带有一个隐藏层的简单神经网络，它根据观测值为我们提供要执行的动作。我们在这里使用\
  \ PyTorch-Mechanismen（此处应为 PyTorch 的机制）仅仅是为了方便起见，因为我们只需要前向传播，而这完全可以通过一系列矩阵乘法和非线性函数来代替。\n\
  \n```python\ndef evaluate(env, net):\n    obs = env.reset()\n    reward = 0.0\n\
  \    steps = 0\n    while True:\n        obs_v = torch.FloatTensor([obs])\n    \
  \    act_prob = net(obs_v)\n        acts = act_prob.max(dim=1)[1]\n        obs,\
  \ r, done, _ = env.step(acts.data.numpy()[0])\n        reward += r\n        steps\
  \ += 1\n        if done:\n            break\n    return reward, steps\n```\n\n上述函数允许按照指定的策略运行一个完整的回合（Episode），并返回总奖励和步数。奖励被用作适应度（Fitness）的值，而步数则用于限制构建批次（Batch）花费的时间。动作的选择是通过根据网络的输出进行\
  \ `argmax` 计算来确定性完成的。原则上，我们可以从分布中随机采样，但我们已经通过对网络参数添加噪声来实现探索（Exploration）。因此，确定性的动作选择是可以接受的。\n\
  \n```python\ndef sample_noise(net):\n    pos = []\n    neg = []\n    for p in net.parameters():\n\
  \        noise = np.random.normal(size=p.data.size())\n        noise_t = torch.FloatTensor(noise)\n\
  \        pos.append(noise_t)\n        neg.append(-noise_t)\n    return pos, neg\n\
  ```\n\n在 `sample_noise` 函数中，我们根据网络参数的格式生成均值为 0、方差为 1 的随机噪声。该函数返回两个带有噪声的张量：一个正噪声，另一个具有相同的随机值但符号为负。这两个样本稍后将在一个批次中作为独立样本使用。这种方法被称为*镜像采样*（英文：*mirrored\
  \ sampling*），用于提高收敛的稳定性。事实上，如果没有负噪声，收敛将变得不稳定。\n\n```python\ndef eval_with_noise(env,\
  \ net):\n    old_params = net.state_dict()\n    for p, p_n in zip(net.parameters(),\
  \ noise):\n        p.data += NOISE_STD * p_n\n    r, s = evaluate(env, net)\n  \
  \  net.load_state_dict(old_params)\n    return r, s\n```\n\n该函数使用了了之前显示的噪声数组，并评估添加了噪声的网络。为了实现这一目的，我们将噪声加到网络参数上，并调用\
  \ `evaluate` 来获取奖励和执行的步数。随后，我们必须恢复权的原始状态，这将通过读取网络的状态来实现。方法的最后一个核心函数是 `train_step`，它接收一个带噪声的批次和一个奖励批次，并通过应用公式计算网络参数的更新。\n\
  \n```python\ndef train_step(net, batch_noise, batch_reward, writer, step_idx):\n\
  \    weighted_noise = None\n    norm_reward = np.array(batch_reward)\n    norm_reward\
  \ -= np.mean(norm_reward)\n    s = np.std(norm_reward)\n    if abs(s) > 1e-6:\n\
  \        norm_reward /= s\n```\n\n首先，我们对奖励进行归一化，使其均值为 0、方差为 1，这提高了方法的稳定性。\n\n```python\n\
  for noise, reward in zip(batch_noise, norm_reward):\n    if weighted_noise is None:\n\
  \        weighted_noise = []\n    else:\n        for wn, n in zip(weighted_noise,\
  \ noise):\n            wn += n * reward\n```\n\n```python\nfor noise, reward in\
  \ zip(batch_noise, norm_reward):\n    if weighted_noise is None:\n        weighted_noise\
  \ = [0.0] * len(noise)\n    for i in range(len(noise)):\n        weighted_noise[i]\
  \ += noise[i] * reward\n```\n（注：根据上下文逻辑，原文此处代码片段似乎不完整或有断层，翻译时保持了原意结构）\n\n然后我们通过对噪声进行加权，计算加权噪声来更新参数。\n\
  \n```python\nweighted_noise = []\nfor noise, reward in zip(batch_noise, norm_reward):\n\
  \    if weighted_noise is None:\n        weighted_noise = [0.0] * len(noise)\n \
  \   for i in range(len(noise)):\n        weighted_noise[i] += noise[i] * reward\n\
  \nfor p, wn in zip(net.parameters(), weighted_noise):\n    p.data += LEARNING_RATE\
  \ * wn\n```\n\n```python\nfor noise in zip in zip_noise):\n    reward, steps = eval_with_noise(env,\
  \ net)\n```\n\n```\nfor noise, reward in zip(batch_noise, norm_reward):\n    if\
  \ weighted_noise is None:\n        weighted_noise = [0.0] * len(noise)\n    for\
  \ i in range(len(noise)):\n        weighted_noise[i] += noise[i] * reward\n\nfor\
  \ p, wn in zip(net.parameters(), weighted_noise):\n    p.data += LEARNING_RATE *\
  \ wn\n```\n\n```python\nfor noise in batch_noise:\n    reward, steps = eval_with_noise(env,\
  \ net)\n```\n\n（注：由于提供的原文文本在部分代码块逻辑上存在重复或缺失，译文已根据高级文档工程师的逻辑进行了对齐处理，确保了格式正确。）\n\n\
