  \n## 16.7 总结\n\n在本章中，我们考虑了 RL 方法在浏览器自动化中的实际应用，并研究了 OpenAI 的 MiniWoB 任务。这标志了本书第三部分的结束。接下来将讨论具有连续动作空间的更复杂更新的方法、不基于梯度的方法以及更复杂的\
  \ RL 方法。\n\n# 第四部分：高级方法与技术\n\n#### 在此部分中：\n\n* **[第 17 章`** 连续动作空间\n* **第 18 章**\
  \ 机器人中的 RL\n* **第 19 章** 信任区域 – PPO, TRPO, ACKTR 和 SAC\n* **第 20 章** 强化学习中的黑盒优化\n\
  * **第 21 章** 高级探索\n* **第 22 章** 超越模型的方法 – 想象\n* **第 23 章** AlphaGo Zero\n\n\n\n\n\
  在与物理世界交互时，实际上更有可能存在的不是离散的、而是连续的动作，例如在不同的机器人控制系统（如供暖或空调控制）中。强化学习（RL）算法在这一领域是行的，但在使用\
  \ `A2C`（Advantage Actor-Critic）或 `DQN`（Deep Q-Network）方法之前，需要考虑一些细节。\n\n在本章中，我们将处理这类任务。这是进一步了解强化学习中这一非常有趣且重要领域的良好起点。\n\
  \n## 17.2 动作空间\n\n基础且显而易见的区别在于连续性。与离散动作空间不同（离散空间中动作被定义为一组互斥的选项，例如 `{左, 右}`；该动作空间仅包含两个元素），连续动作空间拥有来自特定连续范围的值（例如区间\
  \ `[0,1]` 内的值，它包含无限多个元素，如 `0,5`、`√ 3/2` 或 `π³/e⁵`）。在每个时间步，代理必须为动作选择一个具体的数值并将其传递给环境。\n\
  \n在 `Gym` 中，连续动作空间通过 `gym.spaces.Box` 类表示，该类在讨论观测空间时的 `第 2 章` 中讨论过。`Box` 包含具有格式和范围边界的不同值。Atari\
  \ 模拟器的观测表示为 `Box(low=0, high=255, shape=(210, 160, 3))`，这对应于 0 到 255 之间的 100,800\
  \ 个值，并以 3D 张量的形式组织。\n\n然而，您不太可能使用具有大量动作的动作空间。我们用作测试环境的四足机器人拥有八个连续动作对应八个电机（每条机器人腿包含两个电机）。在该环境中，动作空间被定义为\
  \ `Box(low=-1, high=1, shape=(8,))`。因此，为了控制机器人，每个时间步必须在 -1 到 1 之间选择八个值。\n\n在这种情况下，每步传递给\
  \ `env.step()` 的动作不是整数，而是特定格式的动作值向量。当然，也存在更复杂的情况，即动作空间是离散和连续动作的组合，例如可以通过 `gym.spaces.Tuple`\
  \ 类来表示。\n\n## 17.3 环境\n\n大多数具有连续动作的环境都与物理世界有关，因此通常使用物理仿真器。有很多软件软件包可以模拟物理过程，从非常简单的开源工具到精通多物理建模（液体、火、力分布）的复杂商业软件包。\n\
  \n在机器人领域，`MuJoCo`（Multi-Joint Dynamics with Contact, `http://www.mujoco.org`）是最常用的软件包之一。它是一个物理仿真器，可以在其中定义系统组件、它们的相互作用及其属性。仿真器会考虑它们的交互并确定组件的参数（通常是位置、速度和加速度）。这使其成为\
  \ RL 环境的理想实验场，因为你可以定义相当复杂的系统（多足机器人、机械臂或人形机器人）。随后，你为 `RL-代理` 提供观测并返回动作。\n\n遗憾的是，MuJoCo\
  \ 不是免费的，需要许可。网站上提供为期一个月的测试版，但之后就需要许可。学生有免费许可，但对于不在大学的强化学习爱好者来说，购买许可可能太贵了。幸运的是，有一个名为\
  \ `PyBullet` 的开源替代方案，它提供了类似的功能且免费（尽管它可能稍慢且不那么精确）。\n\n`PyBullet`可以通过 `https://github.com/bulletphysics/bullet3`\
  \ 获取，并可以在您的虚拟环境中执行 `pip install pybullet` 进行安装。下面的代码（`Chapter17/01_check_env.py`）允许您检查\
  \ PyBullet 是否正常工作。它会检查动作空间并创建一个我们在本章中作为实验样本的环境图像。\n\n```python\nimport gym\nimport\
  \ pybullet_envs\n\nENV_ID = \"MinitaurBulletEnv-v0\"\nRENDER = True\n\nif __name__\
  \ == \"__main__\":\n    spec = gym.envs.registry.spec(ENV_ID)\n    spec._kwargs['render']\
  \ = RENDER\n    env = gym.make(ENV_ID)\n\n    print(\"Beobachtungsraum:\", env.observation_space)\n\
  \    print(\"Aktionsraum:\", env.action_space)\n    print(env)\n    print(env.reset())\n\
  \    input(\"Zum Fortfahren beliebige drücken\")\n    env.close()\n```\n\n运行该程序后，应该打开一个显示四足机器人的窗口，我们将教它如何移动（图\
  \ 17.1）。\n\n**图 17.1：PyBullet 中的 Minitaur 环境**\n\n## 17.4 A2C 方法\n\n首先，我们将我们在第三部分实验过的\
  \ A2C 方法应用到运行机器人的任务上。选择这种方法是理所当然的，因为 A2C 很容易适应连续动作。回顾一下：在 A2C 方法中，尝试通过![图像](img/17_02.jpg)\
  \ 来估计策略的梯度。策略 `π[θ]` 应该为观测状态提供动作的概率分布。`V0` 被称为 *Critic*（评论员），对应状态值。它通过返回值与通过 Bellman\
  \ 方程估计值之间的均方误差进行训练。为了改进探索，通常会将熵奖励![图像](img/17_04.jpg) 添加到损失函数中。\n\n\n\n对于连续值，通常有多个动作可以取某个特定范围内的值。如果我们考虑到这一点，那么这些为动作返回的值就构成了策略（Policy）最简单的表示。这些值不应与状态值\
  \ `V(s)` 混淆，状态值表示我们为该状态可以获得多少奖励。为了说明这种区别：请想象一个简单的自动驾驶系统，我们只能旋转方向盘。动作在每次情况下都是方向盘的角度（动作值），但状态值是该状态的潜在折扣奖励，这是两个完全不同的概念。\n\
  \n从第 11 章中中，你已经知道，将动作表示为具体的数值有各种缺点，特别是在探索环境时。某种随机性是一个要好得多的选择。最简单的替代方案是让网络返回高斯分布的参数。对于\
  \ `N` 个动作，这将是两个包含 `N` 个元素的向量。第一个向量包含均值 `µ`，第二个向量包含方差 `σ²`。在这种情况下，我们的策略策略被表示为一个由互不相关的正态分布随机变量组成的随机\
  \ `N` 维向量，我们的网络可以对变量均值和方差进行选择。\n\n高斯分布的概率密度函数定义为 ![\\[Bild\\]](Images/17_05.jpg)。\n\
  \n我们可以直接使用这个公式来获取概率，但为了提高数值稳定性，值得进行一些数学计算，并简化 ![\\[Bild\\]](Images/17_06.jpg) 的表达式。\n\
  \n最终结果为 ![\\[Bild\\]](Images/17_07.jpg)。\n\n高斯分布的熵可以从熵的定义推导出，结果为 ![\\[Bild\\]](Images/17_08.jpg)。现在我们已经具备了所有要素来实现\
  \ A2C 算法。\n\n### 17.4.1 实现\n\n完整的源代码可以在 `Chapter17/02_train_a2c.py`、`Chapter17/lib/model.py`\
  \ 和 `Chapter17/lib/common.py` 文件中。代码的大部分对你来说是熟悉的，因此我在后面只显示有差异的部分。我们从包含在 `Chapter17/lib/model.py`\
  \ 文件中的模型类开始。\n\n```\nHID_SIZE = 128\n\nclass ModelA2C(nn.Module):\n    def __init__(self,\
  \ obs_size, act_size):\n        super(ModelA2C, self).__init__()\n\n        self.base\
  \ = nn.Sequential(\n            nn.Linear(obs_size, HID_SIZE),\n            nn.ReLU(),\n\
  \        )\n        self.mu = nn.Sequential(\n            nn.Linear(HID_SIZE, act_size),\n\
  \            nn.Tanh(),\n        )\n        self.var = nn.Sequential(\n        \
  \    nn.Linear(HID_SIZE, act_size),\n            nn.Softplus(),\n        )\n   \
  \     self.value = nn.Linear(HID_SIZE, 1)\n```\n\n如你所示，网络拥有三个输出，而不是该算法离散版本中常见的两个。前两个输出动作的均值和方差，最后一个输出状态值。均值使用正函数作为激活函数，将输出映射到\
  \ -1 到 1 之间的范围。方差使用 Softplus 激活函数，确保输出为正数。\n\n```\ndef forward(self, x):\n    base_out\
  \ = self.base(x)\n    mu = self.mu(base_out)\n    var = self.var(base_out)\n   \
  \ value = self.value(base_out)\n    return mu, var, value\n```\n\n\n\n使用组合批执行优化步骤的代码与\
  \ A2C 训练非常相似，我们在我们在第 12 章和第 13 章中实现的代码。区别在于使用了 `calc_logprob()` 函数以及用于计算熵奖励的另一种表达式。\n\
  \n```\nstates_v, actions_v, vals_ref_v =\n    common.unpack_batch_a2c(\n       \
  \ batch, net, device=device,\n        last_val_gamma=GAMMA ** REWARD_STEPS)\nbatch.clear()\n\
  \noptimizer.zero_grad()\nmu_v, var_v, value_v = net(states_v)\n\nloss_value_v =\
  \ F.mse_loss(value_v, vals_ref_v)\n\nadv_v = vals_ref_v.unsqueeze(dim=-1) - value_v.detach()\n\
  log_prob_v = adv_v * calc_logprob(mu_v, var_v, actions_v)\nloss_policy_v = -log_prob_v.mean()\n\
  ent_v = -(torch.log(2*math.pi*var_v) + 1)/2\nentropy_loss_v = ENTROPY_BETA * ent_v.mean()\n\
  \nloss_v = loss_policy_v + entropy_loss_v + loss_value_v\nloss_v.backward()\noptimizer.step()\n\
  ```\n\n每经过 `TEST_ITER` 帧，会对模型进行一次测试。如果获得了新的最佳奖励，将保存模型权重。\n\n### 17.4.2 结果\n\n与本章后续将考虑的其他方法相比，A2C\
  \ 在奖励和收敛速度方面的表现都是最的。这可能是因为只使用了一个环境来收集经验——这是策略梯度（PG）方法的一个缺点。作为练习，你可以检查多个并行环境（8 个或更多）对\
  \ A2C 方法的影响。\n\n要启动训练，你需要指定参数 `–n` 以及一个名称，该名称将用于 TensorBoard 并作为保存模型的目录名称。`--cuda`\
  \ 选项启用 GPU，但由于输入维度较低且网络较小，速度只会提升微乎其微。示例训练时的输出如下：\n\n```\nChapter17$ ./02_train_a2c.py\
  \ -n test\npybullet build time: Nov 12 2019 14:02:55\nModelA2C (\n  (base): Sequential\
  \ (\n    (0): Linear(in_features=28, out_features=128, bias=True)\n    (1): ReLU\
  \ ()\n  )\n  (mu): Sequential (\n    (0): Linear(in_features=128, out_features=8,\
  \ bias=True)\n    (1): Tanh ()\n  )\n  (var): Sequential (\n    (0): Linear(in_features=128,\
  \ out_features=8, bias=True)\n    (1): Softplus (beta=1, threshold=20)\n  )\n  (value):\
  \ Linear(in_features=128, out_features=1, bias=True)\n)\nTest done is 20.32 sec,\
  \ reward -0.786, steps 443\n122: done 1 episodes, mean reward -0.473, speed 5.69\
  \ f/s\n1123: done 2 episodes, mean reward -2.560, speed 27.54 f/s\n1209: done 3\
  \ episodes, mean reward -1.838, speed 176.22 f/s\n1388: done 4 episodes, mean reward\
  \ -1.549, speed 137.63 f/s\n```\n\n在运行 600 万帧（18 小时）后，训练过程达到了 1.3 的最佳值——并不算深刻。图\
  \ 17.2 和图 17.3 显示了训练和测试期间的奖励和回合步骤。![\\[图像\\]](Images/17_09.jpg)\n\n**图 17.2：**训练回合的奖励（左侧）和步骤（右侧）\n\
  \n回合步骤图表（右侧图 17.2）显示了每个回合执行的平均步数。时间限制在 1,000 步。任何低于此数值的都表示回合由于环境测试而停止（在大多数环境中，这些是导致仿真终止的自毁测试）。图\
  \ 17.3 中的图表显示了平均奖励。\n\n### 17.5 确定性策略梯度算法\n\n我们下一个考虑的方法是确定性策略梯度算法。视觉化该方法最简单的方法是与已知的\
  \ A2C 方法进行比较。在该方法中，Actor 估计的是随机策略，返回离散动作的概率分布，或者如上一节所述，返回正态分布的参数。两种情况下，策略都是随机的，换句话说，执行的动作是从该分布中抽取的。\n\
  \n\n\nBetrachten wir nun das Critic-Netz. Seine Aufgabe ist es, den Q-Wert zu schätzen,\
  \ der die diskontierte Belohnung der ausgeführten Aktionen für einen Zustand darstellt.\
  \ Unsere Aktion ist nun ein Zahlenvektor, daher nimmt unser Critic-Netz zwei Eingaben\
  \ entgegen: den Zustand und die Aktion. Die Ausgabe des Critics ist eine einzelne\
  \ Zahl, die dem Q-Wert entspricht. Diese Architektur unterscheidet sich vom DQN-Verfahren,\
  \ bei dem der Aktionsraum diskret war und wir aus Effizienzgründen Werte für alle\
  \ Aktionen gleichzeitig zurückgegeben haben. Diese Zuordnung ist ebenfalls deterministisch.\n\
  \nNun liegen also zwei Funktionen vor: Einerseits die Actor-Funktion, die wir als\
  \ `µ*(s)` bezeichnen und die den Zustand in eine Aktion umwandelt, andererseits\
  \ die Critic-Funktion. Zustand und Aktion liefern uns den Q-Wert: `Q(s, a)`. Wir\
  \ können die Actor-Funktion in den Critic einsetzen und erhalten einen Ausdruck\
  \ mit nur einem Eingabeparameter, nämlich unserem Zustand: `Q(s,* µ*(s))`. Letztendlich\
  \ sind neuronale Netze nur Funktionen.\n\nNun liefert uns die Ausgabe des Critics\
  \ eine Näherung für die Größe, die wir eigentlich maximieren wollen: die diskontierte\
  \ Gesamtbelohnung. Dieser Wert hängt nicht nur vom Eingabezustand ab, sondern auch\
  \ von den Parametern des `θ[µ]`-Actor-Netzes und des `θ[Q]`-Critic-Netzes. Bei jedem\
  \ Optimierungsschritt möchten wir die Gewichte des Actors ändern, um die erhaltene\
  \ Gesamtbelohnung zu erhöhen. Mathematisch betrachtet benötigen wir den Gradienten\
  \ unserer Policy.\n\nIn seinem Theorem über deterministische PG-Verfahren hat David\
  \ Silver bewiesen, dass das stochastische PG und das deterministische PG-Verfahren\
  \ äquivalent sind. Mit anderen Wort: Um die Policy zu verbessern, müssen wir lediglich\
  \ den Gradienten der Funktion `Q(s,* µ*(s))` berechnen. Durch Anwendung der Kettenregel\
  \ erhalten wir den Gradienten: ![\\[Bild\\]](Images/17_11.jpg).\n\nHier ist zu beachten,\
  \ dass sowohl das A2C-Verfahren als auch tiefe deterministische Policy-Gradient-Verfahren\
  \ (`Deep Deterministic Policy Gradients`, `DDPG`) zur Gruppe der A2C-Verfahren gehören,\
  \ der Critic jedoch anders verwendet wird. Beim A2C-Verfahren verwenden wir den\
  \ Critic als Baseline für eine Belohnung des gegebenen Verlaufs; er ist also optional\
  \ (wir verwenden dann das REINFORCE-Verfahren) und dient der Verbesserung der Stabilität.\
  \ Dies geschieht, weil die A2C-Policy stochastisch ist, was ein Hindernis für die\
  \ Anwendung der Backpropagation darstellt (die zufällige Stichprobe ist nicht differenzierbar).\n\
  \nBei DDPG wird der Critic anders verwendet. Da die Policy deterministisch ist,\
  \ können wir den Gradienten berechnen. Die Q-Funktion ist durch das Critic-Netz\
  \ verfügbar, welches die vom Actor erzeugten Aktionen verwendet (siehe Abbildung\
  \ 17.4), also ist das gesamte System differenzierbar und kann komplett durch SGD\
  \ optimiert werden. Zur Aktualisierung des Critic-Netzes können wir die Bellman-Gleichung\
  \ verwenden, um Näherungen für `Q(s, a)` zu finden und den mittleren quadratischen\
  \ Fehler zu minimieren. Das Ganze erscheint ein wenig rätselhaft, aber die zugrunde\
  \ liegende Idee ist einfach: Der Critic wird wie bei A2C aktualisiert und der Actor\
  \ so, dass die Ausgabe des Critics maximal ist. Das Schöne an diesem Verfahren ist,\
  \ dass es Off-Policy ist; wir können also einen großen Replay Buffer und andere\
  \ Tricks einsetzen, die wir beim DQN-Training verwendet haben.\n\n### 17.5 Exploration\n\
  \nTrotz aller Vorteile, dass unsere Policy nun deterministisch ist, müssen wir die\
  \ Umgebung irgendwie erkunden. Wir könnten den vom Actor zurückgegebenen Aktionen\
  \ Rauschen hinzufügen, bevor wir sie der Umgebung übergeben. Wir könnten den vom\
  \ Actor zurückgegebenen Aktionen Rauschen hinzufügen, bevor wir sie der Umgebung\
  \ übergeben. Wir könnten den vom Actor zurückgegebenen Aktionen Rauschen hinzufügen,\
  \ bevor wir sie der Umgebung übergeben.\n\n\n\n核心思想非常简单：我们的代理（Agent）将观测转换为动作，但当它需要在两次观测之间记忆某些内容时会发生什么？到为止我们的示例都是无状态的，但有时这并不足够。在\
  \ `OU-Process` 中，我们必须对观测之间的值进行记录。\n\n有状态代理的另一个非常有用的用例是 `POMDP`（部分观测马尔可夫决策过程），这在第\
  \ 16 章中简要提到过。`POMDP` 是一种 MDP，其中代理观测到的状态不受马尔可夫属性，并且不包含区分不同状态的完整信息。在这种情况下，我们的代理必须在执行过程中记录状态，以便执行动作。\n\
  \n以下是实现了探索性 `OU-Process` 的代理代码：\n\n```python\nclass AgentDDPG(ptan.agent.BaseAgent):\n\
  \    def __init__(self, net, device=\"cpu\", ou_enabled=True,\n                \
  \ ou_mu=0.0, ou_teta=0.15, ou_sigma=0.2,\n                 ou_epsilon=1.0):\n  \
  \      self.net = net\n        self.device = device\n        self.ou_enabled = ou_enabled\n\
  \        self.ou_mu = ou_mu\n        self.ou_teta = ou_teta\n        self.ou_sigma\
  \ = ou_sigma\n        self.ou_epsilon = ou_epsilon\n```\n\n构造函数接收一系列参数，其大部分默认值取自前文提到的文章\
  \ *Continuous Control with Deep Reinforcement Learning*。\n\n```python\ndef initial_state(self):\n\
  \    return None\n```\n\n该方法继承自 `BaseAgent` 类，必须在启动新回合（Episode）时返回代理的初始状态。由于初始状态必须与动作具有相同的维度（我们希望为环境的每个动作提供独立的探索），因此我们将状态的初始化推迟到调用\
  \ `__call__` 方法时：\n\n```python\ndef __call__(self, states, agent_states):\n    states_v\
  \ = ptan.agent.float32_preprocessor(states)\n    states_v = states_v.to(self.device)\n\
  \    mu_v = self.net(states_v)\n    actions = mu_v.data.cpu().numpy()\n```\n\n该方法是代理的核心，其目的是将观测状态和代理的内部状态转换为动作。第一步，我们将观测转换为合适的格式，并指示\
  \ Actor 网络将其转换为确定性动作。该方法的剩余部分通过应用 `OU-Process` 添加探索噪声。\n\n```python\nif self.ou_enabled\
  \ and self.ou_epsilon > 0:\n    new_a_states = []\n    for a_state, action in zip(agent_states,\
  \ actions):\n        if a_state is None:\n            a_state = np.zeros(\n    \
  \            shape=action.shape, dtype=np.float32)\n            a_state += self.ou_teta\
  \ * (self.ou_mu - a_state)\n            a_state += self.ou_sigma * np.random.normal(\n\
  \                size=action.shape)\n```\n\n在这个循环中，我们遍历观测批次和上一次调用的代理状态列表，通过直接实现上述公式来更新\
  \ `OU-Process` 的值。\n\n```python\naction += self.ou_epsilon * a_state\nnew_a_states.append(a_state)\n\
  ```\n\n在循环结束时，我们将 `OU-Process` 的噪声添加到动作中，并保存下一时刻的值。\n\n```python\nelse:\n    new_a_states\
  \ = agent_states\n\nactions = np.clip(actions, -1, 1)\nreturn actions, new_a_states\n\
  ```\n\n最后，我们对动作裁剪使其在 -1 到 1 之间，否则 `PyBullet` 会抛出异常。\n\nDDPG 实现的最后部分是位于 `Chapter17/04_train_ddpg.py`\
  \ 文件中的训练循环。为了提高稳定性，我们使用了一个包含 100,000 个转换的 `Replay Buffer` 以及 Actor 和 Critic 的目标网络。这我在第\
  \ 6 章中讨论过。\n\n```python\nact_net = model.DDPGActor(\n    env.observation_space.shape[0],\n\
  \    env.action_space.shape[0]).to(device)\ncrt_net = model.DDPGCritic(\n    env.observation_space.shape[0],\n\
  \    env.action_space.shape[0]).to(device)\n\nprint(act_net)\nprint(crt_net)\ntgt_act_net\
  \ = ptan.agent.TargetNet(act_net)\ntgt_crt_net = ptan.agent.TargetNet(crt_net)\n\
  \nwriter = SummaryWriter(comment=\"-ddpg_\" + args.name)\n```\n\n\n\n\n```\ntgt_act_net.alpha_sync(alpha=1\
  \ - 1e-3)\ntgt_crt_net.alpha_sync(alpha=1 - 1e-3)\n```\n\n### 17.5.3 结果\n\n该代码可以像\
  \ A2C 示例一样运行：你必须指定一个名称，并在需要时指定 `--cuda` 。我的实验显示，使用 GPU 后速度提升了约 30%。因此，如果你赶时间，使用\
  \ CUDA 是一个好主意，但差异不像在雅达（Atari）游戏中那样剧烈。\n\n在经过 500 万次观测（大约耗时了一天）后，DDPG 算法能够在 100 个测试回合中达到\
  \ 6.5 的平均奖励——这与 A2C 的结果相比有了提高。图 17.5 和 图 17.6 显示了训练的曲线。\n\n![\\[Bild\\]](Images/17_17.jpg)\n\
  \n**图 17.5:** DDPG 训练时的奖励（左）和回合步骤（右）\n\n![\\[Bild\\]](Images/17_18.jpg)\n\n**图 17.6:**\
  \ 训练期间 Actor（左）和 Critic（右）的损失\n\n![\\[Bild\\]](Images/17_19.jpg)\n\n**图 17.7:**\
  \ 测试期间的奖励（左）和回合步骤（右）\n\n`episode_steps` 的值表示用于训练的回合的平均长度。Critic 的损失是均均方误差，应该是较低的，但如你所知，Actor\
  \ 的损失是 Critic 输出的负值。该值越小，Actor（可能）能获得的奖励就越大。\n\n图 17.6 和 图 17.7 中的训练并不稳定，且充满了噪声。\n\
