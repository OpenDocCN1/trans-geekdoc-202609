  \ reward_bound=200.0\n41: loss=0.548, reward_mean=199.1, reward_bound=200.0\n解决完成！\n\
  ```\n\n从输出中可以看出，动作的视频录制定期存储在单独文件中，这让你对它的会话是如何进行的有一个直观的感受。停一下，思考刚刚发生了什么。我们的神经网络已经学会了如何在环境中生存——仅通过观察和奖励，而完全不需要对观察到的值进行解释。环境不一定是一个带杆的小车，也可以是一个商场模型，其中产品数量是观察值，获得的收入是奖励。我们的实现并不依赖于环境的细节。这就是\
  \ RL 模型的奇妙之处。在下一节中，我们将查看这种方法具体是如何运作的。\n\n![图片](img/04_04.jpg)\n\n**4.4 CartPole\
  \ 的可视化**\n\n![图片](img/04_05.jpg)\n\n**4.5 CartPole 的可视化**\n\n![图片](img/04_06.jpg)\n\
  \n**4.6 FrozenLake 的可视化**\n\n\n\n\n在 `FrozenLake` 环境中，回合（episodes）和奖励的情况与众不同。只有在到达目标时，我们才能获得\
  \ `1,0` 的奖励，而奖励本身无法反映该回合的成功程度。它是快速且高效的，还是我们在随机到达目标之前已经绕着湖泊转了好几圈？我们无从知——奖励就是 1.0，仅此而已。回合奖励的分布也存在问题（图\
  \ 4.10）。这种环境中只有两种类型的回合可能：奖励为 0 的回合（失败）和奖励为 1.0 的回合（成功）。在训练开始阶段，失败的回合显然占据主导地位。通过百分位数来选择“最佳”回合是完全错误的，并且会为我们提供糟糕的训练样本。这就是训练失败的原因。\n\
  \n![\\[图像\\]](Images/04_10.jpg)\n\n**图 4.10：** FrozenLake 环境中的奖励分布\n\n这个示例向我们展示了交叉熵方法的局限性：\n\
  \n*   对于训练来说，回合应该是有限的且尽可能短的。\n*   回合的总奖励应该有剧烈的波动，以便区分好回合和坏回合。\n*   过程中没有任何提示可以指示智能体是成功了还是失败了。\n\
  \n在书的后面部分，你将学习到其他处理这些困难的方法。如果你好奇如何使用交叉熵方法解决 FrozenLake 环境问题，可以在下方找到你对代码必须进行的修改列表。（完整代码可以在\
  \ `Chapter04/03_frozenlake_tweaked.py` 文件找到。）\n\n*   **运行更大批的回合：** 在 CartPole 示例中，每次迭代\
  \ 16 个回合就足够了，但 FrozenLake 至少需要 100 个才能保证至少几个回合是成功的。\n*   **对奖励应用折扣因子：** 我们可以对折后奖励应用\
  \ `0,9` 或 `0,95` 的折扣因子，使得总奖励取决于回合的长度，并使数值波动更大。在这种情况下，短回合的奖励比长回合大。通过这种方式可以更容易避免类似图\
  \ 4.10 所示的情况。\n*   **长久保留“最佳回合”：** 在 CartPole 示例中，我们从环境中提取回合，基于最佳回合进行训练，然后将其丢弃。在\
  \ FrozenLake 示例中，成功的回合要稀得多，因此我们应该在多次迭代中都保留它们。\n*   **降低学习率：** 这将为网络提供时间对大量的训练数据进行平均处理。\n\
  *   **更长时间的训练：** 因为成功的回合稀少且动作结果是随机的，网络识别识别特定情况下的最佳行为要困难得多。为了获得 50% 的成功回合，大约需要 5,000\
  \ 次训练迭代。\n\n为了将所有内容引入我们的代码中，我们需要修改 `filter_batch` 函数，使其计算折后奖励并返回我们应该保留的“最佳”回合：\n\
  \n```\ndef filter_batch(batch, percentile):\n    filter_fun = lambda s: s.reward\
  \ * (GAMMA ** len(s.steps))\n    disc_rewards = list(map(filter_fun, batch))\n \
  \   reward_bound = np.percentile(disc_rewards, percentile)\n\n    train_obs = []\n\
  \    train_act = []\n    elite_batch = []\n    for example, discounted_reward in\
  \ zip(batch, disc_rewards):\n        if discounted_reward > reward_bound:\n    \
  \        train_obs.extend(map(lambda step: step.observation, example.steps))\n \
  \           train_act.extend(map(lambda step: step.action, example.steps))\n   \
  \         elite_batch.append(example)\n    return elite_batch, train_obs, train_act,\
  \ reward_bound\n```\n\n在训练循环中，我们保存之前的“最佳”回合，以便在下次训练迭代中将其传递给函数。\n\n```\nfull_batch\
  \ = []\nfor iter_no, batch in enumerate(iterate_batches(env, net, BATCH_SIZE)):\n\
  \    reward_mean = float(np.mean(list(map(lambda s: s.reward, batch))))\n    full_batch,\
  \ obs, acts, reward_bound = filter_batch(full_batch + batch, PERCENTILE)\n    if\
  \ not full_batch:\n        continue\n    obs_v = torch.FloatTensor(obs)\n    acts_v\
  \ = torch.LongTensor(acts)\n    full_batch = full_batch[-500:]\n```\n\n其余代码相同，但学习率降低了\
  \ 10 倍，且 `BATCH_SIZE` 被设置为 100。在耐心的等待之后（新版本需要约 90 分钟执行 10,000 次迭代），可以看到模型训练在达到约\
  \ 55% 的回合后就不再提升了（图 4.11）。有方法可以改变这一点（例如对熵损失函数进行正则化），但这些方法将在后续章节中讨论。\n\n![\\[图像\\\
  ]](Images/04_11.jpg)\n\n**图 4.11：** 改进训练的奖励（左）和损失（右）\n\n![\\[图像\\]](Images/04_12.jpg)\n\
  \n**图 4.12：** 改进版本的奖励边界\n\n关于 FrozenLake 环境中“平滑性”影响的最后一点：所有动作都有 33% 的概率被一个旋转 90\
  \ 度的给定 en 动作所取代。\n\n\n\n\nDieser Abschnitt ist optional und richtet sich an Leser,\
  \ die wissen möchten, warum das Verfahren funktioniert. Sie können dies auch in\
  \ der ursprünglichen Arbeit über Kreuzentropie nachlesen, auf die am Ende dieses\
  \ Abschnitts verwiesen wird.\n\nDie Grundlage des Kreuz-entropie-Verfahrens ist\
  \ das `Importance-Sampling-Theorem` (Wichtigkeitsichtproben), das Folgendes besagt:\n\
  \n![\\[Bild\\]](Images/04_15.jpg)\n\nBeim Reinforcement Learning ist `H(x)` eine\
  \ Belohnung, die durch eine Policy `x` erzielt wird, und `p(x)` eine Verteilung\
  \ aller möglichen Policies. Wir wollen die Belohnung jedoch nicht maximieren, indem\
  \ wir alle möglichen Policies ausprobieren, sondern indem wir eine Möglichkeit finden,\
  \ `p(x)H(x)` durch `q(x)` zu approximäieren, wobei wir den Abstand zwischen den\
  \ beiden iterativ minimieren. Der Abstand zwischen zwei Wahrscheinlichkeitsverteilungen\
  \ wird durch die `Kullback-Leibler`-Divergenz (`KL`) gegeben, die wie folgt definiert\
  \ ist:\n\n![\\[Bild\\]](Images/04_16.jpg)\n\nDer erste Term wird als `Entropie`\
  \ bezeichnet und ist von den Variablen unabhängig, daher könnte er bei der Minimierung\
  \ weggelassen werden. Der zweite Term heißt `Kreuzentropie` und ist im Deep Learning\
  \ ein sehr gebräuchliches Optimierungsziel.\n\nDurch Kombination der beiden Formeln\
  \ erhalten wir einen iterativen Algorithmus, der mit `q0 = p(x)` beginnt und mit\
  \ jedem Schritt besser wird. Die nach folgende Formel ist eine Approximation für\
  \ `p(x)H(x)` mit einer Aktualisierung:\n\n![\\[Bild\\]](Images/04_17.jpg)\n\nHierbei\
  \ handelt es sich um ein generisches Kreuzentropie-Verfahren, das sich beim Reinforcement\
  \ Learning stark vereinfachen lässt. Zuerst ersetzen wir `H(x)` durch eine Indikatorfunktion,\
  \ die den Wert 1 bzw. 0 besitzt, wenn die Belohnung für die Episode größer oder\
  \ kleiner als der Schwellenwert ist. Die Aktualisierung unserer Policy sieht dann\
  \ wie folgt aus:\n\n![\\[Bild\\]](Images/04_18.jpg)\n\nStreng genommen fehlt in\
  \ der obigen Formel ein Normalisierungsterm, aber in der Praxis funktioniert sie\
  \ auch ohne ihn. Das Verfahren läuft wie folgt ab: Wir entnehmen gemäß unserer aktuellen\
  \ Policy Episoden (anfangs zufällige) und minimieren die negative Log-Likelihood\
  \ mit den erfolgreichsten Beispielen unserer Policy.\n\nDirk P. Kroese hat diesem\
  \ Verfahren ein ganzes Buch gewidmet. Eine kürzere Beschreibung finden Sie in seinem\
  \ Artikel `Cross-Entropy Method` ([`people.smp.uq.edu.au/DirkKroese/ps/eormsCE.pdf`](https://people.smp.uq.edu.au/DirkKroese/ps/eormsCE.pdf)).\n\
  \n## 4.6 Zusammenfassung\n\nIn diesem Kapitel haben Sie das erste RL-Verfahren kennengelernt,\
