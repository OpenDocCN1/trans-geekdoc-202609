  \n### 16.3.5 容器\n\n启动训练需要运行 MiniB 的 Docker 容器。Universe 提供了自动启动它们的功能。为此，你必须向 `env.configure()`\
  \ 调用传递一个整数。\n\n\n\n\n```bash\ndocker run -d -p 5900:5900 -p 15900:15900 --privileged\
  \ --ipc host --cap-add SYS_ADMIN <CONTAINER_ID> <ARGS>\n```\n\nDie Argument haben\
  \ folgende Bedeutung:\n\n- `-d`: Startet den Container im 后台 modus (`detach`-modus).\
  \ Wenn Sie die Nachrichten des Containers sehen möchten, können Sie diese Option\
  \ durch `-t` ersetzen. Der Container wird dann interaktiv gestartet und kann mit\
  \ Strg-C gestoppt werden.\n\n- `-p` `SRC_PORT:TGT_PORT`: Leitet den Quellenport\
  \ vom Host an den Zielport innerhalb des Containers weiter. Diese Option ermöglicht\
  \ es, mehrere MiniWoB-Container auf einer Maschine zu starten. Alle Container starten\
  \ den VNC-Server und den Reward-Dämon, die auf den Ports `5900` bzw. `15900` laus.\
  \ Das Argument `-p 5900:5900` stellt den VNC-Server auf Port `5900` des Hosts (dem\
  \ Computer, auf dem der Container läuft) bereit. Für den zweiten Container sollten\
  \ Sie `-p 5901:5900` übergeben, der den Server auf Port `5901` verfügbar macht (`5900`\
  \ ist bereits belegt). Mit dem Reward-Dämon innerhalb des Containers funktioniert\
  \ das genauso, er laus auf Port `15900`. Mit der Option `-p` können Sie Verbindungen\
  \ des Hostrechner an die Ports des Containers weiterle.\n\n- `--privileged`: Diese\
  \ Option erlaubt es Containern, auf die Geräte des Hosts zuzugreifen. Warum MinIWoB-Tasks\
  \ mit dieser Option gestartet werden, ist unklar. Vielleicht liegt es an Anforderungen\
  \ des VNC-Servers.\n\n- `--ipc` `host`: Ermöglicht es Containern, den IPC-Namespace\
  \ (Interprocess Communication) mit dem Host-Computer zu teilen.\n\n- `--cap-add`\
  \ `SYS_ADMIN`: Erweitert die Möglichkeiten des Containers, Konfigurationseinstellungen\
  \ des Hosts zu ändern.\n\n- `<CONTAINER_ID>`: Die ID des Containers. Sie sollte\
  \ `shuma/miniwob:v2` lauten. Dies ist die gepatchte Version des Originals `quay.io/openai/universe.world-of-bits:0.20.0`.\
  \ Sie dazu auch den Abschnitt 16.2.4.\n\n- `<ARGS>`: Sie können dem Container weitere\
  \ Argumente übergeben, um seine Betriebsart zu ändern. Wir werden das später für\
  \ die Aufzeichnung von Demonstrationen benötigen. Hier wird es nicht.\n\nDas war’s!\
  \ Unser Trainingsscript erwartet, dass acht Container laufen und auf den Ports `5900`\
  \ bis `5907` und `15000` bis `15007` laus. Zum Starten verwende ich folgende Befehle\
  \ (siehe auch `Chapter16/adhoc/start_docker.sh`):\n\n```bash\n#!/usr/bin/env bash\n\
  for i in 'seq 0 7'; do\n    p1=$((5900+i))\n    p2=$((15900+i))\n    docker run\
  \ -d -p $p1:5900 -p $p2:15900 --privileged --ipc host --cap-add SYS_ADMIN shuma/miniwob\
  \ -f 20\ndone\n```\n\nAlle Container werden im Hintergrund gestartet und können\
  \ mit dem Befehl `docker ps` angezeigt werden (siehe auch Abbildung 16.5).![Bild](img/16_05.jpg)\n\
  \n**Abb. 16.5:** Ausgabe des Befls `docker ps`\n\n### 16.3.6 Trainingsprozess\n\n\
