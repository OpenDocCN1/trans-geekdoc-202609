  尽管 PPO 训练了五个小时，但它“仅”花费了 185,000 个回合就找到了最佳行为。虽然这比基于计数探索的 DQN 方法差，但至少远优于使用 `epsilon`-Greedy\
  \ 探索的 DQN 方法。\n\n![\\[图像\\]](Images/21_14.jpg)\n\n**图 21.12:** 训练期间的奖励和步数\n\n![\\\
