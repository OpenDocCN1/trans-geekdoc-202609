  \ 训练过程中的损失：观测（左）和奖励（右）\n\n### 22.5.3 使用 I2A 模型进行训练\n\n在想象路径（Imagination path）涉及巨大的计算开销，该开销与执行的\
  \ Rollout 步骤成正比。我针对该超参数的不同值进行了实验。在 Breakout 游戏中，五步和三步之间几乎没有区别，但速度几乎快了一倍。\n\n```bash\n\
  $ ./03_i2a.py --cuda --em saves/02_env_t1/best_9.78e-04\nI2A (\n  (conv): Sequential\
  \ (\n    (0): Conv2d(2, 32, kernel_size=(8, 8), stride=(4, 4))\n    (1): ReLU ()\n\
  \    (2): Conv2d(32, 64, kernel_size=(4, 4), stride=(2, 2))\n    (3): ReLU ()\n\
  \    (4): Conv2d(64, 64, kernel_size=(3, 3), stride=(1, 1))\n    (5): ReLU ()\n\
  \    (6): Conv2d(64, 64, kernel_size=(3, 3), stride=(1, 1))\n    (7): ReLU ()\n\
  \  )\n  (fc): Sequential (\n    (0): Linear(in_features=576, out_features=128, bias=True)\n\
  \    (1): ReLU()\n    (2): Linear(in_features=128, out_features=1, bias=True)\n\
  \  )\n)\n...\n```\n\n\n\n观察游戏状态的能力以及明确的规则为我们提供了分析当前局面的可能性，这在当时的雅达（Atari）游戏中是不可能实现的。在分析过程中，会对当前局面下所有可能的游戏移动进行评估，并选择最佳的一个作为我们的下一步动作。\n\
  \n评估最简单的方法是遍历所有可能的动作，并对执行移动后的局面进行递归评估。通过这种方式，我们最终会到达一个无法再进行移动的状态。通过对游戏结果进行反向传播（Backpropagation），我们可以估计任何局面下某个移动的预期值。这种方法的一种变体称为\
  \ `Minimax`（极小算法）：我们尝试执行最强的移动，而我们的对手会尝试做出对我们最不利的移动，因此我们交替地最小化和最大化游戏的真实目标——向下遍历游戏状态树（我稍后会详细介绍这部分）。\n\
  \n如果可能局面的数量足够小，可以进行完全分析，例如井棋游戏（只有 138 个终局状态），那么从任何状态开始向下遍历游戏状态树并找出哪种移动是最好的就没有任何问题。\n\
  \n遗憾的是，这种暴力破解的方法在面对相当复杂的游戏就已经失效了，因为可能局面的数量呈指数级增长。在跳棋游戏中，整个游戏树包含 `5 x 10²⁰` 个节点，这对于现代硬件来说也是一项挑战。对于国际象棋或围棋等更复杂的游戏，这个数字要大得多，因此根本无法分析从特定局面可以到达的所有其他局面。因此，通常使用近似方法，只分析到树的某个特定深度。通过结合精心选择的搜索终止条件（即树的“剪枝”或\
  \ `Pruning`）以及对特定局面的预定义评估，我们可以创建出能够相当高水平玩复杂游戏的计算机程序。\n\n2017 年底，DeepMind 在《自然》杂志上发表了一篇文章，介绍了一种名为\
  \ AlphaGo Zero 的新方法。它能够超越人类水平应对国际象棋和围棋等复杂游戏，而且除了游戏规则外，不需要任何关于游戏的其他知识。该智能体通过自我对弈并评估结果来不断改进其策略。大型游戏数据库、精选特征或预训练模型都是多余的。此外，该方法还具有简单优雅的优良特性。\n\
  \n在本章的示例中，我们将尝试为“四连棋”游戏实现这种方法，以便大家有一个直观的认识。\n\n## 23.2 AlphaGo-Zero 方法\n\n在本节中，我们将研究该方法的结构。整个系统由几个部分组成，必须理解它们才能实现。\n\
  \n### 23.2.1 概述\n\n整个系统由几个部分组成，必须理解它们才能实现。\n\n该方法通来说由三个组件组成，我稍后会详细介绍：\n\n*   我们使用一种名为\
  \ `蒙特卡洛树搜索`（英文 `Monte Carlo Tree Search`，即 `MCTS`）的算法遍历树以收集状态。由于树既深又宽，我们并不尝试创建完整的树，而是选择最有前景的路径。\n\
  *   在任何时刻都有一个模型，它初始具有随机值。尽管这种方法非常简单，AlphaGo Zero 仍然能够击败所有之前的 AlphaGo 版本。\n*   该方法的第三部分是自我对弈的模型训练过程。这并不是是可以观察的。\n\
  \n### 23.2.2 蒙特卡洛树搜索\n\n为了理解蒙特卡洛树搜索是如何运作的，我们来看井棋游戏树的一个简单分支（如图 23.1 所示）。\n\n初始时，棋盘是空的，必须在某处放置一个交叉。第一步有九种选择。因此，根节点拥有九个分支，指向相应的状态。\n\
  \n```\n![Bild]](Images/23_01.jpg)\n```\n\n**图 23.1:** 井棋的游戏树\n\n\n\n\n在我们的示例中，当放置了“叉”后，共有\
  \ 9 种不同的位置，圆可以在剩下的 8 个格中中放置。因此，树的第二层产生了 `8 x 9 = 72` 种不同的状态。叶子节点的总数可达 `9! = 362.880`，但实际数量更低，因为并非所有游戏都能持续到最大深度。\n\
  \n井跳棋（Tic-Tac-Toe）非常简单，但如果我们考虑更复杂的游戏并观察白方在国际象棋游戏开始时可选的走法数量（共有 20 种），或者在围棋中可以放置白棋子的格点数量（在\
  \ `19 x 19` 大小的围棋盘上总共 361 个），那么游戏树中可能的游戏局势数量会迅速变成极其惊人的数字，因为每增加新一层，状态数就会乘以上一层中可用动作的平均数量。\n\
  \n在处理这种呈爆炸式增长的数量时，随机采样派上了用场。在通用的蒙特卡洛树搜索（MCTS）中，我们从当前游戏局势开始进行多次迭代搜索，要么随机选择动作，要么遵循一种在决策中允许足够随机性的策略。搜索将持续到游戏的终局状态，然后根据游戏结果更新经过的树分支的权重。这个过程类似于值迭代（Value\
  \ Iteration），其中我们运行多个回合（Episodes），而回合的最后一步会影响所有之前步骤的价值估算。这是一种通用的蒙特卡洛树搜索，它有许多变体，涉及扩展策略、分支选择以及其他细节。\n\
  \nAlphaGo Zero 使用了蒙特卡洛树搜索（`MCTS`）的一种变体。对于每一条边（代表转换到新的游戏局势），都存储了不同的统计值：该边的先验概率 `P(s,\
  \ a)`、访问频率的计数器 `N(s, a)` 以及动作值 `Q(s, a)`。每次搜索都从根节点开始，并根据效用性 `U(s, a)`（该值与 ![\\[Bild\\\
  ]](Images/23_02.jpg) 正比例）选择最有前景的动作。\n\n选择过程中必须添加随机分量，以确保游戏树得到充分的探索。每次搜索要么以游戏的终局结束，要么我们遇到了一个尚未探索的状态（没有相应的统计值）。如果是后者，则使用策略网络（Policy\
  \ Network）来获取先验概率和状态估值。然后创建一个新的树节点，其参数 `N(s, a) = 0`、`P(s, a) = p[net]`（网络提供的动作概率）以及\
  \ `Q(s, a) = 0`。除了动作的先验概率外，网络还会返回一个对游戏结果的估值（状态值），即当前玩家看来的游戏结果。\n\n当我们获得价值后（通过达到游戏终局状态或通过神经网络扩展节点），将执行一个我们称之为“值回溯”（Value-Backup）的过程。在这个过程中，我们从终点到根节点遍历游戏路径，并更新被访问节点的统计值，特别是将计数器\
  \ `N(s, a)` 加 1，并更新 `Q(s, a)`，使其反映从当前视角观察的游戏结果。由于两个玩家交替执行走法，游戏结果在回溯的每一步都会发生变化。\n\
  \n该搜索过程会执行多次（在 AlphaGo Zero 中进行一千到两千次搜索），以便收集足够的统计值，从而将计数器 `N(s, a)` 用作根节点执行某动作的概率。\n\
  \n### 23.2.3 自弈 (Self-Playing)\n\n在 AlphaGo Zero 中，神经网络被用于估算动作的先验概率并评估局势，这与具有两个输出网络的\
  \ A2C 方法非常相似。作为网络的输入，我们传递当前的游戏局势（扩展了几个之前的状态），并返回两个值。策略输出（Policy output）返回动作的概率分布，值输出（Value\
  \ output）从玩家视角估算游戏结果。这个值是不打折的，因为围棋的走法是确定性的。如果游戏涉及随机性（例如在双陆棋中），则应该使用某种形式的折扣。\n\n\
  正如前面提到的，我们感兴趣的是*当前最佳*的网络，它通过不断的自我对弈来为我们的“学徒模型”收集训练数据。自我对弈的每一步都从当前游戏局势出发，开始一系列蒙特卡洛树搜索，以收集用于选择根节点执行动作的统计值。\n\
  \n\n\n为了直观展示该过程，我们现在为*四连棋*实现 AlphaGo Zero。在 във游戏中，两名玩家在 6 x 7 格子的棋盘上对弈。玩家使用不同颜色的棋子，交替将其放入七列中的任意一。圆形的棋子垂直堆叠。目标是先让自己的四个棋子在水平、垂直或对角线方向排成一线。图\
  \ 23.2 展示了两种对战局面。左侧深色棋子玩家刚刚获胜。右侧浅色棋子玩家正准备形成一个四连。\n\n![\\[图像\\]](Images/23_03.jpg)\n\
  \n**图 23.2：** 四连棋游戏中的两个局面\n\n尽管游戏如此简单，但存在 $4.5 \\times 10^{12}$ 种不同的局面，这对于暴力破解法来说是一项挑战。该示例使用了不同的辅助程序和库模块：\n\
  \n* `Chapter23/lib/game.py`：游戏的低层表示，包含了执行步法、编码或解码游戏局面以及其他辅助函数。\n\n* `Chapter23/lib/mcts.py`：蒙特卡洛树搜索的实现，允许使用\
  \ GPU 扩展和存储叶子节点。核心类还负责游戏叶子节点的统计数据，这些数据在搜索过程中会被重复使用。\n\n* `Chapter23/lib/model.py`：神经网络以及其他相关的相关的函数，例如将模型输入转换为游戏局面以及运行单局。\n\
  \n* `Chapter23/train.py`：实际训练程序，将所有内容连接起来并创建新的最优网络。\n\n* `Chapter23/play.py`：组织模型自动竞赛的辅助程序。它接收多个模型文件作为输入，并运行指定的比赛次数，以创建最佳评分表。\n\
  \n* `Chapter23/telegram-bot.py`：用于 Telegram 聊天平台的机器人，允许用户与任意模型对弈并生成统计数据。该机器人被用于人工复核示例结果。\n\
  \n### 23.3.1 游戏模型\n\n整个方法的基础在于我们能够预测动作的结果。换句话说：我们必须能够在执行特定步法后，获得生成的游戏状态。这比 Atari\
  \ 环境或通用的 Gym 要求要严格得多。在那些环境中，你无法指定一个想要从中操作的当前状态。因此，我们需要一个封装了游戏规则和动态的模型。幸运的是，大多数棋类游戏的规则都是简单且紧凑的。\n\
  \n在案例中，四连棋被定义为 `6 x 7` 格子。游戏状态的表示必须是高效的，因为蒙特卡洛树搜索 (`MCTS`) 需要处理数百万个状态。`BITS_IN_LEN`\
  \ 指定每列所需的位数；对于为 `6` 的高度，`3` 位足够了。\n\n```\nGAME_ROWS = 6\nGAME_COLS = 7\nBITS_IN_LEN\
  \ = 3\nPLAYER_BLACK = 1\nPLAYER_WHITE = 0\nCOUNT_TO_WIN = 4\nINITIAL_STATE = encode_lists([[]]\
  \ * GAME_COLS)\n```\n\n\n\n\n\n*   `move(state_int, col, player)`：该文件的核心函数，用于执行游戏走子并检查是否有胜者。它接收以下参数：以编码形式的游戏局势、要放置棋子的列、以及执行走子的玩家索引。列索引必须是有效的（即它必须存在于\
  \ `possible_moves(state_int)` 的结果中），否则将抛出异常错误。该函数返回一个包含两个元素的元组：执行走子后的新游戏局势（编码形式）以及一个指示玩家是否通过该走子赢得游戏的布尔值。由于玩家只有在执行走子后才可能获胜，因此一个布尔值就足够了。当然，如果没有玩家获胜且没有进一步的可走的走子，也可能出现平局。在调用\
  \ `move()` 函数后，必须使用 `possible_moves` 函数检查此情况。\n\n*   `render(state_int)`：返回一个字符串列表，代表棋盘的状态。该函数在\
  \ Telegram 机器人中使用，用于向用户传输游戏局势。\n\n## 23.3.2 蒙特卡洛树搜索的实现\n\n蒙特卡洛树搜索 (MCTS) 的实现在文件\
  \ `Chapter23/lib/mcts.py` 中，包含在一个名为 `MCTS` 的类中，该类负责执行批量 MCTS 并对收集到的统计值进行记录。虽然代码并不冗长，但在某些地方相当复杂，\n\
  \n```python\nclass MCTS:\n    def __init__(self, c_puct=1.0):\n        self.c_puct\
  \ = c_puct\n        # 调用计数，state_int -> [N(s, a)]\n        self.visit_count = {}\n\
  \        # 状态动作的总体值，\n        # state_int -> [W(s, a)]\n        self.value = {}\n\
  \        # 动作的平均值，\n        # state_int -> [Q(s, a)]\n        self.value_avg = {}\n\
  \        # 动作的先验概率，\n        # state_int -> [P(s,a)]\n        self.probs = {}\n\
  ```\n\n构造函数除了 `c_puct` 值外没有其他参数，该值在选择节点时使用，在关于 AlphaGo Zero 的论文 [2] 中提到它*可以被改变以加强探索*。我没有重新定义它，也没有对其进行实验。构造函数体创建一个空容器，用于存储游戏局势的统计值。\n\
  \n所有这些 `字典` 的键是编码后的游戏状态（一个整数），值是包含我们动作各种参数的列表。不同容器上方的注释使用了与 AlphaGo Zero 论文相同的符号。\n\
  \n```python\ndef clear(self):\n    self.visit_count.clear()\n    self.value.clear()\n\
  \    self.value_avg.clear()\n    self.probs.clear()\n```\n\n上述方法在不破坏 `MCTS` 对象的情况下清除状态。我们将当前最佳模型更改为新模型导致收集的统计数据过时，就会执行此操作。\n\
  \n```python\ndef find_leaf(self, state_int, player):\n    states = []\n    actions\
  \ = []\n    cur_state = state_int\n    cur_player = player\n    value = None\n```\n\
  \n此方法用于在搜索过程中从指定的根节点 `state_int` 开始遍历游戏树，直到发生以下情况之一：我们到达游戏的终局状态或发现了一个尚未探索的叶子节点。在搜索过程中，我们记录访问过的状态和执行的动作，以便以后更新节点的统计值。\n\
  \n```python\nwhile not self.is_leaf(cur_state):\n    states.append(cur_state)\n\n\
  \    counts = self.visit_count[cur_state]\n    total_sqrt = m.sqrt(sum(counts))\n\
  \    probs = self.probs[cur_state]\n    values_avg = self.value_avg[cur_state]\n\
  ```\n\n循环的每次迭代都会处理当前游戏状态。我们提取用于决策动作所需的所需的统计值。\n\n```python\nif cur_state == state_int:\n\
  \    noises = np.random.dirichlet([0.03] * game.GAME_COLS)\n    probs = [\n    \
  \    0.75 * prob + 0.25 * noise\n        for prob, noise in zip(probs, noises)\n\
  \    ]\nscore = [value + self.c_puct * prob * total_sqrt /(1 + count)\n        \
  \            for value, prob, count in zip(values_avg,\n                       \
  \                       probs, counts)]\n```\n\n关于要执行动作的决策是根据辅助程序 `action` 出的，它包含了……的总和（注意：此处文本源不完整/不清晰，保留结构）。\n\
  \n\n\n\n当最初 `MCTS` 类中尚未存储任何节点时，第一次搜索会扩展根节点，第二次搜索扩展其子节点，以此此类推。然而，一个单一的 `MCTS` 批（Batch）在初始只能扩展一个根节点。之后，批中的单个\
  \ `MCTS` 可以遵循不同的游戏路径并扩展树，但在初期，在探索方面，小批次（Mini-Batch）扩展的效率远低于顺序的 MCTS。\n\n为了补偿这一点，我仍然使用小批次，但一次同时处理多个。\n\
  \n```python\ndef search_minibatch(self, count, state_int, player,\n            \
  \         net, device=\"cpu\"):\n    backup_queue = []\n    expand_states = []\n\
  \    expand_players = []\n    expand_queue = []\n    planned = set()\n    for _\
  \ in range(count):\n        value, leaf_state, leaf_player, states, actions =\n\
  \            self.find_leaf(state_int, player)\n        if value is not None:\n\
  \            backup_queue.append((value, states, actions))\n        else:\n    \
  \        if leaf_state not in planned:\n                planned.add(leaf_state)\n\
  \                leaf_state_lists =\n                    game.decode_binary(leaf_state)\n\
  \                expand_states.append(leaf_state_lists)\n                expand_players.append(leaf_player)\n\
  \                expand_queue.append((leaf_state, states,\n                    \
  \                 actions))\n```\n\n小批次搜索从当前状态开始。如果找到了终局状态（在这种情况下，返回值不为 `None`），则不需要扩展，我们存储结果用于回溯（Backup）。否则，我们存储叶子节点以便后续扩展。\n\
  \n```python\nif expand_queue:\n    batch_v = model.state_lists_to_batch(\n     \
  \   expand_states, expand_players, device)\n    logits_v, values_v = net(batch_v)\n\
  \    probs_v = F.softmax(logits_v, dim=1)\n    values = values_v.data.cpu().numpy()[:,\
  \ 0]\n    probs = probs_v.data.cpu().numpy()\n```\n\n为了进行树扩展，我们将状态转换为模型所需的格式（`model.py`\
  \ 库中有一个专门的函数），并指示我们的网络返回该状态批的先验概率和值。我们使用这些概率来创建节点，并在最终更新统计值时将值添加到回溯队列中。\n\n```python\n\
  for (leaf_state, states, actions), value, prob in\n        zip(expand_queue, values,\
  \ probs):\n    self.visit_count[leaf_state] =  * game.GAME_COLS\n    self.value[leaf_state]\
  \ = [0.0] * game.GAME_COLS\n    self.value_avg[leaf_state] = [0.0] * game.GAME_COLS\n\
  \    self.probs[leaf_state] = prob\n    backup_queue.append((value, states, actions))\n\
  ```\n\n在创建节点时，动作字段中的计数器和动作值（总和和平均值）简单地存储为零。对于先验概率，我们存储网络提供的值。\n\n```python\nfor\
  \ value, states, actions in backup_queue:\n    cur_value = -value\n    for state_int,\
  \ action in zip(states[::-1],\n                                         actions[::-1]):\n\
  \        self.visit_count[state_int][action] += 1\n        self.value[state_int][action]\
  \ += cur_value\n        self.value_avg[state_int][action] =\n                  \
  \        self.value[state_int][action] /\n                          self.visit_count[state_int][action]\n\
  \        cur_value = -cur_value\n```\n\n回溯操作是 MCTS 的核心；它在搜索过程中更新所访问状态的统计值。执行动作的计数器增加，总值简单地累加，并使用计数器对平均值进行归一化。\n\
  \n在回溯过程中正确记录游戏值是非常重要的，因为有两个对手，并且每走一步符号都会发生变化。（当前玩家的获胜局面意味着对手的失败。）\n\n```python\n\
  def get_policy_value(self, state_int, tau=1):\n    counts = self.visit_count[state_int]\n\
  \    if tau == 0:\n        probs = [0.0] * game.GAME_COLS\n        probs[np.argmax(counts)]\
  \ = 1.0\n    else:\n        counts = [count ** (1.0 / tau) for count in counts]\n\
  \        total = sum(counts)\n        probs = [count / total for count in counts]\n\
  \    values = self.value_avg[state_int]\n    return probs, values\n```\n\n该类的最后一个函数提供游戏局面的动作概率和动作值，并访问在蒙特卡洛树搜索期间收集的统计值。计算概率有两种模式。\n\
  \n\n\n\n\n在游戏循环之前，我们初始化游戏状态并选择由谁执行第一个回合。如果未指定此项，将随机选择一个玩家。\n\n```python\nresult\
  \ = None\nnet1_result = None\n\nwhile result is None:\n    mcts_stores[cur_player].search_batch(mcts_searches,\n\
  \                    mcts_batch_size, state, cur_player,\n                     \
  \  nets[cur_player], device=device)\n    probs, _ = mcts_stores[cur_player].get_policy_value(\n\
  \         state, tau=tau)\n    game_history.append((state, cur_player, probs))\n\
  \    action = np.random.choice(game.GAME_COLS, p=probs)\n```\n\n在每一步移动中，我们都执行 MCTS，更新统计数据，并获取动作概率，从中提取一个示例以获得动作。\n\
  \n```python\nif action not in game.possible_moves(state):\n    print(\"无效走法!\")\n\
  state, won = game.move(state, action, cur_player)\nif won:\n    result = 1\n   \
  \ net1_result = 1 if cur_player == 0 else -1\n    break\ncur_player = 1-cur_player\n\
  # 检查平局\nif len(game.possible_moves(state)) == 0:\n    result = 0\n    net1_result\
  \ = 0\n    break\nstep += 1\nif step >= steps_before_tau_0:\n    tau = 0\n```\n\n\
  使用游戏引擎模块的功能更新游戏状态，并在必要时处理游戏结束。\n\n```python\nif replay_buffer is not None:\n   \
  \ for state, cur_player, probs in reversed(game_history):\n        replay_buffer.append((state,\
  \ cur_player, probs,\n                                                result))\n\
  \        result = -result\nreturn net1_result, step\n```\n\n在函数结束时，我们根据当前玩家的角度填充动作概率和游戏结果以填充\
  \ Replay Buffer。这些数据将用于训练网络。\n\n### 23.3.4 训练\n\n现在所有这些函数都可用了，训练过程仅在于按照正确的顺序将它们组合。你可以在\
  \ `Chapter23/train.py` 文件中找到训练程序。程序逻辑已经描述过：在循环中，当前最佳模型不断进行自我对弈，并将步骤存储在 Replay Buffer\
  \ 中。使用这些数据训练另一个网络，该网络旨在最小化蒙特卡洛树搜索得出的动作概率与策略输出结果之间的交叉熵。游戏值输出预测值与实际游戏结果之间的均方误差也包含在总损失函数中。\n\
  \n待训练的网络与当前最佳网络会定期进行 100 次对战，如果当前网络获胜了超过 60% 的比赛，则将同步两个网络的权重。此过程将不断重复，以期找到能够越来越精通该游戏的模型。\n\
  \n### 23.3.5 测试与比较\n\n在训练过程中，当当前最佳模型被训练模型替换时，会保存模型权重。这样我们就可以获得多个不同强度的智能体。从理论上说，最后一个模型的能力应该超过先前的，但我们想亲身验证一下。为此，有一个\
  \ `Chapter23/play.py` 辅助程序，它可以接收多个模型文件并举办一场“锦标赛”，每个模型都与其他进行固定轮数的对决。\n\n\n\n在本章中，我们实现了由\
  \ DeepMind 开发的 AlphaGo-Zero 方法，该方法用于解决完全观测的棋类游戏。该方法的关键特征是，智能体通过自我对弈来提升自身，而无需任何人类对弈的知识，也不需要访问其他数据源。\n\
  \n在下一章中，我们将考虑强化学习的另一个领域，即离散优化，它在许多实际应用中起着重要作用，例如规划优化或蛋白质折叠。\n\n## 23.6 参考文献\n\n\
  [1] *Mastering the Game of Go Without Human Knowledge*, David Silver, Julian Schrittwieser,\
  \ Karen Simonyan et al., doi:10.1038/nature24270\n\n[2] *Mastering Chess and Shogi\
  \ by Self-Play with a General Reinforcement Learning Algorithm*, David Silver, Thomas\
  \ Hubert, Julian Schrittwieser et al., arXiv:1712.01815\n\n# 第 24 章：RL 与离散优化\n\n\
  接下来我们将探讨强化学习的新应用领域：离散优化问题，并通过著名的魔方（Rubik’s Cube）进行阐明。\n\n本章的主题：\n\n*   离散优化基础的简要描述\n\
  *   逐步分析一篇由 Stephen McAleer 领导的研究小组于 2018 年发表的论文 *Solving the Rubik’s Cube Without\
  \ Human Knowledge* (arXiv:1805.07470)，该论文探讨了将 RL 方法应用于魔方（魔方是一个优化任务）\n*   由我进行的旨在重现论文中结果的实验，以及未来的改进方向\n\
  \n## 24.1 强化学习的声誉\n\nRL 通常被认为是一种主要用于解决游戏的工具。考虑到该领域的首次成功是 2015 年由 DeepMind 通过 Atari\
  \ 游戏取得的，这似乎并不意外（[`deepmind.com/research/dqn/`](https://deepmind.com/research/dqn/)）。事实证明，Atari\
  \ 基准测试（[`github.com/mgbellemare/Arcade-Learning-Environment`](https://github.com/mgbellemare/Arcade-Learning-Environment)）非常适合\
  \ RL 任务，直到今天，它们仍被许多研究论文用于演示方法的效率。得益于 RL 领域取得的进展，53 款 Atari 游戏越来越不再构成挑战。（根据目前状况，几乎所有游戏都已解决——并取得了超人类的结果。）因此，研究人员正转向更复杂的游戏，例如《星际争霸》或《Dota\
  \ 2》。\n\n对于这种在媒体中盛行的观点，我想在书中提出一些反意见，通过将 Atari 游戏与其他领域的示例进行对比，例如股票交易、聊天机器人、自然语言处理任务、网页自动导航、连续控制任务、棋类游戏或机器人技术。事实上，强化学习极其灵活的\
  \ MDP 模型可以应用于许多其他领域。电脑游戏只是复杂决策过程的一个易于理解且引人注目的例子。\n\n在本章中，我尝试详细描述将 RL 应用于组合优化问题（[`de.wikipedia.org/wiki/Kombinatorische_Optimierung`](https://de.wikipedia.org/wiki/Kombinatorische_Optimierung)）的前述论文（[`arxiv.org/abs/1805.07470`](https://arxiv.org/abs/1805.07470)）中的最新尝试。此外，我将展示我对论文中所描述方法的实现（您可以在目录\
  \ `Chapter24` 中找到），并讨论改进该方法的可能性。为了说明，我将论文中方法的描述与我版本的代码段织在了一起。\n\n首先我们考虑离散优化。离散优化的目标是在有限或离散搜索空间内寻找某个函数的优解。一个经典的例子是魔方（Rubik’s\
  \ Cube）。\n\n## 24.2 离散优化的基础\n\n在离散优化中，我们从有限的可能性集合中寻找最佳元素。与变量可以取任意值的连续优化不同，这里的变量是离散的（例如整数）。\n\
  \n一个常见的问题是背包问题或旅行推销问题。\n\n## 24.3 实现集\n\n在此，我们将考虑解决离散优化的各种算法。\n\n\n\n\n\n*   蛋白质折叠模拟\
  \ ([`de.wikipedia.org/wiki/Proteinfaltung`](https://de.wikipedia.org/wiki/Proteinfaltung)):\
  \ 为蛋白质提供三维结构。\n*   资源分配：如何将有限的资源分配给消费者并获得尽可能好的结果。\n\n这些任务的共同点是状态空间巨大，因此无法尝试所有可能的组合来寻找解决方案。魔方也属于这一类，因为\
  \ `4,33 x 10¹⁹` 巨大的状态空间使得 `Brute-Force`（暴力破解）方法在实践上是不可行的。\n\n## 24.3 最优性与上帝数字\n\n\
  我们寻找的不是任意的方案，而是`最优解`，这使得组合优化变得如此困难。区别是显而易见的：在魔方发明后，人们就已经知道如何达到目标状态。然而，发明者埃尔诺·鲁比（Ernö\
  \ Rubik）花费了一个月才开发出解决自己发明的第一种方法，这可能是一次相当令人沮丧的经历。如今，有许多不同的方法：一种由 Jessica Fridrich\
  \ 开发的初学者方法（这种方法在所谓的“速速魔方玩家”中非常受欢迎），等等。\n\n这些方法的区别在于所需的转动步数。例如，一种特别简单的初学者方法大约需要 100\
  \ 次旋转，期间你需要记住几组 5 到 7 次旋转的序列。相比之下，极速魔方的世界纪录为 4.22 秒。这需要的步数要少得多，但必须记住更长的序列。使用 Fridrich\
  \ 的方法平均需要 55 步，但你必须记住近 120 种不同的序列。\n\n大问题自然是：在给定状态下，解决魔方的最短序列是什么？令人惊讶的是，即使在魔方获得\
  \ 46 年非凡的人气后，人类仍然没有完全回答出这个问题。直到 2010 年，Google 的一个研究小组才证明了要将魔方从`任意状态`复原到初始状态，至少需要\
  \ 20 次旋转。这个数字被称为`上帝数字`。平均而言，最优解甚至更短，因为极少数状态实际上需要 20 步，而其中一个状态（初始状态）完全不需要步数。该证明仅涉及步数数量，无法给出具体的解。如何找到任意状态的最优解，这个问题仍然未未决。\n\
  \n## 24.4 解决方案\n\n在上述论文发表之前，有两种解决魔方的方法：\n\n*   通过`群论`可以显著减小需要检查的状态空间的大小。`Kociemba`\
  \ 算法 ([`en.wikipedia.org/wiki/Kociemba`](https://en.wikipedia.org/wiki/Kociemba))\
  \ 可能是最常用的方法。\n*   通过由`启发式` 补充的 `Brute-Force` 搜索进行搜索。\n\n论文中介绍了第三种方法：通过训练`神经网络`来获得一个`Policy`（策略）。\n\
  \n### 24.4.1 数据表示\n\n首先，我们研究数据表示。在魔方中，我们必须编码两个件事：动作和状态。\n\n### 24.4.2 动作\n\n动作是在某个状态下可以执行的旋转。如前所述，总共有\
  \ 12 种动作。每个面有两个动作，即顺时针旋转（`90°`）或逆时针旋转（`-90°`）。旋转 180° 也是可能的。\n\n动作的名称对应于旋转的面：`left`（左）、`right`（右）、`top`（上）、`bottom`（下）、`front`（前）和\
  \ `back`（后）。使用面的首字母作为标记。右面的顺时针旋转标记为 `R`。标记逆时针旋转有多种表示法。有时使用撇号（`R'`）或小写字母（`r`），有时在字母上方放置波浪号（`~`）。第一和最后的表示法对代码不友好，因此在我的实现中使用小写字母来表示逆时针旋转。\n\
  \n在我的代码中，动作空间通过 Python 的 `enum` 在 `Action` 类中实现（文件（cube33.py）。每个动作分配了一个唯一的整数值。此外，定义了一个反向动作字典：\n\
  \n```python\nclass Action(Enum):\n    R = 0\n    L = 1\n    T = 2\n    D = 3\n \
  \   F = 4\n    B = 5\n    r = 6\n    l = 7\n    t = 8\n    d = 9\n    f = 10\n \
  \   b = 11\n\n_inverse_action = {\n    Action.R: Action.r,\n    Action.r: Action.R,\n\
  \    Action.L: Action.l,\n    Action.l: Action.L,\n    Action.T: Action.t,\n   \
  \ Action.t: Action.T,\n    Action.D: Action.d,\n    Action.d: Action.D,\n    Action.F:\
  \ Action.f,\n    Action.f: Action.F,\n    Action.B: Action.b,\n    Action.b: Action.B\n\
  }\n```\n\n### 24.4.3 状态\n\n状态是魔方彩色区域的一种特定排列方式。状态空间巨大（有 4,33 x 10¹⁹ 不同的状态）。\n\n\n\
  \n\n\n- **避免冗余：** 在极端情况下，我们可以通过记录六面每个面网格的所有颜色来表示魔立方的状态。如果我们只考虑这些组合的数量，结果将是 `6^(6x8)\
  \ = 6⁴⁸ ≈ 2,5 x 10³⁷`，这远远超了状态空间的大小。因此，这种表示方法是高度冗余的。例如，可能会出现魔立方的所有面除了中心网格外都是单色的情况。如果你好奇我是如何得到\
  \ `6^(6x8)` 的，这很简单：共有六面，每个面八个网格（中心格子不计入），因此总共有 48 个可以是六种不同颜色的格子。\n\n- **内存效率：**\
  \ 在训练特别是在应用模型时，我们必须在计算机内存中存储魔立方的许多不同状态，这可能会影响操作速度。因此，表示方法应该尽可能紧凑。\n\n- **变换性能：**\
  \ 我们还必须实现所有适用于某个状态的操作，并且这些操作应该尽可能快地执行。如果表示方法非常节省内存，但在每次转动魔立方的一面时都需要进行耗长的解包过程，那么训练速度就会减慢。\n\
  \n- **适用于神经网络（NN）：** 该表示方法应该适合作为 `NN` 的输入。这不仅适用于本例，也通用于机器学习。例如，在处理自然语言时，通常使用词袋（Bag-of-words）或词嵌入（Word-Embeddings）作为输入；在计算机视觉中，JPEG\
  \ 图像被解码为像素；在随机森林中，则需要对数据特征进行调整，等等。\n\n在工作中，每个状态都通过一个带有 One-hot 编码的 `20x24-Tensor`\
  \ 来表示。为了理解它是如何工作的以及这种格式是如何产生的，我们来看论文中的一张插图（图 24.1）。\n\n![\\[图像\\]](Images/24_01.jpg)\n\
  \n**图 24.1：** 我们必须关注的格子用浅显示。\n\n我们需要关注魔立方中浅显示的格子；深色显示的格子是冗余的，没有考虑考虑。如你所知，魔立方由不同类型的碎片组成，即八个三个颜色的角块、十二个两个颜色的棱块和六个单色的中心块。这可能并不明显，但中心块（决定一面的颜色）实际上根本不需要考虑，因为它们之间的相对位置是不可能改变的——它们只能绕自己的轴旋转。因此，我们只需要对魔立方的空间取向达成一致并保持它。\n\
  \n在我的实现中，例如白色面始终位于顶部，正面是红色，左侧是绿色，以此此类推。因此，该状态是`rotationsinvariant`（旋转不变的的），这意味着魔立方的所有旋转都是同一个状态。\n\
  \n（注：源材料中的剩余文本包含大量重复和没有逻辑意义的不完整句子。我已根据上述结构，结构化并保留了前半部分的逻辑核心信息。）\n\n\n\n\nDie Variable\
  \ `initial_state` speichert den codierten Originalzustand des Würfels, in dem sich\
  \ die Eck- und Kantensteine an ihrer ursprünglichen Position befinden, und die beiden\
  \ Listen zum Speichern der räumlichen Orientierung enthalten Nullen, um das anzuzeigen.\n\
  \nDie Transformation des Würfels ist ziemlich kompliziert und umfasst eine Vielzahl\
  \ von Tabellen zum Speichern der Umordnungen der Steine bei verschiedenen Drehungen.\
  \ Ich werde den Code hier nicht zeigen. Wenn Sie daran interessiert sind, ist die\
  \ Funktion `transform(state, action)` in der Datei `libcube/cubes/cube3x3.py` ein\
  \ guter Ausgangspunkt. Es dürfte auch hilfreich sein, sich die Unit-Tests des Codes\
  \ in der Datei `tests/libcube/cubes/test_cube3x3.py` anzusehen.\n\nNeben den Aktionen\
  \ und der kompakten Repräsentation des Zustands enthält das Modul `cube3x3.py` eine\
  \ Methode `encode_inplace()`, mit der die kompakte Repräsentation (das benannte\
  \ Tupel `State`) in einen Tensor umgewandelt werden kann.\n\nDarüber hinaus wurde\
  \ eine weitere Funktionalität implementiert, die es ermöglicht, durch Anwendung\
  \ der Funktion `render()` die kompakte Repräsentation in eine für Menschen verständlichere\
  \ Form auszugeben. Das ist beim Debuggen einer Transformation äußerst nützlich,\
  \ wird vom Trainingscode aber nicht verwendet.\n\n## 24.5 Trainingsvorgang\n\nNun\
  \ wissen Sie, wie der Zustand des Würfels als 20x24-Tensor codiert ist, und wir\
  \ können uns der Netzarchitektur und dem Training zuwenden.\n\n### 24.5.1 Architektur\
  \ des neuronalen Netzes\n\nAbbildung 24.2 entstammt der genannten Arbeit und zeigt\
  \ die Architektur des Netzes.\n\n![\\[Bild\\]](Images/24_02.jpg)\n\n**Abb. 24.2:**\
  \ Die Architektur des NN transformiert eine Beobachtung (oben) in eine Aktion und\
  \ einen Wert (unten)\n\nAls Eingabe nimmt das Netz die Repräsentation des Zustands\
  \ als 20x24-Tensor entgegen und erzeugt zwei Ausgaben:\n\n*   Die Policy, einen\
  \ Vektor, der 12 Zahlen enthält, die eine Wahrscheinlichkeitsverteilung der Aktionen\
  \ repräsentieren\n*   Den Wert, einen einzelnen Skalar, der die »Güte« des übergebenen\
  \ Zustands schätzt\n\nZwischen Eingabe und Ausgabe besteht das Netz aus mehreren\
  \ vollständig verbundenen Schichten mit ELU-Aktivierungen (*exponential linear unit*).\
  \ Die Architektur meiner Implementierung ist mit derjenigen in der Arbeit identisch.\
  \ Das Modell gehört zum Modul `libcube/model.py`.\n\n```python\nclass Net(nn.Module):\n\
  \    def __init__(self, input_shape, actions_count):\n        super(Net, self).__init__()\n\
  \        self.input_size = int(np.prod(input_shape))\n        self.body = nn.Sequential(\n\
  \            nn.Linear(self.input_size, 4096),\n            nn.ELU(),\n        \
  \    nn.Linear(4096, 2048),\n            nn.ELU()\n        )\n        self.policy\
  \ = nn.Sequential(\n            nn.Linear(2048, 512),\n            nn.ELU(),\n \
  \           nn.Linear(512, actions_count)\n        )\n        self.value = nn.Sequential(\n\
  \            nn.Linear(2048, 512),\n            nn.ELU(),\n            nn.Linear(512,\
  \ 1)\n        )\n\n    def forward(self, batch, value_only=False):\n        x =\
  \ batch.view((-1, self.input_size))\n        body_out = self.body(x)\n        value_out\
  \ = self.value(body_out)\n        if value_only:\n            return value_out\n\
  \        policy_out = self.policy(body_out)\n        return policy_out, value_out\n\
  ```\n\n\n\n\nMCTS ermöglicht einen Mittelweg zwischen diesen beiden Extremen. Wir\
  \ möchten eine Suche durchführen und verfügen über einige Informationen, die Hinweise\
  \ darauf geben, wo wir suchen sollten. Aber diese Informationen können in bestimmten\
  \ Situationen unzuverlässig, verrauscht oder schlicht und einfach falsch sein. Manchmal\
  \ weisen sie allerdings auch in vielversprechende Richtungen und können dazu beitragen,\
  \ den Suchvorgang zu beschleunigen.\n\nWie erwähnt ist MCTS eine Kategorie von Verfahren,\
  \ die sich durch besondere Eigenschaften voneinander unterscheiden. In der Arbeit\
  \ wird eine obere Konfidenzgrenze von 1 verwendet. Das Verfahren nutzt einen Baum,\
  \ bei dem die Knoten Zustände und die Kanten die Aktionen sind, die diese Zustände\
  \ miteinander verbinden. Der vollständige Baum ist in den meisten Fällen gigantisch\
  \ groß (4,33 x 10¹⁹ beim Zauberwürfel), deshalb können wir ihn nicht erzeugen, sondern\
  \ nur einen winzigen Teilbereich erstellen.\n\nAm Anfang verwenden wir einen Baum,\
  \ der aus einem einzigen Knoten besteht, dem aktuellen Zustand. Bei jedem Schritt\
  \ der MCTS steigen wir den Baum hinab und erkunden einen seiner Pfade. Dabei gibt\
  \ es zwei Möglichkeiten:\n\n* Der aktuelle Knoten ist ein Blattknoten (wir haben\
  \ diese Richtung noch nicht erkundet).\n* Der aktuelle Knoten befindet sich inmitten\
  \ des Baums und besitzt Kindknoten.\n\nFalls es sich um einen Blattknoten handelt,\
  \ »erweitern« wir ihn, indem wir alle Aktionen ausführen, die in diesem Zustand\
  \ möglich sind. Dann wird geprüft, ob einer der sich daraus ergebenden Zustände\
  \ der Zielzustand ist. Wenn einer der Zustände dem Originalzustand des Würfels entspricht,\
  \ ist die Suche beendet.\n\nDer Zustand des Blattknotens wird dem Modell übergeben\
  \ und die Ausgaben (`Policy` und `Wert`) werden zwecks späterer Verwendung gespeichert.\n\
  \nHandelt es sich nicht um einen Blattknoten, kennen wir die Kindknoten (erreichbare\
  \ Zustände), und die Ausgaben des Netzes (`Policy` und `Wert`) stehen zur Verfügung.\
  \ Wir müssen jetzt entscheiden, welchem Pfad wir folgen, also welche Aktion vielversprechender\
  \ erscheint. Diese Entscheidung ist nicht trivial, womit wir wieder vor dem Explorations/Exploitations-Dilemma\
  \ stehen, das im Buch schon erörtert wurde. Eigentlich gibt die `Policy` des Netzes\
  \ ja vor, was zu tun ist. Und wenn das falsch ist? Man kann dieses Problem umgehen,\
  \ indem man die erreichbaren Zustände erkundet. Allerdings möchten wir auch nicht\
  \ immer Zustände erkunden, weil der Zustandsraum so riesiggroß ist. Wir müssen also\
  \ ein Gleichgewicht finden, und das hat unmittelbare Auswirkungen auf die Performance\
  \ und das Ergebnis des Suchvorgangs.\n\nUm dieses Problem bei allen Zuständen lösen\
  \ zu können, verwenden wir für alle möglichen Aktionen, von denen es insgesamt zwölf\
  \ gibt, einen Zähler, der jedes Mal erhöht wird, wenn während der Suche eine Aktion\
  \ ausgewählt wurde. Um zu entscheiden, ob eine bestimmte Aktion ausgeführt wird,\
  \ verwenden wir diesen Zähler. Je häufiger eine Aktion ausgeführt wurde, desto unwrscheinlicher\
  \ ist es, dass sie zukünftig abermals ausgewählt wird.\n\nDer vom Modell zurückgegebene\
  \ Wert wird ebenfalls für diese Entscheidungsfindung verwendet. Dieser Wert ist\
  \ das Maximum von aktuelem Zustandswert und den Zustandswerten der Kindknoten. Dies\
  \ ermöglicht es, den (aus Sicht des Modells) vielversprechendsten Pfad in den Elternzuständen\
  \ zu erkennen.\n\nUm das zusammenzufassen: Die auszuführende Aktion in einem Zustand,\
  \ der kein Blattknoten ist, wird anhand der folgenden Formel ausgewählt:\n\n![\\\
  [Bild\\]](Images/24_06.jpg), wobei ![\\[Bild\\]](Images/24_07.jpg) ist.\n\nHier\
  \ gibt ![\\[Bild\\]](Images/24_08.jpg) an, wie oft Aktion `a` im Zustand `s[t]`\
  \ ausgewählt wurde. ![\\[Bild\\]](Images/24_09.jpg) ist die vom Modell für den Zustand\
  \ `s[t]` zurückgegebene `Policy` und ![\\[Bild\\]](Images/24_1.jpg) ist der Maximalwert,\
  \ den das Modell für alle Kindzustände von `s[t]` im Zweig `a` zurückgibt.\n\nDer\
  \ Vorgang wird wiederholt, bis die Lösung gefunden wurde oder die verfügbare Zeit\
  \ abgelaufen ist. Um den Vorgang zu beschleunigen, wird die MCTS meistens nebenläufig\
  \ implementiert, sodass verschiedene Suchen in mehreren Threads ausgeführt werden.\
  \ In diesem Fall könnte man von `A[t]` einen zusätzlichen Verlust subtraieren, um\
  \ zu verhindern, dass mehrere Threads denselben Pfad eines Baums erkunden.\n\nWie\
  \ erhält man die Lösung, wenn die MCTS den Zielzustand gefunden hat? Die Autoren\
  \ der Arbeit haben mit zwei Ansätzen experimentiert:\n\n* **Naiver Ansatz:** Wenn\
  \ der Zielzustand gefunden wurde, verwenden wir den Pfad zum Ausgangszustand als\
  \ Lösung.\n* **Per Breitensuche:** Nach Erreichen des Zielzustands wird eine Breitensuche\
  \ des MCTS-Baums durchgeführt, um den kürzsten Pfad vom Ausgangzustand zum Zielzustand\
  \ zu finden.\n\nDen Autoren zufolge findet das zweite Verfahren kürzere Lösungen\
  \ als der naive Ansatz, was nicht überrascht, da durch den stochischen Charakter\
  \ des Verfahrens Schleifen entstehen können.\n\n\n\n我尝试编写尽可能通用的代码，以简化进一步的实验。例如，魔方的状态和变换的细节被抽象化了，这允许您通过添加一个新模块来实现与\
  \ 3x3 魔方类似的智力游戏。在我的代码中实现了两个魔方：`2 x 2` 和 `3 x 3`，但任何具有一组可预测动作的完全可观测环境都可以轻松地实现并用于实验。细节请参阅下一节。\n\
  \n代码的可读性和易用性优于速度。如果可以在不耗费巨大精力的情况下提高速度，我自然会这样做。例如，通过将打乱魔方的生成与向网络的传递分离开，训练过程可以加速五倍。然而，如果为了提高速度需要重构以适应多个\
  \ GPU 和多线程，我倾向于放弃这样做。一个非常好的例子是蒙特卡洛树搜索（MCTS），它通常使用一个共享树进行并行实现。虽然这可以实现数倍的速度提升，但它需要复杂的进程同步。因此，我的\
  \ `MCTS` 版本是串行的，并且仅包含针对批搜索的微不足道的优化。\n\n## 代码结构\n\n代码由不同的部分组成：\n\n1. 魔方环境，定义了观测空间、可能的动作和状态的精确表示。这部分实现在模块\
