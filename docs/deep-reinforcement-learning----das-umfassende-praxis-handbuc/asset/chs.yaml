  \n**图 15.6：** 10 个游戏时的奖励和步数的变化\n\n如你所见，需要超过三个小时才能达到收敛，但超参数集 `small` 仍然能够提高训练中使用的\
  \ 10 个游戏中的性能。遗憾的是，验证期间的指标仍然不是理想。在训练中期，网络能够在序列中执行一个正确的动作（总共五个动作中的一个），但整体上并没有什么改进。\n\
