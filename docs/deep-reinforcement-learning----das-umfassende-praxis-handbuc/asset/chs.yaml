  \ 100 欧元或更少的制造出一个机器人——取决于具体方案，焊接工作极少甚至完全不需要。本章中的项目是一个小型四足机器人，它的灵感来自上一章的 `Minitaur`\
  \ 平台。\n\n`Minitaur` 并不是模拟器，而是一个由 `Ghost Robotics` 制造的真实机器人。这是一家位于费城的公司，开发用于军事、工业和其他应用的四足机器人。如果你感兴趣，可以查看他们的\
