  \ `solver.py` 的代码中找到。\n\n## 24.9 实验结果\n\n遗憾的是，该工作没有说明该过程中某些非常重要层面的细节，例如训练中使用的超参数、旋转次数以及所实现的收敛性。为了弥补这一空白，我针对不同的超参数值进行了大量实验，但我的结果与论文中发表的结果仍有很大差异。特别是原始方法的收敛性非常不稳定。即使在学习率较小且批次较大的情况下，该方法最终也会发散，损失值会指数级增加。图\
  \ 24.5 显示了这种行为的示例。\n\n在多次实验后，我得出结论：这种行为归因于该方法的错误目标值。实际上，在公式 ![\\[图像\\]](Images/24_03.jpg)\
  \ 中，网络返回的值 `v[s]`(`a*)` 总是加到当前奖励 `R`(s*)` 上，即使在目标状态也是如此。这样，网络实际返回的值几乎可以是任意的：-100、$10⁶$\
  \ 或 3.1415。对于神经网络训练来说，这是一个不利的局面，特别是当以均方误差 (MSE) 作为目标值时。\n\n![\\[图像\\]](Images/24_11.jpg)\n\
  \n**图 24.5：** 论文中提出的方法的两次运行的策略损失（左侧）和值损失（右侧）\n\n为了验证这一点，我修改了目标值的计算方法，将目标状态的值赋值为零：\n\
