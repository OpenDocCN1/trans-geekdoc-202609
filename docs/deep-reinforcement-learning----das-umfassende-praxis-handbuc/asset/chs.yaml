  \ 522 games, reward 18.800, eps 0.01, speed 132.71 f/s\nBest reward updated 18.770\
  \ -> 18.800, saved\n1098741: done 523 games, reward 18.820, eps 0.01, speed 134.58\
  \ f/s\nBest reward updated 18.800 -> 18.820, saved\n1100507: done 524 games, reward\
  \ 18.890, eps 0.01, speed 132.11 f/s\nBest reward updated 18.820 -> 18.890, saved\n\
  1102198: done 525 games, reward 18.920, eps 0.01, speed 133.68 f/s\nBest reward\
  \ updated 18.890 -> 18.920, saved\n1103947: done 526 games, reward 18.920, eps 0.01,\
  \ speed 130.07 f/s\n1105745: done 527 games, reward 18.920, eps 0.01, speed 130.27\
  \ f/s\n1107423: done 528 games, reward 18.960, eps 0.01, speed 130.08 f/s\nBest\
  \ reward updated 18.920 -> 18.960, saved\n1109286: done 529 games, reward 18.940,\
  \ eps 0.01, speed 129.04 f/s\n1111058: done 530 games, reward 18.940, eps 0.01,\
  \ speed 128.59 f/s\n1112836: done 531 games, reward 18.930, eps 0.01, speed 130.84\
  \ f/s\n1114622: done 532 games, reward 18.980, eps 0.01, speed 130.34 f/s\nBest\
  \ reward updated 18.960 -> 18.980, saved\n1116425: done 533 games, reward 18.980,\
  \ eps 0.01, speed 130.34 f/s\n```\n\n上述代码应该是易于理解的：我们创建环境并从传递的文件加载模型权重。`torch.load()`\
  \ 函数的 `map_location` 参数用于指定张量所在的设备（CPU 或 GPU），但如果您将在带有 GPU 的机器上训练的模型移动到没有 GPU 的笔记本电脑，则需要进行此调整。示例没有使用\
  \ GPU，因为即使没有加速，计算也足够快。\n\n```python\nimport gym\nimport time\nimport numpy as np\n\
  import torch\nimport argparse\nfrom collections import defaultdict\n\nENV_NAME =\
  \ \"Pong-v4\"\nFPS = 25\n\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument(\"-m\", required=True, help=\"模型文件\")\n    parser.add_argument(\"\
  -e\", default=ENV_NAME, help=\"环境\")\n    parser.add_argument(\"-r\", help=\"录制\"\
  )\n    parser.add_argument(\"--no-vis\", action='store_false', dest='vis', help=\"\
  禁用可视化\")\n    args = parser.parse_args()\n\n    env = gym.make(args.env)\n    if\
  \ args.record:\n        env = gym.wrappers.Monitor(env, args.record)\n    net =\
  \ dqn.DQN(env.observation_space.shape, env.action_space.n)\n    net.load_state_dict(torch.load(args.m,\
  \ map_location=lambda stg: stg))\n\n    state = env.reset()\n    total_reward =\
  \ 0.0\n    c = defaultdict(int)\n\n    while True:\n        start_ts = time.time()\n\
  \        if args.vis:\n            env.render()\n        state_v = torch.tensor(np.array([state]),\
  \ copy=False))\n        q_vals = net(state_v).data.numpy()[0]\n        action =\
  \ np.argmax(q_vals)\n        c[action] += 1\n        \n        state, reward, done,\
  \ _ = env.step(action)\n        total_reward += reward\n        if done:\n     \
  \       break\n        if args.vis:\n            delta = 1/FPS - (time.time() -\
  \ start_ts)\n            if delta > 0:\n                time.sleep(delta)\nprint(\"\
  总奖励合计: %.2f\" % total_reward)\nprint(\"动作数量 :\", c)\n       if args.record:\n  \
  \         env.env.close()\n```\n\n\n\n\n在下面的 YouTube 播放列表中，您可以找到不同训练阶段的游戏录像：[`www.youtube.com/playlist?list=PLMVwuZENsfJklt4vCltrWq0KV9aEZ3ylu`](https://www.youtube.com/playlist?list=PLMVwuZENsfJklt4vCltrWq0KV9aEZ3ylu)\n\
  \n## 6.5 其他可能性\n\n如果您感到好奇并想亲自对本章的材料进行实验，下文列了一份您可以尝试的简短建议。但请注意：这可能会花费很长时间，并在实验过程中导致一些令人沮丧的时刻。然而，从实用的角度来看，这些实验是真正理解和掌握材料的非常高效的方法。\n\
  \n*   尝试其他 Atari 游戏，例如 Breakout、Atlantis 或 RiverRaid（我童年的最爱）。这可能需要对超参数进行调整。\n* \
  \  除了 FrozenLake 之外，还有一个名为 Taxi 的环境，它模拟了一名出租车司机，负责接乘客并送到目的地。\n*   对 Pong 的超参数进行实验。是否有更快的训练方法？OpenAI\
  \ 声称他们可以使用 A3C 方法（在书的第三部分介绍）在 30 分钟内解决 Pong。也许使用 DQN 也可以。\n*   你能加速 DQN 的训练代码吗？OpenAI\
  \ 的 Baselines 项目使用 TensorFlow 和 GTX 1080 Ti 达到了每秒 350 帧。因此，PyTorch 代码显然还有优化空间。\n\
  *   你能获得一个平均分为 21 的终极 Pong 霸主模型吗？这应该并不。显而易见的是尝试使用学习率下降的方法。\n\n## 6.6 总结\n\n在本章中，您学习了许多新且复杂的材料。您熟悉了在具有巨大观测空间的环境中值迭代（value\
  \ iteration）的局限性，我也解释了如何通过 Q-Learning 克服这些局限性。我们在 FrozenLake 环境中尝试了 Q-Learning 算法，并考虑了神经网络对\
  \ Q 值的近似以及随之而来的问题。\n\n我们处理了各种 DQN 技巧以提高训练稳定性和收敛性，例如回放缓冲区（Replay Buffer）、目标网络以及连续帧的堆叠。最后，我们将这些扩展集成到一个单一的\
  \ DQN 实现中，该实现可以解决 Atari 游戏 Pong。\n\n在下一章中，我们将查看研究人员自 2015 年以来开发的技巧列表，这些技巧旨在提高 DQN\
  \ 的收敛性和质量，这些技巧（结合使用）使得在 54 个 Atari 游戏（又增加了几个）中的大多数游戏中实现了最先进的解决方案。该列表于 2017 年发布，我们将分析并实现所有的技巧。\n\
  \n# 第 7 章：通用 RL 库\n\n在上一章 **Deep Q-Networks* 中，我们实现了由 DeepMind 在 2015 年发布的 DQN（[`deepmind.com/research/publications/playing-atari-deep-reinforcement-learning`](https://deepmind.com/research/publications/playing-atari-deep-reinforcement-learning)）。这项工作对强化学习产生了巨大影响，因为它证明了与普遍观点相反的是，使用非线性近似器是可行的。这一证明引发了人们对\
  \ Q-Learning 领域以及广义深度强化学习的极大兴趣。\n\n在本章中，我们向强化学习的实际应用又迈了一步，研究了通用的 RL 库。这些库允许通过通用组件开发代码，从而让人们能够更多地关注待实现算法的细节。本章特别描述了\
  \ `PyTorch Agent Net` 库，它将在书的后续部分使用以避免代码重复，并对其进行了详细讨论。\n\n涉及以下主题：\n\n*   使用高级别库而非从零开始实现一切的原因\n\
  *   PTAN 库及其核心组成部分，并通过代码示例进行说明\n*   使用 PTAN 库实现 CartPole-DQN\n*   其他可能感兴趣的 RL 库\n\
  \n## 7.1 为什么需要 RL 库？\n\n上一章中实现的简单 DQN 并不长也不复杂——大约 200 行训练代码和另外 120 行环境包装器。当您逐渐熟悉\
  \ RL 算法时，通过自己实现一切对于真正理解其工作原理非常有帮助。然而，当您深入研究时，会发现自己总是在编写相同的代码。\n\n其原因在于 RL 算法的通用性。正如您从\
  \ Text/03.html#HDIB 所知，RL 是非常灵活的，对前提条件的要求很少，因此适用于许多场景。但反复编写相同的代码并不高效，因为每次都可能引入 Bug，这些\
  \ Bug 需要花费时间。此外，精心开发的代码在性能、单元测试和文档方面质量更高。\n\nRL 的实际应用还很新，因此与成熟的领域相比，可选的方法并不多。在 Web\
  \ 开发中，如果您仅限于 Python，就有数百个优秀的库可供选择：Django 用于功能强大的网站；Flask 用于简单的 WSGI 应用以及许多其他大小的库。\n\
  \n强化学习的发展才刚刚开始。尽管如此，已经有一些项目可选，旨在减轻 RL 实践者的工作。此外，您当然也可以开发自己的工具，就像几年前我的那样。这个库名为 PTAN，将在书的后续部分中使用以进行示例。\n\
  \n## 7.2 PTAN 库\n\n该库位于 [`github.com/Shmuma/ptan`](https://github.com/Shmuma/ptan)。后续所有的示例都是使用\
  \ PTAN 版本 0.6 创建，您可以通过以下命令在环境中安装它：\n\n```\npip install ptan==0.6\n```\n\nPTAN 的原始目标是简化我的\
  \ RL 实验。该库试图在两个极端之间寻找折中点：\n\n*   导入库并编写带有大量参数的代码来训练一个提供的算法，例如 DQN（OpenAI 的 Baselines\
  \ 项目是一个很好的例子）\n*   从零开始实现一切这种方法非常缺乏活性。如果您按照预期使用库，它运行良好，但如果您想做一些不寻的事情，您会很快发现自己正在尝试破解库，并与我施加的限制作斗，而不是解决实际问题。\n\
  \n\n\n\nDas zweite Extrem bietet zu viele Freiheiten und macht es erforderlich,\
  \ den Replay Buffer und die Verwaltung des Verlaufs immer wieder neu zu implementieren\
  \ – was fehleranfällig, langweilig und ineffizient ist.\n\nDie PTAN-Bibliothek versucht\
  \ hier einen Kompromiss zu finden, hochwertige Bausteine zur Vereinfachung des RL-Codes\
  \ bereitzustellen und gleichzeitig so flexibel zu sein, dass Ihre Kreativität nicht\
  \ eingeschränkt wird.\n\nPTAN bietet die folgenden grundlegenden Bausteine:\n\n\
  *   `Agent`: Eine Klasse, die einen Batch von Beobachtungen in einen Batch aus ausführrender\
  \ Aktionen umwandeln kann. Sie kann optional einen Zustand speichern, falls Sie\
  \ in einer Episode über aufeinanderfolgende Aktionen Buch möchten. (Wir werden diesen\
  \ Ansatz in Kapitel 17, Stetige Aktionsräume, beim DDPG-Verfahren (Deep Deterministic\
  \ Policy Gradient) implementieren, das einen Ornstein-Uhlenbeck-Prozess für die\
  \ zufällige Exploration verwendet.) Die Bibliothek stellt verschiedene Agenten für\
  \ die gängigsten RL-Cases bereit, Sie können aber auch eine Unterklasse von `BaseAgent`\
  \ schreiben.\n\n*   `ActionSelector`: Ein wenig Programmlogik, die in der Lage ist,\
  \ eine Aktion basierend auf der Netz auszuwählen. Sie wird zusammen mit `Agent`\
  \ verwendet.\n\n*   `ExperienceSource` und Varianten: Eine `Agent`-Instanz und ein\
  \ Gym-Umgebungsobjekt können Informationen über den Verlauf von Episoden liefern.\
  \ Im einfachsten Fall ist dies ein einzelner Überg `a, r, s'`, die Funktionalität\
  \ geht jedoch darüber hinaus.\n\n*   `ExperienceSourceBuffer` und Varianten: Replay\
  \ Buffer mit verschiedenen Eigenschaften. Dazu gehören einfache Replay Buffer und\
  \ zwei Versionen priorierter Replay Buffer.\n\n*   Verschiedene Hilfsklassen, wie\
  \ `TargetNet` und Wrapper für die Vorverarbeitung von Zeitreihen (die dazu verwendet\
  \ werden, in TensorBoard über den Trainingsfortschritt zu führen).\n\n*   Hilfsfunktionen\
  \ von PyTorch Ignite, die PTAN in das Ignite-Framework integrieren.\n\n*   Wrapper\
  \ für Gym-Umgebungen, beispielsweise für Atari-Spiele (die mit einigen Änderungen\
  \ von OpenAI Baselines übernommen wurden).\n\nIm Wesentlichen war es das schon.\
  \ In den folgenden Abschnitten werden wir diese Bausteine eingehender betrachten.\n\
  \n### 7.2.1 Aktionsselektoren\n\nIm PTAN-Jargon bezeichnet ein Aktionsselektor ein\
  \ Objekt, das dabei hilft, konkrete Aktionswerte aus einer Netzaus abzuleiten. Hier\
  \ sind die häufigsten Fälle:\n\n*   `Argmax` wird häufig von Verfahren zur Ermittlung\
  \ des Q-Werts verwendet, wenn das Netz die Q-Werte für eine Reihe von Aktionen vorhersagt\
  \ und die gewünschte Aktion diejenige mit dem größten `Q(s, a)`-Wert ist.\n\n* \
  \  `Policybasi`: Das Netz gibt die Verteilung aus (in Form von Logits oder einer\
  \ normierten Verteilung), anhand der eine Aktion ausgewählt werden muss. Diesen\
  \ Fall haben Sie in Kapitel 4, Das Kreuzentropie-Verfahren bereits gelernt.\n\n\
  Der `Agent` verwendet einen Aktionsselektor, der selten angepasst werden muss (die\
  \ Möglichkeit besteht jedoch). Die Bibliothek stellt die folgenden Klassen bereit:\n\
  \n*   `ArgmaxActionSelector`: Wendet `argmax` auf die zweite Achse eines übergebenen\
  \ Tensors an. (Dabei wird eine Matrix vorausgesetzt, deren Batch-Dimension entlang\
  \ der ersten Achse verläuft.)\n\n*   `ProbabilityActionSelector`: Entnimmt basierend\
  \ auf der Wahrscheinlichkeitsverteilung eine diskrete Menge von Aktionen.\n\n* \
  \  `EpsilonGreedyActionSelector`: Nimmt den Parameter `epsilon` entgegen, der die\
  \ Wahrscheinlichkeit angibt, mit der eine zufällige Aktion gewählt wird.\n\nAlle\
  \ diese Klassen nehmen NumPy-Arrays entgegen. Das vollständige Beispiel finden Sie\
  \ in der Datei `01_actions.py`.\n\n```python\nimport numpy as np\nimport ptan\n\
  q_vals = np.array([[0.1, 0.5, 0.2], [0.4, 0.1, 0.9]])\n# Argmax\nselector = ptan.actions.ArgmaxActionSelector()\n\
  print(selector(q_vals))\n# [1 2]\n\n# EpsilonGreedy\nselector = ptan.actions.EpsilonGreedyActionSelector(epsilon=0.1)\n\
  print(selector(q_vals))\n# [1 2]\n\n# Probability\nselector = ptan.actions.ProbabilityActionSelector()\n\
  print(selector(q_vals))\n# [1 2]\n```\n\n\n\n无论如何，智能体可以被视为能够从观察中导出动作的实体，而如何实现取决于智能体本身。通常，我们对观测和动作的类型不做假设，但智能体的具体实现往往受到更多限制。`PTAN`\
  \ 两种最常用的将观测转换为动作的方法：`DQNAgent` 和 `PolicyAgent`。\n\n在实践中，通常需要自定义智能体。以下是一些原因：\n\n\
  * 神经网络的架构非常复杂——动作空间部分是连续的，部分又是离散的。存在多模态观测（例如文本和像素）或类似的情况。\n* 为了探索，你可能想使用一种不符合标准的策略，例如\
  \ Ornstein-Uhlenbeck 过程（一种在连续控制任务中非常通用的探索方法）。\n* 你正在使用 `POMDP` 环境，智能体的决策并非通过观测唯一定义的，而是通过智能体的内部状态定义的（正如在\
  \ Ornstein-Uhlenbeck 过程中的情况一样）。\n\n通过创建 `BaseAgent` 的子类，可以轻松支持上述情况。在书的剩余部分，将介绍更多此类重新定义的示例。\n\
  \n现在我们来看库提供的标准智能体：`DQNAgent` 和 `PolicyAgent`。完整示例可以在文件 `Chapter07/02_agents.py`\
  \ 中找到。\n\n### DQNAgent\n\n当动作空间不是很大时（例如 Atari 游戏或许多其他经典任务设置），该类适用于 Q-Learning。这种表示并不是通用的，但在书的后面，你将了解到如何处理它。`DQNAgent`\
  \ 接收一组观测（`NumPy-Array` 形式）作为输入，将网络应用于其确定 Q 值，并利用提供的 `ActionsSelector` 将 Q 值转换为动作的索引。\n\
  \n让我们来看一个小小的例子。为了简单起见，我们的网络对于输入批次始终产生相同的输出。\n\n```\nclass DQNNet(nn.Module):\n \
  \   def __init__(self, actions: int):\n        super(DQNNet, self).__init__()\n\
  \        self.actions = actions\n\n    def forward(self, x):\n        return torch.eye(x.size()[0],\
  \ self.actions)\n```\n\n在定义了这个类后，我们可以将其作为 DQN 模型使用：\n\n```\n>>> net = DQNNet(actions=3)\n\
  >>> net(torch.zeros(2, 10))\ntensor([[1., 0., 0.],\n        [0., 1., 0.]])\n```\n\
  \n我们从简单的 Argmax 策略开始。因此，智能体将始终根据网络输出中的 1 返回相应的动作。\n\n```\n>>> selector = ptan.actions.ArgmaxActionSelector()\n\
  >>> agent = ptan.agent.DQNAgent(dqn_model=net, action_selector=selector)\n>>> agent(torch.zeros(2,\
  \ 5))\n(array([0, 1]), [None, None])\n```\n\n输入传递了一个包含两个观测的批次，每个观测包含五个值。智能体返回一个由两个对象组成的元组：\n\
  \n* 对于每个批次，一个包含要执行动作的数组。在这种情况下，批次中第一个对象的动作是 0，第二个对象的动作是 1。\n* 智能体内部状态的列表。它用于带状态的智能体，在这种情况下它包含\
  \ `None` 值。由于我们的智能体是无状态的，我们不需要考虑它。\n\n现在我们创建一个在探索时遵循 Epsilon-Greedy 策略的智能体。为此，我们只需要传递另一个动作选择器：\n\
  \n```\n>>> selector = ptan.actions.EpsilonGreedyActionSelector(epsilon=1.0)\n>>>\
  \ agent = ptan.agent.DQNAgent(dqn_model=net, action_selector=selector)\n>>> agent(torch.zeros(10,\
  \ 5))[0]\narray([2, 0, 0, 0, 1, 2, 1, 2, 2, 1])\n```\n\n由于 `epsilon` 的值为 `1.0`，所有动作都将是随机的——无论网络的输出如何。但我们可以随时更改\
  \ `epsilon`，当我们在训练期间逐渐减小 `epsilon` 的值时，这证明是极其有用的：\n\n```\n>>> selector.epsilon =\
  \ 0.5\n>>> agent(torch.zeros(10, 5))[0]\narray([0, 1, 0, 1, 0, 0, 2, 1, 1, 2])\n\
  >>> selector.epsilon = 0.1\n>>> agent(torch.zeros(10, 5))[0]\narray([0, 1, 2, 0,\
  \ 0, 0, 0, 0, 2, 0])\n```\n\n### PolicyAgent\n\n该类当动作空间不是很大时（例如 Atari 游戏或许多其他经典任务设置）适用于\
  \ Q-Learning。这种表示并不是通用的，但在书的后面，你将了解到如何处理它。`DQNAgent` 接收一组观测（`NumPy-Array` 形式）作为输入，将网络应用于其确定\
  \ Q 值，并利用提供的 `ActionsSelector` 将 Q 值转换为动作的索引。\n\n\n\n\n来自 OpenAI Universe 向量化环境的支持。我们将在\
  \ 第 17 章、`连续动作空间`、Web 自动化以及 MiniWoB 环境的使用中讨论这一点。\n\n`ExperienceSource` 类充当了“黑盒”的角色，将库的用户免受与环境交互以及处理复杂轨迹的困扰。PTAN\
  \ 库的设计哲学是灵活且可扩展的。因此，您可以根据需要创建现有类的子类，或者实现自己的版本。\n\n该系统提供了三个类：\n\n*   `ExperienceSource`：该类使用智能体和环境来生成包含中间所有\
  \ `n` 个步骤的片段轨迹。\n*   `ExperienceSourceFirstLast`：对应 `ExperienceSource` 类，不同之处它不是保留整个片段轨迹（所有步骤），而是只保留第一步和最后一步，同时会正确累积中间的奖励。通过这种方式，在处理\
  \ `N` 步 DQN 或 Advantage-Actor-Critic 算法 (`A2C`) 时，可以节省大量的内存。\n*   `ExperienceSourceRollouts`：这是\
  \ Mnih 关于 Atari 游戏文章中描述的异步 Advantage-Actor-Critic 算法 (`A3C`) 的实现（参见 第 12 章、`Actor-Critic\
  \ 算法`）。\n\n所有类的设计都在确保 CPU 和内存使用上是高效的，虽然在测试任务中这并不十分，但如果您使用 Atari 游戏并且必须在商用硬件的 Replay\
  \ Buffer 中存储千万个示例，这可能会成为一个问题。\n\n### 测试环境\n\n为了演示目的，我们将实现一个非常简单的、包含少量状态的 Gym 环境，以展示\
  \ `ExperienceSource` 类是如何工作的。这些环境的观测是 0 到 4 之间的整数（Integers）。动作也是整数，奖励对应相应的动作。\n\n\
  ```python\nclass ToyEnv(gym.Env):\n    def __init__(self):\n        super(ToyEnv,\
  \ self).__init__()\n        self.observation_space = gym.spaces.Discrete(n=5)\n\
  \        self.action_space = gym.spaces.Discrete(n=3)\n        self.step_index =\
  \ 0\n\n    def reset(self):\n        self.step_index = 0\n        return self.step_index\n\
  \n       def step(self, action):\n           is_done = self.step_index == 10\n \
  \          if is_done:\n               return self.step_index %\n              \
  \        self.observation_space.n,\n                      0.0, is_done, {}\n   \
  \        self.step_index += 1\n           return self.step_index % observation_space.n,\n\
  \                  float(action), self.step_index == 10, {}\n```\n\n除了这个环境，我们使用了一个与观测无关的生成相同动作的智能体。\n\
  \n```python\nclass DullAgent(ptan.agent.BaseAgent):\n    \"\"\"\n    智能体始终返回该动作\n\
  \    \"\"\"\n    def __init__(self, action: int):\n        self.action = action\n\
  \n    def __call__(self, observations: List[Any],\n                 state: Optional[List]\
  \ = None) -> Tuple[List[int], Optional[List]]:\n        return [self.action for\
  \ _ in observations], state\n```\n\n### ExperienceSource 类\n\n第一个类是 `ptan.experience.ExperienceSource`，它生成指定长度的智能体轨迹。实现会自动处理回合的结束（当环境返回\
  \ `is_done=True` 时）并重置环境。构造函数接收多个参数：\n\n*   使用的 Gym 环境。也可以是环境列表。\n*   智能体实例。\n*\
  \   `steps_count=2`：生成轨迹长度。\n*   `vectorized=False`：如果此值设置为 `True`，环境必须是向量化的 Universe\
  \ 环境。参考 第 16 章、`导航`。\n\n类实例提供了 Python 迭代器接口。您可以使用它们来获取轨迹：\n\n```python\n>>> env\
  \ = ToyEnv()\n>>> agent = DullAgent(action=1)\n>>> exp_source = ptan.experience.ExperienceSource(env=env,\n\
  ...                  agent=agent, steps_count=2)\n>>> for idx, exp in enumerate(exp_source):\n\
  ...     if idx > 2:\n...         break\n...     print(exp)\n(Experience(state=0,\
  \ action=1, reward=1.0, done=False),\n Experience(state=1, action=1, reward=1.0,\
  \ done=False))\n(Experience(state=1, action=1, reward=1.0, done=False),\n Experience(state=2,\
  \ action=1, reward=1.0, done=False))\n(Experience(state=2, action=1, reward=1.0,\
  \ done=False),\n Experience(state=3, action=1, reward=1.0, done=False))\n```\n\n\
  在每次迭代中，`ExperienceSource` 返回与环境通信的片段。这看起来可能很简单，但在示例中发生了以下操作：\n\n1. 在环境中调用了 `reset()`\
  \ 以获取初始状态。\n2. 指令智能体选择该状态要执行的动作。\n3. 执行 `step()` 方法获取奖励和后续状态。\n4. 将后续状态传递给智能体以便其选择下一个动作。\n\
  5. 返回从状态到后续状态转换的信息。\n6. 对 `ExperienceSource` 的所有元素重复从步骤 3 开始的操作。\n\n当智能体改变生成动作的方式（例如我们更新权重、减少\
  \ `epsilon` 或更改其他内容）时，会立即影响我们获取的轨迹。\n\n`ExperienceSource` 实例返回的元组包含由构造函数参数 `steps_count`\
  \ 指定数量的元素。在这种情况下，我们请求了两个步骤的轨迹，因此元组长度为 2（在回合结束）。元组中的每个对象都是 `ptan.experience.Experience`\
  \ 类的实例。这是一个包含以下字段的 `namedtuple`：\n\n*   `state`：执行动作前的观测状态\n*   `action`：执行的动作\n\
  *   `reward`：从 `env` 获取的直接奖励\n*   `done`：指示回合是否结束的指标\n\n当回合结束时，片段轨迹将变短，底层环境会自动重置。因此，我们不需要担心。只需继续迭代即可。\n\
  \n```python\n>>> for idx, exp in enumerate(exp_source):\n>>>     if idx > 15:\n\
  >>>         break\n>>>     print(exp)\n(Experience(state=0, action=1, reward=1.0,\
  \ done=False),\n Experience(state=1, action=1, reward=1.0, done=False))\n......\n\
  (Experience(state=3, action=1, reward=1.0, done=False),\n Experience(state=4, action=1,\
  \ reward=1.0, done=True))\n(Experience(state=4, action=1, reward=1.0, done=True),)\n\
  (Experience(state=0, action=1, reward=1.0, done=False),\n Experience(state=1, action=1,\
  \ reward=1.0, done=False))\n......\n(Experience(state=0, action=1, reward=1.0, done=False),\n\
  Experience(state=1, action=1, reward=1.0, done=False))\n```\n\n现在我们可以查询任意长度的轨迹。\n\
  \n```python\n>>> exp_source = ptan.experience.ExperienceSource(env=env,\n...   \
  \               agent=agent, steps_count=4)\n>>> next(iter(exp_source))\n(Experience(state=0,\
  \ action=1, reward=1.0, done=False),\n Experience(state=1, action=1, reward=1.0,\
  \ done=False),\n Experience(state=2, action=1, reward=1.0, done=False),\n Experience(state=3,\
  \ action=1, reward=1.0, done=False))\n```\n\n\n\n\n我们可以将多个 `gym.Env` 实例传递给 `ExperienceSource`，它们将按照所谓的轮询算法（Round-Robin\
  \ method）轮流使用。\n\n```python\n>>> exp_source = ptan.experience.ExperienceSource(\n\
  \                 env=[env, env], agent=agent, steps_count=4)\n>>> for idx, exp\
  \ in enumerate(exp_source):\n...     if idx > 4:\n...         break\n...     print(exp)\n\
  (Experience(state=0, action=1, reward=1.0, done=False),\nExperience(state=1, action=1,\
  \ reward=1.0, done=False))\n(Experience(state=0, action=1, reward=1.0, done=False),\n\
  Experience(state=1, action=1, reward=1.0, done=False))\n(Experience(state=1, action=1,\
  \ reward=1.0, done=False),\nExperience(state=2, action=1, reward=1.0, done=False))\n\
  (Experience(state=1, action=1, reward=1.0, done=False),\nExperience(state=2, action=1,\
  \ reward=1.0, done=False))\n(Experience(state=2, action=1, reward=1.0, done=False),\n\
  Experience(state=3, action=1, reward=1.0, done=False))\n```\n\n### ExperienceSourceFirstLast\n\
  \n`ExperienceSource` 类将指定长度的完整部分轨迹以 `s`、`a`、`r` 对象列表形式提供。后续状态 `s'` 在下一个元组中返回，这并不总是方便的。例如在\
  \ DQN 训练中，我们需要 `s`, `a`, `r`, `s'`T 元组以便在一步内执行 Bellman 近似。此外，还有一些 DQN 扩展（例如 N 步\
  \ DQN），会将较长的观测序列汇总为 `first-state`, `action`, `total-reward-for-n-steps`, `state-after-step-n`\
  \ 元组。\n\n为了支持这种方法，实现了一个简单的 `ExperienceSource` 子类：`ExperienceSourceFirstLast`。它的构造函数接收几乎相同的参数，但返回不同的数据。\n\
  \n```python\n>>> exp_source = ptan.experience.ExperienceSourceFirstLast(\n     \
  \            env, agent, gamma=1.0, steps_count=1)\n>>> for idx, exp in enumerate(exp_source):\n\
  ...     if idx > 10:\n...         break\n...     print(exp)\nExperienceFirstLast(state=0,\
  \ action=1, reward=1.0, last_state=1)\nExperienceFirstLast(state=1, action=1, reward=1.0,\n\
  \                    last_state=2)\nExperienceFirstLast(state=2, action=1, reward=1.0,\n\
  \                    last_state=3)\nExperienceFirstLast(state=3, action=1, reward=1.0,\n\
  \                    last_state=4)\nExperienceFirstLast(state=4, action=1, reward=1.0,\n\
  \                    last_state=0)\nExperienceFirstLast(state=0, action=1, reward=1.0,\n\
  \                    last_state=1)\nExperienceFirstLast(state=1, action=1, reward=1.0,\n\
  \                    last_state=2)\nExperienceFirstLast(state=2, action=1, reward=1.0,\n\
  \                    last_state=3)\nExperienceFirstLast(state=3, action=1, reward=1.0,\n\
  \                    last_state=4)\nExperienceFirstLast(state=4, action=1, reward=1.0,\n\
  \                    last_state=None)\nExperienceFirstLast(state=0, action=1, reward=1.0,\n\
  \                    last_state=1)\nExperienceFirstLast(state=1, action=1, reward=1.0,\n\
  \                    last_state=2)\n```\n\n现在每次迭代都会返回一个单一对象，它仍然是一个包含以下字段的 `namedtuple`：\n\
  \n*   `state`: 我们用于选择动作的状态。\n*   `action`: 在该步中执行的动作。\n*   `reward`: 直到 `step_count`\
  \ 累积的奖励（在此情况下 `step_count=1`，因此它等于即时奖励）。\n*   `last_state`: 我们执行动作后获得的状态。如果回合（episode）结束，该值为\
  \ `None`。\n\n这些数据对于 DQN 训练来说要方便得多，因为我们可以直接对其应用 Bellman 近似。\n\n现在我们来看更多步数的结果。\n\n\
  ```python\n>>> exp_source = ptan.experience.ExperienceSourceFirstLast(\n...    \
  \              env, agent, gamma=1.0, steps_count=2)\n>>> for idx, exp in enumerate(exp_source):\n\
  ...     print(exp)\n...     if idx > 10\n...         break\nExperienceFirstLast(state=0,\
  \ action=1, reward=2.0,\n                    last_state=2)\nExperienceFirstLast(state=1,\
  \ action=1, reward=2.0,\n                    last_state=3)\nExperienceFirstLast(state=2,\
  \ action=1, reward=2.0,\n                    last_state=4)\nExperienceFirstLast(state=3,\
  \ action=1, reward=2.0,\n                    last_state=4)\n```\n\n\n\n\n\n```python\n\
  >>> env = ToyEnv()\n>>> agent = DullAgent(action=1)\n>>> exp_source = ptan.experience.ExperienceSourceFirstLast(\n\
  \                     env, agent, gamma=1.0, steps_count=1)\n>>> buffer = ptan.experience.ExperienceReplayBuffer(\n\
  \                 exp_source, buffer_size=100)\n>>> len(buffer)\n0\n```\n\nAlle\
  \ Replay Buffer bieten die folgende Schnittstelle:\n\n- Einen Python-Iterator, um\
  \ die Beispiele im Buffer zu durchlaufen.\n- Die Methode `populate(N)`, um `N` Beispiele\
  \ aus der `ExperienceSource` zu entnehmen und im Buffer zu speichern.\n- Die Methode\
  \ `sample(N)`, um einen Batch mit `N` Erfahrungswerten zu erhalten.\n\nEine normale\
  \ Trainingsschleife für ein DQN besteht also aus einer endlosen Wiederholung der\
  \ folgenden Schritte:\n\n1. Aufruf von `buffer.populate(1)`, um ein neues Beispiel\
  \ aus der Umgebung zu erhalten.\n2. Zuweisung `batch` = `buffer.sample(BATCH_SIZE)`,\
  \ um einen Batch aus dem Buffer zu entnehmen.\n3. Berechnung des Verlusts für den\
  \ entnommenen Batch.\n4. Backpropagation.\n5. Wiederholung, bis (hoffentlich) Konvergenz\
  \ eintritt.\n\nAlles Weitere geschieht automatisch: Zursetzen der Umgebung, Handhabung\
  \ der Teil-Verläufe sowie die Größe des Buffers und so weiter.\n\n```python\n>>>\
  \ for step in range(6):\n...     buffer.populate(1)\n...     if len(buffer) < 5:\n\
  ...         continue\n...     batch = buffer.sample(4)\n...     print(\"Train time,\
  \ %d batch samples\" % len(batch)\n...     for s in batch:\n...         print(s)\n\
  Train time, 4 batch samples:\nExperienceFirstLast(state=0, action=1, reward=1.0,\n\
  \                    last_state=1)\nExperienceFirstLast(state=3, action=1, reward=1.0,\n\
  \                    last_state=4)\nExperienceFirstLast(state=2, action=1, reward=1.0,\n\
  \                    last_state=3)\nExperienceFirstLast(state=4, action=1, reward=1.0,\n\
  \                    last_state=0)\nTrain time, 4 batch samples:\nExperienceFirstLast(state=3,\
  \ action=1, reward=1.0,\n                    last_state=4)\nExperienceFirstLast(state=2,\
  \ action=1, reward=1.0,\n                    last_state=3)\nExperienceFirstLast(state=0,\
  \ action=1, reward=1.0,\n                    last_state=1)\nExperienceFirstLast(state=3,\
  \ action=1, reward=1.0,\n                   last_state=4)\n```\n\n### 7.2.5 Die\
  \ TargetNet-Klasse\n\n`TargetNet` ist eine kleine, aber sehr nützliche Klasse, die\
  \ es ermöglicht, zwei neuronale Netz gleicher Architektur zu synchronisieren. Der\
  \ Zweck der Synchronisierung wurde im letzten Kapitel beschrieben: die Verbesserung\
  \ der Trainingsstabilität. Die `TargetNet`-Klasse unterstützt zwei Synchronisationsmodi:\n\
  \n- `sync()`: Die Gewichte des Quellnetzes werden in das Zielnetz kopiert.\n- `alpha_sync()`:\
  \ Die Gewichte des Quellnetzes werden mit den Gewichten des Zielnetzes mit einem\
  \ Gewichtungsfaktor `alpha` (ein Wert zwischen 0 und 1) vermischt.\n\nBei Aufgaben\
  \ mit einem diskreten Aktionsraum (wie Atari-Spiele oder der CartPole-Umgebung)\
  \ wird zur Synchronisierung eines Zielnetzes normalerweise der erste Modus verwendet.\
  \ Das haben wir in Kapitel 6, Deep Q-Networks, bereits getan. Der zweite Modus wird\
  \ bei kontinuierlichen Steuerungsaufgaben eingesetzt, die in mehreren Kapiteln des\
  \ vierten Teils des Buchches beschrieben werden. Bei solchen Aufgaben sollte der\
  \ Übergang von einem Netzparameter zu einem anderen stetig erfolgen, deshalb wird\
  \ die gewichtete Vermischung verwendet, die durch die Formel ![\\[Bild\\]](Images/07_01.jpg)\
  \ gegeben ist. Dabei ist `w[i]` der `i`-te Parameter des Zielnetzes und `s[i]` das\
  \ Gewicht des Quellnetzes. Es folgt ein kleines Beispiel für die Verwendung der\
  \ `TargetNet`. Nehmen wir an, es folgendes vor:\n\n```python\nclass DQNNet(nn.Module):\n\
  \    def __init__(self):\n        super(DQNNet, self).__init__()\n        self.ff\
  \ = nn.Linear(5, 3)\n\n    def forward(self, x):\n        return self.ff(x)\n```\n\
  \nDas Zielnetz könnte folgendermaßen erzeugt werden:\n\n```python\n>>> net = DQNNet()\n\
  >>> net\nDQNNet(\n    (ff: Linear(in_features=5, out_features=3, bias=True))\n)\n\
  >>> tgt_net = ptan.TargetNet(net)\n```\n\nDas Zielnetz enthält zwei Felder: `model`,\
  \ eine Referenz auf das ursprüngliche Netz, und `target_model`, eine Kopie davon.\
  \ Die Gewichte der beiden Netze stimmen:\n\n```python\n>>> net.ff.weight\n...\n\
  >>> tgt_net.target_model.ff.weight\n```\n\nSie sind voneinander unabhängig, besitzen\
  \ jedoch die gleiche Architektur:\n\n```python\n>>> net.ff.weight.data += 1.0\n\
  >>> tgt_net.target_model.ff.weight\n```\n\nUm sie wieder zu synchronisieren, kann\
  \ die `sync()`-Methode verwendet werden:\n\n```python\n>>> tgt_net.sync()\n>>> net.ff.weight\n\
  ...\n>>> tgt_net.target_model.ff.weight\n```\n\n### 7.2.6 Hilfsfunktionen für Ignite\n\
  \nPyTorch Ignite wurde in Kapitel 3, Deep Learning mit PyTorch, bereits kurz erwähnt.\
  \ Es wird im verbleibenden Teil des Buches verwendet, um den Umfang des Codes der\
  \ Trainingsschleife zu verringern. Die PTAN-Bibliothek stellt eine Reihe kleiner\
  \ Hilfsfunktionen bereit, die es vereinfachen, Ignite zu verwenden. Sie sind Teil\
  \ des Pakets `ptan.ignite`:\n\n- `EndOfHandler`: Diese Funktion ist mit der `ignite.Engine`\
  \ verknüpft, löst ein `EPISODE_COMPLETED`-Event aus und führt Buch über die Belohnung\
  \ und die Anzahl der Schritte. Zudem kann sie ein Event auslösen, wenn die durchschnittliche\
  \ Belohnung der letzten Episoden eine vorgegebene Grenze erreicht. Das ist dazu\
  \ gedacht, das Training abzbrechen zu können, wenn eine bestimmte vorher festgelegte\
  \ Belohnung erzielt wird.\n- `EpisodeFPSHandler`: Führt Buch über die Anzahl der\
  \ Interaktionen von Agent und Umgebung und berechnet eine Leistungskennzahl in Form\
  \ von Frames pro Sekunde. Darüber hinaus ist hier die Anzahl der Sekunden gespeichert,\
  \ seit seit Anfang des Trainings vergangen sind.\n- `PeriodicEvents`: Löst nach\
  \ jeweils 10, 100 oder 1.000 Trainingsiterationen entsprechende Events aus.\n\n\
  Ausführliche Erläuterungen, wie diese Klassen verwendet werden, finden Sie im nächsten\
  \ Kapitel.\n\n## 7.3 Lösung der CartPole-Umgebung mit PTAN\n\nWir verwenden jetzt\
  \ die PTAN-Klassen (noch ohne Ignite) und versuchen, alles miteinander zu kombinieren,\
  \ um die erste Umgebung zu lösen.\n\n\n\n\n```python\nnet = Net(obs_size, HIDDEN_SIZE,\
  \ n_actions)\ntgt_net = ptan.agent.TargetNet(net)\nselector = ptan.actions.ArgmaxActionSelector()\n\
  selector = ptan.actions.EpsilonGreedyActionSelector(\n    epsilon=1, selector=selector)\n\
  agent = ptan.agent.DQNAgent(net, selector)\nexp_source = ptan.experience.ExperienceSourceFirstLast(\n\
  \    env, agent, gamma=GAMMA)\nbuffer = ptan.experience.ExperienceReplayBuffer(\n\
  \    exp_source, buffer_size=REPLAY_SIZE)\n```\n\n首先，我们创建神经网络（即之前在 CartPole 环境中使用的双层简单前馈网络），并使用\
  \ `EpsilonGreedyActionSelector` 和 `DQNNet`。然后创建经验源和回放缓冲区（Replay Buffer）。通过这几行代码，我们的数据流水线就构建完成了。现在我们只需要调用\
  \ `populate(1)` 并从缓冲区中提取训练批次（Batches）：\n\n```python\nwhile True:\n    step += 1\n\
  \    buffer.populate(1)\n\n    for reward, steps in exp_source.pop_rewards_steps():\n\
  \        episode += 1\n        print(\"%d: episode %d done, reward=%.3f,\n     \
  \       epsilon=%.2f\" % (step, episode, reward,\n            selector.epsilon))\n\
  \        solved = reward > 150\n    if solved:\n        print(\"Hurra!\")\n    \
  \        break\n\n    if len(buffer) < 2*BATCH_SIZE:\n        continue\n    batch\
  \ = buffer.sample(BATCH_SIZE)\n```\n\n在训练循环的每次迭代开始时，我们指示缓冲区从经验源中提取样本，然后检查回合（Episode）是否结束。`ExperienceSource`\
  \ 类中的 `pop_rewards_steps()` 方法返回一个元组列表，包含自上次调用该方法以来已结束回合的信息。\n\n```python\nstates_v,\
  \ actions_v, tgt_q_v = unpack_batch(\n    batch, tgt_net.target_model, GAMMA)\n\
  optimizer.zero_grad()\nq_v = net(states_v)\nq_v = q_v.gather(1, actions_v.unsqueeze(-1)).squeeze(-1)\n\
  loss_v = F.mse_loss(q_v, tgt_q_v)\nloss_v.backward()\noptimizer.step()\nselector.epsilon\
  \ *= EPS_DECAY\n\nif step % TGT_NET_SYNC == 0:\n    tgt_net.sync()\n```\n\n同样在训练循环中，我们将一组\
  \ `ExperienceSourceFirstLast` 对象转换为适用于 DQN 训练的张量，计算损失并执行反向传播。最后，我们减小动作选择器中的 `epsilon`（在所选超参数下，`epsilon`\
  \ 会在 500 次训练步后达到 0），并指示目标网络每隔 10 次训练迭代同步一次。\n\n当代码执行时，它应该在 1,000 到 2,000 次训练迭代后收敛：\n\
  \n```bash\n$ python 06_cartpole.py\n18: episode 1 done, reward=17.000, steps=17,\
  \ epsilon=1.00\n33: episode 2 done, reward=15.000, steps=15, epsilon=0.99\n58: episode\
  \ 3 done, reward=25.000, steps=25, epsilon=0.77\n100: episode 4 done, reward=42.000,\
  \ steps=42, epsilon=0.50\n116: episode 5 done, reward=16.000, steps=16, epsilon=0.43\n\
  129: episode 6 done, reward=13.000, steps=13, epsilon=0.38\n140: episode 7 done,\
  \ reward=11.000, steps=11, epsilon=0.34\n152: episode 8 done, reward=12.000, steps=12,\
  \ epsilon=0.34\n```\n\n\n\n\n- **竞争性 DQN (Rivalisierende DQN):** 如何通过确保网络架构更准确表示要解决的任务来提高收敛速度\n\
  - **类别 DQN (Kategoriale DQN):** 如何 nicht nur den einzelnen 动作值, sondern die 整个分布\
  \ verwenden\n\n## 8.1 Simple DQN\n\nZunächst sollten wir die gleichen DQN-方法 wie\
  \ in 第 6 章, Deep Q-Networks verwenden, aber gleichzeitig die in 第 7 章, 通用 RL 库 beschriebenen\
  \ 高级库 nutzen. Dadurch wird der Code kompakter, was vorteilhaft ist, da uns irrelevante\
  \ Details nicht von der Logik des Verfahrens ablenken.\n\nZiel dieses Buches ist\
  \ es nicht zu zeigen, wie man vorhandene Library verwendet, sondern ein Gefühl für\
  \ RL-算法 zu entwickeln und bei Bedarf alles von Grund auf selbst zu implementieren.\
  \ Meiner Meinung nach ist dies eine viel nützlichere Fähigkeit, da Bibliotheken\
  \ kommen und gehen, ein gründliches Verständnis des Fachgebiets jedoch es Ihnen\
  \ ermöglichen wird, den Zweck des Codes anderer Programmierer schnell zu begreifen\
  \ und ihn sinnvoll anzuwenden.\n\nBei der einfachen DQN 实现 gibt es drei Module:\n\
  \n- `Chapter08/lib/dqn_model.py`: Das neuron Netz des DQN, das Sie aus 第 6 章 kennen\n\
  - `Chapter08/lib/common.py`: gängige Funktionen, die vom Code in diesem Kapitel\
  \ verwendet werden\n- `Chapter08/01_dqn_basic.py`: 60 Zeilen Code, die auf die Bibliotheken\
  \ `PTAN` und `Ignite` zurückgreifen, um das einfache DQN zu implementieren\n\n###\
