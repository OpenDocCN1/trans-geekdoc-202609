  \n## 25.6 均力竞争者的对决\n\n在本章的最后一个示例中，使用了一种用于控制两个同类智能体组战斗的策略。该版本实现在 `Chapter25/battle_dqn.py`\
  \ 文件中。代码并不复杂，因此在此不再列出。\n\n我只对代码进行了少量实验。因此，超参数还有改进空间。此外，你也可以对训练过程进行实验。在代码中，两组都由我们优化的同一个策略控制，这可能不是最好的方法。相反，你可以尝试类似于\
  \ AlphaGo Zero 的训练风格，即将目前最好的策略应用于一组，将当前正在优化的策略应用于另一组。如果到为止最好的策略最终持续输掉，它就会被更新。在这种情况下，优化的策略可能有足够的时间学习迄为止最好策略的所有技巧和弱点，这可能是一个改进循环的开始。\n\
  \n在我的实验中，训练过程并不非常稳定，但取得了进展。下面是我获得的一些策略记录的链接。如果你想观看两个保存模型的对决，可以使用 `Chapter25/battle_play.py`\
  \ 程序。\n\n*   得分 0.9 的模型：[`youtu.be/sWxJMe7Y`](https://youtu.be/sWxJMe7Y)\n*   得分\
  \ 0.8 的模型：[`youtu.be/LArNod1Q`](https://youtu.be/LArNod1Q)\n*   得分 0.6 的模型：[`youtu.be/LLndyGU`](https://youtu.be/LLndyGU)\n\
  \n## 25.7 总结\n\n在本章中，我们对 MARL（多智能体强化学习）进行了初步接触。有很多环境可以尝试。恭喜你读到了书本书的最后部分！我希望它对你有帮助，并且阅读过程带给你许多乐趣。该领域发展迅速，但掌握了基础知识后，跟上新的开发和研究将变得容易得多。\n\
  \n有很多有趣的话题我没能探讨，例如部分可观测 MDP（其环境不满足马尔可夫性），或者探索方面的最新方法，例如基于计数的方法。在多智能体领域，有很多活动涉及多个智能体学习协作以解决共同问题。\n\
  \n我们也没有提到基于记忆的强化学习（Memory-Based RL）方法，这类方法允许智能体通过记忆来保存知识和经验。\n"
