  \ 2x2 骰子\n\n作者在文中报告了使用三块 Titan Xp 类型 GPU 进行耗时 44 小时的训练。在训练期间，模型处理了 80 亿个骰子状态。这些数字对应于每秒\
  \ 50,000 个状态的训练速度。我的实现在单个 GTX 1080 Ti 上达到了每秒 15,000 个状态，这完全具有可比性。因此，要在单个 GPU 上重复整个训练过程几乎需要六天。这对于实验和超参数调优来说几乎是不可行的。\n\
