  \ Gym\n\n## 2.1 Aufbau des Agenten\n\nIm letzten Kapitel haben Sie erfahren, dass\
  \ die Welt aus Sicht des RL aus Folgendem besteht:\n\n*   **Agent:** Der Agent nimmt\
  \ eine aktive Rolle ein. Dabei kann es sich um eine Person oder um ein Objekt handeln.\
  \ In der Praxis ist der Agent eine Software, die eine Policy implementiert. Diese\
  \ Policy entscheidet darüber, welche Aktionen in Anbetracht der vorliegenden Beobachtungen\
  \ bei jedem Zeitschritt durchgeführt werden.\n*   **Umgebung:** Ein Modell der Welt,\
  \ das außerhalb des Agenten liegt und dafür verantwortlich ist, uns Beobachtungen\
  \ bereitzustellen und Rewards zu gewren. Der Zustand der Umgebung ändert sich aufgrund\
  \ der Aktionen des Agenten.\n\nSehen wir uns an, wie Agent und Umgebung für eine\
  \ besonders einfache Situation in Python implementiert werden können. Wir werden\
  \ eine Umgebung definieren, die dem Agenten unabhängig von seinen Aktionen für eine\
  \ begrenzte Anzahl von Schritten zufällige Belohnungen gewährt.\n\n\n\n\n```python\n\
  class Environment:\n    def __init__(self):\n        self.steps_left = 10\n```\n\
  \n上述代码允许环境初始化其内部状态。在这种情况下，该状态是一个简单的计数器，限制了智能体（Agent）与环境交互的时间步数。\n\n```python\ndef\
  \ get_observation(self) -> List[float]:\n    return [0.0, 0.0, 0.0]\n```\n\n`get_observation()`\
  \ 方法为智能体提供环境的当前观测值。它通常实现为环境内部状态的一个函数。如果你好奇 `-> List[float]` 是什么意思：它是 Python 3.5\
  \ 引入的类型签名的一个示例。你可以在 [`docs.python.org/3/library/typing.html`](https://docs.python.org/3/library/typing.html)\
  \ 文档中查阅。在我们的示例中，观测向量始终为零，因为环境没有内部状态。\n\n```python\ndef get_actions(self) -> List[int]:\n\
  \    return [0, 1]\n```\n\n`get_actions()` 方法允许智能体查询可执行的操作。可执行操作的集合通常不会随着时间而改变，但在特定状态下某些操作是不可能的（例如在井棋游戏中，并不是所有的移动都是允许的）。在我们简单的示例中，智能体可以执行两个操作，它们被编码为二进制值\
  \ `0` 和 `1`。\n\n```python\ndef is_done(self) -> bool:\n    return self.steps_left\
  \ == 0\n```\n\n该方法向智能体信号回合（Episode）的结束。正如你在第 1 章,什么是强化学习？所示，智能体与环境的交互由一系列步骤组成，被称为回合。回合可以是有限的，如象棋游戏；也可以是无限的，如旅行者\
  \ 2 号探测器的任务（该任务始于 40 多年前；如今探测器已经离开了我们的太阳系）。为了考虑这两种情况，环境为我们提供了一种方法来判断回合何时结束以及何时无法进一步通信。\n\
  \n```python\ndef action(self, action: int) -> float:\n    if self.is_done():\n \
  \       raise Exception(\"Spiel beendet\")\n    self.steps_left -= 1\n    return\
  \ random.random()\n```\n\n`action()` 方法是环境功能的核心。它承担两个任务：处理智能体的操作并返回该操作的奖励。在我们的示例中，奖励是随机的，并且放弃了特定的操作。此外，我们更新了步数并在回合结束时停止。\n\
  \n负责智能体的部分要简单得多，只包含两个方法：构造函数和一个在环境中执行一步的方法：\n\n```python\nclass Agent:\n    def\
  \ __init__(self):\n        self.total_reward = 0.0\n```\n\n在构造函数中，我们初始化了计数器，用于记录智能体在整个回合中积累的奖励。\n\
  \n```python\ndef step(self, env: Environment):\n    current_obs = env.get_observation()\n\
  \    actions = env.get_actions()\n    reward = env.action(random.choice(actions))\n\
  \    self.total_reward += reward\n```\n\n`step` 函数接收环境实例作为参数，允许智能体执行以下操作：\n\n* \
  \  观测环境\n*   根据观测值选择操作\n*   将操作传递给环境\n*   查询当前步的奖励\n\n在我们示例中，智能体是盲目的，在决策过程中忽略了观测值。相反地，操作是随机选择的。现在只缺少创建这两个类并执行一个回合的代码。\n\
  \n```python\nif __name__ == \"__main__\":\n    env = Environment()\n    agent =\
  \ Agent()\n\n    while not env.is_done():\n        agent.step(env)\n\n    print(\"\
  Belohnung insgesamt: %.4f\" % agent.total_reward)\n```\n\n你可以从 [`github.com/PacktPublishing/Deep-Reinforcement-Learning-Hands-On-Second-Edition`](https://github.com/PacktPublishing/Deep-Reinforcement-Learning-Hands-On-Second-Edition)\
  \ 下载代码（文件 `Chapter02/01_agent_anatomy.py`）。它没有外部依赖，应该可以在任何较新的 Python 版本上运行。如果你多次运行该代码，你将看到智能体收集的奖励显示不同的值。\n\
  \n代码的简单性使得我们能够说明 RL 模型所带来的一些重要基础概念。环境可以是一个极其复杂的物理模型，而智能体可以是一个实现最新 RL 算法的大型神经网络。处理过程始终遵循相同的模式：在每一步，智能体从环境接收观测值，进行计算并选择要执行的操作。该操作的结果是奖励和新的观测值。\n\
  \n\n\n\n本书的很大一部分（第二部分、第三部分 和 第四部分）集中于过去几年开发的深度强化学习（Deep Reinforcement Learning）现代方法。在此背景下，“深度”（Deep）一词意味着广泛地使用了深度学习（DL），你可能已经知道\
  \ DL 方法是非常消耗资源的。现代 GPU 的速度可以比最强大的多核处理器系统快 10 到 100 倍。在实践中，这意味着在 GPU 上运行需要一小时的相同代码，在最快的\
  \ CPU 系统上也需要运行半天甚至一周。这并不意味着你无法在没有 GPU 系统的情况下尝试书中的示例，只是耗时会更长。如果你想亲自对代码进行实验（这是学习的学习方法），那么拥有一台带有\
  \ GPU 的机器会更好。这里有两种可能：\n\n*   购买一个适用于 `CUDA` 的现代 GPU\n*   使用云服务：Amazon AWS 和 Google\
  \ Cloud 提供此类 GPU 使用服务。\n*   Google Colab 为 Jupyter Notebook 提供免费的 GPU 访问。\n\n关于此类系统的搭建描述超出了本书的范围，但互联网上有许多教程。作为操作系统，您应该使用\
  \ Linux 或 macOS。虽然 PyTorch 和 Gym 支持 Windows，但书中的示例在 Windows 下没有经过完全测试。\n\n为了向您提供书中使用的外部依赖的精确版本，下面列出了\
  \ `pip freeze` 命令的输出。如果书中的示例无法运行，这在排错时可能非常有用，因为开源软件和 DL 工具包的发展速度极快。\n\n```\natari-py==0.2.6\n\
  gym==0.15.3\nnumpy==1.17.2\nopencv-python==4.1.1.26\ntensorboard==2.0.1\ntorch==1.3.0\n\
  torchvision==0.4.1\npytorch-ignite==0.2.1\ntensorboardX==1.9\ntensorflow==2.0.0\n\
  ptan==0.6\n```\n\n书中的所有示例都是用 PyTorch 1.3 编写并测试的，可以通过遵循网站 [`pytorch.org`](http://pytorch.org)\
  \ 上的指南进行安装。通常只需要执行命令\n\n```\nconda install pytorch torchvision -c pytorch\n```\n\
  \n现在我们来看 OpenAI-Gym-API 的细节，它提供了许多从简单到具有挑战性的环境。\n\n## 2.3 OpenAI-Gym-API\n\n`Gym`\
  \ Python 库由 OpenAI ([www.openai.com](http://www.openai.com)) 开发并维护。Gym 的主要目标是提供一组具有统一接口的各种环境用于\
  \ RL 实验。因此，该库的核心类是一个名为 `Env`（源自英语 *environment*）的环境，并不意外。该类的实例提供了各种方法和字段，提供了有关环境能力所需的信息。总来说，每个环境提供以下信息和功能：\n\
  \n*   在环境中可以执行的动作集。Gym 支持离散动作、连续动作以及两者的结合。\n*   环境提供智能体的观测值格式和特征。\n*   一个名为 `step`\
  \ 的方法用于执行动作。它返回当前的观测值和奖励，以及一个表示回合（Episode）结束的标志。\n*   一个名为 `reset` 的方法，将环境重置为初始状态。它返回第一个观测值。\n\
  \n让我们更仔细地观察这些环境的组成部分。\n\n### 2.3.1 动作空间\n\n智能体可以执行的动作可以是离散的、连续的或两者结合。离散动作是智能体可以执行固定行为，例如在网格中改变方向（左、右、上、下）。另一个例子是按钮，可以按下也可以不按下。这两种状态是互斥的，因为离散动作空间的一个特征属性是动作空间中只能执行一个动作。\n\
  \n连续动作被分配了一个值，例如，可以给方向盘分配一个旋转的角度，或者给油门板分配一个踩踏的特定力度。连续动作的描述包含了这些值在执行动作时可以采取的边界。例如，对于方向盘，取值范围可能是\
  \ -720 到 720 度。对于油门板，值通常在 0 到 1 之间。\n\n但我们并不局限于单个可执行动作，一个环境可以拥有许多不同的动作，例如同时按下多个按钮，或同时控制方向盘并踩踏踏板。为了支持这些情况，Gym\
  \ 定义了一个特殊的容器类，允许将多个动作整合到一个统一动作中。\n\n### 2.3.2 观测空间\n\n观测值是环境在每个时间步为智能体提供的奖励之外的信息。观测值可以非常简单，例如一组数字，也可以非常复杂，例如包含摄像头图像的多维张量。观测也可以是离散的，类似于动作空间。离散观测空间的一个例子是灯泡，它可以处于两种状态：开或关。状态以布尔值提供。\n\
  \n在这里可以看到动作与观测及其在 Gym 类中表示的相似性。请查看图 2.1 中的类图 (#02.xhtml#i140523)。\n\n图像](Images/02_01.jpg)\n\
  \n**图 2.1:** Gym 中 `Space` 类的层次结构\n\n抽象类 `Space` 包含了两个对我们重要的方法：\n\n*   `sample()`：返回一个随机选择的示例\n\
  *   `contains(x)`：检查参数 `x` 是否属于 `Space`\n\n这两个方法都是抽象的，并在 `Space` 的子类中重新实现：\n\n*\
  \   `Discrete` 类表示一组互斥的对象，从 0 到 n-1 编号。它唯一的字段 *n* 是其描述的对象的计数器。`Discrete(n=4)` 可以用于具有四个移动方向\
  \ `[left,` `right,` `up,` `down]` 的动作空间。\n\n\n\n\n\n*   `Box` 类表示一个来自区间 `[low, high]`\
  \ 的有理数 n 维张量。例如，一个在 0.0 到 1.0 之间只有一个值的油门，可以被编码为 `Box(low=0.0, high=1.0, shape=(1,),\
  \ dtype=np.float32)`。（`shape` 参数被分配了一个长度为 1 且值为 1 的元组，这产生了一个包含单个值的一维张量）。`dtype`\
  \ 参数规定了数值类型，这里我们指定为 NumPy `32-bit` `float`。`Box` 的另一个例子可以是对 Atari 屏幕的观测（稍后我们将考虑许多其他\
  \ Atari 环境），一个大小为 210 × 160 的 RGB 图像：`Box(low=0, high=255, shape=(210, 160, 3),\
  \ dtype=np.uint8)`。在这种情况下，`shape` 参数是一个三个元素的元组：前两个维度是图像的高度和宽度，第三个维度是 3，对应红、绿、蓝三个颜色平面。因此，每次观测都是一个包含\
  \ 100,800 字节的 3D 张量。\n\n*   `Space` 的最后一个子类是 `Tuple` 类，它允许我们将多个 `Space` 类实例组合在一起。这允许我们创建任意复杂度的动作和观测空间。例如，假设我们想为汽车创建一个动作空间。汽车有不同的控制，其值在每个时间步都可能变化：方向盘的角度以及刹车和油门的位置。这三个控制的值可以通过单个\
  \ `Box` 实例中的三个浮点数给出。此外，汽车具有离散控制，例如转向灯（可能值为“关闭”、“右”、“左”）、喇叭（“开启”或“关闭”）等。为了将所有这些内容组合在一个类中来描述动作空间，可以使用\
  \ `Tuple(spaces=(Box(low=-1.0, high=1.0, shape=(3,), dtype=np.float32), Discrete(n=3),\
  \ Discrete(n=2)))`。这种灵活性很少需要，在书中例如只出现了 `Box` 和 `Discrete` 动作与观测空间，但在某些情况下，`Tuple`\
  \ 类被证明是有用的。\n\n在 Gym 中定义了更多的 `Space` 子类，但上述三个是我们将要用的部分。所有子类都实现了 `sample()` 和 `contains()`\
  \ 方法。`sample()` 函数根据 `Space` 类和给定参数提供一个随机样本。这在我们需要选择随机动作时对动作空间尤为有用。`contains()`\
  \ 方法检查传递的参数是否符合 `Space` 参数，它被 Gym 内部用于用于检查智能体动作的合理性。例如，`Discrete.sample()` 提供允许值范围内的随机元素，而\
  \ `Box.sample()` 则产生一个具有正确维度和在允许范围内的值的随机张量。\n\n每个环境都拥有两个 `Space` 类型的成员变量，分别名为 `action_space`\
  \ 和 `observation_space`。这使得编写可以在任何环境中运行的通用代码成为可能。处理屏幕上的像素与处理离散观测完全是两回事（因为在一种情况下，可能需要对图像进行预处理，例如通过卷积层或其他计算机视觉工具）。在大多数情况下，我们会针对特定的环境或一组环境优化我们的代码，但\
  \ Gym 并未阻止编写通用代码。\n\n### 2.3.3 环境\n\n环境在 Gym 中通过 `Env` 类表示，该类拥有以下成员变量：\n\n*   `action_space`：这是\
  \ `Space` 类的一个字段，提供了环境中允许的所有动作的规范。\n*   `observation_space`：这是 `Space` 类的一个字段，指定了环境提供的所有观测。\n\
  *   `reset()`：将环境置为初始状态并返回第一个观测向量。\n*   `step()`：此方法允许智能体指定动作，并返回关于动作结果的信息：下一个观测、局部奖励和回合结束标志（done）。这个方法有点复杂，我稍后会在本节中详细介绍它。\n\
  \n`Env` 类包含其他辅助方法，例如 `render()`，它允许将观测转换为人类可读的格式，但我们不会使用它。完整列表可以在 Gym 文档中找到，但我们现在关注基础的\
  \ `Env` 方法 `reset()` 和 `step()`。\n\n到为止，你已经看到了环境的通信是如何进行的。现在是时候熟悉环境了。由于它简单得多，我们首先考虑\
  \ `reset()` 方法。它不需要参数，并指示环境回到其初始状态。它返回的值是第一次观测。智能体的通信可能会结束（例如“游戏结束”屏幕）。这样的会话被称为一个回合（Episode），在回合结束后，智能体必须从头开始。\n\
  \n`step()` 方法是环境功能的核心。它在每次调用时同时完成以下任务：\n\n1. 它通知环境下一步将执行哪个动作。\n2. 它在执行动作后获取新的观测。\n\
  3. 它获取在该步骤中获得的奖励。\n4. 它查询回合是否已结束。\n\n要执行的动作作为唯一参数传递给该方法，其余信息由 `step()` 方法返回。准确来说，这是一个元组（Python\
  \ 元组，不是我在上一节讨论的 `Tuple` 类），拥有四个元素（`observation`, `reward`, `done` 和 `info`）。它们具有以下属性：\n\
  \n*   `observation`：包含带有观测数据的 NumPy 向量或矩阵\n*   `reward`：包含作为 `float` 值的奖励\n*   `done`：一个布尔值，如果回合结束则为\
  \ `True`\n*   `info`：这是取决于特定环境的额外信息。在通用的强化学习方法中，通常可以忽略此值。\n\n现在你可能对环境如何在代码中被智能体使用有了大致的了解：在一个循环中，带有待执行的动作调用\
  \ `step()` 方法，直到 `done` 标志的值变为 `True`。随后，我们可以调用 `reset()` 重新从开始。现在唯一的问题是，我们到底如何创建\
  \ `Env` 对象。\n\n\n\n\n每个环境都有一个唯一的名称 `EnvironmentName-vN`，其中 `N` 是一个数字，用于区分环境的不同版本（例如，当修复了环境中的错误或发生了其他重大更改时）。为了创建环境，Gym\
  \ 软件包提供了 `make(env_name)` 函数，其唯一参数是以字符串形式表示的环境名称。\n\nGym 0.13.1 版本包含 859 个具有不同名称的环境，但这些并不全是不同的环境，因为该列表包含了特定环境的所有版本。此外，某个环境在设置和不同的观测空间上可能存在差异。例如，对于\
  \ Atari 游戏 Breakout，有以下名称的环境：\n\n* `Breakout-v0`, `Breakout-v4`：Breakout 的原始版本，具有随机的球初始位置和运动方向。\n\
  * `BreakoutDeterministic-v0`, `BreakoutDeterministic-v4`：具有相同球初始位置和相同球速度向量的 Breakout。\n\
  * `BreakoutNoFrameskip-v0`, `BreakoutNoFrameskip-v4`：向智能体显示所有帧（Frames）的 Breakout。\n\
  * `Breakout-ram-v0`, `Breakout-ram-v4`：Breakout 的观测不是屏幕像素，而是包含 Atari 模拟器的整个内存（128\
  \ 字节）。\n* `Breakout-ramDeterministic-v0`, `Breakout-ramDeterministic-v4`\n* `Breakout-ramNoFrameskip-v0`,\
  \ `Breakout-ramNoFrameskip-v4`\n\n总计有 12 个经典的老牌 Breakout 环境。如果你不熟悉这个游戏：图 2.2 显示了一个游戏场景。\n\
  \n![\\[图像\\]](Images/02_02.jpg)\n\n**图 2.2：** Breakout 的游戏场\n\n即使不计算这些重复项，Gym 0.13.1\
  \ 也提供了令人印象的 154 个不同环境，它们可以分为不同的组：\n\n* **经典控制任务：** 这些任务在最优控制理论和关于 RL 的专业论文中被用作基准或演示。它们通常很简单，观测空间和动作空间是低维的，但在实现算法时作为快速测试非常有用。你可以将其想象为“RL\
  \ 领域的 MNIST”。（如果你没听过：MNIST 是由 Yann LeCun 创建的一个手写数字基准数据集，用于测试字体识别方法。它可以在 [`yann.lecun.com/exdb/mnist/`](http://yann.lecun.com/exdb/mnist/)\
  \ 获取。）\n* **Atari 2600：** 20 世纪 70 年代经典游戏机的游戏。共有 63 种不同的游戏。\n* **算法：** 执行较小的任务，例如复制观测到的序列或数字数字。\n\
  * **棋盘游戏：** 围棋和六棋。\n* **Box2D：** 这些环境使用 Box2D 物理模拟器，例如学习行走或驾驶汽车。\n* **MuJoCo：**\
  \ 另一个用于各种连续控制任务的物理模拟器。\n* **参数优化：** 这里 RL 被用于优化神经网络的参数。\n* **文本：** 简单的文本环境。\n* **PyGame：**\
  \ 使用 PyGame 引擎实现的各种环境。\n* **Doom：** 用 VIZdoom 实现的九迷你游戏。\n\n你可以在 [`gym.openai.com/envs`](https://gym.openai.com/envs)\
  \ 或项目 GitHub 仓库的 Wiki 页面找到完整的环境列表。OpenAI Universe 提供了更多的环境，并提供了与虚拟机的通用连接，可以使用 Flash、游戏、网络浏览器和其他应用程序。OpenAI\
  \ Universe 扩展了 Gym API，但遵循相同的设计原则和范式。访问 [`github.com/openai/universe`](https://github.com/openai/universe)。\n\
  \n我们将在 第 13 章,Asynchronous Advantage Actor Critic 中，在 MiniWoB 和浏览器自动化范围内深入讨论 Universe。\n\
  \n理论足够了——让我们来看其中一个 Gym 环境的 Python 会话。\n\n### 2.3.5 CartPole 会话\n\n现在我们利用所学的知识探索最简单的环境之一。\n\
  \n```python\nimport gym\nenv = gym.make('CartPole-v0')\nobs = env.reset()\nprint(obs)\n\
  for _ in range(1000):\n    action = env.action_space.sample()\n    obs, reward,\
  \ done, info = env.step(action)\n    print(obs)\n    if done:\n        obs = env.reset()\n\
  ```\n\n\n\n\n```python\n>>> e.action_space.sample()\n0\n>>> e.action_space.sample()\n\
  1\n>>> e.observation_space.sample()\narray([  2.06581792e+00,   6.99371255e+37,\
  \   3.76012475e-02,\n        -5.19578481e+37])\n>>> e.observation_space.sample()\n\
  array([4.6860966e-01, 1.4645028e+38, 8.6090848e-02,\n       3.0545910e+37])\n```\n\
  \n该方法返回一个随机选择的示例。对于类型为 `Discrete` 的动作空间，它是一个随机数字（0 或 1 之一）；而对于观测空间，它是一个包含四个随机数字的向量。观测空间的随机示例看起来并不很有用，实际上也确实如此，但当我们不确定如何执行某个动作时，动作空间的示例是可以被使用的。这在这里特别实用，因为我们还不知道任何强化学习（RL）算法，但仍然对\
  \ Gym 环境进行实验。现在，我们已经有了足够的信息来实现第一个一个具有随机行为的 CartPole 智能体。\n\n## 2.4 基于随机原理的 CartPole\
  \ 智能体\n\n虽然环境比第 2.1 节中的第一个示例复杂得多，但智能体的代码要短得多。这归功于代码的可重用性、抽象以及第三方库！\n\n以下是代码（你可以在\
  \ `Chapter02/02_cartpole_random.py` 文件中找到）：\n\n```python\nimport gym\nif __name__\
  \ == \"__main__\":\n    env = gym.make(\"CartPole-v0\")\n    total_reward = 0.0\n\
  \    total_steps = 0\n    obs = env.reset()\n```\n\n我们创建了环境并初始化了步骤计数器以及累积奖励的变量。最后一行重置环境并获取第一次观测（但我们并不使用它，因为智能体应该表现得随机）。\n\
  \n```python\nwhile True:\n     action = env.action_space.sample()\n     obs, reward,\
  \ done, _ = env.step(action)\n     total_reward += reward\n     total_steps += 1\n\
  \     if done:\n         break\nprint(\"Episode nach %d Schritten beendet,\n   \
  \    Belohnung insgesamt %.2f\" %\n       (total_steps, total_reward))\n```\n\n\
  在这个循环中，我们获取一个随机动作并指令环境执行，同时返回下一个观测 (`obs`）、奖励 (`reward`）和 `done` 标记。当回合（Episode）结束时，我们停止循环并输出执行了多少步以及累积奖励是多少。如果你运行该示例，将输出如下内容（并不完全相同，因为智能体的行为是随机的）：\n\
  \n```\nrl_book/samples/Chapter02$ python 02_cartpole_random.py\nEpisode nach 12\
  \ Schritten beendet, Belohnung insgesamt 12.0\n```\n\n基于随机原理的智能体在杆子倒下且回合结束之前，平均执行约\
  \ 12 到 15 步。在大多数 Gym 环境中有一个“奖励边界”，即智能体在 100 个回合内解决环境时应该获得的平均奖励。对于 CartPole 来说，这个边界是\
  \ 195，这意味着智能体必须至少平衡杆子 195 个时间步。从这个角度来看，随机智能体的性能相当平庸。但不要过早感到失望，因为我们还处于起点，并且将在许多其他更有趣、更有挑战的环境中解决这项任务。\n\
  \n## 2.5 额外的 Gym 功能：Wrapper（封装器）和 Monitor（监控器）\n\n我目前为止讨论的内容包含了最重要的 Gym API 的三分之二以及编写智能体所需的函数。然而，其余\
  \ API 简化了许多任务并使代码更加清晰。让我们简单地查看一下。\n\n### 2.5.1 Wrapper\n\n人们经常想要以通用的方式扩展环境的功能。环境提供观测，你可能将其收集在缓冲区（Buffer）中，以便为智能体提供最近的观测——在动态游戏中通常是如此，因为单帧往往是不够的。\n\
  \n\n\n\n这是一个基类的方法，我们必须重写它以更改智能体的行为。在每次执行时，将以 `epsilon` 的概率从动作空间中随机抽取并返回一个动作，而不是执行智能体传递的动作。通过使用\
  \ `action_space` 和 `Wrapper`，我们能够编写在*任何* `Gym` 环境中运行的抽象代码。此外，当动作被替换时，我们会输出一条消息以检查我们的\
  \ Wrapper 是否正常工作。在最终的代码中，这显然是不必要的。\n\n```\nif __name__ == \"__main__\":\n    env\
  \ = RandomActionWrapper(gym.make(\"CartPole-v0\"))\n```\n\n现在我们可以应用这个 Wrapper 了。我们创建一个普通的\
  \ CartPole 环境，并将其传递给 Wrapper 的构造函数。随后，我们像使用普通的 `Env` 实例一样使用我们的 Wrapper。由于 `Wrapper`\
  \ 类继承自 `Env` 类并具有相同的接口，我们可以根据意愿嵌套我们的 Wrapper。这是一种强大、优雅且通用的解决方案：\n\n```\nobs = env.reset()\n\
  total_reward = 0.0\n\nwhile True:\n    obs, reward, done, _ = env.step(0)\n    total_reward\
  \ += reward\n    if done:\n        break\nprint(\"Erhaltene Belohnung: %.2f\" %\
  \ total_reward)\n```\n\n这几乎是相同的代码，只是我们始终执行同一个动作：0。我们的智能体毫无察觉，并且总是做同样的事情。在执行代码时，应该显示\
  \ Wrapper 确实在工作：\n\n```\nrl_book_samples/Chapter02$ python 03_random_actionwrapper.py\n\
  Zufällig!\nZufällig!\nZufällig!\nZufällig!\nErhaltene Belohnung: 12.00\n```\n\n\
  如果你愿意，可以在创建 Wrapper 时使用参数 `epsilon` 进行实验，并验证随机尝试是否在平均上确实增加了智能体的奖励。我们继续查看 Gym 的另一个有趣功能：`Monitor`。\n\
  \n### 2.5.2 Monitor\n\n你应该了解一下 `Monitor` 类。它是以类似于 `Wrapper` 的方式实现的，可以将智能体的性能信息保存到文件中，甚至还可以选择包含智能体动作的视频录制。早早，在\
  \ [`gym.openai.com`](https://gym.openai.com) 网站上可以上传 `Monitor` 类的记录，以确定智能体与其他结果相比的表现如何（参见图\
  \ 2.5），但遗憾的是 OpenAI 在 2017 年 8 月底决定不再提供此功能，并“冻结”了所有现有的结果。目前有多种实现原始网站替代方案的尝试，但尚不存在。我希望这种情况很快就会改变，但目前无法将自己的结果与其他结果进行比较。\n\
  \n为了让你直观了解 Gym 界面的样子，图 2.5 展示了 CartPole 环境的网页。\n\n![\\[Bild\\]](Images/02_05.jpg)\n\
  \n**图 2.5：** 用于 CartPole 的 OpenAI-Gym 界面\n\n界面中的条目显示了训练过程的细节。例如，图 2.6 显示了 Doom 中一个小游戏的解决方案。\n\
  \n尽管如此，`Monitor` 仍然有用，因为你可以观察智能体在环境中的生存。以下代码为 CartPole 智能体添加了一个按随机原则运行的 `Monitor`\
  \ —— 这是唯一的区别（完整代码可以在文件 `Chapter02/04_cartpole_random_monitor.py` 中找到）：\n\n```\n\
  if __name__ == \"__main__\":\n    env = gym.make(\"CartPole-v0\")\n    env = gym.wrappers.Monitor(env,\
  \ \"Aufnahme\")\n```\n\n![\\[Bild\\]](Images/02_06.jpg)\n\n**图 2.6：** DoomDefendLine\
  \ 环境的训练过程\n\n传递给 `Monitor` 的第二个参数是存储结果的目录名称。该目录不应该已经存在，否则程序将因异常错误终止。（为了防止这种情况，你可以删除已存在的目录，或者向\
  \ `Monitor` 类的构造函数传递 `force=True` 参数。）\n\n`Monitor` 类需要 `FFmpeg` 工具，它用于将录制的观测值转换为视频文件。该工具必须可用，否则\
  \ `Monitor` 将抛出异常错误。最简单的方法是使用系统的包管理器安装 `FFmpeg`，但这取决于操作系统。\n\n为了能够运行此示例，必须满足以下三个条件之一：\n\
  \n*   代码应在带有 OpenGL 的 X11 会话中运行。\n*   代码应在虚拟显示中启动。\n*   使用带有 X11 转发的 `ssh`。\n\n\
  这是因为 `ssh` 可以对 X11 客户端（想要显示图形的 Python 代码）和 X11 服务器（可以显示图形并访问物理屏幕的软件）之间的通信建立隧道。要使用这种方法，你需要：\n\
  \n*   运行在本地机器上的 X11 服务器。X11 服务器是 Linux 的标准组件（所有桌面环境都使用 X11）。在 Windows 机器上，你可以安装第三方提供的\
  \ X11 实现，例如 VcXsrv（可在 [`sourceforge.net/projects/vcxsrv/`](https://sourceforge.net/projects/vcxsrv/)\
  \ 获取）。\n*   能够通过 `ssh` 使用 `-X` 命令行选项登录远程计算机：`ssh -X servername`。这将激活 X11 隧道，允许在此会话中启动的所有使用你的本地屏幕进行图形输出。\n\
  \n现在你可以启动一个使用 `Monitor` 类的程序。它可以显示智能体的动作并将其录制到视频文件中。\n\n```\n$ xvfb-run -s \"-screen\
  \ 0 640x480\"\n           python 04_random_action.py\n[2017-09-22 12:22:23,446]\
  \ Making new env: CartPole-v0\n[2017-09-22 12:22:23,451] Creating monitor directory\
  \ Aufnahme\n[2017-09-22 12:22:23,570] Starting new video recorder to Aufnahme/openaigym.video.31179.video00000.mp4\n\
  Episode nach 14 Schritten beendet, Belohnung insgesamt 14.00[2017-09-22 12:22:26,290]\
  \ Finished writing results. You can upload them to the scoreboard via gym.upload('Aufnahme')\n\
  ```\n\n## 2.6  Zusammenfassung\n\n\n\n现在你已经开始探索强化学习（Reinforcement Learning）的实践了！在本章中，我们安装了\
  \ OpenAI Gym，它包含许多用于实验的环境。我们查看了基础 API 并创建了一个按照随机原则运行的智能体（Agent）。此外，你还了解了如何模块化扩展现有环境的功能，并学习了如何使用\
  \ `Monitor` 封装记录智能体的操作。在接下来的章节中，我们将频繁使用这些功能。\n\n在下一章中，我们将简要总结深度学习，并使用 PyTorch——它是深度学习研究人员最青喜的库之一。请请期待。\n\
  \n# 第 3 章：使用 PyTorch 进行深度学习\n\n在上一章中，你熟悉了许多开源库，这些库为我们提供了一系列 RL 环境。强化学习的最新发展，特别是与深度学习（`DL`）的结合，使得解决比以往任何时候都复杂困难的任务成为可能。这在某种程度上也归功于深度学习方法和工具的发展。本章将介绍其中一种工具，它允许仅用几行\
  \ Python 代码即可实现复杂的深度学习模型。\n\n本章无法成为一份完整的深度学习手册，因为该领域过于广泛且变化迅速。本章将涵盖以下主题：\n\n* PyTorch\
  \ 库的特点和实现细节，假设你已经掌握了深度学习的基础知识。\n* 基于 PyTorch 的高级库，它们有助于解决典型的深度学习任务。\n* `PyTorch\
  \ Ignite` 库，它在某些示例中会被用到。\n\n**兼容性说明：** 本章中的所有示例已更新至 PyTorch 版本 `1.3.0`，与本书第一个英文版使用的\
  \ `0.4.0` 版本相比，该版本有一些变化。如果你仍使用旧版本，应该考虑升级。在本章中，我将讨论与前一个版本的区别。\n\n## 3.1 张量（Tensors）\n\
  \n张量是所有深度学习工具包的基石。这个术语听起来很神秘，但其核心思想仅仅是：张量是一个多维数组。单个数字对应一个零维点，而向量是一维的（例如线段），矩阵是一个二维对象。三维数字集合可以表示为排列成六面体体形状的数字，但与矩阵不同，它没有专门的名称。因此，我们使用\
  \ `Tensor` 一词来指代多维矩阵（图 3.1`。\n\n这里是一些示例：\n\n```python\nimport torch\nimport numpy\
  \ as np\n\n# 方式 1：使用构造函数\na = torch.tensor([[1, 2, 3], [3, 2, 1]])\nprint(a)\n#\
  \ tensor([[1, 2, 3], [3, 2, 1]])\n\n# 方式 2：从 NumPy 数组\nn = np.array([[1, 2], [3,\
  \ 4]])\nb = torch.tensor(n)\nprint(b)\n# tensor([[1, 2], [3, 4]])\n\n# 方式 3：使用特定函数\n\
  c = torch.zeros((3, 2))\nprint(c)\n# tensor([[0., 0.], [0., 0.]])\n```\n\n此外，你还可以创建包含特定数值的张量：\n\
  \n```python\nd = torch.ones((2, 2))\nprint(d)\n# tensor([[1., 1.], [1., 1.]])\n\n\
  e = torch.full((2, 2), 7)\nprint(e)\n# tensor([[7, 7], [7, 7]])\n```\n\n你还可以在创建时指定\
  \ `dtype`：\n\n```python\nf = torch.tensor([1, 2], dtype=torch.float64)\nprint(f)\n\
  # tensor([1., 2.], dtype=float64)\n```\n\n\n\nOptional könnte man den Typ des Tensors\
  \ auch mit dem Argument `dtype` der `torch.tensor`-Funktion übergeben. Hier ist\
  \ jedoch Vorsicht geboten, denn für dieses Argument muss der PyTorch-Typ angegeben\
  \ werden, nicht der NumPy-Typ. PyTorch-Typen sind Teil des `torch`-Pakets, beispielsweise\
  \ `torch.float32` oder `torch.uint8`.\n\n```\n>>> n = np.zeros(shape=(3,2))\n>>>\
  \ torch.tensor(n, dtype=torch.float32)\ntensor([[ 0., 0.],\n        [ 0., 0.],\n\
  \        [ 0., 0.]])\n```\n\n**Hin zuribilität:** Die Methode `torch.tensor()` und\
  \ explizite PyTorch-Typen wurden in der Version 0.4.0 hinzuge. Dies ist ein Schritt\
  \ zur Vereinfachung der Erzeugung von Tensor. In älteren Versionen wurde empfohlen,\
  \ die Funktion `torch.from_numpy()` zu verwenden, um NumPy-Arrays zu konvertieren,\
  \ allerdings gab es Probleme bei der Handhabung einer Kombination aus Python-Listen\
  \ und NumPy-Arrays. Die `from_numpy()`-Funktion ist zwar aus Gründen der Abwärtskompatibilität\
  \ noch vorhanden, gilt aber als veraltet. Verw Sie die flexiblere `torch.tensor()`-Methode.\n\
  \n### 3.1.2 Skalare Tensor\n\nSeit der Version 0.4.0 unterstützt PyTorch nulldimensionale\
  \ Tensor, die skalaren Werten entsprechen (Abbildung 3.1 links). Solche Tensor können\
  \ das Ergebnis bestimmter Operationen sein, wie etwa der Summierung aller Werte\
  \ eines Tensor. Früher wurden solche Fälle durch das Erzeugen eines eindimensionalen\
  \ Tensor (eines Vektors) mit einer einzigen Dimension mit dem Wert 1 gehand.\n\n\
  Die Lösung hat zwar funktioniert, war aber nicht besonders einfach, weil man für\
  \ den Zugriff auf den Wert einen zusätzlichen Index angeben musste. Jetzt werden\
  \ nulldimensionale Tensor unterstützt und können mit der Funktion `torch.tensor()`\
  \ erzeugt werden. Für den Zugriff auf den Python-Wert eines solchen Tensor gibt\
  \ es die `item()`-Methode:\n\n```\n>>> a = torch.tensor([1,2,3])\n>>> a\ntensor([\
  \ 1, 2, 3])\n>>> s = a.sum()\n>>> s\ntensor(6)\n>>> s.item()\n6\n>>> torch.tensor(1)\n\
  tensor(1)\n```\n\n### 3.1.3 Tensor-Operationen\n\nEs gibt eine Vielzahl von Operationen,\
  \ die mit Tensor ausgeführt werden können – zu viele, um sie alle aufzulisten. Für\
  \ gewöhnlich genügt es, in der PyTorch-Dokumentation unter [`pytorch.org/docs/`](http://pytorch.org/docs/)\
  \ nachzusehen. Hier muss erwähnt werden, dass es nicht nur die schon erwähnten In-situ-\
  \ und funktionale Operationen (mit bzw. ohne Unterstrich, wie `abs_()` und `abs()`)\
  \ gibt. Weitere finden Sie im `torch`-Paket und in der `tensor`-Klasse. Die Funktionen\
  \ im `torch`-Paket nehmen in der Regel einen Tensor als Argument entgegen. Die Funktionen\
  \ der `tensor`-Klasse bearbeiten den aufgerufenen Tensor.\n\nIn den meisten Fällen\
  \ versuchen die Tensor-Operationen, ihren NumPy-Pendants zu entsprechen. Wenn es\
  \ also eine nichtzu spezialisierte NumPy-Funktion gibt, stehen die Chancen nicht\
  \ schlecht, dass sie auch in PyTorch vorhanden ist. Beispiele hierfür sind `torch.stack()`,\
  \ `torch.transpose()` und `torch.cat()`.\n\n### 3.1.4 GPU-Tensor\n\nPyTorch unterstützt\
  \ CUDA-GPUs, und das bedeutet, dass es von allen Operationen zwei Versionen gibt\
  \ – eine für die CPU und eine für die GPU –, die automatisch ausgewählt werden.\
  \ Welche Version verwendet wird, ist durch den Typ des Tensor festgelegt, der bearbeitet\
  \ wird.\n\nDie bislang erwähnten Tensor-Typen sind CPU-Tensor und für jeden davon\
  \ gibt es ein GPU-Pendant. Der einzige Unterschied besteht darin, dass die GPU-Tensor\
  \ nicht zum Paket `torch`, sondern zum Paket `torch.cuda` gehören. So ist `torch.FloatTensor`\
  \ beispielsweise ein 32-Bit-Fließkommazahlen-Tensor, der sich im Arbeitpeicher der\
  \ CPU befindet, `torch.cuda.FloatTensor` hingegen ist das GPU-Pendant.\n\nZum Konvertieren\
  \ von CPU nach GPU gibt es die `to()`-Methode.\n\n```\n>>> a = torch.tensor([1,2,3])\n\
  >>> a\ntensor([ 1, 2, 3])\n>>> s = a.sum()\n>>> s\ntensor(6)\n>>> s.item()\n6\n\
  >>> torch.tensor(1)\ntensor(1)\n```\n\n```\n>>> a = torch.tensor([1,2,3])\n>>> a\n\
  tensor([ 1, 2, 3])\n>>> s = a.sum()\n>>> s\ntensor(6)\n>>> s.item()\n6\n>>> torch.tensor(1)\n\
  tensor(1)\n```\n\n```\n>>> a = torch.tensor([1,2,3])\n>>> a\ntensor([ 1, 2, 3])\n\
  >>> s = a.sum()\n>>> s\ntensor(6)\n>>> s.item()\n6\n>>> torch.tensor(1)\ntensor(1)\n\
  ```\n\n```\n>>> a = torch.tensor([1,2,3])\n>>> a\ntensor([ 1, 2, 3])\n>>> s = a.sum()\n\
  >>> s\ntensor(6)\n>>> s.item()\n6\n>>> torch.tensor(1)\ntensor(1)\n```\n\n\n\n\n\
  1. **静态图**：在这种方法中，您必须预先定义计算，无法在之后进行更改。在进行任何计算之前，深度学习库会对图进行处理和优化。这种模型在 TensorFlow、Theano\
  \ 以及许多其他深度学习工具包中实现。\n\n2. **动态图**：您不需要预先精确地定义之后执行的图。您只需要执行用于转换实际数据的操作即可。在此过程中，库会记录所执行的操作顺序；当您指示它计算梯度时，它会回溯操作过程并累积网络参数的梯度。这种方法也被称为\
  \ `Notebook Gradients`，并在 PyTorch、Chainer 等其他工具包中实现。\n\n这两种方法各有其优缺点。例如，静态图通常更快，因为计算计算可以在\
  \ GPU 上执行，从而最小地减少了数据传输的额外开销。此外，对于静态图，库在优化计算执行顺序方面有更大的空间。它甚至可以移除图的部分内容。\n\n动态图虽然会产生更多的计算，但开发者拥有更大的灵活性。例如，开发者可以说：“对这些数据应用两次网络，而对那些数据我将使用完全不同的模型，并对梯度进行数据集的平均值裁剪（clipped）。”动态图的另一个优势是它允许以一种更“自然”、符合\
  \ Python 习惯的方式描述转换。根结底，它只是一个具有许多功能的 Python 库，因此只需调用它并让库完成工作即可。\n\n**兼容性说明**：从 1.0\
  \ 版本开始，PyTorch 支持即时编译器（JIT），它可以将 PyTorch 代码导出为所谓的 `TorchScript`。这是一种执行速度更快且在生产环境中无需考虑\
  \ Python 依赖的表示。\n\n### 3.2.1 张量与梯度\n\nPyTorch 中的张量具有内置的梯度计算机制。因此，您只需要将您的数据转换为张量，然后可以使用\
  \ `torch` 提供的针对张量的方法和函数。如果您需要访问数据的某些细节，您仍然可以照做，但在大多数情况下，PyTorch 都能满足您的预期。\n\n张量具有多种与梯度相关的属性：\
  \ \n\n* `grad`：该属性存储一个格式相同的张量，其中包含计算出的梯度。\n* `is_leaf`：当张量由用户创建时，该值为 `True`；如果该对象是转换的结果，则为\
  \ `False`。\n* `requires_grad`：当张量需要计算梯度时，该值为 `True`。此属性由父张量继承。构造函数默认将 `requires_grad`\
  \ 设置为 `False`。如果您想为张量计算梯度，必须显式指定。\n\n为了直化这些机制，我们考虑以下示例：\n\n```python\nv1 = torch.tensor([1.0,\
  \ 1.0], requires_grad=True)\nv2 = torch.tensor([2.0, 2.0])\nv_sum = v1 + v2\nv_sum.backward()\n\
  print(v1.grad)\n```\n\n上面的代码按元素相加向量、将其翻倍并求和。结果是一个值为 2 的张量。如果现在检查这些属性，会发现 `v1` 和\
  \ `v2` 是唯一需要梯度的叶子节点：\n\n```\n>>> v1.is_leaf\nTrue\n>>> v2.is_leaf\nTrue\n>>> v_sum.is_leaf\n\
  False\n```\n\n```\n>>> v1.requires_grad\nTrue\n>>> v2.requires_grad\nFalse\n>>>\
  \ v_sum.requires_grad\nFalse\n```\n```\nv1.grad\n```\n\n\n\n`torch.nn` 包包含了许多预定义的类，它们为您提供了基础功能。在开发过程中，我们非常注重其实实用性（例如，它们支持微批次\
  \ Mini-Batches，拥有合理的默认设置，并且权重会经过适当的初始化）。所有模块都遵循“可调用”（`callable`）的约定。这意味着当类实例被应用于其参数上时，它可以像函数一样一样工作。例如，`Linear`\
  \ 类实现了一个带有可选偏置（bias）的前馈层：\n\n```\n>>> import torch.nn as nn\n>>> l = nn.Linear(2,\
  \ 5)\n>>> v = torch.FloatTensor([1, 2])\n>>> l(v)\ntensor([ 1.0532,  0.6573, -0.3134,\
  \  1.1104, -0.4065], grad_\nfn=<AddBackward0>)\n```\n\n在这里，我们创建了一个具有两个输入和五个输出的随机初始化的前馈层，并将其应用于一个浮点张量。`torch.nn`\
  \ 包中的所有类都继承自基类 `nn.Module`，你可以使用它来实现你自己的高层神经网络组件。它是如何工作的，我们将在下一节中介绍，但目前我们先查看 `nn.Module`\
  \ 所有子类提供的有用方法：\n\n*   `parameters()`：此函数返回一个包含所有需要计算梯度的变量（即模块的权重）的迭代器。\n*   `zero_grad()`：此函数将所有参数的梯度初始化为零。\n\
  *   `to(device)`：将所有模块参数移动到指定的设备（CPU 或 GPU）。\n*   `state_dict()`：返回一个包含所有模块参数的字典；对于模型的序列化非常有用。\n\
  *   `load_state_dict()`：使用状态字典初始化模块。\n\n你可以在文档的 [`pytorch.org/docs`](http://pytorch.org/docs)\
  \ 找到所有可用类的完整列表。\n\n这里应该提到一个特别方便的类，它允许通过管道（pipe）组合其他层：`Sequential`。`Sequential` 的工作原理通过示例演示最为清晰：\n\
  \n```\n>>> s = nn.Sequential(\n... nn.Linear(2, 5),\n... nn.ReLU(),\n... nn.Linear(5,\
  \ 20),\n... nn.ReLU(),\n... nn.Linear(20, 10),\n... nn.Dropout(p=0.3),\n... nn.Softmax(dim=1))\n\
  >>> s\nSequential (\n  (0): Linear(in_features=2, out_features=5, bias=True)\n \
  \ (1): ReLU()\n  (2): Linear(in_features=5, out_features=20, bias=True)\n  (3):\
  \ ReLU()\n  (4): Linear(in_features=20, out_features=10, bias=True)\n  (5): Dropout(p\
  \ = 0.3)\n  (6): Softmax()\n)\n```\n\n在这里，我们定义了一个三层神经网络，其维度 1 的输出为 Softmax 函数（维度\
  \ 0 是批次样本），并包含 ReLU 非线性激活和 Dropout。我们应用它：\n\n```\n>>> s(torch.FloatTensor([[1,2]]))\n\
  tensor([[0.1115, 0.0702, 0.1115, 0.0870, 0.1115, 0.1115,\n0.0908, 0.0974, 0.0974,\
  \ 0.1115]], grad_fn=<SoftmaxBackward>)\n```\n\n我们的微批次成功通过了神经网络！\n\n## 3.4 自定义层\n\
  \n在上一节中，简要提到了 `nn.Module` 类，它是 PyTorch 神经网络组件的基类。然而，它不仅仅是现有层的统一基类，不止于此。`nn.Module`\
  \ 类的子类可以作为自定义组件，这些组件可以组合使用、以后重复使用，并无缝地集成到 PyTorch 框架中。\n\n`nn.Module` 类为其子类提供了多种功能：\n\
  \n*   它会记录当前模块包含的所有子模块。例如，你的组件可能包含两个用于执行转换的前馈层。\n*   它提供了处理所有已注册子模块参数的函数。你可以查询模块参数的完整列表（使用\
  \ `parameters()` 方法）、将梯度初始化为零（使用 `zero_grad()` 方法）、在 CPU 和 GPU 之间切换（使用 `to(device)`\
  \ 方法）、序列化或反序列化模块（使用 `state_dict()` 和 `load_state_dict()` 方法），甚至通过使用自定义的可调用函数执行通用转换（使用\
  \ `apply()` 方法）。\n*   它确立了模块可以应用于数据的约定。所有模块都必须通过重写 `forward()` 方法来执行数据转换。\n*   还有其他一些功能，例如注册钩子函数（hook\
  \ function）以更改转换或梯度行为，但这些是更高级的用例。\n\n这些功能允许我们以统一的方式在更高层上嵌套子模块，这在处理复杂性时非常有用。无论是简单的单层线性转换，还是具有\
  \ 1001 层的残差网络（ResNet），都没有区别；只要遵循 `nn.Module` 的约定，就可以以相同的方式处理。\n\n\n\n在这里，我们用对数据转换的实现来重写\
  \ `forward()` 函数。由于我们的模块仅仅是其他层的一个简单封装器（wrapper），我们只需要指示它对数据进行转换。要将模块应用到数据上，必须将其作为可调用函数使用（即假设模块实例是一个函数，并带有参数调用它），而*不是*直接调用\
  \ `nn.Module` 类的 `forward()` 函数。这是因为 `nn.Module` 重写了 `__call__()` 方法，当我们把一个实例视为可调用对象时，就会使用该方法。该方法利用了\
  \ `nn.Module` 的内部机制并调用您的 `forward()` 方法。如果您直接调用 `forward()`，将会干扰 `nn-Module` 的运行，从而导致错误的结果。\n\
  \n因此，这就是定义自定义模块时需要完成的工作。现在我们来使用它：\n\n```\nif __name__ == \"__main__\":\n    net\
  \ = OurModule(num_inputs=2, num_classes=3)\n    v = torch.FloatTensor([[2, 3]])\n\
  \    out = net(v)\n    print(net)\n    print(out)\n```\n\n我们使用所需的输入和输出创建模块，随后创建一个被封装在\
  \ `Variable` 中的张量，并指示我们的模块遵循使用可调用函数的约定。然后我们输出网络的结构（`nn.Module` 重写了 `__str__()` 和\
  \ `__repr__()`），以直观的方式展示内部结构。最后，我们输出网络转换的结果。\n\n代码的输出应该如下：\n\n```\nrl_book_samples/Chapter03$\
  \ python 01_modules.py\nOurModule(\n  (pipe): Sequential(\n    (0): Linear(in_features=2,\
  \ out_features=5, bias=True)\n    (1): ReLU()\n    (2): Linear(in_features=5, out_features=20,\
  \ bias=True)\n    (3): ReLU()\n    (4): Linear(in_features=20, out_features=3, bias=True)\n\
  \    (5): Dropout(p=0.3, inplace=False)\n    (6): Softmax(dim=1)\n  )\n)\ntensor([[0.5436,\
  \ 0.3243, 0.1322]], grad_fn=<SoftmaxBackward>)\nCuda's availability is True\nData\
  \ from cuda: tensor([[0.5436, 0.3243, 0.1322]],\ndevice='cuda:0', grad_fn=<CopyBackwards>)\n\
  ```\n\n当然，之前关于 PyTorch 动态特性的说法仍然是正确的。您的 `forward()` 方法获得了对所有数据批（batches）的控制权。因此，如果您想根据待处理的数据进行更复杂的转换（例如应用分层\
  \ Softmax 函数或随机选择网络），没有任何限制可以阻止您。模块的参数数量也不局限于一个参数。因此，根据需要，您可以编写一个具有多个必填参数和几十个可选参数的模块——这完全不是问题。\n\
  \n现在，我们需要熟悉 PyTorchTorch 库中两个重要的组成部分，它们可以简化许多工作：损失函数和优化器。\n\n## 3.5 损失函数和优化器\n\n\
  一个将输入数据转换为输出数据的网络还不足以进行训练。我们必须定义自己的学习目标，即一个接受两个参数的函数：网络的输出和期望的输出。该函数返回一个数值，表示网络的预测与目标之间有多接近。这个函数被称为**损失函数**，其取值为**损失**。通过损失，我们计算梯度并调整参数，以便模型未来获得更好的结果。\n\
  \n### 3.5.1 损失函数\n\n损失函数属于 `nn` 包并定义目标。通常接收两个参数：网络的输出（预测）和目标值。最常见的有：\n\n- `MSELoss`:\
  \ 均方误差（Mean Squared Error）。\n- `BCELoss` 和 `BCEWithLogits`: 二元交叉熵（Binary Cross Entropy）。\n\
  - `CrossEntropyLoss` 和 `NLLLoss`: 最大似然问题。\n\n### 3.5.2 优化器\n\n优化器的任务是计算模型参数的梯度并修改它们以减少损失。PyTorch\
  \ 在 `torch.optim` 包中提供了多种实现。以下是广为人知的：\n\n- `SGD`: 简单的随机梯度下降（Stochastic Gradient\
  \ Descent），带有可选的动量扩展。\n- `RMSProp`: 由 Geoffrey Hinton 提出的优化器。\n- `Adagrad`: 一种自适应梯度优化。\n\
  - `Adam`: `RMSProp` 和 `Adagrad` 的一种非常成功且流行的组合。\n\n所有优化器都提供了统一的接口。必须向优化器传递一个在优化过程中变化的变量的迭代器。通常传递\
  \ `nn.Module` 实例的 `params()` 方法的结果。\n\n这里是常用的模板：\n\n```\nfor batch_x, batch_y in\
  \ iterate_batches(data, batch_size=32):\n   batch_x_t = torch.tensor(batch_x)\n\
  \   batch_y_t = torch.tensor(batch_y)\n   out_t = net(batch_x_t)\n   loss_t = loss_function(out_t,\
  \ batch_y_t)\n   loss_t.backward()\n   optimizer.step()\n   optimizer.zero_grad()\n\
  ```\n\n\n\n示例和标签被传递给网络（第 4 行）。它的输出和标签被提供给损失函数（第 5 行）。损失函数的结果指示了网络预测实际标签的优劣。由于网络的输入和权重都是张量（Tensor），网络中的变换表示了一个由张量实例组成的操作图。损失函数也是如此：它的结果是一个包含单个值的张量，即损失值。\n\
  \n该计算图中的所有张量都知道它们的前驱，因此，要计算整个网络的梯度，只需调用损失函数结果的 `backward()` 函数（第 6 行）。\n\n此调用 `backward()`\
  \ 会触发计算的执行；对于所有 `require_grad=True` 的张量，将计算梯度。这些张量通常是我们的模型参数，例如前馈神经网络的权重和偏置（Bias）或卷积滤波器。在每次梯度计算后，`tensor.grad`\
  \ 字段会被更新。因此，一个张量可以多次经过变换，其梯度会被正确累加。例如，单个 `RNN` 单元可以应用于多个输入上。\n\n在调用 `loss_t.backward()`\
  \ 后，梯度已经计算完毕，优化器就可以完成它的任务了：它应用我们在创建时传递给它的参数梯度。这一切都由 `step()` 方法完成（第 7 行）。\n\n在训练循环结束时，参数的梯度会被重置为零。这可以通过调用网络的\
  \ `zero_grad()` 来，但为了方便，优化器本身也提供此类调用来完成这项任务（第 8 行）。有时 `zero_grad()` 被放在训练循环的开头，但这并没有太大区别。\n\
  \n这种方法是一种执行优化的灵活方式，并且可以满足复杂情况下的需求。例如，两个优化器可能会针对相同的数据修改不同模型的选项——这在训练生成对抗网络（GANs）中非常常见。\n\
  \n以上就是 PyTorch 训练神经网络（NN）必不可少的功能。本章以一个中等示例结束，该示例演示了所有介绍的概念，但在之前，我想解释一个在实践中至关重要的主题：学习过程的监控。\n\
  \n## 3.6 使用 TensorBoard 进行监控\n\n如果你尝试过自己训练神经网络，你可能知道这有多么困难和不确定。我指的不是遵循那些超参数已经调优良好的教程和演示，而是根据数据从零开始开发东西。即使使用现代的深度学习工具包（权重被正确初始化，优化器的\
  \ beta 和 gamma 以及其他参数设置了合理的默认值，并且后台处理了许多其他工作），仍然可能会出现很多问题，因为仍然必须做出大量的决策。因此，网络在第一次尝试时几乎从不成功——你必须习惯这一点。\n\
  \n通过练习和经验，你自然会对问题的可能原因产生直觉，但即使依靠直觉，也必须了解网络内部发生了什么。因此，你必须能够以某种方式观察训练过程。即使是小网络（如微小的\
  \ MNIST 网络）也可能具有具有非线性训练学的数十万个参数。深度学习从业者列了一份在训练时应该关注的事项：\n\n*   损失函数的值，它通常包含多个部分，如基础损失或正则化损失。你应该监控总损失以及各个部分随时间的变化。\n\
  *   使用训练集和测试集的验证结果。\n*   梯度和权重的统计。\n*   网络生成的数值。例如，如果你在解决分类任务，你应该务必测量预测类别概率的熵。或者在回归任务中，预测值可以提供大量关于训练的数据。\n\
  *   随着时间推移而调整的学习率和其他超参数。\n\n这个列表可能要长得多，并包含某些特定领域的指标，例如投影的词嵌入（Embeddings）、音频样本以及\
  \ GAN 生成的图像。你还可以监控受训练速度影响的值，例如一个 epoch（epoch）持续多久，以检查优化的影响或识别硬件问题。\n\n简而言之：你需要一个通用的解决方案，为了分析而监控并记录大量数值随时间的变化。理想情况下，这种解决方案是专门为深度学习定制的（想象一下在\
  \ Excel 表格中查看此类统计数据）。幸运的是，有这样的工具。\n\n### 3.6.1 TensorBoard 简介\n\n当这本书的第一版编写时，监控神经网络的替代方案很少。但从那以后，越来越多的个人和公司开始从事机器学习和深度学习，因此现在有了更多可用工具。在书中，我们继续关注属于\
  \ TensorFlow 的 TensorBoard。\n\nTensorFlow 从第一个发布版本开始就包含一个名为 TensorBoard 的特殊工具，用于解决此类问题：如何在训练期间观察和分析神经网络的各种属性。TensorBoard\
  \ 是一个强大的通用解决方案，拥有庞大的社区，而且非常漂亮。\n\n![图像](img/03_04.jpg)\n\n**图 3.4:** TensorBoard\
  \ 的 Web 界面\n\n从技术角度来看，TensorBoard 是运行在你计算机上的一个 Python Web 服务。启动时，你传递一个训练过程存储分析数值的目录。然后你在\
  \ 浏览器中输入端口号（默认为 6006）。你将进入一个交互式 Web 界面，它会实时更新显示的值。这非常方便，特别是当训练在云端的远程机器上进行时。\n\n\n\
  \n\n\n**兼容性提示：** PyTorch 1.1 版本中实现了对 TensorBoard 的实验性支持。因此，不再需要安装 `tensorboardX`。（详情请参阅\
  \ [`pytorch.org/docs/stable/tensorboard.html`](https://pytorch.org/docs/stable/tensorboard.html)。）尽管如此，我将继续使用该第三方包，因为\
  \ PyTorch Ignite 依赖于它。\n\n### 3.6.2 绘图\n\n为了让你直观感受到 `tensorboardX` 有多简单，我们来看一个与神经网络无关的小型示例。这里的目的仅仅是向\
  \ TensorBoard 输出内容（完整代码可以在 `Chapter03/02_tensorboard.py` 文件找到）。\n\n```python\nimport\
  \ math\nfrom tensorboardX import SummaryWriter\n\nif __name__ == \"__main__\":\n\
  \    writer = SummaryWriter()\n    funcs = {\"sin\": math.sin, \"cos\": math.cos,\n\
  \             \"tan\": math.tan}\n```\n\n我们导入了必要的包，创建一个用于数据输出的对象（`writer`），并定义了我们想要可视化的函数。`SummaryWriter`\
  \ 在每次执行时默认会在 `runs` 目录下创建一个唯一命名的子目录，以便区分不同的训练运行。目录名称包含当前的日期、时间以及主机名。要更改这些内容，你可以向\
  \ `SummaryWriter` 传递一个 `log_dir` 参数。此外，你还可以通过传递一个可选的注释为目录名称添加后缀，例如指定实验的特性，如 `dropout=0.3`\
  \ 或 `strong_regularisation`。\n\n```python\nfor angle in range(-360, 360):\n    angle_rad\
  \ = angle * math.pi / 180\n    for name, fun in funcs.items():\n        val = fun(angle_rad)\n\
  \        writer.add_scalar(name, val, angle)\nwriter.close()\n```\n\n在这里，我们遍历了一个以度为单位的角度范围，将其转换为弧度并计算函数值。所有值都通过\
  \ `writer` 的 `add_scalar` 函数添加，该函数接受三个参数：参数名、值和当前迭代次数（必须是整数）。\n\n循环结束后，必须关闭输出通道\
  \ `writer`。请注意，`writer` 会定期（默认每两分钟）自动写入数据。因此，即使在非常耗长的优化过程中，你也能看到数值的变化。\n\n执行该代码在控制台中没有输出，但在\
  \ `runs` 目录下会创建一个新的子目录，其中包含一个文件。要查看结果，我们需要启动 TensorBoard：\n\n```bash\nrl_book_samples/Chapter03$\
  \ tensorboard –logdir runs\nTensorBoard 2.0.1 at http://localhost:6006/\n(Press\
  \ CTRL+C to quit)\n```\n\n如果 TensorBoard 运行在远程计算机上，你需要在启动命令行添加 `--bind_all` 选项，以便从其他计算机访问。否则，你现在可以在浏览器中打开\
  \ [`localhost:6006`](http://localhost:6006)（参见图 3.5）。\n\n![\\[图片\\]](Images/03_05.jpg)\n\
  \n**图 3.5：**示例生成的图表\n\n图表是交互式的；将鼠标悬停在其上方可以显示值，或选择一个区域进行放大。在图内部双击可以恢复缩小。如果你多次运行程序，左侧的\
  \ Runs 列表中会出现更多条目，你可以根据需要激活或禁用它们，以便比较不同的优化结果。通过 TensorBoard，你不仅可以分析标量值，还可以分析图像、音频、文本数据和嵌入（embeddings）。它甚至可以显示你的网络结构。请参考\
  \ `tensorboardX` 和 `tensorboard` 的文档以了解所有功能。\n\n现在是时候整合本章讨论的主题并使用 PyTorch 处理真正的优化任务了。\n\
  \n### 3.7 示例：用于 Atari 游戏图像的 GAN\n\n大多数关于深度学习的书使用 MNIST 数据集来展示其性能。多年来，这个数据集变得有些无味——就像遗传研究人员的果蝇一样。为了让书籍更有趣，我尝试避开陈旧路径，因此我想通过另一个示例来演示\
  \ PyTorch。你可能了解过**生成对抗网络**（**GANs**），它们是由 *Ian Goodfellow* 发明并广为人知的。在这个示例中，我们将训练一个\
  \ GAN 来生成各种 Atari 游戏的截图。\n\n最简单的 GAN 架构是这样的：我们使用两个网络，第一个网络作为“伪造者”（或*生成器/Generator*），第二个网络作为“侦探”（或*判别器/Discriminator*）。这两个网络相互竞争：`Generator`\
  \ 尝试生成伪造数据，而 `Discriminator` 尝试识别伪造数据。随着时间的推移，两个网络都在改进能力：`Generator` 生成越来越真实的数据，`Discriminator`\
  \ 找到更好的方法。GAN 的实际应用包括提高图像质量、生成真实图像和特征检测。我们的示例没有实际用途，但它很好地展示了 PyTorch 代码的复杂性。\n\n\
  完整代码可以在 `Chapter03/03_gan.py` 文件找到。这里只考虑有意义的代码，忽略导入和声明。\n\n```python\nclass InputWrapper(gym.ObservationWrapper):\n\
  \    def __init__(self, *args):\n        super(InputWrapper, self).__init__(*args)\n\
  \        assert isinstance(self.observation_space, gym.Box)\n        old_space =\
  \ self.observation_space\n        self.observation_space = gym.Box(\n          \
  \  self.observation(old_space.low),\n            self.observation(old_space.high),\n\
  \            dtype=np.float32)\n\n    def observation(self, observation):\n    \
  \    new_obs = cv2.resize(observation, (IMAGE_SIZE, IMAGE_SIZE))\n        # 变换 (210,\
  \ 160, 3) -> (3, 210, 160)\n        new_obs = np.moveaxis(new_obs, 2, 0)\n     \
  \   return new_obs.astype(np.float32)\n```\n\n\n\n\n`Generator` 接收一个随机数向量（作为潜向量）作为输入，并使用转置卷积操作将其转换为原始分辨率的彩色图像。我们在这里不会详细讨论这些类，因为它们很长且对于本示例并不重要。它们可以在上述文件中找到。\n\
  \n![\\[图像\\]](Images/03_06.jpg)\n\n**图 3.6：** 三款 Atari 游戏的截图\n\n我们使用一些 Atari 游戏的截图作为输入，这些游戏由一个按照随机原则运行的智能体同时进行。图\
  \ 3.6 显示了输入数据的可能样式。它们通过以下函数生成：\n\n```python\ndef iterate_batches(envs, batch_size=BATCH_SIZE):\n\
  \    batch = [e.reset() for e in envs]\n    env_gen = iter(lambda: random.choice(envs),\
  \ None)\n\n    while True:\n        e = next(env_gen)\n        obs, reward, is_done,\
  \ _ =\n                              e.step(e.action_space.sample())\n        if\
  \ np.mean(obs) > 0.01:\n            batch.append(obs)\n        if len(batch) ==\
  \ batch_size:\n            # 归一化到 -1 到 1 之间\n            batch_np = np.array(batch,\
  \ dtype=np.float32)\n            batch_np *= 2.0 / 255.0 - 1.0\n            yield\
  \ torch.tensor(batch_np)\n            batch.clear()\n        if is_done:\n     \
  \       e.reset()\n```\n\n在无限循环中，从传递的数组中选择一个环境，执行随机动作并将观测结果存储在`batch`列表中。当达到所需大小时，会进行归一化。我们将其转换为张，并通过生成器的\
  \ `yield` 函数输出。对观测值的平均值是否不为零进行检查是必要的，以绕过某个游戏中一个导致图像闪烁的 Bug。\n\n现在我们查看准备模型并执行训练循环的主函数：\n\
  \n```python\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument(\n        \"--cuda\", default=False, action='store_true'),\n\
  \        help=\"启用 CUDA 计算\"\n    args = parser.parse_args()\n\n    device = torch.device(\"\
  cuda\" if args.cuda else \"cpu\")\n    env_names = ('Breakout-v0', 'AirRaid-v0',\
  \ 'Pong-v0')\n    envs = [\n        InputWrapper(gym.make(name))\n        for name\
  \ in env_names\n    ]\n    input_shape = envs[0].observation_space.shape\n```\n\n\
  在这里我们处理命令行参数（可以是可选参数 `--cuda`，用于在 GPU 上启用计算），并通过应用 Wrapper 创建我们的环境。环境数组稍传递给 `iterate_batches`\
  \ 函数以生成训练数据。\n\n```python\nnet_discr = Discriminator(input_shape=input_shape).to(device)\n\
  net_gener = Generator(output_shape=input_shape).to(device)\n\nobjective = nn.BCELoss()\n\
  gen_optimizer = optim.Adam(\n    params=net_gener.parameters(), lr=LEARNING_RATE,\n\
  \    betas=(0.5, 0.999))\ndis_optimizer = optim.Adam(\n    params=net_discr.parameters(),\
  \ lr=LEARNING_RATE,\n    betas=(0.5, 0.999))\nwriter = SumaryWriter()\n```\n\n在这里我们创建了类：一个\
  \ `SummaryWriter`、两个网络、一个损失函数和两个优化器。为什么要两个？因为 GAN 是这样训练的：为了训练判别器，我们必须向它提供带有相应标签的真实和伪示例（1\
  \ 为真，0 为假）。在这一迭代中，我们只更新判别器的参数。\n\n随后，我们再次向判别器提供真实和伪示例，但这次所有图像都标记为 1，且我们只更新生成器的权重。在第二次迭代中，生成器学习如何欺骗判别器，让判别器混淆真实和伪示例。\n\
  \n```python\ngen_losses = []\ndis_losses = []\niter_no = 0\n\ntrue_labels_v = torch.ones(BATCH_SIZE,\
  \ device=device)\nfake_labels_v = torch.zeros(BATCH_SIZE, device=device)\n```\n\n\
  在这里我们定义了存储累积损失的数组、迭代计数器以及用于 `True` 和 `Fake` 标签的变量。\n\n```python\nfor batch_v in\
  \ iterate_batches(envs):\n    # 生成额外的伪示例；\n    # 输入是 4D: batch, filters, x, y。\n\
  \    gen_input_v = torch.FloatTensor(\n        BATCH_SIZE, LATENT_VECTOR)\n    gen_input_v\
  \ = gen_input_v.to(device)\n    gen_input_v = gen_input_v.view(BATCH_SIZE, LATENT_VECTOR,\
  \ 1, 1)\n    fake_output_v = net_gener(gen_input_v)\n    gen_loss = objective(fake_output_v,\
  \ fake_labels_v)\n    gen_losses.append(gen_loss.item())\n\n    gen_optimizer.zero_grad()\n\
  \    gen_loss.backward()\n    gen_optimizer.step()\n\n    real_output_v = net_discr(batch_v)\n\
  \    fake_output_v = net_discr(real_output_v.detach())\n    dis_loss = (objective(real_output_v,\
  \ true_labels_v) +\n                objective(fake_output_v, fake_labels_v)) / 2\n\
  \    dis_losses.append(dis_loss.item())\n\n    dis_optimizer.zero_grad()\n    dis_loss.backward()\n\
  \    dis_optimizer.step()\n```\n在训练循环开始时，我们通过使用 `iterate_batches` 的 `batch_v` 来训练判别器。\n\
  \n\n\nPyTorch Ignite ist eine elegante und flexible Bibliothek, die von Tausenden\
  \ Forschern, DL-Enthusiasten und professionellen Entwicklern geschätzt wird. Aber\
  \ die Flexibilität hat auch ihren Preis, nämlich dass zu viel Code zum Lösen einer\
  \ Aufgabe geschrieben werden muss. Manchmal ist das durchaus von Vorteil, beispielsweise\
  \ wenn ein neues Optimierungsverfahren oder ein DL-Trick implementiert werden soll,\
  \ der noch nicht zur Standardbibliothek gehört. Dann wird nur die Formel in Python\
  \ implementiert; die Gradientenberechnungen und die Backpropagation erledigt wie\
  \ von Zauberhand PyTorch. Ein weiteres Beispiel sind Situationen, in denen man gezwungen\
  \ ist, auf Low-Level-Niveau zu arbeiten und man sich mit Gradienten und Details\
  \ des Optimierers herumplagen muss oder mit der Art und Weise, wie das NN die Daten\
  \ transformiert.\n\nMitunter ist diese Flexibilität aber gar nicht erforderlich,\
  \ beispielsweise für Routineaufgaben, wie das einfache überwachte Training eines\
  \ Bildklassifikators. Für solche Aufgaben ist Standard-PyTorch womöglich schon zu\
  \ maschinennah, wenn man es immer wieder mit demselben Code zu tun hat. Die folgende,\
  \ unvollständige Liste enthält Aufgaben, die wesentlicher Bestandteil jedes DL-Trainingsverfahrens\
  \ sind, es jedoch erforderlich machen, Code zu schreiben:\n\n* Vororbereitung und\
  \ Transformation von Daten sowie die Erzeugung von Batches\n* Erstellung von Kriterien\
  \ für erfolgreiches Training, wie Werte der Verlustfunktion, Korrektklassifikationsrate\
  \ oder eines F1-Maßes (zur Beurteilung eines Klassifikators)\n* Regelmäßige Prüfung\
  \ des trainierten Modells mit Trainings- und Validierungsdatenmengen\n* Speicherung\
  \ des Modells nach einer bestimmten Anzahl von Iterationen oder beim Erreichen eines\
  \ neuen Bestwerts\n* Übergabe der Metriken an ein Monitoringtool wie TensorBoard\n\
  * Änderung der Hyperparameter, wie etwa eine geplante Erhöhung oder Verringerung\
  \ der Lernrate\n* Ausgabe von Meldungen bezüglich der Fortschritte beim Training\
  \ auf die Konsole\n\nAll diese Aufgaben lassen sich mit PyTorch erledigen, machen\
  \ es jedoch erforderlich, eine nicht unerhebliche Menge Code zu schreiben. Da diese\
  \ Aufgaben bei jedem DL-Projekt anfallen, wird es schnell lästig, immer wieder denselben\
  \ Code zu schreiben. Der übliche Ansatz, dieses Problem in Angriff zu nehmen, ist\
  \ die einmalige Programmieren der Funktionalität, sie in einer Bibliothek zu verpacken\
  \ und wiederzuverwenden. Ist die Bibliothek quelloffen und von hoher Qualität (leicht\
  \ anwendbar, hochgradig flexibel, ordnungsgemäß geschrieben usw.), dann wird sie\
  \ sich verbreiten, weil immer mehr Leute sie in ihren Projekten einsetzen. Das ist\
  \ keine Besonderheit des Deep Learnings; es geschieht in allen Bereichen der Softwarebranche.\n\
  \nEs gibt eine Reihe von Bibliotheken, die das Lösen gängiger Aufgaben vereinfachen:\
  \ `ptlearn`, `fastai`, `ignite` und einige andere. Die aktuelle Liste namens »PyTorch\
  \ ecosystem projects« finden Sie unter [`pytorch.org/ecosystem`](https://pytorch.org/ecosystem).\n\
  \nEs mag verlockend sein, diese High-Level-Bibliken von von Anfang zu verwenden,\
  \ weil sie es ermöglichen, typische Aufgaben mit einigen wenigen Codezeilen zu lösen,\
  \ aber das ist nicht ganz ungefähr. Wenn man nur weiß, wie die High-Level-Biliotheken\
  \ verwendet werden, ohne zu verstehen, was auf den untergeordneten Ebenen eigentlich\
  \ vor sich geht, kann man sich leicht bei Aufgaben festfahren, die sich schon mit\
  \ Standardverfahren lösen lassen. Dies geschieht bei einem so dynamischen Fachgebiet\
  \ wie ML sehr häufig.\n\nDieses Buch konzentriert sich vor allem darauf, dass Sie\
  \ RL-Verfahren, deren Implementierung und Anwendbarkeit verstehen, deshalb werden\
  \ wir einen inkrementellen Ansatz verfolgen. Zunächst werden wir Verfahren mit reinem\
  \ PyTorch-Code implementieren. Dann fahren wir damit fort, Beispiele zu implementieren,\
  \ die High-Level-Bibliken verwenden. Beim RL werden wir eine kleine von mir entwickelte\
  \ Bibliothek verwenden: `PTAN` ([`github.com/Shmuma/ptan/`](https://github.com/Shmuma/ptan/)).\n\
  \n(注：由于用户提供的原文为德语，以下将该德语内容翻译为中文)\n\n译文：\n\n[content]\nPyTorch Ignite 是一个优雅且灵活的库，它受到数千名研究人员、深度学习爱好者和专业开发人员的推崇。但这种灵活性也有其代价，即为了解决一项任务必须编写大量的代码。有时，这完全是有好处的，例如当要实现一种全新的优化算法或深度学习技巧（DL-Trick）时，而这些技巧尚未属于标准库。在这种情况下，只需要在\
  \ Python 中实现公式；梯度计算和反向传播将由 PyTorch 魔法般地完成。另一个例子是当你被迫在低级水平工作，必须与梯度、优化器的细节纠斗，或者与神经网络（NN）转换数据的方式作斗时。\n\
  \n但有时这种灵活性并不是完全必需的，例如对于常规任务，如图像分类器的简单监督学习训练。对于此类任务，如果你反复要处理相同的代码，标准的 PyTorch 可能已经太接近底层了。以下这个不完整的列表包含了每个深度学习训练过程中不可或缺的组成部分任务，但这些任务又需要编写代码：\n\
  \n* 数据的预处理和转换以及批次（Batches）的生成\n* 创建用于衡量训练成功的标准，例如损失函数值、正确分类率或 F1 指数（用于评估分类器）\n*\
  \ 使用训练集和验证集定期对训练后的模型进行检查\n* 在指定的迭代次数或达到新的最佳值后保存模型\n* 将指标传递给 TensorBoard 等监控工具\n\
  * 修改超参数，例如计划性增加或减少学习率\n* 在控制台上输出关于训练进展的消息\n\n所有这些任务都可以通过 PyTorch 完成，但它们需要编写大量的代码。由于这些任务在每个深度学习项目中都会出现，反复编写相同的代码很快就会变得令人厌烦。解决这一问题的常用方法是一次性编写该功能，将其封装在库中并用。如果该库是开源且高质量的（易于使用、高度灵活、编写得当等），它就会流行起来，因为会有越来越多的人在他们的项目中使用。这并不是深度学习的特例；它发生在软件行业的所有领域。\n\
  \n有一系列库可以简化常见任务的解决：`ptlearn`、`fastai`、`ignite` 以及其他一些。名为“PyTorch 生态系统项目”的最新列表可以在\
  \ [`pytorch.org/ecosystem`](https://pytorch.org/ecosystem) 找到。\n\n从一开始就使用这些高级别库可能很有吸引力，因为它们允许用几行代码就解决典型任务，但这并非易事。如果你只知道如何使用这些高级库，而不理解底层实际上到底发生了什么，那么很容易在那些用标准程序就能解决的任务上遇到瓶颈。在机器学习（ML）这样一个如此活的领域，这种情况经常发生。\n\
  \n本书重点侧重于让你理解强化学习（RL）算法及其实现和适用性，因此我们将采用渐进式的方法。首先，我们将用纯 PyTorch 代码实现算法。然后我们将继续实现使用高级别库的示例。在强化学习中，我们将使用一个由我开发的微型库：`PTAN`\
  \ ([`github.com/Shmuma/ptan/`](https://github.com/Shmuma/ptan/))。\n\n（注：由于用户提供的原文为德语，此处将该德语内容翻译为中文）\n\
  [/content]\n\n**纠正：根据用户指令，原文是德语，但指令要求“将给定英文文本翻译成中文”。考虑到原文实际上德语，以下是基于提供的德语文本翻译的中文译文：**\n\
  \n[content]\nPyTorch Ignite 是一个优雅且灵活的库，受到数千名研究人员、深度学习爱好者和专业开发人员的推崇。但这种灵活性也有其代价，即为了解决一项任务必须编写大量的代码。有时，这完全是有好处的，例如当要实现一种全新的优化算法或深度学习技巧时，而这些技巧尚未属于标准库。在这种情况下，只需要在\
