  trans: '

    互联网的新一次迭代正在开发中，它将对社会产生巨大影响。营销、传播和品牌专业人士将面临新的挑战，但也面临新的机遇。这个元宇宙的新时代将释放独特的创造力，并为品牌和企业开启新的疆域和视野。


    对于具有创业心态的个人来说，这将创造全球性的机会。以前由背景管辖区或教育水平所加的限制将变得前所未有的模糊。拥抱并适应正在发生的新转变。互联网和加密货币是范式转移；而元宇宙是这些者的融合且远超此。问题是，你准备好了吗？


    # 第二章


    自从 Facebook 自更名为 `meta platforms` 以来，元宇宙已成为科技领域最热门的话题。元宇宙加密货币最近爆发式增长，这绝非暂时的现象。我们在这个元宇宙之旅上已经走了多年，只是
    Facebook 广受瞩目的转型让这一趋势处于聚光灯中心。


    元宇宙不仅仅是一个用于虚拟商品和 nfts 的增强、混合现实市场。那只是大图的一小部分。它是互联网的下一次演进，将改变我们的生活方式，包括我们的交流方式。本节将简要探讨这一趋势将向何处发展，更重要的是，作为加密货币投资者和股票投资者，如何进入这个价值八万的颠覆性市场。


    它包括投资元宇宙特定的代币，这些代币与创建和变现数字财产密切相关。此外，不要忘记这些元宇宙生态系统的加密货币和区块链基础设施。最后，我们在股市中还有各种参与者，他们都在朝着同一个方向移动。让我们开始吧。


    如果你根据我为止的描述仍然不知道元宇宙，请把它想象成一个虚拟世界，你我这些人可以在其中玩、停留，并通过从音乐会、会议甚至世界各地的假期一切建立联系。


    在 10 到 20 年后，想象一下使用虚拟现实和全息技术定制你感兴趣购买的汽车。想象使用投影仪在你真实公寓的墙上显示你的数字艺术品。这种你作为独特 `nfts`拥有的艺术可以在区块链上被验证，且无法被盗。讽刺的是，你的房子可能会烧毁或被盗，但你的数字资产是安全的。


    想象一下从舒适家中跳入工作会议，体验比现实生活还要好，因为元宇宙可以提供一个与现实一样无缝、直观但经过增强的界面。推进幻灯片、打开链接和调整屏幕大小可以像滑动、点击或捏合一样简单。想象从任何角度观看体育赛事，甚至从球员自身的视角观看。想象即使在身体上不在场，也能与爱的人一起停留并共同感受。


    这些是未来的先驱们正在思考并已经在构建的，而我们已经部分实现了。他们已经拥有了超快宽带、高速 VR 头显设备以及持久的 24/7 全天候在线世界。


    对于许多年轻人来说，转向元宇宙甚至不是必要的。他们成长时的预期是，他们未来的很大一部分将存在于元宇宙中。我们其他人无论喜欢与否都必须跟上潮流。


    ## 区块链和加密货币在元宇宙中的角色


    区块链和加密货币在我们走向元宇宙的过程中扮演了什么角色？事实证明，作用非常大。有些人认为，今天的加密投资者将成为元宇宙的主人。


    ### Axie Infinity

    `axie Infinity` 是一个你可以在其中繁殖、训练和战斗生物的游戏。它是以太坊上受欢迎的 `nfts` 之一。


    ### Decentraland

    `decentraland` 是一个构建在以太坊上的虚拟世界，用户可以在那里购买和开发土地。它是一个去中心化平台。


    ### The Sandbox

    `Sandbox` 是一个构建在以太坊上的虚拟世界，玩家可以在那里创建并变现他们的体验。它也是一个去中心化平台。


    ### Enjin

    `Enjin` 是一套工具，允许用户创建并将 `nfts` 集成到游戏和应用中。


    ### OVR

    `ovr` 是一个覆盖整个世界的数字层，由 16 万亿块土地组成。它们都是独立的 `nfts`。


    ### Metahero

    `Metahero` 允许你使用他们的 3d 扫描仪创建你的数字头像。这是另一个可以在不同平台使用的 3d `nfts`。


    ## 你可以在哪里购买这些元宇宙加密货币？


    嗯，最大的主流币可以在如 `binance` 和 `coinbase` 等任何中心化交易所购买。你也可以在 `defi` 中购买它们。例如，基于以太坊的代币都可以在旧
    `uniswap` 上购买，但要注意 Gas 费用。`binance smart chain` 的代币可以在老牌 `pancakeswap` 上购买。

    '
