    # Chapter Four


    ## Metaverse Investment


    Investing in the Metaverse may just be one of the most fantastic opportunities
    for savvy investors out there to make a hell of a lot of money. After Facebook''s
    recent rebranding to meta to build out their vision and interpretation of the
    Metaverse, it picked the interest of investors worldwide on how they can potentially
    invest early into this space and capitalize from what could be a perfect investment
    opportunity.


    Indeed, there are many different and exciting ways to invest in the Metaverse,
    which goes beyond just investing in stocks. As the Metaverse becomes more embedded
    into our daily lives, it becomes something that we engage in more and more. It
    certainly lives in what could be a little bit more of a virtual world, and I suspect
    the investment opportunities surrounding it will only broaden over time. So let''s
    talk about some of these early investment opportunities.


    ### Stocks


    The very first investment opportunity that I wanted to talk about is investing
    in stocks. It''s the bread and butter of most investment portfolios, including
    mine. There are many different companies out there who are actively contributing
    to the Metaverse and the infrastructure in building out the metaverse ecosystem.


    We already know that Mark Zuckerberg has outlined his intention to build out his
    own Metaverse and stake his claim on the evolution of social connectivity. But
    what''s interesting here is that the Metaverse in itself goes far beyond just
    what one company can build because the infrastructure to build out a metaverse
    and the activities going to go on within it is certainly a little bit more vast.


    It includes everything from gaming with friends in a virtual world, visiting live
    events and entertainment, getting personal training without going to a gym, working
    with colleagues and meeting in a virtual office, or even going shopping in the
    Metaverse. Imagine all the different companies already operating, establishing,
    and having a physical product they could transfer into a digital or virtual product
    and put into the Metaverse.


    You''ve got gaming companies like unity software and Roblox fitness companies
    like Peloton, Video conferencing companies like zoom and Microsoft, e-commerce
    companies like Amazon and Shopify. There are endless possibilities for all of
    these companies mentioned. Due to that, there are many opportunities to invest
    and gain exposure to some of these stocks within your investment portfolio. It
    will undoubtedly be interesting to see which stocks actually look to make a bit
    of a move and start investing in the business to gain some exposure into the Metaverse
    and actively look to gain some kind of market share. I suspect the first-mover
    advantage into this space will be huge.


    The market opportunity or the forecasted market opportunity for the Metaverse
    is expected to be 825 billion dollars by 2028 and grow a compounded annual growth
    rate of 43.3% per year. So there are plenty of opportunities to invest in companies
    that capitalize from huge levels of growth in their business simply from investing
    in the Metaverse and having some virtual product within it.


