  trans: '

    现在，你为什么需要元宇宙？营销和传播专业人员需要关注元宇宙，因为它是在线交互的下一个边界，就像社交媒体彻底改变了在线营销格局一样。它开启了我们现实中受限的业务想法的可能性。诸如`视频会议`、`加密货币`、`电子邮件`、`虚拟现实`、`社交媒体`、`直播`、`人工智能`、`区块链`、`计算机视觉`等活动都是元宇宙的一部分。人们可以在其中互动、玩游戏、做生意和交流，以及更多可能。


    元宇宙将为个人创作者和艺术家带来巨大的机会。它为那些想要远离如今城市中心的地方工作并拥有房屋的人，以及那些生活在教育或娱乐机会较有限地区的人提供了帮助。人们将能够通过`virtual
    reality`进入完全虚拟的元宇宙，或者在增强和混合现实的帮助下与其物理空间的部分进行交互。


    想象一下在虚拟办公室中进行业务会议和面试，而不是通过`zoom`或摄像头。想象一下在购物时，在自己舒适的家里试穿衣服——下一项重大趋势将是传送设备和`元宇宙经济
    (Metanomics)`。


    ## 元宇宙经济 (Metanomics)


    上述想法非常棒，但作为项目所有者、业务所有者或个人，你能做什么呢？`Metanomics`是对元宇宙经济监管和业务模式的研究。它也是研究现实世界的业务如何将虚拟世界作为其策略的一部分。如果我们进一步深挖，`Metanomics`还包含了将虚拟世界作为实验室，以研究现实世界的业务或政策问题。


    你现在可能正处于某个元宇宙中而甚至不知道。用户购买数字商品的原因与购买实体商品的原因相同。存在身份认可、对特定子群体或社区的归属感、价格投机以及可能的收益。


    虚拟时尚、`虚拟角色皮肤`、`虚拟房地产`、房屋和汽车在元宇宙中将具有价值。`Netvrk`作为顶尖的加密元宇宙项目之一，近期举行了车辆销售并像抢手货一样一售一空。如果你能创作高质量的内容并进行市场营销，`NFT`的流行程度完全没有放缓的迹象，你在元宇宙中可以取得的成就是无限制的。


    虚拟职业将在`元宇宙语义 (Metonymy)`中被提及。一些例子可能包括`元宇宙顾问`、`虚拟房地产开发商`、`车辆和物业租赁`、`角色设计师`以及数千其他头衔。公司需要将它们的营销策略从在线建议转存在共享虚拟经济中。像`envoy`这样的项目脱颖而出。有了他们的去中心化委员会，可以想象一个像纽约`时代广场`那样的广告板。


    有些人可能会说`Metanomics`是对现实世界事件的不对称对冲，而`Metonymy`可能会成为由元宇宙社区完全由自由市场力量驱动的最纯的资本主义形式。此外，跨境拥有资产的简单性对于那些希望存放资金的人来说可能非常有吸引力。


    让我们再深入探讨一下。人们去元宇宙中寻找品牌，是因为他们感到有一种联系，而不一定是因为他们需要某种产品或服务。你需要在有机销售产品或服务的同时，让客户能够沉浸在体验中。


    看看这些顶级范例，`Travis Scott`合作的`fortnight`，艺术家在周边商品销售上赚了 2000 万美元。相比之下，他在线下`Astroworld`巡演中单晚拥有
    170 万张唱片销量，仅占他报告的 5350 万次巡演收入的 40%以下。粉丝较少的艺术家仍然有机会在虚拟世界中举办活动，以推动数字专辑销售并增加流媒体和纪念性数字商品的销量。


    是的，十年前的演唱会 T 恤想法现在可以是一个`NFT`或一个`game skin`。而以前，你玩游戏是为了快乐和爱好，但现在你可以投资并开始赚钱了。


    我胆于说，更年轻、精通技术的一代将远离传统的教育系统，转而转向这种技术先进的元宇宙并享受它。


    在世界经济论坛，一位人士曾表示，大多数工作现在可以被机器人化，`AI`开启了一个更具机会的领域。`AI`影响着社交媒体。现在元宇宙将被启用、普及并被人工智能所支持。`AI`对元宇宙具有重要的另一种方式是`AI`系统将随着时间的推移了解你并塑造你的体验。你可以想象在个人层面由`AI`生成内容和互动。人工智能的应用潜力将近乎无限。关于元宇宙无论它最终采取什么形式，我相信人工智能将至关重要。`Web
    3.0`比任何现有服务提供了更丰富的功能和互操作性。远程办公、`视频会议`、`远程医疗`、`远程社交`以及更多可能性都得到了极大增强。在未来十年及以后，元宇宙成为普通人生活的重要组成部分是合理的。这里有许多分支，例如`元宇宙语义`。它开启了社交范式的新维度。你可能会看到运动和趋势渗透到现实世界，反之亦然。


    有一天，我们需要一个全球性的区块链，就像我们有一个运行网站和一切的互联网协议一样。互操作性和所有那些不同的旧币看起来更像是摩擦和顺畅体验的障碍。


    现在有一个叫做`Meta net` 的东西。它已经生产多年，是构建在原始比特币协议之上的。它目前的代码是`BSV`，加密社区被社会工程化地讨厌它。

    '
