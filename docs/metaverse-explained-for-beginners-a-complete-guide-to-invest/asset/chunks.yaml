    以下是一系列特定元宇宙的加密货币。它们包括 `axie`、`mana`、`sand`、`Enjin` 等。购买并持有这些代币是投资元宇宙旅程的直接方式。


    ![](img/Image00001.jpg)


    另一种方法是投资作为这些元宇宙生态系统底层基础设施的区块链，例如 `ethereum`、`Solana`、`Cardano`、`Polkadot`，特别是
    `Polkadot`、`avalanche`、`polygon` 等。


    ![](img/Image00002.jpg)


    这些元宇宙的应用场景正在不断增加。`layer one`（第一层）和 `layer two`（第二层）质量将受益，因此投资这些区块链可能是更安全、更明智的想法，因为你还实现了超越特定元宇宙应用场景的多元化投资。这些是你可以多年来通过定额投入并长期持有的加密货币。如果你购买特定的元宇宙代币，尤其是市值较小的代币，你将更密切地关注它们。


    `Polkadot` 是这些区块链中值得关注的层之一，因为它完全专注于互操作性以及连接大多数主要以孤岛模式运行的不同区块链。随着未来你可以在其他区块链之间共享数字资产和
    NFT，这将将变得越来越重要。你不需要让你基于 `ethereum` 的 NFT 困在 `ethereum` 上。同样，你不需要让你的 `Solana` 资产和
    `card` 资产局限于那里。你需要互操作性，而这是 `Polkadot` 的首要任务。所以这是一个值得关注的。


    区块链和加密货币构建元宇宙的一种方法。不要忘记所有其他公司也远离区块链并各尽一份，其中包括科技巨头。我们谈论的是一个 100 万亿美元的股市。显而易见的选择是元平台。这家科技巨头曾名为
    `Facebook`，在重品牌之前就已经对虚拟现实进行了大量投资，包括在 2014 年收购 VR 公司 `Oculus`。马克·扎克伯格在完成 `Facebook`
    重品牌后，对元宇宙极其看好。他认为它可以取代我们所知的互联网。


    ## Microsoft


    `Microsoft` 正在通过其 `Microsoft mesh` 平台开发混合和扩展现实应用。这是一个结合了现实世界与 VR 及全息技术的大项目。他们将把这些技术整合到
    `Microsoft teams` 中，供那些居家办公的人使用。很快，你将把全息和虚拟化身等混合现实功能带入视频会议，这非常有趣。


    不要忘记与基础设施相关的股票。你拥有像 `Nvidia` 这样的硬件公司，它是最大的显卡和 AI 芯片制造商。你拥有 `Amazon`，它的云计算基础设施经常被拿来与
    `ethereum` 在加密领域所扮演的角色相媲美。许多业务建立在 `Amazon web services` 之上，就像许多 `Dapps` 构建在 `ethereum`
    区块上一样。


    所有这些公司都是重要的，因为随着元宇宙采用率的增加，对计算力和数据基础设施的需求只会增加。还有许多其他玩家在为元宇宙创作内容。例如，你有 `Fortnite`
    背后的公司 `epic games`，其 CEO 对元宇宙非常看好。他们已经举办了 `Ariana Grande` 和 `Travis Scott` 的虚拟演唱会。他们正在通过
    `meta-human creator` 开发照片级真实的数字人类，这可以在未来的开放世界游戏中为你定制数字双胞胎。目前 `epic games` 唯一的问题是它们不是一家上市公司，但如果它们以后上市，将引起巨大的关注。


    ## Unity Software


    `Unity Software` 是整个视频行业中使用最广泛的引擎。这是一个允许开发者创建 2D 和 3D 实时内容的平台。最后，我们将提到 `Roblox`，它是一个用户生成内容的平台。


    总结，我们看到元宇宙正在快速演变，从特定的加密货币到大型科技巨头和基础设施供应商。无论是通过代币、虚拟现实还是沉浸式游戏平台，数字化转型都是不可避免的。


    # 第三章


    元宇宙已经来临，它是互联网演化的下一个阶段。所以很快，我们可能不再通过智能手机或电脑查看内容，那可能成为过去。但我们将完全沉浸在数字环境中，并通过智能眼镜与世界各地的人进行互动。无论你喜不喜欢，它都会到来，并在未来七八年内成为一个
    8500 亿美元的行业。


    我们可以投资哪些业务来从元宇宙的崛起获利？让我们在本节寻找答案。


    什么是元宇宙？我给过元宇宙几种定义，但它们都归于同一个思想或概念。它现在是全球范围内的热词。元宇宙是一个通过智能眼镜访问的全沉浸式共享虚拟环境。在那里，我们的互动将是多维的。现在，我们如何与人互动？我们通过社交媒体互动，它是二维的，或者在某些在线游戏中最多是三维的。但通过元宇宙，我们的互动将是多维的
    4D，用户可以沉浸在数字内容中，而不仅仅是查看它。


    例如，想象未来像 Zoom 会议一样，你在在线看人的脸，但你身处一个虚拟环境中，带着化身在任何你想要创建的奇幻幻想地点与世界各地的人见面。另一个例子是，你可以通过沉浸式环境与世界另一端的人下棋。如果你还记得那部电影质感的
    `player1`，它完全就是那样。


    当你在虚拟世界中戴上眼镜时，你可以和地球另一端的人跳舞。在更极端的情况下，你可以从沙漠中冲浪，或者进行像《黑客帝国》中的任何事情。元宇宙将改变我们工作、游戏和学习的方式。


    '
