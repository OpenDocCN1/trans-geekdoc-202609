- raw: 'Below is a bunch of metaverses specific cryptocurrencies. They are axie, mana,
    sand, Enjin, and so forth. Buying and holding these tokens is a direct way of
    investing in the metaverse journey.


    ![](Image00001.jpg)


    Another approach altogether is investing in the blockchains that serve as the
    infrastructure behind these metaverse ecosystems by looking at the likes of ethereum,
    Solana, Cardano, Polkadot, and especially the Polkadot avalanche polygon and so
    forth.


    ![](Image00002.jpg)


    These metaverse use cases ramp up. The quality layer one and layer two stand to
    benefit, so investing in these blockchains might be the safer and wiser idea because
    you''ll also be diversifying beyond just the specific metaverse use cases. These
    are cryptocurrencies you can dollar-cost its average over the years and hold on
    for a long run. If you buy specific metaverse tokens, especially the smaller cap
    ones, you''ll need to babysit them closer.


    Polkadot is one of the layers to watch out for among these blockchains because
    it is all about interoperability and connecting the different blockchains, mostly
    operating as silos. That will be increasingly important as you can share your
    digital assets and NFTs across other blockchains going into the future. You don''t
    need your ethereum based NFTs to be stuck on ethereum. Also, you don''t need your
    Solana assets to be stuck on Solana and cardinal assets to be stuck there. You
    need interoperability which is Polkadots primary mission. So that is something
    to keep a watch out for.


    Blockchains and crypto are one approach to building the Metaverse. Don''t forget
    that all other companies are away from the blockchain and doing their part, including
    big tech ones. We''re talking about a 100 trillion dollar stock market. The obvious
    choice is the meta platforms. The tech giant was formerly known as Facebook who
    had already made significant investments in virtual reality before their rebranding,
    including the 2014 acquisition of a VR company Oculus. Mark Zuckerberg, having
    worked out on Facebook rebranding, is super bullish for the Metaverse. He believes
    he could replace the internet as we know.


    Microsoft


    Microsoft is developing mixed and extended reality applications with its Microsoft
    mesh platform. It''s a big project combining the real world with VR and hologram
    technology. They will integrate some of this tech into Microsoft teams for those
    working from home. Soon, you''ll bring mixed reality features like holograms and
    virtual avatars into your conference calls which is pretty interesting.


    Don''t forget the stocks that relate to infrastructure. You''ve got hardware companies
    like Nvidia, which are the biggest maker of graphics and AI chips. You''ve got
    Amazon with its cloud computing infrastructure that''s often compared to the role
    ethereum plays in the crypto space. Many businesses are built on Amazon web services,
    just like tons of Dapps built on the ethereum blockchain.


    All these supporting companies are important because as metaverse adoption ramps
    up, the need for computing power and data infrastructure can only increase. There
    are a host of other players creating content for the Metaverse. For instance,
    you''ve got epic games, the company behind Fortnite, whose CEO is very bullish
    on the Metaverse. They''ve already hosted virtual concerts by Ariana Grande and
    Travis Scott. They''re developing photo-realistic digital humans with their meta-human
    creator, which could customize your digital doppelganger in future open-world
    games. The only problem in the epic games at the moment is that they are not a
    public company, but if they ever go public, there''s going to be tons of interest.


    Unity Software


    You''ve got unity software which makes the most widely used engine in the entire
    video game industry. The firm believes they''re in a position to help content
    creation for the Metaverse. Finally, we will mention Roblox, the online game platform
    that hosts user-generated content and games scores. On the day Roblox went public
    on the stock market, its CEO tweeted a big thank you to all those who helped bring
    the company one step closer to fulfilling its vision of the Metaverse. Since then,
    they''ve teamed up with Shoe company vans and fashion houses like Gucci, where
    you can try out clothing and accessories for your virtual avatar.


    In summary, if we look at where we are right now, millions of people are spending
    hours a day in virtual spaces and gaming platforms such as Roblox and Fortnite.
    Globally 2.7 billion people are classified as gamers, and this translates into
    a 200 billion dollar annual industry, and that''s just gaming alone.


    Virtual productivity platforms are growing fast, especially in the wake of covid
    19. With Facebook and Microsoft announcing new ways to collaborate online, we''ve
    got hybrid offices, video-based education, and online social communities, which
    are just a few ways in which our lives are spent in digital spaces. We''ve got
    NFTs and virtual assets taking off. Even Nike is getting in on the action with
    virtual sneakers.


    Bloomberg believes that the Metaverse will be an 800 billion market by 2024. Forbes
    believes that we''ve got an eight trillion dollar total addressable market to
    become the next social media generation. Facebook''s pivot underscores that the
    Metaverse isn''t an extension of the internet but its successor.


    Mark Zuckerberg wants to be at the forefront of this movement, but no one company
    will build the Metaverse even to his knowledge. This journey will be a global
    technology movement and will take at least another ten years. The Metaverse will
    be a fully integrated techno society like fire, electricity, the internet, and
    AI. Assimilation is inevitable, resistance is futile, and those that get in as
    investors now should be handsomely rewarded.


    # Chapter Three


    The Metaverse is upon us, and it is the next stage of internet evolution. So pretty
    soon, we may no longer be viewing digital content through uh smartphones or computers,
    which could be a thing of the past in the future. But we will be fully immersed
    in a digital virtual environment and interacting with people worldwide through
    smart glasses. So like it or not, it''s coming, it''s going to happen, and it''s
    an $850 billion industry in the next seven or ten years. What are the stocks of
    businesses that we can invest in to profit from the rise of the Metaverse? Let''s
    find out in this section.


    What is the Metaverse? I have given several definitions of the Metaverse, but
    they boil down to the same idea or concept. It is now the new buzzword all around
    the world. The Metaverse is a fully immersive shared virtual world environment
    that we access through smart glasses. It is where our interactions will be multi-dimensional.
    Right now, how do we interact with people? We interact through social media, and
    it''s two-dimensional or, at the most, three-dimensional in certain online games.
    But through the Metaverse, our interactions will be multi-dimensional 4D where
    users can immerse themselves into digital content rather than simply viewing it.


    For example, think in the future like a zoom meeting where you look at people''s
    faces online, and you''re in a virtual environment with an avatar meeting people
    all around the world in whatever fantastic fantasy location you want to create.
    For another example, you could be playing chess with someone across the world
    through an immersive environment. So if you remember that movie-ready player1,
    it''s exactly like that.


    When you put in glasses in a virtual world, you can dance with someone halfway
    around the globe. To a more extreme extent, you could go surfing from the desert
    or anything like in Matrix. The Metaverse is going to change the way we work, 
    play, and learn. I don''t know about you, but I find it pretty exciting and pretty
    unique. For example, in the future, how would you work? You will no longer use
    a laptop or tablet to click on apps, but you put on the glasses, and the apps
    would be all around you.'
