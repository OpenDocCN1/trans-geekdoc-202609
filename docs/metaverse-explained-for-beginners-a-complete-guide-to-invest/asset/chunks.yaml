- raw: 'Web 3 does not refer to anyone''s specific program but groups of projects
    backed by cryptocurrency working together to create an ecosystem of decentralized
    internet services. Well, what services? It could be everything from decentralized
    social media rather than news controlled by a single corporation that can squash
    any ideas they don''t like to have an open forum where users can freely debate
    and express themselves. The decentralized data is where users can have control
    and privacy over their data. How? Through the use of cryptocurrencies blockchain
    technology. It allows users not to be reliant on any single government or corporation
    to do whatever they want.


    Before we dive into how web 3 works, let''s first go back and understand the history
    of web 1.0. In the 1990s, the dot.com era, websites served a role similar to traditional
    media where information was one-sided and consumers could consume. Websites like
    yahoo are charged to be at the top of the search results regardless of how many
    people clicked on the link, similar to how print newspapers charge for ads.


    Then with the proliferation of social media, web 2 was born, and the emphasis
    switched to trending popular content that other users created. The line between
    content consumer and producer was blurred, but a host of problems arose from web
    2. The most prominent of which is censorship and privacy issues. The Megatech
    giants like Google, Facebook, and Twitter openly squash any discourse that doesn''t
    fit their narrative. Donald Trump was banned from social media, so if an active
    US president who''s a billionaire can''t even talk freely, what chance do you
    have. Web 3 remarks the architecture of the internet to allow users not to be
    dependent on any single corporation or government so they can do whatever they
    want.


    This section will go over some of the basic components of web 3 and some of the
    leaders in this space. These basic components range from domain name registry
    to cloud data storage and computer processing, called smart contract platforms
    in the crypto tongue.


    ###  


    ### Domain Name Registry


    Under the current system, when you go to a website, let''s say google.com, the
    part before the dot is the subdomain, which is Google. The part after the dot,
    which is com is the top-level domain. The top-level domain rents the domain to
    the sub. So the VeriSign, which owns dot com top-level domains, rents it to google.
    You can never own a dot com or a dot net domain.


    In contrast with web 3, it''s an open marketplace where users can bid on their
    top-level domains. For example, one of the leaders in this space is the handshake.
    Their HNS token uses a vickery style auction allowing people to own and rent any
    domain they want.


    Now that''s a very brief explanation but let''s go on to the next component of
    web3, which is cloud data storage.


    ### Cloud Data Storage


    As we all know, the leaders of cloud storage in web 2 are Amazon and Google. But
    in web 3, many competitors aren''t engaging in censorship and aren''t spying on
    their users. Some of these competitors are Filecoin, Siacoin, and Arweave, but
    there are many more. Data is shared peer-to-peer, and people are incentivized
    to host and receive payment in the project''s native cryptocurrency.


    Either data is stored directly on the blockchain, or the blockchain is used to
    keep track of payments for who is hosting the data. For example, with Siacoin,
    data is split up into groups, and hosts put up collateral. If the host bounces
    before their paid hosting period is complete, they lose their collateral, incentivizing
    them to ensure no data is lost. In addition, there are many duplicate hosts for
    all the different groups.


    Another approach is how Arweave does it. Arweave incorporates all the data that
    ever was into the blockchain. When hosts call miners to update new information
    called a block of information, they must prove that all the previous information
    is included. That has the advantage of creating a permanent record that is extremely
    useful for recording history without censorship.


    The final component of web 3 is computer processing which in crypto is called
    a Smart Contract platform. With web 2, information is processed on a single company''s
    computer or network. But they can change the rules to whatever they want and censor
    or block users.


    On the other hand, with web 3, information is processed on the blockchain, making
    it permissionless and completely censorship-resistant. The code is called a contract
    because it''s an agreement between two parties to process the information on the
    blockchain. Some of the leaders in this space are Ethereum, Polkadot, Cardano,
    and even ICP or internet computers, combining a decentralized cloud with a smart
    contract platform.


    These are some of the basic bare bones of web 3, and you can buy all of these
    tokens discussed along with many more upcoming projects. While this is just the
    bare-bones infrastructure of how web 3 works, what users will do with their newfound
    free speech will be limitless.


    #  Chapter Seven


    ##  Metaverse Technology Concerning Health


    This section will look into how people have used the Metaverse to heal their bodies
    and change how their brains are wired to help them achieve amazing things. It
    may come as a surprise as the most recent news about Metaverse has been about
    turning us into mindless drones. While that''s a possible outcome, I thought we''d
    take a look at the brighter side of the multiverse.


    We are looking at research-based measurable effects that happen to people in the
    Metaverse and how the outcomes can be replicated at home or in a clinical setting.
    This section of this book is 95% science and 5% of my opinion and speculation.


    So let''s recap what the Metaverse is? The Metaverse is a catch-all term to describe
    the blending of real and digital spaces. It encompasses Augmented mixed and Virtual
    reality. Most people access the Metaverse through phones, but ultimately we will
    use a headset of some sort, likely a streamlined version of Oculus, magic leap,
    and hololens.


    As a builder, I spend a lot of time in a headset and front of a computer, and
    pretty early, I started to wonder if this kind of extreme screen time would be
    bad for me. I have a gene that makes me susceptible to macular degeneration, so
    I''m naturally very concerned about my eye health. I''ve also wondered if being
    immersed in these very rich and detailed virtual experiences could affect or change
    how my brain makes neural connections and possibly shorten my already quite short
    attention span.


    It turns out that many people, especially parents and neuroscientists, wondered
    the same thing, and the early findings are pretty shocking. Some of the common
    negative effects of being in the metaverse range are motion sickness that you
    may have heard of already, and eye strain, and more severe things like seizures
    and permanent myopia or short-sightedness. That doesn''t even consider the mental
    health-related side effects of spending long periods in a world where everyone
    is a perfect avatar, but it''s not all bad, and that is what this section is all
    about.


    Research has found that even though current Virtual and Augmented simulations
    aren''t hyper-realistic, they are real enough that you can make neural connections
    after being in VR. This rewiring process is called neural plasticity.


    Neuroplasticity is highly researched and is something that you can measure with
    brain scans. It''s an ability you have for your entire life. Your brain is continually
    making new connections between brain cells and enforcing ones that you use all
    the time. Then consequently, also pruning connections that you don''t use very
    often.


    Neuroplasticity comes into play, especially if you injure your brain or body.
    For example, if you hurt your knee skin or suffered a stroke that damaged part
    of the motor cortex of your brain that controls your leg. Following that injury,
    you may have muscle weakness, or maybe your leg is completely paralyzed.'
