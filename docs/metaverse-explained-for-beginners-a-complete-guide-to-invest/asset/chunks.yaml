    bad for me. I have a gene that makes me susceptible to macular degeneration, so
    I''m naturally concerned about my eye health. I''ve also wondered if being immersed
    in these very rich and detailed virtual experiences could affect or change how
    my brain makes neural connections and possibly shorten my already short attention
    span.


    It turns out that many people, especially parents and neuroscientists, wondered
    the same thing, and the early findings are pretty shocking. Some of the common
    negative effects of being in the metaverse range are motion sickness that you
    may have heard of, and eye strain, and more severe things like seizures and permanent
    myopia or short-sightedness. That doesn''t even consider the mental health-related
    side effects of spending long periods in a world where everyone is a perfect avatar,
    but it''s not all bad, and that is what this section is all about.


    Research has found that even though current Virtual and Augmented simulations
    aren''t hyper-realistic, they are real enough that you can make neural connections
    after being in VR. This rewiring process is called neural plasticity.


    Neural plasticity is highly researched and is something that you can measure with
    brain scans. It''s an ability you have for your entire life. Your brain is continually
    making new connections between brain cells and enforcing ones that you use all
    the time. Then consequently, also pruning connections that you don''t use very
    often.


    Neural plasticity comes into play, especially if you injure your brain or body.
    For example, if you hurt your knee skin or suffered a stroke that damaged part
    of the motor cortex of your brain that controls your leg. Following that injury,
    you may have muscle weakness, or maybe your leg is completely paralyzed.

