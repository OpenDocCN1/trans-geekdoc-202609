  trans: '

    当你康复时，医生可能会送你去接受物理治疗，在物理治疗健身房里进行锻炼以帮助重建肌肉力量。如果你患过中风，还必须训练大脑在受损区域周围长出新的神经元，以便你重新获得对腿部的控制力。任何经历过物理治疗的人，即使只是由于轻微事故，都会告诉你，这个过程真的非常困难、枯燥，并且可能会让人沮丧。


    事实证明，越来越多的证据表明，如果你将某置于 VR 体验中，然后让他们进行同样的实际练习，但通过将他们放入视频游戏中并将这些练习与有意义的沉浸式体验连接起来，那么这也是一种物理治疗。


    他们可以更快、更有效地自我疗愈。通过这种 VR 体验，他们的大会在受损区域周围生长神经元，让该个人拥有更大的活动能力、重新行走或恢复力量。已经有一些公司正在利用增强现实和虚拟现实来欺骗你的大脑，启动这种神经塑性过程，从而建立新的神经连接。


    其中一家公司是总部位于德克萨斯州的初创公司，名为 `Neuro-Rehab VR`。坦率说，当我发现这是真的并有神经科学支持时，我非常兴奋能与这家初创公司合作。他们已经在全美的诊所和医院建立了
    VR 物理治疗模拟系统。看到一家公司用 VR 改变生活真是太酷了。他们正致力于开发一种可以在家里使用的 VR 应用。所以，如果你需要物理治疗或正在从运动伤害中恢复，它将变得超级易于获取。


    世界上许多其他公司正在使用元宇宙来帮助你的大脑变得更好，我最喜欢的包括 `helium`，它有一个沉浸式应用可以帮助你冥想，并训练你的大脑保持更长时间的冥想状态。


    `Fundamental VR` 拥有一个增强现实和虚拟现实应用，用于帮助外科医生进行复杂的操作和程序。当他们第一次进行手术时，已经拥有了肌肉记忆和经验。最后我要提到的是
    `oxford VR`，它可以帮助患者克服恐惧和恐惧症，最少只需两个小时，这太神奇了。


    进入 VR 和神经科学的尖端领域一直是我最新的痴迷所在，或者至少是我最新痴迷的核心，这是一个我正在密切关注并想要投资领域。


    所以我们说的是，增强、混合现实和虚拟现实等元宇宙技术能够改变思维模式或心态，并帮助人们更快地实现目标。这本质上是按需个人成长，而且通过神经塑性，目标不必是非与物理治疗或力量相关的（如我们在神经康复中看到的那）。他们还在讨论帮助人们重塑大脑，帮助他们获得理想工作、寻找浪漫伴侣、创业、积累财富、实现财务自由、减肥。这些都是自我帮助行业试图销售价值数十亿美元的元素。


    让我们看看科学如何说，目前神经科学研究告诉我们这可能发生。目前的研究显示，大师冥想者可以专注于特定的状态，在该状态下他们产生的脑波通过思想和情感的结合重塑他们的神经回路。没有人像手术刀和电极那样进去帮助冥想者。他们在大脑内部就完成了这一切，这太了不起了。


    如果你听过像吸引力法则或显化之类的东西，这就是这些实践正试图触及并实现的。尽管尽管如此，我认为它们往往无法真正做到这一点，因为这些类型的活动本身不足以触发大脑的物理或化学变化。但如果有一种选择，从应用商店获取一个
    `29.99 VR app`，它能诱导那种情绪反应和脑波模式，你可以每天使用一次来调整你的思维模式，并让你以一种将获得超级成功的方式采取行动，你将会这样做。


    这听起来比花费 10 年学习如何成为超级冥想者要容易得多。如果你想在家里复制这一点，它是完全可行且令人兴奋的。他们拥有一个装饰过的 3d 空间，包含通往他们书签元世界的入口，以及一个为了优化运行而定制的
    3d 工作环境。技术是好的，但它还有更多可能。


    回到故事的开头，我曾担心宇宙可能对健康有害，但如果使用得当，它对大脑可能是很棒的。尽管这看起来是可选的，但我认为我们应该推动它成为元宇宙的一部分。


    # 第八章


    ## 2040 年技术预测


    2040 年，世界由于多种技术进步将看起来完全不同。例如，元宇宙将成为日常生活的基础。到 2040 年，许多大型科技公司将对元宇宙做出重大贡献，元宇宙将在大多数年龄层中获得普及。普通人使用元宇宙及其相关硬件将就像我们现在使用互联网和智能手机一样。


    2040 年的普通人可能拥有极其精细且真实的 3d 形象，并有几种预设服装以及成百上千的单件物品可供选择。他们可能拥有装饰过的 3d 家庭空间，包含通往他们书签元世界的入口，以及一个为了在环境中优化运行而定制的
    3d 工作环境。


    数字资产可以跨设备访问，如虚拟现实头显、增强现实眼镜、智能手机、智能手表等。这些资产可以在以前通常不相关的多个应用程序中使用。元宇宙中可能存在各种虚拟环境。这些用途超出了纯娱乐。这些用途将包括健身、教育、职业培训、产品演示、虚拟主题演讲、购买虚拟和实体物品的市场等。此外，我们可以在大多数主要城市和机构叠加用户生成的特定位置投影，提供导航、评论和历史事件的
    3d 动画。


    ### 脑机接口可能变得主流


    技术专家和未来学家雷·库兹韦尔预测，21 世纪 30 年代中期我们将开始将人类新皮层连接到云端。到 2040 年，这个预测可能会实现。脑机接口将比 2030
    年的版本大改进，并在很大程度上用于日常。它们还可能成为虚拟现实头显的标准配件，包括提供全沉浸式 VR 体验的高价头盔。某些脑机接口可以为了医疗目的进行完全植入。


    人们可以使用脑机接口在现实游戏和虚拟环境中控制物体，具有很高的准确性，尤其是在娱乐方面。视频游戏工作室可能会开始将这种技术整合到他们的视频游戏中。例如，用思想控制物体的能力在玩具有原力能力的绝地武士和西斯的《星大战》游戏中，以及在扮演主角的《黑客帝国》游戏中将特别适用。

