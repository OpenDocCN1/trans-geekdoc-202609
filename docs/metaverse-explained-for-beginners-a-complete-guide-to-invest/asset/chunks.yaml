    If you''ve had a stroke, you also have to train your brain to grow new neurons
    around the damaged area so that you can regain control of your leg. Anyone who
    has been through physical therapy, even for a minor accident, will tell you that
    it is really hard, boring, and can be demoralizing.


    It turns out that there is a growing body of evidence that if you put someone
    in a VR experience and then get them to do the same practical exercises but connected
    to a meaningful immersive experience by basically putting them in a video game,
    that is also physical therapy.


    They can heal themselves much faster and more effectively. From that VR experience,
    their brain will grow neurons around the damaged area and allow that person to
    have more mobility, walk again or regain strength. A couple of companies out there
    leveraging Augmented and Virtual reality to trick your brain into jump-starting
    this process of neural plasticity to make new neural connections already.


    One of those companies is a texas-based startup called Neuro-Rehab VR Full Disclosure.
    When I discovered that this was real and supported by neuroscience, I was excited
    to start working with this startup. They have set up VR physical therapy simulations
    in clinics and hospitals all over the US. It is so cool to see a company changing
    lives with VR. They are working on having a VR app that you can use at home. So,
    if you need physical therapy or recovering from a sports injury, it will be super
    accessible.


    There are a lot of other companies out there using the Metaverse to help make
    your brain better, and some of my favourites are helium which has an immersive
    app to help you meditate and train your brain to stay meditative state longer.


    Fundamental VR has an Augmented and Virtual reality app to help train surgeons
    to do complex operations and procedures. They already have muscle memory and experience
    when they go to do an operation for the first time. Then the last one I will mention
    is oxford VR which helps patients overcome fears and phobias for as little as
    two hours which is amazing.


    Getting to the outer reaches of VR and neuroscience has kind of been my latest
    obsession or at least the core of my latest obsession, and it''s a space that
    I''m watching closely and that I want to invest in.


