  trans: '


    残酷的现实是，元宇宙投资对大多数投资者来说并不合适。我想和你们分享一些投资元宇宙的经验。以下是我在过去五中学到的东西，也是我在 2022 年正在寻找的重点。我想就如何利用下一次技术变革给你们提供一些见解或想法。


    首先，让我们从另一个角度来看元宇宙？元宇宙是现实空间与数字空间的融合。它包含了增强现实、混合现实和虚拟现实。还有很多内容，但元宇宙是移动互联网的继任者。这种迭代并不是关于进入更小的电脑，而是进入一个完全连接且沉浸的世界或多个世界。


    Adobe 提供了一个极好的例子，展示了元宇宙如何无缝地取代我们目前在手机和电脑上的用途。元宇宙不仅仅限于娱乐。它包含了我们工作、医疗以及与他人协作的地方。它还是我们的教育场所，让我们学习导航和日常实用任务等逻辑知识。他们正在构建一个未来的
    AR 站点、一个平台和一个创作系统，人们可以在那里以元宇宙原生格式创建他们每天使用的所有程序、DIY 项目和检查清单。


    其中一些内容非常具有技术性，比如修理战斗机的燃油管，但另一些只是日常琐事，比如制作完美的香蕉包。当这项技术被正确应用时，你甚至察觉不到它的存在。它是一种直观的幕后型技术，现在这里有很多机会。


    ## 风险投资


    在过去的五年里，我与数百位风险投资人、天使投资人以及私募股权公司的合伙人交流过，我自己也成为一名投资者。我知道你们中有多人处于投资者社区，并对投资元宇宙初创公司感兴趣。


    残酷的现实是：元宇宙投资对大多数投资者并不合适。元宇宙技术非常小众，行业仍处于极早期，再次强调，我们就像 1996 年的互联网。当我与投资者交流时，他们希望在五年或更短时间内看到典型的回报或
    ROI（投资回报）。如果你是这个领域的新手，这意味着当投资者提供启动资金以换公司的股权或部分所有权时，他们期望该初创公司能在五年左右被收购或进行 IPO（上市）。


    如今的公司很少能在五年内实现 IPO，如果真的能实现的话话。他们预期你在五年内被收购或购买。对于今天的大多数元宇宙公司来说，这并不是一个现实的预期。投资者需要做长远打算，而不是每个投资者都能做到的一点。增加复杂性的是，初创公司将为元宇宙创造最大的价值，并成为下一个独角兽或构建幕后产品的公司。


    这些产品并不总是容易理解，因此长 ROI 周期和热门公司这些因素的结合，使得概念的构化变得困难，并让风险投资与元宇宙之间的关系变得复杂。它只适用于特定类型的投资者。


    ## 元宇宙如何取代传统技术


    让我们看看元宇宙如何取代传统的科技形式。这将为我们即将讨论的市场机会提供一些背景。


    我认为许多人（包括投资者在内）都期望增强和虚拟现实会在一夜之间完全取代目前的模式。手机会突然消失，每个人都会戴上耳机，但从历史上来看，这种情况并没有发生。


    起初，新技术是叠加的，随着时间的推移，它会取代那些传统形式。我们在音频领域看到这一点。最初你只能通过物理收音机听广播节目，但在互联网历史的早期，你就可以在线听广播节目了。它还是你在
    AM 或 FM 频道听到的同一个节目，只是作为一种消费方式被增加到了互联网上。


    然后随着时间的推移，我们开始获得仅在在线提供的广播节目。这变成了播客，现在我们有了整整一代人只通过播客消费长音频内容。这是一个巨大的转变，它是分阶段发生的。它不是一夜之间发生的。


    另一个目前的例子是《堡垒之夜》中的 Travis Scott 演唱会和 Roblox 中的 Lil Nas X 演唱会。这些艺术家并没有取代传统演唱会。他们只是增加了这些形式来与粉丝联系，并作为粉丝消费他们音乐的方式。我们今天拥有的许多习惯将逐渐过渡到虚拟空间。正如我之前提到的，这不是一次性的转变，而是通过小步渐式的步骤发生的。


    ### 市场机会


    现在我们进入了激动的部分。根据彭博社的数据，到 2024 年，元宇宙的市场机会将达到 8000 亿美元。所以，可以看到元宇宙的价值和机会。


    ## 你如何投资？


    以下是我 2022 年关注的，它分为三类：指数、股票和时间。


    ### ETF


    第一个元宇宙指数是全球第一个旨在追踪元宇宙表现的指数。它由全球上市公司的分层加权组合组成，例如 `Nvidia`、`Roblox`、`Cloudflare`、`Snap`（拥有
    `Snapchat`）、`Unity3d`、`Facebook` 和 `AutoDesk`。它们都积极参与了元宇宙的建设。还有很多，但那只是其中几个。你可以通过你选择的券商搜索并查阅这个
    ETF。


    ### 股票


    元宇宙中一些特定的上市公司是可以购买股票的，以及来自平台角度的领先者。你可以关注的上市公司有如 `Unity`、`Nvidia`、`Qualcomm`、`Broadcom`
    以及任何无线塔公司如 `Verizon`。


    还有幕后架构公司，为元宇宙运行提供所有支持。那里是最大的机会所在。在我看来，这个类别还包括内容公司，我认为你们中的一些可能对此感兴趣。我个人将关注流媒体平台
    `Netflix`、`Hulu`、`Disney` 和 `Amazon` 如何适应在沉浸空间生成内容。我提到的 Travis Scott 演唱会去年通过虚拟演唱会赚了
    2000 万美元。事实很大程度上表明，人们也会为沉浸空间中其他类型的媒体付费。


    我提到的两个类别涉及上市公司，排除了所有私公司和初创公司。除非你在风险投资社区，否则你不会获得投资这些公司的机会。有一些选择，如 `Republic`、`StartEngine`
    以及其他几个任何人都可以投资的众筹风投平台。


    投入时间学习和如何使用这些技术是投资这类公司的一种方式。它们正在发展，这可能意味着学习为特定的头设备开发软件，例如为 `Magic Leap One` 使用
    `Lumen`，或为新兴平台 `DressX` 创建内容。这到目前为止是最不直接投资的方式，但如果你这样想，这个类别类比于 2007 年开发移动应用程序或
    2006 年创建在线视频。它让你在格局发展时，处于一个可以利用这些技能的绝佳位置。


    '
