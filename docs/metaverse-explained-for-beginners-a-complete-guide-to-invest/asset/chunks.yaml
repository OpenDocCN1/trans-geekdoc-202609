  trans: '


    Web 3 并不是指任何特定的程序，而是指由加密货币支持的项目组，它们共同工作创建一个去中心化互联网服务的生态系统。那么，是哪些服务呢？它可以涵盖从去中心化的社交媒体（而不是由单一公司控制的新闻，公司可以打压任何他们不喜欢的观点）到让用户可以自由讨论和表达自我的开放论坛。去中心化数据让用户对自己的数据拥有控制权和隐私。如何？通过使用加密货币和区块链技术。它允许用户无需依赖任何单一政府或公司即可随心所欲。


    在我们深入研究 Web 3 如何工作之前，让我们先回到过去理解 Web 1.0 的历史。在 20 世纪 90 年代的 dot.com 时代，网站的角色类似于传统媒体，信息是单向的，消费者只能进行消费。像
    `yahoo` 这样的网站，无论有多少人点击链接，都会被排在搜索结果的前列，这就像纸质报纸收取广告费一样。


    随着社交媒体的普及，Web 2 诞生了，重点转向了其他用户创建的热门内容。内容消费者和生产者之间的界限变得模糊，但 Web 2 也引发了一系列问题。其中最突出的是审查和隐私问题。像
    `Google`、`Facebook` 和 `Twitter` 这样的科技巨头公开打压任何符合他们叙述的言论。唐纳德·特朗普被社交媒体封禁了，所以如果一个亿万富翁的活跃美国总统都不能自由说话，你又有什么机会呢。Web
    3 标志着互联网架构的变化，允许用户不再依赖任何单一公司或政府，从而让他们随心所欲。


    本节将介绍 Web 3 的一些基本组件以及该领域的一些领导者。这些基本组件从域名注册中心到云数据存储和计算机处理（在加密货币术中被称为智能合约平台）。


    ## 域名注册中心


    在当前系统中，当你访问一个网站时，例如 `google.com`，点之前的部分是子域名，即 `Google`。点之后的部分（`com`）是顶级域名。顶级域名将域名租给子域名。因此，拥有
    `dot com` 顶级域名的 `VeriSign` 将其租租给了 `google`。你永远无法拥有 `dot com` 或 `dot net` 域名。


    与 Web 2 不同，Web 3 是一个开放市场，用户可以对自己的顶级域名进行竞标。例如，该领域的领导者之一是 `handshake`。他们的 `HNS`
    代币使用维克里拍卖模式，允许人们拥有和租赁他们想要的任何域名。


    现在这是一个非常简短的解释，但让我们进入 Web 3 的下一个组件，云数据存储。


    ## 云数据存储


    众所周知，Web 2 中云存储的领导者是 `Amazon` 和 `Google`。但在 Web 3 中，许多竞争者并不参与审查，也不监视他们的用户。这些竞争者包括
    `Filecoin`、`Siacoin` 和 `Arweave`，但还有更多。数据是点对点共享的，人们通过项目的原生货币获得奖励。数据要么直接存储在区块链上，要么使用区块链来记录谁在托管数据的支付。例如，使用
    `Siacoin`，数据被分成若干组，托管者需要押金。如果托管者在付费托管期结束前消失，他们将失去押金，这激励他们确保数据不丢失。此外，所有不同的组都有许多重复托管者。


    另一种方法是 `Arweave` 的做法。`Arweave` 将曾经存在的所有数据都整合进区块链。当托管者调用 `miners` 来更新被称为“信息块”的新信息时，他们必须证明所有之前的信息都包含在内。这样做的优点是创建一个永久记录，对于不受审查地记录历史极其有用。


    Web 3 的最后一个组件是计算机处理，在加密领域中被称为智能合约平台。在 Web 2 中，信息在单家公司的计算机或网络上处理。但他们可以随自己的意愿更改规则，并审查或阻止用户。


    相反，在 Web 3 中，信息在区块链上处理，使其具有无许可性且完全的抗审查性。代码被称为“合约”，是因为它是双方之间关于在区块链上处理信息的协议。该领域的一些领导者包括
    `Ethereum`、`Polkadot`、`Cardano`，甚至还有 `ICP` 或互联网计算机，它们将去中心化云与智能合约平台相结合。


    这些是 Web 3 的一些基础骨架，你可以购买这里讨论的所有代币以及许多其他即将推出的项目。虽然这仅仅是 Web 3 运作的最基础基础设施。


    ## 第七章：涉及健康的元宇宙技术


    本节将探讨人们如何利用元宇宙来治愈身体并改变大脑的连接方式。我们关注的是临床环境中发生的基于研究的可衡量效果。这本书的这部分 95% 是科学，5% 是我的观点和推测。


    所以，让我们回顾一下什么是元宇宙？元宇宙是一个描述现实与数字空间融合的总术语。它包含了增强现实、混合现实和虚拟现实。大多数人通过手机访问元宇宙，但最终我们将使用某种头戴设备，可能是
    `Oculus`、`magic leap` 和 `hololens` 的简化版。


    作为一个开发者，我长时间坐在头戴设备和电脑前，很早我就担心这种极端的屏幕时间是否对我有害。我有一个容易患黄斑变变性的基因，所以我自然很担心我的眼睛健康。我还在想，沉浸在这些丰富的虚拟体验中是否会影响或改变我大脑连接的方式，并缩短我已经很短的注意力。


    事实证明许多人，特别是父母和神经科学家也有同样的疑问，早期的发现相当震惊。元宇宙的一些常见负面影响包括可能听过的晕动症、眼睛疲劳，以及更严重的问题如癫痫和永久性近视。这甚至还没有考虑到在一个每个人都是完美化身的世界里长时间待着对心理健康产生的副作用，但它并非全是坏事，这正是本节的重点。


