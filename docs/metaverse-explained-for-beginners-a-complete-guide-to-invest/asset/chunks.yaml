  trans: '

    还记得汤姆·克鲁斯主演的电影《少数报告》吗？他在片中滑动物体、扩展物体，甚至像《钢铁侠》中的托尼·斯塔克那样，通过全息移动物体。这就是元宇宙将发生的情况。我们的应用程序将环绕在我们身边，我们将从虚拟空间中提取或存文件。想象一下未来的会议，我们将通过化身，在任何我们想要的的环境中与世界各地的人会面。


    你不会感到惊讶，这一切演变可能会杀死像 Zoom、智能手机或平板电脑这样的产品，它们在未来可能会过时。假设像苹果或三星这样的公司在未来没有转向这个元宇宙，他们的产品可能会像过去的录像带一样过时，因为技术变化得太快了。


    同样有趣的是，元宇宙将如何改变我们玩游戏的方式。如果你看过 Facebook 将其更名为 Meta 的视频，你只需要戴上眼镜，就可以与另一个国家的人进行击剑。你看到他们的化身，他们也能看到你，然后开始击剑。


    教育也可能非常迷人。想象一下戴上那些智能眼镜，你可以进入人类的身体内部，触摸心脏并观察器官之间如何相互作用。你可以处于外太空，滑动原子并扩张宇宙。这将是惊叹的。


    再次，这是一个预计到 2028 年价值接近 1 万亿美元的行业。有趣的是，世界上一些最大的品牌正在认真对待这一点，并现在正以他们独特的方式进入元宇宙。例如，Nike
    正在悄悄准备元宇宙。他们已经申请了七项商标，用于在元宇宙中销售虚拟品牌运动鞋和服装。


    ![](img/Image00003.jpg)


    再次，在未来的元宇宙中，我们将拥有化身并与全球的人互动。如果你想让你的化身好看一点，可以为化身购买 Nike 运动鞋、衣服和连帽衫。Nike 将在虚拟世界中把卖给你。他们现在正在创造所有虚拟
    Nike 配饰，不仅是 Nike，还有 Gucci。


    Gucci 最近创建了数字配件、套装和包，卖给 Roblox 上的用户。什么是 Roblox？Roblox 是一个非常像元宇宙的在线游戏环境。人们已经在这个在线游戏环境中互动，购买
    Gucci 衣服，进行交易并进行虚拟购物。他们最近在 Roblox 上开放了一个 Gucci 花园空间。他们以 1 美元到 9 美元不等的价格数字销售了这些
    Gucci 配饰、Gucci 眼镜、Gucci 包和 Gucci 衣服，有些人成功地转售了它们。他们以 4 美元 75 分买入，然后在 Roblox 平台上将这个
    Gucci 包（虚拟数字包）以 4000 美元卖出。


    ![](img/Image00004.jpg)


    元宇宙将创造数百万的财富，就像在物理环境中一样。品牌和公司现在认真对待这一切的原因是，他们意识到这不再是一种趋势或幻想。它正在发生。进入元宇宙将成为品牌保持相关性的必要条件。


    # 应该购买哪些股票


    哪些公司的股票对于创建、构建和维护元宇宙至关重要？这些公司也将将从互联网的新一次演变中获益。数百只股票将从元宇宙中受益，但我将关注主要的几只，并将它们分为核心元宇宙股票。


    ## 公司


    第一类是涉及硬件、操作系统和元宇宙软件的公司。这些公司创建智能眼镜并将其推向新水平，并且已经在创建驱动元宇宙的操作系统的过程中。我们还将包括通过云计算参与构建和维护元宇宙基础设施的公司。有很多公司，但我将重点关注的几个是：


    ### Meta


    除非你住在山洞里，否则你知道 Facebook 现在已自更名为 Meta。因此，他们的股票代码 `FB` 将在 12 月 1 日之前变为 `MVRS`。为什么
    Facebook 要更名为 Meta？这是他们成为元宇宙领先者的战略愿景。与竞争对手相比，他们拥有很好的领先优势。在硬件和软件方面，他们处于领先地位，因为他们拥有
    `Oculus` VR 头显设备、游戏。他们与 `ray-ban` 合作创建智能眼镜。紧随其后的是微软。


    ### Microsoft


    微软的首席执行官也表示他们将创建元宇宙的企业部分。他们预测未来专业人士将在这个虚拟环境中见面、协作和工作。微软还投资了 `hololens`。


    ### Amazon


    Amazon 也宣布了他们将进入元宇宙，创建虚拟经济和虚拟商店。构建和维护基础设施需要云计算。两个最强大的竞争者是 `Amazon Web Services`
    和 `Microsoft Azure`。还有 `Alphabet`。


    ## 内容创作工具


    元宇宙无法由一家公司或某个人创建。它将由全球数百万计算机程序员、设计师和开发者共同创造。这是一场全球性的协作，就像维基百科一样。因此，对于这些人创作创建元宇宙内容（如房地产、虚拟建筑），他们需要工具。提供创建这些环境工具的公司有哪些？


    ### Autodesk


    Autodesk 是建筑师、工程师和建筑人员的领先软件供应商。在建筑师进行物理建造之前，他们使用 `AutoCAD` 软件创建 3D 建筑。最近，Autodesk
    创建了一系列产品，允许计算机程序员创建 `VR` 和 `AR` 3D 建筑和模拟。


    再次，Autodesk 将成为人们创建元宇宙的重要工具。稍后我们将查看 `ADSK` 股票。下一只股票是 Roblox 的股票代码 `RBLX`。


    ### Roblox


    Roblox 是一个在线游戏平台，目前拥有 1.64 亿月活跃用户。你可以进入 Roblox 构建自己的游戏。你可以创建自己的游戏并玩其他用户创建的游戏。这些游戏就像带有化身的元宇宙游戏，你可以与其他互动。你可以与他们交易物品，从他们那里购买，平台内还有类似于虚拟经济的
    Roblox 本货币。


    就像在 Roblox 虚拟环境中出售的 Gucci 包一样，Roblox 平台将成为想要在元宇宙中创建游戏的人的重要工具。下一只股票是 Unity 软件的股票代码
    `U`。


    ### Unity Software


    Unity 软件也将是程序员用来构建元宇宙游戏的重要工具。他们是领先的 3D 视频游戏引擎设计者，用于自定义视频游戏玩家在游戏中如何移动和互动。 100 家游戏开发工作室中有
    94 家使用 `Unity engine`。


