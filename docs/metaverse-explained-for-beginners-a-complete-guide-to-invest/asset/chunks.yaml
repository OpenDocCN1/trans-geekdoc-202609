    # 第四章


    ## 元宇宙投资

    投资元宇宙可能是精明投资者赚取大钱的最极佳的机会之一。在 Facebook 最近更名为 `Meta` 以构建实现他们对元宇宙的愿景和解读之后，它引起了全球投资者对如何可能尽早投资这一领域，并从这一可能是完美投资的机会中获利的兴趣。


    事实上，有许多不同且令人兴奋的方式投资元宇宙，这不仅仅是投资股票。随着元宇宙越来越多地融入我们的日常生活，它成为我们越来越多参与其中的事物。它确实存在于一个稍微虚拟的世界中，我怀疑围绕它的投资机会随着时间的推移只会不断扩大。所以，让我们谈谈这些早期投资机会。


    ### 股票

    我想谈论的第一个投资机会是投资股票。这是大多数投资组合（包括我的）的基石。有很多不同的公司正在积极为元宇宙以及构建元宇宙生态系统的基础设施做出贡献。


    我们已经知道马克·扎克伯格（Mark Zuckerberg）已经勾勒了他构建自己的元宇宙的计划，并在社交连接的演变中占据一席之地。但这里有趣的是，元宇宙本身远超一家公司所能构建的，因为构建元宇宙的基础设施以及在其中进行的活动显然广阔得多。


    它包含了从在虚拟世界中与朋友一起玩游戏、访问现场活动和娱乐、不去健身房就能获得个人训练、与同事一起工作并在虚拟办公室见面，甚至在元宇宙中购物等一切内容。想象一下所有已经在运营、建立并拥有实体产品的公司，他们可以将产品转化为数字或虚拟产品。


    你拥有像 `Unity Software` 和 `Roblox` 这样的游戏公司，健身公司 `Peloton`，视频会议公司 `Zoom` 和 `Microsoft`，电子商务公司
    `Amazon` 和 `Shopify`。对于提到的所有这些公司都有无限可能。由于如此，你有许多机会在投资组合中获得这些股票的收益。看到哪些股票实际上能取得突破并开始投资以获得市场份额无疑是非常有趣的。我怀疑进入这一领域的先者优势是巨大的。


    元宇宙的市场机会或预测的市场机会预计到 2028 年将达到 8250 亿美元，并以 43.3% 的复合年增长率增长。因此，有很多机会投资那些通过投资元宇宙并拥有虚拟产品而从业务巨大增长中获利的公司。


    ### 元宇宙令牌

    接几个投资机会让情况变得更有趣。所以我们将开始谈论元宇宙代币。如果你访问像 `coinmarketcap.com` 这样的网站，你可以滚动并点击元宇宙标签，列出一些顶级的元宇宙加密货币代币。


