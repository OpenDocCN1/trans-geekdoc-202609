    我想你可以把这种比较比作在英国花费大量的英镑来买东西。对于这些所谓的虚拟世界或元宇宙（metaverses）也是如此。例如，你有拥有 `AXS` 代币的 `axie
    infinity`、拥有 `MANA` 代币的 `Decentraland` 以及拥有 `SAN` 代币的 `Sandbox`。


    投资者正在投资这些代币。他们使用这些代币在相应的元宇宙中购买物品，并将这些代币视为一种纯粹的投资机会进行投资，因为他们认为相应的元宇宙可能是下一个大趋势。有趣的是，自从
    Facebook 宣布重品牌以来，这些元宇宙代币的价值上涨了多少。即使你观察 `Decentraland` 代币并将其放在一年线图中，你可以发现该代币的价格从上涨
    75% 直达到 3.56 美元的市场巅峰，而且直到目前的市场价格，它的交易价格仍在每枚 3.17 美左右。我们谈论的是过去三周 300% 到 400% 的增长率。


    ![](img/Image00006.jpg)


    通过投资这些元宇宙代币，你本质上是依赖于相应的元宇宙随着时间的推移而变得受欢迎。随着需求的增加，你可以在元宇宙中购买物品，随着时间推高价格。


    这就是投资其中一些元宇宙代币时产生主观性因素的地方。`Decentraland` 的当前市值为六十亿美元，但究竟是什么定义了它呢？


    这一切归结为供需关系以及该领域内的潜在竞争。但为其中一些代币提供底层价值仍然相当困难。尽管如此，考虑到某些加密构建的元宇宙的预期增长，在我看来，其增长潜力可能是巨大的。


    ### 土地和房产

    当我说土地和房产时，我指不是物理意义上的土地和房产。指的是目前正在构建的一些元宇宙中的土地和房产。你真的可以购买描绘这些元宇宙中土地和所有权的像素。


    ![](img/Image00007.jpg)


    我们都知道迪士尼在几十年前做过的一项出色的投资，当时他在佛罗里达州的奥兰多购买了 27000 英亩的土地，每亩仅花费 182 美元。今天，那片土地本身价值数十亿美元，而同样的潜力机会似乎在元宇宙中也是可行的。你可能会对其中某些土地目前的售价之高而感到惊讶。如果我们想在
    `sandbox` 元宇宙上购买一些土地，点击“购买土地”按钮，它将带你进入许多人购买 NFT 和各种不同数字资产的地方。你可以看到某些土地是多么贵。这简直太荒谬了。


    ![](img/Image00008.jpg)


    如果你查看“最近出售”，你可以看到根据主题不同，合法的土地售价在 1.5 到 2 个 `ethereum` 之间。这目前的市场价格大约是 4500 美元。


    这种土地的价格向上空间大约为九千美元，仅仅是为了屏幕上的几个像素。然后一旦你购买了土地，它就会出现在元宇宙地图上，你可以看到许多带有不同图标的公司，他们已经在元宇宙内购买了土地。


    ![](img/Image00009.jpg)


    `Atari` 在上面的图像中脱颖而出。它是另一家似乎在 `sandbox` 元宇宙中购买土地的视频游戏公司。你可以看到数百个其他个人和潜在公司在 `sandbox`
    元宇宙中购买了土地。


    所以我想你可能会问，在这些元宇宙中投资和购买这些土地是如何一种投资机会。正如我之前提到的，随着越来越多的人使用这个元宇宙并使用其代币，待售的土地变得越来越稀缺，因为许多人已经买光了。本质上，这就变成了供需法则。当你有有限供应时，人们可以根据他们认为可以出售的价格要求的价格。


    有趣的是，你还可以你买回的土地上进行建设。基础设施更丰富的土地会吸引人们，如果你在以后某个时间出售它，你可以为此收取更多费用。如果你认为自己是某些元宇宙中相当精明的土地主和投资者，那么请务必去查看许多不同元宇宙中的一些市场。


    ### NFT 和可穿戴设备

    非同质化代币（NFTs）是人们认为在现实世界中没有任何价值的东西，但如果你在虚拟世界中使用并应用它们，它们可能具有巨大的价值，特别是当人类物种过渡到减少对物理资产和物品的重视，并开始对你拥有的数字资产和物品赋予更多价值时。


    ![](img/Image00010.jpg)


    你可能成为一个 `NFT` 的唯一所有者，你可以把它放在你的虚拟财产中，坐在你元宇宙的虚拟土地上，人们目前在那里炫耀他们的设计师服装和昂贵汽车。你可能在元宇宙中通过
    `NFTs` 和可穿戴设备看到同样的东西。这是一个有趣的概念，光是想想就确实让人大为观止。


    ## 元宇宙中的市场机会

    大多数时候，我认为只会是一群 12 岁的孩子使用这些元宇宙，并在虚拟世界中带着他们的化身到处跑，但现实完全不同。在这些平台上花费的资金绝对是天文数字，光是想想就令人大为观止。


    给你举一个 `axie affinity` 方面的例子，目前售出的最贵物品是 300 个 `ethereum`，根据今天的市场价格，这大约是 135 万美元，或者相当于一百多万。


    ![](img/Image00011.jpg)


    花费在其中某些数字资产上的资金是疯狂的。我们已经在 `NFT` 领域看到过，现在我们开始在这些元宇宙中看到。


