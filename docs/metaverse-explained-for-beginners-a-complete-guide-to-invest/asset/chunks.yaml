- raw: 'Remember the show minority report with Tom cruise where he''s swiping things,
    expanding things, or even how Tony stark does it in iron man, where you''ve got
    the hologram moves things around. That''s what will happen with the Metaverse.
    Our apps will be around us, and we will pull files in and out of our virtual space.
    Think about meetings in the future where we''ll meet with people worldwide through
    avatars in any environment that we want.


    You won''t be surprised that all this evolution may kill things like zoom, smartphones,
    or tablets that could be obsolete in the future. Suppose companies like Apple
    or Samsung don''t pivot to this Metaverse in the future. Their products may be
    as outdated as video cassettes in the past because technology is changing so fast.


    What''s also interesting again is how the Metaverse would change the way we play
    gaming. If you watch the Video by Facebook, where it renamed itself as meta, you
    can fence with someone from a different country just by putting on the glasses.
    You see their avatar, they see you, and you start fencing.


    Education could be fascinating as well. Imagine putting on those smart glasses,
    and you could be within a human body touching a human heart and seeing how organs
    interact. You could be in outer space swiping atoms and expanding the universe.
    It''s going to be amazing.


    Again this is an industry projected to be worth close to one trillion dollars
    by 2028. Interestingly, some of the biggest brands in the world are taking this
    seriously and are now entering the Metaverse in their unique way. So, for example,
    Nike is quietly preparing for the Metaverse. They have filed seven trademark applications
    to sell virtual branded sneakers and apparel in the Metaverse.


    ![](Image00003.jpg)


    Again, we will have an avatar in the future Metaverse and interact with people
    worldwide. If you want your avatar to look good, you can buy Nike sneakers, clothes,
    hoodies for your avatar. Nike is going to sell them to you in the virtual world.
    They are now creating all these virtual Nike accessories and not just Nike but
    Gucci.


    Gucci has recently created digital accessories, outfits, and bags, selling them
    to people on Roblox. What''s Roblox? Roblox is an online gaming environment that
    is very metaverse-like. People are already interacting in this online gaming environment,
    buying Gucci clothes, trading them, and doing virtual shopping. They have this
    Gucci garden space on Roblox that was open recently. They sold these Gucci accessories,
    Gucci glasses, Gucci bags, Gucci clothes digitally for between one dollar to nine
    dollars and some people managed to resell them. They bought it at four dollars
    and 75 cents, and they then sold this Gucci bag, a virtual digital bag, for $4000
    on the Roblox platform.


    ![](Image00004.jpg)


    There will be millions to be made from the Metaverse, just like in the physical
    environment. The reason brands and companies are taking this seriously now is
    because they realize it is no longer a trend or fantasy. It''s happening. Entering
    the Metaverse will become a necessity for brands to stay relevant.


    ## What are the stocks to buy


    What company''s stock will be essential for creating, building, and maintaining
    the Metaverse, which will also profit from the new evolution of the internet?
    Hundreds of stocks will benefit from the Metaverse, but I will focus on the main
    ones and divide them into essential metaverse stocks.


    ## Companies


    The first category would be companies involved in the hardware, the operating
    system, and the metaverse software. These are companies that create smart glasses,
    bringing them to the next level, and are already in the process of creating the
    operating system that will drive the Metaverse. We will also include companies
    involved in building and maintaining the infrastructure of the Metaverse through
    cloud computing. There are many companies, but the main ones I''m going to focus
    on are:


    ### Meta


    Unless you''re living under a rock, you know that Facebook has now rebranded itself
    as Meta. So their ticker symbol FB will become MVRS by the first of December.
    Why has Facebook rebranded itself as meta? It''s their strategic vision to be
    the leading player in the Metaverse. They have a pretty good head start over the
    rest of the competition in terms of hardware and software because of the ownership
    of the Oculus VR headsets, games, and the virtual reality headset.


    They have partnered with Ray-ban to create ray-ban stories, their latest version
    of the smart glasses. They are the ones leading the pack. Now very close behind
    and also collaborating with Meta is Microsoft.


    ### Microsoft


    The CEO of Microsoft has also said they will create the enterprise part of the
    Metaverse. That is where they foresee in the future; professionals will meet,
    collaborate and work together within this virtual environment using avatars. Microsoft
    has also invested in their own hololens smart glasses.


    ### Amazon


    Amazon has also announced how they will enter the Metaverse, create a virtual
    economy,  and virtual stores that you can visit in the virtual economy. For example,
    if you want to buy a shirt, you can have Virtual Tryons. To build and maintain
    the infrastructure for the Metaverse, you need cloud computing services. The two
    strongest players would be Amazon web services by amazon and Microsoft azure.
    Well, there are also alphabet web services. All these would be crucial in building
    and maintaining the metaverse infrastructure.


    ## Content Creation Tools


    The Metaverse cannot be created by one company or one person. It''s going to be
    created by millions of computer programmers, designers, and developers worldwide.
    It will be a global collaboration, just like Wikipedia. So for all these people
    to create content for the Metaverse like real estate, virtual buildings, and virtual
    avatars, they need tools. Who are the companies that provide those tools to create
    these metaverse environments? The first would be the Autodesk ticker symbol ADSK.


    ### Autodesk


    Autodesk is the leading software provider for architects, engineers, and people
    in construction. Before a builder builds physically, they use auto desk software
    known as AutoCAD to create the 3d buildings. Recently, Autodesk created a suite
    of products that allow computer programmers to create VR and AR 3d buildings and
    simulations like virtual reality and Augmented reality buildings and infrastructure.


    Again Autodesk would be an essential software tool that people would use to create
    metaverse environments. We will look at the ADSK stock more in a while. The next
    stock to look at would be the Roblox ticker symbol RBLX.


    ### Roblox


    Roblox is an online gaming platform with currently 164 million monthly active
    users.  You could go into Roblox and build your own game. You can create your
    own game and play games created by other users. These games are like a metaverse
    game with an avatar where you interact with other people. You can sell things
    with them, buy things from them, and there''s a local Roblox currency like a virtual
    economy within the platform.


    Like the Gucci bag sold virtually within the Roblox virtual environment, the Roblox
    platform will be an essential tool for people who want to create games within
    the Metaverse. The next stock would be the Unity software ticker symbolized as
    U.


    ### Unity Software


    Unity software will also be an essential tool that programmers will use to build
    metaverse games. They are the leading 3d video game engine designers used to customize
    how video game players move and interact within their games. 94 out of 100 game
    development studios use unity engine. Unity would be a central player in helping
    businesses build unique metaverse presences and environments. They''ve pro software
    and gaming services tools. There are other video game companies like Tech two
    interactive, Electronic arts, Metapod, etc. There are a few other stocks, but
    these are the main ones.


    ## Semiconductors'
