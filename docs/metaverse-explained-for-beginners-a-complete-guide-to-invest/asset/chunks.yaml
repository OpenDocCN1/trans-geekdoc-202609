    Adobe has a great example of how seamlessly the Metaverse could replace what we
    currently use on our phones and computers. The Metaverse goes beyond just entertainment.  It
    includes where we work, practice medicine, and collaborate with others. It''s
    our education where we learn logistical things like navigation and practical day-to-day
    tasks. They are building a future AR site, a platform, and an authoring system
    where people can create all procedures, DIYs, and checklists that they use every
    day in a metaverse native format.


    Some of these are super technical, like repairing a fuel line on a fighter jet,
    but others are just everyday things like making the perfect banana bread. When
    this technology is done properly, it''s not even something that you would realize
    is there. It''s an intuitive behind-the-scenes type of technology where there
    is a lot of opportunities right now.


    ## Venture Capital


    Over the last five years, I have spoken to hundreds of venture capitalists, angel
    investors, and partners at private equity firms and have become an investor myself.
    I know several of you are in the investor community and are interested in investing
    in metaverse startups.


    Here''s the harsh truth: metaverse investments are not a good fit for most investors.
    Metaverse tech is pretty niche, and the industry is still super early, and again
    we''re like internet 1996. When I speak with investors, they want to see a typical
    return or an ROI in five years or less. If you''re new to this space, that means
    when an investor gives startup money in exchange for equity or partial ownership
    in the company, they expect that the startup will either get acquired or have
    an IPO in about five years.


    Companies these days rare IPOs in five years, if at all. They expect you to get
    acquired or bought within five years. For most metaverse companies today, that
    is just not a practical expectation. Investors need to be in it for the long game,
    and just not every investor can do that. To add complexity to this, the startups
    will add the most value to the Metaverse and become the next unicorns or ones
    building behind-the-scenes products.


    These products are not always easy to understand, so those combined factors of
    having a long ROI period and hot companies make it difficult to conceptualize
    products and make the relationship between venture capital and the Metaverse complicated.
    It is only suitable for a particular type of investor.


    ## How The Metaverse Replace Traditional Techs


    Let''s look at how the Metaverse replaces traditional forms of tech. It will help
    give some context to market opportunities which we are going to discuss.


    I think many people, including investors, expect augmented and virtual reality
    to replace current modalities overnight completely. Phones will disappear suddenly,
    and everyone will be in a headset, but historically this doesn''t happen.


    At first, new technology is additive, and then over time, it replaces those traditional
    forms. We saw this with audio. Originally you could only listen to a radio show
    on a physical radio, but pretty early in the history of the internet, you could
    listen to radio broadcasts online. It was still the same radio show that you would
    hear over the AM or FM channels, and it was just added onto the internet as a
    way to consume it.


    Then over time, we started getting radio shows that were only available online.
    This turned into podcasts, and now we have an entire generation that only consumes
    long-form audio content via podcasts. It is a big shift, and it happened in little
    stages. It didn''t happen overnight.


    Another current example of this is the Travis Scott concert in Fortnite and the
    little Nas x concert in Roblox. These artists aren''t replacing traditional concerts.
    They''re just adding these to connect with their fans and a way for their fans
    to consume their music. Many of the habits we have today will transition little
    by little into virtual spaces. As I mentioned before, it''s not an all-one shift,
    and it happens in little gradual steps.


    ### Market opportunity


    Now we''re getting to the exciting part. According to Bloomberg, the market opportunity
    for the Metaverse is 800 billion dollars by 2024. So, see the value and opportunity
    in the Metaverse.


    ## How can You Invest?


    Here''s what I''m looking out for 2022, and it breaks down into three categories
    indexes, stocks, and time.


    ### ETF


    The first metaverse index is the first index globally designed to track the performance
    of the Metaverse. It consists of a tiered weighted portfolio of globally listed
    companies like `Nvidia`, `Roblox`, `Cloudflare`, `Snap`, which owns `Snapchat`,
    `Unity3d`, `Facebook`, and `AutoDesk`. All of them are actively involved in building
    the Metaverse. There''s a lot more, but that''s just a few of them. You can find
    this ETF by searching on the brokerage of choice and reading it up.


    ### Stocks


    There are some specific public companies in the Metaverse that you can buy stocks
    in and a leading player from platform perspective. You have public companies to
    watch out for like `Unity`, `Nvidia`, `Qualcomm`, `Broadcom`, and any wireless
    tower company like `Verizon`.


    There are end consumer platforms behind scenes architecture companies that provide
    all the support to make the metaverse run. That is where the biggest opportunity
    is. In my opinion, this category also includes content companies which I thought
    some of you might find interesting. personally will be keeping an eye on how streaming
    platforms like `Netflix`, `Hulu`, `Disney`, and `Amazon` will adapt to generating
    content in immersive spaces. The Travis Scott concert I mentioned made 20 million
    dollars from a virtual concert last year. The odds are that it''s a pretty good
    indication that people will pay for other types of media in immersive spaces too.


    The two categories I mentioned deal with public-traded companies, leaving out
    all private companies and startups. Unless you are in the VC community, you aren''t
    going to get the chance to invest in these companies. There are some options like
    `Republic`, `StartEngine` and a couple of other crowdsourced VC platforms that
    anyone can invest in.


    Investing your time in learning and how to use the tech is one of the ways of
    investing in this company. They are developing, and this could mean learning how
    to develop software for a specific headset, such as using `Lumen` for the `Magic
    Leap One` or creating content for an emerging platform like `DressX`. It is by
    far the least way to invest, but if you think of it this way, this category is
    analogous to developing mobile apps in 2007 or creating online Videos in 2006.
    It puts you in a great position to capitalize on those skills as the landscape
    develops.

