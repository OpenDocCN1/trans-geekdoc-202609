- raw: 'A new iteration of the internet is being worked on, which will have massive
    implications for society. Marketing, communications, and branding professionals
    will face new challenges but also new opportunities. This new era of Metaverse
    will unleash unique creativity and open new frontiers and horizons for brands
    and businesses.


    For individuals with entrepreneurial mindsets, this will create opportunities
    globally. The limits previously imposed by background jurisdiction or education
    level will be blurred like never before. Embrace and adapt to the new shift that
    is taking place. Internet and crypto were paradigm shifts; the Metaverse is a
    synthesis of those and so much more. The question is, how are you getting ready?


    # Chapter Two


    Ever since Facebook rebranded itself to meta platforms, the Metaverse has become
    the hottest topic in tech. Metaverse cryptocurrencies have been exploding lately,
    and this isn''t just some temporary thing. We''ve been on the metaverse journey
    for years, just that Facebook''s highly publicized pivot has shown the spotlight
    in this trend.


    The Metaverse isn''t just some augmented, mixed reality marketplace for virtual
    goods and nfts. That''s a tiny part of the big picture. It is the next evolution
    of the internet and will transform our lifestyles, including how we communicate.
    This section will briefly look at where the trend is going and, importantly, how
    to get into this disruptive eight trillion-dollar market both as a cryptocurrency
    investor and a stock market investor.


    It includes investing in metaverse-specific tokens that are closely tied to creating
    and monetizing digital property. Also, don''t forget the infrastructure of cryptocurrencies
    and blockchains that host these metaverse ecosystems. Finally, we''ve got various
    players in the stock market who are all moving together in the same direction.
    So let''s get started.


    If you still don''t know the Metaverse from my descriptions so far, think of it
    as a virtual world where people like you and I can play, stay, and get connected
    through everything from concerts and conferences to even holidays around the world.


    In 10 to 20 years, imagine customizing a car you''re interested in buying using
    virtual reality and holograms. Imagine using a projector to display your digital
    art on the wall inside your real apartment. Such art which you own as unique NFTs
    is easily verifiable on the blockchain and impossible to steal. Ironically your
    house might burn down or get burgled, but your digital assets are safe.


    Imagine hopping into work meetings from the comfort of your own home with an experience
    that''s even better than real life, and that''s because the Metaverse can offer
    an interface as seamless and straightforward as reality but enhanced. Advancing
    slides, opening links, and resizing screens can be as simple as swiping, tapping,
    or pinching. Imagine watching sports from any angle, perhaps even from the perspective
    of the players themselves. Imagine staying and having feelings together with your
    loved ones even when you''re physically not.


    These are what the future pioneers are thinking about and already building towards,
    and we''re partly there. They''ve already got ultrafast broadband, speeds VR headsets,
    and persistent always on 24/7 online worlds.


    For many younger people, a pivot towards the Metaverse isn''t even necessary.
    They''re growing up with the expectation that a large part of their future will
    exist in the Metaverse. The rest of us will have to get on board whether we like
    it or not.


    ## Role of Blockchain and Crypto in the Metaverse


    What roles do blockchain and cryptocurrencies play in our journey towards the
    Metaverse? Well, it turns out quite a lot. Some believe that crypto investors
    of today will be the masters of the Metaverse in the future. Why?


    *   The path to Metaverse is likely through video games because those platforms
    are already well developed, making for a more straightforward evolution.


    *   The decentralization provided by blockchain technology returns power to users
    and promotes innovation.


    *   The metaverse revolution is about digital assets, which is what cryptocurrencies
    and NFTs are about. You''re looking at virtual assets that exist on the blockchain
    controlled through smart contracts.


    ## Who are the metaverse players in the cryptocurrency space?


    Starting with the most established players, the largest market caps we''ve got
    are Axie, Decentraland, Sandbox, and Enjin, or safe mid-cap cryptos.


    ### Axie Infinity


    It is a game where you can buy, train and breed pokemon- like creatures that are
    themselves nfts. Each is individually registered on the ethereum blockchain. 
    Just like any other nft, you can trade and sell your axie on the marketplace for
    cryptocurrencies.


    ### Decentraland


    This is a virtual world built on ethereum where users can buy and develop plots
    of virtual land, create artworks, etc. These assets come in the form of unique
    nfts that can be traded on the marketplace. Have you ever played the sims or second
    life? Well, you''re looking at a blockchain version of these classics.


    ### Sandbox


    Now in a similar vein to Decentraland, we''ve got the Sandbox. It is also a virtual
    world built on ethereum where players can create and monetize their gaming experiences.
    Its purpose is to disrupt existing game makers like Minecraft and Roblox. Anyone
    can create a game or design trendy characters in the Sandbox and monetize these
    NFTs in the ethereum marketplace.


    For both decentral land and the Sandbox, you have complete control over your in-world
    creations. No centralized platforms to restrict what you can or can''t do. That''s
    one of the benefits of blockchain.


    ### Enjin coin


    This crypto is the oil that lubricates the Enjin platform, an all-in-one suite
    of tools that allow users to create NFTs on the ethereum blockchain and integrate
    them into games and apps. Beyond the well-known staples, you can do your research
    and discover many up-and-coming projects with good use cases.


    We''ll list a few of them, so first, we''ve got Effinity (EFI), a blockchain dedicated
    to nfts developed by Enjin built on Polkadot. There is more to say about Polkadot,
    which will be discussed as we proceed.


    ### OVR


    You''ve OVR, a digital layer covering the entire world comprising 1.6 trillion
    pieces of land. All of them are individual NFTs that you can buy and sell. They''re
    essentially creating the first google earth on the blockchain.


    ### Metahero


    You can use their 3d scanner to create your digital avatar. It is another 3d NFTs
    that can be used across games, VR, social media, and online fashion. So imagine
    using your 3d avatar to try out clothes that you might be interested in quickly.


    ## Where Can You Buy These Metaverse Cryptocurrencies?


    Well, the largest staples can be bought on any centralized exchanges such as Binance
    and Coinbase. You can also buy them inside defy as well. For example, the ethereum
    based tokens can all be picked up on an old uni swap but watch out for the gas
    fees. The binance smart chain tokens can be bought from a good old pancake swap.
    Now, if you''re ever in doubt, just search up the token on coinmarketcap.com or
    coingecko.com and then go to the market tab. It will tell you all the centralized
    and decentralized exchanges trading the token.


    I''ve got some of these cryptocurrencies on exchanges for trading and staking
    in binance. Currently, I''m staking some sandbox, axie infinity, and a bunch of
    other things in the lock staking pools on binance, and it is effortless to do.


    ![](Image00000.jpg)


    At the same time, I''ve got some of these cryptos making passive income in the
    d5 space, particularly in staking and farming. For example, I still have some
    Enjin coins sitting in the uni swaps liquidity pool and earning trading fees.
    There are lots of exciting things that you can do.'
