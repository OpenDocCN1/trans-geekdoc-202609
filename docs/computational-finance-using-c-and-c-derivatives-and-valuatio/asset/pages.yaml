    One can find a unique probability measure $Q$ such that the relative prices $Z''_i,i=2,\dots,n$
    are martingales. If either is free of arbitrage opportunities, then every payoff
    pattern $H_T$ can be represented as a linear combination of the asset values $S^T_i,i=1,\dots,n$,
    and in addition, the relative price process $(H_T/S^T_1)$ is a martingale.


    This means we can write


    ```

    $E^Q\frac{H_t}{S^T_t}=E^Q\frac{H_T}{S^T_T}, \quad \text{where } 0 \le t \le T.$

    ```


    The current (time t) value $V_t$ of payoff $H_T$ is this


    ```

    $V_t=S^T_t\frac{H_T}{S^T_T}.$

    ```


    In general for a numeraire $N$ which takes the values $N_t, 0 \le t \le T$, we
    can write


    ```

    $V_t=N_te^Q\frac{H_T}{N_T}. \quad (4.2.1)

    ```


    Equation (4.2.1) is very important because $V_t$ is the current (time t) price
    of a financial derivative with maturity $T$ and payoff $H_T$.


    It should be mentioned that the price of a financial derivative is independent
    of the martingale measure under which it is valued, and thus, the same price $V_t$
    will be obtained for different numeraires $N$.


