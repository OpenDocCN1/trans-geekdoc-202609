  md: "# 36 CHAPTER | 3 Generation of Random Variates\n\nfurther details. We can therefore\
    \ conclude that the estimated integral $\nu$ has a standard error of $N^{-1/2}$\
    \ $\\Delta$. This means that the estimated error of the integral will decrease\
    \ at the rate of $N^{-1/2}$.\n\nIt is possible to achieve faster convergence if\
    \ the sample points are chosen on a Cartesian grid. If we sample each grid point\
    \ exactly once, then the Monte Carlo effectively becomes a deterministic quadrature\
    \ scheme, whose fractional error decreases at the rate of $N^{-1}$ or faster.\
    \ The trouble with the grid approach is that it is necessary to decide in advance\
    \ how fine it should be, and all the grid points need to be used. It is therefore\
    \ not possible to sample until some convergence criterion has met.\n\nQuasi-random\
    \ number sequences to bridge the gap between the flexibility of pseudo-random\
    \ number generators and the advantages of a regular grid. They are designed to\
    \ have a high level of uniformity in multidimensional space, but unlike pseudo-random\
    \ numbers, they are not statistically independent.\n\n# 3.2 PSEUDO-RANDOM AND\
    \ QUASI-RANDOM SEQUENCES\n\nHere, we consider the generation of multidimensional\
    \ pseudo-random and quasi-random sequences to approximate the multidimensional\
    \ uniform distribution over the interval [0,1], that is, the distribution $U(0,1)$.\n\
    \nQuasi-random numbers are also called low-discrepancy sequences. The discrepancy\
    \ of a sequence is a measure of its uniformity and what defines it.\n\nGiven a\
    \ set of points $x^1,x^2,\\dots,x^N \\in I^S$ and a subset $G \\subset I^S$, define\
    \ the counting function $S_N(G)$ as the number of points $x^l \\in G$. For each\
    \ $x=(x_1,x_2,\\dots,x_s) \\in I^S$, let $G_x$ be the rectangular $s$-dimensional\
    \ region $G_x=[0,x_1] \times [0,x_2] \times \\dots \times [0,x_s]$, with volume\
    \ $x_1,x_2,\\dots,x_n$. Then the discrepancy of the points $x^1,x^2,\\dots,x^N$\
    \ is given by\n\n```\n$D_N^S(x^1,x^2,\\dots,x^N) = |S_N(G_x)-Nx_1x_2,\\dots,x_s|\
    \ \\n_{x \\in I^S}$\n```\n\nThe discrepancy is therefore computed by comparing\
    \ the actual number of sample points in a volume of multidimensional space with\
    \ the number of sample points that should be assuming a uniform distribution.\n\
    \nIt can be shown that the discrepancy of the first terms of quasi-random sequence\
    \ has the\n\n```\n$D_N^S(x^1,x^2,\\dots,x^N) \\le C_S(\\log N)^S+O((\\log N)^{S-1})$\n\
    ```\n\nfor all $N \\ge 2$.\n\nThe principal aim in the construction of low-discrepancy\
    \ sequences is to find sequences in which the constant is as small as possible.\
    \ Various sequences have been constructed to achieve this goal. Here, we consider\
    \ the following quasi-random sequences: Niederreiter, Sobol, and Faure."
