    done2,d1,d2,tmp1,tmp2;\n*/\n```\n\n```\nif ( S < EPS || ( sigma < EPS || t < EPS\
    \ )) { /* Check if the input arguments are too small */\nflag = 1;\nreturn;\n\
    }\ntmp = log(S/K);\nd1 = (tmp+(r+sigma*sigma/2)*t)/(sigma*sqrt(t));nd2 = d1-sigma*sqrt(t);\n\
    /* evaluate the option price * /\nvalue = S*norm_cdf(d1)-K*exp(-r*t)*norm_cdf(d2);\n\
    if (greeks) { /* calculate the greeks * */\ntemp = -S*exp(-q*t)*norm_pdf(d1)/(sigma*sqrt(t));\n\
    d2 = d1-sigma*sqrt(t);\ngreeks[0] = temp;\nif (put == 0) { /* a call option *\
    \ */\ngreeks[1] = S*exp(-q*t)*norm_pdf(d1)/(sigma*sqrt(t)) / delta;\ngreeks[2]\
    \ = S*exp(-q*t)*norm_cdf(d1)/t - K*exp(-r*t)*norm_cdf(d2)/t;\ngreeks[3] = K*exp(-r*t)*norm_pdf(d2)\
    \ / rho;\ngreeks[4] = S*exp(-q*t)*norm_pdf(d1) / vega;\n} else { /* a put option\
