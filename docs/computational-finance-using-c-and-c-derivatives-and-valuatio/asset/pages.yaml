  md: "# Vanilla Options and the Black–Scholes Model Section | 4.4 65\n\n# 4.4.3 The\
    \ Black–Scholes Formula\n\nThe Black–Scholes model consists of two assets, the\
    \ riskless money account and an equity it can be cast as the following two-dimensional\
    \ Ito equation:\n\n```\n$dS_t = \\mu S_t dt + \\sigma S_t dW^P$,$\n$dB_t = r B_t\
    \ dt$,$\n(4.4.26)\n```\n\nwhere $W^P$ is Brownian motion (without drift) under\
    \ measure $\\mathbb{P}$, so $dW^P \\sim N(0,dt)$.\n\nCurrent time is denoted by\
    \ $t_0$, and the option maturity time by $T$. The money market account has value\
    \ $B_{t_0} = 1$ at time $t_0$ and $B_T = \\exp(r(T-t_0))$ at time $T$.\n\nWe will\
    \ now consider the process by the relative value $\\phi(S_t, B_t) = S_t/B_t$.\n\
    \nUsing the quotient rule described in Section 2.6.2 and substituting $X_1 = S_t$\
    \ and $X_2 = B_t$ in equation (2.6,8), we have\n\n```\n$d\\left(\\frac{S_t}{B_t}\r\
    ight) = \\left(\\frac{S_t}{B_t}\right)(\\mu - r)dt + \\left(\\frac{S_t}{B_t}\r\
    ight)\\sigma dW^P$.\n```\n\nSo finally we can write\n\n```\n$dS_t^* = S_t^*(\\\
    mu - r)dt + S_t^*\\sigma dW^P$,$\n(4.4.27)\n```\n\nwhere $S_t^* = S_t/B_t$.\n\
    Referring to Girsanov's theorem in Section 2.4, we can choose a probability measure\
    \ $\\mathbb{Q}$ such that\n\n```\n$dW^P = dW^Q - \\left(\\frac{\\mu - r}{\\sigma}\r\
    ight)dt$.$\n(4.4.28)\n```\n\nIn equation (2.4.3), we have $k(t) = -\\left(\\frac{\\\
    mu - r}{\\sigma}\right)$ and\n\n```\n$\\frac{dQ}{d\\mathbb{P}} = \\exp\\left\\\
    {-\\left(\\frac{\\mu - r}{\\sigma}\\right)W^P - \\frac{1}{2}\\left(\\frac{\\mu\
    \ - r}{\\sigma}\\right)^2\\right\\}$,$\n(4.4.29)\n```\n\nsee page 114 Musiela\
    \ and Rutkowski (1998). Substituting for $dW^P$ in equation (4.4.27) yields\n\n\
    ```\n$dS_t^* = S_t^*\\{\\mu - r\\}dt - S_t^*\\left(\\frac{\\mu - r}{\\sigma}\r\
    ight)dt + S_t^*\\sigma dW^Q$,\n```\n\nwhich simplifies to\n\n```\n$dS_t^* = S_t^*\\\
    sigma dW^Q$.$\n(4.4.30)\n```\n\nEquation (4.4.30) means that the process for $S_t^*$\
    \ is a martingale under probability measure $\\mathbb{Q}$.\n\nReplacing $dW^P$\
    \ with the value in equation (4.4.28) yields\n\n```\n$dS_t = \\mu S_t dt + \\\
    sigma S_t dW^P$,$\n$= \\mu S_t dt + S_t\\left\\{dW^Q - \\left(\\frac{\\mu - r}{\\\
    sigma}\\right)dt\\right\\}$,$\n$= \\left\\{S_t dt - S_t\\left(\\frac{\\mu - r}{\\\
    sigma}\\right)\\right\\}dt + S_t\\sigma dW^Q$.\n```"
