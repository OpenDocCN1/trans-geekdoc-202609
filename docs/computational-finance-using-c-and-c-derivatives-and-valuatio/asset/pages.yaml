    # American Put Options


    For an American put, we proceed in a similar manner to that of the American call.
    We now use fact that both the value and early exercise premium $(y_p(S,E,\tau)
    = h_p(S,E,\tau))$ of an American put tend to zero as the asset price $S \to \infty$.
    So $q_p(S,E,\tau) \to 0$ as $S \to \infty$. Since $\gamma_2 > 0$, the only way
    this can be achieved by equation (5.2.18) is if $a_2 = a_1S^{*\gamma_1}$ and the
    value of an American put is


    ```

    $P(S,E,\tau) = p(S,E,\tau) + ha_1S^{*\gamma_1}. \quad (5.2.27)

    ```


    An expression for $a_1$ can be found by considering the critical asset price,
    $S^*$, below which the American option will be exercised. For $S > S^*$, the value
    of the American put is given by equation (5.2.27), and for $S < S^*$, we have
    $P(S,E,\tau) = S - E$.


    Continuity of the option value at the critical asset price gives


    ```

    $E - S^* = p(S,E,\tau) + ha_1S^{*\gamma_1}. \quad (5.2.28)

    ```


    and continuity of the option value''s gradient at the critical asset price yields


    ```

    $\frac{\partial(E - S^*)}{\partial S^*} = \frac{\partial}{\partial S^*}\{p(S^*,E,\tau)
