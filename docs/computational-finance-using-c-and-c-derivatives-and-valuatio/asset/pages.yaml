    # 2.4 GIRSANOV''S THEOREM


    This theorem states that for any stochastic process $k(t)$ such that $\int_0^t
    k(s)^2 ds < \infty$ then the Radon Nikodym derivative $dQ/d\mathbb{P} = \rho(t)$
    is given by


    ```

    $$\rho(t) = \exp(\int_0^t k(s)dW_s - \frac{1}{2} \int_0^t k(s)^2ds),$$

    ```


    where $W_t^P$ is also Brownian motion (possibly with drift) under probability
    measure $\mathbb{P}$, we have Baxter and Rennie (1996). Under probability measure
    $\mathbb{Q}$, we have


    ```

    $W_t^Q = W_{t_0}^P - \int_0^t k(s)ds$,

    ```


    where $W_t^Q$ is also Brownian motion (possibly with drift).

    We can also write


    ```

    $dW^P = dW^Q + k(t)dt$.

    ```


    Girsanov''s theorem provides a mechanism for changing the drift of a Brownian
    motion.


