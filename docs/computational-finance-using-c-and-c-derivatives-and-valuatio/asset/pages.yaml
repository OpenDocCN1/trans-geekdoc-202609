    When Antwerp declined in importance the Jews moved to Amsterdam, during the seventeenth
    century, even became known as the Dutch Jerusalem. They played an important role
    in large trading companies, such as the Dutch East and West Indies Companies,
    where they were trading commodities such as sugar, tobacco and precious stones.


    During the sixteenth century, the Amsterdam Bourse (Fig. 9.6) only traded wheat,
    herring, and spices. However, in 1602, the world''s first public company, the
    VOC (the Vereenigde Oost-Indische Compagnie or United East India Company) was
    created, and people began to trade the company''s shares, see [Figs 9.7] and [9.8].
    The Amsterdam Exchange was established for this purpose and thus became the first
    Stock Exchange in the world, see Fleurit (2008).


    The VOC had over 150 trading vessels, 40 warships, 20,000 seamen and 10,000 soldiers
