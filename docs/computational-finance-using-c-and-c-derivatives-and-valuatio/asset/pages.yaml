    \ N(-d2)\\\\}.$ (7.3.15)\n```\n\nwhere the symbols have the same meanings as the\
    \ FX call.\n\n# 7.4 CREDIT DERIVATIVES\n\nCredit derivatives take into account\
    \ the fact that a counterparty may and not honour (or by bankruptcy, etc.) the\
    \ obligations set out in a given financial contract. In order to obtain the time\
    \ $t$ value of the probability that the counterparty (and thus the contract) will\
    \ survive until some time $T > t$. Here we denote the survival probability between\
    \ times $t$ and $T$ by $S(t,T)$, and we compute value from the hazard rate.\n\n\
    # The Hazard Rate\n\nAs previously mentioned, the survival probability between\
    \ times $t$ and $T$, where $T > t$, is denoted by $S(t,T)$. This means that the\
    \ probability of default between times $t$ and $T$ is\n\n```\n$P_{def}(t,T) =\
    \ 1 - S(t,T)$\n```\n\nand the probability of default, as seen from time $t$, between\
    \ times $T_1$ and $T_2$ is\n\n```\n$P_{def}(t_1,T_2) = S(t,T_1) - S(t,T_2), \\\
    quad T_2 > T_1.$$ (7.4.1)\n```\n\nThe time $t$ discrete hazard rate between times\
    \ $T$ and $T + \\Delta T$, denoted by $H(t,T,T+\\Delta T)$, is defined by\n\n\
    ```\n$H(t,T,T+\\Delta T) = \\frac{1}{\\Delta T} \\frac{P_{def}(t,T,T+\\Delta T)}{S(t,T+\\\
    Delta T)}\\\\= \\frac{1}{\\Delta T} \\frac{S(t,T) - S(t,T+\\Delta T)}{S(t,T+\\\
    Delta T)}.$\n```"
