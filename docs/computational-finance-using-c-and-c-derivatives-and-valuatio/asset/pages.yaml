    However, the real power of this method is when the underlying asset follows a\
    \ non-Gaussian and time varying. The only realistic modification to the code is\
    \ to replace the normal with that of another probability distribution and supply\
    \ the time varying parameters to it.\n\n```\n// Stochastic lattice for computing\
    \ the value of American and European options via Monte Carlo simulation.\n// We\
