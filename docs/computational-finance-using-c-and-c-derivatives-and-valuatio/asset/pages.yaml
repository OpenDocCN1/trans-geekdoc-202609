- pgno: 354
  md: '# Glossary


    $\overline{DF}(t,T)$ The discount factor (including the possibility of default)
    between times $t$ and $T$, where $T \ge t$: $\overline{DF}(t,T) = S(t,T)DF(t,T)$.
    The price of a defaultable zero coupon bond which matures at $T$ is the expected
    value of $DF(t,T)$. In this book we assume that interest rates are deterministic
    and $\overline{DF}(t,T)$ is the value of a defaultable zero coupon bond maturing
    at $T$.


    $F(t,T_1,T_2)$ The forward rate at time $t$ between times $T_1$ and $T_2$ where
    $T_2 \ge T_1$ and $T_1 \ge t$.


    $L(T_1,T_2)$ is the simply compounded spot rate between times $T_1$ and $T_2$,


    $log(x)$ The natural logarithm of $x$.


    $N(a,b)$ Normal distribution, with mean $a$ and variance $b$.


    $dW_t$ A Brownian motion, this is simulated as normal vari (sampled at time $t$)
    from the distribution $N(0,dt)$, where $dt$ a specified time interval e.g. $dx
    = \mu dt + dW_t$.


    $dZ_t$ A Normal (sampled at time $t$) from the distribution $N(0,1)$. Note: The
    variate $\psi = \sqrt{dt}Z_t$ has the same distribution as $dW_t$.


    $IID$ Independently and Identically Distributed.


    $\mathcal{U}(a,b)$ The uniform distribution, with lower limit $a$ and upper limit
    $b$.


    $|x|$ The absolute value of the variable $x$.


    $PDF$ The probability density function of a given distribution.


    $x \wedge y$ The minimum of $x$ and $y$, that is $min(x,y)$.


    $S(t,T)$ The survival probability between time $t$ and $T$, $T > t$.


    $||A-B||$ The distance between two matrices with the same dimensions. If $A$ and
    $B$ are both have $n$ rows and $m$ columns then this is


    ```

    \sqrt{\sum_{i=1}^{n} \sum_{j=1}^{m} {A_{i,j} - B_{i,j}}^\2}

    ```


    where $A_{i,j}$, and $B_{i,j}$, refer to the element in the $i$th row and $j$th
    column.'
