  md: "# Proof of Equation (H.1.10) Section | H.9 351\n\nNow since the probability\
    \ $P(m_t^x \\le b, \tilde{X}_t \\ge x)$ decreases as $x$ increases, we have\n\n\
    ```\n$P(m_t^x \\le b, \tilde{X}_t \\ge x) - P(m_t^x \\le b, \tilde{X}_t \\ge x+\\\
    Delta x) = -\\frac{\\partial P}{\\partial x}\\Delta x$ (H.9.2)\n```\n\nand\n\n\
    ```\n$P(m_t^x \\le b, \tilde{X}_t \\ge x) - P(m_t^x \\le b, \tilde{X}_t \\ge x+\\\
    Delta x) \\sim p(m_t^x \\le b, \tilde{X}_t = x)\\Delta x,$ (H.9.3)\n```\n\nwhere\
    \ $p(m_t^x \\le b, \tilde{X}_t = x)$ is the probability density function of $P(m_t^x\
    \ \\le b, \tilde{X}_t \\ge x)$ and $\\Delta x \to 0$.\nCombining equations (H.9.2)\
    \ and (H.9.3), we obtain\n\n```\n$p(m_t^x \\le b, \\tilde{X}_t = x) = -\\frac{\\\
    partial P}{\\partial x}\\Delta x.$\n```\n\nSo\n\n```\n$p(m_t^x \\le b\n```\n\n\
    which means\n\n```\n$p\\left(m_t^x \\le b, \\tilde{X}_t | \\tilde{X}_0\\right)\
    \ = \\frac{1}{\\sigma\\sqrt{2\\pi t}}\\exp\\left(-\\frac{2vb}{\\sigma^2}\\right)\\\
    exp\\left(-\\frac{(2b-\\tilde{X}_t+vt)^2}{2\\sigma^2t}\\right),$ (H.9.4)\n```\n\
    \nwhere as we take $\\tilde{X}_0 = 0$. So equation (H.9.4) gives the probability\
    \ density\nfor the Brownian motion which goes through the points $\\tilde{X}_0$\
    \ and $\\tilde{X}_t$ and has a\nminimum value which is less or equal to $b$\n\
    If of considering the complete path of $\\tilde{X}_t$ from $\\tilde{X}_0$, we\
    \ can move the\norigin to the point $\\tilde{X}_{t_1}$, where $t_1 \\le t$. Substituting\
    \ into (H.9.4), we have\n\n```\n$p\\left(m_{t_2}^x \\le b, \\tilde{X}_{t_2} |\
    \ \\tilde{X}_{t_1}\\right)$$\n$$= \\frac{1}{\\sigma\\sqrt{2\\pi(t_2-t_1)}}$\\\
    exp\\left(-\\frac{2v(b-\\tilde{X}_{t_1})}{\\sigma^2}\\right)\\exp\\left(-\\frac{(2(b-\\\
    tilde{X}_{t_1})-(\\tilde{X}_{t_1}+v(t_2-t_1)))^2}{2\\sigma^2(t_2-t_1)}\\right)$$\n\
    $$= \\frac{1}{\\sigma\\sqrt{2\\pi(t_2-t_1)}}$\\exp\\left(-\\frac{2v(b-\\tilde{X}_{t_1})}{\\\
    sigma^2}\\right)\\exp\\left(-\\frac{(2b-\\\tilde{X}_{t_1}}-v(t_2-t_1))^2}{2\\\
    sigma^2(t_2-t_1)}\\right)$,$\n```\n\nwhich can be re-expressed as\n\n```\n$p\\\
    left(m_{t_2}^x \\le b, \\tilde{X}_{t_2} | \\tilde{X}_{t_1}\\right)$$\n$$= \\frac{1}{\\\
    sigma\\sqrt{2\\pi\\Delta t}}$$\\exp\\left(-\\frac{2v(b-\\tilde{X}_{t_1})}{\\sigma^2}\\\
    right)\\exp\\left(-\\frac{(\\tilde{X}_{t_1}+\tilde{X}_{t_2}-2b-v\\Delta t)^2}{2\\\
    sigma^2\\Delta t}\\right)$\n```\n\nwhere $t_2 \\ge t_1$ and $\\Delta t = t_2 -\
    \ t_1$."
