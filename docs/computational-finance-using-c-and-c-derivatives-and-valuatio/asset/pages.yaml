  md: "# Vanilla Options and the Black-Scholes Model Section | 4.4 79\n\nThe univariate\
    \ cumulative standard normal distribution, Ni(x), can be evaluated in Excel using\
    \ its built-in function NORMDIST. The definition of this function is as follows:\n\
    \n```\nNORMDIST(x,mean,standard_dev,cumulative)\n```\n\nThis function returns\
    \ the normal cumulative distribution for the specified mean and standard deviation.\n\
    Parameters:\n\n+   - x: the value for which you want the distribution.\n- mean:\
    \ the arithmetic mean of the distribution.\n- standard_dev: the standard deviation\
    \ of the distribution.\n- cumulative: a logical value that determines the form\
    \ of the function. If cumulative is TRUE, NORMDIST returns the cumulative distribution;\
    \ if FALSE, it returns the probability density function.\n\nIf mean = Φ and standard_dev\
    \ = 1, NORMDIST returns the standard normal distribution.\nThis function can be\
    \ used to create a Visual Basic function to calculate European option values within\
    \ Excel, see Code 4.5.\n\n```\nFunction bs_opt(S As Double)\n  ByVal X As Double,\
    \ sigma As Double, T As Double,\n  ByVal r As Double, ByRef put As Double\n  '\
    \ Visual Basic function to calculate the value of\n  ' either a European Put or\
    \ European Call option.\n  ' Author: George Levy\n  Dim temp As Double\n  Dim\
    \ d1 As Double\n  Dim d2 As Double\n  Dim Sqrt As Double\n  Dim value As Double\n\
    \  temp = Log(S / X)\n  d1 = (temp + (r + (sigma * sigma / 2)) * T) / Sqrt(T)\n\
    \  Sqrt = Sqrts(T)\n  d2 = d1 - sigma * Sqrt\n  If (put = 0) Then ' a call option\n\
    \    value = S * Exp(-r * T) * Worksheet.NormDist(d1, 0, 1, True) - \\\n     \
    \       Worksheet.NormDist(d2, 0, 1, True) * X * Exp(-r * T)\n  Else ' a put option\n\
    \    value = X * Exp(-r * T) * Worksheet.NormDist(-d2, 0, 1, True) - \\\n    \
    \        Worksheet.NormDist(-d1, 0, 1, True) * S * Exp(-r * T)\n  End If\n  bs_opt\
    \ = value\nEnd Function\n```\n\n**Code excerpt 4.5** Visual basic code to price\
    \ European options using the Black-Scholes formula.\n\nOnce the function has been\
    \ defined, it can be accessed interactively using the Paste Function facility\
