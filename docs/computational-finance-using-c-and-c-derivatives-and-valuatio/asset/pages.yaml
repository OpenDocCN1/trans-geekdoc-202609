    \ the grid. If $E$ is the strike price, then vanilla call options have payoffs\n\
    \n```\n$p_j = max(j\\Delta S - E), \\quad j = 0, \\dots, n_{s-1}$\n```\n\nand\
    \ vanilla put options have payoffs\n\n```\n$p_j = max(E - j\\Delta S), \\quad\
    \ j = 0, \\dots, n_{s-1}$\n```\n\n**Upper asset boundary values**\nAt the upper\
    \ boundary, $j = n_s - 1$ and $(n_s - 1)\\Delta S = S_{max}$, where we note that\
