    \nand for put options\n\n```\n$p_{n_{s-1}} = 0.$\n```\n\nThe option value at the\
    \ upper boundary, denoted by $f_{BU}$, is set to $p_{n_{s-1}}$, and we have $f_{i,n_{s-1}}=f_{BU},\
    \ i = 0, \\dots, n_t$.\n**Lower asset boundary values**\nAt the lower boundary,\
    \ $j = 0$ and the value of $j\\Delta S$ is zero.\nSo for call options\n\n```\n\
    $p_0 = 0,$\n```\n\nand for put options\nThe option value at the lower boundary,\
    \ denoted by $f_{BL}$, is set to $p_0$, and we have $f_{i,0}=f_{BL}, i = 0, \\\
    dots, n_t$.\n**Boundary values at option maturity**\n\n```\n$p_0 = E.$\n```\n\n\
    At option maturity ($i = n_t$), the initial option (boundary) values are the previously\
    \ mentioned factors. If $E$ is the strike price, then for vanilla call options,\n\
    \n```\n$f_{n_t,j} = max(j\\Delta S - E), \\quad j = 0, \\dots, n_{s-1}$.\n```"
