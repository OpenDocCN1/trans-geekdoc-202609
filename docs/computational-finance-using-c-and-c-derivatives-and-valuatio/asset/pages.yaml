    # **Vega**


    The definition of $\mathcal{V}$ is the rate of change of the option value with
    volatility,


    $$\mathcal{V} = \frac{\partial f}{\partial \sigma}.$$


    In a standard binomial lattice, $\mathcal{V}$ cannot be computed directly. A simple
    approach is to use two binomial lattices as follows:


    $$\mathcal{V} = \frac{f_{\sigma+\Delta\sigma} - f_{\sigma}}{\Delta\sigma},$$


    where $f_{\sigma+\Delta\sigma}$ is the option value computed using a binomial
    lattice with volatility $\sigma + \Delta\sigma$, and $f_{\sigma}$ is the option
    value computed using another binomial lattice with volatility of $\sigma$, all
    other parameters remain constant.


