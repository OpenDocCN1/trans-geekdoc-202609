  md: '# Chapter 2


    # Introduction to Stochastic Processes


    # 2.1 BROWNIAN MOTION


    Brownian motion is named after the botanist Robert Brown who used a microscope
    to study the fertilization mechanism of flowering plants. He first observed the
    random motion of pollen particles (obtained from the American species Clarkia
    pulchella) suspended in water and wrote the following:


    > The forilla or granules fill the whole orbicular disc but not extend to the
    projecting angles. They are not spherical but oblong or nearly cylindrical, and
    the particles have manifest motion. This motion is only visible to my lens which
    magnifies 370 times. The motion is obscure yet ..


    Robert Brown, 12th June 1872; see Ramsbottom (1932)


    It appears that Brown considered this motion no more than a curiosity (he believed
    that the particles were alive) and continued undisturbed by his botanical research.
    The full significance of his observations only about eighty years later when it
    was shown (Einstein, 1905) that the motion is caused by the collisions that occur
    between the pollen grains and the water molecules. In 1908 Perrin, see Perrin
    (1910), was finally able to confirm Einstein''s predictions experimentally. His
    work was made possible by the development of the ultramicroscope by Richard Zsigmondy
    and Henry Siedendorf (1903). He was able to work out from his experimental results
    and Einstein''s formula the size of the water molecule and a precise value for
    Avogadro''s number. His work established the physical theory of Brownian motion
    and ended the skepticism about the existence of atoms and molecules as actual
    entities. Many of the fundamentals of Brownian motion were discovered by Paul
    Levy, see Levy (1939) and Levy (1948), the first mathematically rigorous treatment
    was provided by Norbert Wiener, see Wiener (1923) and Wiener (1924). In addition,
    see Karatzas and Shreve (2000), it is an excellent text book on the theoretical
    properties of Brownian motion, while Shreve et. al., see Shreve et al. (1997),
    provides much useful information concerning the use of Brownian processes within
    finance.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 6 CHAPTER | 2 Introduction to Stochastic Processes


    Brownian motion is also called a random walk, a Wiener process, or sometimes (more
    poetically) the drunkards walk. We will now present the three fundamental properties
    of Brownian motion.


    # The Properties of Brownian Motion


    In formal terms, a process is W (W_t : t ≥ 0) is (one-dimensional) Brownian motion
    if


    +   (i) W_t is continuous, and W_0 = 0,

    (ii) W_t ~ N(0,t),

    (iii) the increment dW_t = W_{t+dt} - W_t is normally distributed as dW_t ~ N(0,dt),
    so E[dW_t] = 0 and Var[dW_t] = dt. The increment dW_t is also independent of the
    history of the process up to time t.


    From (iii), we can further state, that the increments dW_t are independent of
