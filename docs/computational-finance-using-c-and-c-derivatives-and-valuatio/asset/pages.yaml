    \ 5.18 (Continued).\n\n# 5.4.3 Nonuniform Grids\n\nIn the previous section, we\
    \ showed how to solve the Black–Scholes equation using a uniform grid. Although\
    \ this approach will provide satisfactory solutions to many option pricing problems,\
    \ there are situations where it is important to be able to place grid lines at\
    \ locations which do not correspond to those available in a uniform grid. Increasing\
    \ the density of grid lines in regions of interest can improve accuracy in both\
    \ the estimated option values and also the estimates of the hedge strategies (the\
    \ Greeks).\n\nHere, we present an example which illustrates the benefits of using\
    \ a nonuniform grid in the evaluation of down and call barrier options. Later\
    \ in Section 5.4.6, we give a further example which shows the use of nonuniform\
    \ grids to evaluate double barrier options.\n\nThe purpose of this section is\
    \ to show how to discretize the Black–Scholes equation using a nonuniform grid\
    \ and derive an expression, see equation (5.4.39), which is equivalent to equation\
    \ (5.4.14). Although the tridiagonal system of equations we have to solve in this\
    \ section will be different from that in Section 5.4, the solution method used\
    \ is exactly the same. This means that once we have derived (5.4.39) all the other\
    \ information we require to evaluate both European and American options is available\
    \ in Section 5.4 under the headings:\n\n+   * The boundary conditions.\n* Computation\
    \ of the option values at a given time instant.\n* Backwards iteration and early\
    \ exercise.\n\nWe will now consider the finite-difference approximation for a\
    \ nonuniform grid and then show how to value the down and call barrier option.\n\
    \n# The Finite-Difference Approximation\n\nHere, we consider how to discretize\
    \ the Black–Scholes equation using a nonuniform grid, in which the asset price\
    \ interval $\\Delta S$ and the time step $\\Delta t$ are not constant but can\
    \ vary throughout the grid.\n\nAllowing for a constant time step is simple. The\
    \ time step occurs in both the first derivative $f_{i,j}$, see equation (5.4.4),\
    \ and in the option value equations, see equation (5.4.14) to equation (5.4.21),\
    \ as the constant $\\Delta t$."
