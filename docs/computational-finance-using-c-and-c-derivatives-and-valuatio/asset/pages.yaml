    # 2.6 ITO PRODUCT AND QUOTIENT RULES IN TWO DIMENSIONS


    We now derive expressions for the product and quotient of two stochastic processes.
    In this case, $\phi \to \phi(X_1,X_2),$


    ```

    $dX_1=a_1dt+b_1dW_1 \quad \text{and} \quad dX_2=a_2dt+b_2dW_2.$

    ```


    The two-dimensional version of Ito''s lemma will be used:


    ```

    $d\phi = \frac{\partial \phi}{\partial X_1}dX_1 + \frac{\partial \phi}{\partial
    X_2}dX_2 + \frac{1}{2}\sum_{i=1}^2\sum_{j=1}^2 \frac{\partial^2 \phi}{\partial
    X_i\partial X_j}dX_idX_j, \quad \(2.6.1)$

    ```


    where we have the fact that


    ```

    $$\frac{\partial \phi}{\partial t} = 0.$

    ```'
