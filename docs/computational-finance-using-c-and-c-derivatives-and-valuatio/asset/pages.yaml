    # 7.4.1 Defaultable Bond


    For a defaultable bond, we need to take into account the fact that the bond issuer
    may default, that is, cease to make the bond coupon payments. The time $t$ value
    of a defaultable bond is


    ```

    $$\bar{B}(t) = P DF(t,t_m) \quad principal$

    ```


    ```

    $+ \sum_{j=1}^{m} C_j DF(t,t_j) \quad coupons$

    ```


    ```

    $+ PR \sum_{j=1}^{m} DF(t,t_j)\{S(t,t_{j-1}) - S(t,t_j)\} \quad recovery value,$

    ```


    where $t_m$ is the maturity of the bond, $P$ is the principal, $C_j$ is the value
    of $jth$ coupon, $R$ is the recovery rate, $S(t,t_j)$ probability that the bond
    will survive until time $t_j$, and the zero coupon defaultable bond prices are
    defined by $\bar{DF}(t,t_m) = S(t,t_m)DF(t,t_m)$ and $\bar{DF}(t,t_j) = DF(t,t_j)S(t,t_j)$.
    The term $\{S(t,t_{j-1}) - S(t,t_j)\}$ is the probability that the bond will default
    between times $t_{j-1}$ and $t_j$.


    # 7.4.2 Credit Default Swap


    A Credit Default Swap (CDS) is a contract between two counterparties in which
    one (A) pays periodic payments to the other (B) in order to obtain protection
    against the default of a reference credit. In the event of default B pays A, the
    default payment of $1 - R$, where $R$ is the recovery rate, and contract ceases.
    The time $t$ value of the CDS to A, the purchaser of the, is


    ```

    $CDS(t) = - \sum_{j=1}^{m} C_j DF(t,t_j) \quad coupons$

    ```


    ```

    $+ P (1 - R) \sum_{j=1}^{m} DF(t,t_j)\{S(t,t_{j-1}) - S(t,t_j)\} \quad recovery
    value,$

    ```


    where the symbols have the same means as for the defaultable bond.'
