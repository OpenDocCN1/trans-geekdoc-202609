  md: "# Two-asset Options Section | 6.5 183\n\nof the jump and the probability of\
    \ the jump are the same as the CRR binomial model.\nThe attractive feature of\
    \ the BEGKR binomial lattice model is that it can be easily generalized to describe\
    \ a model consisting of k assets. Here, we will merely quote the results in Kamrad\
    \ and Ricken (1991). As it is assumed that the asset process follows a multivariate\
    \ lognormal distribution. Let $\\mu_i = r - \\sigma_i^2/2$, and $\\sigma_i$ be\
    \ the instantaneous mean and variance respectively $(i=1, 2, \\dots, k)$ and let\
    \ $\rho_{ij}$ be the correlation between assets $i$ and $j$. The binomial model\
    \ now requires $2^k$ possible jumps in the time interval $\\Delta t$. Let $m$\
    \ denote the state of the process at $\\Delta t$ with $p_m$ representing the probability\
    \ of state $m$ ($m=1, \\dots, 2^k$). The probabilities of these jumps are given\
    \ by\n\n```\n$p_m = \\left\\{1 + \\Delta t \\sum_{i=1}^k \\frac{\\mu_i}{\\sigma_i}\
    \ + \\sum_{i=1}^k \\sum_{j=i+1}^k (x_{ij}^* \\rho_{ij})\\right\\\\}, m=1, 2, \\\
    dots, 2^k, k \\ge 2,$\n```\n\nwhere $x_{im}=1$ if asset $i$ has an up-jump in\
    \ state $m$, and $x_{im}=-1$ if asset $i$ has a down-jump in state $m$. In addition,\
    \ $x_{ij}^*=1$ if asset $i$ and asset $j$ jump in the same direction in state\
    \ $m$, and $x_{ij}^*=-1$ if asset $i$ and asset $j$ jump in the opposite direction\
    \ in state $m$.\n\n# 6.5 TWO-ASSET OPTIONS\n\nIn this section, we consider options\
    \ based on the underlying prices of two assets, $S_1$ and $S_2$. We give analytic\
