    # C.3.2 Covariance


    ```

    $Cov[X,Y] = E[(X-E[X])(Y-E[Y])] = E[XY-E[X]Y-YE[X]+E[X]E[Y]]

    = E[XY]-E[X]E[Y]-E[X]E[Y]+E[X]E[Y]

    = E[XY]-E[X]E[Y].$.

    ```


    By symmetry, it can be seen that $Cov[X,Y] = Cov[Y,X]$.


    # Two Variables


    Let $Z_1 = a+bX$ and $Z_2 = c+dY$, where $a, b, c$, and $d$ are constants. We
    have


