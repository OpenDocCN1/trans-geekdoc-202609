  md: '# Chapter 9


    # A Brief History of Finance


    # 9.1 INTRODUCTION


    Today it would be difficult to survive a few days without money. Trade between
    different groups has always existed, and there is evidence that in both the stone
    age and bronze age there was significant trade in various implements. Before the
    industrial revolution, most people had live stock and grew the food that they
    consumed. They also generally lived in family housing that passed through the
    generations. As towns grew in size the majority of people were paid money that
    was used to buy essential food and accommodation. In today''s capitalist society,
    consumers are offered the possibility of obtaining a bewildering choice of both
    essential and non-essential goods. Methods of payment include physical cash, electronic
    money or legally binding contracts (such as a mortgages). Formerly, it was only
    the rich who were concerned with investing money, but now money is used like a
    commodity (rather like sheep and goats were in agrarian societies hundred years
    ago) and it is important for all citizens to understand.


    The aim of this chapter is to provide a brief, non-technical, historical perspective
    on the role of money and financial transactions in society. We will start with
    the Sumerians and finish with the Credit Crisis of 2008. Much of the content containing
    the Credit Crisis is taken from the extensive summary provided by THE FINANCIAL
    CRISIS INQUIRY COMMISSION (2011). It should be mentioned this will be a lightning
    tour and of necessity leave out a great deal of detail.


    # 9.2 EARLY HISTORY


    # 9.2.1 The Sumerians


    In ancient Sumer (3000BC–1900BC), although the standard method of payment was
    grain, ingots of copper and silver were also used. Silver was widely used in the
    town economies that developed in Mesopotamia, while grain was used in the country
    – coined money was not introduced until the first millennium BC. The financial
    transactions of the early Sumerians were codified in the Babylonian Code of Hammurabi
    (c. 1800 BC). This code, which endured for the next 1200 years, regulated ownership
    of land, employment of agricultural labour, civil obligations, land rent and credit.
    For example, creditors had to wait until after the harvest before demanding'
