- pgno: 181
  md: '# Chapter 6


    # Multi-asset Options


    # 6.1 INTRODUCTION


    In this section we consider the valuation of multi-asset, *basket*, options within
    the Black-Scholes pricing framework. These options will be priced using the following
    techniques:


    +   - Analytic methods.

    - Monte Carlo methods.

    - Multidimensional lattices.


    Analytic methods can be useful for pricing multi-asset European options which
    have a known *closed form* solution. They are particularly appropriate for low-dimensional
    European options, when the closed form expressions are not too difficult to evaluate.


    Monte Carlo methods have the advantage that they can easily compute the value
    of multi-asset European options but have difficult the possibility of early exercise;
    this is required for American style options.


    On the other hand, multidimensional lattice techniques allow American options
    to be evaluated with ease. However, lattices become increasingly difficult to
    program as the number of dimensions increases, and the constraints of computer
    storage limits it to problems involving (about) four or less assets.


    # 6.2 THE MULTI-ASSET BLACK–SCHOLES EQUATION


    In Chapter 2, we mentioned that when the price, $S$, of a single asset follows
    GBM in the change in price, $dS$, over a time interval, $dt$, is given by


    ```

    $dS = rSdt + \sigma dW$

    ```


    where $r$ is the risk-free interest rate, $\sigma$ is the volatility of asset
    $S$, and $dW \sim N(0,dt)$.


    We also proved Ito''s lemma that the process followed by $Y = \log(S)$ is


    ```

    $dY = (r - \sigma^2/2)dt + \sigma dW$

    ```


    where $dY$ is the change in the value of $\log(S)$ over the time interval $dt$.
    Later on we derived the (Black–Scholes) partial differential equation that is
    satisfied by'
