    # 9.5 EARLY USE OF DERIVATIVES IN THE USA


    In the United States trading in stock options started after the opening of the
    New York Stock Exchange. The trading of puts and calls took place in an over-the-counter
    market and was facilitated by broker dealers who tried to match option buyers
    with option sellers – this was a cumbersome process. There became protracted over
    price, since every new option contract had its own set of terms and conditions
    such as length of time, number of shares and strike price. As a result of every
    option contract being unique, the buyer and writer were essentially linked for
    the term of the option contract. In the cases where an agreement to close an existing
    contract could not be reached between the two parties, a broker might advertise
    the contract in a financial journal under the heading of ‘Special Options’. In
    addition, because no standard existed to determine the fair price of an option,
    buyers and sellers might argue for days before an agreement was reached. However,
    despite these shortcomings, the traded volume increased (Bookbinder, 1976).


    John Hinkling, a nineteenth century broker on Wall Street, provides the description
    of puts, calls and spreads (Hinkling, 1875):


    A Put – A person holding a Put contract on Pacific Mail at 35 is entitled to any
    decline below the price, and can claim the privilege any time during the thirty
    days, in order to realise the profit it is necessary to take the market price
    of the stock the time you close the contract.


    A Call – The holder of a call contract makes a profit in proportion as the stock
    advances at the time the contract is closed. If you had a call on Union Pacific
    at 30, and the stock advanced to 40, you could present the Call to us and we pay
    you 10.


    Therefore, recommend buying Spread to having a Put and Call. In one contract,
    you are prepared to take advantage of the market whichever way may go. If it advances
    so as to make a good profit you can call the stock. If it declines you can put
    it. It is a matter of indifference to whether it goes up or down.


