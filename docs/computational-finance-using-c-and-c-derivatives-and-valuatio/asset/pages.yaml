    \ caplet instead of the domestic forward rate $F^d(t,t_{k-1},t_k)$, we use the\
    \ foreign forward rate $F^f(t,t_{k-1},t_k)$. Under the probability measure $\\\
    mathbb{F}$ associated with a foreign zero coupon bond $DF^f(t,t_k)$, the foreign\
    \ forward rate is a martingale and is described by the following equation:\n\n\
    ```\n$d(F^f(t,t_{k-1},t_k)) = \\sigma_f F^f(t,t_{k-1},t_k)dW^F_f$. (7.2.77)\n\
    ```\n\nHowever, when we use $DF^d(t,t_k)$ as a numeraire, the process $[\\mathbb{F}\\\
    {F^f(t,t_{k-1},t_k)/DF^d(t,t_k)\\}]$ has a drift and we price the quanto caplet\n\
    \n```\n$d(F^f(t,t_{k-1},t_k)) = d(F^f(t,t_{k-1},t_k))\\alpha dt + \\sigma_f F^f(t,t_{k-1},T_k)dW^F_f$.\
    \ (7.2.78)\n```\n\nOur aim is to find the value of $\\alpha$ and then price the\
