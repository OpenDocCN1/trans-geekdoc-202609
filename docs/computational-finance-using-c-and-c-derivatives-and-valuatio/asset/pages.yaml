    Substituting for $P(\tilde{X}_t \le b)$ from equation (H.1.4) gives


    $$P(m_t^x \le b) = N_1\left(\frac{b-vt}{\sigma\sqrt{t}}\right) + P(m_t^x \le b,
    \tilde{X}_t \ge b). \quad (H.7.1)$


    From equation (H.1.6),


    $$P(m_t^x \le b, \tilde{X}_t \ge b) = \exp\left(\frac{2vb}{\sigma^2}\right) N_1\left(\frac{2b-b+vt}{\sigma\sqrt{t}}\right)\n=
    \exp\left(\frac{2vb}{\sigma^2}\right) N_1\left(\frac{b+vt}{\sigma\sqrt{t}}\right)
    \quad (H.7.2)$


    Combining equation (H.7.2) and equation (H.7.1) yields


    $$P(m_t^x \le b) = N_1\left(\frac{b-vt}{\sigma\sqrt{t}}\right) + \exp\left(\frac{2vb}{\sigma^2}\right)
    N_1\left(\frac{b+vt}{\sigma\sqrt{t}}\right)$


    # H.8 PROOF OF EQUATION (H.1.9)


    We start with


    $$P(m_t^x \ge b) = 1 - P(m_t^x \le b)$.$


    Substituting from (H.1.8),


    $$P(m_t^x \ge b) = 1 - N_1\left(\frac{b-vt}{\sigma\sqrt{t}}\right) + \exp\left(\frac{2vb}{\sigma^2}\right)
    N_1\left(\frac{b+vt}{\sigma\sqrt{t}}\right) \quad (H.8.1)$


    But $1 - N_1(x) = N_1(-x)$, equation (H.8.1) can be expressed as


    $$P(m_t^x \ge b) = N_1\left(\frac{vt-b}{\sigma\sqrt{t}}\right) + \exp\left(\frac{2vb}{\sigma^2}\right)
    N_1\left(\frac{b+vt}{\sigma\sqrt{t}}\right)$


    # H.9 PROOF OF EQUATION (H.10.1)


    We will use equation (H.1.6) to compute $\partial P/\partial x$, where $P(m_t^x
    \le b, \tilde{X}_t \ge x)$ is denoted by $P$.


    Letting $\Theta = (2b-x+vt)/\sigma$, we obtain


    ```

    $$$\frac{\partial P}{\partial x} = \exp\left(\frac{2vb}{\sigma^2}\right) \frac{\partial}{\partial
    x} N_1(\Theta)\n= \exp\left(\frac{2vb}{\sigma^2}\right) \frac{\partial\Theta}{\partial
    x} N_1''(\Theta)\n= \exp\left(\frac{2vb}{\sigma^2}\right) \frac{1}{\sigma\sqrt{t}}n(\Theta)\n=-\
    \frac{1}{\sigma\sqrt{2\pi t}} \exp\left(\frac{2vb}{\sigma^2}\right) \exp\left(\frac{(2b-x+vt)^2}{2\sigma^2t}\right).
    \quad (H.9.1)$

    ```'
