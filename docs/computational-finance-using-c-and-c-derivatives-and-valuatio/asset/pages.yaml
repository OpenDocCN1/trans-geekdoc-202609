    # 9.2.4 Medieval Europe


    Around the time of the first crusade (1095–1099), Genoa emerged as a major sea
    power and trading centre and its fairs attracted traders from around the Mediterranean.
    To deal with the issue of different currencies, a forum was established for arbitrating
    the exchange rates to use. On the third day of each fair, a representative body
    composed of recognised merchant bankers would assemble and determine the exchange
    rates that would prevail. Involved each banker suggesting a rate, and after some
    discussion, a vote would determine the currency exchange rates. For example, at
    Lyon, Florence, Lucca, bankers would typically have different exchange rates.
    Fairs at different locations would provide an opportunity to profit from the variation.
    Bills of exchange were developed during the Middle Ages as a means of transferring
    funds and making payments over long distances without physically moving large
    quantities of precious metals. Thirteenth-century Italian merchants, bankers and
    foreign exchange developed the bill of exchange into a powerful financial tool,
    enabling credit transactions as well as foreign exchange transactions, for more
    detail see Smith (1776). The following example shows the usefulness of bills of
    exchange: Assume that a merchant in Flanders sold goods to a Venetian merchant
    and accepted in payment a bill of exchange drawn on the Flemish promising to pay
    an agent of the Flemish merchant in Venice at a certain date in the future, and
    in a certain currency. The bill of exchange allowed the Venetian merchant to accept
    delivery of the goods from Flanders, sell them and proceed to redeem the bill
    of exchange in Venice, probably in Venetian currency. Bills of exchange were also
    instruments for foreign exchange transactions. Merchants in Italy and major trading
    centres in Europe bought bills of exchange at future dates, in other places, and
    in different currencies. In the example above, the Flemish merchant could sell
    the bill of exchange to an exchange dealer for his own choosing. In turn, the
    exchange dealer could sell the bill of exchange to a Flemish merchant engaged
    in buying goods in Venice. When the bill came for the Flemish merchant would use
    it to buy goods in Venice where the bill of exchange was paid. While this process
    seemed complicated, it substantially reduced the transportation of precious metals.
    In our example, a Venetian merchant bought goods from Flanders, and a Flemish
    merchant bought goods from Venice without any foreign currency leaving Venice
    or Flanders. Bills of exchange also allowed bankers to evade usury laws by hiding'
