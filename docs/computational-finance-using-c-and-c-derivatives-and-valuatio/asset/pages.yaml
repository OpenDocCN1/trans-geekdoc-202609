  img_proc: true
- pgno: 317
  md: "# 316 APPENDIX | C Standard Statistical Results\n\nWe introduce the normalized\
    \ value $z_n$, as follows:\n\n```\n$$$z_n = \\frac{s_n - n\\mu}{\\sigma \\sqrt{n}}\
    \ = \\frac{1}{\\sqrt{n}} \\sum_{i=1}^{n} u_i.$$\n```\n\nThe central limit theorem\
    \ states that as $n$ tends to infinity the probability distribution of $z_n$ tends\
    \ to a normal distribution with zero mean and unit variance, mathematically $z_n\
    \ \to N(0,1)$ as $n \to \\infty$.\n\nProof. From Appendix C.5 equation (C.5.3),\n\
    \n```\n$$$M_{z_n} = E[\\exp(tz_n)] = E \\left[ \\exp \\left\\{ \\frac{t}{\\sqrt{n}}\
    \ \\sum_{i=1}^{n} u_i \right\\} \right].$$\n```\n\nand using (C.5.5)\n\n```\n\
    $$$M_{z_n} = M_u \\left( \\frac{t}{\\sqrt{n}} \right)^n.$$$$\n```\n\nEquation\
    \ (C.5.1) then yields\n\n```\n$$$M_u \\left( \\frac{t}{\\sqrt{n}} \right) \\approx\
    \ 1 + \\frac{t}{\\sqrt{n}} E[u] + \\frac{1}{2} \\left( \\frac{t}{\\sqrt{n}} \r\
    ight)^2 E[u^2] + ..$$$$\n```\n\nAs $n \\to \\infty/t(\\sqrt{n}) \\to 0$,\n\n```\n\
    $$$M_u \\left( \\frac{t}{\\sqrt{n}} \right) \\to 1 + \\frac{t}{\\sqrt{n}} E[u]\
    \ + \\frac{1}{2} \\left( \\frac{t}{\\sqrt{n}} \right)^2 E[u^2] = 1 + \\frac{t^2}{2n}.$$$$\n\
    ```\n\nThus,\n\n```\n$$$M_u \\left( \\frac{t}{\\sqrt{n}} \right)^n = \\left( 1\
    \ + \\frac{t^2}{2n} \\right)^n \\to 1 + \\frac{t^2}{2n} \\text{ as } n \\to \\\
    infty,$$$$\n```\n\nwhere we have used the fact that $t << 1$ Grimmett and Welsh\
    \ (1986).\nWe have therefore shown that as $n \\to \\infty$\n\n```\n$$$M_{z_n}(t)\
    \ \\to e^{\\frac{t^2}{2}}.$$$\n```\n\nThus from Appendix D.1, the moment generating\
    \ function $M_z(t)$ for a standard normal distribution ($\\mu = 0, \\sigma^2 =\
    \ 1$) is\n\n```\n$$$M_z(t) = e^{\\frac{t^2}{2}}, \\text{ where } z \\sim N(0,1).$$$$\n\
    ```\n\nThus, we have proved that $z_n \\to N(0,1)$ as $n \\to \\infty$."
