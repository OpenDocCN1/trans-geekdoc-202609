    Re-arranging we obtain


    ```

    $d\left(\\frac{X_f^S}{B^d}\right)=\left(\\frac{X_f^S}{B^d}\right)\{\alpha+\sigma_s\sigma_x\rho_{xs}\}}dt+\left(\\frac{X_f^S}{B^d}\right)(\sigma_s
    dW_s^Q+\sigma_x dW_x^Q).\n\n(7.5.19)$

    ```


    We already mentioned that $(\frac{X_f^B}{B^d})$ is a martingale under probability
    measure $Q$ so the drift term in equation (7.5.19) can then be zero. This means
    that


    ```

    $\alpha=-\sigma_s\sigma_x\rho_{xs},

    ```


    where $\sigma_s$ is volatility of the foreign equity, $\sigma_x$ is volatility
    of the foreign exchange rate, and $\rho_{xs}$ is the correlation between $dW_s$
    and $dW_x$. Equation (7.5.13) can then be written as


    ```

    $dS^F=\{rf-\\sigma_s\sigma_x\rho_{xs}\}S^F dt+\sigma_s S^F dW_s^Q.\n\n(7.5.20)$

    ```


    # Equity Quanto Forward


    (The time $t$) value of a domestic equity forward contract with maturity $T$


    ```

    $F(t)=DF^d(t,T)\{S^d(t,T)-K^d\},$

    ```


    where $K^d$ is the strike in domestic currency and $S^d(t,T)$ is the domestic
    forward price.


    To value an equity quanto contract, we need to know the forward price of the foreign
    equity $S^F$.


    It can be seen from equations (4.4.31),(4.4.32) and (7.5.20) can for this forward
    price is


    ```

    $S^F(t,T)=S^F(t)\exp((rf-\\sigma_s\sigma_x\rho_{xs})(T-t)).\n\n(7.5.21)$

    ```


    where $S^F(t)$ is the current price of the foreign equity and $T$ is the maturity
    of the forward.


    In equity quanto forward, the payoff is in foreign currency but it is converted
    to domestic currency at a predetermined exchange rate (which denote here by X).
    The value quanto forward is


    ```

    $qPF(t)=DF^d(t,T)\{S^d(t,T)-K^f\}X,$

    ```


    where $X$ is the specified exchange rate, $K^f$ is the strike in units of foreign
    currency, and $S^F(t,T)$ is the forward foreign equity price.


    # Equity Quanto Option


    In Chapter 4, equations (4.4.58) and (4.4.59) expressed the value of vanilla European
    put and call options as


    ```

    $Call(t)=\exp(-rd(T-t))\{S^d(t,T)N_1(d_1)-EN_1(d_2)\},\n$

    ```


    ```

    $Put(t)=\exp(-rd(T-t))\{-S^d(t,T)N_1(-d_1)+EN_1(-d_2)\},$

    ```'
