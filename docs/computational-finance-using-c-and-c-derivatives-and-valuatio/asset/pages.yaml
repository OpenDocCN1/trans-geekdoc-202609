    # 2.2 BROWNIAN MODEL OF ASSET PRICE MOVMENTS


    In the previous section, we showed Brownian motion can be used to describe the
    motion of small particles suspended in a liquid. The first attempt at using Brownian
    motion to describe financial asset price movements was provided by Bachelier (1900).
    This however had limited success because the *significance* of a given change
    in asset price depends on the original asset price. For example, a £1 increase
    in the value of a share originally £1.10 is *more significant* than a £1 increase
    in the value of a share originally £100. It is for this reason that asset price
    movements are generally described in terms of *relative* or percentage changes.
    For example, if the £1.10 increases by £11 and the £100 increases, both of these
    price changes have the same significance and correspond to a 10% increase in value.
    The idea of relative price changes in the value of a share can be formalized by
    defining a quantity called the *return*, $R_t$, of a share at time $t$. The return
    $R_t$ is defined as follows:


    ```

    $$R_t = \frac{S_{t+dt}-S_t}{S_t} = \frac{dS_t}{S_t}, \quad (2.2.1)$$

    ```


    where $S_{t+dt}$ is the value of the share at time $t+dt$, $S_t$ is the value
    of the share at time $t$, and $dS_t$ is the change in value of the share over
    the time interval dt. The percentage return $R^*$, over the time interval $dt$
    is simply defined as $R^* = 100 \times R_t$.


    We are now in position to construct a simple Brownian model of asset price movements,
    however further information on Brownian motion within finance can be found in
    Shreve et al. (1997).

    The asset return at time $t$ is now given by


    ```

    $$R_t = \frac{dS_t}{S_t} = \mu dt + \sigma dW_t, \quad dW_t \sim N(0,dt), \quad
    (2.2.2)$$

    ```


    or equivalently $$dS_t = S_t \mu dt + S_t \sigma dW_t. \quad (2.2.3)$$'
