    \ the American option.\n\nSetting $\\Delta_E = \\Delta_A$, we then have\n\n> $p^{BS}(S,E,\t\
    au) - p^L(S,E,\tau) = p^*(S,E,\tau) - p^L(S,E,\tau)$\n\n> $p^*(S,E,\tau) = p^{BS}(S,E,\t\
