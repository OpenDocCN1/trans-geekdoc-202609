    # 2.12 OTHER USEFUL RESULTS


    # 2.12.1 Fubini''s Theorem


    Fubini''s theorem states that (for well-behaved functions) the value of a multidimensional
    integral is independent of the order in which the integral is evaluated. For example,
    the two-dimensional integral of the function $f(X,Y)$ can be evaluated as


    ```

    $$\int_{X=a}^b \int_{Y=c}^d f(X,Y)dXdY = \int_{X=a}^b \int_{Y=c}^d f(X,Y)dX =
    \int_{Y=c}^d \int_{X=a}^b f(X,Y)dY.$$

    ```


    We will mainly use this result in the form


    ```

    $$\left[\int_{s=0}^t f(W,s)ds\right] = \int_{s=0}^t E[f(W,s)]ds. \quad (2.12.1)$$$

    ```


    Since


    ```

    $E[f(W,s)] = \int_{-\infty}^{\infty} P(W,s)f(W,s)dW$

    ```


    where $P(W,s)$ is the probability density function of $f(W,s)$. We can then use
    equation (2.12.1) in full


    ```

    $$\int_{-\infty}^{\infty} \int_{s=0}^t P(W,s)dsdW = \int_{s=0}^t \int_{W=-\infty}^{\infty}
    P(W,s)dsdW.$$

    ```


    # 2.12.2 Ito''s Isometry


    The expected value of the integral of the well-behaved function $f(W_t,t)$ satisfies


    ```

    $$\left[\int_{s=t_a}^{t_b} f(W_s,s)dW_s\right]^2 = \left[\int_{s=t_a}^{t_b} \{f(W_s,s)\}2
    ds\right]. \quad (2.12.2)$$$

    ```


    ```

    $$\int_{s=t_a}^{t_b} f(W_s,s)dW_s = \sum_{i=0}^{n-1} f(W_{t_i},t_i)\{W_{t_{i+1}}-W_{t_i}},$$

    ```


    where $t_a < t_0 < t_1 < ... < t_b, t_{i+1}-t_i = (t_b-t_a)/n = dt$, and $t_i
    = t_a + id, i = 0,...,n-1$. The integral, on the left-hand side (LHS) of'
