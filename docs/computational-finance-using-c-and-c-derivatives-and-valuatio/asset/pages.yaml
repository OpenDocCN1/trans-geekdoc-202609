  md: "# 176 CHAPTER 6 Multi-asset Options\n\nthe value, V, of an option written on\
    \ a single underlying asset. The equation is\n\n```\n$$\\frac{\\partial V}{\\\
    partial t}+\\frac{\\sigma^2}{2}\\frac{\\partial^2 V}{\\partial S^2}+rS\\frac{\\\
    partial V}{\\partial S}-rV = 0$\n```\n\nThe above result can be generalized to\
    \ deal with multi-asset options. Suppose that m assets follow the following processes:\n\
    \n```\n$dY_i=(r-\\sigma_i^2/2)dt+\\sigma_idW_i, \\quad i=1,\\dots,m, \\quad (6.2.1)\n\
    ```\n\nwhere the subscript $i$ refers to the value associated with the $i$ asset.\
    \ The m random vector $dW$ is distributed as $dW \\sim N(0,C)$. The diagonal elements\
    \ of $C$ are $C_{ii}=Var[dW_i]=dt, i=1,\\dots,m$ and off-diagonal elements are\n\
    \n```\n$C_{ij}=E[dW_id_j]=\\rho_{ij}dt, \\quad i=1,\\dots,m, \\quad i\\neq j$,\n\
    ```\n\nWe can also write the above equation in vector by introducing the m element\
    \ vector $Y$ which is distributed as\n\n```\n$dY\\sim N(v,C), \\quad (6.2.2)\n\
    ```\n\nwhere $v$ is the mean vector and $C$ is the covariance matrix. The elements\
    \ of the covariance matrix are\n\n```\n$\\tilde{C}_{ij}=\\sigma_i\\sigma_j\\rho_{ij}dt,\
    \ \\quad i\\neq j,i=1,\\dots,m,j=1,\\dots,m,\\n\\quad\\quad\\quad(6.2.3)\n```\n\
    \nwhere $\\rho_{ij}$ is the correlation coefficient between asset $i$ and asset\
    \ $j$, that is, the correlation between $dW_i$ and $dW_j$, and the mean vector\
    \ $v$ are\n\n```\n$v_i=r-\\sigma_i^2/2, \\quad i=1,\\dots,m. \\quad\\quad(6.2.4)\n\
    ```\n\nThe value $V$ of an option written on $n$ assets satisfies the following\
    \ partial differential equation:\n\n```\n$$\\frac{\\partial V}{\\partial t}+\\\
    frac{1}{2}\\sum_{i=1}^{m}\\sum_{j=1}^{m}\\sigma_i\\sigma_j\\rho_{ij}S_iS_j\\frac{\\\
    partial^2 V}{\\partial S_i\\partial S_j}+r\\sum_{i=1}^{m}S_i\\frac{\\partial V}{\\\
    partial S_i}-rV=0$\n```\n\nFor a call on the maximum of $m$ assets, the payoff\
    \ $P_c^{MAX}$ (time $\\tau$) is given by $P_c^{MAX}=\\max(S_1^{\tau},S_2^{\tau},\\\
    dots,S_m^{\tau})-E$, where $S_i^{\tau},i=1,\\dots,m$ denotes the value of the\
    \ $i$th asset at maturity, and a European option on the minimum of $m$ assets\
    \ has a payoff, $P_p^{MIN}$, at time $\\tau$, given by $P_p^{MIN}=\\max(E-S_1^{\t\
    au},S_2^{\tau},\\dots,S_m^{\tau}),0$.\n\n# 6.3 MULTIMENSIONAL MONTE CARLO METHODS\n\
