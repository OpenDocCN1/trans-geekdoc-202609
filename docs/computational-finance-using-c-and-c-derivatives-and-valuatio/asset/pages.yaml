  md: '# Chapter 8


    # C# Portfolio Pricing Application


    # 8.1 INTRODUCTION


    This section provides details concerning a C# portfolio valuation application.
    It has been included to illustrate how the pricing functions discussed in the
    previous sections of the book can be incorporated into the kind of software that
    may be found in a bank, financial institution, or educational establishment.


    Here, we provide code excerpts from the application; however, additional source
    is available from the publisher''s website.

    The main features of this application are as follows:


    +   - User-defined portfolios of deals can be valued without the need to compile
    C++ or C# programs. This means that the application is easy to use and is accessible
    to those who may possess business or financial knowledge but do not have the technical
    skills required to write computer code.

    - This application only deals with equity, foreign exchange derivatives — the
    exception is the inclusion of an interest rate forward rate. However, the software
    can be easily extended to include new deal types.

    - All input/output to the application is by main of text files which can be easily
    edited.

    - The software is modular and consists of a main C# program which calls both a
    compiled C# DealLibrary and also a compiled library GeorgeLevy_ComputationalFinance_UtilsLibrary.
    The reader also has the choice of using a simpler C# project called DealValuer;
    this does not use text input and also is independent of GeorgeLevy_ComputationalFinance_UtilsLibrary.


    We will provide a brief overview of each component of the application, more detail
    will be given when specific class is described.


    # The C# Code


    The application is defined by the C# solution PortfolioValuer.sln, which contains
    the projects DealLibrary.csproj and PortfolioValuer.csproj.

    The project PortfolioValuer.csproj is the driver for the application, see Code
    excerpt 8.2. The user interface is a simply window with a button to start the
    application, and if required this could easily customized by the reader. Once
    the application has been started, it first loads a market data file and'
