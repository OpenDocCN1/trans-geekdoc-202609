  md: '# 68 CHAPTER 4 European Options


    We therefore have


    $I_B = E \exp(-r\tau)N_1(-k_2). \quad (4.4.43)$


    We will now consider the integral $I_A$,


    ```

    $I_A = \frac{S \exp(-r\tau)}{\sigma \sqrt{2\pi}} \int_{log(E/S)}^{\infty} \exp(X)
    \exp\left( \frac{\{X - (r - \sigma^2/2)\tau)^2}{2\sigma^2\tau} \right) dX.$

    ```


    Rearanging the integrand,


    ```

    $I_A = \frac{S \exp(-r\tau)}{\sigma \sqrt{2\pi}} \int_{log(E/S)}^{\infty} \exp\left(
    \frac{\{\{X - (r - \sigma^2/2)\tau)^2 - 2\sigma^2\tau X\}}{2\sigma^2\tau} \right)
    dX. \quad (4.4.44)$

    ```


    Expanding the terms in the exponential,


    ```

    $\{X - (r - \sigma^2/2)\tau)^2 - 2\sigma^2\tau X = X^2 - 2\{(r - \sigma^2/2)\tau
    X\ + \{(r - \sigma^2/2)\tau\}^2$,$\n$= X^2 - 2\{(r - \sigma^2/2)\tau X\} + \{(r
    - \sigma^2/2)\tau\}^2$,$\n$= \{X - (r + \sigma^2/2)\tau\}^2 + \{(r - \sigma^2/2)\tau\}^2
    - \{(r + \sigma^2/2)\tau\}^2$,

    ```


    which results in


    ```

    $\{X - (r - \sigma^2/2)\tau)^2 - 2\sigma^2\tau X = \{X - (r + \sigma^2/2)\tau\}^2
    - 2\sigma^2\tau rr. \quad (4.4.45)$

    ```


    Substituting equation (4.4.45) into the integrand of equation, we have


    ```

    $$\exp(X) \exp\left( \frac{\{X - (r + \sigma^2/2)\tau\}^2}{2\sigma^2\tau} \right)
    = \exp(r\tau) \exp\left( \frac{\{X - (r + \sigma^2/2)\tau\}^2}{2\sigma^2\tau}
    \right)$

    ```


    The integral $I_A$ can be expressed as


    ```

    $I_A = \frac{S \exp(-r\tau) \exp(-r\tau)}{\sigma \sqrt{2\pi}} \int_{log(E/S)}^{\infty}
    \exp\left( \frac{\{\{X - (r + \sigma^2/2)\tau)^2}{2\sigma^2\tau} \right) dX.$

    ```


    If we let $u = \frac{X - (r + \sigma^2/2)\tau}{\sigma \sqrt{\tau}}$, then $dX
    = \sigma \sqrt{\tau} du$.


    So


    ```

    $I_A = \frac{S \sqrt{\tau}}{\sigma \sqrt{2\pi}} \int_{u_1}^{\infty} \exp\left(
    -\frac{u^2}{2} \right) du.$

    ```


    where the lower limit of integration is $k_1 = [log(E/S) - (r + \sigma^2/2)\tau]/\sigma
    \sqrt{\tau}$.


    We therefore have


    ```

    $I_A = SN_1(-k_1). \quad (4.4.46)$

    ```


    Therefore, the value of a European call is


    ```

    $c(S, E, \tau) = SN_1(-k_1) - E \exp(-r\tau)N_1(-k_2),$

    ```'
