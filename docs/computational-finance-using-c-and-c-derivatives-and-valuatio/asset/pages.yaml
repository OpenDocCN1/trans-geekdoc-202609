    # 9.2.3 The Greeks


    The first official coinage was made from a mixture of gold and silver and was
    minted in Lydia during the seventh century BC. In Greece, from the sixth century
    BC to the first century AD, there were the following six types of loans:


    +   1. Loans for personal or productive use; similar to bank loan for a small
    business.

    2. Loans secured on real estate.

    3. Loans to cities.

    4. Endowments invested and paying a specified rate of return.

    5. Loans to industry and commerce – these were highly speculative short-term loans.

    6. Personal and miscellaneous loans – these could be as high as 48% per month.


    There is also mention of the first option contract dating back to 624 BC–546 BC.
    According to Aristotle, Thales predicted, through studying the stars during the
    winter, that there would be a great harvest of olives in the following year. He
    then bought the rights to use all the olive presses in Chios and Miletus; he did'
