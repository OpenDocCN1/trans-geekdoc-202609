    \ \\} - K$.\n\n# 7.3 FOREIGN EXCHANGE DERIVATIVES\n\nHere, we consider derivatives\
    \ based on the exchange rate between a domestic currency and a foreign currency.\
    \ We will use the convention that quantities relating to the domestic currency\
    \ will have the superscript $d$, while those for the foreign currency will have\
    \ the superscript $f$. The notation for the various exchange rates is as follows:\n\
    \n+   $X_t^f(t)$ is the spot value of one unit of foreign currency in domestic\
    \ currency at time $t$,\n$X_t^b(t)$ is the spot value of one unit of foreign currency\
    \ in base currency at time $t$,\n$X_t^d(t)$ is the spot value of one unit of domestic\
    \ currency in base currency at time $t$,\n$X_t^f(t,T)$ is the (time $t$) forward\
    \ value of one unit of foreign currency in domestic currency at time $T$.\n\n\
    Covered Interest Arbitrage\nWhen the current spot rate, $X_t^f(t)$, is known as\
    \ Covered Interest Arbitrage, it is possible to obtain a value for future spot\
    \ exchange rate – we denote this foreign exchange rate by $X_t^f(t,T)$, where\
    \ $T > t$.\n\nLet us consider the following scenarios:\n\nScenario A\nAt time\
    \ $t$ an investor deposits one unit of foreign currency which grows at the (constant)\
    \ foreign risk-free interest rate $r^f$. By time $T$ the initial amount will have\
    \ increased to $1/DF^f(t,T)$ units of foreign currency, where $DF^f(t,T) = \\\
    exp(-r^f(T-t))$. The foreign currency is converted into domestic currency at the\
    \ time $T$ forward exchange rate $X_t^f(t,T)$ and yields $X_t^f(t,T)/DF^f(t,T)$\
    \ units of domestic currency.\n\nScenario B\nAt time $t$ an investor deposits\
    \ $X_t^f(t)$ units of domestic currency (the scheme is equivalent to one unit\
    \ of foreign currency), and this grows at the (constant) domestic risk-free interest\
    \ rate $r^d$. At time $T$ the initial sum will have"
