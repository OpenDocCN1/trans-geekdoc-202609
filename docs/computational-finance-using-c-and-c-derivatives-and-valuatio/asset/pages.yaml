    \ forward rate $F(t_0, t_{k-1}, t_k)$. Equation (7.2.74) can be evaluated using\
    \ the Black Scholes formula as:\n\n```\n$Caplet(t_0) = P D F(t_0, t_k) \\{N_1(d_1)\
    \ - K N_1(d_2)\\}, \\quad (7.2.75)$\n```\n\nwhere $\\sigma_k$ is the volatility\
    \ of $F_k$, and\n\n```\n$d_1 = \\frac{\\log(\\left(\\frac{F(t_0, t_{k-1}, t_k)}{K}\\\
    right)) + \\frac{\\sigma_d^2\\tau}{2}}{\\sigma_d\\sqrt{\\tau}},\n```\n\n```\n\
    $d_2 = \\frac{\\log(\\left(\\frac{F(t_0, t_{k-1}, t_k)}{K}\\right)) - \\frac{\\\
    sigma_d^2\\tau}{2}}{\\sigma_d\\sqrt{\\tau}}, \\quad (7.2.76)$\n```"
