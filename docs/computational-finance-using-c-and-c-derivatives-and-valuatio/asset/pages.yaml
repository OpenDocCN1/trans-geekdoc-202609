    # 2.3 ITO''S FORMULA (OR LEMMA)


    In this section, we will derive Ito''s formula, a more rigorous treatment than
    we found in Karatas and Shreve (2000).


    Let us consider the stochastic process X,


    ```

    $dX = a dt + b dW = ad + b\sqrt{dt} dZ, \quad dZ \sim N(0,dt), \quad dW \sim N(0,dt).
    \quad (2.3.1)$

    ```


    **where** $a$ and $b$ are constants. We want to find the process followed by a
    function of the stochastic variable $X$, that is, $\phi(X,t)$. This can be done
    by applying a Taylor expansion, to order second, in the variables $X$ and $t$
    as follows:


    ```

    $\phi^* = \phi + \frac{\partial \phi}{\partial t}dt + \frac{\partial \phi}{\partial
    X}dX + \frac{1}{2}\frac{\partial^2 \phi}{\partial X^2}dX^2 + \frac{1}{2}\frac{\partial^2
    \phi}{\partial t^2}dt^2 + \frac{\partial^2 \phi}{\partial X\partial t}dXdt, \quad
    (2.3.2)$

    ```


    $\phi^*$ is used to denote the value $\phi(X+dX


    ```

    $dX^2 = (adt + b\sqrt{dt} dZ)(adt + b\sqrt{dt} dZ) = a^2dt^2 + 2ab dt^{3/2} dZ
    + b^2 dt^2$,

    ```


    then


    ```

    $dXdt = a^2dt + b dt^{3/2} dZ$.

    ```


    So as $dt \to 0$, and ignoring all terms in $dt$ of order greater than 1, we have


    ```

    $dX^2 \sim b^2 dt^2, \quad dt^2 \sim 0, \quad \text{and} dXdt \sim 0$.

    ```


    Therefore, equation (2.3.2) can be rewritten as


    ```

    $d\phi = \frac{\partial \phi}{\partial t}dt + \frac{\partial \phi}{\partial X}dX
    + \frac{1}{2}\frac{\partial^2 \phi}{\partial X^2} E[dX^2]. \quad (2.3.3)$

    ```


    where $d\phi = \phi^* - \phi$, and we have replaced $dX^2$ by its expected value
    $E[dX^2]$. Now


    ```

    $E[dX^2] = E[b^2 dt dZ^2] = b^2 dt E[dZ^2] = b^2 dt$.

    ```


    we have used the fact that, $dZ \sim N(0,dt)$, the variance of $dZ$, $E[dZ^2]$,
    is by definition 1. Using these values in equation (2.3.3) and substituting for
    $dX$ from equation (2.3.1), we obtain


    ```

    $d\phi = \frac{\partial \phi}{\partial t}dt + \frac{\partial \phi}{\partial X}(adt
    + bdw) + \frac{b^2}{2}\frac{\partial^2 \phi}{\partial X^2}dt. \quad (2.3.4)$

    ```


    This gives Ito''s formula


    ```

    $d\phi = (\frac{\partial \phi}{\partial t} + a\frac{\partial \phi}{\partial X}
    + \frac{b^2}{2}\frac{\partial^2 \phi}{\partial X^2})dt + \frac{\partial \phi}{\partial
    X}b dW. \quad (2.3.5)$

    ```'
