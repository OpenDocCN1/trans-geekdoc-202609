  md: "# 82 CHAPTER | 4 European Options\n\n# 4.5 BARRIER OPTIONS\n\n# 4.5.1 Introduction\n\
    \nBarrier options are derivatives which the payoff depends on whether the asset\
    \ price reaches a given barrier level, B. Knockout options become worthless (cease\
    \ to exist) if the asset price reaches the barrier, whereas knockin options come\
    \ into existence when the asset price hits the barrier. We will consider the following\
    \ single asset European barrier options:\n\n+   - **Down and call**: A knockout\
    \ vanilla call option, value $c_{do}$, which ceases to exist when the asset price\
    \ reaches or goes below the barrier level.\n- **Up and call**: A knockout vanilla\
    \ call option, value $c_{uo}$, which ceases to exist when the asset price reaches\
    \ or goes above the barrier level.\n- **Down and in**: A knockin vanilla call\
    \ option, value $c_{di}$, which comes into existence when the asset price reaches\
    \ or goes below the barrier level.\n- **Up and in**: A knockin vanilla call option,\
    \ value $c_{ui}$, which comes into existence when the asset price reaches or goes\
    \ above the barrier level.\n\nThe following expressions may be true:\n\n```\n\
    $c = c_{uo} + c_{ui}, \\quad (4.5.1)$\n$$c = c_{do} + c_{di}. \\quad (4.5.2)$$\n\
    ```\n\nwhere $c$ is the value of the vanilla call option. We need thus derive\
    \ expressions for both the knockout options and then use the above equations to\
    \ calculate the value of the corresponding knockin options.\n\nThe notation that\
    \ we will use is as follows: The symbol $t$ represents the current time, at which\
    \ the option matures, and $\tau = T - t$, the duration of the option. The symbol\
    \ $s$, with constraint $t \\le s \\le T$, is any intermediate time during which\
    \ the option is alive.\n\n# 4.5.2 Analytic Pricing of Down and Out Options\n\n\
    If we consider Brownian motion (with zero drift) $X_s \\sim N(0, (s-t)\\sigma^2),\
    \ t \\le s \\le T$ which starts at $X_t = 0$, and after time $\tau = T - t$, ends\
    \ at the point $X_T = X$, the ([Freeman (1983)]) probability density function\
    \ for this motion not to exceed the value $X = b$ (where $b > 0$) during $\tau$\
    \ is given by\n\n```\n$f(b \\ge X_s^{max}, X) = \\Omega \\sqrt{\\frac{2}{\\pi}}\
    \ \\exp\\left(-\\frac{2b(X-b)}{\\sigma^2\\tau}\\right) \\exp\\left(-\\frac{X^2}{2\\\
    sigma^2\\tau}\\right). \\quad (4.5.3)$\n```\n\nwhere for convenience we have used\
    \ $\\Omega = (2b - X)/\\sigma^3\\tau^{3/2}$, and $X_s^{max} = \\max(X_s, t \\\
    \ s \\le T)$. Since $X_s$ is Brownian motion without drift and volatility $\\\
    sigma$, then $-X_s$ is identical Brownian motion. By substituting $X \\to -X$\
    \ and $b \\to -b$ in our equation, we have\n\n```\n$f(b \\le X_s^{min}, X) = \\\
    Omega \\sqrt{\\frac{2}{\\pi}} \\exp\\left(-\\frac{2b(X-b)}{\\sigma^2\\tau}\\right)\
    \ \\exp\\left(-\\frac{X^2}{2\\sigma^2\\tau}\\right). \\quad (4.5.4)$\n```"
