  md: '# Chapter 5


    # Single Asset American Options


    # 5.1 INTRODUCTION


    In Chapter 4, we discussed single asset European options and the analytic formulae
    we were used to price them. Here, we will consider the valuation of single asset
    American style options using both numeric methods and analytic formula; in addition,
    we will discuss the use of numerical techniques to value certain European options.
    The coverage in this section is as follows:


    +   * Analytic approximation techniques for the valuation of American options.

    * Binomial lattice techniques used for the valuation of American and European
    options.

    * The valuation of American and European barrier options using finite-difference
    grids.

    * The valuation of American options via Monte Carlo simulation.


    It should be mentioned that although much of the discussion concerns the valuation
    of vanilla European and American puts and calls, the techniques can be modified
    without much difficulty to include more exotic options with customized payoffs
    and early exercise features.


    # 5.2 APPROXIMATIONS FOR VANILLA AMERICAN OPTIONS


    # 5.2.1 American Call Options with Cash Dividends


    In this section, we will consider the valuation of vanilla American call options
    with cash dividends and discuss the methods of both the Roll and Geske, and Whaley
    and Black. We will first consider the Roll, Geske, and Whaley method.


    The Roll, Geske, and Whaley Approximation

    This method uses the work of Roll (1977), Geske (1979), and Whaley (1981). Let
    $S$ be the current (time $t$) price of an asset which pays a single cash dividend
    $D_1$ at time $t_1$. At the ex-dividend date, $t_1$, there will be a decrease
    in the value of $S_t$ to $S_t-D_1$. Also the current price of netcrow dividends
    is


    ```

    $S_D = S - D_1 \exp(-r(t_1 - t)).$ (5.2.1)

    ```


    Now consider an American call option, with strike $E$ and expiry time $T$, which
    is taken out on this asset. At $t_1$, there will be a given ex-dividend asset'
