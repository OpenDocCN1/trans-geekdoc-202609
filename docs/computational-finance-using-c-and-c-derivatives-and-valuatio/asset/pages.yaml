- pgno: 175
  md: '# Compute the Lattice Option Prices


    The method used to compute the option values is *similar* to that used by the
    binomial tree. The main difference is that there are now b branches per node instead
    of two. The option values are computed by starting at the lattice terminal nodes
    and iterating backwards. Here, we denote the option value at the kth time step
    as $f_i^k$.


    The option values at the terminal nodes, $t_{d-1}$, are computed in the usual
    manner. For a put, we have


    ```

    $f_{d-1}^k = \text{MAX}(E - S_{d-1}^k, 0), \quad k=1, \dots, b^{d-1}$

    ```


    where $E$ is the exercise price. The option values at the $(i-1)$ time step are
    computed from those at the ith time step as follows:


    ```

    $f_{i-1}^k = \text{MAX}(g_{i-1}^k, h_{i-1}^k)$

    ```


    where


    ```

    $h_{i-1}^k = \frac{\exp(-r\Delta t)}{b} \sum_{j=1}^{(k-1)b+j}$

    ```


    and


    ```

    $g_{i-1}^k = \text{MAX}(E - S_{i-1}^k, 0)$

    ```


    The option value for the p stochastic lattice is therefore


    ```

    $f_H^\theta = f_0^1 = \frac{\exp(-r\Delta t)}{b} \sum_{j=1}^b f_1^j$

    ```


    Figure 5.10 shows the option values for an American call with strike price $E=100$
    and interest rate $r=0$, when the lattice asset prices in Fig. 5.9 are used. To
    make things clear as possible, we show how the value of each node is computed.


    # Terminal nodes


    The option values at the terminal nodes are the following:


    $f_2^1 = \text{max}(116-100,0) = 16, \quad f_2^2 = \text{max}(90-100,0) = 0, \quad
    f_2^3 = \text{max}(149-100,0) = 49,$


    $f_2^4 = \text{max}(32-100,0) = 0, \quad f_2^5 = \text{max}(50-100,0) = 0, \quad
    f_2^6 = \text{max}(48-100,0) = 0,$


    $f_2^7 = \text{max}(102-100,0) = 2, \quad f_2^8 = \text{max}(88-100,0) = 0, \quad
    f_2^9 = \text{max}(80-100,0) = 0.$


    # Time step 1


    Here, we have


    $g_1^1 = \text{max}(115-100,0) = 15, \quad g_1^2 = \text{max}(60-100,0) = 0, \quad
    g_1^3 = \text{max}(114-100,0) = 14.$'
