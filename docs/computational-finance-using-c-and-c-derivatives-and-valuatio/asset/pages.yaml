    Using Ito, we have


    ```

    $d\phi = \frac{\partial\phi}{\partial F_k}dF_k + \frac{1}{2}\frac{\partial^2\phi}{\partial
    F_k^2}E[(dF_k)^2], \text{ where } E[(dF_k)^2] = \sigma_k^2 F_k^2 dt, \quad (7.2.47)$

    ```


    where from equation (7.2.44)


    ```

    $\frac{\partial\phi}{\partial F_k} = -\frac{\tau}{(1+\tau F_k)^2}, \frac{\partial^2\phi}{\partial
    F_k^2} = \frac{2\tau^2}{(1+\tau F_k)^2}. \quad (7.2.48)$

    ```


    Substituting the values in (7.2.48) into (7.2.47), we obtain


    ```

    $d\phi = -\frac{\tau}{(1+\tau F_k)}F_k\mu_k dt + F_k\sigma_k dW^{k-1} + \frac{1}{2}\frac{\tau^2\sigma_k^2
    F_k^2}{(1+\tau F_k)^2}$.

    ```


    which can be re-arranged


    ```

    $d\phi = -\frac{\tau F_k\mu_k}{1+\tau F_k}dt + \frac{\tau^2\sigma_k^2 F_k^2}{(1+\tau
    F_k)^2}dt - \frac{\tau F_k\sigma_k}{1+\tau F_k}dW^{k-1}. \quad (7.2.49)$

    ```


    Now since equation (7.2.49) is driftless,


    ```

    $$-\frac{\tau F_k\mu_k}{1+\tau F_k} + \frac{\tau^2\sigma_k^2 F_k^2}{(1+\tau F_k)^2}dt
    = 0$$

    ```


    and


    ```

    $\mu_k = \frac{\tau\sigma_k^2 F_k^2}{1+\tau F_k}. \quad (7.2.50)$

    ```


    Substituting equation (7.2.50) into equation (7.2.46),


    ```

    $dF_k = \frac{\tau\sigma_k^2 F_k^2}{1+\tau F_k}dt + F_k\sigma_k dW^{k-1}$

    ```


    or


    ```

    $dF_k = F_k\sigma_k \frac{\tau\sigma_k F_k}{1+\tau F_k}dt + F_k\sigma_k dW^{k-1}.
    \quad (7.2.51)$

    ```


    Comparing equations (7.2.51) and (7.2.40) thus yields


    ```

    $dW^k = \frac{\tau\sigma_k F_k}{1+\tau F_k}dt + dW^{k-1}. \quad (7.2.52)$

    ```


    which is the relationship between the Brownian motions $dW^{k-1}$ and $dW^k$ under
    the respective probability measures $Q^{k-1}$ and $Q^k$.


    Let the stochastic process follow by $F_k$ under $Q^{k-2}$ be


    ```

    $dF_k = F_k\mu_k dt + F_k\sigma_k dW^{k-2}. \quad (7.2.53)$

    ```


    where $dW^{k-2}$ is Brownian motion under probability measure $Q^{k-2}$, and the
    drift, $\mu_k$, is unknown.'
