    \ singular values $\\sigma_{i,1}=1\\dots,p$, as the diagonal elements and zero\
    \ elsewhere, and $V$ is $p$ by $p$ unitary matrix.\nWe have\n\n```\n$X^T X = (U\
    \ K V^T)^T U V^T\n= V K^T U^T U V^T\n= V^T K^T K V^T\n= V \\Sigma V^T$\n```\n\n\
