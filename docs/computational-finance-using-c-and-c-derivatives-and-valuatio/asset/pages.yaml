    Here, the improved accuracy can be achieved by using nonuniform grids instead
    of uniform grids is illustrated in Figs 5.7 and 5.8. The uniform grids are constructed
    using the method outlined in Section 5.4 and Code excerpt 5.18. That is an asset
    grid line is to coincide with the current asset price $S_0$, and the other grid
    lines are placed above and below $S_0$ with a uniform spacing of $\Delta S$. The
    disadvantage of this approach is that there will be an unspecified pricing error
    depending on the distance, $d_s$, of the barrier level, $B$, to'
