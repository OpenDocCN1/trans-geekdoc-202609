    21-page document prepared for regulators by AIG entitled “A.I.G.: Is the Risk
    Systemic?” It noted that AIG’s insurance subsidiaries had issued 375 million policies
    in the US with a face value of $19 trillion.


    Nobody knew for certain the scope of the damage that would result from an AIG
    bankruptcy. Its size and interconnectedness, and the fact that financial markets
    were already under serious distress, created the fear that AIG’s failure would
    lead to the collapse of the entire financial system. The federal government was
    unwilling to take this risk and, therefore, bailed out AIG with a rescue package
    of over $182.5 billion.'
