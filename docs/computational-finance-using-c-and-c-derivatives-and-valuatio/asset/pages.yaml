    pooling and tranching. If many loans were pooled into one security, a few defaults
    would have minimal impact. Structured finance could also be sliced and sold in
    portions – known as tranches – which lets buyers customised their payments. Risk-averse
    investors would buy tranches that pay off first in the event of default, but had
    lower yields. Return-oriented investors sought risk with higher yields. Bankers
    often compared it to a waterfall; the holders of the senior tranches – at the
    top of the waterfall – were paid before the junior tranches. If payments came
    below expectations, those at the bottom would be the first to be left and dry.
    Securitisation was designed to benefit lenders, investment banks and investors.
    Investment banks earned fees for issuing mortgage-backed securities. These securities
    fetched a higher price than if the underlying loans were sold individually, because
    the securities were customised to investors’ needs, were more diversified, and
    could be easily traded. Purchasers of the safer tranches got a higher rate of
    return than ultrasafe Treasury notes without much extra risk – at least in theory.
