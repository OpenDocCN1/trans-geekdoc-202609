- pgno: 210
  md: '# 7.2.2 Interest Swap


    Interest swaps (IRS''s) are very common financial instruments - it is unusual
    for 80% of the trades in a portfolio to be IRS. Here, we will provide a description
    of some of the characteristics of IRS''s, more detail can be found in Hull (2003).


    A vanilla IRS consists of a strip of FRA trades, each FRA starting when the previous
    FRA finishes. The maturity date of the IRS thus corresponds to the maturity date
    of the FRA.


    Let the times of the FRAs be $t_{i,i} = 0, \dots, n-1$, and the maturity times
    of the FRAs be $t_{i}i = 1, \dots, n$; note that the FRA start time corresponds
    to the forward rate reset times, and the maturity times correspond to the FRA
    payment times. We will now adopt the (common) convention of calling the FRA trades
    swaplets, so an IRS is made up of number of swaplets.


    When the counterparty pays the fixed rate and receives the floating rate, (from
    A perspective) is termed a payer IRS. Alternatively, if A receives the fixed rate
    and pays the floating rate, then is termed a receiver IRS.


    The value of an IRS at $t$, $t_{k-1} < t < t_{k}$, will now be considered. We
    will assume that discount factors used to count the forward rates and those to
    discount the coupon payments are associated with the same yield curve. Using (7.2.10),
    we have


    ```

    $IRS(t) = C DF(t,t_{k}) + \sum_{i=k+1}^{n} DF(t,t_{i}) \tau_{i} \{K - F(t,t_{i-1},t_{i-1}
    + \tau_{i})\}; \quad (7.2.11)

    ```


    where C is the next coupon payment after current time $t$ (this occurs at $t_{k}$)
    and $\tau_{i}$ is the tenor of the $i^{th}$ swaplet which starts at time $t_{i-1}$
    and ends at time $t_{i}$.


    Note that the next coupon payment for the swaplet starting at time $t_{k-1}$ and
    maturing at $t_{k}$ is already known with certainty at $t$ because the forward
    rate $F(t,t_{k-1},t_{k})$ was reset in the past, $t_{k-1} < t$


    We will now write (7.2.11)


    ```

    $IRS(t) = C DF(t_{k}) + FXD(t) - FLT(t), \quad (7.2.12)

    ```


    where $FXD(t)$, the time value of the fixed leg,


    ```

    $FXD(t) = P K \sum_{i=k+1}^{n} DF(t,t_{i}) \tau_{i} \quad (7.2.13)

    ```


    and $FLT(t)$, the time value of the floating leg,


    ```

    $FLT(t) = P \sum_{i=k+1}^{n} DF(t,t_{i}) \tau_{i} F(t,t_{i-1},t_{i-1} + \tau_{i}).,
    \quad (7.2.14)

    ```


    # The Floating Leg


    We will now evaluate equation(7.2.14). The floating leg coupon payment at $t_{i}$
    will be denoted by $C_{i}$ and has value


    $C_{i} = P F(t,t_{i-1},t_{i-1} + \tau_{i}) \tau_{i},'
