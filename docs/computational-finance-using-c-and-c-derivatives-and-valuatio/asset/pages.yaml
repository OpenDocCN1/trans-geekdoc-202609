    # 5.3.3 Binomial Lattice with a Control Variate


    The control variate technique can be used to enhance the accuracy that a standard
    binomial lattice gives for the value of an American vanilla option. It involves
    using the same binomial lattice to value of both an American option and also the
    European option. The Black–Scholes formula is then used to compute the accurate
    value of the European option. If we assume that the error in pricing the European
    option is the same as that for the American


