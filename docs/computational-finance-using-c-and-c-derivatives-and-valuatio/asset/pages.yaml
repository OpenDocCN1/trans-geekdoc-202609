    In this section, we use the approach of Kamrad and Reiche (1991), and Boyle Evine
    and Gibbs (1989), which we will call the BEKGR method, for price-asset options.
    We first derive expressions for the jump size and jump probabilities for a single
    asset and show that these are equivalent to those of the CRR binomial lattice
    discussed in Chapter 5. We will then give expressions for the jump sizes and jump
    probabilities of a general multi-asset option.


    To derive the BEKGR equations for one asset, we first assume that the asset follows
    a lognormal process with drift $\mu=r-\sigma^2/2$, where $r$ is the riskless interest
    rate and $\sigma$ is the instantaneous volatility.


    Therefore, if $S_t$ is the price of the asset at time $t$, and $S_{t+\Delta t}$
    is the price at time instant $t+\Delta t$, we have the following:


    ```

    log(S_{t+\Delta t}) = log(S_t) + \epsilon_t, \quad \epsilon_t \sim N(\mu\Delta
    t, \sigma^2\Delta t),

    ```


    or equivalently


    ```

    log(\frac{S_{t+\Delta t}}{S_t}) \sim N(\mu\Delta t, \sigma^2\Delta t),

    ```


    where $\epsilon_t$ represents a random variable and as $N(\mu\Delta t, \sigma^2\Delta
    t)$ denotes a Gaussian with mean $\mu\Delta t$ and variance $\sigma^2\Delta t$.

    We will now consider the situation when $\epsilon_t$ either jumps up or down by
    an amount $\nu = \sigma\sqrt{\Delta t}$. For an up-jump,


    ```

    log(\frac{S_{t+\Delta t}}{S_t}) = \sigma\sqrt{\Delta t},

    ```


    and therefore, $S_{t+\Delta t} = S_t\exp(\sigma\sqrt{\Delta t})$.

    For a down-jump, we have


    ```

    log(\frac{S_{t+\Delta t}}{S_t}) = -\sigma\sqrt{\Delta t},

    ```


    and therefore, $S_{t+\Delta t} = S_t\exp(-\sigma\sqrt{\Delta t})$.

    The reader will notice that these expressions are the same as for the CRR lattice
    of Chapter 5. That is for an up-jump, $S_{t+\Delta t} = S_tu$, and for a down-jump,
    $S_{t+\Delta t} = S_td$ and $u = 1/d = \exp(\sigma\sqrt{\Delta t})$.

    The probability undergoing either an up- or down-jump occurring by finding the
    mean and variance of $\epsilon_t$.


    From the mean,


    ```

    E[\epsilon_t] = v(p_u - p_d) = \mu\Delta t,

    ```


    and from the variance,


    ```

    Var[\epsilon_t] = v^2(p_u + p_d) = \sigma^2\Delta t.

    ```'
