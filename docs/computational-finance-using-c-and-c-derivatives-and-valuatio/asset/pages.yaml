    $\Gamma_p = \Gamma_c = \frac{n(d_1)}{Sc\sqrt{T-t}} \exp(-q(T-t)).\quad (A.2.2)$

    ```


    So value of gamma for both a put and a call is the same.


    # A.3 DELTA


    Delta is defined as the rate of change of option value with the underlying price.

    For a European call, we have


    ```

    $\Delta_c = \frac{\partial c}{\partial S} = \frac{\partial}{\partial S}\{S\exp(-q(T-t))N_1(d_1)
    - E\exp(-r(T-t))N_1(d_2)\}$.$

    ```


    So


    ```

    $\Delta_c = \exp(-q(T-t)) \left\N_1(d_1) + Sn(d_1)\frac{\partial d_1}{\partial
    S}\right\ - E\exp(-r(T-t))n(d_2)\frac{\partial d_2}{\partial S}.\quad (A.3.1)$

    ```


    Substituting for $n(d_2)$ and $d_2/\partial S$, we obtain


    ```

    $\Delta_c = \exp(-q(T-t))N_1(d_1).\quad (A.3.2)$

    ```


    In similar manner, we have for a European put


    ```

    $\Delta_p = \frac{\partial p}{\partial S} = \frac{\partial}{\partial S}\{S\exp(-r(T-t))(1-N_1(d_1))
    - S\exp(-q(T-t))(1-N_1(d_1))\\}$.$

    ```


    So


    ```

    $\Delta_p = -E\exp(-r(T-t))n(d_2)\frac{\partial d_2}{\partial S} - \exp(-q(T-t))\left\{1-N_1(d_1)
    + Sn(d_1)\right\}\frac{\partial d_1}{\partial S}.\quad (A.3.3)$

    ```


    Substituting for $n(d_2)$ and $d_2/\partial S$, we obtain


    ```

    $\Delta_p = \exp(-q(T-t)) \N_1(d_1) - 1\.\quad (A.3.4)$

    ```


    # A.4 THETA


    Theta is defined as the rate of change of option value with time.

    For a European call option, we have


    ```

    $\Theta_c = \frac{\partial c}{\partial t} = \frac{\partial}{\partial t}\{S\exp(-q(T-t))N_1(d_1)
    - E\exp(-r(T-t))N_1(d_2)\}$.$

    ```


    ```

    = q\exp(-q(T-t))SN_1(d_1) + \exp(-q(T-t))Sn(d_1)\frac{\partial d_1}{\partial t}$

    ```


    ```

    - E\exp(-r(T-t))N_1(d_2) - E\exp(-r(T-t))n(d_2)\frac{\partial d_2}{\partial t};.$

    ```'
