    # Assign the Asset Values to the Lattice Nodes


    We will show that the number of different asset prices, $LS_n$, for an $n$ step
    recombining lattice is $2n+1$.


    The nodes in a recombining lattice can be considered as composed of two kinds:
    those corresponding to an *even time step* and those corresponding to an *odd
    time step*.


    This is the set of node asset values, $ET$, for an even time step is distinct
    from the set of node asset values, $OT$, for an odd time step. Although $ET \cap
    OT = \emptyset$, the elements of $ET$ and $OT$ for any consecutive pair of time
    steps are related by the simple constant multiplicative factor $d$. Also for an
    even time step there is a central node corresponding to the asset price $S_0$,
    and the remaining nodes are symmetrically arranged around this, see Code excerpt
    5.6. These features are illustrated in Fig. 5.1, for a standard lattice with six
    time steps.


    The number of distinct asset prices in a lattice is therefore the sum of nodes
    in the last two time steps. Since the number of nodes in the $ith$ time step,
    $S_i$, is $i+1$ (see Fig. 5.1), for an $n$ time step, we have


    $S_n = n+1$ and $S_{n-1} = n$.


    This means that the number of different asset values in an $n$ time step lattice
    is


    $LS_n = S_n + S_{n-1} = 2n$.


    The number of nodes in an $n$ time step lattice, is


    $LN_n = \sum_{i=0}^{n}(i+1) = \frac{(n+1)(n+2)}{2}$


    where we have used the fact that $LN_n$ is the sum of an arithmetic progression
    with first term 1, increment 1, and last term $n+1$.


    One might think that, in order to price options, it is necessary to store the
    asset value of each lattice node, which would entail storing $LN_n$ values.'
