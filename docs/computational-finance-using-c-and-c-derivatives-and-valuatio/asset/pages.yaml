    & a_{4,3} & a_{4,4} \end{pmatrix} = \begin{pmatrix} 1 & 0 & 0 & 0 \ l_{2,1} &
    1 & 0 & 0 \ l_{3,1} & l_{3,2} & 1 & 0 \ l_{4,1} & l_{4,2} & l_{4,3} & 1 \end{pmatrix}
    \begin{pmatrix} u_{1,1} & u_{1,2} & u_{1,3} & u_{1,4} \ 0 & u_{2,2} & u_{2,3}
    & u_{2,4} \ 0 & 0 & u_{3,3} & u_{3,4} \ 0 & 0 & 0 & u_{4,4} \end{pmatrix} \quad
    \(5.4.30)$

    ```'
