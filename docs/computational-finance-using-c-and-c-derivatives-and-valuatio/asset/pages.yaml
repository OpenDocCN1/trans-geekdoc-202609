  md: '# Vanilla Options and the Black-Scholes Model Section | 4.4 69


    which gives the usual form of the Black-Scholes formula for a European call as


    ```

    $c(S,E,\tau) = SN_1(d_1) - E \exp(-r\tau)N_1(d_2), \quad (4.4.47)$

    ```


    where


    ```

    $d_1 = \frac{\log(S/E) + (r + \sigma^2/2)\tau}{\sigma\sqrt{\tau}} \text{ and }
    d_2 = \frac{\log(S/E) + (r - \sigma^2/2)\tau}{\sigma\sqrt{\tau}} = d_1 - \sigma\sqrt{\tau}.
    \quad (4.4.48)$

    ```


    To gain some insight into the above equation, we would rewrite it in the following
    form:


    ```

    $c(S,E,\tau) = \exp(-r\tau) {SN_1(d_1)\exp(r\tau) - EN_1(d_2)\}. \quad (4.4.49)$

    ```


    The term $N_1(d_2)$ is the probability that the option will be exercised in a
    risk-neutral world, where $EN_1(d_2)$ is the strike price multiplied by the probability
    that the strike price will be paid. The term $SN_1(d_1)\exp(r\tau)$ is the expected
    value of a variable, in a risk-neutral world, that equals $S_T$ if $S_T > E$ and
    is otherwise zero.


    The corresponding formula for a put can be derived using put parity, see Section
    4.3, to


    ```

    $p(S,E,\tau) = E\exp(-r\tau)N_1(-d_2) - SN_1(-d_1). \quad (4.4.50)$

    ```


    or equivalently $N_1(-x) = 1 - N_1(x)$ we


    ```

    $p(S,E,\tau) = E\exp(-r\tau) \{1 - N_1(d_2)\} - S\1 - N_1(d_1)\}. \quad (4.4.51)$

    ```


    # The Inclusion of Continuous Dividends


    The effect of dividends on a European option can be dealt with by assuming that
    the asset price is the sum of a risky component and known dividends that will
    be paid during the life of the option and a risky (stochastic) component, see
    Hull (2003).


    As continuous dividends $q$ are paid, the stock price is reduced by the same amount,
    and by the time the European option matures, all dividends will have been paid
    leaving only the risky component of the asset price.


    From equation (4.4.26), we thus have


    ```

    $dS = \mu Sdt - Sqdt + \sigma dW^P, dB = rBdt, \quad (4.4.52)$

    ```


    where under probability measure $\mathbb{P}$, we know that $dW^P \sim N(0,dt)$.
    As before (Girsanov''s theorem), we know probability measure $\mathbb{Q}$ over
    that


    ```

    $dW^P = dW^Q - (\frac{\mu - r}{\sigma})dt,$

    ```


    and under this measure, the process for $S$ is


    ```

    $dS = \mu Sdt - Sqdt - ({\frac{\mu - r}{\sigma})dt + \sigma dW^Q,$ where $dW^Q
    \sim N(0,dt),$

    ```'
