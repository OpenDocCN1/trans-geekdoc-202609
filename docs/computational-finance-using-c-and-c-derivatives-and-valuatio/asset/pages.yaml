    $$\tilde{b}_j = 1 - \theta_r \Delta t - \theta_{m \Delta t} \left\\frac{\\{b(\\Delta
    Z_j^*)^2 - (\Delta Z_j^*)^2}{D} + \frac{\sigma^2{\Delta Z_j^* + \Delta Z_j^*\}}{D}\right\\}
    \quad (5.4.63)$

    ```


    ```

    $$\tilde{c}_j = \theta_{m \Delta t} \left( \frac{b(\\Delta Z_j^*)^2}{D} - \frac{\sigma^2
    \Delta Z_j^*}{D} \right) \quad (5.4.64)$

    ```


    The incorporation of boundary conditions and the solution of equation (5.4.58)
    is similar manner to that already discussed in Section 5.4.2. If further details
    are required, Code excerpt 5.19, which uses a nonuniform grid to solve the log
    transformed Black-Scholes equation, can be consulted. When a uniform grid is used,
    $\Delta Z_j^* = \Delta Z = \Delta Z$, and therefore,


    ```

    $D = (\Delta Z_j^*)^2 \Delta Z + (\Delta Z_j^*)^2 \Delta Z^2 = 2(\Delta Z)^3,$

    ```


    ```

    $$\frac{(\Delta Z_j^*)^2}{D} = \frac{(\Delta Z)^2}{D} = \frac{1}{2(\Delta Z)^3}$

    ```


    ```

    $$\frac{\Delta Z_j^*}{D} = \frac{\Delta Z}{D} = \frac{1}{2\Delta Z^2} \text{ and
    } \frac{(\Delta Z_j^*)^2 - (\Delta Z)^2}{D} = 0.$

    ```


    In these circumstances,


    ```

    $$\a_j = \frac{(1 - \theta_{m \Delta t})}{\Delta Z^2} \left\{b\Delta Z - \sigma^2\right\}$

    ```


    ```

    $$\bar{b}_j = 1 + \Delta t(1 - \theta_{m \Delta t}) \left\{r - \frac{\sigma^2}{\Delta
    Z^2}}\right\}$

    ```


    ```

    $$\c_j = (1 - \theta_{m \Delta t})\Delta t \left\{\frac{-b}{2\Delta Z} - \frac{\sigma^2}{2\Delta
    Z^2}}\right\}$

    ```


    ```

    $$\tilde{a}_j = \frac{\theta_{m \Delta t}}{\Delta Z^2} \left\{b\Delta Z - \sigma^2}\right\}$

    ```


    ```

    $$\bar{b}_j = 1 - \theta_{m \Delta t} \left\{r + \frac{\sigma^2}{\Delta Z^2}}\right\{\}$

    ```


    ```

    $$\tilde{c}_j = \frac{\theta_{m \Delta t}}{\Delta Z^2} \left\{b\Delta Z + \sigma^2}\right\}$

    ```


    which are the same as equations (5.4.50)-(5.4.55) in Section 5.4.4.


