  md: "# # Appendix I\n\n# ## Feynman–Kac Formula\n\n# ### 1.1 SOME RESULTS\n\nThe\
    \ Feynman–Kac formula provides a link between stochastic processes and partial\
    \ differential equations, which we will now illustrate.\n\nIn the risk-neutral\
    \ measure, the equation followed by the asset price is\n\n```\n$$dS = rSdt + \\\
    sigma dW \\quad (I.1.1)$\n```\n\nand that of the money account\n\n```\n$$dB =\
    \ Brdt. \\quad (I.1.2)$\n```\n\nIf $(S,t)$ is the value of a derivative, then\
    \ using Ito’s lemma we have\n\n```\n$$df = \\left[ \\frac{\\partial f}{\\partial\
    \ t} + rS\\frac{\\partial f}{\\partial S} + \\frac{\\sigma^2 S^2}{2}\\frac{\\\
    partial^2 f}{\\partial S^2} \\right]dt + \\frac{\\partial f}{\\partial S}\\sigma\
    \ dW. \\quad (I.1.3)$\n```\n\nSince $f$ is a tradable, we know that the process\
    \ $(f/B)$ must be a martingale in the risk-neutral measure and therefore have\
    \ zero drift.\n\nWe will evaluate $d(f/B)$ using the quotient rule (see equation\
    \ (2.6.4))\n\n```\n$$d\\left(\\\\frac{X_1}{X_2}\\right) = \\left(\\\\frac{dX_1}{X_2}\
    \ - \\frac{X_1 dX_2}{X_2^2}\\right) + E\\left[\\frac{dX_1}{X_1}\\frac{dX_2}{X_2}\\\
    right] - E\\left[\\frac{dX_2}{X_2}\\frac{dX_1}{X_1}\\right] \\quad (I.1.4)$\n\
    ```\n\nand rewrite equation (I.1.2) and (I.1.3) as\n\n```\n$$dX_1 = \\mu_1 dt\
    \ + \\sigma_1 dW,$$ \\ndX_2 = \\mu_2 dt$$\n```\n\nwhere\n\n```\n$$d\\left(\\frac{X_1}{X_2}\\\
    right) = d\\left(\\frac{f}{B}\\right), \\quad \\tilde{\\mu}_1 = \\left[\\frac{\\\
    partial f}{\\partial t} + rS\\frac{\\partial f}{\\partial S} + \\frac{\\sigma^2\
    \ S^2}{2}\\frac{\\partial^2 f}{\\partial S^2}\\right],,$$ \\n\\tilde{\\sigma}_1\
    \ = \\sigma\\frac{\\partial f}{\\partial S}, \\tilde{\\sigma}_2 = r, X_1 = f,\
    \ X_2 = B, \\tilde{\\mu}_2 = r.$\n```\n\nEvaluating equation (I.1.4), we obtain\n\
    \n```\n$$E\\left[\\left(\\\\frac{dX_1}{X_2}\\right)\\left(\\\\frac{dX_2}{X_2}\\\
    right)\\right] = E\\left[\\tilde{\\mu}_2^2 dt^2\\right] \\to 0,$$\n```\n\n```\n\
    $$E\\left[\\left(\\\\frac{dX_1}{X_1}\\right)\\left(\\\\frac{dX_2}{X_2}\\right)\\\
    right] = E\\left[\\left(\\\\frac{\tilde{\\mu}_1 dt + \\sigma_1 dW}{X_1}\\right)\\\
    left(\\\\frac{\tilde{\\mu}_2 dt}{X_2}\\right)\\right] \\to 0,$\n```"
