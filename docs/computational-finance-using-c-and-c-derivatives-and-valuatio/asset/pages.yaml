    n_{s-3}, \quad (5.4.26)$

    ```


    where as the right-hand side, $R_{i+1,j}$, is


    ```

    $R_{i+1,j} = \tilde{a}_j f_{i,j-1} + b_j f_{i,j} + \tilde{c}_j f_{i+1,j+1}. \quad
    (5.4.27)$

