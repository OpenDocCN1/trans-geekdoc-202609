    \ of $C_r$, and $V$ is the corresponding matrix of eigenvectors. since the $i$th\
    \ eigenvalue satisfies $\\lambda_i = \\sigma_i^2$, it can be seen that all the\
    \ eigenvalues are positive, and thus, $C_r$ must be positive definite.\n\nIf $C_r$\
    \ is positive definite, then we can perform the Cholesky decomposition $C_r =\
    \ LL^T$ where $L$ is a lower triangular matrix.\n\n# 3.4.2 Repairing Correlation\
