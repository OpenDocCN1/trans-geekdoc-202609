  md: "# Vanilla Options and the Black–Scholes Model Section | 4.4 75\n\nthe volatility\
    \ is computed as the standard deviation of the $n$ continuously compounded returns,\
    \ $u_i, i = 1, \\dots, n$, where\n\n$S_i = S_{i-1} \\exp(u_i)$\n\n$u_i = \\log\
    \ \\left(\\frac{S_i}{S_{i-1}}\\right)$.\n\nWe already know (see equation (2.1.10))\
    \ that the expected standard deviation of the asset returns over the time interval\
    \ is $\\sigma \\sqrt{dt}$. This means that we obtain the following expression\
    \ for $\\hat{\\sigma}$, the estimated volatility:\n\n$$\\hat{\\sigma} \\sqrt{dt}\
    \ = \\sqrt{\\frac{1}{n} \\sum_{i=1}^n (u_i - \\hat{u})^2} \\quad (4.4.68)$\n\n\
    $$\\hat{\\sigma} = \\sqrt{\\frac{1}{(n-1) d\\tau} \\sum_{i=1}^n (u_i - \\hat{u})^2}\
    \ \\quad (4.4.69)$\n\nIt is accepted practice to express all time in years, and\
    \ so the volatility is the *annualized* standard deviation of the returns. There\
    \ is also the issue of account for non-trading days such as weekend and holidays.\
    \ For example, let us say that the history of assets prices $S_i, i=0,\\dots,n$\
    \ was obtained by recording the price on each *trading* day. One approach is to\
    \ use $d\\tau = 1/N_{td}$, where $N_{td}$ is the number of trading days in a year.\
    \ If we take $N_{td} = 250$, then equation (4.4.69) becomes\n\n$$\\hat{\\sigma}\
    \ = \\sqrt{\\frac{250}{(n-1)} \\sum_{i=1}^n (u_i - \\hat{u})^2} \\quad (4.4.70)$\n\
    \nThe estimated error in $\\hat{\\sigma}$ is, for example, Hull (2003), given\
    \ by\n\n$$\\hat{\\sigma}_{std} = \\sqrt{\\frac{1}{2(n-1)}} \\quad (4.4.71)$\n\n\
    A computer program to perform these calculations is given below in Code 4.2.\n\
    \n```\nvoid hist_double(double sigma, double err, double data[], long n, double\
    \ dt, long *iflag)\n  /* Input parameters:\n  data[]    // the data, consists\
    \ of n asset prices\n  n         // the number of data points\n  dt        //\
    \ the construct spacing between the data points (in years)\n  Output parameters:\n\
    \  sigma     // the computed historical volatility\n  err       // the standard\
    \ error in the volatility estimate sigma\n  iflag     // an error indicator\n\
    \  */n#define DATA(I)(data[I])\n```\n\nCode 2.2 Function to compute the historical\
    \ volatility from asset data."
