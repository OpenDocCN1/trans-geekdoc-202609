  md: '# Chapter 4


    # European Options


    # 4.1 INTRODUCTION


    A European option taken out at current time t gives the owner the right (but not
    the obligation) to do something when the option matures at time T. This could,
    for example, be the right to buy or sell stocks at a particular strike price.
    The option would of course only be exercised if it was in the owner''s interest
    to do so. For example, a single asset European vanilla put option, with strike
    price E and expiry time T, gives the owner the right at time T to sell a particular
    asset for E. If the asset is worth ST at maturity, then the value of the put option
    at maturity known as the payoff. By contrast, a single asset European vanilla
    call option, with strike price E and expiry time T, gives the owner the right
    at time T to buy an asset for E; the payoff for a call is max(ST-E).


    The owner of an American option has the right (but not the obligation) to exercise
    the option at any time from current time t to maturity. These options are more
    difficult to value than European options because of this extra flexibility. Even
    the single asset vanilla put has no analytic solution and requires finite-difference
    and lattice methods to estimate its value. Many European options on the other
    hand take the form of a relatively easy integral from which it is possible to
    compute a closed solution. The valuation of multi-asset European options, dependent
    on a large number of underlying assets, is more complicated but can conveniently
    achieved by using Monte Carlo simulation to compute the required multidimensional
    integral.


    The expected value of a single asset European vanilla option will depend on the
    current asset price at time t, S, the duration of the option, τ = T - t, the strike
    price, E, the riskless interest rate, r, and the probability density function
    of the underlying asset at maturity, p(ST).


