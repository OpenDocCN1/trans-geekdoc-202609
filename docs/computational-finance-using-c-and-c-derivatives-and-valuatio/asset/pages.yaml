    # 3.3 GENERATION OF MULTIVARIATE DISTRIBUTIONS:

    INDEPENDENT VARIABLES


    In this section, we show how to generate multivariate distributions which contain
    independent variates, that is, the variates have zero correlation.


    # 3.3.1 Normal Distribution


    The most fundamental distribution is the univariate standard normal distribution,

    (0,1), with zero mean and unit variance. In the case of p independent variates,

    this takes the form of a independent normal distribution N(0,Ip) with

    zero mean and p x p covariance matrix Ip.


    First, we will quote a result concerning multivariate probability density

    functions, see Press et al. (1992). If x1,x2,..., are random variates with a joint

    probability density function p(x1,x2,...), and if there are an equal number of
    y

    variates y1,y2,..., that are functions of the x''s, then the joint probability
    density

    function of the variates, p(y1,y2,...), is given by the following expression:


    ```

    p(y1,y2,...)dy1dy2... = p(x1,x2,...)Jxy dy1dy2. (3.3.1)

    ```


    where Jxy is the Jacobian determinant of the x''s with respect to the y''s.

    An application of this result is the Box Muller transformation, where

    Box and Muller (1958), in which a p variate independent normal distribution

    N(0,Ip) is generated from p variate uniform distribution U(0,1).

    The method works as follows.


    Consider two independently distributed N(0,1) variables x and y, and use

    the polar transformation to obtain


    ```

    x = r cos theta, y = r sin theta, and r^2 = x^2 + y^2. (3.3.2)

    ```


    From equation (3.3.1), the joint probability density functions f(r,theta) and
    f(x,y)

    ey obey the equation


    ```

    f(r,theta) dr theta = f(x,y)Jxy dr theta,

    ```


    where the Jacobian is


    ```

    Jxy,ro = cos theta sin theta / -r sin theta r cos theta = r.

    ```


    We therefore have


    ```

    f(r,theta) = rf(x,y). (3.3.3)

    ```


    Furthermore, since x and y are independent N(0,1),


    where


    ```

    f(x) = e^-x^2/2 / 2pi and f(y) = e^-y^2/2 / 2pi.

    ```'
