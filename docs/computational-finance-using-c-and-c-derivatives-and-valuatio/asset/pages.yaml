    We will now find the value, at time $t_0$, of an option which gives the holder\
    \ the right to exchange asset $A$ for asset $B$ at maturity $T$. The payoff of\
    \ maturity is $H_T = \\max(S_B^B - S_A^A, 0)$.\nIf we use the value of asset $A$\
    \ as the numeraire, then from equation (4.2.1), the value of the exchange option\
    \ at time $t_0$ is\n\n```\n$V(t_0) = S_A^A E^Q \\left[ \\frac{\\max(S_B^B - S_A^A,\
