    Gamma

    The definition of $\Gamma$ is the rate of change of $\Delta$ with asset price;
    all other parameters remaining fixed. Thus,


    ```

    $\Gamma = \frac{\partial^2 f}{\partial S^2} \frac{\partial \Delta}{\partial S}$

    ```


    In order to evaluate $\Gamma$, we require at least two values of $\Delta$. The
    nearest this can be achieved to the root node $R$ is at time step2, where we have


    ```

    $\Gamma = \frac{\Delta_{UV} - \Delta_{VW}}{S^*_{UV} - S^*_{VW}}$

