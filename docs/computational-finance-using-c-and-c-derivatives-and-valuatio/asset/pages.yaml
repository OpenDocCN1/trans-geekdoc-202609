    \ currency. We use the same notation as in Section 7.3, which deals with exchange\
    \ derivatives.\n\nFor example, a standard rate cap has a payoff in domestic currency\
    \ and also depends on the currency forward rates. The value at $t_0$ of a cap\
    \ which pays at $t_k$ and from $t_{k-1}$ to time $t_k$ is\n\n```\n$Caplet(t_0)\
    \ = P D F(t_0, t_k) E^{Q^k} [\\max (F_k^D - K)], \\quad (7.2.74)$\n```\n\nwhere\
