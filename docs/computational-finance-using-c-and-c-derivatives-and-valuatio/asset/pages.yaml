  md: "# 346 APPENDIX | H Brownian Motion: More Results\n\n```\n$$\\times \\exp\\\
    left(\\frac{(\\hat{X}_{t_1} + \\hat{X}_{t_2} - 2b + v\\Delta t)}{2\\sigma^2\\\
    Delta t}\\right) \\quad (H.1.10)$\n```\n\nwhere $t_2 \\ge t_1$ and $\\Delta t\
    \ = t_2 - t_1$.\n\n# H.2 PROOF OF EQUATION (H.1.2)\n\nFrom equation (H.1.2),\n\
    \n```\n$X_t = \\sigma\\sqrt{t}Z_t, \\quad Z_t \\sim N(0,1),$\n```\n\nwhere $X_0\
    \ = 0$. We define the probability of events that $m_t^X \\le b$ and $X_t \\ge\
    \ b$ occurring. For $m_t^X$ to occur, there must be a $\tau$ such that $X\\tau\
    \ \\le b$, for $0 < \\tau \\le t$. At time $\tau$ instead of continuing with the\
    \ original Brownian motion, $X_t$ we will consider the reflected motion $X_t^R$\
    \ defined by\n\n```\n$X_s^R = X_s, \\quad s < \\tau$\\nnX_s^R = 2b - X_s, \\quad\
    \ s \\ge \\tau$.\n```\n\nTherefore, before time $\tau$, the motion $X_s$ is identical\
    \ to $X_s^R$. For $s \\ge \\tau$, the coordinates of $X_s^R$ are obtained by reflection\
    \ of $X_s$ about the level $b$. The event $X_t \\ge x$ is equivalent to the event\
    \ $X_t^R \\le 2b-x$ (remember $b \\le 0$ and $x \\ge 0$). However, the event $X_t^R\
    \ \\le 2b-x$ only occurs if $m_t^X \\le b$ also occurs,\n\n```\n$P(X_t^R \\le\
    \ 2b-x) = P(m_t^X \\le b, X_t \\le x)$.\n```\n\nAt time $\tau$, we have\n\n```\n\
    $X_{t+\tau}^R = 2b - X_\tau, \\quad (H.2.1)$\n```\n\nand after time $\tau$,\n\n\
    ```\n$X_{\tau+y}^R = 2b - X_{\tau+y}, \\quad y > 0. \\quad (H.2.2)$\n```\n\nThus,\
    \ subtracting equation (H.2.1) from equation (H.2.2) gives\n\n```\n$X_{\tau+y}^R\
    \ - X_\tau^R = X_\tau - X_{\tau+y},\\nX_{\tau+y}^R - X_\tau^R = -(X_{\tau+y} -\
    \ X_\tau). \\quad (H.2.3)$\n```\n\nHowever, we know that\n\n```\n$(X_{\tau+y}\
    \ - X_\tau^R) \\sim N(0, \\sigma^2 \\gamma). \\quad (H.2.4)$\n```\n\nSo\n\n```\n\
    $(X_{\tau+y} - X_\tau^R) \\sim -N(0, \\sigma^2 \\gamma),\n```\n\nwhich means that\n\
    \n```\n$(X_{\tau+y}^R - X_\tau^R) \\sim N(0, \\sigma^2 \\gamma). \\quad (H.2.5)$\n\
    ```\n\nSince the left-hand sides of equation (H.2.4) and equation (H.2.5) have\
    \ the same distribution, and $\tau$ satisfies the three Brownian properties in\
    \ Section 2.1, we write\n\n```\n$P(X_t^R \\le 2b-x) = P(X_t \\le 2b-x)\\n= N_1\
    \ \\left(\\frac{2b-x}{\\sigma\\sqrt{t}}\\right).\n```"
