  md: "# Grid Methods for Vanilla Options Section | 5.4 159\n\nThe problem we will\
    \ consider is the European double knockout call option with strike $E$ and expiry\
    \ date $T$. This is a barrier option with an upper barrier at $B_U$ and a lower\
    \ barrier at $B_L$; during the life of the option, the asset price either goes\
    \ above the upper barrier or below the lower barrier, then the option becomes\
    \ worthless. If, on the other hand, the asset price stays between the barriers,\
    \ then the option has value max$(S_T - E)$, where $S_T$ is the asset price at\
    \ time $T$.\n\nThis problem has been previously investigated by Boyle and Tian\
    \ (1998), henceforth referred to as BT, which used explicit finite-difference\
