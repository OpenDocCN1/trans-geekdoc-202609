    \ (5.4.14) we will briefly consider its characteristics for different values of\
    \ the weight parameter $\\Theta_m$. When $\\Theta_m = 1$, the values of the coefficients\
    \ in equation (5.4.14) are $a_j = c_j$ and $b_j = 1$. This means that equation\
    \ (5.4.14) reduces to\n\n```\n$f_{i,j} = a_j f_{i+1,j-1} + b_j f_{i+1,j} + c_j\
    \ f_{i+1,j+1}$.\n```\n\nThis is termed the *explicit method*, and it can be seen\
    \ that the unknown value $f_{i,j}$ at the node $(i,j)$ is just a weighted sum\
    \ of the (known) option values $f_{i+1,j-1}, f_{i+1,j}$, and $f_{i+1,j+1}$. This\
    \ is the simplest situation to deal with and actually corresponds to a trinomial\
    \ lattice; however it has numerical properties and requires a very small step\
    \ size to obtain accurate results, see Smith (1985).\n\nWhen $\\Theta_m \neq 1$,\
    \ the unknown value $f_{i,j}$ depends not only on the known option values $f_{i+1,j-1},\
    \ f_{i+1,j}$, and $f_{i+1,j+1}$ (as in the explicit method above) but on the neighbouring\
    \ unknown values $f_{i,j-1}$ and $f_{i,j+1}$. It is now necessary to solve a set\
    \ of simultaneous equations to compute the value $f_{i,j}$. This is therefore\
    \ called an *implicit method*, see see Smith (1985).\n\nThe implicit method $\\\
    Theta_m = 0$ is also the fully implicit method, since the now value $f_{i,j}$\
    \ only depends on the neighbouring values $f_{i,j-1}, f_{i,j+1}$, and previous\
    \ value $f_{i,j}$. This can be shown by substituting $\\Theta_m = 0$ in equation\
    \ (5.4.16) to (5.4.21). We then have $\tilde{a}_j = \tilde{c}_j$ and $\tilde{b}_j\
    \ = 1$, which means that equation (5.4.14) reduces to\n\n```\n$a_j f_{i,j-1} +\
    \ b_j f_{i,j} + c_j f_{i,j+1} = f_{i+1,j}$.\n```\n\nThe implicit method $\\Theta_m\
    \ = 0.5$ is also the Crank-Nicolson method, first method by John Crank and Phyllis\
    \ Nicholson in 1946 (see Crank and Nicolson (1947)), computes $f_{i,j}$ by giving\
    \ equal weight to the contributions from time step $i+1$ and time step $i$. Substituting\
    \ $\\Theta_m = 0.5$ in equation (5.4.16) to obtain the Crank-Nicolson coefficients:\n\
    \n```\n$a_j - \tilde{a}_j = \\frac{\\Delta t}{4} \\{ (r-q)j - \\sigma^2 j \\}$,n$\t\
    ilde{b}_j = 1 + \\frac{\\Delta t}{2} \\{ r + \\sigma^2 j \\}$,n$\tilde{c}_j =\
    \ 1 - \\frac{\\Delta t}{4} \\{ r + \\sigma^2 j \\}$,\n```"
