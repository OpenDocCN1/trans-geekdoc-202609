    solved using LU decomposition, de, we factorize the $n \times n$ matrix $A$ as


    ```

    $A = LU,$

    ```


    where $L$ is an $n \times n$ lower triangular matrix with 1s on the diagonal and
    $U$ is an $n \times p$ upper triangular matrix. The LU decomposition for a $4
