    Therefore,


    $f(r, \theta) = rf(x)f(y) = r\frac{e^{-x^2/2} e^{-y^2/2}}{\sqrt{2}\pi}$$


    which gives


    $f(\theta) = \frac{r}{2\pi}e^{-(x^2+y^2)/2} = \frac{1}{2\pi}e^{-r^2/2} = f(\theta)f(r),
    \quad (3.3.4)


    where $f(\theta) = \frac{1}{2\pi}f(r) = e^{-r^2/2}$ are independent probability
    density functions. The corresponding cumulative distribution functions $F(\theta)$
    and $F(r)$ can be found by evaluating the following integrals:


    $F(\theta) = \frac{1}{2\pi}\int_{0}^{\theta} d\theta = \frac{\theta}{2\pi}$$


    and


    $F(r) = \int_{0}^{r} e^{-t^2/2}dt = \left[ -e^{-t^2/2} \right]_{0}^{r} = 1 - e^{-r^2/2}$.


    We now use the result, for example, Evans et al. (2000), that any $x$ with a probability
    density function $f(x)$ has a cumulative distribution $F(x) = \int_{-\infty}^{x}
    f(x)dx$, which is $F(x) \sim U(0,1)$, where $U(0,1)$ is the uniform distribution
    between 0 and 1.


    The variables $V_1 = F(r) = 1 - e^{-r^2/2}$ and $V_2'' = F(\theta) = \frac{\theta}{2\pi}$
    are uniformly distributed on the interval (0,1).


    For convenience, we will define the $U(0,1)$ variables


    $V_1 = e^{-r^2/2} \quad V_2 = \frac{\theta}{2\pi}$.


    So we have


    $$\log V_1 = -r^2/2, \quad r = (-2\log V_1)^{1/2}, \quad \text{and} \quad \theta
    = 2\pi V_2$.


    Therefore,


    Substituting these results into equation (3.3.2) gives


    $x = (-2\log V_1)^{1/2} \cos 2\pi V_2, \quad y = (-2\log V_1)^{1/2} \sin 2\pi
    V_2, \quad (3.3.5)


    where $x$ and $y$ are $N(0,1)$.


    The Box Muller method is contained in equation (3.3.5), which shows that the $N(0,1)$
    variables are generated in pairs from the uniform $U(0,1)$ variables $V_1$ and
    $V_2$.


    Since the $N(0,1)$ variables are created two at a time, we need to generate a
    normal distribution with an odd number of dimensions, $n_{odd}$, it is necessary
    to generate $n_{odd} + 1$ dimensions and discard one of the dimensions.


    It is easy to modify equation (3.3.5) so that we can specify the means and variances
    of the variables $x$ and $y$; this is accomplished as follows:


    $x = \sigma_1 (-2\log V_1)^{1/2} \cos 2\pi V_2 + \mu_1, \quad y = \sigma_2 (-2\log
    V_1)^{1/2} \sin 2\pi V_2 + \mu_2, \quad (3.3.6)'
