    $Cov[Z_1, Z_2] = Cov[a+bX, c+dY]

    = E[(a+bX)(c+dY)]-E[a+bX]E[c+dY]

    = E[ac+bcX+adY+bdXY]-\{(a+bE[X])(c+dE[Y])\}\n= ac+bcE[X]+adE[Y]+bdE[XY]-ac

    = bcE[X]-adE[Y]-bdE[X]E[Y]

    = bdE[XY]-E[X]E[Y],$.

