  md: "# 76 CHAPTER | 4 European Options\n\n```\ndouble mean=0.0,sum=0.0;\ndouble\
    \ temp,tn;\nlong i;\n\nfor(i=2; i<=n; i++) {\n    mean = mean + log(DATA(i))-log(DATA(i-1));\n\
    \    mean = mean/(double)(n-1);\n}\n\nfor(i=2; i<=n; i++) {\n    temp = log(DATA(i))-log(DATA(i-1));\n\
    \    sum = sum + (temp-mean)*(temp-mean);\n}\nsum = sum/(double)(n-2);\nsigma\
    \ = sqrt(sum/sum);\ntn = sqrt(double)(n-1);\n\"err\" = sigma/sqrt(tn);\nreturn;\n\
    ```\n\nCode except 4.2 (Continued).\n\n# Implied Volatility\n\nThe implied volatility\
    \ of a European option is the volatility, when substituted into the Black-Scholes\
    \ equation yields the market value quoted for the same option. The implied volatility\
    \ will depend on both the time to expiry of the option and the ratio of the current\
    \ asset price to the strike - this is known as the volatility smile. These values\
    \ are usually stored in a multidimensional implied volatility surface, and the\
    \ volatility for pricing a given option obtained via multidimensional interpolation.\n\
    \nThe routine provided in Code except 4.3 uses Newton's method to calculate the\
    \ implied volatility for a European option from its market price. We will now\
    \ illustrate this technique for a European call option with market value opt_value.\
    \ The implied volatility, $\\sigma$, is then that value which satisfies\n\n$c(S,E,T,\\\
    sigma) - opt\\value = 0,$\n\nwhere $c(S,E,T,\\sigma)$ represents the value of\
    \ the European call and the other symbols have their usual meaning.\n\nFrom Newton's\
    \ method, we have\n\n$$\\sigma_{i+1} = \\sigma_i - \\frac{F(\\sigma_i)}{F'(\\\
    sigma_i)}$\n\nwhere\n\n$F'(\\sigma_i) = \\frac{\\partial F}{\\partial\\sigma}\\\
    frac{\\partial c(S,E,T,\\sigma)}{\\partial\\sigma} = V_c$.\n\nTherefore, the iterative\
    \ procedure\n\n$$\\sigma_{i+1} = \\sigma_i - \\frac{c(S,E,T,\\sigma)}{\\mathcal{V}_c}$\n\
    \nwhere $\\sigma_0$ is the initial estimate, and $\\sigma_{i+1}$ is the improved\
    \ estimate of the implied volatility based on the $i$-th estimate $\\sigma_i$.\
    \ Termination of this iteration occurs when $ABS(\\sigma_{i+1}-\\sigma_i) < tol$,\
    \ for a specified tolerance, tol.\n\nIt can be seen as $\\sigma \\to 0, d_1 \\\
    to \\infty, d_2 \\to \\infty$, and from equation(4.4.67), we have $\\mathcal{V}_c\
    \ \\to 0$. Under these circumstances, Newton's method fails."
  merge: -1
