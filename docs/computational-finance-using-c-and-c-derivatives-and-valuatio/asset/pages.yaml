    f}{\partial S}_{i,j}$ and $f''''_{i,j} = \frac{\partial^2 f}{\partial S^2}_{i,j}$.


    Finite-difference approximations for these derivatives can be obtained by considering
    a Taylor expansion about the point $f_{ij}$. We obtain as follows:


    $f_{i,j+1} = f_{i,j} + f''_{i,j}\Delta S + \frac{1}{2}f''''_{i,j}(\Delta S)^2$,
