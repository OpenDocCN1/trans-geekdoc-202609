  md: '# Interest Rate Derivatives Section | 7.2 209


    In Section 7.2.3, we show that F(t,t_{k-1},t_k) follows the process


    ```

    $d(F(t,t_{k-1},t_k)) = \sigma_k F(t,t_{k-1},t_k) dW^k. \quad (7.2.29)$

    ```


    If we assume $\sigma_k$ is constant, then equation (7.2.29) is GBM and (see Chapter
    2) has the solution


    ```

    $F(t,t_{k-1},t_k) = F(t_0,t_{k-1},t_k) \exp\left(\frac{(t-t_0)\sigma_k^2}{2} +
    \sigma_k W_t^k\right) \quad (7.2.30)$

    ```


    where we have taken $W_0^k = 0$.

    Substituting $t=t_{k-1}$ into equation (7.2.30) gives


    ```

    $F(t_{k-1},t_{k-1},t_k) = F(t_0,t_{k-1},t_k) \exp\left(\frac{(t_{k-1}-t_0)\sigma_k^2}{2}
    + \sigma_k W_{t_{k-1}}^k\right) \quad (7.2.31)$

    ```


    which means


    +   $E^{Q^k} [F(t_{k-1},t_{k-1},t_k)]

    $= E^{Q^k} [F(t_0,t_{k-1},t_k) \exp\left(\frac{(t_{k-1}-t_0)\sigma_k^2}{2} + \sigma_k
    W_{t_{k-1}}^k\right)]

    $= F(t_0,t_{k-1},t_k) E^{Q^k} \exp\left(\frac{(t_{k-1}-t_0)\sigma_k^2}{2} + \sigma_k
    W_{t_{k-1}}^k\right)$

    $= F(t_0,t_{k-1},t_k) E^{Q^k} \exp\left(\frac{(t_{k-1}-t_0)\sigma_k^2}{2} + \sigma_k
    \sqrt{(t_{k-1}-t_0)}N(0,1)\right)$

    $= F(t_0,t_{k-1},t_k),$


    where we used the fact (Appendix D.2) that


    ```

    $E^{Q^k} [\exp\left(\frac{(t_{k-1}-t_0)\sigma_k^2}{2} + \sigma_k \sqrt{(t_{k-1}-t_0)}N(0,1)\right)]

    $= \exp\left(\frac{(t_{k-1}-t_0)\sigma_k^2}{2} + \frac{(t_{k-1}-t_0)\sigma_k^2}{2}\right)
    = 1.$

    ```


    Substituting for $E^{Q^k} [F(t_{k-1},t_{k-1},t_k)]$ in equation (7.2.28)


    ```

    $V_{t_0} = P\tau F(t_0,t_{k-1},t_k) = DF(t_0,t_k) \frac{1}{\tau} \left(\frac{DF(t_0,t_{k-1})}{DF(t_0,t_k)}
    - 1\right) P\tau$.

    ```


    This yields


    ```

    $V_{t_0} = P \DF(t_0,t_{k-1}) - DF(t_0,t_k)\}, \quad (7.2.32)$

    ```


    which is our current method of valuing the future coupons generated by forward
    rates.'
