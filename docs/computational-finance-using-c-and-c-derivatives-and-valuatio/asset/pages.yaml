  md: '# 226 CHAPTER | 7 Other Financial Derivatives


    which means that


    ```

    $H(t,T+\Delta T) = - \frac{S(t,T+\Delta T) - S(t,T)}{\Delta T} = - \left\{ \frac{1}{S(t,T+\Delta
    T)} \right\} \quad (7.4.2)$

    ```


    As $\Delta T \rightarrow 0, H(t,T+\Delta T) \rightarrow h(t,T)$, where $h(t,T)$
    is termed the continuous hazard rate between times $t$ and $T$.


    We observe that as $\Delta T = 0$ (7.4.2) becomes


    ```

    $h(t,T) = - \left\{ \frac{\partial S(t,T)}{\partial T} \frac{1}{S(t,T)} \right\}
    \quad (7.4.3)$

    ```


    Now equation (7.4.3) can be re-expressed


    ```

    $h(t,s) = - \frac{\partial \ln(S(t,s))}{\partial s} = - \frac{\partial{\ln(S(t,s))}}{\partial
    s} \quad (7.4.4)$

    ```


    where $s > t$, and we have used


    ```

    $\frac{1}{S(t,T)} = - \frac{\partial{\ln(S(t,T))}}{\partial(t,T)}$

    ```


    Integrating equation (7.4.4) yields


    ```

    $\int_{s=t}^T h(t,s) ds = - \int_{s=t}^T d \ln(S(t,s)) \\n = - \ln(S(t,T)) - \ln(S(t,t))
    \\n = - \ln(S(t,T)). \quad (7.4.5)$

    ```


    where we have used $S(t,t) = 1$ and $\ln(S(t,t)) = 0$.


    So using equation (7.4.5), the survival probability can be expressed as


    ```

    $S(t,T) = \exp \left( - \int_{s=t}^T h(t,s) ds \right) \quad (7.4.6)$

    ```


    or


    ```

    $S(t,T) = \exp \{I(t,T)\} \quad (7.4.7)$

    ```


    where $I(t,T)$ is the cumulative hazard rate from time $t$ to time $T$. It is
    useful to approximate $I(t,T)$ as follows:


    ```

    $I(t,T) \sim \sum_{i=1}^k h(t_{i-1},t_i) (t_i - t_{i-1}), \quad (7.4.8)$

    ```


    where $t_0 = 0, t_k = T$, and the following section details on how to estimate
    $h(t_{i-1},t_i)$ from market observables.


    One way on representing the hazard rates is to use a hazard curve which is defined
    as


    ```

    $\{t_i, I(t_0,t_i)\}, i = 0, \dots, n. \quad (7.4.9)$

    ```


    If we define $t_0 = t = 0$ and $t_n = T$, then equation (7.4.9) becomes


    ```

    $\{0\}, \{t_1, I(0,t_1)\}, \{t_2, I(0,t_2)\}, \dots, \{t_n, I(0,t_n)\}, \quad
    (7.4.10)$

    ```


    where we have used the fact that $I(t_0,t_0) = I(0,0) = 0$.'
