    We can now draw all the information in equation (5.4.23) (5.4.27) and represent
    it by the following tridiagonal system:


    ```

    $$\begin{pmatrix} b_1 & c_1 & 0 & 0 & 0 & f_{i,1} \ a_2 & b_2 & c_2 & 0 & 0 &
    f_{i,2} \ 0 & 0 & \cdot & 0 & 0 & \cdot \ 0 & 0 & 0 & \cdot & 0 & \cdot \ 0 &
    0 & a_{n_{s-3}} & b_{n_{s-3}} & c_{n_{s-3}} & f_{i,n_{s-3}} & R_{i+1,n_{s-3}}
    \ 0 & 0 & 0 & a_{n_{s-2}} & b_{n_{s-2}} & f_{i,n_{s-2}} & R_{i+1,n_{s-2}} \end{pmatrix}
    = \dots \quad (5.4.28)$

    ```


    In matrix notation, equation (5.4.28) can be written as


    ```

    $AX = R, \quad \(5.4.29)$

    ```


    where $A$ is an $n_{s-2} \times n_{s-2}$ tridiagonal matrix containing the known
    coefficients $a_j, j = 2, \dots, n_{s-2}, b_{j,j} = 1, \dots, n_{s-2},$ and $c_{j,j}
    = 1, \dots, n_{s-3}$. The vector $R$ denotes the known right-hand side, $R_{i+1,j}
    = 1, \dots, n_{s-2},$ and the vector $x$ contains the option values we wish to
    compute, $f_{i,j} = 1, \dots, n_{s-2}$.


