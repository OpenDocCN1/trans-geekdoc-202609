  md: "# Chapter 1\n\n# Overview of Financial Derivatives\n\nA financial derivative\
    \ is a contract between two counterparties (here referred to as A and B), which\
    \ derives its value from the state of underlying financial quantities. We can\
    \ further divide derivatives into those which carry a future obligation and those\
    \ which do not. In the financial world, a derivative which gives the owner the\
    \ right but not the obligation to participate in a given financial contract is\
    \ called an option. We will now illustrate this using both a Foreign Exchange\
    \ forward and a Foreign Exchange option.\n\nForeign Exchange Forward – A Contract\
    \ with an Obligation\n\nIn a Foreign Exchange Forward contract, a certain amount\
    \ of foreign currency will be bought (or sold) at a future date using a prearranged\
    \ foreign exchange rate.\n\n instance, counterparty A may own a Foreign Exchange\
    \ forward which, in 1-year term, contract obliges A to purchase from B a sum of\
    \ $200 for £100. At the end of the year, several things may have happened.\n\n\
    +   (i) The value of the pound may have decreased with respect to the dollar.\n\
    (ii) The value of the pound may have increased with respect to the dollar.\n(iii)\
    \ Counterparty B may refuse to honour the contract – B may have gone bust, etc.\n\
    (iv) Counterparty A may refuse to honour the contract – A may have gone bust,\
    \ etc.\n\nWe will now consider events (i)–(iv) from A’s perspective.\nFirst, if\
    \ (i) occurs then A is able to obtain $200 for less than the current market rate,\
    \ say £120. In this case, the $200 can be bought for £100 and immediately sold\
    \ for £120, giving a profit of £20. However, this profit can only be realised\
    \ if B honours the contract, which is, event (iii) does not happen.\nSecond, if\
    \ (ii) occurs then A is obliged to purchase $200 for more than the current market\
    \ rate, say £90. In this case, the $200 are bought for £100 but could have been\
    \ bought only for £90, giving a loss of £10.\nThe probability of events (iii)\
    \ and (iv) occurring are related to the Credit Risk associated with counterparty\
    \ B. The value of the contract to A is not affected by (iv), although A may be\
    \ sued if both (ii) and (iv) occur. Counterparty A should only be concerned with\
    \ the possibility of events (i) and (iii) occurring, that is"
  merge: -1
  img_proc: true
- pgno: 12
  md: '# CHAPTER | 1 Overview of Financial Derivatives


    the probability that the contract is worth a positive amount in one year and probability
    that B will honour the contract (which is one minus the probability that event
    (iii) will happen).


    From B’s point of view, the important Credit Risk is when both (ii) and (iv) occur,
    is, when the contract has positive value but counterparty A defaults.


    # Foreign Exchange Option – A Contract without an Obligation


    A Foreign Exchange option is similar to the Foreign Exchange Forward, the difference
    is that if (ii) occurs then A is not obliged to buy dollars at an unfavourable
    exchange rate. To have this flexibility, A needs to buy a Foreign Exchange option
    from B, which here can be regarded as insurance against unexpected exchange rate
    fluctuations.


    For instance, counterparty A may own a Foreign Exchange option which, in one year,
    contractually allows A to purchase from B, the sum of $200 for £100. As before,
    at the end of one year the following may have happened.


    +   (i) The value of the pound may have decreased with respect to the dollar.


    +   (ii) The value of the pound may have increased with respect to the dollar.


    +   (iii) Counterparty B may refuse to honour the contract – B may have gone bust,
    etc.


    +   (iv) Counterparty A may have gone bust, etc.


    We will now consider events (i)-(iv) from A’s perspective. First, if (i) occurs
    then A will be able to obtain $200 for less than the current market rate, is £120.
    In this, the $200 can be bought for £100 and immediately sold for £120, giving
    a profit of £20. However, this profit can only be realised if B honours the contract,
    that is, event (iii) does not happen.


    Second, if (ii) occurs then A will decide not to purchase $200 for more than the
    current market rate – in this case, the option is worthless.


    We can see that A is still concerned with the Credit Risk when events (i) and
    (iii) occur simultaneously.


    The Credit Risk from counterparty B’s point of view is different. B has sold to
    A a Foreign Exchange option, which matures in one year and has already received
    the money – the current fair price for the option. Counterparty B has no Credit
    Risk associated with A. This is because if event (iv) occurs, and A goes, does
    not matter to B since the money has already been received. On the other hand,
    if event (iii) occurs B may be sued by A but B still has no Credit Risk associated
    with A.


    This book considers the valuation of financial derivatives which carry obligations
    and also financial options.


    Chapters 1–7 deal with the theory of stochastic processes and the pricing of financial
    instruments. In Chapter 8, this information is then applied to a C# portfolio
    valuer. The application is easy to use (the portfolios and current'
