    # 9.3 EARLY EXCHANGES


    Much of the early history of commodity and financial exchanges is linked to the
    movement of Jews across Europe. Jewish communities had tight knit family and religious
    ties with others throughout, and this formed a powerful network through trade
    and commerce could be conducted. For example, the brothers Francis and Diego Mendez
    were such merchants, the former residing in Lisbon and the latter at Antwerp,
    see Weg (1916). The mass movement of Jews from Spain and Portugal during the 15th
    and 16th centuries is linked with the eventual establishment of commodity and
    financial exchanges in Antwerp, Amsterdam, London, Paris, and many other major
    cities throughout the world.


    # 9.3.1 The Antwerp Exchange


    Many Jews from Spain and Portugal were the massacres and conversions of 1391 and
    1497. By the sixteenth century, a large number had settled in Antwerp and were
    engaged in international and domestic trade, banking and finance.


    The Antwerp exchange was created in 1460 for commodities trading and settlement
    purposes. The exchange has a pagadder tower which is a look-out tower that wealthy
    merchants built onto their houses overlooking the Schelde in Antwerp. From these
    towers, they could look out over the river and see when their ships arrived –
    knowing this information before others could be used to advantage when making
    deals concerning the safe arrival of goods, see Fig. 9.4.


    FIGURE 9.4 Pagadder tower Antwerp Old Exchange building at Hofstraat 15 Antwerpen
