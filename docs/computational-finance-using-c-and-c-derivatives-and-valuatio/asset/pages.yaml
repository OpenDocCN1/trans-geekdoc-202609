- pgno: 10
  md: '# Preface


    It has been seven years since the initial publication of *Computational Finance
    Using C and C#*, and in that time the *Global Credit Crisis* has come and gone.
    The author therefore thought that it would be opportune to both correct errors
    and update the contents of the first edition. Numerous problems/exercises and
    C# software have been included, and both the solutions to these exercises and
    the software can be downloaded from the book’s companion website.


    http://booksite.elsevier.com/9780128035795/


    There is also a short chapter on the History of Finance, from the Babylonians
    to the 2008 Credit Crisis. It was inspired by my friend Ian Brown who wanted to
    write something on the Credit Crisis that he could understand - I hope this helps.


    As always I would like to take this opportunity of thanking my wife Kathy for
    putting up with the time I spend on my computer.


    Thanks are also due to my friend Vince Fernando, who many years ago now, suggested
    that I should write a book - until the thought had not occurred to me.


    I am grateful to Dr. J. Scott Bentley, Susan Ikeda and Julie-Ann Stansfield of
    Elsevier for all their hard work and patience, and also the series editor Dr.
    Steven Satchel for allowing me to create this second edition.


    George Levy

    Benson

    November 2015'
