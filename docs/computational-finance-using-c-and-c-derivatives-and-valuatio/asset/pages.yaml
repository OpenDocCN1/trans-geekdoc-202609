  md: "# Vanilla Options and the Black–Scholes Model Section | 4.4 77\n\nThe same\
    \ procedure can be used to compute the implied volatility of a European put; in\
    \ which case we can replace c(S,E,t,σ) by p(S,E,t,σ), the value of a European\
    \ put, and from equation (4.4.67), $V_c = \\mathcal{V}_p$.\n\n```\ndouble implied_volatility(double\
    \ value, double s, double x, double sigma[],\n{\n    // Input parameters:\n  \
    \  double value // the current price of the option\n    double s0 //\n    double\
    \ s0 // the current price of the underlying asset\n    double x // the strike\
    \ price\n    double sigma[2] // the input bounds on the volatility: sigma[0],\
    \ the lower bound and, sigma[1], the upper bound\n    double t // the maturity\n\
    \    double r // the interest rate\n    double q // the continuous dividend yield\n\
    \    int put // if put is 0 then a call option, otherwise a put option\n    //\
    \ Output parameters:\n    double sigma[] // sigma[0] contains the implied volatility\n\
    \    int iflag; // an error indicator\n    double zero=0;\n    double err, vi,\
    \ sig;\n    double val,tol;\n    double temp,vega,gaqrt,temp,val1;\n    long max_iter,\
    \ i, ind;\n    double greek[5],c[20],sig,vega;\n    long done;\n    double eps\
    \ = 0;\n    eps=sqrt(EPS); // / a call option /\n    if(put==1) {\n        temp=MAX(0,x*exp(-r*t)-s*exp(-q*t),0);\
    \ // / a put option /\n    } else {\n        temp=MAX(0,s*exp(-q*t)-x*exp(-r*t),0);\n\
    \    }\n    vi=abs(value-temp);\n    if (vi<eps) // / the volatility is too small\
    \ /\n        iflag=3;\n        return;\n    }\n    iflag=0;\n    i=0;\n    max_iter=500;\n\
    \    sig=sigma[0]; // / initial iteration /\n    val=temp; // / Newton iteration\
    \ /\n    while (abs(val-value)>tol && i<max_iter) {\n        black_scholes(val,greek,0,x,t,r,q,put,iflag);\
    \ // / compute the Black Scholes option value, val\n        vega=greek[4]; //\
    \ / and vega /\n        sig=sig-(val-value)/vega; // / compute the new estimate\
    \ of sigma using Newton's method /\n        if (abs((sigma[0]-sig)/sig)<eps) //\
    \ / check whether the specified accuracy has been reached /\n            done=1;\n\
    \        }\n        sig=sig;\n        i++;\n    }\n    sigma[0]=sig; // / return\
    \ the estimate for sigma /\n    return;\n```\n\nCode 4.3 Function to compute the\
    \ implied volatility of European options.\n\nIf the implied volatility of American\
    \ options is required, the procedure is exactly the same. However, instead of\
    \ using the Black–Scholes formula to compute both the option value and vega, we\
    \ use a binomial lattice to do this. The use of binomial lattices to obtain the\
    \ option price and the Greeks is described in Chapter 5.\n\nBelow, in Code 4.4,\
    \ is the simple test program which illustrates of the function implied_volatility;\
    \ the results are presented in Table 4.3."
