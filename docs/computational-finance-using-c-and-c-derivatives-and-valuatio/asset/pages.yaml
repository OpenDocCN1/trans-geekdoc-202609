  md: '# Chapter 3


    # # Generation of Random Variates


    # ## 3.1 INTRODUCTION


    Monte Carlo simulation and random number generation are techniques that are widely
    used in financial engineering as a means of assessing the level of exposure to
    risk. Typical applications include the pricing of financial derivatives and scenario
    generation in portfolio management. In fact many of the financial applications
    that use Monte Carlo simulation involve the evaluation of various stochastic integrals
    which are related to the probabilities of particular events occurring.


    In many cases however, the assumptions of constant volatility and a lognormal
    distribution for $Sr$ are quite restrictive. Real financial applications may require
    a variety of extensions to the standard Black-Scholes model. Common requirements
    for non-lognormal distributions, time varying volatilities, caps, floors, barriers,
    etc. In these circumstances, it is often the case that there is no closed solution
    to the problem. Monte Carlo simulation can then provide a very useful means of
    evaluating the required integrals.


    When we evaluate the integral of a function, $f(x)$, in the $s$-dimensional unit
    cube, $I^s$, by the Monte Carlo method, we are in fact calculating the average
    of the function at a set of randomly sampled points. This means that each point
    adds linearly to the accumulated sum that will become the integral and linearly
    to the accumulated sum of squares that will become the variance of the integral.


    When there are $N$ sample points, the integral is


    ```

    $v = \frac{1}{N} \sum_{i=1}^{N} f(x^i)$

    ```


    When $

    u$ is used to denote the approximation to the integral and $x^1, x^2, \dots, x^N$
    are the $N, s$-dimensional, sample points. If a pseudo-random number generator
    uses the points $x^l$ it $(should be)$ independently and identically distributed.
    From standard statistical results, we can estimate the expected error of the integral
    as follows.


    If we set $y^l = f(x^l)$, then $x^l$ is independently and identically distributed,
    $y^l$ is also independently and identically distributed. Then we denote the variance
    as $Var[x^l] = \Delta^2$. It is a well-known statistical property that the variance
    of $

    u$ is given by $Var[\nu] = N^{-1}\Delta^2$, see Appendix E.1'
