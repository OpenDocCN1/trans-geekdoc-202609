    # Basis Swap


    This is very similar to an IRS, but now there are two floating legs each with
    their associated principal amount.


    For example, leg 1 could be associated with the 1-month LIBOR (London Inter-Bank
    Offer Rate) and have a schedule of monthly payments, while leg 2 could use the
    3-month LIBORs and have quarterly payments. In this case, the forward rates and
    discount factors for leg 1 would be computed using the 1-month LIBOR yield curve,
    and the forward rates and discount factors for leg 2 will be computed using the
    3-month LIBOR yield curve.


    We will use the subscripts 1 and 2 to denote quantities associated with legs 1
    and 2 respectively. The payment times associated with leg 1 are $t''_{1,i}=i=1\dots,n_1$.
    While those for leg 2 are $t''_{2,i}=i=1\dots,n_2$, (and for this example) $n_1=3n_2$.


    If counterparty A makes the quarterly payments (that receives the payments made
    on leg 1), the time $t$ value of the basis swap is


    ```

    $BS(t) = C_1DF(t,t_k) + FLT_1(t) - C_2DF(t,t_k) - FLT_2(t), \quad (7.2.21)

    ```


    where we have similar notation to that used in equation (7.2.12),


    ```

    $FLT_1(t) = P_1DF(t,t_k) - DF(t,t_n)) \quad (7.2.22)

    ```


    and


    ```

    $FLT_2(t) = P_2DF(t,t_k) - DF_2(t,t_n)) \quad (7.2.23)

    ```


    In equations (7.2.22) and (7.2.23), $P_1$ is the principal for leg 1 and $P_2$
    is the principal for leg 2. The time of the next coupon payment for leg 1 is $t_{k_1}$,
    while for leg 2 is $t_{k_2}$; in addition, we have used the fact that $t_{n_1}=t_{n_2}=t_n$'
