  md: "# # Glossary\n\nThe notation used is as follows:\n\n+   - **GBM** Geometric\
    \ Brownian motion.\n\n+   - **BM** Brownian motion.\n\n+   - \"$W_t$ Brownian\
    \ motion at time $t$ - the term may be non-zero.\"\n\n+   - $\rho$ The correlation\
    \ coefficient.\n\n+   - $\\sigma$ The volatility. Since assets are assumed to\
    \ follow GBM it is computed as the generalised standard deviation of the $n$ continuously\
    \ compounded returns.\n\n$N_1(a)$ The univariate cumulative normal distribution.\
    \ It gives the cumulative probability, in a standardized univariate normal distribution,\
    \ that the variable $x_1$ satisfied $x_1 \\leq a$.\n\n$N_2(a,b,\rho)$ The bivariate\
    \ cumulative normal distribution. It gives the cumulative probability, in a standardized\
    \ bivariate normal distribution, that the variables $x_1$ and $x_2$ satisfy $x_1\
    \ \\leq a$ and $x_2 \\leq b$ when with correlation between $x_1$ and $x_2$ is\
    \ $\rho$.\n\n$r$ The free interest rate.\n\n$q$ The continuously compounded dividend\
    \ yield.\n\n$S_t$ The asset price at time $t$.\n\n$I_{nn}$ The $n$ by $n$ unit\
    \ matrix.\n\n$\\Lambda(\\mu,\\sigma^2)$ A lognormal distribution with parameturs\
    \ $\\mu$ and $\\sigma^2$. If $y = \\log(x)$ and $y \\sim N(\\mu,\\sigma^2)$ then\
    \ the distribution for $x = e^y$ is $\\Lambda(\\mu,\\sigma^2)$. We have $E[x]\
    \ = \\exp(\\mu + \\frac{\\sigma^2}{2})$ and $Var[x] = \\exp(2\\mu + \\sigma^2)(\\\
    exp(\\sigma^2) - 1)$.\n\n$DF(t,T)$ The discount factor between times $t$ and $T$,\
    \ where $T \\geq t$. The price of a non-defaultable coupon bond that matures at\
    \ $T$ is the expected value of $DF(t,T)$. In this book we assume that interest\
    \ rates are deterministic and thus $DF(t,T)$ is the value of a non-defaultable\
    \ coupon bond maturing at $T$."
  merge: -1
