    # 5.4.5 The Log Transformation and Nonuniform Grids


    In the previous section, we considered the use of a uniform grid to discretize
    the logarithmically transformed Black–Scholes equation,


    ```

    $$\frac{\partial f}{\partial t} + b\frac{\partial f}{\partial Z} + \frac{\sigma^2}{2}\frac{\partial^2
    f}{\partial Z^2} = rf. \quad (5.4.56)$

    ```


    where


    ```

    $b = r - q - \frac{\sigma^2}{2} \quad \text{and} \quad Z = \log S.$

    ```


    Here, we will generalize these results and use a nonuniform grid to solve equation
    (5.4.56).


    Our description will be very brief since most of the details have already been
    discussed in previous sections. Here, we are only concerned with the finite-difference
    approximation and derive the equations that need to be solved at each time step.
    Later, in Section 5.4.6, we will apply our results to solving a European double
    knockout barrier option.


    # The Finite-Difference Approximation


    At the grid node (i, j), we have


    ```

    $$\Delta Z_j = Z_j - Z_{j-1} \quad \text{and} \quad \Delta Z_j^+ = Z_j + 1 - Z_j.$

    ```


    Using Section 5.4.2, the first and second derivatives of f with respect to Z are


    ```

    $f_{i,j}'''' = \frac{2\{\Delta Z_j^+ f_{i,j-1} + \Delta Z_j f_{i,j+1} - \Delta
    Z_j^+ f_{i,j} - (\Delta Z_j^+)^2 f_{i,j}\}}{{(\Delta Z_j^+)^2 + (\Delta Z_j^-)^2}}$

    ```


    and


    ```

    $f_{i,j}'' = \frac{(\Delta Z_j^+)^2 f_{i,j+1} + (\Delta Z_j^-)^2 f_{i,j-1} - ((\Delta
    Z_j^+)^2 - (\Delta Z_j^-)^2) f_{i,j}}{(\Delta Z_j^+)^2\Delta Z_j^- + (\Delta Z_j^-)^2\Delta
    Z_j^+}$

    ```


    When discretizing equation 3.186 in the usual manner, we obtain


    ```

    $$\frac{f_{i+1,j} - f_{i,j}}{\Delta t} + b \left(\\Theta_{mf} f_{i+1,j} + \Theta_{mf}''
    f_{i,j}''\right) + \frac{\sigma^2}{2} \left(\\Theta_{mf} f_{i,j}'''' + \Theta_{mf}''
    f_{i,j}''''\right)$\

    = r \left(\Theta_{mf} f_{i,j} + \Theta_{mf}'' f_{i,j}''\right).$

    ```'
