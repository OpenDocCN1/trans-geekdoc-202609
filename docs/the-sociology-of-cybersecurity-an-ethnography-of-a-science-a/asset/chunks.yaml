- raw: ' 13. Instead of explaining them, please do the experiment with interpretation
    of qualitative data yourself. Go back to [Fragment 1.1](#ch01.xhtml#_24044-2003-001-001)
    and look for traits of infrastructure as predicted by Star and others. Infrastructure
    will be hard to observe until it breaks down; it will grow in small increments
    and only rarely in big sweeps, and it will be learned as part of membership in
    a community. It is embodied in standards and in the bodies of users and operators.
    It is also embedded in myriad other social agreements and technologies. It is
    always highly localised, yet it always goes beyond a single location.


    One thing is to note that hackerspaces work on their own infrastructures, in a
    manner resembling fractals, the ouroboros or any social group deeply vested in
    care. Another thing is that hackerspaces accept infrastructure as constantly mangled,
    open not only to modification but also to interpretation. This instability enables
    easier experimentation, even on external infrastructures and networks, such as
    in the case of Speck and Fidel.


    This is my other trick. Sometimes, when you cannot see the hack, or you struggle
    to examine its dynamics, reverse the social optics and think about the care required
    to ensure reliable infrastructure. Focus on understanding what keeps the mundane
    possible in order to see the impossible or unusual. It is both a century-old ethnographic
    intuition and simply common knowledge in the field. If you neglect everyday infrastructure,
    researching hacking seems hard. This is why the path to computer security is simultaneously
    so obscured yet so simple. A significant part of the experts I interviewed, perhaps
    except for academic cryptographers, were ex-developers, ex-testers or ex-administrators.
    They became members by maintaining the infrastructure. There is a constant flow
    between SysOps, DevOps, hackers and security researchers.


    Research on maintenance is a small subsection in an already small niche in STS
    ([Henke & Sims, 2020](#bibliography.xhtml#_24044-2003_chp005_ref68)). Aside from
    Star, it stemmed from understanding the differences between synchrotron technicians
    and scientists ([Doing, 2009](#bibliography.xhtml#_24044-2003_chp005_ref43)),
    office spaces and printer technicians ([Orr, 1996](#bibliography.xhtml#_24044-2003_chp005_ref122))
    and factory floors and union action history ([Noble, 2011](#bibliography.xhtml#_24044-2003_chp005_ref119)),
    as well as the care of human ([Mol, 2002](#bibliography.xhtml#_24044-2003_chp005_ref111))
    and non-human ([Haraway, 2006](#bibliography.xhtml#_24044-2003_chp005_ref65))
    actors.


    Not surprisingly, as my study proceeded, Speck and Fidel started doing gigs in
    security, landing jobs with some solid squads globally. So, before thinking more
    about infrastructure, I need to discuss the community around Speck and Fidel.


    ## Evenings in Hackerspace


    As the evening passed, a local high school student dropped in to finish some soldering
    in their homework project with FPGA (Field-Programmable Gate Array, type of hardware
    with logic reprogrammable after manufacturing, often used in low volume / high
    customizability designs and in research). System administrators joined Speck and
    Fidel to discuss the local job market, contract rates and transfers. In other
    places like this hackerspace, you may  14. also encounter ham radio clubs, privacy
    workshops or computer numerical control (CNC) machine shops. Here and today, the
    mood was more for programmers, architects and developers with more laptops, smaller
    groups, quieter talk and more intense periods of individual work.


    Rush hour in the city ended as evening turned to night. More people were coming
    and going. Some of them just stopped to say “hi” and to pick up stuff they were
    storing here. Others met here to speak Chinese in friendly surroundings. Admins
    and high schoolers sat together discussing a recent zero-day: a newly found vulnerability
    in some computer system, known publicly as zero-days and so new that system developers
    were unlikely to produce a patch, solution or any response at all.


    I will return to zero-days in [Chapter 4](#ch04.xhtml#_24044-2003_ch004), as they
    are key epistemic objects for understanding computer security knowledge. But even
    this quick glimpse may lead into a nice sociology of science paradox. A zero-day
    is an equivalent to scientific discovery, as transferring it requires advanced
    knowledge and trust. At the same time, by definition, it depends on not being
    publicly known. You may wish to test your zero-day on targets, to check if it
    still works, but each test raises the possibility of recognition of and patching
    against the vulnerability. So, zero-days share the factor of surprise with secret
    weapons, but they do not necessarily share deterrence properties. Even if they
    were not part of computer crime or computer warfare, zero-days would still be
    perplexing as objects of knowledge.


    This is why I always felt that a philosophy of science cannot be detached from
    social practices. Just a few months later, I would learn more about exploits,
    and I try to compare them with scientific facts, their replication mechanisms
    and politics.


    Philosophical musings are great to vent during breaks, but I have to get back
    to ethnography. Some people were talking in the local language; others were foreigners
    who did not have many places in the city to hang out. The things discussed and
    developed ranged wildly. Some people were engaged in deceivingly simple, extracurricular
    high school stuff. Others discussed issues from senior development/operations
    in a bank. Sometimes I willingly chose not to listen to avoid the risk of them
    breaching non-disclosure agreements.


    That is what a typical evening in a hacking community looks like. For a passer-by,
    it will look like people just hanging out. But if you hang out yourself for a
    bit, you will notice experiments or discussions about scientific papers. There
    is a no practical difference between an obscure scientific discussion or an evening
    hang out with a beer. It’s also impossible to tell when maintenance stops and
    hacking ideas start. “Aha moments” do not happen constantly, so they are easy
    for bystanders to miss. What matters is that communities formed around maintenance
    provide enough reasons for hangouts to happen. This is the soil, or silica, where
    experiments grow.


    The results of an experiment do not need to be spectacular or worthy of discussing
    at a big hacking convention. They could be about preventing a local data leak
    or even a minor infrastructure error that end users would not  15. have known
    of. They could be mundane, not likely to be recorded by historians. Yet, for me,
    they mark an interesting fact about machines and social relations. Machines can
    be hacked as a part of casual conversations, not necessarily for malignant, reputational
    or financial reasons, but to test ideas or as a stage in a larger project.


    This means that the infrastructure for hacking consists not only of ways of securing
    your attempt from outsiders (law enforcement or others) but also of having enough
    people to chat with about a new paper in sufficient privacy. It means having spare
    servers to do “quick and dirty” tests. It means having enough free time and other
    resources to work without immediate results. It means having a place for failures
    and learning. When I enumerate such things, they may seem obvious to conducting
    science, in particular, and any kind of creative endeavour in general. Notice
    how we are moving away from the single hacker, socialising only through online
    modes. How they are becoming more enmeshed, less universal and more dependent
    on a communal division of labour.'
