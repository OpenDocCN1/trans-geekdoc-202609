    This is exactly why I mentioned the concepts of performative and anti-structure
    by Victor Turner ([Turner, 1995](#bibliography.xhtml#_24044-2003_chp005_ref153),
    [2008](#bibliography.xhtml#_24044-2003_chp005_ref154)) earlier. Stabilised instabilities,
    at least when they become public affairs (as I will discuss later), are 64. public
    theatre performatives. As such, they are anti-structures, so they become negatives
    of security theatres as thought by Schneier. Stabilised instabilities as anti-structures
    translate to not only opening in a disciplinary field as cybersecurity establishes
    itself as a science, but they may also contribute to changes in social cohesion
    and boundary between familiarity and anonymity.


    What exactly do I mean by that? Stabilised instability, as I defined earlier,
    is a challenge to the infrastructure. It exists in the context of disruption,
    destruction or putting infrastructure and social order in doubt or vulnerability.
    When such contexts become known to the public, social order related to the infrastructure
    may also be put into doubt as well as individual meanings, resources and other
    relations. An example of the social order put into doubt would be the consequences
    of public disclosure of classified data and dismissal of public officials (as
    happens in sociological fairy tales but not in reality). Examples of individual
    meanings, resources or relations put into doubt are the leaks of accounts of adult
    or dating websites. What is important from an anthropological or sociological
    perspective is the fact that the public or general knowledge was challenged at
    what is in anthropology called a liminal stage ([Van Gennep, 2019](#bibliography.xhtml#_24044-2003_chp005_ref166)).


    In other words, scientific discoveries, especially public reveals from cybersecurity
    by definition destabilise public order, by making people lose their sense of belonging,
    or what my friend and a philosopher of technology Andrzej W. Nowak calls “a horror
    in ontological imagination” ([Nowak, 2016](#bibliography.xhtml#_24044-2003_chp005_ref120)).
    Through challenging established epistemology in various scientific debates and,
    for cybersecurity, reliance on digital infrastructures, sciences make people feel
    “neither here, nor there”, as epistemological displacement catalyses social and
    ontological doubts. What van Gennep proposed for the ritual of adulthood, Turner
    understood as a ritual of cohesion and decohesion of society, hence the theoretical
    dialectics of structure and anti-structure. When stabilised instability becomes
    a public affair, as was the case of Pegasus, it also becomes a sociological anti-structure:
    an opportunity to contest not only an epistemological assumption about security
    knowledge but also social and political assumptions about democracy, various parliaments,
    markets, etc.


    In this paradoxical way, stabilised instability constitutes a socio-psychological
    double bind. Scientists, researchers and cybersecurity professionals research
    stabilised instabilities because these provides them with a sense of meaning,
    an emotional payoff for satisfying their curiosity or always returning for the
    experience of “having the root” (being in total control, total power and knowledge
    of the system). Curiosity-satisfaction, sense of control and dopamine-rush from
    challenge are, of course, not all the psychological motivations for doing scientific
    work. Especially after 2020, with the rising standardisation and the rising needs
    for insurance and certification, more interviewees, especially from student-centred
    events, mentioned money and prestige as motivators. I discussed it in the previous
    chapter in relation to Maxigas and Söderberg’s concept of recuperation of resistance
    and hacking culture by institutions ([Söderberg & Maxigas, 2022](#bibliography.xhtml#_24044-2003_chp005_ref141)).
    Regardless of the psychological 65. motivations of individuals within the field
    of cybersecurity, the double bind on the broader, social scale is to create more
    uncertainty and social anti-structure.


    In my personal interpretation, cybersecurity is not alone as a field in this Faustian
    bargain between certainty and doubt. This dialectic is a part of the social role
    of science, since science began to replace religion as a source of justification
    or meaning for public order. To attempt to discuss any type of knowledge in public,
    to put it into open, experimental and repeatable verification is to accept that
    debate in scientific knowledge will cause turmoil. It is naïve to expect that
    any kind of science will be free of such responsibility.


    This is the final interpretation of stabilised instability. If cybersecurity,
    at least occasionally, becomes an issue of public scientific controversy, then
    such controversy would not be resolved only through a debate among experts. Stabilised
    instabilities reveal issues of power over societies, not only because they epistemologically
    and materially relate to digital infrastructures but also because they relate
    to social order, issues of trust, privacy and control. This is the definition
    of the social role of cybersecurity as a science: if cybersecurity is to become
    a science that circulates stabilised instabilities, then it should concern itself
    with public participation, accountability and responsibility. Replication, methodological
    excellence and digital methods are not enough to make a leap from 1930s science
    to contemporary science.


    Public oversight and ethical accountability are necessary, as Auschwitz’s medical
    experiments, Tuskegee’s syphilis study, Wendell Johnson’s negative reinforcement
    experiment and numerous other harms done in the name of science have proven. Why
    should we expect cybersecurity to be different? If it experiments with larger-scale
    infrastructures that concern social groups, why should we place different ethical
    demands on it? Virology and nuclear physics are also closely adjacent to military
    institutions, but they still have some civilian and professional oversight.


    Who should provide oversight over various practices of cybersecurity and its experiments?
    This is a social, ethical and political question as much as it is an epistemological
    one. Discussing cybersecurity as a science, one cannot escape it. Not because
    cybersecurity is ubiquitous, overreaching or special, but because the very same
    question must be answered for every other field of science.


    In the end, interpreting stabilised instability has led to a sociological equivalent
    of an ouroboros. The more I tried to analyse the peculiarity of stabilised instability
    as an epistemic object, the more elements common to other relations between other
    sciences and societies I found. In retrospect, this is not surprising.


    Being close to the tradition of C. W. Mills in sociology ([Mills, 2000](#bibliography.xhtml#_24044-2003_chp005_ref100)),
    I know that analysis of individual characteristics often leads to recognition
    of repetitive, structural or historical patterns. Finding these patterns is a
    clear sign that it is high time to apply my concepts to some cases.


    ## Vulgar Display of Power (Elite). Why Does Cybersecurity Science Matter?


    How to find a case for global conceptualisation? Many times, I admitted that even
    such an attempt is incomplete and mosaic by default. The only solution is to look
    closely at the power elites ([Mills & Wolfe, 2000](#bibliography.xhtml#_24044-2003_chp005_ref107)).

    '
  trans: '

    这正是为什么我之前提到了维克多·特纳提出的表演性（performative）和反结构（anti-structure）概念（特纳，1995, 2008）。


    稳定的不稳定（Stabilised instabilities），至少在它们成为公共事务时（如我稍后将讨论的），是 64. 公共剧场式的表演性。作为反结构，它们成为施奈尔所认为的安全剧场的反面。作为反结构的稳定不稳定，不仅意味着在网络安全确立为一门科学的学科领域中打开局面，还可能促成社会凝聚力以及熟悉与匿名之间的边界发生变化。


    我到底是什么意思？稳定的不稳定，正如我之前所定义，是对基础设施的挑战。它存在于破坏、毁灭或使基础设施和社会秩序陷入怀疑或脆弱性的情境中。当此类情境为公众所知时，与基础设施相关的社会秩序也可能受到质疑，以及个人的意义、资源和其他关系。社会秩序受到质疑的一个例子是机密数据公开披露以及公职人员被解职的后果（这在社会学童话中会发生，但在现实中不会）。个人的意义、资源或关系受到质疑的例子是成人或约会网站账户的泄露。从人类学或社会学角度来看重要的是这样一个事实：公众或一般知识在人类学中所称的阈限阶段（liminal
    stage）受到了挑战（范·热内普，2019）。


    换句话说，科学发现，尤其是网络安全领域的公开披露，本身就会破坏公共秩序，使人们失去归属感，或正如我的朋友、技术哲学家安杰伊·W·诺瓦克所称的“本体论想象中的恐怖”（诺瓦克，2016）。通过在各种科学辩论中挑战既定的认识论，以及对网络安全而言依赖数字基础设施，科学使人们感到“既不在这里，也不在那里”，因为认识论的位移催化了社会和本体论的怀疑。范·热内普对成年仪式的论述，特纳理解为社会凝聚与解离的仪式，因此形成了结构与反结构的理论辩证法。当稳定的不稳定成为公共事务时，如
    Pegasus 案例所示，它也成为一种社会学上的反结构：一个不仅可以质疑关于安全知识的认识论假设，还有关民主、各种议会、市场等的社会和政治假设的机会。


    以这种悖论的方式，稳定的不稳定构成了一种社会心理的双重束缚。科学家、研究人员和网络安全专业人员研究稳定的不稳定，因为这些为他们提供了意义感，满足好奇心或不断追求“获得
    root 权限”（完全控制、完全掌控系统及其知识）的体验所带来的情感回报。好奇心的满足、控制感以及挑战带来的多巴胺激增，当然并不是从事科学工作的全部心理动机。尤其是
    2020 年之后，随着标准化的提高以及对保险和认证需求的增加，更多的受访者，尤其是来自以学生为中心的活动，提到金钱和声望是动机。我在上一章中结合 Maxigas
    和 Söderberg 关于机构对抵抗和黑客文化的收编概念讨论了这一点（松德贝里 & 马克西加斯，2022）。无论网络安全领域内个人心理动机的如何，65.
    在更广阔的社会层面上的双重束缚是制造更多的不确定性和社会反结构。


    在我个人的解读中，网络安全并非唯一陷入这种关于确定性与怀疑的浮士德式交易的领域。这种辩证法是科学社会角色的一部分，因为科学开始取代宗教，成为公共秩序正当性或意义的来源。试图在公开场合讨论任何类型的知识，将其置于开放、实验性和可重复的验证之下，就是接受科学知识的辩论会引发动荡。期望任何科学都能免于这种责任是天真的。


    这是稳定不稳定的最终解读。如果网络安全至少偶尔成为公共科学争议的问题，那么此类争议就不会仅通过专家之间的辩论来解决。稳定的不稳定揭示了关于社会的权力问题，不仅因为它们在认识论和物质上与数字基础设施相关，还因为它们与社会秩序、信任、隐私和控制问题相关。这就是网络安全作为一门科学的社会角色的定义：如果网络安全要成为传播稳定不稳定的科学，那么它就应该关注公众参与、问责和责任。可重复性、方法论的卓越性和数字方法不足以实现从
    1930 年代科学到当代科学的飞跃。


    公众监督和伦理问责是必要的，正如奥斯维辛的医学实验、塔斯基吉梅毒研究、温德尔·约翰逊的负强化实验以及众多以科学之名造成的伤害所证明的那样。我们为什么要期望网络安全有所不同？如果它在涉及社会群体的更大规模基础设施上进行实验，我们为什么要对其提出不同的伦理要求？病毒学和核物理学也与军事机构密切相关，但它们仍然有一些平民和专业监督。


    谁应该监督网络安全的各种实践及其实验？这是一个社会、伦理和政治问题，也是一个认识论问题。讨论网络安全作为一门科学，就无法回避它。不是因为网络安全无处不在、过度扩张或特殊，而是因为同样的问题必须为每一个其他科学领域得到回答。


    最终，对稳定不稳定的解读导致了一个社会学上的衔尾蛇等价物。我越是试图分析稳定不稳定作为认识论对象的特殊性，就发现与其他科学与社会之间关系共有的元素越多。回顾起来，这并不令人惊讶。


    接近社会学中 C. W. Mills 的传统（米尔斯，2000），我知道对个体特征的分析往往会导致对重复性、结构性或历史性模式的认识。发现这些模式是一个明确的信号，表明是时候将我的概念应用于某些案例了。


    ## 粗俗的权力展示（精英）。为什么网络安全科学重要？


    如何为全球概念化找到一个案例？多次我承认，即使是这样的尝试在默认情况下也是不完整且拼凑的。唯一的解决办法是仔细审视权力精英（米尔斯 & 沃尔夫，2000）。

    '
