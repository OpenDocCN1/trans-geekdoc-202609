  trans: '

    是的，也不是。稳定化的不稳定具有文本、表演性或铭文的一些特征。它是稳定且可跨主体传递的，如同文本。它具有可扩展性，如物理或生物学中的数据，并且可以在图表、地图、示意图中重新组合——网络安全使用这些，尤其是在分析恶意软件的工具如
    Ghidra 或 IDA 中。可以理解的是，数字基础设施在违背人类中心逻辑的地方在数字尺度之间移动。这使得网络安全在个人层面难以学习，在跨主体层面传达起来更困难。这也使得稳定性的事实变得尤为重要：没有细致的文档，没有对基础设施、其故障和影响的参照，漏洞就会消失且不再被识别。它不会存在于两位专家个人会面的情境之外，就像一场精细的专业舞蹈或科学意义上的艺术印象。


    然而，稳定化的不稳定在黑市中被交易（Georgoulias et al., 2023）。它们也被估算、预测并金融化为保险资产（Edwards et al.,
    2019），与网络安全相关的精算模型相连。稳定化的不稳定作为知识对象通过数字基础设施传播，但同样重要的是，随着数字基础设施的扩展，对它们的需求也在传播。最后，正如我在关于夺旗赛的上一章中所展示的，稳定化的不稳定包括专业声望、默会知识和个体意义等事项。虽然这些描述中的一些可以应用于文本类别，但并非所有文本在与特定专业群体或知识领域的关系中都具有这些属性。因此，我并不热衷于将稳定化的不稳定理解为文本或铭文，尽管这两个类别的研究无疑有助于我的理解，并且可能对未来的研究有效。


    相反，我将稳定化的不稳定概念化为表演性的反结构，^()


    不令人惊讶的是，作为一名社会学家，我并不认同这种划分。在任何重大的社会或制度尺度上，没有知识也没有科学可以脱离社会秩序、性别、政治、经济、性取向以及各种其他权力维度的问题。我已经讨论过，夺旗赛是嵌入个人和文化意义的例子，而这些意义随后被公司和军事机构回收为无偿劳动。这种劳动在非常特定的意义上是科学劳动，因为夺旗赛（CTFs）不仅通过地位标记为玩家提供价值，或通过游戏化降低培训成本为雇主提供价值，而且通过在领域内复制知识来降低交易成本，从而为资本总体提供价值。这就是为什么
    CTFs 是稳定化不稳定的复制、标准化和回收场所。这也是为什么，在我的概念框架中，知识、反结构和社会政治后果之间没有区别。


    稳定化的不稳定是被执行的，这意味着它们可以在与相应基础设施一起 enact 时被转移。不稳定在理论意义上可以作为抽象物存在，但没有实际例子就理解漏洞要困难得多，就像病毒一样。这就是为什么标准化参考点，如标准化弱点或攻击向量，在病毒学和网络安全中都如此重要。


    作为社会学家，我对认识论对象的社会功能感兴趣。如果稳定化的不稳定被流通并有助于塑造安全知识，它们也会改变某些社会关系。其中一些变化发生在网络安全职业的内部群体中或网络安全科学领域内。其他变化发生在外部或与其他群体相交处，在更广的尺度上，通过数字基础设施在政府系统、医疗保健、私人生活、商业服务或与监控、执法、边界划定和监禁相关的活动中的中介作用。组织一次私人、仅限邀请的安全活动可能是前者的例子，而宣布一项新的网络安全意识宣传活动可能是后者的标志。


    重要的是，稳定化的不稳定经常大规模重构数字基础设施（这就是我对它们的定义，也是该专业对它们的定义，正如我将在本章后面展示的那样）。正如我在第 1 章中讨论的，对于科学社会学家而言，基础设施，包括数字基础设施，并不仅仅是像连接互联网的计算机这样的本地可访问接口点的实例。它们既不能简化为抽象地图，甚至也不能简化为标准化系统（Lampland
    & Star, 2009），这些系统用于系统地构建可扩展地图、本体论和象征框架或诗学（Henke & Sims, 2020; Larkin, 2013; Star,
    1999; Star & Ruhleder, 1996）。


    61. 作为社会学家，我阅读 Star 及合著者提出的基础设施理论，所以对我而言，基础设施是一种社会意象，几乎是一个涂尔干式的图腾（Durkheim, 2008）。某种程度上，基础设施不仅是一种表征，也是一个关心它的社区的隐喻性社会心脏。这个心脏经常变得不可见、被误用、被过度炒作或被视为理所当然，直到它失效。当它在多个地点失效且规模大于偶然时，失效不仅是技术问题，更是社会和政治危机。这就是基础设施劳动为何与实践共同体不可分割地联系在一起，往往是一套不成文的维护和更换规则与程序。这在社会人类学和心理层面都很重要。


    社会人类学层面对于理解网络安全科学至关重要，但在那之前，我必须对心理层面做一个小小的 digression。


    我将其构建为夸张说法，或韦伯式的理想类型，^()


    正如我在第 1 章的民族志叙述中所讨论的，安全或服务器维护的初学者往往过度依恋他们维护的基础设施，因此自我认同往往导致倦怠。在劳动或技术社会学中，20 世纪
    90 年代观察到这种情况（Orr, 1996）出现在负责施乐机器的维护技术人员中，以及机械工程师（Bucciarelli, 1996）中。最近，它成为维护工程师与从事同步加速器（Doing,
    2009）和行星漫游车（Vertesi, 2015）工作的科学团队之间矛盾的原因。最近的研究认识到，报告漏洞的网络安全专业人员中的压力可能导致倦怠（Moura
    & Heidemann, 2023）。

    '
