    3. 80. It is a generalisation, but at least for G20, I could not find a country
    without a major corruption scandal with public IT procurement for the period 2014–2025.
    [Return to text.⏎](#ch04.xhtml#R_24044-2003_chp004_en003)


    4. I understand securitization of cybersecurity as the development of securities
    and insurance markets designed to underwrite cybersecurity threats. Securitization
    of cybersecurity was recognized in actuarial sciences, but has not been explored
    in social sciences covered by this book. By turning attention to this fragment,
    i wish to contribute to the existing gap in knowledge. [Return to text.⏎](#ch04.xhtml#R_24044-2003_chp004_en004)


    5. I know that ISO 27001 exists as well as several others. The key issue lies
    not only in the genesis of standards but in the political will of key state actors
    and their power elites. Network effects, remember? [Return to text.⏎](#ch04.xhtml#R_24044-2003_chp004_en005)


    6. Systematics like CVE, CVSS and others deserve a dedicated project in science
    studies. This short section should be read as an introduction to the topic for
    my colleagues who study cybersecurity in social sciences. [Return to text.⏎](#ch04.xhtml#R_24044-2003_chp004_en006)


    7. TESCREAL is an acronym from ideologies: transhumanism, extropiansm, singulitarianism,
    cosmism, rationalism, effective altruism, and longtermism. If even the acronym
    is composed from several nebulous, morally laden and utopian concepts, then it
    is easy to forecast charity galas, tax-exemptions, and beautifully abstract mathematical
    modeling. It has led to bad consequences, from genocide fantasies brought to rich
    donors up to cases of workplace self-harm and murder. As one can imagine, apocalyptic
