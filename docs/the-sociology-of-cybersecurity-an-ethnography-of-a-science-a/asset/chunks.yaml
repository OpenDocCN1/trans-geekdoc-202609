- raw: 'While I have only proximal familiarity with psychological and therapeutic
    interventions, I wish to put forward a hypothesis: stress and burnout among cybersecurity
    professionals is two-pronged. The first element relates to self-attachment to
    the social and material practices of infrastructure; they experience stress because
    they personally feel that they are breaching the social norm. The second element
    relates to a sense of self related to their work, so this may be a semi-conscious
    connection between doing security, maintenance or care work and feeling smart,
    capable or careful. While this  62. hypothesis was not verified for cybersecurity
    defence, maintenance and research professionals, the evidence from burnout studies
    for doctors, nurses and other health and biochemical researchers that have contact
    with patients suggests that occupational burnouts often differentiate even in
    similar institutions ([Messias et al., 2019](#bibliography.xhtml#_24044-2003_chp005_ref101)).
    This digression is already too long to discuss the issue of burnout in scientific
    careers in length, but I wish to add that in the field of physics (much more coherent
    and better understood as compared to cybersecurity!), the trajectories and burnouts
    as seen through longitudinal studies in previous generations also differentiate,
    more due to emotional workload than to initial conditions ([Hermanowicz, 2009](#bibliography.xhtml#_24044-2003_chp005_ref70)).


    Why was this psychological digression important? Because even if my hypothesis
    is not necessarily true for a significant group size, the psychological mechanisms
    of attachment and transverse between the self and the infrastructure provide interpretations
    on why debates on stabilised instabilities often take the form of public performatives.


    Conceptualising stabilised instabilities as performatives, I indirectly refer
    to a concept by Bruce Schneier, a renowned cryptologist and cybersecurity expert.
    Schneier coined a phrase “security theatre” ([Schneier, 2009](#bibliography.xhtml#_24044-2003_chp005_ref142))
    to describe actions that are performed to instil the sense of security among the
    public, but they do not actively improve it. Security theatre in this way was
    performed to improve trust or respect to authorities or to make them appear as
    if they are acting.


    This is, however, not sufficient for my understanding. Stabilised instability
    does not have to be publicly understood or even publicly known to make changes
    in infrastructures. Yet, the public, at least the global Anglosphere and some
    of its translations into other languages, is still fascinated by the hacker, as
    a socio-cultural prefiguration of the wise-mage. This is self-reflection, as drawn
    by cybersecurity researchers who theorise about their cultural representations
    ([Adams et al., 2020](#bibliography.xhtml#_24044-2003_chp005_ref3)). One can ironise
    about representation or about culture theory all day long, but the sociological
    questions persists: Why are security professionals understood through those archetypes
    by the public, and what consequences does it have for the public understanding
    of stabilised instabilities, as a particular subtype of public understanding of
    science? The social fact does not stop mattering as a question of research only
    because it is silly.


    The first clue was shown by Steven Shapin and Simon Schaffer in the 1980s as they
    examined the history of public experiments with vacuum pumps as conducted by Robert
    Boyle in the 17th century ([Shapin & Schaffer, 1985](#bibliography.xhtml#_24044-2003_chp005_ref134)).
    Contrary to the version given in popular histories of physics, empirical evidence
    and experiments were painfully slow in changing scientific consensus. Boyle’s
    experiments were always a step behind theoretical critiques developed by Thomas
    Hobbes, acclaimed as author of the political treatise *Leviathan* and a statesperson.
    As Shapin and Schaffer have shown, what was crucial for Boyle’s success was how
    he enmeshed experimental and epistemological practices into socio-political ones.
    Not only did Boyle perfect experiments  63. with vacuum pumps into experimental
    theatres with large audiences, but he also donated his instruments to prestigious
    research institutions and taught how the demonstrations can be replicated by others.
    Finally, this educational influence was still later standardised and kept in quality
    with Boyle’s insistence on detailed reporting, precision in illustration and honest
    reporting of mistakes and failures. While those principles should not be surprising
    to many people working in research or academic publishing, keeping them in mind
    is important as the problem of public understanding of cybersecurity science grows
    in complexity.


    What I want to emphasise by bringing up Shapin and Schaffer in comparison with
    stabilised instability is not just the similarity in general principles of accountability
    and rigour between different experimental sciences. No, Boyle’s case matters more
    for cybersecurity for a few other reasons. Firstly, in my understanding, stabilised
    instabilities are the social equivalents of demonstrations in experimental theatres.
    They are often the “news of the day”: gossiped among workplaces but limited in
    exact understanding. They contribute to anxiety or temporary political decisions,
    but only rarely seeing equivalents of full public understanding and public closure.


    As an example, consider the case of the use of Pegasus, an offensive cybersecurity
    tool that was purchased by various states (including Poland, Israel, Mexico, Indonesia
    and others) and used to wiretap political opponents and legal protests ([Richard
    & Rigaud, 2024](#bibliography.xhtml#_24044-2003_chp005_ref133)). Pegasus was revealed
    by the effort of an investigative journalism collective, Forbidden Stories, and
    security laboratory, Citizen Lab ([Marczak et al., 2018](#bibliography.xhtml#_24044-2003_chp005_ref96)).
    Pegasus operated exactly on the principle described in the definition of stabilised
    instability: nation-states bought publicly unknown vulnerabilities in digital
    infrastructures and “fired them” at targeted opponents. Because vulnerabilities
    were not known (zero-days, as discussed in previous chapter), the victims of the
    surveillance did not know about it. The companies that provided mobile services
    and the cell phone manufacturers did not know. After journalists and researchers
    released their materials, the European Union Parliament ordered an inquiry ([Mildebrath,
    2022](#bibliography.xhtml#_24044-2003_chp005_ref105)) followed by an inquiry committee
    in the upper house of the Polish Parliament. The latter finished its proceedings
    in 2023 (Komisja Nadzwyczajna ds. Inwigilacji, 2023). However, the lower house
    is still proceeding with its own committee as of 2025. So to sum up: even in the
    case of a well-documented use of stabilised instabilities against political opponents
    in such a nominally democratic country as Poland, with a membership in the European
    Union and NATO (with all their flaws and caveats), it has been seven years since
    the publication of an otherwise replicated and uncontested security research paper
    (2018) and three years since a successful inquiry of EU’s Parliament (2022), yet
    the general public is still without closure either from a joint parliamentary
    report or court trials.'
