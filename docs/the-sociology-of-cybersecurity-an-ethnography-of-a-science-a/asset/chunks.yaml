- raw: "Adapting Mills’ concept, I understand a power elite in the context of cybersecurity\
    \ science as a set of social relations interlinking three major power roles: military\
    \ (including intelligence and state-level law enforcement), political executive\
    \ and business ([Mills & Wolfe, 2000](#bibliography.xhtml#_24044-2003_chp005_ref100)).\
    \ The roles in those domains are held on a temporary basis, and members often\
    \ are not aware of being a part of the elite. What is shared is the educational\
    \ biographies and informal social clubs (here comes the importance of clubhouse\
    \ mechanisms as discussed in a section on discrimination in the next chapter).\n\
    \nKnowledge has a multitude of meanings within the power elite. Firstly, a shared\
    \ educational background often catalyses entry but often is not enough. Secondly,\
    \ the elites use knowledge to obfuscate, gate-keep and lead astray pretenders,\
    \ for example, with systems of worthless certifications, indecisive review boards\
    \ and unclearly defined standards of excellence. Such standards waste time and\
    \ effort of the newcomers, while insiders often are instructed in their families\
    \ on how to circumnavigate or ignore them. Thirdly, knowledge is often used to\
    \ justify stalling the need for changes, as any bureaucratic decision can be supported\
    \ by the need for further research on the topic (academic sociology is often called\
    \ as compliant in this role). Finally, knowledge, when it becomes standardised\
    \ and replicated in the form of science, is crucial for expanding and retaining\
    \ political, business and military power. Thus, knowledge is always useful in\
    \ three institutional domains of power although the uses are not always epistemic\
    \ or scientific in nature.\n\nWhat changed from the times of Mills is the role\
    \ of academia, both as a nesting point for the elite and as a site of one among\
    \ many contestations. As I write this book, consulting companies significantly\
    \ have replaced academic institutions as legitimisers and assurance providers\
    \ for bureaucracy, especially as public funding for research institutions was\
    \ reduced and cycles of revolving doors between academia, consultancy, NGO sector\
    \ and politics approaches the sociological equivalent of Moore’s Law.^()\n\nMills\
    \ critique of power structure in the US during the Cold War is applicable twofold.\
    \ First: it was brought up when crucial actors for the military, state and business\
    \ were forming at the dawn of the Cold War. Digital moguls and venture capitalists\
    \ from 2025 may tell stories of digital homesteading during the 1990s, but Malcolm\
    \ Harris has shown that military, politics of eugenics  67. and capital concentrated\
    \ around Palo Alto long before moguls, digital regents or villains of our time\
    \ ([Harris, 2023](#bibliography.xhtml#_24044-2003_chp005_ref66)). Second: Mills\
    \ explicitly emphasised that the power elite is not a conscious conspiracy, but\
    \ an outcome of concentration of power and authority within a limited group. Such\
    \ a group may be internally incoherent and pose competition for itself for most\
    \ of the time, but what brings it into agreement is the notion of actual public\
    \ oversight or control.\n\n 68. This is why Mills’ description fits so well to\
    \ so many cases of high echelons of cybersecurity military-business-state. The\
    \ United States of America is a useful illustration, as its sheer scale necessitates\
    \ standardisation on a scale that produces enough paperwork to make its power\
    \ elite recognizable, but the same concept can be applied for any other sub-selection.\
    \ Similarly, Mills was read and successfully adapted in Polish sociology for describing\
    \ power elites among military-party-industry management elites with the correction\
    \ for oversight from Moscow during the period when Poland was a satellite for\
    \ the USSR. This is not to say that society or protests do not have an agency:\
    \ those are completely different questions, and Mills’ theory has strongly characterised\
    \ social systems as open and dynamic.\n\nWhile issues of change, queer and protest\
    \ will be discussed in the next chapter, I wish to focus on the relation between\
    \ cybersecurity and risk. For the period covered by this book, the risk turned\
    \ out to be financial, due to growth of ransom attacks in the form of ransomware.\
    \ In response, insurance companies started to sell cyber-insurance, as a financial\
    \ mechanism of distribution of such risk.\n\nOnly after this long introduction\
    \ do the puzzles find their places. Insurance against ransomware forced at least\
    \ some sort of standardisation and codification of cybersecurity. Insurance operators\
    \ need standardisation to compare, adjust and estimate the risks. The connection\
    \ between cybersecurity science and cybersecurity insurance is completely under-discussed\
    \ in the academic debate (on the side of social sciences), so the best I can offer,\
    \ with my limited resources, is an excerpt from an interview with a professional\
    \ in this niche.\n\nInterview Fragment 4.1. As cybersecurity becomes a vital part\
    \ of financial securitization^() \n\nIn the cited fragment the role of standards\
    \ is clear. Documentation and standards serve not as exciting and experimental\
    \ but as checklists to be validated and baselines to be kept before proceeding\
    \ further. This is the reverse side of science that is often overlooked: the science\
    \ of “what is good enough to be a common practice”. The science of “what can be\
