    # 3 “中间者”。网络安全中的夺旗赛。复制。劳动。收编。


    DOI: [10.4324/9781003396871-4](https://doi.org/10.4324/9781003396871-4)本章已在 CC-BY-NC-ND
    4.0 许可下提供。


    人类和非人类的生存变得依赖于基础设施。随着社会生活在这些依赖中变得更加纠缠，科学技术研究的大部分领域发展起来以应对理解的需求（Bowker & Star,
    2008；Star, 1990, 1999）。虽然大众理解往往将基础设施的理解局限于仅由物质对象组成的系统，但这种方法提出了一种不同的视角，一种更贴近社会科学视角的视角。


    基础设施是通过关于物质网络与人类实践共同体之间关系、其知识以及在历史中的嵌入性的对话来理解的（Star & Ruhleder, 1996，第 133 页）。与基础设施相关的理论和方法已与哲学中的认知研究（Bateson,
    2000）和人类学（Hutchins, 1996）进行过讨论。也许正是这种谱系导致基础设施在 STS 中被理论化，并且不可分割地与理解围绕物质网络组织的社区的照料、维护和抗议实践联系在一起。相比之下，分析这些社区中实践的社会认识论往往认为网络的物质性是显而易见的、被授予的或（社会上）不可见的。


    是否存在任何反提案或批评？关于“基础设施转向”的最新辩论（Hesmondhalgh, 2021）揭示了一些未解决的问题。例如，批评往往强调 IT 过分强调社会研究，而不审视权力关系的基础性物质条件（Sandvig,
    2013）。其次，一种批评倾向指出辩论中缺乏对基础设施更广泛政治经济的兴趣（Hesmondhalgh, 2021，第 13 页）。这一问题源于基础设施的规模，因为过度关注细枝末节导致失去了基础设施带来的“规模效应”。


    我希望利用数字基础设施的民族志研究数据参与对 STS 的理论讨论。基础设施理论和数字基础设施的细节都可能很复杂。本章对隐私想象（Rommetveit & van
    Dijk, 2022）不太感兴趣，而是研究此类想象的模糊骨干。我不太感兴趣提供单一安全错误作为基础设施例外情况的案例研究。CTFs 41. 往往逃避直接的制度分类，但尽管如此，它们形成了与数字基础设施并存的可重复模式。


    由于我有兴趣利用实地工作讨论理论，我提出我的理论工具箱以及每个概念的作用。在第一部分，我回到对 IT 的批评（Hesmondhalgh, 2021；Sandvig,
    2013）和理论综合（Lee & Schmidt, 2018）。这缩小了对基础设施的理解并指出了一些令人不安的问题。讨论也让我能够定位我的提案并提供一些工作概念。在第二部分，我概述了来自*资本主义的新精神*的批评和收编理论的基础（Boltanski
    & Chiapello, 2007）。这作为一种初级的政治经济学是有用的，但也作为与关于黑客、数字基础设施和安全的其他研究之间的联系。在第三部分，我介绍 CTF
    黑客锦标赛的基本概念，展示它们与互联网的政治和经济大亨的联系。在第四部分，我展示 CTF 如何分层不同等级的黑客。最后，我讨论基础设施异常的详细复制及其理论细节。


    ## 收编与基础设施


    收编的概念由 Boltanski and Chiapello (2007) 在其著作*资本主义的新精神*中提出。它描述了一个永无止境的过程，通过这一过程资本主义通过其批评得以更新。Boltanski
    和 Chiapello 用收编来解释 1968 年法国起义后批评的捕获。后来，它被扩展到黑客和数字资本主义的研究（Söderberg & Delfanti,
    2015）。


    根据 Boltanski and Chiapello (2007)，网络几何在塑造二战后法国对资本主义批评的愿景中起着关键作用。早期世代将工作场所视为等级制度并在福特主义生产模式下组织。战后管理者受军事和信息技术影响，因此他们强调扁平、网络化的结构。在流行神话中，网络化结构比等级制度更能抵御攻击。随着韧性而来的是个人表达的更多自由以及个人主动性和成长的更多空间。类似的论点改变了艺术和社会批评出现的流行心态。


    “收编”这一概念描述了资本主义捕获其批评以重振资本主义的生产精神并重塑新的积累和剥削制度的条件。在这种意义上，资本主义的历史就是批评和收编的历史。


    我的提案偏离了 Boltanski 和 Chiapello。不是关注“精神”并寻求动态的原因，我问：当批评和收编在数字基础设施的规模上作为中介运作时会发生什么？这对思想共同体的认识论有什么后果？

