- raw: "It would be misleading and scientifically dishonest not to mention the immense\
    \ contribution of anti-colonial, black and feminist studies of  3. computing,\
    \ labour, feminist scholarship and others. Among them, I relied on Caitlin [Rosenthal’s\
    \ (2019)](#bibliography.xhtml#_24044-2003_chp005_ref136) original research and\
    \ Meredith [Whittaker’s (2023)](#bibliography.xhtml#_24044-2003_chp005_ref174)\
    \ summary on the origins of Charles Babbage’s architecture that came from the\
    \ plantations of the East India Company. Similarly, I took much both from hacking\
    \ studies by Biella [Coleman (2013)](#bibliography.xhtml#_24044-2003_chp005_ref33)\
    \ and from feminist studies of cybersecurity by [Christina Dunbar-Hester (2019](#bibliography.xhtml#_24044-2003_chp005_ref45))\
    \ and [Amanda Levendowski (2022](#bibliography.xhtml#_24044-2003_chp005_ref92))\
    \ as well as cybersecurity post-colonial studies in international relations by\
    \ Anwar [Mhajne and Alexis Henshaw (2025)](#bibliography.xhtml#_24044-2003_chp005_ref102).\n\
    \n[Chapter 1](#ch01.xhtml#_24044-2003_ch001) starts with vignettes of work. Hackerspaces\
    \ in Eastern Europe from 2010 were not the only places for invoking hacking culture\
    \ or for gathering new sub-strata of IT contractors, but they were also the frontiers\
    \ of gentrification and communities that functioned as communal cybersecurity\
    \ laboratories. It shows how labour, social mechanisms of cybersecurity learning\
    \ and hybridisation of the work of administrators and developers established the\
    \ background of the seismic shift of General Data Protection Regulation (GDPR)\
    \ in the European Union. [Chapter 1](#ch01.xhtml#_24044-2003_ch001) serves as\
    \ introduction to my method and some theoretical concepts as well as examples\
    \ of interplay between everyday maintenance and the glamour of cybersecurity.\
    \ While I did not have enough space to discuss it at length, significant parts\
    \ of this chapter were built in discussions with Winnifred [Poster (2026)](#bibliography.xhtml#_24044-2003_chp005_ref126)\
    \ and the Labour Tech community. This allowed me to partially validate many findings\
    \ beyond the context of Europe, for example, for IT subcontractors from India\
    \ or Brazil.\n\n[Chapter 2](#ch02.xhtml#_24044-2003_ch002) builds on the previous\
    \ one, as it describes the sociological model of the cybersecurity laboratory\
    \ and the concept of a thought collective, modifying the term coined by Ludwik\
    \ Fleck. A laboratory is the workplace, and a thought collective is the intellectual\
    \ milieu. Between them, knowledge and/or science happen. The basic sociological\
