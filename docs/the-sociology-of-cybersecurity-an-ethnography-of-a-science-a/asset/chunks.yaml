  trans: '

    如果 CVE 是为网络安全专家提供的标准化，那么 JSR-10–102 可以被视为科学理论应用的练习。如果 CVE 是弗吉尼亚效应以及网络安全应急团队的日常实践，那么
    JSR-10–102 就是关于认识论或理想的争论。JSR-10–102 并非由理论家撰写，而是由具有行业实践的学术研究人员以及来自军事研究机构、具有企业经验的代表撰写。同样，CVE
    具有复杂的信息本体，因此将其视为“仅仅是实际应用”将是一个严重的错误。


    75. JSR-10–102 以及 CVE 或 CVSS 并不是系统化网络安全的首次尝试。这不是我的主张。本书不是知识考古学，也不是历史研究，而是一段特定时期的研究。为了清晰起见，我也不会详细讨论构成
    JSR-10–102 的所有简报，即使它们在观点上有所不同。此类比较分析的很大一部分早已在哲学领域 (Spring 等, 2017) 或该领域本身 (Herley
    与 Van Oorschot, 2017) 中完成。


    关于 JASON 报告的争论在科学哲学和技术哲学中得以延续，尤其体现在 Spring 及合著者的论文中；他们将 JASON 的论述简化为“共同语言问题”，从而在他们关于网络安全作为一门科学的马赛克统一性模型中遗漏了重要部分。Spring
    及合著者正确地将马赛克统一性的哲学概念转化为众多交易区的人类学模型 (Galison, 2010)。更进一步追溯对该概念的实证研究，彼得·加利森有一项关于物理学家、工程师和电子研究人员围绕实验、仪器和理论互动的工作
    (Galison, 1997)。这不是学术吹毛求疵的问题，相信我。实验、仪器和理论之间的划分对加利森的解释至关重要，因为这些对象中的每一个都至少允许交易区暂时稳定。稳定并非指稳定的不稳定，而是指传记、社会和认识论意义上的稳定：手册的连续性、职业的连续性、资金的连续性。当一种理论被证伪或精确仪器失效时，实验室仍然依赖于它仍然足够共享实验细节的理解，以便与紧密的马赛克共享，但又足够独特而仍然不可或缺。仪器、理论和实验是边界对象
    (Star 与 Griesemer, 1989)，它们促进了交易区之间的翻译。社会-认识论马赛克以边界对象作为微小颗粒，既促进了实验室和子群体之间的交流，也允许在认识论不连续的时刻实现稳定。


    对哲学家来说，这可能看起来像是社会科学中的琐碎细节或令人作呕的记账。把 JASON 列举的共同概念、共同标准和其他事物简单概括为“共同语言”实在太容易了。但这正是追溯苏珊·莱格·斯塔及其合著者的人类学工作为何重要且如此实用的原因
    (Star 与 Griesemer, 1989)。边界对象在马赛克统一性中之所以普遍，并不是因为每个人都赋予它们相似且不变的意义。不，边界对象，如理论、实验和仪器之所以普遍，是因为它们处于群体社会互动之间。它们允许在马赛克在其他地方变得难以忍受作为一种职业时，维持实验室的稳定，或职业的稳定，或项目的稳定。彼得·加利森公开引用了这一点，并将注意力集中在这些问题上
    (Galison, 1997)。


    在我看来，CVE、CVSS 和 MITRE 框架正是这些，“边界对象”，稳定的不稳定。它们不是共同语言，如果这需要普遍理解的话，但它们 76. 对于马赛克内部的局部理解的规模来说足够普遍。所需要的只是局部稳定，只是为了实验室，为了项目，直到孩子长大。这种稳定本身足以推进实验和假设的证伪，这甚至符合逻辑实证主义标准。


    JASON 围绕复杂的认识论模型展开思考。他们将网络安全不仅与物理学、数学或密码学进行比较，还认识到攻击-防御反馈回路模型同样适用于流行病学、免疫学和农业科学。这些比较得出的基本结论是安全会随时间推移而退化。同样重要的是，JASON
    已经推测了自动证明以及使用虚拟机作为沙箱在隔离环境中运行可疑软件。这可以很容易地与认识到台式手套箱或集成到台面上的隔离室的重要性相比较：看似仅仅是后勤上的转换，却在实践中导致革命。


    私下里我可能是无神论者、马克思主义者、批判社会学家，但我来自波兰。这就是为什么如果我没有在 JSR-10–102 中发现不止一个，而是两个魔鬼，我就不会是我自己，正如它通常所知，


    当我阅读 JASON 的报告时，我认出了彼得·加利森的名字。我讨论了他的工作与网络安全作为一门科学的相关性，并在攻读博士期间阅读了他的作品。我有些惊讶的是，加利森向
    JASON 和 MITRE 提供的简报并非基于我所知的任何社会学或历史理论，而是至少在片段上是一种控制论的政治神学。简报的正式标题是“奥古斯丁与摩尼教科学”，它是对加利森关于诺伯特·维纳研究的引用
    (Galison, 1994)。神学隐喻被用来说明一种不可解决的、但在认知上富有成果的认识论二分法。因此，我对它感兴趣，并不是为了回答 JASON 简报现场的任何人是否相信魔鬼，而是为了探究它为网络安全辩论带来的政治和社会联想。


    这一神学二元性的细节稍后会解释，但在那之前，我想解释为什么我认为它们在 2025 年可能具有重要意义。在其他论文中，网络安全也承认了对手的认识论存在。这个对手是如何被想象的，作为一个认识论人物，以及从什么传统的来源
    the of the targets，一个战斗系统及其飞行员有效地作为单一对手。试图理解反馈回路的这一要素，维纳回到了基督教神学，以区分作为此类对手形象的魔鬼。77.
    在摩尼教宗教中，后来被基督教视为异端的魔鬼，是一个理性的对手。摩尼教魔鬼试图智取、欺骗并隐藏其意图。相比之下，根据圣奥古斯丁的说法，魔鬼是无序、熵和混沌。虽然摩尼教魔鬼可以并且会改变其战术，但奥古斯丁魔鬼无法以随机之外的方式改变。

