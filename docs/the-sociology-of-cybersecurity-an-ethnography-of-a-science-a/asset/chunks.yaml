    It would be misleading and scientifically dishonest not to mention the immense
    contribution of anti-colonial, black and feminist studies of  3. computing, labour,
    feminist scholarship and others. Among them, I relied on Caitlin [Rosenthal’s
    (2019)](#bibliography.xhtml#_24044-2003_chp005_ref136) original research and Meredith
    [Whittaker’s (2023)](#bibliography.xhtml#_24044-2003_chp005_ref174) summary on
    the origins of Charles Babbage’s architecture that came from the plantations of
    the East India Company. Similarly, I took much both from hacking studies by Biella
    [Coleman (2013)](#bibliography.xhtml#_24044-2003_chp005_ref33) and from feminist
    studies of cybersecurity by [Christina Dunbar-Hester (2019](#bibliography.xhtml#_24044-2003_chp005_ref45))
    and [Amanda Levendowski (2022](#bibliography.xhtml#_24044-2003_chp005_ref92))
    as well as cybersecurity post-colonial studies in international relations by Anwar
    [Mhajne and Alexis Henshaw (2025)](#bibliography.xhtml#_24044-2003_chp005_ref102).


    [Chapter 1](#ch01.xhtml#_24044-2003_ch001) starts with vignettes of work. Hackerspaces
    in Eastern Europe from 2010 were not the only places for invoking hacking culture
    or for gathering new sub-strata of IT contractors, but they were also the frontiers
    of gentrification and communities that functioned as communal cybersecurity laboratories.
    It shows how labour, social mechanisms of cybersecurity learning and hybridisation
    of the work of administrators and developers established the background of the
    seismic shift of General Data Protection Regulation (GDPR) in the European Union.
    [Chapter 1](#ch01.xhtml#_24044-2003_ch001) serves as introduction to my method
    and some theoretical concepts as well as examples of interplay between everyday
    maintenance and the glamour of cybersecurity. While I did not have enough space
    to discuss it at length, significant parts of this chapter were built in discussions
    with Winnifred [Poster (2026)](#bibliography.xhtml#_24044-2003_chp005_ref126)
    and the Labour Tech community. This allowed me to partially validate many findings
    beyond the context of Europe, for example, for IT subcontractors from India or
    Brazil.


    [Chapter 2](#ch02.xhtml#_24044-2003_ch002) builds on the previous one, as it describes
    the sociological model of the cybersecurity laboratory and the concept of a thought
    collective, modifying the term coined by Ludwik Fleck. A laboratory is the workplace,
    and a thought collective is the intellectual milieu. Between them, knowledge and/or
    science happen. The basic sociological premise of [Chapter 2](#ch02.xhtml#_24044-2003_ch002)
    is simple: the cybersecurity laboratory is the sociological group-space that has
    the power to abstract, to create what I will later define as “stabilised instabilities”.
    While all scientific laboratories in general do this, cybersecurity laboratories
    do this on the digital infrastructure, so, in a way, they are nested one layer
    of abstraction further. This is why cybersecurity laboratories are second-order
    laboratories: they are laboratories of laboratories, as they make abstractions,
    rules and “stabilised instabilities”, functioning with things that other laboratories
    and, broadly speaking, digital infrastructures in general made replicable, stable
    or reliable, at least as a rule of thumb.


    As a particular example in [Chapter 3](#ch03.xhtml#_24044-2003_ch003), I describe
    how playing Capture the Flag (CTF) tournaments is a constitutive labour for thought
    collectives, serving as a mechanism for social inclusion, prestige and knowledge
    replication. Such social mechanisms not only are captured, in ways similar to
    those described by Barbrook and Cameron, but also held as useful institutional
    interspaces that catalyse exchanges and reduce costs of training. Thus, [Chapter
    3](#ch03.xhtml#_24044-2003_ch003) is the study of recuperation, or the recapture
    of critique and culture for making it into unpaid labour. As far as I know, this
    is the first ethnography of science in CTF that has been published to date.


    4. If [Chapter 3](#ch03.xhtml#_24044-2003_ch003) shows cybersecurity cognition
    in the wild, or in an informal setting, then [Chapter 4](#ch04.xhtml#_24044-2003_ch004)
    focuses on the epistemology of cybersecurity as a science. I start with theorising
    “stabilised instability” in order to discuss cybersecurity systematics, such as
    Common Vulnerabilities and Exposures (CVE), and their application in the military,
    insurance and research fields. I also outline a premise for a different cybersecurity
    science that I call “cybersecurity for the people”. As far as I know, this is
    the first attempt to theorise cybersecurity systematics as connected with nation-state
    interests, epistemology and labour.


    In [Chapter 5](#ch05.xhtml#_24044-2003_ch005), I investigate exclusion from cybersecurity
    education, and I add theorisation on the issue of queer hacktivism and its potential
    capture by nation-states. Finally, I note the potential of feminist cyberlaw and
    its connections to modern, progressive, universal and scientific cybersecurity
    for the people.


    I do not believe that I have found the satisfactory answers for questions I have
    asked in the beginning. I believe, though, that I asked those questions in an
    interesting way. If there is one theoretical conclusion that I wish to offer,
    then it may be this one: both cybersecurity and sociology are inherently interested
    in the delicate balance of the norm and the exceptions, as well as their justifications,
    protections and the precious value of both exceptions and standards.


    As far as I can understand, key contributions of this book include: (1) the theorisation
    of cybersecurity laboratories as second-order laboratories; (2) conducting and
    interpreting the ethnographic study of Capture the Flag tournaments as replication
    of cybersecurity knowledge; (3) conceptualisation and examples of discovery in
    cybersecurity, understood both as epistemic and a social mechanism, which provides
    a baseline for public understanding of cybersecurity; (4) recognising that after
    2020, critical computing and AI studies have to include theorisation on cybersecurity
    and its systematics; and (5) connecting cybersecurity systematics with theorising
    on the philosophy of cybersecurity, sociology of hacking, studies of Capture the
    Flag and debates on digital infrastructures.


    After all this labour, I still study cybersecurity with a mixture of curiosity,
    hope, fear and disgust, not dissimilar to the approach I have to sociology and
    science in general. To paraphrase what Zygmunt Bauman wrote to sociologists ([1988](#bibliography.xhtml#_24044-2003_chp005_ref11)):
    for better or worse, sharing the ideals of modernity as in all academic fields,
    cybersecurity for the people should aim for reason-led improvement of the human
    condition. It should aim to increase the volume of human autonomy but not the
    kind of autonomy that, in absence of solidarity, results in loneliness. Conversely,
    to increase the volume of human solidarity, but not the kind of solidarity that,
    in absence of autonomy, results in oppression. It should also show how humans,
    governments and organisations create digital infrastructures, making humans more
    aware, rational and involved in decision-making concerning infrastructures. Similarly,
    cybersecurity for the  5. people must show communities how large groups can maintain
    and develop digital infrastructures to organise new forms of common knowledge,
    communications, ecology, care, joy, love, privacy, trust and various other dimensions
    of human life.

