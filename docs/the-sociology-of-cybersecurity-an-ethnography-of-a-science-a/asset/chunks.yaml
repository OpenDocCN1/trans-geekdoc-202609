    \ consent and had an opportunity to access raw data on them and to inspect my\
    \ anonymisation routines in my previous publications (Zaród, 2016, [2018](#bibliography.xhtml#_24044-2003_chp005_ref181),\
    \ [2022](#bibliography.xhtml#_24044-2003_chp005_ref183); [Kostyszak et al., 2015](#bibliography.xhtml#_24044-2003_chp005_ref184)).\
    \ If some examples described in the book lack technical data, it is to preserve\
    \ the anonymity of participants in a small field. The only person responsible\
    \ for technological inaccuracies is the author, as sometimes data was inaudible\
    \ or inscrutable without putting participants at greater risk.\n\nThis research\
    \ protocol was based on what I consider “best standards” of ethics in sociology,\
    \ as described in ethical procedures from Polish, British, US and international\
    \ sociological organisations (PTS, BSA, ASA, ESA, ISA), deliberately choosing\
    \ to gather less ethnographical data and to opt for maintaining more privacy for\
    \ the interviewees.\n\nWith the ethical and methodological choices I made, I had\
    \ far less access to organised laboratories than my colleagues researching other\
    \ disciplines. Quantitative studies of the field are challenging since the publication\
    \ structure is based much more on a nebula of Twitter posts, conferences, press\
    \ releases and informal channels than on journal papers. The equivalents of Nobel\
    \  8. Prizes are harder to point out and are not as widely recognised. Making\
    \ matters worse, it is widely assumed that military intelligence agencies are\
    \ large institutional nodes, in terms of sheer recruitment, research and sponsorship.\
    \ I focused on this topic in [Chapter 4](#ch04.xhtml#_24044-2003_ch004), but it\
    \ is only the tip of the iceberg.\n\nThis book, while often critical of cybersecurity\
    \ science developed in the service of the military or institutions of surveillance\
    \ capitalism, is as much a critique as it is a sociological attempt to propose\
    \ some tools to interviewees and other cybersecurity researchers that perhaps\
    \ may be useful for shaping their professional and scientific field. In this sense,\
    \ this book is written between traditions of John Bernal, Lila Abu-Lughod, Olga\
    \ Amsterdamska, Joseph Needham, Hilary Koprowski, Ludwik Fleck, Antonina Kłoskowska,\
    \ Nadera Shalhoub-Kevorkian and many other scholars. Cybersecurity should become\
    \ science for the people, science done by the people and science accountable to\
    \ the people. This book aims to contribute to this goal. The definition of “people”\
    \ is not limited to “cybersecurity researchers” or “citizens of the Global North”,\
    \ for details, read Bernal.\n\nThis is also why I deliberately refuse self-colonisation.\
    \ This is not a book about “cute exotic case-study cybersecurity from Central-Eastern\
    \ Europe”; although, for many English-native researchers, such a book would be\
    \ much easier to grasp and, perhaps, much more citable. No, cybersecurity is a\
    \ global field, so I will research it as so. If Poles, Americans, Ukrainians,\
    \ Germans, Swedes, Romanians, Czechs, Koreans, Brazilians or Palestinians of all\
    \ genders and fur colours,^()\n\nAlso, to make myself absolutely clear, there\
    \ were more than enough researchers or hackers from the Global North who gave\
    \ me interviews or helped by explaining standards. There were more than enough\
    \ researchers who helped me, not out of frustration, but out of honesty. A majority\
    \ of them would not agree with my left-leaning perspective, but they shared my\
    \ sympathy to dive deep and talk openly about it.\n\nI am thankful for the time\
    \ and labour of people who agreed to be observed and to give interviews or unrecorded\
    \ talk. I am grateful to people who provided consultations and spent time to agree\
    \ on disagreements with me. Ultimately, I take responsibility for this book and\
    \ this research.\n\n## Note\n\n1.  Hacktivism and cybersecurity normalised “fursonas”,\
    \ welcoming and normalising online identities of various “furry” groups and humans.\
    \ This will become theoretically relevant in Chapter 6 for discussion of subversive\
    \ practices. [Return to text.⏎](#ch00.xhtml#R_24044-2003_Intro001_en001)\n\n 9.\
    \ \n\n# 1 “Kaleidoscope.”Maintenance. Infrastructures. Abstractions.\n\nDOI: [10.4324/9781003396871-2](https://doi.org/10.4324/9781003396871-2)The\
    \ chapter has been made avaliable under a CC-BY-NC-ND 4.0 license.\n\nTo understand\
    \ processes at the scale of the field, I would like to start with its margins.\
    \ To understand what happens behind the confidence of non-disclosure agreements\
    \ on the global scale, this chapter investigates communities of programming and\
    \ computer administration subcontractors in Europe.\n\nThe methodological trick\
    \ here may be as old as labour research. If workplaces are barred by non-disclosure\
    \ agreements, go look for social spaces where groups interact after work. Do they\
    \ have social clubs, DIY groups, conferences, prizes and other prestige events?\
    \ As I was absolutely honest about my goals, the majority of interviewees immediately\
    \ recognised that the difference between sociology and social attacks in cybersecurity\
    \ lie in justification, ethics and social legitimation but not in method. Like\
    \ a red team (the attacking side) investigating the weakness of a social system,\
    \ I looked for subcontractors. As the field is rich in multi-faceted irony, cybersecurity\
    \ researchers referred to my academic peers not as “professors” but as “generals”.\n\
    \nGenerals, field report. There is only techno. For newcomers, it might sound\
    \ like Slavic folk-themed, gopnik, techno, hard-bass whatever. For connoisseurs,\
    \ it is immediately recognisable as a classic remix of a musical theme from an\
    \ old computer game, Tetris.^()\n\nThe purpose of obnoxious beats is the same\
    \ as the purpose of archaic conference posters, stacks of books or whiteboards\
    \ full of equations in laboratories: to demarcate. Not only to socially exclude\
    \ but to demarcate as it is understood in philosophy of science, that is, to establish\
    \ a separate, safe mind-space for those who are included in the field. To lower\
    \ the cost of cognitive failure by proximity of the trade and to help to maintain\
    \ the focus.\n\nWhat is the relation between the vibes described in the previous\
    \ paragraph and the goals of this book? First, in places like those described,\
    \ one can meet cybersecurity freelancers that work in security teams of various\
    \ digital  10. corporations. While freelancers often “grow up” out of their hackerspace,\
    \ they often hop in when they visit the city or when they look collaborators for\
    \ either complex or private projects. The mechanism here is very similar to the\
    \ “homel lab”, the group when one does their master’s or PhD thesis. One may move\
    \ out of it, specialise into a different field or fall into a conflict, but those\
    \ are the nodes of the network.\n\nThe key methodological issue was patience.\
    \ Instead of asking about vulnerabilities, scandals and illegal stuff, I was able\
    \ to learn much more when I took an interest in reverse engineering or figuring\
    \ out how things work from having physical access to the object, in areas such\
    \ as obsolete computing systems or old telecommunication equipment.\n\nOnly after\
    \ gaining trust was I invited to more closed-door meetings and conferences. Eventually,\
    \ as I helped with my knowledge as a sociologist, science communicator and organiser,\
    \ I was invited to a workshop on the European Union’s General Data Protection\
    \ Regulation."
