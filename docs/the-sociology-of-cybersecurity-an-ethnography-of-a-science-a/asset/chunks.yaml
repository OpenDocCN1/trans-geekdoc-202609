    instabilities. My goal is still to understand the process that happens 70. between
    the formalisation of cybersecurity knowledge and its execution as a form of power
    into a standard. Unlike NIST CSF discussed in the previous section, this time
    I am interested in standards for gathering knowledge about vulnerabilities (read:
    stabilised instabilities), systems of threat scoring and methodologies of estimating
    cyberattacks.


    In practice, those standards in cybersecurity industry are understood as Common
    Vulnerabilities and Exposures (CVE), Common Vulnerabilities Scoring Systems (CVSS)
    and MITRE Adversarial Tactics, Techniques and Common Knowledge (ATT&CK) Framework.
    All three are organised into separate but interconnected databases, managed by
    MITRE. MITRE is a not-for-profit hybrid institution that oscillates between a
    think tank, a company, an NGO and a government bureau, which specialises in commissioning
    state resources into research on signals, cybersecurity, communications and similar
    defence-adjacent topics. This hedging as not-for-profit but non-government, but
    responsible for managing federal research funds, makes MITRE a perfect illustration
    of Mills’ warnings.


    MITRE is responsible for managing of some research project. This is why it is
    hard to interpret MITRE as anything else but a perfect lynchpin or an interface
    for translations between military, commercial and state power.


    MITRE seems to avoid open competition with NIST when it can, so initiatives like
    CVE, CVSS and MITRE ATT&CK were developed in compatibility with NIST CSF and other
    standards discussed in previous section. The difference is symbolic: NIST is formally
    and administratively connected with the US government, while MITRE has some deniability.
    This deniability may be enough for simplest public scrutiny or friendliest of
    diplomats, but sometimes, even this is enough.


    I do not wish to claim that I am discovering and breaking new ground in my field,
    even if cybersecurity often touches issues of power and secrecy. No, those are
    publicly known facts.


    I am doing exactly what other stubborn sociologists of infrastructure did: I sniff
    for the standards, and I read them. I will be unable to understand the majority
    of technical information, but I will grasp enough of the institutional and social
    context to read more and ask for explanations in interviews.


    Harry Collins did so with the gravity wave physics ([Collins, 2017](#bibliography.xhtml#_24044-2003_chp005_ref33)),
    adding some interviews. Collins, in cooperation with Robert Evans, calls this
    social context “interactional expertise” ([Collins & Evans, 2009](#bibliography.xhtml#_24044-2003_chp005_ref37)):
    what can you learn from a social group through being among it, without having
    actual scientific expertise. It is exactly the contextual knowledge, the “canteen
    napkin” knowledge. If a sociologist has hostile intent, exactly the same knowledge
    is often enough to facilitate cybersecurity breaches in the form of social attacks,
    when the attacker poses as “an employee who lost their badge” or as “lunch delivery
    for Alice”.


    CVE, CVSS and MITRE ATT&CK are great litmus tests for such interactional expertise.
    They are perfect examples of second-hand knowledge, usable repacking of cybersecurity
    knowledge in forms understandable by managers, 71. policymakers and other members
    of the power elite without technical background. Of course, all three categories
    are equally perfect for selling IT marketing word-salad to newcomers, but this
    is exactly the moment when science blends into managerial jargon.


    Here is an example: CVE^()


    But the CVE serves as more than a shared point of reference. A common set of coordinates
    makes it easier to make comparisons through time and through genealogy of vulnerabilities.
    Through careful documentation of mechanisms, the attack described above was compared
    with earlier attacks on Ukrainian hospitals and health infrastructure. In result,
    the feedback loop of learning was based not only on systematics, as shown in paper,
    but on authorship and identification of the adversary ([Machalewski et al., 2024](#bibliography.xhtml#_24044-2003_chp005_ref87)).

