    However trivial such processes may sound, I recommend just paging through the
    history of post-war particle physics, exactly at the moment when physicists had
    to learn how to work with electrical and electronic engineers to make better particle
    detectors ([Galison, 1997](#bibliography.xhtml#_24044-2003_chp005_ref52)). You
    will immediately notice that collaboration in the laboratory is fragile and far
    from obvious.


    Would it be a big surprise if I were to tell you that CERN has a hackerspace and
    that engineers taking care of circuits in the supercollider almost annually give
    talks at a hacking convention in Europe?


    ## Global Causes, Local Dynamics


    As digital markets grew ([Śledziewska & Włoch, 2021](#bibliography.xhtml#_24044-2003_chp005_ref148)),
    the need for cheap IT labour grew with them. New EU countries provided a useful
    outsourcing backbone, first for Germany and the UK, later for the rest of the
    EU and the USA.


    Poland, Slovakia, Czechia and Hungary had cheaper but educated workforces with
    reasonable knowledge of English thanks to pre- EU educational programmes. These
    workforces were also mostly free of significant educational debt, as higher education
    was highly subsidised by the state. This last factor was easy to overlook but
    proved to be key for the growth of the sector.


    A SysOps engineer may be responsible for the maintenance of servers in Germany
    when working from Czechia, Hungary or Poland. Without a significant time difference,
    they could work during rush hours without harm to their biological rhythm and
    without disrupting the organisational rhythm of the company. At the same time,
    their salary will be 10% to 30% lower. In the case of a critical failure, the
    workforce is easy to mobilise. Transport from a hub in Czechia to Berlin or Munich
    (German IT hubs) is a matter of two to five hours by car, bus or plane.


    16. Such a workforce, while more expensive than Indian or Brazilian programmers,
    was also easier to process with regard to tax, employment and life situation issues.
    This is why any understanding of European hacking without understanding EU and
    Schengen Area dynamics is incomplete.


    What started with outsourced software testing and administrative labour grew into
    computer security expertise. This is why familiarity with different software communities
    contributes to understanding the sociological structure of knowledge in computer
    security. There are few standardised education paths in this specialisation, so
    a major source of recruitment is from within the field. University courses on
    computer science or electronics rarely cover contemporary security architectures
    or penetration testing.


    Why does it matter? Simply speaking, if communities provide soil for the growth
    of experiments, then outsourcing provided soil for the growth of communities.
    Later, communities took the form of hackerspaces and specialised as security companies,
    small academic research laboratories or government security research groups. I
    will return to the differences and specifics in this ecosystem in [Chapter 2](#ch02.xhtml#_24044-2003_ch002),
    where I will discuss the simultaneous discovery of a very intricate hardware vulnerability.


    The ecosystem as a whole had one more soil cultivation mechanism that worked along
    with outsourcing and the EU’s open internal borders. In 2022, the public may have
    forgotten about its roots, but I cannot. In 2015, when I was moving between different
    communities in the region, there were two universal topics: American computer
    intelligence surveillance and EU privacy/digital market reforms. They may have
    become old news, but they had an impact on politicising hackers. They also changed
    the structure of computer security professions.


    ## Evolution of a Privacy Law


    Chelsea Manning in 2010 revealed messages between American diplomatic institutions.
    The messages suggested that American intelligence was routinely wiretapping UN
    and other foreign officials. The content of Manning’s leaks and public reaction
    to it were primarily focused on military crimes in Afghanistan and Iraq, but,
    diplomatically, it likely raised institutional suspicions in the EU.


    In 2013, Edward Snowden disclosed cables showing that the NSA routinely surveils
    EU parliaments, officials and citizens ([Greenwald, 2014](#bibliography.xhtml#_24044-2003_chp005_ref57)).^()


    In hackerspaces of Central Europe, morbid irony was the common reaction. The absolute
    majority of respondents knew and assumed from the beginning 17. that civilian
    or military intelligence agencies might surveil their communities, as they surveil
    European governments. They knew about the NSA, and they assumed that my study
    might be part of an intelligence gathering operation. In one of the communities,
    they adopted a custom. When I was saying my goodbyes, they would reply, “Goodbye,
    and our regards to the Colonel”. I passed their best wishes to my PhD thesis supervisor
    (a civilian sociologist and an officer in the Polish army reserves). It seemed
    that even hackers from the former Soviet bloc had little hope about the protection
    of individual rights in Western democracies.


    After the Manning and Snowden leaks, privacy law reforms in the EU gained new
    traction with the Data Protection Directive (95/46/EC). They were already different
    from those in the US, but the leaks brought more attention to the issue. In 2016,
    the EU introduced the binding General Data Protection Regulation for all digital
    companies operating in the European market.


    As the EU remains a significant consumer market as well as a source of outsourcing
    and a partner in tax evasion for global companies, other regions followed with
    similar regulations to ensure stability of terms of trade.


    But the history of EU law will not give you the full picture. For the hacker-activists
    I interviewed in 2013 and 2014, both the leaks and the EU institutional response
    were not abstract, distant echoes of alien signals sent by stuffy bureaucrats.
    They happened viscerally during a series of the biggest and most noted hacking
    conventions in Europe during the studied period. They caused splits in communities
    and shaped new alliances. I followed hacking communities as they attended Chaos
    Communication Congress (C3) from 2014 to 2019.


    Chaos Communication Congress is so important ([Kubitschko, 2015](#bibliography.xhtml#_24044-2003_chp005_ref84))
    that I will return to it later to discuss it as a scientific meeting. At the moment,
    I wish to focus on its impact on communities and outsourcing and how it shaped
    computer security as a business.


    In short, following the hacking community brought me to a European hacking congress.
    Shadowing just one member of this community brought me into a workshop that connected
    EU law with the hacking community in new, unexpected ways. The vibe shift is easiest
    to grasp when you look at Congress mottos. In 2012, it was “Not My Department”;
    in 2014, “A New Dawn”; in 2015, “Gated Communities”. The 2013 leaks made so large
    an impact that Congress did not adopt any official motto – for the first and only
    time in its history.


    Certainly not all participants and not every hacker in Europe agreed with this
    politicisation, but every hackerspace I visited from 2013 to 2015 (about 15 of
    them) was discussing something related to leaks, privacy and surveillance. The
    mood at the Congress was similar to the mood in the communities, especially in
    those more political, more anarchistic or more interested in computer security.
    I personally believe that the leaks convinced some people to participate in my
    study.


    18. Before I explain relations between EU institutions, I want to say a few words
    about my research during the Congress. Among many other underground currents after
    the leaks, it was the Congress that acted as a trading ground between various
    EU institutions and hackers.


    ## This Is a Proper Anarchist Conference. We Have Minutes.

