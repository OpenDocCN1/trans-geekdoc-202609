    A third recognition comes from the fact that queer, alternative, resistant and
    many other perspectives that challenge the power elites are constantly growing.
    Czochralski process residues, human and otherwise, are created in every semiconductor
    factory, during every break of maintenance crew and in every line in infrastructures.
    With every victim, every unemployed, every victim of surveillance, some knowledge
    of stabilised instabilities gets disseminated.


    There is no other field of knowledge that knows better than cybersecurity that
    there is no way to show that a system is completely safe. In epistemology, there
    is no certain way of knowing if one is right, because the problem of induction
    or experiments’ regress will bite back, one way or another. In Christian theology,
    interaction with this doubt was called a “dark night of the soul”, and through
    the ages, it was associated with all sorts of religious mysticism, direct epistemic
    connection and even erotic, subliminal sensation.


    In a lab, it is called Tuesday.


    91.


