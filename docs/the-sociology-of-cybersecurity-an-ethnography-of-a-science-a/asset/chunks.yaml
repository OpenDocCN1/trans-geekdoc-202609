  trans: '

    与其解释它们，请自行进行质性数据的解释实验。回到片段 1.1 并寻找 Star 等人所预测的基础设施特征。基础设施在崩溃之前很难被观察到；它会以小幅增量增长，只有极少数情况下才会大规模扩展，并且作为社区成员身份的一部分而被学习。它体现于标准中，也体现于用户和操作者的身体中。它也嵌入在无数其他社会协议和技术中。它总是高度本地化，却总是超越单一地点。


    需要注意的一点是，黑客空间在其自身的基础设施上工作，其方式类似于分形、衔尾蛇或任何深深投入关怀的社会群体。另一点是，黑客空间将基础设施视为不断被扭曲的，开放于修改，也开放于解释。这种不稳定性使得实验更容易进行，甚至在外部基础设施和网络上，如
    Speck 和 Fidel 的案例所示。


    这是我的另一个诀窍。有时，当你看不到黑客行为，或难以审视其动态时，逆转社会视角，思考确保可靠基础设施所需的关怀。专注于理解是什么让平凡得以实现，以便看到不可能或不寻常的事物。它既是百年来的民族志直觉，也是该领域的常识。如果忽视日常基础设施，研究黑客行为似乎很困难。这就是为什么通往计算机安全的道路同时如此隐晦又如此简单。我采访的专家中很大一部分，或许除了学术密码学家之外，都是前开发者、前测试员或前管理员。他们通过维护基础设施成为成员。`SysOps`、`DevOps`、黑客和安全研究人员之间存在持续的流动。


    维护研究是 STS 中一个已经很小的细分领域中的一个小子部分（Henke & Sims, 2020）。除 Star 外，它源于对同步辐射技术人员与科学家之间差异的理解（Doing,
    2009）、办公空间与打印机技术人员（Orr, 1996）以及工厂车间与工会行动历史（Noble, 2011）的理解，以及对人类（Mol, 2002）和非人类（Haraway,
    2006）行动者的关怀。


    不出所料，随着我的研究进行，Speck 和 Fidel 开始在安全领域接活，在全球与一些实力强劲的团队合作。所以，在一切之前。


    我将在第 4 章中再次讨论 `zero-days`，因为它们是理解计算机安全知识的关键认识论对象。但即使这个快速的 glimpse 也可能导向一个不错的科学社会学悖论。`zero-day`
    等同于科学发现，因为传播它需要先进的知识和信任。与此同时，根据定义，它依赖于不被公众所知。你可能希望在目标上测试你的 `zero-day`，以检查它是否仍然有效，但每次测试都会增加被识别并对漏洞进行修补的可能性。因此，`zero-days`
    与秘密武器一样具有惊讶因素，但不一定具有威慑属性。即使它们不属于计算机犯罪或计算机战，`zero-days` 作为知识对象仍然令人困惑。


    这就是为什么我一直觉得科学哲学不能脱离社会实践。几个月后，我将更多地了解 `exploits`，并尝试将它们与科学事实、其复制机制和政治进行比较。


    哲学沉思在休息时发泄情绪很好，但我必须回到民族志研究。有些人用当地语言交谈；其他人是外国人，在城市里没有太多可以闲逛的地方。讨论和开发的内容五花八门。有些人从事看似简单、具有欺骗性的课外高中项目。其他人讨论银行高级开发/运维方面的问题。有时我自愿选择不去听，以免他们违反保密协议的风险。


    这就是黑客社区典型夜晚的样子。对路人来说，看起来就像人们只是在闲逛。但如果你自己在那里待一会儿，你会注意到实验或关于科学论文的讨论。晦涩的科学讨论与一晚喝啤酒的闲逛之间没有实际区别。也无法分辨维护何时结束、黑客想法何时开始。“Aha
    moments”并不经常发生，因此旁人很容易错过。重要的是，围绕维护形成的社区提供了足够的原因让聚会发生。这是实验生长的土壤，或硅土。


    实验的结果不需要惊人或值得在大型黑客大会上讨论。它们可能涉及防止本地数据泄露，甚至是终端用户不会察觉的轻微基础设施错误。它们可能是平凡的，不太可能被历史学家记录下来。然而，对我而言，它们标志着关于机器和社会关系的有趣事实。机器可以在随意对话中被黑客攻击，不一定出于恶意、声誉或财务原因，而是为了测试想法或作为更大项目的一个阶段。


    这意味着黑客攻击的基础设施不仅包括防止外界（执法部门或其他人）发现你的尝试的方式，还包括拥有足够的人在足够私密的情况下讨论新论文。这意味着拥有备用服务器进行“quick
    and dirty”测试。这意味着拥有足够的时间和其他资源来工作，而无需立即得到结果。这意味着拥有失败和学习的地方。当我列举这些事情时，它们可能看起来对从事科学，特别是任何类型的创造性事业来说是显而易见的。注意我们是如何远离单打独斗的黑客，仅通过在线方式社交。他们变得更加交织、更不普遍，更加依赖于社区的分工。

    '
