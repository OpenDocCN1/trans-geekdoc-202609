    \ Queer Cybersecurity. Feminist Cyberlaw. Reflections.\n\nDOI: [10.4324/9781003396871-6](https://doi.org/10.4324/9781003396871-6)The\
    \ chapter has been made avaliable under a CC-BY-NC-ND 4.0 license.\n\nThroughout\
    \ the book, I discussed groups in cybersecurity on different scales of geography,\
    \ formality and institutionalisation. Geography impacts cybersecurity not only\
