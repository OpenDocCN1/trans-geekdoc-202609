    Where events are quoted or described in detail, the participants gave sustained
    consent and had an opportunity to access raw data on them and to inspect my anonymisation
    routines in my previous publications (Zaród, 2016, [2018](#bibliography.xhtml#_24044-2003_chp005_ref181),
    [2022](#bibliography.xhtml#_24044-2003_chp005_ref183); [Kostyszak et al., 2015](#bibliography.xhtml#_24044-2003_chp005_ref184)).
    If some examples described in the book lack technical data, it is to preserve
    the anonymity of participants in a small field. The only person responsible for
    technological inaccuracies is the author, as sometimes data was inaudible or inscrutable
    without putting participants at greater risk.


    This research protocol was based on what I consider “best standards” of ethics
    in sociology, as described in ethical procedures from Polish, British, US and
    international sociological organisations (PTS, BSA, ASA, ESA, ISA), deliberately
    choosing to gather less ethnographical data and to opt for maintaining more privacy
    for the interviewees.


    With the ethical and methodological choices I made, I had far less access to organised
    laboratories than my colleagues researching other disciplines. Quantitative studies
    of the field are challenging since the publication structure is based much more
    on a nebula of Twitter posts, conferences, press releases and informal channels
    than on journal papers. The equivalents of Nobel  8. Prizes are harder to point
    out and are not as widely recognised. Making matters worse, it is widely assumed
    that military intelligence agencies are large institutional nodes, in terms of
    sheer recruitment, research and sponsorship. I focused on this topic in [Chapter
    4](#ch04.xhtml#_24044-2003_chp004), but it is only the tip of the iceberg.


    This book, while often critical of cybersecurity science developed in the service
    of the military or institutions of surveillance capitalism, is as much a critique
    as it is a sociological attempt to propose some tools to interviewees and other
    cybersecurity researchers that perhaps may be useful for shaping their professional
    and scientific field. In this sense, this book is written between traditions of
    John Bernal, Lila Abu-Lughod, Olga Amsterdamska, Joseph Needham, Hilary Koprowski,
    Ludwik Fleck, Antonina Kłoskowska, Nadera Shalhoub-Kevorkian and many other scholars.
    Cybersecurity should become science for the people, science done by the people
    and science accountable to the people. This book aims to contribute to this goal.
    The definition of “people” is not limited to “cybersecurity researchers” or “citizens
    of the Global North”, for details, read Bernal.


    This is also why I deliberately refuse self-colonisation. This is not a book about
    “cute exotic case-study cybersecurity from Central-Eastern Europe”; although,
    for many English-native researchers, such a book would be much easier to grasp
    and, perhaps, much more citable. No, cybersecurity is a global field, so I will
    research it as so. If Poles, Americans, Ukrainians, Germans, Swedes, Romanians,
    Czechs, Koreans, Brazilians or Palestinians of all genders and fur colours,^()


    Also, to make myself absolutely clear, there were more than enough researchers
    or hackers from the Global North who gave me interviews or helped by explaining
    standards. There were more than enough researchers who helped me, not out of frustration,
    but out of honesty. A majority of them would not agree with my left-leaning perspective,
    but they shared my sympathy to dive deep and talk openly about it.


    I am thankful for the time and labour of people who agreed to be observed and
    to give interviews or unrecorded talk. I am grateful to people who provided consultations
    and spent time to agree on disagreements with me. Ultimately, I take responsibility
    for this book and this research.


