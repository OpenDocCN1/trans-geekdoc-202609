    # Introduction


    DOI: [10.4324/9781003396871-1](https://doi.org/10.4324/9781003396871-1)The chapter
    has been made avaliable under a CC-BY-NC-ND 4.0 license.

    How does computer security make knowledge? Is this knowledge a science? How have
    processes of formalisation of knowledge into science changed from 2013 to 2025?
    How is the shaping of this science interplayed with the changes in the profession
    and in the situations of workers, victims and clients? What institutions push
    for the science of cybersecurity? What is the politics of the science of cybersecurity?
    What is the relation between hacking culture and the politics of cybersecurity?
    If cybersecurity has some elements of practice that may be regarded scientific,
    then what are the equivalents of experiments, demarcation criteria, replication
    mechanisms and other philosophical and sociological issues known from studies
    in other disciplines? What is kept hidden from the public, and how can public
    understanding of cybersecurity be imagined? Finally, can or should cybersecurity
    become a science for the people?

    Such questions may not have answers, and even if they did, this book may not provide
    them. However, this book would not have happened without an incessant curiosity
    that pulled me to those questions. While I situate my research as a sociological
    ethnography of the science and the profession of cybersecurity, the goal was not
    a vivid description of any particular community but a broad picture of the field
    at the scale that goes beyond any company, nation-state or cybersecurity specialisation.
    As with any model, the final result is both wrong and useful.

    Wrong because it necessarily simplifies and reduces into the global pattern many
    subtypes that simultaneously exist while also neglecting some local counterexamples,
    resistance-practices and exemptions. This is why this book is wrong, as any generalisation
    has to be. Hopefully, it may also be useful because, by bringing together contexts
    from adjacent fields, thinking on wider scales may happen. After all, my work
    was also born because “someone was wrong on the Internetz”.

    This leads me to the ethical and epistemological paradox of this book. As a sociologist
    of science, I am doubly aware that natural, technical, biological and social sciences
    were active participants in the modernist, imperial project. The very ambition
    to propose a synthesis over what is otherwise a complex and heterogeneous social
    reality of regions, groups that I have, at best, fragmentary understanding of,
    may be easily seen as a simple attempt to continue this project. Being aware of
    this risk, I propose my answers to the questions stated before as sociological
    concepts relevant on the global scale, at least for English-speaking or NATO-influenced
    countries.

    As a sociologist, I have but one answer. Work. Work is neither the only political
    component of cybersecurity, nor is wage labour the only form of work, but without
    factoring in the issue of work or labour, I firmly believe that any understanding
    of cybersecurity is incomplete. Consider three cases. Firstly, a cybersecurity
    study of the evolution of attacks on the infrastructure of hospitals in Ukraine
    and Europe after 2017. Secondly, the evolution of privacy for activists, medics
    and maintainers of infrastructure who work in Palestine, Eritrea or Kashmir. Thirdly,
    the development of automated, artificial intelligence–based systems that try to
    appraise the companies that develop cybersecurity products against the groups
    in the previously mentioned two cases.

    If there is one conclusion of my book, it is this: only by recognising work that
    goes in cybersecurity, which, in turn, goes for and against enabling, maintaining,
    enclosing or destroying knowledge that goes with work of other people, can one
    even begin thinking about science, knowledge, power or work in any social science
    in the digital era.

    The book’s title came as a result of this understanding. The ethnography is a
    method, but not the goal. The science of cybersecurity was and still is “in the
    making”, instead of something made and demarcated. Cybersecurity science is easier
    to understand through negotiations over systematics, generalisations, comparisons
    and interpolations. However, those processes of systematisation, institutionalisation
    and underwriting of risks go together with processes of professionalisation, certification
    and appropriation of unpaid labour. The nebulous, hidden and mosaic character
    of cybersecurity science is in dialectical interplay with more and more overt
    dimensions of the profession. Hence the title: “a” science, but “the” profession.

    This is why my understanding of cybersecurity as a science and as a profession
    is heavily influenced by the Marxist tradition and its recent resurgence. [Johan
    Söderberg and Maxigas (2022](#bibliography.xhtml#_24044-2003_chp005_ref141)) have
    shown how companies capture free labour without paying for it, illustrating how
    hacking’s commitment to autonomous infrastructures turns the critique of digital
    capitalism into a mechanism of accumulation. Söderberg and Maxigas have shown
    dialectics of hacking while also showing that the concept of the “Californian
    Ideology”, as described by Richard Barbrook and Andy Cameron in 1996, is still
    relevant. [Matteo Pasquinelli (2023](#bibliography.xhtml#_24044-2003_chp005_ref123))
    not only theorised and evidenced algorithmics embedded in surveillance, imitation
    and violence on the workers and citizens but also has shown how algorithms gatekeep
    and extract the knowledge that circulates in social groups.

