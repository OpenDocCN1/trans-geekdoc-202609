- raw: "So, there cannot be any other example for my understanding of the thought\
    \ collective than the “big one”: the set of security vulnerabilities known jointly\
    \ as Spectre and Meltdown. As with many other examples in this chapter, what could\
    \ easily have been separate books will be only simplifications invoked for the\
    \ argument. I am almost surprised that no other philosopher or sociologist of\
    \ cybersecurity tried to engage intellectually with it, but as the saying goes:\
    \ “there cannot be elephant in the room that would be too big to be framed out\
    \ of conversation happening in the same room”.^()\n\n 37. The overview of vulnerabilities\
    \ is given by a popular paper by [Abu-Ghazaleh et al. (2019](#bibliography.xhtml#_24044-2003_chp005_ref2)),\
    \ while a technical reconstruction can be found in works of [Prout et al. (2018](#bibliography.xhtml#_24044-2003_chp005_ref120)).\
    \ The scale is so immense because what later became known as the Spectre and Meltdown\
    \ families of vulnerabilities affected vast numbers of systems. In simple terms,\
    \ the computing processors that propelled the rise of commercial computing for\
    \ a decade or two were so fast because, in optimising the stacking of incoming\
    \ instructions, they simplified and predicted. However, by eavesdropping and interfering\
    \ with the order of such predictions, a third party may have gained access to\
    \ nigh-all results of the processing operations. In a metaphor that is hopelessly\
    \ nonexpert, Spectre and Meltdown were something similar to listening live to\
    \ a person’s mind by careful manipulation of oxidation balance between the neurons\
    \ at the scale of the entire brain. By manipulation on the very edge between forecasting,\
    \ erasure and logistics of billions of commands, in spaces where digital bits\
    \ and command lines in assembly language became electrical states in semiconductors,\
    \ the vulnerability could be exploited.\n\nWhat was fascinating for me as a sociologist\
    \ was not the scale of the revealed vulnerability nor the discoveries of whole\
    \ new families of vulnerabilities. No, for a sociologist, what was absolutely\
    \ breathtaking was the fact that the papers came from research groups of completely\
    \ different sociological origins. Wham! Google Security Lab. Wham! University\
    \ Lab. Wham! A small cybersecurity company. Wham! A collaboration between freelancers\
    \ and some of the authors of the previously mentioned papers.\n\nThat was multiple\
    \ discovery, as known from the history or philosophy of science, or when several\
    \ researchers in the field working on separate but interconnected problems find\
    \ solutions concurring to each other. For a sociologist, this is exciting because\
    \ it shows that a given scientific group achieved such level of interconnections\
    \ and coherence that groups of different origins came to the same conclusions.\
    \ What Kuhn tried to explain by zeitgeist or Gestalt in the case of calculus or\
    \ Einstein, I understood as a sign of coherence, cognitive reinforcement through\
    \ digital and physical collaborations and a sign that sociological abstractions\
    \ are still worth investigating. In a span of few years (from 2016 to 2019), the\
    \ understanding of commercial processors changed, and what I would argue, the\
    \ understanding of our world changed with it.\n\nBy conceptualising the thought\
    \ collective, I wish not to diminish the authorship of any person or a team that\
    \ contributed. I am aware that the Spectre and Meltdown discovery comes back to\
    \ papers as old as 1995. What I wish to convey is that getting to this level of\
    \ research sophistication and documenting the scale and complexity of this vulnerability\
    \ required not only the thought styles of geniuses but also the complexity, coherence\
    \ and development of the thought collective. Because without the latter, it may\
    \ have taken years to find connections between discoveries. Yet, in 2025, the\
    \ scale, consequences or basics of mechanisms of Spectre and Meltdown, complex\
    \ as they may be, are within the perception of a sociologist.\n\n 38. Of course,\
    \ the questions about the scale, knowledge and lack of production control should\
    \ be asked if a vulnerability of similar scale was found in mechanical engineering\
    \ anywhere else. Most likely, they will not be asked publicly. But at least, there\
    \ is knowledge.\n\n## Summary. What Makes Political Economy of Knowledge in Cybersecurity?\n\
    \nThrough this chapter, I discussed three concepts that are helpful for understanding\
    \ cybersecurity. The “laboratory” helps with understanding everyday collaborations\
    \ and cognitive actions. The “profession” describes public recognition, public\
    \ trust and the degree of autonomy recognised by legal and state institutions.\
    \ The “thought collective” allows for discussing modalities such as interactions\
    \ between an inner circle of researchers and an outer circle of practitioners\
    \ and communicators. I am not the author of those concepts, but my contribution\
    \ lies in recognising their usability and verification in the context of cybersecurity.\n\
    \nSociology rarely has spectacular findings. To see Spectre / Meltdown as a sign\
    \ of coherence of the field and to interpret them through the Fleckian concept\
    \ may appear trivial when the interpretation is presented. Similarly, it may appear\
    \ both obvious and inconsequential when insurance against ransomware or malfunctioning\
    \ locomotives are interpreted as incentives in the development of professional\
    \ jurisdiction.\n\nI believe that sociological conceptualisations have practical\
    \ implications. For example, without the notion of the laboratory, I would not\
    \ be able to understand CTF tournaments as equivalents of the replication of experiments,\
    \ nor would it be easy to discuss cases of sexism and racism in cybersecurity\
    \ as compared to similar violence in science in Chapter 6. If one takes the concept\
    \ of laboratory as proposed before, one may ask: what kind of mistakes are met\
    \ with laudation, which are kept hidden and which are pushed into matters of personal\
    \ shame of junior collaborators in the given group? How about the Matilda effect?\
    \ How about social mechanisms underlying researcher burnout: personal identification\
    \ with their research, peer pressure of the public image of a high-achieving field\
    \ and many others?\n\nFor me, the most interesting implications of the proposed\
    \ conceptualisations lie in the questions of political economy. Following a long\
    \ tradition back to Karl Marx, I believe that technology is an applied, material\
    \ projection of knowledge on labour. After Matteo Pasquianelli (2023), I understand\
    \ digital algorithms as shaping and emerging from their datasets rather than taking\
    \ algorithms as finite, well-defined procedures. In this sense, algorithms, as\
    \ any technologies in history, shape the world by the same opportunity of application.\
