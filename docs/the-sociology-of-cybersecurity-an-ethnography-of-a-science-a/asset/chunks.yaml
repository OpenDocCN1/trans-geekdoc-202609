- raw: 'I will not reconstruct the technical and legal aspects of this case. Firstly,
    because court proceedings have not yet finished, and, secondly, because a separate
    paper is being prepared. Rather, what is important in the context of our discussion
    of profession is the following: by bypassing security mechanisms of brakes, engines
    and other parts of industrial automation; locomotive navigation systems; and its
    main bus (an element of the digital architecture for transferring information),
    the researchers – allegedly – found out that locomotives that failed were distinct
    by having code fragments that told them to “brick” (stone-cold disengage after
    a stop) in very certain places, after specific travelled distances or under various
    other conditions. This was the allegedly missing link: not the final material
    effects, which varied, but the malicious lines allegedly embedded into deep layers
    of the locomotive systems coding.


    As researchers delivered results of their inquiry to the yard, the locomotive’s
    manufacturer reacted with a counter-claim, accusing that it was, in fact, the
    researchers who planted the malfunctioning elements. According to the producer,
    their interest was clear. Because ZNTK was unable to fulfil the contract for servicing
    the trains on time, it was necessary to rely on conspiracy theories and plant
    some evidence for them.


    The whole saga of Impulses is long also because it had a sequel in civic lawsuits,
    parliamentary hearings and the involvement of NATO’s and Poland’s intelligence
    services. Researchers also made a public lecture on the legal counteractions and
    the emotional toil that it took on them ([Kowalczyk et al., 2025](#bibliography.xhtml#_24044-2003_chp005_ref83)).


    In the middle of all this complexity, two things captured my attention. The research
    team, from the beginning, established evidence protocols akin to ones used when
    other sciences are called to serve the bench (see [Albright et al., 2023](#bibliography.xhtml#_24044-2003_chp005_ref5)
    for discussion of history and tragedies in the United States of America, which
    exports surveillance and cybersecurity software to other nation-states). The researchers
    carefully maintained the documentation and kept track of the separation between
    what was the original system and original data obtained from the locomotives and
    what was the samples and data used for experimentation.


    Imagine the toil. Granted, you and your mates may be cybersecurity researchers,
    but you know each other predominately from what is essentially  33. an e-sport.
    Now you have to do bookkeeping in parallel with all the fun, engaging and intellectually
    satisfying riddles. Without documenting what was the component of the locomotives
    and what was set up to conduct the reverse engineering, tests and security bypassing,
    the results may turn out worthless. I cannot see it as anything other than the
    equivalent of experimental and reference samples. This is cybersecurity science
    in the making.


    This is also what is at stake in this case. If the civil suits were successful,
    the researchers would be understood as hackers. Their research would be deemed
    an intrusion, and there would be no separation between the object of study and
    the particularity of their method. In other words, if laboratories had to deal
    with demarcations in knowledge as done through cybersecurity and understood within
    cybersecurity, then the profession is about the autonomy (and hegemony!) of the
    field’s conclusions in legal, state and other institutional systems. Freedoms
    to establish bar associations, ethical codes, state exams or university curriculums
    are consequences and epiphenomena but not the causes.


    This is also why this case convinced me to state the hypothesis on the formation
    of the cybersecurity profession. Because the Parliament, the intelligence services,
    the courts seems to have accepted the evidence as presented by Redford, q3k and
    MrTic, this acceptation serves as a benchmark and an example of social proof of
    “good enough science” in cybersecurity in a public eye. In other words, powerful
    state actors in broad daylight attested that the evidence procedure for distinguishing
    between “what was prior” and “what was used in research” is good enough. As manuscript
    of this book is submitted, researchers have not been found liable in any civil
    suits. Cybersecurity was allowed to conduct its own research in Poland, and the
    European Union seems to recognise it as within the “right to repair” and within
    the public interest. What was jarring was the polarisation between some of the
    press discourse and the professional responses (Atack 2023; Q3K 2024). Researchers
    faced a press campaign that followed the lawsuits, while the professional discourse
    was nigh uniform in support for them. I believe that what was at stake was the
    recognition that sometimes it is within the public interest to maintain the freedom
    of research in the realms of technology.


    Andrew Abbott reconstructed that professions emerge because they successfully
    convince public that it is in its best interest to give away some power to the
    experts, who have specialised knowledge. That was, of course, more of a narrative
    justification than cause because details of power are very rarely so clean. However,
    Abbott also recognised that as a consequence of such justification, professions
    develop ethics and methods of in-group regulation.


    Of course, the history of the 20th century shows that medicine, law and accounting
    committed more than their fair share of crimes against fellow citizens. This is
    one of the reasons why it is understood that insight of the professionals is necessary
    but not sufficient to monitor their field. This is also why my conceptualisation
    of a cybersecurity profession is a way of recognising that cybersecurity specialists
    are not only involved in spying, defending or surveilling, but they also constitute
    a next stage in what Allison Powell called “hacking in the public interest” ([Powell,
    2016](#bibliography.xhtml#_24044-2003_chp005_ref127)). When such hacks become
    so  34. sophisticated, so well-documented and so resembling scientific experiments,
    then perhaps a profession is being born. Not from its power over laypeople but
    as a form of a public service not dissimilar to the oversight performed by sciences,
    arts and media.


    My claim on professions is not based on my normative hopes. One case from Poland
    is not enough for the European Union, nor to extrapolate for the world. So, what
    are the other reasons for the concept?


    This is the second reason I use this concept. This may be my next research project,
    but I believe that the standards in cybersecurity profession are on the rise.
    My exploratory research suggests that the need arises from the rising costs and
    consequences of ransomware as well as the militarisation of digital societies
    in general. This is the difference between a cybersecurity professional and a
    layperson: insurance against ransomware for systems developed by the former is
    underwritten more cheaply than those by the latter, so the work of the former
    has to be controlled, certified and subjected to a different regime of liabilities.
    This is the aikido of securitisation: if processes of systematisation and professionalisation
    make cybersecurity more and more accountable to an appropriate sector of the insurance
    industry, then public, civic and democratic oversight mechanisms have some ways
    to follow. It is a faint hope, but it is still worth articulating.


    ## Thought Collective. Context of Scientific Knowledge.'
