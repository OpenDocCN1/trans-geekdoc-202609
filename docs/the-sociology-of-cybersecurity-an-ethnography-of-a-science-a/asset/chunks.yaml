    In the previous chapter, I presented how hacking communities conduct experiments
    on shared infrastructure. Such experimentation allowed them to participate as
    “silent experts” in the development of European Union legislation, through informal
    delegations of EU Parliament aides to squats and hacking conferences. Of course,
    hackerspaces are not the only communities that bring together cybersecurity researchers,
    nor are they the only groups that are sought for their expertise. In [Chapter
    4](#ch04.xhtml#_24044-2003_ch004), I will discuss the case of Citizen Lab and
    of its uncovering the use of the Pegasus surveillance system against political
    opponents in Poland and in other countries of the EU.


    In order to develop a conceptual framework that goes beyond a list of case studies,
    I need to do some sociological DIY in terms of theory. By this, I mean explaining
    sources, adaptations, reach and evidence for use of terms I had chosen. While
    those words may be familiar from everyday language, from science jargon or from
    introductory work in science studies, I kindly ask for some attention.


    Thought Collective. Profession. Laboratory. Those concepts may sound simple, but
    each of them was a subject of discussion in my field. I believe that there is
    scientific value in precision, delimitation, understanding and reference to prior
    research. Exactly for those reasons, I will not be rediscovering the wheel, but
    I will instead examine, modify and validate against my research. Since social
    concepts may be overwhelming, I provided an overview in [Table 2.1](#ch02.xhtml#_24044-2003_ch002_tab_001).


    ## Laboratory. The Context of Discovery.


    The laboratory is the smallest of the cybersecurity groups that I am interested
    in. It should be noted that a laboratory is not the same as authorship. A multitude
    of vulnerabilities have singular authors, but to consider their cognitive operations
    as solitary is to follow the siren’s call of classical philosophy of science:
    once again heroic narratives of singular geniuses, self-made men. Such image is
    the long shadow of romanticism or science propaganda for 25. 26. IPO investors
    (a brave self-made poet, inventor or investor), but it is not the sociology of
    science.


