- raw: 'If “laboratories” constitute the context for everyday research and “professions”
    constitute the context for evaluation of research by the public, state or legal
    system, then the “thought collective” is the most general “state of the art”.
    This is what is known to the community of generalised peers, what is deemed absurd,
    what is understood as a common threat and what would constitute an epochal breakthrough.
    This is why I insisted before that the laboratory results have to be received
    by a broader research community. The thought collective is this community.


    For some readers, this concept may seem similar to the concept of scientific paradigm
    by Thomas Kuhn (2012). This is both a helpful and a misleading association. Helpful,
    because the concept of a thought collective was proposed by [Ludwik Fleck (2008](#bibliography.xhtml#_24044-2003_chp005_ref49)),
    a Jewish-Polish epidemiologist and a philosopher of science in interwar Poland
    in 1930 ([Sady, 2023](#bibliography.xhtml#_24044-2003_chp005_ref129)). A thought
    collective, similarly to a scientific paradigm, emphasised the socialisation of
    students into the occupation by learning how to read errors, learning how to operate
    measurements and learning to occupationally disdain some data points as random
    errors while deeming others as interesting and crucial.


    A thought collective is what sociologists call “social facts”. This is to say,
    it is a useful simplification and an abstraction. I do not claim that researchers
    belong to some sort of hive mind or that they share some sort of  35. subconsciousness
    just because they share the misery of doing cases from the same textbook. This
    is exactly the difference between Kuhn and Fleck in my reading. What Thomas Kuhn
    invoked in psychology of Gestalt, I reconcile with the shared genealogy of Western
    science. My bet is that a hypothetical cross-generational study on reading a hagiography
    of Feynman would explain more normative declarations, or at least nostalgia, about
    science than any large sample studies on Gestalt forms.


    A thought style is a generalisation at the level of a very large group. An individual
    takes part in elements of this generalisation by a sub-abstraction called a thought
    style. This is the point at which my interpretation differs from the usual. I
    associate the thought style with individual humans but not with cognitive ways
    of a thought collective in general.


    In the scale of a laboratory, thought styles of individuals have many shared properties,
    such as dependence on a particular intellectual tradition or a preference for
    some tool or calibration method. In the scale of a collective, other intellectual
    traditions, tools and methodological approaches are recognised, although some
    may be more dominant than others. The difference between a laboratory and a thought
    style is the difference between direct collaboration and indirect familiarity.


    This difference also covers aspects of cognition that could be on the verge of
    consciousness: what will be seen or missed in a computer code, what memory logs
    will go unnoticed, what elements of thousands of pages of manual of hardware will
    be examined first. A non-insignificant part of a thought style is learned through
    socialisation, although often in a tacit way and in non-formalised formats ([Collins,
    2013](#bibliography.xhtml#_24044-2003_chp005_ref34)).


    What is important is the fact that a thought style is both a way of insightful
    seeing and unseeing of unnecessary noise. If one wants to examine any complex
    issue, no matter whether it is a locomotive, a maritime navigation problem or
    a forest-river ecology (harmony), one has to consider the importance of some signals
    and disregard the noise. This is how a thought style makes a difference between
    groups, as it makes different signal-to-noise ratios and different cross-sections
    through reality as seen by the lens of particular knowledge. If you can see details
    like imposed arbitrary characteristics of some choices, personal preference or
    “human touch”, you are looking closer to the thought style.


    In contrast, a thought collective is based on social familiarity. Members of your
    thought collective, or your research sub-field, may not be the members of your
    laboratory, but you consider them your colleagues. Sociologically speaking, if
    you can imagine being in their place with only a small change of circumstances,
    they will be your collective. You may not be specialising in the same sub-field
    as them, you may be working in a different sector, but at least you do not consider
    them outsiders or laypeople.


    A good example would be two hypothetical colleagues from the university. The first
    one pursued an academic career in cryptology. The second pursued a  36. career
    in a security start-up or in the military. They work in a similar field; they
    may even have some collaborations or joint publications. Their thought styles
    may slightly differ and their goals and research differ as well, but a sociological
    translation would still remain possible. They may not be able to imagine equivalences
    in detail, but the basic social illusion is good enough to hold a private conversation.
    They would differ in thought styles, but they should be a part of some thought
    collective. Not all of their professional jokes or “war stories” would land on
    one another, but at least some should be mutually intelligible.


    This also scales with solitude. Your thought collective is shared with the field,
    but a thought style is very individual. Even within the laboratory, its members
    differ in perspectives. Sometimes those result in errors, but on other occasions,
    thought styles result in discoveries. This is not to say that there are no multi-member
    experimental teams, of course, there are. This is to say that, even in most coherent
    teams, each person is looking at their part on their own.


    Even in a large team, one may feel terribly alone with one’s thought style, at
    least until some confirmations happen. Even after non-human confirmations, the
    seed of doubt is often there: Have I made some mistake? Do I have some bias? Have
    I missed something?


    Here comes the most beautiful and, perhaps, the most mischievous paradox in the
    sociology of science. While you can, at least theoretically, be solitary in your
    thought style, to confirm anything from your discovery, you need your thought
    collective. Your home lab is good for the first round of testing, but they are
    often too close to your thought style. Your close colleagues share your backgrounds,
    biases, equipment, funding, etc. You need colleagues who know what you are talking
    about but with enough difference to get a cross-perspective; otherwise, the biases
    that are associated with social closeness may get into the vat. I believe this
    makes science or technology so beautifully social and how it transcends humans,
    cultures and ages. To figure out really complex stuff, you have to triangulate
    really, really hard. It is also mischievous because it dialectically relates solitary
    depths of human cognition, their creative process and abstraction with absurdly
    complex social structures.


    This is exactly why I believe it is pointless to argue whether (techno-)scientific
    discovery is done by a singular person or by the community. As humans, we can
    decide it only after the science has settled the questions. Until then, the science
    is what happens between a thought style and a thought collective through the interface
    of a laboratory.'
