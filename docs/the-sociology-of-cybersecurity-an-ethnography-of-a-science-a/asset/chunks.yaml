  trans: '

    由于隐私法规，数据保护领域几乎一夜之间蓬勃发展。正因如此，我认为在不了解欧盟机构的情况下理解黑客社区是不完整的。这也是我认为在黑客大会中间举办政策研讨会挑战了我们对法律、科学、技术和制度实践问题的理解的原因。


    在本章中，我讨论了在中欧黑客空间进行的初级实验（如访谈 1.2 中讨论的那一个）。我讨论了影响 2013 年后计算机安全兴趣增长的因素，包括 IT 外包的兴起，以及欧盟政策的泄密和转变。我认为，与科学实验室类似，非正式研究团体如黑客空间既可作为欧洲政策的潜在资源，也可作为商业公司基础设施维护的地方性知识来源。


    是时候揭示更多谜题的要素了。围绕计算机安全的学术实验室是如何运作的？黑客社区与专业化的计算机安全是如何联系起来的？也许在了解这些问题之后，我们最终将能够弄清计算机安全实验室中的社会学机制的细节。


    ## Summary


    也许，阅读本章唤起了我民族志中的一些个人经历。与一条线性道路不同，本章以及第 21. 民族志更像是透过万花筒观看。单个碎片本身或多或少都很复杂，但真正让我着迷并促使我进入下一步的是它们的可互操作性和复杂性，这被理解为碎片之上的另一层。


    片段 1.2 关于两位黑客在黑客空间实施的“一次好黑客行为”的叙述。该黑客行为在全球范围内得到认可，并成为整个社区欢乐的来源。叙述来自一次非结构化访谈。我已隐去细节以保护匿名性，并清理了书面记录。


    这种吸引力和整体性理解正是当网络安全专家说“我有 root”时我认为他们所寻求的。这不仅意味着对系统有控制权，还意味着彻底理解它。当然，我并不声称对全球范围的网络安全系统有控制权，我对知识的主张也是有限的。考虑到这一点，我尝试
    22. 唤起这种体验，不以规模而以喜悦、发现或困惑来呈现。换句话说，通过本章民族志文本这一媒介，我试图传达网络安全专家可能被要求处理的众多主题的广度和复杂性所带来的非常具体的体验。与万花筒类似，网络安全问题以及我对网络安全的研究都将有许多不断变化的部件，随着新的动作的出现，其含义会不断改变。本章唤起了我作为个人和群体之间更广泛模式所发现的理解、困惑和吸引力的感觉。


    从感性描述转向更具分析性的结论，我希望强调几个问题。首先，值得注意的是，我描述为非正式的一些黑客空间和类似团体，并不构成该领域网络安全研究团体的多数或代表性样本。考虑到这一点，我认为此前未曾报道过黑客空间作为网络节点，在欧盟跨国层面的公民社会进程中充当专业知识的吸引者、翻译者或行动主义的中介，尤其是在《通用数据保护条例》（GDPR）的案例中。这是我论点的核心：如果就
    GDPR 而言，以及其他案例而言，像黑客空间这样的团体的专业知识被认为很重要，即使是在公开程度较低的情况下，那么我认为此类团体被认可为该领域的专业知识来源。这是一个社会学意义上的科学定义：一个公开认可并合法化的专业知识来源。简而言之，如果像黑客空间附属团体这样的团体被一些欧盟助手作为专业知识来源接触，那么我认为像黑客空间这样的团体有助于科学认可的知识的流通。


    我所说的“被认可为科学”并不意味着隶属于学术界，或被赋予与生物学、医学或历史等学科相似的声望或社会信誉，而是指作为专业知识、客观性、效率或社会或其代表与科学相关联的任何其他积极价值的来源而被接触。换句话说，这是准国家机器（欧盟本身并不是一个国家！）的合法化，但公众认可度非常低。读者不应过分强调“黑客空间”部分或“欧盟”部分，因为有大量非黑客空间团体为国家机构的专业知识做出贡献的例子。我将在后文讨论更多例子。


    第二个结论是第一个的推论：网络安全知识以及科学发现的社会基础，既来自军事或情报优势，也来自维护和分包。


    这正是将黑客空间、欧盟助手、企业安全实验室以及许多其他团体联系起来的原因，这些团体存在于被理解为网络安全科学的领域：不仅是问题、实践、铭写等等，还有将它们整合和界定到下一层的知识和权力。如果物理学痴迷于时间与物质上的无限倒退，那么网络安全的痴迷就在于构建、武器化和利用抽象之上
    23. 的抽象。这就是万花筒的情欲机制，这就是运动中的辩证法，这就是攻击者知识与防御者知识之间的联系。这就是“非理性”，或者更礼貌地说，是科学中情感或激情的部分，是在实践者之间和内部感受到的部分，并通过隐形课程、指导以及最私密的聚会来传递。这就是认知上的“刺激”，至少对于那些寻求认识论回报的研究者而言。


    如果万花筒的隐喻被过度延伸，它是否就变成了一种理论捷径？无论如何，从基础设施的概念出发，通过维护和分包中的全球劳动分工，如黑客空间等团体所揭示的那样，从而催化被跨国行为者认可的知识，我发现了这种“刺激”，即科学的情欲或辩证成分。这是对网络安全社会学的初步、简化且基础的介绍。


    ## Notes


    1. 寻找类似的音乐：DJ Rush – Tetris Russian Theme (Techno Remix) 或 Complete History of
    the Soviet Union, Arranged to the Melody of Tetris。然后循环播放四年。返回正文。⏎


    2. 在本例中，以及所有例子中，细节都被匿名化了。这是我在参与者同意时提出的一个条件。正因如此，我才能够学到我所学到的知识。这也是我对网络安全这一领域表示尊重的标志，该领域通常特别强调隐私和信任。返回正文。⏎

