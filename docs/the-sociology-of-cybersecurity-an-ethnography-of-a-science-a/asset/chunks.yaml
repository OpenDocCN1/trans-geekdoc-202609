    Yes and no. Stabilised instability has some traits of a text, or a performative
    or an inscription. It is stabilised and intersubjectively transferable, like a
    text. It is scalable, like data in physics or biology, and can be recomposed in
    diagrams, maps, schematics – cybersecurity uses those, especially in tools such
    as Ghidra or IDA for analysis of malicious software. It is understood that digital
    infrastructures move between scales of numbers in places that defy anthropogenic
    logic. This makes cybersecurity so hard to learn at the level of the individual
    and even harder to convey at the intersubjective level. This also makes particularly
    important the fact of stability: without careful documentation, without reference
    to the infrastructure, its failures and effects, the vulnerability will disappear
    and cease to be recognised. It will not exist outside the context of a personal
    meeting of two specialists, like an elaborate professional dance or the scientific
    equivalent of an artistic impression.


    Yet, stabilised instabilities are traded in black markets ([Georgoulias et al.,
    2023](#bibliography.xhtml#_24044-2003_chp005_ref59)). They are also estimated,
    forecasted and financialised into insurance assets ([Edwards et al., 2019](#bibliography.xhtml#_24044-2003_chp005_ref47))
    connected with actuarial models related to cybersecurity. Stabilised instabilities
    spread through digital infrastructures as knowledge objects, but, equally important,
    the need for them spreads as digital infrastructures expands. Finally, as I have
    shown in the previous chapter on Capture the Flag tournaments, stabilised instability
    includes matters of professional prestige, tacit knowledge and individual meaning.
    While some of those descriptions can be applied to the category of texts, not
    all texts will carry those properties in relation with the specific professional
    group or knowledge field. For this reason, I am not keen to understand stabilised
    instabilities such as texts or inscriptions, even though studies of both categories
    certainly contributed to my understanding and may certainly be valid for future
    research.


    Instead, I conceptualise stabilised instabilities as performative anti-structures,^()


    It should not be surprising that as a sociologist, I do not subscribe to such
    divisions. There is no knowledge nor science, on any significant social or institutional
    scale, without issues of social order, gender, politics, economy, sexuality and
    various other dimensions of power. I already discussed how Capture the Flags are
    examples of embedding with personal and cultural meanings, which are then recuperated
    as unpaid labour by companies and military institutions. This labour is scientific
    labour in a very specific sense, as Capture the Flags (CTFs) provide value not
    only to players by status-marking or to employers by reducing costs of training
    by gamification but to capital in general by reducing transactional costs by replicating
    knowledge in the field. This is why CTFs are sites of replication, standardisation
    and recuperation of stabilised instabilities. This is also why, in my conceptual
    framework, there is no difference between knowledge, anti-structure and socio-political
    consequences.


    Stabilised instabilities are performed, which means that they can be transferred
    as they are enacted with corresponding infrastructures. Instabilities can exist
    in a theoretical sense as abstracts, but understanding vulnerability without a
    practical example is much harder, as with viruses. This is why standardised reference
    points, like standardised weaknesses or vectors of attack, matter so much, both
    in virology and in cybersecurity.


    As a sociologist, I am interested in the social function of epistemic objects.
    If stabilised instabilities are circulated and contribute to the shaping of security
    knowledge, they also change some social relations. Some of those changes happen
    within the in-group of the cybersecurity profession or within the field of cybersecurity
    science. Others happen on the outside or at the intersection with other groups,
    on broader scales, through the mediation of digital infrastructures in government
    systems, healthcare, private lives, commercial services or activities connected
    with surveillance, policing, border demarcation and incarceration. Organising
    a private, invitation-only security event may be an example of the former, while
    announcing a new cybersecurity awareness campaign may be a sign of the latter.


    What matters is the fact that stabilised instabilities often restructure digital
    infrastructures at scale (this is how I defined them, and this is how the profession
    defines them, as I will show later in this chapter). As I discussed in [Chapter
    1](#ch01.xhtml#_24044-2003_ch001), for a sociologist of science, infrastructures,
    including digital ones, are not simply instances of locally accessible interface
    points like computers connected to the Internet. They are neither reducible to
    abstract maps nor even standardisation systems ([Lampland & Star, 2009](#bibliography.xhtml#_24044-2003_chp005_ref85))
    that are used to systematically construct scalable maps, ontological and symbolic
    frames or poetics ([Henke & Sims, 2020](#bibliography.xhtml#_24044-2003_chp005_ref63);
    [Larkin, 2013](#bibliography.xhtml#_24044-2003_chp005_ref87); [Star, 1999](#bibliography.xhtml#_24044-2003_chp005_ref147);
    [Star & Ruhleder, 1996](#bibliography.xhtml#_24044-2003_chp005_ref149)).


    61. I read infrastructure theory by Star and co-authors as a sociologist, so,
    for me, the infrastructure is a social image, almost a Durkheimian totem ([Durkheim,
    2008](#bibliography.xhtml#_24044-2003_chp005_ref46)). In a way, the infrastructure
    is not only a representation but also a metaphorical social heart of a community
    that cares about it. This heart often turns to become invisible, misused, overhyped
    or taken for granted until it fails. When it fails in multiple sites and on a
    scale larger than incidental, the failure is not only an issue of a technical,
    but of a social and political, crisis. This is how infrastructural labour is inextricably
    connected with a community of practice, often an unspoken set of rules and procedures
    of maintenance and replacement. This is important both on a socio-anthropological
    and on a psychological level.


    The socio-anthropological one is pivotal for understanding the science of cybersecurity,
    but before that, I must make a small digression for the psychological one.


    What I constructed as a hyperbole, or a weberian ideal type,^()


    As I discussed in ethnographical accounts in [Chapter 1](#ch01.xhtml#_24044-2003_ch001),
    beginners in security or in server maintenance often are over-attached to infrastructures
    they maintain, so the self-identification often leads to burnout. In the sociology
    of labour or technology, it was observed in the 1990s ([Orr, 1996](#bibliography.xhtml#_24044-2003_chp005_ref122))
    among maintenance technicians responsible for Xerox machines as well as among
    mechanics engineers ([Bucciarelli, 1996](#bibliography.xhtml#_24044-2003_chp005_ref19)).
    Lately, it was a cause of strife between maintenance engineers and science teams
    working with synchrotrons ([Doing, 2009](#bibliography.xhtml#_24044-2003_chp005_ref40))
    and planetary rovers ([Vertesi, 2015](#bibliography.xhtml#_24044-2003_chp005_ref157)).
    Recent studies recognised that stress among cybersecurity professionals that report
    vulnerabilities may lead to burnouts ([Moura & Heidemann, 2023](#bibliography.xhtml#_24044-2003_chp005_ref113)).

