    As a result of privacy regulations, the data protection sector grew almost overnight.
    This is why I consider understanding hacking communities without knowing EU institutions
    as incomplete. This is also why I think that a policy workshop in the middle of
    a hacking congress challenges our understanding of issues of law, science, technology
    and institutional practice.


    In this chapter, I have discussed elementary experiments (like the one discussed
    in Interview 1.2) undertaken in hackerspaces in Central Europe. I have discussed
    the factors that affected the growth of interest in computer security after 2013,
    including the rise of IT outsourcing, as well as leaks and shifts in EU policy.
    I have argued that, similarly to scientific laboratories, informal research groups
    such as hackerspaces serve as potential resources for European policy as well
    as local sources of know-how for the maintenance of infrastructure in commercial
    companies.


    It is time to reveal more elements of the puzzle. How do academic laboratories
    around computer security work? How are hacking communities connected with professionalised
    computer security? Perhaps after learning about these issues, we will be able
    to finally figure out the details of sociological mechanisms in computer security
    laboratories.


    ## Summary


    Perhaps, reading this chapter evoked some of my personal experiences from the
    ethnography. Instead of an linear road, the chapter as well as the 21. ethnography
    resembled seeing through a kaleidoscope. Singular pieces were more or less complex
    on their own, but what really fascinated and lured me into the next step was their
    interoperability and complexity, as understood as another layer over the pieces.


    Fragment 1.2 Narration about a “good hack” performed in the hackerspace by two
    hackers. The hack was recognised globally and became as source of joy for the
    whole community. The narration is from an unstructured interview. I have concealed
    details to protect anonymity and cleaned up the written transcript.


    This allure and wider-picture understanding is exactly what I think that cybersecurity
    experts seek when they say “I have a root”. It means not only having a control
    over the system but also thoroughly understanding it. Of course, I claim no control
    over system of cybersecurity over global scale and even my claims over knowledge
    are limited. Having that in mind, I tried to 22. evoke this experience not in
    terms of scale but in terms of joy, discovery or confusion. In other words, through
    the medium of ethnographic text in this chapter, I attempted to convey the very
    specific experience of the multitude of breadth and perplexity of topics that
    the cybersecurity expert may be asked to handle. Similarly to kaleidoscopes, cybersecurity
    problems and my study of cybersecurity as well, will have many moving parts that
    will constantly change meaning as new movements will be made. This chapter evoked
    the sensation of understanding, of perplexity, of allure I found as a broader
    pattern among individuals and groups.


    Moving on from evocative to more analytical conclusions, I wish to underline a
    few issues. Firstly, it is sound to note that some hackerspaces, and similar groups
    I described as non-formal, do not constitute a majority nor representative sampling
    for cybersecurity research groups in the field. Having that in mind, I believe
    that it was not previously reported that the hackerspaces acted as a network nodes
    contributing as attractors for expertise, translators or mediators of activism
    in civic society processes at the transnational scale of the European Union in
    the case of General Data Protection Regulation (GDPR). This is the crux of my
    argument: if for the case of GDPR, as well as for others, the expert knowledge
    from groups like hackerspaces was recognised as important, even if in less than
    public circumstances, then I argue such groups are recognised as sources of expertise
    in the field. This is a sociological definition of a science: a publicly recognised
    and legitimised source of expertise. In short, if groups like affiliates of hackerspaces
    were reached by some EU aides as sources of expertise, then I argue that groups
    like hackerspaces contribute to circulation of knowledge that is recognised as
    scientific.


    By “recognised as scientific” I do not mean affiliated with academia or given
    the similar prestige or social credit as disciplines like biology, medicine or
    history, but reached as a source of expertise, objectivity, efficiency or any
    other positively associated values that given society or its delegates associates
    with sciences. In other words, this is legitimisation by the para-state apparatus
    (EU is not a state per se!), but with very little public recognition. Readers
    should not put too much emphasis on the “hackerspace” part nor on the “EU” part
    because there are more than plenty of examples of non-hackerspace groups that
    contributed to the expertise of state institutions. I will discuss more examples
    further in the text.


    A second conclusion is an implication of the first: the cybersecurity knowledge
    and social underpinning for scientific discoveries grow as much from the military
    or intelligence supremacy as from maintenance and subcontracting.


    This is what connects hackerspaces, EU aides, corporate security labs and many
    other groups in a field that is understood as a science of cybersecurity: not
    only the issues, practicalities, inscriptions and so on but the knowledge and
    power to integrate and delimitate them over the next layer. If physics is obsessed
    over the infinite regress over time and matter, then the cybersecurity obsession
    lies in constructing, weaponising and exploiting abstraction over 23. abstractions.
    This is the kaleidoscope libidinal mechanism, this is the dialectic in motion,
    this is the connection between the knowledge of the attacker and the knowledge
    of the defender. This is the “irrational”, or to be more polite, the emotional
    or passionate part, of the science, the part that is felt among and within the
    practitioners and that is translated through the invisible curriculums, through
    mentoring and through the most private of gathering. This is the cognitive “kick”,
    at least for those researchers who seek epistemological rewards.


    If the metaphor of the kaleidoscope is overextended, does it become a theoretical
    bypass? Either way, starting with the notion of infrastructures, through the global
    division of labour in maintenance and subcontracting, as revealed through groups
    like hackerspaces, thus catalysing knowledge recognizable by trans-state actors,
    I found out the “kick”, the libidinal or the dialectical component of the science.
    This is the preliminary, simplified and rudimentary introduction to the sociology
    of cybersecurity.


    ## Notes


    1. Look for music like: DJ Rush – Tetris Russian Theme (Techno Remix) or Complete
    History of the Soviet Union, Arranged to the Melody of Tetris. Then play it on
    loop for four years. [Return to text.⏎](#ch01.xhtml#R_24044-2003_chp001_en001)


    2. In this example, as well as with all examples, details are anonymised. This
    was a condition for consent that I proposed to the participants. This is why I
    was able to learn what I have learnt. This is also my sign of respect for the
    cybersecurity as a field, which in general, places a special emphasis on privacy
    and trust. [Return to text.⏎](#ch01.xhtml#R_24044-2003_chp001_en002)

