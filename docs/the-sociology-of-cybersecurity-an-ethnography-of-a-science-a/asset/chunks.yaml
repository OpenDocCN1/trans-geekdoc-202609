- raw: 'This illustrates the fundamental duality of the adversary in cybersecurity
    as a science. Is the adversary just the disorder, a random failure, or is the
    adversary cunning and always concealed?


    As it was the case in the times of Norbert Wiener and Charles W. Mills and is
    today, theological considerations find their appeal among the power elite. It
    may not be intended as a goal of JASON’s briefing in 2010, but, in 2025, Wiener’s
    thoughts may find more than a few aficionados among the Silicon Valley elites.


    Wendy Chen, in her ethnography of elite software workplaces in the Valley, found
    that para-religious fascination with mindfulness and similar practices goes beyond
    the need of relaxation or occasional spirituality ([Chen, 2022](#bibliography.xhtml#_24044-2003_chp005_ref28)).
    As observed by Chen, software companies recognised that employees may be attached
    to a “spiritual” meaning of work, so they started to bind religion with coding.
    The purpose is the same as in every binding of religion with the workplace: to
    make people work more willingly for less or to make them accept conditions that
    they may not accept otherwise. When it comes to brainwashing in the workplace
    for the sake of some research, religion is almost as good as academia (hey, the
    social origins of both are the same!).


    It is important to note that such ideologies and social practices were observed
    and described by Chen even before the AI investment boom swept the labour landscape.
    The AI boom, supported by the cryptocurrency period gave rise to the TESCREAL^()


    The TESCREAL cosmogony is unclear and functions as a honeypot in its own right.
    It lures through novelty or absurdity, only to gradually shift its meaning for
    some readers, in a way similar to climate denialism or flat-earth theories. This
    is why I abstain from discussing it in detail.


    It is a mistake to consider either Silicon Valley or the American power elites
    as secularly technocratic or completely atheist. Religious imagery plays an important
    symbolic role not necessarily as direct religious symbols but as other types of
    boundary objects; this time necessary for at least a temporary ceasefire and negotiation
    of support or funding. My professional specialisation is too far away from American
    Evangelicalism or Christianity in general,  78. or its influence on Conservatism,
    to discuss it in more details, but it does not mean I will be blind to what is
    obvious.


    ## Summary


    In this chapter, I proposed how to theorise computer security vulnerabilities
    as quasi-theoretical objects. They are theoretical, as they always exist as some
    sort of abstraction or proposal. They are quasi-theoretical because they depend
    on computer infrastructures to be discovered or to act. They are also performatives
    in the sense of Turner’s theory and in a long legacy of history of experiments.


    Without an audience to witness and verify how new instabilities differ from the
    existing ones and without validation from cybersecurity profession or science,
    instabilities exist only as hypotheses or notifications, but not as facts. This
    is why an untested, unknown zero-day lies on the boundary of this concept, similarly
    to an untested scientific instrument.


    As a stabilised instability becomes performed, it also becomes a social fact.
    Infrastructures are tested or breached. The public may be informed or agitated,
    but only rarely will the public outcry result in counteraction. This is how cybersecurity
    is political as a science, through stabilised instabilities rearranging the boundaries
    of social trust, privacy and visibility in the public sphere, not just through
    abetting the targeting of individuals for digital services or for missiles fired
    from drones. Shoshana Zuboff’s concept of behavioural surplus ([Zuboff, 2019](#bibliography.xhtml#_24044-2003_chp005_ref185))
    can be read as an individual dimension of the social implications of cybersecurity
    as a science. Important and painful for the individuals affected directly but
    insufficient for understanding the implications for the non-affected.


    Through an understanding of stabilised instability, this chapter discussed cybersecurity
    systematics, deployed in an official nation-state capacity as NIST CSF and proxy
    tools of what I called the Virginia effect: CVE, CVSS and MITRE frameworks. Illustrating
    standards with examples from literature and fragments of interviews, I have shown
    how cybersecurity creates knowledge. By discussing examples of CVE research, I
    have also shown points of agreement and critique with existing philosophical proposals
    on cybersecurity as a science. I agree with the adoption of instrumentalism and
    mosaic-unity as first-degree philosophical approximations, but I remain critical
    of international, public unaccountability in terms of ethics and on the issues
    of trading zones and boundary objects.


    Contrary to the existing philosophical literature by Spring and co-authors ([Spring
    et al., 2017](#bibliography.xhtml#_24044-2003_chp005_ref145)), this chapter argues
    for studying classification systems such as CVE or MITRE frameworks as boundary
    objects necessary for the effective functioning and examination of trading zones
    or the mosaic. It is my understanding that CVE act as a common language and common
    material, as envisioned by JASON, and put into doubt by Spring and co-authors.  79.
    However, the paper by Spring and others on JASON’s report remain a pivotal contribution
    in the philosophy and sociology of the field. Further debate on later philosophical-cybersecurity
    papers ([Spring, 2023](#bibliography.xhtml#_24044-2003_chp005_ref152); [Spring
    & Illari, 2019](#bibliography.xhtml#_24044-2003_chp005_ref143), [2025](#bibliography.xhtml#_24044-2003_chp005_ref144))
    remains open.


    Finally, to discuss how cybersecurity knowledge is developed in separation from
    democratic control, I discussed the results of my epistemological reconstruction
    through the framework of Charles W. Mills’ “power elite”. Showing that cybersecurity
    is concerned exactly with the opacity, transparency and accountability of power-knowledge
    institutions, I have revealed how cybersecurity as a science is developed as an
    instrument for the power elite of the United States of America.


    The US does not have a monopoly on the standardisation of cybersecurity knowledge,
    so the European Union launched its own equivalent of CVE, European Union’s Vulnerability
    Database ([ENISA, 2025](#bibliography.xhtml#_24044-2003_chp005_ref49)). Similar
    databases likely exist or will start to exist in spheres of epistemological influence
    of countries such as China and others. There are also databases that are nominally
    maintained by non-partisan, international bodies, but CVE remains the largest
    and most influential.


    This is why understanding the political theology of Augustinian and Manichean
    devils, as discussed using MITRE briefings and Peter Gallison’s research, remains
    an important element of understanding cybersecurity relevance to the TESCREAL
    bundle of ideologies as well as to sociological research on religion among the
    elites of Silicon Valley and the computer industry.


    Reconstruction, examples and theorisations given in this chapter definitely do
    not provide the full picture of the field on a global scale, nor even in the context
    of the US sphere of influence. Being critical to the power of CVE and other under-examined
    standardising bodies, I cannot escape one final irony. Through this chapter, ultimately,
    I share the same hope: while the socio-epistemological model given in this chapter
    may be false, I hope that it will become useful.


