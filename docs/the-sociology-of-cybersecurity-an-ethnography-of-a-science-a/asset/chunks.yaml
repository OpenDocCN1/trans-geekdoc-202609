    \ transnational, seismic changes in its laboratories, profession and thought collective\
    \ is a task for a sociologist.\n\nIf this sounds too serious, just wait until\
    \ the chapter on computer security e-sports.\n\n## Notes\n\n1.  Fair use is the\
