- raw: 'I am immensely grateful for the time and effort that my colleagues devoted
    to this ethnography. The interviewees who kindly agreed to be observed or people
    who agreed to note their words in an anonymised version are my colleagues, not
    because I compare to them in cybersecurity knowledge but because every human is
    an intellectual ([Gramsci, 2007](#bibliography.xhtml#_24044-2003_chp005_ref61)).
    Without a doubt, many of them would not agree with the interpretations given in
    this book, but I am more than certain that for at least a moment, they shared
    at least the curiosity.


    ## Fieldwork. Data. Limitations.


    As any hacker or engineer will tell you, tools should not be blindly used but
    understood. Social research is no different, so, when making comparisons, I will
    do so symmetrically in two moves. I will constantly examine similarities between
    practices well understood by sociologists of science and practices I saw as a
    sociologist among security researchers and hackers. However, recognising similarities,
    while useful, may lead to cognitive biases. So, in every ethnographic vignette,
    I will also try to recognise differences – not only in terms of money, prestige
    or the public visibility of failures but, more importantly, those involving understandings
    and social dynamics around experiments, computer vulnerabilities or designed infrastructures.


    As I mentioned, the project is influenced by various notions of dialectics. In
    practice, that means that I am always looking for ways to contradict my previous
    viewpoints or to extend the perspective into a different scale, to see what was
    the norm as an exception, and so on. As a result, the book may appear as slightly
    abstract and self-contradictory. Since this book developed from my first academic
    project, for most of the time, I had no access to cross-coding validation. Instead,
    I opted for a “do-it-yourself” version of community validation or participatory
    action research, which means that I asked the ethnography participants whether
    they agree with my reasoning and interpretation. If not, I noted discrepancies
    and will report them accordingly in my book.


    I staunchly believe in paying participants for their co-validation because I believe
    that I should be paid for ethnographic work, so as a logical consequence, they
    should be remunerated also. Contrary to my ethical principles, in most cases,
    the rules of my funding providers did not allow it. Nevertheless, I asked the
    majority of participants about remuneration, openly stating how my finances were
    at the moment. A majority of them declined, mostly because cybersecurity work
    pays much more than social sciences. In some cases, we came to a mutual agreement
    that I could contribute their remuneration to a  6. social cause, like science
    education, sponsoring tickets for conferences or small support for a local coding-inclusivity
    event.


    All ethnographic observations were made with full, repeated and informed consent
    of individual members. Exceptions were made for large public events like conferences,
    where such consent was not practical for logistical reasons. In such cases, I
    did not make pictures nor record names. In selected cases, some security researchers
    asked for erasure even from such record, so I abstained from transcribing the
    observations from the physical field notebook to a digital version, and I destroyed
    the physical page.


    The core research for this book is based on a series of studies I conducted from
    2014 to 2020 in various countries in Central and Western Europe. I spent 150 days
    observing informal hacking communities in the region. Additionally, I participated
    in security conferences, and I observed Discord chats on cybersecurity research,
    such as the [FHE.org](http://FHE.org) community. Since Discord and chat inquiries
    were supplemental, I recorded them only when I had the consent of the community
    and all people on the recorded fragments.


    To extend the perspective beyond Europe, I interviewed 30 security researchers
    (security architects, cryptographers, ex-CERT members, etc.) from five countries.
    In addition, I visited five computer security conferences and two academic computer
    security laboratories. I also observed in real time how hackers, academic researchers
    and security specialists interacted during the Chaos Communication Congress (C3)
    from 2015 to 2019 on selected workshops under conditions of anonymity. I also
    observed workshops on security conferences other than C3, under the same conditions
    of consent, but I wish to keep the conferences anonymous. I deliberately had not
    asked about matters that may breach confidentiality agreements.


    A dialectical approach and interests in synthesis and in personal accounts resulted
    in a technique I called “field-contrast expert technique”, which boils down to
    approaching the interviewee as an expert both in the field and in the subjective
    interpretation of it. This technique of semi-structured interviewing follows questions
    such as, “what explanations about this big vulnerability/hard question from 1–2
    years ago did you discover” juxtaposed with contrasts like “on what elements of
    this thinking of your peers you do not necessarily agree?”. As a result, the interviewee
    was able both to generalise about “what is commonly understood”, or the good ol’
    sociological cliché, “what does your \[imagined\] colleague say about it?”, and
    to highlight issues in which they personally differ. Adding this kind of hypothetical
    clauses or projection techniques, as well as asking about vulnerabilities that
    fell out of their current workplaces, allowed people to speak somewhat more freely,
    without increasing the risk of breaching their non-disclosure agreements. If they
    used too many details, I erased the recording. Through the whole project, I used
    an older type of audio recorder, without an Internet connection.


    I spoke off-the-record with military computer security recruiters, policymakers
    and some people from what seemed to be intelligence agencies. This  7. is not
    an unfounded suspicion, as two times I have been asked to join the intelligence
    services, an event not usually recorded in ethnography, except for CIA assets
    like James C. Scott or colonial ethnographers.


    In addition to individual interviews in the field, I recorded over 150 samples
    of “fresh talk” – the kind of talk between professionals which occurs when they
    try to solve a complex issue. To sum up, the database for this research has 300
    records and about 2,000 cross-analysed fragments. Material was reviewed and updated
    between 2023 and 2025 by additional desk research, follow-up interviews and participation
    in cybersecurity conferences.


    All the participants were informed about my research interest and the moments
    I started to “make ethnographic observations”, that is, when I turned on the recorder.
    All the participants who provided data to the database did so with informed and
    repeated consent and with information on where they could make a professional
    complaint to my research institutions. I asked for consent after recordings and
    gave access to individual data to people participating in the event for verification
    purposes, with access to others’ data restricted.


    Between 2013 and 2020, I conducted five workshops in the communities I worked
    with, showing my approach to analysis and my claims. I also prepared workshops
    and lectures for the biggest hacking convention in Europe (Chaos Communication
    Congress) and showed my data at security events in the region (Oh My Hack, Confidence
    and some conferences of Institute of Electrical and Electronics Engineers – IEEE,
    Association for Computing Machinery – ACM). While I interviewed researchers from
    United States of America, I did not conduct extensive ethnographic research there.
    When it was politically viable, I had not enough funding. In the middle of 2025,
    politics changed, but insufficient funding remained an issue.'
