    Perhaps this is why making systematics is even possible, although absurdly complex.
    This may also be why there is no finite list of CTF categories, as the list changes
    and mutates as the hacking itself. Through this incompleteness, CTFs allowed an
    understanding of digital technologies to be shared, replicated and disagreed upon.
    This also allowed a continuity of the hacking culture and a continuity in the
    thought collective despite several eras of technological changes. Following and
    extending Gallison’s model of intercalation in trade zones (2008), one can hypothesise
    that thought collectives offer anchoring for periods of changes in infrastructures.
    A reverse relation is also likely to be true, as turbulent eras in thought collectives
    are anchored and stabilised by the materiality of infrastructures.


    ### Fragment 3.1

    The celebration of the lifeworld of the hacking culture mixes with the joy of
    cerebral exercise. This cerebral exercise of solving and replicating security
    problems becomes open to recuperation as unpaid professional training and mental
    work. [Return to text.⏎](#ch03.xhtml#R_24044-2003-003-001)


    ### Table 3.1 Categories of CTFs

    [Return to text.⏎](#ch03.xhtml#R_24044-2003_ch003_tab_001)


    Categories of CTF tasks in the “Jeopardy” format. Changes in the categories of
    CTF change the information security profession and infrastructure. Reverse engineering
    is directly recognised as a separate specialisation, on par with cryptography.
    While cryptography is recognizable as an STS subject ([West, 2022](#bibliography.xhtml#_24044-2003_chp005_ref173))
    of study, reverse engineering might be more problematic. Hackers were the direct
    inspiration for the theory, but the history of engineering provided many other
    examples.


    | Abbreviation | Technical area |

    |---|---|

    | Crypto | Software applications of mathematical cryptography. |

    | Rev, RevEng | Reverse engineering, or figuring out how closed and unknown systems
    work. Opening black boxes outside STS, (e.g., in electronic systems). |

    | Bin | C programming language and assembler operations on memory. Sometimes,
    the exploitation of binary files. |

    | Web | Using characteristics of web pages, technologies such as HTML, etc. |

    | Forensics | Recovering deleted files, parsing through data seeking hidden messages,
    analysis of patterns in images. |


    Observing CTFs shows that dialectics of error and repair by infrastructures mirror
    dialectics of critique and recuperation in a thought collective. Cycles of errors
    and repair in the infrastructure could even detach themselves from the time-frame
    of public politics or cycles of public interest. If the infrastructure is overlooked
    as obvious when it works, then errors in the infrastructure could be doubly invisible
    for public and non-involved actors.


    Now, it is time for the next step. I mentioned that the thought collective is
    stratified, depending on the level of abstraction and gatekeeping of knowledge.
    Now, I offer an overview of such processes in thought collectives.


    ## Communities and Crowds: Stratification of Thought Collectives

    CTF events vary in participant numbers. The most significant events exceeded 400
    players. The smallest ones may have only 3 teams and 15 players. What makes the
    difference is not the number but the professional composition of the participants
    and the relative prestige of the event.


    During critical events, I had the opportunity to talk with the profession’s elites.
    They included senior specialists from the security departments of 10 highly visible
    software companies, academic cryptographers, security researchers, highly paid
    penetration testers and security architecture consultants. Perhaps less known
    to the public eye, but no less critical, were national Computer Emergency Response
    Team (CERT) specialists. CERTs are like national surgeons or consultants of medicine
    for emergency response in security emergencies to those outside the field. For
    reasons of anonymity and duty of professional care, I cannot disclose what nations
    (CERTs), companies, universities or events I have worked with. By design, I did
    not record names, names of tournaments or dates. Anonymity and confidentiality
    were important. For top teams, CTF events are arenas for professional prestige,
    exchanging knowledge and discovering a shared understanding of otherwise under-discussed
    details. Higher echelons of CTFs are for exchanging ideas, gossip and arcane,
    tacit knowledge.


    CTF events often invoke images of underground, weird or off-putting elements.
    They serve several purposes. First, they deter interest from people without sufficient
    immersion in the hacking culture, also serving as an unspoken, elite gatekeeping
    mechanism. Second, obnoxious and confusing symbolism adds to participants’ cognitive
    and emotive experiences. The cognitive load of technical problems becomes less
    overwhelming when some elements can be navigated through familiar symbols. Finally,
    loud symbolism demarcates CTFs as non-work situations. In this respect, CTF tasks
    mirror CTF aesthetics, as shown in [Fragment 3.1](#ch03.xhtml#_24044-2003-003-001).


    This set of preferences is both epistemic and cultural. In agreement with Maxigas
    and [Söderberg (2022)](#bibliography.xhtml#_24044-2003_chp005_ref151), I also
    understand CTF communities as “communities of peer producers”. I wish to put forward
    the observation that the peer-to-peer mechanism becomes critical when epistemology
    focuses on errors and anomalies.


    Players in more prestigious CTF tournaments often use them as attempts to “break
    into” the elite sectors of security. Hackers and security professionals from this
    group had the highest labour autonomy and professional expertise, so sometimes
    they are envied not necessarily for reasons of money or prestige, but because
    for the opportunity to work “on the interesting problems” ([Table 3.2](#ch03.xhtml#_24044-2003_ch003_tab_002)
    shows some fragments on this disposition). CTF tasks are like “solving beautiful
    mathematical problems, a source of bliss and aesthetic sensibilities” (direct
    quotation from a respondent). Their craft and their practice in CTF matter for
    infrastructure, because they produce and reproduce gaps, errors, and extreme cases.
    In my assessment, CTF epistemically serves more for replication, communal discussion,
    or peer review and less for discovery.


    It is a common belief that security departments and other desirable employers
    observe more prestigious tournaments. Playing CTF is participation in security
    discourse. Task authors propose critiques of existing technologies. Players recuperate
    or counter them. Players are proposing security models for various black boxes.


    This is the most direct political reading of CTFs. They are political simply because
    they gather computer security elites at the global scale. Effects of the gathering
    may vary, but the mere fact of the informally institutionalised gathering at the
    global transnational and trans-corporate scale makes them political. Whether they
    function more as knowledge exchanges, professional leisure time or recruitment
    events should be investigated in detail in further studies.


    ### Fragment 3.2

    Answers to a question “What makes a good CTF task?” Participants emphasised new
    knowledge, subversion of expectations and cerebral challenge. Randomness and tediousness
    are criticised. Observe also how participants emphasise the “good kind of broken
    system” from the bad one. This is akin to the expressions of epistemic aesthetics’
    recognition of mathematical proofs. [Return to text.⏎](#ch03.xhtml#R_24044-2003-003-002)

