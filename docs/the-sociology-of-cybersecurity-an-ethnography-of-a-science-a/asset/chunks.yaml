  trans: '

    这些是关于非正式团体与整体网络安全之间关系的两个论点。首先，非正式团体为专家和自由职业者提供了教育场所和“母性实验室”。其次，通过我在非正式团体中的民族志工作，我受欧洲议会（EP）的一名助理邀请参加了一场闭门咨询研讨会。因此，这种关系是：非正式团体促进了专业知识，而这种专业知识被我进行研究的地区中的跨国政治机构所认可。一名
    EP 助理正在进行非官方咨询，后来证实这是《通用数据保护条例》（GDPR）中的一项决议之一，该欧盟法案对包括网络安全在内的数字市场产生了重大变化。^()


    但是，在讨论全球事务之前，我想展示黑客空间如何在更小的规模上实现实验。要理解 片段 1.1，一些背景信息可能会有所帮助。如我所说，我们身处一个有令人麻木的
    techno 音频的地方。它在地下室。这里人不多，光线也不多。我能够在这里行走是因为我熟悉这个空间。我在这里进行了几个月的民族志研究。我已经熟悉这个地方，但我仍然没有弄清楚上面描述的关系。这里有一张桌子、两个人和一瓶啤酒。我认出这两个人是
    Speck 和 Fidel，啤酒是一种由小麦和大麦芽酿造的苦啤。啤酒和氛围相似：一切都轻松随意，只带有一点地域性的郁闷。今天我不会喝酒，但在另一个晚上，我可能会加入他们。在这次场合，我不会做笔记，也不会努力记住任何事情。在我们的黑客空间里，夜晚才刚刚开始。


    我更靠近 Speck。两位黑客已经公开同意参与研究，前提是公司、城市和昵称匿名化。他们将能够在本地存储库中访问本书的源材料，该存储库面向我所书写的社区。


    Fidel 年纪较轻，刚完成一个面向数学天才的高中项目，并在一家公司兼职工作。他对加密货币、自由市场和厌女症感兴趣。Speck 年纪较大，全职从事 11.
    系统操作（SysOps）。Fidel 在理论和网络科学方面更强。Speck 在维护和错误处理方面经验更丰富。Fidel 身材瘦削，而 Speck 体型魁梧但仍然很友好。


    他们共同工作的公司人手不足。他们的“紧急/关键待办清单”（积压工作）每天都在变长。Speck 慢慢感到沮丧，因为他看到越来越多的海外同事从事开发运营（DevOps）职业：更关注开发而非维护。DevOps
    意味着更好的薪水、更高的声望和更有吸引力的任务。


    他们坐在沙发上，一边是晚上的放松，一边讨论服务器负载均衡实验。它将使用属于黑客社区的基础设施来测试他们好奇的假设。这并非不寻常的做法，因此社区维护了几台服务器和带备份的服务，通常可用于此类工作。


    实验不能在关键（或“实时”）基础设施上进行，例如会员或费用收取系统，但应为他们提供备用服务器。Speck 和 Fidel 都是“space”（黑客空间的缩写）的常客，所以他们都不期望会遇到任何反对意见。关于实验的最终决定将由服务器主管（昵称：Rama）做出，或在一次常规周会上通过社区同意。


    这次实验的结果对他们各自的职业生活来说并不完全至关重要。这更多是出于职业好奇心或雄心壮志，想要“超越成为为美国佬做无脑的 fucking 外包商”（译自谈话中的
    *in vivo* 引语）。他们的公司拒绝提供资源，所以他们在业余时间进行实验。简而言之：这个黑客社区的服务器是测试平台，因为工程师发现在这里设置实验比在公司里处理官方程序更容易。据我所知，不会使用任何内部公司数据，只会使用模拟适当条件所需的仿真数据（例如，假电子邮件流量、假数据库查询、由干草而非有价值信息组成的假数据库数据）。


    黑客空间有一些备用服务器。它们并不算高科技，但足以用于测试目的。社区是在当地电信公司现代化时获得它们的。由于该空间在国内颇有名气，电信公司的人路过时问空间是否想要一些东西。所以，这些东西被送到了地下室，准备供
    Speck 和 Fidel 使用（参见 片段 1.1 中来自黑客空间的一名 DevOps 的引语）。


    ## 为什么 SysOps 很重要？


    我稍后会回到黑客空间晚上的其余部分，但我必须在这里暂停一下，重点关注基础设施。这对于外行来说很容易忽视。正如老话所说：“新手谈 12. 策略，专家谈后勤”。在这种情况下，策略意味着进攻或防御性黑客行为。后勤意味着日常的基础设施处理。


    ### 片段 1.1

    这是一位黑客即兴进行的演示。它考察了黑客空间基础设施的各个方面。我注意到黑客空间基础设施处于持续的翻新和协商之中。对于黑客来说，这是一个积极的特征，因为它提供了学习机会。这是一段摘录，展示了从一个更长、重复的协作模式中的初始阶段，而非单一示例。返回正文。⏎


    这句格言可以应用于“科技与社会”（Science-Technology-Society）（STS）^()


    我理解黑客知识向计算机安全科学转化的策略是不同的。我对计算机安全的概念依赖于将其视为基础设施（Bowker & Star, 2008；Star, 1999；Star
    & Ruhleder, 1996）和类似科学事实的机制（Fleck, 2008）。这听起来可能过于复杂和过度理论化，但它只是说我需要不断理解波兰大银行子公司中的
    SysOps、大 IT 巨头和大大学中的理论密码学家之间的联系。实际上，这意味着我必须在技术研究概念和科学研究概念之间移动。虽然它们经常被一起考虑，但它们的细微差别很快就会变得重要。


    为了受益于其中一些细微差别，我将使用 Susan Star 及其合著者所理解的基础设施概念（Bowker & Star, 2008；Star, 1999；Star
    & Ruhleder, 1996）。他们指出基础设施的几个社会物质特征，我在田野工作中对此特别感兴趣，我希望通过本书在概念上发展这些特征。

    '
