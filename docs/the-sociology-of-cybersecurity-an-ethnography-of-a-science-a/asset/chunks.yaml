  trans: '

    我不会重构此案的技术和法律层面。首先，因为法院审理尚未结束，其次，因为正在准备一篇单独的论文。相反，在我们讨论职业的语境中，重要的是以下内容：通过绕过制动器、发动机和其他工业自动化部件的安全机制；机车导航系统；以及其主总线（用于传输信息数字架构的一个要素），研究人员——据称——发现故障的机车之所以不同，是因为它们含有代码片段，指示它们在非常特定的地点、在行驶特定距离后或在其他各种条件下“变砖”（停止后彻底断开）。这就是据称缺失的环节：不是最终的物质效应——它们各不相同——而是据称嵌入机车系统编码深层的恶意代码行。


    当研究人员向车场提交调查结果时，机车制造商以反诉作出回应，指控事实上是研究人员植入了故障元件。据生产商称，他们的利益很明确。因为 ZNTK 无法按时履行列车维修合同，所以有必要依赖阴谋论并为其植入一些证据。


    Impulses 的整个传奇之所以漫长，也因为它在民事诉讼、议会听证以及北约和波兰情报机构的介入方面有了续篇。研究人员还就法律反制措施以及其带来的情感折磨做了公开讲座（Kowalczyk
    等, 2025）。


    在所有这些复杂性之中，有两件事引起了我的注意。研究团队从一开始就建立了证据协议，与其他科学被要求为法庭服务时所使用的协议类似（参见 Albright 等,
    2023 ，其中讨论了美国的历史和悲剧，美国向其他国家出口监控和网络安全软件）。研究人员仔细维护了文档，并跟踪了原始系统和从机车获得的原始数据与用于实验的样本和数据之间的区别。


    想象一下这种辛劳。当然，你和你的伙伴可能是网络安全研究人员，但你们主要通过本质上是 33. 电子竞技的方式相互认识。现在你必须在所有有趣、引人入胜且在智力上令人满意的谜题的同时进行记账。如果不记录机车部件是什么以及为进行逆向工程、测试和安全绕过而搭建了什么，结果可能毫无价值。我看不出这与实验样本和参考样本的等价性有什么不同。这是网络安全科学的形成。


    这也是本案所涉及的问题所在。如果民事诉讼成功，研究人员将被视为黑客。他们的研究将被视为入侵，研究对象与方法特殊性之间将没有区别。换句话说，如果实验室必须像网络安全所做的那样处理知识的界定，并在网络安全内部理解这种界定，那么职业就关乎该领域结论在法律、国家和其他制度体系中的自主性（和霸权！）。建立律师协会、职业道德规范、国家考试或大学课程的自由是后果和附现象，而不是原因。


    这也是为什么本案说服我提出网络安全职业形成的假设。因为议会、情报机构、法院似乎接受了 Redford、q3k 和 MrTic 提供的证据，这种接受成为网络安全“足够好科学”在公众视野中的基准和社会证明的例子。换句话说，强大的国家行为体在光天化日之下证明，用于区分“先前存在的内容”和“研究中使用的内容”的证据程序是足够好的。在本书手稿提交之时，研究人员在任何民事诉讼中均未被认定有责任。网络安全在波兰被允许开展自己的研究，欧盟似乎将其视为“维修权”范围内以及公共利益范围内。令人不安的是部分媒体话语与专业回应之间的两极分化（Atack
    2023；Q3K 2024）。研究人员面临了一场跟随诉讼的媒体宣传，而专业话语几乎一致地支持他们。我认为所涉及的问题是，有时在技术领域维护研究自由符合公共利益。


    Andrew Abbott 重构了职业之所以出现，是因为它们成功说服公众，将部分权力交给拥有专业知识的专家符合其最佳利益。那当然更多是叙事上的合理化而非原因，因为权力的细节很少如此清晰。然而，Abbott
    也认识到，作为这种合理化的后果，职业发展出伦理和内部监管方法。


    当然，20 世纪的历史表明，医学、法律和会计对同胞犯下了超过其应有份额的罪行。这就是为什么人们理解专业人士的洞见对于监督其领域是必要但不充分的原因。这也是为什么我对网络安全职业的概念化是一种认识，即网络安全专家不仅参与间谍、防御或监视，而且他们还构成了
    Allison Powell 所称的“公共利益黑客” (Powell, 2016) 的下一个阶段。当此类黑客行为变得如此 34. 精致、如此详尽地记录并且如此类似于科学实验时，也许一个职业正在诞生。不是源于其对普通人的权力，而是作为一种公共服务，与科学、艺术和媒体所执行的监督不无相似。


    我对职业的论断并非基于我的规范性希望。波兰的一个案例不足以代表欧盟，也不足以推及全世界。那么，概念的其他原因是什么呢？


    这是我使用该概念的第二个原因。这可能是我下一个研究项目，但我相信网络安全职业的标准正在提高。我的探索性研究表明，这种需求源于勒索软件日益增长的成本和后果，以及数字社会整体的军事化。这就是网络安全专业人士与普通人之间的区别：前者开发的系统所投保的勒索软件保险的承保价格比后者便宜，因此前者的工作必须受到控制、认证并置于不同的责任制度之下。这就是安全化的柔道：如果系统化和专业化使网络安全对保险业的适当部门越来越负责，那么公共、公民和民主监督机制就有一些可以遵循的方式。这是一个微弱的希望，但仍然值得阐述。


    ## 思想集体。科学知识的语境。

