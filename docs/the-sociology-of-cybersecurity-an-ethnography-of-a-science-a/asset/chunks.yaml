- raw: ' 42. This differs from other applications of *The New Spirit of Capitalism*
    in STS. For example, critique-recuperation dynamics have been shown with Facebook/Meta
    policies in countries throughout Africa ([Rider & Murakami Wood, 2019](#bibliography.xhtml#_24044-2003_chp005_ref125)).
    The growth of the network relied on recuperation and recapture of the critique
    concerning free speech and digital inequalities.


    This shift in understanding marks the transition from macro to more granular-scale
    resistance in relation to critique and recuperation. It is not surprising that
    recuperation in relation to hacking differs from Boltanski and Chiapello’s proposal
    (2007). Unlike source theory, hacking studies focus on remnants following the
    recuperation process and the processes of resistance to it.


    While capital captures critique, it still leaves remnants and leftovers as embers
    for future critiques. Those recuperated embers (of future critiques) are not abstract
    or limited to the systemic scale but are embedded within the human scales of the
    resistance. This theoretical reconfiguration is essential in two aspects. First,
    Maxigas and [Söderberg (2022)](#bibliography.xhtml#_24044-2003_chp005_ref151)
    emphasise the constructive dimensions of hacking, highlighting ownership over
    tools. This diverges from the popular stereotype of hacking as destruction and
    comes closer to contemporary hacking studies. The central theoretical outcome
    of Maxigas and Söderberg lies in the recognition that hacking is a practice of
    worker resistance in critical workplaces in the digital economy. No less important
    for this work is their recognition that dialectics of critique and recuperation
    are, by definition, incomplete. Every political transformation always leaves some
    residuals, both on the side of critique and recuperation. Every revolution, consumed
    or triumphant, is, by definition, incomplete. These residuals create biographical
    histories and experiences and shared knowledge for future shifts. Hacking culture
    can continually restructure and devise fresh means of resistance and reparation
    because of the political leftovers present, as per Maxigas and [Söderberg (2022)](#bibliography.xhtml#_24044-2003_chp005_ref151).


    Interpretation and occurrence of residuals marks the difference between this chapter
    and the research of my colleagues. Hacking can and should be understood as a practice
    of labour resistance in the workplace of digital capitalism. Herein, I propose
    further research to recognise this resistance not only in terms of politics, as
    imagined by philosophy or the sociology of labour or welfare ([Well et al., 2023](#bibliography.xhtml#_24044-2003_chp005_ref172)).
    I believe that hacking matters because hacking is the political critique and recuperation
    of infrastructure. Materialised, but always beyond a single time-space. Embedded
    in a community of practice. Not always destructive or anti-systemic, as elusive
    dialectics of critique and recuperation itself.


    Maxigas and [Söderberg (2022)](#bibliography.xhtml#_24044-2003_chp005_ref151)
    focused on building alternatives to commercial digital infrastructure. However,
    the focus on independent and positive practices of resistance comes with a hidden
    cost. Understanding the resistance and recuperation of smaller projects is necessary,
    but it is not sufficient. Maxigas and Söderberg focused on hacking, understood
    as practices of  43. construction. They proposed recuperation and critique for
    cases of independent hacking projects and their subsequent commercial recuperation.
    I wish to do the reverse: not to focus on hacker culture on its own, but to follow
    open hacking events as they are held as liminal to affairs of business and military
    institutions, in order to learn about these institutions. This why this chapter
    focuses on the politics of hacking almost at the moment of embedding it into transnational
    corporate and military interests. The interest is still in infrastructure, the
    objective still lies in science, and the approach is still sociological. The difference
    lies in the fact that CTF groups are more ad-hoc based and do not necessarily
    fulfil the criteria of laboratories. In this sense, CTFs are “inbetweeners”, a
    mixture of cognitive, professional and leisure spaces kept apart from workplaces,
    but staying in proximity to them.


    I do not intend to disprove Maxigas and Söderberg proposals but to provide a dialectical
    counterpart to their work. Where they studied the resistance and capture of independent
    critique, I preferred an almost completed recuperation, that is, what remains
    between oligopolies and powerful institutions of military and digital espionage
    as a necessary common group for the profession. Where Maxigas and Söderberg study
    autonomous practices of resistance formed around the construction of separated
    systems, I focus on destructive practices of collaboration, bound by constant
    rivalry; where they studied anarchist projects captured by the market, I studied
    the capitalist enclosure of anarchist-like space and the sporadic acts of individual
    decisions within it.


    To understand this recuperation mechanism and its relation to digital infrastructure,
    I examined CTF hacking tournaments. Despite the recent professionalisation of
    the field, they still operate in a semi-independent niche. Enthusiasts could say
    they still gather to provide a breeding ground for radical hacktivists, providing
    a long-lasting tradition in the hacking culture. Furthermore, it would be hard
    not to notice that many military and intelligence agencies use CTFs as recruitment
    tools (e.g., North Atlantic Treaty Organization CTFs and Government Communications
    Headquarters CTFs). This growth of semiformal practices in security was overlooked
    in security studies concerned with hacking, even in areas using STS approaches
    ([Bellanova et al., 2020](#bibliography.xhtml#_24044-2003_chp005_ref13); [Bellanova
    & de Goede, 2022](#bibliography.xhtml#_24044-2003_chp005_ref12)).


    During the last decade, hacking studies have broadened the definitions of hacking
    to include practices other than those connected with information security ([Coleman
    & Jandrić, 2019](#bibliography.xhtml#_24044-2003_chp005_ref31); [Dunbar-Hester,
    2019](#bibliography.xhtml#_24044-2003_chp005_ref42); [Lindtner, 2015](#bibliography.xhtml#_24044-2003_chp005_ref86)).
    Where my colleagues focused on independent communities and non-security types
    of hacking, I focused on the practice that is in the middle of recuperation.


    ## Outline of CTFs


    At first glance, CTFs are private or semi-private gaming events hosted and participated
    in by the community. Only after interviewing the participants, mingling with them
    and learning more about different interested parties can  44. one understand their
    scale and relevance. They are far from enough for statistical generalisations
    but enough to test a few theoretical concepts.


    CTFs events usually take from 12 to 36 hours. They are played during physical
    or hybrid physical/online meetings. Online CTFs were less popular before the COVID-19
    lockdowns. After 2021, there appeared to be a return to on-site events. CTFs are
    held during various security events. The most typical events happen during security
    conferences or hacking conventions, but there are also events independent of other
    security meetings. CTFs are organised by the players themselves. Yesterday’s players
    and competitors become tomorrow’s arbiters and task authors.


    For a community focused on researching errors and irregularities, proximity with
    practice may be even more important than for people who “only” develop new solutions.
    Errors in infrastructure require an infrastructure different from concepts of
    possible new developments, even on a very direct material level. Ideas and possibilities
    of infrastructure are much easier to conceptualise in abstraction than in errors.'
