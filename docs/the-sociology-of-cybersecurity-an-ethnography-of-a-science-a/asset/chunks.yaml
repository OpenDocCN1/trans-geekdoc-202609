    # 结论


    总之，我回到更大的图景。在跨国基础设施的宏观尺度上，CTF 重塑政治和经济的方式多种多样。随着对信息安全专家需求的上升，CTF 仍然是安全专家自我教育和与黑客文化自我认同的必备要素。这可以被解读为企业和军事行为体对黑客文化的游戏化，并被理解为
    recuperation 和去政治化的一个例子。与此同时，这也意味着信息安全变得更加可及和包容。如果 Maxigas 和 Söderberg 所描述的黑客实践可以被视为工人的抵抗，那么
    CTF 就可以被解释为游戏化且不易察觉的破坏罢工，与通过教育和无偿情感劳动扩大劳动力相结合。


    然而，我认为漏洞的政治学延伸得更远，既在物质化形式中，也在社会形式中。我仅概述了看似中立的交易区（Gorman, 2010）对安全研究的含义。从电子学实验室的历史研究（Galison,
    1997）中可以看出，机构之间的研究时空“in-between”可能获得政治维度，而并非尽管表面中立，而是正因为表面中立。例如在复制漏洞到临时基础设施期间的或许虚幻的去政治化这样的时刻，看起来就像是在单个漏洞的尺度上此类交易的完美等价物。通过
    CTF 演练的基础设施并非“真实”，它们只是游戏的场地和道具的等价物。这种特定的游戏化移除了政治和道德的利害关系，并允许将漏洞视为“纯粹、客观的问题”。这使得
    CTF 成为与 第 2 章 中讨论的实验室等价的社会结构的非常特殊的例子和实例。通过游戏化重构政治与实验室的界定相称。为了游戏目的而援引的东西，导致了基础设施非常具体的物质-数字重构，并非因为游戏本身改变了基础设施，而是因为它改变了社会政治关系，从而重构了基础设施脆弱性的新安排。


    How do such reconfigurations matter for more significant shifts at the scale of
    transnational processes and political economies?


    Is it hard to conceive that at least some digital infrastructures cannot stagnate
    technically and economically because of CTFs? Would it be enough to sustain at
    least some of the dialectics of critique and recuperation of surveillance capitalism
    (Zuboff, 2020), even though the initial catalysing spark of “Californian Ideology”
    took place in the 1990s (Barbrook & Cameron, 1996)? In this chapter, I have provided
    arguments for at least stating such questions in the STS debate. The CTFs are
    the dialectical paradox: they are the socio-epistemological stabilisation for
    replication of instabilities in the digital infrastructures. They serve social
    and epistemic functions of laboratories, 56. blending advanced, vocational, “lab
    bench” training with the function of replicating the knowledge. It is through
    CTFs that institutions of cybersecurity have some common understanding of the
    field, without the need for exchanging business, legal or any official communications.


    由于其晦涩，CTF 很容易被抛弃为无关紧要的琐事，或被视为“该领域的纯粹休闲活动”，与像 Google 这样的巨头或像技术封建主义这样宽泛的概念关系不大（Varoufakis,
    2023）。它们远离用户的视角，甚至远离关于数字基础设施的单一争议的视角。CTF 很重要，因为它们适用于每一个数字系统。从水基础设施的数字方面到卫星再到工业中使用的
    IT，数字基础设施的每个维度都通过游戏进行了分析。CTF 很重要，因为它们是数字基础设施之上的基础设施。每年有超过 10,000 场 CTF 被举行，重大赛事中有超过
    30 支队伍和超过 200 名玩家参与。这就是定量科学计量学的规模。


    CTF 锦标赛中通过的计算机基础设施的庞大规模将漏洞复制提升到政治经济的规模。如果参与者决定在 CTF 上免费分享漏洞，而不是出售它或保密，这就是一种重大的知识政治。它被日常知识所遮蔽（Voß
    et al., 2022），甚至经济科学也很少将漏洞视为经济商品。然而，CTF 游戏的简单事实、其可及性和壁垒构成了数字基础设施的隐藏政治。STS、黑客研究和安全研究应与数字基础设施并行进行。或许没有比这更好的视角来深入了解原本隐藏的数字安全细节。计算机安全提供了评估数字基础设施中全球社会认识论的独特机会。


    In 1933, Ludwik Fleck noted, “There is no scientific cognition that is not a cultural
    cognition”. If so, then social processes like CTFs should be understood if not
    as science of computer security in a narrow sense, then as practices that at least
    share some social functions with science, as exemplified in 第 2 章.


    Maxigas 和 Soderberg 所称的 recuperation 基本上是雇主搭便车于研究者对自己手艺的热情的一种方式。这也在科学社会学中的批判性理论中得到反映：实验室民族志学者如
    Fleck、Latour、Knorr-Cetina、Collins、Larmont、Wagner 以及许多其他我仍认为对本书有启发性的人所见证并赞叹的在实验室花费的无数小时，我这一代人也将其理论化为自我剥削。正如我采访的一位
    post-burnout devop 和安全研究者所说：“Passion, emotions, curiosity, cognitive fever, all-nighters,
    beauty of the puzzle, high stakes of covered problems, camaraderie, prestige or
    rivalry are great but in the end of the day count your work hours and look at
    the payslip”。我无法证实也不能否认这位受访者目前正在撰写对 Das Capital 的评论。


    57. 我同意 Maxigas 和 Soderberg 关于使用 recuperation 框架的观点，因为在网络安全背景下，它关乎改变基础设施和数据化尝试，这些对他人的生活和劳动至关重要。CTF
    不应被解释为资本的简单操纵，吸血般地掠夺黑客文化并将其榨干。不，在这个隐喻中，与非正式、叛逆甚至更加政治化的黑客的联系被保留为机构的接口，作为共享招聘池的一种方式，也是个人非货币化动机的来源。


    ## 注释


    1. Shodan 这个名字最初来自 1994 年的计算机赛博朋克游戏“System Shock”并不令人惊讶。在该作品中，Shodan 是邪恶的 AI，与黑客主角之间存在一种技术中介的
    BDSM 副性关系。此外，Shodan 还想毁灭世界。返回正文.⏎

