- raw: "In conclusion, I return to the larger picture. On the macro-scale of transnational\
    \ infrastructure, CTFs restructure politics and economics in a multitude of ways.\
    \ As the need for information security specialists rises, CTFs are still essential\
    \ to the self-education and self-identification of security specialists with the\
    \ hacking culture. This may be read as gamification of the hacking culture by\
    \ corporate and military actors and understood as an example of recuperation and\
    \ depoliticisation. At the same time, this also means that information security\
    \ has become more accessible and inclusive. If hacking practices described by\
    \ Maxigas and Söderberg could be considered workers’ resistance, then CTFs could\
    \ be interpreted as gamified and inconspicuous strike-breaking mixed with widening\
    \ the workforce through education and unpaid affective labour.\n\nHowever, I believe\
    \ that the politics of exploits reach much farther, both in materialised and social\
    \ form. I outlined only the implications of seemingly neutral trading zones ([Gorman,\
    \ 2010](#bibliography.xhtml#_24044-2003_chp005_ref56)) for security studies. From\
    \ the historical studies of laboratories in electronics ([Galison, 1997](#bibliography.xhtml#_24044-2003_chp005_ref52)),\
    \ it is recognised that the research time-space “in-between” of institutions may\
    \ gain political dimensions not despite but precisely because of apparent neutrality.\
    \ Moments such as perhaps illusory depoliticisation during the replication of\
    \ an exploit to the temporary infrastructures look like the perfect equivalent\
    \ of such trade in the scale of the individual, singular exploit. The infrastructures\
    \ played through CTFs are not “real”, they are only equivalents of terrains and\
    \ props for the game. This particular gamification removes political and moral\
    \ stakes and allows to examine exploits as “pure, objective problems”. This makes\
    \ CTFs a very special examples and instances of social structures equivalent to\
    \ the laboratories discussed in [Chapter 2](#ch02.xhtml#_24044-2003_ch002). Reframing\
    \ politics through gamification comes symmetrical with laboratory demarcation.\
    \ What was invoked for the purpose of the game, leads to very tangible material-digital\
    \ reconfigurations of the infrastructure, not because the play changed infrastructure\
    \ per se, but because it changed socio-political relations, which reconstituted\
    \ a new arrangement of infrastructural vulnerabilities.\n\nHow do such reconfigurations\
    \ matter for more significant shifts at the scale of transnational processes and\
    \ political economies?\n\nIs it hard to conceive that at least some digital infrastructures\
    \ cannot stagnate technically and economically because of CTFs? Would it be enough\
    \ to sustain at least some of the dialectics of critique and recuperation of surveillance\
    \ capitalism (Zuboff, 2020), even though the initial catalysing spark of “Californian\
    \ Ideology” took place in the 1990s ([Barbrook & Cameron, 1996](#bibliography.xhtml#_24044-2003_chp005_ref8))?\
    \ In this chapter, I have provided arguments for at least stating such questions\
    \ in the STS debate. The CTFs are the dialectical paradox: they are the socio-epistemological\
    \ stabilisation for replication of instabilities in the digital infrastructures.\
    \ They serve social and epistemic functions of laboratories,  56. blending advanced,\
    \ vocational, “lab bench” training with the function of replicating the knowledge.\
    \ It is through CTFs that institutions of cybersecurity have some common understanding\
    \ of the field, without the need for exchanging business, legal or any official\
    \ communications.\n\nDue to their obscurity, CTFs are easy to discard as irrelevant\
    \ minutiae or as “just a leisure activity for the field”, with little relevance\
    \ to moguls like Google or concepts as broad as techno-feudalism ([Varoufakis,\
    \ 2023](#bibliography.xhtml#_24044-2003_chp005_ref167)). They are far from the\
    \ user’s perspective or even the perspective of a singular controversy over digital\
    \ infrastructure. CTFs matter because they are available for every digital system.\
    \ Every dimension of digital infrastructures was analysed through the games, from\
    \ digital aspects of water infrastructure through satellites to IT used in industry.\
    \ CTFs matter because they are infrastructure over digital infrastructure. Over\
    \ 10,000 CTFs are played yearly, with more than 30 teams and more than 200 players\
    \ playing major events. This is the scale of quantitative scientometrics.\n\n\
    The sheer scale of computer infrastructure passed through the CTF tournaments\
    \ elevates exploit replication to the scale of political economy. If participants\
    \ decide to share an exploit for free on a CTF, rather than selling it or keeping\
    \ it secret, this is a significant politics of knowledge. It is obscured from\
    \ everyday knowledge ([Voß et al., 2022](#bibliography.xhtml#_24044-2003_chp005_ref170)),\
    \ and even economic sciences rarely consider exploits as economic goods. Yet,\
    \ the simple fact of CTF games, their accessibility and barriers constitute the\
    \ hidden politics of digital infrastructures. STS, hacking and security studies\
    \ should be conducted on par with digital infrastructures. Perhaps there is no\
    \ better scope into the details of otherwise hidden minutiae of digital security.\
    \ Computer security provides a unique opportunity to assess global social epistemology\
    \ in digital infrastructures.\n\nIn 1933, Ludwik Fleck noted, “There is no scientific\
    \ cognition that is not a cultural cognition”. If so, then social processes like\
    \ CTFs should be understood if not as science of computer security in a narrow\
    \ sense, then as practices that at least share some social functions with science,\
    \ as exemplified in [Chapter 2](#ch02.xhtml#_24044-2003_ch002).\n\nWhat Maxigas\
    \ and Soderberg called recuperation is basically a way of freeloading of employers\
    \ on researchers’ passion in their craft. This is also mirrored in critical theorising\
    \ in sociology of science: countless hours spent in laboratory witnessed and marvelled\
    \ by ethnographers of the laboratory, such as Fleck, Latour, Knorr-Cetina, Collins,\
    \ Larmont, Wagner and many others I still find inspirational for this book, my\
    \ generation theorise also as self-exploitation. As I interviewed one post-burnout\
    \ devop and a security researcher: “Passion, emotions, curiosity, cognitive fever,\
    \ all-nighters, beauty of the puzzle, high stakes of covered problems, camaraderie,\
    \ prestige or rivalry are great but in the end of the day count your work hours\
    \ and look at the payslip”. I cannot confirm nor deny that this interviewee is\
    \ currently writing their comments on Das Capital.\n\n 57. I agree with Maxigas\
    \ and Soderberg about using the framework of recuperation, because in the context\
    \ of cybersecurity it is about changing infrastructures and datafication attempts\
    \ vital for lives and labours of the others. CTFs should not be interpreted as\
    \ simple machinations of capital, vampirically poaching over hacking culture and\
    \ bleeding its dry. No, in this metaphor, the connection with informal, rebellious\
    \ and even much more politicized hacking is left as interface for institutions,\
    \ as a way of sharing recruitment pool and as a source for individual non-monetary\
    \ motivation.\n\n## Notes\n\n1.  It is no surprise that the name Shodan originally\
    \ comes from the 1994 computer cyberpunk game “System Shock”. In this title, Shodan\
    \ was maleficent AI involved in a technology-mediated BDSM parasexual relation\
    \ with the hacker-protagonist. Also, Shodan wanted to destroy the world. [Return\
    \ to text.⏎](#ch03.xhtml#R_24044-2003_chp003_en001)"
