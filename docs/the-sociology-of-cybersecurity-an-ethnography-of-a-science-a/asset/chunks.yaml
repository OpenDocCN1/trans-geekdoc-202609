    它不仅使数据集或计算机消失、显现或碎片化，还使整个社会、科学、历史和抽象可能性消失、显现或碎片化。正因如此，理解其实验室、职业和思想共同体中的跨国、地震式变化，是社会学者的任务。


    如果这听起来太严肃了，就等到关于计算机安全电子竞技的章节吧。


    ## 注释


    1. 公平使用是对法律辩论的定案，规定在数字系统上可以合法做什么以及何种行为构成知识产权侵权。它可能涉及软件、游戏机、振动器、加密系统或农业拖拉机。经验法则上，欧盟对公平使用的理解更为宽泛，因此黑客和消费者在动手改装等方面拥有稍多的自由等。它与维修权以及社区为其所购基础设施提供维护的能力密切相关。返回正文。⏎


