    1. 准确地说，我将特纳的两种思路简化为一种：一种关于反结构以及游戏在社会行动中的作用（Turner, 2008）和一种关于表演及其作用（Turner, 1995）。幸运的是，这两条思路并非相互排斥而是互补的。应记住，表演性社会行动中对可接受的规则破坏的无声协调与协商，是社会科学和认知科学中的一个复杂问题（Chałupnik,
    2023; Muntanyola-Saura, 2022）。返回正文。⏎


    2. 理论上的简化与抽象用于更清晰地解释一个概念，而在现实生活中该概念确实以这种清晰的形式出现。它可以被理解为社会学、韦伯式的、用于网络安全、数字营销和一般信息技术中的一种人格的先驱。返回正文。⏎


    3. 80. 这是一种概括，但至少对于二十国集团而言，我找不到在 2014–2025 年期间没有因公共 IT 采购而出现重大腐败丑闻的国家。返回正文。⏎


    4. 我将网络安全的证券化理解为为承保网络安全威胁而设计的证券和保险市场的发展。网络安全的证券化在精算科学中已被认可，但在本书所涵盖的社会科学中尚未得到探索。通过将注意力转向这一片段，我希望为现有的知识空白做出贡献。返回正文。⏎


    5. 我知道 ISO 27001 存在，以及其他几种。关键问题不仅在于标准的起源，还在于关键国家行为体及其权力精英的政治意愿。网络效应，记住吗？返回正文。⏎


    6. CVE、CVSS 等系统学值得在科学研究中开展专门项目。本节应被视为对研究网络安全的社会科学同事的主题介绍。返回正文。⏎


    7. TESCREAL 是一个由意识形态组成的缩写：超人类主义、扩张主义、奇点主义、宇宙主义、理性主义、有效利他主义和长远主义。即使该缩写由几个模糊、道德负载且乌托邦的概念组成，那么预测慈善晚会、税收减免和美丽的抽象数学建模就很容易。它导致了糟糕的后果，从向富裕捐赠者提出的种族灭绝幻想到工作场所自伤和谋杀案件。正如人们可以想象的那样，末日类宗教、置大众于不顾的、“让我们考虑优生学”的邪教很少在长期内成为关怀的共同体。返回正文。⏎


    81.


    # 5 “颠覆”。歧视。酷儿网络安全。女权主义网络法。反思。


    DOI: [10.4324/9781003396871-6](https://doi.org/10.4324/9781003396871-6) 本章已在 CC-BY-NC-ND
    4.0 许可下发布。


    在整本书中，我讨论了网络安全中不同地理规模、正式程度和制度化程度的群体。地理不仅通过国家边界的限制影响网络安全，也在区域层面产生影响。例如，黑客空间的流行或活跃浪潮不仅与全球劳动外包有关，也与当地士绅化过程有关。自由实验室、黑客空间或网络安全群体使用的其他非正式聚会点，往往在城市空间被改造成更盈利的地产之前充当临时替代品。正式化和制度化过程相互关联，但彼此并不一定遵循相同的方向。例如，当当地大学为
    DevOps 举办非正式讲座时（参见第一章），这些非正式会议可能充当生活实验室或其他更正式的科学参与的探测器。相反，学术或商业机构有意发展较不正式的区域作为当地网络、为感兴趣的干部做宣传或作为承包商招聘池的情况并不少见。一个例子可能是
    Google Campus。另一个例子可能是每月举行的活动，如实验室开放日，其目的正是作为学术界与从业者之间的交易区。


    在本章中，我既希望纠正，也希望展示前几章中概括的局限性。正式性、制度化和地理仍然重要，但我的重点不会放在交易区，也不会放在为更有结构的行动者利用非正式性的过程中。


    在本章中，我感兴趣的是挑战至少部分权力精英利益的做法。接下来，我也感兴趣的是那些不能 neatly 归入上一章重建中的做法。我希望检验至少一小部分从领域内部和外部挑战权力精英的做法。如本书所有案例一样，该清单是不完整的，不应被视为确定或具有代表性。


    理解替代性或转型性实践在社会学上很重要。没有任何知识领域是静态的，也没有任何知识领域不尝试挑战、酷儿化或重定向其社会构成。82. 因此，理解这些社会逆流对于本书的目标至关重要。正如对基础设施的任何抽象一样，社会结构如果没有我所称的稳定化的不稳定，就不应被认为是有意义地被理解。在这种精神下，本章以尝试将我的理论概念作为反思我自己民族志的工具来结束我的书。如果不是出于更好的理由，至少是为了打开我的思考，让其面对替代方案、裂缝和失败，就像数字基础设施必须经过彻底的暴露以进行测试一样。


    在整个研究过程中，受访者使用了不同的代词、不同的性别、种族和工作场所中的位置。边缘和非霸权视角很重要，因为从认识论上讲，重要的是要表明权力精英并不完全控制网络安全这一科学领域。


    出于必要，每个部分更接近于轶事而非更长的理论化。相反于对工作场所中排斥、酷儿或种族歧视进行理论化，我更愿意说明这种民族志如何能为每一种视角做出贡献。


    第一节讨论了网络安全实验室的民族志，其背景是科学、技术、工程和数学（STEM）的各种形式的排斥。排斥可能来自性别，也可能来自种族、财富或心理因素。第二节讨论了一个酷儿黑客行动主义案例，以突出其对发展网络安全科学公众理解概念的重要性。第三节提供了一个关于网络安全科学与研究人员个人情感之间联系的小轶事。最后一节讨论了女权主义网络法的项目，主要关注女权主义网络法与前几节讨论的案例之间的伦理承诺相似性。


    ## 俱乐部反击？网络安全正式与非正式教育之间的排斥社会机制


    当任何科学领域变得接近权力或金钱时，不同形式的社会排斥随之而来。经常讨论的基于性别的排斥并不是唯一一种，也不能为调查少数族裔的排斥或基于阶级的排斥提供通用蓝图。

    '
