    interest like images from video monitoring in Tesla factories, the non-existent
    privacy of workers in nuclear power plants or monitoring feeds from jails in Alabama.


    ## Fragment 5.2 Queer perspectives in cybersecurity


    Trans, queer or other marginal perspectives often find a home in cybersecurity
    because, for this field, identity is the weapon and the question.


    It would be a mistake to forgo maia’s research as relatively simple in technical
    terms. Maia openly admits that it uses very basic tools, like scanning open ports
    with software like Shodan or going through leaked accounts that float in the dark
    web. This relative simplicity has a provocative, exhibitive and invitational value.
    By maia’s practices cybersecurity becomes banal, obnoxious, casual, un-serious.
    This is collectivisation of knowledge by queering it, to make the knowledge everyday,
    funny, absurd and accessible. It is the opposition of MITRE and political theology
    of devils. Yet, maia’s hacktivism and research surpasses and queers also the Donna
    Haraway’s cyborg manifesto ([Haraway, 2006](#bibliography.xhtml#_24044-2003_chp005_ref60))
    or defies the simple definition of a public interest hack by Allison Powell ([Powell,
    2016](#bibliography.xhtml#_24044-2003_chp005_ref119)).


    To regard maia as Haraway’s cyborg would be to miss the post-Snowden era and to
    erase maia’s criminal persecution and her deliberate political framing as an anarchist.
    To frame maia’s research into public interest would be to take its anarchism ([crimew
    arson, 2024](#bibliography.xhtml#_24044-2003_chp005_ref39)) as an act of citizenship,
    which appears to me as unethical.


    Maia’s hacktivism was prosecuted by the United States legal system. She was sentenced,
    and an international extradition letter was issued in 2021. Maia openly talked
    about its fear of imprisonment, which shows that openness about vulnerability
    may be a sharing strategy among queer, feminist and other cybersecurity researchers,
    who engage from the perspective of disadvantage. At the same time, emotional honesty
    and vulnerability are hard to misuse by the judicial system of the power elite,
    as even ex-FBI profilers get trapped in the honeypot / infinite regress debate
    I mentioned before ([Kappa, 2025](#bibliography.xhtml#_24044-2003_chp005_ref79)).
    Instead of taking maia’s identity as it is and moving to the effects, influence,
    political resonance or any other more interesting subject, profilers get lost
    in layers and layers of irony, camp, pastiche and references to references.


    While I do not share their interest in criminalising maia, I can at least reconstruct
    the perspective of law enforcement as well as of some cybersecurity researchers
    who refuse to differentiate between hacktivism and a cybercrime of attack on digital
    infrastructures. It is hard to attribute an action in this field, and even a public
    declaration is not a proof of the action. Within this framework, queer and anarchist
    politics are easily discounted as false-flags for the actions of other nation-states
    or rival factions of power elites.


    For example, consider the public panic about the danger posed by China to the
    technological supremacy of the US. If rephrased in a language of cultural theory,
    gender and colonial aesthetics that are often associated with the symbolism of
    a cyborg through debates in the Global North, they were used as a form of gender
    weaponisation by the attacks attributed to the China Girl Security Team, a large
    fan-based crowd led by hacker-idols like Xiao Tian. The cyborg-gender performative
    aesthetics of Xiao Tian spread through social media like a wildfire, drawing attention
    just like later maia arson crimew did. The attention of the gender-cyborg brought
    interest not only in the actual attacks, for which Xiao Tian took responsibility,
    but also inspired her followers to study cybersecurity.


    What Long T Bui theorised in terms of gender studies as a reconfiguration of the
    Chinese woman in the age of digital penetration ([Bui, 2015](#bibliography.xhtml#_24044-2003_chp005_ref20)),
    equally functioned as a recuperation of such performatives by the Chinese state
    and a play with gender with another power elite, this time seemingly in opposition
    to the interests of the US.


    I do not believe that maia arson crimew did what it did as a sock-puppet or as
    a smoke screen for an operation of another nation-state. That is irrelevant to
    my theorisation. What is important is to understand that queer and gender performatives
    of cybersecurity are also recognised and under recuperation by at least some state
    actors in scales and contexts that previously escaped.


    This leads to a new paraphrase of an older thought by Katherine N. Hayles ([Hayles,
    2006](#bibliography.xhtml#_24044-2003_chp005_ref62)), this time in the context
    of my ethnography. Performativity of gender and performativity of cybersecurity
    blend together, making the figure of a cyborg even more unfinished and elusive
    than ever.


    When cybersecurity becomes science, broken into standardised databases and automated
    detection systems, queer performatives of cyborgs turn to weapons, counteractions,
    or obfuscation as well as practices of care.


    ## Feminist Cyberlaw and Feminist Cybersecurities. In Search of Alternatives.


    My project focused on a scientific aspect of cybersecurity as practices closer
    to mathematics or computer sciences. It would be a mistake not to mention at least
    two other aspects. The first one is the concept of feminist cyberlaw. The second,
    the conceptualisations of feminist cybersecurity in international relations.


    The concept of feminist cyberlaw was developed by the group around Amanda Levendowski
    ([Levendowski, 2022](#bibliography.xhtml#_24044-2003_chp005_ref85)). Feminism
    in this context is understood as emphasising the importance of consent, safety
    and accessibility.


    Levendowski focused on the issues of law particular to the US, such as the Computer
    Fraud and Abuse Act (CFAA). Levendowski discussed an attempt to make a precedent
    through an interpretation of the CFAA to make any misuse of Terms of Service of
    computer software or hardware a criminalised offence. This precedent was brought
    before the US Supreme Court. What was crucial, Levendowski observed, was the fact
    that the US Supreme Court declined to consider “exceeding authorised access” a
    federal crime.


    This left a wider gap for labour activism, anti-discrimination research and cybersecurity
    research but made it harder to persecute unauthorised disclosure of naked pictures
    or to act against stalking, which often combines real-world tracking and violent
    fiction. Despite political changes, Levendowski’s project gathered interest from
    other scholars and practitioners, which recently led to an edited volume ([Jones
    & Levendowski, 2024](#bibliography.xhtml#_24044-2003_chp005_ref76)), which expanded
    on feminist cyberlaw theory on fundamental issues like race, abortion and disabilities.

