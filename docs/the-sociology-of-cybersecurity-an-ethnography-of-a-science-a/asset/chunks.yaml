    be obvious, granted or (socially) invisible.


    Were there any counterproposals or critiques? Recent debates on the “infrastructural
    turn” ([Hesmondhalgh, 2021](#bibliography.xhtml#_24044-2003_chp005_ref71)) reveal
    some unresolved issues. For example, critique often emphasises that IT overemphasises
    social studies instead of examining the material underpinnings of power relations
    ([Sandvig, 2013](#bibliography.xhtml#_24044-2003_chp005_ref131)). Second, a strain
    of critique points out a lack of interest in the debate on the broader political
    economy of infrastructure([Hesmondhalgh, 2021](#bibliography.xhtml#_24044-2003_chp005_ref71),
    p. 13). This problem was due to the scale of infrastructure, as over-focus on
    the minutiae led to losing the “scale effect” brought by the infrastructure.


    I wish to engage in a theoretical discussion of STS using data from an ethnographic
    study of digital infrastructure. Both the theory of infrastructure and the details
    of digital infrastructure can be complex. This chapter is less interested in privacy
    imaginary ([Rommetveit & van Dijk, 2022](#bibliography.xhtml#_24044-2003_chp005_ref135)),
    instead, studying the obscure backbone of such imaginaries. I am less interested
    in providing a case study of a singular security error as an infrastructural exception.
    CTFs 41. often escape straight institutional categorisations, but, nevertheless,
    they form repeatable patterns occurring alongside digital infrastructure.


    Because I am interested in discussing theory using fieldwork, I present my theoretical
    toolbox and the role of each concept. In the first part, I return to the critique
    of IT ([Hesmondhalgh, 2021](#bibliography.xhtml#_24044-2003_chp005_ref71); [Sandvig,
    2013](#bibliography.xhtml#_24044-2003_chp005_ref141)) and theoretical synthesis
    ([Lee & Schmidt, 2018](#bibliography.xhtml#_24044-2003_chp005_ref90)). This narrows
    the understanding of infrastructure and points to some jarring issues. The discussion
    also lets me situate my proposal and provide some working concepts. In the second
    part, I outline the basics of critique and recuperation theory from *A New Spirit
    of Capitalism* ([Boltanski & Chiapello, 2007](#bibliography.xhtml#_24044-2003_chp005_ref16)).
    This is useful as a rudimentary political economy but also serves as a link with
    other studies on hackers, digital infrastructure and security. In the third part,
    I introduce the basic concept of CTF hacking tournaments, showing their connection
    with the political and economic moguls of the Internet. In the fourth part, I
    show how CTFs stratify different echelons of hackers. Finally, I discuss a detailed
    replication of the anomaly in the infrastructure and its theoretical details.


    ## Recuperation and Infrastructure


    The concept of recuperation was introduced by [Boltanski and Chiapello (2007)](#bibliography.xhtml#_24044-2003_chp005_ref16)
    in their book *The New Spirit of Capitalism*. It describes a never-ending process
    through which capitalism is renewed through its critique. Recuperation was used
    by Boltanski and Chiapello to explain capture of the critique after the 1968 revolts
    in France. Later, it was extended to studies of hacking and digital capitalism
    ([Söderberg & Delfanti, 2015](#bibliography.xhtml#_24044-2003_chp005_ref150)).


    According to [Boltanski and Chiapello (2007)](#bibliography.xhtml#_24044-2003_chp005_ref16),
    network geometry was crucial in shaping post-World War II visions of a critique
    of capitalism in France. Earlier generations viewed the workplace as hierarchical
    and organised under Fordist production models. Post-war managers were influenced
    by military and information technology, so they emphasised flat, networked structures.
    In popular mythos, networked structures are more resilient to attack than hierarchies.
    With resiliency came more freedom for individual expression and more space for
    individual initiative and growth. Arguments like those changed the popular mindset
    from which artistic and social critique emerged.


    The notion of “recuperation” describes the conditions under which capitalism captures
    its critique to reinvigorate the productive spirit of capitalism and reshape new
    regimes of accumulation and exploitation. In this sense, the history of capitalism
    is the history of critiques and recuperations.


    My proposal diverts from Boltanski and Chiapello. Instead of focusing on the “spirit”
    and seeking causes for dynamics, I ask: What happens with critique and recuperation
    when they operate as mediated on the scales of digital infrastructures? What are
    the epistemological consequences for thought collectives?

