  fmt: '

    Since this section aspires to intersectionality ([Collins i in., 2021](#bibliography.xhtml#_24044-2003_chp005_ref38)),
    I share the following perspective from gender studies of science. Different regional
    contexts shape understanding between feminism and science ([Eren, 2022](#bibliography.xhtml#_24044-2003_chp005_ref50)),
    because feminist thought is what people relate with, use and refer to in their
    actions and not a systematised, universal corpus of knowledge.


    Within this intersectional perspective, what seems to repeat between different
    kinds of experiences of discrimination as reported by interviewees can be understood
    as the “clubhouse model”. Within a clubhouse exclusion mechanism, discrimination
    comes from two mutually reinforcing sources 83. that together structure self-efficacy,
    motivation and other individual factors ([Msambwa i in., 2025](#bibliography.xhtml#_24044-2003_chp005_ref114))
    impacting both formal and informal education.


    The first source is difference in access to experimentation. This is understood
    not simply as access to the laboratories or equipment but, more importantly, as
    social acceptance for failure, misuse and unexpected use of computers, instruments,
    etc. This is important because failure and punishment for it contributes to the
    sense of self-efficacy, which is recognised ([Wong, 2016](#bibliography.xhtml#_24044-2003_chp005_ref176);
    [Wong i in., 2024](#bibliography.xhtml#_24044-2003_chp005_ref177)) as a psychological
    metric intersecting the impact of colleagues ([Toh & Watt, 2022](#bibliography.xhtml#_24044-2003_chp005_ref161)),
    perception of self-belonging ([Veldman i in., 2021](#bibliography.xhtml#_24044-2003_chp005_ref168))
    or career aspirations in the high school period ([Hamer i in., 2023](#bibliography.xhtml#_24044-2003_chp005_ref64)).


    The second source comes from the function of role models, understood both as cultural
    references and as a structure of social contacts with people more experienced
    in the field ([Hamer i in., 2023](#bibliography.xhtml#_24044-2003_chp005_ref64)).
    For example, even in a case as favourable as an individualised mentoring program
    for girls in STEM, survival analysis has shown that mentees with access to a program-wide
    network of support and information were less likely to drop out of the mentorship
    relation than those with a single support. In other words, it is not only about
    role models, or even mentors, but also about the ability to validate the individual
    perception of hardships with others and to learn from the experiences of peers.
    Mentors matter, but they matter the most when mentees can talk about their personal
    issues, including issues with their mentors, with other mentees.


    Both sources occurred repeatedly throughout the talks and interviews with women
    security researchers as well as throughout interviews with researchers or students
    of computer security that come from ethnic minorities or economically disadvantaged
    homes.


    Fragment 5.1 Experience of gender discrimination as reported by a woman working
    in cybersecurity healthcare IT research. As reported this case, liminal space
    between two fields offers a respite from discrimination that would have been more
    present in either. [Return to text.⏎](#ch05.xhtml#R_24044-2003-005-001)


    Consider [Fragment 5.1](#ch05.xhtml#_24044-2003-005-001), what the interviewee
    called “the acrid pressure” is exactly what erodes a sense of self-efficacy, on
    the one side, and reduces joy and satisfaction from experimentation, on the other.
    What is also important, 84. reading from this interview, is that exclusion mechanisms
    do not have to be necessarily associated with a singular traumatic event. Everyday
    corrosion of self-efficacy is as destructive as singular events.


    While the studies I cited come from general research on STEM discrimination from
    formal education, I consider the clubhouse model as especially relevant to cybersecurity.
    Simply speaking, discrimination by “do-it-yourself” or “do-it-with-others” matter
    especially for this field because, at some point in becoming a cybersecurity professional,
    one has to solve some security problems on their own, either in code, in law,
    in documentation or in interpersonal communication within the company.


    The name comes from the ethnography and historical study of woman programmers
    and hackers in a prestigious educational institution done by Allan Fisher and
    Jane Margolis ([Margolis & Fisher, 2003](#bibliography.xhtml#_24044-2003_chp005_ref97)).
    Margolis and Fisher worked with women computer science degree students from 1995
    to 2005, so not all of their findings can be applied in 2025. This is why I interpreted
    interviews not only through the work of Margolis and Fisher but also through additional
    reading on contemporary psychology and sociology of STEM exclusion, at least in
    major reviews.


    While the works of my colleagues who studied different dimensions of hacking than
    gender ([Fox i in., 2015](#bibliography.xhtml#_24044-2003_chp005_ref54); [Hunsinger
    & Schrock, 2016](#bibliography.xhtml#_24044-2003_chp005_ref67); [Lindtner, 2015](#bibliography.xhtml#_24044-2003_chp005_ref86);
    [Mauro, 2022](#bibliography.xhtml#_24044-2003_chp005_ref99)) suggest that the
    clubhouse mechanism may also apply to cases of economic, ethnic or transgender
    issues, I wish to leave my modification of the clubhouse mechanism for further
    verifications.


    I also wish to emphasise that feminist, LGBTQ and other inclusive-minded hacking
    and/or cybersecurity self-educating groups made a lot of contributions in inclusivity
    and that in many local, regional and national contexts, institutional or individual
    discrimination, violence or other forms of exclusion may have different forms
    and provoke different community responses.


    I proposed a simplified model, not to provide an exhaustive account of the experience
    of the interviewees, but to suggest a tool that can be relatively easily translated
    into standardised large-scale psychological or sociological measurements or institutional
    policies by the interested parties. This choice was made in agreement with interviewees
    who shared their experience on discrimination but preferred anonymity.


    ## Queering Cybersecurity. Feminist and Queer Vulnerability Research.


    As feminist, diversity and queer perspectives gained popularity in mainstream
    IT, the push for exploration of queer perspectives followed. Understandably, computers
    have been understood as the space for the second self for young people ([Turkle,
    2005](#bibliography.xhtml#_24044-2003_chp005_ref163)), a space-time-activity where
    they could experiment with their identities in interactions. What changed, both
    in self-reflections of 85. the feminist activists such as Ada Collective, Gerwani
    Collective ([Wuschitz & Reza, 2021](#bibliography.xhtml#_24044-2003_chp005_ref178))
    or Maria Lab and in scholarship^()


    In this short section, I wish to discuss one selected case of cybersecurity research
    that will also serve as an interesting illustration of the uses and paradoxes
    of the queer perspective.

    '
  trans: '

    由于本节追求交叉性（Collins i in., 2021），我分享以下来自科学性别研究的视角。不同的区域语境塑造了人们对女权主义与科学之间理解的差异（Eren,
    2022），因为女权思想是人们在行动中关联、运用并引用的东西，而非一套系统化、普世的知识体系。


    在这种交叉性视角下，受访者报告的不同歧视经历之间似乎重复出现的现象可以理解为“俱乐部模式”。在俱乐部排斥机制中，歧视来自两个相互强化的来源 83.，它们共同塑造自我效能、动机以及其他个体因素（Msambwa
    i in., 2025），影响正式教育和非正式教育。


    第一个来源是实验机会获取上的差异。这不仅被理解为对实验室或设备的获取，更重要的是对失败、误用以及对计算机、仪器等的意外使用的社会接纳。这很重要，因为失败及其惩罚会促成自我效能感，而自我效能感被认为是（Wong,
    2016；Wong i in., 2024）一种心理指标，它与同事的影响（Toh & Watt, 2022）、自我归属感的认知（Veldman i in.,
    2021）或高中时期的职业抱负（Hamer i in., 2023）相交。


    第二个来源来自榜样的功能，榜样既被理解为文化参照，也被理解为与领域中经验更丰富的人建立社会联系的结构（Hamer i in., 2023）。例如，即使在像针对
    STEM 领域女生的个性化导师计划这样有利的情况下，生存分析也显示，能够获得项目范围内的支持和信息网络的学员，比仅有单一支持的学员更不可能退出导师关系。换句话说，问题不仅在于榜样，甚至不仅在于导师，还在于能够与其他人一起验证个人对困难的感知，并从同伴的经验中学习。导师很重要，但当学员能够与其他学员谈论自己的个人问题，包括与导师之间的问题时，导师的作用最为关键。


    这两个来源在与女性网络安全研究人员的谈话和访谈中反复出现，也在与来自少数族裔或经济弱势家庭的计算机安全研究人员或学生的访谈中反复出现。


    片段 5.1 由一名从事网络安全医疗 IT 研究的女性报告的性别歧视经历。据此案例所述，两个领域之间的阈限空间提供了喘息之所，否则在任一领域中歧视会更为明显。返回正文.⏎


    请考虑片段 5.1，受访者所称的“刺鼻的压力”正是侵蚀自我效能感的一方面，同时也减少了实验带来的愉悦和满足感。同样重要的是，84. 从这段访谈来看，排斥机制不一定与单一的创伤事件相关。自我效能感的日常腐蚀与单一事件一样具有破坏性。


    虽然我引用的研究来自正式教育中关于 STEM 歧视的一般研究，但我认为俱乐部模式对网络安全尤其相关。简单来说，“自己动手”或“与他人一起动手”形式的歧视对该领域尤其重要，因为在成为网络安全专业人士的过程中，某时某刻必须独自解决一些安全问题，无论是在代码、法律、文档中，还是在公司内部的人际沟通中。


    该名称源自 Allan Fisher 和 Jane Margolis 对一所知名教育机构中女性程序员和黑客的民族志和历史研究（Margolis & Fisher,
    2003）。Margolis 和 Fisher 在 1995 年至 2005 年间与女性计算机科学学位学生合作，因此并非所有研究结果都能适用于 2025 年。这就是为什么我不仅通过
    Margolis 和 Fisher 的工作来解读访谈，还通过对当代心理学和社会学中关于 STEM 排斥的额外阅读，至少在主要综述中如此。


    虽然我同事的研究涉及黑客的不同维度而非性别（Fox i in., 2015；Hunsinger & Schrock, 2016；Lindtner, 2015；Mauro,
    2022）表明俱乐部机制也可能适用于经济、种族或跨性别问题，我希望将我对俱乐部机制的修改留待进一步验证。


    我还希望强调，女权主义、LGBTQ 以及其他具有包容性思维的黑客和/或网络安全自学团体在包容性方面做出了大量贡献，并且在许多地方、区域和国家背景下，制度性或个人性的歧视、暴力或其他形式的排斥可能具有不同的形式并引发不同的社区回应。


    我提出了一个简化模型，并非为了全面描述受访者的经历，而是为了提出一种工具，可以由相关方相对容易地转化为标准化的大规模心理或社会学测量或制度政策。这一选择是在与分享歧视经历但希望保持匿名的受访者协商一致后做出的。


    ## 酷儿化网络安全。女权主义与酷儿脆弱性研究。


    随着女权主义、多元化和酷儿视角在主流 IT 中获得流行，探索酷儿视角的推动随之而来。可以理解的是，计算机一直被视为年轻人“第二自我”的空间（Turkle,
    2005），一个时空活动，在其中他们可以在互动中尝试自己的身份。85. 无论是在 Ada Collective、Gerwani Collective（Wuschitz
    & Reza, 2021）或 Maria Lab 等女权主义活动家的自我反思中，还是在学术研究中发生了什么变化^()


    在本节中，我希望讨论一个选定的网络安全研究案例，它也将作为酷儿视角用途和悖论的有趣例证。

    '
