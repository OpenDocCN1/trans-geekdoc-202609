- raw: "Those are two arguments for the relation between informal groups and the cybersecurity\
    \ as a whole. Firstly, informal groups serve as places of education and “maternal\
    \ labs” for experts and freelancers. Secondly, through my ethnographic work among\
    \ informal groups, I was invited to a closed-door consultation workshop by an\
    \ aide of the European Parliament (EP). Hence, the relation: informal groups facilitated\
    \ expertise that was recognised by the transnational political institution of\
    \ the region I conducted my study in. An EP aide was conducting unofficial consultations\
    \ for what later turned out to be one of the resolutions within the General Data\
    \ Protection Regulation (GDPR), an EU act that made a significant change in digital\
    \ markets, including cybersecurity.^()\n\nBut, before discussing global affairs,\
    \ I wish to show how hackerspace enables experiments in a smaller scale. To understand\
    \ [Fragment 1.1](#ch01.xhtml#_24044-2003-001-001), some context may help. As I\
    \ said, we are in a place with numbing techno audio. It is in a basement. There\
    \ are not many people nor much light here. I navigate it because I’m familiar\
    \ with the space. I have been doing ethnography here for several months. I am\
    \ getting around the place, but I still had not found out the relation described\
    \ above. There is a table, two people and a bottle of beer. I recognise the people\
    \ as Speck and Fidel, and the beer is a bitter from wheat and barley malt. The\
    \ beer and the vibes are similar: everything is light and casual with just a drop\
    \ of regional spleen. I won’t drink today, but on another evening, I might have\
    \ joined them. I won’t take notes or make an effort to remember anything on this\
    \ occasion. The evening is young in our hackerspace.\n\nI place myself closer\
    \ to Speck. Both hackers have already openly consented to participate in the research,\
    \ under the condition of anonymisation of company, city and nickname. They will\
    \ have access to source material for this book in the local repository for the\
    \ community I am writing about.\n\nFidel is younger, just finishing a high school\
    \ programme for the mathematically gifted and working part-time for a company.\
    \ He is into cryptocurrencies, the free market and misogyny. Speck is older and\
    \ works full-time in  11. system operations (SysOps). Fidel is stronger in theory\
    \ and network science. Speck has more practice in maintenance and error-handling.\
    \ Fidel is skinny, while Speck is bulky but still welcoming.\n\nThe company they\
    \ both work for is understaffed. Their “urgent/critical to-do list” (backlog)\
    \ gets longer every day. Speck is slowly getting frustrated, as he sees that more\
    \ of his colleagues from abroad pursue careers in development operations (DevOps):\
    \ less concerned with maintenance and more with development. DevOps means better\
    \ pay, more prestige and more engaging tasks.\n\nThey sit on a sofa, split between\
    \ an evening chill-out and a discussion of a server load balancing experiment.\
    \ It will use infrastructure that belongs to the hacking community in order to\
    \ test a hypothesis they are curious about. This is not unusual practice, so the\
    \ community maintains a couple of servers and services with backups, usually accessible\
    \ for such work.\n\nThe experiment cannot be conducted on critical (or “live”)\
    \ infrastructure, such as a membership or fee collection system, but spare servers\
    \ should be made available to them. Both Speck and Fidel are regular members of\
    \ the “space” (abbreviation for hackerspace), so neither of them expects any objections.\
    \ The final decision about the experiment would be made by the server supervisor\
    \ (nickname: Rama) or through community consent during one of the regular weekly\
    \ meetings.\n\nThe results of this experiment are not exactly vital for the professional\
    \ lives of either of them. It is more a matter of professional curiosity or ambition\
    \ to “go beyond being a mindless fucking subcontractor for the Yanks” (translated\
    \ *in vivo* quotation from the talk). Their company refused to give them resources,\
    \ so they experiment in their spare time. In short: servers in this hacking community\
    \ are test beds because engineers have found that it’s easier to set up experiments\
    \ here than to handle the official procedure in companies. As far as I know, no\
    \ internal company data is to be used, only artificial equivalents necessary to\
    \ simulate appropriate conditions (e.g., fake email traffic, fake database queries,\
    \ fake database data consisting of chaff instead of valuable information).\n\n\
    The hackerspace has some spare servers. They aren’t quite high-tech, but they\
    \ are good enough for test purposes. The community acquired them when the local\
    \ telecommunications company was modernising. As the space has some renown in\
    \ the country, people from the telecom passed through and asked if the space wanted\
    \ some stuff. So, the stuff landed in the basement, ready to be used by Speck\
    \ and Fidel (see [Fragment 1.1](#ch01.xhtml#_24044-2003-001-001) for a quote from\
    \ a DevOps from the hackerspace).\n\n## Why Do SysOps Matter?\n\nI will return\
    \ to the rest of the hackerspace evening in a moment, but I have to pause here\
    \ to put some focus on the infrastructure. This is something that is easy for\
    \ a layperson to neglect. As the old adage says: “newcomers talk  12. strategy,\
    \ experts talk logistics”. In this case, strategy means offensive or defensive\
    \ hacking. Logistics means everyday handling of infrastructure.\n\nFragment 1.1\
    \ This is a spontaneous demonstration given by hacker. It examines aspects of\
    \ hackerspace infrastructure. I noticed that hackerspace infrastructure is in\
    \ constant refurbishment and negotiation. For hackers, this is a positive trait,\
    \ as it provides learning opportunities. This is an excerpt that demonstrates\
    \ an initial phase from a longer, repeated pattern of collaboration, not a singular\
    \ example. [Return to text.⏎](#ch01.xhtml#R_24044-2003-001-001) \n\nThis adage\
    \ could be applied to “Science-Technology-Society” (STS)^()\n\nMy strategy for\
    \ understanding the transformation of hacking knowledge into the science of computer\
    \ security is different. My concept of computer security relies on treating it\
    \ as both infrastructure ([Bowker & Star, 2008](#bibliography.xhtml#_24044-2003_chp005_ref17);\
    \ [Star, 1999](#bibliography.xhtml#_24044-2003_chp005_ref157); [Star & Ruhleder,\
    \ 1996](#bibliography.xhtml#_24044-2003_chp005_ref149)) and a mechanism similar\
    \ to scientific facts ([Fleck, 2008](#bibliography.xhtml#_24044-2003_chp005_ref49)).\
    \ This may sound overly complicated and over-theorised, but it is just a way of\
    \ saying that I need to constantly understand the connection between SysOps in\
    \ the subsidiary of the Big Bank in Poland, the Big IT Mogul and the theoretical\
    \ cryptographer at the Big University. Practically, it means that I will have\
    \ to move between concepts from studies of technology and studies of science.\
    \ While they are often taken together, their nuances will soon become important.\n\
    \nTo benefit from some of these nuances, I will use the concept of infrastructure\
    \ as understood by Susan Star and her co-authors ([Bowker & Star, 2008](#bibliography.xhtml#_24044-2003_chp005_ref17);\
    \ [Star, 1999](#bibliography.xhtml#_24044-2003_chp005_ref147); [Star & Ruhleder,\
    \ 1996](#bibliography.xhtml#_24044-2003_chp005_ref149)). They noted several socio-material\
    \ traits of infrastructure that I took special interest in during my fieldwork,\
    \ and I wish to develop these conceptually through the book."
