  trans: '

    虽然我对心理和治疗干预只有近似的熟悉程度，但我仍想提出一个假设：网络安全专业人员的压力和倦怠是双重的。第一个要素与对基础设施的社会和物质实践的自我依附有关；他们感到压力，因为他们个人觉得自己在违反社会规范。第二个要素与与工作相关的自我感有关，因此这可能是做安全、维护或照护工作与感到聪明、有能力或谨慎之间的一种半意识联系。虽然该假设尚未针对网络安全防御、维护和研究专业人员得到验证，但来自医生、护士以及其他与患者接触的健康和生物化学研究人员的倦怠研究证据表明，职业倦怠即使在相似的机构中也常有差异（Messias
    et al., 2019）。这段离题已经太长，无法详细讨论科学职业中的倦怠问题，但我想补充的是，在物理学领域（与网络安全相比要更加连贯和被更好地理解！），通过前几代人的纵向研究所看到的轨迹和倦怠也存在差异，更主要的是由于情感工作量而非初始条件（Hermanowicz,
    2009）。


    为什么这次心理上的离题很重要？因为即使我的假设不一定对一个显著的群体规模成立，自我的依附和横向机制与基础设施之间的关系为解释为什么关于稳定不稳定性的辩论常常采取公共表演的形式提供了解释。


    将稳定不稳定性概念化为表演，我间接地指涉了著名密码学家和网络安全专家 Bruce Schneier 的一个概念。Schneier 创造了“安全剧场”这一短语（Schneier,
    2009），用来描述为向公众灌输安全感而进行的行动，但它们并不会主动改善安全。安全剧场以这种方式被执行，以改善对当局的信任或尊重，或使他们看起来像是在行动。


    然而，这对于我的理解来说是不够的。稳定不稳定性不必被公众理解甚至公开知晓就能对基础设施产生改变。然而，公众，至少是全球英语圈以及其中一些被翻译成其他语言的版本，仍然对黑客着迷，将其视为智者-法师的社会文化前身。这是自我反思，正如那些对自身文化表征进行理论化的网络安全研究者所描绘的那样（Adams
    et al., 2020）。人们可以整天对表征或文化理论进行讽刺，但社会学问题仍然存在：为什么公众通过这些原型来理解安全专业人员，以及这对公众对稳定不稳定性的理解——作为公众理解科学的一个特定子类型——有什么后果？社会事实不会仅仅因为它很荒谬就停止成为研究问题。


    第一个线索由 Steven Shapin 和 Simon Schaffer 在 1980 年代提出，他们考察了罗伯特·波义耳在 17 世纪进行的真空泵的公共实验的历史（Shapin
    & Schaffer, 1985）。与物理学通史中流行的说法相反，实证证据和实验在改变科学共识方面进展缓慢。波义耳的实验总是落后于由托马斯·霍布斯提出的理论批评，霍布斯被誉为政治论著
    *利维坦* 的作者和政治家。正如 Shapin 和 Schaffer 所展示的那样，对波义耳成功至关重要的是他如何将实验和认识论实践融入社会政治实践中。波义耳不仅将真空泵实验完善为拥有大量观众的实验剧场，而且还将他的仪器捐赠给享有盛誉的研究机构，并教授他人如何复制演示。最后，这种教育影响后来被标准化并保持质量，得益于波义耳坚持详细的报告、插图的精确性和对错误和失败的诚实报告。虽然这些原则对从事研究或学术出版的许多人来说不应令人惊讶，但随着网络安全科学公众理解问题的复杂性日益增长，保持这些原则在
    mind 中很重要。


    我通过将 Shapin 和 Schaffer 与稳定不稳定性进行比较所想强调的，不仅仅是不同实验科学之间问责制和严谨性的一般原则的相似性。不，波义耳的案例对网络安全来说还有其他几个原因更为重要。首先，在我的理解中，稳定不稳定性是实验剧场中演示的社会等价物。它们通常是“今日新闻”：在工作场所流传但对确切理解有限。它们有助于产生焦虑或暂时的政治决策，但很少见到完全的公众理解和公众
    closure 的等价物。


    例如，考虑 Pegasus 的使用案例，这是一种进攻性网络安全工具，被多个国家（包括波兰、以色列、墨西哥、印度尼西亚等）购买并用于窃听政治对手和合法抗议（Richard
    & Rigaud, 2024）。Pegasus 是由调查新闻集体 Forbidden Stories 和安全实验室 Citizen Lab 的努力揭露的（Marczak
    et al., 2018）。Pegasus 正好按照稳定不稳定性的定义中描述的原则运作：国家购买数字基础设施中公众未知的漏洞并“发射”它们攻击目标对手。因为漏洞未知（零日，正如前一章所讨论的），监控的受害者并不知道。提供移动服务的公司和手机制造商也不知道。在记者和研究人员发布材料后，欧洲议会下令进行调查（Mildebrath,
    2022），随后波兰议会上院成立了调查委员会。后者在 2023 年结束了其程序（Komisja Nadzwyczajna ds. Inwigilacji,
    2023）。然而，截至 2025 年，下议院仍在继续其自己的委员会。综上所述：即使在波兰这样名义上民主的国家——欧盟和北约成员国（有其所有缺陷和保留）——对政治对手使用稳定不稳定性的有充分记录的案例中，自
    2018 年发表的、否则被复制且无争议的安全研究论文以来已过去七年，自欧盟议会成功调查（2022 年）以来已过去三年，但公众仍未从联合议会报告或法庭审判中获得
    closure。

    '
