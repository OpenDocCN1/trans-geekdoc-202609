- raw: "Similarly, because CVE placed each vulnerability within an ontology, clearbluejar\
    \ shows how, by analysing the parent category of CVEs, it is possible to generalise\
    \ and compare CVEs to seek patterns and identify root causes through what they\
    \ called CVE North Stars approach ([clearbluejar, 2023](#bibliography.xhtml#_24044-2003_chp005_ref29)).\
    \ I do not claim that I understand all details on the cybersecurity science side.\
    \ I do claim that detailed walk-throughs and descriptions like clearbluejar’s\
    \ are equivalents of advanced papers and detailed replication protocols observed\
    \ by sociologists of science in laboratories in biology ([Latour & Woolgar, 1986](#bibliography.xhtml#_24044-2003_chp005_ref83)),\
    \ physics ([Doing, 2009](#bibliography.xhtml#_24044-2003_chp005_ref40); [Knorr-Cetina,\
    \ 1999](#bibliography.xhtml#_24044-2003_chp005_ref77)) or planetary sciences ([Vertesi,\
    \ 2015](#bibliography.xhtml#_24044-2003_chp005_ref157)).\n\nI do not cite works\
    \ by clearbluejar here because they are accessible online, and they take up some\
    \ space. They are not necessarily accessible to people without some technical\
    \ background or at least interactional knowledge, but  72. they do what science\
    \ papers should do. Clearbluejar and many other security researchers used CVEs\
    \ not just to push further the knowledge on already known vulnerabilities.\n\n\
    No, I invoked the case of North Star CVEs and CVE-2033–23397 to show that CVE\
    \ systematics allowed for an even more rigorous definition of cybersecurity as\
    \ a science. Not only a science that describes and forensically examines the history\
    \ of old vulnerabilities, to discover new mechanisms in old attacks but a science\
    \ that uses this knowledge to anticipate and create hypotheses about the future.\n\
    \n 73. Those hypotheses are rarely formalised in a style recognised by philosophical\
    \ epistemology. They rely on instrumental criterion of science, as proposed by\
    \ philosophers like Nancy Cartwright ([Cartwright, 1983](#bibliography.xhtml#_24044-2003_chp005_ref22))\
    \ or Ian Hacking ([Hacking, 2001](#bibliography.xhtml#_24044-2003_chp005_ref63)).\
    \ According to [Cartwright (1983)](#bibliography.xhtml#_24044-2003_chp005_ref23),\
    \ scientific laws should be understood as true precisely within the frame of abstracted\
    \ models. In this sense, scientific laws are instruments for the construction\
    \ of models. Reality is messy and complex, so the role of science is not only\
    \ to understand and develop the use of laws as instruments but, equally important,\
    \ to understand the limitations of models, boundary conditions and critical cases.\n\
    \nWhat is a theoretical paradox is the fact that cybersecurity by definition is\
    \ interested in limitations, boundary conditions and critical cases, similarly\
    \ as immunology is interested in response of the body to abnormal and how science\
    \ of material failure and fatigue studies exactly what material science wishes\
    \ to avoid. Knowledge pursuits as those that are symbiotically, or if you prefer\
    \ your thinking dirtier, dialectically, bound to construct on each other meta-layers,\
    \ that accrue like a structure of a fractal. Each knowledge relies on the knowledge\
    \ about its exceptions, failures, and boundaries, exactly in the same manner as\
    \ identified by Ludwik Fleck as a social mechanism of a thought collective discussed\
    \ in [Chapter 2](#ch02.xhtml#_24044-2003_ch002). To constitute science is to provide\
    \ working mechanisms of discerning statistical noise from genuinely novel paradoxes.\n\
    \nIn this sense, cybersecurity is a meta-science for electronics, computer science,\
    \ cryptography, automatics and many other adjacent fields, sociology and psychology\
    \ notwithstanding. It is so because cybersecurity is standardising and researching\
    \ exact points of failure, or conditions for stability, for situations which other\
    \ fields may consider practically irrelevant, unsearchable or on the points of\
    \ failure of modelling parameters.\n\nThis is why instrumentalism was found so\
    \ useful as a philosophical approach for cybersecurity as a science ([Spring &\
    \ Illari, 2019](#bibliography.xhtml#_24044-2003_chp005_ref143)). At the first\
    \ glance, it defies sane logic, as it proposes that science does not explore reality,\
    \ but only a simplified version of it. Even worse, instead of the truth (whatever\
    \ it may be), science is judged by the criterion of manipulating this simplified\
    \ version of the world. In practice, it allows not only to frame cybersecurity\
    \ research as research on models, instead of “being just cataloguing and discussing\
    \ historical cases” (paraphrase of an informal speech). What is no less important,\
    \ it provides a practical way of removing cybersecurity research from contradictions,\
    \ ethical doubts and other concerns around performatives of stabilised instabilities\
    \ in the public.\n\nThis is why CVE is important. Not only because it brings a\
    \ new generation of research, especially in the age of AI, but also it provides\
    \ a gateway for demarcation, or for separating socio-political contexts from the\
    \ scientific problem. By framing a vulnerability or a security problem through\
    \ CVE, managers of the systematics are able to decide what socio-political contexts\
    \ are included as relevant to research and what are excluded. This is how standards\
    \  74. were understood as political by Leigh Star and her co-authors ([Lampland\
    \ & Star, 2009](#bibliography.xhtml#_24044-2003_chp005_ref79)), not simply because\
    \ they are important but because they separate what can be left outside the context\
    \ of the categorised data and, by extension, from the research and infrastructures\
    \ that build on such data.\n\nThe demarcation power of standardisation bodies\
    \ is, thus, gatekeeping power in a very direct sense. Who can appoint the institution\
    \ that can validate CVE numbers? Who can inspect CVE ontology and propose changes\
    \ that would be actually taken as serious? Who decides what will be disclosed\
    \ to the public about a CVE, and what will be left in the backrooms? In the case\
    \ of the CVE board, all its members are US citizens, despite the fact that CVE\
    \ is used globally. This is a peculiar variant of the Brussels effect, as the\
    \ standardising body is not operating within the recognised boundaries of the\
    \ nation-state. Since MITRE is based in Virginia, “the Virginia effect” seems\
    \ like a fitting name.\n\nAs a variant of its Brussels counterpart, the Virginia\
    \ effect is an extension of the state’s political power through a formal voluntary\
    \ standard proposal in the domain of digital infrastructures. In the case of CVE,\
    \ it moved from nebulous concept about 25 years ago to an accessible and vast\
    \ ontology that allows automated cybersecurity research or defence. Similarly,\
    \ the Virginia effect starts as a social convention or a conversation about a\
    \ systematic in the form of some reports or briefings. As time passes, it ossifies\
    \ into material infrastructure itself, achieving the benefits of a network effect.\
    \ Even if other parties are unsatisfied with the details of the standardisation,\
    \ systematics like CVE become too useful or too common to ignore. Hence, what\
    \ was an epistemic proposal turns out to be a direct political power of the state\
    \ or company.\n\nLuckily, it is still possible to investigate one of the documents\
    \ that most likely lead to CVE as it is understood today. Around 2010, MITRE was\
    \ tasked by the U.S. Department of Defense to prepare a report and series of briefings\
    \ on cybersecurity as a science. MITRE gave this task to JASON, a group of scientists\
    \ created during the Cold War to advise in matters of national defence and similar.\
    \ JASON’s report has been made public with the signature JSR-10–102 ([JASON, 2010](#bibliography.xhtml#_24044-2003_chp005_ref75)).\
    \ Working on this book, I did not have enough time to reconstruct the details\
    \ of relation between JSR-10–102 and changes of the CVE standards, but as both\
    \ originate from the same department of the same institution and as both share\
    \ some involved parties, like NIST representatives for cybersecurity, some theoretical\
    \ feedback likely took place."
