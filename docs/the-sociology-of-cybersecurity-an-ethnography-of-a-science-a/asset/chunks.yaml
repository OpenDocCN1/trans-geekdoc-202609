  trans: '

    Maia arson crimew 是一位瑞士网络安全研究员，使用 *it* 和 *she* 代词。它的第二个名字让人联想到 “crime” 和 “mew”
    这两个词的组合。她在采访中，尤其是讨论数据公开披露的政治和个人意义时，使用猫人格作为自己的身份。在这种意义上，源自朱迪斯·巴特勒的可识别的性别表演性（巴特勒，2015），被转置并主体化为酷儿身份融入公共黑客行动主义倡导的讽刺中，与稳定不稳定性的认识论手势的表演性方面融合。酷儿兽人形象的表演性，maia
    的猫人形象，既充当蜜罐，也充当通往解释无限倒退的陷阱。它吸引人们关注公共利益问题，例如特斯拉工厂视频监控的图像、核电站工人的不存在的隐私，或阿拉巴马州监狱的监控画面。


    ## 片段 5.2 网络安全中的酷儿视角


    Trans、酷儿或其他边缘视角在网络安全领域常常找到归属，因为在这个领域，身份既是武器也是问题。


    忽视 maia 的研究在技术上相对简单是错误的。Maia 坦承它使用非常基础的工具，例如使用 Shodan 之类的软件扫描开放端口，或浏览在暗网中流传的泄露账户。这种相对的简单性具有挑衅性、展示性和邀请性的价值。通过
    maia 的实践，网络安全变得平凡、令人厌烦、随意、不严肃。这是通过酷儿化知识来进行的知识集体化，使知识变得日常、幽默、荒谬且易于获取。它是对 MITRE
    和魔鬼政治神学的对立。然而，maia 的黑客行动主义和研究也超越并酷儿化了唐娜·哈拉维的赛博格宣言（哈拉维，2006），或违背了阿利森·鲍威尔对公共利益黑客的简单定义（鲍威尔，2016）。


    将 maia 视为哈拉维的赛博格，就意味着错过后斯诺登时代，并抹去 maia 的刑事迫害以及她作为无政府主义者的刻意政治框架。将 maia 的研究框定为公共利益，就等于把它的无政府主义（crimew
    arson，2024）视为公民行为，这在我看来是不道德的。


    maia 的黑客行动主义受到了美国法律系统的起诉。她被判刑，并在 2021 年发出了一封国际引渡函。maia 公开谈论过它对监禁的恐惧，这表明关于脆弱性的坦诚可能是酷儿、女权主义和其他从劣势视角参与的网络安全研究人员之间的一种分享策略。同时，情感上的诚实和脆弱性很难被权力精英的司法系统滥用，因为即使是前
    FBI 画像师也陷入了我之前提到的蜜罐/无限倒退辩论（卡帕，2025）。与其将 maia 的身份视为其本然并转向影响、政治共鸣或其他更有趣的主题，画像师们就迷失在层层讽刺、戏仿、拼贴和对引用的引用之中。


    虽然我不同意他们将 maia 刑事化的兴趣，但我至少可以重构执法部门以及一些拒绝区分黑客行动主义与攻击数字基础设施的网络犯罪的网络安全研究人员的视角。在这个领域很难归因于某项行动，甚至公开声明也不是行动的证明。在这一框架内，酷儿和无政府主义政治很容易被贬低为其他国家或权力精英对立派系行动的假旗。


    例如，考虑公众对中国对美国技术霸权构成的危险的恐慌。如果用文化理论、性别和殖民美学的语言重新表述，这些美学常通过全球北方的辩论与赛博格象征联系在一起，它们被归因于中国女孩安全团队的攻击所用作一种性别武器化形式，这是一个由肖天等黑客偶像领导的大型粉丝群体。肖天的赛博格-性别表演美学像野火一样通过社交媒体传播，吸引了关注，就像后来
    maia arson crimew 所做的那样。性别-赛博格的关注不仅带来了对肖天承担责任的实际攻击的兴趣，也激励她的追随者学习网络安全。


    朗·T·布伊在性别研究中理论化为数字渗透时代中国女性的重新配置（布伊，2015），同样发挥了中国国家对这种表演性的收复功能，以及与另一个权力精英的性别游戏，这次似乎与美国的利益相对立。


    我不相信 maia arson crimew 所做的事情是作为另一个国家行动的傀儡或烟幕。那与我的理论化无关。重要的是要理解，网络安全的酷儿和性别表演性也已被至少一些国家行为体在以前未曾涉及的规模和背景下所认识并正在被收复。


    这引出了对凯瑟琳·N·海尔斯（海尔斯，2006）的旧想法的新的转述，这次是在我的民族志的背景下。性别的表演性和网络安全的表演性融合在一起，使得赛博格的形象比以往任何时候都更加未完成和难以捉摸。


    当网络安全成为科学，被分解为标准化数据库和自动化检测系统时，赛博格的酷儿表演性就转变为武器、反制措施或混淆，以及关怀实践。


    ## 女权网络法与女权网络安全。寻找替代方案。


    我的项目关注的是网络安全的一个科学方面，即更接近数学或计算机科学的实践。不提及至少另外两个方面是错误的。第一个是女权网络法的概念。第二个是国际关系中女权网络安全的概念化。


    女权网络法的概念是由阿曼达·莱文多夫斯基领导的团体发展起来的（莱文多夫斯基，2022）。在这种背景下，女权主义被理解为强调同意、安全和可及性的重要性。


    莱文多夫斯基关注的是美国特有的法律问题，例如《计算机欺诈和滥用法》（CFAA）。莱文多夫斯基讨论了通过对 CFAA 的解释来确立先例的尝试，使任何对计算机软件或硬件服务条款的滥用都成为刑事犯罪。该先例被提交给了美国最高法院。莱文多夫斯基观察到的关键事实是，美国最高法院拒绝将“超出授权访问”视为联邦犯罪。


    这为劳工行动主义、反歧视研究和网络安全研究留下了更大的空间，但使起诉未经授权披露裸照或打击跟踪变得更加困难，而跟踪通常结合了现实世界的追踪和暴力虚构。尽管政治发生了变化，莱文多夫斯基的项目仍引起了其他学者和从业者的兴趣，这最近导致了一部编辑文集（琼斯
    & 莱文多夫斯基，2024），该文集在种族、堕胎和残疾等基本问题上扩展了女权网络法理论。

