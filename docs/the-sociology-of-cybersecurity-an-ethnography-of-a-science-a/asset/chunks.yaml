    如果不提及反殖民、黑人及女性主义研究对 3. 计算、劳动、女性主义学术等领域的巨大贡献，那将是误导且在科学上不诚实的。其中，我参考了凯特琳 罗森塔尔的（2019）
    的原创研究以及梅雷迪思 惠特克的（2023） 对查尔斯·巴贝奇架构起源的综述，该架构源自东印度公司的种植园。同样，我大量借鉴了比埃拉 科尔曼（2013） 的黑客研究，以及
    克里斯蒂娜·邓巴-赫斯特（2019) 和 阿曼达·莱文多夫斯基（2022) 的网络安全女性主义研究，以及安瓦尔 姆哈吉内和亚历克西斯·亨肖（2025） 在国际关系中的网络安全后殖民研究。


    第 1 章 以工作的片段开始。2010 年东欧的黑客空间并非唯一能够唤起黑客文化或聚集新的 IT 承包商亚层的场所，但它们也是绅士化前沿和作为社区网络安全实验室运作的社区。它展示了劳动、网络安全学习的社会机制以及管理员与开发人员工作的混合如何为欧盟《通用数据保护条例》（GDPR）的地震式转变奠定背景。第
    1 章 作为我方法及一些理论概念的介绍，以及日常维护与网络安全光鲜之间的互动示例。虽然我没有足够的篇幅深入讨论，但本章的很大一部分是在与温妮弗雷德 波斯特（2026）
    以及劳工科技社区的讨论中构建的。这使我能够在欧洲以外的地方部分验证许多发现，例如来自印度或巴西的 IT 分包商。


    第 2 章 在前一章的基础上，描述了网络安全实验室的社会学模型以及思想集体概念，修改了路德维希·弗莱克提出的术语。实验室是工作场所，而思想集体是智力环境。在它们之间，知识和/或科学发生。第
    2 章 的基本社会学前提很简单：网络安全实验室是具有抽象能力的社会学群体空间，能够创造我稍后将定义为“稳定化的不稳定”的东西。虽然一般科学实验室都会这样做，但网络安全实验室在数字基础设施上这样做，因此在某种程度上它们嵌套在更进一步的抽象层中。这就是为什么网络安全实验室是二阶实验室：它们是实验室的实验室，因为它们对其他实验室以及广义上数字基础设施总体所使之可复制、稳定或可靠的东西（至少作为经验法则）进行抽象、制定规则并创造“稳定化的不稳定”。


    在 第 3 章 中的一个具体例子中，我描述了玩夺旗赛（CTF）比赛如何成为思想集体的构成性劳动，作为社会包容、声望和知识复制的机制。这种社会机制不仅以与巴布鲁克和卡梅伦描述的方式相似的方式被捕获，而且还被保留为有用的制度间空间，促进交流并降低培训成本。因此，第
    3 章 是对收编的研究，即对批判和文化进行再捕获，使其成为无偿劳动。据我所知，这是迄今为止发表的关于 CTF 科学民族志的第一篇。


    4. 如果 第 3 章 展示了野外或非正式环境中的网络安全认知，那么 第 4 章 则聚焦于网络安全作为科学的认识论。我从理论化“稳定化的不稳定”开始，以讨论网络安全系统学，例如通用漏洞和暴露（CVE），以及它们在军事、保险和研究领域的应用。我还概述了另一种网络安全科学的前提，我称之为“为人民的网络安全”。据我所知，这是首次将网络安全系统学与国家利益、认识论和劳动联系起来进行理论化的尝试。


    在 第 5 章 中，我调查了网络安全教育中的排斥问题，并对酷儿黑客行动主义问题及其可能被国家捕获进行了理论化。最后，我指出了女性主义网络法律的潜力及其与现代、进步、普遍和科学的为人民的网络安全之间的联系。


    我不相信我已经找到了开头提出的问题的令人满意的答案。我相信，我以一种有趣的方式提出了这些问题。如果我有一个想要提供的理论结论，那么它可能是这个：网络安全和社会学本质上都对规范与例外之间的微妙平衡感兴趣，以及它们的正当化、保护以及例外和标准两者宝贵价值。


    据我所能理解，本书的关键贡献包括：（1）将网络安全实验室理论化为二阶实验室；（2）进行并解读夺旗赛比赛的民族志研究作为网络安全知识的复制；（3）网络安全中发现的概念化和示例，既被理解为认识论的也是社会机制的，这为公众理解网络安全提供了基线；（4）认识到
    2020 年之后，批判性计算和人工智能研究必须包括对网络安全及其系统学的理论化；以及（5）将网络安全系统学与网络安全哲学理论、黑客社会学、夺旗赛研究以及数字基础设施辩论联系起来。


    经过所有这些劳动，我仍然怀着好奇、希望、恐惧和厌恶的混合情绪研究网络安全，这与我对社会学和科学的一般态度并不相似。借用齐格蒙特·鲍曼写给社会学家的原话（1988）：无论好坏，与所有学术领域一样共享现代性理想，为人民的网络安全应以理性为导向改善人类状况。它应旨在增加人类自主的量，但不是那种在缺乏团结的情况下导致孤独的自主。相反，要增加人类团结的量，但不是那种在缺乏自主的情况下导致压迫的团结。它还应展示人类、政府和组织如何创建数字基础设施，使人类更加了解、理性并参与基础设施决策的制定。同样，网络安全为  5.
    人民必须向社区展示大型群体如何维护和发展数字基础设施，以组织新的共同知识、交流、生态、关怀、喜悦、爱、隐私、信任以及人类生活的其他各种维度形式。

    '
