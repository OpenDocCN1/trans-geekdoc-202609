  trans: '

    这种差异在考虑不同的 CTF 形式时变得更加明显。队伍要么在解决评委给出的任务（所谓的“Jeopardy” 形式），要么相互对抗（攻防形式）。前者通常涉及更具脑力、专注且持续时间更长的活动。后者时间更短、更具对抗性，因为队伍同时维护自己的基础设施并攻击其他队伍运营的
    IT 基础设施。保持稳定服务和破坏他人服务都能得分。在攻防活动中，团队的一部分成员必须承担防御者和系统管理员的角色。攻防黑客活动通常需要权宜之计、“足够好”的解决方案，而非长期策略。这也类似于安全领域中流行的划分。红队专注于进攻性研究，蓝队专注于防御性研究。在“Jeopardy”
    形式中，这一逻辑发生了转移。任务并非按进攻/防御划分，而是按专业化划分，如表 3.1 所示。


    这两种类型都强调思想共同体的两个要素。攻防是对大型基础设施实时攻击的模拟。方法往往粗糙，每个人都肾上腺素飙升，防御者经常求助于使用蜜罐。通过这些，他们试图诱使攻击者暴露并自我披露，使敌对行为者容易受到反击或识别。Jeopardy
    CTF 通常时间更长。其起伏更多与脑力耗竭有关，而非对手的行动。受访者更少将它们描述为雷区和被围攻的城墙，而更多地描述为谜题和精美的挂毯。


    如果攻防唤起的是实时紧急情况或军事网络空间作战的流行表征，那么“Jeopardy” CTF 更接近于计划中的反基础设施项目、科学或间谍活动。攻防模型情境就像“all
    hands on deck”，网络上发生事故时，团队消耗的咖啡因剂量足以供应一个小村庄。 45. Jeopardy CTF 更缓慢、更讲究方法。问题更受益于仔细选择技术，而非“足够好”的方法。


    时间框架不仅对理解社会变迁很重要，对理解政治框架也很重要。不同项目之间时间框架的差异很久以前就在 STS 中被探讨过（Traweek, 1992）。它在关于机器人和空间通信的
    STS 研究中仍然相关（Vertesi, 2015）。尽管如此，关于时间框架、基础设施以及思想共同体内部时间框架差异的知识仍然很少。我在这里无法更详细地讨论这个问题。尽管如此，参与者注意到并赞赏
    CTF 让他们能够“体验不同的节奏”（来自现场即兴访谈）。这不仅仅关乎竞争性黑客活动那种凝缩、强烈、引发心流的感觉。对于一些玩家来说，恰恰相反：CTF 锦标赛比他们职业生涯中的其他活动更具脑力，更具反思性。


    反思与繁忙行动之间的这种分裂也在两种游戏类型中得到体现。攻防 CTF 混乱忙碌。一个团队的攻击和防御要素之间几乎存在持续的反馈循环。当防御者识别出针对他们的攻击时，攻击者就在其武器库中获得了一个新工具。有时，情况类似于战争游戏，因为攻击者在防御者准备防御针对发明者使用的相同方法之前会延迟发动新的进攻。观察一个团队进行攻防就像观察一个应急指挥中心。攻防
    CTF 就像“blitz” 象棋：令人疲惫、引人入胜且要求无情的注意力。


    如果攻防是“blitz”，那么“Jeopardy”就是古典象棋。桌边每个人都低声说话，因为其他团队成员都沉浸在严谨复杂的思考中。当 CTF 玩家讨论解决任务的可能性或电子系统的某些属性时，听到对定理、论文和形式证明的引用并不罕见。当然，黑客活动远不止形式科学，因此地下小报、八卦和安全会议的新闻也被讨论为可行的线索。


    在“Jeopardy”活动中，团队合作较少关注跨越进攻与防御黑客之间的分歧。访谈和闲聊更常提到跨专业化讨论。更复杂的任务经常从一个类别转移到另一个类别，练习在表
    3.1 所示分类之间不断切换。在接受采访时，参与者表示，这种从其他子领域识别问题的能力是解决超出其主要专业化任务的好处。从这个意义上说，CTF 提供了在安全子领域学习细节的机会。更重要的是，这些细节被呈现为相互交织的，因此黑客和专业人士也在相关背景中学习它们。


    这种交织背景、技术潜台词和故意误导的丰富性使 CTF 成为安全知识的活体测试床。从这个意义上说，它类似于种子库或野生栖息地。CTF 数量众多、无处不在，并在复杂性和可及性方面各不相同。它们不仅反映了
    46. 黑客文化的变迁，也反映了安全认识论文化的变迁。注意一个参与者如何在片段 3.1 中强调 CTF 的独特和分离特征。该参与者对时间分离的讨论进一步推进了“ritual
    condensations and celebrations of hacking lifeworlds”的概念（Coleman, 2010）。Biella
    Coleman 关于黑客文化中仪式的评论几乎理想地契合了个人赋予 CTF 的意义（参见片段 3.3）。CTF 的强度是可感知的、上瘾的且具有传染性。即使以我有限的计算机安全知识，我也感到精力充沛，并被迫试图理解解决方案。脑力欢庆被转写为对抽象思考的持久愉悦感。CTF
    对其他黑客来说是愉快的，不仅仅因为可以看到玩家的行动，也因为可以共情他们专注和关心的状态。


    每个 CTF 团队通常由四到十二名玩家组成。根据活动的不同，可能有关于现场玩家最大人数及其实际出席的规则。玩家共享他们的来源：同一个国家、公司部门或政府机构。他们根据自己的专业化自行分配任务（参见表
    3.1）。


    标准在 STS 中讲述故事（Bowker & Star, 2008），但这更甚；这是一种元标准，充当对未知事物的粗略分类。它是未成文的、可塑的，并且仅通过社会惯例和共同活动得以维持。它也是国际疾病分类第十一修订版
    (ICD-11) 的粗略、粗糙且不太明显的对应物，但适用于数字基础设施中的错误和异常。虽然 STS 对 ICD 的研究常将其理解为人类健康基础设施的一个层面（Aue,
    2021），但其在数字基础设施中的对应物却逃脱了此类审视。然而，尽管前者更抽象且远离日常生活经验，STS 仍应研究两者。

