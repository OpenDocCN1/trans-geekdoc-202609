- raw: 'What is important is to notice that the principles of consent, care and accessibility
    were successfully used in a legal discussion made in close connection with a relevant
    technical context. This shows that feminist ethics inspires not only social theory
    or other abstract macrosociological issues but also everyday, practical issues
    like the application of law for victims of stalking, women surveilled in their
    smart homes ([Slupska, 2019](#bibliography.xhtml#_24044-2003_chp005_ref139)) or
    people experiencing discrimination.


    Very similar issues were of interest to researchers in the domain of international
    relations. They proposed feminist cybersecurity as a perspective for investigating
    radicalisation of international terrorist groups around fantasies on violence
    against women ([Armstrong, 2021](#bibliography.xhtml#_24044-2003_chp005_ref6);
    [Bengtsson Meuller, 2023](#bibliography.xhtml#_24044-2003_chp005_ref14)) or on
    the online stalking and community enforcement of gender norms, surveyed through
    cybersecurity devices ([Mhajne & Henshaw, 2024](#bibliography.xhtml#_24044-2003_chp005_ref95);
    [Mhajne & Whetstone, 2024](#bibliography.xhtml#_24044-2003_chp005_ref103), [2025](#bibliography.xhtml#_24044-2003_chp005_ref104)).
    Feminist scholars of cybersecurity in international relations emphasise the necessity
    to understand cybersecurity outside the institutional boundaries of nation-states,
    which only emphasises the need for multi-sited, intersectional and multi-situated
    research.


    ## Instead of an Afterword


    The first ethnographic notebook used for this book comes from October 2014. It
    contains notes from observations and a few spontaneous talks from one hackerspace.
    The last conversation comes from July 2025. It was about AI slop, or the massive
    submissions on vulnerabilities done by large language  89. models (LLMs). It seems
    like an epoch between a post-Snowden moment, when surveillance became briefly
    the topic of the day, and a current moment, when cybersecurity is considered as
    much as a tool for economic enclosure as for discovery.


    From this period, I wish to subjectively emphasise three issues. First, the discourse
    about the Internet and cybersecurity in particular is caught in a strange Groundhog
    Day. On one side, almost nobody, except perhaps for lobbyists and their academics,
    believes in tales about an apolitical Internet, as issues like the Brussels effect
    or digital feudalism appear in opinion pieces. On the other side, there is a strange
    comeback of 1990s discourse, as if AI found some unused reserves of Web 1.0 and
    2.0 propaganda. Cyberpunk Gnosticism also comes back. Perhaps this is the moment
    to admit that even in digital sociology, history does not repeat itself, but it
    often rhymes.


    I believe that this somewhat nauseating repetition of marketing discourse actually
    covers the fact that cybersecurity has advanced into systematisation, standardisation
    and professionalisation. Systematics like CVS allowed establishing shared understanding
    and has automated at least some of the security tools. Standards, like protocols
    used by cybersecurity insurance investigators I had interviewed, contribute to
    what is currently known as “privacy professionals” ([Birnhack & Mundlak, 2025](#bibliography.xhtml#_24044-2003_chp005_ref15)).
    In effect, recuperation, or the business recapture and commodification of the
    hacking culture, becomes normalised. It does not matter that all recuperated practices
    become internalised into institutions, as I have shown in the case of CTFs, as
    common grounds shared between siloed institutions are still incredibly useful.
    Additionally, what is done in the spirit of a shared passion for cybersecurity
    may escape remuneration for labour, exactly like some cyberprophets of 1990s used
    to forget.


    A second recognition comes as a consequence. The process of commodification of
    culture into unpaid labour has been identified as the “Californian Ideology” by
    Richard Barbrook and Andy Cameron ([Barbrook & Cameron, 1996](#bibliography.xhtml#_24044-2003_chp005_ref8)).
    What I wish to emphasise is how the current wave of Californian Ideology, while
    influencing epistemologies of cybersecurity as a science, actually turned into
    various forms of theology. Unlike previous conceptualisation, this time it is
    not about “new age” or “1968”, whatever one wishes to associate with those, or
    even some gnostic undercurrents from popular readings of cyberpunk, as understood
    in Cyberpunk 2030 or in the Cyborg Manifesto ([Haraway, 2006](#bibliography.xhtml#_24044-2003_chp005_ref60)),
    but from political theology of the right-wing Christianity and Judaism that has
    been so useful for the power elite.


    In the [fourth chapter](#ch04.xhtml), I discussed Peter Gallison’s research on
    the influence of Christian theology on cybernetics as science in the presence
    of an adversary ([Galison, 1994](#bibliography.xhtml#_24044-2003_chp005_ref51)).
    JASON’s report looked back at this research, as it conceptualised the same problem
    for 2010s cybersecurity science: how to construct an epistemological model of
    the enemy? Palestinian feminist scholars of surveillance independently recognised
    that theology, this time Jewish, underpins surveillance and cybersecurity operations
    of Israel in Gaza ([Rouhana &  90. Šalhūb-Kīfūrkiyān, 2021](#bibliography.xhtml#_24044-2003_chp005_ref138)).
    Nādira Šalhūb-Kīfūrkiyān calls this “security theology” ([Šalhūb-Kīfūrkiyān, 2015](#bibliography.xhtml#_24044-2003_chp005_ref140)),
    when the imagined space around cybersecurity becomes untouchable and inaccessible
    and can be only discussed by the initiated within a hermetic order. Outsiders
    have only religious metaphors, but through every metaphor, the power of the initiates
    only grows, as do prices for their products. Paradoxically, this goes against
    many ideals of hacking as well as against the ideals of science. Science is not
    the arcane, hermeneutics; it is not for the gifted or initiated, but it should,
    at least in principle, be understood universally. I guess that I have only one
    conclusion: the struggle about ethics in cybersecurity is the same as the struggle
    about ethics in science ([Wolfe, 2020](#bibliography.xhtml#_24044-2003_chp005_ref175)).
    This set of political theology is colonial, as it sets cybersecurity as a guardian
    of holy secrets of the state, as an uncrossable divide between conquerors and
    subjects of the conquest, between the “sec people” and “lay people”. When I write
    holy, I do not mean that I believe that there is anything supernatural in knowledge,
    nor that I even think that people using this rhetoric believe so. I write “holy”
    in a Durkheimian sense ([Durkheim, 2008](#bibliography.xhtml#_24044-2003_chp005_ref43)),
    understanding cybersecurity as “holy” means as separated from everyday life as
    social taboo, imposing a set of rigours on the society, the justifications of
    which lie not in evidence but in performative rituals.


    At the same time, cybersecurity science, in the very non-religious and completely
    scientific, non-metaphoric sense, acts as the locksmith for many intricate mechanisms
    of social order today. This is the Durkheimian totem, albeit a twisted one, as
    it has a form of digital infrastructure and not a symbolic centre. Like the Durkheimian
    counterpart ([Durkheim, 2008](#bibliography.xhtml#_24044-2003_chp005_ref43)),
    cybersecurity is both visible, when it acts, and invisible, when it is feared
    by the laypeople as the source of social control. Its everyday intricacies are
    hidden from outsiders but justified in the political arena in terms of theology,
    mysticism and dangers from uncountable devils. Science, but justified and used
    for social control as a religion. Unknowable, unable to verify, unaccountable.
    Exact, palpable and ubiquitous, but only as source of fear and never when it comes
    to accountability.'
