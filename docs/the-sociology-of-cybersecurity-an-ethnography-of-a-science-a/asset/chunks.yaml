    尽管它们可能出于善意或有用，NIST CSF 标准的最新版本仍将沿着同样的路径发展，以反映在《通用数据保护条例》案例中被描述为“布鲁塞尔效应”的现象。布鲁塞尔效应
    69. 有关描述可在欧盟文献中找到（Mazur & Włoch, 2023）。简而言之，它描述了政治权力界限通过自愿标准和技术的混合而在制度边界之外有计划地扩张。无论在
    NIST 还是 GDPR 中，被扩散的权力都是通过数字基础设施的延伸来中介的。


    在 GDPR 的案例中，布鲁塞尔效应在阴影中运作，对关键决策缺乏公众监督，恰好满足了米尔斯所定义的权力精英的愿望（Mills & Wolfe, 2000）。标准不会主动推动被接受。随着时间的推移，外交性的、软实力中的可选建议很容易固化为基础设施性的、不可移动的标准。然后，对标准拥有监督权的权力精英有效地扩展了其权力。这一切都不需要开一枪，只需逆转网络科学中已知的、且在基础设施社会学中得到充分认可的
    opt-in 压力（Lampland & Star, 2009）。我没有读到过这种描述被应用于网络安全标准，尤其是 NIST CSF，但我对自己的领域足够熟悉，能够识别出这种模式。


    布鲁塞尔效应展示了网络安全标准如何解释权力精英超越民族国家边界的 reach。理解保险金融化有助于更好地理解知识在创造金融工具中的作用，这些工具用于分散风险，将利润转移给能够提供信任并创造从科学和基础设施中获取金融利润的新机制的机构。


    它如何映射到“稳定化的不稳定”概念？网络安全科学研究稳定并改变不稳定的尺度。保险分散风险，包括来自黑客行动主义、网络犯罪和其他行为的风险，在必要时提供将责任转移给个人或空壳公司的可能性。稳定化的不稳定仍可能煽动公众舆论，例如个人隐私数据泄露或他们受到骚扰，但很少导致公众审查。
    Shoshana Zuboff (2019) 所指出的行为盈余只是商业权力精英的一个单一部分。网络安全是关键石；正如稳定化不稳定的认识论使我们能够分割和组合数字基础设施一样，它也使我们能够管理资本形成和流动中的例外状态。


    这就是为什么理解网络安全科学的权力精英是理解当代世界政治经济的必要条件。从人工智能到健康数据，从卫星和人类世到赛博格和酷儿理论。这就是权力的认识论。


    ## “向你展示这样的景象”。科学与网络安全标准。


    保险对于商业权力而言无疑很重要，NIST 标准对它也很重要，但 NIST CSF 后续世代对保险的确切作用和规模是未来研究的问题。


    在本节中，我仍然留在权力精英和稳定化不稳定的框架内。我的目标仍然是理解发生在 70. 网络安全知识形式化与其作为一种权力形式被执行为标准之间的过程。与上一节讨论的
    NIST CSF 不同，这次我感兴趣的是收集关于漏洞（读作：稳定化不稳定）的知识的标准、威胁评分系统以及估计网络攻击的方法。


    在实践中，网络安全行业中的这些标准被理解为通用漏洞和暴露（CVE）、通用漏洞评分系统（CVSS）以及 MITRE 对抗性战术、技术和共同知识（ATT&CK）框架。三者都组织成独立但相互连接的数据库，由
    MITRE 管理。MITRE 是一个非营利的混合机构，在智库、公司、非政府组织和政府机构之间摇摆，专门负责将国家资源委托用于信号、网络安全、通信和类似国防相关主题的研究。这种作为非营利但非政府、却负责管理联邦研究资金的对冲，使
    MITRE 成为米尔斯警告的完美例证。


    MITRE 负责管理一些研究项目。这就是为什么很难将 MITRE 解释为除军事、商业和国家权力之间翻译的完美枢纽或接口之外的任何东西。


    MITRE 在可能的情况下似乎避免与 NIST 进行公开竞争，因此 CVE、CVSS 和 MITRE ATT&CK 等倡议是在与 NIST CSF 以及上一节讨论的其他标准兼容的情况下开发的。区别是象征性的：NIST
    在形式上和行政上与美国政府相连，而 MITRE 具有一定的否认性。这种否认性可能足以应对最简单的公众审查或最友好的外交官，有时甚至就足够了。


    我不想声称自己在我的领域发现并开辟了新天地，即使网络安全经常涉及权力和保密问题。不，这些都是公开已知的事实。


    我正在做其他固执的基础设施社会学家所做的完全相同的事情：我嗅探标准，并阅读它们。我将无法理解大部分技术信息，但我将掌握足够的制度和社会背景，以便阅读更多内容并在访谈中寻求解释。


    哈里·科林斯在引力波物理学中也这样做了（Collins, 2017），并增加了一些访谈。科林斯与罗伯特·埃文斯合作，将这种社会背景称为“互动专业知识”（Collins
    & Evans, 2009）：你在没有实际科学专业知识的情况下，通过身处其中可以从一个社会群体中学到什么。这正是情境知识，“食堂餐巾纸”知识。如果社会学家怀有敌意，完全相同的知识往往足以促成以社会攻击形式进行的网络安全入侵，例如攻击者冒充“丢失徽章的员工”或“为
    Alice 送午餐的人”。


    CVE、CVSS 和 MITRE ATT&CK 是此类互动专业知识的绝佳试金石。它们是二手知识的完美例子，以管理人员、71. 政策制定者和其他没有技术背景的权力精英成员能够理解的形式对网络安全知识进行可用的重新包装。当然，这三类同样完美地适用于向新手推销
    IT 营销的词语沙拉，但这正是科学与管理术语融合的时刻。


    这里有一个例子：CVE^()


    但 CVE 的作用不仅仅是一个共享的参考点。共同的坐标集使得通过时间和漏洞谱系进行比较变得更容易。通过对机制的仔细记录，上述描述的攻击与之前对乌克兰医院和健康基础设施的攻击进行了比较。结果，学习反馈循环不仅基于论文中所示的系统性，还基于对手的作者身份和识别（Machalewski
    et al., 2024）。

