  trans: '

    这与 STS 中对 *资本主义的新精神* 的其他应用不同。例如，批判-收编动态已在非洲各国的 Facebook/Meta 政策中得到体现（Rider & Murakami
    Wood, 2019）。网络的增长依赖于对言论自由和数字不平等相关批判的收编和再捕获。


    这种理解的转变标志着在批判与收编关系中，从宏观到更精细尺度抵抗的过渡。黑客相关的收编与 Boltanski 和 Chiapello 的提案（2007）不同并不令人惊讶。与源理论不同，黑客研究关注收编过程之后的残余以及对其的抵抗过程。


    尽管资本捕获了批判，但它仍留下残余和剩余物作为未来批判的余烬。这些被收编的余烬（未来的批判）并非抽象或局限于系统尺度，而是植根于抵抗的人类尺度中。这种理论重构在两个方面至关重要。首先，Maxigas
    和 Söderberg (2022) 强调了黑客的建设性维度，突出了对工具的所有权。这与黑客即破坏的流行刻板印象相悖，更接近当代黑客研究。Maxigas 和
    Söderberg 的核心理论成果在于认识到，黑客是数字经济中关键工作场所中的工人抵抗实践。对这项工作同样重要的是，他们认识到批判与收编的辩证法在定义上是不完整的。每一次政治转型总会留下一些残余，既在批判一方，也在收编一方。每一次革命，无论被消耗还是取得胜利，在定义上都是不完整的。这些残余创造了传记式历史、经验以及未来转变所需的共享知识。正如
    Maxigas 和 Söderberg (2022) 所指出的，由于政治上的剩余物存在，黑客文化能够不断重构并设计新的抵抗和修复手段。


    对残余的解释和出现标志着本章与我同事研究之间的差异。黑客行为可以并且应该被理解为数字资本主义工作场所中的劳动抵抗实践。在此，我建议进一步研究以认识到这种抵抗不仅是政治层面的，如哲学或劳动或福利社会学所设想的（Well
    et al., 2023）。我认为黑客行为很重要，因为黑客行为是对基础设施的政治批判和收编。被物化，但始终超越单一时空。植根于实践共同体之中。并不总是破坏性的或反体制的，正如批判与收编本身难以捉摸的辩证法一样。


    Maxigas 和 Söderberg (2022) 专注于构建商业数字基础设施的替代方案。然而，对独立且积极的抵抗实践的关注伴随着隐性成本。理解小型项目的抵抗与收编是必要的，但不足够。Maxigas
    和 Söderberg 将黑客行为聚焦于建设性实践。他们对独立黑客项目及其随后被商业收编的情况提出了收编与批判。我希望做相反的事情：不单独关注黑客文化，而是追踪开放的黑客活动，因为它们被置于商业和军事机构事务的边缘，以此来了解这些机构。这就是为什么本章关注黑客的政治，几乎是在将其嵌入跨国企业和军事利益的时刻。兴趣仍然在于基础设施，目标仍然在于科学，方法仍然是社会学的。不同之处在于
    CTF 团体更具临时性，并不一定符合实验室的标准。在这种意义上，CTF 是“中间者”，是认知、专业和休闲空间的混合体，它们与工作场所保持分离，但仍与其保持接近。


    我无意否定 Maxigas 和 Söderberg 的提案，而是为其工作提供辩证的对应物。他们研究独立批判的抵抗与捕获，而我更倾向于几乎完成的收编，即寡头和军事与数字间谍强大机构之间作为职业必要共同群体的剩余物。他们研究围绕分离系统构建而形成的自主抵抗实践，而我关注的是受持续竞争束缚的破坏性协作实践；他们研究被市场捕获的无政府主义项目，而我研究了无政府主义式空间的资本主义围栏以及其中零星的个人决策行为。


    为了理解这一收编机制及其与数字基础设施的关系，我研究了 CTF 黑客锦标赛。尽管该领域最近已专业化，但它们仍在半独立的利基中运作。爱好者可能会说他们仍聚集在一起为激进的黑客行动主义者提供孵化基地，这在黑客文化中提供了长久的传统。此外，很难不注意到许多军事和情报机构将
    CTF 用作招聘工具（例如，北大西洋公约组织 CTF 和政府通信总部 CTF）。这种在安全领域半正式实践的增长在关注黑客的安全研究中被忽视了，即使在采用 STS
    方法的领域也是如此（Bellanova et al., 2020；Bellanova & de Goede, 2022）。


    在过去十年中，黑客研究已扩展了黑客的定义，以包括与信息安全无关的实践（Coleman & Jandrić, 2019；Dunbar-Hester, 2019；Lindtner,
    2015）。我同事关注独立社区和非安全类型的黑客行为，而我关注的是处于收编中间的实践。


    ## CTF 概述


    乍一看，CTF 是由社区主办并参与的私人或半私人游戏活动。只有在采访参与者、与他们交往并了解更多不同利益相关方后，才能理解其规模和相关性。它们远不足以进行统计概括，但足以检验一些理论概念。


    CTF 活动通常持续 12 至 36 小时。它们在实体或混合实体/在线会议期间进行。在 COVID-19 封锁之前，在线 CTF 并不受欢迎。2021 年之后，似乎出现了回归现场活动的趋势。CTF
    在各种安全活动期间举行。最典型的活动发生在安全会议或黑客大会期间，但也有独立于其他安全会议的活动。CTF 由玩家自己组织。昨天的玩家和竞争者成为明天的裁判和任务作者。


    对于专注于研究错误和不规则性的社区而言，与实践的接近性可能比仅开发新解决方案的人更重要。基础设施中的错误需要与可能的新发展概念不同的基础设施，甚至在非常直接的物质层面上。基础设施的思想和可能性在抽象中比在错误中更容易概念化。

