    \ during Chaos Communication Congress, one of the biggest conferences connecting\
    \ cybersecurity and hacktivism. As I contributed to some workshops on the issues\
    \ related with public understanding of science, I was asked not to give any more\
    \ details.\n\nEU regulation directly interacted with hacking communities and cybersecurity\
    \ professionals. Since 2018, security leaks with European citizen data are no\
    \ longer just a public relations problem. They can be a source of serious financial\
    \ fines, as imposed by national administrations. The business incentive for data\
    \ protection is rather strong, as a potential fine for data leaks may be up to\
    \ 20 million USD or 4% of the annual income of the company. Simply speaking, disregarding\
    \ data policies may become much more expensive than spending more to improve security.\n"
  trans: "\n我作为多点民族志的一部分前往了 C3。这对我所属的社群而言是一个重要活动，因此民族志学者随行是自然而然的事。\n\n大会当时约有 10,000\
    \ 名嘉宾，因此不可能将其理解为单一事件。与其进行定点观察，我决定跟随同意此事的个别黑客进行影随。我想看看他们如何将大会塑造为个人体验（Marcus, 1995）。我在影随的同时，也在大会全体会议期间对“我的社群”进行了定点观察——大会全体会议是黑客空间可以设立其“基地”的场所——并结合我自己的个人观察。在一次影随日里，我对欧盟和黑客的了解远超预期。\n\
    \n这并不是我首次应用该方法的日子，也不是我参加的第一次大会。蓬头垢面、因缺乏睡眠而疲惫不堪，我正在跟随一位我从定点民族志和其他大会中就认识的黑客活动人士。令我震惊的是。几乎有一半的人穿着领带或类似的商务休闲装！在我的大会中间？这是什么意思？被我跟随的黑客只是建议我尽可能倾听并参与。“你不是黑客，但你对欧盟的机构和社交方面的东西有所了解。尽情使用吧，你身处友人之中”。\n\
    \n原来我很不正式地走进了一个半开放的工作坊，该工作坊与一位重要欧盟行政机构中非常关切的分析师有着非常非官方的联系。不是咨询公司，不是智库，也不是研究项目，而是一个机构，它正参与一项欧盟法规提案的起草过程。我不提供进一步细节以保护他们的匿名性。非常非正式地，一些参与欧盟政策的人利用大会作为中立场地，与黑客活动人士组织了一场政策工作坊。\n\
    \n大多数人彼此来自欧盟场域的隐私辩论或无政府主义运动而相识。背景相似，我也从各自国家的辩论中认出了一些人。我说明了自己作为民族志学者的角色并征求了他们的同意；我们讨论了匿名化条件，随后工作坊开始。\n\
    \n工作坊集中讨论了欧盟与美国协议中隐私保护作用的细节。政策极客和黑客都了解该领域的美国情报活动，并讨论了需要强制执行的数据保护标准。我并非隐私辩论的陌生人，我大致理解公众辩论中的术语，如“安全港”、“五眼联盟”、“公钥机制”等，但工作坊远不止于此。法律中的技术复杂程度——其制度\
    \  19. 和技术方面——远高于我在学术界、公共领域或任何其他地方所经历的水平。再次，我同意不披露确切细节以允许匿名。我在讨论与我的领域相关案例时尽力贡献。\n\
    \n我提供了关于社会研究中隐私保护标准以及数据共享机制的例子和资料，这些是我在阅读不同科学领域的不同准入文化时学到的，例如，欧洲粒子物理的标准可能与欧洲气象合作的标准不同，即使某些超级计算机和其他资源是共享的。对领域内的人来说这是显而易见的事情——你只要在气候科学家身边待一会儿或阅读同步辐射研究的基础就能学到的东西。在讨论一般数据政策时很容易被忽视。\n\
    \n工作坊结束后，带我来的黑客说这正是他们所寻找的。我们为将支持与美国谈判的欧盟机构提供了更好的案例。当然，我们两人通常都很偏执，所以我们对几位新认识的分析师和活动人士做了随意的背景调查。没有什么可疑的，更像是一种专业好奇心和习惯性的事实核查。只是通过电子邮件在友好的占据屋里打听一下，核查我们见过的人的出版记录以及一些分析师的大学经历。工作坊的人都经受住了这种审查。^()\n\
    \n除了理解复杂软件与理解复杂社会系统之间的相似性之外，我认为这个工作坊很重要，因为欧盟黑客与欧盟机构之间的合作在研究中并未得到认可。该领域众所周知，美国官员参与了类似的工作。例如，美国计算机间谍机构的指挥官于\
    \ 2013 年在 Defcon 上发表了著名且广受批评的主旨演讲。美国军事研究机构国防高级研究计划局——DARPA——定期在会议期间进行机器学习实验。欧洲黑客大会通常被视为更偏左、政治上更激进，这源于其在德国黑客-无政府主义运动中的根源。我的同事研究欧洲黑客时聚焦于国家层面，例如黑客对德国政治的影响（Kubitschko,\
    \ 2015）。\n\n我遇到的这个工作坊证明了欧盟政策机构与黑客社群之间存在高效的联系——这些联系绕过了国家行政机构和公共、公民社会机制，而是利用了混沌通信大会的隐蔽性。\n\
    \n第二个结论更具假设性，但我觉得需要公开陈述。我认为合理地相信一些黑客活动人士很可能参与了塑造欧盟《通用数据保护条例》的过程。当我对这种活动进行假设时，我并不是指通过提供非法通信网络访问、传播泄密或组织异议来实现。我指的是向欧盟分析师和法律研究人员提供专业知识——不是通过游说、智库活动、政策文件或其他形式的公开倡导。\n\
    \n 20. 与 GDPR 相关的一系列变化是在多个层面上发展的，既在欧洲议会内部也在外部。重要的是，GDPR 影响了欧洲联盟边界之外的国家。通过法律和软件标准的结合来扩展政治权力范围的这种形式被称为“布鲁塞尔效应”（Bradford,\
    \ 2021）。只有最近，社会科学研究才认识到其影响不仅在于全球数字贸易或国际关系（Eskhita & Stamhuis, 2024；Ylönen, 2025），还在于网络安全职业（Birnhack\
    \ & Mundlak, 2025）。作为一名民族志学者，我观察到欧盟官僚如何在混沌通信大会期间举行“公开”咨询，混沌通信大会是连接网络安全和黑客活动的最大会议之一。正如我参与了一些关于公众理解科学相关问题的研讨会，我被要求不要提供更多细节。\n\
    \n欧盟法规直接与黑客社群和网络安全专业人士互动。自 2018 年以来，涉及欧洲公民数据的泄密事件不再只是公关问题。它们可能成为严重的财务罚款来源，正如国家行政机构所施加的那样。数据保护的商业激励相当强劲，因为数据泄漏的潜在罚款可能高达\
    \ 2000 万美元或公司年收入的 4%。简单来说，忽视数据政策的成本可能远高于花费更多来改善安全。\n"
