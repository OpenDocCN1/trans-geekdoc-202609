- raw: 'This difference becomes even more visible when one considers different CTF
    formats. Teams compete in solving tasks given by the judges (the so-called “Jeopardy”
    format) or against each other (attack-defence format). The former usually involves
    more cerebral, focused and extended events. The latter is shorter and more confrontational,
    as teams simultaneously maintain their infrastructures and attack the IT infrastructures
    operated by other teams. Points are scored for maintaining a stable service and
    for disrupting the services of others. In attack-defence events, part of the team
    must assume the role of defenders and system administrators. Attack-defence hacks
    often require make-do, “good enough” solutions rather than long-term strategies.
    This also resembles a popular split in security. The red team focuses on offensive
    research, and the blue team focuses on defensive research. During “Jeopardy” formats,
    this logic is shifted. Tasks are not divided into offensive/defensive but into
    specialisations, as shown in [Table 3.1](#ch03.xhtml#_24044-2003_ch003_tab_001).


    Both types emphasise the two elements of a thought collective. Attack-defence
    is the simulation of attacks on large infrastructure in real time. Methods are
    often crude, everybody is high on adrenaline, and defenders often resort to using
    honeypots. Using these, they try to bait the attackers into revealing and disclosing
    themselves, making hostile actors vulnerable to counterattacks or identification.
    Jeopardy CTFs are usually longer. Their ebbs and flows relate more to cerebral
    exhaustion and not to opponent actions. Interviewees described them less as minefields
    and besieged ramparts and more as puzzles and ornate tapestries.


    If attack-defence evokes a real-time emergency or popular representations of military
    cyberspace operations, “Jeopardy” CTFs are closer to planned anti-infrastructure
    projects, science or espionage. Attack-defence model situations are like “all
    hands on deck” where an incident occurs on the network as the team exhausts the
    recommended caffeine dosage for a small village.  45. Jeopardy CTFs are slower
    and more methodical. Problems benefit more from a careful selection of techniques
    than the “good enough” approach.


    Time framing matters not only for understanding social changes but also for understanding
    political framing. The difference in time framing between different projects was
    explored in STS a long time ago ([Traweek, 1992](#bibliography.xhtml#_24044-2003_chp005_ref162)).
    It is still relevant in STS research on robotics and space communication ([Vertesi,
    2015](#bibliography.xhtml#_24044-2003_chp005_ref157)). Despite this, little is
    known about time framing and the infrastructure and differences in time framing
    within the thought collective. I cannot discuss this here in more detail. Still,
    the participants noted and appreciated that the CTFs allowed them to “experience
    a different rhythm” (from an in-site impromptu interview). It was not only about
    the condensed, intense, flow-inducing feeling of competitive hacking. For some
    players, it was precisely the opposite: the CTF tournaments were more cerebral
    and more reflective than other events in their professional lives.


    This split between reflection and hectic action is also mirrored in the two types
    of games. Attack-defence CTFs are hectic. There is an almost continuous feedback
    loop between the attacking and defending elements of one team. When defenders
    identify what is thrown at them, the attackers gain a new tool in their arsenal.
    Sometimes, the situation resembles war games, as attackers delay releasing a new
    offensive until defenders prepare to defend against the same method used against
    inventors. Observing a team playing attack-defence is like observing an emergency
    command centre. Attack-defence CTFs are like “blitz” chess: exhausting, engaging
    and demanding ruthless attention.


    If attack-defence is “blitz”, then “Jeopardy” is classical chess. Everybody around
    the table speaks in hushed voices, as all other team members are engaged in rigorously
    complex thinking. When CTF players discuss the possibilities of solving tasks
    or some properties of electronic systems, it was not uncommon to hear the invocation
    of theorems, papers and formal proofs. Of course, hacking is much more than the
    formal sciences, so underground zines, gossip and news from security conferences
    are also discussed as viable hints.


    Teamwork in “Jeopardy” events is less focused on crossing the divide between offensive
    and defensive hacking. Interviews and casual talks more often mentioned cross-specialisation
    discussions. More complex tasks often move from one category to another, exercising
    constant switches between classifications shown in [Table 3.1](#ch03.xhtml#_24044-2003_ch003_tab_001).
    When interviewed, participants said that this ability to recognise problems from
    other subfields was a benefit of solving tasks outside their primary specialisation.
    In this sense, CTFs provide the opportunity to learn details within the subdomains
    of security. What is even more important, those details were presented as interwoven
    with each other, so hackers and professionals also learned them in associated
    contexts.


    This richness of interwoven contexts, technical subtexts and deliberate misleads
    makes CTFs living test beds for security knowledge. In this sense, it resembles
    a seed bank or a wild habitat. CTFs are numerous, ubiquitous and varied in sophistication
    and accessibility. They reflect not only changes in  46. hacking culture but also
    changes in security epistemic culture. Notice how one participant emphasises the
    unique and detached character of CTFs in [Fragment 3.1](#ch03.xhtml#_24044-2003-003-001).
    The participant’s discussion of temporal separation furthers the idea of “ritual
    condensations and celebrations of hacking lifeworlds”([Coleman, 2010](#bibliography.xhtml#_24044-2003_chp005_ref32)).
    Biella Coleman’s remarks on rituals in hackerdom almost ideally matched the significance
    assigned to CTFs by individuals (see [Fragment 3.3](#ch03.xhtml#_24044-2003-003-003)).
    The intensity of CTFs is palpable, addictive and contagious. Even with my modest
    computer security knowledge, I felt energised and compelled to try to understand
    the solutions. Cerebral festivity is transcribed into a prolonged sense of pleasure
    from abstract thinking. CTFs are joyful for other hackers, not only because one
    can see players’ actions but also because one may empathise with their state of
    focus and care.


    Each CTF team usually consists of four to twelve players. Depending on the event,
    there may be rules about the maximum number of players present and their physical
    attendance. Players share their origins: the same country, company department,
    or government institution. They self-delegate tasks according to their specialisations
    (see [Table 3.1](#ch03.xhtml#_24044-2003_ch003_tab_001)).


    Standards tell stories in STS ([Bowker & Star, 2008](#bibliography.xhtml#_24044-2003_chp005_ref17)),
    but this is even more; this is a meta-standard that serves as a rudimentary categorisation
    for unknowns. It is unwritten, malleable and held only through social conventions
    and communal events. It is also a rudimentary, rough and less-than-obvious counterpart
    for International Classification of Diseases Eleventh Revision (ICD-11) but applicable
    to errors and anomalies in digital infrastructures. While STS research on ICD
    often understood it as a layer of the infrastructure of human health ([Aue, 2021](#bibliography.xhtml#_24044-2003_chp005_ref7)),
    its counterpart for digital infrastructures escaped such scrutiny. However, STS
    should study both, despite the former being more abstract and distant from everyday
    experience.'
