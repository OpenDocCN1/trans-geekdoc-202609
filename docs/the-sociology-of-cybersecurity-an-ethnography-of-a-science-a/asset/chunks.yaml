    所以，对于我对“思想集体”的理解，没有任何其他例子能比得上“大个子”：即共同被称为 Spectre 和 Meltdown 的一组安全漏洞。与本章中许多其他例子一样，本可轻易成为独立书籍的内容，在此仅作为论证所引用的简化。我几乎惊讶于没有其他网络安全领域的哲学家或社会学家尝试对其进行智识层面的探讨，但正如俗话所说：“在同一房间进行的对话中，不可能存在大到足以被排除在讨论之外的房间里的象”。^()


    37. 漏洞的概述由 Abu-Ghazaleh 等 (2019) 的一篇流行论文给出，而技术重构则可在 Prout 等 (2018) 的著作中找到。其规模如此巨大，是因为后来被称为
    Spectre 和 Meltdown 漏洞家族的漏洞影响了大量系统。简单来说，推动商业计算在十几年间崛起的计算处理器之所以如此之快，是因为在优化传入指令的堆叠时，它们进行了简化和预测。然而，通过窃听并干扰此类预测的顺序，第三方可能获得了几乎所有处理操作结果的访问权限。用一个完全外行的比喻来说，Spectre
    和 Meltdown 类似于通过仔细操纵整个大脑尺度上神经元之间的氧化平衡，实时聆听一个人的思想。通过在预测、擦除和数十亿条命令的后勤之间的极边缘进行操纵，在数字位和汇编语言中的命令行变为半导体中电状态的空间里，漏洞便可被利用。


    作为一名社会学家，让我着迷的并非所揭示漏洞的规模，也不是全新漏洞家族的发现。不，对于社会学家来说，真正令人叹为观止的是，这些论文来自社会学起源完全不同的研究团体。砰！Google
    安全实验室。砰！大学实验室。砰！一家小型网络安全公司。砰！自由职业者与前述论文部分作者之间的合作。


    那就是多重发现，正如科学史或科学哲学中所知，即在各自从事分离但相互关联问题的领域研究人员找到彼此一致的解决方案时发生的现象。对社会学家而言，这令人兴奋，因为它表明某个科学团体已达到如此程度的相互联系和连贯性，以至于不同起源的团体得出了相同的结论。库恩在微积分或爱因斯坦案例中试图用时代精神或格式塔来解释的东西，我理解为连贯性的标志、通过数字和实体协作的认知强化，以及社会学抽象仍然值得研究的标志。在短短几年（2016
    年至 2019 年）的时间里，对商业处理器的理解发生了变化，而我认为，我们对世界的理解也随之发生了变化。


    通过概念化“思想集体”，我无意削弱任何个人或贡献团队的署名权。我知道 Spectre 和 Meltdown 的发现可以追溯到 1995 年的论文。我想传达的是，达到这种研究精熟程度并记录该漏洞的规模和复杂性，不仅需要天才的思想风格，还需要思想集体的复杂性、连贯性和发展。因为没有后者，发现之间的联系可能需要数年时间才能找到。然而，到
    2025 年，Spectre 和 Meltdown 的规模、后果或机制基础，尽管复杂，但已在社会学家的感知范围之内。


    38. 当然，如果在其他任何地方的机械工程中发现了类似规模的漏洞，关于规模、知识和缺乏生产控制的问题就应该被提出。很可能它们不会被公开提出。但至少，存在知识。


    ## 摘要。什么是网络安全知识的政治经济学？


    在本章中，我讨论了三个有助于理解网络安全的概念。“实验室”有助于理解日常协作和认知行为。“职业”描述了公众认可、公众信任以及法律和国家机构所承认的自主程度。“思想集体”允许讨论诸如研究者内部圈子与实践者和传播者外部圈子之间的互动等模式。我不是这些概念的作者，但我的贡献在于认识到它们在网络安全背景下的可用性和验证。


    社会学很少有轰动性的发现。将 Spectre / Meltdown 看作该领域连贯性的标志并通过 Fleckian 概念对其进行解释，在解释被呈现时可能显得微不足道。同样，当针对勒索软件或机车故障的保险被解释为专业管辖权发展中的激励因素时，也可能显得既显而易见又无关紧要。


    我认为社会学概念化具有实际意义。例如，如果没有“实验室”的概念，我将无法理解 CTF 竞赛作为实验复制的等价物，也很难将网络安全中的性别歧视和种族主义案例与第
    6 章中科学中类似的暴力进行比较。如果接受之前提出的实验室概念，人们可以问：什么样的错误会受到赞扬，哪些被隐藏，哪些被推入该团体中初级合作者个人羞耻的问题？马蒂尔达效应如何？研究人员倦怠背后的社会机制如何：个人与研究的认同、对高成就领域公众形象的同伴压力等等？


    对我而言，所提出概念化的最有趣的含义在于政治经济问题。追溯到卡尔·马克思的悠久传统，我认为技术是对劳动的知识的应用性、物质性投射。在 Matteo Pasquianelli（2023）之后，我理解数字算法是塑造并源于其数据集的，而非将算法视为有限、明确定义的程序。在这种意义上，算法与历史上任何技术一样，通过同样的应用机会塑造世界。知道某事在这种或那种条件下被完成，比仅仅知道未来还能做更多事情要重要得多。


    正如 Spectre / Meltdown 所显示的那样，网络安全守卫着几乎每台数字设备中数字抽象的根本基础。在其最 39. 有前景且具有公民性的形式中，它作为第四权力的形式迫切必要，以逆向工程机车、算法、配送平台、情报机构、秘密监狱、窃听和社会学程序，以确保人类、民族、资本、国家或科学造成的任何暴力都不会逃脱公众的审视。


    然而，正如我所试图传达的，网络安全的政治经济学不仅来自其对国家或资本的有用性，甚至也不仅来自其界定数字中介基础设施的能力。如果数字算法不仅分析数据，而且共同塑造数据集以及建立在数据集上的社会（Pasquinelli,
    2023），那么网络安全就是真理-权力的体制。

