- raw: 'My conceptualisation of laboratories is built on works of [Bruno Latour and
    Steve Woolgar (1986](#bibliography.xhtml#_24044-2003_chp005_ref83)), Harry [Collins
    (2017](#bibliography.xhtml#_24044-2003_chp005_ref35)), [Karin Knorr-Cetina (1999](#bibliography.xhtml#_24044-2003_chp005_ref77)),
    [Izabela Wagner (2011](#bibliography.xhtml#_24044-2003_chp005_ref159)) and many
    others. The advantage of this approach was that I looked for similarities in everyday
    research work in other disciplines: funding, correcting publications or equivalents,
    reacting to advancements in the field, career trajectories, etc. The downside
    is that by making such broad-scope comparisons, one can easily forget that each
    of the referenced works was also situated in particular context of its time, institutional
    setting, research field, etc. The challenge in conceptualisation of the laboratory
    lies in understanding similarities, without reification, which is a fancy word
    for treating some social characteristics as natural, unchangeable and eternal.
    As a sociologist, I am as distrustful of reifications as security researchers
    are, because what is left unsaid as obvious is often simultaneously the most binding
    and most fragile of the components of social structure.


    This is why I wish to be precise. Not every collaboration is a laboratory, and
    not all discoveries have to originate in a laboratory either. I introduce the
    concept not to explain everything, but because it shifts some attention to the
    changing scale of collaboration in cybersecurity.


    As [Steven Shapin and Simon Schaffer (1985](#bibliography.xhtml#_24044-2003_chp005_ref134))
    or [Harry Collins (2017](#bibliography.xhtml#_24044-2003_chp005_ref35)) painstakingly
    documented, establishment of laboratories signals a certain degree of specialisation,
    in terms of measurements, techniques, calculation or experimentation. This is
    also why I believe that careful understanding of laboratories *as social structures*
    is key for answering questions about cybersecurity knowledge.


    What was important for my conceptualisation from [Shapin and Schaffer (1985)](#bibliography.xhtml#_24044-2003_chp005_ref144)
    and from [Collins (2017)](#bibliography.xhtml#_24044-2003_chp005_ref35) is the
    redefinition of the demarcation problem from a domain of philosophy to the domain
    of social practice. In other words, to answer what is cybersecurity as a science,
    one has to answer what doesn’t count. Yet, as a sociologist, I am less interested
    in asking this question in general than in attempting to develop how this question
    is understood by practitioners. Thus, my conceptualisation: the laboratory is
    a site and a community of demarcation because, only on this exact scale, decisions
    are made about what to count as noise and what to include in measurement.


    On a side note, by this point of the book, it should be clear that my usage of
    “laboratory” is not aimed to separate “academic” or “scientific” cybersecurity
    from “practical” or “hacking” or “illegal” or to create any demarcations as a
    part of my conceptualisation. As a sociologist, I observe that the cybersecurity
    uses and is used to demarcate various other social structures and institutions,
    but that does not mean that I accept those demarcations as “objectively existing”.
    As mentioned in the introduction, the benefit of the lens of both science and
    work is that I can freely disregard the divisions between state, private, criminal
    or non-formal actors. In the context of this book, a well-funded  27. academic
    group may not be called a lab, if it does not reduce costs of failure for its
    members through the mechanisms I describe in this section. Contrarily, what could
    be easily considered illegal, unimportant or local knowledge at best, I may theorize
    as a lab. For the scale of the given community, this was the social setting for
    reduction of cognitive, ethnical or material consequences of failed experiments
    as recognized by actors in a given community. For me, as a sociologist, the science
    is inextricable from the society that uses it.


    For example, [Jonathan Spring and Phyllis Illari (2025](#bibliography.xhtml#_24044-2003_chp005_ref144))
    asked a great question about whether cybersecurity has an equivalent of experiments,
    understood as isolated test beds of cases that are differentiated through interventions  28.
    and that can be later generalised. As Spring and Illari show, practices known
    in cybersecurity as threat intelligence can be understood as non-experimental,
    that is, knowledge as coming from observations. As with many great questions,
    I have an ambivalent answer. On the one hand, I recognise different practices
    in cybersecurity as clearly following a separation-intervention-generalisation
    pattern, from which I claim that cybersecurity encountered issues not unlike experiment
    replication. On the other hand, please note [Fragment 2.1](#ch02.xhtml#_24044-2003-002-001).
    The interviewee is an experienced and acclaimed cybersecurity researcher. The
    interview is about a relatively small project that focused on a system that was
    out of the commercial use. The interviewee researched it, with collaboration,
    primarily for personal interest.


    ## Profession. Context of Actions.


    If laboratories provided context for the unknown, then the profession serves as
    a collective bargaining mechanism with the state and other actors. Andrew [Abbott’s
    (1988)](#bibliography.xhtml#_24044-2003_chp005_ref1) *The System of Professions*
    tracked the development of medical, legal and accounting occupations into what
    sociologists call “professions”. The key difference between the latter and the
    former lies in competition over jurisdiction, which is a conflict over the degree
    to which specialists in the given field can make rules for this field. If it takes
    other lawyers to accept a person to a bar association, then a profession exists.
    Medicine, accounting and law developed areas of occupational monopolies for defining,
    judging, recruiting and excluding their practitioners.


    At first glance, cybersecurity looks like a wrong case for a profession. In the
    majority of nation-states, there are no equivalents of bar or medical associations
    for cybersecurity researchers. While I have not conducted a full legal review,
    in my conversational knowledge in most of the Global North, cybersecurity regulations
    are far from their counterparts in accounting, law or medicine. There is a good
    case to doubt whether social structures in 2025 can form that kind of middle-class
    interest lobbing, as tracked by Abbott in the 19th and the early 20th centuries.
    Social patterns are, after all, always embedded in their time.


    Instead, I will offer a description of cybersecurity research that convinced me
    to think otherwise.


    At the end of 2023,^()


    The researchers were hired by a railroad maintenance yard, which has won a contract
    to service Impulses that run in suburban and regional rail lines.  32. Initially,
    the yard proceeded as it was a locomotive maintenance issue. It performed repair,
    replacement and other services, as per producer’s manual. However, despite the
    “normal” railroad work, the locomotives declined to run again. There was also
    no pattern in their failures: some of them failed after only a few hundred kilometres,
    and there was no clear record of heavy weather, heavy load or abnormal rail operation
    or signal conditions. Typical “suspicious” mechanical parts were serviced and
    re-checked once again. When even this failed, ZNTK decided to commission an inquiry
    in matters of cybersecurity, industrial automation and its relation to software
    and hardware. The inquiry was contracted to a group affiliated with the Dragon
    Sector, a cybersecurity e-sports team, because Dragon Sector was highly regarded
    for their skills, especially in reverse-engineering (Haertle, 2023).'
