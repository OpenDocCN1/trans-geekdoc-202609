    ## Crowds of Users/Audiences


    Now, I discuss a less glamorous part of the CTF scene. Colleagues from less prestigious
    or more local events are more likely to be at the beginning of their careers.
    Some may be students or software developers in transition to security. For others,
    local CTFs may be a pleasant change in the routine of an older academic network
    administrator or a local Linux guru. Some may be artists “just dipping into the
    sec” (direct quotation) or other types of occasional aficionados. An example of
    such a CTF can be found in [Fragment 3.2](#ch03.xhtml#_24044-2003-003-002).


    Maxigas and Söderberg’s (2008) typology recognises this group as “crowds of users/audiences”.
    They are above the level of “click workers”, as they still have significant autonomy
    and expertise. Their CTFs go beyond just replicating tasks from more prominent
    events. For example, tasks may require brief familiarity with Shodan,^()


    ### Fragment 3.3 Organiser’s description of the CTF


    I identify this event as a “crowd of users/audiences” event. It emphasises lightness,
    a welcoming character and education. It also visibly demarcates the specialisation
    of expected tasks. [Return to text.⏎](#ch03.xhtml#R_24044-2003-003-003)


    While the framing of a “crowd of users” easily applies to local events, the category
    of “audience” is less applicable. During “crowd” CTFs, blurring the boundary between
    the audience and participants is even more common. They are communal not in the
    sense of global security experts’ community but in the sense of local communities
    of security specialists and administrators.


    This is the second aspect of the politics of infrastructures and thought collectives.
    CTFs serve as peer mediation mechanisms and knowledge-sharing rituals between
    different digital security approaches. If “peer production” CTFs are more similar
    to critique-recuperation dynamics at the transnational scale, then “crowd” CTFs
    resemble a controversy about cracks in a newly built local pedestrian bridge.


    Observing communities involved at different levels of the thought collective provided
    some findings about the politics of infrastructures. As in IT, knowledge about
    infrastructure is often circulated through communities of practice. What may be
    surprising is that communal events and knowledge rituals are still valued, even
    for highly distributed and remote digital infrastructures on all levels. This
    is the most “social” aspect of the politics of CTF, simply an act of being together
    with other practitioners from the otherwise elite and often secluded profession.


    The next layer of politics is built atop social gatherings. CTFs have become political
    recruitment and propaganda tools. Notice how valuable the gamification is in this
    case. It allows us to play around security and hacking without conflict with the
    secrecy of the workplace and “serious” infrastructure outside of a CTF. In this
    sense, the space-time reduction of seriousness and “serious politics of serious
    infrastructure” makes them political.


    Labour resistance is another dimension of labour relations ([Söderberg & Maxigas,
    2022](#bibliography.xhtml#_24044-2003_chp005_ref141)). If one considers hacking
    as labour resistance of skilled labour elites, how does unpaid CTF play-work or
    play-education fit into this logic? Throughout the history of technology, craftworkers
    insisted on payment for training because of a belief that work should be paid
    for ([Kaiser, 2005](#bibliography.xhtml#_24044-2003_chp005_ref72)). From this
    perspective, the non-direct benefits of otherwise unpaid CTFs become political,
    similar to open science ([Mirowski, 2018](#bibliography.xhtml#_24044-2003_chp005_ref109)).
    This applies to the arena of critique of existing knowledge/power relations and
    the process of recuperation of knowledge shared in the community without payment
    for the sustenance of the community.


    ## “Hack Me Baby One More Time”: Replication of a Security Exploit


    In previous sections, I discussed the conceptual, political and social ecologies
    of infrastructures. In this section, I discuss the replication of the anomaly,
    its materiality and its politics.


    For the sake of privacy, I anonymised and generalised technical details and reconstructed
    a biography of a generalised task. For the sake of simplicity, I discuss only
    tasks from “Jeopardy” CTFs, as they are easier to transfer between the events.
    However, because the process may appear convoluted, a summary is included in [Table
    3.2](#ch03.xhtml#_24044-2003_ch003_tab_002). Notice that my reconstruction goes
    beyond a singular CTF event as it includes the pre-event and post-event life of
    the task.


    As the task authors recollected in the interviews, the process starts with “the
    idea of a cool problem”. Usually, this is a gap in the digital infrastructure
    or a security exploit. The author repackages it into a different context. Old
    problems re-emerge in new versions of systems or descendants of old architectures.
    Analogies or generalisations of security loopholes are created. The task authors
    reported a solitary process in this phase, although they emphasised communal sources
    of knowledge and the importance of social knowledge sharing.


    It is worth noting that almost no interviewees discussed task ideas in abstraction.
    They are always related to a particular family of infrastructure or software.
    Tasks could have been about the generalisation of an anomaly on another class
    of networks. Still, the idea of the task was reported in relation to the materiality
    of the infrastructure. Using interview fragments, writeups, chat logs and recorded
    fresh talks, I reconstructed how security vulnerabilities are abstracted into
    and from CTF tasks in [Table 3.1](#ch03.xhtml#_24044-2003_ch003_tab_001). This
    cognitive process is made as a game, which sustained the cognitive engagement
    through the emotional involvement of the players and teams.


    Emotional justifications behind task-making differed. Knowledge-sharing and prank-making
    were important but so were phrases like “It looked like an interesting paradox.
    I wondered if people recognise it”. I interpreted and empathised with feelings
    of pride and satisfaction from fragments on clever tasks and mechanisms similar
    to “impostor syndrome” from phrases on faulty tasks. While many previous STS studies
    on infrastructure focused on anomalies and their political resolution, less attention
    was paid to reverse engineering and replicating the cognition of anomalies in
    the community.


    ### Table 3.2 Recuperation of critique of the infrastructure – the CTF task model


    [Return to text.⏎](#ch03.xhtml#R_24044-2003_ch003_tab_002)


    | # | Phase | What happens with the task? | The relevance of recuperation to infrastructure
    |

    | --- | --- | --- | --- |

    | 1 | Task Idea | The possible infrastructure gap is not yet materialised into
    the task infrastructure by the author. | The research and conceptual work are
    conducted. The task author decides what elements of infrastructural critique/hacking
    will be adequate for the tournament players, tournament level and task category.
    |

    | 2 | Task Preparation | The infrastructure gap is materialised into the task
    by the author. | The critique is recuperated to the temporary infrastructure of
    the task. |

    | 3 | Task Testing | The relation between the task and the gap is solidified,
    tested and tempered by the author of the task, arbiters and testers. This happens
    before the CTF event. | During this step, the critique becomes specialised and
    encultured into security epistemology. |

    | 4 | Task Reveal and Recognition | This task is revealed to the players in the
    form of test bed infrastructure. The infrastructure gap is hidden and ready to
    be hacked. | The second step of recuperation. The task is presented to communities
    and crowds to discover the infrastructure gaps hidden in tasks. |

