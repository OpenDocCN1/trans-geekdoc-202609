  trans: '

    或许正因如此，建立系统性才成为可能，尽管极其复杂。这也可能是为什么不存在 CTF 类别的有限列表，因为该列表随着黑客行为本身而变化和演变。通过这种不完整性，CTF
    使数字技术的理解得以被共享、复制和争论。这也使得黑客文化得以延续，并在思想共同体中保持连续性，尽管经历了几个技术变革时代。借鉴并扩展 Gallison 关于贸易区中交错模型（2008）的观点，可以假设思想共同体为基础设施变革时期提供了锚点。反向关系也可能成立，因为思想共同体中的动荡时期正是由基础设施的物质性所锚定和稳定。


    ### 片段 3.1

    黑客文化生活世界的庆祝与脑力锻炼的喜悦交织在一起。这种解决和复制安全问题的脑力锻炼变得可以被收编为无偿的专业培训和脑力劳动。返回正文。⏎


    ### 表 3.1 CTF 类别

    返回正文。⏎


    CTF 任务在“Jeopardy”格式中的类别。CTF 类别的变革改变了信息安全职业和基础设施。逆向工程被直接承认为一个独立的专业，与密码学并列。虽然密码学可以被识别为
    STS 研究对象（West, 2022） of study，逆向工程可能更成问题。黑客是该理论的直接灵感来源，但工程史提供了许多其他例子。


    | 缩写 | 技术领域 |

    |---|---|

    | Crypto | 数学密码学的软件应用。 |

    | Rev, RevEng | 逆向工程，或弄清封闭和未知系统的工作原理。在 STS 之外的领域打开黑箱（例如电子系统）。 |

    | Bin | C 编程语言和汇编器对内存的操作。有时涉及二进制文件的利用。 |

    | Web | 利用网页的特征、技术如 HTML 等。 |

    | Forensics | 恢复已删除文件、解析数据寻找隐藏信息、对图像中的模式进行分析。 |


    观察 CTF 显示，基础设施中的错误与修复的辩证法映射了思想共同体中的批判与收编的辩证法。基础设施中的错误与修复循环甚至可能脱离公共政治的时间框架或公众兴趣的周期。如果基础设施在正常工作时被视为理所当然，那么基础设施中的错误对于公众和非参与者来说可能双重不可见。


    现在是下一步的时候了。我提到思想共同体是分层的，取决于知识的抽象程度和守门机制。现在，我将概述思想共同体中此类过程的概况。


    ## 社区与人群：思想共同体的分层

    CTF 活动参与人数各不相同。最重要的大赛超过 400 名玩家。最小的可能只有 3 支队伍和 15 名玩家。造成差异的不是人数，而是参与者的专业构成以及活动的相对声望。


    在关键活动中，我有机会与该行业的精英交谈。他们包括 10 家知名软件公司安全部门的高级专家、学术密码学家、安全研究员、薪酬高昂的渗透测试员和安全架构顾问。也许公众不太了解，但同样关键的是国家计算机应急响应团队（CERT）专家。对业外人士而言，CERT
    就像国家外科医生或医学顾问，在安全紧急情况下提供应急响应。出于匿名性和职业关怀的义务，我无法透露我合作过的国家（CERT）、公司、大学或活动。出于设计考虑，我没有记录姓名、锦标赛名称或日期。匿名性和保密性很重要。对于顶级队伍，CTF
    活动是专业声望的竞技场，交流知识并发现对其他情况下讨论不足的细节的共同理解。CTF 的更高层级用于交换思想、八卦和神秘的默会知识。


    CTF 活动常唤起地下、怪异或令人不适元素的形象。它们服务于多个目的。首先，它们阻止那些对黑客文化浸润不足的人产生兴趣，同时也充当一种未言明的精英守门机制。其次，令人反感和令人困惑的象征主义增加了参与者的认知和情感体验。当某些元素可以通过熟悉的符号来导航时，技术问题的认知负荷变得不那么难以承受。最后，响亮的象征主义将
    CTF 划定为非工作情境。在这方面，CTF 任务映射了 CTF 美学，如所示在 片段 3.1。


    这一偏好集合既是认识论的也是文化的。同意 Maxigas 和 Söderberg (2022) 的观点，我也将 CTF 社区理解为“同行生产者社区”。我想提出一个观察，即当认识论聚焦于错误和异常时，点对点机制变得至关重要。


    在更负盛名的 CTF 锦标赛中，选手们常将其用作“进入”安全精英阶层的尝试。该群体中的黑客和安全专业人士拥有最高的劳动自主性和专业专长，因此有时他们被羡慕并非一定因为金钱或声望，而是因为有机会从事“有趣的问题”工作（表
    3.2 展示了关于这种倾向的一些片段）。CTF 任务就像“解决美丽的数学问题，是愉悦和审美感知的来源”（受访者直接引语）。他们的技艺和在 CTF 中的实践对基础设施很重要，因为它们生产并再生产差距、错误和极端案例。在我看来，CTF
    在认识论上更多地服务于复制、共同讨论或同行评审，而较少服务于发现。


    普遍认为安全部门和其他理想雇主会关注更负盛名的锦标赛。参与 CTF 是参与安全话语。任务作者提出对现有技术的批判。玩家将其收编或反驳。玩家为各种黑箱提出安全模型。


    这是对 CTF 最直接的政治解读。它们之所以具有政治性，仅仅是因为它们在全球范围内聚集了计算机安全精英。聚集的效果可能各不相同，但仅仅是在全球跨国和跨公司层面上非正式制度化的聚集这一事实就使其具有政治性。它们更像知识交流、专业休闲时间还是招聘活动，应在进一步研究中详细调查。


    ### 片段 3.2

    对问题“什么构成一个好的 CTF 任务？”的回答。参与者强调新知识、颠覆预期和脑力挑战。随机性和枯燥性受到批评。还请注意参与者如何强调“好类型的破碎系统”与坏的区分。这类似于认识论美学对数学证明的认可的表达。返回正文。⏎

    '
