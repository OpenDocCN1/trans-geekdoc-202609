  trans: '

    我对实验室的概念化建立在 布鲁诺·拉图尔和史蒂夫·伍尔加尔 (1986)、Harry 科林斯 (2017)、卡林·克诺尔-切蒂娜 (1999)、伊扎贝拉·瓦格纳
    (2011) 以及许多其他人的著作之上。这种方法的优势在于，我在其他学科的日常研究工作中寻找相似之处：资助、校正出版物或其等价物、对领域进展的反应、职业轨迹等。缺点是，通过这种大范围的比较，人们很容易忘记，每一部被引用的著作也都置于其特定时代、制度环境、研究领域等特定语境之中。概念化实验室的挑战在于理解相似性，而不陷入物化——这是一个花哨的词，指把某些社会特征视为自然的、不可改变的和永恒的。作为一名社会学家，我对物化的不信任程度与安全研究人员相同，因为被默认为理所当然而未言明的部分，往往同时是社会结构中最具约束力也最脆弱的组成部分。


    因此我希望保持精确。并非每一次合作都是实验室，也并非所有发现都必须源于实验室。我引入这一概念并非为了解释一切，而是因为它将部分注意力转移到网络安全协作规模的变化上。


    正如 史蒂文·沙平和西蒙·沙弗 (1985) 或 Harry 科林斯 (2017) 所 painstakingly documented，实验室的建立标志着在测量、技术、计算或实验方面的一定程度的专业化。这也是为什么我认为，仔细理解实验室
    *作为社会结构* 对于回答关于网络安全知识的问题至关重要。


    对我概念化而言，从 沙平和沙弗 (1985) 和从 科林斯 (2017) 中重要的，是将划界问题从哲学领域重新定义为社会实践领域。换句话说，要回答网络安全作为一门科学是什么，就必须回答什么不算数。然而，作为一名社会学家，我对一般性地提出这个问题兴趣不大，而更想尝试发展实践者如何理解这个问题。因此我的概念化：实验室是一个划界的场所和共同体，因为只有在这个精确的尺度上，才会做出关于什么算作噪声、什么纳入测量的决定。


    顺便一提，到本书的这一点，应该已经清楚，我对“实验室”的使用并非旨在将“学术”或“科学”网络安全与“实践”或“黑客”或“非法”相分离，也不是在我的概念化中创造任何划界。作为一名社会学家，我观察到网络安全被用来划界各种其他社会结构和机构，也被用来被划界，但这并不意味着我接受那些划界为“客观存在”。正如在引言中提到的，科学与工作的双重视角的好处在于，我可以自由地忽视国家、私人、犯罪或非正式行动者之间的划分。在本书的语境中，一个资金充足的  27.
    学术团体可能不被称作实验室，如果它没有通过本节所述的机制为其成员降低失败成本。相反，我可能会将那些很容易被认为是非法的、无足轻重或充其量是地方性知识的东西理论化为实验室。对于特定共同体的尺度而言，这是在该共同体的行动者所认可的意义上，降低认知、伦理或物质层面失败实验后果的社会环境。对我而言，作为一名社会学家，科学与使用它的社会是不可分割的。


    例如，乔纳森·斯普林和菲利斯·伊拉里 (2025) 提出了一个很好的问题，即网络安全是否具有实验的等价物，理解为通过干预而区分的案例的孤立测试床  28.
    并且可以后来被推广。正如 Spring 和 Illari 所示，网络安全中被称为威胁情报的做法可以被理解为非实验性的，即知识来自观察。像许多好问题一样，我的答案是矛盾的。一方面，我认识到网络安全中的不同实践明显遵循分离-干预-推广模式，由此我认为网络安全遇到了与实验可重复性不无类似的问题。另一方面，请注意
    片段 2.1。受访者是一位经验丰富且备受推崇的网络安全研究员。访谈涉及一个相对较小的项目，该项目聚焦于一个已退出商业使用的系统。受访者主要出于个人兴趣，与他人合作对其进行了研究。


    ## Profession. Context of Actions.


    如果实验室为未知提供了语境，那么职业则充当了与国家和其他行动者进行集体谈判的机制。Andrew 阿博特的 (1988) *职业体系* 追踪了医学、法律和会计职业如何发展成为社会学家所称的“职业”。后者与前者的关键区别在于对管辖权的竞争，即在特定领域内专家能够多大程度上为该领域制定规则的冲突。如果需要其他律师来接受某人加入律师协会，那么一个职业就存在了。医学、会计和法律发展出了用于定义、评判、招募和排斥其从业者的职业垄断领域。


    乍一看，网络安全看起来像是职业的一个错误案例。在大多数国家中，网络安全研究人员没有律师协会或医学协会的等价物。虽然我没有进行全面的法律审查，但在我对全球北方的大多数国家的对话性了解中，网络安全法规远不及会计、法律或医学的对应物。质疑
    2025 年的社会结构能否形成阿博特在 19 世纪和 20 世纪早期追踪的那种中产阶级利益游说是有充分理由的。毕竟，社会模式总是根植于其时代。


    相反，我将提供一个让我改变想法的网络安全研究的描述。


    2023 年底，^()


    研究人员被一家铁路维修厂聘用，该厂赢得了一份为在郊区和区域铁路线上运行的 Impulse 提供服务的合同。  32. 最初，该厂将其视为机车维护问题。它按照生产商手册执行了维修、更换和其他服务。然而，尽管进行了“正常”的铁路工作，机车仍然无法再次运行。它们的故障也没有规律：有些机车在仅行驶几百公里后就失效，而且没有重天气、重载或异常铁路运行或信号条件的明确记录。典型的“可疑”机械部件再次得到维修和复查。当这也失败时，ZNTK
    决定就网络安全、工业自动化及其与软件和硬件的关系展开调查。该调查委托给了与 Dragon Sector 有关联的一个团体，Dragon Sector 是一个网络安全电子竞技团队，因为
    Dragon Sector 因其技能而备受推崇，尤其是在逆向工程方面（Haertle, 2023）。

