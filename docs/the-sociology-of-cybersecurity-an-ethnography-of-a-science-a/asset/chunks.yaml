    3. 科学、技术、社会——社会科学和人文学科中广泛领域的缩写。或者，同一缩写被理解为科学技术研究。后者对非社会学家更具包容性，而前者则更侧重于结构性考量，以及将每个组成部分理解为半独立的、但复杂、相互交织和重叠等。作为社会学家，我将我的实践定位得更接近前者的理解，而作为研究者，我坚信后者的包容性。返回正文。⏎


    4. 我不同意 Glenn Greenwald 于 2022 年提出的道德、伦理和职业标准，无论是在性别问题还是国际政治方面。此外，我希望指出 Laura
    Poitras、Jacob Applebaum 和 Barton Gellman 对 Snowden 材料在新闻报道和操作安全方面所做的关键贡献。返回正文。⏎


    5. 事后看来，我必须承认我养成了习惯，在 Google 上几乎核查任何对我的工作感兴趣的学者、活动人士、安全专家或公务员。很可能，我是在这次工作坊之后做背景调查时养成了这一习惯。返回正文。⏎


    # 2 “群体。”实验室。职业。思想集体。


    DOI: [10.4324/9781003396871-3](https://doi.org/10.4324/9781003396871-3)

    本章已在 CC-BY-NC-ND 4.0 许可下提供。


    在上一章中，我介绍了黑客社区如何在共享基础设施上进行实验。这种实验使他们能够作为“沉默的专家”参与欧盟立法的制定，通过欧盟议会助理对占据房屋和黑客大会的非正式代表团。当然，黑客空间并不是唯一聚集网络安全研究人员的社区，也不是唯一因其专业知识而被寻求的群体。在第
    4 章中，我将讨论 Citizen Lab 的案例及其揭露 Pegasus 监控系统在波兰以及欧盟其他国家对政治对手的使用。


    为了发展一个超越案例研究列表的概念框架，我需要在理论方面做一些社会学 DIY。我的意思是解释我所选择的术语的使用来源、改编、范围和证据。虽然这些词可能在日常语言、科学术语或科学研究入门工作中都很熟悉，但我恳请大家予以关注。


    思想集体。职业。实验室。这些概念听起来可能很简单，但每一个都是我在领域内讨论的主题。我相信精确性、界定、理解和对先前研究的引用具有科学价值。正因如此，我不会重新发明轮子，而是会根据我的研究对其进行审视、修改和验证。由于社会概念可能令人难以招架，我在表
    2.1 中提供了概述。


    ## 实验室。发现的情境。


    我感兴趣的网络安全群体中，实验室是最小的。需要指出的是，实验室并不等同于作者身份。大量漏洞都有单一作者，但将他们的认知操作视为孤立，是追随经典科学哲学中塞壬的呼唤：再次出现单一天才、自造男人的英雄叙事。这种形象是浪漫主义或科学宣传的长久阴影，面向
    25. 26. IPO 投资者（一位勇敢的自造诗人、发明家或投资者），但它不是科学社会学。


    ### 表 2.1 理解网络安全的三个社会学概念 返回正文。⏎


    | 概念 || 实验室 || 职业 || 思想集体 |

    | --- | --- | --- | --- |

    | 定义 || 通过降低失败成本来促进发现的一群人。发现必须由实验室外部的行动者认可。 || 由专业知识、公众信任、公众声望以及（正式或非正式的）行为准则联系在一起的人群
    || 一个由思想交流或智力互动联系在一起的大型社群 |

    | --- | --- | --- | --- |

    | 问题示例 || 网络安全研究人员如何在日常基础上协作？他们需要什么？一个研究小组应具备什么条件才能进行持续研究？ || 谁有权进行网络安全研究，谁会被视为黑客？什么算作研究，什么算作知识产权侵权？谁被要求评判其他网络安全专业人员？
    || 发现 Spectre 和 Meltdown 系列漏洞的网络安全研究人员之间共享了哪些认知特征，又有哪些不同？忽视这一问题的不同世代硬件工程师之间共享的特征是什么？
    |

    | 规模 || 数人。日常联系与协作。 || 国家，附带一些例外（大型企业、军事联盟等）。 || 全球，超越单一资助机构的边界。 |

    | 社会学来源 || Bruno Latour and Steve Woolgar (1986), Harry Collins (2017), Karin
    Knorr-Cetina (1999), Izabela Wagner (2011). || Max Weber 及其他人，但我的定义取自 Andrew Abbott
    (1988). || Ludwik Fleck (2008). |

    | 相关性及作者解读 || 实验室允许划界，即将研究和研究者与外部世界分离。然后，在实验室微观世界中，研究人员可以提出原本不可接受的问题（这个显而易见的事实真的正确吗？），违背社会规范（为进行研究而造成不适或伤害），或以其他方式暂停社会规范以重新配置认识论。
    || 法律标准的建立、伦理程序（如负责任的披露）以及对该领域的公众理解的发展表明该特定领域已获得自主性和声望。自主性意味着法律和国家机器需要领域内部的人来评判专业人员（例如，法官需要医学专家来评判医疗过失案件）。
    || 如果一个科学领域实现了足以形成思想集体的连贯性，那么像不可通约性和同时发现这样的社会认知现象就会出现。思想集体标志着“大科学” (Price, 1971)
    的社会形成以及该领域的正式化。 |

    | 相关领域有哪些？ || 科学哲学，科学劳动社会学，科学研究，科学计量学，管理学。 || 法律，伦理学，军事科学，政治科学，劳动社会学，科学公众理解，人力资源。
    || 科学哲学，认知科学。 |

    '
