- raw: "Since this section aspires to intersectionality ([Collins i in., 2021](#bibliography.xhtml#_24044-2003_chp005_ref38)),\
    \ I share the following perspective from gender studies of science. Different\
    \ regional contexts shape understanding between feminism and science ([Eren, 2022](#bibliography.xhtml#_24044-2003_chp005_ref50)),\
    \ because feminist thought is what people relate with, use and refer to in their\
    \ actions and not a systematised, universal corpus of knowledge.\n\nWithin this\
    \ intersectional perspective, what seems to repeat between different kinds of\
    \ experiences of discrimination as reported by interviewees can be understood\
    \ as the “clubhouse model”. Within a clubhouse exclusion mechanism, discrimination\
    \ comes from two mutually reinforcing sources  83. that together structure self-efficacy,\
    \ motivation and other individual factors ([Msambwa i in., 2025](#bibliography.xhtml#_24044-2003_chp005_ref114))\
    \ impacting both formal and informal education.\n\nThe first source is difference\
    \ in access to experimentation. This is understood not simply as access to the\
    \ laboratories or equipment but, more importantly, as social acceptance for failure,\
    \ misuse and unexpected use of computers, instruments, etc. This is important\
    \ because failure and punishment for it contributes to the sense of self-efficacy,\
    \ which is recognised ([Wong, 2016](#bibliography.xhtml#_24044-2003_chp005_ref176);\
    \ [Wong i in., 2024](#bibliography.xhtml#_24044-2003_chp005_ref177)) as a psychological\
    \ metric intersecting the impact of colleagues ([Toh & Watt, 2022](#bibliography.xhtml#_24044-2003_chp005_ref161)),\
    \ perception of self-belonging ([Veldman i in., 2021](#bibliography.xhtml#_24044-2003_chp005_ref168))\
