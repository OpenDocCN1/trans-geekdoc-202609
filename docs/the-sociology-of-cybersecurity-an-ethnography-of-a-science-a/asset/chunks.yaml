- raw: "| 5 || Solving the Tasks || CTF players attempt to solve the tasks. They try\
    \ to uncover infrastructure gaps hidden in tasks and use them to score points.\
    \ || This step is a practical equivalent of peer review of the first step of recuperation.\
    \ It also serves as a science and technology communication mechanism through which\
    \ communities/crowds distribute knowledge. This is also the most ritualistic part\
    \ of the event due to its intensity. |\n\n| 6 || Scoring the Tasks || Arbiters\
    \ confirm mechanisms used and gaps found in the tasks, officially acknowledging\
    \ scores. || Completion of recuperation through the tournament. Closing of the\
    \ ritual. |\n\n| 7 || Publishing Tasks and Solutions || Secondary effect. Some\
    \ players publish their solutions on the web pages of their teams. || The recuperation\
    \ effect is spread through the role of CTFs in hacking culture and the information\
    \ security profession. |\n\n 53. In this close-up, one may notice that an anomaly,\
    \ bug or exploit becomes a treasured and common good. It relies on unspoken, shared\
    \ trust in the thought collective. Because of this, the act of sharing the anomaly\
    \ is the act of demarcating the thought collective, constituting one of its fundamental\
    \ political dimensions. One may argue that, in the age of open knowledge, this\
    \ kind of tacit communal knowledge becomes even more critical ([Collins, 2013](#bibliography.xhtml#_24044-2003_chp005_ref32)).\n\
    \nIn the second phase, gaps or exploits gain new, although temporary, infrastructure.\
    \ The authors of tasks create fictional networks, banks or programs. They are\
    \ the rudimentary usable infrastructure, or what I call the test bed, for fundamental\
    \ gaps and exploits. Critique has not yet been replicated and transferred into\
    \ new systems, although it has already been taken from its original context. During\
    \ this phase, new politics or themes around the exploits may be constructed.\n\
    \nIt may be just a cognitive and material equivalent of sleight of hand, but political\
    \ choice also comes with it. The task author either chooses to pass on the original\
    \ context of the anomaly or strips it out of it. The rudimentary micro-infrastructure\
    \ of the task is sufficient to cover this switcheroo. The decision to depoliticise\
    \ mediation becomes useful in politics, especially when one wishes to recuperate^()\n\
    \nThe third phase does not happen in all tournaments but is a point of pride for\
    \ the most prestigious ones. After constructing them, the tasks can be tested.\
    \ This is the equivalent of trials done “inside the laboratory” before a paper\
    \ is published. The task author, organisers of the CTF event and their colleagues\
    \ test whether the task is “broken in the right way” (as in [Fragment 3.2](#ch03.xhtml#_24044-2003-003-002)).\
    \ The task author’s judgment gains team approval. In an almost elusive fashion,\
    \ the task slowly becomes associated with the author, arbiters, tournament and\
    \ CTF scene.\n\nThe fourth phase is the most terrifying. This would be the grand\
    \ reveal if the task authors used sleight of hand. Tasks are handed to CTF players.\
    \ The gaps and exploits are still concealed. Only a rudimentary micro-infrastructure\
    \ is accessible, such as a barely functional mouse port or network protocol that\
    \ works so slow that it appears almost non-functional. Players could only hope\
    \ that they would eventually discover hidden gaps and exploits. The event clock\
    \ starts ticking. The hacking begins, usually to the sound of some utterly obnoxious\
    \ techno and no less obnoxious anime projections.\n\nThe fifth phase is the CTF\
    \ proper, as I described before. Players hack and consult with each other. Exploits\
    \ and gaps are filtered from the chaff of the task’s rudimentary infrastructure.\
    \ Arbiters and task authors verify their intuitions about crowds and communities.\
    \ Through this process, the thought collective forms again. Rhythms of exhaustion\
    \ and cerebral celebrations occur.\n\nWhat is happening politically? This is a\
    \ debate about anomalies and tasks, and task authors and their interpretations.\
    \ This debate may end up in critique or recuperation, but what matters is that\
    \ infrastructure and infrastructures  54. may have one dialogue (between materialities,\
    \ bytes, and processing powers). Symmetrically, there may be an another dialogue,\
    \ indirect and mediated through the medium of playing with the infrastructure\
    \ between the task author and the players, or between the authors of the infrastructure\
    \ (in the form of manuals or direct calls) and the players. Exclusion from this\
    \ debate is exclusion from the politics of digital infrastructure.\n\nFor example,\
    \ recent STS studies of hacking have asked why hacking imaginaries rarely question\
    \ users’ disposition in constructing the “deficient user” ([Klimburg-Witjes &\
    \ Wentland, 2021](#bibliography.xhtml#_24044-2003_chp005_ref81)). My empirical\
    \ answer is simple: important security specialists learn from CTFs, and CTFs do\
    \ not generally bother with the inclusion of the users. The results are understandable\
    \ if self-education emphasises puzzles over people using things in engineering.\
    \ If you do not believe me, try to find a CTF with tasks on the social aspects\
    \ of computer security. There are less than 5–10% per year, which I confirmed.\n\
    \nScoring of the tasks is the sixth phase. Arbiters confirm the solutions given\
    \ by players. The authors of tasks receive congratulations or condemnations. Exploits,\
    \ gaps and their abuses are recognised. Participants talk with each other during\
    \ the afterparty. Politics lies mostly in symbolism and handshakes. An exploit\
    \ or a security gap was replicated, normalised and understood by a wider group.\n\
    \nThe seventh phase is also not mandatory but serves as an extra dose of adrenaline\
    \ and prestige. CTF participants and authors publish tasks and their solutions\
    \ – discussions after CTF emerge. The first form of discussions is typical of\
    \ sporting events. They focus on wins, scores, etc. The second form focuses on\
    \ the details of the task solutions. They act as a second wave of peer reviews\
    \ for a wider community of security. I believe that recuperation is almost complete\
    \ at this moment, as the original critique was subsumed into distributed, unrecognisable\
    \ forms. They could be useful for further critiques but may also be useful for\
    \ further accumulation.\n\nWhat happened during these phases? Knowledge of security\
    \ gaps or exploits were transferred to a broader group. During each step, a mutual\
    \ understanding of the relationship between the gap and infrastructure was negotiated\
    \ and confirmed. In the end, what may have been a political critique at the beginning\
    \ became communal knowledge. It is not as depoliticised but reframed as related\
    \ to CTF, “just innocent play”, etc. Not all gaps and exploits used in CTFs start\
    \ as radical political hacks, but the chain functions for enough of them.\n\n\
    ## Summary\n\nThe previous section followed the minutiae of the process and politics\
    \ of replicating a computer security exploit through computer security tournaments.\
    \ The whole process dialectically re-sets both infrastructure and the thought\
    \ collective. The former is changed by the shaping of new tools, new standards\
    \ and, perhaps, changes in the ontology of potential vulnerabilities. The latter\
    \ is shaped by  55. new social knowledge, new personal connections and new emotional\
    \ meanings around hacking. I gave examples of small political decisions made at\
    \ each step."
  fmt: '

    ### Phases 5–7


    | No. | Phase | Description | Note |

    |---|---|---|---|

    | 5 | Solving the Tasks | CTF players attempt to solve the tasks. They try to
    uncover infrastructure gaps hidden in tasks and use them to score points. | This
    step is a practical equivalent of peer review of the first step of recuperation.
    It also serves as a science and technology communication mechanism through which
    communities/crowds distribute knowledge. This is also the most ritualistic part
    of the event due to its intensity. |

    | 6 | Scoring the Tasks | Arbiters confirm mechanisms used and gaps found in the
    tasks, officially acknowledging scores. | Completion of recuperation through the
    tournament. Closing of the ritual. |

    | 7 | Publishing Tasks and Solutions | Secondary effect. Some players publish
    their solutions on the web pages of their teams. | The recuperation effect is
    spread through the role of CTFs in hacking culture and the information security
    profession. |


    53. In this close-up, one may notice that an anomaly, bug or exploit becomes a
    treasured and common good. It relies on unspoken, shared trust in the thought
    collective. Because of this, the act of sharing the anomaly is the act of demarcating
    the thought collective, constituting one of its fundamental political dimensions.
    One may argue that, in the age of open knowledge, this kind of tacit communal
    knowledge becomes even more critical ([Collins, 2013](#bibliography.xhtml#_24044-2003_chp005_ref32)).


    In the second phase, gaps or exploits gain new, although temporary, infrastructure.
    The authors of tasks create fictional networks, banks or programs. They are the
    rudimentary usable infrastructure, or what I call the test bed, for fundamental
    gaps and exploits. Critique has not yet been replicated and transferred into new
    systems, although it has already been taken from its original context. During
    this phase, new politics or themes around the exploits may be constructed.


    It may be just a cognitive and material equivalent of sleight of hand, but political
    choice also comes with it. The task author either chooses to pass on the original
    context of the anomaly or strips it out of it. The rudimentary micro-infrastructure
    of the task is sufficient to cover this switcheroo. The decision to depoliticise
    mediation becomes useful in politics, especially when one wishes to recuperate^()


    The third phase does not happen in all tournaments but is a point of pride for
    the most prestigious ones. After constructing them, the tasks can be tested. This
    is the equivalent of trials done “inside the laboratory” before a paper is published.
    The task author, organisers of the CTF event and their colleagues test whether
    the task is “broken in the right way” (as in [Fragment 3.2](#ch03.xhtml#_24044-2003-003-002)).
    The task author’s judgment gains team approval. In an almost elusive fashion,
    the task slowly becomes associated with the author, arbiters, tournament and CTF
    scene.


    The fourth phase is the most terrifying. This would be the grand reveal if the
    task authors used sleight of hand. Tasks are handed to CTF players. The gaps and
    exploits are still concealed. Only a rudimentary micro-infrastructure is accessible,
    such as a barely functional mouse port or network protocol that works so slow
    that it appears almost non-functional. Players could only hope that they would
    eventually discover hidden gaps and exploits. The event clock starts ticking.
    The hacking begins, usually to the sound of some utterly obnoxious techno and
    no less obnoxious anime projections.


    The fifth phase is the CTF proper, as I described before. Players hack and consult
    with each other. Exploits and gaps are filtered from the chaff of the task’s rudimentary
    infrastructure. Arbiters and task authors verify their intuitions about crowds
    and communities. Through this process, the thought collective forms again. Rhythms
    of exhaustion and cerebral celebrations occur.


    What is happening politically? This is a debate about anomalies and tasks, and
    task authors and their interpretations. This debate may end up in critique or
    recuperation, but what matters is that infrastructure and infrastructures 54.
    may have one dialogue (between materialities, bytes, and processing powers). Symmetrically,
    there may be an another dialogue, indirect and mediated through the medium of
    playing with the infrastructure between the task author and the players, or between
    the authors of the infrastructure (in the form of manuals or direct calls) and
    the players. Exclusion from this debate is exclusion from the politics of digital
    infrastructure.


    For example, recent STS studies of hacking have asked why hacking imaginaries
    rarely question users’ disposition in constructing the “deficient user” ([Klimburg-Witjes
    & Wentland, 2021](#bibliography.xhtml#_24044-2003_chp005_ref81)). My empirical
    answer is simple: important security specialists learn from CTFs, and CTFs do
    not generally bother with the inclusion of the users. The results are understandable
    if self-education emphasises puzzles over people using things in engineering.
    If you do not believe me, try to find a CTF with tasks on the social aspects of
    computer security. There are less than 5–10% per year, which I confirmed.


    Scoring of the tasks is the sixth phase. Arbiters confirm the solutions given
    by players. The authors of tasks receive congratulations or condemnations. Exploits,
    gaps and their abuses are recognised. Participants talk with each other during
    the afterparty. Politics lies mostly in symbolism and handshakes. An exploit or
    a security gap was replicated, normalised and understood by a wider group.


    The seventh phase is also not mandatory but serves as an extra dose of adrenaline
    and prestige. CTF participants and authors publish tasks and their solutions –
    discussions after CTF emerge. The first form of discussions is typical of sporting
    events. They focus on wins, scores, etc. The second form focuses on the details
    of the task solutions. They act as a second wave of peer reviews for a wider community
    of security. I believe that recuperation is almost complete at this moment, as
    the original critique was subsumed into distributed, unrecognisable forms. They
    could be useful for further critiques but may also be useful for further accumulation.


    What happened during these phases? Knowledge of security gaps or exploits were
    transferred to a broader group. During each step, a mutual understanding of the
    relationship between the gap and infrastructure was negotiated and confirmed.
    In the end, what may have been a political critique at the beginning became communal
    knowledge. It is not as depoliticised but reframed as related to CTF, “just innocent
    play”, etc. Not all gaps and exploits used in CTFs start as radical political
    hacks, but the chain functions for enough of them.


    ## Summary


    The previous section followed the minutiae of the process and politics of replicating
    a computer security exploit through computer security tournaments. The whole process
    dialectically re-sets both infrastructure and the thought collective. The former
    is changed by the shaping of new tools, new standards and, perhaps, changes in
    the ontology of potential vulnerabilities. The latter is shaped by 55. new social
    knowledge, new personal connections and new emotional meanings around hacking.
    I gave examples of small political decisions made at each step.

    '
  trans: '

    ### 第 5–7 阶段


    | 编号 | 阶段 | 描述 | 备注 |

    |---|---|---|---|

    | 5 | 解决任务 | CTF 选手尝试解决任务。他们试图发掘任务中隐藏的基础设施漏洞，并利用它们获得分数。 | 这一步是恢复第一步同行评审的实践等价物。它还充当科学技术传播机制，通过该机制，社区/人群传播知识。这也是由于其强度而成为活动中最具仪式感的部分。
    |

    | 6 | 评分任务 | 裁判确认任务中使用的机制和发现的漏洞，正式承认分数。 | 通过锦标赛完成恢复。仪式的结束。 |

    | 7 | 发布任务和解决方案 | 次要效应。一些选手在自己团队的网页上发布他们的解决方案。 | 恢复效应通过 CTF 在黑客文化和信息安全专业中的作用而传播。
    |


    53. 在此特写中，人们可能会注意到，异常、漏洞或利用变得成为珍贵且共同的财富。它依赖于对思想共同体的无言共享信任。正因如此，分享异常的行为就是划定思想共同体的行为，构成了其基本政治维度之一。可以说，在开放知识的时代，这种默会的共同知识变得更加关键（Collins,
    2013）。


    在第二阶段，漏洞或利用获得了新的、尽管是暂时的基础设施。任务作者创建虚构的网络、银行或程序。它们是基本漏洞和利用的原始可用基础设施，或者我称之为测试床。批判尚未被复制并转移到新系统中，尽管它已经从其原始语境中被取出。在此阶段，围绕利用的新政治或主题可能会被构建。


    这可能只是障眼法的认知和物质等价物，但政治选择也随之而来。任务作者要么选择传递异常的原始语境，要么将其剥离。任务的原始微型基础设施足以掩盖这一调包。去政治化中介的决定在政治上变得有用，尤其是在人们希望恢复^()
    时。


    第三阶段并非在所有锦标赛中都会发生，但却是最负盛名锦标赛的骄傲之处。构建之后，任务可以被测试。这相当于论文发表前在“实验室内部”进行的试验。任务作者、CTF
    活动组织者及其同事测试任务是否“以正确的方式被破坏”（如 片段 3.2 中所述）。任务作者的判断获得团队认可。以一种近乎难以捉摸的方式，任务慢慢与作者、裁判、锦标赛和
    CTF 场景联系在一起。


    第四阶段是最可怕的。如果任务作者使用了障眼法，这将是大揭露。任务被交给 CTF 选手。漏洞和利用仍然被隐藏。只能访问原始的微型基础设施，例如几乎无法工作的鼠标端口或工作如此缓慢以至于几乎看似非功能的网络协议。选手只能希望最终会发现隐藏的漏洞和利用。活动计时器开始滴答作响。黑客行为开始，通常伴随着极其令人厌恶的
    techno 音乐和同样令人厌恶的动漫投影。


    第五阶段是真正的 CTF，正如我之前描述的那样。选手互相黑客攻击并进行咨询。利用和漏洞从任务原始基础设施的糟粕中被筛选出来。裁判和任务作者验证他们对人群和社区的直觉。通过这一过程，思想共同体再次形成。疲惫的节奏和脑力庆祝交替出现。


    政治上发生了什么？这是一场关于异常和任务、任务作者及其解释的辩论。这场辩论可能以批判或恢复告终，但重要的是基础设施和基础设施 54. 可能有一种对话（在物质性、字节和处理能力之间）。对称地，可能还有另一种对话，通过与基础设施玩耍这一媒介间接进行，在任务作者与选手之间，或在基础设施作者（以手册或直接呼叫的形式）与选手之间进行。被排除在这一辩论之外，就是被排除在数字基础设施的政治之外。


    例如，最近对黑客行为的 STS 研究曾问及为何黑客想象很少质疑用户在构建“缺陷用户”时的倾向（Klimburg-Witjes & Wentland, 2021）。我的实证答案很简单：重要的安全专家从
    CTF 中学习，而 CTF 通常并不在意用户的纳入。如果自我教育强调谜题而非工程中人们使用事物，结果是可以理解的。如果你不相信我，试着找一个关于计算机安全社会层面的任务的
    CTF。每年少于 5–10%，我已证实。


    评分任务是第六阶段。裁判确认选手提供的解决方案。任务作者收到祝贺或谴责。利用、漏洞及其滥用被认可。参与者在派对后互相交谈。政治主要体现在象征和握手中。一种利用或安全漏洞被更广泛的群体复制、规范化并理解。


    第七阶段也不是强制性的，但作为额外剂量的肾上腺素和声望。CTF 参与者和作者发布任务及其解决方案——CTF 后的讨论出现。第一种讨论形式是体育赛事的典型形式。它们关注胜利、分数等。第二种形式关注任务解决方案的细节。它们充当了安全更广泛社区的第二波同行评审。我认为恢复在此时几乎已完成，因为原始批判被吸收进分布式、无法识别的形式中。它们可能对进一步的批判有用，也可能对进一步的积累有用。


    这些阶段发生了什么？安全漏洞或利用的知识被转移到更广泛的群体中。在每一步，漏洞与基础设施之间关系的相互理解都被协商并确认。最终，开始时可能具有政治批判性的东西变成了共同知识。它并非去政治化，而是被重新框定为与
    CTF 相关，“只是无辜的游戏”等。并非所有在 CTF 中使用的漏洞和利用都始于激进的政治黑客行为，但该链条对其中足够多的情况有效。


    ## 摘要


    上一节追踪了通过计算机安全锦标赛复制计算机安全利用的过程和政治的细枝末节。整个过程辩证地重置了基础设施和思想共同体。前者通过塑造新工具、新标准以及也许潜在漏洞本体论的变化而改变。后者由
    55. 新的社会知识、新的人际联系以及围绕黑客行为的新情感意义塑造。我在每一步都给出了小的政治决策的例子。

    '
