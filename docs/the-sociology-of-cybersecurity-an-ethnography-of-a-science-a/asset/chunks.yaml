  trans: '

    重要的是注意到，同意、关怀和可及性的原则在与相关技术背景密切关联的法律讨论中得到了成功运用。这表明女性主义伦理不仅启发了社会理论或其他抽象的宏观社会学议题，也启发了日常、实际的议题，如对跟踪受害者、智能家居中被监视的女性（Slupska,
    2019）或经历歧视的人的法律适用。


    国际关系领域的研究者对非常相似的议题也感兴趣。他们提出了女性主义网络安全作为一种视角，用来研究国际恐怖组织围绕针对妇女的暴力幻想的激进化（Armstrong,
    2021；Bengtsson Meuller, 2023），或通过网络安全设备调查的网络跟踪和社区对性别规范的执行（Mhajne & Henshaw, 2024；Mhajne
    & Whetstone, 2024，2025）。国际关系领域的网络安全女性主义学者强调有必要在国家机构的边界之外理解网络安全，这进一步强调了多地点、交叉性和多情境研究的必要性。


    ## 代替后记


    本书使用的第一本民族志笔记本来自 2014 年 10 月。它包含来自一个黑客空间的观察笔记和几次即兴谈话。最后一次对话来自 2025 年 7 月。话题是 AI
    垃圾，或由大型语言  89. 模型（LLMs）完成的漏洞的海量提交。这似乎是一个时代的跨度，从后斯诺登时刻——当时监视短暂地成为当天的议题——到当前时刻，当时网络安全被视为经济围栏的工具，与发现工具一样重要。


    从这一时期，我希望主观地强调三个问题。首先，关于互联网，特别是网络安全的论述陷入了一种奇怪的《土拨鼠之日》。一方面，除了也许是游说者和他们的学者之外，几乎没有人相信关于非政治化互联网的故事，因为像布鲁塞尔效应或数字封建主义这样的问题出现在评论文章中。另一方面，1990
    年代的论述出现了奇怪的回归，仿佛 AI 找到了 Web 1.0 和 2.0 宣传中未被使用的储备。赛博朋克诺斯替主义也回来了。也许这是承认即使在数字社会学中，历史也不会重演，但它常常押韵的时刻。


    我认为这种令人作呕的营销话语的重复实际上掩盖了网络安全已进入系统化、标准化和专业化的事实。像 CVS 这样的系统允许建立共同理解并至少自动化了一些安全工具。标准，如我曾采访过的网络安全保险调查员使用的协议，促成了目前所知的“隐私专业人士”（Birnhack
    & Mundlak, 2025）。事实上，收编，或黑客文化的商业收回和商品化，变得正常化了。所有被收编的实践都内化为机构并不重要，正如我在 CTF 案例中所示，部门化机构之间共享的共同基础仍然非常有用。此外，出于对网络安全的共同热情而做的事情可能会逃避劳动报酬，就像
    1990 年代的一些网络先知曾经忘记的那样。


    其次的认识由此而来。文化商品化为无偿劳动的过程已被理查德·巴布鲁克和安迪·卡梅伦认定为“加州意识形态”（Barbrook & Cameron, 1996）。我想强调的是，当前的加州意识形态浪潮在影响网络安全作为一门科学的认识论的同时，实际上演变成了各种形式的神学。与之前的概念化不同，这次不是关于“新时代”或“1968”，无论人们想与之关联什么，甚至不是来自赛博朋克流行解读中的一些诺斯替暗流，如在
    Cyberpunk 2030 或在《赛博格宣言》中所理解的（Haraway, 2006），而是来自对权力精英如此有用的右翼基督教和犹太教的政治神学。


    在第四章中，我讨论了 Peter Gallison 关于基督教神学对控制论作为科学的影响的研究，在存在对手的情况下（Galison, 1994）。JASON
    的报告回顾了这项研究，因为它为 2010 年代的网络安全科学概念化了同样的问题：如何构建敌人的认识论模型？巴勒斯坦女性主义监视学者独立认识到，神学，这次是犹太教，支撑着以色列在加沙的监视和网络安全行动（Rouhana
    &  90. Šalhūb-Kīfūrkiyān, 2021）。Nādira Šalhūb-Kīfūrkiyān 称之为“安全神学”（Šalhūb-Kīfūrkiyān,
    2015），当网络安全周围的想象空间变得不可触及且无法进入，只能在封闭秩序内部由入会者讨论时。局外人只有宗教隐喻，但通过每一种隐喻，入会者的权力只会增长，他们产品的价格也随之增长。矛盾的是，这违背了许多黑客的理想，也违背了科学的理想。科学不是神秘的、诠释学的；它不是为天才或入会者准备的，但至少在原则上，它应该被普遍理解。我想我只有一个结论：网络安全中的伦理斗争与科学中的伦理斗争是相同的（Wolfe,
    2020）。这一套政治神学是殖民性的，因为它将网络安全设定为国家神圣秘密的守护者，是征服者与征服对象之间不可逾越的分界，是“安全人员”与“普通人”之间的分界。当我写“神圣”时，我并不是说我相信知识中有任何超自然的东西，也不是说我认为使用这种修辞的人相信这一点。我以涂尔干的意义写“神圣”（Durkheim,
    2008），理解网络安全为“神圣”意味着它与日常生活一样被社会禁忌所分离，对社会施加一套严苛的规定，其合理性不在于证据，而在于表演性仪式。


    与此同时，网络安全科学，在非常非宗教的、完全科学的、非隐喻的意义上，充当了当今许多社会秩序复杂机制的锁匠。这是涂尔干式的图腾，尽管是扭曲的，因为它具有数字基础设施的形式，而不是象征性中心。像涂尔干的对应物一样（Durkheim,
    2008），网络安全在行动时是可见的，在普通人因其被视为社会控制的来源而畏惧时是不可见的。其日常复杂性对局外人隐藏，但在政治领域中以神学、神秘主义和无数恶魔的危险为理由加以正当化。科学，但作为宗教被正当化并用于社会控制。不可知、无法验证、无法问责。精确、可感且无处不在，但仅作为恐惧的来源，从不涉及问责。

