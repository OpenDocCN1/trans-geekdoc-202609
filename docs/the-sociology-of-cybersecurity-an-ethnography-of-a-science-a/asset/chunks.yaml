- raw: "I went to C3 as part of a multi-sited ethnography. It was an important event\
    \ for communities I was a part of, so it was natural for an ethnographer to tag\
    \ along.\n\nThe Congress had about 10,000 guests at this time, so it was impossible\
    \ to understand it as single event. Instead of stationary observation, I decided\
    \ to shadow individual hackers, who consented to this. I wanted to see how they\
    \ shaped the Congress as a personal experience ([Marcus, 1995](#bibliography.xhtml#_24044-2003_chp005_ref88)).\
    \ I mixed shadowing with stationary observations of “my communities” during General\
    \ Assembly (a place where hackerspaces are open to set up their “bases”) and my\
    \ own personal observations. I learned more than I expected about the EU and hackers\
    \ during one of the shadowing days.\n\nIt wasn’t the first day of my application\
    \ of this method, nor was it my first Congress. Scruffy and tired from lack of\
    \ sleep, I was shadowing one hacktivist I knew from stationary ethnographies and\
    \ other Congresses. And I was shocked. Almost half the people there wore ties\
    \ or comparable business casual attire! In the middle of my Congress? What was\
    \ that about? The hacker I followed just advised me to listen and participate\
    \ as capably as I could. “You’re not a hacker, but you know something about institutions\
    \ in the EU and social stuff. Use it at will, you are among friends”.\n\nIt turned\
    \ out I had walked into a semi-open workshop very unofficially connected with\
    \ very concerned analysts from an important EU administration. Not a consulting\
    \ company, not a think tank, not a research project, but an institution that was\
    \ in the loop with an EU regulation proposal as it was being drafted. (I do not\
    \ provide further details to protect their anonymity). Very informally, some people\
    \ involved in EU policy organised a policy workshop with hacktivists, using the\
    \ Congress as neutral ground.\n\nThe majority of people knew each other from privacy\
    \ debates on the EU scene or from the anarchist movement. Sharing similar backgrounds,\
    \ I also recognised some from debates in their countries. I stated my role as\
    \ ethnographer and asked for their consent; we discussed anonymisation conditions,\
    \ and the workshop started.\n\nThe workshop concentrated on the details of the\
    \ role of privacy protection in agreements between the EU and the USA. Both policy\
    \ geeks and hackers were aware of American intelligence activity in the area and\
    \ discussed data protection standards that needed to be enforced. I was no stranger\
    \ to privacy debates, and I broadly understood terms from public debate such as\
    \ “safe harbours”, “Five Eyes alliance”, “public key mechanism”, etc., but the\
    \ workshop went much further. The level of technical complexity in law – its institutional\
    \  19. and technical aspects – was much above anything I had experienced in academia,\
    \ the public sphere or anywhere else. Again, I agreed not to disclose exact details\
    \ to allow anonymity. I tried to contribute as much as I could when cases from\
    \ my domain were discussed.\n\nI brought examples and sources on privacy protection\
    \ standards in social research and data-sharing mechanisms I had learned about\
    \ when I read about different cultures of access in different scientific fields\
    \ (e.g., standards in European particle physics may differ from those in European\
    \ meteorological collaborations, even if some supercomputers and other resources\
    \ are shared. It’s something obvious to people in the fields – things you learn\
    \ just from hanging around climate scientists or reading the basics of synchrotron\
    \ research. It is easy to overlook when discussing policy regarding data in general).\n\
    \nAfter the workshop, the hacker who led me here said that it was exactly what\
    \ they were looking for. We provided better cases for EU institutions who will\
    \ be supporting negotiations with the US. Of course, both of us were usually paranoid,\
    \ so we did casual background checks on a few newly met analysts and activists.\
    \ Nothing shady, more a matter of a professional curiosity and habitual fact-checking.\
    \ Just asking around friendly squats by email, checking the publication records\
    \ of people we met and the university history of some analysts. People from the\
    \ workshop held up to this scrutiny.^()\n\nApart from the resemblance between\
    \ understanding complex software and understanding complex social systems, I think\
    \ this workshop is important to note because collaboration between EU hackers\
    \ and EU institutions is not recognised in the research. It is public knowledge\
    \ in the field that US officials engage in similar work. For example, the commander\
    \ of an American computer espionage agency delivered a famous and widely criticised\
    \ keynote lecture at Defcon in 2013. An American military research agency (Defense\
    \ Advanced Research Projects Agency – DARPA) conducts experiments in machine learning\
    \ during conferences on a regular basis. European hacking conferences are usually\
    \ seen as much more left-leaning and politically radical, due to their roots in\
    \ the German hacker-anarchist movement. My colleagues researching hacking in Europe\
    \ focused on national levels, such as the impact of hacking on German politics\
    \ ([Kubitschko, 2015](#bibliography.xhtml#_24044-2003_chp005_ref84)).\n\nThe workshop\
    \ I encountered proved that there were efficient links between EU policy institutions\
    \ and hacking communities – links which bypassed national administrations and\
    \ public, civic society mechanisms, instead making use of the obscurity of Chaos\
    \ Communication Congress.\n\nA second conclusion is more hypothetical in nature,\
    \ but I feel it needs to be stated openly. I argue that it is reasonable to believe\
    \ that some hacktivists were likely active in shaping the EU’s General Data Protection\
    \ Regulation. When I hypothesise about this activity, I do not mean through providing\
    \ illegal access to communication networks, spreading leaks or organising dissent.\
    \ I mean providing expertise to EU analysts and law researchers – not through\
    \ lobbying, think tank activity, policy papers or other forms of public advocacy.\n\
    \n 20. A set of changes associated with GDPR was developed on multiple levels,\
    \ both within and outside European Parliament. What is important is the fact that\
    \ GDPR affected countries beyond the boundaries of the European Union. This form\
    \ of extending the range of political power by the combination of law and software\
    \ standards was called “the Brussels Effect” ([Bradford, 2021](#bibliography.xhtml#_24044-2003_chp005_ref18)).\
    \ Only recently has research in social sciences recognised its effect not only\
    \ in global digital trade or international relations ([Eskhita & Stamhuis, 2024](#bibliography.xhtml#_24044-2003_chp005_ref51);\
    \ [Ylönen, 2025](#bibliography.xhtml#_24044-2003_chp005_ref180)) but on the profession\
    \ of cybersecurity ([Birnhack & Mundlak, 2025](#bibliography.xhtml#_24044-2003_chp005_ref15)).\
    \ As an ethnographer, I observed how EU’s bureaucrats held “public” consultations\
    \ during Chaos Communication Congress, one of the biggest conferences connecting\
    \ cybersecurity and hacktivism. As I contributed to some workshops on the issues\
    \ related with public understanding of science, I was asked not to give any more\
    \ details.\n\nEU regulation directly interacted with hacking communities and cybersecurity\
    \ professionals. Since 2018, security leaks with European citizen data are no\
    \ longer just a public relations problem. They can be a source of serious financial\
    \ fines, as imposed by national administrations. The business incentive for data\
    \ protection is rather strong, as a potential fine for data leaks may be up to\
    \ 20 million USD or 4% of the annual income of the company. Simply speaking, disregarding\
    \ data policies may become much more expensive than spending more to improve security."
  fmt: "\nI went to C3 as part of a multi-sited ethnography. It was an important event\
    \ for communities I was a part of, so it was natural for an ethnographer to tag\
    \ along.\n\nThe Congress had about 10,000 guests at this time, so it was impossible\
    \ to understand it as single event. Instead of stationary observation, I decided\
    \ to shadow individual hackers, who consented to this. I wanted to see how they\
    \ shaped the Congress as a personal experience ([Marcus, 1995](#bibliography.xhtml#_24044-2003_chp005_ref88)).\
    \ I mixed shadowing with stationary observations of “my communities” during General\
    \ Assembly (a place where hackerspaces are open to set up their “bases”) and my\
    \ own personal observations. I learned more than I expected about the EU and hackers\
    \ during one of the shadowing days.\n\nIt wasn’t the first day of my application\
    \ of this method, nor was it my first Congress. Scruffy and tired from lack of\
    \ sleep, I was shadowing one hacktivist I knew from stationary ethnographies and\
    \ other Congresses. And I was shocked. Almost half the people there wore ties\
    \ or comparable business casual attire! In the middle of my Congress? What was\
    \ that about? The hacker I followed just advised me to listen and participate\
    \ as capably as I could. “You’re not a hacker, but you know something about institutions\
    \ in the EU and social stuff. Use it at will, you are among friends”.\n\nIt turned\
    \ out I had walked into a semi-open workshop very unofficially connected with\
    \ very concerned analysts from an important EU administration. Not a consulting\
    \ company, not a think tank, not a research project, but an institution that was\
    \ in the loop with an EU regulation proposal as it was being drafted. (I do not\
    \ provide further details to protect their anonymity). Very informally, some people\
    \ involved in EU policy organised a policy workshop with hacktivists, using the\
    \ Congress as neutral ground.\n\nThe majority of people knew each other from privacy\
    \ debates on the EU scene or from the anarchist movement. Sharing similar backgrounds,\
    \ I also recognised some from debates in their countries. I stated my role as\
    \ ethnographer and asked for their consent; we discussed anonymisation conditions,\
    \ and the workshop started.\n\nThe workshop concentrated on the details of the\
    \ role of privacy protection in agreements between the EU and the USA. Both policy\
    \ geeks and hackers were aware of American intelligence activity in the area and\
    \ discussed data protection standards that needed to be enforced. I was no stranger\
    \ to privacy debates, and I broadly understood terms from public debate such as\
    \ “safe harbours”, “Five Eyes alliance”, “public key mechanism”, etc., but the\
    \ workshop went much further. The level of technical complexity in law – its institutional\
    \  19. and technical aspects – was much above anything I had experienced in academia,\
    \ the public sphere or anywhere else. Again, I agreed not to disclose exact details\
    \ to allow anonymity. I tried to contribute as much as I could when cases from\
    \ my domain were discussed.\n\nI brought examples and sources on privacy protection\
    \ standards in social research and data-sharing mechanisms I had learned about\
    \ when I read about different cultures of access in different scientific fields\
    \ (e.g., standards in European particle physics may differ from those in European\
    \ meteorological collaborations, even if some supercomputers and other resources\
    \ are shared. It’s something obvious to people in the fields – things you learn\
    \ just from hanging around climate scientists or reading the basics of synchrotron\
    \ research. It is easy to overlook when discussing policy regarding data in general).\n\
    \nAfter the workshop, the hacker who led me here said that it was exactly what\
    \ they were looking for. We provided better cases for EU institutions who will\
    \ be supporting negotiations with the US. Of course, both of us were usually paranoid,\
    \ so we did casual background checks on a few newly met analysts and activists.\
    \ Nothing shady, more a matter of a professional curiosity and habitual fact-checking.\
    \ Just asking around friendly squats by email, checking the publication records\
    \ of people we met and the university history of some analysts. People from the\
    \ workshop held up to this scrutiny.^()\n\nApart from the resemblance between\
    \ understanding complex software and understanding complex social systems, I think\
    \ this workshop is important to note because collaboration between EU hackers\
    \ and EU institutions is not recognised in the research. It is public knowledge\
    \ in the field that US officials engage in similar work. For example, the commander\
    \ of an American computer espionage agency delivered a famous and widely criticised\
    \ keynote lecture at Defcon in 2013. An American military research agency (Defense\
    \ Advanced Research Projects Agency – DARPA) conducts experiments in machine learning\
    \ during conferences on a regular basis. European hacking conferences are usually\
    \ seen as much more left-leaning and politically radical, due to their roots in\
    \ the German hacker-anarchist movement. My colleagues researching hacking in Europe\
    \ focused on national levels, such as the impact of hacking on German politics\
    \ ([Kubitschko, 2015](#bibliography.xhtml#_24044-2003_chp005_ref84)).\n\nThe workshop\
    \ I encountered proved that there were efficient links between EU policy institutions\
    \ and hacking communities – links which bypassed national administrations and\
    \ public, civic society mechanisms, instead making use of the obscurity of Chaos\
    \ Communication Congress.\n\nA second conclusion is more hypothetical in nature,\
    \ but I feel it needs to be stated openly. I argue that it is reasonable to believe\
    \ that some hacktivists were likely active in shaping the EU’s General Data Protection\
    \ Regulation. When I hypothesise about this activity, I do not mean through providing\
    \ illegal access to communication networks, spreading leaks or organising dissent.\
    \ I mean providing expertise to EU analysts and law researchers – not through\
    \ lobbying, think tank activity, policy papers or other forms of public advocacy.\n\
    \n 20. A set of changes associated with GDPR was developed on multiple levels,\
    \ both within and outside European Parliament. What is important is the fact that\
    \ GDPR affected countries beyond the boundaries of the European Union. This form\
    \ of extending the range of political power by the combination of law and software\
    \ standards was called “the Brussels Effect” ([Bradford, 2021](#bibliography.xhtml#_24044-2003_chp005_ref18)).\
    \ Only recently has research in social sciences recognised its effect not only\
    \ in global digital trade or international relations ([Eskhita & Stamhuis, 2024](#bibliography.xhtml#_24044-2003_chp005_ref51);\
    \ [Ylönen, 2025](#bibliography.xhtml#_24044-2003_chp005_ref180)) but on the profession\
    \ of cybersecurity ([Birnhack & Mundlak, 2025](#bibliography.xhtml#_24044-2003_chp005_ref15)).\
