    # 4 “Normal Science.”Cybersecurity as a Science. Stabilised Instability. Systematics.
    Power Elite.


    DOI: [10.4324/9781003396871-5](https://doi.org/10.4324/9781003396871-5) The chapter
    has been made avaliable under a CC-BY-NC-ND 4.0 license.


    In previous chapters, I described various sociological elements of science. In
    [Chapter 1](#ch01.xhtml#_24044-2003_ch001), I described the relation between knowledge,
    the migration of the workforce, formal and informal knowledge spaces and infrastructures
    associated with them. In [Chapter 2](#ch02.xhtml#_24044-2003_ch002), I described
    the cognitive characteristics that may be shared more often around the researchers’
    in-group than in the out-group. I also described the basic model of a security
    laboratory as a general type, which includes interfaces with other social institutions.
    This enables us to identify prestige-reference mechanisms and makes it easier
    to discuss issues of error, discovery and originality.


    In this chapter, I wish to discuss how cybersecurity systematises knowledge. In
    the previous chapter, I discussed how relatively simple elements of computer security
    knowledge are replicated in CTF tournaments. Now, I will describe both simpler
    and more complex discoveries of computer security as objects I call “stabilised
    instabilities”. In the previous chapter, “stabilised instability” could be applied
    to knowledge passed between people through personal, informal, tacit, in-situ
    and trans-institutional circumstances such as Capture the Flag tournaments. Here,
    I am interested in cybersecurity knowledge that is passed indirectly, without
    personal contact, often with mediation of the text, code or systematics, in ways
    that are codified by institutions or, at least, by intersubjective design.


    The previous chapter was about cybersecurity that happens face to face, through
    subjectivities of elite circles or details that happen in the peripheral vision.
    This chapter is about cybersecurity that happens on the scales of systematics,
    patterns and databases.


    Before discussing those systematics, patterns and cases of their application,
    I need to prepare my theoretical tools. Digital systems can be broken in so many
    ways that I need an interim concept that will be understandable both for readers
    from technical fields and from social sciences. This is why I wish to think through
    the concept of stabilised instability; I hope it is theoretical enough for my
    colleagues in the sociology of science while remaining close enough to practical
    applications for readers in the field.


    ## What Is Researched by Cybersecurity? Stabilised Instability


    In the previous chapter, I described instability as a hackable, breakable pattern.
    This pattern is breakable in an exact, semi-stable way, and, as such, replicating
    or using the break is akin to when virologists replicate or splice strains of
    viruses. The system in which the stabilised instability is hosted is important
    only as much as it allows for characterisation of the particularities of the stabilised
    instability. If the particularities of data architecture (e.g., hotel list, Cayman
    Islands offshore accounts, emails, photos, DNA data, lost books of Plato, datasets,
    the plans of a latest weapon, an NSDAP photo of Martin Heidegger) are not important,
    they play an insignificant role as the brand of beads in a virological paper.
    They become mentionable only when replication goes wrong or when the instability
    is forked into differently operating variants.


    What is “stabilised instability” in the context of cybersecurity? It is any sufficiently
    intersubjectively exchangeable fragment of knowledge about digital infrastructures
    that allows cybersecurity researchers to understand, interpret, locate or attribute
    situations or moments related to weaknesses in the architecture of digital infrastructures
    or human errors of their maintenance, operation or use. Stabilised instability
    must be understood in the scope of a thought collective of some cybersecurity
    researchers without directly correlating interests, as some social equivalent
    of philosophical objectivity.


    On the philosophical side of things, stabilised instability is defined as an epistemological
    tool and a product of instrumental reading of the science of cybersecurity. Instrumental
    in this context does not mean that cybersecurity necessarily serves some nefarious
    purposes. In the philosophy of science, instrumentalism means that science provides
    models for successful operations in the world rather than general laws about reality.
    As such, instrumentalism is connected with the philosophical traditions of anti-realism
    and the writings of Nancy Cartwright ([Cartwright, 1983](#bibliography.xhtml#_24044-2003_chp005_ref23))
    or Ian Hacking ([Hacking, 2001](#bibliography.xhtml#_24044-2003_chp005_ref58))
    more than the concept of falsification, perhaps more popular in media and in science
    communication, introduced by Carl Popper ([Popper, 2010](#bibliography.xhtml#_24044-2003_chp005_ref118)).


    Grounding “stabilised instability” in instrumentalism makes sense not only in
    the context of sociology of science and connections of my thinking to ethnographies
    of Harry Collins ([Collins, 2019](#bibliography.xhtml#_24044-2003_chp005_ref36))
    and their reception in the philosophy of instrumentalism ([Cartwright, 1991](#bibliography.xhtml#_24044-2003_chp005_ref24))
    but also to recent and ongoing debates in the philosophy of science focused exactly
    on the issues of cybersecurity conducted by Jonathan M. Spring, Phyllis Illari,
    David Pym and others ([Spring et al., 2017](#bibliography.xhtml#_24044-2003_chp005_ref155);
    [Spring & Illari, 2019](#bibliography.xhtml#_24044-2003_chp005_ref143), [2025](#bibliography.xhtml#_24044-2003_chp005_ref144)).
    Both Collins, as an ethnographer, and Spring and co-authors, as philosophers,
    engaged with the works of Peter Galison on the history of particle physics, the
    radar laboratory and the cybernetics of Norbert Wiener ([Galison, 1994](#bibliography.xhtml#_24044-2003_chp005_ref55),
    [1997](#bibliography.xhtml#_24044-2003_chp005_ref52), [2010](#bibliography.xhtml#_24044-2003_chp005_ref53)).
    Such works will also be an important point of reference, as they all engaged in
    previous debates on the issues of formation of new scientific fields, their philosophical
    and sociological mechanisms and particular issues connected with experiments,
    simulations, objectivity, methodology connected with late 20th century digital
    research.


    Why is instrumentalism important for “stabilised instability” and for cybersecurity,
    in particular? Why am I not satisfied with the notions of “text”, “performative”
    or even “inscription”? Maybe I could just dig up some tool from the prehistory
    of my own field, from the old times when social studies of science appeared to
    be in dialogue with cognitive anthropology ([Latour, 2012](#bibliography.xhtml#_24044-2003_chp005_ref82))?

    '
  trans: '

    2. 在热力学中，回收与废热再利用相关。Maxigas 和 Söderberg (Söderberg & Maxigas, 2022) 从 Boltanski
    和 Chiapello 的“New Spirit of Capitalism”《资本主义的新精神》(Boltanski & Chiapello, 2007)
    中借用了这一概念，作为黑客辩证模型的组成部分。对 Maxigas 和 Söderberg 而言，回收意味着对数字资本主义具有替代性和批判性的提案被改编为新的市场创新模式、新的劳动剥削意识形态以及削弱对资本主义未来批评的新方式。Söderberg
    和 Maxigas 所定义的辩证剩余，即在给定循环中抵抗被回收的剩余物，与我从一开始对 Czochralski 残余的理解非常接近。返回正文。⏎


    # 4 “Normal Science.”“常态科学”。网络安全作为一门科学。稳定化的不稳定性。系统学。权力精英。


    DOI: [10.4324/9781003396871-5](https://doi.org/10.4324/9781003396871-5) 本章已在 CC-BY-NC-ND
    4.0 许可下提供。


    在之前的章节中，我描述了科学的各种社会学要素。在第 1 章中，我描述了知识、劳动力的迁移、与之相关的正式和非正式知识空间及其基础设施之间的关系。在第 2 章中，我描述了可能在研究者内部群体中比外部群体更常共享的认知特征。我还描述了安全实验室作为一种一般类型的基本模型，其中包括与其他社会机构的接口。这使我们能够识别声望-参照机制，并使讨论错误、发现和原创性问题变得更容易。


    在本章中，我希望讨论网络安全如何系统化知识。在上一章中，我讨论了计算机安全知识的相对简单要素如何在 CTF 竞赛中复制。现在，我将把计算机安全的简单和复杂发现描述为我称之为“稳定化的不稳定性”的对象。在上一章中，“稳定化的不稳定性”可以应用于通过个人、非正式、默会、情境内和跨机构的情形（如
    Capture the Flag 竞赛）之间传递的知识。在这里，我感兴趣的是通过间接方式传递的网络安全知识，没有个人接触，通常以文本、代码或系统学的媒介，在由机构编码或至少由主体间设计的方式中传递。


    上一章的内容是关于面对面发生的网络安全，通过精英圈子的主体性或发生在 peripheral vision 中的细节。本章的内容是关于在系统学、模式和数据库的尺度上发生的网络安全。


    在讨论这些系统学、模式及其应用案例之前，我需要准备我的理论工具。数字系统可以被破坏的方式如此之多，以至于我需要一个中间概念，使其既能被技术领域的读者也能被社会科学的读者理解。这就是为什么我想深入思考稳定化不稳定性的概念；我希望它对科学社会学领域的同事来说足够理论化，同时对该领域的读者来说又足够贴近实际应用。


    ## What Is Researched by Cybersecurity? Stabilised Instability

    网络安全研究的是什么？稳定化的不稳定性


    在上一章中，我将不稳定性描述为可被黑客攻击、可被破坏的模式。这种模式可以以精确的、半稳定的方式被破坏，因此复制或使用这种破坏类似于病毒学家复制或拼接病毒株时的做法。容纳稳定化不稳定性的系统的重要性仅在于它允许对稳定化不稳定性的特殊性进行表征。如果数据架构的特殊性（例如，酒店名单、开曼群岛离岸账户、电子邮件、照片、DNA
    数据、柏拉图的失传书籍、数据集、最新武器的计划、马丁·海德格尔的纳粹党照片）不重要，它们在病毒学论文中就如同珠子的品牌一样微不足道。它们只有在复制出错或不稳定性被分叉为不同运行的变体时才变得可提及。


    在网络安全背景下，“稳定化的不稳定性”是什么？它是关于数字基础设施的任何足够主体间可交换的知识片段，使网络安全研究人员能够理解、解释、定位或归因与数字基础设施架构中的弱点或其维护、操作或使用中的人为错误相关的情况或时刻。稳定化的不稳定性必须在某些网络安全研究者的思想共同体的范围内理解，而没有直接相关的利益，作为哲学客观性的某种社会等价物。


    从哲学角度来看，稳定化的不稳定性被定义为一种认识论工具和对网络安全科学的工具性阅读的产物。在此语境中，工具性并不意味着网络安全必然服务于某些险恶目的。在科学哲学中，工具主义意味着科学为世界中的成功操作提供模型，而非关于现实的一般规律。因此，工具主义与反实在论的哲学传统以及
    Nancy Cartwright 的著作(Cartwright, 1983)或 Ian Hacking 的著作(Hacking, 2001)联系更紧密，而非由
    Carl Popper 提出的、或许在媒体和科学传播中更流行的证伪概念(Popper, 2010)。


    将“稳定化的不稳定性”奠基于工具主义是有意义的，这不仅在科学社会学的语境中，而且在我的思考与 Harry Collins 的民族志(Collins, 2019)及其在工具主义哲学中的接受(Cartwright,
    1991)的联系中，而且在由 Jonathan M. Spring、Phyllis Illari、David Pym 等人进行的、恰好聚焦于网络安全问题的科学哲学中的近期和正在进行的辩论中也有意义(Spring
    et al., 2017；Spring & Illari, 2019, 2025)。Collins 作为民族志学者，以及 Spring 和合著者作为哲学家，都与
    Peter Galison 关于粒子物理史、雷达实验室和 Norbert Wiener 的控制论的著作进行了 engagement(Galison, 1994,
    1997, 2010)。这些著作也将成为重要的参考点，因为它们都参与了关于新科学领域形成的先前辩论、其哲学和社会学机制以及与实验、模拟、客观性、方法论相关的特定问题，这些都与
    20 世纪晚期的数字研究有关。


    为什么工具主义对“稳定化的不稳定性”以及特别是对网络安全很重要？为什么我对“文本”、“表演性”甚至“铭写”这些概念不满意？我是否可以从我自己领域的史前时代挖掘出一些工具，从社会科学研究似乎与认知人类学对话的旧时代(Latour,
    2012)？

    '
