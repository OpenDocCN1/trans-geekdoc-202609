- raw: "If CVE is the standardisation offered for cybersecurity specialists to use,\
    \ then JSR-10–102 can be read as an exercise in the application of a theory of\
    \ science. If CVE is the Virginia effect and everyday practice of cybersecurity\
    \ emergency teams, then JSR-10–102 is the debate on the epistemology or on the\
    \ ideal. JSR-10–102 was not written by theorists, though, but by academic researchers\
    \ with practice in the industry and delegates from military research institutes\
    \ with experience in companies. Similarly, CVE has a sophisticated ontology of\
    \ information, so it would be a grave mistake to disregard it as “mere practical\
    \ application”.\n\n 75. Neither JSR-10–102 nor CVE or CVSS were the first attempts\
    \ to systematise cybersecurity. That is not my claim. This book is not an archaeology\
    \ of knowledge nor a historical study but a study of a certain period. For the\
    \ sake of clarity, I also will not discuss in detail all the briefings that constituted\
    \ JSR-10–102, even if they differed in perspective. A significant part of such\
    \ comparative analysis has been done earlier within philosophy ([Spring et al.,\
    \ 2017](#bibliography.xhtml#_24044-2003_chp005_ref145)) or within the field itself\
    \ ([Herley & Van Oorschot, 2017](#bibliography.xhtml#_24044-2003_chp005_ref69)).\n\
    \nA debate on the JASON’s report was continued in philosophy of science and philosophy\
    \ of technology, notably through the papers by Spring and co-authors; by reducing\
    \ JASON’s statement to a “problem of common language”, they missed important pieces\
    \ in their model of mosaic unity of cybersecurity as a science. Spring and co-authors\
    \ correctly translated the philosophical concept of mosaic unity into a sociological\
    \ model of a multitude of trading zones ([Galison, 2010](#bibliography.xhtml#_24044-2003_chp005_ref53)).\
    \ Returning even further to empirical research on this concept, there is a work\
    \ of Peter Galison on physicists, engineers and electronic researchers that interact\
    \ around experiments, instruments and theories ([Galison, 1997](#bibliography.xhtml#_24044-2003_chp005_ref52)).\
    \ This is not an issue of academic pedanticism, trust me. The division between\
    \ experiments, instruments and theories was crucial for Galison’s explanation,\
    \ as each of those objects allowed for at least a temporary stabilisation of the\
    \ trading zone. Stabilisation not in the sense of stabilised instability, but\
    \ in a biographical, social and epistemological sense: continuity of manuals,\
    \ continuity of careers, continuity of funding. When one theory was disproven\
    \ or when a precise instrument failed, the lab relied on the fact that it still\
    \ shared an understanding of the experiment details well enough to share it with\
    \ the close mosaic but unique enough to be still indispensable. The instruments,\
    \ theories and experiments were boundary objects ([Star & Griesemer, 1989](#bibliography.xhtml#_24044-2003_chp005_ref158))\
    \ that facilitated the translations between trading zones. The socio-epistemic\
    \ mosaic had boundary objects as miniscule grains, which both facilitated exchanges\
    \ between labs and subgroups and allowed for stabilisation during moments of epistemic\
    \ discontinuity.\n\nTo philosophers, this may appear as minutiae or nauseating\
    \ bookkeeping from social sciences. It is so easy to abbreviate common concepts\
    \ and common standards and other things enumerated by JASON to just “common language”.\
    \ But this is why tracing sociological work of Susan Leigh Star and their co-authors\
    \ matters and is so practical ([Star & Griesemer, 1989](#bibliography.xhtml#_24044-2003_chp005_ref148)).\
    \ Boundary objects are common in mosaic unity not because everybody ascribes them\
    \ a similar and unchangeable meaning. No, boundary objects, such as theories,\
    \ experiments and instruments are common because they are in-between the social\
    \ interactions of groups. They allow for maintaining stability of a lab, or the\
    \ stability of a career or the stability of a project even if a mosaic becomes\
    \ unbearable as a vocation elsewhere. Peter Galison openly referenced it and focused\
    \ attention on those issues ([Galison, 1997](#bibliography.xhtml#_24044-2003_chp005_ref52)).\n\
    \nIn my understanding CVE, CVSS and MITRE frameworks are exactly those, the “boundary\
    \ objects”, stabilised instabilities. They are not common languages, if that would\
    \ necessitate universal understanding, but they  76. are common enough for the\
    \ scale of localised understandings within the mosaic. What is necessary is only\
    \ local stabilisation, just for the lab, for the project, until the child grows\
    \ up. This stabilisation itself was enough to advance with experiments and the\
    \ falsification of hypotheses, which fits even logicist-empiricist criteria.\n\
    \nJASON thought around complex epistemic models. They compared cybersecurity not\
    \ only to physics, mathematics or cryptology but also recognised that attack-defence\
    \ feedback loop models well into epidemiology, immunology and agriculture sciences.\
    \ The basic conclusion from those comparisons was the fact that security degrades\
    \ over time. No less importantly, JASON already speculated about automatic proofing\
    \ and using virtual machines as sandboxes for running suspicious software in an\
    \ isolated environment. This can easily be compared to recognising the importance\
    \ of bench glove boxes or isolation chambers integrated into a bench: what may\
    \ appear as a mere logistical switch results in a revolution in practice.\n\n\
    Privately I may be an atheist, Marxist, critical sociologist, but I come from\
    \ Poland. This is why I would not be myself if I had not found not one, but two\
    \ devils in JSR-10–102, as it is commonly known,\n\nAs I read JASON’s report,\
    \ I recognised the name of Peter Galison. I discussed how his work was relevant\
    \ for cybersecurity as a science, and I read his work as a PhD candidate. I was\
    \ somewhat surprised that Galison briefed JASON and MITRE not on any sociological\
    \ or historical theories I knew but on what was, at least in fragments, a political\
    \ theology of cybernetics. The formal title of the briefing was “Augustean and\
    \ Manichean Science”, and it is a reference to Galison’s research on Norbert Wiener\
    \ ([Galison, 1994](#bibliography.xhtml#_24044-2003_chp005_ref51)). The metaphor\
    \ from theology was called to illustrate what is an unresolvable, but cognitively\
    \ fruitful, epistemological dichotomy. So, I am interested in it, not to answer\
    \ whether anyone present in the JASON briefing believes in the devil, but to investigate\
    \ what political and social associations it brings to the debate in cybersecurity.\n\
    \nDetails of this theological duality will be explained in a moment, but, before\
    \ that, I wish to explain why I believe they may be significant in 2025. In other\
    \ papers, cybersecurity also recognised the epistemological presence of an adversary.\
    \ How this adversary is imagined, as an epistemological figure and from what traditions\
    \ of sources the thinking about the adversary is taken, matters for the field.\n\
    \nNorbert Wiener was a pioneer of cybernetics research. Galison discussed Wiener’s\
    \ work because of his particular insight on adversarial modelling ([Galison, 1994](#bibliography.xhtml#_24044-2003_chp005_ref51)).\
    \ When Wiener was developing a system for controlling gun turrets for American\
    \ bombers, he modelled the response of the targets, a system of fighters and their\
    \ pilots effectively as singular adversaries. Trying to understand this element\
    \ of the feedback loop, Wiener called back to Christian theology for the distinction\
    \ between devils as figurations of such an opponent.  77. The devil in the religion\
    \ of Manicheanism, later considered a heresy by Christianity, is a rational adversary.\
    \ A Manichean devil tries to outwit, trick and conceal its intents. In contrast,\
    \ the devil according to Saint Augustine is disorder, entropy and chaos. While\
    \ the Manichean devil could and would change its tactics, the Augustinian devil\
    \ was unable to change in a manner other than random."
  fmt: '

    If CVE is the standardisation offered for cybersecurity specialists to use, then
    JSR-10–102 can be read as an exercise in the application of a theory of science.
    If CVE is the Virginia effect and everyday practice of cybersecurity emergency
    teams, then JSR-10–102 is the debate on the epistemology or on the ideal. JSR-10–102
    was not written by theorists, though, but by academic researchers with practice
    in the industry and delegates from military research institutes with experience
    in companies. Similarly, CVE has a sophisticated ontology of information, so it
    would be a grave mistake to disregard it as “mere practical application”.


    75. Neither JSR-10–102 nor CVE or CVSS were the first attempts to systematise
    cybersecurity. That is not my claim. This book is not an archaeology of knowledge
    nor a historical study but a study of a certain period. For the sake of clarity,
    I also will not discuss in detail all the briefings that constituted JSR-10–102,
    even if they differed in perspective. A significant part of such comparative analysis
    has been done earlier within philosophy ([Spring et al., 2017](#bibliography.xhtml#_24044-2003_chp005_ref145))
    or within the field itself ([Herley & Van Oorschot, 2017](#bibliography.xhtml#_24044-2003_chp005_ref69)).


    A debate on the JASON’s report was continued in philosophy of science and philosophy
    of technology, notably through the papers by Spring and co-authors; by reducing
    JASON’s statement to a “problem of common language”, they missed important pieces
    in their model of mosaic unity of cybersecurity as a science. Spring and co-authors
    correctly translated the philosophical concept of mosaic unity into a sociological
    model of a multitude of trading zones ([Galison, 2010](#bibliography.xhtml#_24044-2003_chp005_ref53)).
    Returning even further to empirical research on this concept, there is a work
    of Peter Galison on physicists, engineers and electronic researchers that interact
    around experiments, instruments and theories ([Galison, 1997](#bibliography.xhtml#_24044-2003_chp005_ref52)).
    This is not an issue of academic pedanticism, trust me. The division between experiments,
    instruments and theories was crucial for Galison’s explanation, as each of those
    objects allowed for at least a temporary stabilisation of the trading zone. Stabilisation
    not in the sense of stabilised instability, but in a biographical, social and
    epistemological sense: continuity of manuals, continuity of careers, continuity
    of funding. When one theory was disproven or when a precise instrument failed,
    the lab relied on the fact that it still shared an understanding of the experiment
    details well enough to share it with the close mosaic but unique enough to be
    still indispensable. The instruments, theories and experiments were boundary objects
    ([Star & Griesemer, 1989](#bibliography.xhtml#_24044-2003_chp005_ref158)) that
    facilitated the translations between trading zones. The socio-epistemic mosaic
    had boundary objects as miniscule grains, which both facilitated exchanges between
    labs and subgroups and allowed for stabilisation during moments of epistemic discontinuity.


    To philosophers, this may appear as minutiae or nauseating bookkeeping from social
    sciences. It is so easy to abbreviate common concepts and common standards and
    other things enumerated by JASON to just “common language”. But this is why tracing
    sociological work of Susan Leigh Star and their co-authors matters and is so practical
    ([Star & Griesemer, 1989](#bibliography.xhtml#_24044-2003_chp005_ref148)). Boundary
    objects are common in mosaic unity not because everybody ascribes them a similar
    and unchangeable meaning. No, boundary objects, such as theories, experiments
    and instruments are common because they are in-between the social interactions
    of groups. They allow for maintaining stability of a lab, or the stability of
    a career or the stability of a project even if a mosaic becomes unbearable as
    a vocation elsewhere. Peter Galison openly referenced it and focused attention
    on those issues ([Galison, 1997](#bibliography.xhtml#_24044-2003_chp005_ref52)).


    In my understanding CVE, CVSS and MITRE frameworks are exactly those, the “boundary
    objects”, stabilised instabilities. They are not common languages, if that would
    necessitate universal understanding, but they 76. are common enough for the scale
    of localised understandings within the mosaic. What is necessary is only local
    stabilisation, just for the lab, for the project, until the child grows up. This
    stabilisation itself was enough to advance with experiments and the falsification
    of hypotheses, which fits even logicist-empiricist criteria.


    JASON thought around complex epistemic models. They compared cybersecurity not
    only to physics, mathematics or cryptology but also recognised that attack-defence
    feedback loop models well into epidemiology, immunology and agriculture sciences.
    The basic conclusion from those comparisons was the fact that security degrades
    over time. No less importantly, JASON already speculated about automatic proofing
    and using virtual machines as sandboxes for running suspicious software in an
    isolated environment. This can easily be compared to recognising the importance
    of bench glove boxes or isolation chambers integrated into a bench: what may appear
    as a mere logistical switch results in a revolution in practice.


    Privately I may be an atheist, Marxist, critical sociologist, but I come from
    Poland. This is why I would not be myself if I had not found not one, but two
    devils in JSR-10–102, as it is commonly known,


    As I read JASON’s report, I recognised the name of Peter Galison. I discussed
    how his work was relevant for cybersecurity as a science, and I read his work
    as a PhD candidate. I was somewhat surprised that Galison briefed JASON and MITRE
    not on any sociological or historical theories I knew but on what was, at least
    in fragments, a political theology of cybernetics. The formal title of the briefing
    was “Augustean and Manichean Science”, and it is a reference to Galison’s research
    on Norbert Wiener ([Galison, 1994](#bibliography.xhtml#_24044-2003_chp005_ref51)).
    The metaphor from theology was called to illustrate what is an unresolvable, but
    cognitively fruitful, epistemological dichotomy. So, I am interested in it, not
    to answer whether anyone present in the JASON briefing believes in the devil,
    but to investigate what political and social associations it brings to the debate
    in cybersecurity.


    Details of this theological duality will be explained in a moment, but, before
    that, I wish to explain why I believe they may be significant in 2025. In other
    papers, cybersecurity also recognised the epistemological presence of an adversary.
    How this adversary is imagined, as an epistemological figure and from what traditions
    of sources the of the targets, a system of fighters and their pilots effectively
    as singular adversaries. Trying to understand this element of the feedback loop,
    Wiener called back to Christian theology for the distinction between devils as
    figurations of such an opponent. 77. The devil in the religion of Manicheanism,
    later considered a heresy by Christianity, is a rational adversary. A Manichean
    devil tries to outwit, trick and conceal its intents. In contrast, the devil according
    to Saint Augustine is disorder, entropy and chaos. While the Manichean devil could
    and would change its tactics, the Augustinian devil was unable to change in a
    manner other than random.

