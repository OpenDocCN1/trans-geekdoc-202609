    81.


    # 5 “Subversions.” Discrimination. Queer Cybersecurity. Feminist Cyberlaw. Reflections.


    DOI: [10.4324/9781003396871-6](https://doi.org/10.4324/9781003396871-6) The chapter
    has been made avaliable under a CC-BY-NC-ND 4.0 license.


    Throughout the book, I discussed groups in cybersecurity on different scales of
    geography, formality and institutionalisation. Geography impacts cybersecurity
    not only through limits of boundaries of nation-states but also on a regional
    level. For example, different waves of popularity or activity of hackerspaces
    are related not only to the global outsourcing of labour but also to the local
    gentrification processes. Free laboratories, hackerspaces or other informal meeting
    points for cybersecurity groups were often used as stopgaps before city space
    could become turned into more profitable property. Formalisation and institutionalisation
    processes are interlinked, but each does not have to follow the same direction
    as the other. For example, when a local university hosts informal talks for DevOps
    (see [Chapter 1](#ch01.xhtml#_24044-2003_ch001)), these informal meetings may
    act as probes for a living lab or another more formalised science participation.
    Conversely, it is not unusual for academic or business institutions to deliberately
    develop less formalised zones as a form of local networking, PR for interested
    cadres or as recruiting pools for contractors. One example may be Google Campus.
    Another example may be monthly events such as lab open days, intended exactly
    as a trading zone between academia and practitioners.


    In this chapter, I wish both to correct and to show the limits of generalisations
    given in previous chapters. Formality, institutionalisation and geography will
    still be important, but my focus will not be on the trading zones or on the process
    of farming on informality for the benefit of more structured actors.


    In this chapter, I am interested in practices that challenge the interests of
    at least some members of the power elite. What follows, I am also interested in
    practices that do not fit neatly in the reconstruction given in the previous chapter.
    I wish to examine at least a small subset of practices that challenge the power
    elites from within the field as from the outside. As in all cases in this book,
    that list is incomplete and should not be read as definitive or even representative.


    Understanding alternative or transformational practices is important sociologically.
    No field of knowledge is static, and no field of knowledge goes without an attempt
    to challenge, queer or redirect its social composition. 82. Understanding those
    social counter-currents is thus necessary for the goal of the book. As any abstraction
    of the infrastructure, social structure should not be considered as meaningfully
    understood without what I called stabilised instabilities. In this spirit, this
    chapter ends my book with an attempt to apply my theoretical concepts as tools
    for reflecting on my own ethnography. If not for better reasons, then to open
    up my thinking to alternatives, cracks and failures, similarly to how digital
    infrastructure has to undergo a thorough exposure for testing.


    Throughout the research, interviewees used different pronouns, different genders,
    ethnicities and places in workplace. Marginal and non-hegemonic perspectives matter,
    as it is epistemologically important to show that the power elite does not have
    total control over cybersecurity as a field of science.


    By necessity, each section will be closer to a vignette than to longer theorising.
    Instead of theorising about exclusion, queer or ethnic discrimination in the workplace,
    I prefer to say how this ethnography may contribute to each of those perspectives.


    The first section discusses an ethnography of cybersecurity labs in the context
    of various forms of exclusion from science, technology, engineering and mathematics
    (STEM). Exclusion may come from gender but also from ethnicity, wealth or psychological
    factors. The second section discusses a case of queer hacktivism to highlight
    its importance for developing concepts for a public understanding of cybersecurity
    science. The third section gives a small vignette on the connection between cybersecurity
    science and individual emotions of researchers. The last section discusses the
    project of feminist cyberlaw, focusing primarily on similarities in ethical commitments
    between feminist cyberlaw and examples discussed in earlier sections.


    ## Clubhouse Strikes Back? Social Mechanisms of Exclusion Between Formal and Non-Formal
    Education in Cybersecurity


    When any field of science becomes close to power or money, different forms of
    social exclusion follow. Often discussed gender-based exclusion is not the only
    kind, nor does it provide a universal blueprint for investigating exclusion of
    ethnic minorities or exclusion based on class.

