    ## 用户/受众群体


    现在，我讨论 CTF 场景中一个不太光鲜的部分。来自声望较低或更本地化活动的同事更可能处于职业生涯的初期。其中一些可能是学生，或正在向安全领域转型的软件开发者。对于其他人来说，本地
    CTF 可能是资深学术网络管理员或本地 Linux 大师日常工作中的一种愉快变化。一些可能是艺术家“刚涉足安全领域”（直接引语）或其他类型的偶尔爱好者。这种
    CTF 的一个例子可以在片段 3.2 中找到。


    Maxigas 和 Söderberg（2008）的类型学将这一群体认定为“crowds of users/audiences”。他们高于“click workers”的水平，因为他们仍然具有显著的自主性和专业知识。他们的
    CTF 超越了仅仅复制更著名活动中的任务。例如，任务可能需要对 Shodan 有简短的熟悉程度，^()


    ### 片段 3.3 组织者对 CTF 的描述


    我将此活动识别为“crowd of users/audiences”活动。它强调轻松、欢迎的特性和教育性。它还明显划定了预期任务的专业化程度。返回正文。⏎


    虽然“用户群体”的框架很容易适用于本地活动，但“观众”这一类别则适用性较低。在“群体”CTF 期间，观众与参与者之间的界限模糊现象更为常见。它们的共同性并非指全球安全专家社区，而是指本地安全专家和管理员的社区。


    这是基础设施和思想集体政治的第二个方面。CTF 充当不同数字安全方法之间同行调解机制和知识共享仪式。如果“同行生产”CTF 更类似于跨国层面的批判-回收动态，那么“群体”CTF
    则类似于关于新建本地人行天桥裂缝的争议。


    观察思想集体不同层级涉及的社区提供了关于基础设施政治的一些发现。正如在 IT 领域一样，关于基础设施的知识通常通过实践共同体传播。可能令人惊讶的是，即使对于所有层面的高度分布式和远程数字基础设施，共同活动和知识仪式仍然受到重视。这就是
    CTF 政治中最“社会”的方面，简单来说就是与来自本 otherwise 精英且常被隔绝的职业的其他从业者共同在一起的行为。


    政治的下一层建立在社交聚会之上。CTF 已成为政治招募和宣传工具。注意在这种情况下游戏化是多么有价值。它让我们能够在不与工作场所的保密性和 CTF 之外的“严肃”基础设施冲突的情况下围绕安全和黑客进行游戏。从这个意义上说，严肃性和“严肃基础设施的严肃政治”的时空压缩使它们具有政治性。


    劳动抵抗是劳动关系的另一个维度（Söderberg & Maxigas, 2022）。如果将黑客视为熟练劳动精英的劳动抵抗，那么无偿的 CTF 游戏工作或游戏教育如何融入这一逻辑？在技术历史上，工匠坚持为培训付费，因为他们相信工作应该得到报酬（Kaiser,
    2005）。从这个角度来看，本来无偿的 CTF 的非直接收益变得具有政治性，类似于开放科学（Mirowski, 2018）。这适用于对现有知识/权力关系的批判领域以及在社区中共享知识的回收过程，而无需为社区的维持支付费用。


    ## “Hack Me Baby One More Time”：安全漏洞利用的复制


    在之前的章节中，我讨论了基础设施的概念、政治和社会生态。在本节中，我讨论异常的复制、其物质性和其政治性。


    为了隐私，我对技术细节进行了匿名化和概括，并重构了一个概括性任务的传记。为了简单起见，我只讨论“Jeopardy”CTF 的任务，因为它们在活动之间更容易转移。然而，由于该过程可能显得复杂，表
    3.2 中包含了一个摘要。请注意，我的重构超越了单一的 CTF 活动，因为它包含了任务的活动前和活动后生命周期。


    正如任务作者在访谈中回忆的那样，该过程始于“一个很酷的问题的想法”。通常，这是一个数字基础设施的漏洞或安全漏洞利用。作者将其重新包装到不同的上下文中。旧问题在系统的新版本或旧架构的后代中重新出现。创建了安全漏洞的类比或概括。任务作者报告说这一阶段是一个孤立的过程，尽管他们强调了知识的共同来源和社会知识共享的重要性。


    值得注意的是，几乎没有受访者抽象地讨论任务想法。它们总是与特定的基础设施或软件家族相关。任务可能涉及对另一类网络上异常的概括。尽管如此，任务的想法是与基础设施的物质性相关联报告的。使用访谈片段、writeups、聊天记录和录制的现场演讲，我重构了安全漏洞如何被抽象为
    CTF 任务以及从 CTF 任务中抽象出来，如表 3.1 所示。这一认知过程被做成游戏，通过玩家和团队的情感参与维持了认知参与。


    任务制作背后的情感理由各不相同。知识共享和恶作剧很重要，但诸如“它看起来像一个有趣的悖论。我想知道人们是否能认出它”之类的说法也很重要。我从关于巧妙任务的片段中解读并共情了自豪和满足的感觉，从关于有缺陷任务的说法中解读并共情了类似“冒名顶替综合征”的机制。虽然许多先前的
    STS 关于基础设施的研究关注异常及其政治解决，但对在社区中逆向工程和复制异常的认知关注较少。


    ### 表 3.2 基础设施批判的回收——CTF 任务模型


    返回正文。⏎


    | # | 阶段 | 任务发生了什么？ | 回收与基础设施的相关性 |

    | --- | --- | --- | --- |

    | 1 | 任务构想 | 可能的基础设施差距尚未由作者物化为任务基础设施。 | 进行研究和概念工作。任务作者决定哪些基础设施批判/黑客元素适合锦标赛选手、锦标赛水平和任务类别。
    |

    | 2 | 任务准备 | 基础设施差距由作者物化为任务。 | 批判被回收到任务的临时基础设施中。 |

    | 3 | 任务测试 | 任务与差距之间的关系由任务作者、仲裁者和测试者巩固、测试并调校。这发生在 CTF 活动之前。 | 在此步骤中，批判变得专业化并融入安全认识论。
    |

    | 4 | 任务揭示与识别 | 该任务以测试床基础设施的形式向玩家揭示。基础设施差距被隐藏并准备好被黑客攻击。 | 回收的第二步。任务被呈现给社区和群体，以发现隐藏在任务中的基础设施差距。
    |

    '
