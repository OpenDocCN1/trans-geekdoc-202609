- raw: "This is exactly why I mentioned the concepts of performative and anti-structure\
    \ by Victor Turner ([Turner, 1995](#bibliography.xhtml#_24044-2003_chp005_ref153),\
    \ [2008](#bibliography.xhtml#_24044-2003_chp005_ref154)) earlier. Stabilised instabilities,\
    \ at least when they become public affairs (as I will discuss later), are  64.\
    \ public theatre performatives. As such, they are anti-structures, so they become\
    \ negatives of security theatres as thought by Schneier. Stabilised instabilities\
    \ as anti-structures translate to not only opening in a disciplinary field as\
    \ cybersecurity establishes itself as a science, but they may also contribute\
    \ to changes in social cohesion and boundary between familiarity and anonymity.\n\
    \nWhat exactly do I mean by that? Stabilised instability, as I defined earlier,\
    \ is a challenge to the infrastructure. It exists in the context of disruption,\
    \ destruction or putting infrastructure and social order in doubt or vulnerability.\
    \ When such contexts become known to the public, social order related to the infrastructure\
    \ may also be put into doubt as well as individual meanings, resources and other\
    \ relations. An example of the social order put into doubt would be the consequences\
    \ of public disclosure of classified data and dismissal of public officials (as\
    \ happens in sociological fairy tales but not in reality). Examples of individual\
    \ meanings, resources or relations put into doubt are the leaks of accounts of\
    \ adult or dating websites. What is important from an anthropological or sociological\
    \ perspective is the fact that the public or general knowledge was challenged\
    \ at what is in anthropology called a liminal stage ([Van Gennep, 2019](#bibliography.xhtml#_24044-2003_chp005_ref166)).\n\
    \nIn other words, scientific discoveries, especially public reveals from cybersecurity\
    \ by definition destabilise public order, by making people lose their sense of\
    \ belonging, or what my friend and a philosopher of technology Andrzej W. Nowak\
    \ calls “a horror in ontological imagination” ([Nowak, 2016](#bibliography.xhtml#_24044-2003_chp005_ref120)).\
    \ Through challenging established epistemology in various scientific debates and,\
    \ for cybersecurity, reliance on digital infrastructures, sciences make people\
    \ feel “neither here, nor there”, as epistemological displacement catalyses social\
    \ and ontological doubts. What van Gennep proposed for the ritual of adulthood,\
    \ Turner understood as a ritual of cohesion and decohesion of society, hence the\
    \ theoretical dialectics of structure and anti-structure. When stabilised instability\
    \ becomes a public affair, as was the case of Pegasus, it also becomes a sociological\
    \ anti-structure: an opportunity to contest not only an epistemological assumption\
    \ about security knowledge but also social and political assumptions about democracy,\
    \ various parliaments, markets, etc.\n\nIn this paradoxical way, stabilised instability\
    \ constitutes a socio-psychological double bind. Scientists, researchers and cybersecurity\
    \ professionals research stabilised instabilities because these provides them\
    \ with a sense of meaning, an emotional payoff for satisfying their curiosity\
    \ or always returning for the experience of “having the root” (being in total\
    \ control, total power and knowledge of the system). Curiosity-satisfaction, sense\
    \ of control and dopamine-rush from challenge are, of course, not all the psychological\
    \ motivations for doing scientific work. Especially after 2020, with the rising\
    \ standardisation and the rising needs for insurance and certification, more interviewees,\
    \ especially from student-centred events, mentioned money and prestige as motivators.\
    \ I discussed it in the previous chapter in relation to Maxigas and Söderberg’s\
    \ concept of recuperation of resistance and hacking culture by institutions ([Söderberg\
    \ & Maxigas, 2022](#bibliography.xhtml#_24044-2003_chp005_ref141)). Regardless\
    \ of the psychological  65. motivations of individuals within the field of cybersecurity,\
    \ the double bind on the broader, social scale is to create more uncertainty and\
    \ social anti-structure.\n\nIn my personal interpretation, cybersecurity is not\
    \ alone as a field in this Faustian bargain between certainty and doubt. This\
    \ dialectic is a part of the social role of science, since science began to replace\
    \ religion as a source of justification or meaning for public order. To attempt\
    \ to discuss any type of knowledge in public, to put it into open, experimental\
    \ and repeatable verification is to accept that debate in scientific knowledge\
    \ will cause turmoil. It is naïve to expect that any kind of science will be free\
    \ of such responsibility.\n\nThis is the final interpretation of stabilised instability.\
    \ If cybersecurity, at least occasionally, becomes an issue of public scientific\
    \ controversy, then such controversy would not be resolved only through a debate\
    \ among experts. Stabilised instabilities reveal issues of power over societies,\
    \ not only because they epistemologically and materially relate to digital infrastructures\
    \ but also because they relate to social order, issues of trust, privacy and control.\
    \ This is the definition of the social role of cybersecurity as a science: if\
    \ cybersecurity is to become a science that circulates stabilised instabilities,\
    \ then it should concern itself with public participation, accountability and\
    \ responsibility. Replication, methodological excellence and digital methods are\
    \ not enough to make a leap from 1930s science to contemporary science.\n\nPublic\
    \ oversight and ethical accountability are necessary, as Auschwitz’s medical experiments,\
    \ Tuskegee’s syphilis study, Wendell Johnson’s negative reinforcement experiment\
    \ and numerous other harms done in the name of science have proven. Why should\
    \ we expect cybersecurity to be different? If it experiments with larger-scale\
    \ infrastructures that concern social groups, why should we place different ethical\
    \ demands on it? Virology and nuclear physics are also closely adjacent to military\
    \ institutions, but they still have some civilian and professional oversight.\n\
    \nWho should provide oversight over various practices of cybersecurity and its\
    \ experiments? This is a social, ethical and political question as much as it\
    \ is an epistemological one. Discussing cybersecurity as a science, one cannot\
    \ escape it. Not because cybersecurity is ubiquitous, overreaching or special,\
    \ but because the very same question must be answered for every other field of\
    \ science.\n\nIn the end, interpreting stabilised instability has led to a sociological\
    \ equivalent of an ouroboros. The more I tried to analyse the peculiarity of stabilised\
    \ instability as an epistemic object, the more elements common to other relations\
    \ between other sciences and societies I found. In retrospect, this is not surprising.\n\
    \nBeing close to the tradition of C. W. Mills in sociology ([Mills, 2000](#bibliography.xhtml#_24044-2003_chp005_ref100)),\
    \ I know that analysis of individual characteristics often leads to recognition\
    \ of repetitive, structural or historical patterns. Finding these patterns is\
    \ a clear sign that it is high time to apply my concepts to some cases.\n\n 66.\
    \  \n\n## Vulgar Display of Power (Elite). Why Does Cybersecurity Science Matter?\n\
    \nHow to find a case for global conceptualisation? Many times, I admitted that\
    \ even such an attempt is incomplete and mosaic by default. The only solution\
    \ is to look closely at the power elites ([Mills & Wolfe, 2000](#bibliography.xhtml#_24044-2003_chp005_ref107))."
