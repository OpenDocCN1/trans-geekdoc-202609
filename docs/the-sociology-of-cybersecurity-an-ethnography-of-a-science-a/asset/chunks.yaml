    To understand processes at the scale of the field, I would like to start with
    its margins. To understand what happens behind the confidence of non-disclosure
    agreements on the global scale, this chapter investigates communities of programming
    and computer administration subcontractors in Europe.


    The methodological trick here may be as old as labour research. If workplaces
    are barred by non-disclosure agreements, go look for social spaces where groups
    interact after work. Do they have social clubs, DIY groups, conferences, prizes
    and other prestige events? As I was absolutely honest about my goals, the majority
    of interviewees immediately recognised that the difference between sociology and
    social attacks in cybersecurity lie in justification, ethics and social legitimation
    but not in method. Like a red team (the attacking side) investigating the weakness
    of a social system, I looked for subcontractors. As the field is rich in multi-faceted
    irony, cybersecurity researchers referred to my academic peers not as “professors”
    but as “generals”.


    Generals, field report. There is only techno. For newcomers, it might sound like
    Slavic folk-themed, gopnik, techno, hard-bass whatever. For connoisseurs, it is
    immediately recognisable as a classic remix of a musical theme from an old computer
    game, Tetris.^()


    The purpose of obnoxious beats is the same as the purpose of archaic conference
    posters, stacks of books or whiteboards full of equations in laboratories: to
    demarcate. Not only to socially exclude but to demarcate as it is understood in
    philosophy of science, that is, to establish a separate, safe mind-space for those
    who are included in the field. To lower the cost of cognitive failure by proximity
    of the trade and to help to maintain the focus.


    What is the relation between the vibes described in the previous paragraph and
    the goals of this book? First, in places like those described, one can meet cybersecurity
    freelancers that work in security teams of various digital  10. corporations.
    While freelancers often “grow up” out of their hackerspace, they often hop in
    when they visit the city or when they look collaborators for either complex or
    private projects. The mechanism here is very similar to the “homel lab”, the group
    when one does their master’s or PhD thesis. One may move out of it, specialise
    into a different field or fall into a conflict, but those are the nodes of the
    network.


    The key methodological issue was patience. Instead of asking about vulnerabilities,
    scandals and illegal stuff, I was able to learn much more when I took an interest
    in reverse engineering or figuring out how things work from having physical access
    to the object, in areas such as obsolete computing systems or old telecommunication
    equipment.


    Only after gaining trust was I invited to more closed-door meetings and conferences.
    Eventually, as I helped with my knowledge as a sociologist, science communicator
    and organiser, I was invited to a workshop on the European Union’s General Data
    Protection Regulation.

    '
  trans: '

    当事件被引用或详细描述时，参与者给予了持续的同意，并有机会查阅关于他们的原始数据，并在我之前的出版物中检查我的匿名化流程（Zaród, 2016, 2018,
    2022; Kostyszak et al., 2015）。如果书中描述的一些案例缺乏技术数据，那是为了保护小范围内参与者的匿名性。技术不准确的唯一责任人是作者，因为有时数据无法听清或难以解读，而不至于让参与者面临更大风险。


    本研究方案基于我认为的“最佳标准”的社会学伦理，如波兰、英国、美国和国际社会学组织（PTS、BSA、ASA、ESA、ISA）的伦理程序所述，故意选择收集较少的民族志数据，并选择为受访者保持更多隐私。


    由于我做出的伦理和方法选择，我比研究其他学科的同事更少接触有组织的实验室。该领域的定量研究具有挑战性，因为出版结构更多基于推特帖子、会议、新闻稿和非正式渠道的星云，而非期刊论文。诺贝尔  8.
    奖的等价物更难指出，也没有得到广泛认可。更糟糕的是，人们普遍认为军事情报机构在招聘、研究和赞助方面是庞大的制度节点。我在第 4 章中重点讨论了这一主题，但这只是冰山一角。


    本书虽然经常批判为军事或监控资本主义机构服务的网络安全科学，但它既是批判，也是社会学上的尝试，旨在为受访者和其他网络安全研究人员提出一些工具，或许有助于塑造他们的专业和科学领域。在此意义上，本书写于
    John Bernal、Lila Abu-Lughod、Olga Amsterdamska、Joseph Needham、Hilary Koprowski、Ludwik
    Fleck、Antonina Kłoskowska、Nadera Shalhoub-Kevorkian 以及许多其他学者的传统之间。网络安全应成为人民的科学、由人民做出的科学以及对人民负责的科学。本书旨在为这一目标做出贡献。“人民”的定义不仅限于“网络安全研究人员”或“全球北方公民”，详情请阅读
    Bernal。


    这也是我故意拒绝自我殖民化的原因。这不是一本关于“中东欧可爱异国情调案例研究网络安全”的书；尽管对于许多英语母语的研究者来说，这样的书更容易理解，也许更具可引用性。不，网络安全是一个全球性领域，所以我将像这样研究它。如果波兰人、美国人、乌克兰人、德国人、瑞典人、罗马尼亚人、捷克人、韩国人、巴西人或巴勒斯坦人，无论性别和毛色如何，^()


    另外，为了让我表达得绝对清楚，来自全球北方的研究人员或黑客中，有足够多的人接受了我的采访或通过解释标准来提供帮助。有足够多的研究人员帮助了我，不是出于沮丧，而是出于诚实。他们中的大多数不会同意我左倾的观点，但他们分享了我深入挖掘并坦诚谈论的共鸣。


    我感谢那些同意被观察并接受采访或未录制谈话的人们的时间和劳动。我感谢那些提供咨询并花时间与我达成分歧的人。最终，我对本书和这项研究承担责任。


    ## Note


    1. 黑客行动主义和网络安全使“fursonas”正常化，欢迎并规范了各种“毛绒”群体和人类的在线身份。这将在第 6 章中在讨论颠覆性实践时具有理论相关性。返回正文。⏎


    9.


    # 1 “Kaleidoscope.” Maintenance. Infrastructures. Abstractions.


    DOI: [10.4324/9781003396871-2](https://doi.org/10.4324/9781003396871-2) 本章已在 CC-BY-NC-ND
    4.0 许可下提供。


    为了理解该领域的规模过程，我想从其边缘开始。为了了解全球范围内在保密协议信心背后发生的事情，本章调查了欧洲编程和计算机管理分包商的社区。


    这里的方法论技巧可能与劳动研究一样古老。如果工作场所因保密协议而被禁止，就去寻找工作后群体互动的社会空间吧。他们有社交俱乐部、DIY 团体、会议、奖项和其他声望活动吗？由于我对自己的目标绝对诚实，大多数受访者立即认识到社会学与网络安全中的社会攻击之间的区别在于正当性、伦理和社会合法化，而不在于方法。就像红队（攻击方）调查社会系统的弱点一样，我寻找分包商。由于该领域充满多层面讽刺，网络安全研究人员将我的学术同行称为“将军”，而不是“教授”。


    将军，现场报告。这里只有 techno。对于新手来说，它可能听起来像斯拉夫民俗主题、gopnik、techno、hard-bass 之类的东西。对于行家来说，它立即可以识别为老式电脑游戏《俄罗斯方块》的音乐主题的经典混音。^()


    令人讨厌的节拍的目的与实验室中古老的会议海报、书堆或写满方程式的白板的目的相同：划界。不仅是为了社会排斥，也是哲学意义上的划界，即为被纳入该领域的人建立一个独立、安全的思维空间。通过与该行业的接近降低认知失败的成本，并帮助保持专注。


    前一段描述的氛围与本书的目标有什么关系？首先，在像上面描述的地方，可以遇到在各种数字  10. 公司安全团队工作的网络安全自由职业者。虽然自由职业者通常“成长”于他们的黑客空间，但他们经常在访问城市时或在寻找复杂或私人项目的合作者时加入。这里的机制与“homel
    lab”非常相似，即攻读硕士或博士论文时的团体。一个人可能会离开它，专攻不同领域或陷入冲突，但这些都是网络的节点。


    关键的方法论问题是耐心。不要询问漏洞、丑闻和非法内容，我在对逆向工程或通过对物体进行物理访问来弄清事物如何运作感兴趣时学到了更多，例如在过时计算系统或旧电信设备等领域。


    只有在获得信任后，我才被邀请参加更封闭的会议和会议。最终，由于我作为社会学家、科学传播者和组织者的知识帮助，我被邀请参加关于欧盟《通用数据保护条例》的工作坊。

