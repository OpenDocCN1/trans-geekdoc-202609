    of an adversary ([Galison, 1994](#bibliography.xhtml#_24044-2003_chp005_ref51)).
    JASON’s report looked back at this research, as it conceptualised the same problem
    for 2010s cybersecurity science: how to construct an epistemological model of
    the enemy? Palestinian feminist scholars of surveillance independently recognised
    that theology, this time Jewish, underpins surveillance and cybersecurity operations
    of Israel in Gaza ([Rouhana &  90. Šalhūb-Kīfūrkiyān, 2021](#bibliography.xhtml#_24044-2003_chp005_ref138)).
    Nādira Šalhūb-Kīfūrkiyān calls this “security theology” ([Šalhūb-Kīfūrkiyān, 2015](#bibliography.xhtml#_24044-2003_chp005_ref140)),
    when the imagined space around cybersecurity becomes untouchable and inaccessible
    and can be only discussed by the initiated within a hermetic order. Outsiders
    have only religious metaphors, but through every metaphor, the power of the initiates
    only grows, as do prices for their products. Paradoxically, this goes against
    many ideals of hacking as well as against the ideals of science. Science is not
    the arcane, hermeneutics; it is not for the gifted or initiated, but it should,
    at least in principle, be understood universally. I guess that I have only one
    conclusion: the struggle about ethics in cybersecurity is the same as the struggle
    about ethics in science ([Wolfe, 2020](#bibliography.xhtml#_24044-2003_chp005_ref175)).
    This set of political theology is colonial, as it sets cybersecurity as a guardian
    of holy secrets of the state, as an uncrossable divide between conquerors and
    subjects of the conquest, between the “sec people” and “lay people”. When I write
    holy, I do not mean that I believe that there is anything supernatural in knowledge,
    nor that I even think that people using this rhetoric believe so. I write “holy”
    in a Durkheimian sense ([Durkheim, 2008](#bibliography.xhtml#_24044-2003_chp005_ref43)),
    understanding cybersecurity as “holy” means as separated from everyday life as
    social taboo, imposing a set of rigours on the society, the justifications of
    which lie not in evidence but in performative rituals.


    At the same time, cybersecurity science, in the very non-religious and completely
    scientific, non-metaphoric sense, acts as the locksmith for many intricate mechanisms
    of social order today. This is the Durkheimian totem, albeit a twisted one, as
    it has a form of digital infrastructure and not a symbolic centre. Like the Durkheimian
    counterpart ([Durkheim, 2008](#bibliography.xhtml#_24044-2003_chp005_ref43)),
    cybersecurity is both visible, when it acts, and invisible, when it is feared
    by the laypeople as the source of social control. Its everyday intricacies are
    hidden from outsiders but justified in the political arena in terms of theology,
    mysticism and dangers from uncountable devils. Science, but justified and used
    for social control as a religion. Unknowable, unable to verify, unaccountable.
    Exact, palpable and ubiquitous, but only as source of fear and never when it comes
    to accountability.

