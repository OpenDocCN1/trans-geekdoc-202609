- raw: "However trivial such processes may sound, I recommend just paging through\
    \ the history of post-war particle physics, exactly at the moment when physicists\
    \ had to learn how to work with electrical and electronic engineers to make better\
    \ particle detectors ([Galison, 1997](#bibliography.xhtml#_24044-2003_chp005_ref52)).\
    \ You will immediately notice that collaboration in the laboratory is fragile\
    \ and far from obvious.\n\nWould it be a big surprise if I were to tell you that\
