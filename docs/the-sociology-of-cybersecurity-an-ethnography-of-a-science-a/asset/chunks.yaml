    with some exemptions (big corporations, military alliances, etc.). || Global,
    beyond the boundaries of singular funding agencies. |

    | Sources in Sociology || Bruno Latour and Steve [Woolgar (1986)](#bibliography.xhtml#_24044-2003_chp005_ref89),
    Harry [Collins (2017)](#bibliography.xhtml#_24044-2003_chp005_ref35), [Karin Knorr-Cetina
    (1999)](#bibliography.xhtml#_24044-2003_chp005_ref82), [Izabela Wagner (2011)](#bibliography.xhtml#_24044-2003_chp005_ref171).
    || Max Weber and others, but my definition takes from [Andrew Abbott (1988)](#bibliography.xhtml#_24044-2003_chp005_ref1).
    || [Ludwik Fleck (2008)](#bibliography.xhtml#_24044-2003_chp005_ref53). |

    | Relevance and author’s interpretation || Laboratory allows demarcation, which
    is separation of research and researchers from the outside world. Then, within
    the laboratory microcosm, researchers may ask otherwise unacceptable questions
    (is this obvious fact really true?), go against social norms (cause discomfort
    or harm in order to do research) or otherwise put social norms on pause in order
    to reconfigure epistemologies. || Establishment of legal standards, ethical procedures
    (e.g., responsible disclosure) and development of the public understanding of
    the field signal that the particular field achieved autonomy and prestige. Autonomy
    means that legal and state apparatuses require somebody from within the field
    to judge the professionals (e.g., a judge requires a medical expert to judge a
    medical malpractice case). || If a field of science achieves coherence enabling
    the formation of thought collectives, then socio-cognitive phenomena like incommensurability
    and simultaneous discoveries occur. Thought collectives signal social formation
    of “big science” ([Price, 1971](#bibliography.xhtml#_24044-2003_chp005_ref128))
    and formalisation of the field. |

    | What domains are related? || Philosophy of science, sociology of scientific
    labour, science studies, scientometrics, management. || Law, ethics, military
    sciences, political sciences, sociology of labour, public understanding of science,
    HR. || Philosophy of science, cognitive sciences. |

