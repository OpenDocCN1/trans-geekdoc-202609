    hidden layers with the policy network, but it outputs a scalar value that quantitatively
    estimates whether the action is on track to generate rewards. More precisely,
    we define the observed return at step \(t\) up to the terminal step K as the sum
    of discounted future rewards \(r_{t+1}, r_{t+2} ... r_T\) with the discount factor
    \(\gamma = 0.99\)


    \(G_t = \sum_{\tau=t+1}^{K} \gamma^{\tau-t-1} r_\tau\) (1)


    and the value function, \(V_{\theta_v}(s_i)\), approximates the expected value
    of the return, \(E_\pi[G_t|s_i]\), given state \(s_t\).


    During the training, the model updates the parameters, \(\theta_p\) and \(\theta_v\),
    of the policy and value network. To update \(\theta_p\), policy gradients (PGs)
    are taken according to the direction given by


    \(PG = (G_t - V_{\theta_v}(s_i)) \nabla_{\theta_p} \log \pi_{\theta_p}(a_i|s_i)\)
    (2)


    Here \(G_t\) is the observed return defined in eq 1 and collected in the rollout
    as detailed in the Rollout Sampling section. The current value network, \(V_{\theta_v}(s_i)\),
    is used to update the policy \(\pi_{\theta_p}(a_i|s_i)\), with the policy gradient
    being in a direction that will improve the policy to favor actions that increase
    the expected return. Moreover, the policy gradient becomes more reliable when
    the value function has a more accurate estimation of the expected return. To improve
    the value network, the parameters \(\theta_v\) are updated to minimize the mean
    square error between the current value function, \(V_{\theta_v}(s_i)\), and the
    observed return, \(G_t\). As discussed earlier, the input data is a vector with
    23 entries describing the state \(s_t\). The model will accept a minimum of 300
    data points (a training minibatch) in each training step. Thus, the training utilized
    the stochastic gradient descent on the minibatch of the shape of (300, 23).


    **Rollout Sampling.** For each subsequent step \(t\), the rollout data are collected
    using the Monte Carlo (MC) method. Based on the current state \(s_t\), the actor
    decides an action \(a_t\) which is drawn from the distribution generated by the
    policy network \(\pi_{\theta_p}\). By executing the action, the model transits
    to the next state \(s_{t+1}\) and claims the corresponding reward. The rollout
    ends when either the final state or the maximum step of a rollout K is reached.
    In our experiment, the maximum step K is set to be 500. We did not use approximation
    methods such as TD(\(\lambda\))\(^{45}\) to approximate the observed return \(G_t\),
    but used the Monte Carlo method to faithfully collect the return along the rollout
    trajectory. By the end of the rollout, training samples consisting of the list
    of tuples \((s_t, a_t, G_t)\) are collected.


    For every policy update (training episode), the model is configured to investigate
    many independent MC rollouts created on-policy, collected in parallel, and finally
    synchronized to update the policy. The rollouts that do not reach the final state
    by the terminal step K will have a certain down-sampling rate for the random selection
    without replacement. The number of rollouts is dynamically determined in the runtime
    and is inversely proportional to the average length of these rollouts for the
    current policy update. We find our sampling methods play an important role in
    preventing the model from converging to the suboptimal policy biased by the locally
    optimized trajectories. In our experiment, we choose 0.3 as the down-sampling
    rate, and a size of 300 is the minimum number of data points that are required.
    This is equivalent to about 10 rollouts close to the final convergence.


    **Curriculum Learning.** We introduce two-stage learning curricula for the model
    to learn. For the first curriculum, to avoid unstable learning dynamics created
    by the initial introduction of penalties for executing impossible actions, we
    impose a tiny negative reward of -0.01 in the environment building. This small
    penalty alleviates the accumulated negative rewards that otherwise easily prevent
    the model from early exploration on the complex network while still holding fairly
    reasonable sense for the model to exploit the favorable actions. In the second
    curriculum, the negative rewards are increased to -0.1 for a more realistic environment,
    and details about the rewards can be


    found in Table S1. In our experiment, we run 100 000 training episodes for the
    first curriculum and 50 000 for the second.


    **Entropy Regularization.** In the policy gradient objective, we add the policy
    entropy (PS) to eq 2 as an extra term, which is defined as


    \(PS = -\beta \sum_i \pi_{\theta_p}(a_i^i|s_i) \log(\pi_{\theta_p}(a_i^i|s_i))\)
    (3)


    Here the superscript \(i\) denotes the action index and \(\beta\) is the entropy
    regularization coefficient. The use of the entropy term encourages the model to
    explore more on the actions that have small probabilities in the action space
    following the current policy. We find the entropy regularization necessary to
    handle our complex network with a large action space. For the first curriculum,
    we configured the entropy regularization coefficient to be 0.1 and this coefficient
    is decreased to 0.05 in the second curriculum while the model becomes more stable.


    **DRL Model Convergence.** The initial parameters for our DRL model are given
    with no prior information. But our model converges effectively to a stable and
    optimal strategy, as shown in Figure S8 of the SI. This is due to the following
    reasons. First of all, we randomly initialize the parameters via the Xaiver initialization
    method that is designed to keep the scale of the gradients roughly the same in
    all layers and significantly helps the stability and convergency of the DNN.\(^{46}\)
    Second, we applied the A2C method, which is a synchronous version of A3C. The
    synchronized gradient update keeps the training more cohesive and make convergence
    much faster than the Vanilla policy gradient.\(^{37}\) Third, the framework combines
    with DFT simulations, using the detailed free energy landscape to construct the
    accurate reward functions over the actions. Last but not least, the curriculum
    learning effectively helps the convergence of our model.


    **DFT Simulations.** All DFT simulations are carried out using the VASP software
    with plane-wave basis sets for the electronic wave function.\(^{47-50}\) The energy
    cutoff for plane wave expansion is 500 eV in all calculations. We use the Perdew–Burke–Ernzerhof
    exchange and correlation functional\(^{51,52}\) for electronic interactions and
    the D3 corrections for van der Waals interactions.\(^{53}\) The Methfessel–Paxton
    scheme is adopted to account for the electron partial occupation, and the width
    of the electronic smearing is 0.2 eV. The spin polarization is allowed in all
    calculations to predict the magnetic moments of Fe atoms accurately. The energy
    convergence for the self-consistent field and the force convergence for ionic
    steps are \(10^{-6}\) eV and \(10^{-3}\) eV/Å, respectively. The first Brillouin
    zone is sampled using the \(\Gamma\)-centered mesh method with the \(4 \times
    4 \times 1\) K-points used in the slab calculations. The simulation setup is consistent
    with the previous studies, and the details can be found in the previous work.\(^{7,8}\)


    The Fe-bcc(111) slab model consists of a (\(2 \times 2\)) unit cell in the (111)
    plane and six layers perpendicular to the plane. The bottom three layers are fixed,
    and the top three layers are allowed to relax in the geometry optimization. A
    vacuum of 15 Å is added to the slab model to minimize the interactions between
    period images. To examine the possible size effect of the slab model, we increase
    the six-layer slab to nine-layer and compute the free energy of several important
    states along the free energy diagram (Figure 4) on this nine-layer model. The
    bottom three layers of this nine-layer slab are fixed in the geometry optimization.
    To investigate the effect of the catalytic surface, we expand the (\(2 \times
    2\)) six-layer slab to a (\(4 \times 2\)) slab and compute the free energy of
    these important states on the enlarged model. Assuming that the free energy corrections
    for the three slab models are the same, we obtain the free energies of the important
    states and list them in Table S3 of the SI. The free energy of important states
    agrees very well for all three slab models, indicating that the DFT simulations
    are robust using the six-layer (\(2 \times 2\)) slab model.


    We obtain the free energy at finite temperature by calculating the phonon modes
    from the harmonic approximation. The finite displacement approach is adopted to
    obtain the phonon modes,\(^{54,55}\) which are then used to compute the vibrational
    entropy as a function of temperature. The free energy of gas phases (N\(_2\),
    H\(_2\), and NH\(_3\)) is taken from previous work using the same computational
