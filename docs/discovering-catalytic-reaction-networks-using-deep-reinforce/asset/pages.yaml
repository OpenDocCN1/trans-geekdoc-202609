    One of the main challenges of finding the catalytic reaction path is the subtle
    trade-off between exploitation and exploration. Exploitation in this work means
    that the model claims the rewards based on the current strategy, while exploration
    means finding a better strategy to produce more plausible intermediate states
    along the reaction path. The goal is to find a strong decision-making strategy
    so that our model has the highest probability of taking the optimal action. On
    the one hand, the optimal action trajectory guarantees reaching the end state
    and maximizes rewards given the observed states. On the other hand, the high probability
    for those optimal actions will increase the stability of constructing complex
    reaction networks and is crucial to confidently determine the most plausible reaction
    path given the start and final states. During the training stage, if we constantly
    choose the best action known so far, the model will not have sufficient chance
    to


    explore other plausible actions given the same state, so the model is most likely
    to follow semioptimal policies leading to small rewards or even bad policies that
    cannot reach the final state. Moreover, unlike many other problems, the catalytic
    reaction path found by the DRL model is expected to become significantly shorter
    in the late training stage compared with that in its early stage. As a result,
    the total number of samples from a rollout may decrease dramatically with further
    training. These pose great challenges for exploring this complex environment with
    sparse rewards, many competing actions, and a huge number of states.


    To tackle the exploitation–exploration challenge, we employed several novel strategies.
    We applied the curriculum learning algorithm to environment building. During training,
    the model explores multiple environments of varying complexity associated with
    low to high skill levels and eventually interacts with the realistic environment.
    This also significantly helps to improve the stability and speed of model convergency.
    For the policy update, we devised a training strategy derived from the synchronous
    deterministic variant of A3C but with several modifications: First, for each synchronous
    training episode, the model is configured to investigate many independent-of-policy
    rollouts collected in parallel, but the number of rollouts is dynamically determined
    and is inversely proportional to the average length of these rollouts. Second,
