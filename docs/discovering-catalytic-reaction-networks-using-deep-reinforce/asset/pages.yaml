    We model the evolution of the chemical reaction path as a Markov decision process
    defined by a state space S, an action space A, a probability transition P(s_t+1|a_t,
    s_t), and a reward function r that is generally defined in the space S × A. To
    define the environment state, we introduce an encoded state vector s_t at step
    t that projects the total number of 20 surface sites onto a vector. The vector
    also accounts for N2, H2, and NH3 gas species involved in the Haber–Bosch reaction.
    Figure 1(d) shows the first 20 entries of the state vector that are used to represent
    the 20 surface sites; the value of each entry represents the adsorbents displayed
    in Figure 1(e). The adsorbents H, N, NH, NH2, NH3, and N2 are encoded by integers
    1–6, respectively, and an empty site is represented by the number 0. The last
    three entries of the vector are adopted to record the number of gas species (N2↔21,
    H2↔22, and NH3↔23) along the reaction path. The reaction starts with the initial
    state s0 which is a 4N-covered surface plus one N2 and three H2 gas molecules
    (Figure S2 of the SI). The model surface is consistent with the fact that the
    Fe surface has a high coverage of N atoms under Haber–Bosch reaction conditions.
    The final state sf is defined as the 4N configuration with two NH3 molecules in
    the gas phase (Figure S2 of the SI), representing the complete reaction N2 + 3H2
    ⇌ 2NH3.


    The actions connecting s0 and sf are defined in terms of four main categories:
    (1) H2 adsorption/desorption from the surface; (2) N2 adsorption, migration, and
    dissociation on the surface; (3) surface hydrogen migration to hydrogenate N,
    NH, or NH2 species (for example H + NH ⇌ NH2); and (4) NH3 desorption from the
    surface. Based on the specific surface sites for reactions, the actions are further
    refined to form the action space utilized in the environment. The definitions
    of all 17 actions are displayed in Figures S3–S6 of the SI. The defined 17 actions
    represent the fundamental reaction steps on the Fe-bcc (111) surface, and they
    are necessary to complete the reaction cycle by connecting the reactant and the
    product. Allowing any action order and the absence or repetition of the action,
    the DRL model is trying to figure out from scratch the most plausible reaction
    pathway and configuration via Markov decision processes. We do not consider the
    H-assisted N2 activation in the 17 actions since migration of H to N2 has a much
    higher free energy barrier (1.74 eV) than other plausible N2 activation steps.
    Figure S7 of the SI shows the reaction barrier calculation of H migration to surface
    N2 (α state) to form NH2.


    **Deep Reinforcement Learning Model.** Central to the DRL model is a policy $\pi_{\theta_p(a_t|s_t)}$
    represented by a deep neural network with parameters $\theta_p$ that analyzes
    the current state and takes actions. The vector of current state s_t represents
    one plausible configuration along the reaction path and the action a_t changes
    the current configuration to the next one. The policy $\pi$ is the strategy of
    changing the state s. The model parameters $\theta_p$ are initialized randomly
    with no prior information about the environment or any domain knowledge


    of the reaction. The policy is then trained by a reinforcement learning strategy
    designed to maximize the expected value of the sum of discounted future rewards
    and conditioned on the success of reaching the final state.


    Our reinforcement learning strategy is based on a policy gradient algorithm similar
    to actor–critic. We use proximal policy gradients and the Adam optimizer to compute
    policy gradients. A value network (critic) $V_{\theta_v}(s_t)$ is trained to predict
    the expected return and used to update the policy network (actor), which provides
    the probability distribution of actions in the current state. The architecture
    of our value and policy networks consists of fully connected deep neural networks
    (DNNs). The two deep neural networks share the common internal stack of hidden
    layers but differ by the final output layers. The efficiency of the DRL framework
    is similar to kMC calculations on the Fe(111) surface.


    The key link between the DFT and the DRL in our framework is the reward system
    associated with actions, and it is derived from DFT calculations from the first
    principles. We assign a reward r associated with each action that is dependent
    on the states involved before and after the action; that is, the same action could
    end up with a very different reward depending on the state it acts on. In particular,
    r = e^(-ΔE) is employed for each action where ΔE (in eV) is the DFT-derived free
    energy barrier connecting different states under the reaction condition of T =
    673 K and P(H2, N2, NH3) = (15, 5, 1) atm. The free energies are calculated from
    a high N coverage surface, and the simulation details on the free energy are in
    the Experimental Section. The value of ΔE varies according to the site occupancy
    on the surface represented by the state; for example, the different occupancy
    configurations surrounding the reaction sites can significantly change the free
    energy barriers incurred by the same action. Additionally, a negative reward is
    given if obvious obstacles prevent the action from happening. Those obstacles
    and constraints are similar to the geometrical boundary mask in a video game environment.
    For example, adding an extra H to a site that has already been occupied by an
    H species is not possible and, in this case, the action will not effect to change
    the state and will get an immediate negative reward. This is a complex network
    environment consisting of 23 positions with values ranging from 0 to 6, and there
    are a total of 17 actions defined in the competition to explore the most plausible
    path linking the initial state and the final state. The detailed reward values
    are displayed in Table S1 of the SI, and more detailed explanations for the reward
    definition can be found in the SI.


