  mdcn: '

    描述了Fe-bcc(111)和Fe-bcc(211)重构表面上的哈伯-博世反应。7,56 初态与末态之间的过渡态搜索首先采用攀爬NEB方法57进行，然后采用二聚体方法58进行精修。过渡态搜索的详细信息可参见先前的研究。7


    ## 相关内容


    ### 支持信息


    支持信息可免费获取：https://pubs.acs.org/doi/10.1021/jacs.1c08794。


    图S1–S9，表S1–S3，来自DFT模拟的奖励定义，通过DRL获得的HB反应路径的DFT导出自由能，以及用于确定DRL奖励的从DFT计算的各种构型的自由能；来自该工作的数据集和代码可根据合理要求从通信作者处获取（PDF）


    使用PBE-D3 xc泛函在673 K和1 atm下的重要表面构型的电子能和自由能，以及气相分子的热力学数据（XLSX）


