    ## 从第一性原理出发利用深度强化学习发现催化反应网络


    蓝田 和 安奇*


    ### 摘要


    确定反应路径（阐明催化剂工作机制的核心）受到反应高复杂性和数据极度匮乏的严重阻碍。在这里，我们开发了一种新的人工智能框架，将深度强化学习（DRL）技术与密度泛函理论模拟相结合，从零知识出发自动化地对复杂催化反应网络进行定量搜索和评估。我们的框架将化学反应的从第一性原理导出的自由能量景观定量地转换为DRL环境及相应的动作。通过与这个动态环境交互，我们的模型从零开始自行演化为一个完整的反应路径。我们利用最活跃的Fe(111)表面上的Haber–Bosch过程来演示这个框架。我们的框架发现的新路径比基于领域知识的先前研究具有更低的总体自由能垒，展示了其在发现复杂反应路径方面的卓越能力。展望未来，我们预期该框架将为探索许多催化反应的基本反应机制打开大门。


    ![](img/274ee2e61503c4940bd82472e18bdf4e_0_0.png)


    ### 引言


    为应对新兴的能源危机和环境问题，发现并优化能够高效将原材料转化为有价值化学品和化合物的新型催化剂至关重要，例如丙烯的氨氧化制丙烯腈、甲醇制汽油，以及从氮气合成氨的Haber–Bosch工艺。工业催化剂开发的传统进展是渐进式的。为了在高效催化剂优化方面取得快速进展，理解反应机制并应用基于反应机制的合理设计方法至关重要。大量的实验和理论工作已致力于识别许多工业上重要的催化反应中的反应机制、基本步骤和限速步骤。然而，催化反应可能涉及许多中间体和分支路径，使得确定完整的反应网络具有挑战性。例如，Fe催化剂上的Haber–Bosch反应可能涉及约20个重要的表面构型和约10个重要的反应步骤，以及许多潜在的掺杂剂分支反应。因此，开发能够有效确定复杂反应中反应网络的新技术是迫切需要的。最近，人工智能（AI）在许多研究领域取得了巨大成功。特别是，监督学习已被广泛应用于计算异相催化，并推进了对材料性质与催化性能（例如催化剂的活性、选择性和稳定性）之间关系的理解。例如，Abdelfatah
    等人利用各种机器学习模型，结合常规描述符（例如产物或反应物能量）和其他描述符（例如表面物种的键计数和金属描述符），预测了金属催化剂上加氢反应的过渡态能量。他们得出结论，添加键计数和金属描述符能提高线性和非线性模型的性能。Ulissi
    等人提出利用机器学习导出的代理模型来确定催化剂的反应网络，该模型能有效预测大多数重要反应步骤的能量学。最近的一篇综述总结了将机器学习技术应用于异相催化的最新进展。然而，AI在催化反应中的应用受到描述催化反应网络的数据极度匮乏的严重限制，而大量数据通常是构建可靠AI模型的先决条件。


    收稿日期：2021年8月19日；发表日期：2021年10月4日


