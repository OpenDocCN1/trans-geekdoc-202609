    的小批量上使用了随机梯度下降。


    ### Rollout Sampling


    对于每个后续步骤 \(t\)，rollout 数据使用蒙特卡罗（MC）方法收集。基于当前状态 \(s_t\)，actor 从策略网络 \(\pi_{\theta_p}\)
    生成的分布中决定一个动作 \(a_t\)。通过执行该动作，模型转移到下一个状态 \(s_{t+1}\) 并获得相应的奖励。当达到最终状态或 rollout
    的最大步骤 K 时，rollout 结束。在我们的实验中，最大步骤 K 设置为 500。我们没有使用 TD(\(\lambda\))\(^{45}\) 等近似方法来近似观测回报
    \(G_t\)，而是使用蒙特卡罗方法沿着 rollout 轨迹忠实地收集回报。在 rollout 结束时，收集由元组 \((s_t, a_t, G_t)\)
    列表组成的训练样本。


    对于每次策略更新（训练 episode），模型被配置为调查许多独立的 on-policy MC rollouts，这些 rollouts 并行收集，最后同步以更新策略。在终止步骤
    K 之前未达到最终状态的 rollouts 将具有某种用于无放回随机选择的下采样率。rollouts 的数量在运行时动态确定，并且与当前策略更新中这些 rollouts
    的平均长度成反比。我们发现，我们的采样方法在防止模型收敛到由局部优化轨迹偏差的次优策略方面起着重要作用。在我们的实验中，我们选择 0.3 作为下采样率，300
    的大小是所需的最小数据点数量。这大约相当于接近最终收敛时的 10 个 rollouts。


    ### Curriculum Learning


    我们为模型引入了两阶段学习课程。对于第一个课程，为了避免因最初引入执行不可能动作的惩罚而产生不稳定的学习动态，我们在环境构建中施加一个微小的负奖励 -0.01。这种小惩罚减轻了累积的负奖励，否则这些负奖励很容易阻止模型在复杂网络上进行早期探索，同时仍然为模型利用有利动作保持相当合理的意义。在第二个课程中，负奖励增加到
    -0.1 以构建更现实的环境，关于奖励的详细信息可以在表 S1 中找到。在我们的实验中，我们为第一个课程运行 100 000 个训练 episode，为第二个课程运行
    50 000 个。


    ### Entropy Regularization


    在策略梯度目标中，我们将策略熵（PS）作为额外项添加到公式 2 中，定义为


    \(PS = -\beta \sum_i \pi_{\theta_p}(a_i^i|s_i) \log(\pi_{\theta_p}(a_i^i|s_i))\)
    (3)


    这里上标 \(i\) 表示动作索引，\(\beta\) 是熵正则化系数。使用熵项鼓励模型在当前策略下对动作空间中概率较小的动作进行更多探索。我们发现，熵正则化对于处理具有大动作空间的复杂网络是必要的。对于第一个课程，我们将熵正则化系数配置为
    0.1，而在第二个课程中，该系数降低到 0.05，同时模型变得更加稳定。


    ### DRL Model Convergence


    我们的 DRL 模型的初始参数在没有任何先验信息的情况下给出。但我们的模型有效地收敛到稳定且最优的策略，如 SI 中的图 S8 所示。这是由于以下原因。首先，我们通过
    Xavier 初始化方法随机初始化参数，该方法旨在保持所有层中梯度的规模大致相同，并显著有助于 DNN 的稳定性和收敛性。\(^{46}\) 其次，我们应用了
    A2C 方法，它是 A3C 的同步版本。同步梯度更新使训练更加紧凑，并使收敛速度比 Vanilla 策略梯度快得多。\(^{37}\) 第三，该框架与 DFT
    模拟相结合，使用详细的自由能景观来构建动作上的准确奖励函数。最后但同样重要的是，课程学习有效地帮助了我们模型的收敛。


    ### DFT Simulations


    所有 DFT 模拟都使用 VASP 软件和电子波函数的平面波基集进行。\(^{47-50}\) 在所有计算中，平面波展开的能量截止为 500 eV。我们使用
    Perdew–Burke–Ernzerhof 交换相关泛函\(^{51,52}\) 处理电子相互作用，并使用 D3 修正处理范德华相互作用。\(^{53}\)
    采用 Methfessel–Paxton 方案来处理电子部分占据，电子展宽的宽度为 0.2 eV。所有计算中均允许自旋极化，以准确预测 Fe 原子的磁矩。自洽场的能量收敛度和离子步的力收敛度分别为
    \(10^{-6}\) eV 和 \(10^{-3}\) eV/Å。第一布里渊区使用 \(\Gamma\)-中心网格方法进行采样，板层计算中使用 \(4 \times
    4 \times 1\) K-points。模拟设置与之前的研究一致，详细信息可以在之前的工作中找到。\(^{7,8}\)


    Fe-bcc(111) 板模型在 (111) 平面上包含一个 (\(2 \times 2\)) 单胞，垂直于平面有六层。底部三层固定，顶部三层在几何优化中允许弛豫。在板模型中添加了
    15 Å 的真空层，以尽量减少周期镜像之间的相互作用。为检查板模型的可能尺寸效应，我们将六层板增加到九层，并在九层模型上沿自由能图（图 4）计算几个重要状态的自由能。在几何优化中，九层板的底部三层固定。为研究催化表面的效应，我们将
    (\(2 \times 2\)) 六层板扩展到 (\(4 \times 2\)) 板，并在扩大模型上计算这些重要状态的自由能。假设三个板模型的自由能修正相同，我们获得重要状态的自由能，并将其列在
    SI 中的表 S3 中。所有三个板模型的重要状态自由能非常吻合，表明使用六层 (\(2 \times 2\)) 板模型的 DFT 模拟是稳健的。


    我们通过从谐波近似计算声子模式来获取有限温度下的自由能。采用有限位移法获取声子模式，\(^{54,55}\) 然后用于计算作为温度函数的振动熵。气相（N\(_2\)、H\(_2\)
    和 NH\(_3\)）的自由能取自使用相同计算参数的先前工作。\(^{7,8}\) 该计算设置已被证明能够准确

