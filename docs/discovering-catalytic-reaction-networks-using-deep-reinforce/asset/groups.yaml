    沿[111]方向的顶视图。(c) 沿[110]方向的侧视图。(d) 使用23维向量定义状态。(e) Fe-bcc(111)表面上吸附物的定义。表面上的吸附物种由(e)中显示的数字1至6表示。它们仅出现在(d)中位点1至20的状态向量中。状态向量位点21、22和23分别是气相中N2、H2和NH3的数量，应与表面位点（1–20）区分开来。N和H原子分别由蓝色和青色球体表示。顶层、亚表层、深层以及第4–6层的Fe原子分别由浅蓝色、橙色、紫色和青铜色球体表示。


    利用关于不完全已知马尔可夫决策过程最优控制的思想，24 强化学习利用有限数据训练一个学习代理，使其随时间与环境交互以实现目标。自AlphaGo程序击败职业围棋世界冠军以来，25
    该技术已被扩展以解决视频游戏、26 社会科学、27 以及最近化学中一些半定量任务的问题。28,29 然而，定义适合强化学习表示催化反应的定量化学环境在科学上要复杂得多，且鲜有研究。此外，代理与环境之间的动态交互需要大量且深入的信息，这些信息无法直接从实验中获得。


    ### 结果与讨论


    **环境定义。** 我们在研究中选择了Fe-bcc(111)作为催化表面，因为它是NH3合成中最活跃的表面。34,35 关于Fe-bcc(111)表面上NH3合成的最近DFT研究表明了一条合理的反应路径，包含24个重要的表面构型和12个过渡态，在673
    K和20 atm压力（1.5 Torr NH3压力）下，每2×2位点的转化频率（TOF）为17.7 NH3/s。随着反应达到稳态且NH3压力增加到约1 atm，计算的TOF降低到4.6
    NH3/s。8 虽然TOF与单晶实验值9.7 NH3/s一致，7 但这些研究大多依赖于穷举搜索和领域专家知识，而许多合理的中间状态和分支反应路径无法被考虑。Haber–Bosch反应的巨大复杂性使其成为挑战我们DRL模型的理想对象。


    在这里，我们开发了一种新的深度强化学习（DRL）框架，以在没有催化反应任何先验知识的情况下，给定初始反应物和目标产物来确定复杂的反应网络。我们的框架不受数据和人类知识限制的约束，而是从零开始自行演化为一个完整的反应路径。具体地，我们将化学反应路径的演化映射为发生在由密度泛函理论（DFT）模拟定量描述的精巧环境中的马尔可夫决策过程。以Fe催化剂上的氨（NH3）合成作为模型系统，我们证明DRL通过采用适当的环境和训练算法，能高效构建复杂的反应路径。我们的代理准确预测了一个比先前研究更合理、自由能垒更低的反应网络。7,8


    我们选择Haber–Bosch工艺作为模型系统，因为NH3是地球氮循环中的主要中间体。30 仅Haber–Bosch工艺就占全球总能源使用量的2%以上，并每年生产1.6亿吨NH3。31,52
    如果由于氨的高能量密度和原材料丰富等吸引人特点，氨被用作能量载体来取代化石燃料，这种产量规模可能会大幅增加。35 使用金属催化剂来加速反应，但需要高温高压的大气氮气（N2）和氢气（H2）（从天然气来源提取）。上个世纪大量研究旨在提高Haber–Bosch工艺的性能，但最近的进展缓慢。为了在较温和的条件下使该工艺更高效——这将大幅降低生产成本并使更小、更广泛分散的工厂成为可能——我们必须优化异相催化剂，这需要理解Haber–Bosch工艺的反应机制。


