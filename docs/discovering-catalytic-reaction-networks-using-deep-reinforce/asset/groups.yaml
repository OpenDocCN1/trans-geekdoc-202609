    × 2) Fe-bcc(111)表面模型，每个吸附位置在表面上有四个位点。


    我们将化学反应路径的演化建模为马尔可夫决策过程，由状态空间S、动作空间A、概率转移P(s_t+1|a_t, s_t)和奖励函数r定义，奖励函数通常定义在空间S
    × A中。为定义环境状态，我们在步骤t引入编码状态向量s_t，将总共20个表面位点投影到一个向量上。该向量还考虑了哈伯-博世反应中涉及的N2、H2和NH3气体物种。图1(d)显示了状态向量的前20个条目，用于表示20个表面位点；每个条目的值表示图1(e)中显示的吸附剂。吸附剂H、N、NH、NH2、NH3和N2分别由整数1–6编码，空位由数字0表示。向量的最后三个条目用于记录反应路径沿线的气体物种数量（N2↔21，H2↔22，NH3↔23）。反应从初始状态s0开始，即4N覆盖表面加上一个N2和三个H2气体分子（支持信息SI中的图S2）。模型表面与以下事实一致：在哈伯-博世反应条件下，Fe表面具有高N原子覆盖率。最终状态sf定义为气相中有两个NH3分子的4N构型（支持信息SI中的图S2），表示完全反应N2
    + 3H2 ⇌ 2NH3。


    连接s0和sf的动作定义为四个主要类别：(1) 表面上的H2吸附/脱附；(2) 表面上的N2吸附、迁移和解离；(3) 表面氢迁移以氢化N、NH或NH2物种（例如H
    + NH ⇌ NH2）；以及(4) 表面上的NH3脱附。基于反应的特定表面位点，动作进一步细化以形成环境中使用的动作空间。所有17个动作的定义显示在支持信息SI的图S3–S6中。定义的17个动作代表Fe-bcc(111)表面上的基本反应步骤，它们对于通过连接反应物和产物来完成反应循环是必要的。允许任何动作顺序以及动作的缺失或重复，DRL模型试图通过马尔可夫决策过程从零开始找出最合理的反应路径和构型。我们在17个动作中不考虑H辅助的N2活化，因为H迁移到N2的自由能垒（1.74
    eV）远高于其他合理的N2活化步骤。支持信息SI的图S7显示了H迁移到表面N2（α态）以形成NH2的反应垒计算。


    ## 深度强化学习模型


    DRL模型的核心是一个由深度神经网络表示的策略$\pi_{\theta_p(a_t|s_t)}$，其参数为$\theta_p$，用于分析当前状态并采取行动。当前状态s_t的向量代表反应路径沿线的一种合理构型，动作a_t将当前构型改变为下一个构型。策略$\pi$是改变状态s的策略。模型参数$\theta_p$随机初始化，没有关于环境的任何先验信息或反应的任何领域知识。然后，策略由一种强化学习策略进行训练，旨在最大化折扣未来奖励之和的期望值，并以成功到达最终状态为条件。


    我们的强化学习策略基于类似于演员-评论家的策略梯度算法。我们使用近端策略梯度和Adam优化器来计算策略梯度。一个值网络（评论家）$V_{\theta_v}(s_t)$被训练以预测预期回报，并用于更新策略网络（演员），后者提供当前状态下动作的概率分布。我们的值网络和策略网络的架构由完全连接的深度神经网络（DNN）组成。两个深度神经网络共享共同的内部隐藏层堆栈，但最终输出层不同。DRL框架的效率与Fe(111)表面上的kMC计算相似。


    我们框架中DFT与DRL之间的关键联系是与动作相关的奖励系统，它源自第一性原理的DFT计算。我们为每个动作分配一个奖励r，该奖励取决于动作前后涉及的状态；也就是说，同一动作可能根据其作用的状态而获得非常不同的奖励。特别是，对每个动作采用r
