    top three layers, designated as top, sublayer, and deep layer, are all involved
    in binding absorbents and surface reactions. To describe the surface reactions
    occurring at various sites, we define a total of 20 surface sites numbered 1–20,
    including four top sites, four sublayer sites, four bridge sites, four top–sublayer
    sites, and four top–sublayer–deep layer sites, as shown in Figure S1 of the Supporting
    Information (SI). Each adsorption position has four sites on the surface due to
    the application of a (2 × 2) Fe-bcc(111) surface model.


    We model the evolution of the chemical reaction path as a Markov decision process
    defined by a state space S, an action space A, a probability transition P(s_t+1|a_t,
    s_t), and a reward function r that is generally defined in the space S × A. To
    define the environment state, we introduce an encoded state vector s_t at step
    t that projects the total number of 20 surface sites onto a vector. The vector
