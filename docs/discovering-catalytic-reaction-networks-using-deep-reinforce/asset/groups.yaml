    2N.NH2.H 为基态时，N2 在 2N 构型上的吸附具有最高能垒 1.68 eV。8 遵循 DRL 模型并以 2N.NH2.H 为基态，我们计算了 N2
    在 2N.H 状态上的吸附，并发现 2N.H 状态中的额外 H 将 N2 吸附能垒从 1.68 降低至 1.24 eV。N2 吸附在顶位（γ 状态）后，它移动到亚表面位点（δ
    状态）。H 的存在也将此能垒从 1.37 降低至 0.97 eV。当 N2 从 δ 状态倾斜到 α 状态时，在 H 存在下自由能垒变为 1.16 eV，而无
    H 时为 1.37 eV。随后需要脱附 H，因为它阻碍了 N2 从 α 状态到 α'' 状态的旋转。最后，N2 从 α'' 状态解离形成 4N 构型。N2
    吸附、迁移和解离的详细反应路径在 SI 中的图 S9 中显示。沿着 DRL 建模的这条新反应路径，限速步是构型 2N.NH2.2H 上的氢化步骤，能垒为 1.52
    eV，而先前研究为 1.68 eV。8 因此，与先前研究相比，DRL 预测了一条更合理的反应路径。我们根据过渡态理论估计了 673 K 下的速率为 k =
    (kBT/h)exp[-1.52/kBT] = 58.1 s-1，这比先前模型 k = (kBT/h)exp[-1.68/kBT] = 3.7 s-1 高出约
    16 倍。这里我们预测的反应速率高于实验研究可能会阻塞反应位点。31,32 使用相同的 DFT 框架，DRL 预测的反应路径能垒低于领域知识，表明这条新反应路径比先前的更合理。


    许多关于 Haber–Bosch 工艺反应机制的研究表明，限速步骤可能涉及（1）二氮的解离吸附；40（2）催化剂表面上吸附物种的反应；41 和（3）氨的脱附。42
    基于领域知识的先前反应网络表明，N2 吸附/脱附具有最高反应能垒，并应占主导地位，成为 Fe(111) 表面上合理的限速步骤。7 相比之下，从 DRL 推导的新反应路径表明，NH2
    的氢化具有最高反应能垒，是 Fe(111) 表面上最重要的限速步骤。第二重要的步骤是 NH3 的脱附，第三重要的步骤是来自新反应机制的 N2 吸附/脱附。为验证理论预测，未来实验可能侧重于使用原位/就位光谱技术表征重要中间状态的吸附物（例如，NH3、NH2
    和 N2）。特别是，预计 NH2 特征将在 Fe(111) 表面的光谱研究中占主导地位，因为 NH2 氢化步骤具有最高反应能垒。


    DRL 框架预测的反应路径为 Fe(111) 表面上 Haber–Bosch 工艺的未来催化剂设计提供了有洞察力的方向。例如，需要降低 Fe-bcc(111)
    表面上 NH2 物种的氢化能垒，以实现优于纯 Fe 系统的性能。这可以通过 Fe(111) 表面上的掺杂策略来实现。8,17


    ## 与其他确定反应路径的方法相比的 DRL 比较


    DRL 方法是通过 AI 智能体与由单个动作定义的环境进行交互来进行训练。每个动作的奖励由 DFT 计算和 nudged elastic band (NEB)
    方法确定。在 DRL 中，我们仅定义初始反应物和最终产物，而不定义动作序列。此外，通过马尔可夫决策过程，动作可以重复多次，从而导致反应路径上具有无限数量的构型。训练后，AI
    智能体将通过连接这些单个动作，自动从反应物构建到产物的反应网络。DRL 的准确性取决于从 DFT 和 NEB 方法计算得到的能量。


    应当指出，DRL 方法与人工力诱导反应 (AFIR) 方法根本不同，在 AFIR 方法中，给定的反应物分子受恒定力相互挤压，从而可以识别反应路径和过渡态。43,44
    AFIR 方法是通过仅给出多个反应物种而无需了解反应机制来识别反应路径。与 NEB 方法类似，AFIR 方法在确定单个反应步骤的反应路径方面是有效的。相比之下，DRL
    是从许多合理的反应步骤构建完整的反应网络。每个反应步骤的初始状态、最终状态和反应能垒均从 DFT 和 NEB 计算得到。然后，每个反应步骤的信息用于确定 DRL
    建模的环境。


    ## 结论


    总之，我们开发了一个结合 DRL 模型和 DFT 模拟的 AI 框架，以从零知识出发考察复杂反应中的催化反应网络。通过在 DRL 模型中应用多种新型采样和学习技术，并基于
    DFT 模拟定量构建 DRL 环境，我们的模型有效地确定了最活跃的 Fe-bcc(111) 表面上 Haber–Bosch 工艺的最合理反应路径。该反应路径包含一条与基于领域知识的先前研究7,8相比具有更低自由能垒的新路径段，表明其概率更高。该
    AI 框架的成功将为研究许多复杂的催化化学反应（如 Haber–Bosch 和 CO2 还原）开辟新的窗口。


