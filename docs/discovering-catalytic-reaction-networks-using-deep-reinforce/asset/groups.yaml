    1.68 to 1.24 eV. After the N2 is adsorbed on the top site (γ state), it moves
    to the sublayer site (δ state). The existence of H also lowers this barrier from
    1.37 to 0.97 eV. As the N2 tilts from δ state to α state, the free energy barrier
    becomes 1.16 eV in the presence of H, compared to 1.37 eV without H. The H then
    needs to be desorbed, as it blocks the rotation of N2 from the α state to the
    α'' state. Finally, the N2 is dissociated from the α'' state to form the 4N configuration.
    The detailed reaction path of N2 adsorption, migration, and dissociation is displayed
    in Figure S9 of the SI. Along this new reaction path from DRL modeling, the rate-determining
    step is the hydrogenation step on configuration 2N.NH2.2H with a barrier of 1.52
    eV, in contrast with 1.68 eV from the previous study.8 Therefore, DRL predicts
    a more plausible reaction path compared to the previous study. We estimated the
    rate at 673 K from transition state theory as k = (kBT/h)exp[-1.52/kBT] = 58.1
    s-1, which is ~16-fold higher than the previous model of k = (kBT/h)exp[-1.68/kBT]
    = 3.7 s-1. Here we predicted a higher reaction rate than experimental studies
    may block the reaction sites.31,32 Using the same DFT framework, the DRL predicts
    a reaction path with lower barrier than the domain knowledge, suggesting that
    this new reaction path is more plausible than the previous one.


    Many studies on the reaction mechanism of the Haber–Bosch process suggested that
    rate-determining steps may involve (1) the dissociative adsorption of dinitrogen;40
    (2) the reaction on the catalyst surface of adsorbed species;41 and (3) the desorption
    of ammonia.42 The previous reaction network based on domain knowledge suggests
    that the N2 adsorption/desorption has the highest reaction barrier and should
    be dominant in the plausible rate-determining steps for the Fe(111) surface.7
    In contrast, the new reaction path derived from DRL suggests that hydrogenation
    of NH2 has the highest reaction barrier and is the most important rate-determining
    step for the Fe(111) surface. The second most important step is the desorption
    of NH3, and the third most important step is the N2 adsorption/desorption from
    the new reaction mechanism. To validate the theoretical prediction, future experiments
    may focus on characterizing the adsorbents (e.g., NH3, NH2, and N2) of the important
    intermediate states using operando/in situ spectroscopy techniques. Particularly,
    the NH2 signature is expected to be dominant in the spectroscopy


    study on the Fe(111) surface since the step of NH2 hydrogenation has the highest
    reaction barrier.


    The reaction path predicted by the DRL framework gives insightful directions on
    the future catalyst design for the Haber–Bosch process on the Fe(111) surface.
    For example, one needs to decrease the hydrogenation barrier of NH2 species on
    the Fe-bcc (111) surface to achieve a better performance than the pure Fe system.
    This may be achieved through the doping strategy on the Fe(111) surface.8,17


    # Comparison of DRL with Other Methods Determining the Reaction Path.


    The DRL approach is to train an AI agent through its interaction with the environments
    defined by the individual actions. The reward of each action is determined from
    the DFT calculations and nudged elastic band (NEB) methods. In the DRL, we only
    define the initial reactant and final products and do not define the sequence
    of actions. In addition, the action can be repeated multiple times via Markov
    decision processes, leading to an unlimited number of configurations along the
    reaction path. After training, the AI agent will construct the reaction network
    automatically from reactant to product by connecting these individual actions.
    The accuracy of DRL depends on the energetics calculated from DFT and NEB methods.


    It should be pointed out that the DRL approach is fundamentally different from
    the artificial force induced reaction (AFIR) method, in which the given reactant
    molecules are pressed to each other by a constant force so that the reaction path
    and transition state can be identified.43,44 The AFIR approach is to identify
    the reaction path by only giving the multiple reactant species without knowing
    the reaction mechanisms. Similar to the NEB approach, the AFIR approach is effective
    in determining the reaction path in one reaction step. In contrast, the DRL is
    to construct the complete reaction network from many plausible reaction steps.
    The initial state, final state, and reaction barriers for each reaction step are
    computed from both DFT and NEB. Then the information on each reaction step is
    used to determine the environment for the DRL modeling.


    # CONCLUSION


    In summary, we developed an AI framework combining the DRL model and DFT simulations
    to examine catalytic reaction networks in complex reactions from zero knowledge.
    Applying multiple novel sampling and learning techniques in the DRL model and
    the quantitative construction of the DRL environment from DFT simulations, our
    model effectively determines the most plausible reaction path of the Haber–Bosch
    process on the most active Fe-bcc(111) surface. This reaction path consists of
    a new segment path with a lower free energy barrier compared to previous studies7,8
    based on domain knowledge, suggesting a higher probability. The success of this
    AI framework will open a new window to studying many complicated catalytic chemical
    reactions, such as Haber–Bosch and CO2 reduction.


