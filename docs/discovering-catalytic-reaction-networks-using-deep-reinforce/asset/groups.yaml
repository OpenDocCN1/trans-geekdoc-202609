    ## Discovering Catalytic Reaction Networks Using Deep Reinforcement Learning from
    First-Principles


    Tian Lan and Qi An*


    ### ABSTRACT


    Determining the reaction pathways, which is central to illustrating the working
    mechanisms of a catalyst, is severely hindered by the high complexity of the reaction
    and the extreme scarcity of the data. Here, we develop a novel artificial intelligence
    framework integrating deep reinforcement learning (DRL) techniques with density
    functional theory simulations to automate the quantitative search and evaluation
    on the complex catalytic reaction networks from zero knowledge. Our framework
    quantitatively transforms the first-principles-derived free energy landscape of
    the chemical reactions to a DRL environment and the corresponding actions. By
    interacting with this dynamic environment, our model evolves by itself from scratch
    to a complete reaction path. We demonstrate this framework using the Haber-Bosch
    process on the most active Fe(111) surface. The new path found by our framework
    has a lower overall free energy barrier than the previous study based on domain
    knowledge, demonstrating its outstanding capability in discovering complicated
    reaction paths. Looking forward, we anticipate that this framework will open the
    door to exploring the fundamental reaction mechanisms of many catalytic reactions.


    ![](img/274ee2e61503c4940bd82472e18bdf4e_0_0.png)


    ### INTRODUCTION


    To address the emerging energy crisis and environmental issues, it is essential
    to discover and optimize novel catalysts that convert raw materials efficiently
    into valuable chemicals and compounds, such as the ammoxidation of propene into
    acrylonitrile, conversion of methanol to gasoline, and the Haber–Bosch synthesis
    of ammonia from nitrogen gas. Traditional advances in developing industrial catalysts
    have been incremental. In order to make rapid progress on the optimization of
    highly efficient catalysts, it is essential to understand reaction mechanism and
    apply reaction mechanism-based rational design approaches. Tremendous experimental
    and theoretical efforts have been devoted to identifying reaction mechanisms,
    elementary steps, and rate-determining steps in many industrially important catalytic
    reactions. However, a catalytic reaction may involve many intermediates and branch
    paths, making it challenging to determine the complete reaction network. For example,
    the Haber–Bosch reaction on an Fe catalyst may involve ~20 important surface configurations
    and ~10 important reaction steps, as well as many potential branch reactions with
    dopants. Therefore, it is demanding to develop novel techniques that can effectively
    determine the reaction network in complex reactions. Recently, artificial intelligence
    (AI) has achieved great success in many research areas. Particularly, supervised
    learning has been extensively applied in computational heterogeneous catalysis
    and advances the understanding of the relationships between materials properties
    and catalytic performance (e.g., activity, selectivity, and stability of catalysts).
    For example, Abdelfatah et al. predicted the transition-state energy of hydrogenation
    reactions on metal catalysts using various machine learning models with conventional
    descriptors (e.g., product or reactant energy) and other descriptors (e.g., bond
    counts of surface species and metal descriptors). They concluded that adding bond
    counts and metal descriptors improves the performance of both linear and nonlinear
    models. Ulissi et al. proposed to determine the reaction network of a catalyst
    using the machine learning derived surrogate model that can effectively predict
    the energetics of most important reaction steps. The recent progress on applying
    machine learning techniques to heterogeneous catalysis was summarized in a recent
    review. However, the application of AI to catalytic reactions has been severely
    limited by the extreme scarcity of data describing the catalytic reaction networks,
    while a tremendous amount of data is, in general, a prerequisite for building
    a reliable AI model.


