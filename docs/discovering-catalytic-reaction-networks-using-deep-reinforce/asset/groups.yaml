    Using ideas from the optimal control of the incompletely known Markov decision
    process,24 reinforcement learning utilizes a limited amount of data to train a
    learning agent to interact over time with its environment to achieve a goal. Since
    the AlphaGo program defeated professional Go world champions,25 this technique
    has been extended to solve problems in video games,26 social science,27 and, most
    recently, some semiquantitative tasks in chemistry.28,29 However, defining a quantitative
    chemical environment suitable for the reinforcement learning representation of
    catalytic reactions is much more complicated in science and has been barely explored.
    Moreover, the dynamic interaction between the agent and the environment requires
    extensive and in-depth information that cannot be obtained directly from the experiment.


    ### RESULTS AND DISCUSSION


    **Environment Definition.** We selected Fe-bcc(111) as the catalytic surface in
    our study because it is the most activated surface for NH3 synthesis.34,35 Recent
    DFT studies on NH3 synthesis over the Fe-bcc(111) surface suggested a plausible
    reaction path consisting of 24 important surface configurations and 12 transition
    states with a turnover frequency (TOF) of 17.7 NH3/s per 2 × 2 sites at 673 K
    and 20 atm pressure (1.5 Torr NH3 pressure). As the reaction reaches a steady
    state with NH3 pressure increasing to ∼1 atm, the calculated TOF decreases to
    4.6 NH3/s.8 Although the TOF is consistent with the single-crystal experimental
    value of 9.7 NH3/s,7 these studies mostly relied on the exhaustive search and
    domain expert knowledge, whereas many plausible intermediate states and branch
    reaction paths are not able to be considered. The great complexity of the Haber–Bosch
    reaction makes it an ideal subject to challenge our DRL model.


    Here, we developed a novel deep reinforcement learning (DRL) framework to determine
    a complex reaction network given an initial reactant and a target product from
    zero prior knowledge of catalytic reactions. Our framework is not constrained
    by the limits of data and human knowledge, but evolves by itself from scratch
    into a complete reaction path. Specifically, we map the evolution of the chemical
    reaction path into a Markov decision process taking place in a delicate environment
    depicted quantitatively by density functional theory (DFT) simulations. Using
    ammonia (NH3) synthesis on an Fe catalyst as a model system, we demonstrate that
    DRL efficiently constructs the complex reaction path by adopting the proper environment
    and training algorithms. Our agent accurately predicts a reaction network that
    is more plausible with lower free energy barriers than previous studies.7,8


    We selected the Haber–Bosch process as the model system because NH3 is the main
    intermediate in the nitrogen cycle on Earth.30 The Haber–Bosch process alone is
