    the performance of the Haber–Bosch process, but recent progress has been slow.
    To make the process more efficient under milder conditions—which would dramatically
    decrease production costs and enable smaller, more widely dispersed plants—we
    must optimize heterogeneous catalysts, which requires understanding the reaction
    mechanism of the Haber–Bosch process.


