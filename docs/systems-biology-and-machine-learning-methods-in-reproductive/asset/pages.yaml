    # 9.5 SINE DIE FOR GENETIC TESTING?


    There are many different kinds of genetic tests (Figure 9.4). There is no single
    genetic test that can detect all genetic conditions. The approach to genetic testing
    is individualized based on medical and family history and conditions being tested
    for. For instance, single-gene tests focus on identifying variations within a
    specific gene when symptoms of a particular condition or syndrome are present,
    such as Duchenne muscular dystrophy (DMD) or SCD. They are particularly useful
    in cases where a known genetic mutation runs in a family. Conversely, panel genetic
    testing examines multiple genes in one comprehensive test. These tests are typically
    categorized based on various medical concerns, like low muscle tone, short stature,
    or epilepsy. Also, panel genetic tests can target genes associated with increased
    susceptibility to specific types of cancer, such as breast or colorectal cancer.
    This approach offers a broader scope for identifying potential genetic factors
    contributing to a range of health conditions. There is an inherent need for large-scale
    genetic or genomic testing: There are two different kinds of large-scale genetic
    tests. Exome sequencing looks at all the genes in the DNA (whole exome) or just
    the genes that are related to medical conditions (clinical exome). Large-scale
