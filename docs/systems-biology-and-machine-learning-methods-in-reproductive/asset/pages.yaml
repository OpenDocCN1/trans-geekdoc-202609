- pgno: 57
  md: 'alterations do not change the genetic sequence but play a crucial role in determining
    the final characteristics and are necessary for various stages of development
    (Martin-Sanchez et al. 2014). Epigenomics in reproductive health can be used to
    explore heritable changes in gene expression, offering insights into how environmental
    variables affect fertility, pregnancy outcomes, and the well-being of children.
    Epigenomics reveals complex molecular pathways underlying reproductive problems
    by studying DNA methylation, histone changes, and noncoding RNA regulation, thus
    providing potential opportunities for targeted therapies and preventive measures.


    # 3.3.1.4 Genome-Wide Association Studies


    Genome-wide association studies, also known as GWAS, seek to identify associations
    among phenotypes and genotypes by analyzing differences in the frequency of genetic
    variants across individuals with similar ancestry but differing phenotypic traits.
    GWAS may include copy-number variants (CNVs) or SNPs in the human genome. GWAS
    studies often detect clusters of linked SNPs that have a statistically significant
    association with the particular trait of interest. These clusters are referred
    to as genomic risk loci (Uffelmann et al. 2021). GWAS in reproductive health may
    be used to investigate the genetic underpinnings of fertility, reproductive diseases,
    and pregnancy outcomes by examining large groups of individuals to pinpoint genetic
    variations linked to these characteristics. By conducting thorough genome-wide
    scans, GWAS identifies specific candidate genes and genetic regions that are associated
    with reproductive traits. This information is valuable for clinical diagnoses,
    risk evaluation, and individualized treatment approaches in the field of reproductive
    medicine.


    # 3.3.1.5 Microbiomics


    The human body contains microbes in several ecological niches, such as the skin
    surface, mouth cavity, esophagus, lungs, digestive system, and other regions.
    The microbiota is comprised of bacteria, viruses, fungi, archaea, and phages with
    bacteria being the most abundant in terms of species abundance. The use of 16S
    rRNA and WGS techniques has facilitated the detection and categorization of multiple
    distinct operational taxonomic units (OTUs), some of which may be cultured and
    identified, while others remain unidentified. Microbial dysbiosis is caused by
    alterations in the makeup of microbiome species or changes in the abundance of
    certain species, leading to an imbalance in the microbiome, and giving rise to
    disease states and conditions. It may also occur when some bacterial species in
    a microbiome acquire qualities that make them more virulent and pathogenic, and
    these harmful characteristics then alter the way the host organism is affected
    in its unique environment (Manos 2022).


    The markers often used to analyze microbial communities in microbiome investigations
    include 16S rRNA, 18S rRNA, and ITS rRNA. These markers allow for the characterization
    of bacterial, archaeal, and fungal diversity, respectively.


    These diverse genomics technologies may be used to address common reproductive
    diseases and disorders that impact both males and females.'
