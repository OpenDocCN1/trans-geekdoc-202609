  md: 'Surrogacy relies heavily on assisted reproductive procedures including Gamete
    Intra-Fallopian Transfer (GIFT), Intra-Cytoplasmic Sperm Injection (ICSI), and
    IVF. By external ova fertilization, these approaches improve the likelihood of
    successful implantation and subsequent pregnancy (Bayram 2023).


    Surrogacy and assisted reproduction have advanced significantly in recent years.
    They offer couples and people facing infertility or other reproductive challenges
    with other alternatives. As these procedures need the engagement of a third party
    throughout the phases of conception and gestation, many ethical, legal, and societal
    considerations are raised (Dickens and Cook 2017).


    # Ethical Issues in Surrogacy Arrangements


    Significant ethical concerns are raised by surrogacy agreements regarding reproductive
    rights, autonomy, and the welfare of all parties involved. Several crucial ethical
    concerns are elaborated upon thereafter:


    +   (a) **Autonomy and Informed Consent:** All relevant stakeholders, including
    the surrogate, intended parents, and donors, should fully understand the implications
    of the surrogacy arrangement and provide informed consent.


    +   (b) **Exploitation and Commercialization:** When financial transactions are
    involved in surrogacy arrangements, there is a potential for exploitation. Ethical
    consideration should be to ensure that financial agreements are fair, and transparent,
    and do not coerce individuals into participating.


    +   (c) **Agency and Power Dynamics:** Disparities in power between surrogates
    and intended parents may compromise the autonomy of the surrogate. Ensuring that
    the surrogate possesses decision-making autonomy and is not coerced into making
    specific choices is of the utmost importance.


    +   (d) **Rights and Well-being of the Child:** The rights and well-being of surrogate
    infants are also ethical concerns. Questions may arise about the child’s right
    to know their genetic origins and the potential impact of the surrogacy process
    on their identity.


    +   (e) **Selective Reproduction and Genetic Screening:** The ability to examine
    embryos for specific characteristics or genetic abnormalities gives rise to ethical
    concerns regarding the potential for selective reproduction, which could perpetuate
    societal prejudices or stigmatize particular genetic qualities.


    +   (f) **International Surrogacy and Legal Variability:** Ethical concerns may
    arise due to varying levels of regulation in cross-border surrogacy arrangements.
    These include inconsistent standards of care, oversight, and protection for all
    parties involved.


    +   (g) **Emotional and Psychological Well-being:** Surrogacy has the potential
    to affect the mental and emotional health of all individuals involved. Providing
    appropriate emotional support, therapy, and mental health services to surrogates,
    intended parents, and the infant is an ethical imperative.'
