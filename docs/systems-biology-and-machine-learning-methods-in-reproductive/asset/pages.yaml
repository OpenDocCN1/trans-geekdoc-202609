    # 4.8.2 Basics of Metabolomics


    There were established processes for collecting samples for metabolomics research,
    and the acquired metabolites were extracted using various technical procedures
    to examine minor statistical variations in metabolites across many groups and
    conduct several further investigations. There are no analytical techniques available
    for measuring all metabolites in human samples. Several research studies have
    employed diverse analyzes to perform complementary coverage. The two most popular
    technology platforms in metabolomics are MS and nuclear magnetic resonance (NMR).


    # 4.8.2.1 Metabolomic Data Processing


    Metabolomics technology offers numerous possible uses in illness studies. Unlike
    traditional clinical chemistry, metabolomics measures an organism''s metabolic
    characteristics. Scientists utilize high-throughput analysis and pattern recognition
    to explore the characteristics and regularities of life activities at the metabolic
    level to establish a link between metabolite phenotypes. These procedures are
    sensitive, non-invasive, and exact. The progress of metabolomics technology has
    resulted in the identification of novel techniques for addressing ART bottlenecks.


    # 4.8.2.2 Metabolomics Pretreatment


    Metabolomics is used to study the metabolites of biological materials because
    traditional omics cannot fully explain complex physiological and pathological
    responses. In contrast, metabolomics aims to describe all metabolites found in
    cells or biological systems. Blood, urine, cerebrospinal fluid, saliva, biopsy
    tissue, and cell extracts are all potential materials for metabolomics study.


