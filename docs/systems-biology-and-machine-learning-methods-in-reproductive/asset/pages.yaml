    the ML-based software “FertilitY Predictor” and been awarded copyrights for “ARTPre:
    An Online Tool to Predict the Success Rates of Assisted Reproductive Procedures
    in Indian Subcontinent”.


    **Priyanka Narad** is an experienced Bioinformatician and AI expert. She is currently
    working as a Scientist at the Indian Council of Medical Research (ICMR), New Delhi.
    With over 13 years of experience, including as an assistant professor at Amity
    University, her expertise lies in stem cell bioinformatics, machine learning,
    multi-omics data integration, and predictive modeling. Narad has made significant
    contributions through numerous publications in prestigious journals like Nature
