- pgno: 11
  md: '# Introduction to Systems Biology and Machine Learning


    Vandana C. D., Krupa S., and Sandeep Kumar C.


    # 1.1 INTRODUCTION


    The Human Genome Project (HGP) brought a revolution in medicine and has fundamentally
    altered the field of biology. The concept underlying the HGP first came forth
    from Renato Dulbecco in a 1986 paper (Dulbecco 1986), where he pointed out that
    understanding the human genome’s sequence would improve our understanding of cancer
    (Birney 2021).


    The HGP’s most significant influence is that it has inspired scientists to embrace
    an alternative viewpoint on biology referred to as the systems approach. Instead
    of studying individual genes or proteins one at a time, systems biology has allowed
    us to understand the big picture of the cell’s functioning. System biology has
    achieved this by promoting a fresh scientific methodology in biology known as
    discovery science; outlining a catalogue of genetic components for humans and
    various model organisms; reinforcing the notion that biology operates as an informational
    science; by equipping us with advanced high-throughput tools for methodically
    disturbing and observing biological systems; and by inspiring the development
    of novel computational techniques (Birney 2021).


    The goal of the emerging subject of systems biology, is to comprehend biological
    systems at the system level. A collection of guiding ideas and techniques that
    connect molecular behaviors to the features and operations of systems is necessary
    for system-level comprehension. In the end, a coherent body of knowledge supported
    by fundamental physics will be used to characterize and comprehend cells, organisms,
    and humans at the system level (Kitano 2002).'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 1.1.1 History


    This approach toward biology has been pursued for a long time and this concept
    has emerged several times in the biological scientific community. The earliest
    and foremost proponents of system-level understanding of biology were credited
    to Norbert Wiener. He was an American scientist who worked in the fields of applied
    mathematics and also the inverter of cybernetics or biological cybernetics branch
    of science. In 1968, Ludwig Von Bertalanffy developed the concept of general system
    theory that helped to understand the systems. However, this theory was not well
    developed and too abstract to be accepted by a scientific audience. The basic
    form of this concept was proposed by Cannon and he also proposed the concept of
    homeostasis (Kitano 2002). During the above timeline, the field of molecular biology
    did not provide them with enough knowledge to understand this phenomenon. Therefore,
    the entire work was focused on explaining them at the physiological level. Systems
    biology is different from previous attempts, in that it offers the chance to directly
    base system-level understanding on molecular-level information, such as genes
    and proteins. Previous attempts have not been able to adequately connect molecular-level
    knowledge to system-level description. This presents a unique chance to comprehend
    biological systems through a coherent framework of knowledge that has been accumulated
    from the molecular to the system level (Kitano 2002).


    # 1.1.2 Scope


    The reach of systems biology in basic research is very broad, which includes multiple
    targets. Different sets of tools and techniques are required for each research
    target. Furthermore, it also needs information from different areas of biology
    such as engineering fields, computer theory, control theory, high-precision measurement
    molecular biology, and other scientific areas. Research is mainly carried out
    in four areas (Figure 1.1).


    # 1.1.3 Key Properties


    To obtain systems-level insight into biological properties, knowledge needs to
    be gained from four different areas:


    # 1.1.3.1 Systems Structure


    The biological systems are composed of multiple components: genes, lipids, carbohydrates,
    and proteins. These molecules are involved in intramolecular interactions and
    intermolecular interactions. Furthermore, some of the biomolecules can also form
    a network that is essential for cell functioning. These networks significantly
    change the overall behavior of these molecules from their monomeric form (Kitano
    2002).


    # 1.1.3.2 System Dynamics


    All systems are subjected to various conditions during their lifetime and are
    associated with respective metabolic changes in internal organelles. These internal
    changes are measured by phase portrait and bifurcation analysis, which uses techniques
    like sensitivity analysis, dynamic analysis, and metabolic analysis. These measurements
    allow us to'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/78e636924f564c81991862ff47c138e9_13_0.png)


    FIGURE 1.1 Four major areas of systems biology.


    identify specific molecular mechanisms underpinning specific cell behavior. In
    multidimensional space, bifurcation analysis is used to understand time-related
    changes in the biological system. Furthermore, each dimension is correlated with
    the concentration of a particular biochemical metabolite in the cell (Kitano 2002).


    # ## 1.1.3.3 Control Method


    The cell''s state is controlled by several mechanisms. These mechanisms can be
    made robust to either reduce or prevent alterations that are caused by the malfunctioning,
    intrinsic, and extrinsic factors that are responsible for this malfunctioning.
    Further, this also highlights potential therapeutic areas for a particular disease
    (Kitano 2002).


    # ## 1.1.3.4 Design Method


    It deals with innovative strategies to alter and design the biological system
    with task-specific properties. Instead of traditional trial and error methods,
    this approach depends on a well-defined framework. The fundamental concepts are
    design principles and simulations.


    The advancement in the above four areas requires needs innovations in genomics,
    computational sciences, and measurement techniques, and combining these innovations
    with existing and new knowledge is the way forward in genomics (Kitano 2002).'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Systems biology tries to answer the question of how molecular interactions
    are responsible for the physiology and behavior of an organism. In previous centuries,
    mathematical models were applied in genetics, biochemistry, physiology, evolutionary
    biology, and ecology. However, different scientists—physicists, mathematicians,
    engineers, computer scientists, and biologists—have diverse definitions of models.
    If model building is to reach its full effectiveness as an explanation tool for
    investigating biological systems, these distinct points of view must be dissected,
    and their benefits must be summarized. The complexity of mechanical models is
    due to the involvement of numerous unknown parameters. To circumvent this problem,
    scientists have proposed the concept of robustness in the past. This idea of robustness
    was widely accepted in the scientific community; however, the application of this
    concept still lacks a precise definition (Tavassoly et al. 2018). A challenge
    that has arisen in systems biology is robustness, and it is especially applicable
    to the parameter problem. In general, robustness refers to a system’s capacity
    to preserve a specific trait despite interruption. It is vital to specify the
    nature of the property, the sense in which it is unchanging, and the kind of perturbations
    that are being considered to make this clear. “Remaining the same” could refer
    to the quantity and kind of attractors as well as the connectivity and form of
    trajectories that do not change in response to disturbances (Tavassoly et al.
    2018).


    # 1.1.4 Types of Robustness


    Robustness has garnered significant attention due in part to the possibility that
    it represents a biological design concept (Kitano 2002). As demonstrated, various
    forms of resilience may be categorized based on the dynamical system’s altered
    features (Table 1.1).


    # 1.1.5 Complex System


    Both artificial and natural complex systems display universal design patterns,
    which are shared ideas and guidelines that show up in several, seemingly unrelated
    systems. The successful construction of complex systems that can compete, live,
    reproduce, and evolve over long periods of time and several generations—thereby
    promoting enhanced fitness and overall growth—requires the use of these design
    patterns. Understanding these recurrent design principles—which appear in a variety
    of complex systems and contexts, both natural and man-made—is the goal of the
    area of complex systems theory.


    TABLE 1.1 Types of resilience.


    | Various Forms of Resilience | Functions |

    |---|---|

    | Type I stability in motion | Ability to withstand starting conditions while
    maintaining consistent constrain values. |

    | Type II resilience to constrain change | Resistance against alterations of constrained
    values |

    | Type III resilience to constrain change | Robustness against modulation in parametric
    values |

    | Type IV stability in structure | Resilience to alteration in dynamic functioning
    |'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Accurately describing the characteristics of complex systems is the aim of
    complex systems science, to provide a complete understanding that goes beyond
    individual systems or particular design concepts. Gaining a deeper comprehension
    of these universal principles will help us better navigate and understand the
    rapid changes brought about by the social and technical growth in our environment
    (Mā''ayan 2017). Scientists try to analyze and grasp complicated systems by conducting
    multivariate experiments. These studies capture measurements of numerous system
    variables under controlled settings to track the dynamics of the system over time
    in response to various perturbations. Consequently, the gathered data is used
    to construct models, which are necessary to produce hypotheses that make sense
    of the data that has been seen. These models provide a simplified representation,
    or skeleton, of the real complicated system that is being studied to gain insights
    into cell function (Mā''ayan 2017). The goal of modeling in the study of complex
    systems is to reduce the real system''s complexity to a manageable scale that
    can be theoretically, mathematically, and cognitively understood.


    # 1.1.6 Environmental Complexity versus Agents'' Complexity


    Complex environments and complex agents are the two basic types that can be identified
    in the context of complex systems and discussions on complex system design. Systems
    having well-defined borders, surrounded by a physical border, are referred to
    as complex agents. These agents often have one or more CPUs, a clock, energy-efficient
    acquisition and use mechanisms, sensors, actuators, and environmental interaction
    capabilities. Complex agents can move, grow, heal themselves, reproduce themselves,
    and frequently even be conscious of their own existence. Humans, cells, trees,
    fish, worms, birds, cars, airplanes, and some types of robots are examples of
    complex agents (Mā''ayan 2017).


    # 1.1.7 From Molecules to Pathways and Networks


    Large-scale molecular datasets are produced by experimental omics research, and
    statistical techniques are necessary to pinpoint the genes, messenger RNA (mRNA),
    proteins, and other molecular elements that are connected to particular physiological
    or pathological conditions. Based on their under- or over-representation in biological
    samples, Gene Set Enrichment Analysis (GSEA) is a statistical method used to find
    putative molecular components accountable for phenotypes and functions (Ashburner
    et al. 2000).


    A particular ontology is used to enrich differentially expressed molecular entities,
    or more generally, biomarkers. An ontology is a collection of concepts that are
    organized into certain relationships and function as a hierarchical classifier.
    By linking data (genes or gene products) with biological processes, molecular
    functions, and cellular components, this ontology serves as a tool for the discovery
    of biological knowledge (Ashburner et al. 2000).


    Systems biology uses a variety of ontologies, including Molecular Biology of the
    Cell (MBCO) and Gene Ontology (GO). Furthermore, data is converted into biological
    information through the use of bioinformatics tools such as the Kyoto Encyclopedia'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'of Genes and Genomes (KEGG), WikiPathways, Reactome Pathway, Progeny Signatures,
    and Broad Signatures. The GSEA results offer valuable information about the pathways,
    such as signaling pathways, that govern the particular phenotype being studied.
    This method makes it easier to identify important molecular actors and their roles
    in the biological processes connected to the phenotype under study (Ashburner
    et al. 2000).


    Within cells, signaling pathways are essential for information processing. These
    pathways take in signals from the outside world and use them to control the physiology
    of cells. Signaling pathways are complex networks made up of multiple components
    that can all receive, transmit, and transduce information (Tavasolly et al. 2018).
    Cellular signals carry information that moves through space and time. Differential
    equations and dynamical systems theory can be used to study this process mathematically.
    Connectivity between different routes within a network is established by receptors,
    which are found on the surfaces of cells and are in charge of receiving signals
    from the external environment as well as other internal signaling components.
    These intracellular signaling components serve as effectors, integrators of signals,
    and information processing units within the cell.


    They are output devices that show how cells react to signals from outside the
    cell. Understanding the kinetics of signaling pathways contributes to our comprehension
    of how cells perceive and react in unison to environmental stimuli. GSEA enables
    the design and analysis of functional molecular networks in addition to linear
    routes. The building blocks of these networks are molecular entities interacting
    with one another.; these entities are called “nodes,” and the interactions are
    called “edges.” These networks of interactions include a variety of linkages,
    including direct binding that triggers the activation or inhibition of enzymatic
    activity and downstream targets. Beyond linear pathways, the network architecture
    offers a more thorough understanding of the links and linkages between molecular
    components, revealing details about the intricacy of cellular functions (Hansen
    et al. 2017).


    # 1.1.8 Machine Learning and Systems Biology


    It is a difficult undertaking to evaluate the druggability of all proteins or
    nucleic acid fragments through experimentation. The problem is made more difficult
    by our ignorance of the molecular biology of disease. We have a very large sample
    space for a possible therapeutic target with these uncertainties. Therefore, it
    is not feasible to clinically examine every pharmacological target before having
    the ability to rank them in order of importance. Owing to these characteristics,
    it would be greatly appreciated if computational models could predict therapeutic
    targets on a genome-wide scale with high sensitivity and high specificity (Kandoi
    et al. 2015).


    We now have access to a vast amount of data, such as profiles of protein and gene
    expression, metabolic and gene regulatory networks, protein–protein interaction
    (PPI), and other system-level data, because of technological improvements. While
    integrating these disparate data sources remains difficult, advancements have
    been achieved in recent years. These system-level data may now be combined with
    machine learning and other'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'data mining methods to create predictive models. According to Costa et al.
    (2010), these studies may reveal biologically significant patterns that grant
    draggability to prospective therapeutic targets.


    A machine learning (ML) method typically involves the subsequent procedures to
    develop predictive models: choosing memory-based learning (e.g., non-druggable
    and druggable protein molecules) and ascribing for example: system-level landscapes);
    choosing memory-based algorithms; and assessing the predictive performance of
    the systems’ mathematical models. The following steps are how we organized this
    mini-review: The learning cases are covered first, followed by the characteristics
    and performance measures associated with the system-level-based prediction of
    draggability, and lastly, the most popular ML techniques in this domain (Kandol
    et al. 2015).


    Sequence and structural features are among the many characteristics that have
    been employed to create models that can forecast draggability. Kandol et al.’s
    (2015) study paid attention to attributes at the system level, such as the gene
    expression profile and network topological aspects. To compute the topological
    properties of networks (henceforth referred to as network measures) to be used
    as learning features in an ML technique, the PPI networks from which these measures
    are formed must first be constructed (Kandol et al. 2015).


    Drug-targeting proteins exhibit certain measures of their PPI network that are
    notably different from the rest of the proteins in the PPI network according to
    Yao and Rzhetsky (2008) and Jeon et al. (2014). These findings are based on the
    work of these pioneers in the field of drug-target networks. Therefore, in ML
    methodologies, network metrics have been demonstrated to be promising predictors
    of draggability as well as essential and disease genes. ML techniques based on
    various combinations of PPI topological properties appear to be encouraging for
    drug-able protein and gene prediction.


    The area under the receiver operating characteristic curve (AUC) of prediction
    models built only using network measurements was 69.21% and about 68%, as shown
    by Jeon et al. (2014), respectively. Jeon et al. (2014) improved the AUC to 78%
    by integrating genomic parameters such as mutation occurrence, row chromosomal
    copy number, Robust Multi-array Average (RMA) intensity, and Genetic Algorithm
    for Rule-set Prediction (GARP) score with closeness centrality. From this data,
    it may be inferred that drug-sensitive proteins can be identified only somewhat
    from PPI measures alone. To quantify the degree of likelihood of drug-sensitive
    proteins using PPI measures, thorough research will be needed, in which network
    measurements are employed both singly and collectively as learning qualities.


    Yao and Rzhetsky (2008) employed various ML techniques to attain AUCs of 60–72%,
    taking into account gene expression profile, connectedness, and betweenness, along
    with other aspects of the system. Costa et al. (2010) attained a median AUC of
    82% with their prediction models, which were based on gene expression profile,
