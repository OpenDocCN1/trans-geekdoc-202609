    differently, while well-intentioned, may result in injustice and operational issues.
    While individual ethical rights must be protected, public health ethics advocates
    for voluntary testing and data sharing for communal health advantages (Tong, 2013).
    This makes the most sense when considered in relation to reproductive genetic
    carrier screening (RCS). RCS serves to assess the likelihood of having children
    with specific genetic conditions, regardless of familial background, before or
    during pregnancy. The ethics in RCS encompasses several key considerations. Firstly,
    articulating the goals of RCS initiatives poses a central ethical dilemma. Striking
    a balance between individual reproductive autonomy and population health objectives
    is crucial. Critics argue that solely aiming to reduce the incidence of genetic
    conditions at a population level may inadvertently coerce couples into participating,
    undermining the voluntary nature of testing. Such an approach may imply an obligation
    for couples with increased risk to take action, potentially impinging on their
