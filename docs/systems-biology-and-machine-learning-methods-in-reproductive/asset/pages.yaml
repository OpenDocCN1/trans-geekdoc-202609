    # 3.4 CLINICAL APPLICATIONS OF GENOMICS AND TRANSCRIPTOMICS IN REPRODUCTIVE HEALTH


    # 3.4.1 Assisted Reproductive Technologies


    Infertility is a medical disorder when a person is unable to have a successful
    pregnancy while participating in frequent, unprotected intercourse for a duration
    of 12 months or more. It may also refer to a person’s inability, either alone
    or with their partner, to reproduce. The first step in diagnosing infertility
    in any patient is obtaining a comprehensive medical history, including details
    on their sexual and reproductive history, as well as any signs of decreased reproductive
    function that may be associated with advanced age or physical examination results
    (Practice Committee of the American Society for Reproductive Medicine 2020).


    In recent years, assisted reproductive technologies (ART) have become a secure
    solution for couples experiencing fertility issues. ART approaches include controlled
    in vitro fertilization (IVF), vitrification, intracytoplasmic sperm injection
    (ICSI), and controlled ovarian stimulation (COS) (Sánchez-Pavón et al. 2022).
    Typically, the procedure often involves the use of donated gametes due to diagnosed
    or idiopathic infertility in the individuals seeking ART. Gamete donation refers
    to the act of donating either eggs (oocytes) or sperm to help another person or
    couple in their efforts to have a child. Women who have hypogonadotropic hypogonadism,
    advanced maternal age, reduced ovarian reserve, low oocyte/embryo quality, or
    have had many unsuccessful efforts to conceive after fertility treatments are
    recommended to consider using an oocyte donor. Likewise, the reasons for using
    a sperm donor include Azoospermia, severe oligospermia, or other notable abnormalities
    in sperm or seminal fluid; malfunction in ejaculation; or other serious infertility
    in males that has not improved with earlier ART treatments. Other indications
    include women/men who are known to be afflicted by or carriers of a major genetic
    abnormality, as well as those who have a family history of a heritable disease
    for which testing is currently unavailable. In addition, the existence of an incurable
    sexually transmitted illness or a situation where a male partner is Rh-positive
    and his female spouse is Rh-negative with a severe case of Rh-isoimmunization
    are additional factors that indicate the need for ART (Lilienthal and Cahr 2020).'
