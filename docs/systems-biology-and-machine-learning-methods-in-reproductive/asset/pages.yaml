    # 3.3.1.2 Whole-Exome Sequencing


    The exome refers to the portion of the genome that consists of all the exons of
    protein-coding genes. It makes up around 1–2% of the genome, with the exact percentage
    varying depending on the species (Warr et al., 2015). Approximately 85% of mutations
    that cause diseases are found in the exome (Seaby et al. 2016). As a result, whole-exome
    sequencing (WES) has gained popularity as a more affordable alternative to WGS.
    WES offers a balance between cost, coverage of the genome, diagnostic success,
    and interpretability. WES can help to uncover genetic changes that are linked
    to fertility, infertility, and reproductive disorders. By prioritizing coding
    sequences, it provides valuable information on uncommon genetic variations, Mendelian
    disorders, and prospective targets for therapeutic interventions. This contributes
    to the progress of tailored strategies in reproductive medicine and genetic counseling.


    # 3.3.1.3 Epigenomics


    Epigenomics is the approach used to investigate the chemical alterations of DNA
    that have a significant impact on the expression and regulation of gene function.
    Epigenomic regulation is a complex and dynamic process wherein genomic regulation
    is influenced by external influences, such as diet, nutrition, and environmental
    factors. These heritable'
