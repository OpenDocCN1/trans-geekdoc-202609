    # Ethical considerations for the use of machine learning in reproductive health


    +   - Bias

    +   - Fairness

    +   - Model training

    +   - Data quality

    +   - Privacy

    +   - Data ownership

    +   - Data source

    +   - Impact on clinical workflow

    +   - Accountability

    +   - Liability

    +   - Unintended harms

    +   - Complex causal relationships

