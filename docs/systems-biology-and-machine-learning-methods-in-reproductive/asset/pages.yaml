    # 1.3.1 Types of Machine Learning


    There are three fundamental learning paradigms in ML. Supervised learning, unsupervised
    learning, reinforcement learning, and deep Learning (Table 1.2).


    # 1.3.1.1 Supervised learning


    In supervised learning, the process entails developing a predictor by utilizing
    training data composed of samples with identifiable class labels. In this approach,
    the goal is to predict the class of a new sample based on its known characteristics.
    For instance, the prognosis of a patient could be predicted using a model built
    from the gene expression patterns of tumor samples, incorporating data from tumor
    samples with known patient outcomes. In supervised learning, the procedure is
    termed “classification” when dealing with categorical output labels (such as good
    versus poor prognosis) and “regression” when handling continuous output (such
    as the number of months survived). Examples of supervised'
