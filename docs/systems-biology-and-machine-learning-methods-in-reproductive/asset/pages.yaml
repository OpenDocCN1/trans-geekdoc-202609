    # 6.2.1.2 Decision Tree


    +   - Operates by iteratively dividing the dataset into smaller subsets, taking
    into account the values of input features.

    +   - Can be used for regression or classification problems, with the main objective
    of constructing a model that can accurately predict the value of the target variable.

    +   - Learns straightforward decision rules from the input features.

    +   - Ease of understanding, simple methodology, and capacity to handle both categorical
    and numerical data.

    +   - However, when the trees are deep, they are more likely to overfit the data.

    +   - This issue may be addressed by pruning or using ensemble approaches.


    # 6.2.1.3 Random Forest


    +   - Ensemble approach that consists of many decision trees trained separately
    on random subsets of data.

    +   - Based on the principle of “wisdom of crowds” – It is made up of multiple
    trees, and each tree (base learner) forecasts its categorization.

    +   - The ultimate judgment is determined by a model using the largest number
    of votes from the trees.

    +   - Success lies in the collective strength of uncorrelated trees, as their
    combined decision-making ability mitigates individual errors, with less correlation
    among models being crucial for optimal performance.


    # 6.2.1.4 Naïve Bayes


    +   - Based on Bayes’ theorem, a mathematical formula is used for conditional
    probability.

    +   - Assumes that the attributes used to describe an observation are conditionally
    independent, depending on the class label.

    +   - This is a simplifying assumption, and in reality, features may be correlated,
    but the algorithm still tends to perform well in practice.


    # 6.2.1.5 Support Vector Machine


    +   - A mathematical method used to optimize a certain mathematical function based
    on a set of data (sometimes referred to as regularization), which is grounded
    on the Vapnik–Chervonenkis theory.

    +   - Used to do classification and regression analysis.

    +   - Involves identifying the hyperplane that most effectively divides the data
    into several groups.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 6.2.1.6 K-Nearest Neighbor


    +   - Provided that the class was previously known, the nearest neighbor rule
    determines the category of an unknown data point by considering its closest neighbor.

    +   - Assumes that data points with similar characteristics are located near each
    other in the feature space.

    +   - Uses a similarity metric, such as Euclidean distance or cosine similarity,
    to identify the KNNs of a given data point.

    +   - The class that occurs most frequently among these neighbors is assigned
    to the new data point.


    # 6.2.2 Regression


    +   - Statistical techniques are used to establish the connection between a dependent
    variable and one or more independent variables, known as result and predictors,
    respectively.

    +   - Comprehends how the fluctuation in independent variables alters the value
    of the dependent variable (Maulud and Abdulazeez, 2020).

    +   - It is often used to forecast or approximate the dependent variable’s value
    based on that of the independent variables.


    # 6.2.2.1 Linear Regression


    +   - Statistical method used to predict the value of a dependent variable by
    considering one or more independent variables.

    +   - Involves estimating the coefficients of a linear equation to minimize the
    differences between the predicted and actual output values.

    +   - Often done using “least squares” methods, which assist in identifying the
    best-fit line for paired data.

    +   - Allows for the determination of the dependent variable based on the independent
    variable.


    # 6.2.2.2 Multivariate Regression


    +   - An advanced statistical technique that builds upon simple linear regression.

    +   - Allows for the analysis of the intricate relationship between one dependent
    variable and multiple independent variables.

    +   - Enables the simultaneous investigation of the impacts of several predictors
    while accounting for the influence of other variables.


    # 6.2.2.3 Logistic Regression


    +   - Statistical method effective for binary classification problems.

    +   - Utilizes regularization to prevent overfitting and enhance model accuracy.'
  merge: -1
  img_proc: true
