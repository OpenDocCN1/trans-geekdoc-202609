    # 6.10 TOOLS


    # 6.10.1 DeepFert


    The research by Naseem et al. (2023) utilized several ML algorithms and Deep Learning-based
    Neural Networks (DLNN) to compare their effectiveness in predicting semen quality
    and fertility rates as well as propose a method for use in automated artificial
    insemination workflows. DLNN achieved comparatively significant results with a
    semen prediction accuracy of 80.952% and a sperm concentration accuracy of 85.714%
    with great effectiveness and consistency (Naseem et al., 2023).


    # 6.10.2 MotilitAI


    The motilitAI framework utilizes multiple ML algorithms, including Linear Support
    Vector Regressor (SVR), Multilayer Perceptron (MLP), Bag-of-Words with Support
    Vector Regressor (BoW with SVR), and more. These algorithms are trained on features
    extracted from sperm videos, specifically displacement vectors and statistics
    computed from sperm tracks. The performance of the framework is evaluated using
    metrics such as mean absolute error and root-mean-square error. The objective
    of this framework is to predict human sperm motility (Ottl et al., 2022). The
    MLP model achieved the best results when trained on EMSD feature vectors extracted
    using Trackpy and unsupervised tracking of sperm cells with the Crocker-Grier
    algorithm. The extracted features were then aggregated into a histogram for each
    detected track using BoW.


    # 6.10.3 CASAnova


    The computer-aided sperm analysis (CASA) nova machine model, which is facilitated
    by SVMs, can be employed for the determination of motility percentage and kinematic
    parameters (Goodson et al., 2017). It uses kinematic gating techniques for distinguishing
    vigorous sperms as progressive, intermediate, or hyperactivated and non-vigorous
    sperms as slow or weakly motile. With an inclusive accuracy of about 89.9%, it
    has the capability of allowing the quick quantitative analysis of motility changes
    within more than 26,000 human sperms during capacitation.


    # 6.10.4 i-HOPE


    The system was created by gathering data from numerous clinics and hospitals,
    which included physiological and metabolic indicators associated with PCOS and
    infertility. This data was then analyzed using data mining techniques, ultrasound
    report categorization, and competitive neural networks. ML techniques were employed
    to classify PCOS. The i-HOPE project offers the potential to explore novel approaches
    in the treatment of PCOS by investigating the effects of Vitamin D, preterm labor/abortions,
    and lean body composition on PCOS patients (Denny et al., 2019).'
