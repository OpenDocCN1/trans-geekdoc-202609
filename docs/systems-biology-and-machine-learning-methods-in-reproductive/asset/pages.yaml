    # 4.8.3.2 Metabolomics and Pregnancy


    # 4.8.3.2.1 Primary Application of Metabolomics


    The quality of gametes, embryos, and endometrial receptivity are three essential
    aspects that determine the outcome of ART, including ICSI and IVF. In clinical
    settings, the morphological score is used to assess the quality of gametes. When
    the oocyte number is low, morphology alone is insufficient for evaluation. In
    clinical practice, low morphological-grade oocytes can generate embryos but not
    live births. High-quality oocytes may fail to fertilize using ICSI, resulting
    in low-quality embryos that cannot implant into the endometrium. Endometrial thickness
    is frequently measured using ultrasonography.


    # 4.8.3.2.2 Secondary Application of Metabolomics


    Glycerylphosphorylcholine (GPC), citric acid, tyrosine, and phenylalanine could
    be utilized to assess sperm quality by detecting glutamine and other components
    in semen with NMR. This metabolomics technology offers a quick and non-invasive
    way to investigate infertility. Wallace et al. obtained oocytes and follicular
    fluids from 58 IVF patients(Wallace et al. 2012). The follicular fluids that could
    be fertilized but not cleaved were compared to those that could be fertilized
    and cleaved using one-dimensional NMR. The researchers found substantial differences
    in the metabolite profiles of the two forms of follicular fluid, including glucose,
    lactate, protein, and choline/choline phosphate levels.


