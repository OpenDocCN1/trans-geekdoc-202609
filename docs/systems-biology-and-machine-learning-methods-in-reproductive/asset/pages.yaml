  md: 'in each case, such as the patient’s age, ovarian reserve, personal and medical
    history, past treatment outcomes, and, if possible, information about the patient’s
    genetic and epigenetic condition. As female age advances, it is getting more common
    for it to be a significant factor in human infertility. In addition, there are
    other more intricate indicators that can be used to identify this issue. While
    both physiological and premature ovarian aging lead to oxidative stress due to
    mitochondrial damage (Yan et al. 2022), the oocyte cytoplasm contains developmentally
    significant molecules that are more susceptible to oxidative stress compared to
    the oocyte’s DNA. This is because the DNA is relatively shielded by its location
    within the nucleus and its association with proteins. Over 20 years ago, it was
    shown that transferring the nucleus from older women into donor eggs without a
    nucleus might maintain fertility without affecting the women’s own genetic material,
    unlike total egg donation. To revitalize oocytes, a method was employed where
    a small quantity of cytoplasm from donor oocytes was injected into the patients’
    oocytes during IVF using ICSI (Barritt et al. 2001). Both methods have been discovered
    to enhance the growth of embryos and the results in patients with previous complications,
    including those who are advanced in age.


    +   • Ovarian stimulation: Another issue to be addressed is the selection of the
    best ovarian stimulation protocol. We know that women respond differently to different
    types of hormones and their combinations (Kirshenbaum et al. 2021), and the first
    research into the molecular basis of these differences are emerging (Papageorgiou
    et al. 2021). However, for the time being, clear guidelines and protocols are
    still lacking, and the ovarian stimulation protocol should thus be primarily adapted
    based on previous attempts, in addition to repeated determinations of serum estradiol
    and luteinizing hormone (LH) concentrations, as previously described. Although
    this issue was uncovered by analyzing oocyte quality in young oocyte donors, it
    is even more critical in women with decreased ovarian reserve. There is an urgent
    need for more high-quality molecular and clinical studies to address this problem
    so that the best ovarian stimulation strategy can be applied as early as the first
    treatment attempt. Finally, in women with extremely poor ovarian response (POR)
    and asynchronous antral follicle growth during the follicular phase, double ovarian
    stimulation (DuoStim) in the follicular and luteal phases of the same cycle, followed
    by oocyte or embryo cryopreservation for later uterine transfer, is increasingly
    used. The decision-making process in cases with primary testicular disease, on
    the other hand, is a considerably more complicated issue with a variety of potential
    treatments to consider. In most cases, traditional ICSI is sufficient if spermatozoa
    only have minor abnormalities. In contrast, in cases of significant sperm abnormalities,
    IMSI or even TESE-ICSI is recommended. TESE-ICSI is especially important in extreme
    situations like cryptozoospermia (Tesarik and Mendoza-Tesarik 2022). IMSI, PICSI,
    or both in combination can help in cases with abnormally high numbers of spermatozoa
    with damaged DNA. Finally, in cases where oocyte activation issues have previously
