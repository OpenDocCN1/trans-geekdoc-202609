    # FIGURE 6.3 Ethical Considerations for the Use of ML in Reproductive Health.


    likely to be incorporated into clinical decision-making, before doing so, one
    must take into account the impact it could have in healthcare settings by thoroughly
    assessing its advantages, potential misapplications as well as the issues in allocating
    resource’s due introduction of “information noise” by it.


    To ensure fairness within the ML system, various measures have been taken; these
    include – model constraining, the omission of sensitive variables such as race
    or gender from the model, the derivation outcomes that are independent of the
    concerned patient’s identity during risk assessment, balancing of benefits and
    harms, among others (McCraddon et al. 2020). Although the measures taken seem
    to be ideal, they have the potential to cause unintended harm and may create discrepancies
    in the detection as well as resolution of reproductive health issues; hence, designing
    paradigms for healthcare is a responsibility that requires meticulous deliberation
    and strategic planning.'
