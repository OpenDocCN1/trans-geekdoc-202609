    # 6.6.7 Maternal Healthcare


    The research carried out by Mutlu et al. (2023) highlighted the potential benefits
    of using ML methods to detect maternal health hazards. It also underlined the
    need for early identification of risk factors for the welfare of pregnant women.
    The research conducted a comparison of several ML techniques. The objective was
    to assess medical variables such as maternal age, body temperature, blood oxygen
    saturation, blood pressure, heart rate, and their respective measurements. The
    aim was to assess the degree of risk severity for pregnant women. The research
    findings indicated that the Decision Tree had the greatest level of accuracy,
    reaching 89.16%, while assessing the risk of maternal health. On the other hand,
    among the methods investigated in the study, the KNN approach had the lowest accuracy
    rate, measuring 68.47% (Mutlu et al., 2023).


    Numerous ML paradigms were employed in approximately 127 studies reviewed by Davidson
    and Boland (2021) that aimed to enhance pregnancy outcomes by focusing on different
    aspects of pregnancy care, such as prenatal care, perinatal care, birth and delivery,
    and preterm birth. Even though unsupervised learning methods (n = 9) were found
    to be less popular than supervised methods (n = 69), deep learning has gained
    popularity for its ability to provide valuable insights and enhance patient care
    by optimizing pregnancy outcomes, especially in addressing maternal healthcare
    needs, postpartum care, and pregnancy care for transgender individuals (Davidson
    and Boland, 2021).


    In their 2020 study, Sufriyana et al. conducted a systematic review and meta-analysis
    to compare the predictive abilities of different ML algorithms. The purpose of
    the study was to develop or validate a multivariable prognostic prediction model
    for pregnancy care. Logistic Regression was the predominant algorithm used for
    constructing a predictive model in prenatal care. Random Forest and Gradient Boosting
    algorithms have shown strong performance in predicting certain pregnancy outcomes,
    including preterm birth, pre-eclampsia, cesarean section, and gestational diabetes.


    The prediction model for preterm birth was developed using Electronic health records
    were used as the basis for the model, and its performance was assessed using several
    evaluation metrics (Sun et al., 2022). The study involved 9550 pregnant women,
    divided into two groups: 4775 women who had preterm births and 4775 women who
    served as controls. The average age of the women in the preterm birth group was
    lower than that of the control group. Additionally, the gestation period of the
    women in the preterm birth group was considerably shorter than that of the control
    group. There were also differences between the two groups in terms of characteristics
    such as parity, gravidity, newborn height, weight, and Apgar scores. The performance
    of the prediction model was evaluated using many metrics. It was determined that
    the Random Forest Tree model had the best accuracy of 0.816 and an AUC-ROC curve
    (area under the receiver operating characteristic curve) of 0.885 (with a 95%
    confidence range of 0.873–0.897) compared to the other models.'
