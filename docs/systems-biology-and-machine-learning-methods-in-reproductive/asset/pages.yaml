- pgno: 118
  md: '# 6.3 UNSUPERVISED LEARNING


    +   - Discovers patterns and structures from data that do not include any labels
    or explicit directions in the form of labeled output.

    +   - Analyzes the intrinsic organization of the data to discover noteworthy patterns,
    connections, or clusters without receiving explicit instructions on what to search
    for.

    +   - Clustering, Association Analysis, and Dimensionality Reduction are examples
    of unsupervised learning methodologies.


    # 6.3.1 Clustering


    +   - Groups similar data points based on their attributes or qualities.

    +   - Aims to detect natural clusters or groupings in the data without any preconceived
    labels.

    +   - Clustering can be conducted in various ways – K-Means, Gaussian Mixture,
    DBSCAN, Spectral, Hierarchical, and Hidden Markov methods.


    # 6.3.3.1 K-Means


    +   - Divides data points into k clusters by repeatedly allocating every point
    of data to the closest cluster centroid.

    +   - Revising the centroids to the average of the data points given to each cluster
    to minimize the sum of squares inside each cluster.


    # 6.3.3.2 Gaussian Mixture


    +   - Probabilistic clustering technique that accommodates the possibility of
    data points belonging to multiple clusters with varying probabilities.

    +   - Assumes that each of the data points originates from a combination of multiple
    Gaussian distributions with unidentified parameters.

    +   - Assigns data points to clusters according to the likelihood of them belonging
    to each cluster.

    +   - Valuable for identifying hidden subgroups within a population.

    +   - Depicts the spatial distribution of a population across extensive regions
    by categorizing people according to their attributes or trends.

    +   - Enables the implementation of focused treatments and tailored strategies
    for reproductive health among certain subpopulations.


    # 6.3.3.3 DBSCAN


    +   - “Density-Based Spatial Clustering of Applications with Noise,” or DBSCAN,
    collects data points that are closely packed together in high-density regions.

    +   - Separates outliers into noise points.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   - Can handle clusters of arbitrary sizes and shapes.

    +   - Does not require the user to specify the number of clusters in advance.


    # 6.3.3.4 Spectral Clustering


    +   - Relies on a graph structure and utilizes the eigenvalues of the similarity
    matrix to divide the data into distinct groups.

    +   - The process involves using spectral embedding to convert the data into a
    space with fewer dimensions.

    +   - Followed by the application of K-Means or equivalent clustering methods
    on the modified data.


    # 6.3.3.5 Hierarchical Clustering


    +   - Constructs a hierarchical structure of clusters by iteratively dividing
    or combining clusters based on their similarity.

    +   - User is not required to predefine the cluster number.

    +   - May generate a dendrogram to see the hierarchical clustering.


    # 6.3.3.6 Hidden Markov


    +   - Type of probabilistic graphical model used for modeling sequential data.

    +   - Can be used for clustering sequences of data by identifying hidden states
    that represent underlying patterns or behaviors in the data.


    # 6.3.2 Association Analysis


    +   - Data mining method that uncovers significant relationships or patterns among
    variables in extensive datasets.

    +   - Useful for identifying associations or correlations between items in transactional
    databases.

    +   - Association analysis can be conducted either through Apriori or FP-Growth
    algorithms.


    # 6.3.2.1 Apriori


    +   - Classic algorithm for association rule mining.

    +   - Comprises three main steps – joining of frequent datasets of a particular
    size to generate candidate datasets of larger size and pruning candidate datasets
    that violate the Apriori property.


    # 6.3.2.2 FP-Growth


    +   - Based on a divide-and-conquer strategy.

    +   - Utilizes the FP-tree data structure and efficiently mines frequent datasets
    by constructing an FP-tree from the transaction database.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   - Traverses it to directly identify frequent datasets via recursive conditional
    pattern base generation.

    +   - Subsequently, it generates association rules based on a minimum confidence
    threshold.


    # 6.3.3 Dimensionality Reduction


    +   - Used to reduce the number of features in a dataset while retaining important
    information.

    +   - Useful in datasets with a large number of dimensions, as it helps address
    issues such as computational complexity, overfitting, and excessive dimensionality.

    +   - Two main approaches to dimensionality reduction: feature selection and feature
    extraction, which involves choosing a subset of the original features and transforming
    the features into a lower-dimensional space, respectively.

    +   - Offers benefits such as enhanced accuracy, but also has drawbacks such as
    loss of information and reduced interpretability.

    +   - The choice between these approaches depends on factors such as the characteristics
    of the data and the specific learning tasks at hand (Li et al., 2020).

    +   - There are many strategies for reducing dimensionality, including linear
    discriminant analysis or LDA, principal component analysis or PCA, Auto-encoder,
    and Isomap.


    # 6.3.3.1 Principal Component Analysis


    +   - Finds orthogonal axes, known as principal components, to reduce the dimensionality
    of data.

    +   - Axes represent the highest amount of variation in the data.

    +   - By mapping the data onto principal components and choosing a subset that
    accounts for a certain proportion of the overall variance, it efficiently decreases
    the number of dimensions while retaining important information.


    # 6.3.3.2 Linear Discriminant Analysis


    +   - Employed in classification problems with the objective of mapping data into
    a lower-dimensional subspace while maximizing the distinction between classes.

    +   - Achieved by maximizing the ratio of within-class variance and between-class
    variance.

    +   - Through the transformation of original features to discriminant functions
    (linear combinations of the original attributes).

    +   - Facilitates the classification of new data points based on their projections
    onto these functions.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# **6.3.3.3 Isomap**


    +   - Isomap restores the intrinsic geometrical structure for high-dimensional
    data in lower-dimensional spaces via Multi-dimensional Scaling (MDS)

    +   - Graphically, it represents data points as nodes and similarities as edges.

    +   - Then, computes the shortest distance between them using specific algorithms
    or spectral techniques.


    # **6.3.3.4 Auto-encoder**


    +   - System that uses ANNs.

    +   - Consists of an encoder network that maps input data to a lower-dimensional
    latent space and a network of decoders that reassembles the input data from the
    latent space representation.

    +   - Reduces dimensionality and compresses data.


    # ## 6.4 SEMI-SUPERVISED LEARNING


    +   - Aims to enhance the accuracy of the learning algorithm by utilizing the
    extra information present in unlabeled data.

    +   - Useful in situations where acquiring labeled data is costly or time-consuming.

    +   - Encompasses many approaches that may be used to address data-driven challenges,
    including SVM, Self-training, Graph-based techniques, Co-training, and Generative
    models.


    # **6.4.1 Self-training**


    +   - Generates predictions on labeled data is first trained using the labeled
    data.

    +   - Predicted labels that have a high level of confidence are then included
    in the labeled dataset.

    +   - Undergoes retraining using the enhanced labeled dataset, and this process
    continues until convergence is achieved.


    # **6.4.2 Co-training**


    +   - Entails training several models or perspectives on distinct subsets of characteristics
    or depictions of the data.

    +   - At first, every model is trained using the labeled data.

    +   - Share reliably predicted labels on the unlabeled data with one another.

    +   - The models undergo retraining using the supplemented labeled data, and this
    procedure is repeated frequently.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 6.4.3 Graph-based Methods


    +   - Represents the data instances as nodes in a graph, where edges represent
    correlations between instances.

    +   - Utilizes the graph structure to propagate label information from labeled
    to unlabeled nodes through the graph.

    +   - Label propagation algorithms, such as label spreading or label propagation,
    are commonly used in this approach.


    # 6.4.4 Semi-supervised Generative Models


    +   - Integrates unsupervised and supervised learning by including latent variables
    to represent the underlying data distribution.

    +   - Generative adversarial networks (GANs) or variational autoencoders (VAEs)
    are capable of generating realistic data samples and predicting labels for labeled
    instances concurrently.


    # 6.4.5 Semi-supervised Support Vector Machines


    +   - Semi-supervised SVMs extend traditional SVMs by incorporating unlabeled
    data to enforce a smoother decision boundary.

    +   - Enhances classification performance by leveraging the margin between decision
    boundaries depending on the nature of the data.

    +   - Availability of labeled data.

    +   - The specific learning task at hand.


    # 6.5 REINFORCEMENT LEARNING


    +   - Framework where an agent acquires the ability to make choices through repeated
    environmental interactions.

    +   - The agent is provided with rewards or penalties as feedback, which are determined
    by the state it transitions into and the activities it does.

    +   - The agent''s goal is to acquire a strategy or policy that maximizes the
    total reward it gets over some time.


    # 6.5.1 Continuous Reinforcement


    +   - Continuous reinforcement learning involves an action space characterized
    by a continuum of values, allowing actions to span a range within a continuous
    domain.

    +   - Commonly implemented in tasks where actions are not confined to distinct
    choices but can instead encompass any value within a specified series.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 6.5.2 Categorical Reinforcement


    Categorical reinforcement learning pertains to tasks where discrete actions are
    drawn from a finite set of categories.


    Provokes the agent to select from a predefined set of actions, where actions could
    correspond to specific moves or denote choices of items to recommend.


    # 6.6 REAL-WORLD APPLICATIONS OF MACHINE LEARNING ALGORITHMS IN REPRODUCTIVE HEALTH


    # 6.6.1 Puberty


    The study conducted by Pan et al. (2019) employed multiple ML algorithms to create
    prediction models. These models were designed to address nonlinear interactions
    between features, determine feature importance, and provide good interpretability.
    The researchers utilized Extreme Gradient Boosting (XGBoost) due to its effectiveness
    in training a sequence of models to minimize errors and its scalability. They
    also used Random Forests to handle nonlinear data and ensure robustness to noise.
    The study conducted by Pan et al. (2019) used SVMs and Decision Trees to assess
    the performance of ensemble models vs nonensemble models. This analysis provided
    useful insights into the connections between input variables and the output gonadotropin-releasing
    hormone analogue (GnRHa) test findings in girls with presumed central precocious
    puberty.


    # 6.6.2 Menstrual Cycle Tracking


    The study conducted by Yu et al. (2022) revealed that the integration of wearable
    devices and algorithms for ongoing monitoring of health data might potentially
    enhance the chances of successful conception in women. The research used a range
    of ML methodologies, which were implemented and shown using Python. The algorithms
    were developed using basal body temperature and heart rate data acquired directly
    from participants. Their performance was assessed based on evaluation metrics
    and parameters. The objective was to forecast the fertile period and menstruation
    in individuals with both consistent and inconsistent menstrual cycles. In addition,
    the researchers (Yu et al., 2022) examined the incorporation of physiological
    parameters, such as the variability of the low-frequency to high-frequency ratio
    and normal-to-normal intervals, into predictive models.


    # 6.6.3 Family Planning


    Kebede et al. (2023) used a range of ML techniques to identify the main factors
    contributing to the lack of access to family planning services among women in
    Ethiopia. The selection of these algorithms was based on their distinct strengths
    and weaknesses to thoroughly analyze and select the most optimal model for predicting
    this occurrence. The Random Forest technique has the highest accuracy rate of
    85%, with an AUC (area under the curve)] value of 0.93. The study identified many
    key factors associated with'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'insufficient resources for family planning, including rejection from husbands/partners,
    women''s educational attainment, geographic region, previous childbirth in a healthcare
    facility, financial position, and household size (Kebede et al., 2023).


    # 6.6.4 Contraceptive Use


    ML algorithms and iterative thematic analysis (ITA) were employed to identify
    the factors influencing the use of intrauterine devices (IUDs) among married women
    in India. This approach provided valuable insights into the variable constructs
    derived from a set of regularized models (Dey et al., 2022). The Lasso Logistic
    Regression method was used to determine the key predictors of IUD usage. This
    technique reduces the coefficients of extraneous variables to zero, thereby removing
    unrelated variables from the dataset. This results in a more concise and focused
    input dataset. Ridge Logistic Regression was used to mitigate multicollinearity
    among the variables by including a regularization factor in the regression equation.
    The neural network used variables or characteristics with non-zero coefficient
    estimates from Lasso as input units, with women''s usage of IUD as the output.
    This was done to consider nonlinear correlations among the predictors. The findings
    were then compared to those obtained using the iterative theme categorization
    technique. The algorithms'' analysis revealed that several factors strongly influenced
    the use of IUDs among married women in India. These factors included shared family
    goals, utilization of family planning services, intention to have or not have
    children, wealth, education, access to counseling, and availability of maternal
    and child healthcare services.


    # 6.6.5 Unintended Pregnancy


    The researchers used several ML methods to forecast instances of unplanned pregnancies
    among married women in Bangladesh (Hossain et al., 2022). The Elastic Net Regression
    algorithm demonstrated superior performance in accurately classifying unintended
    pregnancies and their subsequent interventions among married couples in Bangladesh,
    achieving an impressive AUC of 74%. Furthermore, it identified age, education,
    wealth status, and contraceptive intention as the primary factors influencing
    the occurrence of these pregnancies.


    # 6.6.6 Assisted Reproductive Technology


    The method used to evaluate individual treatment effects for improving trigger
    injection time for in vitro fertilization (IVF) results was a T-learner with bagged
    Light Gradient Boosting Machine (LightGBM) base learners. The technique was selected
    due to its capacity to handle categorical and continuous covariates, capture nonlinear
    relationships, efficiently process huge datasets, and consider nonlinear interactions
    between input variables. The analysis included a range of patient characteristics
    and stimulation settings. The primary objective was to use ML to assist in making
    crucial decisions during IVF procedures. This might potentially lead to improved
    clinical outcomes by optimizing the yield of fertilized oocytes (2PNs) and the
    total number of viable blastocysts obtained from a specific cohort of stimulated
    follicles. Hariton et al. (2021) showed that using algorithms to aid doctors in
    making choices during IVF treatment may lead to a rise of'
  merge: -1
  img_proc: true
- pgno: 125
  md: '1.430 2PNs and 0.525 total useable blastocysts per cycle, as compared to judgments
    made without assistance. Furthermore, the research highlighted the capacity of
    ML algorithms to assist and enhance physician judgments, resulting in cost-efficient
