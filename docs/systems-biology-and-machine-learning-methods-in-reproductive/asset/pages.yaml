    # 2.7 CASE STUDY: PRETERM BIRTH AND ITS GLOBAL BURDEN


    Despite concerted efforts and improved data availability, the global rate of PTB
    remained largely unchanged from 2010 to 2020. Ohuma et al. 2023 analyzed data
    from 103 countries and areas, revealing that an estimated 13.4 million babies
    were born preterm in 2020, representing 9.9% of all births. While this marks a
    slight decrease from 2010, the annual rate of decline was a meager −0.14%. Southern
    Asia and sub-Saharan Africa, collectively comprising 56% of live births, shouldered
    65% of the global PTB burden in 2020. Worryingly, these regions also grapple with
    the most significant gaps in data quality, with none of the top 33 data quality
    countries residing in either region. Approximately 15% of all PTBs occurred at
    less than 32 weeks in 2020, highlighting the growing need for specialized neonatal
    care. Births at less than 28 weeks, despite representing only 4.2% of all PTBs,
    still numbered 567,800 globally. The fight against PTB demands renewed focus on
    equitable data collection, targeted interventions, and data-driven accountability.
    Only through these combined efforts can we truly bend the curve and improve the
    lives of millions of children and families affected by this global health challenge
    (Ohuma et al. 2023).'
