- pgno: 61
  md: 'rebuilding of the primary transcript by matching the reads to one another via
    de novo assembly or to a reference genome. The RNA-Seq technique offers a substantial
    advantage over microarray transcriptomes due to its usual range of 5 orders of
    magnitude (Lowe et al. 2017). The main difference between RNA-Seq and microarrays
    is that RNA-Seq allows for comprehensive whole transcriptome sequencing, whereas
    microarrays only examine specified transcripts or genes (Rao et al., 2019).


    # 3.3.2.3 Single-Cell RNA Sequencing


    Most cells in humans have the same genetic makeup. Nevertheless, the transcriptome
    data inside each cell provides insight into the specific functioning of a particular
    group of genes. Traditional investigation of the transcriptome or epigenome utilizing
    RNA-Seq may only capture the collective signals from tissues or organs, without
    the ability to distinguish between specific cellular changes. Single-cell RNA
    sequencing (ScRNA-Seq) facilitates the investigation of the transcriptome at the
    cellular level, enabling the inspection of millions of cells in a single experiment.
    Single-cell isolation and capture is the process of extracting individual cells
    from tissue to collect precise genetic and biochemical information. This allows
    for the study of specific genetic and molecular processes. By analyzing the transcriptome
    of each cell, we can classify, define, and distinguish them, making it easier
    to identify rare cell groups that have functional importance (Jovic et al. 2022).


    # 3.3.2.4 miRNA, ncRNA, LncRNA, and Circular RNA Profiling


    Recent breakthroughs in molecular biology have revealed a diversity of noncoding
    RNA molecules (ncRNA), such as long noncoding RNAs or lncRNAs, microRNAs (miRNAs),
    and circular RNAs or circRNAs. These molecules play a crucial role in controlling
    gene expression at different stages and are also engaged in a wide range of physiological
    functions. ncRNA refer to RNA molecules that do not perform protein encoding.
    However, it is important to note that these RNAs still perform specific functions
    (Panni et al. 2020).


    MicroRNAs are a set of small noncoding RNAs that regulate gene expression after
    transcription by specifically binding to mRNAs (Hussen et al. 2021). This binding
    often occurs at a short complementary sequence, frequently found in the 3’ untranslated
    region (UTR) of the mRNA. Similarly, lncRNAs are a diverse group of RNAs that
    may be transcribed from long intergenic noncoding RNAs (lncRNAs), or from any
    section of protein-coding genes, in either the same or opposite direction. LncRNAs
    are characterized by their length, which must exceed 200 nucleotides, and their
    inability to code for proteins. Additionally, circular RNAs are RNA molecules
    that have a single strand and are formed when the 3’ and 5’ ends are joined together,
    creating a circular shape. They are formed by a process known as back-splicing
    and typically consist of exons, introns, or noncoding intergenic regions (Panni
    et al. 2020).


    The distinct expression patterns of noncoding RNAs in different illness conditions
    substantiate their potential as promising biomarkers, facilitators of disease-causing
    pathways, and possible targets for therapeutic interventions (Ali et al. 2021).'
