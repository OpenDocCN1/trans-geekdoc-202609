    for the vulnerable class and minimized false negatives (Nigam et al., 2019). Feature
    importance was evaluated using Random Forest, with “age of migrant” and “accompanying
    adult in the family” identified as the top predictive features for the dataset
    based on metrics such as F1 score, accuracy, and confusion matrices. Furthermore,
    to gather data, provide safety and awareness, and present insights and recommendations
    to the public as well as professionals involved in migration, including migrants,
    public health workers, and policymakers, a web app was designed.


    # 6.12 NON-MARITAL SEXUAL VIOLENCE


    The research undertaken by Raj et al. (2021) used ML methods to ascertain the
    parameters linked to Non-Marital Sexual Violence (NMSV) in India. The Lasso and
    Ridge models were employed, accompanied by the ITA of the generated variables.
    This analysis helped identify previously unknown factors linked to NMSV, including
    limited knowledge and utilization of sexual and reproductive health (SRH) services,
    as well as cultural norms and preferences indicating more rigid gender norms.
    The Neural Network models were employed to investigate previously unidentified
    Non-Mutually Exclusive Sexual Violence connections, as well as to reveal the variables
    associated with violent encounters, exposure, knowledge, and availability of SRH
    services (Raj et al., 2021).


