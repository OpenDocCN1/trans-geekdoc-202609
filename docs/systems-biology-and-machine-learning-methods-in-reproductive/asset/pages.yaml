    # 6.2 SUPERVISED LEARNING


    +   - Involves the acquisition of knowledge via the use of labeled data, which
    consists of input–output pairs.

    +   - Establishes a correlation between input features and output labels using
    training data.

    +   - Estimates the underlying connection between the input characteristics and
    the output labels.

    +   - This enables the algorithm to make precise predictions on new data.


    # 6.2.1 Classification


    +   - Capable of categorizing data into distinct groups or categories depending
    on their specific features or attributes from a set of example observations.

    +   - Educate a decision function (classifier) that effectively assigns class
    labels to new and unseen observations by using the existing patterns.

    +   - ML approaches, such as decision trees, neural networks, naïve Bayes, random
    forests, k-nearest neighbors (KNNs), and support vector machines (SVMs), may be
    used for doing this task.


    # 6.2.1.1 Neural Network


    +   - Artificial neural networks (ANNs), also referred to as connectionist models,
    neurocomputers, or parallel distributed processing models, work similarly to the
    nervous system of living organisms.'
