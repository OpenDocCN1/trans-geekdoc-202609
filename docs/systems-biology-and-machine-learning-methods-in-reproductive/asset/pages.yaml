    # 6.2.2.5 Least Absolute Shrinkage and Selection Operator (Lasso) Regression


    +   • Also known as L1 regularization, introduces a component of penalty that
    is proportional to the true value of the coefficients in the least squares objective
    function.


    +   • Offers the unique ability to do variable selection by setting certain coefficients
