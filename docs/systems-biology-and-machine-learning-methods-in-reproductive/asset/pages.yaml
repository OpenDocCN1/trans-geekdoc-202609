    several factors, including the choice between fresh or frozen embryo transfers,
    the number of embryos transferred, and the method of endometrial preparation (Reig
    and Seli 2019).


    Genomics and transcriptomics techniques have revolutionized ART by uncovering
    the genetic variables that impact fertility and the growth of embryos. By using
    methods such as preimplantation genetic testing (PGT), they facilitate the identification
    and selection of viable embryos for transfer in the process of IVF. Transcriptomic
    analyses improve embryo selection strategies by identifying important gene expression
    patterns, increasing success rates, and assuring safer operations.


    # 3.4.2 Preimplantation Genetic Testing


    PGT is a medical treatment that entails extracting one or more nuclei from an
    egg or an embryo to examine for genetic alterations or aneuploidy before transferring
    the embryo (Lilienthal and Cahr 2020). PGT is founded on the idea that the genetic
    makeup of cells obtained from the preimplantation embryo accurately reflects the
    population of cells that will ultimately develop into the fetus (Herbert et al.
    2023). The primary objective of PGT is to mitigate the likelihood of conceiving
    a child who may inherit a genetic condition or chromosomal abnormalities. The
    general steps followed in PGT have been depicted in Figure 3.3.


    There are three distinct categories of PGT: PGT for aneuploidy (PGT-A), PGT for
    structural rearrangements (PGT-SR), and PGT for monogenic diseases (PGT-M) (Lilienthal
    and Cahr 2020).


    The fundamental objective of PGT-A is to evaluate the presence or absence of aneuploidy,
    therefore minimizing the likelihood of implantation failure, miscarriage (Lilienthal
    and Cahr 2020), or the occurrence of congenital diseases associated with trisomy
    (such as Edwards syndrome and Down syndrome) (Herbert et al. 2023). PGT-SR enables
    the selection of embryos with a presumably balanced set of chromosomes (Herbert
    et al. 2023). Structural chromosomal rearrangements (SRs) result in infertility,
    recurrent failure of embryo implantation, miscarriages, and children with congenital
    abnormalities, even when the carrier parents seem to have no visible physical
    characteristics (Griffin and Ogur 2023). PGT-M is used to identify certain genetic
    abnormalities in embryos. It is'
