  md: '# 2.1.1 Commonly Used Data Sources


    Table 2.1 describes commonly used sources, which are enlisted along with acronyms.


    # 2.2 IDENTIFYING ISSUES IN NEONATAL AND MATERNAL HEALTH


    # 2.2.1 Role of Clinical and Administrative Data


    Various sources of population-level data were employed to identify factors impacting
    the health of both mothers and children. One prominent source is electronic health
    records (EHR), which encompass demographics, anthropometrics, diagnoses, vital
    signs, medications, and diverse clinical data, offering a comprehensive overview
    of a patient’s health history. Operational insurance claim data, known for their
    large sample sizes across wide geographic regions albeit with less detailed information,
    have demonstrated efficacy in constructing and analyzing cohorts related to pregnancy
    (Marić et al. 2020). Research leveraging EHR-based models to forecast conditions
    such as gestational diabetes mellitus (GDM), preeclampsia, and preterm birth (PTB)
    underscores the importance of these data sources in the field of reproductive
    health. Furthermore, markers like proteinuria and bacteriuria, identified through
    urinalysis and urine culture, serve as dependable predictors for severe conditions
    such as preeclampsia (Tanaçan et al. 2019). Recent advancements in artificial
    intelligence (AI) have enabled clinicians to incorporate these vital, cost-effective
    tests into more advanced predictive and diagnostic models than were previously
    achievable (Burton et al. 2019).


    # 2.2.2 Insights from Epigenetics and Genetic Data Sources


    The occurrence of pregnancy is influenced by both the genetic background of the
    mother and the epigenetic programming of the fetus. Maternal genetic variations
    impact crucial developmental processes like decidualization and placentation;
    however, the delicately balanced immunological state characterizing embryonic
    and fetal development is shaped by the genetics of both the mother and the fetus
    (Huusko et al. 2018). Although the genetic factors influencing different pregnancy
    complications are expected to be polygenic, genome-wide association studies (GWAS)
    have identified specific genetic variants linked to spontaneous preterm birth
    (sPTB), demonstrating the influence of a mother’s genetic makeup on fetal development
    and pregnancy outcomes even prior to conception. Conversely, maternal epigenetic
    modifications reflect the status of various cell types across tissues as they
    undergo reprogramming to support fetal growth. Evaluating these alterations—through
    analysis of DNA methylation, histone markers, and chromatin accessibility in the
    relevant cell subsets—offers insights into whether specific cell types at the
    maternal–fetal interface are suitably adapted for a successful pregnancy (Kwak
    et al. 2019).


    # 2.2.3 Elucidating Biological Pathways Using Omics Data


    In addition to genetic and epigenetic information, employing high-throughput methods
    to investigate the maternal transcriptome, metabolome, proteome, and microbiome'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'can offer a more comprehensive understanding of the biological status of the
    mother. Given the extensive alterations in tissue-specific gene expression in
    maternal tissues during pregnancy, coupled with concurrent metabolic, hormonal,
    and immunological adaptations, diverse modalities can unveil various facets of
    maternal and fetal health at specific time points (Handelman et al. 2019). For
    instance, cell-free RNA (cfRNA) extracted from blood or amniotic fluid can be
    employed to monitor the dynamics of fetal development and placentation, offering
    implications for the early detection of pre-eclampsia by identifying markers of
    impaired placentation in maternal plasma (Park et al. 2021). Microbiomics, conversely,
    can explore the vaginal, oral, and gut microbiomes, all of which are vital in
    preserving the immunological equilibrium required for fetal tolerance (Mei et
    al. 2019). Disruptions in the vaginal microbiome, as evidenced in bacterial vaginosis,
    can potentially result in PTB due to inflammatory mechanisms or intra-amniotic
    infections prompted by vaginal microorganisms. Likewise, pathogenic oral microorganisms
    can exacerbate PTB by inducing systemic inflammation stemming from oral ailments
    or hematogenous spread to the amniotic fluid (Cobb et al. 2017). Lastly, the gut
    microbiome, which influences the metabolism of small molecules and hormones while
    also regulating metabolic and immunological functions, has been associated with
    GDM and PTB when its equilibrium is disturbed (Yang et al. 2020). In summary,
    a variety of omics technologies possess substantial promise for elucidating the
    molecular constituents of pregnancy-related disorders.


    # 2.3 USE OF MODELLING USING MACHINE LEARNING


    # 2.3.1 Machine Learning


    Machine learning encompasses diverse statistical techniques employed to draw inferences
    from data based on a set of attributes (e.g., clinical measurements of patients)
    (Wainberg et al. 2018). Supervised learning entails algorithms that learn to forecast
    a particular attribute or outcome (e.g., PTB) associated with a given set of features.
    It is labeled “supervised” because the outcome is known for a sufficiently large
    dataset (number of patients), facilitating the identification of a relationship
    between the features and the outcome, thereby enabling the development of a predictive
    model. In contrast, unsupervised learning lacks prior knowledge of the outcome
    and seeks to uncover concealed patterns or structures within the data (Wang 2001).
    Semi-supervised learning merges elements of both supervised and unsupervised learning,
    where the outcome is known for a limited number of samples. In the realm of pregnancy,
    the primary emphasis is on supervised learning, which involves utilizing information
    such as medical history or measurements from an omics assay (input) to forecast
    outcomes like gestational age (GA) or PTB (output). Usually, the input is structured
    in a tabular format, where each row denotes a sample, the columns represent categorical
    or numeric data, and the output is a single outcome.'
