  md: '# 6.7.7 Female Factor Infertility


    The Naïve Bayes’ Classifier, C4.5 decision trees algorithm, and Multi-layer Perceptron
    (MLP) were implemented using the WEKA environment. They were evaluated using the
    10-fold cross-validation method to predict infertility likelihood in women and
    derive a general principle for analyzing patient risk factor data to forecast
    the chance of infertility. The MLP and C4.5 algorithms demonstrated superior performance
    compared to the Naïve Bayes’ Classifier, achieving an accuracy of 77.4% (Balogun
    et al., 2018).


    # 6.7.8 Male Factor Infertility


    The models Random Forest, Stochastic Gradient Boosting, Lasso, Ridge Regression,
    and XGBoost were trained on a dataset that was randomly divided into 80% for training
    and 20% for testing. The models were then evaluated using four key evaluation
    metrics: relative absolute error, symmetric mean absolute percentage error, root
    relative squared error and root mean squared error. The best-performing model
    for each of the models was selected based on hyperparameter tuning and validation
    using a 10-fold cross-validation method. The goal was to construct a predictive
    model for identifying important risk factors affecting sperm count, as described
    by Huang et al. (2023). The top factors contributing to sperm count, based on
    results obtained by the five ML paradigms, were ranked respectively as alpha-fetoprotein,
    sleep time, body fat, blood urea nitrogen, systolic blood pressure, body mass
    index, uric acid, cholesterol to high-density lipoprotein ratio, total cholesterol,
    and waist–hip ratio.


    Akinsal et al. (2018) examined the use of ANNs in identifying azoospermic patients
    who require further genetic evaluation based on factors such as total testicular
    volume and LH levels, in interpreting sperm morphology and predicting semen quality,
    as well as in recognizing biomarkers for infertility (Akinsal et al., 2018).


    # 6.8 CHRONO-DISRUPTION IN BIOMARKERS


    The research by Rúa et al. (2023) used the amalgamation of outcomes of decision
    tree-based methods – CART trees (rpart and rpart2) and Random Forest (randomForest)
    algorithm through R programming language and consensus criteria, to mitigate biases
    for small sample size for the construction of classification models and feature
    selection to uncover biomarkers associated with the conditions that disturb the
    body’s internal clock and examine their impact on reproductive health. Eating
    patterns, social jet lag, sleep quality, and sleep duration affect the reproductive
    health and mental health of the expectant mother during and after pregnancy (Rúa
    et al., 2023).


    # 6.9 INFANT MORTALITY


