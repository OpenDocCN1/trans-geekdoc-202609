  md: '# 2.9 ONLINE DATA INTEGRATION STRATEGIES


    +   • Integrating Omics Data for Disease Gene Discovery


    Traditional methods for combining omics data in disease gene discovery can miss
    important leads. We propose a new framework based on desirability functions that
    seamlessly integrates diverse omics data and prioritizes candidate genes supported
    by strong evidence across multiple sources. This method is particularly suitable
    for analyzing diseases with limited and varied omics data, like sPTB. Using our
    integRATE R package, we successfully applied this framework to 10 sPTB studies,
    identifying both known and novel genes potentially involved in this condition
    (https://github.com/haleyidem/integRATE).


