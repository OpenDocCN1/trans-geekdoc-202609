  md: '# 2.4 USE OF TIME SERIES DATA


    Clinical time series data play a pivotal role in monitoring patients in real-time
    settings like the intensive care unit (ICU) and retrospective scenarios for prolonged
    monitoring and diagnoses. In pregnancy, fetal heart rate analysis is a relevant
    example used to detect pathological fetal conditions such as perinatal hypoxia,
    fetal growth restriction (FGR), and fetal arrhythmias and heart anomalies (Marzbanrad
    et al. 2018). Typically, practitioners extract various quantitative parameters
    related to fetal conditions, such as short-term variability (STV) and long-term
    irregularity (LTI), from fetal heart rate measurements. These parameters are either
    directly interpreted or transformed into a tabular format suitable for machine
    learning applications (Signorini et al. 2020). Indeed, advanced machine learning
    techniques, including deep learning and recurrent neural networks, hold promise
    in directly modeling and predicting pathological fetal conditions (Fawaz et al.
    2019). These techniques leverage the power of AI to analyze complex data patterns
    and provide more accurate predictions compared to traditional methods.


    As an example, deep learning can be employed directly on cardiotocography (CTG)
    recordings for fetal academia prediction, eliminating the need for manual feature
    extraction like STV and LTI markers. In this approach, deep learning architectures
    are tailored to analyze raw data, potentially revealing previously unknown markers
    to clinicians. The application of sensors and actigraphy to observe sleep quality,
    activity patterns, and movement in individuals presents a novel method for measuring
    lifestyle-related behaviors that could affect health (Souza et al. 2019). Although
    this method has received limited attention, research suggests that changes in
    sleep patterns during pregnancy may result in varying gene expression in mothers
    (Carroll et al. 2020). Machine learning methods designed for time series data
    analysis can be utilized to examine smartwatch and actigraphy data, offering valuable
    insights into different pregnancy-related parameters. Moreover, given the widespread
    use of smartphones and wearable gadgets, a broad array of techniques for activity
    recognition and semantic behavior analysis are now accessible, allowing for a
    more comprehensive exploration of potential behavioral risk factors (Nweke et
    al. 2018).


