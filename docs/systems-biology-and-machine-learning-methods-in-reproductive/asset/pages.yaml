  md: '# 9.2 GENOMIC EVOLUTION OF REPRODUCTIVE HEALTH


    Carcinogenesis is the transformation of normal cells into cancer cells, a complex
    process characterized by various genetic and epigenetic changes. Oncogenesis in
    this context arises from a multitude of genomic and epigenomic alterations within
    these cells. Globally, 25% of newly diagnosed instances of male cancer are PCa.
    The prevalence of PCa rises sharply with age, from 166 to 800 cases per 100,000
    males aged 55–59 to 75–79, respectively (Ntekim et al., 2023). Generally, genomic
    instability is considered a key component of human cancer, including oncogene
    activation and tumor suppressor gene inactivation which may drive abnormal cell
    growth. Oncogenes cause aberrant cell proliferation due to genetic changes that
    either boost gene expression or cause uncontrolled activation of the oncogene-encoded
    proteins. The modifications in PCa are mostly caused by structural genomic rearrangements
    over time, which lead to gene amalgamations, amplifications, and omissions (Li
    and Ralph, 2019). It often begins with genetic mutations in normal prostate cells,
    leading to the initiation of cancerous growth. Common early mutations involve
    genes such as PTEN, TP53, and TMPRSS2-ERG rearrangements. Loss of the tumor suppressor
    gene PTEN is a frequent event in PCa, leading to increased cell proliferation
    and survival. Thus, activation of proto-oncogenes and suppression of tumor suppressor
    genes within the mitogen-activated protein kinases (RAS/MAPK), STAT3, and PI3K/AKT
    signaling pathways is correlated with the onset, development, and advancement
    of PCa (Rybak et al., 2015). Normal genes known as proto-oncogenes influence normal
    cell growth and proliferation, but if their expression is changed, they may also
    play a role in the formation of cancer. Deletions in genes such as NKX3-1, PTEN,
    BRCA2, and RB1 are common in initial instances, but metastatic cases exhibit chromosomal
    augmentations affecting androgen receptor pathway genes and the MYC oncogene.
    At least 20 mutations affect protein function in PCa, serving as a key tumor suppressor
    gene even as castration-resistant (hormone-refractory) prostate cancer (CRPC),
    which accounts for the majority of PCa deaths, is a result of androgen-dependent
    carcinomas that advance through oncogenic signaling pathways during the carcinogenesis
    of the prostate (Rybak et al., 2015). In hereditary cases, PCa shares a close
    link with hereditary breast cancer, especially through BRCA1 and BRCA2 mutations.
    Carriers of mutations exhibit a 3.8-fold (BRCA1) or 8.6-fold (BRCA2) increase
    in PCa risk. BRCA2 mutations indicate aggressive disease with higher mortality
    rates, affecting around 5% of advancing PCa cases. The hereditary element is exemplified
    by the BRCA2 gene on chromosome 17p, associated with DNA cross-link repair enzymes.
    Specific genes like Arg293X and Asp175Ty have been identified in familial PCa,
    while HOXB13 G84E polymorphisms suggest elevated risk which demonstrates the critical
    role that genetic assessment plays in assessing and managing cancer risk further
    affecting RH (Huang and Cai, 2014).


    The different stages of PCa are shown in Figure 9.1.


    Some of the major treatment options include active surveillance measures, chemotherapy,
    and radiation therapy combined with hormonal therapy which has been shown to enhance
    survival rates, for example, stereotactic radiotherapy for low/intermediate'
