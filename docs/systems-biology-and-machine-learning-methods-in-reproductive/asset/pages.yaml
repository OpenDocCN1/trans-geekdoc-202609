  md: '# Ethics and Privacy Considerations


    Puja Singh and Satish Singh


    # 8.1 INTRODUCTION


    # 8.1.1 Confidentiality and Privacy


    # 8.1.1.1 Confidentiality


    Confidentiality is the ethical and legal responsibility to protect information
    shared by an individual with a professional or an organization. This information
    should not be disclosed to unauthorized persons without the consent of the person
    who gave it.


    # 8.1.1.2 Privacy


    Privacy is the right of individuals to keep their personal information protected
    from unwarranted intrusion. It encompasses the idea that individuals have control
    over who can access their details and under what circumstances.


    +   - Patient Confidentiality


    Patient confidentiality is one of the pillars of ethical healthcare practices,
    especially in reproductive health. Due to the sensitive and personal nature of
    reproductive health information, a heightened commitment is required to preserve
