    women identified several gene variations, including rs6166 of the FSHR gene, rs13405728
    of the LHCGR gene, rs13429458 of the THADA gene, and others, which may contribute
    to the hereditary risk of PCOS in Asian women (Wan et al. 2021). Furthermore,
    GWAS demonstrated that the genes ERBB4, YAP1, and WWTR1 have a role in the complex
    etiology of PCOS. This is achieved by the activation of epidermal growth factor
    receptors or EGFRs, and the Hippo pathway, as reported by Zhang et al. in 2020.
    Moreover, the genotyping analysis of 152 women suffering from primary dysmenorrhea
    versus 150 individuals without any health issues revealed that there were substantial
    statistical differences in the ESR1 gene PvuII polymorphism between the patients
    and controls (Ozsoy et al. 2016).


    In addition, recent epigenome-wide association studies (EWAS) have shown a strong
    link between factors like maternal smoking during pregnancy, maternal folate levels,
    air pollution caused by traffic, exposure to particulate matter during pregnancy,
    and significant alterations in methylation patterns in newborns. The presence
    of these changes in methylation has been linked to a higher likelihood of preterm
    delivery (Park et al. 2020). Similarly, WGS, WES, and trio bioinformatics analysis
    were conducted on eight couples who experienced unexplained recurrent miscarriage
    (URM), which revealed six candidate genes that were previously unknown, namely
    ATP2A2, SSPO, NAP1L1, PLXNB2, NRK, and RYR2. These genes were found to be associated
