    methods for transcriptional profiling in the early 2000s. Microarray technology
    enables the simultaneous analysis of thousands of transcripts at a far lower cost
    per gene and with decreased labor requirements. The results from gene expression
    microarrays have yielded significant insights into the deployment of the transcriptome
    in various tissues and cell types, the changes in gene expression during different
    developmental stages and disease phenotypes, and the variations across and within
    species (Lowe et al. 2017).


    # 3.3.2.2 Bulk-RNA Sequencing


    Bulk-RNA Sequencing, often known as RNA-Seq, is a method used to sequence complementary
    DNAs (cDNAs) derived from transcripts, to determine their abundance based on the
    count of each transcript. RNA-Seq utilizes extensive transcriptome sampling using
    several short fragments from a transcriptome. This allows for the computational'
