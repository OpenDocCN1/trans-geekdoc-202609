- pgno: 14
  md: '# Explainable Artificial Intelligence Overview


    Ethical and legal concerns are a very important component of AI systems in today''s
    digital world and XAI is very useful feature of trustworthy AI. XAI empowers users
    to answer extremely important questions like “how” and “why”.


    # 1.2 Importance of Explainability


    There are mainly two categories of users exploring their mobile gadgets with AI
    enabled mobile applications. The first category is the technical, domain experts
    or literate people who really want to understand the technicality of the AI system
    outputs and inferences. These inferences they use further for domain analysis.
    The second category of the users is layman users who are more interested in the
    explanation and justification of the AI system outputs as they are not familiar
    with the technology. For this category of users, XAI is more fascinating and useful
    as if it helps to provide more detailed information about the outputs [7]. In
    both users, fairness in output, trust in the results and biases, if any, are key
    advantages of XAI systems. The level of explainability varies based on the underlined
    applications and it is important to understand the notable importance of XAI with
    reference to the various performance metrics.


    The key points related to the XAI systems are:


    +   1. **Transparency and trust**: Explainability helps build transparency in
    AI systems by providing insights into how and why decisions are made. When users
    can understand the reasoning behind AI predictions or actions, they are more likely
    to trust the system and its outcomes.

    2. **Ethical and legal compliance**: Explainability is increasingly becoming a
    requirement in various sectors. Regulations and laws, such as the draft EU Regulation
    and antidiscrimination laws, mandate explainability to ensure compliance and prevent
    unfair or biased practices.

    3. **Avoiding expense**: By enabling analysts and users to understand the decisions
    made by AI systems, explainability can help avoid the additional costs associated
    with hiring data experts or consultants to interpret the outputs.

    4. **Addressing bias and fairness**: Explainability allows for identification
    and mitigation of biases in AI systems. It helps uncover potential discriminatory
    patterns and ensures fairness in decision-making processes.

    5. **Accountability and debugging**: When AI systems make errors or produce unexpected
    results, explainability enables users to trace the decision-making process and
    identify the root causes. This helps in debugging and improving the system''s
    performance.

    6. **Human-AI collaboration**: Explainability promotes collaboration between humans
    and AI systems. It allows users to work alongside AI models, understand their
    limitations, and provide feedback for continuous improvement.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Explainable Artificial Intelligence Overview


    However, to bring XAI into actual practice and incorporate XAI features into XAI
    systems, certain principles and practices are recommended. It is very important
    for XAI systems to supplement outcomes with reasoning and evidence to humans.
    Just producing the outcomes with XAI features is not sufficient to name it as
    an XAI enabled system. Organizational governance to monitor the ethical use of
    XAI is very important. It requires some regulatory guidelines issued by some standardization
    bodies to control the integration of explainable features into AI systems. Exploring
    various tools, frameworks and libraries and integrating them into XAI application
    development is a crucial step. Integration of such tools to understand and explain
    the outcomes of ML and DL models needs more attention. Although XAI is now in
    the development stage, knowledge transfer to enable technological transformations,
    research and training is also important to reach XAI to certain level.


    # 1.3 Components of Explainable Artificial Intelligence


    XAI components play a vital role in the performance analysis of XAI systems and
    applications. However, these components vary based on the type of application,
    context and particular techniques used for explainability. Figure 1.2 presents
    these key components and what they are:


    +   1. **Interpretability**: Interpretability refers to the ability to understand
    and explain the decision-making process of AI models. It involves providing insights
    into the internal workings of the model, such as the features or factors it considers
    and the relationships it.

    2. **Transparency**: Transparency involves making the decision-making process
    of AI models visible and understandable to humans. It aims to provide clarity
    on how the model arrives at its predictions or decisions.

    3. **Traceability**: Traceability refers to the ability to trace and explain the
    steps and factors that contribute to the model''s outputs. It allows users to
    understand the reasoning behind each decision and identity of biases or errors.

    4. **Accountability**: Accountability involves making AI systems responsible for
    their decisions and actions. It involves the ability to attribute decisions to
    specific factors or inputs and identify any biases or ethical concerns.

    5. **Validation and verification**: XAI includes methods for validating and verifying
    the performance and reliability of AI models. It allows users to assess the accuracy,
    fairness and robustness of the model''s outputs.

    6. **Human-interpretable explanations**: XAI aims to provide explanations that
    are understandable and meaningful to humans. This involves presenting explanations
    in a format that is easily interpretable, such as natural language descriptions
    or visualizations.


