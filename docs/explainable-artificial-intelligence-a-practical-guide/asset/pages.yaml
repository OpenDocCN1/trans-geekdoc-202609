    In general, we can split the explanations into two categories based on usability
    and correctness. Usability does not consider the content of the explanations for
    evaluation while correctness considers the existence of a ground truth for evaluations
    like the ground truth in a supervised learning algorithm. The usability aspects
    are further classified depending upon the effectiveness of explanation and effectiveness
    of functionality to end users. Since the dataset against which the model is trained
    does have explanations of truth that directly specifies the important features
    that guide the predictions/outcomes, a quantitative study/metric for evaluation
    of correctness does not exist. However, significant attempts have been done where
    the authors [12] have attempted to represent real-world classification tasks by
    coding the explanations into the dataset using formal grammar and have introduced
    an evaluation metric called k-accuracy for the same which is believed to act as
    an agreeable benchmark to compare feature importance AI methods. We propose a
