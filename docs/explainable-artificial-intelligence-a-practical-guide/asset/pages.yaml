    nematodes, and phytoplasmas, which infect crops and impair their growth, development,
    and yield potential. Common plant diseases include blights, rusts, powdery mildew,
    wilts, and viruses, which affect a wide range of crops such as wheat, rice, maize,
    potatoes, tomatoes, and bananas. Plant diseases can spread rapidly under favorable
    environmental conditions, leading to epidemics and crop failures that devastate
    livelihoods and food supplies [12].'
