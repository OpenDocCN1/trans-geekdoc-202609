- pgno: 18
  md: '+   • They can be difficult to estimate and require large amounts of data.

    • They may be subject to bias and confounding.


    Anchors [13] are methods that use a decision rule as an anchor to explain the
    model''s predictions. The explanations explain the feature space in the form of
    IF-THEN statements. The choice of good anchors helps classification to be unchanged
    despite the variance observed across feature values in data points that are not
    part of the chosen anchors. Good anchors are justified based on their precision
    and convergence. Precision refers to the number of data points in a region belonging
    to the same class as the data point defined by the anchor. Convergence refers
    to the applicability of the anchor''s decision rule to several data points. In
    general, it is desirable for anchors to cover a much larger feature space to establish
    a generalized rule.


    # Advantages


    +   • Anchors being model agnostic makes it applicable to any model and various
    domains such as image, text and tabular data.

    • Anchors represent the boundaries within which they are applicable making it
    easier to define and interpret the score.

    • Anchors can be used as a measure to validate the model''s fidelity based on
    the decision rule''s coverage.

    • Decision rules are easy to understand.


    # Disadvantages


    +   • The establishment of good anchors involves calculations and tuning of many
    individual hyper-parameters such as precision, the width of the beam, and threshold.

    • Calculations of anchors involve intensive computations due to the numerous calls
    to the prediction function.

    • Data points close to the boundaries need to be administered with complex rules
    involving more features and lesser coverage.


    Layer-wise relevance propagation (LRP) [14] uses the internal details of the model
    as the weights, activations, biases, etc. to explain the predictions based on
    propagation. LRP thus explains the model stepwise by redistributing the factors
    layer by layer light right from the output to the input variables. Each of these
    redistributions at the layers is in treated as a simple solution to the explanation
    problem.


    # Advantages


    +   • LRP is highly efficient in terms of computations.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - LRP is well established and a popular XAI method. Therefore, a wide range
    of literature is available on this method making it a trustworthy and robust explanation
    method.


    # Disadvantages


    +   - LRP lacks flexibility. Redistribution of rules must be done carefully to
    be adapted to novel model architectures.


    g. **Integrated gradient [15]** is a method that assists in providing local explanations
    for individual predictions. The gradients of the model''s output are used to assign
    importance values to the input features. The two axioms that form the building
    blocks of integrated gradients are sensitivity and implementation invariance.
    Sensitivity holds when input and baseline differ in one feature and have different
    predictions, then the feature causes the difference is given non-zero attribution.
    Implementation invariance suggests that in the case where two networks exhibit
    functional equivalence when the inputs and outputs are equal, with differing implementations,
    then their attributions are also identical.


    # Advantages


    +   - Applicable to all differential models and deep neural networks.


    +   - The dependence upon sensitivity and implementation invariance makes it theoretically
    sound approach.


    +   - It exhibits strong computational efficiency and works on gradient information.


    # Disadvantages


    +   - The attributions are greatly influenced by the need for an observed baseline
    selection.


    +   - The path between the baseline and point of interest (shortest path) along
    which the integration of gradients is done in most cases does not cover the data.


    +   - Gradient shading is a common problem in deep models.


    g. **Explainable graph neural networks (XGNNs)** [16] is a post-hoc explanation
    method (explainations are given after the model performs predictions). It provides
    global explanations (overall model prediction explanations) instead of individual
    local instances. It adopts recurrent learning to develop a graph from a randomly
    chosen node and prior knowledge. The system is rewarded accordingly whenever a
    valid graph is generated by the GNN while meeting the domain requirements.


    # Advantages


    +   - It is the only method to provide GNN architectures with a model-level explanation.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Explainable Artificial Intelligence Overview


    +   - It serves as an efficient way to overcome the problem of non-differentiation
    as the GNNs are trained with aggregations and combinations.

    - It is most suitable for huge datasets where verification of outcomes is human
    impossible.


    # Disadvantages


    +   - The explanation is particularly suitable only for the classification of
    graphs.

    - The explanations are built alongside the network graphs where GNNs are most
    responsive, which is not suitable as we are unclear about the contributions of
    the graphs in the other parts of the network.

    - Since the datasets lack ground truth, the explanations provided by this method
    are not concrete. Proper validations do not exist for such explanations.


    SHAP: Shapley additive explanations [1] is an additive feature attribution method
    that is based on game theory. Shapley values are calculated and assigned to each
    of the sample''s features. These Shapley values depict the level of impact/importance
    of the associated features towards a particular prediction. However, the calculation
    of Shapley values can sometimes become intractable for a few features for which
    a variant called the Kernel SHAP serves the purpose. It is based on weighted linear
    regression. The coefficients of the built-weighted linear model are compiled to
    form the Shapley values.


    # Advantages


    +   - The property of SHAP in which the values sum up to model prediction is a
    desirable feature in which we can add decompose the whole prediction into individual
    component-level contributions.

    - SHAP is a local explanation method (explains individual instances of the sample),
    but the predictions can still be aggregated to provide a global explanation of
    the model''s prediction.


    # Disadvantages


    +   - Shapley values are computationally intensive.

    - When the sample has features that are highly dependent or correlated, Shapley
    values tend to create extrapolation in areas with sparse data. Although a feature
    contributes very merely to a prediction, SHAP still assigns a non-zero value.


    A summary of the above-discussed methods and specific characteristics is presented
    in Table 1.1.'
