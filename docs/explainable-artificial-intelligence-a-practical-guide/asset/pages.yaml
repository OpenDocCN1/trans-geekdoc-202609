    In all, considering the above literature it can be concluded that:


    +   - Most of the study is inclined towards supervised machine learning algorithms.
    Unsupervised machine learning algorithms need to be explained considering their
    effectiveness in prediction and classification.

    - Deep learning methods are less visited in the literature and need to be explored
    further.

    - Proper evaluation metrics for explanations must be formulated pertaining to
    the application in place. Measures evaluating functionality (interpretability,
    actionability) and usability (soundness, consistency, robustness) should also
