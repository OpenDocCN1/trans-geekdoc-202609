    # ## 2.3 XAI Evaluation


    Mechanisms to evaluate the explanations provided by the XAI model are important.
    Let''s consider the healthcare use case. There exist different users of the system
    such as the end users, decision makers as the medical officers, nurses, etc.,
    in a healthcare environment who make critical decisions related to the patient''s
    medical treatment based upon the results generated by the system, data scientists
    who look to improve the model and regulatory agencies who verify the compliance
    to rules. Each of these users has different goals for the explanations as presented
    in Figure 2.5 and evaluation of the explanations should be tuned towards the users
    and their explanation goals, as simply understanding the predictions and increasing
    the trust, model verification and model debugging.


    Explanations can be presented in different forms such as Excel sheets, highlighting
    parts of images that contributed to the decision, heat maps, etc. In many cases,
    the explanations are not dependent on the choice of metrics or'
