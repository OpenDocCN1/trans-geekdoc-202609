- pgno: 37
  md: '# Understanding Black Box Models


    The measure that evaluates the dependence of the model on a particular feature
    refers to soundness. This can be done by choosing a particular feature (for example
    a feature that has the highest importance value) to be removed and retraining
    the model to check the outcome (selectivity). The opposite can also be done by
    starting the training from just one feature and then adding features and retraining
    the model to see the outcome (monotonicity).


    Robustness checks the stability of the model in the presence of undesirable noise
    features. The addition of noise features to the dataset from a different distribution
    should not affect the explanations. Transparency refers to the measure that helps
    verify that the model''s decisions are made by considering the right reasons that
    contribute to the decision. For example, a wolf and a husky dog should be identified
    by their features such as shape of eyes, etc. and not by the presence of snow
    in the background. Metrics such as point-level decisions, aggregate decisions
    and sensitivity can be used to evaluate the transparency of the model. Point-level
    decisions are explanations that explain individual decisions and present the users
    with an alternate course of action that can be taken to change/improve the decision.
    The aggregate decision is a metric that enables the identification of the features
    that act as the overall drivers of the model. It helps exactly locate the information
    and explain the reasons for the model''s performance on a larger scale. Sensitivity
    is a metric that enables visualization of the feature''s contribution to the decision-making
    process of the model. Influence sensitivity plots, partial dependence, and accumulated
    local effects plots are some tools that can be used for visualizing the sensitivity
    of the model. Interpretability refers to the accuracy with which model associates
    the cause with its effect. In simple terms, if a model accepts inputs and consistently
    provides the same results then the model is interpretable.


    Fairness refers to the ability of the model to predict classifications without
    any bias. Evaluations are done in terms of impartiality and discrimination. Statistical
    methods, such as hypothesis testing, ANOVA testing, impact testing, etc., can
    be used as metrics to evaluate the fairness of explanations.


