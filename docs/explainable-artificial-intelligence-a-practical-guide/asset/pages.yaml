  md: '# 2.5 Issues and Challenges


    Although XAI has been effectively used in a wide range of domains, the automated
    decision-making process in critical application domains, such as banking, healthcare,
    etc., raises concerns about upholding the fundamental rights of users.


    # 2.5.1 Legal requirements: Expanding XAI to interpretable and actionable AI


    The legal requirement in the critical automated decision-making process emphasizes
    the involvement of human users. Enabling them to assess the decision process,
    express their point of view and contest the decision if required is an important
    process mentioned in the GDPR. Ensuring compliance with the data protection rules
    and regulations laid down by specific government organizations is of prime importance
    in critical automated decision-making applications. Hamon et al. [21] explained
    the necessity to incorporate explainability in the system to explain the compliance
    to rules and regulations thereby implementing trustworthiness in the critical
    automated decision-making systems by design. Furthermore, they emphasized the
    fact that, although mechanisms to document and audit the logic of the underlying
    algorithm in decision making are in place, the increased complexity of AI-based
    algorithms makes it difficult to present the outcomes in an understandable format
    to humans. Upholding the "right to explanation" is a tedious aspect to address
    as the evaluation of the relevance of the explanations from a legal perspective
    and the establishment of strong causal links between the input data and the outcomes
    is not agreeably established. Understanding the context of the application should
    also be considered when evaluating the relevance and adequacy of explanations.


    While explanation refers to providing an explanation of the system''s internal
    work to the users, interpretability refers to the transition that occurs when
    the cause and effect of the AI system''s decision are understandable to the users.
    The decision of an AI system beside contextual. Objectives and situations keep
    varying in time. Therefore, it is important that the decisions consider all possible
    future effects, or the AI system proposes a decision that considers the most probable
    future event and presents it to humans using XAI. This will enable the users to
    make informed decisions in critical situations. Further, the actionability of
    the AI systems includes providing a level of confidence associated with a particular
    course of action. Albeit the incorporation of these'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'features into an explainable AI framework comes with a set of challenges, as

    discussed below.


    # 2.5.2 Challenges in providing a human-understandable explanation for AI-based

    decision-making systems


    Consider a scenario wherein a person suspects they have a COVID-19 infection

    and therefore presents themselves at the emergency ward for observation. After

    blo test, a nurse conveys reports to suggest a possibility of COVID-19

    infection. In such cases, the patient is examined by the doctor and admitted to

    the intensive care unit anticulating damage due to pneumonia. However,

    when a doctor is not available, an AI-based automated decision-making system

    can make recommendations based on the X-ray images. Bringing the automated

    decision-making system into the process mandates the implementation of the

    fundamental rights of the users as mentioned in the previous paragraphs.

    Involving humans in the process requires explanations. The wide range of

    technical aspects that challenge the feasibility of providing explanations to
    AI-

    based models is presented below in this section with the help of above

    case.


    +   (a) Complexity of data


    The increased storage facilities of devices and digitalization of equip-

    ment have supported the collection of diverse data including images, text,

    tabular data, graphs, and many more. The technological assistance in these

    devices also facilitates the detailed collection of data. For example, in the

    scenario presented above, the X-ray in medical imaging data consists of numer-

    able pixels with larger spatial information of organs including various color

    codes.


    +   (b) Complexity of models


    The models used in machine learning play an important role in trans-

    forming the input data into predictions. The model''s complexity is increased

    by stacking multiple layers of simple operations to solve complex

    tasks. This effectively affects the interpretability of the model. For example,

    in the use case presented above, the deep learning model generally consists of

    multiple layers with a series of operations and parameters. The deeper layers

    have complex patterns that are difficult to be interpreted by the practitioners

    themselves.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Understanding Black Box Models


    +   (c) Complexity of AI algorithms


    The development of an AI-based system involves a systematic sequence of steps,
    namely data processing, training and evaluation. Implementing these steps involves
    several processes as cleaning, data acquisition, feature extraction, sample generation,
    optimization processes, and many more. After the model has been trained, its performance
    is evaluated against suitable metrics. The complexity that comes with the incorporation
    of all the above-mentioned steps makes it difficult to reverse engineer the results/predictions,
    thereby making it difficult to perform audits on the respective algorithms.


    +   (d) Complexity of explanatory techniques


    The techniques used for explanations vary depending on the AI models since different
    models depend upon different features for classification and decision making.
    Hence, in the case of the medical imaging use case, methods such as occlusion
    maps are used where the abnormality in a particular region is identified with
    the head of a prediction score for a masked region on the image. A high score
    indicates a non-infection in the deep area. Other methods include gradient descent,
    counterfactuals, etc., all of which do not guarantee that the indicated regions
    are the ones considered in the decision making. The selection of proper parameters
    such as the appropriate size of the masked area and step size for movement also
    influences the outcome.


    +   (e) Trade-off between accuracy and explainability


    In general, the two desirable properties of a system include its accuracy (perform
    computations with fewer errors) and interpretability (ability to explain the internal
    workings of the system). However, achieving one property comes at the expense
    of the other. A method that is interpretable would involve constraints that reduce
    the complexity of the system such as a reduction in the number of features/parameters
    to be considered, thereby reducing the accuracy of the model. For example, in
    the COVID-19 use case, deep learning methods have increased their accuracy by
    increasing the complexity of the models. This has made it difficult to provide
    explanations for such complex systems.


