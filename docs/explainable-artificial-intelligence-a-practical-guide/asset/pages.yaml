    # 1.4 Features of Explainable Artificial Intelligence


    Having present commonly used explanation methods, the question arises of how to
    choose a suitable technique that fulfils the required goal. Explanation evaluation,
    which we will discuss in the next section, to understand how efficiently the explanations
    satisfy specified goals. However, the choice of suitable explanation methods can
    be done by considering our needs, as shown in Figure 1.3.


    The four major factors that contribute to the selection of a suitable explanation
    type are as follows:


    +   1. Scope of explanation and type of output: The scope of explanation can be
    local or global. When individual instances are explained using specific features/drivers
    it is to be a local explanation. Data scientists can further aggregate the individual
    decision decisions to over the model''s prediction, forming a global explanation.
    Secondly, apart from the number of outputs/predictions we want to explain (local/global),
    the type of output also plays a role in the choice of explanation method. For
    example, a model that decides whether to offer an individual or not performs the
    task by assigning probability scores'
