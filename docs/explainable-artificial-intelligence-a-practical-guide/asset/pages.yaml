  md: '# Explainable Artificial Intelligence Overview


    4. Stage of applicability refers to time of model development the explanation
    is to be generated. Some models such as the decision tree and logistic regression
    are inherently self-explainable, and their predictions can be interpreted at the
    time of training. They are also called white box models. Other models which are
    not transparent are called black box models whose interpretations can be explained
    after the training process and are post-hoc explanations. Despite their opaque
    nature, black box models are widely used for real-life applications due to their
    efficiency.


    Key applications of XAI are listed below:


    +   * **XAI for human-interpretable explanations:** XAI can help improve trust
    in end users by providing explanations for decisions or predictions in an understandable
    format. This will in enable users to be more aware of the reasons behind the decisions,
    establishing concrete causal relationships between the outcomes/predictions and
    the results.


    +   * **XAI for machine learning-based models:** Most learning models that perform
    well in terms of accuracy usually lack transparency. Transparency and accountability
    are important factors in enhancing transparency among users. This gap can be filled
    by applying XAI methods to explain the predictions by such black box models.


    +   * **XAI in medical science for automation of medical procedures:** XAI can
    improve the quality and efficiency of medical procedures, and effectively ensure
    trust and accountability in the AI-powered systems. They can be used to develop
    systems that predict and explain treatment options to patients based on their
    diagnosis and medical history. XAI can help in critical decision making in crucial
    medical procedures and ensure human inclusiveness. XAI can ensure adherence to
    legal aspects that are concerning the AI in medical sciences.


    +   * **XAI for data analysis:** XAI is extremely important in the field of data
    analytics. The problems of biased and unfair results can be addressed with XAI
    by identifying and mitigating the sources of bias. XAI can be used to identify
    and explain the most important features/factors of the data that are responsible
    for a particular decision. This can improve the trust and accountability of the
    models while at the same time improving their performance and accuracy.


    +   * **XAI for robotics:** There is an ever-growing complexity in the functioning
    of modern robots which makes it difficult for their adoption into critical applications
    considering the safety of humans. Automation biases are often a common problem
    in such systems. XAI can be used to include human thought processes in the robot''s
    decision-making process and fine-tune the system to improve its accuracy and performance.
    This can ensure the safety and transparency of the robotic systems with controlled
    human supervision.


    +   * **XAI in engineering applications:** XAI apart from its real work applications,
    can help many engineers in understanding their models and the problems that occur
    during training a model. Data engineers can use XAI to understand and analyze
    the underlying data and identify the problems that contribute to bias and inconsistencies.
    Accountability in terms of design failures can be handled with XAI and their interpretations.
    Overall, many real-world engineering applications can be improved from the perspective
    at time of development and before rolling out the product, making the system more
    reliable, safe, and trustworthy.'
