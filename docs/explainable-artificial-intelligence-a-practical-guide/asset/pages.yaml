  md: '# CHAPTER

    1


    # Explainable Artificial Intelligence Overview


    Artificial intelligence (AI) has been an emerging trend in every part of daily
    life. AI and its related components are playing a vital role in key operations
    like prediction, estimation, forecasting, decision making, learning, recommendations,
    and memorizing. However, AI has been used as black box where major focus is on
    just giving the data as input and measuring respective output. How this data is
    processed and connected to respective output is not being considered in the existing
    AI modelling. While most of the AI techniques are promising in terms of performance
    and accuracy, the understandability of these models and their outcomes is a recent
    point of concern with new laws being introduced that uphold the fundamental rights
    of users.


    Today, we are in the era of data-centric AI where all business cases require output
    with explainability and interpretability. Explainable AI is the new trend of AI,
    provided AI output with explanation. This chapter first presents and discusses
    the importance of explainable AI with respect to the output and performance of
    AI models. With the transformation of AI to explainable AI. It is very important
    to understand how explanation and interpretation of explainable AI helps users
    to improve their understanding. The next part of this chapter discusses the main
    components of explainable AI and its functioning. The last part of this chapter
    discusses features of explainable AI and its importance in critical AI applications.


    Keywords: AI, Explainable AI, explainability, Interpretability'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Explainable Artificial Intelligence Overview


    # 1.1 Artificial Intelligence to Explainable Artificial Intelligence


    Artificial intelligence (AI) is defined as a functionality and ability of a computer
    program, software or any computer/machine/device that brings thinking and learning
    ability [1]. The main objective of AI is to replace machines in the world mainly
    in two situations: a task that can be easily done by humans and a task that is
    very complicated and cannot be done by humans. Therefore, AI is required in two
    extreme tasks, i.e. the simplest and complicated tasks. The objective of replacing
    machines by humans in simple tasks is to engage humans in doing more quality work
    and in complicated tasks it is to get it done by a programmed machine because
    humans cannot do it. AI aims to design and develop intelligent and proactive machines
    which can be pre-programmed to perform the tasks which require the natural intelligence
    possessed by humans. AI has also become a million-dollar business for IT leaders
    in the world due to its applicability in daily life [2]. AI enables machines to
    learn in an intelligent way to explore decision making, learning, prediction,
    recognition, analysis, etc. The simplest example is when Alexa tells you the weather
    for your city for the next 24 hours or Netflix recommends a movie based on your
    watch history.


    Unfortunately AI is treated as a black box [3]. While most AI techniques are promising
    in terms of performance and accuracy, the understandability of models and their
    outcomes is a recent point of concern with the new laws being introduced to uphold
    the fundamental rights of users. Applications in non-critical domains such as
    agriculture, hospitality, etc. use AI algorithms to learn from sensor inputs and
    perform actions directed towards the target features. In such cases, the humans
    depend on the system''s decisions to carry out tasks without understanding the
    reason behind the decision or outcome. There is a lack of understanding as well
    as transparency when we look at AI as a black box for making enabled decisions
    and recommendations. In AI as black box, we work more in the abstract we are more
    interested in the overall process and ignore the algorithmic and processing details.
    Humans are not concerned with the internal working and processes of decision making.
    Therefore, in black box AI, output is not interpretable, understandable. Machine
    learning (ML) and deep learning (DL) are the main building blocks of AI which
    are widely used in many AI-based business cases [4]. Particularly, DL functioning
    is highly complex as it operates on multiple artificial neural layers. DL use
    a huge amount of data and distributes it across multiple layers, and thousands
    of neurons for the purpose of decision making. The complete functioning of processing
    data through DL is very complex and it is very difficult for humans to comprehend
    and understand. Consider the use cases such as'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'healthcare analytics, preventive healthcare, loan credibility, HR recruitment
    where judgement is to be made on humans; it is more challenging to trust these
    decisions. Many biases have resulted and observed which eventually led to unfair
    outcomes without clear justification [5]. To address these issues, we need to
    design algorithms that are more explainable and transparent. The existing AI as
    a black box needs to be converted to AI as a white box so that all outcomes are
    clearer and can be better understood by humans. The tradeoff between the complexity
    of AI and human understanding can be addressed with the help of explainable AI
    (XAI) [6]. XAI helps AI applications to provide human understandable justification
    and explanations to establish more trust and reasoning for the outcomes by AI
    algorithms and techniques. More transparency, interpretability and ethical considerations
    are the key features of XAI and it also helps convert the black box status of
    AI to a glass box because been more unreliable and untrusted decision-making processes
    are not easily interpretable and explainable by humans. XAI helps to counter the
    black box nature of ML and DL in various domains where humans, the developer community
    and data scientists understand in a better way how AI algorithms obtain decisions,
    predictions and forecasting. The bigger picture of XAI is depicted in Figure 1.1.
    Figure 1.1 clearly shows that XAI output is substantially supportive of useful
    features which includes explainability, justification and interpretation of the
    output, which is always more beneficial to the users. Many tools, frameworks and
    methods are extensively using XAI techniques to make output more efficient in
    terms of explanation.


