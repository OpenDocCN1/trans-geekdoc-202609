    a feature and a threshold are chosen to split the data into subsets. Each recursive
    process continues until specific splitting criteria are met, resulting in a tree
    structure that encapsulates a series of decision nodes and leaves. The elegance
    of decision trees lies in their ability to unravel intricate decisions through
    a set of easily understandable conditions.


