    - Explanations do not consider the bias aspect especially that is rooted in the
    dataset level. Most techniques address cognitive and automation biases.

    - Explanation mechanisms do not involve details/qualitative representations on
    evidence and effect of conditional values pertaining to the current situation.


    In the literature, various techniques to provide explanations for intrusion detection
    systems and decision making have been presented. However, there is a need to incorporate
    interpretability and actionability in the explanation techniques considering the
    current contextual information.


    # Summary


    XAI is a growing trend in the field of artificial intelligence wherein systems
    are built to assist humans by providing understandable and interpretable decisions
    and predictions rather than mere results. The goal of XAI is to build AI applications
    and systems that are transparent and trustworthy with AI high accuracy. The demand
    for human inclusiveness in decisions has made AI find its application in many
    applications such as healthcare, finance, meteorology, customer service, and many
    more. In healthcare, XAI has been used in explaining therapy predictions, biomedical
    and medical records analysis, gait analysis and explanations, etc. In finance,
    XAI has been applied to explain the actions taken against fraudulent transactions
    such as blocking and flagging. However, building XAI models requires striking
    a balance between the accuracy of the model and its interpretability. Highly accurate
    models are often complex and'
  merge: -1
  img_proc: true
