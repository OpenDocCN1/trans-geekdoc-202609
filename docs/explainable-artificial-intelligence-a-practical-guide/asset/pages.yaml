- pgno: 16
  md: '# Explainable Artificial Intelligence Overview


    ### Figure 1.2: Key components of XAI.


    ![](img/1e896d809b3796f18ad9cdda21fb64cf_16_0.png)


    Before we dive into examining the literature for the application of XAI for various
    domains, it is important to understand the key components of XAI as well as the
    features and characteristics of a few used XAI methods. Commonly used XAI models
    are:


    +   a. Local interpretable model agnostic explanations (LIME) [9]. As the name
    suggests a locally interpretable model, that is, it individually explains specific
    instances of the dataset. It is model agnostic which means it has access only
    to the model''s output. The basic idea behind LIME is that it uses surrogates
    to explain the model''s actual prediction. The surrogate is explained and then
    mapped onto the original target prediction with a few approximations.


    # Advantages


    +   * Since LIME does not depend upon the internal details of the model, it is
    highly flexible and widely applicable.


    # Disadvantages


    +   * Since LIME relies on surrogates for explanations, the quality of the explanations
    depends upon the choice of a suitable surrogate.

    * LIME involves heavy sampling, therefore making it computationally intensive.


    +   b. Testing with concept activation vectors (CAVs) is a method for evaluating
    the ability of machine learning models. It involves measuring the model''s ability
    to activate a set of human-interpretable concepts, such as "dog" or "sky," when
    presented with input data.


    6'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'can be a useful to evaluate the transparency of a model, but it may not be
    suitable for all types of models or tasks. [10]. It is a concept-based neural
    network approach that determines the contribution of a concept such as color and
    its influence on the classification of a desired class.


    # Advantages


    +   * It can be used to evaluate the concept sensitivity of image classifier models
    that are based on gradients.

    * It can be used to evaluate the fairness of a model.

    * It is sufficient for the users to have domain knowledge and does not require
    expertise in machine learning for its applicability.

    * It can be a useful to evaluate the transparency and correctness of a model.


    # Disadvantages


    +   * A huge effort is required for labelling and collecting new data.

    * Some concepts may be too abstract to explain, making it difficult to collect
    and organize a concept database.

    * It may not be suitable for all types of models or tasks. It is not suitable
    for shallow neural networks that do not learn abstract concepts.

    * It is not suitable for textual and tabular data. It is widely used for image
    datasets. [11]


    c. Causal models are a type of statistical model that aim to identify and understand
    the cause-and-effect relationships between different variables. It considers the
    actions taken by users or agents and presents the events that might follow because
    of such actions, as presented in [12]. It considers events that would happen or
    environment states that would be reached under different actions taken by the
    RL agent.


    # Advantages


    +   * The reasons behind the choice of models can be answered and explained to
    the users.

    * They can provide a better understanding of cause-and-effect relationships.

    * They can be used to make predictions about the effects of interventions.

    * They can be used to identify potential confounders that may affect the relationship
    between variables.


    # Disadvantages


    +   * This explanation method has not been evaluated in dynamic environments that
    require exploration. Also, the state space and action space in real-time are larger.'
