  md: '# Preface


    > “You are what you believe in. You become that which you believe you can become”.


    – BHAGWAD GITA


    Explainable artificial intelligence (XAI) comprises a set of frameworks and tools
    to assist us in forecasting futuristic events with the aid of machine learning/evolutionary
    and intelligent techniques. XAI helps to improve the performance of the automated
    models and to train the automated models for diverse engineering purposes. XAI
    can also assist in the generation of feature attentions for forecasting the model
    behavior with respect to different inputs. XAI is used in diverse fields such
    as marketing, data science, engineering, medical science, and economics. All these
    fields use XAI-enabled tools to identify gaps in data, detect the biases in the
    trained models, and check whether the trained models are drifting towards a particular
    type of data. The outcomes of XAI need transparency to align the output with human-interpretable
    explanations. The proposed book attempts to cover research work and use cases
    based on XAI for building interpretable tools to guarantee end-trust and to improve
    the performance of models based on explainable AI.


    Explainable Artificial Intelligence: A Practical Guide is a comprehensive guide
    to the reader who covers the fundamentals of traditional AI to the current status
    of XAI. The first chapter provides a basic overview of XAI along with its importance.
    The second chapter provides key limitations of learning as a black box and puts
    forth the need for XAI. The third chapter of this book focuses on model interpretability
    through popular techniques available in state of the art. The fourth chapter describes
    the key applications of explainable AI in various fields which includes healthcare,
    finance, autonomous vehicles, recommender systems and agriculture. The last chapter
    of this book covers'
  merge: -1
  img_proc: true
