  mdcn: '


    - LRP 是一种非常成熟且流行的可解释人工智能（XAI）方法。因此，关于该方法的文献广泛，使其成为一种可信且稳健的解释方法。


    ## 缺点


    - LRP 缺乏灵活性。必须仔细进行规则的重新分配，以适应新的模型架构。


    g. **积分梯度（Integrated gradient）[15]** 是一种辅助为单个预测提供局部解释的方法。它利用模型输出的梯度为输入特征分配重要性值。构成积分梯度基石的两个公理是敏感性（sensitivity）和实现不变性（implementation
    invariance）。当输入和基准在某个特征上不同且产生不同预测时，敏感性确保了导致差异的特征被赋予非零归因。实现不变性意味着，如果两个网络在输入输出相同的情况下具有不同的实现具有功能等价性，那么它们的归因也是相同的。


    ## 优点


    - 适用于所有微分模型和深度神经网络。

    - 对敏感性和实现不变性的依赖使其成为一种在理论上完备的方法。

    - 它表现出很强的计算效率，并基于梯度信息工作。


    ## 缺点


    - 归因结果受到需要观测基准选择的极大影响。

    - 在大多数情况下，进行梯度积分的基准与目标点之间的路径（最短路径）并没有覆盖数据。

    - 梯度消失（Gradient shading）是深度模型中的一个常见问题。


    g. **可解释图神经网络（XGNNs）[16]** 是一种事后解释方法（在模型执行预测后给出解释）。它提供全局解释（模型整体预测的解释），而不是单个局部实例。它采用递归学习，根据随机选择的节点和先验知识开发图。每当
    GNN 在满足领域需求的同时生成有效图时，系统会获得相应的奖励。


    ## 优点


    - 它是唯一为 GNN 架构提供模型级解释的方法。


    ## 可解释人工智能概述


    - 由于 GNN 是通过聚合和组合进行训练的，该方法是克服非差异化问题的一种有效方式。

    - 它最适用于人类无法验证结果的巨型数据集。


    ## 缺点


    - 该解释仅特别适用于图的分类。

    - 解释是在 GNN 响应最敏感的图网络同构构建的，这并不合适，因为我们不清楚图在网络其他部分的贡献。

    - 由于数据集缺乏地面值（ground truth），该方法提供的解释是不具体的。对于此类解释不存在适当的验证。


    SHAP：Shapley 加性解释（Shapley additive explanations）[1] 是一种基于博弈论的加性特征归因方法。计算 Shapley
    值并分配给样本的每个特征。这些 Shapley 值描述了相关特征对特定预测的影响程度/重要性。然而，对于某些特征，Shapley 值的计算有时会变得难以处理，此时名为
    Kernel SHAP 的变体可以此此。它基于加权线性回归。构建的加权线性模型的系数被汇成 Shapley 值。


    ## 优点


    - SHAP 的值之和属性使得该方法具有一致性和可靠性。

    - 它提供了一种基于理论依据的方法，将每个特征的重要性归因于最终预测。


    ## 缺点


    - Shapley 值的计算开销很大，尤其是当特征数量增加时。

    - 基准的选择会显著影响结果的 Shapley 值。

    - 对于非专家来说，SHAP 值的解释可能非常复杂。


    '
