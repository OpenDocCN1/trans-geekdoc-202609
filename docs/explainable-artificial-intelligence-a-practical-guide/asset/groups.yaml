    # 前言


    > “你所相信的决定你。成为你所相信的。” – 婆罗门圣歌


    可解释人工智能（XAI）包含了一套框架和工具，帮助我们预测事件。XAI 应用于营销、数据科学、工程、医学和经济学等多个领域。本书试图涵盖从传统 AI 到 XAI
    的基础知识，以提高训练模型相对于输入的性能。XAI 需要透明度，以使输出结果与人类可理解的解释保持一致。


    《可解释人工智能：实用指南》为读者提供了一个全面的指南，涵盖了从传统 AI 到 XAI 的基础。第一章提供了 XAI 的基本概述及其重要性。第二章介绍了黑盒学习的主要局限性，并提出了对
    XAI 的需求。本书第三章重点关注通过主流技术实现模型的可解释性。第四章描述了 XAI 的关键应用，包括医疗保健、金融、自动驾驶、推荐系统和农业。本书最后一章涵盖了可解释人工智能的前景以及设计开发中面临的关键挑战，并总结全书。


    # 本书的主要特点：


    1. 帮助用户理解从传统 AI 到 XAI 的转变。

    2. 对所有主题进行简要描述。

    3. 基于用例和场景的描述。

    4. 针对初级读者的简洁明了，从入门到构建基础 XAI 应用。

    5. 语言简单易懂，适用于从外行到受过教育的用户、从农村到城市、从国家到全球范围利益相关者。

    6. XAI 在关键业务案例中的应用。

    7. XAI 主流算法的实现细节。

    8. 提供图解和伪代码，以便更好地理解和应用。

    9. 提供大量的案例研究，以实时理解概念，并为渴望在该领域寻求研究机会的学生/专业人士提供指南。


    总而言之，本书提出了设计和开发 XAI 应用的最佳研究路线、策略和挑战。本书将激励读者利用这项技术更好地分析外行和受过教育的用户的需求，设计各种 XAI 用例。对于
    ICT、人工智能、机器学习领域的本科生、研究生、业内人士、研究人员来说，本书都非常有用。我们相信这本书将受到所有利益相关者的好评。


    Parikshit N. Mahalle


    Yashwant S. Ingle


