    | [29] | 是 | 是 | 特征重要性 | 医生团队 认知偏差 | 不在范围内 | 可用性 |


    在文献 [22] 中，作者进行了一项通用研究，以评估解释在临床决策支持建议过程中的相关性。


    ## 理解模型


    检查。在文献 [27] 中，作者讨论了分布偏移导致 AI 系统性能下降的情况。引入交互反馈机制可以提高性能；但他们也指出某些情况会导致偏差。在文献 [28]
