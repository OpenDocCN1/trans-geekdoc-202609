    # CHAPTER

    2


    # Understanding Black Box Models


    # Abstract


    Chapter 2 delves into the intricate realm of black box models in machine learning,
    revisiting their essence and exploring the key algorithms that underpin their
    functionality. Through a lens of explainable AI (XAI) evaluation, the chapter
    investigates methodologies for understanding these opaque systems, emphasizing
    the importance of transparency and interpretability. Real-world case studies illustrate
    the application of XAI mechanisms in enhancing predictive capabilities, while
    shedding light on the pervasive issues and challenges inherent in these models.
    Ultimately, the chapter synthesizes its findings in a comprehensive summary, offering
    insights into navigating the complexities of black box models in contemporary
    AI landscapes.


    **Keywords:** AI, explainable AI, black box model, machine learning


    # 2.1 The Black Box Model Revisited


    The main task of traditional AI or narrow AI [1, 2] is to perform the given task
    or operation with the help of existing algorithms and predefined rules.


    The major focus of this narrow AI is on the outcome rather than the reasons for
    outcome and explanation. It is important to understand the limitations of AI as
    a black box before we dive into the next era of AI. A narrow set of operations
    and one task is the main objective of traditional AI. Additional and'
  - '[PAGE 28]


    explicit programming is required to adapt traditional AI to perform new tasks
    and operations. Narrow AI models are not capable of dealing with scalable and
    heterogeneous data. Computationally intensive and high-performance computing resources
    are required to train and test complex data sets. Traditional AI systems typically
    lack the ability to generalize knowledge and apply it to new situations. They
    rely on explicit programming and predefined rules, making them less flexible in
    handling novel scenarios. The dependency of AI models on a training data set for
    the purpose of pattern identification and prediction is another limitation. Variation
    in the training data or incomplete data is another major bottleneck with traditional
    AI models. As generative AI [3] is a new emerging trend, explanation and justification
    of traditional AI models need to be explored.


    As stated earlier, the meaning of black boxes for AI stands for lack of explanation
    and justification about how the outcomes are reached. There is no explanation
    provided for the predictions provided by AI systems when they are implemented
    as a black box. There is a lack of transparency and interpretability and this
    creates several issues from the user point of view. Key limitations of AI when
    it is implemented as a black box are depicted in Figure 2.1 and elaborated below.


    Figure 2.1: Traditional AI limitations.


    ![](img/1e896d809b3796f18ad9cdda21fb64cf_28_0.png)


    +   - Lack understanding: When AI systems operate as black boxes, it becomes challenging
    for humans, including the designers themselves, to understand the inner workings
    of the models. This lack of understanding can hinder the ability to identify and
    address potential biases, errors, or limitations in the system.'
  - '[PAGE 29]


    +   - **Lack of trust**: The opacity of black box models can erode trust in their
    decision-making processes. Users may be hesitant to rely on AI systems when they
    cannot comprehend or verify the reasoning behind the outcomes. This lack of trust
    can limit the adoption and acceptance of AI technologies in various domains.

    - **Ethical concerns**: Black box models can raise ethical concerns, particularly
    when they are used in critical decision-making processes that impact individuals''
    lives, such as healthcare, finance, or hiring. If an AI system denies someone
    a loan or a job interview without providing an explanation, it can be challenging
    to assess the fairness and potential biases in the decision.

