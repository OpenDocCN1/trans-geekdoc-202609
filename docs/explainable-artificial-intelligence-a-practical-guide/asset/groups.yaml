    Netflow enhances the detection accuracy of the tested models deep forward and
    random forest. SHAP has been adopted to explain the classification predictions
    of the models. However, there is no discussion on the evaluation of the explanations
    provided by SHAP.


    In the 14 the authors have used a supervised learning method called a one-class
    support vector machine (SVM) for performing predictions and then proposes a one-class
    Taylor decomposition (DTD) to decompose the outliers based on input variables
    and provides explanations for single data points. In [15] the authors have addressed
    the issue of false negatives and provide human understandable interpretations.
    The explainer module is developed with XAI Desiderata as the underlying system
    is developed to detect intrusions and provide explanations. In [16] the authors
    have used a supervised learning method (deep few-shot anomaly detection using
    prior probability and labeled anomalies) model. The model explains the finding
    by leveraging the quite driven anomaly score learning and top-k multiple-instance-based
    feature subspace deviation learning for generalized representations. In [17] the
    authors have proposed a model to identify the clever Hans in unsupervised learning
    algorithms. A bagged model performs softmax pooling over the outlier scores which
    is used to compute the ROC scores. It uses the deep Taylor decomposition (DTD)
    to support the explanation process. In [18] the authors have used a grey box model
    to explainability and interpretability. It utilizes a semi-supervised self-training
    methodology. A grey box comprising of two models (a black box model and a white
    box model) in which a black box is first trained to build a final enlarged data
    and then a white box trained with the final enlarged data. The predictions are
    made with a trained white box model. However, this requires efficient training
    of the two models. In [19] the authors have attempted to enhance the explainability
    and interpretability of decision tree models using feature engineering based on
    entropy measures and rule-based mechanisms. However, the adopted mechanism can
    suffer from overfitting data when it captures noise and performs poorly for the
    test data. Also, the information gain used as a measure to evaluate the classification
    efficiency can be biased by certain situations. In [20] the authors have considered
    the need using unsupervised learning algorithms for their efficiency in CPS. The
    lack of explainability prevents it from being used in critical applications. Hence,
    they have proposed an explainable self-organizing map for decision making. The
    efficiency of the proposed explainable approach is model specific, and the results
    may vary depending on the type of data metrics used for clustering.


