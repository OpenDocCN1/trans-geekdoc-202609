    # CHAPTER

    1


    # Explainable Artificial Intelligence Overview


    Artificial intelligence (AI) has been an emerging trend in every part of daily
    life. AI and its related components are playing a vital role in key operations
    like prediction, estimation, forecasting, decision making, learning, recommendations,
    and memorizing. However, AI has been used as black box where major focus is on
    just giving the data as input and measuring respective output. How this data is
    processed and connected to respective output is not being considered in the existing
    AI modelling. While most of the AI techniques are promising in terms of performance
    and accuracy, the understandability of these models and their outcomes is a recent
    point of concern with new laws being introduced that uphold the fundamental rights
    of users.


    Today, we are in the era of data-centric AI where all business cases require output
    with explainability and interpretability. Explainable AI is the new trend of AI,
    provided AI output with explanation. This chapter first presents and discusses
    the importance of explainable AI with respect to the output and performance of
    AI models. With the transformation of AI to explainable AI. It is very important
    to understand how explanation and interpretation of explainable AI helps users
    to improve their understanding. The next part of this chapter discusses the main
    components of explainable AI and its functioning. The last part of this chapter
    discusses features of explainable AI and its importance in critical AI applications.


    Keywords: AI, Explainable AI, explainability, Interpretability'
