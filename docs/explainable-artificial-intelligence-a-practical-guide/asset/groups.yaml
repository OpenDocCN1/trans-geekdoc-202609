    | 数据科学家 | 模型调试 |

    | 监管机构 | 信任 |


    通常情况下，我们可以根据可用性和正确性将解释分为两类。可用性在评估时不考虑解释的内容，而正确性则考虑评估的基真值（ground truth），例如监督学习算法中的基真值。可用性方面根据解释的有效性以及功能对终端用户的有效性进行进一步分类。由于训练模型的数据集并没有直接指定预测/结果的重要特征的真实解释，因此不存在用于评估正确性的定量研究/指标。然而，学者
    [12] 做出了重大尝试，尝试通过形式语法将解释编码到数据集中以表示现实分类任务，并为此引入了名为 k 精度（k-accuracy）的评估指标，这被认为是比较特征重要性
