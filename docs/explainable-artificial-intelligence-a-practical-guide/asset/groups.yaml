    - They may be subject to bias and confounding.


    Anchors [13] are methods that use a decision rule as an anchor to explain the
    model''s predictions. The explanations explain the feature space in the form of
    IF-THEN statements. The choice of good anchors helps classification to be unchanged
    despite the variance observed across feature values. Good anchors are justified
    based on their precision and convergence. Precision refers to the number of data
    points in a region belonging to the same class as the data point defined by the
    anchor. Convergence refers to the applicability of the anchor''s decision rule
    to several data points. In general, it is desirable for anchors to cover a much
    larger feature space to establish a generalized rule.


    # Advantages


    - Anchors being model agnostic makes it applicable to any model and various domains
    such as image, text and tabular data.

    - They represent the boundaries within which they are applicable making it easier
    to define and interpret the score.

    - Anchors can be used as a measure to validate the model''s fidelity based on
    the decision rule''s coverage.

    - Decision rules are easy to understand.


    # Disadvantages


    - The establishment of good anchors involves calculations and tuning of many individual
    hyper-parameters such as precision, the width of the beam, and threshold.

    - Calculations of anchors involve intensive computations due to the numerous calls
    to the prediction function.

    - Data points close to the boundaries need to be administered with complex rules
    involving more features and lesser coverage.


    Layer-wise relevance propagation (LRP) [14] uses the internal details of the model
    as the weights, activations, biases, etc. to explain the predictions based on
    propagation. LRP thus explains the model stepwise by redistributing the factors
    layer by layer right from the output to the input variables. Each of these redistributions
    at the layers is treated as a simple solution to the explanation problem.


    # Advantages


    - LRP is highly efficient in terms of computations.

