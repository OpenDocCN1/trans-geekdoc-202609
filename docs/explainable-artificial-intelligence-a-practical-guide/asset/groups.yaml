    In general, the two desirable properties of a system include its accuracy (perform
    computations with fewer errors) and interpretability (ability to explain the internal
    workings of the system). However, achieving one property comes at the expense
    of the other. A method that is interpretable would involve constraints that reduce
    the complexity of the system such as a reduction in the number of features/parameters
