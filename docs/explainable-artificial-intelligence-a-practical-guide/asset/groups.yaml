    # 可解释人工智能概述


    4. 适用阶段指的是生成解释时模型开发的时间。某些模型（如决策树和逻辑回归）本质上是自解释的，它们的预测可以在训练期间进行解释。它们也被称为白盒模型。其他不透明的模型被称为黑箱模型，其解释可以在训练过程后进行，并属于事后解释（post-hoc
    explanations）。尽管黑箱模型具有不透明性，但由于其高效性，它们在现实应用中被广泛使用。


    XAI 的主要应用列举如下：


    - **面向人类可解释解释的 XAI：** XAI 可以通过以易于理解的格式为决策或预测提供解释，帮助增强终端用户的信任。这将使用户能够更加意识到决策背后的原因，在结果/预测与结果之间建立具体的因果关系。


    - **面向基于机器学习模型的 XAI：** 大多数在性方面表现良好的学习模型通常缺乏透明度。透明度和问责制是增强用户间透明度的重要因素。通过应用 XAI
    方法来解释此类黑箱模型的预测，可以填补这一空白。


    - **医学科学中医疗程序自动化的 XAI：** XAI 可以提高医疗程序的质量和效率，并有效确保 AI 驱动系统的信任和问责制。它们可用于开发根据患者的诊断和病史预测并解释治疗方案的系统。XAI
    可以帮助关键医疗程序中的关键决策，并确保人类的包容性。XAI 可以确保符合与医学科学中涉及 AI 相关的法律规定。


    - **面向数据分析的 XAI：** XAI 在数据分析领域极其重要。通过识别和缓解偏差来源，可以使用 XAI 解决结果偏差和不公平的问题。XAI 可识别并解释负责特定决策的数据中最重要的特征/因素。这可以在提高模型信任度和问责制的同时，提高它们的性能和准确性。


    - **面向机器人的 XAI：** 现代机器人的运行复杂性日益增加，这使得在考虑人类安全的情况下，将其引入关键应用变得困难。自动化偏差往往是此类系统的常见问题。XAI
    可将人类思维包含在机器人的决策过程中，并微调系统以提高其准确性和性能。这可以确保机器人系统的安全和透明。


    - **工程应用中的 XAI：** 除了其本身的工作外，XAI 可以帮助许多工程师理解和分析在模型开发过程中出现各种不一致性问题。总体而言，从开发的角度来看，XAI
    可以使系统更加可靠、安全且信赖。


    # 1.5 总结


    XAI 是一个专注于使 AI 系统的决策过程对人类透明且理解的概念。它旨在提供关于 AI 模型如何得出预测或决策的解释和见解。可解释性、可追溯性、验证和确认以及人类可理解的解释是
    XAI 的核心特征，在本章中进行了讨论。通过提供 AI 决策的解释和见解，XAI 使用户能够理解并评估 AI 输出，增加信任并识别潜在的偏差或错误。流行的
    XAI 技术及其优点和局限性，本书的下一章将关注 XAI 面临的挑战。


