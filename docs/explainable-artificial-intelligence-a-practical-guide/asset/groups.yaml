    to uphold the fundamental rights of users. Applications in non-critical domains
    such as agriculture, hospitality, etc. use AI algorithms to learn from sensor
    inputs and perform actions directed towards the target features. In such cases,
    the humans depend on the system''s decisions to carry out tasks without understanding
    the reason behind the decision or outcome. There is a lack of understanding as
    well as transparency when we look at AI as a black box for making enabled decisions
    and recommendations. In AI as black box, we work more in the abstract; we are
    more interested in the overall process and ignore the algorithmic and processing
    details. Humans are not concerned with the internal working and processes of decision
    making. Therefore, in black box AI, output is not interpretable, understandable.
    Machine learning (ML) and deep learning (DL) are the main building blocks of AI
