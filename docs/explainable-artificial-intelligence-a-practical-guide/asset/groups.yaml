    g. **Integrated gradient [15]** is a method that assists in providing local explanations
    for individual predictions. The gradients of the model''s output are used to assign
    importance values to the input features. The two axioms that form the building
    blocks of integrated gradients are sensitivity and implementation invariance.
    Sensitivity holds when input and baseline differ in one feature and have different
    predictions, then the feature causes the difference is given non-zero attribution.
    Implementation invariance suggests that in the case where two networks exhibit
    functional equivalence when the inputs and outputs are equal, with differing implementations,
    then their attributions are also identical.


    # Advantages


    +   - Applicable to all differential models and deep neural networks.


    +   - The dependence upon sensitivity and implementation invariance makes it theoretically
    sound approach.


    +   - It exhibits strong computational efficiency and works on gradient information.


    # Disadvantages


