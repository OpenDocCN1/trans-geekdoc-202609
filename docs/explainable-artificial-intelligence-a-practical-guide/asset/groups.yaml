    # CHAPTER 2

    # Understanding Black Box Models


    ## Abstract


    Chapter 2 delves into the intricate realm of black box models in machine learning,
    revisiting their essence and exploring the key algorithms that underpin their
    functionality. Through a lens of explainable AI (XAI) evaluation, the chapter
    investigates methodologies for understanding these opaque systems, emphasizing
    the importance of transparency and interpretability. Real-world case studies illustrate
    the application of XAI mechanisms in enhancing predictive capabilities, while
    shedding light on the pervasive issues and challenges inherent in these models.
    Ultimately, the chapter synthesizes its findings in a comprehensive summary, offering
    insights into navigating the complexities of black box models in contemporary
    AI landscapes.


    **Keywords:** AI, explainable AI, black box model, machine learning


    ## 2.1 The Black Box Model Revisited


    The main task of traditional AI or narrow AI [1, 2] is to perform the given task
    or operation with the help of existing algorithms and predefined rules.


    The major focus of this narrow AI is on the outcome rather than the reasons for
    outcome and explanation. It is important to understand the limitations of AI as
    a black box before we dive into the next era of AI. A narrow set of operations
    and one task is the main objective of traditional AI. Additional and explicit
    programming is required to adapt traditional AI to perform new tasks and operations.
    Narrow AI models are not capable of dealing with scalable and heterogeneous data.
    Computationally intensive and high-performance computing resources are required
    to train and test complex data sets. Traditional AI systems typically lack the
    ability to generalize knowledge and apply it to new situations. They rely on explicit
    programming and predefined rules, making them less flexible in handling novel
    scenarios. The dependency of AI models on a training data set for the purpose
    of pattern identification and prediction is another limitation. Variation in the
    training data or incomplete data is another major bottleneck with traditional
    AI models. As generative AI [3] is a new emerging trend, explanation and justification
    of traditional AI models need to be explored.


    As stated earlier, the meaning of black boxes for AI stands for lack of explanation
    and justification about how the outcomes are reached. There is no explanation
    provided for the predictions provided by AI systems when they are implemented
    as a black box. There is a lack of transparency and interpretability and this
    creates several issues from the user point of view. Key limitations of AI when
    it is implemented as a black box are depicted in Figure 2.1 and elaborated below.


    Figure 2.1: Traditional AI limitations.


    ![](img/1e896d809b3796f18ad9cdda21fb64cf_28_0.png)


    - Lack understanding: When AI systems operate as black boxes, it becomes challenging
    for humans, including the designers themselves, to understand the inner workings
    of the models. This lack of understanding can hinder the ability to identify and
    address potential biases, errors, or limitations in the system.

    - **Lack of trust**: The opacity of black box models can erode trust in their
    decision-making processes. Users may be hesitant to rely on AI systems when they
    cannot comprehend or verify the reasoning behind the outcomes. This lack of trust
    can limit the adoption and acceptance of AI technologies in various domains.

    - **Ethical concerns**: Black box models can raise ethical concerns, particularly
    when they are used in critical decision-making processes that impact individuals''
    lives, such as healthcare, finance, or hiring. If an AI system denies someone
    a loan or a job interview without providing an explanation, it can be challenging
    to assess the fairness and potential biases in the decision.

    - **Lack of flexibility**: Black box models are difficult to modify or update.
    If changes are required to improve the model''s performance or adapt to new scenarios,
    it may be challenging to understand how to make those changes effectively. This
    lack of flexibility can hinder the refinement and optimization of AI systems.

    - **Regulatory compliance**: In some industries, regulations require explanations
    for decisions made by AI systems. Black box models may struggle to meet these
    compliance requirements, as they cannot provide transparent and interpretable
    justifications for their outputs.


    Explainable AI (XAI) helps to make outcomes of AI systems more transparent and
    with clear explanations about predictions and decisions. Trust and reasoning about
    the provided output can be strengthened with the help of explanations provided
    by XAI techniques. Important features used for decision making are predominantly
    highlighted with the help of popular techniques which include rule-based methods,
    model-agnostic techniques as well as useful visualizations. There is a need to
    develop algorithms and techniques to interpret the inner workings of black box
    models. These techniques such as feature importance, saliency maps, and attention
    mechanisms—these methods provide insights into how the model processes and weights
    different inputs. Model distillation involves training a more interpretable model
    to mimic the behavior of a complex black box. The distilled model can provide
    similar performance while being more transparent. This approach allows for a trade-off
    between model complexity and interpretability. Rule extraction techniques aim
    to extract human-readable rules from black box models. These rules can provide
    insights into how the model arrives at its predictions. Rule extraction methods
    can be applied to decision trees, random forests, or neural networks. Combining
    black box AI models with interpretable models can provide a balance between performance
    and transparency. Hybrid approaches leverage the strengths of both types of models,
    allowing for accurate predictions while providing explanations that are easier
    to understand. Governments and regulatory bodies are exploring the development
    of frameworks and guidelines to ensure transparency and accountability in AI systems.
    These frameworks may require AI developers to provide explanations for their models''
    decisions, especially in critical domains such as healthcare or finance.


    Despite recent advancements and developments in AI, it is not infallible. Responsible
    AI [4, 5] requires an understanding of the possible issues. Fairness, reliability,
    safety, inclusiveness, privacy, security, and accountability are some of features
    of responsible AI. The birds eye view of responsible AI is presented in Figure
    2.2.


    Figure 2.2: Birds eye view of responsible AI.


    ![](img/1e896d809b3796f18ad9cdda21fb64cf_30_0.png)


    ## 2.2 Key Machine Learning Algorithms


    With the advancement of broadband technology, the Internet is becoming affordable
    and faster day by day. Due to this, the notion of Internet of Everything (IoE)
    has become reality [6]. There has been a great transformation from IoT to IoE
    where a greater number of devices and users are connected [7]. Due to this, it
    has become more challenging for IT leaders to deal with big data. Storing, extracting,
    transforming, and loading this data is no longer challenging due to advancements
    in database management. In the sequel, there is a need for efficient machine learning
    techniques [8, 9] to deal with big data.


    However, it should be noted that despite having abundance of natural intelligence
    available, why is the entire world running behind replacing humans with natural
    intelligence? In the real world there are many business cases and use cases where
    either humans are not reachable or human expertise does not exist. There are many
    applications where the task is very simple and repetitive in nature. Therefore
    engaging human brains with lot of natural intelligence in doing repetitive tasks
    is a waste of intelligence. In such cases, replacing human brains by machines
    is the better solution so that humans can be engaged in doing more quality work.
    In complex tasks which are computationally intensive and out of reach for humans,
    machines need to be used [10].


    Before we get into the understanding of ML, it is important to understand related
    subjects and applications of ML. Statistical estimation is the key component of
    ML as it targets the same problems as ML.

