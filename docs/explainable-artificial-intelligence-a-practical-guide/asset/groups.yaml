    # 2.5 Issues and Challenges


    Although XAI has been effectively used in a wide range of domains, the automated
    decision-making process in critical application domains, such as banking, healthcare,
    etc., raises concerns about upholding the fundamental rights of users.


    # 2.5.1 Legal requirements: Expanding XAI to interpretable and actionable AI


    The legal requirement in the critical automated decision-making process emphasizes
    the involvement of human users. Enabling them to assess the decision process,
    express their point of view and contest the decision if required is an important
    process mentioned in the GDPR. Ensuring compliance with the data protection rules
    and regulations laid down by specific government organizations is of prime importance
    in critical automated decision-making applications. Hamon et al. [21] explained
    the necessity to incorporate explainability in the system to explain the compliance
    to rules and regulations thereby implementing trustworthiness in the critical
    automated decision-making systems by design. Furthermore, they emphasized the
    fact that, although mechanisms to document and audit the logic of the underlying
    algorithm in decision making are in place, the increased complexity of AI-based
    algorithms makes it difficult to present the outcomes in an understandable format
    to humans. Upholding the "right to explanation" is a tedious aspect to address
    as the evaluation of the relevance of the explanations from a legal perspective
    and the establishment of strong causal links between the input data and the outcomes
    is not agreeably established. Understanding the context of the application should
    also be considered when evaluating the relevance and adequacy of explanations.


    While explanation refers to providing an explanation of the system''s internal
    work to the users, interpretability refers to the transition that occurs when
    the cause and effect of the AI system''s decision are understandable to the users.
    The decision of an AI system beside contextual. Objectives and situations keep
