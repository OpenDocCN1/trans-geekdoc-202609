    # 2.5. Transformer


    # 2.5.2. Multi-head attention


    In this paper, a Transformer model that considers the characteristics and strength
    of pollutant factors is depicted (Fig. 5). It consists of an encoder and a fully
    connected layer, with an encoder consisting of a multi-head attention layer and
    a feedforward layer. The CO2 concentration, wind speed, and dew are very important
    information for the pollutant prediction. The Transformer model considers the
    meteorological and pollutant features from the prediction, inputs these features
    into the encoder, while the output passes through the fully connected layer.


    In order to make the model focus on different weights to the input sequence during
    the encoding phase, an attention mechanism is used to quantify the dependencies
    between elements. The attention score extends to the information in the time series
    which should be focused on future predictions, and it can be calculated using
    the scaled-dot product of the attention:


    # 2.5.1. Positional encoding


    A Transformer differs from convolutional and recurrent NNs in that it uses a novel
    positional encoding mechanism to capture the time series information of the input
    data. Sine and cosine functions of various frequencies are embedded into the normalized
    input sequences for encoding:


    ```

    $Attention(Q, K, V) = softmax(\frac{QK^T}{\sqrt{d_k}})V$ (5)

    ```


    Next, Q and K are used to compute the vector dot product, $QK^T$, where $d_k$
    is the dimension of the key (K). The input sequence is down-sampled using the
    embedding layers to obtain $(a_1, a_2, ..., a_n)$, which are multiplied by $W^Q,
    W^K, W^V$ to obtain $q_1, q_2, ..., q_n$, $k_1, k_2, ..., k_n$, and $v_1, v_2,
    ..., v_n$. The weights are multiplied by $v_1, v_2, ..., v_n$ at the corresponding
    positions, and the products are summed up to $b$, which corresponds to


