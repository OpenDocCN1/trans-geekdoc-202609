    # 2. Materials and methods


    # 2.1. Research area and data


    Beijing, located in the northern part of North China, the economic, social, and
    cultural center of China (39.90°N, 116.40°E); is bordered to the north by the
    Yan Mountains and the Taihang Mountains to the west so that the topography is
    high in the northwest and flat in the east. As the main base of heavy industry
    in China, Beijing conducts large amount of coal burning every year. The special
    geological and climatic conditions of Beijing limiting the location and dispersion
    of pollutants contribute to the concentration of pollutants in Beijing. In this
    study, hourly air quality data and meteorological data measured at 12 atmospheric
    air quality monitoring stations from January 1, 2013, to January 1, 2017, were
    obtained from the China Meteorological Data Network (http://data.cmc.gov.cn).


    attributes of the data are presented in Table 1. These datasets were transformed
    into different input dimensions according to the needs of the models. To present
    and understand the mean PM2.5 concentrations were calculated at each station using
    the monitoring data acquired during 2013-2017, and for the four seasons were separated
    seasonally (Fig.). With the hourly monitoring data over the last 24 h at the 12
    stations during 2013-2017 the input data was used to estimate the mean PM2.5 concentrations
    in each season of 2017.


