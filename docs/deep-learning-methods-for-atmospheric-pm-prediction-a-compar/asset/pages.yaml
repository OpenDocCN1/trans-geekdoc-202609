    # ABSTRACT


    A transformer-based method was firstly developed to predict the hourly PM₂₅ concentration
    at 12 monitoring stations in Beijing. Convolutional neural network short-term
    memory-attention mechanism (CNN-LSTM attention) were introduced to compare with
    Transformer models. Experiments on long time series and future prediction were
    conducted to evaluate the model performance and generalization ability over a
    period of time. The results, namely the mean variance score (EVS), R² absolute
    error, mean square error (MSE), and R values of Transformer were 12%, 6%, and
    30% higher than those of the CNN-LSTM attention, respectively. The results show
    that the Transformer outperformed the CNN-LSTM model in terms of prediction accuracy.
    The capture-turn attention mechanism identifies patterns affected by abruptly
    meteorological conditions and trends with significant seasonal changes, in autumn
    and winter when the pollution situation is more complex. Transformer has obvious
    advantages in overcoming the independence problem of learning, providing a new
    method for the long-term prediction of air quality.


    # 1. Introduction


    China''s air quality has greatly improved since the implementation of the Air
    Pollution Prevention and Control Plan in 2013, PM₂₅ concentrations in some cities
    still exceed the limits recommended by the World Health Organization (10 μg/m³).
    China still faces challenges in improving air quality in autumn and winter when
    pollution concentration in northern China sometimes exceeds the recommended limit
    (Guo et al., 2014). Regional pollution, which is mainly driven by PM₂₅, has been
    observed extensively in China (Zheng et al., 2008; Zhou et al., 2016). Air quality
    monitoring stations are densely distributed in urban areas and can provide the
    public with real-time air quality data, but the public needs a more accurate air
    quality prediction. The key is to use monitoring data from one or more stations
    to


    predict pollutant concentrations (Xu et al., 2021). Statistical and deterministic
    methods used in air quality prediction. Methods such as the multiple linear regression
    (Vloshchinski et al., 2011) and autoregressive moving average (ARMA) (Kumar and
    Jain, 2010) were used in short-term air quality prediction. However, the linear
    models cannot address the complex nonlinear effects of atmospheric pollutants
    and meteorological factors on pollutant concentrations. Furthermore, the photochemical
    models approach only focuses on individual pollutants that are directly measurable
    and is computationally intensive. In addition, physical models developed alone
    fail to accurately predict nonlinear air pollution processes due to improper conditions
    settings and even a


