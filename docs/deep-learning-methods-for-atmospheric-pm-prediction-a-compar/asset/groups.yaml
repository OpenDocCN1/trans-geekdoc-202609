    # 大气污染研究


    期刊首页：www.elsevier.com/locate/apr


    # 用于大气 PM₂₅预测的深度学习方法：Transformer 与 CNN-LSTM 注意机制的对比研究


    Bowen Cui a¹, Minyi Liu a¹, Shangjian Li b¹, Zhifan Jin c², Yu Zeng a¹, Xiaoling
    Lin b¹


    * * 福州理工大学环境与城市建设学院，福州，350108，中国

    * 福州理工大学数学与数学学院，福州，350108，中国

    * c 福州环境监测中心，福州，350118，中国

    * f 福州环境影响评估技术中心，福州，350003，中国


    # 文章信息


    # 摘要


    本文首次开发了一种基于 Transformer 的方法来预测北京 12 个监测站的逐小时 PM₂₅ 浓度。引入了卷积神经网络短期记忆注意力机制（CNN-LSTM
    attention）与 Transformer 模型进行对比。通过对长时间序列和未来预测进行实验，评估了模型在一段时间内的性能和泛化能力。结果显示，Transformer
    的均方差评分（EVS）、R² 绝对误差、均方误差（MSE）和 R 值分别比 CNN-LSTM attention 高出12%、6% 和 30%。结果表明，Transformer
    在预测精度方面优于 CNN-LSTM 模型。捕获转换注意力机制能够识别受天气气象条件影响的模式以及季节性显著变化的趋势，特别是在污染状况更为复杂的秋冬季节。Transformer
    在克服学习独立性问题方面具有明显优势，为空气质量的长期预测提供了新方法。


    # 1. 引言


    自 2013 年《大气污染防治行动计划》实施以来，中国的空气质量得到了极大改善，但某些城市的 PM₂₅ 浓度仍超过了世界卫生组织的建议限制（10 μg/m³）。中国在改善秋冬季节空气质量方面仍面临挑战，此时北方地区的污染浓度有时会超过建议限制（Guo
    et al., 2014）。在中国已广泛观察到主要由 PM₂₅ 驱动的区域污染（Zheng et al., 2008; Zhou et al., 2016）。空气质量监测站密集分布在城市地区，可以为公众提供实时空气质量数据，但公众需要更准确的空气质量预测。关键在于利用一个或多个监测站的监测数据来预测污染物浓度（Xu
    et al., 2021）。空气质量预测中使用了统计和确定性方法。如多元线性回归（Vloshchinski et al., 2011）和自回归移动平均模型（ARMA）（（Kumar
    and Jain, 2010）等方法被用于短期空气质量预测。然而，线性模型无法解决大气污染物和气象因素对污染物浓度的复杂非线性影响。此外，光化学模型方法仅关注于可直接测量的单一污染物，且计算量巨大。此外，单独开发的物理模型由于条件设置不当甚至缺乏模型参数，无法准确预测非线性的空气污染过程。


