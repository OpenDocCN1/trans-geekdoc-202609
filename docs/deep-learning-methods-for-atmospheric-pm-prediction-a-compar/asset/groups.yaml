    # Deep learning methods for atmospheric PM₂₅ prediction: a comparative study of
    transformer and CNN-LSTM attention


    Bowen Cui a¹, Minyi Liu a¹, Shangjian Li b¹, Zhifan Jin c², Yu Zeng a¹, Xiaoling
    Lin b¹


