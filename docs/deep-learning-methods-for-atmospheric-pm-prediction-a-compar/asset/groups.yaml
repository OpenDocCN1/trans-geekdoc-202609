    # 7.2. Evaluation metrics


    The $R^2$, MAE, and MSE were used to evaluate the Transformer performance for
    $PM_{2.5}$ concentration prediction. The $R^2$ and $R''$ values are in the range
    of [0, 1] and serve as metrics on the regression model''s performance in explaining
    the data variance. The closer the metrics are to 1, the better the model performance
    in explaining the variance of the $PM_{2.5}$ concentration among different air
    pollution and meteorological conditions, i.e., the smaller the metrics, the worse
    the model performance. These metrics are calculated as follows:


    ```

    $explained\variance(y, \hat{y}) = \frac{Var(\hat{y})}{Var(y)} - 1$

    ```


    ```

    $R^2 = \frac{\sum_{i=1}^{n} (y_i - \hat{y}_i)^2}{\sum_{i=1}^{n} (y_i - \bar{y})^2}$

    ```


    where $\hat{y}$ is a y-estimated output, and $Var$ is the variance. The closer
    the value is to the optimal score of 1, the more accurate the prediction.


    Regarding MAE and MSE, they are used to assess the degree of closeness to the
    predicted data, which is used to calculate the value of the sum of errors between
    the fitted data and theing data. The smaller of the two values, the better the
    prediction result. These two metrics are calculated as follows:


    ```

    $MAE = \frac{1}{n} \sum_{i=1}^{n} |y_i - \hat{y}_i|$

    ```


    ```

    $MSE = \frac{1}{n} \sum_{i=1}^{n} (y_i - \hat{y}_i)^2$

    ```


