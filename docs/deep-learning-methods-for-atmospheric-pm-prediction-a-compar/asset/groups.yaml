    ## 3.3. transformer 与其他模型的比较


    目标区域的污染物浓度在全年趋于稳定，除非天气发生显著变化（低风速），这会导致空气输送污染物的能力下降，从而导致污染物积聚，加剧了局势。在某些季节，气象条件导致污染在数据中表现出显著变化。基于历史数据预测条件剧烈变化的大气污染物浓度，存在仅与历史数据具有一般相关性的问题。


    ## 4. 结论


    在这项研究中，我们开发了一种基于 Transformer 的长期 PM2.5 预测方法，并从 RMSE、MAE 和 R² 方面将其性能与 CNN-LSTM-attention
    模型进行了比较，以确定模型如何捕获污染因素与气象条件之间的关系。我们使用了 2013 年至 2017 年北京获取的历史数据。结果显示，Transformer
    模型可以有效克服以往预测的局限性、在使用物理和机器学习时遇到的问题以及时间顺序信息。此外还应用了 LSTM 和 XGBoost 模型。


