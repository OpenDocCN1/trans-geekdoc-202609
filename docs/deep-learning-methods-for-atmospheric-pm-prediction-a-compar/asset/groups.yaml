    # B. Cui 等人


    # 大气污染 24 (2023) 108833


    神经网络（NNs）被用作强大的机器学习（ML）模型用于自然语言处理（Han et al., 2016）和空气质量预测（Fan et al., 2017; Ma
    and Zhang, 2016; Wang et al., 2019; Xing et al., 2020）。神经网络可以通过其端到端的学习能力从输入数据中自动提取特征并预测目标数据（Huang
    et al., 2021; Mehmod et al., 2022），它们可以部署为一种有效模型，对对系统中的复杂关系进行建模，并从测量数据估计环境污染物的浓度。


    卷积神经网络（CNNs）可以根据特征的空间分布，以类似于地图的方式处理来自多个监测站的数据（Zhu and Xie, 2022），并提供比全神经网络（NNs）更高的预测精度（Wu
    et al., 2018）。混合空气质量指数（AQI）已通过空间分解用于空气质量预测，某些算法在京显示出良好的 AQI 预测性能（Gu and Lin, 2019）。为了观察学习空气污染长期依赖关系的能力，引入了循环神经网络（RNNs）（Li
    et al., 2021）。


    循环神经网络（RNNs）被认为在建模空气质量变化方面优于人工神经网络（NNs）。另一方面，RNNs 的有效性能受到其无法捕捉空间依赖性的限制。最近在利用空间特征的研究中（Fan
    et al., 2017; Tao et al., 2019; Wen et al., 2019），结合了 RNNs 和 CNNs 来捕获与空气污染相关的污染物的时空特征，例如各种化学物种（SWCs）和
    PM2.5 的浓度，但 RNNs 的预测精度取决于观测输入的数量（Kocijan et al., 2018; Li et al., 2021）。


    某些气象因素驱动空气质量评估模式，表明需要使用不同的模型对不同因素进行建模。在大气污染中，污染可能受到气象因素、气象过程、大气现象和其他因素的影响。这些可能是局部的也可能是广泛的，影响因素与污染物浓度之间存在复杂的关系。此外，空气质量还随着序列依赖关系而变化。随着时间的推移，空气质量将经历周期性变化，表明需要根据污染物数据以及其他气象因素的已知模式快速预测未来的空气质量。虽然许多
    ML 模型可以提高预测精度，但它们没有解决这些模型预测的滞后或长期依赖性问题（Zhang et al., 2016）。


    深度学习（DL）技术，如 LSTM（Wang et al., 2019）和 GRU（2018）是有效的，并且从时间序列数据中提取更多信息。Wang等人开发了一种时空整合模型，根据气象因素和格兰杰因果关系预测北京的空气质量（Cho
    et al., 2014）。然而，发现对长期时间依赖建模会降低 DL 模型在提供可靠预测方面的性能。


    Transformer 模型是一种序列到序列模型，由 Google 研究人员于 2017 年提出。此类模型是深度学习中基于注意力机制的机制，不涉及任何卷积和循环单元（Dosovitskiy
    et al., 2020; Han et al., 2021; Vaswani et al., 2017）。该模型的输出在理解和生成复杂数据方面优于其他神经网络，如卷积和循环神经网络。然而，Transformer
    受限于训练数据的规模和模型的大小，这有利于高效训练并允许捕捉远距离特征。Transformer 在克服学习独立性问题方面具有明显优势，为空气质量的长期预测提供了新方法。Transformer
    能够在在大尺度范围内捕捉长程特征（Li et al., 2019）。Transformer 可用于多种时间序列的空气质量预测（Li et al., 2021）。Transformer
    通过连续注意力机制对输入和输出序列中的相对位置进行建模（Wen et al., 2022）。最近的研究表明，Transformer 可以对连续数据建模依赖关系（Chen
    et al., 2022; Sun et al., 2021; Manshu et al., 2022）。Transformer 可以被更好地理解为一种学习不同标记之间路径的模型，其中模型学习依赖的能力内在。在
    CNN 和 RNN 中，路径长度随两点之间的距离而增加，但在 Transformer 中，路径长度是恒定的。因此，自注意力机制允许模型捕捉两个位置之间的关联，这使得
    Transformer 的路径长度恒定（Chomomsky et al., 2005; Touvron et al., 2017）。


    Transformer 已应用于空气质量预测（Zhu et al., 2022; Li et al., 2022）。然而，由于传统模型在建模长期序列和时间依赖性方面的局限性，它们无法捕捉空气质量污染物的复杂模式。因此，Transformer
    可以更好地预测空气质量。


    自注意力机制可以同时捕捉不同的气象模式，模型中的多头注意力机制可以使模型自注意力以识别依赖关系（Shen et al., 2018; Wu et al.,
    2021）。Transformer 模型已成功应用于时间序列预测，我们考虑将此类模型用于大气空气质量预测。


    根据气象因素的分布和部署的污染因素的特征强度，开发了一种用于空气质量预测的模型。与传统 Transformer 不同，Transformer 经过优化，以在编码器中整合时空特征。


