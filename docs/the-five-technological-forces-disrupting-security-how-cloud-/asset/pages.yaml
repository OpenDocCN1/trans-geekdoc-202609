    the way that familiar components have been reorganized into updated architectural
    paradigms. New roles and relationships among the parts of a system create the
    need for new standards on how they communicate and interact. An old shoe''t always
    fit a new foot.


    For consumers, there''s a lack of transparency in IoT. Most popular literature
    doesn''t spend a lot of time explaining interoperability and security protocols
