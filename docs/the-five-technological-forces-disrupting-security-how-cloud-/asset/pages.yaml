- pgno: 143
  md: 'the IEEE has high visibility across every technology sector, and it is able
    to influence large numbers of new projects.


    The IEEE has also gone back through its existing body of standards and reclassified
    many of them (e.g., Ethernet) as “Internet of Things related standards”—helpful,
    at the nuts and bolts level, but not breaking new ground. It also feels less modern
    in its approach to the open-source methods used by the newer organizations in
    this space. Prescriptive specifications will always be needed, but to be influential,
    open-source code turns standards into real projects much more.


    # Related Organizations


    Without meaning to disserve to any of the other organizations active in this area,
    there are too many consortia and industry groups to cover in anything less a full-length
    book. Further complicating matters, new organizations come into existence monthly
    and, unfortunately, disappear nearly the same rate.


    Some of the organizations are focused on specific problems, such as data transport.
    The IoT group within the Organization for the Advancement of Structured Information
    Standards (OASIS), for example, has been working on the telemetry transport protocols
    as Advanced Message Queuing Protocol (AMQP) and Message Queuing Telemetry Transport
    (MQTT). While these protocols do not attempt or pretend to address the overall
    cybersecurity problem, they may find their way into security device applications
    and would need to be secured within the larger context of system integration or
    network.


    The IETF is also very relevant to the ongoing development of IoT standards, such
    as the “IPv6 over low-power WPAN” standard that is implemented to extend IP networking
    to low-power devices. Securing a network using this protocol presents many of
    the same challenges as securing the IP networks in use today, and the standard
    does not speak to the layer of the problem.


    # PROPRIETARY FRAMEWORKS


    In practice, development frameworks and standards play similar roles. They provide
    consistent ways of doing things so that independent developers and manufacturers
    can leverage a body of intellectual property that lets them work faster and smart.
    They both drive solutions that enable innovators to end up with interoperable
    devices that can play in the same ecosystem in an end-user deployment.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 124 CHAPTER 10: IoT Technology and Standards


    Where they diverge is that standards are the product of strict sets of rules on
    how they are created, ratified, and subsequently changed; proprietary frameworks
    can be changed at the whim of their owner. On the one hand, this freedom allows
    proprietary frameworks to move much more quickly than the consensus-driven committee
    process of large standards bodies. On the other hand, adopters may find themselves
    stranded after some number of years, when slow market adoption or other corporate
    decision-making marginalize what once appeared a promising “standards” initiative.


    That said, there are a handful of major forces in the technology world that, while
    proprietary, have provided enough benefit and stability that many adopters have
    created successful products just for the ecosystem without feeling the proprietary
    pinch. In desktop operating systems, Windows is the standout example, while iOS
    and Android make the case for mobile platforms.


    Here are the too-big-to-ignore titans in our world.


    # Google Weave


    Google Weave is an example of a single-vendor IoT framework coupled with a service
    offering. It is an IoT platform that covers device registration, identity, communication,
    cybersecurity, software updates, and user interaction from mobile devices and
    the web. The goal of the framework is to provide a common language that all devices
    in an ecosystem can use. In the case of access control applications, for example,
    a door lock can have defined states or actions as lock or unlock that can be issued
    by a variety of other devices as smartphones or remotely by the Weave cloud.


    Weave stands out among other contenders for IoT frameworks by virtue of built-in
    security features such as verified boot, data encryption, and availability of
    automated security patches. Weave also has a robust set of methods for controlling
    what types of access permission various devices have to one another—an essential
    aspect of managing large numbers of devices in an enterprise setting.


    The promise of unified vendor offerings like Weave is that they also tie you into
    all of the other cloud services the company provides. In Google’s case, their
    significant investments in machine learning and AI could be compelling to one
    attempting to extract actionable intelligence from IoT data streams.


    Often confused with Nest Weave, Google Weave is intended to support connected
    devices broadly across the IoT space, not just the limited focus of home automation
    applications. In this sense, it appears to be a more industrial set of standards
    that may be a better fit for security applications.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Thread Group


    Backed by the popular IoT device Nest, the Thread Group was formed to create commonality
    to connect and control products in the home. As such, it is likely to be more
    relevant to residential security applications than to commercial. That said, there
    is often bleed from residential to small business applications, so we may find
    crossing that line for security and automation as well. Like the other standards
    organizations, wireless communications between devices and the cloud are major
    focal points of the initiative. Thread''s mesh communication technique makes it
    a natural for home automation applications but could serve equally well in larger
    facilities, depending on distance and construction techniques.


    # Apple HomeKit


    It would be remiss to discuss both Weave and Thread while leaving out least a
    mention of Apple''s HomeKit. That said, its relevance to commercial security appears
    limited. As its name implies, it is intended for residential applications where
    it ensures that all IoT can be seamlessly integrated into the IOS platform.


    For commercial and industrial applications, however, it is not a good fit. Its
    authorization model for device interaction is too simple for the complexities
    of an enterprise or building automation project. Large commercial systems need
    role-based permission systems that allow administrators to adjust authorizations
    on a fine-grained basis. Systems designed for the home do not need this level
    of complexity because the number of users is small and are all, almost by definition,
    trusted individuals.'
