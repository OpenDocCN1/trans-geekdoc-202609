    do not have the resources to run the kind of good security defenses available
    for standard operating systems and network stacks. Another reason is that to support
    a sufficient investment in cybersecurity or verification testing. Untested is
    unsafe until proved otherwise.


    We talked about the software update treadmill early, but that''s not the worst
    of it. Many simple IoT devices have no provision to upgrade their


