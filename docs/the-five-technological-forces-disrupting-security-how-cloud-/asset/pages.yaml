    A related challenge for multifacity businesses is synchronization of data across
    multiple security systems. Prior to cloud-based systems, many businesses were
    saddled with having an independent security system installed at each physical
    location. The systems didn''t share information with each other.


    In practice, this meant that a person who had permission at one facility might
    not have permission at other facilities (unless their data were laboriously entered
    at each site again and again and again). The workload, duplication of data was
    error-prone, particularly when people left an organization and their data were
    not deleted from all systems. This is where mobile and the cloud systems behind
    it address this challenge. One of the most common events was that the security
    administrator or HR department dashing to the security system is employee departure,
    particularly a disgruntled one. Who wants the nightmare of trying to remove privileges
    from all sites, especially when those sites sit hundreds of miles apart? With
    a mobile application backed by a cloud-based security system, you can take care
    of it in a single swipe.


    # PROPERTY MANAGEMENT


    For managers of multiple locations, the benefits are even more pronounced, as
    they often have large teams of mobile employees with oversight responsibilities
    for many widely distributed properties. Leasing agents, building engineers, custodial
    staff, and many other roles need access and operational data to do their jobs.
    Mobile security and building automation apps give these employees a new degree
    of freedom. If the management company has installed similar security systems in
    each building, mobile apps can be configured for single sign-on across all relevant
    properties. In our current environment, where password management is challenging,
    to say the least,'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'uniformity or federation of employee identities across multiple physical prop-perties
    is a vital cyber information security practice.


    # WHAT ABOUT RESIDENTIAL?


    The residential market has always led the industry in creating innovative apps
    for security and automation systems. The leaders in this market have strong mobile
    offerings since at least the late 2000s, right on the heels of the iPhone introduction
    and all the other smartphone platforms that followed. These residential systems
    pioneered the era and are still the model for many commercial products. At that
    time, they displaced the old clunky, wall-mounted alarm panel. They boasted new
    capabilities like remote video and kids alerts told parents when their children
    arrived home school. Some of this innovation was by necessity. As a consumer product,
    residential security faces higher expectations for convenience and engagement
    than what commercial users demand.


    That said, residential applications are necessarily different from commercial
    applications. Commercial applications face a different set of requirements and
    design challenges than residential, and many of these differences are beneath
    the surface. Each residential account, for example, has a much smaller number
    of users who can log in. This reduced scale has broad impacts on the design of
    the user interface and complex subjects like role-based permissions and authentication.
    Residential accounts also naturally limit the number of locations, cameras, doors,
    and sensors compared with enterprise-class systems. Designing for security assets
    that live under hundreds of roofs is different than designing for dozens or even
    hundreds that live under a single root.


    Commercial systems must also support a much greater diversity of third-party products
    than residential systems, in some respects we have the luxury of a "walled garden"
    approach. Nowhere is this more evident than in support for literally thousands
    of models of high-quality video cameras, in the case of commercial systems, versus
    the small set of web cams that suffice for most homeowners. Commercial users also
    demand video retention periods of as much as 1 year, for compliance reasons, whereas
    homeowners are generally content with a few weeks. A similar story plays out with
    video quality, where commercial uses require high resolution, high frame rates,
    and demanding low-light performance, while residential systems relax most of the
    requirements to fit market pricing and homeowner budgets.


    We see the same difference in access control features. For example, mobile apps
    for commercial properties need to support complex rules and user hierarchies,
    while residential systems need only manage a handful of people who may have'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# CHAPTER 7: What Can Mobile Do for Me?


    permission to unlock a door or at home. The differences extend beyond the face
    of the application to deep within its bones. For example, commercial locking hardware
    needs to integrate with dozens of types of doors, architectural with hard-wired
    magnetic locking systems to emergency exits with UIL-compliant crash bars. Residential
    systems have the convenience of supporting-battery-powered wireless door locks
    that can be retrofitted into standard windings.


    # BIOMETRICS & MULTIFACTOR AUTHENTICATION


    Mobile platforms have solved a problem that has vexed the industry for years:
    how to get users to adopt the higher quality authentication biometrics provide.
    For as long as I have been in the industry, experts have been predicting that
    biometrics was “just about to take off.” The promise has come sound like airline
    announcements in a plane stuck on the tarmac: 15 minutes say that the plane is
    about to take off while we wait for hours.


    Sometimes we have to switch planes before we can take off, that’s not a bad analogy
    for what’s happening with biometrics right now. Since ever technologies like fingerprint
    and retinal scanning have become effective and practical in a small electronic
    package, they’ve intrigued customers. On the surface, they appear high-tech, convenient,
    and trustworthy. They eliminate the problem of lost access cards. I can’t count
    the number of times customers have asked for the same biometric technology they
    see on TV and would like to implement for their bank, their condo association,
    their office building, or even the refrigerator in the break room, until they
    hear the price. At that point, the smile leaves their face, and they decide to
    settle for conventional card access.


    The big uptick in biometric adoption occurred when phone-based fingerprint recognition
    was introduced during the early 2010s. These platforms provided a clear path toward
    the widespread use of biometrics—just not on the dedicated fingerprint scanners
    the industry had expected.


    Smartphone biometrics cover two important use cases: logging into a security management
    application and using a mobile credential to enter a restricted area. Until biometrics
    became part of our mobile platforms, logging into a security management app faced
    all of the same password management and cybersecurity considerations as any other
    online log-in. Lost, stolen, or overly simple passwords created a gap that compromised
    our assets. The issue is even more pronounced in the case of mobile credential
    authentication because of the high usage frequency we see for most access control
    settings. The choice for app developers was to keep the credential logged in,
    in which case it’s no more secure than a card, or else antagonize the user with
    an authentication request and every time she wanted to enter a restricted'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Transformation 75


    area (which now includes bathrooms in many modern offices buildings or corporate
    environments).


    In addition to showing up your cybersecurity defenses, phone-based biometrics
    also address a significant user experience consideration affecting user adoption:
    fear of Big Brother. Even people who aren''t privacy freaks tend to be uneasy
    about having their fingerprint captured by a third party and then stored somewhere
    beyond their control. You can explain to people that biometric scanners aren''t
    actually storing an image or replica of your fingerprint or retina. face. You
    can tell them what they''re actually storing something called a biometric template,
    which is a mathematical representation of the salient aspects of their biometric
    sample. But none of that matters. At a gut level, many of us have not progressed
    beyond biotechnological cultures that believe taking a photograph steals your
    soul. We, but we should be laughing at ourselves. We don''t want our fingerprints
    stored on a company server, but we''re fine with fingerprints being stored on
    our phones—as if being able to carry the “server” in our pocket makes it more
    secure.


    # TRANSFORMATION


    So far, mobile technologies have been more transformative than disruptive. The
    split between disruption versus transformation falls along the dividing line between
    administrative applications, which will be transformative, and occupant-based
    applications, which will be disruptive.


    The administrative mobile apps introduced in commercial security over the past
    5 years do the same things as their desktop forebears and are proved by the same
    vendors. They''ve moved a bunch of administrative features onto the portable platform
    that Internet users now treat as primary. So, it''s old wine in a new flask.


    The disruptive effects of mobile applications come from what I occupant applications.
    Today, the most common occupant application is mobile credentialing, as we''ve
    talked about extensively. As more features get bundled into basic credentialing,
    these occupant apps will drive strong and preferences for the “haves” versus the
    “have-nots.” Chief among the occupant features interactive security in which civilians
    (users) play a role by exchanging information with the security team.


    First, they can act as casual informants. That''s not nefarious as it sounds.
    In this case, being an informant simply means supplying ambient information about
    what''s going on in a particular place. “The see something, say something” aspects
    of these applications also provide a ready avenue for channeling noteworthy- or
    worrisome information to the right people.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# CHAPTER 7: What Can Mobile Do for Me?


    Second, this same population can be informed about events or circumstances relevant
    to the security mission. Warnings, cautions, adverse circumstances, and even routine
    maintenance inconveniences can be shared with a business or social group to improve
    overall functioning of the community. I think of the routines about fire alarm
    testing in my own building, which are today inefficiently communicated from property
    managers and to individual employees via e-mail—if anyone bothers to pass along
    this information in the first place. In case of interactive security, everyone
    using a given commercial property will have a mobile credentialing for their building,
    and such notifications and messaging will be built in.


    No more surprise drills.


    Both adminative and occupant apps have emerged on both cloud- and premise-based
    systems. However, cloud-based solutions have increasingly gained distance on non-cloud
    approaches because they leverage more of the power of the cloud itself. These
    apps import features that other cloud services can provide as part of the API
    ecosystem. New mapping? It’s right there through the social networks. Need social
    data? It’s right through Google Maps. Need emergency response information? It’s
    there from multiple RSS feeds. The cloud-based identity federation and single
    sign-on (SSO) links that support a seamless user experience across all these services
    will forever elude the aging premise-constrained, single-tenant application model.


    Earlier, I mentioned the relative efficiency of providing a single cloud-based
    mobile service for the entire universe of users (as opposed to establishing a
    premise-based mobile service for every client or installation). This clearly favors
    cloud-based mobile solutions, which can release both mobile and service updates
    synchronously. A client population with mixed versions of mobile apps and server
    software cannot be kept uniformly updated and will never get all the advantages
    of new feature releases.


    # WHAT’S MY MOBILE STRATEGY?


    In the case of mobile strategy, this means having a cloud-based architecture behind
    your security infrastructure. You’ll need to look for cloud integration and support
    capability from your vendor of integration services and make sure that their suppliers
    work on the cloud already or have a definite road map to get there.


    The disruptive impacts of occupant applications strongly favor the cloud-enabled.
