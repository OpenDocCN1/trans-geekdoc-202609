    +   1. **On-demand self-service**: the ability to provision computing capability
    without requiring human intervention. In other words, you can create an account,
    set up a new application, and complete the financial transaction without calling
    a support center or wait an IT person to do something.

    * Why it matters for integrators: the value of on-demand self-service is that
    you can turn on application services immediately and get on with installing controllers,
    cameras, sensors, and the like without waiting for a server to be set or software
    licenses to be installed. On-demand self-service also means that technicians require
    less training and can become more productive quickly after being hired. Couple
    that with few opportunities to make mistakes on in-field deployments, and you
    can see a big boost.

    * Why it matters for security organizations: your new security system can be installed
    more quickly than the traditional model. With no-premises servers, your integrator
    will require less time on-site and fewer resources from your IT staff. You should
    also see a lower up-front cost of installation (assuming that the integrator passes
    these savings).

    2. Broad network access: cloud services must be available over the network and
    accessible through standard mechanisms such as browsers, cell phones, tablets,
    and workstations. The security profession had necessarily become mobile and 24/7
    well before the rise of the Internet, Contrast this with the old-school model
    of system access only at a guard''s desk or the back office, and you can deny
    the benefit.

    * Why it matters for integrators: broad network access allows integrators to deploy
