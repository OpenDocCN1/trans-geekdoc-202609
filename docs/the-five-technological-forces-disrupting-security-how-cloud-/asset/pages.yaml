  md: 'to respond to the immediate threat. This is where professional and DIY/IoT
    systems most clearly diverge.


    # WILL IoT BE DISRUPTIVE?


    IoT may prove to be disruptive in one of two ways: data analytics and the broader
    success of DIY products.


    There is a big opportunity to harvest and add value to IoT sensor and device data
    streams. Manufacturing and deploying connected devices is already moving forward
    at a nice clip, but it has yet to see how data analytics will shape up on the
    back end. Large-scale analytics of sensor data streams will be slow to emerge
    within security software platforms by slow migration to the cloud, development
    of consensus analytics useful to a broad swath of the market, and pricing models
    that fit within security budgets. It''s one thing to display pretty graphs and
    another to provide insights that change decision-making.


    IoT will also be disruptive if it enables products that make DIY as good as professionally
    installed systems. I am not saying this is even possible, but that there is a
    continuum and many would feel the impact of a shift toward DIY IoT substitutes.


    Changes to the vendor landscape will track the consumerization theme we have developed
    across all the major sections of this book. The nature of the disruption is that
    what once could be accomplished with only highly specialized products can now
    be accomplished inconxpensively with consumer IoT platforms.


    For example, it wasn''t long ago that something as simple as a water sensor was
    a specialty device, not generally available to consumers, and usually wired into
    a central control panel with correspondingly high installation costs. Today, it''s
    an inexpensive wireless device that you can place wherever you want it and begin
    using in less than 5 minutes. What''s more is today''s water sensor is probably
    also a temperature, vibration, and air quality sensor—all for a lower price than
    the dedicated, hardwired water sensor of 5 years ago.


    # ADOPTION


    Like cloud adoption rates, IoT adoption rates in security vary greatly between
    commercial and residential markets. In residential markets, IoT is pretty much
    a done deal. Every home security offering is now a smart home offering, which
    is another way of saying that it includes IoT devices. There is universal agreement
    among analysts and market studies that this is a growing trend for the foreseeable
    future. What this means is that we''ll continue to see improvements in'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'both cost and capabilities as more types of devices reach mass production and

    more competitors enter the market.


    Commercial security systems will move more slowly, in part because they are

    larger, more complex, and require more time to integrate new features in a

    coherent way. They are also subject to different regulatory requirements, espe-

    cially for anything that concerns safety of life or fire alarm systems. That said,

    they comprise of the so-called Industrial IoT, by which most measures are

    icipated to be even larger than the residential market.


    # STRATEGY


    How should security organizations approach IoT? Start by watching the resi-

    dial space to see what kinds of capabilities are relevant to your commercial

    setting. Residential systems are a predictor of what will become available in

    commercial systems, and the adoption of IoT is certainly one of those proof

    points.


    A need-based approach might begin with the asking what''s missing in your

    information set today that additional sensors could feel. What visibility would

    y like to have that you don''t have today, and it is possible that the right IoT

    device could provide it?


    To help with your thinking, start with the family. IoT devices often don''t pro-

    vide a qualitative type of data or situational awareness. Often, they just

    make the same types of data more affordable at more locations. Or they may

    make it possible to collect information at locations infeasible before, thanks

    to wireless connectivity, lower power consumption, and improved battery life.


    # CODA: IS IoT REALLY A CATEGORY?


    As a closing thought, I owe you a slightly contrarian perspective on the IoT

    category as a whole.


    From a historical perspective, the meaning of IoT as a product category is

    roughly on par with the meaning of "electric appliances" at the beginning of

    the last century. The first electric toaster and the first commercial electric

    vacuum cleaner were both introduced in 1905. Then, the first was patented

    electric milking machine (1910), and the earliest commercialized electric washing
    machines (1930).

    At that time, there was no product coherence to these machines,

    an the same holds for IoT today. There are hundreds of IoT products for hun-

    dreds of uses, but they are no more alike than a toaster and a milking machine.

    Many of these turn-of-the-century technological marvels were retrospectively'
