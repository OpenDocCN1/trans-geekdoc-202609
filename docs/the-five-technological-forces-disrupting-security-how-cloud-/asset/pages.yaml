- pgno: 140
  md: '# CHAPTER 10: IoT Technology and Standards


    They are usually accompanied by development tools that make it easy for other
    developers to build solutions on top of their frameworks. Open-source versions
    encourage broader adoption with some assurance of transparency and self-determination
    (in case the core goes another direction). The open-but-proprietary model has
    succeeded before and offers advantages for certain types of organizations.


    # STANDARDS ORGANIZATIONS AND CONSORTIA


    Open-standards organizations are defined by their inclusiveness (anyone can join)
    and adherence to a published set of procedural rules governing how standards are
    proposed, created, and subsequently modified. They are operated under the auspices
    of large standards bodies such as the American National Standards Institute (ANSI),
    the International Electrotechnical Commission (IEC), the International Organization
    for Standardization (ISO), and the International Telecommunication Union (ITU).
    They are generally open to any organization or individual who wishes to join,
    attend proceedings, or submit comments. There are no membership fees and no pay
    to play.


    Standards consortia, though often mistaken for open standards organizations, are
    closed-membership groups that usually charge a fee and are free to determine their
    own procedural norms. They look very similar from the outside because their membership
    lists and scope of activities. They are nevertheless an important part of the
    standards landscape and can often move more quickly than formal standards organizations.


    What follows is a brief overview of a number of open-standards organizations and
    consortia that are currently working on IoT standards to reveal the physical security
    industry.


    # Security Industry Association Standards Committee


    The open-standards organization closest to the interests of most security organizations
    is the Security Industry Association Standards Committee. (Full disclosure, I
    have served as the chairman of the SIA Standards Committee for the past 6 years.)
    The committee is an active ANSI Standards Development Organization (SDO) and so
    can have its specifications ratified as formal standards with both national and
    international organizations. The purpose of the group is to develop, discover,
    influence, and provide education on standards relevant to security applications.
    It is predominantly composed of members of the Security Industry Association,
    although its membership is open to any-one who wishes to participate.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Standards Organizations and Consortia 121


    The SIA Committee recently established the cloud, mobility, and IoT subcommittee
    to examine interoperability, authentication, identity, and cyber-security issues
    for the adoption of IoT in the physical security. The rationale for developing
    this subcommittee was based on the following observations:


    +   - IoT devices will be the growing source of data in physical security systems.

    - Security systems can harvest this value only if there are norms to build secure
    IoT deployments that operate with security management tools.

    - IoT devices will introduce new communication protocols that need to be integrated
    into security systems and services.

    - IoT can enhance physical security only if cybersecurity risks are properly mitigated.


    The committee is also examining standardization of mobile credentials, specifically
    the use of digital credentials with access control readers via Bluetooth low energy
    (BLE). In broad terms, these standards would play a similar role to the Wieand
    and card-to-reader standards that have been part of the industry for the past
    several decades. In the absence of standards for mobile credentials, the industry
    is at risk of having multiple proprietary protocols, which retard adoption, add
    cost, and ultimately not serve the interests of end users. The standards created
    by this project could form the basis of mobile-to-reader interaction for the next
    20–30 years.


    # Industrial Internet Consortium (IIC)


    The Industrial Internet Consortium was founded in 2014 as a not-profit partnership
    dedicated to advancing the growth of IoT for commercial and industrial applications.
    Their goals are to drive innovation with industry-specific use cases, develop
    a reference architecture for interoperability, influence the global standards
    process, and facilitate innovative approaches to IoT security. The IIC has published
    a number of IoT reference frameworks that are relevant to both manufacturers and
    system integrators (and, therefore, to security organizations).


    The IIC has organized its activities around five vertical industry groups: health
    care, energy, transportation, smart cities, and manufacturing. All of these verticals
    intersect with security, particularly at the framework level where the IIC has
    created two publications to be influential in end-user organizations in all of
    these market segments.


    The Industrial Internet Reference Architecture² is a standard-based approach to
    guide system architects building IoT systems in common framework.


    > ²http://www.iiconsortium.org/IIRA.htm.'
