- pgno: 187
  md: '# Artificial Intelligence 167


    mining, deep learning, and (still) cognitive computing. But those are the sub-ject
    of another book.


    For now, let''s consider AI as a way of dealing with incoming data and making
    sense of them on our behalf, without getting too up on exactly what''s going behind
    the scenes. Regardless of the specifics, it is clear that a new generation of
    analytic capability or intelligence will be needed to handle the growing volumes
    of data streaming into our security systems. Without such capabilities, the hackacks
    will continue to grow faster than our ability to find the needles. Frankly, there
    are many indications that this will within reach of almost any software system
    over the course of the next decade.


    Let''s step back for a bit of contrast. In the early days, a company needed its
    own team of AI researchers to make any progress within their own domain. The notion
    of a generalized intelligence that simulated the human brain was proving difficult
