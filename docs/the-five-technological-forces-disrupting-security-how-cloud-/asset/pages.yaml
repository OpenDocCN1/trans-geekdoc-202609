- pgno: 198
  md: '# CHAPTER 15: Data-Driven Security


    vantages that the defenders have over physical security is that they share information
    with each other. The world of software and networking devices has a long history
    of exchanging data about security threats and vulnerabilities in their outlying
    products.


    In the public sphere, for example, NIST collects and publishes such data in a
    National Vulnerability Database (NVD) that provides a centralized resource for
    security researchers and practitioners. Mitre’s closely related and federally
    funded Common Vulnerabilities and Exposures (CVE) is “a dictionary of publicly
    known information security vulnerabilities and exposures.” The federal government
    also maintains a Computer Emergency Readiness Team (US-CERT) that respond to major
    cyber incidents around the world with goal of making the Internet safe for everyone.


    And there are numerous private resources, such as IBM’s X-Force Exchange, which
    is a library of shared security intelligence data, including 700 terabytes of
    raw aggregated security information for researchers. The service includes real-time
    data that can be useful in preventing or limiting damage from current or ongoing
    attacks. At an ingestion rate of 15 billion security events per day, X-Force provides
    a cloud-based platform that allows organizations to collaborate on security incidents
    and responses.


    # ADOPTION, TRANSFORMATION, AND STRATEGY


    Adoption of big data within commercially available security systems is virtually
    zero out of a few pioneering features in smart home products. I wish it were otherwise,
    but big data will not transform much of anything in the commercial security market
    for least the next 3–5 years. It won’t be in the market for least that long.


    Over time, big data will eventually follow the path of many other technologies.
    What once differentiators become commoditized features that every vendor is expected
    to include. At point, there will be those who have kept pace an incorporate a
    big data strategy into their product design and those who haven’t. The change
    will be similar to the much earlier falling away of vendors who do not make the
    transition to the cloud.


    For business owners and corporate security organizations, this inevitable change
    should be familiar by now. It’s about picking a horse, so to speak, that has some
    staying power. Vendor and product obsolescence are one of the largest among buyers
    when purchasing core IT systems that must


    > https://cve.mitre.org/


    > https://exchange.xforce.ibmcloud.com.'
