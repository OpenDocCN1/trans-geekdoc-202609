- pgno: 26
  md: 'was their disruptive underbelly, their potential to exact creative destruction
    on many industries far and wide, including physical security. Who could have known
    that an electronic mailbox for homeowners would one day compete against the giants
    in access control? Who could have known that a single smart multisensor would
    one day blanket an entire home with protection? Or that the battery-powered camera
    would knock out the heavyweights of analog video? These are all IoT, and they
    hit the security industry right where we live.


    How so?


    Electronic security created the business and technology template that has since
    become the model for IoT. Electronic sensors monitor their environment. Check.
    Digital transmission of sensor data. Check. Remote control of electromechanical
    systems. Check. Centralized computing systems that knit whole networks of sensors.
    Check. Algorithghmic responses to predefined criteria. Check. User interfaces
    to access humans.


    Many of the technical details differ from today''s IoT, to be, but the underlying
    concepts and relationships are remarkably similar. Sensors were larger and used
    phone lines than the Internet. Digital transmission was slower and had a much
    smaller vocabulary. Electromechanical systems were less intricate. The hub of
    the network was at central stations staffed by trained operators. The algorithms
    were deterministic rather than self-educating. But they got the job done all the.


    All of this explains why IoT products have so readily became what classic economic
    theory refers to substitute goods—things that replace other things—the new Wi-Fi
    sensors that can see through walls and security cameras for intrusion detection.
    It also explains why the security is so ripe for consumerization: all the kinds
    of products we made of the same stuff as convenience and lifestyle innovations.
    The signature example of this is video management software that replaces security
    cameras by stitching old networked iPhones onto a Wi-Fi video surveillance. An
    amateurish kludge, but it makes the point.


    If the SmartBox unwitting into IoT, it also makes that the logic of identity and
    access management (IAM) is fungible across dissimilar domains. I make this point
    for those who would dismiss the possibility of IoT disruption as being a superficial
    comparison. It''s not. The SmartBox needs a distributed access management overlay
    to make the same overlay that now manages commercial properties around the world.
    Even 15 years later, authentication and distributed credential management remain
    central central challenges for IoT. Technical standards for IoT interoperability
    are fundamentally absent identity and access management. We are about deciding
    who can interact with an IoT device and how they can prove their right to do so.'
