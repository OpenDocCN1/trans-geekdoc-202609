    the approach changed to solving very particular problems or teaching computers
    to execute specific tasks. For that type of research, every problem was so narrowly
    defined that unless else was working on the exact thing you wanted to know about,
    you had to roll your own. For most companies, having this level of expertise in-house
    was completely out of reach. The expertise could only be found in academia and
    organizations with large R&D budgets and longterm horizons.


    Back to the present, AI and related algorithms are now available to almost anyone,
    and simply using them requires less expertise than ever before. For software developers
    and product companies, there are now “app stores for algorithms” that condense
    all the complex data science and programming into one easily consumable base.
    You no longer need to have Marvin Minsky in the basement.¹ The same capabilities
    are also available in the even easier-to-digest form of AI as a service from major
    cloud providers like Amazon, Google, and IBM, to name a few. This is remarkable,
    considering that as the dot-com era, AI was still considered to be out of reach
    for most products and many professional disciplines. What we are witnessing is
    the consumerization of AI, just as we witnessed the consumerization of IT and
    security making the effects of a perfect storm in the preface of rising IoT data,
