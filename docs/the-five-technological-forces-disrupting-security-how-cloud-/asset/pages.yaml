    Three of the specific techniques behind these machine-driven insights are segmentation,
    clustering, and association. They are all examples of what data scientists call
    unsupervised learning, which is a way for machines to find patterns without direct
    directives on what relationships there be in the data.¹ We will look at how each
    of these is relevant using big data in security applications.


    Segmentation is the process of dividing a large group of data into subgroups with
    common characteristics. A familiar example is consumer marketing, where the goal
    is to segment customers into subgroups that share buying patterns or preferences.
    Millennials, for example, are more likely than all other age groups using streaming
    media, so that''s a great place to reach them with advertising. If you are targeting
    Baby Boomers, on the other hand, Facebook and other social media are a better
    place. Segmentation is not just for marketing. It can apply to many kinds of data
    sets and behaviors. Profiling is a familiar (and possibly illegal) type of segmentation
    that groups people by age, race, gender, or other characteristics. While the practice
    is rife with civil issues, the statistical basis for it is no different than what
    markets and counterterrorism experts use every day.


    Discovering the groups for segmentation is the job of clustering algorithms. They
    examine across all the attributes of the members of a data set and look for groups
    that produce unsupervised learning plays a role. If it is already known which
    groupings will produce predictions about how the members of a group would behave,
    then on the other hand, there is just subdividing the data based on existing knowledge.
    If, on the other hand, there is no knowledge or even a hypothesis, clustering
    can help find the relationships for us. The result may be one or more ways to
    cluster the data that can be used for additional modeling and research.


    One of the characteristics of classification algorithms is that they can be applied
    to problems where the data attributes are not continuous, which is to say they
    are not numerical. For example, the attributes of interest may be binary, such
    as whether or not a person is a citizen. They might also be multivalued discrete
    variables, such as the highest level of education achieved by a job candidate.


