    # MACHINE LEARNING


    Most of the problems we encounter or most of the data sets we are interested in
    are much more amenable to machine learning than they are to classic AI. There
    is some selection bias here. Machine learning has turned out to be good at solving
    problems that have business value, from medicine to self-driving cars to cybersecurity.
    Early success in these areas attracted additional investment and research, and
    the virtuous circle of positive results and reinforcements have continued to fuel
    growth.


    We''ve mentioned machine learning in passing earlier chapters of this book, but
    have not focused on a definition. Usually defined as a way for computers to gain
    new knowledge without being explicitly programmed, machine learning sounds like
    the holy grail of artificial intelligence: machines that can think for themselves.
    That''s the part that excites the popular imagination, but there''s a bit more
    to it than that. Machine needs to be exposed to data in order to learn, and there
    are multiple ways to accomplish that goal.


    There isn''t just one type of machine learning. There are many types of machine
    learning algorithms, and they excel at solving different kinds of problems. It
    is not a one-size-fits-all intelligence (which, by way, is the pretty cool things
    about our own brains). The algorithms are usually categorized as one of the three
    general types: supervised learning, unsupervised learning, and reinforcement learning.
    They are all relevant to physical security analytics, but in different ways.


    In unsupervised learning, the algorithm combs through large data sets and draws
    inferences without having been given a specific goal. We discussed this earlier
    in the context of classification and segmentation. For example, an unsupervised
    algorithm might be used to answer the question: do the visitors to my'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'property naturally fall into different groups? In this case, there is no specific
    outcome or grouping provided in advance. The job of the algorithm is to sift through
    the available attributes expressed in the data and look for natural groupings
    or clusters of individuals with similar traits.


    The initial outcomes of unsupervised learning may be useful or not, in the sense
    that the groupings may provide any practical knowledge that allows you to manage
    risk. For example, if an unsupervised algorithm was applied to access control
    records for a large building, it might find two major groupings: people who go
    in and 10 times a day (smokers) and people who go in and twice a day (nonsmokers).
    These observations are interesting, if not obvious, but highly relevant to security
    management. On the other hand, we might find other classifications that provide
    entirely new insights about groups of people, locations, or times of day closer
    scrutiny. That''s what''s fun about unsupervised learning: it feels like the computer
    is a genius and can just figure out.


    Supervised learning describes methods of data analysis where the investigator
    is pursuing a particular hypothesis and wants to know whether different groupings
    of data are useful for predicting the outcome or target value of an interest.
    Supervised learning works by training an algorithm on set of data that we have
    explained the relationships to be normative or predictive for future sets. Neural
    networks are often programmed this way, for example, make associations between
    inputs and outputs, specifying an exact mathematical or functional relationship
    between them. The algorithm compares attributes to known outcomes or behaviors
    and draws inferences about which attributes are relevant predictors of those outcomes
    or target values. Once the algorithm has been trained, it can be applied to new
    data sets and predict which elements of that set will behave like the data in
    the training set. Video object identification, for example, can use this general
    approach to learn what objects look like. The security application is usually
    to find bad actors, but it could just be well to identify equipment failures,
    as in many industrial settings.


    Reinforcement learning is an iterative process where an algorithm seeks to maximize
    some value based on rewards for being right. Think of a laboratory mouse to press
    a button in order to get food. The difference is that these algorithms can do
    much more quickly and on larger sets of data and choices than human. One of the
    classic uses of this in a commercial context is elevator scheduling, where the
    goal is to move the greatest number of people as quickly as possible with little
    energy as possible. One could extend this to managing the rate at which people
    were allowed through a turnstile feeding an elevator lobby so that it not only
    never overcrowdedded but also didn''t keep people needlessly waiting.'
