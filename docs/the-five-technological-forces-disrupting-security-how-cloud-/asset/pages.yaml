- pgno: 49
  md: '# The Tipping Point


    The year 2015 marked the first time the security industry saw a conference dedicated
    to the topic of cluding computing for physical security applications. *Security
    Systems News* organized and hosted the Cloud+ conference, symbolically convened
    in the heart of Silicon Valley. With this conference, they came back to repeat
    history for a new generation of technology. The large and enthusiastic turnout
    for this first-of-kind conference signaled that the tipping point had arrived
    for cloud computing in physical security.


    Given the industry''s many years of reluctance, public doubts, and even open criticism
    of cloud computing, how did the industry reach this point? What had changed by
    2015 that led most polls to indicate that the cloud could be considered a permanent
    part of the industry''s solution set?


    # THE DRIVERS OF ADOPTION


    Customers have become accustomed to the conveniences and benefits of cloud computing
    for their personal use, and they wanted it in their professional systems. In that
    domain, most customers asked if any of the tough questions they brought to the
    office when evaluating the feasibility of cloud-based computing for their businesses.
    Instead, they simply accepted that their bank, their broker, their online shopping,
    their backup file storage, their family photos, and even their social lives could
    and should be conducted via the cloud.


    Customers wanted convenience, ease of use, and lower IT costs than what traditional
    solutions could deliver. Customers had learned from examples in HR, finance, and
    customer relationship management (CRM) that applications work on any browser,
    anytime, anywhere. They had to expect that they shouldn''t need to install special
    software or buy restrictive licenses that forced them to use it on just a single
    PC. Finally, with the coming of'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# CHAPTER 3: The Tipping Point


    mobile computing during these same years, everyone expected they could take their
    office applications with them.


    But there were challenges to overcome.


    # A BALANCED VIEW OF CYBER RISKS


    The biggest hurdle for cloud computing had always been pervasive doubts about
    cyber security. This challenge was not unique to the security industry. In fact,
    cyber security has remained the prevalent reason for corporations'' reluctance
    to move to the cloud. If physical security professionals shared this concern with
    their IT brethren, they hardly stood out. Few wanted to be early adopters within
    their own peer group, regardless of what similar groups in other market segments
    might be doing.


    Between 2010 and 2015, however, the software industry as a whole made strides
    in comforting customers over the actual versus perceived risks of cloud computing.
    The steady stream of press articles detailing how and more large corporations
    were shifting major parts of their business operations over the cloud helped.
    Fortune 500 stalwarts announced new cloud initiatives and made them central to
    their new advertising campaigns. The biggest investment success stories all concerned
    cloud companies. There was a common thread across all of these stories that cloud
    computing had become safe enough for a company''s most precious data.


    The federal government''s advocacy also played a huge role in convincing industry.
    The shot around the world was GSA, under CIO Casey Coleman, announced in December
    2010 that it was moving its email system over the cloud. Claiming to reduce inefficiencies
    and lower costs by half, the shift told government contractors and system integrators
    that the cloud was now an approved technology. Within the year, spearheaded by
    the Obama administration’s first CIO, Vivek Kundra, the government put forward
    in February 2011 a cloud computing strategy that made “cloud first” a policy mandate
    for all federal computing.


    Given that the government had previously operated under the labyrinth requirements
    of the Federal Information Security Management Act (FISMA), the emerging attitude
    appeared to be “If it is good enough to federal enough for us.” With this last
    holdout embracing a pro-cloud policy, doubters had nowhere left to hide.


    # BEYOND STACK-A-BOX


    In the early stages of cloud adoption, many companies underestimated what it took
    to put together a cloud service. Corporate executives unfamiliar with the'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'technology had difficulty understanding why their legacy products couldn''t
    simply be operated at an off-premise data center and christened as a cloud solution.
    After, all had invested tens of millions of dollars over dozens of years perfecting
    a feature set for an on-premise client-server solution. Surely, that couldn''t
    be obsolete now, could it?


    Few executives understood the not-so-subtle distinction between operating a multitude
    of virtual machine instances—each a complete environment itself for a single customer—and
    a true multitenant software architecture that supported all customers concurrently
    on a single platform.


    They tried anyway.


    These early attempts to simulate the outward appearance of cloud computing with
    scads of individual virtual machines ignored the real work that goes behind scenes.
    As such, they came to be known as “stack-a-box” systems because their economics
    and operational requirements were no different than stacking piles of servers,
    or “boxes.” They achieved no economies of scale at the hardware level, no economies
    of scale at the IT administration layer, and no economies of scale at the development
    and deployment layer. While the customer no longer had a solution residing in
    their own data center, they still paid the same price (or more).


    This imitation cloud model broke down for several reasons. First, software providers
    failed to hide the underlying complexity from both channel partners and end users.
    The rapid provisioning and elasticity buyers wanted simply couldn''t be delivered
    on the back of a thousand independent servers. The cost advantage of the cloud
    couldn''t be realized. Either customers had to pay more or service providers had
    to settle for low margins, neither one sustainable. It tried and failed to circumvent
    the fundamental economics of the cloud: it takes economies of scale to drive unit
    costs down to the point where efficiency gains off.


    Finally, the leverage cloud services for mobile and API services couldn''t be
    replicated. The stack-a-box approach required a multiplicity of endpoints and
    network management to supply these services, creating a crushing burden too great
    to bear.


    # ARE WE MORE CONSERVATIVE THAN OUR CUSTOMERS?


    The integrator channel itself presented the third major hurdle. While several
    leading national integrators started using cloud solutions as early as 2003, others
    regarded it as a sideshow to the main business of security. The majority believed
    their customers would not endorse or pay for an off-premise, recurring revenue
    version of systems had long purchased and installed in their own buildings for
    a onetime fee.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 32 CHAPTER 3: The Tipping Point


    Contrary to expectations, it turned out their customers already used the cloud
    for many other business applications. By the mid-2000s, major cloud companies
    like Salesforce.com had won over many customers who liked the simplicity and pricing
    model of the cloud. Thanks to good track records, customers had come to grips
    with the fact that—maybe, just—cloud companies were better at managing and protecting
    data than they were themselves. By 2010, analysts agreed that the vast majority
    of organizations expected to grow their use of SaaS. However, many within the
    industry remained convinced that these customers would not buy cloud solutions.
    Adoption rates for as-a-service offerings hovered in the low single digits.


    Many observers have pointed out a generational effect in this lagging adoption
    dynamic. Operating with the assumption that the cloud would be unacceptable to
    their customers, many industry grayboards would not present the option, validating
    the self-fulfilling prophecy that no one will buy it. Meanwhile, a new success
    pattern emerged at integrators who recruited new sales staff out of college. The
    youngest members of their sales forces—millennials who had grown up with the cloud—had
    no trouble accepting the cloud value proposition and presenting it convincingly
    to customers. Ironically, this resulted in sales offices with an old cloud naysayer
    in one corner and a younger colleague counting cloud commission in the other.


    # A FOOTHOLD FOR CLOUD


    During all this, a handful of manufacturers and integrators kept moving the ball
    forward—not at the rate of the software industry as a whole, but forward nonetheless.
    Many early users viewed the cloud as a niche to pull out of the tool kit when
    standard solutions failed. From small or remote sites, for example, with limited
    access control and videos were some of the first equipped with cloud-based security
    systems. In many instances, locations could not support the expense and complexity
    of a full-site server. Cloud solutions came in a lower price point and provided
    built-in connectivity to corporate headquarters, which kept satisfied. Unfortunately,
    this by deploying cloud kept it pigeonholed as a small system solution during
    its early years: it''s nice for a little job, but not really up to the task of
    securing a large enterprise.


    From this, however, cloud solutions began their climb up the enterprise ladder
    by overtaking larger numbers of small locations. This way, each location appeared
    to live in the small system comfort zone. In the aggregate, cloud solutions grew
    to handle enterprise systems as large as any legacy platform. Retail branch locations
    were among the earliest to join. National retailers, banks, pharmacies, and other
    chain operations have massive'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# The Barriers Are Down


    of individual locations, often well into the thousand-plus range. Each location,
    however, has only a few doors or entrances that need to be secured. Local technicians
    working at any one of these locations, each installation looks exactly like other.
    None of them needs to take into account how the overall system fits together at
    the corporate level. The cloud takes care of that. For integrators, technical
    installation complexity flat regardless of system size. For customers, this meant
    that they could leverage the strengths of the cloud rather than paying for complex
    network engineering and system sizing exercises (with the expensive software to
    go along them).


    The visibility gained by these supposedly niche applications provided a path for
    forward for cloud use. It wasn''t huge for a security director presiding over
    hundreds of individual locations to think that the same system could also handle
    their corporate headquarters. Now it was a big leap for integrators to go from
    systems with 5 or 10 entry points per location to those with 50 or 100 or more.
    The boundaries blurred for those the cutting edge.


    There was a break in the cloud.


    # LEADING INDICATORS


    All the current data suggests that cloud computing has crossed over the tipping
    point for enterprise applications and irreversibly changed the delivery model
    for corporate software purchases. Numerous sources place cloud-based software
    penetration rates at well over 50% of new enterprise software sales.


    The security industry finally appears to move in the same direction, albeit a
    slower pace. According to a recent poll in Security Systems News, over 52% of
    respondents said that the cloud is here to stay in security applications. One
    integrator said, "cloud is clearly inevitable, and the integrators are experiencing
    with it will be the victors."


    # THE BARRIERS ARE DOWN


    Many of the barriers present in the first decade of cloud computing have now come
    down. Information security for cloud applications, while a frequent topic of discussion,
    is just as worrisome for keeping their applications housed inside corporate data
    centers. Concerns about data retention and audit compliance have become a more
    routine checklist item that now cloud providers voluntarily submit to external
    reviews and attendance. Early shortcomings in bandwidth and universal access have
    all disappeared as


    > http://securitysystemsnews.com/article/news-poll-cloud-security-future.'
