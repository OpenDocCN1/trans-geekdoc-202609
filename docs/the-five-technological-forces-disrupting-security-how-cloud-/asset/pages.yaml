    To really convinced that what''s old and what''s new, look no further than the
    advertising for home automation. The primary pitch is still "peace of mind," a
    phrase the industry has now used. Home automation adds many more IoT subsystems
    and has made them simpler to install and use, but safety is still the number consideration.
    That''s why alarm and security companies pick the list of home insurers.


    For the Industrial Internet of Things (IoT), our legacy of system integration
    serves us well. However, it presents new challenges and takes us into an arena
    with more competitors in the ring. IT and cabling companies in particular see
    IoT as a huge opportunity, from the SMB to the enterprise, and are jumping at
    the chance to expand their offerings. If the goal is for all of these devices
    to interact seamlessly, somewhat plays to their traditional strengths in IT.


    # GROUND ZERO


    The security industry sits at ground zero of this upheaval. To switch between
    gears and metas, we are in pole position for IoT adoption, given our history of
    creation, selling, and installing many of its precursors in both residential and
    commercial settings. That''s why I say it''s race to lose.


    Not that we are losing, everyone is still in the first lap with many more to go.
    A sign of our strength, the largest group of consumer IoT devices deployed so
    far is for home automation and residential security. Market studies confirm that
    security is more important to buyers than any other feature of IoT in the home.


    IoT spans both residential and commercial security installations and leverages
    industry incumbency in both. It''s predicted to flourish in far greater numbers
    in consumer in commercial and industrial settings in residential and consumer.
    According to business intelligence research, out of the billions of IoT devices


