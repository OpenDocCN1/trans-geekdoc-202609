- pgno: 223
  md: '# CHAPTER 19


    # Social Spaces


    There is an emerging group of physical objects known as the Social Internet of
    Things (SIoT). This new class represents the convergence of IoT and social networks.
    In particular, SIoT refers to physical objects that form social relationships
    with other physical objects without the intervention of people.


    I will say again—without the intervention of people.


    Social objects also connect to the familiar social networks, which means that
    we can interact with them in the same way we interact with people on those same
    networks.


    Standing at the intersection of the physical and the social, SIoT devices are
    squarely in the domain of physical security. Whether or not we choose to use them
    for our electronic security systems, they will be a part of the environments for
    which we are responsible. There is really no ignoring them any more than we can
    choose to ignore other technology that might literally walk into our buildings.


    At the simplest level, social things will be able to mimic social interactions
    that look like human activity through texting, group updates, checking in, posting
    photos, e-mails, and anything else humans can do. To get a glimpse of how this
    future is taking shape, you need no more than IFTTT, the web service that provides
    a nexus between hundreds of other web services and social networks through a simple
    visual programming mechanism they call applets. An app might link a connected
    thermometer with Facebook, for example, that every time it''s above 90°F it says
    "hot enough for ya?” or it might do something more useful, like opening the garage
    when your car enters the driveway.


    Social things will gradually exhibit more and more of the characteristics we currently
    label as human or intelligent. This phrasing only serves to beg the question of
    what is uniquely human and what can be simulated or emulated by machines. The
    exploration of this possibility—that machines can be social and intelligent—has
    a long and


    203


    The Five Technological Forces Disrupting Security. http://doi.org/10.1016/B978-0-12-80095-8.00019-3

    © 2018 Elsevier Inc. All rights reserved.'
  merge: -1
