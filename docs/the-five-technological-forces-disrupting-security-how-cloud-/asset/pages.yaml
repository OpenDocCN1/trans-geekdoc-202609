- pgno: 31
  md: '# DOT-COM REDUX IN PHYSICAL SECURITY


    The transformation of IT and the US economy as a whole to the cloud took place
    quickly and chaotically during the dot-com era that it was hard to observe. Even
    for those of us in the middle of it, there was more going on than anyone could
    follow all on. I recall the breathless coverage of The Industry Standard, a weekly
    that called itself the news magazine of Internet. New companies sprang up and
    died before they could celebrate their first birthday. The “new economy” had hard
    cash, and “changed all the rules,” and “eyeballs” are counted more valuable than
    cold. Exorbitant rates were a badge of honor. Suddenly, they weren’t, and the
    party was over.


    I expect to see a replay of certain dynamics of that era in the physical security
    industry over the next 5 years –without that awful crash part at the end. It will
    not be quite so encompassing, but it will be every bit as transformative and beneficial
    for the security consumer. The “new economy” will see the steady growth of market
    share for cloud companies at the expense of those who lagged behind a bit too.
    It will emphasize customer acquisition, as the original land grab for market share
    in each subset of the new economy. It will emphasize innovation, new paths to
    the market, and online purchasing, as we saw in the first shift from bricks and
    mortar to bricks and clicks.


    Security companies are increasingly threading cloud language through their marketing
    messages for fear of being behind. Meanwhile, product teams with multillion dollar
    investments in huge legacy code bases struggle to deliver a cloud-like experience
    without sacrificing their company’s cash cow. New entrants and nontraditional
    suppliers have moved into the cloud space at a faster pace than legacy providers,
    making for a territorial squabble with far more players than anyone ever expected.


    Because of these dynamics, the security industry represents an echo of the first
    wave of the new economy. It gives us another chance to look into the petri dish
    and watch a new life form emerge. This time, though, we know how the experiment
    will turn out and where to place our bets.


    # TECHNOLOGY ADOPTION IN PHYSICAL SECURITY


    The technology adoption life cycle is a well-known sociological framework for
    describing the acceptance of a new technology or innovation across one or more
    markets. It was originally developed in Everett Rogers’ landmark Diffusion of
    Innovations³ and forms the theoretical backdrop for Geoffrey Moore’s Crossing
    the


    > ³Rogers, E. M. (2003). Diffusion of innovations. New York: Free Press.'
