- pgno: 73
  md: 'The first type to appear on the market built on the near-field communication
    capabilities (NFC) added to smartphone platforms around 2010. Because NFC uses
    the same radio protocols as smart card readers, they were a natural fit for access
    control applications. They could be added to existing smart-card-enabled systems
    in a familiar technical implementation. Users also readily understood how to use
    them, because the short activation range (about an inch) mimicked the familiar
    gestures used to present a contactless smart card to a reader. Alas, this was
    a win only for Android users, as Apple still not provided API access the NFC capabilities
    on iPhones. As such, this solution does not cover a significant part of the market,
    especially in the United States


    Bluetooth, the second flavor of mobile credit on the market today, is displacing
    NFC due to its universality across smartphone manufacturers, many other wearables
    (such as smart watches). Similar to NFC, a Bluetooth mobile device transmits a
    digital credential to a typically wall-mounted reader, and the access control
    system behind the scenes makes authentication and authorization decisions about
    letting the user through the door. Bluetooth differs in how you measure the range
    of communication in hundreds of feet rather than a few inches. This larger range
    presents pros and cons for how the technology can be used. On the plus side, the
    greater range means users don’t necessarily need to hold the phone to a reader.
    They can just keep it in their pocket, as you would with the newer keyless systems
    on cars. On the other hand, this greater range presents challenges when doors
    are close to each other, as it is difficult for the system to understand which
    one you want to open. Either way, Bluetooth has taken mobile security credentials
    a big step forward and it’s now probably be the predominant type of solution.


    Finally, there are API-based mobile credential solutions. In this model, the smartphone
    talks directly to a cloud-based access control system and the cloud system in
    turn unlocks the door. This method exploits the existing capabilities of cloud-based
    systems to remotely unlock doors via persistent connections to the control panels
    that manage them, a capability for at least a decade for browser-based systems,
    and it’s now being connected to mobile platforms. One of the key benefits of this
    architecture is that it eliminates any need for local wall-mounted readers. It
    is also an ideal candidate for retrofitting existing installations, as it requires
    no new hardware and can be performed remotely via app and credential distribution
    to existing users.


    # INTERACTIVE SECURITY


    Interactive security will be the outgrowth of putting mobile security applications
    in the hands of everyone who uses commercial buildings. If this seems hard to
    imagine, it should be, because it’s happening already. Grassroots'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# CHAPTER 5: Security Ecosystems


    participation in the security process takes place every day as ordinary citizens
    routinely record videos of crimes they witness by sheer happenstance. This phenomenon
    demonstrates a natural willingness to participate and contribute to public safety.
    We can channel this volunteerism with directed interactive apps as a feature of
    mobile security apps. The tools are all there.


    Until recently, what''s been missing is compelling reason for building occupants,
    employees, and residents to download a security-related app onto their smartphones.
    Even the first generation of security apps mobilized administrative tasks, building
    users were left out of the equation. At the time, there was no obvious reason
    to put an app in the hands of anyone beyond the security team or building management.
    Mobile credentials displace traditional access cards and key fobs, there is an
    opportunity for interactive security to become an important part of the mobile
    security ecosystem.


    Interactive security apps for building users have the potential to close the gap
    between security organizations closer to the populations they serve. Security
    is often invisible by design, but there are aspects of it that work in view. In
    a typical commercial setting, security teams must establish the overall security
    program, issue employee badges, manage access cards, staff guards, and oversee
    visitor management. In retail, loss prevention staff concern themselves with all
    manner of shrinkage, and employee threat the top of the list. In large public
    venues, its spectators, loiterers, audience members, and everything in-between.


    Mobile apps for building occupants can also improve the "customer experience"
    of security in a commercial setting. Health clubs and other membership-based organizations,
    for example, have found that embedding the access control function into their
    management system and membership apps reduces the complexity and inconvenience
    of keeping two separate systems synchronized. Property management firms have found
    embedding the security function into their tenant applications turns them into
    an amenity rather than a burden.


    In my experience, applications like these have received high ratings from mobile
    credentials and related apps that serve as a direct substitute for earlier technologies
    that people already know how to use. These new apps provide unarguably superior
    performance, at lower cost, with ROI measured in months rather than years.


    # MIDDLEWARE FOR THE REAL WORLD


    There is a new role for cloud-based security systems that could be thought of
    "middleware for the real world." In general software parlance, middleware'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Middleware for the Real World 55


    refers to software that acts as a bridge between other software systems that need
    additional services in order to work together. Because it is to bind systems together,
    you will often hear it referred to as “software glue.” The intensified interest
    in connecting systems to the physical world is driving increased demand for this
    type of bridge between systems. For all the value API-based middleware has delivered
    so far, mobile has taken it up a notch.


    As previously discussed, the emergence of cloud APIs for security services is
    rapidly making them more relevant to corporate partners outside the industry.
    As turns out, many enterprise applications have workflows that span the virtual
    and the physical, with no easy way to connect the two. Some businesses need a
    physical security layer to connect them to the real world, but they may not have
    the technology to build themselves. What they lack is a connection from their
    purely digital world of bits and bytes to the messy physical world of glass and
    steel.


    Cloud-based security services with web APIs proved to be just the right solution.
    This new mode of data exchange between disparate systems answered a long-standing
    need that found no solution in the precloud era. The new breed of APIs give property
    management software, for example, a way to directly exchange identity information
    with access control systems. This simple connection incorporates the security
    onboarding process into the tenant onboarding process and eliminates an entire
    redundant workflow and source of error. This dynamic link eases across numerous
    scenarios, from corporate HR and parking systems to campus dormitories, visitor
    management, health club membership and coworking spaces.


    In the world before, there were only so manysecurity business functions that benefited
    from deep integration into your security systems. Mobile applications have multiplied
    the number of interesting, labor-saving, value-adding use cases for these kinds
    of hookups between systems that might never before had anything to do with each
    other.


    Tenant attrition in rental properties, for example. It turns out that people are
    far less likely to move out of an apartment complex if they even have a handful
    of strong social connections with others in the same property. This fact has given
    rise to tenant applications, which provide rental payments infrastructure, news
    about the property, and announcements about upcoming social events like happy
    hours. All of these can operate without a connection to the physical infrastructure,
    but once a property manager deploys these apps for their tenants, they begin looking
    for ways to increase usage and convenience. (Remember the toothbrush test?) Adding
    API-based mobile credentials to the community apps is a straightforward way not
    only to increase usage but also to eliminate the problem of access card distribution,
    all in one stroke.'
