- pgno: 217
  md: '# On the Internet, No One Knows You’re a Dog


    Or so goes the caption from the famous New Yorker cartoon depicting two dogs sitting
    in in front of a computer screen in the early days of the Internet. It is far-ical,
    of course, but in a single phrase, it captures the core problem of identity authentication
    in cyber space. Man or beast, you are nothing more than a log-in.


    In physical security, we have wrestled with identity and authentication since
    the very beginning. In person, it is easy to sort dogs from humans, sorting humans
    from each other proves more challenging. Badges, access cards, PIN codes, fingerprint,
    retinal scans, and facial recognition are all tools in our arsenal of authentication.
    Historically, we were physically based, disconnected from networks, and presumably
    immune to hacking, which made many feel that cyber worries could be left to "the
    IT guys."


    That’s no longer possible. Every aspect of electronic security is now mediated
    by what happens in cyber space, which makes online identity and authentication
    a fundamental problem as an industry as well. We could just update the New Yorker
    cartoon to say "on the Internet, no one knows you’re inside their building management
    system."


    In the age of digital documents and physical authentication procedures, it took
    a great deal of ingenuity and skill to create forged identity instruments. I marvel
    at Abagnale’s in Catch Me If You Can, the tale of his exploits as a con man and
    master forgery artist (one of the few movies that is as good, if not better, than
    the book). Not everyone has the nerves and skill to command a 90 ft long to make
    fake checks. Times have changed. As Abagnale points out, today, all you need is
    a laptop and decent printer, and you can make four-color checks in minutes.


    With digital identities, the hurdle is lower than that; you don’t even need the
    printer. What’s more, you can have as many identities as you want—ours or someone
    else’s. You can be one dog or a beast, and no one will know the difference.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Now that physical security is connected, we have irrevocably merged our practice
    with the verification of digital identities. The intersection of these two threads
    means that we now accept digital identities as proof of authority to manage physical
    security systems or gain access to secured facilities. All the problems that digital
    identity have been dropped right into the middle of our physical security systems.


    It''s the dog dragged in.


    # IDENTITY AS A SERVICE


    The plethora of identity systems in our digital economy have fostered the creation
    of many competing identity systems over the last dozen or so years. Digital identity
    services are needed whenever a person wants to get something done—like being authenticated
    to get into a building—based on who they are. Determining that they are who they
    say they are requires an authoritative, trusted source.


    In its simplest form, this would be an identity database that keeps lists of people
    and their privileges. Inside the theory, these organizations or services are known
    as identity providers or IdPs. Your local DMV, for example, is an IdP of the old-fashioned
    sort. In general, IdPs can be any organization or software system that provides
    a specific set of services for identity transactions. Specifically, they are a
    service provider that manages identity information for a community of users, provides
    authentication services on demand, and does so across a group of establishments
    that recognize and trust their authority.


    When IdPs are part of B2B transactions, for example, they usually fall under corporate
    auspices. In these cases, my identity is identity as an employee. My use of this
    identity is limited to the roles I assume as part of my job. By definition, I
    will not use this same identity to transact any personal business. For reason,
    I will not be concerned with privacy issues around this identity (although my
    employer may) none of my personal attributes are associated with this identity.
    The attributes are those of employee #1234. It''s not me.


    However, when a private individual I use an identity for my own personal business,
    the whole picture changes. I am suddenly concerned with privacy and the use of
    any personal data associated with my identity. I don''t want companies (or criminals)
    to use this information in ways I have not approved.


    In many respects, these identity systems are a big improvement over existing large-scale
    public identity schemes, and they are certainly an improvement over having nothing
    at all. From a practical point of view, using them requires more intellectual
    investment than the average layperson cares to make.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'It is also a barrier to trust for any thing of digital ID, because you can''t
    trust what you don''t understand. Finally, complexity also introduces vulnerability
    because the management challenges. That''s one of the reasons most of us still
    middle along with passwords; anything more is a bridge too far.


    # WHAT IS AN IDENTITY STANDARD?


    There are standards for nearly everything on the Internet, and identity is no
    exception. That''s a good thing, because without standards the web would not have
    evolve to what it is today. Everyone who uses a browser has become familiar with
    least a few standards like HTTP and SSL and possibly HTML. These are surface layer
    standards that pushed their way into everyday banter in web-speak. But there are
    many more standards beneath the surface—tens of thousands—that keep the whole
    Internet glued.


    Identity sits in the category of those hidden from sight but doing their job every
    time you log anything. Some deal with the technical mechanics of identity validation,
    but many are more abstract. Like all standards, their purpose is to make things
    together that wouldn''t otherwise. It all goes back to answering the question
    "who are you?” in a ways other understand, whether they are a person, a computer,
    or a building.


    Two dogs can both wear collars that say "Spike," but that does not mean they are
    the same dog. That situation is possible because there are no standards for how
    dogs are named or how collars are monogrammed, and no rules against two of them
    being the same. That is the absence of standards. It''s really inconvenient anyone
    going in the way of anything, at least not until one of the Spikes gets lost and
    needs to be reunited with its owner.


    Fortunately, for Spike, the RFID chips implanted in most dogs provide standardization
    for canine identity. By agreement among chip manufacturers, breeders, veterinarians,
    and owners, canine chips are unique and centrally registered so that anyone can
    look up if a dog is unfortunate enough to lose or stolen. That is a standard in
    action.


    RFID chips are a simple example because they do only one thing: emit a number
    upon request. Most identity standards are far more complex.


    # AUTHENTICATION VS AUTHORIZATION


    There is no way to talk about identity and its role getting into the weeds a bit
    on the two core principles of identity management: authentication and authorization.
    I''ve been using both of these through this section and'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# CHAPTER 18: On the Internet, No One Knows You''re a Dog


    elsewhere in the book without making a fuss exactly what we know. My bet is that
    you have glossed right over them and, unless you are a specialist in the field,
    read them as being pretty much the same thing. It''s unfortunate that they sound
    so much alike because it leads to an imprecise usage that confuses many discussions.


    Authentication is the process of establishing that you are who you say you are.
    In the real world, if you get pulled over for a traffic violation, the police
    officer will ask to see your driver''s license, compare the picture on the license
    with your actual face, and decide if that''s really you. That''s authentication.


    In an online setting, presenting a log-in and password is the oldest and simplest
    way of authenticating the person claiming to be bob@aol.com. In physical access,
    presenting an access card to a reader is a form of authentication—not a very good
    one, because anyone finds your card can pretend to be you.


    Authorization, on the other hand, answers the question of what we know who are
    you say you are, what are you allowed to do? In the driver''s license example,
    you may be authorized to drive a private vehicle, a commercial vehicle, or a motorcycle.
    These are three different types of authorization. After logging into a computer
    system, you may be authorized to see your own files but not those of anyone else.
    Upon entering a building, you may be authorized to enter the lobby and elevator
    but not any private offices.


    Identity management, log-ins, and identity standards address authentication and
    authorization. Some cover both topics, and others are aimed at solving just one
    part of the puzzle.


    # AUTHENTICATION STANDARDS


    On the face of it, authentication sounds like an online or cyber problem, not
    a physical security problem. But it''s our problem too because it''s not the way
    we identify people in more and more transactions.


    Digital authentication standards are intended to enable simpler and more log-ins
    to online accounts. Simplicity brings with it greater clarity; the need for security
    without saying. Most authentication standards are intentionally narrow set of
    use cases so they are easy to implement and easy for users to understand. Complexity
    is a big barrier to user adoption. Unlike some other types of standards we will
    look at, they do not attempt to ensure you are who you say you are in real life.
    They are just trying to make sure that no one but you—or to whoever you gave your
    credentials—can log into one of your online accounts. This alone is an important
    objective and harder than it looks.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Authentication Standards 201


    All of the management functions of a modern security or building automation system
    are now controlled by software. Whoever can gain access to the software can gain
    access to the building and manipulate the security infrastructure. Preventing
    this from happening requires that these systems use the best authentication standards
    we can practically use.


    When you think about it, the electronic security systems for buildings are just
    computer systems with different peripherals than the ones we use on desktops.
    Input of printers and scanners, they have card readers, door sensors, and electric
    strikes. Beyond all of that, they''re just computer systems. Gaining access to
    a building is no different than logging into a computer or online service. Enabling
    better authentication standards at the point of entry is as important as it is
    for any other computer system.


    There are many methods for authenticating people to computer systems, starting
    with the oldest and simplest, log-in and password. This model has been strained
    to the breaking point because of the sheer number of log-ins and passwords that
    most people must now manage. Recent surveys put this number somewhere in the 20s
    to 30s (I wish), and for many, it is far more. Newer authentication schemes from
    organizations like the FIDO Alliance and the Kant Initiative aim to replace this
    model with methods that are both scalable and trustworthy.


    What models does not address the problem of device authentication for things that
    need to be on the network but have real user interface of their own. This is generally
    known as end-authentication. When something is plugged into a local network or
    attached to a Wi-Fi hotspot, how do other devices on the network know whether
    to trust it or not? Nearly all of the IoT standards we covered earlier attempt
    to deal with this issue.


    Unfortunately, most control systems purchased today still use proximity cards
    as the primary form of authenticating people. This is known as "one-factor authentication"
    based on an object in your possession. The truth is it''s not really authentication
    at all. Not only are they insecure, but also they can be lost or stolen by an
    unauthorized person as if they were a physical key. System administrators must
    be aware of the loss and delete that card from the system in order to maintain
    security.


    At this point, I have to confess that I am part of the problem. My company sells
    good old-fashioned proximity cards in far greater quantities than the more smart
    cards that have been available for years. Why do we do this, you ask? Because
    our customers continue to order them out of habit and familiarity, even though
    they know they are less secure. This may be a problem that never gets solved in
    the domain of plastic cards and fobs. Business as usual just prove too strong
    a habit to break. It''s not all bleak. I believe that mobile'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'credentials on smartphones will do what smartcards could not, finally wean
    us off of 40-year-old technology. But it won''t be because it''s more secure,
    even though it is.


    It will be because it''s more convenient.'
  merge: -1
