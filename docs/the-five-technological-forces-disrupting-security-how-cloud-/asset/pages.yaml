    # SERVICE MODELS: APPLICATIONS VS INFRASTRUCTURE


    The concept of service models distinguishes the two most important categories
    for security buyers, whether as innovators incorporating a solution for their
    customers or as security organizations evaluating options for their next-generation
    architecture. The two major service models for these purposes are software as
    a service (SaaS) and infrastructure as a service (IaaS).


    Unless you develop your own applications and make a business of operating, when
    most people think of SaaS, they think "cloud". In SaaS, the consumer shares applications
    running on cloud infrastructure. The user never deals directly with the cloud
    infrastructure itself, which is the main appeal of this model.


    In the case of a system integrator, being a SaaS consumer means using a third-party
    cloud-based video or access control solution, for example, and delivering SaaS
    service to your customers along with on-premise equipment installation (e.g.,
    locks and cameras), scheduled and every maintenance, consulting, help support,
    and all the other services offered by security integrators and developers. In
    neither does the integrator represent their customer as having written the software,
    created the hardware, or operating the SaaS service. Theyve specified what they
    believe is a best-of-breed solution for their customer and embedded it into an
    overall service package.


    For a security organization, SaaS services are presented as complete applications
    that are ready to use, with no IT assistance, configuration, or setup required.
    They work, same as an e-commerce site, online banking. Internet dating, or any
    other online service: SaaS, by any other name.


    IaaS is an entirely different offering. It''s raw computing and storage capability
    that developers and IT administrators turn into a useful application service.
    Think of it as a data center that''s dressed up with nowhere to go. It can''t
    do anything unless applications are added to it. In that respect, IaaS is a foundational
    layer underneath SaaS. Because of the efficiencies it offers, SaaS'
