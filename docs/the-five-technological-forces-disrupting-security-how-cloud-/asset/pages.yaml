    # BIG SECURITY DATA AND ROI


    There are two fundamental criteria that face every big data project, and they
    will look familiar to anyone who has tried to justify an IT project or any corporate
    spending initiative. The first is whether your data sources will support the objectives
    of your project. You will need to have the right kind of data, enough of it, and
    be able to trust it. If the data are not, you''re wasting your time because the
    oldest adage in computer science still holds—garbage in out. Given the right data
    and the right analytics, what is the ROI you expect? What outcome would you need
    in order to make the investment worthwhile? In the world of security, this question
    can be answered in two very different ways.


    In the first case—a purely financial ROI analysis—we can use a retail example.
    The scenario might be something like this: if Bob and Alice''s Key Store invests
    $1 million in a big data project, they will realize that in reduced shrinkage
    (and how soon will they realize these savings?) Let''s say, for the sake of argument,
    that their big data project can reduce shrinkage by 2% per year they lose $5 million
    worth of product every year. This means that they would save $100,000 per year,
    and it would take 10 years to recover their investment. It''s not clear that this
    would be a great investment for them or they might find more economic means of
    accomplishing their objective. However, if their data science project could save
    them 10% per year then it would only take 2 years to recover their investment,
    and they would come out every year after that. Clearly worth it.


    In the second case—a life safety ROI analysis—we are confronted immediately how
    to place a value on human life. If a million big data project could save one life
    per year, is it worth the investment? What if it''s only one life every 3 years?
    Every 10? What about the other spending priorities? Security organizations make
    these difficult choices about resources and outcomes every day. Big data won''t
    eliminate these difficult choices, but it may provide us with better insights
    on probabilities and risk factors so that we are optimally allocating our resources.'
