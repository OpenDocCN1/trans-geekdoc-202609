  md: '# CHAPTER 15: Data-Driven Security


    analysis performed on these data sets could not benefit from patterns or norms
    discovered in much larger data sets spanning thousands or millions of locations.


    In the first section of this book, we explained how the pooling of resources allow
    cloud service providers to increase efficiency and reduce customer costs by spreading
    them over large sets of users. This approach not only only to the fundamental
    service but also to add-ons—that might be layered on top of the core security
    subscription. In this model, a customer might see a charge of $100 a month for
    analytic services, rather than an upfront expense of $100,000 plus annual software
    maintenance of 15% or more of the purchase price.


    Lowering the costs of analytics is relatively easy. Centralizing data will be
    a bigger challenge. This issue is fundamental to the development of a big data
    capability in security products. To get, today''s data puddles will have to coalesce
    into a lake or an ocean where there are enough data to drive the analytics market
    we see in other industries.


    SaaS systems for physical security are therefore far more likely than their on-premise
    forebears to be the first place that advanced analytics will appear in the industry.
    This means that we can have large data sets for training machine intelligence
    algorithms and that cost can spread out over a larger set of users. What''s more,
    the industry can begin to move to large-scale pattern recognition and machine
    learning.


    # DATA PRIORITIES


    In security, we have many sources of data, but it may not be the right data for
    a big data project. The types of data you might need and the types of data you
    can afford to collect vary greatly based on the overall policy view of the security
    mission, which in turn will establish priorities for physical security, cyber
    security, IT budgets, and corporate risk tolerance.


    This will involve questions like the following:


    +   * What data sources will be used, and how are they created?

    * What is the quality and statistical validity of the data?

    * How will the data be classified?

    * Is this a machine-learning problem? An AI problem?

    * Are we trying to create a predictive model or just understand the?

    * How will the resulting predictive model be validated?

    * What are the consequences if my model is wrong?

    * Will the model operate on real-time data?'
