- pgno: 142
  md: '# CHAPTER 10: IoT Technology and Standards


    The benefits are common tools can be used across these similar frameworks, with
    technical standards ensuring that similar protocols, identity, authentication,
    and cyber defense mechanisms are in place.


    The Industrial Internet of Things Connectivity Framework is a deeper document
    focused on the communication stacks to be used in building IoT systems. The goal
    of common communication mechanisms is to promote the sharing of data across different
    IoT systems—a clear benefit to electronic systems that could benefit from correlating
    their own data with additional inputs from other industrial systems.


    # Open Connectivity Foundation (OCF)


    The OCF is relevant to the security industry largely because of its size and prominent
    corporate membership, which gives it a better-than-even chance of shaping for
    a significant class of both residential and commercial devices. It was formed
    by the 2016 merger of the former Open Internet Consortium (OIC) and the AllSeen
    Alliance. The groups include companies such as HP, IBM, Cisco, Intel, Microsoft,
    Samsung, Qualcomm, GE Digital, and many other familiar electronics powerhouses.
    On the manufacturing side of the equations, this group is likely critical mass
    of IoT component and product makers. Of equal interest is not the prominent service
    and telecommunication providers who have joined forces with the OCF.


    Intel formed the original OIC with the goal of connecting what it refers to the
    next 25 billion IoT devices. Its technical goal is to provide secure and reliable
    device discovery and connectivity across multiple OSs and platforms. OIC aims
    to deliver this by providing a comprehensive communication framework to enable
    emerging applications in all key vertical markets. Their IoT open-source project
    is a framework that provides tools to developers to realize this vision.


    # Institute of Electrical and Electronics Engineers (IEEE)


    The venerable IEEE has made an all-out effort to demonstrate its relevance to
    the IoT world and not lose out to newer standards organizations that could eclipse
    its central role in much of the standards initiatives that have taken place in
    the electronics industry over the last 50 years. To that end, the IEEE has launched
    a project titled “Standard for an Architectural Framework for the Internet of
    Things.” If this sounds like it is competing with the activities of several other
    organizations we''ve examined, it is. We are still in a period where multiple
    organizations are attempting to solve the same set of problems. With hundreds
    of thousands of degree engineers as individuals members,


    > http://www.iiconsortium.org/IICF.htm.'
