- pgno: 117
  md: '# All Security Is Now Cybersecurity


    The 2015 annual ASIS security conference in Anaheim was graced by southern California''s
    usual endless sunshine and the radiance of nearby Disneyland. Wandering the conference
    grounds, knowing that Mickey and Goofy were just down the street, I found it difficult
    to feel the weight of the world''s security problems that day.


    Inside the conference halls, however, a much darker mood prevailed. The topic
    that dominated nearly every conversation was the cybersecurity of electronic devices
    and indeed the entire realm of IoT. The publicized July 2015 hacking of a Jeep
    Grand Cherokee—while driving down the road, no less—was fresh in everyone''s mind.
    The hack was conducted under controlled circumstances and performed as something
    of a stunt, but its relevance could not be ignored. It was a clear case of a cyber
    attack causing physical damage. The occupants of the vehicle were at risk, of
    but so was anything and anyone in its path. The ability to remotely pilot suicide
    vehicles was chilling. The event made it too clear that physical security will
    become impossible unless we figure out how to defend against cyber attacks.


    Cyber attacks against connected devices can have much larger physical targets.
    At roughly the same time as the news of the Jeep surfaced, the German man reported
    a steel mill had been subjected to massive damage by a cyber attack that disabled
    control systems on a blast furnace and caused a melt-enrichment centrifuges for
    uranium, this industrial threat that took a path out of us encounter on a daily
    basis, every we open our e-mail. The attackers infiltrated the corporate network
    of the steel mill via email phishing attacks on employees, triggering them into
    actions that ultimately gave the attackers access to compromised systems. What''s
    more worrisome about this is that the attackers managed to jump from a corporate
    network to a plant production network. one of the most fundamental principles
    of secure network design: separating'
