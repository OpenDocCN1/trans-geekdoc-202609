    This is not new, of course, but the tools will be better. The second will be composed
    of other devices—call alien sensors—that have a primary mission other than security
    whose exhaust creates valuable input for analytics. Corporate departments outside
    the security organization will be sponsors of these nonempty deployments, just
    as non-IT departments were the sponsors of rogue cloud services in the early days
