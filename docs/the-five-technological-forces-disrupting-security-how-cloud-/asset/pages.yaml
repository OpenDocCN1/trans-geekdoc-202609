    of asking large tenant populations to go through this rigmarole in order to start
    using—wait for it—an application that''s proposed to "make your security better."


    A major consideration, cybersecurity. With the local server you''ve never exposed
    to the Internet, you have a 24-hour-day, 7-day-a-week hotspot inside your network,
    attracting cyber attacks while trying to provide security services to your employees,
    customers, tenants, and visitors. Does that sound like an ideal situation to you?
    Defending against millions of attacks against any visible IP address is best left
    to professionals who web services for their primary business, not as an afterthought.


    Cloud services, by contrast, are behind every well-known mobile application you''ve
    heard of. Unlike local applications, they are all delivered from a single well-known
    URL for mobile APIs. This means that individual applications do not need to be
    configured for a unique web address more than your Facebook or banking apps require
    you to type in a long web address and port number to get them working. It''s just
    like click, the way it should be. Because a third-party service provider delivers
    these mobile cloud services, you do not have to ask your IT department to do a
    thing; no hole in the firewall, no special SSL or TLS certificate, and no assignment
    of a routable IP address or port, nothing. This does not only vastly simplify
    establishment, but also decouples your mobile solution from the internal changes
    to your corporate network. Instead, your application service provider is responsible
    for continuity of service, along with cyber defense, which brings us to the final
    advantage of a cloud-based solution for mobile.


    Defending against attacks is your application partner''s bread and butter. Its
    what they do, and they are probably going to be much better at doing it full time
    with specialized employees than your company will. You probably don''t have a
    full-time cybersecurity expert, let alone a whole team.


    # Mobile Administration as a Workforce Multiplier


    Your strategy for mobile should include applications that will act as a workforce
    multiplier. In large companies, we to pay guards to sit at a desk in order to
    monitor information only available on a stationary computer or video monitor.
    Mobile apps liberate employee to be doing more than one thing at a time. They
    can be away from their post but still connected to the nerve'
