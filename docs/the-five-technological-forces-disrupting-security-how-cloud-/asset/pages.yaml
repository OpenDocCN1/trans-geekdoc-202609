- pgno: 211
  md: '# Social Saves Lives


    “Could Facebook save your life?”


    That on the cover of the December 2016 issue of Wired.¹ The related story details
    the operation of safety check, one of the social media giant''s newest features,
    which provides a means for users in the vicinity of a “major crisis” to let friends
    know they are okay. The feature works by detecting the emergence of a crisis and
    setting up dedicated resources—pages, hashtags, and notifications—relevant to
    situational awareness and management.


    This capability is a monumental improvement in our ability to communicate across
    disaster scenarios in real time. Anyone who wants to plug into the stream of information
    can do so from an app they have on their phone and already know how to use—two
    of the primary ingredients for getting people to use any web service. It also
    frees phone circuits for the first responders and others who need most.


    At a sociological level, it changes the dynamic of mass notification and crisis
    response from a top-down governmental announcement to a crowd-sourced information
    sharing exercise. This is not to say there is no longer a governmental role. Some
    arise from afar and cannot be easily known by people who are on the ground somewhere.
    Thinking of weather events and acts of many, which can be forgotten to some degree.


    Most of us deal with crises at a much smaller scale than that of hurricanes or
    mass uprisings. Muster is a classic example of the need to determine the safety
    status of an entire group of people. How much easier would this be if everyone
    just used Facebook? Using of familiar application that almost everyone uses would
    reduce the training burden, reduce the IT infrastructure and maintenance expense
    to zero, and do so on a much more effective platform that also allows real-time
    video feeds, the posting of photographs, and many other capabilities not found
    in clunky legacy solutions.


    > ¹https://www.wired.com/2016/11/facebook-disaster-response/.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# VIRTUAL SOCIAL MEDIA WORKING GROUP


    Facebook was not the first to uncover the life safety potential of social networks.
    Perhaps it was obvious right from the start for those who work with the public
    for emergency response, disaster relief, and the unfortunately growing incidence
    of security issues involving intentional mass violence against an unarmed public.


    In 2010, the US Department of Homeland Security’s (DHS) Science and Technology
    Directorate took a giant leap forward into the digital age and enhanced the virtual
    social media working group (VSMWG). According to their web page, their mission
    is to provide recommendations in the use of social media technologies before,
    during, and after emergencies, of which the DHS has certainly managed its share.


    One major accomplishment of this working group was the June 2014 DHS publication
    titled "Using Social Media for Enhanced Situational Awareness and Decision Support."
    The white paper identifies three major capabilities social media can provide to
    enhance during an emergency:


    +   1. Communications

    2. Situational awareness

    3. Analysis


    If this list looks like the fundamentals of risk management, that’s no coincidence.
    The authors—first responder organizations from across the state, local, and federal
    landscape—are all trained in that discipline. What''s interesting is that social
    media tools created for entirely different purposes neatly match the needs of
    these organizations during crisis.


    # THE UNITED NATIONS


    In the same year as the DHS report, the United Nations Office for the Coordination
    of Humanitarian Affairs (OCHA) published a white paper titled "Hashtag Standards
    for Emergencies." At first, this sounds like an old just justification of the
    ephemeral world of tweets and posts after the world of major catastrophes. The
    paper convincingly demonstrates, that a medium that is able to communicate so
    quickly with so many would be a natural vehicle for security and emergency coordination.


    The report opens by citing the fact that the public already use social media in
    general and Twitter in particular to communicate about disaster and emergency


    > *https://www.dhs.gov/publication/using-social-media-enhanced-situational-awareness-decision-support.

    *https://docs.unocha.org/sites/dms/Documents/TB%20012_Hashtag%20Standards.pdf.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'communications. In other words, this is already their digital neighborhood
    and a preferred means of sharing information. What the study sets out to accomplish
    is harness the power of the crowd and better channel it by teaching people to
    standardize types of hashtags. Doing so would greatly simplify the big data problem
    of gathering all relevant posts into a single coherent stream of information.
    Think of it as a digital 911 service, which is in fact the basis of one of the
    obviously recommended tags, #911.


    Earlier, we discussed the summarization of security and IT as they applied to
    physical tools like computers, smartphones, tablets, and even smart watches. Consumerization
    applies equally well to services, networks, and cloud resources. Using tablets
    became life as personal conveniences and quickly became professional workhorses,
    so too the social networks created for personal connection become conduite of
    business and security communications. The use of social media will begin to perv
    security and emergency coordination in the same way consumerization has made physical
    consumer products into the everyday days of IT and security organizations.


    The line between personal and professional has become thin to nonexistent—and
    this is a good thing for security professionals and public safety.


    # SOCIAL MEDIA FOR EMERGENCY MANAGEMENT (#SMEM)


    Official public agencies like DHS and the UN are not the only groups catching
    the social wave. Unrelated groups involved in one way or another with security
    and have spontaneously adopted social media as a way to communicate among them.
    #SMEM, or social media for emergency management, is a hashtag shared unoially
    by security and first-responder organizations as both a real-time communications
    tool and a sort of professional network for exchanging practices. Education used
    to be available only in a formal educational setting has now become available
    to anyone with a Twitter account. Given that training and turnover are two of
    the perennial concerns of the security profession, this is a welcome learning
    forum for all of our colleagues.


    # POWER SHIFT


    No one can foresee what new technologies will be used for once they have set loose
    in the world. They have an uncanny way of shape shifting as they are created for
    one thing but find utility for many others. The Internet, for example, was originally
    created by and for researchers to exchange scientific information.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 194 CHAPTER 17: Social Saves Lives


    When it proved to be the best commerce platform mankind ever invented, many of
    the original users lamented its devolution into commercialism. That same commercialization
    and the ad revenue behind it, however, made-cost free social networks accessible
    to all.


    Sometimes it goes the other direction. A technology for identifying coeds at Harvard
    evolves to support many missions around the world. It even excites them better
    than existing approaches, despite that these new use cases were never part of
    what it was built to. As Mark Zuckerberg puts it, sometimes “we don’t realize
    how useful things are going to be.\^4


    We know that social media networks have created entirely new types of communications
    modalities, but they have also proved better at many older types of communication
    than anything preceded them. It is the intersection at which we now see companies
    like Facebook providing personal check in features that easily outdo the clunky
    forbears invented in security software. Given that the social networks control
    how these new system work, they are in a position to find exactly what the best
    security features are, who and how they can be improved. They are able to do research
    at an unprecedented scale, receiving real-time input from millions of users, all
    at once. But this is about more than being in the driver’s seat for product management.
    It’s about who controls the information and how it can be used.


    New technologies have always changed the power dynamic among existing providers.
    That’s the nature of the disruption. This will be jarring for the industry, which
    tends to operate on a fairly insular basis, but it will not be to do so forever.
    Just as the new breed of IoT devices is creating connected devices and networks
    displacing categories of security equipment and services, so will social networks
    change the dynamics of mass notification, monitoring, and emergency response.


    At a much higher level, social networks now offer resilient, multipath routing
    by instantly sharing information with all the subscribers of a particular feed.
    Contrast with the callous process that has been standard operating procedure for
    most emergency escalation scenarios. A call center operator dials one person after
    another over a voice line until they find someone who is available to take responsibility.
    If we were holding a race around the world on this old callous process and social
    networks, the news would be half-way around the world on social media before the
    call center operator had even dialed the third digit.


    > ^https://www.wired.com/2016/11/facebook-disaster-response/'
