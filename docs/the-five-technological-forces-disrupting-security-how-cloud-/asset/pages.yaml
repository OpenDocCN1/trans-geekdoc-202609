- pgno: 123
  md: '# The Update Treadmill


    Next come security integrators. Unfortunately, many aren''t in a good position
    to manage the cyber updates of connected devices. First, it''s not usually written
    into maintenance agreements, and it certainly can''t be done for. Second, even
    if it were, many integrators do not have enough cyber expertise on their staff.
    Their technicians are trained to perform installations, not keep track of the
    latest threats to equipment from dozens or hundreds of manufacturers. Third, it
    would not be cost-effective for them to apply software and configuration patches
    across hundreds of individual customer sites. There''d have to be some centralized
    to do it.


    What about manufacturers? Many vaguely believe that manufacturers really ought
    to be proving these updates. The ideal is appealing in theory but falls apart
    logically because manufacturers don''t typically know where their devices are
    installed and they cannot reach into a network to make changes to them—unless
    they are already cloud-connected devices in the first place. Manufacturers can
    provide automated updates, but many customers won''t want them because they have
    seen updates fail. The best we can do is to provide tools and choices and hope
    customers and integrators use them.


    # THE UPDATE TREADMILL


    So, let''s imagine that in some perfect future, we''ve overcome the knowledge
    and governance gaps that get in the way of keeping our connected devices up to
    date. You may also feel free to imagine that you''ve won the lottery. It''s about
    likely.


    IoT devices in physical security applications likely share the same network with
    numerous other IoT devices deployed for different purposes. This is always the
    case in home and small businesses, where it is prohibitive to set up a secondary
    network for physical security devices. This means that the new normal for security
    equipment will be network coexistence with an unknown number of random devices
    from mystery manufacturers.


    Writing in the a16z blog, Benedict Evans makes an insightful comparison between
    this aspect of IoT proliferation and the earlier rise of electric motors. Our
    grandparents knew how many electric motors owned because they were newfangled
    curiosities and few in number. We used to be in this position with respect to
    connected devices in our homes, but it''s quickly escaping our grasp and will
    beyond the reach of our children. At that point, we will have forgotten them and
    any need they may have for cyber attention.


    > http://a16z.com/2015/12/18/16-mobile-theses.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# CHAPTER 9: All Security Is Now Cybersecurity


    The fly in the ointment for IoT is that the sheer number of devices in need of
    software updates will become unmanageable—at least with current software updates.
    Many of us would say that we''re already at that point. The reality- is that it''s
    difficult to make it through an entire week, if not a day, without an update request
    from one or more phones, laptops, tablets, televisions, watches, microwaves, refrigerators,
    thermostats, or other household gadgets. To say nothing of the mobile apps that
    control them, all of which seem to be nearly monthly release cycles that we use
    on the IoT treadmill.


    That''s without us ever leaving our home. Once we''re in a professional work setting—from
    the factory floor to a high-rise office building—we''re surrounded by an even
    larger number of firmware-laden objects that demand a decision on whether we should
    update them or not. Anyone who has lived through automatic updates knows that
    there are frequently undesirable effects.


    A frequent response to being on this treadmill is to ignore updates altogether.
    And why not? If the thing you bought did you wanted it on the day you bought it,
    can''t you leave it that way? In the preconnected era, the answer to might have
    been yes. But that''s no longer true: a vast number of software patches fix serious
    security holes. A security flaw in a single IoT device could be the crack through
    which hackers enter your home or business network. From there, they can compromise
    other devices.


    The only conclusion is that everything needs to be automatic (or at least coordinated)
    update schedules. The problem is simply thousands of IoT devices becoming ubiquitous
    and invisible, security integrators may not know where or how they are in any
    network setting. Fortunately, there are products and standards emerging within
    some domains that aim to make these updates efficient at the device level and
    manageable at the manufacturing or enterprise level.


    For any given security organization or integrator, however, it will be a long
    time before they see adoption or uniformity across the suite of products that
    may be using for common security isolation. Aside the logistics of managing software
    updates, security providers also have a well-established need to check new firmware
    releases for behavioral changes and security flaws before they are deployed. This
    is already common practice for every device installed in critical networks in
    financial institutions and other high-risk/high-value computing environments.
    It should also be common practice in any industrial setting where compromise of
    industrial controls could pose harm to human life or large economic losses.


    Updating software on an IoT device inside a targeted network is actually the perfect
    attack vector for a malicious actor who wants to compromise a location or an entire
    enterprise. Think about it. If it''s possible to place new software on a'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'trusted computing device that is already inside a corporate network, the attacker
    has already breached the first line of perimeter defense—the firewall. From here,
    the trusted device with the (now) malicious software is in a much stronger position
    to explore the network and compromise some device and information systems.


    While not high profile as cybersecurity risks, technical and behavioral changes
    from new software releases are equally problematic on a purely functional basis.
    Security integrators are accustomed to seeing the integration between systems
    broken when one of the vendors releases new software. For example, information
    exchange between a video management system and an access control platform may
    stop working when one is updated. Vendors have legitimate reasons for changing
    the APIs or SDKs that create these integrations possible, but the lack of coordination
    among manufacturers creates numerous disruptions for users of previously deployed
    systems. As the number of connected devices and integrations goes up, these problems
    become more frequent.


    The success of IoT in physical security depends in part on establishing an effective
    software update to these systems. For the software companies and manufacturers
    who create these systems, there are deeper issues around coding practices, cryptography,
    penetration testing, zero-day vulnerabilities, and more subjects than I can possibly
    list.


    # A PATH FORWARD


    I could list the points of vulnerabilities in our current ecosystem and run around
    crying the sky is falling. This type of alarmism is a staple of most panel discussions
    at industry conferences. What is far more difficult to suggest a course of action
    that moves the discussion forward and gives security organizations some practical
    guidelines that they can use. To end, I have three proposals that I hope move
    the dialogue forward.


    First, we need to agree on some minimum standards for device security. There are
    many models and existing reference works to choose from, so we don''t need to
    start from scratch. A great example of how this can work is what the payments
    industry did with PCI compliance. Standards could be tailored for the unique risks
    posed by cameras, controllers, readers, and other common security devices.


    Second, voluntary testing is a way for companies to distinguish themselves and
    show customers that they care enough about cybersecurity to have their products
    certified. Mandatory testing would face huge resistance, but voluntary'
  merge: -1
