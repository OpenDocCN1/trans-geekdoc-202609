  md: 'The experience taught me how valuable data could be when run through the right
    algorithms and presented in the right. It was like panning for gold from a mountain
    of dirt. That’s why monetization is often a secondary business plan of any company
    handling large quantities of data. Value lurks in unlikely places, it always pays
    to seek it out. This seems especially true for logistics and security. Given the
    financial stakes in both markets, it seemed likely that the information tailings
    from their data systems would still be high-quality ore.


    Fifteen years later, with big data redefining the intelligence that can be extracted
    from large volumes of physical security events, the industry is beginning to take
    note. Security event data have real value. Unfortunately, most of these data cannot
    be mined because it is strewn across the landscape in little piles they are on-site
    legacy computing systems. Big data only works if all of them are in one (logical)
    place. This matters the premise of assembling big data collections that is whole
    greater than the sum of its parts.


    So far, we have more parts than wholes.


    On the surface, this is surprising because big data has made huge inroads in fields
    from medicine and physics to retain behavior and stock market analysis. Yet, it
    remains largely absent from physical security systems. The slow pace of adopting
    the cloud—the platform on which big data finds their natural home—has hampered
    the formation of large data sets at the scale where big data security kicks in.
    In this has turned the birth of a big data market segment in physical security.
    Instead of using the cloud as a natural data aggregator, security architects have
    left in their an archipelago of unconnected systems. Each store their data separately
    from all the others. As long as data live on islands, there can be no large-scale
    analysis or collective intelligence.


    Managed services in the network security market provide an instructive counterpart
    to this state of affairs. The best practice in managed cyber services is to collect
    data across the entire Internet for threat patterns and anomalies. Managed service
    providers bring to each client the intelligence derived from empirical data collected
    from millions of monitoring points across the web. This operating model—comprehensive
    data collection and syndicated analysis—could be carried over to physical security
    practice. It holds out the promise of improving information quality across all
    scales of facility and enterprise, from the small neighborhood business to the
    geographically distributed multinationals.


    # SOCIAL SPACES


