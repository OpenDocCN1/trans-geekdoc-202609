- pgno: 118
  md: '# CHAPTER 9: All Security Is Now Cybersecurity


    unrelated business and security functions so that a compromise of one does not
    compromise the other.


    Since then, we have seen a bigger and scarier real-world hack that hits much closer
    to home for the entire physical security industry. Ground zero, you could say.


    The incident in question is the 21 October 2016, distributed denial-of-service
    (DDoS) attack that created a botnet army of 140,000 surveillance cameras deployed
    in businesses around the United States. Under the control of the malware known
    as Mirai, this army of cameras was directed to conduct a massive attack on major
    swaths of the Internet. The crush of traffic from these infected cameras hobbled
    every day, from ordinary users to big-name Internet companies like Twitter, Tumblr,
    and even the likes of Amazon and Netflix. Delays stretched out, websites became
    unreachable, and conducting business became impossible for hours on. It all took
    a single strain of malware and a large population of poorly protected IP cameras
    to bring a significant chunk of the Internet to its knees. There is no clearer
    example of security devices being turned into security liabilities.


    Billions of IoT devices—security-related and otherwise—will be added to our environment
    over the coming years. Many of these will be deployed on networks shared with
    the security fabric of our facilities, our infrastructure, and—literally—our way
    of life. While they will no doubt make many positive contributions to our lives,
    they will also open numerous attack surfaces for cybercrime, identity theft, invasions
    of privacy, and ever terrorism.


    These threats rising out of the nexus between the physical and digital worlds
    have been dubbed denial of safety attacks. They are expected to become more commonplace
    as facilities are outfitted with IoT devices for both security and building automation.
    Many, in the technology community openly wonder whether this Pandora’s box of
    cyber trouble can be closed. At the very least, we need standards to contain the
    morass of special cases and one-off device profiles that are so burdensome and
    vulnerable today.


    The cyber risks presented by this new generation of connected devices have the
    potential to determine the core mission of security organizations if not properly
    managed. These circumstances have given rise to the point of view that all security
    is now cybersecurity.


    # LIFE IMITATING ART


    All three of these cyber attacks vividly illustrate that we are capable of securing
    connected devices in order to take advantage of the benefits of IoT.'
