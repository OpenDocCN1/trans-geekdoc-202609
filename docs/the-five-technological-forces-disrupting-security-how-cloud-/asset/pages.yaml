    standards become more widely implemented across mobile platforms.


    Minor administrative tasks such as configuring notifications, setting up schedules,
    and managing holidays; duration of video storage; event retention policies; hundreds
    of infrequent tasks have yet to cross the chasm from desktop to smartphone.


    But they will.


    # APPS HAVE A FIELD DAY


    Physical security doesn''t work without trained field technicians. They do the
    "truck rolls" to install cameras, door controllers, switches, locks, sensors,
    wiring, and myriad components. The installation procedures follow they the usability
    and effectiveness of systems in every day it does not. It is challenging, as the
    slow acceptance of DIY security systems proves.


    The economics of the installation business depend heavily on minimizing the amount
    of labor required per job. Technicians are a part of the labor required to put
    in place and get it working. This fact makes their efficiency important to both
    the companies they work for and for their customers alike. Inefficiency shows
    as lower profit margins for system integrators or as higher costs for security
    organizations. You can''t do the math any other way.


    The first generation of mobile apps addressed some of these economic challenges
    through business process improvement. Workflow apps streamlined many tedious daily
    operations and reduced errors across the entire process,'
