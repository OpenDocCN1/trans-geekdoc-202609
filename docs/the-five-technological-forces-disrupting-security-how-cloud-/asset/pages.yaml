    +   1. New products from new players

    2. Cheaper and better products from everyone

    3. Immense device and cyber security management challenges


    # WHAT IS IoT, ANYWAY?


    Ever confused by the term “IoT”?


    You have good reason. In some contexts, the term is used very narrowly to call
    a cluster of consumer products, like personal fitness trackers, smart thermostats,
    or smart watches. In other contexts, it is broadly to describe almost any small
    computing device. The Industrial Internet of Things is again a different set of
    things that will enable smart factories, cities, and energy systems. In security,
    it usually refers to sensors and actuators tied to other building operations.


    No people feel confused. It reminds me to explain the cloud in the early days.
    At least in IoT, you have something you can touch. If you''re reading this book,
    you''re probably at the head of the class; more than half of the United States
    has not even heard the term. To understand its impact, we must first understand
    what it is—and, just as importantly, what it is not.


    IoT is not one thing or one type of thing; more than cloud computing is one application
    or one class of applications. The term IoT is a convenient label—most of the time—for
    grouping products emerging across a plethora of consumer and commercial markets.
    To be sure, they have many fundamental characteristics in common—small, connected,
    data-rich, controllable, and integrated into things—that''s not where the similarities
    end.


    By definition, IoT refers to the network of physical objects embedded with electronics,
    software, sensors, and connected to the Internet. The IoT ecosystem includes all
    of the other systems that enable us to make use of these devices, including gateways,
    cloud computing, analytics, dashboards, and mobile application. With IoT devices
    and an ecosystem in place, we can collect volumes of data and exercise control
    over the world remotely. IoT enables'
