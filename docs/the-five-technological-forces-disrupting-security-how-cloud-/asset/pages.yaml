- pgno: 54
  md: '# CHAPTER 3: The Tipping Point


    the cable and telephone companies have blanketed nearly every business address
    in the United States with high-quality connectivity. Most significantly, many
    customers now have an expectation that all of their applications will be available
    as cloud services.


    Does anyone really think that the security system will be the last server inside
    their data centers?


    # EASIER FOR NEW ENTRANTS


    With all these changes in the milieu surrounding cloud adoption, the advances
    in technology have made it easier for someone with a business plan and some funding
    to launch a new offering in this domain. In the year 2000, a budding SaaS company
    still had to purchase its own servers, database and operating system software
    licenses, configure and install all hardware and software, and drag it off to
    either a dedicated data center or collocation facility. The sheer number of staff
    hours this process took—not to mention significant capital or extremely good credit—dwarfs
    the investment in time and effort required by today''s entrepreneurs.


    Today, literally anyone with a credit card can now launch a SaaS business by accounting
    in an AWS or of the other many SaaS players in the market. Buying and provisioning
    an IaaS environment where a start-up can launch its applications—while presenting
    a technically ratified set of purchases—no more difficult than any other ecommerce
    activity at the level of pointing and clicking on items to put in one''s shopping
    cart checkout.


    Of course, the challenge of writing application that meets users need and expectations
    remains a challenge, as having a ready IaaS environment has nothing to change
    the need for market research and product strategy. That said, the tools for creating
    web applications have evolved since the first decade of SaaS application came
    onto the scene. Dozens of languages, frameworks, collaborating tools, evolved
    HTML, and API standards have all contributed to a high-productivity workplace
    for software developers in physical security (and every other vertical market).


    Regardless of all these developments, the biggest barrier for entrants to our
    industry remains: we are irreducibly, inescapably physical. Creating or adapting
    electronic hardware to the purposes of physical security. The big strides in simplifying
    and enabling cloud computing development have done little to make hardware development
    easier. It is slower, more difficult, more specialized, and much riskier due to
    the cost of getting the engineering wrong in hardware. It''s not like you can
    just rewrite and compile.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# START-UPS SHOW UP TO THE GAME


    Cloud has provided a path between buildings and their owners as Uber between riders
    and drivers and as Facebook among friends. This is most evident in the residential
    space, where numerous smart lock, smart doorbell, and whatever start-ups have
    recently launched. Naturally, all of these consumer-facing security services are
    cloud companies through-and-human. Ironically, though, they don''t have to explain
    that to anyone. It''s not even part of their advertising copy. Nobody cares. It
    is assumed that every new company we see is a cloud company, and we''re okay with
    that.


    Within commercial security, there has also been an increase in security start-ups
    making an entrance with cloud solutions, in video surveillance and increasingly,
    in access control. While the technology and quality differ considerably from one
    to the next, there were at this writing over 30-40 companies offering video surveillance
    as a service (VSaaS) or managed video as a service (MVaaS) offerings in the commercial
    space.


    There are several reasons that the video sector has seen more than growth, as
    access control. First, almost none of the companies develop their own camera products,
    which means they can leverage existing products already in the market. Second,
    this segment of the industry has benefited from the adoption of common standards,
    most notably ONVIF, which permits interoperability across many cameras and storage
    services. Finally, video surveillance is subject to fewer jurisdictional regulations
    than alarm or access control services. This means that products can be used in
    many places without creating specific versions for each, or by the product through
    lengthy and expensive regulatory approval processes.


    # THE INNOVATOR''S DILEMMA


    Many have wondered why few, if any, of established security software providers
    have jumped into the cloud space. In other words, if you have a good reputation
    in the industry, a deep understanding of customer requirements, and a proved go-to-market
    strategy, why not leverage your position to offer cloud-based services?


    While I was still in the consulting business, I worked with companies in other
    industries facing this same question. The conundrum for company management usually
    comes down to a combination of intertwined challenges. The first is cannibalization
    of existing product lines. The old guard within the company actively opposes disruptive
    product developments if they threaten cash cows. For example, passenger railroad
    companies stayed clear of the airline'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'business, figuring such a move would take business from their established business
    model.


    Is this ever a good strategy? Well, when you''re tempted to protect your cash
    cows, ask yourself: how do you travel cross-country?


    While this new-versus-old dynamic can happen with any two products competing for
    the same customers, it has been played out many times by advocates of a cloud
    product going up against an earlier generation of technology. Of course, with
    other companies busy developing new (cloud) products giving the customers what
    they want, then eternal cannibalization is inevitable. You should always cannibalize
    yourself before someone else does for you.


    The second dynamic at play around established products is Harvard professor Clayton
    Christensen''s well-known Innovator''s Dilemma. He explains that established companies
    focus too much on customers'' needs within their existing product lines and fail
    to adopt new and potentially disruptive technologies that will eventually serve
    their customers'' needs better. Coupled with the large, decade-plus development
    and investment time between established products, it''s difficult to dislodge
    the incremental improvement mind-set. To succeed, you need to convince a board
    of directors that the company should abandon what has been a moneymaker for many
    years and instead try something new and risky.


    Good luck pitching that to your boss.


    # DISRUPTION


    Cloud computing is the most disruptive force to the industry since digital dialer
    was introduced in the 1970s. Ten years from now, we will look back and see that
    the cloud technology bifurcated the industry into have and have-nots. The have
    will be those who adopted the cloud, from their inception as modern startups,
    or as industry players who had the sense to see what was coming and reinvent themselves
    and their products. The have-nots will be those, burdened by inertia of older
    solutions, fall victim to the innovator''s dilemma, never loosening their grip
    on legacy technologies or opening their wallets quite enough to invest in the
    future. This will be a classic case of disruption, carving along the lines of
    those who made the transition and those who don''t.


    The biggest effect will be on the manufacturers and software suppliers themselves.
    After all, everyone who is downstream can switch to other solutions. Software
    providers who don''t make the transition, however, will'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'themselves in the death spiral eroding market share, loss of key employees
    across sales and engineering, and customer defection.


    System integrators worry about the pinch from cloud computing as customers have
    become piecewise movement of selected software components into the cloud. These
    transitions can start innocently with an organization using, let''s say, a cloud-based
    visitor management system that runs on an iPad in the lobby. Next, an expanding
    organization may want to use cloud-based access control and video, but only satellite
    offices and new acquisitions. As this process continues, what starts looking like
    a rash of excitations hits a tipping point and eventually becomes the normal.
    In my conversations with many integrators over the years, I''ve learned that many
    consider it existential question: what''s left to integrate everything is in the
    cloud?


    Fortunately, it''s not quite so bleak it sounds, but the ground has definitely
    shifted. Physical security is irreducible, which means there will always be equipment
    that needs to be installed on premise: electric strikes, wireless door lockers,
    cameras, elevator controls, gates, turnstiles, and trucks of sensors. Also, there
    is still a residue of software integration in many cases because every corporate
    security environment is unique, at least around the edges where it needs to join
    with other IT systems. But the work on the remaining IT components does not command
    the level of expenditure as what the old kings of the hill in the enterprise software
    could command.


    In this world, system integrators in the cloud-only world will find themselves
    on common ground with those in many verticals. The new expertise will be in configuring
    and managing increasingly cloud-based solutions with increasingly complex identity
    federation requirements.


    Security organizations in this cloud-only world will have many options for the
    types of systems and services they would like to use. In fact, customers ranging
    from small business owners to large enterprises will be the beneficiaries of this
    change.


    # WHAT IS MY CLOUD STRATEGY?


    People always ask me when is a good time to move their physical security systems
    to the cloud. My answer can be summed up by an old proverb: The best time to have
    planted a tree is 20 years ago; the second best time is right now.


    In a time where the benefits of on-premise software systems have flattened out
    and cloud-based systems are adding value rapidly, every day of delay is a day
    of throwing good money after. One illustration of this principle is planning the
    use of big data tools to improve your security posture. I discuss in'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'more detail later, big data tools will emerge within cloud-based systems, not
    on-premise systems. If you begin to accumulate data with a well-chosen cloud provider
    today, then as security-specific big data applications emerge over the next several
    years, you will be in a position to apply them to your historical data and begin
    learning from it immediately. If, on the other hand, you wait to become a late
    adopter, you will have deprived yourself of the benefits of the early versions
    of those tools for the entire time you''ve waited.


    This scenario is actually a specific example of a general technology adoption
    conundrum. In the fast-paced ascendancy of PCs and laptops, buyers always wondered
    if they should buy now or wait for next year''s more powerful model with even
    more memory and processor speed. The reasoning remorse behind waiting had a certain
    amount of appeal if you thought of your possible remorse a year now from having
    what would be last year''s model. However, that year would have been a year when
    you did every task more slowly than you could have with an earlier decision to
    upgrade. That would have been a smart decision? Think of all the wasted productivity.


    Cloud adaption for electronic security infrastructure is in this same conundrum
    for many hesitant buyers today. The option is to move forward, but many are waiting
    for next year''s model because it''s going to be even better. The flaw in this
    decision algorithm is that it will always be true that next year''s model will
    be better. That''s life in technology: always tantalizing, always just out of
    reach.


    To close out with two more pro to frame this dilemma: are you in a place where
    you should look before you leap or in one where he who hesitates is lost? Your
    call.'
  merge: -1
  img_proc: true
