- pgno: 120
  md: 'fix just a single electric system in Manhattan and New Jersey. The entire country
    would quickly degenerate into a preelectric society with a population that does
    not know how to live without it. Chaos.


    With this single example—massive electric grid failure—it is easy to see how the
    promise of IoT will remain a promise unless this security problem can be solved.
    But we don''t do well as a species planning for scenarios we''ve never seen before.
    We don''t believe they can really happen. In all likelihood, we will simply move
    forward and not think about it. Such inaction will be disastrous.


    # CLOUD SECURITY REDUX...BUT WORTH


    The cyber challenges to physical security deployments of IoT devices remind me
    of the early days of cloud computing and the security hurdles—real and imagined—that
    faced the first decade of cloud computing (1999–2009, by reckoning), its number
    one challenge was to convince buyers that the cloud was at least as safe as their
    own data centers or on-premise servers. It was easy to make the case in logical
    terms, but many buyers had to overcome a big psychological barrier. The root issue
    is people feel intrinsically more secure and in control when they have something
    in their physical possession. If I can see it and touch it, I can protect it.
    It is also easier to trust your own employees than the faceless minions some distant
    data center. Both of these contribute to a false sense of security around the
    alleged benefits of keeping security computing inside your building.


    Hacking does not respect the physical location of the computing environment. Your
    data center, my data center—it doesn''t matter whether it''s public or private.
    Or does hacking respect the logo on the employee badge of the system administrator?
    Your staff, my staff—the only question who adheres to the best cybersecurity practices.
    Usually, that jump ball goes to the employees of cloud data centers or SaaS companies
    because it''s the only thing they do at. Their livelihood and their companies''
    success depend on being good at. At large cloud companies, the number of cybersecurity
    experts can easily run into the thousands. "Bob" in the next cube is no match
    for them.


    Now that we have placed one collective foot into the IoT camp, cybersecurity issues
    are resurfacing. This time, they are at a much larger scale and with bigger remediation
    challenges. What cloud has going for it that all of its virtualized computer systems
    are under some form of governance structure (at least in principle) and capable
    of being managed en masse. There are best practices for managing a bunch of virtual
    servers in a modern data center, including perimeter protections, security patches,
    configuration'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'management, and intrusion detection. More importantly, we can enforce governance
    rules to verify that payoff matches policy.


    IoT devices afford no such conveniences.


    They are installed in wildly different environments with vastly different cyber-security
    practices. Unlike cloud services, they enjoy no common perimeter protection. They
    may be built behind a well-managed commercial firewall or just plunked down behind
    a home router to factory defaults. Unlike cloud services, they may not be patchable
    or manageable under centralized control. They can easily languish with year-old
    firmware that allows them to be compromised. Finally unlike unlike cloud services,
    the very notion of a perimeter is irrelevant for many IoT deployments. They are
    out in the wild.


    Even if there were never a single IoT device used in a security system, their
    existence poses a cyber threat. That''s because they will be installed on the
    same networks with security systems. A problem with any of these devices presents
    a problem for all.


    # DEVICE AUTHENTICATION: DO I KNOW YOU?


    Device authentication—think of it as log-ins and passwords for devices to get
    onto your network or access cards and employee badges for inanimate objects. Unfortunate,
    in the age-old context between innovation and security, this is one area where
    old safety is losing to sexy new inventions.


    It''s hard to provide effective, convenient authentication for relatively powerful
    computing devices like laptops, tablets, and mobile phones. They have more power
    than sophisticated encryption, secure storage, and certificates. They can also
    be remotely updated with patches that address the invisible security holes in
    every piece of software ever written. Perhaps, as important as all these factors
    is that they support man-machine interaction in which humans can respond to challenges,
    manage multifactor authentication, and provide crucial “what-you-know” factors
    in multifactor authentication protocols.


    But do we provide similar levels of cybersecurity for small embedded devices with
    limited computing capabilities, no man-machine interface, and so low that the
    payoff may not be for anything but the most rudimentary methods? Most IoT devices
    do not identify themselves in any trustworthy way. This might seem manageable
    in a home network where you can (almost) count or recognize the devices that should
    or shouldn''t be connected (although days are quickly coming to a close). In a
    corporate network, it’s impossible. It’s also easy for anyone and anything to
    plug into a large network'
  merge: -1
  img_proc: true
