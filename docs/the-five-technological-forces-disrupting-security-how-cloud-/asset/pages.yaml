    # EARLY CLOUDS, SUNNY SKIES


    The SmartBox went from a front-porch convenience to an electronic security fixture
    almost overnight—if you count 6 months of nonstop overnight. The web app spawned
    a new user interface designed for physical access control workflows, under the
    hood, it retained its original cloud architecture. The cloud back end was designed
    to serve tens of consumers making online purchases and checking for deliveries
    while behind the scenes processing transactions with smart lockboxes. This mission
    demanded a robust platform that could serve every shipper who valued delivery
    and every shipper who valued customer satisfaction.


    That was a challenge.


    At the time, there was nothing of this scale that operated as both a web service
