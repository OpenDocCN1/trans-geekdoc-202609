    having every move digitized and recorded, the presence of this many new data sources
    in residential and commercial properties has profound displacement effects on
    other technologies—including traditional security systems.


    This use of cheap and widely available IoT components is exactly what is happening
    in many of the start-ups that have entered the space in recent years. There should
