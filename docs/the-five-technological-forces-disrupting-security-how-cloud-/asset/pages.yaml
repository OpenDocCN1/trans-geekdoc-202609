    # Anomaly Detection


    Anomaly detection is what security is all about—or, in the unforgettable words
    of the Sesame Street jingle—that one of these is not like the others.


    In security we are always on the lookout for what is unusual or different—assuming
    that most of the time, things are good. Its purpose is to examine a data sets
    or large data streams and detect instances that are not like most'
