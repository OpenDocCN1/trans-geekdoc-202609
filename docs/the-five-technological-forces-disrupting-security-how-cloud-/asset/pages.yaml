  md: '# 84 CHAPTER 8: Why IoT Matters in Security


    As with the Internet revolution before it, IoT will reshape the security market
    for decades to come. Between now and 2025, forecasters as diverse as GE², Cisco²,
    McKinsey³, and Gartner³ estimate its economic impact in the tens of trillions
    of dollars. These numbers dwarf earlier technology shifts of the past 50 years
    like personal computing, Internet, and smartphones—innovations that irreversibly
    changed not only security but also everyday life.


    The sheer number of connected devices is equally staggering: according to recent
    findings, that number had already eclipsed 3 billion in 2015 and will surge to
    over 20 billion by 2020. Interacting with all of these connected devices will
    be another 8 billion personal platforms as smartphones, tablets, watches, and
    PCs.


    # SECURITY: ALREADY AN I BUSINESS


    I would not be the first to argue that our industry has an IoT precursor since
    the early days of electronic security in the 1970s. That was well before the term
    was coined, of course, and well before IoT vaulted to the top of every growth
    projection in the tech industry. Coming full circle, security is universally identified
    as one of the three applications of IoT technology, particularly in the residential
    setting. Analysts have concluded that without the security function, home automation
    wouldn''t be taking off as quickly as it has.


    Security system suppliers can claim to a long lineage of smart, connected devices
    that would have been called IoT if the term and the Internet as we know it today
    existed a few decades ago. Networked digital cameras are the shining example.
    They''ve always had the characteristics of IoT products (now hailed as the next
    big wave in computing). Media and analysis coverage has swept consumer into the
    IoT bucket along with the rest of home automation.


    Connected wireless locks are a second IoT precursor. They have been in the commercial
    use for at least 10 years since the earliest days of IoT. The category is now
    an IoT darling—as if discovered—with the rollout of new generations of smart(er)
    locks from several sexy start-ups.


    A big part of our IoT heritage lines up with the coming boom of sensors that will
    give us more data for decisions. Sensor data will come from two


