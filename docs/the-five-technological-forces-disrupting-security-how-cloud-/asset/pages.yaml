    product offering.


    Netflix, for example, is a SaaS application that runs on Amazon Web Services (AWS).
    IaaS frees companies from dealing with hardware, network, and data centers. These
    physical and network layers of cloud services have become highly specialized,
    with the largest infrastructure providers (like AWS) offering the economics of
