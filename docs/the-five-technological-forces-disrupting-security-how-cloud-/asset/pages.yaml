  md: '# CHAPTER 2: The Run-Up to Cloud


    # BEFORE WE CALLED IT "CLOUD"


    During the first era of the Internet economy, we didn''t use the term cloud. Software
    and network engineers knew the cloud symbol by looking at network diagrams for
    years, but the same symbol could refer to just about networking technology (e.g.,
    nearly forgotten relics like X.25 and SNA). Unlike popular cloud depictions today,
    it lacked the implication that invisible clouds hide, performing magical services.
    It simply served as a way of abstracting and simplifying the representation of
    a spaghetti ball of connections. It said anything touching it exchange messages
    with everything else.


    The first cloud companies were remote data centers running your applications for
    you. The earliest name for them was application service provider (ASP). Companies
    operating under the ASP model ran their applications on their servers and took
    care of maintenance, licensing, storage, and backups, thereby relieving your IT
    staff of developing specialized knowledge for every application you used. This
    breakthrough model shared some of the characteristics of today''s SaaS companies
    but felt short of creating new, multitenant applications optimized for emerging
    cloud usage.


    Some used the term host, as in "hosted access control" or "hosted video surveillance."
    At best, the term is vague, imprecise, and misleading. It says nothing about the
    underlying computing model. Multitenant? Client-server? Web? It says nothing about
    where or how the computing resources are deployed. A data center? On the Internet?
    In a closet? Finally, it sweeps many deployment models into a single bucket, as
    if to say all off-site computing is created.


    Nothing could be further from the truth.


    # FIVE ESSENTIAL CHARACTERISTICS AND WHY THEY MATTER


    In nearly every public speaking engagement I''ve had over the past 10 years, someone
    in the audience invariably asks for a definition of the cloud. Either they''ve
    never come across a clear explanation or they''ve heard too many conflicting answers.
    Deceptive marketing claims only add to the confusion. Fortunately, we have remarkably
    good agreement on the precise definition, thanks to The National Institutes of
    Standards and Technology (NIST).


    NIST has become the worldwide leader in defining cloud technology and driving
    consensus on a core framework to describe it. One of the most useful elements
    of the NIST framework is the list of five essential characteristics of'
