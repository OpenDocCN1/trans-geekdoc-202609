- pgno: 224
  md: 'illustrious history as the central subject of many works of science fiction
    literature and cinema (think HAL 9000 and Skynet).


    One of the most recent entries in this genre, the British-American TV series,
    Humans, which premiered in the United States in 2015 on AMC, illustrates the profound
    quandaries that arise from interactions with social machines. But it also illustrates
    the incredible utility of machines that are capable of thought and respect (most)
    human conventions.


    In fiction, social machines look a lot like human beings, but they don''t have
    to. It just makes them creepier. They can just well be disembodied bodies with
    a limited range of social interactions skills. Or they can be much larger things,
    like buildings.


    What if the physical spaces we manage connected through social devices and became
    social themselves? What if our publics knew who we were and why we were there?
    What if public places could talk about their security concerns? Would would “social
    spaces,” to coin a phrase, change security around public places?


    Even though the security industry is usually late to the party for technology
    adoption, it seems inevitable that social applications will eventually find their
    way into the industry. When they do, they have the potential to introduce some
    of the most sweeping changes we''ve seen since the introduction of IP technology.


    Several of the likely outcomes are the following:


    +   - Enabling a participatory security process

    - Blending the security experience into business processes

    - Improved situational awareness

    - More intuitive and less obstructive interactions


    # WHAT DOES IT MEAN TO BE A SOCIAL SPACE?


    Three converging sets of innovations have made social spaces possible: the small,
    powerful embedded devices capable of machine learning, the growing web of connections
    between physical spaces and the cloud, and the acceptance of social identity as
    a legitimate form of identity credential.


    Amid all discussion about social networks, social media, and social applications,
    you rarely find a definition of what it means to be social. We know that people
    are social. Animals certainly appear to be social. But can a building or a physical
    space be social?'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# What Does It Mean to be a Social Space?


    When it comes right down to it, being social is mostly about how something interacts
    with the rest of the world. In the context of this book, there are four key behaviors
    that define social spaces.


    First, they know who you are. Social spaces will be able to identify their inhabitants,
    visitors, guests, caretakers, administrators, and all the other people who interact
    with them. This knowledge is a fundamental building block because social relations
    are built on the concept of a stable personal identity over time. We find that
    social spaces will need a way to identify people uniquely in a way that doesn''t
    change randomly, preferably by referring to an external identity provider. Social
    spaces will also need to understand the attributes and roles that are meaningful
    in the context of their interactions with us. The way we''re greeted, where we''re
    allowed to go, and whatever assistance we might be given, for example, will all
    depend on who we are and why we''re there.


    Second, they can talk to you. Being social is all about communicating. No communication,
    no social relations. Social spaces will communicate with us through social applications,
    just like our friends and colleagues today. The more natural this communication
    is, the better. Instead of having to learn a new application for every place we
    go, it beside possible to communicate with a social space as if it were a person,
    using text or voice exchanges. You could ask a social building to let you in,
    lock the door, or perhaps allow a guest to visit on a particular date, all without
    having to learn a new application or switch out of the applications you''re already
    using.


    Third, they can be part of a trust relationship. Social relations are all based
    on trust and is based on familiarity. That''s why your dog barks at strangers
    and not at yours. A social building wouldn''t bark at your friends, either. For
    social spaces, trust would also be built up over time, the same as it is between
    people and animals. Trust frameworks to support this type of learned trust are
    a hot topic in identity research. Automating them is a thorny problem. We will
    need automated frameworks for public spaces as the number of security concerns
    continues to grow. It is not possible to manage all of them through explicit rules.
    At some point, things, buildings, and spaces will need the ability to operate
    more like we do, and learning trust is a big part of it.


    Fourth, they can take action on who they interact with and what their past choices
    have been. Ultimately, the whole point of creating social spaces is empowering
    them on the ability to know, talk, and build trust. For example, a social space
    could remember its past interactions with me and change its way of dealing with
    me as it gets to know me better. A social building will know if someone is a friend
    of someone else and perhaps allow them to enter, whereas a complete stranger couldn''t.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# IT''S ALL ABOUT IDENTITY


    For social spaces to be a reality, they need to be able to identify people and
    need to share an identity of their own in return. Today, we don''t really have
    any agreed upon to assert identity with any universality or uniqueness. The fact
    is, there are too many ways, they''re all bound up in the small world of whichever
    organization issued us a particular token. When we go to work, we use an access
    card from our employer. When we go to the gym, we use a card from the health club.
    When we use an automated garage, we have yet another identity on the fob assigned
    to our car. This means we''re always identifying ourselves as someone different
    when we go to different places. None of these identities has anything to do with
    the others. We no wonder our buildings don''t know who we are.


    There have been attempts to find an identity provider everyone can agree on, but
    so far none of them has stuck. The security industry, for example, has many of
    ways of identifying people, but they suffer from a lack of uniqueness and scope.
    People outside the industry are horrified to hear that proximity cards aren''t
    necessarily unique. Smart cards, but the market has seen to shift to the new technology.


    The federal government has made several slabs at this as well, but the closest
    thing to a national identity initiative is the NSTIC program run by NIST. As a
    government initiative, however, it faces many adoption hurdles, especially since
    the NSA spying fiasco.


    Against this backdrop, a social space still needs to have its own unique identity
    to interact with social applications on a social network. It''s likely they will
    go in the same direction as the rest of us: using the available commercial identity
    providers that have become de facto way by which we identify ourselves online.


    # COMMUNICATION AND CROWDSOURC


    One of the main benefits of having social spaces with social identities on the
    same networks as the user community is that everyone can communicate with each
    other using identities and applications already part of their daily lives. These
    communications could be one-on-one, for example, such as a request or command
    to a social space. They could also be group messages, as we commonly experience
    in social media, where a community of interest is all privy to the same stream
    of information about a particular space or building. Or they might be messages
    about special events, like the arrival of a guest or a change of venue.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Security as a Customer Experience 207


    With these communication capabilities in place, social spaces could give rise
    to the possibility of what I would call social security, if the term wasn''t already
    in use. Instead, let''s call it “crowdsourced security.” The idea is that a social
    space could obtain services and surveillance from a large group of people who
    are part of an online community, rather than a traditional employee responsible
    for just function.


    In the 2013 novel *The Circle,*¹ one of three men leading the world''s largest
    Internet company paints a picture of how universal video surveillance will make
    crime highly improbable, if not outright impossible. The vision opens with individuals
    deploying a handful of cameras for their own personal interests, like checking
    the surf at the beach. As more people place cameras in more location for more
    reasons, until there are billions of cameras around the globe. In this world,
    cameras are all shareable through social networks with friends, friends of friends,
    and so on. Eventually, the whole planet is viewable all the time, and there are
    always enough viewers that no one would think of doing anything illegal, because
    they know they will get caught. The fact that we are almost at that point makes
    truth stranger than fiction, but the emergence of what is effectively crowdsourcing
    is the real takeaway.


    Compare this with the usual for intelligence collection and protection of a building.
    It’s having one or more dedicated guards watching computer screens and cameras.
    This is an expensive process, and there’s no way that a small group of people
    can ever hope to be observant as large group. Many companies, small businesses
    in particular, can’t afford dedicated security departments. But every company
    has an employee base that could be plugged into a social network group that receives
    alerts or images of possible issues. Forewarned is foremost, and more awareness
    is always better.


    # SECURITY AS A CUSTOMER EXPERIENCE


    One of our challenges as security professionals is to make security a positive
    customer experience. I’ll say that again, because it’s not language that we hear
    often: make security a positive customer experience. One of my recent encounters
    involved a long wait in an elevator lobby with a guard who had to keep his eyes
    on more activities and points of entry that anyone could reason-ably expect. It
    was a marginally decent urban location, and he needed to check identification
    and ask everyone who they were and before he could track the person I was there
    to see.


    > ¹Eggers, D. (2016) *The Circle.* New York, New York: Alfred A. Knopf.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# CHAPTER 19: Social Spaces


    Even under less pressured circumstances, it is not easy to work through an arduous
    sign-procedure and make guests feel welcome.


    The point is that when it''s your building, everything about this user experience
    has the potential to turn off visitors, guests, customers, and colleagues. What
    should customers expect? A customer experience, that’s what. There was a great
    line from a recent season of Mad Men where Roger Sterling reminded a colleague
    “the client should never experience a negative emotion while in your presence.”
    That’s a great goal for how guests should feel any time they’re in a space where
    visitor management is an integral part of the security process.


    A truly social space could be set up to know in advance who visit. With information,
    the guest could be welcomed by upon arrival, rather than being treated like an
    intruder. By using a mobile credential or pass sent in advance, registration and
    badger could be as simple as scanning the invitation. The social space would then
    use a preferred social network to tell your hosts that you were there. Compared
    with today’s baseline experience, this scenario shows the transformation of a
    security experience into a customer experience.


    Yes, security can actually be a plus for a customer.


    # DISRUPTION


    Social networks are disruptive. They have displaced older communications methods
    and increased the frequency of our interactions with other people and groups.
    They have altered the way we express ourselves and hastened the shift from voice
    to digital. They enable us to communicate with far greater ease and simplicity
    than anything that came before. Social channels have pulled us into closer groups
    over common interests and made us closer to people we already know. For many,
    they become a primary means of communication, eclipsing earlier technologies like
    voice calls by a wide margin.


    They have redirected not only how we communicate but also with whom and services.
    Social log-in has simplified the way we interact with new websites and services,
    providing millions with a new way of identifying themselves online. They have
    decreased our password burden and increased our ability to collect and share information
    across multiple channels whose only common thread is my interests, my online identity,
    and me. They have spun off thousands of derivative Web businesses that would have
    been unthinkable without social networks.


    So far, however, they have made few inroads into physical security other than
    through marketing, promotion, and mass communications, and that mostly by'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'governmental agencies. This means that they have yet to provide any significant
    disruptive effect on the way we practice security or the way we develop products
    for this market.


    The disruptive opportunity for social would be the widespread use of social identities
    in core security applications. Recall the discussion of Apple Pay for spaces.
    To win a disruption race in physical security, social identities would need to
    gain or at least hold ground against other forms of identity and authentication.


    # STRATEGY


    Security organizations can begin leveraging the power of social networks on their
    own, even before they show up in commercial security software platforms.


    The communication efficiencies of social networks can be applied to many commercial
    and residential security needs. They are a low-cost, readily available complement
    to other ways that security organizations already communicate with their constituents.
    The larger and more diverse, the more useful they will be compared with other
    digital techniques e-mail lists and mass notifications via text.


    What you will likely find a better fit to the task than any of the wide-open public
    networks, however, is one of the many internal collaboration platforms that started
    as software development tools (e.g., Slack) but are quickly turning into enterprise-wide
    messaging platforms. Security communications and topics can easily be adapted
    to these kinds of products as a new channel. The leverage in this approach is
    to use the same platform already adopted the rest of your organization.


    Leveraging social identities and social sign-on is more challenging. Your strategy
    will depend a great deal on what type of constituency you are protecting. If you
    are working with a predominantly group such as employees, membership, or some
    other group that is conscript under a more or less formal business process, then
    almost any consistent form of identity will work. Usually this means an e-mail
    address and employee number, membership number, or some other internal identifier
    that is only valid within your organization’s IT services. If, on the other hand,
    your constituency is more open and members are able to self-register, social sign-on
    will become more useful. Think of applications like admission privileges to movie
    theaters or sporting events, for example.'
