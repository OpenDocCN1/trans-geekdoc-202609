  md: '# ONE KEY TO RULE ALL


    The past 5 years have seen the success of numerous mobile apps that allow both
    residential and commercial users to open doors—or smart locks to be precise—with
    their smartphones. In the consumer setting, in fact, smart locks not gain much
    foothold until smart apps made them convenient enough to outweigh the extra expense
    and learning curve. Presmartphone electronics let relive the maddening programming
    sag of the VCR, requiring users to master an inscrutable keypad with finger-fretzel
    keys—only Rain Man could


    Smartphones changed all of that—so much that when I cautiously installed our home''s
    first smart lock, replete with sinister glass facade and synthetic voice, I worried
    my wife would say she wanted nothing of the sort on her front door. To my pleasant
    surprise, she quickly became its biggest fan, evangelizing the benefits to anyone
    who faced the same challenges of sharing keys with housekeepers, dog walkers,
    overnight guests, and the kid down the street who waters our plants when we go
    out of town.


    The app for this lock communicates via some mysterious set of protocols that travel
    invisibly over the airwaves and usually don''t matter to the owner. At least,
    not until a smart lock enters. Her new lock comes from the same manufacturer and
    connects to the same backend cloud management system, her new-familiar mobile
    app won''t work. So she downloads a second door-unlocking app, just for that particular
    lock. When the office she works in adds this technological marvel to our front
    doors, she''ll add a third app and so on until she has an explosion of apps on
    her phone, with dozens of apps that all do exactly the same thing, recognize her
    and unlock the lock for


    Nobody wants dozens of apps or "keys" on their phone. That justifies the problem
    of a gigantic keychain in digital form. Soon, you forget which app goes with which
    building, and they become more hassle than them.


    This is the problem that confronted me as I began to think about how my company
    could introduce electronic keys at a larger scale than anyone had previously imagined.
    As chairman of the SIA Standards Committee, I also had another reason to think
    about this at the scale of making these new credentials more efficient across
    the entire industry. I wanted something that would work for millions or billions
    of people without them having to think about which app they needed to. I imagined
