  md: '# What Can Mobile Do for Me?


    Smartphones save countless lives throughout the world every year. They can provide
    critical communications during times of crisis, medical emergency, natural disaster,
    and even terrorism. Yet, we have not fully harnessed that power in physical security
    applications. The phone can always be asking "what''s" as a side channel to law
    enforcement or a corporate communication center, but we have no holistic approach
    to fully exploiting mobile application capabilities.


    Still in their first generation, mobile security apps lack maturity and a full
    realization of the power at their disposal. This is not an indictment, by any
    means, but rather a promise of things to come.


    # WHAT''S IN IT FOR ME?


    We''ve looked at what mobile is doing for the overall security ecosystem, but
    you may still be asking "what is it for me?" The answer, of course, depends on
    you and your company''s roles in the security value chain. Suppliers focus on
    customer satisfaction and product utility. Integrators concern themselves with
    deployment, usability, and cost of support. Security teams and business owners
    care about the real issues of overall effectiveness and whether their people will
    actually use the tools they provide. That said, we''re all pulling together, so
    we hope to find similar answers across the entire spectrum.


    We should always start with the user. This is where the rubber hits the road (or
    where the thumb hits the glass). Our first goal should be to fully engage that
    user and provide exactly what they need. This is the moment of truth for whether
    someone will use the application a second or third time. Earlier, we introduced
    the toothbrush test. Every time someone uses an app determines whether it will
    rise to twice-a-day before it becomes a part of their lives.


    Many of the benefits of mobile security applications are readily apparent: access
    to information wherever and whenever; the ability to respond immediately in a'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'crisis; remote control of critical systems; mobile credentials with participatory
    features; and, last but not least, the ability to coordinate teams across space
    and time.


    How do these features translate into specific benefits for security teams and
    business owners? How do they change the game for integrators and service providers?
    What do we have to look forward to as these applications continue to evolve? Many
    of these questions have begun to find answers as the rollout of mobile apps takes
    off the commercial security industry.


    For the remainder of this chapter, we will look at the mobile technology trends
    we discussed earlier to see what they deliver to the point of use: not a theoretical
    view, but a field test on the practical utility and benefit of investing in mobile
    security applications.


    # REAL-TIME SITUATIONAL AWARENESS


    Many cite situational awareness as one of mobile security applications'' primary
    benefits. This should not come as a big surprise. Situational awareness is part
    of our core mission, and it''s something mobile apps do really well. Perhaps,
    you never thought about apps in quite those terms. We don''t think of shopping
    apps, for example, as giving real-time situational awareness about what''s on
    sale. Now do we cast the benefits of instant messaging apps in quite those terms.
    That''s exactly what they do. So it is with security applications. They provide
    users real-time information about the world around them wherever they may be.


    This ability to inform—provide situational awareness—is why the spread of security-related
    apps into the hands of everyday users is so important. It brings them into the
    security equation. Seemingly, single-purpose apps like mobile credentials gave
    a pull-through strategy for additional modes of interaction, even if they were
    initially adopted for convenience.


    The first generation of commercial physical security applications has been slower
    to post rapid gains in daily usage than vertical business markets. They''ve had
    an uphill climb because the back-end information systems have been slow to move
    to the cloud. Their residential counterparts haven''t had this problem. Instead,
    they have quickly become a daily habit for the early adopters in the home automation
    space, who use their apps dozens of times per day.


    They''ve also seen penetration for cultural and institutional reasons. Until mobile
    credentials gave security organizations a reason to widely deploy mobile apps,
    they dealt with user groups of only a handful of authorized employees. That''s
    just the way they were built. Now that the cloud is gaining'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Multilocation Businesses 71


    traction among commercial systems, we see that it can change the way we engage
    with our security systems and the people we protect.


    What exactly does this combination of real-time situational awareness and user
    engagement accomplish for the security organization? The answer depends somewhat
    on scale, so let''s look at several classes of organizations.


    # SMALL BUSINESS


    Let''s start out at the small end of the scale and consider what this capability
    does for individual business owners. It best be compared with similar changes
    in the residential security market. As a homeowner, I used to have very little
    idea of what the infrastructure systems in my home were doing and no ability to
    control them remotely. Improvements in mobile applications and the concurrent
    development of IoT devices for the home created natural synergies that gave my
    family visibility and control now. Almost overnight, we were able to see and control
    dozens of aspects of home security and environmental management. Our situational
    awareness includes who comes and gone from the house, whether the doors are locked,
    and how the thermostats are set. Plus, we can look in on the dog we want.


    Small business owners have enjoyed an equally dramatic transformation, as residential
    applications have crossed into the SMB category where needs are not so far off
    those of homeowners. While there is a large overlap between home automation tools
    and commercial security applications, the latter provide additional types of controls
    and features not needed in the home. The sum of these totals has given business
    owners a picture of the state of their business while they are away from.


    While security considerations usually provide the reason for the installation
    of these systems, most owners find operational benefits as well. For example,
    retail users report that their video surveillance allows them to see how well
    their staff attends to customers in the store. This tells them how well their
    training programs work and who they should be coaching a bit more. It also get
    real-time feedback on how many people are in their shop and whether staffing meets
    demands.


    # MULTILOCATION BUSINESSES


    Anyone who operates a multilocation business knows that you can''t be everywhere
    at once. Franchise owners, chain retail, property management, state and local
    government, and many other distributed operations place security managers in the
    position of having to know what''s going on in more than one place'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 72 CHAPTER 7: What Can Mobile Do for Me?


    at a time. Mobile security applications help ease or erase a big part of that
    challenge.


    One of the earliest customers for my company''s cloud-based services was a McDonald''s
    franchise owner who had five locations. He wanted to make sure each of his managers
    opened their respective stores by 4:30 a.m. Every morning, he sat in front of
    his browser with a cup of coffee and watch the activity log scroll before him.
    If a store had not been accessed on time, he was on the phone to find out why
    and fix the problem. Fast forward to the present. Owners can have this degree
    of insight into their operations, but they are no longer tethered to a desktop
    browser. This franchise owner can now enjoy this insight from his smartphone while
