  md: 'firmware, even if you wanted to. All the vulnerabilities present the day you
    bought your shiny new IoT toy will be for the rest of its life.


    In the context of physical security, many connected devices were built with the
    tacit assumption that they would live within the relatively safe confines of local
    area networks. The on-premise client-server paradigm made this assumption reasonable
    at the time, but not anymore. The walled garden no longer has a wall, and no one
    will build unless we pay for it.


    Once local systems were connected to the Internet, they were vulnerable to the
    billions of hackers, bots, and automated attack scripts that pound countless URLs
    every day. Even as our websites, applications, and APIs have become better defended,
    embedded devices have lagged. That''s how we ended up with 140,000 cameras being
    used for DDoS attacks.


    # THE NEED FOR STANDARDS


    It would seem that in this day and age, it''s hardly necessary to make the case
    for standards. But as anyone with passing technical familiarity with physical
    security can tell you, many areas still defy standardization. Instead of boring
    you with yet tech speak, let''s talk about everyone''s childhood fascination,
    choo-choo trains.


    > "Gauge" is the width between the two rails of a train track. Today, we take
    it for granted that this is the same everywhere, but this was not true. In the
    early days of railroads in the 19th century, companies used different track gauges
    throughout the world. Trains that operated on one gauge could not travel on a
    track of a different gauge because the wheels would not fit. This incompatibility
    meant that human travelers and material shipments had to be off one train and
    move to another in order to continue their journey. This was great news for freight
    handlers, restaurateurs, and hoteliers at the junction of those two gauges, but
    bad news for passengers and shippers.


    On the face of it, this was a relatively simple problem to solve: just make all
    the train tracks the same size, right? The problem was that vested interests had
    grown up around each type of track and the rail that fit into it, and no one wanted
    to bear the expense or inconvenience of having to change. The contrary, using
    a gauge incompatible with the next railroad over was actually an intentional strategy
    for preserving market share. It forced people to use your track if they wanted
    to get to areas you controlled. This circumstance was the basis of the famous
    Gauge War of 1853 in Erie, PA, where the town prevented gauge standardization
    in order to force layovers and thus local spending.'
