    To bring this back to the physical security industry: if you are an integrator
    or a security organization, you probably don''t want any direct involvement with
    IaaS for your electronic security infrastructure. You probably just want a finished
    product that performs video management or access control or alarm monitoring.


    # DEPLOYMENT MODELS: PUBLIC CLOUDS VS PRIVATE CLOUDS


    The final dimension of the NIST cloud computing model relevant to physical security
    solutions concerns deployment models. They describe which individuals or groups
    can use a particular software or infrastructure under what conditions.


    As the name suggests, public clouds are services offered to the public at large.
    Think of the phone system or wireless mobility services or cable television. Customers
    create an account, agree to a contract or terms of service, and cloud service
    begins to flow. Customers don''t need to be a member of any special group or get
    any prior authorization from anyone. The service provider designs the service
    with the goal of signing up as many people as possible and makes it available
    to anyone with an Internet connection.


    Private clouds, on the other hand, are just what their name imply: used only by
    people or institutions with prior authorization. Most often, private clouds are
    created by corporations to host applications or data to be used in a conventional
    data center. They move to a private cloud to take advantage of the economic benefits
    and flexibility of the cloud, but without being exposed to the public at large.
    Often, providers use the same technology to access private clouds as for public
    clouds: web browsers, mobile apps, etc. However, the services hide behind corporate
    firewalls, VPN access, or other security techniques that restrict them to authorized
    individuals.


    You might ask: wouldn''t private clouds be ideal for physical security applications?
    Some users find themselves more comfortable with the idea that'
