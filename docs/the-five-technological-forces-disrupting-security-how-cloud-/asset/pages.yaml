  img_proc: true
- pgno: 130
  md: '# CHAPTER 10: IoT Technology and Standards


    Track gauges in many countries and regions were standardized based on the common
    efficiencies of doing so. Ultimately, the Pacific Railway Act of 1863 sets standards
    for the transcontinental railroad, and others followed suit. Now, trains roll
    from coast to coast without problem.


    Today, the world of IoT devices is roughly where the railroads were before the
    arrival of standard gauge. The protocols they use to communicate are not the same
    gauge. This prevents them from interoperating with one another directly. It is
    also directly responsible for the proliferation of gateways, hubs, and base stations,
    plus all the authentication procedures needed to make them work together. In short,
    the jungle of wireless devices in a modern IoT implementation can easily rival
    the mid-PC era fumble of specialized cables for serial, parallel, SCSI, USB, Ethernet,
    and other peripherals that would only communicate with a specific type of wire.


    The real issue is here one of interoperability. Ideally we would like for all
    IoT devices to talk to each other in order to accomplish some greater task, like
    alert occupants to danger. But there is no guarantee that any two IoT devices
    can work together without a lot of custom integration. That approach doesn''t
    scale.


    For the security industry, this lack of standardization poses a huge problem for
    IoT adoption. Forgetting the mess for a moment, the more serious problem is what
    it means to be on a single protocol family, only to find a few years later that
    it lost in the standards war and is no longer manufactured. If you are a buyer,
    you are now stuck with a system difficult to expand. If you are a system integrator,
    you will have to be the bearer of this bad news to your customers. And if you
    are a manufacturer, you have to place a bet that''s as long as your product life
    cycle (or several bets).


    This also has major implications for your workforce. Training is a constant treadmill
    exercise for most companies; technology obsolescence only makes it much worse.
    No sooner do your technicians know how to install one type of IoT network than
    something else comes along to replace it—with no guarantee of backward compatibility.
    As quick as your operations staff understand the quirks and foibles of one deployment,
    another must be placed alongside to build out your next layer of infrastructure.


    This rolling stew of proposed standards from an evolving ensemble of too many
    chefs in the kitchen forces many companies to change their strategy over and over.
    In the earlier days of home and industrial automation, handful of radio protocols
    like ZigBee and Z-Wave seemed enough to put together a network of sensors and
    control devices. Unfortunately, while these technologies gave the appearance of
    standardization—and they were, on the overall applications still spoke their own
    languages with little'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Architecture Matters 111


    interoperability across vendors. The new crop of IoT communication standards has
    multiplied these complexities 10-fold.


    Not that IoT incompatibility is the first standards gap our industry has encountered.
    Outside of alarm signaling, video encoding, and some aspects of card access, electronic
    security systems have been resounding nonstandardized for much of their history.
    For anyone watching even a little, it''s not hard to point out the many cases
    of vested interests surrounding proprietary equipment and software. It''s like
    you''re living in antebellum Erie with your vendors ripping up the tracks that
    allow you to move freely to other solutions. Buyers have rightly complained about
    vendor lock-in and have begun to give greater consideration to standards. They
    need to carry this behavior over to any plans for leveraging the benefits of IoT
    in a physical security setting.


    Do your homework before you spend your money.


    # ARCHITECTURE MATTERS


    In the physical world of buildings and bridges, good architecture ensures that
    things look good, serve their intended purpose, and don''t fall down while doing
    both. It makes structures safe to live, on walk, beneath, and inhabit.


    System architecture in networked electronic systems plays the same role. It is
    the art and science of making systems perform well, operate according to plan,
    and don''t fall over while doing something.


    Falling over doesn''t mean the same for connected devices and networks as it does
    for bricks and mortar, but it''s just as real. It used to be that, for computer
    systems, falling over mean software crashes that were usually the fault of some
    intrinsic coding error— unresponsive keyboards, core dumps, and infamous blue
    screen of death. Now, falling over is more likely to suggest hacking or external
    compromise—data loss, data threat, denial of service, or denial of safety, in
    the case of physical security networks.


    Architecture also provides a model of what things are and how they behave, especially
    their interactions with each. It literally provides a blueprint for the construction
    of something useful and safe. It translates complex design and engineering principles
    to drawings accessible and executable by anyone who wants to build something.
    If the builders, installers, or integrators follow these plans, we can expect
    the resulting system to perform to expectations and be resilient to natural and
    man-made threats.


    As physical systems have become cyber systems, IoT architecture has become as
    important as physical architecture. IoT architecture is in flux, with many'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# 112 CHAPTER 10: IoT Technology and Standards


    competing designs vying for market dominance. Communication protocols and identity
    standard provide many options but will undoubtedly win by the winds of change
    in the next 5 years. Being an observer at this stage is a bit like watching the
    formation of volcanic islands: It''s all hot, flowing lava, and we don''t know
    what form it will ultimately take. Here is more than with technical standards:
    a dogfight with multiple underlying technologies all competing for supremacy.


    Many aspects of IoT system architecture are driven by their need to be small and
    battery powered. The characteristics that make them most useful and exciting also
    make it difficult to connect them directly to the Internet. The security industry
    has seen and solved this problem before. Most of the sensors in residential security
    are now low-powered wireless devices that run on long-lasting batteries. What''s
    the trick? All of these devices run on specialized wireless networks for low-power
    communications. The trade-off is that these networks only provide a path to a
    local control panel or hub, not the world at large.


    # BUILDING BLOCKS


    Connected devices have been entering our lives subtly, in much the same way that
    solid-state electronics (i.e., transistors) did over the previous couple of generations.
    There was a time in automotive history, for example, when cars were manufactured
    with no transistors whatsoever; now you find hundreds of microprocessors and hundreds
    of millions of transistors in every ordinary car, to say nothing of the emerging
    autonomous vehicles called "super computers on wheels."


    Or consider a humble example: the household washer or dryer. There was a time
    when all the controls and sensors were electromechanical, no transistors and microprocessors.
    Around the late 1960s, it became more economical to manage temperatures, times,
    humidity, and water levels with transistors. Washers and dryers got added to the
    list of "transistorized" appliances along with the hearing aid, the transistor
    radio, and the first portable television.


    No one bought these products just because they contained transistors (well, maybe
    a couple of geeks). Most buyers were probably unaware. Who knew the new Kenmore
    washing machine used transistors to clean their clothes? They were just products.
    They sold themselves by virtue of superior functionality and improved user experience.


    The same has been happening with connected devices for the last decade or so years.
    They have crept into our lives without even thinking about it. We have purchased
    IoT products without buying them for that particular reason. When automakers began
    embedding Internet and cellular technology in cars'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'so they could tell their dealer they needed service, no one thought “hey, my
    car is an IoT device!” The technology came as an invisible part of the service
    you wanted: advance knowledge of whether something was to go wrong with your car.


    What has changed? We now look at IoT as a capability set that can improve any
    product or service. In part, that''s because it has become small and cheap enough
    to be fitted into practically any product you can imagine. Miniature and Moore''s
    law have seen to that. It''s also because the ability to connect to the Internet
    has been extended into every nook and cranny of our world, mostly to the variety
    of wireless communication options that a wide range of distance, data rate, and
    energy consumption profiles.


    Yet, there is something about the new embodiments of these technologies that calls
    to mind Arthur C. Clark''s famous third law: any sufficiently advanced technology
    is indistinguishable from magic.


    Magic starts with the familiar. Microprocessors are an inescapable part of everyday
    life and part of every IoT device. At some point, the twin triumphs of miniaturization
    and low-power consumption crossed a line and morphed a quantitative difference—smaller
    size and power—into a qualitative difference: now these things can go anywhere!


    The magic continues with the invisible radio waves in connected devices. Wireless
    communication networks are all part of everyday life and part of every IoT device.
    Again, multiple engineering triumphs like signal processing and lower transmission
    energy drive connected devices across a metamorphic phase transition, as different
    as vapor and ice.


    What is different now how these technologies are interconnected and how they are
    used. First and foremost, it''s impossible to plan for IoT products without including
    a cloud service component. The Internet is right there in the acronym, that shouldn''t
    be a surprise. However, with so much of the security industry still struggling
    to connect to cloud services, it''s a real consideration. There is no way to think
    about IoT with cloud as part of the equation. Moving your security program to
    the cloud is stakes for doing anything meaningful with IoT. If you''re not ready
    to make that step, then you''re not ready to leverage IoT. It can''t happen. Everyone
    building IoT products is building with them in the cloud.


    Second, you are entering a new era of wireless communication protocols. Many of
    these are designed for local area deployment, as measured by the size of a house
    or a commercial property. Others are being enabled with new generations of wide
    area networks that are similar to cellular technology, but optimized for machine-to-machine
    (M2M) applications. These 5G networks provide a big boost to security by allowing
    us to deploy IoT devices without'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 114 CHAPTER 10: IoT Technology and Standards


    building additional communication infrastructure of our own. Like everything,
    they come with a learning curve and perhaps some hard decisions obsoleting current
    technology.


    To understand how IoT fits into your physical security strategy, your service
    offerings as an integrator, or your product management planning as a manufacturer,
    you need a few of fundamental concepts. With apologies to my less technical readers,
    the material that follows is necessarily detailed in nature. However, I hope I''ve
    made it accessible enough, regardless of your role, that you can see how it relates
    to your physical security interests.


    # GATEWAYS TO THE FUTURE


    A “gateway” is simply a device that connects one network to another. The name
    derives from their similarity to physical gateways, because they both act as a
    connector between two different domains. What makes them interesting and useful
    is that they can connect networks that use different rules or speak different
    languages.


    Imagine connecting two road networks. If the rules of the road are the same on
    both sides, it''s trivial to connect them. Just lay down some pavement, and let
    people drive from one to another. But what if the rules are different on the left
    and another where they drive on the right. If we just pave the space between them,
    cars moving from one to the other will have head-collisions. So, we need a transition
    zone (or gateway) where the left and right lanes are switched over and to provide
    drivers with new rules (or protocols) about how to navigate the other side.


    But that''s not all they do.


    If the data expressed on the two networks are different, the gateway will modify
    it while passing it from one to the other. In this context, gateways can be thought
    of as translators that connect groups of people who speak different languages.
    Looking at the other way around, translators are gateways who switch between groups
    who would not otherwise be able to communicate with each other. Of course, a translator
    doesn''t just listen to the words used and repeat them to the other. That would
    be pointless. A good translator substitutes new words, syntax, and rules of grammar
    to accurately expressing the underlying message.


    Technically, this capability provides a method for connecting devices across similar
    networks, that is, networks without the same underlying protocols. For example,
    something that does not use IP protocols can be connected to something that does,
    like cloud services.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'In the case of IoT systems, there is usually a local wireless network just
    for IoT devices (although some use Wi-Fi directly). Such networks have their own
    protocols designed to maximize communication efficiency for the IoT devices themselves.
    However, these networks still need to be connected to the Internet. Otherwise,
    there’s no “I” in IoT. This is where the gateway comes in. It translates between
    the local wireless protocols and the Internet at large.


    Let''s take a deeper look at why this is


    First, not all wireless networks can be connected directly to the Internet. Wi-Fi
    is a familiar local area network that uses the same protocols as the Internet.
    That’s why it can be connected directly with just a wireless access point. Many
    wireless networks designed for IoT, however, do not use the Internet Protocol
    for internal communications. They have their own protocols and schemes that need
    to be translated at multiple levels to communicate.


    Second, gateways are alone responsible for internet or mesh communication among
    the devices on that same wireless network. This capability permits devices to
    continue operating locally if the Internet is unavailable. Sensors communicate
    with control panels on the same wireless network, for example, they may not send
    alarms outside the building, but they can alert people inside.


    Finally, gateways take care of various housekeeping tasks such as device registration,
    power management, and peer-to-peer communication between other devices on the
    network. In practice, the wireless communications for the IoT system are all bundled
    into the same network appliance as the gateway functionality.


    The trick is be able to put together a system where all the IoT devices use a
    single communication standard and a single type of gateway. Alternatively, multiprotocol
    gateways fill the need for mixed networks that still have the advantages of installing
    (and pay for) a single physical gateway. They also offer a degree of future-proofing
    that allows more product choices that span multiple types of networks.


    # WIRELESS WHIRLWIND


    One of the most head-spinning areas of IoT technology is wireless communication.
    The innovation has been prodigious in recent years, and there are now more choices
    than ever. In the security industry, we rely on several wireless protocols to
    connect things like cameras, intrusion sensors, and card readers. IoT devices
    use some of not only the same protocols but also new and different ones. The new
    families of protocols provide more features and more security than their predecessors.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# CHAPTER 10: IoT Technology and Standards


    To realize the full promise of secure IoT deployments, we need better protocols
    with better authentication and identification techniques for connected devices.
    My aim in the following discussion is not to catalog every single wireless protocol
    that might show up in the IoT space. Nor is it to compare and contrast them and
    make recommendations about which one might be best for application. That will
    change over time, and the winner will be determined as much by market forces as
    by technical merit (remember Betamax?). My goal is to identify some of the major
    contenders that matter to physical security that will be relevant going forward
    for at least a few cycles.


    Let''s start with two of the better-known wireless protocols that have been central
    to the success of home automation, Zigbee and Z-Wave. They are both mature, low-power
    mesh radio systems that work for sensors, door locks, and other devices that can
    run on batteries and require only infrequent (rather than continuous) data exchange.
    They are both deployed in both home and commercial settings, although Z-Wave tends
    to be seen as more of a home automation technology and Zigbee a more scalable
    industrial option.


    Zigbee is an open technology that has a strong commercial and industrial base
    from the start, primarily because it was designed by IEEE standards members who
    came from highly automated industries. The Zigbee Alliance has 400 members, which
    provides a lot of choices from competitors going down this path. Although it uses
    strong encryption, some vary from one manufacturer to another, and some are more
    readily hacked than others. Zigbee has shipped more chips than Z-Wave, has a good
    foothold in physical security, and probably will for many years. It supports large
    device networks like those found in factories and warehouses. It is expected to
    show strong growth and maintain substantial market share for the foreseeable future.


    Z-Wave is an once proprietary (but now public) protocol that has 60%-70% market
    share in home automation (which is, to be clear, noting other market segments).
    Nine in ten smart homes have a Z-Wave offering, with many product choices in each
    category. The chipsets for Z-Wave are available from only a single manufacturer
    (Sigma Designs), offering the advantage of all the products using being interoperable
    with the same gateways. The drawback is that this makes it a single-vendor solution
    at the chip level (although that industry dynamic is not necessarily debilitating,
    as the case of the Qualcomm-licensed chipsets have shown for years). The limitation
    of 232 devices per network is an obstacle for larger commercial installations,
    though.


    6LowPAN, one of the newer low-power wireless networks, is important to physical
    security for several reasons. First, it uses the same underlying radio'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'technology (IEEE 802.15.4) as ZigBee, which makes it familiar in terms of radio
    transmission characteristics like distance, interference, and penetration through
    walls. Unlike the other protocols covered so far, it is an IP standard and provides
    every device on the network an IPv6 address to be addressable on the Open Internet.
    Protocols that require gateways, on the other hand, can-assign IP addresses to
    the devices inside their networks.


    Bluetooth is familiar to most of us because of its prevalence in consumer products
    from cars to headphones to electric toothbrushes. Since the Bluetooth Smart (low
    energy) version was introduced in 2010, the standard has become attractive for
    IoT devices that require long-battery lifetimes. Bluetooth is also emerging as
    the dominant technology for mobile credential exchanges that use smartphones instead
    of a traditional access control card or fob. Bluetooth use is growing in other
    commercial security applications, such as sensor networks, doors locks, and readers.
    Its 90% penetration rate in smartphones guarantees it long life shelf for both
    personal and commercial systems.


    Wi-Fi is so common and well-known that I hesitate to explain it all. However,
    it is important and enduring standards for physical security systems and will
    be for a long time to come. Wi-Fi is fast and secure, but it is not a low-power
    network like many of the others we have addressed in this context. Wi-Fi provides
    system integrators, an IP connectivity option that does not require pulling cables.
    Commercially available products such as door controllers, readers, wireless locks,
    and network cameras all leverage this advantage. Security organizations and facility
    managers benefit from less disruptive installations, with the potential for cost
    savings due to reduced labor.


    So far, the wireless technologies we have discussed are short-range local area
    network solutions. LPWAN is a new class of area networks that provide low-cost,
    low-power connectivity over ranges similar to cellular technology (approximately
    10 miles from the nearest tower). There are currently multiple standards, both
    proprietary and open, which include LoRaWAN, Sigfox, NB-FI, and Weightless. Any
    of these networks can simplify the design of security systems by eliminating the
    need for any local network infrastructure. Sensors and actuators can operate directly
    on these wide area networks, this capability is especially useful for smart cities,
    campuses, and other environments where larger distances are a consideration.


    # THE STANDARDS BATTLEFIELD


    As with any early-stage technology, IoT is a battlefield of competing, overlapping,
    and occasionally complementary standards initiatives. Some of them'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'address very specific vertical market needs, while others attempt universal
    generality. The proceedings for some of them are conducted in full public view
    through standards organizations, while others are growing up inside caustic consortia
    where pay to play is the law of the land. Still, others are put forth by industry
    giants or preemptively distributed through open-source projects that encourage
    adoption among powerful communities.


    For the security industry, these standards rightly caution about adopting any
    new product categories that appear half-baked. We can''t afford to deploy security
    solutions still being debugged or subject to obsolescence within a handful of
    years. In terms of technology adoption cycles, this cautious attitude is a typical
    early majority posture. Most of industries cannot act as innovators or early adopters
    (except in specialized cases where a vendor can vet a complete solution and guarantee
    some measure of stability to their own ecosystem.


    How do we proceed?


    First, we need to accept the premise that in the absence of standards, nothing
    can be integrated or secured, except one device at a time. That''s neither scalable
    nor would leave every network unmanageable but defenseless as worst. Standards
    have benefits beyond basic interoperability. One of the most important is making
    devices conform to certain technical and behavioral patterns so that they can
    be treated as a class, not as individual instances. This is the core of making
    them usable and secure in any mass deployment.


    Second, we need to recognize that most standards for IoT devices will be developed
    outside the security industry. Most of the action is coming from large technology
    companies and consumer electronics manufacturers. This should be familiar, because
    it''s a case of history repeating itself. The security industry''s wholesale shift
    to IP technology, for example, represents a migration to mainstream standards
    that originated with the Internet Engineering Task Force (IETF). Similarly, the
    standards in every modern surveillance system originated from Moving Moving Pictures
    Expert Group (MPEG), a multi-industry consortium predominantly composed of experts
    from the entertainment industry. We can expect the same adoption of broader standards
    to be the mainly of the discussion in security circles.


    Finally, we need to understand that for IoT devices exist at many levels of the
    protocol stack and across many types of functional interactions among the components.
    There is no expectation that all IoT devices need to use a single standard, even
    at the most rudimentary level. IoT device capabilities and purposes are so widely
    divergent that there will need to be multiple standards for various industries
    and applications. A light bulb, a connected'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'toothbrush, and a security camera have very little in common and probably don''t
    need to interact with each other, at least directly. You certainly wouldn''t expect
    all of them to adhere to the same standards.


    # CURRENT STATE OF PLAY


    Dozens of organizations and consortia work in the field of IoT standards. They
    each have their own distinct mission and focus on different aspects of standardization
    to varying degrees. Some are in competition, and some are complementary. Some
    focus on local networking interoperability, for example, while others refine communication
    standards for wide area networks. Some focus on device identity and authentication,
    while others work toward the adoption of standardized metadata to create “platform
    of platforms.” Some focus on radio protocols, and others work toward the adoption
    of common semantics so that everything gets the same way every time.


    In short, the world of IoT has grown large—quickly. It is difficult to navigate
    and difficult to even know what''s relevant to your own interests. Comp matters
    whatever you know might be outdated by years from now. However, there have been
    some gains in areas that will have lasting impacts.


    Security organizations need not pay attention to all of the standards. Many lower-level
    standards that you never interact with directly. Many are bundled into products
    that don''t always manifest at the level of user experience. Some of them, however,
    will matter a great deal as your organization begins to leverage IoT.


    A number of the major IoT standards organizations and consortia have joined forces
    and begun toward common specifications, collectively recognizing the short-term
    pain of unification and harmonization is better than the ongoing chaos of fragmentation.
    The members of these groups are some of the most powerful holdnames in electronics,
    chip manufacturing, networking, and telecommunications, so they have the weight
    to make these standards successful.


    In a similar spirit of unification, some large technology companies have published
    or open-sourced their own proprietary frameworks. This is essentially the old
    IBM or Microsoft playbook: we’re big enough that we can create an ecosystem of
    our own with enough benefits that people will gladly play our game.


    Such propetary frameworks are not all bad when it comes to building consensus.
    Compared with the yearlong process it takes for groups of competing companies
    to develop technical standards from scratch, it can be a blessing for a single
    organization to hand down a fully realized vision to implement.'
