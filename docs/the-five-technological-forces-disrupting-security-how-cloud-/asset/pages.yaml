- pgno: 69
  md: '# Security Ecosystems


    In biology, an ecosystem includes organisms interacting with each other and their
    environment. Decades of great nature programming on TV (and many great biology
    teachers) have taught us to think of frogs and plants and waterways in terms of
    a whole. A technology ecosystem functions similarly: a collection of physical
    devices with software, the communications pathways that connect them, and the
    humans who, until now, provide the bulk of the interactions between them.


    Our mobile ecosystem for security applications contains all of these elements.
    The physical "species" in this microcosm include smartphones, tablets, and autonomous
    IoT devices that can interact with our mobile handsets. The software "organisms"
    are the host operating systems plus all of the apps that inhabit them. Originally,
    the "nervous system" just ran on voice channels to cell towers and the telephone
    network. Now, it includes cellular channels and Wi-Fi for their immediate vicinity.
    Soon, we will add to the diversity with low-power wide area networks (LPWANs)
    that provide low bandwidth over long distances with little power consumption.


    Any discussion of mobile security apps is a discussion about this ecosystem. Our
    security applications cohabit smartphones alongside undocumented apps bagged by
    their owners in the world. The radio environment is rife with opportunities for
    any device to hook up with any other—or dozens at a time—to unknown effect. In
    any complex system, the permutations are almost endless.


    On the plus side, apps like Google Authenticator can give us secure two-factor
    authentication at virtually no cost to us or our developers. Social networking
    apps provide communication and notification channels that would take a security
    organization to duplicate (if ever), even for a small community of stakeholders.
    And the ability of Bluetooth to connect directly to physical security provides
    immediacy and resiliency that can''t be duplicated by Internet-mediated connections.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# CHAPTER 5: Security Ecosystems


    On the flip side, many of the apps on mobile platforms present security challenges
    of their own. Some leak and reveal personal information about the owner of the
    smartphone and anyone or anything else the smartphone has touched. Some contain
    security vulnerabilities that allow malware to access data about financial systems,
    access control structures, or video feeds. The wildly Pokémon Go app, for example,
    had full access to the user''s Google account, a place where more and companies
    now keep their e-mail and use file storage.


    Pokémon could poke all kinds of holes in your security.


    # THE DESKTOP REINCARNATED


    Do you remember the dark ages before mobile? To look at our stock portfolio, to
    shop online, or just to check our e-mail, we had to sit at our desk staring at
    a full-size monitor using Internet Explorer. I can''t even imagine going back
    to that time. Many of the administrative applications for security systems still
    work that way. Happily, they are migrating by one to mobile. The transition pays
    security teams, business owners, and system integrators—the entire paybill of
    actors in the security ecosystem—greater latitude to perform their work from anywhere,
    anytime. As that happens, we mostly see the desktop reincarnated on our mobile
    devices.


    While administrative applications have become increasingly integrated, they usually
    align with the three main disciplines of electronic security: access control,
    video surveillance, and intrusion detection. In general, these applications provide
    a window into security data and the means to control different parts of the security
    ecosystem. An access control application, for example, give you the power to unlock
    a door remotely. A video surveillance application would show you live video, or
    perhaps let pan, tilt, and zoom over cameras to redirect their focus.


    The features first to be recreated on mobile platforms say a lot about types of
    data and control people consider most important. Personally, I find this a refreshing
    turn of events because it cuts through the bloat and brings us back to the fundamentals
    security.


    Take the classic activity log—a list of every event that has taken place within
    the purview of the user—still front and center in many security mobile apps. It
    has long served as an anchoring point for anyone logging into a security management
    system and continues, even in its mobile iteration. Activity logs resemble nothing
    so much as an undigested dump of raw data. They were never made for a good user
    experience, even with all the screen real estate of a desktop. On mobile platforms,
    they strain the abilities of small screens to the breaking'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Apps Have a Field Day 51


    point. It begs for a higher level of summarization of the kind that could perhaps
    be provided by a cloud back-end running big data tools that find and only meaningful
    activity.


    The ability to manage user populations—that is, to grant and revoke access permissions—also
    remains a core capability of most mobile apps. The data my company collects to
    improve application performance reveal that user management is one of the most
    frequent uses of security technology, comprising nearly 40% of all log-ins.


    Then, of course, we have viewing video surveillance via mobile. The severity of
    almost any alert—whether originating from the system or a call from a colleague
    or employee—can be investigated with a look at what''s happening on video. Do
    you really have a break-in? Or did someone work late and forget to disarm the
