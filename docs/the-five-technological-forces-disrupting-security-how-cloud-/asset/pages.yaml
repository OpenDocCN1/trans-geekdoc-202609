    bark at nearly audible sounds perfectly equipped them to act as one of the earliest
    motion detectors. Much later, modern electronic security produced these canine
    capabilities. Electronic sensors gave the security organization eyes and ears.
    All of these enhancements, whether biological or electronic, have been moving
    us in the direction of more than bark through better data.


    The common denominator across all IoT devices—and the reason they are transformational—is
    that they produce huge streams of data. A recent projection estimates that the
    size of the digital universe will double every 2 years and'
