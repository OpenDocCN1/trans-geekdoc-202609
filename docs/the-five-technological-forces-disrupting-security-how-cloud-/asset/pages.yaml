    People, if you didn''t get the memo, we''re all going to the cloud.


    # AN IoT STORY


    At the turn of the millennium, less than 3% of all Americans had broadband at
    home. In an environment of such patchwork connectivity, it was far from certain
    that homeowners understood the power of a smart appliance—or what would be called
    an Internet of things (IoT) device. It needed an always-on Internet connection
    and an always-up cloud service, both of which were the experience of the vast
    majority of consumers. It is difficult to imagine how a novel connected device
    was at the time, but they were so rare that there wasn''t an agreed upon category
    to describe them. The term IoT had just recently been coined in 1999, but no one
    had heard it, and it enjoyed none of the buzzword status that it has acquired.


    People were delighted by the early IoT technologies that seemed to inch us toward
    a future like The Jetsons. They were magical and dazzling. Less obvious'
  merge: -1
