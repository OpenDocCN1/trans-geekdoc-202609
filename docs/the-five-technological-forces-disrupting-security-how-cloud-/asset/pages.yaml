    # Time and Frequency Analysis


    Time and frequency are inverse twins of one another, and each have a story to
    tell. One who tells the better story depends on the type of data and what we need
    to know. They are both relevant to finding anomalies in big data sets.


    In the time domain, events are viewed as a linear sequence or series. This point
    of view highlights certain kinds of relationships, especially those causal- is
    of interest and the order of events is key to understanding them. It may also
    highlight trends in the data and look for mathematical relationships that point
    to an underlying case. Trends may be caused by either a deterministic or statistical
    process that causes changes to the observable variables. Time-based analytics
    may also look for specific sequences of events and search for a signature or correlation
    that is worrisome or alarming based on prior experience. Finding these event sequences
    becomes more challenging the larger and faster the data stream, as the cyber security
    sector has learned all too well.


    Now, let''s think about frequency or events that repeat at particular intervals
    of time. Frequency patterns are difficult to view along a time line. In any large
    data set, they are mixed in with many other events, and it is'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'challenging to discern periodic patterns. But if time sequences are inverted
    and viewed as frequencies, recurring events stand out. It''s like X-ray vision
    for time.


    When you follow this approach of looking at frequency rather time, an entirely
    different set of patterns emerges. For example, it may be completely normal for
    something to happen four times an hour but not 20. Now, imagine having to comb
    through sequential data to understand whether this frequency limit was being observed
    or not. This is the equivalent of being a card counter in Las Vegas. If you instead
    imagine analytics provided a display of event frequency, all you would have to
    look at that number and see if it was over the limit. That''s looking at things
    in the frequency domain.


    Another type of analysis that occurs in the frequency domain is for cyclic events
    or cyclic norms. Daily cycles of events would be an example. In many domains from
    telecommunications to Internet usage to road traffic, there are cyclic patterns
    that repeat themselves day in and day out. Once these patterns are known, we can
    compare current real-time values with historical cycles and know whether things
    are normal or not.'
