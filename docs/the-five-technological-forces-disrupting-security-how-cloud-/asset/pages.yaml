- pgno: 203
  md: '# Who Are You?


    Your answer to that question depends a great deal on who is asking and why. When
    Pete Townshend famously asked it of a police officer in Soho on a dark night in
    the early 1970s, it was the question of an incoherent man trying to get his bearings.
    It was also the birth of one of the greatest rock songs of that era.


    When we ask it in the security field, we expect an answer that links back to a
    trusted identity source, like a passport, an employee ID, or perhaps nothing more
    than a referral from another person we know. Or at least that''s how things worked.


    Trust in the document confers trust on the person bearing it. We need this information
    to decide whether someone will be allowed into our property, allowed to become
    an employee, or allowed to control data or physical resources that affect the
    security of others in our charge. In this sense, identity is fundamental to security,
    and the way people identify themselves determines how we will interact with them
    going forward.


    We citizens of the digital world have lacked an agreed way to uniquely assert
    our identities, but it''s not for trying. We''ve actually come up with far many
    ways. The problem is that each of them is contained within the identity field
    of wherever we happen to create them: at the office, inside e-commerce sites,
    watching media outlets, in the pursuit of online dating, and thousands of other
    Internet destinations. Each of these is a classic information silo. When we go
    to the gym, we use an identity from our employer. When we use an auto-managed
    garage, we have another identity based on the fob assigned to our car. In each
    of these cases, instead of identifying ourselves as the same person each time,
    we present digital versions, with none having to do with the others.


    You might be thinking that your name is your identity, but it''s not. In each
    of the day-to-day scenarios described above, the thing (or token) that identifies
    you is actually different. Your gym membership has'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# CHAPTER 16: Who Are You?


    number, and that''s your identity as far as the gym''s software is concerned.
    Your access card at your office uses a different number, and that''s your identity
    as far as your access control system is concerned. Your car''s transponder of
    license plate has its own number, and that''s your identity to the garage owner.
    Your name is not necessarily unique, and uniqueness is what these systems need.
    That''s why each institution issues a token to each person who uses their facilities,
    making our key chains heavier with fobs, our wallets with plastic, and—soon—our
    smartphones more cluttered with apps.


    # WHAT''S IN A TOKEN?


    Physical identity documents face a challenge in the digital era. How do you use
    them to reliably verify someone''s identity online? That''s why theft is such
    a problem. In the physical world, physical documents serve us well most of the
    time. We can examine them and have a pretty good idea of whether they are real
    or forged. We can also be fairly assured that there is only one copy of each such
    credential, because the issuers do a pretty good job of following a one-person,
    one-document protocol. In the digital world, these start to fall apart. All everyone
    needs the data from your identity documentation, not the documents themselves,
    to assume your identity online.


    The same is also true of the digital credentials we commonly use, log-in and password.
    It is no secret that passwords are fundamentally broken. If you do not notice
    soon enough, they can compromise your online accounts, and if you don not they
    can compromise your cash, your reputation, and your place of business. With security
    systems moving irreversibly to the cloud and a state of constant connection, the
    industry has joined the rest of the online world and begun to take seriously the
    issues of online identity and authentication. But it''s a journey of a thousand
    miles, and we''ve just taken the first steps.


    Never before in physical security have the issues of identity and authentication
    been intertwined as they are now. For many years, our internal software systems
    were on landlocked corporate networks with no connection to other networks. The
    ability to log was limited by access to the network and, more likely than not,
    the need to have a proprietary client installed on your computer. Sure, we all
    worried about the possibility of rogue employees and the tiny cracks in our armor
    posed by dial-up modems, but those threats were minor in comparison with the authentication
    challenge before us now.


    Access cards and PIN codes have been entrusted for authentication at the perimeter
    of our security systems where we manage tenants and employees, access to buildings,
    and other valuable corporate assets. In this world, the access control system
    is de facto identity system and a closed one at that. The possession of a plastic
    card was, in practice, treated as an adequate authentication method for'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'literally opening the doors to trillions of dollars in corporate assets. That''s
    all changing, particularly as employees need to be authenticated across many contexts,
    including buildings, networks, in-house software systems, and even public cloud
    resources.


    These changes are driving us away plastic cards and into the ethereal world of
    digital credentials. The industry has had a taste of this with smart cards embedding
    chips and cryptography that provide much greater assurance than simple proximity.
    However, challenged by an overwhelming adoption outside specialized verticals
    like financial services and health care, they are being leapfrogged by mobile
    credentials on smartphones and wearables.


    # SOCIAL IS THE NEW ME


    Social identities have become a growing part of how we identify ourselves on the
    Internet. It''s almost unavoidable. As I am writing on a document in Google Docs,
    for example, I am logged in with the same Google+ identity that I use across other
    websites and services that have nothing to do Google. These other online services
    have simply chosen to use Google as an identity provider for the sake of convenience,
    security, and improved user experience. In many of these applications, I could
    just as well use my Facebook identity or my LinkedIn or a one-off log-in based
    on my favorite e-mail account.


    All of these examples are commonly known as social sign-on—using your identity
    from a social network provider or your identity on an unrelated website. The social
    network takes care of authenticating when you first log in and then lets secondary
    sites know that you are who you say you are and that you''ve authorized access
    to resources on that secondary site.


    Part of the reason they have gained acceptance among users is that our social
    network identities are at least tenuously connected to who we are in real life.
    We begin to form a web of connections with our real Facebook pages, our real'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Apple IDs, our real Google +playlists on YouTube, and our real e-mail addresses
    that tie our online lives together. All of these connections back to the real
    world are verifiable to one degree or another. That''s why it''s usually easy
    to spot fake Facebook pages or fake reviewers or anything that doesn''t connect
    back to what we can sense, is literally, a full-blooded human being at least of
    the time.


    For those who are still a bit uneasy about using social networks for serious business,
    there are pure-play identity providers that don''t come with the bare-all baggage
    of the most popular social platforms. OpenID, for example, is a stand-alone identity
    provider that uses many of the behind-the-scenes identity federation techniques
    as the social networks. Arcane protocols like "OAuth" and "SAML." and "LDAP" (of
    which mere later) make possible the convenience and security we derive from making
    the lake to a third-party identity management platforms.


    The billions of us who use the Internet have implicitly appointed this small handful
    of companies to be custodians of a significant part of our digital identities.
    Anyone who has created a new account at a website will be familiar with the option
    to use one''s own e-mail address or choose to leverage an existing identity at
    one of the providers just listed. The attraction of using, say, your Facebook
    ID is that you avoid creating another log-in and password combination that you
    will soon lose and/or forget. By reusing an existing identity from a social network,
    you can also now weave a single identity across many services provided on many
    websites and enable data sharing and transactions between them.


    In this respect, the public has already voted with its keyboards and thumbs about
    who will be its favorite identity providers. Facebook lately has the largest user
    base adopting their credentials to register and log into third-party websites.
    Google has been pushing their Google + credentials for the same purpose. We''re
    even seeing B2B companies like Salesforce.com acting as identity providers for
    enterprise customers.


    # THE HOLY GRAIL OF UNIVERSAL IDENTITY


    Let''s return to the problem of centralized or national identity programs. The
    basic problem is that they are often proposed and operated by institutions that
    people don''t trust—at least not with their entire identities. That level of trust
    would be a big ask, to be sure, but trust is the central principle in identity
    management and secure digital transactions.


    Burecrats, social planners, computer programmers, and dictators alike all imagine
    a more perfect future in which every human being is identified by a'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'single, unique “handle” centrally issued and managed. Civil libertarians have
    worried about the same eventuality, characterizing it more as a “mark of the beast”
    than a coolly efficient management technique. Against this backdrop, the history
    of a single universal identifier is a tug-of-war between the will to organize
    and the we to maintain privacy.


    In the United States, social security cards famously brandish the words “not for
    identification.” First issued in the wake of the Social Security Act of 1935,
    the cards were originally intended as account numbers for tracking contributions
    and benefits due under the new legislation. Some seem to be for many other purposes
    and over the years they have become a de facto universal ID for establishing banks
    accounts, credit cards, health insurance, and many others unrelated to social
    security. This widespread use has come at a price, giving identity thieves a single
    key to unlock access to your financial persona and health records, among other
    things.


    Oracle CEO Larry Ellison was widely derided in the early 2000s for his role in
    advocating a national ID card program that would have required all Americans to
    carry a new form of universal identification that included a photograph and biometric
    identifier. Regarded as a transparent attempt to insert Oracle products into the
    center of virtually every financial, commercial, and legal transaction, the initiative
    failed because advocates of stripes that would erode fundamental freedoms and
    paved the path for widespread surveillance of innocent citizens. Mind you, this
    was before Edward Snowden revealed the full ramifications of the Patriot Act and
    the extensive use of the NSA’s PRISM system, which demonstrated that our identities
    are easily reconstructed from many digital breadcrumbs.


    In 2011, the National Institute of Science and Technology (NIST) launched a program
    known as NSTIC, the National Strategy for Trusted Identities in Cyberspace, to
    improve privacy, security, and convenience of online transactions. The creators
    of the program envisioned an identity ecosystem that would provide better authentication
    for participating individuals and businesses interacting with each other. Such
    an ecosystem would use powerful, verifiable digital credentials commonly used
    under the prevailing log-in plus password word model that (unfortunately) governs
    e-commerce and online exchanges. The NIST program ultimately awarded $9 million
    to fund pilot programs that demonstrated these principles. As with most initiatives,
    the NIST program faced criticism from privacy watchdog. This is particularly the
    case with federal programs, which already heightened sensitivities against governmental
    surveillance. The timing of the Snowden leaks in 2013 could not have helped


    The US identity initiatives were certainly not the first or only efforts by national
    governments to establish such centralized identity platforms. The modern list'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'alone includes Napoleon, the Ottoman Empire, the Vichy government, the United
    Kingdom, Germany, and Hong Kong. The world''s largest national identity program,
    India''s Unique Identification Authority of India (UIDAI) that was established
    in 2009, enrolled over one billion people in its Aadhaar database. Notwithstanding
    many of the same privacy concerns as other national ID programs, Aadhaar has nevertheless
    been a boon to providing services to the rural poor and as an ecosystem for innovation.


    Despite the successes of such programs, the digital privacy watch group Electronic
    Frontier Foundation is blunt in its assessment of the impact and true purpose
    of national ID cards in any form: "national ID cards and the databases behind
    them comprise the cornerstone of government surveillance systems that creates
    risks to privacy and anonymity.\*


    I believe that this sense of unease will persist and ultimately thwart the establishment
    of universal identity programs, unless they are voluntary and user controlled,
    and that''s my quest for greater universality in smart apps brought me to the
    concept of social access management.\*


    # IDENTITY IS THE NEW PERIMETER


    This has become a catchphrase in both the cyber and physical security worlds.
    What this means is that the edges of our properties and networks are no longer
    clearly demarcated. They are porous; what passes through them depend on who or
    what it is. We used to look at solid barriers—doors, walls, and borders or their
    digital equivalents, VPNs, firewalls, and gateways—we now look at the rules, credentials,
    and procedures required to go from the unprotected to the (theoretically) protected.


    This whole model presents that the concepts of outside and inside still make sense.
    If you have an enterprise that is scattered around the city, the country or the
    planet, where is your perimeter? What is inside? If you have a corporate network
    composed of a dozen local office networks that connect to each other through the
    public Internet, where is your perimeter? If you have mission security electronics
    on the corporate network where your employees daily defend against phishing attacks,
    where is your perimeter? If your employees use cell phones and web APIs to open
    doors in your facilities, where is your perimeter?


    These questions are not far off from asking "where''s the edge of the universe?"
    The paradoxical answer is that it''s always expanding; there is no real edge.
    So, it


    > *https://www.eff.org/issues/national-ids.


    > *US Patent No. 8,881,252, November 4, 2014, Van Till et al.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'is with our physical and network frontiers. Every new employee, visitor, new

    smartphone, and tablet changes our perimeters because of their connections

    with other places and things.


    The fluidity of both real and virtual borders poses challenges for everyone in
    the

    security value chain. Software and device makers cannot assume that their\wares
    will be deployed in a safe and contained area and protected from

    t constant asserts of the open Internet. Integrators cannot assume that their

    work is done where their client''s property ends, cordoned off from neighboring

    etworks and vulnerabilities. CISOs cannot assume that their concerns end

    when actors exit their facilities, locked out by physical doors but still able

    to walk cyber pathways back to the core of their operations.


    These facts underscore the need for change. Thinking of identity as the new

    perimeter turns the whole question of inside versus outside well, inside out.

    Instead of looking for a definitive border, we look instead to what limits move-

    er or access of individuals. For each of us, the question then becomes “what

    are the places, real or virtual, that my identity allows me to enter?” Which

    objects can I interact with? What are my personal boundaries? That’s the-

    sersonal perimeter that each of us experiences, sometimes no more invisible than
    a

    pantomime’s wall sketched in the air—but very real nonetheless.


    Identity as a perimeter would be simple if we all had just one identity. But we

    d’t, and there are many who fear that any centralized keeper of that identity

    would wield undue power. Are we already in the best of all possible worlds?'
