- pgno: 147
  md: '# The New Playing Field


    The $200 billion global security manufacturing and service industry changes at
    a glacial pace. In many segments, the established players have been accustomed
    to keeping the playing field to themselves or at least sharing it with only a
    small coterie of familiar competitors. Barriers to entry were higher than in many
    other industries, and new entrants have no choice but to play along with the existing
    reseller and distribution models—both well-worn silk roads negotiated with a Sherpa
    who knew the pitfalls.


    The rise of IoT and the renaissance of hardware innovation are heating things
    up a bit—call it a taste of global warming that gets the glaciers tad more quickly.
    Companies never before on the industry radar now show up at major trade shows.
    Customers want to know whether their old-line security platforms integrate with
    these newcomers'' products. Search results that once turned up, the only usual
    show new names at the title.


    IoT is making its own waves, to be sure, but it is also magnifying the amplitude
    of those introduced by the cloud. In the physics of waves mechanics, we can make
    this constructive interference. One waveform is superimposed on another, and if
    they share resonant frequencies, they amplify each other. Electronic security
    is one of the primary places where cloud and IoT have synergy.


    IoT also resonates with the cloud in a very general sense because connected devices
    aren’t much good if no one is listening—a tree falling in the woods unheard—and
    the cloud provide an audience of applications and users. Together, they’re shining
    a light on previous generations of technology to make them look plain outdated.


    Apologies for aging technology were in full evidence at a recent conference where
    I heard someone taking great pains to defend the notion that on-premise servers
    will always have a place in security: “the cloud will not displace them!” He compared
    the preference for on-premise computing to hotel guests feeling safer with mechanical
    latches on their rooms, even though they know that the electronic lock is secured.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# CHAPTER 11: The New Playing Field


    Whatever psychological truths this analogy may hold, its representation of technology
    (i.e., mechanical latches) makes the client-server literally the exact opposite
    of the intended point. The smart locks on hotel doors are programmable control
    devices that modernized the hospitality industry many years ago. With the recent
    introduction of phone-based keys (aka mobile credentials), they have only become
    smarter, more convenient, and data-rich. The metal latch, by contrast, is as dumb
    as it ever was.


    As the saying goes, you can''t fix stupid.


    # WHAT''S OLD IS NEW—AT LEAST FOR STARTUPS


    Hardware companies—by which I mean connected device companies produce both a widget
    and the software web services to run it—are cool again. They are back in vogue
    and have enjoyed an investment resurgence since became a marketable reality. Many
    new investments are in the automation space, and many of those are related to
    physical security. This level of new, outside interest is different, and I am
    not sure the industry is used to it (yet).


    The expansion of the connected hardware universe is pushing the boundaries of
    the security market along with it. Higher adoption rates are the availability
    of newer and better—and, frankly, more interesting-types of connected hardware
    that provide convenience and peace of mind in a more attractive package. Ease
    of installation drives high growth rates in the DIY sector of the residential
    market in particular, and it''s spreading into the low end of the SMB market.


    This point was explained to me sometime around 2009 and has only become more poignant
    since. My company had just introduced a cloud-based video surveillance service,
    and we were extrolling its benefits to one of our security integrator customers.
    I was pressing the virtue of our upfront installation cost due to the elimination
    of servers and setup labor. "Customers will love it," I said.


    After letting me go on for a while, one of the executives said, "That''s great,
    Steve, but we''re not competing against traditional video record recorders. We''re
    competing against Costco."


    What he meant was that many buyers were willing to purchase cheap DIY systems
    off the shelf and install them on their. In the nearly eight years since then,
    the trip to Costco has been replaced with a trip to the Internet, and the tangle
    of wires and cheap cameras has been replaced with sleek new products like Dropcam.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Connected hardware innovation and cloud computing are producing this kind of
    constructive interference in many areas, most conscientiously in residential.
    The new companies feel nothing like the companies of old.


    I won''t forget the cheesy advertisements from a 2014 security start-up that lampooned
    so-called cavalry providers with their blue uniforms and hexagonal signs. The
    start-up boasted an attractive set of consumer-friendly security modules—IoT devices—that
    can be self-installed by homeowners in a matter of minutes. They claimed "ridiculously
    easy" setup that required no tools, no staying home from work for an appointment,
    and no cavenoking holes in the walls. This ease of use is the power of IoT devices,
    using low-power chips, low-power wireless, and long-life batteries, all wrapped
    in contemporary industrial design that appeals to millennial sensibilities.


    All of this is a radical departure from the traditional pitch for home security.
    Traditional security providers aren''t known for trying to appeal to hipster or
    DIY sensibilities. The time-tested message has been exactly the opposite: "Dear
    homeowner, don''t worry your pretty little home. This is too hard for you to do
    on your own." That has been true enough for the entire history of physical security.


    Up until now.


    Innovation of this sort isn''t confined to the residential customer. Many IoT
    and cloud-based services appeal to the small and medium business market, which
    represents approximately 80% of the business addresses in the United States, according
    to the Census Bureau. While large enterprises often get more than their fair share
    of the attention in the security press, small business is the largest demographic
    by number of locations. That''s why it has gained the attention of investors.
    Many small business owners will carry the lessons they''ve learned from their
    DIY home systems, which will further fuel this part of the IoT-based security
    market.


    The new generation of IoT-based products is an obvious break with the past, and
    that''s only scratching the surface of what makes them so different. What''s most
    remarkable is the interaction capability they provide with other cloud services
    and families of IoT devices. We scan the websites of new entrants, and it''s clear
    that they interact with a long list of web services and devices (nowhere in evidence
    against traditional providers).


    The service that stands out in this regard is IFTTT, a cloud-based service whose
    name stands for if this then, a to the most fundamental conditional logic construct
    in all of computer programming. IFTTT has integrated with hundreds of online services
    and products, ranging from social networks to photo sharing to smart home, from
    security systems and mobile phone'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# CHAPTER 11: The New Playing Field


    operating systems. Its users can form relationships among these services by creating
    or reusing simple applets with zero programming skills.


    For example, I can have IFTTT automatically upload security video clips to Google
    Drive for long-term archiving and distribution. They could simultaneously be mailed
    to three colleagues, tweeted, posted to Instagram, and cause my building to go
    into a lockdown state. The net effect of all these integrations is that one of
    the participating services can leverage the benefits of extensive product integrations
    without having to do each one directly with all the other service providers. In
    this regard, IFTTT acts like a giant hub with value-added logic, connecting all
    the partners. The network effect adds more value to all because each new partner
    in the ecosystem adds value to all the others.


    Contrast with the painstaking partner-by-partner integration prevailing among
    commercial security systems. It is a slow and arduous process that limits the
    number of options customers have for combining best-of-breed products. From an
    algorithmic point of view, the number of integrations N products grows in proportion
    to N^2 when every partner must integrate directly with every other. In contrast,
    a hub-and-spoke topology is completely linear: N products require N integrations.
    In a market where security organizations might wish to choose between hundreds
    and thousands of products, the difference between N and N^2 is a huge cost factor
    for all concerned.


    That''s the power of IoT plus cloud.


    # LARGE TECH & TELECOM EYE PHYSICAL SECURITY—AGAIN


    The combination of IoT and cloud—with perhaps a bit of DIY on the side—lower some
    of the physical challenges of the security business while keeping its attractive
    business model intact. As a result, many large and communication companies and
    start-ups and their VC investors are taking a renewed interest in products and
    services that address physical security problems.


    The business model attracting these newcomers is called recurring revenue. It
    began as a staple of alarm companies and tracked with the value proposition of
    ongoing monitoring services. It spread to additional services like access control
    and video surveillance as SaaS brought the same ongoing value proposition to new
    areas of the security equation. System integration was still tough, with lots
    of unknowns, competition, staff turnover, margin compression, and challenging
    installation problems, but it was all worth it to establish'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'ongoing relationship with customers. The level of difficulty to get there,
    how-ever, is a barrier to entry to businesses that are not accustomed to the messy
    realities of the physical world. Security is not for the faint of heart. With
    some of these barriers lowering, there is new outside interest.


    Silicon Valley comes to mind immediately. Large technology companies are creating
    or investing in security, access management, and video surveillance products for
    the residential and SMB markets. Google''s acquisition of Dropcam (by way of Nest)
    is a prominent example. Apple is pushing its Home-Kit architecture that promises
    to stitch together diversity and automation products and unify the user experience.
    Most of the early marketing around these initiatives is consumer-oriented; it''s
    not a huge to see them moving into the SMB space. After all, small business owners
    are as much consumers at work as they are at home. The technology solutions they
    choose at the office are heavily influenced by the technology they use at home.


    Over the years, there has been an on-again, off-again relationship between the
    security industry and large telcos and cable companies, at least in the residential
    market. The logic was fairly simple. When intrusion systems were connected by
    plain old telephone service (POTS), the tel thought it made sense to expand into
    alarm services because they already provided the communication link and already
    had the customer relationship. Cable companies followed this same logic after
    they became Internet service providers (ISPs). They provided broadband into the
    home and saw alarm services as a natural expansion area because they already had
    the communication link and the all-important customer-relationship.


    The security industry has eased these incursions with a combination of wariness
    and disdain.


    Circumpection is warranted because many of the tech companies are too large and
    influential to ignore. Apple—a computer company—would be able to make a phone
    and compete with device makers like Motorola and Nokia. I guess we know how that
    turned out. By the same token, it''s not crazy to think that someone outside the
    industry could make such a home automation and security system that they could
    take food off the table of many existing suppliers. thermostat guys probably didn''t
    see themselves being disrupted until Nest showed up.


    Cable companies have been floating home security solutions for at least a decade,
    and more recently, crossing over with small business packages. With cloud becoming
    more affordable and popular, the cable companies are in a privileged position,
    at least with their own customer base, because they own the broadband circuits
    and have a natural cost advantage over anyone else'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# CHAPTER 11: The New Playing Field


    offering similar services. With net neutrality protections eroding, they could
    even prioritize their own traffic and disadvantage others.


    On the other hand, despite the call for some degree of wariness, it''s not clear
    that any of these companies has neither the stomach for the labor and logistic
    complexities of installing commercial security equipment nor the appetite for
    providing accredited monitoring services. The installing worked surveillance cameras
    looks close to other network installation services that customers can either DIY
    or use IT contractors. Access control is another story altogether. The mechanical
    challenges and specialty skills required for locksmith and related work on doors
    defy any sort of mass-market, cookie-cutter approach to this business. The new
    generation of wireless locks has improved this situation but is far from universal.


    In any case, the impetus of IoT is to push security products closer to the consumer
    model that works for smartphones, cable models, and other consumer electronics.


    # CONSUMERIZATION AND IoT


    These trends add up to an increasing consumerization of security that follows
    the consumerization of IT taking place over the past decade (or more). As discussed
    in the opening chapter, consumerization is a process whereby technologies originally
    introduced as consumer products subsequently transition into professional use.
    Employees often drive this when they acquire new technologies in their personal
    lives and bring them into the workplace. Personal smart phones, tablets, and employee-owned
    laptops serve as several of the most common examples, frequently lumped together
    as the bring-your-own-device (BYOD) movement.


    Consumerization already had profound impacts on enterprise IT, leading over 80%
    of organizations to make changes to accommodate the new paradigm. Unplanned data
    retention on personal devices and requirement for mobile device management (MDM)
    services are two highly visible side effects. The coexistence of both personal
    and professional data on a single device makes for strange bedfellows, but the
    cost and convenience factors are too compelling for most businesses to ignore.
    These factors will be equally compelling to buyers in the physical security market.


    For both consumer and commercial contexts, consumerization will be driven not
    only by the availability of mobile platforms but also more powerfully by the confluence
    of cloud, mobility, and IoT. The first outcome will be accelerated displacement
    of older technologies that do not offer the same convenience and ease of use found
    in consumer products. As reported by the same ID'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'study, as early as March 2014, 46% of enterprises were already expecting to
    use IoT devices to make business decisions.¹ These solutions will be fully cloud-based
    and mobile, making any earlier technology solutions that do not look old, tired,
    and for replacement.


    A second major effect of consumerization is to raise the bar for user experience
    (UX) expectations. Most of us now take for granted the UX improvements of the
    web browsers that replaced clunky and idiosyncratic desktop clients and the even
    older "green screen" terminals hanging off mainframes. However, until the advent
    of IoT, this improvement largely stopped changing the way we interact with physical
    things. There were a few products that had fought through the configuration process
    better than others. But under the old paradigm, most embedded electronic devices
    had horrible manual interfaces and physical switches and jumpers that needed to
    be configured with pins and twezers for proper operation. Consider the difference
    between programming even the best modern thermostat on its own interface versus
    doing that same task via a web app for a connected thermostat.


    As recently as the early 2010s, audiovisual and home automation systems, for example,
    were still complex, available only through professional channels, required trained
    installers to make them work. A consumerization home theater system could easily
    cost much as $10,000 for parts and labor, not including the AV equipment itself.
    Today, in the consumerization marketplace, the same degree of control can be purchased
    for a little over $300 and 15 minutes of your time configuring the system with
    a cloud application.


    Similarly, in the residential space, the cost of a fully equipped, preconsumerized
    home security system was typically upward by $3000 by the time parts and labor
    were factored in (not including professional monitoring fees). Today, in the consumerization
    marketplace, there are many products that offer nearly equivalent or good enough
    alternatives and are installed by the consumer or business owner.


    The one facet of both residential and commercial space consumerization has not
    been able to address is the question of 24/7 professional monitoring. Central
    alarm stations provide a vital link between electronic security systems, police
    dispatch, and other forms of alarm escalation. It’s one thing to get a message
    that your house is being broken into while you are away from home. You can call
    the police and have them dispatched to your home. It is quite another thing to
    get a text message


