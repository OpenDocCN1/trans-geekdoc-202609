- pgno: 13
  md: '# About the Author


    Steve Van Till is the cofounder, president, and CEO of Brivo Systems, pioneering
    cloud services provider of access control, video surveillance, mobile, and identity
    solutions delivered as a SaaS offering. He also served since 2011 as chairman
    of the Standards Committee of the Security Industry Association. He is a frequent
    author and speaker for numerous security publications and forums and the inventor
    of numerous patents in the field of physical security. In 2009, Steve was honored
    by Security Magazine as one of "the top 25 most influential people in the security
    industry."


    Mr. Van Till was previously Director of Internet consulting for Sapient Corporation,
    where he led client strategy engagements for the first wave of the dot-com era.
    At the health-care informatics company HCIA, Steve was responsible for Internet
    strategy for data analytics services. Steve also has over 10 years'' experience
    in wireless communications as Vice President of software development at GeoStar
    and as Director of Systems Engineering at Communications Satellite Corporation
    (Comsat).


    Steve lives in Fulton, Maryland, with his wife, Robin.'
