- pgno: 127
  md: '# IoT Technology and Standards


    IoT and industrial automation devices use hundreds of communication protocols,
    security, and interoperability standards. This diversity of technologies presents
    a wealth of choices and a tangle of interoperability issues. We''d all like to
    see plug-and-play simplicity, but when was the last time that happened?


    Standards can be a very dry topic. You might wonder which ones matter and why
    you should care about them. I''ll be the first to say that you don''t need to
    keep track all of them. Like technology itself, standards are layered on top of
    each other. There are low-level standards for things like electric impulses or
    radio waves and high-level standards for data formats and handshakes between computer
    systems. The higher standards often make unnecessary to understand the lower layers,
    or they work with multiple versions of lower layers (which amounts to the same
    thing).


    Your role in security will determine which types of standards matter to you. If
    you are an engineer for a security product company, then lower layer standards
    will be important to make your product work at all. If you are a product manager,
    you will be interested in what types of standards are being adopted-where in the
    industry and what that means for your product road map. If you are an integrator,
    you will want to make sure that the products your company has chosen represent
    all work with one another. And if you are an end user in a security organization,
    you will want to know enough about standards to make your integrations and manufacturers
    have a standards strategy that gives you a reasonable chance of future-proofing
    the choices you make today.


    Our goal is to sort some of the standards that matter at the highest level for
    security organizations, with at least a glimpse into the next layer. We could
    have covered the topic of standards in almost any section of this book, but they
    appear to come together and be most relevant in the context of IoT. Cloud standards
    are important, but cloud systems are easy to reprogram as the word changes around
    them and can mostly be done with little customer impact. Mobile standards are
    also important, but they are already well down to a handful of choices by the
    carriers and phone manufacturers. In IoT,'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# CHAPTER 10: IoT Technology and Standards


    however, we find ourselves in the familiar territory of large population''s hardware
    devices geographically distributed and difficult to change out if we make poor
    standards choices early in the game. IoT standards also depend on cloud, mobile,
    and cyber standards, and so they pull a lot of threads all in one place. Allow
    me to highlight the aspects of emerging standards important to decision-makers
    as this new market goes through its burn-in period.


    Plug-and-play simplicity requires agreements about standards, and standards can
    only exist where there are common visions of how systems be put together—in short,
    their architecture. Standards have been an essential part of building the modern
    world, from bridges and skyscrapers to telecommunications and electric grids.
    They require agreement about how the pieces fit together.


    The first order of business is to understand what those pieces are—which technologies
    drive or enable the rise of IoT. Much of it will prove familiar to anyone versed
