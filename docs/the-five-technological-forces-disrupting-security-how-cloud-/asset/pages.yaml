- pgno: 32
  md: '# 12 CHAPTER 1: From Packages to People


    Chasm.⁴ It has become so much a part of how we look at the evolution of technology
    that many will recognize the language—early adopter, early majority, late majority,
    and laggard—without even knowing where these terms originated.


    As a rule, the physical security industry falls somewhere around the “late majority”
    in this framework. As an illustration, I cite the state of industry industry in
    the early 2000s, just as I was getting to know this market. There was a debate
    raging whether Internet technology could be safe and reliable enough for security
    applications. People actually took up the “con” side of this argument—in print—and
    predicted that fat serial cables would be routed forever because Internet Protocol
    (IP) was not trustworthy.³ Fifteen years later, with the whole world using the
    Internet for everything, we can safely say that the industry got the memo and
    shifted to technology that is now merely 30 years old.


    How has the industry afforded the luxury of being a late adopter of these-changing
    innovations? First, the market dynamics are somewhat sheltered by the way that
    end users consume these products. Small and medium businesses—the largest single
    market segment—purchase infrequently, know little about the brands and features,
    and therefore ever exert pressure on the channel to change the ways things have
    always been done. Myriad requirements across thousands of overlapping jurisdictions
    make it challenging to introduce new products that are substantially outside the
    envelope of what went before. And, finally, there is a natural conservatism that
    justifiably shies away from the perils of the bleeding edge.


    A recurring theme we will see in this framework is while the physical industry
    is usually a late adopter of new technology, it always catches up in the end.


    How will the sum of these forces affect the future of the physical industry over
    the course of the next 5 years? Many of these forces amplify one another, and
    the sum of the parts makes the current transformations compelling. We will see
    the biggest shift toward cloud-based services that incorporate all four other
    forces. In particular, this will shift the market away from those unable to make
    the leap and in favor of those more agile. The sum of these technologies could
    also be described as not only exhibiting a consumerization of commercial security,
    a trend that will benefit the industry by providing better tools, but also displacing
    many familiar practices.


    Let’s go back to the adoption of Internet Protocol (IP) communication technology.
    When I first entered security in 2001, IT had been using IP networks since


