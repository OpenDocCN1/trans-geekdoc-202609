- pgno: 215
  md: '# NOT YOUR KID''S SOCIAL MEDIA


    The use of social networks Facebook has made security about people, rather the
    building they happen to occupy. We''ve seen the same insight in innovation from
    traditional providers like ADT; Canopy service has reoriented security around
    personal mobile devices. All these innovations share the same obvious-in-hindsight
    principle: security is about people, not places.


    The difference is that a billion people already use Facebook, which dwarfs the
    subscriber base of every monitoring company. This is not to suggest that the services
    are comparable. They do, however, have an overlap, and such overlaps are often
    the first sign of disruption. If we project forward and imagine a world where
    Facebook becomes the preferred medium for sharing security information, what does
    that do to the rest of the industry?


    Given the compelling case for harnessing this power, why haven''t we seen more
    use of social networks already within our industry? Social networks have become
    an essential part of many other spheres of human activity, but not security. As
    an industry, we do not regard social networks as a serious tool for anything but
    marketing. Many cites concerns about privacy, public exposure, and now fake news
    as reasons they cannot be trusted for the weighty business of security management.
    The fact is that social networks are where people increasingly live their digital
    lives. If we want to communicate with the masses—a fundamental principle of effective
    security strategy—then we need to reach where they live: in their own neighborhoods.


    Slack is a collaboration tool that has many characteristics of a more or less
    closed social network for teams. It is best known for promoting collaboration
    among software developers, and anyone working on projects together. It has quickly
    displaced many other internal corporate communications tools like email and instant
    messaging because it provides both community and selectivity over topics you want
    to be involved in. With teams who use Slack, it has become a 24/7 window onto
    their world.


    When Slack began using my company''s cloud-based access control application, they
    immediately connected to our web API. They wanted to interact with their new security
    system without ever leaving their primary work environment, aka their own digital
    neighborhood. By interconnecting the two systems, they were able to bring the
    functionality they wanted into their preferred user experience without having
    to switch to a different user interface. Now, they can open doors for visitors
    right from the Slack application without having to get up from their desks.


    You can take the kid out of the neighborhood, but you can''t take the neighborhood
    of the kid.'
  merge: -1
  img_proc: true
