- pgno: 62
  md: '# CHAPTER 4: Going Mobile


    can be tracked passively by radio receivers installed just anywhere. Indoor location
    applications in retail and stadium settings, for example, already use this technique
    to create heat maps that show crowd flow and concentration around points of interest,
    bottlenecks, and disturbances. As the cost of these receivers come down—and they
    are no more expensive than a typical consumer wireless access point—they will
    become an important part of our surveillance infrastructure and provide rich data
    streams for analytics and forensics.


    # THE DESK IN OUR POCKETS


    Many of the mobile apps we use every day had no prior life as desktop apps. They
    were born as mobile applications and provide uniquely mobile experiences. Think
    of real-time mapping application or any social messaging app. They are not very
    interesting as desktop applications because the whole point is to use them in
    real time, all the time, everywhere. They are indelibly mobile and that''s their
    appeal.


    Many of the first-generation mobile apps in security, on the other hand, are reincarnations
    of legacy desktop applications, old wine in new (and more portable) flasks. There''s
    not anything wrong with that. The aging desktop needed to be put out to the curb,
    even when the lessons scrawled across it remain instructional. Mature applications
    embody a decade-long distillation of user requirements and valuable domain expertise.
    With this providence, the mobile versions could start far ahead and give most
    people what they want, most of the time. Mobility delivers information where it''s
    needed and when it''s needed. As the “mobile-first” design philosophy continues
    to penetrate the security industry, these administrative applications will evolve
    into something mobile.


    An increasing number of new security apps are natively mobile and bring more to
    the table than their forebears. Mobile credentials are the clarion example of
    a new wave of applications that fully leverage the power of the platform. More
    than just an incremental improvement, they introduce a qualitatively new user
    experience and life in convenience for the security ecosystem. They modernize
    access control authentication and pave the avenue for participatory security where
    all stakeholders have a role in both intelligence and response. Many technology
    analysts say that for an innovation to be truly disruptive, it needs to be ten
    times better than whatever it replaces.


    Personal safety provides another example of native mobile use case that extends
    the eyes, ears, and long arms of security organizations. Campus safety applications,
    for example, accompany students with a virtual security escort as they'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Mobile First


    walk dark pathways through libraries, dormitories, and parking lots. Fascinating-examples
    in the consumer space include services that provide personal protection on a demand—a
    digital bodyguard that follows you wherever you go. At a corporate scale, managed
    applications provide global protection for top executives and employees traveling
    around the world.


    # MOBILE FIRST


    All of these examples show that the “mobile-first” design strategy is changing
    development priorities for security products, in nearly every vertical market.
    The mobile-first approach nerfs the old order of software development priorities,
    where desktop versions of applications were the primary design consideration and
    subsequent adaptation to mobile platforms was often less than an afterthought.
    Instead, mobile first says that new features should originate on the small screen
    and then migrate to larger devices. Residential security applications have been
    mobile first for a number of years already, and commercial applications are not
    far


    To see why mobile first is so important, consider the way that new features were
    traditionally developed and released. The primary design thinking focused on the
    desktop browser experience. Mobile apps then started their lives as an attempt
    to shrink down the user experience, using responsive design techniques as best
    they could. This process variably resulted in compromises and the removal of features.
    As mobile apps matured, the feature sets grew until they reached some approximation
    of the full-size version, but it never felt like a good fit. This strategy ultimately
    recreates the desktop on a smaller screen, but it does not capture the unique
    advantages of the mobile platform.


    Mobile platforms have many capabilities that desktops do not, and they dramatically
    change the user experience and utility than can be delivered. As a result, the
    mobile design operates from a completely different viewpoint than the desktop
    frame of reference. Geolocation—the use of GPS and other positioning technologies—is
    biggest differentiator between mobile and fixed frames of reference. Location
    is clearly a relevant piece of information for security applications, usually
    leveraged with geofencing or the ability to detect whether a smartphone is within
    a certain geographical boundary. Most residential apps, for example, provide a
    geofencing option to automatically arm or disarm an alarm system. In commercial
    security, mobile credentials can be position-aware, so that they provide the added
    layer of security being activated when they are near the property for which they
    are valid.


    Given that we spend over half of our time on our mobile devices, mobile first
    speaks to users where they live. Desktop usage has declined at roughly 10% per'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# CHAPTER 4: Going Mobile


    year for the last several years, making it less relevant than a strong strategy.
    I would be remiss not to observe that much of the impetus for mobile first is
    dependent on the prior experience of cloud computing. Without the availability
    of ubiquitous on-demand public cloud services, there would be no mobile phenomenon
    as we know it. Our mobile apps would have nothing to connect to—no online stores,
    no digital media, and no video cloud video, nothing.


    # THE INTERACTIVE PARADIGM


    In the first generation of the web, we had one kind of content: static Web pages—little
    more than digital billboards displaying the same message every time you did a
    virtual drive-by. Usually, these websites described their products, solutions,
    and the company''s profile, even when e-commerce existed as an essentially one-way
    exchange. The company offered it on their site, and the customer could buy it
    or not.(Like Henry Ford said,"any customer can have a car painted any color he
    wants so long as it is black.”) Despite we now view as the Stone Age, this new
    and exciting, one-way information flow provided more than enough momentum to get
    the new economy of first gear.


    The Internet became much more interesting, though, when the second stage of evolution
    took off. The year 2004 saw the term Web 2.0 coined to describe the evolution
    toward user-generated content and interactive social networks. Think of YouTube,
    Soundcloud, and millions of blog sites that all packed with created content. Think
    of review sites like Yelp and TripAdvisor or person-to-person transaction sites
    like Match.com and Instagram that exist only because people are willing to upload
    every detail of their lives. Think of all the forums on health care and products
    and every topic of interest to mankind. All user-generated. All social.


    The web was no longer a billboard with an occasional cash register. It became
    an interactive medium for everyone. Suddenly, we could talk with each other instead
    of just passively consuming ready-made content. This rise of Web 2.0 permanently
    altered the way we spent on the Internet, what we could accomplish, and with whom
    we interacted.


    Some of these trends have found their way into security applications. We can share
    security videos over text, email, or social media with just a few finger flicks.
    We can participate in online forums to share our experiences, opinions, and best
    practices. We can review products, companies, and events. But what we haven''t
    done yet is to bring all of these capabilities into the day-to-day practice of
    security.


    Why not?'
