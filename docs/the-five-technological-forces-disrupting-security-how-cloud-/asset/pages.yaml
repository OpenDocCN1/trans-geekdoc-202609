  md: 'of the PC population made one of the largest social and economic events since
    the Industrial Revolution.


    The big difference is that device connectivity used to be a special feature—one
    that you had to select or perhaps guided your product choices in the first place.
    What''s new in the IoT era is that every electronic device is a connected device.
    Every new television is a connected television. Every new car is a connected car.
    All the new coffee makers are connected coffee makers. Every security device is
    a connected security device. It''s no longer a choice. It''s part of the fabric
    of our products. Even the people who don''t actively choose it will have it anyway.
    Connectivity will become embedded, inescapable part of anything that uses electricity
    and many that never did before.


    # THE INDUSTRIAL INTERNET OF THINGS


    The Industrial Internet of Things (IIoT) is the name for a grab bag of nonconsumer
    applications of IoT technology—health care, transportation, energy, smart cities,
    smart highways, factory floor, supply chain, infrastructure, mining, dozens of
    heavy industries, and drumroll—building automation and security. It has its own
    associations, consortia, conferences, reference architectures, cyber manifests,
    consulting practices, software platforms, and its own lobbyists.


    The term was introduced in 2011 and has become a rallying point for many corporate
    applications of IoT. Word is it''s going to be huge. Thirty-nine percent of the
    total population of IoT devices over the next 5 years will be in an enterprise
    or industrial setting. It is predicted to become a multillion dollar market all
    on its own.


    We''re paying attention to it here because the use of IoT in commercial security
    shares many of the same concerns and goals with the IoT community. We are both
    more concerned with system architecture and standards. We are both more concerned
    with device authentication and cyber hardening. We are both concerned with availability
    and network recovery. This is not to suggest that consumer product companies are
    heedless of these issues; it''s just that IIoT products operate in more complex
    ecosystems and face additional challenges that simply aren''t present in a home
    environment.


    The Industrial Internet Consortium (IIC) is a trade group chartered to bring together
    companies and technologies that can accelerate the growth of IIoT through standards,
    best practices, and education. They describe IIoT as a convergence that *transform
    industry through intelligent, interconnected objects that dramatically improve
    performance, lower operating costs and'
