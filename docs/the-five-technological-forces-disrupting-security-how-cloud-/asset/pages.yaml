    So, what’s your strategy for security applications?


    # Mobile Starts With Cloud


    The foundation of a mobile strategy is not actually a mobile strategy: it’s a
    cloud strategy. Over the long haul, mobile apps can only be delivered as a cloud
    service.


    Attempting to deliver broadly available mobile services from a local server runs
    into problems out of the gate. The first compromise is that you must provide a
    hole in your firewall. This lets mobile applications—and pesky hackers—burrow
    through your company’s IT perimeter to reach the back-end servers that supply
    data and execute commands. This architectural compromise and the ensuing vulnerabilities
    arise because your mobile app can’t go to a single URL, which is normally the
    case for widely used mobile services. Your services originate from a different
    address than all the other companies using app. In effect, each end-user organization
    needs to have its own web service-up.


    You are also counting on installers to get all the cyber provisions right and
    every time they do. Given the vast differences in network infrastructure from
    one client to the next and the limited network expertise of any individual installer,
    the odds of getting this right time are less than 100%. Serving your own mobile
    population from inside your corporate network also tightly binds your mobile applications
    to your IT infrastructure. If it changes (and it always does), your mobile solution
    may stop working or need to be reconfigured, along with every single application.


    Who wants that headache?


    Secondly, if you try to use a security system that provides mobile services from
    a local computer, you will run into mobile application configuration issues. For
    every widely used mobile app delivered via a cloud service, each individual user'
