    world.


    Analysts point out, all of this has been going for some time. What is different
    is the cost and scale at which these devices can be manufactured and deployed.
    The cost is now low enough that computational capabilities be embedded in inexpensive
    products, including throwaway and single-use goods. Low costs have a direct impact
    on the massive scale expected for IoT devices. For security systems, this means
    being able to put more sensors in places than ever before.


    Not to be overly academic, but it may be more accurate to say that electronic
    security has long been an “intelligent system” business, even though I’ll continue
    to use the IoT throughout the rest of this book. In contrast to smaller, less
    powerful devices of IoT, intelligent systems are “enabled with high-performance
    microprocessors, connectivity, and high-level operating systems.” This is a much
    closer fit to many of the components deployed in commercial security systems.
    Access control panels and network cameras, for example, use high-performance microprocessors
    and high-level operating systems such as Linux. They also generally Internet connectivity,
    unlike their forebears typically limited to local serial connections to a PC-based
    controller.


