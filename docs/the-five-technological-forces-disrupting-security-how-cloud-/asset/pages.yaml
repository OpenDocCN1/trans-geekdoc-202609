- pgno: 167
  md: '# Smarter


    If big data were the ingredients to bake a cake, then data science would be the
    recipe. A sack of flour and a dozen eggs are no good if you don''t know what to
    do with them.


    Lastly, the term data science enjoys nearly as much attention as big data itself,
    and with good reason. Data science is the methodology—the math and the algorithms—for
    extracting the information hidden in raw data. Data insights don''t grow on trees
    more than other scientific breakthroughs. They arise through very specific processes
    applied under the scientific method. In the immortal words of Matt Damon in *The
    Martian*, you have to “science the shit out of it."


    # WHAT DO WE WANT TO KNOW?


    There is a popular misconception that big data systems provide automatic insights;
    they can ingest a bunch of data and simply tell us what is going on. There is
    a little bit of truth to that, but only a. In the world of data science, any automatic
    insights are broadly known as unsupervised learning. It works for some types of
    problems, but not for everything, and even then, it requires judgment, fine-tuning,
    and a sense of the overall goals of the investigation. It''s probably a better
    wager that big data systems for physical security will only provide answers to
    questions we''ve asked. We will need to teach them what is important and what
    we want to know. It''s not mind reading, after all.


    This puts the onus on us to decide what matters and to express it as an algorithmically
    solvable problem. With cyber security, there are parts of this task that fall
    to all of the stakeholders in the security ecosystem. Software or SaaS providers
    will conduct market research to find out what security organizations would like
    to know. Or they might feel that they have great ideas and forge ahead, hoping
    they''ll be useful. Security organizations will need to be vocal about the great
    unsolved problems they think big data could help, and may need to change their
    thinking about cloud platforms and where they will store their data. Integrators
    speak to customers every day and will have the task'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'of finding a good match between customer desires and provider capabilities.
    Sound familiar? It should. It''s the normal product development cycle. The only
    difference is that it''s about big data.


    Another way to think about this is to make a list of decisions you can''t make
    today due to a lack of data or analysis. The whole point of decision support systems
    is to enable action. Think of how big data is used in other business contexts.
    In retail and e-commerce, data are gathered not because they are interesting (although
    it is) but that ads can be targeted more effectively. In agriculture, data are
    acquired so that planning and fertilizing will be more cost-effective. In health
    care, data enable health-providers to deliver better at a lower cost. In every
    one of these examples, the collection and analysis of big data are done with a
    very specific outcome, or decision, or in mind. It is purpose-driven.


    Answering the question of what we want to know is not a technical exercise. It''s
    mostly common sense, so we can begin with the simple observables and objectives
    that have been at the heart of security practice for millennia.


    We would like to know the following:


    +   * If something bad is to happen (or happen again)

    * If something bad happened nearby and might affect us

    * How to spot a potential bad person

    * If something unusual is being observed for the first time

    * If there is more or far less activity than usual

    * If our perimeters—physical or virtual—have been compromised

    * If our people are where we expect them to be

    * If our people are in danger


    For distributed enterprises, this list of questions grows even larger:


    +   * Does the activity at this location resemble our other locations?

    * Is something happening elsewhere that could happen here?

    * What is the average of X across all of our locations?

    * How does our security profile compare to similar organizations?

    * What are our best and worst locations? Why?

    * What factors characterize our good and bad performers?


    All of this boils down to the question of what is normal and how do we know when
    we see it.


    # NOT ONE SIZE FITS ALL


    One of the challenges in talking about big data for physical security is that
    not everyone is interested in the same questions. A small business owner, a mall'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'operator, and a multinational security director will all have very different
    data sets and objectives for their data and analytic resources. This makes it
    difficult for suppliers to come up with product offerings that satisfy a wide
    enough swath of their customer base to make them worthwhile. A useful model for
    thinking about big analytics is the model we currently use for video analytics,
    where there are specific analytic algorithms in use for each types of physical
    security problem: license plate recognition, facial recognition, flow analysis,
    and abandoned object recognition, name a few, are all designed to answer very
    specific questions. Big data analytics develop the same.


