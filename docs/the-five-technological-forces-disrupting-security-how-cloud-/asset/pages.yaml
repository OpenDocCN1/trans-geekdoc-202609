- pgno: 199
  md: 'depend on for many years—and we''ve said repeatedly, electronic security systems
    are just like any other IT system in that regard.


    How does all of this lead you to a strategy for benefiting from big data?


    Your big data strategy is based on your cloud strategy because you are unlikely
    to see big data features emerge on on-premise systems at reasonable price points.
    Even if price weren a factor, it''s unlikely that your business alone will generate
    enough data for you to take advantage of big data while you are still living in
    a data puddle. You need to jump into the lake if you want to swim.


    What can you do? Ask vendors about their product road maps. Find out how far they
    are looking into the future. See if they are moving in this direction. Make decision
    based on their track record of providing frequent software updates with significant
    feature enhancements.


    When people ask how to position themselves for big data, I tell them that if you
    want big data in 3–5 years, put yourself in the cloud today. That''s where it
    will happen.'
