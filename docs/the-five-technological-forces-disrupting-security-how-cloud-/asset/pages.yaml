  md: 'But this won''t happen all at once.


    As an extension of our eyes and hands, IoT devices can perform many tasks we could
    previously accomplish only by being physically present. In many cases, they can
    do it faster and better than we can and without the associated risks. A connected
    thermostat does a much better job of warning about temperatures than we do. A
    connected garage door that remembers to close itself is much better than relying
    on human memory. A Bluetooth listener is always known when personal electronics
    are in use. And a camera with object detection can do a much better job of observing
    and alerting suspicious situations- than a team of human guards.


    But what do we want IoT to do for us? How do we decide where we get the most value?
    What are our biggest problems? In the science of risk management, the most relevant
    information we have, the more we can reduce risk—assuming that it is timely, accurate,
    and actionable. This is clearly a need IoT devices fill. The dramatic cost reductions
    in sensor technology by IoT allows us to affordably deploy networks at a fraction
    of the cost they commanded a few years ago. This lower cost structure introduces
    not only a quantitative change in sensor deployment but also a qualitative one.
    Sensors can now be deployed at low cost that vary every cubic foot of building
    or public space can be one or more forms of surveillance at all times.


    Who knew Big Brother would be so affordable?


    # IT''S ALL ABOUT THE DATA


    Security has steadily progressed from rear-facing forensic research (aka closing
    the door after the horse has bolted) to forward-facing prediction and prevention
    (aka an ounce of prevention is worth a pound of cure).


