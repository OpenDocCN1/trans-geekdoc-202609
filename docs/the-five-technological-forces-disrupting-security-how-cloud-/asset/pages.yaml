  md: '# 8 CHAPTER 1: From Packages to People


    agers. Meanwhile, product designers jumped to the chance to mine this way to reach
    out and touch someone.


    As a connected device, the SmartBox was no exception. It needed to talk. It had
    things to say. It led us straight to the central role that mobile platforms have
    taken in security over the past decade: digital notifications of changes in the
    physical world. We learned early that people paid attention to messages, even
    if they were from a machine rather than a person. They would change their behavior
    if a connected device provided them with timely and relevant information. Of course,
    if the device told them that a package had been delivered, they might change course
    to pick it up before going on with their day. If the system told them someone
    else had been inside their box, they might call and find out why. We take all
    for granted now because we have connected devices telling us all the time, but
    at the time, the capabilities delivered everyone who saw them.


    We found communication to be even more valued in commercial settings, where timely
    information is money. Field repair logistics was a prime example: getting the
    right part to the right person at the right time—and noting that it happened.
    We required a face-to-face handoff staff at the parts dept and field technician.
    Inserting an access-controlled counter into the process made it asynchronous,
    thereby decoupling the schedules of both parties. The system also provided the
    validation of service level commitments, with texts and e-mails providing an audit
    trail. Everyone saved them.


    Today, this is almost passed, but at the time, it was groundbreaking. Text and
    images are now the lifeblood of sensor networks, apprising security teams of anomalies
    across their facilities and inhabitants. Mobile technologies have freed us from
    our desks and video monitors, enriched the interaction between buildings and their
    occupants, and make a platform for identity and access management.


    # BIG DATA IN ITS INFANCY


    The term "big data" made its debut in 1998, shortly before this story begins,
    but people weren''t really using the term all that much. Even before joining the
    security industry, where I worked in a company that did nothing but analyze and
    sell huge amounts of data, no one said "big data." Instead, the company talked
    about analysis, reports, and building out specialty warehouses for clients. In
    other words, the company’s conversations with customers were about the value added
    to the data and what clients could do with it—not just its size.'
