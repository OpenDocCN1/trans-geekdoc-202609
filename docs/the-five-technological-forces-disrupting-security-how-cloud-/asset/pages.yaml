  img_proc: true
- pgno: 86
  md: '# CHAPTER 6: Altered Presence


    registrations in the lobby, for example, in a controlled facility. If they don''t,
    the data expose a process issue that needs correcting.


    Being able to track visitors may provide valuable forensics for many types of
    incident resolution. With presence data collected in a retail setting, for example,
    it would be easy to correlate losses with the presence of identities repeatedly
    present across multiple incidents of theft. The more data available on both, the
    better the correlation calculations would be. The preventative measure of this
    information comes from mining it and alerting when those same identities walking
    through the door next time (the new millennium''s version of the "bad check wall
    of shame" many restaurants and gas stations used to hang behind the cash register.)


    Dwell time is another staple of web analytics carries over into the physical realm.
    In the online world, it refers to the time someone spends on a Web page or the
    entire site. In the physical world, it takes on the same meaning for the amount
    of time a visitor spends in a building or campus. Here again, security data can
    become operational for the rest of the organization. How long are people visiting
    your building, airport, or store? Why are some people here for over 12 hours?
    Why do they show up and leave after 10 minutes? Today, we don''t have the information
    to even ask these questions, let alone answer and understand their implications
    for risk and security.


    Path analysis—the route a user takes while clicking through a website—is of paramount
    interest to web designers and marketing teams. They want to provide a satisfying
    user experience while deriving the greatest benefit for their company. Here again,
    we find a close to the physical world of presence data where the path through
    a physical space is a direct mapping of the path through a virtual space like
    a website.


    Security organizations don''t have a great handle on the people that take through
    our spaces, except when they are highly constrained. In commercial properties
    and public spaces, however, we have an opportunity to increase both security and
    operational knowledge.


    # A JEWELRY CASE IN POINT


    One of the first times I presented the concepts of presence and web analytics
    was to a group of chief security officers (CSOs) and security directors from Fortune
    500 companies. Needless to say, this group is well acquainted with risk and criminality.
    They are always on the lookout for new technologies that will reduce the incidence
    of security events or, failing that, to assist in the prosecution.


    After my speech, I was approached by the head of security for a luxury watch company
    currently involved in tracking down a series of thefts at retail stores'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'that carry their brand. The basic thefts MO was that was the group of thieves
    would enter a store, smash and grab the watches, and then leave. That part of
    what gave the crime a unique signature; they didn’t steal any other jewelry—just
    watches. That made it my new friend’s problem.


    Working with law enforcement, their hypothesis was that it was the same group
    of thieves, traveling from city to city and carrying out the same basic pattern
    anywhere this watch was sold. The director of security wanted to know whether
    there was a way to ID the perpetrators as being the same people each.


    Seeing the power of presence and knowing that many thieves aren’t thinning far
    enough to turn off their cells before pulling off a robbery, they wanted to know
    whether this data could be collected across multiple locations and compared to
    see if the same known unknowns showed up at each one.


    Why!


    Last I spoke with them, they were figuring out how to use this technology across
    multiple facilities—a great example of what is possible in electronic security.
    While it might sound like another expensive layer of security, it would become
    a bonus for the next generation of access control and building management systems.
    These systems will use Bluetooth technology mobile credentials rather than the
    outdated RFID proximity cards or even short-range smart card protocols.


    # BREATHING THE DATA EXHAUST


    Presence detection will become a free data-product of security and sensor networks
    that transition to Bluetooth. We won’t even have to ask for it. It will be a built-in
    part of the systems we install for other purposes—a secondary effect that may
    rival and outweigh the original intent. Deep analytics will run on multiple clouds
    as machine learning algorithms to tell the difference between normal and abnormal
    and then tell us about it. Graphic representations of results will appear on next-generation
    dashboards or be read to aloud as human-machine interfaces continue their evolution
    from vision and gesture to the spoken word.


    This free data by-product is known as “data exhaust”—an information stream inadvertently
    produced in the process of doing something else. The concept of data exhaust originated
    as an observation on the electronic ephemera as a side effect of our online activities:
    cookies, logs, timestamps, temporary files, download fragments, and all the other
    digital froth we leave in our wake. The concept has since been generalized to
    include any data by-products we leave behind when moving through the world. Estimates
    are that connected cars,'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'for example, will send 25 Gb of data per hour up to the cloud. Aircraft will
    generate half a terabyte of data with each flight. Closer to home, global smart
    building production is already measured in zettabytes (21 zeros).


    The exhaust from a Bluetooth reader on an entryway is one example of security
    devices produce a data stream that can be mined for secondary purposes beyond
    the original intent of authorizing access to a door. Lucky for us, these data
    streams are produced for free time a smartphone comes within range of a Bluetooth
    reader (or any other Bluetooth reader, for the matter).


    These secondary uses of exhaust from smartphones will more than double the value
    of the Bluetooth readers that support mobile credential exchange. Consider the
    economics. A Bluetooth reader is no more expensive than a conventional proximity
    reader, and they are on their way to being an order of magnitude less expensive.
    Bluetooth chipsets are being added to other electronics like door controllers
    for about five dollars, displacing stand-alone readers entirely. That makes them
    almost free.


    People counting is a primary example of mining data for secondary value. Nearly
    every retail business is interested in the number of people who come through their
    door. In the past, this was handled with simple technology light beam sensors
    or expensive video analytics. Both have limited accuracy, and both require additional
    components, installation, and software to collect and analyze the data. The cost
    of using a Bluetooth reader at each entry point, on the other hand, is already
    accounted for in the access control system and produce unique visitor data for
    free (at roughly the same degree of accuracy).


    Another example of mining data exhaust is extracting value from the metadata produced
    by simple video motion detection. Every modern surveillance camera produces this
    information, but the data stream is so massive, not to mention ambiguous, that
    it is usually ignored. Instead, it is paid up by billions of rows per minute in
    databases across the world. But this low-grade information has a great deal of
    value in the aggregate for producing heat maps of building utilization and anomalous
    pattern detection. Machine learning can figure out what "normal" is and departures
    from normal almost immediately. This entire process is an example of video content
    analysis (VCA), and it''s about to become orders of magnitude more useful as machine
    learning accomplishes what humans have until now been plodingly coding from first
    principles.


    As the saying goes, one man''s trash is another man''s treasure.


    Analytics services. Steve also has over 10-year experience in wireless communications
    as vice president of software development at GeoStar and as director of systems
    engineering at Communications Satellite Corporation (Commsat).'
