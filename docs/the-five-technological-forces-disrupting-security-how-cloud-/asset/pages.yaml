  img_proc: true
- pgno: 164
  md: '# THE ROAD TO VOLUME


    Electronic sensors have been around for a long time in many industries. Initially,
    they could accomplish a great deal with simple technology. Think of the humble
    switch that detects whether a door is open or a $5 motion sensor that detects
    movement in a room. Each of these introduced a night-and-day difference in remote
    surveillance. Video surveillance systems are benefiting from the same type of
    analytic capability that is enabling computer vision for self-driving cars. These
    are now capable of tracking dozens of objects simultaneously in a single scene.
    But all of these, individually and collectively, are still only a fraction of
    the deep intelligence we could have at our disposal within a few short years.


    Don''t get me wrong. I am not saying that today''s technologies are ineffective.
    They are foundational data collection systems. We would be blind without them.
    What is missing is the additional layer of data analysis already transforming
    other industries. As a simple example, I could cite my own anticipation of the
    comparative energy report I receive each e-mail from my local power and utility.
    It tells not only how I compare with my energy usage before but also how my energy
    consumption stacks against several efficient and inefficient neighbors. It also
    (painstakingly) reminds me of what I could be doing better.


    If data can tell us how energy-efficient we are, couldn''t they tell how secure
    we are?


    One reason is the structural difference between the electricity and security services
    are typically delivered to their respective customers. Electric distribution is
    centralized; most commercial security is not, with the exception of alarm services,
    which are only one leg of the security stool. Centralization of energy consumption
    data provides not only for large, regional data sets but also for an economical
    way to generate and distribute the higher intelligence about usage patterns. In
    commercial security, the economics of advanced analytics has placed these capabilities
    beyond security budgets. Even a single security organization could obtain reference
    data sets (a big problem in itself), the traditional on-premise computing model
    would be quite prohibitive to run the analytics software. Expensive enterprise
    software licenses keep ahead intelligence out of reach for most.


    In the case of access control, video surveillance, and related security information
    management systems, the prevailing deployment scenario has been to one or more
    or mid-class servers inside a protected property. The cost of these servers plus
    software licenses for operating systems, databases, and applications totals up
    to a pretty penny, considering that they are only used by a single organization
    and, even then, usually only by a small number of users.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Asking most companies to bear the full expense of adding more enterprise software-licenses
    is a tough sell, particularly for constrained security budgets. Mid midsize organizations
    will look at a price tag over $100 a month per seat and pale at the expense.


    If only there were a way to spread out the cost of these analytic software services
    over a larger pool of buyers, these features could be available to everyone.


    Oh, wait; we have that already. It''s called the cloud.


    Shifting more of the computing workload for security systems to the cloud, physical
    security data sets are growing in size and usefulness. Previously isolated data
    sets for individuals are now being aggregated in multitenant SaaS systems that
    allow them to be analyzed collectively rather than individually. And because these
    data sets have enough latent information in them to worth extracting, software
    developers will begin to include such features in their security management platforms.
    Such intelligence is becoming commoditized in the cloud.


    Call it "artificial intelligence as a service."


    # HOW NOT TO THINK ABOUT BIG DATA


    When I speak at conferences on big data in security, audiences invariably ask
    which big data products are for security. No offense, but this is the wrong question.
    It''s not about products. Buyers cant evaluate software tools apart from analytic,
    business, and security goals. It''s like asking a car salesman which is the best
    without describing what you intend to do with it (answer—the one''s already on
    the lot).


    In that sense, looking directly to big data sets is a case of putting the horse
    before the carburetor, so to speak. You don''t walk into a new car showroom and
    start by asking to compare the transmissions in every model. You start by looking
    at the total package: SUV, sports car, luxury sedan, or pickup truck. Which one
    of these finished goods delivers the experience you want? Which one has been designed
    to perform that task you have in mind? You don''t buy all the parts to a car and
    put them together. That would never work. You trust a carmaker to build a finished
    product that does what you want it to do.


    The same is true for software solutions. Security buyers who want to leverage
    big data should start by searching for complete solutions, not focusing on the
    underlying tools. There has been an explosion in the number, variety, and sophistication
    of software tools related to big data, but tools alone do'
  merge: -1
  img_proc: true
- pgno: 166
  md: not solve problems. They are just components of a solution, not the solution
    itself. Most security organizations would get very little benefit from running
    out and installing, say, a distributed storage cluster and an analytics engine.
    They are both raw tools that need to be customized, programmed, and integrated
    with data sources before they can produce useful results. They are typically not
    activities most security system integrators are equipped to perform, nor would
    it be cost effective to do so on a one-off basis. Security organizations need
    a finished product that does something useful on the day it is commissioned. Raw
    tool sets don’t do that out of the box. How useful are a stack of boards and a
    bucket of nails when what you really want is a house?
