    - **Performance**: Performance increases have enabled new behaviors in intelligent
    devices, most notably in the field of video analytics, where complex algorithms
    and high-bandwidth data streams demand a certain minimum level of intelligence
    before they are actually useful.

    - **Operating costs**: Cloud-connected intelligent devices are a striking example
    of reducing operating costs. They are essential to the TCO improvements attributed
    to SaaS services that manage enterprise security.


    In short, yes, IoT matters a lot.


