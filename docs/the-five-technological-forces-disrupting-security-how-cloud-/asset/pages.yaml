- pgno: 197
  md: '# The Lack of Standards for Security Events


    If you stopped reading after the fifth bullet point up there, then you can understand
    why undertaking a big data project is not for the faint of heart or first timers
    who have never done it before. This stuff is hard and you can''t fake it.


    Of these questions, the view of the security mission is undoubtedly the most important.
    To revisit our earlier examples, if your security mission is limited to loss prevention
    in a retail setting, your parameters for spending on data collection and analysis
    are pretty well established. They must be less than the value of your losses (likely
    after subtracting the rest of the loss prevention budget).


    If the security mission is to prevent corporate espionage, where billions of dollars
    worth of intellectual property may be at risk, the budget will look very different
    but will also be tilted toward cyber defenses, because most intellectual property
    now exists in digital form. If the security mission is to prevent loss of life
    in a public or municipal setting, budget considerations and risk tolerance will
    be evaluated by a completely different set of criteria and will also be limited
    by budget processes that may not reflect the risk versus reward equation. If the
    security mission is to protect critical infrastructure against terrorist attacks,
    then political processes will establish the budget, and the solutions will be
    engineered to gather data about the world, not just the sensor system within the
    infrastructure itself.


    Finally, if you are a small business (or delivering security services to a small
    business audience), the security mission is going to be highly productized; that
    is, the features of standardized security products and services will have a large
    role in defining the security mission, because few business owners will carve
    out their own bespoke security program. They will instead choose from the usual
    three-legged stool of access control, video surveillance, and alarm monitoring.


    # THE LACK OF STANDARDS FOR SECURITY EVENTS


    One of the biggest challenges facing any big data implementation in the physical
    security domain is the lack of data standards. Today, nearly every security manufacturer
    and software developer store data in their own proprietary formats. For your security
    team, this means you''re effectively on your own unless your security mission
    is cooperating with you or provides documentation and access to either a file
    system, SDK, or API. Some do, and some don''t. Many consider data models to be
    proprietary information, not for public release, or even sharing with customers.


    Contrast this with network security and computer systems, where standards dominate
    and data sharing and exchange are assumed to be important product capabilities.
    Cybersecurity has billions of threat models, but one of the big'
