  md: '# A Global, Residential, Commercial, and Even Universal Risk


    More to the point, since we are already effectively operating as an IoT industry,
    we are already under threat. In one way or another, all of us manufacture, install,
    or purchase electronic systems connected to the Internet. Our physical security
    infrastructure is open to crippling attacks.


    Our situation calls for a highly nuanced tableau of the world of video gaming.
    Not long before these cyber events wreaked havoc, the video game publisher Ubisoft
    released an ominous new titled Watch Dogs. The game depicts a dystopian world
    in which IoT devices manage so much of the modern urban landscape that hacking
    becomes a principal tool not only of cyber threats but also of real-world theft,
    vandalism, and dominance. The leader in this first-person hacker adventurer is
    “an antihero who can hack into the physical infrastructure to obtain and control
    information or to destroy such devices.* The heart of this disturbing vision is
    a paradoxical world in which the more electronic devices we deploy, the less safe
    we are from those who can hack. Hacking vehicles, traffic signals, bridges, security
    systems, doors, cell phones, and anything else with an electronic pulse; it''s
    all in a day''s work for the busy antihero.


    No one is beyond reach.


    # GLOBAL, RESIDENTIAL, COMMERCIAL, AND EVEN UNIVERSAL RISK


    The common thread through all of these stories and their possibly dystopian conclusion
    is that the physical world and the cyber world are now inextricably united. The
    billions of miniature computers we continue to manufacture and install may be
    the greatest gift ever to the hacker community. They may also create the single
    largest or terrorist vulnerability of all time—thought that can''t be from anyone''s
    mind in a year Russian hacking is thought to have played a significant role in
    the most recent presidential election.


    In Lights Out, Ted Koppel''s excellent book on cyber attacks against our electric
    grid, he painstakingly traces the vulnerabilities and implications of a major
    hack to this vital infrastructure. In a phrase, our society is not equipped to
    operate without electricity, nor is our government prepared to do very much about
    it. the sheer logistics of responding to a disruption of more than a few days
    or weeks are unimaginable and undoable at our current level of preparation. Even
    a small electric outage like that caused by Hurricane Sandy required the importing
    of resources and skilled workers from all over the country to


    > *From the game description provided by the manufacturer, see https://www.ubisoft.com/en-us/game/watch-dogs.'
