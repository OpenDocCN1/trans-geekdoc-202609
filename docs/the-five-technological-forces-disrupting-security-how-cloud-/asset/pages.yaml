- pgno: 37
  md: '# The Run-Up to Cloud


    Physical security has only recently developed enthusiasm for cloud computing.
    While we see more marketing claims about cloud products, overall adoption within
    the physical security industry remains low. The good news is that there are early
    signs of an imminent and rapid increase, with leading analysts already noting
    an upswing in cloud-based systems for both government and commercial sites.


    What this tells me is that we are still witnessing the run-up phase to widespread
    use of the cloud. The question is, how did we get here and when are we finally
    going to get there?


    # CLOUD MEETS AN INDUSTRY OF LATE ADOPTERS


    On the whole, the security industry is justifiably conservative group when it
    comes to anything new. After all, customers don''t want the use of “bleeding edge”
    technology in products designed to, well, literally prevent bleeding. When the
    stakes are life and death, security organizations rightly feel compelled to test
    and prove new technologies before placing their constituents at risk. Software
    must be free of bugs and security defects. Equipment and services must be UL approved.


    It’s not just a matter of technical risk. Supply chain risk is just as important.
    Start-ups must demonstrate that they will survive long enough for buyers to make
    a cutting-edge product worthwhile. Security teams must be able to justify the
    inevitable new learning curves that come along with new products. Suppliers must
    make a convincing case that they can provide them with ongoing support for years
    into the future. No one wants to be the first to debut a spectacular failure.
    We want examples and references of others who have succeeded with the new “thing.”


    In short, we’re an industry of “late adopters.”'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Being a late adopter isn''t all bad. We have the benefit of the new technologies
    matured and worked out the kinks. Cloud technologies presented numerous software
    development and deployment challenges during their infancy in the late 1990s.


    +   - Expense. Each company essentially had to write its own applications from
    top to bottom; they had to “roll our own” and find what worked the hard way.

    - Lack of tools. Software tools and frameworks had not yet caught up with the
    unique demands of cloud systems. Developers often created their own, added to
    overall effort to launch new products.

    - Developer scarcity. Software developers who understand how to build these systems
    were rare, expensive, and in high demand. (I guess some don''t change.) Consultants
    were a daycharging high fees to all the companies who wanted to “do something
    about this Internet thing.”

    - Infrastructure. Managed infrastructure services like AWS and Azure didn''t exist
    at anywhere near their current level of mastery. This forced application service
    providers bore the burden of their data centers. Everyone needed their own computer
    and networking experts and lots of capital for equipment.

    - Broadband availability. Not least, the broadband network connectivity now taken
    for granted was spotty; every sales called a discovery process to determine whether
    a potential customer had the bandwidth to sign on.

    - Cyber security fears. Fear of cyber attacks on cloud providers cannot be underestimated
    as an inhibitor of early sales in this space. People instinctively feel safer
    with a computer inside their own building than one outside of it.


    By the time physical security caught on to the relevance of cloud computing a
    dozen years later, many of these problems had been solved. On one hand, this was
    good for physical security companies that had been slowed down to a toe in the
    water; they could move forward with lower implementation costs and risks than
    those who''d taken the plunge a decade before. However, it also meant that they''d
    invested another decade''s worth of systems development (and capital) into single-tenant,
    client-server bases.


    # SKATING TO WHERE THE PUCK HAS BEEN


    The timeword hockey analogy by Wayne Gretzky has become a familiar business affair.
    It is usually meant to signal that a company or product is forward-looking and
    anticipates that customer demand will lead. Many people would use it to describe
    their own company''s posture toward cloud'
  merge: -1
  img_proc: true
