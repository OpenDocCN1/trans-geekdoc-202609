  md: 'Risk management is the methodology to determine whether any of these approaches
    is worthwhile. Risk analysis is a part of many kinds of business intelligence:
    insurance, corporate investment, financial portfolio management, and of physical
    science. The fundamental principle is simple: if the probability of something
    bad happening times the cost it will inflict is greater than the cost to prevent
    it, then it is worth doing. This means that extremely low-probability events,
    even if they have dire consequences, are not likely to receive funding. At the
    other end of the scale, high-likelihood events will receive more investment, even
    if their individual occurrence is less costly.


    From this view, data science can be seen as an alternative decision-making framework,
    as a supporting science that rolls up into the practice of risk management. Risk
    management depends heavily on data, and the cost of the adverse events we are
    trying to prevent. Without casting asions, a fact that risk assessment is an exercise
