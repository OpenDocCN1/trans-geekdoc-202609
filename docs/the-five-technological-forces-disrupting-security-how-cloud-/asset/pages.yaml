  md: '# CHAPTER 8: Why IoT Matters in Security


    Many observers describe the arrival of IoT in the same breathless terms used to
    announce waves of new technology: desktop computing in the 1980s, the rise of
    the Internet in the 1990s, and the shift to cloud and mobile computing in the
    new millennium. They were each heralded as the dawn of a new era. In many ways,
    they each of that made tremendous impacts on our lives, both individually and
    collectively as a society. Personally, I find it hard to imagine the pre-PC, pre-Internet,
    and premobile that defined the first 20 years of my life. I find it hard to imagine
    that having billions more connected devices wouldn''t produce dramatic changes
    over the next 20.


    There is, however, a point of view that says IoT is nothing new: just a fresh
    label for existing technology, driven largely by marketers jumping on the latest
    bandwagon. They point to examples of similar connected devices as proof that phenomenon
    started a long time ago and is simply coming into its own. In fact, I made a similar
    point earlier in this chapter: namely, that electronic security has been a connected
    device business for many years and, in fact, pioneered such things long before
    they showed up in consumer products. When networked connectivity did appear, it
    was hailed as huge differentiator: Don’t buy the printer with bulky cable—get
    the wirelessly connected one instead; don’t buy a mouse with an unsightly wire
    to your laptop, the one that uses invisible radio waves.


    Like most new technology trends, IoT is coming into the market surrounded by many
    exaggerated claims. A lot of the hype is about the technology itself and not what
    it can actually do for consumers or businesses. This is unfortunate for those
    who are building new solutions that solve real problems or enhance people'' lives
    in meaningful ways. Their innovations are trying to gain footing in a very noisy
    space, making it difficult for buyers to evaluate that technologies are mature
    enough to be of use them.


    # IoT WILL BE PART OF EVERYTHING


    When the world’s first smart hairbrush was announced at CES 2017, my first thought
    was that’s the dumbest thing I’ve ever seen. Its mission is to tell you if you
    are brushing your hair correctly or not. Some have described this announcement
    as evidence that we have peak IoT¹³—a disparaging moniker for all stupid about
    start-up IoT companies that are looking to disrupt something that doesn’t need
    disrupting.


    After I calmed down, I thought more about the data that this new beauty accessory
    can provide to its corporate masters back at L’Oréal. They know every time


    > ¹³http://www.wired.co.uk/article/smart-hair-brush-loreal-wattings.'
