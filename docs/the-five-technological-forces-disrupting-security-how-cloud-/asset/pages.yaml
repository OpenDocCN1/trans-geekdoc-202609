- pgno: 159
  md: '# Bigger


    Big data is like life: it''s what happens, while you''re busy making other plans.
    In many respects, it is a by-product of everything we do on the Internet, the
    output of every sensor in our measured worlds, and the spread of pervasive computing
    into nearly everything we touch. It is personal, commercial, industrial, and global.
    One day, it will change the way we practice security. But it won''t do that alone.
    That''s because data are just data. As concrete is only concrete until it''s formed
    into a bridge, a road, or even a work of art, data do not do much for us until
    it is shaped under the blade of data science and animated by analytics.


    I didn''t fully appreciate the latter two points about big data until I sat down
    to work out what big data could mean to the future of security. That''s why this
    section (which started out as being about big data alone) has itself come to life
    as a broader look at big data, data science, and analytics.


    When the layman looks at the face of physical security from the outside, big data
    is probably not the first thing that comes to mind. It makes likely people think
    of retail or even subatomic physics. The mention of commercial security usually
    conjures images of guards: bored men with uniforms badges sitting behind desks
    in the lobby or wandering back hallways and parking lots. Or perhaps, it conjures
    a world of corporate espionage, stolen secrets, and international intrigue. In
    a residential context, we think of home alarm systems that won''t stop beeping
    when you want them to happily alert the police when something brings bad happens.


    The truth of matter is that security has always been about data. To paraphrase
    Mark Twain, we use the five-dollar term "situational intelligence" when the 50-cent
    word "data" would suffice. Our security data world is filled with countless sensors
    recording countless events, filling databases to the brim. Inside are unexplored
    correlations and relationships that we would pay good money to understand. As
    we see the insights that big data systems provide other business and security
    systems, we want to know if data science can provide similar results with our
    warehouses of security data.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# CAN BIG DATA SAVE YOUR LIFE?


    That was the question posed by Dr. David Agus in the January 2016 issue of Fortune.
    If your doctors practice data-driven medicine, the answer, happily, is yes. That
    because their medical decisions are informed by large sets of data about many
    patients rather than just yourself. The data-driven enterprise, analytics provide
    the doctor with diagnoses and prognates that can''t be derived from individual
    cases. Machine learning adds even more to this equation, with trained algorithms
    now better able to identify disease conditions than a specialist with a lifetime
    of education and experience. Not knocking docs, the issue is that there are just
    too much data and not enough for any one to make decisions as quickly as they
    need to be. Made soft to the rescue—it''s a lifesaver.


    Contrast this model of clinical practice with that of the security guard staring
    bleary-eyed into a video monitor. This overtaken sentry is the unfortunate poster
    child for traditional video surveillance in our buildings and public spaces. The
    hope is that this vigilant soul will spot anomalies and take action to prevent
    harm to people or property. But this scenario is actually a poor way to catch
    anything in real time. It is worst in the same sense that Churchill said, "democracy
    is the worst form of government, except for all the others." So it is with event
    and video monitoring by humans: they are the worst form of vigilance, except for
    all the others. Sure, its better than having cameras at all, but that''s not saying
    much.


    Limits on human attention span make these models ineffective. Numerous studies
    show that attention capacity diminishes from 100% to near zero within approximately
    20 minutes. This means that well over 90% of the time, we are expecting to be
    vigilant; they are actually doing a terrible job at it. Im not knocking guards;
    it''s not human possible.


    The traditional row-by-row display of events and alarms has been rendered ineffective
    by the volume of data in modern security systems. Reams of data scroll the human
    eye on a computer display, but the brain can''t begin to process it or recognize
    signs of potential trouble. Only after the fact do the voluminous logs in our
    security systems serve any real purpose, and by then, it''s usually forensic,
    not preventive. Dashboards of dials and meters and digits have become de rigueur
    for taming all this data and adapting them to our cognitive strengths. As the
    amount of underlying data has grown, however, the number of dashboard widgets
    has grown so large that not even NORAD of the classic War Games has the screen
    space to show them all.


    It''s 10 pounds of data in a 5 pound sack.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# BIG DATA DEFINED: THE FOUR V''S


    Too much data to deal with is pretty close to the working definition of big data:
    information sets are so large and complex that conventional data processing applications
    are inadequate.


    In this world, the familiar relational databases we grew up with break down the
    strain of more information than they can handle. Queries take long times to return
    the requested data, if they return at all. Disk arrays that once seemed to fill
    are now too small to fit. Bulging data sets require distributed file systems that
    can grow horizontally to practically infinite dimensions. The handy reporting
    software that allowed us to make had desktop queries has become useless as a typewriter
    against new ways of organizing the underlying data. Even the statistical concepts
    we once took at the height of mathematical sophistication are now passé and inadequate.


    There is more to big data than simply being big. The four Vs, as they are known,
    provide a mnemonic framework that expands on our simple definition:


    +   * Volume

    * Velocity

    * Variety

    * Veracity


    Volume is the defining characteristic of big data. It''s right there in the name
    itself. But how big is big? That depends. The threshold is not a particular number
    of bytes, but rather a size that demands new technologies. This is a moving target,
    of course. Conventional relational databases and conventional business intelligence
    tools, for example, can manage data sets well into billions of rows. But they
    can''t necessarily do it enough to be useful if the data sets change rapidly or
    aren''t structured.


    Velocity is the rate at which data stream into an information system. Think of
    the rate of all the tweets trades flooding the financial exchanges. Virtualize
    the rate of video and data flowing through a global security operations center.
    Stable or slowly changing data sets are usually amenable to traditional database
    and analytic technologies. That''s because standard indexing and segmentation
    techniques can perform an analysis within the timeframe in which answers are required.
    High information rates crash classic batch-oriented analytics because the answer
    to every question changes from nanosecond to nanosecond. This is where the beans
    won''t stay still.


    Variety refers to the proliferation of data types that are now part of our analytic
    universe. In the beginning of computing, there were numbers, and numbers'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'were computing. Numbers represented all things and without them there were
    calculations. Since then, there has been an explosion of data species. Now, we
    have a garden of data types that includes strings, video, unstructured text, enumerations,
    links, objects, pointers, functions, sets, graphs, arrays, and good old numbers—real,
    integer, and imaginary. This vast array of data types has changed the kinds of
    analytics that are both possible and required to make any sense of it.


    Veracity the fourth V might be called a sometimes-V because not everyone accepts
    it or even agrees on its meaning. For security, it matters, and it can be expressed
    as one of the bedrock principles of our profession: trust. Whether your data are
    big or small, do you trust them? Surveys indicate that roughly one-third of business
    leaders don''t trust the information they receive from their data systems. Veracity
    of data sources and believability of analytic outputs are crucial to our big data
    future in security.


    We can''t afford to be wrong a third of the time.


    # THE CASE OF THE MISSING DATA


    Large security organizations with huge budgets have access to powerful big data
    resources and analytic software. I am thinking of state agencies like the CIA
    or FBI, international organizations like Interpol or NATO, or many of the offices
    in the Department of Defense. They have teams of trained data scientists who can
    follow the wisps of data left behind by international terrorists and string them
    together to find a needle in a haystack. The successes of this intelligence, law
    enforcement, and military teams are legendary. They seem almost omniscient, but
    a lot of the credit goes to the data resources and analytics at their disposal.


    The commercial security systems available to most businesses, unfortunately, provide
    nowhere near this level of data insight. Given the property value and lives at
    stake, better data analytics could make a significant difference in the effectiveness
    of our products and people. Without it, there are limitations to our ability to
    provide early threat detection and advance risk assessment. Now can we quickly
    find culprits in the aftermath of a tragedy. For this deficit, we pay in both
    blood and treasure for a situation that can be vastly improved with the right
    algorithms.


    What would it take?


    There are over 40 million electronic security systems installed in homes and businesses
    in the United Sates alone and many times that around the world. They collectively
    produce a rich stream of data at high volumes, high'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# The Case of the Missing Data


    velocity, high veracity, and with a fair amount of variety. Unfortunately, most
    of these data go unused, and in that, we are not alone. Studies indicate that
    only 1% of digital information is analyzed. The rest wastes away as dark data;
    its value never unlocked. That’s more than a unfortunate irony, especially for
    security data. Security organizations and service providers have made huge investments
    in data collection but less in its analysis. It’s a classic case of getting the
    ball down to the 1-yard line but not into the end zone.


    Electronic security systems have always produced a lot of data. Every time a door
    is opened, a camera detects motion, or a new visitor crosses a threshold, our
    systems capture its digital record. While our ability to store all these data
    have been growing for decades, IoT sensors are driving data production to flood
    levels. Vast numbers of inexpensive sensors produce more data than ever before.
    Advances in speed and processing power of GPUs have made it possible to track
    more activity in any given video stream


    The state of the art is based on user interface conventions that have been around
    for a long time in physical security, network administration, SCADA, and similar
    applications that to visually represent large quantities of real-time information.
    Users can watch graphs and other dashboard widgets that reveal trends, warn of
    crossing over predefined limits, and generally summarize low-level data points
    into coherent. For those who really want to dig in, it’s always possible to watch
    filtered events scroll by one at a time as they occur (not recommended). All of
    these systems produce reports, some predefined and allowing a greater degree of
    customization. In all in, we have a lot of output from these systems, but are
    they telling what we want to know?


    In many cases, no.


    Many organizations buy security systems and then never look at the data. Watching
    graphs, charts, and streams of events on a display is tedious, and noteworthy
    events are rare. With high ted and low reward, the mind wanders. The crux of the
    problem with the state of the art: we’ve done a great job of deploying systems
    and collecting data but less so at applying data science in a way that reveals
    what we want to know. Our work is only half done. The good news is that there’s
    an opportunity for improvement and the tools to do the job.


    Algorithms that identify important events and warning signs can now sift the data
    we’ve been expecting our security personnel to interpret. One of the most important
    things algorithms can do is to improve the signal-to-noise ratio in our data.
    Algorithms that incorporate artificial intelligence or machine learning may make
    judgments about what is happening in a given scenario and provide us with a predigested
    conclusion we can act on.'
