- pgno: 27
  md: '# From Premobile to Mobile First 7


    No less than identity and access management, public key cryptography (PKI) and
    digital signatures were essential 15 years ago to solve the trust problems that
    still plague IoT. For the SmartBox, using digital signatures as a surrogate for
    humans solved chain-of-custody issues for the journey of a package, from consignment
    to carriage to customer.¹ When the consumer-driven SmartBox morphed into an access
    control panel, brought its X.509 digital certificates with it and became the first
    commercial system to do so. The use of these certificates is now widespread on
    networked security equipment.


    Sells apparently. So does good industrial design for IoT products. IDEO, the renowned
    Palo Alto-based design firm and early, created the SmartBox design. The aesthetic
    grace of their work landed this access control system for the pages of Wired,
    Bloomberg, The Chicago Tribune, ABC News, and a screen performance on Morning
    America. The same attention to design is a hallmark of nearly every successful
    IoT product.


    The SmartBox started out as a consumer logistics product. The uncanny forces of
    the market and opportunity drive it straight into consumer security. This story
    is not unlike, and that''s the crux of the matter for the flurry of innovations
    transforming the product landscape today. They have become more capable of jumping
    across categories than ever before. They mutate from one application to another.
    It''s all happening more quickly than the pace of traditional product design.
    If you are making products, that''s a worry, but if you are buying design, life''s
    never been better.


    For companies or products that don''t keep pace, displacement can be permanent.
    The SmartBox escaped that fate by staying smart but losing the box. An investment
    banker''s insight into back-of-the-napkin drawing gave it the first push in the
    right direction. Later, the eureka moment was that people are like packages and
    buildings that are just big boxes. In a lucky irony (for me least), online commerce
    has just done leaving packages unprotected on doorways and porches everywhere,
    but security will never be offline.


    # FROM PREMOBILE TO MOBILE FIRST


    Say you never forget your first.


    Mobile phone, that is mine. Mine did little more than voice calls and short texts.
