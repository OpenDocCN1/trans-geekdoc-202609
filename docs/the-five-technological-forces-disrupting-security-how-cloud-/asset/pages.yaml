  md: '# CHAPTER 8: Why IoT Matters in Security


    Raspberry Pi. The success of commoditized low-cost parts, combined with low-cost
    cloud infrastructure, can undercut traditional security designs because it''s
    fundamentally about information. I don''t hear many of my colleagues worrying
    about this, but they should.


    Despite worries for suppliers, the benefits for security organizations are clear.
    It has become cheaper to create and transport situational intelligence (more security
    at a lower cost). More expensive solutions will be crowded out of the market.
    However, price competition for the IoT-plus-cloud paradigm might take some time
    because we are still in the early adopter phase. You need at least a mass of the
    early majority to begin shaking out the market and to find an equilibrium point.


    What brings us here?


    Earlier, we saw that cloud computing provides a significant cost reduction over
    on-premise computing. For IoT devices, cloud will be the only option. They were
    born there, and they are not going to leave. They have been conceived, designed,
    manufactured, and deployed on the assumption that they communicate with cloud
    services for every aspect of extracting value from the information they produce.


    A second cost factor is wiring, and it''s a foregone conclusion that IoT devices
    will use wireless communications instead of expensive wires. The third major cost
    factor is power consumption. Again, most IoT devices are designed to run on small
    batteries for long periods of time, which makes them far more competitive than
    the alternative.


    All these affect your supply chain.


    For equipment and software suppliers, IoT transformation charts a roadmap with
    traditional product design supplanted by new design principles. Lightweight beasts
    heavyweight. Cloud off the shelf cuts custom. Not to be ignored, customer expectations
    for the user experience actual products will shift the same way they did for user
    interfaces over the last technology cycle. Missed out on that anytime-anywhere-cloud-browserresponsive
    thing? It''s coming back. This time on Amazon Dash Button.


    Like all before it, this new technology requires new skills for system integrators
