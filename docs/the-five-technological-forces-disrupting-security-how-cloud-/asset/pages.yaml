  md: '# ANTHOMETRICS—WEB METRICS IRL


    Anthropometrics—derived from the Greek word anthro (“man” or “mankind”) and the
    Latin word metricus (“measure”)—is the science of measuring the behavior of large
    groups of people in a specific context, literally “the measure of man.”


    Anthropometrics have become part of the fabric of modern society. It drives our
    consumer economy with Nielsen ratings, focus groups, surveys, ad tracking, and
    in sum, by measure of gross domestic product (GDP). It is at the center of understanding
    modern democracies by vote of polls, opinion surveys, political contributions,
    and the very act of voting itself. It’s the foundation of the Internet economy,
    with detailed analytics on the minutia of online behavior, from unique daily visitors
    to click-through rates and dwell time on Web pages.


    Such analytics provide an adaptable model that points to the useful insights in
    the physical security domain. This type of analytical approach can also turn security
    data into operational data that we across the entire enterprise. Visitor traffic
    patterns are directly relevant to building services and energy consumption, for
    example. Retailers can get enough data to illuminate behavior, and security can
    again gain value with passive surveillance data filtered and enriched through
    analytics.


    The parallels between traffic analysis and physical site analysis are remarkable.
    Take traffic statistics. Unique visitors, first-time visitors, and repeat visitors—all
    core elements of online analytics—map from the virtual world to the physical world.
    Presence data make this mapping possible. The number of unique visitors tells
    us many things, like the number of people we need to plan for. That useful information
    to a security organization because greater numbers of people often signal greater
    risk. Being able to see new patterns sooner time to respond by reallocating resources,
    redirecting staff, or provides the opportunity to recognize and anticipate periodic
    or seasonal patterns. Knowing about these patterns means security organizations
    [sic: original text says security organizations] can plan for handling them differently
    in the future. At the very least, knowledge of these traffic patterns will have
    operational value for every other part of the business.


    The second major analytic we can carry over to the physical world is the number
    of first-time visitors in the overall population. This metric tells us what percentage
    of the population has never been observed. For almost any type of institution
    open to the public, this is useful information on how your customers behave, another
    example of turning security data into operational data. First-time visitors should
    correlate with the number of visitor'
