    # LESSONS FROM CYBER SECURITY


    Cyber security is lighting the path for the development of big data applications
    in physical security. There are tens of millions of website attacks per day and
    billions of malware exploits, to say nothing of personalized phishing attacks
    and just plain old-user error. Sorting through all of this is daunting enough,
    until you consider it''s mixed with trillions of legitimate messages at the same
    time. This turns into a problem of gargantuan data collection and real-time analysis.
    Cybersecurity systems are an interesting case study because the event rates they
    handle are literally the highest velocity in the'
