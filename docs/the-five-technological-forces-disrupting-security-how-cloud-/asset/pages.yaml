- pgno: 233
  md: '# The Secrets of the Universe


    When I first entered the security industry at the height of the dot-com bubble,
    it struck me as having a steampunk quality compared with the business consulting-
    and Web design world I had just left behind.


    Analog CCTV cameras used Leave It to Beaver era television signal formats and
    sent them down hose hose braided coaxial wires. Electronic security systems exchanged
    data over heavyweight cables that would have looked at on a Teletype machine.
    The last disruptive advance for intrusion systems was the digital alarm communicator,
    a Disco invention that roused operators at central stations via copper lines.


    IP had barely shown its face in the industry and was far from being a shoo-in
    as the next reigning, industry-wide arguments raged over whether it was reliable
    enough or remotely secure enough for the important business of physical security.
    (Hint, it is.)


    Against this backdrop, I naively thought that that broke all the rules might be
    greeted as a liberator. To many ears, our message sounded more like "we are from
    the dot-comb and we''re here to help." Skepticism towards outsiders runs deep,
    especially if they arrive with the smarter-than-you swagger that characterizes
    many startups. In the first decade of my own experience with this market, I saw
    a number of would-be cloud companies make a run at the industry, only to run out
    of gas before they could get enough traction to sustain themselves.


    It''s not the industry appreciate new technology. I''ve never seen a group of
    people who love a good discussion more than a gathering of security pros. But
    it needs to pass muster with tough-minded integrators. It needs to make sense
    to the CSO who is quite literally making a career decision with every selection
    of new technology. It needs to make sense financially to the small business owner
    who needs to protect his business.


    On the one hand, security organizations are as enthusiastic as anyone to use new
    digital tools that work smarter, better, and faster. On the other hand,


    213'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# CHAPTER 20: The Secrets of the Universe


    know that unattended equipment really, really has to work. And very often,

    bleeding edge technologies don''t. Therein lies the tension of technology adop-

    tion the physical security industry.


    Reboot and call me in the morning is not an option.


    # ADOPTION SCORECARD


    I used to joke that everyone in the industry must be from Missouri, because it''s

    like living in one giant show-me state. Early adopters are hard to come by, no

    wants to go first. This makes the problem of crossing the chasm, to revisit

    geoffrey Moore''s metaphor, especially acute.


    One of Moore''s basic tenets is that in the early stages of technology adoption,

    people don''t follow the examples of leaders outside their own vertical indus-

    tries. People in health care want-health examples, people in retail want

    retail examples, and people in security want security examples. That''s why it

    d''nt particularmente matter to most security practitioners that all of Silicon
    Valley\had gone over Web technology by the late 1990s. They needed to hear it

    from someone else. Someone they already knew.


    The stereotype of the early adopter is that they work in a small, maverick com-\many
    breaking tradition across many dimensions, including the way they

    acquire and use technology. Startups today don''t even consider the old enter-

    prise application approach for their computing needs. They go to the

    cloud, straight to open source, straight to social, and straight to a subscription

    revenue models.


    Sometimes, though, it''s the industry giants that come out of the gates. ADT

    is a case in point. They adopted my company cloud technology by way in

    2003, less than 2 years after we brought it to market. Jay Haunn, VP of

    product management, was responsible for moving the biggest name in the secu-

    ity into the cloud. He still tells the story of how the former CEO of

    ADT''s parent, Tycho International, tapped him on the shoulder day one and\asked
    him to check out this startup with a cloud subscription model for access

    control. As a dyed-in-the-wool recurring revenue company, it fit with ADT''s

    worldview to incorporate this new model as another line of business. Early

    adopters sometimes up where you expect them.


    Anecdototes make for memorable stories, but what we''re really interested in

    how the industry as a whole is being transformed by each of the five forces

    trace through this book. How much of an impact has each of them really

    made? How much more potential do they have to improve or disrupt?'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Adoption Scorecard 215


    The more I thought about this, the more I found that I needed to develop a scoreboard
    and treat each one as running its own race. The horses at the Kentucky derby don''t
    all cross the finish line at the same time and neither will these technologies.
    It also became evident that a single score for both commercial and residential
    systems would not do justice to sizeable spread between these two categories.
    And, while we have not focused on residential systems in this book, it is instructive
    to view them as a leading indicator of where commercial systems are going.


    Table 1 uses the families of the technology adoption life cycle to score the progress
    of both commercial (C) and residential (R) systems along this continuum. In almost
    every single case, residential systems are further along. The reasons have nothing
    to do with the suitability of the technologies in each market; everything to do
    with who the buyer is, but the channel and end user level.


    Cloud. Commercial security systems show up as early adopters of cloud technology
    because market share for cloud systems is still in the single-digit percent, dwarfed
    by traditional on-premise deployments. The cloud version of electronic access
    control, access as a service (ACaaS), has a market share of less than 5% as of
    this writing, although the research firm IHS predicts a healthy compound growth
    rate of around 20%. The cloud version of video surveillance, video surveillance
    as a service (VSaaS), is also currently below 5% and growing at a compound annual
    growth rate of nearly 20%.


    In residential systems, the picture is quite different. Cloud adoption is well
    into the late majority stage. All the residential market leaders use cloud platforms
    to provide interactive security and automation features that are nearly indistinguishable
    in terms of systems architecture. Residential security providers have no choice
    but to use the cloud (not that they would want to otherwise). With customers numbering
    in the millions, there is no other way to deliver an interactive experience at
    this scale. It''s what the cloud was designed do.


    | Table 1 Technology Adoption Scorecard |

    | Innovators | Early Adopters | Early Majority | Late Majority | Laggards |

    |---|---|---|---|---|n| Cloud | | C | | R |

    | Mobile | | | C | | R |

    | IoT | | C | | R |

    | Big data | C | R | | |

    | Social | C | R | | |'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# CHAPTER 20: The Secrets of the Universe


    Mobile. Mobile is further along the technology adoption curve than any of the
    other technologies we''ve examined. That''s not surprising, because in general
    it is the most consumerized, accessible, and globally penetrated. To be at their
    most effective, mobile applications require a cloud backend. The willingness to
    fully engage cloud services is once again the underlying factor in differences
    between commercial and residential adoption.


    In residential systems, mobile applications are nearly universal for the reason
    that cloud is nearly universal; they are the best way to deliver an interactive
    experience. Every interactive consumer security platform of scale has a mobile
    app—without exception. The widespread availability of mobile-enabled products
    has all but eliminated the scales of systems that do not have them. That''s the
    textbook definition of technology adoption by laggards; they buy it when the older
    alternatives are simply longer available in the market. Security systems without
    mobile apps become the rotary phone of the residential security market.


    No so in commercial security, although it is catching up. Customer premise systems
    have been adding a few morsels of mobile capability. (I have), you''ll wish you
    hadn''t. Where there is cloud, there is mobile, and where there is not, it''s
    frankly bit of a hack. The effect is friction and resistance to rapid adoption.


    For these reasons, commercial security systems have not moved as quickly as residential
    systems and have only reached the early adopter stage so far.


    IoT. Depending on how you define IoT and the relevant market segment, identical
    security systems are somewhere between early adopters and late majority.


    Recall that earlier I made the case that the security industry is the original
    IoT pioneer. In this respect, nearly every device in a modern security system
    is an IoT device, connected back to the Internet through a gateway (otherwise
    known as a control or alarm panel). If every interactive residential system sold
    today is based on the cloud, then every one of them has a deployment of IoT devices
    inside the home. In this respect, the penetration of IoT among buyers who use
    any system at all is nearly 100%. You just can''t buy a system that doesn''t include
    IoT, even if you are a laggard.


    The story is somewhat delayed again in the commercial sector. A large percentage
    of commercial systems are still isolated on corporate networks. They may provide
    a small window of visibility to Web browsers and simple mobile apps, but most
    of their capabilities and data are inside a walled garden that prevents them from
    being useful as they could be.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Adoption Scorecard 217


    Times are changing, however. First, Internet-connected sensor networks are becoming
    a compelling value proposition. Longer-range radio technology and improvements
    in battery lifetime are making these more practical than ever. A growing percentage
    of access control points are now being equipped with wireless locks—that is, IoT
    devices—connected to cloud-based management systems. Video surveillance is also
    adopting an IoT framework. Past barriers of bandwidth and storage are falling
    due to edge computing, video analytics, and massive increase in inexpensive data
    connectivity available to even the smallest of businesses.


    For these reasons, commercial security earns a rating of early majority. That
    said, it is on the move toward more universal adoption of IoT technology in the
    very future and will soon reach lately as older technologies disappear from manufacturer''s
    catalogs or are displaced by new market entrants.


    Big Data. Everyone looking at the future of security technology sees the promise
    of big data. The question is when. pattern recognition and predictive analytics
    that can be built with big data platforms are two of security’s holy grails. Investigators
    and law enforcement look forward to forensic searches across big data stores that
    provide answers of magnitude more quickly than what we have today.


    The first thing we need, though, is data. Residential security and home automation
    are once again in front of them. They are natural aggregators for the data output
    from millions of homes. A few of the larger residential services have announced
    big data and machine learning to take advantage of this information and improve
    the services available to their customers. This is promising and earns a score
    of early adopter.


    Big data has virtually no presence in commercial security systems for the primary
    reason elaborated earlier; have yet to migrate to the cloud in sufficient numbers
    to build up data repositories. Said, big data and analytics will become parts
    of the bigger, smarter, faster systems of the future and the emergence of data-driven
    security as a new model.


    Social. At this moment, social has more promise than track record for electronic
    security. I believe that this is a usability problem more than a usefulness problem.
    There is also a trust problem buried in there, but let’s look at each of them
    separately.


    The usability problem for social physics in physical security is that it is difficult
    to configure these platforms for the kind of targeted messaging needed for security
    notification scenarios. This challenge makes it more straightforward to use more
    direct conduits like e-mail or text or in-app messaging. They are also easier
    to set up, since everyone knows how they work.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# CHAPTER 20: The Secrets of the Universe


    Outside of security, social log-in has a healthy degree of adoption as a single
    identity that can be used across multiple contexts. Some 80% of us have used social
    log-in to create new accounts on the Internet and subsequently log in through
    the same mechanism. However, it is unclear whether this mechanism will retain
    power in the face of mobile log-ins that use biometrics (e.g., finger-prints)
    as credentials for an increasing number of apps.


    Summarizing all of these factors, social is rated as innovator or early adopter
    (aka visions) for both residential and commercial uses. The bottom line is that
    social log-in has not crossed the chasm to mass adoption—least not for security
    applications. My guess is that it will end up being stranded a while longer.


    But it''s not all bad news for social in security. Recall that social does have
    a growing presence in public safety and mass notifications, as well as personal
    safety check-ins not related to electronic security. In these cases, the very
    properties of social networks make them a little messy for directed communications
    actually make them useful for fuzzy notifications to perhaps reach more than intended.
    The information bleeds from “Friends” to “friends of friends” that is what you
    want when you are screaming “fire!” in a crowded theater. You want to people in
    the lobby to hear and get the out.


    # MY GENERATION


    There''s no way to say this without the risk of ageism, but some aspects of adoption
    are simply a generational. Young people get it; old people don''t. Today, means
    millennials are the primary vehicles that will drive the five forces for the rest
    of the way into the market. This truth has a major factor in my experience of
    how and where they have shaped the industry.


    One of the clearest examples comes from my own sales who spend most of their time
    with the integrator community. They can pitch to a mouthful of commercial sales
    reps that cloud and IoT are the way forward for security services and devices.
    At one desk sits an integrator veteran who proclaims with confidence and bluster,
    “My customers will never use that technology. There''s no way they will store
    their data off-site, and no way they will pay a penny fee.” At the next desk sits
    a fresh-faced college grad who, upon hearing the patch, says “Yeah, I get it.
    That is everything is now.


    What you can depend on what you believe, which is why the younger reps with no
    negative bias toward new technology are usually more successful representing these
    new technologies. What''s true at the individual level is also true at the company
    level, with newer system integrators staking their business on being 100% cloud-based.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# A NEW MISSION FOR SECURITY


    I have found that people in the security industry are deeply committed to making
    life safer and better for their employees, their customers, and the public at
    large. Every one of the professionals I work with knows that if they don''t their
    job right, a company could lose valuable property, an entrepreneur could lose
    her small business, or someone could lose life and limb. They know that the difference
    between getting it right and getting it wrong in a classroom of children. This
    makes our careers a very personal and meaningful contribution to society as a
    whole.


    The industry is all about products and professions that literally make a life-or-death
    difference in the daily lives of real people going about the basics of work and
    family. In an age of increasing terrorism and violence, they are no longer optional.
    They are essential to living without undue fear. They are essential to ensuring
    that violence touches as few as possible.


    Even so, an odd thing happens when people start evaluating the risks versus the
    cost of protection. They start to wonder if it''s really worth spending the money
    on systems designed to prevent low-likelihood events. We see this all the time.
    People hear about burglaries in their neighborhood, and they call for an estimate
    on a security system. A few weeks go by with no more bad news, and then they decide
    they don''t need it all. An ex-employee who still has a keys to the office and
    steals a computer or two, and the business owner decides it''s time for electronic
    security. A month goes by, the worry dies down, and with no security, the entire
    staff is still vulnerable to the next disgruntled ex-employee—who may do far worse
    than walk off with a laptop.


    We forget about the squeaky wheel as it stops squeaking.

    To get beyond, security product and service providers would do well to keep in
    a broader mind that enables the benefits to be obvious even when nothing is going
    wrong. As the five technologies transforming security deliver on their promise,
    all of us will be better able to accomplish that goal.


    # WHAT GOES AROUND COMES AROUND


    A funny coincidence just happened, literally as I was writing the closing chapter
    of this book. I received an unsolicited e-mail from a young entrepreneur who had
    launched a company that provides a secure, cloud-based, connected mailbox. They
    don''t call it a SmartBox, but they might as well. Its purpose is to keep package
    deliveries safe until the owner uses access credentials to open'
