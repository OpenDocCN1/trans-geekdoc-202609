- pgno: 103
  md: '# Why IoT Matters in Security


    When a cow is healthy and behaving normally, it behaves normally. It wanders around
    the farm in a certain way, comes back to feed at certain times, and hangs out
    with other cows throughout most of the day. But if a cow becomes sick or lame
    it gets stuck somewhere, its behavior changes. It may no longer wander around,
    it may not come back to eat on schedule, and it may be off itself instead of hanging
    around with its fellow bovines. The question is how do you know?


    A farm in Essex, the United Kingdom, tags each of their cows with a GPS unit and
    RFDs so that they can identify and track a history of their movements. If there
    is a change in their normal routine, they can find it and take a look. The farmers
    calculate that early detection and treatment of any maladies saves about 300 pounds
    per incident, which more than pays for the equipment.


    What does this have to do with security?


    Instead of farms and herds of cattle, think of a modern office building and herds
    of people. The great thing about people is that most have already tagged themselves
    by using a cell phone (which spares us the trouble of trying to catch and tag
    them an RFID chip, convenient!). After all, a cell phone can tell us where they
    are and who they are. All we need a sensor system to capture data. As employers,
    property managers, or security managers, we can establish a baseline of normal
    behaviors for the people on our *farm* and get notified when the system sees significant
    changes to the baseline.


    With intelligence embedded in every object and ecosystem, IoT introduces unprecedented
    levels of convenience, choice, and challenges. They enhance our ability to analyze,
    predict, and react to conditions in our environments. They make us safer and more
    exposed. They provide deep personalization and challenge our already strained
    comfort zones around personal privacy. They enhance our experience of technology
    and create cyber security challenges at a scale beyond what anyone has experienced.


    83


    The Five Technological Forces Disrupting Security. http://dx.doi.org/10.1016/B978-0-12-805095-8.00008-9\©
    2018 Elsevier Inc. All rights reserved.'
