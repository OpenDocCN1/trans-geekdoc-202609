  md: '# 136 CHAPTER 11: The New Playing Field


    lumped together as “electric appliances” only because they had one thing in common:
    they were powered by electricity channeled through an electric motor.


    Moreover, they were manufactured by different companies, sold in different markets,
    and purchased by completely different buyers. In manufacturing, we have the following:
    the Hoover Company for vacuum cleaners; the Ford Motor Company for industrialized
    conveyor systems; and the Babson Bros Co. for the highly regarded “surge milker,”
    one of the first in its category to overcome objections to efficiency, sanitation,
    and cow safety. Markets for these products were, respectively, mail order catalogs,
    business-to-business industrial sales, and agricultural fairs and the proved farm-to-farm
    traveling salesman. In short, there was no reason to think of them as a category
    until later, when mergers and acquisitions consolidated electric manufacturers
    and multi-retailers consolidated the end-user marketplace. General Electric stands
    out as an early aggregator in this regard, producing light bulbs, electric motors,
    and finished appliances—not to mention their biggest hit, “electricity as a service”—otherwise
    known as the power that comes out of wall sockets.


    In the early history of electric devices, it would have been odd to ask questions
    like: “what’s going to be the big winner in electric appliances: curling irons
    or electric drills?” They are both meaningful entrants within their own categories,
    but there is no reason to measure them each other. What is meaningful is to look
    at how each product would change its market, but that’s a far cry from the apples-to-oranges
    commentary we hear today.


    The stories of these recent waves of new technologies—desktop computing, Internet,
    mobile computing, and now IoT—have lost some of their native punch over familiarity.
    If you are a baby boomer, for example, you’ve witnessed the introduction of all
    four in your lifetime and probably incorporated them into your lifestyle. If you
    are a Gen Xer, you had at least the first of these new technologies—desktop computing—by
    the time you finished high school and certainly for your full professional life.
    If you are a millennial, you got lucky, had all of them your whole life, and probably
    can''t imagine a world without them.'
