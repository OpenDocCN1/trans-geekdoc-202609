- pgno: 61
  md: '# Going Mobile


    Recent surveys indicate that most of us check our smartphones around 85 times
    per day and touch them astonishing 2617. These compulsive habits have elevated
    mobile usage to the dominant share of time we spend online, with smartphones now
    driving over half of Internet traffic. Much of our consumption is personal, but
    an increasing amount is for business and commercial transactions. With the blurring
    of lines between the personal and professional, we do both whenever we light up
    the screen.


    As recently as 5 years ago, few of these professional use cases concerned physical
    security. Most security organizations IoT were still bound to thick clients on
    desktops. The earliest mobile security management apps had just made the scene
    and provided only a fraction of the features available on their full-strength
    desktop or web counterparts. Video surveillance apps were an early favorite, mesmerizing
    users almost well as YouTube and certainly far better than what static rows and
    columns of data could ever achieve. Next administrative applications for access
    control and building information systems, followed by dozens of freestanding IoT
    dashboards. Last to the show were mobile credential applications that let tenants,
    employees, guests, and other occupants of our properties open doors with their
    smartphones for the first time in history.


    These mobile apps have gone through several evolutionary cycles over the past
    few years, they have begun to cluster around three distinct user groups; first,
    administrative applications designed for members of the security team; second,
    occupant applications using a very broad definition that includes tenants, employees,
    residents, customers, and anyone else within a security organization''s purview;
    and, third, presence applications, a small but growing group that provides two-way
    information and services "in the background," as we software types like to say.


    Fourth, smartphones will stand in the role of passive surveillance in physical
    security. Unlike the previous three, it does not require the use of an app or
    any cooperation on the part of the user. Cell phones are radio transmitters'
