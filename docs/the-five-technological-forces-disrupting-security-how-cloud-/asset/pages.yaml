  md: '# Altered Presence


    *In Being There*, the 1979 movie adapted from Jerzy Kosinski''s novel of the same
    name, a simple-minded gardener is mistaken for a savant with oracular powers of
    insight about such complex subjects as international finance and world politics.
    The wealthy sophisticates around him hang on his every word and, paradoxically,
    derive great and unintended value from his dim-witted utterances. Just being there
    is all that Chauncey Gardiner needed to do to enlighten those around him.


    For everyone who carries a smartphone, simply *being there*—in a building or a
    public space or roaming the open roads—is now enough to provide valuable security
    data and services. It is also the basis of widespread concerns about privacy,
    incidental surveillance and the wholesale monetization of every digital interaction
    we have with the rest of the world. While just sitting in our pockets, our mobile
    devices gather and create information derived from security technology. As Chauncey
    Gardiner might say, "this is like television, only you can see much further"


    But it''s not all doom and gloom.


    # PRESENCE


    One of the first elements of our ecosystem is what I call “presence,” the sum
    total of all the interactions we have by virtue of having a smartphone or wearable
    device. Today, this is nearly everyone, with the number of mobile devices surpassing
    the number of human beings on the planet. Admittedly, some of us skew this by
    having more than one device (e.g., a smartphone and a smartwatch), but the numbers
    continue to grow.


    If Herbert Hoover were alive, he wouldn''t talk about a chicken in every pot and
    a car in every garage; he''d sell the idea of a smartphone in every pocket. But
    then again, he wouldn''t have to, because we''re nearly there. As of 2017, the
    number of mobile subscriptions is on par with the global population of 7 billion;
    nearly half are smartphones. If you think that''s going to leave people'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# CHAPTER 6: Altered Presence


    out, think again; futurists predict the integration of the smartphone with human
    beings (cue Robocop) as creepy as that might sound to us today.


    The concept of presence begins with our security ecosystems sensing where we are
    and what security services might be relevant. This isn''t just a matter of repetitive
    surveillance. When we approach an entrance, for example, the system can open a
    door or the building gate for us or simply announce our presence. Presence services
    continue when we favor the lobby and the intelligent dispatch algorithms automatically
    summon an elevator already programmed to take us to our usual floor. When we enter
    our offices, presence takes notes and marks us down as "in" for convenience of
    our colleagues ("Steve here yet?"); for safety ("we have a leak, has everyone
    cleared the building?"); and the occupancy algorithms ("what kind of foot traffic
    do our elevators have?).


    Presence applications provide automated or background interactions with our environments.
    They require a user to download an app, register under their assigned identity,
    and be authenticated at one or more levels depending on the services in question.
    In access control, for example, presence might mean having your smartphone in
    your pocket is enough to activate and unlock doors, elevators, and other service
    points in your environment. Presence services contrast with other security and
    mobile credentials without requiring the user to take any explicit action. They
    run in the background on your smartphone, always active. Most importantly, because
    your identity has been registered in all these cases, movements and interactions
    create an identifiable individual history of your presence within a given environment.
    Presence is simply a matter of being. We produce value and create interactions
    by showing up.


    # PASSIVE SURVEILLANCE


    The flip side of presence is passive surveillance, often perceived as the evil
    twin of all those positive services that come with the ambulatory radio beacon
    our phones have become. The very networks of wireless sensors that provide conveniences
    for everyone uses public spaces can also keep track of everything we do while
    there. In the real world, as it is online, surveillance comes at the price of
    a good user experience. You want to be relevant while surfing the web? Let me
    tracking cookies in your browser. You want a physical ecosystem that responds
    to you as an individual? Let me install a mobile identifier that tells me who
    you are. You want to know who is in your building and where they are? Convince
    them of the benefits of your magical app.


    Passive surveillance, as its name implies, requires no knowledge or participation
    from the user. It does not require an app download or user registration.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Known Knowns, Known Unknowns, and Unknown Unknowns 63


    Instead it operates by collecting the digital footprints smartphones leave behind
    while we go about our ordinary business. Routine tasks such as surfing the web,
    reading e-mail, or simply leaving Bluetooth on transmit nature signals that can
    be captured by Wi-Fi access points. Bluetooth receivers, and similar listening
    devices, all of which can be installed discretely in any physical space. These
    technologies provide security organizations a much clearer picture of what smartphone
    users are, how long they''ve been there, and whether they''ve been there before.
    Unlike applications that by definition require user consent, passive surveillance
    systems, well, don''t.


    Designed to benefit both the subjects and the security organization, passive surveillance
    perhaps a less ominous and more accurate term would be “passive sensing” provides
    reciprocal for the observer and the observed: forensics, and real-time information
    all of us safer. Much of passive electronic surveillance has involved anonymous
    data collection, although the equation is changing due to ubiquitous and pervasive
    computing. If you haven''t heard those terms, they refer to the idea that computing
    can now place in any device, in any form, or in location.


    Skynet''s in your coffee maker or toothbrush.


    Before pervasive computing gave cameras and related security systems the power
    to run good analytics, video surveillance captured images with little or identifying
    metadata besides a time stamp; you had to use eyeballs to figure everything else.
    Faces and other details might make it onto tape (if you''ll forget the anachronism)
    but painfully identified only at a later time with untold hours of human labor.
    The unmasking of the London subway bombers in 2005 or the identification of the
    Boston Marathon bombers in 2013 required analysts reviewing the footage, frame
    by frame. Imagine if minutes after the attacks, police had a list of suspects.
    Instead, it took 3 days to identify the two Boston bombers and another 2 days
    of an intensive manhunt and eventually a shoot-out. Passive surveillance would
    have been mitigated or avoided altogether.


    # KNOWN KNOWNS, KNOWN UNKNOWNNS, AND UNKNOWN UNKNOWNNS


    As Defense Secretary Donald Rumsfeld said, we have known knowns, known unknowns,
    and unknown unknowns. It turns out these categories perfectly match with different
    degrees of knowledge mobile technology can provide for passive surveillance.


    Known knowns are the low-hanging fruit of wireless surveillance—cooperating subjects,
    either willing or by mandate, who carry a security or identity application that
    identifies itself to the rest of the mobile ecosystem. They are friends of'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 64 CHAPTER 6: Altered Presence


    surveillance and provide the richest data because they are part of the program.

    Think of groups like employees, tenants, contractors, and visitors, each using
    an app to access a building, a computer network, or another corporate asset. As
    they move through our physical spaces with our identity apps, we can follow them
    by name. The same apps use to open doors, elevators, and conference also transmit
    identity beacons. We have ambient sensors like Wi-Fi or Bluetooth access points
    listening for these signals and capturing their airborne name tags, reporting
    back to a central database. These are our known unknowns.


    The known unknowns are like the new neighbors down the street. We can see them
    and hear them, but we don''t know their names yet. There are many reasons for
    known unknowns to forego identity apps that talk to us directly. Think of shoppers,
    sport fans, and people queued at a movie theater or waiting for a slice of pizza.
    They are not a “captive” population like employees or tenants.


    They roam our physical spaces anonymously. We can detect their smartphones, but
    their identities aren''t mapped onto our mobile security ecosystem. Yet, in this
    comparatively data-restricted scenario, their mobiles transmit radio signals by
    which we can tell them, not by name, perhaps, but by the identity of their mobile
    platform. Even without identity links, these signals still provide valuable security
    and occupancy information for use during emergencies or for understanding building
    usage patterns. Often, these signals are processed into heat maps showing where
    traffic flows through hallways and courtyards, and which entry points are the
    busiest throughout the day


    The unknown unknowns are the dark matter of our surveillance universe. Invisible
    in many respects, we know them by their effect on the rest of the ecosystem. They
    can be dark for a variety reasons. They might be one of the rare birds that have
    no mobile device at all—an increasingly rare phenomenon but still a possibility.
    Or they may have disabled the Wi-Fi and/or Bluetooth on their smartphones, or
    put phones in airplane mode. Few people go to these lengths in the normal course
    of a day, but tales of hacking and eavesdropping have pushed at least a percentage
    of the population into stealth mode for fear of identity theft (or worse).


    Passive collection of presence information throws light on all of these groups,
    with the exception of the unknown unknowns. For them, we will still need to rely
    on video images, facial recognition, human witnesses, and old slefashioned. But
    the data that our physical security systems can collect with Bluetooth and Wi-Fi
    move our discipline one step closer to the kind of analytics our IT brethren have
    enjoyed for years. If you''ve ever looked over their shoulders to see what their
    analytics delivers, you''ll know that''s a good thing—a big step up in many cases.'
