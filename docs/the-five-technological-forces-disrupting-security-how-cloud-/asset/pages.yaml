- pgno: 77
  md: '# One Key to Rule Them All


    But there were several important differences between the work of credit cards
    and the world of electronic access. First, the credit card industry long ago agreed
    on technical standards so that every credit card reader works with every credit
    card. This interoperability implies many layers of agreement between bankers,
    merchants, manufacturers, and payment processors: identically, standardized data
    encoding, interconnected networks, and—perhaps most importantly—agreement on who
    you are.¹


    The world of electronic access control, for residential and commercial, lacks
    this degree of standardization. Users need different apps, have different user
    experiences, and need to master different programming procedures for every brand
    of equipment they encounter. Imagine if your Ford needed to go to a different
    gas station than your Chevrolet—to say nothing of Tesla—and you had to memorize
    which cars fueled up at which stations. Maddening. In fact, we’re seeing this
    friction with electric vehicles, played out as an excruciating chicken-or-the-egg
    dance between manufacturers, consumers, and infrastructure providers. We are at
    the same point with technical standards for smart locks, except there is barely
    a chicken or egg in sight.


    The forging of technical standards among competing companies has always been something
    of a mud wrestling contest. Everyone enters the ring hoping that technology will
    win, and they all leave dirty and dissatisfied. But technical standards are actually
    the easiest part of this problem. The bigger issue is identity.


    Identity has emerged as industry analysts like to call “the new perimeter.” The
    metaphor is apt because your identity now forms a boundary around your assets,
    both physical and digital. Your identity lets you in—to your bank account, for
    example—and keeps everyone out, unless someone steals your identity. In case,
    they’ve breached your perimeter and have access to your world.


    In the case of buildings with access control or smart locks, your identity lets
    you in and tells the building owner you’ve been there. Imagine the damage and
    havoc someone could wreak if they stole your electronic identity and could come
    and go in your apartment as they pleased. That’s why each institution issues a
    token to each person who uses their facilities, making our key chains heavier
    with fobs, our wallets thicker with plastic, and—soon—our smart-phones more cluttered
    with apps.


    > ¹Who you are and how you prove it is at the heart of the current rise in identity
    theft, which is a topic for another chapter.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# APPLEPAY FOR SPACES


    If there was something like PayPay for spaces—a single app that would let you
    present your credentials at any access control system anywhere, the same way that
    PayPay or AndroidPay could be used at any credit card terminal. Your mobile credential
    app could be used at any managed access point.


    If there were such an app, the user experience would be nearly identical wherever
    you went. This is a big deal, because today every app has a different set of gestures
    to make it work at any given door or facility. For some, it''s a swipe at a reader,
    for others a twist and turn of the smartphone, and for others a (nearly) frictionless
    experience of just having doors magically in front of you, like on Star Trek.
    Variety of gestures, the goal is to use a single verified identity (or at least
    a handful), with credit cards entered into your digital wallet. You would present
    yourself at any participating point and have the unique privileges that come with
    you.


    The biggest impediment to this vision is the physical security industry lacks
    the kind of technical standards that the credit card and payments industry, of
    necessity, had to adopt in order for the whole system of credit cards to work
    in the first place. PayPay and AndroidPay have the luxury of leveraging the entire
    preexisting infrastructure of the credit card industry. Most obviously, they have
    access to all the credit card terminals installed in retailers around the world.
    But it doesn''t end. Perhaps even more significantly than the physical terminals
    themselves, they also leverage the back-end processing of the giant financial
    payment networks like Visa and Mastercard.


    Bane of my existence, physical security doesn''t enjoy the luxury.


    # DON''T GET ANY STANDARDS OUT OF THIS?


    As the chairman of the Standards Committee of the Security Industry Association,
    a trade association of security manufacturers and system integrators, my colleagues
    and I are desperately trying to catch this train before it leaves the station
    for good. The Cloud, Mobility, and IoT subcommittee of the SIA Standards Committee
    has a project underway to standardize Bluetooth and other mobile credential exchanges
    for physical access control. The group was formed after many individual member
    companies had already developed their ad hoc standards for credential exchanges
    between mobile devices and readers. Unfortunately, once private companies have
    invested in their own proprietary solutions, they don''t want to invest even more
    to comply with a standard, especially when that new level of compliance won''t
    directly result in higher sales.'
