    activities, but some of these are not. Buried in these streams of sensor data
    are clues about threats that could be mitigated...if they can be detected and
    identified quickly enough. Time is of the essence, literally making the difference
    between life and death.


    Video surveillance produces one of the highest-velocity and highest-volume streams
    in the business. The amount of data produced by each camera dwarfs any other source
    in the security domain. A high-resolution camera, for example, might deliver amegapixel
    image at 15 or more frames per second. At a facility or metropolitan area with
    hundreds or thousands of cameras, this amount of data can easily lead a LAN to
    the breaking point, to say nothing of nothing. This explains why video analytics
    has been such a hot topic. Analytics can be at the edge (in the camera or other
