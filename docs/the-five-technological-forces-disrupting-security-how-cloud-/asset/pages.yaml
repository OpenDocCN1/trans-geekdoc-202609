- pgno: 65
  md: '# The Toothbrush Test


    Until very recently, our industry’s apps have been targeted at the relatively
    small cadre of security managers in our ecosystems, not for all the other stakeholders.
    They have inadvertently excluded all the employees, tenants, guests, visitors,
    contractors, customers, residents, members, and dozens of classifications for
    people who pass through our security perimeters. In other words, much of our technology
    has not included the people we protect for their partnership. But all we have
    to do put applications in their hands; once we do, commercial security applications
    will be in a position to benefit from the same interactive revolution that produced
    Web 2.0. We can think of it as Security 2.0, although I hesitate to use that term
    because it has already been coopted for dozens of other products and concepts.


    Instead, let''s call it “interactive security."


    # THE TOOTHBRUSH TEST


    Interactive security revolves around mobile apps. Since the rise of user-generated
    content, mobile apps have gained the lion''s share of the time we spend connected.
    That''s why interactive security will debut on mobile rather than on the desktop.
    It will make security dynamic and interactive like the rest of the web. To see
    this, you need only look at any one of the startups that have taken on mobile
    security and authentication in the past 5 years. Their advertising always shows
    a mobile app, front and center. If the medium is the message, mobile is the messenger.


    True to however, the commercial security products still lag behind. What has been
    missing is the vehicle to make it happen: a security application so people want
    to use it every day.


    Cue mobile credentials.


    People love them. They pass what Larry Page calls the “toothbrush test”: People
    must use an app at least twice a day, or it won’t be sticky enough to become a
    habit. Those that fail the toothbrush test join the 84% of downloaded apps abandoned
    within a few weeks. To recurring revenue companies, that spells attrition. To
    their customers, it foretells a future of apps that receive no further development
    funding and get any better.


    Mobile credentials pass the toothbrush test in being indispensable for people
    to get into a building they frequent. They also succeed because users like them
    better than access keys and fob, which always seem to get lost at the worst possible
    time—like when you parked your car in the underground garage of your office building
    and can''t get back in after happy hour. You can think of mobile credentials as
    benign Trojan horses; let’s call them'
  merge: -1
  img_proc: true
- pgno: 66
  md: '“Trojan puppies.” Once people pick them up and start playing with them, they
    never let them go. Only later do they discover that the apps can do much more.


    # RETENTION MATTERS


    There is a lively debate on user retention rates for desktop versus mobile applications.
    As we already noted, desktops have been declining to the tune of double digits
    per year. Surveys of all mobile applications reveal that mobile apps lose over
    80% of their daily average users (DAUs) within the first week after download.
    Keep in mind that these numbers include the free and frivolous apps that clog
    and clutter mobile milieu. Even so, retention rates are nearly dismal for mobile
    business apps that take all of 90 days to shed the same share of subscribers.
    If any of our businesses relied on retention rates like these, we would be in
    line at the soup kitchen.


    However, well-designed mobile apps that deliver results embed themselves in our
    lives ways desktop applications could never achieve. You can''t check your desktop
    2617 times a day. Smartphones are our constant companions, our second brains,
    and the digital dossiers for more elements of our identities than any other artifact
    of modern life. They have become part of our lifestyle, which matters for us because
    security is, in part, a matter of lifestyle.


    In the perennial tug-of-war between convenience and precaution, reinforcing desired
    security behaviors works best if they are similar to how people would normally
    act otherwise. Want your people to always carry ID? Put it in a phone. Want your
    people to say something when they see something? Put it in a phone. Want your
    people to participate in your security program? Put it in a phone.


    In this context, creating security applications that pass the toothbrush test
    is far more crucial than simply solving the adoption/abandonment hurdle. It also
    plays into the one business metric of every subscription service in the industry:
    customer attrition, or its inverse, customer retention. For those who are on the
    buying side of this equation, the temptation to think that these metrics only
    matter to suppliers. Instead, view retention statistics as a measure of how well
    a product serves your needs. They are a proxy for your satisfaction as a customer.
    When your suppliers have high retention rates, they''re doing a good job for you
    at a good price.


    Retention leads back to one of our major themes: the consumerization of commercial
    security and its role in the choices we make for security investments. Currently,
    over 80% of enterprises have invested in mobile technology for their own staff.
    Near half invest in mobile as a way to increase customer satisfaction and retention.
    What does this tell us? The preference for mobile will drive commercial security
    toward consumerized products, albeit on the'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Adoption 47


    coattails of the residential space. More than any of the other technologies we
    examine in this book, mobile will become the face of the security organization
    to its constituents.


    Moreover, application licenses—once a hideout per-seat affair in the desktop-days—now
    skew toward free (or at least "freemium") on mobile platforms. Version update
    cycles have ratched down from annual to quarterly to monthly and even weekly.
    Cross platform compatibility on multiple operating systems has subverted the hegemony
    of the PC world order. While good for security organizations on count, they also
    pave the way for broader participation in the security agenda.


    # ADOPTION


    Mobile technology has moved further along the adoption curve in the security industry
    than any of the other five technologies framed in this book. Nearly every manufacturer
    now has mobile apps that work with their products. This is significant, especially
    in light of the much slower adoption and even outright opposition to other new
    technologies, especially cloud computing. Why has mobile flourished while others
    lag behind?


    One argument is when you use a mobile app, you know it—something not always true
    with other technologies. For example, surveys reveal a significant percentage
    of people who use browsers to access online services do not realize they access
    a cloud application. Facebook? Cloud. Ebay? Amazon? Cloud. This may just be a
    nomenclature issue; know when they use the Internet but see the cloud as something
    entirely different. Understandable, perhaps, but this presents a problem from
    a marketing perspective. Until recently, people had more fears attached to the
    word cloud than the Internet itself.


    You could argue that mobile adds value than any of the other technologies, and
    so people are more willing to overcome reservations because of the higher payoff.
    We saw this play with the whole "bring your own device" (BYOD) movement. When
    smartphones initially came into the workplace, IT departments tried to stem the
    tide or keep them out altogether. They could legitimately justify this: Corporate
    e-mails reside on unprotected devices; viruses jump from personal smartphones
    to corporate networks; and sensitive data could be downloaded onto flash memory
    and walk out the door with the employee. Eventually, though, the CIOs had to acquiesce
    and accept it.


    Mobile, too big to stop.'
