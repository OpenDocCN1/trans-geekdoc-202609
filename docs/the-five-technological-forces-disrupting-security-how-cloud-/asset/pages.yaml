- pgno: 21
  md: '# From Packages to People


    The story of how I came to learn about the five big forces transforming security
    starts off in an unlikely place. The summer of 1999 in New York City was one of
    the hottest on record in a century. My fellow entrepreneurs and I had back-to-back
    investor meetings all day to secure funding for our new dot-com.


    As we slogged along the radiating Manhattan sidewalks in our business suits, I
    fantasized about jumping in front of the giant sprinklers they hook up to fire
    hydrants on days like that. The air-conditioned lobbies offered a respite of 10
    or 15 minutes where we tried to become human again before announcing ourselves
    to our next hour. The last meeting of the day couldn''t come enough.


    We pitched our then-novel business model of an e-commerce service for automatically
    replacing consumable products like diapers and cleaning products, commodities
    needed every week or every month. Unlike the ups and downs of ordinary consumer
    demand, this business would provide a predictable revenue stream month and month
    out, delivering the investor catnip known as recurring monthly revenue (RMR).


    Earlier meetings taught us that every investor wanted to know how we would physically
    secure this stream of पड़ेगा products against the twins of crime and vandalism.
    As one investor put it, "it’s fine to deliver things to people’s doorways, but
    only if they stay there. Nobody delivers to becoming thefts."


    To answer this question, we had already sketched out a crude, back-of-envelope
    drawing of a dishwasher-sized connected appliance where we dubbed the "SmartBox."
    The design was a hybrid of a safe and an oversized mailbox, with electronic access
    control tying it to a central database. Dynamically, assigned keypad codes—credentials
    in security—speak provide access control for its front door. The central web system
    would assign credentials to people who were authorized to put things in or take
    things out: delivery companies, homeowners, family members, or perhaps even a
    neighbor picking up a borrowed item. The entire cost of the product—hardware and'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# CHAPTER 1: From Packages to People


    ongoing access management—would be bundled into a monthly subscription plan, just
    like cell phones.


    After our long wait in the ornate conference room, a single hurried banker barged
    in looking like he''d already heard enough pitches for one day—or perhaps an entire
    lifetime. The professional skepticism was palpable. We were in the middle of the
    dot-com boom, and ideas for online businesses were a dozen a dozen.


    We him through our pitch deck a little faster than usual. Most investors, we were
    concerned about security, package theft, who would have access, and how it would
    be managed. As if for the first time, we unfurled our sketch of the SmartBox onto
    the conference table. I told him it would provide physical security with a steel
    frame and information security with digital signatures and encryption. Because
    it was connected to the Internet, it also served as a remote logistic sensor providing
    status updates about package deliveries and access events via e-mail or text.


    "So it''s an information service," explained, "We think that will help make it
    sticky because people like to know what''s going on."


    With that, he was done. Running a hand through a handful of silver hair, a little
    exasperated, perhaps, leaned forward and took another look at our rough sketch.
    His next words changed the course of our professional lives and muttered the course
    of physical security.


    "Your e-commerce idea is stupid. No one''s going to want that—I can hear Amazon
    laughing from here—But your box...now that''s something I would be interested
    in."


    That moment marks the birth of the first connected device designed to secure access
    control from a multitenant software-as-a-service (SaaS) platform. The device itself
    was no bigger than a large dishwasher or small washing machine, it had a door
    and an internet connection. Does sound familiar? Commercial office buildings are
    equipped the same way. The dot-com bust took toll on our original idea for consumer
    logistics, but with some good advice from investors, we were able to pivot the
    technology and business model to commercial access control. After all, a building
    is really just a box, and every one of them can be a smart box.


    But this isn''t a book that invented the SmartBox, nor is it about connected appliance,
    except as a vivid example of the five primary forces transforming physical security.
    It took down my pathway into cloud, mobility, Internet of things (IoT), big data,
    and ultimately social networks applied to a security problem. More importantly,
    it is an illustration of how innovation in the consumer product segment can drive
    commercial'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'product design. It explains why security technology now looks a lot more like
    consumer technology than ever before. It shows how we can expect our industry
    to evolve.


    We set out to protect packages; we wound up protecting people.


    # THE CONSUMERIZATION OF SECURITY


    The evolution of the SmartBox into an access control system provides both a hopeful
    and cautionary tale to the entire security industry. Helpful because innovation
    is always welcome, cautionary because you never know where or when disruption
    will appear. Commercial security is a relatively small industry, serving highly
    specialized markets. Until recently, the thought of consumer products infiltrating
    these markets was not especially worrisome. New security products don''t usually
