    在未来的研究中，我们将在下文总结每章的关键方面和发现。


    ## 第 3 章


    - 由于我们考虑的是刚性悬浮纤维，变分问题 (3.18) 在构成上并不适定。我们表明，通过利用 Legendre–Fenchel 变换并切换到对偶公式 (3.24)，可以解决这个问题。使用错开网格处理不可压缩流体，以及采用双混合规则的复合体素，我们证明了双问题
    (3.24) 可以使用基于 FFT 的技术和 Newton-CG 方法高效求解。这使得研究悬浮在非牛顿基体材料中的刚性纤维成为可能，而这此前无法实现。


    - 通过有限数量的计算实验，可利用基于插值的矩阵方程和方向相关的伸长粘度来估计和可视化纤维悬浮液的有效粘度。


    - 对于特定的横向各向同性取向状态和剪切稀化 PA6 基体材料，有效悬浮液粘度的各向异性程度随剪切速率和加载方向的变化而显著变化。在更高的纤维体积分数下，这种效应更为明显。


    ## 第 4 章


    - 对于固定的纤维体积分数，有效粘度的各向异性及其对剪切速率的依赖性随纤维取向状态而显著变化。我们发现，取向更强的纤维取向状态会出现更强的变化，并且观察到单向状态下的变化最为强烈。


    - 通过利用自动微分和基于梯度的学习的灵活性，我们建立了三个复杂程度各异的有效悬浮液粘度模型。针对 109 种不同的纤维取向状态，三个模型的误差均低于 5.15%。另一种基于
    Mori-Tanaka 形式主义的模型表现并不理想。


    - 我们证明了所考虑悬浮液的各向异性剪切稀化行为可以使用广义距离以工程精度进行编码，该广义距离取决于特定于取向状态的各向异性张量和应变速率张量。


    ## 第 5 章


    - 通过利用线性弹性层合板的结果，我们推导了具有线性黏性相的分层乳液有效粘度的闭式表达式。这为开发用于处理纤维悬浮液的 DMN 铺平了道路。


    - 对于不可压缩相，我们推导了涂覆层状材料的级数和层状方向的充分必要条件，使其有效性质非奇异，即使核心相是刚性的。特别是，涂覆层状材料的级数必须大于 2，且层状方向必须两两非正交且两两非共线。


    - 我们将灵活深材料网络 (FDMN) 架构作为直接 DMN 框架的扩展进行了介绍。在 FDMN 中，最低同质化层由涂覆层状材料组成，而不是像典型直接 DMN
    中那样由一级层状材料组成。这使得对无限材料对比度的实际处理成为可能，此前这非常困难。与直接 DMN 类似，FDMN 的其余层由一级层状材料组成。


    - 针对 31 种纤维取向状态，我们证明了 FDMN 在预测悬浮在剪切稀化 PA6 基体中的刚性纤维的黏性行为方面具有竞争性的预测精度。我们观察到最大误差为
    4.31%，低于第 4 章中所介绍模型的预测误差。


    - 与第 4 章中所介绍的模型相比，FDMN 是在线性同质化数据上训练的，并且不包含对悬浮液预期材料行为的知识。此外，本论文中的 FDMN 是在比以往基于
    DMN 的研究更小的数据集上训练的。这些考虑凸显了 FDMN 在非线性材料行为方面卓越的预测能力。


    通过我们的工作，我们为非牛顿基体材料中纤维悬浮液的数值研究和建模做出了贡献。我们的主要贡献包括开发基于 FFT 的计算同质化方法、识别闭式有效粘度模型以及开发
    FDMN 架构。总体而言，我们建模方法的适用性和规模主要受制于使用基于 FFT 的方法生成训练数据的计算成本。这凸显了进一步研究高效基于 FFT 的技术以及其他高效计算方法的必要性。特别是，降低计算需求将允许考虑具有更高纤维长径比的更大系统，或考虑额外的复杂物理。利用计算生成的数据，本论文中所介绍的闭式模型和
    FDMN 架构能够实现高效的两尺度成形模拟。这可以用于复合材料制造中各种工艺过程模拟，例如注射成形和压缩成形。由于纤维在加工过程中可能会断裂，将闭式模型和
    FDMN 架构与包含纤维长度分布的合成微观结构 (Mehta and Schneider, 2022) 和成形模拟 (Phelps et al., 2013)
    相结合将非常有意义。


    此外，开发的 FDMN 框架可以应用于涉及两个以上相和多个奇异相的问题，并可对此进行扩展。这包括诸如包含气态相的纤维悬浮液 (Shuler et al.,
    1994; Cui and Grace, 2007)、包含空隙的材料 (Mehdikhani et al., 2019; Sika et al., 2020)
    或包含液体包裹体的固体 (Style et al., 2015; Wang and Henann, 2016) 等材料系统。特别是，当与纤维取向插值技术 (Gajek
    et al., 2021; Huang et al., 2022; Dey et al., 2024) 结合使用时，所介绍的 FDMN 可能实现新型的多尺度模拟。


