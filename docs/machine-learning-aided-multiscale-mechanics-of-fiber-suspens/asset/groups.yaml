    ## Chapter 5


    ### Deep material networks for fiber suspensions with infinite material contrast¹


    ### 5.1 Introduction


    For composites with kinematically unconstrained solid phases, the literature presented
    in section 1.2.4 provides compelling evidence for the accuracy and versatility
    of (direct) DMNs. However, the (direct) DMN architecture has yet to be applied
    to composites involving fluids or infinite material contrast, which is required
    for suspensions of rigid fibers. Because (direct) DMNs are based on laminates
    of solids, the treatment of fluids with a DMN architecture requires a different
    type of building block. Additionally, treatment of infinite material contrast
    with DMNs is challenging, because the rank-one laminates of a DMN have singular
    effective properties if one of the phases is singular, i.e., rigid. Therefore,
    the singular effective properties of the rank-one laminates may propagate through
    the whole DMN during the training and evaluation processes, rendering the effective
    properties of the DMN singular as well. In this chapter we address these issues
    and propose an architecture to treat suspensions of rigid fibers.


    ¹ This chapter is based on the sections 1 to 5 of the publication "Deep material
    networks for fiber suspensions with infinite material contrast" (Serr et al.,
    2024b).


    We extend the direct DMN architecture for kinematically unconstrained solid phases
    with finite material contrast to an architecture that is able to treat suspensions
    of rigid fibers. In particular, this task requires the treatment of fluid phases
    and infinite material contrast. We name this architecture the Flexible DMN (FDMN)
    architecture. To treat fluid materials with FDMNs, we derive homogenization blocks
    for layered emulsions that are governed by Stokes flow, and consist of possibly
    incompressible phases with finite material contrast. In section 5.2.1, we establish
    that the velocity field in this type of layered material is phase-wise affine,
    if the dissipation potentials of the phases are strictly rank-one convex. We use
    this result and follow an analytical procedure described by Milton (2002, §9)
    to derive the closed form linear homogenization function of the considered layered
    emulsions in section 5.2.2. To treat infinite material contrast, we study a particular
    type of layered material, namely, coated layered materials (CLMs), in section
    5.2.3. We obtain closed form homogenization functions for CLMs with kinematically
    unconstrained or incompressible phases. With the objective of using CLMs as FDMN
    building blocks in the presence of rigid fibers, we derive conditions for the
    required number of layering directions and their orientation, such that the effective
    properties of CLM are non-singular. We do so for CLMs with incompressible and
    rigid phases.


    In section 5.3, we present the FDMN architecture as an extension of the (direct)
    DMN architecture. An FDMN arises by replacing the rank-one laminates of a (direct)
    DMN with rank-one layered materials capable of treating fluids, and non-singular
    CLMs capable of treating infinite material contrast. Also, we discuss the material
    sampling, the offline training procedure, as well as the online evaluation of
    FDMNs in the context of incompressible rigid fiber suspensions. We apply FDMNs
    to predict the viscous response of fiber polymer suspensions in section 5.4, demonstrating
    both the ability to handle incompressible fluid phases and infinite material contrast.
    We use FFT-based computational homogenization techniques to generate linear training
    data and non-linear validation data for shear-thinning fiber suspensions with
    a Cross-type matrix behavior, and a fiber volume fraction of 25%. We consider
    31 different fiber orientation states and a variety of incompressible elongational
    and shear flows. Using the computational data, we train FDMNs for all fiber orientation
    states, and study the prediction accuracy of the FDMNs in the non-linear case.
    For all investigated load cases and microstructures, the FDMNs achieve validation
    errors below 4.31% over a wide range of shear rates relevant to engineering processes.
    Not considering the time required to generate the training data and to train an
    FDMN, the FDMNs achieve speedup factors between 11785 and 17225 compared to FFT-based
    computations. Finally, we compare the prediction accuracy of the FDMN based approach
    with a different machine learning approach by Sterr et al. (2024b), and find that
    FDMNs offer better accuracy and flexibility at a higher computational cost for
    the considered material and flow scenarios.


