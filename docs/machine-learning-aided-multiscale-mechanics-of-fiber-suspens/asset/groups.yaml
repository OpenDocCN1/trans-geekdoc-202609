    provide intuition and qualitative understanding of the underlying viscosity matrix
    \(\overline{\underline{V}}\), cuts through the viscosity bodies shown in the previous
    section allow for a more focused discussion of the occurring effects. As noted
    in the previous section, the fiber volume fraction \(c_\text{F}\) has a strong
    influence on the suspension viscosity \(\overline{\underline{V}}\). Because the
    matrix \(\overline{\underline{V}}\) should be transversely isotropic, see section
    3.2.5, we will discuss the effect of the fiber volume fraction \(c_\text{F}\)
    and the shear rate \(\dot{\gamma}\) on the suspension viscosity \(\overline{\underline{V}}\)
    by focusing on the elongational viscosities \(\eta_\text{app}^x\) and \(\eta_\text{app}^y\)
    in \(x\) and \(y\) direction. In section 3.4.1 we noted that the elongational
    viscosity \(\eta_\text{app}\) increases with the fiber volume fraction \(c_\text{F}\)
    in all directions \(\boldsymbol{d}\). Additionally, as shown in Figures 3.9 and
    3.10, the changes of the elongational viscosities \(\eta_\text{app}^y\) and \(\eta_\text{app}^x\)
    with the fiber volume fraction \(c_\text{F}\) increase with the fiber volume fraction
    \(c_\text{F}\) itself. In the Newtonian case, the viscosity \(\eta_{app}^y\) increases
    from 530 Pa s to 1581 Pa s as the fiber volume fraction \(c_\mathrm{F}\) changes
    from 5% to 25%. In contrast, the elongational viscosity \(\eta_{app}^x\) increases
    from 769 Pa s to 3468 Pa s as the fiber volume fraction \(c_\mathrm{F}\) increases
    from 5% to 25%. Thus, the elongational viscosities \(\eta_{app}^y\) and \(\eta_{app}^x\)
    increase by 198% and 351%, respectively.


