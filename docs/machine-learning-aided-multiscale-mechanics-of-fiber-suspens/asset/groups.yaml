    \(t\) 与最远考虑的时间点 \(T \in (0, \infty]\) 位于仿射延伸实数轴上。当前配置 \(\boldsymbol{x}\) 定义为


    $$

    \boldsymbol{x} = \boldsymbol{\chi}(\boldsymbol{X}, t), \quad (2.2)

    $$


    由此，材料体的当前配置 \(Y_t\) 定义为（Steinmann, 2015）


    $$

    Y_t = \{ \boldsymbol{x} = \boldsymbol{\chi}(\boldsymbol{X}, t) \mid \boldsymbol{X}
    \in Y_0 \text{ and } t \in [0, T] \}. \quad (2.3)

