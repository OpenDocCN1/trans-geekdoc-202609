    # Chapter 6


    # Summary, conclusions, and outlook


    In this thesis, we combined high fidelity computational techniques with machine
    learning to investigate and model the viscous behavior of non-Newtonian fiber
    suspensions. Firstly, we developed an FFT-based approach for the computational
    homogenization of suspensions of rigid fibers in non-Newtonian media. We employed
    the developed FFT-based approach to investigate the anisotropic shear-thinning
    behavior of a transversely isotropic fiber suspension with a polyamide 6 (PA6)
    matrix material for a broad range of engineering flow scenarios. Secondly, we
    extended the scope of investigation into the anisotropic shear-thinning behavior
    of fiber suspensions to a total of 109 fiber orientation states, and thus generated
    a rich data set for use with machine learning techniques. We encoded the viscous
    fiber suspension behavior in four analytical models, and learned the model parameters
    from the generated data set using a supervised machine learning strategy. Finally,
    we developed a thermodynamically consistent Deep Material Network (DMN) architecture
    for the treatment of suspensions of rigid fibers in non-Newtonian media. To do
    so, we derived linear homogenization functions for rank-one two-phase layered
    emulsions with finite material contrast. To account for infinite material contrast,
    we derived closed form expressions for the effective viscosity of coated layered
    materials with incompressible phases. Before we give an outlook on possible'
