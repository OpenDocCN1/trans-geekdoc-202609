    对于占据体积 \(Y_0 \subset \mathbb{R}^d\) 的 \(d\) 维材料体，令 \(\mathbf{X} \in Y_0\) 表示材料体中材料点的参考配置，其中
    \(d \in \{2, 3\}\)（Steinmann, 2015）。然后，连续可微且可逆的函数


    $$

    \chi : Y_0 \times [0, T] \to \mathbb{R}^d, \quad (\mathbf{X}, t) \mapsto \chi(\mathbf{X},
    t) \tag{2.1}

    $$


