    因此，假设各相之间无滑移，Kabel et al. (2016b, §2) 的证明可推广到具有有限材料对比的分层乳液。因此，如果耗散势 \(\Psi_k$
    为严格秩一凸，则在分段仿射速度场类中存在唯一极小点 \(\hat{v}$。作为特例，这对于不可压缩斯托克斯流也成立，对于这类流动，质量守恒简化为


    $$\text{div }(\boldsymbol{v}) = 0. \tag{5.14}$$


    在以下内容中，我们仅将*分层乳液*一词用于上述定义的乳液类型。


    ## 5.2.2 具有牛顿相的双相分层乳液


    与线性弹性固体材料的双相层板类似，我们希望找到双相分层乳液线性同质化函数的方便闭式表达式。为了将分层乳液用作 FDMN 的构建模块，我们将本节专门用于推导具有运动学无约束或不可压缩牛顿相的双相分层乳液的此类闭式表达式。为此，我们采用上一节
    5.2.1 的结果，并扩展 Milton (2002, §9) 针对线性弹性相双相层板的现有同质化方法。为了强调层板线性同质化与分层乳液之间的联系，我们定义了线性材料类
    $\mathcal{M}$，并并行研究固体和流体的分层材料。线性材料类 $\mathcal{M}$ 中的材料 $m_k$ 由原构材料张量 $\mathbb{M}_k$
    或其对偶张量 $\mathbb{K}_k \equiv \mathbb{M}_k^{-1}$ 表征，使得


    $$(\mathbb{M}_k, \mathbb{K}_k) \in \{(\mathbb{M}^+)^2, (\mathbb{M}_0^+)^2\}. \tag{5.15}$$


    这里，凸锥 $\mathbb{M}^+ \subset (\mathbb{R}^3)^{\otimes 4}$ 和 $\mathbb{M}_0^+ \subset
    (\mathbb{R}^3)^{\otimes 4}$ 包含所有四阶张量 $\mathbb{X} \in (\mathbb{R}^3)^{\otimes 4}$，它们分别在对称二阶张量向量空间
    $\text{Sym}(3)$ 和迹零对称二阶张量向量空间 $\text{Sym}_0(3) \subset \text{Sym}(3)$ 上为正定。此外，张量
    $\mathbb{X} \in \{\mathbb{M}^+, \mathbb{M}_0^+\}$ 具有小对称和大对称性


    $$\mathbb{X} = \mathbb{X}^{\text{Th}} = \mathbb{X}^{\text{Tl}} = \mathbb{X}^{\text{Tr}},
    \tag{5.16}$$


    且张量 \(\mathbb{X} \in \mathsf{M}_0^+$ 将二阶单位张量 \(\boldsymbol{I}$ 映射为零，使得


    $$\ker \mathbb{X} = \boldsymbol{I}, \quad \text{即，} \quad \mathbb{X}[\boldsymbol{I}]
    = \boldsymbol{0}. \tag{5.17}$$


    在这里，我们以分量形式并在 $\mathbb{R}^3$ 的标准基下定义映射 \(\mathbb{T}[\boldsymbol{Y}]\) 为


    $$\mathbb{T}[\boldsymbol{Y}] \hat{=} T_{ijkl} Y_{kl}, \quad \text{对某些} \quad \boldsymbol{Y}
    \in (\mathbb{R}^3)^{\otimes 2}, \mathbb{T} \in (\mathbb{R}^3)^{\otimes 4}. \tag{5.18}$$


    任何材料 \(m_k \in \mathcal{M}$ 都遵循线性本构方程


    $$\boldsymbol{\sigma}^{co} = \mathbb{M}_k[\nabla^s \boldsymbol{w}] \quad \text{且}
    \quad \nabla^s \boldsymbol{w} = \mathbb{K}_k[\boldsymbol{\sigma}^{co}], \tag{5.19}$$


    如果材料 \(m_k$ 不受运动学约束，或本构方程


    $$\boldsymbol{\sigma}^{ico} = \boldsymbol{\tau} - p \boldsymbol{I} = \mathbb{M}_k[\nabla^s
    \boldsymbol{w}] - p \boldsymbol{I}, \quad \text{且} \quad \nabla^s \boldsymbol{w}
    = \mathbb{K}_k[\boldsymbol{\tau}], \tag{5.20}$$


    如果材料 \(m_k$ 是不可压缩的。这里，\(\boldsymbol{w}$ 表示与材料 \(m_k$ 类型相关的场，即，线性弹性固体的位移场 \(\boldsymbol{u}$
    或线性黏性流体的速度场 \(\boldsymbol{v}$。对于本构方程 (5.20)，我们对应力场 \(\boldsymbol{\sigma}$ 使用加法分解


    $$\boldsymbol{\sigma} = \boldsymbol{\tau} - p \boldsymbol{I}, \tag{5.21}$$


    为偏应力场 \(\boldsymbol{\tau} : Y \to \text{Sym}_0(3)$ 和压力场 \(p : Y \to \mathbb{R}$。这里，我们使用
    \(Y \subset \mathbb{R}^3\) 表示双相分层材料所占据的体积，即层板或分层乳液，并使用 \(Y_1, Y_2 \subset Y$ 表示分层材料两个相
    \(m_1, m_2 \in \mathcal{M}$ 所占据的体积。我们按 Hill-Mandel 条件 (Hill, 1963; Mandel, 1966)
    的意义定义分层材料的有效性质 \((\bar{\mathbb{M}}, \bar{\mathbb{K}}) \in \{(\mathsf{M}^+)^2,
    (\mathsf{M}_0^+)^2\}$


    $$\langle \boldsymbol{\sigma} \cdot \nabla^s \boldsymbol{w} \rangle_Y = \langle
    \boldsymbol{\sigma} \rangle_Y \cdot \langle \nabla^s \boldsymbol{w} \rangle_Y
    \equiv \bar{\mathbb{M}} : (\langle \nabla^s \boldsymbol{w} \rangle_Y \otimes \langle
    \nabla^s \boldsymbol{w} \rangle_Y). \tag{5.22}$$


    然后，对于没有运动学约束的线性固体材料完美结合层板，可以使用 Milton (2002, §9) 详细说明的程序推导层板的原构或对偶有效性质 \(\bar{\mathbb{A}}
    \in [\mathbb{M}, \bar{\mathbb{K}}]$ 的闭式表达式，使得


    $$\left( (\bar{\mathbb{A}} - \mathbb{A}_0)^{-1} + \Gamma_{\mathbb{A}_0}(\boldsymbol{n})
    \right)^{-1} = \left\langle \left( (\mathbb{A}(\boldsymbol{x}) - \mathbb{A}_0)^{-1}
    + \Gamma_{\mathbb{A}_0}(\boldsymbol{n}) \right)^{-1} \right\rangle. \tag{5.23}$$


    这里，逆运算在 \(\bar{\mathbb{A}} \in \mathsf{M}^+$ 所在的空间 \(\mathsf{M}^+$ 上进行，\(\mathbb{A}
    : Y \to \mathsf{M}^+$ 表示逐相原构或对偶材料性质的场


    $$\mathbb{A} : Y \to \mathsf{M}^+, \quad \boldsymbol{x} \mapsto \begin{cases}
    \mathbb{A}_1 & \text{当 } \boldsymbol{x} \in Y_1, \\ \mathbb{A}_2 & \text{当 } \boldsymbol{x}
    \in Y_2, \end{cases} \tag{5.24}$$


    并且 \(\mathbb{A}_0 \in \mathsf{M}^+$ 是任意参考材料张量，使得术语 \((\mathbb{A}(\boldsymbol{x})
    - \mathbb{A}_0)$ 可逆。另外，算子 \(\Gamma_{\mathbb{A}_0}(\boldsymbol{n}) \in (\mathbb{R}^3)^{\otimes
    4}$ 定义为


    $$\Gamma_{\mathbb{A}_0}(\boldsymbol{n}) = \Gamma_{\mathbb{I}}(\boldsymbol{n})
    \left[ \Gamma_{\mathbb{I}}(\boldsymbol{n}) \mathbb{A}_0 \Gamma_{\mathbb{I}}(\boldsymbol{n})
    \right]^{\dagger} \Gamma_{\mathbb{I}}(\boldsymbol{n}), \tag{5.25}$$


    其中 \((\cdot)^\dagger$ 表示 Moore–Penrose 伪逆，且算子 \(\Gamma_{\mathbb{A}_0}(\boldsymbol{n})$
    和 \(\Gamma_{\mathbb{I}}(\boldsymbol{n})$ 相对于不同的内积投影到同一子空间。更具体地说，算子 \(\Gamma_{\mathbb{A}_0}(\boldsymbol{n})$
    是相对于 \(\mathbb{A}_0$-加权内积的正交投影算子


    $$\langle \boldsymbol{X}, \boldsymbol{X} \rangle_{\mathbb{A}_0} = \boldsymbol{X}
    \cdot \mathbb{A}_0[\boldsymbol{X}], \quad \boldsymbol{X} \in \text{Sym}(3), \tag{5.26}$$


    且算子 \(\Gamma_{\mathbb{I}}(\boldsymbol{n})$ 是相对于 Frobenius 内积的正交投影算子


    $$\langle \boldsymbol{X}, \boldsymbol{X} \rangle_{\text{F}} = \boldsymbol{X} \cdot
    \mathbb{I}[\boldsymbol{X}] = \boldsymbol{X} \cdot \boldsymbol{X}, \quad \boldsymbol{X}
    \in \text{Sym}(3). \tag{5.27}


