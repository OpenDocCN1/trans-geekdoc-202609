    will, in general, be governed by a constitutive relation of the form


    $$\boldsymbol{\tau} = \mathbb{V}[\boldsymbol{D}][\boldsymbol{D}] \tag{3.4}$$


    with a viscosity tensor $\mathbb{V}$ that additionally depends on the shear-rate
    tensor $\boldsymbol{D}$. By the dissipation inequality, the viscosity tensor $\mathbb{V}(\boldsymbol{D})$
