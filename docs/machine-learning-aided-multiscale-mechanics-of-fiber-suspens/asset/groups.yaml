    the element \(\bar{\boldsymbol{g}}\) lies in \(\mathcal{E}\), i.e.,


    \(\mathbb{T}_{\mathbb{A}_2}[\bar{\boldsymbol{g}}] = \bar{\boldsymbol{g}}, \implies
    \bar{\boldsymbol{g}} \in \mathcal{E}\) (A.10)


    and equation (A.4) is satisfied as well.


    With the result (A.10) at hand, we observe that a necessary and sufficient condition
    for the regularity of a rank-R CLM is that the space \(\mathcal{E}\) is trivial,
    i.e.,


    \(\mathcal{E} = \{ \mathbf{0} \}.\) (A.11)


    We refer to equation (A.11) as *non-singularity condition* in the following. In
    the context of linear elastic and linearly viscous materials, we derived the non-singularity
    condition (A.11) for the spaces \(\mathcal{E}_r^{\mathsf{A}}\), such that


    \(\mathcal{E}_r^{\mathsf{A}} \subset \text{Sym}(3), \forall r \in \{1, ..., R\}
    \text{ or } \mathcal{E}_r^{\mathsf{A}} \subset \text{Sym}_0(3), \forall r \in
    \{1, ..., R\}.\) (A.12)


    However, the presented proof extends to other problems that can be formulated
    in the form of equation (A.1), such as thermoelastic or piezoelectric problems
    (Milton, 2002, §9). With the goal of using CLMs as building blocks in a DMN architecture,
    we are interested in whether there are particular choices of the layering directions
    \(\boldsymbol{n}_r\) and the rank \(R\) of the CLM for which the effective properties
    of a CLM are always non-singular, i.e., the non-singularity condition (A.11) is
    satisfied. For incompressible suspensions of rigid fibers, we study this question
    for CLMs with a rigid core material \(m_1\) and an incompressible coating material
    \(m_2\).


    ## A.2 Coated layered materials with incompressible coating and rigid core


    For applications involving rigid inclusions in incompressible media, we consider
    CLMs with an incompressible coating material \(m_2\) and a rigid core material
    \(m_1\). Therefore, the spaces \(\mathcal{E}_r^A \subset \text{Sym}_0(3)\) have
    the form


    \(\mathcal{E}_r^A = \{ B \in \text{Sym}_0(3) \mid B \cdot (n_r \otimes_s a) =
    0,\)

    \(\forall a \in \mathbb{R}^3 \text{ with } a \cdot n_r = 0 \},\) (A.13)


    with the dimensions of the spaces \(\mathcal{E}_r^A\) and \(\text{Sym}_0(3)\)
    given by


    \(\text{dim}(\mathcal{E}_r^A) = 3, \text{ and } \text{dim}(\text{Sym}_0(3)) =
    5.\) (A.14)


    Because the dimension \(\text{dim}(\mathcal{E}_1^A + \mathcal{E}_2^A)\) is bounded
    by the dimension of the space \(\text{Sym}_0(3)\), such that


    \(\text{dim}(\mathcal{E}_1^A + \mathcal{E}_2^A) \le 5,\) (A.15)


    it follows from the dimension of the intersection of the two spaces \(\mathcal{E}_1^A\)
    and \(\mathcal{E}_2^A\)


    \(\text{dim}(\mathcal{E}_1^A \cap \mathcal{E}_2^A) = \text{dim}(\mathcal{E}_1^A)
    + \text{dim}(\mathcal{E}_2^A) - \text{dim}(\mathcal{E}_1^A + \mathcal{E}_2^A),\)
    (A.16)


    that


    \(\text{dim}(\mathcal{E}_1^A \cap \mathcal{E}_2^A) \ge 3 + 3 - 5 = 1.\) (A.17)


    In other words, the intersection of the spaces \(\mathcal{E}_1^A\) and \(\mathcal{E}_2^A\)
    is at least one dimensional. Consequently, two layering directions are not sufficient
    to satisfy the condition (A.11). Besides the required number of layerings, we
    are also interested in whether there are restrictions on the angles between the
    layering directions. Suppose that one layering direction is orthogonal to the
    other two. We discuss the case that the direction \(\boldsymbol{n}_3\) is orthogonal
    to the normals \(\boldsymbol{n}_1\) and \(\boldsymbol{n}_2\). The other cases
    work similarly via permuting the indices. Then it holds that


    \(\boldsymbol{n}_3 \cdot \boldsymbol{n}_1 = 0, \quad \text{and} \quad \boldsymbol{n}_3
    \cdot \boldsymbol{n}_2 = 0,\) (A.18)


    and the intersection \(\mathcal{E}_1^{\text{A}} \cap \mathcal{E}_2^{\text{A}}
    \cap \mathcal{E}_3^{\text{A}}\) does not only contain the zero element \(\mathbf{0}\).
    Hence, the condition (A.11) is violated. To show this, we consider the alternative
    description of the spaces \(\mathcal{E}_r^{\text{A}}\)


    \(\mathcal{E}_r^{\text{A}} = \{ \boldsymbol{B} \in \text{Sym}_0(3) \mid \boldsymbol{B}\boldsymbol{n}_r
    = \alpha \boldsymbol{n}_r \quad \text{for some} \quad \alpha \in \mathbb{R} \}\)
    (A.19)


    which is equivalent to equation (A.13) and characterizes the space \(\mathcal{E}_r^{\text{A}}\)
    via all tensors \(\boldsymbol{B} \in \mathcal{E}_r^{\text{A}}\) that have the
    layering direction \(\boldsymbol{n}_r\) as an eigenvector. Then the tensor


    \(\boldsymbol{B} = \boldsymbol{n}_1 \otimes \boldsymbol{n}_1 + \boldsymbol{m}_2
    \otimes \boldsymbol{m}_2 - 2\boldsymbol{n}_3 \otimes \boldsymbol{n}_3,\) (A.20)


    where the layering direction \(\boldsymbol{m}_2\) is constructed by orthogonalization,
    such that


    \(\boldsymbol{m}_2 = \boldsymbol{n}_2 - (\boldsymbol{n}_1 \cdot \boldsymbol{n}_2)\boldsymbol{n}_1,\)
    (A.21)


    is an element of the intersection \(\mathcal{E}_1^{\text{A}} \cap \mathcal{E}_2^{\text{A}}
    \cap \mathcal{E}_3^{\text{A}}\). This is true because it holds that


    \(\text{tr}(\boldsymbol{B}) = 0, \boldsymbol{B}\boldsymbol{n}_1 = \boldsymbol{n}_1,
    \quad \boldsymbol{B}\boldsymbol{n}_2 = \boldsymbol{n}_2, \quad \boldsymbol{B}\boldsymbol{n}_3
    = \boldsymbol{n}_3,\) (A.22)


    and therefore condition (A.11) is violated. In other words, the effective properties
    \(\bar{\mathbb{A}}\) of a rank-3 CLM with incompressible coating and rigid core,
    where one layering direction \(\boldsymbol{n}_3\) is orthogonal to the other two
    layering directions \(\boldsymbol{n}_1\) and \(\boldsymbol{n}_2\), is always singular.
    Particularly, if all three layering directions are mutually orthogonal, the effective
    properties \(\bar{\mathbb{A}}\) of a rank-3 CLM are singular.


    In contrast, let the three layering directions be mutually non-orthogonal and
    mutually non-collinear, i.e.,


    \(0 < |\boldsymbol{n}_1 \cdot \boldsymbol{n}_2| < 1, \quad 0 < |\boldsymbol{n}_1
    \cdot \boldsymbol{n}_3| < 1, \quad 0 < |\boldsymbol{n}_2 \cdot \boldsymbol{n}_3|
    < 1.\) (A.23)


    We consider an element \(\boldsymbol{B}\) in the intersection \(\mathcal{E}_1^{\text{A}}
    \cap \mathcal{E}_2^{\text{A}} \cap \mathcal{E}_3^{\text{A}}\) and wish to show
    that the tensor \(\boldsymbol{B}\) vanishes, such that the non-singularity condition
    (A.11) is satisfied. Because the tensor \(\boldsymbol{B}\) is symmetric, its eigenvectors
    corresponding to distinct eigenvalues are orthogonal. Thus, if the eigenvalues
    were distinct, the layering directions would need to be orthogonal. However, this
    contradicts our assumption (A.23). Therefore, the tensor \(\boldsymbol{B}\) has
    a single eigenvalue \(\alpha\) with the corresponding eigenspace \(\mathbb{R}^3\),
    i.e., the tensor \(\boldsymbol{B}\) attains the form


    \(\boldsymbol{B} = \alpha \boldsymbol{I}, \quad \alpha \in \mathbb{R}.\) (A.24)


    Additionally, because the trace of the tensor \(\boldsymbol{B}\) vanishes, i.e.,
    \(\text{tr}(\boldsymbol{B}) = 0\), it follows that the eigenvalue \(\alpha\) is
    zero. Consequently, the tensor \(\boldsymbol{B}\) must vanish, the non-singularity
    condition (A.11) is satisfied, and the effective properties \(\bar{\mathbb{A}}\)
    of a rank-3 CLM with an incompressible coating material \(m_2\) and a rigid core
    material \(m_1\) are non-singular, if the three layering directions are mutually
    non-orthogonal and non-collinear.


