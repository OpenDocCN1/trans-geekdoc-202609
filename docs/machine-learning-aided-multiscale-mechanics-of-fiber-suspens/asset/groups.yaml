    ## 4.4 Modeling the effective suspension viscosity


    ### 4.4.1 Model requirements


    With the results presented in the previous section 4.3 at hand, we wish to model
    the effective viscosity of shear-thinning fiber suspensions with analytical means
    and identify the model parameters using supervised machine learning. To do so,
    we first summarize the key criteria a model of the effective viscous behavior
    should fulfill. The model should


    - (I) be tensorial, i.e., capture shear rate and load direction dependence objectively.


    - (II) replicate the local Cross-type material behavior on the macro-scale, i.e.,
    the model should show Newtonian behavior in the shear rate limits \(\dot{\gamma}
    \to 0 s^{-1}\) and \(\dot{\gamma} \to \infty s^{-1}\), and capture the shear rate
    and load direction dependent, non-linear transition between the two Newtonian
    limits. This requirement is based on the investigations in Starr et al. (2023,
    §4), the results of the anisotropy investigation in the previous section 4.3,
    and considerations in literature (Koch, 1995; Favarolo et al., 2018; Pipes, 1992;
    Pipes et al., 1994).


    - (III) yield an incompressible and orthotropic effective viscosity \(\bar{\mathbb{V}}\).
    Because the fourth order fiber orientation tensors of the generated microstructures
    are orthotropic, see Schneider (2017) and Montgomery-Smith et al. (2011), the
    effective viscosity \(\bar{\mathbb{V}}\) of the suspensions is orthotropic as
    well.


    - (IV) be applicable on the whole fiber orientation triangle \(S_T\), as defined
    in equation (2.37).


    In accordance with requirements (I) and (II), we restrict our investigations to
    tensorial models of the type


    \(\bar{\mathbb{V}}(\boldsymbol{D}, \underline{a}) = \bar{\mathbb{V}}_{\infty}(\underline{a})
    + \mathbb{T}_{8}(\boldsymbol{D}, \underline{a}) \left[ \bar{\mathbb{V}}_{0}(\underline{a})
    - \bar{\mathbb{V}}_{\infty}(\underline{a}) \right], \quad (4.23)\)


    where \(\underline{a} \in \mathbb{R}^m\), \(m \in \mathbb{N}\), is the vector
    of model parameters, \(\mathbb{T}_{8} : \text{Sym}_0(3) \times \mathbb{R}^m \to
    (\mathbb{R}^3)^{\otimes 8}\) stands for an eighth order tensor function, and \(\bar{\mathbb{V}}_{0}
    : \mathbb{R}^m \to \text{Sym}_0(3)\) as well as \(\bar{\mathbb{V}}_{\infty} :
