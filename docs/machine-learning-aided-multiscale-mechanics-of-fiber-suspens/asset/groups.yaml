    in the fiber orientation distribution function (2.29) into account at every spatial
    element of component-scale simulations. To reduce the necessary computational
    effort in treating fiber orientation states, it is common to use the fiber orientation
    tensors of second and fourth order (Advani and Tucker III, 1987; Kanatani, 1984)


