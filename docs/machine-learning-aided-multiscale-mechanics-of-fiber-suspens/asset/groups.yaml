    完全求解感兴趣整个区域的微观结构以计算悬浮液粘度，在计算上是不可行的。为此，解析和计算均质化方法是为成形模拟提供粘度估计的宝贵工具。然而，悬浮液粘度的整体解析建模面临重大挑战，因为悬浮液粘度取决于局部微观结构（Karl
    and Böhlke, 2022）、纤维体积分数（Sepehr et al., 2004）和纤维取向状态（Dinh and Armstrong, 1984）。此外，流场（Cross,
    1965; Sterr et al., 2023）和熔体温度（Williams et al., 1955）也会影响悬浮液粘度。此外，纤维悬浮液中的典型基体材料表现出非牛顿行为，这增加了推导适当悬浮液粘度模型的复杂性。


    除了具有挑战性的解析处理外，通过流变实验研究纤维悬浮液也很困难。由于纤维悬浮液成形过程中的瞬态效应（包括纤维断裂和取向状态改变），很难确定特定微观结构和载荷情况下的悬浮液粘度（Binding,
    1991; Schelleis et al., 2023）。此外，纤维与测量装置的相互作用（Eschbach, 1993）会影响测量量。


    总的来说，纤维悬浮液粘性行为的实验和解析研究伴随着相当大的困难。因此，计算方法经常被用来研究悬浮液的粘性行为。在文献中，各种计算技术被用于悬浮液的研究，例如边界元方法（Marin
    et al., 2012）、有限元方法（Domurath et al., 2015; 2020; Traxl et al., 2020）、格子玻尔兹曼方法（Švec
    et al., 2012）以及基于快速傅里叶变换（Fast-Fourier-Transform, FFT）的方法（Bertóti et al., 2021）。特别是，基于FFT的方法被确立为高效率的方法（Kabel
    et al., 2014; Wicht et al., 2020a; Wicht, 2022），且不需要界面拟合网格，这使得它们广泛适用于复杂的合成或真实微观结构（Schneider,
    2021）。迄今为止，使用基于FFT的方法研究纤维悬浮液仅限于具有牛顿基体材料的悬浮液。因此，基于FFT的方法只能被用于具有牛顿基体材料的悬浮液的基于数据的建模方法中。然而，工程部件成形模拟经常需要用于具有非牛顿基体材料的纤维悬浮液粘性行为的模型（Wittemann
    et al., 2019）。这正是我们开发用于处理具有非牛顿基体材料的悬浮液的基于FFT的技术，以及开发基于基于FFT的计算数据的计算高效替代模型的动机。我们实现这些目标的方法结构如下：


    - 我们旨在将用于牛顿基体材料中刚性颗粒悬浮液均质化的基于FFT的方法扩展到具有非牛顿基体材料的悬浮液。特别是，我们考虑其应力响应作为耗散势密度相对于应变速率张量的导数的非牛顿基体材料。我们利用Legendre–Fenchel变换来获取相关非线性均质化问题的双重公式（Bhattacharya
    and Suquet, 2005）。


    - 我们采用开发的基于FFT的方法来研究具有聚酰胺6（PA6）基体材料的纤维悬浮液的有效粘性行为。特别是，我们研究有效悬浮液粘度的三维表示，以及材料各向异性的程度及其对剪切速率的依赖。为此，我们引入了基于Böhlke
