    # # 1.4 Notation and frequently used operations


    All abbreviations are defined when they first appear in each chapter. Likewise,
    for each quantity defined in this thesis, we provide a definition when the quantity
    first appears in each chapter. The definition might include properties such as
    the domain and codomain of a function, the superset of a set, the vector space
    a quantity lives in, or the tensorial order of a quantity. Additionally, we encode
    the tensor order of a quantity through the notation. We denote scalar quantities
    and quantities of variable order \(r \in \mathbb{N}_{\ge 0}\) with non-bold letters
    or greek symbols, such as \(a, b\) or \(\alpha, \beta\), and provide the required
    information to completely define the quantity when it first occurs. Also, we denote
    the set of natural numbers including zero as \(\mathbb{N}_{\ge 0}\), and the set
    of natural numbers not including zero as \(\mathbb{N}_{> 0}\). For first order
    tensors and tensor fields, we use bold lower-case letters, such as \(\boldsymbol{a}\)
    or \(\boldsymbol{b}\). For second order tensors and tensor fields we use bold
    upper-case letters, such as \(\boldsymbol{A}\) or \(\boldsymbol{B}\), and for
    fourth order tensors and tensor fields, we use blackboard bold upper-case letters,
    such as \(\mathbb{A}\) or \(\mathbb{B}\). For quantities of fixed order \(r \notin
    \{0, 1, 2, 4\}\), we also use blackboard bold upper-case letters and additionally
    indicate the order by an index, e.g., \(\mathbb{T}_8\) for an eighth order tensor.
    We denote the standard basis of \(d\)-dimensional euclidean space \(\mathbb{R}^d\)
    with \(\boldsymbol{e}_i\) for all dimensions \(d \in \mathbb{N}_{> 0}\), and follow
    the Einstein summation convention of summing over identical indices. Furthermore,
    we define the following frequently employed operations using tensor components
    given in the standard basis \(\boldsymbol{e}_i\):


    +   • The dot product of first order tensors and the Frobenius inner product denoted
    by \(\cdot\), e.g., \(\boldsymbol{a} \cdot \boldsymbol{b} = a_i b_i\) and \(\boldsymbol{D}
    \cdot \boldsymbol{D} = D_{ij} D_{ij}\).'
