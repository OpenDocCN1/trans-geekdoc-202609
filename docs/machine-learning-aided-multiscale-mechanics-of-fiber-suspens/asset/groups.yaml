    ## 3.4 计算调查


    ### 3.4.1 通过标量伸长粘度对悬浮液粘度的空间表示


    Böhlke and Brüggemann (2001) 引入了一种可视化各向异性刚度张量的简单方法。我们修改了该方法，通过伸长粘度 \(\eta_{\text{app}}$
    计算纤维聚合物悬浮液在特定方向上对伸长流动的阻力。在一般非牛顿型情况下，我们定义一种方向依赖的伸长粘度 \(\eta_{\text{app}}\)


    \(\eta_{\text{app}}(\dot{\gamma}, \mathbf{c}_{\text{F}}, \boldsymbol{d}) = \underline{a}(\boldsymbol{d})^{\mathsf{T}}
    \overline{\underline{\mathbb{V}}}(\dot{\gamma}, \mathbf{c}_{\text{F}}) \underline{a}(\boldsymbol{d})
    \approx \mathbb{V}(\dot{\gamma}, \mathbf{c}_{\text{F}})\cdot(\boldsymbol{d} \otimes
    \boldsymbol{d} \otimes \boldsymbol{d} \otimes \boldsymbol{d}), \quad (3.54)\)


    其中 \(\underline{a}(\boldsymbol{d})$ 表示 \(\boldsymbol{d} \otimes \boldsymbol{d}$
    在 Mandel 记法中的分量，\(\boldsymbol{d}$ 是伸长方向，悬浮液粘度 \(\overline{\underline{\mathbb{V}}}(\dot{\gamma},
    \mathbf{c}_{\text{F}}$) 通过方程 (3.33) 计算，作为真实悬浮液粘度张量 \(\mathbb{V}(\dot{\gamma},
    \mathbf{c}_{\text{F}}$) 的近似。由于真实悬浮液粘度张量 \(\mathbb{V}$ 具有小对称和大对称性，它由 21 个分量定义。因此，悬浮液粘度
    \(\overline{\underline{\mathbb{V}}}(\dot{\gamma}, \mathbf{c}_{\text{F}}$) 可以由一个标量伸长粘度和一个标量体积粘度完全描述。


