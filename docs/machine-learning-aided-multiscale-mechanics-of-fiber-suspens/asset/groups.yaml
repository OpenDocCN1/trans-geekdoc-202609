    和无穷小体元 \(\mathrm{d}V\) 的映射。我们可以将变形梯度 \(\boldsymbol{F}(\boldsymbol{X}, t)\) 分解为对称正定张量
    \(\boldsymbol{U}(\boldsymbol{X}, t) \in \text{Sym}^+(d)\) 和 \(\boldsymbol{V}(\boldsymbol{X},
    t) \in \text{Sym}^+(d)\)，以及正交张量 \(\boldsymbol{R}(\boldsymbol{X}, t) \in SO(d)\)，使得（Steinmann,
    2015）


    \(\boldsymbol{F}(\boldsymbol{X}, t) = \boldsymbol{U}(\boldsymbol{X}, t)\boldsymbol{R}(\boldsymbol{X},
    t) = \boldsymbol{R}(\boldsymbol{X}, t)\boldsymbol{V}(\boldsymbol{X}, t).\quad
