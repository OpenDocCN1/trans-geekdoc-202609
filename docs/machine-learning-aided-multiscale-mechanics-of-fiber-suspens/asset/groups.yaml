    \in \mathcal{A}\) 表示样本的有效材料张量。此外，材料张量的类别 \(\mathcal{A} \in \{ \mathsf{M}, \mathsf{M}_0
    \}\) 取决于所考虑的问题，我们遵循 Gajek et al. (2020) 并选择常数 \(p, q \in \mathbb{N}_{\ge 0}\)
    为 \(p = 1\) 和 \(q = 10\)，算子 \(\| \cdot \|_1$ 指的是 Mandel 表示法中分量的 \(\ell^1\)-范数。方程
    (5.76) 中的第二项以二次罚项形式对 DMN 的权重进行单纯形约束编码


    $\sum_{i=1}^{N_w} w^i_{K+1} = 1, \quad \text{where} \quad w^i_{K+1} \ge 0,$ (5.77)


