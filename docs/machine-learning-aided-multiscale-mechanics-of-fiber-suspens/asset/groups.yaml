    ## 第二章


    基础


    ### 2.1 引言


    本章简要总结了连续介质力学中的基础概念，这些概念构成了本论文所呈现研究的基础。更具体地说，我们讨论了支配连续介质行为的运动学和平衡方程，重点关注不可压缩等温流。此外，我们讨论了纤维增强介质中纤维取向状态的数学描述，这作为纤维微观结构研究与生成的中心量。关于连续介质力学中广泛方面的详细讨论，我们将读者引向
    Šilhavý (1997)、Haupt (2002)、Liu (2002)、Steinmann (2015) 以及 Morro and Giorgi (2023)。


