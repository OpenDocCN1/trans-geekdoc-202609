    ### 具有奇异核心的涂覆层状材料


    ### A.1 具有奇异核心的涂覆层状材料的奇异性条件


    在 CLM 的核心材料 \(m_1\) 为刚性或代表空隙的特殊情况下，双或原始材料属性 \(\mathbb{K}_1\) 或 \(\mathbb{M}_1\)
    分别趋于零。因此，更一般地，我们让材料张量 \(\mathbb{A}_1\) 趋于零，并将方程 (5.44) 改写为


    \[

    \lim_{\mathbb{A}_1 \to \mathbf{0}} \bar{\mathbb{A}} = \mathbb{A}_2 \left( \mathbb{I}
    + (1 - f_2) \left( -\mathbb{I} + f_2 \sum_{r=1}^R c_r \mathbb{\Gamma}_{\mathbb{A}_2}(\mathbf{n}_r)
    \mathbb{A}_2 \right)^{-1} \right). \tag{A.1}

    \]


    在下文中，我们研究了秩-\(R\) CLM 的有效材料属性 \(\bar{\mathbb{A}}\) 在什么条件下是奇异的。有效材料属性 \(\bar{\mathbb{A}}\)
    当且仅当存在有效张量 \(\bar{\mathbf{g}} \in \{ \text{Sym}(3), \text{Sym}_0(3) \}\)，使得


    \[

