    (2003) and Böhlke (2004), where the viscoplastic behavior of single crystals and
    polycrystals is modeled via a non-linear viscous approach.


    ### 3.2.2 Scale transition in non-linear viscosity


    Locally, the balance of linear momentum


    div \( (\boldsymbol{\tau}) - \nabla p = \mathbf{0} \quad \text{(3.14)}\)


    results from a split of the stress \(\boldsymbol{\sigma}\) inside the material
    into an unknown, periodic pressure field \(p: Y \rightarrow \mathbb{R}\) and the
    local viscous stress field


    \(\boldsymbol{\tau} = \mathcal{T}(\cdot, \bar{\mathbf{D}} + \nabla^s \boldsymbol{v}),
    \quad \text{(3.15)}\)


    and needs to be satisfied. Here, the pressure \(p\) acts as a reaction stress
    due to incompressibility. We consider a rectangular volume \(Y \subseteq \mathbb{R}^3\),
    and suppose that a heterogeneous dissipation potential \(\Psi: Y \times \text{Sym}_0(3)
    \rightarrow \mathbb{R}\) is given which satisfies the conditions discussed in
    the previous section pointwise. The associated stress operator reads


    \(\mathcal{T}: Y \times \text{Sym}_0(3) \rightarrow \text{Sym}_0(3), \quad \text{(3.16)}\)


    \((x, \mathbf{D}) \mapsto \frac{\partial \Psi}{\partial \mathbf{D}}(x, \mathbf{D}).
    \quad \text{(3.17)}\)


    The effective dissipation potential is defined as


    \(\bar{\Psi}(\bar{\mathbf{D}}) = \inf \left\langle \Psi(\cdot, \bar{\mathbf{D}}
    + \nabla^s \boldsymbol{v}) \right\rangle_Y \quad \text{for } \bar{\mathbf{D}}
    \in \text{Sym}_0(3), \quad \text{(3.18)}\)


    where the infimum is taken over all periodic velocity fields \(\boldsymbol{v}:
    Y \rightarrow \mathbb{R}^3\) with vanishing divergence and the operator \(\langle
    \cdot \rangle_Y\) denotes the spatial average


    \(\langle \cdot \rangle_Y \equiv \frac{1}{|Y|} \int_Y (\cdot) \, \mathrm{d}Y(\boldsymbol{x})
    \quad \text{with} \quad |Y| \equiv \int_Y \, \mathrm{d}Y(\boldsymbol{x}). \quad
    \text{(3.19)}\)


    The effective shear stress \(\bar{\boldsymbol{\tau}} \in \text{Sym}_0(3)\) then
    arises from the relationship


    \(\bar{\boldsymbol{\tau}}(\bar{\boldsymbol{D}}) = \frac{\partial \bar{\Psi}}{\partial
    \bar{\boldsymbol{D}}}(\bar{\boldsymbol{D}}),\)

    (3.20)


    which is similar to equation (3.6). Equivalently, the effective stress may be
    computed by averaging the local shear stress


    \(\bar{\boldsymbol{\tau}}(\bar{\boldsymbol{D}}) = \left\langle \mathcal{T}(\cdot,
    \bar{\boldsymbol{D}} + \nabla^{\text{s}}\boldsymbol{v}) \right\rangle_{Y},\)

    (3.21)


    where the periodic velocity field \(\boldsymbol{v}\) solves the Euler-Lagrange
    equation of the variational problem (3.18)


    \(\text{div } (\boldsymbol{\tau}) - \nabla p = \mathbf{0},\)

    (3.22)


    which equals the balance of linear momentum (3.14). The described procedure permits
    to compute the effective viscosity of a mixture of viscous materials. However,
    we are interested in the effective viscosity of a suspension, i.e., of a mixture
    involving rigid inclusions. Because the viscosity inside these inclusions is infinite,
    the differential equation (3.14) is not, constitutively, well-defined. To handle
    this issue, we transfer to a dual formulation. Inside the infinitely viscous inclusions,
    the fluidity, i.e., the inverse of the viscosity, vanishes identically. Consequently,
    the associated equations are, constitutively, well-defined.


    Instead of the effective dissipation potential (3.18) one may consider the effective
    complementary potential \(\bar{\Phi}\), a function of the effective shear stress
    \(\bar{\boldsymbol{\tau}}\), from which the constitutive law


    \(\bar{\boldsymbol{D}}(\bar{\boldsymbol{\tau}}) = \frac{\partial \bar{\Phi}}{\partial
    \bar{\boldsymbol{\tau}}}(\bar{\boldsymbol{\tau}}),\)

    (3.23)


    arises dual to the primal relationship (3.20). To obtain the effective viscosity,
    a strategy based on the effective complementary potential requires to invert the
    effective law (3.23). To avoid this difficulty, we use mixed "boundary conditions"
    (Kabel et al., 2016a), i.e., we consider the dual variational principle, but prescribe
    the effective shear rate tensor \(\bar{D}\). The convex dual of the variational
    problem (3.18) reads


    $$\langle \Phi(., \tau) - \tau \cdot \bar{D} \rangle_Y \longrightarrow \inf, $$
    (3.24)


    where the infimum is taken over all stress fields \(\tau : Y \to \text{Sym}_0(3)\)
    which satisfy the equilibrium equation (3.14) for a suitable pressure field, see
    Wicht et al. (2020b, §4 and Appendix B).


    ### 3.2.3 Computational aspects and setup


