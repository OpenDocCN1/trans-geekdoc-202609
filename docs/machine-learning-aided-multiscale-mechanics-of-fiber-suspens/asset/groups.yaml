    ### 3.5 Conclusions


    This chapter was devoted to study the effect of shear-thinning matrix behavior
    on the effective viscosity of fiber suspensions. We focused our considerations
    on shear rates of interest for engineering manufacturing processes, like injection
    and compression molding. For our investigations, we made use of a Cross-type viscosity
    model and an FFT-based computational method to determine the effective viscosity
    of fiber suspensions over a wide range of shear rates. We found the resolution
    error of the microstructure discretization to be dependent on the shear rate and
    load direction, with the minimum resolution error occurring at medium shear rates
    and pure shear loads. To our surprise, we found the representative volume element
    size to be highly similar in a Newtonian case with aligned microstructure and
    a Cross-type case with transversely isotropic microstructure. Over the considered
    shear rate interval, we found the Cross-type suspension viscosity to vary strongly
    in magnitude and in degree of anisotropy. Finally, we observed substantial deviations
    between the computational estimates and Mori-Tanaka type mean-field estimates
    for the suspension viscosity.


