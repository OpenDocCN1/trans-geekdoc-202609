    在前几节 3.2.2 和 3.2.4 中，我们讨论了基于 FFT 的均质化和纤维悬液解析建模的一些方面。在本节中，我们描述了本章中考虑的材料和微结构性能。接下来，我们关注纤维聚合物悬液的微结构，并在所有计算研究中将商业上可用的聚酰胺
    6 (PA6) (BASF, 2020) 用作基体材料。将 Cross-type 材料定律 (3.2) 拟合到温度为 \(250^{\circ}\text{C}\)
    时剪切速率 \(\dot{\gamma}\) 在区间 \([1.7, 16300] \text{ s}^{-1}\) 内可用的 PA6 材料数据上。可用材料数据及其拟合在图
    3.1 中可视化，得到的模型参数为 \(\eta_0 = 288.9 \text{ Pa s}\)、\(\eta_\infty = 15.0 \text{
    Pa s}\)、\(k = 10.9 \cdot 10^{-4}\) 和 \(m = 1.1\)。对于所有研究的具有牛顿基体行为的案例，剪切速率相关的基体粘度
    \(\eta\) 被选为 \(\eta = \eta_0\)。


    压缩成形过程中的典型剪切速率 \(\dot{\gamma}\) 低于 \(5 \cdot 10^1 \text{ s}^{-1}\)，而注塑成形过程中的剪切速率对于大多数材料通常保持在
    \(1 \cdot 10^5 \text{ s}^{-1}\) 以下 (Valero, 2020, 第 21.6.8 节)，但在薄壁和微注塑中可高达 \(1
    \cdot 10^6 \text{ s}^{-1}\) 以上 (Friesenbichler et al., 2011)。为了涵盖压缩和注塑成形过程中的一些工艺相关剪切速率区间，对宏观标量剪切速率进行了计算研究：


    \[

    \dot{\gamma} \in S_{\dot{\gamma}} = \{a \cdot 10^b \text{ s}^{-1} | a = 1, 2,
    5; b = 1, 2, 3, 4\} \cup \{10^5\}. \tag{3.44}

    \]


    由于当剪切速率 \(\dot{\gamma}\) 大于 \(1 \cdot 10^5 \text{ s}^{-1}\) 时，Cross-type 基体粘度仅略有变化，因此未研究高于
    \(1 \cdot 10^5 \text{ s}^{-1}\) 的剪切速率。


