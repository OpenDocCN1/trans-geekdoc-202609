    或，等价地，


    \[

    \Gamma_{\mathbb{I}}(\boldsymbol{n}_r)[\bar{\boldsymbol{g}}] = \bar{\boldsymbol{g}},
    \quad \forall r \in \{1, ..., R\}. \tag{A.5}

    \]


    我们证明如下。首先，如果 \(\bar{\boldsymbol{g}}\) 位于满足 (A.4) 的所有子空间的交集中，则根据方程 (A.5) 和算子 \(\Gamma_{\mathbb{A}_2}(\boldsymbol{n}_r)\)
