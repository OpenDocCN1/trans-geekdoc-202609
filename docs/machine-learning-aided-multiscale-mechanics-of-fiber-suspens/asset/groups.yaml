    if at least one layering direction is orthogonal to two other layering directions,
    or if at least two layering directions are collinear.


    - 3. Rank-3 CLMs with mutually non-orthogonal and mutually non-collinear layering
    directions \(n_1, n_2\), and \(n_3\) have non-singular effective properties. Thus,
    in the context of this thesis, we require


    ```

    0 < |n_1 \cdot n_2| < 1, \quad 0 < |n_1 \cdot n_3| < 1, \quad 0 < |n_2 \cdot n_3|
    < 1. (5.47)

    ```


    The statements 1-3 are of critical importance for the treatment of incompressible
    suspensions of rigid particles using a DMN architecture. It follows that CLMs
    with an incompressible coating material and rigid core material should be at least
    of rank \(R = 3\) and have non-collinear and mutually non-orthogonal layering
    directions to be non-singular. Therefore, we leverage such non-singular rank-3
    CLMs in the FDMN architecture to treat suspensions of rigid fibers, as we explain
    in section 5.3.2.


    ## 5.3 Identifying deep material networks for suspensions of rigid fibers


    ### 5.3.1 Architecture of direct deep material networks


    Because the FDMN architecture extends the (direct) DMN framework, we briefly summarize
    the direct DMN architecture in this section, before presenting the FDMN architecture
    in the next section 5.3.2. For in depth discussions and explanations of the direct
    DMN architecture, we refer the reader to articles by Gajek et al. (2020; 2021;
    2022). A two-phase direct DMN is defined as a perfect binary tree, consisting
    of two-phase laminates \(\mathcal{B}_k^i\) as nodes, see Figure 5.2a. The laminates
    \(\mathcal{B}_k^i\) are defined by a single lamination direction \(\boldsymbol{n}_k^i\)
    and two volume fractions \(c_{k,1}^1\) and \(c_{k,1}^2\). The DMN tree is ordered,
    rooted and has depth \(K\). We use the letter \(k = 1, ..., K\) to denote the
    depth of a node and the letter \(i = 1, ..., 2^{k-1}\) to indicate the horizontal
    position of a node in the respective layer. We parametrize a direct DMN by the
    two vectors $\underline{n} \in (\mathbb{R}^3)^{2^K-1}$


    \(\underline{n} = (\boldsymbol{n}_K^1, \dots, \boldsymbol{n}_K^{2^{K-1}}, \boldsymbol{n}_{K-1}^1,
    \dots, \boldsymbol{n}_{K-1}^{2^{K-2}}, \dots, \boldsymbol{n}_1^1),\) (5.48)


    and $\underline{w} \in \mathbb{R}^{2^K}$


    \(\underline{w} = (w_{K+1}^1, \dots, w_{K+1}^{2^K}).\) (5.49)


    Instead of the laminate volume fractions, the direct DMN is parametrized in terms
    of the weights \(w^i_{K+1}\) to improve numerical stability during the training
    process (Liu et al., 2019b; Liu and Wu, 2019). The \(i\)-th weight in the \(k\)-th
    layer is computed from the pairwise summation of the weights in the previous layer
    \(k+1\), see Figure 5.2a, such that


    \(w^i_k = w^{2i-1}_{k+1} + w^{2i}_{k+1},\) (5.50)


    and the volume fractions \(c^i_{k,1}\) and \(c^i_{k,2}\) follow from


    \(c^i_{k,1} = \frac{w^{2i-1}_{k+1}}{w^{2i-1}_{k+1} + w^{2i}_{k+1}},\) and \(c^i_{k,2}
    = 1 - c^i_{k,1}.\) (5.51)


    Additionally, the weights \(w^i_{K+1}\) need to be positive and sum to unity,
    such that


    \(w^i_{K+1} \ge 0\) and \(\sum_i^{2^K} w^i_{K+1} = 1.\) (5.52)


    The vectors $\underline{n}$ and $\underline{w}$ fully parametrize a direct DMN
    of depth \(K\) and are identified by fitting the linear homogenization function
    of the DMN to the linear homogenization function of the microstructure of interest.
    The fitting process is carried out by using supervised machine learning, and we
    refer to this process as *offline training*. To evaluate the linear homogenization
    function of the DMN during the offline training, input stiffness pairs are propagated
    through the network of homogenization blocks \(\mathcal{B}^i_k\), see Figure 5.2b.
    Consequently, if the stiffness \(\mathbb{C}^i_k\) of a homogenization block \(\mathcal{B}^i_k\)
    is singular, this singular stiffness can propagate


