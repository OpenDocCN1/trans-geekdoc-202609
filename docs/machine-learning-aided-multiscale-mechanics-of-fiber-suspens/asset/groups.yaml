    et al. (2017) employed a method where particles are modeled via a rigid collection
    of connected spheres called "multiblob". Balboa Usabiaga et al. (2017) successfully
    applied their multiblob approach to Stokes flow problems near walls and in channels,
    involving multiblobs of different geometries such as spheres and cylinders. Furthermore,
    Fast Fourier Transform (FFT) based computational techniques, that were first popularized
    in solid mechanics (Moulinec and Suquet, 1994; 1998), were also successfully applied
    to Stokes flow problems involving Newtonian fluids. In combination with the RVE
    method (Kanit et al., 2003), the FFT-based computational approach was used to
    solve problems in porous media (Willot, 2015; Mezhoud et al., 2020; Tu et al.,
