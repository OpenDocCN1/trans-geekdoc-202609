    4960 次计算，并得到 992 个计算出的有效黏度。在前几节 5.2.3 和 5.3.2 中，我们研究了 CLM 的线性同质化函数，并提出了 FDMN 架构来处理无限材料对比和不可压缩材料。在以下内容中，我们讨论了刚性颗粒悬浮液中
    FDMN 的离线训练材料采样、离线训练过程以及在线评估。


    ### 5.4.2 离线训练


    有了线性训练数据后，我们希望训练 FDMN 以预测剪切稀化纤维聚合物悬浮液的非牛顿黏性行为。我们遵循之前的工作（Gajek 等人，2020；2021），并将
    FDMN 的深度选择为 \( K = 8 \)，以实现非线性计算的足够预测质量。深度为 \( K = 8 \)、秩为 \( R = 3 \) 的 CLM 的
    FDMN 拥有 512 个权重和 638 个角度作为自由参数，符合方程 (5.53) 和 (5.73)。对于每个微结构，我们将训练数据 \(\mathcal{S}^D\)
    定义为


    \[

    \mathcal{S}^D = \{(\mathbb{V}_1^s, \mathbb{V}_F, \bar{\mathbb{V}}^s) \mid s \in
    (1, ..., 32)\}, \quad (5.93)

    \]


    其中 \(\mathbb{V}_1^s\) 表示用方程 (5.54) 生成的样品黏度，\(\mathbb{V}_F\) 表示刚性纤维的无限黏度，\(\bar{\mathbb{V}}^s\)
    代表样品 \( s \) 的有效黏度。对于每个微结构，我们将训练数据 \(\mathcal{S}^D\) 分为训练集 \(\mathcal{S}^t \subset
    \mathcal{S}^D\) 和验证集 \(\mathcal{S}^v \subset \mathcal{S}^D\)，分别占总训练数据的 90% 和 10%。训练集
    \(\mathcal{S}^t\) 和验证集 \(\mathcal{S}^v\) 不共享任何样本，即 \(\mathcal{S}^t \cap \mathcal{S}^v
    = \varnothing\)。


    作为 FDMN 参数的初始猜测，我们从各自的区间中均匀采样所有角度 $\underline{\alpha}$ 和权重 $\underline{w}$，并重新缩放权重
    $\underline{w}$ 使其总和为单位。由于我们使用相对较小的 32 个样本作为训练数据，我们将其中很大一部分用于训练集 $\mathcal{S}^t$，并选择每个纤维取向状态
    $\underline{\lambda}$ 训练 20 个 FDMN。此外，我们使用大小为 $N_{\mathrm{b}} = 8$ 的小型批次训练 FDMN，从训练集
    $\mathcal{S}^t$ 中随机抽取。如果最后一个批次少于 8 个样本，则丢弃该批次。由于参数向量 $\underline{\alpha}$ 和 $\underline{w}$
    的初始化以及离线训练过程都是随机的，FDMN 的参数和拟合质量各不相同。通过每个纤维取向状态训练 20 个 FDMN，我们利用这种随机性，以获得拟合质量高的
    FDMN。该策略旨在减少获得足够准确的 FDMN 所需的总计算工作量，因为在 32 个样本上反复训练 FDMN 所需的计算资源少于对较大样本量进行全场模拟。为了最小化损失函数
    $\mathcal{L}$，我们选择 RAdam 算法（Liu 等人，2019a），并使用学习率扫除（Smith 和 Topin，2019）来确定学习率 $\kappa_{0,
    \alpha}$ 和 $\kappa_{0, w}$。通过学习率扫除，我们为两个参数组 $\underline{\alpha}$ 和 $\underline{w}$
    获得高度相似的学习率，使得 $\kappa_{0, \alpha} = \kappa_{0, w} = 1 \cdot 10^{-2}$。随着学习过程的推进，我们使用
    PyTorch 的 StepLR 学习率调度器来改善向极小值的收敛（Darken 和 Moody，1990；Darken 等人，1992）。为此，我们每 150
    个时代将学习率 $\kappa_{0, \alpha}$ 和 $\kappa_{0, w}$ 乘以常数因子 $f_{LR} = 0.75$。除了学习率外，我们对两个动量系数
    $\beta_1 = 0.9$ 和 $\beta_2 = 0.999$ 以及稳定常数 $\varepsilon = 10^{-8}$ 使用了标准超参数。总体而言，我们对每个
    FDMN 总共训练 2000 个时代。


    ![](img/283dee3537da34c9897f9777475c5d3d_154_0.png)


    ![](img/283dee3537da34c9897f9777475c5d3d_154_1.png)


    (a) 训练集 $\mathcal{S}^{\text{t}}$


    (b) 验证集 $\mathcal{S}^{\text{v}}$


    图 5.6: 所有训练 FDMN 在训练集 \( \mathcal{S}^{\text{t}} \) (a) 和验证集 \( \mathcal{S}^{\text{v}}
    \) (b) 上的最小、最大和平均均值误差 \( e^{\text{mean}} \)。图改编自 Sterr 等人（2024a，图 6）。


    为了衡量拟合质量，我们定义了训练数据 \(\mathcal{S}^{\text{D}}\) 子集 \( \mathcal{S} \) 上的平均误差 \( e^{\text{mean}}
    \) 为


    \[

    e^{\text{mean}} = \frac{1}{|\mathcal{S}|} \sum_{(\mathbb{V}_1^s, \mathbb{V}_F,
    \bar{\mathbb{V}}^s) \in \mathcal{S}} \frac{\|\mathcal{DMN}_{\text{L}}(\mathbb{V}_1^s,
    \mathbb{V}_F, \underline{\alpha}, \underline{w}) - \bar{\mathbb{V}}^s\|_1}{\|\bar{\mathbb{V}}^s\|_1},
    \quad (5.94)

    \]


    其中 \( |\mathcal{S}| \) 是集合 \( \mathcal{S} \) 的基数。取决于纤维取向状态 \( \underline{\lambda}
    \) 以及角度 \( \underline{\alpha} \) 和权重 \( \underline{w} \) 的初始猜测，每个 DMN 的拟合质量各不相同。因此，针对所有
    620 个 FDMN 的整个训练过程，我们在图 5.6 中按时代可视化了训练集和验证集 \( \mathcal{S}^{\text{t}} \) 和 \(
    \mathcal{S}^{\text{v}} \) 的最小平均误差 \( \min(e^{\text{mean}}) \)、最大平均误差 \( \max(e^{\text{mean}})
    \) 和平均平均误差 \( \text{avg}(e^{\text{mean}}) \)。对于训练集和验证集，我们观察到，所考虑的三种误差指标在训练开始时迅速下降，并随着训练继续而不断改善。由于
    1500 个时代以后的学习率较小，训练过程结束时误差变化不显著，而最小平均误差 \(\min(e_{\text{t}}^{\text{mean}})\) 降至
    0.3% 以下。这表明所有 FDMN 在训练集 \(\mathcal{S}^\text{t}\) 上都具有较高的拟合质量。与训练集 \(\mathcal{S}^\text{t}\)
    相比，验证集 \(\mathcal{S}^\text{v}\) 的最大平均误差 \(\max(e_{\text{v}}^{\text{mean}})\) 和最小平均误差
    \(\min(e_{\text{v}}^{\text{mean}})\) 之间的差异更大。然而，对于所有考虑的 FDMN，最大平均误差 \(\max(e_{\text{v}}^{\text{mean}})\)
    始终保持在 2% 以下，且不会大幅波动。此外，平均平均误差 \(\text{avg}(e_{\text{v}}^{\text{mean}})\) 在训练过程中持续下降。因此，随着训练的推进，训练集和验证集上的预测质量平均得到改善，尽管最大平均验证误差
    \(\max(e_{\text{v}}^{\text{mean}})\) 在 1250 个训练时代后没有显著改善。总体而言，这表明对训练数据集 \(\mathcal{S}^\text{t}\)
    没有发生明显的过拟合。


    ### 5.4.3 在线评估


    为了衡量 FDMN 的在线性能，我们定义在线误差函数 \(e_{\text{on}} : \text{Sym}_0(3) \rightarrow \mathbb{R}\)
    为


    \[

    e_{\text{on}}(\bar{D}) = \frac{\|\sigma^{DMN}(\bar{D}) - \sigma^{FFT}(\bar{D})\|_2}{\|\sigma^{FFT}(\bar{D})\|_2},
    \tag{5.95}

    \]


    其中 \(\|\cdot\|_2\) 表示曼德尔表示法中分量的 \(\ell^2\)-范数，\(\bar{D}\) 代表规定的有效应变速率张量，\(\sigma^{DMN}
    : \text{Sym}_0(3) \rightarrow \text{Sym}_0(3)\) 和 \(\sigma^{FFT} : \text{Sym}_0(3)
    \rightarrow \text{Sym}_0(3)\) 分别是 FDMN 和基于 FFT 的同质化的应力函数。然后我们选择所有加载情况中的最大误差 \(e_{\text{on}}^{\max}\)
    和所有加载情况中的平均误差 \(e_{\text{on}}^{\text{mean}}\)


    \[

    e_{\text{on}}^{\max} = \max_{\bar{D} \in \bar{D}_\gamma} e_{\text{on}}, \quad
    e_{\text{on}}^{\text{mean}} = \frac{1}{|\bar{D}_\gamma|} \sum_{\bar{D} \in \bar{D}_\gamma}
    e_{\text{on}}(\bar{D}), \tag{5.96}

    \]


    以研究不同 FDMN 的性能。对于每个研究的取向状态 \(\underline{\lambda}\)，我们确定具有最小最大

