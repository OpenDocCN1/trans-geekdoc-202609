    ## 基于 FFT 计算方法的剪切稀疏纤维悬浮液黏度均质化¹


    ¹ 本章基于出版物“基于 FFT 计算方法的剪切稀疏纤维悬浮液黏度均质化”（Sterr et al., 2023）的第 1 至 5 部分。


    ### 3.1 引言


    尽管悬浮液黏度是直接工程关注的量，但通过实验方法难以确定完整的黏度张量。这部分是因为在流变学实验中难以确保特定的纤维取向状态（Binding, 1991），且悬浮液黏度强烈依赖于纤维取向（Poslinski
    et al., 1988）。此外，纤维在流变计研究过程中会断裂，这也会影响悬浮液黏度（Binding, 1991）。最后，悬浮液黏度对剪切速率和温度的依赖（Krishnan
    et al., 2010）进一步使问题复杂化。因此，张量和标量解析均质化方法通常与标量实验结合使用，以理解和预测局部悬浮液黏度。


    对于具有非牛顿基质行为的悬浮液，已根据二阶流体理论开发了多种模型（Leal, 1975; Kaloni and Stastna, 1983; Brunn,
    1977; 1980）。然而，这些模型仅限于单个悬浮颗粒。Brunn (1980) 还将其单颗粒模型应用于稀释悬浮液，并发现该模型无法捕捉颗粒-颗粒的水动力相互作用。在剪切稀疏幂律设定中，Goddard
    (1976b;a) 开发了一种用于稀释悬浮液的模型，该模型被其本人（Goddard, 1978）和 Mobuchon et al. (2005) 认为定性有前景但定量不准确。后来，Pipes
    et al. (1991; 1994) 在幂律设定中提出了一种用于浓缩和超浓缩体系的模型。尽管结果与 Binding (1991) 的实验数据吻合良好，但该模型受其单向且固定纤维阵列假设的限制。Souloumiac
    and Vincent (1998) 的另一种幂律模型的预测精度随剪切速率和纤维体积分数而强烈变化，使其难以适当应用。此外，更近期的模型（Férec et
    al., 2016; Tseng, 2021; Férec et al., 2017; Favarolo et al., 2018）尚未被确立为在广泛温度、剪切速率、纤维取向状态和纤维长径比范围内有效。总体而言，对纤维悬浮液中所有物理效应的整体理论处理证明是一项艰巨的任务。


    因此，计算方法也被用于处理具有非牛顿基质流体的悬浮液。Domurath et al. (2015) 使用有限元法（FEM）研究了悬浮在 Bird-Carreau
    流体中的单个球形颗粒的稀释悬浮液的有效黏度。对于非稀释悬浮液，Traxl et al. (2020) 使用基于 FEM 的方法研究了广义牛顿流体中非胶体棱角颗粒以及球形孔隙和颗粒悬浮液的有效黏度。Traxl
    et al. (2020) 的研究涉及球形、六面体和四面体颗粒的悬浮液，以及具有牛顿、幂律、Cross 型和 von Mises 型行为的基质流体。Švec
    et al. (2012) 研究了悬浮在牛顿和非牛顿基质流体中的刚性球形颗粒和纤维悬浮液的流变性能。为此，Švec et al. (2012) 使用了一种计算框架，结合了用于流体流动的格子玻尔兹曼法、用于自由表面表示的质量跟踪算法，以及用于考虑流体与颗粒之间相互作用的浸入边界方法。


    在本章中，鉴于具有非牛顿基质行为的纤维悬浮液在实验和理论处理方面的困难，我们应用基于 FFT 的计算方法来研究此类悬浮液的黏度。使用基于 FFT 的计算方法使我们能够利用高效的
    FFT 实现、强大的非线性方程求解器以及规则网格离散化。这使得能够研究具有微观结构的纤维悬浮液，这些微观结构否则难以使用界面拟合网格方法进行离散和调查。因此，我们将
    Bertóti et al. (2021) 详细阐述的用于牛顿基质行为悬浮液的方法扩展到非牛顿、Cross 型（Cross, 1965; 1970）剪切稀疏流体的悬浮液。在第
    3.2 节中，我们从理论和计算两个角度探讨有效悬浮液黏度，并利用基于插值的矩阵方程，从有限数量的计算实验中估计各向异性非牛顿悬浮液黏度。作为我们研究的物理基础，我们使用
    Cross 型材料定律来模拟市售 PA6 的黏度行为，并研究长径比为十的纤维悬浮液微观结构。在用于确定离散化悬浮液微观结构分辨率的初步调查中，我们发现有效应力的分辨率误差可能有利地依赖于剪切速率，见第
    3.3.2 节。通过体积元素尺寸研究，我们发现，对于工程考虑，特定牛顿案例和所研究的非牛顿案例所需的体积元素尺寸高度相似，见第 3.3.3 节。作为我们的主要贡献，我们在第
    3.4 节中可视化和讨论剪切速率和纤维体积分数如何影响悬浮液黏度的幅度和各向异性程度。我们观察到，黏度幅度随剪切速率降低，直到达到 Cross 型模型固有的最小黏度。相比之下，各向异性程度取决于基质表现非线性的程度。此外，我们发现，对于较高的纤维体积分数，幅度和各向异性程度对剪切速率的依赖性都会增加。在解析平均场模型与我们的计算结果之间的比较中，我们观察到预测黏度存在较大差异。


    ### 3.2 计算悬浮于非线性黏性介质中的颗粒的有效黏度


    ### 3.2.1 非线性黏度张量


    对于不可压缩牛顿流体，应变速率张量 \(D \in \text{Sym}_0(3)\) 和非平衡黏性应力张量 \(\tau \in \text{Sym}_0(3)\)
    通过本构定律相关联，


    \[

    \tau = 2\eta D,

    \]


    涉及剪切黏度 \(\eta\)。这里，\(\text{Sym}_0(3)\) 表示对称且迹为零的二阶张量的向量空间。更一般地，可以考虑非牛顿模型（Krishnan
    et al., 2010），其中黏度取决于标量剪切速率 \(\dot{\gamma} = \sqrt{2}\|D\|\)，其范数为 \(\|D\| = \sqrt{D
    \cdot D}\)。Cross 型（Cross, 1965; 1970）材料模型能够准确预测聚合物的剪切稀疏流变学（Krishnan et al., 2010）。


    其黏度由以下形式的表达式控制：


    $$\eta(\dot{\gamma}) = \eta_\infty + \frac{\eta_0 - \eta_\infty}{1 + (k\dot{\gamma})^m},
    \tag{3.2}$$


    具有正材料参数 \(\eta_0 \ge \eta_\infty, k,\) 和 \(m\)。对于剪切速率极限 \(\dot{\gamma} \rightarrow
    0\) 和 \(\dot{\gamma} \rightarrow \infty\)，标量黏度 \(\eta(\dot{\gamma})\) 分别趋近于初始黏度
    \(\eta_0\) 和渐近黏度 \(\eta_\infty\)。两个材料参数 \(k\) 和 \(m\) 控制黏度 \(\eta_0\) 和 \(\eta_\infty\)
    之间的过渡区域。


    为了描述非球形颗粒悬浮液，考虑更一般的各向异性黏度张量 \(\mathbb{V} \in L(\text{Sym}_0(3))\) 和形式（Ericksen,
    1959; 1960）的本构关系是方便的。


    $$\boldsymbol{\tau} = \mathbb{V}[\boldsymbol{D}], \tag{3.3}$$


    其中 \(L\) 指的是给定向量空间上的线性变换，黏度张量 \(\mathbb{V}\) 取决于纤维排列和纤维取向分布。如果悬浮流体本身是非牛顿流体，那么悬浮液通常由形式的本构关系控制：


    $$\boldsymbol{\tau} = \mathbb{V}[\boldsymbol{D}][\boldsymbol{D}] \tag{3.4}$$


    具有额外取决于剪切速率张量 \(\boldsymbol{D}\) 的黏度张量 \(\mathbb{V}\)。根据耗散不等式，黏度张量 \(\mathbb{V}(\boldsymbol{D})\)
