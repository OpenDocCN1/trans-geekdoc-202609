    \otimes \boldsymbol{n} \otimes \boldsymbol{n} \, \rho(\boldsymbol{n}) \, \mathrm{d}S(\boldsymbol{n}).
    \quad (3.37)

    \]


    Both tensors \(\boldsymbol{N}\) and \(\mathbb{N}\) are completely symmetric, positive
    semi-definite, and contract with the second-order unity tensor \(\mathbf{1}\)
    such that


    \[

    \bar{\boldsymbol{N}} \cdot \mathbf{1} = 1, \quad (3.38)

    \]


