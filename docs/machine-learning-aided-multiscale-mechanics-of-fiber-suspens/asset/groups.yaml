    FFT 的计算技术获得的仿真数据中学习的，材料与本章所考虑的相同：悬浮在具有表 4.1 所示参数的 Cross 型基体材料中的刚性纤维。然而，FDMN 方法与解析方法遵循非常不同的范式。FDMN
    通过学习相应的线性均质化函数来训练以近似微观结构的非线性均质化函数，无需预先了解实际本构方程。相比之下，解析模型的参数是从悬浮液的非线性应力响应中学习的，并且解析模型融入了关于预期材料行为的知识。尽管两种方法遵循不同的策略，但它们实现了可比的预测精度。对于本章考虑的载荷情况
    $\bar{D}_{\dot{\gamma}}$ 和纤维取向状态 $\underline{\lambda}$，FDMN 的最大验证误差为 4.31%，出现在纤维取向状态
    $\underline{\lambda} = (0.8055, 0.1389)^{\top}$。对于相同的载荷情况 $\bar{D}_{\dot{\gamma}}$
    和相同的纤维取向状态集 $\underline{\lambda}$，Sterr 等人（2024b）提出的四个解析模型中的三个达到最大预测误差 5.00%，出现在纤维取向状态
    $\underline{\lambda} = (0.8334, 0.0833)^{\top}$。第四个模型与其他三个模型相比不尽理想，因为内置的应力-应变率叠加和取向平均假设对所考虑的悬浮液并不十分适用（Sterr
    等人，2024b）。因此，FDMN 对于本论文所考虑的纤维悬浮液类型实现了略高的预测精度。此外，在一阶近似的限制条件下，FDMN 可以泛化到不同的本构方程，而所提出的解析模型不能，从而减少了
    FDMN 所需的建模工作量。然而，本论文中使用的 FDMN 使用 1150 个自由参数，而解析模型使用 11 到 49 个参数。


    就计算成本而言，为单个微观结构生成训练数据并训练一个 FDMN 平均耗时 9.88h 挂钟时间，见表 5.1。单个微观结构的解析模型参数是基于六个非线性基于
    FFT 的仿真识别的，平均耗时 2.61h 挂钟时间。如果所有必需的仿真在一个线程上串行运行，则平均总挂钟时间为 15.70h，并分配 0.04h 来识别模型参数。然而，在所考虑的设置下，非线性基于
    FFT 的仿真可以并行运行，因此解析模型参数可以比 FDMN 更快地获得。总之，FDMN 在所考虑的本构方程方面提供了更高的精度和灵活性，但需要更多的计算资源和更大数量的参数。此外，FDMN
    固有地具有热力学一致性（Gajek 等人，2020，§3.1），并且固有地来自其相位的应力-应变率单调性（Gajek 等人，2020，附录 C）。相比之下，在本构模型中，热力学一致性和应力-应变率单调性都必须手动确保。


    ### 5.5 结论


    在本章中，我们将直接 DMN 架构扩展到柔性 DMN（FDMN）架构，用于处理具有无限材料对比度和剪切稀化基体行为的纤维悬浮液。为此，我们为由 Stokes
    流控制并由线性黏性相组成的双相层状乳液推导了线性均质化函数。更具体地，我们利用 Kabel 等人（2016b）和 Milton（2002）关于层合板均质化的结果，为这类层状乳液的有效性质推导了闭式解析表达式。由于一级层状材料在无限材料对比度的情况下不适合作为
    DMN 的构建块，我们研究了涂层层状材料（CLM）的有效性质。我们利用一级层状材料的线性均质化函数，并研究了在什么条件下，如果核心材料是刚性的，CLM 的有效行为是非奇异的。这些条件取决于所用材料的物理约束，并涉及
    CLM 的秩和层状方向的相对取向。对于不可压缩纤维悬浮液的相关情况，CLM 由不可压缩的涂层材料和刚性核心材料组成。然后，如果三个层状方向相互非正交且相互非共线，三级
    CLM 的有效粘度是非奇异的。


    利用层状材料和 CLM 的推导均质化函数，我们通过将（直接）DMN 中的一级层合板最底层替换为非奇异 CLM，并将其他一级层合板替换为能够处理流体的一级层状材料，将（直接）DMN
    架构扩展到 FDMN 架构。对于 FDMN 的离线训练，我们提出了一种策略，即固定 CLM 层状方向的相对角度，以减少自由参数的数量并保证非奇异 CLM。此外，我们修改了直接
    DMN 的在线评估策略，以考虑不可压缩相位。我们利用 FDMN 架构来预测具有 Cross 型基体材料的纤维悬浮液的非线性有效行为。与基于 FFT 的计算技术的直接数值仿真相比，FDMN
