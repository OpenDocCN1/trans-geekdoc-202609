    ## 4.4.6 模型精度


    为了比较所介绍模型的精度，我们在以下部分定义误差度量并描述验证程序。由于为问题 (4.41) 寻找全局最小值很困难，我们将范围限制在极小化参数集 $S_{\min}$，并识别参数
    \(\underline{a}^{\min} \in S_{\min}\)，使其最小化所研究载荷情况集 \(\bar{D}_{\dot{\gamma}}\)
    上的最坏情况损失 \(\mathcal{L}\)，使得


    \(\underline{a}^{\text{min}}(\underline{\lambda}) = \underset{\underline{a} \in
    S_{\text{min}}}{\text{argmin}} \underset{\bar{\mathbf{D}} \in \bar{\mathcal{D}}_{\dot{\gamma}}}{\text{max}}
    \mathcal{L}(\bar{\mathbf{D}}, \underline{\lambda}, \underline{a}).\) (4.42)


    极小化参数 \(\underline{a}^{\text{min}}\) 仅在具有同质化数据的给定离散点 \(\underline{\lambda}\) 上可用。然而，按照要求
    (IV)，我们有兴趣将给定模型推广到没有可用极小化参数 \(\underline{a}^{\text{min}}\) 的纤维取向状态 \(\underline{\lambda}\)。为此，我们遵循
