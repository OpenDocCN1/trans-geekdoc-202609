    properties and the fiber geometry. The expression equals the lower Hashin-Shtrikman
    bound (Willis, 1977). In a second step, the effective viscosity of the volume
    element is calculated by orientation averaging the unidirectional effective viscosities
    \(\mathbb{V}_{UD}^m\) via


    \[

    \mathbb{V}_{MT} = \frac{1}{M} \sum_{m=1}^M \boldsymbol{V}_{UD}^m.

    \]


