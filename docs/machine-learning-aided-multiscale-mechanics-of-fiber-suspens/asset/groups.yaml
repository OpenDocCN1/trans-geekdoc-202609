    # 5.2.3 Coated layered materials


    Because we are interested in building FDMNs for suspensions of rigid particles,
    the architecture of the FDMN should be capable of handling infinitely viscous,
    i.e., rigid, phases. In this section, we leverage the homogenization equation
    (5.23) to study the homogenization of repeatedly layered materials in the presence
    of rigid phases. We define and use the term *rank* of a layered material in the
    following to better distinguish between the possible ways to construct layered
    materials. The rank \(R \in \text{N}_{\ge 0}\) of a hierarchical, layered material
    defines the number of layering steps that are needed to construct the material
    using layering directions \(\boldsymbol{n}_r \in \mathcal{S}^2\), such that the
    index \(r\) starts at one and ends at \(R\), i.e., \(r \in \{1, \dots, R\}\).
    By definition, a rank-0 layered material is simply a single phase material without
    any layering. Also, the materials that are layered at each layering step need
    not be the same. For example, let the first layer in a rank-2 layered material
    consist of the materials \(m_1\) and \(m_2\). Then, the second layer may consist
    of the materials \(m_1\) and \(m_2\) in the form of the first layer, and a third
    material \(m_3\).'
