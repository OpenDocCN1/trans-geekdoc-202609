    # 3.2.5 Material parameters


    In the previous sections 3.2.2 and 3.2.4, we discussed some aspects of FFT-based
    homogenization and analytical modeling of fiber suspensions. In this section,
    we describe the material and microstructure properties considered in this chapter.
    In the following, we are concerned with microstructures of fiber polymer suspensions,
    and we consider a commercially available polyamide 6 (PA6) (BASF, 2020) as matrix
    material in all computational studies. A Cross-type material law (3.2) was fitted
    to PA6 material data available for shear rates \(\dot{\gamma}\) in the interval
    \([1.7, 16300] \text{ s}^{-1}\) for a temperature of \(250^{\circ}\text{C}\).
    The available material data as well as the fit are visualized in Figure 3.1, and
    the resulting model parameters are \(\eta_0 = 288.9 \text{ Pa s}\), \(\eta_\infty
    = 15.0 \text{ Pa s}\), \(k = 10.9 \cdot 10^{-4}\), and \(m = 1.1\). For all studied
    cases with Newtonian matrix behavior, the shear rate dependent matrix viscosity
    \(\eta\) was chosen as \(\eta = \eta_0\).


    Typical shear rates \(\dot{\gamma}\) in compression molding processes are below
    \(5 \cdot 10^1 \text{ s}^{-1}\), while the shear rates in injection molding processes
    are typically kept below \(1 \cdot 10^5 \text{ s}^{-1}\) for most materials (Valero,
    2020, Sec. 21.6.8), but can go above \(1 \cdot 10^6 \text{ s}^{-1}\) in thin-wall
    and micro molding (Friesenbichler et al., 2011). To cover some of the process-relevant
    shear rate intervals for both compression and injection molding processes, computational
    investigations were conducted for the macroscopic scalar shear rates


    \(\dot{\gamma} \in S_{\dot{\gamma}} = \{a \cdot 10^b \text{ s}^{-1} | a = 1, 2,
    5; b = 1, 2, 3, 4\} \cup \{10^5\}.\) (3.44)'
