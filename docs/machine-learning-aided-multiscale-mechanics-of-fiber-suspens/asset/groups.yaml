    的第一阶空间导数，定义为变形梯度场 \(\boldsymbol{F}\)（Steinmann, 2015）


    \(\boldsymbol{F}: Y_0 \times [0, T] \rightarrow (\mathbb{R}^d)^{\otimes 2},\quad
    (\boldsymbol{X}, t) \mapsto \frac{\partial \boldsymbol{\chi}}{\partial \boldsymbol{X}}(\boldsymbol{X},
    t).\quad (2.10)\)


