    ## 1.3 本论文的大纲与贡献


    - 在第 2 章中，我们总结了连续介质力学的基础知识，这是本论文所呈现调查的基础。具体来说，我们讨论了以不可压缩流为重点的运动学和守恒方程。此外，我们简要讨论了使用纤维取向张量描述纤维取向状态的方法。


    - 在第 3 章中，我们介绍了一种基于 FFT 的计算同质化方法，用于处理非牛顿基体材料的纤维悬浮液。采用所提出的基于 FFT 的方法，我们研究了剪切稀释
    PA6 基体中刚性纤维悬浮液的各向异性剪切稀释行为。更具体地，我们研究了特定横向各向同性纤维取向状态和多个纤维体积分数下的非线性有效行为。我们发现，对于更高的纤维体积分数，各向异性剪切稀释更为显著，并且随着剪切速率增加，各向异性程度会降低，直至达到某些剪切速率。


    - 在第 4 章中，我们将第 3 章的调查扩展到 PA6 基体材料纤维悬浮液的 109 种不同纤维取向状态的各向异性剪切稀释。我们引入了一种非线性各向异性度量，并发现有效黏度及其对剪切速率的依赖性与纤维取向状态有强烈的变化。将我们的结果与文献中的见解相结合，我们制定了四种剪切稀释纤维悬浮液有效黏性行为的模型候选者。我们采用监督机器学习策略，从第
    3 章中提出的基于 FFT 的计算方法所获得的数据中学习模型参数。最后，我们评估了模型对所有考虑的纤维取向状态和广泛工程流动场景的预测精度。总体而言，所提出的四种模型中有三种能以工程精度预测有效悬浮液行为，而其中一种模型表现不佳。


    - 在第 5 章中，我们介绍了一种新型 DMN 架构，用于处理悬浮在不可压缩非牛顿介质中的刚性纤维。为此，我们推导了有限材料对比度的层状乳液线性同质化函数的封闭形式表达式。对于无限材料对比度的处理，我们依赖于一种特定的层状材料，即包覆层状材料。我们推导了包覆层状材料（具有不可压缩相位）有效行为非奇异的必要条件和充分条件，即使其核心相位是刚性的。使用所考虑的层状材料作为同质化模块，我们将
    FDMN 架构呈现为层状材料的嵌套树。我们在具有剪切稀释 PA6 基体材料的纤维悬浮液线性同质化数据上训练 FDMN，以预测悬浮液的非线性黏性行为。最后，我们将
    FDMN 的预测精度和适用性与第 4 章中提出的封闭形式模型进行比较。


    - 在第 6 章中，我们总结了最重要的研究结果，并以一些结语结束。


    ## 1.4 符号和常用运算


    所有缩写在各章首次出现时定义。同样，对于本论文中定义的每个量，我们在该量在各章中首次出现时提供定义。定义可能包括函数的定义域和值域、集合的超集、量所在的向量空间或量的张量阶等属性。此外，我们通过符号来编码量的张量阶。我们使用非粗体字母或希腊字母表示标量量和可变阶量
    \(r \in \mathbb{N}_{\ge 0}\)，例如 \(a, b\) 或 \(\alpha, \beta\)，并在量首次出现时提供完全定义该量所需的信息。另外，我们将包含零的自然数集表示为
    \(\mathbb{N}_{\ge 0}\)，将不包含零的自然数集表示为 \(\mathbb{N}_{> 0}\)。对于一阶张量和张量场，我们使用粗体小写字母，例如
    \(\boldsymbol{a}\) 或 \(\boldsymbol{b}\)。对于二阶张量和张量场，我们使用粗体大写字母，例如 \(\boldsymbol{A}\)
