    N_w} \to \mathcal{A}\) 表示如下


    $\mathcal{L} (\underline{\alpha}, \underline{w}) = \frac{1}{N_b} \sqrt[q]{\sum_{s=1}^{N_b}
    \left( \frac{ \left\| \bar{\bar{\mathsf{A}}}^s - \mathcal{DMN}_{\text{L}} \left(
    \mathsf{A}^s_1, \mathsf{A}^s_2, \underline{\alpha}; \underline{w} \right) \right\|_p
    }{ \left\| \bar{\bar{\mathsf{A}}}^s \right\|_p } \right)^q } + \lambda \left(
    \sum_{i=1}^{N_w} w^i_{K+1} - 1 \right)^2$ (5.76)


