    \sqrt{D \cdot D}\). Cross-type (Cross, 1965; 1970) material models are able to
    predict the shear-thinning rheology of polymers accurately (Krishnan et al., 2010).


    Their viscosity is governed by an expression of the form


    $$\eta(\dot{\gamma}) = \eta_\infty + \frac{\eta_0 - \eta_\infty}{1 + (k\dot{\gamma})^m},
    \tag{3.2}$$


    with positive material parameters $\eta_0 \ge \eta_\infty, k,$ and $m$. For the
    shear rate limits $\dot{\gamma} \rightarrow 0$ and $\dot{\gamma} \rightarrow \infty$,
    the scalar viscosity $\eta(\dot{\gamma})$ approaches the initial viscosity $\eta_0$
