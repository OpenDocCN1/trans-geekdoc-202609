    \underline{\underline{W}} \, \underline{\tau} \left( \overline{\underline{D}}
    + \underline{\underline{A}}b \right) \underline{\underline{A}} \right) \Delta
    \underline{b}_n = \underline{\underline{A}}^{\top} \underline{\underline{W}} \,
    \underline{\tau} \left( \overline{\underline{D}} + \underline{\underline{A}}b
    \right). \quad (5.87) $$


    迄今为止，该程序与以前工作（Gajek et al., 2020; 2021; 2022）中提出的（直接）DMN 方法完全类似。


    然而，对于不可压缩相，矩阵 \(\underline{\underline{A}}\) 是对称但奇异的，方程组 (5.87) 的解不是唯一的。


    然而，由于不可压缩性，我们知道跳跃向量 $\underline{b}$ 的第 \(i\) 个分量 \(\underline{b}_i\) 与层理法向量 \(\underline{n}\)
    的第 \(i\) 个分量 $\boldsymbol{n}_i$ 正交，即，


    \(\boldsymbol{b}_i \cdot \boldsymbol{n}_i = 0.\)


    因此，我们构造块对角矩阵 $\underline{\underline{N}} : (\mathbb{R}^3)^{\otimes N_n} \to (\mathbb{R}^3)^{\otimes
    N_n}$，其主对角线上由 $N_w$ 个块 $\boldsymbol{N}_i$ 组成，定义为


    \(\boldsymbol{N}_i = \beta_i \boldsymbol{n}_i \otimes \boldsymbol{n}_i, \quad
    i \in \{1, ..., N_w\}\)


    其中常数 $\beta_i \in \mathbb{R}_{>0}$。根据定义，有


    \(\boldsymbol{N}_i \boldsymbol{b}_i = \boldsymbol{0},\)


    且跳跃向量 $\underline{b}$ 在 $\underline{\underline{N}}$ 的零空间中，使得


    \(\underline{\underline{N}} \underline{b} = \underline{0}.\)


    因此，我们将方程 (5.87) 和 (5.91) 相加，使得得到的更新规则的解 $\Delta \underline{b}_n$


    \((\underline{\underline{H}} + \underline{\underline{N}}) \Delta \underline{b}_n
    = \underline{A}^\top \underline{W} \underline{\tau} (\bar{\underline{D}} + \underline{A}
    \underline{b}) ,\)


    是唯一的。然而，如果求和的数值数量级相差很大，浮点精度在对算子 $\underline{\underline{H}}$ 和 $\underline{\underline{N}}$
    进行相加时可能会引起问题。为解决此问题，标量 $\beta_i$ 需要根据矩阵 $\underline{\underline{H}}$ 中的条目量级来选择。此外，在训练过程中，某些输入权重
    $w_{K+1}^i$ 可能变为零或接近零，这可能导致系统矩阵 $(\underline{\underline{H}} + \underline{\underline{N}})$
    病态。因此，通过求解方程 (5.92) 获得准确的更新方向 $\Delta \underline{b}_n$ 可能会很困难。虽然通常可以通过移除体积分数消失或近似消失的相来剪枝
    FDMN 树（Liu and Wu, 2019），但这可能会将底层 FDMN 层的秩-3 CLMs 坍塌为较低秩的层状材料。


    在无限材料对比的情况下，这可能导致奇异有效性质通过 FDMN 传播。因此，优先使用可能病态的体系，并采用适当的方法求解病态体系（Neumaier, 1998）。或者，可以训练多个
    FDMN 并选择在线评估结果最好的一个。在本论文中，我们采用后一种方法。


