    $e_{\min}, e_{\max}$ 和 $e_{\text{mean}}$ 随分辨率 $v/d$ 的降低而降低。在牛顿型和 Cross 型两种情况下，且对于所有分辨率
    \(v/d\)，三个误差 (3.52) 的值对于复合体素均低于二进制体素。值得注意的是，对于二进制体素模型，最大误差 \(e_\text{max}\) 在分辨率
    \(v/d = 20\) 时低于 5%，而使用复合体素时，已在分辨率 \(v/d = 10\) 时满足此条件。


