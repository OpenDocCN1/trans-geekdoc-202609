  mdcn: "\n\n## 摘要\n\n在纤维增强聚合物（FRP）部件成型过程中，纤维悬浮液黏度影响各种工艺参数和物理场，进而影响最终零件性能。例如，悬浮液黏度影响注塑中的螺杆转速、压缩成型中的压制力，以及一般来说的流场。因此，对纤维悬浮液黏度的准确理解对于制造工艺建模和数字化工艺链预测精度至关重要。然而，纤维悬浮液黏度的实验和分析研究面临重大挑战。特别是，在流变学实验中难以确保特定的纤维取向状态。此外，聚合物熔体的高度非线性特性以及纤维悬浮液微结构的复杂几何形状使分析工作复杂化。\n\
    \n本论文将计算均质化方法与机器学习技术相结合，以研究和建模纤维悬浮液各向异性黏性行为。更准确地说，采用基于快速傅里叶变换（FFT）的计算技术来计算给定流动场景下纤维悬浮液的有效应力响应。随后，利用机器学习为有效悬浮液响应构建计算高效的代理模型。由于纤维增强尼龙6（PA6）材料体系具有工业相关性，本论文的研究聚焦于具有剪切稀释\
    \ PA6 基体材料的纤维悬浮液。\n\n现有的基于 FFT 的牛顿溶剂悬浮液均质化方法已扩展至非牛顿溶剂悬浮液。特别是，利用 Legendre–Fenchel\
    \ 变换获得相关变分单元问题的双重公式，并利用 FFT 和 Newton-CG 方法高效求解。\n\n基于 FFT 的方法与监督机器学习相结合，以开发具有剪切稀释\
    \ PA6 基体材料的纤维悬浮液有效行为的模型。为此，研究了 109 种不同纤维取向状态下纤维悬浮液的各向异性剪切稀释行为。基于调查结果，提出了四种有效黏度模型候选方案，并利用监督机器学习策略识别模型参数。此外，提出了一种用于处理非牛顿介质中刚性纤维悬浮液的新型深度材料网络（DMN）架构。特别是，利用两相层状乳液作为\
    \ DMN 构建单元，并推导了其封闭形式均质化函数。为了处理无限材料对比度，两相层状乳液以特定方式反复层状排列。所导出的层状材料被用于将直接 DMN 框架扩展到柔性\
    \ DMN（FDMN）架构。最后，利用 FDMN 预测具有剪切稀释 PA6 基体材料的纤维悬浮液的有效黏性响应。\n\n## 致谢\n\n我衷心感谢我的导师\
    \ Thomas Böhlke、Matti Schneider 和 Andrew Hrymak 的学术和个人指导与支持，这使得本论文得以完成。特别是，我要感谢\
    \ Thomas Böhlke 激发了我对连续介质力学的兴趣，指导我在这个领域进行科学探索，以及我们就广泛话题进行的宝贵讨论。我要感谢 Matti Schneider\
    \ 让我认识到数学和科学思维的各个方面，这些对我科学工作至关重要，并深刻影响我解决科学和非科学问题的方法。我也要感谢 Andrew Hrymak 提供关于聚合物加工的见解和专业知识，这对本论文贡献很大。此外，非常感谢他安排我在加拿大安大略省西安大略大学进行出色的研究访问。\n\
    \n此外，我要感谢连续介质力学 ITM 教授席全体工作人员，感谢我们共度的美好时光。我非常珍惜我们共同活动的回忆和分享的经历，我将非常怀念我们关于研究和各种其他话题的讨论。能与那些头脑聪慧、在每次讨论中都带来多样且深思熟虑观点的人在一起，真是一种莫大的快乐。非常感谢你们提供的所有支持，无论是个人、组织还是研究方面的支持。我也感谢\
    \ IRTG 2078 的所有成员，感谢在各种 IRTG 活动和研讨会上进行的激动人心的科学讨论和愉快时光。能够深入了解许多具有挑战性的研究问题是一个难得且宝贵的机会，这帮助我对自己研究周围的话题有了更广阔的视角。\n\
    \n我要感谢所有家人和朋友，在需要时倾听我的心声，并提供宝贵的放松和外部视角。我们共度的每一刻都在完成本论文的过程中发挥了关键作用。特别是，我要感谢 Lukas、Florian、Timo、Alex、Moritz\
    \ 和 Jihoo，多年来我们共度的美好时光以及作为如此支持我的朋友。此外，我要感谢 Martina 和 Klaus 的深刻建议，感谢我的祖母无条件的理解和支持，以及\
    \ Marius 始终积极且面向解决方案，无论面临何种情况。你们都激励我充分利用每一个情况，并始终向前迈进。\n\n此外，我衷心感谢 Franziska 始终陪伴在我身边。你的同理心在困难时期一直是我力量的源泉，你轻松愉快的笑容让欢乐时光更加欢乐。真的，谢谢你在我人生的起起落落中始终陪伴在我身边。\n\
    \n此外，我要向父母表达我最深切、最衷心的感激之情。非常感谢你们不仅在本论文期间，而且在我的整个人生中，始终如一的支持、亲切的话语和无尽的耐心。你们使我能够并鼓励我追随梦想，并从更广阔的视角思考生活。我真心感谢一切。\n\
    \n本论文记载的研究已由德国研究基金会（DFG）在国际研究培训小组“连续-不连续长纤维增强聚合物结构的集成工程”（GRK 2078）框架下资助。谨感谢德国研究基金会（DFG）的支持。\n\
