    and 3.8, we observe that for both the Newtonian and Cross-type case, the elongational
    viscosity \(\eta_\text{app}\) is large when the direction \(\boldsymbol{d}\) is
    aligned with the principal fiber orientation axis. This is expected, since flow
    resistance along the cylindrical fibers is higher than in other flow directions.
    Furthermore, the elongational viscosity \(\eta_\text{app}\) for both cases increases
    with growing fiber volume fraction \(c_\text{F}\) in all directions \(\boldsymbol{d}\).
    However, in the Cross-type case, the elongational viscosity \(\eta_\text{app}\)
    decreases with the shear rate \(\dot{\gamma}\) in all directions \(\boldsymbol{d}\).
    Depending on the value of the shear rate \(\dot{\gamma}\), one effect outweighs
    the other. Note that the minimum value of the elongational viscosity \(\eta_\text{app}\)
    does not occur perpendicular to the principal fiber orientation axis \(x\) in
    both cases, because of incompressibility.


