    e_K^{3(2^{K-1})}, \right. \)


    \( \left. a_{K-1}^1, b_{K-1}^1, \dots, a_{K-1}^{2^{K-2}}, b_{K-1}^{2^{K-2}}, \dots,
    a_1^1, b_1^1 \right), \tag{5.74} \)


