    vectors \(\underline{a}\).


    We selected the ADAM algorithm from the optimization algorithms available in the
    PyTorch framework, since the ADAM algorithm combines an adaptive learning rate
    with a classical momentum (Polyak, 1964) based approach. This provides advantages
    over the standard gradient descent method (Kabel et al., 2014; Ruder, 2016), and
    algorithms relying on adaptive learning rates alone, such as AdaGrad (Duchi et
    al., 2011), AdaDelta (Zeiler, 2012) and RMSprop (Tieleman et al., 2012). For a
    detailed discussion on the convergence properties of the ADAM algorithm and its
    variants, we refer the reader to an article by Chen et al. (2018). Also, for an
