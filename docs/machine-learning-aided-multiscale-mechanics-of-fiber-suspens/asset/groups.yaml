    \([10^2, 10^3] \text{ s}^{-1}\), before decreasing again for higher shear rates.
    The largest error occurs for the elongational load case \(\tilde{\boldsymbol{D}}_3\)
    with 4.31%, and is closely followed by 4.08% for the elongational load case \(\tilde{\boldsymbol{D}}_1\).
    For the shear load cases \(\tilde{\boldsymbol{D}}_4\), \(\tilde{\boldsymbol{D}}_5\),
    and \(\tilde{\boldsymbol{D}}_6\), the largest errors are 3.05%, 2.78%, and 3.23%,
    respectively, while the largest error for the elongational load case \(\tilde{\boldsymbol{D}}_2\)
    is 2.2%. The largest error for the shear load case \(\tilde{\boldsymbol{D}}_6\)
    occurs at a shear rate of \(\dot{\gamma} = 10^2 \text{ s}^{-1}\), whereas the
    largest errors for all other load cases occur at a shear rate of \(\dot{\gamma}
    = 5 \cdot 10^2 \text{ s}^{-1}\). This is directly tied to the Cross-type constitutive
    equation (3.2), which has two Newtonian plateaus for low and high shear rates
    and a non-linear transition in between. Consequently, for large shear rates \(\dot{\gamma}
    \to \infty\) the Matrix behavior is Newtonian and the homogenization function
    of the microstructure approaches the linear homogenization function. Since the
    FDMN approximates the non-linear homogenization function the microstructure to
    first order (Gajek et al., 2020), the prediction quality depends on the degree
    to which the matrix behaves non-linearly. This is in line with previous observations
    regarding the modelling of shear-thinning fiber suspensions (Sterr et al., 2023;
    2024b).


    ## 5.4.4 Computational Speedup


    | | Sampling Total | Sampling Per orientation (mean) | Training |

    |---|---|---|---|

    | CPU Hours | 24415 | 788 | 0.08 |

    | Wall-clock time (h) | 305 | 9.8 | 0.08 |


    Table 5.1: CPU hours and wall-clock time for the training of one FDMN and the
    sampling of effective viscosities \(\mathbb{V}^s\) using FFT-based homogenization.
    Table adapted from Sterr et al. (2024a, Table 2).


    | | FFT (h) | DMN (ms) | Speedup |

    |---|---|---|---|

    | Min | 2.08 | 600 | 11785 |

    | Mean | 2.61 | 630 | 14828 |

    | Max | 3.07 | 650 | 17225 |


    Table 5.2: Speedups and wall-clock times for the evaluation of a single load case
    using FFT-based homogenization compared to an FDMN. Table adapted from Sterr et
    al. (2024a, Table 3).


    For sampling the linear homogenization functions of the 31 considered fiber orientation
    states \(\underline{\lambda} \in S_T\), we used a workstation with two AMD EPYC
    7552 48-Core processors and 1024 GB DRAM. We relied on a single thread per FFT-based
    computation and ran 80 computations in parallel. In total, the computations took
    24415 CPU hours and a wall-clock time of 305 hours, see Table 5.1. Averaging over
    all 31 considered orientations \(\underline{\lambda}\), this leads to 788 CPU
    Hours and 9.8h wall-clock time per orientation. For the training and the online
    evaluation of the FDMNs, as well as the non-linear FFT-based computations, we
    used a workstation with two AMD EPYC 9534 64-Core Processors and 1024 GB DRAM,
    and ran all computations on a single thread. The wall-clock time to evaluate all
    six load cases \(\boldsymbol{D}_i, i=1,\dots,6\), and thirteen shear rates \(\dot{\gamma}
    \in S_{\dot{\gamma}}\) in series for a single fiber orientation state \(\underline{\lambda}\)
    is listed in Table 5.2. The wall-clock times for the FFT-based computations range
    from 2.08h to 3.07h with the mean wall-clock time over all considered orientation
    states \(\underline{\lambda}\) being 2.61h. In contrast, the online evaluation
    of the FDMNs takes between 600ms and 630ms, with a mean of 650ms. Consequently,
    the speedup factors range between 11785 and 17225 with a mean of 14828. This considerable
    speedup is achieved by investing computational resources into the sampling of
    the linear homogenization functions of the microstructures. It is straightforward
    to judge whether this investment is sensible for the considered setup. For one
    microstructure the generation of training data and the training of a single FDMN
    takes 9.88h wall-clock time on average, while the non-linear FFT-based computations
    take 2.61h wall-clock time on average. Therefore, assuming the non-linear computations
    run on one thread as in the presented setup, it would take four non-linear computation
    to offset the initial investment into an FDMN on average. Given that component
    scale simulations routinely require thousands or millions of microscale computations
    (Gajek et al., 2021; 2022), the sampling and training effort is offset easily
    in engineering problems.

