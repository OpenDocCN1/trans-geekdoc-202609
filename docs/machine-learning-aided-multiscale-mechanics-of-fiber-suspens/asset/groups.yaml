    # Chapter 1


    # Introduction


    # 1.1 Motivation and goals


    Especially because of their high specific stiffness, fiber reinforced composites
    are widely used for lightweight design, particularly in the transport and energy
    sectors (Swolfs, 2017; Wazeer et al., 2023). During the design process of fiber
    reinforced composite components, combinations of molding simulations and structural
    simulations are central to facilitate use case appropriate and material oriented
    design through digital twins (Botin-Sanabria et al., 2022) and virtual process
    chains (Henning et al., 2019; Göthofer et al., 2019; Meyer et al., 2023). In molding
    simulations of fiber reinforced composite parts, accurate prediction of the local
    fiber suspension viscosity is vital to correctly estimate process parameters (Castro
    and Tomlinson, 1990; Goodship, 2017) and other engineering quantities. In particular,
    the fiber orientation and the fiber volume distributions (Tseng et al., 2018),
    the flow fields, (Karl et al., 2021), as well as the final part properties (Mortazavian
    and Fatemi, 2015; Böhlke et al., 2019; Karl et al., 2021) depend on the suspension
    viscosity. However, in component scale simulations, it is computationally


    This chapter is based on the respective section 1 of the publications "Homogenizing
    the viscosity of shear-thinning fiber suspensions with an FFT-based computational
    method" (Sterr et al., 2023), "Machine learning assisted discovery of effective
    viscous material laws for shear-thinning fiber suspensions" (Sterr et al., 2024b),
    and "Deep material networks for fiber suspensions with infinite material contrast"
    (Sterr et al., 2024a)'
