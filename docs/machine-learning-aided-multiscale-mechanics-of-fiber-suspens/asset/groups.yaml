    架构的深入讨论和解释，我们将读者引向 Gajek et al. (2020; 2021; 2022) 的文章。双相直接 DMN 被定义为一棵完美二叉树，由双相层压材料
    \(\mathcal{B}_k^i\) 作为节点组成，参见图 5.2a。层压材料 \(\mathcal{B}_k^i\) 由单个层压方向 \(\boldsymbol{n}_k^i\)
    和两个体积分数 \(c_{k,1}^1\) 和 \(c_{k,1}^2\) 定义。DMN 树是有序的、有根的，并具有深度 \(K\)。我们使用字母 \(k
    = 1, ..., K\) 表示节点的深度，使用字母 \(i = 1, ..., 2^{k-1}\) 表示节点在相应层中的水平位置。我们通过两个向量 $\underline{n}
    \in (\mathbb{R}^3)^{2^K-1}$ 参数化直接 DMN


    \(\underline{n} = (\boldsymbol{n}_K^1, \dots, \boldsymbol{n}_K^{2^{K-1}}, \boldsymbol{n}_{K-1}^1,
    \dots, \boldsymbol{n}_{K-1}^{2^{K-2}}, \dots, \boldsymbol{n}_1^1),\) (5.48)


    和 $\underline{w} \in \mathbb{R}^{2^K}$


    \(\underline{w} = (w_{K+1}^1, \dots, w_{K+1}^{2^K}).\) (5.49)


