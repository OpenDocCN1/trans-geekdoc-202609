    ### 3.1 Introduction


    Even though the suspension viscosity is a quantity of direct engineering interest,
    it is difficult to determine the full viscosity tensor by experimental methods.
    This is partly because it is challenging to ensure a specific fiber orientation
    state during rheology experiments (Binding, 1991), and the suspension viscosity
    depends strongly on the fiber orientation (Poslinski et al., 1988). Furthermore,
    fibers break during rheometer studies, which also affects the suspension viscosity
    (Binding, 1991). Last but not least, the dependence of the suspension viscosity
    on shear rate and temperature (Krishnan et al., 2010) further complicates matters.
    As a result, tensorial and scalar analytical homogenization methods are commonly
    used in conjunction with scalar experiments to understand and predict the local
    suspension viscosity.


    In the case of suspensions with non-Newtonian matrix behavior, multiple models
    (Leal, 1975; Kaloni and Stastna, 1983; Brunn, 1977; 1980) were developed based
    on second order fluid theory. However, these models are restricted to a single
    suspended particle. Brunn (1980) also applied his single particle model to dilute
    suspensions and found that the model could not capture hydrodynamic particle-particle
    interactions. In a shear-thinning power law setting, Goddard (1976b;a) developed
    a model for dilute suspensions, which was found to be qualitatively promising
    but quantitatively inaccurate by himself (Goddard, 1978) and Mobuchon et al. (2005).
    Later, Pipes et al. (1991; 1994) proposed a model for the concentrated and hyperconcentrated
    regime in a power law setting. Even though the results agree well with experimental
    data by Binding (1991), the model is limited by its assumption of unidirectional
    and fixed fiber arrays. The prediction accuracy of another power-law model by
    Souloumiac and Vincent (1998) varies strongly with the shear rate and fiber volume
    fraction, making it difficult to apply appropriately. Also, more recent models
    (Férec et al., 2016; Tseng, 2021; Férec et al., 2017; Favarolo et al., 2018) have
    yet to be established as valid over a wide range of temperatures, shear rates,
    fiber-orientation states and fiber aspect ratios. Overall, holistic theoretical
    treatment of all physical effects in fiber suspensions proves to be a difficult
    task.


    Consequently, computational methods were also employed to treat suspensions with
    non-Newtonian matrix fluids. Domurath et al. (2015) used the Finite Element Method
    (FEM) to study the effective viscosity of a dilute suspension with a single spherical
    particle suspended in a Bird-Carreau fluid. For non-dilute suspensions, Traxl
    et al. (2020) used a FEM-based approach to investigate the effective viscosity
    of suspensions with noncolloidal angular, as well as spherical pores and particles
    in generalized-Newtonian fluids. The investigations of Traxl et al. (2020) consider
    suspensions with spherical, hexahedral, and tetrahedral particles, as well as
    matrix fluids with Newtonian, Power-law, Cross-type, and von Mises-type behavior.
    Švec et al. (2012) studied rheological properties of suspensions with rigid spherical
    particles and fibers suspended in Newtonian and non-Newtonian matrix fluids. To
    do so, Švec et al. (2012) used a computational framework combining the lattice
    Boltzmann method for fluid flow, a mass tracking algorithm for free surface representation,
    and an immersed boundary approach to consider interactions between the fluid and
    the particles.


    In this chapter, with regard to the difficult experimental and theoretical treatment
    of fiber suspensions with non-Newtonian matrix behavior, we apply FFT-based computational
    methods to study the viscosity of such suspensions. Using FFT-based computational
    methods allows us to leverage highly efficient implementations of the FFT, powerful
    non-linear equation solvers, and discretizations with regular grids. This enables
    the study of fiber suspensions with microstructures that are otherwise difficult
    to discretize and investigate using interface-conforming mesh based approaches.
    Thus, we extend the approach for suspensions with Newtonian matrix behavior detailed
    by Bertóti et al. (2021) to suspensions with non-Newtonian, Cross-type (Cross,
    1965; 1970) shear-thinning fluids. In section 3.2, we approach the effective suspension
    viscosity from a theoretical and a computational perspective, and make use of
    an interpolation based matrix equation to estimate the anisotropic, non-Newtonian
    suspension viscosity from a limited number of computational experiments. As the
    physical basis for our investigations, we use a Cross-type material law to model
    the viscosity behavior of a commercially available PA6, and study suspension microstructures
    with fibers of aspect ratio ten. In preliminary investigations to identify the
    resolution of the discretized suspension microstructure, we find that the resolution
    error of the effective stresses can depend favorably on the shear rate, see section
    3.3.2. Through a volume element size study, we find that the necessary volume
    element size for engineering considerations are highly similar in a specific Newtonian
    case and the investigated non-Newtonian case, see section 3.3.3. As our main contribution,
    we visualize and discuss in section 3.4 how the shear rate and fiber volume fraction
    influence the magnitude and degree of anisotropy of the suspension viscosity.
    We observe that the viscosity magnitude decreases with the shear rate until a
    Cross-type model intrinsic, minimum viscosity is reached. In contrast, the degree
    of anisotropy depends on the degree to which the matrix behaves nonlinearly. Additionally,
    we find that the dependence of both the magnitude and the degree of anisotropy
    on the shear rate is increased for higher fiber volume fractions. In a comparison
    between an analytical mean-field model and our computational results, we observe
    large discrepancies in the predicted viscosities.


    ### 3.2 Computing the effective viscosity of particles suspended in a non-linear
    viscous medium


    ### 3.2.1 The non-linear viscosity tensor


    For an incompressible Newtonian fluid, the strain rate tensor \(D \in \text{Sym}_0(3)\)
    and the non-equilibrium viscous stress tensor \(\tau \in \text{Sym}_0(3)\) are
    related by the constitutive law


    \[

    \tau = 2\eta D,

    \]


    involving a shear viscosity \(\eta\). Here, \(\text{Sym}_0(3)\) denotes the vector
    space of symmetric and traceless second-order tensors. More generally, non-Newtonian
    models (Krishnan et al., 2010) may be considered where the viscosity depends on
