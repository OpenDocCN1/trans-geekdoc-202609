    interpolation techniques (Gajek et al., 2021; Huang et al., 2022; Dey et al.,
    2024) the presented FDMNs could enable novel types of multiscale simulations.


    ## Appendix A


    ### Coated layered materials with singular core


    ### A.1 Singularity condition for coated layered materials with singular core


    In the particular cases that the core material \(m_1\) of a CLM is rigid or represents
    a void, the dual or the primal material properties \(\mathbb{K}_1\) or \(\mathbb{M}_1\)
    approach zero, respectively. Thus, more generally, we let the material tensor
    \(\mathbb{A}_1\) approach zero, and rewrite equation (5.44) as


    \[

    \lim_{\mathbb{A}_1 \to \mathbf{0}} \bar{\mathbb{A}} = \mathbb{A}_2 \left( \mathbb{I}
    + (1 - f_2) \left( -\mathbb{I} + f_2 \sum_{r=1}^R c_r \mathbb{\Gamma}_{\mathbb{A}_2}(\mathbf{n}_r)
    \mathbb{A}_2 \right)^{-1} \right). \tag{A.1}

    \]


    In the following, we study under which conditions the effective material properties
    \(\bar{\mathbb{A}}\) of a rank-\(R\) CLM are singular. The effective material
    properties \(\bar{\mathbb{A}}\) are singular precisely if there exists an effective
    tensor \(\bar{\mathbf{g}} \in \{ \text{Sym}(3), \text{Sym}_0(3) \}\), such that


    \[

    \bar{\mathbb{A}}[\bar{\mathbf{g}}] = \mathbf{0}. \tag{A.2}

    \]


    Using the definition (A.1), equation (A.2) may be equivalently rewritten in the
    form


    \[

    \left( \sum_{r=1}^R c_r \Gamma_{\mathbb{A}_2}(\boldsymbol{n}_r)\mathbb{A}_2 \right)
    [\bar{\boldsymbol{g}}] = \bar{\boldsymbol{g}}. \tag{A.3}

    \]


    Equation (A.3) is satisfied precisely if \(\bar{\boldsymbol{g}}\) lies in the
    intersection of all subspaces \(\mathcal{E}_r^A\), such that


    \[

    \bar{\boldsymbol{g}} \in \bigcap_{r=1}^R \mathcal{E}_r^A, \tag{A.4}

    \]


    or, equivalently,


    \[

    \Gamma_{\mathbb{I}}(\boldsymbol{n}_r)[\bar{\boldsymbol{g}}] = \bar{\boldsymbol{g}},
    \quad \forall r \in \{1, ..., R\}. \tag{A.5}

    \]


    We prove this as follows. First, if \(\bar{\boldsymbol{g}}\) lies in the section
    of all subspaces such that (A.4) is satisfied, it follows from equation (A.5)
    and the definition of the operator \(\Gamma_{\mathbb{A}_2}(\boldsymbol{n}_r)\)
    (5.43) that


    \[

    \begin{aligned}

    \left( \sum_{r=1}^R c_r \Gamma_{\mathbb{A}_2}(\boldsymbol{n}_r) \mathbb{A}_2 \right)
    [\bar{\boldsymbol{g}}] &= \left( \sum_{r=1}^R c_r \Gamma_{\mathbb{A}_2}(\boldsymbol{n}_r)
    \mathbb{A}_2 \Gamma_{\mathbb{I}}(\boldsymbol{n}_r)[\bar{\boldsymbol{g}}] \right)
    \\

    &= \sum_{r=1}^R c_r \bar{\boldsymbol{g}} = \bar{\boldsymbol{g}},

    \end{aligned} \tag{A.6}

    \]


    and hence equation (A.3) is satisfied. Second we wish to prove that the converse
    is also true, i.e., if equation (A.3) is satisfied, equation (A.4) is satisfied
    as well. Let \(\mathbb{T}_{\mathbb{A}_2}\) denote a convex combination of the
    projectors \(\Gamma_{\mathbb{A}_2}(\boldsymbol{n}_r)\mathbb{A}_2\), i.e.,


    \[

    \mathbb{T}_{\mathbb{A}_2} = \left( \sum_{r=1}^R c_r \Gamma_{\mathbb{A}_2}(\boldsymbol{n}_r)
    \mathbb{A}_2 \right), \tag{A.7}

    \]


    with


    \[

    c_r > 0 \quad \text{and} \quad \sum_{r=1}^R c_r = 1. \tag{A.8}

