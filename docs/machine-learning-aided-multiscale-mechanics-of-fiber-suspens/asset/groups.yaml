    = 10$ 和纤维体积分数 \(c_\text{F}$ 高达 25% 的纤维悬浮液的适当体元大小。取决于纤维取向，Bertóti et al. (2021)
    确定了不同的代表性体元大小，在纤维排列的情况下，形式为 \(2.2\ell \times 20d \times 20d$ 的体元被确定为足够具有代表性。在此基础上，我们进行了一项研究，以确定
    Cross 型情况下所考虑的各向异性取向状态（纤维纵横比 \(r_a = 10$，纤维体积分数 \(c_F \in \{5\%, 10\%, 15\%, 20\%,
    25\%\}\)）的合适体元大小。由于所需体元大小随纤维体积分数 \(c_F$ 增大，我们为体元研究选择了 \(c_F = 25\%$。我们研究了形式为 \(L
