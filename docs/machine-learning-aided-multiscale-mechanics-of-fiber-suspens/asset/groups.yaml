    Viscosity models for fiber polymer suspensions are widely used in molding process
    simulations of composite parts (Kennedy and Zheng, 2013), which play a major role
    in the lightweight design of engineering systems, i.e., in the automotive, aerospace,
    and energy sectors (Henning et al., 2019; Qureshi, 2022). Molding process simulations
    are an established tool in composite part engineering, partly because of the industrial
    benefits of digital twins (Botín-Sanabria et al., 2022) and virtual process chains
    (Henning et al., 2019; Görthofer et al., 2019; Meyer et al., 2023). In molding
    simulations for fiber reinforced plastics, accurate modeling of the suspension
    viscosity is crucial to predict various parameters of engineering interest. The
    suspension viscosity influences manufacturing process parameters (Castro and Tomlinson,
    1990; Goodship, 2017), as well as fiber orientation and fiber volume distributions
    (Tseng et al., 2018). Consequently, flow fields (Karl et al., 2021) and final
    part properties (Böhlke et al., 2019; Karl et al., 2021) are also affected by
    the suspension viscosity. In light of the analytical and experimental difficulties
    involved when studying the viscosity of fiber suspensions with non-Newtonian solvents,
    computational approaches provide insights and observations that are otherwise
    hard to obtain. Švec et al. (2012) combined the lattice Boltzmann method for fluid
    flow, an immersed boundary procedure for the interaction between fluid and rigid
    particles, and a mass tracking algorithm for the free surface representation to
    simulate slump tests of a suspension of rigid spherical particles and fibers suspended
    in a Bingham-type fluid. In comparison with a slump test of pure matrix material,
    they observed a smaller spread and increased height in the slump test of the suspension,
    suggesting an increased effective yield stress. Using a Finite Element Method
    (FEM) based approach, Domurath et al. (2020) investigated the rheological coefficients
    of the transversely isotropic fluid equation by Ericksen (1960) in the context
    of rigid fibers suspended in a power-law fluid. In a simple shear flow, they found
    the model by Souloumiac and Vincent (1998) to overpredict the orientation dependence
    of a rheological coefficient. Combining the RVE method (Kanit et al., 2003) and
    Fast Fourier Transform (FFT) based computational techniques (Schneider, 2021),
    Sterr et al. (2023) extended work by Bertóti et al. (2021) on Newtonian fiber
    suspensions to suspensions with non-Newtonian solvents. They visualized the anisotropic
    viscosity tensor in the case of a Cross-type matrix fluid and studied the effects
    of fiber volume fraction and shear rate on the suspension viscosity.


    In this chapter, we combine high fidelity, FFT-based computational methods and
    a supervised machine learning strategy to discover material models for the effective
    viscosity of shear-thinning fiber suspensions. To do so, we study the anisotropic
    and shear rate dependent effective viscosity of fiber suspensions with a Cross-type
    matrix behavior and a fiber volume fraction of 25%. In section 4.2 we outline
    the setup for the FFT-based computational investigations, where we compute the
    effective material response for 109 different fiber orientation states and a variety
    of loading states. In terms of computational scope, this constitutes a significant
    extension to previous FFT-based work on shear-thinning fiber suspensions, in which
    a single fiber orientation state was considered (Sterr et al., 2023). Based on
    the computational data, we visualize the suspension viscosity tensor in three
    dimensions and formulate an anisotropy criterion applicable in a non-linear setting
    using a loading direction and shear rate dependent scalar viscosity, see section
    4.3. We find that the anisotropy of the suspension viscosity shows a significantly
    different shear rate dependence for different fiber orientation states. Also,
    for all investigated microstructures, we confirm that the anisotropy of the suspension
    viscosity depends on the degree of non-linearity of the matrix material, which
    was previously only studied for a transversely isotropic microstructure (Sterr
    et al., 2023). In section 4.4, based on the insights into the shear rate and orientation
    state dependence of the suspension viscosity, we formulate requirements a model
    of the suspension viscosity needs to fulfill. According to the formulated requirements
    we propose four models with different numbers of parameters, as well as different
    phenomenological and theoretical motivations. Using the ADAM algorithm, we employ
    supervised machine learning techniques for non-convex optimization to learn the
    parameters of the model candidates. Overall, three models achieve similar maximum
    validation errors below 5.15 %, while one model based on superposition and orientation
    averaging performs unfavorably.


