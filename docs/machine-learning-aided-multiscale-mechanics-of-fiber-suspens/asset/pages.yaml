    # ## 3.2 Computing the effective viscosity of particles suspended in a non-linear
    viscous medium


    # ### 3.2.1 The non-linear viscosity tensor


    For an incompressible Newtonian fluid, the strain rate tensor \(D \in \text{Sym}_0(3)\)
    and the non-equilibrium viscous stress tensor \(\tau \in \text{Sym}_0(3)\) are
    related by the constitutive law


    ```

    \tau = 2\eta D,

    ```


    involving a shear viscosity \(\eta\). Here, \(\text{Sym}_0(3)\) denotes the vector
    space of symmetric and traceless second-order tensors. More generally, non-Newtonian
    models (Krishnan et al., 2010) may be considered where the viscosity depends on
    the scalar shear rate \(\dot{\gamma} = \sqrt{2}\|D\|\) with the norm \(\|D\| =
    \sqrt{D \cdot D}\). Cross-type (Cross, 1965; 1970) material models are able to
    predict the shear-thinning rheology of polymers accurately (Krishnan et al., 2010).'
