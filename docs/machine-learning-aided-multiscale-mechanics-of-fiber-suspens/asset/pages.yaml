  md: suspension viscosity over a wide range of shear rates of engineering interest.
    Confirming previous observations in the case of a transversely isotropic orientation
    state, we found that the anisotropy of the suspension viscosity for a particular
    orientation state varies substantially depending on the load direction and shear
    rate. Furthermore, the degree of non-linearity of the matrix material in the studied
    volume elements influences the anisotropy of the suspension viscosity strongly.
    Based on the observed material behavior, we introduced four requirements a model
    of the suspension viscosity should satisfy, and formulated four model candidates
    according to these requirements. Using supervised machine learning techniques
    for non-convex optimization, we identified the model parameters based on the high-fidelity
    FFT-based computational results, and found that three of the four presented models
    achieve validation errors below 5.15 %. One model containing an approximation
    of the suspension viscosity based on superposition and orientation averaging did
    not perform favorably when compared with the other presented models.
