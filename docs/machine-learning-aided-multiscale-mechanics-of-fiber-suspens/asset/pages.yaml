    # 5.3.5 Online evaluation


    In section 5.2.1, we showed that the velocity fields in layered emulsions are
    phase-wise affine, and thus the online evaluation procedure of direct DMNs can
    be employed for FDMNs as well if the phases are kinematically unconstrained. However,
    for FDMNs with incompressible phases, the online evaluation procedure needs to
    be adapted, as we discuss in the following. We define the linear operator \(\underline{\underline{A}}
    : (\mathbb{R}^3)^{\otimes N_n} \to (\text{Sym}_0(3))^{N_w}\) which maps the emulsion-wise
    jumps \(\underline{b} \in (\mathbb{R}^3)^{\otimes N_n}\) of the velocity gradient
    onto the phase-wise strain rate fluctuations. Also, we express the effective dissipation
    potential \(\overline{\Psi} : (\text{Sym}_0(3))^{N_w} \to \mathbb{R}\) of the
    FDMN in terms of the phase-wise dissipation potentials \(\Psi_i : \text{Sym}_0(3)
    \to \mathbb{R}\), the respective weights \(w^i_{K+1}\), and the phase-wise strain
    rate tensor \(\boldsymbol{D}_i \in \text{Sym}_0(3)\) as


    \(\overline{\Psi} \left( \underline{\underline{D}} + \underline{\underline{A}}\underline{b}
    \right) = \sum_{i=1}^{N_w} w^i_{K+1} \Psi_i(\boldsymbol{D}_i), \quad (5.80)\)


    where all entries of the vector \(\underline{D} \in (\text{Sym}_0(3))^{N_w}\)
    equal the effective strain rate \(\bar{\boldsymbol{D}}\), i.e.,


    \(\underline{\underline{D}} = (\bar{\underline{D}}, \bar{\underline{D}}, ...,
    \bar{\underline{D}}). \quad (5.81)\)'
