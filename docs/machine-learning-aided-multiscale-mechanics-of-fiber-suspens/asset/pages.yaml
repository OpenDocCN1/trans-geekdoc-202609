  md: FFT-based computational method to determine the effective viscosity of fiber
    suspensions over a wide range of shear rates. We found the resolution error of
    the microstructure discretization to be dependent on the shear rate and load direction,
    with the minimum resolution error occurring at medium shear rates and pure shear
    loads. To our surprise, we found the representative volume element size to be
    highly similar in a Newtonian case with aligned microstructure and a Cross-type
    case with transversely isotropic microstructure. Over the considered shear rate
