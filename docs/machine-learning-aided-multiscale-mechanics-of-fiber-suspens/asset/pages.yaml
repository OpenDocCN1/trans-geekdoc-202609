    # 5.4.3 Online evaluation


    To measure the online performance of an FDMN, we define the online error function
    \(e_{\text{on}} : \text{Sym}_0(3) \rightarrow \mathbb{R}\) as


    ```

    \(e_{\text{on}}(\bar{D}) = \frac{\|\sigma^{DMN}(\bar{D}) - \sigma^{FFT}(\bar{D})\|_2}{\|\sigma^{FFT}(\bar{D})\|_2},\)
    (5.95)

    ```


    where \(\|\cdot\|_2\) denotes the \(\ell^2\)-norm of the components in Mandel
    notation, \(\bar{D}\) stands for the prescribed effective strain rate tensor,
    and \(\sigma^{DMN} : \text{Sym}_0(3) \rightarrow \text{Sym}_0(3)\) and \(\sigma^{FFT}
    : \text{Sym}_0(3) \rightarrow \text{Sym}_0(3)\) are the stress functions of the
    FDMN and the FFT-based homogenization, respectively. We then choose the largest
    error over all load cases \(e_{\text{on}}^{\max}\) and the mean error over all
    load cases \(e_{\text{on}}^{\text{mean}}\)


    ```

    \(e_{\text{on}}^{\max} = \max_{\bar{D} \in \bar{D}_\gamma} e_{\text{on}}, \quad
    e_{\text{on}}^{\text{mean}} = \frac{1}{|\bar{D}_\gamma|} \sum_{\bar{D} \in \bar{D}_\gamma}
    e_{\text{on}}(\bar{D}),\) (5.96)

    ```


