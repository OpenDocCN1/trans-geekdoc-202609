    \Psi(\boldsymbol{D}) \mid \boldsymbol{D} \in \text{Sym}_0(3) \}\) (3.11)


    of the dissipation potential \(\Psi\). The potential \(\Psi\) must grow superlinearly
    and be non-negative for \(\Phi\) to be a proper function, i.e., not infinite everywhere.
    Then, as a consequence of the Fenchel-Moreau identity (Chambolle and Pock, 2016,
    Eq. (3.8)), the constitutive law (3.6) may be written in dual form


    \(\boldsymbol{D} = \frac{\partial \Phi}{\partial \boldsymbol{\tau}}(\boldsymbol{\tau}).\)
