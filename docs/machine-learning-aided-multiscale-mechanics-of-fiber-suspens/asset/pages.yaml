    use a relatively small set of 32 samples as training data, we dedicate a large
    portion of it to the training set $\mathcal{S}^{\dagger}$, and choose to train
    20 FDMNs per fiber orientation state $\underline{\lambda}$. Furthermore, we train
    the FDMNs on mini batches with size $N_{\mathrm{b}} = 8$, for which we draw randomly
    from the training set $\mathcal{S}^{\dagger}$. In case the last batch is smaller
    than eight samples, we drop the batch. Because the initialization of the parameter
    vectors $\underline{\alpha}$ and $\underline{w}$, as well as the offline training
    process are random, the FDMNs differ in their parameters and quality of fit. By
    training 20 FDMNs per fiber orientation state, we leverage this randomness with
    the goal of obtaining FDMNs with a high quality of fit. This strategy aims to
    reduce the total computational effort required to obtain sufficiently accurate
    FDMNs, because repeatedly training FDMNs on 32 samples requires less computational
    resources than conducting full field simulations for larger sample sizes. For
    the minimization of the loss function $\mathcal{L}$, we choose the RAdam algorithm
    (Liu et al., 2019a) and use a learning rate sweep (Smith and Topin, 2019) to determine
    the learning rates $\kappa_{0, \alpha}$ and $\kappa_{0, w}$. With the learning
    rate sweep we obtain highly similar learning rates for both parameter groups $\underline{\alpha}$
    and $\underline{w}$, such that $\kappa_{0, \alpha} = \kappa_{0, w} = 1 \cdot 10^{-2}$.
    As the learning process advances, we use PyTorch's StepLR learning rate scheduler
    to improve convergence towards minima (Darken and Moody, 1990; Darken et al.,
    1992). To do so, we multiply the learning rates $\kappa_{0, \alpha}$ and $\kappa_{0,
    w}$ with a constant factor $f_{LR} = 0.75$ every 150 epochs. Other than the learning
    rates, we used standard hyperparameters for the two momentum coefficients $\beta_1
    = 0.9$ and $\beta = 0.999$, as well as the stabilization constant $\varepsilon
    = 10^{-8}$. Overall, we train every FDMNs for a total of 2000 epochs each.
