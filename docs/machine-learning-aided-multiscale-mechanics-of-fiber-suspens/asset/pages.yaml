    # 3.2.3 Computational aspects and setup


    After discussing theoretical aspects in the previous section, this section is
    dedicated to selected computational aspects concerning the fiber suspension microstructure
    and FFT-based procedure, starting with a solution scheme for the convex dual variational
    problem (3.24). The Euler-Lagrange equation of the convex dual variational problem
    (3.24) reads


    $$\mathbb{P}_{\mathcal{E}} \left[ \frac{\partial \Phi}{\partial \tau} (\tau_k)
    - \bar{D} \right] = \mathbf{0}, $$ (3.25)


    where \mathbb{P}_{\mathcal{E}} denotes the L^2-projector onto the shear stresses
    satisfying the equilibrium equation (3.14). In terms of an arbitrary stepsize
    \alpha, minimizers of the Euler-Lagrange equation (3.25) are fixed points of the
    gradient descent scheme


    $$\tau_{k+1} = \tau_k - \alpha \mathbb{P}_{\mathcal{E}} \left[ \frac{\partial
    \Phi}{\partial \tau} (\tau_k) - \bar{D} \right], $$ (3.26)


    which has a unique fixed point, provided the optimization problem (3.24) is strictly
    convex. For a closed form expression of the action of \mathbb{P}_{\mathcal{E}}
    in Fourier space, and an analogous derivation of a fixed point scheme in the linear
    case, we refer to Bertóti et al. (2021). Numerical schemes based on the gradient
    descent iteration (3.26) require computing a strain rate'
