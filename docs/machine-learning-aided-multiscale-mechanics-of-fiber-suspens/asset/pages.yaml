    # 2.3 Balance equations


    # 2.3.1 General balance equation


    Balance equations encode physical laws that govern processes of interest in engineering
    and science. In this thesis, we treat purely mechanical systems, i.e., thermal
    effects are not considered. For a discussion of the balance equations of energy
    and entropy, as well as a comprehensive description of the thermodynamics of continuous
    media, we refer to Krawietz (2013). In the following, we consider an arbitrary
    bounded volume $\Omega_t$ with boundary $\partial \Omega$ and discuss general
    forms of a balance equation, as well as the special cases of the balance of mass
    and the'
