    # 4.1 Introduction


    Viscosity models for fiber polymer suspensions are widely used in molding process
    simulations of composite parts (Kennedy and Zheng, 2013), which play a major role
    in the lightweight design of engineering systems, i.e., in the automotive, aerospace,
    and energy sectors (Henning et al., 2019; Qureshi, 2022). Molding process simulations
    are an established tool in composite part engineering, partly because of the industrial
    benefits of digital twins (Botín-Sanabria et al., 2022) and virtual process chains
    (Henning et al., 2019; Görthofer et al., 2019; Meyer et al., 2023). In molding
    simulations for fiber reinforced plastics, accurate modeling of the suspension
    viscosity is crucial to predict various parameters of engineering interest. The
    suspension viscosity influences manufacturing process parameters (Castro and Tomlinson,
    1990; Goodship, 2017), as


