    # 4.5 Conclusions


    In this chapter, we used supervised machine learning and FFT-based computational
    techniques to discover models for the effective suspension viscosity of fiber
    suspensions with shear-thinning matrix behavior. We first extended the computational
    investigations of previous work to a broad variety of fiber orientation states.
    For all considered orientation states, we studied the anisotropy and shear rate
    dependence of the'
