    # 3.4 Computational investigations


    # 3.4.1 Spatial representation of the suspension viscosity through a scalar elongational
    viscosity


    Böhlke and Brüggemann (2001) introduced a simple method to visualize an anisotropic
    stiffness tensor. We modify this approach to calculate the fiber polymer suspension''s
    resistance to elongational flow in a particular direction via an elongational
    viscosity \(\eta_{\text{app}}\). In the general non-Newtonian case, we define
    a direction-dependent, elongational viscosity \(\eta_{\text{app}}\)


    ```

    \(\eta_{\text{app}}(\dot{\gamma}, \mathbf{c}_{\text{F}}, \boldsymbol{d}) = \underline{a}(\boldsymbol{d})^{\mathsf{T}}
    \overline{\underline{\mathbb{V}}}(\dot{\gamma}, \mathbf{c}_{\text{F}}) \underline{a}(\boldsymbol{d})
    \approx \mathbb{V}(\dot{\gamma}, \mathbf{c}_{\text{F}})\cdot(\boldsymbol{d} \otimes
    \boldsymbol{d} \otimes \boldsymbol{d} \otimes \boldsymbol{d}), \quad (3.54)\)

    ```


    where \(\underline{a}(\boldsymbol{d})\) denotes the components of \(\boldsymbol{d}
    \otimes \boldsymbol{d}\) in Mandel notation, \(\boldsymbol{d}\) is the elongation
    direction, and the suspension viscosity \(\overline{\underline{\mathbb{V}}}(\dot{\gamma},
    \mathbf{c}_{\text{F}})\) is calculated via equation (3.33) as an approximation
    of the true suspension viscosity tensor \(\mathbb{V}(\dot{\gamma}, \mathbf{c}_{\text{F}})\).
    Since the true suspension viscosity tensor \(\mathbb{V}\) has the minor and major
    symmetries, it is defined by 21 components. As a consequence, the suspension viscosity
    \(\overline{\underline{\mathbb{V}}}(\dot{\gamma}, \mathbf{c}_{\text{F}})\) can
    be completely described by a scalar elongational viscosity and a scalar dilatational'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'viscosity, see He and Curnier (1995, Sec. 4.3). The elongational and dilatational
    viscosity then contain the information of 15 and 6 components of the suspension
    viscosity \(\underline{\underline{V}}(\dot{\gamma}, c_F)\), respectively. However,
    due to incompressibility, all information contained in the suspension viscosity
    \(\underline{\underline{V}}(\dot{\gamma}, c_F)\) is completely and uniquely encoded
    via the elongational viscosity \(\eta_{app}(\dot{\gamma}, c_F, \boldsymbol{d})\)
    (He and Curnier, 1995, Sec. 4.3). This holds in both the Newtonian and Cross-type
    case. Thus, in the following, we use the elongational viscosity \(\eta_{app}(\dot{\gamma},
    c_F)\) as a tool to completely visualize and qualitatively understand the suspension
    viscosity \(\underline{\underline{V}}(\dot{\gamma}, c_F)\).


    ![](img/283dee3537da34c9897f9777475c5d3d_71_0.png)


    For the special case of an isotropic suspension viscosity, and a uniaxial elongation
    direction \(\boldsymbol{d}\), the elongational viscosity \(\eta_{app}(\dot{\gamma},
    \boldsymbol{d})\) is related to the shear viscosity \(\eta(\dot{\gamma})\) (3.2)
    such that \(\eta_{app}(\dot{\gamma}, \boldsymbol{d}) = 4\eta(\dot{\gamma})/3\).
    In the Newtonian case, the viscosity tensor components \(\underline{\underline{V}}(\dot{\gamma},
    c_F)\) are independent of the shear rate \(\dot{\gamma}\).'
