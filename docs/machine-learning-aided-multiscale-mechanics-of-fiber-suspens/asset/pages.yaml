  md: 'sufficient for our purposes. Assume that for constant temperature and density
    a twice continuously differentiable dissipation potential density \(\Psi : \text{Sym}_0(3)
    \to \mathbb{R}\) is given, which furthermore satisfies the condition


    \(\frac{\partial \Psi}{\partial \mathbf{D}}(\mathbf{0}) = \mathbf{0}.\)


    Then, the non-equilibrium viscous stress \(\boldsymbol{\tau}\) is governed by
    the relationship


    \(\boldsymbol{\tau} = \frac{\partial \Psi}{\partial \mathbf{D}}(\mathbf{D}),\)


    and by the fundamental theorem of calculus, we may write


    \(\frac{\partial \Psi}{\partial \mathbf{D}}(\mathbf{D}) = \int_0^1 \frac{\mathrm{d}}{\mathrm{d}s}
    \left[ \frac{\partial \Psi}{\partial \mathbf{D}}(s\mathbf{D}) \right] \mathrm{d}s
    = \int_0^1 \frac{\partial^2 \Psi}{\partial \mathbf{D}^2}(s\mathbf{D}) \mathrm{d}s
    \, [\mathbf{D}] \equiv \mathbb{V}(\mathbf{D})[\mathbf{D}].\)


    Thus, the viscosity tensor


    \(\mathbb{V}(\mathbf{D}) \equiv \int_0^1 \frac{\partial^2 \Psi}{\partial \mathbf{D}^2}(s\mathbf{D})
    \mathrm{d}s\)


    has major symmetries, as a consequence of Schwarz’ theorem on the commutativity
