  md: '# 5.4.5 Comparison with machine learning aided analytical models


    In this section, we compare the FDMN based approach to predicting the effective
    behavior of fiber suspensions with another machine learning approach suggested
    by Sterr et al. (2024b). The authors presented four different analytical constitutive
    equations for the effective viscosity of shear-thinning fiber suspensions, and
    identified the model parameters using supervised machine learning. The model parameters
    were learned from simulation data obtained with FFT-based computational techniques
    for the same material as considered in this chapter: rigid fibers suspended in
    a Cross-type matrix material with parameters as shown in Table 4.1. However, the
    FDMN approach and the analytical approach follow very different paradigms. The
    FDMNs are trained to approximate the non-linear homogenization function of the
    microstructure by learning the respective linear homogenization function without
    prior knowledge of the actual constitutive equations. In contrast, the parameters
    of the analytical models were learned from the non-linear stress response of the
    suspension, and the analytical models incorporate knowledge about the expected
    material behavior. Even though the two approaches follow different strategies,
    they achieve comparable prediction accuracy. For the load cases $\bar{D}_{\dot{\gamma}}$
    and fiber orientation states $\underline{\lambda}$ considered in this chapter,
    the largest validation error of the FDMNs is 4.31% and occurs for the fiber orientation
    state $\underline{\lambda} = (0.8055, 0.1389)^{\top}$. For the same load cases
    $\bar{D}_{\dot{\gamma}}$ and the same set of fiber orientation states $\underline{\lambda}$,
    three of the four analytical models by Sterr et al. (2024b) achieve a maximum
    prediction error of 5.00%, which occurs for the fiber orientation state $\underline{\lambda}
    = (0.8334, 0.0833)^{\top}$. The fourth model did not compare favorably with the
    other three, because the built-in assumptions of stress-strain rate superposition
    and orientation averaging did not hold well for the considered suspension (Sterr
    et al., 2024b). Consequently, the FDMNs achieved a slightly higher prediction
    accuracy for the type of fiber'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'suspension considered in this thesis. Also, within the constraints of a first
    order approximation, FDMNs generalize to different constitutive equations while
    the presented analytical models do not, reducing the required modelling effort
    for FDMNs. However, the FDMNs utilized in this thesis use 1150 free parameters,
    whereas the analytical models use between 11 and 49 parameters.


    In terms of computational cost, generating the training data and training an FDMN
    for a single microstructure took 9.88h wall-clock time on average, see Table 5.1.
    The parameters of the analytical models for a single microstructure were identified
    based on six non-linear FFT-based simulations, which took 2.61h wall-clock time
    on average. This leads to an average total wall-clock time of 15.70h if all required
    simulations are run in series on one thread, and 0.04h are allocated to identify
    the model parameters. However, with the considered setup, the non-linear FFT-based
    simulations could be run in parallel, such that the analytical model parameters
    can be obtained more quickly than an FDMN. In summary, FDMNs offer a higher degree
    of accuracy and flexibility regarding the considered constitutive equations, but
    require more computational resources and a larger amount of parameters. Furthermore,
    FDMNs are inherently thermodynamically consistent (Gajek et al., 2020, §3.1),
    and inherently stress-strain rate monotonicity from their phases (Gajek et al.,
    2020, App. C). In contrast, both thermodynamic consistency and stress-strain rate
    monotonicity must be ensured manually in constitutive models.


    # ## 5.5 Conclusions


    In this chapter, we extended the direct DMN architecture to the Flexible DMN (FDMN)
    architecture for the treatment of fiber suspensions with infinite material contrast
    and shear-thinning matrix behavior. To do so, we derived linear homogenization
    functions for two-phase layered'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'emulsions that are governed by Stokes flow and consist of linearly viscous
    phases. More specifically, we utilized results by Kabel et al. (2016b) and Milton
    (2002) on the homogenization of laminates to derive closed form analytical expressions
    for the effective properties of such layered emulsions. Because rank-one layered
    materials are ill-suited as DMN building blocks in case of infinite material contrast,
    we investigated the effective properties of coated layered materials (CLMs). We
    leveraged the linear homogenization functions of rank-one layered materials and
    investigated under which conditions the effective behavior of CLMs is non-singular
    if the core material is rigid. The conditions depend on the physical constraints
    of the employed materials, and involve the rank of the CLM and the relative orientation
    of the layering directions. In the relevant case for incompressible fiber suspensions,
    a CLM consists of an incompressible coating material and a rigid core material.
    Then, the effective viscosity of a rank-3 CLM is non-singular if the three layering
    directions are mutually non-orthogonal and mutually non-collinear.


    Using the derived homogenization functions for layered materials and CLMs, we
    extended the (direct) DMN architecture to the FDMN architecture by replacing the
    lowest layer of rank-one laminates in a (direct) DMN with non-singular CLMs, and
    the other rank-one laminates with rank-one layered materials capable of treating
    fluids. For the offline training of an FDMN, we presented a strategy where the
    relative angles of the CLM layering directions are fixed to reduce the amount
    of free parameters and guarantee non-singular CLMs. Furthermore, we modified the
    online evaluation strategy of direct DMNs to account for incompressible phases.
    We leveraged the FDMN architecture to predict the non-linear effective behavior
    of fiber suspensions with a Cross-type matrix material. Compared to direct numerical
    simulations with FFT-based computational techniques, the FDMNs achieved validation
    errors below 4.31% for a variety of 31 fiber orientation states, six different
    load cases, and a wide range of shear rates relevant to engineering processes.'
