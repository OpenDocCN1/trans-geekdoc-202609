  md: '# Chapter 2

    Fundamentals


    # 2.1 Introduction


    This chapter serves as a brief summary of fundamental concepts in continuum mechanics
    that lay the basis for the investigations presented in this thesis. More specifically,
    we discuss kinematics and balance equations governing the behavior of continua
    with a focus on incompressible and isothermal flow. Additionally, we discuss the
    mathematical description of fiber orientation states in fiber reinforced media,
    which serves as a central quantity for the study and generation of fibrous microstructures.
    For an extensive discussion of a wide range of aspects in continuum mechanics,
    we refer the reader to Šilhavý (1997), Haupt (2002), Liu (2002), Steinmann (2015),
    and Morro and Giorgi (2023).


    # 2.2 Kinematics


    For a $d$-dimensional material body occupying the volume $Y_0 \subset \mathbb{R}^d$,
    let $\mathbf{X} \in Y_0$ denote the reference placement of the material points
    of the body for $d \in \{2, 3\}$ (Steinmann, 2015). Then, the continuously differentiable
    and invertible function


    ```

    $$\chi : Y_0 \times [0, T] \to \mathbb{R}^d, \quad (\mathbf{X}, t) \mapsto \chi(\mathbf{X},
    t) \tag{2.1}$$

    ```'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'describes the motion of the body using the reference placement $\boldsymbol{X}$
    and the time \(t \in [0, T]\) (Steinmann, 2015). Here, the time \(t\) and the
    furthest considered point in time \(T \in (0, \infty]\) live on the affinely extended
    real number line. The current placement \(\boldsymbol{x}\) is then defined as


    ```

    $$ \boldsymbol{x} = \boldsymbol{\chi}(\boldsymbol{X}, t), \quad (2.2) $$

    ```


    from which the current placement \(Y_t\) of the body follows as (Steinmann, 2015)


    ```

    $$ Y_t = \{ \boldsymbol{x} = \boldsymbol{\chi}(\boldsymbol{X}, t) \mid \boldsymbol{X}
    \in Y_0 \text{ and } t \in [0, T] \}. \quad (2.3) $$

    ```


    Consequently, a tensor field \(\Lambda\) of order \(n \in \mathbb{N}_{\ge 0}\)
    on the material body can be described in terms of the reference placement \(Y_0\)
    (Haupt, 2002), such that


