  md: 'of the expected material behavior of the suspensions. Additionally, the FDMNs
    in this thesis were trained on smaller data sets than in previous DMN based studies.
    These considerations underline the remarkable prediction capabilities of FDMNs
    for non-linear material behavior.


    With our work, we contributed to the numerical study and modeling of fiber suspensions
    with non-Newtonian matrix materials. Our main contributions are the development
    of an FFT-based computational homogenization approach, the identification of closed
    form effective viscosity models, and the development of the FDMN architecture.
    Overall, the applicability and the scale of our modeling approaches are mainly
    restricted by the computational cost to generate training data using FFT-based
    methods. This underscores the necessity for further research into efficient FFT-based
    techniques as well as other efficient computational methods. In particular, reduced
    computational requirements would allow the consideration of larger systems with
    higher fiber aspect ratios, or the consideration of additional complex physics.
    Using the computationally generated data, the closed form models and the FDMN
    architecture presented in this thesis enable efficient two-scale molding simulations.
    This could be leveraged for a variety of engineering processes simulations in
    composite manufacturing, such as injection and compression molding. Because fibers
    may break during processing, it would be of great interest to combine the closed
    form models and the FDMN architecture with synthetic microstructures (Mehta and
    Schneider, 2022) and molding simulations (Phelps et al., 2013) that incorporate
    fiber length distributions.


    Furthermore, the developed FDMN framework could be applied and extended to problems
    involving more than two phases and more than one singular phase. This includes
    material systems such as fiber suspensions containing gaseous phases (Shuler et
    al., 1994; Cui and Grace, 2007), materials containing voids (Mehdikhani et al.,
    2019; Sika et al., 2020), or'
