    \(\mathbb{A} : \mathbb{R}^6 \to \mathsf{V}_0^+(3),\) (4.26)


    \(\underline{a} \mapsto \mathcal{P}_{\mathcal{B}}^+ \mathbb{M}(\underline{a})
    = \mathcal{P}_{\mathcal{B}}^+ \begin{bmatrix} a_1 & a_2 & 0 & 0 & 0 \\ a_2 & a_3
