  md: '# 3.3.2 Resolution Study


    The resolution of the microstructure discretization is limited by computational
    resources, namely memory and runtime. To determine a suitable resolution that
    accommodates limited resources, and allows for an appropriately small error, we
    conducted a resolution study for the cases of Newtonian and Cross-type (3.2) matrix
    behavior. We conducted the study for a fixed fiber aspect ratio $r_a = 10$ and
    for fiber volume fractions $c_F \in \{5\%, 10\%, 15\%, 20\%, 25\%\}$. Since the
    inter fiber distance decreases with increasing volume fraction $c_F$, the effective
    stress $\bar{\tau}$ of the suspension is expected to be more sensitive to resolution
    effects for higher fiber volume fractions $c_F$. Consequently, we chose the maximum
    considered volume fraction $c_F = 25\%$ for all volume elements in the resolution
    study. To reduce the amount of necessary voxels, we investigated two types of
    voxel discretizations, namely binary and composite voxels (Kabel et al., 2017).
    For the composite voxels, we used the general dual mixing rule


    ```

    $$\bar{\tau}_V = c_M \tau_M + (1 - c_M)\tau_F$$ (3.48)

    ```


    where $\bar{\tau}_V, c_M, \tau_M$, and $\tau_F$ are the effective stress, the
    matrix volume fraction, the matrix stress, and the fiber stress inside the composite
    voxel, respectively. In the special case of rigid fibers, the fiber stress $\tau_F$
    is zero. Hence, the general composite voxel mixing rule (3.48) simplifies to


    ```

    $$\bar{\tau}_V = c_M \tau_M.$$ (3.49)

    ```


    Like in Bertóti et al. (2021), we increased the number of voxels per fiber diameter
    $v/d$ in dyadic steps for the binary voxels, such that $v/d \in \{5, 10, 20, 40\}$,
    see Figure 3.4.


    Hence, a single microstructure was discretized with the resolutions $v/d \in \{5,
    10, 20, 40\}$ for binary voxels and $v/d \in \{5, 10, 20\}$ for composite'
