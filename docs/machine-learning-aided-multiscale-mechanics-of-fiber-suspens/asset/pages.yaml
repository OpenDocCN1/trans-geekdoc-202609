    # 4.3 Spatial representation and anisotropy of the effective suspension viscosity


    With the goal of modeling the effective behavior of shear-thinning fiber suspensions
    in mind, it is essential to understand the anisotropic effective viscosity of
    such suspensions, as well as its dependence on the fiber orientation state \(\underline{\Lambda}\)
    and the shear rate \(\dot{\gamma}\) first. Accordingly, we begin by visualizing
    the effective viscosity and studying its anisotropy for low shear rates \(\dot{\gamma}\)
    in the following, before studying the effects of non-linear shear-thinning. To
    reduce the dimensional complexity when studying the effective viscosity, we use
    a scalar elongational viscosity \(\eta_{\text{app}}\). Following Serr et al. (2023,
    §4), we define the viscosity \(\eta_{\text{app}}\) based on a modified approach
    by Böhlke and Brüggemann (2001), such that


    \(\eta_{\text{app}}(\dot{\gamma}, \underline{\Lambda}, \boldsymbol{d}) = \tilde{\mathbb{W}}(\dot{\gamma},
