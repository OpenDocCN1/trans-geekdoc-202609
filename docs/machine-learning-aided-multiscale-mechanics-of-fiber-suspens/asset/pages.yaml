  md: 'Their viscosity is governed by an expression of the form


    $$\eta(\dot{\gamma}) = \eta_\infty + \frac{\eta_0 - \eta_\infty}{1 + (k\dot{\gamma})^m},
    \tag{3.2}$$


    with positive material parameters $\eta_0 \ge \eta_\infty, k,$ and $m$. For the
    shear rate limits $\dot{\gamma} \rightarrow 0$ and $\dot{\gamma} \rightarrow \infty$,
    the scalar viscosity $\eta(\dot{\gamma})$ approaches the initial viscosity $\eta_0$
    and the asymptotic viscosity $\eta_\infty$, respectively. The two material parameters
    $k$ and $m$ control the transition region between the viscosities $\eta_0$ and
    $\eta_\infty$.


    To describe suspensions of non-spherical particles, it is convenient to consider
    more general, anisotropic viscosity tensors $\mathbb{V} \in L(\text{Sym}_0(3))$
    and constitutive relations of the form (Ericksen, 1959; 1960)


    $$\boldsymbol{\tau} = \mathbb{V}[\boldsymbol{D}], \tag{3.3}$$


    where $L$ refers to the linear transformations on a given vector space, and the
    viscosity tensor $\mathbb{V}$ depends on the fiber arrangement and the fiber orientation
    distribution. If the suspending fluid is itself non-Newtonian, the suspension
    will, in general, be governed by a constitutive relation of the form


    $$\boldsymbol{\tau} = \mathbb{V}[\boldsymbol{D}][\boldsymbol{D}] \tag{3.4}$$


    with a viscosity tensor $\mathbb{V}$ that additionally depends on the shear-rate
    tensor $\boldsymbol{D}$. By the dissipation inequality, the viscosity tensor $\mathbb{V}(\boldsymbol{D})$
    must be positive semi-definite for all shear rates $\boldsymbol{D}$, while the
    major symmetry of the viscosity tensor $\mathbb{V}(\boldsymbol{D})$ is required
    in the linear case for Onsager’s relations to be satisfied (Šilhavý, 1997). Existence
    of a dissipation potential is sufficient for the major symmetry of the viscosity
    tensor $\mathbb{V}(\boldsymbol{D})$ in the non-linear case, see Šilhavý (1997,
    Sec. 12.3.1). For the general formulation of a dissipation potential with temperature
    and mass density dependence, also see Šilhavý (1997, Sec. 12.3.1). For the subsequent
    derivations, we will look at a special case that is'
