  md: '# 2.3.2 Balance of mass


    We consider the mass density \(\rho : \Omega_t \times [0, T] \rightarrow \mathbb{R}\)
    as the subject \(\psi\) of the balance equation (2.16). Because the internal production
    \(p_\rho\), the external supply \(s_\rho\), and the non-convective flux \(\mathbf{q}_\rho\)
    vanish (Morro and Giorgi, 2023), the local form of the balance of mass for regular
    points reads


    ```

    \(\dot{\rho} + \rho \operatorname{div} (\mathbf{v}) = 0.\) \quad (2.19)

    ```


    Because we require the jump condition (2.17) to be satisfied, the balance of mass
    is satisfied for singular points \(\mathbf{x} \in \mathcal{S}_t\). For incompressible
    flow, the material derivative \(\dot{\rho}\) of the mass density \(\rho\) vanishes
    and the balance of mass simplifies to (Landau and Lifshitz, 2013)


    ```

    \(\operatorname{div} (\mathbf{v}) = 0.\) \quad (2.20)

    ```


    In particular, incompressible flow may arise from the movement of an incompressible
    material with spatially and temporally homogeneous mass density \(\rho\). However,
    compressible materials with spatially and temporally inhomogeneous mass density
    \(\rho\) may also undergo incompressible flow, because the material time derivative


    ```

    \(\dot{\rho} = \frac{\partial \rho}{\partial t} + \frac{\partial \rho}{\partial
    \mathbf{x}} \cdot \mathbf{v}\) \quad (2.21)

    ```


    should vanish, not only the individual summands \(\partial \rho / \partial t\)
    and \((\partial \rho / \partial \mathbf{x}) \cdot \mathbf{v}\) (Spurk and Aksel,
    2007).


