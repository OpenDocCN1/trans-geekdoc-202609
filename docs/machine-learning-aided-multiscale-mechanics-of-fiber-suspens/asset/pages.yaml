- pgno: 12
  md: '# Summary


    During the molding of Fiber Reinforced Polymer (FRP) components, the fiber suspension
    viscosity influences various process parameters and physical fields, which in
    turn impact the final part properties. For example, the suspension viscosity influences
    the screw speed in injection molding, the press force in compression molding,
    and generally the flow field. Therefore, an accurate understanding of the fiber
    suspension viscosity is essential for the modeling of manufacturing processes
    and the prediction accuracy of digital process chains. However, the experimental
    and analytical study of the fiber suspension viscosity is associated with significant
    challenges. In particular, it is challenging to ensure a specific fiber orientation
    state during rheology experiments. Additionally, the highly non-linear nature
    of polymer melts and the complex geometry of the fiber suspension microstructure
    complicate analytical efforts.


    In this thesis, computational homogenization approaches are combined with machine
    learning techniques to study and model the anisotropic viscous behavior of fiber
    suspensions. More precisely, Fast Fourier Transform (FFT) based computational
    techniques are employed to compute the effective stress response of fiber suspensions
    for a given flow scenario. Subsequently, machine learning is used to build computationally
    efficient surrogate models for the effective suspension response. Because of the
    industrial relevance of fiber reinforced polyamide 6 (PA6) material systems, the
    investigations in this thesis are focused on fiber suspensions with a shear-thinning
    PA6 matrix material.


    An existing FFT-based method for the homogenization of suspensions with Newtonian
    solvents is extended to suspensions with non-'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Newtonian solvents. In particular, the Legendre–Fenchel transform is leveraged
    to obtain a dual formulation of the associated variational cell problem, which
    is solved efficiently using FFTs and a Newton-CG approach.


    The FFT-based method is combined with supervised machine learning to develop Models
    for the effective behavior of fiber suspensions with a shear-thinning PA6 matrix
    material. To do so, the anisotropic shear-thinning behavior of fiber suspensions
    is studied for 109 different fiber orientation states. Based on the results of
    the investigations, four model candidates for the effective viscosity are formulated
    and the model parameters are identified with a supervised machine learning strategy.
    Furthermore, a novel Deep Material Network (DMN) architecture for the treatment
    of suspensions of rigid fibers in non-Newtonian media is proposed. In particular,
    two-phase layered emulsions are utilized as DMN building blocks and their closed
    form homogenization functions are derived. To treat infinite material contrast,
    two-phase layered emulsions are repeatedly layered in a specific manner. The derived
    layered materials are used to extend the direct DMN framework to the Flexible
    DMN (FDMN) architecture. Finally, FDMNs are used to predict the effective viscous
    response of fiber suspensions with a shear-thinning PA6 matrix material.'
