    # 1.2.3 Data based surrogate models for the behvaior of

    particle suspensions


    Accurate computational predictions of the microscopic behavior of a

    composite often require significant computational effort (Renard and

    Marmonier, 1987; Feyel, 2003; Spahn et al., 2014; Kochmann et al., 2016;

    Sorić et al., 2018), which motivates the use of fast data based surrogate

    models for component scale simulations (Gajek et al., 2021). Ashwin et al.

    (2022; 2024) trained a Multi-Layer-Perceptron, a Convolutional Neural

    Network, and a U-Net (Ronneberger et al., 2015) on particle resolved

    simulation data to predict fluid forces in dense ellipsoidal particle sus-

    pensions. They restricted to Newtonian matrix behavior and trained the

    networks on data for various Reynolds numbers and fiber volume frac-

    tions. Depending on the considered combination of Reynolds number

    and particle volume fraction, the prediction accuracy of the surrogate'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'models varies. Boodaghidezaji et al. (2022) use a multi-fidelity approach with
    neural networks and Gaussian processes to predict the steady state viscosity of
    fiber suspensions with a Newtonian solvent. To form the training data set, they
    combine low-fidelity estimates from constitutive equations with high-fidelity
    data obtained from numerically solving the involved partial differential equation
    system. The prediction accuracy of the multi-fidelity neural network and the multi-fidelity
    Gaussian process for simple shear flow depends strongly on the investigated parameters,
    especially the fiber volume fraction. Sterr et al. (2024b) derived four models
    for fiber suspensions with a Cross-type matrix fluid by combining FFT-based computational
    homogenization techniques with supervised machine learning. They investigated
    the anisotropic shear-thinning characteristics of the suspension viscosity for
    a variety of fiber orientation states via computational experiments, and formulated
    model candidates based on the observed phenomena. Using supervised machine learning
    techniques, they identified the model parameters from computational data, so that
    three of the four models were able to predict the fiber suspension viscosities
    to engineering accuracy for a wide range of engineering load cases. Generally,
    in addition to accurate estimation, extrapolation beyond the training data, as
    well as ensuring thermodynamic consistency prove challenging in the construction
    of surrogate models.


    # 1.2.4 Deep material networks


    In the context of solid materials without kinematic constraints, Liu et al. (Liu
    et al., 2019b; Liu and Wu, 2019) proposed Deep Material Networks (DMNs) as surrogate
    models for the full-field computational homogenization of microstructured materials.
    Their approach is based on nesting rotated laminates in an N-ary tree structure
    of N-phase laminates, and thus constructing a micromechanically motivated deep
    learning architecture. The volume fractions and rotations of the DMN'
