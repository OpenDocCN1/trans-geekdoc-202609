    for the strain rate \(\mathbf{D}\), compare equation (3.1), we first take norms
    on both sides to arrive at the equation


    ```

    \(\|\boldsymbol{\tau}\| = 2\eta(\dot{\gamma}) \|\mathbf{D}\| \equiv \sqrt{2}\eta(\dot{\gamma})\dot{\gamma}.\)
    (3.28)

    ```


    We use Newton''s method to find a root of the function


    ```

    \(g(\dot{\gamma}) = \|\boldsymbol{\tau}\| - \sqrt{2}\eta(\dot{\gamma})\dot{\gamma},\)
    (3.29)

    ```


    and thus compute iteratively


    ```

    \(\dot{\gamma}_{n+1} = \dot{\gamma}_n - s_n \frac{g(\dot{\gamma}_n)}{g''(\dot{\gamma}_n)}.\)
    (3.30)

    ```


    Using backtracking for the step size \(s_n\) to ensure that the Armijo-Goldstein
    inequality(Armijo, 1966; Goldstein, 1965) holds. For the Cross fluid (3.2), the
    derivative of the function \(g\) computes as


    ```

    \(g''(\dot{\gamma}) = -\sqrt{2} \left( \eta(\dot{\gamma}) - \frac{m(\eta_0 - \eta_\infty)(k\dot{\gamma})^m}{(1+(k\dot{\gamma})^m)^2}
    \right).\) (3.31)

    ```


    Once the scalar shear rate \(\dot{\gamma}\) is identified, we compute the strain
    rate tensor \(\mathbf{D}\) via


    ```

    \(\mathbf{D} = \frac{\boldsymbol{\tau}}{2\eta(\dot{\gamma})}.\) (3.32)

    ```


