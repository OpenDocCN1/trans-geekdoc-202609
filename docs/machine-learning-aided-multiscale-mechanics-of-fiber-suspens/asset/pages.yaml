  md: '# Chapter 1


    # Introduction


    # 1.1 Motivation and goals


    Especially because of their high specific stiffness, fiber reinforced composites
    are widely used for lightweight design, particularly in the transport and energy
    sectors (Swolfs, 2017; Wazeer et al., 2023). During the design process of fiber
    reinforced composite components, combinations of molding simulations and structural
    simulations are central to facilitate use case appropriate and material oriented
    design through digital twins (Botin-Sanabria et al., 2022) and virtual process
    chains (Henning et al., 2019; Göthofer et al., 2019; Meyer et al., 2023). In molding
    simulations of fiber reinforced composite parts, accurate prediction of the local
    fiber suspension viscosity is vital to correctly estimate process parameters (Castro
    and Tomlinson, 1990; Goodship, 2017) and other engineering quantities. In particular,
    the fiber orientation and the fiber volume distributions (Tseng et al., 2018),
    the flow fields, (Karl et al., 2021), as well as the final part properties (Mortazavian
    and Fatemi, 2015; Böhlke et al., 2019; Karl et al., 2021) depend on the suspension
    viscosity. However, in component scale simulations, it is computationally


    This chapter is based on the respective section 1 of the publications "Homogenizing
    the viscosity of shear-thinning fiber suspensions with an FFT-based computational
    method" (Sterr et al., 2023), "Machine learning assisted discovery of effective
    viscous material laws for shear-thinning fiber suspensions" (Sterr et al., 2024b),
    and "Deep material networks for fiber suspensions with infinite material contrast"
    (Sterr et al., 2024a)'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'infeasible to fully resolve the microstructure of the whole domain of interest
    to compute the suspension viscosity. For this purpose, analytical and computational
    homogenization methods are valuable tools to provide viscosity estimates for molding
    simulations. However, significant challenges arise for the holistic analytical
    modelling of the suspension viscosity, because the suspension viscosity depends
    on the local microstructure (Karl and Böhlke, 2022), the fiber volume fraction
    (Sepehr et al., 2004), and the fiber orientation state (Dinh and Armstrong, 1984).
    Additionally, the flow field (Cross, 1965; Sterr et al., 2023) and the melt temperature
    (Williams et al., 1955) influence the suspension viscosity as well. Furthermore,
    typical matrix materials in fiber suspensions show non-Newtonian behavior, which
    adds additional complexity to the derivation of appropriate models for the suspension
    viscosity.


    In addition to the challenging analytical treatment, the investigation of fiber
    suspensions via rheological experiments is also difficult. Because of the transient
    effects during fiber suspension molding, including fiber breakage and change of
    orientation state, it is difficult to determine the suspension viscosity for a
    particular microstructure and load case (Binding, 1991; Schelleis et al., 2023).
    Furthermore, interaction of fibers with measurement devices (Eschbach, 1993) can
    affect the measured quantities.


    Overall, the experimental and analytical study of the viscous behavior of fiber
    suspensions is accompanied by considerable difficulties. Thus, computational approaches
    are frequently leveraged to investigate the viscous behavior of suspensions. In
    the literature, a variety of computational techniques are employed for the study
    of suspensions, e.g., boundary element methods (Marin et al., 2012), finite element
    methods (Domurath et al., 2015; 2020; Traxl et al., 2020), lattice Boltzmann methods
    (Švec et al., 2012), and Fast-Fourier-Transform (FFT) based methods (Bertóti et
    al., 2021). In particular, FFT-based methods are established as highly efficient
    (Kabel et al., 2014; Wicht et al., 2020a;'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Wicht, 2022) and do not require interface conforming meshes, which makes them
    widely applicable to complex synthetic or real microstructures (Schneider, 2021).
    So far, the study of fiber suspensions with FFT-based methods was restricted to
    suspensions with Newtonian matrix materials. Consequently, FFT-based methods could
    only be employed in data based modeling approaches for suspensions with Newtonian
    matrix materials. However, molding simulations of engineering components frequently
    require models for the viscous behavior of fiber suspensions with non-Newtonian
    matrix materials (Wittemann et al., 2019). This serves as our motivation for the
    development of FFT-based techniques to treat suspensions with non-Newtonian matrix
    materials, as well as the development of computationally efficient surrogate models
    based on the FFT-based computational data. Our approach to achieving these objectives
    is structured as follows:


    +   - We seek to extend FFT-based methods for the homogenization of suspensions
    of rigid particles in a Newtonian matrix material to suspensions with non-Newtonian
    matrix materials. In particular, we consider non-Newtonian matrix materials whose
    stress response arises as the derivative of a dissipation potential density with
    respect to the strain rate tensor. We leverage the Legendre–Fenchel transformation
    to obtain a dual formulation of the associated non-linear homogenization problem
    (Bhattacharya and Suquet, 2005).


    +   - We employ the developed FFT-based methods to study the effective viscous
    behavior of fiber suspensions with a polyamide 6 (PA6) matrix material. In particular,
    we investigate three dimensional representations of the effective suspension viscosity,
    as well as the degree of the material anisotropy and its dependence on the shear
    rate. For this purpose, we introduce a direction-dependent elongational viscosity
    based on concepts by Böhlke and Brügge mann (2001).


    +   - Based on the data and understanding obtained with the FFT-based method,
    we derive models of the effective suspension viscosity for'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'use in component scale molding simulations. We present four closed form models
    with differing degrees of modeling complexity, and identify the model parameters
    using machine learning techniques. Moreover, we compare the accuracy of the models
    against the FFT-based simulation data for a variety of fiber orientation states.


    +   To leverage developments in the field of deep learning, we extend the Deep
    Material Network (DMN) architecture for the treatment of fibers suspensions with
    non-Newtonian matrix materials. To do so, we derive homogenization blocks that
    are capable of treating two-phase layered materials with incompressible fluid
    phases and infinite material contrast. Using the derived homogenization blocks,
    we present the novel Flexible DMN (FDMN) architecture and train FDMNs to predict
    the effective stress response of fiber suspensions with a shear-thinning PA6 matrix
    material. Finally, we compare the FDMN surrogate models with the closed form models
    presented in this thesis.


    # 1.2 State of the art


    # 1.2.1 Analytical modeling of the effective viscosity of fiber suspensions


    Since work by Sutherland (1905) and Einstein (1905) on the effective scalar viscosity
    of dilute suspensions of spherical particles in Newtonian fluids, a variety of
    analytical approaches to model the complete tensorial viscosity of suspensions
    were suggested. For dilute and semidilute suspensions of slender rods in Newtonian
    fluids, models were proposed among others by Batchelor (1970; 1971), Dinh and
    Armstrong (1984), as well as Shaqfeh and Fredrickson (1990). For an overview of
    anisotropic mean-field homogenization models of particle suspensions in Newtonian
    fluids we refer the reader to Karl and Böhlke (2022). Various other'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'models are detailed by Petrie (1999).

    Overall, finding analytical models for the effective viscosity of fiber suspensions
    is a challenging task, partly because of the locally inhomogeneous flow field
    inside the suspension, as well as the hydrodynamic interactions (Rahnama et al.,
    1995) and mechanical contacts (Sundararajakumar and Koch, 1997) between the fibers.
    Furthermore, the suspension viscosity also depends strongly on the local microstructure,
    i.e., the fiber geometry (Karl and Böhleke, 2022), the fiber volume fraction (Sepehr
    et al., 2004), and the fiber orientation state (Dinh and Armstrong, 1984). As
    far as external influences are concerned, the loading direction, the shear rate
    (Cross, 1965; Sterr et al., 2023), and the melt temperature (Williams et al.,
    1955) also affect the suspension viscosity. Especially for suspensions with non-Newtonian
    solvents and fiber concentrations beyond the semi-dilute regime, capturing the
    large variety of effects in a single analytical model is a difficult task. Depending
    on the fiber concentration of the suspension and the behavior of the matrix material,
    different homogenization approaches have been proposed. According to Pipes et
    al. (1994, §1) the fiber concentration regimes may be defined using the fiber
    volume fraction c_F and the fiber aspect ratio r_a as follows. The dilute regime
    is defined through c_F < (1/r_a)^2, the semi-dilute regime through (1/r_a)^2 <
    c_F < 1/r_a, and the concentrated regime through 1/r_a < c_F. Pipes et al. (1994,
    §1) define the hyperconcentrated regime for arrangements of fibers with aspect
    ratios r_a > 100 through \pi/16 < c_F < \pi/4 for square fiber arrays, and through
    \pi/(8\sqrt{3}) < c_F < \pi/(2\sqrt{3}) for hexagonal fiber arrays. Based on the
    work by Batchelor (1970; 1971) on fiber suspensions with Newtonian matrix behavior,
    Goddard (1976a;b) proposed self-consistent analytical models of dilute and semi-dilute
    fiber suspensions with power-law shear-thinning matrix behavior. While the model
    predictions agree well with experimental results qualitatively, as found by Goddard
    (1978) and Mobuchon et al. (2005), quantitative accuracy can still be improved.
    Later, Souloumiac and Vincent (1998) incorporated fiber orientation'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'distributions into a self-consistent modeling approach for dilute, semi-dilute
    and concentrated fiber suspensions. However, in a comparison with experimental
    results in a convergent channel flow, the prediction accuracy of the model varies
    strongly with the shear rate and the fiber volume fraction. More recently, Fére
    et al. (2016) proposed semi-analytical and numerical self-consistent models for
    fiber suspensions with Ellis and Carreau-type matrix behavior. Even though the
    semi-analytical model was able to accurately replicate steady state solutions
    of a simple shear flow simulation, the models have yet to be successfully applied
    in other flow scenarios. Focusing on the concentrated and the hyperconcentrated
    regime, Pipes et al. (Pipes et al., 1991; Pipes, 1992; Coffin and Pipes, 1991;
    Pipes et al., 1994) developed models of collimated fiber suspensions, including
    uniformly distributed fiber misalignments with an orientation averaging (Ericksen,
    1960; Tucker III, 1991) approach. The model predictions agree well with experimental
    results by Binding (1991), but the applicability of the model is restricted to
    collimated fiber arrays. To improve existing molding simulation solvers through
    small modifications, Favarolo et al. (2018) combined orientation averaging with
    a deformation mode and microstructure dependent informed isotropic viscosity,
    and successfully predicted the shell-core effect common in fiber suspension molding.
    However, the error of the model depends strongly on the applied deformation mode
    and approximated anisotropic viscosity. Thus, including recent developments (Tseng,
    2021; Khan et al., 2023) it proves difficult to achieve high model prediction
    accuracy over the wide variety of application requirements in engineering systems.


    # 1.2.2 Computational study of the viscous behavior of fiber suspensions


    As discussed in the previous sections 1.1 and 1.2.1, the analytical and experimental
    study of the effective fiber suspension viscosity is associated'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'with various difficulties. Consequently, computational techniques can provide
    valuable insight into the viscous behavior of fiber suspensions that is difficult
    to obtain otherwise. As fiber suspension problems often involve Stokes flow, computational
    techniques focused on problems in the Stokes flow regime are of particular interest.
    Marin et al. (2012) introduced a highly accurate Boundary Element Method (BEM)
    to treat confined Stokes flow and succesfully applied it to a problem with a single
    sphere suspended in a Newtonian fluid. Subsequently, the BEM based approach used
    by Marin et al. (2012) could also be extended to different geometries and multiple
    suspended bodies. To treat complex particle geometries suspended in Newtonian
    fluids, Balboa Usabiaga et al. (2017) employed a method where particles are modeled
    via a rigid collection of connected spheres called "multiblob". Balboa Usabiaga
    et al. (2017) successfully applied their multiblob approach to Stokes flow problems
    near walls and in channels, involving multiblobs of different geometries such
    as spheres and cylinders. Furthermore, Fast Fourier Transform (FFT) based computational
    techniques, that were first popularized in solid mechanics (Moulinec and Suquet,
    1994; 1998), were also successfully applied to Stokes flow problems involving
    Newtonian fluids. In combination with the RVE method (Kanit et al., 2003), the
    FFT-based computational approach was used to solve problems in porous media (Willot,
    2015; Mezhoud et al., 2020; Tu et al., 2022), and to compute the effective viscosity
    of fiber suspensions with Newtonian matrix behavior (Bertóti et al., 2021). More
    details regarding FFT-based techniques can be found in recent review articles
    (Segurado et al., 2018; Schneider, 2021; Lucarini et al., 2021).


    Computational methods were also employed to treat suspensions with non-Newtonian
    matrix fluids. Combining a mass tracking algorithm for the free surface representation,
    a lattice Boltzmann method for fluid flow, and an immersed boundary procedure
    for the interaction between fluid and rigid particles, Švec et al. (2012) studied
    slump tests of rigid fibers and rigid spherical particles suspended in a Bingham-type'
  merge: -1
  img_proc: true
