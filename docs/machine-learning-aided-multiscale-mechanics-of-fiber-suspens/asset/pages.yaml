  md: 'In the case of suspensions with non-Newtonian matrix behavior, multiple models
    (Leal, 1975; Kaloni and Stastna, 1983; Brunn, 1977; 1980) were developed based
    on second order fluid theory. However, these models are restricted to a single
    suspended particle. Brunn (1980) also applied his single particle model to dilute
    suspensions and found that the model could not capture hydrodynamic particle-particle
    interactions. In a shear-thinning power law setting, Goddard (1976b;a) developed
    a model for dilute suspensions, which was found to be qualitatively promising
    but quantitatively inaccurate by himself (Goddard, 1978) and Mobuchon et al. (2005).
    Later, Pipes et al. (1991; 1994) proposed a model for the concentrated and hyperconcentrated
    regime in a power law setting. Even though the results agree well with experimental
    data by Binding (1991), the model is limited by its assumption of unidirectional
    and fixed fiber arrays. The prediction accuracy of another power-law model by
    Souloumiac and Vincent (1998) varies strongly with the shear rate and fiber volume
    fraction, making it difficult to apply appropriately. Also, more recent models
    (Férec et al., 2016; Tseng, 2021; Férec et al., 2017; Favarolo et al., 2018) have
    yet to be established as valid over a wide range of temperatures, shear rates,
    fiber-orientation states and fiber aspect ratios. Overall, holistic theoretical
    treatment of all physical effects in fiber suspensions proves to be a difficult
    task.


    Consequently, computational methods were also employed to treat suspensions with
    non-Newtonian matrix fluids. Domurath et al. (2015) used the Finite Element Method
    (FEM) to study the effective viscosity of a dilute suspension with a single spherical
    particle suspended in a Bird-Carreau fluid. For non-dilute suspensions, Traxl
    et al. (2020) used a FEM-based approach to investigate the effective viscosity
    of suspensions with noncolloidal angular, as well as spherical pores and particles
    in generalized-Newtonian fluids. The investigations of Traxl et al. (2020) consider
    suspensions with spherical, hexahedral, and tetrahedral particles, as well as
    matrix fluids with Newtonian, Power-law,'
