- pgno: 38
  md: 'balance of linear momentum over the considered volume \(\Omega_t\). The general
    balance equation of an \(n\)-th order tensor field \(\psi : Y_t \times [0, T]
    \to (\mathbb{R}^d)^{\otimes n}\) over the volume \(\Omega_t\) reads (Liu, 2002)


    ```

    \(\frac{\mathrm{d}}{\mathrm{d}t} \int_{\Omega_t} \psi \, \mathrm{d}\Omega_t(\boldsymbol{x})
    = \int_{\Omega_t} p_\psi + s_\psi \, \mathrm{d}\Omega_t(\boldsymbol{x}) + \int_{\partial\Omega_t}
    \boldsymbol{q}_\psi \odot \boldsymbol{n} \, \mathrm{d}A_t(\boldsymbol{x}), \quad
    (2.15)\)

    ```


    where \(\odot\) denotes a single order tensor contraction. The three tensor fields
    \(p_\psi : \Omega_t \times [0, T] \to (\mathbb{R}^d)^{\otimes n}\), \(s_\psi :
    \Omega_t \times [0, T] \to (\mathbb{R}^d)^{\otimes n}\), and \(\boldsymbol{q}
    : \Omega_t \times [0, T] \to (\mathbb{R}^d)^{\otimes (n+1)}\) represent the internal
    production field, the external supply field, and the non-convective flux field
    of the quantity \(\psi\), respectively. Using the Reynolds transport theorem and
    the divergence theorem (Bertram, 2012), the local formulation of the general balance
    equation (2.15) in regular points (Liu, 2002)


    ```

    \(\frac{\partial \psi}{\partial t} + \text{div}(\psi \otimes \boldsymbol{v}) =
    p_\psi + s_\psi + \text{div}(\boldsymbol{q}_\psi), \quad (2.16)\)

    ```


    follows from equation (2.15). Here, \(\boldsymbol{v} : \Omega_t \times [0, T]
    \to \mathbb{R}^d\) denotes the velocity field. If the volume \(\Omega_t\) contains
    a material singular surface \(\mathcal{S}_t\), the jump condition for points \(\boldsymbol{x}
    \in \mathcal{S}_t\) on the material singular surface \(\mathcal{S}_t\) (Morro
    and Giorgi, 2023)


    ```

    \([[\boldsymbol{q}_\psi]] \cdot \boldsymbol{n} = \boldsymbol{0} \quad (2.17)\)

    ```


    holds. Here, the jump \([[q]]\) of a quantity \(q\) across a material singular
    surface \(\mathcal{S}_t\) with normal vector \(\boldsymbol{n}\) is


    ```

    \([[q]] = q^+ - q^-, \quad (2.18)\)

    ```


    where we denote the left- and right hand side limits of the quantity \(q\) with
    \(q^+\) and \(q^-\), respectively.'
