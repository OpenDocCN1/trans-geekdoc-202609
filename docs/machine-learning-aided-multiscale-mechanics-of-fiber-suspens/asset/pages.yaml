    \[\Phi(\tau) := \sup \left\{ \tau \cdot \boldsymbol{D} - \Psi(\boldsymbol{D})
    \mid \boldsymbol{D} \in \text{Sym}_0(3) \right\},\) (4.5)


    arising as the Legendre–Fenchel dual of the dissipation potential $\Psi$, we search
    for minimizers of the variational problem


    \[\langle \Phi(\cdot, \tau) - \tau \cdot \bar{\boldsymbol{D}} \rangle_Y \longrightarrow
    \inf .\) (4.6)


    Here, $\langle \cdot \rangle_Y$ denotes the spatial average


    \[\langle \cdot \rangle_Y \equiv \frac{1}{|Y|} \int_Y (\cdot) \, \mathrm{d}Y(\boldsymbol{x})
    \quad \text{with} \quad |Y| \equiv \int_Y \mathrm{d}Y(\boldsymbol{x}),\) (4.7)


    and the infimum is taken over all stress fields $\tau$ satisfying the equilibrium
    equation (4.4). Minimizers of the variational problem (4.6) satisfy the Euler–Lagrange
    equation


    \[\mathbb{P}_{\mathcal{E}} \left[ \frac{\partial \Phi}{\partial \tau}(\tau_k)
    - \bar{\boldsymbol{D}} \right] = \mathbf{0},\) (4.8)


    where $\mathbb{P}_{\mathcal{E}}$ refers to the $L^2$-projector onto the shear
    stresses satisfying the equilibrium equation (4.4). We refer to Bertóti et al.
    (2021, §2) for a closed form expression of the action of $\mathbb{P}_{\mathcal{E}}$
    in Fourier space. In case of suspensions with rigid particles the shear rate tensor
    $\boldsymbol{D}$ and hence the derivative $\partial \Phi / \partial \tau$ vanishes
    inside the particles. Thus, the formulation of the optimization problem (4.6)
    in terms of the complementary dissipation potential $\Phi$ is advantageous for
    numerical schemes based on the Euler–Lagrange equation (4.8). If the optimization
    problem (4.6) is convex, a minimizer can be found with, e.g., gradient descent
    (Sterr et al., 2023), the Barzilai–Borwein method (Barzilai and Borwein, 1988),
    or Newton-CG (Dembo et al., 1982; Schneider, 2020a) approaches. Finally, the effective
    viscous stress $\bar{\tau}$ can be computed by spatial averaging, such that


    \[\bar{\tau} = \langle \tau \rangle_Y .\) (4.9)'
