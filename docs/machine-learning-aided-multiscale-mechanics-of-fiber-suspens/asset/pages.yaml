    of the model parameter vector \(\underline{a}\), and the non-unique projector
    \(\mathcal{P}_{\mathcal{B}}^+\) into the space \(\mathsf{V}_0^+\) of fourth order
    tensors that are positive definite on the space spanned by the basis \(\mathcal{B}\).
    Employing eigendecomposition, we define the action of the projector \(\mathcal{P}_{\mathcal{B}}^+\)
    as


    \(\mathcal{P}_{\mathcal{B}}^+ [\mathbb{X}] = \mathcal{P}_{\mathcal{B}}^+ \left[
    \sum_{i=0}^5 \lambda_i \mathbf{p}_i \otimes \mathbf{p}_i \right] = \sum_{i=0}^5
    \max(\lambda_i, \beta) \mathbf{p}_i \otimes \mathbf{p}_i,\) (4.28)


    where \(\lambda_i\) and \(\mathbf{p}_i\) denote eigenvalue eigentensor pairs of
    a fourth order tensor \(\mathbb{X}\) on the space spanned by the basis \(\mathcal{B}\),
    and \(\beta \in \mathbb{R}_{>0}\) is a small positive and real constant. The definition
    of the projection operator \(\mathcal{P}_{\mathcal{B}}^+\) involves a tunable
    constant \(\beta\), which is required for numerical purposes. In fact, formally
    setting \(\beta\) to zero leads to the projector onto positive semi-definite tensors,
    i.e., those which may be degenerate. However, positive definiteness on the incompressible
    subspace \(\mathcal{B}\) is preferred over positive semi-definiteness, because
    of the following physical and numerical reasons. We wish to use the tensor function
    \(\mathbb{A}\) to build fourth order tensors \(\mathbb{X} \in \mathsf{V}_0^+\)
