  md: viscosity of fiber suspensions with a Cross-type matrix behavior and a fiber
    volume fraction of 25%. In section 4.2 we outline the setup for the FFT-based
    computational investigations, where we compute the effective material response
    for 109 different fiber orientation states and a variety of loading states. In
    terms of computational scope, this constitutes a significant extension to previous
    FFT-based work on shear-thinning fiber suspensions, in which a single fiber orientation
    state was considered (Sterr et al., 2023). Based on the computational data, we
    visualize the suspension viscosity tensor in three dimensions and formulate an
    anisotropy criterion applicable in a non-linear setting using a loading direction
    and shear rate dependent scalar viscosity, see section 4.3. We find that the anisotropy
    of the suspension viscosity shows a significantly different shear rate dependence
    for different fiber orientation states. Also, for all investigated microstructures,
    we confirm that the anisotropy of the suspension viscosity depends on the degree
    of non-linearity of the matrix material, which was previously only studied for
    a transversely isotropic microstructure (Sterr et al., 2023). In section 4.4,
    based on the insights into the shear rate and orientation state dependence of
    the suspension viscosity, we formulate requirements a model of the suspension
    viscosity needs to fulfill. According to the formulated requirements we propose
    four models with different numbers of parameters, as well as different phenomenological
    and theoretical motivations. Using the ADAM algorithm, we employ supervised machine
    learning techniques for non-convex optimization to learn the parameters of the
    model candidates. Overall, three models achieve similar maximum validation errors
    below 5.15 %, while one model based on superposition and orientation averaging
    performs unfavorably.
