- pgno: 10
  md: '# # Zusammenfassung


    In Formungsprozessen von faserverstärkten Kunststoffbauteilen beeinflusst die
    Fasersuspensionsviskosität verschiedene Prozessparameter und physikalische Felder,
    die sich wiederum auf die Eigenschaften des fertigen Bauteils auswirken. Beispielsweise
    beeinflusst die Fasersuspensionsviskosität die Schneckendrehzahl beim Spritzgießen,
    die Presskraft beim Formpressen und allgemein das Strömungsfeld. Deshalb ist ein
    genaues Verständnis der Fasersuspensionsviskosität von entscheidender Bedeutung
    für die Modellierung von Fertigungsprozessen und die Vorhersagegenauigkeit von
    digitalen Prozessketten. Allerdings ist die experimentelle und analytische Untersuchung
    der Fasersuspensionsviskosität mit erheblichen Schwierigkeiten verbunden. Insbesondere
    ist es während rheologischer Experimente eine Herausforderung, einen bestimmten
    Orientierungszustand der Fasern zu gewährleisten. Außerdem erschweren die stark
    nichtlinearen Eigenschaften von Polymerschmelzen und die komplexe Geometrie der
    Suspensionsmikrostruktur analytische Bemühungen.


    In dieser Arbeit werden rechnergestützte Homogenisierungsansätze mit maschinellem
    Lernen kombiniert, um das anisotrope, viskose Verhalten von Fasersuspensionen
    zu untersuchen und zu modellieren. Genauer gesagt werden Fast-Fourier-Transformation
    (FFT) basierte Methoden verwendet, um die effektive Spannungsantwort von Fasersuspensionen
    für ein bestimmtes Strömungsszenario zu berechnen. Anschließend wird maschinelles
    Lernen genutzt, um rechnerisch effiziente Ersatzmodelle für das Effektivverhalten
    der Suspensionen zu entwickeln. Aufgrund der industriellen Relevanz von faserverstärkten
    Polyamid'
  merge: -1
  img_proc: true
- pgno: 11
  md: '6 (PA6) Materialsystemen, sind die Untersuchungen in dieser Arbeit auf Fasersuspensionen
    mit scherverdünnendem PA6 Matrixmaterial fokussiert.


    Eine bestehende FFT-basierte Methode für Suspensionen mit Newtonschen Lösungsmitteln
    wird auf Suspensionen mit nicht-Newtonschen Lösungsmitteln erweitert. Insbesondere
    wird die Legendre-Fenchel-Transformation genutzt, um eine duale Formulierung des
    zugehörigen Variationsproblems zu erhalten, das effizient mit FFTs und einem Newton-CG-Ansatz
    gelöst wird.


    Die FFT-basierte Methode wird mit überwachtem, maschinellem Lernen kombiniert,
    um Modelle für das Effektivverhalten von Fasersuspensionen mit einem scherverdünnenden
    PA6 Matrixmaterial zu entwickeln. Dazu wird das anisotrope Scherverdünnungsverhalten
    von Fasersuspensionen für 109 verschiedene Faserorientierungszustände untersucht.
    Basierend auf den Ergebnissen der Untersuchungen werden vier Modellkandidaten
    für die effektive Viskosität formuliert und die Modellparameter mit überwachtem,
    maschinellem Lernen identifiziert.


    Darüber hinaus wird eine neuartige Deep Material Network (DMN)-Architektur für
    die Behandlung von Fasersuspensionen mit unendlichem Materialkontrast vorgeschlagen.
    Insbesondere werden zweiphasige, geschichtete Emulsionen als DMN-Bausteine verwendet
    und deren geschlossene Homogenisierungsfunktionen hergeleitet. Um unendlichen
    Materialkontrast zu behandeln, werden zweiphasige, geschichtete Emulsionen auf
    spezielle Art und Weise wiederholt geschichtet. Unter Verwendung der abgeleiteten
    geschichteten Materialien wird das direct DMN Framework auf die Flexible DMN (FDMN)
    Architektur erweitert. Anschließend werden FDMNs zur Vorhersage des effektiven
    viskosen Verhaltens von Fasersuspensionen mit einem scherverdünnendem PA6 Matrixmaterial
    verwendet.'
