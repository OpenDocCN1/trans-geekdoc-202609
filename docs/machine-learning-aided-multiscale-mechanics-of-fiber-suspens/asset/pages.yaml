    # 4.4.5 Supervised learning of model parameters


    In the previous sections 4.4.1 and 4.4.4, we described the requirements for models
    of the effective suspension viscosity and presented four model candidates satisfying
    these requirements. In this section, we discuss the supervised machine learning
    strategy we use to identify the model parameters. To learn the model parameters
    from the data obtained with FFT-based computational homogenization, we first construct
    a loss function $\mathcal{L}$ measuring the difference between the model predictions
    and the FFT-based computational results, and then minimize the loss $\mathcal{L}$
    using the ADAM (Kingma and Ba, 2014) optimization algorithm. We consider all fiber
    orientation states $\underline{\lambda} \in S_T^{109}$ in the set $S_T^{109} \subset
    S_T$ of 109 points of the discretized fiber orientation triangle shown in Figures
    4.1a and 4.4(b). For every load case $\bar{\boldsymbol{D}}$, fiber orientation
    state $\underline{\lambda}$ and parameter vector $\underline{a}$, we define the
    loss $\mathcal{L}$


    ```

    $$\mathcal{L}(\bar{\boldsymbol{D}}, \underline{\lambda}, \underline{a}) = \frac{\|
    \bar{\boldsymbol{\tau}}^{\text{FFT}}(\bar{\boldsymbol{D}}, \underline{\lambda})
    - \bar{\boldsymbol{\tau}}^{\text{Model}}(\bar{\boldsymbol{D}}, \underline{\lambda},
    \underline{a}) \|_2}{\| \bar{\boldsymbol{\tau}}^{\text{FFT}}(\bar{\boldsymbol{D}},
    \underline{\lambda}) \|_2},$$ (4.40)

    ```


