- pgno: 205
  md: 'We combine computational homogenization techniques with machine learning to
    study and model the anisotropic viscous behavior of fiber suspensions with non-Newtonian
    solvents. To do so, we extend an existing Fast Fourier Transform (FFT) based method
    for the homogenization of suspensions with Newtonian solvents to suspensions with
    non-Newtonian solvents. In particular, we solve a dual formulation of the variational
    cell problem using FFTs and a Newton-CG approach. We combine the extended FFT-based
    method with machine learning to identify models for the effective viscosity of
    fiber suspensions with a shear-thinning PA6 matrix material. For a variety of
    flow scenarios and fiber orientations, we compute the suspension behavior, and
    present suitable analytical models for the effective viscosity. We then identify
    the model parameters using a supervised machine learning strategy.


    Furthermore, we introduce a novel Deep Material Network (DMN) architecture for
    the treatment of fiber suspensions with non-Newtonian solvents. We utilize two-phase
    layered emulsions as DMN building blocks, and repeatedly layer them in a specific
    manner to treat infinite material contrast. By doing so, we extend the direct
    DMN framework to the Flexible DMN (FDMN) architecture. We employ FDMNs to predict
    the effective viscous response of fiber suspensions with a shear-thinning PA6
    matrix material. Finally, we compare the analytical models with the FDMNs.'
