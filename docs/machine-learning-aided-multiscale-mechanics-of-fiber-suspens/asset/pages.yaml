    # ### 4.2.1 Computational homogenization procedure


    In this chapter, we consider incompressible, shear-thinning fiber suspensions,
    occupying a rectangular volume \( Y \subseteq \mathbb{R}^3 \). First, we give
    a short summary of the numerical procedure for the homogenization of shear-thinning
    fiber suspensions detailed in section 3.2. We are interested in computing the
    effective viscous stress \( \bar{\tau} \in \text{Sym}_0(3) \) of the suspension
    in response to an applied, effective shear rate tensor \( \bar{D} \in \text{Sym}_0(3)
    \), where \( \text{Sym}_0(3) \) denotes the vector space of symmetric and traceless
    second-order tensors. For a pressure field \( p : Y \rightarrow \mathbb{R} \),
    a solenoidal velocity field \( v : Y \rightarrow \mathbb{R}^3 \) and a local viscous
    stress field


    \( \tau = \mathcal{T}(\cdot, \bar{D} + \nabla^s v), \quad (4.1) \)


    with associated stress operator


    \(\begin{aligned} \mathcal{T} : Y \times \text{Sym}_0(3) \rightarrow \text{Sym}_0(3),
    \quad (4.2) \\ (x, D) \mapsto \frac{\partial \Psi}{\partial D}(x, D), \quad (4.3)
    \end{aligned}\)


    and dissipation potential \( \Psi : Y \times \text{Sym}_0(3) \rightarrow \mathbb{R}
    \), the local balance of linear momentum without inertial effects


    \( \text{div}(\tau) - \nabla p = 0, \quad (4.4) \)


    needs to be fulfilled. In the context of suspensions with rigid inclusions, the
    local viscous stress \( \tau \) in equation (4.4) is, constitutively, not well-defined
    inside the rigid inclusions. We address this issue by changing to a dual formulation
    as follows. With the complementary dissipation'
