    # 1.3 Outline and contributions of this thesis


    +   - In chapter 2, we summarize the fundamentals of continuum mechanics which
    underpin the investigations presented in this thesis. Namely, we discuss kinematics
    and balance equations with a focus on incompressible flow. Additionally, we briefly
    discuss the description of fiber orientation states using fiber orientation tensors.

    +   - In chapter 3, we present an FFT-based method for the computational homogenization
    of fiber suspensions with non-Newtonian matrix materials. Employing the presented
    FFT-based method, we investigate the anisotropic shear-thinning behavior of suspensions
    of rigid fibers in a shear-thinning PA6 matrix. More specifically, we study the
    non-linear effective behavior for a particular transversely isotropic fiber orientation
    state and multiple fiber volume fractions. We find that the anisotropic shear-thinning
    is more pronounced for higher fiber volume fractions, and that the degree of anisotropy
    decreases up to certain shear rates.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - In chapter 4, we extend the investigations of chapter 3 into the anisotropic
    shear-thinning of fiber suspensions with a PA6 matrix material to 109 different
    fiber orientation states. We introduce a non-linear anisotropy measure and find
    that the anisotropy of the effective viscosity and its shear rate dependence vary
    strongly with the fiber orientation state. Combining our results with insight
    from the literature, we formulate four model candidates for the effective viscous
    behavior of shear-thinning fiber suspensions. We employ a supervised machine learning
    strategy to learn the model parameters from the data obtained with the FFT-based
    computational approach presented in chapter 3. Finally, we assess the prediction
    accuracy of the models for all considered fiber orientation states and a broad
    range of engineering flow scenarios. Overall, three of the four presented models
    predict the effective suspension behavior to engineering accuracy, while one model
    does not compare favorably.


    +   - In chapter 5, we present a novel DMN architecture for the treatment of rigid
    fibers suspended in incompressible non-Newtonian media. For this purpose, we derive
    closed form expressions for the linear homogenization functions of layered emulsions
    with finite material contrast. For the treatment of infinite material contrast,
    we rely on a particular type of layered material, the coated layered material.
    We derive necessary and sufficient conditions for which the effective behavior
    of a coated layered material with incompressible phases is non-singular, even
    if its core phase is rigid. Using the considered layered materials as homogenization
    blocks, we present the FDMN architecture as a nested tree of layered materials.
    We train FDMNs on linear homogenization data for fiber suspensions with a shear-thinning
    PA6 matrix material to predict the non-linear viscous behavior of the suspensions.
    Finally, we compare the prediction accuracy and applicability of the FDMNs with
    the closed form models presented in chapter 4.'
