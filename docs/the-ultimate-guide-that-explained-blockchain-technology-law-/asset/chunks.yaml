  trans: '

    Blockchain 将为银行带来最大的商业流程优势。金融机构仅在工作时间开放，通常每周五天。如果你在周五下午 6 点后存入支票，你可能需要等到周一早上钱才会进入你的账户。即使存款是在工作时间进行，由于银行需要处理大量交易，交易验证也可能需要一到三天时间。


    相反，Blockchain 永不休眠。如果银行采用 Blockchain，客户可以在仅需 10 分钟内完成交易，这正是添加一个区块到 Blockchain
    所需的时间，无论是工作日、节假日还是深夜。


    Blockchain 还使银行能够更快更安全地在机构之间交换资金。它还因提高透明度和安全性而改进了传统的国际资金转移方式。


    #### 货币


    Blockchain 是 `bitcoin` 等加密货币的基础。`Federal Reserve` 控制美国货币。在集中化系统中，用户的数据和资金在技术上由其银行或政府掌控。如果用户的银行被入侵，用户的私人数据面临风险。如果用户的银行倒闭，或用户居住在政府不稳定的国家，其货币价值可能受到威胁。2008
    年，几家破产银行被救助，有时以纳税人的金钱为代价。


    #### 健康护理


    医疗专业人员可以使用 Blockchain 安全存储患者的医疗记录。当医疗记录创建并签署时，可以写入 Blockchain，为患者提供记录未被篡改的证明和保障。此外，凭私钥，这些私人医疗记录可以加密并存储在
    Blockchain 上，仅限特定人员访问。


    #### 产权登记


    如果你曾去过当地土地登记处，你就会知道产权登记流程繁琐且低效。目前，纸质文件会交给当地土地登记处的官员，需要手工录入中央数据库和区公共登记处。在争议中，产权主张必须通过公共登记册进行验证。


    这一过程不仅成本高昂且耗时，还易受人为错误影响，任何不准确都会使产权追踪效率降低。Blockchain 可以消除扫描文件和在当地土地登记处查找纸质记录的需求。一旦产权在
    Blockchain 上存储并验证，所有权人就能确信其产权被准确且永久地记录。


    #### 选举


    Blockchain 选举有潜力防止选举舞弊并提高投票率，如 2018 年 11 月西弗吉尼亚州中期选举所见。使用 Blockchain 将使选举舞弊几乎不可能。Blockchain
    协议还将提升选举过程的透明度，减少开展选举所需的人力，并为当局提供近乎即时的结果。因此，无需重新计票，也无需担心欺诈会影响选举结果。


    ### Blockchain 的优缺点


    #### 优势


    *   消除人工干预验证过程，提高准确性。


    *   消除第三方验证，降低成本。


    *   分散化使篡改更加困难。


    *   交易安全、保密且高效。


    #### 透明技术


    它为银行服务提供替代方案，并在政府不稳定或欠发达的国家保护公民的数据。


    #### 缺点


    *   `Bitcoin` 矿工的高昂技术成本。


    *   每秒交易量有限。


    *   它被用于非法活动，例如在“暗网”上。


    *   各国法规各异且仍不确定。


    没有严格的规则限制谁可以使用这种无缝技术。因此，虽然唯一的潜在用户是银行、大型交易平台和全球公司，技术也对普通公众的日常交易开放。


    随着我们进入 Blockchain 的第三个十年，问题已不再是传统企业是否会采用该技术，而是何时采用。今天，我们正在见证 NFT 的兴起以及资产代币化的浪潮。因此，未来几十年将是
    Blockchain 的主要增长阶段。


    ### 加密货币


    定义加密货币是一项挑战。与 Blockchain 类似，加密货币已成为一系列利用更广为人知的“密码学”技术的技术发展的流行术语。简单来说，密码学是通过将信息变为不可读并仅限知晓密钥的人才能解密（或解密）的方式来保护信息。该方法使用复杂的公钥和私钥数字系统来保护
    `bitcoin` 等加密货币。加密货币通常是去中心化的数字货币，设计用于在互联网上使用。`Bitcoin` 是第一个加密货币，2008 年推出，至今仍是最大、最重要的。`bitcoin`
    之后十年出现的其他加密货币（如 `Ethereum`）已成为政府发行货币的数字替代品。


    #### 什么是加密货币？


    加密货币是一种在线发送和接收资金的方式，不依赖银行来验证交易。相反，它是一种点对点支付系统，允许任何人、 anywhere 发送和接收资金。与实物货币不同，加密货币支付纯属在线数据库中的数字条目，描述具体交易。公共账本记录每次加密货币转账。加密货币存储在数字钱包中。


    #### 加密货币种类


    `Bitcoin` 是最受欢迎且价值最高的加密货币。匿名人物 `Satoshi Nakamoto` 在 2008 年通过白皮书发明并向世界介绍了它。目前市场上有数百种加密货币，每种声称拥有不同功能和规格。例如，`Ethereum`
    的 `Ether` 在底层智能合约平台的气体中运行。银行使用 `Ripple` 的 `XRP` 促进不同地理区域之间的转账。`Bitcoin` 于 2009
    年公开发布，仍是最被交易和报道的加密货币。截至 2022 年 5 月，流通的 `bitcoin` 数量超过 1900 万，总市值约为 $5760 亿美元。此后，仅有
    2100 万 `bitcoin` 会存在。


    在 `bitcoin` 成功之后，许多其他加密货币（称为“altcoins”）被推出。有些是 `bitcoin` 的克隆或分叉，而其他则是全新创建的货币。包括
    `Solana`、`Litecoin`、`Ethereum`、`Cardano` 和 `EOS`。截至 2021 年 11 月，所有加密货币的总价值超过 $2.1
    万亿美元，`bitcoin` 占此总量的约 41%。


    #### 加密货币的工作原理？


    加密货币通过分布式公共账本——`Blockchain` 运行，这是一份所有交易的登记册，由货币持有者更新和管理。加密货币通过“矿工”创建，矿工使用计算机解决复杂的数学问题来生成硬币。用户也可以从经纪人处购买硬币，然后存储和花费在电子钱包中。拥有加密货币的用户并不拥有任何实物，而是拥有一把密钥，这把钥匙允许记录或计量单位在不使用可信第三方的情况下从一人转移到另一人。


    '
