  trans: '

    -   [万维网 (WWW)](https://en.wikipedia.org/wiki/World_Wide_Web) 过去约 20 年来被用于改善沟通、协作和资源共享，鼓励积极学习，并提供远程教育。Web
    帮助教师规划合适的在线学习结构，并分享课堂学习目标和活动。近年来，许多大学和教育机构提供在线服务，如招生和虚拟（在线）学习环境，以便促进终身学习，并使其与其他教育管理活动兼容。例如，教师可以创建一个完全基于网络的系统，其中包括在线手册，涵盖学生活动、项目以及参考来源列表。此外，学生和其他学习者可以在连接互联网时，随时随地访问基于网络的材料。


    ### 什么是 Web 3.0？


    Web 3.0（Web3）是不断演进的第三代网络技术。Web，也称为万维网，是使用互联网的基础层，提供网站服务和应用。由于 Web 3.0 仍处于发展和定义阶段，因此没有统一且被普遍接受的定义。Web
    3.0 无疑将强调去中心化应用，并大量使用基于区块链的技术。此外，Web 3.0 将利用人工智能和机器学习，使应用更加智能和适应性强。


    ### Web 3.0 的关键思想


    尽管很难给出 Web3 的严格定义，但一些基本原则指导其发展。


    Web3 是去中心化的：与其说互联网的大部分由集中机构控制和拥有，不如说所有权在创作者和用户之间共享。


    每个人都能平等访问 Web3，且不受限制，因为它是无需许可的。


    Web3 提供原生支付，摒弃了过时的银行和支付处理器基础设施，转而使用加密货币进行在线购买和支付。


    Web3 不依赖可信的第三方：它通过经济激励和机制运作，而非依赖受信的中介。


    ### Web 3.0 如何工作？


    在 Web 1.0 和 Web 2.0 技术中，超文本标记语言（HTML）负责网页的设计和呈现。在 Web 3.0 中，HTML 仍然是基础层，但数据源的链接方式和位置可能与以往不同。许多
    Web 页面和几乎所有 Web 2.0 时代的应用依赖于某些中心数据库来提供数据并启用功能。Web 3.0 应用和服务则使用去中心化区块链而非中心数据库。在区块链中，核心思想是没有任意的中央权威，而是一种分布式共识。


    区块链和 Web 3.0 社区中出现的一个治理理想是去中心化自治组织（DAO）。与传统的中心化平台治理模式不同，Web 3.0 技术和社区通过去中心化方式提供自治治理。Web
    3.0 也主要使用加密货币而非法币运作。通过基于区块链技术的加密货币，Web 3.0 实现了金融和以去中心化方式支付商品和服务的能力。IPv4 地址空间是
    Web 1.0 和 2.0 版本的基础。由于互联网在数十年中的巨大增长，Web 3.0 需要更大量的 Internet 地址，而 IPv6 正好提供了这一点。


    ### Web3 概念 - DAO


    去中心化自治组织（DAO）是 Web3 的一个概念，描述由区块链上编码的规则和标准所约束的群体、企业或集体。例如，在一个基于 DAO 的企业中，所有商品的价格以及谁从企业中获得付款的详情都存储在区块链上。DAO
    的股东可以决定是否更改价格或分配资金。


    然而，未经授权，任何人都不能篡改这些原则。此外，物理基础设施的所有者（如服务器或存储利润的设施的所有者）也无法干预，例如，他们不能跑路携带利润！理论上，DAO
    消除了运行业务所需的许多“中间人”，如银行家、律师、会计师和所有者。


    ### 人工智能（AI）与 Web 3.0


    大多数人认为，人工智能将在 Web 3 中发挥重要作用，因为许多 Web 3 应用需要机器对机器的通信和决策。


    ###  메타버스 如何融入 Web 3？


    我们需要讨论的最后一个重要 Web3 概念是 메타버스（元宇宙）。在 Web3 的语境下，“metaverse” 指的是下一代 Internet 前端：用户通过该界面与在线世界互动、与其他用户沟通并操作数据的界面。如果你错过了所有的炒作，元宇宙的概念是它将是一个比我们熟知的
    Internet 更沉浸、更社交、更持久的版本。它将使用虚拟现实（VR）和增强现实（AR）等技术来吸引用户，并让我们以更自然和沉浸的方式与数字世界互动，例如使用虚拟手掌抓取和操作物体，或用声音指令机器或与他人交流。在许多方面，元宇宙是人们与
    Web3 工具和应用互动的界面。


    创建 Web3 应用不一定需要使用元宇宙——比特币就是一个例子——但预计元宇宙的技术和体验将在许多这些应用如何与我们的生活互动方面发挥重要作用。


    ### Web 3.0 应用示例


    基于区块链，Web 3.0 使得新的应用和服务类型不断涌现，包括现有应用的扩展，如：


    NFT。非同质化代币（NFT）是存储在区块链上的代币，带有加密哈希值，使得每个代币单元独一无二。


    DeFi。去中心化金融（DeFi）是一个新兴的 Web 3.0 用例，利用去中心化区块链作为基础，使金融服务超越传统集中式银行基础设施的限制。


    加密货币。加密货币（如比特币）是 Web 3.0 应用，创造了一个与历史上的法币世界区别开的全新货币世界。


    dApps。去中心化应用（dApps）是基于区块链构建的应用，使用智能合约以编程方式记录在不可篡改的账本中，以实现服务交付。


    区块链桥。在 Web 3.0 世界中，存在多个区块链，它们之间的某种程度的互操作性（跨链桥）成为可能。


    DAO：DAO 应成为 Web 3.0 服务的组织实体，以去中心化的方式提供结构和治理。


    ### 为什么去中心化？


    去中心化是区块链技术的关键原则，它使得交易安全、透明且不可篡改。它在交易双方之间提供更大的信任，并消除了管理交易的中央权威的需求。区块链最初是为了在不需要第三方的情况下追踪和管理数字交易而创建的。交易被分组到区块中，链接在一起，并使用密码学进行保护。网络中的每个节点都会更新其区块链的副本，使得任何人篡改信息都变得困难。

    '
