    -   **总体而言**，`private`区块链网络相较于`public`区块链具有**更高的安全性、可扩展性和灵活性**等优势。\n\n### Permissioned\
    \ blockchain networks\n\n-   `Permissioned`区块链网络是一个**私有**的节点网络，其中中央权威批准每个节点。`Permissioned`网络比`public`网络（如比特币）更快、更具可扩展性，但牺牲了去中心化和安全性。`Permissioned`区块链要么是`consortium`区块链，要么是`private`区块链。在`consortium`区块链中，共识过程由预先选定的节点集合控制；在`private`区块链中，共识过程由单一实体控制。\n\
    \n-   `Permissioned`区块链通常比`public`区块链（如比特币）快得多，因为它们不需要等待网络中所有节点达成共识才能添加新块。它们也更具可扩展性，因为网络中的节点数量较少，且中央权威已审核每个节点。然而，`permissioned`区块链为了速度和可扩展性牺牲了去中心化和安全性。由于只有特定节点被允许添加新块，这些区块链对\
    \ 51%攻击和其他欺诈形式的安全性较低。此外，由于缺乏真正的去中心化共识机制，这些区块链也更易受到其中央权威的审查。\n\n#### Advantages\
    \ of Permissioned blockchain networks\n\n-   `Permissioned`区块链网络相对于`public`区块链的优势包括：\n\
    \    -   **更高的可扩展性**：由于节点数量受限且已知，可扩展性更高。\n    -   **更快的速度**：由于共识机制不需要去中心化，速度更快。\n\
    \    -   **更高的定制化**：可以根据网络参与者的需求进行定制。\n\n### Consortium blockchains\n\n-   多个组织可以共同承担运行区块链的责任。例如，**谁**可以提交交易或访问数据由这些预先选定的方决定。\"\
    Consortium blockchains 是**多个实体共同管理、访问和授权**……的网络。因此，区块链联盟非常适合所有参与者必须获权限并共同承担区块链责任的商业场景。\n\
    \n#### Advantages of Consortium blockchains\n\n-   `Consortium`区块链是一个**私有**区块链网络，仅允许特定预先批准的节点参与共识过程。它具有与`private`区块链相同的许多优势，如**更高的安全性、隐私性和可扩展性**。但`consortium`区块链也有其独特的优势。\n\
    \n-   例如，`consortium`区块链可以在不同组织之间创建**共享数据库**。这对于供应链管理或其他需要多方共享数据的领域很有用。`Consortium`区块链还可以创建**共享服务**，如身份管理或支付处理。通过汇集资源并分担开发和维护成本，`consortium`区块链可以比每个组织单独提供这些服务更高效。\n\
    \n-   另一个优势是`consortium`区块链可以帮助管理**合规性**。例如，一组金融机构可以使用`consortium`区块链在**私有**区块链网络上共享可疑活动信息，而不违反反洗钱法规。通过在**私有**区块链网络上存储数据，只有授权用户才能访问。利用**智能合约**，数据可以自动加密，并在满足特定条件时仅与相关监管机构共享。\n\
    \n-   `Consortium`区块链还提供**灵活性**。由于它们不受`public`区块链网络的相同共识规则约束，可以根据成员需求进行定制。例如，一组银行可以同意使用与一组保险公司不同的共识算法。\n\
    \n### How does blockchain technology work?\n\n-   你可能注意到许多企业最近都采用了区块链技术。但区块链技术具体是如何工作的？它是重大变革还是仅仅一个附加功能？区块链是一项年轻的技术，仍在不断发展，许多新项目正在上线，让我们来揭开这项技术的神秘面纱。\n\
    \n-   区块链是三项前沿技术的融合结果：\n\n*   `Cryptographic keys`（密码学密钥）\n\n*   一个**点对点**网络，包含共享账本。\n\
    \n*   一个计算设备，用于存储网络中的交易和记录。\n\n#### \"Cryptographic Keys\"\n\n-   `Cryptographic\
    \ keys`由两把密钥组成，`private`和`public`“keys”（密钥）。这些密钥促进了两方之间的成功交易。每个人都有这两把密钥，它们允许他们创建安全的数字身份。\n\
    \n#### \"Digital Identification and Security\"\n\n-   **数字身份**和安全在我们的数字世界中变得日益重要。区块链技术可以提供一种安全且去中心化的方式来存储和管理数字身份。\n\
    \n-   基于区块链的数字身份系统可以解决当前集中化系统面临的许多问题，如需要可信的第三方和数据集中化。通过区块链，每个用户都将拥有对其数据的控制权，数据存储在去中心化的、安全且不可篡改的数据库中。因此，基于区块链的数字身份系统可以验证文档、合同或其他在线交易的真实性。此外，它还能通过将数据存储在区块链上，在所有参与方达成一致的前提下防止数据被篡改，从而增加额外的安全性和信任度。\n\
    \n-   除了数字身份管理，区块链技术还可以创建不可篡改的数字签名。因此，它可以在文档验证、版权保护或甚至投票中发挥作用。基于区块链的数字签名使得伪造或修改签名变得不可能，除非被检测到。\n\
    \n-   区块链技术为数字身份和安全提供了全新的思考方式。通过使用去中心化数据库和密码学技术，它使得创建安全、抗欺诈和抗篡改的系统成为可能。这些系统可以在公共和私营部门都有广泛的应用。\n\
    \n### Uses of Blockchain\n\n#### Banking and Finance\n\n"
