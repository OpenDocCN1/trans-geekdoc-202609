  trans: "\n加密货币（如比特币）使用区块链技术创建一个所有交易的在线账本，矿工负责验证这些交易。因此，它消除了银行或其他金融机构进行这些任务的需要，从而节省了时间和金钱。区块链技术的潜在应用无限，例如用于存储医疗记录、创建产权登记册、追踪钻石和其他贵重宝石、减少供应链中的欺诈、验证投票结果等。\n\
    \nWeb 3.0 不仅仅是一组新技术和有用的服务。Web 3.0 技术提供了一系列服务，使真正的在线课堂成为可能。由于其本质，Web 3.0 服务将对教学和学习产生积极影响。Web\
    \ 3.0 技术提供 3D 维基、3D 实验室、基于代理的智能搜索引擎、如头像和语义数字图书馆等虚拟环境，以及更多。在我们对 Web 3.0 的愿景中，我们设想这些普遍技术创造出一种收敛于真实与虚拟环境的场景，用户可以在虚拟和现实世界中无缝与人和机器互动。这些好处可以直接与在线教育中已有的最佳实践相结合，培养真实且有效的学习环境。\n\
    \n# 第二章\n\n## 区块链和加密货币如何融入 Web3 哲学？\n\n去中心化，如前所述，是 Web2 的主要问题——权力和数据集中在少数重要企业手中。区块链和加密货币有潜力通过促进信息和权力更公平的分配来去中心化\
    \ Web3。此外，Web3 可能使用基于区块链的公共分布式账本来提高透明度和去中心化程度。\n\n### 无需许可\n\n基于区块链的项目用公开可访问的代码替代传统企业的专有系统。由于区块链应用是无需许可的，任何人都可以在没有限制的情况下访问和与它们进行通信。\n\
    \n### 无信任\n\n区块链和加密货币消除了依赖第三方（如银行或个人中介）的需要。因此，Web3 用户可以在仅信任网络本身的前提下进行交易。\n\n###\
    \ 支付通道\n\n加密货币有潜力作为 Web3 的数字原生支付基础设施。此外，由于数字资产真正跨越国界且无需中介，它们有潜力改善 Web2 的昂贵且笨重的支付基础设施。\n\
    \n### 所有权\n\n加密货币已经提供了如自托管加密货币钱包等解决方案，使用户无需中介即可保管资金。用户还可以将钱包连接到去中心化应用，以多种方式使用其现金或展示其数字资产。任何人都可以通过透明的公共账本验证这些资金和商品的所有权。\n\
    \n### 抵制审查\n\n区块链设计为具有抵制审查性，意味着没有任何单一方可以单方面更改交易记录。上传到区块链后，记录几乎无法被擦除。这一特性可能有助于保护所有形式的表达免受政府和企业的压制。\n\
    \n### 区块链、加密货币和 Web3 如何工作？\n\n区块链是一个去中心化的平台，允许用户创建和共享数字合约。加密货币是数字或虚拟代币，使用密码学保护其交易并控制新单位的创建。Web\
    \ 3 是一个术语，描述了下一代 Web 架构，它将实现分布式网络中节点之间更高效和透明的通信。\n\n### 区块链、加密货币和 Web3 的行业采用\n\
    \n区块链、加密货币和 Web3 的行业采用正在快速增长。最近的研究表明，大多数公司都在探索区块链和数字货币的潜力。原因包括…… \n\n"
