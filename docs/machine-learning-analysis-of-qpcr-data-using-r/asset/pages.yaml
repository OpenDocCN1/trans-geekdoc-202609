    a string or a vector of string to be passed to x.


    `unname(x)`

    x

    a vector to be unnamed.


    The for instruction is a basic control-flow construct that reiterates the block
    of commands for the number of elements present in the literal vector. At each
    iteration the element variable is available so that, for instance, print(variable)
