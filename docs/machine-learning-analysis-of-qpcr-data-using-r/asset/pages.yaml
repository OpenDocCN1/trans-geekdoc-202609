    # Listing 2.6.


    The maxRatio function excludes the first cycle from the amplification vector passed
    to it as the argument A. A corresponds to the amplification at the cycle n, stored
    in the vector n. The amplification at the cycle n-1 is obtained by excluding the
    last element of the vector A, stored in the vector n_minusOne. The ratio, diminished
    by one, between these vectors is stored in the object R. Since the computation
    is on vectors, the operation is done element by element on n and n_minusOne, returning
    a vector. When the vectors undergoing the operation are not of the same length,
    the shortest vector is recycled. That is: having the vectors x <- c(2, 3) and
    y <- c(8, 9, 10, 12), the vector w <- y/x will contain [4, 3, 5, 4]. In other
    words, x has been recycled in the operation to obtain 8/2, 9/3, 10/2 and 12/3.


