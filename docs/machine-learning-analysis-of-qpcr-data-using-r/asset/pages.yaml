    \ plot. The diagnostic characteristics of the assay will be calculated.\n\n```\n\
    ```r\n# Listing 3.10\nlibrary(lattice)\nlibrary(RColorBrewer)\nlibrary(latticeExtra)\n\
    make.grid = function(x, n = 1000) {\n    xrange = apply(x, 2, range)\n    x1 =\
    \ seq(from = xrange[1,1], to = xrange[2,1], length = n)\n    x2 = seq(from = xrange[1,2],\
    \ to = xrange[2,2], length = n)\n    expand.grid(X1 = x1, X2 = x2)\n}\nplot_list\
    \ = list()\naccuracy_result = data.frame(Set = numeric(), Accuracy = numeric(),\
    \ Sensitivity = numeric(),\n                             Specificity = numeric())\n\
    ```\n```"
