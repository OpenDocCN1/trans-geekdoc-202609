    \    logical determining whither sampling should be done with replacement (default=\
    \ FALSE).\n  prob\n    optional vector of probability weights.\n```\n\n# Listing\
    \ 3.8\n\nAn SVM model is built on the training data frame (train_set) using the\
    \ column \"outcome\" as a z value and the combination of FCN and MR as x and y\
    \ values, respectively. The model will, therefore, maximize the separation of\
    \ clusters of data with the same z value based on x and y. The model is generated\
    \ with the function ksvm of the package kernlab and it is stored in the object\
    \ mod and applied to the testing data frame (test_set). The prediction of z (the\
    \ label of reactivity) is based on the provided x (FCN) and y (MR) values using\
    \ the predict function. The vector pred_prob contains the probability of the classification;\
    \ prediction contains the actual label. A new data frame (OUT) is built using\
    \ the index of the testing data frame and prediction.\n\n```\nThe function ksvm\
    \ generates an SVM model based on graphical coordinates (x/y values) and a label\
    \ (z values). The function predict is part of R core and predicts new values based\
    \ on a model.\nksvm(z~x+y, data, scaled, type, kernel, kpar, C, nu, epsilon, prob.model,\
    \ class.weights, ...)\n  x, y\n    coordinates of the data points.\n  z\n    a\
    \ response variable (a factor or numeric) with one label for each row/component\
    \ of x.\n  data\n    data frame containing the training data.\n  scaled\n    logical\
    \ indicating whether the variables should be scaled.\n  type\n    string indicating\
    \ the final use of the SVM model: \"C-svc\" C classification; \"nu-svc\" nu classification;\
    \ \"C-bsvc\" bound-constraint svm classification; spoc-svc Crammer, Singer native\
    \ multi-class; \"kbb-svc\" Weston, Watkins native multi-class; \"one-svc\" novelty\
    \ detection; \"eps-svr\" epsilon regression; \"nu-svr\" nu regression; \"eps-bsvr\"\
    \ bound-constraint svm regression; \"C-svc\" C classification.\n  kernel\n   \
    \ kernel function used in training and predicting: \"rbfdot\" Radial Basis kernel\
    \ Gaussian; \"polydot\" Polynomial kernel; \"vanilladot\" Linear kernel; \"tanhdot\"\
    \ Hyperbolic tangent kernel; \"laplacedot\" Laplacian kernel; \"besseldot\" Bessel\
    \ kernel; \"anovadot\" ANOVA RBF kernel; \"splinedot\" Spline kernel; \"stringdot\"\
    \ String kernel.\n  kpar\n    kernel parameters: \"sigma\" inverse kernel width\
    \ for the Radial Basis kernel function \"rbfdot\" and the Laplacian kernel \"\
    laplacedot\"; degree, scale, offset for the Polynomial kernel \"polydot\"; scale,\
    \ offset for the Hyperbolic tangent kernel function \"tanhdot\"; sigma, order,\
    \ degree for the Bessel kernel \"besseldot\"; sigma, degree for the ANOVA kernel\
    \ \"anovadot\".\n  C\n    cost of constraints violation (default = 1).\n  nu\n\
    \    parameter needed for nu-svc, one-svc, and nu-svr.\n  epsilon\n    insensitive-loss\
    \ function used for eps-svr, nu-svr and eps-bsvm (default = 0.1)\n  prob.model\n\
    \    logical determining whether to build a model for calculating class probabilities\
