- pgno: 56
  md: 'luminescence over 2000 times after binding to the DNA, which means there is
    a background light that is two thousands-fold lower than the PCR-related signal.
    Such background is a noise that reduces the sensitivity of the PCR, and can be
    observed in the lower insert of Figure 1.2.


    It is possible to relate the initial loads N₀ of two sample A and B as follows
    (Kubista et al., 2006):


    N₀ᴬ/N₀ᴮ = (1 + E)^{CqA - CqB} = (1 + E)^{ΔCq}.  (2.2)


    When the efficiency of amplification of the PCR is 1 (100%), then the base becomes
    2^{ΔCq}. In the example, the difference in Cq between the UV-treated and UV-untreated
    samples is six, the ratio between their load is 2⁶ = 64.


    It is possible to relate the quantity of ROI N_t at a given amplification cycle
    t to the initial amount of target N₀ with the equation (Rutledge and Côté, 2003):


    N₀ = N_t (E+1)^{-t}.  (2.3)


    Equation 3 can be linearized by converting to logarithms:


    log(N₀) = log(N_t) - log(E+1) t =

    = - log(E+1) t + log(N_t).  (2.4)


    From Equation 3, the slope of the curve is -log(E+1) and the intercept is log(N_t).
    The curve needed to generate this curve is practically obtained by serially diluting
    a stock of a nucleic acids measured with an accurate method. Such series goes
    under the name of standard dilution and the resulting Cqs are used to generate
    a standard curve, that is a linear regression model. The interval between the
    lowest and highest dilutions should be within the dynamic range of the assay,
    that is the minimal and maximal amounts that the assay can accurately measure.
    A sample with unknown load can be quantified by interpolation using such a curve.
    This is possible because each reaction’s Cq is described by this equation (Rutledge
    and Côté, 2003):


    Cqₙ = s × log(N₀) + I  (2.5)


    where I (intercept) is the ideal Cq obtained if there was only one copy of target
    in the reaction and s is the slope obtained from fitting a line (or more'
