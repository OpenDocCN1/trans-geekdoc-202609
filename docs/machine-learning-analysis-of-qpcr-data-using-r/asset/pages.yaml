    \n# Listing 3.9\n\nThe procedure described in listing 3.8 is repeated iterating\
    \ the kernels listed in the vector *kernel_list*. To compute the accuracy for\
    \ each of the kernels, an empty data frame is instantiated (*accuracy_result*)\
    \ for storing the accuracy obtained during the iteration. The iteration runs over\
    \ the 10 training data sets defined in the previous listings; the index of the\
    \ iteration (*i*) is printed on screen for reference. A for loop is set to run\
    \ the SVM model with the elements *k* of *kernel_list*. The OUT data frame is\
    \ prepared as described in listing 3.8 and the accuracy (ACC) is computed. The\
    \ *k* in ACC are concatenated in a temporary data frame (*results*) that is then\
    \ added to the output data frame *accuracy_results*, which contains 10 accuracy\
    \ values for each kernel. By using the function *aggregate*, the mean of these\
    \ 10 iterations computed for each kernel and the output stored in the object *outcome*.\
    \ The procedure is repeated for the costs, with values stored in the vector *cost_list*.\n\
    \n```\n```text\nThe function aggregate splits the data into subsets and computes\
    \ their summary statistics.\naggregate(x, by, fun, ...)\n    x\n        a data\
    \ frame.\n    by\n        column to be subset.\n    fun\n        summary statistics\
    \ function.\n```\n```\n\n# Listing 3.10\n\nOnce the kernel and costs for the SVM\
    \ model have been selected (listing 3.9), the procedure is run on a set of five\
    \ sets. To better visualize the hyperplane, the number of points to be analyzed\
    \ by the SVM model is increased using the function *make.grid*. This takes a vector\
    \ of x values (parameter x) and applies the function range to generate a sequence\
    \ of values.\n\nThe list *plot_list* is instantiated to contain the hyperplane\
    \ from each iteration. The implementation is the same as shown in before listings\
    \ (listings 3.8–3.9), but in this case the function *make.grid* is called to generate\
    \ the matrix *xmat* that will contain 1000 × 1000 data points ranging from the\
    \ minimum and maximum MR and FCN values. The matrix xmat is converted into a data\
    \ frame (*xgrid*) and names (“MR” and “FCN”) are assigned to its columns. The\
    \ SVM model is applied to *xgrid* to generate the vector of predicted labels (*z_values*)\
    \ and a combination data frame is generated by combining *xgrid* and *ygrid* (*xyz_dat*).\
    \ The contour of the areas of equal label is obtained with the function *contourplot*,\
    \ which is saved as an element of the *plot_list* object.\n\nThe plot of the classification\
    \ is stored in the object P, but the operator ‘+’ provided by the package *latticeExtra*\
    \ allows to add the hyperplanes in the form of graphical objects stored in *plot_list*.\
    \ Each element of *plot_list* is superimposed individually to P with the *lattice*’s\
    \ function *as.layer*. The resulting plot is drawn and the characteristics of\
    \ the analysis are computed.\n\nTo better understand the concept of SVM classification,\
    \ the area delimited by a hyperplane is drawn rather than the hyperplane itself.\
    \ An element from the xyz_dat data frame is drawn shading the area according to\
    \ the reaction’s labels.\n\n```\n```text\nThe function apply applies a chosen\
    \ function to an object (vector, matrix or list) and returns an object with the\
    \ results. The function range returns a vector containing the minimum and maximum\
    \ of all the given arguments whereas expand.grid creates a data frame from all\
    \ combinations of the supplied vectors or factors.\nThe functions contourplot\
    \ and as.layer are provided by the package lattice and latticeExtra, respectively.\
