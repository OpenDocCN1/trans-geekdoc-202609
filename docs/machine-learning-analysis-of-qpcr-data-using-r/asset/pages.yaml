    Graphically, it is easy to track the Cq into the axis of the quantities by interpolation.
    Mathematically, regression can only map a y value from an x value; thus, a function
    of Cq is needed to compute the associated quantity. The quantification is given
    by the formula:


    10^{(Cq - I)/s}  (2.7),


    which is the inverse of Equation 2.5, and provided the following inputs:


    ```

    > high_load

    [1] 203 109.5

    > low_load

    [1] 4.521494

    ```


    Practically, the low load is issues as ‘below the limit of detection of the assay’.
    From Equation 2 it can be seen the quantification described so far relies on the
    assumption that the efficiency of amplification is the same for all reactions.
    However, in real-life, organic molecules present in the biological sample might
    affect the DNA-pol reducing the PCR efficiency. For instance, heme from red cells,
    fat in the blood, and heparin in the sampling vessel are well-known inhibitors
    of the PCR (Al-Soud et al., 2000).


    # Quality Control of the Fit-Point Method


    A qPCR run generates a series of numerical data that needs to be analyzed and
    the thermal-cycler are sold already with a patented analytical software (Green
    and Sambrook, 2018). Alternatively, a plethora of analytical tools are available
    for different platforms (Pabinger et al., 2014). Nevertheless, the simple execution
    of the qPCR does not assure that the obtained values are'
