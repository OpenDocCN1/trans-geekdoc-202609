    > [1] 0.000 1.154 12.182 224.251 -67.337

    ```


    That is, a drop of 0.1% and 10% in the efficiency can lead to a copy number overestimation
    of 1 and 224 percent over full efficiency. Conversely, reactions where the efficiency
    of amplification is above 100% lead to underestimation of the actual copy numbers.
    Thus, an efficiency of 110% conveys 67% less copy numbers than by considering
    the reaction fully efficient. To put such shift in quantification in context,
    let’s consider the following example. The typical limit of detection of HIV VL
    is about 40 copies per millilitre (c/mL) of blood (Adams et al., 2019). Let’s
    assume a sample with 35 c/mL and efficiencies of amplification of 90 and 110 percent,
    respectively. Using the functions PCR and find_cycle previously defined, it is
    possible to estimate the expected copy numbers based on a threshold of 10^6 light
    units:


    ```

    d <- 2

    K <- 10^13

    A1_0 <- 35

    A1 <- PCR(A1_0, d, K)

    a1 <- which(A1 > 1000000)[1]

    cq_1 <- find_cycle(A1, 1:45, a1)

    cq_1

    > [1] 16.60976

    ```


    Hence, the returned copy numbers are:


    ```

    E <- c(0.990, 1.100)

    log_N0 = -((log(E+1)*cq_1))+log(Nt)

    N0 <- 10^log_N0

    N0

    > [1] 243.08398 31.05318

    ```'
