  md: 'fragment and it is central in the polymerase activity. This domain also has
    a transferase capability and adds a non-template residue (typically an adenine)
    at the end of the fragment. The presence of this extra-A comes handy in cloning
    procedures because it can anneal with a protruding timine from cloning vectors.

    The Taq-pol is now engineered to be produced in E. coli (Lawyer et al., 1989).
    Taq-pol, however, does not have a high fidelity (it introduces eight mismatched
    nucleotides every million insertions), and high-fidelity temperature-stable DNA-pol
    have been isolated from other organisms such as the archea Pyrococcus furiosus
    (Pfu, which introduces one erroneous dNTP every million insertions) (Cline et
    al., 1996). In addition, Taq-pol can incorporate modified dNTPs; this feature
    is used to mark the synthesized DNA with, for instance, digoxigenin or biotin.

    Another instance where the wide-range of dNTPs accepted by Taq-pol is that of
    uracil insertion. By replacing Ts with Us, it is possible to make the synthesized
    DNA susceptible to uracyl N-glycosylase (UNG) treatment: the digested DNA will
    reduce the risk of carry-over contamination from one reaction to a subsequent
    one. Several thermo-stable DNA-pol have been isolated from microbes but, in recent
    years, mutagenesis is used to specifically enhance the characteristics of the
    enzyme, such as to provide higher processivity or fidelity (Kermekchiev et al.,
    2003; Raghunathan and Marx, 2019).


    +   - *A set of oligonucleotides (primers)*. All DdDp require a primer to start
    the replication of the DNA target. In native conditions, a DNA-dependent RNA-polymerase
    (DdRp, or primase) will synthesize a short single-stranded fragment complementary
    to a section of the promoter that kick-starts the process because the DdDp will
    add nucleotide to this fragment. The improvement in the biochemical sector of
    the synthetic production of oligonucleotides made up for the RNA-pol. Primers
    are usually provided at a concentration of 0.1-1.5 μM, which is in the order of
    10¹³ molecules. After all the primers have been elongated, the reaction will stop,
    and 10¹³ primers will last for about 30 cycles. The melting temperature Tₘ is
    the temperature that melts 50% of the DNA chains where at least one of the chains
    is an oligonucleotide (Wetmur, 1991).

    +   - *Knowledge of the sequence of the region of interest.* The role of the synthetic
    primer is not just in starting the polymerization process but'
