    \ type=\"\", lwd = 4, xlab = NA, ylab=NA, xaxt=\"n\", yaxt=\"n\")\naxis(4)\nabline(v=FCN,\
    \ lty=2)\n```\n\n```\n> quantification <- mrCalc(1:length(amp), amp)\n> MR <-\
