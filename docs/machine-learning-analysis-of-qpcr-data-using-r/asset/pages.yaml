    , sep = \"\"))\ntest_ids = readRDS(paste(\"data/testSet_\", i, \".rds\", sep =\
    \ \"\"))\ntrain_set = validation[validation$Index %in% train_ids,]\ntest_set =\
    \ validation[validation$Index %in% test_ids,]\ntrain_set$Outcome <- ifelse(is.na(train_set$FAM)\
    \ == TRUE, \"negative\", \"positive\")\ntest_set$Outcome <- ifelse(is.na(test_set$FAM)\
    \ == TRUE, \"negative\", \"positive\")\ntrain_set$Outcome <- as.factor(train_set$Outcome)\n\
    ```\n\n```\ntest_set$Outcome <- as.factor(test_set$Outcome)\nfor (k in cost_list)\
    \ {\n    mod = ksvm(outcome ~ MR+FCN, data = train_set, type = \"C-svc\",\n  \
    \      kernel = \"rbfdot\", kpar = \"automatic\", C = k, prob.model = TRUE)\n\
    \    pred_prob = predict(mod, test_set, type = \"probabilities\")\n    prediction\
    \ = predict(mod, test_set)\n    serial = test_set$Index\n    rating = test_set$Outcome\n\
    \    OUT = data.frame(serial, rating, prediction, stringsAsFactors = FALSE)\n\
    \    TP = nrow(subset(OUT, rating == \"positive\" & prediction == \"positive\"\
    ))\n    TN = nrow(subset(OUT, rating == \"negative\" & prediction == \"negative\"\
    ))\n    FP = nrow(subset(OUT, rating == \"negative\" & prediction == \"positive\"\
    ))\n    FN = nrow(subset(OUT, rating == \"positive\" & prediction == \"negative\"\
    ))\n    ACC = (TP + TN) / (TP + TN + FP + FN)\n    results = data.frame(Set =\
    \ i, Cost = k, Accuracy = ACC)\n    accuracy_result = rbind(accuracy_result, results)\n\
    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 111
  md: "```\n```r\n> aggregate(Accuracy ~ Cost, accuracy_result, mean)\n\n    Cost\
    \  Accuracy\n1   0.01  0.6136364\n2   0.10  0.9681818\n3   0.50  0.9909091\n4\
    \   0.75  0.9863636\n5   1.00  0.9909091\n6   2.00  0.9818182\n7   5.00  0.9909091\n\
    8  10.00  0.9818182\n```\n```\n\nThe lowest cost that provided the highest accuracy\
    \ was 0.5; the cost of 1 might be another good choice. Thus, the SVM model will\
    \ be applied with the *rbf* kernel and a cost of 0.5.\n\nThe final step is to\
    \ run the SVM algorithm with the chosen parameters. To generate a figure showing\
    \ the hyperplanes with sufficient detail, a series of 1000 points between FCN\
    \ 0-50 and MR 0-0.4 will be generated, and each will be classified according to\
