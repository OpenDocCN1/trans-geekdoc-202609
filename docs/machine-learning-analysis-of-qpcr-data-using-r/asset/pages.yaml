  md: "(cont.) 3′-end of ROI (unless ROI is so long that the DNA-pol cannot cover\
    \ the whole segment by the time allocated in the elongation phase). The result\
    \ is a pair of molecules with heterogeneous strand lengths (c and d). In the second\
    \ cycle of the PCR, the full-length strands of c and d serve as a template for\
    \ c and d molecules. Instead, the short strands of c and d will generate fragments\
    \ extending from the 5′-end of the reverse primer to the 3′-end of ROI (b and\
    \ e), which are still of different lengths but shorter than c and d. In the third\
    \ PCR cycle, the short strand of b and e will produce fragments extending from\
    \ the 5′-end of the forward primer to the 3′-end of the reverse primer (a). The\
    \ a molecule will be a homogeneous dsDNA fragment whose length is known in advance\
    \ due to the design of the primers and goes under the name of ‘amplicon’. Since\
    \ the DNA-pol can perfectly duplicate a within the time allocated for the amplification\
    \ phase, a will multiply under the 2″ kinetics and quickly becoming the most prevalent\
    \ molecule in the reaction vessel. In contrast, the other fragment will duplicate\
    \ linearly under the 2″ kinetics.\n\nIt is possible to compute the number of molecules\
    \ generated by PCR knowing the initial number of ROI k and the number of amplification\
    \ cycles n using the ‘reiterative loops’ dear to Mullis:\n\n```\nListing 1.1\n\
    k <- 1\nn <- 20\ntotal_number_ROI <- vector(k)\nfor (i in 1:n) {\n  total_number_ROI[i+1]\
