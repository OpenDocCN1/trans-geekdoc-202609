  md: "# Listing 3.5.\n\nThe MR and FCN values for each samples are generated by reiterating\
    \ the mrCalc function over the data stored in the validation data frame. The results\
    \ are stored into two vectors (MRs and FCNs) that are then added to the data frame\
    \ as columns MR and FCN, respectively. The data are plotted using a color-coded\
    \ as either positive (reactive) or negative (non-reactive).\n\n```\nAn alternative\
    \ to indexing way to select data from data frame is to use the function\nsubset.\
    \ Indexing is obtained with the square bracket operators as shown in listing 1.1.\n\
    The function subset simplifies the procedure using parameters for condition and\
    \ field\nselection.\nThe library lattice provides a sophisticated way to display\
    \ multivariate data. There\nare several functions to draw virtually all types\
    \ of plots, such as scatter plots\n(xyplot), barplots (barchart), and box-and-whiskers\
    \ plots (bwplot), which all have the\nsame syntax. Unlike the core R graphical\
    \ functions, the high-level and low-level elements\nare merged into the functions'\
    \ call. The explanation of lattice's graphic is extensive\nand goes beyond the\
    \ scope of the present work, thus this will be a very cursory summary.\nThe basic\
    \ call to the lattice plots is in the form y~x, but it is possible to group the\n\
    data and add an effect to the data as in y~x+2. Lattice's plots cannot be drawn\
    \ inside\na graphical device such as the function jpg; they need to be saved into\
    \ an object that\nis than called in a graphical device.\nTables are exported from\
    \ the R's environment to a stored file using the function\nwrite.table. The selection\
    \ of different separators allows to store CSV, TSV and other\ntypes of files.\n\
    subset(x, condition, select, ...)\n    x\n    data frame to subset.\n    condition\n\
    \    the logical test that specified column's values need to pass to be selected.\n\
    \    select\n    list of columns to select from the data frame.\nxyplot(y~x, group,\
    \ ...)\n    y, x\n    the coordinates of the points.\n    group\n    labeling\
    \ of the data.\nwrite.table(x, file, append, quote, sep, eol , na, dec, row.names,\
    \ col.names, ...)\n    x\n    the matrix or data frame to be written.\n    file\n\
    \    name of the file (\" \" indicates output to the console).\n    append\n \
    \   logical determining whether the data written has to be added to an existing\
    \ file\n    of the same name.\n    quote\n    logical determining whether strings\
    \ should be quoted.\n    sep\n    field separator string (default = \" \"). Use\
    \ \"\\n\" for TSV and \",\" for CSV.\n    eol\n    string to print at the end\
    \ of each line (default = \"\\n\").\n    na\n    string to use for missing values\
    \ in the data (default = \"NA\").\n    dec\n    string to use for decimal points\
    \ (default = \".\").\n    row.names, col.names\n    logical value indicating whether\
    \ the row or column names are to be written, or a\n    vector of names to be written.\n\
    ```\n\n# Listing 3.6.\n\nThe amplification data cleaned from entries missing data,\
    \ stored in the file amplificationCleand.tsv in listing 3.5, is re-loaded into\
    \ the R environment. The function callingShots allows the operator to visually\
    \ inspect the amplification plot of a given reaction, input a coded label to it\
    \ as either positive (1), negative (0), or uncertain (-1) and then move to the\
    \ next sample. The implementation of the function is as follows. It is possible\
    \ to choose the reaction number from where to start; thus, allowing the operator\
    \ to screen the data in multiple sessions. The number of reactions from where\
    \ to start is obtained from the terminal as direct input with the readline function\
