- pgno: 30
  md: 'also to provide specificity: the proper selection of the primer can makes the
    difference between a good and a bad assay. One of the most important characteristics
    of a good assay is that of specificity: the assay should give a positive result
    only if the target is present in a sample. Cross-reaction with a sequence similar
    (but not related) to the target’s will render the assay unreliable. The probability
    of identifying a stretch of n nucleotides in a genome is obtained as follows.
    First one determines the probability of identifying a binding site, K, with the
    formula (Nei and Li, 1979): K = (g/2)^{G+C} × 2^{-1}(1-g)^{A+T} where g is the
    relative frequency of G and C in the sequence, and G+C and A+T are the numbers
    of these nucleotides in the sequence. Then the actual probability n of finding
    the sequence in a given genome of length N is given by: n = DNK, where D is the
    diploidicity of the organism.


    The design of primers needs to follow some rules:


    +   - Their length should be about 20 nucleotides;

    +   - They should not contain stable hairpin structures;

    +   - They should not contain stretches of homopolymers;

    +   - They should not contain more than 50% GC nucleotides;


    +   - The melting temperature of the primers (Tₘ) should preferably be about 55°C;
    Tm can be roughly calculated by the Wallace rule (Green and Sambrook, 2019): Tₘ
    = 2(A+T) + 4(G+C), where A+T and G+C are the number of these nucleotides in the
    primer. More precise Tₘ can be obtained from specific calculators available online.

    +   - The difference in the Tₘ of the two primers should not be more than 5°C;


    +   - The 3′ of the primers should not be complementary to avoid formation of
    dimers;

    +   - The 3′ of the primers should not contain too many cgs;

    +   - The primers’ sequences should be unique for the target to avoid non-specific
    amplification.'
