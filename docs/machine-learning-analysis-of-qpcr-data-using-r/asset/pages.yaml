  img_proc: true
- pgno: 70
  md: 'In other words, reactions with low efficiency of amplification will give strongly
    positive result but reactions with too high efficiency of amplification will produce
    negative results. The implications of having an HIV result either positive or
    negative need no further explanation. Quantification of low template sample is
    not trivial, and it has been shown that samples with less than 100 copies are
    randomly amplified, in a process that is modeled by the Monte Carlo theory, resulting
    in large fluctuations in the quantification (Karrer et al., 1995). In general,
    of course, the more accurate the quantification the better. Hence, anything that
    can affect a proper quantification should be avoided.


    A plethora of analytical methods have been developed to overcome the assumptions
    of the fit-point method, for instance second derivative maximum (Luu-The et al.,
    2005), sigmoid curve fitting (Liu and Saint, 2002; Rutledge, 2004; Goll et al.,
    2006; Guescini et al., 2008, 2013) and linear regression (Ramakers et al., 2003;
    Tichopad et al., 2003). All these proved to be somehow superior to the fit-point
    method. For instance, the second derivative provided more accurate quantification
    of low template samples, albeit with a higher intercept, than the fit-point (Luu-The
    et al., 2005). Even more importantly, these alternative methods dispense the need
    to set the threshold and baseline values, implementing a user-independent method
    (Luu-The et al., 2005).


    Moreover, qPCR is changing fast due, for instance, to improvements in the processivity
    of the DNA-pol, the miniaturization of the thermal-cyclers, and the throughput
    of the assay (Csako, 2006). In particular, the throughput of qPCR has risen from
    a single tube to 96 wells per plate and, currently, to a few hundred reactions
    per plate (Kodani et al., 2011; Pripuzova et al., 2012). Plates allocating thousands
    of reactions are already available (Morrison et al., 2006; Schlesinger et al.,
    2010). The operators responsible for issuing the qPCR results are, therefore,
    facing an increased labor burden detrimental to other laboratory duties and that
    rises the risk of releasing wrong results. In other words, modern qPCR analysis
    does not only need to be as accurate as possible but also automated to screen
    thousands of reactions in the shortest time possible. In this context, qPCR data
    analysis can only be machine-assisted; hence, the analytical methods should be
    capable of integrating with some machine learning algorithms. The single value
    (Cq) produced by the fit-point method — but, for instance, also the second derivative
    method — does not allow for such integration because a single value carries very
    little information. More advanced methods are needed.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "# ***maxRatio***\n\nThe *maxRatio* algorithm has been introduced as an alternative\
    \ to the fit-point method to determine whether a reaction is truly reactive and\
    \ to produce a more reliable quantification (Shain and Clemens, 2008). The *maxRatio*\
    \ algorithm is currently included in the Abbott Molecular *m2000 RealTime System*\
    \ to identify reactive results. The *maxRatio* algorithm is computationally simple,\
    \ for it consider the ratio between the amplification signal *A* at the cycle\
    \ *n* and *n-1*:\n\n$R_n = \\frac{A_n}{A_{n-1}} - 1.$\n\n(2.7)\n\nIn absence of\
    \ amplification, the signal is constant; thus, $A_n=A_{n-1}$, $A_n/A_{n-1}=1$,\
    \ and the reduction of one unit in Equation 2.7 forces $R$ to zero. $R$ is not\
    \ only dimensionless but also self-normalized. In fact, by decomposing $A$ into\
    \ a part related to the actual amplification ($a$), and a part accounting for\
    \ noise or background ($b$), it is immediately observable that $a' b / a b = a'\
    \ / a$, where $a'$ and $a$ are the short for $a_n$ and $a_{n-1}$. The noise $b$\
    \ is equal in both the dividend and divisor because it comes from the same reaction.\
    \ Unlike the fit-point method, therefore, *maxRatio* inherently accounts for individual\
    \ amplification inhibition overcoming one of the major pitfalls of PCR quantification.\
    \ $R$ can be computed on either baseline-corrected ($\\Delta R_n$) or raw fluorescent\
    \ signal; the latter allows for a better evaluation since it does not cover-up\
    \ possible inhibition in the reaction.\n\nWhereas the qPCR amplification curve\
    \ built using the fit-point method is sigmoid, the *maxRatio* transform is Gaussian.\
    \ The following listing will prove it using data from a PCR targeting *Campylobacter\
    \ jejuni* previously analyzed by *maxRatio* (Marongiu, 2016a, 2016b).\n\n```\n\
    Listing 2.6\n```r\nmaxRatio <- function(A) {\n  n = A[2:length(A)]\n  n_minusOne\
    \ = A[1:length(A)-1]\n  R <- (n/n_minusOne) - 1\n  return(R)\n}\namp <- c(3.382,\
    \ 3.372, 3.363, 3.371, 3.383, 3.382, 3.382, 3.370, 3.352, 3.339, 3.327, 3.307,\n\
    3.291, 3.270, 3.239, 3.218, 3.199, 3.177, 3.160, 3.147, 3.136, 3.135, 3.139, 3.148,\
    \ 3.183,\n3.263, 3.410, 3.657, 4.009, 4.447, 4.911, 5.322, 5.661, 5.929, 6.140,\
    \ 6.303, 6.421, 6.515,\n6.578, 6.617, 6.658, 6.692, 6.704, 6.702, 6.693)\n```\n\
    ```"
  merge: -1
  img_proc: true
