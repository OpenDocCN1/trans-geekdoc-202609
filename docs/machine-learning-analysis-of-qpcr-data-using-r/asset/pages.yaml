- pgno: 14
  md: '# Chapter 1


    # The Role of qPCR in the Diagnosis of Diseases


    # Koch’s Postulates as Foundation of Diagnostics


    The germ theory introduced by Luis Pasteur (Casanova and Abel, 2013) has one important
    corollary: to confirm the diagnosis of an infectious disease, physicians must
    somehow recover the suspected microbial pathogen from a patient’s specimen. This
    was not always the case: many esteemed professors and medical practitioners fiercely
    rejected the theses advanced not only by Pasteur but also by, to cite just a few,
    Friederich Henle, Edwin Klebs and Robert Koch regarding the role of microbes in
    the establishment of diseases. Back in the day, the mainstream medicine favored
    the role of air and other pollutants as etiological factors (Elliott, 1870; Williams,
    1871; Burns, 2007).


    In a seminal work published in 1882, Koch wrote regarding his studies on the involvement
    of bacteria in the development of tuberculosis (Koch, 1882):


    > To prove that tuberculosis is a parasitic disease… it was necessary to isolate
    the bacilli from the body: to grow them in pure culture… and, by administering
    the isolated bacilli to animals, to reproduce the same morbid condition.


    He stressed such observations in 1890 (Koch, 1890):


    > If, however, it can be proved: First, that the parasite is met with in each
    individual case of the particular disease and under conditions which correspond
    to the pathological changes and the clinical course of the disease; secondly,
    that in no other disease is found as an accidental non-pathogenic guest; and,
    thirdly, that if completely isolated from the body and cultivated in pure cultures
    with sufficient frequency, it can reproduce the disease — then it can no longer
    be considered an accidental accompaniment.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Such proofs were designed for bacterial diseases but it became soon evident
    that not all infectious diseases could fulfill them. Koch himself had to rectify
    his statements (Koch, 1890):


    We are therefore fully warranted in affirming that if even only the first two
    requirements of the proof are fulfilled, the causal connection between parasite
    and disease is validly proved. Starting from this basis, we must admit that a
    series of diseases in which the experimental infection of animals has hitherto
    failed or been only partially successful are, in spite of this, to be regarded
    as parasitic.


    Not only are some pathogenic bacteria difficult to grow but, with the raise of
    the field of virology, researchers and physicians discovered that pathogenic microorganisms
    could not be isolated directly but needed supportive cells to be grown; the encounter
    with prions made the picture even more complicated (Rivers, 1937; Fredricks and
    Relman, 1996). The aforementioned rules were named ‘postulates’ in 1884 by one
    of most renowned of Koch’s pupils, Friederich Löffler, when presenting his results
    on the isolation of the etiological agent of diphtheria, Corynebacterium diphtheriæ
    (Walker et al., 2006; Gradmann, 2014). The Koch’s postulates can be summarized
    in the following points:


    +   - The pathogenic micro-organism must be present in all diseased hosts.

    +   - The pathogenic micro-organism must be isolated from the diseased host.

    +   - The inoculation of the isolated pathogenic micro-organism in a healthy host
    must lead to the same disease of the donor.

    +   - The pathogenic micro-organism must be re-isolated from the deceased new
    host.


    These postulates have changed several times during the years to agree with the
    newest discoveries in microbiology (Evans, 1976). For instance, with the advent
    of molecular biology, their focus passed from whole bacteria to their genetic
    sequences (Falkow, 1988):


    +   - A given phenotype should be associated with a pathology.

    +   - The specific inactivation of the gene associated with the pathogenic phenotype
    should lead to a measurable loss of the pathogenicity.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   - Allelic replacement should lead to the restoration of the pathogenic
    phenotype.


    This kind of approach even allowed to associate viral infection with several types
    of cancer (Pagano et al., 2004). A more modern definition in the microbiological
    domain takes into account the concept of dysbiosis, that is the modification of
    the prevalence of commensal species found in healthy individuals (Petersen and
    Round, 2014). In fact, the recent advancements brought forward by microbiome studies
    based on massively parallel sequencing (MPS) have shown that pathogens such as
    norovirus (referred to as pathobionts because they are simultaneously pathogens
    and symbionts) are already present in a patient but do not cause a disease under
    normal conditions (Teunis et al., 2015). It is the imbalance of the microbial
    community as a whole coupled with immunological disorders that trigger the progress
    towards disease. This view has been included into modified Koch’s postulates (Neville
    et al., 2018; Vonaesch et al., 2018):


    +   - Similar dysbiotic conditions are observed in hosts with similar health conditions.

    +   - The dysbiotic microorganisms can be retrieved from the affected hosts.

    +   - The introduction of the retrieved microorganisms in germ-free animals, in
    combination with similar diet and environment should lead to the same health condition
    of the original hosts.

    +   - The composition of the dysbiotic microorganisms remains fairly stable.


    The introduction of bacterial species associated with intestinal chronic inflammation
    into the gut of healthy mice resulted in the development of colitis in these recipients
    (Schaubeck et al., 2016). Nevertheless, the recovery of a target (either microbial
    or genetic) in a patient’s sample indicates an association between the target
    itself and the patient’s disease, but alone does not prove causation. In the 1960s,
    Austin Hill proposed a series of criteria that must be fulfilled to prove that
    a candidate pathogen causes a disease, quite extending Koch’s postulates (Hill,
    1965):


    +   - Strength. There must be a large body of circumstantial evidence (that is,
    epidemiological) demonstrating the presence of the target'
  merge: -1
  img_proc: true
- pgno: 17
  md: '(that is, a factor) and the disease, just as stated by the Koch’s postulates.


    +   - *Consistency.* The epidemiological evidence must be demonstrated by different
    people, in different regions and periods to avoid any bias. This is particularly
    important for rare diseases.

    +   - *Specificity.* The factor must be associated to a specific disease rather
    than a plethora of conditions. However, some diseases might have multiple causes
    and a given factor might cause more than one disease.

    +   - *Temporality.* The factor must precede the disease just like the cause precedes
    the effect. Hence, infection must occur before the disease, as stated by Koch.

    +   - *Gradient.* A higher exposure to a factor should be related to higher frequency
    (or worsening of the outcomes) of the disease.

    +   - *Plausibility.* The causality between exposure to a factor and the development
    of the disease must be explained by a logical model.

    +   - *Coherence.* The model should account for all the occurrences associated
    with a factor, without excluding the data that does not fit it.

    +   - *Experimentation.* The model should be tested in the laboratory to assure
    its reliability. This is particularly relevant because statistical analysis can
    provide a measurement of the strength of association but cannot proof the causality
    between factor and disease.

    +   - *Analogy.* The mode of action of a factor is usually similar to another
    factor. For instance, both oncogenic papillomavirus and JC virus impair the onco-suppressor
    p53 and both can cause cancer. These viruses encode proteins that interact with
    p53 and, although the proteins are different, they induce analogous molecular
    pathways.


    Despite the practical issues involved in the association of an etiological factor
    (either a micro-organism, a protein, or a gene) to a disease, once the link has
    been recognized, the goal of diagnostics is to identify the presence of this factor
    in people affected by a disease to begin an effective treatment. For instance,
    the diagnosis of severe atypical respiratory syndrome corona virus (SARS-CoV)
    is based on the laboratory confirmation of the presence of the viral genome in
    a specimen (Loeffelholz and Tang, 2020) and so does the diagnosis of hemorrhagic
    fever, malaria, anthrax and tuberculosis, to list just'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'a few (Sweeney et al., 2011; Long, 2015; Kaushik et al., 2016; Mukkala et al.,
    2018).


    The Koch’s definition for molecular biology is particularly relevant because it
    focuses on elements (the genetic sequences) that are relatively easy to detect.
    As mentioned, Koch himself was aware that a large group of bacteria was difficult
    to grow and isolate (these are referred to as fastidious bacteria), and the subsequent
    discoveries in virology expanded such a concern. Conversely, genetic material
    can be isolated from a sample regardless of the viability of a micro-organism.
    Furthermore, the genetic material is common to all living organisms; thus, genetic
    diseases can be included in the quest for disease diagnosis. For instance, the
    diagnosis of pathological conditions ranging from cholesterolemia to atherosclerosis
    and cancer are based on the identification of specific genetic sequences associated
    with these diseases (Stehbens, 1991; Brown and Goldstein, 1992; Garcion et al.,
    2009; Hudecova and Chiu, 2017; Sulc et al., 2020). The fact that the genetic signature
    of each species and even each individual is unique, implies that it is possible
    to establish the presence of virtually any living organism on a sample relying
    on the detection of its genome. This was a major leap for the medical and microbiological
    fields alike because it dispensed the laborious and inefficient requirements to
    grow and characterize an organism metabolically, morphologically or serologically.
    All that is needed is to recover an organism’s nucleic acids and check if the
    recovery was successful.


    # Methods to Collect Genetic Material


    Having settled that genetic material plays a central role in diagnostics, it follows
    that it needs to be identified in the specimens. Genetic material is essentially
    a synonym for nucleic acids (NAs), which are either deoxyribonucleic acids (DNA)
    or ribonucleic acids (RNA). NAs extraction from biological samples has been applied
    for almost a century and countless methods have been devised. Nonetheless, the
    working principle of this multitude of protocols is essentially the same, and
    it is achieved by four sequential steps (Ali et al., 2017).


    +   - Release. The disruption of the cellular membrane causes the release of all
    the organelles and molecules contained within the cell into the reaction medium,
    including NAs. The cell disruption can be'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'obtained by either mechanical or chemical means. The former is carried out
    by grinding, bead-beating, heath or sonication. The latter with enzymes, chaotropic
    agents (molecules that unsettle the hydrophobic structure of the lipid bilayer),
    or detergents. According to the protocol, several approaches could be used in
    combination. Once outside of the cell, NAs are easily degraded by nucleases, especially
    RNA. Thus, the extraction environment usually contains key elements to protect
    the genetic material. Cations (e.g., Na⁺) stabilize NAs by binding to their negative
    charges. Chelating agents, such as ethylendiamine-tetra-acetic acid (EDTA), remove
    ions (like Mg⁺²) that are the co-factors of nucleases. Reducing compounds such
    as β-mercaptoethanol (βMe) alter the disulfide bonds of enzymes (namely nucleases)
    inhibiting their activity. Proteases (e.g., protease K) are added to remove proteic
    structures that could sequester NAs.


    +   - *Binding.* NAs are adsorbed to solid structures such as polymers, beads
    or gels. The rest of the cellular debris will have less affinity with the solid
    structures and will be washed away. Structures containing poly-A moieties can
    specifically immobilize mRNAs.

    +   - *Cleansing.* The cellular debris generated during the disruption of the
    cells hampers the recovery of NAs. Since the different cellular components have
    different densities, centrifugation offers the easiest way to separate NAs from
    other organelles. Density gradient centrifugation (DGC) was established in the
    1950s (Meselson et al., 1957). With this method, a low molecular weight (MW) substance
    (most commonly cesium chloride, CsCl) is spun at high speed inside a test tube,
    resulting in its increasingly higher density across the length of the tube. Macro-molecules
    spun together with CsCl will distribute within this gradient in small regions
    where the centrifugal force neutralizes the density of the medium. The result
    is that a mixture of macro-molecules such as a cell lysate can be separated into
    a series of bands, each corresponding to a particular organelle. Coupling DGC
    with ethydium bromide (EtBr), a molecule that, after specifically binding to the
    DNA, emits fluorescent light allowing the specific identification of the DNA bands
    and their recovery by a syringe. DGC-EtBr had been a common laboratory procedure
    for decade. Although still in use, DGC-EtBr has been replaced by less laborious
    techniques that rely more on the next two step of the extraction procedure.'
  merge: -1
  img_proc: true
- pgno: 20
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 21
  md: 'al., 1989). These markers include radioactive isotopes (that impress photographic
    film just like light does) that have been supplanted, in more recent times, by
    fluorescent dyes or biotin. For instance, the early studies focused on demonstrating
    the presence of human papillomavirus in cervical cancer samples where based on
    the use of radioactive-marked probes purified from other cancer samples (Boshart
    et al., 1984).


    The hybridization between the target NA and a probe is an essential tool for both
    research and diagnostic. Hybridization can be carried out directly within cells
    and, if the probe has been linked to a fluorophore, the procedure is known as
    fluorescent in situ hybridization (FISH). FISH is generally assessed by microscopy,
    which is a low-throughput procedure, but its greatest problem is sensitivity for
    each cell must contain a large amount of target to produce a visible fluorescence.
    A solution to the ISH’s shortcoming is electrophoresis (Kroczek, 1993). With electrophoresis,
    the genomes from a set of cells are fractionated using either physical or chemical
    approaches. The fragments then migrate when exposed to an electric field, usually
    on poly-acrylamide matrices (but agarose is also popular) to achieve high resolution
    of the fragments. This version of electrophoresis goes under the name of PAGE.
    Urea or formamide are used to denature the NAs’ tridimentional structures, facilitating
    their migration (Summer et al., 2009; Petrov et al., 2013). The fragments are
    then stained with intercalator dyes such as EtBr. PAGE provides a series of bands
    that act as a sort of bar code (fingerprint) that can be used to specifically
    identify species. PAGE is good for small genomes such as bacterial ones, but it
    is cumbersome for human genomes. To reduce the number of bands, probes can be
    used. In this way, only the portions of the target genome that bind to the probe
    can be visualized. To improve the annealing of the probe with the target NA, the
    fragments are transferred to a nylon membrane. The probes are marked with enzymes
    to display the hybrids, and the procedure is known as either Southern (for DNA
    targets) or Northern (for RNA) blotting (Kroczek, 1993; Southern, 2000).


    Since virtually each organism has a portion of its genome that is polymorphic
    (that is, peculiar to a given species), the amplification of such regions allow
    to provide the sensitivity needed to run the digestion assay. These polymorphic
    regions are usually formed by repeat regions whose number is species-specific
    (van Belkum, 1994). For instance, bacteria such as Escherichia coli and Salmonella
    typhimurium possess the repetitive extragenic palindrome (REP) and enterobacterial
    repetitive intergenic consensus (ERIC), whereas humans carry the variable number
    tandem repeat'
  merge: -1
  img_proc: true
- pgno: 22
  md: '(VNTR) (Jeffreys et al., 1985), and microsatellite sequences (short stretches
    of nucleotides repeated thousands of times) (de la Chapelle, 2003) that allow
    to differentiate one person from another with a tremendous benefit for forensic
    sciences. Despite its improvements, even blotting might suffer from sensibility
    issues. There are two solutions to this shortcoming: either amplify the signal
    or the target.


    Let’s imagine a detection system with a sensitivity of one million arbitrary light
    units, and a probe that can emit one light unit when bound to the target. Let’s
    also imagine that there are only 10 targets in a specimen. As is, the binding
    of the probes will produce only 10 light units, thus the assay will give a negative
    result. To get a positive signal, either the signal or target itself should, somehow,
    be multiplied.


    One method to achieve signal amplification is that of annealing a linker molecule,
    containing a binding site to the ROI and several other moieties that are recognized
    by the probes. For instance, if a linker can bind 10⁵ probes, the hypothetical
    10 targets — each with one binding site for the linker — will produce one million
    light units. One of the best-known methods using this approach is branched DNA
    (bDNA) and it is used, for instance, in viral diagnostic (Wilber, 1997; Tsongalis,
    2006). The bDNA assay is run more-or-less like an ELISA and has a sensitivity
    comparable to that of PCR (Collins et al., 1997).


    Other methods to amplify the signal are based on the direct polymerization of
    probes (Yan et al., 2014) (Table 1). In this case, each target will be the template
    for the synthesis of several probes, allowing to quickly reach the threshold for
    a positive result. These enzymatic methods are carried out at the same temperature
    and are, therefore, classified as isothermal processes. One of the most popular
    is the nucleic acid sequence-based amplification (NASBA) also known as self-sustained
    sequence replication (3SR) (Deiman et al., 2002). Like PCR, NASBA uses primers.
    One contains a tail with a promoter sequence recognized by the DNA-dependent RNA-polymerase
    (DdRp) isolated from the virus T7. The primer is extended by the RNA-dependent
    DNA-polymerase (RdDp, or reverse transcriptase) isolated from the avian myeloblastosis
    virus (AMV). The nascent hybrid DNA/RNA is degraded by E. coli RNase H, which
    removes the original ssRNA and leaves the newly synthesized ssDNA. The latter
    anneals with a second primer, whose extension by the reverse transcriptase generates
    a dsDNA fragment with a complete T7-promoter sequence. This is recognized by the
    DdRp, which start transcribing new RNA molecules that become the template for
    new round of amplification. Unlike PCR, the target'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'sequences are not simply duplicated at each cycle, but they can generate several
    other molecules. Also, the amplification does not happen once each cycle (that
    is, once every minute or so), but it is continuous and the primers do not represent
    the limiting factor of the reaction as in PCR. The combination of these two factors
    implies that NASBA amplifies its target faster and at higher levels than PCR.
    Transcription mediated amplification (TMA) is similar to NASBA but uses a proprietary
    enzyme that combines reverse-transcriptase and RNase H activities (Zhao *et al.*,
    2015).


    # **Table 1.** List of the some of the most common isothermal amplification methods


    | Name | Acronym | Primers | Enzymes |

    |---|---|---:|---:|

    | Polymerase chain reaction | PCR | 2 | 1 |

    | Nucleic acid sequence-based amplification | NASBA | 2 | 3 |

    | Strand displacement amplification | SDA | 4 | 2 |

    | Loop-mediated amplification | LAMP | 4 | 1 |

    | Rolling circle amplification | RCA | 2 | 2 |

    | Helicase-dependent amplification | HDA | 2 | 2 |

    | Recombinase polymerase amplification | RPA | 2 | 2 |

    | Exponential amplification reaction | EXPAR | 0 | 2 |

    | Whole genome amplification | WGA | 0 | 1 |


    PCR is also listed for comparison.


    Another popular isothermal method is loop-mediated amplification (LAMP) (Notomi
    *et al.*, 2015). This method requires the knowledge of six loci on the target
    DNA. Let’s indicate these loci with the letters A to F. A-B-C and D-E-F are upstream
    and downstream, respectively, of the ROI; the complementary sequences can be represented
    by A-F. A first primer (forward inner primer, FIP) bears the sequences 5′-C̄B-3′
    and hybridizes on B by strand invasion; thus, there is no need to melt the DNA
    as a preliminary step as in PCR. This primer is extended by a DNA-pol generating
    a fragment (C̄B̄C-ROI-D̄ĒF). The newly generated strand is displaced by the addition
    of an outer primer with the sequence A. The C and C̄ loci of the displaced strand
    hybridize together forming a 5′ loop. The same process occurs at the loci D-F
    with the backwards internal (BIP, bearing ĒD) and backwards external (bearing
    F) primers. The end-result of this process is the so-called LAMP dumbbell structure,
    a single-stranded filament with the loops C̄B̄C and DĒD̄ that hybridizes with
    both FIP and BIP. The extension of these primers generates concatamers with even
    more recognition loci, so that'
  merge: -1
  img_proc: true
- pgno: 24
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 25
  md: 'operator will define a ROI and use its presence as a surrogate for the actual
    isolation, growth and characterization of this bacterium. The PCR will then proceed
    into three reiterated stages (Figure 1.1A). The first stage will rise the reaction’s
    temperature to about 95°C, melting the double stranded DNA (dsDNA) and making
    it available to further use. The second stage will cool the reaction mixture to
    about 50°C, permitting the preferential annealing of short synthetic oligonucleotides
    to the ROI. A short period (about 10 s) will instead favor the annealing of shorts
    stretches of DNA. The annealing process (that is, the opposite of melting) is
    regulated by a constant rate *k* defined as (Wetmur, 1991): *k* = *k*<sub>N</sub>*L*<sub>S</sub><sup>−1/2</sup>*N*<sup>−1</sup>,
    where *L*<sub>S</sub> is the shortest length of the chains, *N* is the complexity
    of the sequence (a measure of the absence of repetitive stretches of nucleotides)
    an *k*<sub>N</sub> is the nucleation rate. From the equation, it can be seen that
    long chains take longer to anneal than short nucleotides. For instance, let’s
    continue in the hypothetical analysis of *E. coli*, which has a genome of 4.6
    million bases (Mb) (Blattner *et al.*, 1997). Let’s assume to have a primer of
    20 nucleotides. Since *k*<sub>N</sub> and *N* are the same for both the primer
    and the genome, it is possible to simplify the annealing rate equation using the
    constant α = *k*<sub>N</sub>*N*<sup>−1</sup>, so that the kinetics of annealing
    time for the whole genome will be α√4 639 221 = α2153.9, whereas that of the primer
    will be α√20 = α4.5. In other words, the primer will anneal 482 times faster than
    the whole genome.


    Raising again the temperature to about 60°C will optimize the processivity (defined
    as the probability of continuing the extension of the primer without detaching
    from the template (Pavlov *et al.*, 2004)) of the DNA-pol. Each DNA-pol will have
    a specific optimal temperature. The result is that, with these three steps, the
    DNA-pol would have duplicated the ROI, hence the importance of the ‘powers of
    two’. When the polymerase works with 100% processivity (100% efficiency), each
    copy of ROI is amplified at each cycle and the kinetics of PCR follows the rule
    2ⁿ, where *n* is the number of cycles the procedure has been run for. At the end
    of the procedure, there will be a mix of NA products each containing a ROI (Figure
    1-1B). Since the PCR extends the primers until the end of the template’s strand,
    the newly synthesized strands will be shorter than the original segment. The most
    abundant NA species will be that extending from the forward to the reverse primers:
    this will have an exact length defined by the primer design and goes under the
    name of ‘amplicon’.'
