  md: 'More in detail, the listing shows that the two groups are clustered away one
    another with sufficient breath, allowing their separation by a straight line (Figure
    3.3). The identification of the line was done by visual inspection of the plot
    as follows. By observing that a line pointing at an intercept of 0.32 MR could
    split the data in two groups, it is possible to identify a possible slope. Since
    the difference in MR values passed from about 0.20 at FCN = 20 to 0.29 at FCN
    = 10, it was possible to estimate the slope of the separating line as Δy/Δx =
    −0.09/10 = −0.009. Further adjustment by trial and error identified the values
    used in the example. Further data exploration allowed the selection of suitable
    support vectors (s1-s6).


    ![](img/7ea01e6937e09d043e45c73fff9eaed3_93_0.png)


    Figure 3.3. Overview of the support vector machine procedure. The support vector
    machine (SVM) is a supervised learning model, which means that it must run on
    pre-classified groups. There were two groups in this case: A (●) and B (○). The
    algorithm (kernel) finds a separation line between the groups known as a hyperplane
    (thick line) that maximizes the allocation of samples within their original group.
    In this case, the hyperplane divides the plot into two parts (upper and lower),
    locating the most elements of group A in the upper part of the plot and the most
    elements of group B in the lower part of the plot. To reduce computing labor,
    the kernel uses only a subset of the elements known as support vectors (highlighted
    here by squares). Therefore, the procedure reduces to the minimization of the
    distances between the hyperplane and the support vectors (dotted lines), akin
    to regression analysis. The model also provides for some flexibility in the classification
    process, which means that the items within the margins (dashed lines) are ignored
    during the classification process. The end product of the SVM analysis is that
    the points above the hyperplane will be classified as belonging to group A. Conversely,
    those below will be placed into group A.'
