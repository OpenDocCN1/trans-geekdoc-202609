    A new directory data is created to store in an ordered way the files that will
    be required for the k-mean classification. The analysis is limited to the reactions
    where the raters agreed, which is obtained by indexing the data frame so that
    the uncertain reactions are excluded (df$label != "Uncertain"). The k-mean validation
    is obtained by generating 10 sets of data frames, stored in the new folder data.
