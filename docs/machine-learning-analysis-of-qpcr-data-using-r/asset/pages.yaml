    \    4     8    16    32    64   128   256   512\n[11]  1024  2048  4096  8192\
    \ 16384 32768 65536 131072 262144 524288\n[20] 1048576\n\nprint(2^20)\n\n[1] 1048576\n\
    ```\n\nThe last value, 1 048 576, is the same as 2^20 and represents the ROI’s\
    \ copies generated in the procedure. This means that, if there were only one E.\
