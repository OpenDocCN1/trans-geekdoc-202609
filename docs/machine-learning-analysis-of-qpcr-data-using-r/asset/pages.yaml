    instantiated and a repository array total_number_ROI, which is populated with
    k. New array''s elements are assigned to the vector through a for loop, so that
    the final array will have n elements. Each array''s element (apart the first)
    will contain the square of the previous element. The array''s elements are access
    by their indices indicated by a number enclosed in squared brackets. The elements
    of the array are printed on screen with the function print.


    Variables can be instantiated directly with the assignment symbol ''<-'' that
    is equivalent to ''='' in other languages (and working also in R).

    R calls vectors what in other languages are called ''arrays'': collections of
    several values.

    Vectors are then, in R, uni-dimensional. A matrix is a two-dimensional vector.

    An array is a three-dimensional or multi-dimensional vector.

    An empty vector can be instantiated with the function vector(), likewise for matrices
    (matrix()), and arrays (array()). Populated vectors are instantiated by concatenating
    different elements; the concatenating function in R is c(). Matrices and arrays
    need additional information regarding their dimensions.

    ```'
