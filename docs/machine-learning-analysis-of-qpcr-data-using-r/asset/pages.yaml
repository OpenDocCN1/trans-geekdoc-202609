  md: 'screened daily. A procedure that could dispense with the majority of these
    reactions would be an improvement for the operator and the value of maxRatio becomes
    evident.


    Nevertheless, the EM approach to filtering maxRatio has some pitfalls:


    +   - The choice of the FCN threshold is still objective.

    +   - The use of two MR thresholds (and one FCN threshold) is confusing and inelegant.

    +   - The definition of further subclasses (such as weak positives) is complicated
    to design and remains subjective.


    # Filtering maxRatio with Support-Vector Machine


    Support-vector machines (SVM) are supervised learning models used for classification
    and regression analysis as part of machine learning algorithms. SVM was developed
    at AT&T Bell Laboratories by Vladimir Vapnik and colleagues between 1960s and
    the 1990s (Cortes and Vapnik, 1995). SVM, in essence, finds a separation line
    (‘maximum margin hyperplane’ or simply hyperplane) between groups of samples known
    as items or elements. Linearly separable groups are non-overlapping groups. The
    SVM algorithm finds the hyperplane with the greatest degree of separation between
    the groups, meaning that the least number of elements from one group will be re-classified
    in the other group. Instead of using all elements from each group, SVM uses a
    subset of items closest to the hyperplane, which reduces the procedure’s complexity
    and computational requirements. When the groups are not linearly separable, SVM
    applies ‘margins’: some of the elements in proximity of the hyperplane are allowed
    to be clustered in the opposite group. The proportion of samples that can be ‘misclassified’
    is defined by a cost parameter C, corresponding to the width of the margins around
    the hyperplane. The following section will describe the SVM algorithm more in
    detail.


    To use the example given in the previous section, samples stratified according
    to the EM-derived thresholds will be assigned to either group A or B. This initial
    classification designate the term ‘supervised’: the operator supervises the procedure
    by assigning labels to each element; the machine, then, will improve the classification
    based on some algorithm. Supervised learning approaches are opposed to the ‘unsupervised’
    models (such as neural networks and hierarchical clustering), which do not require
    any'
