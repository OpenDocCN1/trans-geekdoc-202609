    \ for each target and test them even in combination.\n\n# Elements of Quantification\n\
    \nThe qPCR does not directly count the molecules present in a sample, but instead\
    \ allows one to estimate such number by associating the light produced by a sample\
    \ with the copies of the target. Such association can be either absolute or relative.\
    \ Absolute quantification provides an actual copy number (or load) of the target\
    \ whereas the relative quantification gives the ratio between the target and a\
    \ reference. Specifically, indicating with ΔCqS the difference between the Cq\
    \ of the sample and a reference target, respectively, and ΔCqC the difference\
    \ between the Cq of the calibrator and a reference target, respectively, it is\
    \ possible to obtain the normalized expression ratio R_S between sample and calibrator\
    \ (an untreated sample) (Livak and Schmittgen, 2001; Green and Sambrook, 2018):"
