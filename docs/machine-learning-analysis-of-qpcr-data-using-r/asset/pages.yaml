- pgno: 66
  md: 'Figure 2.3 shows that the PCRs have efficiencies evenly distributed above and
    below the mean, with some beyond the boundaries of one standard deviation from
    the mean. The few reactions with efficiencies beyond the boundaries of two standard
    deviations from the mean should be flagged and repeated.


    As for any diagnostic assay, there is also the need to evaluate the effectiveness
    of qPCR using a series of performance parameters (Fardy, 2009; Kralik and Ricchi,
    2017). The limit of detection (or analytical sensitivity) is defined as the minimal
    concentration of sample that provides a success rate of 95%. For instance, in
    the setup of a qPCR assay targeting HPV-16 (Marongiu et al., 2014a), a standard
    dilution (range 10⁰-10⁵ c/µL) was tested 37 times and all reactions with an initial
    input above 10 c/µL gave a reactive result. Conversely, only 32 samples with an
    initial concentration of 10⁰ c/µL were positive. By using logistic regression,
    it was found that the limit of detection (LOD) was 1.7 c/µL (Marongiu et al.,
    2014b). The following listing will replicate such an instance (Figure 2.4).


    ![](img/7ea01e6937e09d043e45c73fff9eaed3_66_0.png)


    Figure 2.4. PCR limit of detection. The proportion of amplification success is
    plotted against the concentration of a set of samples, and logistic regression
    is applied. The LOD is computed by setting a level to the proportion of success,
    95% (horizontal line). Regression allows determining the concentration that reaches
    this level (vertical line), in this case 1.7 c/µL.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Listing 2.5\n\n```\ndf <- data.frame(concentration = c(1, 10, 100, 1000,\
    \ 10000), positivity = c(0.864, 1, 1, 1, 1))\nmodel <- glm(positivity~concentration,\
    \ family = binomial(link = \"logit\"), data=df)\nlibrary(MASS)\nlod <- dose.p(model,p=.95)\n\
    newdata <- data.frame(concentration=seq(min(df$concentration), max(df$concentration),by=0.01))\n\
    newdata$positivity = predict(model, newdata, type=\"response\")\nplot(positivity\
    \ ~ concentration, data = df, log = \"x\",\n    xlab=expression(bold(paste(\"\
    Concentration (c(\", mu, \"L)\"))),\n    ylab=expression(bold(\"Proportion of\
    \ positivity\")))\nabline(h=0.95, lty=3)\nabline(v=lod, lty=3)\npoints(positivity\
    \ ~ concentration, data = newdata, type=\"l\")\ntext(lod+0.4, 0.861, labels =\
    \ round(lod, 1), cex = 0.9)\n```\n\nWhile the LOD is valid for both end-point\
    \ PCR and qPCR, the latter should also be associated with a limit of quantification\
    \ (LOQ), which is defined as the lowest concentration that gives a CV below 25%.\
    \ Other parameters include the definition of false negative (FN), false positive\
    \ (FP), true negative (TN), and true positive (TP) reactions, based on the comparison\
    \ between qPCR and a gold standard that gives a trusted result. The diagnostic\
    \ sensitivity provides the probability that the qPCR will correctly classify as\
    \ reactive the positive samples and can be calculated as TP/(TP+FN). Conversely,\
    \ the diagnostic specificity provides the probability that the qPCR will correctly\
    \ classify as non-reactive the negative samples, and can be calculated as TN/(TN+FP).\
    \ The diagnostic sensitivity and specificity should not be confused with the analytical\
    \ sensitivity (LOD) and specificity (the capability of an assay to react only\
    \ with the target of choice). Moreover, the accuracy of the qPCR is defined as\
    \ the probability of correctly classifying the samples: (TP+TN)/(TP+TN+FP+FN).\n\
    \nThe precision of the qPCR is based upon repeatability and reproducibility; the\
    \ former is further subdivided into intra-assay and inter-assay repeatability.\
    \ The intra-assay repeatability indicates the rate of variation between replicates\
    \ within the same qPCR plate, and the inter-assay repeatability indicates the\
    \ rate of variation between several qPCR plates. The repeatability is defined\
    \ as the CV of each dilution and at least 15 replicates should be run. The reproducibility\
    \ is similar to repeatability but it is performed on different laboratories, often\
    \ even with different thermal-cyclers and chemistry — in which case it also indicates\
    \ the robustness of the assay."
  merge: -1
  img_proc: true
- pgno: 68
  md: 'To account for all the characteristics that define a given qPCR assay and allow
    a direct comparison among different assays, a minimum information for publication
    of quantitative real-time PCR experiments (MIQE) is required — although not yet
    widely adopted (Bustin et al., 2009). Such information include not only the primers’
    sequences but also many of the parameters listed in this section.


    # The Issues of the Fit-Point Method


    The fit-point is intuitive and easy to implement. Nevertheless, despite its wide
    application, the fit-point method suffers from some drawbacks (Yang and Rothman,
    2004). It assumes, for instance, that the efficiency of amplification is the same
    between the different reactions and constant throughout the course of the assay
    (Liu and Saint, 2002b). Even small differences in amplification efficiency can
    lead to tremendous errors in quantification that are oblivious to the fit-point
    method (Rutledge, 2004). Furthermore, Equation 2.5 and 2.6 hold only when the
    efficiency is kept constant (Rutledge and Côté, 2003).


    To give an idea of the error in measurement, let’s calculate the initial copy
    numbers of a certain ROI under different values of amplification efficiency. From
    Equation 4, the initial copy numbers are linked to the copy number at a certain
    amplification cycle in a way that is dependent of the efficiency of amplification:
    log(N0) = log(Nt) − log(E+1)Cq. Based on the preceding example, let’s assume that
    10⁶ ROI copies where reached at Cq = 9.96, and let’s calculate N0 for efficiencies
    of 100, 75, 50, and 25 percent:


    ```

    Nt <- 1000000


    Cq <- 9.96


    E <- c(1.000, 0.999, 0.990, 0.900, 1.100)


    log_N0 <- -((log(E+1)*Cq)+log(Nt))


    N0 <- 10^log_N0


    R0 <- N0/N0[1]


    percent_increase <- round(100 * ((N0-N0[1])/abs(N0[1])), 3)

    ```'
  merge: -1
  img_proc: true
