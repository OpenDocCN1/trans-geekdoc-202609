    # Figure 1.1. Overview of the amplification reaction.


    The PCR selectively amplifies a region of interest (ROI) of a nucleic acid. A.
    The PCR cycling conditions. A double-stranded DNA (dsDNA) is denatured by increasing
    the reaction temperature to about 95°C (melting). The thermal-cycler then reduces
    the reaction’s temperature to about 56°C allowing synthetic oligonucleotides (primers)
    to anneal to a selected locus within ROI (annealing). The actual annealing temperature
    depends on the characteristics of the primers ta hand. The temperature is raised
    again to about 60°C (elongation). This temperature matches the optimum for the
    DNA-dependent DNA-polymerase (DNA-pol for short) present in the reaction vessel
    and depends on the chosen enzyme. B. The PCR produces several types of DNA fragments
    with different abundances. The initial ROI, a dsDNA, is depicted at the top of
    the panel. During the first cycle of amplification, the two strands of the ROI
    are separated and duplicated. The newly synthesized strands extend from the 5`-end
    of the forward primer to the'
