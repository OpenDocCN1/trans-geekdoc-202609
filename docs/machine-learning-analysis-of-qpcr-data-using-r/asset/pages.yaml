    of each PCR run over time, it is possible to determine whether a specific run
    has been affected by amplification problems. The abscissa can either consider
    the date of the run or an index of the run (as in this case). The mean of the
    efficiency is plotted (solid line) together with one (dashed lines) and two (dotted
    lines) standard deviations (SD) from the mean. It is evident how the majority
    of the data lies within one SD from the mean, with the efficiencies being evenly
    distributed above and below the mean. In two occurrences, the efficiency lies
    above (gray dot) and below (black dot) the 2SD boundaries. These two runs should
    be carried out again.'
