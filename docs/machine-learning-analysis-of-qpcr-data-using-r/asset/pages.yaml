  md: 'The data frame validation has a new set of columns derived from the results
    provided by the raters (rater_1, rater_2, in this case). A new column agreed is
    created by comparing the values of the different raters. If all the rates across
    the different rating columns are the same, a label of value equal to the agreed
    rate (1 or 0) is given, otherwise -1. The data with the agreement label 1 are
    plotted and those with label 0 are drawn on top of them. The entries are stratified
    by factor.


