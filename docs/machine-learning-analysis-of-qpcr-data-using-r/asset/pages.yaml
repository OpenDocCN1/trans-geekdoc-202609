- pgno: 55
  md: 'R_S = E^{-ΔΔCq}. (2.1a)


    where ΔΔCq = ΔCqs – ΔCqC, and E = 2. Using the E. coli O:157 example, let’s assume
    that the Cq of a sample treated for instance with UV irradiation to activate the
    expression of Stx2 (Yue et al., 2012) is 18 cycles. The Cq of the untreated sample
    is 24 and that of the reference gene is 22. It follows that ΔCqs is –4 cycles,
    ΔCqC is 2 cycles, and ΔΔCq is –6. Subsequently, R_S is 2^(-6) = 2^6 = 64; thus,
    the expression of Stx2 in UV-treated samples is 64 times that in the untreated
    cells.


    Equation 2.1a is equivalent to (Pfaffl, 2001):


    R_S = E_S^{ΔCq_s}/E_R^{ΔCq_c}. (2.1b)


    Equation 2.1b takes into account the actual efficiency of amplification of the
    PCR. On the other hand, absolute quantification aims at calculating the actual
    number of target molecules in a given sample and its procedure will be described
    in the following paragraphs. In both absolute and relative quantification, though,
    light emission is converted into a digital value. There are two main systems for
    extracting light emission from vessels:


    +   - Take a snapshot of all the reactions at once at each amplification cycle
    and then extrapolate the emission from each reaction. The PCR is typically carried
    out in a 96-well plate with conical bottom-wells; the optical apparatus takes
    a single picture of the top of the plate. The software then processes the fluorescence
    signal from each well.

    +   - Record the light produced by each reaction independently. This is accomplished
    by placing the reaction vessels on a carousel that passes, at each rotation, in
    front of a laser optical apparatus. This system is commercialized as Rotor-gene™
    by Qiagen and LightCycler™ by Roche.


    In both cases, the end result is a table of numbers referring to the light emission
    of each sample at each amplification cycle. It should be kept in mind that the
    reported molecules (either probes or intercalators) increased their luminescence
    when in contact with the amplicons — either because they actually bind the DNA
    or because the DNA-pol has released the fluorophore. On the other hand, however,
    they emit light even when not in contact with the amplicons. For instance, SYBR
    Green™ increase its'
