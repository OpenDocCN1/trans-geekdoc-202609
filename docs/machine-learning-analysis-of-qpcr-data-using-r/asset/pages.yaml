- pgno: 108
  md: "The SVM model is carried out with the function ksvm by passing the outcome\
    \ field as a function of both MR and FCN (Figure 3.6). The procedure will be run\
    \ for classification purposes (type = C-svc) — although it could be used also\
    \ for regression and novelty detection — the kernel trick will be the Gaussian\
    \ algorithm (kernel = “rbfdot”) with parameters automatically set for it (kpar\
    \ = “automatic”), the cost of constraints violation (C) is set to 1, and the modeling\
    \ will calculate class probabilities. It is also possible to plot the resulting\
    \ model with the function plot.\n\n```\nListing 3.8\nlibrary(kernlab)\nmod = ksvm(outcome\
    \ ~ MR+FCN, data = train_set,\n    type = \"C-svc\", kernel = \"rbfdot\", kpar\
    \ = \"automatic\", C = 1, prob.model = TRUE)\n    plot(mod, data = train_set)\n\
    pred_prob = predict(mod, test_set, type = \"probabilities\")\nprediction = predict(mod,\
    \ test_set)\nserial = test_set$Index\nrating= test_set$Outcome\nOUT = data.frame(serial,\
    \ rating, prediction, stringsAsFactors = FALSE)\n```\n\nThe model is applied classify\
    \ the test set’s reactions. Specifically, a data frame is created containing the\
    \ serial numbers of the testing reactions with their assigned label (‘rating’)\
    \ and their predicted values (‘prediction’). The parameters of the assignment\
    \ are saved into specific vectors.\n\n```\nTP = nrow(subset(OUT, rating == \"\
    positive\" & prediction == \"positive\"))\nTN = nrow(subset(OUT, rating == \"\
    negative\" & prediction == \"negative\"))\nFP = nrow(subset(OUT, rating == \"\
    negative\" & prediction == \"positive\"))\nFN = nrow(subset(OUT, rating == \"\
    positive\" & prediction == \"negative\"))\nACC = (TP + TN) / (TP + TN + FP + FN)\n\
    > head(OUT)\n    serial    rating    prediction\n1    8       positive   positive\n\
    2    10      positive   positive\n3    13      positive   negative\n4    77  \
    \    negative   negative\n5    84      positive   negative\n6    87      negative\
    \   negative\n> ACC\n[1] 0.7083333\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "The diagnostic accuracy is only 70.8%, but one must consider that, in the case\
    \ under evaluation, the separation between reactive and non reactive reactions\
    \ is not clear cut, as demonstrated in the inspection of the data given in the\
    \ previous paragraphs.\n\nThe tuning step will iterate through the training and\
    \ testing data frames defined before once to selected what kernel trick (Gaussian,\
    \ Bessel, or Laplacian) provided the highest accuracy. A data frame will contain\
    \ the parameters and the resulting diagnostic accuracy, providing the result through\
    \ aggregation.\n\n```\nListing 3.9\nkernel_list = c(\"rbfdot\", \"besseldot\"\
    , \"laplacedot\")\naccuracy_result = data.frame(Set = numeric(), Kernel = character(),\
    \ Accuracy = numeric())\nfor (i in 1:10) {\n    print(i)\n    train_ids = readRDS(paste(\"\
    data/trainSet_\", i, \".rds\", sep = \"\"))\n    test_ids = readRDS(paste(\"data/testSet_\"\
    , i, \".rds\", sep = \"\"))\n    train_set = validation[validation$Index %in%\
    \ train_ids,]\n    test_set = validation[validation$Index %in% test_ids,]\n  \
    \  train_set$Outcome <- ifelse(is.na(train_set$FAM) == TRUE, \"negative\", \"\
    positive\")\n    test_set$Outcome <- ifelse(is.na(test_set$FAM) == TRUE, \"negative\"\
    , \"positive\")\n    train_set$Outcome <- as.factor(train_set$Outcome)\n    test_set$Outcome\
    \ <- as.factor(test_set$Outcome)\n    for (k in kernel_list) {\n        mod =\
    \ ksvm(outcome ~ MR+FCN, data = train_set,\n            type = \"C-svc\", kernel\
    \ = k, kpar = \"automatic\", C = 1, prob.model = TRUE)\n        pred_prob = predict(mod,\
    \ test_set, type = \"probabilities\")\n        prediction = predict(mod, test_set)\n\
    \        serial = test_set$Index\n        rating = test_set$Outcome\n        OUT\
    \ = data.frame(serial, rating, prediction, stringsAsFactors = FALSE)\n       \
    \ TP = nrow(subset(OUT, rating == \"positive\" & prediction == \"positive\"))\n\
    \        TN = nrow(subset(OUT, rating == \"negative\" & prediction == \"negative\"\
    ))\n        FP = nrow(subset(OUT, rating == \"negative\" & prediction == \"positive\"\
    ))\n        FN = nrow(subset(OUT, rating == \"positive\" & prediction == \"negative\"\
    ))\n        ACC = (TP + TN) / (TP + TN + FP + FN)\n        results = data.frame(Set\
    \ = i, Kernel = k, Accuracy = ACC)\n        accuracy_result = rbind(accuracy_result,\
    \ results)\n    }\n}\nfinal_results <- aggregate(Accuracy ~ Kernel, accuracy_result,\
    \ mean)\n```"
  merge: -1
  img_proc: true
- pgno: 110
  md: "```\n> final_results\n\n    Kernel  Accuracy\n\n1  besseldot  0.9545455\n\n\
    2  laplacedot  0.9727273\n\n3  rbfdot  0.9909091\n```\n\nThe rbf kernel proved\
    \ to be the best choices for the data under evaluation. The procedure is repeated\
    \ for the selection of the C parameter from a range of values.\n\n```\nListing\
    \ 3.9 (continuation)\ncost_list = c(0.01, 0.1, 0.5, 1, 10)\naccuracy_result =\
    \ data.frame(Set = numeric(), Cost = numeric(), Accuracy = numeric())\nfor (i\
