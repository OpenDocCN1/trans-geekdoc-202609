    # Listing 2.3.


    The cycles above the chosen cut-off of 1000 light units are retrieved from the
    fluorescence signal of the high-input sample; the first value of the series is
    saved in the variable crossOverH. A blow-up of the amplification profile of this
    sample is plotted together with the cut-off line. The amplification points before
    and after the cut-off line are also plotted, corresponding to crossOverH and crossOverH
    – 1. The Cq is visually determined on the intersection between the amplification
    curve and the cut-off line, and the value store in the variable cq_high. The procedure
    is repeated for the low-input sample. In the continuation of the listing, the
    copy numbers are calculated and the standard curve is plotted alongside the two
    samples. Arrows are used to show the interpolation that allows the quantification
    of the unknown samples.


