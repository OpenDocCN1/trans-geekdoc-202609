    \ Furthermore, Equations 2.5 and 2.6 hold only when the efficiency is kept constant\
    \ (Rutledge and Côté, 2003).\n\nTo give an idea of the error in measurement, let’s\
    \ calculate the initial copy numbers of a certain ROI under different values of\
    \ amplification efficiency. From Equation 4, the initial copy numbers are linked\
    \ to the copy number at a certain amplification cycle in a way that is dependent\
