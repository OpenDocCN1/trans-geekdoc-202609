    这种证明最初是为细菌性疾病设计的，但很快就显而易见，并非所有传染病都能满足这些要求。科赫本人不得不修正自己的论述（Koch, 1890）：


    因此我们可以完全断定，如果仅满足证明的前两个要求，寄生虫与疾病之间的因果联系就被有效证明了。基于此，我们必须承认，尽管动物实验感染迄今为止失败或仅部分成功，但有一系列疾病仍应被视为寄生性疾病。


    不仅一些致病细菌难以培养，而且随着病毒学领域的兴起，研究人员和医生发现致病微生物不能直接分离培养，需要支持细胞才能生长；朊粒的出现使情况变得更加复杂（Rivers,
    1937; Fredricks and Relman, 1996）。上述规则在1884年由科赫最著名的学生之一弗里德里希·勒夫勒（Friedrich Löffler）在介绍其关于白喉病原体分离结果时命名为‘postulates’，白喉病原体为白喉棒状杆菌
    Corynebacterium diphtheriæ（Walker et al., 2006; Gradmann, 2014）。Koch''s postulates
    可概括为以下几点：


    - 致病微生物必须存在于所有患病宿主中。

    - 致病微生物必须从患病宿主中分离出来。

    - 将分离出的致病微生物接种到健康宿主中必须导致与供体相同的疾病。

    - 致病微生物必须从新死亡的宿主中重新分离出来。


    这些假说在多年间多次改变，以适应微生物学最新发现（Evans, 1976）。例如，随着分子生物学的兴起，其焦点从完整的细菌转向了它们的基因序列（Falkow,
    1988）：


    - 某一特定表型应与某种病理相关联。

    - 与致病表型相关的基因的特异性失活应导致致病性可测量的丧失。

    - 等位基因替换应导致致病表型的恢复。


    这种方法甚至允许将病毒感染与多种类型的癌症联系起来（Pagano et al., 2004）。微生物学领域更现代的定义考虑到了菌群失调的概念，即在健康个体中发现的共生物种丰度的改变（Petersen
    and Round, 2014）。事实上，基于大规模平行测序（MPS）的微生物组研究带来的最新进展表明，像诺如病毒这样的病原体（被称为病原共生体，因为它们同时是病原体和共生体）已存在于患者体内，但在正常条件下并不引起疾病。正是整个微生物群落的失衡加上免疫紊乱触发了疾病进展。这一观点已被纳入改良的科赫假说（Neville
    et al., 2018; Vonaesch et al., 2018）：


    - 在健康状况相似的宿主中观察到相似的菌群失调状况。

    - 失调微生物可以从受影响的宿主中获取。

    - 将获取的微生物引入无菌动物，结合相似的饮食和环境，应导致与原始宿主相同的健康状况。

    - 失调微生物的组成保持相对稳定。


    将与肠道慢性炎症相关的细菌物种引入健康小鼠的肠道，导致这些受体出现结肠炎（Schaubeck et al., 2016）。尽管如此，在患者样本中回收目标（无论是微生物还是遗传）仅表明目标本身与患者疾病之间的关联，但单独并不能证明因果关系。在20世纪60年代，奥斯汀·希尔（Austin
    Hill）提出了一系列必须满足的标准，以证明候选病原体导致疾病，这在很大程度上扩展了科赫假说（Hill, 1965）：


    - Strength. 必须有大量间接证据（即流行病学证据）证明目标（即因素）和疾病的存在，正如科赫假说所述。

    - *Consistency.* 流行病学证据必须由不同的人在不同地区和时期证明，以避免任何偏倚。这对于罕见疾病尤其重要。

    - *Specificity.* 因素必须与特定疾病相关联，而非多种状况。然而，一些疾病可能有多重原因，且某一因素可能导致一种以上疾病。

    - *Temporality.* 因素必须先于疾病出现，正如原因先于结果。因此感染必须在疾病之前发生，正如科赫所述。

    - *Gradient.* 对因素的更高暴露应与疾病更高频率（或结局恶化）相关。

    - *Plausibility.* 因素暴露与疾病发展之间的因果关系必须由逻辑模型解释。

    - *Coherence.* 模型应解释与因素相关的所有现象，而不排除不符合的数据。

    - *Experimentation.* 模型应在实验室中进行测试以确保其可靠性。这尤其相关，因为统计分析可以提供关联强度的测量，但不能证明因素与疾病之间的因果关系。

    - *Analogy.* 因素的作用模式通常与另一因素相似。例如，致癌人乳头瘤病毒和JC病毒都会损害抑癌基因p53，并且都可导致癌症。这些病毒编码与p53相互作用的蛋白，尽管蛋白不同，但它们诱导类似的分子通路。


    尽管将病因因素（无论是微生物、蛋白质还是基因）与疾病关联存在实际问题，一旦联系被确认，诊断的目标就是识别受疾病影响人群中该因素的存在，以便开始有效治疗。例如，严重急性呼吸综合征冠状病毒（SARS-CoV）的诊断基于标本中病毒基因组存在的实验室确认，同样，出血热、疟疾、炭疽和结核病的诊断也是如此，仅举几例（Sweeney
    et al., 2011; Long, 2015; Kaushik et al., 2016; Mukkala et al., 2018）。


    Koch''s definition for molecular biology 特别相关，因为它关注的是相对易于检测的元素（基因序列）。如前所述，科赫本人就意识到一大类细菌难以培养和分离（这些被称为
    fastidious bacteria），而病毒学后续的发现扩大了这种担忧。相反，遗传物质可以从样本中分离出来，而不依赖微生物的活力。此外，遗传物质是所有生物共有的；因此，遗传病也可以纳入疾病诊断的探索中。例如，从高胆固醇血症到动脉粥样硬化和癌症等病理状况的诊断，均基于与这些疾病相关的特定基因序列的鉴定（Stehbens,
    1991; Brown and Goldstein, 1992; Garcion et al., 2009; Hudecova and Chiu, 2017;
    Sulc et al., 2020）。每个物种甚至每个个体的遗传特征都是独一无二的这一事实意味着，可以通过检测其基因组来确定样本中几乎任何活生物的存在。这对医学和微生物学领域来说都是一个重大飞跃，因为它省去了繁琐且效率低下的培养和代谢、形态或血清学表征生物体的要求。所需要做的只是回收生物体的核酸并检查回收是否成功。


