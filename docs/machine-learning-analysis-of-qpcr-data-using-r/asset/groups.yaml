  mdcn: "\n为了涵盖定义特定qPCR检测的所有特征，并允许在不同检测间直接比较，需要满足定量实时PCR实验发表的最低信息（MIQE）要求——尽管尚未被广泛采用（Bustin等，2009）。这些信息不仅包括引物序列，还包括本节列出的许多参数。\n\
    \n## 拟合点法的问题\n\n拟合点法直观且易于实现。然而，尽管应用广泛，拟合点法仍存在一些缺陷（Yang和Rothman，2004）。例如，它假设不同反应之间的扩增效率相同，并在整个检测过程中保持恒定（Liu和Saint，2002b）。即使是扩增效率的微小差异也可能导致巨大的定量误差，而这些误差是拟合点法所无法察觉的（Rutledge，2004）。此外，公式2.5和2.6仅在效率保持恒定时才成立（Rutledge和Côté，2003）。\n\
    \n为了直观地说明测量误差，让我们计算某个目标区域（ROI）在不同扩增效率下的初始拷贝数。由公式4可知，初始拷贝数与特定扩增循环时的拷贝数相关联，其关联方式取决于扩增效率：log(N0)\
    \ = log(Nt) − log(E+1)Cq。基于前面的示例，假设在Cq = 9.96时达到10⁶个ROI拷贝，并分别计算扩增效率为100%、99.9%、99%、90%和110%时的N0：\n\
    \n```r\nNt <- 1000000\n\nCq <- 9.96\n\nE <- c(1.000, 0.999, 0.990, 0.900, 1.100)\n\
    \nlog_N0 <- -((log(E+1)*Cq)) + log(Nt)\n\nN0 <- 10^log_N0\n\nR0 <- N0/N0[1]\n\n\
    percent_increase <- round(100 * ((N0-N0[1])/abs(N0[1])), 3)\n```\n\n```text\n\
    log_N0\n> [1] 6.911765 6.916746 6.961690 7.422646 6.425815\n\nN0\n> [1] 8161400\
    \ 8255548 9155658 26463413 2665720\n\nR0\n> [1] 1.0000000 1.0115358 1.1218245\
    \ 3.2425092 0.3266254\n\npercent_increase\n> [1] 0.000 1.154 12.182 224.251 -67.337\n\
    ```\n\n也就是说，扩增效率下降0.1%和10%，相对于完全效率，会导致拷贝数分别被高估1%和224%。相反，扩增效率高于100%的反应则会导致实际拷贝数被低估。因此，110%的效率所得到的拷贝数比认为反应完全高效时少67%。为了将这种定量变化放在具体背景中，请看以下示例。HIV病毒载量（HIV\
    \ VL）的典型检测限约为每毫升血液40拷贝（c/mL）（Adams等，2019）。假设一个样本的病毒载量为35 c/mL，扩增效率分别为99%和110%。使用先前定义的PCR和find_cycle函数，可以基于10^6光单位的阈值估算预期拷贝数：\n\
    \n```r\nd <- 2\nK <- 10^13\nA1_0 <- 35\nA1 <- PCR(A1_0, d, K)\na1 <- which(A1\
    \ > 1000000)[1]\ncq_1 <- find_cycle(A1, 1:45, a1)\ncq_1\n```\n\n```text\n> [1]\
    \ 16.60976\n```\n\n因此，返回的拷贝数为：\n\n```r\nE <- c(0.990, 1.100)\nlog_N0 = -((log(E+1)*cq_1))+log(Nt)\n\
    N0 <- 10^log_N0\nN0\n```\n\n```text\n> [1] 243.08398 31.05318\n```\n\n换句话说，扩增效率低的反应会给出强阳性结果，而扩增效率过高的反应则会产生阴性结果。HIV结果阳性或阴性所意味着的影响无需进一步解释。低模板样本的定量并非易事，研究表明，拷贝数低于100的样本会被随机扩增，这一过程可用蒙特卡洛理论建模，导致定量结果出现巨大波动（Karrer等，1995）。当然，一般来说，定量越准确越好。因此，任何可能影响准确定量的因素都应避免。\n\
    \n为了克服拟合点法的假设，人们开发了大量分析方法，例如二阶导数最大值法（Luu-The等，2005）、S型曲线拟合（Liu和Saint，2002；Rutledge，2004；Goll等，2006；Guescini等，2008，2013）和线性回归（Ramakers等，2003；Tichopad等，2003）。所有这些方法都被证明在一定程度上优于拟合点法。例如，与拟合点法相比，二阶导数法对低模板样本的定量更准确，尽管截距更高（Luu-The等，2005）。更重要的是，这些替代方法无需设置阈值和基线值，实现了不依赖用户的方法（Luu-The等，2005）。\n\
    \n此外，qPCR正在快速变化，例如DNA聚合酶（DNA-pol）持续合成能力的提升、热循环仪的小型化以及检测通量的增加（Csako，2006）。特别是，qPCR的通量已从单管提升到每板96孔，目前达到每板数百个反应（Kodani等，2011；Pripuzova等，2012）。已经出现了可容纳数千个反应的板（Morrison等，2006；Schlesinger等，2010）。因此，负责发布qPCR结果的操作人员面临更大的劳动负担，这不利于其他实验室职责，并增加了发布错误结果的风险。换句话说，现代qPCR分析不仅需要尽可能准确，还需要自动化，以便在最短时间内筛选数千个反应。在这种背景下，qPCR数据分析只能借助机器辅助；因此，分析方法应能够与某些机器学习算法集成。拟合点法产生的单一值（Cq）——但例如二阶导数法也是如此——无法实现这种集成，因为单一值携带的信息非常少。需要更先进的方法。\n\
    \n## maxRatio\n\n*maxRatio*算法已被引入，作为拟合点法的替代方案，用于判断一个反应是否真正阳性，并产生更可靠的定量结果（Shain和Clemens，2008）。*maxRatio*算法目前包含在雅培分子*m2000\
    \ RealTime System*中，用于识别阳性结果。*maxRatio*算法计算简单，因为它考虑的是第*n*个循环与第*n-1*个循环之间扩增信号*A*的比率：\n\
    \n$$\nR_n = \\frac{A_n}{A_{n-1}} - 1.\n$$\n\n(2.7)\n\n在没有扩增的情况下，信号是恒定的；因此，$A_n=A_{n-1}$，$A_n/A_{n-1}=1$，公式2.7中的减1使得$R$变为零。$R$不仅无量纲，而且是自归一化的。实际上，将$A$分解为与实际扩增相关的部分（$a$）和代表噪声或背景的部分（$b$），可以立即观察到$(a'b)/(ab)\
    \ = a'/a$，其中$a'$和$a$分别是$a_n$和$a_{n-1}$的简写。噪声$b$在被除数和除数中是相等的，因为它来自同一反应。因此，与拟合点法不同，*maxRatio*本身就能考虑个体扩增抑制，克服了PCR定量的主要缺陷之一。$R$既可以基于基线校正信号（$\\\
    Delta R_n$）计算，也可以基于原始荧光信号计算；后者可以进行更好的评估，因为它不会掩盖反应中可能存在的抑制。\n\n使用拟合点法构建的qPCR扩增曲线是S型的，而*maxRatio*变换则是高斯型的。以下代码清单将使用之前通过*maxRatio*分析过的靶向空肠弯曲杆菌（*Campylobacter\
    \ jejuni*）的PCR数据来证明这一点（Marongiu，2016a，2016b）。\n\n代码清单2.6\n\n```r\nmaxRatio <-\
    \ function(A) {\n  n = A[2:length(A)]\n  n_minusOne = A[1:length(A)-1]\n  R <-\
    \ (n/n_minusOne) - 1\n  return(R)\n}\n\namp <- c(3.382, 3.372, 3.363, 3.371, 3.383,\
    \ 3.382, 3.382, 3.370, 3.352, 3.339, 3.327, 3.307,\n3.291, 3.270, 3.239, 3.218,\
    \ 3.199, 3.177, 3.160, 3.147, 3.136, 3.135, 3.139, 3.148, 3.183,\n3.263, 3.410,\
    \ 3.657, 4.009, 4.447, 4.911, 5.322, 5.661, 5.929, 6.140, 6.303, 6.421, 6.515,\n\
    6.578, 6.617, 6.658, 6.692, 6.704, 6.702, 6.693)\n```\n"
