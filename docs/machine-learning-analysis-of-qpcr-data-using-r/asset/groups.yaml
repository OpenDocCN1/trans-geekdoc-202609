    \ e[e < m-2*s]\nindex_lower <- which(e < m-2*s)\npoints(lower ~ index_lower, pch=16,\
    \ col=\"black\")\n```\n\n![](img/7ea01e6937e09d043e45c73fff9eaed3_65_0.png)\n\n\
    Figure 2.3. Monitoring of PCR's efficiency variation. By plotting the efficiency\
    \ of each PCR run over time, it is possible to determine whether a specific run\
    \ has been affected by amplification problems. The abscissa can either consider\
    \ the date of the run or an index of the run (as in this case). The mean of the\
    \ efficiency is plotted (solid line) together with one (dashed lines) and two\
    \ (dotted lines) standard deviations (SD) from the mean. It is evident how the\
    \ majority of the data lies within one SD from the mean, with the efficiencies\
    \ being evenly distributed above and below the mean. In two occurrences, the efficiency\
    \ lies above (gray dot) and below (black dot) the 2SD boundaries. These two runs\
    \ should be carried out again.\n\nFigure 2.3 shows that the PCRs have efficiencies\
    \ evenly distributed above and below the mean, with some beyond the boundaries\
    \ of one standard deviation from the mean. The few reactions with efficiencies\
    \ beyond the boundaries of two standard deviations from the mean should be flagged\
    \ and repeated.\n\nAs for any diagnostic assay, there is also the need to evaluate\
    \ the effectiveness of qPCR using a series of performance parameters (Fardy, 2009;\
    \ Kralik and Ricchi, 2017). The limit of detection (or analytical sensitivity)\
    \ is defined as the minimal concentration of sample that provides a success rate\
    \ of 95%. For instance, in the setup of a qPCR assay targeting HPV-16 (Marongiu\
