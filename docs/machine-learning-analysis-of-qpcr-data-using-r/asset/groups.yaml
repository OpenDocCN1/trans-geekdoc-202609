    ```\nset.seed(n)\n  n\n  一个整数。\nlayout(x, widths, heights, ...)\n  x\n  指定绘图行数和列数的矩阵。\n\
    \  widths, heights\n  指定列宽或行高的向量。\ndensity(x, bw, adjust, kernel, na.rm = FALSE,\
    \ ...)\n  x\n  数据向量。\n  bw, adjust\n  绘图的带宽，可单独使用或乘以乘数 'adjust'。\n  kernel\n \
    \ 用于生成密度图的方法（\"gaussian\", \"epanechnikov\", \"rectangular\", \"triangular\",\
    \ \"biweight\", \"cosine\", \"optcosine\"）\n  na.rm\n  逻辑值，确定是否排除 NA 值。\nnormalmixEM(x,\
    \ lambda, mu, sigma, k, epsilon, maxit, maxrestarts, verb, ...)\n  x\n  数据向量。\n\
    \  lambda, mu, sigma\n  混合比例、组分均值和标准差的最初值。\n  k\n  组分数。\n  epsilon\n  收敛标准。\n\
    \  maxit, maxrestarts\n  最大迭代次数和允许的重新开始次数。\n  verb\n  逻辑值，激活详细模式。\n```\n\n## 代码清单\
    \ 3.2。\n\n由于 qPCR 的真实数据在低扩增循环时显示高荧光，因此在前一个代码清单的模拟中增加了十个元素。本代码清单和上一代码清单中生成的所有数据都存储在数据框\
    \ df 中，然后通过根据其分组（阳性、阴性、不确定）对数据着色来绘图。\n\n区分有反应和无反应反应的阈值是通过使用 normalmixEM（代码清单 3.1）生成的模型对象获得的。具体来说，第二个群体（无反应）的平均\
    \ MR 值的标准差被用作阈值（model$sigma[2]）。在低扩增循环时具有高荧光的样本将高于该阈值，因此，考虑到目视检查或数据探索表明这些样本的 FCN\
    \ 低于 10，设置了第二个阈值。阈值在图中用 segments 函数描绘。\n\n## 代码清单 3.3。\n\n根据存储在变量 early_TH_fcn、early_TH_mr\
    \ 和 cut-off 中的阈值生成标签。标签存储在变量中，这些变量组合在数据框 A_df 和 B_df 中，分别定义群体 A 和 B。数据被绘制，超平面由一条主线段（abline(0.32,\
    \ -0.007, lwd=3)）和两条边界线（abline(0.29, -0.007, lty=2) 和 abline(0.35, -0.007, lty=2)）描绘。自定义函数\
    \ y 计算支持向量与超平面之间的距离。\n\n可以编写实现简单 if...else 语句的单行函数（在其他编程语言中称为 lambda 或匿名函数）。单行函数返回的值可以通过以下语法存储到对象中：\n\
    variable <- function(parameters) (return (if(parameters)))\nvariable <- ifelse(condition,\
    \ value_if_true, value_if_false)\n在第一种情况下，返回基于 parameters 中存在的值进行的计算。例如，当 x =\
    \ [a, b, c] 时，f(x) = a * b+c。在第二种情况下，根据条件子句的结果，variable 取 value_if_true 或 value_if_false。例如，将\
    \ a <- ifelse(x>0, \"positive\", \"negative\") 应用于 x <- c(-2, -1, 0, 1, 2) 将返回\
    \ a = [\"negative\" \"negative\" \"negative\" \"positive\" \"positive\"]。\n\n"
