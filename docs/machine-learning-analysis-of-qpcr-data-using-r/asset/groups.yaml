  - "[PAGE 53]\n\na common option (Döring et al., 2019). The ROI (in this case, a\
    \ file that contains the sequence for E. coli Stx2) is loaded into an R object.\
    \ The specifics of the primers (such as length of the oligonucleotides and of\
    \ the amplicon, position of the amplicon with respect to the reference sequence,\
    \ and Tₘ of the oligonucleotides) are stored in an xml file. The easiest approach\
    \ to personalize the design is to download a ready-made xml file from the openPrimeR\
    \ website and then modify specific items.\n\n# Listing 2.1\n\n```\nlibrary(\"\
    openPrimeR\")\nfasta.file <- \"stx.fa\"\nseq.df <- read_templates(fasta.file)\n\
    settings.xml <- system.file(\"extdata\", \"settings\",\n    \"C_Taq_PCR_high_stringency.xml\"\
    , package = \"openPrimeR\")\nsettings <- read_settings(settings.xml)\n```\n\n\
    After all this, it is possible to design the primers. The specific conditions\
    \ for the computation of the primer include a maximum length in the range 18-25\
    \ nucleotides and no mismatches between primers and template. The found primers\
    \ are then written to local file for later use and this file is read back into\
    \ memory to show the result.\n\n# Listing 2.1 (continuation)\n\n```\nconstraints(design.settings)[[\"\
