    \n碰巧，这些差异反应中的三个（108、128 和 126）已被核查；其余的在图 3.9 中进行比较。本质上，三个假阳性反应中有两个具有反应性扩增曲线（Cq\
    \ 未确定但被 SVM 分类为阳性）；相反，20 个假阴性反应（Cq 平均值为 39.19 ± 1.97，被 SVM 分类为阴性）显示出与低模板输入一致的曲线。可以认为，fit-point/maxRatio\
    \ 的组合非常强大，因为它能够识别反应曲线中的差异，从而帮助更准确地验证反应。这是 maxRatio 在 Abbott Molecular m2000 实时系统中的当前用途。本文应用的\
    \ SVM 叠加层有望进一步减少差异，并实例化分组——例如荧光抑制、低模板或完全误判——这将帮助操作员理解导致差异的问题。然而，该模型的一个缺点是其极端二分法：“阳性”和“阴性”聚类无法足够详细地描述数据集。\n\
    \n由特定实验室执行的运行。换句话说，该模型可以应用于不断增长的数据集，从而提高其准确性。\n\n![](img/7ea01e6937e09d043e45c73fff9eaed3_122_0.png)\n\
    \n![](img/7ea01e6937e09d043e45c73fff9eaed3_122_1.png)\n\n图 3.10. 三类分类。SVM 方法允许定义两个以上的类别。操作员决定模型中应包含多少个类别，算法自动定义这些类别的边界。A.\
    \ 线条代表 SVM 模型识别的超平面；叠加了五次独立分析。使用的核是 Bessel 函数，代价为 1。B. SVM 生成模型的示例。MR/FCN 平面上的每个点都被赋予一个标签（“阳性”、“阴性”或“不确定”）；因此，反应根据其在数学空间中的位置进行分类。反应与上面板一样分层；注意下面板是上面板的放大图。\n\
    \n## 代码清单 3.12\n\n```\nsaveRDS(mod, \"SVModel.rds\")\nmod = readRDS(\"SVModel.rds\"\
