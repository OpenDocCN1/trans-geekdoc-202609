    \ with the function ksvm of the package kernlab and it is stored in the object\
    \ mod and applied to the testing data frame (test_set). The prediction of z (the\
    \ label of reactivity) is based on the provided x (FCN) and y (MR) values using\
    \ the predict function. The vector pred_prob contains the probability of the classification;\
    \ prediction contains the actual label. A new data frame (OUT) is built using\
    \ the index of the testing data frame and prediction.\n\n```\nThe function ksvm\
    \ generates an SVM model based on graphical coordinates (x/y values) and a label\
    \ (z values). The function predict is part of R core and predicts new values based\
    \ on a model.\nksvm(z~x+y, data, scaled, type, kernel, kpar, C, nu, epsilon, prob.model,\
