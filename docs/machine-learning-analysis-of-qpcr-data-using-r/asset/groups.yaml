    \ 133\n\n## 致谢\n\n我谨感谢意大利威尼斯实验动物疫病研究所病毒学实验室的 Dr Maria Serena Beato 和 Dr Lara Cavicchio\
    \ 慷慨提供 SIV 数据集。我还要感谢 *maxRatio* 的发明者 Mr Eric Shain，多年来合作期间给予我宝贵的支持、耐心以及对稿件的批判性审阅。\n\
    \n## 引言\n\n定量聚合酶链反应（qPCR）是一种用于定量核酸的多功能且流行的检测方法。随着每项检测中反应数量的近期扩展，需要一种准确的方法来报告适合自动化的<|message|>\
    \ 数据。本书将描述这样一种基于机器学习分析的方法，并使用公开可用的工具实现它。本书面向研究人员，将提供对编程语言 R 的详细介绍，包括最常用函数的相关参考。因此，本工作将为领域专家提供\
    \ qPCR 数据客观分析的先进策略，并为学生提供 qPCR 和计算分析的入门。\n\n## 第1章\n\n### qPCR 在疾病诊断中的作用\n\n###\
    \ 柯赫假设作为诊断的基础\n\n路易·巴斯德提出的微生物学说（Casanova and Abel, 2013）有一个重要推论：为了确认传染病的诊断，医生必须以某种方式从患者的标本中回收疑似微生物病原体。这并非一直如此：许多受人尊敬的教授和医学从业者强烈反对巴斯德提出的论点，以及为数不多的人如\
