    spike\"], pch=15, cex=1.5, col=\"gray40\")\nlegend(\"topleft\", legend = c(\"\
    Positives\", \"Negatives\", \"Uncertains\", \"Early spike\"),\n    pch = c(16,\
    \ 1, 16, 15), col=c(\"black\", \"black\", \"grey\", \"gray40\"))\n```\n\nA visual\
    \ inspection of the data (Figure 3.2A) shows that there was a difference in sample\
    \ distribution at FCN = 10. This split is obviously due to how the data for this\
    \ example were created in the first place, but real data sets have similar discontinuities\
    \ (Marongiu et al., 2016a; Marongiu et al., 2021a) — and the data was designed\
    \ to include this breakup. The FCN = 10 can be used to further stratify the reactions:\
    \ samples below this value will have one MR threshold, whereas the EM-derived\
    \ threshold will be applied to those above this value.\n\n```\nListing 3.2 (continuation)\n\
    TH_mr <- model$sigma[2]\nearly_TH_fcn <- 10\nearly_TH_mr <- max(df$MR[(df$MR >\
    \ cut_off) & (df$FCN < early_TH_fcn)])\nplot(df$MR[(df$FCN < early_TH_fcn) & (df$MR\
    \ <= early_TH_mr)] ~\n    df$FCN[(df$FCN < early_TH_fcn) & (df$MR <= early_TH_mr)],\n\
    \    ylim=c(0,0.5), xlim=c(0,41), cex=1.5, xlab=expression(bold(\"FCN\")),\n \
    \   ylab=expression(bold(\"MR\")))\npoints(df$MR[(df$FCN >= early_TH_fcn) & (df$MR\
