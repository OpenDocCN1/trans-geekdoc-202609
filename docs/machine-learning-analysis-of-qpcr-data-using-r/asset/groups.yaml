    \ 3.3）。该线的识别是通过对图的目视检查完成的，具体如下。通过观察到一条截距为 0.32 MR 的线可以将数据分为两组，可以确定可能的斜率。由于 MR\
    \ 值在 FCN = 20 时约为 0.20，而在 FCN = 10 时约为 0.29，因此可以估计分离线的斜率为 Δy/Δx = −0.09/10 = −0.009。通过试错进一步调整确定了示例中使用的值。进一步的数据探索允许选择合适的支持向量（s1-s6）。\n\
    \n![](img/7ea01e6937e09d043e45c73fff9eaed3_93_0.png)\n\n图 3.3. 支持向量机程序概述。支持向量机（SVM）是一种监督学习模型，这意味着它必须在预先分类的组上运行。在本例中共有两组：A（●）和\
    \ B（○）。算法（核）在组之间找到一条分离线，称为超平面（粗线），该超平面最大化样本在其原始组内的分配。在本例中，超平面将图分为上下两部分，将组 A 的大部分元素定位在图的上面，将组\
    \ B 的大部分元素定位在图的下面。为了减少计算工作量，核仅使用已知为支持向量的元素子集（此处用方块突出显示）。因此，该过程简化为最小化超平面与支持向量之间的距离（虚线），类似于回归分析。该模型还为分类过程提供了一些灵活性，这意味着边际内的项目（虚线）在分类过程中将被忽略。SVM\
    \ 分析的最终产品是，超平面上方的点将被分类为属于组 A。相反，低于该平面的点将被放入组 B。\n\nSVM 的另一个显著方面是超平面不一定是直线；它们也可以是曲线并延伸到三维。所谓的“核技巧”可以将三维聚类线性化，这也有助于区分非线性可分组。SVM\
    \ 使用的最常见核是线性核（用于线性可分情况）、多项式核、sigmoid 核和 Gaussian 核。此外，SVM 允许定义多于一个组。再次看图 3.3，很明显，使用能够“包裹”阳性样本的曲线将避免将高\
    \ FCN 的阴性样本分类为反应性。此外，一种能够识别图 3.1-3.2 中指定为“不确定”的样本的分类程序将大大简化验证过程，因为它允许操作员仅关注不满意的反应。\n\
    \n曾尝试将 SVM 应用于 qPCR 数据的分析（Marongiu et al., 2021a）。对 15,744 个先前由 maxRatio 加 EM\
    \ 过滤分类的样本进行再分析（Marongiu et al., 2016a）显示，与 fit-point 方法相比，maxRatio/SVM 组合将阳性和阴性反应的检测准确率从\
    \ 99.6% 提高到 100%，PPV 从 96.5% 提高到 99.9%。此外，maxRatio/SVM 组合将 35 个样本检测为次优，这意味着整个数据集仅有\
    \ 0.2% 需要通过目视检查进行实际验证。PPV 接近 100%，剩余的反应可以在没有操作员参与的情况下进行验证，从而大幅减少 qPCR 工作量。下一节将使用一组新的反应重现这种分析方法。\n\
    \n## maxRatio/SVM 分析方法的真实案例\n\n以下示例中使用的 RT-qPCR 数据由意大利威尼斯实验动物预防研究所（Istituto Zooprofilattico\
    \ Sperimentale delle Venezie）病毒学实验室的 Maria Serena Beato 博士和 Lara Cavicchio 博士慷慨提供。该检测针对猪流感\
    \ A 病毒（SIV）的血凝素基因，主要信号由 FAM 荧光团产生，HEX 通道下为 ROX 发射进行归一化（Hoffmann et al., 2010）。本示例仅处理\
    \ FAM 信号——在真实世界的验证场景中，目标和归一化通道的结果将被合并（即，即使存在反应性 FAM 信号，具有非反应性 HEX 信号的样本也必须重新处理）。该检测\n\
    在 CFX 热循环仪（BioRad）上进行，并使用 CFX Maestro 软件生成原始扩增数据和平文件以及验证结果。不同的运行手动连接成单个制表符分隔文件（TSV），然后用于下游分析。以下列表显示了如何导入数据以及对集合进行初步探索。\n\
    \n```\nListing 3.4\nsetwd(getwd())\namplification <- read.table(\"SIV_overall.tsv\"\
    , header = TRUE, row.names = NULL, skip = 0, dec = \".\", sep = \"\\t\", fill\
    \ = TRUE, comment.char = \"\", stringsAsFactors = FALSE)\nvalidation <- read.delim(\"\
