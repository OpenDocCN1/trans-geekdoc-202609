    Figure 2.6. Impact of threshold on the determination of the quantitative cycle.
    The signal threshold has different impacts on the fit-point and maxRatio methods.
    A. The MR threshold (solid line) in maxRatio separates non-reactive (negative,
    ○) from reactive (positive, ●) samples. The FCN is unaffected by doubling the
    threshold value (dashed line). The FCN of the positive sample with the lowest
    FCN, for example, remains the same (dotted line). B. The fluorescence threshold
    (solid line) determines the Cq (dotted line) directly by calculating the fractional
    cycle at which this line meets the amplification plot. The intersection point
    happens at a later cycle when the threshold value (dashed line) is doubled. Since
    the Cq is associated with the initial copy number of the sample, the quantification
    is altered. The arrows make it easier to grasp the process.'
  - '[PAGE 78]


    Additionally, multiple thresholds can be applied to separate different subclasses
    of samples.


    The *maxRatio* algorithm was initially employed to quantify HIV RNA, and *Chlamydia
    trachomatis* and *Neisseria gonorrhoeae* DNA (Shain and Clemens, 2008). That study
    demonstrated that *maxRatio* provided a better definition of a reactive and non-reactive
    reactions than the fit-point method, thus providing better compensation for PCR
    inhibition. In a subsequent study (Zhao *et al.*, 2010), *maxRatio* was applied
    to the quantification of the nematode *Meloidogyne incognita*. Even in this case,
    *maxRatio* outperformed the fit-point method, for the former provided counts of
    second-stage juveniles closer to the gold standard (microscopical examination)
    than the latter (r² = 0.906 and r² = 0.851, respectively, both with a p-value
    < 0.001 and n = 10).


    Another aspect that distinguishes *maxRatio* from other commonly used analytical
    approaches (such as the fit-point and second derivative) is that it delivers a
    pair of values for each response. The values generated by *maxRatio* can be plotted
    on an MR-FCN space, however the Cq generated by fit-point can only be aligned
    on a line. The benefit in the latter instance is that machine learning techniques
    can be used to further analyze the data. Machine learning is already being employed
    in the analysis of qPCR data (Gunay *et al.*, 2016), but *maxRatio* has the advantage
    over other algorithm of a simple implementation and to provide a visualization
    of the data (suitable to support-vector machines analysis) that makes it intuitive.
    The following chapter will go in further detail into the application of *maxRatio*.


    # Listings


    Listing 2.1. The listing uses the package *openPrimeR* to design PCR primers.
    The name of the file containing the target nucleic acid sequence is assigned to
    an object (*fasta.file*); other files can be loaded by simply changing the call
    to *fasta.file*, without the need to modify the script further. The function *system.file*
    reads an xml file available in the *openPrimeR* server and loads it in the *settings.xml*
    object. The function *read_settings* parses *settings.xml* into the *settings*
    object. Modifying a ready-made settings object is easier than writing a new one,
    especially since most of the available options will remain untouched. Some of
    the characteristics of *settings*, however, are modified to better suit the custom
    design. Namely, the length of the primers is constrained to minimum of 18 bases
    and a maximum of 25 bases and no mismatches are allowed. The function *design_primers*
    computes the design of the primers based on a series of arguments, including the
    object *settings*, and stores it the list *primer_set* while the function *write_primers*
    stores the optimal pair of primers (index *$opti*) in the local file *stx_primers.fasta*.
    Stored primers can be read back into the R environment as a data frame with the
    function *read_primers* and printed on screen by selecting the required rows and
    columns of such a data frame.'
