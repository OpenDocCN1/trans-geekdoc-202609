    \ the local directory (absolute). Otherwise, unless the local directory where\
    \ the files have been downloaded in R's default directory, it is possible to set\
    \ the working directory using `setwd` and access the files from there avoiding\
    \ to write the whole path (relative) path. In the listing, not knowing the local\
    \ directory, the current directory has been determined with the function `getwd`\
    \ and passed as an argument to `setwd`. This procedure, essentially, simplifies\
    \ R’s default directory as the working directory. In real life, the user can set\
    \ the preferred directory and avoid writing down the all path to the downloaded\
    \ files. Alternatively, `read.table` takes a complete URL. Moreover, `read.table`\
    \ is a generic function where the different parameters are as generic as possible.\
    \ Other related function such as `read.csv` and `read.delim` are specifically\
    \ designed to read comma separated values (csv) and tab separated values (tsv)\
    \ by setting the argument `sep` to comma (\",\") and tabulator (\"\\t\"), respectively.\
    \ The file `SIV_overall.tsv` file contains the amplification data obtained from\
    \ the thermal-cycler whereas `SIV_results.tsv` contains the quantitative cycles\
    \ of all reactions. Each reaction is identified by a unique index. The `SIV_overall.tsv`\
    \ files is loaded into the object *amplification* and `SIV_results.tsv` files\
    \ is loaded into the object *validation*.\n\n```\nDetermining the current (more\
    \ properly: working) folder where R reads and writes file\nis given by the function\
    \ `getwd`, which does not require an argument. It is possible to\nset the current\
