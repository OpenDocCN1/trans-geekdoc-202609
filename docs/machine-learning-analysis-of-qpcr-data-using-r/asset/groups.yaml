    \ 为 2 个循环，ΔΔCq 为 –6。随后，R_S 为 2^(-6) = 2^6 = 64；因此，紫外处理样品中 Stx2 的表达量是未处理细胞的 64\
    \ 倍。\n\n公式 2.1a 等价于（Pfaffl, 2001）：\n\nR_S = E_S^{ΔCq_s}/E_R^{ΔCq_c}. (2.1b)\n\n\
    公式 2.1b 考虑了 PCR 扩增的实际效率。另一方面，绝对定量旨在计算给定样品中靶标分子的实际数量，其程序将在以下段落中描述。在绝对和相对定量中，光发射都会被转换为数字值。提取容器中光发射主要有两种系统：\n\
    \n- 在每个扩增循环时一次性拍摄所有反应的快照，然后从每个反应中推算发射。PCR 通常在 96 孔板中进行，孔底为圆锥形；光学装置对板顶进行一次成像。软件随后处理每个孔的荧光信号。\n\
    - 独立记录每个反应产生的光。这是通过将反应容器放置在转盘上实现的，转盘在每次旋转时都会经过激光光学装置前。该系统由 Qiagen 商用为 Rotor-gene™，由\
    \ Roche 商用为 LightCycler™。\n\n在两种情况下，最终结果都是指每个样品在每个扩增循环时的光发射数值表。应记住，所报告的分子（探针或嵌入剂）在接触扩增子时会增加其发光度——要么是因为它们实际上结合了\
    \ DNA，要么是因为 DNA-pol 释放了荧光团。另一方面，即使不接触扩增子，它们也会发光。例如，SYBR Green™ 在结合 DNA 后\n\n发光度增加超过\
    \ 2000 倍，这意味着存在背景光，其强度比 PCR 相关信号低两千倍。这种背景是一种噪声，会降低 PCR 的灵敏度，可在图 1.2 的下部插图中观察到。\n\
    \n可按如下方式关联两个样品 A 和 B 的初始载量 N₀（Kubista et al., 2006）：\n\nN₀ᴬ/N₀ᴮ = (1 + E)^{CqA\
    \ - CqB} = (1 + E)^{ΔCq}.  (2.2)\n\n当 PCR 扩增效率为 1（100%）时，底数变为 2^{ΔCq}。在示例中，紫外处理与未处理样品之间的\
    \ Cq 差异为六，其载量比为 2⁶ = 64。\n\n可将给定扩增循环 t 时的 ROI 数量 N_t 与初始靶标量 N₀ 关联，方程为（Rutledge\
    \ and Côté, 2003）：\n\nN₀ = N_t (E+1)^{-t}.  (2.3)\n\n通过转换为对数，方程 2.3 可线性化：\n\n\
    log(N₀) = log(N_t) - log(E+1) t =\n= - log(E+1) t + log(N_t).  (2.4)\n\n由方程 2.3\
    \ 可知，曲线的斜率为 -log(E+1)，截距为 log(N_t)。生成该曲线实际上是通过用准确方法测量的核酸储备液进行连续稀释获得。这种系列被称为标准稀释，其\
    \ Cq 值用于生成标准曲线，即线性回归模型。最低和最高稀释之间的间隔应处于检测的动态范围内，即检测能够准确测量的最小和最大量。具有未知载量的样品可通过该曲线进行插值定量。这是因为每个反应的\
    \ Cq 由以下方程描述（Rutledge and Côté, 2003）：\n\nCqₙ = s × log(N₀) + I  (2.5)\n\n其中 I（截距）是在反应中只有一份靶标拷贝时的理想\
    \ Cq，s 是从标准曲线值拟合直线（或更准确地说是曲线）得到的斜率。利用 s，可以计算 PCR 的效率：\n\n$E = 10^{-1/s} - 1$ \
    \ (2.6)\n\n让我们用以下命令生成一条标准曲线。\n\n### 列表 2.2\n```r\nA1 <- PCR(10, d, K, r)\nA2 <-\
    \ PCR(100, d, K, r)\nA3 <- PCR(1000, d, K, r)\nA4 <- PCR(10000, d, K, r)\nA5 <-\
