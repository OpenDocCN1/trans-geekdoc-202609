    \ cut_off, max(df$FCN), cut_off, col=\"red\", lwd=2, lty=2)\nlegend(\"topleft\"\
    , legend = c(\"Positives\", \"Negatives\"), pch = c(16, 1))\n```\n\nFigure 3.2B\
