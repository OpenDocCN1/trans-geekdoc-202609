  mdcn: "\n(cont.) A. 实际扩增数据与 PCR 函数生成的数据的比较。请注意，模拟数据定义的曲线比实际数据陡得多。插图显示了不断增加的扩增。\n\
    \nB. 使用回归获得的参数进行的模拟比 PCR 函数更费力但更准确。qpcR 包提供了一个准确的替代方案。在图 A 中，分子数量与扩增循环相对应绘制。在现实生活中，分子数量无法计数，只能通过检测来测定。在图\
    \ B 中，光被用作分子数量的替代指标，假设光与靶标数量成正比。\n\n可以在图 1.2 的插图中看到，方程 1 模拟了永无止境的扩增。实际上，反应最终会停滞。因此\
    \ Liu 等人指出，他们的模型仅适用于 PCR 的初始阶段。如前几段所述，约 1 µM 的引物相当于约 10^13 个寡核苷酸，因此只能生成 10^13\
    \ 个扩增子；之后，反应就不会再继续。三磷酸核苷也同样适用。此外，DNA-pol 会被扩增的副产物抑制，因此其在每个循环中的扩增效率会越来越低。简而言之，PCR\
    \ 结束时的 EF 将显示具有相同扩增子数量的样品。这种类型的 PCR 称为‘终点 PCR’。\n\n**Listing 1.3**\n\n```r\nD\
    \ <- 2\nK <- 10^13\nI <- 100\nROI <- vector()\nfor (i in 2:45) {\n  ROI[i] <-\
    \ ROI[i-1] * D * (1 - ROI[i-1]/K)\n}\nprint(ROI)\nplot(1:45, ROI, xlab=\"Amplification\
    \ cycle\", ylab=\"Number of molecules\")\n```\n\n在此脚本中，D 表示 ROI 的扩增速率，由于 PCR 的复制特性，其为二。K\
    \ 表示可产生的扩增子的最大量，以引物数量作为限制性试剂。逻辑项的作用如下。当扩增子的数量远低于 K 时，ROI_t 与 K 的比值约为零，因此 ROI_{t+1}\
    \ 的数量约为 ROI_t 的两倍。然而，当扩增子的数量接近 K 时，比值为一，整个项变为零。结果是反应在每个扩增循环中变慢。\n\n这种逻辑简化并不是 PCR\
    \ 扩增曲线的最精确表示。可以通过将此模拟获得的曲线与实际扩增曲线进行比较来证明这一点。为了证明这一点，将使用来自 HIV 检测的两个反应获得的实际扩增数据（Marongiu\
