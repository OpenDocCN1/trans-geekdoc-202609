    \ fcna))\n}\ncycles <- mrPlotter(1:45, amp, give = \"cycle\")\nfluorescence <-\
    \ mrPlotter(1:45, amp, give = \"fluo\")\nplot(1:45, high, type=\"\", xlab=expression(bold(\"\
    Amplification cycle\")),\n    ylab=expression(bold(\"Amplification signal\")))\n\
