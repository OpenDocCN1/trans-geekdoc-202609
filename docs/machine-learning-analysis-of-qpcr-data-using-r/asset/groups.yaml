  mdcn: "\n\n序列在每个循环中并非简单地被复制，而是可以生成其他多种分子。此外，扩增并非每个循环发生一次（即大约每分钟一次），而是持续进行的，并且引物不像在PCR中那样是反应的限制因素。这两个因素的综合作用意味着NASBA比PCR更快地扩增其靶标，且扩增水平更高。转录介导的扩增（TMA）与NASBA类似，但使用一种专有酶，该酶兼具逆转录酶和RNase\
    \ H活性（Zhao *et al.*, 2015）。\n\n### 表1. 一些最常见的等温扩增方法列表\n\n| 名称 | 缩写 | 引物数 | 酶数\
    \ |\n|---|---|---|---:|\n| 聚合酶链式反应 | PCR | 2 | 1 |\n| 核酸序列扩增 | NASBA | 2 | 3 |\n\
    | 链置换扩增 | SDA | 4 | 2 |\n| 环介导扩增 | LAMP | 4 | 1 |\n| 滚环扩增 | RCA | 2 | 2 |\n| 解旋酶依赖性扩增\
    \ | HDA | 2 | 2 |\n| 重组酶聚合酶扩增 | RPA | 2 | 2 |\n| 指数扩增反应 | EXPAR | 0 | 2 |\n| 全基因组扩增\
    \ | WGA | 0 | 1 |\n\n表中还列出了PCR以作比较。\n\n另一种流行的等温方法是环介导等温扩增（LAMP）(Notomi *et al.*,\
    \ 2015)。该方法需要了解靶DNA上的六个位点。我们用字母A到F表示这些位点。A-B-C和D-E-F分别位于ROI的上游和下游；互补序列可用Ā-F̄表示。第一个引物（正向内引物，FIP）带有序列5′-C̄B-3′，并通过链入侵与B杂交；因此，不像PCR那样需要将DNA变性作为预备步骤。该引物由DNA-pol延伸产生一个片段（C̄B̄C-ROI-D̄ĒF）。新合成的链被添加一个序列为A的外引物所置换。被置换链的C和C̄位点相互杂交形成一个5′环。在D-F位点，由反向内引物（BIP，带有ĒD）和反向外引物（带有F）发生相同的过程。该过程的最终结果是所谓的LAMP哑铃结构，即一条单链丝，带有环C̄B̄C和DĒD̄，可与FIP和BIP杂交。这些引物的延伸会产生具有更多识别位点的多连体，因此\n\
    \n操作者将定义一个ROI，并以它的存在作为该细菌实际分离、生长和鉴定的一种替代指标。随后PCR将进入三个重复阶段（图1.1A）。第一阶段将反应温度升至约95°C，使双链DNA（dsDNA）变性，并使其可供后续使用。第二阶段将反应混合物冷却至约50°C，使短的合成寡核苷酸优先退火到ROI上。而一个短时段（约10秒）则有利于短DNA片段的退火。退火过程（即变性的逆过程）由常数速率*k*决定，定义为（Wetmur,\
    \ 1991）：*k* = *k*<sub>N</sub>*L*<sub>S</sub><sup>−1/2</sup>*N*<sup>−1</sup>，其中*L*<sub>S</sub>是链的最短长度，*N*是序列的复杂度（衡量核苷酸重复延伸段缺失程度的指标），*k*<sub>N</sub>是成核速率。从方程可以看出，长链退火比短核苷酸需要更长时间。例如，我们继续对*E.\
    \ coli*进行假设性分析，其基因组为4.6百万碱基（Mb）(Blattner *et al.*, 1997)。假设我们有一个20个核苷酸的引物。由于*k*<sub>N</sub>和*N*对于引物和基因组都是相同的，因此可以使用常数α\
    \ = *k*<sub>N</sub>*N*<sup>−1</sup>简化退火速率方程，这样整个基因组的退火时间动力学将为α√4,639,221 = α2153.9，而引物的则为α√20\
    \ = α4.5。换句话说，引物退火速度比整个基因组快482倍。\n\n再次将温度升至约60°C将优化DNA-pol的持续合成能力（定义为引物在不脱离模板的情况下继续延伸的概率\
    \ (Pavlov *et al.*, 2004)）。每种DNA-pol都有一个特定的最适温度。结果是，通过这三步，DNA-pol将复制ROI，因此“2的幂”很重要。当聚合酶以100%的持续合成能力（100%效率）工作时，每个ROI拷贝在每个循环都会被扩增，PCR的动力学遵循规则2ⁿ，其中*n*是程序运行所经历的循环数。程序结束时，将产生一系列含有ROI的核酸（NA）产物（图1.1B）。由于PCR会延伸引物直到模板链末端，新合成的链将比原始片段短。最丰富的NA种类是将从正向引物延伸到反向引物的种类：其长度由引物设计精确定义，称为“扩增子”。\n\
    \n![](img/7ea01e6937e09d043e45c73fff9eaed3_26_0.png)\n\n![](img/7ea01e6937e09d043e45c73fff9eaed3_26_1.png)\n\
    \n### 图1.1. 扩增反应概述\n\nPCR选择性地扩增核酸的靶标区域（ROI）。A. PCR循环条件。双链DNA（dsDNA）通过将反应温度升至约95°C而变性（熔解）。随后热循环仪将反应温度降至约56°C，使合成的寡核苷酸（引物）退火到ROI内的一个选定位点（退火）。实际退火温度取决于所用引物的特性。温度再次升至约60°C（延伸）。该温度与反应容器中存在的DNA依赖性DNA聚合酶（简称DNA-pol）的最适温度相匹配，并取决于所选酶。B.\
    \ PCR产生多种丰度不同的DNA片段。初始ROI为双链DNA，显示在图板顶部。在第一个扩增循环中，ROI的两条链被分离并复制。新合成的链从正向引物的5′端延伸到ROI的3′端（除非ROI太长，DNA-pol无法在延伸阶段分配的时间内覆盖整个区段）。结果是产生一对链长不均一的分子（c和d）。在PCR的第二个循环中，c和d的全长链作为c和d分子的模板。相反，c和d的短链将产生从反向引物5′端延伸到ROI\
    \ 3′端的片段（b和e），这些片段长度仍然不同，但比c和d短。在第三个PCR循环中，b和e的短链将产生从正向引物5′端延伸到反向引物3′端的片段（a）。a分子将是均质的dsDNA片段，其长度由于引物设计而预先已知，称为“扩增子”。由于DNA-pol可以在扩增阶段分配的时间内完美复制a，a将在2ⁿ动力学下倍增，并迅速成为反应容器中最普遍的分子。相比之下，其他片段将在2n动力学下线性复制。\n\
    \n利用Mullis所钟爱的“迭代循环”，在已知ROI初始数量k和扩增循环数n的情况下，可以计算PCR产生的分子数量：\n\n```\nListing 1.1\n\
    k <- 1\nn <- 20\ntotal_number_ROI <- vector(k)\nfor (i in 1:n) {\n  total_number_ROI[i+1]\
    \ <- total_number_ROI[i]*2\n}\n\nprint(total_number_ROI)\n\n[1]      1     2 \
    \    4     8    16    32    64   128   256   512\n[11]  1024  2048  4096  8192\
    \ 16384 32768 65536 131072 262144 524288\n[20] 1048576\n\nprint(2^20)\n\n[1] 1048576\n\
    ```\n\n最后一个值1,048,576等于2^20，代表过程中生成的ROI拷贝数。这意味着，如果样品中只有一个大肠杆菌细胞，它将在几个小时内产生足够的信号，通过凝胶电泳即可检测到。而用Southern印迹法检测同一份样品，则需要工作几天后才能得到阴性结果。因此，PCR的优势便显现出来。然而，Mullis提交的关于PCR的论文在1985年被高端科学期刊《自然》和《科学》拒绝（后来被仍然享有盛誉的《酶学方法》Methods\
    \ in Enzymology接受）。\n\n"
