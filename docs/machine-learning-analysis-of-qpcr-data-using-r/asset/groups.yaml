  - '[PAGE 29]


    fragment and it is central in the polymerase activity. This domain also has a
    transferase capability and adds a non-template residue (typically an adenine)
    at the end of the fragment. The presence of this extra-A comes handy in cloning
    procedures because it can anneal with a protruding timine from cloning vectors.

    The Taq-pol is now engineered to be produced in E. coli (Lawyer et al., 1989).
    Taq-pol, however, does not have a high fidelity (it introduces eight mismatched
    nucleotides every million insertions), and high-fidelity temperature-stable DNA-pol
    have been isolated from other organisms such as the archea Pyrococcus furiosus
    (Pfu, which introduces one erroneous dNTP every million insertions) (Cline et
    al., 1996). In addition, Taq-pol can incorporate modified dNTPs; this feature
    is used to mark the synthesized DNA with, for instance, digoxigenin or biotin.

    Another instance where the wide-range of dNTPs accepted by Taq-pol is that of
    uracil insertion. By replacing Ts with Us, it is possible to make the synthesized
    DNA susceptible to uracyl N-glycosylase (UNG) treatment: the digested DNA will
    reduce the risk of carry-over contamination from one reaction to a subsequent
