    both for diagnostic and research purposes. The improvement of the assay to provide
    a result in real time gave rise to a process that allows the exact quantification
    of the target molecule. This assay is known as quantitative PCR (qPCR).


    # Quantitative Polymerase Chain Reaction (qPCR) Assay


    The simplest way to determine whether a PCR has been successful is to separate
    the amplicons by electrophoresis (EF). This procedure has the advantage of showing
    directly whether the amplicons are of the expected size or if the primers have
    amplified an unwanted region. A first downside is that a subsequent step — that
    is: EF — is required after the PCR itself. A second downsize is that the PCR has
    a limited amount of components, thus, it cannot go on forever. Since the number
    of cycles is typically much more than those required to reach a visible signal,
    the result is that, at the end of the reaction, all samples will display virtually
    the same level of signal regardless of the initial template input. This principle
    is described in more in detail in the following paragraphs.


    Liu and Saint (Liu and Saint, 2002a) used the following equation to relate the
    initial copies of a samples with the amplification cycle:


    X_n = X0(1 + E)^n

    (1)


    where X_n is the amount of target’s copies at the amplification cycle n, X0 is
    the initial target’s load, and E the efficiency of reaction or, in other words,
    the rate of target duplication, which is assumed to be 100% — in other words,
    each template is replicated according to the 2^n kinetics.


    It is possible to replicate this with the following script [next page]:'
