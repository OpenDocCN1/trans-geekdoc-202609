    \ PCR and qPCR, the latter should also be associated with a limit of quantification\
    \ (LOQ), which is defined as the lowest concentration that gives a CV below 25%.\
    \ Other parameters include the definition of false negative (FN), false positive\
    \ (FP), true negative (TN), and true positive (TP) reactions, based on the comparison\
    \ between qPCR and a gold standard that gives a trusted result. The diagnostic\
    \ sensitivity provides the probability that the qPCR will correctly classify as\
    \ reactive the positive samples and can be calculated as TP/(TP+FN). Conversely,\
    \ the diagnostic specificity provides the probability that the qPCR will correctly\
    \ classify as non-reactive the negative samples, and can be calculated as TN/(TN+FP).\
    \ The diagnostic sensitivity and specificity should not be confused with the analytical\
    \ sensitivity (LOD) and specificity (the capability of an assay to react only\
    \ with the target of choice). Moreover, the accuracy of the qPCR is defined as\
    \ the probability of correctly classifying the samples: (TP+TN)/(TP+TN+FP+FN).\n\
    \nThe precision of the qPCR is based upon repeatability and reproducibility; the\
    \ former is further subdivided into intra-assay and inter-assay repeatability.\
