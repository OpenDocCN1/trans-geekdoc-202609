    \ of the PCR are shaded using rectangles. In the continuation, all samples are\
    \ plotted and an arrow is used to show the maxim level of fluorescence attained.\n\
    \n```\n```\nRectangles and arrows are low-level graphical elements drawn with\
    \ the rect and arrows\nfunction, respectively. Lines can be plotted with the function\
