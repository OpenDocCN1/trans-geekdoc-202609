  - '[PAGE 63]


    actually meaningful. Visual inspection of the qPCR data is required alongside
    some precautions during the execution of the assay (Adams, 2006). The following
    is a quick list:


    +   - *Do not trust published sets.* Check sequence and melting temperature of
    published primer/probe sets for there might be printing mistakes in the articles
    at hand.

    +   - *Customize.* Optimize published PCR conditions to the equipment and chemistry
    at hand.

    +   - *Linearize plasmids.* It is customary to use plasmids as standards but,
    due to supercoiling, not all the molecules quantified will be available in for
    PCR. This will produce a bias in the quantification.

    +   - *Calculate the number of molecules of the standard template.* The initial
    copy number of the standard, N, can be calculated with the formula: N = MA/WL,
    where M is the mass in gram of the target, obtained for instance by spectrophotometry
    (e.g., with NanoDrop™ instrument); A is the Avogadro number (6.023 × 10²³ molecules/mole);
    W is the average weight of either dsDNA (660 g/mole/base) or ssDNA (330 g/mole/base);
    L the length of the ROI in bases. Once N is known, serial dilutions can be made
    to generate the standard curve.

    +   - *Include NTC.* Add a non-template control (NTC) to the qPCR run, preferably
    scattered around the plate. The NTC allows to check for possible spillage of material
    that could generate false-negative results. When quantifying RNA, controls without
    reverse transcriptase should be also added.

    +   - *Include a positive control.* The standard curve is already a positive control
    but the control should be as similar as possible to the actual samples being analyzed
    to take into account possible inhibitors present in the sample’s matrix. For instance,
    if the samples are obtained from serum or stools, the control should be obtained
    by spiking a known amount of standard into PCR-negative serum or stools.

    +   - *Check that the right light emission filters had been selected.* This test
    might seems a silly point, but many fluorescent dyes overlaps in their emission
    spectra. If the filter is not correctly set, there could be an overlooked loss
    of amplification signal resulting in unnoticed qPCR inhibition.'
  - '[PAGE 64]


    +   - *Set the baseline.* The baseline refers to the initial cycles of amplification
    that might generate a signal higher than a threshold. There is no fixed rule for
    defining the baseline, but it usually lies in the first ten cycles. As a rule
    of thumb, it should be three cycles before the lowest Cq. Usually, baselining
    is performed separately on each sample.

    +   - *Set the threshold.* The threshold refers to the light cut-off above which
    a signal is considered positive. Thermal-cyclers’ software automatically determine
    a threshold, usually based on a multiple of the standard deviation in the background
    light signal. Even in this case, there is not an established rule for setting
    the threshold. It is accepted to set the threshold as low as possible above the
    background signal, or manually adjust it in order to obtain the highest coefficient
    of determination in the standard curve or use inflection points of the second
    derivatives of the amplification signal. Nevertheless, the threshold should lie
    in the exponential phase of amplification and use the same level should be used
    for all reactions — at least within the same run.

    +   - *Visually observe the amplification curve.* If the difference between null
    and peak amplification is less than 0.5 units in the background-subtracted signal
    (ΔRn), then the amplification is only apparent. Also, amplification shapes that
    are not sigmoid indicate problems with the PCR that underlie non-reactive reactions.
    There might be instances where the passive dye is degraded whereas the reported
    dye remains constant (*drop*) or, conversely, where the reporter dye increases
    in a non-exponential fashion (*creep*).

    +   - *Check the intercept.* The ideal intercept should be between 33 and 37 cycles.
    If the intercept is outside this range, the template might have been degraded.

    +   - *Check the efficiency of the reaction.* Since this is linked to the slope
    (Equation 5), the slope should be between −3.2 and −3.5 for 100% efficiency of
    amplification.

    +   - *Check the fit of the data used for the standard curve.* The coefficient
    of determination (*r*²) should be above 98%.


    It is also useful to monitor the behavior of the qPCR over time. A plot of the
    efficiencies versus time should indicate that each run lies between one or two
    standard deviation from the mean. The following will provide an example.'
