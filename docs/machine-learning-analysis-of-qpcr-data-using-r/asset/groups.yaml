    To account for all the characteristics that define a given qPCR assay and allow
    a direct comparison among different assays, a minimum information for publication
    of quantitative real-time PCR experiments (MIQE) is required — although not yet
    widely adopted (Bustin et al., 2009). Such information include not only the primers’
    sequences but also many of the parameters listed in this section.


    # The Issues of the Fit-Point Method


    The fit-point is intuitive and easy to implement. Nevertheless, despite its wide
    application, the fit-point method suffers from some drawbacks (Yang and Rothman,
    2004). It assumes, for instance, that the efficiency of amplification is the same
    between the different reactions and constant throughout the course of the assay
    (Liu and Saint, 2002b). Even small differences in amplification efficiency can
    lead to tremendous errors in quantification that are oblivious to the fit-point
    method (Rutledge, 2004). Furthermore, Equation 2.5 and 2.6 hold only when the
    efficiency is kept constant (Rutledge and Côté, 2003).


    To give an idea of the error in measurement, let’s calculate the initial copy
    numbers of a certain ROI under different values of amplification efficiency. From
    Equation 4, the initial copy numbers are linked to the copy number at a certain
    amplification cycle in a way that is dependent of the efficiency of amplification:
    log(N0) = log(Nt) − log(E+1)Cq. Based on the preceding example, let’s assume that
    10⁶ ROI copies where reached at Cq = 9.96, and let’s calculate N0 for efficiencies
    of 100, 75, 50, and 25 percent:


    ```

    Nt <- 1000000


    Cq <- 9.96


    E <- c(1.000, 0.999, 0.990, 0.900, 1.100)


    log_N0 <- -((log(E+1)*Cq)+log(Nt))


    N0 <- 10^log_N0


    R0 <- N0/N0[1]


    percent_increase <- round(100 * ((N0-N0[1])/abs(N0[1])), 3)

    ```'
