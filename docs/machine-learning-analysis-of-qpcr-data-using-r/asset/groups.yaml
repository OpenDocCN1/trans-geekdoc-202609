    \ Kenneth Livak, Karin Deetz and colleagues at Perkin-Elmer/Applied Biosystems\
    \ found that two probes marked with a particular set of fluorescent dyes and hybridized\
    \ in close proximity could emit light (Heid et al., 1996). These approaches are\
    \ now known, respectively, as hydrolysis probes chemistry (commercialized as TaqMan™),\
    \ intercalator chemistry, and hybridization probes chemistry (or FRET, fluorescence\
    \ resonance energy transfer).\n\nThe first intercalator to be used was ethidium\
    \ bromide but, being carcinogenic, it has been substituted by other harmless dyes\
    \ such as SYBR Green™, RedSafe™, and EvaGreen™.\n\nThe intercalators are cheaper\
    \ than the probes and, although they are prone to attach to specific sequences,\
    \ the sequences they bind to are common enough on the DNA strand to confer effective\
    \ coverage of any amplicon (Bailly and Chaires, 1998). More importantly, intercalators\
    \ allow melting analysis to be performed. By gradually increasing the temperature\
    \ in the reaction vessel after the end of the PCR itself, the fluorescence emitted\
    \ by the amplicons decreases because the intercalators are displaced from the\
    \ DNA. When the temperature reaches the melting point (Tₘ) of the amplicon, the\
    \ duplex is dissolved very fast and the fluorescence drops suddenly. The plot\
    \ of the fluorescence against the temperature is that of a decreasing line that,\
    \ at the Tₘ, suddenly drops to zero. By taking the first derivative of this curve,\
    \ the graph is converted into a bell-shaped graph whose peak is Tₘ. In the presence\
    \ of primer dimers or other contaminants, the graph will show more than one peak.\
    \ The melting analysis, therefore, is used to confirm the specificity of the PCR.\n\
    \nOn the other hand, probes allow the simultaneous detection of multiple targets\
    \ (an approach known as multiplexing), which further expanded the PCR’s applications.\
    \ This improved PCR assay was first named ‘real-time’ because the results could\
    \ be read while the PCR was still ongoing rather than afterwards. Currently it\
    \ is better known as ‘quantitative’ (qPCR) because it allows the quantification\
    \ of the initial load of a sample. The next chapter will describe the quantification\
    \ procedure in more detail.\n\n## Listings\n\n```\nListing 1.1.\nThe counters\
    \ k (initial number of copies) and n (number of amplifications) are instantiated\
    \ and a repository array total_number_ROI, which is populated with k. New array's\
    \ elements are assigned to the vector through a for loop, so that the final array\
    \ will have n elements. Each array's element (apart the first) will contain the\
    \ square of the previous element. The array's elements are accessed by their indices\
    \ indicated by a number enclosed in squared brackets. The elements of the array\
    \ are printed on screen with the function print.\n\nVariables can be instantiated\
    \ directly with the assignment symbol '<-' that is equivalent to '=' in other\
    \ languages (and working also in R).\nR calls vectors what in other languages\
    \ are called 'arrays': collections of several values.\nVectors are then, in R,\
    \ uni-dimensional. A matrix is a two-dimensional vector.\nAn array is a three-dimensional\
    \ or multi-dimensional vector.\nAn empty vector can be instantiated with the function\
    \ vector(), likewise for matrices (matrix()), and arrays (array()). Populated\
    \ vectors are instantiated by concatenating different elements; the concatenating\
    \ function in R is c(). Matrices and arrays need additional information regarding\
    \ their dimensions.\n```\n"
