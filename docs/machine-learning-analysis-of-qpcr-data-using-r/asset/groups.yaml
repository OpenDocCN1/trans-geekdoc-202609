    \ >= early_TH_fcn) & (df$MR < TH_mr)], pch=1, cex=1.5)\npoints(df$MR[(df$FCN >=\
    \ early_TH_fcn) & (df$MR >= TH_mr)] ~\n    df$FCN[(df$FCN >= early_TH_fcn) & (df$MR\
    \ >= TH_mr)], pch=16, cex=1.5)\nsegments(0, early_TH_mr, early_TH_fcn, early_TH_mr,\
