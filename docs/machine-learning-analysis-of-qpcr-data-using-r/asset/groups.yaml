  - "[PAGE 35]\n\n(cont.) A. Comparison of actual amplification data and data generated\
    \ by the PCR function. To note how the simulated data define a much steeper curve\
    \ than the actual data. The insert shows the ever-increasing amplification. B.\
    \ The simulation using parameters obtained by regression is more laborious but\
    \ more accurate than the PCR function. The qPCR package provides an accurate alternative.\
    \ In panel A, the number of molecules is plotted against the amplification cycle.\
    \ In real life, though, the number of molecules cannot be counted but only assayed.\
    \ In panel B, light is used as a proxy to the number of molecules assuming that\
    \ light is proportional to the number of targets.\n\nIt can be seen in the insert\
    \ of Figure 1.2 that Equation 1 models a never-ending amplification. In reality,\
    \ the reaction will eventually stall. Liu et al. stated, therefore, that their\
    \ model was valid only for the initial phases of the PCR. As mentioned in the\
    \ preceding paragraphs, about 1 µM of primers corresponds to about 10^13 oligonucleotides,\
    \ hence only 10^13 amplicons can be generated; after that, the reaction simply\
    \ won’t go any further. The same applies for the triphosphate-nucleotides. In\
    \ addition, the DNA-pol will become inhibited by the byproducts of the amplification,\
    \ hence it will amplify with less and less efficiency at each cycle. To cut a\
    \ long story short, the EF at the end of the PCR will show samples with the same\
    \ quantity of amplicons. This type of PCR is known as ‘end-point PCR’. For simplicity,\
    \ this trajectory will be simulated by a logistic function, which increases exponentially\
    \ in the initial phases of the reaction but then goes to saturation in later phases,\
    \ just like in the PCR.\n\n```\nListing 1.3\nD <- 2\nK <- 10^13\nI <- 100\nROI\
    \ <- vector()\nfor (i in 2:45) {\n  ROI[i] <- ROI[i-1] * D * (1 - ROI[i-1]/K)\n\
    }\nprint(ROI)\nplot(1:45, ROI, xlab=\"Amplification cycle\", ylab=\"Number of\
    \ molecules\")\n```\n\nIn this script, D represents the rate of amplification\
    \ of the ROI, which is two because of the duplication characteristics of the PCR.\
    \ K represent the maximum amount of amplicons that can be produced, using the\
    \ number of primers as limiting reagent. The logistic term acts as follows. When\
    \ the number of amplicons is much lower than K, the ratio of ROI_t over K is about\
    \ zero, thus the number of ROI_{t+1} is about twice ROI_t. However, when the number\
    \ of amplicons approaches K, the ratio is one and the whole term"
