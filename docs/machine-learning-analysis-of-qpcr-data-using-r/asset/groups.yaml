  - '[PAGE 43]


    ![](img/7ea01e6937e09d043e45c73fff9eaed3_43_0.png)


    Figure 1.3. The concept of PCR threshold. The qPCR generates increasing levels
    of light and a threshold (cut-off) value can be defined to separate the background
    noise from the actual signals. The axes must be multiplied by 1000 (× 1000). A.
    The different PCR phases. Each dot represents the data collected at each amplification
    cycle. In this case, the ideal number of target molecules is considered. The PCR
    can be subdivided into three phases. In the initial step, the multiplication of
    target molecules is not enough to generate a clear signal. In the second phase,
    the amplicons (species a in Figure 1.1) are amplified exponentially and taken
    over as the reaction vessel’s main species. The light signal, therefore, increases
    rapidly. In the third phase, the depletion of reagents and the accumulation of
    inhibitors reduces the processivity of the DNA-pol, and the reaction reaches a
    plateau. B. The PCR profile is the same regardless of the initial template input.
    Using simulated data from samples with increasing amounts of the template shows
    that the number of templates increases until reaching a plateau value. At the
    end of the reaction, all samples will contain the same number of amplicons (arrow).
    The difference between samples is simply the time needed to reach the plateau:
    samples with higher template input will remain longer in the plateau phase than
    samples with low input. C. Blow up of panel B, showing how the different samples
    will reach a hypothetical threshold level (10⁶ molecules) at different times.
    Samples with high template input will reach the threshold faster than the samples
    with low input.


    The fact that the end-point PCR does not allow for the quantification of the targets
    is a major drawback of the assay, for determining the presence or absence of a
    target is an important achievement but, for modern purposes, limited in its applications.
    For instance, knowledge of a sample’s virus load is used to determine the effectiveness
    of an antiviral therapy. One could stop'
  - '[PAGE 44]


    the PCR well before reaching the saturation phase, let’s say after 20 cycles in
    the example, but:


    +   - The EF is a labor-intensive step that slows down the assay.

    +   - EF introduces risks of contamination and manual errors. The opening of a
    PCR tube containing amplified DNA is associated with a risk of dispersing drops
    of amplicons inside the laboratory. If the aerosol of amplicons ends up in new
    PCR tubes, it will induce false-positive results. This risk of contamination is
    a major issue for the PCR laboratories.

    +   - The results are still semi-quantitative because the quantification in obtained
    comparing the fluorescence of the target against that of special DNA ladders where
    each band contains a predetermined amount of DNA. However, the bands are few and
    contain a limited range of DNA concentrations, hence the quantification is very
    rough.


    The breakthrough in PCR was the introduction of signal detection during the course
    of the reaction itself. Such a ‘trick’ dispensed the used of the EF step, simplifying
    and speeding up the reaction. A research group composed by Pamela Holland and
    David Gelfand at Cetus (Holland et al., 1991) found that the 5′→3′ exonuclease
    activity of the DNA-pol could degrade an oligonucleotide hybridized in front of
    the enzyme. By binding a fluorescent dye and a quencher at the extremities of
    the oligonucleotide, such molecule (known as probe) would not radiate light because
    the photons emitted by the fluorescent molecule will be sequestered by the quencher.
    But, upon degradation of the probe by the DNA-pol during the extension time of
    the PCR, the fluorescent dye will be freed from the quencher activity and release
    photons in the reaction vessel that can be collected by an optical apparatus.
    At about the same time, the group formed by Russell Higuchi, Robert Griffith and
    colleagues at Roche reported that some intercalators (that is molecules that bind
    with high affinity with the DNA) could increase their fluorescence when bound
    to the dsDNA, so that each amplicon could release a certain amount of light at
    each cycle (Higuchi et al., 1992). Furthermore, Kenneth Livak, Karin Deetz and
    colleagues at Perkin-Elmer/Applied Biosystems found that two probes marked with
    a particular set of fluorescent dyes and hybridized in close proximity could emit
    light (Heid et al., 1996). These approaches are now known, respectively, as hydrolysis
    probes chemistry (commercialized as TaqMan™), intercalator chemistry, and'
  - '[PAGE 45]


    hybridization probes chemistry (or FRET, fluorescence resonance energy transfer).
    The first intercalator to be used was ethidium bromide but, being carcinogenic,
    it has been substituted by other harmless dyes such as SYBR Green™, RedSafe™,
    and EvaGreen™.


    The intercalators are cheaper than the probes and, although they are prone to
    attach to specific sequences, the sequence they bind to are enough common on the
    DNA strand to confer effective coverage of any amplicon (Bailly and Chaires, 1998).
    More importantly, intercalators allow to perform melting analysis. By gradually
    increasing the temperature in the reaction vessel after the end of the PCR itself,
    the fluorescence emitted by the amplicons decreases because the intercalators
    are displaced from the DNA. When the temperature reaches the melting point (Tₘ)
    of the amplicon, the duplex is dissolved very fast and the temperature drops suddenly.
    The plot of the temperature against the fluorescence is that of a decreasing line
    that, at the Tₘ, suddenly drops to zero. By taking the first derivative of this
    curve, the graph is converted into a bell-shaped graph whose peak is Tₘ. In presence
    of primers dimers or other contaminants, the graph will show more than one peak.
    The melting analysis, therefore, is used to confirm the specificity of the PCR.


    On the other hand, probes allow the simultaneous detection of multiple targets
    (an approach known as multiplexing) and that further expanded the PCR’s applications.
    This improved PCR assay was first named ‘real-time’ because the results could
    be read while the PCR was still ongoing rather than afterwards. Currently it is
    better known as ‘quantitative’ (qPCR) because it allows the quantification of
    the initial load of a sample. The next chapter will describe the quantification
    procedure more in detail.


    # Listings


    ```

    Listing 1.1.

    The counters k (initial number of copies) and n (number of amplifications) are
    instantiated and a repository array total_number_ROI, which is populated with
    k. New array''s elements are assigned to the vector through a for loop, so that
    the final array will have n elements. Each array''s element (apart the first)
    will contain the square of the previous element. The array''s elements are access
    by their indices indicated by a number enclosed in squared brackets. The elements
    of the array are printed on screen with the function print.


    Variables can be instantiated directly with the assignment symbol ''<-'' that
    is equivalent to ''='' in other languages (and working also in R).

    R calls vectors what in other languages are called ''arrays'': collections of
    several values.

    Vectors are then, in R, uni-dimensional. A matrix is a two-dimensional vector.

    An array is a three-dimensional or multi-dimensional vector.

    An empty vector can be instantiated with the function vector(), likewise for matrices
    (matrix()), and arrays (array()). Populated vectors are instantiated by concatenating
    different elements; the concatenating function in R is c(). Matrices and arrays
    need additional information regarding their dimensions.

