    \ 的动力学（2^n）也很简单，使得可以相对轻松地计算每个循环 n 的扩增子数量。不论原因如何，PCR 都是世界各地许多实验室的首选方法，既用于诊断也用于研究。实验的改进以实时提供结果，导致出现了一种允许精确定量靶分子的过程。该实验被称为定量\
    \ PCR（qPCR）。\n\n## 定量聚合酶链式反应（qPCR）实验\n\n判断 PCR 是否成功的最简单方法是分离扩增子进行电泳（EF）。该程序的优点是可以直接显示扩增子是否为预期大小，或者引物是否扩增了不需要的区域。第一个缺点是\
