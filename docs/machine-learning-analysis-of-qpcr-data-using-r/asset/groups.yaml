    \ 2))\n```\n\nAccuracy = 0.75 ± 0.04\nSensitivity = 0.54 ± 0.06\nSpecificity =\
    \ 0.95 ± 0.09\n\n在该测定区分阳性和阴性反应方面，灵敏度和特异性略有提高。不确定的反应可按如下方式检索：\n\n```\nListing 3.12\
    \ (continuation)\npred_prob = predict(mod, validation, type = \"probabilities\"\
