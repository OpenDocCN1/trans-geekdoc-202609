    \ ncol = 2, byrow=FALSE))\n    xgrid = as.data.frame(xmat)\n    names(xgrid) =\
    \ c(\"MR\", \"FCN\")\n    ygrid = predict(mod, xgrid)\n    xyz_dat = as.data.frame(cbind(xgrid,\
