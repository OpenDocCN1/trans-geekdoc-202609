    \ 0))\nplot(negative_fcn, negative_mr, ylim=c(0,0.5), xlim=c(0,41), cex=1.5,\n\
    \    xlab=expression(bold(\"FCN\")), ylab=expression(bold(\"MR\")))\npoints(positive_fcn,\
    \ positive_mr, pch=16, cex=1.5)\npoints(uncertain_fcn, uncertain_mr, pch=16, cex=1.5,\
    \ col=\"grey\")\nlegend(\"topleft\", legend = c(\"Positives\", \"Negatives\",\
    \ \"Uncertains\"), pch = c(16, 1, 16),\ncol=c(\"black\", \"black\", \"grey\"),\
    \ cex=0.8)\npar(mar=c(5.1, 0.2, 4.1, 2))\nd <- density(c(negative_mr, uncertain_mr,\
    \ positive_mr))\nplot(d$x, d$y, ylim=c(0,0.5), type=\"\", yaxs=\"n\", xaxs=\"\
    n\", main=NA, ylab=NA, xlab=NA)\npar(mar=opar)\n```\n\nFigure 3.1 shows that there\
