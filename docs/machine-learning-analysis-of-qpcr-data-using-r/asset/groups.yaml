  - "[PAGE 76]\n\nThe FCNA corrects for such a shift by combining FCN with the emission\
    \ ratio:\n\nFCNA = FCN − log₂(MR). (2.8)\n\nmaxRatio is implemented on the idea\
    \ that all the amplification response values are positive. In practice, the probe’s\
    \ signal is never completely quenched, and there should always be a positive background\
    \ fluorescence signal. As a result, it is critical to work with raw or normalized,\
    \ but not base-lined, responses. This is advantageous for maxRatio because the\
    \ base-lining process is prone to errors. When working with responses that have\
    \ very low background fluorescence or that have been base-lined, a reaction shift\
    \ can be used to avoid potential division by zero. This shifting, however, limits\
    \ maxRatio’s self-normalization property. An MR threshold can be set to distinguish\
    \ reactive from non-reactive reactions. This threshold is commonly generated during\
    \ the qPCR assay’s setup step by multiplying the MR standard deviation of non-reactive\
    \ responses (negative samples) by a predetermined number (typically 5 or 10).\
    \ This threshold, once established, can be maintained throughout the analysis.\
    \ Changing the MR threshold, unlike the fit-point threshold, has no effect on\
    \ the related quantitative cycle. This occurrence can be visualized as follows\
    \ (Figure 2.6):\n\n```\nListing 2.8\npar(mfrow=c(2,1))\nnegative_mr <- runif(10,\
    \ 0, 0.099)\nnegative_fcn <- runif(10, 5, 25)\npositive_mr <- runif(10, 0.2, 0.5)\n\
    positive_fcn <- runif(10, 15, 35)\nplot(negative_fcn, negative_mr, ylim=c(0, 0.5),\
    \ xlim=c(0,35), cex=1.5,\n    xlab=expression(bold(\"FCN\")), ylab=expression(bold(\"\
    MR\")))\npoints(positive_fcn, positive_mr, pch=16, cex=1.5)\nabline(h=0.1)\nabline(h=0.2,\
    \ lty=2)\nabline(v=min(positive_fcn), lty=3)\narrows(0, 0.1, 0, 0.2)\ntext(0,\
    \ 0.48, \"A\", font=2, cex=3)\nA <- PCR(1000000, 2, 10^13)\nplot(1:length(A),\
    \ A, xlim=c(0,35), cex=1.5, type=\"b\", yaxt=\"n\", xlab=expression(bold(\"Cq\"\
    )),\n    ylab=expression(bold(\"Fluorescence\")))\naxis(side=2, las=2, at=c(0,\
    \ 1e12, 2e12, 3e12, 4e12, 5e12), lab=c(0, 1, 2, 3, 4, 5))\nTH <- (10^12)*(0.5*10^11)\n\
    abline(h=TH)\nabline(v=20, lty=3)\nabline(h=2*TH, lty=2)\n```"
