    通过机械或化学方法获得。前者通过研磨、珠磨、加热或超声处理进行；后者则使用酶、离液剂（一类扰乱脂双层疏水结构的分子）或去污剂。根据实验方案，可组合使用多种方法。核酸一旦离开细胞，就容易被核酸酶降解，尤其是RNA。因此，提取环境通常含有保护遗传物质的关键成分。阳离子（如Na⁺）通过与核酸的负电荷结合来稳定核酸。螯合剂（如乙二胺四乙酸，EDTA）可去除核酸酶辅因子离子（如Mg²⁺）。还原性化合物（如β-巯基乙醇，βMe）通过改变酶（即核酸酶）的二硫键来抑制其活性。蛋白酶（如蛋白酶K）被添加以去除可能隔离核酸的蛋白质结构。


    - *结合。* 核酸被吸附到聚合物、微珠或凝胶等固体结构上。其余细胞碎片与固体结构的亲和力较低，将被洗去。含有poly-A片段的结构可特异性固定mRNA。

    - *清洗。* 细胞破碎过程中产生的细胞碎片会干扰核酸的回收。由于不同细胞组分的密度不同，离心提供了将核酸与其他细胞器分离的最简便方法。密度梯度离心法（DGC）于20世纪50年代建立（Meselson
    et al., 1957）。该方法将低分子量（MW）物质（最常见的是氯化铯，CsCl）在试管内高速离心，使其密度沿试管长度方向逐渐增大。与CsCl一同离心的大分子将分布在该梯度中离心力与介质密度相平衡的狭窄区域内。其结果是，诸如细胞裂解液中的大分子混合物可被分离成一系列条带，每条条带对应一种特定的细胞器。将DGC与溴化乙锭（EtBr）结合，EtBr是一种在与DNA特异性结合后发出荧光、从而可特异识别DNA条带并通过注射器回收的分子。数十年来，DGC-EtBr一直是常规实验室操作。尽管仍在使用，但DGC-EtBr已被更省力的技术所取代，这些技术更多地依赖提取流程的后续两个步骤。


    et al., 1989）。这些标记包括放射性同位素（能像光一样在照相胶片上感光），而在近代已被荧光染料或生物素所取代。例如，早期旨在证明宫颈癌样本中存在人乳头瘤病毒的研究，依赖于从其他癌症样本中纯化获得的放射性标记探针（Boshart
    et al., 1984）。


    靶核酸与探针之间的杂交是研究和诊断的基本工具。杂交可在细胞内直接进行，若探针连接了荧光团，则该过程称为荧光原位杂交（FISH）。FISH通常通过显微镜评估，这是一种低通量方法，但其最大的问题是灵敏度——每个细胞必须含有大量靶标才能产生可见的荧光。解决ISH不足的一个方案是电泳（Kroczek,
    1993）。通过电泳，来自一组细胞的基因组采用物理或化学方法进行分离。随后，片段在电场中迁移，通常在聚丙烯酰胺基质（但琼脂糖也很常用）上实现片段的高分辨率分离。这种电泳形式称为PAGE。尿素或甲酰胺用于变性核酸的三维结构，促进其迁移（Summer
    et al., 2009; Petrov et al., 2013）。随后，片段用嵌入性染料（如EtBr）染色。PAGE产生一系列条带，类似于条形码（指纹），可用于特异性鉴定物种。PAGE适用于细菌基因组等小型基因组，但对人类基因组而言则较为繁琐。为减少条带数量，可使用探针。这样，只有与探针结合的靶基因组部分能被可视化。为改善探针与靶核酸的退火，片段被转移到尼龙膜上。探针用酶标记以显示杂交体，该过程分别称为Southern（针对DNA靶标）或Northern（针对RNA）印迹（Kroczek,
    1993; Southern, 2000）。


    由于几乎每种生物的基因组中都存在多态性区域（即特定物种所特有的区域），扩增这些区域可提供进行酶切分析所需的灵敏度。这些多态性区域通常由重复区域构成，其重复次数具有物种特异性（van
    Belkum, 1994）。例如，大肠杆菌和鼠伤寒沙门氏菌等细菌具有重复性基因外回文序列（REP）和肠杆菌科重复基因间一致性序列（ERIC），而人类则携带可变数目串联重复序列（VNTR）（Jeffreys
    et al., 1985）和微卫星序列（重复数千次的短核苷酸片段）（de la Chapelle, 2003），这使得能够区分不同个体，为法医学带来了巨大益处。尽管有了这些改进，印迹法仍可能面临灵敏度问题。解决这一不足有两种方案：要么放大信号，要么放大靶标。


    假设一个检测系统的灵敏度为一百万任意光单位，而探针在与靶标结合时只能发射一个光单位。再假设样本中只有10个靶标。按此计算，探针结合只能产生10个光单位，因此检测结果为阴性。要获得阳性信号，信号本身或靶标必须以某种方式被放大。


    实现信号放大的一种方法是退火一个接头分子，该接头包含一个与目标区域（ROI）结合的位点，以及多个可被探针识别的其他部分。例如，如果一个接头能结合10⁵个探针，那么假设的10个靶标——每个靶标有一个接头结合位点——将产生一百万光单位。使用这种方法的最知名技术之一是分支DNA（bDNA），例如用于病毒诊断（Wilber,
    1997; Tsongalis, 2006）。bDNA检测的流程大致类似于ELISA，其灵敏度可与PCR相当（Collins et al., 1997）。


    其他信号放大方法基于探针的直接聚合（Yan et al., 2014）（表1）。在这种情况下，每个靶标将成为合成多个探针的模板，从而迅速达到阳性结果的阈值。这些酶促方法在相同温度下进行，因此被归类为等温过程。其中最流行的方法之一是核酸序列依赖性扩增（NASBA），也称为自持序列复制（3SR）（Deiman
    et al., 2002）。与PCR类似，NASBA使用引物。其中一条引物带有尾部，包含一段被来自T7噬菌体的DNA依赖性RNA聚合酶（DdRp）识别的启动子序列。该引物由来自禽成髓细胞瘤病毒（AMV）的RNA依赖性DNA聚合酶（RdDp，即逆转录酶）延伸。新合成的DNA/RNA杂交体被大肠杆菌RNase
    H降解，该酶去除原始单链RNA，留下新合成的单链DNA。后者与第二条引物退火，该引物被逆转录酶延伸，产生带有完整T7启动子序列的双链DNA片段。该启动子被DdRp识别，后者开始转录新的RNA分子，这些RNA分子又成为新一轮扩增的模板。与PCR不同，靶标


