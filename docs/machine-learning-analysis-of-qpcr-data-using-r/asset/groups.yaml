    \ <- find_cycle(A4, 1:45, 25)\ncq_5 <- find_cycle(A5, 1:45, 23)\ncq_6 <- find_cycle(A6,\
    \ 1:45, 20)\nSample <- c(rep(\"s1\", 45), rep(\"s2\", 45), rep(\"s3\", 45), rep(\"\
    s4\", 45), rep(\"s5\", 45), rep(\"s6\", 45))\nCqs <- c(rep(cq_1, 45), rep(cq_2,\
    \ 45), rep(cq_3, 45), rep(cq_4, 45), rep(cq_5, 45), rep(cq_6, 45))\nCycle <- rep(1:45,\
    \ 6)\nFluorescence <- c(A1, A2, A3, A4, A5, A6)\nStdCv <- data.frame(Sample, Cqs,\
    \ Cycle, Fluorescence)\nshades <- c(\"gray0\", \"gray20\", \"gray40\", \"gray60\"\
