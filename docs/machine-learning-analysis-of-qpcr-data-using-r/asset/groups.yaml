    pt.lwd\nline width.\ntitle\na string giving a title to be placed at the top of\
    \ the legend.\ntitle.col\ncolor for title.\n```\n\n## Listing 1.3\n\nThe listing\
    \ simulates the reduction in copy number amplification observed in actual PCR.\
    \ A given amount of initial template stored in the variable I is duplicated at\
    \ a rate defined by the variable D (in this case the duplication is considered\
    \ perfect) and with a carrying capacity defined by K. The copy numbers are stored\
