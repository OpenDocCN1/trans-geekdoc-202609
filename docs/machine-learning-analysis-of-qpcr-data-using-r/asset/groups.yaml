    \ x or y axis. The default value (NULL) links these to the major ticks of the\
    \ axis. The y value is optional, forcing y = x.\n```\n\n## Listing 3.7.\n\nA new\
    \ directory data is created to store in an ordered way the files that will be\
    \ required for the k-means classification. The analysis is limited to the reactions\
    \ where the raters agreed, which is obtained by indexing the data frame so that\
    \ the uncertain reactions are excluded (df$label != \"Uncertain\"). The k-means\
    \ validation is obtained by generating 10 sets of data frames, stored in the new\
    \ folder data. Each set contains a training data frame with 80% of the reactions\
    \ and a testing data frame with 20% of the data. These sets contain the identification\
    \ numbers of each reaction (index). The data sets are saved as RDS objects as\
    \ an alternative to textual files and to reduce space in the hard disk.\n\nSince\
    \ the column label originally contained three levels (positive, negative, and\
    \ uncertain) but now only has two levels (positive, and negative), the factors\
    \ are overwritten with only two levels.\n\nTo give an example of the procedure,\
    \ only the first set of data I loaded into memory using the variable i. The reactions\
    \ with the index included in the testing data set are selected and stored in a\
    \ new data frame (train_set); the same is done for the testing set. A new column\
    \ is made by assigning 'negative' to the reactions without fluorescent signal,\
