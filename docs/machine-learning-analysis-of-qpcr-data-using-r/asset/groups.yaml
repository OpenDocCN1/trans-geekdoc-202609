    # Listing 3.7.


    A new directory data is created to store in an ordered way the files that will
    be required for the k-mean classification. The analysis is limited to the reactions
    where the raters agreed, which is obtained by indexing the data frame so that
    the uncertain reactions are excluded (df$label != "Uncertain"). The k-mean validation
    is obtained by generating 10 sets of data frames, stored in the new folder data.
    Each set contains a training data frame with 80% of the reactions and a testing
    data frame with 20% of the data. These sets contain the identification numbers
    of each reaction (index). The data sets are saved as RDS objects as an alternative
    to textual files and to reduce space in the hard disk.


    Since the column label originally contained three levels (positive, negative,
    and uncertain) but now only has two levels (positive, and negative), the factors
    are overwritten with only two levels.


    To give an example of the procedure, only the first set of data I loaded into
    memory using the variable i. The reactions with the index included in the testing
    data set are selected and stored in a new data frame (train_set); the same is
    done for the testing set. A new column is made by assigning ''negative'' to the
    reactions without fluorescent signal, otherwise ''positive''; the classification
    is stratified by label.


    ```

    The function dir.create creates a new directory in a specified path. An alternative
    to store tables is to use R objects; these are compressed files that are read
    faster into memory and maintain additional characteristics such as levels. The
    R objects are written and read wit saveRDS and readRDS, respectively, and have
    the extension ''.rds''.

    The function round rounds a fractional number to a specified decimal value. The
