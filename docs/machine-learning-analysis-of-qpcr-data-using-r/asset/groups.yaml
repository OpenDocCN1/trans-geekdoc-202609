    negative\"], ylim=c(0,0.5), xlim=c(0,41),\n    cex=1.5, xlab=expression(bold(\"\
    FCN\")), ylab=expression(bold(\"MR\")))\npoints(df$MR[df$GROUP==\"positive\"]\
    \ ~ df$FCN[df$GROUP==\"positive\"], pch=16, cex=1.5)\npoints(df$MR[df$GROUP==\"\
    uncertain\"] ~ df$FCN[df$GROUP==\"uncertain\"], pch=16, cex=1.5,\n    col=\"grey\"\
    )\npoints(df$MR[df$GROUP==\"spike\"] ~ df$FCN[df$GROUP==\"spike\"], pch=15, cex=1.5,\
    \ col=\"gray40\")\nlegend(\"topleft\", legend = c(\"Positives\", \"Negatives\"\
    , \"Uncertains\", \"Early spike\"),\n    pch = c(16, 1, 16, 15), col=c(\"black\"\
    , \"black\", \"grey\", \"gray40\"))\n```\n\n对数据的目视检查（图 3.2A）显示，在 FCN = 10 处样本分布存在差异。这种分割显然首先是由于本例数据的生成方式所致，但真实数据集也存在类似的不连续性（Marongiu\
    \ 等，2016a；Marongiu 等，2021a）——并且该数据的设计就包含了这种分割。FCN = 10 可用于进一步对反应进行分层：低于此值的样本将有一个\
