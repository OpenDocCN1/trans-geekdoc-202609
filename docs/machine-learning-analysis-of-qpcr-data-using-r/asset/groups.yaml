  - "[PAGE 126]\n\n```\nset.seed(n)\n  n\n  an integer.\nlayout(x, widths, heights,\
    \ ...)\n  x\n  matrix specifying the number of rows and columns of the plot.\n\
    \  widths, heights\n  vector specifying the width of columns or the heights of\
    \ rows.\ndensity(x, bw, adjust, kernel, na.rm = FALSE, ...)\n  x\n  a data vector.\n\
    \  bw, adjust\n  band-width of the plot either alone or modified by the multiplier\
    \ 'adjust'.\n  kernel\n  the method used to produce the density plot (\"gaussian\"\
    , \"epanechnikov\", \"rectangular\", \"triangular\", \"biweight\", \"cosine\"\
    , \"optcosine\")\n  na.rm\n  logical determine whether to exclude NA values.\n\
    normalmixEM(x, lambda, mu, sigma, k, epsilon, maxit, maxrestarts, verb, ...)\n\
    \  x\n  data vector.\n  lambda, mu, sigma\n  initial values of mixing proportions,\
    \ component means, and standard deviations.\n  k\n  number of components.\n  epsilon\n\
    \  the convergence criterion.\n  maxit, maxrestarts\n  maximum number of iterations\
    \ and allowed restarts.\n  verb\n  logical activating the verbose mode.\n```\n\
    \n# Listing 3.2.\n\nSince real-life data from qPCR display high fluorescence at\
    \ low amplification cycles, ten elements are added to the simulation from the\
    \ previous listing. All the generated data in this and the previous listing are\
    \ stored in the data frame df, which is then plotted coloring the data according\
    \ to their groups (positive, negative, uncertain).\n\nThe threshold to separate\
    \ the reactive and non-reactive reactions is obtained by using the model object\
    \ generated by normalmixEM (listing 3.1). Specifically, the standard deviation\
    \ from the mean MR value of the second population (the non-reactive) is used as\
    \ a threshold (model$sigma[2]). The samples with high fluorescence at low amplification\
    \ cycles will be above such threshold, thus, a second threshold is set-up by considering\
    \ that visual inspection or data exploration indicated that these samples have\
    \ an FCN below 10. The thresholds are depicted on he plot with the segments functions.\n\
    \n# Listing 3.3.\n\nLabel are generated based on the thresholds store in the variables\
    \ early_TH_fcn, early_TH_mr, and cut-off. The labels are stored into variables\
    \ that are combined in the data frames A_df and B_df defining the populations\
    \ A and B, respectively. The data are plotted and the hyperplane is depicted by\
    \ one main segment (abline(0.32, -0.007, lwd=3)) and two margins (abline(0.29,\
    \ -0.007, lty=2) and abline(0.35, -0.007, lty=2)). The custom function y calculates\
    \ the distance between the support vectors and the hyperplane.\n\nIt is possible\
    \ to write single line function (known in other programming languages as lambda\
    \ or anonymous functions) that implements a simple if... else statement. The value\
    \ returned from the one liner function can be stored into an object with the following\
    \ syntax:\nvariable <- function(parameters) (return (if(parameters)))\nvariable\
    \ <- ifelse(condition, value_if_true, value_if_false)\nIn the first case, a computation\
    \ based on the values present in parameters is returned. For instance, f(x) =\
    \ a * b+c, when x = [a, b, c]. In the second case, variable takes either value\
    \ if true or value if false according to the result of the condition clause. For\
    \ instance, a <- ifelse(x>0, \"positive\", \"negative\") applied to x <- c(-2,\
    \ -1, 0, 1, 2) will return a = [\"negative\" \"negative\" \"negative\" \"positive\"\
    \ \"positive\"]."
