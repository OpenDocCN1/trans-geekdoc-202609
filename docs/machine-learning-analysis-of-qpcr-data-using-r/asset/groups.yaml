    number of built-in statistical function and many additional specific functions
    through packages. Among the simplest are the average (mean) and standard deviation
    (sd) functions. A plot can be stored in a file rather than just being printed
    on the screen. The graphic device png saves the figure as Portable Network Graphics
    but other popular choices are jpeg and tiff.

