    \ FCN 的反应样本。注意它们都具有与低模板输入兼容的扩增曲线，表明该组包含真正无反应的反应。该聚类中的所有样本均被 SVM 分类为阴性。相反，第二个面板显示来自中央聚类的反应显示有反应的扩增曲线。该聚类中的所有样本均被\
