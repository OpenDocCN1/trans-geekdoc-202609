    # Filtering maxRatio with Support-Vector Machine


    Support-vector machines (SVM) are supervised learning models used for classification
    and regression analysis as part of machine learning algorithms. SVM was developed
    at AT&T Bell Laboratories by Vladimir Vapnik and colleagues between 1960s and
    the 1990s (Cortes and Vapnik, 1995). SVM, in essence, finds a separation line
    (‘maximum margin hyperplane’ or simply hyperplane) between groups of samples known
    as items or elements. Linearly separable groups are non-overlapping groups. The
    SVM algorithm finds the hyperplane with the greatest degree of separation between
    the groups, meaning that the least number of elements from one group will be re-classified
    in the other group. Instead of using all elements from each group, SVM uses a
    subset of items closest to the hyperplane, which reduces the procedure’s complexity
    and computational requirements. When the groups are not linearly separable, SVM
    applies ‘margins’: some of the elements in proximity of the hyperplane are allowed
    to be clustered in the opposite group. The proportion of samples that can be ‘misclassified’
    is defined by a cost parameter C, corresponding to the width of the margins around
    the hyperplane. The following section will describe the SVM algorithm more in
    detail.


    To use the example given in the previous section, samples stratified according
    to the EM-derived thresholds will be assigned to either group A or B. This initial
    classification designate the term ‘supervised’: the operator supervises the procedure
    by assigning labels to each element; the machine, then, will improve the classification
    based on some algorithm. Supervised learning approaches are opposed to the ‘unsupervised’
    models (such as neural networks and hierarchical clustering), which do not require
    any'
  md: "\n## Chapter 3\n### Application of Machine Learning to maxRatio qPCR Analysis\n\
    \n### Filtering maxRatio with the Expectation-Maximization Method\n\nAs for the\
    \ fit-point method, also maxRatio necessitates the establishment of a threshold\
    \ to distinguish between reactive (positive) and non-reactive (negative) reactions\
    \ (samples). As mentioned in the preceding section, this threshold was determined\
    \ by multiplying by 5–10 the standard deviation of the MR values of a set of negative\
    \ samples (Shain and Clemens, 2008). The scale of the multiplier was the operator’s\
    \ choice. Recently, however, attempts were made to improve the procedure by providing\
    \ an objective separation of the samples. The objectivity of the procedure, in\
    \ this context, means that the operator would not choose a value — statistical\
    \ methods will select the best parameters according to the data at hand. Such\
    \ an objective approach, in theory, would provide an analytical tool specific\
    \ for the qPCR assay at hand, compensating for possible inhibitors in the samples’\
    \ matrices, performances of the chemical used, and quirks of the thermal-cyclers.\
    \ Unlike the fit-point method, maxRatio allows the use of multiple thresholds\
    \ to stratify the samples into specific subclasses (for instance, weakly reactive\
    \ positive samples).\n\nA first approach towards data-oriented setting of the\
    \ threshold was the implementation of the expectation-maximization (EM) algorithm\
    \ (Marongiu et al., 2016a). The EM algorithm identifies peaks in sample distribution\
    \ and then a cut-off to separate them (Dempster et al., 1977). The following listing\
    \ will describe this procedure:\n\n```\nListing 3.1\nset.seed(15)\nopar <- par(\"\
    mar\")\nnegative_mr <- runif(50, 0, 0.099)\nnegative_fcn <- runif(50, 1, 40)\n\
    positive_mr <- c(runif(30, 0.2, 0.5), runif(20, 0.4, 0.5))\npositive_fcn <- c(runif(30,\
    \ 25, 40), runif(20, 10, 25))\nuncertain_mr <- runif(10, 0.099, 0.2)\nuncertain_fcn\
    \ <- runif(10, 25, 40)\nlayout(matrix(c(1,2),nrow=1), widths=c(4,1))\npar(mar=c(5.1,\
    \ 4.1, 4.1, 0))\nplot(negative_fcn, negative_mr, ylim=c(0,0.5), xlim=c(0,41),\
    \ cex=1.5,\n    xlab=expression(bold(\"FCN\")), ylab=expression(bold(\"MR\")))\n\
    points(positive_fcn, positive_mr, pch=16, cex=1.5)\npoints(uncertain_fcn, uncertain_mr,\
    \ pch=16, cex=1.5, col=\"grey\")\nlegend(\"topleft\", legend = c(\"Positives\"\
    , \"Negatives\", \"Uncertains\"), pch = c(16, 1, 16),\ncol=c(\"black\", \"black\"\
    , \"grey\"), cex=0.8)\npar(mar=c(5.1, 0.2, 4.1, 2))\nd <- density(c(negative_mr,\
    \ uncertain_mr, positive_mr))\nplot(d$x, d$y, ylim=c(0,0.5), type=\"\", yaxs=\"\
    n\", xaxs=\"n\", main=NA, ylab=NA, xlab=NA)\npar(mar=opar)\n```\n\nFigure 3.1\
    \ shows that there are two main peaks of sample density, one for the positive\
    \ and one for the negative samples. The EM algorithm establishes the best cut-off\
    \ between these two peaks. Specifically, a mixture model for parametric distributions\
    \ is built using the library mixtools. The summary of the model provides the characteristics\
    \ of the parameters describing the two overlapping distributions (that of the\
    \ positive and the negative samples). It is also possible to plot the density\
    \ of these populations.\n\n![](img/7ea01e6937e09d043e45c73fff9eaed3_87_0.png)\n\
