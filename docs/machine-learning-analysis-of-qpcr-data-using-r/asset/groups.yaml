  - "[PAGE 103]\n\nEssentially, the description of the data remains the same but there\
    \ are now 5040 data points instead of 5304 and the amplification is performed\
    \ within 42 cycles. Data exploration is an essential preparatory step that cannot\
    \ be overlooked. Only when data has been cleaned it is possible to proceed to\
    \ the actual analysis.\n\nThe first step in the maxRatio analysis is to generate\
    \ the MR/FCN values for each reaction, employing the mrCalc function defined in\
    \ the preceding sections. Since the SIV data was characterized by a high background\
    \ (that is the lowest fluorescence values had already a high number), a compensation\
    \ was introduced by setting the ‘background_compensation’ parameter to increase\
    \ the MR values. Without such correction, the MRs would have been very small and\
    \ could have introduced bias. The correction is, however, optional. Data visualization\
    \ will employ the lattice package; the plot will not be plot immediately but save\
    \ on an object P that is then drawn with the call print(P) (Figure 3.5).\n\n```\n\
    Listing 3.5\nMRs = vector()\nFCNs = vector()\nfor(i in unique(validation$Run)){\n\
    \    run <- subset(validation, Run == i)\n    for(j in run$Well) {\n        well\
    \ <- subset(amplification, Run == i & Well == j)\n        x <- mrCalc(well$Cycle,\
    \ well$FAM, background_compensation = 1000)\n        MRs <- append(MRs, x[1])\n\
    \        FCNs <- append(FCNs, x[2])\n    }\n}\nvalidation$MR <- MRs\nvalidation$FCN\
    \ <- FCNs\nlibrary(lattice)\nP <- xyplot(MR ~ FCN, group = Content, data = validation,\
    \ cex=1.5, pch=c(0, 0, 1, 4), col = \"black\",\n    key = list(space=\"top\",\
    \ columns=3, col = \"black\", points=list(pch=c(0, 1, 4), col=\"black\"),\n  \
    \  text=list(c(\"Neg Ctrl/NTC\", \"Pos Ctrl\", \"Unkn\"))))\nprint(P)\nCOLS =\
    \ ifelse(is.na(validation$FAM) == TRUE, 1, 16)\nplot(MR ~ FCN, validation, cex=1.5,\
    \ pch=COLS, xlab=\"FCN\", ylab=\"MR\")\nlegend(\"topleft\", legend = c(\"Positives\"\
    , \"Negatives\"), pch=c(1,16))\nwrite.table(validation, file = \"validationCleaned.tsv\"\
    , append = FALSE)\n```"
