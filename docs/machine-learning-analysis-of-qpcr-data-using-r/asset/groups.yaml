  mdcn: "\n片段，并且在聚合酶活性中起核心作用。该结构域还具有转移酶能力，并在片段末端添加一个非模板残基（通常是腺嘌呤）。这种额外的 A 在克隆操作中非常有用，因为它可以与克隆载体上的突出胸腺嘧啶配对。\n\
    \nTaq-pol 现在已被改造可在大肠杆菌中生产（Lawyer et al., 1989）。然而，Taq-pol 的保真度不高（每百万次插入会引入八个错配核苷酸），而高保真耐热\
    \ DNA 聚合酶已从其他生物体中分离出来，例如古菌 Pyrococcus furiosus（Pfu，每百万次插入引入一个错误的 dNTP）（Cline et\
    \ al., 1996）。此外，Taq-pol 可以掺入修饰的 dNTP；这一特性被用于用例如地高辛或生物素标记合成的 DNA。\n\nTaq-pol 接受的\
    \ dNTP 范围广泛的另一个例子是尿嘧啶插入。通过用 Us 替代 Ts，可以使合成的 DNA 受到尿嘧啶 N-糖苷酶（UNG）处理的敏感：被消化后的 DNA\
    \ 将降低从一次反应到后续反应中携带污染的风险。几种耐热 DNA 聚合酶已从微生物中分离出来，但近年来，诱变被用于专门增强酶的特性，例如提供更高的过程性或保真度（Kermekchiev\
    \ et al., 2003; Raghunathan and Marx, 2019）。\n\n- *一组寡核苷酸（引物）*。所有 DdDp 都需要引物来启动\
    \ DNA 靶标的复制。在天然条件下，DNA 依赖性 RNA 聚合酶（DdRp，或 primase）会合成一段与启动子部分互补的短单链片段，从而启动该过程，因为\
    \ DdDp 会向该片段添加核苷酸。寡核苷酸合成生产的生化领域改进弥补了 RNA-pol。引物通常以 0.1-1.5 μM 的浓度提供，数量级为 10¹³\
    \ 个分子。所有引物延伸完毕后，反应将停止，10¹³ 个引物大约可维持约 30 个循环。熔解温度 Tₘ 是使至少一条链为寡核苷酸的 DNA 链的 50% 熔解的温度（Wetmur,\
    \ 1991）。\n\n- *对感兴趣区域序列的了解*。合成引物的作用不仅在于启动聚合反应，还在于提供特异性：引物的正确选择可以决定一个实验是好是坏。良好实验最重要的特征之一就是特异性：实验只有在样品中存在靶标时才应给出阳性结果。与与靶标相似（但不相关）的序列发生交叉反应会使实验不可靠。在基因组中鉴定一段\
    \ n 个核苷酸的概率如下获得。首先根据公式确定鉴定结合位点 K 的概率（Nei and Li, 1979）：K = (g/2)^{G+C} × 2^{-1}(1-g)^{A+T}\
    \ 其中 g 为序列中 G 和 C 的相对频率，G+C 和 A+T 为这些核苷酸的数量。然后在长度为 N 的给定基因组中找到该序列的实际概率 n 由下式给出：n\
