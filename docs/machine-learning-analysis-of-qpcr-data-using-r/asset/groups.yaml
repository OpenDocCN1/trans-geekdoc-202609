    \ addition, the DNA-pol will become inhibited by the byproducts of the amplification,\
    \ hence it will amplify with less and less efficiency at each cycle. To cut a\
    \ long story short, the EF at the end of the PCR will show samples with the same\
    \ quantity of amplicons. This type of PCR is known as ‘end-point PCR’.\n\n**Listing\
    \ 1.3**\n\n```r\nD <- 2\nK <- 10^13\nI <- 100\nROI <- vector()\nfor (i in 2:45)\
