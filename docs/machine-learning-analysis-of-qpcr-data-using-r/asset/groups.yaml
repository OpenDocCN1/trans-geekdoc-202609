  - '[PAGE 93]


    More in detail, the listing shows that the two groups are clustered away one another
    with sufficient breath, allowing their separation by a straight line (Figure 3.3).
    The identification of the line was done by visual inspection of the plot as follows.
    By observing that a line pointing at an intercept of 0.32 MR could split the data
    in two groups, it is possible to identify a possible slope. Since the difference
    in MR values passed from about 0.20 at FCN = 20 to 0.29 at FCN = 10, it was possible
    to estimate the slope of the separating line as Δy/Δx = −0.09/10 = −0.009. Further
    adjustment by trial and error identified the values used in the example. Further
    data exploration allowed the selection of suitable support vectors (s1-s6).


    ![](img/7ea01e6937e09d043e45c73fff9eaed3_93_0.png)


    Figure 3.3. Overview of the support vector machine procedure. The support vector
    machine (SVM) is a supervised learning model, which means that it must run on
    pre-classified groups. There were two groups in this case: A (●) and B (○). The
    algorithm (kernel) finds a separation line between the groups known as a hyperplane
    (thick line) that maximizes the allocation of samples within their original group.
    In this case, the hyperplane divides the plot into two parts (upper and lower),
    locating the most elements of group A in the upper part of the plot and the most
    elements of group B in the lower part of the plot. To reduce computing labor,
    the kernel uses only a subset of the elements known as support vectors (highlighted
    here by squares). Therefore, the procedure reduces to the minimization of the
    distances between the hyperplane and the support vectors (dotted lines), akin
    to regression analysis. The model also provides for some flexibility in the classification
    process, which means that the items within the margins (dashed lines) are ignored
    during the classification process. The end product of the SVM analysis is that
    the points above the hyperplane will be classified as belonging to group A. Conversely,
    those below will be placed into group A.'
  - '[PAGE 94]


    Another notable aspect of SVM is that the hyperplanes do not have to be straight
    lines; they can instead be curves and extend in three dimensions. Tridimensional
    clusters can be linearized using the so-called ‘kernel trick’, which also allow
    to distinguish nonlinearly separable groups. The most common kernels used by SVM
    are linear (used for the linearly separable cases), polynomial, sigmoid, and Gaussian.
    Moreover, SVM allows for the definition of more than one group. Looking again
    at Figure 3.3, it is evident that using a curve capable of ‘wrapping’ the positive
    samples will avoid classifying the negative samples at high FCN as reactive. Furthermore,
    a classification procedure that could identify the samples designated as ‘uncertain’
    in Figure 3.1-3.2 would substantially simplify the validation process by allowing
    the operator to focus solely on unsatisfactory reactions.


    An attempt to apply SVM to the analysis of qPCR data was carried out (Marongiu
    et al., 2021a). The re-analysis of the 15,744 previously classified by maxRatio
    plus EM filtering (Marongiu et al., 2016a) showed that the combination maxRatio/SVM
    increased the accuracy of detection of positive and negative reactions from 99.6%
    to 100%, and the PPV from 96.5% to 99.9% in comparison to the fit-point method.
    In addition, the combination maxRatio/SVM detected 35 samples as suboptimal, implying
    that only 0.2% of the whole data set required actual validation through visual
    inspection. With a PPV of nearly 100%, the remaining reactions could be validated
    without the operator’s involvement, drastically reducing the qPCR workload. The
    next session will reproduce such analytical approach with a novel set of reactions.


