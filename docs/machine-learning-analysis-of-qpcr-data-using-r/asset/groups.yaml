    \ have more values, as in l = list(a=c(a=\"A\", b=0, c=TRUE), b=c(a=\"B\", b=1,\
    \ c=FALSE, d=NULL, e=(NA)). The actual values of a level are accessed adding the\
    \ wanted index, as in l[1][1][1], which gives \"A\". If the level contains a matrix,\
