    \ 3: 9.962474\n\nsample 4: 6.617943\n```\n\n从图1.3C可以明显看出，每个样本在不同的循环点达到假设的信号阈值。因此，每个样本的初始载量与产生阳性信号所需的时间相关。在交叉点的定量比PCR结束时的定量更灵敏、更准确。\n\
    \n![](img/7ea01e6937e09d043e45c73fff9eaed3_42_0.png)\n\n![](img/7ea01e6937e09d043e45c73fff9eaed3_42_1.png)\n\
    \n![](img/7ea01e6937e09d043e45c73fff9eaed3_43_0.png)\n\n图1.3. PCR阈值的概念。qPCR产生不断增加的光水平，可以定义一个阈值（截止值）来区分背景噪声和实际信号。坐标轴必须乘以1000（×1000）。A.\
    \ PCR的不同阶段。每个点代表在每个扩增循环收集的数据。在这种情况下，考虑的是理想的目标分子数。PCR可分为三个阶段。在初始步骤中，目标分子的扩增不足以产生清晰的信号。在第二阶段，扩增子（图1.1中的物种a）呈指数级扩增并成为反应容器中的主要物种。因此，光信号迅速增加。在第三阶段，试剂的耗竭和抑制剂的积累降低了DNA-pol的进程性，反应达到平台期。B.\
    \ PCR曲线与初始模板输入无关。使用具有递增模板量的样本的模拟数据表明，模板数量增加直至达到平台值。反应结束时，所有样本将含有相同数量的扩增子（箭头）。样本之间的差异仅仅是达到平台所需的时间：模板输入较高的样本将在平台期停留的时间比输入低的样本更长。C.\
    \ 面板B的放大图，显示不同样本将在不同时间达到假设的阈值水平（10⁶分子）。模板输入高的样本比模板输入低的样本更快达到阈值。\n\n终点PCR不允许对目标进行定量这一事实是该检测的主要缺点，因为确定目标的存在与否是一项重要成就，但对于现代用途而言，其应用有限。例如，样本的病毒载量知识用于确定抗病毒疗法的有效性。可以很早在达到饱和阶段之前停止PCR，比如在示例中20个循环后，但：\n\
    \n-   EF是一个劳动密集型步骤，会减慢检测速度。\n-   EF会引入污染和人为错误的风险。打开含有扩增DNA的PCR管会带来扩增子液滴在实验室中扩散的风险。如果扩增子的气溶胶进入新的PCR管，会导致假阳性结果。这种污染风险是PCR实验室的一个主要问题。\n\
    -   结果仍然是半定量的，因为定量是通过将目标的荧光与特殊DNA梯的荧光进行比较获得的，其中每个条带含有预定的DNA量。然而，条带数量很少且包含有限范围的DNA浓度，因此定量非常粗略。\n\
    \nPCR的突破是在反应进行过程中引入信号检测。这种“技巧”省去了EF步骤的使用，简化并加快了反应。由Pamela Holland和David Gelfand在Cetus组成的科研小组（Holland\
    \ et al., 1991）发现DNA-pol的5′→3′外切酶活性可以降解杂交在酶前方的寡核苷酸。通过在寡核苷酸的两端结合荧光染料和猝灭剂，这种分子（称为探针）不会发出光，因为荧光分子发出的光子会被猝灭剂捕获。但在PCR延伸期间，探针被DNA-pol降解后，荧光染料将从猝灭剂活性中释放，并在反应容器中释放光子，可由光学装置收集。几乎在同一时间，由Russell\
    \ Higuchi、Robert Griffith和Roche的同事组成的团队报道了一些嵌入剂（即与DNA高亲和力结合的分子）在结合dsDNA时会增加其荧光，使得每个扩增子在每个循环中可释放一定量的光（Higuchi\
    \ et al., 1992）。此外，Kenneth Livak、Karin Deetz和Perkin-Elmer/Applied Biosystems的同事发现，标记有特定荧光染料组且在近距离杂交的两个探针可以发出光（Heid\
    \ et al., 1996）。这些方法现在分别被称为水解探针化学（商品化为TaqMan™）、嵌入剂化学和杂交探针化学（或FRET，荧光共振能量转移）。\n\
    \n最初使用的嵌入剂是溴化乙锭，但由于其致癌性，已被其他无害染料取代，如SYBR Green™、RedSafe™和EvaGreen™。\n\n嵌入剂比探针便宜，尽管它们容易附着于特定序列，但它们结合的序列在DNA链上足够常见，可为任何扩增子提供有效的覆盖（Bailly\
    \ and Chaires, 1998）。更重要的是，嵌入剂允许进行熔解分析。通过在PCR结束后逐渐升高反应容器中的温度，扩增子发出的荧光会下降，因为嵌入剂从DNA上被置换。当温度达到扩增子的熔解温度（Tₘ）时，双链会迅速溶解，荧光突然下降。荧光与温度的图是递减线，在Tₘ处突然降至零。通过取该曲线的第一导数，图被转换为钟形图，其峰值为Tₘ。在存在引物二聚体或其他污染物时，图会显示多个峰。因此，熔解分析用于确认PCR的特异性。\n\
    \n另一方面，探针允许同时检测多个目标（一种称为多重检测的方法），这进一步扩展了PCR的应用。这种改进的PCR检测最初被称为“实时”，因为结果可以在PCR进行中而不是之后读取。目前它更常被称为“定量”（qPCR），因为它允许对样本的初始载量进行定量。下一章将更详细地描述定量程序。\n\
    \n## Listings\n\n```\nListing 1.1.\nThe counters k (initial number of copies)\
    \ and n (number of amplifications) are instantiated and a repository array total_number_ROI,\
    \ which is populated with k. New array's elements are assigned to the vector through\
    \ a for loop, so that the final array will have n elements. Each array's element\
    \ (apart the first) will contain the square of the previous element. The array's\
    \ elements are accessed by their indices indicated by a number enclosed in squared\
    \ brackets. The elements of the array are printed on screen with the function\
    \ print.\n\nVariables can be instantiated directly with the assignment symbol\
    \ '<-' that is equivalent to '=' in other languages (and working also in R).\n\
    R calls vectors what in other languages are called 'arrays': collections of several\
    \ values.\nVectors are then, in R, uni-dimensional. A matrix is a two-dimensional\
    \ vector.\nAn array is a three-dimensional or multi-dimensional vector.\nAn empty\
    \ vector can be instantiated with the function vector(), likewise for matrices\
    \ (matrix()), and arrays (array()). Populated vectors are instantiated by concatenating\
    \ different elements; the concatenating function in R is c(). Matrices and arrays\
    \ need additional information regarding their dimensions.\n```\n"
