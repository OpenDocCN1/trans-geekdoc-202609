  mdcn: "\n\n## 第三章\n### 机器学习在 maxRatio qPCR 分析中的应用\n\n### 使用期望最大化方法过滤 maxRatio\n\n\
    与拟合点法一样，maxRatio 也需要建立一个阈值来区分反应性（阳性）和非反应性（阴性）反应（样本）。如前文所述，该阈值是通过将一组阴性样本的 MR 值的标准差乘以\
    \ 5–10 来确定的（Shain 和 Clemens，2008）。乘数的标度由操作者选择。然而，最近人们尝试通过提供客观的样本分离来改进该程序。在此背景下，程序的客观性意味着操作者无需选择一个数值——统计方法将根据手头的数据选择最佳参数。理论上，这种客观方法将提供一种针对当前\
    \ qPCR 检测的分析工具，能够补偿样本基质中可能的抑制剂、所用化学试剂的性能以及热循环仪的异常行为。与拟合点法不同，maxRatio 允许使用多个阈值将样本分层到特定子类（例如，弱阳性样本）中。\n\
    \n面向数据设定阈值的第一个尝试是实现期望最大化（EM）算法（Marongiu 等，2016a）。EM 算法识别样本分布中的峰，然后确定一个截断值将它们分开（Dempster\
    \ 等，1977）。以下清单将描述这一过程：\n\n```\nListing 3.1\nset.seed(15)\nopar <- par(\"mar\"\
    )\nnegative_mr <- runif(50, 0, 0.099)\nnegative_fcn <- runif(50, 1, 40)\npositive_mr\
    \ <- c(runif(30, 0.2, 0.5), runif(20, 0.4, 0.5))\npositive_fcn <- c(runif(30,\
    \ 25, 40), runif(20, 10, 25))\nuncertain_mr <- runif(10, 0.099, 0.2)\nuncertain_fcn\
    \ <- runif(10, 25, 40)\nlayout(matrix(c(1,2),nrow=1), widths=c(4,1))\npar(mar=c(5.1,\
    \ 4.1, 4.1, 0))\nplot(negative_fcn, negative_mr, ylim=c(0,0.5), xlim=c(0,41),\
    \ cex=1.5,\n    xlab=expression(bold(\"FCN\")), ylab=expression(bold(\"MR\")))\n\
    points(positive_fcn, positive_mr, pch=16, cex=1.5)\npoints(uncertain_fcn, uncertain_mr,\
    \ pch=16, cex=1.5, col=\"grey\")\nlegend(\"topleft\", legend = c(\"Positives\"\
    , \"Negatives\", \"Uncertains\"), pch = c(16, 1, 16),\ncol=c(\"black\", \"black\"\
    , \"grey\"), cex=0.8)\npar(mar=c(5.1, 0.2, 4.1, 2))\nd <- density(c(negative_mr,\
    \ uncertain_mr, positive_mr))\nplot(d$x, d$y, ylim=c(0,0.5), type=\"\", yaxs=\"\
    n\", xaxs=\"n\", main=NA, ylab=NA, xlab=NA)\npar(mar=opar)\n```\n\n图 3.1 显示样本密度有两个主峰，一个对应阳性样本，一个对应阴性样本。EM\
    \ 算法在这两个峰之间建立最佳截断值。具体而言，使用 mixtools 库构建参数分布的混合模型。模型摘要提供了描述两个重叠分布（阳性样本和阴性样本）的参数特征。还可以绘制这些总体的密度图。\n\
    \n![](img/7ea01e6937e09d043e45c73fff9eaed3_87_0.png)\n\n图 3.1. 样本密度的识别。阴性（○）和阳性（●）样本组在\
    \ MR/FCN 空间中以不同方式分层。这种分离并非绝对，且在这两组之间往往存在一些样本（●），它们可以被界定为不确定。密度图分析（右图）表明 MR 值的分布呈双峰分布；因此，在两个峰之间放置一个截断值将能够区分这两个主要总体。左图中的插图显示了由\
    \ EM 算法生成的密度图。在此情况下，横坐标标签“数据”代表“MR”。\n\n```\nListing 3.1 (continuation)\nlibrary(mixtools)\n\
    df <- data.frame(MR=c(negative_mr, uncertain_mr, positive_mr),\nFCN=c(negative_fcn,\
    \ uncertain_fcn, positive_fcn))\nmodel = normalmixEM((x = df$MR))\nplot(model,\
    \ which=2)\n```\n\n```text\n> summary(model)\nsummary of normalmixEM object:\n\
    ```\n\n|      | 成分 1     | 成分 2    |\n|------|------------|-----------|\n| lambda\
    \ | 0.4532318 | 0.546768 |\n| mu    | 0.0538644  | 0.345513 |\n| sigma | 0.0291171\
    \ | 0.114604 |\n\n估计处的对数似然：81.04961\n\n```text\n> model$mu[1]   # Mean of negative\
    \ population\n[1] 0.05386439\n> model$sigma[1] # SD of negative population\n[1]\
    \ 0.02911713\n> model$mu[2]   # Mean of positive population\n[1] 0.345513\n> model$sigma[2]\
    \ # SD of positive population\n[1] 0.1146038\n```\n\n标准差可用作两个总体之间的阈值。可选地，可以应用一个乘数来更好地区分数据（Marongiu\
