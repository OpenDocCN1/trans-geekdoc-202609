  - "[PAGE 74]\n\n![](img/7ea01e6937e09d043e45c73fff9eaed3_74_0.png)\n\nFigure 2.5.\
    \ *Comparison of amplification plots generated by the fit-point and maxRatio methods.*\
    \ The fit-point method and the maxRatio algorithms generate two very different\
    \ plots. A. A typical PCR generates a sigmoid curve (thin line) with the ordinate\
    \ being the fluorescence signal recorded (left axis). Conversely, maxRatio generates\
    \ a Gaussian curve of adimensional ratios (right axis). The peak of this curve\
    \ (vertical line) defines two values: the maximum of the fluorescence ratio between\
    \ consecutive cycles (MR) and the fractional number where the peak occurs (FCN).\
    \ B. By artificially increasing the number of points analyzed, it is possible\
    \ to smooth the maxRatio curve.\n\nThe function *mrPlotter* provides the number\
    \ of cycles using the argument give = “cycle” and the ratio values with the argument\
    \ give = “fluo” In this case, though, the peak of the curve must also take into\
    \ account the increased number of points:\n\n```\nListing 2.7 (continuation)\n\
    ```r\nmrCalc <- function(Cycles, FluoData, background_compensation=0) {\n  ratiox\
    \ <- tail(Cycles, -1)\n  MINx = min(ratiox)\n  MAXx = max(ratiox)\n  Xint = seq(MINx,MAXx,0.01)\n\
    \  m = FluoData\n  if (background_compensation > 0) rm = m - mean(m[4:6]) + background_compensation\n\
    \  x = tail(rm, -1)\n  w = head(rm, -1)\n  r <- (x/w) - 1\n```\n```"
  - "[PAGE 75]\n\n```\nrf <- filter(r, rep(0.2,5))\nrf[1] <- rf[1]\nrf[MAXx-1] <-\
