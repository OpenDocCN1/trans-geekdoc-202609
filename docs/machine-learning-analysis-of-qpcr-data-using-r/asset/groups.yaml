    \ Conversely, only 32 samples with an initial concentration of 10⁰ c/µL were positive.\
    \ By using logistic regression, it was found that the limit of detection (LOD)\
    \ was 1.7 c/µL (Marongiu et al., 2014b). The following listing will replicate\
    \ such an instance (Figure 2.4).\n\n![](img/7ea01e6937e09d043e45c73fff9eaed3_66_0.png)\n\
    \nFigure 2.4. PCR limit of detection. The proportion of amplification success\
    \ is plotted against the concentration of a set of samples, and logistic regression\
    \ is applied. The LOD is computed by setting a level to the proportion of success,\
    \ 95% (horizontal line). Regression allows determining the concentration that\
    \ reaches this level (vertical line), in this case 1.7 c/µL.\n\n## Listing 2.5\n\
    \n```\ndf <- data.frame(concentration = c(1, 10, 100, 1000, 10000), positivity\
    \ = c(0.864, 1, 1, 1, 1))\nmodel <- glm(positivity~concentration, family = binomial(link\
    \ = \"logit\"), data=df)\nlibrary(MASS)\nlod <- dose.p(model,p=.95)\nnewdata <-\
