    \ <- ifelse(is.na(test_set$FAM) == TRUE, \"negative\", \"positive\")\n    train_set$Outcome[train_set$FCN\
    \ == 50] <- \"uncertain\"  # add more classes\n    test_set$Outcome[test_set$FCN\
    \ == 50] <- \"uncertain\"   # add more classes\n    train_set$Outcome <- as.factor(train_set$Outcome)\n\
    \    test_set$Outcome <- as.factor(test_set$Outcome)\n    mod = ksvm(outcome ~\
    \ MR+FCN, data = train_set, type = \"C-svc\", kernel = \"besseldot\", C =1,\n\
    \        kpar = \"automatic\", prob.model = TRUE)\n    pred_prob = predict(mod,\
    \ test_set, type = \"probabilities\")\n    prediction = predict(mod, test_set)\n\
    \    serial = test_set$Index\n    rating = test_set$Outcome\n    OUT = data.frame(serial,\
