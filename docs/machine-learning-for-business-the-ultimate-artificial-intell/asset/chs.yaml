- '# 面向业务的机器学习：经理、团队负责人和创业者的终极人工智能与机器学习指南













  # 引言


  机器学习通过其数字化交互改变了计算机世界，因为它是人工智能的一种。机器学习始于数据或观察（例如指令或直接经验），然后从数据中寻找模式，使机器能够根据提供的示例做出更好的决策。机器学习的主要目的是让机器在没有任何人工协助或干预的情况下自动学习，并学会适应这种学习。


  亚瑟·萨缪尔（Arthur Samuel）在 1959 年创造了“机器学习”这一术语。然而，是汤姆·米切尔（Tom Mitchell）为机器学习领域研究的各种算法给出了一个更正式且引用率更高的定义。该定义是：“如果一个计算机程序对于特定任务类
  `T` 的性能衡量标准 `P`，随着经验 `E` 的增加，通过 `P` 量的任务性能提高了，那么这个程序就可以从经验 `E` 中学习。”事实上，这个定义提供了该术语的基本操作版本，而不是从认知角度对其进行定义。


  艾兰·图灵（Alan Turing）在他的文章中将“机器能思考吗？”替换为“机器能做到我们能做的事吗？”。人类可以作为思考实体完成某些事情。图灵的提议揭示了会思考的机器可能具有的不同特征。允许计算机从其经验中学习涉及大量的自动化以及使用不同算法对分析建模进行数据分析。机器学习使机器能够搜索并识别隐藏的深度，而无需在接触到新数据时通过自动化来搜索它们。


  尽管这项技术并不新，但随着许多关于机器学习（通常被称为 `ML`）的内容需要被学习和了解，它正在获得动力。对 `ML` 重新关注的各种因素包括负担得起的计算处理、日益增长的数据以及负担得起的数据存储选项。现代公司可以通过
  `ML` 算法发现趋势、模式和联系，在极少的人工干预下对开发分析模型做出明智决策。


  # 机器学习的演变


  现代世界的机器学习与过去不同。这主要是由于新技术的出现。过去，技术因为模式识别以及计算机不需要编程即可学习并处理某些任务的这一点而加速了发展。曾有许多对人工智能充满热情的科学家进一步探索了这一领域，以实验计算机是否可以从数据中学习。


  重点并不在于迭代学习，因为计算机随着时间的推移开始适应接收到的新数据。在过去所做出的不同模式和计算的基础上，计算机学会了在相同或相似的情况下做出与过去相似的决策。机器从现有模式中学习的能力现在正获得巨大的推动。人们现在正襟直坐，注意到机器能够在不同领域（如处理大量数据）执行困难的数学计算，且速度快得多。


  例如，看看 Google 自动汽车的例子。它是基于机器学习原理构建的。`ML` 的另一个重要用途可以在 Amazon 和 Netflix 等公司的推荐中找到，这些都是我们日常生活中机器学习的例子。`ML`
  还可以合并以创建语言规则。Twitter 目前正在实施这项应用，让你知道客户对你说了些什么。


  更重要的是，机器学习被用于检测各个工业部门的欺诈行为。程序员告诉计算机如何解决问题的时代已经过去了。我们已经进入了一个让机器自己解决问题的时代。它们识别每个数据集的模式。通过分析隐藏的模式和趋势，可以很容易地推测未来的问题并防止其再次发生。


  机器学习算法通常跟踪特定类型的数据，并使用数据中的模式来回答问题。例如，你向机器展示一系列狗并说“这是一只狗。”，随后向机器展示其他照片并说“这不只只狗。”现在，如果你向计算机展示图片，它将尝试判断这些图片是否来自狗。然而，机器的任何正确或错误的估计都会存储在内存中。这使得机器从长期来看变得更聪明，并在一段时间推移后丰富了它的知识。


  # 机器学习在现代世界的意义


  大多数处理大量数据的组织已经意识到机器学习的重要性。通过利用这些数据中的隐藏见解，公司可以更高效地工作并获得竞争精神。除了实现负担得起且易于计算的处理外，它还涉及成本效益高的存储选项。机器学习使得创建能够快速处理和分析大量数据的模型变得可行。除了使公司能够分析一系列数据的趋势和模式外，`ML`
  还能实现分析过程的自动化。







  ## 机器学习与预测性分析

  对于许多公司而言，海量数据——大量的非结构化、半结构化和原始结构化数据——是一个尚未开发的信息源，可以帮助业务决策并改进业务运营。随着这些数据的不断变化和多元，越来越多的公司正在使用预测分析来挖掘这些来源并利用大规模数据。


  存在一个常见的误区，认为机器学习和预测分析是同一回事。事实并非如此。然而，它们在一个领域上有重叠，即预测建模。事实上，预测分析包含一系列统计技术，包括 `ML`、数据挖掘和预测建模，利用历史和当前统计数据来估计或预测未来结果。这些结果可以是购买期间的客户行为或市场可能的变化。它帮助我们通过分析过去的模式来猜测可能的未来事件。


  ### 应用预测分析

  预测建模激发了预测分析。它是一种方法而非过程。`ML` 和预测分析是密不可分的，因为预测模型通常包含 `ML` 算法。创建的模型可以经过一段时间的训练以响应新值或其他数据，从而实现组织所需的结果。


  预测模型有两种。一种是`分类模型`，用于预测类别属性；另一种是`回归模型`，用于预测数字。这些模型由执行数据挖掘和统计分析的算法组成，以确定数据中的模式和趋势。预测分析软件内置了用于创建预测模型的算法。算法被称为分类，它们能够识别数据所属的类别集。


  ### 常用预测模型

  最常用的预测模型有：


  *   `回归`（线性和逻辑）：它是统计学中较流行的方法之一。`回归分析`提供了变量之间的关系，并在各种大型数据集中发现关键模式。它还学习这些变量之间是如何相互相关的。

  *   `决策树`：`决策树`是多变量分析中一种简单而强大的形式。`决策树`由算法产生，这些算法识别将数据拆分为类分支分段的不同方式。它们根据输入变量的不同类别将数据划分为子集。它能帮助你理解用户通往决策的路径。

  *   `神经网络`：它们建立在人类大脑神经元的模式之上。`神经网络`通常被称为`人工神经网络`，是深度学习技术的一种变体。它们通常用于解决困难的模式识别问题，对于分析大数据集有用。它们非常擅长处理非线性数据关系，而且在某些变量未知时也能良好运行。


  ### 分类器

  每个分类器处理数据的方式不同，因此经理为了获得所需的结果，必须选择正确的分类器和模型。


  *   `聚类算法`：它们将数据组织成具有相似成员的不同组。

  *   `时间序列算法`：它们按顺序绘制数据，对于预测随时间变化的常数有用。

  *   `离群值检测算法`：它们完全关注异常检测，识别数据集中符合符合特定模式或标准的事件、观测值或项目。

  *   `集成模型`：这些模型使用不同的算法来实现更好的性能。

  *   `朴素贝叶斯`：这种分类器允许你根据概率预测类别或分类。

  *   `因子分析`：这是一种用于描述独立变量的方法。

  *   `向量支持`：这是一种监督学习技术，使用算法来识别模式。


  ## 机器学习与预测性分析的应用

  数据泛滥的公司正苦于将所有信息转换为可用的洞察。`ML` 和预测分析可以提供解决方案。然而，如果无法使用这些数据，它们将变成一种无用的资源。预测分析更常用于：


  *   `金融服务与银行业`：在金融服务和银行业，`ML` 和预测分析被结合用于衡量市场风险、检测欺诈和识别机会。

  *   `安全`：安全机构经常使用`预测分析`来提高其性能和服务。它们可以检测异常，理解客户行为，从而提高数据安全。

  *   `零售`：零售业使用 `ML` 来更好地理解客户行为。谁买了什么？在哪里买的？他们想要这些问题的答案。这些问题可以通过准确的预测模型和数据集得到解答，允许零售商根据趋势和影响进行预计划。


  ### 开发正确的环境

  虽然预测分析和 `ML` 为大多数公司提供了巨大的助力，但如果不考虑日常运营而这些这些解决方案，只会阻碍其提供公司所需洞察的能力。要从 `ML` 和预测分析中获得收益，公司需要确保拥有支持解决方案的架构，以及帮助他们学习的高质量数据。


  `数据准备`及其质量是预测分析最重要的部分。输入跨跨平台并由多个数据源组成，应以协调的方式集中并统一。为了实现这一点，公司需要开发良好的可靠数据管理程序来管理整体数据，并确保只采集和使用高质量数据。


  ### 预测模型

  工作在组织中的 IT 专家和数据科学家通常负责选择或开发正确的预测模型，或者他们自己构建一个以满足组织的需求。然而，今天 `ML` 和预测分析不仅是数学家、数据科学家和统计学家的专业领域，该领域还有业务顾问和分析师。越来越多的公司人员使用这些模型来开发洞察并改进业务运营。但是，当他们不知道使用哪种模型或如何实施，或者在需要某些信息时，就会出现问题。先进软件可以帮助员工解决这些问题。







  数据挖掘意味着从海量数据中获取知识。换句话说，我们可以说它是一个从数据集中发现新的新的、有用的且准确的不同类型模式的过程。数据挖掘是一个迭代过程，通过揭示海量数据中此前未知的模式和趋势，创建描述性模型和预测性模型。这项练习的执行是为了支持决策制定。它实际上是业务分析的一个子集，类似于实验研究。数据挖掘的起源可以追溯到统计学和数据库。


  另一方面，机器学习通过从数据中获得的经验来自动改进算法。换句话说，在机器学习中，我们从经验中发现新算法。这些 `ML` 算法可以自动提取信息，但机器学习使用的源也是数据。数据有两种：一种是测试数据，另一种是训练数据。数据挖掘技术经常用于机器学习，并与学习算法一起使用，用于构建背后发生的情况的模型以预测未来的结果。


  ## 什么是数据挖掘？机器学习与数据挖掘之间是什么关系？


  数据挖掘意味着从海量数据中提取知识。它引入于 1930 年，最初被称为数据库中的知识发现。数据挖掘用于从现有数据中提取规则。其起源于带有非结构化数据的传统数据库。它在你可以开发自己的模型并使用数据挖掘的地方实施。它更加自然，并且涉及更多的人员参与。它们被用于聚类分析。数据挖掘是从数据仓库中抽象出来的。它更像是一种具有类似于
  `ML` 方法的研究，但被应用于有限的领域。


  ## 数据挖掘技术


  工作在数据挖掘领域的专家依赖于统计学、数据库管理和机器学习的技术及其交叉领域。他们将职业生涯致力于理解从海量信息中得出的结论。使用哪些技术来实现这一点呢？当数据挖掘利用这些技术中的某些进行分析时，它是有效的。


  1. **模式跟踪 (Tracking pattern)**：数据挖掘中使用的基本技术之一是学习识别数据集中的模式。通常情况下，这是数据中的某种异常，它在特定间隔内发生，或者是某些变量在特定时间内的错误或衰减。例如，你可以看到某个产品的销售量在假期前夕急剧上升。或者你可能会发现温暖的天气吸引了人们访问你的网站。


  2. **分类 (Classification)**：这是一种更复杂的数据挖掘技术，要求你将不同的特征收集到可观察的类别中，以便日后得出进一步的结论或用于其他功能。例如，如果你评估独立客户的财务背景和购买历史数据，你可能能够将个人分类为高、中、低信用风险的候选人。然后你可以使用评分来进一步了解客户。


  3. **关联 (Association)**：这与模式跟踪更相关，但更具体地涉及到链接的因变量。在关联的情况下，寻找与其他属性或事件相关的特定属性或事件。例如，你注意到当客户购买某件物品时，他们也会购买另一个相关物品。这一事件序列被用于填充在线商店的“人们也购买”部分。


  4. **离群值检测 (Outlier Detection)**：在某些情况下，仅仅识别超出范围的模式可能让你对数据集有清晰的理解。你还应该理解偏差，也称为离群值。例如，你的买家几乎全是男性，但在
  7 月的一周内，女性人数突然增加。你可能想研究该事件的原因，并找出是什么推动了销售，以便你可以复制它。


  5. **聚类 (Clustering)**：这与分类类似，但涉及将相似的数据片段分组。例如，你可以根据客户的收入多少或在在线商店购物的频率对不同的人口统计群体进行聚类。


  6. **回归 (Regression)**：回归实际上被用作建模和规划的形式。它被用于确定某些变量存在的概率，因为存在其他变量。更具体地说，`regression`
  的主要重点是帮助你发现数据集中两个或多个变量之间的精确关系。


  7. **预测 (Prediction)**：这很容易成为使用的最有价值的数据挖掘技术之一。因为它被用于预测你未来将看到的数据类型。在某些情况下，通过理解和识别历史趋势，我们可以描绘对发生情况的准确预测。例如，我们可以查看客户的信用历史和过去的购买情况，以预测贷款发放后是否存在信用风险。


  ## 业务流程优化


  优化你的业务涉及衡量公司生产力、效率和性能，并寻找改进指标的方法。这是对旧业务流程进行质量优化的行为。然而，实现这一点的手段有很多。业务流程优化是 `BPM`
  的最后步骤之一。它提倡持续重新评估和改进流程的方法。因此，为了使其发挥，你必须完成每项 `BPM` 计划所需的前三个步骤。这些步骤是：


  1. **流程识别 (Process identification)**：你必须已经意识到需要优化的流程。在许多情况下，你选择对组织至关重要且驱动利润的流程。


  2. **业务流程分配 (Business Process Assignment)**：在你映射业务流程之前，你将难以以识别潜在的改进方案。如果你不映射业务流程，你可以用纸笔画流程图，或使用工作流软件来完成。


  3. **业务流程分析 (Business Process Analysis)**：在开始业务流程改进活动之前，你必须首先分析每一步。这种分析可以非常简单，只需一些显而易见的可能更改；如果问题不那么清楚，可能会困难得多。对于后者，你可以使用一些用于改进业务流程的工具来找出细小的效率低下之处。






  完成这些工作并处理掉所有障碍后，你应该已经有一个清晰映射且定义的流程，以及关于如何优化它的一些想法。



  有很多方法可以用于优化你的业务流程。这取决于你选择的待优化流程。在描述中无法找到一种通用的方法。在大多数情况下，优化是使用以下方法之一执行的。


  ### 重构或流程改进


  这种方法非常简单，流程中的每一步都经过仔细考虑。这种方法的核心思想是找出以下流程：


  *   **A. 浪费的**：流程中的每一步都必须为最终目标（可以是输出或某些价值）增加一些价值。流程必须实现业务目标。通常你会发现某些步骤或流程在没有产生任何价值的情况下是无用的。浪费和浪费流程有不同的类型。

  *   **B. 低效且有改进空间**：这意味着某个流程或步骤的效率没有达到理想水平。例如，采取的步骤比需要的多得多。这最明显的例子之一就是审批流程。在尝试启动一个新项目时，你需要获得公司高层管理的批准。这意味着要等待五个以上非常忙的高管抽时间阅读文档并给予绿灯。


  一旦你发现了属于这些类别的步骤或流程，你就需要为了质量对其进行改进。这可以通过重构流程来实现。换句话说，通过改变步骤、或者通过消除无用的步骤或流程来重构步骤，或者两者兼顾。



  许多人不喜欢体力劳动。你经常会觉得自己就像机器中的一个齿轮，在做机器人可以做得更好的事情。你只需要为这项工作找到合适的工具或软件。`BPA`（业务流程自动化）可以帮助你从员工的工作负载中消除体力劳动，从而提高生产力和士气，因为员工将致力于处理重要事情。没有人喜欢枯燥的工作。自动化随任务而异。以下是一些自动化的示例：






  如果你与业务伙伴在线上工作，你可能在网站上开启了客户支持表单。假设新软件更新出现问题，导致 10% 的用户文件受到影响。这意味着你的收件箱会充斥着大量的投诉和问题邮件。虽然第一份错误报告非常有用，但剩下的邮件简直是一团糟，而且你必须回答所有的邮件。可以使用软件创建“事件”（events），在这种情况下，你可以根据工单中提到的关键词对投诉发送自动回复。


  无论该机构涉及何种业务，员工可能都拥有 `Facebook` 账户或至少有 `LinkedIn` 页面。管理页面的传统方法是让某人手动登录，然后每天寻找内容发布
  3-4 次。与其花费时间做这些事情，你你可以使用社交媒体工具为下个月的帖子进行计划。还有其他可能与你的业务更相关的示例。但网上有许多此类解决方案可以帮助你实现业务流程自动化。


  采用正确的技术将始终是游戏规则的改变者。与前两种方法不同，这并没有恰恰优化了流程本身。相反，它改变了整体。假设你使用白板来组织组织的日常任务。通过使用任务管理软件，你可以在不实际改变流程的情况下提高公司的日常效率。如果你负责软件，你将看到以下收益：


  *   **更少的错误和错过的截止日期**：人们犯错是臭名昭著的。每个人都会偶尔出错，或者忘记重要的事情或错过截止日期。任务管理软件确保了这种情况不会发生，因为它会提醒你日常任务以及由此产生的截止日期。

  *   **中央指挥中心**：在网上创建新任务并将其分配给员工，比发送详细的电子邮件并希望希望它们不会被忽略或丢失要容易得多。如需更多以流程为导向的示例，可以使用工作流管理软件。你不需要通过
  `chat` 或 `email` 手动跟踪工作流，而是可以使用特殊的系统通过一个仪表板管理所有流程。这自动消除了你在流程管理中遇到的许多问题，例如：

  *   **流程缺乏标准化**：让所有员工同时遵循不同的程序是非常困难的。工作流软件确保每个人都按照正确的顺序完成流程中的所有必要步骤。

  *   **更容易的追踪和分析**：与平均流程图相比，使用工作流软件追踪更加容易。如果没有软件，你必须通过 `email` 和 `chat` 手动追踪流程。此外，软件可以衡量流程效率，否则你必须手动从不同的报告、员工和软件中收集所有数据。


  因此，为了优化业务流程，你需要识别、映射并分析薄弱和低效的流程。找出是否有更好的方法来它们。然后通过重组、自动化或应用将彻底改变工作方式的技术来优化它们。


  在初创公司招聘时，有一条黄金法则：只有当现有员工的负荷达到 120% 时才进行招聘。简单来说，初创公司无法雇用无法 100% 利用的员工。没有冗余负担的空间。虽然这符合商业逻辑，但你也可以通过过度要求降低员工士气。答案是优化公司资源，以便在招聘新员工之前从团队中获得更好的生产力。


  ### a. 价值高于数量

  对于初创所有者来说，最快但也困难的决定之一是资产优化。追求价值而非数量是一个艰难的决定。它可能意味着产品或服务的价值增加到这种程度，数量减少，但更高的利润增加了收益。员工现在有更多的时间完成任务，因此可以提供更好的服务质量。然而，这一切都是说做起来容易，需要在经过仔细咨询后做出决定。


  ### b. 减少浪费

  浪费是一个大问题，特别是对于消费品公司。它不仅增加了运营成本，还可能通过强迫员工生产最终会被丢弃的物品让他们感到沮丧。更好的预测模型和预测工具将帮助优化运营、减少工人工作量并在此过程中增加收入。


  ### c. 运营重新工程

  初创工作者身兼多职以同时执行不同任务是一项常见做法。研究表明，将注意力分散到不同的任务上会降低生产力，并使完成每个任务的时间增加多达 25%。虽然扮演多个角色是业务的一部分，但你可能仍然可以通过让他们一次关注一件事来重新设计他们的工作负荷。


  ### d. 外包非价值工作

  你不需要在公司内部完成所有工作。许多咨询公司都有专门员工可以执行各种任务，例如准备演示文稿或合并电子表格。虽然这些任务很重要，但让高价值员工执行这些任务是没有意义的。初创公司可以从外包中获得灵感，以同样的方式并将某些任务外包给数据处理非增值项。


  ### e. 使用第三方工具

  如果你是一家新公司，将所有资源集中在核心专业领域非常重要。这意味着避免从事不直接有助于改进产品或服务的工作。例如，你可以将你的软件与第三方工具集成，以实现某些功能，而无需组织自己构建它们。`Uber`
  是世界上最流行的初创公司之一，通过不自己开发 `Google Maps` 为他们的成功做出了巨大贡献。公司无法承受低效。


  任何组织的业务运营都可以不断改进。事实上，提高效率和有效性对于中型市场公司至关重要。你需要所有可用资源来迎接下一个增长阶段并与更大的机构竞争。与其在小规模上工作并解决偶发问题，不如使用以下策略优化运营：


  *   **采取“精益”方法**：一种运营理念，`LEAN` 专注于持续改进运营，从而向客户交付价值。通过拥有增加价值的实践并避免没有价值的实践，公司使其变得更高效。

  *   **关注质量**：不同版本的质量管理已经存在多年，例如德明的统计过程控制、20 世纪 80 年的全质量运动或其他西西格玛。这些实践最初是用于生产，但后来扩展到了组织的运营中。

  *   **改进预测**：无论是销售产品还是服务、购买和管理库存、检查供应链还是合理配置人员，所有组织都在尝试预测。许多公司预测得不好，这说明他们不愿意满足需求或浪费资金维持产能。根据
  `NCMM` 白皮书，波本酿酒厂 Maker''s Mark 表示由于预测问题，他们将稀释产品。由于无法满足客户，他们感到愤怒。幸运的是，中型公司可以使用先进工具来改进各种预测。

  *   **引入客户导向思维**：管理团队总是说他们的机构是以客户为导向的。将其与客户体验联系起来，并考虑有多少公司将客户放在首位。每家公司以客户为中心的方法都是高效的。你需要策略和活动拥抱客户并让他们满意快乐。如果你能做到这一点，你就处于成功的快速通道。


  BPR（业务流程重工程）曾曾在业务管理中非常流行。组织试图重构他们的运营流程以获得更高的效率。正如所有的时尚一样，当时有很多言论但行动很少。然而，随着业务流程的演变，这个想法并没有失去它的信誉。随着情况的变化，组织继续采用和补充流程。最后，你将通过一个由委员会设计的流程。通过真正的重工程，组织可以隔离浪费的流程，并开发更好、更有效的流程。






  ### 1. 确定你的目标

  在开始收集数据之前，有一个重要的步骤，即知道哪些数据是值得收集的。确定哪些类型的数据对营销策略有积极影响。忽略那些对策略有效性无帮助的数据，专注于收集关键 KPI
  的数据，这些数据能够真正产生影响。


  ### 2. 建立你的团队

  在开始分析数据之前，组建一个处理数据的团队非常重要。团队应该由来自不同部门和跨学科领域的成员组成。Richard Baystom 在 Effin Amazing
  上建议，这并不意味着让 IT 人员和销售人员聚在一起，然后只召集经理们需要的人才。这意味着你将找到那些愿意超越自身领域和知识范围的人。例如，你需要想要了解更多营销知识的数据科学家，或者想要学习销售业务的
  IT 人员。通过安排针对性且频繁的会议来优先考虑这些人的协作至关重要。在会议期间，每个人分享自己的想法和信息，如果团队取得了成功，每个人都可以获得功劳。


  ### 3. 收集数据

  当你准备好开始收集数据时，请确保将其放在一个地方以便于分析。考虑收集以下类型的数据：







  ## 核心数据类别

  * 竞争对手

  * 目标市场

  * 营销

  * 社交媒体分析（曝光量、点击率、转化率等）

  * 客户数据，包括个人数据、交易数据、在线活动以及社交网络上的活动

  * 定性与前瞻性数据


  还有其他类型的数据。你可以通过询问团队中不同成员他们正在准备、`using` 和 `collecting` 什么样的数据开始，并收集从其他部门获取的所有各种信息。


  `Jim Bergeson` 在一文中指出，数据有时隐藏在公司的内部资源中，可能来自产品或服务的供应商、经销商或转销商。它可能存在于供应商处，甚至可能被锁在 IT
  部门的保险库中。


  一旦完成这些数据探索，请通过销售点问题、投诉或服务请求、推荐、后续购买和在线推荐等信息，了解客户生命周期各个阶段发生了什么。


  ## 4. 评估数据并采取行动

  根据 `KPIs` 评估收集到的数据，并开始使用这些数据来指导营销策略。


  ### a. 完善内容营销策略

  你可能已经在使用内容营销策略来吸引和接触受众。但有时内容背后没有明确的策略，或者你并不清楚想要触达的目标是谁。然而，一旦你有了可以做出明智决策的数据，你就走在了正确的道路上。你可能结合销售和营销策略来赚取更多钱。你还可以尝试不同类型的内容，例如
  `GIFs`、`images` 和 `videos`。


  如果你已经在定期发布优质内容，这一步不应该是问题。然而，不要忘记最重要的一点，那就是坚持。当你给客户提供他们想要的东西（`Wait when you give
  your customers what they want`），他们更有可能与内容互动。这需要一些尝试错误，但数据将帮助你确定与受众互动的最佳方式。


  ### b. 考虑新的子分市场

  一旦你对收集到的数据有了所有洞察，就可以开始为你的产品和服务创建新的子分市场。这并不意味着你必须完全改变品牌，你可能只需要改变销售对象。例如，如果你正在为生日派对销售定制标牌，并发现婚礼对类似产品有巨大需求，你可能想稍微调整营销策略，以针对订婚夫妻，并可能为他们创建一个新系列。总目标是在利基市场中寻找机会，并用你的产品和服务服务新受众。


  ### c. 消除障碍

  收集的数据还将揭示潜在客户在销售过程中面临的潜在障碍。现在是解决这些问题的时候了。你的客户是否卡在了购物车的商品目上？你如何才能让他们完成购买？


  一个例子是来自 `Pura Vida` 的手链。该公司正通过 `Facebook` 上的内容推广产品，最近他们还为粉丝页提供了限时折扣，以激励购物者。


  ### d. 探索替代性营销渠道

  有时你会发现你的公司没有触及所有必要的客户。如果你的网站是你用来分享产品和服务信息的唯一渠道，那么你的业务将无法继续存在。收集的数据可以帮助你找到其他渠道和方法。


  你可能想尝试与其他拥有非你产品的公司进行联合营销，或者启动一个联盟营销计划，让有价值的客户分发你的产品以换取折扣或其他福利。通过分析收集的数据，你将开始理解哪些渠道最适合你的产品和服务。


  ### e. 不要停止测试

  虽然数据可以帮助制定新的营销策略，但它们需要经常进行测试和管理。在《新物种营销》中，`Matthew Buckley` 提到，你应该通过一天内完成的小实验来测试你的营销工作。他建议使用科学方法来进行。其目标是快速且胜任地收集所有重要数据，以便你得出结论甚至建立新的实验。你对数据运行的测试越多次，你的营销努力就越明智。


  实现真正的数据驱动营销是一项挑战。由 `CMO Council` 和 `RedPointGlobal` 的一名为《赋能数据驱动的客户策略：从基础开始解决客户参与》的研究强调了阻碍营销人员将开发的策略付诸执行的四个障碍。问题包括缺乏实时数据、缺乏内部凝聚力以及缺乏技术和对客户的关注。


  研究描述说，只有 7% 的营销人员表示他们总能通过各种物理和数字触点提供数据驱动的实时体验。虽然 52% 的营销人员声称提供了最多的体验，但他们只能通过数字或营销渠道做到。因此在现实中，许多公司在通过不同渠道实时收集和分析数据方面存在问题。


  要在数据驱动营销中取得真正的胜利，公司需要合适的技术。三分之一的人表示他们在过去五年中投资了十个独立平台或解决方案中的五个，但许多人仍然没有完全可视化其数据所需的工具。真实问题在于解决方案之间的连接性。约
  3% 的营销人员表示他们所有的系统都是完全同步的，顺畅连接所有渠道的数据、统计和洞察。15% 的人承认在开发内部流程和技术以在旧基础设施中使用新的云解决方案方面没有任何策略。


  如果你正在推出新的营销计划或寻求为现有计划进行翻新，这里有一些方法可以帮助你与客户联系并增加线索。


  ### 1. 识别客户

  如果你正在推出新的营销计划或寻求为现有计划进行翻新，这里有一些方法可以帮助你与客户联系并增加线索。要在数据驱动的营销中取得真正的胜利，公司需要合适的技术。


  ### 2. 研究竞争对手

  一旦你对收集的数据有了所有洞察，就可以开始为你的产品和服务创建新的子分市场。


  ### 3. 定向广告

  虽然 52% 的营销人员声称提供了最多的体验，但他们只能通过数字或营销渠道做到。


  ### 4. 社交媒体的使用

  少量的社交媒体存在和社交媒体存在之间有巨大差异。在努力留住客户时，多一点努力会有很大成效。


  ### 5. 回应所有沟通

  `Paul English` 领导了 `Kayak`，他使用了最有价值的实践之一。他坚持在办公室中间放一个极其烦人且声音很大的电话。这是为了接收客户投诉。这几乎确保了电话得到响应。`Tony
  Hsieh` 非常重视客户服务，以至于为所有员工设立了客户服务培训计划，无论他们的职位如何。


  ### 6. 联盟营销

  自 `WWW` 引入以来就一直存在，但仍然被忽视。然而，它在显著提高品牌知名度方面非常有效。


  ### 7. 通过发布评论等在社区中建立信任

  高达 88% 的客户对在线评论的信任程度相当于个人推荐，因此发布评论并向受信任的博主发送产品样品让他们阅读并评分是明智之举。






  随着业务的增长，开始在发布转载内容的主流网站（如 `Forbes`、`Huffington Post`、`Fast Company Inc.` 和 `FT`）上发布内部内容。不要忘记在这里使用你的真实姓名，因为人们对人的反应比对公司的反应更好。


  ### 8. 与影响者建立联系

  与行业内的主要参与者建立联系是建立广泛客户群的有效方法。如果你能获得影响者或意见领袖的关注，你就有更大的机会吸引他们的朋友和粉丝，并建立公信力和信任感。在会议上接触企业家，或在
  `Twitter` 上联系博主，或者向他们发送有趣且相关的博客内容，以激发他们的兴趣，并让你回归“人的”形象，而不仅仅是一个机构。


  ### 9. 向博客发布内容

  保持持续且勤奋发布原创及相关博客内容的习惯。这确保了你的机构在 `Google` 中持续保持颖而出。然而，这也有助于潜在客户真正了解你的业务及其来源。并非所有内容都应该是自我推销的，而应该提供背景信息和洞察，解释读者为什么应该购买该产品或服务。针对客户日常生活中遇到的行业相关问题，提出最佳解决方案，或者提供有用的信息并泛激发人们分享你的观点。如果你没有足够的专职作家或资源来在博客上持续发布内容，可以注册如
  `Content.ly` 这样的内容营销平台，或如 `Commeta` 这样的虚拟通信平台。


  ### 10. 使用新闻简报推广潜在客户

  在线营销中最困难的任务之一就是生成潜在客户。这通常涉及分析客户信息和社交媒体活动、投放广告、在线调查以及每年更新用户数据。然而，不断有新公司出现以简化潜在客户生成，在某些情况下还会替你完成工作。例如
  `LeadGenius`。对于培养潜在客户，一种很好的方法是使用个性化的电子邮件简报、促销活动和 `A / B test` 广告。利用数据来优化产生成效的工作，并开发出最佳的营销活动。






  营销的成功取决于多个因素。除了上述提到的因素外，营销人员如果不精通自动化和数据分析，将无法获胜。机器学习可以提高常见任务的性能，如品牌素材生成、客户细分、客户沟通、相关内容的提取与分类、整体生产力以及产出。在现代经济中，营销公司如果不使用机器学习，其运营将面临严重的功能残缺。然而，在不了解其能力的情况下就使用
  `ML` 可能会弊大于于利（通常表现为浪费的时间和金钱）。它不是魔法，除非你的团队针对特定的营销挑战选择并配置了合适的 `ML` 解决方案，否则它不会自动产生立竿见影的效果。


  以下在营销中利用机器学习技术的一些应用：


  ## 1. 通过聚类进行客户细分和发现

  并非所有的客户都是相同的。非干预的 `ML` 可以帮助你将受众划分为动态群体并进行适当的互动。例如，`Affinio` 的平台分析了数十亿个客户兴趣变量，根据他们在社交媒体上的活动发现特定的客户兴趣，然后生成视觉化报告，将兴趣相似的客户进行分组。通过这种方式，你将对客户行为的洞察，识别出谁是资深老饕、谁在
  Netflix 上关注哪部剧，或者谁对类似的旅行目的地有偏好。


  ## 2. 使用多臂上下文老虎机进行内容优化

  `A / B` 测试是发现什么样的内容（网页格式、邮件语气、文章标题和视觉元素等）更能引起公众共鸣的有效方法。但 `A / B` 测试中存在一段遗憾期，如果你使用了不那么优的选项，可能会损失收入。你必须等待并完成倒计时才能得知最佳选项。相比之下，老虎机测试通过动态优化减少了机会的损失。在过程中，它同时对选项进行探索和利用，并逐渐自动地转向更好的选项。


  ## 3. 带有动态价格的回归模型

  正确的价格可以决定产品的未来成败。`ML` 中的回归技术允许营销人员根据已有的特征预测统计值。这反过来又让他们能够改进客户旅程的各个方面。回归也可用于销售预测和优化营销支出。


  ## 4. 用于个性化和用户洞察的文本分类

  机器学习系统可以使用 `NLP`（自然语言处理）检查语音或文本内容，然后根据情感、主题或语气等变量对内容的所有部分进行分类，以目标客户，生成相关材料的洞察或进行策划。`IBM
  Watson` 的 `Tone Analyzer` 可以分析来自互联网的客户反馈，并确定评价产品的用户的总体语气。


  ## 5. 用于趋势新闻的文本提取和摘要

  营销人员可以使用机器学习从在线发布的新闻和其他数据源中提取相关内容，以确定客户对他们品牌的看法以及他们对产品的反应。为了做到这一点，`Protagonist`
  平台让组织能够充分理解客户的动机和价值观，以及这些特征如何影响他们的购买决策。精通技术的营销人员还可以使用如 `AYLIEN` 等 API 构建自己的机器学习算法，以监控社交媒体情绪并收集相关新闻故事。


  ## 6. 使用注意力神经网络进行文本翻译

  深度学习注意力机制有助于改进机器翻译，并丰富你的营销资源以应对全球竞争。对于一个进入全新且语言迥异市场的品牌来说，翻译是一项重大的发布。然而，`AI` 的进步已让机器翻译接近人类的水平。为了合理化成本并加速这一过程，许多公司选择仅让人工翻译员对机器翻译输出进行审核和签字。


  ## 7. 使用 RNN（循环神经网络）生成文本

  如果你品牌的创意人员面临着持续压力，需要为新产品和活动想出好名字，你可以使用如 `RNN` 等生成式模型为自己提供几个听起来合理的名称。有些可能很有感染力/很奇怪，而另一些则惊讶地正是你需要的。


  ## 8. 聊天机器人和客户体验自动化对话系统

  聊天机器人和机器人是 `ML` 的某些应用。然而，对话系统是完全脚本化的，它们需要自然语言处理来适应各种问题。通过 `ML`，它们可以更好地满足客户需求并生成洞察。许多公司已经使用聊天机器人来与客户进行交流。


  ## 9. 带有 TTS 和 STT 的语音搜索

  语音搜索被认为是 `AI` 的一个重要领域。通过使用如 `Google Assistant` 和 `Amazon Echo` 等语音助手，已使无接触的搜索和购物成为可能。现在营销人员需要对话
  AI 策略，因为它是营销的未来。


  ## 10. 使用计算机视觉进行品牌识别

  计算机视觉是一个快速发展的机器学习领域，营销人员可以利用机器学习驱动的视觉技术识别产品并从视频中获取洞察。如 `GumGum` 等解决方案允许营销人员对标签和视频进行内容审核。


  `Nvidia` 在业务界引起了巨大轰动，因为它生成的写实图像引起了关注。虽然这些照片看起来像真人，但它们完全是由 `ML` 和 `AI` 生成的。通过使用 `GAN`（生成对抗网络），`Nvidia`
  系统变得越来越能够创建超真实的图像。`GAN` 有两个竞争的网络，一个是生成器，另一个是判别器，它们相互对抗并学习。结果是它们在制作和检测伪造图像方面变得更好。一些其他公司使用
  `GAN` 创建标志、从素描创建写实图像。


  数字营销充满了旨在减轻压力工作人员工作的自动化解决方案。自动化流程已用于打开和分析邮件附件、读取邮件、为报告输入数据以及启用和跟踪社交媒体触发器以便营销人员保持领先。对于互联网广告，有一个名为
  `"Albert"` 的 AI 平台，可以减少大规模媒体购买的人工需求，加速必要的分析计算速度，并优化付费广告活动。







  在高效聊天机器人、移动银行应用和搜索引擎出现之前，机器学习（ML）已经有了实用的金融应用。由于数据量巨大、对历史数据准确性的高要求以及金融世界的量化本质，很少有其他行业比金融更适合人工智能。你可以在金融领域发现的机器学习案例比以往任何时候都多。这种趋势由于计算能力的增强以及像
  Google 的 `TensorFlow` 这样更易获取的机器学习工具而变得更加。机器学习已经到来，并在现代社会和许多金融领域发挥着至关重要的作用。它参与了贷款审批、资产管理和风险评估。尽管只有极少数精通技术的人能准确了解机器学习进入人们金融生活的具体程度。


  ## 当前的金融应用


  以下是当今世界中使用机器学习的一些示例。请记住，某些应用使用了多种人工智能技术或方法，而不仅仅是机器学习。


  ### 1. 投资组合管理

  “机器人投顾”是一个几年前还没听过的术语，但现在金融界已广泛使用。然而，这个术语有点误导性，因为完全没有机器人参与。相反，机器人投顾顾问（例如 `Betterment`
  或 `Wealthfront`）是基于机器学习的算法，旨在构建用户的金融投资组合，包括他们的目标和风险承受能力。例如，用户输入目标，如在 65 岁退休时拥有 3,000,000
  美元的存款。他们还会输入年龄、当前财务状况和收入。顾问（更准确的称呼是配置器）随后将投资分配到不同的资产类别和金融工具上，以实现用户的目标。随后，顾问系统会根据用户目标的变化和市场的实际变化进行校准，使其最符合用户的目标。它们对于那些不需要实体顾问就能安心投资的消费者，以及那些无力支付人类顾问费用的人来说，具有巨大的吸引。


  ### 2. 算法交易

  算法交易可以追溯到 20 世纪 70 年代，称为自动化交易系统。它使用复杂的人工智能系统做出非常快的交易决策。算法系统每天进行数千次或数百万次的交易。因此，使用了
  `HFT`（高频交易）这一术语，它是算法交易的一部分。大多数金融机构和对冲基金不公开他们用于交易的人工智能方法。然而，人们认为深度学习和机器学习在交易决策中发挥着日益重要的作用。在股票交易中使用机器学习存在一些异常的局限性。


  ### 3. 欺诈检测

  该系统可以通过机器学习检测异常行为或独特活动，并向安全部门标记。该系统最大的挑战是防止误报，以及在实际上没有风险的情况下标记出风险标记的情况。安全漏洞发生的方式有无数种，因此真正的学习系统将在未来
  5 到 10 年内成为必要。


  ### 4. 保险或信用保险

  核保可以被描述为金融领域机器学习的完美工作，但市场上很大程度上担心机器将取代许多目前的核保职位。这对于大型组织（如大型银行和有限责任公司）特别是一个问题。机器学习算法可以在数百万消费者数据案例中训练，例如工作、年龄、婚姻状况等。它还可以用于保险结果和金融贷款，以检查某人是否违约、未能及时还款或获得贷款或发生交通事故。可以使用算法评估底层趋势并进行持续分析，以检测影响未来贷款和保险的趋势。通过这种方式，你可以检查是否有越来越多的人发生交通事故。或者在过去的
  10 年里，特定人群的违约人数是否在增加？这些问题的结果对组织大有益处。然而，这目前仅限于有资源聘请数据科学家且拥有海量数据（过去和现在）来训练算法的大公司。



  近年来，受人工智能和机器学习支持的交易引起了巨大的兴趣。有一种假设，加密货币市场的低效性可以被用来创造巨额利润。由最先进机器学习算法支持的正常交易策略远优于标准基准。一些并不显眼但实际上非常简单的算法可以帮助预测加密货币市场的短期演变。机器学习技术在股市预测中取得的成功表明这些方法也可以有效地预测加密货币价格。但将机器学习算法应用于加密货币市场主要局限于使用`贝叶斯神经网络`、`随机森林`、`长短期记忆神经网络`以及其他算法分析
  `Bitcoin` 价格。这些研究在某种程度上预测了比特币的价格波动，并得出结论：使用基于神经网络的算法可以获得最佳结果。深度学习的增强在预测为期一年的 12
  种不同加密货币价格方面，表现优于买入并持有策略。还有其他尝试使用机器学习预测 `Bitcoin` 以外的加密货币价格，但它们来自非学术来源，并且没有对结果进行任何比较。



  证券的投机被称为日内交易。更具体地说，它是在同一个交易日内买卖金融工具。严格来说，它是一天内的交易事件。这意味着当市场在当天收盘时，所有头寸都已关闭。日内交易者寻求在具有良好条件的股票上寻找入场和出场位置。这些条件产生了各种短期收益，这些收益可以累积成巨大的利润。如果市场上存在能够识别市场有利模式的人，我们甚至可以训练机器以相同的方式、甚至是超人类的方式来运行。这就是使用机器学习进行日内交易的目的。但首先，我们需要识别日内交易者用来标记市场入场策略的策略。该技术分为两个过程：高级模式描述，第二个过程是机器学习。在第一个过程中，即识别输入语义，这可能在数百个预定义策略上发生。这是通过使用健壮且可扩展的模式匹配器（如
  `Apache Flink`）完成的。一旦触发器激活，我们就可以遍历历史数据，寻找过去触发器激活且在 10 或 20 分钟后出现结果的案例。我们可以使用机器学习为算法生成训练示例，为先前的条目创建概率分布。







  机器学习的独特优势——特别是在小型设备上的应用——使其无疑成为人们的青睐。从 RPA 功能到移动自动化，这一切都变成了触手可及的现实，让未来尽在掌握。


  如今，即使是规模较小的公司也可以像大头企业一样利用机器学习。它可以以极具成本效益的方式使用。例如，一些公司利用人工智能来改善客户关系，这在降低成本的同时也为其公司提供了定制化服务。它还可用于培训员工并以成本效益的方式改进预测。例如，教育机构
  Udacity 通过向其销售团队引入聊天机器人，使其销售额增长了 50%。


  数据、算法和基础设施的进步以及获取这些资源所需的成本降低了它们的整体成本，如今较小公司也负担得起了。


  然而，关于机器学习的伦理问题也引发了许多关注。在偏偏数据集上训练的系统会导致文化偏见的数字化。例如，使用来自一家具有种族歧视政策的招聘公司的数据，会导致机器学习系统在筛选申请人时偏见加倍。收集“负责任的数据”以及对系统使用的算法规则进行妥记录已变得至关重要。甚至语言中包含了偏见，机器学习也将不得不学习这些偏见。


  开发机器产生收入而非服务服务的医疗保健专业人员是另一个担忧。


  但也存在极佳的好处。由于人工智能将提高许多岗位的生产力，尽管中低岗位可能会被消除，但将需要需要高技能、中技能甚至低技能人才的若干新职位。机器学习是未来的趋势，也是贵公司成功的关键。


