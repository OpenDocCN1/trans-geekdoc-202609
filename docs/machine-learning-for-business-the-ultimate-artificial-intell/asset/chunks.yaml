    # 结论


    机器学习的独特优势——特别是在小型设备上的应用——使其无疑成为人们的青睐。从 RPA 功能到移动自动化，这一切都变成了触手可及的现实，让未来尽在掌握。


    如今，即使是规模较小的公司也可以像大头企业一样利用机器学习。它可以以极具成本效益的方式使用。例如，一些公司利用人工智能来改善客户关系，这在降低成本的同时也为其公司提供了定制化服务。它还可用于培训员工并以成本效益的方式改进预测。例如，教育机构
    Udacity 通过向其销售团队引入聊天机器人，使其销售额增长了 50%。


    数据、算法和基础设施的进步以及获取这些资源所需的成本降低了它们的整体成本，如今较小公司也负担得起了。


    然而，关于机器学习的伦理问题也引发了许多关注。在偏偏数据集上训练的系统会导致文化偏见的数字化。例如，使用来自一家具有种族歧视政策的招聘公司的数据，会导致机器学习系统在筛选申请人时偏见加倍。收集“负责任的数据”以及对系统使用的算法规则进行妥记录已变得至关重要。甚至语言中包含了偏见，机器学习也将不得不学习这些偏见。


    开发机器产生收入而非服务服务的医疗保健专业人员是另一个担忧。


    但也存在极佳的好处。由于人工智能将提高许多岗位的生产力，尽管中低岗位可能会被消除，但将需要需要高技能、中技能甚至低技能人才的若干新职位。机器学习是未来的趋势，也是贵公司成功的关键。


    '
