    # 引言


    机器学习通过其数字化交互改变了计算机世界，因为它是人工智能的一种。机器学习始于数据或观察（例如指令或直接经验），然后从数据中寻找模式，使机器能够根据提供的示例做出更好的决策。机器学习的主要目的是让机器在没有任何人工协助或干预的情况下自动学习，并学会适应这种学习。


    亚瑟·萨缪尔（Arthur Samuel）在 1959 年创造了“机器学习”这一术语。然而，是汤姆·米切尔（Tom Mitchell）为机器学习领域研究的各种算法给出了一个更正式且引用率更高的定义。该定义是：“如果一个计算机程序对于特定任务类
    `T` 的性能衡量标准 `P`，随着经验 `E` 的增加，通过 `P` 量的任务性能提高了，那么这个程序就可以从经验 `E` 中学习。”事实上，这个定义提供了该术语的基本操作版本，而不是从认知角度对其进行定义。


    艾兰·图灵（Alan Turing）在他的文章中将“机器能思考吗？”替换为“机器能做到我们能做的事吗？”。人类可以作为思考实体完成某些事情。图灵的提议揭示了会思考的机器可能具有的不同特征。允许计算机从其经验中学习涉及大量的自动化以及使用不同算法对分析建模进行数据分析。机器学习使机器能够搜索并识别隐藏的深度，而无需在接触到新数据时通过自动化来搜索它们。


    尽管这项技术并不新，但随着许多关于机器学习（通常被称为 `ML`）的内容需要被学习和了解，它正在获得动力。对 `ML` 重新关注的各种因素包括负担得起的计算处理、日益增长的数据以及负担得起的数据存储选项。现代公司可以通过
    `ML` 算法发现趋势、模式和联系，在极少的人工干预下对开发分析模型做出明智决策。


    # 机器学习的演变


    现代世界的机器学习与过去不同。这主要是由于新技术的出现。过去，技术因为模式识别以及计算机不需要编程即可学习并处理某些任务的这一点而加速了发展。曾有许多对人工智能充满热情的科学家进一步探索了这一领域，以实验计算机是否可以从数据中学习。


    重点并不在于迭代学习，因为计算机随着时间的推移开始适应接收到的新数据。在过去所做出的不同模式和计算的基础上，计算机学会了在相同或相似的情况下做出与过去相似的决策。机器从现有模式中学习的能力现在正获得巨大的推动。人们现在正襟直坐，注意到机器能够在不同领域（如处理大量数据）执行困难的数学计算，且速度快得多。


    例如，看看 Google 自动汽车的例子。它是基于机器学习原理构建的。`ML` 的另一个重要用途可以在 Amazon 和 Netflix 等公司的推荐中找到，这些都是我们日常生活中机器学习的例子。`ML`
    还可以合并以创建语言规则。Twitter 目前正在实施这项应用，让你知道客户对你说了些什么。


    更重要的是，机器学习被用于检测各个工业部门的欺诈行为。程序员告诉计算机如何解决问题的时代已经过去了。我们已经进入了一个让机器自己解决问题的时代。它们识别每个数据集的模式。通过分析隐藏的模式和趋势，可以很容易地推测未来的问题并防止其再次发生。


    机器学习算法通常跟踪特定类型的数据，并使用数据中的模式来回答问题。例如，你向机器展示一系列狗并说“这是一只狗。”，随后向机器展示其他照片并说“这不只只狗。”现在，如果你向计算机展示图片，它将尝试判断这些图片是否来自狗。然而，机器的任何正确或错误的估计都会存储在内存中。这使得机器从长期来看变得更聪明，并在一段时间推移后丰富了它的知识。


    # 机器学习在现代世界的意义


    大多数处理大量数据的组织已经意识到机器学习的重要性。通过利用这些数据中的隐藏见解，公司可以更高效地工作并获得竞争精神。除了实现负担得起且易于计算的处理外，它还涉及成本效益高的存储选项。机器学习使得创建能够快速处理和分析大量数据的模型变得可行。除了使公司能够分析一系列数据的趋势和模式外，`ML`
    还能实现分析过程的自动化。


    '
- fmt: "\n# Chapter 1: Machine learning for your company ![](rsrcDJ.jpg)\n\n## Machine\
    \ learning and predictive analysis\nFor various companies, huge data - really\
    \ large amounts of unstructured, semi-structured and raw structured data - is\
    \ an untapped source of information that can help business decisions and improve\
    \ business operations. As this data continues to change and diversify, more and\
    \ more companies are using predictive analytics to tap into the source and take\
    \ advantage of the large-scale data.\n\nThere is a common misconception that machine\
    \ learning and predictive analytics are the same. That is not the case. However,\
    \ they overlap in one area, which is predictive modeling. In fact, predictive\
    \ analysis includes a range of statistical techniques, including `ML`, data mining,\
    \ and predictive modeling, and uses historical and current statistics to estimate\
    \ or predict future results. This outcome could be customer behavior during purchase\
    \ or likely changes in the market. It helps us to guess the possible future events\
    \ by analyzing past patterns.\n\n### Working with Predictive Analytics\nPredictive\
    \ modeling stimulates predictive analysis. It is an approach rather than a process.\
    \ `ML` and predictive analytics go hand in hand because the predictive models\
    \ typically contain `ML` algorithms. The models created can be trained over a\
    \ period of time to respond to new values ​​or other data, achieving the results\
    \ the organization needs.\n\nThere are two types of predictive models. One is\
    \ the `classification model`, which predicts class membership, and the second\
    \ is the `regression model`, which predicts numbers. The models are made from\
    \ algorithms that perform data mining and statistical analysis to determine patterns\
    \ and trends in the data. The predictive analysis software has built-in algorithms\
    \ that can be used to create predictive models. Algorithms are known as classifications\
    \ and they identify the set of categories to which the data belongs.\n\n### Commonly\
    \ used predictive models\nThe most commonly used predictive models are:\n\n* \
    \  `Regression` (linear and logistics): it is one of the more popular methods\
    \ available in statistics. `Regression analysis` provides a relationship between\
    \ variables and finds key patterns in various and big data sets. It also learns\
    \ how they relate to each other. \n*   `Decision trees`: The `decision trees`\
    \ are simple yet powerful forms of multi-variable analysis. `Decision trees` are\
    \ produced by algorithms that identify different ways of splitting the data into\
    \ branch-like segments. They divide the data into subsets, depending on different\
    \ categories of input variables. It helps you understand a user's path to a decision.\n\
    *   `Neural networks`: they are built on the patterns of the neurons in the human\
    \ brain. `Neural networks` are often referred to as `artificial neural networks`\
    \ and are a variant of deep learning technology. They are often used to solve\
    \ difficult pattern recognition situations and are incredibly useful for analyzing\
    \ big data sets. They are very good at handling nonlinear data relationships and\
    \ also work well when some variables are unknown.\n\n### Classifiers\nEach classifier\
    \ approaches the data in a different way, so for the managers to get the desired\
    \ results, they must select the correct classifiers and models.\n\n*   `Clustering\
    \ algorithms`: they organize data into different groups with similar members.\n\
    *   `Time Series algorithms`: they plot the data sequentially and are useful in\
    \ predicting constant values ​​over time.\n*   `Outlier detection algorithms`:\
    \ they focus entirely on anomaly detection, identifying events, observations or\
    \ items that do not meet a specific expected pattern or standards in a dataset.\n\
    *   `Ensemble Models`: These models use different algorithms to achieve better\
    \ performance.\n*   `Naive Bayes`: This classifier allows you to predict a category\
    \ or class based on probability.\n*   `Factor analysis`: it is a method used to\
    \ describe independent variables.\n*   `Vector Support`: They are a supervised\
    \ learning technique that uses algorithms to recognize patterns.\n\n## Machine\
    \ learning and predictive analysis applications\nCompanies overflowing with data\
    \ are struggling to convert all information into usable insight. `ML` and predictive\
    \ analytics can provide the solution. However, if the large data cannot be used,\
    \ it becomes a useless resource. Predictive analysis is more commonly used in:\n\
    \n*   `Financial services and banking`: In financial services and banking, `ML`\
    \ and predictive analytics are used together to measure market risks, detect fraud,\
    \ and identify opportunities.\n*   `Security`: Security organizations often use\
    \ `predictive analytics` to improve their performance and services. They can detect\
    \ anomalies, understand customer behavior, and thereby improve data security.\n\
    *   `Retail`: Retail uses `ML` to better understand customer behavior. Who buys\
    \ what and where? They want to know the answer to these questions. These questions\
    \ can be answered with accurate predictive models and datasets, allowing retailers\
    \ to pre-plan and stock items based on consumer trends and influences.\n\n###\
    \ Develop the right environment\nWhile predictive analytics and `ML` can be a\
    \ huge boost for most companies, implementing these solutions half-heartedly without\
    \ regard to their day-to-day operations will only hinder their ability to provide\
    \ the insight the company needs. To get the best out of `ML` and predictive analytics,\
    \ companies need to ensure they have the architecture to support the solutions,\
    \ along with high-quality data that help them learn.\n\n`Data preparation` and\
    \ its quality are the most important parts of predictive analysis. Inputs, which\
    \ can span across different platforms and consist of multiple data sources, should\
    \ be centralized and unified in a coherent manner. To achieve this, companies\
    \ need to develop good reliable data management programs to manage overall data\
    \ management and ensure that only the high quality data is captured and used.\n\
    \n### Predictive models\nThe IT experts and data scientists working in an organization\
    \ are normally tasked with selecting or developing the right predictive models\
    \ or perhaps building one themselves to meet the needs of the organization. Today,\
    \ however, `ML` and predictive analysis is not only the field of expertise for\
    \ mathematicians, data scientists, and statisticians, but there are also business\
    \ consultants and analysts in the field. More and more people in companies use\
    \ the models to develop insights and improve business operations. However, there\
    \ are problems when they don't know which model to use or how to implement it\
    \ or in case they need some information immediately. Advanced software is available\
    \ to help employees with the problem.\n"
