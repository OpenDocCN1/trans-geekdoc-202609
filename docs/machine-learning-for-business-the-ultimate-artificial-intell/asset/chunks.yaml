    # 第 2 章：机器学习与数据挖掘


    数据挖掘意味着从海量数据中获取知识。换句话说，我们可以说它是一个从数据集中发现新的新的、有用的且准确的不同类型模式的过程。数据挖掘是一个迭代过程，通过揭示海量数据中此前未知的模式和趋势，创建描述性模型和预测性模型。这项练习的执行是为了支持决策制定。它实际上是业务分析的一个子集，类似于实验研究。数据挖掘的起源可以追溯到统计学和数据库。


    另一方面，机器学习通过从数据中获得的经验来自动改进算法。换句话说，在机器学习中，我们从经验中发现新算法。这些 `ML` 算法可以自动提取信息，但机器学习使用的源也是数据。数据有两种：一种是测试数据，另一种是训练数据。数据挖掘技术经常用于机器学习，并与学习算法一起使用，用于构建背后发生的情况的模型以预测未来的结果。


    ## 什么是数据挖掘？机器学习与数据挖掘之间是什么关系？


    数据挖掘意味着从海量数据中提取知识。它引入于 1930 年，最初被称为数据库中的知识发现。数据挖掘用于从现有数据中提取规则。其起源于带有非结构化数据的传统数据库。它在你可以开发自己的模型并使用数据挖掘的地方实施。它更加自然，并且涉及更多的人员参与。它们被用于聚类分析。数据挖掘是从数据仓库中抽象出来的。它更像是一种具有类似于
    `ML` 方法的研究，但被应用于有限的领域。


    ## 数据挖掘技术


    工作在数据挖掘领域的专家依赖于统计学、数据库管理和机器学习的技术及其交叉领域。他们将职业生涯致力于理解从海量信息中得出的结论。使用哪些技术来实现这一点呢？当数据挖掘利用这些技术中的某些进行分析时，它是有效的。


    1. **模式跟踪 (Tracking pattern)**：数据挖掘中使用的基本技术之一是学习识别数据集中的模式。通常情况下，这是数据中的某种异常，它在特定间隔内发生，或者是某些变量在特定时间内的错误或衰减。例如，你可以看到某个产品的销售量在假期前夕急剧上升。或者你可能会发现温暖的天气吸引了人们访问你的网站。


    2. **分类 (Classification)**：这是一种更复杂的数据挖掘技术，要求你将不同的特征收集到可观察的类别中，以便日后得出进一步的结论或用于其他功能。例如，如果你评估独立客户的财务背景和购买历史数据，你可能能够将个人分类为高、中、低信用风险的候选人。然后你可以使用评分来进一步了解客户。


    3. **关联 (Association)**：这与模式跟踪更相关，但更具体地涉及到链接的因变量。在关联的情况下，寻找与其他属性或事件相关的特定属性或事件。例如，你注意到当客户购买某件物品时，他们也会购买另一个相关物品。这一事件序列被用于填充在线商店的“人们也购买”部分。


    4. **离群值检测 (Outlier Detection)**：在某些情况下，仅仅识别超出范围的模式可能让你对数据集有清晰的理解。你还应该理解偏差，也称为离群值。例如，你的买家几乎全是男性，但在
    7 月的一周内，女性人数突然增加。你可能想研究该事件的原因，并找出是什么推动了销售，以便你可以复制它。


    5. **聚类 (Clustering)**：这与分类类似，但涉及将相似的数据片段分组。例如，你可以根据客户的收入多少或在在线商店购物的频率对不同的人口统计群体进行聚类。


    6. **回归 (Regression)**：回归实际上被用作建模和规划的形式。它被用于确定某些变量存在的概率，因为存在其他变量。更具体地说，`regression`
    的主要重点是帮助你发现数据集中两个或多个变量之间的精确关系。


    7. **预测 (Prediction)**：这很容易成为使用的最有价值的数据挖掘技术之一。因为它被用于预测你未来将看到的数据类型。在某些情况下，通过理解和识别历史趋势，我们可以描绘对发生情况的准确预测。例如，我们可以查看客户的信用历史和过去的购买情况，以预测贷款发放后是否存在信用风险。


    ## 业务流程优化


    优化你的业务涉及衡量公司生产力、效率和性能，并寻找改进指标的方法。这是对旧业务流程进行质量优化的行为。然而，实现这一点的手段有很多。业务流程优化是 `BPM`
    的最后步骤之一。它提倡持续重新评估和改进流程的方法。因此，为了使其发挥，你必须完成每项 `BPM` 计划所需的前三个步骤。这些步骤是：


    1. **流程识别 (Process identification)**：你必须已经意识到需要优化的流程。在许多情况下，你选择对组织至关重要且驱动利润的流程。


    2. **业务流程分配 (Business Process Assignment)**：在你映射业务流程之前，你将难以以识别潜在的改进方案。如果你不映射业务流程，你可以用纸笔画流程图，或使用工作流软件来完成。


    3. **业务流程分析 (Business Process Analysis)**：在开始业务流程改进活动之前，你必须首先分析每一步。这种分析可以非常简单，只需一些显而易见的可能更改；如果问题不那么清楚，可能会困难得多。对于后者，你可以使用一些用于改进业务流程的工具来找出细小的效率低下之处。


    '
- fmt: '

    After you complete this, with all that out of the way, you should have a clearly
    mapped and defined process and a few ideas on how to optimize it.


    # Carrying out the optimization of business processes


    There are many methods that can be used to optimize your business processes. This
    depends on the process selected for optimization. You can''t find one size that
    fits everyone in the description. In most cases, the optimization is performed
    using one of the following methods.


    ## Restructuring or process improvement


    this method is quite simple and every step in the process is carefully considered.
    The idea with this method is to find out the processes that are:


    *   **A. Wasteful**: Each step in a process must add some value to the end goal,
    which can be an output or some value. The process must deliver on business objectives.
    Often you will find that some steps or processes are useless without creating
    any value. There are different types of waste and wasteful processes.

    *   **B. Inefficient and Improvable**: This means that a process or step is simply
    not as efficient as it could be. For example, many more steps can be taken than
    required. One of the most obvious examples of this is the approval processes.
    When trying to get a new project off the ground, you need to get approval from
    senior management in the company. This means waiting for more than five very busy
    executives to find time to read documents and give them the green light.


    Once you discover the steps or processes that fall into these categories, you
    need to improve them for quality. This can be achieved by restructuring the process.
    In other words, by changing the steps or restructuring the steps by eliminating
    the useless steps or processes or by doing a little bit of both.


    ## Automation


    Many people do not like manual work. You often get the feeling that you are a
    gear in the machine and doing things that robots can do better. All you have to
    do is find the right tools or software for the job. The `BPA` (Business Process
    Automation) can help you remove manual labor from the workload of your employees
    and this leads to better productivity and morale because the employees will work
    on what is important. Nobody likes the growl. Automation varies with tasks. Here
    are some examples of automation:

