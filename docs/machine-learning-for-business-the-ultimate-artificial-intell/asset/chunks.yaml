    完成这些工作并处理掉所有障碍后，你应该已经有一个清晰映射且定义的流程，以及关于如何优化它的一些想法。


    # 执行业务流程优化


    有很多方法可以用于优化你的业务流程。这取决于你选择的待优化流程。在描述中无法找到一种通用的方法。在大多数情况下，优化是使用以下方法之一执行的。


    ## 重构或流程改进


    这种方法非常简单，流程中的每一步都经过仔细考虑。这种方法的核心思想是找出以下流程：


    *   **A. 浪费的**：流程中的每一步都必须为最终目标（可以是输出或某些价值）增加一些价值。流程必须实现业务目标。通常你会发现某些步骤或流程在没有产生任何价值的情况下是无用的。浪费和浪费流程有不同的类型。

    *   **B. 低效且有改进空间**：这意味着某个流程或步骤的效率没有达到理想水平。例如，采取的步骤比需要的多得多。这最明显的例子之一就是审批流程。在尝试启动一个新项目时，你需要获得公司高层管理的批准。这意味着要等待五个以上非常忙的高管抽时间阅读文档并给予绿灯。


    一旦你发现了属于这些类别的步骤或流程，你就需要为了质量对其进行改进。这可以通过重构流程来实现。换句话说，通过改变步骤、或者通过消除无用的步骤或流程来重构步骤，或者两者兼顾。


    ## 自动化


    许多人不喜欢体力劳动。你经常会觉得自己就像机器中的一个齿轮，在做机器人可以做得更好的事情。你只需要为这项工作找到合适的工具或软件。`BPA`（业务流程自动化）可以帮助你从员工的工作负载中消除体力劳动，从而提高生产力和士气，因为员工将致力于处理重要事情。没有人喜欢枯燥的工作。自动化随任务而异。以下是一些自动化的示例：


    '
- fmt: '

    # Customer Support

    If you work with your business partners online, you have opened a customer support
    form on the site. Let''s say there is a problem with the new software update and
    as a result 10% of the user file is affected. This means that your inbox really
    gets clogged with emails with complaints and problems. While the first bug report
    comes in very handy, the rest is just a mess and you have to answer them all.
    Software is available to create events, in which case you can send automatic responses
    to the complaints depending on the keywords mentioned in the ticket.


    # Social Media Management

    Whatever the organization is about, employees are likely to have `Facebook` accounts
    or at least `LinkedIn` pages. The conventional ways to manage the pages are to
    let someone log in manually and then find something to post 3-4 times a day. Instead
    of wasting your time doing all this, you can use a social media tool to schedule
    your posts the following month. There are other examples that may be more relevant
    to your business. But many such solutions are available online to help you with
    your business process automation.


    # Technology approval and total process change

    Adopting the right technology will always be the game changer. Unlike the first
    two approaches, this doesn''t exactly optimize the process as such. Instead, it
    changes the total. Let''s say you use the whiteboard to organize your daily tasks
    with the organization. By using the task management software, you can improve
    the daily efficiency of companies without actually changing a process. If you
    are in charge of the software, you will see benefits such as:


    *   **Fewer mistakes and missed deadlines**: people are notorious for making mistakes.
    Everyone can make mistakes from time to time or forget something important or
    miss a deadline. The task management software ensures that this does not happen,
    because it reminds you of the daily tasks and the resulting deadlines.

    *   **Central Command Center**: It is much easier to create new tasks online and
    pin them to your employees instead of sending them detailed emails in the hope
    that they will not be overlooked or lost. For more process oriented examples,
    workflow management software is available. Instead of having to manually follow
    the workflow via `chat` or `email`, you can use special systems to manage all
    processes through one dashboard. This automatically eliminates many problems you
    encounter in process management such as:

    *   **Lack of standardization in processes**: it is very difficult to have all
    your employees follow different procedures at the same time. The workflow software
    ensures that everyone goes through all necessary steps in the process in the correct
    order.

    *   **Easier tracking and analysis**: With the workflow software, tracking is
    easier than compared to average process maps. Without the software, you have to
    manually track the processes via `email` and `chat`. In addition, the software
    measures process efficiency because otherwise you have to manually collect all
    data from different reports, employees and software.


    Therefore, to optimize business processes, you need to identify, map and analyze
    weak and inefficient processes. Find out if there are better ways to do them.
    Then optimize them by restructuring, automating or applying a technology that
    will totally change the way things worked.


    # Optimize assets

    When hiring for startups, there is a golden rule, only recruit if the existing
    employees are 120% stretched. Simply put, the startups cannot hire employees that
    cannot be 100% utilized. There is no room for excess baggage. While this makes
    business sense, you can also lower employee morale by overwriting them. The answer
    is to optimize company resources so that it is possible to get better productivity
    from the team before recruiting new people.


    ### a. Value above volume

    One of the quickest, yet more difficult decisions for budding owners is asset
    optimization. It is a difficult decision to have value over volume. It probably
    means that the value of the product or services is increased to such an extent
    that volume decreases, but higher margins increase. Employees now have more time
    to complete tasks and can therefore offer a better quality of service. However,
    all this is easier than done and decisions need to be made after careful consultation.


    ### b. Reduce waste

    Waste is a major problem, especially among companies with consumer goods. Not
    only does it increase operating costs, it can also frustrate employees by forcing
    them to produce items that can eventually be thrown away. Better forecasting models
    and forecasting tools will help optimize operations, reduce the workload of workers,
    and increase revenue in the process.


    ### c. Re-engineering of the operations

    It is a common practice for starting workers to wear a lot of hats to perform
    different tasks the same time. Studies have shown that dividing attention across
    different tasks can reduce productivity and increase the time it takes to complete
    each task by much as 25%. While playing multiple roles is part of business, you
    may still be able to redesign their workload by having them focus on one thing
    at a time.


    ### d. Outsource the non-value work

    You don''t have to do all the work in-house. Many consultancies have dedicated
    staff who can perform various tasks, such as preparing presentations or merging
    spreadsheets. While these tasks are important, it doesn''t make sense for high-value
    employees to perform them. Startups can take inspiration from outsourcing to perform
    the same way and outsource some tasks to data processing non-value added items.


    ### e. Use third party tools

    If you are a new company, it is important to focus all resources on core specialties.
    It means avoiding working on things that do not directly contribute to improving
    the product or service. For example, you can integrate your software with third-party
    tools that help achieve certain functionalities without the organization having
    to build them. `Uber` is one of the more popular startups in the world and by
    not working on `Google Maps` themselves has contributed a lot to their success.
    Companies cannot afford inefficiencies.


    # Optimize business operations

    Business operations can always be improved for any organization. In fact, sharpening
    efficiency and effectiveness is critical for a mid-market company. You need all
    available resources to embrace the next growth phase and compete with larger organizations.
    Rather than working on a smaller scale and solving sporadic problems, it is better
    to use one of these strategies to address different aspects of operations. Here
    are some strategies that will help shake up the area and free resources that can
    be better used in other areas:


    *   **Take the "Lean" approach**: an operating philosophy, `LEAN` focuses on continuously
    improving operational activities so that you deliver products and services to
    your customers with higher internal and external value. By having practices that
    add value and avoid those that don''t, the company makes its operations department
    more efficient. There are organizations that have a worksheet to help executives
    determine whether their companies are actually applying lean practices or are
    only working on related jargon.

    *   **Focusing on Quality**: Different versions of quality management have been
    available for many years in business theories such as Statistical Process Control
    by W Edwards Deming, the Total Quality Movement of the 1980s, or other practices
    such as Six Sigma. These practices were originally intended for production but
    were later expanded into the operational work of the organizations. The main idea
    is to reduce work and waste, saving money in the process, improving results and
    making the organization effective.

    *   **Improve forecasting**: Whether you''re selling products or services, buying
    and managing inventory, checking supply chains or properly staffing the company,
    all organizations are trying to predict demand. Several companies are not very
    good at forecasting, but it just means that they are not willing to meet market
    demand or waste money and activities maintaining capacity. According to the `NCMM`
    white paper, the bourbon distiller Maker''s Mark sent out that he will have to
    water his products due to low quality forecasts. Unable to satisfy their customers,
    they were outraged. Fortunately for medium-sized companies, advanced tools are
    available with extensive knowledge to improve all kinds of forecasting.

    *   **Introduction of customer-oriented thinking**: The management teams always
    like to say how customer-oriented their organizations are. Link it to your customer
    experience and consider how many organizations put their customers first. Every
    company''s customer-centric approach is incredibly efficient. Ultimately, customers
    and their perception and attitude to a company determine fate. You need to focus
    your strategy and activities to embrace the customers and keep them satisfied
    and happy. If you can do that, you are on a fast track to success in business.


    # The Good Old BPR (business process re-engineering)

    BPR (Business Process Reengineering) at one time was all the rage among business
    management. Organizations tried to rework their operational process to achieve
    greater efficiency. As with all the fads, there was a lot of talk and very little
    action. The idea, however, has not lost its credibility as business processes
    evolve over time. As circumstances change, organizations continue to adopt and
    supplement processes. In the end, you will go through a difficult process designed
    by a committee. With real re-engineering, organizations can isolate the wasteful
    processes in business operations and develop better and more effective processes.

    '
