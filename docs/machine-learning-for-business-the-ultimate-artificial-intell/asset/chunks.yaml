    # 第 4 章：金融领域的机器学习 ![](img/rsrcDN.jpg)


    在高效聊天机器人、移动银行应用和搜索引擎出现之前，机器学习（ML）已经有了实用的金融应用。由于数据量巨大、对历史数据准确性的高要求以及金融世界的量化本质，很少有其他行业比金融更适合人工智能。你可以在金融领域发现的机器学习案例比以往任何时候都多。这种趋势由于计算能力的增强以及像
    Google 的 `TensorFlow` 这样更易获取的机器学习工具而变得更加。机器学习已经到来，并在现代社会和许多金融领域发挥着至关重要的作用。它参与了贷款审批、资产管理和风险评估。尽管只有极少数精通技术的人能准确了解机器学习进入人们金融生活的具体程度。


    ## 当前的金融应用


    以下是当今世界中使用机器学习的一些示例。请记住，某些应用使用了多种人工智能技术或方法，而不仅仅是机器学习。


    ### 1. 投资组合管理

    “机器人投顾”是一个几年前还没听过的术语，但现在金融界已广泛使用。然而，这个术语有点误导性，因为完全没有机器人参与。相反，机器人投顾顾问（例如 `Betterment`
    或 `Wealthfront`）是基于机器学习的算法，旨在构建用户的金融投资组合，包括他们的目标和风险承受能力。例如，用户输入目标，如在 65 岁退休时拥有
    3,000,000 美元的存款。他们还会输入年龄、当前财务状况和收入。顾问（更准确的称呼是配置器）随后将投资分配到不同的资产类别和金融工具上，以实现用户的目标。随后，顾问系统会根据用户目标的变化和市场的实际变化进行校准，使其最符合用户的目标。它们对于那些不需要实体顾问就能安心投资的消费者，以及那些无力支付人类顾问费用的人来说，具有巨大的吸引。


    ### 2. 算法交易

    算法交易可以追溯到 20 世纪 70 年代，称为自动化交易系统。它使用复杂的人工智能系统做出非常快的交易决策。算法系统每天进行数千次或数百万次的交易。因此，使用了
    `HFT`（高频交易）这一术语，它是算法交易的一部分。大多数金融机构和对冲基金不公开他们用于交易的人工智能方法。然而，人们认为深度学习和机器学习在交易决策中发挥着日益重要的作用。在股票交易中使用机器学习存在一些异常的局限性。


    ### 3. 欺诈检测

    该系统可以通过机器学习检测异常行为或独特活动，并向安全部门标记。该系统最大的挑战是防止误报，以及在实际上没有风险的情况下标记出风险标记的情况。安全漏洞发生的方式有无数种，因此真正的学习系统将在未来
    5 到 10 年内成为必要。


    ### 4. 保险或信用保险

    核保可以被描述为金融领域机器学习的完美工作，但市场上很大程度上担心机器将取代许多目前的核保职位。这对于大型组织（如大型银行和有限责任公司）特别是一个问题。机器学习算法可以在数百万消费者数据案例中训练，例如工作、年龄、婚姻状况等。它还可以用于保险结果和金融贷款，以检查某人是否违约、未能及时还款或获得贷款或发生交通事故。可以使用算法评估底层趋势并进行持续分析，以检测影响未来贷款和保险的趋势。通过这种方式，你可以检查是否有越来越多的人发生交通事故。或者在过去的
    10 年里，特定人群的违约人数是否在增加？这些问题的结果对组织大有益处。然而，这目前仅限于有资源聘请数据科学家且拥有海量数据（过去和现在）来训练算法的大公司。


    ## 机器学习与加密货币


    近年来，受人工智能和机器学习支持的交易引起了巨大的兴趣。有一种假设，加密货币市场的低效性可以被用来创造巨额利润。由最先进机器学习算法支持的正常交易策略远优于标准基准。一些并不显眼但实际上非常简单的算法可以帮助预测加密货币市场的短期演变。机器学习技术在股市预测中取得的成功表明这些方法也可以有效地预测加密货币价格。但将机器学习算法应用于加密货币市场主要局限于使用`贝叶斯神经网络`、`随机森林`、`长短期记忆神经网络`以及其他算法分析
    `Bitcoin` 价格。这些研究在某种程度上预测了比特币的价格波动，并得出结论：使用基于神经网络的算法可以获得最佳结果。深度学习的增强在预测为期一年的 12
    种不同加密货币价格方面，表现优于买入并持有策略。还有其他尝试使用机器学习预测 `Bitcoin` 以外的加密货币价格，但它们来自非学术来源，并且没有对结果进行任何比较。


    ## 使用机器学习进行日内交易


    证券的投机被称为日内交易。更具体地说，它是在同一个交易日内买卖金融工具。严格来说，它是一天内的交易事件。这意味着当市场在当天收盘时，所有头寸都已关闭。日内交易者寻求在具有良好条件的股票上寻找入场和出场位置。这些条件产生了各种短期收益，这些收益可以累积成巨大的利润。如果市场上存在能够识别市场有利模式的人，我们甚至可以训练机器以相同的方式、甚至是超人类的方式来运行。这就是使用机器学习进行日内交易的目的。但首先，我们需要识别日内交易者用来标记市场入场策略的策略。该技术分为两个过程：高级模式描述，第二个过程是机器学习。在第一个过程中，即识别输入语义，这可能在数百个预定义策略上发生。这是通过使用健壮且可扩展的模式匹配器（如
    `Apache Flink`）完成的。一旦触发器激活，我们就可以遍历历史数据，寻找过去触发器激活且在 10 或 20 分钟后出现结果的案例。我们可以使用机器学习为算法生成训练示例，为先前的条目创建概率分布。


    '
