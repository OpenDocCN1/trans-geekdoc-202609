    \ valuable data mining techniques used. This is because it is used to predict\
    \ the type of data you will see in the future. In some cases, by understanding\
    \ and recognizing historical trends, we can map out an accurate forecast of what\
    \ will happen in the future. For example, we can view customers' credit history\
    \ and past purchases to predict whether there will be a credit risk in the future\
    \ if a loan is extended.\n\nOptimization of business processes Optimizing your\
    \ business involves a process of measuring your company's productivity, efficiency\
    \ and performance and finding methods to improve measures. It is an act of taking\
    \ the older business process and optimizing it for quality. However, the means\
    \ to achieve this vary considerably. Business process optimization is one of the\
    \ last steps in BPM (Business Process Management). It is a method that advocates\
    \ continuous process re-evaluation and improvement. Therefore, in order for it\
    \ to work, you must complete the first three steps required for each BPM initiative.\
    \ These steps are: \n\n1.  Process identification: you must already be aware of\
    \ the process that you need to optimize. In many cases, you select processes that\
    \ are critical to the organization and drive profit. After all, what's the point\
    \ of performing the optimization if it can't have an impact?\n\n2.  Business Process\
    \ Assignment: Until you have mapped the business process, you will struggle to\
    \ identify potential improvements. If you don't map the business process, you\
    \ can do it with a flow chart using just pen and paper or using workflow software.\n\
    \n3.  Business Process Analysis: Before beginning improvement activity in a business\
    \ process, you must first analyze each step. This analysis can be completely simple\
    \ with some completely obvious possible changes or can be much more difficult\
    \ if the issues are not so clear. In the case of later, you can use some of the\
    \ tools used to improve business processes to figure out the small inefficiencies."
