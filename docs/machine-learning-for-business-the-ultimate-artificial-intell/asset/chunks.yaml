    # Chapter 2: Machine learning and data mining


    Data mining means that you get knowledge from enormous amounts of data. In other
    words, we can say that it is a process of discovering different types of patterns
    inherited in the datasets that are new, useful and accurate. Data mining is an
    iterative process that creates descriptive and predictive models by uncovering
    previously unknown patterns and trends in a large amount of data. This exercise
    is performed to support decision making. It is actually a subset of business analysis
    and is similar to experimental research. The origins of data mining can be found
    in statistics and databases.


    ML, on the other hand, works with algorithms that automatically improve by the
    experience they get from data. In other words, in machine learning we discover
    new algorithms from experience. These `ML` algorithms can automatically extract
    information, but the source used for machine learning is also data. There are
    two types of data: one is test data and the second is training data. Data mining
    techniques are often used in machine learning and along with the learning algorithms,
    it is used to build models of what happens behind the scenes to predict the outcome
    of the future.


    ## What is data mining and what is the relationship between ML and data mining?


    Data mining means extracting knowledge from a large amount of data. It was introduced
    in 1930 and was initially referred to as knowledge discovery in the database.
    Data mining is used to extract rules from existing data. The origin is in conventional
    databases with unstructured data. It is implemented where you can develop your
    own models and the data mining techniques are used. It is more natural and involves
    more people involvement. They are used in cluster analysis. Data mining is abstracted
    from data warehousing. It is more of a study with methods similar to `ML`, but
    is applied in limited sectors.


    ## Data mining techniques


    The specialists who work in the field of data mining rely on techniques and intersections
    of statistics, database management and machine learning. They have devoted their
    careers to understanding the conclusions to be drawn from a vast amount of information.
    Which techniques are used to achieve this? Data mining is effective when it uses
    some of these techniques for their analysis.


    1. **Tracking pattern**: One of the fundamental techniques used in data mining
    is learning to recognize patterns in the data sets. Normally this is an aberration
    in the data that occurs at a certain interval or an error or an ebb in some variables
    over a certain period of time. For example, you can see that sales of a particular
    product have risen sharply just before the holidays. Or you may find that warm
    weather drives people to your site.


    2. **Classification**: It is a more complex data mining technique that requires
    you to collect different characteristics together into observable categories that
    can be used later to come to further conclusions or to serve in another function.
    For example, if you evaluate the financial background and purchase history data
    of an independent customer, you may be able to classify the individuals as candidates
    with a high, medium or low risk for credit. You can then use the ratings to learn
    more about the customers.


    3. **Association**: This is more related to tracking patterns, but it is more
    specifically involved in the dependent variables linked. In the case of an association,
    look for specific attributes or events that are correlated to other attributes
    or events. For example, you notice that when your customer buys a certain item,
    they also buy another related item. This sequence of events is used to fill the
    ''People Also Bought'' section of the online store.


    4. **Outlier Detection**: In some cases, just identifying the overreaching pattern
    may not give you a clear understanding of the dataset. You should also understand
    the deviations, also referred as outliers. For example, your buyers are almost
    exclusively men, but during a week in July there is a sudden increase in female.
    You may want to research the reason for the event and figure out what boosted
    sales so you can replicate it.


    5. **Clustering**: This is similar to classification, but involves grouping pieces
    of data that are similar. For example, you can cluster different demographic groups
    of customers based on how much they earn or how often they shop in the online
    store.


    6. **Regression**: Regression is actually used as a form of modeling and planning.
    It is used to determine the probability of the presence of certain variables because
    there are other variables. More specifically, the main focus of `regression` is
    to help you discover exact relationships between two or more variables within
    a data set.


    7. **Prediction**: It is easily one of the most valuable data mining techniques
    used. This is because it is used to predict the type of data you will see in the
    future. In some cases, by understanding and recognizing historical trends, we
    can map out an accurate forecast of what will happen. For example, we can view
    customers'' credit history and past purchases to predict whether there will be
    a credit risk in the future if a loan is extended.


    ## Optimization of business processes


    Optimizing your business involves a process of measuring your company''s productivity,
    efficiency and performance and finding methods to improve measures. It is an act
    of taking the older business process and optimizing it for quality. However, the
    means to achieve this vary considerably. Business process optimization is one
    of the last steps in `BPM`. It is a method that advocates continuous process re-evaluation
    and improvement. Therefore, in order for it to work, you must complete the first
    three steps required for each `BPM` initiative. These steps are:


    1. **Process identification**: you must already be aware of the process that you
    need to optimize. In many cases, you select processes that are critical to the
    organization and drive profit.


    2. **Business Process Assignment**: Until you have mapped the business process,
    you will struggle to identify potential improvements. If you don''t map the business
    process, you can do it with a flow chart using just pen and paper or using workflow
    software.


    3. **Business Process Analysis**: Before beginning improvement activity in a business
    process, you must first analyze each step. This analysis can be completely simple
    with some completely obvious possible changes or can be much more difficult if
    the issues are not so clear. In the case of later, you can use some of the tools
    used to improve business processes to figure out the small inefficiencies.

    '
