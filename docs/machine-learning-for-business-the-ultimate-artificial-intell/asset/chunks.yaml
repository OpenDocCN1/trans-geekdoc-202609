    ### 1. Determine Your Goals

    There is an important step before you start collecting data, which is knowing
    what data is worth collecting. Determine what kind of data has a positive impact
    on the marketing strategy. Omit the data that will not be used to add to the effectiveness
    of the strategy and focus on collecting data around key KPIs, which can actually
    move things around.


    ### 2. Build your team

    Before you start analyzing data, it is important to assemble a team to handle
    it. The team should consist of members from different departments and cross-curricular
    sections. Richard Baystom suggested on Effin Amazing that this doesn''t mean that
    someone from IT gets together with someone from sales, but only collects the guys
    the managers can miss. It means that you will find people who are willing to go
    beyond their field and knowledge. For example, you need data scientists who want
    to learn more about marketing or IT people who want to learn about sales. It is
    critical to prioritize the collaboration of these people by scheduling targeted,
    frequent meetings. During the meetings, everyone shares their ideas and information
    and can take credit if the team is successful.


