- fmt: "\n# Marketing Strategy and Data Analysis\n\n## Core Data Categories\n* Competitors\n\
    * Targeted market\n* Marketing\n* Social media analysis (impressions, click-throughs,\
    \ conversions, etc.)\n* Customer data, including personal data, transaction data,\
    \ online activities and activities on social networks\n* Qualitative and prospective\
    \ data\n\nThere are other types of data. You can start by asking the different\
    \ members of the team what kind of data they are preparing and `using` and `collecting`\
    \ all kinds of information that you can get from other departments.\n\n`Jim Bergeson`\
    \ pointed out in an article that data is sometimes hidden in the inner resources\
    \ of your company, perhaps from the suppliers or dealers or resellers of the product\
    \ or services. It could be with the vendors or even locked in an IT section vault.\
    \ \n\nOnce this data exploration is complete, learn what happens at all stages\
    \ of the customer's lifecycle with information such as point of sale issues, complaints\
    \ or service requests, referrals, subsequent purchases, and online recommendations.\n\
    \n## 4. Evaluate the data and take action\nEvaluate the collected data against\
    \ the `KPIs` and start using this data to guide the marketing strategies.\n\n\
    ### a. Refine the content marketing strategy\nYou may already be using the content\
    \ marketing strategy to attract and engage the audience. But sometimes there is\
    \ no clear strategy behind the content or you have no clear idea about who you\
    \ are trying to reach. However, once you have the data to make informed decisions,\
    \ you are on your way. You may be able to combine the sales and marketing strategies\
    \ to make more money. You can also experiment with different types of content,\
    \ such as `GIFs`, `images` and `videos`. \n\nIf you already publish good content\
    \ regularly, this step shouldn't be a problem. However, do not forget the most\
    \ important thing and that is commitment. When you give your customers what they\
    \ want, `Wait when you give your customers what they want`, they are more likely\
    \ to engage with the content. It will take some trial and error, but the data\
    \ will help you determine the best way to engage the audience.\n\n### b. Consider\
    \ new sub-markets\nOnce you have all the insights into the data collected, you\
    \ can start creating new sub-markets for your products and services. This does\
    \ not mean you have to completely change the brand, you may just need to change\
    \ to whom you are selling your product. For example, if you're selling custom\
    \ signage for the birthday parties and you find that there is a huge demand for\
    \ similar products for weddings, you might want to tweak the marketing strategy\
    \ a bit to target engaged couples and maybe create a new line for them. The overall\
    \ goal is to look for opportunities in the niche and serve the new audience with\
    \ your products and services.\n\n### c. Remove the obstacles\nThe data collected\
    \ will also reveal the potential hurdles potential customers face in the sales\
    \ process. Now is the time to address these issues. Are your customers stuck with\
    \ the product items in the shopping cart? How can you get them to complete the\
    \ purchase? \n\nOne of the examples are bracelets from `Pura Vida`. The company\
    \ is promoting the products through content on `Facebook` and recently they have\
    \ offered a time-sensitive discount for the fan page to motivate shoppers.\n\n\
    ### d. Explore alternative marketing channels\nSometimes you discover that your\
    \ company does not reach all the necessary customers. If your site is the only\
    \ channel you use to share information about your products and services, your\
    \ business will not continue to exist. The data collected can help you find other\
    \ channels and ways. \n\nYou may want to try the co-marketing opportunities with\
    \ other companies that have products other than yours, or start an affiliate program\
    \ in which the valuable customers distribute your products in exchange for discounts\
    \ or other benefits. By analyzing the data collected, you will begin to understand\
    \ which channels are best suited for your products and services.\n\n### e. Don't\
    \ stop testing\nWhile data can help develop new marketing strategies, they need\
    \ to be tested and managed regularly. In \"New Breed Marketing\" `Matthew Buckley`\
    \ states that you should test your marketing efforts with small experiments that\
    \ can be accomplished in one day. He suggested using scientific methods for this.\
    \ The aim is to collect all important data quickly and competently, so that you\
    \ can draw conclusions and even build new experiments. More the tests you run\
    \ on the data are more informed is your marketing effort.\n\nAchieving the truly\
    \ data-driven marketing effort is a challenge. A study by `CMO Council` and `RedPointGlobal`\
    \ entitled 'Empowering the Data-Driven Customer Strategy: Addressing Customer\
    \ Engagement from the Foundation Up' highlights four hurdles that will prevent\
    \ marketers from moving developed strategies to execution. Problems include a\
