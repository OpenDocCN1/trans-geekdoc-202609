    # 第 3 章：营销领域的机器学习应用


    营销的成功取决于多个因素。除了上述提到的因素外，营销人员如果不精通自动化和数据分析，将无法获胜。机器学习可以提高常见任务的性能，如品牌素材生成、客户细分、客户沟通、相关内容的提取与分类、整体生产力以及产出。在现代经济中，营销公司如果不使用机器学习，其运营将面临严重的功能残缺。然而，在不了解其能力的情况下就使用
    `ML` 可能会弊大于于利（通常表现为浪费的时间和金钱）。它不是魔法，除非你的团队针对特定的营销挑战选择并配置了合适的 `ML` 解决方案，否则它不会自动产生立竿见影的效果。


    以下在营销中利用机器学习技术的一些应用：


    ## 1. 通过聚类进行客户细分和发现

    并非所有的客户都是相同的。非干预的 `ML` 可以帮助你将受众划分为动态群体并进行适当的互动。例如，`Affinio` 的平台分析了数十亿个客户兴趣变量，根据他们在社交媒体上的活动发现特定的客户兴趣，然后生成视觉化报告，将兴趣相似的客户进行分组。通过这种方式，你将对客户行为的洞察，识别出谁是资深老饕、谁在
    Netflix 上关注哪部剧，或者谁对类似的旅行目的地有偏好。


    ## 2. 使用多臂上下文老虎机进行内容优化

    `A / B` 测试是发现什么样的内容（网页格式、邮件语气、文章标题和视觉元素等）更能引起公众共鸣的有效方法。但 `A / B` 测试中存在一段遗憾期，如果你使用了不那么优的选项，可能会损失收入。你必须等待并完成倒计时才能得知最佳选项。相比之下，老虎机测试通过动态优化减少了机会的损失。在过程中，它同时对选项进行探索和利用，并逐渐自动地转向更好的选项。


    ## 3. 带有动态价格的回归模型

    正确的价格可以决定产品的未来成败。`ML` 中的回归技术允许营销人员根据已有的特征预测统计值。这反过来又让他们能够改进客户旅程的各个方面。回归也可用于销售预测和优化营销支出。


    ## 4. 用于个性化和用户洞察的文本分类

    机器学习系统可以使用 `NLP`（自然语言处理）检查语音或文本内容，然后根据情感、主题或语气等变量对内容的所有部分进行分类，以目标客户，生成相关材料的洞察或进行策划。`IBM
    Watson` 的 `Tone Analyzer` 可以分析来自互联网的客户反馈，并确定评价产品的用户的总体语气。


    ## 5. 用于趋势新闻的文本提取和摘要

    营销人员可以使用机器学习从在线发布的新闻和其他数据源中提取相关内容，以确定客户对他们品牌的看法以及他们对产品的反应。为了做到这一点，`Protagonist`
    平台让组织能够充分理解客户的动机和价值观，以及这些特征如何影响他们的购买决策。精通技术的营销人员还可以使用如 `AYLIEN` 等 API 构建自己的机器学习算法，以监控社交媒体情绪并收集相关新闻故事。


    ## 6. 使用注意力神经网络进行文本翻译

    深度学习注意力机制有助于改进机器翻译，并丰富你的营销资源以应对全球竞争。对于一个进入全新且语言迥异市场的品牌来说，翻译是一项重大的发布。然而，`AI` 的进步已让机器翻译接近人类的水平。为了合理化成本并加速这一过程，许多公司选择仅让人工翻译员对机器翻译输出进行审核和签字。


    ## 7. 使用 RNN（循环神经网络）生成文本

    如果你品牌的创意人员面临着持续压力，需要为新产品和活动想出好名字，你可以使用如 `RNN` 等生成式模型为自己提供几个听起来合理的名称。有些可能很有感染力/很奇怪，而另一些则惊讶地正是你需要的。


    ## 8. 聊天机器人和客户体验自动化对话系统

    聊天机器人和机器人是 `ML` 的某些应用。然而，对话系统是完全脚本化的，它们需要自然语言处理来适应各种问题。通过 `ML`，它们可以更好地满足客户需求并生成洞察。许多公司已经使用聊天机器人来与客户进行交流。


    ## 9. 带有 TTS 和 STT 的语音搜索

    语音搜索被认为是 `AI` 的一个重要领域。通过使用如 `Google Assistant` 和 `Amazon Echo` 等语音助手，已使无接触的搜索和购物成为可能。现在营销人员需要对话
    AI 策略，因为它是营销的未来。


    ## 10. 使用计算机视觉进行品牌识别

    计算机视觉是一个快速发展的机器学习领域，营销人员可以利用机器学习驱动的视觉技术识别产品并从视频中获取洞察。如 `GumGum` 等解决方案允许营销人员对标签和视频进行内容审核。


    ## 11. 使用 GANs（生成对抗网络）制作原创媒体

    `Nvidia` 在业务界引起了巨大轰动，因为它生成的写实图像引起了关注。虽然这些照片看起来像真人，但它们完全是由 `ML` 和 `AI` 生成的。通过使用
    `GAN`（生成对抗网络），`Nvidia` 系统变得越来越能够创建超真实的图像。`GAN` 有两个竞争的网络，一个是生成器，另一个是判别器，它们相互对抗并学习。结果是它们在制作和检测伪造图像方面变得更好。一些其他公司使用
    `GAN` 创建标志、从素描创建写实图像。


    ## 12. 营销活动的机器人自动化

    数字营销充满了旨在减轻压力工作人员工作的自动化解决方案。自动化流程已用于打开和分析邮件附件、读取邮件、为报告输入数据以及启用和跟踪社交媒体触发器以便营销人员保持领先。对于互联网广告，有一个名为
    `"Albert"` 的 AI 平台，可以减少大规模媒体购买的人工需求，加速必要的分析计算速度，并优化付费广告活动。


    '
- fmt: '

    # Chapter 4: Machine Learning for Finance ![](rsrcDN.jpg)


    ML already had useful financial applications before the emergence of efficient
    chatbots, mobile banking apps and search engines. Due to the high volumes, the
    required accuracy of historical data and the quantitative nature of the financial
    world, few other industries are more suitable for artificial intelligence. You
    can find more instances of machine learning in the financial sector than ever
    before. It''s a trend accentuated by more computing power and more accessible
    ML tools like Google''s `TensorFlow`. ML has arrived and plays a critical role
    in modern society and in many financial areas. It is involved in loan approval,
    asset management and risk assessment. Although very few tech-savvy people have
    an accurate picture of the number of views ML finds its way into people''s financial
    lives.


    ## Current financial applications


    Here are some examples of ML used in the world today. Keep in mind that some applications
    use multiple AI technologies or approaches and not just ML.


    ### 1. Portfolio management

    Robo-Advisor is a term that was not heard a few years ago, but is now widely used
    in the financial world. However, the term is a bit misleading because no robots
    are involved at all. Instead, the Robo advisors (e.g., `Betterment` or `Wealthfront`)
    are ML-based algorithms and built to shape a user''s financial portfolio, including
    their goals and risk tolerance. For example, users enter goals like retiring at
    age 65 with $ 3,000,000 in savings. They also enter their age, current financial
    status and income. The advisor, more accurately referred to as an allocator, then
    spends the investment across different asset classes and financial instruments
    to reach the user''s goals. The advisor system then calibrates to the changes
    in the user''s goals and to the actual changes in the market, making it the best
    fit for the user''s goals. They have become of great interest to consumers who
    do not need physical advisers to be comfortable with investments and those who
    are unable to pay fees to human advisers.


    ### 2. Trading with algorithm

    Algorithm trading dates back to the 1970s and is also referred to as automated
    trading systems. It uses difficult AI systems to make very fast trading decisions.
    The algorithmic systems make thousands or millions of transactions in one day.
    Therefore, the term `HFT` (High-Frequency Trading) is used and it is part of algorithmic
    trading. Most financial institutions and hedge funds do not disclose their AI
    approach they use for trading. However, it is believed that deep learning and
    ML are playing an increasingly important role in trading decisions. There are
    some exceptional limitations to using ML in trading shares.


    ### 3. Detecting fraud

    The system can detect abnormal behavior or unique activities by using machine
    learning and marking it with the security department. The biggest challenge for
    this system is to prevent false positives and situations where risks are flagged
    when there are actually no risks. There are a myriad of ways in which security
    breaches can occur, so real learning systems will become a necessity in the next
    5 to 10 years.


    ### 4. Insurance or credit insurance

    Underwriting can be described as the perfect job for ML in the financial sector,
    but there is a lot of concern in the market that the machines will replace many
    of the current underwriting positions. This is especially a problem with large
    organizations, such as large banks and limited liability companies. Machine learning
    algorithms can be trained in millions of consumer data cases such as jobs, age,
    marital status, etc. It can also be used for insurance results and financial loans
    to check if a person is in default or fails to pay or get their loans in time
    has been in a car accident. The underlying trends can be assessed using algorithms
    and continuously analyzed to detect trends affecting lending and insurance for
    the future. This way you can check whether more and more young people are having
    car accidents. Or has there been an increasing number of defaults under a specific
    demographic in the past 10 years? The results of these questions are of great
    benefit to the organizations. However, this is currently limited to large companies
    that have the resources to get data scientists and who have the massive amount
    of data (past and present) to train the algorithms.


    ## Machine Learning and Crypto currencies


    Trade supported by AI and machine learning has attracted enormous interest in
    recent years. There is a hypothesis that the inefficiencies in the cryptocurrency
    markets can be used to create big profits. The normal trading strategies supported
    by the state-of-the-art ML algorithms are much more capable than the standard
    benchmarks. Some non-trivial, but actually simple algorithms can help anticipate
    the short-term evolution of the cryptocurrencies market. The success that ML techniques
    had with stock market predictions suggested that the methods could also be used
    effectively to predict cryptocurrency prices. But applying the ML algorithm to
    the cryptocurrency market is mainly limited to analyzing `Bitcoin` prices using
    the `Bayesian neural network`, `random forests`, `long and short term memory neural
    networks` and some other algorithms. These studies anticipated bitcoin price fluctuations
    to some extent and concluded that the best results could be obtained by using
    algorithms based on neural networks. The deep learning enhancement was able to
    beat the performance of buy and hold strategies in predicting the prices of 12
    different cryptocurrencies over a one year period. There were other attempts to
    use ML to predict prices of cryptocurrencies other than `Bitcoin`, but they came
    from non-academic sources and did not yield any comparisons for the results.


    ## Day trading with machine learning


    The speculation in securities is called day trading. More specifically, it refers
    to buying and selling financial instruments on the same trading day. Strictly
    speaking, it is a trading event within one day. It means that all positions are
    closed when the market is closed for the day. The day traders look at identifying
    the entry and exit positions on the shares with favorable conditions. These conditions
    yield various small term gains that can add up to large gains. If there are people
    on the market who can recognize favorable patterns in the market, we can even
    train a machine to perform in the same way and even superhuman. This is the purpose
    of using machine learning for day trading. But first we need to identify the strategies
    that day traders use to signal market entry conditions. The technique is split
    into two processes: a high-level pattern description and the second is machine
    learning. In the first process, identifying input semantics, which occurs for
    potentially hundreds of predefined strategies. This is done using robust and highly
    scalable pattern matchers, such as `Apache Flink`. Once a cartridge has been activated
    we can go through the historical data and find the past cases where cartridges
    were activated and the outcome price was after 10 or 20 minutes. We can generate
    a training example for the algorithms using machine learning to create probability
    distribution over previous entries.

