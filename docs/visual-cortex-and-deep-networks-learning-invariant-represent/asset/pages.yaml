  md: '# Series Foreword


    Computational neuroscience is an approach to understanding the development and
    function of nervous systems at many different structural scales, including the
    biophysical, the circuit, and the system levels. Methods include theoretical analysis
    and modeling of neurons, networks, and brain systems and are complementary to
    empirical techniques in neuroscience. Areas and topics of particular interest
    to this book series include computational mechanisms in neurons, analysis of signal
    processing in neural circuits, representation of sensory information, system models
    of learning and memory. Further topics of interest include the intersection of
    computational neuroscience with engineering, from representation and dynamics,
    to observation and control.


    Terrence J. Sejnowski

    Tomaso Poggio'
