    Independent component analysis (ICA) [114] and similar unsupervised mechanisms
    describe plasticity rules similar to the basic Oja flow. They can generate Gabor-like
    receptive fields, and they may not need the assumption of different sizes of Gaussian
    distributions of lateraliculate nucleus (LGN) synapses. We used principal component
    analysis (PCA) simply because its properties are easier to analyze and should
    be indicative of the properties of similar Hebbian-like mechanisms.


