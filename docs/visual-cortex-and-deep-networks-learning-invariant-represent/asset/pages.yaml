- pgno: 13
  md: '# Preface xiii


    representations that are invariant to translation and scaling and approximately
    invariant to some other transformations (e.g., face pose and expressions) can
    considerably reduce the sample complexity of learning. We describe how an invariant
    and unique (selective) signature can be computed for each image or image path.
    The invariance can be exact in the case of locally compact group transformations
    (we focus on groups such as the affine group in 2-D and one of its subgroups,
    the similarity group consisting of translation and uniform scaling) and approximate
    under nongroup transformations. A module filtering and pooling, like the simple
    and complex cells described by Huber-Wiesel (HW) module, can compute these estimates.
    Each module provides a feature vector, which we call a signature, for the part
    of the visual field that is its receptive field. Interestingly, Gabor functions
    turn out to be optimal templates for maximizing simultaneous invariance to translation
    and scale. Hierarchies of HW modules inherit their properties, alleviating the
    problem of clutter in the recognition of wholes and parts. Finally, the same HW
    modules at high levels in the hierarchy are shown to be able to compute representations
    that are approximately invariant to a broader range of transformations, such as
    3-D expression of a face, pose of a body, and viewpoint (reflected in the neuron’s
    tuning) that are highly specific for each object class.


    Chapter 2 describes how neural circuits implement the operation required by the
    HW algorithm. It specifically discusses new models of simple and complex cells
    in V1. It also introduces plausible biophysical mechanisms for tuning and pooling
    and for learning the wiring based on Hebbian-like unsupervised learning. The rest
    of the book is devoted to reviewing the application of the theory to the feedforward
    path of the ventral stream in the visual cortex.


    Chapter 3 applies the theory to explain the multiresolution, eccentricity-dependent
    architecture of the retina and V1 as a consequence of the need for simultaneous
    space and scale invariance. It predicts several still untested properties of the
    early stages of vision. Chapter 3 also deals with V2 and V4 as higher layers in
    the hierarchy devoted to progressively increase invariance to shift and scaling
    while minimizing interference from clutter.


    Chapter 4 is about the final IT, where class-specific representations that are
    quasi-invariant to nongeneric transformations are computed from a shift and scale
    invariant representation obtained from V4. It also discusses the modular organization
    of anterior IT in terms of the theory. In particular, it proposes an explanation
    of the architecture and some puzzling properties of the face patches system.'
  merge: -1
  img_proc: true
