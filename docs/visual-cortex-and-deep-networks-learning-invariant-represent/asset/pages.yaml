    where $D(\eta,y)$ is the parabolic cylinder function. It can be proved [134, p.139]
    that the solutions have two behaviors, exponentially increasing and exponentially
    decreasing, and we have exponentially decreasing if and only if the following
    quantization condition holds:


    ```

