  md: '# # Invariant Representations


    Mathematics of Invariance


    # ## 1.1 Introduction and Motivation


    One could argue that the most important aspect of intelligence is the ability
    to learn [16]. How do present supervised learning algorithms compare with brains?
    One of the most obvious differences is the ability of people and animals to learn
    from very few labeled examples. A child, or a monkey, can learn a recognition
    task from just a few examples. The main motivation of this book is the conjecture
    that the key to reducing the sample complexity of recognition is invariance to
    transformations. Images of the same object usually differ from each other because
    of simple transformations such as translation, scale (distance), or more complex
    deformations such as viewpoint (rotation in depth) or change in pose (of a body)
    or expression (of a face).


    The conjecture is supported by previous theoretical work showing that all the
    complexity in recognition is due to the viewpoint and illumination nuis that swamp
    the intrinsic characteristics of the object [17]. It implies that in many cases
    recognition both identification (e.g., of a specific car relative to other cars)
    and categorization (e.g., distinguishing between cars and airplanes) would be
    much easier (only a small number of training examples would be needed to achieve
    a good level of performance) if the images of objects were rectified with all
    transformations, or equivalently, if the image representation itself were invariant.


    The case of identification object is obvious, the difficulty in recognizing exactly
    the same object like an individual face is only due to transformations. In the
    case of categorization, consider the suggestive evidence from the classification
    task in figure 1.1. The figure shows that if an oracle factors all transformations
    in images of many different cars and airplanes, providing rectified images with
    respect to viewpoint, illumination, position, and scale, the problem of categorizing
    cars versus airplanes becomes easy; it can be done accurately with very few labeled
    examples. In this case, good performance'
  merge: -1
  img_proc: true
