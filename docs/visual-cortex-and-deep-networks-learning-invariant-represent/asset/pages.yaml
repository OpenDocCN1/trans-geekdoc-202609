    different nonlinearities, each corresponding to a complex cell, can provide appropriate
    selectivity, assuming that each nonlinearity can be represented by a truncated
    power series and that the associated complex cells provide therefore sufficient
    number of linearly independent combinations of moments.


    # 2.2 Learning the Wiring in the Single-Cell Model


    A simple model of how the wiring between a group of simple cells with the same
    tuning (e.g., representing the same eigenvector, having the same orientation)
    and a complex cell may develop to invoke a Hebrew trace rule [49]. In a first
    phase, complex cells have subunits with different selectivities (e.g., orientations),
    for instance, natural images are invariant and its eigenvectors with different
    orientations are degenerate. In a second phase, subunits that are not active when
    the majority of subunits are active will be pruned out according to the Földi-like
    rule [49]. Földi’s original trace rule shows that the weight of a synapse between
    an input cell and an output cell is strengthened proportionally to the input activity
    and the trace of average recent activity at time t, where the dependence of the
    trace on previous activity decays over time with a certain decay constant.


