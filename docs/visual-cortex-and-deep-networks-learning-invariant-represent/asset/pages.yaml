    # ##2.1 A Single-Cell Model of Simple and Complex Cells


    At least two possible biophysical models for the Hubel-Wiesel module are implied
    by theory. The first is the original HW model of simple cells feeding into a complex
    cell. i-theory proposes the ideal computation of a cumulative distribution function
    (cdf), in which case the nonlinearity at the output of the simple cells is a threshold.
    A complex cell summing the outputs of simple cells would then represent a bin
    of a histogram. A different cell in the same position pooling a set of similar
    cells with a different threshold would represent another bin of the histogram.
    Another possibility is that the nonlinearity at the output of the simple cells
    is approximately a square (or any power or combination of powers). In this case
    the complex cell pooling cells with the same nonlinearity would represent a moment
    of the distribution, including the linear average. Note that in this case some
    of the complex cells would be linear and would be classified by neurophysologists
    using the standard criteria as simple. The nonlinear transformation at the output
    of the simple cells may correspond to the spiking mechanism in populations of
    cells (see references in [22]). The fact that a nonlinear biophysical mechanism
    can be approximated locally by a polynomial and thus noted several times [48,
    49]. This is also the reason for the similar performance of models such HMAX and
    the Freeman-Simicelli model [48]. The nonlinearity in our model neurons (or threshold)
    is well approximated by a few terms in a Taylor series approximation. As an aside,
    it should be emphasized that the distributions computed in theory by complex cells
    do not have anything to do with the classical statistical interpretation of images
    and textures. The distributions do not come from the statistics of images but
    from the action of a group, and thus are independent of the nature of the images
    and whether or not they are textures.


    The second biophysical model for the HW module implements the computation by i-theory
    consists of a single cell where dendritic branches play the role of simple cells
    (each branch containing a set of synapses with'
