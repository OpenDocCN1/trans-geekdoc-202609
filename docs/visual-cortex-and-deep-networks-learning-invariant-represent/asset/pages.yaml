  md: "# 5 Discussion\n\n# 5.1 i-Theory: Main Ideas\n\nNeurally plausible computation\
    \ for invariant representations. i-theory deals with a key computational problem\
    \ in object recognition: identifying or categorizing an object after looking at\
    \ a single example of it or an exemplar of its class. To paraphrase Geman [41],\
    \ the difficulty in understanding how biological organisms learn—in this case\
    \ how they recognize—is not the usual $n \to \\infty$ but $n \to 0$. The invariance\
    \ algorithm we study is suggested by known properties of neurons, in particular\
    \ their capability of performing almost automatically an approximation of the\
    \ dot product of a vector of inputs with another stored vector (of synaptic weights).\
    \ We introduce the notion of a signature of an object as a set of similarity measurements\
    \ with respect to the group transformations of a small set of template images.\
    \ We prove that the signature vector is invariant for the same group of transformations.\
    \ This result provides a solution for the problem of recognizing an object after\
    \ training with a single image of it—under conditions that are idealized but hopefully\
    \ capture a good approximation of reality.\n\nThe study of this algorithm and\
    \ its neural implementation leads to a number of predictions and explanations\
    \ related to aspects of the ventral stream. The main ones are as follows:\n\n\
    +   - A two-stage architecture comprising a retinotopic set of areas with cell\
    \ tuning that is independent of the object class and a set of nonretinotopic,\
    \ class-specific modules\n\n+   - Increasing receptive field (RF) sizes and invariance\
    \ in the areas of the retinotopic stage\n\n+   - Object-specific invariances in\
    \ the class-specific modules"
  merge: -1
