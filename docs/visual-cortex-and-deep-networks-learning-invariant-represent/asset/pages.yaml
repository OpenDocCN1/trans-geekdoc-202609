    $m_{inv} = O(p^2).


    This simple observation says that in the case of a translation group, invariant
    representation can decrease considerably the sample complexity, that is, the number
    of supervised examples necessary for a certain level of accuracy in classification.
    A heuristic rule is that the sample complexity gain is the order of the number
    of virtual examples generated by the action of the group on a single image (see
    [18, 19]). This is not a constructive result, but it supports the hypothesis that
    the ventral stream in the visual cortex tries to approximate such an oracle. The
    next section describes a biologically plausible algorithm that the ventral stream
    may use to implement an invariant representation.


    # 1.3 Unsupervised Learning and Computation of an Invariant Signature (One-Layer
    Architecture)


    The following algorithm is biologically plausible, as we discuss in detail in
    chapter 2, where we argue that it may be implemented in the cortex by a HW module,
    which is a set of KH complex cells (see box 1.2) with the same receptive field,
    pooling the output of a set of simple cells whose synaptic weights correspond
    to the K templates of the algorithm and its transformations (which are also called
    templates) and whose output is filtered by a sigmoid function with $\Delta h$
    threshold, $h = 1, \dots, H, \Delta > 0$.


