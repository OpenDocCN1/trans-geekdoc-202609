    stored in memory for each fixation of a novel image. Then, because of large and
    position-independent scale invariance, there is the following trade-off between
    learning and runtime recognition:


    +   * If a new object is learned from a single fixation, recognition may require
    multiple fixations at runtime to match the memory item (given its position invariance
    unless fixation is set to be within the object).

    * If a new object is learned from multiple fixations, with different fragments
    stored in memory each time, runtime recognition will need a lower number of fixations
    (in expectation).


    The fragments of an image stored in memory via multiple fixations could be organized
    into an egocentric map. Though the map may not be directly used for recognition,
    it is probably needed to plan fixations during learning and especially during
