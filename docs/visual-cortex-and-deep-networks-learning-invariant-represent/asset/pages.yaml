    # Invariance, Localization, and Wavelets


    The conditions equivalent to optimal translation and scale invariance, which correspond
    to maximum localization in space and frequency, cannot simultaneously satisfied
    because of the classic *uncertainty principle*: if a function $t(x)$ is essentially
    zero outside an interval of length $\Delta x$ and its Fourier transform $\hat{t}(\omega)$
    is essentially zero outside an interval of length $\Delta\omega$, then


    ```

    $$\Delta x \cdot \Delta\omega \geq 1. \quad (A.20)$

    ```


    In other words, a function and its Fourier transform cannot both be highly concentrated.
    Interestingly, for our setup the uncertainty principle also applies to sequences
    (see [25]).


    It is well known that the equality sign in the uncertainty principle above is
    achieved by Gabor functions (see [24]) of the form


    ```

    $$\psi_{x_0,\omega_0}(x) = e^{-\frac{(x-x_0)^2}{2\sigma_x^2}} e^{i\omega_0 x},
    \sigma_x \in \mathbb{R}^+, \omega_0 \in \mathbb{R}. \quad (A.21)$

    ```


    The uncertainty principle leads to the concept of optimal localization instead
    of exact localization. In a similar way, it helps to relax our definition of strict
    invariance (e.g., $|\mu_h^k(I)| = |\mu_h^k(\\hat{I})|$) and to introduce $\epsilon$-invariance
    as $|\mu_h^k(I)-\mu_h^k(\\hat{I})| \leq \epsilon$. If we suppose, the localization
    condition


    ```

    $$\langle TI, t\rangle = e^{-\frac{t^2}{2\sigma_t^2}}, (D_Ix, t) = e^{-\frac{t^2}{2\sigma_s^2}},
    \sigma_t,\sigma_s \in \mathbb{R}, \quad (A.22)$

    ```'
