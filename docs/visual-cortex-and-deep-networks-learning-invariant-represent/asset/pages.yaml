  md: 'The class-specific module is also effectively a gate. In addition to providing
    a degree of invariance it performs a template-matching operation with templates
    that can effectively block images of other object classes. This effect may be
    important for the system of face patches discovered by Freiwald and Tsao [105,
    106], and it is especially obvious in the case of a single-object module.


    From point of view of evolution, the use of the HW module for class-specific invariance
    can be seen as a natural extension from its role in single-object view invariance.
    The latter case is computationally less interesting, since it effectively implements
    a look-up table, albeit with interpolation power. The earlier case is more interesting,
    since it allows generalization from a single view of a novel object. It also represents
    a clear case of transfer of learning.


    Some of the best evidence for modules in IT for individual objects is provided
    by the Logotheis data from monkeys who were trained intensively to specific unfamiliar
    paperclip objects [96–98]. Unfortunately, fMRI data about spatial clustering in
    cortex was not available at the time.


    # 4.3 Domain-Specific Regions in the Ventral Stream


    There are other domain-specific regions in the ventral stream besides faces and
    bodies [13]. We think that additional regions for less common or less transformation-compatible
    objects will appear with higher-resolution imaging techniques. One example may
    be the fruit area, discovered in macaques with high-field fMRI [99]. Others include
    the body area and the lateral occipital cortex (LOC), which is not really a dedicated
    region for general object processing but a heterogeneous area of cortex containing
    many specific regions small to be detected by the resolution of fMRI [100]. The
    visual word area (VWFA) [101] seems to represent printed words. In addition to
    the generic transformations that apply to all objects, printed words undergo several
    nongeneric transformations that never occur with other objects. For instance,
    reading is rather invariant to font transformations and can deal with handwritten
    text. Thus, VWFA is well accounted for by the invariance hypothesis. Words are
    frequently viewed under class-specific transformations. i-theory suggests that
    the limit case is object classes that consist of single objects. We expect that
    IT will include many small modules in addition to large ones such as the face
    and the body modules. This prediction is consistent with evidence (e.g., [102])
    of clustering of tuning in IT by category. Our prediction does not depend on supervised
    learning.'
