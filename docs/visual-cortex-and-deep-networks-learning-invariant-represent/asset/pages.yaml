    \quad \xi_n(x) = e^{+\alpha^2} \psi_n(x).$$


    Decomposing $t^{\otimes}(\mathbf{x})$ in the Fourier basis,


    $$\lambda_n\xi_n(y) - \frac{1}{\sqrt{2\pi}} \int dx \ e^{-2\alpha^2} d\omega t^{\otimes}(\omega)
    e^{i\omega(y-x)} \xi_n(x) = 0.$


    Deriving in the $y$ variable and rearranging the expression,


    $$\lambda_n\xi_n''(y) + \frac{1}{\sqrt{2\pi}} \int d\omega t^{\otimes}(\omega)
    \int dx \ e^{-2\alpha^2} \psi_n(x) e^{-i\omega x} = 0.$ (A.37)


    This expression is equivalent to the original eigenproblem in eq. (A.36) adding
    the conditions (e.g., $\xi_n(0) = c$, $\xi_n''(0) = c$). In fact, the derivative
    of a function, the function is uniquely determined, having its value on a point.
    Therefore the function $\xi_n''(y)$ uniquely determines $\xi_n(y)$ if we have,
    instance, $\xi_n(0) = c$, and the function $\xi_n(y)$ uniquely determines $\xi_n''(y)$
    if we have, instance, $\xi_n''(0) = c$.


    Using the Fourier operator $\mathcal{F}$, we can rewrite (A.37) as


    $$\lambda_n\xi_n''(y) + 2\pi\delta^{-1}(t^{\otimes}(\omega)) \delta(e^{-2\alpha^2}
    \psi_n(x)) = 0.$


    By the convolution theorem,


    $$\lambda_n\xi_n''(y) + 2\pi\delta^{-1}(t^{\otimes}(\omega)) * (e^{-2\alpha^2}
    \xi_n(x)) = 0.$


    Expanding $\omega^2 t^{\otimes}(\omega)$ in a Taylor series and recalling that
    $\delta^{-1}(\omega^m) = i^m\delta^m(x)$, we are led to the differential equation


    $$\lambda_n\xi_n''(y) + \frac{1}{\sqrt{2\pi}} (c_0\delta + ic_1\delta^1 + \dots)
    * (e^{-2\alpha^2} \xi_n(x)) = 0.$ (A.38)


