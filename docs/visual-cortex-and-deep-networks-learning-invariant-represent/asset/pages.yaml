    A natural question is whether there are situations in which a finite number of
    projections suffice to discriminate any two probability distributions, that is,
    P_l \neq P''_l \Leftrightarrow d(P_l, P_r) \neq 0. Empirical results show that
    this is often the case with a small number of templates (see [125]) and HMAX experiments.
    The problem of mathematically characterizing the situations in which a finite
    number of (one-dimensional) projections are sufficient is challenging. Here we
    provide a partial answer to this question.


    We start by observing the metric (A.7) can be approximated by uniformly sampling
    K templates and considering


    ```

    \hat{d}_K(P_l, P_r) = \frac{1}{K} \sum_{k=1}^K d_{\mu}(\mu^k(I), \mu^k(I'')),
    A.8

    ```


    where \mu^k = \mu^k. The following result shows that a finite number K of templates
    is sufficient to obtain an approximation within a given precision \epsilon. Toward
    the end,


    ```

    \d_{\mu}(\mu^k(I), \mu^k(I'')) = |\mu^k(I) - \mu^k(I'')|}{\R^H}, A.9

    ```


    where ||.||_{\R^H} is the Euclidean norm in \R^H. The following theorem holds.


    **Theorem A.5** Consider n images \X_n in \X. Let K \geq \frac{2}{\epsilon^2}
    \log\frac{c}{\delta}, where c is a universal constant.


    ```

    |d(P_l, P_r) - \hat{d}_K(P_l, P_r)| \leq \epsilon, A.10

    ```


    with probability 1 - \delta^2, for all I, I'' \in \X_n.


    **Proof:** The proof follows from an application of the Hoeffding inequality (see
    Box A.1) and union bound. Fix I, I'' \in \X_n. Define the real random variable
    Z = S(\R^d) \to \R,


    ```

    Z(\mu^k) = |\mu^k(I) - \mu^k(I'')|}{\R^H} \leq c, k = 1, ..., K.

    ```


    From the definitions it follows that ||Z|| \leq c, and \E(Z) = d(P_l, P_r). Then
    the Hoeffding inequality implies


    ```

    |d(P_l, P_r) - \hat{d}_K(P_l, P_r)| = |\frac{1}{K} \sum_{k=1}^K \E(Z) - Z(\mu^k)|
    \geq \epsilon,

    ```


    with probability at most $e^{-ce^2k}$. A union bound implies a result holding
    uniformly on \X_n; the probability becomes $n^2e^{-ce^2K}$. The desired result
    is obtained, noting that this probability is less than $\delta^2$ as soon as $n^2e^{-ce^2K}
    < \delta^2$, that is, K \geq \frac{2}{\epsilon^2} \log\frac{c}{\delta}$.'
