    $$\lambda_n\xi_n''(y) + \sqrt{2\pi} e^{-2\alpha^2} \psi_n(y) = 0.$


    In the harmonic approximation


    $$\xi_n''''(y) + \frac{\sqrt{2\pi}}{\lambda_n}(1 - 2\alpha y^2) \xi_n(y) = 0,$
