    # A.6.1.1 Square Aperture, Circulants, and Fourier


    We start from the simplest discrete case where we assume primitive boundary conditions
    (on one layer of receptive fields), resulting in a circulant structure of the
    collection of transformed templates. Define T as the circulant matrix where each
    column represents a template t shifted relative to the previous column. This corresponds
    to assuming that the world translates and is seen through a square aperture with
    periodic boundary conditions. Let us use in this example that the image is one-dimensional.
    Thus the image seen through an aperture,


    $a(x) \text{ s.t. } a(x) = 1$ for $0 \leq x \leq A$; $a(x) = 0$ otherwise,


    $t(x-y)a(x)$ is the image shifted by $y$. We are led to the following problem.
    Find the eigenvectors of the symmetric matrix $TT^T$, where $T$ is a circulant
    matrix (see [132]). If we consider the continuous version of the problem, that
    is, the eigenvalue problem


    ```

    $\int^A dx\psi_n(x)t^{(\)}(y-x)dx = \lambda_n\psi_n(y),$

    ```


    with $t^{(\)}$ is the autocorrelation function associated with $t$, the solution
    is $\psi_n(x) = e^{-2\pi i n x}$, which is the Fourier basis between 0 and A.


    # A.6.2. Cortical Aperture: Derivation and Solution


    Suppose $a(x) = e^{-\alpha x^2}$. Eq. (A.36) can be written as


    ```

    $\lambda_n\psi_n(y) - e^{-\alpha y^2} \int dx e^{-\alpha x^2}t^{(\)}(y-x)\psi_n(x)
    = 0,$

    ```'
