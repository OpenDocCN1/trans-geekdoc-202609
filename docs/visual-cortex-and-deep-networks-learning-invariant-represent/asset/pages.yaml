- pgno: 40
  md: '# Chapter 2


    where $x_n$ is the input vector, $w_n$ is the presynaptic weights vector, $y$
    is the postsynaptic response $y(x_n) = y_n = w_n^T x_n$, and $\alpha$ is a positive
    constant called the learning rate. In order for this dynamical system to adequately
    converge, there is considerable experimental evidence that the cortex employs
    normalization [61]. Hebb''s rule, appropriately modified with a normalization
    factor, turns out to be an online algorithm to compute the eigenvectors of the
    covariance matrix of a set of input vectors. In this case it is called Oja''s
    flow. Oja''s rule [62, 63] defines the change in presynaptic weights $w_n$ when
    given the output response $y$ of a neuron to its inputs to


    ```

    $\Delta w_n = w_{n+1} - w_n = \alpha y_n (x_n - y_n w_n)$.

    ```


    The equation follows from expanding to the first-order Hebb rule normalized to
    avoid divergence of the weights.


    Box 2.1

    Principal Components


    Principal component analysis (PCA) is a statistical procedure that allows identification
    of the principal directions in which the data vary. Those principal directions
    of variations are called principal components and are found by calculating the
    eigenvectors and eigenvalues of the data covariance matrix, defined as the matrix
    product between the data matrix and its transpose.


    The Oja flow converges to the eigenvector of the covariance matrix of $x_n$ that
    has the largest eigenvalue, we are led to analyze the spectral properties of the
    inputs to simple cells and to study whether the eigenvectors (also called principal
    components PCA); see box 2.1) can be used by the HW algorithm and in particular
    whether they satisfy the selectivity and invariance theorems.


    Alternatives to Oja''s rule should be considered [64, 65]. Note that a relatively
    small change in the Oja equation gives an online algorithm for computing independent
    components instead of PCs (see [66]). Which kind of plasticity is closer to biology
    remains an open question.


