  md: '# Biophysical Mechanisms of Invariance


    can be learned from unsupervised visual experience. Such architectures represent
    a significant extension, beyond simple translation invariance and beyond hardwired
    connectivity, models of the ventral stream such as Fukushima''s Neocognition [2]
    and HMAX [47, 50] as well as deep neural networks called convolutional networks
    [34, 51] and related models [52–59].


    In biological terms, the sequence of transformations of one template would correspond
    to a set of simple cells, each starting in its tuning a frame of the sequence.
    In a second learning step a complex cell would be wired to those simple cells.
    However, the idea of direct storage of synapses of images or image patches in
    the tuning of a set of V1 cells by exposure to a single object transformation
    is biologically rather implausible. Since Hebian-like synapses are known to exist
    in the visual cortex, a biologically plausible hypothesis is that synapses incrementally
    change over time as an effect of the visual inputs, that, over many sequences
    of images resulting from transformations of objects (e.g., templates). The question
    is whether such a mechanism is compatible with i-theory, and how.


    We explore this question for V1 in a simplified setup that can be extended to
    other areas. We assume the following:


    +   1. The synapses between LGN inputs and (immature) simple cells are Hebian,
    and in particular their dynamics follow Oja''s flow. In this case, the synaptic
    weights will converge to the eigenvector with the largest eigenvalue of the covariance
    of the input images.

    2. The position and size of the untimely simple cells are set during development
    according an inverted pyramidal lattice (see figure 3.2 in the next chapter).
    The key point is that the size of the Gaussian spread of the synaptic inputs and
    the positions of the ensemble of simple cells are assumed to be independent of
    visual experience.


    In summary, we assume that the neural equivalent of the memorization of frames
    (of transforming objects) is performed online via Hebian synapses that change
    as an effect of visual experience. Specifically, we assume that the distribution
    of signals by a maturing simple cell is Gaussian-like in x, y, reflecting the
    distribution on the dendritic tree of synapses from the lateral geniculate nucleus.
    We also assume that there is a range of Gaussian distributions with different
    $\sigma$, which increase with retinal eccentricity. As an effect of visual experience,
    the weights of the synapses are modified by a Hebb rule [60]. Hebb''s original
    rule can be written as


    ```

    $$\delta w_n = \alpha y(x_n)x_n,$$

    ```'
