    # Historical Background and Bibliography


    There exists an extensive literature about invariant approaches to image representation.
    One of the first and most inspiring papers that used explicitly the group structure
    of the transformations and the group average technique to build invariant features
    is Mirbach''s [43]. A different approach using group-invariant kernels was analyzed
    in Burkhart [44]. Together with the work on kernel average embedding [45], it
    inspired our recent work on the equivalence between deep convolutional networks
    and hierarchical kernel machines [12]. More recently Mallat [32] developed an
    invariant representation called group scattering, which uses a cascade of modulus
    nonlinearities applied to wavelets coefficients in order to get group-invariant
    representations that are robust to small diffeomorphic transformations.


