  md: '# Invariant Representations


    # 1.8 Deep Networks and i-Theory


    The class of learning algorithms called deep learning (particularly convolutional
    networks) is based on two computational operations in multiple layers.


    The first operation is the inner product of an input with another point called
    a template (or filter or kernel), followed by a nonlinearity. The output of the
    dot product corresponds to the neural response of a simple cell [20]:


    $I \mapsto |\langle I, gt \rangle + b|_{+}$


    where $|y|_+ = \max(0, y)$.


    The second operation is $pooling$. It aggregates in a single output the values
    of the different inner products computed computed, for example, via a sum


    $$\sum_{g} |\langle I, gt \rangle + b|_{+}, \quad t \in T, b \in \mathbb{R} \qquad
    (1.9)$


    or a max operation $|\langle I, gt \rangle + b|^{+}$. This corresponds to the
    neural response of a complex cell [20]. In i-theory the nonlinearity acting on
    the dot product is considered part of the computation of a histogram, but the
    networks are completely equivariant.


    It turns out (see references in [12]) that units of a deep convolutional network
    (DCN) using linear rectifiers (called “ramps") correspond to a kernel with


    $$\tilde{K}(I, I'') = \int dt \ dg'' |\langle I, gt \rangle + b|_{+} |\langle
    g'', I'' \rangle + b|_{+} . \qquad (1.10)$


