  md: '# 4


    # Chapter 1


    resolution, such as in the mouse. The final architecture is shown in figure 1.5.
    In the first stage about four layers compute representations that are increasingly
    invariant to translation and scale, while in the second stage a large number of
    specific parallel pathways deal with approximate invariance to transformations
    that are specific for objects and object classes. Note that for any representation
    that is invariant to X and selective for Y, there may be a dual representation
    that is invariant to Y but selective for X. In general, both are needed for different
    tasks, and both can be computed by an HW module with different pooling strategies.
    In general, the circuits computing them share a good deal of overlap. For example,
    it is possible that different face patches in the cortex are used to represent
    different combinations of invariance and selectivity.


    # 1.2 Invariance Reduces Sample Complexity of Learning


    In a machine learning context, invariance to image translations, for instance,
    can be built trivially by memorizing examples of the specific object in different
    positions. Human vision, on the other hand, is clearly invariant for novel objects:
    people do not have any problem in recognizing a distance-invariant way a face
    seen only once. It is intuitive that representations of images that are invariant
    to transformations such as scaling, illumination, and pose should allow supervised
    learning from far fewer examples.


    A proof of the conjecture for the special case of translation or scale is provided
    in appendix section A.1. For images defined on a grid of pixels, the result (in
    the case of translations) can be proved using well-known relations between covering
    numbers and sample complexity.


    Box 1.1

    Sample Complexity

    Sample complexity is the number of examples needed for the estimate of a target
    function to be within a given error rate. In the example of figure 1.1, the number
    of airplanes or cars, we trained the linear classifier to perform the recognition
    task with a certain precision.


