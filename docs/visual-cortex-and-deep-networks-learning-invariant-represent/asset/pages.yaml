  md: '# 2 Chapter 1


    was obtained from a single training image of each class, using a simple classifier.
    In other words, the sample complexity of the problem seems to be very low (see
    box 1.1 and figure 1.1).


    A similar argument involves estimating the cardinality of the universe of possible
    images generated by different viewpoints, such as variations in scale, position,
    and rotation in 3-D, versus intrlass variability, such as different types of cars.
    Let us try to estimate whether the cardinality of the universe of possible images
    generated by an object originates from intrlass variability (e.g., different types
    of dogs) or from the range of possible viewpoints, including scale, position,
    and rotation in 3-D. Assuming a granularity of a few minutes of arc in terms of
    resolution and a visual field of, say, 10 degrees, one would get $10^3–10^5$ different
    images of the same object from x,y translations, another factor of $10^3–10^5$
    from rotations in depth, a factor of $10–10^2$ and another factor of $10–10^2$
    from scaling. This gives on the order of $10^4–10^{14}$ distinguishable images
    for a single object. On the other hand, how many different (for humans) types
    of dogs exist within the dog category? It is unlikely that there are more than,
    say, $10^2–10^3$. From this point of view, it is a greater win to be able to capture
    the geometric transformations than the intracategory differences.


    As context for this book, let us describe the conceptual framework for primate
    vision that we use


    +   - The first 100 msec of vision in the ventral stream are most feedforward.
    The main computational goal is to generate a number of images representing, each
    quasi-invariant to some transformations experienced during development, such as
    scaling, translation, and pose changes. The representations are used to answer
    basic default questions about what kind of image and what it may be.


    +   - The answers will often have low confidence, requiring an additional verification/prediction
    step, which may require a sequence of shifts of gaze and attentional changes.
    This step may rely on generative models and probabilistic inference or on top-down
    visual routines following memory access. Routines that can be synthesized on demand
    as a function of the visual task are needed in any case to go beyond object classification.
    Note that in a Turing test of vision [133] only the simplest, standard questions
    (what is there? who is there? etc.) can be answered by pretrained classifiers.


    We consider only the feedforward architecture of the ventral stream and its computational
    function. To help readers understand more easily the mathematics of this part
    of the book, we anticipate here the network of visual areas that we propose for
    computing invariant representations for feedforward visual'
