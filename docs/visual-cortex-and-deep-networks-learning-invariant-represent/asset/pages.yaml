- pgno: 122
  md: 'where the $i$ axis is the count of the number of PCs. Reconstruction up to
    an $\epsilon$ factor will correspond to a constant $T(\epsilon)$ such that $\lambda
    < T(\epsilon)$, that is, with a simple inversion of the formula we have that the
    number of PCs that allows a reconstruction with an error up to e is


    ```

    $$f(s) = -\text{Round In}(T(\\epsilon))s$$

    ```


    Neglecting for the moment Round approximation, we have that the comparison between
    the one- and two-layer architecture boils down to


    (two layers) $d + P \leq Pd$ (one layer).


    For $P > 1$ (more than one part) we have that $d + P < Pd$ is always true, that,
    there are fewer templates for the two-layer architecture than for the one-layer
    architecture. Any choice of dictionary that allows the same reconstruction error
    with fewer dictionary elements will give a similar result. The underlying idea
    is that images have structure and can be expressed with a dictionary of cardinality
    much lower than the number of pixels.


    **Remark A.29** This is an application of the J-L lemma in a nonlinear setting.
    In a hierarchical architecture the nonlinearity is the indicator function on the
    parts.'
