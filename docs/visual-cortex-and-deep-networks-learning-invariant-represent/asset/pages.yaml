  md: '# # Appendix


    # ## A.1 Invariant Representations and Bounds on Learning Rates: Sample Complexity


    In this section we derive a mathematical proof of how an invariant representation
    can effectively reduce the sample complexity of the recognition task. In particular,
    we show that far fewer examples are needed to train a classifier for recognition
    (sample complexity) if we use an invariant representation. We start with the basic
    problem of learning how two sets of random variables x,y if their relation is
    described by the distribution P(x,y), the problem is usually solved by minimizing
    the square loss


    ```

    $E(f) = \int (y - f(x))^2 P(x,y)dx dy.$

    ```


    However, the distribution $P(x,y)$ is unknown, and what can be minimized is the
    empirical error of a set or random sampled points $(x_i, y_i)$, $i = 1, \dots,
    m,$


    ```

    $E_m(f) = \sum_{i=1}^{m} (y_i - f(x_i))^2.$quad (A.1)

    ```


