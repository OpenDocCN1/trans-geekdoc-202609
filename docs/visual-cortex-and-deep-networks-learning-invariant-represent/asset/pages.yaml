    # Hoeffding Inequality


    Suppose we have a set of variables $X_i$. It is intuitive that when we average
    over them we should normally get a result close to the expected value. Hoeffding
    quantifies normally and close. More formally, let $X_1, \dots, X_N$ be a set of
    independent, independently distributed random variables such that $0 \le X_i \le
    1$. We have


    ```

    $$\Pr(|\frac{1}{N}\sum_{i=1}^N X_i - E(X)| > \epsilon) \le \delta = 2e^{-2Ne\epsilon^2}$

    ```


    This result shows that the discriminability question can be answered in terms
    of empirical estimates of the one-dimensional distributions of projections and
    the transformations induced by the group on a number of templates $t^k, k=1, \dots,
    K$.


    Theorem A.5 can be compared to a version of the Cramér-Wold theorem for discrete
    probability distributions Heppes [125, theorem 1] shows that for a probability
    distribution consisting of $k$ atoms in $\mathbb{R}^d$, at most $k+1$ directions
    ($d_1=d_2=\dots=d_{k+1}=1$) are enough to characterize the distribution and thus
    a finite (albeit large) measure of one-dimensional projections.


    The signature $\Sigma(I) = (\mu_H^1(I),\dots,\mu_H^k(I))$ is obviously invariant
    (and unique), since it is associated to an image and all its transformations (an
    orbit). Each component of the signature is invariant; each measurement can be
    defined as


    ```

    $$\mu_H^k(I) = \frac{1}{|G|}\sum_{g\in G} \eta_h((gl,t^k)).$$ (A.11)

    ```


    For finite group, or equivalently,


    ```

    $$\mu_H^k(I) = \int_G dg \eta_h((gl,t^k)) = \int_G dg \eta_h((l,g^{-1}t^k)).$$
    (A.12)

    ```


    When $G$ is a (locally) compact group, the nonlinearity $\eta_h$ is chosen to
    define a histogram approximation. It is clear that from the properties of the
    Haar measure we have


    ```

    $$\mu_H^k(gl) = \mu_H^k(I), \forall g\in G, I \in \mathcal{X}.$$ (A.13)

    ```


    This is a key property of the signature and one of our model.


