    # 5.3 Predictions and Explanations


    From point of view of neuroscience, i-theory provides a number of predictions
    and explanations. Following are questions that the theory tries to answer:


    +   * What is visual cortex computing?

    * What are the functions and circuits of simple and complex cells?

    * Why is there Gabor-like tuning in simple cells?

    * Why there generic Gabor-like tuning in early areas and specific selective tuning
    higher up?

    * What is the computational reason for the eccentricity-dependent size of RFs
    in V1, V2, V4?


    Some predictions are the following:


    +   * Simple and complex cells should be found in all visual and auditory areas,
    not only in V1. Our definitions of simple cells and complex cells are different
    from the traditional ones used by physiologists. In i-theory complex cells represent
    invariant measurements associated with statistics of the outputs of simple cells.
    The theory implies that some conditions or approximate invariance to all geometric
    image transformations can be learned, during development or in adult life. It
    is, however, also consistent with the possibility that basic invariances may be
    genetically encoded by evolution but refined and maintained by unsupervised visual
    experience. A single-cell model for simple and complex cells follows from the
    theory as an interesting possibility.'
