    # 5.2  i-Theory, Deep Learning Networks, and the Visual Cortex


    Since the work on i-theory began, a class of learning algorithms called convolutional
    learning networks (DCLNs)—a new name for multilayer perceptrons (MLPs)—has achieved
    good performance in many applications. Historically, hardwired invariance to scale
    was first introduced in the Neocognitron by Fukushima [2] and later in LeNet [109]
    and HMAX [47]; HMAX also had invariance to scale. These architectures are early
    examples of convolutional networks. There is no significant difference between
    i-theory and DCLNs. The basic operation in both cases is obtaining the inner product
    of the input $I$ with a group transformation $gt$ of a template. A pooling stage
    follows. Thus the basic operation in a convolutional layer


    ```

    $$\sum_{g}\sigma((I,gt)+b), \quad t\in T,b\in \mathbb{R}. \qquad (5.1)$

    ```


    If $\sigma$ is a step function, the pooling can compute a histogram. However,
    several nonlinearities are admissible, being invariant and selective (see chapter
    1 and [9]). The nonlinearity used in present-day DCLNs is a “ramp,” that is, a
    rectification nonlinearity.


    ```

    $$\sum_{g}|(I,gt)+b|+, \quad t\in T,b\in \mathbb{R}. \qquad (5.2)$

    ```


    Note that nonconvolutional layers are a special case of the preceding equations
    when the only element in $G$ is the identity. The rectification is neutrally quite
    plausible, and should be included in a theory of the visual cortex. As mentioned,
    the results of i-theory continue to hold:


    +   - Linear combinations of rectified dot products are equivalent to kernels
    measuring the similarity between $I$ and $gt$. Thus the effect of rectifying nonlinearities
    is to define a new dot product in the feature space of the kernel.


    +   - Group averages of nonlinear functions of the dot products are invariant
    and selective (no need for explicit histograms).


    The *pooling* operation


    ```

    $$\sum_{g}|(I,gt)+b|+, \quad t\in T,b\in \mathbb{R}. \qquad (5.3)$

    ```'
