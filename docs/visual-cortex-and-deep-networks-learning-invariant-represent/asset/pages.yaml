    the forest.


    A partial solution to this problem is a hierarchical architecture for stage 1
    in which lower layers provide signatures with a small range of invariance for
    small parts of the image, and higher layers provide signatures with greater invariance
    for larger parts of the image (see appendix section A.3). All these signatures
    could be used by class-specific modules, possibly in a reverse hierarchy strategy
    ([421]), that is, using first the top-level signatures and the low-level ones
    in a task-dependent, top-down mode. We describe this architecture, starting with
    the retina and V1, in chapter 3. Three points are of interest:


    +   - Factorization of the range of invariance is possible if a certain property
    of the hierarchical architecture, called covariance, holds. Assume a group transformation
    of the image that is, for instance, transformation or scaling of it. The first
    layer in a hierarchical architecture is called covariant if the pattern of neural
    activity transforms according to the same group of transformations. We describe
    this property (see box 1.7): isotropic architectures, like the ones considered
    in this book, with pointwise nonlinearities, are covariant.


    +   - Since each module in the architecture gives an invariant output if the transformed
    object is contained in the pooling range, and since the pooling range increases
