  md: '# 4 Class-Specific Approximate Invariance in Inferior Temporal Cortex


    #  4.1 From Generic Templates to Class-Specific Tuning


    As discussed in chapter 1, approximate invariance for transformations beyond the
    affine group requires highly tuned templates and therefore highly tuned simple
    cells. This is expected to take place in higher, nonretinotopic visual areas of
    the hierarchy. This is consistent with the architecture of the ventral stream
    and the existence of class-specific modules in the primate cortex such as a face
    module and a body module [91–94]. We saw that areas in the hierarchy up to V4
    or PIT provide signatures for larger parts or full objects. Thus we expect the
    following:


    +   - Inputs to the class-specific modules are more scale and shift invariant
    than in earlier areas such as V1.

    - Class-specific templates are large. For instance, in the case of faces, templates
    should cover significant regions of the face. Note that only large templates support
    invariance: the image of an isolated eye does not change much under rotations
    in depth of the face (and at most undergoes scaling and shifting).


    #  4.2 Development of Class-Specific and Object-Specific Modules


    A conjecture emerging from i-theory offers an interesting perspective on anterior
    temporal cortex (AIT) [13]. For transformations that are not affine transformations
    in 2-D (we assume 3-D information is not available to the visual system or used
    by it, which may not always be true), an invariant representation cannot be computed
    from a single view of a novel object because the information available is not
    sufficient: lacking are the 3-D structure and the material properties of the object.
    Thus invariance to rotations'
