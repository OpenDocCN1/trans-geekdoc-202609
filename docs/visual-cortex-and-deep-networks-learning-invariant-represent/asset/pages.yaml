    #  3.1 V1


    #  3.1.1 A New Model from i-Theory for Eccentricity Dependence of Receptive Fields


    The simplest and most common image transformations are affine transformations
    and in particular the subgroup consisting of shifts in position ($x$) and uniform
    changes in scale ($s$). The theory suggests that the first step of the invariance
    computation likely consists of learning the set of transformations. This is implicitly
    done via actual visual experience (or by evolution encoded in the genes or by
    a combination):


    +   1. Store template $t^k$ (which is an image patch and could be chosen at random).


    +   2. Store all the observed templates (bound together by continuity in time).


    +   3. Repeat steps 1 and 2 for a set of $K$ templates.


    Although the templates can be arbitrary image patches, we assume—because of the
    optimal invariance theorem (see chapter 1) and because of experimental evidence
    from V1 simple cells—that V1 templates are Gabor-like functions (more precisely,
    windowed Fourier transformations [72]), p. 92).


    Under scaling, a pattern exactly at the center of the fovea will change size without
    any translation of its center, and its boundaries will shift in $x,y$. For a pattern
    centered at some nonzero eccentricity, scaling will translate the center in the
    $s,x$ plane (see figure 3.1). In the $s,x$ plane the slope of the trajectory with
    a slope that depends on the size of the pattern and the associated position.


    Consider a Gabor function at $s=s_0, x=0$. $s_0$ is the minimum possible receptive
    field (RF) size, given constraints. Transforming it by shifts in $x$ within $(-x_0,
    x_0)$ generate a set $\Lambda_0$ of templates. Suppose want to ensure that what
    at the highest resolution $(x_0)$ remains recognizable at all scales up to $s_{max}$.'
