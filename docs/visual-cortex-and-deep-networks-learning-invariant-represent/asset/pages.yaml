- pgno: 120
  md: "# A.11 Nonlinearities Are Key in Gaining Compression from Repeated Random Projections\n\
    \nThe selectivity property of the invariant representation proposed here is guaranteed\
    \ by an adequate number of projections onto random templates (or PCs) (see section\
    \ A.2). In the following we prove that repeating this projection step does not\
    \ provide any computational advantage unless nonlinearities came into play.\n\n\
    # A.11.1 Hierarchical (Linear) Johnson-Lindenstrauss Lemma\n\nLet $\\{x_1, x_2,\
    \ \\dots, x_n\\}$ be a set of vectors in $\\mathbb{R}^d$. The J-L lemma says that\
    \ for any $0 < \\epsilon < 1/2$ there exists an $f: \\mathbb{R}^d \to \\mathbb{R}^k$\
    \ for $k = O(\\epsilon^{-2}) \\log(n)$ such that\n\n$$i, j \\quad (1-\\epsilon)\
    \ \\|x_i - x_j\\|_2 \\le \\|f(x_i) - f(x_j)\\|_2 \\le (1+\\epsilon) \\|x_i - x_j\\\
    |_2.$\n\nThe J-L lemma is equivalent to the statement [132].\n\n**Lemma A.28**\
    \ For any $0 < \\epsilon < 1/2$ and positive integer $d$, there exists a distribution\
    \ $D$ over $\\mathbb{R}^{k \times d}$ for $k = O(\\epsilon^{-2}\\log(1/\\delta))$\
    \ such that for any $x \\in \\mathbb{R}^d$ with $\\|x\\|_2=1$,\n\n> $$Pr_{A \\\
    sim D}[\\|Ax\\|_2^2 - 1| > \\epsilon] < \\delta.$\n\nWe want to formulate a local\
    \ version of the J-L lemma and then a recursive/hierarchical one. For the local\
    \ version suppose $x \\in \\mathbb{R}^{d \times p}$. Let $A = \\mathbb{P}_p \\\
    otimes A$ and $x_k = P_kx$ be the projection onto the $k$-th block of $d$-components\
    \ of the vector, $k=1, \\dots, p$. If we prove $Pr_{A \\sim D}[\\|Ax\\|_2^2 -\
    \ 1| > \\epsilon] < \\delta$ then\n\n> $$Pr_{A \\sim D}[\\|(\\mathbb{P}_p \\otimes\
    \ A)x\\|_2^2 - 1| > \\epsilon] < \\delta.$\n\nInstead of applying the J-L lemma\
    \ to the whole vector $x$, we can write it as $x = x_1 \\oplus x_2 \\oplus \\\
    dots \\oplus x_p$ and apply it to each of the $p$ parts, and the embedding still.\
    \ This result says that there is no difference between applying the J-L lemma\
    \ locally or globally. We can then repeat the procedure on the resulting vector\
    \ $y \\in \\mathbb{R}^{k \times p}$. However, the number of different vectors\
    \ obtained after the projection will still be $n$, and consequently we will need\
    \ again the same number of projections, so no gain.\n\nConsider now a different\
    \ situation in which the number of images depends on the vector size. In this\
    \ case we will have an effective gain in repeating the J-L projections."
