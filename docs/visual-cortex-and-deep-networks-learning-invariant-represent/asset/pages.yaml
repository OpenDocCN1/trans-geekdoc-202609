    \ In the following we show that while factorization of invariance is possible\
    \ in a hierarchical architecture (theorem A.17), in the factorization in successive\
    \ layers for instances of invariance to translation followed by rotation (by subgroups)\
    \ is actually possible. The mathematical reason is that subgroup averages destroy\
    \ the covariance structure, factoring out the transformation.\n\nWe begin considering\
    \ invariance with respect to 2-D translations. We show how invariance can be achieved\
    \ by first computing an invariant signature with respect to the x-translation\
    \ and the y-translation, and discuss how a similar strategy can be used with more\
    \ general groups (and subgroups). We then show that this factorization cannot\
    \ be used to learn separately $x$ and $y$ invariance through independent templates.\n\
    \nConsider an architecture composed of two layers. Each layer has an associated\
