    # Class-Specific Property


    $\mu_b^h(d)$ is approximately invariant around a view if


    +   - the dictionary of the templates relative to the transformations is incoherent,

    - $l$ is one of the templates and transforms the same way as the templates;

    - the transformation is smooth.


    The main implication is that approximate invariance can be obtained for nongroup
    transformation by using templates to the class of objects. This means that class-specific
    modules are needed, for each class; each module requires highly specific templates,
    that is, tuning of the cells. An example is face-tuned cells in the face patches.
    Unlike exact invariance for transformations, tuning of the simple cells is nonspecific
    in the sense that does not depend on the type of image, nongroup transformations
    require highly tuned neurons and yield at best approximate invariance.


    # Summary of the Results


    The core of i-theory applies without qualification to compact groups such as rotations
    of the image in the image plane. Translation and scaling are, however, only compact.
