    One of the main problems with the one-layer architecture is that it provides an
    invariant signature to an isolated object but not to its parts. This problem of
    recognizing wholes and parts is closely related to the problem of recognizing
    objects in clutter, recognizing an object independently of the presence of another
    nearby. The key theorem about invariance assumes that image and templates portray
    isolated objects. Otherwise the signature may change because of different at different
    times. Recognizing an eye in a face is the problem that the rest of the face is
