- pgno: 11
  md: '# Preface


    The ventral visual stream is believed to underlie object recognition abilities
    in primates. Fifty years of modeling efforts, which started with the original
    Hubel-Wiesel proposal of a hierarchical architecture iterating in different layers
    the motif of simple and complex cells in V1, led to a series of quantitative models
    [2, 3] that are increasingly faithful to the biological architecture and are able
    to mimic properties of cells in different visual areas while achieving humanlike
    recognition performance under restricted conditions. Deep convolutional learning
    networks, which are hierarchical and similar to the HMAX model but otherwise not
    respect the ventral stream architecture and physiology, have been trained with
    very large labeled data sets [4]. The population of resulting model neurons mimics
    the object recognition performance of the macaque visual cortex (DiCarlo). However,
    the nature of the computations carried out in the ventral stream is not explained
    by such models, which can be simulated on a computer but remain rather opaque.


    In this book we develop a mathematical framework describing learning of invariant
    representations in the ventral stream. Our theory, called i-theory, applies to
    a broad class of hierarchical networks that pool transformations. In particular,
    it applies to deep convolutional learning networks where the transformations are
    just translations in R². The networks associated with the theory do not have nonlinearities
    other than pooling. In particular, i-theory applies to networks with pooling nonlinearities
    (to compute a histogram or associated statistics) as sigmoid threshold units or
    rectifiers (see figure 1 and chapter 1).


    The following chapters outline a proposal and a theory for the feedforward computation
    of invariant representations in the ventral stream, that is, the theory of the
    first 100 msec of visual perception, from the onset of an image to activation
    of inferior temporal (IT) cortex neurons about 100 msec later. In particular,
    such representations are likely to underlie rapid categorization, that is, immediate
    object recognition from flashed images [5, 6]. We emphasize that'
  merge: -1
  img_proc: true
