    **Figure 1**

    A hierarchy of Hubel-Wiesel modules. In each module (inset) the black dots represent
    simple cells calculating dot products of images with transformed templates (implementing
    a convolution) and filtering with, for example, a sigmoid function with different
    thresholds. The outputs of the simple cells are summed by a complex cell (pooling).
    This set of operations is indicated by the symbol \/.


    the theory is not a full theory of vision that will also have to explain the downd
    effect and the role of backprojections, but only part of it. The theory is based
    on the hypothesis that the most computational goal of the ventral stream is to
    compute neural representations of images that are invariant to transformations
    commonly encountered in the visual environment and learned from unsupervised experience.
    i-theory proposes computational explanations for various aspects of the ventral
    stream architecture and of its neurons. It makes severalable predictions. It also
    leads to network implementations that show high performance in object recognition
    benchmarks [7]. As mentioned, the theory is based on the unsupervised, automatic
    learning of invariant representations. Since invariant representations turn out
    to be good representations for supervised learning, characterized by small complexity,
    the architecture of the ventral stream may be dictated by the need to learn, at
    least during the initial phase of development, from very few labeled examples.
    We use i-theory to summarize several key aspects of the neuroscience of visual
    recognition, explain them, and predict others. The book is organized into four
    chapters, a discussion, and an appendix.


    Chapter 1 describes the general theoretical framework of a computational theory
    of invariance. In particular, we describe relevant mathematical results on invariant
    representations in vision; the appendix provides details and proofs (see also
    [1, 8, 10]). The starting point is a theorem proving that image'
