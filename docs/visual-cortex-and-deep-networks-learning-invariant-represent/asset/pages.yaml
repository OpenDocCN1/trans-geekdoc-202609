    This reasoning can be repeated if we consider projections of the orbits onto random
    vectors and the associated probability distributions. By the J-L lemma we can
    distinguish $2|G|$ vectors (number of elements of the two orbits) with $K \propto
    \ln(2|G|)$ projections. If we want to hide uniformly over $\mathcal{X}_n$, we
    have to consider all possible orbit couples, and therefore the number of required
    projections will be $K \propto \ln(n(n-1))$. We prove that for the $n(n-1)$ associated
