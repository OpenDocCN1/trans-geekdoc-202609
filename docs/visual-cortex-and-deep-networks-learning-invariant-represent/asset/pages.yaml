  md: '# Class-Specific Approximate Invariance in Inferior Temporal Cortex


    The justification—actually a prediction—by i-theory for domain-specific regions
    in cortex is different from other proposals. However, it is complementary with
    respect to some of them, rather than exclusive. For instance, it would make sense
    that the clustering depends not only on the index of compatibility but also on
    the relative frequency of each object class. The conjecture claims that transformation
    compatibility is the critical factor driving the development of domain-specific
    regions and that there are separate modules for object classes that transform
    differently from one another.


    # 4.4 Tuning in the Inferior Temporal Cortex


    Considering the limit case of object classes that consist of single objects is
    important in order to understand the functional architecture of most of IT. If
    a specific object is observed under a set of transformations, several images of
    it can be memorized and linked together by continuity at the time of the transformation.
    the usual HW pooling over them will allow view-independent recognition of the
    specific object. Since this is equivalent to the Poggio-Edelman model for view
    invariance [98], there is physiological support for this proposal ([97, 103, 104]).


    # 4.5 Mirror-Symmetric Tuning in the Face Patches and Pooling over Principal Components


    The theory can explainget framework the Freiwald-Tsao data [105, 106] on the face
    patch system. The most posterior patches, medial lateral and lateral (ML/MF),
    provide view and identity-specific input to the anterior lateral patch (AL), where
    most neurons show tuning that is an even function of the rotation around the vertical
    axis. The anterior medial patch (AM), which receives inputs from AL, is identity
    specific and view invariant. The puzzling aspect of these data is the mirror-symmetric
    tuning in AL. Why does this appear in the course of a computation that leads to
    view invariance?


    The theoretical framework implies that neurons in patch AL [105, 107], when exposed
    to different faces, each generating several images corresponding to different
    rotations in depth, may become tuned to the eigenvectors corresponding to the
    set of views. Since faces are bilaterally symmetric and since for each view there
    is a mirror-symmetric view, the associated covariance has eigenvectors (PCs) that
    are either even or odd functions (see figure 4.2 and appendix section A.5).'
  merge: -1
