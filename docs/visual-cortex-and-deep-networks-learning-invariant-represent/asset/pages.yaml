- pgno: 121
  md: '# Appendix


    # A.11.2 Example of Nonlinear Extension of Johnson-Lindenstrauss Lemma


    Suppose we have an architecture composed of two-layers; the first layer is composed
    of P parts


    In order to use the J-L result we have to know the number of possible images for
    a certain size s. We can say that they correspond to the number of all possible
    combinations of the pixels at different (finite) gray levels. Here, however, we
    adopt a different criterion. Suppose we have N images of size s (N can be as large
    as we want and in the limit goes to infinity). We adopt the following. The number
    of possible images of size s is the number of images we distinguish (up to an
    ε factor) and is given by the number of possible images we can build using PCs
    (extracted from the N images of size s, N → ∞) such that they allow a reconstruction
    up to an error; we call this number f(s). If we further suppose that the PCs are
    linearly combined with coefficients that can take a finite (but arbitrarily large)
    number of values, say V, we have that the number of possible images with size
    s is given by


    $Vf(s).$


    Let us now go back to the one-layer versus the two-layer comparison. If we assume
    that according to the J-L lemma the number of templates is given (up to a constant)
    by the log of the number of possible images, we have that the number of templates
    for the one-layer architecture is


    $Ln(Vf(Pd))$


    and for the two-layers architecture


    $Ln(Vf(d)) + Ln(Vf(P)).$


    Suppose we reuse the template projections for the different parts. Given that
    the log and the power are monotonically increasing functions, we are left with
    the comparison


    $f(d) + f(P) \le f(dP).$


    From a look at the plot of the number of PCs versus eigenvalues values at different
    sizes ([9], figure 3), we have


    $$\lambda(i, s) \approx e^{-\frac{i}{s}},$'
