    Summing the contributions at each layer, we have for the hierarchical construction


    $c(L) \propto \sum_{\ell=1}^{L} \sum_{i_\ell=1}^{M_\ell}} |G_\ell/G_{\ell-1}|k_\ell.
    \\quad (A.64)


    For the corresponding single-layer construction we have instead


    $c_\ell = \sum_{i_\ell=1}^{M_\ell}} |G_\ell\tilde{k}_\ell|, \\ell = 1, \dots,
    L.$


    where, as demonstrated in the previous section, $k_\ell = k_\ell$. Note that in
    this case to implement $G_\ell$ invariance at layer $\ell$ we have to use a bigger
    set of transformations, $G_\ell$ (versus $G_\ell/G_{\ell-1}$ of the hierarchy),
    since no invariance is inherited from the layers below.


    $c(1) = \sum_{\ell=1}^{L} \sum_{i_\ell=1}^{M_\ell}} |G_\ell|k_\ell. \\quad (A.65)


    which gives a ratio


    $r = \frac{c(L)}{c(1)} = \frac{\sum_{\ell=1}^{L} \sum_{i_\ell=1}^{M_\ell}} |G_\ell/G_{\ell-1}|k_\ell}{\sum_{\ell=1}^{L}
    \sum_{i_\ell=1}^{M_\ell}} |G_\ell|k_\ell}} \\quad (A.66)


    The theorem proves that far fewer stored transformations of templates are needed
    to achieve invariance for a group transformation $G$ with hierarchical architecture
    with shallow architecture.'
