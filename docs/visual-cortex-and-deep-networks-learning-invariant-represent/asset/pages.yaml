  md: '# A.4 Complex Cells: Wiring and Invariance


    We prove the equivalence of signatures obtained by pooling the projections of
    template orbits or their principal component. Let $L^2(\mathcal{G}) = \{F: \mathcal{G}
    \to \mathbb{R} \mid |F(g)|^2 dg < \infty\}$,


    ```

    $T_t : X \to L^2(\mathcal{G}), \quad (T_f)(g) = \langle f, T_g g \rangle$

    ```


    where $t \in \mathcal{X}$. It is easy to see that $T_t$ is a linear bounded and
    compact operator if $\|T_t T_t^*\| < \infty$. (In fact, it is easy to see that
    $T$ is Hilbert-Schmidt, $Tr(T_t^* T_t) = \int dg$) Denote by $(\sigma; u_i, v_i)$,
    the singular system of $T_t$, where $(u_i)$ and $(v_i)$, are orthonormal bases
    for $\mathcal{X}$ and $L^2(\mathcal{G})$, respectively.


    For $\sigma : \mathbb{R} \to \mathbb{R}$ measurable, define (complex response)


    ```

    $c : \sigma \to \mathbb{R}, \quad c(I) = \sum_i \sigma(\langle I, u_i \rangle)$.

    ```


    If $\sigma(a) = |a|^2, a \in \mathbb{R}$, and $T_t/b_t$ is an isometry, where
    $b_t$ is constant possibly depending on $t$ (see [131]), then $c$ is invariant.
    Then,


    ```

    $c(I) = \|I\|^2 = \frac{1}{b_t^2} \|T_t I\|_{L^2(\mathcal{G})}^2 = \frac{1}{b_t^2}
    \int |I, T_g t|^2 dg$

    ```


    for all $I \in \mathcal{X}$, and $\|T_t I\|_{L^2(\mathcal{G})}^2$ for all $g''
    \in \mathcal{G}$, then under the admissibility condition


    ```

    $$\int |\langle T_g t, t \rangle|^2 < \infty$,

    ```


    it is possible to take $b_t = \sqrt{C_t}$, with $C_t = 2\pi \int_{\omega} |\hat{t}|^2
    d\omega$, where $\hat{t}$ denotes the Fourier transform of $t$.


    # A.5 Mirror-Symmetric Templates Lead to Odd-Even Covariance Eigenfunctions


    As explained in section 4.5, in the brain face patch system, specifically in the
    anterior patch AL, neurons are found to be tuned to receive receptive fields.
    A possible explanation in terms of extracted PCs of a rotated-in-depth features
    is as follows. Let $R : \mathbb{R}^K \to \mathbb{R}^K$ denote the reflection operator.
    The eigenfunctions of $R$ are odd and even functions with eigenvalue $-1,1$, respectively.
    We want to prove that the covariance matrix associated with the set of templates
    and their mirror symmetry has odd or even eigenfunctions.'
