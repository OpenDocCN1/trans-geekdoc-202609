    # A.3.2.1 Invariance in Hierarchical Architectures


    We find the conditions under which the functions $\mu_\ell$ are locally invariant,
    that is, invariant within the restricted space of the pooling. We further prove
    that the range of invariance increases from layer to layer in the hierarchical
    architecture. The fact that for an image, in general, no global invariance is
    guaranteed allows a new definition of parts of an image.


    The local invariance conditions are a simple reformulation of Theorem A.8 in the
    context of a hierarchical architecture. In the following, for simplicity, we suppose
    that at each layer we have a template $t$ and a nonlinear function $\eta$.


    **Proposition A.16 (Invariance and Localization: Hierarchy)** $t \in H$, $H$ a
    Hilbert space, $\eta: \mathbb{R} \to \mathbb{R}^+$ a bijective (positive) function,
    and $G$ a locally compact group. Let $G_\ell \subseteq G$, and suppose $\langle
    g\mu_{\ell-1}(I), t\rangle \subseteq G_\ell$. Then for any $g \in G$,


    ```

    $$\mu_\ell(I) = \mu_\ell(gI) \quad \langle g\mu_{\ell-1}(I), t\rangle = 0, g \in
    G/(G_\ell \cap \tilde{G}_\ell),\ \langle g\mu_{\ell-1}(I), t\rangle \neq 0, g
    \in G_\ell \cap \tilde{G}_\ell.\ \quad (A.32)$

    ```


    **Proof:** The proof follows the reasoning in Theorem A.8 with $I$ substituted
    by $\mu_{\ell-1}(I)$ using the covariance property $\mu_{\ell}(gI) = \mu_{\ell-1}(I)$.
    Note how, similarly to eq. (A.16), eq.(A.32) gives a localization condition.


    We can now give a formal definition of *object part* as the subset of the image
    $I$ whose complex response, at layer $\ell$, is invariant under transformations
    in the range of the pooling. This definition is consistent, since the invariance
    is increasing from layer to layer, allowing bigger and bigger parts. Consequently,
    for each transformation there exists a layer $\ell$ such that any signal subset
    will be a part at that layer.'
