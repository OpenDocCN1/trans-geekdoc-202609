    # A.2.3 Finite Random Projections Almost Discriminate among Different Probability
    Distributions


    Given the discussion in Chapter 1, a *signature* may be associated to $I$ by constructing
    a histogram approximation of $P_I$, but this would require high-dimensional histograms.
    The classic theorem gives a way around this problem.


    For a template $t \in \mathbb{S}(R^d)$, where $\mathbb{S}(R^d)$ is unit sphere
    in $R^d$, let $I \mapsto (I,t)$ be the associated projection. Moreover, $P_{(I,t)}$
    is the distribution associated to the random projection $g \mapsto (gI,t)$ (or
    equivalently, $g \mapsto (I,g^{-1})$, if $g$ is unitary). Let $\mathcal{E} = [t
    \in \mathbb{S}(R^d), s.t. $P_{(I,t)} = Q_{(t)}]$.


    **Theorem A.4** (Cramér-Wold [123]) For any pair $P, Q$ of probability distributions
    on $R^d$, we have $P=Q$ if and only if $\mathcal{E}=\mathbb{S}(R^d)$.


    In words, two probability distributions are equal if only if their projections
    on any of the unit sphere directions are equal. This result can be equivalently
    stated as saying that the probability of choosing $t$ such that $P_{(I,t)} = Q_{(t)}$
    is equal to 1 if and only if $P=Q$, and the probability of choosing $t$ such that
    $P_{(I,t)}=Q_{(t)}$ is equal to 0 if and only if $P \neq Q$ (see [123, theorem
    3.4]). The theorem suggests a way to define a metric on distributions (orbits)
    in terms of


    $d(P,P'') = \int d_0(P_{(I,t)}}, P''_{(I,t)}) \d\lambda(t), \forall I,I'' \in
    \mathcal{X}$,


    where $d_0$ is any metric on one-dimensional probability distributions, and $d\lambda(t)$
    is a distribution measure on the projections. Indeed, it is easy to check that
    $d$ is a metric. In particular, in view of the Cramér-Wold theorem, $d(P,Q)=0$
    if and only if $P=Q$. As mentioned, each-dimensional distribution $P_{(I,t)}$
    can be approximated by a suitable histogram $\mu^t(I) = (\mu''_h(I))_{h=1,\dots,H
    \in R^H$, so in the limit in which the histogram approximation is accurate


    $d(P,P'') \approx \int d_{\mu}(\mu^t(I), \mu''^{t(I)) \d\mu(t), \forall I,I''
    \in \mathcal{X}$. (A.7)


    where $d_{\mu}$ is a metric on histograms induced by $d_0$.'
