    # Invariance in 2-D and 3-D Vision


    We assume that images as templates are in 2-D. This is the case if possible sources
    of 3-D information such as stereopsis and motion are eliminated. Interestingly,
    it seems that stereopsis does not facilitate recognition; this suggests 3-D information,
    even when available, is not used by the human visual system (see [111]).


    # Relations to the Scattering Transform


    There are connections between the scattering transform and i-theory but also several
    differences. There is no obvious correspondence between operations in the scattering
    transform and simple and complex cells in the ventral stream in contrast to convolutional
    networks and i-theory networks. i-theory provides an algorithm in which invariances
    are learned from implicitly supervised experience of transformations of a random
    set of objects/images; in the scattering transform invariances are hardwired.
