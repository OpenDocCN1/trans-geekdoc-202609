    # 5 INDOOR TEMPERATURE FORECASTING


    In this paper, predictive models are used to learn the function TEMP_FORECAST
    to accurately forecast indoor temperature Ŷ for horizon h, given X and U. Metrics
    are used to quantitatively evaluate prediction accuracy.


    # 5.1 Predictive models


    Four different models were analyzed for indoor temperature forecasting. These
    include two modern recurrent neural networks: Long Short-Term Memory, Gated Recurrent
    Unit and two baseline models: Multivariate Linear Regression, Seasonal Auto-Regressive
    Integrated Moving Average with eXogenous variables (SARIMAX). As shown in Figure
    2, all models apart from linear regression use concatenated matrices X and U as
    inputs, where U is repeated for each time step in matrix X. Because linear regression
    models cannot handle sequential data, inputs for them are formed by flattening
    matrix X and then concatenating with U.


    Long Short-Term Memory recurrent neural networks. These are the most commonly
    utilized recurrent neural networks for sequential data. Long Short-Term Memory
    (LSTM) was introduced to solve the


    original recurrent neural network''s (RNN) inability to capture long-term non-linear
    dependencies in sequential data [3]. The LSTM architecture utilizes an improved
    hidden unit, called memory cell, which calculates hidden state hs_t and long term
    memory lm_t from previously seen sequential data. The memory cell has parameters
    which define how the cell attains, updates and discards information from hs_t
    and lm_t, which get learned during training. As seen in Figure 2, during inference,
    hs_i and lm_i are recursively calculated using input vector x_i from concatenated
    matrices X and U at time step i ∈ [1, m] and previously calculated hidden state
    hs_{i-1} and long term memory lm_{i-1} [13]. As seen in Figure 2, an LSTM neural
    network uses multiple memory cells (denoted by c). The output of the network is
    calculated by using a fully connected layer, calculating a weighted sum of the
    final values of hs from all of the cells for each value in output vector Ŷ.


    Gated Recurrent Unit recurrent neural networks. These networks were introduced
    as a potential improvement to the LSTM neural network [8, 9]. Like the LSTM, GRU
    uses a memory cell to calculate a hidden state from previously seen sequential
    data. The key difference is that GRU does not use two separate hidden states hs_t
    and lm_t, instead using only one: hs_t. This change results in a simplified structure
    of the memory cell and a slight decrease in required computation. As shown in
    Figure 2, the GRU neural network also uses multiple memory cells and the output
    Ŷ is calculated using a fully connected layer. Previous studies suggest that GRU
    performance is similar to LSTM and which network is superior depends on the specific
    dataset used [9].


    Multivariate Linear Regression. Linear regression (LR) is a predictive modelling
    method which assumes a linear relationship between input and output. Linear regression
    models are often used as performance baselines for many prediction tasks due to
    their relatively low complexity and reasonable accuracy in some cases [16, 19].
    In this paper, multivariate linear regression models are used, since traditional
    LR can only use a single input variable for prediction. Because LR can only predict
    a single value at a time, a separate regressor is trained for each individual
    forecasted value T_ind(t + i), i ∈ [1, h] in the predicted horizon. Output of
    the model'
