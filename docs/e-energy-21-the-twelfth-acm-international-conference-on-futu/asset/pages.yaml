    In this paper heat pump flexibility is denoted as F. Flexibility F ∈ ℤ, F > 0
    is a positive integer scalar, representing how many timesteps the user predefined
    lower temperature bound T_ind_lower and upper temperature bound T_ind_upper will
    not be violated if the heat pump is operating according to the control signal
    U. Predicted flexibility is defined as F̂, whereas existing potential flexibility
    is denoted as F.


    # 3 PROBLEM DEFINITION


    This section formally describes the preliminaries and provides a problem definition
    for the paper.


    X = [X(t − m + 1) … X(t − 1) X(t)] (1)

    X is a regular time series holding historical data of past observed parameter
    values with record count m (known as memory) defining how many past records will
    be used for prediction. X is composed of vectors X(t):

    X(t) = [T_ind(t) T_out(t) P_hp(t) DT(t)] (2)

    where T_ind(t) is the indoor temperature in a selected environment at time t,
    T_out(t) is the outdoor (external) temperature at time t, P_hp(t) is the average
    power consumption by the heat pump in the time interval (t − s; t], and DT(t)
    is the date and time at which T_ind(t), T_out(t), and P_hp(t) were gathered.


    Problem definition. Let FLEX_PREDICT be a function taking predicted indoor temperature
    Ŷ, lower temperature bound T_ind_lower and upper temperature bound T_ind_upper,
    returning predicted flexibility F̂, such that:

    FLEX_PREDICT : (Ŷ, T_ind_lower, T_ind_upper) ↦ F̂ (5)

    Let TEMP_FORECAST be a function taking historical readings X, control signal U,
    returning forecasted temperature Ŷ, such that:

    TEMP_FORECAST : (X, U) ↦ Ŷ (6)


