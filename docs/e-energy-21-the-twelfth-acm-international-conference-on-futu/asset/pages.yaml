    does not change by more than a few degrees over the entire year. As seen in Table
    2 SARIMAX outperforms the best performing LR model by over 45% lower RMSE on the
    NIST Net-Zero dataset. However, these baseline models have significantly higher
    predictive error on NYSERDA S44 than their LSTM and GRU counterparts. Multivariate
    LR models have, on average, over 30% higher error and SARIMAX has over 7 times
    higher error than GRU or LSTM models. These significant performance differences
    suggest that SARIMAX and multivariate linear regression models, although generally
    effective, are not capable of effectively adapting to rapid indoor temperature
    fluctuations and capturing other complex patterns present in the NYSERDA S44 dataset.


    Seasonal performance analysis. After quantitative evaluation of trained indoor
    temperature predictive models, model performance was also analysed across different
    seasons. This indicates whether trained models are effective at capturing different
    patterns present throughout the entire calendar year. As all of the heat pump
    deployments are situated in the northern hemisphere, we use 4 meteorological seasons
    of winter, spring, summer and autumn, spanning December to February, March to
    May, June to August, and September to November, respectively.


    Seasonal analysis showed that LSTM and GRU predictive models have high accuracy
    during the entire year, with their predictive error changing by less than 10%
    between different seasons. However, baseline multivariate linear regression and
    SARIMAX model performance vary significantly between seasons. This trend is the
    most pronounced in the experiments conducted on the NYSERDA S44 dataset. As seen
    in Figure 4, best performing LSTM and GRU models have similar predictive errors
    across seasons on the NYSERDA S44 dataset. However, multivariate LR and SARIMAX
    model performance fluctuate, with linear regression having 30% higher error in
    summer season and around 15% higher error in winter season and SARIMAX having
    more than 9 times worse error during the winter season than the best performing
    models. Poor performance during the colder seasons is highly undesirable, as heat
    pumps operate and use more power when the outside temperatures are lower,


    increasing the amount of potential flexibility [15]. Intuitively, the difference
    of performance between seasons can be attributed to the fact that both multivariate
    linear regression and SARIMAX models have a very limited amount of trainable parameters
    and thus are unable to capture all of the emerging patterns between seasons.


    Model configuration comparison. Although it has been established that LSTM and
    GRU models possess high performance in terms of numerical error, some model configurations
    produced comparatively poor results. LSTM and GRU models trained using cell count
    c = 80 had significantly worse results on average than best performing models
    trained with c = 16 or c = 32. On the NIST Net-Zero dataset models with cell count
    configuration c = 80 recorded average RMSE +0.5 higher, compared to the best performing
    model LSTM (c=32, m=96) and, on average, +0.6 higher on the NYSERDA S44 and the
    NYSERDA S40 datasets. Inspection of validation loss during training indicated
    that some of these models failed to converge during training, even across multiple
    runs, despite having potentially higher capacity of capturing complex trends due
    to the increase in cell count. These results along with quantitative results presented
    in Table 2 indicate cell count hyperparameter selection is crucial for training
    accurate LSTM and GRU models.


    Model training time. In order to evaluate model training time fairly, all models
    were trained using the same Google Colab instance with an NVIDIA Tesla P100 GPU.
    This includes dataset loading, model checkpointing, logging, generating, and saving
    predictions on the test set. All indoor temperature predictive models were trained
    in less than 10 minutes on the given Colab instance. Prediction generation using
    an already trained model takes ≤ 10ms using the Google Colab instance and Apple
    MacBook Pro with an Intel i5 2.0 GHz CPU.


