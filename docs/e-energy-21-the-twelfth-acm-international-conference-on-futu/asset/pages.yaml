    paper. HeatFlex utilizes data-driven predictive models to learn TEMP_FORECAST,
    an indoor temperature forecasting function used to accurately forecast indoor
    temperature Ŷ given historical data X and control signal U for prediction horizon
    h. As seen in Figure 1, HeatFlex has two phases: indoor temperature forecasting
