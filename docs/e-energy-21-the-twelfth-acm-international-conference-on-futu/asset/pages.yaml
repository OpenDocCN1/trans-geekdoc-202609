    # 2 RELATED WORK


    In previous work, several methods have been proposed for flexibility prediction.
    A regression and temporal sequence matching based method has been proposed for
    predicting device activation time and energy demand of electric vehicles and wet-devices
    (washing and cleaning devices that use water, like dishwashers or washer dryers)
    [20, 21]. A physical model based energy demand prediction algorithm has been proposed
    for shifting demand of electrical vehicles and heat pumps to minimize the cost
    of consumed electricity [23]. Another study proposes a physical modelling approach
    for estimating the energy profile of a building with an installed heat pump expressed
    as a first order linear time invariant system [21]. In comparison, this paper
    proposes HeatFlex, a model-free, fully data-driven method for predicting flexibility
    from individual smart heat pumps.


    Traditionally, physical modelling through parametrized differential equations
    was used to model building’s thermal response to change in heating operation of
    HVAC systems, including heat pumps [23]. However, this approach requires prior
    knowledge about the heating installations, building layout, precise device specifications
    and a significant number of monitored variables through installed sensors, which
    are not typically available in real world deployments. Furthermore, the physical
    modelling approach requires defined equations describing the exact environment
    configuration for each individual deployment and is also heavily reliant on constantly
    available high frequency, accurate sensor readings [15, 24]. Alternative data-driven
    methods, such as regression methods or time-series forecasting models do not have
    such strict prerequisites and have been applied to solve load forecasting problems
    [10]. However, regression methods do not capture temporal dependencies and most
    cannot model non-linear relationships, whereas time series forecasting models
    tend to underperform on highly non-linear, non-stationary data [18, 30]. HeatFlex
    utilizes modern data-driven modeling methods that can capture both sequential
    and complex, non-linear relationships.


    Over the past few years, machine learning based approaches have been successfully
    adopted and achieved state-of-the-art performance for various prediction problems
    in the energy domain [2, 12, 14]. Modern machine learning methods like deep neural
    networks are capable of modelling complex, non-linear relationships between variables,
    having much greater applicability and, usually, higher performance than traditional
    regression or time series forecasting algorithms [24]. Recently, these methods
    have been applied for load and thermal response prediction in buildings equipped
    with HVAC systems. Traditional neural networks have been used for single step
    ahead humidity and indoor temperature forecasting in households [31], indoor temperature
    forecasting for several areas of a school building [1]. More advanced recurrent'
