    validation sets were used during predictive model training process, to learn model
    weights. The test set was only used to assess model performance on previously
    unseen data and was not used during model training. All datasets are time series
    and possess sequential dependencies, trends and seasonality. As such, traditionally
    used splitting techniques such as k-fold splitting are not applicable.


    To account for this, a sequential data split strategy was utilized. The original
    dataset was divided into parts of one day each and then sequentially divided into
    three bins for each of the training, validation and test sets. Following best
    machine learning practices, every 20 days in the dataset, a sequence of 16 days
    was added to the training set, following a sequence of 2 days which was added
    to the validation set, after which a sequence of 2 days was added to the test
    set (as seen in Figure 3). This was repeated until the entire dataset was split.
    This splitting technique ensures that each set is representative of intra-day
    temperature change and power consumption patterns and how they change between
    different months and seasons.




    Grid search was used to find appropriate machine learning model hyperparameter
    configurations. For LSTM and GRU models, different cell counts c ∈ (16, 32, 48,
    80) were used. As previous studies have shown that memory parameter m selection
    can have a significant impact on the performance of the model, several configurations
    of m ∈ (16, 32, 48, 96) were tested with all trained models [37]. During experiments,
    models were trained with horizon h = 4, meaning that the models predicted indoor
    temperature for the next hour in 4 time steps. Training of all models, apart from
    SARIMAX, was conducted using the Adam optimizer with learning rate parameter α
    = 0.005, using RMSE as the loss function. Models were trained with a batch size
    of 64 for a maximum of 125 epochs with early stopping enabled to prevent overfitting.
    During training and validation losses were logged into persistent storage. Model
    checkpoints were made every 5 epochs. Checkpoint of the lowest validation loss
    was kept in storage. To account for potential outlier results due to the random
    initial parameter initialization in LSTM, GRU and LR models, each model configuration
    was trained 3 times and the model with the second-lowest error was used in results




    During the experiments, the indoor temperature forecasting models were trained
    using the training set and validation set. The indoor temperature forecasting
    and flexibility prediction error was then evaluated using the test set. Each model
    was trained and evaluated using data from only one dataset.




