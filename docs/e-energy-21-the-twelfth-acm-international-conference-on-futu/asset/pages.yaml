  md: 'in a given mode for less time than it possibly could) and overestimation when
    \hat{F} > F (predict that the heat pump can operate in a given mode for more time
    than it possibly could). To capture what type of error is prevalent, we introduce
    two specialized variants of MAFE. Mean Absolute Overestimated Flexibility Error
    (MAOFE) is a variant of MAFE, which only calculates overestimated flexibility
    error (\hat{F} > F).


    MAOFE(Z, \hat{Z}) = \frac{1}{n} \sum_{i=1}^{n} |min(Z_i - \hat{Z}_i, 0)|  (11)


    Mean Absolute Underestimated Flexibility Error (MAUFE) only calculates underestimated
    flexibility error (\hat{F} < F).


    MAUFE(Z, \hat{Z}) = \frac{1}{n} \sum_{i=1}^{n} |max(Z_i - \hat{Z}_i, 0)|  (12)


    Notably, overestimation and underestimation are the only two types of possible
    errors and are mutually exclusive, meaning that:


    MAUFE + MAOFE = MAFE  (13)


    Extracted Potential Flexibility Ratio is a metric that shows how much flexibility
    has been predicted in comparison to how much was available. Notably, this metric
    does not penalize overestimations, only underestimations.


    EPFR(Z, \hat{Z}) = \frac{\sum_{i=1}^{n} max(Z_i - \hat{Z}_i, 0)}{\sum_{i=1}^{n}
    Z_i}  (14)


    These 4 proposed metrics enable to quantitatively evaluate overall flexibility
    prediction performance, identify what type of error is more prevalent, and measure
    what percentage of total potential flexibility has been predicted.


    # 7 EXPERIMENTS


    In this paper, the experiments were performed using data from 3 heat pump deployments
    from 2 open datasets containing historical indoor, outdoor temperature and power
    consumption data.


    # 7.1 Datasets


    The first dataset (NIST Net-Zero) is collected from the Net-Zero Energy Residential
    Test Facility, a residential building test bed constructed to study and demonstrate
    various technologies for effectively meeting typical residential demands using
    renewable energy. The data were collected from an experiment simulating realistic
    consumption and usage patterns of a family of four. During the demonstration period,
    heating for the household was performed by an air-source (air-to-air) heat pump.
    The heat pump was configured to maintain two constant temperature set points of
    23.8°C during the cooling season and 21.1°C during the heating season. The indoor
    temperature fluctuated very little throughout the year, changing by less than
    2°C from the set point. The dataset collected from this experiment includes 1
    minute granularity indoor time series, outdoor temperature, and heat pump power
    consumption readings for one year. This dataset is open access and has been widely
    used in other studies [28, 36].


    The second and third datasets are made available by the New York State Energy
    Research and Development Authority (NYSERDA).


    They provide data from 50 geothermal heat pumps installed in residential buildings
    ranging from around 100 to nearly 600 square meters in footage in New York State
    in the United States. The two datasets were collected from deployments with identifiers
    S40 and S44. No set point temperature information was provided, however, in the
    NYSERDA S40 dataset, the heat pump maintained an indoor temperature of around
    21.1°C and in the NYSERDA S44 dataset – around 20°C. The indoor temperature in
    both sites fluctuated significantly, especially during the winter season, where
    the indoor temperature in both sites would change by more than 4°C from the approximated
    set points. Both datasets include 15 minute granularity time series indoor, outdoor
    and power consumption readings over approximately 12 months and are available
    for open access.


    # 7.2 Data preprocessing


    All datasets in the experiments (as defined in Section 7.1) were preprocessed
    in the following steps:


    Data collection. Data for experiments were collected by selecting indoor temperature
    T_ind, outdoor temperature T_out and power P_hp readings from the datasets. T_ind
    values for NIST Net-Zero dataset were calculated by calculating the mean of all
    provided indoor temperature readings in the original dataset. Data from two sites
    were included in the experiments from the NYSERDA dataset: S40 and S44. Furthermore,
    temperature readings in NYSERDA S40 and NYSERDA S44 were converted from Fahrenheit
    to Celsius.


    Poor quality data removal. Outlier values were removed by selecting data points
    where temperatures T_ind ∈ [10;30], T_out ∈ [−50;50]. Furthermore, records with
    changes of more than 15°C within a 15 minute period were also removed. Data marked
    as incorrect or inconsistent in the provided data specifications were also removed.


    Data resampling. In the experiments, 15 minute data granularity was selected to
    be used across all datasets, as it is usually used in electricity and flexibility
    markets [15]. For NIST Net-Zero dataset, data were downsampled by averaging power
    P_hp readings to 15 minute intervals, and taking the last outdoor temperature
    T_out and indoor temperature T_ind readings. No resampling was required for NYSERDA
    S40 or NYSERDA S44 datasets.


    Date and time feature extraction. As used predictive models require inputs and
    outputs to have a numeric type, the given date and time timestamp DT(t) ∈ X(t)
    was converted into respective year, month, day, hour, minute, day of the week
    integer values. This was done for each vector X(t) in given historical data X.


