    ### 季节性性能分析

    在对训练好的室内温度预测模型进行定量评估后，还对模型在不同季节的性能进行了分析。这表明训练好的模型是否有效捕捉到整个日历年度内存在的不同模式。由于所有热泵部署均位于北半球，我们使用
    4 个气象季节：冬季、春季、夏季和秋季，分别 spanning 十二月至二月、三月至五月、六月至八月，以及九月至十一月。


    季节性分析显示，LSTM 和 GRU 预测模型在全年均具有较高的准确性，其预测误差在不同季节之间变化小于 10%。然而，基线多变量线性回归和 SARIMAX
    模型的性能在季节之间差异显著。这种趋势在 NYSERDA S44 数据集上进行的实验中最为明显。如图 4 所示，在 NYSERDA S44 数据集上，表现最佳的
    LSTM 和 GRU 模型在各季节的预测误差相似。然而，多变量 LR 和 SARIMAX 模型的性能波动较大，线性回归在夏季的误差高出 30%，冬季高出约
    15%，而 SARIMAX 在冬季的误差比表现最佳的模型差超过 9 倍。较冷季节的性能较差是非常不理想的，因为热泵在室外温度较低时会运行并使用更多电力，增加潜在的灵活性
    [15]。直观上，季节之间性能差异的原因可归因于多变量线性回归和 SARIMAX 模型具有非常有限的可训练参数量，因此无法捕捉季节之间出现的所有模式。


