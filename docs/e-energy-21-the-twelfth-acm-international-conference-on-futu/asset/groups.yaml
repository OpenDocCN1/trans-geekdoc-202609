    然而，目前尚无已知可扩展的数据驱动方法用于单个智能热泵灵活性预测，该方法可根据用户预定义的温度舒适边界估计热泵操作的可行性。之前的研究利用物理模型来预测热响应，然而，这些方法需要精确的热泵规格、建筑及其布局的详细信息，这些信息对每个部署都是唯一的
