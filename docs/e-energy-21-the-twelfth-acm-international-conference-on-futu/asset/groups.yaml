    and T_ind_upper.


    # 6.1 Prediction method


    In this paper, flexibility will be predicted in two scenarios Off and ForcedOn,
    as described in Section 4. To predict flexibility in either scenario, the control
    signal U has to be appropriately defined before forecasting temperature with TEMP_FORECAST.
    When predicting flexibility for Off, U should consist of values P_hp_min, where
    P_hp_min is the average power consumption of the heat pump being in idle. In most
    cases, P_hp_min > 0 and can be determined using the


    specification of the heat pump. In this case, Model(X, U) forecasts indoor temperature
    Ŷ_off if the heat pump will remain in mode Off for prediction horizon h time steps.
    When predicting flexibility for ForcedOn, U should consist of values P_hp_max,
    where P_hp_max is the average power consumption of the heat pump operating at
    its maximum capacity, usually below maximum rated power. In this case, Model(X,
    U) forecasts indoor temperature Ŷ_on if the heat pump will remain in mode ForcedOn
    for prediction horizon h time steps.


    ```

