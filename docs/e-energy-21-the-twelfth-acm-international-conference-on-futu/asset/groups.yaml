    However, there are no known scalable, data-driven methods for individual smart
    heat pump flexibility prediction that estimate what heat pump operation is possible
    given user predefined temperature comfort bounds. Previously conducted studies
    utilize physical models to forecast thermal response, however, these methods require
    exact heat pump specifications, detailed information about the building and its
    layout which are unique to each deployment [23]. Furthermore, these methods use
    a lot of monitored variables which are not always available due to lack of sensors
    [15, 24].


    This paper aims to address these limitations by proposing a novel data-driven
    flexibility prediction method HeatFlex for individual smart heat pumps and makes
    the following contributions: (1) Proposes HeatFlex, the first, to the authors’
    knowledge, fully data-driven flexibility prediction method for smart heat pumps
    based on modern machine learning methods. (2) Introduces novel flexibility metrics,
    enabling quantitative evaluation of predicted flexibility. (3) Experimental qualitative
    and quantitative evaluation of HeatFlex using real world heat pump data from three
    deployments. HeatFlex is fully data-driven and does not require a predefined physical
    model of the deployment environment or exact specifications of the heat pump and
    only uses 3 monitored variables for prediction: indoor temperature, heat pump
    power consumption and outdoor temperature, which are widely available from most
    modern energy management systems and open-access weather information providers.
    Our experimental evaluation shows that HeatFlex, utilizing modern recurrent neural
    networks, significantly outperforms multivariate linear regression and SARIMAX
    time series forecasting model baselines in terms of prediction error. Results
    show that HeatFlex is capable of accurately predicting over 90% of available flexibility
    throughout different seasons and heat pump deployments.


