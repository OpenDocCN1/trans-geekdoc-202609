    预测温度之前适当定义。在预测 Off 的灵活性时，U 应由值 P_hp_min 组成，其中 P_hp_min 是热泵处于空闲时的平均功耗。在大多数情况下，P_hp_min
    > 0，可以使用热泵的规格确定。在这种情况下，Model(X, U) 预测室内温度 Ŷ_off，如果热泵在预测范围 h 个时间步内保持 Off 模式。在预测
