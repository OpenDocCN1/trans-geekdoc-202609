    本文结构如下：第 2 节描述相关工作。第 3 节定义灵活性预测和室内温度预测问题。第 4 节提供了概述


    ## 2 相关工作


    在之前的工作中，已提出了几种灵活性预测方法。已提出基于回归和时间序列匹配的方法来预测电动汽车和湿设备（使用水的洗涤和清洁设备，如洗碗机或洗烘一体机）的设备激活时间和能源需求
    [20, 21]。已提出基于物理模型的能源需求预测算法，用于将电动汽车和热泵的需求转移以最小化消耗电力的成本 [23]。另一项研究提出了一种物理建模方法，用于估计安装有热泵的建筑的能量曲线，表示为一阶线性时不变系统
    [21]。相比之下，本文提出 HeatFlex，一种无模型、完全数据驱动的方法，用于预测单个智能热泵的灵活性。


    传统上，通过参数化微分方程的物理建模用于模拟建筑对 HVAC 系统加热操作变化的热响应，包括热泵 [23]。然而，这种方法需要关于加热装置、建筑布局、精确设备规格以及通过安装传感器监测的大量变量的先验知识，这些在实际部署中通常不可用。此外，物理建模方法需要定义描述每个单独部署的精确环境配置的方程，并且也严重依赖于不断可用、频率高、准确的传感器读数
    [15, 24]。替代的数据驱动方法，如回归方法或时间序列预测模型没有如此严格的前提条件，并已应用于解决负荷预测问题 [10]。然而，回归方法无法捕捉时间依赖性，且大多数无法建模非线性关系，而时间序列预测模型在高度非线性、非平稳数据上往往表现不佳
    [18, 30]。HeatFlex 利用能够捕捉序列和复杂非线性关系现代数据驱动建模方法。


    在过去几年中，基于机器学习的方法已被成功采用，并在能源领域的各种预测问题中取得了最先进的性能 [2, 12, 14]。像深度神经网络这样的现代机器学习方法能够建模变量之间复杂、非线性的关系，具有更大的适用性和通常比传统回归或时间序列预测算法更高的性能
    [24]。最近，这些方法已应用于配备 HVAC 系统的建筑的负荷和热响应预测。传统神经网络已用于家庭中单步超前湿度和室内温度预测 [31]、学校建筑多个区域的室内温度预测
    [1]。更先进的循环


    ![](img/a682317eba97b725284edc1c3cd47b8a_2_0.png)


    **图 1：HeatFlex 概述：数据驱动的智能热泵灵活性预测方法**


    神经网络，如长短期记忆（LSTM）网络，也已用于安装有空气处理装置的建筑的室内温度预测，优于传统神经网络模型 [17]。基于 LSTM 的模型也已用于联合供热和发电厂的供热负荷预测，与传统回归方法相比取得了显著的性能提升
    [18]。本文通过有效地应用现代神经网络用于智能热泵室内温度预测和灵活性预测改进了之前的研究。


    本文中热泵灵活性表示为 F。灵活性 F ∈ ℤ，F > 0 是一个正整数标量，表示如果热泵根据控制信号 U 运行，用户预定义的下限温度 T_ind_lower
    和上限温度 T_ind_upper 在多少个时间步内不会被违反。预测灵活性定义为 F̂，而现有潜在灵活性表示为 F。


    ## 3 问题定义


    本节正式描述了预备知识并为本文提供了问题定义。


    X = [X(t − m + 1) … X(t − 1) X(t)] (1)

    X 是一个常规时间序列，保存过去观测参数值的历史数据，记录数 m（称为记忆）定义了用于预测的过去记录数量。X 由向量 X(t) 组成：

    X(t) = [T_ind(t) T_out(t) P_hp(t) DT(t)] (2)

    其中 T_ind(t) 是在时间 t 时所选环境中的室内温度，T_out(t) 是在时间 t 时的室外（外部）温度，P_hp(t) 是热泵在时间间隔 (t
    − s; t] 内的平均功耗，DT(t) 是收集 T_ind(t)、T_out(t) 和 P_hp(t) 的日期和时间。


    问题定义。设 FLEX_PREDICT 为一个函数，接收预测室内温度 Ŷ、下限温度 T_ind_lower 和上限温度 T_ind_upper，返回预测灵活性
    F̂，使得：

    FLEX_PREDICT : (Ŷ, T_ind_lower, T_ind_upper) ↦ F̂ (5)

    设 TEMP_FORECAST 为一个函数，接收历史读数 X、控制信号 U，返回预测温度 Ŷ，使得：

    TEMP_FORECAST : (X, U) ↦ Ŷ (6)


    ## 4 HeatFlex 概述


    本节概述了本文提出的灵活性预测方法 HeatFlex。HeatFlex 利用数据驱动的预测模型来学习 TEMP_FORECAST，即室内温度预测函数，用于根据历史数据
    X 和控制信号 U 对预测范围 h 内的室内温度 Ŷ 进行准确预测。如图 1 所示，HeatFlex 有两个阶段：室内温度预测和灵活性预测。

