    提取的潜在灵活性比率是一个指标，显示预测的灵活性与可用灵活性相比有多少。值得注意的是，该指标不会惩罚高估，仅惩罚低估。


    EPFR(Z, \hat{Z}) = \frac{\sum_{i=1}^{n} max(Z_i - \hat{Z}_i, 0)}{\sum_{i=1}^{n}
    Z_i}  (14)


    这 4 个提出的指标能够定量评估整体灵活性预测性能，识别哪种类型的误差更常见，并衡量已预测的总潜在灵活性的百分比。


    ## 7 实验


    本文中的实验使用来自 2 个开放数据集的 3 个热泵部署的数据进行，这些数据集包含历史室内、室外温度和功率消耗数据。


    ### 7.1 数据集


    第一个数据集（NIST Net-Zero）收集自净零能源住宅测试设施，这是一个住宅建筑测试平台，旨在研究和展示使用可再生能源有效满足典型住宅需求的各种技术。数据来自模拟四口之家现实消费和使用模式的实验。在演示期间，家庭供暖由一台空气源（空气到空气）热泵完成。热泵被配置为在制冷季节保持
    23.8°C 的恒定温度设定点，在供暖季节保持 21.1°C。全年室内温度波动很小，与设定点相比变化小于 2°C。本次实验收集的数据集包括一年的 1 分钟粒度室内时间序列、室外温度和热泵功率消耗读数。该数据集为开放获取，并在其他研究中被广泛使用
    [28, 36]。


    第二和第三个数据集由纽约州能源研究与发展局（NYSERDA）提供。


    它们提供了美国纽约州住宅建筑中安装的 50 台地源热泵的数据，这些建筑面积从约 100 平方米到近 600 平方米不等。这两个数据集收集自标识符为 S40
    和 S44 的部署。未提供设定点温度信息，然而，在 NYSERDA S40 数据集中，热泵保持室内温度约为 21.1°C，在 NYSERDA S44 数据集中约为
    20°C。两个站点的室内温度波动显著，尤其是在冬季，两个站点的室内温度与近似设定点相比变化超过 4°C。两个数据集均包含约 12 个月的 15 分钟粒度时间序列室内、室外和功率消耗读数，并可开放获取。


    ### 7.2 数据预处理


    实验中的所有数据集（如 7.1 节所述）均按以下步骤进行预处理：


    **数据收集。** 实验数据通过从数据集中选择室内温度 T_ind、室外温度 T_out 和功率 P_hp 读数来收集。NIST Net-Zero 数据集的
    T_ind 值通过计算原始数据集中所有提供的室内温度读数的平均值来计算。从 NYSERDA 数据集中纳入实验的两个站点数据为：S40 和 S44。此外，NYSERDA
    S40 和 NYSERDA S44 中的温度读数已从华氏度转换为摄氏度。


    **剔除劣质数据。** 通过选择温度满足 T_ind ∈ [10;30]、T_out ∈ [−50;50] 的数据点来剔除异常值。此外，15 分钟内变化超过
    15°C 的记录也被剔除。在提供的数据规范中标记为不正确或不一致的数据也被剔除。


    **数据重采样。** 在实验中，选择 15 分钟数据粒度应用于所有数据集，因为它通常用于电力和灵活性市场 [15]。对于 NIST Net-Zero 数据集，数据通过将功率
    P_hp 读数平均到 15 分钟间隔进行降采样，并取最后的室外温度 T_out 和室内温度 T_ind 读数。NYSERDA S40 或 NYSERDA S44
    数据集无需重采样。


    **日期和时间特征提取。** 由于所使用的预测模型要求输入和输出具有数值类型，给定的日期和时间时间戳 DT(t) ∈ X(t) 被转换为相应的年、月、日、小时、分钟、星期几整数值。这对给定历史数据
    X 中的每个向量 X(t) 均执行。


    ![](img/a682317eba97b725284edc1c3cd47b8a_5_0.png)


    **图 3：** 以 20 天为间隔应用的顺序数据集分割策略的可视化表示


    **用于训练、验证和测试的数据分割。** 每个数据集被划分为训练、验证和测试子集（集合）。训练集和验证集在预测模型训练过程中使用，以学习模型权重。测试集仅用于评估模型在先前未见数据上的性能，且未在模型训练期间使用。所有数据集均为时间序列，具有顺序依赖性、趋势和季节性。因此，传统使用的分割技术如
    k 折分割不适用。


    为此，采用了顺序数据分割策略。原始数据集被划分为每天一份的部分，然后按顺序划分为训练集、验证集和测试集的三个箱。遵循最佳机器学习实践，在数据集的每 20 天中，先将
    2 天的序列添加到验证集，然后将 16 天的序列添加到训练集，之后将 2 天的序列添加到测试集（如图 3 所示）。此过程重复直至整个数据集被分割。这种分割技术确保每个集合都能代表日内温度变化和功率消耗模式，以及它们在不同月份和季节之间的变化。


    使用网格搜索找到合适的机器学习模型超参数配置。对于 LSTM 和 GRU 模型，使用了不同的单元数 c ∈ (16, 32, 48, 80)。由于先前的研究表明内存参数
    m 的选择会对模型性能产生显著影响，因此对所有训练模型测试了 m ∈ (16, 32, 48, 96) 的几种配置 [37]。在实验期间，模型以 h = 4
    的视界进行训练，意味着模型在 4 个时间步内预测下一小时的室内温度。除 SARIMAX 外，所有模型的训练均使用 Adam 优化器，学习率参数 α = 0.005，以
    RMSE 作为损失函数进行。模型以批量大小 64 训练，最多 125 个 epoch，并启用提前停止以防止过拟合。在训练和验证期间，损失被记录到持久存储中。每
    5 个 epoch 创建一次模型检查点。验证损失最低的检查点被保留在存储中。为考虑 LSTM、GRU 和 LR 模型中由于随机初始参数初始化可能导致的异常结果，每个模型配置训练
    3 次，结果中使用误差第二低的模型


    在实验期间，室内温度预测模型使用训练集和验证集进行训练。然后使用测试集评估室内温度预测和灵活性预测误差。每个模型仅使用来自一个数据集的数据进行训练和评估。


    **定量模型性能。** 训练好的室内温度预测模型性能使用测试集数据通过计算平均 RMSE、MAE 和 MAXE 指标值进行定量评估。实验结果表明，训练好的预测模型能够有效捕捉室内温度相对于热泵运行和室外温度的变化。定量模型性能评估显示，表现最好的预测模型使用
    LSTM 和 GRU 神经网络架构训练，其中 LSTM 整体性能最佳。如表 2 所示，表现最好的 LSTM 和 GRU 架构模型在三个部署的实验中均优于多元线性回归，RMSE
    比 GRU 低超过 9%，比多元 LR 模型低超过 32%。表现最好的 LSTM 模型也显著优于


