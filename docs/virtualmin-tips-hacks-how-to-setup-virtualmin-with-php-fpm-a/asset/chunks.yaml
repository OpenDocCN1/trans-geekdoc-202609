- raw: "![](images/00008.jpg) \n\nThen, click “Install Module ” button.   Once installed,\
    \ you can access the CSF firewall interface from:    Webmin > System > ConfigServer\
    \ Security and Firewall   \n\nThe first time you click on the link, you'll be\
    \ prompted to update a symlink, i.e.\n\n![](images/00011.jpg)Click on the link\
    \ provided and you will then see the CSF web-interface.\n\n![](images/00035.jpg)\n\
    \nThe first thing you should do is click on the “Check Server Security”  button.\n\
    \nThis will cause the CSF firewalll tu run a scan/security audit on your server\
    \ setup. It will give you a summary of what needs to be “fixed” or changed to\
    \ beef up the security of your VPS/server.\n\nThen, follow the recommendation\
    \ to further secure your server.\n\nNOTE: You'd probably see CSF complained that\
    \ both “portreserve” and “rpcbind” being enabled even t hough you have already\
    \ issued the command:\n\n`# chkconfig  rpcbind off  && chkconfig  portreserve\
    \ off`\n\nAnd the Webmin > Bootup & Shutdown menu showed that they are not running\
    \ either. The reason why CSF showed them as 'enabled' is because they are still\
    \ enabled on run levels 2, 4, 5.  To completely turn them off at ALL runlevels,\
    \  run this  command:\n\n` `\n\n\\# chkconfig --level 2345 portreserve off\n\n\
    \\# chkconfig --level 2345 rpcbind off  \n\nConsider shutting down the following\
    \ services as well:\n\n\\# service xinetd stop && chkconfig --level 2345 off\n\
    \n\\# service saslauthd stop && chkconfig --level 2345 saslauthd off\n\nInstalling\
    \ LMD\n\nLinux Malware Detect (LMD) is a malware scanner for Linux. It is designed\
    \ around the threats faced in shared hosted environments and released under the\
    \ GNU GPLv2 license.\n\n(LMD is also popularly known as “Maldet” - Malware Detect).\n\
    \nIt uses threat data from network edge intrusion detection systems to extract\
    \ malware that is actively being used in attacks and generates signatures for\
    \ detection. In addition, threat data is also derived from user submissions with\
    \ the LMD checkout feature and from malware community resources.\n\nThe signatures\
    \ that LMD uses are MD5 file hashes and HEX pattern matches, they are also easily\
    \ exported to any number of detection tools such as ClamAV.\n\nTo download and\
    \ install the latest version of LMD:\n\n![](images/00030.jpg) \n\nThis will install\
    \ the “maldet” scripts at  /usr/local/maldetect  and create a symbolic  executable.\
    \ The Installation Summary:\n\n![](images/00038.jpg) \n\nTo update the script\
    \ to the latest version:\n\n`# maldet --update-ver `\n\nTo update the latest malware\
    \ database:\n\n`# maldet --update `\n\nMaldet Configuration File is located at:\
    \  `/usr/local/maldetect/conf.maldet ` \n\nEdit this file and make the following\
    \ changes:\n\n![](images/00029.jpg) \n\nYou can leave the rest of the configuration\
    \ at its default values.  Sample Usage :  \n\nTo scan a directory:  the syntax\
    \ is:  `maldet -a <path_to_directory> ` \n\nFor example:   \n\n`# maldet -a /home/USERID/public_html\
    \ `\n\nIt will report the number of files it had scanned, as well as the number\
    \ of 'hits' (if malware is found) and the number of malware cleaned (if any)\n\
    \n![](images/00028.jpg) \n\nTo view the report of the scan generated, type:\n\n\
    `# maldet --report <SCAN_ID> `\n\n To restore a file that has been quarantined:\
    \  \n\n`# maldet --restore /usr/local/maldetect/quarantine/<FILENAME> `\n\nCreating\
    \ a daily cronjob to scan your files: \n\nWhen you first installed LMD, the installation\
    \ script will create a daily cronjob at `/etc/cron.daily/maldet ` \n\nThe file\
    \ paths for the following control-panels are supported/built-in:\n\n*   > Cpanel\
    \ \n\n*   > Plesk (PSA) \n\n*   > Ensim \n\n*   > DirectAdmin \n\n*   > Default\
    \ Apache DocRoot (/var/www/html) \n\nThe file paths setup in Virtualmin is similar\
    \ to Cpanel – so you don't have to make any changes to the script.\n\nNOTE: You\
    \ may have noticed that maldet uses the question mark (?) instead of the usual\
    \ asterix (\\*) to denote wildcard. For example, if you want to scan all the user-accounts\
    \ under the /home/ directory, you would use:\n\n`# maldet -a /home/?/public_html` \n\
    \nnote: The “?” denotes the wildcard characteristics  instead of the typical \\\
    *   \n\nChapter 9: Where to go from here?\n\nWe have covered a lot of ground in\
    \ this short book. The various code snippets that you see here are the results\
    \ of many man-hours of research, testing and debugging.\n\nWhile there are many\
    \ ways to achieve a certain goal, I've done my best follow the age-old UNIX principle\
    \ of “K.I.S.S” (Keep It Super Simple) and give you the simplest and easiest way\
    \ to achieve the goal of setting up an automated PHP-FPM server in Virtualmin.\n\
    \nBut having said that, remember that technology is always changing, and by the\
    \ time you're reading this, some things may have already changed.\n\nTo keep abreast\
    \ with the latest changes and updates in Virtualmin – check out the official website\
    \ from time to time – [http://virtualmin.com](http://virtualmin.com/).\n\nScript/Software\
    \ Download.\n\nYou can download the source code and scripts here: [http://ilovevirtualmin.com/book-2](http://ilovevirtualmin.com/book-2) \n\
    \nYou will need to enter this “Access Code”:   VMPHP2014\n\nto access the download\
    \ files.\n\nThis page will also contain all the relevant updates and book errata\
    \ found.\n\nDid you benefit from this book? \n\nIf you have benefited from this\
    \ book, please consider leaving a review at Amazon so that it will help others\
    \ who are looking for a similar PHP-FPM solution in Virtualmin. You can click\
    \ on the link below to go directly to the book:\n\n[http://ilovevirtualmin.com/book-comments/book2.php](http://ilovevirtualmin.com/book-comments/book-2.php) \n\
    \nIf there is anything lacking in this book, or if you think I should cover more\
    \ grounds, do let me know as it will help me improve this book in the next edition.\
    \  \n\n![](images/00050.jpg) \n\nYou contact me at: [`adrian.ling@gmail.com`](mailto:adrian.ling@gmail.com) \n\
    \nOther Books in the “Practical Guide Series”\n\n1\\. “Webmin & Virtualmin:  The\
    \ Best Open-Source Alternative to Cpanel”  - this is a newbie friendly book for\
    \ those who are not familiar with Webmin & Virtualmin's interface.\n\n![](images/00001.jpg) \n\
    \nFor example, in Cpanel, the term “addon domain” is known as a “Sub-server” in\
    \ Virtualmin.  This book will help you get up to speed quickly.\n\nThis is the\
    \ book that I wished I had when I moved from Cpanel/WHM to Virtualmin. If you're\
    \ wondering why I decided to move away from Cpanel, well, the main reason is that\
    \ Webmin/Virtualmin is a lot more powerful and flexible compared to Cpanel/WHM.\n\
    \nYou've seen this for yourself in this book – where we can easily add automated\
    \ PHP-FPM support into Virtualmin even though it's not officially supported.\n\
    \nWe can also create “extra admins” - for certain roles – for example, if we need\
    \ to hire a DBA to tweak our MySQL server, we can create an “Extra Admin” with\
    \ access to the MySQL server only and nothing else.  We cannot do this in Cpanel/WHM.\
    \  \n\nAnd of course, not having to pay a monthly license fee to use Virtualmin\
    \ is a big added bonus :-)\n\nIf you want to know more about this powerful Control\
    \ Panel, check it out here: [http://ilovevirtualmin.com/go/book1.php](http://ilovevirtualmin.com/go/book1.php) \n\
    \n2\\. “Apache, PHP-FPM & Nginx: How to Build A Secure, Fast and Powerful Web-Server” \n\
    \nThis is my 3rd book in the “Practical Guide” series – which is scheduled to\
    \ be published on 30th November 2014.  This book will guide you through the setting\
    \ up of PHP-FPM on a stock CentOS server – how to upgrade from the default PHP\
    \ 5.3.3 to the current stable PHP 5.4.x, how to setup automated PHP-FPM pools\
    \ for each individual virtual-servers and more importantly, how to secure PHP-FPM\
    \ on your server so that your users cannot use it to “snoop” and view sensitive\
    \ system files such as the /etc/passwd!\n\nNot many people know this, but nearly\
    \ all web-hosting servers come with the default PHP settings which is NOT secure!\
    \  \n\nAnyone with a little  php coding skills can quickly cobble a script to\
    \ view sensitive system files – such as the /etc/passwd file.  \n\nLet me show\
    \ you the  screenshot of the content of the /etc/passwd file:"
