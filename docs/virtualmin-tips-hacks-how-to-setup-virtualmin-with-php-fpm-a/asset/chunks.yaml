    # 第 6 章：Apache Handlers 101 / PHP-FPM


    这是一个“信息性”章节——旨在为你提供关于 Apache Handlers 和 PHP-FPM 的理论和背景知识。它不是必读内容，但建议阅读，这样你就能更好地理解什么是
    Apache Handler 以及什么是 PHP-FPM？


    在 90 年代初（还是末？），Web 服务器只能处理和显示 HTML 和图像。它无法访问数据库，也无法执行我们今天看到的任何华丽的“动态”功能。


    为了解决这个问题，程序员们提出了“CGI”协议——一种 Web 服务器与用其他编程语言（如 Perl、C/C++）编写的其他“程序”（或应用程序）进行通信的方法。


    Apache Web 服务器的开发者随后提出了“Handlers（处理器）”的概念——基本上这是一种模块/方法，它告诉 Apache 在遇到特定类型的文件时，如何与外部程序（例如
    Perl 脚本、PHP 脚本等）进行通信。


    例如，如果 Web 访问者请求了一个 `*.cgi` 文件，那么相应的处理器将指示 Apache 调用 CGI 脚本/解析器来处理该文件。如果请求的文件是
    `*.php` 文件，那么相应的 PHP 处理器将指示 Apache 如何处理该 `*.php` 文件。


    简而言之，这就是 Apache “Handler（处理器）”（通俗来说）——它指示 Apache 如何处理/加工不同类型的文件。


    对于 PHP 文件，本质上有 3 种不同类型的“Handlers（处理器）”


    *   在 Apache 内部加载并运行整个 PHP 引擎（解释器）。这被称为 `mod_php` 或“Apache 2.0 Handler”。这是默认方法。

    *   “CGI”处理器——Apache 将调用 `/usr/bin/php-cgi` 脚本来处理 PHP 文件，并将所有的环境变量传递给 `cgi` 程序。`cgi`
    程序将处理请求并将结果传回给 Apache。一旦完成，`cgi` 进程会被杀死。

    *   “Fast-CGI”处理器——这是 CGI 协议的增强，`fast-cgi` 进程在完成工作后不会被杀死。它可能可以“永远运行”，并且通常作为守护进程与
    Apache 并行运行。此外，Apache 与 FastCGI 应用程序之间的通信是通过 IPC（进程间通信，如 Unix socket 或 TCP socket）完成的。


    在第一种情况下，即“mod_php”——每个 apache 子进程实例内部都有整个 PHP 堆栈/引擎。这会导致 Apache 进程出现不膨胀，因为并不是所有的
    Web 请求都会指向 PHP 脚本，有些 Web 请求只是请求图像、CSS、JavaScript。因此，运行“mod_php”会导致内存使用效率低下——如果一个高流量网站有大量图形，这可能会成为问题。


    通常，`mod_suexec` 和 `mod_suPHP` 会与 `mod_php` 一起使用，使 Apache 能够在虚拟服务器相同的 userID 下运行
    PHP 脚本，以提供额外的安全账户隔离，即一个虚拟服务器中的脚本无法访问另一个虚拟服务器上的文件。


    现代应用程序不再使用 CGI 处理器，因为创建/杀掉 CGI 进程的操作非常消耗 CPU 且效率低下。


    FastCGI 处理器是首选。它允许 PHP 脚本在 Apache Web 服务器之外由 PHP 引擎/解析器执行，即每个请求都通过通信套接字（IPC）从
    Apache Web 服务器传递给 FastCGI 进程。


    FastCGI 的优势在于进程是“持久的”——可以配置多个持久性进程在后台运行，以处理传入的 PHP 请求。这避免了“CGI”方法中创建/终止进程的昂贵且
    CPU 密集型操作。


    那么，PHP-FPM 是什么时候出现的呢？PHP-FPM 实际上是带有其内置“进程管理器”（PM）的“FastCGI”。


    需要注意的是，大多数 FastCGI 应用程序/进程以守护进程（服务器）模式与 Apache 并行运行。这些 FastCGI 应用程序由“PM”（进程管理器）管理。


    在 Apache 中，当我们使用 `fastcgid` 模块（Virtualmin 中的默认设置）时，Apache 使用其内置的“PM”来管理 FastCGI
    进程。


    但当我们使用 `mod_fastcgi` 模块（从 RepoForge 仓库安装）时，Apache 将“进程管理器”的控制权交给 PHP-FPM 引擎，它有自己的“PM”。


    PHP-FPM 实际上是带有其内置“进程管理器”（PM）的“FastCGI”。


    需要注意的是，大多数 FastCGI 应用程序/进程以守护进程（服务器）模式与 Apache 并行运行。这些 FastCGI 应用程序由“PM”（进程管理器）管理。


