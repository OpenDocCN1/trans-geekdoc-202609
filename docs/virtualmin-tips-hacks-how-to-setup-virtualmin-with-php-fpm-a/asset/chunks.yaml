    # Virtualmin 技巧与方案


    如何在 Virtualmin 中设置并集成 PHP-FPM 与 Nginx 反向代理


    Adrian Ling Kong Heng


    版权所有 ©2014

    [www.ilovevirtualmin.com](http://www.ilovevirtualmin.com/)


    版权 2014 © Adrian Ling. 版权所有。


    未经版权所有者和出版者的事先书面许可，本书任何部分不得以任何形式或手段（电子或机械，包括复印、录制或通过任何信息存储或检索系统）进行复制或传输。


    ## 致谢


    我感谢上帝让我能够写出这本书，我的存在也归功于他。


    特别感谢我美丽的妻子和两个出色的孩子，感谢他们的支持，并为我提供了写作的时间和空间。


    当然，如果没有这两位创建这本书的伟大男人，这本书是不可能可能的——在 2005 年后期创建这本书的 Jamie Cameron 和 Joe Cooper ——
    他们至今仍活跃在书中内容的维护和增强工作中。


    如今，Webmin/Virtualmin 是全球最流行的基于 Web 的 Unix/Linux 服务器管理工具之一，每年下载量超过 300 万次！


    ## 奖励


    所有的源代码列表都可以在随附网站的“Customers”部分进行下载——[www.ilovevirtualmin.com](http://www.ilovevirtualmin.com/)。下载这些文件的
    `Access Code` 位于本书的最后一章。除了书中需要的源码列表和脚本外，我还创建了两个独立的 Shell 脚本，帮助你从命令行快速为 Nginx 反向代理和
    PHP-FPM 池创建配置文件。


    我的同事建议我应该将这些脚本以每个 5 美元的价格单独出售，但我希望为你提供一个完整的解决方案。在 Virtualmin 中安装、配置、集成和自动化 PHP-FPM
    以及 Nginx 所需的**所有内容**都在此书中。没有没有任何遗漏。


    - `createvhost.sh` – 用于创建 Nginx 反向代理“虚拟主机 (vhosts)”的 shell 脚本——你只需要提供 `userID`、`domain-name`
    和 IP 地址，脚本就会为你创建正确的虚拟主机配置设置。

    - `createpool.sh` – 此 shell 脚本将为你的每个现有的虚拟服务器（Virtual Servers）创建独立的“php-fpm”用户池。你只需要提供
    `userID`，剩下的将由它处理。


    如果你在当前的 Virtualmin 配置中有许多现有网站（虚拟服务器），并且你想将它们迁移到 PHP-FPM 和/或 Nginx 反向代理，你会发现这两个脚本非常有用。


    我写这本书的目标（正如我在“实用指南系列”中的所有其他书籍一样）是让你尽可能快地提高生产力！


    好了，在我们开始之前最后说明一点——我的律师说应该按照下面的格式进行“正确的框架化表述”（即“免责声明和使用条款协议”）——但如果听我的话，服务条款的“简短精明版”是这样的这样的——


    ## 免责声明和使用条款协议


    本书的作者和出版者对于书中包含的信息或方法的准确性或完整性不作任何明示或暗示的陈述或保证。作者和出版者对使用本材料引起或与之相关的任何索赔或损害不承担责任。


    书中的信息按“原样”提供，不提供任何形式的明示或暗示保证，包括但不限于商用性、特定用途的适用性及侵权担保。对书中所包含信息的任何使用均由你自行承担风险。


    ## 引言


    这是一份实用的、操作性强的指南，帮助你在 Virtualmin 中设置、配置、集成和自动化 PHP-FPM 以及 Nginx 代理。网上有很多教程显示你可以这样做，但那个过程是手动操作的。我正要向你展示的方法是完全自动化的。


    注意：虽然这本书针对的是经验丰富的用户，但我尽可能包含了大量的介绍性文字，以提供每一步操作的快速概述。如果你是一个资深系统管理员，可以直接跳过“介绍”部分直接进入干货内容。


    请注意，你需要对 Virtualmin 有一定的熟悉，因为本书没有涵盖各种设置和菜单。例如，如果指令说进入 `Virtualmin > System Settings
    > Server Template`——假设读者知道这意味着什么以及如何导航到相应页面。


    如果你完全不知道这意味着什么，但又想使用 Virtualmin，那么你可能想看看我的另一本书——“Webmin & Virtualmin – Cpanel
    的开源替代方案”——这是一本对新手友的书，有大量的截图帮助你快速上手。


    ## 为什么选择 PHP-FPM？


    我不会深入探讨什么是 PHP-FPM 以及它的优缺点——但简单来说，PHP-FPM 为繁忙、高流量的网站提供了更好的稳定性和性能，同时资源占用较低。


    由于这些优势，许多网站管理员正在转向 PHP-FPM 实现，而不是标准 Apache 配置中典型的 `mod_php` 或 `FastCGI` 实现。在 Virtualmin
    中，默认是在 `fcgid` 模式下运行 PHP——这对提供必要的安全和账户隔离非常有帮助。


    然而，这种设置的主要问题是 fcgid 没有 PHP-FPM 高效。在内存有限的服务器上，持续的大流量爆发会迅速耗尽所有可用内存并导致服务器不稳定。


    注意：如果你想了解更多关于 PHP-FPM 与与其他 SAPIs 的对比，请访问：[`php-fpm.org/about/`](http://php-fpm.org/about/)
    你会发现一个原生 PHP、`PHP-FastCGI` 和 `PHP-FPM` 的对比图。


    ## 为什么选择 Nginx？


