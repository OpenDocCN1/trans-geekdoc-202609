  trans: "\nRPMFORGE 是另一个深受许多开源爱好者信赖的流行软件仓库。它现在被称为“RepoForge”，这是一个为 Red Hat Enterprise\
    \ Linux (RHEL)、CentOS 和 Scientific Linux 维护各种 RPM 软件包的项目。它提供了一组与各种 RHEL 派生发行版兼容的仓库。\n\
    \n## 下载并安装 RepoForge\n\n```bash\n# wget http://pkgs.repoforge.org/rpmforge-release/rpmforge-release-0.5.3-1.el6.rf.i686.rpm\n\
    ```\n\n如果您使用的是不同的 CentOS 发行版，请访问 [`repoforge.org/use`](http://repoforge.org/use)\
    \ 并为您的服务器选择合适的版本。\n\n**注意**：现在**不要**安装它——因为稍后当我们运行 `yum update` 命令更新已安装的仓库时，默认的“AWStats”软件包将被\
    \ RepoForge 仓库中的软件包替换，这将导致 AWStats 报告损坏。我们将稍后解决这个问题。\n\n## 现在是更新软件仓库（EPEL & REMI）的时间\n\
    \n### 更新 EPEL 仓库\n\n下面的命令将更新 EPEL 仓库中的最新软件包：\n\n```bash\n# yum update\n```\n\n\
    ![](img/00017.jpg) 输入“y”并按回车。\n\n### 安装/升级 MySQL 5.5 和 PHP 5.4\n\n下面的命令（带有 `--enablerepo=remi`\
    \ 标记）将激活 REMI 仓库并告诉 yum 包管理器从 REMI 安装/升级软件：\n\n```bash\n# yum --enablerepo=remi\
    \ upgrade mysql\n```\n\n**注意**：上面的命令还将把 PHP 5.3 升级到 PHP 5.4，因为 yum 工具将确保所有相互链接的软件依赖都满足（例如，其中一个\
    \ php-mysql 连接到 MySQL 5.1——所以当我们把 MySQL 升级到 5.5 时，yum 工具也将把相应的“php-mysql”软件包升级到\
    \ PHP 5.40）。\n\n![](img/00006.jpg) 提示时，输入 'y' 并按回车。\n\n**注意**：第 4 列告诉您软件软件包是从哪个软件仓库安装的。一旦软件升级完成，运行此命令来更新\
    \ MySQL 中的一些基本表：\n\n```bash\n# mysql_upgrade\n```\n\n### 安装 PHP-FPM\n\n现在所有系统软件都已更新，让我们从\
    \ REMI 仓库安装 PHP-FPM：\n\n```bash\n# yum --enablerepo=remi install php-fpm\n```\n\
    \n这将创建目录：`/etc/php-fpm.d/`，并带有默认的“www.conf”池文件。我们稍后需要在此目录下创建一个名为“www.bare”的新“池模板”。\n\
    \n![](img/00022.jpg)\n\n好了，现在我们将安装“RepoForge”仓库，这样我们就可以安装“mod_fastcgi”软件包。Apache\
    \ 与 PHP-FPM 服务器的通信需要这个“mod_fastcgi”。\n\n```bash\n# rpm -ivh rpmforge-release-0.5.3-1.el6.rf.i686.rpm\n\
    # yum install mod_fastcgi\n```\n\n![](img/00039.jpg)\n\n上面的命令将在 `/etc/httpd/conf.d/`\
    \ 目录下安装一个名为“fastcgi.conf”的文件。使用您喜欢的编辑器编辑该文件，并将文件中的**所有**内容替换为仅这 3 行代码：\n\n（注意：上述\
    \ 3 行的源代码可以在“fastcgi.conf”文件中找到）\n\n## 第 2 章：Virtualmin 配置\n\n好了，现在所有必要的软件都已更新并安装，让我们现在登录\
    \ Virtualmin。\n\n**注意**：如果这是您第一次登录 Virtualmin，它将提示您完成一系列“安装后步骤”，在这些步骤中将微调某些服务器设置（例如，根据您选择的内存设置为您优化\
    \ MySQL 的 `/etc/my.cnf` 并为 MySQL 分配根密码）。\n\n一旦完成安装后步骤，进入 Virtualmin 的配置页面。点击 Virtualmin\
    \ 菜单，并点击：“系统设置 (System Settings) > Virtualmin 配置 (Virtualmin Configurations)”。\n\
    \n![](img/00023.jpg) 您将看到以下页面。\n\n[此处重复]\n\n从下拉列表中选择“创建服务器和用户时的操作 (Actions upon\
    \ server and user creation)”。您将看到：\n\n![](img/00037.jpg)\n\n需要注意的两个重要字段是：\n\n\
    * 修改服务器之前运行的命令：`/root/updatehandler.sh` \n* 修改服务器之后运行的命令：`/root/phpfpm.sh`\n\n\
    这是使所有 PHP-FPM 自动化运行的“关键”。基本上，此功能允许您在修改服务器之前（例如在创建虚拟服务器之前）或在服务器创建之后运行自定义脚本。\n\n\
    * `/root/updatehandler.sh` 是一个简单的脚本，用于检查 `/etc/httpd/conf.d/fastcgi.conf` 是否存在；如果存在，则将其重命名为\
    \ `/etc/httpd/conf.d/fastcgi.conf.orig`。这防止了 'mod_php' 模块的加载。\n* `/root/phpfpm.sh`\
    \ 是创建 FPM 池的主脚本。它也适用于删除服务器。\n\n## 第 3 章：Virtualmin 配置\n\n[此处存在大量文本重复内容...]\n\n\
    ## 第 4 章：自动化：自定义脚本\n\n在第 2 章中，我们已经设置了 Virtualmin 运行 2 个自定义脚本——在创建虚拟服务器之前运行 `updatehandler.sh`，在虚拟服务器创建之后运行\
    \ `phpfpm.sh`。在本章中，我们将仔细查看这 2 个 shell 脚本，以及其他一些“辅助”脚本。\n\n您可以在此处下载这些脚本：[`ilovevirtualmin.com/books-scripts/php-fpm`](http://ilovevirtualmin.com/books-scripts/php-fpm)\n"
