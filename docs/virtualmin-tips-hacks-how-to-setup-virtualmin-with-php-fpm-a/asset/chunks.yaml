- raw: "Nginx is a rising star where web-servers are concerned. Nearly 40% of the\
    \ world's busiest website runs a highly tuned Nginx to serve thousands of visitors\
    \ daily. It is fast, stable and it does not use as much resources as the Apache\
    \ server.  Virtualmin has built-in support to run the Nginx webserver insteadl\
    \ of Apache – but the support and functionality for Nginx is rather limited compared\
    \ to Apache. Furthermore, if you want to run the Nginx webserver, you have to\
    \ disable Apache.\n\nWe want to run both – Apache as the main webserver, and Nginx\
    \ as the “reverse-proxy” to handle all the static pages and files. This is not\
    \ supported inVirtualmin. The information in this book will enable you to have\
    \ the best of both worlds – the power and flexiblity of the Apache webserver,\
    \ and the speed and agility of Nginx server as the “reverse proxy” running on\
    \ the same Virtualmin powered server.\n\nWhy this book? \n\nThere are many tutorials\
    \ on the internet that shows one how to do this, but unfortunately, many of them\
    \ are outdated and contains errors. Furthermore, the process is “Manual” - i.e.\
    \ each time the webmaster create a new virtual server (hosting account), the webmaster\
    \ has to manually edit multiple configuration files – the php-fpm pools, the Apache\
    \ /etc/httpd/conf/httpd.conf file, etc.\n\nI wrote this book because I'm a great\
    \ fan of automation. I want Virtualmin to automate the entire process – i.e. when\
    \ I create a new virtual server (hosting account), I want everything to be automatically\
    \ setup – the php-fpm pools running under its own UserID (virtual server ID) and\
    \ the appropriate Apache directives automatically appended to the /etc/httpd/conf/httpd.conf\
    \ file.\n\nThis book is birthed after many days of searching the Internet for\
    \ relevant information – from various developer forums, tech blogs and the official\
    \ Virtualmin documentation, and putting all these bits and pieces together in\
    \ this cohesive book. The custom config files provided and custom shell scripts\
    \ are the results of many man-hours.\n\nAssumption about the Reader\n\nThe reader\
    \ is expected to be familiar with the Virtualmin interface and the various menus\
    \ and settings. The following skills are expected from the reader as well:\n\n\
    *   > Ability to use one of the built-in Unix/Linux editors such as 'vi' , 'joe'\
    \ or 'nano'. \n\n*   > Ability to run commands from the command line/shell. \n\
    \nOverview\n\nBefore we start, please take note that steps outlined in Chapter\
    \ 1 – 5 are meant for a brand new server or VPS.  In other words, there are no\
    \ existing websites or Virtual Servers configured in Virtualmin. This is important\
    \ because we need to do some preparatory work to configure Virtualmin before creating\
    \ our first Virtual Server (website).\n\nNOTE:  If you have existing websites\
    \ (virtual servers), you can still follow along but do NOT create any new virtual\
    \ server until you've read Chapter 5.\n\nOtherwise, your existing sites will 'stop\
    \ working' because it could not find the correct Apache handler to process the\
    \ php files.  \n\nFAIR WARNING:  There is always a possibility that your existing\
    \ sites may break if you decide to implement the steps outlined in this guide\
    \ on your production server. This is because every server environment and setup\
    \ is different. There are no identical setup – unless you have set them up exactly\
    \ the same way from scratch at the same time.  \n\nMurphy's Law tends to strike\
    \ when one least expect it. Because of this, I would strongly recommend that you\
    \ try this on a development server (you can easily get cheap VPS for $5 - $10/mth\
    \ to test).\n\nOnce you're confident that it will work in your environment, then\
    \ you can apply it to your production server.  Let's dive in!\n\nChapter 1: Installing\
    \ the Software\n\nIf you have just installed Virtualmin on a stock server or VPS,\
    \ you're probably running CentOS 6  at the time of this writing (October 2014).\
    \ CentOS 7 has just been released recently, and Virtualmin support for it is not\
    \ as matured or stable compared to CentOS 6\n\nCentOS 6.5 (and 6.6)  ships with\
    \ the following default software:\n\n*   > PHP 5.3.3  (this version of PHP has\
    \ reached its end of life and is no longer supported by the PHP team) \n\n*  \
    \ > MySQL 5.1.73  (a very old version of MySQL server. Current stable version\
    \ is MySQL 5.5) \n\n*   > Apache 2.2.15  (although aged, it is considered one\
    \ of the most stable version of Apache ever released. The RedHat/CentOS team is\
    \ still actively maintaining it) \n\nFor the purpose of this book, we will be\
    \ updating PHP to the latest stable 5.4 and upgrading the aged MySQL server to\
    \ the current 5.5 from the “EPEL” and “REMI” repositories. We will also install\
    \ “mod\\_fastcgi” which is required for Apache to “communicate” with PHP-FPM from\
    \ the “RepoForge” repository.\n\nA quick note about Software repositories – some\
    \ 3rd party software repositories may use the same package name as the base CentOS\
    \ packages – enabling and using these software repositories may cause you to accidentally\
    \ over-write the standard base packages with those from these 3rd party repositories.\
    \ Hence, use these 3rd party repositories with care.\n\nTIP:  When you run the\
    \ “yum install ...” command (without the '-y' flag), it will display the package\
    \ name PLUS the name of the repository it is located. You need to manually enter\
    \ “y” to confirm the install if want to go ahead and install the software.   \n\
    \nEPEL (Extra Packages for Enterprise Linux)\n\nRef:  [https://fedoraproject.org/wiki/EPEL](https://fedoraproject.org/wiki/EPEL) \n\
    \nEPEL is a Fedora Special Interest Group that creates, maintains, and manages\
    \ a high quality set of additional packages for Enterprise Linux such as RHEL\
    \ (RedHat's commercial OS), CentOS (Same as RHEL, but community supported), Scientific\
    \ Linux (SL) and Oracle Enterprise Linux (OEL).\n\nEPEL packages are usually based\
    \ on their Fedora counterparts and does not conflict with or replace packages\
    \ in the base Enterprise Linux distributions. EPEL uses much of the same infrastructure\
    \ as Fedora, including buildsystem, bugzilla instance, updates manager, mirror\
    \ manager, etc.\n\nDownload and Install the EPEL repository:\n\n`# wget `[`http://dl.fedoraproject.org/pub/epel/6/i386/epel-release-6-8.noarch.rpm`](http://dl.fedoraproject.org/pub/epel/6/i386/epel-release-6-8.noarch.rpm) \n\
    \n`# rpm -ivh epel-release-6.8.noarch.rpm`\n\n(Note: If you're using a different\
    \ CentOS distro, e.g. 64-bit instead of 32-bit, please visit the EPEL page and\
    \ download the appropriate rpm package for your machine.\n\nTo check for the latest\
    \ news/updates or software versions, please visit:\n\nREMI: \n\nRef: [http://blog.famillecollet.com/pages/Config-en](http://blog.famillecollet.com/pages/Config-en) \n\
    \nThe REMI software repository a yum repo maintained by a French programmer -\
    \  Remi Collet. It usually has the latest version of the software in found in\
    \ the core CentOS and Red Hat repositories, and it uses the same package names\
    \ as in the official repositories.\n\nFor example, the official CentOS repository\
    \ uses the name “php-cli” (the command line version of PHP and is based on PHP\
    \ 5.3.3).   IF you install “php-cli” from the REMI  repository,  it will automatically\
    \ upgrade the “php-cli” to the latest PHP 5.4.34\n\nBecause of this (packages\
    \ using the same naming convention as the official repos), the REMI repository\
    \ is “disabled” by default so that you don't accidently “upgrade” a system software\
    \ without realizing it.\n\nYou'll have to explicity 'enable' this repo if you\
    \ want to install a particular software from this repo.  The Remi repository also\
    \ depends on the EPEL repository which is why we have to install the EPEL repo\
    \ first.\n\nDownload and Install the REMI repository:\n\n`# wget `[`http://rpms.famillecollet.com/enterprise/remi-release-6.rpm`](http://rpms.famillecollet.com/enterprise/remi-release-6.rpm) \n\
    \n`# rpm -ivh remi-release-6.rpm`\n\nRPMFORGE:    [http://repoforge.org/use/](http://repoforge.org/use/) "
