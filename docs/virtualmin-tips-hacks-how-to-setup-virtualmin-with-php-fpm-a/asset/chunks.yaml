    # Virtualmin Tips & Hacks


    How to Setup and Integrate PHP-FPM & Nginx Reverse Proxy into Virtualmin


    Adrian Ling Kong Heng


    Copyright © 2014

    [www.ilovevirtualmin.com](http://www.ilovevirtualmin.com/)


    Copyright 2014 © Adrian Ling. All rights reserved.


    No part of this work may be reproduced or transmitted in any form or by any means,
    electronic or mechanical, including photocopying, recording or by any information
    storage or retrieval system without prior written permission from the copyright
    owner and the publisher.


    ## Acknowledgements


    I am grateful to God who enabled me to write this book, and to whom I owe my very
    existence.


    Special thanks to my beautiful wife and my 2 wonderful kids for supporting me
    and giving me the time and space to write.


    And of course, this book would not have been possible without these two great
    men who created it - Jamie Cameron & Joe Cooper in the late 2005 – and who are
    still actively involved in maintaining and enhancing it.


    Today, Webmin/Virtualmin is one of the world''s most popular web-based Unix/Linux
    server administration tool, with more than 3 million downloads every year!


    ## Bonuses


    All the source code listings are available for download in the “Customers” section
    on the accompanying website – [www.ilovevirtualmin.com](http://www.ilovevirtualmin.com/).
    The `Access Code` to download these files are in the last chapter of this book.
    In addition to the source code listings and scripts required in this book, I''ve
    also created 2 standalone shell scripts to help you create the configuration files
    for Nginx Reverse-Proxy and PHP-FPM pools quickly from the command line.


    My colleagues suggested that I should sell these scripts separately at $5 per
    script, but I want to provide a complete solution for you. Everything you need
    to install, configure, integrate and automate PHP-FPM and Nginx in Virtualmin
    IS in this book. Nothing is left out.


    - `createvhost.sh` – shell script to create the Nginx reverse-proxy “vhosts” -
    you just need to provide the `userID`, `domain-name` and `IP address`, and the
    script will create the correct vhost configuration settings for you.

    - `createpool.sh` – this shell script will create individual “php-fpm” user-pools
    for each of your existing Virtual Servers. You just need to provide the `userID`
    and it will take care of the rest.


    You will find these 2 scripts really useful if you have many existing websites
    (virtual servers) in your current Virtualmin setup and you want to migrate them
    to PHP-FPM and/or Nginx Reverse Proxy.


    My goal with this book (as with all my other books in the “Practical Guide Series”)
    is to empower you to be productive as quickly as possible!


    Ok, one last note before we begin – my lawyer said it should be “framed correctly”
    in the format below (“Disclaimer and Terms of Use Agreement”) - but if I have
    my way, the “short and sweet version” version of the TOS is this -


    ## Disclaimer and Terms of Use Agreement


    The author and publisher of this book make no representations or warranties of
    express or implied, regarding the accuracy or completeness of the information
    or methods contained herein. The author and publisher shall not be liable for
    any claim, damages arising out of or in connection with the use of this material.


    The information in this book is provided “as is”, without warranty of any kind,
    express or implied, including but not limited to the warranties of merchantability,
    fitness for a particular purpose and infringement. Any use of the information
    contained in this book is strictly at your own risk.


    ## Introduction


    This is a practical, hands-on guide to help you setup, configure, integrate and
    automate both PHP-FPM and Nginx-proxy into Virtualmin. There are many tutorials
    online that shows you can do this, but the process is manual. The method I''m
    about to show you is fully automated.


    NOTE: Although this book is targetted at more seasoned users, I''ve included as
    much introductory text as possible to provide a quick overview of each step. If
    you''re a seasoned System Admin, you can just skip the ''intro'' and and into
    the meaty stuff.


    Please note that familiarity with Virtualmin is required because this book does
    not cover the various settings and menus. For example, if the instruction says,
    go to `Virtualmin > System Settings > Server Template` - the reader is assumed
    to know what that means and how to navigate to the appropriate page.


    If you''ve no idea what that means, but you want work with Virtualmin, then you
    may want to check out my other book – “Webmin & Virtualmin – the Open Source Alternative
    to Cpanel” - a newbie friendly book with multiple screenshots to help you get
    up to speed.


    ## Why PHP-FPM?


    I won''t into the details of what is PHP-FPM or what are its pros and cons – but
    in a nutshell, PHP-FPM offers greater stability and better performance for busy,
    high-traffic websites while utilizing lower resources.


    Because of these benefits, many webmasters are turning to PHP-FPM implementation
    instead of the typical `mod_php` or `FastCGI` implementation in stock Apache setup.
    In Virtualmin, the default setup is to run PHP under the `fcgid` mode – which
    is great for providing the necessary security and account isolation.


    However, the main issue with this setup is that fcgid is not as efficient as PHP-FPM.  On
    a server with limited RAM/memory, a sustained burst of heavy traffic can quickly
    eat up all the available memory and cause instability to the server.


    Note: If you want to know more about how PHP-FPM stack up against the other PHP
    SAPIs, please visit: [http://php-fpm.org/about/](http://php-fpm.org/about/) You
    will find a comparison chart between vanilla PHP (php out of the box), `PHP-FastCGI`
    and `PHP-FPM`.


    ## Why Nginx?

