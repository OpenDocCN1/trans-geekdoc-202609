- raw: "Download the “vserver.tgz” file and extract it in the /root directory.  You\
    \ will see the following files and directory:\n\n*   > `updatehandler.sh` \n\n\
    *   > `phpfpm.sh` \n\n*   > `createpool.sh` \n\n*   > `www.bare` \n\n*   > `fastcgi.conf`\
    \ \n\n*   > `nginx/  ← this is a folder.` \n\n    *   > > `nginx.conf` \n\n  \
    \  *   > > `proxy.inc` \n\n    *   > > `microcache.inc` \n\n    *   > > `virtualserver.com`\
    \ \n\n    *   > > `nginx-proxy` \n\n    *   > > `createvhost.sh` \n\n` `\n\nLet's\
    \ look at each of these custom scripts:\n\n1\\. “updatehandler.sh”\n\nBasically,\
    \ this script checks if the /etc/httpd/conf.d/php.conf exist. If it does, then\
    \  will rename it to “php.conf.orig” to prevent Apache from loading this module\
    \ and running the PHP interpreter as 'mod\\_php'.  This will enable 'mod\\_fastcgi'\
    \ module to run and communicate with the PHP-FPM server.\n\nIt will also make\
    \ a backup copy of all the files in the /etc/httpd/conf/ and /etc/httpd/conf.d/\
    \ to the “/root/config-bak/” for safe-keeping.\n\n![](images/00027.jpg)  \n\n\
    2\\. “phpfpm.sh”\n\nThis script makes use of the conditional statement “If the\
    \ $VIRTUALSERVER\\_ACTION“ provided by Virtualmin.  This is a cool feature in\
    \ Virtualmin that allows one to create some really funky scripts by using the\
    \ various conditional statements provided by Virtualmin.   Here's the  code listing:\n\
    \n![](images/00005.jpg) \n\nThis script (phpfpm.sh) uses the 'sed' command to\
    \ create a new PHP-FPM pool under the Virtual Server's userID (account owner)\
    \ in the /etc/php-fpm.d/ directory.\n\nIt uses the base pool template file (“www.bare”)\
    \ and replaces ALL occurences of “www” with the “userID”.   \n\nYou can also tweak\
    \ the settings in the “www.bare” file to suit your server environment.   \n\n\
    If If the $VIRTUALSERVER\\_ACTION test returns 'DELETE\\_DOMAIN' (i.e. the virtual\
    \ server was deleted from Virtualmin, then this script will remove the PHP-FPM\
    \ pool file and restart the PHP-FPM service to remove that user's process.\n\n\
    \\*NOTE:  The additional “if” statement, i.e.\n\n`if [ -f /root/nginx-proxy ];\
    \ then `\n\n`  …CODE to create/delete Nginx vhosts…`\n\n`fi`\n\nThe conditional\
    \ statement above checks if the file “nginx-proxy” (it's a blank/empty file) exist\
    \ in the “/root” folder.  By default, it doesn't, but resides in the “ngnix” folder\
    \ instead. So, if you want to the script to automatically create the Nginx reverse-proxy\
    \ vhost files, you need to copy the “nginx-proxy” file to /root  \n\n(OR you can\
    \ just issue this command:  `# touch /root/nginx-proxy `)\n\n3\\. “www.bare” \n\
    \nThis is the php-fpm pool template file that will be used by the '/root/phpfpm.sh'\
    \ script. All occurences of 'www' will be replaced with the Virtual-server's userID.\n\
    \n![](images/00026.jpg)You can tweak the variables, e.g. the “pm.\\_\\*” to suit\
    \ your server environment/resources.\n\n4\\. “fastcgi.conf” \n\nThis is the custom\
    \ (and much simpler) 3 liner which tells Apache to load the 'mod\\_fastcgi' module\
    \ and create a new PHP handler (called “php-fpm”) to process all .php files.  We\
    \ wil use this file to replace the default “fastcgi.conf” that came with the 'mod\\\
    _fastcgi' module.\n\n![](images/00015.jpg)  \n\nOnce all these custom scripts\
    \ are in place, you're good to go.  Create your Virtual Servers  as you normally\
    \ would, and Virtualmin will automatically setup the new virtual-server to run\
    \ PHP-FPM under its own userID.\n\nIf you want to do more fancy stuff with automating\
    \ the Virtual Server creattion, refer to this documentation: [http://www.virtualmin.com/documentation/developer/prepost](http://www.virtualmin.com/documentation/developer/prepost) \n\
    \nIt has a few sample scripts to get you started, and below are the list of variables\
    \ which are useful:\n\nList of Virtualmin's Environment Variables\n\n![](images/00049.jpg)`\
    \  `\n\nCongratulations! You now have a fully automated PHP-FPM powered Virtualmin\
    \ server.\n\nChapter 5: Setup PHP-FPM on existing Websites.\n\nThe earlier chapters\
    \ assumes a brand new Virtualmin server that does not have any existing Virtual\
    \ Servers (websites). This allowed us to configure Virtualmin to  discard the\
    \ other PHP Sapi and uses PHP-FPM only.  If you have existing websites (Virtual\
    \ Servers) in Virtualmin, we need to reconfigure the existing sites first – otherwise,\
    \ those sites will stop working after PHP-FPM has been installed.\n\nThis chapter\
    \ will guide you through the necessary steps to achieve this.  I do strongly recommend\
    \ that you do NOT do this on a Production server because the chances of breaking\
    \ something is quite high, e.g. a small typo error can cause havoc.  Test it out\
    \ on a development server (VPS) first, and once you've the steps down pat, only\
    \ then you can implement it on your live server.\n\nOk, with that out of the way,\
    \ let's proceed!\n\nBackup! \n\nNeedless to say, the first step is to backup ALL\
    \ the existing Apache's configuration so that in case anything goes awry, you\
    \ can restore them.\n\n`# cd /etc/httpd/`\n\n`# mkdir -p /root/apache-config/`\n\
    \n`# cp -R conf/ conf.d/  /root/apache-config`\n\nThe 3 commands above will copy\
    \ all the existing configuration to the /root/ directory.\n\nOnce you've backed-up\
    \ the configuration files, you can follow the steps outlined from Chapter 1 –\
    \ 4 to setup PHP-FPM to work with Virtualmin.  \n\nBUT, do NOT create/modify/delete\
    \ any virtual servers yet!  \n\nThis is to prevent Virtualmin from triggering\
    \ our custom scripts.  \n\nWe need to make the following changes first:\n\nStep\
    \ 1. Modify /etc/httpd/conf/httpd.conf\n\nAfter installing PHP-FPM , mod\\_php\
    \ will no longer be loaded in Apache, and neither will “FCGId”  - so we need to\
    \ modify all the existing Virtualhost configured in the /etc/httpd/conf/httpd.conf\
    \ to work with PHP-FPM instead.\n\nOpen the file with your favorite editor – find\
    \ and delete ALL the following lines of code that beings with:\n\nAddHandler fcgid-script\
    \ .php\n\nAddType application/x-httpd-php .php\n\nAddHandler fcgid-script .php\n\
    \nAddHandler fcgid-script .php5\n\nFCGIWrapper /home/pixms/fcgi-bin/php5.fcgi\
    \ .php\n\nFCGIWrapper /home/pixms/fcgi-bin/php5.fcgi .php5\n\nRemoveHandler .php\n\
    \nRemoveHandler .php5\n\nIPCCommTimeout\n\nFcgidMaxRequestLen\n\nAnd ALL occurences\
    \ of that starts with “php\\_”\n\nFor example,  “`php_admin_value engine Off`”\n\
    \nAfter that, you need to append the following lines of code for EACH virtual\
    \ host, e.g.\n\n`<IfModule mod_fastcgi.c> `\n\n`   Alias /php-fpm /home/``USER``/cgi-bin/php-fpm\
    \ `\n\n`   FastCgiExternalServer /home/``USER``/cgi-bin/php-fpm -socket /home/``USER``/cgi-bin/``USER``.sock\
    \ -pass-header Authorization -idle-timeout 100 `\n\n`</IfModule> `\n\n` `\n\n\
    Replace “USER” with the actual UserID of that Virtual Server.   You can find the\
    \ 'USER' for each virtualhost by looking for the “DocumentRoot” line.\n\nFor example:\n\
    \n`DocumentRoot /home/``pixms``/public_html`\n\nThis tells you that the 'USER'\
    \ in this case is 'pixms'\n\nStep 2. Rename /etc/httpd/conf.d/php.conf\n\nRename\
    \ 'php.conf' to php.conf.orig. This is to prevent Apache from loading the mod\\\
    _php module.\n\n`# cd /etc/httpd/conf.d/`\n\n`# mv php.conf php.conf.orig`\n\n\
    Step 3. Create the individual PHP-FPM pools \n\nMake sure the template pool file\
    \ (www.bare)  exist in /etc/php-fpm.d/\n\nIf not, then either create it (from\
    \ the source code listing in Chapter 4 or copy it from the downloaded custom script\
    \ package.\n\n\\# cd /etc/php-fpm.d/\n\nWe are going to use the powerful 'sed'\
    \ utility to do the heavy lifting for us.\n\nThe syntax is:  \n\n`sed 's/www/USER/g'\
    \ www.bare > USER.conf`\n\nwhere 'USER' is the virtual server account-owner ID.\n\
    \nFor example, assuming the UserID for our virtual server is “pixms”, we would\
    \ issue the following commmand:\n\n` `\n\n\\# sed 's/www/pixms/g' www.bare > pixms.conf\n\
    \n![](images/00019.jpg) \n\nOR, you can use provided script, “createpool.sh”  to\
    \ automatically create them.\n\n![](images/00045.jpg) \n\nSource code for:  createpool.sh \n\
    \n(note: this scripts needs the template file, “www.bare”  in the /etc/php-fpm.d\
    \ directory)\n\n![](images/00031.jpg)  \n\nStep 4: Final Check\n\n*   > Have you\
    \ edited all the <VirtualHost> containers in the /etc/httpd/httpd.conf file? "
  fmt: "\nDownload the `vserver.tgz` file and extract it in the `/root` directory.\
    \ You will see the following files and directory:\n\n*   `updatehandler.sh`\n\
    *   `phpfpm.sh`\n*   `createpool.sh`\n*   `www.bare`\n*   `fastcgi.conf`\n*  \
    \ `nginx/` ← this is a folder.\n    *   `nginx.conf`\n    *   `proxy.inc`\n  \
    \  *   `microcache.inc`\n    *   `virtualserver.com`\n    *   `nginx-proxy`\n\
    \    *   `createvhost.sh`\n\nLet's look at each of these custom scripts:\n\n###\
    \ 1. updatehandler.sh\n\nBasically, this script checks if the `/etc/httpd/conf.d/php.conf`\
    \ exist. If it does, then it will rename it to `php.conf.orig` to prevent Apache\
    \ from loading this module and running the PHP interpreter as `mod_php`. This\
    \ will enable `mod_fastcgi` module to run and communicate with the PHP-FPM server.\n\
    \nIt will also make a backup copy of all the files in the `/etc/httpd/conf/` and\
    \ `/etc/httpd/conf.d/` to `/root/config-bak/` for safe-keeping.\n\n![](images/00027.jpg)\n\
    \n### 2. phpfpm.sh\n\nThis script makes use of the conditional statement `If the\
    \ $VIRTUALSERVER_ACTION` provided by Virtualmin. This is a cool feature in Virtualmin\
    \ that allows one to create some really funky scripts by using the various conditional\
    \ statements provided by Virtualmin. Here's the code listing:\n\n![](images/00005.jpg)\n\
    \nThis script (`phpfpm.sh`) uses the `sed` command to create a new PHP-FPM pool\
    \ under the Virtual Server's userID (account owner) in the `/etc/php-fpm.d/` directory.\n\
    \nIt uses the base pool template file (`www.bare`) and replaces ALL occurences\
    \ of `www` with the `userID`.\n\nYou can also tweak the settings in the `www.bare`\
    \ file to suit your server environment.\n\nIf the `$VIRTUALSERVER_ACTION` test\
    \ returns `DELETE_DOMAIN` (i.e. the virtual server was deleted from Virtualmin,\
    \ then this script will remove the PHP-FPM pool file and restart the PHP-FPM service\
    \ to remove that user's process.\n\nNOTE: The additional `if` statement, i.e.\n\
    \n```bash\nif [ -f /root/nginx-proxy ]; then\n  …CODE to create/delete Nginx vhosts…\n\
    fi\n```\n\nThe conditional statement above checks if the file `nginx-proxy` (it's\
    \ a blank/empty file) exist in the `/root` folder. By default, it doesn't, but\
    \ resides in the `ngnix` folder instead. So, if you want the script to automatically\
    \ create the Nginx reverse-proxy vhost files, you need to copy the `nginx-proxy`\
    \ file to `/root` (OR you can just issue this command: `# touch /root/nginx-proxy`)\n\
    \n### 3. www.bare\n\nThis is the php-fpm pool template file that will be used\
    \ by the `/root/phpfpm.sh` script. All occurences of `www` will be replaced with\
    \ the Virtual-server's userID.\n\n![](images/00026.jpg) You can tweak the variables,\
    \ e.g. the `pm.*` to suit your server environment/resources.\n\n### 4. fastcgi.conf\n\
    \nThis is the custom (and much simpler) 3 liner which tells Apache to load the\
    \ `mod_fastcgi` module and create a new PHP handler (called `php-fpm`) to process\
    \ all .php files. We wil use this file to replace the default `fastcgi.conf` that\
    \ came with the `mod_fastcgi` module.\n\n![](images/00015.jpg)\n\nOnce all these\
    \ custom scripts are in place, you're good to go. Create your Virtual Servers\
    \ as you normally would, and Virtualmin will automatically setup the new virtual-server\
    \ to run PHP-FPM under its own userID.\n\nIf you want to do more fancy stuff with\
    \ automating the Virtual Server creattion, refer to this documentation: [http://www.virtualmin.com/documentation/developer/prepost](http://www.virtualmin.com/documentation/developer/prepost)\n\
    \nIt has a few sample scripts to get you started, and below are the list of variables\
    \ which are useful:\n\n**List of Virtualmin's Environment Variables**\n\n![](images/00049.jpg)\n\
    \nCongratulations! You now have a fully automated PHP-FPM powered Virtualmin server.\n\
    \n## Chapter 5: Setup PHP-FPM on existing Websites\n\nThe earlier chapters assumes\
    \ a brand new Virtualmin server that does not have any existing Virtual Servers\
    \ (websites). This allowed us to configure Virtualmin to discard the other PHP\
    \ Sapi and uses PHP-FPM only. If you have existing websites (Virtual Servers)\
    \ in Virtualmin, we need to reconfigure the existing sites first – otherwise the\
    \ sites will stop working.\n\nThis chapter will guide you through the necessary\
    \ steps. I strongly recommend that you do NOT do this on a Production server because\
    \ a small typo can cause havoc.\n\nFirst, back up the existing configuration so\
    \ that if anything goes awry you can restore them.\n\n```bash\n# cd /etc/httpd/conf/\n\
    # mkdir -p /root/config-bak\n# cp -R /etc/httpd/conf/ /root/config-bak/\n# cp\
    \ -R /etc/httpd/conf.d/ /root/config-bak/\n```\n\nOnce you've backed up the configuration,\
    \ let's proceed.\n\n### Step 1: Rename /etc/httpd/conf.d/php.conf\n\nRename `php.conf`\
    \ to `php.conf.orig`. This is to prevent Apache from loading the `mod_php` module.\n\
    \n```bash\n# cd /etc/httpd/conf.d/\n# mv php.conf php.conf.orig\n```\n\n### Step\
    \ 2: Create the individual PHP-FPM pools\n\nMake sure the template pool file (`www.bare`)\
    \ exist in `/etc/php-fpm.d/`. If not, then either create it (from the source listing\
    \ in Chapter 4) or copy it from the downloaded custom script package.\n\n```bash\n\
    # cd /etc/php-fpm.d/\n```\n\nWe are going to use the powerful `sed` utility to\
    \ do the heavy lifting for us. The syntax is:\n\n`sed 's/www/USER/g' www.bare\
    \ > USER.conf`\n\nwhere `USER` is the server account-owner ID.\n\nFor example,\
    \ assuming the UserID for our virtual server is `pixms`, we would issue the following\
    \ command:\n\n```bash\n# sed 's/www/pixms/g' www.bare > pixms.conf\n```\n\n![](images/00019.jpg)\n\
    \nOR, you can use provided script, `createpool.sh` to automatically create them.\n\
    \n![](images/00045.jpg)\n\nSource code for: `createpool.sh`\n\n(note: this scripts\
    \ needs the template file, `www.bare` in the `/etc/php-fpm.d` directory)\n\n###\
    \ Step 4: Final Check\n\n*   Have you edited all the `<VirtualHost>` containers\
    \ in the `/etc/httpd/httpd.conf` file?\n"
  trans: "\n\n下载 `vserver.tgz` 文件并将其解压到 `/root` 目录。你会看到以下文件和目录：\n\n*   `updatehandler.sh`\n\
    *   `phpfpm.sh`\n*   `createpool.sh`\n*   `www.bare`\n*   `fastcgi.conf`\n*  \
    \ `nginx/` ← 这是一个。\n    *   `nginx.conf`\n    *   `proxy.inc`\n    *   `microcache.inc`\n\
    \    *   `virtualserver.com`\n    *   `nginx-proxy`\n    *   `createvhost.sh`\n\
    \n让我们来看下这些自定义脚本：\n\n### 1. updatehandler.sh\n\n基本上，这个脚本检查 `/etc/httpd/conf.d/php.conf`\
    \ 是否存在。如果存在，它将其重命名为 `php.conf.orig`，以防止 Apache 加载该模块并作为 `mod_php`  PHP 解释器。这将允许\
    \ `mod_fastcgi` 模块运行并与 PHP-FPM 服务器通信。\n\n它还会将 `/etc/httpd/conf/` 和 `/etc/httpd/conf.d/`\
    \ 中的所有文件备份到 `/root/config-bak/` 以备后。\n\n![](img/00027.jpg)\n\n### 2. phpfpm.sh\n\
    \n此脚本使用了 Virtualmin 提供的条件语句 `If the $VIRTUALSERVER_ACTION`。这是 Virtualmin 的一个酷功能，允许人们使用\
    \ Virtualmin 提供的各种条件语句创建一些非常独特的脚本。以下是代码列表：\n\n![](img/00005.jpg)\n\n此脚本 (`phpfpm.sh`)\
    \ 使用 `sed` 命令在 `/etc/php-fpm.d/` 目录下为虚拟服务器 userID（账户所有者）创建一个新的 PHP-FPM 池。\n\n\
    它使用基础池模板文件 (`www.bare`)，并将所有 `www` 出现的地方替换为 `userID`。\n\n你还可以调整 `www.bare` 文件中的设置以适应你的服务器环境。\n\
    \n如果 `$VIRTUALSERVER_ACTION` 测试返回 `DELETE_DOMAIN`（即虚拟服务器已从 Virtualmin 中删除），则此脚本将删除\
    \ PHP-FPM 池文件并重启 PHP-FPM 服务以移除该用户的进程。\n\n注意：额外的 `if` 语句，即：\n\n```bash\nif [ -f\
    \ /root/nginx-proxy ]; then\n  …创建/删除 Nginx vhosts 的代码…\nfi\n```\n\n上面的条件语句检查文件\
    \ `nginx-proxy`（它是一个空白/空文件）是否存在于 `/root` 文件夹中。默认情况下，它不存在，而是位于 `ngnix` 文件夹中。因此，如果你想让脚本自动创建\
    \ Nginx 反向代理 vhost 文件，你需要将 `nginx-proxy` 文件复制到 `/root`（或者你也可以直接执行此命令：`# touch\
    \ /root/nginx-proxy`）\n\n### 3. www.bare\n\n这是 `/root/phpfpm.sh` 脚本使用的 php-fpm\
    \ 池模板文件。所有 `www` 出现的地方将被替换为虚拟服务器的 userID。\n\n![](img/00026.jpg) 你可以调整变量，例如 `pm.*`\
    \ 以适应你的服务器环境/资源。\n\n### 4. fastcgi.conf\n\n这是一个自定义的（且简单得多）三行代码，告诉 Apache 加载 `mod_fastcgi`\
    \ 模块并创建一个新的 PHP 处理程序（称为 `php-fpm`）来处理所有 .php 文件。我们将使用此文件来替换 `mod_fastcgi` 模块自带的默认\
    \ `fastcgi.conf`。\n\n![](img/00015.jpg)\n\n一旦这些自定义脚本就绪，你就可以开始了。像往一样创建虚拟服务器，Virtualmin\
    \ 将自动设置新的虚拟服务器以在其自己的 userID 下运行 PHP-FPM。\n\n如果你想在自动化虚拟服务器创建方面进行更多花哨的操作，请参考此文档：[`www.virtualmin.com/documentation/developer/prepost`](http://www.virtualmin.com/documentation/developer/prepost)\n\
    \n它包含了一些示例脚本供你开始，以下是实用的变量列表：\n\n**Virtualmin 环境变量列表**\n\n![](img/00049.jpg)\n\n\
    恭喜！你现在拥有了一个完全自动化的 PHP-FPM 驱动的 Virtualmin 服务器。\n\n## 第 5 章：在现有网站上设置 PHP-FPM\n\n\
    前面的章节假设是一个全新的 Virtualmin 服务器，其中没有任何现有的虚拟服务器（网站）。这允许我们配置 Virtualmin 丢弃其他 PHP Sapi\
    \ 并仅使用 PHP-FPM。如果你在 Virtualmin 中有现有的网站（虚拟服务器），我们需要先重新配置现有网站——否则网站将停止工作。\n\n本章将引导你完成必要的步骤。我强烈建议**不要**在生产服务器上执行此操作，因为一个小错误就会导致灾难。\n\
    \n首先，备份现有配置，以便在出现问题时可以恢复它们。\n\n```bash\n# cd /etc/httpd/conf/\n# mkdir -p /root/config-bak\n\
    # cp -R /etc/httpd/conf/ /root/config-bak/\n# cp -R /etc/httpd/conf.d/ /root/config-bak/\n\
    ```\n\n备份好后，让我们继续。\n\n### 步骤 1：重命名 /etc/httpd/conf.d/php.conf\n\n将 `php.conf`\
    \ 重命名为 `php.conf.orig`。这是为了防止 Apache 加载 `mod_php` 模块。\n\n```bash\n# cd /etc/httpd/conf.d/\n\
    # mv php.conf php.conf.orig\n```\n\n### 步骤 2：创建各个 PHP-FPM 池\n\n确保模板池文件 (`www.bare`)\
    \ 存在于 `/etc/php-fpm.d/`。如果没有，请从第 4 章的源码列表中创建它，或从下载的自定义脚本包中复制。\n\n```bash\n# cd\
    \ /etc/php-fpm.d/\n```\n\n我们将使用强大的 `sed` 工具来完成大部分工作。语法为：\n\n`sed 's/www/USER/g'\
    \ www.bare > USER.conf`\n\n其中 `USER` 是服务器账户所有者 ID。\n\n例如，假设我们的虚拟服务器 UserID 为 `pixms`，我们将执行以下命令：\n\
    \n```bash\n# sed 's/www/pixms/g' www.bare > pixms.conf\n```\n\n![](img/00019.jpg)\n\
    \n或者，可以使用提供的脚本 `createpool.sh` 自动创建它们。\n\n![](img/00045.jpg)\n\n`createpool.sh`\
    \ 的源码（注意：此脚本需要 `/etc/php-fpm.d` 目录下的模板文件 `www.bare`）\n\n### 步骤 4：最终检查\n\n*   你是否编辑了\
    \ `/etc/httpd/httpd.conf` 文件中所有的 `<VirtualHost>` 容器？\n\n"
