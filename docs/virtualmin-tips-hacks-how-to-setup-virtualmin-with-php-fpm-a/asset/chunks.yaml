  trans: "\n\n![](img/00008.jpg)\n\n然后，点击“Install Module”（安装模块）按钮。安装完成后，可以通过以下路径访问\
    \ CSF 防火墙界面：`Webmin > System > ConfigServer Security and Firewall`\n\n第一次点击链接时，系统会提示你更新符号链接（symlink），即：\n\
    \n![](img/00011.jpg)点击提供的链接，你将看到 CSF Web 界面。\n\n![](img/00035.jpg)\n\n你应该做的的第一件事点击“Check\
    \ Server Security”（检查服务器安全）按钮。\n\n这将导致 CSF 防火墙对你的服务器设置运行扫描/安全审计。它将为你提供一个关于哪些需要“修复”或更改以加固你的\
    \ VPS/服务器安全性的摘要。\n\n然后，按照建议进一步加固你的服务器。\n\n**注意**：你可能会看到 CSF 报错，称“portreserve”和“rpcbind”都处于启用（enabled）状态，尽管你已经执行了以下命令：\n\
    \n```bash\n# chkconfig rpcbind off && chkconfig portreserve off\n```\n\n而且 `Webmin\
    \ > Bootup & Shutdown` 菜单显示它们也没有运行。CSF 显示它们为“启用”的原因是因为它们在运行级别（run levels）2, 4,\
    \ 5 中仍然启用。要在所有运行级别上完全关闭它们，请运行此命令：\n\n```bash\n# chkconfig --level 2345 portreserve\
    \ off\n# chkconfig --level 2345 rpcbind off\n```\n\n也考虑关闭以下服务：\n\n```bash\n# service\
    \ xinetd stop && chkconfig --level 2345 off\n# service saslauthd stop && chkconfig\
    \ --level 2345 saslauthd off\n```\n\n# 安装 LMD\n\nLinux Malware Detect (LMD) 是一种\
    \ Linux 恶意软件扫描器。它是针对共享托管环境中面临的威胁设计的，并根据 GNU GPLv2 许可证发布。\n\n（LMD 也广称为“Maldet”\
    \ - Malware Detect）。\n\n它利用网络边缘入侵检测系统的威胁数据来提取正在用于攻击的恶意软件，并生成用于检测签名。此外，威胁数据还来源于通过\
    \ LMD 检查功能的用户提交以及恶意软件社区资源。\n\nLMD 使用的签名是 MD5 文件哈希和 HEX 模式匹配，它们也可以很容易导出到任何数量的检测工具，如\
    \ `ClamAV`。\n\n下载并安装最新版本的 LMD：\n\n![](img/00030.jpg)\n\n这将“maldet”脚本安装在 `/usr/local/maldetect`\
    \ 并创建一个可执行的符号链接。安装摘要如下：\n\n![](img/00038.jpg)\n\n将脚本更新到最新版本：\n\n```bash\n# maldet\
    \ --update-ver\n```\n\n更新最新的恶意软件数据库：\n\n```bash\n# maldet --update\n```\n\nMaldet\
    \ 配置文件位于：`/usr/local/maldetect/conf.maldet`\n\n编辑此文件并进行以下更改：\n\n![](img/00029.jpg)\n\
    \n你可以让其余配置保持默认值。示例用法：\n\n扫描目录的语法为：`maldet -a <path_to_directory>`\n\n例如：\n\n```bash\n\
    # maldet -a /home/USERID/public_html\n```\n\n它将报告已扫描的文件数，以及“命中”（hits）数量（如果发现恶意软件）和清理的恶意软件数量（如果有）。\n\
    \n![](img/00028.jpg)\n\n要查看生成的扫描报告，输入：\n\n```bash\n# maldet --report <SCAN_ID>\n\
    ```\n\n恢复被隔离的文件：\n\n```bash\n# maldet --restore /usr/local/maldetect/quarantine/<FILENAME>\n\
    ```\n\n### 创建每日 cron 任务扫描你的文件：\n\n当你第一次安装 LMD 时，安装脚本会在 `/etc/cron.daily/maldet`\
    \ 创建一个每日 cron 任务。\n\n支持/内置了以下控制面板的文件路径：\n\n* `Cpanel`\n* `Plesk (PSA)`\n* `Ensim`\n\
    * `DirectAdmin`\n* `Default Apache DocRoot (/var/www/html)`\n\nVirtualmin 中设置的文件路径与\
    \ Cpanel 类似 – 因此你不需要对脚本进行任何更改。\n\n**注意**：你可能已经注意到 `maldet` 使用问号（`?`）而不是常用的星号（`*`）来表示通配符。例如，如果你想扫描\
    \ `/home/` 目录下的所有用户账户，将使用：\n\n```bash\n# maldet -a /home/?/public_html\n```\n\n\
    注意：`?` 表示通配符特性，而不是典型的 `*`\n\n# 第 9 章：接下来该去哪里？\n\n在这本短书中，我们涵盖了大量内容。你在这里看到的各种代码段是许多小时研究、测试和调试的结果。\n\
    \n虽然实现某个目标有许多方法，但我尽力遵循古老的 UNIX 原则“K.I.S.S”（Keep It Super Simple，保持极度简单），并为你提供最简单、最易的方法来实现在\
    \ Virtualmin 中设置自动化 PHP-FPM 服务器的目标。\n\n但尽管如此，请记住技术始终在变化，当你阅读到这里时，某些内容可能已经发生了。\n\
    \n为了跟进 Virtualmin 的最新变化和更新 – 请随时访问官方网站 – [`virtualmin.com`](http://virtualmin.com/)。\n\
    \n### 脚本/软件下载。\n\n你可以在这里下载源代码和脚本：[`ilovevirtualmin.com/book-2`](http://ilovevirtualmin.com/book-2)\
    \ \n\n你需要输入此“访问代码”：`VMPHP2014` 来访问下载文件。\n\n此页面还将包含所有相关的更新和书中发现勘误。\n\n### 这本书对你有益处吗？\n\
    \n如果你从这本书中受益，请考虑在 Amazon 上留个评论，以帮助其他正在 Virtualmin 中寻找类似类 PHP-FPM 解决方案的人。你可以点击下方的链接直接进入书籍：\n\
    \n[`ilovevirtualmin.com/book-2`](http://ilovevirtualmin.com/book-2)\n\n如果书中有任何不足之处，或者你认为我应该涵盖更多内容，请告诉我，这将帮助我在下一版中改进这本书。\n\
    \n![](img/00500.jpg)\n\n你可以通过以下邮箱联系我：`adrian.gmail.com`\n\n### “实用指南”系列中的其他书籍\n\
    \n1. `Webmin & Virtualmin: Cpanel 的最佳开源替代方案` – 这是一本适合不熟悉 Webmin & Virtualmin 新手的书籍。\n\
    \n![](img/00001.jpg)\n\n例如，在 Cpanel 中，“addon domain”（附加域名）术在 Virtualmin 中被称为“Sub-server”（子服务器）。这本书将帮助你快速上手。\n\
    \n2. `Apache, PHP-FPM & Nginx: 如何构建安全、快速且强大的 Web 服务器`\n\n这是我“实用指南”系列中的第 3 本书 –\
    \ 计划于 2014 年 11 月 30 日出版。这本书将引导你在原生的 CentOS 服务器上设置 PHP-FPM – 如何从默认的 PHP 5.3.3\
    \ 升级到当前的稳定版 PHP 5.4.x，如何为每个虚拟服务器设置自动化 PHP-FPM 池，以及如何加固服务器上的 PHP-FPM，以便用户无法利用它“窥探”并查看敏感的系统文件，如\
    \ `/etc/passwd`！\n\n"
