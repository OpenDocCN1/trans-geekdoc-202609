    But when we use the `mod_fastcgi` module (installed from the RepoForge repository),
    Apache hands over the control of the “Process Manager” to the PHP-FPM engine which
    has its own “PM”.


    PHP-FPM is actually “FastCGI” with its own built-in “Process Manager” (PM).


    One thing to take note of is that most FastCGI applications/processes run in parallel
    in daemon (server) mode alongside Apache. These FastCGI applications are managed
