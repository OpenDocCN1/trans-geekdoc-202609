    # 第 7 章：设置 Nginx


    本章的目标是运行 Nginx 作为主服务器。


    在开始之前关于性能的说明。


    Nginx 作为反向代理的作用通过分担 Apache 的负载来提升网站性能。我个人没有检测到使用 Nginx 作为反向代理有显著性能——但这可能是因为我的网站没有数千访问者。


