    # Chapter 6: Apache Handlers 101 / PHP-FPM


    This is an “informational” chapter – to give you some theory and background about
    Apache Handlers and PHP-FPM. It is not required reading, but recommended so that
    you''ll have a better understand of what is an Apache Handler and what is PHP-FPM?


    In the early (or was it late) 90s, a web-server can only process and display HTML
    and images. It cannot access databases, and it can do any of those fancy ''dynamic''
    stuff that we see today.


    To overcome the problem, the programmers came up with “CGI” protocol – a way for
    web-servers to communicate with other ''programs'' (or applications) written in
    some other programming language such as Perl, C/C++,


    The developers of the Apache webserver then came up with the concept of “Handlers”
    - basically a module/method that tells Apache how to communicate with external
    programs (e.g. Perl script, PHP scripts, etc) when it encounters a specific file
    type.


    For example, if a web-visitor requested for a `*.cgi` file, then an appropriate
    handler will instruc Apache to invoke the CGI script/parser to process that file.
    If the requested file is a `*.php` file, then the appropriate PHP handler will
    instruct Apache how to process the `*.php` file.


    So, in a nutshell, that is what an Apache “Handler” is (in layman''s terms) –
    it instructs Apache how to handle/process different file types.


    For PHP files, there are essentially 3 different type of “Handlers”:


    *   Load and run the entire PHP engine (interpreter) within Apache itself. This
    is known as `mod_php` or “Apache 2.0 Handler”. This is the default method.

    *   The “CGI” handler – Apache will invoke the `/usr/bin/php-cgi` script to process
    the PHP file and passes all the environment variables to the `cgi` program. The
    `cgi` program will process the requests and then pass the results back to Apache.
    Once that is done, the `cgi` process is killed.

    *   The “Fast-CGI” handler – this is an enhancement to the CGI protocol where
    the `fast-cgi` process is not killed after it has completed its job. It can potentially
    “live forever” and is usually run as a daemon process alongside Apache. Also,
    the communication between Apache and the FastCGI application is via the IPC (Inter
    Process Communications) such as the Unix socket or TCP socket.


    In the first case, i.e. “mod_php” - each instance of the child apache process
    has the entire PHP stack/engine within itself. This cause un-necessary bloat to
    the Apache processes because not every web requests are going to PHP scripts,
    some web requests are just requesting for images, css, javascripts. Hence, running
    “mod_php” causes in-efficient memory usage – and can be an issue if a heavy traffic
    website has lots of graphics.


    Usually, `mod_suexec` and `mod_suPHP` will be used together with `mod_php` to
    enable Apache to run the PHP scripts under the same userID as the Virtual Server
    to provide extra security and account isolation, i.e. the scripts in one virtual
    server cannot access the files on another virtual server.


    The CGI handler is no longer used in modern applications because the action of
    spawning/killing CGI processes is very CPU intensive and inefficient.


    The FastCGI handler is preferred. It allows PHP scripts to be executed by the
    PHP engine/parser outside of the Apache web server, i.e. each request is passed
    from the Apache web server to the FastCGI process via a communication socket (IPC).


    The advantages of FastCGI is that the processes are ''persistent'' - Multiple
    persistent processes can configured to run in the background to handle incoming
    PHP requests. This avoids the costly CPU intensive operation of spawning/terminating
    processes in the ''CGI'' method.


    So, where does PHP-FPM comes into the picture? PHP-FPM is actually “FastCGI” with
    its own built-in “Process Manager” (PM).


    One thing to take note of is that most FastCGI applications/processes run in parallel
    in daemon (server) mode alongside Apache. These FastCGI applications are managed
    by a “PM” (Process Manager).


    In Apache, when we used the `fastcgid` module (the default setting in Virtualmin),
    Apache uses its own built-in “PM” to manage the FastCGI processes.


    But when we use the `mod_fastcgi` module (installed from the RepoForge repository),
    Apache hands over the control of the “Process Manager” to the PHP-FPM engine which
    has its own “PM”.


    PHP-FPM is actually “FastCGI” with its own built-in “Process Manager” (PM).


    One thing to take note of is that most FastCGI applications/processes run in parallel
    in daemon (server) mode alongside Apache. These FastCGI applications are managed
