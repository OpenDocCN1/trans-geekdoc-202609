    The script `phpfpm.sh` checks if this file (`nginx-proxy`) exist in `/root` –
    if yes, then it will proceed to create the necessary Nginx reverse proxy configuration
    (vhosts) files when you create a new Virtual Server from Virtualmin. Without this
    file (`nginx-proxy`), the `phpfpm.sh` script will NOT create the nginx vhost configuration
    file.


    ```

    # cp nginx-proxy /root/

    ```


    Now let''s login to Virtualmin and make some adjustment the following settings:


    `Webmin > Servers > Apache Webserver`


    and click on the “Global Configuration” tab:


    ![](images/00002.jpg)


    Then click on the “Networking and Addresses” icon


    ![](images/00044.jpg)


    Change the default port “80” to “8080”, like so:


    ![](images/00021.jpg)


    Now, as before, we need to create a new Server Template in Virtualmin to use port
    “8080” instead of port 80.


    `Virtualmin > System Settings > Server Templates`


    You can clone one of the existing templates (e.g. the one we had created earlier
    for creating PHP-FPM).


    Select the “Apache website” from the “Edit template section” drop-down list as
    before.


    ![](images/00025.jpg)Scroll down the page, and look for “Port Number for Virtual
    Hosts” and change it to “8080” as shown below:


    ![](images/00012.jpg)


    ### VERY Important Final Step!


    We need to modify the “Default Settings” template and change the port to 8080
    too!


    Click on the `Virtualmin > System Settings > Server Templates` again.


    And click on the “Default Settings” template.


    ![](images/00016.jpg)


    As before, select the “Apache Website” section from the drop-down list. Scroll
    down the page to the Port section and change the default port 80 to “8080”


    ![](images/00012.jpg)


    Even though we won''t be using this “Default Template” when creating our Nginx-reverse-Proxy
    powered site, we still have to do this, otherwise, the default port 80 will be
    enforced in the `httpd.conf` file and Nginx will fail to start.


    Once you''ve done this, we''re ready to create our first Nginx-Reverse-Proxy powered
    site.


    **VERY IMPORTANT NOTE:** If you have existing websites (virtual servers) running
    on port 80 via Apache, do NOT restart Apache or Nginx OR create a new virtual
    server. If you do, then all your existing websites will fail to load.


    You need to modify/update the Apache config file `/etc/httpd/conf/httpd.conf`
    and replace port 80 with “8080”, for example:


    Original: `<VirtualHost X.X.X.X:80>`


    Change to: `<VirtualHost X.X.X.X:8080>`


    where `X.X.X.X` is the IP address of your own server.


    Then, you need to create EACH of the nginx vhosts files for existing website.
    In the `/root/nginx/` directory, there is standard template vhost file - `virtualserver.com`
    which you can use reference.


    We will use the provided script - `createvhost.sh` to create the required vhosts,
    i.e. just need to run the script, enter the `userID` (account owner of this virtual
    server) and the domain name (e.g. pixms.com). It will prompt you for the server
    IP address if you did not define it in the script (replace `X.X.X.X` with your
    server IP and uncomment it)


    ![](images/00032.jpg)


    The script takes the default vhost template (`virtualserver.com`) and replace
    the appropriate tokens with the input you provide for the new Nginx vhosts.


    Here''s the source code of `createvhost.sh`:


    ![](images/00010.jpg)


    You can also manually edit the file if you want to see how it works. Below is
    the snippet of the file. You need to change the following for EACH virtualhost:


    `IP_ADDRESS`: The actual IP address of your server

    `NGINX`: The domain-name (without ''www''). E.g.: `ilovevirtual.com`

    `USER`: The `userID` for this virtual server (account-owner)


    ![](images/00014.jpg)


    ### Chapter 8: Securing your Server (Bonus)


    Server Security is a huge topic, and it is simply not possible to cover everything
    in one chapter or even one book. In this chapter, we will just cover 4 essential
    steps which I believe every server administrator should take “lock down” the server
    regardless of whether the server is running Virtualmin or any other control-panel.


    These 4 steps are:

    * Run only the services required, stop all the other services

    * Secure `/tmp`

    * Install a Firewall

    * Install LMD (Linux Malware Detect)


    #### Essential Services Only


    Every service that we run on our server listens to a `port` - for example, the
    Apache webserver listens to port 80, SSH server listens at port 22, Mailserver
    at port 25, etc.


    Think of these `ports` as “doors” on a fortress wall – the more doors you have
    on the fortress wall, the more targets hackers would have to practise on. To minimize
    this, we should shut down any services we intend not use on our server. For example,
    if we don''t intend to provide the mailing list service or the DAV login service
    to our users, then we should turn them off.


    We can do this from the command line using the `chkconfig` command or from the
    Webmin''s Bootup and Shutdown interface, i.e. `Webmin > System > Bootup and Shutdown`


    ![](images/00013.jpg)


    The default setup in Virtualmin is quite sane, but the following services can
    be safely turned off as well:

    * `xinetd`

    * `splash-manager`

    * `mailman` (if you don''t intend to provide mailing service)


    #### Securing /tmp


    In most cases, the `/tmp` directory in a freshly installed/commissioned Linux
    server is NOT secured, i.e. it allows anyone (or script) to upload files to the
    `/tmp` directory and execute them. Run this simple test to find out whether your
    `/tmp/` directory has the executable bit set:


    Create a simple ''hello world'' Shell script in the `/tmp` directory:


    ```bash

    #!/bin/bash

    echo "hello world"

    ```


    Then, `chmod +x` the script and try to run it:


    ```bash

    chmod 755 hello.sh

    ./hello.sh

    ```


    If you see “hello world” printed on the screen, then we need to fix it. Repeat
    this for the `/var/tmp` directory as well. To do this, we just need to edit the
    `/etc/fstab` file and add these 2 lines:


    ![](images/00033.jpg)


    **NOTE:** The entries in `/etc/fstab` may be different – depending on your Operating
    System and if your server is a VPS, your hosting company may provide a different
    `fstab` layout. If in doubt, please check with your hosting provider.


    Once you''ve done editing `/etc/fstab`, you can either reboot your server or issue
    this command to remount all your partitions for this to take effect:


    ```bash

    mount -a

    ```


    Note: The command above should cause all filesystems mentioned in `/etc/fstab`
    to be remounted, except the partitions with the `noauto` option, but on certain
    VPSes, it may not work. Try running the `hello.sh` file again to see if it runs.
    If yes, the best option is to reboot your VPS.


    #### Installing Firewall


    Although Virtualmin comes with its own interface to help you manage the `iptables`
    rules and chains, it can be quite cryptic and daunting, especially if you are
    new to it. (The Virtualmin Firewall Interface can be found at: `Webmin > Networking
    > Firewall`)


    An easier and more intuitive alternative is the CSF firewall from [www.configserver.com](http://www.configserver.com/)


    Login to your server via SSH and install CSF firewall from the command line:


    ![](images/00042.jpg)


    Edit the csf config file, e.g. `vi etc/csf/csf.conf`. Look for this line (near
    the top of the file):


    `# lfd will not start while this is enabled`

    `TESTING = "0"` ← the default is “1”. Change it to “0” to enable CSF firewall.


    Then, look for this section: “IPv4 Port Settings” and add port “10000” and “20000”
    to the `TCP_IN` and `TCP_OUT` line. See the underlined (in red) below.


    ![](images/00020.jpg)


    **NOTE:** If you''ve changed the Webmin/Virtualmin port to “11000”, then you need
    to update the ports here as well.


    ```bash

    service csf start

    ```


    Now, let''s install the CSF plugin for Webmin:


    Point your browser to: `Webmin > Webmin Configuration > Webmin Modules`


    Select Install “From local file” and enter this path into the field: `/usr/local/csf/csfwebmin.tgz`

