    Nginx is a rising star where web-servers are concerned. Nearly 40% of the world''s
    busiest website runs a highly tuned Nginx to serve thousands of visitors daily.
    It is fast, stable and it does not use as much resources as the Apache server.
    Virtualmin has built-in support to run the Nginx webserver insteadl of Apache
    – but the support and functionality for Nginx is rather limited compared to Apache.
    Furthermore, if you want to run the Nginx webserver, you have to disable Apache.


    We want to run both – Apache as the main webserver, and Nginx as the “reverse-proxy”
    to handle all the static pages and files. This is not supported in`Virtualmin`.
    The information in this book will enable you to have the best of both worlds –
    the power and flexiblity of the Apache webserver, and the speed and agility of
    Nginx server as the “reverse proxy” running on the same Virtualmin powered server.


    # Why this book?


    There are many tutorials on the internet that shows one how to do this, but unfortunately,
    many of them are outdated and contains errors. Furthermore, the process is “Manual”
    - i.e. each time the webmaster create a new virtual server (hosting account),
    the webmaster has to manually edit multiple configuration files – the `php-fpm
    pools`, the Apache `/etc/httpd/conf/httpd.conf` file, etc.


    I wrote this book because I''m a great fan of automation. I want `Virtualmin`
    to automate the entire process – i.e. when I create a new virtual server (hosting
    account), I want everything to be automatically setup – the `php-fpm pools` running
    under its own `UserID` (virtual server ID) and the appropriate Apache directives
    automatically appended to the `/etc/httpd/conf/httpd.conf` file.


    This book is birthed after many days of searching the Internet for relevant information
    – from various developer forums, tech blogs and the official `Virtualmin` documentation,
    and putting all these bits and pieces together in this cohesive book. The custom
    config files provided and custom shell scripts are the results of many man-hours.


    # Assumption about the Reader


    The reader is expected to be familiar with the `Virtualmin` interface and the
    various menus and settings. The following skills are expected from the reader
    as well:


    * Ability to use one of the built-in Unix/Linux editors such as `vi`, `joe` or
    `nano`.

    * Ability to run commands from the command line/shell.


    # Overview


    Before we start, please take note that steps outlined in Chapter 1 – 5 are meant
    for a brand new server or VPS. In other words, there are no existing websites
    or Virtual Servers configured in `Virtualmin`. This is important because we need
    to do some preparatory work to configure `Virtualmin` before creating our first
    Virtual Server (website).


    **NOTE:** If you have existing websites (virtual servers), you can still follow
    along but do NOT create any new virtual server until you''ve read Chapter 5.


    Otherwise, your existing sites will ''stop working'' because it could not find
    the correct Apache handler to process the php files.


    **FAIR WARNING:** There is always a possibility that your existing sites may break
    if you decide to implement the steps outlined in this guide on your production
    server. This is because every server environment and setup is different. There
    are no identical setup – unless you have set them up exactly the same way from
    scratch at the same time.


    Murphy''s Law tends to strike when one least expect it. Because of this, I would
    strongly recommend that you try this on a development server (you can easily get
    cheap VPS for $5 - $10/mth to test).


    Once you''re confident that it will work in your environment, then you can apply
    it to your production server. Let''s dive in!


    # Chapter 1: Installing the Software


    If you have just installed `Virtualmin` on a stock server or VPS, you''re probably
    running CentOS 6 at the time of this writing (October 2014). CentOS 7 has just
    been released recently, and `Virtualmin` support for it is not as matured or stable
    compared to CentOS 6.


    CentOS 6.5 (and 6.6) ships with the following default software:


    * `PHP 5.3.3` (this version of `PHP` has reached its end of life and is no longer
    supported by the PHP team)

    * `MySQL 5.1.73` (a very old version of MySQL server. Current stable version is
    `MySQL 5.5`)

    * `Apache 2.2.15`


    For the purpose of this book, we will be updating `PHP` to the latest `5.4` and
    upgrading `MySQL` to the current `5.5` from `EPEL`. We will also use `fastcgi`
    which is located in the `REMI` repository.


    ## EPEL


    EPEL (Extra Packages for Enterprise Linux)


    `EPEL` is a Special Interest Group that creates, maintains, and manages a high
    quality set of additional packages for Enterprise Linux such as `RHEL`, `CentOS`,
    `Scientific Linux`, and `Oracle Enterprise Linux`. It uses much of the same infrastructure
    as Fedora, including buildsystem, bugzilla instance, updates manager, etc.


    Download and Install the `EPEL` repository:


    ```bash

    wget http://dl.fedoraproject.org/pub/epel/i386/epel-release-6-8.noarch

    rpm -ivh epel-release-6-8.noarch

    ```


    (Note: If you''re using a different CentOS distro, e.g. 64-bit instead of 32-bit,
    please visit the `EPEL` page and download the appropriate rpm for your machine.)


    To check for the latest news/updates or software versions, please visit: **REMI:**


    Ref: `http://blog.famillecollet.com/pages/Config-en`


    The `REMI` software repository a yum repo maintained by a French programmer -
    Remi Collet. It usually has the latest version of the software in the core CentOS
    and Red Hat repositories, and it uses the same package names as in the official
    repositories.


    For example, the official CentOS repository uses the name `php-cli` (the command
    line version of `PHP` and is based on `PHP 5.3.3`). IF you install `php-cli` from
    the `REMI` repository, it will automatically upgrade the `php-cli` to the latest
    `PHP 5.4.34`.


    Because of this (packages using the same naming convention as the official repos),
    the `REMI` repository is “disabled” by default so that you don''t accidently “upgrade”
    a system software without realizing it. You''ll have to explicity ''enable'' this
    repo if you want to install a particular software from this repo. The Remi repository
    also depends on the `EPEL` repository which is why we have to install the `EPEL`
    repo first.


    Download and Install the `REMI` repository:


    ```bash

    wget http://rpms.famillecollet.com/enterprise/remi-release-6.rpm

    rpm -ivh remi-release-6.rpm

    ```


    RPMFORGE: `http://repoforge.org/use/`

    '
  trans: '


    Nginx 是 Web 服务器领域的一颗新星。全球最繁忙的近 40% 网站运行着高度调优的 Nginx，每天服务数千名访问者。它快速、稳定，且使用的资源没有像
    Apache 服务器那样那么多。Virtualmin 内置了运行 Nginx Web 服务器而非 Apache 的支持，但与 Apache 相比，Nginx
    的支持和功能相当有限。此外，如果你想运行 Nginx Web 服务器，必须禁用 Apache。


    我们希望同时运行两者——将 Apache 作为主 Web 服务器，并将 Nginx 作为“反向代理”来处理所有的静态页面和文件。这在 `Virtualmin`
    中是不支持的。书中的信息将使你兼得两者的优点：Apache Web 服务器的力量和灵活性，以及运行在同一 Virtualmin 驱动服务器上的作为“反向代理”的
    Nginx 服务器的速度敏捷。


    # 为什么要写这本书？


    互联网上有许多教程教你如何这样做，但遗憾的是，其中许多已经过时且包含错误。此外，这个过程是“手动”的——也就是说每当网站管理员创建一个新的虚拟服务器（托管账户）时，管理员都必须手动编辑多个配置文件——`php-fpm
    pools`、Apache 的 `/etc/httpd/conf/httpd.conf` 文件等。


    我写这本书是因为我是自动化的忠实粉丝。我希望 `Virtualmin` 能实现整个过程自动化——也就是说当我创建一个新的虚拟服务器（托管账户）时，我希望一切都能自动设置——`php-fpm
    pools` 运行在其自己的 `UserID`（虚拟服务器 ID）下，并将相应的 Apache 指令自动追加到 `/etc/httpd/conf/httpd.conf`
    文件中。


    这本书的诞生是在互联网上搜索了许多关于相关信息之后——来自各种开发者论坛、技术博客和官方 `Virtualmin` 文档，并将所有这些碎片汇聚成这本逻辑连贯的书。提供的自定义配置文件和自定义
    Shell 脚本是许多小时工作后的成果。


    # 对读者的假设


    预计读者熟悉 `Virtualmin` 界面以及各种菜单和设置。同样预计读者应具备以下技能：


    * 能够使用内置的 Unix/Linux 编辑器，如 `vi`、`joe` 或 `nano`。

    * 能够从命令行/shell 运行命令。


    # 概述


    在我们开始之前，请注意第 1 章到第 5 章概述的步骤是为全新的服务器或 VPS 准备的。也就是说，在 `Virtualmin` 中没有配置现有的网站或虚拟服务器。这很重要，因为在创建第一个虚拟服务器（网站）之前，我们需要进行一些准备工作来配置
    `Virtualmin`。


    **注意：** 如果你有现有的网站（虚拟服务器），你仍然可以跟随操作，但在阅读第 5 章之前，**不要**创建任何新的虚拟服务器。


    否则，你的现有网站将“停止工作”，因为它们找不到正确的 Apache 处理程序来处理 php 文件。


    **郑警告：** 如果你决定在生产服务器上实施本指南中概述的步骤，你的现有网站完全可能会故障。这是因为每个服务器环境和设置都是不同的。没有完全相同的设置——除非你从零开始同时以完全相同的方式设置了它们。


    墨菲定律往往在人们最没意料的时候降临。正因如此，我强烈建议你在开发服务器上尝试（你可以轻松获取一个每月 5 到 10 美元的廉价 VPS 进行测试）。


    一旦你确认它在你的环境中可以运行，就可以将其应用到生产服务器上。让我们开始吧！


    # 第 1 章：安装软件


    如果你刚刚在原生服务器或 VPS 上安装了 `Virtualmin`，在本文写作时你可能运行的是 CentOS 6（2014 年 10 月）。CentOS
    7 刚刚发布，`Virtualmin` 对它的支持还没有 CentOS 6 那么成熟或稳定。


    CentOS 6.5（以及 6.6）附带以下默认软件：


    * `PHP 5.3.3`（此版本的 `PHP` 已达到寿命结束，PHP 团队不再支持它）

    * `MySQL 5.1.73`（一个非常老的 MySQL 服务器版本。当前的稳定版本是 `MySQL 5.5`）

    * `Apache 2.2.15`


    为了本书，我们将 `PHP` 更新到最新的 `5.4`，并从 `EPEL` 将 `MySQL` 升级到当前的 `5.5`。我们还将使用位于 `REMI` 仓库的
    `fastcgi`。


    ## EPEL


    EPEL (Enterprise Linux 额外软件包)


    `EPEL` 是一个特别小组，负责创建、维护和管理适用于企业 Linux（如 `RHEL`、`CentOS`、`Scientific Linux` 和 `Oracle
    Enterprise Linux`）的高质量附加软件包。它使用了与 Fedora 许多相同的基础设施，包括构建系统、bugzilla 实例等。


    下载并安装 `EPEL` 仓库：


    ```bash

    wget http://dl.fedoraproject.org/pub/epel/i386/epel-release-6.noarch

    rpm -ivh epel-release-6.noarch

    ```


    （注意：如果你使用的是不同的 CentOS 版本，例如 64 位而不是 32 位，请访问 `EPEL` 页面并下载适用于你机器的 rpm。）


    要查看最新消息/更新或软件版本，请访问：**REMI:**


    参考：http://blog.famillecollet.com/pages/Config-en


    REMI 仓库是由法国程序员 Remi Collet 维护的 yum 仓库。它通常包含 CentOS 和 Red Hat 仓库中最新版本的软件，且包名与官方仓库相同。


    例如，官方 CentOS 仓库使用 `php-cli`（`PHP` 的命令行版本，基于 `PHP 5.3.3`）。如果你从 `REMI` 仓库安装 `php-cli`，它将自动将
    `php-cli` 升级到最新的 `PHP 5.4.34`。


    由于由于（包与官方仓库使用相同的命名规则），`REMI` 仓库默认是“禁用”的，以免让你在不知情的情况下“升级”系统软件。如果你想从该仓库安装特定的软件，必须显式地“启用”该仓库。Remi
    仓库还依赖 `EPEL` 仓库，这就是为什么我们必须先安装 `EPEL` 仓库。


    下载并安装 `REMI` 仓库：


    ```bash

    wget http://rpms.famillecollet.com/enterprise/remi-release-6.rpm

    rpm -ivh remi-release-6.rpm

    ```


    RPMFORGE: http://repoforge.org/use/


    '
