- raw: "RPMFORGE is another popular softwaare repository trusted by many open-source\
    \ enthusiast. It is now known as “RepoForge”, a project that maintains various\
    \ RPM packages for Red Hat Enterprise Linux (RHEL), CentOS and Scientific Linux.\
    \ It provides a set of repositories compatible with various RHEL-derived distributions.\
    \  \n\nDownload & Install RepoForge:\n\n`# wget `[`http://pkgs.repoforge.org/rpmforge-release/rpmforge-release-0.5.3-1.el6.rf.i686.rpm`](http://pkgs.repoforge.org/rpmforge-release/rpmforge-release-0.5.3-1.el6.rf.i686.rpm)` `\n\
    \nIf you're using a different CentOS distro, please visit [http://repoforge.org/use](http://repoforge.org/use)\
    \ and select the appropriate version for your server.  \n\nNOTE:  Do not install\
    \ it  YET – because later, when we run the 'yum update' command to update the\
    \ installed repositories, the default “AWStats” package will be replaced by the\
    \ package in RepoForge repository which will cause the AWStats reporting to break.\
    \ We'll address this issue later. \n\n` `\n\nNow it's time to update the software\
    \ repositories (EPEL & REMI)\n\nUpdate the EPEL repository.\n\nThe command below\
    \ will update the latest packages from the EPEL repository\n\n`# yum update`\n\
    \n![](images/00017.jpg)Type “y” and hit the enter key.\n\nInstall/Upgrade MySQL\
    \ 5.5 and PHP 5.4\n\nThe command below (with the flag `--enablerepo=remi`) will\
    \ activate the REMI repo and tells the yum package manager to install/upgrade\
    \ the software from REMI:\n\n`# yum --enablerepo=remi upgrade mysql`\n\n\\*Note:\
    \ the command above will also upgrade PHP 5.3 to PHP 5.4 because the yum utility\
    \ will ensure all the interlinked software dependencies are met (e.g. one of which\
    \ was the php-mysql which was linked to MySQL 5.1 – so when we upgrade MySQL to\
    \ 5.5, the yum utility will also upgrade the corresponding “php-mysql” packages\
    \ to PHP 5.40).\n\n![](images/00006.jpg)When prompted, type  'y' and press the\
    \ enter key.\n\nNote:  The 4th column tells you which software repository the\
    \ software package is being installed from.  Once the software upgrade has been\
    \ completed, run this command to update some of the essential tables in MySQL:\
    \  \n\n`# mysql_upgrade `\n\n` `\n\nInstall PHP-FPM \n\nNow that all the system\
    \ software is up to date, let's install PHP-FPM from the REMI repo\n\n`# yum --enablerepo=remi\
    \ install php-fpm`\n\nThis will create the directory:  /etc/php-fpm.d/ with the\
    \ default “www.conf” pool file. We will need to create a new 'pool template' called\
    \ “www.bare” in this directory later.\n\n![](images/00022.jpg)`  `\n\nOk, now\
    \ we will install the “RepoForge” repository so that we can install the “mod\\\
    _fastcgi” package.  This “mod\\_fastcgi” required for Apache to communicate with\
    \ the PHP-FPM server.\n\n`# rpm -ivh rpmforge-release-0.5.3-1.el6.rf.i686.rpm`\n\
    \n`# yum install mod_fastcgi`\n\n` `\n\n![](images/00039.jpg) \n\nThe the command\
    \ above will install a file called “fastcgi.conf” in the /etc/httpd/conf.d/ directory.\
    \  Edit that file with your favorite editor and replace ALL the content in that\
    \ file with just these 3 lines of code:\n\n(note: the source code for the 3 lines\
    \ above is found in the “fastcgi.conf” file)\n\nChapter 2: Virtualmin Configuration\n\
    \nOk, now that all the necessary software has been updated and installed, let's\
    \ login to Virtualmin now.  \n\nNote: if this is the first time you are logging\
    \ into Virtualmin, it will prompt you to go through  series of “Post Installation\
    \ Steps” where it will fine-tune some of the server settings (e.g. optimizing\
    \ the MySQL /etc/my.cnf for you based on the memory setting you choose and assigning\
    \ a root password for MySQL).\n\nOnce the post-installation steps have been completed,\
    \ proceed to Virtualmin's Configuration page.  Click on the the Virtualmin menu,\
    \ and click:  “System Settings” > Virtualmin Configurations”\n\n![](images/00023.jpg)You\
    \ will then see the following page.\n\n![](images/00041.jpg) \n\nSelect “Actions\
    \ upon server and user creation” from the drop-down list:\n\nYou will see the\
    \ following:\n\n![](images/00037.jpg)\n\nThe 2 important fields to note are the:\n\
    \n*   > Command to run before making changes to a server. `/root/updatehandler.sh` \
    \ \n\n*   > Command to run after making changes to a server.  `/root/phpfpm.sh` \
    \ \n\nThis is the “key” to making all the PHP-FPM automation work.  Basically,\
    \ this feature allows you to run custom scripts prior to making changes to a server\
    \ (e.g. before a Virtual Server is created), as well as run another custom script\
    \ AFTER making changes to a server (after Virtualmin has completed setting up\
    \ a new virtual server).  \n\nThis applies to “deleting” a virtual server as well.\
    \  In the screenshot above, we have entered 2 scripts:\n\n*   > “updatehandler.sh”\
    \ is a simple shell script to check if the default “php.conf' file exist in /etc/httpd/conf.d/\
    \ - and if it does, to rename it to 'php.conf.orig'. This is to prevent Apache\
    \ from loading the “mod\\_php” module which takes priority over the “mod\\_fastcgi”\
    \ - in other words, Apache will run PHP as “Apache 2.0 Handler” instead of talking\
    \ to PHP-FPM. \n\n*   > “phpfpm.sh” is the main script that creates new PHP-FPM\
    \ pool under the Virtual Server's ID and restart the PHP-FPM service in the background.\
    \ It is also remove this PHP-FPM pool if the Virtual server is destroyed. \n\n\
    Chapter 3: Virtualmin “Server Template”\n\nNow, let's create a new Server Template\
    \ that includes the required Apache directives to communicate with the PHP-FPM\
    \ service via the “mod\\_fastcgi” module.\n\nIn Virtualmin, click on the “System\
    \ Settings” > Server Templates”\n\n![](images/00036.jpg)If you haven't created\
    \ a Server Template yet, click on the “Create a Template from Default Settings”.\
    \  \n\n![](images/00046.jpg) \n\nGive it a name, e.g. “Server-X1” or “PHP-FPM”\
    \ and click the “Create and Next” button\n\nIf you already have an existing custom\
    \  Server Template, you can click on that template and then click on the “Clone\
    \ it” button.\n\n![](images/00007.jpg) \n\nFor example, I have an existing template\
    \ called “Server-X1” - I clicked on it and then  click on the “Clone Template”\
    \ button.\n\n![](images/00047.jpg)Give it the cloned template a new name, say\
    \  “PHP-FPM”.\n\nThere are many options and settings that you can set in the Server\
    \ Template, in our case, we are only interested in the “Apache Website” section.\
    \  \n\nClick the drop-down list  (at the “Edit template section”) and  select\
    \ “Apache Website” \n\n![](images/00024.jpg) \n\nYou will then see a page with\
    \ a box with the description: “Directives and settings for new websites”.  Select\
    \ the “Apache Directives Below” from the radio-button \n\n![](images/00018.jpg) \n\
    \n Then, paste the following code at the very bottom, after the existing codes\
    \ in the box.\n\n![](images/00043.jpg) \n\n(the sourcecode for the above is found\
    \ in the “ifmodule\\_modfastcgi.txt” )\n\nNOTE:  The “FastCgiExternalServer ...”\
    \  line should be just one long line, there is NO  carriage return or the script\
    \ will fail.  You can download the custom script package that is provided with\
    \ this book - The download link is  at Chapter 10.\n\nFurther down on this  same\
    \ page,  you will see this section:\n\n![](images/00040.jpg)\n\nThe default setting\
    \ in Virtualmin is to execute PHP as 'FCGId'.\n\nChange it to “Apache mod\\_php\
    \ (run as Apache's user)”  (see the screenshot above)\n\nThis option does not\
    \ add any additional FCGID directives to the “httpd.conf” file which may cause\
    \ problem.\n\nThe shell script (“updatehandler.sh”) that we had set in the Virtualmin\
    \ Configuration page earlier will ensure that the 'mod\\_php' module is not loaded.\n\
    \nChapter 4: Automation: Custom Scripts\n\nIn Chapter 2, we've setup Virtualmin\
    \ to run 2 custom scripts – “updatehandler.sh” before creating the virtual server,\
    \ and “phpfpm.sh” after the virtual server has been created. In this chapter,\
    \ we'll take a closer look at these 2 shell scripts, plus a few other “helper”\
    \ scripts.\n\nYou can download the scripts here: [http://ilovevirtualmin.com/books-scripts/php-fpm](http://ilovevirtualmin.com/books-scripts/php-fpm)"
  fmt: "\nRPMFORGE is another popular software repository trusted by many open-source\
    \ enthusiast. It is now known as “RepoForge”, a project that maintains various\
    \ RPM packages for Red Hat Enterprise Linux (RHEL), CentOS and Scientific Linux.\
    \ It provides a set of repositories compatible with various RHEL-derived distributions.\n\
    \n## Download & Install RepoForge\n\n```bash\n# wget http://pkgs.repoforge.org/rpmforge-release/rpmforge-release-0.5.3-1.el6.rf.i686.rpm\n\
    ```\n\nIf you're using a different CentOS distro, please visit [http://repoforge.org/use](http://repoforge.org/use)\
    \ and select the appropriate version for your server.\n\n**NOTE**: Do not install\
    \ it YET – because later, when we run the `yum update` command to update the installed\
    \ repositories, the default “AWStats” package will be replaced by the package\
    \ in RepoForge repository which will cause the AWStats reporting to break. We'll\
    \ address this issue later.\n\n## Now it's time to update the software repositories\
    \ (EPEL & REMI)\n\n### Update the EPEL repository\n\nThe command below will update\
    \ the latest packages from the EPEL repository:\n\n```bash\n# yum update\n```\n\
    \n![](images/00017.jpg) Type “y” and hit the enter key.\n\n### Install/Upgrade\
    \ MySQL 5.5 and PHP 5.4\n\nThe command below (with the flag `--enablerepo=remi`)\
    \ will activate the REMI repo and tells the yum package manager to install/upgrade\
    \ the software from REMI:\n\n```bash\n# yum --enablerepo=remi upgrade mysql\n\
    ```\n\n**Note**: the command above will also upgrade PHP 5.3 to PHP 5.4 because\
    \ the yum utility will ensure all the interlinked software dependencies are met\
    \ (e.g. one of which was the php-mysql which was linked to MySQL 5.1 – so when\
    \ we upgrade MySQL to 5.5, the yum utility will also upgrade the corresponding\
    \ “php-mysql” packages to PHP 5.40).\n\n![](images/00006.jpg) When prompted, type\
    \ 'y' and press the enter key.\n\n**Note**: The 4th column tells you which software\
    \ repository the software package is being installed from. Once the software upgrade\
