    # Chapter 7: Setting up Nginx


    The goal of this chapter is to run Nginx as the primary server.


    A Word about Performance before we begin.


    Nginx''s role as a reverse-proxy is to boost website performance by offloading
    some of the load from Apache. Personally, I''ve not been able to detect significant
    performance from using Nginx as a reverse-proxy – but probably it is because my
    website doesn''t have thousands of visitors.


    Running Apache with PHP-FPM is sufficient for most people, but anyway, it is always
    good to be prepared


    The first step is to download and install the Nginx repository:


    Go to [http://nginx.org/en/linux_packages.html#stable](http://nginx.org/en/linux_packages.html#stable)


    ```bash

    # wget http://nginx.org/packages/centos/6/noarch/RPMS/nginx-release-6-0.el6.ngx.noarch.rpm

    # rpm -ivh nginx-release*

    # yum install nginx

    ```


    ![](images/0034.jpg)


    This will install the latest Stable version of Nginx on your server. But take
    note that the default Nginx install above assumes that it will act as the “main
    webserver” and not as a “Reverse Proxy”.


    In order to set it up to act as a reverse proxy, I''ve prepared the necessary
    configuration files. In Chapter 4, the extracted the custom script package (vserver.tgz)
    has a folder called `nginx` with the following:


    *   `nginx.conf`

    *   `proxy.inc`

    *   `microcache.inc`

    *   `virtualserver.com`

    *   `createvhost.sh`

    *   `nginx-proxy` (this is a blank/empty file)


    Copy all these files to the `/etc/nginx/`:


    ```bash

    cd /root/nginx

    cp * /etc/nginx/

    mkdir -p /etc/nginx/vhosts

    ```


    Note: You will need to overwrite the existing `nginx.conf`.


    Copy the `nginx-proxy` (this is a blank/empty file) to the `/root` directory.

