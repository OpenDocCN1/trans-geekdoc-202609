    # 5.9 We define


    $g(z, \nu) := \log p(x, z) - \log q(z, \nu)$

    $z := t(\epsilon, \nu)$


    for differentiable functions $p, q, t$. By using the chain rule, compute the gradient


    $\frac{\mathrm{d}}{\mathrm{d}\nu} g(z, \nu)$.


    $\frac{\mathrm{d}}{\mathrm{d}\nu} g(z, \nu) = \frac{\mathrm{d}}{\mathrm{d}\nu}
    (\log p(x, z) - \log q(z, \nu)) = \frac{\mathrm{d}}{\mathrm{d}\nu} \log p(x, z)
    - \frac{\mathrm{d}}{\mathrm{d}\nu} \log q(z, \nu)$

    $= \frac{\partial}{\partial z} \log p(x, z) \frac{\partial t(\epsilon, \nu)}{\partial
    \nu} - \frac{\partial}{\partial z} \log q(z, \nu) \frac{\partial t(\epsilon, \nu)}{\partial
    \nu} - \frac{\partial}{\partial \nu} \log q(z, \nu)$

    $= \left( \frac{\partial}{\partial z} \log p(x, z) - \frac{\partial}{\partial
    z} \log q(z, \nu) \right) \frac{\partial t(\epsilon, \nu)}{\partial \nu} - \frac{\partial}{\partial
    \nu} \log q(z, \nu)$

    $= \left( \frac{1}{p(x, z)} \frac{\partial}{\partial z} p(x, z) - \frac{1}{q(z,
    \nu)} \frac{\partial}{\partial z} q(z, \nu) \right) \frac{\partial t(\epsilon,
    \nu)}{\partial \nu} - \frac{\partial}{\partial \nu} \log q(z, \nu)$'
