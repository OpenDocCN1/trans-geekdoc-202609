    mu)\\right]$\n$=\\binom{N}{x}\\exp\\left[x\\log\\frac{\\mu}{1-\\mu}+N\\log(1-\\\
    mu)\\right]$\n\n最后一行可以通过观察而被识别为指数族形式\n\n$h(x)=\\begin{cases}\\binom{N}{x} & x=0,1,...,N.\\\
    \\0 & \\text{otherwise}\\end{cases}$\n$\\theta=\\log\\frac{\\mu}{1-\\mu}$\n\n"
