    \n我们应用贝叶斯定理并计算从袋子 2 挑选芒果的后验 $p(b_2\\mid m)$。\n\n$$p(b_2\\mid m)=\\frac{p(m\\mid\
    \ b_2)p(b_2)}{p(m)}$$\n\n其中\n\n\\[\np(m)=p(b_1)p(m\\mid b_1)+p(b_2)p(m\\mid b_2)=\\\
    frac{3}{5}\\frac{2}{3}+\\frac{2}{5}\\frac{1}{2}=\\frac{2}{5}+\\frac{1}{5}=\\frac{3}{5}\\\
    quad\\text{Evidence}\n\\]\n\n\\[\np(b_2)=\\frac{2}{5}\\quad\\text{Prior}\n\\]\n\
    \n\\[\np(m\\mid b_2)=\\frac{1}{2}\\quad\\text{Likelihood}\n\\]\n\n因此，\n\n\\[\n\
    p(b_2\\mid m)=\\frac{p(m\\mid b_2)p(b_2)}{p(m)}=\\frac{\\frac{2}{5}\\frac{1}{2}}{\\\
    frac{3}{5}}=\\frac{1}{3}.\n\\]\n\n## 6.5\n\n考虑时间序列模型\n\n\\[\nx_{t+1}=Ax_t+w,\\\
    qquad w\\sim\\mathcal{N}(0,Q),\n\\]\n\\[\ny_t=Cx_t+v,\\qquad v\\sim\\mathcal{N}(0,R),\n\
    \\]\n\n其中 $w,v$ 是 i.i.d. 高斯噪声变量。此外，假设 $p(x_0)=\\mathcal{N}(\\mu_0,\\Sigma_0)$。\n\
