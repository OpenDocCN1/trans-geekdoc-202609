    frac{1}{2\\sigma^2}(x - \\mu)^2\\right),\n\\]\n\n其中 \\(\\mu, \\sigma \\in \\mathbb{R}\\\
    ) 为常数。\n\n\\[\nf'(x) = -\\frac{1}{\\sigma^2} f(x)(x - \\mu)\n\\]\n\n### 5.4 计算\
