    \ \\sqrt{\\lambda_i} x_i \\mathbf{p}_i, \\sum_{i=1}^{n} \\sqrt{\\lambda_i} x_i\
    \ \\mathbf{p}_i \\right\\rangle,\n\\]\n\nwhere we used \\(\\langle \\cdot, \\\
    cdot \\rangle\\) to denote the dot product.\n\n(iii) The bilinearity of the dot\
    \ product gives us\n\n\\[\n\\|\\mathbf{A}\\mathbf{x}\\|_2^2 = \\sum_{i=1}^{n}\
    \ \\lambda_i \\langle x_i \\mathbf{p}_i, x_i \\mathbf{p}_i \\rangle = \\sum_{i=1}^{n}\
    \ \\lambda_i x_i^2\n\\]\n\nwhere we exploited that the \\(\\mathbf{p}_i\\) are\
    \ an ONB and \\(\\mathbf{p}_i^\\top\\mathbf{p}_i = 1\\).\n\n(iv) With (4.8) we\
    \ obtain\n\n\\[\n\\|\\mathbf{A}\\mathbf{x}\\|_2^2 \\leqslant \\left( \\max_{1\
    \ \\leqslant j \\leqslant n} \\lambda_j \\right) \\sum_{i=1}^{n} x_i^2 \\stackrel{(4.9)}{=}\
    \ \\max_{1 \\leqslant j \\leqslant n} \\lambda_j \\|\\mathbf{x}\\|_2^2\n\\]\n\n\
    so that\n\n\\[\n\\frac{\\|\\mathbf{A}\\mathbf{x}\\|_2^2}{\\|\\mathbf{x}\\|_2^2}\
    \ \\leqslant \\max_{1 \\leqslant j \\leqslant n} \\lambda_j,\n\\]\n\nwhere \\\
    (\\lambda_j\\) are the eigenvalues of \\(\\mathbf{A}^\\top\\mathbf{A}\\).\n\n\
    (v) Assuming the eigenvalues of \\(\\mathbf{A}^\\top\\mathbf{A}\\) are sorted\
    \ in descending order, we get\n\n\\[\n\\frac{\\|\\mathbf{A}\\mathbf{x}\\|_2}{\\\
    |\\mathbf{x}\\|_2} \\leqslant \\sqrt{\\lambda_1} = \\sigma_1,\n\\]\n\nwhere \\\
    (\\sigma_1\\) is the maximum singular value of \\(\\mathbf{A}\\).\n\n## Vector\
    \ Calculus\n\n### Exercises\n\n### 5.1 Compute the derivative \\(f'(x)\\) for\n\
    \n\\[\nf(x) = \\log(x^4)\\sin(x^3).\n\\]\n\n\\[\nf'(x) = \\frac{4}{x}\\sin(x^3)\
    \ + 12x^2\\log(x)\\cos(x^3)\n\\]\n\n### 5.2 Compute the derivative \\(f'(x)\\\
    ) of the logistic sigmoid\n\n\\[\nf(x) = \\frac{1}{1 + \\exp(-x)}.\n\\]\n\n\\\
    [\nf'(x) = \\frac{\\exp(x)}{(1 + \\exp(x))^2}\n\\]\n\n### 5.3 Compute the derivative\
    \ \\(f'(x)\\) of the function\n\n\\[\nf(x) = \\exp\\left(-\\frac{1}{2\\sigma^2}(x\
    \ - \\mu)^2\\right),\n\\]\n\nwhere \\(\\mu, \\sigma \\in \\mathbb{R}\\) are constants.\n\
    \n\\[\nf'(x) = -\\frac{1}{\\sigma^2} f(x)(x - \\mu)\n\\]\n\n### 5.4 Compute the\
    \ Taylor polynomials \\(T_n\\), \\(n = 0, \\dots, 5\\), of \\(f(x) = \\sin(x)\
    \ + \\cos(x)\\) at \\(x_0 = 0\\).\n\n- \\(T_0(x) = 1\\)\n- \\(T_1(x) = T_0(x)\
    \ + x\\)\n- \\(T_2(x) = T_1(x) - \\frac{x^2}{2}\\)\n- \\(T_3(x) = T_2(x) - \\\
    frac{x^3}{6}\\)\n- \\(T_4(x) = T_3(x) + \\frac{x^4}{24}\\)\n- \\(T_5(x) = T_4(x)\
    \ + \\frac{x^5}{120}\\)\n\n### 5.5 Consider the following functions:\n\n\\[\n\
    f_1(\\mathbf{x}) = \\sin(x_1)\\cos(x_2), \\quad \\mathbf{x} \\in \\mathbb{R}^2\n\
    \\]\n\n\\[\nf_2(\\mathbf{x},\\mathbf{y}) = \\mathbf{x}^\\top\\mathbf{y}, \\quad\
    \ \\mathbf{x},\\mathbf{y} \\in \\mathbb{R}^n\n\\]\n\n\\[\nf_3(\\mathbf{x}) = \\\
    mathbf{x}\\mathbf{x}^\\top, \\quad \\mathbf{x} \\in \\mathbb{R}^n\n\\]\n\na. What\
    \ are the dimensions of \\(\\frac{\\partial f_i}{\\partial \\mathbf{x}}\\)?\n\n\
    b. Compute the Jacobians.\n\n- \\(f_1\\):\n\n  \\[\n  \\frac{\\partial f_1}{\\\
    partial x_1} = \\cos(x_1)\\cos(x_2)\n  \\]\n\n  \\[\n  \\frac{\\partial f_1}{\\\
    partial x_2} = -\\sin(x_1)\\sin(x_2)\n  \\]\n\n  \\[\n  \\implies J = \\left[\\\
    frac{\\partial f_1}{\\partial x_1} \\ \\frac{\\partial f_1}{\\partial x_2}\\right]\
    \ = \\left[\\cos(x_1)\\cos(x_2) \\ \\ -\\sin(x_1)\\sin(x_2)\\right] \\in \\mathbb{R}^{1\\\
    times2}\n  \\]\n\n- \\(f_2\\):\n\n  \\[\n  \\mathbf{x}^\\top\\mathbf{y} = \\sum_i\
    \ x_i y_i\n  \\]\n\n  \\[\n  \\frac{\\partial f_2}{\\partial \\mathbf{x}} = \\\
    left[\\frac{\\partial f_2}{\\partial x_1} \\ \\dots \\ \\frac{\\partial f_2}{\\\
    partial x_n}\\right] = \\left[y_1 \\ \\dots \\ y_n\\right] = \\mathbf{y}^\\top\
    \ \\in \\mathbb{R}^n\n  \\]\n\n  \\[\n  \\frac{\\partial f_2}{\\partial \\mathbf{y}}\
    \ = \\left[\\frac{\\partial f_2}{\\partial y_1} \\ \\dots \\ \\frac{\\partial\
    \ f_2}{\\partial y_n}\\right] = \\left[x_1 \\ \\dots \\ x_n\\right] = \\mathbf{x}^\\\
    top \\in \\mathbb{R}^n\n  \\]\n\n  \\[\n  \\implies J = \\left[\\frac{\\partial\
    \ f_2}{\\partial \\mathbf{x}} \\ \\frac{\\partial f_2}{\\partial \\mathbf{y}}\\\
    right] = \\left[\\mathbf{y}^\\top \\ \\mathbf{x}^\\top\\right] \\in \\mathbb{R}^{1\\\
    times2n}\n  \\]\n\n- \\(f_3: \\mathbb{R}^n \\to \\mathbb{R}^{n\\times n}\\):\n\
    \n  \\[\n  \\mathbf{x}\\mathbf{x}^\\top = \\begin{bmatrix}x_1\\mathbf{x}^\\top\
    \ \\\\ x_2\\mathbf{x}^\\top \\\\ \\vdots \\\\ x_n\\mathbf{x}^\\top\\end{bmatrix}\
    \ = \\left[\\mathbf{x}x_1 \\ \\mathbf{x}x_2 \\ \\dots \\ \\mathbf{x}x_n\\right]\
    \ \\in \\mathbb{R}^{n\\times n}\n  \\]\n\n  \\[\n  \\implies \\frac{\\partial\
    \ f_3}{\\partial x_1} = \\underbrace{\\begin{bmatrix}\\mathbf{x}^\\top \\\\ \\\
    mathbf{0}^\\top \\\\ \\vdots \\\\ \\mathbf{0}^\\top\\end{bmatrix}}_{\\in \\mathbb{R}^{n\\\
    times n}} + \\underbrace{\\left[\\mathbf{x} \\ \\mathbf{0}_n \\ \\dots \\ \\mathbf{0}_n\\\
    right]}_{\\in \\mathbb{R}^{n\\times n}} \\in \\mathbb{R}^{n\\times n}\n  \\]\n\
    \n  \\[\n  \\implies \\frac{\\partial f_3}{\\partial x_i} = \\underbrace{\\begin{bmatrix}\\\
    mathbf{0}_{(i-1)\\times n} \\\\ \\mathbf{x}^\\top \\\\ \\mathbf{0}_{(n-i)\\times\
    \ n}\\end{bmatrix}}_{\\in \\mathbb{R}^{n\\times n}} + \\underbrace{\\left[\\mathbf{0}_{n\\\
    times(i-1)} \\ \\mathbf{x} \\ \\mathbf{0}_{n\\times(n-i)}\\right]}_{\\in \\mathbb{R}^{n\\\
    times n}} \\in \\mathbb{R}^{n\\times n}\n  \\]\n\nTo get the Jacobian, we need\
    \ to concatenate all partial derivatives \\(\\frac{\\partial f_3}{\\partial x_i}\\\
    ) and obtain\n\n\\[\nJ = \\left[\\frac{\\partial f_3}{\\partial x_1} \\ \\dots\
    \ \\ \\frac{\\partial f_3}{\\partial x_n}\\right] \\in \\mathbb{R}^{(n\\times\
    \ n)\\times n}\n\\]\n\n### 5.6 Differentiate \\(f\\) with respect to \\(t\\) and\
    \ \\(g\\) with respect to \\(X\\), where\n\n\\[\nf(t) = \\sin(\\log(t^{\\mathsf\
    \ T}t)), \\qquad t \\in \\mathbb{R}^D\n\\]\n\n\\[\ng(X) = \\operatorname{tr}(AXB),\
    \ \\qquad A \\in \\mathbb{R}^{D\\times E}, \\ X \\in \\mathbb{R}^{E\\times F},\
    \ \\ B \\in \\mathbb{R}^{F\\times D},\n\\]\n\nwhere \\(\\operatorname{tr}(\\cdot)\\\
    ) denotes the trace.\n\n\\[\n\\frac{\\partial f}{\\partial t} = \\cos(\\log(t^{\\\
    mathsf T}t)) \\cdot \\frac{1}{t^{\\mathsf T}t} \\cdot 2t^{\\mathsf T}\n\\]\n\n\
    The trace for \\(T \\in \\mathbb{R}^{D\\times D}\\) is defined as\n\n\\[\n\\operatorname{tr}(T)\
    \ = \\sum_{i=1}^{D} T_{ii}\n\\]\n\nA matrix product \\(ST\\) can be written as\n\
    \n\\[\n(ST)_{pq} = \\sum_i S_{pi}T_{iq}\n\\]\n\nThe product \\(AXB\\) contains\
    \ the elements\n\n\\[\n(AXB)_{pq} = \\sum_{i=1}^{E}\\sum_{j=1}^{F} A_{pi}X_{ij}B_{jq}\n\
    \\]\n\nWhen we compute the trace, we sum up the diagonal elements of the matrix.\
    \ Therefore we obtain\n\n\\[\n\\operatorname{tr}(AXB) = \\sum_{k=1}^{D}(AXB)_{kk}\
    \ = \\sum_{k=1}^{D}\\left(\\sum_{i=1}^{E}\\sum_{j=1}^{F} A_{ki}X_{ij}B_{jk}\\\
    right)\n\\]\n\n\\[\n\\frac{\\partial}{\\partial X_{ij}}\\operatorname{tr}(AXB)\
    \ = \\sum_k A_{ki}B_{jk} = (BA)_{ji}\n\\]\n\nWe know that the size of the gradient\
    \ needs to be of the same size as \\(X\\) (i.e., \\(E\\times F\\)). Therefore,\
    \ we have to transpose the result above, so that we finally obtain\n\n\\[\n\\\
    frac{\\partial}{\\partial X}\\operatorname{tr}(AXB) = \\underbrace{A^{\\mathsf\
    \ T}}_{E\\times D}\\underbrace{B^{\\mathsf T}}_{D\\times F}\n\\]\n\n### 5.7 Compute\
    \ the derivatives \\(df/dx\\) of the following functions by using the chain rule.\
    \ Provide the dimensions of every single partial derivative. Describe your steps\
    \ in detail.\n\na.\n\n\\[\nf(z) = \\log(1+z), \\qquad z = x^{\\mathsf T}x, \\\
    qquad x \\in \\mathbb{R}^D\n\\]\n\nb.\n\n\\[\nf(z) = \\sin(z), \\qquad z = Ax\
    \ + b, \\qquad A \\in \\mathbb{R}^{E\\times D}, \\ x \\in \\mathbb{R}^D, \\ b\
    \ \\in \\mathbb{R}^E\n\\]\n\nwhere \\(\\sin(\\cdot)\\) is applied to every element\
    \ of \\(z\\).\n"
  mdcn: "\n### 4.10 求秩-1近似\n\n\\[\n\\mathbf{A} = \\begin{bmatrix}3 & 2 & 2 \\\\ 2\
    \ & 3 & -2\\end{bmatrix}\n\\]\n\n为了求秩-1近似，我们对 \\(\\mathbf{A}\\) 应用 SVD（见练习 4.7）得到\n\
    \n\\[\n\\mathbf{U} = \\begin{bmatrix}\\frac{1}{\\sqrt{2}} & -\\frac{1}{\\sqrt{2}}\
    \ \\\\ \\frac{1}{\\sqrt{2}} & \\frac{1}{\\sqrt{2}}\\end{bmatrix}\n\\]\n\n\\[\n\
    \\mathbf{V} = \\begin{bmatrix}\\frac{1}{\\sqrt{2}} & -\\frac{1}{3\\sqrt{2}} &\
    \ -\\frac{2}{3} \\\\ \\frac{1}{\\sqrt{2}} & \\frac{1}{3\\sqrt{2}} & \\frac{2}{3}\
    \ \\\\ 0 & -\\frac{2\\sqrt{2}}{3} & \\frac{1}{3}\\end{bmatrix}.\n\\]\n\n我们应用秩-1矩阵的构造规则\n\
    \n\\[\n\\mathbf{A}_i = \\mathbf{u}_i\\mathbf{v}_i^\\top.\n\\]\n\n我们使用最大奇异值（\\\
    (\\sigma_1 = 5\\)，即 \\(i = 1\\)，以及 \\(\\mathbf{U}\\) 和 \\(\\mathbf{V}\\) 矩阵的第一个列向量，分别）：\n\
    \n\\[\n\\mathbf{A}_1 = \\mathbf{u}_1\\mathbf{v}_1^\\top =\n\\begin{bmatrix}\\\
    frac{1}{\\sqrt{2}} \\\\ \\frac{1}{\\sqrt{2}}\\end{bmatrix}\n\\begin{bmatrix}\\\
    frac{1}{\\sqrt{2}} & \\frac{1}{\\sqrt{2}} & 0\\end{bmatrix}\n= \\frac{1}{2}\\\
    begin{bmatrix}1 & 1 & 0 \\\\ 1 & 1 & 0\\end{bmatrix}.\n\\]\n\n### 4.11 证明对于任意\
    \ \\(\\mathbf{A} \\in \\mathbb{R}^{m\\times n}\\)，矩阵 \\(\\mathbf{A}^\\top\\mathbf{A}\\\
    ) 和 \\(\\mathbf{A}\\mathbf{A}^\\top\\) 具有相同的非零特征值。\n\n设 \\(\\lambda\\) 是 \\(\\\
    mathbf{A}\\mathbf{A}^\\top\\) 的一个非零特征值，\\(x\\) 是属于 \\(\\lambda\\) 的特征向量。因此，特征值方程\n\
    \n\\[\n(\\mathbf{A}\\mathbf{A}^\\top)x = \\lambda x\n\\]\n\n可通过左乘 \\(\\mathbf{A}^\\\
