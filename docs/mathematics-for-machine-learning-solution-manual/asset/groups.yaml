    $= (1-\lambda)((2-\lambda)(4-\lambda)-3)=(1-\lambda)(8-2\lambda-4\lambda+\lambda^2-3)$

    $= (1-\lambda)(\lambda^2-6\lambda+5)=(1-\lambda)(\lambda-1)(\lambda-5)=-(1-\lambda)^2(\lambda-5).$


    Therefore, we obtain the eigenvalues 1 and 5.


