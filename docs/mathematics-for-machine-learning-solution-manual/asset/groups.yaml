    ### 3.1 Show that $\langle\cdot,\cdot\rangle$ defined for all $\boldsymbol{x}
    = [x_1, x_2]^\top \in \mathbb{R}^2$ and $\boldsymbol{y} = [y_1, y_2]^\top \in
    \mathbb{R}^2$ by


    $\langle\boldsymbol{x}, \boldsymbol{y}\rangle := x_1 y_1 - (x_1 y_2 + x_2 y_1)
    + 2(x_2 y_2)$


    is an inner product.


    We need to show that $\langle\boldsymbol{x}, \boldsymbol{y}\rangle$ is a symmetric,
    positive definite bilinear form.


    - Let $\boldsymbol{x} := [x_1, x_2]^\top$, $\boldsymbol{y} = [y_1, y_2]^\top \in
    \mathbb{R}^2$. Then,


    $\langle\boldsymbol{x}, \boldsymbol{y}\rangle = x_1 y_1 - (x_1 y_2 + x_2 y_1)
    + 2 x_2 y_2$

    $= y_1 x_1 - (y_1 x_2 + y_2 x_1) + 2 y_2 x_2 = \langle\boldsymbol{y}, \boldsymbol{x}\rangle$,


    where we exploited the commutativity of addition and multiplication in $\mathbb{R}$.
    Therefore, $\langle\cdot,\cdot\rangle$ is symmetric.

    - It holds that


    $\langle\boldsymbol{x}, \boldsymbol{x}\rangle = x_1^2 - (2 x_1 x_2) + 2 x_2^2
    = (x_1 - x_2)^2 + x_2^2$.


    This is a sum of positive terms for $\boldsymbol{x} \neq \mathbf{0}$. Moreover,
    this expression shows that if $\langle\boldsymbol{x}, \boldsymbol{x}\rangle =
    0$ then $x_2 = 0$ and then $x_1 = 0$, i.e., $\boldsymbol{x} = \mathbf{0}$. Hence,
    $\langle\cdot,\cdot\rangle$ is positive definite.

    - In order to show that $\langle\cdot,\cdot\rangle$ is bilinear (linear in both
    arguments), we will simply show that $\langle\cdot,\cdot\rangle$ is linear in
    its first argument. Symmetry will ensure that $\langle\cdot,\cdot\rangle$ is bilinear.
    Do not duplicate the proof of linearity in both arguments.

    Let $\boldsymbol{z} = [z_1, z_2]^\top \in \mathbb{R}^2$ and $\lambda \in \mathbb{R}$.
    Then,


    $\langle\boldsymbol{x} + \boldsymbol{y}, \boldsymbol{z}\rangle = (x_1 + y_1)z_1
    - ((x_1 + y_1)z_2 + (x_2 + y_2)z_1) + 2(x_2 + y_2)z_2$

    $= x_1 z_1 - (x_1 z_2 + x_2 z_1) + 2(x_2 z_2) + y_1 z_1 - (y_1 z_2 + y_2 z_1)
    + 2(y_2 z_2)$

    $= \langle\boldsymbol{x}, \boldsymbol{z}\rangle + \langle\boldsymbol{y}, \boldsymbol{z}\rangle$

    $\langle\lambda\boldsymbol{x}, \boldsymbol{y}\rangle = \lambda x_1 y_1 - (\lambda
    x_1 y_2 + \lambda x_2 y_1) + 2(\lambda x_2 y_2)$

    $= \lambda(x_1 y_1 - (x_1 y_2 + x_2 y_1) + 2(x_2 y_2)) = \lambda \langle\boldsymbol{x},
    \boldsymbol{y}\rangle$


    Thus, $\langle\cdot,\cdot\rangle$ is linear in its first variable. By symmetry,
    it is bilinear. Overall, $\langle\cdot,\cdot\rangle$ is an inner product.


