    sum_i(1-x_i)$$\n\n$$\\qquad=\\log\\mu\\left(a-1+\\sum_i x_i\\right)+\\log(1-\\\
    mu)\\left(b-1+N-\\sum_i x_i\\right).$$\n\n因此，后验再次为 $\\mathrm{Beta}\\left(a+\\\
    sum_i x_i,b+N-\\sum_i x_i\\right)$。\n\n## 6.4\n\n有两个袋子。第一个袋子包含四个芒果和两个苹果；第二个袋子包含四个芒果和四个苹果。\n\
