    and $\mathrm{Cov}_{y,x}[\mathbf{y}, \mathbf{x}]$. Then apply the rules for Gaussian
    conditioning.


    We derive the posterior distribution following the second hint since we do not
    have to worry about normalization constants: Assume, we know the joint Gaussian
    distribution $$p(\mathbf{x}, \mathbf{y}) = \mathcal{N}\left(\begin{pmatrix}\mathbf{x}\\
    \mathbf{y}\end{pmatrix} \bigg| \begin{pmatrix}\boldsymbol{\mu}_x\\ \boldsymbol{\mu}_y\end{pmatrix},
    \begin{pmatrix}\boldsymbol{\Sigma}_x & \boldsymbol{\Sigma}_{xy}\\ \boldsymbol{\Sigma}_{yx}
    & \boldsymbol{\Sigma}_y\end{pmatrix}\right), \tag{6.11}$$ where we defined $\boldsymbol{\Sigma}_{xy}
