    mathsf{T}+R:=\\Sigma^y_{t+1\\mid t}\n\\]\n- \\[\n\\operatorname{Cov}[x_{t+1},y_{t+1}\\\
    mid y_{1:t}]=\\operatorname{Cov}[x_{t+1},Cx_{t+1}\\mid y_{1:t}]=\\Sigma_{t+1\\\
    mid t}C^\\mathsf{T}:=\\Sigma_{xy}\n\\]\n- \n- 因此，\n- \n- \\[\np(x_{t+1},y_{t+1}\\\
