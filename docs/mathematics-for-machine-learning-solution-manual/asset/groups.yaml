    ### 3.1 证明 $\langle\cdot,\cdot\rangle$ 定义为所有 $\boldsymbol{x} = [x_1, x_2]^\top
    \in \mathbb{R}^2$ 和 $\boldsymbol{y} = [y_1, y_2]^\top \in \mathbb{R}^2$ 的


    $\langle\boldsymbol{x}, \boldsymbol{y}\rangle := x_1 y_1 - (x_1 y_2 + x_2 y_1)
    + 2(x_2 y_2)$


    是一个内积。


    我们需要证明 $\langle\boldsymbol{x}, \boldsymbol{y}\rangle$ 是一个对称、正定的双线性形式。


    - 设 $\boldsymbol{x} := [x_1, x_2]^\top$, $\boldsymbol{y} = [y_1, y_2]^\top \in
    \mathbb{R}^2$。则，


    $\langle\boldsymbol{x}, \boldsymbol{y}\rangle = x_1 y_1 - (x_1 y_2 + x_2 y_1)
    + 2 x_2 y_2$

    $= y_1 x_1 - (y_1 x_2 + y_2 x_1) + 2 y_2 x_2 = \langle\boldsymbol{y}, \boldsymbol{x}\rangle$,


    其中我们利用了 $\mathbb{R}$ 中加法和乘法的可交换性。因此，$\langle\cdot,\cdot\rangle$ 是对称的。

    - 有


    $\langle\boldsymbol{x}, \boldsymbol{x}\rangle = x_1^2 - (2 x_1 x_2) + 2 x_2^2
    = (x_1 - x_2)^2 + x_2^2$。


    这是 $\boldsymbol{x} \neq \mathbf{0}$ 时的正项之和。此外，该表达式表明如果 $\langle\boldsymbol{x},
    \boldsymbol{x}\rangle = 0$ 则 $x_2 = 0$ 且然后 $x_1 = 0$，即 $\boldsymbol{x} = \mathbf{0}$。因此，$\langle\cdot,\cdot\rangle$
    是正定的。

