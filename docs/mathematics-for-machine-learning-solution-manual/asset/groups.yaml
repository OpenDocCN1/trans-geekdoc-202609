    + \mathbf{v}] = \mathbf{C}\mathbb{E}_Y[\mathbf{y}] + \underbrace{\mathbb{E}_V[\mathbf{v}]}_{=0}
    = \mathbf{C}\boldsymbol{\mu}_y.$$


