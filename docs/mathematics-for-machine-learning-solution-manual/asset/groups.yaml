    # 6.8 Express the Bernoulli distribution in the natural parameter form of the
    exponential family, see (6.107).


    $p(x \mid \mu) = \mu^x (1-\mu)^{1-x}$

    $= \exp\left[\log\left(\mu^x (1-\mu)^{1-x}\right)\right]$

    $= \exp\left[x \log \mu + (1 - x)\log(1-\mu)\right]$

    $= \exp\left[x \log \frac{\mu}{1-\mu} + \log(1-\mu)\right]$

    $= \exp\left[x\theta - \log(1+\exp(\theta))\right]$


    where the last line is obtained by substituting $\theta = \log \frac{\mu}{1-\mu}$.
    Note that this is in exponential family form, as $\theta$ is the natural parameter,
    the sufficient statistic $\phi(x)=x$ and the log partition function is $A(\theta)=\log(1+\exp(\theta))$.


    # 6.9 Express the Binomial distribution as an exponential family distribution.
    Also express the Beta distribution is an exponential family distribution. Show
    that the product of the Beta and the Binomial distribution is also a member of
    the exponential family.


    Express Binomial distribution as an exponential family distribution:


    Recall the Binomial distribution from Example 6.11


    $p(x|N,\mu)=\binom{N}{x}\mu^x(1-\mu)^{(N-x)}\quad x=0,1,...,N.$


    This can be written in exponential family form


    $p(x|N,\mu)=\binom{N}{x}\exp\left[\log\left(\mu^x(1-\mu)^{(N-x)}\right)\right]$

    $=\binom{N}{x}\exp\left[x\log\mu+(N-x)\log(1-\mu)\right]$

    $=\binom{N}{x}\exp\left[x\log\frac{\mu}{1-\mu}+N\log(1-\mu)\right]$


    The last line can be identified as being in exponential family form by observing
    that


    $h(x)=\begin{cases}\binom{N}{x} & x=0,1,...,N.\\0 & \text{otherwise}\end{cases}$

    $\theta=\log\frac{\mu}{1-\mu}$'
