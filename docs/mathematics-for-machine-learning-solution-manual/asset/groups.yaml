    value, and exploit the independence of $\mathbf{v}$ and $\mathbf{y}$: $$\boldsymbol{\Sigma}_z
    = \mathbf{C}\mathbb{E}_Y[\mathbf{y}\mathbf{y}^\top]\mathbf{C}^\top + \mathbb{E}_V[\mathbf{v}\mathbf{v}^\top]
    - \mathbf{C}\boldsymbol{\mu}_y\boldsymbol{\mu}_y^\top\mathbf{C}^\top,$$ where
    we used our previous result for $\boldsymbol{\mu}_z$. Note that $\mathbb{E}_V[\mathbf{v}]
    = \mathbf{0}$. We continue as follows: $$\boldsymbol{\Sigma}_y = \mathbf{C}\left(\underbrace{\mathbb{E}_Y[\mathbf{y}\mathbf{y}^\top]
    - \boldsymbol{\mu}_y\boldsymbol{\mu}_y^\top}_{=\boldsymbol{\Sigma}_x}\right)\mathbf{C}^\top
    + \mathbf{R} = \mathbf{C}\boldsymbol{\Sigma}_y\mathbf{C}^\top + \mathbf{R}.$$


