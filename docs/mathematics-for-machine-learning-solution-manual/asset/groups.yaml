    - \mathbb{E}_Z[\mathbf{z}]\mathbb{E}_Z[\mathbf{z}]^\top = \mathbb{E}_{Y,V}[(\mathbf{C}\mathbf{y}+\mathbf{v})(\mathbf{C}\mathbf{y}+\mathbf{v})^\top]
    - \boldsymbol{\mu}_z\boldsymbol{\mu}_z^\top = \mathbb{E}_{Y,V}[\mathbf{C}\mathbf{y}\mathbf{y}^\top\mathbf{C}^\top
    + \mathbf{C}\mathbf{y}\mathbf{v}^\top + \mathbf{v}(\mathbf{C}\mathbf{y})^\top
    + \mathbf{v}\mathbf{v}^\top] - \boldsymbol{\mu}_z\boldsymbol{\mu}_z^\top.$$


