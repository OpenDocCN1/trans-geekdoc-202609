    and we can use matrix multiplication associativity to reorder the left-hand side
    factors


    $(A^{\top} A)(A^{\top} x) = \lambda (A^{\top} x).$


    This is the eigenvalue equation for $A^{\top} A$. Therefore, $\lambda$ is the
    same eigenvalue for $AA^{\top}$ and $A^{\top} A$.


    # 4.12 Show that for $x \neq 0$ Theorem 4.24 holds, i.e., show that


    $\displaystyle \max_{x} \frac{\|A x\|_{2}}{\|x\|_{2}} = \sigma_{1},$


    where $\sigma_{1}$ is the largest singular value of $A \in \mathbb{R}^{m \times
    n}$.


    (i) We compute the eigendecomposition of the symmetric matrix


    $A^{\top} A = P D P^{\top}$


    for diagonal $D$ and orthogonal $P$. Since the columns of $P$ are an ONB of $\mathbb{R}^{n}$,
    we can write every $y = P x$ as a linear combination of the eigenvectors $p_{i}$
    so that


    $y = P x = \sum_{i=1}^{n} x_{i} p_{i}, \quad x \in \mathbb{R}. \tag{4.8}$


    Moreover, since the orthogonal matrix $P$ preserves lengths (see Section 3.4),
    we obtain


    $\|y\|_{2}^{2} = \|P x\|_{2}^{2} = \|x\|_{2}^{2} = \sum_{i=1}^{n} x_{i}^{2}. \tag{4.9}$


    (ii) Then, $\|A x\|_{2}^{2} = x^{\top} (P D P^{\top}) x = y^{\top} D y = \left\langle
    \sum_{i=1}^{n} \sqrt{\lambda_{i}} x_{i} p_{i}, \sum_{i=1}^{n} \sqrt{\lambda_{i}}
    x_{i} p_{i} \right\rangle,$


    where we used $\langle \cdot, \cdot \rangle$ to denote the dot product.


    (iii) The bilinearity of the dot product gives us $\|A x\|_{2}^{2} = \sum_{i=1}^{n}
    \lambda_{i} \langle x_{i} p_{i}, x_{i} p_{i} \rangle = \sum_{i=1}^{n} \lambda_{i}
    x_{i}^{2}$ where we exploited that the $p_{i}$ are an ONB and $p_{i}^{\top} p_{i}
    = 1.$


    (iv) With (4.8) we obtain $\|A x\|_{2}^{2} \leqslant \left( \max_{1 \leqslant
    j \leqslant n} \lambda_{j} \right) \sum_{i=1}^{n} x_{i}^{2} \stackrel{(4.9)}{=}
    \max_{1 \leqslant j \leqslant n} \lambda_{j} \|x\|_{2}^{2}$ so that $\frac{\|A
    x\|_{2}^{2}}{\|x\|_{2}^{2}} \leqslant \max_{1 \leqslant j \leqslant n} \lambda_{j},$
    where $\lambda_{j}$ are the eigenvalues of $A^{\top} A.$'
