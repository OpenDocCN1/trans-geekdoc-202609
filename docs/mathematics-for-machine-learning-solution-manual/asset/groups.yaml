    # 5.5 Consider the following functions:


    $f_1(\mathbf{x}) = \sin(x_1)\cos(x_2),\quad \mathbf{x}\in\mathbb{R}^2$

    $f_2(\mathbf{x},\mathbf{y}) = \mathbf{x}^\top\mathbf{y},\quad \mathbf{x},\mathbf{y}\in\mathbb{R}^n$

    $f_3(\mathbf{x}) = \mathbf{x}\mathbf{x}^\top,\quad \mathbf{x}\in\mathbb{R}^n$


    a. What are the dimensions of $\frac{\partial f_i}{\partial \mathbf{x}}$ ?

    b. Compute the Jacobians.


    +   - $f_1$

    +     $\frac{\partial f_1}{\partial x_1}=\cos(x_1)\cos(x_2)$

    +     $\frac{\partial f_1}{\partial x_2}=-\sin(x_1)\sin(x_2)$

    +     $\implies J = \left[\frac{\partial f_1}{\partial x_1}\,\frac{\partial f_1}{\partial
    x_2}\right]=\left[\cos(x_1)\cos(x_2)\ \ -\sin(x_1)\sin(x_2)\right]\in\mathbb{R}^{1\times2}$

    +   - $f_2$

    +     $\mathbf{x}^\top\mathbf{y}=\sum_i x_i y_i$

    +     $\frac{\partial f_2}{\partial \mathbf{x}}=\left[\frac{\partial f_2}{\partial
    x_1}\ \dots\ \frac{\partial f_2}{\partial x_n}\right]=\left[y_1\ \dots\ y_n\right]=\mathbf{y}^\top\in\mathbb{R}^n$

    +     $\frac{\partial f_2}{\partial \mathbf{y}}=\left[\frac{\partial f_2}{\partial
    y_1}\ \dots\ \frac{\partial f_2}{\partial y_n}\right]=\left[x_1\ \dots\ x_n\right]=\mathbf{x}^\top\in\mathbb{R}^n$

    +     $\implies J = \left[\frac{\partial f_2}{\partial \mathbf{x}}\,\frac{\partial
    f_2}{\partial \mathbf{y}}\right]=\left[\mathbf{y}^\top\ \mathbf{x}^\top\right]\in\mathbb{R}^{1\times2n}$

    +   - $f_3:\mathbb{R}^n\to\mathbb{R}^{n\times n}$

    +     $\mathbf{x}\mathbf{x}^\top = \begin{bmatrix}x_1\mathbf{x}^\top\\x_2\mathbf{x}^\top\\\vdots\\x_n\mathbf{x}^\top\end{bmatrix}=\left[\mathbf{x}x_1\
    \mathbf{x}x_2\ \dots\ \mathbf{x}x_n\right]\in\mathbb{R}^{n\times n}$

    +     $\implies \frac{\partial f_3}{\partial x_1}= \underbrace{\begin{bmatrix}\mathbf{x}^\top\\\mathbf{0}^\top\\\vdots\\\mathbf{0}^\top\end{bmatrix}}_{\in\mathbb{R}^{n\times
    n}}+\underbrace{\left[\mathbf{x}\ \mathbf{0}_n\ \dots\ \mathbf{0}_n\right]}_{\in\mathbb{R}^{n\times
    n}}\in\mathbb{R}^{n\times n}$

    +     $\implies \frac{\partial f_3}{\partial x_i}= \underbrace{\begin{bmatrix}\mathbf{0}_{(i-1)\times
    n}\\\mathbf{x}^\top\\\mathbf{0}_{(n-i+1)\times n}\end{bmatrix}}_{\in\mathbb{R}^{n\times
    n}}+\underbrace{\left[\mathbf{0}_{n\times(i-1)}\ \mathbf{x}\ \mathbf{0}_{n\times(n-i+1)}\right]}_{\in\mathbb{R}^{n\times
    n}}\in\mathbb{R}^{n\times n}$


    To get the Jacobian, we need to concatenate all partial derivatives $\frac{\partial
    f_3}{\partial x_i}$ and obtain

    $J = \left[\frac{\partial f_3}{\partial x_1}\ \dots\ \frac{\partial f_3}{\partial
    x_n}\right]\in\mathbb{R}^{(n\times n)\times n}$'
