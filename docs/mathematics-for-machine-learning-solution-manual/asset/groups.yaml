    （iii）我们可以立即看出该矩阵的秩为 1，因为第一行和第三行是第二行的三倍。因此，特征空间的维数为 $\dim(E_2)=3-1=2$，这与特征多项式 $p(\lambda)$
    中特征值 $\lambda=2$ 的代数重数一致。此外，我们知道 $E_1$ 的维数为 1，因为它不能超过其代数重数，而特征空间的维数至少为 1。因此，$A$
    是可对角化的。


    （iv）对角矩阵很容易确定，因为它的对角线上只需包含特征值（以及相应的重数）：


    $D=\begin{bmatrix}1 & 0 & 0\\ 0 & 2 & 0\\ 0 & 0 & 2\end{bmatrix}.$


    （v）我们需要确定一个基，使得变换矩阵在该基下为对角矩阵。我们知道由特征向量组成的基恰好具有这一性质。因此，我们需要确定所有特征值的特征向量。请记住，如果
    $x$ 满足 $Ax=\lambda x \iff (A-\lambda I)x=0$，则 $x$ 是特征值 $\lambda$ 的特征向量。因此，我们需要找到特征空间
    $E_1,E_2$ 的基向量。


    对于 $E_1=\ker(A-I)$，我们得到：


    $\begin{bmatrix}4 & -6 & -6\\ -1 & 3 & 2\\ 3 & -6 & -5\end{bmatrix}+4R_2\quad\sim\quad\begin{bmatrix}0
    & 6 & 2\\ -1 & 3 & 2\\ 0 & 3 & 1\end{bmatrix}\cdot(1/6)$

    $\cdot(-1)\text{与 }R_1\text{ 交换}\quad -\tfrac12 R_1$

    ~→ $\begin{bmatrix}1 & -3 & -2\\0 & 1 & \frac13\\0 & 0 & 0\end{bmatrix}$ +3R₂
    ~→ $\begin{bmatrix}1 & 0 & -1\\0 & 1 & \frac13\\0 & 0 & 0\end{bmatrix}$


    该矩阵的秩为 2。由于 3 − 2 = 1，可知 dim(E₁) = 1，这与特征多项式中特征值 λ = 1 的代数重数一致。


    （vi）从行最简形可以看出 $E_1 = \text{span}\left[\begin{matrix}3\\-1\\3\end{matrix}\right]$，我们的第一个特征向量为
    $[3, -1, 3]^{\top}$。


    （vii）我们继续确定 $E_2$ 的一个基，这将给出我们需要的另外两个基向量（记住 dim$(E_2)=2$）。从 (4.1) 我们（几乎）立即得到行最简形
    $\begin{bmatrix}1 & -2 & -2\\0 & 0 & 0\\0 & 0 & 0\end{bmatrix}$，相应的特征空间为 $E_2
    = \text{span}\left[\begin{matrix}2\\1\\0\end{matrix}, \begin{matrix}2\\0\\1\end{matrix}\right]$。


    （viii）总的来说，使得 $A$ 具有对角形式 $D$ 的一个有序基由所有特征向量组成，即 $B = \left( \begin{bmatrix}3\\-1\\3\end{bmatrix},
    \begin{bmatrix}2\\1\\0\end{bmatrix}, \begin{bmatrix}2\\0\\1\end{bmatrix} \right)$。


    ## 4.8 求矩阵 $A = \begin{bmatrix}3 & 2 & 2\\2 & 3 & -2\end{bmatrix}$ 的 SVD。 $A =
    \underbrace{\begin{bmatrix}\frac{1}{\sqrt2} & -\frac{1}{\sqrt2}\\\frac{1}{\sqrt2}
    & \frac{1}{\sqrt2}\end{bmatrix}}_{=U} \underbrace{\begin{bmatrix}5 & 0 & 0\\0
    & 3 & 0\end{bmatrix}}_{=\Sigma} \underbrace{\begin{bmatrix}\frac{1}{\sqrt2} &
    -\frac{3}{\sqrt2} & -\frac{2}{3}\\\frac{1}{\sqrt2} & \frac{3}{\sqrt2} & \frac{2}{3}\\0
    & -\frac{2\sqrt2}{3} & \frac{1}{3}\end{bmatrix}}_{=V}$


    ## 4.9 求矩阵 $A = \begin{bmatrix}2 & 2\\-1 & 1\end{bmatrix}$ 的奇异值分解。


    （i）计算对称化矩阵 \(A^{\mathsf T}A\)。我们首先计算对称化矩阵


    \[

    A^{\mathsf T}A=

    \begin{bmatrix}2&-1\\2&1\end{bmatrix}

    \begin{bmatrix}2&2\\-1&1\end{bmatrix}

    =

    \begin{bmatrix}5&3\\3&5\end{bmatrix}.

    \tag{4.2}

    \]


    （ii）从 \(A^{\mathsf T}A\) 求右奇异向量和奇异值。\(A^{\mathsf T}A\) 的特征多项式为


    \[

    (5-\lambda)^2-9=\lambda^2-10\lambda+16=0.

    \tag{4.3}

    \]


    这给出特征值，按绝对值从大到小排序，\(\lambda_1=8\) 和 \(\lambda_2=2\)。相应的归一化特征向量分别为


    \[

    v_1=\begin{bmatrix}\frac{1}{\sqrt{2}}\\\frac{1}{\sqrt{2}}\end{bmatrix}

    \quad\text{并且}\quad

    v_2=\begin{bmatrix}\frac{1}{\sqrt{2}}\\-\frac{1}{\sqrt{2}}\end{bmatrix}.

    \tag{4.4}

    \]


    因此我们得到了右奇异正交矩阵


    \[

    V=[v_1,v_2]=

    \begin{bmatrix}

    \frac{1}{\sqrt{2}}&\frac{1}{\sqrt{2}}\\

    \frac{1}{\sqrt{2}}&-\frac{1}{\sqrt{2}}

    \end{bmatrix}.

    \tag{4.5}

    \]


    （iii）确定奇异值。我们通过特征值的平方根得到两个奇异值：\(\sigma_1=\sqrt{\lambda_1}=\sqrt{8}=2\sqrt{2}\)
    和 \(\sigma_2=\sqrt{\lambda_2}=\sqrt{2}\)。我们构造奇异值对角矩阵为


    \[

    \Sigma=

    \begin{bmatrix}\sigma_1&0\\0&\sigma_2\end{bmatrix}

    =

    \begin{bmatrix}2\sqrt{2}&0\\0&\sqrt{2}\end{bmatrix}.

    \tag{4.6}

    \]


    （iv）求左奇异向量。我们必须用 \(A\) 映射两个特征向量 \(v_1,v_2\)。这会得到两个自洽方程，使我们能够找到正交特征向量 \(u_1,u_2\)：


    \[

    Av_1=(\sigma_1u_1v_1^{\mathsf T})v_1=\sigma_1u_1(v_1^{\mathsf T}v_1)=\sigma_1u_1=

    \begin{bmatrix}2\sqrt{2}\\0\end{bmatrix}.

    \]


    \[

    Av_2=(\sigma_2u_2v_2^{\mathsf T})v_2=\sigma_2u_2(v_2^{\mathsf T}v_2)=\sigma_2u_2=

    \begin{bmatrix}0\\\sqrt{2}\end{bmatrix}.

    \]


    我们将左奇异向量分别除以各自的奇异值来进行归一化，得到 \(u_1=\begin{bmatrix}1\\0\end{bmatrix}\) 和 \(u_2=\begin{bmatrix}0\\1\end{bmatrix}\)，从而得到


    \[

    U=[u_1,u_2]=

    \begin{bmatrix}1&0\\0&1\end{bmatrix}.

    \tag{4.7}

    \]


    （v）组装左/右奇异向量和奇异值。\(A\) 的 SVD 为


    \[

    A=U\Sigma V^{\mathsf T}=

    \begin{bmatrix}1&0\\0&1\end{bmatrix}

    \begin{bmatrix}\sqrt{8}&0\\0&\sqrt{2}\end{bmatrix}

    \begin{bmatrix}

    \frac{1}{\sqrt{2}}&\frac{1}{\sqrt{2}}\\

    \frac{1}{\sqrt{2}}&-\frac{1}{\sqrt{2}}

    \end{bmatrix}.

    \]


    '
