    (\\lambda_j\\) 是 \\(\\mathbf{A}^\\top\\mathbf{A}\\) 的特征值。\n\n(v) 假设 \\(\\mathbf{A}^\\\
    top\\mathbf{A}\\) 的特征值按降序排列，我们得到\n\n\\[\n\\frac{\\|\\mathbf{A}\\mathbf{x}\\|_2}{\\\
