    The gradient of $g(x)$ with respect to $x_d$ is


    $\frac{\mathrm{d}g(x)}{\mathrm{d}x_d} = s_d - \frac{x_d}{x_d} - \log x_d = s_d
    - 1 - \log x_d.$


    Setting the gradient to zero gives


