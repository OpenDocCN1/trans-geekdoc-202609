    ## 2.18 Let $E$ be a vector space. Let $f$ and $g$ be two automorphisms on $E$
    such that $f \circ g = \mathrm{id}_E$ (i.e., $f \circ g$ is the identity mapping
    $\mathrm{id}_E$). Show that $\ker(f)=\ker(g \circ f)$, $\mathrm{Im}(g)=\mathrm{Im}(g
    \circ f)$ and that $\ker(f)\cap\mathrm{Im}(g)=\{\mathbf{0}_E\}$.


    Let $\boldsymbol{x}\in\ker(f)$. We have $g(f(\boldsymbol{x}))=g(\mathbf{0})=\mathbf{0}$
    since $g$ is linear. Therefore, $\ker(f)\subseteq\ker(g\circ f)$ (this always
    holds).


    Let $\boldsymbol{x}\in\ker(g\circ f)$. We have $g(f(\boldsymbol{x}))=\mathbf{0}$
    and as $f$ is linear, $f(g(f(\boldsymbol{x})))=f(\mathbf{0})=\mathbf{0}$. This
    implies that $(f\circ g)(f(\boldsymbol{x}))=\mathbf{0}$ so that $f(\boldsymbol{x})=\mathbf{0}$
    since $f\circ g=\mathrm{id}_E$. So $\ker(g\circ f)\subseteq\ker(f)$ and thus $\ker(g\circ
    f)=\ker(f)$.


    Let $\boldsymbol{y}\in\mathrm{Im}(g\circ f)$ and let $\boldsymbol{x}\in E$ so
    that $\boldsymbol{y}=(g\circ f)(\boldsymbol{x})$. Then $\boldsymbol{y}=g(f(\boldsymbol{x}))$,
    which shows that $\mathrm{Im}(g\circ f)\subseteq\mathrm{Im}(g)$ (which is always
    true).


    Let $\boldsymbol{y}\in\mathrm{Im}(g)$. Let then $\boldsymbol{x}\in E$ such that
    $\boldsymbol{y}=g(\boldsymbol{x})$. We have $\boldsymbol{y}=g((f\circ g)(\boldsymbol{x}))$
    and thus $\boldsymbol{y}=(g\circ f)(g(\boldsymbol{x}))$, which means that $\boldsymbol{y}\in\mathrm{Im}(g\circ
    f)$. Therefore, $\mathrm{Im}(g)\subseteq\mathrm{Im}(g\circ f)$. Overall, $\mathrm{Im}(g)=\mathrm{Im}(g\circ
    f)$.


    Let $\boldsymbol{y}\in\ker(f)\cap\mathrm{Im}(g)$. Let $\boldsymbol{x}\in E$ such
    that $\boldsymbol{y}=g(\boldsymbol{x})$. Applying $f$ gives us $f(\boldsymbol{y})=(f\circ
    g)(\boldsymbol{x})$ and as $\boldsymbol{y}\in\ker(f)$, we have $\mathbf{0}=\boldsymbol{x}$.
    This means that $\ker(f)\cap\mathrm{Im}(g)\subseteq\{\mathbf{0}\}$ but the intersection
    of two subspaces is a subspace and thus always contains $\mathbf{0}$, so $\ker(f)\cap\mathrm{Im}(g)=\{\mathbf{0}\}$.


