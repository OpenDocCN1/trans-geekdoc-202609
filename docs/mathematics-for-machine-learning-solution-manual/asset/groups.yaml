    mathbf{A}^\\top)x = \\mathbf{A}^\\top(\\lambda x) = \\lambda(\\mathbf{A}^\\top\
    \ x)\n\\]\n\n并且我们可以使用矩阵乘法的结合律重新排列左边的因子\n\n\\[\n(\\mathbf{A}^\\top\\mathbf{A})(\\\
    mathbf{A}^\\top x) = \\lambda(\\mathbf{A}^\\top x).\n\\]\n\n这是 \\(\\mathbf{A}^\\\
    top\\mathbf{A}\\) 的特征值方程。因此，\\(\\lambda\\) 是 \\(\\mathbf{A}\\mathbf{A}^\\top\\\
    ) 和 \\(\\mathbf{A}^\\top\\mathbf{A}\\) 的相同特征值。\n\n### 4.12 证明当 \\(x \\neq 0\\\
    ) 时定理 4.24 成立，即证明\n\n\\[\n\\max_{x} \\frac{\\|\\mathbf{A}x\\|_2}{\\|x\\|_2} =\
    \ \\sigma_1,\n\\]\n\n其中 \\(\\sigma_1\\) 是 \\(\\mathbf{A} \\in \\mathbb{R}^{m \\\
    times n}\\) 的最大奇异值。\n\n(i) 我们计算对称矩阵的特征分解\n\n\\[\n\\mathbf{A}^\\top\\mathbf{A}\
    \ = \\mathbf{P}\\mathbf{D}\\mathbf{P}^\\top\n\\]\n\n其中 \\(\\mathbf{D}\\) 为对角矩阵，\\\
    (\\mathbf{P}\\) 为正交矩阵。由于 \\(\\mathbf{P}\\) 的列是 \\(\\mathbb{R}^n\\) 的一个 ONB，我们可以将每个\
