    D} \underbrace{\frac{\partial h}{\partial \boldsymbol{x}}}_{D\times D} \in \mathbb{R}^{1\times
    D}$


    Here


    $\displaystyle \frac{\partial f}{\partial z} = -\tfrac12 \exp\left(-\tfrac12 z\right)$

    $\displaystyle \frac{\partial g}{\partial \boldsymbol{y}} = 2 \boldsymbol{y}^\top
    \boldsymbol{S}^{-1}$

    $\displaystyle \frac{\partial h}{\partial \boldsymbol{x}} = \boldsymbol{I}_D$


    so that


    $\displaystyle \frac{\mathrm{d}f}{\mathrm{d}\boldsymbol{x}} = - \exp\left(-\tfrac12
    (\boldsymbol{x}-\boldsymbol{\mu})^\top \boldsymbol{S}^{-1} (\boldsymbol{x}-\boldsymbol{\mu})\right)
    (\boldsymbol{x}-\boldsymbol{\mu})^\top \boldsymbol{S}^{-1}$


    b.


    $\displaystyle f(\boldsymbol{x}) = \operatorname{tr}(\boldsymbol{x}\boldsymbol{x}^\top
    + \sigma^2 \boldsymbol{I}), \quad \boldsymbol{x} \in \mathbb{R}^D$


    Here $\operatorname{tr}(\boldsymbol{A})$ is the trace of $\boldsymbol{A}$, i.e.,
    the sum of the diagonal elements $A_{ii}$.


    Hint: Explicitly write out the outer product.


    Let us have a look at the outer product. We define $\boldsymbol{X}=\boldsymbol{x}\boldsymbol{x}^\top$
    with


    $\displaystyle X_{ij}=x_i x_j$


    The trace sums up all the diagonal elements, such that


    $\displaystyle \frac{\partial}{\partial x_j}\operatorname{tr}(\boldsymbol{X}+\sigma^2\boldsymbol{I})
    = \sum_{i=1}^{D}\frac{\partial X_{ii}+\sigma^2}{\partial x_j}=2x_j$


    for $j=1,\dots,D$. Overall, we get


    $\displaystyle \frac{\partial}{\partial \boldsymbol{x}}\operatorname{tr}(\boldsymbol{x}\boldsymbol{x}^\top+\sigma^2\boldsymbol{I})
    = 2\boldsymbol{x}^\top \in \mathbb{R}^{1\times D}$


    c. Use the chain rule. Provide the dimensions of every single partial derivative.
    You do not need to compute the product of the partial derivatives explicitly.


    $\displaystyle \boldsymbol{f}=\tanh(\boldsymbol{z}) \in \mathbb{R}^M$

    $\displaystyle \boldsymbol{z}=\boldsymbol{A}\boldsymbol{x}+\boldsymbol{b}, \quad
    \boldsymbol{x}\in\mathbb{R}^N, \boldsymbol{A}\in\mathbb{R}^{M\times N}, \boldsymbol{b}\in\mathbb{R}^M.$


    Here, $\tanh$ is applied to every component of $\boldsymbol{z}$.


    $\displaystyle \frac{\partial \boldsymbol{f}}{\partial \boldsymbol{z}} = \operatorname{diag}\left(1-\tanh^2(\boldsymbol{z})\right)
    \in \mathbb{R}^{M\times M}$

    $\displaystyle \frac{\partial \boldsymbol{z}}{\partial \boldsymbol{x}} = \frac{\partial
    \boldsymbol{A}\boldsymbol{x}}{\partial \boldsymbol{x}} = \boldsymbol{A} \in \mathbb{R}^{M\times
    N}$'
