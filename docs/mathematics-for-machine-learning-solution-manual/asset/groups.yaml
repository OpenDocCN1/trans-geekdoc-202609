    Remark: Since $\boldsymbol{y}$ is Gaussian and $\boldsymbol{z}$ is a linear transformation
    of $\boldsymbol{y}$, $p(\boldsymbol{z})$ is Gaussian, too. Let''s compute its
    moments (similar to the “time update”):


