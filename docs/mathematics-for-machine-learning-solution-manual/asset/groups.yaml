    Substituting the optimum value of $x_d$ back into $f^*(s)$ gives


    $f^*(s) = \sum_{d=1}^{D} = s_d \exp(s_d - 1) - (s_d - 1)\exp(s_d - 1) = \exp(s_d
    - 1).$


    # 7.10 Consider the function


    $f(x) = \frac{1}{2} x^{\top} A x + b^{\top} x + c,$


    where $A$ is strictly positive definite, which means that it is invertible. Derive
    the convex conjugate of $f(x)$.


    *Hint: Take the gradient of an appropriate function and set the gradient to zero.*


    From the definition of the Legendre Fenchel transform,


    $f^*(s) = \sup_{x \in \mathbb{R}^D} s^{\top} x - \frac{1}{2} x^{\top} A x - b^{\top}
    x - c.$


    Define a function (for notational convenience) $g(x) = s^{\top} x - \frac{1}{2}
    x^{\top} A x - b^{\top} x - c.$


    The gradient of $g(x)$ with respect to $x$ is $\frac{\mathrm{d}g(x)}{\mathrm{d}x}
    = s^{\top} - x^{\top} A - b^{\top}.$


    Setting the gradient to zero gives (note that $A^{\top} = A$) $s A^{\top} x -
