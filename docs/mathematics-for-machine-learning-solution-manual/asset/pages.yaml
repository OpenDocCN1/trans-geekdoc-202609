  md: '# Continuous Optimization


    # Exercises


    7.1 Consider the univariate function


    $f(x) = x^3 + 6x^2 - 3x - 5.$


    Find its stationary points and indicate whether they are maximum, minimum, or
    saddle points.


    Given the function $f(x)$, we obtain the following gradient and Hessian,


    $\frac{df}{dx} = 3x^2 + 12x - 3$


    $\frac{d^2 f}{dx^2} = 6x + 12.$


    We find stationary points by setting the gradient to zero, and solving for $x$.
    One option is to use the formula for quadratic functions, but below we show how
    to solve it using completing the square. Observe that


    $(x + 2)^2 = x^2 + 4x + 4$


    and therefore (after dividing all terms by 3),


    $(x^2 + 4x) - 1 = ((x + 2)^2 - 4) - 1.$


    By setting this to zero, we obtain that


    $(x + 2)^2 = 5,$


    and hence


    $x = -2 \pm \sqrt{5}.$


    Substituting the solutions of $\frac{df}{dx} = 0$ into the Hessian gives


    $\frac{d^2 f}{dx^2}(-2 - \sqrt{5}) \approx -13.4\quad\text{and}\quad \frac{d^2
    f}{dx^2}(-2 + \sqrt{5}) \approx 13.4.$


    This means that the left stationary point is a maximum and the right one is a
    minimum. See Figure 7.1 for an illustration.


    7.2 Consider the update equation for stochastic gradient descent (Equation (7.15)).
    Write down the update when we use a mini-batch size of one.


    $\boldsymbol{\theta}_{i+1} = \boldsymbol{\theta}_i - \gamma_i (\nabla L(\boldsymbol{\theta}_i))^{\top}
    = \boldsymbol{\theta}_i - \gamma_i \nabla L_k(\boldsymbol{\theta}_i)^{\top}$


    where $k$ is the index of the example that is randomly chosen.


