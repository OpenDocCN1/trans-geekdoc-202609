  md: '+   - Compute $p(\mathbf{z})$, i.e., the mean $\boldsymbol{\mu}_z$ and the
    covariance $\boldsymbol{\Sigma}_z$. Derive your result in detail.


    Remark: Since $\boldsymbol{y}$ is Gaussian and $\boldsymbol{z}$ is a linear transformation
    of $\boldsymbol{y}$, $p(\boldsymbol{z})$ is Gaussian, too. Let''s compute its
    moments (similar to the “time update”):


    $$\boldsymbol{\mu}_z = \mathbb{E}_Z[\mathbf{z}] = \mathbb{E}_{Y,V}[\mathbf{C}\mathbf{y}
    + \mathbf{v}] = \mathbf{C}\mathbb{E}_Y[\mathbf{y}] + \underbrace{\mathbb{E}_V[\mathbf{v}]}_{=0}
    = \mathbf{C}\boldsymbol{\mu}_y.$$


    For the covariance matrix, we compute $$\boldsymbol{\Sigma}_z = \mathbb{E}_Z[\mathbf{z}\mathbf{z}^\top]
    - \mathbb{E}_Z[\mathbf{z}]\mathbb{E}_Z[\mathbf{z}]^\top = \mathbb{E}_{Y,V}[(\mathbf{C}\mathbf{y}+\mathbf{v})(\mathbf{C}\mathbf{y}+\mathbf{v})^\top]
    - \boldsymbol{\mu}_z\boldsymbol{\mu}_z^\top = \mathbb{E}_{Y,V}[\mathbf{C}\mathbf{y}\mathbf{y}^\top\mathbf{C}^\top
    + \mathbf{C}\mathbf{y}\mathbf{v}^\top + \mathbf{v}(\mathbf{C}\mathbf{y})^\top
    + \mathbf{v}\mathbf{v}^\top] - \boldsymbol{\mu}_z\boldsymbol{\mu}_z^\top.$$


    We use the linearity of the expected value, move all constants out of the expected
    value, and exploit the independence of $\mathbf{v}$ and $\mathbf{y}$: $$\boldsymbol{\Sigma}_z
    = \mathbf{C}\mathbb{E}_Y[\mathbf{y}\mathbf{y}^\top]\mathbf{C}^\top + \mathbb{E}_V[\mathbf{v}\mathbf{v}^\top]
    - \mathbf{C}\boldsymbol{\mu}_y\boldsymbol{\mu}_y^\top\mathbf{C}^\top,$$ where
    we used our previous result for $\boldsymbol{\mu}_z$. Note that $\mathbb{E}_V[\mathbf{v}]
    = \mathbf{0}$. We continue as follows: $$\boldsymbol{\Sigma}_y = \mathbf{C}\left(\underbrace{\mathbb{E}_Y[\mathbf{y}\mathbf{y}^\top]
    - \boldsymbol{\mu}_y\boldsymbol{\mu}_y^\top}_{=\boldsymbol{\Sigma}_x}\right)\mathbf{C}^\top
    + \mathbf{R} = \mathbf{C}\boldsymbol{\Sigma}_y\mathbf{C}^\top + \mathbf{R}.$$


    d. Now, a value $\hat{\mathbf{y}}$ is measured. Compute the posterior distribution
    $p(\mathbf{x} \mid \hat{\mathbf{y}})$. Hint for solution: This posterior is also
    Gaussian, i.e., we need to determine only its mean and covariance matrix. Start
    by explicitly computing the joint Gaussian $p(\mathbf{x}, \mathbf{y})$. This also
    requires us to compute the cross-covariances $\mathrm{Cov}_{x,y}[\mathbf{x}, \mathbf{y}]$
    and $\mathrm{Cov}_{y,x}[\mathbf{y}, \mathbf{x}]$. Then apply the rules for Gaussian
    conditioning.


    We derive the posterior distribution following the second hint since we do not
    have to worry about normalization constants: Assume, we know the joint Gaussian
    distribution $$p(\mathbf{x}, \mathbf{y}) = \mathcal{N}\left(\begin{pmatrix}\mathbf{x}\\
    \mathbf{y}\end{pmatrix} \bigg| \begin{pmatrix}\boldsymbol{\mu}_x\\ \boldsymbol{\mu}_y\end{pmatrix},
    \begin{pmatrix}\boldsymbol{\Sigma}_x & \boldsymbol{\Sigma}_{xy}\\ \boldsymbol{\Sigma}_{yx}
    & \boldsymbol{\Sigma}_y\end{pmatrix}\right), \tag{6.11}$$ where we defined $\boldsymbol{\Sigma}_{xy}
    := \mathrm{Cov}_{x,y}[\mathbf{x}, \mathbf{y}]$. Now, we apply the rules for Gaussian
    conditioning to obtain $$p(\mathbf{x} \mid \hat{\mathbf{y}}) = \mathcal{N}(\mathbf{x}
    \mid \boldsymbol{\mu}_{x \mid y}, \boldsymbol{\Sigma}_{x \mid y})$$ $$\boldsymbol{\mu}_{x
    \mid y} = \boldsymbol{\mu}_x + \boldsymbol{\Sigma}_{xy}\boldsymbol{\Sigma}_y^{-1}(\hat{\mathbf{y}}
    - \boldsymbol{\mu}_y)$$ $$\boldsymbol{\Sigma}_{x \mid y} = \boldsymbol{\Sigma}_x
    - \boldsymbol{\Sigma}_{xy}\boldsymbol{\Sigma}_y^{-1}\boldsymbol{\Sigma}_{yx}.$$'
