    # 6.3


    You have written a computer program that sometimes compiles and sometimes not
    (code does not change). You decide to model the apparent stochasticity (success
    vs. no success) $x$ of the compiler using a Bernoulli distribution with parameter
    $\mu$:


    $p(x\mid\mu)=\mu^x(1-\mu)^{1-x},\quad x\in\{0,1\}$.


    Choose a conjugate prior for the Bernoulli likelihood and compute the posterior
    distribution $p(\mu\mid x_1,\ldots,x_N)$.


    The posterior is proportional to the product of the likelihood (Bernoulli) and
    the prior (Beta). Given the choice of the prior, we already know that the posterior
    will be a Beta distribution. With a conjugate Beta prior $p(\mu)=\mathrm{Beta}(a,b)$
    obtain


    $$p(\mu\mid X)=\frac{p(\mu)p(X\mid\mu)}{p(X)}\propto \mu^{a-1}(1-\mu)^{b-1}\prod_{i=1}^{N}\mu^{x_i}(1-\mu)^{1-x_i}$$


    $$\propto \mu^{a-1+\sum_i x_i}(1-\mu)^{b-1+N-\sum_i x_i}\propto \mathrm{Beta}\left(a+\sum_i
    x_i,b+N-\sum_i x_i\right).$$


    Alternative approach: We look at the log-posterior. Ignoring all constants that
    are independent of $\mu$ and $x_i$, we obtain


    $$\log p(\mu\mid X)=(a-1)\log\mu+(b-1)\log(1-\mu)$$


    $$\qquad+\log\mu\sum_i x_i+\log(1-\mu)\sum_i(1-x_i)$$


    $$\qquad=\log\mu\left(a-1+\sum_i x_i\right)+\log(1-\mu)\left(b-1+N-\sum_i x_i\right).$$


    Therefore, the posterior is again $\mathrm{Beta}\left(a+\sum_i x_i,b+N-\sum_i
    x_i\right)$.


