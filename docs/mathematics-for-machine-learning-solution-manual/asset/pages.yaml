  md: 'By virtue of the Bézout theorem, this implies that ab and n are relatively
    prime, which ensures that the product \bar{a} \otimes \bar{b} is not equal to
    \bar{0} and belongs to \mathbb{Z}_n \setminus \{\bar{0}\}, which is thus closed
    under \otimes. The associativity and commutativity of \otimes are straightforward,
    but we need to show that every element has an inverse. First, the neutral element
    is \bar{1}. Let us again consider an element \bar{a} in \mathbb{Z}_n \setminus
    \{\bar{0}\} with a in \{1, ..., n-1\}. As a and n are coprime, the Bézout theorem
    enables us to define two integers u and v such that


    au + nv = 1, (2.3)


    which implies that au = 1 - nv and thus


    au = 1 mod n, (2.4)


    which means that \bar{a} \otimes \bar{u} = \bar{a}\bar{u} = \bar{1}, or that \bar{u}
    is the inverse of \bar{a}. Overall, (\mathbb{Z}_n \setminus \{\bar{0}\}, \otimes)
    is an Abelian group. Note that the Bézout theorem ensures the existence of an
    inverse without yielding its explicit value, which is the purpose of the extended
    Euclidean algorithm.


    # 2.3 Consider the set \mathcal{G} of 3 × 3 matrices defined as follows:


    \mathcal{G} = \left\{ \begin{bmatrix} 1 & x & z \\ 0 & 1 & y \\ 0 & 0 & 1 \end{bmatrix}
    \in \mathbb{R}^{3\times3} \mid x, y, z \in \mathbb{R} \right\}


    We define · as the standard matrix multiplication. Is (\mathcal{G}, ·) a group?
    If yes, is it Abelian? Justify your answer.


    +   - Closure: Let a, b, c, x, y and z be in \mathbb{R} and let us define A and
    B in \mathcal{G} as


    A = \begin{bmatrix} 1 & x & z \\ 0 & 1 & y \\ 0 & 0 & 1 \end{bmatrix}, B = \begin{bmatrix}
    1 & a & c \\ 0 & 1 & b \\ 0 & 0 & 1 \end{bmatrix}. Then, A · B = \begin{bmatrix}
    1 & x & z \\ 0 & 1 & y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} 1 & a & c \\
    0 & 1 & b \\ 0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} 1 & a+x & c+xb+z \\ 0 &
    1 & b+y \\ 0 & 0 & 1 \end{bmatrix}. Since a + x, b + y and c + xb + z are in \mathbb{R}
    we have A · B \in \mathcal{G}. Thus, \mathcal{G} is closed under matrix multiplication.


    +   - Associativity: Let \alpha, \beta and \gamma be in \mathbb{R} and let C in
    \mathcal{G} be defined as C = \begin{bmatrix} 1 & \alpha & \gamma \\ 0 & 1 & \beta
    \\ 0 & 0 & 1 \end{bmatrix}. It holds that (A · B) · C = \begin{bmatrix} 1 & a+x
    & c+xb+z \\ 0 & 1 & b+y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} 1 & \alpha
    & \gamma \\ 0 & 1 & \beta \\ 0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} 1 & \alpha
    + a + x & \gamma + \alpha\beta + x\beta + c + xb + z \\ 0 & 1 & \beta + b + y
    \\ 0 & 0 & 1 \end{bmatrix}.'
