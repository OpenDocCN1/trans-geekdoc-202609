    There are two bags. The first bag contains four mangos and two apples; the second
    bag contains four mangos and four apples.

    We also have a biased coin, which shows “heads” with probability 0.6 and “tails”
    with probability 0.4. If the coin shows “heads”, we pick a fruit at random from
    bag 1; otherwise we pick a fruit at random from bag 2.

    Your friend flips the coin (you cannot see the result), picks a fruit at random
    from the corresponding bag, and presents you a mango.

    What is the probability that the mango was picked from bag 2?


    *Hint: Use Bayes’ theorem.*


    We apply Bayes’ theorem and compute the posterior $p(b_2\mid m)$ of picking a
    mango from bag 2.


    $$p(b_2\mid m)=\frac{p(m\mid b_2)p(b_2)}{p(m)}$$'
