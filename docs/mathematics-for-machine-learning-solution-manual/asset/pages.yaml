  md: 'Looking at (6.11), it remains to compute the cross-covariance term Σ_xy (the
    marginal distributions p(x) and p(y) are known and Σ_yx = Σ_xy^T):


    Σ_xy = Cov[x, y] = E_{X,Y}[x y^T] - E_X[x] E_Y[y]^T = E_{X,Y}[x y^T] - μ_x μ_y^T,


    where μ_x and μ_y are known. Hence, it remains to compute


    E_{X,Y}[x y^T] = E_X[x (A x + b + w)^T] = E_X[x x^T] A^T + E_X[x] b^T = E_X[x
    x^T] A^T + μ_x b^T.


    With


    μ_x μ_y^T = μ_x μ_x^T A^T + μ_x b^T


    we obtain the desired cross-covariance


    Σ_xy = E_X[x x^T] A^T + μ_x b^T - μ_x μ_x^T A^T - μ_x b^T = (E_X[x x^T] - μ_x
    μ_x^T) A^T = Σ_x A^T.


    And finally


    μ_{x|y} = μ_x + Σ_x A^T (A Σ_x A^T + Q)^{-1} (y - A μ_x - b), Σ_{x|y} = Σ_x -
    Σ_x A^T (A Σ_x A^T + Q)^{-1} A Σ_x.


    # 6.13 Probability Integral Transformation


    Given a continuous random variable x, with cdf F_X(x), show that the random variable
    y = F_X(x) is uniformly distributed.


    Proof We need to show that the cumulative distribution function of Y defines a
    distribution of a uniform random variable. Recall that by the axioms of probability
    (Section 6.1) probabilities must be non-negative and sum/integrate to one. Therefore,
    the range of possible values of Y = F_X(x) is the interval [0, 1]. For any F_X(x),
    the inverse F_X^{-1}(x) exists because we assumed that F_X(x) is strictly monotonically
    increasing, which we will use in the following.


    Given any continuous random variable X, the definition of a cdf gives F_Y(y) =
    P(Y ≤ y) = P(F_X(x) ≤ y) transformation of interest = P(X ≤ F_X^{-1}(y)) inverse
    exists = F_X(F_X^{-1}(y)) definition of cdf = y, where the last line is due to
    the fact that F_X(x) composed with its inverse results in an identity transformation.
    The statement F_Y(y) = y along with the fact that y lies in the interval [0, 1]
    means that F_Y(x) is the cdf of the uniform random variable on the unit interval.'
