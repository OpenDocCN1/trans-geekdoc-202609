  md: '(i) Compute the symmetrized matrix \(A^{\mathsf T}A\). We first compute the
    symmetrized matrix


    \[

    A^{\mathsf T}A=

    \begin{bmatrix}2&-1\\2&1\end{bmatrix}

    \begin{bmatrix}2&2\\-1&1\end{bmatrix}

    =

    \begin{bmatrix}5&3\\3&5\end{bmatrix}.

    \tag{4.2}

    \]


    (ii) Find the right-singular vectors and singular values from \(A^{\mathsf T}A\).
    The characteristic polynomial of \(A^{\mathsf T}A\) is


    \[

    (5-\lambda)^2-9=\lambda^2-10\lambda+16=0.

    \tag{4.3}

    \]


    This yields eigenvalues, sorted from largest absolute first, \(\lambda_1=8\) and
    \(\lambda_2=2\). The associated normalized eigenvectors are respectively


    \[

    v_1=\begin{bmatrix}\frac{1}{\sqrt{2}}\\\frac{1}{\sqrt{2}}\end{bmatrix}

    \quad\text{and}\quad

    v_2=\begin{bmatrix}\frac{1}{\sqrt{2}}\\-\frac{1}{\sqrt{2}}\end{bmatrix}.

    \tag{4.4}

    \]


    We have thus obtained the right-singular orthogonal matrix


    \[

    V=[v_1,v_2]=

    \begin{bmatrix}

    \frac{1}{\sqrt{2}}&\frac{1}{\sqrt{2}}\\

    \frac{1}{\sqrt{2}}&-\frac{1}{\sqrt{2}}

    \end{bmatrix}.

    \tag{4.5}

    \]


    (iii) Determine the singular values. We obtain the two singular values from the
    square root of the eigenvalues \(\sigma_1=\sqrt{\lambda_1}=\sqrt{8}=2\sqrt{2}\)
    and \(\sigma_2=\sqrt{\lambda_2}=\sqrt{2}\). We construct the singular value diagonal
    matrix as


    \[

    \Sigma=

    \begin{bmatrix}\sigma_1&0\\0&\sigma_2\end{bmatrix}

    =

    \begin{bmatrix}2\sqrt{2}&0\\0&\sqrt{2}\end{bmatrix}.

    \tag{4.6}

    \]


    (iv) Find the left-singular eigenvectors. We have to map the two eigenvectors
    \(v_1,v_2\) using \(A\). This yields two self-consistent equations that enable
    us to find orthogonal eigenvectors \(u_1,u_2\):


    \[

    Av_1=(\sigma_1u_1v_1^{\mathsf T})v_1=\sigma_1u_1(v_1^{\mathsf T}v_1)=\sigma_1u_1=

    \begin{bmatrix}2\sqrt{2}\\0\end{bmatrix}.

    \]


    \[

    Av_2=(\sigma_2u_2v_2^{\mathsf T})v_2=\sigma_2u_2(v_2^{\mathsf T}v_2)=\sigma_2u_2=

    \begin{bmatrix}0\\\sqrt{2}\end{bmatrix}.

