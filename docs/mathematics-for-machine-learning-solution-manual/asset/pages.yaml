  md: "# 6.10  Derive the relationship in Section 6.5.2 in two ways:\n\n+   a. By\
    \ completing the square  \n+   b. By expressing the Gaussian in its exponential\
    \ family form\n\nThe *product* of two Gaussians $\\mathcal{N}(x\\mid a,A)\\mathcal{N}(x\\\
    mid b,B)$ is an unnormalized Gaussian distribution $c\\mathcal{N}(x\\mid c,C)$\
    \ with\n\n$$C=(A^{-1}+B^{-1})^{-1}$$\n$$c=C(A^{-1}a+B^{-1}b)$$\n$$c=(2\\pi)^{-D/2}|A+B|^{-1/2}\\\
    exp\\left(-\\frac{1}{2}(a-b)^\\top(A+B)^{-1}(a-b)\\right).$$\n\nNote that the\
    \ normalizing constant $c$ itself can be considered a (normalized) Gaussian distribution\
    \ either in $a$ or in $b$ with an “inflated” covariance matrix $A+B$, i.e., $c=\\\
    mathcal{N}(a\\mid b,A+B)=\\mathcal{N}(b\\mid a,A+B)$.\n\n# (i) By completing the\
    \ square, we obtain\n\n$$\\mathcal{N}(x\\mid a,A)=(2\\pi)^{-D/2}|A|^{-1/2}\\exp\\\
    left[-\\frac{1}{2}(x-a)^\\top A^{-1}(x-a)\\right],$$\n\n$$\\mathcal{N}(x\\mid\
    \ b,B)=(2\\pi)^{-D/2}|B|^{-1/2}\\exp\\left[-\\frac{1}{2}(x-b)^\\top B^{-1}(x-b)\\\
    right].$$\n\nFor convenience, we consider the log of the product:\n\n$$\\log\\\
    left(\\mathcal{N}(x\\mid a,A)\\mathcal{N}(x\\mid b,B)\\right)$$\n$$=\\log\\mathcal{N}(x\\\
    mid a,A)+\\log\\mathcal{N}(x\\mid b,B)$$\n$$=-\\frac{1}{2}\\left[(x-a)^\\top A^{-1}(x-a)+(x-b)^\\\
    top B^{-1}(x-b)\\right]+\\text{const}$$\n$$=-\\frac{1}{2}\\left[x^\\top A^{-1}x-2x^\\\
    top A^{-1}a+a^\\top A^{-1}a+x^\\top B^{-1}x-2x^\\top B^{-1}b+b^\\top B^{-1}b\\\
    right]+\\text{const}$$\n$$=-\\frac{1}{2}\\left[x^\\top(A^{-1}+B^{-1})x-2x^\\top(A^{-1}a+B^{-1}b)+a^\\\
    top A^{-1}a+b^\\top B^{-1}b\\right]+\\text{const}$$\n$$+\\text{const}$$\n$$=-\\\
    frac{1}{2}\\left[(x-(A^{-1}+B^{-1})^{-1}(A^{-1}a+B^{-1}b))^\\top(A^{-1}+B^{-1})\\\
    right.$$\n$$\\left.\\cdot(x-(A^{-1}+B^{-1})^{-1}(A^{-1}a+B^{-1}b))\\right]+\\\
    text{const}.$$\n\nThus, the corresponding product is $\\mathcal{N}(x\\mid c,C)$\
