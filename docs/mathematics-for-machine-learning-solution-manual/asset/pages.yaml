    # 2.2


    Let n be in ℕ\{0}. Let k, x be in ℤ. We define the congruence class k̄ of the
    integer k as the set


    k̄ = {x ∈ ℤ | x - k = 0 (mod n)}

    = {x ∈ ℤ | ∃a ∈ ℤ: (x - k = n · a)}.


    We now define ℤ/nℤ (sometimes written ℤ_n) as the set of all congruence classes
    modulo n. Euclidean division implies that this set is a finite set containing
    n elements:


    ℤ_n = {0̄, 1̄, …, n-1̄}


    For all ā, b̄ ∈ ℤ_n, we define


    ā ⊕ b̄ := a + b̄


    +   a. Show that (ℤ_n, ⊕) is a group. Is it Abelian?

    +   b. We now define another operation ⊗ for all ā and b̄ in ℤ_n as

    +   ā ⊗ b̄ = a × b̄, (2.2)

    +   where a × b represents the usual multiplication in ℤ.

    +   Let n = 5. Draw the times table of the elements of ℤ_5\{0̄} under ⊗, i.e.,
    calculate the products ā ⊗ b̄ for all ā and b̄ in ℤ_5\{0̄}. Hence, show that ℤ_5\{0̄}
    is closed under ⊗ and possesses a neutral element for ⊗. Display the inverse of
    all elements in ℤ_5\{0̄} under ⊗. Conclude that (ℤ_5\{0̄}, ⊗) is an Abelian group.

    +   c. Show that (ℤ_8\{0̄}, ⊗) is not a group.

    +   d. We recall that the Bézout theorem states that two integers a and b are
    relatively prime (i.e., gcd(a,b)=1) if and only if there exist two integers u
    and v such that au + bv = 1. Show that (ℤ_n\{0̄}, ⊗) is a group if and only if
    n ∈ ℕ\{0} is prime.


    a. We show that the group axioms are satisfied:


    +   - Closure: Let ā, b̄ be in ℤ_n. We have:

    +     ā ⊕ b̄ = a + b̄

    +     = (a + b) mod n

    +     by definition of the congruence class, and since [(a + b) mod n] ∈ {0, …,
    n - 1}, it follows that ā ⊕ b̄ ∈ ℤ_n. Thus, ℤ_n is closed under ⊕.'
