  mdcn: "\n## 关键稀土金属在膨胀蛭石上的吸附：通过响应曲面法和机器学习技术进行精确建模\n\nGiani de Vargas Brãoᵃ, Dison\
    \ Stracke Pfingsten Francoᵇ, Flávio Vasconcelos da Silvaᵃ,\nMeuris Gurgel Carlos\
    \ da Silvaᵃ, Melissa Gurgel Adeodato Vieiraᵃ,*\n\nᵃ University of Campinas – School\
    \ of Chemical Engineering, Albert Einstein Av., 500, Campinas, 13083-852, Brazil\
    \  \nᵇ Department of Civil and Environmental Engineering, Universidad de la Costa,\
    \ CUC, Calle 58 # 55–66, Barranquilla, Atlántico, Colombia\n\n![](img/5d65f0ec5722fc6f9a2e7757022006ea_0_0.png)\n\
    \n*通讯作者。* 电子邮箱地址：melissagav@feq.unicamp.br (M.G.A. Vieira).\n\n## 文章信息\n\n*关键词：*\n\
    \n- 镝\n- 吸附\n- 蛭石\n- RSM\n- 机器学习\n\n## 摘要\n\n镝等稀土金属（REM）的循环经济对于清洁能源和高科技领域的可持续未来至关重要。吸附技术因能够回收稀土金属并将其重新整合到生产链中而受到关注；然而，吸附过程的精确建模仍需解决，这阻碍了进一步的放大研究。因此，本文研究了Dy在膨胀蛭石上的吸附，并应用了新型经验方法，如人工神经网络（ANN）、自适应神经模糊推理系统（ANFIS）以及经典响应曲面法（RSM），对镝回收率随吸附剂粒径、质量和溶液pH的变化进行建模，而这些变量在吸附数学建模中常常被忽略。在本研究中，通过RSM方法考察了每个操作参数对Dy去除效率的影响，其中只有吸附剂投加量和pH是显著因素。因此，具有两个输入隶属函数（高斯型）的ANFIS是预测和建模镝去除效率最准确的方法（R²\
    \ = 0.99681）。此外，在最佳实验条件下（pH约为3.5，吸附剂质量为0.64 g），蛭石对镝的去除效率高达99.2%，表明工艺优化有效。吸附后的载镝蛭石通过织构和热性能表征，证实了材料的稳定性。因此，根据基本操作参数，对Dy在膨胀蛭石（一种低成本、易得且无毒的材料）上吸附的精确建模，可以提高吸附技术在稀土金属再浓缩和回收方面的成熟度。\n\
    \n## 1. 引言\n\n镝（Dy）是一种重稀土金属（REM），主要用于制造风力发电机和电动汽车中使用的永磁体（Nd-Fe-B）（Constantinides,\
    \ 2012），这意味着镝和稀土金属在发展可再生能源方面发挥着重要作用（Elshkaki and Graedel, 2014）。然而，不断增长的需求和供应风险使得从二次资源中回收稀土金属对于未来实现循环经济和可持续能源部门至关重要（Ambaye\
    \ et al., 2020）。通过湿法冶金路线回收稀土金属通常对稀溶液体系的分离性能较差，且存在环境问题（Yoon et al., 2016），而吸附是一种可靠、低成本和简单的工艺，可以解决这些问题（Costa\
    \ et al., 2020）。\n\n吸附效率和经济性与吸附剂的性质直接相关。目前，已有许多吸附剂用于回收稀土金属，例如粘土材料（Sáez et al.,\
    \ 2021）、改性沸石（Yue et al., 2021）、磷石膏（Hagag et al., 2019）、微生物生物质（Shen et al., 2021）、聚合物基吸附剂（Ali\
    \ et al., 2021; da Costa et al., 2022, 2021a, 2021b; Peng et al., 2021; Zhang\
    \ et al., 2020）。膨胀蛭石具有作为合适吸附剂的有利特性（Valkov and Simha, 2012），因为这种具有含水镁铝铁层状硅酸盐结构的粘土矿物具有高阳离子交换容量和大比表面积（Li\
    \ et al., 2021; Udodo et al., 2015）。此外，与合成路线复杂、成本高的工程吸附剂不同，蛭石是一种天然且经济的材料，适合大规模用于稀土回收（Li\
    \ et al., 2021）。\n\n吸附效率不仅取决于吸附剂的独特特性，还取决于不同的操作条件，如吸附剂质量、粒径、pH、温度、接触时间、吸附质浓度、干扰物存在等（Iftekhar\
    \ et al., 2018），而对操作参数对吸附性能影响的适当建模是实现工业规模的关键（Dotto and McKay, 2020）。文献中存在非常精确的现象学和经验模型来描述吸附动力学、平衡浓度（等温线）和热力学。然而，吸附剂质量、粒径和pH对吸附潜力的影响通常是通过单独考察每个效应来确定的，缺乏适当的建模。\n\
    \n因此，为了填补这一空白，经验方法和人工智能方法，如响应曲面法（RSM）、人工神经网络（ANN）和自适应神经模糊推理系统（ANFIS），已成功应用于吸附建模（Dolabadi\
    \ et al., 2018, 2020; Fan et al., 2017; Franco et al., 2020; Gokhale et al., 2020;\
    \ Igwegbe et al., 2019; Sivamani et al., 2022; Talib et al., 2019）。RSM是一种高效的工具，主要是因为它能仔细考察每个因素对目标响应的影响（Box\
    \ and Wilson, 1951）。然而，它不够通用，无法描述线性和二次关系之外的行为。而ANN和ANFIS等机器学习技术具有出色的学习算法性能，并能对不同非线性系统的输入输出关系进行高级区分（Franco\
    \ et al., 2020; Igwegbe et al., 2019; Talib et al., 2019），从而具有更高的预测能力。ANFIS是一种结合了模糊推理系统的神经网络，通常在速度、容错性和适应性方面具有优势（Jang,\
    \ 1993）。\n\n因此，本工作旨在利用RSM和机器学习方法的优势，通过改变pH、粒径和蛭石质量来研究和建模镝的去除，即通过响应曲面法仔细考察每个变量的影响，并通过机器学习对通常被忽略的操作参数对Dy吸附效率的影响进行精确建模。此外，本研究还打算通过织构和热表征分析评估吸附质-吸附剂相互作用，以评估蛭石在镝吸附中应用的可行性，这将有助于未来稀土回收行业的放大。\n\
    \n## 2. 材料与方法\n\n### 2.1. 吸附实验\n\n按照旋转中心复合设计（RCCD）进行了一系列实验，改变粒径、吸附剂质量和pH，以考察每个变量对Dy吸附效率的影响，并通过响应曲面法确定最佳操作条件。\n\
    \n仅针对RSM指出的显著参数进行了新的实验，这些数据是ANN和ANFIS的输入；这两种方法在稀土金属回收研究领域中很少应用，用于细化显著效应对去除率影响的建模。\n\
    \n本研究中使用的吸附剂——膨胀蛭石，由Brasil Minérios S/A生产。将材料通过一套筛网（40–12目）在振动底座（Produtest）上进行筛分，以分离不同粒度组分。镝溶液（3.0\
    \ mmol/L）由储备液制备，其中将5.0 g五水硝酸镝(III)（Aldrich，99.9%）溶解在100 mL酸化水（pH ≃ 5.0）中，并通过添加硝酸（0.1\
    \ mol/L）酸化。\n\n在恒温摇床（SI-600R Jeio Tech）中进行搅拌，固定参数为转速（200 rpm）、时间（24 h）、温度（25 °C）、体积（50\
    \ mL）和Dy³⁺溶液浓度（3 mmol/L）。加入几滴硝酸（0.1 mol/L）和氢氧化铵（0.1 mol/L）来控制实验的pH。选择吸附剂质量范围是为了确保工艺可行性（低吸附剂用量）。此外，pH范围基于可能含有Dy的废水典型pH（≳2.0）（Gergoric\
    \ et al., 2019; Riaño and Binnemans, 2015; Zhang and Xu, 2016）以及在水介质中可沉淀物种Dy(OH)₃形成的pH（≳6.0）。通过以4000\
    \ rpm离心10 min（CENCE L600离心机）分离固相（吸附剂），并用针头式过滤器（Macherey-Nagel，孔径0.45 μm）过滤上清液。使用原子吸收光谱仪（Shimadzu，AA7000）测量镝浓度。吸附容量（q）和去除率（%R）分别由公式（1）和（2）确定。\n\
    \n```\nq = (C₀ − C) Vsol / mads    (1)\n%R = (C₀ − C) / C₀ × 100    (2)\n```\n"
