    ### 3.2.2. 人工神经网络


    人工神经网络的最佳架构由输入层两个神经元、隐藏层三个神经元和输出层一个神经元组成（图5），用于通过改变蛭石质量和溶液pH预测Dy的去除率。该配置在测试过程中获得了最低的MSE（图S1，补充信息（SI））。学习曲线（图S2）显示，训练和验证误差降低到稳定点，其中训练、验证和测试的MSE分别为2.81×10⁻⁴、8.70×10⁻²和6.92×10⁻⁵。最佳权重为0.008、−0.710和1.302，偏置为1.947、−2.623和1.868。这些低误差意味着ANN得到了良好的训练和验证，从而在测试步骤中获得了良好的拟合。


    ![](img/5d65f0ec5722fc6f9a2e7757022006ea_7_0.png)


    **图5.** 人工神经网络架构。


    图6显示了训练、验证和检验的拟合结果，训练和验证的R分别为0.99970和0.99992，证实网络得到了充分训练。然而，测试中获得的R较低，为0.94175，这意味着尽管上述MSE较低（6.92×10⁻⁵），回归模型仍无法解释实际值与平均值之间的所有变异。因此，ANN通过数据得到了令人满意的训练，能够很好地预测Dy的去除率。然而，回归的泛化能力并不十分接近理想值（R=1）。


    ![](img/5d65f0ec5722fc6f9a2e7757022006ea_8_0.png)


    **图6.** 预测值与观测值对比（ANN）。


    图7展示了两个归一化输入（吸附剂质量和pH）在训练和测试中的函数拟合。对于训练（图7(a)和图7(b)），最佳拟合通常出现在最大去除率区域，即吸附剂用量较高（>0.64
