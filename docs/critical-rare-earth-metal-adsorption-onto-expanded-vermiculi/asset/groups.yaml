    # ARTICLE INFO\n\n+   - *Keywords:*  \n+   - Dysprosium  \n+   - Adsorption  \n\
    +   - Vermiculite  \n+   - RSM  \n+   - Machine learning\n\n# ABSTRACT\n\nThe\
    \ circular economy of rare earth metals (REM), such as dysprosium, is essential\
    \ for a sustainable future in clean energy and high-tech fields. Adsorption has\
    \ gained attention to recover and reintegrate REM into the productive chain; however,\
    \ accurate modeling of adsorptive processes still needs to be addressed, which\
    \ delays further scale-up studies. Thus, this paper studied the adsorption of\
    \ Dy on expanded vermiculite and applied novel empirical methods, such as artificial\
    \ neural networks (ANN) and adaptive neuro-fuzzy inference system (ANFIS), and\
    \ the classical response surface methodology (RSM) for modeling of dysprosium\
    \ recovery as a function of adsorbent size, mass, and pH of the solution, variables\
    \ often ignored in the mathematical modeling of adsorption. In our work, the effect\
    \ of each operational parameter on Dy removal efficiency was examined by the RSM\
    \ approach, in which only the adsorbent dosage and pH were the significant factors.\
    \ So, ANFIS with two input membership functions (Gaussian type) was the most accurate\
    \ procedure to predict and model the dysprosium removal efficiency (R² = 0.99681).\
    \ Also, vermiculite removed dysprosium with high efficiency (99.2%) under the\
    \ best experimental conditions, at pH around 3.5 and adsorbent mass of 0.64 g,\
    \ indicating an effective process optimization. The loaded vermiculite, after\
    \ the adsorption, was characterized by textural and thermal properties that confirmed\
    \ the stability of the material. Thus, according to basic operational parameters,\
    \ accurate modeling of the Dy adsorption on expanded vermiculite (a low-cost,\
    \ available, and non-toxic material) can improve adsorption technology's maturity\
    \ to reconcentrate and recover rare earth metals.\n\n# 1. Introduction\n\nDysprosium\
    \ (Dy) is heavy rare earth metal (REM) that is primarily used in the manufacturing\
    \ of permanent magnets (Nd-Fe-B) (Constantinides, 2012) used in wind turbines\
    \ and electric vehicles, meaning dysprosium and rare earth metals play an essential\
    \ role in developing renewable energy (Elshkaki and Graedel, 2014). However, increasing\
    \ demand and risk supply make REM recovery from secondary sources essential to\
    \ provide a circular economy and a sustainable energy sector in the future (Ambaye\
    \ et al., 2020). REM recovery by hydrometallurgical routes generally has poor\
    \ separation performance for dilute systems and environmental issues (Yoon et\
    \ al., 2016), which can be tackled through adsorption, a reliable, low-cost, and\
    \ simple process (Costa et al., 2020).\n\n*Corresponding author.*  \n*E-mail address:*\
    \ melissagav@feq.unicamp.br (M.G.A. Vieira)."
