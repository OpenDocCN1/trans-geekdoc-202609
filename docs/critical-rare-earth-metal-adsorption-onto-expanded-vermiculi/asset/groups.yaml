    **图7.** ANN在训练和测试中预测的镝去除率随吸附剂质量（a,c）和pH（b,d）的变化。


    ### 3.2.3. 自适应神经模糊推理系统


    研究了不同数量的输入隶属函数（高斯型），最简单的配置——输入1（吸附剂质量）使用2个MF，输入2（pH）使用2个MF——具有最强的预测能力，即在检验步骤中获得了最低的MSE（图S3和S4，SI）。该ANFIS设计的学习曲线（图S4）显示，训练和检验误差在达到稳定之前不断降低。图8展示了以吸附剂用量和介质pH为变量时，膨胀蛭石上镝去除率的最佳ANFIS架构，每个输入有2个高斯MF，形成4条规则，包含8个非线性参数和12个线性参数。ANFIS拟合的统计参数为：训练和检验的R²分别为0.99936和0.99681，MSE分别为2.71×10⁻⁴和2.61×10⁻⁴，表明与实验数据拟合极佳。


    训练（图9(a,c)）和检验（图9(b,d)）步骤中，两个输入的预测值与观测值对比（图9）表明，该网络得到了很好的训练，即ANFIS能够从输入数据中学习，从而产生较小的误差。此外，在检验中，网络在几乎所研究的全部吸附剂质量和pH范围内都精确地预测了Dy去除率，这对实际应用非常有利，因为在从酸性矿山排水、钕铁硼磁体浸出液、赤泥等二次资源中回收Dy的工厂中，pH可能发生突变。


    ![](img/5d65f0ec5722fc6f9a2e7757022006ea_9_0.png)


    **图8.** 最终ANFIS架构简化的图示。


    ![](img/5d65f0ec5722fc6f9a2e7757022006ea_9_1.png)


    **图9.** ANFIS在训练和检验中预测的镝去除率随吸附剂质量（a,c）和pH（b,d）的变化。


    ## 3.3. 总体讨论


    RSM是识别特定响应相关自变量的一种强大工具，由于其统计形式体系，可以获得关键信息，例如输入变量对响应变量的影响。本文中，RSM表明蛭石粒径对从水溶液中去除Dy的影响不显著，并指出了吸附剂质量和pH的重要性。此外，最佳的Dy去除发生在pH
    3.5和吸附剂质量0.64 g时。然而，将Dy的吸附效率作为这些参数的函数进行建模并不十分准确，而ANN和ANFIS则表现更好，这与其他吸附研究一致（Onu等，2021；Saber等，2021；Shojaeimehr等，2014）。这一结果可能与RSM建模的局限性有关，RSM预先假设了一个二次模型（二阶），而机器学习方法（ANN和ANFIS）则基于生物信息处理系统，由于非线性和对噪声的不敏感性，能够更好地拟合数据（Basheer和Hajmeer，2000；Franco等，2020）。


    在比较ANN和ANFIS的预测能力时，文献中反复表明，ANFIS在优化和预测吸附过程方面比ANN具有更好的响应（Onu等，2021；Souza等，2018；Wong等，2020）。由于ANFIS结合了神经网络的学习能力和模糊逻辑的推理能力，它汇集了两种方法的优势（Dolatabadi等，2020）；因此，在本研究中，ANFIS能够更好地预测和模拟镝去除率。


    因此，本研究表明，每个输入具有2个高斯MF的ANFIS可以将镝吸附效率建模为吸附剂性质（粒径和质量）和pH的函数。此外，由于ANFIS可以随时用新数据重新训练，这种建模策略对于放大过程具有实际意义。


    ## 3.4. 吸附剂表征


    吸附是一种界面现象；因此，吸附剂的织构性质在吸附潜力中起着重要作用。图10为负载镝的蛭石（V–Dy）上的物理氮吸附等温线，其形状为页硅酸盐滞后回线。它决定了可用于吸附的孔隙的面积、类型、形状和大小（Thommes等，2015），根据国际纯粹与应用化学联合会（IUPAC）的报告，该吸附等温线形状是IV型的一个特例，其中吸附分支为II型，脱附具有H3滞后回线。在高压P/P₀下N₂吸附没有平台，表明存在大孔（Sing和Williams，2004）。H3滞后回线是由板状颗粒的非刚性聚集体引起的，如某些粘土材料，包括蛭石（Boruah等，2019；Lowell等，2004）。


    根据压汞体积得到的孔隙分布（图11）是将孔隙视为开放狭缝获得的，这是蛭石等粘土矿物的典型特征（Anovitz和Cole，2015）。图11表明，V–Dy的中位压入体积为0.015
    cm³/g，孔径范围为2.5–20 μm，在10 μm处有更明显的峰。因此，在吸附镝之后，该材料表现出多样化的大孔分布。V–Dy的大孔体积为0.74 cm³/g，低于吸附前材料的0.96
    cm³/g（Brião等，2020）。


    负载吸附剂和原始膨胀蛭石的织构性质总结于表5。所评估的性质包括BET比表面积（S<sub>BET</sub>）、真密度（ρ）和堆密度（ρ<sub>bulk</sub>），以及颗粒孔隙率（ε<sub>p</sub>）。


    与吸附镝之前的吸附剂相比，V–Dy的S<sub>BET</sub>降至4.382 m²/g，这意味着比表面积损失了44.36%。V–Dy的真密度和堆密度分别为2.612和0.741
    g/cm³，均高于原始材料。材料密度的增加减少了空隙空间，并导致颗粒孔隙率降低至0.72。比表面积和孔隙率的降低以及密度的增加与膨胀蛭石结构的再水化效应（Kawano和Tomita，1991）以及镝在蛭石表面的有效吸附有关。膨胀蛭石是通过在900°C下热处理形成的，该处理使层间水蒸发，扩大了材料的层状空间，从而增加了比表面积。因此，当材料置于水溶液中时，再水化作用轻微压实了“手风琴”形状。此外，


    ![](img/5d65f0ec5722fc6f9a2e7757022006ea_10_0.png)


    **图10.** V–Dy上N₂吸附-脱附等温线。


