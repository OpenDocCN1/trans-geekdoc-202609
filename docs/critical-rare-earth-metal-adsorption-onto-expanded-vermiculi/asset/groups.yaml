    the isoelectric point was determined at pH = 2.5, i.e., at this pH value, the
    sum of the positive and negative charges on the vermiculite surface was zero (Duman
    and Tunç, 2008). When the pH > zero charge potential, the surface of the vermiculite
    is negatively charged, promoting an attraction of Dy³⁺ cations, which also justifies
    the positive effect of pH on the adsorption of dysprosium. The effect of pH can
    be evidenced by comparing the results of Table 1 (runs 13 and 14), where only
    pH was varied; at pH 1.3, the %R was 27.6%, and at pH 4.8, the %R was 98.9%.


    Table S3 presents the variance analysis (ANOVA) for the completed model with main
    and interaction effects. The complete model (Equation (3)) was significant with
    95% confidence, although the model considers the non-significant effects. It could
    be concluded by Fcal/Ftab = 3.7. The model adjusted the data with an R² of 0.9455
    and an adjusted determination coefficient (R²adj) of 0.8755. However, the ANOVA
    of the reduced model (Table 2) after the backward elimination (Equation (10)),
    i.e., elimination of the non-significant effects, showed an Fcal/Ftab = 10.8,
    an R² = 0.9217 and an R²adj = 0.8949. The estimated effects of the reduced model
    are available in Table S4 (supplementary material).


