    因此，V–Dy 的织构表征分析表明，由于再堆积（再水化）以及镝在蛭石表面的有效吸附，吸附剂降低了大孔的表面积和体积，并增加了堆积密度和真密度。热分析表明，层间离子交换机制在膨胀蛭石对镝的吸附中起着重要作用，这影响了材料的热稳定性。


    ## 4. 结论


    操作参数在典型的吸附过程建模中常常被忽略。本研究应用统计学方法（ANOVA/RSM）和人工智能方法（ANN 和 ANFIS），以颗粒尺寸、吸附剂质量和 pH
    为变量，使用膨胀蛭石预测水溶液中镝的去除率。此外，通过对负载镝的固体进行表征，对吸附过程进行了评估。


    RSM 指出，吸附剂质量和 pH 对镝的吸附效率具有统计学显著性。在 pH 3.5 和 0.64 g 吸附剂条件下获得最佳 %R 值。最终的 RSM 模型（排除了不显著的粒径效应）对数据的拟合
    R² 为 0.9217，但较高的验证误差（~7%）表明该模型在根据 pH 和吸附剂用量预测镝去除率时不够精确。采用 Levenberg-Marquardt
    反向传播算法训练的具有三个隐含神经元的 ANN 对数据的拟合 R 为 0.94175，比 RSM 更准确地预测了镝的吸附效率。尽管如此，由每个输入两个高斯隶属函数（MF）组成的
    ANFIS 在训练（0.99936）和校验（0.99681）中表现出更高的相关系数，显示出优于 ANN 的学习和泛化能力。


    关于负载镝蛭石的表征，负载后的吸附剂材料具有典型的层状硅酸盐层状结构，且孔分布不均匀。此外，与原始材料相比，吸附剂降低了 BET 比表面积（4.382 m²/g）和孔隙率（0.72），并提高了堆积密度（0.741
    g/cm³）和真密度（2.612 g/cm³）。因此，材料的织构性质（如比表面积）在整个过程中发生了变化；然而，热重分析表明，即使在吸附镝之后，蛭石仍具有较高的热稳定性。


    因此，蛭石是一种稳定的层状硅酸盐材料，能够从水溶液中高效吸附镝。ANFIS 能够准确模拟吸附剂质量和 pH 的影响，这有助于在进一步应用中改进过程控制并提高成本效益。


