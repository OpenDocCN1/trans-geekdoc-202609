    x_j + \varepsilon

    \tag{3}

    \]


    其中 \(Y\) 是预测响应（去除率），\(x_i\) 和 \(x_j\) 是自变量（CCD因子），\(\varepsilon\) 是随机误差，\(\beta_0\)、\(\beta_i\)、\(\beta_{ii}\)
    和 \(\beta_{ij}\) 分别是多项式系数（模型常数、线性系数、二次项系数和交叉项系数）。


    进行了补充分析，以理解pH在镝吸附机理中的作用：分析膨胀蛭石的zeta电位和镝的金属形态。使用SurPASS（Anton Paar）在醋酸铵电解质（1 mmol/L）中通过酸滴定（HNO₃
    0.5 mol/L）测量吸附剂的zeta电位。使用Visual Minteq软件模拟了镝的物种分布随pH的变化。


    一旦确定了pH、吸附剂质量和粒径的最佳条件，便进行了三次重复实验验证，保持与RCCD相同的转速（200 rpm）、初始浓度（3.0 mmol/L）和溶液体积（50
    mL），以验证RSM对镝在膨胀蛭石上吸附进行建模和优化的准确性。


    ## 2.3. 机器学习技术


    ANN和ANFIS的设计考虑了显著影响输出（Dy去除率）的输入变量。网络的开发和训练在MATLAB脚本中进行，共使用24个数据点。根据需要将数据归一化和反归一化。为避免局部最小值，对两种神经网络的不同架构进行了多次可预测性测试。


    ### 2.3.1. 人工神经网络


    人工神经网络（ANN）是一种具有互连节点的计算模型，其灵感来自人脑中的神经元或神经生物学（Izadkhah, 2022），能够追踪输入和输出参数之间的非线性关系。ANN架构由不同的层构成，如输入层、输出层和隐藏层。层中有管理算法训练的激活函数。每个神经元都有特定的权重和偏置值，这些值支配着优化过程（Ghaedi和Vafaei,
    2017）。因此，ANN可以用方程(4)进行数学表示（Paulletto等，2020）。


    \[

    Y = f_1\left(\sum_{j=1}^{n} w_{kj} f_2\left[\sum_{i=1}^{m} w_{ji}X_i+b_j\right]+b_k\right)

    \tag{4}

    \]


    其中 \(Y\) 是输出向量，\(X\) 是输入向量，\(w\) 和 \(b\) 是层间的权重和偏置，\(n\) 是隐藏层的神经元数量，\(m\) 是输入变量的数量，\(i,
    j, k\) 分别对应输入层、隐藏层和输出层。此外，\(f_1\) 和 \(f_2\) 分别是输出层和隐藏层的激活函数。


    本研究通过最小均方误差（MSE）分析了典型浅层神经网络中隐藏层具有不同神经元的ANN架构。Levenberg–Marquardt算法（Levenberg,
    1944; Marquardt, 1963）通常是最快的反向传播算法，是MATLAB 2018a软件中开发的网络架构的训练函数，并且作为标准的两层前馈网络，在隐藏层和输出层分别使用了激活函数“tansig”（方程(5)）和“purelin”（方程(6)）。在这种情况下，70%的数据被随机用于训练，15%用于验证，15%用于测试。


    \[

    f(x)=\frac{2}{1+e^{-2x}}-1

    \tag{5}

    \]


    \[

    f(x)=x

    \tag{6}

    \]


    ### 2.3.2. 自适应神经模糊推理系统


    最常见的神经模糊系统之一是由Jang（1993）提出的ANFIS系统，它结合了模糊逻辑和神经网络。如果模糊系统有期望的输入-输出数据集可用，则可以使用神经网络训练方法设计模糊模型的隶属函数（MF）和规则表（Bose,
    2021）。ANFIS结合了ANN和FIS的优点，并避免了它们的缺点。因此，它提供了更好的泛化性能，实现了高度非线性映射，并提供了稳定的解决方案（Shafiullah等，2022）。ANFIS网络由五层组成：模糊层、乘积层、归一化层、去模糊层和总输出层（Kurtgoz和Deniz,
    2018）。


    在本文中，应用于ANFIS的模糊推理系统是通过MATLAB 2018a的“genfis1”函数实现的，该函数使用所提供的输入和输出数据的网格划分返回Takagi-Sugeno型FIS（Takagi和Sugeno,
    1985）。高斯隶属函数（“gaussmf”）被应用于两个输入（方程(7)），因为该MF因其平滑性和简洁表示而被广泛使用（Hameed, 2011; Sadollah,
    2018）。


    \[

    f(x,\sigma,c)=e^{-\frac{(x-c)^2}{2\sigma^2}}

    \tag{7}

    \]


    其中 \(x\) 是输入，\(\sigma\) 和 \(c\) 是函数参数。


    评估了与最小MSE相关的隶属函数数量，以确定最佳ANFIS架构。70%的数据用于训练，30%用于随机检查（“randperm”函数）。使用混合方法（最小二乘估计和反向传播算法的组合）对网络进行模拟。去模糊化采用加权平均法；输出隶属函数为线性。


    ## 2.4. 数据相关性质量评估


    用于评估拟合优度的统计标准是决定系数（\(R^2\)）（方程(8)），它表示观测值与预测值之间的关系，以及MSE（方程(9)），它说明数据是否集中在最佳拟合曲线周围，即预测误差（Saber等，2021）。选择MSE标准是因为它是可微的，可以更好地优化，通过平方惩罚即使是微小的误差，并且对异常值非常敏感（Aditya
    Mishra, 2020）。选择后验指标\(R^2\)来验证目标中的总方差有多少由回归线中的方差解释（Hiregoudar, 2020）。


    \[

    R^2=1-\frac{\sum_{i=1}^{N}(y_i-\hat{y}_i)^2}{\sum_{i=1}^{N}(y_i-\bar{y})^2}

    \tag{8}

    \]


    \[

    MSE=\frac{1}{N}\sum_{i=1}^{N}(\hat{y}_i-y_i)^2

    \tag{9}

    \]


    其中 \(N\) 是实验点的数量，\(y_i\) 和 \(\hat{y}_i\) 分别是观测值和预测值，\(\bar{y}\) 是观测值的平均值。


    ## 2.5. 吸附剂表征


    考虑操作参数影响的吸附现象的精确建模通常被忽略。吸附后对吸附剂进行表征以验证材料稳定性的情况也是如此。在这项工作中，对负载镝的膨胀蛭石（V–Dy），即吸附后收集的固体样品，进行了织构和热性能表征。评估的织构性质包括Brunauer–Emmett–Teller比表面积（\(S_{BET}\)/m²/g）（Brunauer等，1938）（方程S1–S2，补充信息）、真实密度（\(\rho\)/g/cm³）和堆积密度（\(\rho_{bulk}\)/g/cm³）、颗粒孔隙率（\(\varepsilon_p\)，方程A3）。使用的仪器是ANOVA-e比表面积分析仪（Quantachrome）、Auto
    Pore IV压汞仪（Micromeritics）和Accu-pyc II 1340氦比重瓶（Micromeritics）。使用DTG-60（Shimadzu）进行了热重和差热分析，以研究材料吸附后的热稳定性。有关表征程序的更多细节可在表S1（补充信息）中找到。


    ## 3. 结果与讨论


    ### 3.1. 响应面方法


    旋转中心复合设计的吸附容量和Dy去除率结果如表1所示，其中%R范围从27.6%（第13次运行）到99.1%（第8次运行），q从0.08 mmol/g（第13次运行）到0.37
    mmol/g（第6次运行），表明各因素影响了响应变量（%R）和吸附容量。


    独立输入的标准化效应及其与响应变量（%R）的关系如图1（帕累托图）所示，以了解每个因素对响应的影响程度。当t值大于+2.365（自由度为7的学生t检验，且
    \(p < 0.05\)）时，效应被认为是显著的。在95%置信水平下显著影响%R的因素是：吸附剂用量（g）和pH，均以线性形式（B, C）和平方形式（B²,
    C²）出现。粒径（A, A²）以及因素之间的所有交互作用（AC, BC, AB）均不显著。估计效应的完整表格可在补充材料（表S2）中查阅。


    为了阐明pH对吸附质和吸附剂的影响，评估了Dy物种分布模拟（图2(a)）和材料的zeta电位（图2(b)）。对%R影响最大的是吸附剂质量（g），其次是pH，两者均为正效应。平方效应（B²,
    C²）小于线性效应且为负效应。吸附剂质量对%R的正效应可以得到解释。


