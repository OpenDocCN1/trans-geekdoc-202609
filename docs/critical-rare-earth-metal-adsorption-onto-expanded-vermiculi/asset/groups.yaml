  - "[PAGE 12]\n\nTherefore, the textural characterization analyses of V--Dy indicated\
    \ that the adsorbent reduced the surface area and volume of the macropores and\
    \ increased the bulk and real densities due to repacking (rehydration) and the\
    \ effective adsorption of dysprosium on the vermiculite surface. Thermal analyses\
    \ indicated that the interlayer ion-exchange mechanism plays a significant role\
    \ in the dysprosium uptake on expanded vermiculite, which influenced the material's\
    \ thermal stability.\n\n# ## 4. Conclusions\n\nOperational parameters are very\
    \ often neglected in typical adsorption process modeling. This work applied statistical\
    \ (ANOVA/RSM) and artificial intelligence (ANN and ANFIS) approaches to predict\
    \ the percentage of dysprosium removal from aqueous solution using expanded vermiculite\
    \ in the function of particle size, adsorbent mass, and pH. Moreover, the sorption\
    \ process was evaluated through the characterization of Dy-loaded-solid.\n\nThe\
    \ RSM pointed out that the adsorbent mass and pH are statistically significant\
    \ to the Dy adsorption efficiency. The optimal values of %R are obtained in pH\
    \ 3.5 and with 0.64 g of adsorbent. The final RSM model, excluding particle size\
    \ effect (insignificant), fitted the data with an R² of 0.9217, and a high validation\
    \ error (~7%) shows that the model is not precise enough in the Dy removal prediction\
    \ in the function of pH and adsorbent amount. ANN with three hidden neurons trained\
    \ using the Levenberg-Marquardt back-propagation algorithm fitted the data with\
    \ an R of 0.94175, predicting the efficiency of dysprosium adsorption more accurately\
    \ than RSM. Nonetheless, ANFIS, composed of 2 Gaussian MFs for each input, showed\
    \ a higher correlation coefficient in training (0.99936) and checking (0.99681),\
    \ demonstrating a superior capacity for learning and generalization than ANN.\n\
    \nRegarding the Dy-loaded vermiculite characterization, the loaded adsorbent material\
    \ has the typical layered structure of phyllosilicates, with non-uniform pore\
    \ distribution. Also, the adsorbent reduced the BET surface area (4.382 m²/g)\
    \ and porosity (0.72) and increased the bulk (0.741 g/cm³) and real (2.612 g/cm³)\
    \ densities compared to the pristine. Thus, textural properties of the material,\
    \ such as surface area, changed throughout the process; however, the thermogravimetric\
    \ analysis pointed to the high thermal stability of vermiculite even after dysprosium\
    \ adsorption.\n\nTherefore, vermiculite is a stable phyllosilicate material that\
    \ can uptake dysprosium efficiently from aqueous solutions. The adsorbent mass\
    \ and pH effects are modeled accurately by ANFIS, which can help improve process\
    \ control and cost-effectiveness in further applications.\n\n# **Author statement**\n\
