    \ modeling through response surface methodology and  \nmachine learning techniques\n\
    \nGiani de Vargas Brãoᵃ, Dison Stracke Pfingsten Francoᵇ, Flávio Vasconcelos da\
    \ Silvaᵃ,  \nMeuris Gurgel Carlos da Silvaᵃ, Melissa Gurgel Adeodato Vieiraᵃ,*\n\
    \nᵃ University of Campinas – School of Chemical Engineering, Albert Einstein Av.,\
