- pgno: 1
  md: 'The adsorption efficiency and cost-effectiveness are directly related to the
    nature of the adsorbent. Currently, many adsorbents have been used to recover
    REM, such as clay materials (Sáez et al., 2021), modified zeolites (Yue et al.,
    2021), phosphogypsum (Hagag et al., 2019), microbial biomass (Shen et al., 2021),
    polymer-based sorbents (Ali et al., 2021; da Costa et al., 2022, 2021a, 2021b;
    Peng et al., 2021; Zhang et al., 2020). Expanded vermiculite has beneficial properties
    as a suitable adsorbent (Valkov and Simha, 2012), as this clayey mineral with
    a hydrated magnesium-aluminum-iron phyllosilicate structure has a high cation
    exchange capacity and a large surface area (Li et al., 2021; Udodo et al., 2015).
    Besides, unlike the engineered adsorbents with a complex synthesis route and high
    cost, vermiculite is a natural and economical material for large-scale use in
    the recovery of rare earth (Li et al., 2021).


    The adsorption efficiency depends not only on the unique characteristics of the
    adsorbent but also on different operating conditions, such as adsorbent mass,
    particle size, pH, temperature, contact time, adsorbate concentration, presence
    of interferents, among others (Iftekhar et al., 2018), and proper modeling of
    the effect operational parameters on adsorption performance is essential to achieve
    industrial scales (Dotto and McKay, 2020). There are very accurate phenomenological
    and empirical models in the literature describing adsorption kinetics, equilibrium
    concentration (isotherms), and thermodynamics. Nevertheless, the influence of
    adsorbent mass, particle size, and pH on the adsorption potential is usually determined
    by investigating each effect individually without proper modeling.


    Thus, to fill this gap, empirical and artificial intelligence approaches, such
    as response surface methodology (RSM), artificial neural networks (ANN), and adaptive
    neuro-fuzzy inference system (ANFIS), have been successfully applied to adsorption
    modeling (Dolabadi et al., 2018, 2020; Fan et al., 2017; Franco et al., 2020;
    Gokhale et al., 2020; Igwegbe et al., 2019; Sivamani et al., 2022; Talib et al.,
    2019). The RSM is an efficient tool mainly because it scrutinizes the influence
    of each factor on the response of interest (Box and Wilson, 1951). Still, it is
    not versatile enough to describe behaviors beyond linear and quadratic relationships.
    Machine learning techniques such as ANN and ANFIS, in turn, have outstanding learning
    algorithm performance and an elevated ability to differentiate between the input
    and output relationships for diverse nonlinear systems (Franco et al., 2020; Igwegbe
    et al., 2019; Talib et al., 2019), which leads to a higher prediction capability.
    ANFIS, a neural network combined with a fuzzy inference system, generally has
    advantages in terms of superior speed, fault tolerance, and adaptability (Jang,
    1993).


    Thus, this work aims to investigate and model the removal of dysprosium by varying
    the pH, particle size, and mass of vermiculite by profiting from the advantages
    of both RSM and machine learning approaches, i.e., scrutinize the effect of each
    variable by response surface methodology and provide accurate modeling of the
    operational parameters, usually neglected, on the Dy adsorption efficiency by
    machine learning. Furthermore, the study intends to evaluate the adsorbate-adsorbent
    interaction by textural and thermal characterization analyses to assess the feasibility
    of applying vermiculite in dysprosium adsorption, which would contribute to the
    future scale-up of the REM recovery sector.


    # 2. Materials and methods


    # 2.1. Adsorption experiments


    A series of experiments were done following a rotational central composite design
    (RCCD) varying particle size, adsorbent mass, and pH to scrutinize the effect
    of each variable over the Dy adsorption efficiency and to determine the best operational
    conditions by response surface methodology.


    New experiments were performed varying just the significant parameters pointed
    by the RSM, and this data was the input for ANN and ANFIS, approaches rarely applied
    in the recovery of rare earth metals research field, used to refine the modeling
    of the significant effects over the removal percentage.


    The adsorbent used in this study, the expanded vermiculite, was produced by Brasil
    Minérios S/A. The material was sieved to separate different granulometric fractions
    through a set of sieves (40–12 mesh) on a vibrating base (Produtest). A dysprosium
    solution (3.0 mmol/L) was prepared from a stock solution in which 5.0 g of dysprosium
    (III) pentahydrate nitrate (Aldrich, 99.9%) was dissolved in 100 mL of acidified
    water (pH ≃ 5.0) by addition of nitric acid (0.1 mol/L).


    The agitation was done in an incubator shaker (SI-600R Jeio Tech), in which the
    fixed parameters were rotation (200 rpm), time (24 h), temperature (25 °C), volume
    (50 mL), and concentration of the Dy3+ solution (3 mmol/L). A few drops of nitric
    acid (0.1 mol/L) and ammonium hydroxide (0.1 mol/L) were added to control the
    pH of the experiment. The adsorbent mass range was chosen to ensure process availability
    (low amounts of adsorbent). Furthermore, the pH range was based on the typical
    pH of effluents that may contain Dy (≳2.0)(Gergoric et al., 2019; Riaño and Binnemans,
    2015; Zhang and Xu, 2016) and on the pH of the Dy(OH)3, precipitable specie, formation
    in an aqueous medium (≳6.0). The solid phase (adsorbent) was separated by centrifugation
    at 4000 rpm for 10 min (CENCE L600 centrifuge), and the supernatant was filtrated
    with a syringe filter (Macherey-Nagel, porous of 0.45 μm). Dysprosium concentration
    was measured using atomic absorption spectroscopy (Shimadzu, AA7000). The adsorption
    capacity (q) and the removal percentage (%R) were determined by Equations (1)
    and (2), respectively.


    ```

    q = (C0 − C) Vsol / mads  (1)

    ```


    ```

    %R = (C0 − C) / C0 × 100  (2)

    ```'
