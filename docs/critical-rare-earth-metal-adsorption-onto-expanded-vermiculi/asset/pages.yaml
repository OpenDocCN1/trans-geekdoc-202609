    # 3.2.2. Artificial neural network


    Two neurons in the input layer, three in the hidden layer, and one in the output
    layer composed the best architecture of the artificial neural network (Fig. 5)
    to predict the removal of Dy by varying the mass of vermiculite and the pH of
    the solution. This configuration achieved the lowest MSE in the test procedure
    (Fig. S1, Supplementary Information (SI)). The leaning curve (Fig. S2) showed
    that the training and validation error decreased to the point of stability, in
    which the MSE for training, validation, and test were, respectively, 2.81 x 10⁻⁴,
    8.70 x 10⁻², 6.92 x 10⁻⁵. The optimal weights were 0.008, −0.710, and 1.302, and
    the biases were 1.947, −2.623, and 1.868. These low errors mean that the ANN was
    well-trained and validated, which led to a good fit in the test step.


    Fig. 6 shows the fitting results of the training, validation, and check, which
    high R of the training and validation 0.99970 and 0.99992, respectively, corroborates
    that the network was trained adequately. However, a lower R = 0.94175 was achieved
    in the test, which means that the regression model could not explain all the variation
    of the actual values from the mean value, despite the low MSE mentioned above
    (6.92 x 10⁻⁵). Thus, the ANN was trained satisfactorily by the data and could
    predict well the Dy removal. However, the generalization by the regression was
    not very close to the ideal (R = 1).


    Fig. 7 represents the function fit for both normalized inputs, adsorbent mass
    (Fig. 7(a,c)), and pH (Fig. 7 (b,d)) for training and testing. For the training
    (Fig. 7 (a) and Fig. 7 (b)), the best fit occurred, in general, in the region
    of the maximum removal percentage, at a higher adsorbent dosage (> 0.64 g) and
    pH between 3.0 and 5.0. In the test, the predicted (output) and the target values
    presented low errors between them (Fig. 7 (c) and Fig. 7 (d)), mainly for the
    highest removal percentages, which agrees with the


