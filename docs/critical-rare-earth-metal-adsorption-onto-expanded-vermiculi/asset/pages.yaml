- pgno: 3
  md: 'and provides stable solutions (Shafiullah et al., 2022). ANFIS network comprises
    five layers: fuzzy layer, product layer, normalized layer, de-fuzzy layer, and
    total output layer (Kurtgoz and Deniz, 2018).


    In this paper, the fuzzy interference system applied to ANFIS was implemented
    through the “genfis1” function of MATLAB 2018a that returns a Takagi-Sugeno type
    FIS (Takagi and Sugeno, 1985) using a grid partition of the input and output data
    provided. The Gaussian membership function (“gaussmf”) was applied to both inputs
    (Equation (7)) since this MF is widely used due to its smoothness and concise
    notation (Hameed, 2011; Sadollah, 2018).


    $$f(x,\sigma,c)=e^{-\frac{(x-c)^2}{2\sigma^2}}$$  \hfill (7)


    Where x is the input and σ and c are the function parameters.


    The number of membership functions referring to the minimal MSE was evaluated
    to determine the best ANFIS architecture. 70% of the data was used for training
    and 30% for checking randomly ("randperm" function). The network was simulated
    using the hybrid method, the combination of least-squares estimation, and the
    backpropagation algorithm. The defuzzification was done by the weighted average
    method; and the output membership functions were linear.


    # 2.4. *Assessment of data correlation quality*


    The statistical criteria to estimate the goodness of fit were the coefficient
    of determination ($R^2$) (Equation (8)), which indicates the relationship between
    observed and predicted values, and the MSE (Equation (9)), which informs whether
    the data are concentrated around the best fit curve, prediction error (Saber et
    al., 2021). The MSE criteria were selected because it is differentiable, can be
    optimized better, penalizes even minor errors by squaring them, and is very sensitive
    to outliers (Aditya Mishra, 2020). The post-metric $R^2$ was chosen to verify
    how much of the total variance in the target is explained by variance in the regression
    line (Hiregoudar, 2020).


    $$R^2=1-\frac{\sum_{i=1}^{N}(y_i-\hat{y}_i)^2}{\sum_{i=1}^{N}(y_i-\bar{y})^2}$$  \hfill
    (8)


    $$MSE=\frac{1}{N}\sum_{i=1}^{N}(\hat{y}_i-y_i)^2$$  \hfill (9)


    Where N is the number of experimental points, $y_i$ and $\hat{y}_i$ are observed
    and predicted values, respectively, and $\bar{y}$ is the mean of the observed
    values.


    # 2.5. *Adsorbent characterization*


    Accurate modeling of adsorption phenomena considering the effect of operational
    parameters is usually ignored. The same occurs with the characterization of the
    adsorbent after sorption to verify the stability of the material. In this work,
    expanded vermiculite loaded with dysprosium (V–Dy), the solid sample collected
    after adsorption, was characterized in terms of textural and thermal properties.
    The textural properties evaluated are the Brunauer–Emmett–Teller surface area
    ($S_{BET}$/m²/g) (Brunauer et al., 1938) (Equations S1–S2, Supplementary Information),
    real (ρ/g/cm³) and bulk (ρbulk/g/cm³) densities, particle porosity (εp, Equation
    A3). The instruments used were an ANOVA-e surface area analyzer (Quantachrome),
    Auto Pore IV mercury porosimeter (Micromeritics), and Accu-pyc II 1340 Helium
    pycnometer (Micromeritics). A thermogravimetric and differential thermal analysis
    by DTG-60 (Shimadzu) was conducted to investigate the material''s thermal stability
    after adsorption. More details on the characterization procedure can be found
    in Table S1 (Supplementary Information).


    # 3. Results and discussion


    # 3.1. *Response surface methodology*


    The results of adsorption capacity and percentage of Dy removal of the rotational
    central composite design are exhibited in Table 1, in which the %R wide-ranging
    from 27.6% (run 13) to 99.1% (run 8), and the q passed from 0.08 mmol/g (run 13)
    to 0.37 mmol/g (run 6), indicating that the factors affected the response variable
    (%R) and the adsorption capacity.


    The standardized effects of the independent inputs and their relations to the
    response variable (%R) are presented in Fig. 1 (Pareto Chart) to understand how
    much each factor affected the response. Effects were considered significant when
    the t-value was greater than +2.365 (t-student test for seven degrees of freedom
    (fd) and had p < 0.05). Factors significantly affected the %R with 95% confidence
    were: the amount of adsorbent (g) and pH, both in linear form (B, C) and squared
    form (B², C²). Particle size (A, A²), and all interactions between factors (AC,
    BC, AB) were insignificant. The complete table of the estimated effects can be
    consulted in the supplementary material (Table S2).


    A simulation of Dy speciation (Fig. 2 (a)) and the zeta potential of the material
    (Fig. 2 (b)) were evaluated to elucidate the effect of pH on the adsorbate and
    adsorbent. The highest effect on %R was the adsorbent mass (g) followed by pH,
    both positive. The squared effects (B², C²) were smaller than the linear and negative
    ones. The positive effect of the adsorbent mass on the %R can be explained'
