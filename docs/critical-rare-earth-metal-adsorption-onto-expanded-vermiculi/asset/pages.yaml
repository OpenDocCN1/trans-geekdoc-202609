  md: 'because the adsorbent dosage increases the available sites to adsorb metallic
    ions. While the positive effect of pH is due to the increase in the negative charge
    of vermiculite with the intensification of pH, which improves the electrostatic
    attraction of the cations.


    The species in solution in the pH range studied (1.3 until 4.7) are essentially
    Dy³⁺ and H⁺ (Fig. 2(a)). For pH < 2.9, hydrogen is the dominant species in the
    medium, while for pH > 2.9, the Dy³⁺ has the highest concentration in the medium.
    As the pH increases, the H⁺ concentration drops to zero (pH ~ 5.0). This behavior
    explains the positive effect of pH for the adsorption of Dy, since the augment
    in pH diminishes the competition between Dy³⁺ and H⁺ for the known negatively
    charged sorption sites of vermiculite. In the analysis of vermiculite zeta potential
    (Fig. 2(b)), the isoelectric point was determined at pH = 2.5, i.e., at this pH
    value, the sum of the positive and negative charges on the vermiculite surface
    was zero (Duman and Tunç, 2008). When the pH > zero charge potential, the surface
    of the vermiculite is negatively charged, promoting an attraction of Dy³⁺ cations,
    which also justifies the positive effect of pH on the adsorption of dysprosium.
    The effect of pH can be evidenced by comparing the results of Table 1 (runs 13
    and 14), where only pH was varied; at pH 1.3, the %R was 27.6%, and at pH 4.8,
    the %R was 98.9%.


    Table S3 presents the variance analysis (ANOVA) for the completed model with main
    and interaction effects. The complete model (Equation (3)) was significant with
    95% confidence, although the model considers the non-significant effects. It could
    be concluded by Fcal/Ftab = 3.7. The model adjusted the data with an R² of 0.9455
    and an adjusted determination coefficient (R²adj) of 0.8755. However, the ANOVA
    of the reduced model (Table 2) after the backward elimination (Equation (10)),
    i.e., elimination of the non-significant effects, showed an Fcal/Ftab = 10.8,
    an R² = 0.9217 and an R²adj = 0.8949. The estimated effects of the reduced model
    are available in Table S4 (supplementary material).


    The increase of the F-test value from 3.7 to 10.8, and the R²adj from 0.8755 to
    0.8949 indicated that the reduced model is more significant than the completed
    model. The reduced model was chosen to represent the %R because it presented Fcal/Ftab
    > 10; a ratio recommended in the literature to consider a helpful regression for
    forecasting purposes (de Barros Neto et al., 2010). The observed versus predicted
    values (Fig. 3) and the response surface (Fig. 4) were based on the %R model of
    Equation (10) for normalized values of B (adsorbent mass) and C (pH).


    ```

    %R = 96.58 + 16.74B + 14.91C − 10.09B² − 10.90C²  (10)

    ```


    Fig. 3 indicated that the model predicted the data better for high %R values than
