  md: '# ### 3.3. Overall discussion


    The RSM is a powerful tool to identify the relevant independent variables for
    specific responses, where critical information can be obtained due to its statistical
    formalism, such as the effect of the input variables on the response variable.
    In this paper, the RSM showed that the vermiculite particle size was insignificant
    for the removal of Dy from aqueous solutions and pointed out the great relevance
    of the adsorbent mass and pH. Also, the best Dy removal occurred at pH 3.5 and
    an adsorbent mass of 0.64 g. However, modeling the adsorption efficiency of Dy
    as a function of these parameters was not very accurate, as ANN and ANFIS, which
    is in agreement with other adsorption studies (Onu et al., 2021; Saber et al.,
    2021; Shojaeimehr et al., 2014). This result may be related to the limitation
    of the RSM modeling, which assumes beforehand a quadratic model (second-order),
    unlike the machine learning approaches (ANN and ANFIS), which are based on the
    biological information processing system that allows a better fit to the data
    due to the non-linearity and noise insensitivity (Basheer and Hajmeer, 2000; Franco
    et al., 2020).


    When comparing the predictability of ANN and ANFIS, repeatedly in the literature,
    ANFIS has a better response than ANN for optimizing and predicting adsorptive
    processes (Onu et al., 2021; Souza et al., 2018; Wong et al., 2020). As ANFIS
    combines a neural network learning proficiency and fuzzy logic reasoning abilities,
    it groups advantages from both methodologies (Dolatabadi et al., 2020); thus,
    ANFIS could better predict and model the percentage of dysprosium removal in this
    study.


    Therefore, this study showed that ANFIS with 2 Gaussian MFs for each input could
    model the efficiency of dysprosium adsorption as a function of adsorbent properties
    (size and mass) and pH. Also, since the ANFIS can be retrained at any time with
    new data, this modeling strategy is relevant for scale-up processes.


    # ### 3.4. Adsorbent characterization


    Adsorption is an interfacial phenomenon; consequently, the textural properties
    of the adsorbent play an essential role in the adsorption potential. Fig. 10,
    the isotherm of physical nitrogen sorption on dysprosium-loaded vermiculite (V–Dy),
    takes the shape of phyllosilicates hysteresis. It determines the area, type, form,
    and size of pores available for the adsorption (Thommes et al., 2015), in a report
    by the International Union of Pure and Applied Chemistry (IUPAC), the sorption
    isotherm shape is a particular case of type IV, in which the adsorption branch
    is of type II, and the desorption has an H3 hysteresis loop. The N₂ adsorption
    without plateau at high P/P₀ indicates the presence of macropores (Sing and Williams,
    2004). The H3 loop is caused by non-rigid aggregates of plate-like particles as
    certain clay materials, including vermiculite (Boruah et al., 2019; Lowell et
    al., 2004).


    The porous distribution according to the volume of mercury intruded (Fig. 11)
    was obtained considering the pores as open slits, typical of clay minerals such
    as vermiculite (Anovitz and Cole, 2015). Fig. 11 demonstrates that V–Dy has a
    median intrusion volume of 0.015 cm³/g along with a range of 2.5–20 μm, with a
    more pronounced peak at 10 μm. Thus, after the adsorption of dysprosium, the material
    showed a diversified distribution of macropores. The volume of V–Dy macropores
    is 0.74 cm³/g, lower than that of the material before adsorption (0.96 cm³/g)
    (Brião et al., 2020).


    The textural properties of the loaded adsorbent and virgin expended vermiculite
    are summarized in Table 5. The properties evaluated are BET surface area (S<sub>BET</sub>),
    real (ρ) and bulk (ρ<sub>bulk</sub>) densities, and particle porosity (ε<sub>p</sub>).


    The S<sub>BET</sub> of V–Dy was reduced to 4.382 m²/g in relation to the adsorbent
    before the adsorption of dysprosium, which means a loss of 44.36% of the surface
    area. V–Dy''s real and bulk densities were 2.612 and 0.741 g/cm³, both higher
    than the original. The increase in material density diminishes the void spaces
    and leads to a lower porosity of the particles of 0.72. This reduction in surface
    area, porosity, and density increment are related to the rehydration effect on
    the expanded vermiculite structure (Kawano and Tomita, 1991) and the effective
    adsorption of dysprosium on the vermiculite surface. The expanded vermiculite
    was formed by thermal treatment at 900 °C, which vaporized the interlayer water
    and enlarged the lamellar spaces of the material, increasing the surface area.
    Therefore, the rehydration slightly compacted the “accordion” shape when the material
    was placed in an aqueous solution. In addi-


