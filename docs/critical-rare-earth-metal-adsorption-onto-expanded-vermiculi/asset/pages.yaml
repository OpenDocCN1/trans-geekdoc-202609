  md: "Where $C_0$ is the initial concentration (mmol/L), $C$ is the concentration\
    \ after a specific contact time (mmol/L), $V_{ol}$ is the volume of the metallic\
    \ solution (L), and $m_{ads}$ is the adsorbent mass (g).\n\n# ## 2.2. Response\
    \ surface methodology\n\nMultiple factors potentially affect the adsorption process.\
    \ Therefore, in this study, particle size (A), adsorbent mass (B), and pH (C)\
    \ were varied by a rotational central composite design (RCCD) to optimize the\
    \ %R (response variable). Seventeen runs were carried out following the RCCD,\
    \ consisting of eight factorial points, six axial points, and three central points.\
    \ RSM was applied to this dataset.\n\nThe RSM is widely applied to optimize products\
    \ and processes, as it allows the discovery of significant factors, accurate modeling,\
    \ and optimization (Costa et al., 2011). In the present study, the analysis of\
    \ variance (ANOVA) test, with a significance level of 0.05, and the surfaces response\
    \ were performed using the Statistica software version 7.0 (StatSoft, Inc.). An\
    \ empiric-squared model (Equation (3)) was initially fitted to the data, and backward\
    \ elimination was conducted to enhance the adjustment.\n\n$$Y = \\beta_0 + \\\
    sum_{i=1}^{k}\\beta_i x_i + \\sum_{i=1}^{k}\\beta_{ii}x_i^2 + \\sum_{i=1}^{k}\\\
    sum_{j=1}^{k}\\beta_{ij}x_i x_j + \\varepsilon$$  \n(3)\n\nWhere $Y$ is the predicted\
    \ response (removal percentage), $x_i$ and $x_j$ are the independent variables\
    \ (CCD factors), $\\varepsilon$ is the random error, and $\\beta_0$, $\\beta_i$,\
    \ $\\beta_{ii}$, and $\\beta_{ij}$ are the polynomial coefficients (model constant,\
    \ linear coefficient, quadratic coefficient, and cross-product coefficient, respectively).\n\
    \nComplementary analyses were done to comprehend the role of pH in the mechanism\
    \ of dysprosium adsorption: analysis of the expanded vermiculite zeta potential\
    \ and the metallic speciation of dysprosium. The zeta potential of the adsorbent\
    \ was measured by acid titration (HNO₃ 0.5 mol/L) in ammonium acetate electrolyte\
    \ (1 mmol/L) using a SurPASS (Anton Paar). The dysprosium species distribution\
    \ as a pH function was simulated using Visual Minteq software.\n\nOnce the optimal\
    \ conditions of pH, mass of adsorbent, and particle size were defined, an experimental\
    \ validation was carried out in triplicate, maintaining the same rotation speed\
    \ (200 rpm), initial concentration (3.0 mmol/L), and solution volume (50 mL) of\
    \ the RCCD, to verify the accuracy of the RSM to model and optimize the adsorption\
    \ of dysprosium on expanded vermiculite.\n\n# ## 2.3. Machine learning techniques\n\
    \nThe ANN and ANFIS were designed considering the significant input variables\
    \ on the output (Dy removal percentage). The development and training of the networks\
    \ were performed in MATLAB scripts using a total data of 24 points. The data were\
    \ normalized and denormalized as needed. Different architectures of both neural\
    \ networks were tested several times regarding their predictability to avoid local\
    \ minimum.\n\n# ### 2.3.1. Artificial neural network\n\nArtificial neural networks\
    \ (ANNs) are computational models with interconnected nodes inspired by neurons\
    \ in the human brain or neural biology (Izadkhah, 2022) that can trace nonlinear\
    \ relationships between input and output parameters. ANN architectures are constructed\
    \ by different layers, such as input, output, and hidden layers. In the layers,\
    \ there are activation functions that manage the training in the algorithm. Each\
    \ neuron has specific weight and bias values that rule the optimization procedure\
    \ (Ghaedi and Vafaei, 2017). Therefore, ANN can mathematically be represented\
    \ by Equation (4) (Paulletto et al., 2020).\n\n$$Y = f_1\\left(\\sum_{j=1}^{n}\
    \ w_{kj} f_2\\left[\\sum_{i=1}^{m} w_{ji}X_i+b_j\\right]+b_k\\right)$$  \n(4)\n\
    \nWhere Y is the output vector, X is the input vector, w and b are the weights\
    \ and biases between the layers, n is the number of neurons at hidden layers,\
    \ m is the number of inputs variables, and i, j, and k corresponds to the input,\
    \ hidden and output layers, respectively. Besides, $f_1$ and $f_2$ are the activation\
    \ functions at the output and hidden layers, respectively.\n\nThis work analyzed\
    \ ANN architectures with different neurons in the hidden layer, in a typical shallow\
    \ neural network, by the minimum mean square error (MSE). The Levenberg–Marquardt\
    \ algorithm (Levenberg, 1944; Marquardt, 1963), often the fastest back-propagation\
    \ algorithm, was the training function of the network architectures developed\
    \ in MATLAB 2018a software, and the activation function “tansig” (Equation (4))\
    \ and “purelin” were used at the hidden and output layers, respectively, as a\
    \ standard two-layer feedforward network. In this case, 70% of the data were used\
    \ randomly for training, 15% for validation, and 15% for test.\n\n$$f(x)=\\frac{2}{1+e^{-2x}}-1$$\
    \  \n(5)\n\n$$f(x)=x$$  \n(6)\n\n# ### 2.3.2. The adaptive neuro-fuzzy inference\
    \ system\n\nOne of the most common neuro-fuzzy systems is the ANFIS system introduced\
    \ by (Jang, 1993), which combines fuzzy logic and neural network. If the desired\
    \ input-output data sets are available for a fuzzy system, the membership function\
    \ (MF) and rule table for a fuzzy model can be designed using the neural network\
    \ training method (Bose, 2021). ANFIS combines the advantages of the ANN and FIS\
    \ and avoids their shortcomings. Therefore, it provides better generalization\
    \ performance, archives highly nonlinear mapping,"
