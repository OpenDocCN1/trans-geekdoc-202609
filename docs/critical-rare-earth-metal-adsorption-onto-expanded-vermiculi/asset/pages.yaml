    # 3.2.3. The adaptive neuro-fuzzy inference system


    Different numbers of input membership functions (Gaussian type) were investigated,
    and the most simple configuration, 2 MF for input 1 (adsorbent mass) and 2 MF
    for input 2 (pH), was the most predictive, i.e., achieved the lowest MSE in the
    check step (Figs. S3 and SI). The learning curve of this ANFIS design (Fig. S4)
    shows that the training and check errors were reduced until the stabilization.
    Fig. 8 represents the best ANFIS architecture for the percentage of dysprosium
    removal on expanded vermiculite in terms of adsorbent amount and medium pH, with
    2 Gaussian MF for each input, creating four rules, with eight nonlinear and 12
    linear parameters. The statistical parameters for the ANFIS fit are R² of 0.99936
    and 0.99681, and MSE of 2.71 x 10⁻⁴ and 2.61 x 10⁻⁴ for training and checking,
    respectively, which indicates the excellent fit to the experimental data.


    The predicted versus observed values (Fig. 9) for the training ((Fig. 9 (a, c))
    and check (Fig. 9 (b, d)) steps for both inputs showed that the network was very
    well trained, i.e., the ANFIS could learn with the input data leading to minor
    errors. Also, in the check, the network predicted precisely the Dy removal percentage
    in practically all the range of adsorbent mass and pH studied, which is very advantageous
    for practical applications where pH can change abruptly in a plant for the Dy
    recovery from secondary sources such as acid mine drainage water, leachate of
    NdFeB magnets, red mug, among others.


