- raw: "The learn partition of the data will provide the raw material from which we\
    \ will be able to create the machine learning model. For us to build the predictive\
    \ model, the test partition is not necessary, but we must have the learn partition.\n\
    \nBut how much data should we should use for each partition? Since the learn partition\
    \ will help us build our model, it should be allocated more data than the test\
    \ partition. The purpose of the test partition is to help us evaluate the performance\
    \ of our model, and less data is needed for this purpose. \n\nChapter 7  \n\n\
    Algorithms \n\n## Supervised Learning Algorithms\n\nAs discussed earlier, Supervised\
    \ machine learning algorithms are those in which both the input and the output\
    \ data are provided. They can be divided into two broad categories:\n\n*   Classification\n\
    \n*   Regression\n\nLet’s discuss them.\n\n### Classification\n\nClassification\
    \ involves discovering the inherent groupings of present in a set of data. The\
    \ categorization of customers based upon their purchasing behaviors is an example\
    \ of classification. Characterization of emails as either spam or non-spam is\
    \ another. Other examples include the bull and bear cycle in property market,\
    \ characterization of student grades and prediction of employee churn\n\nLet’s\
    \ look at some of the classification algorithms for machine learning:\n\n1.  Logistic\
    \ Regression\n\nA logistic regression algorithm uses a logistic function to make\
    \ predictions valued between 0 and 1.\n\nThis is an indication that these predictions\
    \ can be interpreted to be class probabilities. Due to the linear nature of these\
    \ models, they work well when you have linearly separable classes, meaning that\
    \ a single decision surface can be used for separating the classes.\n\nAdvantages\
    \ of this algorithm are that the outputs will have a proper probabilistic interpretation,\
    \ and that it is possible to regularize the algorithm (by penalizing the coefficients\
    \ with tunable penalty strength) so as to avoid the problem of overfitting.\n\n\
    However, linear regression does not perform well when you have non-linear or multiple\
    \ decision boundaries. Also, they are not good for capturing complex relationships.\n\
    \n1.  Classification Tree (Ensembles)\n\nThey are good for classification problems,\
    \ and they work in the same way as regression trees. Practically, they perform\
    \ very well.\n\nThey are also scalable, robust to outliers and naturally model\
    \ the non-linear decision boundaries due to their hierarchical structure.\n\n\
    However, individual trees are vulnerable to over fitting which can be solved by\
    \ use of the ensemble methods.\n\n1.  Deep Learning\n\nDeep learning can be categorized\
    \ to be as part of a classification problem. A good example is image classification.\
    \ A deep learning algorithm will give you a very nice performance when you are\
    \ classifying text, audio and image data.\n\nHowever, deep neural networks require\
    \ a huge training data set, and that is why it is a general-purpose algorithm.\n\
    \n1.  Support Vector Machines (SVM)\n\nSVMs use kernels for the purpose of calculating\
    \ the distance between any two observations. The algorithm looks for a decision\
    \ boundary which maximizes the distance between the closest members of separate\
    \ classes.\n\nSVMs can be used for modeling nonlinear decision boundaries, and\
    \ they provide many kernels from which to choose. They are not prone to overfitting,\
    \ especially in cases in which you have a high-dimensional space.\n\nSVM is a\
    \ memory intensive algorithm, however, and the importance of selecting the right\
    \ kernel makes it hard to tune the model. This algorithm is not suitable for use\
    \ with larger data sets.\n\n1.  Naïve Bayes\n\nThis algorithm works based on counting\
    \ and conditional probability. The model is simply a probability table which is\
    \ updated depending on training data.\n\nFor you to make a prediction, you observe\
    \ the class probabilities in the probability table based on the feature values.\
    \ It was given the name naïve because of its conditional independence assumption\
    \ which is a rare occurrence in real world.\n\nNaïve Bayes models are easy to\
    \ implement and offer a very good performance. They scale very well with your\
    \ dataset.\n\n### Regression\n\nIn regression, the relationships between variables\
    \ are modeled.  Regression algorithms should be used for problems in which the\
    \ response variable is continuous or numeric. However, in classification algorithms,\
    \ the response variables are made up of data group into classes (usually, two\
    \ classes).\n\nA regression algorithm is a good predictor of a value such as the\
    \ price of a product (based upon related input variables).\n\nThe learning process\
    \ is centered on a training dataset with labeled inputs and the numeric target\
    \ variable. The model is refined iteratively through a process in which a model\
    \ is generated, tested against the data set for accuracy, adjusted generating\
    \ a new model…. \n\nRegression algorithms are heavily applied in statistical machine\
    \ learning. Some examples are the house valuation vs the selling price and predictive\
    \ returns vs realized returns in unit trusts.\n\nMore information will be shared\
    \ the following chapters.\n\nTo conclude, in supervised learning, there is an\
    \ external supervisor who has knowledge about the environment and shares it with\
    \ the agent so as to accomplish the task.\n\n## Unsupervised Learning Algorithms\n\
    \nThe training data set for unsupervised learning algorithms contains input data\
    \ (X) only. No output data (Y) is given.\n\nThe name *unsupervised* comes from\
    \ the fact that there is no “teacher” (output); and the correct answers are not\
    \ given known. \n\nThe goal of unsupervised learning is to model the underlying\
    \ distribution or structure of the data and to learn more from the data. The algorithm\
    \ is tasked with discovering the underlying data structure on its own.\n\nUnsupervised\
    \ learning algorithms can be classified into the following:\n\n*   Clustering\n\
    \n*   Dimensionality Reduction\n\nLet’s discuss these.\n\n### Clustering\n\nIn\
    \ clustering problems, our aim is to discover the inherent groupings of our data.\
    \ For example, groupings of customers based upon their purchasing behaviors. Other\
    \ applications of clustering include the grouping of related items in e-commerce,\
    \ and various social network analyses.\n\nThe product of a cluster in algorithm\
    \ is usually a data visualization enabling the user to see and evaluate the results.\
    \ \n\nExamples of clustering algorithms include k-Means k-Medians, Expectation\
    \ Maximization (EM) and Hierarchical Clustering.\n\nIn clustering, our goal is\
    \ to map the data into different groups known as clusters. Related data will be\
    \ placed in the same cluster, while no different data will appear in the same\
    \ cluster.\n\n### Dimensionality Reduction\n\nJust like the clustering algorithms,\
    \ the dimensionality reduction algorithms work to identify the underlying structure\
    \ of a dataset.\n\nDimensionality Reduction algorithms are further divided into\
    \ the following:\n\n*   Feature Selection\n\n*   Feature Extraction\n\nThe term\
    \ “dimensionality” in machine learning denotes the number of features in a dataset.\
    \ If the number of features happens to be large compared to the number of observations\
    \ in the dataset, some of learning algorithms will find it tough to train effective\
    \ models. This is what is referred to as “Curse of Dimensionality”.\n\nFeature\
    \ Selection helps in filtering redundant or irrelevant features from your dataset.\n\
    \nThe difference between feature selection and feature extraction is that in feature\
    \ selection, a subset of original features is kept while in feature extraction,\
    \ brand new features are created. \n\nIn dimensionality reduction, the goal is\
    \ to reduce the number of features which are under consideration, and each feature\
    \ is a dimension which represents the objects.\n\n## Reinforce Learning Algorithms"
