    \ artificial neural network is a software simulation of the human brain. The network\
    \ is composed of interconnected programs called neurons.\n\nThe data enters the\
    \ system at the first neuron, which performs the programmed operations and passes\
    \ its output to the next neuron on the network.\n\nThis neuron in turn performs\
    \ its program, producing another intermediate output. Neurons in an artificial\
    \ neural network are arranged in layers, and the final output is produced in the\
    \ final layer.  \n\nThe process of generating an output from the given input is\
    \ governed by the programming of the individual neurons as well as the initial\
    \ conditions of the data. Rules can be implemented in artificial neural networks\
    \ so as to ensure that they simulate the human brain.\n\n## How ANNs Work\n\n\
    The process of learning in neural networks is implemented through the use of a\
    \ learning algorithm. As we said, the neurons in a neural network are organized\
    \ into layers.\n\nEach layer is connected to the layers on either side. The purpose\
    \ of the input layer is to receive the input from the external environment which\
    \ you need to learn about.\n\nThe last layer in the neural network is referred\
    \ to as the output layer, and this is the layer which gives the results of the\
    \ learning process.\n\nBetween the input and the output layers, there exists some\
    \ number of hidden layers. A fully connected neural network is one in which every\
    \ hidden layer is connected to the layers on either side of it.\n\nThe connection\
    \ of one layer to another is represented by a number known as a `*weight*`. The\
    \ value of the weight can be positive or negative. A higher weight will have a\
    \ greater influence on the network.\n\nThe common design of a neural network in\
    \ which inputs are fed into the input layer with outputs received at the output\
    \ layer is referred to as a `*feedforward network*`.\n\nEach unit receives inputs\
    \ from units located to its left, then multiplied by the values of the weight\
    \ they have travelled along.\n\nEvery unit will add all connections it receives\
    \ and if this sum exceeds a particular threshold value, will fire and propagate\
    \ or trigger the units it is connected to on the right side of the network.\n\n\
    In order for a neural network to learn, there must be feedback. The feedback is\
    \ similar to a “right” or “wrong” response to the selected output or action. \
    \ \n\nThis kind of learning occurs in children when they are told whether what\
    \ they are doing is right or wrong -- or even in adults! Think about it. If you\
    \ became aware after the fact that you failed in some task, you probably planned\
    \ how you might improve your “output” the next time approach the same task. It\
    \ is the same with artificial neural networks.\n\nThe purpose of feedback is to\
    \ allow comparison between actual output and the desired output. The difference\
    \ between the two is assessed, and a determination is made on how the process\
    \ might be improved in order to generate a better output next time.  \n\nThe feedback\
    \ process in neural networks is known as `*backpropagation*`.\n\nThe final output\
    \ of the network is compared to the desired output, and the difference is used\
    \ to prescribe modifications to the weights of the connections between the network\
    \ units.\n\nThis is done for output unit, to each of the hidden units, and lastly\
    \ to the input unit. In other words, for each unit in reverse order from output\
    \ to input. The process causes the neural network to learn, reducing the difference\
    \ between actual and target outputs this difference is normally referred to as\
    \ the `*network error*.`\n\nThe goal, obviously, is to reach a network error of\
    \ zero, which requires that the network output be equal to the target output,\
    \ but this may be difficult. After using several examples to train the artificial\
    \ neural network, your network output will be sufficient to allow you to give\
    \ the network a brand new set of input data and observe the outputs it gives.\n\
    \nConsider an example in which you train your artificial neural network to differentiate\
    \ between chairs and tables.\n\nYou input the pictures of chairs and tables into\
    \ the network and it classifies them as either chairs or tables. You train the\
    \ network with 25 chairs and 25 tables. Now let say we give the network a new\
    \ untested picture with perhaps a slightly different in design than earlier pictures,\
    \ a designer coach chair, it should be able to classify it as either a chair or\
    \ a table based on its previous experience.\n\nHowever, this is not an indication\
    \ that a neural network is capable of just looking at something and responding\
    \ instantly to give the result. Its behavior is not like that of a person.\n\n\
    In the example given previously, the network will not be looking at pieces of\
    \ furniture. The network receives input in a binary form, meaning that each input\
    \ unit is switched either on or off.\n\nSuppose you have 5 input units, information\
    \ about five different characteristics of chairs in the form of binary answers\
    \ (yes/no).\n\nThe questions can be:\n\nDoes the item pictured have a top?\n\n\
    A backrest?\n\nCan you sit on it comfortably for a longer period?\n\nCan you place\
    \ a lot of stuff on it?\n\nFor a typical table, the answers will be yes, no, no,\
    \ yes. In binary terms, these answers can be expressed as 1001. For a typical\
    \ chair, the answers would be no, yes, yes, no. In binary terms, these can be\
    \ expressed as 0110.\n\nDuring the learning process, the artificial neural network\
    \ will learn the characteristics which represent a chair those which represent\
    \ a table, and those common to both.\n\nWith this knowledge, the neural network\
    \ will be able to different between chairs and tables.\n\n## Some Interesting\
    \ Examples\n\nNeural networks are widely applied today, in pattern recognition\
    \ and in making decisions about patterns, for instance.  \n\nIn airplanes neural\
    \ networks can be used as a basic autopilot, where the input units read signals\
    \ from cockpit instruments and output units which modify the controls of the plane\
    \ so as to ensure that it is safe.\n\nArtificial neural networks can be used in\
    \ factories for quality control. A good example is found in the chemical process\
    \ of detergent manufacturing.  \n\nDetergent quality can be measured through many\
    \ parameters: thickness, acidity, etc, which can be presented to a neural network\
    \ as inputs. The trained network, in turn, can make a quality determination and\
    \ reject or accept the batch.  \n\nArtificial neural networks are also well suited\
    \ to the task of bank security. Let’s say your bank runs several thousands of\
    \ credit card transactions via your computer, one minute after another.\n\nYour\
    \ aim is to come up with a mechanism which will help you identify any fraudulent\
    \ transactions. A neural network can help you achieve this. Possible inputs include:\
    \ Is the owner of the credit card present? Has the user used a valid PIN number?\
    \ Has the card transacted over 10 transactions in the last 10 minutes? Is the\
    \ card being used in the country in which it was registered? Given enough such\
    \ information it will be possible for the neural network to flag any fraudulent\
    \ transactions, so that a human operator can be prompted to investigate further.\n"
