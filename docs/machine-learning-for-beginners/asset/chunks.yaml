    \ large orders from the test results. Past analytics data can help you determine\
    \ the average web order, and the filter should be created with this in consideration.\
    \ If you find the average to be $100, then any order above $150 might be considered\
    \ an outlier.\n\n1. Change or remove outliers during the post-test analysis\n\n\
    Another alternative is to trim the dataset so as to exclude as many outliers as\
    \ possible. Trimming is easy in Excel through the use of the TRIMMEAN function.\
    \ Simply specify the array to be manipulated and the amount by which you need\
    \ to trim the upper and lower extremities.\n\nR also provides a convenient trimming\
    \ function, the mean function. A significant disparity between mean and median\
    \ indicates the presence of data values sufficiently large or small to skew the\
    \ body of data. To solve this problem, you can trim a certain percentage of data\
    \ at both the low and high ends. You can use mean (*x, trim = .05*): in this case,\
    \ *x* is the data set, and *.05* (or whatever you value you choose) is the percentage\
    \ of extreme data to be omitted.\n\n1. Changing the outlier value\n\nInstead of\
    \ removing the outlier, you can choose to give it another, more sensible (probable)\
    \ value. But how will you decide which value is most sensible? There are various\
    \ methods for doing this. Instead of using a more technical and complex processes\
    \ to determine this, you may just want to identify the value in your data which\
    \ makes sense to you, and use it for replacement. This way, you will have a standard\
    \ data for training your model. \n\n1. Box-Cox Transformation\n\nThis involves\
    \ the transformation of the data until it is normally distributed. There are a\
    \ number of transformations for data normalization.\n\nPossible options for data\
    \ normalization include squaring or taking the reciprocal or square root of the\
    \ data. In some other cases, the logarithms for the data values may be distributed\
    \ normally. It depends upon the data.\n\nEach of these transformations which may\
    \ produce a normal distribution can be grouped together into a box-cox transformation.\
    \ The box-cox transformation takes the following formula:![Trans2](Images/image00077.gif)\n\
    \nIn this case, *x* is the raw data, *y* represents the transformed data, and\
    \ lambda represents the transformation constant. If lambda is given a value of\
    \ 1, the transformation has no effect. But if the value of lambda is 2, for example,\
    \ the transformation becomes a square transformation function.\n\nThere are a\
    \ number of ways through which you can find the value of the lambda in the Box-Cox\
    \ transformation. One is Most Likely Estimate (MLE), but this approach can be\
    \ time consuming. The easiest way to determine the correct value of lambda is\
    \ by varying its value between -5 and 5, observing the results in order to determine\
    \ which value for lambda will give you the most normal distribution.\n\nThe best\
    \ value for lambda is the one which provides you with smallest standard deviation\
    \ of the variation between transformed and normally distributed data. This will\
    \ help you resolve the skewness of your data.\n\n1. **Winsorize (Threshold Control)**\n\
    \nIn this method, outliers are replaced with the nearest value in the data which\
    \ is not considered to be an outlier.\n\nThe process of replacing the extreme\
    \ values is known as *winsorization*. In most cases, winsorization involves setting\
    \ all the extreme outliers to some specified percentile of your data. If you are\
    \ using a winsorization of 90% for example, all the data below the 5^(th) percentile\
    \ will be set to 5^(th) percentile, while all data above 95^(th) percentile will\
    \ be set to 95^(th) percentile.\n\nThe winsorized estimators are known to be more\
    \ robust to the outliers compared to the more standard forms. The purpose of winsorizing\
    \ the outliers is to reduce their extremity to some specified value, so that they\
    \ can more nearly fit a normal distribution curve.\n\nAll outliers can be conformed\
    \ to specific chosen values, but there is another similar approach that is preferred\
    \ by some. You can alternatively conform the first (least extreme high or low)\
    \ outlier to your chosen near value, but bring the second outlier to an incrementally\
    \ more extreme value than the first and the third to an incrementally more extreme\
    \ value than the second, and so on.\n"
  trans: "\n数据获取涉及信息的收集和组织。必须通过适当的手段向相关组织或个人请求并获取必要的数据。\n\n受访者可以直接提供数据，或通过面谈获取。如果获得适当授权，也可以从行政来源提取日期，以便获得访问行政记录的许可。\n\
    \n数据收集方法的选择受多种因素影响。这些因素包括所需的准确程度、变量类型、数据收集策略以及调查员的技能。\n\n以下是常见的数据收集方法：\n\nObservation\
    \ - 数据通过观察收集，可视为“第一手”信息，意味着收集的数据将是直接且无偏的。该类别包括系统性现场观察、实验观察和参与观察。虽然成本较高，但其准确性优于其他数据收集方法。\n\
    \nInterviewing - 通过结构化电话访谈或自助问卷调查获取数据。当所研究的问题较为复杂时，面谈是一种有效的数据收集方法。\n\nQuestionnaires\
    \ - 需要受访者填写并返回的问卷。当受访者愿意配合且识字率较高时，问卷是一种有效的数据收集方法。\n\n在数据获取后，应进入下一步：数据预处理。\n\n\
    ## 数据预处理\n\n数据预处理涉及将原始数据转换为可理解的形式。实际数据通常存在缺失、不一致、缺乏趋势以及错误等问题。数据预处理的目的是为了解决这些问题。以下是数据预处理的步骤：\n\
    \n数据清洗 - 填补缺失值、解决不一致性并平滑噪声数据的过程。\n\n数据集成 - 收集的数据通常格式各异。该步骤包括合并所有数据为统一格式，并解决格式问题。数据转换\
    \ - 这涉及对数据进行标准化、聚合和一般化处理。\n\n数据减少 - 在此步骤中，旨在以数据仓库的形式获得数据的缩减表示。\n\n数据离散化 - 通过将连续属性的取值范围进行划分，减少任何连续属性的值的数量。\n\
    \n## 处理离群值的技术\n\n离群值是指在从给定总体中获得的随机样本中，与其他值异常远离的观测值。处理数据时，大多数人会忽略离群值。\n\n即使在受控实验中，离群值也很常见，它们通常由测量错误或故障的测量或记录仪器引起。\n\
    \n检测数据中的离群值的最佳方法是使用图形手段。其他选项包括使用统计方法和工具，如 R、Python、Excel 等。\n\n![Image](img/image00076.jpeg)\n\
    \n图片版权：Opabinia regalis\n\n散点图和箱线图是揭示离群值的两种最常用的图形表示方式。直方图也是另一种选择。还有许多其他策略可用于处理离群值。\n\
    \n大多数用于离群值检测的工具也提供处理它们的手段，但它们通常在方法上有所不同。\n\n让我们讨论一些可用于处理离群值的策略：\n\n1.  \n\n1.\
    \ 在测试工具中创建过滤器。\n\n假设你正在使用 A/B 测试工具来跟踪收入。你可以编写代码，识别并从测试结果中排除异常大的订单。过去的分析数据可以帮助你确定平均网络订单金额，过滤器应基于此设计。如果你发现平均值为\
    \ 100 美元，则超过 150 美元的订单可能被视为离群值。\n\n1. 在事后分析中修改或移除离群值\n\n另一种替代方案是通过削减数据集来排除尽可能多的离群值。削减在\
    \ Excel 中通过 TRIMMEAN 函数实现。只需指定要操作的数组以及需要削减的上下两端的幅度即可。\n\nR 也提供了便捷的削减函数，即均值函数。当均值与中位数之间存在显著差异时，说明数据中存在足够大或足够小的数值会扭曲数据主体。为了解决此问题，你可以削减数据两端的一定百分比。例如，使用\
    \ mean(*x*, trim = .05)：在此例中，*x* 是数据集，*.05*（或你选择的数值）是要剔除的极端数据百分比。\n\n1. 修改离群值\n\
    \n与其移除离群值，你可以选择将其替换为更合理（更可能）的值。但如何确定最合理的值呢？有多种方法可以实现这一点。与其使用更技术性和复杂的过程来确定最合理的值，你可能只需找出数据中对你而言合理的值，并将其用于替换。这样，你就可以为模型训练提供标准化数据。\n\
    \n1. Box-Cox 变换\n\n此方法通过对数据进行变换，使其呈正态分布。有多种数据归一化变换可供选择。\n\n数据归一化的可能选项包括对数据进行平方、取倒数或开平方。在其他情况下，数据的对数可能呈正态分布。这取决于数据本身。\n\
    \n这些可能产生正态分布的变换可归类为 Box-Cox 变换。Box-Cox 变换的公式如下：![Trans2](img/image00077.gif)\n\
    \n在此公式中，*x* 是原始数据，*y* 表示变换后的数据，λ 表示变换常数。如果 λ 的值为 1，变换无效果；但如果 λ 的值为 2，例如，则变换变为平方函数。\n\
    \n找到 Box-Cox 变换中 λ 的值有多种方法。一种是最大似然估计（MLE），但该方法可能耗时较长。最简便的方法是将 λ 的值在 -5 到 5 之间变化，观察结果，找出能使分布最正态的\
    \ λ 值。\n\n最佳的 λ 值是使变换后与正态分布数据之间的变异最小标准差的值。这将帮助你消除数据的偏态。\n\n1. **Winsorize（阈值控制）**\n\
    \n在该方法中，离群值被替换为数据中不被视为离群值的最近值。\n\n替换极端值的过程称为 *winsorization*。通常，winsorization\
    \ 涉及将所有极端离群值设置为指定数据的某个分位点。例如，若使用 90% 的 winsorization，则数据低于第 5 百分位的所有值将被设置为第 5\
    \ 百分位，而数据高于第 95 百分位的所有值将被设置为第 95 百分位。\n\nWinsorized 估计量比更标准的形式更能抵御离群值。winsorizing\
    \ 的目的是将离群值的极端程度降低到指定值，使其更接近正态分布曲线。\n\n所有离群值都可以被设定为特定值，但还有一种类似的方法更受一些人青睐。你可以将第一个（最不极端的）高值或低值的离群值设定为你选择的近似值，然后将第二个离群值设定为比第一个更极端的值，第三个离群值设定为比第二个更极端的值，以此类推。\n\
    \n"
