- raw: "KNN works well when the number of input variables (p) is small, but it will\
    \ struggle if this number becomes large.\n\nEvery input variable can be seen to\
    \ be a dimension of p-dimensional input space. Suppose you have two input variables\
    \ namely x1 and x2, your input space will be 2-dimensional. If the number of dimensions\
    \ is increased, the volume of input space will increase by an exponential rate.\n\
    \nSome of the examples of uses of KNN algorithm include nearest neighbor content\
    \ retrieval.\n\nA good example is computer vision applications such as handwriting\
    \ detection.\n\nFor the case of video content, the problem will becomes more interesting.\
    \ Suppose you are given a video, for example, and need to identify a video which\
    \ is closely related to it. This problem may seem to be impossibly abstract, but\
    \ it is a real-life practical problem in a number of contexts. \n\nA good example\
    \ of a field in which such a search would be practical is American Sign Language\
    \ (ASL), in which communication is done solely via hand gestures.\n\nSuppose we\
    \ need to create an ASL dictionary which the user will be able to query using\
    \ gestures. The problem will reduce to identification of the nearest (most similar)\
    \ gestures stored in the database (possibly k). This is a KNN problem.\n\nThe\
    \ KNN algorithm is also widely applicable to gene expression, and KNN performs\
    \ most beautifully in this field. KNN can also be applied to 3D structure prediction\
    \ and to protein interaction prediction.\n\n## Advantages of KNN Algorithm\n\n\
    The following are the advantages of using the KNN algorithm:\n\n*   It is a good\
    \ algorithm for creating prediction models where the data is very noisy.\n\n*\
    \   The algorithm works effectively when the available dataset is large.\n\n##\
    \ Disadvantages of KNN Algorithm\n\nThe following are the disadvantages of associated\
    \ with the KNN algorithm:\n\n*   One is expected, first, to find the value of\
    \ K, the number of the nearest neighbors.  \n\n*   The cost of computation is\
    \ very high, since we have to find the distance of every query instance to all\
    \ the training samples. This computational cost can be reduced via indexing. \
    \ \n\n*   Which distance measure to use may be unclear, as well as the attributes\
    \ which should be used for one to produce the results.\n\n## When should you use\
    \ the KNN Algorithm?\n\nAlthough the KNN algorithm can be applied to both classification\
    \ and regression problems, it is most widely applied in classification problems.\n\
    \nTip: Whenever you need to determine the similarity between your variables, choose\
    \ KNN. It is the best algorithm to use.\n\nIt is a good algorithm for use for\
    \ pattern recognition and statistical estimation.\n\nChapter 10  \n\nReinforcement\
    \ Machine Learning Algorithms \n\nClustering, a process used to find the structure\
    \ of a collection of unlabeled data, is the most important kind of unsupervised\
    \ learning algorithm. \n\nClustering divides the data points into a set of groups\
    \ known as clusters such that the data points in the same cluster are more closely\
    \ related to each other than to the data points in other clusters.\n\nIn simple\
    \ terms, the goal of clustering is to segregate the data into groups with similar\
    \ characteristics and then assign them to clusters.\n\n## How Clustering Algorithms\
    \ Work\n\nSuppose you run a rental store and your aim is to know the preferences\
    \ of your customers in order to boost your business. It is impossible for you\
    \ to analyze the preferences of each individual customer and then come up with\
    \ a strategy for everyone.\n\nThe best way to approach this problem is to divide\
    \ your customers into a number of groups, say 8, according to their purchasing\
    \ habits. A strategy should then be devised for the customers of each group. This\
    \ is how clustering algorithms work. \n\nClustering can either be hard or soft.\n\
    \nIn hard clustering, every data point must belong to a particular group, completely\
    \ or not.\n\nIn our above example, each customer must belong to any of the 8 groups.\n\
    \nIn soft clustering, each data point is not put into a separate cluster, but\
    \ the likelihood or probability of assigning that data point to the cluster is\
    \ assigned.\n\nIn our above example, every customer is assigned a probability\
    \ of belonging to either of the 8 groups.\n\n## Types of Clustering Algorithms\n\
    \nClustering is a subjective task, meaning that there may be many paths to the\
    \ desired goal. In every methodology, a set of rules is followed for the purpose\
    \ of defining the similarity between the data points.\n\nLet’s discuss some of\
    \ the common clustering algorithms:\n\n1.  K Means Clustering\n\nThis is a clustering\
    \ algorithm which works iteratively with an aim of finding the local maxima during\
    \ each iteration. The algorithm follows the following steps:\n\ni. Specify the\
    \ number of clusters you wish to have, K. \n\nii. Assign every data point to a\
    \ cluster randomly.\n\niii. Determine the cluster centroids.\n\niv. Re-assign\
    \ every point to closest cluster centroid.\n\nv. Re\\-computer the cluster centroids.\n\
    \nRepeat steps iv. and v. until there are no possible improvements. At this point\
    \ global optima shall have been reached.\n\nThis will be the end of the algorithm\
    \ (if the algorithm was not explicitly limited).\n\nThe following are the advantages\
    \ of the K-Means clustering algorithm:\n\n*   The K-Means clustering algorithm\
    \ offers a fast computation if the variables are huge and K is kept small.  \n\
    \n*   The algorithms can produce tighter clusters, making it easy for one to determine\
    \ the relationship between the cluster members.\n\nThe following are the disadvantages\
    \ of K-Means clustering algorithm:\n\n*   Predicting the value of K may be difficult.\
    \  \n\n*   Different initial partitions may give final clusters which are different.\
    \  \n\n*   It doesn’t work well in cases where the clusters are of different densities\
    \ and sizes.\n\n1.  Hierarchical Clustering \n\nHierarchical clustering works\
    \ by creating a hierarchy of clusters. The algorithm begins with data points each\
    \ of which has been assigned to its own cluster.\n\nThe two nearest clusters are\
    \ then merged into a single cluster. The algorithm will terminate once only a\
    \ single cluster is left.\n\nA dendrogram is the best way to demonstrate how this\
    \ clustering algorithm works. In a dendrogram, you begin with a set of data points,\
    \ with each assigned to a separate cluster.\n\nTwo closest clusters are merged,\
    \ and this continues until we remain with one cluster at the top of the dendrogram.\
    \ The height in a dendrogram at which any two clusters are merged demonstrates\
    \ the distance between the two clusters in a data space.\n\nThe following are\
    \ the advantages of a Hierarchical clustering algorithms:\n\n*   The algorithms\
    \ are easy to implement and sometimes give the best results.  \n\n*   There is\
    \ no a prior information regarding the number of clusters to be formed. \n\nThe\
    \ following are the disadvantages of hierarchical clustering algorithms:\n\n*\
    \   It impossible for algorithms to undo what has been done previously.  \n\n\
    *   A time complexity of about O(n2 log n) is needed, with n being the number\
    \ of data points.  \n\n*   There is no direct minimization of objective functions.\n\
    \n*   Identifying the number of clusters in the dendogram may be difficult.  \n\
    \nNote that K-Means is suitable when you have big data. This is because the K-Means\
    \ algorithm has a linear time complexity, but a hierarchical clustering algorithm\
    \ has a quadratic time complexity.\n\nIn K-Means, the number of clusters is chosen\
    \ randomly, meaning that obtained results may differ from one selection of K to\
    \ the next. In hierarchical clustering, we may reproduce the results.\n\nThe following\
    \ are the applications to which you can apply clustering algorithms:\n\n*   Market\
    \ segmentation\n\n*   Medical imaging\n\n*   Search result grouping\n\n*   Image\
    \ segmentation\n\n*   Recommendation engines\n\n*   Anomaly detection\n\n*   Social\
    \ network analysis\n\n## When to use Clustering Algorithms\n\nClustering algorithms\
    \ should be used when one has a set of items and there is need to create some\
    \ number of groups from these items."
  fmt: "\nKNN works well when the number of input variables (p) is small, but it will\
    \ struggle if this number becomes large.\n\nEvery input variable can be seen to\
    \ be a dimension of p-dimensional input space. Suppose you have two input variables\
    \ namely x1 and x2, your input space will be 2-dimensional. If the number of dimensions\
    \ is increased, the volume of input space will increase by an exponential rate.\n\
    \nSome of the examples of uses of KNN algorithm include nearest neighbor content\
    \ retrieval.\n\nA good example is computer vision applications such as handwriting\
    \ detection.\n\nFor the case of video content, the problem will becomes more interesting.\
    \ Suppose you are given a video, for example, and need to identify a video which\
    \ is closely related to it. This problem may seem to be impossibly abstract, but\
    \ it is a real-life practical problem in a number of contexts. \n\nA good example\
    \ of a field in which such a search would be practical is American Sign Language\
    \ (ASL), in which communication is done solely via hand gestures.\n\nSuppose we\
    \ need to create an ASL dictionary which the user will be able to query using\
    \ gestures. The problem will reduce to identification of the nearest (most similar)\
    \ gestures stored in the database (possibly k). This is a KNN problem.\n\nThe\
    \ KNN algorithm is also widely applicable to gene expression, and KNN performs\
    \ most beautifully in this field. KNN can also be applied to 3D structure prediction\
    \ and to protein interaction prediction.\n\n## Advantages of KNN Algorithm\n\n\
    The following are the advantages of using the KNN algorithm:\n\n*   It is a good\
    \ algorithm for creating prediction models where the data is very noisy.\n\n*\
    \   The algorithm works effectively when the available dataset is large.\n\n##\
    \ Disadvantages of KNN Algorithm\n\nThe following are the disadvantages of associated\
    \ with the KNN algorithm:\n\n*   One is expected, first, to find the value of\
    \ K, the number of the nearest neighbors.  \n\n*   The cost of computation is\
    \ very high, since we have to find the distance of every query instance to all\
    \ the training samples. This computational cost can be reduced via indexing. \
    \ \n\n*   Which distance measure to use may be unclear, as well as the attributes\
    \ which should be used for one to produce the results.\n\n## When should you use\
    \ the KNN Algorithm?\n\nAlthough the KNN algorithm can be applied to both classification\
    \ and regression problems, it is most widely applied in classification problems.\n\
    \nTip: Whenever you need to determine the similarity between your variables, choose\
    \ KNN. It is the best algorithm to use.\n\nIt is a good algorithm for use for\
    \ pattern recognition and statistical estimation.\n\nChapter 10  \n\nReinforcement\
    \ Machine Learning Algorithms \n\nClustering, a process used to find the structure\
    \ of a collection of unlabeled data, is the most important kind of unsupervised\
    \ learning algorithm. \n\nClustering divides the data points into a set of groups\
    \ known as clusters such that the data points in the same cluster are more closely\
    \ related to each other than to the data points in other clusters.\n\nIn simple\
    \ terms, the goal of clustering is to segregate the data into groups with similar\
    \ characteristics and then assign them to clusters.\n\n## How Clustering Algorithms\
    \ Work\n\nSuppose you run a rental store and your aim is to know the preferences\
    \ of your customers in order to boost your business. It is impossible for you\
    \ to analyze the preferences of each individual customer and then come up with\
    \ a strategy for everyone.\n\nThe best way to approach this problem is to divide\
    \ your customers into a number of groups, say 8, according to their purchasing\
    \ habits. A strategy should then be devised for the customers of each group. This\
    \ is how clustering algorithms work. \n\nClustering can either be hard or soft.\n\
    \nIn hard clustering, every data point must belong to a particular group, completely\
    \ or not.\n\nIn our above example, each customer must belong to any of the 8 groups.\n\
    \nIn soft clustering, each data point is not put into a separate cluster, but\
    \ the likelihood or probability of assigning that data point to the cluster is\
    \ assigned.\n\nIn our above example, every customer is assigned a probability\
    \ of belonging to either of the 8 groups.\n\n## Types of Clustering Algorithms\n\
    \nClustering is a subjective task, meaning that there may be many paths to the\
    \ desired goal. In every methodology, a set of rules is followed for the purpose\
    \ of defining the similarity between the data points.\n\nLet’s discuss some of\
    \ the common clustering algorithms:\n\n1.  K Means Clustering\n\nThis is a clustering\
    \ algorithm which works iteratively with an aim of finding the local maxima during\
    \ each iteration. The algorithm follows the following steps:\n\ni. Specify the\
    \ number of clusters you wish to have, K. \n\nii. Assign every data point to a\
    \ cluster randomly.\n\niii. Determine the cluster centroids.\n\niv. Re-assign\
    \ every point to closest cluster centroid.\n\nv. Re-compute the cluster centroids.\n\
    \nRepeat steps iv. and v. until there are no possible improvements. At this point\
    \ global optima shall have been reached.\n\nThis will be the end of the algorithm\
    \ (if the algorithm was not explicitly limited).\n\nThe following are the advantages\
    \ of the K-Means clustering algorithm:\n\n*   The K-Means clustering algorithm\
    \ offers a fast computation if the variables are huge and K is kept small.  \n\
    \n*   The algorithms can produce tighter clusters, making it easy for one to determine\
    \ the relationship between the cluster members.\n\nThe following are the disadvantages\
    \ of K-Means clustering algorithm:\n\n*   Predicting the value of K may be difficult.\
    \  \n\n*   Different initial partitions may give final clusters which are different.\
    \  \n\n*   It doesn’t work well in cases where the clusters are of different densities\
    \ and sizes.\n\n1.  Hierarchical Clustering \n\nHierarchical clustering works\
    \ by creating a hierarchy of clusters. The algorithm begins with data points each\
    \ of which has been assigned to its own cluster.\n\nThe two nearest clusters are\
    \ then merged into a single cluster. The algorithm will terminate once only a\
    \ single cluster is left.\n\nA dendrogram is the best way to demonstrate how this\
    \ clustering algorithm works. In a dendrogram, you begin with a set of data points,\
    \ with each assigned to a separate cluster.\n\nTwo closest clusters are merged,\
    \ and this continues until we remain with one cluster at the top of the dendrogram.\
    \ The height in a dendrogram at which any two clusters are merged demonstrates\
    \ the distance between the two clusters in a data space.\n\nThe following are\
    \ the advantages of a Hierarchical clustering algorithms:\n\n*   The algorithms\
    \ are easy to implement and sometimes give the best results.  \n\n*   There is\
    \ no a prior information regarding the number of clusters to be formed.  \n\n\
    The following are the disadvantages of hierarchical clustering algorithms:\n\n\
    *   It impossible for algorithms to undo what has been done previously.  \n\n\
    *   A time complexity of about O(n2 log n) is needed, with n being the number\
    \ of data points.  \n\n*   There is no direct minimization of objective functions.\n\
    \n*   Identifying the number of clusters in the dendogram may be difficult.  \n\
    \nNote that K-Means is suitable when you have big data. This is because the K-Means\
    \ algorithm has a linear time complexity, but a hierarchical clustering algorithm\
    \ has a quadratic time complexity.\n\nIn K-Means, the number of clusters is chosen\
    \ randomly, meaning that obtained results may differ from one selection of K to\
    \ the next. In hierarchical clustering, we may reproduce the results.\n\nThe following\
    \ are the applications to which you can apply clustering algorithms:\n\n*   Market\
    \ segmentation\n\n*   Medical imaging\n\n*   Search result grouping\n\n*   Image\
    \ segmentation\n\n*   Recommendation engines\n\n*   Anomaly detection\n\n*   Social\
    \ network analysis\n\n## When to use Clustering Algorithms\n\nClustering algorithms\
    \ should be used when one has a set of items and there is need to create some\
    \ number of groups from these items.\n"
  trans: "\nKNN 在输入变量（p）数量较少时表现良好，但当变量数量增多时会遇到困难。\n\n每个输入变量可视为 p 维输入空间的一个维度。假设你有两个输入变量\
    \ x1 和 x2，则输入空间为 2 维。若维度增加，输入空间的体积会以指数速率增长。\n\nKNN 算法的使用示例包括最近邻内容检索。\n\n一个典型的例子是计算机视觉中的手写体识别。\n\
    \n对于视频内容，问题会更具挑战性。例如，你拥有一段视频，需要找出与其最相关的视频。这种问题在多种情境中是实际存在的，虽然看似抽象，却是真实可行的。\n\n\
    美国手语（ASL）是一个典型的应用场景，交流完全依赖手势。我们需要构建一个 ASL 词典，使用户可通过手势进行查询。此时问题转化为在数据库中（可能是 k 个）找到最相似的手势，这正是\
    \ KNN 问题。\n\nKNN 算法同样适用于基因表达数据，在该领域表现最为出色。KNN 还可用于三维结构预测和蛋白质交互预测。\n\n### KNN 算法的优势\n\
    \n- 它是创建预测模型的良好算法，尤其适用于数据非常嘈杂的情况。\n\n- 当可用数据集较大时，该算法能够有效工作。\n\n### KNN 算法的劣势\n\
    \n- 首先需要确定 K 值，即最近邻的数量。\n\n- 计算成本很高，因为需计算每个查询实例到所有训练样本的距离。可通过索引技术降低该成本。\n\n- 使用哪种距离度量以及哪些属性用于计算可能不明确。\n\
    \n### 何时使用 KNN 算法？\n\n尽管 KNN 可用于分类和回归问题，但它在分类问题中使用最为广泛。\n\n提示：当需要衡量变量之间的相似性时，选择\
    \ KNN。它是使用相似性的最佳算法。\n\n它是用于模式识别和统计估计的优秀算法。\n\n第 10 章  \n强化学习算法  \n\n聚类是一种用于发现未标记数据集合结构的过程，是最重要的无监督学习算法。\n\
    \n聚类将数据点划分为若干组（即簇），使得同一簇内的数据点彼此更紧密相关，而与其他簇的数据点关系更为远远。\n\n简单来说，聚类的目标是将数据划分为具有相似特征的组，并将它们分配到簇中。\n\
    \n### 聚类算法的工作原理\n\n假设你经营一家租赁店，目标是了解客户偏好以提升业务。分析每位客户的偏好并为每个人制定策略是不切实际的。\n\n最佳做法是将客户按购买习惯划分为若干组，例如\
    \ 8 组。随后为每组客户制定策略。这就是聚类算法的工作方式。\n\n聚类可分为硬聚类和软聚类。\n\n在硬聚类中，每个数据点必须完全属于某一簇或不属于任何簇。\n\
    \n在上述例子中，每位客户必须属于 8 组中的某一组。\n\n在软聚类中，数据点不被强制划分为独立簇，而是为每个簇分配置入的概率或可能性。\n\n在上述例子中，每位客户都被分配一个属于\
    \ 8 组中的概率。\n\n### 聚类算法的类型\n\n聚类是一项主观任务，意味着可能存在多种路径达到目标。每种方法都遵循一套规则，用于定义数据点之间的相似性。\n\
    \n以下是一些常见的聚类算法：\n\n1. K-Means 聚类\n\n这是一种迭代工作的聚类算法，旨在每次迭代中寻找局部最大值。其步骤如下：\n\ni.\
    \ 指定希望拥有的簇数 K。\n\nii. 随机将每个数据点分配到一个簇中。\n\niii. 确定簇的中心点（ centroids）。\n\niv. 将每个点重新分配到最近的簇中心。\n\
    \nv. 重新计算簇的中心点。\n\n重复步骤 iv 和 v，直至不再有改进为止。此时即达到全局最优。\n\n此为算法的终点（若未明确限制）。\n\nK-Means\
    \ 聚类的优势：\n\n- 当变量量巨大且 K 较小时，K-Means 计算速度快。\n\n- 该算法能产生更紧凑的簇，便于判断簇内部成员关系。\n\nK-Means\
    \ 聚类的劣势：\n\n- 确定 K 值可能困难。\n\n- 不同的初始划分可能导致最终簇的差异。\n\n- 当簇的密度和大小差异较大时表现不佳。\n\n\
    1. 层次聚类\n\n层次聚类通过构建簇的层级结构工作。算法初始时，每个数据点各自为一簇。\n\n随后将最接近的两个簇合并为一个簇。直至只剩下一个簇为止。\n\
    \n dendrogram（树状图）是展示该算法工作方式的最佳方式。在 dendrogram 中，初始每个数据点单独成簇，随后两个最近的簇合并，过程持续直至顶部只剩一个簇。\
    \ dendrogram 中任何两簇合并的高度反映了这两个簇在数据空间中的距离。\n\n层次聚类的优势：\n\n- 实现简单，有时能给出最佳结果。\n\n\
    - 不需要事先知道将形成多少个簇。\n\n层次聚类的劣势：\n\n- 无法撤销已完成的操作。\n\n- 时间复杂度约为 O(n² log n)（n 为数据点数量）。\n\
    \n- 没有直接最小化目标函数。\n\n- 从 dendrogram 中确定簇的数量可能困难。\n\n注意：K-Means 适用于大数据，因为其时间复杂度为线性；而层次聚类的时间复杂度为二次。\n\
    \n在 K-Means 中，簇数是随机选择的，不同的 K 可能导致结果差异。层次聚类则更具可重复性。\n\n可应用聚类算法的场景包括：\n\n- 市场细分\n\
    \n- 医学影像\n\n- 搜索结果分组\n\n- 图像分割\n\n- 推荐引擎\n\n- 异常检测\n\n- 社交网络分析\n\n### 何时使用聚类算法\n\
    \n当拥有若干项目且需要将这些项目划分为若干组时，应使用聚类算法。\n\n"
