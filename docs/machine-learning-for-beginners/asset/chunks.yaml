    \ cluster.\n\n### Dimensionality Reduction\n\nJust like the clustering algorithms,\
    \ the dimensionality reduction algorithms work to identify the underlying structure\
    \ of a dataset.\n\nDimensionality Reduction algorithms are further divided into\
    \ the following:\n\n*   Feature Selection\n\n*   Feature Extraction\n\nThe term\
    \ “dimensionality” in machine learning denotes the number of features in a dataset.\
    \ If the number of features happens to be large compared to the number of observations\
    \ in the dataset, some of learning algorithms will find it tough to train effective\
    \ models. This is what is referred to as “Curse of Dimensionality”.\n\nFeature\
    \ Selection helps in filtering redundant or irrelevant features from your dataset.\n\
    \nThe difference between feature selection and feature extraction is that in feature\
    \ selection, a subset of original features is kept while in feature extraction,\
    \ brand new features are created. \n\nIn dimensionality reduction, the goal is\
    \ to reduce the number of features which are under consideration, and each feature\
    \ is a dimension which represents the objects.\n\n## Reinforce Learning Algorithms\n"
