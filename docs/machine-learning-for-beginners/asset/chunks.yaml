- raw: "A bank can also use neural networks to approve or reject loan applications\
    \ based upon an applicant’s past credit history, employment record, and current\
    \ earnings.\n\nNearly every task involves pattern recognition and using those\
    \ patterns to make decisions. Neural networks can predict everything from weather\
    \ to stock market performance.\n\nDoctors can use neural networks to assist with\
    \ diagnosis. Neural networks can be used to operate radar scanning systems which\
    \ can automatically identify enemy ships or aircrafts.\n\nThey can be used for\
    \ voice recognition or for identification of spam emails. Neural networks have\
    \ been widely used in language translation. An example of this is the automatic\
    \ translation of Google, which uses neural networks to translate words from one\
    \ language to another.\n\nNeural networks have also been successfully employed\
    \ to assist with police work. Applications include face recognition for use in\
    \ the identification of persons or objects from captured CCTV footages.\n\nThey\
    \ can also detect and recognize cars, which is helpful to police looking for stolen\
    \ vehicles. \n\n## Advantages of Artificial Neural Networks\n\nThe following are\
    \ the advantages of using artificial neural networks:\n\n*   Neural networks require\
    \ a less formal statistical training.  \n\n*   Neural networks can help in detecting\
    \ complex, nonlinear relationships between dependent and independent variables.\
    \ This is why neural networks are used in solving problems which do not have an\
    \ algorithmic solution or where it becomes hard to find a solution.  \n\n*   With\
    \ neural networks, one can detect all possible interactions between predictor\
    \ variables.\n\n## Disadvantages of Artificial Neural Networks\n\nThe following\
    \ are the disadvantages associated with neural networks:\n\n*   Neural networks\
    \ are prone to overfitting, which may lead to poor or inaccurate predictions.\
    \  \n\n*   Neural networks may be slower to train and several epochs may be needed\
    \ for the learning process.  \n\n*   The “black box” nature of neural networks.\
    \ One is only expected to provide the initial architecture of the neural network\
    \ and provide some inputs to the networks, which are just random numbers. When\
    \ using backpropagation, one does not actually know what he or she is doing. The\
    \ learning process of the neural network will progress on its own.\n\n## When\
    \ to use Artificial Neural Networks\n\nNeural networks should be used in problems\
    \ which involve finding trends in data. They are good at solving many of the same\
    \ kind problems that humans solve daily. \n\nExamples of such problems include\
    \ generalization, image recognition, and others. They help in solving problems\
    \ which are difficult or impossible to solve through the use of traditional, formal\
    \ analysis.\n\nFuzzy logic has been integrated into neural networks. This is a\
    \ type of logic which recognizes more than just the simple true and false values,\
    \ providing a better simulation of the real world. Suppose you have the statement,\
    \ “It is sunny today.” \n\nThis statement can be 100% true if there are no clouds\
    \ during the day, 50% if it is hazy, 80% if there are only few clouds, and 0%\
    \ if it is rainy.\n\nThis means that the concept considers outcomes such as somewhat,\
    \ usually and sometimes.\n\nA combination of fuzzy logic and neural networks has\
    \ been used in job application screening, automotive engineering, monitoring of\
    \ glaucoma, crane control etc.\n\nNeural networks are very good in processing\
    \ massive amounts of data. This makes them very useful in image compression.\n\
    \nMore websites on the internet are using images, and neural networks can help\
    \ to compress such images.\n\n# CONCLUSION\n\nWe have come to the end of this\
    \ book. Machine learning is a branch of artificial intelligence which involves\
    \ the design and development of systems capable of self-improvements showing an\
    \ improvement in performance based upon their previous experiences.\n\nIn other\
    \ words, these systems can “learn” by processes similar to human learning process.\
    \ \n\nMachine learning algorithms can be classified into two broad categories,\
    \ supervised and the unsupervised. In supervised learning algorithms, the training\
    \ data includes both inputs and outputs. The outputs (answers to the problems)\
    \ are known as targets.\n\nThese in supervising the machine learning model as\
    \ it tries to identify trends and patterns underlying your data.\n\nIn unsupervised\
    \ learning algorithms, the training data includes inputs only. he targets are\
    \ not provided. The answers to the inputs have to be discovered through a deep\
    \ search.\n\nThere are a number of steps which must be followed during the course\
    \ of machine learning. These include collecting and preparing the data and training,\
    \ validating, and then applying the model.\n\nWhen all these steps are completed,\
    \ you will be able to use your model to make predictions. Machine learning is\
    \ a new and growing field, and its emergence is a promising answer to the unimaginable\
    \ quantities of data which will be generated by organizations and individuals\
    \ during the upcoming years.\n\nThe predictive capacity of the various machine\
    \ learning algorithms, is most attractive to businesses, who are rushing to incorporate\
    \ machine learning into their day-to-day operations. Machine learning can help\
    \ businesses predict future performance and make necessary adjustments in order\
    \ to remain stable and even to increase profits.\n\nClearly, the future of machine\
    \ learning is bright. Machine learning models can make the work of human beings\
    \ easier. This fact alone should be enough to motivate human beings toward learning\
    \ machine learning.\n\n# Notes\n\nChapter 2 – Machine Learning\n\n1.  [https://medium.com/machine-learning-for-humans/why-machine-learning-matters-6164faf1df12](https://medium.com/machine-learning-for-humans/why-machine-learning-matters-6164faf1df12)\n\
    \n2.  [https://www.sas.com/en\\_us/insights/analytics/machine-learning.html](https://www.sas.com/en_us/insights/analytics/machine-learning.html)\n\
    \n3.  [https://aws.amazon.com/machine-learning/](https://aws.amazon.com/machine-learning/)\n\
    \nChapter 3 – Machine Learning Tools\n\n1.  [http://opensourceforu.com/2017/01/best-open-source-machine-learning-frameworks/](http://opensourceforu.com/2017/01/best-open-source-machine-learning-frameworks/)\n\
    \n2.  [https://www.infoworld.com/article/2853707/robotics/11-open-source-tools-machine-learning.html](https://www.infoworld.com/article/2853707/robotics/11-open-source-tools-machine-learning.html)\n\
    \n3.  [https://machinelearningmastery.com/machine-learning-tools/](https://machinelearningmastery.com/machine-learning-tools/)\n\
    \n4.  [http://opensourceforu.com/2017/01/best-open-source-machine-learning-frameworks/](http://opensourceforu.com/2017/01/best-open-source-machine-learning-frameworks/)\n\
    \n5.  [https://www.infoworld.com/article/3026262/machine-learning/13-frameworks-for-mastering-machine-learning.html](https://www.infoworld.com/article/3026262/machine-learning/13-frameworks-for-mastering-machine-learning.html)\n\
    \nChapter 4 – Data Acquisition\n\n1.  [http://www.ni.com/data-acquisition/what-is/](http://www.ni.com/data-acquisition/what-is/)\n\
    \n2.  [http://www.omega.com/prodinfo/dataacquisition.html](http://www.omega.com/prodinfo/dataacquisition.html)\n\
    \n3.  [https://www.dataq.com/blog/data-acquisition/what-is-data-acquisition-and-why-is-it-important/](https://www.dataq.com/blog/data-acquisition/what-is-data-acquisition-and-why-is-it-important/)\n\
    \n4.  [http://en-us.fluke.com/products/data-acquisition/](http://en-us.fluke.com/products/data-acquisition/)\n\
    \nChapter 5 – Data Management\n\n1.  [https://www.data.cam.ac.uk/data-management-guide](https://www.data.cam.ac.uk/data-management-guide)\n\
    \n2.  [http://www.businessdictionary.com/definition/data-management.html](http://www.businessdictionary.com/definition/data-management.html)\n\
    \n3.  [http://searchdatamanagement.techtarget.com/definition/data-management](http://searchdatamanagement.techtarget.com/definition/data-management)\n\
    \n4.  [https://www.ngdata.com/what-is-data-management/](https://www.ngdata.com/what-is-data-management/)"
