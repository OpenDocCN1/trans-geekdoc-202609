    \ columns are separated by commas or tabs. If you are using a tool such as Minitab,\
    \ the data should be separated by tabs, maybe in a text file, and you will need\
    \ to specify which columns contain input data and which contain outputs (targets).\n\
    \nWhen using a tool such as Minitab, you should organize the data into rows and\
    \ columns. For the case of a tool such as Neuroph Studio, you can choose to separate\
    \ the data by use of tabs, commas etc. The tool is able to know how the data has\
    \ been organized, and it will automatically organize the data into rows and columns.\n\
    \nIt is during the time of data labeling that you are expected to specify the\
    \ data columns which are the inputs and the data columns which are the outputs.\n\
    \n1.  Transformation Instructions\n\nSome tools will ask you to choose the type\
    \ of training algorithm you need to apply to your data. There are various machine\
    \ learning algorithms provided by software tools for creating and training machine\
    \ learning models.\n"
  trans: "\n该方法在保持从最低到最高相对顺序的同时修正数值。要添加的数值可以通过确定需要修正的变量的量纲来选择。\n\n但是，请注意，如果添加量很小，统计输出几乎没有变化的可能性很大。\n\
    \n管理离群值可以提高您分析结果的有意义性。离群值对分析的影响取决于多种因素，包括数据集的大小。\n\n如果数据集很大，每个观测值的权重较小，因此离群值的影响也相对最小。而在小数据集中，每个观测值的权重较大，离群值的影响则更显著。使用上述方法，您可以解决离群值问题，实现有效的分析。\n\
    \n第 5 章  \n\n数据管理  \n\n数据管理是指确保在研究项目期间和之后，研究数据被归档、存储，并在必要时安全删除的过程。这包括为电子和非电子数据制定处理政策。\n\
    \n## 存储数据\n\n在收集数据后，需要考虑如何以及在哪里存储。数据必须安全存储，防止任何形式的损害。您还应决定存储哪些数据、哪些数据将被删除，以及用于数据存储的文件格式。\n\
    \n数据可存储的位置包括笔记本电脑、U 盘、台式机和云端。如果数据存储在网络驱动器中，您可以安排定期备份，减少安全漏洞和数据丢失，并向需要的人员提供访问权限。\n\
    \nUCL（伦敦大学学院）存储库为您提供了另一种数据存储方案。该设施由中央管理，可容纳小至大容量的数据。您可免费获得高达 5TB 的存储空间。如果数据敏感，您可以使用\
    \ UCL 数据安全存储（Data Safe Haven）进行存储。\n\n云端也是一种存储选择，但如果您处理敏感数据，则需要自行加密。请注意，云服务提供商不对数据损坏负责。\n\
    \n云服务提供商可能倒闭或出现需要临时关闭的问题，导致您在一段时间内无法访问数据。\n\n如果数据以纸质形式存储，请识别使用频率高的记录并将其放在办公室附近；其余记录则存放在远程位置。\n\
    \n## 保护原始数据\n\n数据安全始终是首要关注事项。包括频繁更改密码和创建强密码等多种程序可帮助您保护数据安全。如果文档存储在笔记本电脑或 U 盘上，可以使用软件对其进行加密。\n\
    \n为每个文档设置单独密码不推荐。这同样适用于在硬盘上保存数据。请注意，数据安全还包括防止数据被擦除的保护。\n\n有工具可帮助您恢复已删除数据。这些工具在紧急情况下可能是救命稻草，但请记住：如果您需要从系统中删除敏感数据，必须确保该数据已完全从便携驱动器和硬盘中被擦除，以防止后续未经授权的人员获取并泄露敏感信息。\n\
    \n保护数据的目标是确保数据不被删除、不被修改，且不被未经授权的个人访问。如果在训练模型前对数据进行修改，模型训练将受损，导致预测结果也受影响。请使用上述所有安全措施来保护您的数据。\n\
    \n## 数据保存\n\n最后，您必须确定项目结束后数据的处理方式。数据将存储在何处，存储多长时间，以及如何在长期内使其可访问？此外，从原始数据到最终输出，哪些数据应被提供，以及提供给谁？\n\
    \n数据存储的格式随时间可能变得过时，因此需要规划以应对这种情况。使用的存储软件也会影响格式的可持续性。建议在长期存储数据时使用开放、非专有、文档完善的格式。\n\
    \n请注意，有些数据一旦丢失便无法恢复。因此，尤其是在项目由组织资助的情况下，数据保存可能是必须的。这也是您需要慎重选择最佳数据保存方式的原因。\n\n**第\
    \ 6 章**  \n\n**模型训练、验证与应用**\n\n## 训练阶段\n\n要训练机器学习模型，必须向机器学习算法提供训练数据，以便其学习。\n\n\
    训练数据应包含正确的输出，通常统称为目标（target）。训练算法的目的在于通过发现数据中的模式，构建能够将输入数据映射到目标的规则，这些规则将被纳入机器学习模型，使其能够对未来的数据输入产生正确的输出。\n\
    \n![Image](img/image00078.jpeg`)\n\n您的训练模型将能够对新的、未知的目标数据输出正确的结果。例如，您可以创建一个机器学习模型来判断电子邮件是否应被标记为垃圾邮件。\n\
    \n首先，您需要使用标记了每封邮件是否为垃圾邮件的数据进行训练，即训练数据的目标应为已知（即每封邮件被明确标记为“垃圾邮件”或“非垃圾邮件”）。此训练将产生一个能够自行判断任何给定电子邮件是否为垃圾邮件的机器学习模型。\n\
    \n可以使用多种工具创建和训练机器学习模型。例如，如果您需要构建神经网络模型，可以使用 Neuroph Studio 或书中提到的其他合适工具。\n\n大多数工具会引导您完成以下训练步骤：\n\
    \n1. 上传训练数据  \n   训练数据必须加载到工具中。训练数据可采用多种形式，如文本、图片、逗号分隔值（CSV）、JSON 等。\n\n   您的机器学习工具通常提供简便的数据上传机制。例如，Neuroph\
    \ Studio 要求您指定数据的分组方式，建议将数据保存在文本文件中并适当间隔。\n\n1. 数据标记  \n   接下来，您需要指示不同列是否通过逗号或制表符分隔。如果使用类似\
    \ Minitab 的工具，数据应通过制表符分隔，可能在文本文件中，并且需要指定哪些列为输入列、哪些列为输出（目标）列。\n\n   在 Minitab 等工具中，应将数据组织为行和列。对于\
    \ Neuroph Studio 等工具，您可以选择通过制表符、逗号等方式分隔数据；工具能够自动识别数据组织方式，并将其转换为行和列结构。\n\n   在数据标记阶段，您需要指定哪些列是输入列，哪些列是输出列。\n\
    \n1. 转换指令  \n   部分工具会要求您选择要应用于数据的训练算法类型。软件工具提供了多种机器学习算法，用于创建和训练机器学习模型。\n\n"
