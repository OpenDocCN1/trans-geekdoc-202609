    \ are not biased, they have large variances which normally deviate the observed\
    \ value largely from true value. If a degree of bias is added to regression estimates,\
    \ the standard errors will be reduced by ridge regression.\n\nThe equation for\
    \ linear regression should be as follows:\n\ny=a+ b\\*x\n\nTo the above equation\
    \ we must add an error term. Below is the complete equation:\n\ny=a+b\\*x+e (error\
