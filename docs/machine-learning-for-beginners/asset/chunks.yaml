    \ and observed values. For the case of multiple independent variables, we should\
    \ have the following:\n\ny=a+y= a+ b1x1+ b2x2+....+e\n\nThe shrinkage parameter,\
    \ lambda (λ) is used in ridge regression for the purpose of solving the multicollinearity\
    \ problem.\n\n1.  Lasso Regression\n\nLasso stands for Least Absolute Shrinkage\
