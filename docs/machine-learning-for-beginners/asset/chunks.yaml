    \n[Disadvantages of Artificial Neural Networks](#part0020.xhtml#id_Toc502666438)\n\
    \n[When to use Artificial Neural Networks](#part0020.xhtml#id_Toc502666439)\n\n\
    [CONCLUSION](#part0021.xhtml#id_Toc502666440)\n\n[Notes](#part0022.xhtml#id_Toc502666441)\n\
    \n[Thank You!](#part0023.xhtml#id_Toc502666442)\n\n# PREFACE\n\nMachine Learning\
    \ Algorithms: Comprehensive Guide For Beginners is a practical exploration of\
    \ machine learning. It is the best book to help a machine learning beginner become\
    \ a machine learning expert. The book explores all aspects of machine learning\
    \ in detail Practical examples are provided to help you better understand the\
    \ presented theory. \n\nMany people are interested in machine learning, but not\
    \ all of them have knowledge about computer programming, which is essential for\
    \ a thorough understanding of the subject. This book introduces machine learning\
    \ tools which can be used even by individuals without computer programming knowledge.\
    \ It teaches how to use such tools to create and train machine learning models\
    \ which can be used in turn for making predictions.\n\nData is critical to machine\
    \ learning. It must be collected and then refined through the detection and removal\
    \ of outliers. This book teaches you how to collect and prepare data. You will\
    \ also learn how to store machine data securely. \n\nThe steps of machine learning,\
    \ from training to validation to model application are covered in this book. Some\
    \ common machine learning problems are covered, such as over fitting, under fitting\
    \ and dirty data. This book guides you on how to avoid or solve such problems.\n\
    \nThere are various machine learning algorithms. Each algorithm falls into one\
    \ of three categories: supervised, unsupervised or reinforced learning. This book\
    \ explores the learning algorithms in detail. You will know how each algorithm\
    \ works and when to use it. Advantages and disadvantages of each algorithm are\
    \ discussed. The author’s well-chosen examples demonstrate how the algorithms\
    \ work; thus, you will learn to choose the best algorithm for any given application.\
    \ \n\n**Chapter 1  \n\n** Introduction To Machine Learning\n\nHuman beings are\
    \ constantly learning. If you consider the difference between child and adult\
    \ behavior, you will recognize the importance of learning to human development.\
    \ An individual is constantly influenced by his environment. Experience enables\
    \ an individual to change his or her behavior so as to interact more effectively\
    \ with the environment. Learning can therefore be defined as change which is influenced\
    \ by previous experience. Skills, habits, interests, and knowledge, as well as\
    \ other personal characteristics, result from learning.\n\nConsider a situation\
    \ in which a child touches a burning candle. The child will have a painful experience\
    \ and withdraw his hand. This experience will discourage the child from handling\
    \ burning objects in the future. During the course of our day-to-day lives, we\
    \ come across many learning circumstances which work together to shape future\
    \ behavior. Machine learning is very similar. Computer systems can learn from\
    \ their experiences, just like human beings.\n\n**Chapter 2  \n\n**Machine Learning\n\
    \nMachine learning in computing is borrowed from the behavior of human beings.\
    \ It is a branch of artificial intelligence which involves the design and development\
    \ of systems capable of self-improvements based upon previous experiences.\n\n\
    This means that when reacting to the same situation, a machine should show an\
    \ improvement from time to time.\n\nWith machine learning, software systems are\
    \ able to predict accurately without having to be programmed explicitly.\n\nThe\
    \ goal of machine learning is to build algorithms which can receive input data\
    \ and then apply statistical analyses to predict the output value within an acceptable\
    \ range.\n\nMachine learning is based upon the association of learning with pattern\
    \ recognition, and the theory that computers should be able to recognize patterns\
    \ in such a way as to “learn”, to adjust their responses without human intervention\
    \ (e.g. additional programming or human inputs). \n\nResearchers in the field\
    \ of artificial intelligence wanted to determine whether computers can learn from\
    \ accessible data. Machine learning is an iterative approach, and therefore machine\
    \ learning models are able to adapt as they are being exposed to new data. Models\
    \ learn from their previous computations (their outputs become inputs) to give\
    \ repeatable, reliable results and decisions.\n\nThe increasing popularity of\
    \ machine learning can be attributed to the same factors which led to the increasing\
    \ popularity of data mining. Such factors include the availability of cheaper\
    \ and powerful computational processing, greater varieties of data, and more affordable\
    \ means for data storage.\n\nGiven these three, it is easy to produce models capable\
    \ of analyzing bigger and more complex data to deliver quicker and more accurate\
    \ results. A more precise model makes it easier for a business to identify profitable\
    \ opportunities and to avoid risks.\n\nWith machine learning, businesses can also\
    \ draw conclusions and identify patterns which can help them create models for\
    \ making predictions. This can help them in making wise business decisions.\n\n\
    ## Details about Machine Learning\n\nMachine Learning algorithms can be categorized\
    \ into three classes, namely supervised, unsupervised or reinforced learning.\n\
    \n![Image](Images/image00072.jpeg)\n\n## Supervised Learning\n\n![Image](Images/image00073.jpeg)\n\
    \nFor the case of supervised learning, the human is expected to provide the desired\
    \ inputs and outputs as well as furnish feedback based on the accuracy of predictions\
    \ made training. After completion of training, the algorithm will have to apply\
    \ what it learnt to the next set of data.\n\nThe concept of supervised learning\
    \ can be compared to learning of a student under a teacher’s supervision. The\
    \ teacher provides input and output samples from which the student derives rules\
    \ which will then be applied to future inputs. \n\nThere are two kinds of supervised\
    \ machine learning algorithms: regression and classification.\n\nIn regression\
    \ problems, the target is a numeric value, while in classification, the target\
    \ is a class or a tag.\n\nA regression task can help determine the average cost\
    \ of all houses in London, while a classification task will help determine the\
    \ types of flowers based on the lengths of their sepals and petals.\n\n## Unsupervised\
    \ Learning\n\n![Image](Images/image00074.jpeg)\n\nFor the case of unsupervised\
    \ learning, algorithms are provided unlabeled inputs only - no output or feedback.\
    \ The algorithm uses an approach called deep learning, an iterative approach,\
    \ to review data and arrive at new conclusions.\n\nThis makes unsupervised learning\
    \ algorithms suitable for use in processing tasks of greater complexity than those\
    \ which can be handled by supervised learning algorithms. An unsupervised learning\
    \ algorithm learns solely from samples without any conclusions given, identifying\
    \ patterns from the samples on its own."
