- raw: "The goal of Reinforce Learning Algorithms is a decision model which, given\
    \ a certain combination of inputs (situation) will produce a desirable output\
    \ (response). The desired outputs (responses) are not given for training, only\
    \ the inputs (situation), but reinforcements are given based upon the desirability\
    \ of the decision (response). \n\nThe learning process involves the discovery\
    \ of the best decision, which is the one producing the maximum reward.\n\nA good\
    \ example of reinforced learning is a child’s process of learning to walk. The\
    \ child must watch others who are walking and try to imitate them. He or she will\
    \ realize that in order to walk, he must first stand up. She will stagger and\
    \ slip, but still be determined to stand. The next task will be to stand unassisted.\
    \ The child must be able to release his or her grasp on supports. Finally, he\
    \ or she will attempt to walk: decide which foot to start with, learn to balance\
    \ the body weight, etc.\n\nThe mathematical framework for obtaining a solution\
    \ to to reinforced learning problems is known as the Markov Decision Process.\n\
    \nThe process can be defined as follows:\n\n*   Set of states, S\n\n*   Set of\
    \ actions, A\n\n*   Reward function, R\n\n*   Policy, π\n\n*   Value, V\n\nAn\
    \ action (A) is required in order for us to transition from the start state to\
    \ the end state (S). We will earn a reward (R) for each action taken. Note that\
    \ we can get either positive or negative rewards for our actions. The actions\
    \ taken define the policy (π) and the rewards obtained define our value (V). Our\
    \ goal is to maximize the reward by selecting the right policy.\n\nThe travelling\
    \ salesman problem is a good example to which reinforced learning can be applied.\
    \ The goal is to move from the start point to the end point at the lowest cost\
    \ possible.\n\nGraphically, this is represented in the form of nodes and edges,\
    \ and the edges have values on them which indicate the cost of moving from one\
    \ point to another. In this case, the value is the total cumulative reward (accumulated\
    \ during the progression from node to node) during the execution of a policy.\n\
    \nIn both reinforced and supervised learning, there is mapping from the inputs\
    \ to the outputs. However, reinforced learning algorithms have a reward which\
    \ provides feedback to the learning agent whereas, supervised learning has an\
    \ external supervisor that share the knowledge with the agent to accomplish the\
    \ task.\n\nIn unsupervised learning, there is no mapping from inputs to the outputs.\
    \ The goal in unsupervised learning is to identify the underlying pattern or trend\
    \ in a dataset.\n\n**Chapter 8  \n\n**Regression Algorithms\n\nRegression analysis\
    \ is a type of predictive modeling with an aim of finding the relationship between\
    \ a dependent (or target) variable and an independent (or predictor) variable.\
    \ It is a good technique for time series modeling, forecasting, and for defining\
    \ a suspected relationship, such as that p between overloading of vehicles and\
    \ number of road accidents.\n\nIf you have recall, regression algorithms fall\
    \ under supervised learning algorithms.\n\n## How Regression Algorithms work\n\
    \nRegression is a good technique for one to model and analyze data. In most cases,\
    \ a best-fit curve or line is drawn for the data points with an aim of minimizing\
    \ the average distance from the point to the line or curve. Simply put, the purpose\
    \ of regression is to identify and describe the relationship (interdependence)\
    \ between two or even more variables. \n\nFor example, suppose you need to determine\
    \ how the sales of a company have grown with the changes in the economic conditions.\
    \ A regression on recent company data shows growth in company sales to be roughly\
    \ two and half times the growth in the economy. From information drawn from past\
    \ data we may be better able to predict future sales.\n\nWith regression analysis,\
    \ it is also possible for us to determine the impact of various variables on an\
    \ outcome. Examples include the impact of price changes and the promotional activities.\
    \ With such knowledge, data scientists, data analysts and market researchers can\
    \ know which variables to eliminate and which ones to use in building predictive\
    \ models.\n\n### Examples of Regression Algorithms\n\nThere are various types\
    \ of regression algorithms which can be used for making predictions. These techniques\
    \ are mostly influenced by factors such as the number of the dependent variables,\
    \ the number of the independent variables and the shape of the regression line.\n\
    \nLet’s discuss the various regression algorithms:\n\n1.  Linear Regression\n\n\
    This is a widely used technique in predictive modeling. The dependent variable\
    \ (Y) is always continuous while the independent variable (s) can be either continuous\
    \ or discrete.\n\nThe regression line is linear in shape. The goal is to determine\
    \ the relationship between the dependent variable (Y) and one or more of the independent\
    \ variables (X).\n\nA best-fit line is the regression line is used for this purpose.\
    \ Linear regression is represented by the following equation:\n\nY=a+b\\*X + e\n\
    \nIn which a represents the intercept, b represents the slope line while e is\
    \ the error term. If you are given the predictor variables, then it is possible\
    \ for you to predict the value of the dependent variable.\n\nIn multiple linear\
    \ regression, there are multiple independent variables, while in simple linear\
    \ regression there is only one.\n\nThe Least Square Method can help us get the\
    \ best-fit line. In other words, it can help us find the line which most accurately\
    \ defines the relationship between variables. It works by minimizing the sum of\
    \ squares of vertical deviations from every data point to our line. \n\nSquaring\
    \ of the deviations eliminates the problem of cancellation of all the error due\
    \ to the existence of both positive and negative deviations. The R-square method\
    \ can be used for assessing the performance of the model.\n\n1.  Logistic Regression\n\
    \nLogistic regression helps us to find the probabilities of failure and success\
    \ for an event. This algorithm should be used only when the dependent variable\
    \ takes binary values, that is: True/False, 0/1, etc.\n\nThe Y values should range\
    \ between 0 and 1, and they take the following equation:\n\nodds= p/ (1-p) = probability\
    \ of occurrence / probability of non- occurrence\n\nln(odds) = ln(p/(1-p))\n\n\
    logit(p) = ln(p/(1-p)) = b0+b1X1+b2X2+b3X3....+bkXk\n\nIn the above equation,\
    \ p represents the probability of the presence of a characteristic of interest.\
    \ This algorithm is widely used in classification problems.\n\nIn order to avoid\
    \ the problems of overfitting and underfitting, ensure that all significant variables\
    \ have been included. Large sample sizes are also required for this algorithm,\
    \ as maximum likelihood estimates are less powerful in cases of low sample sizes\
    \ compared to ordinary least square.\n\n1.  Polynomial Regression\n\nA regression\
    \ equation is said to be polynomial if the independent variable has a power greater\
    \ than 1. Below is an example of a polynomial equation:\n\ny=a+b\\*x^2\n\nWith\
    \ such an equation, the best-fit line will not be adequate. A polynomial equation\
    \ produces a curve, so it will be a curve that best fits our data points. If you\
    \ choose to minimize error by using a high degree polynomial, you can experience\
    \ the problem of overfitting.\n\n1.  Stepwise Regression\n\nThis is the best regression\
    \ technique when there are many independent variables. An automatic process has\
    \ to be employed for the purpose of choosing the independent variables, and no\
    \ human intervention is involved.\n\nTo achieve the feat, we have to observe statistical\
    \ values such as the R-square, AIC metric and t-stat.\n\nStepwise regression will\
    \ fit the regression model by dropping/adding covariates, one by one, depending\
    \ on certain specified criteria.\n\nBelow are some of the methods commonly used\
    \ in stepwise regression:\n\n*   Standard stepwise regression adds and removes\
    \ predictors in the way expected in every step.  \n\n*   Forward selection begins\
    \ with the most significant predictor in your model, and it adds a variable for\
    \ every step.  "
