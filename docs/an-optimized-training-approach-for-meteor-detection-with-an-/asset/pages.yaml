    **Table 1** Summary of data sources used to compose the meteor dataset.


    | Class | Source | Images | Total |

    | :--- | :--- | :--- | :--- |

    | Meteor | BRAMON | 2520 | |

    | Meteor | UKMON | 665 | 3850 |

