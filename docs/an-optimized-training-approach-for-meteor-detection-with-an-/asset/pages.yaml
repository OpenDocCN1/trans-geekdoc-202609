    # Fig. 2. The architectures from the used VGG16 and VGG16+CBAM models.


    | Training strategy | # of epochs | Batch size | Learning rate | Weight decay
    |

    |---|---|---|---|---|

    | Training | 10 | 8 | 10^-5 | 5 x 10^-4 |

