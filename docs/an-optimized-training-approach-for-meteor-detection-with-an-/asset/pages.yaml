    # 4. Results and discussion


    We present a comparative analysis of the results obtained from VGG16 and VGG16
    with the CBAM attention mechanism models. Table 3 shows the training, validation,
    and test results. We highlight that the difference in the metrics between the
    two models was only in the third decimal place. This result demonstrates that
    the performance of both classifiers was remarkably similar. However, we observed
    a considerable variation in the metrics from the VGG16 model. This variation could
    indicate that the model without the CBAM attention mechanism tends to have more
    instability to generalize in the different folds.


    Subsequently, we selected the final models from the cross-validation process by
    comparing the metrics values. Therefore, we consider the higher values of Acc,
    Sn, Sp, TSS, and the lower value of FAR. Table 4 shows the evaluation metrics
    of the best classifiers from the VGG16 and VGG16+CBAM architectures. The results
    obtained from the final models were also close, with an Acc of 0.9736 and 0.97,
    respectively. Nonetheless, the TSS and FAR metrics may suggest that the final
    VGG16 model correctly discriminates meteors from other events slightly more than
    the final VGG16 with the CBAM attention mechanism model.


    On the other hand, the difference between the Sn and Sp values from the VGG16+CBAM
    model was lower than in the VGG16 network. Since these metrics are inversely proportional,
    a minor difference between them may indicate an improvement in robustness. Overall,
    we did not observe any significant statistics to determine whether the performance
    is better between the two models.


    Indeed, the results from the confusion matrices of the final models were similar,
    as Fig. 3 shows. Although the VGG16


    model performed slightly better in the evaluation metrics, the VGG16+CBAM network
    achieved a lower value of FP than FN. This result is a desirable behavior since
    meteors are events that occasionally occur. Thus, we must mitigate more non-meteor
    images wrongly classified as meteors rather than the opposite.


    To further verify the performance of the models, we performed a visual explanation
    analysis with 100 new real-world images. This new set of images consists of 50
    non-meteor and 50 meteor optical observations from BRAMON, UKMON, and BOAM. We
    then fed the images into the best-selected classifiers and used them to generate
    the predictions and the heat maps. Therefore, Fig. 4 shows the most pertinent
    visualization results with the corresponding predicted class and the prediction
    probability of belonging to that class (P).


    In these results, the VGG16 model made 39 out of 50 hits in forecasting the non-meteor
    class. In comparison, the VGG16+CBAM model corrected predicted 45 out of 50 non-meteor
    images. Interestingly, the visual explanation from the model with CBAM captured
    the most relevant features that characterize the predicted class. On the other
    hand, the VGG16 model sometimes focused on more specific regions at the bottom-right
    and top-left of the images, indicating overfitting by learning the noise from
    the data.


    For the meteor images, the VGG16 model correctly classified 46 out of 50 images.
    In contrast, the VGG16+CBAM model wrongly predicted only one out of 50 meteor
    images. In the'
