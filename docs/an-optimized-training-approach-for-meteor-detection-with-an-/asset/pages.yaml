  md: 'Full length article


    # An optimized training approach for meteor detection with an attention mechanism
    to improve robustness on limited data


    V.Y. Shirasuna, A.L.S. Gradvohl *


    Faculdade de Tecnologia, Universidade Estadual de Campinas, R. Paschoal Marmo,
    1888, Limeira, 13484-332, SP, Brazil


    # ARTICLE INFO


    +   Article history:

    +   Received 27 June 2023

    +   Accepted 21 August 2023

    +   Available online 26 August 2023


    +   Dataset link: Image dataset for the creation of an automatic system for meteor
    fall detecion (Original data)


    +   Keywords:

    +   Meteor detection

    +   Optical observations

    +   Deep learning

    +   Optimization


    # ABSTRACT


    Researchers have extensively used convolutional neural networks to detect meteor
    falls on Earth. However, when dealing with limited available data, these networks
    may need more robustness to classify new real-world images correctly. This study
    proposes an optimized training approach of a pre-trained model with an attention
    mechanism to achieve better generalization results in such a scenario. We compare
    two architectures, an optimized base model and another version with an attention
    mechanism. Furthermore, we present a new and publicly available optical meteor
    dataset that merges several public data sources. We used the merged dataset to
    train classification models combined with a stratified five-fold cross-validation
    strategy to determine the reliability of the prediction. The experimental results
    from both architectures showed good and similar performance. To further determine
    the best architecture, we performed an additional analysis with visual explanations
    in new observations. The architecture with an attention mechanism was the best
    model achieving a false alarm ratio of 2.6% and an accuracy of 97%.


    # 1. Introduction


    When meteoroids in space enter Earth''s upper atmosphere and begin to glow, they
    become meteors. When a meteor falls, the excitation of air molecules produces
    the light and color of its trail. Meteors travel in different orbits around the
    Sun and can strike Earth from any angle. Unlike other pursuits of observation
    in astronomy, meteor observers do not need expensive equipment to spot them (Lunsford,
    2009).


    Detecting meteor falls plays a critical role in understanding the formation of
    the Solar System, because we can obtain much relevant information from meteor
    observations, such as direction, speeds, and masses (Koschny et al., 2019).


    There are geographically distributed meteor network observation communities worldwide
    with the help of citizen scientists. The Brazilian Meteor Observation Network
    (BRAMON) is one of the largest meteor monitoring networks in the world, considering
    the number of stations and the covered area, (Betzel, 2022). However, cameras
    inevitably capture events similar to meteors, such as aircraft, satellites, clouds,
    flashing lights, and atmospheric events, which challenge the detection by humans
    or systems. Therefore, it is essential to establish a robust classifier to discriminate
    meteors from other sorts of objects correctly.


    * Corresponding author.

    E-mail addresses: victor.shirasuna@gmail.com (V.Y. Shirasuna), gradvohl@unicamp.br
    (A.L.S. Gradvohl).


    Convolutional Neural Networks (CNN) have achieved remarkable results in computer
    vision, surpassing humans in applications such as object recognition (He et al.,
    2015). Therefore, we can attach attention mechanisms to CNNs to select relevant
    features. Previous studies have adopted CNN classification models to predict the
    “meteor” or “non-meteor” class of optical observations. Although this approach
    leads to compelling results, it is much more data-hungry due to the number of
    parameters to include in the estimation process (Yamashita et al., 2018). This
    situation can lead to a lack of robustness when dealing with limited training
    data due to overfitting.


    In this study, we investigate the use of attention mechanisms with optimized CNN
    architecture training to achieve better generalization results when detecting
    meteors in sky images. We show that this approach has the potential to overcome
    the need for large volumes of data and improves the prediction robustness in the
    application of meteor detection. Furthermore, we present a new and publicly available
    optical observation of 7000 balanced meteors and non-meteors images by merging
    three public data sources to aid future work. We also performed a visual explanation
    analysis with the Grad-CAM algorithm on new images to determine the best architecture
    by analyzing the features to which the classifiers pay more attention.


    We organize the rest of this paper as follows. Section 2 presents the related
    work. Then, Section 3 describes the methodology adopted in the study. Section
    4 shows and discusses the results of the experiments we conducted in this research.
    Section 5 presents the final remarks on this work.'
