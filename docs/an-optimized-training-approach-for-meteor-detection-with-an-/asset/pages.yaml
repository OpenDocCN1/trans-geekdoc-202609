    Automatic meteor detection has received more attention as astronomers employ machine
    learning methods. Researchers have proposed several approaches with different
    data sizes and sources, with successful results. For instance, Cicco et al. (2017)
    explored the application of machine learning deep learning algorithms by applying
    random forest (RF), long short-term memory (LSTM), and CNNs for the Cameras for
    All-Sky Meteor Surveillance (CAMS) datasets. Their work claims the capacity of
    deep learning techniques to achieve state-of-the-art results without performing
    a manual feature selection as in machine learning.


    However, the same amount of labeled data is only sometimes readily available.
    Therefore, this section discusses the methodologies used in our study to implement
    the optimization of a VGG16 model attached to CBAM attention mechanisms to improve
    generalization with a dataset of 7000 image data.


    In turn, Gural (2019) performed a recurrent neural network (RNN) and a CNN named
    MeteorNet to automate the post-detection screening of potential meteor tracks
    in the CAMS pipeline. He obtained 100,000 meteors and 100,000 non-meteors from
    video imaging, with no data augmentation, to train and evaluate the algorithms.
    Since CNNs are suitable for handling spatial information, MeteorNet leveraged
    this feature to capture 99.94% of meteor falls. In contrast, RNNs processing temporal
    or sequential data achieved 98.1% positive images of meteors. Because our study’s
    available training data is much smaller, we focus on achieving comparable results
    by optimizing the CNN architecture and its training.


    # ### 3.1. Computing environment


    In addition, Cecil and Campbell-Brown (2020) proposed a custom meteor detection
    pipeline with a filtering stage of the best 18 CNNs. Their best model could filter
    5485 unseen samples with 99.8% accuracy. Therefore, to accomplish the results,
    they extracted 22,444 images of meteors and 33,786 images of non-meteors manually
    labeled from the Canadian Automated Meteor Observatory by video imaging.


    We performed all implementations and experiments using Python version 3.8.10 and
    the following libraries: Tensorflow version 2.11, Scikit-learn version 1.2.2,
    Numpy version 1.23.4, Pandas version 2.0.0, and Matplotlib version 3.6.2. The
    High Performance Intelligent Decision Systems research group supported this work.
    It provided a 2.9 GHz Intel Core i7 16 core processor, with 16 GB RAM, and NVIDIA
    TITAN Xp running on a Rocky Linux 8.6 operating system.


    # ### 3.2. Meteor image dataset


    More recently, Al-Owais et al. (2023) introduced object detection using YOLO algorithms
    of meteor and non-meteor objects by reaching 98.5% recall. They achieved this
    result by employing 16,965 imbalanced images from the U.A.E. Meteor Monitoring
    Network. Although one can easily integrate both works to operate as a detection
    system, the current research focuses on improving the meteor detection stage in
    the scenario of limited labeled data.


    The meteor image dataset we used contains 7000 unique sky photos of the occurrence
    or non-occurrence of falling meteors. Different instruments recorded the images
    in the period from 2014 to 2023. Therefore, we balanced the dataset with a 55:45
    ratio of meteors to non-meteors to prevent the model from becoming biased towards
    one class. Table 1 presents the summary statistics of the dataset.


    In close connection to our work, Galindo and Lorena (2018) introduce the application
    of a pre-trained model and exploit different approaches. They performed their
    experiments in a dataset of 1000 images of meteors and 660 images of non-meteors.
    They merged this dataset with data from the Universidade do Vale do Paraíba and
    the EXOSS website. Marsola and Lorena (2019) also applied transfer learning with
    a smaller dataset using the same data sources. Both works showed that fine-tuning
    was an essential technique to improve performance accuracy. However, Galindo and
    Lorena (2018) demonstrated how data augmentation worsens performance accuracy
    in their results, even when using small augmentation data.


    Three different data sources provided a diverse set of sky scenes, as Fig. 1 exemplifies.
    The instruments captured the images mainly at night with the presence of other
    events, such as aircraft lights, satellites, clouds, flashing lights, image errors,
    and atmospheric events.


    In our work, we performed fine-tuning and did not use data augmentation as an
    essential element to leverage the model performance. Although other works mentioned
    here achieved successful accuracy results, it is unclear whether the robustness
    capacity is suitable to correctly distinguish meteors from other events, such
    as aircraft lights or other atmospheric occurrences. In our work, we concentrate
    on attaining the same results concerning the robustness of focusing on the relevant
    features with attention mechanisms.


    In our experiments, we resized all the images in the dataset to 224 × 224 pixels
    in the RGB color space, and then we rescaled each image by a factor of 1:255 using
    a data generator. We did not perform any data augmentation as it can decrease
    performance accuracy (Galindo and Lorena, 2018). We also cropped 24 pixels from
    the lower part of each image to remove the captions, which can potentially be
    used as a feature in the prediction task.


    # ### 3.2.1. Data sources


    # ## 3. Methodology


    The meteor dataset we used in this work derives from three primary data sources:
    the Brazilian Meteor Observation Network (BRAMON, 2023), the UK Meteor Network
    (UKMON, 2023), and the Base des Observateurs Amateurs de Météores (BOAM, 2023)
    repositories. Since observers can spot meteors from different angles depending
    on locations, they are encouraged to contribute by mounting their stations, which
    provide valuable scientific data on meteor falls.


    There are successful attempts to use deep neural networks by leveraging substantial
    amounts of data, as many meteor monitoring stations produce vast amounts of video
    data of the skies daily.


    BRAMON has approximately 130 stations and a covered area of 1.3 × 10^6 km^2 on
    Brazil’s territory. BRAMON is considered one of the largest meteor monitoring
    networks in the world according to the factors described (Betzler, 2022). Therefore,
    the images from BRAMON in our dataset are responsible for approximately 66% of
    meteors and 87% of non-meteors. Moreover, most raw images have diverse characteristics,
    such as resolutions, aspect ratios, brightness, and colors.'
