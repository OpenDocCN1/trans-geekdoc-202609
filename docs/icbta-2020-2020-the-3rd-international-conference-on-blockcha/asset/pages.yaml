    # 2 BLOCK CHAIN APPLICATION STATUS AND RAILWAY FIELD EXPLORATION


    # 2.1 Global Block Chain Application Status Analysis


    Most countries have positive attitudes towards the block chain technology, while
    the industrial development stages are different. Australia, South Korea, Germany,
    Netherlands, Cyprus, the United Arab Emirates and Maltese have actively developed
    the block chain industry and set up the overall development strategy nationally.
    The United States, China, South Korea, the United Kingdom, Australia and the European
    Union attach great importance


    to the research and application of block chain. At the same time, China, Australia,
    France, Switzerland and Finland have successively developed industry laws and
    rules on block chain supervision [2], as shown in Figure 2 [3].


    In application, block chain, which is derived from encrypted digital currency,
    is extending to many fields. Developed countries have carried out many practices
    on block chain [4]. The United States, Estonia and Dubai have promoted the digital
    transformation of government actively. Japan, Australia and Germany have used
    block chain to explore financial cost reduction and efficiency improvement. Switzerland
    and the United States have tried to use block chain to promote property registration
    and transaction distribution. Singapore and Switzerland have used block chain
    in the trade and logistics to provide customers the more convenient delivery paradigm.
    The United Kingdom and the United States have applied block chain to engage in
    social and livelihood undertakings to enlarge the benefits of public funds.


    Up to March 2019, the number of block chain enterprises in China is second only
    to the United States, reaching to 499 and 553 respectively. These enterprises
    mainly concentrate in Beijing, Shanghai,'
