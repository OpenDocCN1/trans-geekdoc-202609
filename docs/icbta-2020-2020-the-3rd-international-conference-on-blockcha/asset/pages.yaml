    # ABSTRACT


    The block chain has many unique characteristics, like decentralization, stability,
    openness and transparency. We can apply block chain in many fields of railway
    to improve the comprehensive efficiency and benefit, such as railway passenger
    and freight service, engineering construction, big data sharing and so on. With
    the gradual completion of data service platform, big data lake and cloud computing
    in China Railway, these foundations can support the railway block chain application.
    The paper analyzed the development status and existing problems of block chain
    at home and abroad. Through the multidimensional analysis for the mainstream block
    chain platform architecture, the thesis gets the architecture selection of the
    railway block chain platform. Based on the hyperledger fabric, we propose the
    technical architecture and overall scheme for the railway block chain service
    platform respectively. The paper also designs the implementation path for the
    platform application construction. This research plays an important role and significance
    in promoting the block chain technology applying and developing in the railway
    field.


