    ## 2.2 Exploration on Blockchain Application in Railway Field


    In the railway field, some countries have also actively explored the blockchain
    application. DB, a German railway, cooperated with the blockchain integration
    platform Unibright to develop a tagging ecosystem based on the blockchain. The
    ecosystem has connected the different areas of the passengers'' whole journey.
    Every part of the journey would be marked, such as mileage, service, catering,
    hotel reservation, local transportation, etc. Aiming to reduce the operation cost
    through blockchain application, the ecosystem has realized the cooperation with
    other tourism company interaction. RZD, a Russian railway transport company, has
    launched a cryptocurrency ticketing based on blockchain and a railway freight
    digital trading platform based on blockchain. In August 2017, more than 200 well-known
    freight and logistics enterprises, such as BNSF railway company, UPS, FedEx and
    Schneider cargo, joined the BITA alliance. BITA became the world largest blockchain
    business alliance. In addition, railway companies in Switzerland, the Netherlands,
    Canada and other countries have also begun to introduce blockchain and cryptocurrency
    into the railway transportation industry.


    ## 2.3 Problems in Blockchain Application


    With blockchain becoming more and more mature, there are still some problems.

    - blockchain may cause financial institutions or enterprises to face complex legal
    and compliance issues.

    - the current distributed ledger technology is still immature, which needs more
    industry applications to prove [5].

    - There are many technical routes of blockchain. Different types of blockchains
    are easy to form information isolated chains.

    - Decentralization has a great impact on the existing operation pattern. There
    is no internal driving force for active change in related fields.

    - The sustainability of basic technology maintenance of open-source blockchain
    is poor.

    - Abuse and widespread use are obvious.


    ## 3 COMPARATIVE ANALYSIS AND TECHNOLOGY SELECTION FOR MAINSTREAM BLOCKCHAIN PLATFORM


    Blockchain technology is developing rapidly. The blockchain platforms are becoming
    more and more diverse. The mainstream blockchain platforms in the market include
    Ethereum, Fabric, Corda, BCOS and DNA.


    Blockchain includes public chain, alliance chain and private chain. Each node
    in the public chain can join and exit the network freely. All nodes can participate
    in reading and writing the data on the chain. When reading and writing, the network
    is interconnected with a flat topology. There is no centralized server node in
    the network, which is suitable for the decentralized opening scenario. Each


    Ethereum represents the public chain technology, while Fabric, Corda, BCOS and
    DNA represent the alliance chain. This paper analyzes the platform architecture
    from architecture capability, core components, application function, technical
    level, security mechanism, platform applicability, development and tools, maintenance
    and support.


    In the business operation, especially the railway big data sharing and international
    intermodal transportation business, the State Railway Group involves logistics
    enterprises at home and abroad, buyers and sellers, financial institutions, foreign
    trade merchants, customs, government supervision and other institutions. In the
    actual business operation, there is a mutually exclusive relationship of interests
    under the "weak trust relationship". By using blockchain technology, many participants
    will establish a collaborative "strong trust relationship" to jointly store certificates,
    and build a data circulation network of participants'' business data from "self-certification"
    to "other certificates, multiple certificates, security and credibility". In the
    process of building a blockchain platform, China Railway Group needs to consider
    such factors as node authorization, data access rights on the chain, smart contract
    security, data security on the chain, convenience of consensus mechanism upgrade,
    stable transaction cost, reliability and government supervision. There is no authorization
    control for the nodes and data on the public chain, and most of them are linked
    with the attached cryptocurrency. The transaction fees fluctuate greatly under
