    # 1 INTRODUCTION


    With the new round of scientific revolution and industrial reform sweeping the
    world now, new technologies such as big data, cloud computing, internet of things,
    artificial intelligence, block chain are emerging and penetrating rapidly. Digital
    economy has deeply changed the way of human life and industrial production. As
    one disruptive technology, block chain is promoting the global transition from
    Information Internet to Value Internet. The block chain applications have the
    capacities to reduce costs and improve efficiency for the real economy. They can
    also boost the traditional industries to development well and hasten the transformation
    and upgrading.


    In general, we divide the development process of block chain into 6 stages from
    2009 to 2025: technology test, geek niche, market brewing, mainstream acceptance,
    industrial lending and industrial maturity. Block chain develops from block chain
    1.0 to block chain 4.0, as shown in Figure 1. The rapid developments of related
    technologies and single application promote the wide application of block chain
    in industrial world.


    As the artery of the national economy and the popular means of transportation,
    the railway transportation has made remarkable achievements after the informatization
    construction during more than 30 years. China Railway has built up the integrated
    information integration platform and multiple business information systems, which
    cover the passenger and freight services, business management, dispatching command,
    safety supervision and other fields. Recent years, China Railway has also carried
    out some innovative applications using the big data and artificial intelligence
    based on the massive data assets. These efforts can provide the enough support
    for the block chain application. At the same time, China Railway is also facing
    the challenges under new situations and circumstances, like reducing costs and
    increasing efficiency. The railway system has complex features, such as the large
    scale, the long business chain and many involved fields. The block chain technology
    can reduce the supervision and management costs under the certain circumstance
    of railway [1]. Integrated application of block chain can be beneficial to reduce
    the overall cost of railway passenger and freight transportation and even the
    whole society. That will promote the high-quality development for the railway
    in the new period.


    The thesis comprehensively analyzed the application and development status of
