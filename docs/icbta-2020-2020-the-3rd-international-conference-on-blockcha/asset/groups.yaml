    application scenarios, such as inter agency transaction, settlement and clearing.
    The write permission of each node in the private chain is controlled internally,
    while the read permission is selectively opened to the public according to the
    demand. Private chain has the general structure of multi node operation of block
    chain, which is suitable for scenarios with high privacy requirements, such as
    internal data management and audit of specific institutions.


    # 2.2 Exploration on Block Chain Application in Railway Field


    In the railway field, some countries have also actively explored the block chain
    application. DB, a German railway, cooperated with the block chain integration
    platform Unibright to develop a tagging ecosystem based on the block chain. The
    ecosystem has connected the different areas of the passengers'' whole journey.
    Every part of the journey would be marked, such as mileage, service, catering,
    hotel reservation, local transportation, etc. Aiming to reduce the operation cost
    through block chain application, the ecosystem has realized the cooperation with
    other tourism company interaction. RZD, a Russian railway transport company, has
    launched a crypto currency ticketing based on block chain and a railway freight
    digital trading platform based on block chain. In August 2017, more than 200 well-known
    freight and logistics enterprises, such as BNSF railway company, UPS, FedEx and
    Schneider cargo, joined the BITA alliance. BITA became the world largest block
    chain business alliance. In addition, railway companies in Switzerland, the Netherlands,
    Canada and other countries have also begun to introduce block chain and crypto
    currency into the railway transportation industry.


    # 2.3 Problems in Block Chain Application


    With block chain becoming more and more mature, there are still some problems.
    (1) block chain may cause financial institutions or enterprises to face complex
    legal and compliance issues. (2) the current distributed ledger technology is
    still immature, which needs more industry applications to prove [5]. (3) There
    are many technical routes of block chain. Different types of block chains are
    easy to form information isolated chains. (4) Decentralization has a great impact
    on the existing operation pattern. There is no internal driving force for active
    change in related fields. (5) The sustainability of basic technology maintenance
    of open-source block chain is poor. (6) Abuse and widespread use are obvious.


    # 3 COMPARATIVE ANALYSIS AND TECHNOLOGY SELECTION FOR MAINSTREAM BLOCK CHAIN PLATFORM


    Block chain technology is developing rapidly. The block chain platforms are becoming
    more and more diverse. The mainstream block chain platforms in the market include
    Ethereum, Fabric, Corda, BCOS and DNA.


    Block chain includes public chain, alliance chain and private chain. Each node
    in the public chain can join and exit the network freely. All nodes can participate
    in reading and writing the data on the chain. When reading and writing, the network
    is interconnected with a flat topology. There is no centralized server node in
    the network, which is suitable for the decentralized opening scenario. Each


    Ethereum represents the public chain technology, while Fabric, Corda, BCOS and
    DNA represent the alliance chain. This paper analyzes the platform architecture
    from architecture capability, core components, application function, technical
    level, security mechanism, platform applicability, development and tools, maintenance
    and support.


    In the business operation, especially the railway big data sharing and international
    intermodal transportation business, the State Railway Group involves logistics
    enterprises at home and abroad, buyers and sellers, financial institutions, foreign
    trade merchants, customs, government supervision and other institutions. In the
    actual business operation, there is a mutually exclusive relationship of interests
    under the "weak trust relationship". By using block chain technology, many participants
    will establish a collaborative "strong trust relationship" to jointly store certificates,
    and build a data circulation network of participants'' business data from "self-certification"
    to "other certificates, multiple certificates, security and credibility". In the
    process of building a block chain platform, China Railway Group needs to consider
    such factors as node authorization, data access rights on the chain, smart contract
    security, data security on the chain, convenience of consensus mechanism upgrade,
