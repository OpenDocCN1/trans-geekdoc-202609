    ## 铁路区块链服务平台的技术架构与总体方案研究


    ZHANG XIAODONG*

    中国铁道科学研究院，

    计算技术研究所，

    中国


    LI PING

    中国铁道科学研究院，

    中国


    MA XIAONING

    中国铁道科学研究院，

    计算技术研究所，

    中国


    ## 摘要


    区块链具有许多独特的特性，如去中心化、稳定性、开放性和透明性。我们可以在铁路的许多领域应用区块链，以提高综合效率和效益，例如铁路客货运输服务、工程建设、大数据共享等。随着中国铁路数据服务平台、大数据湖和云计算的逐步完善，这些基础可以支持铁路区块链应用。本文分析了国内外区块链的发展现状和存在问题。通过对主流区块链平台架构的多维度分析，本文得出了铁路区块链平台的架构选型。基于
    Hyperledger Fabric，本文分别提出了铁路区块链服务平台的技术架构和总体方案。本文还设计了平台应用构建的实施路径。该研究对推动区块链技术在铁路领域的应用和发展具有重要作用和意义。


    ## CCS 概念


    - 信息系统；信息系统应用；

    - 企业信息系统；


    ## 关键词


    区块链平台，铁路信息规划，技术架构，Hyperledger Fabric，互连


