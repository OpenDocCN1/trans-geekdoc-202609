  \ | 74.5% (+4.2%) |\n\n# 18.6 与其他 CNN 模型的比较\n\n将基于补块的 CNN 模型与其他图像分类模型进行比较时，会涉及到若干因素，包括性能、计算效率、可解释性和泛化性。在这里，我们将基于补块的\
  \ CNN 模型与一些常用的替代方案进行了比较。\n\n### 18.6.1 全卷积网络\n\n基于补块的 CNN 模型在孤立的补块上运行，而 `FCNs` 同时处理整个图像，从而实现密集的像素级预测。基于补块的\
  \ CNN 能够捕捉细粒度的局部细节，但由于是按补块处理的，需要更多的计算资源。`FCNs` 计算效率高，能够捕捉全局上下文，但在保留细微细节方面可能面临困难。\n\
  \n### 18.6.2 全局 CNN\n\n基于补块的 CNN 通过逐个分析补块来利用局部信息，使其适用于局部特征重要的任务。全局 CNN 考虑整个图像，允许它们捕捉全局结构和关系。基于补块的\
  \ CNN 更适用于局部模式和细节起重要作用的任务，例如纹理分析、目标识别 [37]。\n\n### 18.6.3 迁移学习\n\n迁移学习涉及利用在大量数据集上预训练的模型，并针对特定任务进行微调。基于补块的\
  \ CNN 模型也可以通过利用补块的预训练权重从中受益。迁移学习的训练时间和数据需求比从零开始训练基于补块的模型更高效。\n\n### 18.6.4 空间金字塔池化网络\n\
  \n`SPPNs` 通过多尺度空间池化捕捉不同尺度的特征，结合了全局和局部信息。基于补块的 CNN 可以被视为 SPPN 的特殊情况，即使用单层（补块）而不是多层。`SPPNs`\
  \ 在捕捉全局和局部信息方面具有灵活性，适用于多尺度重要的任务。\n\n总结来说，基于补块的 CNN 模型在捕捉细粒度局部细节方面表现，适用于局部特征起至关作用的任务。然而，它们需要更多的计算资源，并且缺乏捕捉全局上下文的能力。诸如\
  \ `FCNs`、全局 CNN、迁移学习和 `SPPNs` 等模型根据分类任务的具体需求（例如对全局上下文的需求、计算效率或利用预训练模型）提供了不同的优势。模型的选择取决于这些因素之间的平衡以及所解决分类问题的特定特征。\n\
  \n## 18.7 研究空白\n\n虽然基于补块的图像分类 CNN 模型领域取得了进展，但仍然存在研究空白和开放问题，这些为进一步的研究和改进提供了机会。例如，CNN\
  \ 模型通常缺乏对补块之间上下文关系的显式建模。探索有效捕捉和利用补块之间的全局上下文和远程依赖的方法可以增强基于补块模型的性能。在可解释性和说明性方面，理解基于补块的\
  \ CNN 决策过程对于建立信任和可解释性非常重要。开发在补块级别解释和说明模型决策的方法，并聚合这些解释用于图像级分类，可以提高模型的透明度并促进其在现实世界中的应用。\n\
  \n\n\n\n此外，训练数据的不平衡（某些类别的样本少于其他类别）会对基于块的 CNN 模型性能产生负面影响。研究缓解类别不平衡影响的技术，例如定制的采样策略、创新的数据合成方法或优化过程中的自适应类别平衡，可以使这些模型更好地处理常见的倾斜场景。最后，向新领域的泛化是一个仍需更多研究的领域。在某数据集上训练的基于块的模型无法很好地泛化到新领域或具有不同特征的数据集。研究领域适应技术、迁移学习策略或提高跨不同数据集模型泛化能力的方法是一个重要的研究方向。解决这些研究空白可以促进图像分类中基于块的\
  \ CNN 模型的进步，提高其准确性、效率、可解释性和泛化能力。人员可以探索这些领域，以增强对基于块的方法在各种应用和领域中的理解和有效性。\n\n## 18.8\
  \ 局限性\n\n虽然基于块的 CNN 模型在图像分类任务中显示了其有效性，但它们确实存在某些局限性，例如全局上下文的丢失；基于块的 CNN 模型在孤立的补块上运行，无法直接访问全局图像上下文，这可能会限制它们捕捉图像不同区域之间高层语义关系和依赖关系。全局上下文对于理解整体场景和对对象进行上下文推理至关重要。\n\
  \n对块大小和位置的敏感性是另一个问题；基于块的 CNN 模型的性能对块的大小和空间布局非常敏感。选择不合适的块大小或位置可能会导致重要信息的丢失或在分类过程中引入噪声。寻找最佳的块大小和放置可能是具有挑战性的，可能需要尝试错误或额外的计算资源。\n\
  \n计算效率是另一个挑战，指的是独立处理单个补块，这在处理大型图像或数据集时是一项计算密集型任务。与全图像方法相比，提取、处理和分类大量补块的需求会增加基于块的\
  \ CNN 模型的计算成本和训练时间。这种局限性在处理实时或资源受限的应用时变得更加显著。\n\n处理全局和局部尺度变化也可能困难；基于块的 CNN 模型可能难以捕捉对象或场景的尺度变化。当对象以不同的尺度或分辨率出现时，基于块的方法可能需要多尺度分析或使用多种块大小，这会进一步增加计算复杂度。最后，有限的上下文信息可能成为障碍。虽然补块捕捉了局部信息，但它们可能无法完全捕捉图像中对象之间的上下文和关系。对块的局部分析可能无法充分捕捉对准确图像分类至关重要的大规模结构、长距离依赖或上下文线索。在将基于块的\
  \ CNN 模型应用于图像分类任务时，考虑这些局限性非常重要。研究人员正在不断探索解决这些局限的方法，例如整合全局上下文、处理尺度变化和提高计算效率，以增强基于块的方法在图像分类中的性能。\n\
  \n## 18.9 结论与未来展望\n\n在这项研究工作中，我们对基于块的神经网络算法进行了综述，这些算法已成为处理自然照片最突出的模型。本综述对基于块的神经网络算法进行了全面检查，证明了它们在自然图像分类任务中非常有效。近期许多研究显示了它们在现实应用中的用处。\n\
  \n为了强调本综述的独特性，我们彻底检查了基于块的 CNN 模型在各种数据集上的性能，并将其与传统的 CNN 模型进行了对比。我们的研究明确表明，基于块的 CNN\
  \ 模型表现优于传统的 CNN 模型。未来研究应侧重于解决基于块模型的局限性，例如整合全局上下文、处理尺度变化和提高计算效率。\n\n## 参考文献\n\n*\
