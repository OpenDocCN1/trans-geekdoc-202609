  \n## 10.1 引言\n阅读和理解医学报告具有挑战性，因为普通公众缺乏专业的医学知识，尤其是由于使用了较多的术语。这种障碍可能会阻碍医疗提供者与患者之间的有效沟通，导致误解和非理想的结果。研究人员已经解决了许多技术和非技术问题，包括高级术语的使用；领域特定知识的缺乏导致了误解。\n\
  \n处理和解释医学报告面临多重挑战。传统的机器学习算法需要训练数据集，包括医学字典，这些字典必须定期更新以跟上领域进展。这些数据集还需要大量的存储空间，而且根据解码所需的术语，解码的响应时间可能缓慢且不稳定。在本章中，我们提议使用\
  \ `LLM` 结合 `OCR` 将处方解码为通用语言，同时优化空间、时间和成本。我们的目标是消除基于传统数据集解码。\n\n我们还提议使用更高效的云端 OCR\
  \ 工具来理解扫描文档并从中准确提取文本。研究人员长期以来旨在理解临床笔记，而 `OCR` 一直是从扫描文档中提取文本的核心概念。作者提供了一种解决方案，通过使用\
  \ `OCR` 从处方中提取文本并理解药物，然后将其添加到在线篮中。描述的 `OCR` 流程可以通过在 `Azure Cognitive Service` 上实现来优化，相比\
  \ `AWS Rekognition` 提供更高的准确率，且每月处理百万张图片的成本更低。\n\n## 10.2 方法论\n### 10.2.1 OCR\n字符识别是最强大的技术之一，旨在将多种形式的物理文档（如扫描件、PDF\
  \ 或数字相机拍摄的图像）转换为可编辑和可搜索的数字文本。`OCR` 使用专用硬件软件提取打印文本，将图像转换为计算机可以理解的文本。扫描设备创建文档的数字映像，并通过识别字符将图像转换为文本，使信息易于获取、搜索和存储。\n\
  \n#### 10.2.1.1 OCR 的机制\n`OCR` 通过扫描仪或相机（如手机）捕捉图像。一旦文档被扫描，`OCR` 软件会将文档简化为高对比度的黑白格式，将深色区域识别为潜在字符，将亮区域识别为背景。然后\
  \ `OCR` 会扫描并将文本分割成单个字符、单词或文本块以便后续处理。\n\n\n\n\n\n模式识别通过将将扫描文档中的字符与存储的字体示例进行比较，使软件能够识别匹配项。另一方面，特征识别则依赖于定义字符形状的结构规则，例如线条和曲线的数量和方向。例如，在特征识别中，字母“A”是通过两条在顶部交汇的对角线和中间的一条水平横梁来识别的。一旦检测到字符，它就会被转换为广为人知的\
  \ ASCII（即美国标准信息交换代码）。此后，计算机可以对检索到的文本进行进一步的处理、存储或操作。正是这一多步过程使得 OCR 能够正确地解释并将打印体文本转换成可编辑的数字格式。\n\
  \n### 10.2.1.2 实现 OCR\n\n可以使用本地自建解决方案或现有的各种云解决方案来轻松实现 OCR。为了便于访问并最大化利用性能，我们建议使用任何可用的云解决方案。表\
  \ 10.1 比较了目前用于执行 OCR 的主要云解决方案，包括性能评分。在本章的研究中，我们使用了三个不同的数据集：IIIT5K \\[11\\], IC13\
  \ \\[12\\], 和 SVHN \\[13\\]。\n\n表 10.1 各种 OCR 云解决方案的准确率\n\n|   || IIIT5K || IC13\
  \ || SVHN |\n| --- | --- | --- | --- |\n| Google Cloud Vision \\[8\\] || 86.8% ||\
  \ 87% || 61% |\n| --- | --- | --- | --- |\n| Azure Cognitive Services \\[9\\] ||\
  \ 83.2% || 70.6% || 44.6% |\n| AWS Rekognition \\[10\\] || 65.4% || 63.6% || 36.4%\
  \ |\n\n表格显示 Google Cloud Vision 具有最精确的读取能力，紧随其后的是 Microsoft Azure Cognitive Services。然而，最佳模型取决于价格，我们在表\
  \ 10.2 中展示了这一点。\n\n表 10.2 OCR 云解决方案的成本（美元）\n\n|   || 每月 100 万张图片 || 每月 500 万张图片\
  \ || 每月 1000 万张图片 |\n| --- | --- | --- | --- |\n| Google Cloud Vision || $1500 ||\
  \ $7500 || $10500 |\n| --- | --- | --- | --- |\n| Azure Cognitive Services || $1000\
  \ || $3600 || $6850 |\n| AWS Rekognition || $1000 || $4200 || $8250 |\n\n考虑到成本，Microsoft\
  \ Azure Cognitive Services 是最佳解决方案；它提供了高准确率，且与表现最好的 Google Cloud Vision 相当，同时具有成本效益。这些解决方案中的任何一种都可以通过应用程序编程接口（APIs）轻松访问，并可在云端使用。因此，不需要额外的存储或本地硬件，提高了解决方案的可用性。\n\
  \n### 10.2.1.3 评估 OCR 模型\n\n评估是验证和分析我们应用程序的必要方面。我们的 OCR 应用程序有两个主要的评估指标：字符错误率 (CER)\
  \ 和单词错误率 (WER) \\[18, 19\\]。CER 衡量系统识别出的错误字符率。计算公式为：\n\n```\nCER  = ( Incorrect\
  \ chars/Total chars ) × 100\n```\n\nWER 衡量系统识别出的错误单词率，计算公式为：\n\n```\nWER  = ( Incorrect\
  \ words/Total words ) × 100\n```\n\n### 10.2.2 大语言模型\n\n人工智能的最新进展导致了极其智能的大语言模型（LLMs）的发展。\n\
  \n### 10.2.2.1 LLM 的架构与功能\n\nLLM 使用许多层构建；其中一个关键组件被称为 `transformers` 的东西。它们通过两个主要步骤进行学习：`pretraining`（预训练）和\
  \ `fine-tuning`（微调）。在 `pretraining` 阶段，模型从大量的文本中学习以理解语言。然后在 `fine-tuning` 阶段，模型在特定任务上变得更出色。\n\
  \n### 10.2.2.2 LLM 与传统机器学习的区别\n\nLLM 的工作方式与传统机器学习不同；因此它们的学习过程、语言理解和灵活性存在差异。我们在表\
  \ 10.3 中对两者进行了对比。\n\n表 10.3 LLM 对比传统机器学习\n\n|  || 大语言模型 || 传统模型 |\n| --- | --- |\
  \ --- |\n| 语言理解 | 通过接触大量数据学习语言 | 依赖预设属性 |\n| --- | --- | --- |\n| 学习过程 | 利用各种非结构化文本\
  \ | 需要经过标注的数据集 |\n| 句子单词理解 | 擅长通过自注意力机制解释上下文 | 在缺乏大量数据时可能会遇到困难 |\n\n### 10.2.3 OCR\
  \ 应用的可能 LLM 选择\n\n市场上有很多专门化和通用的开源及闭源 LLM；例如 `GPT`、`ChatGPT`、`DALL-E` 和 `Codex`。由于从零开始\
  \ LLM 是一项繁琐、耗时且极其昂贵的工作，我们选择选择现有模型之一；对于我们的解决方案，`GPT` 是合适的。虽然 `ChatGPT` 的原理与 `GPT`\
  \ 相同，但它是为了以聊天机器格式与用户交互，因此不符合我们的需求。`GPT` 代表生成预训练转换器；它是由 `OpenAI` \\[14\\] 开发的深度学习大模型，在大量文本数据上进行了预训练，并以生成类人类通用回答而闻名。我们根据需求对比了不同的\
  \ `GPT` 模型，并在表 10.4 中总结了这些模型。\n\n表 10.4 GPT 系列 LLM\n\n| 模型 || 发布日期 || 训练参数数量 ||\
  \ 最大序列长度（标记） |\n| --- | --- | --- | --- |\n| GPT-1 | 2018 年 6 月 | 1170 万 | 1024\
  \ |\n| --- | --- | --- | --- |\n| GPT-2 | 2019 年 2 月 | 15 亿 | 2048 |\n| GPT-3 |\
  \ 2020 年 6 月 | 175 亿 | 4096 |\n| GPT-4 | 2023 年 3 月 | 1.76 万亿 | 8192（输入输出均为 4196）\
  \ |\n| GPT-3.5 Turbo | 2023 年 11 月 | 175 亿 | 4096 |\n\n\n\n\n\n尽管 `GPT-4` 似乎因为基于海量参数训练而是最高效的模型，但它的速度比后继者\
  \ `GPT-3.5 Turbo`，后者是最受欢迎且高效的 GPT 模型之一。`GPT-3.5 Turbo` 的平均吞吐量为 67 tokens/秒，而 `GPT-4`\
  \ 的吞吐量为 19 tokens/秒。凭借更快的处理速度、广泛的训练参数和适中的成本，它被认为是最优的模型之一。我们在表 10.5 中比较了成本。\n\n表\
