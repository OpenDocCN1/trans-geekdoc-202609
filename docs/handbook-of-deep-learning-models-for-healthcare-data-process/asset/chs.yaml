  \n# 17 用于基于方面情感分类的高级长短期记忆\n\nTanya Shruti and Kamlesh Lakhwani\n\nDOI: [10.1201/9781003467281-19](https://doi.org/10.1201/9781003467281-19)\n\
  \n## 17.1 引言\n\n方面层级文本挖掘侧重于根据所涉及的某些特征或实体，解释并分类文本内部的情感表达（B. Liu 2012）。这在产品评论等情况下特别有用，因为人们对不同的产品特征或服务表达出不同的感受。\n\
  \n方面层情感分析的意图不仅在于确定给定文本的整体情感（积极、消极或中性），还在于建立这些情感与特定属性或方面之间的关联。例如，在餐厅评论中，某人可能对菜肴感到非常好，但对服务很糟糕。为了解决方面层分析的复杂性，研究人员求助于神经网络模型，这些模型在从文本数据中提取上下文、语义和情感信息方面显示了效效。神经网络具有开发分层表示和检测细微言语信号的能力，是这项任务的理想选择。\n\
  \n在方面层情感分析的背景下（Wan et al. 2024），经常使用神经模型（Shaukat et al. 2020）、循环神经网络（`RNNs` Peng\
  \ et al.,2017）、卷积神经网络（`CNNs` Kim 2014））以及最近基于 transformer 的（Xu et al. 2022）模型，如\
  \ `BERT` 及其衍生模型。这些模型可以通过考虑文本中方面周围的上下文信息，学习编码和理解与不同方面相关的情感。方面层分析通常涉及固定数量的步骤。方面提取涉及识别和提取文本感兴趣的方面或实体。这一步对于确定情感关于什么至关重要。然后，情感分类分配情感标签（例如：积极、消极、中性）（Hussein\
  \ 2018）。\n\n\n\n\n高级 RNN 能够识别并理解文本数据中的序列模式；这些模型可用于整合方面信息并捕捉每个方面特有的情感感。相比之下，传统的 RNN\
  \ 容易遇到梯度消失问题，这限制了它们有效捕捉和表示长距离连接的能力。双向 RNN（Bi-RNNs）从两个方向分析文本，以从输入序列中提取上下文信息；这对于方面级情感分析等应用非常有用。\n\
  \n长短期记忆（LSTM）是一种可以管理长距离依赖的 RNN，适用于情感分析等任务。它旨在解决传统 RNN 相关的梯度消失问题（Kane et al. 2021）。门控循环单元（GRU）也可以管理长期依赖，但它的结构更简单，输入方法更少。虽然对情感分析有用，但它还能提高计算效率（Trisna\
  \ and Jie 2022）。Transformer 对情感分析产生了巨大影响，包含了 `BERT`、`GPT` 和 `ROBERTA` 等模型。这些模型利用注意力策略在特定上下文中检索信息，并在大型文本库上经过了广泛训练，使其能够精于各种自然语言处理任务（Xu\
  \ et al. 2022）。\n\n注意力机制可用于其他神经网络，以强调输入文本中的重要关键词或短语。通过强调关键的上下文信息，这种方法增强了情感检测模型的效性（Wang\
  \ et al. 2016）。基于注意力的技术在情感分析任务中变得越来越常见。情感预测中的注意力算法可以有效地优先处理与目标属性相关的词或短语，并赋予它们更高的权重。通过包含关键的上下文信息，这些模型增强了可理解性，并捕捉了特定方面的独特情感。分层模型整合了多层神经网络，以分析不同粒度的情绪（例如短语和文档）。\n\
  \nCNN 已有效地应用于情感分析等文本分类应用中，以提取与特定元素相关的局部特征和模式。然而，它们在捕捉长期依赖和上下文信息方面存在困难（Zhou and Long\
  \ 2018）。集成模型结合多个神经网络模型的结果来提高情感分析的整体准确性。一种方法是结合 LSTM 和 CNN 模型，以利用各自的优势。同时，条件随机场（CRF）通常与其他模型结合用于基于方面的情感分析。CRF\
  \ 模型在评估整个短语时可以记录序列依赖并整合特定方面的信息，并且可以表示标签之间的依赖关系（Dalal Hardik 2017）。\n\n为情感分析选择神经网络模型取决于特定目标（如文档级、表面级或感知性情感分析）以及文本输入的特征（如简洁的社交媒体帖子或长篇评论）。研究人员和从业者经常使用不同的模型和架构进行实验，以确定衡量不同情绪的最有效方法（Natural\
  \ Language Processing and Chinese Computing* 2020）。\n\n## 17.2 文献综述\n\n在进行文本分析时，考察短语、面向术语与用于分类它们的技术之间的联系是至关重要的。方面级情感分析存在多种深度学习模型，但这些模型具有许多缺点。某些技术表现出刚性，且缺乏足够的情感词汇。由\
  \ Ren et al. (2020) 提出的词典增强注意力网络模型（LEAN）可以解决这个问题。LEAN 利用基于词典的信息和注意力机制的结合来有效分析方面级的情感。这种方法专门增强了方面级文本分析的精确度。该模型使用反向传播进行训练，并为每个短语构建损失函数，其中\
  \ `x[i]` 是预期概率，$\\hat{x\\_{i}^{j}}$ 是句子的估计分布。损失函数生成如下：\n\n$$\\left. \\\\ \\{~loss~}\
  \ = - \\\\ \\\\sum\\\\limits\\\\_{i}\\\\sum\\\\limits\\\\_{j}x\\\\_{i}^{j}\\\\log\\\
  \\hat{x\\_{i}^{j}} + \\\\lambda \\\\right\\|\\\\left. \\\\ \\theta \\\\right\\\\\
  |^{2}$$  \n\n(17.1)\n\n其中 `i` 列表是文档中的单词，`j` 是文件索引，`λ` 是正则化项，`θ` 是准则集。\n\n传统的 LSTM\
  \ 模型未能捕捉情感短语分类中的关键组件；现在，注意力被用于评估上下文与句子核心组件之间的相关性。基于注意力的 LSTM 网络（M.Z. Liu et al.\
  \ 2021）将方面向量与输入单词向量结合（Li et al. 2021），以整合来自特征词的所有相关信息。注意力过程生成一个表示为 `r` 的加权隐藏表示以及注意力权重向量（Zhou\
  \ and Long 2018）。最终句子表示计算如下：\n\n*k*^(\\*) = *t**a**n**k*(*w*[*p*]*r*+*w*[*q*]*k*[*n*])\
  \  \n\n(17.2)\n\n其中 `k^(\\*)`  ∈ ℝ(*d*)`, `w[*p]` 和 `q` 是计算准则。\n\nHyun, Cho, and\
  \ Yu (2020) 采用了涉及预标注和众包标注的两步方法，以解决由于缺乏数据集而给方面意见挖掘带来的挑战。通过使用汽车文本数据，这种方法有效地评估了情感。词汇化领域本体论和正则化神经注意力模型（ALDONAr）提高了情感分析的准确性，特别是在特征识别方面（Smetanin\
  \ and Komarov 2021）。\n\n一种神经注意力模型在跨领域方面级情感分类中的表现优于之前的基准模型。此外，它有效地解决了多种语言的方面级情感分析。语言无关的情感分析有助于模型识别文本中的相关片段。词典感知词-方面注意力网络是一种高级深度学习模型，旨在从社交网络中提取特定方面的情感信息。社交网络服务使用简洁且非正式的信息。该模型在可靠性方面优其他标准框架（Studiawan,\
  \ Sohel, and Payne 2020）。\n\n\n\n\nLSTM 模型包含一个单元内存和三个门（Tang et al. 2016）：输入门、输出门和遗忘门（Zhou\
  \ and Long 2018）。该值以恒定的时间间隔保持在单元中。门管理知识从单元一部分到另一部分的传输。遗忘门通过比较之前和现在的状态（0,1），决定保留还是丢弃信息。如果值为\
  \ 1，则保留信息；否则，信息将被删除。输入门负责将新信息存储在现有状态中。输出门为当前状态中的特定信息分配二值值（0 或 1），并作为输出。这使得模型能够保留当前状态中的相关信息。\n\
  \n$$\nX = \\begin{bmatrix} h\\_{t - 1} \\\\ x\\_{t} \\\\ \\end{bmatrix}\n$$\n(17.3)\n\
  \n`P[t] = \\sigma(W[P] \\cdot X + d)`\n(17.4)\n\n`q[t] = \\sigma(W[p] \\cdot X +\
  \ d)`\n(17.5)\n\n`r[t] = \\sigma(W[r] \\cdot X + d[r])`\n(17.6)\n\n`s[t] = P[t]\
  \ \\odot s[t - 1] + q[t] \\odot tanh(W[s] \\cdot X + d[s])`\n(17.7)\n\n`h[t] = r[t\
  \ \\odot] tanh(s[t])`\n(17.8)\n\n其中 `\\sigma` 是 sigmoid 激活函数，`\\odot` 表示元素级乘。`W`\
  \ 和 `Wp` 分别是权重和偏置，对应网络模型的不同组件。权重矩阵中的上标（`Wr`、`X` 等）指示哪些组件属于三个门。下标索引（`h`）表示输入类型（`d`:词嵌入，`h`:隐藏状态，`b`:属性嵌入）；`t`表示输入序列中的当前时间步。\n\
  \n### 17.2.2 带有属性嵌入的 LSTM\n\n这种架构使网络能够集中关注输入序列中对当前任务更关重要的特定部分。在处理过程中，模型会对输入序列的不同部分分配不同的权重或优先级。为了反映每个词的语境，使用词嵌入技术对输入短语进行编码。来自\
  \ LSTM 编码的编码输入序列随后进入 LSTM 层。模型学习在解释输入序列的同时，获取并维持跨距离的重要信息。注意力机制被用于识别序列中每个输入片段的重要性或相关性。\n\
  \n注意力机制根据每个元素的语境信息及其与模型当前状态的相似性为每个元素分配注意力权重。注意力权重用于构建输入序列项的加权和，为更重要的元素分配更大的权重。输入序列的关注或集中表征由由此加权和表示。被关注的表示随后发送到网络的后续层进行进一步处理，例如解码或分类任务。\n\
  \n例如，在机器翻译中，关注的表示可以用于构建翻译后的输出序列。具有注意力的 LSTM 可以通过在处理的每个阶段关注序列中最重要的部分，很好地处理长且复杂的输入序列。这使得模型能够做出更好的判断，并提高其在各种\
  \ NLP 任务上的整体性能。为了解决普通 LSTM 无法识别属性级情感分类关键部分的问题，注意力机制能够捕捉针对特定属性的短语中的关键词。\n\n### 17.2.3\
  \ 带有属性嵌入的特定注意力 LSTM\n\n该模型的主要目标是检测文本对特定特征或实体的情感极性。\n\n它将属性嵌入集成到基于注意力的基础 LSTM 模型中，捕捉属性特定的信息（Xu\
  \ et al. 2022）。在这些模型中，输入文本最初使用词嵌入编码以确定每个词的含义。属性嵌入也用于表示目标属性；属性嵌入使用预训练模型收集基于属性的信息。编码后的输入序列传输到\
  \ LSTM 层，对其进行分析并收集语境信息和词依赖关系。\n\n在 LSTM 的每个阶段，都采用注意力机制根据输入序列中单词对所需目标的重要性来计算注意力权重。通过比较属性嵌入与编码的词表示，计算注意力权重。这一阶段使模型能够关注与目标属性更相关的词。利用注意力权重通过计算词表示的加权和来生成上下文向量，从而捕捉输入序列中的属性特定信息；上下文向量是词表示的加权混合，对与目标属性相关的词赋予了更大的权重。\n\
  \n### 17.2.4 基于目标的 LSTM\n\n该模型专门为情感分析和意见挖掘活动而创建。TB-LSTM 模型通过目标特定的语境分析来确定给定文本的情感，增强了\
  \ LSTM 的能力。TD-LSTM 架构由两个主要部分组成：依赖目标的 LSTM（Vo and Zhang 2015）和依赖目标的注意力。依赖目标的 LSTM\
  \ 对短语中的顺序信息进行建模，并捕捉关于目标的情感信息；这种方法对短语中的每个词重复，允许模型提取上下文依赖关系和情感。\n\n词表示与目标表示之间的相似性用于计算注意力权重，然后用于对\
  \ LSTM 的隐藏状态加权，对与目标更相关的词赋予更大的权重。这种方法使模型通过考虑同一短语中多个目标的情感倾向，产生细粒度的情感预测。已证明该模型在各种情感分析基准上达到了顶尖性能，为未来依赖目标情感分析和基于属性的情感分析任务铺平了道路。\n\
  \n### 17.2.5 目标语境特定 LSTM\n\nTC-LSTM 神经模型专门为情感分析和意见挖掘任务设计，重点捕捉目标词与其周围语境之间的交互。TC-LSTM\
  \ 模型通过显式描绘目标词与其周围语境词之间的连接，解决了以往方法的局限性。该方法同时考虑了所分析词的语境词本身，以便更准确地捕捉情感分析中复杂的情感和特定特定的特征。这种设计强烈依赖于语境注意力机制和依赖目标的\
  \ LSTM。模型的任务是表示句子内的顺序信息，并考虑情感因素。\n\n\n\n在每个时间步中，`LSTM` 单元利用词表示以及之前的隐藏状态和单元状态作为输入，产生新的隐藏状态和单元状态（H.\
  \ Liu 等人 2024）。模型通过理解短语中词之间的关系，获得表示与目标词相关的情感信息的能力。上下文注意力方法使模型能够选择性地关注包含目标词的相关上下文词。每个上下文词的注意力权重根据其与目标词的关联程度确定。注意力权重决定了每个上下文词在情感分类任务中的重要性。这可以通过仔细考虑上下文术语来实现。模型采用外部记忆单元来存储和检索与目标属性相关的信息。系统利用记忆单元和循环神经网络捕获并存储了与某些组件相关的长期连接和情感数据。用于基于方面的情感分析的递归神经网络整合了外部记忆单元，用于从输入序列中存储和检索特定于方面的信息（Peng\
  \ 等人 2017）。该系统利用多层内存存储针对不同特征的情感数据。所提出的深度记忆网络在方面分类方面优于目前的基准方法。\n\n### 17.2.6 基于词汇化领域本体的正则化神经注意力模型\n\
  \n`LDO-RNAM` 是一种基于注意力的模型，它使用词汇化领域本体来编码特定于方面的知识和情感关系。正则化神经注意力模型从文本收集上下文和情感信息，并将其分为三个主要部分：方面提取、情感分类和领域本体正则化。方面提取组件负责识别并从输入文本中提取方面。情感分类组件预测每个方面情感的极性。领域本体被正则化组件利用，通过通过添加领域特定知识来完善情感预测。使用真实数据集将该方法的性能与许多基准模型进行了比较。结果显示，`LDO-RNAM`\
  \ 在准确性方面优于基准模型。\n\n### 17.2.7 交互式词典感知方面注意力网络\n\n该模型通过上下文感知的特定术语识别来处理方面术语分类。它执行词典注意力操作，从以情感为导向的上下文信息映射关系向量表示。该模型施加这些信息以训练模型预测正确的结果。\n\
  \n## 17.3 结果与讨论\n\n用于方面级情感分析的 `LEAN` 模型通过计算预测值总数与测试数据总数的比例来评估准确性（Ma 等人 2019）。准确性的计算公式为\n\
  \n$$Accuracy\\\\, = \\\\,\\\\frac{TS\\\\,(Number\\\\, of\\\\, true\\\\, predicted\\\
  \\, sample)}{TD\\\\,(Number\\\\, of\\\\, Total\\\\, test\\\\, dataset)}$$\n\n(17.9)\
  \ 将 `LEAN` 模型与餐厅数据集比较时，没有显著改进；但对于笔记本数据集，准确性提高了 0.8%。使用 `LSTM` 模型，餐厅和笔记本的准确性分别提高了\
  \ 0.04% 和 0.07%。`TB-LSTM`、`TC-LSTM`、`AE-LSTM` 和 `ASAE-LSTM` 在两个数据集上分别显示出 0.03% 和\
  \ 0.05%、0.03% 和 0.05%、0.02% 和 0.04% 以及 0.19% 和 0.05% 的改进。此外，`AE-LSTM` 和 `ASAEELSTM`\
  \ 展示了 0.01% 和 0.01% 的改进。所有基于词典的模型在所有数据集上的表现均优于基准方法（Ren 等人 2020）（表 17.1）。\n\n**表\
