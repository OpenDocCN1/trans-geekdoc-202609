  \ 9.1）。\n\n![图 9.1 改变的跨理论模型。](img/fig9_1.jpg)\n\n### 9.3 研究意义：在行为建模中使用 TTM\n\n德里大学具有独特的文化和和社会环境，这为研究健康状况提供了一个独特的空间。在这个环境中，本科生面临着对其健康产生的复杂影响。虽然教育机构提供了结构化的环境，但学生所经历的自主性也意味着他们暴露于可能会阻碍其健康的生活方式选择中。目前的研究强调了在这一群体中建立行为改变模型的重要性，因为这些形成阶段对于建立长期健康模式至关重要。通过将身体健康作为通往全面健康的门户，本章的研究旨在探讨学生如何在复杂的城市生活中，努力保持健康习惯。\n\
  \n## 9.4 研究重点\n\n\n\n\n尽管青少年对健康和福祉的意识日益增强，但知识与行动之间的差距仍然很大。本研究旨在解决年轻个体在采纳和维持预期健康行为（特别是与身体健康相关的行为）方面面临的挑战。我们利用\
  \ `TTM` 作为框架，对行为改变过程进行建模，并突出了进展的各个阶段以及加速或阻碍这一进展的因素。\n\n本研究的一个重要部分是开发和严格测试用于评估学生行为改变意愿的工具。首先，我们进行了一项试点研究来对这些工具进行预测试，以确保它们在捕捉\
  \ `TTM` 所述的行为改变阶段方面的准确性和有效性。预测试阶段至关重要，因为它提供了宝贵的见解，使我们能够完善工具，优化其在检测学生群体中不同变化阶段的可靠性和灵敏度。\n\
  \n在完善工具之后，我们对来自 `Delhi University` 的 100 名本科生参与者样本进行了实际研究。这些参与者代表了学生群体的多样化特征，为研究年轻人如何向预期的健康行为转变提供了稳健的数据集。使用\
  \ `TTM` 作为框架使我们能够绘制出学生从前意念阶段到维持阶段的变化进展路线图。我们测试了开发工具的效力，并探索了支持或阻碍学生向更健康行为进展的因素。这种数据驱动的方法为如何在教育环境中定制福祉干预措施以满足青少年的特定需求提供了关键见解，从而促进健康行为的持续改善。我们证明了这些完善后的工具如何为健康行为提供预测性见解，帮助识别学生参与更健康生活选择的意愿。\n\
  \n通过对这些行为改变阶段进行建模，我们对年轻人如何被引导以采纳和维持预期行为（特别是在健康方面）提供了细致的理解。本研究的目标是为嵌入教育环境并针对青少年特定需求定制的干预提供基于证据的建议。这些干预措施在促进全面福祉和推进公共健康成果方面可以发挥转型作用，有助于实现全球健康目标，如\
  \ `UN` 的可持续发展目标 3：良好健康与福祉。\n\n## 9.5 方法论\n\n### 9.5.1 研究设计\n\n本研究是一项描述性研究，旨在了解 `Delhi\
  \ University/New Capital Region` 三年级本科学生的健康相关行为模式。该研究捕捉了学生在特定时间点的整体福祉状况，特别是他们的身体健康状况。描述性设计允许对各种福祉维度进行全面探索，而不需要纵向数据收集。\n\
  \n### 9.5.2 参与者\n\n本研究的样本由由 100 名大三（毕业年级）学生组成，分别来自两所女校：`College 1` (`Lady Irwin\
  \ College`) 和 `College 2` (`Miranda House`)，各 50 名学生。我们使用了雪球抽法，由初始参与者推荐其他符合研究纳入标准的其他人：没有现有健康问题的大三本科生。\n\
  \n### 9.5.3 仪器\n\n主要数据收集工具是一个结构化问卷，旨在评估整体福祉的三个关键维度：身体、情感和社会；在本章中，我们重点关注福祉。问卷包含了根据李克特量表评分的陈述，以衡量行为的频率和强度，以及定性的开放式问题以获得更深入的见解。例如，对于“你如何看待快走对维持良好身体健康的重要性？”这个问题，回答选项为：\n\
  \n1. 我认为这不重要。\n2. 我已经……选项对应于变化阶段：`a)` 代表前意念；`b)` 意念；`c)` 准备；`d)` 行动；`e)` 维持。此外，为了验证研究问卷，`SBC`\
  \ 和健康传播领域的专业人员审查了问卷，以确保工具全面、清晰并与研究目标适当匹配。他们的反馈对于完善问卷的清晰度和相关性起到了重要作用，增强了研究工具的整体效度。\n\
  \n### 9.5.4 试点研究\n\n正如提到的，我们进行了一项试点研究来完善问卷并确保其有效性和可靠性。预测试涉及向 `Lady Irwin College`\
  \ 发展传播与扩展部门的 15 名硕士生样本发放草案问卷。预测试参与者的反馈导致了细微修改（主要是语言上的调整），这增强了问题的清晰度。这一步结合专家验证，确保了最终工具适用于目标群体并提供了了可靠的测量结果。\n\
  \n### 9.5.5 数据收集与分析\n\n我们通过在线问卷收集了研究数据。参与者在提供知情同意后，被邀请自愿完成问卷。调查方法允许广泛地覆盖 `Delhi`\
  \ 多个机构的学生，并高效地收集数据。数据分析包括对阶段进展的定量评估。我们根据频率和百分比对定量数据进行分析，以总结健康行为的模式。回答经过编码，数据被组织成编码表用于分析。绘制了图表以可视化方式展示受访者根据\
  \ `TTM` 描述的不同行为改变阶段。\n\n## 9.6 结果与讨论\n\n### 9.6.1 变化阶段：每天运动 30 分钟\n\n每天快走或运动三分钟是维持身体健康的建议行为；每天进行某种形式的运动对于确保身体健康至关重要。图\
  \ 9.2 图形显示了来自 `College 1` 和 `College 2` 的学生在每日运动行为改变阶段的参与水平。\n\n![图 9.2 受访者的变化阶段：每天运动\
  \ 30 分钟。PC: 前意念, C: 意念, P: 准备, A: 行动, M: 维持。(Images/fig9_2.jpg)\n\n**图** **9.2**\
  \ 受访者的变化阶段：每天运动 30 分钟。PC: 前意念, C: 意念, P: 准备, A: 行动, M: 维持。\n\n图 9.2 显示，两所学校在前意念阶段的学生代表比例极低（共计\
  \ 3%），这表明学生普遍意识到了运动的重要性。在意念阶段，两所学校有 22% 的学生正在考虑运动但尚未开始。图中显示的趋势强调了 `College 1` 需要针对性的支持，以增强从计划到行动的转变，并维持长期运动习惯。\n\
  \n### 9.6.2 变化阶段：摄均衡饮食\n\n\n\n\n\n从五类不同的食物组中摄入均衡饮食是维持身体健康的建议健康行为。蛋白质、碳水化合物、水果、蔬菜、脂肪和糖分的平衡对于保持健壮、健康的体至关重要。图\
  \ 9.3 形象地展示了学生对这一建议健康行为的准备情况。\n\n![图 9.3 受访者的改变阶段：维持均衡饮食。PC：前考虑期，C：沉思期，P：准备期，A：行动期，M：维持期。](img/fig9_3.jpg)\n\
  \n图 9.3 受访者的改变阶段：维持均衡饮食。PC：前考虑期，C：沉思期，P：准备期，A：行动期，M：维持期。\n\n图中显示两组学生都有较高的饮食意识。只有\
  \ 4% 的学生处于前考虑期，表明他们对均衡饮食的重要性有广泛认识。学院 2 处于沉思期的学生比例较高（22%，而学院 1 为 16%），表明其对饮食缺乏的意识更高；但学院\
  \ 2 在维持阶段处于领先，有 38% 的受访者维持了他们的饮食改变，而学院 1 为 22%。这意味着学院 1 的学生在发起改变方面更加积极，而学院 2 的学生在维持健康习惯方面表现出更好的长期投入。研究结果强调，需要针对每所学院量身干预措施，以支持均衡饮食的采纳和维持。\n\
  \n### 9.6.3 改变阶段：营养饮食\n\n避免垃圾食品并摄入营养饮食是维持身体健康的建议健康行为，包括摄入营养丰富的食物和消除超加工食品，对于确保健康健壮的体至关重要。图\
  \ 9.4 形象地展示了学生对营养饮食的回答。\n\n![图 9.4 改变阶段：营养饮食：PC：前考虑期，C：沉思期，P：准备期，A：行动期，M：维持期。](img/fig9_4.jpg)\n\
  \n图 9.4 改变阶段：营养饮食：PC：前考虑期，C：沉思期，P：准备期，A：行动期，M：维持期。\n\n图 9.4 揭示了健康意识和参与度的一些差异。学院\
  \ 1 没有学生处于前考虑期，表明他们充分意识到营养饮食的益处，但两所学院都对改善营养表现出强烈的承诺，特别是在准备阶段和行动阶段。研究结果总体强调了在这两个机构加强健康促进工作的机会。\n\
  \n### 9.6.4 改变阶段：定期体检\n\n最后，定期体检是保持身体健健康的重要方面。印度的建议是，年轻人每六个月至少进行一次血检（见图 9.5）。\n\n\
  ![图 9.5 改变阶段：定期体检。PC：前考虑期，C：沉思期，P：准备期，A：行动期，M：维持期。](img/fig9_5.jpg)\n\n图 9.5 改变阶段：定期体检。PC：前考虑期，C：沉思期，P：准备期，A：行动期，M：维持期。\n\
  \n图 9.5 反映了学院 1 和学院 2 之间的显著差异。学院 1 考虑定期体检的学生沉思分级为 40%，而学院 2 为 42%，反映出两所学院都有很强的意识，但学院\
  \ 1 有 32% 的学生处于准备阶段，而学院 2 仅为 18%。\n\n## 9.7 结论\n\n通过这项研究，我们清晰地阐述了如何利用行为建模预测个人在特定测量时间所处的行为改变阶段。我们强调了跨理论改变模型（TTM）。作为一个基本前提，TTM\
  \ 是一个预设的行为改变模型，它被专门整合到研究工具中，以识别受访者相对于身体健康的改变阶段。研究结果对于评估受访者与健康行为相关的改变阶段起到了重要作用，从而识别了促使阻他们留在特定阶段的因素。识别改变阶段至关重要，事实上，它是开发针对性行为改变干预措施的前决条件。\n\
