  \n基于迁移学习的皮肤癌检测框架 Deep Learning for Skin Cancer\n\nMadhur Nagrath, Poonam Chaudhary,\
  \ Meghna Sharma, and Ashish Kumar DOI: 10.1201/978117\n\n## 15.1 引言\n\n皮肤癌是一个重大的全球健康问题[1]。皮肤由两个主要层组成：表皮和真皮，癌症是由异常引起的疾病之一。皮肤癌在全球范围内日益流行[2]。鉴于皮肤是人体最大的器官，这一点是出意之外的[3]。图\
  \ 15.1 展示了皮肤癌的分类：良性和恶性。皮肤癌的分类至关重要，因为未治疗可能导致死亡[4]。\n\n![图 15.1 皮肤癌分类](img/fig15.jpg)\n\
  \n黑色素瘤是一种肿瘤，可以扩散到身体其他部位，通常表现为出血性溃口，以及不均匀的黑色、棕色和褐色调，以及红色、粉色、蓝色、灰色或白色区域。黑色素瘤通常从皮肤细胞开始并随着时间增大[5][6]。最致命的皮肤癌是恶性黑色素瘤：如果不早期检测，可能是致命的。另一方面，良性肿瘤看起来像痣，但不会扩散。恶性肿瘤的迹象包括不愈合的溃口、出血或形成结角的生长以及硬红结节。这些通常发生在光照部位，如手掌、下唇、耳朵、鼻子和前额[7]。\n\
  \n每年有数百万美国人确诊患有皮肤癌，使其成为该国主要的癌症。早期识别对于成功治疗至关重要，早期诊断的预计五年生存率在 90%以上，而晚期诊断仅为 20%[8][9]。医生通常通过活检来识别皮肤癌，这需要对潜在的癌变样本进行检查[10]。这一过程可能是缓慢、具有挑战性且耗时的。然而，由于计算机技术，可以快速、廉价且无痛地识别皮肤癌迹象[12]。\n\
  \n\n\n\n\n皮肤上的任何生长物如果大小、形状或颜色发生变化，或者出现疼痛、出血或新发，应尽快由皮肤科医生检查，因为这些可能是癌症或癌前肿瘤的迹象。\n\n\
  ## 15.2 背景研究\n\n针对这些关注，几位学者进行了多项相关调查。在使用基于深度学习的方法进行黑色素瘤筛选时，Harangi 等人 [19] 提出了 `DConvNet`，该模型通过整合\
  \ `ISBI-2017` 数据集中三种不同结构的输出来提高其准确性。然而，该研究强调了用于训练可靠自动黑色素瘤筛查系统的标记图像数量有限的挑战。Emuoyibofarhe\
  \ 等人 [20] 在移动智能手机上使用 `ConvNet` 和 `InceptionV3` 模型对 `ISIC` 数据集中的约 2300 张照片进行了分类，获得了\
  \ 90% 的准确率和 84% 的灵敏度。虽然他们使用了 `Basic CNN`、`VGG16` 和 `Google Inception V3`，但应用更多模型可能会提高准确率。在他们的研究中，Bhavya\
  \ 等人 [21] 采用 `InceptionV3` 配合 `CNN` 正确分类了 2437 张皮肤癌照片，准确率为 85%。然而，作者并未研究其他模型的性能。\n\
  \nDemir 等人 [22] 调查了 `ResNet-101` 和 `InceptionV3` 在一个包含 2437 张照片的数据集上识别皮肤癌的性能。他们的结果显示，`InceptionV3`\
  \ 在将图像分类为恶性或良性的任务中达到了更高的准确率（即 87.42%）。然而，作者并未探索其他模型的使用。Hekler 等人 [23] 使用深度学习算法对黑色素瘤病理组织学图像进行分类，旨在改进人类评估过程，并将结果与经验丰富的病理组织学专家的结果进行比较。基础\
  \ `CNN` 模型的准确率为 76%，但该研究的局限性在于它只能判断是痣还是黑色素瘤。\n\nLopez 等人 [24] 利用基于 `VGGNet` 的 `ConvNet`\
  \ 对从 `ISIC-2016` 存储库获取的 1279 张皮肤癌照片进行分类，实现的分类准确率为 78.66%。然而，该研究受限于可用训练数据较少。Yu 等人\
  \ [25] 开发了一个五十层或更多层的 `CNN` 模型，使用 `ISBI-2016` 数据对危险的皮肤癌进行分类，实现了 85.5% 的准确率；作者建议增加研究中使用的照片数量可以提高模型的准确率。为了分类超过\
  \ 9 张皮肤照片，Kawahara 等人 [26] 采用迁移学习作为特征提取器，对超过 9 张非皮肤镜的图像进行分类，而不是从头开始训练模型。然而，他们的模型在准确诊断皮肤病变时遇到了困难。\n\
  \nWaheed 等人 [27] 的机器学习模型利用纹理和颜色信息识别并分类黑色素瘤。他们的模型在使用传统技术时具有 96% 的分类成功率。Xie 和 Bovik\
  \ 提出了一种皮肤肿瘤分割技术，结合了使用遗传算法自生生成的 `ConvNet`；然而，精确分割皮肤镜图像仍然困难 [28]。Chakravorty 等人提出了一种用于分类颜色分布不均的皮肤病变的方法，利用结构相似性指标与颜色直方图之间的\
  \ Kullback–Leibler 差异。尽管具有 83% 的分类率，但他们的模型未能达到高准确率 [29]。同样，文献报告机器学习、深度学习和各种人工智能技术在医疗领域起着至关作用\
  \ [17, 18, 30]–42]。\n\n## 15.3 方法论\n\n### 15.3.1 数据获取\n\n为了该模型，我们共收集了 3397 张皮肤癌照片，见表\
  \ 15.1。其中部分来自 Kaggle，另一部分来自 `ISIC`。这些图像被合并以创建一个恶性与良性病变的训练数据集。\n\n表 15.1 原始数据集\n\n\
  | 图像数据集 | 总图像数 |\n| --- | --- |\n| 良性 | 1800 |\n| 恶性 | 1597 |\n\n所有数字输入图像都有三个通道，因为它们是\
  \ `RGB` 图像；由于来源不同，照片的格式和大小不一。因此，我们将所有照片缩放到标准形状，包含每张图像的列、通道和行信息，以便进行预测分析（224 × 224。（注：此处后续重复段落已根据要求省略）\n\
  \n\n\n\n为了有效的医疗判断、诊断和治疗，需要对图像数据进行预处理，以为模型输入做好准备。图像预处理的目的是消除图片中的噪声 [47]。通常，图片包含噪声、毛发等，有必要通过多种图像处理技术消除由这些干扰带来的分类错误。对于我们的模型，在将图像输入深度学习网络之前，我们手动修剪并消除了不必要的背景。此外，对比度增强可以亮图片的边缘并提高分割准确性。随后，通过旋转和翻转特意地增加了数据库的大小，从而得到了更大的数据库。归一化过程随后在运行时自动完成。\n\
  \n### 15.3.4 应用深度学习技术\n\n`CNN` 是一种用于图像识别等分类任务的深度学习技术，这些任务受大脑的影响。典型的 `ConvNet` 架构包含多个层，每层生成一个二维图像元素数组（特征图），这些特征图作为后续层的输入\
  \ [48]。在 2010 年左右开放了如 `ImageNet` [49] 等大型数据集可用之前，研究人员由于数据和计算资源的限制无法训练 `ConvNet`\
  \ 架构。\n\n在基础 `ConvNet` 架构 [50] 中，信息在输入层接收，这可以是真实的图片像素或其修改版本。卷积层应用过滤器在输入图像上移动，并执行卷积操作以创建特征图。特征图的维度通常通过池化层进行缩小，池化层关注特征图中最重要的元元素。`ReLu`\
  \ 层对上一层的输出应用非线性函数，将所有负值置零；然后，全连接层对前述层产生的模式完成高级分析。来自上方层的激活值全连接到该层的神经元，生成用于训练 `ConvNet`\
  \ 模型的特征，该模型已训练过使用单独的分类方法来提取特征。损失层惩罚实际标签与预测标签之间的差异。根据任务的不同，在 `ConvNet` 的最后一层可以使用各种损失函数，如\
  \ `Sigmoid`、`SoftMax` 和 `CrossEntropy`。模型的训练参数如表 15.4 所示。\n\n**表 15.4**](#Ch15.xhtml#bck_table15_4)\
  \ CNN 训练参数描述\n\n| 序号 | 参数 | 值 |\n| --- | --- | --- |\n| 1 | 图像大小 | 256,256 |\n|\
  \ 2 | 迭代次数 (Epochs) | 100 |\n| 3 | 批大小 (Batch Size) | 32 |\n| 4 | 学习率 | Le-1 |\n\
  | 5 | 中间层激活 | Relu |\n| 6 | 最后一层激活 | Softmax |\n| 7 | 损失函数 | 稀疏分类交叉熵 |\n| 8 | 优化器\
  \ | Adam |\n| 9 | 准确率 | Accuracy |\n| 10 | 训练/测试/验证比例 | 80.10 |\n\n### 15.3.5 迁移学习\n\
  \n在海量数据上训练模型并教授模型权重和偏置是深度学习的基础。预训练权重可以加速学习过程 [51]。在项目中，我们使用了带有微调的迁移学习，通过 `EfficientNetV2`\
  \ 和 `VIT-B16` 增强模型性能。`ImageNet` 数据集作为预训练模型的首次训练，并可以预测超过 1000 个类别。我们通过添加卷积层和密集层并使用微调调整参数，针对目标任务对预训练模型进行了重新训练。移除了预训练表示源的密集层。卷积网络的创建和\
  \ `EfficientNetV2` 的缩放使用复合系数调整所有的深度、宽度分辨率参数。与早期模型相比，它提高了训练有效性。使用缩放和神经架构搜索来创建此网络\
  \ [52, 30]。`ViT-B16` 使用计算机视觉中的视觉范式，采用不带图像特定偏置的多头注意力机制。模型生成的位置嵌入补片通过 Transformer\
  \ 编码器对图像进行处理，以从局部和全局尺度上理解图像包含的特征。视觉 Transformer 架构由几个块组成，每个块包含一个前馈层和一个多头注意力层。`ViT`\
  \ 在大型数据集上具有更高的准确率且训练时间更短。\n\n## 15.4 结果与讨论\n\n本章研究的目标是通过尝试不同的特征表示以及使用 `CNN` 和迁移学习方法的诊断模型，来确定预测良性或恶性皮肤癌的最高效训练方法。我们使用了两种不同的技术来修改建议的\
  \ `CNN` 架构，每种方法执行了超过 100 个训练迭代，我们记录并分析了每个模型的精确率和损失。表 15.5 比较了基础 `CNN` 模型与 `EfficientNetV2`\
  \ 和 `ViT-B16` 在训练数据集上的损失和准确率，图 15.5(a–c](#Ch15.xhtml#fig15_5c)) 以图形方式显示了这些。结果显示，所有模型在训练过程中准确率稳步上升，损失下降，但\
  \ `EfficientNetV2` 的表现最佳，准确率达到 90.41%。\n\n图 15.5(a–c](#Ch15.xhtml#fig15_5c)) 结果显示，所有模型在训练过程中准确率稳步上升，损失下降，但\
  \ `EfficientNetV2` 的表现最佳，准确率达到 90.41%。\n\n\n\n\n\n# 表 15.6 测试数据集性能指标\n\n| 序号 | 应用模型\
  \ | 测试准确率 | 精确率 | 召回率 | F1 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 基础 CNN\
  \ | 83.18% | 83.72% | 83.18% | 83.22% |\n| 2 | EfficientNetV2 | 88.33% | 88.36%\
  \ | 88.33% | 88.34% |\n| 3 | VIT-B16 | 86.21% | 86.42% | 86.21% | 86.12% |\n\n迁移学习方法在训练过程中从图像中提取重要特征，使其成为传统机器学习技术的有效替代方案。推荐的方法将迁移学习与已预训练的\
  \ `EfficientNetV2` 模型相结合，因此可以用于临床实践，以确定皮肤癌的类型。\n\n### 15.4.1 数据可用性\n\n本研究开发和使用的数据将在通讯作者根据合理要求提供。\n\
  \n## 15.5 结论\n\n在我们的研究中，我们提出了一种基于计算机技术的皮肤癌诊断方法，该方法比传统的活检更有效。这种方法允许患者在无需寻求外部医疗帮助的情况下识别皮肤癌，提供了便利性和可及性。我们的诊断方法采用深度神经网络和数字图像处理技术来区分恶性和良性黑色素瘤。我们对一组皮肤癌照片使用了基于不同参数的\
  \ `CNNs` 算法。在我们测试的架构中，`EfficientNetV2` 表现出稳定的成功水平，达到了 90.41% 的诊断准确率，超过了其他架构；基础 `CNN`\
  \ 架构的结果不尽人意，这凸显了利用先进模型进行准确诊断的重要性。\n\n我们的研究强调了在皮肤癌诊断中获得稳健性能指标的关键重要性。准确区分良性和恶性肿瘤的能力对于患者的预后和治疗决策至关重要。分类错误可能会导致严重后果，这强调了追求先进水平模型的需求。`EfficientNetV2`\
  \ 在我们的分析中脱颖而出，在快速的推理时间和卓越的预测准确率之间提供了极佳的平衡。它在保持计算效率的同时做出高度准确预测的能力，使其成为临床应用极具前景的工具。\n\
  \n总之，我们的研究证明了先进机器学习技术在提高皮肤癌诊断准确性和效率方面的重要作用。通过利用如 `EfficientNetV2` 等前沿模型，我们旨在为医疗专业人员提供准确的诊断和有效的治疗方案，最终提升皮肤健康领域的患者护理和结果。未来，我们的方法将在更多高分辨率图像上进行测试，以验证其在现实环境中的有效性和适用性。\n\
