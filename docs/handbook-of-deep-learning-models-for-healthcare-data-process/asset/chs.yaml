  \ 308–333)。IGI Global. [`doi.org/10.4018/979-8-3693-2373-1.ch015``](https://doi.org/10.4018/979-8-3693-2373-1)1-`979-8-3693-2373-1`](https://doi.org/10.4018/979-8-3693-2373-1)。\n\
  \n\n\n\n\n\n\n\n## 2.1 引言\n\n所有行业的数据量正呈指数级增长。因此，涌出了许多与数据交互的新技术；机器学习是一个跨越计算机科学、统计学和人工智能（AI）的快速发展的领域。\n\
  \n该领域的研究需求源于医疗数据的重大意义。电子健康记录（EHR）的普及，使得应用和研究更稳健的机器学习方法变得可行。机器学习技术具有扩展性，并能适应复杂的数据模式，因此非常适合解决医疗问题。\n\
  \n机器学习在医疗领域的主要应用之一是识别难以诊断的疾病。此外，它还应用于新药的及时发现、医学影像分析、独特药物的开发、智能健康记录的使用、科学测试、众包数据收集以及疾病预测。机器学习不仅可以降低医疗成本，还能增强医患关系，对医疗行业的发展具有重要意义。\n\
  \n此外，疾病通常分为急性和慢性两种；急性疾病通常持续几天到几周，且发作突然，而慢性病需要更长的时间才会显现，并可能持续数月甚至数年。机器学习在急性和慢性疾病的预测中被广泛应用，我们将在本章中详细讨论。\n\
  \n### 2.1.1 动机\n\n所有行业的数据量正呈指数级增长。因此，涌出了许多与数据交互的新技术；机器学习是一个跨越计算机科学、统计学和人工智能（AI）的快速发展的领域。\n\
  \n该领域的研究需求源于医疗数据的重大意义。电子健康记录（EHR）的普及，使得应用和研究更稳健的机器学习方法变得可行。机器学习技术具有扩展性，并能适应复杂的数据模式，因此非常适合解决医疗问题。\n\
  \n图 2.1 显示，到 2025 年，医疗行业的预计复合增长率将达到 36%，比金融行业高 10%，比媒体娱乐业高 11%，比其他行业高 6%。\n\n```\n\
  图 2.1: 2018–2025 年年增长率\n```\n\n\n\n\n医学诊断是一项复杂且重要的实践，必须确保准确。通常情况下，疾病由医疗专业人员根据其知识和技能进行诊断，但这有时会导致误诊和高昂的患者支出。早期诊断可以降低死亡率并提高疾病的治疗几率。因此，需要基于机器学习（ML）的计算系统来为回答不明确的问题提供智能支持。海量数据集和智能算法对于将机器学习应用于医疗健康领域至关重要。\n\
  \n慢性病对个人的寿命和生活质量，以及全球各国政府和国家产生了广泛影响。全球范围内，2019 年约有 1790 万人死于心血管系统疾病。2020 年肺癌导致了\
  \ 180 万人死亡，是该年度癌症死亡人数最多的类型。此外，估计到 2045 年，全球将有 7 亿人人患有糖尿病 [7]。尽管慢性疾病无法治愈，但早期发现和诊断可以显著改善治疗效果。因此，医疗机构需要像机器学习这样新型且强大的技术，为患者提供高质量、高性价比且及时的服务。为此，我们在以下研究问题（RQs）的指导下开展了本章的研究，旨在识别机器学习疾病预测的最新趋势：\n\
  \n\n本章由多个章节组成。在第 2 节中，我们描述了如何选择研究文章以回答研究问题。第 3 节包含了对我们研究文献的详细且系统的综述。第 4 节包含了文献回顾的主要发现。第\
  \ 5 节包含了对研究问题的回答和讨论。第 6 节对本研究进行了总结。\n\n## 2.2 方法\n\n### 2.2.1 检索方法论\n\n我们使用了详尽且系统的检索方法，在\
  \ Google Scholar、IEEE Explorer、Scopus、Science Direct、Research Gate 等数据库中使用 `ML in\
  \ healthcare`、`chronic disease prediction`、`ML predictive models` 和 `ML in disease\
  \ prediction` 等检索词识别所有相关论文。我们检索了 2018 年至 2023 年间发表的、涵盖慢性病和急性疾病的文章，如甲状腺疾病、心血管疾病、慢性肾脏病（CKD）、乳腺癌、斑秃性脱屑、脑肿瘤、糖尿病肝炎、登革热和新冠肺炎肺炎。我们在图\
  \ 2.2 中分解了文章筛选过程，包括每种疾病考虑的文章数量。\n\n\nFIGURE 2.2 本章研究的文章筛选。\n\n### 2.2.1.1 选择标准\n\
  \n正如我们所述，我们遵循了上一节中描述的过程来识别文章标题和摘要，选择了我们认为合适的文章，并删除了重复文章；我们还根据语言、方法价值和出版日期来接受或排除文章；具体而言，我们排除了\
  \ 2018 年之前发表的文章。\n\n## 2.3 相关工作\n\n研究人员已应用不同的算法和方法论来预测各种急性疾病。\n\n### 2.3.1 用于慢性病识别的机器学习预测模型\n\
  \nWroge 等人对帕金森病测试了不同的机器学习模型。他们使用 `Scikit-Learn`、`Keras` 和 `TensorFlow` 开发了 `DT`（决策树）和\
  \ `SVM`（支持向量机）分类器。结果显示，机器学习模型超过了平均水平 [8]。\n\nThirunavkarasu 等人使用 `SVM`、`LR`（逻辑回归）和\
  \ `KNN`（k-最近邻）来预测肝脏问题。`LR` 的准确率高于 `KNN` [9]。Kapoor 和 Mishra 使用前馈 `ANN` 和反传播测量了神经网络的精度\
  \ [10]。\n\nMir 和 Dhage 将 `SVM`、`RF`（随机森林）、`NB`（朴素贝叶斯）和 `CART`（分类与回归树）与 `WEKA`（知识分析环境）预测工具相结合。他们发现\
  \ `SVN` 是预测糖尿病的最佳分类器 [11]。\n\nKohli 和 Arora 利用来自 `UCI`（加州大学欧文分校）机器学习数据库的数据展示了许多分类技术。`SVM`\
  \ 算法预测糖尿病的准确率为 85.71%；`AdaBoost` 预测乳腺癌的准确率为 98.5%，`LR` 预测心脏病的准确率为 87.1% [12]。\n\n\
  在 [13] 中，Sarwar 等人在比较了与不同机器学习方法（集成学习、`NB`、`SVM`、`KNN` 和 `ANN`）的效果后，展示了一种基于人工智能的二型糖尿病诊断集成工具。他们使用了\
  \ `MATLAB` 2013a 和 `WEKA` 3.6.13。\n\n在 [14] 中，Nilashi 等人利用有效的集成学习创建了肝炎诊断框架。Nilashi\
  \ 等人创建的系统优于 `SVM`、`ANFIS` 和 `KNN`。\n\n\n\n在`[15`中，Dahiwade 等人提供了一种基于患者症状的通用疾病预测框架。他们比较了`CNN`（卷积神经网络）和`KNN`算法，发现`CNN`提供的疾病预测模型准确率更高，达到了\
  \ 84.50%。`KNN`也具有更高的空间和时间复杂度。在`[16`中，Çınarer 和 Emiroğlu 测试了多种肿瘤分类方法将脑影像分类为多灶性、n/a、多中心或胶质母瘤的有效性。作者通过检查数学特征对图像进行分类，并使用`KNN`、线性判别分析(`LDA`)、`SVM`和`RF`进行测试并将数据分为不同的类别。`SVM`的性能优于其他分类器，达到了\
  \ 90%的准确率。\n\n在`[17`中，Atallah 和 Al-Mousa 开发了一种基于集合的机器学习方法，该方法将`RF`、`LR`、`KNN`和硬投票分类器与其他机器学习方法相结合。他们使用这种方法预测心脏病的概率，提高了模型的正确性和稳健性。该集成模型实现了\
  \ 90%的准确率，高于任何单一分类器的准确率。在`[18`中，Ali 等人建立了一个混合智能模型，使用`LDA`和`SVM`检测心力衰竭。他们使用`SVM`选择特征，并剔除了无关特征，使用`LDA`将输入向量分类为感染或健康。混合模型的准确率高于任何单一模型，范围从\
  \ 57.8%到 89.01%。\n\n在在`[19`中，Mohan 等人提出了一种新的机器学习算法来识别重要特征，以提高心脏病预测的准确率。他们使用了来自 UCI\
  \ 仓库的数据集，并使用`R studio`包进行分析。他们新的方法结合了混合`RF/linear model`(`HRFLM`)，表现出性能，准确率为 88.7%。\n\
  \n在`[20`中，Yadav 和 Pal 使用甲状腺疾病数据集展示了数种分类技术，并使用不同的`seed`和`num-fold`值测量了准确率。`DT`的准确率为\
  \ 98%，`RF`为 99%，决策树为 93%。作者使用名为`bagging`的集成技术增强了系统，该技术整合了`DT`、`RF`和决策树。集成系统在种子值为\
  \ 35、折数为 10 时实现了 100%的准确率。研究得出，集成方法可用于改进甲状腺识别。Karen 等人整合卡方检验(`χ²`)与`PCA`以增强预测心脏病的机器学习方法。为了改进原始数据结果，他们应用了降维，发现`PCA`和`χ²`对大多数分类器效果最好。此外，将`χ²`和`PCA`与`RF`结合提供了最高的预测准确率：Cleveland\
  \ 数据集为 98.7%，`χ²`为 99.4%，匈牙利数据集为 99.0%。仅仅将`PCA`应用于原始数据性能较低`[21`。\n\nJongbo 等人研究了集成学习的`bagging`和随机子空间策略。使用的基础分类器有`KNN`、`NB`和`DT`。通过受者操作曲线(`ROC`)、准确率、`kappa`、特异性和敏感性标准确定了模型的功效。从\
  \ UCI 仓库收集的 CKD 数据结果显示，集成技术优于基础分类器。在大多数情况下，随机子空间的表现优于`bagging`集成技术。最后，研究得出，应用于`KNN`的随机子空间技术最大预测准确率为\
  \ 100%`[22`。\n\n在`[23`中，Kumar 等人使用`DT`、`KNN`、`RF`、`LR`和`SVM`识别心血管疾病(`CVD`)；`RF`分类器的`ROC-AUC`为\
  \ 0.8675，准确率为 85.71%。`RF`分类器在识别 CVD 患者方面优于所有其他分类器。在`[24`中，Hamdaou 等人利用 UCI 仓库的数据，使用`DT`、`KNN`、`SVM`、`RF`和`NB`算法开发了一种监测心脏问题的方法。训练测试划分以及交叉验证结果显示，`NB`的表现更好，准确率分别为\
  \ 82.17%和 84.28%。此外，使用交叉验证降低了每个分类器的准确率。\n\n在`[25`中，Terrada 等人制定了一个用于识别动脉粥硬化的医疗诊断支持系统，该系统使用`ANN`和自适应提升从患者医学数据中学习。作者使用了\
  \ UCI 仓库的 Cleveland 和匈牙利数据集以及 Sani-Alizadeh 数据集，并使用`ROC`评估了性能。在 Cleveland 数据集上，ANN\
  \ 的性能优于 AdaBoost，ANN 预测分类准确率为 94%。\n\n在`[26`中，Islam 等人从 UCI 库获取威斯康州乳腺癌数据集，比较了`SVM`、`RF`、`KNN`、`LR`和`ANN`。他们根据准确率、敏感性、特异性和精确率，以及马修斯相关系数(`MCC`)、`F1`、负预测值、假阴性和假阳性率、`ROC`和曲线下的精确召回率(`PR-AUC`)对每个系统进行了验证。作者发现\
  \ ANN 的结果最好，其准确率、`F1`和精确率分别为 98.57%、0.9890 和 97.82%。\n\n在`[27`中，Harimoorthy 和 Thangavelu\
  \ 使用来自 UCI 库的数据和`χ²`识别关键特征，开发了一个预测 CKD、糖尿病和心脏病的模型。作者使用了`SVM linear`、`SVM polynomial`、改进的`SVM–radial\
  \ bias kernel`、`RF`和`DT`，改进的`SVM–radial bias kernel`优于其他方法，糖尿病达到 98.3%，心脏病达到 89.9%，慢性肾病达到\
  \ 98.7%。\n\n在`[28`中，Ripan 等人研究了利用`k-means clustering`识别异常以有效预测心脏病。为了发现异常情况，他们设计的系统首先通过轮廓法对数据进行分组，以确定最有利的`k`值。随后，作者在移除数据中的观察异常后，使用最常用的机器学习分类方法`KNN`、`SVM`、`RF`、`NB`和`LR`创建了预测模型。结果显示，当包含异常时，仅用于异常识别的`LR`、`RF`和`SVM`准确率良好。\n\
  \n在`[29`中，Chaubey 等人使用 UCI 数据集评估了三种最流行的机器学习方法`KNN`、`DT`和`LR`预测甲状腺病的准确率，并发现`KNN`比其他分类器更好地预测甲状腺病。在`[30`中，Rohini\
  \ 和 Surendran 假设`LR`、`MLR`和`SVM`输入特征可以预测 AD 或由于年龄引起的认知障碍，并首先对特征进行了归一化和缩放。使用多种不同的指标分析结果表明，该模型在区分\
  \ AD 与年龄相关的认知损害方面非常有效。\n\n\n\n\n- 在 [31] 中，Chittora 等人对基于 CKD 数据集的关键和完整特征来识别慢性肾病表示反对。他们使用基于相关性的\
  \ `LASSO` 回归和封装方法来选择特征，并使用了七种机器学习分类器：`ANN`、`C5.0`、`LR`、`CHAID`（`χ²`自动交互检测）、`LSVM`（最小二支持向量机）、`KNN`\
  \ 和随机树。每个分类器的结果均基于完整特征和选取特征，利用基于相关性的 `LASSO`、`wrapper`、通过 `LASSO` 选取特征的 `SMOTE`（少数类过采样技术）以及带有完整特征的\
  \ `SMOTE`。作者发现，当 `SMOTE` 具有所有特征时，`LSVM` 的准确率最高，达到 98.86%。\n\n- 在 [32] 中，Ahmed 等人设计了一个融合机器学习（特别是\
  \ `ANN` 和 `SVM` 模型）的糖尿病预测框架。他们使用这些模型分析数据集，以衡量模型在糖尿病诊断中的准确性。最后，模糊逻辑通过将模型输出作为隶属函数的输入，确定了糖尿病阳性诊断。建议的融合机器学习框架实现了\
  \ 94.87 的预测精度，高于其他技术。\n\n- 在 [33] 中，Ahmad 等人使用极端梯度提升（`XGB`）、`KNN`、`SVM` 和 `LR` 来预测心脏疾病，特别是针对现有方法，对这些模型在调优超参数的情况下进行了调整、教学和评估。通过测试修改\
  \ `XGB` 的 `Grid Search` 参数得到了 99.03% 的准确率。简而言之，带有 `GridSearchCV` 的 `XGB` 是评估准确性的最优超参数。\n\
  \n- 在 [35] 中，Islam 等人使用各种机器学习技术在早期阶段诊断 CKD。为了验证基于机器学习的检测模型，他们首先对原始 CKD 数据进行了预处理。然后，他们使用\
  \ `PCA` 来确定识别 CKD 最常见的特征。随后，他们将输入变量应用于训练和评估使用 CKD 患者构建的模型。作者发现，在从剩余变量中过滤出选定特征后，血红蛋白、白蛋白比密度对识别\
  \ CKD 的影响最大。准确率是确定每个算法整体性能的首要标准。\n\n- 在 [36] 中，Khan 等人利用机器学习为心血管疾病患者的精确诊断和治疗选择提供了重大的解释。作者从巴基斯坦的\
  \ Khyber 教学医院和 Lady Reading 医院随机选择了心脏病患者，并使用 `DT`、`RF`、`LR`、`NB` 和 `SVM` 对患者进行分类并预测其预后。通过\
  \ `ROC` 曲线，准确率和敏感性分别为 85.01%、92.11% 和 87.73%，`RF` 算法表现出最高的心血管疾病预测准确率。此外，`RF` 的误差最少，分类错误和特异性错误分别为\
  \ 43.48% 和 8.70%。结果显示 `RF` 是分类和预测心血管疾病的最佳算法。\n\n### 2.3.1.1 用于急性疾病识别的机器学习预测模型\n\n\
  - Davi 等人开发了一种用于预测糖尿病严重程度的机器学习方法，使用 `SVM` 作为该技术的基础。作者使用 `ANN` 对使用 CKD 患者构建的模型进行分类和预测，以确定糖尿病的严重程度。`ANN`\
  \ 模型显示准确率超过 86%，敏感性超过 98%，特异性超过 51% [37]。\n\n- Islam 等人利用 X 光图像提出了一种诊断 COVID-19\
  \ 的自动技术，使用了 `CNN` 聚合特征。他们使用 `LSTM` 诊断疾病并使用 `CNN` 提取特征，其组合模型实现了 99.4% 的准确率。`F1`、`AUC`\
  \ 和特异性分别为 98.9%、99.2% 和 99.3%。该模型可以有效地协助医疗专业人员识别 COVID-19 [[ref2_38)]。\n\n- Rasheed\
  \ 等人评估了机器学习算法从 X 光照片自动识别 COVID-19 的有效性。他们使用传统机器学习算法 `LR` 和深度学习技术 `CNN` 构建模型，并使用\
  \ `PCA` 作为特征提取器；`LR` 和 `CNN` 在诊断患者方面均显示出积极结果，准确率分别为 95.2% 和 97.6% [39]。\n\n- Khanday\
  \ 等人利用传统和集成机器学习技术对 212 名患者的医疗记录进行分类，涉及四种疾病：COVID-19、`ARDS`、`SARS` 或 COVID-19 + `ARDS`。从这些文本格式的医疗记录中提取了若干特征。在实施分类程序后，`LR`\
  \ 和 `NB` 方法产生了最佳结果，召回率为 96%，精确率为 94%，`F1` 为 95%。其他表现良好的机器学习方法是 `RF`、`DT`、提升法和随机梯度提升\
  \ [40]。\n\n- Brunese 等人使用 `KNN` 从 `GitHub` 存储库获取的医疗图像中创建了一个模型来识别 COVID-19。该模型成功地将\
  \ COVID-19 与具有相似症状的其他肺疾病区分开来，平均精度为 0.965。试验结果显示了所提模型的有效性 [41]。\n\n- Brinati 等人验证了使用血液测试和机器学习替代\
  \ `rRT-PCR` 来识别 COVID-19 患者的医疗可靠性。机器学习分类器利用从血液测试中观察到的化学指标，模型在 82% 到 86% 的时间内是正确的；敏感性在\
  \ 92% 到 95% 之间。模型表现优于金标准。此外，他们建立了一个可解释的 `DT` 系统用于理解血液测试结果的决策，该模型的表现也优于金标准 [42]。\n\
  \n- Kang 等人根据中国联合医院肿瘤中心的患者数据构建了一个检测 COVID-19 感染的模型。随后使用 `TensorFlow` 利用 `NN` 构建了该系统。该模型在预测方面表现良好，`AUC`\
  \ 为 0.953。该模型有效地描述了及时的医疗参与并提高了康复率 [43]。\n\n\n\n\n\nArpaci 等人利用六种机器学习分类器构建了六个独立的\
  \ COVID-19 识别系统：`LR`、`CR`、`BayesNet`、`IBk`、`J48` 和 `PART`；这些分类器依赖 14 个医学特征。作者研究了发生在中国浙江泰州医院的\
  \ 114 起事件。结果显示，`CR`是一种识别 COVID-19 非常准确的分类器，准确率为 84.21%。当 RT-PCR 试盒不足以进行检测时，这些结果有助于快速识别\
  \ COVID-19 [45]。\n\nSingh 等人利用他们在 `Python` 中合成的 COVID-19 数据集创建并实现了一种新型集成技术，以早期识别\
  \ COVID-19 并采取适当措施。他们使用的机器学习分类器有 `DT`、`ID3` 和 `SVM`，他们发现其创新技术在精度、`kappa`、均方根误差、召回率、F\
  \ 测量值和准确率方面表现出优越的性能 [46]。\n\nMeraihi 等人汇总了超过 160 种用于对抗 COVID-19 的机器学习算法，并将其分为深度学习或监督学习。然后，他们解释了每一类机器学习算法及其参数数量，其中包括所分析数据的性质、待解决的问题以及所评估的指标。根据发现，79%的案例使用了深度学习，65%使用了\
  \ `CNN`，17%使用了专门的 `CNN`。在调查的方法中，仅有 16%利用监督学习，最少使用的技术是 `RF`、`SVM` 和回归分析 [47]。\n\n\
  Kwekha-Rashid 等人回顾了涉及将机器学习应用于 COVID-19 研究的文章，在 16 项研究中，14 项使用了监督学习，1 项使用了监督与无监督学习结合的方法\
  \ [48]。结果显示，监督学习的表现优于替代的无监督学习，测试准确率达到 92.9%。同样，文献 [49–61] 表明，机器学习和人工智能是医学和生物医学领域的可行方法。\n\
  \n## 2.4 意义\n\n在这里，我们探讨了回答本章研究问题（RQs）的努力。在对不同疾病预测模型的文献进行广泛研究后，重要的发现总结在表 2.1 中。这些发现将帮助研究人员为开展工作选择合适的算法、软件和性能指标，并帮助研究人员和医疗专业人员扩大知识库。\n\
