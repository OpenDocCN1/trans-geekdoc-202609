  \ 结果与讨论\n\n在本节中，我们根据综述文献的发现回答研究问题（RQ）。\n\n### 2.5.1 RQ1：疾病预测常用的机器学习算法\n\n表 2.1 展示了最广泛和常用的声称提供卓越医疗诊断的机器学习算法，并根据预测的疾病进行了分类，图\
  \ 2.3 展示了作者使用每个算法的论文数量。\n\n```\n（图 2.3 占位符）\n```\n\n图中显示 `SVM` 是疾病预测最常用的机器学习算法，用于\
  \ 40 篇研究论文中的 23 篇。在 `SVM` 之后，常用的算法是 `DT`、`RF` 和 `KNN`，最少的是简单的 `CART`。\n\n### 2.5.2\
  \ RQ2：实现模型的工具\n\n工具是机器学习的重要部分，正确的工具与强大的算法同样重要；疾病预测模型的一些常用工具是 `WEKA`、`Python`、`MATLAB`、`R\
  \ Studio` 和 `JAVA`。图 2.4 显示了所使用的工具以及它们所在的论文数量。\n\n```\n（图 2.4 占位符）\n```\n\n图中清楚地显示\
  \ `Python` 是实现疾病预测模型最广泛使用的软件，其次是 `WEKA` 和 `MATLAB`。最少的是 `R Studio` 和 `JAVA`。\n\n\
  ### 2.5.3 RQ3：用于评估的性能指标\n\n\n\n研究人员使用了多种性能指标来评估他们提出的模型。指标的选取基于其与问题的相关性，包括混淆矩阵、准确率、精确率、召回率、敏感性、特异性、kappa\
  \ 统计量、ROC 曲线、AUC、PR 曲线和 `F1`。`图 2.5` 显示了我们审查的文献中不同人员使用的指标，以及这些指标所对应的文章数量。\n\n![图\
  \ 2.5 研究人员用于评估的性能指标。](img/fig2_5.jpg)\n\n`图 2.5` 研究人员用于评估的性能指标。\n\n`图 2.5` 显示，准确率是所有指标中最常见的：在\
  \ 40 篇文章中，有 36 项研究的作者使用了 `accuracy` 来验证他们的模型。`紧随其后的是 `F1`（20 篇文章的作者使用）和 `AUC`（17\
  \ 篇文章的作者使用）。`MCC` 和 `kappa` 是使用最少的指标。\n\n### 2.5.4 RQ4：局限性与未来工作\n\n`表 2.1` 包含了我们在文献中识别出的研究空白以及未来工作的可能范围。最常见的研究空白之一是许多作者仅在一个数据集上验证他们的模型。某些作者使用了非常小的样本，某些作者只研究了少数性能指标。许多作者也没有使用\
  \ `ROC curve` 来验证他们的模型，有些人仅比较了两个 `ML classifiers`。最后，一些研究显示了过拟合。研究人员确实提出重要的未来改进方向，例如使用不同的验证技术和不同的数据集（包括来自医疗中心的最新数据）。研究人员建议使用\
  \ `ensemble learning` 来提高预测准确性，并选择不同的特征以及结合降、数据增强、数据清洗、流水线化和增量学习。\n\n## 2.6 结论与未来工作\n\
  \n`machine learning` 在实现准确疾病预测方面发挥着重要作用。在本章中，我们对用于预测慢性和急性疾病的不同 `ML techniques` 进行了深入研究，并在过程中解决了我们的研究问题。从我们的工作中可以得出若干重要结论。首先，识别出的研究空白和潜在的未来工作为追求和产生改进模型提供了方向。其次，我们确定用于疾病预测的最广泛使用的\
  \ `ML algorithm`、实现模型的软件以及评估指标分别是 `SVM`、`Python` 和 `accuracy`。\n\n我们还确定了模型的准确性取决于数据集、所选的特征以及降维和数据增强技术；算法的准确性也可以取决于数据集。将不同的\
  \ `ML techniques` 整合到 `ensemble models` 中也能提高性能和准确性。预测模型应该使用各种标准针对各种医疗数据集进行验证，且数据不应容易过拟合。为了找到特定疾病的最佳预测分类器，应该比较多个分类器，研究人员应使用大样本量以确保结果准确。我们的发现将帮助从业人员选择有效的诊断工具，辅助疾病的准确诊断和预后。未来的研究将实现对某些致命疾病的准确早期预测和诊断。\n\
