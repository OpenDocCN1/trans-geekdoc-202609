  \ 日，[https://doi.org/10.1201/9781003329947]\n\n# 16 重新构医疗保健：AI 对诊断和治疗的影响\n\nBasudha\
  \ Dewan DOI: 10.1201/978100346781-18\n\n## 16.1 引言\n\n医疗领域的 AI 是医疗系统提供和管理的一项创新。根据\
  \ Snowdon 的说法，数字健康框架是推进医疗保健议程的关键工具，因为它为优化生产力、触达率和治疗效果提供了新的选择。这种整合正变得越来越关重要，特别是考虑到由于技术进步和全球范围内新兴健康问题，医疗系统正在发生的演变\
  \ [1]。\n\nWilliams 观察到 COVID-19 如何凸显了私立医疗系统的脆弱性。疫情严重考验了市场安排和治理体系，凸显了迫切需要解决方案来解决这些缺陷。在这种背景下，AI\
  \ 可以被视为在史所未有的挑战中填补医疗服务提供和管理空白的强大工具 [2]。\n\nTabriz 等人通过分析医疗维护组织的失败，确定了关于负责任护理组织如何利用\
  \ AI 从错误中学习的若干见解 [3]。RAND 考虑了慢性疾病，这是美国医疗体系中的一个重要问题。特别是，作者关注了慢性病发率上升及相关成本的问题。AI 能够通过数据分析和治疗计划增强疾病控制来减轻这些压力\
  \ [4]。\n\n世界卫生组织为全球健康管理提供了关键见解，包括对 COVID-19 病毒的命名。这强调了全球合作以及利用技术进行健康管理和控制的需求。虽然\
  \ AI 技术可以在这些方面发挥作用，但人们普遍认为这些技术可以极大改善公共卫生响应，并扩展诊断和治疗能力 [5]。\n\n最后，Butcher 和 Hussain\
  \ 揭示了数字医疗演变的影响，并关注了 AI 技术的前景。他们对未来数字医疗的文献综述结果也证明了应对当前和未来医疗需求进行持续创新和采用 AI 的必要性 [6],\
  \ [7]。请参见图 16.1 的 AI 医疗应用。\n\n![AI 在医疗保健中的应用](img/fig16_1.jpg)\n\n**16.1 AI 在医疗保健中的应用**\n\
  \n## 16.2 AI 在医疗保健中的重要性\n\nAI 因其诊断精度、患者体验的优化以及错误率的降低正在改变医疗保健 [8]。它已成为肿瘤学、心脏病和神经系统疾病的关键工具之一，通过分析复杂的医疗数据帮助更快地诊断疾病。AI\
  \ 使早期发现疾病、优化资源和增强特定治疗方案的效果成为可能 [9]。\n\n### 16.2.1 放射学与诊断服务\n\nAI 现在已在医学影像中得到全面应用，实现了高诊断准确性和更快的结果。例如，在肿瘤学领域，AI\
  \ 在区分转移性乳腺癌方面表现优异。深度学习能够识别医学图像中的癌细胞，在某些情况下甚至超过了人类病理学的能力 [10]。\n\nEsteva 等人 [11]\
  \ 应用深度神经网络诊断皮肤癌，模型的准确性接近皮肤科医生；Rajpurkar 及其同事 [12] 发现深度学习模型可以从胸光中诊断肺炎，水平与放射科医生相当。这些基于\
  \ AI 的应用提高了诊断率和准确性，特别是在缺乏医疗设施和专业医生的地区，但影像并不是 AI 唯一的价值领域；神经和心理健康诊断也受益于 AI。\n\n\n\n\
  \n例如，自动语音分析允许对被识别为精神疾病高风险人群的个体进行疾病发生前周期的估算。Bedi 等人 \\[13\\]和 IBM 研究小组 \\[14\\]也早就指出，AI\
  \ 可以预测精神分裂症和帕金森病等神经系统疾病的生物标志物，以便及时治疗。Chou 等人 \\[15\\]则演示了使用二分类增强决策树来预测糖尿病。\n\nCOVID-19\
  \ 大疫情对于扩大 AI 在医学影像中的作用 \\[16]]。Gudigar 等人 \\[17\\]最近应用了深度神经网络和混合方法，通过 X 射线和 CT 扫描诊断\
  \ COVID-19。Khanna 等人 \\[18\\]强调了这种详尽的方法，指出 CT 扫描和胸部 X 射线是医疗保健领域至关重要的 AI 应用。AI 的一个新领域——Transformer\
  \ 模型，已将医学影像提升到了新的水平。Costa 等人 \\[19\\]和 van Tulder 等人 \\[20\\]使用 Transformer 架构通过\
  \ CT 和 X 射线影像区分 COVID-19 和肺炎，证明了 AI 在抗击大流行中是多么至关重要。Krishnan 等人 \\[21\\]利用视觉 Transformer（ViTs）从胸部\
  \ X 射线切片中识别 COVID-19，该 AI 模型性能优于 CNN。Wang 等人 \\[22\\]提出了一种基于小波波脊提取和生物地理优化的新型组合方法，用于从胸部\
  \ CT 图像中自动分割 COVID-19。该方法在达到相同诊断性能时，超越了其他典型的基于机器学习的方法。最后，ViTs 在区分乳腺恶性组织和良性组织方面也优于\
  \ CNN \\[23]。\n\n纳菲尔生物伦理委员会强调了 AI 卓越的数据处理能力和速度如何确保癌症和心脏病等致命疾病的早期诊断和治疗。此外，英国正在探索将\
  \ AI 应用于医疗护理。上议院讨论了 AI 的使用，因为它强调了在医疗保健中实施 AI 使用伦理化方法的重要性 \\[24, 25]]。\n\nSecinaro\
  \ 等人证明了 AI 在诊断疾病、预测患者预后等方面具有重要作用。Oren 等人建议从传统的放射学数据转向临床相关的终点，这是医学影像领域向前的一大步。这种转变使重点关注治疗和以患者为核心的护理，而不仅仅是数据\
  \ \\[26, 27]]。\n\n### 16.2.2 药物研发与医学研究\n\nAI 在诊断疾病、预测患者预后等方面具有重要作用。Oren 等人建议从传统的放射学数据转向临床相关的终点，这是医学影像领域向前的一大步。这种转变使重点关注治疗和以患者为核心的护理，而不仅仅是数据\
  \ \\[26, 27]。\n\nSecinaro 等人证明了 AI 在诊断疾病、预测患者预后等方面具有重要作用。Oren 等人建议从传统的放射学数据转向临床相关的终点，这是医学影像领域向前的一大步。这种转变使重点关注治疗和以患者为核心的护理，而不仅仅是数据\
