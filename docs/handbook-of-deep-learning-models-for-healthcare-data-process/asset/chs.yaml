  \ ResNet 模型混淆矩阵。\n\n### 3.5.2 针对 AD 分类的 ROC 曲线分析\n\nROC 曲线通过改变阈值，绘制真阳性率（`TPR`）或灵敏度相对于假阳性率（`FPR`）或（`1-异性`）的关系，来评估分类模型的识别准确性。模型区分类别的整体能力通过\
  \ `AUC` 衡量；数值越接近 1 表示性能越好。在评估多个模型并根据特定的临床需求在灵敏度和特异性之间选择最佳阈值时，ROC 曲线非常有帮助。`CNN`、`MobileNet`\
