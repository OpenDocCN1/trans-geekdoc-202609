  \ 24th International Conference on Automation & Computing, 6–7. UK.\n\n# 18 基于卷积神经网络的医学图像分类\n\
  \nAyush Gour, Praveen Kumar Bhanodia, Kamal K. Sethi, and Shivshankar Rajput\n\n\
  DOI: [10.1201/978103467281-20](https://doi.org/10.1201/978103467281-20)\n\n## 18.1\
  \ 引言\n\n每天都会产生数百万张。每张图片在处理之前都必须分类，这使得过程更快且更少费力。对于人类来说，给照片分类比计算机要简单得多。位于目标区域上方、捕捉并处理图像的摄像头构成了简单分类系统的核心组成部分\
  \ [1]]。\n\n在医疗健康领域，照片有助于肿瘤检测、疾病进展跟踪和细胞分类等任务。同样，在农业领域，照片有助于作物监测和入侵昆虫的识别 [2]]。交通领域受益于图像分析，用于车辆分类、流量分析和确定停车占用情况等任务。在这些多方面的过程中，核心的功能是图像分类。\n\
  \n根据共同相似性将图片分为不同的组的过程被称为分类。通过这种分类，我们获得了一种理解和评估环境的方便方法。然而，对图像分类并不总是很容易，特别是当它包含噪声或不清晰元素时。用户与分类系统中的数据库交互，该数据库包含已定义或待分类的特定模式或图像\
  \ [3]]。图像分类对于许多应用不仅是一项挑战，是一项关键问题。\n\n\n\n\n图像分类是近年来备关注的一个领域，它代表了计算机视觉必须解决的基础问题之一，并是视觉识别各个子领域的基石\
  \ [4]。提升分类网络的性能通常会提高应用水平，这在超分辨率技术、视频分类、目标目标、、目标识别和人体姿态估计等领域已得到证实。增强计算机视觉的进展涉及几个步骤，其中一步是推进用于图像分类的技术。这一过程的主要阶段包括数据准备、特征提取与表示以及分类器的创建。\n\
  \n人工神经网络一直是解决挑战性分类任务（如图像识别和分割）的研究关注重点 [5]。这些算法的显著优势之一是能够通过采用相似架构处理多样化的问题。为了对土地覆盖对象进行更精确、有效且快速的分类，遥感领域已经提出并应用多种分类算法，包括基于对象、基于像素、基于亚像素和基于块（patch-based）的方法。基于块的分类因其简单且可靠的性能，近期引起了广泛关注。\n\
  \n`CNN` 就像是一个调查员团队，帮助分析图像或视频等证据来破解谜团。该团队由多层调查员组成，每层都有特定的角色 [6]。第一层仔细观察证据，像使用放大镜一样以识别基本特征。第二层检查第一层识别出的特征并寻找模式，就像侦探在寻找线索。第三层分析第二层发现的模式并在它们之间建立联系，就像侦探在拼凑理论。最后一层呈现分析得出的结论，就像侦探向首席调查员报告他们的发现。`CNN`\
  \ 团队共同工作以揭示证据中隐藏的真相，帮助分类对象、识别人脸，甚至检测欺诈。\n\n以块为中心（Patch-centric）的技术在各个领域已获得流行，特别是在医学可视化领域。这些多功能方法被用于图像分割、降噪、超分辨率、检查、诊断、对齐、不规则识别和合成等任务\
  \ [7]。它们擅长局部检查图像，捕捉细微差别并提供有价值的见解。基于块的方法能够有效处理复杂且异构的信息，使其适用于分割、诊断和异常检测。局部图像块字典的使用也越来越受到关注，有助于疾病分类和组织分割等任务。计算能力的提高和大规模数据集的可用进一步增强了基于块技术的性能和泛化能力\
  \ [8]。它们已成为医学成像中的重要工具，改变了任务并促进了患者护理的进步。通常，基于块的字典与模式识别方法结合使用，以准确地对复杂的剖结构。\n\n图像内容表示不仅全局图像和局部体素，还扩展到了块级细节。事实证明，这种抽象适用于图像处理任务（包括增强和去噪），以及使用卷积内核和\
  \ `CNNs` 提取或分类图像特征。`CNN` 是利用人工神经网络模拟哺乳动物视觉层的一项重大成就 [9]。基于 `CNN` 的框架确实在语义分割、实例分割、图像描述、活动信号定位等多个领域超越了人类水平。`CNN`\
  \ 在从数据中学习分层模式和特征方面的适应性，使其成为机器学习和人工智能研究领域中一种多功能工具。\n\n## 18.2 相关工作\n\n[10] 的作者引入了一种使用分层块状\
  \ `CNN` 进行图像分类的新方法，该方法有效地结合了局部和全局上下文信息。传统的基于块的 `CNNs` 在平衡局部和全局特征提取之间取得平衡方面经常遇到困难。为了解决这个问题，作者提出了一种分层块嵌入模块，使模型能够从输入图像中有效学习局部和全局特征，从而提高了分类性能。作者还提出了一种结合数据增强和迁移学习以提高泛化的新型训练策略。实验结果表明，该方法优于基准模型，在\
  \ `CIFAR-10` 数据集上实现了先进的性能，并且对变换具有更强的鲁棒性。该论文标志着使用分层块状 `CNN` 进行图像分类的进展。\n\n通过病理学检查乳组织样本对于准确诊断和分类乳癌至关重要。然而，开发能够正确区分不同类型乳组织的精确分类系统仍然是一个巨大的挑战。在\
  \ [11] 中，作者试图通过提出一种结合 `CNN` 和基于块分类的新型深度学习模型，用于自动分类病理乳图像来解决这个问题。该方法被称为基于块的分类器 (`PBC`)，它利用\
  \ `OPOD` 和 `APOD` 模式分别预测单个块和整个图像的类别标签。使用 `ICIAR 2018` 乳腺组织学图像数据集对该方法的有效性进行了评估，在块分类模式下，对于四类和两类病理类别实现了高准确率，分别为\
  \ 77.4% 和 84.7%。此外，在划分测试集上，`APOD` 的四类分类准确率为 90%，二类分类准确率为 92.5%。这些发现表明了 `PBC` 模型在准确高效分类病理乳图像方面的具有潜力。\n\
  \n\n\n\n# 医学影像\n\n由于类别之间存在相似性以及类别内部存在差异，使用皮肤镜图像进行皮肤癌检测具有很高的挑战性。目前大多数方法使用深层 `CNN`\
  \ 从全分辨率图像中提取特征，但这在缩小比例时会导致信息丢失。皮肤镜图像的可用性有限也阻碍了模型开发。`[12]` 的作者提出了一种在自动皮肤癌检测方面具有显著进展的方法，展示了基于补块的特征提取和\
  \ `kernel PCA` 在增强皮肤镜图像分析准确性方面的潜力。他们从皮肤镜图像的各个补块中提取特征。通过利用预训练的 `CNN` 模型，他们智能地结合了这些基于补块的特征以保留复杂的细节。为了进一步增强特征选择，他们应用了\
  \ `kernel principal component analysis` 来识别最关键的特征。然后，他们使用前馈神经网络根据所选特征进行皮肤癌检测。实验结果证实了该技术的有效性，因为与当前皮肤癌分类的最优实践相比，该方法表现出了令人印象深刻的性能。此外，通过比较多种现代的预训练\
  \ `CNN` 模型，他们获得了关于这些模型对此特定任务适用性的见解。\n\n`[13]` 的作者提出了一种名为 `PIP-Net`（基于补块的直观原型网络）的新方法，以增强图像分类模型的可解释性。作者开发了一种用于图像分类的自监督模型，通过获取原型组件的知识产生易于解释的结果。通过这种方法生成的原型显示出与人类视觉更强的一致性。`PIP-Net`\
  \ 获取了一组原型，代表了其在预测中采用的样化概念。这些原型提供了全面的全局解释性，阐明了模型对任何输入图像的决策过程。此外，这些原型具有人类友好的理解性，使得\
  \ `PIP-Net` 成为揭示深度学习模型机制的关键资产。可解释性方面的进展为图像分类领域做了宝贵贡献，能够为模型的预测提供更清晰、更具洞察力的解释。虽然作者展示了具有前景的结果，但仍需对他们的发现进行进一步验证。重复实验以及与其他方法的比较将有助于所提方法的稳健性和可靠性。\n\
  \n## 遥感\n\n遥感图像分类对于各种应用已变得越来越重要。深度学习方法已广泛应用，但由于类别内部及类别之间的相似性和变异，在准确分类场景方面仍面临挑战。针对这一挑战，`[14]`\
  \ 的作者引入了一种名为 `patch-based discriminative learning`（`PBDL`）的新方法，专门为遥感场景图像分类而设计。`PBDL`\
  \ 通过考虑图像区域之间的空间关系并采用分层特征提取框架，改进了传统的表示。通过滑动窗口机制选择性地提取有意义图像段，`PBDL` 在保留重要细节的同时减少了无关属性。此外，图像金字塔的应用增强了视觉信息并微调了位置和缩放因子。随后，通过局部描述符提取多级、多尺度特征并将其组合成关键词直方图。然后，这些特征通过一种平衡其贡献的融合策略集成到\
  \ `bi-directional LSTM` 中。实验表明，所提方法的性能优于当代基于深度学习的技术，凸显了其在解决遥感场景图像分类相关挑战方面的有效性。\n\
  \n## 乳腺癌分类\n\n在之前的研究 `[15]` 中，人员利用基于补块的分类器（`PBC`）方法自动对乳腺图像进行分类。由于图像可用有限，采用了分块和增强等技术来扩展训练数据集。从原始图像中提取诊断补块并用于分类。作者采用了两种操作模式：`OPOD`\
  \ 和 `APOD`。在 `OPOD` 模式下，`PBC` 为每个补块分配一个类别标签，并通过与原始图像的类别标签进行比较来评估这些分配的准确性。`APOD`\
  \ 模式遵循类似的过程，但图像的整体类别标签通过多数投票系统确定。\n\n评估是在 `ICIAR 2018` 乳腺组织病学数据集上进行的，该数据集包括良性、侵润性和正常肿瘤的图像。在所提的\
  \ `OPOD` 模式下，在通过划分训练数据集创建的测试集中，`Class 4` 的准确率为 77.4%，二类组织病理学分类的准确率为 84.7%。建议的 `APOD`\
  \ 技术显示出提高的准确率，在划分的测试集上实现了四类分类 90% 的准确率二类分类 92.5% 的准确率。在评估 `ICIAR-2018` 隐藏测试集时，`[15]`\
  \ 达到了 87% 的准确率。\n\n## 网络安全\n\n勒索软件通过要求付款来加密数据。变种通过指纹规避检测。需要有效的检测和分类策略以减少分析师的负担并防御不断变化的威胁。`[16]`\
  \ 的作者引入了一个利用深度学习进行 `N-gram` 静态分析的框架。可执行的操作码序列被视为自然句子，因为它们具有丰富的上下文语义。`N-gram` 的长度从数百到百万不等。大多数基于\
  \ `RNN` 的深度序列分类器无法分类长序列。作者将 `N-gram` 序列分成许多补块，并将每个补块输入 `SA-CNN`，以解决这个问题并增加我们框架的可扩展性。双向注意力网络在连接\
  \ `SA-CNN` 输出后分类勒索软件。与 `CNN` 和 `RNN` 相比，注意力机制能够有效捕捉距离感知依赖关系。我们首次使用操作码注意力机制分类勒索软件。注意力网络和框架中的划分允许其从长序列中提取上下文和语义信息。根据对真实数据集的测试，该研究工作优于最先进的技术。\n\
  \n在 `[17]` 中，人员评估了使用二维 `CNN` 和全连接层的深度学习技术与基于补块的 `SVM` 和 `NN` 的对比。遥感图像分类传统上依赖于基于像素的方法，但这些方法具有局限性。深度学习方法（如\
  \ `2D CNN`）提供了更高的性能，但计算量大且需要大量的训练数据。人员建议 `SVM` 和 `NN` 分类器都使用图像块作为输入而非单个像素，类似于 `CNN`\
  \ 使用图像块构建后续分类的特征。使用两个数据集（一个多光谱数据集，另一个高光谱数据集）评估了多种分类器。根据两个数据集获得的结果，基于补块的 `SVM` 和\
  \ `NN` 分类器的性能优于 `2D-CNN`。此外，研究揭示了补块的大小对于决定补块分类器的效率至关重要。\n\n\n\n\n\n在精确的土地覆盖制图领域，分类单元主要分为两大类：像素和对象。在等分辨率图像的情况下，像素传统上一直是首选的分类单元，主要因为基于对象的方法由于空间分辨率限制，往往效果较差。在\
  \ [18]，基于块（patch-based）的方法通过利用邻近像素的信息特征，显示出比基于像素更高的准确率。作者研究了两种改进基于块算法分类性能的方法，并使用轻量级卷积神经网络（`LCNN`）对其进行了测试。在尝试通过其他手段提高\
  \ `LCNN` 的分类准确率之前，作者尝试对数据进行翻转和旋转；然后他们使用了考虑地图多样性的目的抽样法，将其应用于 `LCNN`。这项研究证明了基于块的技术优于基于像素的技术，表明通过针对性采样进行数据增强可以进一步提高\
  \ `LCNN` 的分类准确率。\n\n从原始图像数据中提取价值特征是一项艰巨的任务，特别是在处理复杂的场景或物体时。为了克服这一障碍，研究人员将 `CNNs`\
  \ 应用于不同维度（100 × 100、50 × 50 和 25 × 25）的基于块的巩膜-周围图像块作为输入，在基于块的图像上实现了 99.3% 的卓越准确率。该方法有效地捕捉了巩膜周围区域的细微变化，这些变化区分了不同的类别。他们的发现证实了\
  \ `CNNs` 是图像分类任务的有力工具，特别是当与基于块的输入表示等合适的预处理方法相结合时。未来的研究工作可能关注通过探索不同的网络架构、正则化技术和迁移学习方法来优化此类系统的性能。\n\
  \n[20]] 的作者讨论了腰椎 MRI 扫描的自动分割，以揭示前后和背外侧曲线，这对于早期识别腰椎管狭窄症（慢性腰痛的最常见原因）至关重要。他们使用了一个带有卷积层和全连接层的神经网络进行基于块的像素分类，该网络通过结合三个最低椎间盘\
  \ 25 × 25 像素块的压缩轴位 T2 加权 MRI 扫描进行训练。在一系列实验中，在存在和不存在任何椎骨的情况下测试了分类网络在图像分割中的有效性。研究人员将该方法与十一种不同的像素分类器进行了比较，发现它在像素精度、平均准确率、平均交并比（`IoU`）和所选频率加权\
  \ `IoU` 方面均优于所有方法。该方法为检测腰椎管狭窄症提供了比当前标准更精确的边界勾画。尽管该方法展示了良好的结果，但由于图像质量、患者人口和扫描类型的变异，高质量且多样化的腰椎\
  \ MRI 数据集仍然是一个挑战，这影响了分割模型的泛化能力。\n\n在 CT 扫描中自动分割椎骨的任务充满了困难，包括存在重叠阴影、复杂的骨结构、不的物体边界以及巨大的患者差异。为了克服这些障碍，[19,\
  \ 21] 的作者提出了一种先进的深度学习方法，利用堆叠稀疏自动编码器（`SSAE`）从未标记数据中提取信息特征。通过分析小的图像片段，`SSAE` 可以学习复杂的模式，并使用特殊的\
  \ sigmoid 层将其归类为椎骨或非椎骨。这种创新方法在三个不同的数据集上进行了测试，并取得了卓越的结果，准确率达到 98.9%，精确率 89.9%，召回率\
  \ 90.2%，F1 分数 90.4%，`IoU` 为 82.6%， 且 `DC` 为 90.2%。这一突破性成就对于改进各种脊柱疾病的诊断和治疗具有巨大的前景。Table\
