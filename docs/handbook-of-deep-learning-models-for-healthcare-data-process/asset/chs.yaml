  \ 月):106903. [`doi.org/10.1016/j.cmpb.2022.106903`](https://doi.org/10.1016/j.cmpb.2022.106903).\n\
  -   [22] He, Kaiming, Xiangyu Zhang, Shaoqing Ren, and Jian Sun. 2016. “用于图像识别的深度残差学习。”2016\
  \ 年 IEEE 视觉与模式识别会议 (CVPR)，6 月。 [`doi.org/10.1109/cvpr.2016.90`](https://doi.org/10.1109/cvpr.2016.90).\n\
  -   [23] Simonyan, Karen, and Andrew Zisserman. 2014. “用于大规模图像识别的深层卷积网络。《arXiv.Org](http://arXiv.org),9\
  \ 月 4 日. [`arxiv.org/abs/1409.1556`](https://arxiv.org/abs/1409.1556).\n-   [24]\
  \ Simonyan, Karen, and Andrew Zisserman. 2014. “用于大规模图像识别的深层卷积网络新生 arXiv.Org](http://arXiv.org),9\
  \ 月 4 日. [`arxiv.org/abs/1409.1556v6`](https://arxiv.org/abs/1409.1556v6).\n\n#\
  \ 7 基于人工智能的类风性关节炎检测\n\nR.K. Ahalya, Riya Singh, and Snekhalatha [10.1201/97810033370](https://doi.org/10.1201/97810033370)\n\
  \n## 7.1 引言\n\n类风性关节炎（RA）是一种进展性炎症疾病，影响手部、腕部和膝关节，其中掌指指关节（MCP）和近端指间关节（PIP）受影响最为常见。全球\
  \ RA 的患病率为每十万 460 人，95%预测区间在 0.06%到 1.27%之间 1。印度 RA 的患病率占总人口的 0.28%到 0.7%2。\n\n\
  RA 的特征是软组织炎症、关节腔狭窄（JSN）、骨侵蚀、脱位和关节骨质疏松。RA 引起的滑膜炎症会破坏软骨、骨下骨和软组织。骨下炎症会导致囊肿及随后的侵蚀。\n\
  \n\n\n\n如前所述，传统的放射检查是诊断类湿性关节炎（RA）的金标准[6]。用于评估 RA 结构性损伤的人工方法包括骨侵蚀的视觉评分、`JSW` 和 `JSN`。关节中这些细微的变化很难通过人工评估\
  \ X 光片来识别。因此，研究人员开发了利用各种 `AI` 方法检测 RA 的自动化方法。`AI` 是一项不可或缺的技术，它利用计算机辅助算法来分析复杂的临床数据。它在影像诊断中起着至关重要的作用，并在广泛的医疗数据中建立和微调模型性能方面正受到日益越来越多的关注[7]]。\n\
  \nRA 是一种影响全球约 0.5% 至 1% 人口的慢性自身免疫性疾病。RA 的早期和准确诊断对于防止长期关节损伤、改善患者预后以及减轻该疾病的社会负担至关重要。传统的诊断方法如放射线、超声声和\
  \ `MRI` 被广泛用于评估关节损伤，但通常依赖主观评估，使其难以检测早期 RA 的细微变化。`AI` 在医疗领域的出现引入了变革性技术，使诊断过程自动化并提高了诊断准确性。`机器学习`（`ML`）是\
  \ `AI` 的子集，允许计算机在没有显式编程的情况下学习复杂数据。`ML` 的一个分支是`深度学习`（`DL`），它利用多层人工神经网络从数据集中提取高层特征[8]。放射学领域的科学家已有效利用\
  \ `AI` 检测肉眼难以察觉的异常。放射学正在从一种主观的感知技能转变为一种更具经验的现实。图 7.1 展示了 `AI`、`ML` 和 `DL` 之间的关系。\n\
  \n![图 7.1 AI、ML 和 DL 之间的关系。](img/fig7_1.jpg)\n\n图 7.1 `AI`、`ML` 和 `DL` 之间的关系。\n\n\
  本章对评估 RA 进行了全面综述，并探讨了各种 `ML` 和 `DL` 图像分割、特征提取和分类技术。早期，`ML` 中使用手工特征来检测 RA，但由于人工方法既繁琐又耗时，自动化特征提取已成为更优选择。最近，计算机辅助诊断被用于基于分割和\
  \ `ML` 分类器来评估 RA。基于预训练模型的`卷积神经网络`（`CNNs`）等 `DL` 方法在 `ML` 算法之前已被采用用于 RA 图像和正常图像的自动化特征提取和分类。`ML`\
  \ 和 `DL` 用于 RA 的工作对比如图 7.2 所示。\n\n![图 7.2 RA 图像处理中机器学习与深度学习的对比。](img/fig7_2.jpg)\n\
  \n图 7.2 RA 图像处理中机器学习与深度学习的对比。\n\n本章的目标是总结利用 `ML` 和 `DL` 方法检测手部 X 光和超声图像中 RA 的各种分割算法和特征提取技术，并探索用于\
  \ RA 自动诊断的各种预训练 `CNN` 架构。\n\n## 7.2 材料与方法\n\n### 7.2.1 图像分割\n\n#### 7.2.1.1 图卷积网络\n\
  \n`图卷积网络`（`GCN`）是一种最近基于半监督学习的图像分割方法；它是 `CNN` 的一种形式，直接作用于图，其主要功能是解决图中节点分类的问题；对于每个节点，特征信息取自其邻居和特征本身。然后对所有节点应用平均函数，并将这些值输入神经网络[9,\
  \ 10]]。放射学科学家已有效利用 AI 检测肉眼难以看到的异常。图 7.3 展示了 `GCN` 的典型示例。\n\n![图 7.3 GCN 的典型示例。](img/fig7_3.jpg)\n\
  \n图 7.3 GCN 的典型示例。\n\n作者[11]–13]使用了 `GCN` 来分割第二、第三和第四指节骨。通过学习边界生成过程，作者使用了基于 `GCN`\
  \ 的轮廓变换网络（CTN）来分割感兴趣区域（ROI）。`CTN` 从输入图像获取标记图像并拟合边界。在他们的研究中，作者只分割了骨骨；然而，RA 也会影响指间关节。因此，如果他们包含了两个关节，他们开发的模型性能将得到增强。\n\
  \n#### 7.2.1.2 基于区域的轮廓分割\n\n基于区域的模型对初始轮廓的敏感性较低。这些方法利用图像的整体信息，而不是关注其局部梯度。这允许通过最小化来优化全局分割。在[14]，作者从超声图像中提取了掌指关节的腱。图像中的活动轮廓由一系列分布的\
  \ `N` 维点组成。他们通过对点应用插值函数重建了完整的腱。RA 主要影响指间关节和掌指关节；然而，仅用腱来定量 RA 面着巨大挑战。\n\n#### 7.2.1.3\
  \ 多尺度梯度流蛇\n\n蛇算法（Snake）是一种用于表示单个对象边界活动轮廓方法；它无法描述多个对象的边界[15]。Chenyang 等人展示了一种改进的蛇，即梯度流（GVF）[16]]。在\
  \ `GVF` 方法中，如果图像中存在多个对象且蛇位于两个对象之间，则 `GVF` 将拉蛇以包含两个对象的边缘。梯度受到噪声的影响，会将蛇覆盖边界。\n\n然而，`GVF`\
  \ 具有依赖边缘图的缺点。为了克服这一缺点，引入了多尺度梯度流（`MSGVF`），并使用不同的尺度方法修正边缘图，通过渗透梯度来更有效地处理噪声。作者[17]对手部\
  \ X 光片进行分割以获取指骨。指骨区域最初使用轮廓追踪和直方图进行分割。分割后的指骨区域包含噪声和残留软组织；因此，使用 `MSGVF` 蛇算法执行最终分割。他们的方法包括在已分割的区域周围设置采样点，对其进行平滑，然后从平滑图像计算\
  \ `MSGVF`。然后他们使用蛇算法从图像中获取新的采样点。控制点利用新的采样点确定，点之间的曲线通过插入采用 `B 样条` 方法产生，在此之前已使用 `MSGVF`\
  \ 进行分割。\n\n#### 7.2.1.4 高斯尺度空间\n\n\n\n\n尺度空间\n尺度空间将图像表示为一组平滑图像，用于管理不同尺度下的图像结构。用于适应细微结构的平滑内核的大小定义了尺度空间表示。尺度空间的主要类型之一是线性（高斯）尺度空间，这是一种基于区域的分割方法。Yang\
  \ 等人利用高斯尺度空间对超声图像中的滑膜增厚、骨侵蚀和 MCP 关节进行了分割 `[18]`。在超声图像中，滑膜增厚和骨侵蚀区域呈暗，而 MCP 关节呈亮；使用传统的阈值法分割暗区域无法获得准确的结果。因此，高斯尺度空间能更好地从手部超声图像中分割出\
  \ MCP 关节。作者将滑膜增厚骨侵蚀作为 ROI，将其转换为高斯空间。\n\n### 7.2.1.5 U-Net 架构\n\n最近用于医学图像分割的深度学习架构之一是\
  \ `U-Net` 模型。该架构在医学影像中被广泛采用，由收缩路径（左侧）和扩张路径（右侧）组成 `[19]`。收缩路径包含卷积核为 `3 × 3` 的卷积层，每个层后都跟着一个整流线性单元（`ReLU`）激活函数和一个滤波器大小为\
  \ `2 × 2` 步长为 `2` 的最大池化层。扩张路径由一个 `2 × 2` 卷积层和两个 `3 × 3` 卷积层组成，每个层后都有一个 `ReLU`。最后一层是\
  \ `1 × 1` 卷积，将特征转换为相关的类别。\n\n在 `[20]` 中，作者应用 `U-Net` 架构消除手部 X 光片中的背景组织，选择了 296 个手部掩码进行背景移除。他们使用\
  \ `Adam` 优化器训练 `U-Net` 模型，学习率为设置为 `0.0001`，批量大小为 `16`，迭代了 `200` 个 epoch。另一项研究的作者利用\
  \ `U-Net` 架构分割手部超声图像中的 MCP 关节关节囊 `[21]`。该模型的一个挑战是需要为每个对应的输入图像生成掩码，这在为实时采集的图像创建掩码时可能非常繁琐。\n\
  \n### 7.2.2 特征提取\n\n#### 7.2.2.1 灰度共生矩阵\n\n灰度共生矩阵（`GLCM`）是一种基于纹理的特征提取技术。它表示了参考像素与相邻像素之间的空间关系。`GLCM`\
  \ 决定了不同灰度组合在图像中出现的频率，并从矩阵中提取特征。Yang 等人利用 `GLCM` 提取了 MCP 指关节的特征。在他们的研究中，对于每个 `ROI`，他们取了单像素的范围和四个方向：`0°`、`45°`、`90°`\
  \ 和 `135°` `[18]`。他们获得了具有四个方向 `GLCM` 的每个 `ROI`，并为每个 `GLCM` 提取了二十二个特征。然而，从每幅图像中手工提取\
  \ `GLCM` 特征非常繁琐。\n\n#### 7.2.2.2 局部二值模式\n\n局部二值模式（`LBP`）是一种纹理特征提取方法，通过对邻接像素进行阈值处理并将结果视为二进制数来标记图像中的像素\
  \ `[22]`。`LBP` 考虑像素值（中心像素）及其八个邻域。Subramonia 等人展示了基于 `LBP` 的特征提取用于检测类湿性关节炎（RA） `[23]`。作者使用提取的特征建立了两个数据库。他们使用\
  \ `LBP` 调整了输入图像的大小并手动裁剪了 `200 × 200` 的 `ROI`。从中提取了基于直方图 `LBP` 特征。\n\n#### 7.2.2.3\
  \ 方向梯度直方图\n\n方向梯度直方图（`HoG`）通常用于捕捉输入图像中对象的结构或形状 `[24]`。它通过分析图像边界的梯度和方向提供边缘信息。`HoG`\
  \ 根据像素值的梯度和方向构建直方图。梯度代表了 `x` 和 `y` 方向上的细微变化。Morita 等人利用 `HoG` 识别了手部 X 光片中的 MCP、`PIP`\
  \ 和远端指间关节（`DIP`） `[25]`。作者使用 `HoG` 提取了指关节的近似形状，并将这些特征输入 RA 分类器。\n\n### 7.2.3 ML\
  \ 技术\n\n#### 7.2.3.1 支持向量机\n\n支持向量机（`SVM`）是一种利用标记数据训练机器的监督学习形式 `[26]`。`SVM` 旨在寻找一个分类最好的超平面；通过迭代生成超平面以最小化误差。间隔是向量与超平面之间的距离，支持向量点是超平面附近的点。\n\
  \nMorita 等人使用双分类 `SVM` 分类器对手部 X 光片中的 RA 和正常患者进行了分类。作者获得了从 `100 × 100` 像素手部 X 光片中分割出的图像块。\n\
  \n#### 7.2.3.2 决策树\n\n监督学习包含了决策树，用于分类和回归 `[27]`。当特征值为离散值时应用分类树，而回归树适用于连续的目标值。决策树由两种节点组成：决策节点和叶子节点。\n\
  \n\n\n\n该算法在每一步中经常将特征划分（二分）为两个或多个类别；因此它被命名为迭代二分器 3（Iterative Dichotomiser33）。Ross\
  \ Quinlan 发明了 ID3；他利用自顶向下的贪心方法来开发决策树。ID3 的工作原理是从顶端开始构建树，而贪心方法意味着根据每次迭代获得的信息来选择最佳特征。ID3\
  \ 选择信息增益最大的特征作为最佳特征。Shanmugham 等人通过将粒子群优化（PSO）与 ID3 ，构造了一种改进类湿性关节炎（RA）分类的新方法 [28]。作者将\
  \ PSO 提取的特征输入到 `ID3` 分类器中。`ID3` 中获得的信息对属性进行增益排序，并识别出预测 RA 的关键特征。\n\n### 7.2.3.4\
  \ Adaboost\n\nAdaboost 是一种自适应提升机器学习算法，其中提升法被用作一种集成方法 [29]。提升法是一种监督学习技术，根据学习器的渐进增长来降低偏差和方差；除了第一个学习器外，每个后续学习器都是从前一个学习器增长的。随机森林算法使用了大量的树（`n`）。它将有一个起始节点和若干叶子节点。Adaboost\
  \ 算法创建一个桩（stump），即只有两个叶子节点的节点。这些桩是慢学习器，受益于提升技术。\n\nLangs 等人使用 Adaboost 自动量化了 RA\
  \ 相关的关节间隙（JSN）和侵蚀，以检测骨侵蚀和非侵蚀。他们使用主动形状模型从手部 X 光中提取骨轮廓，并将其输入分类器。分类器的弱学习器基于提取的特征进行训练。输入是从单个块中提取的特征，输出被标记为非侵蚀或侵蚀\
  \ [30]。\n\n### 7.2.4 DL TECHNIQUES\n\nCNN 是深度架构的一种，利用卷积层而不是仅仅依赖于全连接层 [31]。CNN 在时间感受场内结合权重，Waibel\
  \ 等人提出了使用这些网络进行语音识别的反向传播方法 [32]。CNN 的输出是输入数据的过滤表示，随后通过 `ReLU` 激活函数进行处理。激活函数的结果随后发送到池化层，池化层对输入进行下采样。CNN\
  \ 由多个池化层组成。最大池化层在指定的滤波器范围内选择最大值；平均池化层计算给定滤波器范围内元素的平均值；全局池化层则将特征图中的每个通道减少为单个值。池化层的输出随后指向全连接层，该层将池化输出展平为单个向量。最后一层是一个名为\
  \ `SoftMax` 的激活函数，它根据生成的概率值将输出分为不同的类别。CNN 涵盖了一系列不同的架构，我们将在后续章节中详细讨论。\n\n### 7.2.4.1\
  \ LeNet\n\nLeNet-5 模型由三个卷积层、两个池化层和两个全连接层组成。每个卷积层和全连接（FC）层通常都跟着 `tanh` 激活函数，最后一个\
  \ FC 层外，之后是 `SoftMax` 激活函数，用于对来自 ImageNet 数据集的十个输出进行分类。`SoftMax` 根据概率值对输出进行分类。图\
  \ 7.4 展示了用于 RA 检测的通用 LeNet 架构，其中原始具有十个内核的 FC 层被修改为使用两个内核来区分 RA 患者和正常参与者。\n\n![FIGURE\
  \ 7.4 用于 RA 分类的通用 LeNet 架构。](img/fig7_4.jpg)\n\nFIGURE 7.4 用于 RA 分类的通用 LeNet 架构。\n\
  \nLee 等人应用 LeNet-5 识别关节，包含五层：两个卷积层、两个采样层和一个全连接层 [33]。作者从手指关节 X 光图中提取大小为 28 × 28\
  \ 像素的子块图像。这些块通过 5 × 5 滤波器进行卷积，在第一层卷积层产生六个特征图。随后，这六个特征图使用平均方法进行处理并输入下采样层（`S1`），该层将其尺寸缩小了一半。随后的层是卷积层（`C2`），带有\
  \ 5 × 5 滤波器，生成十二个特征图。`C2` 通过 2 × 2 平均池化层连接到 `S2`。最后一层是一个具有 192 个神经元的 FC 层，它展平来自下采样层的输入，合并输出神经元以产生概率，指示输入图像对应正常关节还是受\
  \ RA 影响的关节。\n\nBetancourt 等开发了一种改进的 LeNet 架构，用于区分手部 X 光中的正常受试者和 RA 患者 [34]。作者将 X\
  \ 光片调整为 256 × 204 像素，并通过增加特征图的数量修改了 LeNet 以提高结果。这种修订架构包含了更多的特征图，并在卷积层使用了 3 × 3 的内核大小，取代了原始的\
  \ 5 × 5 大。此外，他们将激活函数从 `tanh` 切换到 `ReLU` 并输出函数修改为 `SoftMax`。FC 层的神经元数量也有增加。为了减轻过拟合，他们在最大池化之后、输出层之前应用了\
  \ `dropout` 函数。全连接层 `FC1` 和 `FC2` 每个包含 256 个神经元，以展平来自池化层的输出。\n\n### 7.2.4.2 AlexNet\n\
  \nAlexNet 由五个卷积层、三个池化层、两个归一化层和三个 FC 层组成 [35]。在这种架构中，`ReLU` 应用于所有卷积层和两个 FC 层之后。最后一个\
  \ FC 层利用 `SoftMax` 进行输出。图 7.5 展示了用于 RA 分类的通用 AlexNet 架构。Ureten 等人使用了 AlexNet、GoogLeNet\
  \ 和 VGG19 采用了迁移学习方法 [36]。他们调整了原始 AlexNet，将深度调整为 8，总层数调整为 25，内核大小调整为 96。他们使用了步长为\
  \ 4 的 11 × 11 内核。这种修改后的架构随后用于分类正常和受影响的受试者。\n\n![FIGURE 7.5 用于 RA 分类的通用 AlexNet 架构。](img/fig7_5.jpg)\n\
  \nFIGURE 7.5 用于 RA 分类的通用 AlexNet 架构。\n\n### 7.2.4.3 GoogLeNet\n\nGoogLeNet 也称为 Inception\
  \ V1，结构由 22 层组成，包括 9 个 inception 模块 [37]。它具有两个内核为 7 × 7（`C1`）和 3 × 3（`C2`）的卷积层、四个\
  \ 3 × 3 最大池化层、一个 7 × 7 平均池化层以及采用 `SoftMax` 的 FC 层。图 7.6 是 inception 模块的框图，强调了降维。图\
  \ 7.7 展示了针对 RA 分类简化的 GoogLeNet 版本。\n\n![FIGURE 7.6 带有降维的 inception 模块。](img/fig7_6.jpg)\n\
  \nFIGURE 7.6 带有降维的 inception 模块。\n\n![FIGURE 7.7 用于 RA 分类的简化的 GoogLeNet 架构。](img/fig7_7.jpg)\n\
  \n\n\n\n\n# 图 7.7 (Ch07.xhtml#bck_fig7_7) 用于 RA 分类的简化的 GoogLeNet 架构。\n\nPeng 等人（2024）[38]\
  \ 利用 22 层的 GoogLeNet (Inception V1) 架构进行 RA 分类。该架构具有并行结构，包含一个 `1 × 1` 卷积层、`3 × 3`\
  \ 卷积层、`5 × 5` 卷积层和一个 `3 × 3` 最大池化层，它们共同组 inception 模块。`1 × 1` 卷积层置于卷积层之前和最大池化层之后，以减少输入数据的维度。GoogLeNet\
  \ 最初在 ImageNet 上上进行训练，随后使用可用的 MCP 和 PIP 数据集进行微调。在创建微调模型时，作者除了 `FC` 层外，对所有层都复制了预训练模型的权重。在微调网络的训练和分类阶段，作者使用随机权重对其进行了初始化。\n\
  \nUreten 等人使用了深度为 22 层和 144 层的 GooLeNet 进行迁移学习。他们研究中使用的滤波器大小为 `7 × 7`，步长为 `1`，丢弃率为\
  \ 50%，并使用 ReLU 作为激活函数。最后，他们使用自定义架构从手部放射影像对正常和 RA 受者进行分类，并获得了 73.33% 的准确率 [36]。Tang\
  \ 等人修改了 GoogLeNet 模型以通过手部超声检测正常和 RA；他们使用自己的 MCP 和 PIP 数据集对模型进行微调，并从架构中复制了每层的权重。作者将最后一个\
  \ `FC` 层中 1000 个图像的输出更改为正常和 RA，并将训练 GooLeNet 模型的学习率从 `0.01` 更改为 `0.001`。最后，修改后的模型可以检测正常与\
  \ RA [39]。\n\n### 7.2.4.4 VGG16 和 VGG19\n\nVGG（视觉几何组）设计仅使用 `3 × 3` 卷积层，数字对应网络中的层数。卷积、最大池化和\
  \ `FC` 层构成了 VGG 架构。两个 `FC` 层各有 4096 个节点，之前是 ReLU。最后一个 `FC` 层有 1000 个节点，并使用 SoftMax\
  \ 对来自 ImageNet 数据集的 1000 张图像进行分类。图 7.8 显示了 VGG 架构的一个示例。在 VGG19 中，Ureten 等人使用了深度为\
  \ 19 层和 47 的迁移学习方法。作者使用 64 个 `3 × 3` 滤波器和步长为 `1` 对正常和 RA 患者进行分类 [36]。利用 VGG16 从多普勒超声图像中提取并分类\
  \ RA。作者提取最后一个卷积层的信息并将其作为输入发送逻辑回归分类器 [40]。\n\n![图 7.8 用于 RA 分类的通用 VGG 架构。](img/fig7_8.jpg)\n\
  \n# 图 7.8 (Ch07.xhtml#bck_fig7_8) 用于 RA 分类的通用 VGG 架构。\n\n### 7.2.4.5 网络中网络 (Network\
  \ in Network)\n\n传统的卷积层使用线性滤波器和非线性激活函数，但在网络中网络架构（图 7.9）中，增加了具有复杂结构的微神经网络 [41]。微神经网络使用多层感知器，类似于\
  \ CNN，通过在输入上滑动获取特征图。\n\n![图 7.9 用于 RA 分类的网络中网络架构。](img/fig7_9)\n\n# 图 7.9 (Ch07.xhtml#bck_fig7_9)\
  \ 用于 RA 分类的网络中网络架构。\n\nBetancourt 等人使用了网络中网络从手部放射影像估计 RA [34]。作者对每个卷积层使用了 ReLU。网络中网络架构包含了尺寸为\
  \ `5 × 5` 的 32 个卷积层，C1、C2、C3 卷积层为 1 步长。C4、C5、C6 卷积层使用了 64 个 `3 × 3` 滤波器，步长为 1。C7\
  \ 使用了尺寸为 2 的最大池化层，丢弃率为 0.1。最后层是全局池化层，提供了正常和 RA 的概率。\n\n### 7.2.4.6 SqueezeNet\n\n\
  SqueezeNet (图 7.10) 是一种通过利用 `1 × 1` 卷积压缩模块来减少参数的卷积神经网络 [42]。Betancourt 等人通过将影像调整为\
  \ 256 × 256 增强了 SqueezeNet。初始卷积层使用了 64 个 `3 × 3` 滤波器，步长为 1。随后是具有步长为 2 的 `3 × 3`\
  \ 最大池化层，丢弃率为 0.1。接下来的两个层由压缩模块，压缩值为 16，扩展值为 4。之后是另一个相同尺寸、步长和丢弃率为 0.1 的最大池化层。随后的两个层由压缩模块组成，压缩值为\
  \ 32，扩展值为 128。四层为压缩模块，压缩值为 48；前两个的扩展值为 192，后两个为 256。\n\n![图 7.10 用于 RA 分类的 SqueezeNet\
  \ 架构。](img/fig7_10.jpg)\n\n# 图 7.10 (Ch07.xhtml#bck_fig7_10) 用于 RA 分类的 SqueezeNet\
  \ 架构。\n\n第二个卷积层使用了两个 `1 × 1` 滤波器，步长为 1 并应用 ReLU。最后层是全局池化层，使用 SoftMax 将受者分类为正常或受\
  \ RA 影响 [34]。\n\n### 7.2.4.7 ResNet\n\nResNet（残差网络）具有 152 层并利用跳跃连接来降低复杂度。它的层数是 GoogLeNet\
  \ 设计的六倍，尽管它并不复杂。架构有五个卷积阶段、一个最大池化层、一个平均池化层和全连接层。SoftMax 通过其 `FC` 层和激活机制对 ImageNet\
  \ 数据库中的千张图像进行分类，并使用二分类器区分正常和 RA 者。图 7.11 显示了简化的 ResNet 架构。\n\n![图 7.11 简化的 ResNet\
  \ 架构。](img/fig7_11.jpg)\n\n# 图 7.11 (Ch07.xhtml#bck_fig7_11) 简化的 ResNet 架构。\n\n\n\
  \n\n在不断演变的医学影像领域，`CNNs` 与 `transformers` 的融合已成为一种突破性方法，特别是在 `RA`（类风湿性关节炎）等复杂疾病的检测中。`transformers`\
  \ 最初用于自然语言处理任务，现在大胆迈入计算机视觉领域，通过视觉变换器（`ViT`）展现了其强大之处。这种创新架构已被证明是图像分类领域的规则改变者，它利用了自注意力机制的力量，以无与伦比的精确度捕捉捕捉全局和局部特征。与主要关注局部模式的传统\
  \ `CNNs`不同，`ViT` 具有识别整幅图像中错复杂关系的卓越能力。\n\n最近的研究揭示了 `CNN-transformer` 混合模型在 `RA` 检测中的巨大潜力。这些模型擅长利用这两种架构的优势：`CNNs`\
  \ 擅长识别关节结构、骨质侵蚀和细微的放射学变化等局部特征，而 `transformers` 则能够熟练地捕捉连接远端关节和其他影响 `RA` 诊断的关键特征的长程依赖关系。\n\
  \nChen 等人的一项开创性研究 [43] 揭了混合 `CNN-transformer` 模型的能力，证明了其在手部 X 光片中分类 `RA` 的卓越能力。这种混合架构巧妙地利用\
  \ `CNN` 层进行精细的特征提取，并结合 `transformers` 分析关节间的关系，实现了 94.7% 的惊人准确率。此类结果强调了医学影像分析的范式转变，即将\
  \ `CNNs` 与 `transformers` 结合不仅提升了分类性能，还使临床医生能够基于对局部和全局模式的全面理解，做出更明智的诊断。在这一引人入胜的叙述中，Tang\
  \ 等人 [44] 展示了一种 `ViT-CNN 混合模型`，其在检测超声图像中的关节异常方面表现出色，达到了 96.2% 的卓越准确率。这种令人印象的性能凸显了基于\
  \ transformer 的架构尚未被开发的潜力，开启了诊断能力的新纪元，能够显著影响 `RA` 患者的预后。\n\n### 7.2.4 量子计算：医学诊断的未来\n\
  \n当医疗保健行业处于技术革命的边缘时，量子计算正准备重新定义医学影像和疾病检测的边界。尽管量子计算在医疗领域仍处于起步阶段，但其前景是不可否认的，特别是在处理与大型数据集和高维数据相关的复杂性时，这些数据往往会让传统计算系统力不从心。量子神经网络（`QNNs`）作为计算力量的最前沿，它们以量子速度运行，可以大幅缩短大量医学数据集的分析时间，例如对于\
  \ `RA` 检测至关重要的 X 光和超声图像。\n\n在 `RA` 领域，量子机器学习正在作为一种增强诊断精度的有力工具。Mishra 等人 [45] 通过其量子增强型\
  \ `CNN 模型` 用于从手部 X 光片中检测 `RA`，开创了这一前沿。他们的模型利用一种突破性的量子反向传播算法来增强特征提取，实现了 97.8% 的极准确率，同时与传统的\
  \ `CNN models` 相比显著缩短了计算时间。这种范式转变不仅增强了诊断能力，还为该领域的未来创新立下了先例。\n\n此外，Huang 等人 [46]\
  \ 通过应用量子 `SVM` 对超声图像中的 `RA` 进行分类，进入了未知领域。他们的创新方法利用量子算法的独特优势来有效处理高维数据，最终实现了 95.3%\
  \ 的卓越准确率。这一成就强调了量子计算在速度和准确性方面优于传统的 `SVMs`，为将量子计算整合到医疗保健中提供了引有力的案例。虽然医疗领域的量子计算仍是一个新兴领域，但这些突破性研究标志着诊断和治疗如\
  \ `RA` 等复杂疾病状况的方式发生了转型转变。其影响是深远的，预示着未来 `QNNs` 和 `QSVMs` 不仅将提高诊断准确性，还将彻底改变患者护理的方法。\n\
  \n### 7.3 结果与讨论\n\n本回顾比较了使用自动 `ML`（机器学习）和 `DL`（深度学习）技术通过放射检查和超声检查两种 `RA` 诊断模式来区分\
  \ `RA` 患者。我们比较了在手部 X 光片和超声图像上进行的基于区域的主轮廓分割结果。标记了 `PIP`（近端指间关节）和 `MCP`（掌指关节）关节的 `ROI`，并对关节进行了分割。基于区域的主轮廓从超声图中分割了\
  \ `MCP` 关节、关节囊和指骨（图 16.12）。\n\n在本章中，我们回顾了包含用于 `AI` 检测 `RA` 的发表文献。自动 `AI` 检测将帮助医生在手部\
  \ X 光片和超声图中识别 `RA`。我们证明了 `AI` 在识别、分类和诊断 `RA` 患者方面起着至关重要的作用。我们概述了通过分割、特征提取和分类策略进行\
  \ `RA` 评估的方法。深度学习是目前应用最广泛的方法之一。它不需要预处理或手工特征提取，而这些在机器学习算法中很常见。许多研究已将 `DL` 视为自动检测\
  \ `RA` 的卓越方法。\n\nTan 等人构建了一个自动为手部和足部 X 光关节破坏评分的模型 [20]。作者使用 `U-Net` 分割关节并使用 `YOLOv3`\
  \ 算法进行关节识别。他们使用 `VGG16` 模型将关节分为四类：狭窄手关节、狭窄足关节、手骨侵蚀和足骨侵蚀。他们在狭窄手上获得了最高的测试准确率 97.3%\
  \ 和平衡准确率 82.07%。Yun-Ju 等人使用 `ResNet18` 和 `ResNet50` 分析了手部 X 光图像中 `RA` 的早期检测。他们分别为\
  \ `DeepTEN` 和 `ResNet50` 获得了 0.69 和 0.73 的 AUC。使用 `DeepTEN` 模型分类 `RA` 的正预测值为 64%，`ResNet50`\
  \ 为 67% [11]。\n\nAndersen 等人提出 `VGG16` 和 `Inception V3` 模型对多普勒超声图像中的 `RA` 进行自动评分\
  \ [40]。作者将所提模型的准确率、敏感性和特异性与专家医生进行了比较，得到了 86.4%。Wu 等人（2022 年）[47] 开发了一种自动方法，用于检测超声图中由于\
  \ `RA` 引起的 `MCP` 关节破坏。作者使用 `DenseNet` 进行分类，并在正常和破坏的 `MCP` 关节上获得了 95% 的准确率。表 7.1\
  \ 展示了用于检测 `RA` 的各种 `ML` 和 `DL` 算法。观察发现，Shiezadeh 等人比较了多种模型，发现混合杂鸟搜索 + 提升分类器提供了最佳准确率。Betancourt\
  \ 等人研究了 `LeNet`、网络中网络和 `SqueezeNet`，发现 `SqueezeNet` 模型达到了 100% 的准确率。Rohrbach 等人、Ureten\
  \ 等人和 Toru 等人开发了定制的 `CNN` 模型来分类正常和 `RA` 受试者。\n\n\n\n\n\n# 图 7.12 使用基于区域的激活轮廓法的手部\
  \ X 光和超声图像分割：(a) 手部 X 光，(b) 分割的手部 X 光，(c) 手部区域超声图像，(d) 分割的手部超声图像。\n\n### 表 7.1 文献中的机器学习和深度学习类湿性关节炎（RA）检测方法\n\
  \n| 作者 [参考文献] || 受者数量 | 使用的方法 | 关键解释 |\n| --- | --- | --- | --- |\n| Shiezadeh 等人\
  \ [48]] | 2564 | ID3, C4.5,j48, KNN, Adaboost, SVM, 决策树 | CSBoost 的准确率最高，达到 85%。\
  \ |\n| Betancourt 等人 [34]] | 92 | LetNet, network in network, SquezeNet | SqueezeNet\
  \ 显示准确率为 100%；其他方法的准确率为 93%。 |\n| Rohrbach 等人 [49]] | 102,265 (图像) | 自定义 CNN | 自定义\
  \ CNN 预测了六类骨侵蚀，验证准确率为 67.5%。 |\n| Ureten 等人 [36]] | 135: 61 正常, 74 RA | 自定义 CNN\
  \ | 准确率 = 73.33% |\n| Hirano 等人 [50]] | 216: 108 RA | Haar 分类器和 CNN | 自定义 CNN 对\
  \ JSN 的准确率在 49.3% 到 65.4% 之间，侵蚀准确率为 70.6%-74.1%。 |\n| Ureten 等人 [51]] | 50 | YOLOv4\
  \ 和 VGG16 | YOLOv4 用于关节手指检测，VGG 16 用于区分 RA 与正常：准确率 = 90.7%。 |\n\n我们在本章中研究的作品作者依赖于各种图像分割、特征提取和分类技术来检测\
  \ RA。对于机器学习分类，已经建立了手工图像分割和特征提取方法；而对于 CNN 分类，则执行了自动化分割和特征提取。此外，我们分析了与医疗保健行业 4.0 不同的文章\
  \ [52–56]]。\n\n我们在现有文献中发现了一些局限性。对于 CNN，应该有大量的标记数据集来对 RA 患者和正常参与者进行分类；在小数据集上训练会导致模型性能过拟合，导致对\
  \ RA 的检测错误。此外，综述中讨论的工作对模型训练使用了更多的 epoch（迭代次数）；此外，大多数工作关注预训练模型，这些模型对于自然图像效果良好。为了解决这个问题，应该探索使用较少\
  \ epoch 和更多图像的自定义模型来检测 RA。\n\n## 7.4 未来范围和方向\n\n人工智能驱动的类湿性关节炎自动检测正处于巨大的进展阶段，并已经确定了几个用于未来探索的关键领域。\n\
  \n### 7.4.1 精准分割的进展\n\n未来的研究人员应优先考虑更复杂的分割方法，例如 `MultiResUNet`、`DenseUNet` 和基于区域的\
  \ CNN，这些方法旨在为复杂的解剖区域产生高保真的分割结果。这些模型具有改进检测受 RA 影响的细微关节结构的潜力，从而增强诊断的敏感性和特异性。此外，结合关节变异性的自适应算法可以提供更针对特定患者的解释，并扩大在异质性临床人群中的适用性。\n\
  \n### 7.4.2 混合 CNN–TRANSFORMER 架构\n\n创建混合架构（例如将 `CNNs` 与 `transformers` 结合）可能会显著改进\
  \ RA 检测。Transformer 的注意力机制非常适合捕捉长程依赖。这种协同作用允许 AI 模型识别局部特征。该领域的研究应对跨成像模态进行系统评估 [57–59]]。\n\
  \n### 7.4.3 量子计算在医学影像中的应用\n\n量子计算在医学影像中呈现了一个新的前沿，特别是对于高维数据集。初步研究表明，量子模型在识别经典计算方法难以识别特征方面具有优势。实施量子神经网络和量子\
  \ `SVMs` 具有指数级增加计算效率的潜力。\n\n### 7.4.4 迁移学习与领域特定模型开发\n\n虽然从自然图像迁移学习是有益的，但未来的研究人员应该探索针对特定领域进行预训练。结合\
  \ RA 特定影像数据（例如 X 光和超声）的迁移学习策略可以减少对大量标记数据集的依赖，并帮助缓解临床背景的影响。\n\n### 7.4.5 用于临床部署的可扩展云端诊断\n\
  \n转化研究对于将 AI 工具有效集成到现实临床环境中至关重要。能够实时诊断处理的云平台将允许医疗提供人员在不需要本地计算资源的情况下利用 AI 诊断。未来的研究人员应专注于设计与医院系统集成的安全的云架构，为将\
  \ AI 诊断纳入常规实践提供实用路径。\n\n### 7.4.6 扩展多机构协作数据集\n\n创建来自多个临床中心的大型标注数据集对于开发泛化 AI 模型至关重要。关注多中心协作将有助于收集各种\
  \ RA 表现，包括疾病严重程度、人口统计因素和影像质量的差异。这种协作方法将支持开发更具包性且能够在各种患者中提供可靠诊断支持的 AI 模型。\n\n###\
  \ 7.4.7 与电子健康记录集成以整体分析\n\n影像数据与电子健康记录的融合为 RA 诊断提供了一个前景。通过将基于影像的分析与长期数据（如遗传标记、病史和实验室结果）相结合，AI\
  \ 模型可以提供更具上下文的见解，实现个性化的风险评估、预后和治疗计划。这一方向与精准医学的整体目标一致，因为它允许 RA 诊断根据个人健康状况提供支持。\n\n\
  ### 7.4.8 用于临床透明度的可解释人工智能\n\n\n\n\n\n可解释人工智能（XAI）方法的进步对于弥合 AI 诊断与临床信任之间的差距至关重要。未来的研究人员应该开发阐明模型决策过程的\
  \ XAI 技术，从而允许临床医生理解类湿性关节炎（RA）分类和分割背后的原理。透明的 AI 算法可以提高临床医生对自动化系统的接受度，促进跨学科协作，并根据医生的反馈完善诊断方案。这些研究方向中的每一个都代表了\
  \ AI 用于 RA 诊断演化的关键组成部分。追求这些进展可能会实现一个更全面、更精确且与临床集成的 AI 系统，最终有助于改善患者预后并加速风湿病诊断的转型。\n\
  \n## 7.5 结论\n\n对于临床医生来说，对 X 光和超声波进行视觉评分是枯燥且耗时的。今天，计算机辅助诊断方法消除了这些困难。`CNNs` 在评估 RA\
  \ 时不需要复杂的人工特征提取技术。根据文献，预训练的 `CNN` 模型（如 `LeNet` (98.02%)）在通过手部 X 光评估 RA 方面优于其他的机器学习（ML）和深度学习（DL）方法。对于手部超声图像中的\
  \ RA 诊断，`GoogLeNet` `CNN` 模型提供了其他分类技术更高的准确率。\n\n基于深度学习的图像分割方法（如 `GCN` 和 `U-Net`）比文献中讨论的其他方法更准确地分割手部\
  \ X 光中的指关节感兴趣区域（ROI）。在本章中，我们涵盖了用于检测 RA 的图像分割方法和特征提取算法。我们回顾了文献中 ML 和 DL 技术在手部 X 光和超声图像诊断\
  \ RA 应用。我们还讨论了各种预训练 `CNN` 模型和迁移学习方法，这些方法可以帮助医生在医疗 4.0 中自动检测 RA。\n\n## 参考文献\n\n-\
