  \ (4K 上下窗口) | $1.50/每百万个 tokens | $2.00/每百万个 tokens |\n\n### 10.2.4 翻译\n\n英语是医疗行业的通用语言。作为标准做法，报告、诊断、处方和其他所有医疗文件都用英语编写。然而，世界上很大甚至大部分人口并不懂英语。目前有多种云端翻译解决方案可用，如\
  \ `Google Translate`、AWS 上的 `Amazon Translate` 以及 `Microsoft Azure Translator`。然而，脱颖出的解决方案是\
  \ `DeepL Translator` [15]。\n\n`DeepL` 是评分最高的云端翻译工具之一。大多数其他工具使用 `ML` 算法翻译文本，而 `DeepL`\
  \ 使用深度神经网络作为核心机制。它拥有庞大的人工翻译句子和文本片段数据库。让 `DeepL` 脱颖而出的是，其数据库包含了大量的成语和自然语言，使得翻译感觉更具人性化。它非常擅长轻松、准确地翻译长且复杂的句子，这正是我们提出的解决方案的核心目的。`DeepL`\
  \ 还提供了其 `API`，便于通过程序化开发该解决方案。成本极低（表 10.6）。\n\n表 10.6](#Ch10.xhtml#bck_table10_6)\
  \ DeepL API 成本\n\n| 档级 | 限制 | 价格 |\n| --- | --- | --- |\n| 免费 | 每月 500,000 字符 |\
  \ 免费 |\n| --- | --- | --- |\n| 商业 | 无限制 | $5.49/月 + 按需付费 ($25/1,000,000 字符) |\n\n\
  ## 10.3 提议的医患翻译模型\n\n在这里，我们引入了一种拟的医患翻译模型（DPTM），它将使患者能够轻松访问多语言医疗文件。通过 `OCR`，DPTM\
  \ 允许用户上传医疗文档图像，然后高精度的地提取文本。`OCR` 提取的内容通过 `API` 由 `OpenAI` 的 `GPT-3.5 Turbo` 进行语义转换。这个巨大的语言模型以人类读者最易理解的方式将文本拆分为片段。这些翻译后的文本进一步通过\
  \ `DeepL` 翻译器 `API` 翻译成目标语言，使用户可以使用其偏好的语言获取信息。作为响应，翻译后的输出将返回给用户，跨语言通信将顺利完成。DPTM\
  \ 可以实现为 Web 或聊天机器人应用程序，与最常用的消息平台（如 `WhatsApp`、`Discord` 或 `Telegram`）兼容，为用户提供更大的灵活性和便利性。图\
  \ 10.1 和 10.2 展示了 DPTM 的架构和工作流，它证明了从文档上传到交付的端到端多语言翻译。这一过程由尖端 AI 工具驱动，旨在消除医疗领域的语言障碍，以便更广泛地获取和有效获得关键医疗信息。\n\
  \n![图 10.1 DPTM 流程图。](img/fig10_1.jpg)\n\n图 10.1](#Ch10.xhtml#bck_fig10_1) DPTM\
  \ 流程图。\n\n![图 10.2 DPTM 机制。](img/fig10_2.jpg)\n\n图 10.2](#Ch10.xhtml#bck_fig10_2)\
  \ DPTM 机制。\n\n## 10.4 结果与讨论\n\n我们提议的 DPTM 旨在通过使用 `LLM` 和 `OCR` 将医疗术语转化为用户友好的语言，让人们更好地理解医疗报告。为了测试该应用程序，我们上传了从处方到诊断报告的各种文档，以评估\
  \ `OCR` 准确率、翻译保真度和用户理解。\n\n跨文档类型，我们的应用程序显示平均 `OCR` 准确率超过 95%，反映了读取打印和手写文档的整体可靠性，但在手写输入上存在少微不一致。该模型流畅且易懂地将医疗术语转化为通用术语。大约\
  \ 90% 的给定医疗术语得到了简化，85% 的参与者发现解码后的解释要清晰得多。`DeepL` `API` 翻译效果良好，目标语言整体得分 92%，增加了语义准确性。\n\
  \n然而，我们在处理区域医疗术语方面确实发现了一些小问题。几乎所有（90%）测试用户都表示满意，报告焦虑感减轻，对医疗报告的信心有所增加。此外，参与者表示愿意频繁使用该应用程序，并向他人推荐。我们实际上从该应用程序中发现了许多好处，例如增加了患者参与度。\n\
  \n## 10.5 结论\n\n\n\n\n通过我们在本章的工作，我们展示了大语言模型（LLMs）与光学字符识别（OCR）在医学领域结合的，弥补了患者与其复杂医疗报告之间的理解鸿沟。正确实施这些技术显示了积极成果，医疗科技合作具有广阔的前景。简化复杂的医学术语有助于人们理解自己的健康状况，减少焦虑、压力、恐慌及类似症状。患者现在可以通过深入研究诊断结果来积极参与健康生活。作为未来发展的一部分，`Med-PaLM`、`PubMed\
  \ GPT`、`DRAGON`、`BioLinkBert`等大模型已经在大量的医疗数据上进行了训练，可以根据患者的症状诊断疾病。此外，`GPT`家族的新版本未来可能会发布，具有更多的训练参数和更高的吞吐量，从而带来更高效、准确的结果。\n\
