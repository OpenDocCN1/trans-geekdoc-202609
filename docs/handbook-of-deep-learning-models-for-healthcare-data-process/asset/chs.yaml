  \ Medica》78, no. 13, 1400–1415.\n\n# 6 彻底改变乳腺癌检测：一种用于乳腺摄影钙化和肿块准确分类的浅神经网络方法\n\nSubhag\
  \ Sharma, Sanjay Sharma 和 Manoj Kumar\n\nDOI: [10.1201/9781003434313](https://doi.org/10.1201/9781003434313)\n\
  \n## 6.1 引言\n\n乳癌是女性死亡的主要原因之一 1。Yoon 和 Kim 在 2 中描述了利用人工智能辅助解读的主要目标如下：1）计算机辅助检测 (CADe)，也称为自动病变检测，重点是识别关注的异常；2）计算机辅助诊断\
  \ (CADx)，对放射科医生或计算机发现的异常进行描述。解读的放射科医生判断发现的变的临床意义以及是否需要进一步研究。Kim 等人在 3 中报告说，CAD 通过标记潜在问题区域作为自动二读运行，\n\
  \n尽管使用深度学习 (DL) 进行图像处理是较新的，但已经发表了大量的研究工作 4–9。早期的研究报告了使用决策树和 SVM 等标准机器学习技术，以及 AdaBoost\
  \ 和 XGBoost 等提升算法 10, 11。后文讨论的研究广泛基于人口统计学、遗传学和其他特征，某些研究提到了乳腺摄影。然而，由于由于召回率高但性能指标低，深度学习的整体应用受到了限制。\n\
  \n\n\n\n\n由于计算和硬件限制，运行 `DL` 模型需要多个 GPU 和大量的 `RAM`，这是许多人无法负担的；通过更改顶层和末层，我们可以使用已经在大型图像数据集上训练过的模型。这些模型包括\
  \ `ResNet50` \\[13\\]，这是一个由微软训练的具有约 150 层的残差网络；`VGG16` \\[14\\]和 `VGG19` \\[15\\\
  ]，同样由微软训练；以及 `AlexNet`。末层可以修改以适应所需的类别数量，进行实时训练，或者直接使用从 ImageNet 等大规模数据集获取的权重。\n\n\
  在本章的第 2 节中，我们回顾了文献；在第 3 和第 4 节中，我们分别讨论了研究方法和结果。我们在第 5 节给出了结论，并在 6 节提出了未来展望。\n\n\
  ## 6.2 文献综述\n\n本章本节详细介绍了研究人员提出的各种利用不同医疗工具早期诊断潜在 AD（腺癌）患者的技术。\n\n### 6.2.1 常见影像视图\n\
  \n乳腺摄影成像有两种主要的视图：头足位（craniocaudal）和内外侧斜位（mediolateral oblique）。在头足位中，图像是从相关乳腺的头部到尾端拍摄的，通常从俯视角度；图\
  \ 6.1a 显示了头足位。内外侧斜位是从胸部中心向外拍摄的，是最投影投影因为它能够描述大部分乳腺组织；图 6.1b 显示了内外侧斜位。\n\n![图 6.1\
  \ A) 头足位。](img/fig6_1a.jpg)\n\n`图 6.1 A)` 头足位。\n\n![图 6.1 B) 内外侧斜位。](img/fig6_1b.jpg)\n\
  \n`图 6.1 B)` 内外侧斜位。\n\n### 6.2.2 密度\n\nBI-RADS（乳腺影像报告与数据系统）根据乳腺密度对乳腺摄影结果分类如下：\n\n\
  *   `BI-RADS 0`: 乳腺摄影不足和/或需要进一步影像检查，需要恢复读取时无法获取的先验图像\n*   `BI-RADS 1`: 无肿块、对称性阴性、无结构变形或异常钙化\n\
  *   `BI-RADS 2`: 几乎全为脂肪性、良性且无癌症\n*   `BI-RADS 3`: 弥散的纤维腺体密度斑块；建议短期监测；恶性概率为 2%\n\
  *   `BI-RADS 4`: 怀疑癌症，密度不均匀。乳腺摄影和超声波识别出此类病例的概率为 2%–94%。`BI-RADS 4` 进一步分为：\n    *\
  \   `BI-RADS 4A`: 2%–9% 恶性风险较低\n    *   `BI-RADS 4B`: 高度怀疑癌症（10%–49%）\n    *   `BI-RADS\
  \ 4C`: 极高癌症风险（50%–94%）；考虑活检\n    *   `BI-RADS 5`: 恶性概率 >95%，密度非常大，强烈提示癌症\n    *\
  \   `BI-RADS 6`: 确认为恶性\n\n## 6.3 使用乳腺摄影的优缺点\n\n乳腺摄影因其易于获取和成本低而成为标准，且使用低功率 X 射线限制了辐射暴露，尽管仍具有敏感性。然而，假阳性召回会导致额外的影像检查或活检，这增加了医疗成本并给患者心理状态带来压力，而假阴性则会延迟检测\
  \ \\[16, 18]]。\n\n## 6.4 研究对比\n\n表 6.1 比较了最新的模型。\n\n| 参考文献 | 数据集 | 使用方法 | AUC |\
  \ 特异性 |\n| :--- | :--- | :--- | :--- | :--- |\n| `1` | `DDSM` | `CNN` | 0.9 | 75%\
  \ |\n| `11` | `CBIS-DDSM` | `ResNet50` | 0.90 | 90% |\n| `17` | `InBreast` | `VGG19`\
  \ | 0.95 | 86% |\n| `19` | `DDSM` | `Ensemble` | 0.72 | - |\n| `20` | `DDSM` | `Dense`\
  \ | 0.7 | - |\n| `21` | `DDSM` | `Transfer Learning` | 0.8 | 73.3% |\n| `22` | `CBIS-DDSM`\
  \ | `AlexNet` | 0.84 | 83% |\n| `22` | `InBreast` | `Xception` | 0.98 | 100% | 97.3%\
  \ |\n\n## 6.5 方法论\n\n### 6.5.1 数据采集\n\n`乳腺摄影数字数据库` (`DDSM`) 是使用最广泛的 \\[16\\]，描述如下：\n\
  \n> 对于 `乳腺摄影数字数据库` (`DDSM`) 中的 620 个实例中的每一个，某些信息是稀缺的。`DDSM 精选乳腺影像子集` 解决了这些问题。\n\n\
  > `DDSM` 标签将图像分类为 `良性肿块`、`良性钙化`、`恶性肿块`或 `恶性钙化`。钙化是钙沉积物，在乳腺摄影图像上显示为白点；它们可以是 `微`或`大`。`微钙化`\
  \ 通常很细且聚集，被认为是癌症的早期迹象，而 `大钙化` 较大且通常是良性的。`肿块` 是三维组织区域，可以是 `良性`或`恶性`。乳腺密度是癌症的重要特征，通过超声、MRI\
  \ 等方法评估。\n\n### 6.5.2 数据预处理与特征选择\n\n下小节描述了过程中使用的各种数据处理技术。\n\n### 数据增强\n通过从现有数据创建额外数据点，数据增强这种方法可以人为增加数据数量。`Huang\
  \ 等人` \\[1\\]告诉读者使用多种数据增强技术，包括间隔 30 度旋转、翻转等；定义的技术使用 `InBreast` 数据集，并将 106 张图像增加到\
  \ 7632 张。\n\n### 归一化\n`Huang 等人` \\[1\\] 使用 `CLAHE` 或对比度限制适应直方图均衡化，放大对比度以减少噪声放大问题。`Kim\
  \ 等人` \\[3\\] 使用像素归一化，在对比度和亮度方面将像素调整到 +1 到 −1 的范围内。\n\n### 划分\n通常，可见预留总数据的 10% 到\
  \ 30% 最大的标准划分用于测试目的 \\[23, 24]]。只有他们使用了外部验证，而其他人预留了训练数据的 10%–20% 用于验证，以避免整体模型过拟合。\n\
  \n#### 重新映射/重标记\n作者提供的标签不兼容，因此通过重新映射现有标签产生了新标签。\n\n#### 数据类型转换\n\n\n\n\n\n原始 `NumPy`\
  \ 数组中的图像数据格式为 16 位，需要缩放到 0 到 1 之间的浮点值，因此我们对图像进行了缩放，这一过程也可以称为图像数据的归一化。\n\n### 6.5.1.3\
  \ 使用的技术\n\n深度学习系统的一个示例——卷积神经网络（CNN）擅长图像的处理和分类。该结构的层包括卷积层、池化层和全连接层。\n\nCNN 的卷积层是最核心的组件，利用过滤器从输入图中提取数据，例如边缘、纹理和形状。卷积层的输出在特征图经过下采样后提供，在降低空间维度的同时保留了最关键的信息。池化层的输出随后被应用于一个或多个全连接层，以对图像进行预测或分类。\n\
  \n模型使用预设的 `TensorFlow` 库和 `Keras` 构建；最终模型由四个堆叠的 2D CNN 以及最大池化层和一个丢弃层（dropout）组成。内核大小是固定的，过滤器尺寸从\
  \ 32 逐渐增加到 128。总可训练参数数为 990,049。使用 Google 的 `Colab` 托管代码，并使用了标准的免费 GPU。连续比较了 `Adam`\
  \ 和 `RMSprop` 两种优化器，并结合了早停策略。持续测试验证集以观察损失值，并将停止条件设置为 80。制作了图表以检查过拟合和准确率的增长。\n\n\
  ## 6.6 结果与分析\n\n最终模型显示的敏感性为 0.87，特异性为 0.84，准确率为 0.81，验证损失为 0.33。初始模型给出了理想的结果，但后续评估明确表明存在过拟合（见\
  \ 表 6.2）。\n\n**表 6.2**](#Ch06.xhtml#bck_table6_2) 初步模型与最终模型的比较\n\n| 迭代次数 (Epochs)\
  \ | 优化器 | CNN 层数 | 最佳验证损失 | 最佳测试准确率 | 特异性 | 敏感性 |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 100 | RMSProp | 3 | 0.44 | 0.75 | 0.80 | 0.72 |\n| 100 | Adam\
  \ | 3 | 0.47 | 0.77 | 0.72 | 0.82 |\n| 100 | RMSProp | 3() | 0.48 | 0.74 | 0.71\
  \ | 0.77 |\n| 100 | Adam | 3() | 0.48 | 0.74 | 0.68 | 0.80 |\n| 500() | RMSProp\
  \ | 4() | 0.33 | 0.81 | 0.84 | 0.87 |\n| 500 | Adam | 4() | 0.53 | 0.75 | 0.66 |\
  \ 0.82 |\n\n另一个初始模型在 `INbreast` 数据集上进行了更深层的训练，并显示出良好的准确率，但混淆矩阵显示出严重的类别不平衡，因此该模型被模型。为了解决过拟合，我们将迭代次数从\
  \ 100 增加到 500，然后通过训练准确率、验证准确率、训练损失和验证损失的图进行了分析。\n\n图表表明，在 100 次迭代时，问题并不十分普遍。然而，为了获得更好的性能指标，优化是必要的。增加迭代次数并引入系统且适当的丢弃层提升了性能。最终分析显示，验证损失和训练损失趋于平缓，在最终迭代次数时达到了理想水平。验证集和训练数据集之间的准确率相似，表明模型在增加迭代次数时表现良好。它成功地避免了过拟合或欠拟合，并实现了令人惊讶的准确率。超过\
  \ 500 次迭代后没有进一步提升，并在某点后开始出现过拟合的迹象。\n\n## 6.7 结论与未来展望\n\n将导管癌的疑似病变分类为良性或恶性是一项困难且计算昂贵的任务，由于专利权限制，难以广泛部署。在更短的时间内使用更少的计算对肿块和钙化进行分类可以减轻医疗系统的压力并减少资源消耗。\n\
  \n放射科医生和肿瘤学家可以使用这种方法验证乳腺检查结果，而无需第二次咨询，这也减轻了医疗资源的负担。存在多种模式，医生可以与计算机辅助系统协作，以实现医生和系统双方更好的验证\
  \ [2]。\n\n所提模型作为三层框架中的第二层，用于区分乳腺检查图像中的钙化和肌肉肿块。然后它将处理后的数据传递到下一层，将感兴趣区域 (`ROI`) 分类为良性或恶性。模型使用了许多参数并需要详细的预处理以产生理想结果。大型模型的第一层留用于\
  \ `ROI` 提取，第二层区分钙化和肿块；第三层将 `ROI` 分类为良性或恶性类别（癌症或非癌症）。\n\n在本章中，我们讨论了使用深度学习设计的各种模型，特别是卷积神经网络，以及优化器和迭代次数等不同模式。我们详细探索了这些方面，以获得最佳组合，并将其整合为最终模型中的层。文献综述中的表格展示了端到端的分析。所提模型还旨在……。所提模型是在特定背景下开发的。\n\
