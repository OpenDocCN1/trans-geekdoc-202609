  图 3.13 用于 AD 分类的 MobileNet 模型 PR 曲线。\n\n![图 3.14 用于 AD 分类的 ResNet 模型 PR 曲线。](img/fig3_14.jpg)\n\
  \n图 3.14 用于 AD 分类的 ResNet 模型 PR 曲线。\n\n### 3.5.4 AD 分类的最终模型性能\n\n`ResNet`、`CNN`\
  \ 和 `MobileNet` 模型在痴呆分类上显示出性能差异。`ResNet` 在所有类别上达到了最高的 92% 准确率，其精确率、召回率和 F1 分分别为\
  \ 0.93、0.90 和 0.91，这表明在不同阈值下可以有效减少假阳性。表 3.3 显示了如下结果：\n\n| 模型 | 准确率 | 精确率 | 召回率 |\
  \ F1 |\n| :--- | :--- | :--- | :--- | :--- |\n| ResNet | 92% | 0.93 | 0.90 | 0.91\
  \ |\n| CNN | 92% | 0.92 | 0.92 | 0.92 |\n| MobileNet | 91% | 0.91 | 0.95 | 0.93\
  \ |\n\n### 3.6 结论\n\n在本章的工作中，我们测试了 `ResNet`、`CNN` 和 `MobileNet` 三种深度学习模型以预测阿尔茨海默症。结果清楚地表明\
  \ `ResNet` 表现良好，在所有类别上达到了 92% 的准确率。相比之下，`CNN` 的整体准确率为 85%，`MobileNet` 的平均准确率为 89%，在资源匮乏的情况下是一个有效选择。这些发现强调了早期诊断中选择正确模型的重要性，因为及时治疗取决于高精度的分类。为了未来的性能，我们建议进行更多的数据增强和参数调优。此外，集成算法可能会进一步提升性能。\n\
  \n这些发现为深度学习在神经退行性疾病领域的积极应用提供了丰富的信息支持。本章提出的研究证据展示了当今的技术如何影响医疗决策。\n\n## 参考文献\n\n*\
