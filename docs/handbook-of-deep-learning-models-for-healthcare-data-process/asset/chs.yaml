  \n图 3.11 用于 AD 分类的 ResNet 模型 ROC 曲线。\n\n### 3.5.3 针对 AD 分类的精确率-召回率曲线分析\n\n在预测阿尔茨海默症的多类分类任务中，精确率-召回率（`PR`）曲线显示了精确率和召回率之间的权衡。PR\
