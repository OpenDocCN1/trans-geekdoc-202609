  \ `M.Tech.` 学位后，在印度希萨尔古鲁·贾姆什瓦尔科学技术大学（Guru Jambheshwar University of Science & Technology）获得先进制造与自动化专业的\
  \ `Ph.D.` 学位。他的研究领域包括生物医学工程、增量板成形、人工智能、可持续材料、机器人与自动化、增材制造、机电一体、智能制造、工业 4.0、工业工程系统、废物管理和优化技术。他在包括\
  \ `SCOPUS`、`Web of Science` 以及 `SCI`索引数据库在内的知名国际期刊和同行评审国际会议上发表了 100 多篇论文。他曾担任会议主席组织多次国内外活动，包括机电与人工智能国际会议\
  \ (`ICMAI-2021`)。他还担任会议主席组织了人工智能、先进材料和机电系统国际会议 (`AIAMMS-2023`)。他拥有 20 多项国内外专利。他曾指导过\
  \ 8 多名 `M.Tech` 和 `Ph.D.` 学生以及众多本科项目/论文；他在教学和研究方面拥有 15 年经验。他曾担任许多知名期刊的客座编辑，并在国际会议/研讨会上担任分主席、专家演讲者和编辑委员会成员。他在职业生涯中获得过多次专业技能奖项，包括优秀表现奖、最佳教师奖等。他还合著或主编了\
  \ 15 多部书籍和论文集。\n\n`Dr. Deepak Dembla` 在过去九年中一直是贾浦 JECRC 大学计算机应用学院院长兼系主任；他还担任实习和认证工作主管。他于\
  \ 2004 年在帕提亚普旁遮比大学（Punjabi University Patiala）获得 `IT` 专业的 `M.Tech.` 学位，并在古鲁·贾姆什瓦尔大学获得\
  \ `MCA` 和 `Ph.D.` 学位。他于 1996 年获得工商管理硕士学位，拥有总计 22 年的经验，专长移动自组织网络、无线网络、软件工程、云计算、`AI`\
  \ 和机器学习。他在国际和国内期刊上发表了 61 篇研究论文，包括享誉国际的 `SCI` 列表期刊，并在 `IEEE`（电气与电子工程师学会）和 `ACM`（计算机学术协会）等会议上发表。他担任多个国际期刊的编辑委员，指导过十余名\
  \ `M.Tech.` 学生，并正积极指导 10 名博士生进行 `Ph.D.` 研究。他与多个专业国际协会（`ACM`、`IEEE`、国际工程师协会、国际计算机科学与信息技术协会等）相关，拥有\
  \ 10 项专利，其中一项在德国获得。\n\n`Dr. Seema Tinker` 是 JECRC 大学数学系的教授，拥有超过 22 年的累计学术经验。她于 2006\
  \ 年从印度贾浦的拉贾斯坦大学（University of Rajasthan）获得数学学博士 `Ph.D.` 学位。她的研究强调涵盖区块链、机器学习、深度学习、流体动力学和相对论的多学科课题。她在尊贵的国际出版物上发表了\
  \ 35 多篇文章，包括被 `Scopus`、`Web of Science` 和 `SCI` 索引的期刊，并在国内外会议上展示了 20 多篇论文。她审阅了多篇来自\
  \ `Web of Science` 和 `Scopus` 的期刊文章。Tinker 博士参加了 23 多场研讨会、教师发展计划和短期课程，包括用于教育的 ICT\
  \ `IIT Bombay 基础课程` 以及 `ATM 研讨会`，并从斯坦福大学（Stanford University）和伦敦帝国学院（Imperial College\
  \ London）等领先机构获得了十项机器学习和深度学习的认证。她编写了三本书，并在机器学习和深度学习主题上拥有五项专利，其中一项已在德国授权。她的投入和能力通过多个奖项获得认可，包括尊贵的“最佳教师奖”和“卓越证书”。此外，她被任命为国家数学中心组织的教师在线教学学校的教师，与来自\
  \ `IIT Delhi`、`IIT Roorkee` 和 `IIT Bombay` 的教授共同授课。她还担任过各类受推崇会议的分会主席、联合主席、组织委员会成员、审稿人和主旨演讲者。\n\
  \n`Surbhi Bhatia Khan` 拥有机器学习和社交媒体分析领域的计算机科学与工程博士学位。她从美国知名的项目管理协会（Project Management\
  \ Institute）获得了专业认证。她目前是英国曼彻萨尔福德大学（University of Salford）科学、工程与环境学院数据科学系的讲师。她在不同大学拥有\
  \ 11 多年的学术和教学经验，在许多高索引出版物中的知名期刊上发表了 100 多篇论文，并撰写或编辑了 14 本书。她拥有来自印度、澳大利亚和美国的约 12\
  \ 项国际专利。Khan 博士完成了由沙特阿拉伯部和印度教育部科学研究处资助的研究项目。她最近作为联合项目负责人提交了一项英国研究与创新（UK Research\
  \ and Innovation）项目，并获得了艺术与人文研究委员会的 `GBP 400000` 资助。她还领导着一项在沙特萨曼国王残疾研究中心提供的 `SAR\
  \ 1.5 million` 资助下，与沙特马杰玛大学（Majmah University）合作开展的项目。Khan 博士是 `IEEE` 的高级成员，也是 `IEEE\
  \ Young Professionals` 和 `ACM` 的成员。她曾担任多次国际会议和研讨会的主席，并在全球范围内过 20 多场受邀和主旨演讲。她还担任印度希马恰尔普拉德邦舒鲁尼大学（Shoolini\
  \ University）的兼职教授。她还是许多知名期刊的学术编辑、副编辑或客座编辑，并在 2021 年获得了沙特阿拉伯金·法塞尔大学（King Faisal\
  \ University）的研究卓越奖。她的兴趣领域是信息系统、情感分析、机器学习、数据库和数据科学。\n\n# 贡献者\n\n`Nisy Adjei Acheampong`\n\
