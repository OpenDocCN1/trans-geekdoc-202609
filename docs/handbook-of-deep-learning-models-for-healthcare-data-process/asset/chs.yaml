  \n# 4 基于深度神经网络的情感分类分析\n\nLal Babu Purbey 和 Kamlesh Lakhwani\n\n## 4.1 引言\n\n情感分类是自然语言处理中的一个基础问题，涉及确定文本中所传达的情感或情感基调（Cambria\
  \ 等，2017），这一过程被称为情感分析或意见挖掘。情感分析有多种用途，包括社交媒体监控、客户反馈分析和产品评论（Liu 2012）。深度学习神经网络通过为自动化情感分类任务提供稳定且高度的方法，改变了情感分析领域（Zhang\
  \ 等，2019）。本研究提供了基于深度神经网络的情感分类分析的基本概念和动机（Cambria 等，2017）。在本章中，我们将详细阐述情感分析的重要性、其面临的挑战以及深度学习技术如何作为一种强大的解决方案应运而生。\n\
  \n\n\n\n例如，从重要性而言，在当今数字时代，社交媒体、电子商务平台、新闻媒体和其他在线源生成了海量的文本数据（Liu 2012）。企业、组织和学者必须理解这些数据中传达的情绪。情感分析可以洞察公众观点和客户满意度，并预测市场趋势。对在线生成数据进行情感分析的主要挑战在于，如何在不知道上下文的情况下检测讽刺和反讽等情感细差别。在处理自然语言的复杂性时，传统的基于规则的系统往往力不从心，使得深度学习成为极具吸引力的答案。\n\
  \n针对这些挑战，深度学习作为机器学习的一个子集，显著提升了情感分析的水平。深度神经网络（Zhang et al. 2019），特别是循环神经网络（`RNNs`）（Can,\
  \ Ezen-Can, and Can 2018）、卷积神经网络（`CNNs`）（Kane et al. 2021）以及 Transformer，在捕捉微妙模式和依赖关系方面非常有效（Tang\
  \ et al., 2016）。这些算法可以学习并适应人类语言的复杂性，从而提高了情感分类的准确性。\n\n深度学习网络模型（Zhang et al. 2019）可用于各种情感分析任务（Zhu\
  \ et al. 2022），例如二分类分类（J. Zhou et al. 2019）、多类分类（Uysal and Gunal 2014）、基于属性的分类（Dalal\
  \ 2017）以及细粒度分类（Zirn, Niepert, et al. 2011）。情感分类分析广泛应用于各种业务，从营销和客户服务到政治民调和品牌管理。深度学习模型（Tang,\
  \ Qin, and Liu 2016）具有大规模自动化情感分析的能力，使其成为从海量文本数据中做出决策和获取洞察的有效工具。\n\n评估消费者对各种话题（电影、产品、音乐专辑等）的态度并从中提取观点是一项具有挑战性的任务。情感被更具体地描述为情感决策、思想、行为或心理状态。这是一种自动化程序，通过对主观数据进行计算、评估和预测为好、坏或中立，以提供作者对文本的观点（Hussein\
  \ 2018）。观点分析还涉及一些特定术语，例如深度观点评估，它提供的对观察结果的分类不仅仅是二元分类（正面或负面）。文本中的情感识别是指识别和管理如焦虑、忧虑、悲伤、兴奋、蔑视等情绪。复杂的机器学习技术被用于识别各种应用中的多样化行为（Suhasini\
  \ and Srinivasu 2020）。最后，基于观点的分析将文章分为若干类，然后为每个类别分配观点（Kang, Ahn, and Lee 2018），例如一个手机相机因性能非常好而收到好评，但因价格昂贵而收到负评。\n\
  \n由于上下文的性质，以客户为中心的小企业经常采用观点分析来更好地理解他们的需求（Hajek and Munk 2023）。许多互动且友好的社交媒体平台和网站为寻求客户对其产品和服务反馈的在线业务提供服务。消费者也希望看到他人如何对特定产品评分，以帮助他们做出购物决策。因此，迫切需要创建适当的程序和流程来辅助质量保证。这一验证过程的设计和执行需要使用强大的分析技术。一旦将通用模式呈现给状态检查系统（该系统可以被训练并用于进一步分析），就可以进行事实核查。模型必须高效，以提高验证过程的准确性。此外，对观点的考虑取决于问题的性质和分析的性质。因此，必须开发一个通用模型。\n\
  \n### 4.1.1 研究问题\n\n情感分析（也称为观点挖掘）对于理解和从文本数据中提取观点、情绪和态度非常重要（Hussein 2018）。深度学习网络极大地提高了情感分类的准确性，并成为自然语言处理的焦点（Tang,\
  \ Qin, and Liu 2016）。然而，该领域仍存在许多障碍，并具有持续发展的潜力。本研究的目标是在深度学习网络模型的背景下，通过解决特定挑战并提出新的解决方案来改进情感分类分析。用于细粒度情感分析的深度学习模型超越了简单的正、负面情感检测，能够区分这些类别中中立、混合或不同程度的强度（Tang,\
  \ Qin, and Liu 2016；Zirn, Niepert, et al. 2011）。模型应该被扩展以适应多种语言的情感分析，并应该研究跨语言迁移方法以提高准确性，特别是在标注数据不足的语言中。\n\
  \n上下文情感分析研究这些模型如何考虑到随时间变化、用户特定情况或影响情绪的因素。模型应该可靠地识别并分类讽刺或反讽的陈述，这些在普通情感分析中经常被误分类。数据效率和泛化是指优化模型以更少的标注数据进行训练，并在领域和主题之间有效泛化。半监督和自监督学习通过利用未标记数据创建改进情感分析的策略（Suhasini\
  \ and Srinivasu 2020）。定制化情感分析应通过修改模型以适应用户的表达来实现特定化。解决这些研究问题有助于开发更先进的情感分析深度学习模型，使其更加准确、灵活且负责任。\n\
  \n### 4.1.2 研究目标\n\n本研究的目标是调查情感评估的通用框架。它具有两个重大贡献：我们证明了 `CNNs`（Zhou and Long 2018）和向量算法可以用于开发通过数据驱动训练一次并应用于其他数据集的模型，并使用不同的准确率指标与相同数据集中的其他先进算法进行性能比较。这是对深度神经模型独立性的少数调查之一。\n\
  \n## 4.2 相关工作\n\n尽管在语言学和自然语言处理方面已有研究（Liu 2012），但在 2000 年之前发表的文章很少。几年后，这个话题吸引了不同学者和研究小组的关注。概念分析可以描述每个对象或语义的理论和关系。概率方法被用于发现每条评论的模式、它属于哪个类别以及发送什么观点。\n\
  \n\n\n\n一种自自或导向的分类系统可以使用监督机器学习算法在从句层面对情感进行分类，包括来自多个来源的区分（Pathan and Prakash 2022）。隐性外观评估方法不需要使用与特定对象相关的前缀。某研究的作者通过分析词的上下文来识别它们的相似性和差异（Mehanna\
  \ and Mahmuddin 2021）。Kumar 等人 (2021) 开发了一种新的跟踪策略，该策略具有识别有用评论的特征，并恢复了新特征以准确衡量情感极性。自然语言处理算法利用获取特征来审查受监督和半监督的文本分类策略（Hu\
  \ et al. 2013）。表 4.1 详细描述了使用三个独立数据集进行情感分析的不同方法。\n\n#### 表 4.1 方面级情感分析方法\n\n| 数据集\
  \ | 方法 |\n| : --- | --- |\n| 酒店评论 (Suryadi and Imran 2022) | 使用条件随机场进行方面识别和情感分析（Dalal\
  \ Hardik 2017） |\n| 基于概率主题模型对情感信息进行分组 (Suryadi and Imran 2022) | |\n| 产品评论 (Li et\
  \ al. 2021) | 潜在特征评分分析模型 (Hongning Wang 2011) |\n| 用于情感分类的马尔可夫逻辑（Kang, Ahn, and\
  \ Lee 2018） | |\n| 电影评论 (Tsutsumi, Shimada, and Endo 2007) | 带有 SVM 的最大熵（Nasim and\
  \ Ghani 2020） |\n| 单元词和双元词 (Lahkar and Singh 2022） | |\n| 基于词典的方法 (Ding, Liu, and\
  \ Yu 2008） | |\n| 基于字典的方法 (Bhowmik, Arifuzzaman, and Mondal 2022） | |\n\n### 4.2.1\
  \ 方法\n\n条件随机场（`CRFs`）的目的是为方面短语提取创建一个序列标记模型。`CRFs` 根据可观测序列计算概率。观测到的序列（称为特征）作为模型的输入。`CRF`\
  \ 根据这些特征创建条件概率（Dalal Hardik 2017）。标签在序列中出现的可能性由当前、前一个和未来的序列决定。\n\n隐含狄利克雷分布是一种主题建模技术，它假设存在一种底层机制负责生成语料库中的文档；在生成过程中，最初假设语料库中的主题数量是已知。对于每篇文章，使用具有不同参数的狄利克雷分布构建主题分布。主题分布表示为\
  \ `n` 维向量，其中向量中的每个元素都是和为 1 的非负值。根据相关的维度向量，为文档中的每个词分配一个主题。在选择主题后，可以使用词概率矩阵选择单词。矩阵中的每个元素代表了从选定主题中选择特定单词的概率（Suryadi\
  \ and Imran 2022）。\n\n马尔可夫逻辑用于最大熵模型。马尔可夫逻辑是一种整合了统计和结构特征的分析框架。该框架提供了涉及许多词典和语言关系的综合情感分析手段（Zirn,\
  \ Niepert, et al. 2011）。潜在方面评分分析（`LARA`）是确定关键评论意见评分的过程。\n\n基于字典的方法 (Bhowmik, Arifuzzaman,\
  \ and Mondal 2022）不需要大规模语料库。基于字典的方法衡量分配给评论的情感（Medhat, Hassan, and Korashy 2014）。情感可以是\
  \ `sad`、`happy`、`angry` 等，它们通过 `CNNs` 扩展。\n\n`CNNs` 和向量算法（Tharwat 2019）。`unigram`、`bigram`\
  \ 和 `trigram` 分别表示一个词、两个词和三个词（Lahkar and Singh 2022）。\n\n#### 表 4.2 使用 CNN 和向量算法进行情感的研究\n\
  \n| 作者 (年份) | 方法 | 技术 |\n| --- | --- | --- |\n| Kim (2014) | 使用预训练词向量和 `CNNs` 捕捉文本数据中的分级特征\
  \ | `CNNs` |\n| Zhang et al. (2019) | 通过字符级卷积网络进行文本分类 | `CNNs` |\n| Marcheggiani\
  \ et al. (2014) | `Word2Vec` 词表示 | `Vector algorithm` |\n| Li et al. (2021) | 词向量表示\
  \ | `Vector algorithm` |\n| Socher et al. (2013) | `CNNs` 和 `Word2Vec` 词表示 | `CNN\
  \ + vector algorithm` |\n| Tang 等 | 带有预训练嵌入的双门循环神经网络 (`RNNs`) | `CNN+Vector Algorithm`\
  \ |\n\n\n\n\n开发旨在使情感分析技术更具解释性和透明度的策略，特别是在高风险的决策应用中，是一个持续存在的问题。在保持准确性的同时，要实现低延迟、高吞吐量的处理是困难的，对于大型\
  \ `CNN` 模型尤其是如此。另一个重要的研究问题是在能够在各种语言状况下保持良好准确性的同时，处理低资源语言。模型不应过度拟合训练数据，并能够适应不断变化的语言模式。个性化微调也是一个问题。\n\
  \n## 4.3 方法\n\n在本节中，我们讨论了所评估的各种神经网络，分别使用 IMDB、电影评论（Movie Review）和亚马逊评论（Amazon Review）数据集来训练和测试神经网络。下面将讨论以下分类器-\n\
  \n### 4.3.1 CNN\n\n`CNN` (Kane et al. 2021) 是一种前馈网络模型，它使用了多种卷积滤波技术和下采样过程，以及全连接策略。`LeNet-5CNN`\
  \ 是大多数物体识别、地理和预测的 `CNN` 应用的基石。要使用 `CNN` 模型，必须首先将分析输出向量转换为矩阵 (LeCun Yann 1988)。一个\
  \ `CNN` 模型由一个卷积层 (LeCun Yann 1988)、一个下采样层 (Zhou and Long 2018) 和一个输出层组成。使用五个 (2\
  \ 2) 滤波器，根据缩放的指数线性单元 (He and Abisado 2024) 函数生成一个独特的特征图。下采样层还对生成的特征图进行空间解析。后处理由三层组成，所有这三层都使用\
  \ `CNN` 模型进行分类。\n\n### 4.3.2 高级神经网络\n\n分类理论可以用于神经网络模型，以记住神经网络的隐藏层首先接收向量算法的输出向量。该层包含三个神经元以及一个双双曲激活函数\
  \ (Duyu, Bing, and Ting 2016)。输出层配置由 `softmax` 激活函数 (Zhang et al. 2019)、`Adam` 优化器\
  \ (Es-sabery et al. 2022) 和交叉熵损失函数 (Jnoub, Al Machot, and Klas 2020) 组成。在使用 `scikit-learn`\
  \ 包的搜索网格选择参数时，这两个函数被用作损失函数。\n\n### 4.3.3 其他分类器\n\n其他分类器包括支持向量机 (`SVM`) (Tharwat\
  \ 2019)、k-最近邻 (`KNN`) (Sham and Mohamed 2022)、朴素贝叶斯 (Khan and Junejo 2020) 以及随机森林\
  \ (Machová, Mach, and Adamišín 2022)，它们都已经过研究以比较性能。使用先验分布具有若干优势，例如使随机森林能够识别多样化、高方差模式，同时减轻弱决策树的影响，并具有将它们变为降低波动和偏差模型的能力。相反，`KNN`\
  \ 是一种在保留所有当前样本的同时，根据其相似性测量对新场景进行分类的算法 (Eng, Ibn Nawab, and Shahiduzzaman 2021)。`KNN`\
  \ 已被用作非参数算法。`SVM` 的多项式核 (poly) 和径向基函数 (rbf) 以其处理非线性数据的能力而闻名。\n\n### 4.3.4 评估指标\n\
  \n研究人员使用了多种指标来衡量：准确率（Accuracy）是最常用的指标。精确率（Precision）给出了预测准确的比例；召回率（Recall）决定了捕捉正例的程度。F1\
  \ 分是召回率和精确率的权衡。真负性（true negative）、假阳性（false positive）和假负性（false negative）分别代表 Cohen-Kerner,\
  \ and Li 2020 的情况。我们考虑了两种评估场景：领域依赖（domain dependent）和领域独立（domain independent）。对于领域依赖评估，我们使用了每个数据集；对于领域独立评估，我们在这些数据集上训练了模型。\n\
  \n## 4.4 结果与讨论\n\n表 4.3 和 4.4 展示了基于公式 (4.1)–(4.4) 使用 IMDb (Shaukat et al. 2020)、电影评论和亚马逊评论\
  \ (Li et al. 2021) 的高级神经网络模型 (ANN) 的性能分析。\n\n\n\n\n我们在研究发现中确定了一些有趣的事实。例如，对多个句子的最终评估将得出关注于特定方面的结论，而不是将它们全部视为单一的兴趣领域。例如，一位影评家可能喜欢某部电影的演技整体剧情，但对某些序列中的配乐感到不满。我们也清楚了，情绪可以通过许多方式传达（包括间接言语），因此必须使用理性方法进行划分；我们确定了复杂句的模式分析是困难的，特别是当单词之间存在分歧时。我们从工作中了解到，`CNNs`\
  \ 可以克服许多这些常见的理论问题。`CNNs` 能够识别并变换空间信息层级，在这里捕捉了所分析文本不同用户的语法。一个良好的两对分析（尤其是独立分析）可能会失去其相关性。有了神经网络，现在可以在训练模型之前对数百个对象进行分类。\n\
  \n## 4.5 结论\n\n通过本章的研究，我们研究了一种广泛的情感分析方法，该方法可以检测广泛文档中的情感。神经模型通过采用向量化将分析转换为正确的输入向量，消除了强特征，并且在泛化和分类方面表现出色。在我们的模型比较中，`CNN`\
  \ 和 `ANN` 模型性能均优于使用相同数据的早期研究，并展示了跨假设分布的泛化能力。这些模型可以在一个数据集上进行训练，并在来自不同来源的不同集合上测试。此外，未来的研究人员可能旨在将此处的方法应用到多个平台，以优化神经模型的性能。\n\
