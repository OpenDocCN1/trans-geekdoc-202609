  \ Kumar*\n\nDOI: [10.1201/978103467281-13](https://doi.org/10.1201/978103467281-13)\n\
  \n## 11.1 引言\n\n药物分类的准确性在医疗和医药行业至关重要，因为错误的分类可能导致致命后果、副作用或治疗失败。在缺乏足够措施的情况下，假药增加了这些风险。根据最近的一项估计，假药占全球药品贸易的达\
  \ 10%，对健康和财务构成了巨大威胁。在本章中，我们提出了一种药物图像分类与认证模型来规避健康危害。\n\n### 11.1.1 现状与不足\n\n尽管旧系统通过人工检查或特征提取能力简单的学习模型来识别药物，但这些方法在处理复杂的视觉信息（如三维结构特征以及光线角度变化）时通常会失效。基于卷积神经网络（`CNN`）的早期模型适用于图像分类，但在深度特征提取以及视觉相似药物类别的无监督学习方面仍然不足。\n\
  \n### 11.1.2 范围与贡献\n\n\n\n通过本章的工作，我们做出了几个主要贡献。我们提出了一种利用 `CNNs`、视觉变换器 (`ViTs`) 和自监督学习\
  \ (`SSL`) 进行高级药物分类的详尽架构框架；这是集成区块链技术进行药物身份验证和假伪品检测的通用理论框架。我们采用了多维度方法，使模型能够查看多样化的数据类型：药物成分、制造元数据和视觉数据，从而增强了分类的精确性以及模型的可解释性。\n\
  \n## 11.2 文献综述\n\n### 11.2.1 CNN\n\n由于 `CNNs` 能够自然整合图像的空间层次结构，它们成了许多图像分类任务的主干基础。`CNNs`\
  \ 的核心思想由 `LeNet`、`AlexNet` 和 `VGG` 等模型发起，这些模型引入了卷积架构，能够从图像中逐步学习更高层次的特征 [5, 6, 7]。随着\
  \ `EfficientNet` 和 `ResNet` 等架构的进一步发展，可扩展性得到了提高，结合残差连接实际上引入了更好的深度与准确率权衡 [8, 9]。优化的\
  \ `CNNs` 被证明在药物分类任务中非常有效，因为它们能够识别药物的独特特征，即颜色和纹理。处理这种复杂的视觉数据会降低性能，这限制了其在需要高鲁棒性空间识别和上下文准确性的药物分类任务中的独立应用\
  \ [10, 11, 12]。表 11.1 展示了在图像分类历史上具有重要意义的各种 `CNN` 模型。\n\n表 11.1 模型及其属性\n\n| 模型 ||\
  \ 年份 || 关键特征 | 在药物分类中的应用 |\n| --- | --- | --- | --- |\n| `LeNet` | 1998 | 基础卷积层\
  \ | 限于基础图像分类 |\n| --- | --- | --- | --- |\n| `AlexNet` | 2012 | 深度架构，ReLU | 增强药物特征的特征学习\
  \ |\n| `VGG` | 2014 | 多层卷积层 | 有效捕捉形状和纹理细节 |\n| `EfficientNet` | 2019 | 可扩展，深度卷积\
  \ | 药物识别的高精度和高效率 |\n| `ResNet` | 2015 | 残差连接 | 适用于捕捉复杂的药物特征 |\n\n图 11.1 展示了 `ResNet50`\
  \ 模型的架构，这是一种因残差连接而以深度闻名的 `CNN` 模型。这些连接允许训练深层网络而不产生退化。该图描述了其分级结构，展示了图像特征提取的序列，并证明了残差层如何增强处理药物图像的准确性和效率。\n\
  \n![图 11.1 ResNet50 模型结构。](img/fig11_1.jpg)\n\n图 11.1 ResNet50 模型结构。\n\n### 11.2.2\
  \ ViTs\n\n`ViTs` 引入了一种新范式，因为它们使用自注意力来捕捉长程依赖 [7, 13]。`ViTs` 通过识别图像块之间的细微差异，在多个任务中优于\
  \ `CNNs` [14, 15]。`ViTs` 中的注意力机制允许模型区分看起来相似但属性不同的药物 [13, 14]。\n\n### 11.2.3 SSL\n\
  \n当标注数据不足时，`SSL` 特别有用。通过与对比学习，`SSL` 方法允许模型学习有意义的表示 [17, 18]。这种方法对于通过视觉线索分类药物至关重要。\n\
  \n### 11.2.4 使用多模态学习和区块链进行假检测\n\n多模态学习使用文本、图像和元数据等多个源来增强准确性和上下文深度 [16]。区块链技术提供了一个安全的账本来追踪和验证药物，减少了假药到达患者手中的机会\
  \ [1, 19, 20]。表 11.2 对比了多模态学习与区块链。\n\n表 11.2 多模态学习的应用与优势\n\n| 技术 || 应用 || 优势 |\n\
  | --- | --- | --- |\n| 多模态学习 | 集成文本和图像数据 | 增强的准确性和深度 |\n| 区块链 | 药物的安全追踪 | 减少假药风险\
  \ |\n\n## 11.3 提出的架构\n\n### 11.3.1 CNN 主干\n\n我们的架构包含一个 `CNN` 主干，因为 `CNNs` 能够检测边缘和纹理等显著特征。我们选择\
  \ `EfficientNet` 作为 `CNN` 主干是因为它能够平衡资源并通过深度扩展来优化性能 [8, 9]。我们的模型使用 `EfficientNet`\
  \ 的高效层结构来获取形态属性。此外，`CNN` 连接的残差允许更深的网络而不产生退化。\n\n### 11.3.2 ViT 模块\n\n`ViTs` 使用模块来捕捉全局特征，这与传统应用不同。`ViTs`\
  \ 内部的自注意力允许模型建立图像不同部分之间的关系，从而识别形状和模式以区分相似的药物 [13, 14, 15]。该模块通过将从 `CNNs` 推出的局部特征与\
  \ `ViTs` 感知的全局模式相结合，呈现了药物图像的整体视图。\n\n`ViT` 的架构如图 11.2 所示。该图阐述了自注意力如何实现 `ViT` 的特征提取，展示了该独立模型如何通过分析块来发现细微差异。\n\
  \n### 11.3.3 SSL 层\n\n\n\n\n\n为了克服上述可用标记数据集较小的问题，我们采用了 `SSL` 层，通过在未标记图像上进行对比学习对药物图像进行预训练。`SSL`\
  \ 层提高了模型的特征提取能力，使其能够从数据的视觉模式和关系中学习知识，而不需要显式标签 [21, 22, 23]。在预训练阶段，`SSL` 层需要增强同一药物图像不同表示之间的相似性，同时降低不同药物之间的相似性。事实证明这可以增强模型的鲁棒性，特别是在处理细微差异具有高诊断价值的复杂药物图像时，效果尤为显著\
  \ [24]。\n\n### 11.3.4 用于假药检测的多模态融合与区块链\n\n多模态融合模块将视觉信息与成分、制造数据等辅助药物信息相结合，为模型提供更全面的表示，从而可能提高其准确性。多模态学习层结合这些不同的输入，使模型能够同时利用视觉和文本特征进行更好的分类。此外，还引入了基于区块链的验证层，作为对每种分类药物完整性的检查。它应用智能合约为每种药物提供唯一的数字签名，并将其存储在去中心化账本上。这使得医疗提供者和消费者能够实时验证药物的真伪性，从而减少假药的供应，并维护药物供应链的完整性\
  \ [1, 19, 20]。\n\n## 11.4 实验设计\n\n### 11.4.1 数据集\n\n实验数据集包含了大量标记的药物图像以及相关的元数据，如成分组成、制造日期和批次号。我们对数据集进行了预处理，包括缩放、归一化和过滤噪声，使所有图像保持统一，以便更好地训练模型。由于药物种类广泛，我们对类别进行了平衡，以确保不会因为某些药物类过度代表而产生偏差。数据预处理涉及调整大小和归一化（即标准化图像尺寸以保持一致性）、噪声过滤（减少背景噪声以提高图像清晰度）以及数据增强（通过应用旋转、翻转和改变亮度等变换来增强模型的泛化能力）。\n\
  \n### 11.4.2 评分指标\n\n为了评估所提模型，我们采用了以下指标对模型性能进行多维度概述：\n\n- `Accuracy`（准确率）：正分类分类的数量\n\
  - `Recall`（召回率）：模型区分正确药物类别的准确程度\n- `F1 score`（F1 分）：精确率和召回率的和和平均数，平衡了两项指标\n- `Blockchain\
  \ verification rate`（区块链验证率）：区块链验证药物真实性的速率，这是分类之外的进一步验证步骤 \n\n## 11.5 模型部署与训练\n\n\
  ### 11.5.1 训练周期\n\n我们分两个阶段训练模型：预训练和微调。在预训练阶段，`SSL` 层基于未标记的药物图像进行学习。预训练生成了强有力且通用的特征，以便使用标记数据进行微调。在微调期间，`CNN`\
  \ 和 `ViT` 层均允许感知复杂的视觉模式，而区块链层则根据独特的药物特征进行身份验证优化。\n\n### 11.5.2 模型调优\n\n我们对模型进行了如下调优：首先，我们使用了带有带有\
  \ `Momentum` 的 `SGD`，允许优化器在模型参数动态更新时收敛得多。我们还在训练过程中调节了学习率，这有助于稳定学习。最后，由于训练样本中增加了变体，数据增强提升了模型的泛化能力。\n\
  \n## 11.6 挑战与未来方向\n\n### 11.6.1 问题\n\n- 将此模型投入实际运行面临许多挑战。`ViTs` 的自注意力机制是计算密集型的，限制了其广泛应用\
  \ [7, 13, 15]。尽管 `SSL` 解决了一些问题，但主要障碍在于获取高质量的标记数据集。此外，虽然区块链确保了安全性，但也增加了复杂性 [1, 20]。最后，该模型在不同药物类型之间的泛化能力仍待提高。\n\
  \n### 11.6.2 未来工作\n\n然而，未来工作仍有许多前景。例如，`ViTs` 的混合线性注意力机制可以增强扩展性并减轻计算负载 [13, 14]。通过迁移学习和合成数据生成可以解决数据稀缺问题\
  \ [21, 23, 24]。持续的现实世界区块链试点可以验证其性能 [1, 19]。最后，医疗保健领域可以从机器学习和人工智能中获得支持 [25–39](#Ch11.xhtml#ref39)]。\n\
  \n## 11.7 结论\n\n我们提出的模型集成了卷积神经网络、视觉变换、自监督学习和区块链，确保了药物分类的精确性和真实性。该模型为制药业迈出了巨大一步。\n\
