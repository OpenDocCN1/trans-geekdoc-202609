  \ 2, 2023.\n\n# 9 使用跨理论模型进行健康行为阶段分析工具开发与测试\n\nLiza Attrey, Sunaina Dua, Ruchi Kaushik,\
  \ Sarita Anand, Aparna Agarwal\n\nDOI: 10.1201/9781003467281-10 https://doi.org/10.1201/9781003467281-10\n\
  \n9.1 引言\n\n越来越多的证据表明，基于良好理论框架的干预比没有理论依据的干预更有效。此外，整合多个理论和概念的策略通常会产生更好的结果。在领域内突出的理论会影响其发展、划定实践边界并塑造专业人员的教育与培训。（美国卫生健康服务部行为与社会科学办公室和国家卫生研究所\
  \ n.d.）](#Ch09.xhtml#ref9_6)。\n\n\n\n\n社会与行为改变（SBC）理论是一套框架，旨在从个人、社区和社会层面全面地应对并影响健康相关行为。SBC\
  \ 通过引入社会生态学思维，使其与较旧的行为修正模型区分开来。它不仅仅是提高意识，而是强调促进集体行动并让社区参与话语体系。（健康保护局、马尔代夫共和国卫生部和联合国教科文组织\
  \ 2019）\n\nSBC 中最常用的模型之一是跨理论阶段模型（`TTM`），它提供了一种动态的方法来理解个体如何进过行为改变模型的各个阶段。该模型认为行为的改变是一个过程，不同的人处于不同的改变阶段和就绪状态。在这个过程中，人们会经历五个阶段：前考虑期、考虑期、准备期、行动期和维持期。与静态模型不同，`TTM`\
  \ 承认行为改变并非线性的；个体会在不同阶段之间移动，并以不同的速度退步或进展。有三个变量控制着不同阶段之间的流动以及改变所需的时间：改变过程（`PC`）、决策平衡（`DB`）和自我效能（`SE`）（Rahimi\
  \ et al. 2019）。\n\n模型比较是一种技术，试图在可能的模型列表中估计/识别出最能良好关联/说明行为相关数据的模型，以此作为一种方法来确定哪些过程更倾向于触发相应的行为。当不同的框架可以产生可比的定性预测，但在定量上存在差异时，这种方法更为适用（Wilson\
  \ and Collins 2019）。通过本章，尝试将 `TTM` 作为一个标准化框架，开发一种研究评估工具，以衡量学生在与身体健康和福祉相关的行为方面的行为改变就绪度。\n\
  \n## 9.2 文献综述\n\n### 9.2.1 健康与整体福祉\n\n根据世界卫生组织（`WHO`）的定义，健康是指“生理、心理和社会适应的完美状态，而不仅仅是指疾病或衰弱的体”。健康发展体现了实现这种状态所必需的所有组成部分（“Health\
  \ and Well-Being” n.d）。\n\n近期印度年轻人（尤其是 30 到 40 岁之间的人）突发性心脏骤停（`SCA`）病例引起了医学界的严重关注。《柳叶刀数字健康》上的一项研究中，Reinier\
  \ et al. (2023)）。\n\n根据 Singhal et al. (2022)，深度学习被广泛应用于各个领域。Forberger et al. (2019)综述了\
  \ 35 篇使用选择架构或助推来促进身体活动的论文，发现大多数研究集中在机场和购物中心等场所；少数研究了在线领域。作者强调了助推的潜力，但指出了关键的研究空白，要求进行基于理论的研究、可行性测试以及大规模实施策略。\n\
  \n研究人员对 2021 年至 2022 年间在约旦进行的一项横断面研究，对 1109 名高血压患者的七种健康饮食行为和两种与收血压（`BP`）管理相关的生活行为进行了阶段评估。虽然许多参与者在健康行为（如摄谷物、水果、蔬菜、瘦肉和低脂乳制品）方面处于维持阶段，但许多人在戒烟、规律体育锻炼和减少甜食及添加糖方面仍处于前行动阶段。这些发现强调了饮食遵从与采取\
  \ `BP` 生活方式改变之间的关键差距（Elsahoryi et al. 2024）。\n\n作者还发现患者的改变阶段与年龄、收入、教育程度、病程和获取营养咨询之间存在显著相关性（`p\
  \ < 0.01`）。特别，年龄较大且教育程度较高的患者对健康行为的遵循度更高，而收入较低且获取营养咨询少的人更容易处于某些行为的前行动阶段。这些结果表明，需要针对性的改善高血压患者控制\
  \ `BP` 至关重要的生活行为（Elsahoryi et al. 2024）。\n\n### 9.2.3 SBC 模型\n\nSBC 模型基于行为科学理论，这些理论通过说明影响行为的各种变量之间的关系，帮助解释或预测行为（“What\
  \ Is Social and Behaviour Change Communication” n.d）。这些理论为理解人们行为背后的原因提供了一个系统的框架，有助于制定针对行为驱动因素的治疗措施。考虑到多种因素相互作用以影响行为改变，它们考虑了社会、文化和经济领域的思想（Urban\
  \ Adolescent SRH SBCC 2015）。\n\n\n\nSBC 模型至关重要，因为它们为公共卫生干预设计提供了计划的、证据为驱动的策略。基于理论的干预已被证明比没有理论基础的干预更有效。诸如社会生态模型等考虑了影响健康行为的更广泛社会生态组成部分，通过涵盖环境、组织和人际方面，扩展到了个人行为之外。这种“上游”方法确保了干预不仅关注个人，还解决了影响行为的社会环境因素（[行为与社会科学研究处，卫生与人类服务部和国家卫生研究所，无日期.]](#Ch09.xhtml#ref9_6)。\n\
  \n### 9.2.3.1 改变阶段/TTM\n\n跨理论模型（通常被称为改变阶段模型）假设行为改变是根据个人动机和改变准备意愿决定的、分阶段完成的。在一对一的情况下，咨询师可以根据客户的改变阶段选择资源。在整个前考虑阶段和沉思阶段，主要的资讯主题是事实、与当前行为相关的风险以及改变行为的益处。治疗将侧重于行为改变的机会，以及在计划和行动的同时如何抓住这些机会（青少年\
  \ SRH SBCC 2015）。根据 TTM，改变分五个阶段进行，尽管患者可以在阶段之间来回。在前考虑阶段，客户没有改变行为的即刻计划。在沉思阶段，客户意识到问题并正在深思地权衡选择，但尚未做出采取行动的决定。在准备阶段，客户打算立即采取行动。在行动阶段，客户开始执行行为。在维持阶段，客户试图维持该行为。一些\
  \ SBCC 专业人员还包含了第六个层次：倡导。在倡导阶段，他们会论述继续特定的行为并强调其益处（青少年 SRH SBCC 2015）。\n\nTTM 认为行为改变是一个过程，人们在改变的准备阶段上存在差异。这个过程涉及人们总共经历的五个阶段：前考虑、沉思、准备、行动和维持。此外，人们可以回到此模式的任何早前迭代。决定阶段之间流动和改变持续时间的三个变量是：改变过程、决策平衡和自我效能。由于\
  \ TTM 既节省时间又节省成本，它已用于多种癌症和慢性疾病的预防疗法，包括糖尿病（Rahimi 等人 2019）。\n\nProchaska 和 Velicer\
  \ (1997) 断言，阶段构建的显著性源于其对时间维度的描述。改变象征着随时间推的活动，但独特的是，在任何主要的治疗理论中都没有表达时间的核心思想。行为的变化经常被视为一种事件，例如戒酒、戒烟或过度进食。根据跨理论模型，改变是一个涉及通过六个阶段的过程（图\
