  \ [26, 27]。\n\n### 3.3.2 数据来源\n\n在这项工作中，我们关注 `ADNI` 和 `OASIS` 等数据集，结构性成像提供了大脑物理结构的信息，包括神经元、胶质细胞和突触。相反，功能性成像关注大脑的作用和过程。\n\
  \n### 3.3.3 数据获取与预处理\n\n我们研究的三个 AD 类是 `no dementia`（无痴呆）、`mild dementia`（轻度痴呆）和\
  \ `very mild dementia`（极轻度痴呆），我们使用了从 Kaggle 竞赛获取的 `MRI` 数据。集合中的 6400 幅对应两百患者，每人有十二片。为了符合模型规范，我们将这些初始为\
  \ 176 × 208 像素的灰度图像缩放为 224 × 224 像素。数据预处理涉及归一化、像素值缩放到 0–1 范围以及使用 `ImageDataGenerator`\
  \ 进行数据增强，通过旋转和翻转提高模型的泛化能力。预处理允许按阶段对 AD 进行准确分类，确保为深度学习模型提供最好的图像。表 3.1 显示了数据集如何分为训练集和测试集。\n\
  \n| 类别 | 训练 | 测试 |\n| --- | --- | --- |\n| 无痴呆 | 2550 | 630 |\n| 极轻度痴呆 | 1787 |\
  \ 443 |\n| 轻度痴呆 | 712 | 174 |\n| 总计 | 5049 | 1247 |\n\n### 3.3.4 CNN\n\nCNN 是一种著名的深度学习架构，在涉及图像识别和分类的任务中表现非常出色\
  \ [30]。CNN 包括多个层，包括分类器层、卷积层、池化层、激活层和全连接层；为了提供精确且有效的分类，这些层协作从输入图像中提取并学习分层特征。卷积层是\
  \ CNN 的关键部分，负责特征提取。卷积层通过应用特定大小的卷积过滤器或内核从输入图像中恢复适当的特征 [31]。\n\n扩散张量成像 (`DTI`) 是一种特殊的方法，通过检查大脑内部的水流，可以评估白质的完整性\
  \ [28, 29]。\n\n为了让网络获取复杂的模式，`sigmoid`、`修正线性单元 (ReLU)` 和 `双曲正切 (Tanh)` 等激活函数对于引入非线性至关重要\
  \ [32]。\n\n\n\n\n池化层对于降维至关重要，而卷积层则侧重于特征提取。平均池化和最大池化等方法通过将信息压缩到特征图的一个小区域内，在保持重要特征的同时降低计算复杂度`[33]`。网络可以整合并分析检索到的特征，因为全连接层创建了涉及当前层所有神经元以及前一层所有神经元的连接。分类层随后通过确定哪个类别或标签具有最大概率来提供最终的分类结果`[34]`。CNN\
  \ 在分类问题中卓越效果归功于它们高效管理海量数据集的能力`[35]`。这种能力源于它们从提供的数据中自动学习相关细节的能力及其层次结构。\n\n### 3.3.5\
  \ RESNET50\n\nResNet50 是一种 50 层深度残差网络，用于仅通过 MRI 数据对临床痴呆评分进行分类。`TensorFlow` 作为 `Keras`\
  \ 实现模型的后端。`ResNet50` 的创建特别是为了解决 CNN 在反向传播阶段可能出现的梯度消失问题。在深度网络的初始层，由于更新权重所需的信号减小，有效学习受到了阻碍。残差连接允许网络学习残差函数而非整个映射，并有助于缓解这个问题`[36]`。正如`[37]`\
  \ 所解释的，`ResNet50` 设计由许多残差块组成，能够高效地堆叠层，而不会出现随着训练极深网络而带来的退化问题。该模型使用分类交叉熵作为损失函数进行训练。\n\
  \n### 3.3.6 MOBILENET\n\nMobileNet 是一种专为在移动和嵌入式设备上高效部署设计的卷积神经网络，它优先考虑在不损害性能的情况下最小化计算复杂度`[38]`。\n\
  \n它通过深度可分离卷积实现了这种效率，卷积将标准卷积分解为两个阶段：独立应用于每个输入通道的深度卷积，以及结合输出的点状卷积。这显著减少了参数和乘法次数，从而产生紧凑且计算高效的模型。MobileNet\
  \ 的架构包括神经网络层，如用于防止过拟合的 dropout 层和用于分类的 softmax 激活函数。额外的超参数（宽度、分辨率系数）允许通过微调滤波器数量和输入分辨率进行额外控制，从而在准确率与计算复杂度之间获得更好的平衡。MobileNet\
  \ 是一种简单且轻量级的架构，可以根据应用需求以或或低的复杂度实现`[38]`。已有若干研究`[39]–52]` 探索了利用各种算法通过深度学习、机器学习和人工智能技术来检测疾病。\n\
  \n### 3.3.7 计算方法论\n\n`图 3.5` 显示了深度学习方法预测 AD 的完整流程。正如我们讨论过的，本章工作的目标是开发一种稳健的算法，能够利用\
  \ `ResNet50`、`CNN` 和 `MobileNet` 准确预测不同阶段的 AD。首先，我们获取了数据。其次，我们对数据进行了预处理。第三，我们训练了模型。第四，我们评估了模型。最后，我们分析了结果。\n\
  \n\n\n我们使用 `Keras` 库配合 `TensorFlow` 后端构建并训练了该模型。测试在一台配备 16 GB RAM 的 Dell Intel Core\
  \ i9 电脑上进行。为了进行高级计算，我们在一个带有 16 GB 专用显存的 NVIDIA GeForce GtkΥ GTX 540 M GPU 上训练了该模型。该硬件配置支持了深度学习（DL）模型的训练和评估。\n\
