  \ |\n\n## 插件\n\n事件可能对我们的框架应用很有用，但它们对于大多数插件架构来说是至关重要的。插件的定义可以在不需要对系统进行根本更改的情况下将其挂载到系统。\n\
  \n为了进一步测试这一概念，我们将构建一个活动日志插件。活动日志将包含每个触发事件的详细信息，并带有事件发生的时间戳。让我们从创建列表 19-20 所示的插件加载器开始。\n\
  \n### 列表 19-20. /public/index.php（提取）\n\n```php\n$path = APP_PATH . \"/application/plugins\"\
  ;\n$iterator = new DirectoryIterator($path);\nforeach ($iterator as $item)\n{\n\
  \    if (!$item->isDot() && $item->isDir())\n    {\n        include($path . \"/\"\
  \ . $item->getFilename() . \"/initialize.php\");\n    }\n}\n```\n\n这段代码应该放置在 `public/index.php`\
  \ 文件中，紧接核心初始化代码。这样插件就可以立即开始监听框架事件并相应采取。`DirectoryIterator` 类仅仅是读取目录信息（在文件系统中）的接口。我们使用它遍历\
  \ `application/plugins` 目录中的所有目录。对于找到的每个目录，我们都会包含一个 `initialize.php` 文件。如果插件希望被自动加载，它们需要将初始化逻辑放在此文件中。\n\
  \n使用 `include` 即使插件目录中没有找到初始化文件，应用程序继续执行。我们现在应该按照列表 19-21 所示添加此初始化文件。\n\n```php\n\
  // 初始化日志\ninclude(\"logger.php\");\n$logger = new Logger(array(\n    \"file\" =>\
  \ APP_PATH . \"/logs/\" . date(\"Y-m-d\") . \".txt\"\n));\n\n// 记录缓存事件\nFramework\\\
  Events::add(\"framework.cache.initialize.before\", function($type, $options) use\
  \ ($logger)\n{\n    $logger->log(\"framework.cache.initialize.before: \" . $type);\n\
  });\nFramework\\Events::add(\"framework.cache.initialize.after\", function($type,\
  \ $options) use ($logger)\n{\n    $logger->log(\"framework.cache.initialize.after:\
  \ \" . $type);\n});\n\n// 记录配置事件\n```\n\n\n\n```php\nFramework\\\\Events::add(\"\
  framework.configuration.initialize.before\", function($type, $options) use ($logger)\n\
  {\n    $logger->log(\"framework.configuration.initialize.before: \" . $type);\n\
  });\n\nFramework\\\\Events::add(\"framework.configuration.initialize.after\", function($type,\
  \ $options) use ($logger)\n{\n    $logger->log(\"framework.configuration.initialize.after:\
  \ \" . $type);\n});\n```\n\n`initialize.php` 文件非常简单。我们包含了 `logger.php` 并实例化了 `Logger`\
  \ 类。我们不能依赖任何框架类，甚至不能依赖类自动加载器（autoloader）。我们必须假装它们不存在！\n\n初始化 `Logger` 类后，我们需要为想要记录的所有事件添加监听器。这导致了大量的代码（尽管大部分代码没在这里，但处理起来仍然很简单）。所以我们现在知道了如何使用\
  \ `Logger` 类，但它实际上是如何记录消息的呢？让我们仔细查看列表 19-22 中的类。\n\n### 列表 19-22. Logger 类\n\n```php\n\
  class Logger\n{\n    protected $_file;\n    protected $_entries;\n    protected\
  \ $_start;\n    protected $_end;\n\n    protected function _sum($values)\n    {\n\
  \        $count = 0;\n        foreach ($values as $value)\n        {\n         \
  \   $count += $value;\n        }\n        return $count;\n    }\n\n    protected\
  \ function _average($values)\n    {\n        return $this->_sum($values) / sizeof($values);\n\
  \    }\n\n    public function __construct($options)\n    {\n        if (!isset($options[\"\
  file\"]))\n        {\n            throw new Exception(\"Log file invalid.\");\n\
  \        }\n        $this->_file = $options[\"file\"];\n        $this->_entries\
  \ = array();\n        $this->_start = microtime();\n    }\n\n    public function\
  \ log($message)\n    {\n        $this->_entries[] = array(\n            \"message\"\
  \ => \"[\" . date(\"Y-m-d H:i:s\") . \"]\" . $message,\n            \"time\" =>\
  \ microtime()\n        );\n    }\n\n    public function __destruct()\n    {\n  \
  \      $messages = \"\";\n        $last = $this->_start;\n        $times = array();\n\
  \        foreach ($this->_entries as $entry)\n        {\n            $messages .=\
  \ $entry[\"message\"] . \"\\n\";\n            $times[] = $entry[\"time\"] - $last;\n\
  \            $last = $entry[\"time\"];\n        }\n        $messages .= \"Average:\
  \ \" . $this->_average($times);\n        $messages .= \", Longest: \" . max($times);\n\
  \        $messages .= \", Shortest: \" . min($times);\n        $messages .= \",\
  \ Total: \" . (microtime() - $this->_start);\n        $messages .= \"\\n\";\n  \
  \      file_put_contents($this->_file, $messages, FILE_APPEND);\n    }\n}\n```\n\
  \n`Logger` 类有一个公共方法（魔法方法外），用于向 `$_entries` 数组中添加日志消息（以及时间戳）。当 `Logger` 被实例化时，它会检查提供的选项中是否包含\
  \ `\"file\"` 参数，该参数指向一个应该追加日志消息的文件。如果未提供此选项，则会抛出异常。`__destruct()` 方法会将日志消息以及一些基准测试信息写入目标文件。\n\
  \n**注意**：基准测试值只是估计值，基于日志记录初始化的时间以及与每条消息存储的时间戳。尽管如此，这些值对于调试仍然有用。\n\n得益于我们建立的事件系统，我们现在有了一个相当实用的插件架构。我们还有一个实用的\
  \ `Logger` 类，这将对未来的调试非常有帮助！\n\n## 问题\n\n1. `files()` 和 `thumbnails()` 操作都依赖于文件 I/O。我们如何让这些方法更高效？\n\
  2. 我们实际上并没有改变 `Imagine` 类的结构。如果我们能重写 `Imagine` 类使其符合我们的组织体系，对我们的应用程序来说难道不是更好吗？\n\
  3. 我们是否应该创建 `thumbnails()` 操作（以及类似的操作）来接受不同的 `$width`/$`height` 参数？\n4. PHP 可能不是为了非阻塞构建的，但是否可以将我们所有的类/函数都写成非阻塞，以避免同步执行的问题？\n\
  5. 我们构建了一个处理回调的类，但是否有任何常见的 PHP 函数支持回调作为延迟执行代码的手段？\n6. 鉴于 `Events` 类看起来与 `Registry`\
  \ 类非常相似，我们有什么什么不直接使用 `Registry` 类来存储回调的原因吗？\n\n### 回答\n\n1. 显而易见的答案是尽可能使用缓存。这可能意味着对具有一致字体/用户代理组合的字体请求进行缓存；也可能意味着在第一次读取缩略图后缓存现有缩略图的内容。\n\
  2. 如果时间和精力无限，重写库以匹配一致的主题或结构通常是首选。在这种情况下，我们只能将就现有的结构。这带来了一些奇怪的权衡（例如自动加载函数的位置），但我们能够不费费力地使用\
  \ `Imagine`。\n3. 是的，我们应该这样做。尽管这对于本节来说并不重要。\n4. 虽然可以使用回调来构建所有的类/函数，但这并不能避免代码的同步执行。PHP\
  \ 的某些方面仍然是阻塞的（例如文件 I/O、数据库、循环等）。这并不是因为我们无法使用回调，而是因为每个请求都是在单线程上处理的。我们可以允许使用更多线程，甚至在负载均衡器上运行多个\
  \ PHP 服务器，但这些方法都不能根本上解决问题。\n5. PHP 出现回调的概念已经很长时间了。它们并不总是那么优雅（通常是引用函数名的字符串），但在 PHP\
  \ 中传递另一个可执行代码块的引用并不多见。\n6. 我们没有使用 `Registry` 类纯粹是为了让事件与其他所有事物保持隔离。一旦我们开始共享同一个存储空间，我们就必须开始考虑命名方案，这会让我们的事件系统变得不必要地复杂。\n\
  \n### 练习\n\n1. 我们简单地讨论了使用缓存来避免昂贵的的 I/O。尝试在你的 `Files` 控制器中实现这些想法。对缓存和未缓存操作之间的差异进行基准测试可能也会用。\n\
  2. `Imagine` 自动加载函数的添加为向 `spl_autoload_register` 指定自动加载函数提供了一种替代方法。尝试修改 `Core` 类以使用类似的方法。\n\
  3. 尝试修改 `thumbnails()` 操作以允许自定义 `$width`/$height`，并修改 `fonts()` 操作以在单个请求中允许多种字体。\n\
  4. 我们学习了观察者模式的用处，但只构建了一个插件。尝试通过创建另一个使用它的插件来利用事件系统的威力。\n\n\n\n\n\nCMS 通常提供一个接口，用于添加其他管理用户，有时它甚至可以提供关于主网站使用情况的统计数据。我们在本章中构建的\
  \ CMS 将仅关注内容审查和用户创建的基础知识，将添加统计功能留作为一个练习。\n\n## 管理员\n\n只有管理员才能访问 CMS。管理员被定义为具有平均权限的用户，允许他们对次级安全网站拥有访问和控制权。在结构上，他们不需要与普通用户完全不同（在我们的案例中），通过\
  \ `User` 模型中的一个简单标记字段来区分。让我们看看在列表 20-1 中是如何定义它的。\n\n***Listing 20-1.*** 用户模型 Admin\
  \ 标记\n\n```php\nclass User extends Shared\\Model\n{\n    /**\n     * @column\n \
  \    * @readwrite\n     * @type boolean\n     */\n    protected $_admin = false;\n\
  }\n```\n\n`$_admin` 字段是一个简单的布尔字段，我们将用它来判断用户是否有权管理界面。我们为它提供了一个默认值，如果未提供管理员值，在行添加到数据库时将使用该值。\n\
  \n## 登录\n\n如果你在想是否需要为这些管理员用户创建一个完全独立的登录界面，答案简单来说，所有用户将通过同一个接口登录。我们不会创建一个独立的管理员网站，而是创建一组只有管理员才能访问的动作/视图（actions/views）。\n\
  \n不过，我确实需要对登录系统进行一些更改。回顾一下，登录代码 get 列表 20-2 所示。\n\n***Listing 20-2.*** 当前 login()\
  \ Action\n\n```php\nuse Framework\\Registry as Registry;\nuse Framework\\RequestMethods\
  \ as RequestMethods;\nuse Shared\\Controller as Controller;\n\nclass Users extends\
  \ Controller\n{\n    public function login()\n    {\n        if (RequestMethods::post(\"\
  login\"))\n        {\n            $email = RequestMethods::post(\"email\");\n  \
  \          $password = RequestMethods::post(\"password\");\n            $user =\
  \ User::first(array(\n                \"email = ?\" => $email,\n               \
  \ \"password = ?\" => $password,\n                \"live = ?\" => true,\n      \
  \          \"deleted = ?\" => false\n            ));\n\n            if (empty($email)\
  \ || empty($password) || empty($user))\n            {\n                $this->actionView->set(\"\
  password_error\", \"Email address and/or password are incorrect\");\n          \
  \  }\n            else\n            {\n                $session = Registry::get(\"\
  session\");\n                $this->user = $user;\n                self::redirect(\"\
  /profile.html\");\n            }\n        }\n    }\n}\n```\n\n`login()` 动作查找提交的表单数据并对其进行验证。如果数据验证失败，将向用户显示错误消息。如果数据通过验证并找到了有效的用户行，则将用户行保存到\
  \ session 中并分配给控制器。最后，`login()` 动作重定向到配置页面。这与当前的 `settings()` 动作类似，如列表 20-3 所示。\n\
  \n***Listing 20-3.*** 当前 settings() Action\n\n```php\nuse Framework\\Registry as\
  \ Registry;\nuse Framework\\RequestMethods as RequestMethods;\nuse Shared\\Controller\
  \ as Controller;\n\nclass Users extends Controller\n{\n    /**\n     * @before _secure\n\
  \     */\n    public function settings()\n    {\n        if (RequestMethods::post(\"\
  update\"))\n        {\n            $user = new User(array(\n                \"id\"\
  \ => $this->user->id,\n                \"first\" => RequestMethods::post(\"first\"\
  ),\n                \"last\" => RequestMethods::post(\"last\"),\n              \
  \  \"email\" => RequestMethods::post(\"email\"),\n                \"password\" =>\
  \ RequestMethods::post(\"password\"),\n                \"live\" => (boolean) RequestMethods::post(\"\
  live\"),\n                \"deleted\" => (boolean) RequestMethods::post(\"deleted\"\
  )\n            ));\n\n            if ($user->validate())\n            {\n      \
  \          $user->save();\n                $this->user = $user;\n              \
  \  $this->_upload(\"photo\", $user->id);\n                $this->actionView->set(\"\
  success\", true);\n            }\n            $this->actionView->set(\"errors\"\
  , $user->errors);\n        }\n    }\n}\n```\n\n同样，`settings()` 动作验证提交的表单数据，更新用户行，并将用户数据存储在\
  \ session 和控制器中。这些动作在大多数情况下是足够的，但我想要改进的是将未修改的用户对象同时保存到 session 和控制器中的这一点。我想进行以下更改：\n\
  \n- 整个用户对象不应直接存储在 session 中。我的意思是，我们不应该在 session 中保留密码和状态等详细信息，以防 session 数据被泄露。相反，我们应该做的是存储对用户行的引用，并在需要时从数据库或缓存中返回该用户行。\n\
  - 我们不需要通过同时将用户账户保存到 session 和控制器中来重复代码。诚然，我们需要在某处存储对用户的用户的引用（在 session 中），但它不需要在多个用户动作中进行。我们将编写一些代码来自动存储此引用。\n\
  \n为了实现这两个目标，我们需要使用在第 19 章中创建的事件，并且需要将它们添加到 `Shared\\Controller` 中。\n\n***Listing\
  \ 20-4.*** Shared\\Controller 中的事件\n\n```php\nnamespace Shared\n\n{\n\nuse Framework\\\
  Events as Events;\nuse Framework\\Router as Router;\nuse Framework\\Registry as\
  \ Registry;\n\nclass Controller extends \\Framework\\Controller\n{\n    public function\
  \ __construct($options = array())\n    {\n        parent::__construct($options);\n\
  \n        // connect to database\n        $database = Registry::get(\"database\"\
  );\n\n        // schedule: load user from session\n        Events::add(\"framework.router.beforehooks.before\"\
  , function($name, $parameters) {\n            $session = Registry::get(\"session\"\
  );\n            $controller = Registry::get(\"controller\");\n            $user\
  \ = $session->get(\"user\");\n            if ($user)\n            {\n          \
  \      $controller->user = \\User::first(array(\n                    \"id = ?\"\
  \ => $user\n                ));\n            }\n        });\n\n        // schedule:\
  \ save user to session\n        Events::add(\"framework.router.afterhooks.after\"\
  , function($name, $parameters) {\n            $session = Registry::get(\"session\"\
  );\n            $controller = Registry::get(\"controller\");\n            if ($controller->user)\n\
  \            {\n                $session->set(\"user\", $controller->user->id);\n\
  \            }\n        });\n\n        // schedule: disconnect from database\n \
  \       Events::add(\"framework.controller.destruct.after\", function($name) {\n\
  \            $database = Registry::get(\"database\");\n            $database->disconnect();\n\
  \        });\n    }\n\n    public function setUser($user)\n    {\n        $session\
  \ = Registry::get(\"session\");\n        if ($user)\n        {\n            $session->set(\"\
  user\", $user->id);\n        }\n        else\n        {\n            $session->erase(\"\
  user\");\n        }\n        $this->user = $user;\n    }\n}\n```\n\n\n\n\n我们不再将所有用户信息都保存到\
  \ session 中，而是只保存用户的 `id` 属性。\n\n这意味着当我们从 session 中提取引用时，也需要请求用户行数据，但这比将所有内容都存储在\
  \ session 中要好得多。我们也可以将用户行存储在缓存中，以节省额外数据库查询的开销，但目前这并不重要。\n\n现在我们需要处理一下那个 PHP 变 Bug。在第\
  \ 19 章中，我们添加了一个事件，使得数据库实例在不再被使用时断开连接（大约在触发 `framework.controller.destruct.after`\
  \ 事件时）。我们不会改变这种处理方法，但你可能会感到惊讶的是，这实际上并没有发生。\n\n你看到，由于 PHP 的执行机制（特别是垃圾回收的工作原理），对象会在请求周期结束时按照变量的定义顺序被销毁。此外，PHP\
  \ 解释器在垃圾回收对象之前，还会关闭所有正在使用的 PHP 模块。这意味着当我们调用我们的 `__destruct()` 方法时，所有的 PHP 模块已经关闭了，而\
  \ `framework.controller.destruct.after` 事件只会在 `Controller` 类的 `__destruct()` 方法中被调用。由于\
  \ MySQL 模块（在此情况下）已经关闭，`$database` 实例从未断开连接。噢，天哪！\n\n这个问题有一个解决方法，但它涉及到一些额外的代码。`__destruct()`\
  \ 魔法方法在对象被垃圾回收时会运行，当对象通过 `unset()` 语句被手动销毁时也会运行。如果我们希望 `__destruct()` 事件对我们具有任何实际用途，我们需要手动\
  \ `unset()` 这些对象，以便它们在所有模块关闭之前被触发。在 `Controller __destruct()` 方法的情况下，我们需要修改 `Router`\
  \ 类。看下列表 20-5 中我们是如何实现的。\n\n### 列表 20-5. 销毁 Controller\n\n```php\nnamespace Framework\n\
  \n{\n\nuse Framework\\Base as Base;\n\nuse Framework\\Events as Events;\nuse Framework\\\
  Registry as Registry;\nuse Framework\\Inspector as Inspector;\nuse Framework\\Router\\\
  Exception as Exception;\n\nclass Router extends Base\n\n{\n\nprotected function\
  \ _pass($controller, $action, $parameters = array())\n\n{\n\n$name = ucfirst($controller);\n\
  \n$this-> _controller = $controller;\n\n$this-> _action = $action;\n\nEvents::fire(\"\
  framework.router.controller.before\", array($controller, $parameters)); try\n\n\
  {\n\n$instance = new $name(array(\n\n\"parameters\" => $parameters\n\n));\n\nRegistry::set(\"\
  controller\", $instance);\n\n}\n\ncatch (\\Exception $e)\n\n{\n\nthrow new Exception\\\
  Controller(\"Controller {$name} not found\");\n\n}\n\nEvents::fire(\"framework.router.controller.after\"\
  , array($controller, $parameters));\n\nif (!method_exists($instance, $action))\n\
  \n{\n\n$instance->willRenderLayoutView = false;\n\n$instance->willRenderActionView\
  \ = false;\n\nthrow new Exception\\Action(\"Action {$action} not found\");\n\n}\n\
  \n$inspector = new Inspector($instance);\n\n$methodMeta = $inspector->getMethodMeta($action);\n\
  \nif (!empty($methodMeta[\"@protected\"]) || !empty($methodMeta[\"@private\"]))\n\
  \n{\n\nthrow new Exception\\Action(\"Action {$action} not found\");\n}\n\n$hooks\
  \ = function($meta, $type) use ($inspector, $instance)\n\n{\n\nif (isset($meta[$type]))\n\
  \n{\n\n$run = array();\n\nforeach ($meta[$type] as $method)\n\n\n\n{\n\n$hookMeta\
  \ = $inspector->getMethodMeta($method);\n\nif (in_array($method, $run) && !empty($hookMeta[\"\
  @once\"]))\n\n{\n\ncontinue;\n\n}\n\n$instance->$method();\n\n$run[] = $method;\n\
  \n}\n\n}\n\n}\n};\n\nEvents::fire(\"framework.router.beforehooks.before\", array($action,\
  \ $parameters)); $hooks($methodMeta, \"@before\");\n\nEvents::fire(\"framework.router.beforehooks.after\"\
  , array($action, $parameters)); Events::fire(\"framework.router.action.before\"\
  , array($action, $parameters)); call_user_func_array(array(\n\n$instance,\n\n$action\n\
  \n), is_array($parameters) ? $parameters : array());\n\nEvents::fire(\"framework.router.action.after\"\
  , array($action, $parameters)); Events::fire(\"framework.router.afterhooks.before\"\
  , array($action, $parameters));\n\n$hooks($methodMeta, \"@after\");\n\nEvents::fire(\"\
  framework.router.afterhooks.after\", array($action, $parameters));\n\n// unset controller\n\
  \nRegistry::erase(\"controller\");\n\n}\n\n}\n\n}\n\n\n```\n\n我们通过调用 `Registry`\
  \ 类上的 `erase()` 方法来销毁 controller。它反过来会销毁存储的 `Controller` 实例，这意味着 `__destruct()`\
  \ 方法将立即运行。在我们开始创建安全的动作/视图之前，我们需要做的最后一件事是创建一个方法……如列表 20-6 所示。\n\n### 列表 20-6. __admin()\
  \ 钩子\n\n```php\nnamespace Shared\n\n{\n\nuse Framework\\Events as Events;\nuse Framework\\\
  Router as Router;\nuse Framework\\Registry as Registry;\n\nclass Controller extends\
  \ \\Framework\\Controller\n\n{\n\n/**\n * @protected\n */\npublic function __admin()\n\
  \n{\n\nif (!$this->admin)\n\n{\n\nthrow new Router\\Exception(\"Not a valid admin\"\
  );\n}\n\n}\n```\n\n我们将使用这个 `__admin()` 方法作为一个钩子，它的含义很简单：如果用户的 `admin` 属性为真，用户将通过抛出异常重定向到\
  \ 404 错误页面。每个 CMS 都有一些共同元素。这些元素包括用于添加、编辑、查看和删除的接口。让我们从 `Users` 控制器开始。\n\n### 列表\
  \ 20-7. edit()/view() Actions\n\n```php\nuse Framework\\Registry as Registry;\n\
  use Framework\\RequestMethods as RequestMethods;\nuse Shared\\Controller as Controller;\n\
  \nclass Users extends Controller\n\n{\n\n/**\n * @before _secure, _admin\n */\n\
  public function edit($id)\n\n{\n\n$errors = array();\n\n$user = User::first(array(\n\
  \n\"id = ?\" => $id\n\n));\n\nif (RequestMethods::post(\"save\"))\n\n{\n\n$user->first\
  \ = RequestMethods::post(\"first\");\n\n$user->last = RequestMethods::post(\"last\"\
  );\n\n$user->email = RequestMethods::post(\"email\");\n\n$user->password = RequestMethods::post(\"\
  password\");\n\n$user->live = (boolean) RequestMethods::post(\"live\");\n\n$user->admin\
  \ = (boolean) RequestMethods::post(\"admin\");\n\nif ($user->validate())\n\n{\n\n\
  $user->save();\n\n$this->actionView->set(\"success\", true);\n\n}\n\n$errors = $user->errors;\n\
  \n}\n\n$this->actionView\n->set(\"user\", $user)\n->set(\"errors\", $errors);\n\n\
  }\n\n/**\n * @before _secure, _admin\n */\npublic function view()\n\n{\n\n$this->actionView->set(\"\
  users\", User::all());\n\n}\n\n}\n```\n\n我们添加的两个动作负责更新和列出用户行。`edit()` 动作与 `settings()`\
  \ 动作非常相似，只是允许两个新的表单字段（`live` 和 `admin`）。`view()` 更简单，将所有用户行返回到视图。为了让这些动作成功路由，我们需要在\
  \ `public/routes.php` 文件中添加一些额外的路由，如列表 20-8 所示。\n\n### 列表 20-8. public/routes.php\
  \ (Extract)\n\n```php\n// define routes\n\n$routes = array(\n\narray(\n\n\"pattern\"\
  \ => \"users/edit/:id\",\n\n\"controller\" => \"users\",\n\n\"action\" => \"edit\"\
  \n\n),\n\narray(\n\n\"pattern\" => \"users/delete/:id\",\n\n\"controller\" => \"\
  users\",\n\n\"action\" => \"delete\"\n\n),\n\n);\n\n```\n\n\n\n\n```php\narray(\n\
  \"pattern\" => \"users/undelete/:id\",\n\"controller\" => \"users\",\n\"action\"\
  \ => \"undelete\"\n),\n\narray(\n\"pattern\" => \"files/delete/:id\",\n\"controller\"\
  \ => \"files\",\n\"action\" => \"delete\"\n),\n\narray(\n\"pattern\" => \"files/undelete/:id\"\
  ,\n\"controller\" => \"files\",\n\"action\" => \"undelete\"\n)\n);\n```\n\n你会注意到，我们还为\
  \ `delete()`/`undelete()` 操作添加了路由，它们看起来类似于列表 20-9 所示。\n\n**列表 20-9.** `delete()`/`undelete()`\
  \ 操作\n\n```php\nuse Framework\\Registry as Registry;\n\nuse Framework\\RequestMethods\
  \ as RequestMethods;\n\nuse Shared\\Controller as Controller;\n\nclass Users extends\
  \ Controller\n{\n    /**\n     * @before _secure, _admin\n     */\n    public function\
  \ delete($id)\n    {\n        $user = User::first(array(\n            \"id = ?\"\
  \ => $id\n        ));\n\n        if ($user)\n        {\n            $user->live\
  \ = false;\n            $user->save();\n        }\n\n        self::redirect(\"/users/view.html\"\
  );\n    }\n\n    /**\n     * @before _secure, _admin\n     */\n    public function\
  \ undelete($id)\n    {\n        $user = User::first(array(\n            \"id = ?\"\
  \ => $id\n        ));\n\n        if ($user)\n        {\n            $user->live\
  \ = true;\n            $user->save();\n        }\n\n        self::redirect(\"/users/view.html\"\
  );\n    }\n}\n```\n\n`delete()`/`undelete()` 操作会修改用户行的 `live` 属性，因此它们并不会实际删除行，而是将其从主应用程序视图中隐藏。这两个方法都会重定向回用户列表。现在，让我们来看一眼视图模板，首先从\
  \ `application/views/users/view.html` 模板开始，如列表 20-10 所示。\n\n**列表 20-10.** application/views/users/view.html\n\
  \n```html\n<h1>View Users</h1>\n<table>\n    <tr>\n        <th>Name</th>\n     \
  \   <th>Change</th>\n    </tr>\n    {foreach $_user in $users}\n    <tr>\n     \
  \   <td>{echo $_user->first} {echo $_user->last}</td>\n        <td>\n          \
  \  <a href=\"/users/edit/{echo $user->id}.html\">edit</a>\n            {if $user->deleted}\n\
  \                <a href=\"/users/undelete/{echo $user->id}.html\">delete</a>\n\
  \            {/if}\n            {else}\n                <a href=\"/users/delete/{echo\
  \ $user->id}.html\">delete</a>\n            {/else}\n        </td>\n    </tr>\n\
  \    {/foreach}\n</table>\n```\n\n用户列表与 `application/views/users/search.html` 模板类似，不同在于它没有搜索区域。`edit()`\
  \ 操作模板看起来应该像列表 20-11 所示。\n\n**列表 20-11.** application/views/users/edit.html\n\n\
  ```html\n<h1>Edit User</h1>\n{if isset($success)}\n    The user has been updated!\n\
  {/if}\n{else}\n    <form method=\"post\">\n        <ol>\n            <li>\n    \
  \            <label>First name:\n                <input type=\"text\" name=\"first\"\
  \ value=\"{echo $user->first}\"/>\n                {Shared::errors($errors, \"first\"\
  )}\n                </label>\n            </li>\n            <li>\n            \
  \    <label>Last name:\n                <input type=\"text\" name=\"last\" value=\"\
  {echo $user->last}\"/>\n                {Shared::errors($errors, \"last\")}\n  \
  \              </label>\n            </li>\n            <li>\n                <label>Email:\n\
  \                <input type=\"text\" name=\"email\" value=\"{echo $user->email}\"\
  />\n                {Shared::errors($errors, \"email\")}\n                </label>\n\
  \            </li>\n            <li>\n                <label>Password:\n       \
  \         <input type=\"password\" name=\"password\" value=\"{echo $user->password}\"\
  />\n                {Shared::errors($errors, \"password\")}\n                </label>\n\
  \            </li>\n            <li>\n                <label>Live:\n           \
  \     <input type=\"checkbox\" name=\"live\" {if $user->live}checked{/if}/>\n  \
  \              </label>\n            </li>\n            <li>\n                <label>Admin:\n\
  \                <input type=\"checkbox\" name=\"admin\" {if $user->admin}checked{/if}/>\n\
  \                </label>\n            </li>\n            <li>\n               \
  \ <input type=\"submit\" name=\"save\" value=\"save\"/>\n            </li>\n   \
  \     </ol>\n    </form>\n{/else}\n```\n\n用户编辑视图与注册/设置模板类似，但也包含了 `live`/`admin`\
  \ 字段。在这里包含这些字段是可以没问题的，因为只有管理员才能进入这里。我们还自动填充了字段值。我们还应该在导航模板中添加管理员链接，如列表 20-12 所示。\n\
  \n**列表 20-12.** application/views/navigation.html\n\n```html\n<a href=\"/\">home</a>\n\
  <a href=\"/search\">search</a>\n{if isset($user)}\n    <a href=\"/profile\">profile</a>\n\
  \    <a href=\"/settings\">settings</a>\n    <a href=\"/logout\">logout</a>\n{if\
  \ $user->admin}\n    <a href=\"/users\">users</a>\n    <a href=\"/files\">files</a>\n\
  {/if}\n{/if}\n```\n\n用户编辑视图与注册/设置模板类似，但也包含了 `live`/`admin` 字段。在这里包含这些字段是可以没问题的，因为只有管理员才能进入这里。我们还自动填充了字段值。我们还应该在导航模板中添加管理员链接，如列表\
  \ 20-12 所示。\n\n*(注：由于提供的原文在列表 20-12 之后似乎有逻辑截断或重复，根据指令要求，我已对给出的英文文本部分完成了翻译。如果后续有更多文本，请继续提供。)*\n\
  \n\n\n\n```html\n{if $file-> deleted}\n<a href = \"/files/undelete/{echo $file->\
  \ id}.html\" > undelete</a>\n{/if}\n{else}\n<a href = \"/files/delete/{echo $file->\
  \ id}.html\" > delete</a>\n{/else}\n</td></tr>{/foreach}\n</table\n```\n\n此模板允许管理员查看用户上传的文件缩略图，并删除/恢复那些他们认为需要更改的文件。这意味着我们现在可以查看/编辑用户以及他们上传的照片，从而完成了管理社交网络所需要做的工作。\n\
  \n## Questions\n\n1. 在之前的章节中，我们将用户的所有信息存储在会话（session）变量中，但在本章中，我们将其精简为仅存储用户的 `id`\
  \ 属性。你能想出这种方法的任何优点吗？\n\n2. 在本章中，我们还通过重写/修改一些 `Shared\\Controller` 方法，开发了一种自动在会话存储存储的方法。你能想出这种方法的任何优点吗？\n\
  \n3. 你能想出其他我们可以为之构建管理界面的用户提交数据吗？\n\n## Answers\n\n1. 除了在会话变量中不保留电子邮件地址和密码等项目所带来的安全益处外，它还以额外的数据库查询为代价加速了存储/检索。我们也可以使用缓存（cache）来减少这些额外的查询。\n\
  \n2. 我们看到这种自动存储/检索帮助我们处理用户会话，而无需在每次处理时都去获取/设置会话细节的麻烦。这对我们的登录、注销、设置和个人资料操作/视图都有利。当我们需要获取或设置任何用户会话信息时，这非常有帮助。\n\
  \n3. 我们为用户和文件构建了管理界面，但我们也可以为消息和统计数据构建。空间是无限！\n\n336\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 20 章 ■ 管理\n\n## Exercises\n\n1. 随着存储用户会话方式的变化，用户账户信息的数据库查询也增加了。尝试将这些信息存储在缓存中，并在每个页面加载时从缓存中检索，而不是额外的数据库查询。只需注意保持会话信息的安全！\n\
  \n2. 在第 16 章中，我们使用了原始的分页形式，并忽略了在我们的管理界面中添加分页。尝试实现相同的原始分页，甚至是更具创意的东西。\n\n3. 我们在 `files/view`\
  \ 操作中显示缩略图，但如果点击缩略图可以跳转到上传文件的较大版本将会更好。也许可以使用某种形式的 JavaScript 灯箱（lightbox）效果。尝试实现它。\n\
  \n337\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n# 第 21 章：测试\n\n随着我们的示例应用程序进展顺利，我们再次需要将注意力转向测试主题。你可能会发现，测试抽象代码比测试应用程序逻辑容易得多。此外，我们需要执行的测试需要一种通过代码难以模拟的交互水平。\n\
  \n## Goals\n\n- 我们需要测试各种输入表单的格式。\n- 我们需要测试与这些表单的各种交互的结果。\n\n我们测试表单有效性的许多方法之一是检查返回的\
  \ HTML 体中的某些元素。为了做到这一点，我们需要利用 `Request` 类（用于向我们应用程序内的页面发送各种 HTTP 请求），并且我们需要评估 `Request`\
  \ 类返回的 HTML，以确定是否提供了某些输入字段。\n\n这两个目标可以使用列表 21-1 显示的函数实现。\n\n### Listing 21-1. 使用\
  \ Request 测试\n\n```php\n$get = function($url)\n{\n    $request = new Framework\\\
  Request();\n    return $request->get(\"http://\".$_SERVER[\"HTTP_HOST\"].\"/{$url}\"\
  );\n};\n\n$has = function($html, $fields)\n{\n    foreach ($fields as $field)\n\
  \    {\n        if (!stristr($html, \"name = \\\"{$field}\\\"\"))\n        {\n \
  \           return false;\n        }\n    }\n    return true;\n};\n```\n\n第一个函数仅创建一个新的\
  \ `Request` 实例并向 localhost 内的路径发送 GET 请求。如果你将示例应用程序设置在不同的主机名下，请务必相应调整此函数。\n\n339\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 21 章 ■ 测试\n\n第二个函数遍历字段名称数组，检查它们是否包含在提供的\
  \ `$html` 字符串中。它将其转换为 `\"name = \\\"{$field}\\\"` 格式，目标表单字段。有了这些函数，我们可以为示例应用程序的各种表单编写测试，如列表\
  \ 21-2 所示。\n\n### Listing 21-2. 测试表单字段\n\n```php\nFramework\\Test::add(\n    function()\
  \ use ($get, $has)\n    {\n        $html = $get(\"register.html\");\n        $status\
  \ = $has($html, array(\n            \"first\",\n            \"last\",\n        \
  \    \"email\",\n            \"password\",\n            \"photo\",\n           \
  \ \"register\"\n        ));\n        return $status;\n    },\n    \"注册表单包含必需字段\"\
  ,\n    \"Forms/Users\"\n);\n\nFramework\\Test::add(\n    function() use ($get, $has)\n\
  \    {\n        $html = $get(\"login.html\");\n        $status = $has($html, array(\n\
  \            \"email\",\n            \"password\"\n        ));\n        return $status;\n\
  \    },\n    \"登录表单包含必需字段\",\n    \"Forms/Users\"\n);\n\nFramework\\Test::add(\n\
  \    function() use ($get, $has)\n    {\n        $html = $get(\"search.html\");\n\
  \        $status = $has($html, array(\n            \"query\",\n            \"order\"\
  ,\n            \"direction\",\n            \"page\",\n            \"limit\",\n \
  \           \"search\"\n        ));\n        return $status;\n    },\n    \"搜索表单包含必需字段\"\
  ,\n    \"Forms/Users\"\n);\n```\n\n\n\n\n## 2. 是否有理由避免测试需要用户登录的表单？\n\n## 3. 我们还有哪些其他方法可以测试我们的应用程序？\n\
  \n### 回答\n\n1. 表单中包含的字段指示了用户想要执行的操作。虽然字段可能会随时间变化，但这是判断某些是否破坏了每个表单的基本结构的好方法。\n\n\
  2. 相反，我们应该测试所有能接触到的东西。问题在于会话管理与我们的 `Request` 类之间的冲突。即使在没有额外代理的情况下，会话管理也非常复杂，这为需要有效、安全会话的测试带来了问题。\n\
  \n3. 我们还有很多没有测试的内容。其中一个相对容易测试的内容是提交的表单数据的有效性。我们可以刻意提供无效的表单数据，并检查响应中是否有有关无效数据的验证错误消息。另一个我们可以测试的是界面元素的存在（例如跨多个页面的一致性导航菜单）。\n\
  \n342\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n第 21 章 ■ 测试\n\n### 练习\n\
  \n1. 在本章中，我们只测试了可能发生的两种错误。尝试为表单字段验证编写一些测试。\n\n2. 在第 11 章中，我们开始为框架类创建测试。如果你已经有表示这些测试的地方，尝试将这些新测试集成到那里。\n\
  \n343\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n# 第 22 章：CodeIgniter：引导\n\
  \nCodeIgniter 是本书中审查的三个框架中的第一个。可以说，它是这三个中最不受欢迎、体积最小、最快（在比较测试中）且最简单的。它由 EllisLab\
  \ ([`ellislab.com`](http://ellislab.com)) 创建并维护。\n\n我们在书中剩余章节中的目标是复制我们在社交网络中创建的大部分功能，试图试图理解这些框架与我们自身之间的某些差异。这将提供一个评估每个框架优点的机会，以便你更好地决定哪种框架适合你所承担的\
  \ PHP MVC 项目。\n\n## 目标\n\n- 我们需要理解 CodeIgniter 的哲学和优势。\n- 我们需要回顾 CodeIgniter 应用中\
  \ URL 重写的要求。\n- 我们需要创建几个 CodeIgniter 路由，允许我们访问在后续章节中创建的控制器、操作和视图。\n\n### 为什么选择 CodeIgniter？\n\
  \n正如我提到的，CodeIgniter 的代码库相对小且简单。这是由于其目标之一，即保持框架的精简。这是通过极少量的自动化以及框架随附的有限库集实现的。\n\n\
  凭借良好的代码规范和较小的代码库，意味着操作的平均执行时间相当低。这可能并不总是如此，特别是在执行密集型操作时。\n\nCodeIgniter 的文档非常出色。它不仅仅是\
  \ API 文档，还为开发者提供了对框架内 MVC 实际实现的的理解，并为开发者在深入 CodeIgniter 时遇到的最常见问题提供了大量的代码示例。\n\n\
  - **注意**：你可以在 [`codeigniter.com/user_guide/`](http://codeigniter.com/user_guide/)\
  \ 找到 CodeIgniter 文档。\n\n在决定是否在下一个项目中使用 CodeIgniter 时，考虑 CodeIgniter 适用的应用程序类型会有帮助。CodeIgniter\
  \ 非常适合不需要使用第三方库且功能较少的中小型应用程序。这并不是因为添加额外的第三方库很 345 困难，而是因为 CodeIgniter 随带了仅针对最常见需求的少量库。\n\
  \n345\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n第 22 章 ■ CodEIgnITER：引导\n\
  \n### 为什么不选择 CodeIgniter？\n\nCodeIgniter 不包含任何自动化构建工具。这些是用于创建伴随 MVC 框架的所有常规组件的脚本，将只有棘手的部分留给开发者关注。如果你是\
  \ MVC 的新手，那么这并不是一个你会想念的东西。\n\nCodeIgniter 一直是开源的，但该框架向公共贡献的时间并不长。由于项目非常活跃，这种情况仍在持续。\n\
  \n- **注意**：你可以在 [`github.com/CodeIgniter`](https://github.com/CodeIgniter) 为 CodeIgniter\
  \ 贡献。\n\n## URL 重写\n\n我们在 CodeIgniter 应用中需要的 URL 重写机制与我们的非常相似。\n\n```apache\nRewriteEngine\
  \ on\nRewriteCond %{REQUEST_FILENAME} !^(index\\.php|images|robots\\.txt)\nRewriteRule\
  \ ^(.*)$ /index.php/$1 [L]\n```\n\n- **注意**：你可以在 [codeigniter.com/user_guide/](http://codeigniter.com/user_guide/)\
  \ 找到更多关于此 .htaccess 文件的细节。\n\n## 路由\n\n在 CodeIgniter 中，路由以关联数组格式的键值对形式定义。该配置文件通常位于\
  \ `application/config/routes.php` 中，并且应该类似于所示。\n\n在某些路由中，我们使用了像 `(:num)`、`(:any)`\
  \ 和 `$1` 的内容。这些用于将路由转换为正则表达式。CodeIgniter 使用正则表达式匹配来确定执行的正确控制器和操作，与我们的框架一样。`(:num)`\
  \ 和 `(:any)` 匹配到的值将作为参数发送给操作。\n\n```php\n//  22-2: application/config/routes.php\n\
  $route['default_controller'] = \"welcome\";\n$route['404_override'] = '';\n\n//\
  \ 自定义路由\n$route['register'] = 'users/register';\n$route['login'] = 'users/login';\n\
  $route['logout'] = 'users/logout';\n$route['search'] = 'users/search';\n$route['profile']\
  \ = 'users/profile';\n$route['settings'] = 'users/settings';\n$route['friend/(:num)']\
  \ = 'users/friend/$1';\n$route['unfriend/(:num)'] = 'users/unfriend/$1';\n$route['users/edit/(:num)']\
  \ = 'users/edit/$1';\n$route['users/delete/(:num)'] = 'users/delete/$1';\n$route['users/undelete/(:num)']\
  \ = 'users/undelete/$1';\n$route['fonts/(:any)'] = 'files/fonts/$1';\n$route['thumbnails/(:num)']\
  \ = 'files/thumbnails/$1';\n$route['files/delete/(:num)'] = 'files/delete/$1';\n\
  $route['files/undelete/(:num)'] = 'files/undelete/$1';\n```\n\n前两个路由是自动我们定义的。第一个用于展示新的\
  \ CodeIgniter 安装的默认落地页。第二个仅仅是为缺失的控制器、操作或视图指定自定义错误页面的方法。\n\n\n\n\n\n如果你尝试访问这些新路由中的任何一个，将会看到错误。这是因为我们还没有创建相应的控制器（controllers）、操作（actions）等。在第\
  \ 23 章中，我们将创建大多数这些路由正常运行所需的控制器、模型和视图。\n\n**注意** 你可以在 [`codeigniter.com/user\\_guide/general/routing.html`](http://codeigniter.com/user_guide/general/routing.html)\
  \ 找到有关此配置配置文件的更多详细信息。\n\n## 问题\n\n1. 在第 21 章中，我们学习了 CodeIgniter 如何通过在每个文件中的一行代码来保护应用程序和系统类文件。我们的框架通过将所有\
  \ Web 请求限制在 public 文件夹中以不同的方式处理此。这意味着 CodeIgniter 做错了吗？\n\n2. 在第 4 章中，我们讨论了关联数组配置与\
  \ INI 配置之间的差异。我们如何用 INI 配置格式表示相同的路由？\n\n## 第 22 章 ■ CodeIgniter：启动 (BooTsTRAPPIng)\n\
  \n### 答案\n\n1. 负责 CodeIgniter 开发的核心团队在应用这种安全技术方面非常详尽。问题不在于他们的系统是不安全的，而在于保护它需要结合\
  \ Apache 安全性以及在每个类文件中添加安全代码。这并不意味着如果我们决定将此安全检查添加到我们的框架中，它就会是一件坏事，而是如果忘记将其添加到任何 CodeIgniter\
  \ 应用程序类文件中可能会导致安全漏洞。\n\n2. 处理这个问题有很多方法，但最简单的方法是使用类似于列表 22-3 所示的格式。\n\n***Listing\
  \ 22-3.*** INI 路由配置\n\n```\nroute[register] = users/register\nroute[login] = users/login\n\
  route[logout] = users/logout\n...\nroute[thumbnails/:id] = files/thumbnails/:id\n\
  route[files/delete/:id] = files/delete/:id\nroute[files/undelete/:id] = files/undelete/:id\n\
  ```\n\n### 练习\n\n1. 在本章，我们创建了示例应用程序所需的所有路由。现在尝试创建一个使用用户名来调用 `users/profile` 操作的路由。\n\
  \n2. 在没有任何控制器和操作的情况下拥有这些路由对我们没有太大帮助。尝试创建一个控制器和操作来处理我们定义的几个路由。\n\n# 第 23 章：CodeIgniter：MVC\n\
  \n我们在 CodeIgniter 上有一堆工作要做。它确实为我们提供了控制器、模型和视图，用以构建我们社交网络所需的所有功能，但它们仅仅是空容器。\n\n我们已经习惯了在模型中使用\
  \ ORM，但 CodeIgniter 并没有提供这些功能。我们也习惯了在控制器中使用自动加载的类，但 CodeIgniter 却让我们自己加载自己的类。我们习惯在视图中使用丰富的模板语言，但\
  \ CodeIgniter 只提供了一个简陋的模板解析器，甚至鼓励在视图模板中直接使用 PHP。\n\n## 目标\n\n- 当为我们的示例应用程序创建控制器、模型和视图时，我们需要识别我们的框架与\
  \ CodeIgniter 之间的差异。\n- 我们需要为用户、朋友、文件和消息创建模型。\n- 我们需要创建相应的视图和控制器。\n\n## 差异\n\n我已经提到了\
  \ CodeIgniter 和我们框架之间的三点差异，但还有一些我们需要考虑的内容。首先，CodeIgniter 确实有表单验证，但它与模型之间没有任何关联。实际上，它建议在控制器中进行验证。\n\
  \n其次，CodeIgniter 提供了一个表单构建类（form builder class），我们可以用它来加速视图的开发。\n\n此外，我们能够在不将验证错误消息赋值给视图的情况下访问它们。\n\
  \n## 模型\n\n为我们的示例应用程序创建模型将是一项工作。我们无法访问在框架中习惯使用的 ORM，因此我们必须手动为每个模型构建数据库查询。\n\nCodeIgniter\
  \ 通过提供一个表达丰富的查询生成器（类似于我们为框架构建的那个）来帮助我们。\n\n我们首先开始定义 `User` 模型，如列表 23-1 所示。\n\n***Listing\
  \ 23-1.*** application/models/user.php (节录)\n\n```php\nclass User extends CI_Model\n\
  {\n    public $id;\n    public $live = true;\n    public $deleted = false;\n   \
  \ public $created;\n    public $modified;\n    public $first;\n    public $last;\n\
  \    public $email;\n    public $password;\n\n    protected function _populate($options)\n\
  \    {\n        // 设置所有现有属性\n        foreach ($options as $key => $value)\n    \
  \    {\n            if (property_exists($this, $key))\n            {\n         \
  \       $this->$key = $value;\n            }\n        }\n    }\n\n    public function\
  \ __construct($options = array())\n    {\n        // 成为良好的子类\n        parent::__construct();\n\
  \        // 填充值\n        if (sizeof($options))\n        {\n            $this->_populate($options);\n\
  \        }\n        // 加载行\n        $this->load();\n    }\n\n    public function\
  \ load()\n    {\n        if ($this->id)\n        {\n            $query = $this->db->where(\"\
  id\", $this->id)->get(\"user\");\n            if ($row = $query->row())\n      \
  \      {\n                $this->_populate((array) $row);\n            }\n     \
  \   }\n    }\n}\n```\n\n这个 `User` 模型与我们为框架创建的非常相似，包含了所有的字段。CodeIgniter 拥有库来操作表的结构，可以通过运行列表\
  \ 23-2 所示的 SQL 实现。\n\n***Listing 23-2.*** user 表\n\n```sql\nCREATE TABLE user (\n\
  \    id int(11) NOT NULL AUTO_INCREMENT,\n    live int(4) DEFAULT NULL,\n    deleted\
  \ int(4) DEFAULT NULL,\n    created datetime DEFAULT NULL,\n    modified datetime\
  \ DEFAULT NULL,\n    first varchar(32) DEFAULT NULL,\n    last varchar(32) DEFAULT\
  \ NULL,\n    email varchar(100) DEFAULT NULL,\n    password varchar(32) DEFAULT\
  \ NULL,\n    PRIMARY KEY (id)\n) ENGINE = InnoDB CHARSET = utf8;\n```\n\n为了从数据库获取用户行，我们只需要运行与框架中相同的代码，如列表\
  \ 23-3 所示。\n\n***Listing 23-3.*** 获取 User\n\n```php\n$this->user = new User(array(\n\
  \    \"id\" => $id\n));\n```\n\n我们需要向这个 `User` 模型添加一些其他方法，你可以在列表 23-4 中看到。\n\n***Listing\
  \ 23-4.*** application/models/user.php (节录)\n\n```php\nclass User extends CI_Model\n\
  {\n    public function save()\n    {\n        // 初始化数据\n        $data = array(\n\
  \            \"live\" => (int) $this->live,\n            \"deleted\" => (int) $this->deleted,\n\
  \            \"modified\" => date(\"Y-m-d H:i:s\"),\n            \"first\" => $this->first,\n\
  \            \"last\" => $this->last,\n            \"email\" => $this->email,\n\
  \            \"password\" => $this->password\n        );\n\n        // 更新\n    \
  \    if ($this->id)\n        {\n            $where = array(\"id\" => $this->id);\n\
  \            return $this->db->update(\"user\", $data, $where);\n        }\n\n \
  \       // 插入\n        $data[\"created\"] = date(\"Y-m-d H:i:s\");\n        $this->id\
  \ = $this->db->insert(\"user\", $data);\n\n        // 返回插入的 id\n        return $this->id;\n\
  \    }\n\n    public static function first($where)\n    {\n        $user = new User();\n\
  \        // 获取第一个用户\n        $user->db->where($where);\n        $user->db->limit(1);\n\
  \        $query = $user->db->get(\"user\");\n\n        // 初始化数据\n        $data =\
  \ $query->row();\n        $user->_populate((array) $data);\n\n        // 返回用户\n\
  \        return $user;\n    }\n\n    public static function count($where)\n    {\n\
  \        $user = new User();\n    }\n}\n```\n\n\n\n\n\n```php\n$user->db->where($where);\n\
  \nreturn $user->db->count_all_results(\"user\");\n\n}\n```\n\n352\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 23 章 ■ CodeIgniter: MVC\n\n```php\npublic static function all($where = null,\
  \ $fields = null, $order = null, $direction = \"asc\", $limit = null, $page = null)\n\
  {\n    $user = new User();\n\n    // 选择字段\n    if ($fields)\n    {\n        $user->db->select(join(\"\
  ,\", $fields));\n    }\n\n    // 缩小搜索范围\n    if ($where)\n    {\n        $user->db->where($where);\n\
  \    }\n\n    // 结果排序\n    if ($order)\n    {\n        $user->db->order_by($order,\
  \ $direction);\n    }\n\n    // 限制结果\n    if ($limit && $page)\n    {\n        $offset\
  \ = ($page - 1) * $limit;\n        $user->db->limit($limit, $offset);\n    }\n\n\
  \    // 获取用户\n    $query = $user->db->get(\"user\");\n    $users = array();\n  \
  \  foreach ($query->result() as $row)\n    {\n        // 创建 + 填充用户\n        $user\
  \ = new User();\n        $user->_populate($row);\n\n        // 将用户加入数组\n       \
  \ array_push($users, $user);\n    }\n    return $users;\n}\n}\n```\n\n这些方法与我们在 `Model`\
  \ 类中定义的方法非常相似，并执行了我们在控制器中所需的各种数据库查询。当我们考虑到 CodeIgniter 并没有认同我们关于连接器和查询的想法，而是实现了它自己的数据库查询系统时，事情开始与我们习惯的有所。不过，CodeIgniter\
  \ 确实支持链式调用，所以并不是全那么糟！\n\n353-\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 23 章 ■ CodeIgniter: MVC\n\n## 控制器 (Controllers)\n\n有了我们的 `User` 模型，我们可以开始编写\
  \ `Users` 控制器，如列表 23-5 所示。\n\n***列表 23-5.*** application/controllers/users.php (节录)\n\
  \n```php\nclass Users extends CI_Controller\n{\n    public $user;\n\n    public\
  \ static function redirect($url)\n    {\n        header(\"Location: {$url}\");\n\
  \        exit();\n    }\n\n    protected function _isSecure()\n    {\n        //\
  \ 获取用户会话\n        $this->_getUser();\n        if (!$this->user)\n        {\n   \
  \         self::redirect(\"/login\");\n        }\n    }\n\n    protected function\
  \ _getUser()\n    {\n        // 加载会话库\n        $this->load->library(\"session\"\
  );\n        // 获取用户 ID\n        $id = $this->session->userdata(\"user\");\n    \
  \    if ($id)\n        {\n            // 加载用户模型\n            $this->load->model(\"\
  user\");\n            // 获取用户\n            $this->user = new User(array(\n     \
  \           \"id\" => $id\n            ));\n        }\n    }\n}\n```\n\n354\n\n\
  [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 23 章 ■ CodeIgniter: MVC\n\n\
  `Users` 控制器的开头非常简单，包含了与我们在框架中类似的“钩子”（hook）方法。`_getUser()` 方法访问会话以检索用户 ID，并加载 `User`\
  \ 模型以检索用户行。我们继续处理 `register()` 操作和下一个视图，如列表 23-6 和 23-7 所示。\n\n***列表 23-6.*** application/controllers/users.php\
  \ (节录)\n\n```php\nclass Users extends CI_Controller\n{\n    //...\n    public function\
  \ register()\n    {\n        $success = false;\n        // 加载验证库\n        $this->load->library(\"\
  form_validation\");\n        // 如果表单已提交\n        if ($this->input->post(\"save\"\
  ))\n        {\n            // 初始化验证规则\n            $this->form_validation->set_rules(array(\n\
  \                array(\n                    \"field\" => \"first\",\n         \
  \           \"label\" => \"First\",\n                    \"rules\" => \"required|alpha|min_length[3]|max_length[32]\"\
  \n                ),\n                array(\n                    \"field\" => \"\
  last\",\n                    \"label\" => \"Last\",\n                    \"rules\"\
  \ => \"required|alpha|min_length[3]|max_length[32]\"\n                ),\n     \
  \           array(\n                    \"field\" => \"email\",\n              \
  \      \"label\" => \"Email\",\n                    \"rules\" => \"required|max_length[100]\"\
  \n                ),\n                array(\n                    \"field\" => \"\
  password\",\n                    \"label\" => \"Password\",\n                  \
  \  \"rules\" => \"required|min_length[8]|max_length[32]\"\n                )\n \
  \           ));\n            // 如果表单数据通过验证...\n            if ($this->form_validation->run())\n\
  \            {\n                // 加载用户模型\n                $this->load->model(\"\
  user\");\n                // 创建新用户 + 保存\n                $user = new User(array(\n\
  \                    \"first\" => $this->input->post(\"first\"),\n             \
  \       \"last\" => $this->input->post(\"last\"),\n                    \"email\"\
  \ => $this->input->post(\"email\"),\n                    \"password\" => $this->input->post(\"\
  password\")\n                ));\n                $user->save();\n             \
  \   // 在视图中成功\n                $success = true;\n            }\n        }\n    \
  \    // 加载视图\n        $this->load->view(\"register\", array(\n            \"success\"\
  \ => $success\n        ));\n    }\n}\n```\n\n***列表 23-7.*** application/views/register.php\n\
  \n```html\n<h1>Register</h1>\n<?php if ($success): ?>\n    Your account has been\
  \ created!\n<?php else: ?>\n<form method=\"post\" enctype=\"multipart/form-data\"\
  >\n    <ol>\n        <li>\n            <label>\n                First name:\n  \
  \              <input type=\"text\" name=\"first\" />\n                <?php echo\
  \ form_error(\"first\"); ?>\n            </label>\n        </li>\n        <li>\n\
  \            <label>\n                Last name:\n                <input type=\"\
  text\" name=\"last\" />\n                <?php echo form_error(\"last\"); ?>\n \
  \           </label>\n        </li>\n        <li>\n            <label>\n       \
  \         Email:\n                <input type=\"text\" name=\"email\" />\n     \
  \           <?php echo form_error(\"email\"); ?>\n            </label>\n       \
  \ </li>\n        <li>\n            <label>\n                Password:\n        \
  \        <input type=\"password\" name=\"password\" />\n                <?php echo\
  \ form_error(\"password\"); ?>\n            </label>\n        </li>\n        <li>\n\
  \            <input type=\"submit\" name=\"save\" value=\"register\" />\n      \
  \  </li>\n    </ol>\n</form>\n<?php endif; ?>\n```\n\n\n\n\n\n```php\npublic function\
  \ logout()\n{\n    // 加载 session 库\n    $this->load->library(\"session\");\n\n \
  \   // 移除用户 ID\n    $this->session->unset_userdata(\"user\");\n\n    // 重定向到登录\n\
  \    self::redirect(\"/login\");\n}\n\npublic function profile()\n{\n    // 检查用户\
  \ session\n    $this->_isSecure();\n\n    // 加载视图\n    $this->load->view(\"users/profile\"\
  , array(\n        \"user\" => $this->user\n    ));\n}\n```\n\n**列表 23-11. application/views/users/profile.php**\n\
  \n```html\n<h1><?php echo $user->first; ?><?php echo $user->last; ?></h1> \n这是一个个人资料页！\n\
  ```\n\n`logout()` 动作简单地从 session 中移除用户 ID，而 `profile` 动作则加载用户 session，并将其传递给加载的视图。个人资料视图与我们之前的个人视图非常相似，使用了与我们之前的模板标签对应的\
  \ PHP 方法。\n\n最后两个动作和视图与用户设置和用户搜索有关。这些在列表 23-12 至 23-14 中演示。\n\n**列表 23-12. application/controllers/users.php\
  \ (节自)**\n\n```php\nclass Users extends CI_Controller\n{\n    public function settings()\n\
  \    {\n        $success = false;\n\n        // 检查用户 session\n        $this->_isSecure();\n\
