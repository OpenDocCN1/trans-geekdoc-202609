  \n# 第 7 章 路由\n\n我们的 `_pass()` 方法首先修改请求的类（从 `_dispatch()` 方法传递过来），使其第一个字母大大写。它会立即将受保护的\
  \ `$_controller` 和 `$_action` 属性设置为正确的值，并尝试创建一个 `Controller` 类的新实例，同时传入它自身的引用以及提供的\
  \ `$parameters` 数组。由于我们的 `autoload()` 函数在找不到类时会抛出异常，因此我们可以假设控制器要么已加载，要么根本不存在（后者将抛出\
  \ `Router\\Exception\\Controller` 异常）。随后，我们的 `_pass()` 方法会检查 `Controller` 类是否具有匹配所需的\
  \ `$action` 的方法。如果没有，它将抛出 `Router\\Exception\\Action` 异常。\n\n然后我们检查该 action 是否可调用（通过检查元数据中是否存在\
  \ `@protected` 或 `@private`）。\n\n如果满足上述任一条件，我们将抛出 `Router\\Exception\\Action` 异常。我们还定义了一个匿名函数来处理钩子（hooks）。\n\
  \n■ **注意** 钩子是挂载到运行系统内特定点上的函数，以便它们可以在不改变系统本身的情况下运行。例如，创建一个钩子函数以便在执行目标 action 之前运行。我们可以随时更改此钩子函数，而无需修改\
  \ action 本体。\n\n如果 action 带有 `@before [method, [method...]]` 标记，我们的 `Router` 类将首先执行该方法。\n\
  \n同样，如果 action 带有 `@after [method, [method...]]` 标记，我们的 `Router` 类将在 action 完成后执行它。\n\
  \n在 `@before` 和 `@after` 中标识的、带有 `@once` 标记的方法将只会运行一次，无论它们在 `@before` 和 `@after`\
  \ 中被引用了多少次。如果 action 带有 `@protected` 或 `@private` 标记，我们的 `Router` 类将抛出异常，就像找不到该\
  \ action 一样。\n\n`@before` 和 `@after` 是我们框架中实现钩子的示例。执行顺序是：首先执行任何 `@before` 钩子，然后将参数分配给\
  \ `Controller` 实例并执行控制器。最后，我们的 `_pass()` 方法执行任何 `@after` 钩子。完整的类如列表 7-10 所示。\n\n\
  列表 7-10. Router 类。\n\n```php\nnamespace Framework\n\n{\n\nuse Framework\\Base as\
  \ Base;\n\nuse Framework\\Events as Events;\n\nuse Framework\\Registry as Registry;\n\
  use Framework\\Inspector as Inspector;\nuse Framework\\Router\\Exception as Exception;\n\
  \nclass Router extends Base\n\n{\n/**\n * @readwrite\n */\nprotected $_url;\n\n\
  /**\n * @readwrite\n */\nprotected $_extension;\n\n/**\n * @read\n */\nprotected\
  \ $_controller;\n\n/**\n * @read\n */\nprotected $_action;\nprotected $_routes =\
  \ array();\n\npublic function _getExceptionForImplementation($method)\n{\n\nreturn\
  \ new Exception\\Implementation(\"{$method} method not implemented\");\n}\n\npublic\
  \ function addRoute($route)\n{\n\n$this->_routes[] = $route;\n\nreturn $this;\n\
  }\n\npublic function removeRoute($route)\n{\n\nforeach ($this->_routes as $i =>\
  \ $stored)\n\n{\n\nif ($stored == $route)\n\n{\n\nunset($this->_routes[$i]);\n\n\
  }\n\n}\n\nreturn $this;\n}\n\npublic function getRoutes()\n{\n\n$list = array();\n\
  foreach ($this->_routes as $route)\n\n{\n\n$list[$route->pattern] = get_class($route);\n\
  }\n\nreturn $list;\n}\n\nprotected function _pass($controller, $action, $parameters\
  \ = array())\n{\n\n$name = ucfirst($controller);\n\n$this->_controller = $controller;\n\
  \n$this->_action = $action;\n\ntry\n\n{\n\n$instance = new $name(array(\n\n\"parameters\"\
  \ => $parameters\n\n));\n\nRegistry::set(\"controller\", $instance);\n}\ncatch (\\\
  Exception $e)\n{\n\nthrow new Exception\\Controller(\"Controller {$name} not found\"\
  );\n}\n\nif (!method_exists($instance, $action))\n{\n\n$instance->willRenderLayoutView\
  \ = false;\n\n$instance->willRenderActionView = false;\n\nthrow new Exception\\\
  Action(\"Action {$action} not found\");\n}\n\n$inspector = new Inspector($instance);\n\
  \n$methodMeta = $inspector->getMethodMeta($action);\nif (!empty($methodMeta[\"@protected\"\
  ]) || !empty($methodMeta[\"@private\"]))\n\n{\n\nthrow new Exception\\Action(\"\
  Action {$action} not found\");\n}\n\n$hooks = function($meta, $type) use ($inspector,\
  \ $instance)\n\n{\n\nif (isset($meta[$type]))\n\n{\n\n$run = array();\nforeach ($meta[$type]\
  \ as $method)\n\n{\n\n$hookMeta = $inspector->getMethodMeta($method);\nif (isset($hookMeta[\"\
  @once\"]) && in_array($method, $run))\n\n{\n\ncontinue;\n}\n\n$run[] = $method;\n\
  \n$hookMeta();\n\n}\n}\n}\n};\n\n$hooks($methodMeta, \"@before\");\n```\n\n75 [www.it-ebooks.info](http://www.it-ebooks.info/)\n\
