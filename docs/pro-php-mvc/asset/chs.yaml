  \    }\n}\n```\n\n\n\n\n为了获取相关的消息，我们修改后的 `index()` 操作首先需要获取所有关联行。然后，在将朋友行展平为单维的朋友\
  \ ID 数组后，我们获取与这些用户关联的所有消息。最后，我们将消息分配给操作视图。视图的标记也相当简单，如列表 17–16 所示。\n\n285\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
