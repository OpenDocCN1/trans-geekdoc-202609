  \                // CHAPTER 7 ■ RouTing\n                // 取消匹配的 url\n        \
  \        unset($values[0]);\n                // 找到值，修改参数并返回\n                $derived\
  \ = array_combine($keys, ArrayMethods::flatten($values));\n                $this->parameters\
  \ = array_merge($this->parameters, $derived);\n                return true;\n  \
  \          }\n            return false;\n        }\n    }\n}\n```\n\n## Router 类\n\
  \n我们的 `Router` 类将使用请求的 URL 以及控制器/动作元数据来确定要执行的正确控制器/动作。它需要处理多个定义的路由，以及在没有匹配到定义路由时处理推断路由。这在列表\
  \ 7-6 中所示。\n\n### 列表 7-6. 路由管理方法\n\n```php\nnamespace Framework\n\n{\n    use Framework\\\
  Base as Base;\n    use Framework\\Registry as Registry;\n    use Framework\\Inspector\
  \ as Inspector;\n    use Framework\\Router\\Exception as Exception;\n    class Router\
  \ extends Base\n    {\n        /**\n         * @readwrite\n         */\n       \
  \ protected $_url;\n        /**\n         * @readwrite\n         */\n        protected\
  \ $_extension;\n        /**\n         * @read\n         */\n        protected $_controller;\n\
  \        /**\n         * @read\n         */\n        protected $_action;\n     \
  \   // 71\n        // [www.it-ebooks.info](http://www.it-ebooks.info/)\n       \
  \ // CHAPTER 7 ■ RouTing\n        protected $_routes = array();\n        public\
  \ function _getExceptionForImplementation($method)\n        {\n            return\
  \ new Exception\\Implementation(\"{$method} method not implemented\");\n       \
  \ }\n        public function addRoute($route)\n        {\n            $this->_routes[]\
  \ = $route;\n            return $this;\n        }\n        public function removeRoute($route)\n\
  \        {\n            foreach ($this->_routes as $i => $stored)\n            {\n\
  \                if ($stored == $route)\n                {\n                   \
  \ unset($this->_routes[$i]);\n                }\n            }\n            return\
  \ $this;\n        }\n        public function getRoutes()\n        {\n          \
  \  $list = array();\n            foreach ($this->_routes as $route)\n          \
  \  {\n                $list[$route->pattern] = get_class($route);\n            }\n\
  \            return $list;\n        }\n    }\n}\n```\n\n我们将所有定义的路由存储在受保护的 `$_routes`\
  \ 属性中，并使用 `addRoute()` 和 `removeRoute()` 方法对其操作。`getRoutes()` 方法返回我们存储的路由整洁列表——以其字面值为键，类类型值为。\n\
  \n接下来，我们需要处理 URL 的调度。这涉及到匹配任何定义的路由，然后尝试寻找推断路由。这在列表 7-7 中实现。\n\n### 列表 7-7. 处理定义的路由\n\
  \n```php\nnamespace Framework\n\n{\n    use Framework\\Base as Base;\n    use Framework\\\
  Events as Events;\n    use Framework\\Registry as Registry;\n    use Framework\\\
  Inspector as Inspector;\n    use Framework\\Router\\Exception as Exception;\n  \
  \  // 72\n    // [www.it-ebooks.info](http://www.it-ebooks.info/)\n    // CHAPTER\
  \ 7 ■ RouTing\n    class Router extends Base\n    {\n        public function dispatch()\n\
  \        {\n            $url = $this->url;\n            $parameters = array();\n\
  \            $controller = \"index\";\n            $action = \"index\";\n      \
  \      foreach ($this->_routes as $route)\n            {\n                $matches\
  \ = $route->matches($url);\n                if ($matches)\n                {\n \
  \                   $controller = $route->controller;\n                    $action\
  \ = $route->action;\n                    $parameters = $route->parameters;\n   \
  \                 $this->_pass($controller, $action);\n                    return;\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n这是 `Router` 类的调度部分。我们首先通过遍历定义的路由来开始。如果路由匹配了\
  \ URL，获取控制器和动作（`Router` 属性）。最后，我们需要传递参数。这在列表 7-8 中所示。\n\n### 列表 7-8. 处理推断路由\n\n\
  ```php\nnamespace Framework\n\n{\n    use Framework\\Base as Base;\n    use Framework\\\
  Events as Events;\n    use Framework\\Registry as Registry;\n    use Framework\\\
  Inspector as Inspector;\n    use Framework\\Router\\Exception as Exception;\n  \
  \  class Router extends Base\n    {\n        public function dispatch()\n      \
  \  {\n            $parts = explode(\"/\", trim($url));\n            if (sizeof($parts)\
  \ > 0)\n            {\n                $controller = $parts[0];\n              \
  \  // 73\n                // [www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \                // CHAPTER 7 ■ RouTing\n                if (sizeof($parts) > 1)\n\
  \                {\n                    $action = $parts[1];\n                 \
  \   $parameters = array_slice($parts, 2);\n                }\n                $this->_pass($controller,\
  \ $action);\n            }\n        }\n    }\n}\n```\n\n由于我们只在 `_pass()` 方法中处理实际的路由对象，我们不需要验证路由数据。如果我们的定义的路由都没有匹配（且函数以\
  \ return 结束），我们可以假设路由是可以推断的或无效的。这两种情况将在列表 7-9 中处理。\n\n### 列表 7-9. `_pass()` 方法\n\
  \n```php\nnamespace Framework\n\n{\n    use Framework\\Base as Base;\n    use Framework\\\
  Events as Events;\n    use Framework\\Registry as Registry;\n    use Framework\\\
  Inspector as Inspector;\n    use Framework\\Router\\Exception as Exception;\n  \
  \  class Router extends Base\n    {\n        protected function _pass($controller,\
  \ $action, $parameters = array())\n        {\n            $name = ucfirst($controller);\n\
  \            $this->_url = $controller;\n            $this->_action = $action;\n\
  \            try\n            {\n                $instance = new $name(array(\n\
  \                    \"parameters\" => $parameters\n                ));\n      \
  \          Registry::set(\"controller\", $instance);\n            }\n          \
  \  catch (\\Exception $e)\n            {\n                throw new Exception\\\
  Controller(\"Controller {$name} not found\");\n            }\n            if (!method_exists($instance,\
  \ $action))\n            {\n                $instance->willLayoutView = false;\n\
  \                // 74\n                // [www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \                // CHAPTER 7 ■ RouTing\n                $instance->willRenderActionView\
  \ = false;\n                throw new Exception\\Action(\"Action {$action} not found\"\
  );\n            }\n            $inspector = new Inspector($instance);\n        \
  \    $methodMeta = $inspector->getMethodMeta($action);\n            if (!empty($methodMeta[\"\
  @protected\"]) || !empty($methodMeta[\"@private\"]))\n            {\n          \
  \      throw new Exception\\Action(\"Action {$action} not found\");\n          \
  \  }\n        }\n    }\n}\n```\n\n*(注：在翻译过程中，我发现原文在“需要翻译的文本”部分存在逻辑错乱（描述文字与代码块的顺序是颠倒的），已根据高级文档工程师的逻辑对翻译内容进行了对齐处理，确保译文描述与代码块逻辑对应。)*\n\
