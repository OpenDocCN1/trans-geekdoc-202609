  \ = $row->modified;\n        }\n    }\n}\n```\n\n初始化方法与我们为 CodeIgniter 创建的模型非常相似。重要的在于我们如何从数据库表中查询相关的行（在\
  \ `load()` 方法中）。\n\n表的结构可以通过在本地 MySQL 数据库上运行列表 27-7 所示的 SQL 查询来实现。\n\n### Listing\
  \ 27-7. user 表 SQL\n\n```sql\nCREATE TABLE 'user' (\n'id' int(11) NOT NULL AUTO_INCREMENT,\n\
  'live' tinyint(4) DEFAULT NULL,\n'deleted' tinyint(4) DEFAULT NULL,\n'created' datetime\
  \ DEFAULT NULL,\n'modified' datetime DEFAULT NULL,\n'first' varchar(32) DEFAULT\
  \ NULL,\n'last' varchar(32) DEFAULT NULL,\n'email' varchar(100) DEFAULT NULL,\n\
  'password' varchar(32) DEFAULT NULL,\n'admin' tinyint(4) DEFAULT NULL,\nPRIMARY\
  \ KEY ('id')\n) ENGINE = InnoDB DEFAULT CHARSET = utf8 ;\n```\n\n\n\n\n```sql\n\
  ENGINE = InnoDB DEFAULT CHARSET = utf8 AUTO_INCREMENT = 1 ;\n```\n\n因此，通过列表 27-8\
  \ 所示的代码，就可以获取用户表中的第一行。\n\n**列表 27-8. 获取第一个用户**\n\n```php\n$user = new Application_Model_User(array(\n\
  \"id\" => $id\n));\n```\n\n还有其他一些方法，如列表 27-9 所示，我们需要将这些方法添加到此 `Application_Model_User`\
  \ 模型中。\n\n**列表 27-9. `Application_Model_User` 类（续））**\n\n```php\nclass Application_Model_User\n\
  {\n    public function save()\n    {\n        // 初始化数据\n        $data = array(\n\
  \            \"first\" => $this->first,\n            \"last\" => $this->last,\n\
  \            \"email\" => $this->email,\n            \"password\" => $this->password,\n\
  \            \"live\" => (int) $this->live,\n            \"deleted\" => (int) $this->deleted,\n\
  \            \"modified\" => date(\"Y-m-d H:i:s\")\n        );\n        if ($this->id)\n\
  \        {\n            // 更新\n            $where = array(\"id = ?\" => $this->id);\n\
  \            return $this->getTable()->update($data, $where);\n        }\n     \
  \   else\n        {\n            // 插入\n            $data[\"created\"] = date(\"\
  Y-m-d H:i:s\");\n            return $this->getTable()->insert($data);\n        }\n\
  \    }\n\n    public static function first($where = null)\n    {\n        $user\
  \ = new self();\n        $table = $user->getTable();\n        $query = $table->select()->limit(1);\n\
  \        // 缩小搜索范围\n        if (is_array($where))\n        {\n            foreach\
  \ ($where as $key => $value)\n            {\n                $query->where($key,\
  \ $value);\n            }\n        }\n        // 获取用户\n        if ($row = $table->fetchRow($query))\n\
  \        {\n            $user->populate($row->toArray());\n            return $user;\n\
  \        }\n        return null;\n    }\n\n    public static function count($where\
  \ = null)\n    {\n        $user = new self();\n        $table = $user->getTable();\n\
  \        $query = $table->select()->from($table, array(\"num\" => \"COUNT(1)\"))->limit(1);\n\
  \        // 缩小搜索范围\n        if (is_array($where))\n        {\n            foreach\
  \ ($where as $key => $value)\n            {\n                $query->where($key,\
  \ $value);\n            }\n        }\n        $row = $table->fetchRow($query);\n\
  \        return $row->num;\n    }\n\n    public static function all($where = null,\
  \ $fields = null, $order = null, $direction = \"asc\", $limit = null, $page = null)\n\
  \    {\n        $user = new self();\n        $table = $user->getTable();\n     \
  \   $adapter = $table->getAdapter();\n        $query = $adapter->select();\n   \
  \     // 选择字段\n        if ($fields)\n        {\n            $query->from(\"user\"\
  , $fields);\n        }\n        // 缩小搜索范围\n        if (is_array($where))\n     \
  \   {\n            foreach ($where as $key => $value)\n            {\n         \
  \       $query->where($key, $value);\n            }\n        }\n        // 结果排序\n\
  \        if ($order)\n        {\n            $query->order(\"{$order} {$direction}\"\
  );\n        }\n        // 限制结果\n        if ($limit && $page)\n        {\n      \
  \      $offset = ($page - 1) * $limit;\n            $query->limit($limit, $offset);\n\
  \        }\n        // 获取用户\n        $users = array();\n        $rows = $adapter->fetchAll($query);\n\
  \        foreach ($rows as $row)\n        {\n            // 创建 + 填充用户\n        \
  \    $user = new self();\n            $user->populate($row->toArray());\n      \
  \      // 将用户加入数组\n            array_push($users, $user);\n        }\n        return\
  \ $users;\n    }\n}\n```\n\n剩余的方法与我们为 CodeIgniter 创建的数据访问/修改方法非常相似。事实上，它们仅区别在于用于从用户表返回行或向用户表保存新行的手段。\n\
