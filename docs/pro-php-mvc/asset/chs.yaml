  \ ORM 概念或它如何融入我们的框架并不是必须的。\n\n事实上，许多 ORM 库都实现了此类代码，允许对相关的数据库数据进行巨大的控制。我们可以在未来决定扩展我们的模型库，甚至使用更大、功能更全的\
  \ ORM 库，但我们现在已经实现了我们想要的所有功能，还没有必要陷入细节中。\n\n## 问题\n\n1. 模型仅用于与数据库交互吗？\n2. 我们创建的 `Model`\
  \ 类混合了实例方法和类方法来处理数据库行。为什么我们不统一选择使用实例方法或类方法来执行所有的行操作呢？\n\n### 回答\n\n1. 不！模型可以处理各种事情，例如连接到第三方\
  \ API 或修改文件系统信息。模型不等同于 ORM。\n2. 有时，在语法上同时处理多行是有吸引力的，例如从数据库中获取多行或删除多行。其他操作则涉及单行，例如使用\
  \ `INSERT` 或 `UPDATE` 查询。\n\n### 练习\n\n1. 我们创建的 `Model` 类提供了一些让开发更轻松的方法。尝试添加一个 `limit`。\n\
  2. 虽然我们可以使用 `Model` 类来 `INSERT` 或 `UPDATE` 行，但尝试添加一个 `WHERE` 子句来验证数据。\n\n## 测试\n\
  \n这个类就是我们编写单元测试所需的所有。`add()` 方法接受一个 `$callback`、一个 `$title` 和一个 `$set`。`run()` 方法遍历测试并执行它们。如果测试通过，它会被添加到通过测试的数组中。如果失败，它会被添加到失败测试的数组中。如果在任何测试过程中发生异常，测试的标题/集合/异常类型将被添加到一个数组中。\n\
  \n```php\nnamespace Framework;\n\nclass Test\n{\n    private static $_tests = array();\n\
  \n    public static function add($callback, $title = \"Test\", $set = \"General\"\
  )\n    {\n        self::$_tests[] = array(\n            \"callback\" => $callback,\n\
  \            \"title\" => $title,\n            \"set\" => $set\n        );\n   \
  \ }\n\n    public static function run($before = null, $after = null)\n    {\n  \
  \      if ($before)\n        {\n            $before(self::$_tests);\n        }\n\
  \        $passed = array();\n        $failed = array();\n        $exceptions = array();\n\
  \        foreach (self::$_tests as $test)\n        {\n            try\n        \
  \    {\n                $result = call_user_func($test[\"callback\"]);\n       \
  \         if ($result)\n                {\n                    $passed[] = array(\n\
  \                        \"set\" => $test[\"set\"],\n                        \"\
  title\" => $test[\"title\"]\n                    );\n                }\n       \
  \         else\n                {\n                    $failed[] = array(\n    \
  \                    \"set\" => $test[\"set\"],\n                        \"title\"\
  \ => $test[\"title\"]\n                    );\n                }\n            }\n\
  \            catch (\\Exception $e)\n            {\n                $exceptions[]\
  \ = array(\n                    \"set\" => $test[\"set\"],\n                   \
  \ \"title\" => $test[\"title\"],\n                    \"type\" => get_class($e)\n\
  \                );\n            }\n        }\n        if ($after)\n        {\n\
  \            $after(self::$_tests);\n        }\n        return array(\n        \
  \    \"passed\" => $passed,\n            \"failed\" => $failed,\n            \"\
  exceptions\" => $exceptions\n        );\n    }\n}\n```\n\n**目标**\n\n- 我们需要构建缓存。\n\
  - 我们需要设置 `Test` 类。\n- 我们需要创建结果。\n- 我们需要确保测试覆盖了缓存。\n\n\n\n\n\n-   `Cache\\Driver\\\
  Memcached` 类可以断开连接并返回自身。\n-   `Cache\\Driver\\Memcached` 类可以设置值并返回自身。\n-   `Cache\\\
  Driver\\Memcached` 类可以获取值。\n-   `Cache\\Driver\\Memcached` 类可以返回默认值。\n-   `Cache\\\
  Driver\\Memcached` 类将遵循值的过期时间。\n-   `Cache\\Driver\\Memcached` 类可以删除值并返回自身。\n\n\
  # 第 11 章 测试\n\n## 测试\n\n列表 11-2 所示的初始缓存测试了工厂类和初始化方法。\n\n### 列表 11-2. 初始缓存测试\n\n\
  ```php\nFramework\\Test::add(\nfunction()\n{\n$cache = new Framework\\Cache();\n\
