  \ $this->load->model(\"file\");\n            $file = new File(array(\n         \
  \       \"name\" => $data[\"file_name\"],\n                \"mime\" => $data[\"\
  file_type\"],\n            ));\n        }\n    }\n}\n```\n\n\n\n\n\n```php\n\"size\"\
  \ => $data[\"file_size\"],\n\"width\" => $data[\"image_width\"],\n\"height\" =>\
