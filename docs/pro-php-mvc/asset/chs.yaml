  \n# 第 23 章 CodeIgniter: MVC\n\n在定义控制器、模型和视图时也是一样，尽管我们需要编写额外的代码来让 CodeIgniter 的行为像我们预期的那样运行。\n\
  \n## 问题\n\n1. 我们在本章中创建的 `User` 模型与我们框架中的 `Model` 类相似。我们是否可以让 `CI_Model` 变得与我们的 `Model`\
  \ 类相似呢？\n2. CodeIgniter 中是否有类似于（我们框架中的）`Events` 类的某种机制？\n3. 我们在本章中创建的视图都包含了大量的 PHP\
  \ 代码。CodeIgniter 是否有任何模板引擎供我们使用？\n\n### 答案\n\n1. 与我们框架的 `Model` 类相比，CodeIgniter\
  \ 的 `CI_Model` 类非常精简。CodeIgniter 确实允许我们以相同的方式对其进行扩展，就像它们允许添加第三方库的方式一样。（我们将在第 24\
  \ 章中介绍这一点）\n2. CodeIgniter 有它所谓的“钩子（hooks）”，它们与 `Events` 类相似，但不是在运行时定义的。钩子是通过在关联数组配置文件中添加对类/方法的引用来定义的。\n\
  3. CodeIgniter 确实有一个模板解析器，但最好避免使用它。\n\n### 练习题\n\n1. CodeIgniter 的数据库类拥有修改数据库结构的方法，但我们在本章中使用了简单的\
  \ SQL 查询来创建数据库表。尝试使用这些方法来创建一个表。\n2. 出于时间考虑，我们没有创建任何 CMS 动作或视图。尝试现在创建它们。\n\n365\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n# 第 24 章 CodeIgniter: 扩展\n\
  \nCodeIgniter 包含了大量的库，用于处理文件上传、图像处理和电子邮件发送等细节。让我们来看看如何使用这些库，以及如何扩展 CodeIgniter 以使用第三方库。\n\
  \n## 目标\n\n- 我们需要学习如何使用 CodeIgniter 内置的库。\n- 我们需要学习如何在我们的 CodeIgniter 应用程序中包含我们自己的（第三方的\
  \ party）库。\n- 我们需要学习如何扩展 CodeIgniter 的核心类。\n\n## 文件上传\n\n我们将从查看如何使用 CodeIgniter\
  \ 内置的文件上传库开始。我们原始的示例应用程序允许用户在注册时上传照片，因此那是包含此功能的完美位置。我们的原始应用程序包含一个 `File` 模型，我们需要用\
  \ CodeIgniter 重新创建它。\n\n它需要包含 `Files` 控制器所需的所有方法，以便正确处理/查询照片数据库表行。之后，我们需要修改与文件上传相关的动作和视图，以正确拦截和处理上传的文件。`File`\
  \ 模型看起来应该像列表 24-1 中的代码。\n\n### 列表 24-1. File 模型\n\n```php\nclass File extends CI_Model\n\
  {\n    public $id;\n    public $live = true;\n    public $deleted = false;\n   \
  \ public $created;\n    public $modified;\n    public $name;\n    public $mime;\n\
  \    public $size;\n    public $width;\n    public $height;\n    public $user;\n\
  }\n```\n\n367\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n### 第 24 章 CodeIgniter:\
  \ 扩展\n\n```php\nprotected function _populate($options)\n{\n    // 设置所有属性\n    foreach\
  \ ($options as $key => $value) {\n        if (property_exists($this, $key)) {\n\
  \            $this->$key = $value;\n        }\n    }\n}\n\npublic function __construct($options\
  \ = array())\n{\n    // 子类构造\n    parent::__construct();\n    // 填充值\n    if (sizeof($options))\
  \ {\n        $this->_populate($options);\n    }\n    // 加载行\n    $this->load();\n\
  }\n\npublic function load()\n{\n    if ($this->id) {\n        // 获取对应的行\n      \
  \  $query = $this->db->where(\"id\", $this->id)->get(\"file\", 1);\n        // 用行填充属性\n\
  \        if ($row = $query->row()) {\n            $this->id = (bool)$row->id;\n\
  \            $this->live = (boolean)$row->live;\n            $this->deleted = (boolean)$row->deleted;\n\
  \            $this->created = $row->created;\n            $this->modified = $row->modified;\n\
  \            $this->name = $row->name;\n            $this->mime = $row->mime;\n\
  \            $this->size = $row->size;\n            $this->width = $row->width;\n\
  \            $this->height = $row->height;\n            $this->user = $row->user;\n\
  \        }\n    }\n}\n\npublic function save()\n{\n    // 初始化数据\n    $data = array(\n\
  \        \"live\" => (int)$this->live,\n        \"deleted\" => (int)$this->deleted,\n\
  \        \"modified\" => date(\"Y-m-d H:i:s\"),\n        \"name\" => $this->name,\n\
  \        \"mime\" => $this->mime,\n        \"size\" => $this->size,\n        \"\
  width\" => $this->width,\n        \"height\" => $this->height,\n        \"user\"\
  \ => $this->user\n    );\n    // 更新\n    if ($this->id) {\n        $where = array(\"\
  id\" => $this->id);\n        return $this->db->update(\"file\", $data, $where);\n\
  \    }\n    // 插入\n    $data[\"created\"] = date(\"Y-m-d H:i:s\");\n    $this->id\
  \ = $this->db->insert(\"file\", $data);\n    // 返回 id\n    return $this->id;\n}\n\
  \npublic static function first($where)\n{\n    $user = new File();\n    // 获取第一个用户\n\
  \    $user->db->where($where);\n    $user->db->limit(1);\n    $query = $user->db->get(\"\
  file\");\n    // 初始化数据\n    $data = $query->row();\n    $user->_populate($data);\n\
  \    // 返回用户\n    return $user;\n}\n```\n\n369\n\nd\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  ### 第 24 章 CodeIgniter: 扩展\n\nFile 模型与我们在第 23 章创建的 `User` 模型非常相似，只是为了简单排除了一些方法。它允许我们从数据库中保存和加载单个行。为了这一点，需要列表\
  \ 24-2 所示的数据库表。\n\n### 列表 24-2. file 表\n\n```sql\nCREATE TABLE file (\n    name\
  \ varchar(255) DEFAULT NULL,\n    mime varchar(32) DEFAULT NULL,\n    size int(11)\
