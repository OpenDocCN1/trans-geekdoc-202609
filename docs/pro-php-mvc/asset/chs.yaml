  \ `DbTable` 类。\n\n`DbTable` 类在 Zend Framework 中被定义为数据库表元数据的容器。我们将使用 `DbTable` 类来生成所需的各种数据库查询以节省时间，而不是直接使用数据库适配器（见列表\
  \ 27-4）。\n\n### Listing 27-4. Application_Model_DbTable_User 继承类\n\n```php\nclass\
  \ Application_Model_DbTable_User extends Zend_Db_Table_Abstract\n{\n    protected\
  \ $_name = 'user';\n}\n```\n\n如你所示，此类只需要一个表名即可生成用于查询生成的全套元数据。它并不真的有趣，所以我们将转向模型本身，如列表\
  \ 27-5 所示。\n\n### Listing 27-5. Application_Model_User\n\n```php\nclass Application_Model_User\n\
  {\n    protected $_table;\n\n    public function setTable($table)\n    {\n     \
  \   if (is_string($table)) {\n            $this->_table = new $table();\n      \
