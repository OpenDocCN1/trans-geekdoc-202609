  \     * @readwrite\n     * @type datetime\n     */\n    protected $_modified;\n\n\
  \    public function save()\n    {\n        $primary = $this->getPrimaryColumn();\n\
  \        $raw = $primary[\"raw\"];\n        if (empty($this->$raw))\n        {\n\
  \            $this->setCreated(date(\"Y-m-d H:i:s\"));\n            $this->setDeleted(false);\n\
  \            $this->setLive(true);\n        }\n        $this->setModified(date(\"\
  Y-m-d H:i:s\"));\n        parent::save();\n    }\n}\n}\n```\n\n## 问题\n1. 为什么我们要通过继承\
  \ `Controller` 类来添加数据库功能？\n2. PHP 有内置的会话管理函数，其中一些甚至用在我们创建的 `Session` 类中了。我们为什么还需要创建这些\
  \ `Session` 类呢？\n3. `Session` 驱动类中 `$_prefix` 属性的目的是什么？\n\n### 回答\n1. 首先，我们选择 `Controller`\
  \ 类作为数据库代码的理想位置，是因为我们应用程序中的所有控制器都需要访问数据库。其次，我们之所以继承 `Controller` 而不是修改原始类，是因为这显然属于应用需求的范畴。并不是所有的应用程序都需要数据库连接；因此，这应该根据具体的应用程序来决定。\n\
  2. 我们的确使用了一些 PHP 内置的会话管理代码，但创建这些类仍然是一个好主意，有两个原因。首先，在 PHP 中处理会话需要在对会话数据进行任何更改之前打开会话，并在之后关闭会话。现在我们再也不需要每次处理会话时重复那些代码了。第二个原因是我们可以创建任意数量的会话驱动，这些驱动可能不会使用默认的会话管理代码。\n\
  3. 我们为会话键添加前缀的原因与我们将框架代码组织在命名空间相同。也就是说，我们不知道在框架旁边还会运行哪些其他服务器代码。同样，我们不知道其他系统是否使用相同的会话空间。我们最好的做法是通过为所有会话键添加前缀来避免冲突。\n\
  \n###练习\n1. 我们的 `Controller` 子类打开了数据库连接，但没有关闭它。这通常不是问题（对于资源充足的系统而言），但理想情况下连接应该在不再被使用时被关闭。现在添加关闭数据库连接的额外代码。注意不要过早关闭连接。\n\
  2. 我们的 `Session` 类只使用原生的 PHP 会话。现在添加另一个使用其他存储形式来管理会话的驱动程序。你可以使用文件、缓存或任何你喜欢的工具。只需确保每个用户的会话数据是私密的即可！\n\
  \n\n\n\n\n`set` 构造应指示模板解析器获取包含在起始/结束标签内的数据并将其存储。这种存储应该在所有已解析的模板之间共享，任何模板都能够检索到存储的数据。`append/prepend`\
  \ 构造与 `set` 构造类似，但它们不会替换存储在键中的数据。`prepend` 构造会将提供的数据插入到相同键中已存储的任何内容之前，而 `append`\
  \ 构造会将提供的数据放置在相同键中已存储的任何内容之后。\n\n最后，`yield` 构造将返回存储在共享存储区域该键的任何数据。\n\n# 扩展实现\n\n\
  我们通过向实现子类添加几个新的受保护属性来开始扩展模板的实现。我们还需要调整语言映射，它定义了我们模板语言的语法。查看列表 15-2 以了解我们是如何实现这一点的。\n\
  \n***Listing 15-2.*** TemplateImplementationExtended 类\n\n```php\nnamespace Framework\\\
  Template\\Implementation\n\n{\n\nuse Framework\\Request as Request;\n\nuse Framework\\\
  Registry as Registry;\n\nuse Framework\\Template as Template;\n\nuse Framework\\\
  StringMethods as StringMethods;\n\nuse Framework\\RequestMethods as RequestMethods;\n\
  \nclass Extended extends Standard\n\n{\n\n/**\n* @readwrite\n*/\nprotected $_defaultPath\
  \ = \"application/views\";\n\n/**\n* @readwrite\n*/\nprotected $_defaultKey = \"\
  _data\";\n\n/**\n* @readwrite\n*/\nprotected $_index = 0;\n\npublic function __construct($options\
  \ = array())\n\n{\n\nparent::__construct($options);\n\n$this->_map = array(\n\n\"\
  partial\" => array(\n\"opener\" => \"{partial\",\n\"closer\" => \"}\",\n\"handler\"\
  \ => \"_partial\"\n),\n\"include\" => array(\n\"opener\" => \"{include\",\n\"closer\"\
  \ => \"}\",\n\"handler\" => \"_include\"\n),\n\"yield\" => array(\n\"opener\" =>\
  \ \"{yield\",\n\"closer\" => \"}\",\n\"handler\" => \"yield\"\n)\n) + $this->_map;\n\
  \n$this->_map[\"statement\"][\"tags\"] = array(\n\"set\" => array(\n\"isolated\"\
  \ => false,\n\"arguments\" => \"{key}\",\n\"handler\" => \"set\"\n),\n\"append\"\
  \ => array(\n\"isolated\" => false,\n\"arguments\" => \"{key}\",\n\"handler\" =>\
  \ \"append\"\n),\n\"prepend\" => array(\n\"isolated\" => false,\n\"arguments\" =>\
  \ \"{key}\",\n\"handler\" => \"prepend\"\n)\n) + $this->_map[\"statement\"][\"tags\"\
  ];\n\n}\n\n}\n\n}\n```\n\n我们想要添加的前三个模板构造是单标签构造，因此我们把它们添加到主 `$_map` 数组中。这意味着我们的模板解析器将不会寻找结束标签，也不会从子数据中创建层级结构。\n\
  \n另一方面，后三个模板构造是语句（带有起始/结束标签和子数据）。我们把它们添加到 `statements` 子数组中，它们的解析方式将与 `if/else`\
  \ 循环构造的解析方式相同。\n\n接下来，我们需要为这些新构造中的每一个创建一个处理器。我们将处理第一个是 `_include()` 处理器，如列表 15-3\
  \ 所示。\n\n***Listing 15-3.*** `_include()` 处理器\n\n```php\nprotected function _include($tree,\
  \ $content)\n\n{\n\n$template = new Template(array(\n\"implementation\" => new self()\n\
  ));\n\n$file = trim($tree[\"raw\"]);\n$path = $this->getDefaultPath();\n$content\
  \ = file_get_contents(APP_PATH.\"/{$path}/{$file}\");\n\n$template->parse($content);\n\
  \n$index = $this->_index++;\n\nreturn \"function anon_{$index}(\\$_data){\n\n\"\
  .$template->getCode().\"\n\n};$_text[] = anon_{$index}(\\$_data);\";\n}\n```\n\n\
  该构造的目标是获取子模板并将其置于主模板中。子模板应该与主模板同时进行处理，以便任何逻辑可以同时发生。这是模板之间相互通信以共享数据的一种方法。\n\n我们首先使用此实现创建一个新的\
  \ `Template` 实例。这意味着子模板可以有自己的子模板，并且可以访问其他新的模板构造。\n\n我们获取文件的内容（该文件名称在 `include` 标签中提供）。然后通过提供模板文件内容来解析模板实例。这里的技巧是为每个包含的模板创建一个新方法，这样所有处理就可以同时进行。由每个\
  \ `Template` 实例生成的函数返回一个字符串，因此我们所做的是将此功能封装在一个新的函数中并立即调用它（将它的返回值添加到 `$_text` 数组中）。这意味着当主模板被处理时，主模板将调用子模板的结果。这可能是我们正在添加的所有新模板构造中最复杂的的一个。\n\
  \n## URL 请求\n\n下一个构造需要一组新类，将允许我们向远程 URL 发起请求。你可以在列表 15-4 中看到第一个。\n\n***Listing 15-4.***\
  \ Request 类\n\n```php\nnamespace Framework\n\n{\n\nuse Framework\\Base as Base;\n\
  use Framework\\StringMethods as StringMethods;\nuse Framework\\RequestMethods as\
  \ RequestMethods;\nuse Framework\\Exception as Exception;\n\nclass Request extends\
  \ Base\n\n{\n\n/**\n* @readwrite\n*/\npublic $_willFollow = true;\n\n/**\n* @readwrite\n\
  */\nprotected $_headers = array();\n\n/**\n* @readwrite\n*/\nprotected $_request;\n\
  \n/**\n* @readwrite\n*/\nprotected $_options;\n\nprotected function _getExceptionForImplementation($method)\n\
  \n{\n\nreturn new Exception(\"{$method} not implemented\");\n}\n\nprotected function\
  \ _getExceptionForArgument()\n\n{\n\nreturn new Exception(\"Invalid argument\");\n\
  }\n\npublic function __construct($options = array())\n\n{\n\nparent::__construct($options);\n\
  $this->setAgent(RequestMethods::server(\"HTTP_AGENT\", \"Curl/\".PHP_VERSION));\n\
  }\n\npublic function delete($url, $parameters = array())\n\n{\n\nreturn $this->request(\"\
  DELETE\", $url, $parameters);\n}\n\nfunction get($url, $parameters = array())\n\n\
  {\n\nif (!empty($parameters))\n\n{\n\n$url .= StringMethods::indexOf($url, \"?\"\
  ) ? \"&\" : \"?\";\n$url .= http_build_query($parameters, \"\", \"&\");\n}\n\nreturn\
  \ $this->request(\"GET\", $url);\n}\n\nfunction head($url, $parameters = array())\n\
  \n{\n\nreturn $this->request(\"HEAD\", $url, $parameters);\n}\n\nfunction post($url,\
  \ $parameters = array())\n\n{\n\nreturn $this->request(\"POST\", $url, $parameters);\n\
  }\n\nfunction put($url, $parameters = array())\n\n{\n\nreturn $this->request(\"\
  PUT\", $url, $parameters);\n}\n\n}\n\n}\n```\n\n`Request` 类拥有所有常用的 `Base` 功能，以及一些请求方法（get,\
  \ post, put, delete 和 head）。这些代表了不同的请求类型，但最终它们都调用同一个 `request()` 方法。其他需要注意的是，构造函数设置了用户代理，而\
  \ `get` 方法将提供的参数数组转换为有效的查询字符串。\n\n`request()` 方法如列表 15-5 所示，负责执行（或委托）实际工作。\n\n***Listing\
  \ 15-5.*** `request()` 方法\n\n```php\nfunction request($method, $url, $parameters\
  \ = array())\n\n{\n\n$request = $this->_request = curl_init();\n\nif (is_array($parameters))\n\
  \n{\n\n$parameters = http_build_query($parameters, \"\", \"&\");\n}\n\n$this->_setRequestMethod($method)\n\
  ->_setRequestOptions($url, $parameters)\n->_setRequestHeaders();\n\n$response =\
  \ curl_exec($request);\n\nif ($response)\n\n{\n\n$response = new Request\\Response(array(\n\
  \"response\" => $response\n));\n}\n\nelse\n\n{\n\nthrow new Exception\\Response(curl_errno($request).'\
  \ - '.curl_error($request));\n}\n\ncurl_close($request);\n\nreturn $response;\n\
  }\n```\n\n\n\n\n`request()` 方法（以及通用的 `Request` 类）使用 `Curl` 来发送 HTTP 请求。\n\n该方法首先通过创建一个新的\
  \ curl 资源实例，然后通过设置实例的某些参数继续执行。随后它发送请求，如果请求成功，将以 `Request\\Response` 类实例的形式返回。如果请求失败，则会抛出一个异常。\n\
  \n最后，curl 资源会被销毁并返回响应。在我们深入研究 `Request\\Response` 类之前，我们需要查看列表 15-6 所示的设置方法（setter\
  \ methods）。\n\n***Listing 15-6.*** Request 设置器方法\n\n```php\nprotected function _setOption($key,\
  \ $value)\n{\n    curl_setopt($this->_request, $key, $value);\n    return $this;\n\
  }\n\nprotected function _normalize($key)\n{\n    return \"CURLOPT_\".str_replace(\"\
  CURLOPT_\", \"\", strtoupper($key));\n}\n\nprotected function _setRequestMethod($method)\n\
  {\n    switch (strtoupper($method))\n    {\n        case \"HEAD\":\n           \
  \ $this->_setOption(CURLOPT_NOBODY, true);\n            break;\n        case \"\
  GET\":\n            $this->_setOption(CURLOPT_HTTPGET, true);\n            break;\n\
  \        case \"POST\":\n            $this->_setOption(CURLOPT_POST, true);\n  \
  \          break;\n        default:\n            $this->_setOption(CURLOPT_CUSTOMREQUEST,\
  \ $method);\n            break;\n    }\n    return $this;\n}\n\nprotected function\
  \ _setRequestOptions($url, $parameters)\n{\n    $this->_setOption(CURLOPT_URL, $url);\n\
  \    $this->_setOption(CURLOPT_HEADER, true);\n    $this->_setOption(CURLOPT_RETURNTRANSFER,\
  \ true);\n    $this->_setOption(CURLOPT_USERAGENT, $this->getAgent());\n    if (!empty($parameters))\n\
  \    {\n        $this->_setOption(CURLOPT_POSTFIELDS, $parameters);\n    }\n   \
  \ if ($this->getWillFollow())\n    {\n        $this->_setOption(CURLOPT_FOLLOWLOCATION,\
  \ true);\n    }\n    if ($this->getReferer())\n    {\n        $this->_setOption(CURLOPT_REFERER,\
  \ $this->getReferer());\n    }\n    foreach ($this->_options as $key => $value)\n\
  \    {\n        $this->_setOption(constant($this->_normalize($key)), $value);\n\
  \    }\n    return $this;\n}\n\nprotected function _setRequestHeaders()\n{\n   \
  \ $headers = array();\n    foreach ($this->getHeaders() as $key => $value)\n   \
  \ {\n        $headers[] = $key.': '.$value;\n    }\n    $this->_setOption(CURLOPT_HTTPHEADER,\
  \ $headers);\n    return $this;\n}\n```\n\n`_setOption()` 和 `_normalize()` 方法是我们在三个重要的\
  \ Request 设置方法中执行任务的便利方法。如果你熟悉 PHP Curl 类，这些方法对你来说将是轻而常饭。\n\n**Note** 你可以在 `http://www.php.net/manual/en/book.curl.php`\
  \ 查看更多关于 PHP Curl 类的信息。\n\n`_setRequestMethod()` 方法设置与每种请求方法相关的 Curl 参数。某些请求方法需要设置额外的参数（例如\
  \ `GET` 和 `POST`），而其他方法则需要从响应中排除内容（例如 `HEAD`）。\n\n`_setRequestOptions()` 方法遍历所有需要设置的特定特定参数。这包括\
  \ URL、用户代理、请求是否应该重定向等。它甚至会添加通过使用 `setOptions()` 设置方法（或构造选项）指定的任何选项。\n\n最后，`_setRequestHeaders()`\
  \ 方法遍历通过 `setHeaders()` 设置方法（或构造选项）指定的标头，以向请求添加任何自定义标头。\n\n`Request\\Response` 类负责处理\
  \ HTTP 请求的结果，如列表 15-7 所示。\n\n***Listing 15-7.*** The Request\\Response Class\n\n\
  ```php\nnamespace Framework\\Request\n{\n    use Framework\\Base as Base;\n    use\
  \ Framework\\Request\\Exception as Exception;\n    class Response extends Base\n\
  \    {\n        protected $_response;\n\n        /**\n         * @read\n       \
  \  */\n        protected $_body = null;\n\n        /**\n         * @read\n     \
  \    */\n        protected $_headers = array();\n\n        protected function _getExceptionForImplementation($method)\n\
  \        {\n            return new Exception\\Implementation(\"{$method} not implemented\"\
  );\n        }\n\n        protected function _getExceptionForArgument()\n       \
  \ {\n            return new Exception\\Argument(\"Invalid argument\");\n       \
  \ }\n\n        function __construct($options = array())\n        {\n           \
  \ if (!empty($options[\"response\"]))\n            {\n                $response\
  \ = $this->_response = $options[\"response\"];\n                unset($options[\"\
  response\"]);\n            }\n            parent::__construct($options);\n     \
  \       $pattern = '#HTTP/\\d\\.\\d.*?$.*?\\r\\n\\r\\n#ims';\n            preg_match_all($pattern,\
  \ $response, $matches);\n            $version = array_shift($matches);\n       \
  \     $headers = explode(\"\\r\\n\", $response);\n            $this->_body = array_pop($headers);\n\
  \            foreach ($headers as $header)\n            {\n                $pos\
  \ = strpos($header, ':');\n                if ($pos !== false)\n               \
  \ {\n                    $this->_headers[substr($header, 0, $pos)] = trim(substr($header,\
  \ $pos + 1));\n                }\n            }\n            if (strpos($version,\
  \ \"http\") !== 0)\n            {\n                $this->_response = $version;\n\
  \            }\n            else\n            {\n                $this->_response\
  \ = \"http://\" . $version;\n            }\n        }\n\n        public function\
  \ getBody()\n        {\n            return $this->_body;\n        }\n\n        public\
  \ function getHeaders()\n        {\n            return $this->_headers;\n      \
  \  }\n    }\n}\n```\n\n\n\n\n```php\npublic function set($key, $value)\n{\n    if\
  \ (StringMethods::indexOf($value, \"\\\\$\\_text\") > −1) {\n        $first = StringMethods::indexOf($value,\
  \ \"\\\\\"\");\n        $last = StringMethods::lastIndexOf($value, \"\\\\\"\");\n\
  \        $value = stripslashes(substr($value, $first + 1, ($last - $first) - 1));\n\
  \    }\n    if (is_array($key)) {\n        $key = $this->_getKey($key);\n    }\n\
  \    $this->_setValue($key, $value);\n}\n```\n\n`set()` 处理器有两个原因是值得关注的。首先，它是我们在任何模板实现中使用的第一个公共构造结构处理器。这是因为我们允许共享存储不仅可以在模板文件中被访问，还可以从应用程序的控制器（controllers）和动作（actions）内部访问。\n\
  \n第二个让 `set()` 方法有趣的原因是，它将值字符串从类似于 `$_text = \"foo\";` 的内容修改为类似于 `foo` 的内容。这是由于我们的\
  \ `Template` 类解析模板文件内部文本节点的方式。如果你回看 `Template->_script()` 方法，你会发现我们执行的最早期操作之一是将纯文本节点转换为直接将它们添加到\
  \ `$_text` 数组中的代码。这是预期的行为，但在这种特殊情况下，我们需要撤销这一操作。\n\n我们通过删除第一个 `\"` 字符之前以及最后一个 `\"\
  ` 字符之后的所有内容来实现这一点。这为我们提供了原始数据，这正是我们想要存储的内容。\n\n接下来，我们处理 `prepend()` 和 `append()`\
  \ 处理器，如列表 15-11 所示。\n\n### Listing 15-11. `prepend()` 和 `append()` 处理器\n\n```php\n\
  public function append($key, $value)\n{\n    if (is_array($key)) {\n        $key\
  \ = $this->_getKey($key);\n    }\n    $previous = $this->_getValue($key);\n    $this->set($key,\
  \ $previous.$value);\n}\n\npublic function prepend($key, $value)\n{\n    if (is_array($key))\
  \ {\n        $key = $this->_getKey($key);\n    }\n    $previous = $this->_getValue($key);\n\
  \    $this->set($key, $value.$previous);\n}\n```\n\n与 `set()` 处理器一样，这些处理器方法也是公共的。它们同样允许将字符串或节点树作为\
  \ `$key` 提供。如果提供了节点树，则将使用 `_getKey()` 方法来提取所需的存储键。\n\n最后一个新的模板构造是 `yield` 构造结构，如列表\
  \ 15-12 所示。\n\n#### Listing 15-12. `yield()` 处理器 \n\n```php\npublic function yield($tree,\
  \ $content)\n{\n    $key = trim($tree[\"raw\"]);\n    $value = addslashes($this->_getValue($key));\n\
  \    return \"\\\\$\\_text[] = \\\\\"{$value}\\\";\";\n}\n```\n\n`yield()` 处理器是所有新构造中最简单的，它的作用与标准实现中的\
  \ `_literal()` 处理器几乎相同。\n\n**注意**：记得调整 `Template\\Implementation\\Extended` 类，否则你将无法使用这些新构造。\n\
  \n## 搜索\n\n在我们完成这些工作之后，添加搜索页面将变得得多。我们已经有了登录页面，现在可以使用我们刚刚添加到扩展实现中的部分模板渲染功能。\n\n目标很简单：我们应该在应用程序中添加一致的导航，这将允许已登录的用户进入\
  \ `logout/profile`，并允许未登录的用户进入 `login/register`。我们首先在一个新的视图文件中生成导航链接，如列表 15-13 所示。\n\
  \n### Listing 15-13. application/views/navigation.html\n\n```html\n<a href=\"/\"\
  >home</a>\n{if (isset($user))}\n<a href=\"/users/profile.html\">profile</a>\n<a\
  \ href=\"/users/settings.html\">settings</a>\n<a href=\"/users/logout.html\">logout</a>\n\
  {else}\n<a href=\"/users/register.html\">register</a>\n<a href=\"/users/login.html\"\
  >login</a>\n{else}\n```\n\n逻辑很简单：如果模板包含 `$user` 变量，则说明用户已登录，我们应该展示备用链接。你可能在奇怪变量是在哪里设置的，所以让我们回顾一下登录系统是如何工作的。\n\
  \n用户输入其电子邮件地址和密码。这些字段随后被提交给 `login()` 动作，该动作从数据库中请求一个用户行。如果返回了行，该行将被序列化并存储在会话（session）中。\n\
  \n依赖于几乎包含我们应用程序每个页面的文件中存在变量似乎很奇怪。这不意味着我们必须不断从会话中提取序列化的用户行并将其赋值给视图吗？从某种意义上说，这正是我们需要做的。我们实现这一目标是通过修改\
  \ `__construct()` 方法为共享子类添加检索和反序列化的逻辑，如列表 15-14 所示。\n\n#### Listing 15-14. 修改后的\
  \ `__construct()` 方法 \n\n```php\n/**\n * @readwrite\n */\nprotected $_user;\npublic\
  \ function __construct($options = array())\n{\n    parent::__construct($options);\n\
  \    $database = Framework\\Registry::get(\"database\");\n    $database->connect();\n\
  \    $session = Framework\\Registry::get(\"session\");\n    $user = unserialize($session->get(\"\
  user\", null));\n    $this->setUser($user);\n}\n```\n\n我们为 `Shared\\Controller`\
  \ 类添加了一个新属性。在 `__construct()` 方法中，设置数据库之后，我们从会话中提取用户行并将其反序列化。之后，我们设置控制器的 `$_user`\
  \ 属性，使其对每个应用程序控制器都有效。\n\n那么我们如何将其赋值给视图呢？我们原始的框架 `Controller` 类有一个 `render` 方法，负责在布局和动作视图上发布渲染命令。我们可以重写此方法，并向其中添加用户逻辑，如列表\
  \ 15-15 所示。\n\n#### Listing 15-15. 修改后的 `render()` 方法 \n\n```php\npublic function\
  \ render()\n{\n    if ($this->getUser()) {\n        if ($this->getActionView())\
  \ {\n            $this->getActionView()->set(\"user\", $this->getUser());\n    \
  \    }\n        if ($this->getLayoutView()) {\n            $this->getLayoutView()->set(\"\
  user\", $this->getUser());\n        }\n    }\n    parent::render();\n}\n```\n\n\
  在检查用户是否已设置后，我们将其赋值给布局视图和动作视图。这样做是为了让它在两者中可以使用。我们可以将其存储在共享存储中，但我们将受限于产生整个对象。这样做让我们能够访问会话用户对象的属性。\n\
  \n**注意**：除了确定在导航中显示哪些链接外，我们在本章中并没有真正大量使用用户会话。在下一章我们创建用户设置页面时，它将派上用场。\n\n我们现在可以构建用于搜索的动作和视图，如列表\
  \ 15-16 所示。\n\n### Listing 15-16. `search()` 动作\n\n\n\n\n`search()` 操作执行了若干项重要任务。它首先设置一些默认值，这些值会被会被提交的表单字段数据覆盖。需要记住，我们的搜索表单默认会有某些字段，并用之前提交的任何表单数据填充这些字段。默认值需要是合理的，并将用于第一次（以及随后的）查询。\n\
  \n如果有可用的提交表单数据，它将尝试根据查询来提取数据库中的用户行。我们实际上执行了两次查询：首先获取符合条件的行数，然后返回一组受限制的（或分页的）用户行。\n\
  \n我们需要获取所有匹配行的计数的原因，以便我们可以渲染准确的页码，让用户能够导航到第一页行之外。`search()` 操作的结束工作是将我们所处理过的所有变量赋值给视图（view）。\n\
  \n接下来，我们需要创建一个相当大的视图，分为两个主要部分。我们从用于搜索用户行的表单字段开始，如列表 15-17 所示。\n\n**列表 15-17。** `application/views/users/search.html`（摘）\n\
  \n```html\n<h1> Search</h1>\n\n<form method = \"post\">\n<ol>\n  <li>\n    <label>\n\
  \      Query:\n      <input type = \"text\" name = \"query\" value = \"{echo $query}\"\
  \ />\n    </label>\n  </</li>\n  <li>\n    <label>\n      Order:\n      <select\
  \ name = \"order\">\n        <option {if $order == \"created\"}selected = \"selected\"\
  {/if} value = \"created\" > Created</option>\n        <option {if $order == \"modified\"\
  }selected = \"selected\"{/if} value = \"modified\" > Modified</option>\n       \
  \ <option {if $order == \"first\"}selected = \"selected\"{/if} value = \"first\"\
  \ > 名字</option>\n        <option {if $order == \"last\"}selected = \"selected\"\
  {/if} value = \"last\" > 姓</option>\n      </select>\n    </label>\n  </</li>\n\
  \  <li>\n    <label>\n      Direction:\n      <select name = \"direction\">\n  \
  \      <option {if $direction == \"asc\"}selected = \"selected\"{/if} value = \"\
  asc\" > 升序</option>\n        <option {if $direction == \"desc\"}selected = \"selected\"\
  {/if} value = \"desc\" > 降序</option>\n      </select>\n    </label>\n  </</li>\n\
  \  <li>\n    <label>\n      Page:\n      <select name = \"page\">\n        {if $count\
  \ == 0}\n          <option value = \"1\" > 1</option>\n        {/if}\n        {else}\n\
  \          {foreach \\_page in range(1, ceil($count / $limit))}\n            <option\
  \ {if $page == \\_page}selected = \"selected\"{/if} value = \"{echo \\_page}\" >\
  \ {echo \\_page}</option>\n          {/foreach}\n        {/else}\n      </select>\n\
  \    </label>\n  </</li>\n  <li>\n    <label>\n      Limit:\n      <select name\
  \ = \"limit\">\n        <option {if $limit == \"10\"}selected= \"selected\"{/if}\
  \ value= \"10\" > 10</option>\n        <option {if $limit == \"20\"}selected= \"\
  selected\"{/if} value= \"20\" > 20</option>\n        <option {if $limit == \"30\"\
  }selected= \"selected\"{/if} value= \"30\" > 30</option>\n      </select>\n    </label>\n\
  \  </</li>\n  <li>\n    <input type = \"submit\" name = \"search\" value = \"search\"\
  \ />\n  </</li>\n</ol>\n</form>\n```\n\n你应该注意到的第一点是，我们没有将表单封装在任何条件判断中。它应该是始终可见的（并且在可用时用之前提交的数据预填充）。即使表单没有被提交，我们也可以用赋值的变量来填充字段，因为我们选择了合理的默认值。\n\
  \n排序和方向字段相对比较容易理解——它们仅仅是静态字段。如果任何选项与它们对应的提交字段匹配，它们将默认被选中。这有助于向用户指示哪些选项之前被选中过。\n\n\
  页码字段有点复杂。如果 `$users` 变量中没有用户行，那么该字段仅适用于后续查询，在这种情况下，只有跳转到第 1 页是有意义的。反之，如果有用户行，则需要考虑总共有多少行匹配行，并渲染出一个可能的页码列表。这是通过生成从\
  \ 1 到总行数除以页大小之间的页码范围来实现的。我们将这个数字向上取整，以考虑到列表末尾的不完整行。限制（limit）字段是一个简单的静态页大小列表。所有这些字段都会反馈到用户行的查询中。\n\
  \n我们还需要创建一个找到的用户行列表，如列表 15-18 所示。\n\n**列表 15-18。** `application/views/users/search.html`（摘）\n\
  \n```html\n{if $users != false}\n<table>\n  <tr>\n    <th> 姓名</th>\n  </tr>\n  {foreach\
  \ $row in $users}\n    <tr>\n      <td>{echo $row- > first} {echo $row- >last}</td>\n\
  \    </tr>\n  {/foreach}\n</table>\n{/if}\n```\n\n这段代码生成了一个简单的表格，包含了找到的用户的姓名和姓氏。在下一章中，我们将查看如何访问页面并添加他们为好友，因此这作为对完整模板的最后回顾。\n\
  \n\n\n\n3. 将数据分配到共享存储（prepend, set, append, yield）允许从任何模板作用域访问数据，无论是在布局（layout）、动作（action）还是部分模板（partials）中。它最适用于单维数据，如字符串或整数，因为我们的标签不允许从存储的对象中检索子项。模板数据值被分配给单个模板，并且无法在该特定模板的作用范围之外访问。\n\
  \n### 练习\n\n1. 我们已经讨论了共享数据存储（prepend, set, append, yield）与模板数据值之间的区别。现在尝试创建额外的（扩展的）模板标签，允许对共享存储中的对象进行子项访问（例如\
  \ `{yield scripts.shared}`）。\n\n2. 我们的 `search()` 动作仅通过发音相同的名字进行搜索（使用 `SOUNDEX`）。现在为该查询添加姓氏（last\
  \ name）字段。\n\n3. 我们的 `Request` 类没有管理 cookie。现在尝试为它们添加支持吧！\n\n# 第 16 章：设置\n\n在本章中，我们将学习如何通过扩展\
  \ `Model` 类来更好地验证提交的表单数据。这允许我们将通常涉及应用程序数据的任务委托给数据（或业务逻辑）应该所在的模型。\n\n## 目标\n\n- 我们需要扩展\
  \ `Model` 类，包含对提交表单数据验证的方法，并在允许添加、更新或删除行之前应用此类验证。\n- 我们需要为设置页面创建动作（action）和视图（view）。\n\
  \n## 验证\n\n正确的验证是一件困难的事情，特别是当 MVC 的目标是实现关注点分离时。验证与许多不相关的组件有关，主要是数据类型和视图。验证的基本功能是确保用户输入，但这必须来自某个地方（例如视图/表单数据）。这些数据必须与预定义的数据结构（如数据库表字段）相关，并且验证需要向用户提供反馈，让他们知道提交的数据出了什么问题。\n\
  \n由于我们已经有一个相当广泛的 ORM 库并将其包含在模型层中，我们将在模型层中添加验证逻辑。我们想要做的是不仅定义我们的数据库字段（在模型级别），还定义数据必须通过的验证。考虑列表\
  \ 16-1 所示的示例模型。\n\n***列表 16-1 验证模型***\n\n```php\nclass User extends Shared\\Model\n\
  {\n    /**\n     * @column\n     * @readwrite\n     * @primary\n     * @type autonumber\n\
  \     */\n    protected $_id;\n\n    /**\n     * @column\n     * @readwrite\n  \
  \   * @type text\n     * @length 100\n     *\n     * @validate required, alpha,\
  \ min(3), max(32)\n     * @label first name\n     */\n    protected $_first;\n\n\
  \    /**\n     * @column\n     * @readwrite\n     * @type text\n     * @length 100\n\
  \     *\n     * @validate required, alpha, min(3), max(32)\n     * @label last name\n\
  \     */\n    protected $_last;\n\n    /**\n     * @column\n     * @readwrite\n\
  \     * @type text\n     * @length 100\n     * @index\n     * @validate required,\
  \ max(100)\n     * @label email address\n     */\n    protected $_email;\n\n   \
  \ /**\n     * @column\n     * @readwrite\n     * @type text\n     * @length 100\n\
  \     * @index\n     * @validate required, min(8), max(32)\n     * @label password\n\
  \     */\n    protected $_password;\n}\n```\n\n我们添加两个新的元数据字段：`@validate` 和 `@label`。如果这些字段可以用于\
  \ (1) 定义对包含的数据应执行的验证，以及 (2) 自定义呈现给用户的验证消息，将是理想。为了实现这两个需求，我们需要修改 `Model` 类。\n\n**注意**：验证是\
  \ Web 应用的常见需求，因此我们可以安全地将其添加到框架中。如果需求是特定于应用程序，我们将考虑创建一个共享库。我们需要对 `Model` 类做的第一个更改是添加一个验证方法和消息的映射，如列表\
  \ 16-2 所示。\n\n***列表 16-2 验证映射***\n\n```php\n/**\n * @read\n */\nprotected $_validators\
  \ = array(\n    \"required\" => array(\n        \"handler\" => \"_validateRequired\"\
  ,\n        \"message\" => \"The {0} field is required\"\n    ),\n    \"alpha\" =>\
  \ array(\n        \"handler\" => \"_validateAlpha\",\n        \"message\" => \"\
  The {0} field can only contain letters\"\n    ),\n    \"numeric\" => array(\n  \
  \      \"handler\" => \"_validateNumeric\",\n        \"message\" => \"The {0} field\
  \ can only contain numbers\"\n    ),\n    \"alphanumeric\" => array(\n        \"\
  handler\" => \"_validateAlphaNumeric\",\n        \"message\" => \"The {0} field\
  \ can only contain letters and numbers\"\n    ),\n    \"max\" => array(\n      \
  \  \"handler\" => \"_validateMax\",\n        \"message\" => \"The {0} field must\
  \ contain less than {2} characters\"\n    ),\n    \"min\" => array(\n        \"\
  handler\" => \"_validateMin\",\n        \"message\" => \"The {0} field must contain\
  \ more than {2} characters\"\n    )\n);\n\n/**\n * @read\n */\nprotected $_errors\
  \ = array();\n```\n\n`$_validators` 数组将由 `Model` 类用于确定要执行的适当验证方法（基于元数据）。为了说明这一点，一个类似于\
  \ `@validate required` 的元数据标记将导致执行 `_validateRequired()` 方法（在 `Model` 类上），并显示错误\
  \ \"The {0} field is required\"。我们将 `{0}` 替换为适当的值。接下来，我们需要创建在 `$_validators` 数组中定义的验证方法，如列表\
  \ 16-3 所示。\n\n***列表 16-3 验证方法***\n\n```php\nprotected function _validateRequired($value)\
  \ {\n    return !empty($value);\n}\n\nprotected function _validateAlpha($value)\
  \ {\n    return StringMethods::match($value, \"^a-zA-Z]+\");\n}\n\nprotected function\
  \ _validateNumeric($value) {\n    return StringMethods::match($value, \"⁰-9]+\"\
  );\n}\n\nprotected function _validateAlphaNumeric($value) {\n    return StringMethods::match($value,\
  \ \"^a-zA-Z0-9]+\");\n}\n\nprotected function _validateMax($value, $number) {\n\
  \    return strlen($value) <= (int)$number;\n}\n\nprotected function _validateMin($value,\
  \ $number) {\n    return\n}\n```\n\n这些验证方法都相当简单，每个都执行所需的验证并返回成功或失败。在后续章节添加自定义字段验证时，我们需要记住这种行为。`validate()`\
  \ 方法的基本功能可以通过列表 16-4 所示的伪代码来理解。\n\n***列表 16-4 validate() 方法的工作***\n\n```\nfunction\
  \ validate {\n    set error flag to false\n    for each column {\n        if column\
  \ must validate {\n            for each condition {\n                run condition\
  \ validate method\n                if validation failed {\n                    make\
  \ error message and save to array\n                    set error flag to true\n\
  \                }\n            }\n        }\n    }\n    return error flag\n}\n\
  ```\n\n实际的 `validate()` 方法如列表 16-5 所示，基本相同，但多了一些细节。\n\n***列表 16-5 validate() 方法***\n\
  \n```php\npublic function validate() {\n    $this->_errors = array();\n    $columns\
  \ = $this->getColumns();\n    foreach ($columns as $column) {\n        if ($column[\"\
  validate\"]) {\n            $error = false;\n            $pattern = \"#\\[a-z\\\
  ] + \\\\((\\[a-zA-Z0-9, \\\\+)\\\\)\\\\#\";\n            $raw = $column[\"raw\"\
  ];\n            $name = $column[\"name\"];\n            $validators = $column[\"\
  validate\"];\n            $label = $column[\"label\"];\n            $defined = $this->getValidators();\n\
  \            foreach ($validators as $validator) {\n                $function =\
  \ $validator;\n                $arguments = array(\n                    $this->$raw\n\
  \                );\n                $match = StringMethods::match($validator, $pattern);\n\
  \                if (count($match) > 0) {\n                    $matches = StringMethods::split($match[0],\
  \ \",\\\\s*\");\n                    $arguments = array_merge($arguments, $matches);\n\
  \                }\n                $offset = StringMethods::indexOf($validator,\
  \ \"(\");\n                $function = substr($validator, 0, $offset);\n       \
  \     }\n        }\n    }\n}\n```\n\n\n\n\n# 第 16 章 设置\n\n```php\nif (!isset($defined[$function]))\n\
  {\n    throw new Exception\\Validation(\"The {$function} validator is not defined\"\
  );\n}\n\n$template = $defined[$function];\n\nif (!call_user_func_array(array($this,\
  \ $template[\"handler\"]), $arguments))\n{\n    $replacements = array_merge(array(\n\
  \        $label ? $label : $raw\n    ), $arguments);\n    $message = $template[\"\
  message\"];\n    foreach ($replacements as $i => $replacement)\n    {\n        $message\
  \ = str_replace(\"{{$i}}\", $replacement, $message);\n    }\n    if (!isset($this->errors[$name]))\n\
  \    {\n        $this->errors[$name] = array();\n    }\n    $this->errors[$name][]\
  \ = $message;\n    $error = true;\n}\n}\n}\nreturn !$error;\n\n```\n\n`validate()`\
  \ 方法首先获取列列表并对该列表进行迭代。对于每一列，我们确定是否应该执行验证。然后，我们将 `@validate` 元数据拆分为一个验证条件列表。如果某个条件带有参数（例如\
  \ `max(100)`），我们会提取出这些参数。\n\n接着，我们会在列数据上运行每个验证方法，并为那些失败的验证条件生成错误消息。我们返回一个最终的 `true/false`\
  \ 值，表示整个验证过程是通过还是失败。\n\n这改变了我们控制器中的几处地方。首先，我们不再需要在每个 action 中创建单独的验证逻辑。验证逻辑定义在模型中，并在我们每次调用\
  \ `validate()` 方法时都会应用。\n\n让我们如示例 16-6 所示，如何修改 `Users` 控制器中的 `register()` action。\n\
  \n### 示例 16-6. register() Action\n\n```php\npublic function register()\n{\n    $view\
  \ = $this->getActionView();\n    if (RequestMethods::post(\"register\"))\n    {\n\
  \        $user = new User(array(\n            \"first\" => RequestMethods::post(\"\
  first\"),\n            \"last\" => RequestMethods::post(\"last\"),\n           \
  \ \"email\" => RequestMethods::post(\"email\"),\n            \"password\" => RequestMethods::post(\"\
  password\")\n        ));\n        if ($user->validate())\n        {\n          \
  \  $user->save();\n            $view->set(\"success\", true);\n        }\n     \
  \   $view->set(\"errors\", $user->getErrors());\n    }\n}\n```\n\n这个新的 `register()`\
  \ action 有两个主要区别。第一个是我们已经从每个表单字段中移除了验证代码。现在这由新的 Model 验证逻辑处理。此外，我们可以进行各种验证，而不仅仅是以前那种简单的（必填）验证条件。\n\
  \n第二个大变化是，我们在保存 `$user` 记录之前会先检查 `validate()` 方法的结果。在此之前，我们只在所有数据都正确后才创建新的 `User`\
  \ 实例，而现在我们在检查数据之前就创建它。只要我们不保存错误的数据，这种差异就并不重要。我们的 `register()` action 比之前的版本要短得多。未来的\
  \ action（涉及将数据保存到数据库）在有了这段验证代码后也应该显著短。\n\n### 验证必填项 (Validate Required)\n\n你可能会奇怪为什么我们没有修改\
  \ `login()` action。`login()` action 实际上保持不变，原因有两个：\n\n- 它提供的信息比用户在登录时需要的要多。他们不需要知道什么构成了良好的姓名数据，或者密码应该是多少字符；他们只需要知道他们的凭据是否允许他们登录（或未允许）。\n\
  - 新的验证要求我们在验证之前创建一个 `User` 实例。这与登录应该的工作方式恰相反。我们希望在凭据有效时返回用户记录，而不是反过来。\n\n在正确的时间使用这种新验证至关重要。将它添加到\
  \ `login()` action 中是不理想的，并且会使 `login()` action 变得复杂。\n\n### 设置 (Settings)\n\n在之前的章节中，我们重构了控制器以自动加载用户，并通过添加\
  \ settings 页面修改了它。我们需要为 settings 创建视图。查看示例 16-7 以了解我们如何实现这一点。\n\n### 16-7. application/views/settings.html\n\
  \n```html\n<h1>Settings</h1>\n<?php if ($success): ?>\n    Your account has been\
  \ updated!\n<?php else: ?>\n    <form method=\"post\">\n        <ol>\n         \
  \   <li>\n                <label>\n                    First name:\n           \
  \         <input type=\"text\" name=\"first\" value=\"<?php echo htmlspecialchars($user['first']);\
  \ ?>\">\n                    <?php if (isset($errors['first'])): ?>\n          \
  \              <br><?php echo $errors['first']; ?>\n                    <?php endif;\
  \ ?>\n                </label>\n            </li>\n            <li>\n          \
  \      <label>\n                    Last name:\n                    <input type=\"\
  text\" name=\"last\" value=\"<?php echo htmlspecialchars($user['last']); ?>\">\n\
  \                    <?php if (isset($errors['last'])): ?>\n                   \
  \     <br><?php echo $errors['last']; ?>\n                    <?php endif; ?>\n\
  \                </label>\n            </li>\n            <li>\n               \
  \ <label>\n                    Email:\n                    <input type=\"text\"\
  \ name=\"email\" value=\"<?php echo htmlspecialchars($user['email']); ?>\">\n  \
  \                  <?php if (isset($errors['email'])): ?>\n                    \
  \    <br><?php echo $errors['email']; ?>\n                    <?php endif; ?>\n\
  \                </label>\n            </li>\n            <li>\n               \
  \ <label>\n                    Password:\n                    <input type=\"password\"\
  \ name=\"password\">\n                    <?php if (isset($errors['password'])):\
  \ ?>\n                        <br><?php echo $errors['password']; ?>\n         \
  \           <?php endif; ?>\n                </label>\n            </li>\n     \
  \       <li>\n                <input type=\"submit\" name=\"update\" value=\"update\"\
  \ />\n            </li>\n        </ol>\n    </form>\n<?php endif; ?>\n```\n\n###\
  \ 16-8. settings() 方法\n\n```php\npublic function settings()\n{\n    $view = $this->getActionView();\n\
  \    $user = $this->getUser(); // 假设有此方法\n\n    if (RequestMethods::post(\"update\"\
  ))\n    {\n        $user->fill(array(\n            \"first\" => RequestMethods::post(\"\
  first\"),\n            \"last\" => RequestMethods::post(\"last\"),\n           \
  \ \"email\" => RequestMethods::post(\"email\")\n        ));\n\n        if ($user->validate())\n\
  \        {\n            $user->save();\n            $view->set(\"success\", true);\n\
  \        }\n    }\n    $view->set(\"errors\", $user->getErrors());\n    $view->set(\"\
  user\", $user);\n}\n```\n\n`settings()` action 与 `register()` action 几乎相同。回看注册视图，你会记得之前的错误报告非常简单，这是因为每个字段只有一个错误消息。如果我们必须整合新的验证机制，注册页面将会变得更加臃肿，正如示例\
