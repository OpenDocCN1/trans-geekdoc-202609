  \n### 回答\n\n2. `Zend Framework` 会自动加载视图（基于控制器和操作名称），这与我们自己的框架一样，而 `CodeIgniter`\
  \ 则需要显式地加载视图。这种方法的优缺点是什么？\n\n-   需要处理更多的类/接口意味着更复杂的复杂性。由于 `Zend Framework` 需要你注意的各种不同类，它的学习曲线更陡峭，但这允许更精细的粒度控制。例如，我们可以为表添加不属于模型的方法。`Zend\
  \ Framework` 甚至有一个行级接口（扩展自 `Zend_Db_Table_Row_Abstract` 的类），它允许使用行级方法。自动加载视图非常方便，但当我们不想加载某个视图，或者视图的名称与控制器和操作名称不符时，就会产生一个问题。在这些情况下，了解如何切换自动渲染或能够覆盖将要使用的视图是有好的。\n\
  \n### 练习题\n\n1. 我们的 `User` 模型镜像了我们框架以及 `CodeIgniter` 模型的行为，但如果将此功能放在一个被子类的类中会更好。尝试这样做。\n\
  \n2. 查看 `Zend Framework` 文档，并尝试禁用或防止自动视图渲染的几种方法。\n\n**注意**：你可以在 `http://framework.zend.com/manual/en/zend.controller.action.html`\
  \ 找到更多关于操作视图和视图模板如何交互，以及如何禁用自动视图渲染的信息。\n\n# 第 28 章：Zend Framework：扩展\n\n在我们尝试理解\
  \ `Zend Framework` 的更细细节时，我们需要意识到它并没有带有一系列广泛的库，而是*本身*就是一个大致排列成连贯 MVC 框架的广泛库集合。因此，使用内部库与使用第三方库没有区别这并不令人意外。让我们来看看如何实现。\n\
  \n## 目标\n\n- 我们需要学习如何使用内置的 `Zend Framework` 类。\n- 我们需要学习如何在我们的 `Zend Framework`\
  \ 应用程序中包含我们自己的（第三方）库。\n\n## 文件上传\n\n`Zend Framework` 提供的优秀类之一是 `File_Transfer` 类。该类处理大多数应用程序的常规文件上传，允许开发者专注于业务逻辑。类似于我们的\
