  \n\n\n\n\n# 第 12 章 ■ 结构\n\n## 用户\n- 朋友\n- 照片\n- 状态消息 +\n- 分享链接/照片\n\n![Image 2](img/index-196_1.png)\n\
  *图 12-1. 数据结构*\n\n所有用户和内容都可以通过管理界面进行管理，该界面需要对有效的管理员用户账户进行身份验证。我们将根据需要创建具体的模型结构。\n\
  \n## 文件夹\n我们需要为应用程序建立文件夹结构，以便将文件存储在可预知的位置。我们已经将框架安排在同名的文件夹中，但应用程序的其余部分应该遵循图 12-2\
  \ 所示的整洁的组织模式。\n\n*图 12-2. 文件夹结构*\n\n应用程序文件夹将是我们存放所有跨界内容的地方，从框架代码到应用程序代码无是。我们创建的\
  \ HTML 视图将放在 `views` 文件夹中，而任何第三方库将放在 `libraries` 文件夹中。\n\n`configuration` 文件夹将存放应用程序类的配置文件，而\
  \ `model` 和 `controller` 文件将放在它们各自的文件夹中。\n\n`public` 文件夹将包含所有公开访问的文件，这些文件在应用程序执行过程中不会直接加载。这包括图像、JavaScript\
  \ 文件和层样式表。\n\n值得注意的一点是，我们的应用程序测试保存在 `public` 文件夹中。我们这样做是为了让测试与框架和应用程序代码库完全分离。我们的测试最终将使用框架代码，并测试框架/应用程序代码，但尝试将所有这些方面（测试、框架和应用程序）分开是重要的。\n\
  \n## 问题\n1. 我们已经为社交网络中的数据库表/数据对象定义了一个粗略的结构。在开始编码之前，规划数据结构的意义何？\n2. 我们使用的文件夹结构在很大程度上取决于我们正在构建的应用程序类型。既然在我们开始开发的每个应用程序中，这可能会发生不同程度的改变，为什么我们还需要决定这一点呢？\n\
  \n### 回答\n1. 在任何应用程序上花费的时间越多，开发进展得越顺畅。这在 MVC 应用程序中尤为明显。当我们的应用程序使用数据库时，我们不仅仅是使用 `PHP`\
  \ 来查询数据库；我们正在构建模型并像处理任何其他类一样与数据库交互。我们需要提前知道这些类应该是什么样子的。\n2. 文件夹结构在两个方面很重要。第一是它能保持一切的整洁。第二是我们可以快速找到东西。无论我们是在寻找模型、控制器，甚至是第三方库，通过理解文件夹结构，我们都能快速找到它。\n\
  \n# 第 13 章 ■ 引导 (Bootstrapping)\n\n引导（Bootstrapping）是对在没有外部帮助的情况下运行的自持续过程的隐喻。就我们的框架而言，引导是一个术语，指的是我们的框架将执行一系列过程，以便从\
  \ Web 地址跳转到特定的控制器、模型和视图。\n\n之所以需要这些过程是因为我们的框架侧重于 OOP（面向对象编程）实践，在 OOP 中，我们试图将尽可能的功能隔离在单个类中。如果我们尝试使用函数式方法来构建\
  \ MVC 框架，将意味着我们的代码是以自上而下的方式执行的，并且不需要初始代码将各个类缝成一个有意义的应用程序。\n\n到目前为止，我们已经构建了许多单独类，这些都是构建良好框架的基础。当我们开始在框架之上构建应用程序时，我们需要开始考虑每个部分如何与它需要的所有其他部分进行相互作用。这从引导开始。\n\
  \n## 目标\n- 我们需要拦截对应用程序的请求（通过 `.htaccess`）并将这些请求重定向到引导文件。\n- 引导文件需要实例化运行应用程序所需的类。这些包括\
  \ `configuration`、`cache` 和 `router` 等。\n- `router` 将决定加载哪个控制器和动作。控制器将首先允许动作执行，然后渲染动作的视图（如果找到了匹配的视图）。\n\
  \n## 当文件不是文件……\n进入框架开发领域的开发者可能会惊讶地发现，唯一的 Web 地址并不一定指向 Web 服务器上的唯一文件。多个域名指向同一个网站是常见的。同样，带有不同查询参数的地址指向同一个文件也是常见的。我所说的地址到文件的关系，是\
  \ Web 服务器根据模式匹配将地址（任何类型）重定向到它们选择的任何文件。这种过程被称为 `URL 重写`。\n\nURL 重写是服务器可以做的，只要提供了足够的指令，告诉它匹配哪些地址以及将相应的请求发送到哪里。请求可以重定向到本地文件系统的文件/脚本，甚至是远程文件和/或地址。这些指令通常位于特定\
  \ Web 服务器的配置文件。\n\n某些 Web 服务器（例如 `Apache2`）允许在服务器启动的同时加载这些配置文件。这些服务器可能允许在每个目录中存储配置文件，如\
  \ `Apache2` 所示。\n\n# 第 13 章 ■ 引导 (Bootstrapping)\n\n## URL 重写\nURL 重写对我们重要的原因在于我们将使用它将所有请求汇集到单个\
  \ `index.php` 文件中。这是因为我们希望通过相同的引导代码（包含 `index.php` 中）处理所有请求，以便我们在没有重复代码的情况下选择最佳响应。\n\
  \n我提到了我们可以用于初始化 URL 重写的基于目录的配置文件，我们将创建一个。它应该放在 `public` 文件夹中，你的 Web 服务器根目录应该指向 `public`\
  \ 文件夹内部。这将确保我们的应用程序代码可以读取所有的框架文件，而只有 `public` 文件夹包含的文件对外部世界开放。让我们看看列表 13-1 中的文件是什么样的。\n\
  \n*列表 13-1. Apache2 中的 URL 重写*\n\n```\nRewriteEngine On\nRewriteCond %{REQUEST_FILENAME}\
  \ !-d\nRewriteCond %{REQUEST_FILENAME} !-f\nRewriteCond %{REQUEST_URI} !=/favicon.ico\n\
  RewriteRule ^([a-zA-Z0-9/\\-\\_]+)\\.?([a-zA-Z]+)?$ index.php?url = $1&extension\
  \ = $2 [QSA,L]\n```\n\n\n\n\n第四条指令告诉 Apache2 忽略所有对 [`localhost/favicon.ico`](http://localhost/favicon.ico)\
  \ 的请求。浏览器会频繁请求此类标准文件，我们不希望这些额外的流量触发 404 错误页面，因为我们的框架并不处理该地址。\n\n最后一条指令是最重要的。它告诉\
  \ Apache2 匹配所有包含 `a-zA-Z0-9/-\\_` 字符（所有大小写字母和数字）的地址，并将它们作为查询字符串参数（querystring parameter）传递给\
  \ `index.php` 文件。它还告诉 Apache2 将提到的任何文件扩展名作为查询字符串参数发送给 `index.php` 文件。\n\n例如，对 [`localhost/users/add.html`](http://localhost/users/add.html)\
  \ 的请求将通过此 `.htaccess` 文件，Apache2 将请求（带有查询字符串参数和表单数据）发送到地址 [`localhost/index.php?url=users/add&extension=html`](http://localhost/index.php?url=users/add&extension=html)。\n\
  \n你可能会奇怪，为什么我们想要将所有请求隔离在公共目录（public directory）中，而不是简单将 `index.php` 文件放在与我们的应用程序/框架目录相同的目录中。原因是，我们的\
  \ `.htaccess` 无法区分可以从外部合法访问的文件（脚本、样式表和图像）以及那些应该被保护的文件。我们不希望人们篡改我们的框架和应用程序代码。\n\n\
  我们应该消除 Web 服务器返回敏感 PHP 代码的可能性，这是朝着正确方向迈的一步！\n\n**注意**：如果你在让 Web 服务器使用公共目录作为根目录时遇到困难，也可以尝试创建一个次级\
  \ `.htaccess` 文件将所有请求重定向到公共目录，但 Apache 需要启用 `mod_rewrite` 以你才能使用 URL 重写。\n\n202\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n# 第 13 章 ■ 引导自启动\n\n## Index.php\n\
  \n我们现在需要创建一个脚本，将重定向的请求发送到控制器/动作（controller/action）。该文件正如你所想的，就是 `index.php`。这是一个简单的任务，构成了在本章中我们需要创建的启动代码（bootstrapping\
  \ code）的大部分。\n\n你可能将启动代码视为我们已经创建的框架代码的扩展，但它实际上是我们将创建的首个特定于应用程序的代码。事实上，在现阶段，框架已经大部分完成。它具备了将请求路由到控制器并加载模型的能力。它可以将这些模型结构（ORM\
  \ 数据对象）持久化到数据库。我们已经创建了解析模板的代码、管理缓存和配置文件的代码，甚至还有处理会话、检查类结构以及存储类实例的代码。然而，为了让应用程序利用这些框架类，它必须首先将它们加载到内存并将它们连接起来。这就是我们即将创建的启动代码的核心。\n\
  \n我们预期的会在整个框架中用到一些框架类。让应用程序运行起来的第一步是实例化这些类并将它们存储在注册表（registry）中。我们在建立应用程序目录后执行此操作（以便类加载器知道从哪里开始查找框架类），并在随后立即分发请求。从代码来看，我们的\
  \ `index.php` 应该像这样：\n\n### 列表 13-2. 引导\n\n```php\n// 1. 定义应用程序路径\ndefine(\"APP_PATH\"\
  , dirname(__FILE__));\n\n// 2. 引入核心文件 \nrequire(\"../framework/core.php\");\nCore::initialize();\n\
  \n// 3. 加载配置类\n$configuration = new Configuration();\nRegistry::set(\"configuration\"\
  , $configuration);\n\n// 4. 加载数据库类\n$database = new Database();\nRegistry::set(\"\
  database\", $database);\n\n// 5. 加载缓存类\n$cache = new Cache();\nRegistry::set(\"\
  cache\", $cache);\n\n// 6. 加载会话类\n$session = new Session();\nRegistry::set(\"session\"\
  , $session);\n\n// 7. 加载路由类\n$router = new Router(\n    isset($_GET['url']) ? $_GET['url']\
  \ : 'index',\n    isset($_GET['extension']) ? $_GET['extension'] : 'html'\n);\n\
  Registry::set(\"router\", $router);\n\n// 8. 分发请求\n$router->dispatch();\n\n// 9.\
  \ 取消全局变量\nunset($configuration);\nunset($database);\nunset($cache);\nunset($session);\n\
  unset($router);\n```\n\n\n\n\n可以确定的是，`Database` 和 `Cache`（甚至 `Session`）的实例需要我们尚未提供的配置参数。这些参数对于我们的框架类能够基本知道连接到哪些服务以及使用什么凭据进行连接至关重要。这些细节需要提供，但我们在这里并没有提到它们。这是由于我们即将添加到每个大型类工厂中的一些代码导致的。\n\
  \n## 数据库\n\n我们可以从 `Database` 工厂类开始。至少，工厂需要知道它要创建的是什么类型的数据库驱动程序。我们可以通过对 `Database::initialize()`\
  \ 方法进行修改来实现这一点，如列表 13-3 所示。\n\n### 列表 13-3. 自动数据库配置\n\n```php\npublic function initialize()\n\
  {\n    $type = $this->getType();\n    if (empty($type))\n    {\n        $configuration\
  \ = Registry::get(\"configuration\");\n        if ($configuration)\n        {\n\
  \            $configuration = $configuration->initialize();\n            $parsed\
  \ = $configuration->parse(\"configuration/database\");\n            if (!empty($parsed->database->default)\
  \ && !empty($parsed->database->default->type))\n            {\n                $type\
  \ = $parsed->database->default->type;\n                unset($parsed->database->default->type);\n\
  \                $this->__construct(array(\n                    \"type\" => $type,\n\
  \                    \"options\" => (array) $parsed->database->default\n       \
  \         ));\n            }\n        }\n    }\n    if (empty($type))\n    {\n \
  \       throw new Exception\\Argument(\"Invalid type\");\n    }\n    switch ($type)\n\
  \    {\n        case \"mysql\":\n        {\n            return new Database\\Connector\\\
  Mysql($this->getOptions());\n            break;\n        }\n        default:\n \
  \       {\n            throw new Exception\\Argument(\"Invalid type\");\n      \
  \      break;\n        }\n    }\n}\n```\n\n之前我们简单地拒绝任何类实例的请求（通过 `Database::initialize()`\
  \ 方法），而现在我们首先检查它是否已被提供。如果在构造选项中没有找到它，我们将尝试加载数据库配置文件 `application/configuration/database.ini`。如果解析后的配置数据定义了默认数据库类型，则该类型将用于数据库连接器类初始化中。\n\
  \n此修改后的方法确保了，如果存在数据库配置文件，并且它包含一个定义了默认数据库连接器类型的默认数组，将返回该类型的连接器实例。这只有在构造选项中未找到 `type`\
  \ 时才会发生。\n\n**注意**：当涉及 `Database` 工厂时，重要的是记住初始化并不等同于连接数据库。工厂返回一个有效的连接器实例，但该实例随后使用提供的凭据无法连接到数据库，这是完全合理的。\n\
  \n### 缓存\n\n`Cache` 类工厂的自动配置与 `Database` 类工厂的配置非常相似。它涉及对 `Cache::initialize()` 方法进行类似的修改，你可以在列表\
  \ 13-4 中看到该修改。\n\n### 列表 13-4. 自动缓存配置\n\n```php\npublic function initialize()\n\
  {\n    $type = $this->getType();\n    if (empty($type))\n    {\n        $configuration\
  \ = Registry::get(\"configuration\");\n        if ($configuration)\n        {\n\
  \            $configuration = $configuration->initialize();\n            $parsed\
  \ = $configuration->parse(\"configuration/cache\");\n            if (!empty($parsed->cache->default)\
  \ && !empty($parsed->cache->default->type))\n            {\n                $type\
  \ = $parsed->cache->default->type;\n                unset($parsed->cache->default->type);\n\
  \                $this->__construct(array(\n                    \"type\" => $type,\n\
  \                    \"options\" => (array) $parsed->cache->default\n          \
  \      ));\n            }\n        }\n    }\n    if (empty($type))\n    {\n    \
  \    throw new Exception\\Argument(\"Invalid type\");\n    }\n    switch ($type)\n\
  \    {\n        case \"memcached\":\n        {\n            return new Cache\\Driver\\\
  Memcached($this->getOptions());\n            break;\n        }\n        default:\n\
  \        {\n            throw new Exception\\Argument(\"Invalid type\");\n     \
  \       break;\n        }\n    }\n}\n```\n\n缓存驱动器的默认类型定义在 `application/configuration/cache.ini`\
  \ 文件中，它显然是缓存驱动器类的列表，而不是数据库连接器类。除此之外，自动配置遵循与 `Database` 类工厂相同的模式。\n\n**注意**：根据 `Cache`\
  \ 驱动程序的不同，`Cache::initialize()` 和 `Cache->connect()` 之间可能存在相同的区别。在 `Memcached` 的情况下，没有用户凭据，但涉及地址和端口，因此可能有一个有效的缓存实例，但它随后无法连接到有效的服务器。请始终参考工厂类执行操作失败时生成的异常类型——它们很可能是类似于\
  \ `Database/Exception/Service` 或 `Cache/Exception/Service` 的类型，这表示一个有效实例无法连接到所需的服务器/服务。\n\
  \n## 控制器\n\n引导启动谜图中最后一部分并不是严格关于引导启动或我们的框架。它实际上关乎每个控制器将如何渲染视图。让我通过这种方式来揭开这个话题：这段代码同样属于应用代码和框架代码领域。\n\
  \n如果我们回顾框架的三个目标，会记得第二个目标是创建一个易于使用的框架，并且对我们用它来创建的应用程序少做假设。然而，在某些时刻这两个陈述是相互矛盾的。一个非常实用的例子就是视图渲染。\n\
  \n我们可以假设应用程序中的所有操作（actions）都会产生一个响应。而且，这种响应应该以能够向应用程序用户传递信息的形式呈现。它可以是 HTML、JavaScript\
  \ (JSON) 或 XML 等。关键点在于，我们所有的（或几乎没有区别的）操作都需要输出，而输出可能会以视图的形式出现。\n\n出于这个原因，MVC 范式是框架的一个极佳选择。我们预期许多控制器都需要渲染视图。\n\
  \n\n\n\n\n```php\n$this- > \\_template = new Template(array(\n\"implementation\"\
  \ = > new Template\\\\Implementation\\\\Standard()\n));\n}\n\npublic function render()\n\
  {\n    if (!file\\_exists($this- > getFile()))\n    {\n        return \"\";\n  \
  \  }\n    $content = file\\_get\\_contents($this- > getFile());\n    $this- > \\\
  template- > parse($content);\n    return $this- > \\template- > process($this- >\
  \ \\_data);\n}\n\npublic function get($key, $default = \"\")\n{\n    if (isset($this-\
  \ > \\_data[$key]))\n    {\n        return $this- > \\_data[$key];\n    }\n    return\
  \ $default;\n}\n\nprotected function \\_set($key, $value)\n{\n    if (!is\\_string($key)\
  \ && !is_numeric($key))\n    {\n        throw new Exception\\\\Data(\"Key must be\
  \ a string or a number\");\n    }\n    $this- > \\_data[$key] = $value;\n}\n\npublic\
  \ function set($key, $value = null)\n{\n    if (is\\_array($key))\n    {\n     \
  \   foreach ($key as $\\_key = > $value)\n        {\n            $this- > \\set($$_key,\
  \ $value);\n        }\n        return $this;\n    }\n    $this- > \\set($key, $value);\n\
  \    return $this;\n}\n\npublic function erase($key)\n{\n    unset($this- > \\_data[$key]);\n\
  \    return $this;\n}\n}\n```\n\n关于 `View` 类有几点需要注意。首先，它的构造函数方法会创建一个 `Template`\
  \ 实例，稍后它将使用该实例来解析视图模板。其次，它拥有用于存储、检索和删除模板数据键/值对的方法，并将其这些方法提供给模板解析器。你可以将 `View` 类想象为类似于缓存驱动程序以及我们之前看到的模板解析器用法示例的结合体。\n\
  \n我们假设视图将通过我们创建的模板解析器发送。如果我们希望发生不同的行为，可以轻松地子类这个 `View` 类，用我们的替代逻辑重写 `__construct()`\
  \ 和 `render()` 方法。然而，此类确实为我们的模板解析提供了一个方便的门面。\n\n**注意**：我们之前使用的门面设计模式可以描述为：有一个类为一组复杂的功能提供了一个简单的接口。你可以在\
  \ `http://en.wikipedia.org/wiki/Facade_pattern` get 更多关于门面模式的知识。\n\n### 渲染\n\n`View`\
  \ 类仅是自动渲染正确视图所需工作的一半。现在我们需要在修改后的 `Controller` 类中使用它，以便每个 action 都能渲染其自己的视图。`Controller`\
  \ 所需的更改相当多，因此我们将审查每个部分。我们从对之前的 `Controller` 骨架进行一些装饰开始，如列表 13-6 所示。\n\n### 列表 13-6.\
  \ 完善 Controller\n\n```php\nnamespace Framework\n{\n    use Framework\\\\Base as\
  \ Base;\n    use Framework\\\\View as View;\n    use Framework\\\\Registry as Registry;\n\
  \    use Framework\\\\Template as Template;\n    use Framework\\\\Controller\\\\\
  Exception as Exception;\n\n    class Controller extends Base\n    {\n        /**\
  \ @readwrite */\n        protected $\\$_parameters;\n        /** @readwrite */\n\
  \        protected $\\$_layoutView;\n        /** @readwrite */\n        protected\
  \ $\\$_actionView;\n        /** @readwrite */\n        protected $\\$_willRenderLayoutView\
  \ = true;\n        /** @readwrite */\n        protected $\\$_willRenderActionView\
  \ = true;\n        /** @readwrite */\n        protected $\\$_defaultPath = \"application/views\"\
  ;\n        /** @readwrite */\n        protected $\\$_defaultLayout = \"layouts/standard\"\
  ;\n        /** @readwrite */\n        protected $\\$_defaultExtension = \"html\"\
  ;\n        /** @readwrite */\n        protected $\\$_defaultContentType = \"text/html\"\
  ;\n\n        protected function \\_getExceptionForImplementation($method)\n    \
  \    {\n            return new Exception\\\\Implementation(\"{$method} method not\
  \ implemented\");\n        }\n\n        protected function \\_getExceptionForArgument()\n\
  \        {\n            return new Exception\\\\Argument(\"Invalid argument\");\n\
  \        }\n    }\n}\n```\n\n我们增加了三个额外的 getter/setter 属性：`layoutView`、`actionView`\
  \ 以及 `willRenderLayoutView/willRenderActionView`。`layoutView` 属性是布局视图的占位符，`actionView`\
  \ 属性是 action 视图的占位符，而 `willRenderLayoutView/willRenderActionView` 属性是用于禁用自动视图渲染的标记。\n\
  \n布局解决了一个你可能不知道其存在的问题。在接口设计方面，一致的布局对于良好的用户体验至关重要。我确实说过我们会忽略（大部分）接口设计，但这是任何优秀应用程序的职性需求，因此我们现在添加它。\n\
  \n布局本质上是共享的视图。它们是框架，各个 action 的视图在这些框架内进行渲染。`View` 类仅完成所需工作的一半；我们需要将 action 的内容放置在布局的框架内。我们现在来看列表\
  \ 13-7 中负责视图的方法。\n\n### 列表 13-7. 渲染方法\n\n```php\npublic function render()\n{\n \
  \   $defaultContentType = $this- > getDefaultContentType();\n    $results = null;\n\
  \    $doAction = $this- > getWillRenderActionView() && $this- > getActionView();\n\
  \    $doLayout = $this- > getWillRenderLayoutView() && $this- > getLayoutView();\n\
  \    try\n    {\n        if ($doAction)\n        {\n            $view = $this- >\
  \ getActionView();\n            $results = $view- > render();\n        }\n     \
  \   if ($doLayout)\n        {\n            $view = $this- > getLayoutView();\n \
  \           $this- > set(\"template\", $results);\n            $results = $view-\
  \ > render();\n            header(\"Content-type: {$defaultContentType}\");\n  \
  \          echo $results;\n        }\n        else if ($doAction)\n        {\n \
  \           header(\"Content-type: {$defaultContentType}\");\n            echo $results;\n\
  \            $this- > setWillRenderLayoutView(false);\n            $this- > setWillRenderActionView(false);\n\
  \        }\n    }\n    catch (\\\\Exception $e)\n    {\n        throw new View\\\
  \\Renderer(\"Invalid layout/template\");\n    }\n}\n\npublic function __destruct()\n\
  {\n    $this- > render();\n}\n```\n\n`__destruct()` 方法负责调用 `render()` 方法。这意味着 `render()`\
  \ 方法将在 action 执行结束时调用。如果 `willRenderLayoutView` 和 `layoutView` 为 true，则将渲染布局。如果\
  \ `willRenderActionView` 和 `actionView` 为 true， action 视图也是如此。\n\n我们需要修改的最后一个 `Controller`\
  \ 方法是 `__construct()` 方法，如列表 13-8 所示。\n\n### 列表 13-8. __construct 方法\n\n```php\n\
  public function __construct($options = array())\n{\n    parent::\\construct($options);\n\
  \    if ($this- > getWillRenderLayoutView())\n    {\n        $defaultPath = $this-\
  \ > getDefaultPath();\n        $defaultLayout = $this- > getDefaultLayout();\n \
  \       $defaultExtension = $this- > getDefaultExtension();\n        $view = new\
  \ View(array(\n            \"file\" = > APP\\_PATH.\"/{$defaultPath}/{$defaultLayout}.{$defaultExtension}\"\
  \n        ));\n        $this- > setLayoutView($view);\n    }\n    if ($this- > getWillRenderActionView())\n\
  \    {\n        $router = Registry::get(\"router\");\n        $controller = $router-\
  \ > getController();\n        $action = $router- > getAction();\n        $view =\
  \ new View(array(\n            \"file\" = > APP\\_PATH.\"/{$defaultPath}/{$controller}/{$action}.{$defaultExtension}\"\
  \n        ));\n        $this- > setActionView($view);\n    }\n}\n```\n\n\n\n\n\n\
  这个新的 `__construct()` 方法做了两个重要的事情。首先，它定义了布局模板的位置，该位置被传递给新的 `View` 实例，然后再次被传递给 `setLayoutView()`\
  \ 设置方法。\n\n其次，它从 `router` 获取控制器/动作名称。它从 `registry` 获取 `router` 实例，并使用 getter 方法获取名称。然后，它根据控制器/动作名称构建一个指向它可以渲染的模板的路径。\n\
  \n例如，如果用户请求 URL `http://localhost/users/add.html`，新的 `__construct()` 方法将该位置定义为 `APP_PATH/application/views/users/add.html`。两者之间的关联仅仅由于我们的命名和组织结构的巧合。\n\
  \n为了解\n\n新的 `Controller` 类的完整结构，我将完整代码包含在列表 13-9 中。\n\n列表 13-9 修改后的 Controller 类\n\
  \n```php\nnamespace Framework\n\n{\n\nuse Framework\\Base as Base;\n\nuse Framework\\\
  View as View;\nuse Framework\\Event as Event;\n\nuse Framework\\Registry as Registry;\n\
  use Framework\\Template as Template;\nuse Framework\\Controller\\Exception as Exception;\n\
  \nclass Controller extends Base\n\n{\n\n/**\n * @readwrite\n */\nprotected $_parameters;\n\
  \n/**\n * @readwrite\n */\nprotected $_layoutView;\n\n/**\n * @readwrite\n */\n\
  protected $_actionView;\n\n/**\n * @readwrite\n */\nprotected $_willRenderLayoutView\
  \ = true;\n\n/**\n * @readwrite\n */\nprotected $_willRenderActionView = true;\n\
  \n/**\n * @readwrite\n */\nprotected $_defaultPath = \"application/views\";\n\n\
  /**\n * @readwrite\n */\nprotected $_defaultLayout = \"layouts/standard\";\n\n/**\n\
  \ * @readwrite\n */\nprotected $_defaultExtension = \"html\";\n\n/**\n * @readwrite\n\
  \ */\nprotected $_defaultContentType = \"text/html\";\n\nprotected function _getExceptionForImplementation($method)\n\
  {\nreturn new Exception\\Implementation(\"{$method} method not implemented\");\n\
  }\n\nprotected function _getExceptionForArgument()\n{\nreturn new Exception\\Argument(\"\
  Invalid argument\");\n}\n\npublic function __construct($options = array())\n{\n\
  parent::__construct($options);\n\nif ($this->getWillRenderLayoutView())\n{\n$defaultPath\
  \ = $this->getDefaultPath();\n$defaultLayout = $this->getDefaultLayout();\n$defaultExtension\
  \ = $this->getDefaultExtension();\n$view = new View(array(\n\"file\" => APP_PATH.\"\
  /{$defaultPath}/{$defaultLayout}.{$defaultExtension}\"\n));\n$this->setLayoutView($view);\n\
  }\n\nif ($this->getWillRenderLayoutView())\n{\n$router = Registry::get(\"router\"\
  );\n$controller = $router->getController();\n$action = $router->getAction();\n$view\
  \ = new View(array(\n\"file\" => APP_PATH.\"\n/{$defaultPath}/{$controller}/{$action}.{$defaultExtension}\"\
  \n));\n$this->setActionView($view);\n}\n}\n\npublic function render()\n{\n$defaultContentType\
  \ = $this->getDefaultContentType();\n$results = null;\n$doAction = $this->getWillRenderActionView()\
  \ && $this->getActionView(); \n$doLayout = $this->getWillRenderLayoutView() && $this->getLayoutView();\
  \ \ntry\n{\nif ($doAction)\n{\n$view = $this->getActionView();\n$results = $view->render();\n\
  }\nif ($doLayout)\n{\n$view = $this->getLayoutView();\n$view->set(\"template\",\
  \ $results);\n$results = $view->render();\nheader(\"Content-type: {$defaultContentType}\"\
  );\necho $results;\n}\nelse if ($doAction)\n{\nheader(\"Content-type: {$defaultContentType}\"\
  );\necho $results;\n}\n$this->setWillRenderLayoutView(false);\n$this->setWillRenderActionView(false);\n\
  }\ncatch (\\Exception $e)\n{\nthrow new View\\Exception\\Renderer(\"Invalid layout/template\
  \ syntax\");\n}\n}\n\npublic function __destruct()\n{\n$this->render();\n}\n}\n\
  }\n```\n\n## 问题\n\n1. 我们使用 URL 重写将应用程序请求重定向到单个 `index.php` 文件。为什么需要这样做呢？\n2. 我们的引导文件通过全命名空间引用了许多类（例如，`Framework\\\
  Configuration`），而不是使用 `use` 语句。它还取消了我们定义的变量。为什么这些步骤是必要的？\n3. 我们为 `Database` 和 `Cache`\
  \ 类添加了自动配置。这对于专门通过配置文件来配置这些类非常有用。这种配置方法有什么好处？\n4. 我们的 `Controller` 类经过了修改，以便在找到匹配的视图时尝试自动渲染。它还会尝试将结果封装在布局文件中。你能想到这种行为的实际用处吗？\n\
  \n### 答案\n\n1. URL 重写并不是严格要求的。所有的应用程序请求都通过同一个文件处理，但并没有阻止你直接访问 `index.php` 文件。区别体现在\
  \ URL `http://localhost/users/view.html` 和 `http://localhost/index.php?url=users/view&extension=html`\
  \ 。使用 URL 重写的处是 URL 会变得更简单整洁。\n2. 命名空间的好处之一是我们的框架类不再处于全局命名空间。与其 20 多个类（`Database`、`Cache`、`Configuration`\
  \ 等），我们只需要向全局 `Framework` 命名空间添加一个。这避免了许多命名冲突的陷阱。当我们使用 `use` 语句时，我们就抵消了这个优势，向全局命名空间添加了更多内容。如果是在命名空间块内执行（例如\
  \ `namespace ACME { use ACME\\Glue as Glue; }`），则不是问题，但如果 `use` 语句在全局命名空间中，影响较小。我们取消变量是因为不希望它们污染全局命名空间。\n\
  3. 在我们的框架类中添加自动配置允许其他开发者在不更改代码的情况下自定义这些类的行为。\n4. 布局为我们的视图提供了一个一致的框架，而无需重复任何标记。一个很好的例子是使用布局进行导航。\n\
  \n### 练习\n\n1. 我们使用自动配置来初始化框架的某些类。现在尝试配置 `View` 类以允许不同的视图渲染引擎。\n2. 我们的引导文件会尝试执行最合适的控制器/动作，但它没有处理异常的方法以便显示相应的错误页面。现在尝试处理异常，以便使用自定义错误页面。\n\
  \n# 第 14 章：注册与登录\n\n社交网络围绕带有个人资料的用户概念构建。个人资料是用户与其他用户分享的地方，为了让用户拥有个人资料，他们需要拥有账户。在本章中，我们将创建用户创建账户和登录账户所需的页面和类。\n\
  \n## 目标\n\n- 用户需要注册新账户。这涉及他们需要完成的表单。在完成后，将在数据库中创建一条新记录，并且他们应该能够登录。\n- 自然，这意味着用户需要能够登录他们的账户。这需要另一个表单来保护他们的个人资料，通过验证有效的用户凭据来允许访问。为了简单起见，我们要求用户在登录时提供电子邮件地址和密码。\n\
  \n\n\n\n\n取决于我们想要构建的应用程序类型，我们可能需要在多个控制器（controller）和模型（model）之间共享逻辑。我指的不是我们已经添加到\
  \ `Controller` 类中用于视图渲染的内容。我在这里指的是诸如连接数据库或共享通用模型字段等操作。\n\n这些示例正是我们在本章需要实现的细节，因此我们将将从添加它们开始！我们想要共享通用功能的第一个类是\
  \ `Controller` 类。如果共享代码的需求与特定应用程序无关，我们可能会考虑将它们作为 `Controller` 类的扩展来添加。\n\n这是我们为视图渲染选择的方法，假设大多数操作将以相同的方式进行渲染。\n\
  \n遗憾的是，打开数据库的持久连接似乎并不是我们可以为所有使用我们框架的应用程序所做出的决策。某些应用程序可能不需要持续连接，而某些应用程序可能甚至不需要数据库来满足其\
  \ ORM/模型需求。\n\n因此，我们将对 `Controller` 类进行子类化，以添加所需的数据库功能。这听起来比实际上要复杂。请考虑列表 14-1 所示的代码。\n\
  \n### 列表 14-1. application/libraries/shared/controller.php\n\n```php\nnamespace\
  \ Shared\n\n{\n\nclass Controller extends \\Framework\\Controller\n{\n    public\
  \ function __construct($options = array())\n    {\n        parent::__construct($options);\n\
  \        $database = \\Framework\\Registry::get(\"database\");\n        $database->connect();\n\
  \    }\n}\n\n}\n```\n\n如列表 14-1 所示，在应用程序中对 `Controller` 类进行子类化相当的。`libraries` 目录已作为可能的包含目录添加（在\
  \ `Core::initialize()` 方法中），因此它会被很容易地加载，我们甚至可以保持共享的 `Controller` 子类具有命名空间。\n\n我们重写了\
  \ `__construct()` 方法（确保调用适当的父类方法），从注册表中获取数据库实例，然后使用它连接到数据库服务器。从乍上看，通过在一个通用的共享的 `Controller`\
  \ 子类内部与数据库通信，似乎我们混淆了关注点（concerns）。然而，这样做是有意义的。毕竟，这个共享的 `Controller` 子类和（引导的）`index.php`\
  \ 文件都是同一个应用程序库的一部分。它们都关注应用程序，而共享这段数据库连接代码比将其添加到每个感知数据库的动作中要好得多。\n\n**注意**：如果我们的应用程序控制器要利用这个共享的\
  \ `Controller` 子类，它们应该扩展它。请确保将每个应用程序控制器中的 `Controller` 引用从 `Framework\\Controller`\
  \ 更改为 `Shared\\Controller`。\n\n创建此子类后，我们可以放心地假设在我们在动作中执行任何数据库工作之前，注册表中的 `Database`\
  \ 实例已经连接。\n\n### 用户模型 (User Model)\n\n由于我们将处理用户账户（数据库行），现在是定义哪些字段构成有效用户账户的好时机。我建议使用列表\
  \ 14-2 所示的结构作为我们的 `User` 模型。\n\n### 列表 14-2. application/models/user.php\n\n```php\n\
  class User extends \\Framework\\Model\n{\n    /**\n     * @column\n     * @readwrite\n\
  \     * @primary\n     * @type autonumber\n     */\n    protected $_id;\n\n    /**\n\
  \     * @column\n     * @readwrite\n     * @type text\n     * @length 100\n    \
  \ */\n    protected $_first;\n\n    /**\n     * @column\n     * @readwrite\n   \
  \  * @type text\n     * @length 100\n     */\n    protected $_last;\n\n    /**\n\
  \     * @column\n     * @readwrite\n     * @type text\n     * @length 100\n    \
  \ * @index\n     */\n    protected $_email;\n\n    /**\n     * @column\n     * @readwrite\n\
  \     * @type text\n     * @length 100\n     * @index\n     */\n    protected $_password;\n\
  \n    /**\n     * @column\n     * @readwrite\n     * @type boolean\n     * @index\n\
  \     */\n    protected $_live;\n\n    /**\n     * @column\n     * @readwrite\n\
  \     * @type boolean\n     * @index\n     */\n    protected $_deleted;\n\n    /**\n\
  \     * @column\n     * @readwrite\n     * @type datetime\n     */\n    protected\
  \ $_created;\n\n    /**\n     * @column\n     * @readwrite\n     * @type datetime\n\
  \     */\n    protected $_modified;\n}\n```\n\n前几个字段（从名字到密码）是简单的文本字段。紧随其后的字段是我喜欢遵循的约定。它们包含了关于数据库表中的行的少量元数据（例如，它们何时被创建和更改，它们是否应该显示在公共列表中等）。`User`\
  \ 模型期望用户数据库表具有列表 14-3 所示的结构。\n\n### 列表 14-3. user 表的表结构\n\n```sql\nCREATE TABLE\
  \ `user` (\n    `first` varchar(100) DEFAULT NULL,\n    `last` varchar(100) DEFAULT\
  \ NULL,\n    `email` varchar(100) DEFAULT NULL,\n    `password` varchar(100) DEFAULT\
  \ NULL,\n    `id` int(11) NOT NULL AUTO_INCREMENT,\n    `live` tinyint(4) DEFAULT\
  \ NULL,\n    `deleted` tinyint(4) DEFAULT NULL,\n    `created` datetime DEFAULT\
  \ NULL,\n    `modified` datetime DEFAULT NULL,\n    PRIMARY KEY (`id`),\n    KEY\
  \ `email` (`email`),\n    KEY `password` (`password`),\n    KEY `live` (`live`),\n\
  \    KEY `deleted` (`deleted`)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8;\n```\n\n这些字段并不是我们框架整体的要求，也不是社交网络的特殊要求。它们只是我喜欢添加的一组字段。话虽如此，我倾向于将它们添加到每个数据库表（在这种情况下是每个模型）中。但是，如果我们必须为每个模型重复这些字段，那就太遗憾了。不要担心，我们可以像列表\
  \ 14-4 所示那样创建一个共享模型。\n\n### 列表 114-4. application/libraries/shared/model.php\n\n\
  ```php\nnamespace Shared\n\n{\n\nclass Model extends \\Framework\\Model\n{\n   \
  \ /**\n     * @column\n     * @readwrite\n     * @primary\n     * @type autonumber\n\
  \     */\n    protected $_id;\n\n    /**\n     * @column\n     * @readwrite\n  \
  \   * @type boolean\n     * @index\n     */\n    protected $_live;\n\n    /**\n\
  \     * @column\n     * @readwrite\n     * @type boolean\n     * @index\n     */\n\
  \    protected $_deleted;\n\n    /**\n     * @column\n     * @readwrite\n     *\
  \ @type datetime\n     */\n    protected $_created;\n\n    /**\n     * @column\n\
  \     * @readwrite\n     * @type datetime\n     */\n    protected $_modified;\n\
  }\n\n}\n```\n\n你可以看出，这些字段被放置在共享的 `Model` 子类中。该子类的作用方式与共享的 `Controller` 子类相似，我们的模型扩展了共享的\
  \ `Model` 类，而共享的 `Model` 类扩展了框架的 `Model` 类。共享类允许我们在不需要在每个控制器或模型中重复的情况下引入额外功能。\n\n\
  **注意**：记得将模型引用为 `Shared\\Model` 而不是 `Framework\\Model`。\n\n## 注册\n\n在创建用户账户之前，我们需要采取另一个步骤是创建新用户注册所需的表单。列表\
  \ 14-5 显示了我们通过创建一个模板文件来实现，它只是普通的 HTML。\n\n### 列表 14-5. application/views/users/register.html\n\
  \n```html\n<h1>注册</h1>\n{if isset($success)}\n您的账户已创建！\n{/if}\n{else}\n<form method=\"\
  post\">\n<ol>\n<li>\n    <label>\n    名字:\n    <input type=\"text\" name=\"first\"\
  \ />\n    {if isset($first_error)}\n    {echo $first_error}\n    {/if}\n    </label>\n\
  </li>\n<li>\n    <label>\n    姓氏:\n    <input type=\"text\" name=\"last\" />\n \
  \   {if isset($last_error)}\n    {echo $last_error}\n    {/if}\n    </label>\n</li>\n\
  <li>\n    <label>\n    邮箱:\n    <input type=\"text\" name=\"email\" />\n    {if\
  \ isset($email_error)}\n    {echo $email_error}\n    {/if}\n    </label>\n</li>\n\
  <li>\n    <label>\n    密码:\n    <input type=\"password\" name=\"password\" />\n\
  ```\n\n\n\n\n\n```html\n{if isset($password_error)}\n    {echo $password_error}\n\
  {/if}\n</label>\n</li>\n<li\n    <input type=\"submit\" name=\"register\" value=\"\
  register\" />\n</li>\n</ol>\n</form>\n{/else}\n```\n\n224\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n## 第 14 章 注册与登录\n\n此模板是一个简单的表单，包含四个字段和一个按钮。如果设置了 `success` 属性（在视图中），将显示成功消息，否则将显示注册表单。每个字段由一个标签（label）、一个输入框（input）和一个错误消息组成。我们将在控制器中设置这些错误消息，但我们希望它们在视图中渲染，以防有任何错误需要显示。你可能会注意到我们正在使用我们的模板解析器支持的一些模板标签。\n\
  \n现在我们已经有了一个用于获取用户账户数据的 HTML 表单，我们需要一个动作（action）来处理这些数据。理想的地方是 `Users` 控制器中的 `register()`\
  \ 动作。在访问提交的表单数据之前，我们需要创建一个包含我们将要用方法的工具类。列表 14-6 展示了我们如何实现这一目标。\n\n### 列表 14-6. RequestMethods\
  \ 类\n\n```php\nnamespace Framework\n\n{\n\nclass RequestMethods\n{\n    private\
  \ function __construct()\n    {\n        // 什么都不做\n    }\n    private function __clone()\n\
  \    {\n        // 什么都不做\n    }\n    public static function get($key, $default =\
  \ \"\")\n    {\n        if (!empty($_GET[$key]))\n        {\n            return\
  \ $_GET[$key];\n        }\n        return $default;\n    }\n\n    public static\
  \ function post($key, $default = \"\")\n    {\n        if (!empty($_POST[$key]))\n\
  \        {\n            return $_POST[$key];\n        }\n        return $default;\n\
  \    }\n\n    public static function server($key, $default = \"\")\n    {\n    \
  \    if (!empty($_SERVER[$key]))\n        {\n            return $_SERVER[$key];\n\
  \        }\n        return $default;\n    }\n}\n}\n```\n\n225\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 14 章 注册与登录\n\n这个 `RequestMethods` 类非常简单。它拥有根据键返回 get/post/server 变量的方法。如果该键不存在，将返回默认值。我们使用这些方法将提交的表单数据返回给控制器。让我们看看列表\
  \ 14-7 所示的 `Users->register()` 方法。\n\n### 列表 14-7. Users-> register() 方法\n\n```php\n\
  use Shared\\Controller as Controller;\nuse Framework\\Registry as Registry;\nuse\
  \ Framework\\RequestMethods as RequestMethods;\n\nclass Users extends Controller\n\
  {\n    public function register()\n    {\n        if (RequestMethods::post(\"register\"\
  ))\n        {\n            $first = RequestMethods::post(\"first\");\n         \
  \   $last = RequestMethods::post(\"last\");\n            $email = RequestMethods::post(\"\
  email\");\n            $password = RequestMethods::post(\"password\");\n       \
  \     $view = $this->getActionView();\n            $error = false;\n\n         \
  \   if (empty($first))\n            {\n                $view->set(\"first_error\"\
  , \"First name not provided\");\n                $error = true;\n            }\n\
  \            if (empty($last))\n            {\n                $view->set(\"last_error\"\
  , \"Last name not provided\");\n                $error = true;\n            }\n\n\
  \            if (empty($email))\n            {\n                $view->set(\"email_error\"\
  , \"Email not provided\");\n                $error = true;\n            }\n\n  \
  \          if (empty($password))\n            {\n                $view->set(\"password_error\"\
  , \"Password not provided\");\n                $error = true;\n            }\n\n\
  \            if (!$error)\n            {\n                $user = new User(array(\n\
  \                    \"first\" => $first,\n                    \"last\" => $last,\n\
  \                    \"email\" => $email,\n                    \"password\" => $password\n\
  \                ));\n                $user->save();\n                $view->set(\"\
  success\", true);\n            }\n        }\n    }\n}\n```\n\n`register()` 方法完成了三件重要工作。第一是获取提交的表单数据，它使用了\
  \ `RequestMethods::post()` 方法。第二是检查每个表单字段的值，并为缺失的值创建错误消息。第三是只要表单数据中没有发现错误，它就会数据库中创建一个新的用户行。\n\
  \n**注意**：这是最基础的验证。我们所做的只是确保用户为每个字段输入了某些值。稍后，我们将看到如何扩展我们的 ORM 以允许更准确的数据验证。\n\n现在，完成表单并点击注册按钮应该会向用户数据库表插入一行数据。\n\
  \n如果你看到了这一行数据，请为自己拍拍掌。你可能还会注意到，如果四个字段中具有空值（null）的话。\n\n这在数据库结构方面可能是被允许的，但我们真正希望在创建行时填充这些值，然后从那时起选择性地进行更新。为了实现这种自动数据填充，我们需要重写\
  \ `Shared\\Model->save()` 方法，如列表 14-8 所示。\n\n### 列表 14-8. 重写 save 方法\n\n```php\n\
  public function save()\n{\n    if (empty($this->data['first'])) {\n        $this->data['first']\
  \ = \"\"; \n    }\n    if (empty($this->data['last'])) {\n        $this->data['last']\
  \ = \"\";\n    }\n    if (empty($this->data['email'])) {\n        $this->data['email']\
  \ = \"\";\n    }\n    if (empty($this->data['password'])) {\n        $this->data['password']\
  \ = \"\";\n    }\n    parent::save();\n}\n```\n\n227\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 14 章 注册与登录\n\n会（Sessions）是临时存储区域，与浏览器关联，并且可以在浏览器重启后持续。由于这个原因，会是跟踪用户是否登录的完美方式。我们现在创建的\
  \ Session 类与我们在第 5 章创建的 Cache 类非常。你可能已经对相关概念很熟悉，我将简要介绍。我们从列表 14-9 所示的 Session 工厂开始。\n\
  \n### 列表 14-9. Session 类\n\n```php\nnamespace Framework\n\n{\nuse Framework\\Base\
  \ as Base;\nuse Framework\\Registry as Registry;\nuse Framework\\Session as Session;\n\
  use Framework\\Exception as Exception;\n\nclass Session extends Base\n{\n    /**\n\
  \     * @var string\n     */\n    protected $_type;\n\n    /**\n     * @var array\n\
  \     */\n    protected $_options;\n\n    protected function _getExceptionForImplementation($method)\n\
  \    {\n        return new Exception(\"{$method} method not implemented\");\n  \
  \  }\n\n    protected function _getExceptionForArgument()\n    {\n        return\
  \ new Exception(\"Invalid argument\");\n    }\n\n    public function initialize()\n\
  \    {\n        $type = $this->getType();\n        if (empty($type))\n        {\n\
  \            $configuration = Registry::get(\"configuration\");\n            if\
  \ ($configuration)\n            {\n                $configuration = $configuration->initialize();\n\
  \                $parsed = $configuration->parse(\"configuration/session\");\n \
  \               if (!empty($parsed[\"session\"][\"default\"]) && !empty($parsed[\"\
  session\"][\"default\"][\"type\"]))\n                {\n                    $type\
  \ = $parsed[\"session\"][\"default\"][\"type\"];\n                    unset($parsed[\"\
  session\"][\"default\"][\"type\"]);\n                    $this->__construct(array(\n\
  \                        \"type\" => $type,\n                        \"options\"\
  \ => (array) $parsed[\"session\"][\"default\"]\n                    ));\n      \
  \          }\n            }\n        }\n\n        if (empty($type))\n        {\n\
  \            throw new Exception(\"Invalid type\");\n        }\n\n        switch\
  \ ($type)\n        {\n            case \"server\":\n                {\n        \
  \            return new Session\\Driver\\Server($this->getOptions());\n        \
  \            break;\n                }\n            default:\n                {\n\
  \                    throw new Exception(\"Invalid type\");\n                  \
  \  break;\n                }\n        }\n    }\n}\n}\n```\n\n\n\n\n如列表 14-10 所示，服务器驱动程序相当简单。\n\
  \n***列表 14-10.*** `Session\\Driver\\Server` 类\n\n```php\nnamespace Framework\\Session\\\
  Driver\n\n{\n    use Framework\\Session as Session;\n\n    class Server extends\
  \ Session\\Driver\n    {\n        /**\n         * @readwrite\n         */\n    \
  \    protected $_prefix = \"app_\";\n\n        public function __construct($options\
  \ = array())\n        {\n            parent::__construct($options);\n          \
  \  session_start();\n        }\n\n        public function get($key, $default = null)\n\
  \        {\n            $prefix = $this->getPrefix();\n            if (isset($_SESSION[$prefix.$key]))\n\
  \            {\n                return $_SESSION[$prefix.$key];\n            }\n\
  \            return $default;\n        }\n\n        public function set($key, $value)\n\
  \        {\n            $prefix = $this->getPrefix();\n            $_SESSION[$prefix.$key]\
  \ = $value;\n            return $this;\n        }\n\n        public function erase($key)\n\
  \        {\n            $prefix = $this->getPrefix();\n            unset($_SESSION[$prefix.$key]);\n\
  \            return $this;\n        }\n\n        public function __destruct()\n\
