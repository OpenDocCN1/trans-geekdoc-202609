  \ || !$stringLength1->isValid($first)) {\n            $valid = false;\n        \
  \    $errors[\"first\"] = \"First field required\";\n        }\n\n        if (empty($last)\
  \ || !$alnum->isValid($last) || !$stringLength1->isValid($last)) {\n           \
  \ $valid = false;\n            $errors[\"last\"] = \"Last field required\";\n  \
  \      }\n\n        if (empty($email) || !$stringLength2->isValid($email)) {\n \
  \           $valid = false;\n            $errors[\"email\"] = \"Email field required\"\
  ;\n        }\n\n        if (empty($password) || !$stringLength2->isValid($password))\
  \ {\n            $valid = false;\n            $errors[\"password\"] = \"Password\
  \ field required\";\n        }\n\n        // 如果表单数据通过验证...\n        if ($valid)\
  \ {\n            // 创建新用户并保存\n            $user = new Application_Model_User(array(\n\
  \                \"first\" => $first,\n                \"last\" => $last,\n    \
  \            \"email\" => $email,\n                \"password\" => $password\n \
  \           ));\n            $id = $user->save();\n            $this->upload(\"\
  photo\", $id);\n            // 在视图中指示成功\n            $success = true;\n        }\n\
  \    }\n    // 加载视图\n    $this->view->errors = $errors;\n    $this->view->success\
  \ = $success;\n}\n```\n\n与我们目前为止处理文件上传的方式，`register` action 并没有执行上传逻辑。该逻辑发生在 `protected\
  \ _upload()` 方法中，该方法利用了 Zend Framework 的 `Zend_File_Transfer_Adapter_Http` 类。该类主要处理文件验证和上传，但对于我们的目的，我们只需要一小部分代码。\n\
  \n文件上传后，我们在数据库表中创建了一行，并将其链接到上传文件的用户。在修改个人资料页面以显示照片之前，我们需要查看如何使用外部库。\n\n注意：你可以在 `http://framework.zend.com/manual/en/file.transfer.html`\
  \ 学习更多关于 Zend Framework 传输类的知识。\n\n## 第三方库\n\n在 Zend Framework 应用程序中使用第三方库与使用内置库没有区别。我们只需要添加另一个自动加载器实例（除了\
  \ Zend Framework 默认配置的那个之外），这样我们就可以在不使用 `include` 语句的情况下加载类。你可以在列表 28-6 所示的修改后的\
  \ `Bootstrap.php` 文件看到这一点。\n\n### 修改后的 Bootstrap.php 文件\n```php\nclass Bootstrap\
  \ extends Zend_Application_Bootstrap {\n    protected function _initAutoloader()\
  \ {\n        $autoloader = Zend_Loader_Autoloader::getInstance();\n        $autoloader->registerNamespace(\"\
  Imagine\");\n    }\n}\n```\n\n我们需要为自动加载器添加 `Imagine` 的命名空间，这样当我们的应用程序实例化类时，它就能识别来自\
  \ `library/Imagine` 目录的带有 `Imagine` 前缀的类。现在可以使用 `Imagine` 类来修改上传的文件，我们将在一个新的保护方法中执行，并通过修改控制器中的\
  \ `profileAction()` 方法，如列表 28-7 所示。\n\n### 在 profileAction 方法中使用 Imagine\n```php\n\
  class UsersController extends Zend_Controller_Action {\n    protected function _thumbnail($file)\
  \ {\n        $path = dirname(APPLICATION_PATH).\"/public/uploads\";\n        $width\
  \ = 64;\n        $height = 64;\n        $name = $file->name;\n        $filename\
  \ = pathinfo($name, PATHINFO_FILENAME);\n        $extension = pathinfo($name, PATHINFO_EXTENSION);\n\
  \        if ($filename && $extension) {\n            $thumbnail = \"{$filename}-{$width}x{$height}.{$extension}\"\
  ;\n            if (!file_exists(\"{$path}/{$thumbnail}\")) {\n                $imagine\
  \ = new Imagine\\Gd();\n                $size = new Imagine\\Box($width, $height);\n\
  \                $mode = Imagine\\ImageInterface::THUMBNAIL_OUTBOUND;\n        \
  \        $imagine->open(\"{$path}/{$name}\")\n                        ->thumbnail($size,\
  \ $mode)\n                        ->save(\"{$path}/{$thumbnail}\");\n          \
  \  }\n            return $thumbnail;\n        }\n    }\n\n    public function profileAction()\
  \ {\n        // 检查用户\n        $this->isSecure();\n        // 加载缩略图\n        $file\
  \ = Application_Model_File::first(array(\n            \"user =\" => $this->user->id\n\
  \        ));\n        $filename = $this->_thumbnail($file);\n        // 加载视图\n \
  \       $this->view->user = $this->user;\n        $this->view->filename = $filename;\n\
  \    }\n}\n```\n\n正如我们之前处理文件上传的方式，`register` action 并没有执行上传逻辑。该逻辑发生在 `protected\
  \ _upload()` 方法中，如所示。\n\n注意：不要忘记保护你的上传目录！`_thumbnail()` 方法与我们在 CodeIgniter 应用程序中创建的\
  \ façade 类类似，并且由 action 内部调用。如果缩略图不存在，它将生成一个并返回给 `profileAction()` 方法，然后将其赋值给视图。我们也需要修改列表\
  \ 28-8 所示的 `profilehtml` 视图。\n\n### profilehtml 视图\n```php\n<?php if ($this->filename):\
  \ ?>\n    <img src=\"/uploads/<?php $this->filename; ?>\" />\n<?php endif; ?>\n\
  <h1><?php echo $this->user->first; ?> <?php echo $this->user->last; ?></h1>\n这是一个个人资料！\n\
  ```\n\n我们现在知道如何利用 Zend Framework 内置库，以及支持命名空间自动加载的第三方库。\n\n## 问题\n\n1. Zend Framework\
  \ 的命名空间与 PHP 5.3 提供的命名空间之间有什么区别？\n2. 我们在开始使用 Zend Framework 时使用了命令行创建项目，但我们的大部分工作都没有使用\
  \ CLI。这可能是什么？\n\n### 答案\n\n1. Zend Framework (1.11) 使用下划线作为命名空间分隔符，而 PHP 5.3 命名空间使用反斜杠。Zend\
  \ Framework 的类技术上没有命名空间，因为它们都在全局命名空间中。不过不太发生冲突，因为 Zend Framework 的类名通常很长。\n2. 虽然\
  \ CLI 提供了许多有用功能，但学习框架必须通过手动编码完成。我们可以使用 CLI，但那样对框架的理解就会少得多。\n\n### 练习\n\n1. 在 `profileAction()`\
  \ 方法之外没有生成缩略图的方法。尝试创建一个允许此功能的公共 action。\n2. 查看 Zend Framework 附带的许多类库。\n\n# 第 29\
  \ 章\n# Zend Framework: 测试\n\n我们将通过学习如何在应用程序中使用 `PHPUnit` 单元测试来结束对 Zend Framework\
  \ 的学习。\n\n## 目标\n\n• 我们需要学习安装 PEAR 和 PHPUnit。\n• 我们需要学习为我们的控制器创建并运行测试。\n\n\n\n\n\
  \nPEAR 是可复 PHP 库的官方发行平台。你可以将其想象成 Homebrew，只不过它分发的不是适用于 OS X 的包，而是分发专为 PHP 使用定制的库。\n\
  \n仅需几步即可安装 PEAR，我们将在下文中详细介绍。\n\n## Windows\n\n- 在下载并安装 PHP 后，你必须手动执行位于路径的批文件，例如\
  \ `c:\\php\\go-pear.bat`。设置程序会向你询问一些问题，之后 PEAR 包管理器将被安装在你在安装期间指定的指定的路径中。\n- 接下来，你必须将安装路径添加到你的\
  \ `PATH` 环境变量。你可以手动执行此操作（开始 > 控制面板 > 系统 > 环境变量），或运行（双击）现在位于 PHP 源码目录下的新生成的 `PEAR_ENV.reg`\
  \ 文件。\n- 之后，你可以通过在 Windows 命令行提示中运行 `pear` 命令来访问 PEAR 包管理器。\n- 若要更新你的 PEAR 安装，请在浏览器中请求\
  \ [`pear.php.net/go-pear.phar`](http://pear.php.net/go-pear.phar) 并将输出保存到本地文件 `go-pear.phar`\
  \ 中。然后你可以运行以下行：\n\n```\nphp go-pear.phar\n```\n\n## Unix/Linux/BSD\n\n当使用 PHP 时，PEAR\
  \ 包管理器已经安装，除非用户使用了 `./configure` 选项 `--without-pear`。\n\n如果使用的是由 Unix/Linux/BSD\
  \ 发行版提供的 PHP 版本，可能需要手动安装 PEAR。在这种情况下，用户应查阅相应发行版的文档。如果你想重新安装 PEAR，可以使用以下方法：\n\n-\
  \ `wget [`pear.php.net/go-pear.phar`](http://pear.php.net/go-pear.phar)`\n- `php\
  \ go-pear.phar`\n\n## Mac OS X\n\n在 Mac OS 10.4 及更早版本上，PEAR 包管理器已安装在 `/usr/bin/pear`。\n\
  \n如果你正在使用 Mac OS 10.5 (Leopard) 并想要安装新副本或重新安装 PEAR 包管理器，请使用以下命令：\n\n- `wget [`pear.php.net/go-pear.phar`](http://pear.php.net/go-pear.phar)`\n\
  - `php -d detect_unicode=0 go-pear.phar`\n\n## 安装 PHPUnit\n\n安装 PHPUnit 变得更加简单了，因为只需要以下两个命令：\n\
  \n- `pear config-set auto_discover 1`\n- `pear install pear.phpunit.de/PHPUnit`\n\
  \n## 运行测试\n\n当我们最初设置 Zend Framework 项目时，系统提示 PHP 包含路径中未找到 PHPUnit。现在我们已经安装了 PHPUnit（通过\
  \ PEAR），我们不再应该遇到这个问题。\n\n导航到 Zend Framework CLI 为我们生成的测试目录并运行以下命令：\n\n```\nphpunit\n\
  ```\n\n■ **注意** 如果你的 Zend Framework 库文件位于 libraries 目录，请务必遵循 `phpunit.xml` 中的指令。\n\
  \n## 添加测试\n\n添加测试是一个非常直接的过程。我们将在 `tests/controllers/IndexControllerTest.php` 文件中添加四个测试，如列表\
  \ 29-1 所示。\n\n***列表 29-1. 添加单元测试***\n\n```php\nclass IndexControllerTest extends\
  \ Zend_Test_PHPUnit_ControllerTestCase\n{\n    protected $_email = \"testing_user\"\
  ;\n    protected $_password = \"testing_password\";\n\n    public function setUp()\n\
  \    {\n        $this->bootstrap = new Zend_Application(APPLICATION_ENV, APPLICATION_PATH\
  \ . \"/configs/application.ini\");\n        parent::setUp();\n    }\n\n    public\
  \ function testRegisterHasFields()\n    {\n        $this->dispatch(\"/users/register\"\
  );\n        $this->assertQuery(\"input[name='first']\", \"first name field not found\"\
  );\n        $this->assertQuery(\"input[name='last']\", \"last name field not found\"\
  );\n        $this->assertQuery(\"input[name='email']\", \"email field not found\"\
  );\n        $this->assertQuery(\"input[name='password']\", \"password field not\
  \ found\");\n        $this->assertQuery(\"input[name='photo']\", \"photo field not\
  \ found\");\n        $this->assertQuery(\"input[name='save']\", \"register button\
  \ not found\");\n    }\n\n    public function testRegisterWorks()\n    {\n     \
  \   $this->request->setMethod(\"POST\")\n            ->setPost(array(\n        \
  \        \"first\" => \"testing\",\n                \"last\" => \"testing\",\n \
  \               \"email\" => $this->_email,\n                \"password\" => $this->_password,\n\
  \                \"save\" => \"register\"\n            ));\n        $this->dispatch(\"\
  /users/register\");\n        $this->assertQueryContent(\"p\", \"account has been\
  \ created\");\n    }\n\n    public function testLoginHasFields()\n    {\n      \
  \  $this->dispatch(\"/users/login\");\n        $this->assertQuery(\"input[name='email']\"\
  , \"email field not found\");\n        $this->assertQuery(\"input[name='password']\"\
  , \"password field not found\");\n        $this->assertQuery(\"input[name='login']\"\
  , \"login button not found\");\n    }\n\n    public function testLoginWorks()\n\
  \    {\n        $this->request\n            ->setMethod(\"POST\")\n            ->setPost(array(\n\
  \                \"email\" => $this->_email,\n                \"password\" => $this->_password,\n\
  \                \"login\" => \"login\"\n            ));\n        $this->dispatch(\"\
  /users/login\");\n        $this->assertRedirect($message = \"not redirected\");\n\
  \    }\n}\n```\n\n`setUp()` 方法仅为每个运行的单元测试启动测试过程。这是自动生成的，不需要修改。第一个和第三个测试断言 `register.phtml`\
  \ 和 `login.phtml` 视图包含了登录和注册所需字段。\n\n第二个和第四个测试实际上向 Zend Framework 应用程序提交数据并检查响应是否符合格式。你可能需要按照列表\
  \ 29-2 所示的方式对你的应用程序进行重定向。\n\n***列表 29-2. Zend Framework 的重定向方式***\n\n```php\n//\
  \ 重定向到个人资料\n$this->_helper->redirector->gotoRoute(array(\n    \"controller\" =>\
  \ \"users\",\n    \"action\" => \"profile\"\n));\n```\n\n■ **注意** 如果你想下载或了解更多关于\
  \ phpUnit 的信息，可以 [`github.com/sebastianmann/phpunit`](https://github.com/sebastianmann/phpunit)。\n\
  \n\n\n\n`CakePHP` 的文档非常详尽，涵盖了从简单的 API 文档到常用编程任务指南的所有内容。此外，还有许多流行的视频教程、书籍资源和活动，旨在教育新手和丰富的\
  \ `CakePHP` 开发者。\n\n**注意**：你可以在 [`api20.cakephp.org/`](http://api20.cakephp.org/)\
  \ 找到 CakePHP 文档。\n\n# 为什么不使用 CakePHP？\n\n`CakePHP` 并不是为胆小无的人准备的。实际上，后台有大量的机制在运行，当你需要对\
  \ `CakePHP` 应用进行简单的配置或行为更改时，很容易迷失方向。\n\n对“约定”（convention）的深度关注也意味着 `CakePHP` 对目录结构、文件名和实际代码做了许多假设。这与其他框架（包括我们的框架）并无二，但当我们做的\
  \ 419 个假设数量只有几十个时，`CakePHP` 实际上是构建在这些假设之上的。它假设了你何时加载模型；它假设了你何时加载辅助器（helpers）。\n\n\
  在使用 `CakePHP` 编写应用程序代码库时，似乎几乎没有什么可以做的，但那是因为 `CakePHP` 已经做了这些假设并完成了一切。\n\n## 环境搭建\n\
  \n让 `CakePHP` 运行起来非常简单。下载的压缩包已以即插即用的项目结构组织好，你只需要将其中的 `public` 文件夹设置为 Web 可访问即可开始查看你的应用程序。要运行\
  \ `CakePHP`，请下载最新的 `CakePHP` 稳定版（例如 [`github.com/`](https://github.com/cakephp/cakephp/zipball/2.1.3)）并在合适的地方解压。\n\
  \n你需要配置你的 Web 服务器指向 `webroot/` 目录，以便生成的启动代码执行。\n\n## 路由\n\n`CakePHP` 的路由只能通过函数调用来定义，这与我们目前为止过的过的其他框架都不同。从理论上讲，这些函数调用可以在请求分发之前的任何文件中，但通常位于\
  \ `app/Config/routes.php` 文件中。在添加路由时，该配置文件应该类似于列表 30-1 所示。\n\n### 列表 30-1. 为 CakePHP\
  \ 添加自定义路由\n\n```php\n/**\n* 在这里，我们将 '/'（基础路径）连接到名为 'Pages' 的控制器，\n* 它的 action 方法为\
  \ 'display'，并且我们传递一个参数来选择要使用的\n* 视图文件（在此情况下为 /app/View/Pages/home.ctp）。\n */\nRouter::connect('/',\
  \ array('controller' => 'pages', 'action' => 'display', 'home'));\n\n/**\n* . .\
  \ .并连接 'Pages' 控制器的其他 URL。\n */\nRouter::connect('/pages/\\*', array('controller'\
  \ => 'pages', 'action' => 'display'));\n\n/**\n* 自定义路由\n */\nRouter::connect('/register',\
  \ array('controller' => 'users', 'action' => 'register'));\nRouter::connect('/login',\
  \ array('controller' => 'users', 'action' => 'login'));\nRouter::connect('/logout',\
  \ array('controller' => 'users', 'action' => 'logout'));\nRouter::connect('/search',\
  \ array('controller' => 'users', 'action' => 'search'));\nRouter::connect('/profile',\
  \ array('controller' => 'users', 'action' => 'profile'));\nRouter::connect('/settings',\
  \ array('controller' => 'users', 'action' => 'settings'));\nRouter::connect('/friend/\\\
  *', array('controller' => 'users', 'action' => 'friend'));\nRouter::connect('/unfriend/\\\
  *', array('controller' => 'users', 'action' => 'unfriend'));\nRouter::connect('/users/edit/\\\
  *', array('controller' => 'users', 'action' => 'edit'));\nRouter::connect('/users/delete/\\\
  *', array('controller' => 'users', 'action' => 'delete'));\nRouter::connect('/users/undelete/\\\
  *', array('controller' => 'users', 'action' => 'undelete'));\nRouter::connect('/fonts/\\\
  *', array('controller' => 'files', 'action' => 'fonts'));\nRouter::connect('/thumbnails/\\\
  *', array('controller' => 'files', 'action' => 'thumbnails'));\nRouter::connect('/files/delete/\\\
  *', array('controller' => 'files', 'action' => 'delete'));\nRouter::connect('/files/undelete/\\\
  *', array('controller' => 'files', 'action' => 'undelete'));\n\n/**\n* 加载所有插件路由。请参\
  \ CakePlugin 文档\n* 了解如何自定义插件路由的加载。\n */\nCakePlugin::routes();\n\n/**\n* 加载 CakePHP\
  \ 默认路由。如果你不想使用\n* 内置默认路由，请删除此行。\n */\nrequire CAKE . 'Config' . DS . 'routes.php';\n\
  ```\n\n前两个路由是自动为我们定义的。第一个路由将对 URL `/` 的请求指向 `pages/home` action。第二个路由用于根据 `pages/display`\
  \ action 显示命名的页面。如果你尝试访问这些新路由的任何一个，你将看到一个错误，因为我们还没有创建相应的内容。\n\n**注意**：你可以在 http://book.cakephp.org/2.0/development.html\
  \ 找到更多关于 CakePHP 路由的细节。\n\n## 问题\n\n1. `Router` 允许非常详细的路由规范。我们如何将这种功能加入到我们的框架中？\n\
  2. 与配置文件相比，使用函数调用来添加路由有什么好处？\n\n### 回答\n\n1. 我们的框架有两种不同类型的路由：`Simple` 和 `Regex`\
  \ 子类。为了增强我们的路由器，我们只需要创建处理额外情况的详细子类。\n2. 函数调用可以对路由规范进行更精细的控制。我们可以对函数调用执行各种操作（例如传递回调或对象实例），而配置文件无法做到。\n\
  \n### 练习\n\n1. 在本章中，我们创建了示例应用程序的所有路由。现在尝试创建一个用户名来调用 `users/profile` 的路由。\n2. 没有控制器和\
  \ action，这些路由对我们来说没有帮助。尝试创建一个控制器和 action 来处理几个路由。\n\n\n\n\n```sql\n'email' varchar(100)\
  \ DEFAULT NULL,\n'password' varchar(32) DEFAULT NULL,\nPRIMARY KEY ('id')\n) ENGINE=InnoDB\
  \ DEFAULT CHARSET=utf8 ;\n```\n\n# 第 31 章 ■ Cakephp: MVC\n\n到为止，我们所有的用户表在命名上都是单数形式。在使用\
  \ CakePHP 时，有一套关于如何命名数据库表（以及其他方面）的约定。它允许 `CakePHP` 推断各种事物的名称并据此生成代码。\n\n该数据库表可以通使用列表\
  \ 31-2 所示的模型类轻松与 ORM 交互。\n\n**列表 31-2.** `~/app/Model/User.php`\n\n```php\nclass\
  \ User extends AppModel\n{\n// 这里没有内容\n}\n```\n\n由于我们为用户数据库表使用了命名约定，该模型类出奇地空闲。如果我们创建一个示例\
  \ action（如列表 31-3 所示），可以明显看出模型如何像我们之前的示例应用程序一样被使用。\n\n**列表 31-3.** `~/app/Controller/UsersController.php`\n\
  \n```php\nApp::uses(\"AppController\", \"Controller\");\nclass UsersController extends\
  \ AppController\n{\n    public $name = \"Users\";\n    public $helpers = array(\"\
  Html\", \"Form\");\n    public $uses = array(\"User\");\n    public function index()\n\
  \    {\n        $user = $this->User->find(\"first\");\n        print_r($user); //\
  \ 还没有用户！\n        $id = $this->User->save(array(\n            \"first\" => \"Chris\"\
  ,\n            \"last\" => \"Pitt\",\n            \"email\" => \"cgpitt@gmail.com\"\
  ,\n            \"password\" => \"chris\"\n        )); // 用户已保存\n        $user =\
  \ $this->User->find(\"first\");\n        print_r($user); // 找到了 Chris!\n       \
  \ exit();\n    }\n}\n```\n\n这向我们展示了我们不仅可以以可预测的方式使用 `CakePHP` 中的模型，而且它们比我们的其他示例应用程序需要更少的设置。让我们进入控制器和视图！\n\
  \n## 控制器 (Controllers)\n\n现在我们已经理解了在 `CakePHP` 中创建模型的基础，可以继续学习应用程序运行所需的 `UsersController`\
  \ 类，如列表 31-4 所示。\n\n**列表 31-4.** `~/app/Controller/UsersController.php` (摘)\n\n\
  ```php\nclass UsersController extends AppController\n{\n    public $name = \"Users\"\
  ;\n    public $helpers = array(\"Html\", \"Form\");\n    public $uses = array(\"\
  User\");\n    public $user;\n    protected function _isSecure()\n    {\n       \
  \ $this->_getUser();\n        if (!$this->user)\n        {\n            $this->redirect(array(\n\
  \                \"action\" => \"login\"\n            ));\n        }\n    }\n  \
  \  protected function _getUser()\n    {\n        $id = $this->Session->read(\"user\"\
  );\n        if ($id)\n        {\n            $this->user = $this->User->findById($id);\n\
  \        }\n    }\n}\n```\n\n这些方法与我们在之前的示例应用程序中创建的相似，仅用于检查用户会话是否有效，并根据会话存储的用户 ID\
  \ 从数据库中提取用户数据。我们继续看列表 31-5 所示的 `register()` action。\n\n**列表 31-5.** `~/app/Controller/UsersController.php`\
  \ (摘)\n\n```php\nclass UsersController extends AppController\n{\n    public function\
