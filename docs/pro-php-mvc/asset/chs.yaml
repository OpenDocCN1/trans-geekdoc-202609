  ### 第 4 步\n\n我们在 Ubuntu 中需要做的最后件事是将文件的所有者设置为 `Apache2`，并设置正确的文档根（document root）。在同一个文件夹中使用以下命令更改文件所有者：`chown\
  \ –R www-data:www-data *`\n\n接下来，输入 `vim /etc/apache2/sites-enabled/000-default`，并将显示\
  \ `DocumentRoot` 的行更改为你的应用程序目录 public 文件夹的正确路径。我的路径是 `/var/www/public`，因此配置文件中的该行应该为\
  \ `DocumentRoot /var/www/public`（参见图 A-18）。\n\n**图 A-18.** 设置正确的 DocumentRoot\n\n\
  > **注意**：`vim` 是一种常用的文本编辑器，安装在大多数 Linux 系统上。如果尚未安装，你可以通过输入 `apt-get install vim`\
  \ 来安装。或者，你也可以使用你喜欢的文本编辑器，但这里是将 `DocumentRoot` 路径更新到正确的位置。\n\n## MAC OS X\n\n在本节中，我们将介绍在\
  \ OS X 中的安装过程。这些软件包的安装通常被称为 MAMP (**M**ac **A**pache **M**ySQL **P**HP)。\n\n###\
  \ 第 1 步\n\n安装我们的 OS X 服务器非常简单。首先访问 http://www.mamp.info/en/downloads/ 并下载最新版本的 `MAMP`\
  \ & `MAMP PRO`。解压下载的压缩包内容并运行相应的安装程序（32 位或 64 位）。\n\n安装程序将在你的“应用程序（Applications）”文件夹中放置一个\
  \ `MAMP` 文件夹，并且管理员权限来执行此操作。系统会提示你提供管理员密码。当你打开 `MAMP` 应用程序（它现在应该已经在应用程序文件夹中了）时，你可以轻松地停止/启动服务器并查看本地\
  \ Web 服务器的落地页（参见图 A-19）。你可以将默认端口设置为 `80/3306`（参见图 A.20），就像你在 Windows 7/Linux 中设置的一样，你还可以选择运行的适当\
  \ `PHP` 版本（你应该选择 `PHP 5.3+`）。最后，你还可以从 Apache 标签页设置正确的 `DocumentRoot` 文件夹。\n\n**图\
  \ A-19.** Memcached 应用程序\n**图 A-20.** 在 OS X 中设置服务器端口\n\n通过随 `MAMP` 安装的 `phpMyAdmin`，重复我们之前为应用程序创建数据库架构、用户名和密码的步骤。\n\
  \n### 第 2 步\n\n在 OS X 中安装 `Memcached` PHP 扩展有些棘手。你需要输入以下命令：\n\n- `chmod u+x /Applications/MAMP/bin/php/php5.3.X/bin/p*`（其中\
  \ *5.3.X* 是你在 `MAMP` 应用程序中选择的 `PHP` 版本）\n- `cd /tmp`\n- `wget http://pecl.php.net/get/memcache-2.2.5.tgz`\n\
  - `tar -zxvf memcache-2.2.5.tgz`\n- `cd memcache-2.2.5`\n- `/Applications/MAMP/bin/php/phpX.X/bin/phpize\
  \ MACOSX_DEPLOYMENT_TARGET=10.6 CFLAGS='-O3 -fno-common -arch i386 -arch x86_64'\
  \ LDFLAGS='-O3 -arch i386 -arch x86_64' CXXFLAGS='-O3 -fno-common -arch i386 -arch\
  \ x86_64' ./configure`\n- `make`\n- `cp modules/memcache.so /Applications/MAMP/bin/php/phpX.X/lib/php/extensions/no-debug-zts-2006013/`\n\
  - `echo 'extension=memcache.so' > /Applications/MAMP/bin/php/phpX.X/conf/php.ini`\n\
  \n重启服务器后，通过 `MAMP` 应用程序，`PECL Memcache` 类应该就可以使用了。\n\n### 如果缺少 wget？\n\n你可能无法使用\
  \ `wget` 命令，这种情况下你将停在第 3 步。不用担心，可以通过以下命令轻松安装：\n\n```bash\n/usr/bin/ruby -e \"$(/usr/bin/curl\
