  \n# 附录 a ■ 设置 Web 服务器\n\n**图 A-3. 获取 Google Chrome 的路径**\n\n完成 WAMP 的安装后，你将在系统托盘中看到一个新图标。如果你左键点击此图标，将看到一个弹出菜单。点击\
  \ `localhost`。\n\n**注意** 你不必使用 `google Chrome`。你可以以相同的方法针对任何其他浏览器。\n\n## 讨厌的 Skype！\n\
  \n我每次在 Windows 系统上安装 WAMP 时（该系统恰好运行着 Skype）都会遇到的反复问题是 `Apache` 无法加载。这是由于浏览器和 Skype\
  \ 的工作方式。\n\n长期以来，Web 服务器通过端口 `80` 提供内容一直是标准。同样，浏览器从域名的端口 `80` 请求网站。你可以轻松地更改这些内容，但它们是行业标准。因此，端口\
  \ `80` 是一个热门端口。路由器和安全软件经常开放此端口以发送/接收数据，因为它们假设这里只会发生 `HTTP` 流量。\n\n见此，Skype 选择使用端口\
  \ `80` 作为默认通信端口，这样它就可以绕过即使是最严格的安全软件。问题是，`Apache` 或 `Skype` 其中其一（但不能同时同时）可以使用端口 `80`。\n\
  \n我们可以在不同的端口上运行 `Apache` 并不断更改浏览器的地址栏以匹配，或者我们可以更改 Skype 设置。我建议更改 Skype！要让 Skype\
  \ 使用不同的端口，进入 `Skype` ➤ `选项` ➤ `高级` ➤ `连接` ➤ 并取消勾选“使用端口 80 和 443 作为备用……”。\n\n（参见图\
  \ A-4）。现在重启 `Skype` 和 `WAMP`，问题应该就解决了。\n\n447\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
