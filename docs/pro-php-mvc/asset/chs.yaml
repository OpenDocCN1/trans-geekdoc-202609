  CHAPTER 11 ■ TEsTing\n\n再次考虑用于插入/更新行的数据库方法。如果提供了 `WHERE` 子句，数据库将尝试更新行。如果没有 `WHERE`\
  \ 条件，将插入一行。调用 `delete()` 方法将删除匹配 `WHERE` 条件的行，如果没有条件，则删除所有行。\n\n### Model\n由于我们选择创建一个\
  \ ORM 并将其存储在 `Model` 类中，大多数模型测试都涉及 ORM 方法。`Model` 类不是工厂，因此我们不需要那些测试，只需创建一组简单的模型测试。\n\
  \n我们需要测试模型结构是否正确同步到数据库。我们需要测试是否可以从数据库插入、更新和删除行。我们还测试了是否可以从数据库返回匹配 `WHERE` 条件的行。\n\
  \n### Coverage\n我们应该创建覆盖以下测试：\n- `Model` 类同步数据库。\n- `Model` 类可以插入行。\n- `Model` 类可以获取行数。\n\
  - `Model` 类可以多次保存行。\n- `Model` 类可以更新行。\n- `Model` 类可以删除行。\n\n### Tests\n首先，我们需要定义同步数据库的模型，如列表\
  \ 11-14 所示。\n\n**列表 11-14. 将模型同步到数据库**\n\n```php\nclass Example extends Model\n\
  {\n    protected $id;\n    protected $name;\n    protected $created;\n}\n```\n\n\
  ```php\n$database = new Framework\\\\Database(array(\n\"host\" => \"localhost\"\
