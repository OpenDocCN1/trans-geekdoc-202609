  \ 控制语句中。这样做是为了我们能够拦截框架可能抛出的每一个异常，并显示相应的错误页面。由于这个原因，我们将忽略所有的旧代码，并将放在错误页面的呈现上。\n\n\
  首先，我们定义一个完整的模板列表，这些模板与应该调用它们的异常相关联。\n\n这个简单的列表定义了两个错误页面模板，但欢迎根据需要定义任意数量的模板。在确定了异常的类名后，我们遍历这个模板/异常列表，尝试找到要显示的合适模板。如果抛出的异常类名与列表上的某项匹配，则渲染对应的模板。如果失败，则渲染一个备用模板。\n\
  \n276\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 17 章 ■共享\n\n■ **注意**\
  \ 如果我们需要执行额外的逻辑，例如向管理员发送错误报告邮件，这将是执行该操作的地方，而异常类型带来的额外灵活性只会对过程有所帮助！如果异常类型不重要到足以支持此操作，我们可以限制此邮件功能。\n\
  \n关于这段新增代码，还有两个重要的点需要注意。第一是，我们使用 `include` 语句渲染错误页面模板。你可能会奇怪，既然我们已经费力创建了一个出色的视图/模板系统，为什么要这样做？原因是异常应该在\
  \ `View/Template` 类中抛出。如果我们正试图解决的异常是由用于处理它的代码所引起的，这并不理想。因此，我们在渲染错误页面时需要尽可能少使用我们的框架代码。\n\
  \n这引出了第二个重要的点，即错误页面模板是 PHP 文件。通过使用 PHP 文件，我们可以利用错误页面展示 PHP 异常数据，并根据我们创建的 `DEBUG`\
  \ 常量采取行动。我们可以通过查看错误页面的通用布局看到其实际，如列表 17–2 所示。\n\n***列表 17–2.** application/views/errors/404.php\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>社交网络</title>\n</head>\n<body>\n\
  error 404\n<?php if (DEBUG): ?>\n<pre><?php print_r($e); ?></pre>\n<?php endif;\
  \ ?>\n</body>\n</html>\n```\n\n现实情况是，布局的更改将不会影响这些错误文档。结果是，我们将有一些重复的视图标记。另一方面，我们将拥有一个安全的应用程序，这有助于我们调试应用程序，并呈现用户友好的错误页面。\n\
  \n■ **注意** 当你的代码处于生产环境环境中时，请记住将 `DEBUG` 设置为 `false`。你不想希望普通用户知道你代码故障的细节。\n\n## 朋友\n\
  \n社交网络由朋友组成。有时他们被称为*连接*（connections）或*关注者*（followers），但它们通常是同一事物：即其他用户。我们已经构建了注册和登录应用程序所需的大部分细节，但现在我们需要添加与其他用户连接的能力。\n\
  \n277\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 17 章 ■共享\n\n第一步是创建一个\
  \ `Friend` 模型，如列表 17–3 所示。\n\n***列表 17–3.** Friend 模型\n\n```php\nclass Friend extends\
  \ Shared\\Model\n{\n    /**\n     * @column\n     * @readwrite\n     * @type integer\n\
  \     */\n    protected $_user;\n\n    /**\n     * @column\n     * @readwrite\n\
  \     * @type integer\n     */\n    protected $_friend;\n}\n```\n\n这个 `Friend` 模型需要列表\
  \ 17–4 所示的数据库表。\n\n***列表 17–4.** friend 表\n\n```sql\nCREATE TABLE friend (\n   \
  \ user_id int(11) DEFAULT NULL,\n    friend_id int(11) DEFAULT NULL,\n    id int(11)\
  \ NOT NULL AUTO_INCREMENT,\n    level tinyint(4) DEFAULT NULL,\n    created datetime\
  \ DEFAULT NULL,\n    modified datetime DEFAULT NULL,\n    PRIMARY KEY (id),\n  \
  \  KEY user_id (user_id),\n    KEY friend_id (friend_id)\n) ENGINE=InnoDB CHARSET=utf8;\n\
  ```\n\n除了这个简单的模型，我们需要创建处理添加和取消好友的操作。我们将它们添加到 `Users` 控制器中，如列表 17–5 所示。\n\n***列表\
  \ 17–5.** friend()/unfriend() 操作\n\n```php\npublic function friend($id)\n{\n   \
  \ $user = $this->getUser();\n    $friend = new Friend(array(\n        \"user\" =>\
  \ $user->id,\n        \"friend\" => $id\n    ));\n    $friend->save();\n    header(\"\
  Location: /search.html\");\n    exit;\n}\n\npublic function unfriend($id)\n{\n \
  \   $user = $this->getUser();\n    $friend = Friend::first(array(\n        \"user\"\
  \ => $user->id,\n        \"friend\" => $id\n    ));\n    if ($friend)\n    {\n \
  \       $friend->delete();\n    }\n    header(\"Location: /search.html\");\n   \
  \ exit;\n}\n```\n\n使用刚刚创建的 `Friend` 模型，添加和取消好友的操作是非常简单的。在两种操作中，我们都获取会话，以便获取登录用户的\
  \ ID。结合传递的 `$id` 参数，我们要么创建一个新的 friend 记录。\n\n你可能会好奇为什么我们重定向到 `/search.html` 而不是\
  \ `/users/search.html`。简单的答案是我们需要自定义路由来处理添加/取消好友的操作，因此我们将利用此机会简化我们已经看到的很多 URL，如列表\
  \ 17–6 所示。\n\n***列表 17–6.** public/routes.php\n\n```php\n// 定义路由\n$routes = array(\n\
  \    array(\n        \"pattern\" => \"register\",\n        \"controller\" => \"\
  users\",\n        \"action\" => \"register\"\n    ),\n    array(\n        \"pattern\"\
  \ => \"login\",\n        \"controller\" => \"users\",\n        \"action\" => \"\
  login\"\n    ),\n    array(\n        \"pattern\" => \"logout\",\n        \"controller\"\
  \ => \"users\",\n        \"action\" => \"logout\"\n    ),\n    array(\n        \"\
  pattern\" => \"search\",\n        \"controller\" => \"users\",\n        \"action\"\
  \ => \"search\"\n    ),\n    array(\n        \"pattern\" => \"profile\",\n     \
  \   \"controller\" => \"users\",\n        \"action\" => \"profile\"\n    ),\n  \
  \  array(\n        \"pattern\" => \"settings\",\n        \"controller\" => \"users\"\
  ,\n        \"action\" => \"settings\"\n    ),\n    array(\n        \"pattern\" =>\
  \ \"unfriend/?\",\n        \"controller\" => \"users\",\n        \"action\" => \"\
  friend\",\n        \"parameters\" => array(\"id\")\n    ),\n    array(\n       \
  \ \"pattern\" => \"friend/?\",\n        \"controller\" => \"users\",\n        \"\
  action\" => \"friend\",\n        \"parameters\" => array(\"id\")\n    )\n);\n\n\
  // 添加定义的路由\nforeach ($routes as $route)\n{\n    $router->addRoute(new Framework\\\
  Router\\Route\\Simple($route));\n}\n\n// 取消全局变量\nunset($routes);\n```\n\n\n\n\n\n\
  我们通过定义一个自定义路由初始化数组来开始创建自定义路由。在代码的最底部，你可以看到我们哪里为 `friend()`/`unfriend()` 操作定义了路由。我们只需遍历这个自定义路由列表，创建\
  \ `Router\\Route\\Simple` 实例并将其分配给我们的路由器。最后，我们取消（unset）所定义的数组，以保持全局命名空间的整洁。\n\n\
  在继续之前，我们需要将此自定义路由文件引入到引导文件中，如列表 17–7 所示。\n\n### 列表 17–7. `public/index.php`（摘）\n\
  \n```php\n// router\n\n$router = new Framework\\Router(array(\n\n\"url\" => isset($_GET[\"\
  url\"]) ? \\$_GET[\"url\"] : \"home/index\",\n\n\"extension\" => isset($_GET[\"\
  url\"]) ? \\$_GET[\"url\"] : \"html\"\n\n));\n\nFramework\\Registry::set(\"router\"\
  , $router);\n\n// include custom routes\n\ninclude(\"routes.php\");\n\n// dispatch\
  \ request\n\n$router->dispatch();\n```\n\n有了这些自定义路由，我们现在可以缩短在第 16 章中创建的导航链接，如列表\
  \ 17–8 所示。\n\n### 列表 17–8. `application/views/navigation.html`\n\n```html\n<a href=\"\
  /\">home</a>\n\n<a href=\"/search.html\">search</a>\n\n{if (isset($user))}\n\n<a\
  \ href=\"/profile.html\">profile</a>\n\n<a href=\"/settings.html\">settings</a>\n\
  \n<a href=\"/logout.html\">logout</a>\n\n{/if}\n\n{else}\n\n<a href=\"/register.html\"\
  >register</a>\n\n<a href=\"/login.html\">login</a>\n\n{/else}\n```\n\n用户添加/删除其他好友最符合逻辑的地方是搜索页面。记住，我们已经在搜索结果中创建了一个用户列表。我们可以通过添加新链接来修改此页面，如列表\
  \ 17–9 所示。\n\n### 列表 17–9. `application/views/users/search.html`（摘）\n\n```html\n\
  <table>\n\n<tr>\n\n<th>Name</th>\n\n<th>&nbsp;</th>\n\n</tr>\n\n{foreach $row in\
  \ $users}\n\n<tr>\n\n<td>{echo $row->first} {echo $row->last}</td>\n\n<td>\n\n<a\
  \ href=\"/friend/{echo $row->id}.html\">friend</a>\n\n<a href=\"/unfriend/{echo\
  \ $row->id}.html\">unfriend</a>\n\n</td>\n\n</tr>\n\n{/foreach}\n\n</table>\n```\n\
  \n此时，如果你没有登录，应该会看到一个错误。这是因为我们还没有通过通过检查是否存在有效的用户会话（session）来保护操作。如果你好奇我们如何轻松地做到这一点，你应该回想一下创建\
  \ `Inspector` 类时（在第 3 章）以及如何实例化控制器的（在第 7 章）。\n\n让我们来看看保护操作所需的代码，如列表 17–10 所示。\n\n\
  ### 列表 17–10. `application/controllers/users.php`（摘）\n\n```php\n/**\n* @before _secure\n\
  */\npublic function friend($id)\n{\n    // friend code\n}\n\n/**\n* @before _secure\n\
  */\npublic function unfriend($id)\n{\n    // unfriend code\n}\n\n/**\n* @protected\n\
  */\npublic function _secure()\n{\n    $user = $this->getUser();\n    if (!$user)\n\
  \    {\n        header(\"Location: /login.html\");\n        exit();\n    }\n}\n\
  ```\n\n添加 `@before` 元标记将告诉 `Router` 类我们希望在执行这些操作之前运行该方法。\n\n`_secure()` 拥有一个 `@protected`\
  \ 标记，这允许 `Inspector` 类发现它，但同时禁止通过路由进行访问。这意味着 `_secure()` 虽然从路由的角度来看是不可的，但它会在 `friend()`\
  \ 和 `unfriend()` 操作之前运行。如果用户会话不存在，用户将会被重定向到登录页面。\n\n**注意**：只有当你的应用程序位于 webroot 中时，重定向到\
  \ `/login.html` 才有意义。如果它在另一个文件夹中，那么像 `/site/login.html` 这样的目标会更合理。务必保护设置（settings）和个人资料（profile）操作，因为这些操作也需要有效的用户会话。\n\
  \n能够结友远没有知道你的朋友是谁那么重要！此时，我们可以使用 `friend`/`unfriend` 方法来修改数据库行，但我们还需要能够判断另一个用户是否是当前用户的朋友。我们需要在\
  \ `User` 模型中添加一个告诉我们此结果的方法。查看列表 17–11 了解我们如何实现。\n\n### 列表 17–11. `isFriend()`/`hasFriend()`\
  \ 方法\n\n```php\npublic function isFriend($id)\n{\n    $friend = Friend::first(array(\n\
  \        \"user\" => $this->getId(),\n        \"friend\" => $id\n    ));\n    if\
  \ ($friend)\n    {\n        return true;\n    }\n    return false;\n}\n\npublic\
  \ static function hasFriend($id, $friend)\n{\n    $user = new self(array(\n    \
  \    \"id\" => $id\n    ));\n    return $user->isFriend($friend);\n}\n```\n\n`isFriend()`\
  \ 方法通过简单的查找来检查用户之间的关系。`hasFriend()` 方法是相同内容的静态表示。如果我们将其接入搜索功能中，它看起来应该是这样的。\n\n###\
  \ 列表 17–12. `application/views/search.html`（摘）\n\n```html\n<table>\n\n<tr>\n\n<th>Name</th>\n\
  <th>&nbsp;</th>\n\n</tr>\n\n{foreach $row in $users}\n\n<tr>\n\n<td>{echo $row->first}\
  \ {echo $row->last}</td>\n\n<td>\n\n{if (isset($user))}\n<a href=\"/unfriend/{echo\
  \ $row->id}.html\">unfriend</a>\n{/if}\n{else}\n<a href=\"/friend/{echo $row->id}.html\"\
  >friend</a>\n{/else}\n\n</td>\n\n</tr>\n\n{/foreach}\n\n</table>\n```\n\n有了这些新方法，显示正确的链接变成了一项简单的任务，因为我们现在可以搜索并添加好友了。\n\
  \n分享是非常重要的事情。这可能是人们使用社交网络的首要原因。我们将创建让用户分享状态消息的方法。我们甚至允许他们对其进行评论。为了存储消息信息，我们需要另一个模型，如列表\
  \ 17–13 所示。\n\n### 列表 17–13. `Message` 模型\n\n```php\nclass Message extends Model\n\
  {\n    /**\n    * @column\n    * @readwrite\n    * @type text\n    * @length 256\n\
  \    * @validate required\n    * @label body\n    */\n    protected $_body;\n\n\
  \    /**\n    * @column\n    * @readwrite\n    * @type integer\n    */\n    protected\
  \ $_message;\n\n    /**\n    * @column\n    * @readwrite\n    * @type integer\n\
  \    */\n    protected $_user;\n}\n```\n\n该消息模型对应列表 17–14 中的数据库表。\n\n### 列表 17–14.\
  \ message 表\n\n```sql\nCREATE TABLE message (\nuser_id int(11) DEFAULT NULL,\nmessage_id\
  \ int(11) DEFAULT NULL,\nbody text DEFAULT NULL,\nid int(11) NOT NULL AUTO_INCREMENT,\n\
  live tinyint(4) DEFAULT NULL,\ndeleted tinyint(4) DEFAULT NULL,\ncreated datetime\
  \ DEFAULT NULL,\nmodified datetime DEFAULT NULL,\nPRIMARY KEY (id),\nKEY (live),\n\
  KEY (deleted)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8\n```每条消息都有正文，属于一个用户，并且可以与另一个消息（被分享的消息）相关。创建实际的消息非常简单：我们首先需要修改首页，向当前用户展示所有相关的消息。\n\
  \n让我们看看如何自定义 `Home` 控制器以显示朋友的消息流，如列表 17–15 所示。\n\n### 列表 17–15. 消息流\n\n```php\n\
  public function index()\n{\n    $user = $this->getUser();\n    $view = $this->getActionView();\n\
  \    if ($user)\n    {\n        $friends = Friend::all(array(\n            \"user\
  \ = ?\" => $user->id,\n            \"live = ?\" => true,\n            \"deleted\
  \ = ?\" => false\n        ), array(\"friend\"));\n        $ids = array();\n    \
  \    foreach($friends as $friend)\n        {\n            $ids[] = $friend->friend;\n\
  \        }\n        $messages = Message::all(array(\n            \"user in ?\" =>\
