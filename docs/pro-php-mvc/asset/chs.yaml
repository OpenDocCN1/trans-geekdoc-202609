  \       $this->Session->setFlash(\"您的账户已创建.\");\n            }\n            else\n\
  \            {\n                $this->Session->setFlash(\"创建账户时发生错误。\");\n    \
  \        }\n        }\n    }\n}\n```\n\n`register()` action 与之前的版本很大不同，虽然代码显著减少，但\
  \ `CakePHP` 在后台做了很多工作。首先，`register()` action 检查表单是否已提交，然后立即尝试在数据库中保存用户数据。这要求表单字段遵循命名约定，以便模型能够仅根据表单名称推断数据库字段值。接下来，会话中会存储一个临时的“闪存”消息以告知用户此操作的结果。为了使用此\
