  \     else\n            {\n                $current[\"children\"][] = $node;\n \
  \           }\n        }\n        return $root;\n    }\n}\n```\n\n`_tree()` 方法遍历由\
  \ `_array()` 方法生成的模板分段数组，并将它们组织成一个层级结构。纯文本节点直接被原样分配给树，而标签则会生成并分配额外的元数据。这里需要注意的一个重要点是，某些语句具有\
  \ `isolated`（孤立）属性。该属性指定了是否允许在语句之前存在文本。当循环遇到一个孤立标签时，它会移除之前的前一个分段（只要该分段是纯文本分段），这样最终生成的函数代码在语法上就是正确的。我们需要完成的模板处理的最后一步是将模板树转换为\
  \ PHP 函数。这将允许我们重用模板，而无需重新编译它。请查看列表 8-10 以了解我们是如何实现这一点的。\n\n### _script() 方法\n\n\
  ```php\nnamespace Framework\n{\n    use Framework\\Base as Base;\n    use Framework\\\
  ArrayMethods as ArrayMethods;\n    use Framework\\StringMethods as StringMethods;\n\
  \    use Framework\\Template\\Exception as Exception;\n\n    class Template extends\
  \ Base\n    {\n        protected function _script($tree)\n        {\n          \
  \  $content = array();\n            if (is_string($tree))\n            {\n     \
  \           $tree = addslashes($tree);\n                return \"\\$_text = \\\"\
  {$tree}\\\";\n            }\n            if (sizeof($tree[\"children\"]) > 0)\n\
  \            {\n                foreach ($tree[\"children\"] as $child)\n      \
  \          {\n                    $content[] = $this->_script($child);\n       \
  \         }\n            }\n            if (isset($tree[\"tag\"]))\n           \
  \ {\n                $content[] = implode($content);\n            }\n          \
  \  return implode($content);\n        }\n    }\n}\n```\n\n\n\n\n```php\nname: \"\
  ;$_text[] = $name;$_text[] = \" < br />\n\naddress: \";$_text[] = $address;$_text[]\
  \ = \" < br />\n\n}elseif ($name) {$_text[] = \"\n\nname: \";$_text[] = $name;$_text[]\
  \ = \" < br />\n\n\";}$_text[] = \"\n\n\";foreach ($stack as $value_i => $value)\
  \ {\n\n$_text[] = \"\n\n\";foreach ($value as $item_i => $item) {\n\n$_text[] =\
  \ \"\n\nitem (\";$_text[] = $item_i;$_text[] = \"): \";$_text[] = $item;$_text[]\
  \ = \" < br />\n\n\";\n\n}$_text[] = \"\n\n\";\n\n}$_text[] = \"\";\n\n// 完整列表已略\n\
  ```\n\n## 概述 (Overview)\n真是一团糟！产生这种现象最大的原因是解析器考虑了我们原始示例模板中包含的空白字符（特别是换行符）。你看到的大部分混乱都是这些空白。处理后的模板（应用了数据的解析模板）非常整洁，如列表\
  \ 8-15 所示。\n\n#### 列表 8-15 结果 (Listing 8-15. Results)\n```\nname: Chris\naddress:\
  \ Planet Earth!\nitem (0): 1\nitem (1): 2\nitem (2): 3\nitem (0): 4\nitem (1): 5\n\
  item (2): 6\nnothing in that stack!\nthis item's value is: 1\nthis item's value\
  \ is: 2\nthis item's value is: 3\nin first\nin second\nin third\n{=\"hello world\"\
  }\n```\n\n### 优势 (Benefits)\n你可能会问自己，将一种模板语言更换另一种有什么好处。毕竟，PHP 仅仅是一种模板语言。我们甚至还没有移除所有的\
  \ PHP 痕迹——对 `$` 符号的需求以及严格的语法——所以我们到底得到了什么呢？\n\n归结底，我们本可以花更多时间在一个简单的模板方言上。我们甚至可以让模板看起来和感觉起来像普通的\
  \ HTML。我们最终得到的是比普通 PHP 更易于理解和学习的东西。\n\n你希望能够将代码交给普通的前端技术人员/设计师，让他们立即看到并理解发生了什么，而不需要大量的\
  \ PHP 经验。我们的模板方言/解析器帮助我们实现了这一目标。\n\n市面上已经有许多模板方言/解析器了。我们可能会使用比我们在这里编写的更复杂的工具，但了解创建一个工具包含的内容是有帮助的，这样我们就能欣赏别人的工作，并能够根据客户或项目经理的需求对其进行定制。\n\
  \n我们将最后查看一次列表 8-16 和 8-17 中完整的 `Template\\Implementation\\Standard` 和 `Template`\
  \ 类。\n\n#### 列表 8-16. Template\\Implementation\\Standard 类 (Listing 8-16. Template\\\
  Implementation\\Standard Class)\n```php\nnamespace Framework\\Template\\Implementation\n\
  {\n\nuse Framework\\Template as Template;\nuse Framework\\StringMethods as StringMethods;\n\
  class Standard extends Template\\Implementation\n{\n    protected $_map = array(\n\
