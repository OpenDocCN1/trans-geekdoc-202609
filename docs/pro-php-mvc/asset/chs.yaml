  385\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n第 26 章 ■ ZEnd FRAmEwoRk:\
  \ 引导与启动\n\n**第 27 章**\n\n# Zend Framework: MVC\n\n在提供的用于构建示例应用程序的工具方面，Zend Framework\
  \ 比 CodeIgniter 更接近我们的框架。我们已经看到了 Zend Framework 路由系统与我们的框架之间的相似之处，但它还有一个与我们自己的类似的\
  \ ORM 系统。当我们在本章中使用它们时，将会欣赏这些东西。\n\n## 目标\n\n\n\n\n在我们为示例应用程序创建控制器、模型和视图时，我们需要识别我们的框架与\
  \ Zend Framework 之间的差异。\n\n* 我们需要为用户、朋友、文件和消息创建模型。\n* 我们需要创建相应的视图和控制器。\n\n## 差异\n\
  \n在本书所关注的框架中，Zend Framework 实际上与我们的框架最相似。\n\n它们的不同之处（以及其他方面）在于对 MVC 模式的遵循紧密程度。你可能会认为我们的框架做得更好，但\
  \ Zend 实际上为 Zend Framework 选择了一个松耦合的模型，这从一开始就能看出来。你下载的并不是一个整齐组织在熟悉文件夹结构中的 MVC 框架。相反，你下载的是一组类，当将\
  \ MVC 模式应用到这些类时，它们运行得非常好。\n\n正因如此，在我们让自己的框架执行有关用户、朋友、文件和消息的等操作时，编写的代码似乎比我们要求的要多。这仅仅是因为我们的框架对\
  \ ORM 和控制器的耦合比 Zend Framework 对其 ORM 和控制器的耦合更紧密。\n\n## 模型\n\n我们将通过查看几种使用 Zend Framework\
  \ ORM 选择和修改数据库记录的方法来开始模型工作。在修改数据库记录之前，我们需要定义应用程序将要使用的数据库表。目前，我们只需要用户表，如列表 27-1 所示。\n\
  \n### Listing 27-1. user 表\n\n```sql\nCREATE TABLE 'user' (\n'id' int(11) NOT NULL\
  \ AUTO_INCREMENT,\n'live' tinyint(4) DEFAULT NULL,\n'deleted' tinyint(4) DEFAULT\
  \ NULL,\n'created' datetime DEFAULT NULL,\n'modified' datetime DEFAULT NULL,\n'first'\
  \ varchar(32) DEFAULT NULL,\n'last' varchar(32) DEFAULT NULL,\n'email' varchar(100)\
  \ DEFAULT NULL,\n'password' varchar(32) DEFAULT NULL,\nPRIMARY KEY ('id')\n) ENGINE\
  \ = InnoDB DEFAULT CHARSET = utf8 ;\n```\n\n有了这个表，我们就可以执行数据库操作，例如列表 27-2 所示的查询操作。\n\
  \n### Listing 27-2. 选择行\n\n```php\n$db = Zend_Db::factory(\n\"pdo_mysql\",\narray(\n\
  \"host\" => \"localhost\",\n\"username\" => \"prophpmvc\",\n\"password\" => \"prophpmvc\"\
  ,\n\"dbname\" => \"prophpmvc-zendframework\"\n)\n);\n\n$table = new Zend_Db_Table(array(\n\
  \"name\" => \"user\",\n\"db\" => $db\n));\n\n$select = $table->select()\n->where(\"\
  first = ?\", \"Chris\")\n->order(\"id ASC\");\n\n$user = $table->fetchRow($select);\n\
  ```\n\n前两个语句并不是专门用于选择行的，而是建立与数据库的连接并请求一个用于处理用户表的接口。我们稍后会将它们移动到更合适的位置，但理解它们是如何工作的至关重要的。\n\
  \n`Zend_Db` 工厂类仅用于返回一个数据库适配器的实例，其方式与我们自己的数据库工厂类非常相似。`Zend_Db_Table` 类同样返回一个接口，通过它我们可以查询/操作我们之前创建的用户数据库表。它支持与我们的框架以及\
  \ CodeIgniter 相似的查询接口。\n\n列表 27-3 展示了我们如何修改用户行。\n\n### Listing 27-3. 修改用户行\n\n```php\n\
  $id = $table->insert(array(\n\"first\" => \"Joe\",\n\"last\" => \"Blogs\",\n\"email\"\
  \ => \"joe@example.com\",\n\"password\" => \"password\",\n\"live\" => true,\n\"\
  deleted\" => false,\n\"created\" => date(\"Y-m-d\"),\n\"modified\" => date(\"Y-m-d\"\
