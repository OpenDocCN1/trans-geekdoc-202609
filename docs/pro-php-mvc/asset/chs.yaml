  \n# 第 7 章 路由\n\n下一个示例如列表 7-13 所示，展示了如何利用元数据在我们的 Controller 子类中使用钩子。`init()`、`authenticate()`\
  \ 和 `notify()` 方法带有 `@protected` 标记，因此它们不会被我们的 Router 类路由。`home()` 方法指示了 `init()`、\n\
  \n80\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n# 第 7 章 路由\n\n\n\n\n\
  `authenticate()` 和 `init()`（再次！）应该在执行 `home()` 方法之前执行。这也表明 `notify()` 方法应该在 `home()`\
  \ 方法之后执行。最后，`init()` 方法的元数据表明它在每个 URL 路由中仅运行一次。我们的路由器能够满足所有这些需求！\n\n### 列表 7-13.\
  \ 控制器元属性示例\n\n```php\nclass Index extends Framework\\Controller\n{\n    /**\n  \
  \   * @once\n     * @protected\n     */\n    public function init()\n    {\n   \
  \     echo \"init\";\n    }\n\n    /**\n     * @protected\n     */\n    public function\
  \ authenticate()\n    {\n        echo \"authenticate\";\n    }\n\n    /**\n    \
  \ * @before init, authenticate, init\n     * @after notify\n     */\n    public\
  \ function home()\n    {\n        echo \"hello world!\";\n    }\n\n    /**\n   \
  \  * @protected\n     */\n    public function notify()\n    {\n        echo \"notify\"\
  ;\n    }\n}\n```\n\n`$router = new Framework\\Router();`\n`$router->addRoute(\n\
  \    new Framework\\Router\\Route\\Simple(array(\n        \"pattern\" => \":name/profile\"\
  ,\n        \"controller\" => \"home\",\n        \"action\" => \"index\"\n    ))\n\
  );`\n`$router->url = \"chris/profile\";`\n`$router->dispatch();`\n\n## 问题\n\n1.\
  \ 如果我们的框架可以直接推断所有路由，或者我们可以定义所有需要的路由，为什么我们我们需要两种定义路由的方法呢？\n2. 是否有更简单的方法来定义 `Route`\
  \ 实例？\n\n### 答案\n\n3. 主要原因是灵活性。在许多情况下，推断的路由是不够的，而且我们不希望自己去麻烦地定义所有简单路由。\n4. 我们无法使用配置文件来处理此类问题，因为我们还没有定义一种允许使用我们用于定义路由的数据结构的配置文件标准。有更简单的方法来定义大量路由，你将在第\
  \ 17 章中看到。\n\n### 练习\n\n5. 路由高度依赖于应用程序。有时，你可能需要指定与我们在本章中演示的不同的类型的路由。\n\n尝试创建一个 `Route`\
  \ 子类，允许你命名路由，然后重定向到其他命名的路由。\n6. 同时定义许多路由可能会变成非常杂乱的代码。\n\n尝试简化十个 `Router\\Route\\\
  Simple` 实例的创建。\n\n---\n\n# 第 8 章：模板\n\nMVC 的核心是关注点分离，在我们的框架中，没有任何地方比视图和控制器之间的分离更重要。通常，当人们考虑应用程序的前端（或客户端）时，他们想到的是\
  \ HTML、CSS 和 JavaScript。如果加上服务器端交互，PHP 的一部分不可避免地进入了其中。\n\n更糟糕的是，我们通常需要在视图中直接使用 PHP\
  \ 处理控制器提供给的数据。许多人尝试过用模板语言（以及解析器）来解决这个问题。这可能并没有太大意义——用另一种中间方言代替 PHP——但它有优势。无论你选择是否在框架中使用模板解析，这都是一个很好的练习。\n\
  \n## 目标\n\n- 我们需要定义模板解析器类。\n- 我们需要形式化模板方言。\n- 我们需要构建一个功能性的模板类。\n\n## get\n\n为了构建解析器，我们首先需要定义它是如何工作的。它应该接受一种语言，同时保持灵活性。\n\
  \n### 列表 8-1. 基础方言\n\n```php\n// (内容由列表 8-1 表示)\n```\n\n## 实现\n\n要构建解析器，我们需要三个步骤。第一步是源代码的分词化。第二步是将片段组织成层级结构。最后一步是将模板转换为结果。\n\
  \n第一步，源代码的分词化可以使用正则表达式来实现。第二步，将片段组织成层级结构通常通过使用数组完成。最后一步，将模板转换为结果正是我们需要的。目前已经有很多很好的库可以为此工作了。\n\
  \n### 替代方案\n\n由于我们很大程度上处理的是字符串，我们需要扩展 `StringMethods` 并添加新方法来清理字符串、移除重复字符并确定子字符串。\n\
  \n### 列表 8-2. 额外的 StringMethods 方法\n\n```php\nnamespace Framework\n\nclass StringMethods\n\
  {\n    public static function sanitize($string, $mask)\n    {\n        if (is_array($mask))\
  \ {\n            $parts = $mask;\n        } elseif (is_string($mask)) {\n      \
  \      $parts = str_split($mask);\n        } else {\n            return $string;\n\
  \        }\n\n        foreach ($parts as $part) {\n            $normalized = self::normalize(\"\
  \\\\$part\");\n            $string = preg_replace(\n                \"{$normalized}m\"\
  ,\n                \"\\\\$part\",\n                $string\n            );\n   \
  \     }\n        return $string;\n    }\n\n    public static function unique($string)\n\
  \    {\n        $unique = \"\";\n        $parts = str_split($string);\n        foreach\
  \ ($parts as $part) {\n            if (!strstr($unique, $part)) {\n            \
  \    $unique .= $part;\n            }\n        }\n        return $unique;\n    }\n\
  \n    public function indexOf($string, $substring, $offset = null)\n    {\n    \
  \    $position = strpos($string, $substring, $offset);\n        if (!is_int($position))\
  \ {\n            return -1;\n        }\n        return $position;\n    }\n}\n```\n\
  \n\n\n\n为了让我们的模板解析器保持灵活，我们的模板方言结构需要与解析器位于不同的类中。这允许我们为同一个解析器更换不同的实现类。我们所有的实现类都应该继承自一个基础实现类。让我们现在来看列表\
  \ 8-3 中的该类。\n\n### 列表 8-3. 模板实现类\n\n```php\nnamespace Framework\\Template\n\n{\n\
  \nuse Framework\\Base as Base;\n\nuse Framework\\StringMethods as StringMethods;\n\
  \nuse Framework\\Template\\Exception as Exception;\n\nclass Implementation extends\
  \ Base\n\n{\n\n    protected function _handler($node)\n    {\n        if (empty($node[\"\
  delimiter\"]))\n        {\n            return null;\n        }\n\n        if (!empty($node[\"\
  tag\"]))\n        {\n            return $this->_map[$node[\"delimiter\"]][\"tags\"\
  ][$node[\"tag\"]][\"handler\"];\n        }\n\n        return $this->_map[$node[\"\
  delimiter\"]][\"handler\"];\n    }\n\n    public function handle($node, $content)\n\
  \    {\n        try\n        {\n            $handler = $this->_handler($node);\n\
  \            return call_user_func_array(array($this, $handler), array($node, $content));\n\
  \        }\n        catch (\\Exception $e)\n        {\n            throw new Exception\\\
  Implementation();\n        }\n    }\n\n    public function match($source)\n    {\n\
  \        $type = null;\n        $delimiter = null;\n\n        foreach ($this->_map\
  \ as $_delimiter => $_type)\n        {\n            if (!$delimiter || StringMethods::indexOf($source,\
  \ $type[\"opener\"]) == -1)\n            {\n                $delimiter = $_delimiter;\n\
  \                $type = $_type;\n            }\n            $indexOf = StringMethods::indexOf($source,\
  \ $_type[\"opener\"]);\n            if ($indexOf > -1)\n            {\n        \
  \        if (StringMethods::indexOf($source, $type[\"opener\"]) > $indexOf)\n  \
  \              {\n                    $delimiter = $_delimiter;\n              \
  \      $type = $_type;\n                }\n            }\n        }\n\n        if\
  \ ($type == null)\n        {\n            return null;\n        }\n        return\
  \ array(\n            \"type\" => $type,\n            \"delimiter\" => $delimiter\n\
  \        );\n    }\n}\n\n}\n```\n\n`_handler()` 方法接收一个 `$node` 数组并确定要执行的正确处理器方法。`handle()`\
  \ 方法使用 `_handler()` 方法获取正确的处理器方法并执行它，如果在执行语句的处理器时出现问题，则会抛出 `Template\\Exception\\\
  Implementation` 异常。`match()` 方法评估 `$source` 字符串以确定它是否匹配某个标签或语句。\n\n这个类看起来可能很奇怪，因为我们甚至不知道实现文件具体是什么样的。事实上，它的三个方法都直接处理仅于\
  \ `Template\\Implementation` 子类中的内容。每种语言都有自己的规则，或句法。我们需要定义这些规则，以便我们的解析器知道如何处理它需要解析的标记。我们在\
  \ `Template\\Implementation` 子类中定义了这些内容。列表 8-4 显示了我们默认模板解析器的语法映射。\n\n### 列表 8-4.\
  \ 默认模板实现语法/语言映射\n\n```php\nnamespace Framework\\Template\\Implementation\n\n{\n\n\
  use Framework\\Template as Template;\n\nuse Framework\\StringMethods as StringMethods;\n\
  \nclass Standard extends Template\\Implementation\n\n{\n    protected $_map = array(\n\
  \        \"echo\" => array(\n            \"opener\" => \"{echo\",\n            \"\
  closer\" => \"}\",\n            \"handler\" => \"\\echo\"\n        ),\n        \"\
  script\" => array(\n            \"opener\" => \"{script\",\n            \"closer\"\
  \ => \"}\",\n            \"handler\" => \"\\script\"\n        ),\n        \"statement\"\
  \ => array(\n            \"opener\" => \"{\",\n            \"closer\" => \"}\",\n\
  \            \"tags\" => array(\n                \"foreach\" => array(\n       \
  \             \"isolated\" => false,\n                    \"arguments\" => \"{element}\
  \ in {object}\",\n                    \"handler\" => \"\\each\"\n              \
  \  ),\n                \"for\" => array(\n                    \"isolated\" => false,\n\
  \                    \"arguments\" => \"{element} in {object}\",\n             \
  \       \"handler\" => \"\\for\"\n                ),\n                \"if\" =>\
  \ array(\n                    \"isolated\" => false,\n                    \"arguments\"\
  \ => null,\n                    \"handler\" => \"\\if\"\n                ),\n  \
  \              \"elseif\" => array(\n                    \"isolated\" => true,\n\
  \                    \"arguments\" => null,\n                    \"handler\" =>\
  \ \"\\elif\"\n                ),\n                \"else\" => array(\n         \
  \           \"isolated\" => true,\n                    \"arguments\" => null,\n\
  \                    \"handler\" => \"\\else\"\n                ),\n           \
  \     \"macro\" => array(\n                    \"isolated\" => false,\n        \
  \            \"arguments\" => \"{name}({args})\",\n                    \"handler\"\
  \ => \"\\macro\"\n                ),\n                \"literal\" => array(\n  \
  \                  \"isolated\" => false,\n                    \"arguments\" =>\
  \ null,\n                    \"handler\" => \"\\literal\"\n                )\n \
  \           )\n        )\n    );\n}\n\n}\n```\n\n列表 8-4 中的代码显示了所谓的语法/语言映射。它定义了我们的模板必须支持的标签类型，例如\
  \ `foreach`、`if` 和 `else`。打印标签是最基础的；`script` 标签用于执行任意 PHP。语句标签用于控制结构。每个标签都有一个开始和结束字符串，这告诉解析器如何处理开始和结束。我们按照列表\
  \ 8-5 所示实现了这些函数。\n\n### 列表 8-5. 语句处理器函数\n\n```php\nnamespace Framework\\Template\\\
  Implementation\n\n{\n\nuse Framework\\Template as Template;\n\nuse Framework\\StringMethods\
  \ as StringMethods;\n\nclass Standard extends Template\\Implementation\n\n{\n  \
  \  protected function _echo($tree, $content)\n    {\n        $raw = $this->_script($tree,\
  \ $content);\n        return \"{$raw}\";\n    }\n\n    protected function _script($tree,\
  \ $content)\n    {\n        $raw = !empty($tree[\"raw\"]) ? $tree[\"raw\"] : \"\"\
  ;\n        return \"{$raw}\";\n    }\n\n    protected function _each($tree, $content)\n\
  \    {\n        $object = $tree[\"arguments\"][\"object\"];\n        $element =\
  \ $tree[\"arguments\"][\"element\"];\n        return $this->_loop(\n           \
  \ $tree,\n            \"foreach ({$object} as {$element}) {\n                {$content}\n\
  \            }\"\n        );\n    }\n\n    protected function _for($tree, $content)\n\
  \    {\n        $object = $tree[\"arguments\"][\"object\"];\n        $element =\
  \ $tree[\"arguments\"][\"element\"];\n        return $this->_loop(\n           \
  \ $tree,\n            \"for ({$element} = 0; {$element} < sizeof({$object}); {$element}++)\
  \ {\n                {$element} = {$object}[{$element}];\n                {$content}\n\
  \            }\"\n        );\n    }\n\n    protected function _if($tree, $content)\n\
  \    {\n        $raw = $tree[\"raw\"];\n        return \"if ({$raw}) {{$content}}\"\
  ;\n    }\n\n    protected function _elif($tree, $content)\n    {\n        $raw =\
  \ $tree[\"raw\"];\n        return \"elseif ({$raw}) {{$content}}\";\n    }\n\n \
  \   protected function _else($tree, $content)\n    {\n        return \"else {{$content}}\"\
  ;\n    }\n\n    protected function _macro($tree, $content)\n    {\n        $arguments\
  \ = $tree[\"arguments\"];\n        $name = $arguments[\"name\"];\n        $args\
  \ = $arguments[\"args\"];\n        return \"function {$name}({$args}) {\n      \
  \      $_text = array();\n            {$content}\n            return implode($_text);\n\
  \        }\";\n    }\n\n    protected function _literal($tree, $content)\n    {\n\
  \        $source = addslashes($tree[\"source\"]);\n        return \"\\$_text[] =\
  \ \\\"{$source}\\\";\";\n    }\n\n    protected function _loop($tree, $inner)\n\
  \    {\n        $number = $tree[\"number\"];\n        $object = $tree[\"arguments\"\
