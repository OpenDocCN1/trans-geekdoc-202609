  success\" => $success\n    ));\n}\n```\n\n与我们在原始应用程序中处理文件上传的方式类似，`register()` 实际上并没有执行文件上传逻辑，但它调用了一个受保护的\
  \ `_upload()` 方法。`_upload()` 方法与我们的原始实现相比略有不同，它在文件上传之前的灵活性较小，而在文件上传后提供的信息更详细。\n\n\
  CodeIgniter 内置的文件上传库在验证已上传的文件以及处理所有在文件系统中移动文件所需的 PHP 代码方面实际上非常强大。我们只需要提供我们想要上传的文件字段名，它就会处理其余大部分工作（在初始化参数的些微帮助下）。\n\
  \n**注意** 您可以在 [`codeigniter.com/user_guide/libraries/file_uploading.html`](http://codeigniter.com/user_guide/libraries/file_uploading.html)\
  \ 学习更多关于 CodeIgniter 文件上传类的信息。\n\n文件被上传后，我们在文件表中创建一行，并将其与用户 ID 关联。在个人资料页面上使用这张照片之前，我们需要查看通过第三方库扩展\
  \ CodeIgniter 的另一个方面。\n\n## 第三方库\n\n与我们的框架类似，CodeIgniter 允许将第三方库放在特殊的目录中，这样就可以在需要的动作中加载它们。问题是\
  \ CodeIgniter 没有对自动加载类做努力，因此对我们来说，如列表 24-5 所示，创建一个外观（façade）类来封装 Imagine 缩略图生成将简单得多。\n\
  \n**列表 24.5. 缩略图外观类***\n\n```php\nclass Thumbnail\n{\n    protected $_filename;\n\
  \n    public function __construct($options = array())\n    {\n        if (isset($options[\"\
  file\"]))\n            $file = $options[\"file\"];\n            $path = BASEPATH).\"\
  /uploads/\";\n            $name = $file->name;\n            $extension = pathinfo($name,\
  \ PATHINFO_EXTENSION);\n            $thumbnail = \"{$path}{$name}.{$extension}\"\
  ;\n            if (!file_exists($thumbnail))\n                $imagine = new Imagine\\\
  Gd();\n                $size = new Image\\Box($width);\n                $mode =\
  \ Image::THUMBIL;\n                $thumbnail = array($options[\"file\"]);\n   \
  \             $filename = $thumbnail;\n                $imagine->open($thumbnail)\n\
  \                        ->resize($size)\n                        ->crop($mode)\n\
  \                        ->save($thumbnail);\n                $this->_filename =\
  \ $filename;\n            }\n    }\n\n    public function getFilename()\n    {\n\
  \        return $this->_filename;\n    }\n}\n```\n\n\n\n\n\n我们最后需要涵盖的内容是如何扩展 CodeIgniter\
  \ 核心类。实现这一点的技巧在于，是在 `application/core` 目录下添加与核心类名称匹配的类，但要带有一个特殊的前缀。如果我们想创建一个我们的应用程序可以继承的控制器，我们只需要在该目录下创建一个\
  \ `MY_Controller.php` 文件即可，如列表 24-9 所示。\n\n### 列表 24-9. `application/core/MY_Controller.php`\n\
  \n```php\nclass MY_Controller extends CI_Controller\n{\n    public $user;\n    public\
  \ static function redirect($url)\n    {\n        header(\"Location: {$url}\");\n\
  \        exit();\n    }\n\n    protected function _isSecure()\n    {\n        //\
  \ get user session\n        $this->_getUser();\n        if (!$this->user)\n    \
  \    {\n            self::redirect(\"/login\");\n        }\n    }\n\n    protected\
  \ function _getUser()\n    {\n        // load session library\n        $this->load->library(\"\
  session\");\n        // get user id\n        $id = $this->session->userdata(\"user\"\
  );\n        if ($id)\n        {\n            // load user model\n            $this->load->model(\"\
  user\");\n            // get user\n            $this->user = new User(array(\n \
  \               \"id\" => $id\n            ));\n        }\n    }\n}\n```\n\n关于扩展核心类需要注意的重要点是：文件名必须匹配\
  \ `my_*` 模式，且自定义的核心类必须继承内置的核心类。我们可以将 `redirect()`、`_isSecure()` 和 `_getUser()` 方法移动到这个新类中，因为任何控制器都可以复用它们。\n\
  \n**注意** 关于扩展核心类还有很多内容需要了解，你可以在 [`codeigniter.com/user_guide/general/core_classes.html`](http://codeigniter.com/user_guide/general/core_classes.html)\
  \ 学习更多。\n\n## 问题\n1. 在我们的原始应用程序中，我们还创建了一个 `File` 模型来在数据库中存储上传文件的引用。我们为什么不直接在上传目录中搜索属于用户的文件的呢？\n\
  2. 在我们的原始应用程序中，我们还为缩略图生成创建了一个特殊的 `/thumbnails/*` 路由，并将缩略图生成集成到了控制器中。这种新方法有任何缺点吗？\n\
  \n### 回答\n1. 我们在文件查找中引入数据库，仅仅是因为查询数据库比遍历文件系统中的文件要快。我们可以通过缓存属于用户的文件列表来使其运行得更快。\n\
  2. 这种新方法有两个缺点。第一是控制器现在需要知道缩略图是如何生成的。第二是缩略图的动态性较差——你不再简单地请求新的缩略图尺寸，因为这必须通过编码来实现！\n\
  \n### 练习题\n1. 我们已经学习了这种缩略图生成方法的缺点。现在请用 CodeIgniter MVC 重新创建我们之前的方法。\n2. 我们还学习了如何扩展核心类，并使用\
  \ `CI_Controller` 类实现了这一点。尝试用我们创建的模型来复制这个想法，将可复用的代码移动到扩展的 `CI_Model` 子类中。\n\n# 第\
  \ 25 章：CodeIgniter：测试\n\n我们通过查看如何使用内置的 CodeIgniter 类对 CodeIgniter 应用程序进行单元测试来结束对\
  \ CodeIgniter 的章节介绍。\n\n## 目标\n- 我们需要找出 CodeIgniter 在单元测试方面提供了哪些功能。\n- 我们需要看看我们还有哪些替代方案。\n\
  \n## 工具\nCodeIgniter 提供了一个简单的单元测试类，你可以用它为你的 CodeIgniter 应用程序编写测试。它有一个方法可以用于添加更多测试，以及有一个方法用于返回格式化结果。让我们来看一个如何使用的示例，如列表\
  \ 25-1 所示。\n\n### 列表 25-1. 使用 CodeIgniter 单元测试类\n\n```php\nclass Welcome extends\
  \ CI_Controller\n{\n    public function index()\n    {\n        $this->load->view('welcome_message');\n\
  \    }\n\n    public function tests()\n    {\n        $this->load->library(\"unit_test\"\
  );\n        $test = $this->testing();\n        $expected_result = \"hello world\"\
  ;\n        $test_name = \"testing function returns hello world\";\n        $this->unit->run($test,\
  \ $expected_result, $test_name);\n        echo $this->unit->report();\n    }\n\n\
  \    public function testing()\n    {\n        return \"hello world\";\n    }\n\
  }\n```\n\n如列表 25-1 所示，你可以使用 CodeIgniter 提供的单元测试库仅比较两个值（其中一个假设是调用操作或函数的结果）。在测试操作在提供提交的表单数据时的执行性能方面，这有一点局限性。\n\
  \n我们留注意的另一个局限性是，CodeIgniter 允许的单元测试必须在 MVC 架构内发生。这使得测试与它们应该测试的框架紧密耦合，而这永远不是一件好事。\n\
  \n### 替代方案\n使用第三方库来测试你的 CodeIgniter 应用程序的功能会好得多。\n\n一个单元测试库（例如 `PHPUnit`）包含了许多不同的断言函数，不仅可以测试两个值的相等性，还可以测试数组的大小、抛出的异常类型、目录中是否存在文件等。\n\
  \n**注意** 如果你想下载或了解更多关于 `PHPUnit` 的信息，可以在 [`github.com/sebastianbergmann/phpunit`](https://github.com/sebastianbergmann/phpunit)\
  \ 进行。\n\n你可以通过将第三方库包含在 `application/libraries` 文件夹中（如我们所做的那样）来利用它们，或者将其完全分离。选择权在于你。\n\
  \n如果你将我们在原始应用程序中实现的单元测试与 `application/libraries` 目录中的内容进行比较，你会发现前者完全独立于 `application/framework`\
  \ 运行。\n\n## 问题\n1. 我们的单元测试与 CodeIgniter 的单元测试类有什么相同之处和不同之处？\n2. 既然 CodeIgniter 已经提供了单元测试类，为什么使用第三方库是一个好主意？\n\
  \n### 回答\n1. 我们的单元测试执行两个基础检查：是否抛出了异常，以及测试是否返回真或假。它被设计用于应用程序架构之外，并且依赖极少。CodeIgniter\
  \ 的单元测试类旨在用于应用程序代码内部。\n\n### 练习题\n1. CodeIgniter 的单元测试类易于设置和使用。尝试使用它创建一些操作测试。\n\
  2. `PHPUnit` 是 CodeIgniter 内置单元测试类的极替代方案。尝试将其集成到我们的应用程序中，并为它编写一些测试。\n\n\n\n\n\n\
  -   我们需要理解 Zend Framework 的设计理念和优势。\n-   我们需要学习如何为我们的示例应用程序创建架构需求。\n\n### 为什么选择\
  \ Zend Framework？\n\nZend Framework 的结构非常良好，并包含了许多与流行的第三方服务的接口。该框架背后的设计理念是：它应该包含每个人需要的\
  \ 80% 的功能，同时允许开发者自定义另外的 20% 以满足他们特定的业务需求。\n\nZend Framework 的文档非常详尽，还涵盖了随核心类提供的所有\
  \ API 类的细节。它还包含了许多关于捆绑类通用用途的示例。\n\n> **注意** 您可以在 [`framework.zend.com/manual/en/introduction.overview.html`](http://framework.zend.com/manual/en/introduction.overview.html)\
  \ 处找到 Zend Framework 的文档。\n\n### 为什么不选择 Zend Framework？\n\nZend Framework 的学习可能比较困难，这仅仅是因为初始的应用布局（或缺乏布局）以及大量的捆绑类。一旦你理解了如何创建\
  \ MVC 应用程序以及如何浏览文档，这些在持续使用该框架时就不再是因素了。\n\n383\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 26 章 ■ ZEnd FRAmEwoRk: 引导与启动\n\nZend Framework (1.11) 没有使用命名空间，主要由于其类的命名方式。\n\
  \n> **注意** 在编写时，Zend Framework 2 处于贝塔测试阶段，并完全支持命名空间。你可以从 [`packages.zendframework.com.`](http://packages.zendframework.com)\
  \ 下载版本 2.0。请注意，它在安装和使用方面似乎与本章使用的 Zend 当前版本有显著区别。\n\n## 环境搭建\n\n使用 Zend Framework\
  \ 生成一个功能性的应用程序相当简单。下载的所有存档都包含一个构建脚本，该脚本将构建推荐的目录结构，甚至为你的应用程序提供示例控制器、视图和配置。我们开始构建示例应用程序需要遵循的步骤如下：\n\
  \n1. 下载 Zend Framework 最小包 ([`framework.zend.com/download/current`](http://framework.zend.com/download/current))\
  \ 并将其解压到任何地方。记住你解压到了哪里，因为你一分钟后需要去那里。\n2. 打开终端（如果你在 Linux 或 OS X）或命令提示符（如果你在 Windows），并导航到解压目录内的\
  \ `bin/` 文件夹。\n3. 使用以下命令运行 `zf.sh`（如果你在 Linux 或 OS X）或 `zf.bat`（如果你在 Windows）文件：\n\
  \    a. Linux/OS X: `./zf.sh create project prophpmvc`\n    b. Windows: `zf.bat\
  \ create project prophpmvc`\n\n> **注意** 第二条命令可能会警告未找到 `PHPUnit`。没关系，因为我们不需要使用它。\n\
  \n你需要配置你的 Web 服务器指向 `public/` 目录，以便生成的引导代码能够执行。\n\n# 路由 (Routes)\n\n除了由 `create\
  \ project` 命令生成的目录结构外，还会创建一个引导文件，允许我们为应用程序指定任何自定义的初始化逻辑。我们必须在该文件的类中为我们的应用程序添加自定义路由（在\
  \ `application/bootstrap.php` 中），如列表 26-1 所示所示\n\n***列表 26-1. application/bootstrap.php***\n\
  \n```php\nclass Bootstrap extends Zend_Application_Bootstrap_Bootstrap\n{\n    protected\
  \ function _initRouter()\n    {\n        $router = Zend_Controller_Front::getInstance()->getRouter();\n\
  \n        $routes = array(\n            \"register\" => array(\"register\", \"users\"\
  , \"register\"),\n            \"login\" => array(\"login\", \"users\", \"login\"\
  ),\n            \"logout\" => array(\"logout\", \"users\", \"logout\"),\n      \
  \      \"search\" => array(\"search\", \"users\", \"search\"),\n            \"profile\"\
  \ => array(\"profile\", \"users\", \"profile\"),\n            \"settings\" => array(\"\
  settings\", \"users\", \"settings\"),\n            \"friend\" => array(\"friend/:id\"\
  , \"users\", \"friend\"),\n            \"unfriend\" => array(\"unfriend/:id\", \"\
  users\", \"unfriend\"),\n            \"users/edit\" => array(\"users/edit/:id\"\
  , \"users\", \"edit\"),\n            \"users/delete\" => array(\"users/delete/:id\"\
  , \"users\", \"delete\"),\n            \"users/undelete\" => array(\"users/undelete/:id\"\
  , \"users\", \"undelete\"),\n            \"fonts\" => array(\"fonts/:name\", \"\
  files\", \"fonts\"),\n            \"thumbnails\" => array(\"thumbnails/:id\", \"\
  files\", \"thumbnails\"),\n            \"files/delete\" => array(\"files/delete/:id\"\
  , \"files\", \"delete\"),\n            \"files/undelete\" => array(\"files/undelete/:id\"\
  , \"files\", \"undelete\")\n        );\n\n        foreach ($routes as $name => $route)\n\
  \        {\n            list($pattern, $controller, $action) = $route;\n       \
  \     $router->addRoute($name, new Zend_Controller_Router_Route($pattern, array(\"\
  controller\" => $controller, \"action\" => $action)));\n        }\n    }\n}\n```\n\
  \n过程非常简单：我们获取 `Zend_Controller_Router` 类的实例（通过 `Zend_Controller_Front` 类）并向其添加几个\
  \ `Zend_Controller_Router_Route` 实例。主应用程序代码将在 `Zend_Application_Bootstrap` 执行后运行，我们必须在该文件的类中为我们的应用程序添加自定义路由（在\
  \ `application/bootstrap.php` 中），如列表 26-1 所示。\n\n除了 `create project` 命令生成的目录结构外，还会创建一个引导文件，允许我们为应用程序指定任何自定义的初始化逻辑。我们必须在该文件的类中为我们的应用程序添加自定义路由（在\
  \ `application/bootstrap.php` 中），如列表 26-1 所示。\n\n过程非常简单：我们获取 `Zend_Controller_Router`\
  \ 类的实例（通过 `Zend_Controller_Front` 类）并向其添加几个 `Zend_Controller_Router_Route` 实例。主应用程序代码将在\
  \ `Zend_Application_Bootstrap` 执行后运行，以便应用程序在尝试确定哪些控制器和操作应该发生时可用。\n\n注意的是，在我们关注的三个框架中，Zend\
  \ Framework 处理路由的方式与我们的框架最相似。重要的一点是，由于 Zend Framework 的路由器类是单例的，而我们的是由注册表管理的，并且\
  \ Zend Framework 的所有路由都是命名的。\n\n如果你尝试访问这些新路由，将看到一个错误。这是因为我们还没有创建相应的控制器和操作。在第 27\
  \ 章中，我们将创建这些路由正常运行所需的控制器、视图等。\n\n> **注意** 有关 Zend Framework 路由的更多细节请访问 [`framework.zend.com/manual/en/zend.router.html`](http://framework.zend.com/manual/en/zend.router.html)。\n\
  \n384\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n第 26 章 ■ ZEnd FRAmEwoRk:\
  \ 引导与启动\n\n## 问题\n\n1. 为什么我们要在 `Zend_Application_Bootstrap` 类中添加路由？我们不能简单地在 `public/index.php`\
  \ 中定义它们吗？\n2. 你能想到哪些自动化构建脚本（例如我们在本章中使用的）可以加速开发？\n\n### 答案\n\n1. 这里没有硬性规定。这只是 Zend\
  \ 建议添加自定义路由的方式之一。如果我们愿意，没有任何阻止我们在 `public/index.php` 直接添加路由。\n2. 除了创建应用程序的初始结构，自动化构建脚本还可以创建额外的控制器、模型甚至视图。Zend\
  \ Framework 的命令行工具可以完成所有这些。\n\n### 练习\n\n1. 在章中，我们创建了示例应用程序所需的所有路由。现在尝试创建一个使用用户名调用\
