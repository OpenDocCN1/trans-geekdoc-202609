- "# PHP MVC 高级指南\n\n\n\n\n\n为了方便起见，Apress 将部分前言内容放在索引之后。请使用“书签”（Bookmarks）和“目录概览”（Contents\
  \ at a Glance）链接访问这些内容。\n\n\n\n- 关于作者 xix\n- 关于技术审核员 xxi\n- 致谢 xxiii\n- 引言 xxv\n\
  \n# 引言\n\n## 本书适合读者\n\n本书既适合新手也适合资深开发者。它的设计方式先解释基础知识，然后涵盖高级主题。这意味着对于经验丰富的开发者来说，某些章节（例如解释设计模式的部分）可能会是老生常谈。如果你属于这类读者，可以随意跳到更具挑战性的内容。\n\
  \n如果你是面向对象编程、框架构建或通用 PHP 的新手，我建议阅读所有内容，并在阅读期间休息，通过编写代码来复习所学知识。\n\n## 本书不会教你的内容\n\
  \n本书不会教你 PHP。它假设你已经具备 PHP 基础知识，并且至少熟悉构建 PHP 网站。如果你是 PHP 新手或从未用过，我建议你查阅 W. Jason\
  \ Gilmore 写的 `Beginning PHP 5 and MySQL`（Apress, 2010）（`www.apress.com/9781893115514`），它将让你对\
  \ PHP 有非常好的理解。\n\n\n\n\n\n# 本书将教你什么\n\n如果你好奇于如何更好地使用面向对象的编程进行开发，或者如何通过构建框架，亦或是设计清晰且一致的\
  \ API，那么你将会喜欢这本书。\n\n如果你好奇流行的 MVC 框架（如后几章节中展示的那些）是如何制作的，或者它们为什么会选择某些开发路线，那么你也将喜欢这本书。\n\
  \n如果你想成为一名更出色的程序员，我希望你会发现这本书对你来说是无价的。\n\n# 源代码\n\n书中的每一行代码都与压缩包中的代码对应（压缩包可以从配套网站下载）。\n\
  \n虽然我们已经付出了巨大努力确保代码在语法上是正确的（因此可以在你的代码编辑器中直接运行），但在某些情况下，为了缩短较长的代码列表，可能会省略某些依赖项。在这种情况下，你可以放心地省略的代码已经在之前的章节或本章之前的页面中解释过并创建了。\n\
  \n当你有疑问或在执行源代码时遇到问题，请参考源代码压缩包。\n\nxxv\n\n\n# 第 1 章\n\n## MVC 简介\n\n软件开发并不是一个新概念。据说埃达·洛芙莱（Ada\
  \ Lovelace）在 19 世纪中叶为分析机编写了第一个计算机程序，那是查尔斯·巴贝奇（Charles Babbage）设计的首台机械计算机原型。\n\n\
  从那时以后已经过了多年，软件开发已经成为人类物种发展最大的贡献者之一。\n\n设计良好的软件是困难的。它涉及到考虑你需要构建的应用程序的所有方面，并且由于需要对当前需求足够具体以完成工作，同时又要足够通用以应对未来的问题，而变得更加复杂。许多经验丰富的开发者遇到过这些问题，随着时间的推移，出现了一些帮助解决这些问题的通用模式。\n\
  \n结构建筑师克里斯托弗·历山大（Christopher Alexander）首次描述了模式，使其适用于软件开发。他说：“每种模式都描述了一个在我们环境中反复出现的问题，然后描述了该问题的核心解决方案，让你可以使用这个解决方案数百万次，而永远不会以相同的方式重复执行它。”他可能是在谈论房屋或城市，但他的话捕捉了我们在考虑如何为\
  \ Web 应用构建一个稳健、安全且可重用的框架时的意图。\n\n## 什么是 MVC？\n\nMVC（模型-视图-控制器）是一种围绕三种主要组件类型的相互连接而构建的软件设计模式，在如\
  \ PHP 等编程语言中，通常侧关注面向对象编程（OOP）软件范式。这三种组件类型被通称为模型（models）、视图（views）和控制器（controllers）。让我们分别讨论它们，然后看看它们是如何结合在一起的。\n\
  \n模型（Model）存储应用程序所有业务逻辑的地方。业务逻辑可以是任何关于应用程序如何存储数据或使用第三方服务以满足其业务需求的内容。如果应用程序需要访问数据库中的信息，那么执行该操作的代码将保存在模型中。如果需要（例如）获取股票数据或关于新产品发布推文，这些代码也会保存在模型中。\n\
  \n视图（View）是存储应用程序所有用户界面元素的地方。这可以包括我们的 HTML 标记、CSS 样式表和 JavaScript 文件。用户看到或与之交互的任何内容都可以保存在视图中，有时用户看到的实际上实际上是同一次请求中许多不同视图的组合。\n\
  \n控制器（Controller）是将模型和视图连接在一起的组件。控制器将模型的业务逻辑与视图的用户界面元素隔离开，并处理应用程序如何响应视图中的用户交互。控制器是这三个组件的第一个入口，因为请求首先被传递给控制器，然后由控制器实例化满足应用程序请求所需的模型和视图。参见图\
  \ 1-1。\n\n1\n\n\nCHAPTER 1 ■ InTRoduCTIon To MVC\n\n用户\n视图\n控制器\n模型\n\n**图 1-1.**\
  \ MVC 概述*\n\n**注意** 并不是应用程序的每一个请求都需要模型或视图。加载哪些元素取决于请求的类型以及完成该请求所需的资源。请求的 URL 定义了这一点，这个过程被称为\
  \ `routing`（路由），我们将在第 7 章中介绍它。例如，控制器可能仅用于切换应用程序的状态，或直接从第三方服务返回未解析的数据。在这种情况下，就不需要模型或视图了！\n\
  \n让我们来看一个说明这些类使用的示例应用程序。社交网络通常易于使用，但在幕后可能非常复杂。如果我们构建一个简单的社交网络，我们不仅需要考虑用户界面元素，还需要考虑用户数据是如何存储的以及用户界面是如何对用户输入做出的。我们需要考虑以下方面：\n\
  \n- 我们的社交网络可能会在数据库中维护用户数据。它还需要从 Flickr 等第三方服务访问用户照片。这两个操作的代码都应该保存在模型中，因为这些操作直接涉及我们的业务需求。\n\
  - 我们的社交网络应该是易于使用且对用户有吸引力的。因为我们是为 Web 构建，我们将使用标准的网站技术，如用于标记的 HTML、外部链接的 CSS 样式表以及用于行为的外部链接\
  \ JavaScript 文件。所有这些元素都存在视图中。\n- 我们应用程序的模型和视图必须连接在一起互不干扰。此外，应用程序需要一种方式来响应视图中的用户交互并将相关数据持久化到模型中。控制器为此目的。\n\
  \n希望这以易理解的方式说明了这一概念。在本书中我们将更详细地查看每个部分。简单的社交网络也将作为一个贯穿始终的示例，解构使框架运行的代码。\n\n## MVC\
  \ 的优势\n\n如果不知道为什么要使用 MVC，那么解释 MVC 是什么意义的。还记得我之前提到的克里斯托弗·历山大的模式吗？MVC 是书中将解释的许多模式之一，但要理解这种设计模式的实用性，我们必须看向它帮助缓解的问题。\n\
  \n如果你考虑运动队，你可能会意识到它本质上是一群大型群体，他们通过履行各自的角色来推动团队向前。优秀的运动队需要每位球员尽其个人能力履行自己的角色，以推动团队整体向前。\n\
  \nWeb 是一个开放的竞技场。它允许大型和小型企业相互竞争，而无需规模作为工作质量的因素。这意味着许多开发人员少的小公司也有机会构建大型 Web 应用。它意味着许多大公司可以有许多人\
  \ 2\n\n\nCHAPTER 1 ■ InTRoduCTIon To MVC\n\n同时处理大型 Web 应用。在所有这些多任务处理和/或小组参与中，应用程序的各个方面（本应该是独立的）经常会相互干扰，并比推动向前所需的需要更多的时间和精力。\n\
  \n\n\n\n任何复杂的 Web 应用程序都包含许多方面。有设计，它能激发用户对产品的兴趣；有业务逻辑，用于处理实际事务，例如处理销售项目和为顾客开开发票。此外还有对应用程序进行持续改进、更新、修复错误和通用精简的过程。\n\
  \n在任何非结构化的应用程序中，这些领域往往会融合成一团杂乱无章的混乱物。当数据库需要更改以适应新的产品线，或者公司决定重新品牌时，受影响的不仅仅是代码。需要更多的开发者参与进来，以确保应用程序某一部分的更改不会立即破坏应用程序的其他部分。本应只影响代码中极小部分的更改，最终却会蔓溢到各种奇怪且产生问题的区域中。\n\
  \n这正是 `MVC` 试图解决的问题。它为应用程序的所有代码和功能定义了严格的容器。当数据库代码的更改被隔离在模型（model）中时，视图（views）和控制器（controllers）就不会损坏。当应用程序的视觉设计发生巨大变化时，其控制器和模型将不受破坏性更改的影响。\n\
  \n**注意** 一个优秀的基于 `MVC` 的应用想要成功，不仅仅需要良好的 `MVC` 框架。它需要准备好遵守规则、并仔细考虑代码存放位置的开发者，而不是直接把代码扔进代码库中。我们只能设计结构，就像建筑师设计一座美丽的房子一样。保持秩序取决于使用我们框架的开发者。\n\
  \n现在我们了解了更多关于为什么要使用 `MVC` 的知识，让我们来看看一些编写自有框架的流行替代方案。\n\n## 流行的 MVC 框架\n\n有很多优秀的\
  \ PHP 框架可用，但如果我们把视野限制在三个框架上，我认为我们可以很好地了解它们的共同点以及它们各自的独特之处。这些并不是最好或唯一的 PHP `MVC`\
  \ 框架，而仅仅是 PHP `MVC` 开发不同方法的一个良好横截截面。\n\n## CodeIgniter\n\n`CodeIgniter` 是我们将研究的框架中第一个也是最简单的一个。它由\
  \ `EllisLab` 开发和维护，可以被描述为一个开源（尽管受严格控制）的框架，它是 `EllisLab` 高级 CMS（内容管理系统）`ExpressionEngine`\
  \ 的基础。\n\n它已经存在了很久，多年年来，从我第一次使用它以来，它的理念几乎没有变化。它努力保持极小的占用、卓越的开发者文档和高代码质量。它的受欢迎程度不如我们将谈到的其他一些框架，这部分归于\
  \ `EllisLab` 管理 `CodeIgniter` 社区的方式。他们最近开始通过新的会议和员工来解决这个问题，该框架的前景正在好转。\n\n它还启发了其他框架，诞生了如\
  \ `KohanaPHP` 等项目。\n\n**注意** 你可以在 [`codeigniter.com`](http://codeigniter.com) 下载\
  \ `CodeIgniter`。你也可以在 [`ellislab.com`](http://ellislab.com) 了解更多关于 `EllisLab` 和\
  \ `ExpressionEngine`。最后，你可以在 http://kohanaframework.org 更多关于 `KohanaPHP`。\n\n3\n\
  \n\n第 1 章 ■ MVC 简介\n\n### Zend Framework\n\n`Zend Framework` 是一个松耦合代码库的广泛集合，可以构成\
  \ `MVC` 架构的基础。与其它流行的 `MVC` 框架相比，`Zend Framework` 需要花费大量的精力来理解和掌握。它由 `Zend Technologies`\
  \ 开发，并享有大型稳定社区和广泛采用的所有优势。\n\n虽然像 `CodeIgniter` 这样的框架力求轻量化，只保留核心部分，但 `Zend Framework`\
  \ 包含了帮助开发者利用各种第三方服务和 API 的库。\n\n**注意** 你可以在 [`framework.zend.com`](http://framework.zend.com)\
  \ 下载 `Zend Framework`。你也可以在 [`zend.com`](http://zend.com) 了解更多关于 `Zend`。\n\n###\
  \ CakePHP\n\n`CakePHP` 是三个框架中最流行的。与之前的两个框架不同，它不受任何单一实体控制。它拥有庞大的社区并被广泛采用。\n\n它倾向于“约定优于配置”，这意味着许多细节都被假设并自动处理。\n\
  \n这在框架的每一个领域都显而易见，你经常会发现自己在好奇 `CakePHP` 如何完成你没有要求它做的事情（无论结果好坏）。这意味着你可以快速开发应用程序，但当你需要进行非常具体的更改时，可能会遇到困难。\n\
  \n这在命令行工具 `Bake` 中也能看到。在几分钟内，它就可以通过遵循参数生成一个运行的应用程序。\n\n**注意** 你可以在 [`cakephp.org`](http://cakephp.org)\
  \ 下载 `CakePHP`。\n\n## 设计模式\n\n我们将专注于构建框架的 `MVC`。我们审查的设计模式通常可以应用于过程化开发，但我们将在特定的语境下回顾它们（等一下，`MVC`\
  \ 是一种面向对象的方法）。我们将回顾的设计模式是在面向对象编程的背景下。\n\n如果你对某些概念不熟悉，可能需要参考相关的语言指南。\n\n**注意** 如果你想了解更多关于面向对象编程的知识，可以访问\
  \ [`en.wikipedia.org/wiki/Object-oriented_programming`](http://en.wikipedia.org/wiki/Object_oriented_programming)。\n\
  \n### Singleton (单例)\n\n当我们构建 OOP 软件时处理许多类。虽然将这些类设计为可以存在多个实例是理想的，但在某些情况下我们需要某个类只有一个实例。\n\
  \n4\n\n\n第 1 章 ■ MVC 简介\n\n`Singleton` 是一种确保类在任何时刻只有一个实例的设计模式。传统的 `Singleton` 类在内部静态属性中维护自己的实例，并且不能像非单例类那样以通常的方式实例化（或克隆）。`Singletons`\
  \ 有一个特殊的访问方法，用于返回内部实例，或者创建一个新实例并存储。\n\n```\nMySingleton class\n是否存在实例 是\n否\n获取实例\n\
  返回实例\n创建实例\n```\n***图 1-2.** 单例过程*\n\n**注意** 你可以在 [`en.wikipedia.org/wiki/Singleton_pattern`](http://en.wikipedia.org/wiki/Singleton_pattern)\
  \ 更多关于 `Singleton`。\n\n### Registry (注册表)\n\n`Registry` 是一个可以存储和返回标准类实例的类。把它想象成球队经理，根据需要将球员换下并让新球员上场。我们使用\
  \ `Registry` 类来管理有限的类实例，这样我们就不需要不断实例化 `Registry` 已包含的类。\n\n另一种思考 `Registry` 类的方式是，它帮助我们像对待\
  \ `Singleton` 一样对待普通类，而无需将这些普通类变为 `Singleton`。我们可能会遇到需要某个类的两个实例的情况。也许我们需要连接到两个不同的数据库，但我们不想反复连接它们，所以我们使用\
  \ Registry。\n\n```\nMyRegistry class\n获取实例\n检查实例存储\n是\n否\n是否存在实例？\n返回实例\n创建实例\n\
  存储实例\n```\n\n\n\n\n\n### 图 1-3. 注册表过程\n\n**注意** 你可以在 [`blog.fedecarg.com/2007/10/26/registry-pattern-or-dependency-injection-container`](http://blog.fedecarg.com/2007/10/26/registry-pattern-or-dependency-injection-container)\
  \ 阅读更多关于注册表模式的知识。\n\n# 第 1 章 MVC 简介\n\n## 工厂 (Factory)\n\n工厂（Factory）是一个类，它提供了一个单一接口用于创建任意数量的实例，而实际上不需要指定实例应该属于类类型。工厂将根据输入或内部逻辑选择实例化哪种类。\n\
  \n当我们需要执行数据库操作，但可能处理许多不同的数据库驱动程序时，工厂是非常有用的。我们使用 `Factory` 类来提供正确的驱动程序类，确保我们所有的驱动程序都符合标准接口。见图\
  \ 1-4。\n\n```\nMyFactory class\nGet an instance\nDetermine the correct class\nCreate\
  \ an instance\nReturn the instance\n```\n\n### 图 1-4. 工厂过程\n\n**注意** 你可以在 [`en.wikipedia.org/wiki/%0aFactory_method_pattern.`](http://en.wikipedia.org/wiki/%0aFactory_method_pattern.)\
  \ 阅读更多关于工厂模式的知识。\n\n## 观察者 (Observer)\n\n观察者模式描述了一种存在发送者和接收者的结构。当发送者的状态发生变化时，它会向与其关联的接收者发送消息，通常通过调用它们的一个函数来实现。\n\
  \n这种模式最实用的用途是实现基于事件（异步）的软件，并便于仅通过应用状态变化相关的类之间实现松耦合。见图 1-5。\n\n```\nMyEvents class\
  \ (sender)\nReceiver 1\nMaintain list of receivers\nReceiver 2\nHas the state changed?\n\
  Receiver 1\nNotify receivers\nReceiver 2\n```\n\n### 图 1-5. 观察者过程\n\n**注意**\n\n\
  你可以在 [`en.wikipedia.org/wiki/Observer_pattern.`](http://en.wikipedia.org/wiki/Observer_pattern)\
  \ 阅读更多关于观察者模式的知识。\n\n## 创建我们自己的框架\n\n你可能会疑惑，既然已经有这么多好的选择，我们为什么还需要创建自己的框架。这样做的原因是为了让我们理解\
  \ MVC 的底层原理。\n\n随着我们对这些原理的深入学习，我们将对为什么目前优秀的 MVC 框架要那样运作有更深层次的理解。我们并不是在学习如何在 Zend\
  \ Framework 或 CakePHP 中创建应用程序。我们学习的是 MVC 是如何工作的，并借此学习这些框架是如何构建在（或偏离）我们预期的 MVC 框架构建方式之上的。\n\
  \n我们的目标不是向现有的可用于生产的框架列表增加新项。我们的目标是学习这些框架如何做以及为什么要这么做，以便我们在为下一个大项目选择框架时，能够做出明智的决策。\n\
  \n**注意** 欢迎在生产环境中使用我们构建的框架，但我建议不要这样做做，除非你准备好在框架的安全性和稳定性要求上投入大量时间，因为这些流行的框架花费了多年时间才实现这些目标。\n\
  \n## 目标\n\n我已经提到了我们的第一个目标，即学习。最重要的是，我们的框架应该教我们任何 MVC 框架都不可或的核心概念。我们将首先通过查看一些基础组件来实现这一点，随后我们将在这些组件之上创建一个实际的应用程序。重要的是，无论我们用它构建什么应用程序，我们框架的核心概念都应该保持不变。\n\
  \n这自然会引发第二个目标，即创建一个易于配置的框架，并且对我们将用它构建的应用程序做出最少的假设。这将在稍后的应用程序配置以及底层系统代码中体现。我们应该尝试只在合理的地方启用配置选项。\n\
  \n我们的最后一个目标是创建一个抽象平台，它足够强大，可以在许多不同的环境中执行，但仅关注于我们可以在测试环境中预期的那些环境。换句话说，我希望我们允许任何颜色，但从涂蓝色开始。这意味着我们应该创建能够与许多种数据库接口的基础设施，但最初我们将只写一个数据库驱动程序。这意味着我们应该创建能够在各种地方存储缓存的基础设施，但只关注我们将处理的第一类型。\n\
  \n我想让我们进入处理问题根源以及解决问题所有方法的心态。我希望我们学习一个真正的 MVC 框架应该是什么样的。我希望我们努力在最需要的时候提供灵活性，在最需要的时候提供可预测性。我希望我们在处理所有这一切的同时，尽可能少地处理具体的案例。当我们充分掌握了一切后，就可以开始扩展到多个环境和服务，但在那之前，我们有这三个目标。\n\
  \n# 第 2 章 基础\n\n我们将通过查看一些基础的（面向面向对象的）代码开始构建我们的框架，核心组件将基于这些代码。我们将首先查看如何执行分布在多个文件中的代码。\n\
  \n我们还将查看当遇到错误时该怎么办。最后，我们将创建一种方便排序和检索类元数据的方法。\n\n## 目标\n\n- 我们需要开发一种自动加载类的方法。类应该根据其名称定位，这些名称应该翻译为文件夹层次结构。\n\
  - 我们需要理解并定义自定义的 `Exception` 子类，以便我们处理可能发生的最常见的错误类型。\n- 我们应该定义一个静态类系统，包含适用于多种数据类型的工具方法。\n\
  - 我们应该开发一种方法，根据特殊代码注释识别我们框架类的结构（和预期用途）。\n\n## 自动加载 (Autoloading)\n\n由于我们要编写大量的代码，可以假设我们希望清晰地组织代码，以避免代码量增加时产生混乱。有几种方法可以实现这一点，其中之一是将单独的代码块放在单独的文件。这种代码结构方法产生的一个问题是，我们需要从单一入口点引用这些外部代码块。\n\
  \n\n\n\n第一条语句会在 PHP 包含路径（include path）中查找 `events.php`，如果存在，PHP 将加载该文件。如果找不到该文件，它将发出警告。第二条语句与第一条相同，不同在于它只会尝试加载\
  \ `inflection.php` 文件一次。你可以根据需要多次运行第二条语句，但该文件只会在第一次被加载。\n\n第三条语句与第一条相似，不同在于 PHP\
  \ 会抛出一个致命错误（fatal error，如果没有被捕获，将停止脚本的执行）。第四条语句与第二条相同，不同在于如果找不到文件，它也会抛出一个致命错误。\n\
  \n这意味着在小规模下，加载类是足够的的，但它确实存在以下缺点：\n\n- 在使用你的脚本之前，你总是需要 `require/include` 包含这些脚本的文件。这听起来很简单，但在大型系统中实际上是一个非常痛苦的过程。你需要记住每个脚本的路径以及包含它们的正确时机。\n\
  - 如果你选择同时包含所有脚本（通常在每个文件的顶部），它们在脚本执行期间将一直处于作用范围内。它们将先于需要它们的脚本被加载，并在任何其他事情发生之前被完全评估。这在小规模下没有问题，但会迅速减慢页面加载速度。\n\
  \n## 命名空间\n\nPHP 5.3.0 中一个特别实用的新增是命名空间（namespaces）。命名空间允许开发者在全局命名空间之外对代码进行沙箱化，避免类名冲突并更好地组织代码。\n\
  \n在我们编写几乎所有的类中都会使用命名空间，而且它们的使用并不特别复杂。考虑列表 2-2 所示的示例。\n\n### 列表 2-2. 命名空间\n\n```php\n\
  namespace Framework\n{\n    class Hello\n    {\n        public function world()\n\
  \        {\n            echo \"Hello world!\";\n        }\n    }\n}\n\nnamespace\
  \ Foo\n{\n    // 允许我们引用 Hello 类\n    // 而无需每次指定它的命名空间\n    use Framework\\Hello\
  \ as Hello;\n\n    class Bar\n    {\n        function __construct()\n        {\n\
  \            // 由于前面的 \"use\" 语句\n            // 我们可以将 Framework\\Hello 简单地引用为 Hello\n\
  \            $hello = new Hello();\n            $hello->world();\n        }\n  \
  \  }\n}\n\nnamespace\n{\n    $hello = new Framework\\Hello();\n    $hello->world();\
  \ //… 输出 \"Hello world!\"\n    $foo = new Foo\\Bar();\n    $foo->bar(); //… 输出 \"\
  Hello world!\"\n}\n```\n\n正如我之前提到的，命名空间有助于将类从全局命名空间移除。命名空间本身位于全局命名空间内，因此它必须保持唯一；然而，它可以包含任意数量的类，这些类可以重用全局或其他命名空间中的类名。\n\
  \n**注意**：命名空间不是 MVC 设计模式的要求，但它们确实有助于避免类和函数名的冲突。一些流行的 MVC 框架（如 Symfony）已经在命名空间中组织了它们的类。\n\
  \n## 懒加载\n\n我们可以使用 `require/include` 方法来加载类，或者我们可以使用 PHP 提供的另一种方法：`spl_autoload_register()`\
  \ 函数。这个内置函数允许我们提供自己的代码，作为根据请求的类名来加载类的手段。\n\n我们将用于查找类文件的模式将是大驼峰命名法（title-case）类名，每个单词之间使用目录分隔符并以\
  \ `.php` 结尾。因此，如果我们需要加载 `Framework\\Database\\Driver\\Mysql` 类，我们将查找文件 `framework/database/driver/mysql.php`（假设我们的框架文件夹在\
  \ PHP 包含路径中）。\n\n### 列表 2-3. 使用 spl_autoload_register\n\n```php\nfunction autoload($class)\n\
  {\n    $paths = explode(PATH_SEPARATOR, get_include_path());\n    $flags = PREG_SPLIT_NO_EMPTY\
  \ | PREG_SPLIT_DELIM_CAPTURE;\n    $file = strtolower(str_replace(\"\\\\\", DIRECTORY_SEPARATOR,\
  \ trim($class, \"\\\\\"))).\".php\"; \n    foreach ($paths as $path)\n    {\n  \
  \      $combined = $path.DIRECTORY_SEPARATOR.$file;\n        if (file_exists($combined))\n\
  \        {\n            include($combined);\n            return;\n        }\n  \
  \  }\n    throw new Exception(\"{$class} not found\");\n}\n\nclass Autoloader\n\
  {\n    public static function autoload($class)\n    {\n        autoload($class);\n\
  \    }\n}\n\nspl_autoload_register('autoload');\nspl_autoload_register(array('autoloader',\
  \ 'autoload'));\n// 这些只能在类上下文中调用……\n// spl_autoload_register(array($this, 'autoload'));\n\
  // spl_autoload_register(__CLASS__.'::load');\n```\n\n第一次调用 `spl_autoload_register()`\
  \ 告诉 PHP 使用 `autoload()` 方法通过名称加载类文件。第二次调用 `spl_autoload_register()` 告诉 PHP 使用 `Autoloader::autoload()`\
  \ 方法通过名称加载类文件。第三次和第四次调用 `spl_autoload_register()` 告诉 PHP 使用发生这些 `spl_autoload_register()`\
  \ 调用的类中的 `autoload()` 方法通过名称加载类文件。\n\n`autoload()` 函数首先将 PHP 的 `get_include_path()`\
  \ 函数返回的字符串拆分为单独的目录。它通过对请求的类名在第二个、第三、第四个及之后的大写字母处进行拆分，并使用 `PATH_SEPARATOR` 常量将单词连接，从而构建出目标文件名。\n\
  \n如果在任何 `$paths` 目录中找到了目标文件，它将包含该文件并通过 `return` 语句结束函数执行。如果在循环遍历 `$paths` 结束时仍未找到文件，将抛出一个\
  \ `Exception`。如果没有抛出异常，你可以假设已找到与类名匹配的文件（在包含路径中的某个目录里）并已成功加载。\n\n**注意**：如果你想了解更多关于\
  \ PHP 命名空间的信息，可以访问完整文档（以及一些示例）：http://php.net/manual/en/language.namespaces.php。\n\
  \n## 异常\n\nPHP 处理改变程序正常流（例如运行时错误）的特殊情况的方法之一抛出异常。除了内置的 `Exception` 类，PHP 还有一种机制来检测\
  \ `Exception` 的发生，并在发生时做一些有用的事情。列表 2-4 显示了一个示例。\n\n### 列表 2-4. Try/Catch 控制语句\n\n\
  ```php\ntry\n{\n    throw new Exception();\n}\ncatch (Exception $e)\n{\n    echo\
  \ \"抛出了异常。\";\n}\n```\n\n在本书中，我们将看到处理各种 `Exception` 子类的代码。大多数这些子类将由我们编写，尽管它们将是 SPL\
  \ 中异常的子类。你可能会奇怪，如果我们只需要通过 try/catch `Exception` 来处理框架中的错误（如列表 2-5 所示），为什么还需要子类化\
  \ `Exception`（或任何 SPL 异常子类）？\n\n### 列表 2-5. 捕获多种异常类型\n\n```php\ntry\n{\n    throw\
  \ new LogicException();\n}\ncatch (ClassNotLoadException $e)\n{\n    // 只有当抛出的异常\n\
  \    // 类型为 \"LogicException\" 时才会执行\n    echo \"抛出了 LogicException！\";\n}\ncatch\
  \ (Exception $e)\n{\n    // 只有当抛出了异常且\n    // 没有被之前的 catch 块捕获时才会执行\n    echo \"\
  出错了，我们不知道是什么错了……\";\n}\n```\n\n正如你所见，PHP 的 try/catch 语句允许我们捕获多种类型的 `Exception`。当我们只预期发生一种类型的异常时，这对我们并没有真正的价值，但在包含许多类和上下文的复杂框架中，它对于维护系统的稳定变得非常有价值。\n\
  \n\n\n想象一种我们正在与数据库交互的场景。一个简单的记录更新可能会在多种相互独立的上下文中失败。可能是连接数据库出现问题，数据缺失导致无法通过验证，甚至可能是发送到数据库的底层\
  \ SQL 存在语法错误。所有这些情况都可以有不同的 `Exception` 子类，并且可以在花费极少精力的情况下在同一个 `try/catch` 语句中被捕获。\n\
  \n创建许多 `Exception` 子类的最后一个益处是，我们可以根据抛出的 `Exception` 子类类型来对用户界面做出响应。我们可能希望根据抛出的 `Exception`\
  \ 是由数据库问题引起还是由缓存类问题引起等，显示不同的视图。\n\n需要记住，每当你看到一个包含 `Exception` 单词的类实例被抛出时，它很可能是我们创建的、用于表示特定错误的\
  \ `Exception` 子类。我们不会总是涵盖单个 `Exception` 子类的代码，但至少我们知道创建它们的原因，以及它们与原始的 `Exception`\
  \ 类相似。\n\n## 类型方法\n\n在本章的剩余部分以及后续章节中，我们将使用许多实用方法来处理在 PHP 中常见的基本数据类型。为了保持代码的整洁，我们将这些实用方法作为静态方法放在静态类型类中；例如，`StringMethods`\
  \ 类上的字符串方法（参见列表 2-6），`ArrayMethods` 类上的数组方法（参见列表 2-7）等。我们将随着时间推移向这些类添加内容，但目前它们将包含列表\
  \ 2-6 和 2-7 中给出的方法。\n\n***Listing 2-6.*** `StringMethods` 类\n\n```php\nnamespace\
  \ Framework\n\n{\n\nclass StringMethods\n{\n    private static $_delimiter = \"\
  #\";\n\n    private function __construct()\n    {\n        // do nothing\n    }\n\
  \n    private function __clone()\n    {\n        // do nothing\n    }\n\n    private\
  \ static function _normalize($pattern)\n    {\n        return self::$_delimiter.trim($pattern,\
  \ self::$_delimiter).self::$_delimiter;\n    }\n\n    public static function getDelimiter()\n\
  \    {\n        return self::$_delimiter;\n    }\n\n    public static function setDelimiter($delimiter)\n\
  \    {\n        self::$_delimiter = $delimiter;\n    }\n\n    public static function\
  \ match($string, $pattern)\n    {\n        preg_match_all(self::_normalize($pattern),\
  \ $string, $matches, PREG_PATTERN_ORDER);\n        if (!empty($matches[1]))\n  \
  \      {\n            return $matches[1];\n        }\n        if (!empty($matches[0]))\n\
  \        {\n            return $matches[0];\n        }\n        return null;\n \
  \   }\n\n    public static function split($string, $pattern, $limit = null)\n  \
  \  {\n        $flags = PREG_SPLIT_NO_EMPTY | PREG_SPLIT_DELIM_CAPTURE;\n       \
  \ return preg_split(self::_normalize($pattern), $string, $limit, $flags);\n    }\n\
  }\n}\n```\n\n`$delimiter` 和 `_normalize()` 成员全部用于正则表达式字符串的规范化，这样其他方法就可以在无需先检查或规范化的情况下对其进行操作。`match()`\
  \ 和 `split()` 方法的功能类似于 `preg_match_all()` 和 `preg_split()` 函数，但对正则表达式的结构要求更低，并且返回更可预测的结果集。`match()`\
  \ 方法将返回第一个捕获的子字符串、整个子字符串匹配项或 `null`。`split()` 方法将在设置某些标志并规范化正则表达式后，返回 `preg_split()`\
  \ 函数调用的结果。\n\n***Listing 2-7.*** `ArrayMethods` 类\n\n```php\nnamespace Framework\n\
  \n{\n\nclass ArrayMethods\n{\n    private function __construct()\n    {\n      \
  \  // do nothing\n    }\n\n    private function __clone()\n    {\n        // do\
  \ nothing\n    }\n\n    public static function clean($array)\n    {\n        return\
  \ array_filter($array, function($item)\n        {\n            return !empty($item);\n\
  \        });\n    }\n\n    public static function trim($array)\n    {\n        return\
  \ array_map(function($item)\n        {\n            return trim($item);\n      \
  \  }, $array);\n    }\n}\n}\n```\n\n`clean()` 方法移除所有被视为 `empty()` 的值并返回结果数组。`trim()`\
  \ 方法返回一个包含数组中所有 `empty()` 项的数组。\n\n## 元数据\n\n我们的目标之一是允许我们从类内部描述类的某些方面。如果你使用过任何编程语言，无疑熟悉注释的概念。它们的作用是帮助开发者记录笔记，这些笔记只有有访问源代码的其他开发者才能可见。注释可以编写的标准格式之一是\
  \ Doc Comments 格式。PHP 特有的 Doc Comments 变体被称为 PHPDocs。Doc Comments 类似于普通的多行注释，但以\
  \ `/**` 开头。PHP 还有内置类允许我们检查此类注释，这将允许我们提供我们所需要的配置元数据。考虑列表 2-9 所示的示例。\n\n***Listing\
  \ 2-8.*** 在狗窝里\n\n```php\nclass Dog\n{\n    public $doghouse;\n\n    public function\
  \ goSleep()\n    {\n        $location = $this->doghouse;\n        $smell = $this->smell;\n\
  \        echo \"The doghouse is {$location} and smells {$smell}.\";\n    }\n}\n\n\
  class Doghouse\n{\n    public $location;\n    public $smell;\n}\n\n$doghouse = new\
  \ Doghouse();\n$doghouse->location = \"back yard\";\n$doghouse->smell = \"bad\"\
  ;\n\n$dog = new Dog();\n$dog->doghouse = $doghouse;\n\n$dog->goSleep();\n```\n\n\
  ***Listing 2-9.*** Doc Comments 示例\n\n```php\nclass Controller\n{\n    /**\n   \
  \  * @readwrite\n     */\n    protected $_view;\n\n    /**\n     * @once\n     */\n\
  \    public function authenticate()\n    {\n        // …authenticate the current\
  \ user\n    }\n}\n```\n\n\n\n我们可能希望对类属性强制执行只读/只写/读写行为。`_view` 属性是受保护的，因此在类外部无法访问，但假设我们为类的受保护属性编写了\
  \ getter/setter。我们可以在这些 getter/setter 中读取受保护属性的文档注释（Doc Comments），并根据它们强制执行行为。\n\
  \n我们可能希望确保某个方法只执行一次。类中的其他方法可以读取文档注释，并确保如果 `authenticate()` 方法已经过调用，则不再调用它。\n\n这是两个虽小但有效的示例，说明了我们在哪些情况下需要元数据，并且可以通过文档注释提供这些元数据。我们需要编写一个类，允许我们检查这些文档注释，并返回相关的键/值对供我们在其他地方使用。\n\
  \n让我们现在在列表 2-10 中创建这个类。\n\n**Listing 2-10.** Inspector 类的内部属性/方法\n\n```php\nnamespace\
  \ Framework\n\n{\n\nuse Framework\\ArrayMethods as ArrayMethods;\n\nuse Framework\\\
  StringMethods as StringMethods;\n\nclass Inspector\n\n{\n\nprotected $_class;\n\n\
  protected $_meta = array(\n\n\"class\" => array(),\n\n\"properties\" => array(),\n\
  \n\"methods\" => array()\n\n);\n\nprotected $_properties = array();\n\nprotected\
  \ $_methods = array();\n\npublic function __construct($class)\n\n{\n\n$this->_class\
  \ = $class;\n\n}\n\nprotected function _getClassComment()\n\n{\n\n$reflection =\
  \ new \\ReflectionClass($this->_class);\nreturn $reflection->getDocComment();\n\n\
  }\n\nprotected function _getClassProperties()\n\n{\n\n$reflection = new \\ReflectionClass($this->_class);\n\
  return $reflection->getProperties();\n\n}\n\nprotected function _getClassMethods()\n\
  \n{\n\n$reflection = new \\ReflectionClass($this->_class);\nreturn $reflection->getMethods();\n\
  \n}\n\nprotected function _getPropertyComment($property)\n\n{\n\n$reflection = new\
  \ \\ReflectionProperty($this->_class, $property);\nreturn $reflection->getDocComment();\n\
  \n}\n\nprotected function _getMethodComment($method)\n\n{\n\n$reflection = new \\\
  ReflectionMethod($this->_class, $method);\nreturn $reflection->getDocComment();\n\
  \n}\n\n}\n\n}\n```\n\n`Inspector` 类的前几个方法使用内置的 PHP 反射类来获取文档注释的字符串值，并获取类的属性和方法列表。如果我们只想要字符串值，可以将\
  \ `_getClassComment()`、`_getPropertyComment()` 和 `_getMethodComment()` 方法设为公共。\n\
  \n然而，我们对这些方法有更好的用途，正如列表 2-11 所示。\n\n**Listing 2-11.** 内部 `_parse()` 方法\n\n```php\n\
  namespace Framework\n\n{\n\nuse Framework\\ArrayMethods as ArrayMethods;\n\nuse\
  \ Framework\\StringMethods as StringMethods;\n\nclass Inspector\n\n{\n\nprotected\
  \ function _parse($comment)\n\n{\n\n$meta = array();\n\n$pattern = \"(@\\[a-zA-Z\\\
  ]+\\\\s\\*\\[a-zA-Z0-9, ()\\_\\]\\*)\";\n\n$matches = StringMethods::match($comment,\
  \ $pattern);\n\nif ($matches != null)\n\n{\n\nforeach ($matches as $match)\n\n{\n\
  \n$parts = ArrayMethods::clean(\n\nArrayMethods::trim(\n\nStringMethods::split($match,\
  \ \"\\[\\s\\]\", 2)\n\n)\n\n);\n\n$meta[$parts[0]] = true;\n\nif (sizeof($parts)\
  \ > 1)\n\n{\n\n$meta[$parts[0]] = ArrayMethods::clean(\n\nArrayMethods::trim(\n\n\
  StringMethods::split($parts[1], \",\")\n\n)\n\n);\n\n}\n\n}\n\n}\n\nreturn $meta;\n\
  \n}\n\n}\n\n}\n```\n\n内部 `_parse()` 方法使用一个相当简单的正则表达式来匹配由我们的任何 `_get...Meta()` 方法返回的文档注释字符串中的键/值对。它使用\
  \ `StringMethods::match()` 方法来实现此。它遍历所有匹配项，并按键/值对其进行分割。如果没有找到值组件，它将该键的值设为 `true`。这对于诸如\
  \ `@readwrite` 或 `@once` 这样的标记键非常有用。如果找到了值组件，它会通过逗号分割该值，并将值部分的数组赋值给该键。最后，它返回键/值的关联数组。这些内部方法被列表\
  \ 2-12 所示的公共方法调用，这些公共方法将用于返回解析后的文档注释字符串数据。\n\n**Listing 2-12.** 公共方法\n\n```php\n\
  namespace Framework\n\n{\n\nuse Framework\\ArrayMethods as ArrayMethods;\n\nuse\
  \ Framework\\StringMethods as StringMethods;\n\nclass Inspector\n\n{\n\npublic function\
