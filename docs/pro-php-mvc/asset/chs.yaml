  \             \"arguments\" => \"{name}({args})\",\n                    \"handler\"\
  \ => \"\\_macro\"\n                ),\n                \"literal\" => array(\n \
  \                   \"isolated\" => false,\n                    \"arguments\" =>\
  \ null,\n                    \"handler\" => \"\\_literal\"\n                )\n\
  \            )\n        )\n    );\n\n    protected function _echo($tree, $content)\n\
  \    {\n        $raw = $this->_script($tree, $content);\n        return \"\\$_text[]\
  \ = {$raw}\";\n    }\n\n    protected function _script($tree, $content)\n    {\n\
  \        $raw = !empty($tree[\"raw\"]) ? $tree[\"raw\"] : \"\";\n        return\
  \ \"{$raw}\";\n    }\n\n    protected function _each($tree, $content)\n    {\n \
  \       $object = $tree[\"arguments\"][\"object\"];\n        $element = $tree[\"\
  arguments\"][\"element\"];\n        return $this->_loop(\n            $tree,\n \
  \           \"foreach ($object as $element => $element) {\n                {$content}\n\
  \            }\n        );\n    }\n\n    protected function _for($tree, $content)\n\
  \    {\n        $object = $tree[\"arguments\"][\"object\"];\n        $element =\
  \ $tree[\"arguments\"][\"element\"];\n        return $this->_loop(\n           \
  \ $tree,\n            \"for ($element = 0; $element < $object; $element++) {\n \
  \               {$content}\n            }\n        );\n    }\n\n    protected function\
  \ _if($tree, $content)\n    {\n        return $this->_loop(\n            $tree,\n\
  \            \"if ({$tree['arguments']}) {\n                {$content}\n       \
  \     }\n        );\n    }\n\n    protected function _elif($tree, $content)\n  \
  \  {\n        return $this->_loop(\n            $tree,\n            \"elseif ({$tree['arguments']})\
  \ {\n                {$content}\n            }\n        );\n    }\n\n    protected\
  \ function _else($tree, $content)\n    {\n        return $this->_loop(\n       \
  \     $tree,\n            \"else {\n                {$content}\n            }\n\
  \        );\n    }\n\n    protected function _macro($tree, $content)\n    {\n  \
  \      $name = $tree[\"arguments\"][\"name\"];\n        $args = $tree[\"arguments\"\
  ][\"args\"];\n        return $this->_loop(\n            $tree,\n            \"function\
  \ $name($args) {\n                {$content}\n            }\n        );\n    }\n\
  \n    protected function _literal($tree, $content)\n    {\n        return $this->_loop(\n\
  \            $tree,\n            \"{$content}\"\n        );\n    }\n}\n```\n\n####\
  \ 列表 8-17. Template 类 (Listing 8-17. Template Class)\n```php\nnamespace Framework\n\
  {\n\nuse Framework\\Template\\Implementation\\Standard as Standard;\n\nclass Template\n\
  {\n    protected $data;\n\n    public function __construct($data = [])\n    {\n\
  \        $this->data = $data;\n    }\n\n    public function render($template)\n\
  \    {\n        $parser = new Standard($this->data);\n        return $parser->parse($template);\n\
  \    }\n}\n```\n\n\n\n\n```php\n$closer = !!$matches[1];\n\n}\n\nif ($tag && $closer)\n\
  \n{\n    return array(\n        \"tag\" => $tag,\n        \"delimiter\" => $delimiter,\n\
  \        \"closer\" => true,\n        \"source\" => false,\n        \"arguments\"\
  \ => false,\n        \"isolated\" => $type[\"tags\"][$tag][\"isolated\"]\n    );\n\
  }\n\nif (isset($type[\"arguments\"]))\n{\n    $arguments = $this->_arguments($extract,\
  \ $type[\"arguments\"]);\n}\nelse if ($tag && isset($type[\"tags\"][$tag][\"arguments\"\
  ]))\n{\n    $arguments = $this->_arguments($extract, $type[\"tags\"][$tag][\"arguments\"\
  ]);\n}\n\nreturn array(\n    \"tag\" => $tag,\n    \"delimiter\" => $delimiter,\n\
  \    \"closer\" => false,\n    \"source\" => $extract,\n    \"arguments\" => $arguments,\n\
  \    \"isolated\" => (!empty($type[\"tags\"]) ? $type[\"tags\"][$tag][\"isolated\"\
  ] : false)\n);\n}\n\nprotectedprotected function _array($source)\n{\n    $parts\
  \ = array();\n    $tags = array();\n    $all = array();\n    $type = null;\n   \
  \ $delimiter = null;\n    while ($source)\n    {\n        $match = $this->_implementation->match($source);\n\
  \        $type = $match[\"type\"];\n        $delimiter = $match[\"delimiter\"];\n\
  \        $opener = strpos($source, $type[\"opener\"]);\n        $closer = strpos($source,\
  \ $type[\"closer\"]) + strlen($type[\"closer\"]);\n        if ($opener !== false)\n\
  \        {\n            $parts[] = substr($source, 0, $opener);\n            $tags[]\
  \ = substr($source, $opener, $closer - $opener);\n            $source = substr($source,\
  \ $closer);\n        }\n        else\n        {\n            $parts[] = $source;\n\
  \            $source = \"\";\n        }\n    }\n    foreach ($parts as $i => $part)\n\
  \    {\n        $all[] = $part;\n        if (isset($tags[$i]))\n        {\n    \
  \        $all[] = $tags[$i];\n        }\n    }\n    return array(\n        \"text\"\
  \ => ArrayMethods::clean($parts),\n        \"tags\" => ArrayMethods::clean($tags),\n\
  \        \"all\" => ArrayMethods::clean($all)\n    );\n}\n\nprotected function _tree($array)\n\
  {\n    $root = array(\n        \"children\" => array()\n    );\n    $current = &$root;\n\
  \    foreach ($array as $i => $node)\n    {\n        $result = $this->_tag($node);\n\
  \        if ($result)\n        {\n            $tag = isset($result[\"tag\"]) ? $result[\"\
  tag\"] : \"\";\n            $arguments = isset($result[\"arguments\"]) ? $result[\"\
  arguments\"] : \"\";\n            if ($tag)\n            {\n                if (!$result[\"\
  closer\"])\n                {\n                    $last = ArrayMethods::last($current[\"\
  children\"]);\n                    if ($result[\"isolated\"] && is_string($last))\n\
  \                    {\n                        array_pop($current[\"children\"\
  ]);\n                    }\n                    $current[\"children\"]\"] = array(\n\
  \                        \"index\" => $i,\n                        \"parent\" =>\
  \ &$current,\n                        \"children\" => array(),\n               \
  \         \"raw\" => $result[\"source\"],\n                        \"tag\" => $tag,\n\
  \                        \"arguments\" => $arguments,\n                        \"\
  delimiter\" => $result[\"delimiter\"],\n                        \"number\" => sizeof($current[\"\
  children\"])\n                    );\n                    $current = &$current[\"\
  children\"][sizeof($current[\"children\"]) - 1];\n                }\n          \
  \      else if (isset($current[\"tag\"]) && $result[\"tag\"] == $current[\"tag\"\
  ])\n                {\n                    $start = $current[\"index\"] + 1;\n \
  \                   $length = $i - $start;\n                    $current[\"source\"\
  ] = array_slice($array, $start);\n                    $current = &$current[\"parent\"\
  ];\n                }\n                else {\n                        \"index\"\
  \ => $i,\n                        \"parent\" => &$current,\n                   \
  \     \"children\" => array(),\n                        \"raw\" => $result[\"source\"\
  ],\n                        \"tag\" => $tag,\n                        \"arguments\"\
  \ => $arguments,\n                        \"delimiter\" => $result[\"delimiter\"\
  ],\n                        \"number\" => sizeof($current[\"children\"])\n     \
  \               );\n                }\n            }\n        }\n        else\n\
  \        {\n            $current[\"children\"] = $node;\n        }\n    }\n    return\
  \ $root;\n}\n\nprotected function _script($tree)\n{\n    $content = array();\n \
  \   if (is_string($tree))\n    {\n        $tree = addslashes($tree);\n        return\
  \ \"\\${tree}\";\n    }\n    if (sizeof($tree[\"children\"]) > 0)\n    {\n     \
  \   foreach ($tree[\"children\"] as $child)\n        {\n            $content[] =\
  \ $this->_script($child);\n        }\n    }\n    if (isset($tree[\"parent\"]))\n\
  \    {\n        return $this->_implementation->handle($tree, implode($content));\n\
  \    }\n    return implode($content);\n}\n\npublic function parse($template)\n{\n\
  \    if (!is_a($this->_implementation, \"Framework\\Template\\Implementation\"))\n\
  \    {\n        throw new Exception();\n    }\n    $array = $this->_array($template);\n\
  \    $tree = $this->_tree($array);\n    $this->_code = $this->_header . $this->_script($tree)\
  \ . $this->_footer;\n    $this->_function = create_function(\"\\$_data\", $this->_code);\n\
  \    return $this;\n}\n\npublic function process($data = array())\n{\n    if ($this->_function\
  \ == null)\n    {\n        throw new Exception\\Parser();\n    }\n    try\n    {\n\
  \        $function = $this->_function;\n        return $function($data);\n    }\n\
  \    catch (\\Exception $e)\n    {\n        throw new Exception\\Parser($e);\n \
  \   }\n}\n}\n```\n\nNote There are many ways to implement a template parser, and\
  \ we have chosen one that translates well into our application requirements. We\
  \ could write books on just this subject, so it is important to see that our approach\
  \ is the most feature-rich that we can.\n\nQuestions\n\n1. In this chapter, we created\
  \ separate classes for implementation and parser. Why is this preferable to a single\
  \ class?\n2. Is there a way in which we could modify the template parser to work\
  \ with variables not preceded by the $?\n3. Is it possible to implement other control\
  \ flow structures in our template dialect, such as switch statements?\n\nAnswers\n\
  \n1. This is a good path to take, as it lends the template dialect and parser open\
  \ to future extension. We could easily drop in a different dialect class and the\
  \ parser would continue to function unaffected. We actually extend the dialect in\
  \ a future chapter, so this works out nicely!\n2. All the template parser is doing\
  \ behind the scenes is string replacement. We could, theoretically, remove these\
  \ PHP relics, but it would require intelligent parsing of the arguments provided\
  \ to the control structures. We could no longer just drop these argument lists into\
  \ the parsed template as we are currently doing.\n3. It is possible. When adding\
  \ new control flow structures to this template dialect and parser, you just need\
  \ to think about how the template tags translate into executable PHP.\n\nExercises\n\
  \n1. The template dialect includes a rich set of tags to control the flow of execution\
  \ in templates. Try extending it with a switch tag.\n2. With the classes we created\
  \ in this chapter, it is now possible to parse string templates with variable data.\
  \ Try this out!\n\n\n\n\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n\
  # 第 9 章 数据库\n\n```php\n* 'points' int(11) DEFAULT NULL\n* ) ENGINE = InnoDB DEFAULT\
  \ CHARSET = utf8;\n*/\n```\n\n```php\n$database = new MySQLi(\n    \"localhost\"\
  ,\n    \"prophpmvc\",\n    \"prophpmvc\",\n    \"prophpmvc\",\n    3306\n);\n$rows\
  \ = array();\n$result = $database->query(\"SELECT first_name, last_name AS surname,\
  \ points AS discount FROM users JOIN points ON users.id = points.id WHERE first_name\
  \ = 'chris' ORDER BY last_name DESC LIMIT 100\");\nfor ($i = 0; $i < $result->num_rows;\
  \ $i++)\n{\n    $rows[] = (object) $result->fetch_array(MYSQLI_ASSOC);\n}\n```\n\
  \n这个示例包含两个部分。第一部分用于执行 SQL 语句的 PHP ，第二部分是语句本身。这是一个 PHP 和 MySQL 协作的非常基础的示例，但我们可以更进一步，正如列表\
  \ 9-2 所示。\n\n### 列表 9-2. 表现性的 SQL 生成\n\n```php\n$all = $database->query()\n    ->from(\"\
  users\", array(\n        \"name\",\n        \"surname\" => \"last_name\"\n    ))\n\
  \    ->join(\"points\", \"points.user_id = users.id\", array(\n        \"points\"\
  \ => \"rewards\"\n    ))\n    ->where(\"name = ?\", \"chris\")\n    ->order(\"last_name\"\
  , \"desc\")\n    ->limit(100)\n    ->all();\n```\n\n这段代码展示了我们所追求的流式查询创建方式。当我们完成本章时，第二个示例的作用应该与第一个示例完全相同，但读起来和理解起来简单得多。如果我们构建所需的代码足够良好，我们应该能够切换到不同的数据库引擎，而无需重写任何查询！\n\
  \n我们构建数据库代码的平台需要是健壮的——它将处理大量数据。它在大多数情况下需要易于使用，并且是安全的。与配置和缓存一样，我们将创建一个数据库工厂类，用于加载数据库驱动程序。数据库驱动程序与配置和缓存有些不同，在于它们被分为两个部分：连接器（connectors）和查询器（queries）。在我们深入研究连接器和查询器之前，让我们来看看列表\
  \ 9-3 显示的数据库工厂。\n\n### 列表 9-3. 数据库工厂类\n\n```php\nnamespace Framework\n{\n    use\
  \ Framework\\Base as Base;\n    use Framework\\Database as Database;\n    use Framework\\\
  Database\\Exception as Exception;\n\n    class Database extends Base\n    {\n  \
  \      /**\n         * @readwrite\n         */\n        protected $_type;\n\n  \
  \      /**\n         * @readwrite\n         */\n        protected $_options;\n\n\
  \        protected function _getExceptionForImplementation($method)\n        {\n\
  \            return new Exception\\Implementation(\"{$method} method not implemented\"\
  );\n        }\n\n        public function initialize()\n        {\n            if\
  \ (!$this->type)\n            {\n                throw new Exception\\Argument(\"\
  Invalid type\");\n            }\n            switch ($this->type)\n            {\n\
  \                case \"mysql\":\n                {\n                    return\
  \ new Database\\Connector\\Mysql($this->options);\n                    break;\n\
  \                }\n                default:\n                {\n              \
  \      throw new Exception\\Argument(\"Invalid type\");\n                    break;\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n我们从 `Database` 工厂类开始数据库工作。它返回一个\
  \ `Database\\Connector` 子类（在本例中为 `Database\\Connector\\Mysql`）。连接器是与特定数据库引擎进行实际交互的类。它们执行查询并返回元数据（例如最后插入的\
  \ ID 和受影响行）。\n\n查询器负责为数据库引擎生成实际指令，例如用于 INSERT、UPDATE 和 DELETE 的 SQL 查询。\n\n## 连接器\n\
  \n我们的数据库连接器不仅限于关系型数据库引擎，但由于我们涵盖这一节的空间有限，我们将只构建 MySQL 连接器/查询类。我将创建其他连接器/查询器的任务留给读者作为练习。\n\
  \n**注意**\n\n我们并不局限于与 MySQL 数据库引擎一起工作，但我们只会创建适用于 MySQL 数据库服务器的连接器/查询类。或者，你可以使用 SQL\
  \ Server 或 Postgres，但我选择使用 MySQL 是因为它免费、易于安装，并且是三者中最流行的。\n\n类似于我们的配置和缓存驱动程序扩展基础驱动类的方式，我们的连接器类将继承自列表\
  \ 9-4 所示的基础连接器类。\n\n### 列表 9-4. Database\\Connector 类\n\n```php\nnamespace Framework\\\
  Database\n{\n    use Framework\\Base as Base;\n    use Framework\\Database\\Exception\
  \ as Exception;\n\n    class Connector extends Base\n    {\n        public function\
  \ initialize()\n        {\n            return $this;\n        }\n\n        protected\
  \ function _getExceptionForImplementation($method)\n        {\n            return\
  \ new Exception\\Implementation(\"{$method} method not implemented\");\n       \
  \ }\n    }\n}\n```\n\n`Database\\Connector` 类非常简单。它只覆盖了特定厂商的变体。我们的连接器类做得更多，正如列表\
  \ 9-5 所示。\n\n### 列表 9-5. Database\\Connector\\Mysql 类\n\n```php\nnamespace Framework\\\
  Database\\Connector\n{\n    use Framework\\Database as Database;\n    use Framework\\\
  Database\\Exception as Exception;\n\n    class Mysql extends Database\n    {\n \
  \       protected $_service;\n        protected $_host;\n        protected $_username;\n\
  \        protected $_schema;\n        protected $_port = \"3306\";\n        protected\
  \ $_charset = \"utf8\";\n        protected $_isConnected = false;\n\n        //\
  \ Checks 是否连接到数据库\n        protected function _isValidService()\n        {\n   \
  \         $isEmpty = empty($this->_service);\n            $isInstance = $this->_service\
  \ instanceof \\MySQLi;\n            if ($this->_isConnected && $isInstance && !$isEmpty)\n\
  \            {\n                return true;\n            }\n            return\
  \ false;\n        }\n\n        // 连接到数据库\n        public function connect()\n  \
  \      {\n            if (!$this->_isValidService())\n            {\n          \
  \      $this->_service = new \\MySQLi(\n                    $this->_host,\n    \
  \                $this->_username,\n                    $this->_password,\n    \
  \                $this->_schema,\n                    $this->_port\n           \
  \     );\n                if ($this->_service->connect_error)\n                {\n\
  \                    throw new Exception\\Service(\"Unable to connect to service\"\
  );\n                }\n                $this->_isConnected = true;\n           \
  \ }\n            return $this;\n        }\n\n        // 从数据库断开\n        public function\
  \ disconnect()\n        {\n            if ($this->_isValidService())\n         \
  \   {\n                $this->_isConnected = false;\n                $this->_service->close();\n\
  \            }\n            return $this;\n        }\n\n        // 返回对应的查询实例\n \
  \       public function query()\n        {\n            return new Database\\Query\\\
  Mysql(array(\n                \"connector\" => $this\n            ));\n        }\n\
  \n        // 执行提供的 SQL 语句\n        public function execute($sql)\n        {\n  \
  \          if (!$this->_isValidService())\n            {\n                throw\
  \ new Exception\\Service(\"Not connected to a valid service\");\n            }\n\
  \            return $this->_service->query($sql);\n        }\n\n        // 转义提供的值以确保查询安全\n\
  \        public function escape($value)\n        {\n            if (!$this->_isValidService())\n\
  \            {\n                throw new Exception\\Service(\"Not connected to\
  \ a valid service\");\n            }\n            return $this->_service->real_escape_string($value);\n\
  \        }\n\n        // 返回最后插入行的 ID\n        public function getLastInsertId()\n\
  \        {\n            if (!$this->_isValidService())\n            {\n        \
  \        throw new Exception\\Service(\"Not connected to a valid service\");\n \
  \           }\n            return $this->_service->insert_id;\n        }\n\n   \
  \     // 返回受上次执行的 SQL 查询影响的行数\n        public function getAffectedRows()\n     \
  \   {\n        }\n    }\n}\n```\n*(注：由于原文中列表 9-5 的代码块结构不完整，在翻译时根据上下文逻辑进行了补全以确保代码完整性)*\n\
  \n\n\n\n```php\nif (!$this->_isValidService())\n{\n    throw new Exception\\Service(\"\
  未连接到有效服务\");\n}\n\nreturn $this->_service->affected_rows;\n}\n\n// 返回最后发生的错误 \n\
  public function getLastError()\n{\n    if (!$this->_isValidService())\n    {\n \
  \       throw new Exception\\Service(\"未连接到有效服务\");\n    }\n    return $this->_service->error;\n\
  }\n}\n\n} `Database\\Connector\\Mysql` 类要要复杂得多。它定义了一系列可适配的属性和方法，用于执行 `MySQLi` 类特定的函数，并返回\
  \ `MySQLi` 类特定的属性。我们希望将这些内容与外部隔离，以便我们的系统本质上是即插即用的。如果为其他数据库引擎构建了连接器，并且实现了我们在这里看到的函数，我们的系统将无法区分它们。这正是我们追求的。\n\
  \n**注意**：默认数据库引擎设置为 `InnoDB`，而不是 `MyISAM`。这两个数据库存储引擎之间存在一些差异，你在规划应用程序时需要考虑这些。你可以在这里了解更多关于\
  \ `InnoDB` 和 `MyISAM` 之间的差异：`http://en.wikipedia.org/wiki/Comparison_of_MySQL_database_engines`。我发现\
  \ `InnoDB` 通常是我想要使用的引擎，这就是为什么它设置了一个合理的默认值。\n\n因此，你会发现我们的 MySQL 连接器类虽然允许我们执行 SQL\
  \ 字符串，并为我们有关最近执行的 SQL 查询的各种有用信息，但它实际上并没有写入任何 SQL！\n\n那是 `Query` 类的工作，我们接下来将讨论。\n\
  \n## 查询 (Queries)\n\n在上一个列表中需要注意的另一个重要点是，`query()` 方法返回 `Database\\Query\\Mysql`\
  \ 类的实例。我们的大多数数据库代码将放在这个类中。`Query` 类负责编写特定厂商的数据库代码。在 MySQL 的情况下，即 `UPDATE`、`DELETE`\
  \ 和 `SELECT` 查询。它从列表 9-6 所示的代码开始，这些代码看起来应该很熟悉。\n\n### 列表 9-6. Database\\Query 类\n\
  \n```php\nnamespace Framework\\Database\n\n{\n    use Framework\\Base as Base;\n\
  \    use Framework\\ArrayMethods as ArrayMethods;\n    use Framework\\Database\\\
  Exception as Exception;\n\n    class Query extends Base\n    {\n        /**\n  \
  \       * @readwrite\n         */\n        protected $_connector;\n\n        /**\n\
  \         * @read\n         */\n        protected $_from;\n\n        /**\n     \
  \    * @read\n         */\n        protected $_fields;\n\n        /**\n        \
  \ * @read\n         */\n        protected $_limit;\n\n        /**\n         * @read\n\
  \         */\n        protected $_offset;\n\n        /**\n         * @read\n   \
  \      */\n        protected $_order;\n\n        /**\n         * @read\n       \
  \  */\n        protected $_direction;\n\n        /**\n         * @read\n       \
  \  */\n        protected $_join = array();\n\n        /**\n         * @read\n  \
  \       */\n        protected $_where = array();\n\n        protected function _getExceptionForImplementation($method)\n\
  \        {\n            return new Exception\\Implementation(\"{$method} 方法未实现\"\
  );\n        }\n    }\n}\n```\n\n在这里，我们可以看到了一些可适配的属性和异常生成方法的重写。这些属性在生成实际查询之前持有查询参数。生成数据库查询的方法使用这些属性中的数据，这就是为什么它们是被保护的，且大部分是只读的。我们不能让开发者在生成过程中随意改动它们的内容。正如我们看到的第二个示例所示，我们应该能够将\
  \ `?` 字符替换为任何类型的数据，因此我们还需要一个方法根据 MySQL 的预期来正确对输入数据进行引用。看看列表 9-7。\n\n### 列表 9-7.\
  \ _quote 方法\n\n```php\nnamespace Framework\\Database\n\n{\n    use Framework\\Base\
  \ as Base;\n    use Framework\\ArrayMethods as ArrayMethods;\n    use Framework\\\
  Database\\Exception as Exception;\n\n    class Query extends Base\n    {\n     \
  \   protected function _quote($value)\n        {\n            if (is_string($value))\n\
  \            {\n                return \"'\" . $this->connector->escape($value)\
  \ . \"'\";\n            }\n            if (is_int($value))\n            {\n    \
  \            return (int)$value;\n            }\n            if (is_float($value))\n\
  \            {\n                return (float)$value;\n            }\n         \
  \   if (is_null($value))\n            {\n                return \"NULL\";\n    \
  \        }\n            if (is_array($value))\n            {\n                $buffer\
  \ = array();\n                foreach ($value as $i)\n                {\n      \
  \              $buffer[] = $this->_quote($i);\n                }\n             \
  \   return \"(\" . implode(\", \", $buffer) . \")\";\n            }\n          \
  \  return $value;\n        }\n    }\n}\n```\n\n受保护的 `_quote()` 方法用于包裹传递的 `$value`\
  \ 以引号，使其能够符合 MySQL 的预期。我们还需要用于构建查询的便利方法，如 `from()`、`limit()` 和 `join()`，如列表 9-8\
  \ 所示。\n\n### 列表 9-8. Query 方法\n\n```php\nnamespace Framework\\Database\n\n{\n  \
  \  use Framework\\Base as Base;\n    use Framework\\ArrayMethods as ArrayMethods;\n\
  \    use Framework\\Database\\Exception as Exception;\n\n    class Query extends\
  \ Base\n    {\n        public function from($from, $fields = array())\n        {\n\
  \            if (empty($from))\n            {\n                throw new Exception(\"\
  参数无效\");\n            }\n            $this->_from = $from;\n            if ($fields)\n\
  \            {\n                $this->_fields[] = $fields;\n            }\n   \
  \         return $this;\n        }\n\n        public function join($join, $on, $fields\
  \ = array())\n        {\n            if (empty($join))\n            {\n        \
  \        throw new Exception(\"参数无效\");\n            }\n            if (empty($on))\n\
  \            {\n                throw new Exception(\"参数无效\");\n            }\n\
  \            $this->_fields[] = $fields;\n            $this->_join = \"JOIN {$join}\
  \ ON {$on}\";\n            return $this;\n        }\n\n        public function limit($limit,\
  \ $page = 1)\n        {\n            if (empty($limit))\n            {\n       \
  \         throw new Exception(\"参数无效\");\n            }\n            $this->_limit\
  \ = $limit;\n            $this->_offset = $page - 1;\n            return $this;\n\
  \        }\n\n        public function order($order, $direction = \"asc\")\n    \
  \    {\n            if (empty($order))\n            {\n                throw new\
  \ Exception(\"参数无效\");\n            }\n            $this->_order = $order;\n   \
  \         $this->_direction = $direction;\n            return $this;\n        }\n\
  \n        public function where()\n        {\n            $arguments = func_get_args();\n\
  \            if (sizeof($arguments) < 1)\n            {\n                throw new\
  \ Exception(\"参数无效\");\n            }\n            $arguments[0] = preg_replace(\"\
  #?#\", \"%s\", $arguments[0]);\n            foreach (array_slice($arguments, 1,\
  \ null, true) as $i => $parameter)\n            {\n                $arguments[$i]\
  \ = $this->_quote($arguments[$i]);\n            }\n            $this->_where[] =\
  \ call_user_func_array(\"sprintf\", $arguments);\n            return $this;\n  \
  \      }\n    }\n}\n```\n\n\n\n\n来自连接的表。稍后我们将看到的 `_buildSelect()` 方法允许 `$fields`\
  \ 参数是简单的字段名，或者是带有别名的字段名。这些方法足够智能，可以区分 `$fields = array('field1')` 和 `$fields = array('field1'\
  \ => 'alias1')` 之间的区别。\n\n`where()` 方法是这些方法中最复杂的，因为它允许变长度的参数。\n\n它将接收一个格式为‘foo =\
  \ ? and bar = ? and baz = ?’的字符串，并接受额外的三个参数来替换这些 `?` 字符。它实际上执行的操作是运行 PHP 的 `sprintf`，因此我们不需要处理任何分词；但它还会使用我们之前看到的\
  \ `_quote()` 方法对传递到第二、第三、第四（等）位置的值进行引号处理，以确保我们的数据库数据免受注入攻击。\n\n`order()` 方法用于指定按哪个字段对查询排序以及排序方向。它只处理按单个字段排序，这是另一种适应大多数情况的考虑，并且如果没有指定第二个（可选的）`$direction`\
  \ 参数，则方向默认为 `asc`。\n\n`limit()` 方法用于指定一次返回多少行，以及从哪一页开始结果。这比直接提供偏移量（offset）稍微方便一点，因为你不需要以单独的行考虑，而是按页考虑（这是\
  \ SQL `LIMIT` 语句的典型用法）。`page` 参数是可选的。\n\n所有这些方法都接受某种输入，这些输入稍后将构建 SQL 查询。\n\n它们的输入验证非常少，可能需要适当的异常消息，但我们现在不需要担心那个。这些方法命名的目的是允许流式查询创建（针对我们可能遇到的绝大多数情况）。当你能用纯语言读取查询时，编写查询要容易得多。\n\
  \n大多数关系型 SQL 查询是 `INSERT`、`UPDATE`、`DELETE` 或 `SELECT` 查询。我们将创建方法来处理这些类型的查询，从选择查询开始，如列表\
  \ 9-9 所示。\n\n***列表 9-9.*** `_buildSelect()` 方法\n\n```php\nnamespace Framework\\\
  Database\n{\n    use Framework\\Base as Base;\n    use Framework\\ArrayMethods as\
  \ ArrayMethods;\n    use Framework\\Database\\Exception as Exception;\n\n    class\
  \ Query extends Base\n    {\n        protected function _buildSelect()\n       \
  \ {\n            $fields = array();\n            $where = $order = $limit = $join\
  \ = \"\";\n            $template = \"SELECT %s FROM %s %s %s %s %s\";\n        \
  \    foreach ($this->fields as $table => $this->_fields)\n            {\n      \
  \          foreach ($this->_fields as $field => $alias)\n                {\n   \
  \                 if (is_string($field))\n                    {\n              \
  \          $fields[] = \"{$field} AS {$alias}\";\n                    }\n      \
  \              else\n                    {\n                        $fields[] =\
  \ $alias;\n                    }\n                }\n            }\n           \
  \ $fields = join(\", \", $fields);\n            $_join = $this->join;\n        \
  \    if (!empty($_join))\n            {\n                $join = join(\" \", $_join);\n\
  \            }\n            $_where = $this->where;\n            if (!empty($_where))\n\
  \            {\n                $joined = join(\" AND \", $_where);\n          \
  \      $where = \"WHERE {$joined}\";\n            }\n            $_order = $this->order;\n\
  \            if (!empty($_order))\n            {\n                $_direction =\
  \ $this->direction;\n                $order = \"ORDER BY {$_order} {$_direction}\"\
  ;\n            }\n            $_limit = $this->limit;\n            if (!empty($_limit))\n\
  \            {\n                $_offset = $this->offset;\n                if ($_offset)\n\
  \                {\n                    $limit = \"LIMIT {$_limit}, {$_offset}\"\
  ;\n                }\n                else\n                {\n                \
  \    $limit = \"LIMIT {$_limit}\";\n                }\n            }\n         \
  \   return sprintf($template, $fields, $this->from, $join, $where, $order, $limit);\n\
  \        }\n    }\n}\n```\n\n该方法是我们的查询类的核心——特别是 `all()`、`first()` 和 `count()` 方法。它考虑了之前看到的那些保护属性中存储的所有数据，并从零开始构建兼容\
  \ MySQL 的 SQL 查询。它声明了我们的 `SELECT` 语句的模板。然后遍历所有存储的字段（来自 `from()` 和 `join()` 方法），并决定是否为它们设置别名。它通过将其连接成逗号分隔的字符串来对其进行整理。同样，它连接了\
  \ `$_join` 和 `$_where` 属性。它继续创建格式正确的 `ORDER BY` 和 `LIMIT` 子句，最后通过 `sprintf` 运行一切，生成有效的\
  \ SQL 查询。\n\n构建 `INSERT`、`UPDATE` 和 `DELETE` 查询的方法比 `_buildSelect()` 方法简单一点。看看列表\
  \ 9-10。\n\n***列表 9-10.*** `buildInsert()`、`_buildUpdate()` 和 `_buildDelete()` 方法\n\
  \n```php\nnamespace Framework\\Database\n{\n    use Framework\\Base as Base;\n \
  \   use Framework\\ArrayMethods as ArrayMethods;\n    use Framework\\Database\\\
  Exception as Exception;\n\n    class Query extends Base\n    {\n        protected\
  \ function _buildInsert($data)\n        {\n            $fields = array();\n    \
  \        $values = array();\n            $template = \"INSERT INTO '%s' ('%s') VALUES\
  \ (%s)\";\n            foreach ($data as $field => $value)\n            {\n    \
  \            $fields[] = $field;\n                $values[] = $this->_quote($value);\n\
  \            }\n            $fields = join(\", \", $fields);\n            $values\
  \ = join(\", \", $values);\n            return sprintf($template, $fields, $values);\n\
  \        }\n\n        protected function _buildUpdate($data)\n        {\n      \
  \      $parts = array();\n            $where = \"\";\n            $template = \"\
  UPDATE %s SET %s %s\";\n            foreach ($data as $field => $value)\n      \
  \      {\n                $parts[] = \"{$field} = \".$this->_quote($value);\n  \
  \          }\n            $parts = join(\", \", $parts);\n            $_where =\
  \ $this->where;\n            if (!empty($_where))\n            {\n             \
  \   $joined = join(\" \", $_where);\n                $where = \"WHERE {$joined}\"\
  ;\n            }\n            $_limit = $this->limit;\n            if (!empty($_limit))\n\
  \            {\n                $_offset = $this->offset;\n                $limit\
  \ = \"LIMIT {$_limit}, {$_offset}\";\n            }\n            else\n        \
  \    {\n                $limit = \"LIMIT {$_limit}\";\n            }\n         \
  \   return sprintf($template, $this->from, $parts, $where, $limit);\n        }\n\
  \n        protected function _buildDelete()\n        {\n            $where = \"\"\
  ;\n            $template = \"DELETE FROM %s %s %s\";\n            $_where = $this->where;\n\
  \            if (!empty($_where))\n            {\n                $joined = join(\"\
  \ \", $_where);\n                $where = \"WHERE {$joined}\";\n            }\n\
  \            $_limit = $this->limit;\n            if (!empty($_limit))\n       \
  \     {\n                $_offset = $this->offset;\n                $limit = \"\
  LIMIT {$_limit}, {$_offset}\";\n            }\n            else\n            {\n\
  \                $limit = \"LIMIT {$_limit}\";\n            }\n            return\
  \ sprintf($template, $this->from, $where, $limit);\n        }\n    }\n}\n```\n\n\
  \n\n\n\n```php\npublic function save($data)\n{\n    $isInsert = sizeof($this->_where)\
  \ == 0;\n    if ($isInsert)\n    {\n        $sql = $this->_buildInsert($data);\n\
  \    }\n    else\n    {\n        $sql = $this->_buildUpdate($data);\n    }\n   \
  \ $result = $this->_connector->execute($sql);\n    if ($result === false)\n    {\n\
  \        throw new Exception\\Sql();\n    }\n    if ($isInsert)\n    {\n       \
  \ return $this->_connector->lastInsertId;\n    }\n    return 0;\n}\n\npublic function\
  \ delete()\n{\n    $sql = $this->_buildDelete();\n    $result = $this->_connector->execute($sql);\n\
  \    if ($result === false)\n    {\n        throw new Exception\\Sql();\n    }\n\
  \    return $this->_connector->affectedRows;\n}\n}\n```\n\n129\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 9 章 ■ 数据库\n\n`save()` 方法通过检查你是否在该查询对象上调用了 `where()` 方法来确定你需要什么种类型的查询。如果你调用了，它将假设是为了指定一个行\
  \ ID（或其他特定于行的条件），并相应地调用 `_buildUpdate()` 方法。如果 INSERT/UPDATE 查询执行失败，则会抛出 `Database\\\
  Exception\\Sql` 异常。如果它们执行正确且执行了 INSERT 查询，将返回最后插入的 ID。如果执行了 UPDATE 查询，则返回 0（作为指示操作成功的手段）。\n\
  \n■ **注意** 我们没有在 `save()` 方法中返回受影响的行数或布尔值——那些会使该函数的返回值产生歧义。你可以通过在数据库连接器上调用 `getAffectedRows()`\
  \ 方法来获取 UPDATE 查询受影响的行数。\n\n`delete()` 方法简单地调用 `_buildDelete()` 方法并执行其结果。如果查询无法执行，将抛出\
  \ `Database\\Exception\\Sql` 异常；否则，返回受影响的行数。我们需要最后三个公共方法分别用于返回匹配查询的所有行、匹配查询的第一行，以及一个查询要返回的所有行计数。你可以在代码列表\
  \ 9-12 和 9-13 中看到这些演示。\n\n***Listing 9-12.*** Database\\Driver 数据访问方法\n\n```php\n\
  namespace Framework\\Database\n{\n\nuse Framework\\Base as Base;\nuse Framework\\\
  ArrayMethods as ArrayMethods;\nuse Framework\\Database\\Exception as Exception;\n\
  \nclass Query extends Base\n{\n    public function first()\n    {\n        $limit\
  \ = $this->_limit;\n        $offset = $this->_offset;\n        $this->limit(1);\n\
  \        $all = $this->all();\n        $first = ArrayMethods::first($all);\n   \
  \     if ($limit)\n        {\n            $this->_limit = $limit;\n        }\n \
  \       if ($offset)\n        {\n            $this->_offset = $offset;\n       \
  \ }\n        return $first;\n    }\n}\n```\n\n130\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 9 章 ■ 数据库\n\n```php\n    public function count()\n    {\n        $limit = $this->limit;\n\
  \        $offset = $this->offset;\n        $fields = $this->fields;\n        $this->_fields\
  \ = array($this->from = array(\"COUNT(1)\" => \"rows\")); $this->limit(1);\n   \
  \     $row = $this->first();\n        $this->_fields = $fields;\n        if ($fields)\n\
  \        {\n            $this->_fields = $fields;\n        }\n        if ($limit)\n\
  \        {\n            $this->_limit = $limit;\n        }\n        if ($offset)\n\
  \        {\n            $this->_offset = $offset;\n        }\n        return $row[\"\
  rows\"];\n    }\n}\n}\n```\n\n***Listing 9-13.*** Database\\Driver\\Mysql 数据访问方法\n\
  \n```php\nnamespace Framework\\Database\\Query\n{\n\nuse Framework\\Database as\
  \ Database;\nuse Framework\\Database\\Exception as Exception;\n\nclass Mysql extends\
  \ Database\\Query\n{\n    public function all()\n    {\n        $sql = $this->_buildSelect();\n\
  \        $result = $this->connector->execute($sql);\n        if ($result === false)\n\
  \        {\n            $error = $this->connector->lastError;\n            throw\
  \ new Exception\\Sql(\"There was an error with your SQL query: {$error}\");\n  \
  \      }\n        $rows = array();\n        for ($i = 0; $i < $result->num_rows;\
  \ $i++)\n        {\n            $rows[] = $result->fetch_array(MYSQLI_ASSOC);\n\
  \        }\n        return $rows;\n    }\n}\n}\n```\n\n131\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n第 9 章 ■ 数据库\n\n`all()` 方法负责根据所执行的 SELECT 查询返回数量数量的行。它调用 `_buildSelect()` 方法并尝试执行它。如果失败，将抛出\
  \ `Database\\Exception\\Sql` 异常。如果获取了有效结果，它将遍历这些结果并将返回的关联数组的对象表示赋值给 `$rows` 数组。\n\
  \n`first()` 和 `count()` 方法都基于 `all()` 方法。`first()` 方法修改了 `$_limit` 和 `$_offset`\
  \ 属性，以便只返回一行。这些属性随后被重置为原始值，然后返回该单行。`count()` 方法同样修改了 `$_limit` 和 `$_offset` 属性，以及\
  \ `$_fields`。我们需要最后三个公共方法分别返回匹配查询的所有行、匹配查询的第一行，以及一个查询要返回的所有行计数。你可以在代码列表 9-12 和 9-13\
  \ 中看到这些演示。\n\n一旦所有的 `database` 代码就绪，我们现在可以使用稳定的数据库库执行不同类型的查询。`Listing 9-14` 中的代码提供了一个很好的示例。\n\
  \n```php\n$database = new Database(\n    \"type\" => \"mysql\",\n    \"host\" =>\
  \ \"localhost\",\n    \"username\" => \"user\",\n    \"password\" => \"pass\",\n\
  \    \"schema\" => \"db\",\n    \"port\" => 3306\n);\n\n$database->initialize();\n\
  $all = $database->query(\"users\")\n    ->join(\"points\", \"points.id = users.id\"\
  )\n    ->where(\"first_name\", \"chris\")\n    ->order(\"last_name\", \"desc\")\n\
  \    ->limit(100)\n    ->all();\n\nprint_r($all);\n\n$id = $database->query(\"users\"\
  )\n    ->where(\"first_name\", \"Liz\")\n    ->save(array(\n        \"modified\"\
  \ => date(\"Y-m-d H:i:s\")\n    ));\n\n$affected = $database->query(\"users\")\n\
