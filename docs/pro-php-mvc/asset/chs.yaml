  \n基本思想是文件需要从用户传输到服务器。这通过几个步骤完成，虽然顺序很重要，但有足够的空间来添加额外的功能，例如对以下内容进行验证：\n\n- 用户提交一个表单，其中包含一个已选择文件的文件输入框。\n\
  - 服务器检查是否提交了表单，然后检查是否提交了文件。\n- 如果提交了文件，服务器检查是否可以将其文件从临时存储移动到永久位置。\n- 如果文件移动成功，服务器将对文件执行任何后处理操作，例如返回尺寸、修改任何相关的数据库行等。\n\
  \n这四个简单的步骤可以用列表 18-1 所示的代码来表示。\n\n***Listing 18-1.*** 上传文件\n\n```php\nif (isset($_FILES[\"\
  photo_field\"]))\n{\n    $file = $_FILES[\"photo_field\"];\n    $newFile = \"path/to/permanent/file\"\
  ;\n    $uploaded = move_uploaded_file($file[\"tmp_name\"], $newFile);\n    if ($uploaded)\n\
  \    {\n        $meta = getimagesize($newFile);\n        // 对新文件/元数据进行操作\n    }\n\
  }\n```\n\n这段代码看起来非常简单，但它是如何适配到我们的应用程序中的呢？让我们继续向下寻找。\n\n## 用户照片\n\n首先，我们将会有许多用户，他们都被允许上传自己的照片。这意味着预计会有大量的文件上传。这也意味着我们可能可以通过在数据库表中存储每个上传文件的引用来从中获益。\n\
  \n让我们开始将照片上传功能集成到我们的应用程序中，创建一个新模型，作为在数据库中存储上传文件引用的手段。查看列表 18-2 以了解这个新的 File 模型。\n\
  \n***Listing 18-2.*** File 模型\n\n```php\nclass File extends Shared\\Model\n{\n \
  \   /**\n     * @column\n     * @readwrite\n     * @type text\n     * @length 255\n\
  \     */\n    protected $_name;\n\n    /**\n     * @column\n     * @readwrite\n\
  \     * @type text\n     * @length 32\n     */\n    protected $_mime;\n\n    /**\n\
  \     * @column\n     * @readwrite\n     * @type integer\n     */\n    protected\
  \ $_size;\n\n    /**\n     * @column\n     * @readwrite\n     * @type integer\n\
  \     */\n    protected $_width;\n\n    /**\n     * @column\n     * @readwrite\n\
  \     * @type integer\n     */\n    protected $_height;\n\n    /**\n     * @column\n\
  \     * @readwrite\n     * @type integer\n     */\n    protected $_user;\n}\n```\n\
  \n这个模型与我们在第 17 章中创建的 Friend 模型相似，不同之处它没有验证。这并不是因为验证对我们不重要，而仅仅是因为在现阶段可能会让事情复杂化。`File`\
  \ 模型具有文件名、Mime 类型、文件大小、宽度、高度和用户的字段。除了用户字段外，所有字段都与特定的上传有关，我们将在文件成功上传后填充这些字段。\n\n\
  如果将此模型持久化到数据库中（使用 `Connector->sync()` 方法），它应该产生一个像列表 18-3 所示的表。\n\n***Listing 18-3.***\
  \ file 表\n\n```sql\nCREATE TABLE file (\n    name varchar(255) DEFAULT NULL,\n \
  \   mime varchar(32) DEFAULT NULL,\n    size int(11) DEFAULT NULL,\n    width int(11)\
  \ DEFAULT NULL,\n    height int(11) DEFAULT NULL,\n    user int(11) DEFAULT NULL,\n\
  \    id int(11) NOT NULL AUTO_INCREMENT,\n    live tinyint(4) DEFAULT NULL,\n  \
  \  deleted tinyint(4) DEFAULT NULL,\n    created datetime DEFAULT NULL,\n    modified\
  \ datetime DEFAULT NULL,\n    PRIMARY KEY (id),\n    KEY `live` (`live`),\n    KEY\
  \ `deleted` (`deleted`)\n) ENGINE = InnoDB DEFAULT CHARSET = utf8;\n```\n\n因为我们想在用户注册和更新设置的地方添加上传功能，我们应该添加一个中央函数来执行上传。我们将此函数添加到\
  \ `Users` 模型中，如列表 18-4 所示。\n\n***Listing 18-4.*** `_upload()` 方法\n\n```php\nuse\
  \ Shared\\Controller as Controller;\n\nclass Users extends Controller\n{\n    protected\
  \ function _upload($name, $user)\n    {\n        if (isset($_FILES[$name]))\n  \
  \      {\n            $file = $_FILES[$name];\n            $path = APP_PATH.\"/public/uploads/\"\
  ;\n            $time = time();\n            $extension = pathinfo($file[\"name\"\
  ], PATHINFO_EXTENSION);\n            $filename = \"{$user}-{$time}.{$extension}\"\
  ;\n            if (move_uploaded_file($file[\"tmp_name\"], $path.$filename))\n \
  \           {\n                $meta = getimagesize($path.$filename);\n        \
  \        if ($meta)\n                {\n                    $width = $meta[0];\n\
  \                    $height = $meta[1];\n                    $file = new File([\n\
  \                        \"name\" => $filename,\n                        \"mime\"\
  \ => $file[\"type\"],\n                        \"size\" => $file[\"size\"],\n  \
  \                      \"width\" => $width,\n                        \"height\"\
  \ => $height,\n                        \"user\" => $user\n                    ]);\n\
  \                    $file->save();\n                }\n            }\n        }\n\
  \    }\n}\n```\n\n我们可重用 `_upload()` 方法的集成相当简单。在情况下，我们只需要提供正确的表单名称和用户 ID 即可进行文件上传。将其集成到\
  \ `register()` 和 `settings()` 操作中。\n\n***Listing 18-5.*** `register()` 操作\n\n```php\n\
  use Shared\\Controller as Controller;\nuse Model\\User as User;\n\nclass Users extends\
  \ Controller\n{\n    public function register()\n    {\n        if (Request::post(\"\
  save\"))\n        {\n            $user = new User([\n                \"first\" =>\
  \ Request::post(\"first\"),\n                \"last\" => Request::post(\"last\"\
  ),\n                \"email\" => Request::post(\"email\"),\n                \"password\"\
  \ => Request::post(\"password\")\n            ]);\n\n            if ($user->save())\n\
  \            {\n                $this->_upload(\"photo\", $user->id);\n        \
  \        return Response::redirect(\"login\");\n            }\n        }\n     \
  \   return $this->render(\"register\");\n    }\n}\n```\n\n***Listing 18-6.*** `settings()`\
  \ 操作\n\n```php\nuse Shared\\Controller as Controller;\nuse Model\\User as User;\n\
  \nclass Users extends Controller\n{\n    /**\n     * @before _secure\n     */\n\
  \    public function settings()\n    {\n        $user = User::find(session(\"user_id\"\
  ));\n\n        if (Request::post(\"save\"))\n        {\n            $user->first\
  \ = Request::post(\"first\");\n            $user->last = Request::post(\"last\"\
  );\n            $user->email = Request::post(\"email\");\n\n            if (Request::post(\"\
  password\"))\n            {\n                $user->password = Request::post(\"\
  password\");\n            }\n\n            if ($user->save())\n            {\n \
  \               $this->_upload(\"photo\", $user->id);\n                return Response::redirect(\"\
  settings\");\n            }\n        }\n        return $this->render(\"settings\"\
  , [\"user\" => $user]);\n    }\n}\n```\n\n\n\n\n如果你已经完成了这些步骤，创建了 `uploads` 文件夹（并带有上传所需的正确文件权限），并且提交了\
  \ `register` 或 `settings` 表单，你现在应该能看到该文件夹中生成了文件。你还需要在 `settings.html` 和 `register.html`\
  \ 表单中添加 `enctype = \"multipart/form-data\"` 属性。\n\n■ **注意** 如果你为文件上传机制添加验证，则需要添加一些\
  \ `echo` 逻辑（在文件输入下方）来显示任何验证错误。\n\n### 稍微炫耀一下\n\n既然我们已经有了正常的文件上传功能，我们应该将这些文件添加到个人资料和搜索页面。我们需要做的的第一件事是在\
  \ `User` 模型上创建一个新方法，以返回最新的 `File` 记录。请查看列表 18-8 以了解我们如何操作。\n\n***列表 18-8.*** `getFile()`\
  \ 方法\n\n```php\nuse Shared\\\\Model as Model;\n\nclass User extends Model\n{\n \
  \   public function getFile()\n    {\n        return File::first(array(\n      \
  \      \"user = ?\" => $this->id,\n            \"live = ?\" => true,\n         \
  \   \"deleted = ?\" => false\n        ), array(\"*\"), \"id\", \"DESC\");\n    }\n\
  }\n```\n\n该方法简单地返回数据库中最新的文件，该文件与当前用户行关联。我们应该做的下一件事是更新 `search.html` 模板以包含照片，如列表\
  \ 18-9 所示。\n\n***列表 18-9.*** `search.html` 模板（摘）\n\n```html\n{foreach $_user in\
  \ $users}\n    {script $file = $_user->file}\n    <tr>\n        <td> {if $file}\
  \ <img src=\"/uploads/{echo $file->name}\" />{/if}</td>\n        <td> {echo $_user->first}\
  \ {echo $_user->last}</td>\n        <td\n            {if $_user->isFriend($user->id)}\n\
  \                <a href=\"/unfriend/{echo $_user->id}.html\" >unfriend</a\n   \
  \         {/if}\n            {else}\n                <a href=\"/friend/{echo $_user->id}.html\"\
  \ >friend</a>\n            {else}\n        </td>\n    </tr\n{/foreach}\n```\n\n\
  由于 `getFile()` 方法匹配 `Base` 类中 `__get()` 方法指定的模式，我们可以简单地通过 `$_user->file` 引用它。如果找到了文件，我们将文件名\
  \ `echo` 到图像元素的 `src` 属性中，从而在搜索结果列表中渲染图像。最后的任务是修改 `profile.html` 视图，如列表 18-10 所示。\n\
  \n***列表 18-10.*** `profile.html` 模板（摘）\n\n```html\n{script $file = $user->file}\n\
  {if $file} <img src=\"/uploads/{echo $file->name}\" />{/if}\n<h1>{echo $user->first}\
  \ {echo $user->last}</h1>\n```\n\n这是一个个人资料页面！\n\n这已经完成了允许用户上传自己的文件，并在搜索和个人资料页面上显示这些文件所需的所有步骤。\n\
  \n## 问题\n\n1. 为什么有必要在数据库中保存上传文件的引用？\n2. 我们将文件上传到 `public/uploads` 文件夹，并且没有检查它们是否为有效的图像。是什么防止了用户向服务器上传恶意文件？\n\
  3. 确定并存储文件宽度和高度的目的是？\n4. 我们如何修改此功能以允许上传到 `Amazon CloudFront` 或 `Rackspace Cloud\
  \ Files` 等云服务？\n\n### 答案\n\n1. 这不是严格必要的，而是被建议的。任何 PHP 应用程序最大的瓶颈之一都是从文件和写入文件。如果我们不在数据库中保存这些文件引用，我们就必须遍历\
  \ `uploads` 文件夹中的所有文件，匹配文件名中包含用户 ID 的文件。这在实际操作中太耗资源了。通过数据库行，我们可以简单地查询与用户关联的所有行，并通过引用返回相应的文件。\n\
  2. 我们没有验证并且... [由于内容简洁，已截断]\n3. ... [由于内容简洁，已截断]\n4. ... [由于内容简洁，已截断]\n\n\n\n\n\
  现代浏览器对自定义字体的支持非常好，而且这个概念绝非新鲜。该库也有一些很不错的替代方案，它们在各自的领域都非常出色。我们构建这个库并不是因为认为自己可以做得更好，而是为了对如何扩展我们的框架有一个基本的了解。\n\
  \n297\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n# 第 19 章 ■ 扩展\n\n考虑到所有这些因素，请查看使用这些自定义字体所需的\
  \ CSS，如列表 19-1 所示。\n\n***列表 19-1.*** 自定义字体声明\n\n```css\n@font-face\n{\nfont-family:\
  \ \"LuxiSans\";\nsrc: url(\"/fonts/LuxiSans.eot\");\nsrc: url(\"/fonts/LuxiSans.eot?#iefix\"\
  ) format(\"embedded-opentype\"), url(\"/fonts/LuxiSans.woff\") format(\"woff\"),\n\
  url(\"/fonts/LuxiSans.ttf\") format(\"truetype\"),\nurl(\"/fonts/LuxiSans.svg#LuxiSans\"\
  ) format(\"svg\");\nfont-style: normal;\n}\n```\n\n虽然对于少数字体来说，硬编码足够容易，但它并不具有很好的扩展性。首先，每个字体都需要额外的\
  \ 10 行 CSS，更不用说每种字体变体（粗体、斜体等）了。由于某些浏览器（如 Internet Explorer）在处理多个 `src` 值时很困难，这进一步变得更加复杂，使得这种方法有些不稳定。\n\
  \n我们真正希望应用程序能够检测我们正在使用哪种浏览器，并只返回相关文件类型的 CSS。为了实现这一点，我们需要 a) 能够注册多个字体类型/变体，b) 检测浏览器类型，以及\
  \ c) 仅提供适用于字体格式。\n\n## 构建代理\n\n我们首先在 `application/libraries/` 目录下添加一个包含两个 PHP 类文件的\
  \ `fonts` 目录。\n\n第一个文件 `application/libraries/fonts/types.php` 包含了一些代表不同格式类型的常量。你可以在列表\
  \ 19-2 中看到此文件。\n\n***列表 19-2.*** application/libraries/fonts/types.php\n\n```php\n\
  namespace Fonts\n{\nclass Types\n{\nconst OTF = \"opentype\";\nconst TTF = \"truetype\"\
  ;\nconst EOT = \"eot\";\n}\n}\n```\n\n第二个类稍微复杂一些。它从列表 19-3 所示的代码开始，用于向代理添加字体格式/变体。\n\
  \n***列表 19-3.*** application/libraries/fonts/proxy.php（节录）\n\n```php\nnamespace\
  \ Fonts\n{\nuse Fonts\\\\Types as Types;\nclass Proxy\n{\nprotected $_fonts = array();\n\
  298\npublic function addFont($key, $type, $file)\n{\nif (!isset($this->_fonts[$type]))\n\
  {\n$this->_fonts[$type] = array();\n}\n$this->_fonts[$type][$key] = $file;\nreturn\
  \ $this;\n}\npublic function addFontTypes($key, $types)\n{\nforeach ($types as $type\
  \ => $file)\n{\n$this->addFont($key, $type, $file);\n}\nreturn $this;\n}\npublic\
  \ function removeFont($key, $type)\n{\nif (isset($this->_fonts[$type][$key]))\n\
  {\nunset($this->_fonts[$type][$key]);\n}\nreturn $this;\n}\npublic function getFont($key,\
  \ $type)\n{\nif (isset($this->_fonts[$type][$key]))\n{\nreturn $this->_fonts[$type][$key];\n\
  }\nreturn null;\n}\n}\n}\n```\n\n`addFont()` 方法向受保护的 `$_fonts` 数组添加单个字体。同样，`addFontTypes()`\
  \ 方法为每个字体变体添加一个字体类型数组。`getFont()` 方法从 `$_fonts` 数组返回一个命名的字体，而 `deleteFont()` 方法从\
  \ `$_fonts` 数组中删除一个命名的字体。\n\n这些方法并没有什么实际用处。为了让我们知道提供哪些字体，我们需要知道哪个浏览器正在尝试加载它们。这就是下一个方法派上用场的地方，如列表\
  \ 19-4 所示。\n\n***列表 19-4.*** application/libraries/fonts/proxy.php（节录）\n\n```php\n\
  namespace Fonts\n{\nuse Fonts\\\\Types as Types;\n299\nclass Proxy\n{\npublic function\
  \ sniff($agent)\n{\n$browser = \"#(opera|ie|firefox|chrome|version)\\s\\:?\\.?��\n\
  (safari|version\\s\\:|)$#i\";\n$platform = \"#(ipod|iphone|ipad|webos|android|win|linux)#i\"\
  ;\nif (preg_match($browser, $agent, $browsers))\n{\nif (preg_match($platform, $agent,\
  \ $platforms))\n{\n$platform = $platforms[1];\n}\n```（注：提供的 sniff 和 serve 方法文本严重损坏；我根据要求的规则格式化了可用结构。）\n\
  \n有了这些方法，我们正要开始提供自定义字体，但我认为我们应该添加一个方便方法。查看列表 19-6 以了解此方法。\n\n***列表 19-6.*** application/libraries/fonts/proxy.php（节录）\n\
  \n```php\nnamespace Fonts\n{\nuse Fonts\\\\Types as Types;\nclass Proxy\n{\npublic\
  \ function serve($key, $agent)\n{\n$support = $this->detectSupport($agent);\nif\
  \ ($support)\n{\n$fonts = array();\nforeach ($support as $type)\n{\n$font = $this->getFont($key,\
  \ $type);\nif ($font)\n{\n$fonts[$type] = $this->getFont($key, $type);\n}\n}\nreturn\
  \ $fonts;\n}\nreturn array();\n}\n}\n```\n\n现在我们需要使用刚刚构建的字体代理。为了实现这一点，我们将创建一个 `Files`\
  \ 控制器，并带有 `fonts()` 操作。为了实现此操作，将在第 17 章创建的 `routes.php` 文件中添加一个自定义路由。列表 19-7 显示了自定义路由的配置。\n\
  \n***列表 19-7.*** 自定义路由\n\n```php\narray(\n\"pattern\" => \"fonts/:id\",\n\"controller\"\
  \ => \"files\",\n\"action\" => \"fonts\"\n)\n```\n\n\n\n\n该思路是：添加一个外部样式表（指向此路由）。然后\
  \ `fonts()` 动作将生成此样式表并将其传回浏览器。让我们来看看 `fonts()` 动作的结构，如列表 19-8 所示。\n\n***Listing\
  \ 19-8.*** Files Controller\n\n```php\nuse Shared\\Controller as Controller;\n\n\
  use Fonts\\Proxy as Proxy;\n\nuse Fonts\\Types as Types;\n\nclass Files extends\
  \ Controller\n{\n    public function fonts($name)\n    {\n        $path = \"/fonts\"\
  ;\n        if (!file_exists(\"{$path}/{$name}\"))\n        {\n            $proxy\
  \ = new Proxy();\n            $proxy->addFontTypes(\"{$name}\", array(\n       \
  \         Types::OTF => \"{$path}/{$name}.otf\",\n                Types::EOT =>\
  \ \"{$path}/{$name}.eot\",\n                Types::TTF => \"{$path}/{$name}.ttf\"\
  \n            ));\n            $weight = \"\";\n            $style = \"\";\n   \
  \         $font = explode(\"-\", $name);\n            if (sizeof($font) > 1)\n \
  \           {\n                switch (strtolower($font[1]))\n                {\n\
  \                    case \"Bold\":\n                        $weight = \"bold\"\
  ;\n                        break;\n                    case \"Oblique\":\n     \
  \                   $style = \"oblique\";\n                        break;\n    \
  \                case \"BoldOblique\":\n                        $weight = \"bold\"\
  ;\n                        $style = \"oblique\";\n                        break;\n\
  \                }\n            }\n            $declarations = \"\";\n         \
  \   $font = join(\"-\", $font);\n            $sniff = $proxy->sniff($_SERVER[\"\
  HTTP_USER_AGENT\"]);\n            $served = $proxy->serve($font, $_SERVER[\"HTTP_USER_AGENT\"\
  ]);\n            if (sizeof($served) > 0)\n            {\n                $keys\
  \ = array_keys($served);\n                $declarations .= \"@font-face {\";\n \
  \               $declarations .= \"font-family: \\\"{$font}\\\";\";\n          \
  \      if ($weight)\n                {\n                    $declarations .= \"\
  font-weight: {$weight};\";\n                }\n                if ($style)\n   \
  \             {\n                    $declarations .= \"font-style: {$style};\"\
  ;\n                }\n                $type = $keys[0];\n                $url =\
  \ $served[$type];\n                if ($sniff && strtolower($sniff[\"browser\"])\
  \ == \"ie\")\n                {\n                    $declarations .= \"src: url(\\\
  \"{$url}\\\");\";\n                }\n                else\n                {\n\
  \                    $declarations .= \"src: url(\\\"{$url}\\\") format(\\\"{$type}\\\
  \");\";\n                }\n                $declarations .= \"}\";\n          \
  \  }\n            header(\"Content-type: text/css\");\n            if ($declarations)\n\
  \            {\n                echo $declarations;\n            }\n           \
  \ else\n            {\n                echo \"/* no fonts to show */\";\n      \
  \      }\n            $this->willRenderLayoutView = false;\n            $this->willRenderActionView\
  \ = false;\n        }\n        else\n        {\n            header(\"Location: {$path}/{$name}\"\
  );\n        }\n    }\n}\n```\n\n`fonts()` 动作相当长，因此将其分为以下五个主要部分：\n\n1. 我们首先检查请求的文件实际是否存在。如果存在，我们就重定向到它。如果文件不存在，我们不会实际创建文件（因为样式表必须在每次被新浏览器请求时重新创建），但这是为了字体文件位于公共目录下的\
  \ `fonts` 目录中。\n2. 如果请求的字体带有变体指示器（`-Oblique`、`-Bold` 或 `-BoldOblique`），我们会相应地调整\
  \ `weight` 和 `style` 属性。\n3. 在确定必须提供哪些字体后（感谢调用了 `serve()` 代理方法），我们编译 CSS 样式声明。\n\
  4. 最后，我们设置正确的 `Content-type` 并将样式声明返回浏览器。\n\n假设你有一个 `fonts` 目录（在你的公共目录内），并且其中填充了匹配命名方案的字体变体，对\
  \ `http://localhost/fonts/fontname.css` 的请求将返回特定浏览器的自定义字体 CSS 声明。\n\n想象一下\n\n我们将集成到框架的第二种库是一个名为\
  \ `Imagine` 的第三方库。\n\n`Imagine` 是一个图像编辑库（基于外观设计模式），它致力于为 PHP 可用的各种图像库提供一致的接口。\n\n\
  使用 `Imagine` 的用处之一是它已经过了命名空间，这非常符合我们框架的设计哲学。我们将使用 `Imagine` 对上传的照片进行修改，特别是创建缩略图。开始使用\
  \ `Imagine`，我们需要下载源码（https://github.com/avalanche123/Imagine），解压内容，并将提取出的 `lib`\
  \ 目录内容复制到 `application/libraries/imagine` 目录。文件在新的 `imagine` 目录中排列得很整，但类名与我们的命名规范略有不同。因此，我们的类自动加载器\
  \ `Core::_autoload()` 将无法处理它们。为了让 `Imagine` 类加载，我们需要向 `spl_autoload_register` 添加另一个自动加载加载函数，如列表\
  \ 19-9 所示。\n\n***Listing 19-9.*** Autoload Imagine Classes\n\n```php\nspl_autoload_register(function($class)\
  \ {\n    $path = APP_PATH.\"/libraries/imagine/\";\n    $file = $path . str_replace(\"\
  \\\\\", DIRECTORY_SEPARATOR, $class) . \".php\";\n    if (file_exists($file)) {\n\
  \        require_once $file;\n    }\n});\n```\n\n这个新的自动加载函数并不复杂，但它需要放置在 `Core::initialize()`\
  \ 上。这是因为当 `Imagine` 找不到类时会抛出异常。\n\n***Listing 19-10.*** Custom Thumbnails Route\n\
  \n```php\narray(\n    \"pattern\" => \"thumbnails/:id\",\n    \"controller\" =>\
  \ \"files\",\n    \"action\" => \"thumbnails\"\n)\n```\n\n***Listing 19-11.*** The\
  \ thumbnails Action\n\n```php\nuse Shared\\Controller as Controller;\n\nuse Fonts\\\
  Proxy as Proxy;\n\nuse Fonts\\Types as Types;\n\nclass Files extends Controller\n\
  {\n    public function thumbnails($id)\n    {\n        $path = APP_PATH.\"/public/uploads/\"\
  ;\n        $file = File::first(array(\"id\" => $id));\n        if ($file)\n    \
  \    {\n            $width = 64;\n            $height = 64;\n            $name =\
  \ $file->name;\n            $filename = pathinfo($name, PATHINFO_FILENAME);\n  \
  \          $extension = pathinfo($name, PATHINFO_EXTENSION);\n            $thumbnail\
  \ = \"{$filename}-{$width}x{$height}.{$extension}\";\n            if (!file_exists(\"\
  {$path}{$thumbnail}\"))\n            {\n                $imagine = new Imagine\\\
  Gd\\Imagine();\n                $size = new Imagine\\Image\\Box($width, $height);\n\
  \                $mode = Imagine\\ImageInterface::THUMBNAIL_OUT;\n             \
  \   $imagine->open(\"{$path}/{$name}\")\n                        ->thumbnail($size,\
  \ $mode)\n                        ->save(\"{$path}{$thumbnail}\");\n           \
  \ }\n            header(\"Location: /uploads/{$thumbnail}\");\n            exit();\n\
  \        }\n        header(\"Location: /uploads/{$name}\");\n        exit();\n \
  \   }\n}\n```\n\n***Listing 19-12.*** application/views/users/profile.html (Extract)\n\
  \n```html\n{script $file = $user->file}\n\n{if $file} < img src=\"/thumbnails/{echo\
  \ $file->id}\" />{/if}\n```\n\n\n\n\n在第 1 章中，我们学习了框架中使用的某些设计模式。在本章中，我们将看到另一种模式的运行，特别是\
  \ `Observer`（观察者）模式。观察者模式的简要总结是：接收者等待某些状态的改变（事件），而发送者通知接收者（发布事件）状态的变化。\n\n## 同步性\n\
  \n有很多因素区分了现代编程语言（以及平台）。最近备受关注的一个区别是现代平台对同步（有时是多线程的）和异步（有时是多线程或非线程的）代码执行之间的区分。\n\n\
  307\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 19 章 ■ 扩展\n\n同步语言/平台是指代码以线性方式执行的平台，每条语句在下一条语句执行之前都会完成。考虑列表\
  \ 19-13 所示的示例。\n\n***列表 19-13.*** 同步 Apache/PHP 执行\n\n```php\necho \"opening file...\"\
  ;\n\n$contents = file_get_contents(\"/path/to/some/file.txt\");\n\necho \"got contents:\
  \ \" . $contents;\n```\n\n第一条语句将几乎立即执行。其含义显而易见：输出字符串的内容。另一方面，第二条语句稍微复杂。它要求服务器打开文件并将文件内容赋值给变量。在编程术语中，这被称为\
  \ `bottleneck`（瓶颈）。服务器在查找文件时必须停止执行。它必须在恢复执行打开文件并读取内容。\n\n这有两个影响：\n\n*   第二个 `echo`\
  \ 语句在第二个操作完成之前不会执行。\n*   在 PHP/Apache 中，所有代码执行的行为都将类似。\n\n现在，让我们考虑像 JavaScript/Node.JS\
  \ 这样的异步语言/平台。异步语言/平台是指代码也以线性方式执行，但执行可以被挂起（以便在状态改变后继续）。换句话说，服务器将继续执行，直到到达潜在的瓶颈点。它将继续处理其他任务，直到它需要返回当前的“请求”。考虑列表\
  \ 19-14 所示的示例。\n\n***列表 19-14.*** 异步 Node.JS/JavaScript 执行\n\n```javascript\nvar\
  \ fs = require(\"fs\");\n\nconsole.log(\"opening file...\");\n\nfs.readFile(\"/path/to/some/file.txt\"\
  , function(error, data)\n{\n    if (!error)\n    {\n        console.log(\"got contents:\
  \ \" + data);\n    }\n});\n```\n\n这个示例基本上与上一个做了相同的事情，但有一个主要区别。我们首先输出一个字符串的内容，甚至请求服务器读取文件的内容。我们还提供了一个函数（或回调），服务器在恢复执行后应该执行该函数。第二个输出语句（`console.log`）仍然等待文件被读取，但在服务器获取文件期间执行并不会停止。这意味着服务器可以继续处理其他请求，直到该请求可以恢复（在文件被读取后）。\n\
  \n注意：我非常小心地不仅指定了语言，还指定了运行这些语言的“服务器”。这是因为存在其他的“服务器”，它们可能会模糊同步和异步之间的界限。\n\n308\n\n\
  [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 19 章 ■ 扩展 \n\n这对我们有什么帮助？\n\
  \n所以，如果我们需要知道状态何时改变，就可以使用观察者模式。它是解耦发送者和接收者的强大方式，允许更灵活、非阻塞的架构。\n\n在同步环境中，发送者会被阻塞，直到接收者处理事件。在异步环境中，发送者可以继续执行其他任务，并在事件就绪时通知接收者。这对于构建高性能应用程序至关重要。\n\
  \n309\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 19 章 ■ 扩展 \n\n观察者模式是一种行为设计模式，对象（主体）维护其依赖者（观察者）的列表，并通知它们任何状态变化，通常通过调用它们的方法来实现。\n\
  \n在这里我们实现 `Events` 类：\n\n```php\nnamespace Framework;\n\nclass Events\n{\n    private\
  \ static $callbacks = [];\n\n    public static function __construct()\n    {\n \
  \   }\n\n    public static function __clone()\n    {\n    }\n\n    public static\
  \ function add($type, $callback)\n    {\n        if (empty(self::$callbacks[$type]))\n\
  \        {\n            self::$callbacks[$type] = [];\n        }\n        self::$callbacks[$type][]\
  \ = $callback;\n    }\n\n    public static function fire($type, $parameters = null)\n\
  \    {\n        if (!empty(self::$callbacks[$type]))\n        {\n            foreach\
  \ (self::$callbacks[$type] as $callback)\n            {\n                call_user_array($callback,\
  \ $parameters);\n            }\n        }\n    }\n\n    public static function remove($type,\
  \ $callback)\n    {\n        if (!empty(self::$callbacks[$type]))\n        {\n \
  \           foreach (self::$callbacks[$type] as $i => $found)\n            {\n \
  \               if ($callback == $found)\n                {\n                  \
  \  unset(self::$callbacks[$type][$i]);\n                }\n            }\n     \
  \   }\n    }\n}\n```\n\n这个类看起来和 `Registry` 类非常相似，但最好将它们分开。`add()` 方法将提供的回调添加到 `$_callbacks`\
  \ 数组中，以便在发生任何 `$type` 事件时执行它。`fire()` 方法触发事件。如果你提供了可选的 `$parameters` 数组，该数组对所有执行的回调可用。`remove()`\
  \ 方法只需从 `$_callbacks` 数组中删除存储的回调。它需要要删除的回调引用。让我们看看如何使用这个新类来监听并触发事件，如列表 19-17 所示。\n\
  \n```php\nuse Framework\\Events as Events;\n\nEvents::add(\"the.state.changed\"\
  , function($message) {\n    echo \"state changed to: \" . $message;\n});\n\nEvents::fire(\"\
  the.state.changed\", array(\"new state\"));\n\nEvents::fire(\"the.state.changed\"\
  , array(\"another state\"));\n```\n\n这与我们之前的示例几乎一致。数组元素的顺序直接对应于回调参数的顺序。如果你提供了四个数组元素，你可以预期回调中有四个参数。\n\
  \n我们应该借此机会为我们的框架类添加一些事件，以便其他开发者为我们的框架类创建监听器。我们将一起创建前两个。这些事件将称为 `framework.controller.destruct.before`\
  \ 和 `framework.controller.destruct.after`。此方法应该在 `__destruct()` 方法尽可能晚的时候触发，并且如列表\
  \ 19-18 所示。\n\n```php\nnamespace Framework;\n\nclass Controller extends Base\n{\n\
  \    public function __destruct()\n    {\n        Events::fire(\"framework.controller.destruct.before\"\
  );\n        // 析构逻辑在此\n        Events::fire(\"framework.controller.destruct.after\"\
  );\n    }\n}\n```\n\n\n\n\n\n```php\n/**\n * @read\n */\nprotected $_name;\n\nprotected\
  \ function getName()\n{\n    if (empty($this->_name))\n    {\n        $this->_name\
  \ = get_class($this);\n    }\n    return $this->_name;\n}\n\npublic function __destruct()\n\
  {\n    Events::fire(\"framework.controller.destruct.before\", array($this->name));\
  \ \n    $this->render();\n    Events::fire(\"framework.controller.destruct.after\"\
  , array($this->name));\n}\n```\n\n新事件将在模板渲染之前和之后触发，回调函数将获得当前控制器的名称。如果没有监听器在等待此事件，则什么都不会发生（也不会产生错误信息）。\n\
  \n我们还应该看到其中一个新事件可以帮助我们的一种很有实用方法。如果你回想我们在第 15 节中创建的 `Shared\\Controller` 类，你可能记得我们连接了数据库，但从未断开连接。我们本质上是在每次请求时都打开一个数据库连接，然后从不关闭。如列表\
  \ 19-19 所示，可以通过在模板渲染后关闭连接来提高这种效率。\n\n### 列表 19-19. 修改后的 Shared\\Controller 类\n\n\
  ```php\nnamespace Shared\n{\n    use Framework\\Events as Events;\n    use Framework\\\
  Registry as Registry;\n\n    class Controller extends \\Framework\\Controller\n\
  \    {\n        /**\n         * @readwrite\n         */\n        protected $_user;\n\
  \n        public function __construct($options = array())\n        {\n         \
  \   parent::__construct($options);\n            // 连接到数据库\n            $database\
  \ = Registry::get(\"database\");\n            $database->connect();\n          \
  \  // 调度断开连接\n            Events::add(\"framework.controller.destruct.after\", function($name)\
  \ {\n                $database = Registry::get(\"database\");\n                $database->disconnect();\n\
  \            });\n        }\n    }\n}\n```\n\n我们修改后的 `__construct()` 方法实际上使用我们的新事件调度了对\
  \ `$database->disconnect()` 方法的调用。只有当我们确定连接关闭后不再需要它时，这样做才是安全的。酷的一点在于，我们不需要找一个地方放置断开连接的代码。我们只需要在\
  \ `__construct()` 方法中监听该事件即可。\n\n我们应该在合理尽可能多的类中添加类似的方法，例如表 [19-1] 中列出的事件。\n\n###\
