  \ 方法删除。由于社交网络完全围绕用户账户展开，因此与用户会话深度关联，所以我们将其添加到启动引导的 `index.php` 中是合合理的。\n\n## 登录\n\
  \n登录的工作原理与注册类似，都包含一个 HTML 表单和一个用于处理会话创建的特殊操作。第一步是创建登录模板，如列表 14-11 所示。\n\n***列表 14-11.***\
  \ `application/views/users/login.html`\n\n```html\n<h1>登录</h1>\n<form method=\"\
  post\">\n    <ol>\n        <li>\n            <label>\n                邮箱：\n    \
  \            <input type=\"text\" name=\"email\" />\n                {if isset($email_error)}\n\
  \                    {echo $email_error}\n                {/if}\n            </label>\n\
  \        </li>\n        <li>\n            <label>\n                密码：\n       \
  \         <input type=\"password\" name=\"password\" />\n                {if isset($password_error)}\n\
  \                    {echo $password_error}\n                {/if}\n           \
  \ </label>\n        </li>\n        <li>\n            <input type=\"submit\" name=\"\
  login\" value=\"login\" />\n        </li>\n    </ol>\n</form>\n```\n\n登录表单非常直接。它只有两个字段：邮箱地址和密码，我们将在\
  \ `Users->login()` 操作中使用这些字段，如列表 14-12 所示。\n\n***列表 14-12.*** `Users->login()` 操作\n\
  \n```php\npublic function login()\n{\n    if (RequestMethods::post(\"login\"))\n\
  \    {\n        $email = RequestMethods::post(\"email\");\n        $password = RequestMethods::post(\"\
  password\");\n\n        $view = $this->getActionView();\n        $error = false;\n\
  \n        if (empty($email))\n        {\n            $view->set(\"email_error\"\
  , \"Email not provided\");\n            $error = true;\n        }\n\n        if\
  \ (empty($password))\n        {\n            $view->set(\"password_error\", \"Password\
  \ not provided\");\n            $error = true;\n        }\n\n        if (!$error)\n\
  \        {\n            $user = User::first(array(\n                \"email = ?\"\
  \ => $email,\n                \"password = ?\" => $password,\n                \"\
  live = ?\" => true,\n                \"deleted = ?\" => false\n            ));\n\
  \n            if (!empty($user))\n            {\n                echo \"success!\"\
  ;\n            }\n            else\n            {\n                echo \"error!\"\
  ;\n            }\n            exit();\n        }\n    }\n}\n```\n\n`login()` 操作首先开始获取提交的表单值，并确保它们已提供。这与\
  \ `register()` 操作的处理方式相同。如果提供了字段，我们使用 `User::first()` 模型方法返回第一行匹配的数据库记录。如果根据提供的邮箱和密码字段找到了行，我们输出“success!”，否则输出“error!”。\n\
