  \ 类，我们现在只需要查看每个属性/方法上方的注释，就可以确定各种元数据！我们将在后续章节中很好地利用这一点。\n\n**注意**：你可以在 [`php.net/manual/en/book/reflection.php`](http://php.net/manual/en/book/reflection.php)\
  \ 阅读更多关于 PHP Reflection API 的信息。\n\n## 问题\n\n1. 我们的自动加载器在类名和文件夹层级之间进行转换。与使用四个 `include`/`require`\
  \ 语句相比，这对我们有什么好处？\n2. 我们建立了几个静态类，包含处理特定数据类型的实用方法。为什么这比我们在全局命名空间中创建相同的方法更好？\n3. 通过\
  \ `Inspector` 类，我们现在可以使用代码来评估特殊注释块中的信息。这在后面的章节中将给我们带来什么好处？\n\n### 答案\n\n1. 类自动加载比手动\
  \ `including`/`requiring` 类要好得多，特别是在大型系统中。这是因为我们不再需要记住要手动 `include`/`require` 哪些依赖。它也更高效，因为在需要使用之前没有任何内容被加载。\n\
  2. 全局命名空间中的内容越少越好。静态类是以面向对象（OOP）的方式处理这些方法的理想方法。\n3. 我们将能够定义并检查不同类型的标志和键值对。\n\n这可能用于非常简单的场景，例如该方法/属性是否可以从\
  \ `Router` 访问。\n\n### 练习\n\n1. 尝试为 `Inspector` 类添加一些注释，以跟踪它的工作原理。\n2. 尝试创建几个如示例所示的包含特殊注释的类。\n\
  \n# 第 3 章：基类\n\n###\n\n通过 `Inspector` 类，我们现在只需要查看每个属性/方法上方的注释，就可以确定各种元数据！我们将在后续章节中很好地利用这一点。\n\
  \n**注意**：你可以在 [`php.net/manual/en/book/reflection.php`](http://php.net/manual/en/book/reflection.php)\
  \ 阅读更多关于 PHP Reflection API 的信息。\n\n## 目标\n\n- 使用 `Inspector` 类，我们现在只需要查看每个属性/方法上方的注释，就可以确定各种元数据！我们将在后续章节中很好地利用这一点。\n\
  - 使用 `Inspector` 类，我们现在只需要查看每个属性/方法上方的注释，就可以确定各种元数据！我们将在后续章节中很好地利用这一点。\n- 使用 `Inspector`\
  \ 类，我们现在只需要查看每个属性/方法上方的注释，就可以确定各种元数据！我们将在后续章节中很好地利用这一点。\n\n### Getter 和 Setter（访问器与赋值器）\n\
  \n在本章中，我们将查看 getters/setters 是如何工作的。使用 getters/setters 的主要原因是防止外部干扰，或者至少拦截干扰。请考虑列表\
  \ 3-1 中的示例。\n\n```php\n// 列表 3-1. 公开访问\nclass Car {\n    public $color;\n    public\
  \ $model;\n}\n\n$car = new Car();\n$car->color = \"blue\";\n```\n\n在这个示例中，`Car`\
  \ 类的属性是公开访问的。\n\n###\n\nOOP 的优特性之一是类可以保护自己的数据。这通常通过将属性设置为 `private` 或 `protected`，然后提供\
  \ `public` 方法来访问或修改它们来实现。这些方法通常被称为 getters 和 setters。\n\n请考虑列表 3-2 中的示例。\n\n```php\n\
  // 列表 3-2. 应该是私有的/保护的变量\nclass Database {\n    public $instance;\n\n    public function\
  \ __construct($host, $username, $password, $schema) {\n        $this->instance =\
  \ new MySQLi($host, $username, $password, $schema);\n    }\n\n    public function\
  \ query($sql) {\n        return $this->instance->query($sql);\n    }\n}\n\n// 你应该指定与数据库匹配的用户名、密码和架构\n\
  $database = new Database(\"localhost\", \"username\", \"password\", \"schema\");\n\
  $database->instance = \"cheese\";\n$database->query(\"select * from pantry\");\n\
  ```\n\n在上面的示例中，创建 Database 实例时会打开 MySQL 连接。由于 `$instance` 属性是公开的，它可以从外部修改。它不是一个有效的数据库连接器实例；调用\
  \ `query()` 方法将抛出异常。事实上，我们通过将 `$instance` 属性设置为 \"cheese\"，导致了随后的 `query()` 方法调用抛出异常。\n\
  \n让我们看看 getters 和 setters 如何帮助我们避免这个问题，如列表 3-3 所示。\n\n```php\n// 列表 3-3. 保护敏感变量\n\
  class Database {\n    protected $_instance;\n\n    public function getInstance()\
  \ {\n        throw new Exception(\"Instance is protected\");\n    }\n\n    public\
  \ function setInstance($instance) {\n        if ($instance instanceof MySQLi) {\n\
  \            $this->_instance = $instance;\n        }\n        throw new Exception(\"\
  Instance must be of type MySQLi\");\n    }\n}\n```\n\n\n\n\n\n```php\nreturn $this->_instance->query($sql);\n\
  \n}\n\n}\n```我们的数据库连接实例现在已经受到外部干扰保护。我们的类还将提供一些关于如何处理与 `$instance` 属性交互的有用信息，这对其他开发者很有帮助。\n\
  \n正如它们的名称所示，getters/setters（get/set 方法）是获取或设置某些内容的方法。它们通常是实例方法，在允许外部访问内部变量时，被认为是最佳实践。它们通常遵循\
  \ `getProperty()/setProperty()` 模式，其中 `Property` 可以是任何名词。让我们看看带有 getters/setters\
  \ 的 `Car` 类会什么样，如列表 3-4 所示。\n\n### 列表 3-4. 简单的 Getter/Setters\n\n```php\nclass Car\n\
  {\n    protected $_color;\n    protected $_model;\n\n    public function getColor()\n\
  \    {\n        return $this->_color;\n    }\n\n    public function setColor($color)\n\
  \    {\n        $this->_color = $color;\n        return $this;\n    }\n\n    public\
  \ function getModel()\n    {\n        return $this->_model;\n    }\n\n    public\
  \ function setModel($model)\n    {\n        $this->_model = $model;\n        return\
  \ $this;\n    }\n}\n\n$car = new Car();\n$car->setColor(\"blue\");\n$car->setModel(\"\
  b-class\");\n```\n\n这里有几点需要注意。第一点是我们实际上需要自己创建 getter/setter 方法。其他一些语言会自动完成这一点，或者用少得多的代码实现，但\
  \ PHP 并没有原生的 getters/setters 支持。\n\n我们没有使用公共属性，而是将它们设置为保护的（protected/private）。目标是只允许通过\
  \ getters/setters 进行访问。`getColor()` 和 `getModel()` 方法简单返回这些保护属性的值。`setColor()` 和\
  \ `setModel()` 方法设置这些保护属性的值，并返回 `$this`。因为我们返回了 `$this`，所以我们可以对 setter 方法进行链式调用。\n\
  \n这些 getters/setters 实际上非常简单，但并没有阻止我们向它们添加额外的逻辑，例如在 setters 上进行验证，或者在 getters 上进行转换。\n\
  \n### 魔术方法 (Magic Methods)\n\nPHP 在原生 getter/setter 支持方面的缺失，通过魔术方法弥补了。正如它们的名称所示，魔术方法执行了除了普通函数/方法之外的功能。我们已经见过了两个魔术方法：`__construct()`\
  \ 和 `__destruct()`。\n\n我们将重点关注的魔术方法是 `__call()`。`__call()` 方法是一个实例方法，每当在类实例上调用未定义的方法时，它就会被调用。换句话说，如果你调用了一个没有定义的方法，类的\
  \ `__call()` 方法将会被调用。让我们看看列表 3-5 中的一个示例。\n\n### 列表 3-5. __call() 方法\n\n```php\n\
  class Car\n{\n    public function __call($name, $arguments)\n    {\n        echo\
  \ \"hello world!\";\n    }\n}\n\n$car = new Car();\n$car->hello();\n```\n\n我们没有在\
  \ `Car` 类中定义 `hello()` 方法，但当我们执行这段代码时，我们可以看到 `__call()` 方法将被运行，并输出字符串 \"hello world!\"\
  。这是因为当在 `Car` 实例上调用未定义的方法时，`__call()` 会被自动调用。\n\n我们可以利用这一点优势。如果我们预期 getters/setters\
  \ 遵循 `getProperty()/setProperty()` 的格式，我们可以创建一个 `__call()` 方法来解释我们确切想要允许访问的哪个属性，并进行相应的更改/返回正确的数据。我们具体如何做呢？看看列表\
  \ 3-6 所示的示例。\n\n### 列表 3-6. 使用 __call() 实现 Getters/Setters\n\n```php\nclass Car\n\
  {\n    protected $_color;\n    protected $_model;\n\n    public function __call($name,\
  \ $arguments)\n    {\n        $first = isset($arguments[0]) ? $arguments[0] : null;\n\
  \        switch ($name)\n        {\n            case \"getColor\":\n           \
  \     return $this->_color;\n            case \"setColor\":\n                $this->_color\
  \ = $first;\n                return $this;\n            case \"getModel\":\n   \
  \             return $this->_model;\n            case \"setModel\":\n          \
  \      $this->_model = $first;\n                return $this;\n        }\n    }\n\
  }\n\n$car = new Car();\n$car->setColor(\"blue\")->setModel(\"b-class\");\necho $car->getModel();\n\
  ```\n\n在这个示例中，我们可以注意到几点重要的事情。首先，`__call()` 方法总是带有两个属性：被调用的方法名 `$name` 以及在调用方法时给定的参数数组\
  \ `$arguments`。如果没有提供参数，该数组将是空的。\n\n然后我们必须考虑到所有将要调用的访问器方法，我们通过 `switch` 语句来实现。我们可以使用许多\
  \ `if/else` 语句，但 `switch` 对于一组预设的方法列表效果最好。你可能会注意到我们不需要使用 `break` 语句，因为 `return`\
  \ 语句将阻止后续 case 的执行。\n\n在这个示例中，getter/setter 的逻辑在不同属性之间差异很小。重用所有周围的代码，并简单地实现处理每个单独属性所需的几行代码，比为每个属性重复相同的代码体要有意义得多。\n\
  \n### 添加内省 (Adding Introspection)\n\n这种方法对于有限的非公共属性效果良好，但如果我们可以在不复用任何代码的情况下处理许多非公共属性，那不是很酷吗？我们可以通过结合我们学到的关于\
  \ `__call()` 方法的知识，以及我们之前构建的 `Inspector` 类来实现。\n\n想象一下，如果我们只需要通过在保护属性周围添加注释，就可以让\
  \ `Base` 类创建这些 getters/setters，就像列表 3-7 给出的示例那样。\n\n### 列表 3-7. 使用注释创建 Getters/Setters\n\
  \n```php\nclass Car extends Framework\\Base\n{\n    /**\n     * @readwrite\n   \
  \  */\n    protected $_color;\n\n    /**\n     * @write\n     */\n    protected\
  \ $_model;\n}\n\n$car = new Car();\n$car->setColor(\"blue\")->setModel(\"b-class\"\
  );\necho $car->getColor();\n```\n\n为了实现这种操作，我们需要确定必须读取/修改的属性名称，并根据注释中的 `@read`/`@write`\
  \ 标志确定我们是否允许读取/修改它。让我们先看看我们的 Base 类看起来什么样，如列表 3-8 所示。\n\n### 列表 3-8. Base 构造方法\n\
  \n```php\nnamespace Framework\n{\n    use Framework\\Inspector as Inspector;\n \
  \   use Framework\\ArrayMethods as ArrayMethods;\n    use Framework\\StringMethods\
  \ as StringMethods;\n    use Framework\\Core\\Exception as Exception;\n\n    class\
  \ Base\n    {\n        private $_inspector;\n\n        public function __construct($options\
  \ = array())\n        {\n            $this->_inspector = new Inspector($this);\n\
  \            if (is_array($options) || is_object($options))\n            {\n   \
  \             foreach ($options as $key => $value)\n                {\n        \
  \            $key = ucfirst($key);\n                    $method = \"set{$key}\"\
  ;\n                    $this->$method($value);\n                }\n            }\n\
  \        }\n    }\n}\n```\n\n**注意**：在 2 中，我说我们将使用自定义的异常类。你在列表 3-8 中看到的 `Framework\\\
  Core\\Exception` 类就是这样一个类。你可以自己定义这些类，它们只需要继承 PHP 已经提供的内置异常类即可。你甚至可以省略命名空间，并在后续列表中使用\
  \ `\\Exception(\"…\")`。\n\n\n\n\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \n# 第 3 章 ■ 基类\n\n## 列表 3-9. `__call()` 方法\n\n```php\nnamespace Framework\n\n{\n\
  \nuse Framework\\Inspector as Inspector;\nuse Framework\\ArrayMethods as ArrayMethods;\n\
  use Framework\\StringMethods as StringMethods;\nuse Framework\\Core\\Exception as\
  \ Exception;\n\nclass Base\n{\n    private $_inspector;\n\n    public function __construct($options\
  \ = array())\n    {\n        $this->_inspector = new Inspector($this);\n       \
  \ if (is_array($options) || is_object($options)) {\n            foreach ($options\
  \ as $key => $value) {\n                $key = ucfirst($key);\n                $method\
  \ = \"set{$key}\";\n                $this->$method($value);\n            }\n   \
  \     }\n    }\n\n    public function __call($name, $arguments)\n    {\n       \
  \ if (empty($this->_inspector)) {\n            throw new Exception(\"Call parent::__construct!\"\
  );\n        }\n        $getMatches = StringMethods::match($name, \"^get([a-zA-Z0-9]+)$\"\
  );\n        if (sizeof($getMatches) > 0) {\n            $normalized = lcfirst($getMatches[0]);\n\
  \            $property = \"{$normalized}\";\n            if (property_exists($this,\
  \ $property)) {\n                $meta = $this->_inspector->getPropertyMeta($property);\n\
  \                if (empty($meta[\"@readwrite\"]) && empty($meta[\"@read\"])) {\n\
  \                    throw $this->_getExceptionForWriteonly($normalized);\n    \
  \            }\n                if (isset($this->$property)) {\n               \
  \     return $this->$property;\n                }\n                return null;\n\
  \            }\n        }\n        $setMatches = StringMethods::match($name, \"\
  ^set([a-zA-Z0-9]+)$\");\n        if (sizeof($setMatches) > 0) {\n            $normalized\
  \ = lcfirst($setMatches[0]);\n            $property = \"{$normalized}\";\n     \
  \       if (property_exists($this, $property)) {\n                $meta = $this->_inspector->getPropertyMeta($property);\n\
  \                if (empty($meta[\"@readwrite\"]) && empty($meta[\"@write\"])) {\n\
  \                    throw $this->_getExceptionForReadonly($normalized);\n     \
  \           }\n                $this->$property = $arguments[0];\n             \
  \   return $this;\n            }\n        }\n        throw $this->_getExceptionForImplementation($name);\n\
  \    }\n}\n```\n\n我们的 `__call()` 方法包含三个基本部分：检查检查器（inspector）已设置、处理 `getProperty()`\
  \ 方法以及处理 `setProperty()` 方法。在这里，我们开始对继承 `Base` 类的通用结构做一些假设。\n\n我们并不假设 `inspector`\
  \ 属性已经设置。这在子类当前没有调用其父类 `__construct()` 方法时经常发生。在这种情况下，会给出一个相应的错误描述。我们假设任何到达我们 `__call()`\
  \ 方法的访问器方法调用，可能指的是属于子类的定义的非公有属性。我们假设它们将遵循 `setProperty()`/`getProperty()` 的格式，因此我们去掉了\
  \ get/set 部分，并在剩余字符串后添加一个下划线。\n\n这将有效地将 `setColor()`/`getColor()` 的调用转换为 `_color`。如果子类中不存在此类属性，我们将抛出一个异常。如果调用的方法是\
  \ getter（get 方法器），我们将（通过元数据）确定是否允许读取该属性。如果它具有 `@read` 或 `@readwrite` 标记，则属于这种情况。如果允许读取属性，将返回该属性的值。\n\
  \n如果调用的方法是 setter（set 方法器），我们将确定是否允许写入该属性。如果它具有 `@write` 或 `@readwrite` 标记，则属于这种情况。如果允许写入属性，则会将属性的值设置为第一个参数的值。你可能在想这些异常看起来像什么样，因为我们只是抛出了其他方法的执行结果。\n\
  \n如果我们创建了继承此 `Base` 类的类，我们就可以开始简单地使用 getters/setters，只需在我们的子类的元数据中设置 `@read`/`@write`/`@readwrite`\
  \ 标记即可。诚然，实际的 `Base` 类中包含了大量的代码，如果我们打算只使用一或两次，就没需要创建它。\n\n然而，我们将在框架的几乎每个其他类中继承 `Base`\
  \ 类，所以这是一项划得的投资！现在，我们不需要在每个需要的类中都编写自己的访问器方法，而是继承 `Base` 类，并让所有的困难工作自动完成。\n\n## 透明的\
  \ Getter/Setter\n\n在章节开头，我们对比了使用公有属性与使用 getters/setters 的区别。如果我们能像使用公有属性一样使用保护（protected）属性，同时获得使用\
  \ getters/setters 的额外数据安全性呢？我们可以做到，使用列表 3-10 所示的两个魔法方法。\n\n## 列表 3-10. `__get()`/`__set()`\
  \ 魔法方法\n\n```php\npublic function __get($name)\n{\n    $function = \"get\".ucfirst($name);\n\
  \    return $this->$function();\n}\n\npublic function __set($name, $value)\n{\n\
  \    $function = \"set\".ucfirst($name);\n    return $this->$function($value);\n\
  }\n```\n\n从表面上看，这些方法并没有做什么。`__get()` 方法接受一个代表被设置的属性名称的参数。在 `$obj->property` 的情况下，参数将是\
  \ `property`。\n\n我们的 `__get()` 方法随后将其转换为 `getProperty`，这匹配了我们在 `__call()` 方法中定义的模式。这意味着\
  \ `$obj->property` 将首先尝试设置一个同名的公有属性，然后进入 `__get()`，然后尝试调用公有方法 `setProperty()`，然后进入\
  \ `__call()`，最后设置保护的 `_property`。\n\n`__set()` 方法的工作原理类似，但它接受第二个参数，该参数定义了要设置的值。如果你查看图\
  \ 3-1 所示的图表，可能会更容易看出什么。\n\n`$obj->property = “foo”;`\n\n1. 是否存在 `public $property`？\n\
  \   - 否：将 `$property` 设置为`“foo”`, 进入 `__set(“property”, “foo”)`\n2. 是否存在 `setProperty(\"\
  foo\")`？\n   - 是：执行 `setProperty(\"foo\")`\n   - 否：进入 `__call(\"setProperty\", array(\"\
  foo\"))`\n3. 是否存在 `protected $_property`？\n   - 是：`$_property` 是否具有 `@read/@readwrite`\
  \ 标记？\n     - 否：抛出异常\n\n\n\n\n\n```php\nreturn new Exception\\ReadOnly(\"{$property}\
  \ is read-only\");\n}\n\nprotected function _getExceptionForWriteonly($property)\n\
  {\n    return new Exception\\WriteOnly(\"{$property} is write-only\");\n}\n\nprotected\
  \ function _getExceptionForProperty()\n{\n    return new Exception\\Property(\"\
  Invalid property\");\n}\n\nprotected function _getExceptionForImplementation($method)\n\
  {\n    return new Exception\\Argument(\"{$method} method not implemented\");\n}\n\
  }\n```\n\n有了这两个魔法方法，我们现在可以将受保护的方法视为公共方法，同时仍使用预定义的（或推断的）getter/setter。请考虑列表 3-12\
  \ 中的示例。\n\n### 第 3 章 ■ 基类\n\n### 列表 3-12. 使用透明的 getter/setter\n\n```php\nclass Hello\
  \ extends Framework\\Base\n{\n    /*\n     * @readwrite\n     */\n    protected\
  \ $_world;\n\n    public function setWorld($value)\n    {\n        echo \"your setter\
  \ is being called!\";\n        $this->_world = $value;\n    }\n\n    public function\
  \ getWorld()\n    {\n        echo \"your getter is being called!\";\n        return\
  \ $this->_world;\n    }\n}\n\n$hello = new Hello();\n$hello->world = \"foo!\";\n\
  echo $hello->world;\n```\n\n令人惊讶的是，这个示例不仅产生了预期的 `foo`，还产生了在 getter/setter 重写中定义的额外字符串。我们不需要定义\
  \ getter/setter（就像在这个示例中做的那样），因为我们的 `__call()` 方法已经处理了它们。这真是两得兼全！\n\n## 问题\n\n1.\
  \ 既然 PHP 甚至不支持 getter 和 setter，那么在我们的类中使用它们有什么何好处呢？\n2. 当我们把 `Inspector` 实例添加到 `Base`\
  \ 类时，我们将其存储在一个私有变量中。为什么这很重要？\n3. 我们在 `Base` 类中定义了几个受保护的方法，它们的唯一目的是返回一个 `Exception`\
  \ 子类的实例。为什么我们不能直接在 `__call()` 方法中处理这些 `Exception` 子类呢？\n\n### 答案\n\n1. 使用 getter/setter\
  \ 的主要好处是存储在我们的 `Base` 子类中的受保护值不会被篡改。当然，`getProperty()` 和 `setProperty()` 可以被调用，并且根据我们定义的代码它们不会被禁止，但我们所做的是提供一个构建的良好基础。应该限制对其受保护属性访问的类可以这样做，并且通过这段代码，简单的\
  \ getter/setter 将继续像以前一样工作。\n2.  own 这个 `Inspector` 实例将仅用于确定哪些属性应该具有模拟的 getter/setter。它实际上留在那里并供子类访问可能会产生更大的危害，因此我们通过将其赋值给私有属性来向子类隐藏它。\n\
  3. 如果我们直接处理异常而不引用这些受保护的方法，那么子类将无法在不自己重写 `__call()` 方法的情况下定义自己的异常类型。这一步是为了让子类能够轻松地定义自己的\
  \ `Exception` 子类。\n\n### 练习\n\n1. 我们的 `Base` 类仅对带有 `@read`/`@write`/`@readwrite`\
  \ 元标记的属性模拟 getter 和 setter。它没有提供任何属性验证，这意味着开发者可以在没有任何警告的情况下将属性设置为 `null`。尝试添加另一个元标记来防止（或警告）这种操作。\n\
  2. 不要定义返回子类实例的方法，尝试用另一种方式指定 `Exception` 子类。也许你可以使用字符串数组，或者一个允许相同灵活性的 `switch` 语句。\n\
  \n# 第 4 章：配置\n\n我们的目标之一是创建一个易于配置的框架，同时假设一些基本情况，以便于快速开发和灵活更改。由此可见，我们需要一个标准的格式来存储配置变量，并一种方法来获取它们。关于这个主题有许多方法，在本章中，我们将查看两种流行的方法。\n\
  \n## 目标\n\n- 我们需要审查不同的配置方法，并为我们的框架/应用程序决定最佳用法。\n- 我们需要构建一组类，可以使用这些类来解析配置文件，并提供一组清晰的配置选项。\n\
  \n### 关联数组\n\n关联数组提供了最简单的配置手段。对于任何 PHP 开发者来说它们都很理解，对于我们的框架来说解析也更简单。列表 4-1 显示了一个数据库设置文件示例，列表\
  \ 4-2 展示了如何解析它。\n\n### 列表 4-1. 数据库设置文件示例\n\n```php\n<?php\nreturn [\n    'driver'\
  \ => 'mysql',\n    'host' => 'localhost',\n    'user' => 'root',\n    'password'\
  \ => 'password',\n    'database' => 'test',\n];\n```\n\n### 列表 4-2. 如何解析关联数组\n\n\
  ```php\n<?php\nfunction loadConfig($path)\n{\n    return include($path);\n}\n\n\
  $config = loadConfig('config.php');\nprint_r($config);\n```\n\n### 列表 4-3. 关联数组的输出结果\n\
  \n```text\nArray\n(\n    [driver] => mysql\n    [host] => localhost\n    [user]\
  \ => root\n    [password] => password\n    [database] => test\n)\n```\n\n正如我们看到的，这种配置方法易于解析和更改。如果这听起来好得不可相信，那是因为确实如此。有许多理由说明我们应该寻找解决方案：\n\
  \n- 我们只能使用一维配置数组。这是由于我们的 `parsePhp()` 函数需要预定义 `$settings` 以便配置文件有数组可以存储数据。\n- 它需要的代码更多。我们真正感兴趣的是键和值，而不是周围的\
  \ PHP 语法。\n\n**注意**：CakePHP 和 CodeIgniter 大部分使用关联数组。\n\n### INI 文件\n\nINI（初始化）文件格式是\
  \ Windows 操作系统配置文件的标准格式。它易于更改，且相对容易解析。幸运的是，PHP 还附带了一个实用的 `parse_ini_file()` 函数，这将极大简化我们设置解析器的创建。我们应该尝试创建一个允许我们使用点表示法处理键/值的解析器。列表\
  \ 4-4 显示了一个 INI 文件示例。\n\n### 列表 4-4. INI 文件示例\n\n```ini\n[database]\ndriver = mysql\n\
  host = localhost\nuser = root\npassword = password\nname = test\nport = 3306\ncharset\
  \ = utf8\n```\n\n**注意**：INI 配置文件的处理方式与 PHP 文件不同，至少在 Apache 中不是这样。如果用户尝试访问 INI 文件，它可能不会被修改，但用户可能会访问用户名和密码等敏感配置。你应该始终采取措施拒绝访问这些文件，最好将它们存储在\
  \ Web 可访问目录之外。\n\n我们的配置类将是我们创建的第一个工厂类。我们希望将来能够扩展它以引入许多不同的配置可能性，但（考虑到我们的目标）我们只会创建一个驱动。让我们先看看这个工厂类，如列表\
  \ 4-5 所示。\n\n\n\n\n\n## 列表 4-5. 配置工厂类\n\n```php\nnamespace Framework\n\n{\n\nuse\
  \ Framework\\Base as Base;\n\nuse Framework\\Configuration as Configuration;\n\n\
  use Framework\\Configuration\\Exception as Exception;\n\nclass Configuration extends\
  \ Base\n{\n    /**\n     * @readwrite\n     */\n    protected $_type;\n\n    /**\n\
  \     * @readwrite\n     */\n    protected $_options;\n\n    protected function\
  \ _getExceptionForImplementation($method)\n    {\n        return new Exception\\\
  Implementation(\"{$method} method not implemented\");\n    }\n\n    public function\
  \ initialize()\n    {\n        if (!$this->type)\n        {\n            throw new\
  \ Exception\\Argument(\"Invalid type\");\n        }\n        switch ($this->type)\n\
  \        {\n            case \"ini\":\n            {\n                return new\
  \ Configuration\\Driver\\Ini($this->options);\n                break;\n        \
  \    }\n            default:\n            {\n                throw new Exception\\\
  Argument(\"Invalid type\");\n                break;\n            }\n        }\n\
  \    }\n}\n}\n```\n\n`Configuration` 工厂类也是我们第一次使用通过 `Base` 类创建的访问/设置方法（getters/setters）。`$_type`\
  \ 和 `$_options` 都可以被读取和写入。如果你参考 `Base \\construct()()` 方法，你会发现它接收第一个参数中提供的键值对，并设置它能找到任何受保护属性。如果你的初始化数组中有一个\
  \ `options` 键，那么受保护的 `$_options` 属性将包含该值。\n\n我们首先检查 `$_type` 属性值是否为空，因为如果我们不知道如何确定所需的类，那么尝试创建类实例就是没有意义的。接下来，我们使用\
  \ `switch` 语句和 `$this->type` 的返回值来选择并实例化正确的类类型。\n\n由于我们（目前）只支持 `\"ini\"` 类型，因此如果所需的类型不是\
  \ `\"ini\"`，我们将抛出 `ConfigurationExceptionArgument`。如果所需的类型是 `\"ini\"`，我们将返回一个新实例，并将传递给\
  \ `Configuration \\construct()()` 方法的选项传递该实例。如列表 4-6 所示，`Configuration` 类使用起来非常简单。\n\
  \n## 列表 4-6. 使用工厂创建配置对象\n\n```php\n$configuration = new Framework\\Configuration(array(\n\
  \    \"type\" => \"ini\"\n));\n\n$configuration = $configuration->initialize();\n\
  ```\n\n因为我们的工厂允许使用许多不同类型的配置驱动类，我们需要一种方法在所有驱动类之间共享代码。我们通过让这些驱动类继承此基础驱动类来实现这一点，如列表\
  \ 4-7 所示。\n\n# 列表 4-7. Configuration\\Driver 类\n\n```php\nnamespace Framework\\\
  Configuration\n\n{\n\nuse Framework\\Base as Base;\n\nuse Framework\\Configuration\\\
  Exception as Exception;\n\nclass Driver extends Base\n{\n    protected $_parsed\
  \ = array();\n\n    public function initialize()\n    {\n        return $this;\n\
  \    }\n\n    protected function _getExceptionForImplementation($method)\n    {\n\
  \        return new Exception\\Implementation(\"{$method} method not implemented\"\
  );\n    }\n}\n}\n```\n\n我们可以使用接口（Interface）定义来强制执行驱动行为，使其更加技术化，但目前我们已经对尚未实现的方法调用抛出了详细的实现异常，这已经足够了。解析我们的配置文件有两种基本方法，在列表\
  \ 4-8 和 4-9 中所示。\n\n## 列表 4-8. ArrayMethods::toObject() 方法\n\n```php\nnamespace\
  \ Framework\n\n{\n\nclass ArrayMethods\n{\n    private function __construct()\n\
  \    {\n        // do nothing\n    }\n\n    private function __clone()\n    {\n\
  \        // do nothing\n    }\n\n    public static function toObject($array)\n \
  \   {\n        $result = new \\stdClass();\n        foreach ($array as $key => $value)\n\
  \        {\n            if (is_array($value))\n            {\n                $result->{$key}\
  \ = self::toObject($value);\n            }\n            else\n            {\n  \
  \              $result->{$key} = $value;\n            }\n        }\n        return\
  \ $result;\n    }\n}\n}\n```\n\n# 列表 4-9. Configuration\\Driver\\Ini parse() 方法\n\
  \n```php\nnamespace Framework\\Configuration\\Driver\n\n{\n\nuse Framework\\ArrayMethods\
  \ as ArrayMethods;\n\nuse Framework\\Configuration as Configuration;\n\nuse Framework\\\
  Configuration\\Exception as Exception;\n\nclass Ini extends Configuration\\Driver\n\
  {\n    public function parse($path)\n    {\n        if (empty($path))\n        {\n\
  \            throw new Exception\\Argument(\"$path argument is not valid\");\n \
  \       }\n        if (!isset($this->_parsed[$path]))\n        {\n            $config\
  \ = array();\n            ob_start();\n            include(\"{$path}.ini\");\n \
  \           $string = ob_get_contents();\n            ob_end_clean();\n        \
  \    $pairs = parse_ini_string($string);\n            if ($pairs == false)\n   \
  \         {\n                throw new Exception\\Syntax(\"Could not parse configuration\
  \ file\");\n            }\n            foreach ($pairs as $key => $value)\n    \
  \        {\n                $config = $this->_pair($config, $key, $value);\n   \
  \         }\n            $this->_parsed[$path] = ArrayMethods::toObject($config);\n\
  \        }\n        return $this->_parsed[$path];\n    }\n}\n}\n```\n\n我们的 INI 配置解析类中唯一的公共方法是名为\
  \ `parse()` 的方法。它首先检查 `$path` 参数是否为空，如果是则抛出 `ExceptionArgument`。接下来，它检查 `$path`\
  \ 是否已经解析过，使用输出缓冲区来捕获配置文件的内容。如果没有解析，它将使用 PHP 的 `parse_ini_string()` 方法，该方法返回一个包含键和值的关联数组，或者返回\
  \ false（如果是后者我们会抛出一个 `ExceptionSyntax`）。如果它确实返回了关联数组，我们将遍历该数组，使用 `_pair()` 方法，最后使用\
  \ `ArrayMethods::toObject()` 将关联数组转换为对象并缓存配置数据。\n\n## 列表 4-10. _pair() 方法\n\n```php\n\
  namespace Framework\\Configuration\\Driver\n\n{\n\nuse Framework\\ArrayMethods as\
  \ ArrayMethods;\n\nuse Framework\\Configuration as Configuration;\n\nuse Framework\\\
  Configuration\\Exception as Exception;\n\nclass Ini extends Configuration\\Driver\n\
  {\n    protected function _pair($config, $key, $value)\n    {\n        if (strstr($key,\
  \ \".\"))\n        {\n            $parts = explode(\".\", $key, 2);\n          \
  \  if (empty($config[$parts[0]]))\n            {\n                $config[$parts[0]]\
  \ = array();\n            }\n            $config[$parts[0]] = $this->_pair($config[$parts[0]],\
  \ $parts[1], $value);\n        }\n        else\n        {\n            $config[$key]\
  \ = $value;\n        }\n        return $config;\n    }\n}\n}\n```\n\n`_pair()` 方法将配置文件键中的点表示法（dot\
  \ notation）分解为关联数组层次。如果变量 `$key` 包含点字符（`.`），则第一部分将被切分，创建一个新数组，并赋值为另一个 `_pair()`\
  \ 返回值。这初看起来很复杂，但运行良好且符合逻辑。\n\n\n\n\n\n```php\nif (empty($path))\n{\n    throw new\
  \ Exception\\\\Argument(\"\\\\$path argument is not valid\");\n}\n\nif (!isset($this->_parsed[$path]))\n\
  {\n    $config = array();\n    ob_start();\n    include(\"{$path}.ini\");\n    $string\
  \ = ob_get_contents();\n    ob_end_clean();\n    $pairs = parse_ini_string($string);\n\
  \    if ($pairs == false)\n    {\n        throw new Exception\\\\Syntax(\"Could\
  \ not parse configuration file\");\n    }\n    foreach ($pairs as $key => $value)\n\
  \    {\n        $config = $this->_pair($config, $key, $value);\n    }\n    $this->_parsed[$path]\
  \ = ArrayMethods::toObject($config);\n}\n\nreturn $this->_parsed[$path];\n}\n```\n\
  \n配置数据看起来与我们使用关联数组获取的略有不同，但这种新格式实际上更有条理且更容易使用。我们不需要将所有内容都保持在一个大数组中。通过对象符号，我们可以用更少的代码访问值。如列表\
  \ 4-12 所示，配置文件的创建和维护也更加简单。\n\n**列表 4-12.** `parse()` 方法的结果，带有我们之前的 INI 配置文件的 stdClass\
  \ 对象。\n\n```\n(\n    [database] => stdClass Object\n    (\n        [default] =>\
  \ stdClass Object\n        (\n            [type] => mysql\n            [host] =>\
  \ localhost\n            [username] => username\n            [password] => password\n\
  \            [port] => 3306\n            [schema] => prophpmvc\n        )\n    )\n\
  )\n```\n\n**注意** Zend Framework 包含了许多配置文件格式解析器，但我最喜欢的是它们的 INI 文件解析器。\n\n你构建的解析器应该反映你框架的需求。尽管关联数组有缺点，但如果它们最符合逻辑，那么你可以尽管使用它们。在本书的剩余部分，我们将充分利用这里提供的\
  \ INI 解析代码，因此如果你选择使用关联数组（或任何其他类型的解析器），你需要相应地调整你的代码。\n\n现在我们有了一个简单且可重用的配置系统，可以开始将各种设置加载到我们的应用程序中，这将提供很大的灵活性。\n\
  \n## 问题\n\n1. 如果关联数组更容易创建和解析，我们为什么不使用它们来配置我们的框架呢？\n2. 工厂类看起来比普通类要费力得多。既然我们完全可以使用普通类来处理这类事情，为什么还要使用它们呢？\n\
  \n### 答案\n\n1. 使用关联数组进行配置可能有利处，但也有缺点。关联数组对非 PHP 程序员并不友好。它们还要求配置文件不能有语法错误，而这对于 INI\
  \ 配置文件并不是强制要求的。\n2. 创建工厂类的处处是可以方便地添加和更换驱动程序。我们可以添加另外五个配置解析器，它们的调用方式将与我们的 INI 配置解析器非常相似。\n\
  \n### 练习\n\n1. 尝试创建一个用于解析关联数组的配置驱动程序。在发生语法错误时，它应该正确抛出异常。\n2. 尝试其他配置方法。例如，你可以尝试创建匹配的配置驱动程序，进一步扩展框架的配置库。\n\
  \n# 第 5 章：缓存\n\n通常，在处理大量数据时，我们会遇到性能瓶颈。这些瓶颈可能由于任何原因引起，但大多数可以通过良好的`缓存`来避免。如果你好奇我说的`缓存`\
  \ 是什么意思，我们稍后会看一个例子。\n\n## 目标\n\n* 我们首先应该识别使用缓存的需求。除非我们理解缓存所解决的问题，否则我们无法发挥缓存的全部潜力。\n\
  * 我们需要学习如何访问 `Memcached` 服务器，我们将用它来存储缓存数据。这要求我们编写与 Memcached 服务器交互的类。\n\n## 性能瓶颈\n\
  \n想象一个社交网络，任何用户都可以有多个朋友。如果在网页上显示这些朋友的列表并带上他们所有的相关细节，该页面就必须进行数据库调用以从数据库中检索朋友记录。现在想象一下这个朋友列表显示在网站的每一个页面上。\n\
  \n现在我们说的是网站的每个页面至少对应一次数据库查询。考虑到成千上万个用户也要显示他们的朋友列表，你得到的是海量的数据。\n\n在任何增长或需求超过资源的应用程序中，这种数据需求都能轻易让应用程序瘫痪。那么，我们如何利用缓存来减轻数据库的压力呢？\n\
  \n我们可以在第一次从数据库获取朋友列表时轻松地将其缓存。这意味着网站将不需要对相同数据频繁、重复的请求。我们不再在每次需要时都从数据库获取相同的数据，而是先检查数据是否存储在缓存中。\n\
  \n考虑我们在第 4 章中创建的配置类。如果我们一直需要使用配置设置，那么将它们缓存起来也是合理的。另一种方案是为网站的每个页面、为网站的每个用户加载同一个配置文件。\n\
  \n如果我们只加载一次配置数据，将其存储在缓存中，并在后续请求中从缓存获取配置数据，我们将节省时间。\n\n**注意** 缓存的使用不仅限于存储数据库和配置数据。那些仅仅是我用来说明缓存有效性所举的例子。\n\
  \n## 代码\n\n如果我们的目标是构建一个运行快速的框架，缓存是不可避免的。我们需要一种持久存储缓存数据的东西，我们选择的缓存提供是 Memcached。它将数据存储在内存哈希表中，因此无需从磁盘快速读取。\n\
  \n**注意** Memcached 不是我们可以使用的唯一缓存选项，但它是你在书中看到的唯一一个。让我们从创建缓存工厂类开始，如列表 5-1 所示。\n\n\
  **列表 5-1.** 缓存工厂类\n\n```php\nnamespace Framework\n\n{\n\n    use Framework\\\\Base\
  \ as Base;\n    use Framework\\\\Cache as Cache;\n    use Framework\\\\Cache\\\\\
  Exception as Exception;\n\n    class Cache extends Base\n    {\n        /**\n  \
  \       * @readwrite\n         */\n        protected \\_type;\n\n        /**\n \
  \        * @readwrite\n         */\n        protected \\_options;\n\n        protected\
  \ function \\getExceptionForImplementation($method)\n        {\n            return\
  \ new Exception\\\\Implementation(\"{$method} method not implemented\");\n     \
  \   }\n\n        public function initialize()\n        {\n            if (!$this-\
  \ > type)\n            {\n                throw new Exception\\\\Argument(\"Invalid\
  \ type\");\n            }\n\n            switch ($this- > type)\n            {\n\
  \                case \"memcached\":\n                {\n                    return\
  \ new Cache\\\\Driver\\\\Memcached($this- > options);\n                    break;\n\
  \                }\n                default:\n                {\n              \
  \      throw new Exception\\\\Argument(\"Invalid type\");\n                    break;\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n我们的缓存工厂类与我们的配置工厂类非常相似。它以相同的方式接收初始化选项，并根据内部的\
  \ `_type` 属性选择返回对象的类型。\n\n对于无效或不支持的类型，它会抛出 `Cache\\\\Exception\\\\Argument` 异常。正如我们处理配置一样，我们将基于标准的驱动程序类创建缓存驱动程序类，如列表\
  \ 5-2 所示。\n\n\n\n\n\n##  5-2. Cache\\Driver 类\n\n```php\nnamespace Framework\\Cache\n\
  \n{\n\nuse Framework\\Base as Base;\n\nuse Framework\\Cache\\Exception as Exception;\n\
  \nclass Driver extends Base\n{\n    public function initialize()\n    {\n      \
  \  return $this;\n    }\n\n    protected function _getExceptionForImplementation($method)\n\
  \    {\n        return new Exception\\Implementation(\"{$method} method not implemented\"\
  );\n    }\n}\n\n}\n```\n\n`Cache\\Driver` 类比 `Configuration\\Driver` 类更加简单。它只重写了\
  \ `Base` 中生成异常的方法，以便为在 `Cache\\Driver` 子类中发生的错误提供特定的 `Exception` 子类。\n\n为了能够与 Memcached\
  \ 服务器成功交互，我们的缓存驱动器类需要维护一些内部属性和方法。请查看列表 5-3 中的这些内容。\n\n## 列表 5-3. Cache\\Driver\\\
  Memcached 内部属性/方法\n\n```php\nnamespace Framework\\Cache\\Driver\n\n{\n\nuse Framework\\\
  Cache as Cache;\n\nuse Framework\\Cache\\Exception as Exception;\n\nclass Memcached\
  \ extends Cache\\Driver\n{\n    protected $_service;\n\n    /**\n     * @readwrite\n\
  \     */\n    protected $_host = \"127.0.0.1\";\n\n    /**\n     * @readwrite\n\
  \     */\n    protected $_port = \"11211\";\n\n    /**\n     * @readwrite\n    \
  \ */\n    protected $_isConnected = false;\n\n    protected function _isValidService()\n\
  \    {\n        $isEmpty = empty($this->_service);\n        $isInstance = $this->_service\
  \ instanceof \\Memcache;\n        if ($this->isConnected && $isInstance && !$isEmpty)\n\
  \        {\n            return true;\n        }\n        return false;\n    }\n\
  }\n\n}\n```\n\n与 `Configuration\\Driver\\Ini` 类不同，`Cache\\Driver\\Memcached` 类实际上使用了继承的访问器支持。它将\
  \ `$_host` 和 `$_port` 属性设置为常用值，并调用 `parent::__construct($options)` 方法。与 Memcached\
  \ 服务器的连接是在 `__construct()` 方法内部通过 `connect()` 公有方法实现的。\n\n**注意**：`$_host` 和 `$_port`\
  \ 的默认值适用于大多数安装。你的配置可能有所不同，在这种情况下，你可能需要咨询安装 Memcached 时使用的文档。\n\n驱动器还有一个受保护的 `_isValidService()`\
  \ 方法，用于确保 `$_service` 的值是一个有效的 Memcached 实例。让我们在列表 5-4 中更仔细查看 `connect()/disconnect()`\
  \ 方法。\n\n## 列表 5-4. Cache\\Driver\\Memcached connect()/disconnect() 方法\n\n```php\n\
  namespace Framework\\Cache\\Driver\n\n{\n\nuse Framework\\Cache as Cache;\n\nuse\
  \ Framework\\Cache\\Exception as Exception;\n\nclass Memcached extends Cache\\Driver\n\
  {\n    public function connect()\n    {\n        try\n        {\n            $this->_service\
  \ = new \\Memcache();\n            $this->_service->connect(\n                $this->host,\n\
  \                $this->port\n            );\n            $this->isConnected = true;\n\
  \        }\n        catch (\\Exception $e)\n        {\n            throw new Exception\\\
  Service(\"Unable to connect to service\");\n        }\n        return $this;\n \
  \   }\n\n    public function disconnect()\n    {\n        if ($this->_isValidService())\n\
  \        {\n            $this->_service->close();\n            $this->isConnected\
  \ = false;\n        }\n        return $this;\n    }\n}\n\n}\n```\n\n`connect()`\
  \ 方法尝试连接到指定主机/端口的 Memcached 服务器。如果连接成功，`$_service` 属性将被赋值 PHP `Memcached` 类的实例，该实例已连接到\
  \ Memcached 服务。如果连接失败，将抛出一个 `CacheExceptionService` 异常。\n\n`disconnect()` 方法尝试将\
  \ `$_service` 实例从 Memcached 服务中断开。只有在 `_isValidService()` 方法返回 `true` 时才会执行此操作。\n\
  \n最后，我们需要查看通用方法，这些方法将用于大多数缓存需求。请查看列表 5-5。\n\n## 列表 5-5. Cache\\Driver\\Memcached\
  \ 通用方法\n\n```php\nnamespace Framework\\Cache\\Driver\n\n{\n\nuse Framework\\Cache\
  \ as Cache;\n\nuse Framework\\Cache\\Exception as Exception;\n\nclass Memcached\
  \ extends Cache\\Driver\n{\n    public function get($key, $default = null)\n   \
  \ {\n        if (!$this->_isValidService())\n        {\n            throw new Exception\\\
  Service(\"Not connected to a valid service\");\n        }\n        $value = $this->_service->get($key,\
  \ MEMCACHE_COMPRESSED);\n        if ($value)\n        {\n            return $value;\n\
  \        }\n        return $default;\n    }\n\n    public function set($key, $value,\
  \ $duration = 120)\n    {\n        if (!$this->_isValidService())\n        {\n \
  \           throw new Exception\\Service(\"Not connected to a valid service\");\n\
  \        }\n        $this->_service->set($key, $value, MEMCACHE_COMPRESSED, $duration);\n\
  \        return $this;\n    }\n\n    public function erase($key)\n    {\n      \
  \  if (!$this->_isValidService())\n        {\n            throw new Exception\\\
  Service(\"Not connected to a valid service\");\n        }\n        $this->_service->delete($key);\n\
  \        return $this;\n    }\n}\n\n}\n```\n\n`get()`、`set()` 和 `erase()` 方法的作用正如其名：分别是\
  \ `get` 获取值、`set` 将值设置到键、以及 `erase` 从键中删除值。`get()` 方法的第二个参数允许在未找到缓存值时提供并返回默认值。你可以看到\
  \ `Cache\\Driver\\Memcached` 类的全部。\n\n使用我们的缓存类其实非常简单。如果你回想章节开头时的示例，你将看到我们如何应用这种新的缓存机制，如列表\
  \ 5-7 所示。\n\n### 列表 5-7. 使用缓存类\n\n```php\nfunction getFriends()\n{\n    $cache =\
  \ new Framework\\Cache(array(\n        \"type\" => \"memcached\"\n    ));\n    $cache->initialize();\n\
  \    $friends = unserialize($cache->get(\"friends.{$user->id}\"));\n    if (empty($friends))\n\
  \    {\n        // 从数据库获取 $friends\n        $cache->set(\"friends.{$user->id}\"\
  , serialize($friends));\n    }\n\n    return $friends;\n}\n```\n\n\n\n\n\n# C 是任何大型应用中重要的部分。创建一个缓存解决方案并不特别困难；困难之处在于如何正确地使用它。每当你需要对数据或任何第三方服务发送重复请求时，请考虑使用缓存。每当你需要对数据库或文件系统发送重复请求时，请考虑使用缓存。只要你只缓存那些如果不使用缓存则需要更长时间获取的内容，你就几乎总是从使用缓存中受益。\n\
  \n## Questions\n\n1. 我们创建了一个缓存驱动程序，连接到 `Memcached` 服务器来存储、检索和删除缓存数据。这难道不比缓存到服务器文件中要慢吗？\n\
  2. 你能想到使用 `Memcached` 相比我们提供的其他缓存形式还有哪些其他益处吗？\n\n## Answers\n\n1. 文件 I/O（从服务器上的文件存储/检索数据）是众闻名的缓慢。相比之下，通过快速网络向高效服务器发送网络请求要快得多。\n\
  2. 使用集中式缓存服务器（如 `Memcached`）的巨大益处是，我们的应用程序可能运行在多个负载均衡的 Web 服务器上。如果它们自己管理自己的缓存文件，我们可能需要做大量工作，以防止它们无谓地重新创建缓存数据。\n\
  \n## Exercises\n\n1. 我们的缓存驱动程序成功连接并使用了 `Memcached` 存储。可能会出现问题：其他服务需要使用相同的 `Memcached`\
  \ 存储空间，并且我们的缓存数据具有相同的键名。尝试为所有存储的键和所有请求的键添加前缀。\n2  不同的缓存机制。这可能意味着编写新的缓存驱动程序类来实现新的缓存机制，从而扩展我们框架的缓存库。\n\
  \n# 第 6 章 Registry\n\n面向对象编程的伟大之处之一是可以通过创建类的多个实例来重用代码。当我们对类进行更改时，所有实例都会继承这些更改，因此我们只需要更改一次。\n\
  \n## Goals\n\n- 我们需要理解 `Registry` 设计模式以及它帮助我们克服的问题。\n- 随后，我们需要构建一个 `Registry` 类来存储对象实例。这是高效框架的一个组成部分，因此这将是本章的重点。\n\
  \n## Singleton\n\n然而，在某些情况下，我们期望只使用给定类的实例。我们可以通过几种方法实现这一点。我们在第 1 章中学习了其中一种方法，即 `Singleton`\
  \ 模式。例如，假设我们有列表 6-1 所示的类。\n\n### 列表 6-1 限制实例示例\n```php\nclass Ford\n{\n    public\
  \ $founder = \"Henry Ford\";\n    public $headquarters = \"Detroit\";\n    public\
  \ $employees = 164000;\n    public function produces($car)\n    {\n        return\
  \ $car-> producer == $this;\n    }\n}\n\nclass Car\n{\n    public $color;\n    public\
  \ $producer;\n}\n```\n\n```php\n$ford = new Ford();\n$car = new Car();\n$car-> color\
  \ = \"Blue\";\n$car-> producer = $ford;\necho $ford->produces($car);\necho $ford->founder;\n\
  ```\n\n这些类并没有什么技巧。不过它们确实是为了说明一个观点。有时，我们创建的类在此时只需要实例。考虑 `Ford` 类。世界上只有一家福特公司，但它与其他汽车制造商有很大不同。`Ford`\
  \ 类所需的逻辑可能与 `Toyota` 类大不相同。由于这种差异以及 `Ford` 类实例的唯一性，我们需要确保同一时间只有一个实例在存在。\n\n那么，如果我们像列表\
  \ 6-2 所示将 `Ford` 类变为 `Singleton` 呢？\n\n### 列表 6-2 Ford Singleton\n```php\nclass\
  \ Ford\n{\n    public $founder = \"Henry Ford\";\n    public $headquarters = \"\
  Detroit\";\n    public $employees = 164000;\n    public function produces($car)\n\
  \    {\n        return $car-> producer == $this;\n    }\n    private static $_instance;\n\
  \    private function __construct()\n    {\n        // do nothing\n    }\n    private\
  \ function __clone()\n    {\n        // do nothing\n    }\n    public function instance()\n\
  \    {\n        if (!isset(self::$_instance))\n        {\n            self::$_instance\
  \ = new self();\n        }\n        return self::$_instance;\n    }\n}\n```\n\n\
  要使 `Ford` 类成为 `Singleton`，我们需要做几件事。首先，我们需要隐藏 `__construct()` 和 `__clone()` 魔术方法。每当使用\
  \ `new` 关键字时，PHP 都会自动调用 `__construct()` 方法。如果我们将其设为私有，任何对 `new` 关键字的使用都会抛出异常。\n\n\
  每当调用 `clone()`（全局）方法来复制类实例时，就会调用 `__clone()` 方法。通过私有的 `__clone()` 方法，调用 `clone($ford)`\
  \ 将抛出异常。\n\n现在由于没有外部手段可以创建 `Ford` 实例，我们只能通过调用 `instance()` 方法来访问实例的属性和方法。\n\n###\
  \ 列表 6-3 使用 Singleton\n```php\n$ford = Ford::instance();\n$car = new Car();\n$car->\
  \ color = \"Blue\";\n$car-> producer = $ford;\necho $ford->produces($car);\necho\
  \ $ford->founder;\n```\n\n正如你可能注意到的，我们没有创建 `Ford` 类的实例实例。我们只从 `instance()` 方法获取实例。该方法的名称（在此情况下为\
  \ `instance`）并不重要。你可以将其命名为 `getInstance()` 或 `returnAnInstance()`，但它需要遵循背后的相同原理。这意味着在第一次调用时，它将创建并存储它，在随后的调用中，它将返回该实例。\n\
  \n## Registry\n\n如果我们可以将普通类视为限制实例类，而无必将它们变成单例呢？`Registry` 是一个 `Singleton`，用于存储其他“普通”类的实例。另一种思考方式是将其视为全局键/实例存储库。非单例类的实例被赋予一个键（标识符），并被“保”在\
  \ `Registry` 的私有存储中。当对特定键提出请求时，`Registry` 会检查是否存在对应键的实例，并返回它们。如果在键处未找到实例，`Registry`\
  \ 的方法将返回默认值。\n\n\n\n\n我们可以将缓存系统构建为一组 `Singleton` 类，也可以声明多个 `Cache` 类的实例。通过 `Registry`，我们可以找到一个整洁且高效的折中方案，它允许我们对类实例的数量进行严格控制，同时又不会将我们局限于单例使用。\n\
  \n# 第 6 章 ■ Registry\n\n考虑一个使用数据库的应用程序或连接 Facebook 的应用程序。这两种情况都受益于严格的控制和资源共享。`Registry`\
  \ 能够满足这些需求，而不需要我们编写大量的单例。\n\n让我们来看代码列表 6-4 中的代码。\n\n### 列表 6-4. Registry 类\n\n```php\n\
  namespace Framework\n\n{\n\nclass Registry\n{\n    private static $_instances =\
  \ array();\n\n    private function __construct()\n    {\n        // do nothing\n\
  \    }\n\n    private function __clone()\n    {\n        // do nothing\n    }\n\n\
  \    public static function get($key, $default = null)\n    {\n        if (isset(self::$_instances[$key]))\n\
  \        {\n            return self::$_instances[$key];\n        }\n        return\
  \ $default;\n    }\n\n    public static function set($key, $instance = null)\n \
  \   {\n        self::$_instances[$key] = $instance;\n    }\n\n    public static\
  \ function erase($key)\n    {\n        unset(self::$_instances[$key]);\n    }\n\
  }\n\n}\n```\n\n我将注册表称为单例，但它实际上是一个静态类。静态类是没有实例属性/方法或实例访问器/修改器的单例。事实上，静态类与我们的 `Registry`\
  \ 之间的唯一区别是永远无法创建注册表的实例。这是没问题的，因为我们只需要在单个上下文中使用 `Registry` 类。\n\n`set()` 方法用于通过指定的键在注册表的私有存储中“存储”实例。\n\
  \n`get()` 方法在私有存储中搜索具有具有匹配键的实例。如果找到了实例，它将返回它，否则默认返回使用 `$default` 参数提供的值。`erase()`\
  \ 方法对于移除特定键的实例有用。\n\n`Registry` 类与我们的 `Ford`/`Car` 类配合使用非常简单，如列表 6-5 所示。\n\n###\
  \ 列表 6-5. 使用 Registry\n\n```php\nFramework\\Registry::set(\"ford\", new Ford());\n\
  \n$car = new Car();\n$car->setColor(\"Blue\")->setProducer(Framework\\Registry::get(\"\
  ford\"));\necho Framework\\Registry::get(\"ford\")->produces($car);\n\necho Framework\\\
  Registry::get(\"ford\")->founder;\n```\n\n**注意**：Zend Framework 和 CakePHP 都有专门用于组织对象实例的类——这些类可以与\
  \ `Registry`。Codeigniter 没有这样的类，完全依赖于单例模式的使用。\n\n## 问题\n\n1. 注册表是存储类实例的理想场所，这有助于减少常用类的重复初始化。它还有其他用途吗？\n\
  2. 使用 `Registry` 模式是否会阻碍我们在框架中有效地使用单例？\n\n### 答案\n\n1. 除了存储类实例外，注册表还可以用于存储其他应该全局可访问的数据。\n\
  2. Registry 模式并没有否定我们使用单例。它实际上依赖于一个静态类来正常工作。\n\n### 练习题\n\n1. 通过我们的 `Registry` 类，我们可以设置和获取其他实例。尝试创建一个返回所有存储实例的方法。\n\
  2. 如果有一种方法可以检查路由是否存在，那将非常有用。\n\n# 第 7 章 ■ Routing\n\n# Routing\n\n路由是应用程序根据 URL\
  \ 决定执行哪些控制器和动作所发生的过程。简单来说，它管理路由事件。\n\n- 我们需要理解什么是路由以及它们是如何工作的。\n- 我们需要涵盖不同类型的路由。\n\
  - 我们需要构建 `Router` 类。\n\n## 定义路由\n\n某些路由可以用 `Listing 7-1` 所示的方式定义。\n\n### 列表 7-1.\
  \ 定义路由\n\n```php\n$router = new Framework\\Router();\n\n$router->addRoute(\n   \
  \ new Framework\\Route\\Simple(array(\n        \"pattern\" => \":name/profile\"\
  ,\n        \"controller\" => \"index\",\n        \"action\" => \"home\"\n    ))\n\
  );\n\n$router->dispatch(\"chris/profile\");\n```\n\n`Router` 类需要一些东西。我们需要处理任何不匹配路由的路由并提供适当的错误信息。\n\
  \n## Route 类\n\nRoute 类表示我们在框架配置中可以定义的不同类型的路由。因为存在多种类型，它们继承自一个基 `Route` 类，如列表 7-2\
  \ 所示。\n\n### 列表 7-2. Route 类\n\n```php\nnamespace Framework\\Router\n\n{\n\nuse\
  \ Framework\\Base as Base;\nuse Framework\\Router\\Exception as Exception;\n\nclass\
  \ Route extends Base\n{\n    protected $_pattern;\n    protected $_controller;\n\
  \    protected $_action;\n    protected $_parameters = array();\n\n    public function\
  \ _getExceptionForImplementation($method)\n    {\n        return new Exception(\"\
  {$method} method not implemented\");\n    }\n\n}\n\n```\n\n我们的 `Route` 类继承自 `Base`\
  \ 类，因此我们可以定义各种 getter/setter。我们还为生成异常的方法提供了方法重写。所有保护属性都与创建新的 `Route`（或子类）实例时提供的变量有关，并包含有关所请求\
  \ URL 的信息。\n\n\n\n`Router\\Route\\Regex` 类确实非常精简。它有一个 `matches()` 方法，`Router` 类会对所有\
  \ `Router\\Route` 子类调用该方法。`matches()` 方法会创建一个正确的正则表达式搜索字符串，并返回与提供的 URL 匹配的项。\n\n\
  `ArrayMethods::flatten()` 方法如列表 7-4 所示，用于将多维数组转换为一维数组。\n\n### 列表 7-4. `ArrayMethods::flatten()`\
  \ 方法\n\n```php\nnamespace Framework\n\n{\n\nclass ArrayMethods\n{\n    public function\
  \ flatten($array, $return = array())\n    {\n        foreach ($array as $key =>\
  \ $value)\n        {\n            if (is_array($value) || is_object($value))\n \
  \           {\n                // 69\n                // [www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \                // CHAPTER 7 ■ RouTing\n                $return = self::flatten($value,\
  \ $return);\n            }\n            else\n            {\n                $return[]\
  \ = $value;\n            }\n        }\n        return $return;\n    }\n}\n}\n```\n\
  \n`Router\\Route\\Simple` 类比 `Router\\Route\\Regex` 类稍微详细一些。它也有 `matches()` 方法，可以将匹配\
  \ `:property` 格式的子字符串转换为正则表达式通配符。\n\n`matches` 属性存储在 `$_parameters` 数组中。`Router\\\
  Route\\Simple` 类见列表 7-5。\n\n### 列表 7-5. `Router\\Route\\Simple` 类\n\n```php\nnamespace\
  \ Framework\\Router\\Route\n\n{\n    use Framework\\Router as Router;\n    use Framework\\\
  ArrayMethods as ArrayMethods;\n    class Simple extends Router\\Route\n    {\n \
  \       public function matches($url)\n        {\n            $pattern = $this->pattern;\n\
  \            // get keys\n            preg_match_all(\"#:([a-zA-Z0-9]+)#\", $pattern,\
  \ $keys);\n            if (sizeof($keys) && sizeof($keys[0]) && sizeof($keys[1]))\n\
  \            {\n                $keys = $keys[1];\n            }\n            else\n\
  \            {\n                // 模式中没有键，返回简单匹配\n                return preg_match(\"\
  #^{$pattern}$#\", $url);\n            }\n            // 化路由模式\n            $pattern\
  \ = preg_replace(\"#(:([a-zA-Z0-9]+))#\", \"([a-zA-Z0-9\\\\_]+)\", $pattern);\n\
  \            // 检查值\n            preg_match_all(\"#^{$pattern}$#\", $url, $values);\n\
  \            if (sizeof($values) && sizeof($values[0]) && sizeof($values[1]))\n\
