  \n# 第 33 章：CakePHP：测试\n\n与我们在 Zend Framework 中进行的测试类似，CakePHP 的单元测试依赖于 `PHPUnit`，这为我们在\
  \ CakePHP 中的学习画上了一个简单的句号。\n\n## 目标\n\n* 我们需要学习如何在控制器上创建并运行测试。\n\n## 测试\n\n我们可以创建几个简单的测试，以验证我们\
  \ CakePHP 控制器的功能。\n\n由于我们在 CakePHP 中编写的大部分代码都涉及控制器，我们将只为 `UsersController` 中的某些\
  \ action 编写测试。\n\nCakePHP 单元测试需要放置在 `~/app/Test/` 目录下，我们将创建的第一组测试所示于列表 33-1。\n\n\
  ***列表 33-1.*** `~/app/Test/Controller/UsersControllerTest.php`（节录）\n\n```php\nclass\
  \ UsersControllerTest extends ControllerTestCase\n{\n    public function testRegisterGet()\n\
  \    {\n        $result = $this->testAction(\"/register\", array(\n            \"\
  method\" => \"get\",\n            \"return\" => \"contents\"\n        ));\n\n  \
  \      $this->assertContains(\"data[User][first]\", $result);\n        $this->assertContains(\"\
  data[User][last]\", $result);\n        $this->assertContains(\"data[User][email]\"\
  , $result);\n        $this->assertContains(\"data[User][password]\", $result);\n\
  \        $this->assertContains(\"data[User][photo]\", $result);\n    }\n\n    public\
  \ function testLoginGet()\n    {\n        $result = $this->testAction(\"/login\"\
  , array(\n            \"method\" => \"get\",\n            \"return\" => \"contents\"\
  \n        ));\n\n        $this->assertContains(\"data[User][email]\", $result);\n\
  \        $this->assertContains(\"data[User][password]\", $result);\n    }\n\n  \
  \  public function testLogoutGet()\n    {\n        $result = $this->testAction(\"\
  /logout\", array(\n            \"method\" => \"get\",\n            \"return\" =>\
  \ \"contents\"\n        ));\n    }\n\n    public function testProfileGet()\n   \
  \ {\n        $result = $this->testAction(\"/profile\", array(\n            \"method\"\
  \ => \"get\",\n            \"return\" => \"contents\"\n        ));\n    }\n}\n```\n\
  \n这里显示的测试仅仅检查了 action 是否可以被调用而不报错，以及注册和登录的视图模板包含了各种表单字段。`assert()` 方法与我们在 `PHPUnit`\
  \ 中看到的完全相同，它们是由该库提供的。\n\n> **注意** `CakePHP` 在此处支持测试组件：[`book.cakephp.org/2.0/en/models/testing.html#testing-components`](http://book.cakephp.org/2.0/en/models/testing.html#testing-components)\n\
  \n我们需要设置的第二种测试如列表 33-2 所示。\n\n```php\npublic function testPost()\n{\n    $result\
  \ = $this->testAction(\"/login\", array(\n        \"method\" => \"post\",\n    \
  \    \"return\" => \"contents\",\n        \"data\" => array(\n            \"email\"\
  \ => \"test@gmail.com\",\n            \"password\" => \"password\"\n        )\n\
  \    ));\n\n    $this->assertEquals(true, isset($result->headers[\"Location\"]));\n\
  \    $this->assertEquals(\"/profile\", $result->headers[\"Location\"]);\n}\n```\n\
  \n归根底，编写的测试越多，效果就越好。\n\n# 附录 A：设置 Web 服务器\n\n在这一章中，我们将学习如何在 Windows、Linux 和 OS X\
  \ 中安装和配置 Web 服务器。\n\n## 目标\n\n* 安装 Apache 2.2+、MySQL 5+ 和 PHP 5.3+。\n* 安装 Memcached。\n\
  * 运行我们的单元测试以确保一切按预期工作。\n\n## Windows\n\n在本节中，我们将介绍 Windows 7 中的安装过程。这些软件包的安装通常被称为\
  \ WAMP（**W**indows **A**pache **M**ySQL **P**HP）。让我们开始吧。\n\n### 第 1 \n\n访问 [`www.wampserver.com/en/download.php`](http://www.wampserver.com/en/download.php)\
  \ 并下载适用于你系统的版本。如果你运行的是 64 位 PC，那么你需要 64 位安装程序。如果你不确定，请坚持 32 位安装程序，它在 64 位和 32 位\
  \ PC 上都能运行。下载安装程序后，启动它，并按照图 A-1 所示完成各个步骤。\n\n\n\n\n以及电子邮件设置，它是建议的，如果你需要，以后可以进行更改。在某个时刻，它会要求你选择默认浏览器。由于我安装了\
  \ `Google Chrome`，我将其作为我的默认浏览器。找到该可执行文件最快的方法是右键点击 `Google Chrome` 快捷方式图标并选择 `属性`\
  \ ➤ `快捷方式`。然后复制整个 `目标` 值并将其粘贴到 `文件位置` 框中。这在图 A-2 和 A-3. 中所示。\n\n**图 A-2. 选择默认浏览器**\n\
