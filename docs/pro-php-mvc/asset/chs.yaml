  \        }\n        return $this->_table;\n    }\n}\n```\n\n`Application_Model_User`\
  \ 类从列表 27-6 所示的获取表、设置表方法以及保护属性开始。\n\n### Listing 27-6. Application_Model_User (续)\n\
  \n```php\nclass Application_Model_User\n{\n    public $id;\n    public $first;\n\
  \    public $last;\n    public $email;\n    public $password;\n    public $live\
  \ = true;\n    public $deleted = false;\n    public $created;\n    public $modified;\n\
  \n    protected function _populate($options)\n    {\n        foreach ($options as\
  \ $key => $value) {\n            if (property_exists($this, $key)) {\n         \
  \       $this->$key = $value;\n            }\n        }\n    }\n\n    public function\
  \ __construct($options = array())\n    {\n        if (sizeof($options)) {\n    \
  \        $this->_populate($options);\n        }\n        $this->load();\n    }\n\
