  [www.it-ebooks.info](http://www.it-ebooks.info/)\n\n第 32 章 ■ Cakephp: Extending\n\
  \n## 目标\n\n- 我们需要学习如何使用 CakePHP 的内置功能。\n- 我们需要学习如何包含自己的第三方功能。\n\n## 文件上传\n\nCakePHP\
  \ 拥有自己的一套处理文件的库。在允许用户上传之前，我们需要修改注册和设置的视图模板，如列表 32-4 和 32-5 所示。\n\n## 表\n\n```sql\n\
  CREATE TABLE photos (\n    id int NOT NULL AUTO_INCREMENT,\n    name varchar(255)\
  \ NOT NULL,\n    size int NOT NULL,\n    width int NOT NULL,\n    height int NOT\
  \ NULL,\n    user_id int NOT NULL,\n    created datetime NOT NULL,\n    modified\
  \ datetime NOT NULL,\n    PRIMARY KEY (id)\n) ENGINE=InnoDB CHARSET=utf8;\n```\n\
  \n## 列表 32-1. `~/app/Model/Photo.php`\n\n```php\n<?php\n\nclass Photo extends AppModel\
  \ {\n\n    public $belongsTo = \"User\";\n\n}\n```\n\n## 列表 32-2. `~/app/Model/User.php`\n\
  \n```php\n<?php\n\nclass User extends AppModel {\n\n    public $hasMany = \"Photo\"\
  ;\n\n}\n```\n\n## 列表 32-4. `~/app/View/Users/register.ctp`\n\n```php\n<h1>Register</h1>\n\
  \n<?php\n\necho $this->Form->create(\"User\", array(\"type\" => \"file\"));\n\n\
  echo $this->Form->input(\"first\");\n\necho $this->Form->input(\"last\");\n\necho\
  \ $this->Form->input(\"email\");\n\necho $this->Form->input(\"password\", array(\n\
  \    \"type\" => \"password\"\n));\n\necho $this->Form->input(\"photo\", array(\n\
  \    \"type\" => \"file\"\n));\n\necho $this->Form->end(\"register\");\n\n?>\n```\n\
  \n## 列表 32-5. `~/app/View/Users/settings.ctp`\n\n```php\n<h1>Settings</h1>\n\n<?php\n\
  \necho $this->Form->create(\"User\", array(\"type\" => \"file\"));\n\necho $this->Form->input(\"\
  first\");\n\necho $this->Form->input(\"last\");\n\necho $this->Form->input(\"email\"\
  );\n\necho $this->Form->input(\"password\", array(\n    \"type\" => \"password\"\
  \n));\n\necho $this->Form->input(\"photo\", array(\n    \"type\" => \"file\"\n));\n\
  \necho $this->Form->end(\"save\");\n\n?>\n```\n\n\n\n\n\n这两个视图中都有两处重要的更改。第一是在调用\
  \ `$this->Form->create(. . .).` 时包含了第二个参数。第二是在每个表单中都添加了输入框（类型为 `file`）。这些更改使我们能够创建用于处理文件上传的函数（在\
  \ `UsersController` 中），如列表 32-6 所示。\n\n***列表 32-6.*** `~/app/Controller/UsersController.php`（节录）\n\
  \n```php\nclass UsersController extends AppController\n{\n    protected function\
  \ _upload($name, $user)\n    {\n        App::uses(\"File\", \"Utility\");\n    \
  \    $meta = $this->request->data[\"User\"][$name];\n        $file = new File($meta[\"\
  tmp_name\"], false);\n        if ($file)\n        {\n            $path = WWW_ROOT.\"\
  uploads\";\n            if ($file->copy($path.DS.$meta[\"name\"]))\n           \
  \ {\n                $info = $file->info();\n                $size = getimagesize($meta[\"\
  tmp_name\"]);\n                $this->Photo->save(array(\n                    \"\
  user_id\" => $user,\n                    \"mime\" => $info[\"mime\"],\n        \
  \            \"size\" => $info[\"filesize\"],\n                    \"width\" =>\
  \ $size[0],\n                    \"height\" => $size[1]\n                ));\n \
  \           }\n        }\n    }\n}\n```\n\n`_upload()` 方法首先由我们加载了 CakePHP 自带的 `File`\
  \ 类。这是由于 CakePHP 不支持我们在自己的框架或 Zend Framework 中预期的那种类自动加载机制。\n\n从那里开始，我们创建了一个新的 `File`\
  \ 实例，并使用其 `copy()` 方法在我们的 `~/app/webroot/uploads` 目录下创建临时上传文件的副本。最后，我们在 `photos`\
  \ 表中保存了上传文件的引用。我们在 `register()` 和 `settings()` 动作中调用了 `_upload()` 方法，如列表 32-7 所示。\n\
  \n***列表 32-7.*** `~/app/Controller/UsersController.php`（节录）\n\n```php\nclass UsersController\
  \ extends AppController\n{\n    public function register()\n    {\n        if ($this->request->is(\"\
  post\"))\n        {\n            if ($this->User->save($this->request->data))\n\
  \            {\n                $this->_upload(\"photo\", $this->User->id);\n  \
  \              $this->Session->setFlash(\"Your account has been created.\");\n \
  \           }\n            else\n            {\n                $this->Session->setFlash(\"\
  An error occurred while creating your account.\");\n            }\n        }\n \
  \   }\n    public function settings()\n    {\n        $this->_isSecure();\n    \
  \    $this->set(\"user\", $this->user);\n        $this->User->id = $this->user[\"\
  User\"][\"id\"];\n        if ($this->request->is(\"get\"))\n        {\n        \
  \    $this->request->data = $this->user;\n        }\n        else if ($this->request->is(\"\
  post\"))\n        {\n            if ($this->User->save($this->request->data))\n\
  \            {\n                $this->_upload(\"photo\", $this->User->id);\n  \
  \              $this->Session->setFlash(\"Your account has been updated.\");\n \
  \           }\n            else\n            {\n                $this->Session->setFlash(\"\
  An error occurred while updating your account.\");\n            }\n        }\n \
  \   }\n}\n```\n\n现在，当新用户在示例应用程序中注册账户并选择照片上传时，他们的用户记录将被创建，照片将通过上传，并且数据库中将创建该照片的引用（并分配给用户账户）。\n\
