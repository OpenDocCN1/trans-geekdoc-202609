  \ }\n}\n```\n\n我们在 `StringMethods` 类中添加了两个新方法（称为 *inflection* 变形方法）。这些方法使用正则表达式将字符串转换为单数或复数形式。接下来，我们重写\
  \ `Model` 类中 `_table` 和 `_connector` 属性的 getter。在 `getTable()` 方法中，我们希望返回定义的表名，否则返回当前\
  \ Model 类的单数形式（使用 `get_class()` 方法和添加到 `StringMethods` 类中的变形方法）。\n\n我们重写 `getConnector()`\
  \ 方法以便返回 `_connector` 属性（存储在 `Registry` 类中的连接实例），或者抛出 `Model\\Exception`。这是我们第一次从\
  \ `Registry` 类中检索任何内容，这样做是因为此时数据库连接可能已经初始化了。\n\n我们还需要创建一个方法，以有序数组的形式返回带有所有元数据的列定义，以便我们构造\
  \ SQL。请查看列表 10-6 以了解我们是如何实现的。\n\n### 列表 10-6. getColumns() 方法\n\n```php\nnamespace\
  \ Framework\n\n{\nuse Framework\\Base as Base;\nuse Framework\\Registry as Registry;\n\
  use Framework\\Inspector as Inspector;\nuse Framework\\StringMethods as StringMethods;\n\
  use Framework\\Model\\Exception as Exception;\n\nclass Model extends Base\n{\n \
  \   public function getColumns()\n    {\n        if (empty($this->_columns)) {\n\
  \            $primaries = 0;\n            $columns = array();\n            $class\
  \ = get_class($this);\n            $types = $this->types;\n            $inspector\
  \ = new Inspector($this);\n            $properties = $inspector->getClassProperties();\n\
  \            $first = function($array, $key) {\n                if (!empty($array[$key])\
  \ && sizeof($array[$key]) == 1) {\n                    return $array[$key][0];\n\
  \                }\n                return null;\n            };\n            foreach\
  \ ($properties as $property) {\n                $propertyMeta = $inspector->getPropertyMeta($property);\n\
  \                if (!empty($propertyMeta[\"@column\"])) {\n                   \
  \ $name = preg_replace(\"#^\\#\", \"\", $property);\n                    $primary\
  \ = !empty($propertyMeta[\"@primary\"]);\n                    $type = $first($propertyMeta,\
  \ \"@type\");\n                    $length = $first($propertyMeta, \"@length\");\n\
  \                    $index = !empty($propertyMeta[\"@index\"]);\n             \
  \       $readwrite = !empty($propertyMeta[\"@readwrite\"]);\n                  \
  \  $read = !empty($propertyMeta[\"@read\"]) || $readwrite;\n                   \
  \ $write = !empty($propertyMeta[\"@write\"]) || $readwrite;\n                  \
  \  $validate = !empty($propertyMeta[\"@validate\"]) ? $propertyMeta[\"@validate\"\
  ] : false;\n                    $label = $first($propertyMeta, \"@label\");\n  \
  \                  if (!in_array($type, $types)) {\n                        throw\
  \ new Exception\\Type(\"{$type} is not a valid type\");\n                    }\n\
  \                    if ($primary) {\n                        $primaries++;\n  \
  \                  }\n                    $columns[$name] = array(\n           \
  \             \"raw\" => $property,\n                        \"name\" => $name,\n\
  \                        \"primary\" => $primary,\n                        \"type\"\
  \ => $type,\n                        \"length\" => $length,\n                  \
  \      \"index\" => $index,\n                        \"read\" => $read,\n      \
  \                  \"write\" => $write,\n                        \"validate\" =>\
  \ $validate,\n                        \"label\" => $label\n                    );\n\
  \                }\n            }\n            if ($primaries !== 1) {\n       \
  \         throw new Exception\\Primary(\"{$class} must have exactly one @primary\
  \ column\");\n            }\n            $this->_columns = $columns;\n        }\n\
  \        return $this->_columns;\n    }\n}\n}\n```\n\n\n\n\n列的 `@type` 标志会被进行检查以确保其有效性，如果不有效，将抛出\
  \ `Model\\Exception\\Type` 异常。如果列的类型有效，它会被添加到 `_columns` 属性中。每个有效的 `$primary` 列都会导致\
  \ `$primaries` 变量递增，该变量会在方法结束时被检查，以确保恰好定义了一个主列。从本质上，此方法获取 `User` 模型定义并返回一个包含列数据的关联数组。我们还可以创建两个便利方法从此关联数组中返回单个列，如列表\
  \ 10-7 所示。\n\n### 列表 10-7. 列获取器 (Column Getters)\n\n```php\nnamespace Framework\n\
  \n{\n\nuse Framework\\Base as Base;\nuse Framework\\Registry as Registry;\nuse Framework\\\
  Inspector as Inspector;\nuse Framework\\StringMethods as StringMethods;\nuse Framework\\\
  Model\\Exception as Exception;\n\nclass Model extends Base\n\n{\n\npublic function\
  \ getColumn($name)\n{\n\nif (!empty($this->_columns[$name]))\n{\nreturn $this->_columns[$name];\n\
  }\n\nreturn null;\n}\n\npublic function getPrimaryColumn()\n{\n\nif (!isset($this->_primary))\n\
  {\n$primary;\nforeach ($this->columns as $column)\n{\nif ($column[\"primary\"])\n\
  {\n$primary = $column;\nbreak;\n}\n}\n\n$this->_primary = $primary;\n}\n\nreturn\
  \ $this->_primary;\n}\n}\n}\n```\n\n`getColumn()` 方法通过名称返回一个列。你可能已经注意到，列类属性假设以下划线（`_`）字符开头。`getColumn()`\
  \ 方法延续了这一假设，它会检查不带 `_` 字符的列。当声明为列属性时，列的形式类似于 `_firstName`，但通过任何公共获取器/设置器/方法引用时，它们看起来像\
  \ `setFirstName/firstName`。\n\n`getPrimaryColumn()` 方法遍历所有列，返回标记为主列的那一个。\n\n现在我们已经有了描述和遍历模型属性（因此也是遍历我们的数据库表）的方法，我们可以开始构建最终将生成物理表的\
  \ SQL。由于表是使用 SQL 语法创建的，且由于该语法通常特定于数据库，我们将在连接器类上创建一个方法，用于将结构同步到数据库。此方法将列数组转换为我们所需的\
  \ SQL，如列表 10-8 所示。\n\n### 列表 10-8. Database\\Connector\\Mysql sync() 方法\n\n```php\n\
  namespace Framework\\Database\\Connector\n\n{\n\nuse Framework\\Database as Database;\n\
  use Framework\\Database\\Exception as Exception;\n\nclass Mysql extends Database\\\
  Connector\n\n{\n\npublic function sync($model)\n{\n\n$lines = array();\n$indices\
  \ = array();\n$columns = $model->columns;\n$template = \"CREATE TABLE '%s' (\\n%s,\\\
  n%s\\n) ENGINE=%s DEFAULT CHARSET=%s;\"; foreach ($columns as $column)\n{\n\n$raw\
  \ = $column[\"raw\"];\n$name = $column[\"name\"];\n$type = $column[\"type\"];\n\
  $length = $column[\"length\"];\nif ($column[\"primary\"])\n{\n$indices[] = \"PRIMARY\
  \ KEY ('{$name}')\";\n}\nif ($column[\"index\"])\n{\n$indices[] = \"KEY ('{$name}')\"\
  ;\n}\n\nswitch ($type)\n{\ncase \"integer\":\n{\n$lines[] = \"{$name}' int(11) NOT\
  \ NULL AUTO_INCREMENT\";\nbreak;\n}\ncase \"text\":\n{\nif ($length !== null &&\
  \ $length <= 255)\n{\n$lines[] = \"{$name}' varchar({$length}) DEFAULT NULL\";\n\
  }\nelse\n{\n$lines[] = \"{$name}' text\";\n}\nbreak;\n}\ncase \"integer\":\n{\n\
  $lines[] = \"{$name}' int(11) DEFAULT NULL\";\nbreak;\n}\ncase \"decimal\":\n{\n\
  $lines[] = \"{$name}' float DEFAULT NULL\";\nbreak;\n}\ncase \"boolean\":\n{\n$lines[]\
  \ = \"{$name}' tinyint(4) DEFAULT NULL\";\nbreak;\n}\ncase \"datetime\":\n{\n$lines[]\
  \ = \"{$name}' datetime DEFAULT NULL\";\nbreak;\n}\n}\n\n$table = $model->table;\n\
  $sql = sprintf(\n$template,\njoin(\"\\n\", $lines),\njoin(\"\\n\", $indices),\n\
  $this->engine,\n$this->charset\n);\n$result = $this->execute(\"DROP TABLE IF EXISTS\
  \ {$table}\");\nif ($result === false)\n{\n$error = $this->lastError;\nthrow new\
  \ Exception\\Sql(\"There was an error in the query: {$error}\");\n}\n\n$result =\
  \ $this->execute($sql);\nif ($result === false)\n{\n$error = $this->lastError;\n\
  throw new Exception\\Sql(\"There was an error in the query: {$error}\");\n}\n\n\
  return $this;\n}\n}\n}\n```\n\n我们创建的 `sync()` 方法将类/属性转换为有效的 SQL 查询，并最终转换为物理数据库表。它的这样做是首先通过调用模型的\
  \ `columns()` 方法获取列列表。通过遍历列，它创建索引数组和字段字符串。\n\n**注意**：此 `CREATE TABLE` SQL 是针对 MySQL\
  \ 设计的，可以在 `Database\\Connector` 类中找到。如果你正在使用的数据库引擎在执行最终 SQL 查询时遇到问题，你可能需要重写 `Database\\\
  Connector` 类中的方法。在所有字段字符串创建后，它们与索引合并并应用到 `CREATE TABLE` 模板中。`DROP TABLE` 语句被创建并执行，为新表铺路，任何\
  \ SQL 错误都会导致 `Database\\ ` 异常。由于该语法通常特定于数据库，你可能需要重写 `Database\\Connector` 类中的方法。\n\
  \n在列表 10-9 中，我们看到如何首先创建一个数据库连接，并将其（作为连接器）分配给 `User` 模型实例。最后，我们在 `User` 模型实例上调用 `sync()`\
  \ 方法，数据库表被创建。由于我们在 `Registry` 类中检查了数据库键的存在，我们也可以通过列表 10-10 所示的代码实现相同的结果。\n\n###\
  \ 列表 10-9. sync 方法示例\n\n```php\n$database = new Database(array(\n\"type\" => \"\
  mysql\",\n\"options\" => array(\n\"host\" => \"localhost\",\n\"username\" => \"\
  prophpmvc\",\n\"password\" => \"prophpmvc\",\n\"schema\" => \"prophpmvc\"\n)\n));\n\
  \n$user = new User(array(\n\"connector\" => $database\n));\n\n$database->sync($user);\n\
  ```\n\n现在我们有了可行的数据库表，我们需要扩展模型以直接与数据库交互，并为我们提供一个简单的接口。我们首先想要开启的功能是让模型在主列值已提供时加载记录。我们通过修改构造函数并添加\
  \ `load()` 方法来实现这一点，如列表 10-11 所示。\n\n### 列表 10-11. 模型 __construct() 和 load() 方法\n\
  \n```php\nnamespace Framework\n\n{\n\nuse Framework\\Base as Base;\nuse Framework\\\
  Registry as Registry;\nuse Framework\\Inspector as Inspector;\nuse Framework\\StringMethods\
  \ as StringMethods;\nuse Framework\\Model\\Exception as Exception;\n\nclass Model\
  \ extends Base\n\n{\n\npublic function __construct($options = array())\n{\nparent::__construct($options);\n\
  $this->load();\n}\n\npublic function load()\n{\n\n$primary = $this->primaryColumn;\n\
  $raw = $primary[\"raw\"];\n$name = $primary[\"name\"];\nif (!empty($this->$raw))\n\
  {\n$previous = $this->connector\n->query()\n->from($this->table)\n->where(\"{$name}\
  \ = ?\", $this->$raw)\n->first();\n\nif ($previous == null)\n{\nthrow new Exception\\\
  Primary(\"Primary key value invalid\");\n}\n\nforeach ($previous as $key => $value)\n\
  {\n```\n\n\n\n\n```php\n$prop = \"\\_{$key}\";\n\nif (!empty($previous->$key) &&\
  \ !isset($this->$prop))\n{\n    $this->$key = $previous->$key;\n}\n```\n\n如果我们回看\
  \ `Base` 类，会提醒自己传递给构造函数的关联数组应用于存在的 getter/setter 方法（getters/setters）。这意味着我们可以通过向构造函数提供正确的键/值对（该键值对需匹配主列名以及与现有记录对应的值）来加载一条现有的记录。\n\
  \n`load()` 方法极大地简化了我们的记录检索工作。它确定模型的主列，并检查其是否不为空。这可以告诉我们是否已提供了主键，从而为我们提供了寻找意图记录的可行手段。如果主键类属性为空，我们假设该模型实例用于创建一条新记录，并且不再进行任何后续操作。\n\
  \n为了加载数据库记录，我们获取当前模型的连接器（connector），如果没有找到连接器，将停止执行。\n\n我们根据主键列属性的值为该记录创建一个数据库查询。如果没有找到记录，则会抛出\
  \ `Model\\Exception\\Primary` 异常。这种情况发生在提供了主键列值，但该值并不代表数据库表中记录的有效标识时。\n\n最后，我们遍历已加载记录的数据，并仅设置在\
  \ `__construct()` 方法中未设置的属性值。这确保了模型初始化后数据不会丢失。我们的模型需要的另一个实用方法是种允许创建或更新记录的方法，如列表\
  \ 10-12 所示。\n\n### 列表 10-12. save() 方法\n\n```php\nnamespace Framework\n{\n    use\
  \ Framework\\Base as Base;\n    use Framework\\Registry as Registry;\n    use Framework\\\
  Inspector as Inspector;\n    use Framework\\StringMethods as StringMethods;\n  \
  \  use Framework\\Model\\Exception as Exception;\n\n    class Model extends Base\n\
  \    {\n        public function save()\n        {\n            $primary = $this->primaryColumn;\n\
  \            $raw = $primary[\"raw\"];\n            $name = $primary[\"name\"];\n\
  \            $query = $this->connector\n                ->query()\n            \
  \    ->from($this->table);\n\n            if (!empty($this->$raw))\n           \
  \ {\n                $query->where(\"{$name} = ?\", $this->$raw);\n            }\n\
  \n            $data = array();\n            foreach ($this->columns as $key => $column)\n\
  \            {\n                if (!$column[\"read\"])\n                {\n   \
  \                 $prop = $column[\"raw\"];\n                    $data[$key] = $this->$prop;\n\
  \                    continue;\n                }\n\n                if ($column\
  \ != $this->primaryColumn && $column)\n                {\n                    $method\
  \ = \"get\".ucfirst($key);\n                    $data[$key] = $this->$method();\n\
  \                    continue;\n                }\n            }\n\n           \
  \ $result = $query->save($data);\n            if ($result > 0)\n            {\n\
  \                $this->$raw = $result;\n            }\n            return $result;\n\
  \        }\n    }\n}\n```\n\n`save()` 方法创建一个查询实例，并针对与 `Model` 类相关的表。如果主键属性值不为空，它会应用\
  \ `WHERE` 子句，并根据 `getColumns()` 方法返回的列构建一个数据数组。最后，它调用查询实例的 `save()` 方法来提交数据。由于 `Database\\\
  Connector` 类根据 `WHERE` 子句的标准执行 `INSERT` 或 `UPDATE` 语句，该方法将根据主键属性是否有值，要么插入新记录，要么更新现有记录。我们需要的修饰方法是\
  \ `delete()` 和 `deleteAll()` 方法，它们用于从数据库中删除记录。你可以在列表 10-13 中看到这些方法。\n\n### 列表 10-13.\
  \ delete() 和 deleteAll() 方法\n\n```php\nnamespace Framework\n{\n    use Framework\\\
  Base as Base;\n    use Framework\\Registry as Registry;\n    use Framework\\Inspector\
  \ as Inspector;\n    use Framework\\StringMethods as StringMethods;\n    use Framework\\\
  Model\\Exception as Exception;\n\n    class Model extends Base\n    {\n        public\
  \ function delete()\n        {\n            $primary = $this->primaryColumn;\n \
  \           $raw = $primary[\"raw\"];\n            $name = $primary[\"name\"];\n\
  \            if (!empty($this->$raw))\n            {\n                return $this->connector\n\
  \                    ->query()\n                    ->from($this->table)\n     \
  \               ->where(\"{$name} = ?\", $this->$raw)\n                    ->delete();\n\
  \            }\n        }\n\n        public static function deleteAll($where = array())\n\
  \        {\n            $instance = new static();\n            $query = $instance->connector\n\
  \                ->query()\n                ->from($instance->table);\n        \
  \    foreach ($where as $clause => $value)\n            {\n                $query->where($clause,\
  \ $value);\n            }\n            return $query->delete();\n        }\n   \
  \ }\n}\n```\n\n`delete()` 方法是我们模型修饰方法中最简单的一个。如果主键属性值不为空，它会创建一个查询对象并执行查询的 `delete()`\
  \ 方法。`deleteAll()` 方法执行的是几乎相同的操作，只不过它是静态调用的。到目前为止，我们查看了单条记录的交互，但最好允许多条记录操作，类似于我们数据库的\
  \ `all()`、`first()` 和 `count()` 方法。我们将创建的第一个方法是 `all()` 方法，如列表 10-14 所示（注：原文此处为\
  \ 10-14）。\n\n### 列表 14. all() 方法\n\n```php\nnamespace Framework\n{\n    use Framework\\\
  Base as Base;\n    use Framework\\Registry as Registry;\n    use Framework\\Inspector\
  \ as Inspector;\n    use Framework\\StringMethods as StringMethods;\n    use Framework\\\
  Model\\Exception as Exception;\n\n    class Model extends Base\n    {\n        public\
  \ static function all($where = array(), $fields = array(), $order = null, $direction\
  \ = null, $limit = null, $page = null)\n        {\n            $model = new static();\n\
  \            return $model->_all($where, $fields, $order, $direction);\n       \
  \ }\n\n        protected function _all($where = array(), $fields = array(), $order\
  \ = null, $direction = null, $limit = null, $page = null)\n        {\n         \
  \   $query = $this->connector\n                ->query()\n                ->from($this->table,\
  \ $fields);\n            foreach ($where as $clause => $value)\n            {\n\
  \                $query->where($clause, $value);\n            }\n            if\
  \ ($order != null)\n            {\n                $query->order($order, $direction);\n\
  \            }\n            if ($limit != null)\n            {\n               \
  \ $query->limit($limit, $page);\n            }\n            $rows = array();\n \
  \           $class = get_class($this);\n            foreach ($query->all() as $row)\n\
  \            {\n                $rows[] = new $class($row);\n            }\n   \
  \         return $rows;\n        }\n    }\n}\n```\n\n`all()` 方法是受保护的 `_all()` 方法的简单静态封装。`_all()`\
  \ 方法创建一个查询，考虑到各种过滤器以返回所有匹配的记录。我们费力将实例方法封装在静态方法中，是因为我们创建了一个模型实例等于数据库记录的上下文。多记录操作作为类方法更合理。`first()`\
  \ 方法与 `all()` 方法相似，它是受保护实例方法的简单静态封装。`_first()` 方法简单返回第一条匹配的记录，如列表 10-15 所示。\n\n\
  ### 列表 10-15. first() 方法\n\n```php\nnamespace Framework\n{\n    use Framework\\\
  Base as Base;\n    use Framework\\Registry as Registry;\n    use Framework\\Inspector\
  \ as Inspector;\n    use Framework\\StringMethods as StringMethods;\n    use Framework\\\
  Model\\Exception as Exception;\n\n    class Model extends Base\n    {\n        public\
  \ static function first($where = array(), $fields = array(), $order = null, $direction\
  \ = null)\n        {\n            $model = new static();\n            return $model->_first($where,\
  \ $fields, $order, $direction);\n        }\n\n        protected function _first($where\
  \ = array(), $fields = array(), $order = null, $direction = null)\n        {\n \
  \           $query = $this->connector\n                ->query()\n             \
  \   ->from($this->table, $fields);\n            foreach ($where as $clause => $value)\n\
  \            {\n                $query->where($clause, $value);\n            }\n\
  \            if ($order != null)\n            {\n                $query->order($order,\
  \ $direction);\n            }\n            $first = $query->first();\n         \
  \   $class = get_class($this);\n            if ($first)\n            {\n       \
  \         return new $class($query->first());\n            }\n            return\
  \ null;\n        }\n    }\n}\n```\n\n`count()` 方法与之前的两个静态方法相似。`_count()` 方法返回匹配记录的计数。列表\
  \ 10-16 显示了 `count()` 方法。\n\n\n\n\n\n# 第 10 章 模型\n\n## 列表 10-16. `count()` 方法\n\n\
  ```php\nnamespace Framework\n\n{{\n\nuse Framework\\Base as Base;\nuse Framework\\\
  Registry as Registry;\nuse Framework\\Inspector as Inspector;\nuse Framework\\StringMethods\
  \ as StringMethods;\nuse Framework\\Model\\Exception as Exception;\n\nclass Model\
  \ extends Base\n{\n\n    public static function count($where = array())\n    {\n\
  \        $model = new static();\n        return $model->_count($where);\n    }\n\
  \n    protected function _count($where = array())\n    {\n        $query = $this\n\
  \            ->connector\n            ->query()\n            ->from($this->table);\n\
  \        foreach ($where as $clause => $value)\n        {\n            $query->where($clause,\
  \ $value);\n        }\n        return $query->count();\n    }\n}\n\n}\n```\n\n当所有代码都就绪后，让我们来看看如何使用我们的模型，如列表\
  \ 10-17 所示。\n\n### 列表 10-17. 模型用法示例\n\n```php\n$database = new Database(array(\n\
  \    \"type\" => \"mysql\",\n    \"options\" => array(\n        \"host\" => \"localhost\"\
  ,\n        \"username\" => \"prophpmvc\",\n        \"password\" => \"prophpmvc\"\
  ,\n        \"schema\" => \"prophpmvc\"\n    )\n));\n\n$database = $database->initialize();\n\
  $user = new User(array(\n    \"connector\" => $database\n));\n\n$database->sync($user);\n\
  $elijah = new User(array(\n    \"connector\" => $database,\n    \"first\" => \"\
  Chris\",\n    \"last\" => \"Pitt\",\n    \"email\" => \"chris@example.com\",\n \
  \   \"password\" => \"password\",\n    \"live\" => true,\n    \"deleted\" => false,\n\
  \    \"created\" => date(\"Y-m-d H:i:s\"),\n    \"modified\" => date(\"Y-m-d H:i:s\"\
  )\n));\n\n$elijah->save();\n$all = User::all(array(\n    \"last = ?\" => \"Pitt\"\
  \n));\n\n$elijah->delete();\n```\n\n这显然比直接使用 `Database\\Connector` 或 `Database\\\
  Query` 要简单得多。它提供了一种方法，让我们通过 ORM 代码来保持数据库表的同步。我们可以使用简单的 OOP 代码来查询或修改数据库记录。列表 10-18\
  \ 显示完整的 Model 类。\n\n### 列表 10-18. Model 类\n\n```php\nnamespace Framework\n\n{\n\n\
  use Framework\\Base as Base;\nuse Framework\\Registry as Registry;\nuse Framework\\\
  Inspector as Inspector;\nuse Framework\\StringMethods as StringMethods;\nuse Framework\\\
  Model\\Exception as Exception;\n\nclass Model extends Base\n{\n    /**\n     * @readwrite\n\
  \     */\n    protected $_table;\n\n    /**\n     * @readwrite\n     */\n    protected\
  \ $_connector;\n\n    /**\n     * @read\n     */\n    protected $_types = array(\n\
  \        \"autonumber\",\n        \"text\",\n        \"integer\",\n        \"decimal\"\
  ,\n        \"boolean\",\n        \"datetime\"\n    );\n\n    protected $_columns;\n\
