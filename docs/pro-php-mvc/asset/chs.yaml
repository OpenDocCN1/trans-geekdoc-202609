  \ 数据库引擎，因此尝试为另一个关系型 SQL 数据库引擎创建另一个连接器-驱动组合。\n\n2. `Driver\\Mysql` 类生成的 `WHERE` 子句未处理\
  \ `OR`、`WHERE` 或 `LIKE` 子句。尝试为这些创建方法。\n\n# 第 10 章：模型\n\n到目前为止，我们创建了构成框架基础的类和库，但这些并没有特别关注应用程序将如何使用它们。这一切即将发生变化。\n\
  \n正如我之前提到的，如果没有数据进行计算，计算就毫无意义。你将参与的大多数项目都有共同点：它们需要存储、处理、返回和显示数据。你可以通过使用数据库来实现。\n\
  \n在第 9 章中，我们学习了如何创建一个可扩展的数据库库，并编写了一对 MySQL 连接器/查询类。直接与数据库通信是完成工作的一种方法，但直接在我们的控制器中这样做并不理想。这仅仅是使用模型的原因之一。\n\
  \n## 目标 \n\n- 我们需要理解什么是模型。\n- 我们需要构建模型类，以便轻松地处理通用、重复的任务。\n\n## 概念\n\n模型允许我们隔离所有的直接数据库通信，以及大多数与第三方\
  \ Web 服务的通信。我们在本章中构建的模型将为执行数据库更改提供一个简单的接口。\n\n**注意**：我们在本章中定义模型的方式有时被称为对象关系映射（ORM）。ORM\
  \ 库在两个数据相关系统之间创建了一个不透明的通信层。你可以在 `http://en.wikipedia.org/wiki/Object-relational_mapping`\
  \ 阅读更多关于 ORM 的信息。\n\n重要的是，理解模型并不局限于数据库工作。模型可以连接到任意数量的第三方数据服务，并为我们的控制器提供一个简单的接口。我们只是恰好将模型重点集中在\
  \ ORM 范式中。\n\n我们可能同样需要构建一个连接到 Flickr 下载照片的模型，或者一个允许我们从像 Amazon S3 这样的云计算网络上传/下载文件的模型。模型旨在包含任何未直接在视图中呈现的、或由控制器用于连接视图和模型的资源。\n\
  \n## 实现\n\n数据库引擎可以存储许多类型的数据。对于我们的模型来说，我们只需要以下几种类型。\n\n- **自动增量 (Autonumber)**：自动增量字段生成自动递增的数值，最常用于标识字段。\n\
  - **文本 (Text)**：文本字段对应 `varchar` 或 `text` 数据类型，取决于所需的字段长度。\n- **整数 (Integer)**：我们的整数类型的默认字段长度为\
  \ 11。\n- **小数 (Decimal)**：小数字段包含浮点数值。\n- **布尔值 (Boolean)**：布尔字段实际上是 `tinyint` 字段。在给它们分配\
  \ `true/false` 时，布尔值将强制转换为整数值。\n- **日期时间 (Datetime)**：我们在 ORM 中选择支持如此小规模的数据类型子集是因为这能保持简单。我们也可以确信，绝大多数数据库引擎都支持这些数据类型。我们如何在模型中使用这些数据类型呢？列表\
  \ 10-1 所示示例说明了我们定义模型所需的不同数据类型的方法。\n\n列表 10-1. 用户 模型\n\n```php\nclass User extends\
  \ Framework\\Model\n{\n    /**\n     * @column\n     * @readwrite\n     * @primary\n\
  \     * @type autonumber\n     */\n    protected $_id;\n\n    /**\n     * @column\n\
  \     * @readwrite\n     * @type text\n     * @length 100\n     */\n    protected\
  \ $_first;\n\n    /**\n     * @column\n     * @readwrite\n     * @type text\n  \
  \   * @length 100\n     */\n    protected $_last;\n\n    /**\n     * @column\n \
  \    * @readwrite\n     * @type text\n     * @length 100\n     * @index\n     */\n\
  \    protected $_email;\n\n    /**\n     * @column\n     * @readwrite\n     * @type\
  \ text\n     * @length 100\n     * @index\n     */\n    protected $_password;\n\n\
  \    /**\n     * @column\n     * @readwrite\n     * @type text\n     */\n    protected\
  \ $_notes;\n\n    /**\n     * @column\n     * @readwrite\n     * @type boolean\n\
  \     * @index\n     */\n    protected $_live;\n\n    /**\n     * @column\n    \
  \ * @readwrite\n     * @type boolean\n     * @index\n     */\n    protected $_deleted;\n\
  \n    /**\n     * @column\n     * @readwrite\n     * @type datetime\n     */\n \
  \   protected $_created;\n\n    /**\n     * @column\n     * @readwrite\n     * @type\
  \ datetime\n     */\n    protected $_modified;\n}\n```\n\n我们对这个示例模型注意到的第一点是，它只包含了少数属性，非常容易理解。这些保护属性中的每一个都包含了\
  \ `@readwrite` 标记，这是我们之前见过的。这意味着我们能够调用诸如 `setFirst()` 和 `getCreated()` 之类的 getter/setter\
  \ 方法，而无需在我们的模型类中定义它们。我们真正感兴趣的新属性通过 `@column` 标记标识。`$_id` 类属性具有 `@primary` 标记，它将其标识为主主键。`$_email`、`$_password`、`$_live`\
  \ 和 `$_deleted` 属性都有 `@index` 标记，显示它们应该在数据库表中建立索引。剩余的标记是 `@type` 和 `@length`。这些显示了类应该是什么数据类型以及长度（对于文本字段，以决定它们应该是\
  \ `varchar` 还是 `text`）。这种结构将我们创建的列转换为底层数据库层，以便任何使用。当我们完成后，它应该类似于列表 10-2 所示的 SQL。\n\
  \n列表 10-2. 用户模型的 MySQL 表表示\n\n```sql\nCREATE TABLE 'user' (\n  'id' int(11) NOT\
  \ NULL AUTO_INCREMENT,\n  'first' varchar(100) DEFAULT NULL,\n  'last' varchar(100)\
  \ DEFAULT NULL,\n  'email' varchar(100) DEFAULT NULL,\n  'password' varchar(100)\
  \ DEFAULT NULL,\n  'notes' text,\n  'live' tinyint(4) DEFAULT NULL,\n  'deleted'\
  \ tinyint(4) DEFAULT NULL,\n  'created' datetime DEFAULT NULL,\n  'modified' datetime\
  \ DEFAULT NULL,\n  PRIMARY KEY ('id'),\n  KEY 'email' ('email'),\n  KEY 'password'\
  \ ('password'),\n  KEY 'live' ('live'),\n  KEY 'deleted' ('deleted')\n) ENGINE=InnoDB\
  \ DEFAULT=utf8;\n```\n\n**注意**：密码绝应以明文存储。为了保持简单，我们放弃了这一最佳实践。你应该花时间学习加密或哈希密码，以确保它们不会被盗用于非法目的。\n\
  \n## 构建 SQL\n\n列表 10-2 中的 SQL 是我们期望模型在数据库中的样子。它说明了我们的模型类在概述的简单类型（文本、整数、布尔等）与数据库中的实际字段类型之间进行的数据类型转换。让我们开始编写模型类，如列表\
  \ 10-3 所示。\n\n列表 10-3. 模型类\n\n```php\nnamespace Framework\n\n{\n\nuse Framework\\\
  Base as Base;\nuse Framework\\Registry as Registry;\nuse Framework\\Inspector as\
  \ Inspector;\nuse Framework\\StringMethods as StringMethods;\nuse Framework\\Model\\\
  Exception as Exception;\n\nclass Model extends Base\n{\n    /**\n     * @readwrite\n\
  \     */\n    protected $_table;\n\n    /**\n     * @readwrite\n     */\n    protected\
  \ $_connector;\n\n    /**\n     * @read\n     */\n    protected $_types = array(\n\
  \        \"autonumber\",\n        \"text\",\n        \"integer\",\n        \"decimal\"\
  ,\n        \"boolean\",\n        \"datetime\"\n    );\n\n    protected $_columns;\n\
  \    protected $_primary;\n\n    public function _getExceptionForImplementation($method)\n\
  \    {\n```\n\n\n\n\n\n```php\nreturn new Exception\\Implementation(\"{$method}\
  \ method not implemented\");\n}\n\n}\n```\n\n我们的 `Model` 类起初非常简单，包含了我们想要为其 getter/setter\
  \ 的属性，以及用于重写异常生成的方法。`_types` 属性存储了我们的模型能够理解的简单数据类型，并在内部和外部都用于验证。在为模型/数据库表创建 SQL\
