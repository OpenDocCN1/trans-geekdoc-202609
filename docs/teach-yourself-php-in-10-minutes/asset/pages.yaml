  md: "# # Multidimensional Arrays\n\nIt is possibleand often very usefulto use arrays\
    \ to store two-dimensional or even multidimensional data.\n\n# ## Accessing Two-Dimensional\
    \ Data\n\nIn fact, a *two-dimensional array* is an array of arrays. Suppose you\
    \ were to use an array to store the average monthly temperature, by year, using\
    \ two key dimensionsthe month and the year. You might display the average temperature\
    \ from February 1995 as follows:\n\n```\necho $temps[1995][\"feb\"];\n```\n\n\
    Because `$temps` is an array of arrays, `$temps[1995]` is an array of temperatures,\
    \ indexed by month, and you can reference its elements by adding the key name\
    \ in square brackets.\n\n# ## Defining a Multidimensional Array\n\nDefining a\
    \ multidimensional array is fairly straightforward, as long as you remember that\
    \ what you are working with is actually an array that contains more arrays.\n\n\
    You can initialize values by using references to the individual elements, as follows:\n\
    \n```\n$temps[1995][\"feb\"] = 41;\n```\n\nYou can also define multidimensional\
    \ arrays by nesting the array function in the appropriate places. The following\
