- pgno: 49
  md: "# # Arguments and Return Values\n\nEvery function call consists of the function\
    \ name followed by a list of arguments in parentheses. If there is more than one\
    \ argument, the list items are separated with commas. Some functions do not require\
    \ any arguments at all, but a pair of parentheses is still requiredeven if there\
    \ are no arguments contained in them.\n\nThe built-in function phpinfo generates\
    \ a web page that contains a lot of information about the PHP module. This function\
    \ does not require any arguments, so it can be called from a script that is as\
    \ simple as\n\n```\n<?php phpinfo(); ?>\n```\n\nIf you create this script and\
    \ point a web browser at it, you will see a web page that contains system information\
    \ and configuration settings.\n\n# ## Returning Success or Failure\n\nBecause\
    \ phpinfo generates its own output, you do not need to prefix it with echo , but,\
    \ for the same reason, you cannot assign the web page it produces to a variable.\
    \ In fact, the return value from phpinfo is the integer value 1 .\n\n> **Returning\
    \ True and False** Functions that do not have an explicit return value usually\
    \ use a return code to indicate whether their operation has completed successfully.\
    \ A zero value (FALSE ) indicates failure, and a nonzero value (TRUE ) indicates\
    \ success.\n\nThe following example uses the mail function to attempt to send\
    \ an email from a PHP script. The first three arguments to mail specify the recipient's\
    \ email address, the message subject, and the message body. The return value of\
    \ mail is used in an if condition to check whether the function was successful:\n\
    \n```\nif (mail(\"chris@lightwood.net\",\n    \"Hello\", \"This is a test email\"\
    )) {\n  echo \"Email was sent successfully\";\n} else {\n  echo \"Email could\
    \ not be sent\";\n}\n```"
