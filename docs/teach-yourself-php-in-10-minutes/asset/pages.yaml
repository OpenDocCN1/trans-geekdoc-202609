- pgno: 244
  md: '# Configuration Settings


    PHP allows you to tune many aspects of its behavior by using a set of configuration
    directives. These directives can be global for your entire web server, or you
    can make local changes that apply only to certain scripts.


    # Using php.ini


    PHP''s configuration file is named php.ini . Its location is set at compile time;
    by default, it is located in /usr/local/lib/php.ini on Linux/Unix servers and
    C:\WINDOWS\php.ini on Windows systems.


    The php.ini file contains a list of configuration directives and their values,
    separated by equals signs. The default php.ini file distributed with PHP is well
    documented, with plenty of comments. Any line that begins with a semicolon is
    considered a comment, and sections of the file are broken up using headings in
    square brackets, which the compiler also ignores.


    Listing 23.1 shows an extract from an unchanged php.ini file for PHP 5 that contains
    the log settings. As you can see, for many setting changes, you do not even need
    to refer to the online documentation.


    # Listing 23.1. An Extract from php.ini


    ```

    ; Print out errors (as a part of the output). For

    ; production web sites,

    ; you''re strongly encouraged to turn this feature off,

    ; and use error logging

    ; instead (see below). Keeping display_errors enabled

    ; on a production web site

    ; may reveal security information to end users, such as

    ; file paths on your Web

    ; server, your database schema or other information.

    display_errors = On


    ; Even when display_errors is on, errors that occur

    ; during PHP''s startup

    ; sequence are not displayed. It''s strongly recommended

    ; to keep

    ; display_startup_errors off, except for when debugging.

    display_startup_errors = Off


    ; Log errors into a log file (server-specific log, stderr,

    ; or error_log (below))

    ; As stated above, you''re strongly advised to use error

    ; logging in place of

    ; error displaying on production web sites.

    log_errors = Off

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: '```

    ; Set maximum length of log_errors. In error_log information

    ; about the source is

    ; added. The default is 1024 and 0 allows to not apply any

    ;maximum length at all

    .

    log_errors_max_len = 1024

    ```


    > **True or False** Boolean values in `php.ini` can be set to `true` (that is,
    `on` or `yes` ) or `false` (that is, `off` , `no` , or `none` ). These values
    are not case-sensitive.


    When it runs as a web server module, `php.ini` is read when the web server process
    starts, and changes made to the configuration file do not take place until the
    web server is restarted.


    If your web server runs PHP as a CGI binary, the `php.ini` settings are loaded
    each time a script is run because a new `php` process is started. Similarly, command-line
    PHP loads the settings from `php.ini` each time a script is run.


    # Alternate php.ini Files


    You can create separate `php.ini` files to apply for the different ways PHP can
    be run. If you create a file named `php-SAPI.ini` (replacing `SAPI` with the a
    valid SAPI name), that file is read instead of the global `php.ini` .


    For instance, to provide a different set of directives only for command-line PHP,
    you would use a configuration file named `php-cli.ini` . For the Apache web server
    module, the filename would be `php-apache.ini` .


    On a Windows system, a `php.ini` file in the Apache installation directory is
    used before one in `C:\\WINDOWS` . This allows you to maintain different PHP settings
    for multiple web servers on the same machine.


    To force the use of a particular configuration file, you must invoke `php` with
    the `c` option. In a shell script, you might change the first line to the following
    to force a custom configuration file to be used only for that script:


    ```

    #!/usr/local/bin/php c /path/to/php.ini

    ```


    # Per-Directory Configuration


    Apache web server allows you to use a per-directory configuration file named `.htaccess`
    to supply custom web server directives. PHP supports the use of `.htaccess` to
    override the global settings from `php.ini` .'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'To give a new value for a PHP setting, you use `php_value` followed by the
    directive from `php.ini` and the new value. The following line in an `.htaccess`
    file gives a new value for `max_execution_time` of 60 seconds:


    ```

    `php_value max_execution_time 60`

    ```


    **Using .htaccess** Be aware of the syntax difference when changing configuration
    settings in `php.ini` and `.htaccess` . In `php.ini` there must be an equals sign
    between the directive name and the value. In `.htaccess` the value follows the
    directive name, with no equals sign.


    Changes made in `.htaccess` apply only to the directory in which it resides and
    its subdirectories. Any settings in `.htaccess` override the global `php.ini`
    as well as any settings made in an `.htaccess` file in a parent directory.


    # Dynamic Configuration


    You can alter values of directives set in `php.ini` on-the-fly by using the `ini_set`
    function. It takes two arguments: the directive name and the new value. When you
    change a setting by using `ini_set` , the return value is the previous setting
    for that directive.


    The following example changes the `memory_limit` setting for the current script
    to run a section of code that may require more resources than usual:


    ```

    $limit = ini_set("memory_limit", "128M");

    // Execute code that requires this setting

    ini_set("memory_limit", $limit);

    ```


    The previous value is saved to a variable and then restored when the intensive
    code has completed.


    To find the current value of any `php.ini` setting without changing it, you use
    the `ini_get` function.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# # Configuration Directives


    This lesson cannot cover every configuration directive in `php.ini` in detailthere
    are simply too many. However, in the following sections you will learn how some
    of the most commonly used settings work. For a full reference, refer to www.php.net/manual/en/ini.php
    .


    # # Configuring the PHP Environment


    The following sections list some of the common configuration directives that affect
    the environment in which PHP runs. Each directive listed in the following sections
    is shown with its default entry from the `php.ini` file that is distributed with
    PHP 5, where the default is set.


    # # PHP Tag Styles


    These directives allow you to select which tag styles can be used in a PHP script:


    +   - **short_open_tag = On** The `short_open_tag` directive enables or disables
    the use of the `<?` opening tag. If this setting is turned off, your scripts must
    use the full `<?php` tag.


    Because `<?` can have other meanings when embedded in a web page, you should try
    to avoid using `short_open_tag` , and in future releases of PHP, it may be disabled
    by default.


    +   - **asp_tags = Off** The `asp_tags` style of PHP tag begins with `<%` and
    ends with `%>` . You must enable this style in `php.ini` if you want to use it.


    # # System Resource Limits


    The following directives allow you to manage the system resources available to
    a PHP script:


    +   - **max_execution_time = 30**; The `max_execution_time` directive specifies
    the maximum total number of seconds that a script can run. After this time is
    exceeded, an error occurs, and script execution stops.


    Unless you have a specific need for a higher value in order to run slow scripts,
    you should not change this value. An accidental infinite loop in your script would
    eat up a lot of system resources, and `max_execution_time` is a safeguard against
    this kind of problem.


    If a web page takes 30 seconds or more to load, visitors will probably not wait
    for it to finish, unless they have requested some specific information that they
    understand may take some time to generate.


    +   - **memory_limit = 8M** Each PHP script has a memory usage limit to make sure
    that the work it is doing does not get out of control and affect the system in
    a negative way. Most scripts use only a very small amount of memory; to find out
    just how much, you can call the `memory_get_usage` function.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The M suffix indicates a value in megabytes; the `K` or `G` suffix could also
    be used, to indicate kilobytes or gigabytes, respectively. If you are absolutely
    sure you want to remove the memory limit completely, you can set `memory_limit`
    to `1` .


    # Form Processing


    You can use these directives to change the way PHP interacts with web forms:


    +   * **magic_quotes** The `magic_quotes` settings instruct PHP to automatically
    delimit quotes so that they are safe to use as string values. These are the defaults:


    ```

    magic_quotes_gpc = On

    magic_quotes_runtime = Off

    magic_quotes_sybase = Off

    ```


    The `magic_quotes_gpc` setting applies to data posted from a form and data from
    cookie values. (`gpc` stands for `GET` , `POST` , and `COOKIE` data.) The `magic_quotes_runtime`
    directive tells PHP to delimit quotes in data generated by the script, such as
    from a database query or host command.


    Usually, quotes are delimited with a backslash character, but some databases,
    notably Sybase, use another quote character. When the `magic_quotes_sybase` setting
    is enabled, delimited quotes appear as `''''` instead of `\''` .


    +   * **register_globals = Off** The `register_globals` setting has been disabled
    in PHP by default since version 4.2. When it is enabled, this option causes PHP
    to create global variables that contain the same information as the super-globals
    `$_ENV` , `$_GET` , `$_POST` , `$_COOKIE` , and `$_SERVER` . The variable names
    correspond to the key names in each of the super-global arrays.


    +   * **variables_order = "EGPCS"** The `variables_order` directive determines
    the order in which global variables are registered from the super-globals. With
    `register_globals` enabled and the default ordering, a cookie named `email` is
    registered more recently than a posted form value with the same name, so `$email`
    in the script contains the cookie''s value.


    Because `register_globals` creates values that are not distinguished by their
    source, it is strongly recommended that you use the super-global arrays; when
    you do so, you can be confident that `$_POST["email"]` was a form-submitted value,
    but `$email` could have come from one of several sources.


    +   * **register_long_arrays = On** Older PHP versions use arrays named `$HTTP_GET_VARS`
    , `$HTTP_POST_VARS` , `$HTTP_SERVER_VARS` , and so on instead of the newer super-global
    arrays. The `register_long_arrays` directive determines whether arrays with these
    names are created. This feature remains enabled by default for backward compatibility.


    # Include Files


    You can use the `include_path` directive to give a list of locations in which
    to search for a file referenced in an `include` or `require` statement. The locations
    are separated by colons on Linux/Unix systems and by semicolons on Windows systems.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Often you need to ensure that include files are kept in a directory that is
    not directly accessible by a web server. The following example defines an include
    path that contains a directory parallel to the web root of /home/chris/public_html
    :


    ```

    php_value include_path ../home/chris/include

    ```


    The period character ( . ) is used to indicate the current working directory,
    and in this example, it is given higher priority than the defined include directory.
    In this case, if an include statement finds a matching file in both locations,
    the one in the working directory will be used. This type of configuration allows
    you to use shared library files across your server but override them for some
    scripts when necessary.


    The auto_prepend_file and auto_append_file directives allow you to specify files
    that are automatically added at the start and end of each PHP script. The filename
    given is found in include_path , or a full path to the file can be given.


    A common use for auto_prepend_file is to automatically include part of the HTML
    layout before the output from your script so that all your pages look the same.
    Because auto_prepend_file is a PHP feature, only files parsed by PHP have the
    file prepended; static HTML pages do not.


    ![](img/2edc6e6954e3485ad7d94117645931d8_249_0.png)


    > **HTTP Headers** After any output has been sent to the browser, you cannot use
    the header function to send HTTP headers or use any other PHP functions that require
    headers to be sent, such as session control functions or cookies. Therefore, any
    script included by auto_prepend_file must produce no output if you want to send
    custom HTTP headers.


    # Error Logging


    As you learned in Lesson 22 , "Error Handling," PHP allows you to configure the
    strictness of error reporting and the means by which it is reported.


    The value of the error_reporting directive is a bitmask comprised of the values
    found in Table 22.1 in Lesson 22 . You can use logical operators to combine values
    as follows:


    ```

    error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT

    ```


    The display_errors and log_errors directives determine whether an error is written
    to the screen display and web server log file, respectively.


    The default settings are as follows, with errors displayed to screen and not written
    to a file:'
  merge: -1
  img_proc: true
- pgno: 250
  md: '```

    display_errors = On

    log_errors = Off

    ```


    You can use the error_log directive to specify an alternate filename, as in the
    following example:


    ```

    error_log = /tmp/php_log

    ```


    # Configuring PHP Extensions


    Some PHP extensions have their own directives that can be configured in php.ini
    to adjust the behavior of that extension.


    For clarity in the configuration file, section headings are used to separate extension-specific
    settings. For instance, all the settings that affect the MySQL extension are found
    in a section of php.ini that begins [MySQL] . Each directive name also has a prefix
    that indicates the extension to which it belongs (for example, mysql.connect_timeout
    or session.cookie_path ).


    You can find documentation for extension-specific configuration directives in
    the online manual pages for each extension.


    # Configuring System Security


    Some of the directives in php.ini that are not covered in this lessonmost notably
    the safe_mode directive and its related settingsconcern server security. These
    configuration options allow you to restrict certain types of functionality on
    the web server, and you will learn about them in Lesson 24 , "PHP Security."'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# # Loadable Modules


    PHP allows you to load certain extensions at runtime. This means that you can
    extend the functionality of PHP without needing to recompile from source.


    # ## Loading Extensions on Demand


    You use the dl function to dynamically load an extension module. You build extensions
    as dynamically loadable objects when PHP is compiled, by using the --with-EXTENSION=shared
    switch. For instance, running the following configure statement causes PHP to
    be compiled with MySQL support linked in but with socket support as a loadable
    extension:


    ```

    ./configure --with-mysql --with-sockets=shared

    ```


    The argument given to dl is the filename of the extension. In the case of the
    sockets extension, it would be called sockets.so on Linux/Unix but php_sockets.dll
    on Windows systems.


    **Loadable Extensions** Whether the dl function is available is governed by the
    enable_dl directive in php.ini . You may find that on a shared web hosting service,
    this feature is not available to you.


    To check whether an extension is loaded into PHP, you use the extension_loaded
    function. Given an extension name argument, this function returns trUE or FALSE
    , depending on the presence of that extension. Note that PHP cannot tell whether
    an extension was loaded by using dl or is compiled in.


    # ## Loading Modules on Startup


    If you have extensions as loadable modules and want them to be loaded into PHP
    without needing to run dl in every script, you can use the extension directive
    in php.ini to provide a list of extensions to load at startup.


    Each extension is given on a separate line, and there is no limit to the number
    of extensions you can load in this way. The following lines from php.ini ensure
    that the sockets and imap extensions are loaded automatically on a Linux/Unix
    server:


    ```

    extension=imap.so

    extension=sockets.so

    ```'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'On a Windows web server, the configuration lines need to look like this, to
    reflect the difference in filenames between the two platforms:


    ```

    extension=php_imap.dll

    extension=php_sockets.dll

    ```'
  merge: -1
  img_proc: true
