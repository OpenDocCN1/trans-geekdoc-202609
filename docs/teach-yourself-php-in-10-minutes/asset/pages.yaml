    \ a comparison based on the ASCII values of the individual characters in the strings.\
    \ The following condition could be used to divide people into two groups, based\
    \ on their last namethose with names beginning AM and those beginning NZ:\n\n\
    ```\nif ($last_name < \"N\")\n    echo \"You are in group 1\";\nelse\n    echo\
    \ \"You are in group 2\";\n```\n\n![](img/2edc6e6954e3485ad7d94117645931d8_70_0.png)\n\
    \n**ASCII Values** Because string comparisons are done on their underlying ASCII\
    \ values, all lowercase letters have higher values than their equivalent uppercase\
    \ letters. Letters az have values 97122, whereas AZ occupy values 6590."
