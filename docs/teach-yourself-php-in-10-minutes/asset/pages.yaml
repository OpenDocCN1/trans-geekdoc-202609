    *In this lesson you will find out what PHP is all about and see what it is able
    to do.*'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# PHP Basics


    There is a good chance you already know a bit about what PHP can do—that is probably
    why you have picked up this book. PHP is hugely popular, and rightly so. Even
    if you haven''t come across an existing user singing its praises, you''ve almost
    certainly used a website that runs on PHP. This lesson clarifies what PHP does,
    how it works, and what it is capable of.


    PHP is a programming language that was designed for creating dynamic websites.
    It slots into your web server and processes instructions contained in a web page
    before that page is sent through to your web browser. Certain elements of the
    page can therefore be generated on-the-fly so that the page changes each time
    it is loaded. For instance, you can use PHP to show the current date and time
    at the top of each page in your site, as you''ll see later in this lesson.


    The name PHP is a recursive acronym that stands for *PHP: Hypertext Preprocessor*.
    It began life called PHP/FI, the "FI" part standing for *Forms Interpreter*. Though
    the name was shortened a while back, one of PHP''s most powerful features is how
    easy it becomes to process data submitted in HTML forms. PHP can also talk to
    various database systems, giving you the ability to generate a web page based
    on a SQL query.


    For example, you could enter a search keyword into a form field on a web page,
    query a database with this value, and produce a page of matching results. You
    will have seen this kind of application many times before, at virtually any online
    store as well as many websites that do not sell anything, such as search engines.


    The PHP language is flexible and fairly forgiving, making it easy to learn even
    if you have not done any programming in the past. If you already know another
    language, you will almost certainly find similarities here. PHP looks like a cross
    between C, Perl, and Java, and if you are familiar with any of these, you will
    find that you can adapt your existing programming style to PHP with little effort.


    # Server-Side Scripting


    The most important concept to learn when starting out with PHP is where exactly
    it fits into the grand scheme of things in a web environment. When you understand
    this, you will understand what PHP can and cannot do.


    The PHP module attaches to your web server, telling it that files with a particular
    extension should be examined for PHP code. Any PHP code found in the page is executed
    with any PHP code replaced by the output it produces before the web page is sent
    to the browser.


    **File Extensions** The usual web server configuration is that `somefile.php`
    will be interpreted by PHP, whereas `somefile.html` will be passed straight through
    to the web browser, without PHP getting involved.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The only time the PHP interpreter is called upon to do something is when a
    web page is loaded. This could be when you click a link, submit a form, or just
    type in the URL of a web page. When the web browser has finished downloading the
    page, PHP plays no further part until your browser requests another page.


    Because it is only possible to check the values entered in an HTML form when the
    submit button is clicked, PHP cannot be used to perform client-side validationin
    other words, to check that the value entered in one field meets certain criteria
    before allowing you to proceed to the next field. Client-side validation can be
    done using JavaScript, a language that runs inside the web browser itself, and
    JavaScript and PHP can be used together if that is the effect you require.


    The beauty of PHP is that it does not rely on the web browser at all; your script
    will run the same way whatever browser you use. When writing server-side code,
    you do not need to worry about JavaScript being enabled or about compatibility
    with older browsers beyond the ability to display HTML that your script generates
    or is embedded in.


    # PHP Tags


    Consider the following extract from a PHP-driven web page that displays the current
    date:


    ```

    Today is <?php echo date(''j F Y'');?>

    ```


    The <?php tag tells PHP that everything that follows is program code rather than
    HTML, until the closing ?> tag. In this example, the echo command tells PHP to
    display the next item to screen; the following date command produces a formatted
    version of the current date, containing the day, month, and year.


    ![](img/2edc6e6954e3485ad7d94117645931d8_18_0.png)


    **The Statement Terminator** The semicolon character is used to indicate the end
    of a PHP command. In the previous examples, there is only one command, and the
    semicolon is not actually required, but it is good practice to always include
    it to show that a command is complete.


    In this book PHP code appears inside tags that look like <?php ... ?>. Other tag
    styles can be used, so you may come across other people''s PHP code beginning
    with tags that look like <? (the short tag), <% (the ASP tag style) or <SCRIPT
    LANGUAGE="php"> (the script tag).


    Of the different tag styles that can be used, only the full <?php tag and the
    script tag are always available. The others are turned off or on by using a PHP
    configuration setting. We will look at the php.ini configuration file in Lesson
    23 , "PHP Configuration."'
  merge: -1
  img_proc: true
- pgno: 19
  md: '**Standard PHP Tags** It is good practice to always use the `<?php` tag style
    so your code will run on any system that has PHP installed, with no additional
    configuration needed. If you are tempted to use `<?` as a shortcut, know that
    any time you move your code to another web server, you need to be sure it will
    understand this tag style.


    Anything that is not enclosed in PHP tags is passed straight through to the browser,
    exactly as it appears in the script. Therefore, in the previous example, the text
    `Today is` appears before the generated date when the page is displayed.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Your First Script


    Before you go any further, you need to make sure you can create and run PHP scripts
    as you go through the examples in this book. This could be on your own machine,
    and you can find instructions for installing PHP in Appendix A , ''Installing
    PHP.'' Also, many web hosting companies include PHP in their packages, and you
    may already have access to a suitable piece of web space.


    Go ahead and create a new file called `time.php` that contains Listing 1.1 , in
    a location that can be accessed by a PHP-enabled web server. This is a slight
    variation on the date example shown previously.


    # Listing 1.1. Displaying the System Date and Time


    ```

    ```php

    The time is

    <?php echo date(''H:i:s'');?>

    and the date is

    <?php echo date(''j F Y'');?>

    ```

    ```


    When you enter the URL to this file in your web browser, you should see the current
    date and time, according to the system clock on your web server, displayed.


    Running PHP Locally If you are running PHP from your local PC, PHP code in a script
    will be executed only if it is accessed through a web server that has the PHP
    module enabled. If you open a local script directly in the web browserfor instance,
    by double-clicking or dragging and dropping the file into the browserit will be
    treated as HTML only.


    Web Document Location If you were using a default Apache installation in Windows,
    you would create `time.php` in the folder `C:\Program Files\Apache Group\Apache\htdocs`,
    and the correct URL would be http://localhost/time.php.


    If you entered Listing 1.1 exactly as shown, you might notice that the actual
    output produced could be formatted a little betterthere is no space between the
    time and the word _and_ . Any line in'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'a script that only contains code inside PHP tags will not take up a line of
    output in the generated HTML.


    If you use the View Source option in your web browser, you can see the exact output
    produced by your script, which should look similar to the following:


    ```

    The time is

    15:33:09and the date is

    13 October 2004

    ```


    If you insert a space character after ?>, that line now contains non-PHP elements,
    and the output is spaced correctly.


    # The echo Command


    While PHP is great for embedding small, dynamic elements inside a web page, in
    fact the whole page could consist of a set of PHP instructions to generate the
    output if the entire script were enclosed in PHP tags.


    The echo command is used to send output to the browser. Listing 1.1 uses echo
    to display the result of the date command, which returns a string that contains
    a formatted version of the current date. Listing 1.2 does the same thing but uses
    a series of echo commands in a single block of PHP code to display the date and
    time.


    # Listing 1.2. Using echo to Send Output to the Browser


    ```

    <?php

    echo "The time is ";

    echo date(''H:i:s'');

    echo " and the date is ";

    echo date(''j F Y'');

    ?>

    ```


    The non-dynamic text elements you want to output are contained in quotation marks.
    Either double quotes (as used in Listing 1.2 ) or single quotes (the same character
    used for an apostrophe) can be used to enclose text strings, although you will
    see an important difference between the two styles in Lesson 2 , "Variables."
    The following statements are equally valid:


    ```

    echo "The time is ";

    echo ''The time is '';

    ```


    Notice that space characters are used in these statements inside the quotation
    marks to ensure that the output from date is spaced away from the surrounding
    text. In fact the output from Listing 1.2 is slightly different from that for
    Listing 1.1 , but in a web browser you will need to use'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'View Source to see the difference. The raw output from Listing 1.2 is as follows:


    ```

    ```

    The time is 15:59:50 and the date is 13 October 2004

    ```

    ```


    There are no line breaks in the page source produced this time. In a web browser,
    the output looks just the same as for Listing 1.1 because in HTML all whitespace,
    including carriage returns and multiple space or tab characters, is displayed
    as a single space in a rendered web page.


    A newline character inside a PHP code block does not form part of the output.
    Line breaks can be used to format the code in a readable way, but several short
    commands could appear on the same line of code, or a long command could span several
    linesthat''s why you use the semicolon to indicate the end of a command.


    Listing 1.3 is identical to Listing 1.2 except that the formatting makes this
    script almost unreadable.


    # Listing 1.3. A Badly Formatted Script That Displays the Date and Time


    ```

    ```php

    <?php echo "The time is "; echo date(''H:i:s''); echo

    " and the date is "

    ; echo date(

    ''j F Y''

    );

    ?>

    ```

    ```


    **Using Newlines** If you wanted to send an explicit newline character to the
    web browser, you could use the character sequence \n . There are several character
    sequences like this that have special meanings, and you will see more of them
    in Lesson 6 , "Working with Strings."


    # Comments


    Another way to make sure your code remains readable is by adding comments to it.
    A comment is a piece of free text that can appear anywhere in a script and is
    completely ignored by PHP. The different comment styles supported by PHP are shown
    in Table 1.1 .


    # Table 1.1. Comment Styles in PHP'
  merge: -1
  img_proc: true
- pgno: 23
  md: "| Comment | Description |\n|---|---|\n| // or # | Single-line comment. Everything\
    \ to the end of the current line is ignored. |\n| /* ... */ | Single- or multiple-line\
    \ comment. Everything between /* and */ is ignored. |\n\nListing 1.4 produces\
    \ the same formatted date and time as Listings 1.1 , 1.2 , and 1.3 , but it contains\
    \ an abundance of comments. Because the comments are just ignored by PHP, the\
    \ output produced consists of only the date and time.\n\n# Listing 1.4. Using\
    \ Comments in a Script\n\n```\n```php\n<?php\n/* time.php\n   This script prints\
    \ the current date\n   and time in the web browser\n*/\n\necho \"The time is \"\
    ;\necho date('H:i:s'); // Hours, minutes, seconds\n\necho \" and the date is \"\
    ;\necho date('j F Y'); // Day name, month name, year\n?>\n```\n```\n\nListing\
