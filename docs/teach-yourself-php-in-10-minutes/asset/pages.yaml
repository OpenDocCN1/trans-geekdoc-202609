    ![](img/2edc6e6954e3485ad7d94117645931d8_54_0.png)


    **Require** The require and require_once instructions work in a similar way to
    include and include_once but have subtly different behavior. In the event of an
    error, include generates a warning, but the script carries on running as best
    it can. A failure from a require statement causes the script to exit immediately.'
