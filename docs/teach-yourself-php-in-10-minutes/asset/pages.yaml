- pgno: 35
  md: "# Conditional Statements\n\nA conditional statement in PHP begins with the\
    \ keyword `if` , followed by a condition in parentheses. The following example\
    \ checks whether the value of the variable `$number` is less than 10, and the\
    \ `echo` statement displays its message only if this is the case:\n\n```\n$number\
    \ = 5;\nif ($number < 10) {\n    echo \"$number is less than ten\";\n}\n```\n\n\
    The condition `$number < 10` is satisfied if the value on the left of the `<`\
    \ symbol is smaller than the value on the right. If this condition holds true,\
    \ then the code in the following set of braces will be executed; otherwise, the\
    \ script jumps to the next statement after the closing brace.\n\n**Boolean Values**\
    \ Every conditional expression evaluates to a Boolean value, and an `if` statement\
    \ simply acts on a `true` or `FALSE` value to determine whether the next block\
    \ of code should be executed. Any zero value in PHP is considered `FALSE` , and\
    \ any nonzero value is considered `true` .\n\nAs it stands, the previous example\
    \ will be `trUE` because 5 is less than 10, so the statement in braces is executed,\
    \ and the corresponding output is displayed. Now, if you change the initial value\
    \ of `$number` to 10 or higher and rerun the script, the condition fails, and\
    \ no output is produced.\n\nBraces are used in PHP to group blocks of code together.\
    \ In a conditional statement, they surround the section of code that is to be\
    \ executed if the preceding condition is true.\n\n**Brackets and Braces** You\
    \ will come across three types of brackets when writing PHP scripts. The most\
    \ commonly used terminology for each type is parentheses `( )` , braces `{ }`\
    \ , and square brackets `[ ]` .\n\nBraces are not required after an `if` statement.\
    \ If they are omitted, the following single statement is executed if the condition\
    \ is true. Any subsequent statements are executed, regardless of the status of\
    \ the conditional."
  merge: -1
  img_proc: true
- pgno: 36
  md: '**Braces and Indentation** Although how your code is indented makes no difference
    to PHP, it is customary to indent blocks of code inside braces with a few space
    characters to visually separate that block from other statements.


    Even if you only want a condition or loop to apply to one statement, it is still
    useful to use braces for clarity. It is particularly important in order to keep
    things readable when you''re nesting multiple constructs.


    # # Conditional Operators


    PHP allows you to perform a number of different comparisons, to check for the
    equality or relative size of two values. PHP''s conditional operators are shown
    in Table 3.1 .


    # **Table 3.1. Conditional Operators in PHP**


    | Operator | Description |

    | --- | --- |

    | == | Is equal to |

    | === | Is identical to (is equal and is the same data type) |

    | != | Is not equal to |

    | !== | Is not identical to |

    | < | Is less than |

    | <= | Is less than or equal to |

    | > | Is greater than |

    | >= | Is greater than or equal to |


    > = or ==? Be careful when comparing for equality to use a double equals symbol
    (==). A single = is always an assignment operator and, unless the value assigned
    is zero, your condition will always return trueand remember that TRUE is any nonzero
    value. Always use == when comparing two values to avoid headaches.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# # Logical Operators\n\nYou can combine multiple expressions to check two\
    \ or more criteria in a single conditional statement. For example, the following\
    \ statement checks whether the value of $number is between 5 and 10:\n\n```\n\
    ```php\n$number = 8;\nif ($number >= 5 and $number <= 10) {\n  echo \"$number\
    \ is between five and ten\";\n}\n```\n```\n\nThe keyword and is a logical operator,\
    \ which signifies that the overall condition will be true only if the expressions\
    \ on either side are true. That is, $number has to be both greater than or equal\
    \ to 5 and less than or equal to 10.\n\nTable 3.2 shows the logical operators\
    \ that can be used in PHP.\n\n# Table 3.2. Logical Operators in PHP\n\n| Operator\
    \ | Name | Description |\n| :--- | :--- | :--- |\n| `! a` | NOT | True if `a`\
    \ is not true |\n| `a && b` | AND | True if both `a` and `b` are true |\n| `a\
    \ || b` | OR | True if either `a` or `b` is true |\n| `a and b` | AND | True if\
    \ both `a` and `b` are true |\n| `a xor b` | XOR | True if `a` or `b` is true,\
    \ but not both |\n| `a or b` | OR | True if either `a` or `b` is true |\n\nYou\
    \ may have noticed that there are two different ways of performing a logical AND\
    \ or OR in PHP. The difference between `and` and `&&` (and between `or` and `||`\
    \ ) is the precedence used to evaluate expressions.\n\nTable 3.2 lists the highest-precedence\
    \ operators first. The following conditions, which appear to do the same thing,\
    \ are subtly but significantly different:\n\n```\n```\na or b and c\na || b and\
    \ c\n```\n```\n\nIn the former condition, the `and` takes precedence and is evaluated\
    \ first. The overall condition is true if `a` is true or if both `b` and `c` are\
    \ true.\n\nIn the latter condition, the `||` takes precedence, so `c` must be\
    \ true, as must either `a` or `b` , to"
  merge: -1
  img_proc: true
- pgno: 38
  md: "satisfy the condition.\n\n**Operator Symbols** Note that the logical AND and\
    \ OR operators are the double symbols `&&` and `||` , respectively. These symbols,\
    \ when used singularly, have a different meaning, as you will see in Lesson 5\
    \ , \"Working with Numbers.\"\n\n# # Multiple Condition Branches\n\nBy using an\
    \ `else` clause with an `if` statement, you can specify an alternate action to\
    \ be taken if the condition is not met. The following example tests the value\
    \ of `$number` and displays a message that says whether it is greater than or\
    \ less than 10:\n\n```\n```php\n$number = 16;\nif ($number < 10) {\n     echo\
    \ \"$number is less than ten\";\n}\nelse {\n     echo \"$number is more than ten\"\
    ;\n}\n```\n```\n\nThe `else` clause provides an either/or mechanism for conditional\
    \ statements. To add more branches to a conditional statement, the `elseif` keyword\
    \ can be used to add a further condition that is checked only if the previous\
    \ condition in the statement fails.\n\nThe following example uses the `date` function\
    \ to find the current time of day`date(\"H\")` gives a number between 0 and 23\
    \ that represents the hour on the clockand displays an appropriate greeting:\n\
    \n```\n```php\n$hour = date(\"H\");\nif ($hour < 12) {\n    echo \"Good morning\"\
    ;\n}\nelseif ($hour < 17) {\n    echo \"Good afternoon\";\n}\nelse {\n    echo\
    \ \"Good evening\";\n}\n```\n```\n\nThis code displays `Good morning` if the server\
    \ time is between midnight and 11:59, `Good afternoon` from midday to 4:59 p.m.,\
    \ and `Good evening` from 5 p.m. onward.\n\nNotice that the `elseif` condition\
    \ only checks that `$hour` is less than 17 (5 p.m.). It does not need"
  merge: -1
  img_proc: true
- pgno: 39
  md: "to check that the value is between 12 and 17 because the initial `if` condition\
    \ ensures that PHP will not get as far as the `elseif` if `$hour` is less than\
    \ 12.\n\nThe code in the `else` clause is executed if all else fails. For values\
    \ of `$hour` that are 17 or higher, neither the `if` nor the `elseif` condition\
    \ will be true.\n\n**elseif Versus else if** In PHP you can also write `elseif`\
    \ as two words: `else if` . The way PHP interprets this variation is slightly\
    \ different, but its behavior is exactly the same.\n\n# The `switch` Statement\n\
    \nAn `if` statement can contain as many `elseif` clauses as you need, but including\
    \ many of these clauses can often create cumbersome code, and an alternative is\
    \ available. `switch` is a conditional statement that can have multiple branches\
    \ in a much more compact format.\n\nThe following example uses a `switch` statement\
    \ to check `$name` against two lists to see whether it belongs to a friend:\n\n\
    ```\nswitch ($name) {\ncase \"Damon\":\ncase \"Shelley\":\n    echo \"Welcome,\
    \ $name, you are my friend\";\n    break;\ncase \"Adolf\":\ncase \"Saddam\":\n\
    \    echo \"You are no friend of mine, $name\";\n    break;\ndefault:\n    echo\
    \ \"I do not know who you are, $name\";\n}\n```\n\nEach `case` statement defines\
    \ a value for which the next block of PHP code will be executed. If you assign\
    \ your first name to `$name` and run this script, you will be greeted as a friend\
    \ if your name is Damon or Shelley, and you will be told that you are not a friend\
    \ if your name is either Adolf or Saddam. If you have any other name, the script\
    \ will tell you it does not know who you are.\n\nThere can be any number of `case`\
    \ statements preceding the PHP code to which they relate. If the value that is\
    \ being tested by the `switch` statement (in this case `$name` ) matches any one\
    \ of them, any subsequent PHP code will be executed until a `break` command is\
    \ reached."
  merge: -1
  img_proc: true
