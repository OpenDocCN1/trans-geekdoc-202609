  md: "selections would be picked by default, with the option to change it if desired\
    \ (a radio button cannot be deselected except when another button in the same\
    \ group is selected):\n\n```\n<INPUT TYPE=\"RADIO\" CHECKED\nNAME=\"shipping\"\
    \ VALUE=\"economy\"> Economy\n<INPUT TYPE=\"RADIO\" NAME=\"shipping\" VALUE=\"\
    express\"> Standard\n<INPUT TYPE=\"RADIO\" NAME=\"shipping\" VALUE=\"express\"\
    > Express\n```\n\nTo dynamically assign the CHECKED attribute to one of the items\
    \ in the radio button group, each one must contain a condition that checks the\
    \ current value of $shipping against the value that corresponds to that item.\
    \ Listing 12.2 gives an example.\n\n# Listing 12.2. Selecting a Default Radio\
    \ Button Group Item\n\n```\n<?php\nif (!isset($shipping))\n  $shipping = \"economy\"\
    ;\n\necho \"Your order will be sent via $shipping shipping\";\n?>\n<FORM ACTION=\"\
    shipping.php\" METHOD=POST>\n\n<INPUT TYPE=\"RADIO\" NAME=\"shipping\" VALUE=\"\
    economy\"\n<?php if ($shipping == \"economy\") echo \"CHECKED\"; ?>> Economy\n\
    \n<INPUT TYPE=\"RADIO\" NAME=\"shipping\" VALUE=\"standard\"\n<?php if ($shipping\
    \ == \"standard\") echo \"CHECKED\"; ?>>\nStandard\n\n<INPUT TYPE=\"RADIO\" NAME=\"\
    shipping\" VALUE=\"express\"\n<?php if ($shipping == \"express\") echo \"CHECKED\"\
    ; ?>> Express\n<INPUT TYPE=\"SUBMIT\" VALUE=\"Change shipping option\">\n</FORM>\n\
    ```\n\nNotice how cumbersome this is, even for a short radio button group of just\
    \ three items. Later in this lesson you will learn how to create radio button\
    \ groups on-the-fly so that larger radio button groups can be managed in a much\
    \ more elegant way.\n\n# Defaulting a Selection in a Menu\n\nThe SELECTED attribute\
    \ in an <OPTION> tag specifies which item is to be selected by default. If no\
