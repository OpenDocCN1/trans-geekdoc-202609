- pgno: 80
  md: '# What Is an Array?


    An _array_ is a variable type that can store and index a set of values. An array
    is useful when the

    data you want to store has something in common or is logically grouped into a
    set.


    # Creating and Accessing Arrays


    Suppose you wanted to store the average temperature for each month of the year.
    Using single-

    value variables also known as _scalar variables_ you would need 12 different variables
    `$temp_jan` ,

    `$temp_feb` , and so onto store the values. By using an array, you can use a single
    variable name

    to group the values together and let an index key indicate which month each value
    refers to.


    The following PHP statement declares an array called `$temps` and assigns it 12
    values that

    represent the temperatures for January through December:


    ```

    `$temps = array(38, 40, 49, 60, 70, 79,

    84, 83, 76, 65, 54, 42);`

    ```


    The array `$temps` that is created contains 12 values that are indexed with numeric
    key values

    from `0` to `11` . To reference an indexed value from an array, you suffix the
    variable name with the

    index key. To display March''s temperature, for example, you would use the following:


    ```

    `echo $temps[2];`

    ```


    **Index Numbers** Because index values begin at zero by default, the

    value for Marchthe third monthis contained in the second element of

    the array.


    The square brackets syntax can also be used to assign values to array elements.
    To set a new

    value for November, for instance, you could use the following:


    ```

    `$temps[10] = 56;`

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: "**The array Function** The array function is a shortcut function that quickly\
    \ builds an array from a supplied list of values, rather than adding each element\
    \ in turn.\n\nIf you omit the index number when assigning an array element, the\
    \ next highest index number will automatically be used. Starting with an empty\
    \ array $temps , the following code would begin to build the same array as before:\n\
    \n```\n$temps[] = 38;\n$temps[] = 40;\n$temps[] = 49;\n...\n```\n\nIn this example,\
    \ the value 38 would be assigned to $temps[0] , 40 to $temps[1] , and so on. If\
    \ you want to make sure that these assignments begin with $temps[0] , it’s a good\
    \ idea to initialize the array first to make sure there is no existing data in\
    \ that array. You can initialize the $temps array with the following command:\n\
    \n```\n$temps = array();\n```\n\n# Outputting the Contents of an Array\n\nPHP\
    \ includes a handy function, print_r , that can be used to recursively output\
    \ all the values stored in an array. The following script defines the array of\
    \ temperature values and then displays its contents onscreen:\n\n```\n$temps =\
    \ array(38, 40, 49, 60, 70, 79,\n84, 83, 76, 65, 54, 42);\nprint \"<PRE>\";\n\
    print_r($temps);\nprint \"</PRE>\";\n```\n\nThe <PRE> tags are needed around print_r\
    \ because the output generated is text formatted with spaces and newlines. The\
    \ output from this example is as follows:\n\n```\nArray\n(\n [0] => 38\n [1] =>\
    \ 40\n [2] => 49\n [3] => 60\n [4] => 70\n```"
  merge: -1
  img_proc: true
- pgno: 82
  md: "```\n[5] => 79\n[6] => 84\n[7] => 83\n[8] => 76\n[9] => 65\n[10] => 54\n[11]\
    \ => 42\n)\n```\n\n**print_r** The print_r function can be very useful when you're\
    \ developing scripts, although you will never use it as part of a live website.\
    \ If you are ever unsure about what is going on in an array, using print_r can\
    \ often shed light on the problem very quickly.\n\n# Looping Through an Array\n\
    \nYou can easily replicate the way print_r loops through every element in an array\
    \ by using a loop construct to perform another action for each value in the array.\n\
    \nBy using a while loop, you can find all the index keys and their values from\
    \ an arraysimilar to using the print_r functionsas follows:\n\n```\nwhile (list($key,\
    \ $value) = each($temps)) {\n    echo \"Key $key has value $val <br>\";\n}\n```\n\
    \nFor each element in the array, the index key value will be stored in $key and\
    \ the value in $value .\n\nPHP also provides another construct for traversing\
    \ arrays in a loop, using a foreach construct. Whether you use a while or foreach\
    \ loop is a matter of preference; you should use whichever you find easiest to\
    \ read.\n\nThe foreach loop equivalent to the previous example is as follows:\n\
    \n```\nforeach($temps as $key => $value) {\n...\n}\n```"
