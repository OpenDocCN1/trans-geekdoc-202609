- pgno: 167
  md: "Although the encrypted string cannot be decoded back to the original password,\
    \ every time you run crypt on the same password with the same salt , the result\
    \ is the same. Knowing this, you can store only the encrypted version of the password\
    \ and compare it to the freshly encrypted user input.\n\n> **Salt s** If you do\
    \ not specify a salt , a random one is chosen so subsequent calls to crypt will\
    \ product different results. A two-character salt , as used by Unix password files\
    \ and htpasswd , is sufficient.\n\nHow a string encoded using crypt looks may\
    \ vary between different web servers as a system-level encryption library is used.\
    \ Encrypted passwords are not guaranteed to be portable between different systems.\
    \ The revised login.php file is shown in Listing 15.3 , but be aware that the\
    \ encrypted passwords shown may not be valid for your system.\n\n# Listing 15.3.\
    \ A Login Processor Script with Encrypted Passwords\n\n```\n<?php\nsession_start();\n\
    $passwords = array(\"chris\" => \"ZXsDiRf.VBlWQ\",\n    \"damon\" => \"bQLXBRzdBci7M\"\
    ,\n    \"shelley\" => \"KkTH39mVsoclc\",\n    \"vanessa\" => \"69SvRIB9QVukk\"\
    );\nif (!$_POST[\"username\"] or !$_POST[\"password\"]) {\n    echo \"You must\
    \ enter your username and password\";\n    exit;\n}\n$salt = substr($passwords[$_POST[\"\
    username\"]], 0, 2);\nif (crypt($_POST[\"password\"], $salt)\n    == $passwords[$_POST[\"\
    username\"]]) {\n    echo \"Login successful\";\n    $_SESSION[\"auth_username\"\
    ] = $_POST[\"username\"];\n} else {\n    echo \"Login incorrect\";\n}\n?>\n```\n\
    \nThe salt is always found in the first two characters of the encrypted string,\
    \ so you assign these two characters to $salt to use in the call to crypt . Other\
    \ than this, the process is identical to using plain-text passwords."
  merge: -1
  img_proc: true
- pgno: 168
  md: "# # Usability Considerations\n\nThe mechanism you have implemented so far is\
    \ fairly crude. Any login error results in a message being displayed and the script\
    \ ending. Even when a login is successful, the flow ends, and the user needs to\
    \ revisit a protected page directly.\n\nThe ideal login mechanism interrupts a\
    \ hit to a protected web page and displays its login form. Then, after successfully\
    \ authenticating, it forwards the user to the page he or she was originally trying\
    \ to access.\n\nOne way to add this enhancement is to check the name of the script\
    \ that the user attempted to access in auth.inc ; the script name and the query\
    \ string, if there was one, can be found in $_SERVER[\"REQUEST_URI\"] . The login\
    \ form would then be displayed by auth.inc itself, rather than being a separate\
    \ page.\n\nIf you add the following hidden input to the login form, the login\
    \ processor itself will know which script the user came from, and then you can\
    \ send the user back to the page he or she was trying to access.\n\n```\n<INPUT\
    \ TYPE=\"HIDDEN\" NAME=\"destination\"\n       VALUE=\"<?php print $_SERVER[\"\
    REQUEST_URI\"]; ?>\">\n```\n\nWhen authentication is successful, rather than print\
    \ a message to screen, you can forward the user to his or her destination by using\
    \ the following statement:\n\n```\nheader(\"Location: $_POST[\"destination\"]);\n\
    ```"
  merge: -1
  img_proc: true
