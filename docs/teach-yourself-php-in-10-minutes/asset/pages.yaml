    database?option=value

    ```


    # Table 20.2. Components of a DSN


    | Component | Description |

    |---|---|

    | phptype | Database back-end protocol to use (for example, mysql , oci8 ) |

    | dbsyntax | Optional parameters related to SQL syntax; for ODBC, should contain
    the database type (for example, access , mssql ) |

    | username | Username for database login |

    | password | Password for database login |

    | protocol | Connection protocol (for example, tcp , unix ) |

    | hostspec | Host specification, either hostname or hostname:port |

    | database | Database name |

    | option | Additional connection options; multiple options are separated by &
    |


    As shown in the first example of connecting to MySQL, not every component of the
    DSN is required. The exact syntax depends on what information your database back
    end needs.


    For instance, a connection to SQLitewhich requires no username , password , or
    hostspec would look like the following:


    ```

    sqlite:///path/to/dbfile

    ```


    On the other hand, a connection to a PostgreSQL server that is not running on
    a standard port number would require something more complex like this:


    ```

    pgsql://username:password@tcp(hostname:port)/dbname

    ```


    Database Types The database type values for the phptype argument are the values
    shown in the first column of Table 20.1 .


