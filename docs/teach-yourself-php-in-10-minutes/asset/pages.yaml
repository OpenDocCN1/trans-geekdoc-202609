- pgno: 214
  md: '# Installing the DB Class


    To check whether the DB class is installed on your web server, you can run the
    following command to display a list of installed packages:


    ```

    $ pear list

    ```


    If you need to install the DB class, you run the following command:


    ```

    $ pear install DB

    ```


    Note that you need to be an admin to install a PEAR class, so if you are using
    a shared web hosting service, you might need to contact your system administrator.


    Because the underlying PHP extensions are used, no additional database drivers
    are needed to communicate with each type of database from the DB class.


    > **Further Reading** To learn about the MySQL database, read *Sams Teach Yourself
    MySQL in 24 Hours* by Julie Meloni. Or, for a quick SQL language guide, refer
    to *Sams Teach Yourself SQL in 10 Minutes* by Ben Forta.


    # Data Source Names


    To connect to a database through the DB class, you need to construct a valid data
    source name (DSN), which is a single string that contains all the parameters required
    to connect and is formed in a similar manner to a URL that you might use to access
    a protected web page or FTP server.


    The following DSN can be used to connect to a MySQL database running on localhost
    :


    ```

    mysql://chris:mypassword@localhost/mydb

    ```


    The components of this DSN are the database back-end type (mysql ), username (chris
    ), password (mypassword ), host (localhost ), and database name (mydb ).


    The full syntax definition for a DSN is as follows, and the components that it
    can be constructed from are given in Table 20.2 .


    ```

    phptype(dbsyntax)://username:password@protocol+hostspec/

    ```'
  merge: -1
  img_proc: true
