- pgno: 171
  md: "# HTTP Headers\n\nEvery page downloaded from a web server is a result of an\
    \ exchange of HTTP dialogue. The web browser sends a set of instructions to indicate\
    \ which page it wants to view, and the server responds with a response that indicates\
    \ the success of the request, along with various other information that is not\
    \ displayed directly on the web page.\n\nThe following HTTP headers show some\
    \ of the information that is sent along with a typical web page from a PHP-enabled\
    \ web server:\n\n```\nHTTP/1.1 200 OK\nDate: Tue, 14 Dec 2004 21:17:28 GMT\nServer:\
    \ Apache/1.3.29 (Unix) mod_gzip/1.3.26.1a PHP/4.3.9\n     mod_ssl/2.8.16 OpenSSL/0.9.7c\n\
    X-Powered-By: PHP/4.3.9\nConnection: close\nContent-Type: text/html; charset=iso-8859-1\n\
    ```\n\n# Sending Custom Headers\n\nThe PHP function to send a custom HTTP header\
    \ is header . Let's start by sending a header that does nothing. Any header that\
    \ begins with X is considered to be for information only; for example, the X-Powered-By\
    \ header shows that PHP is enabled. To stamp your name in the HTTP headers in\
    \ your script, you could use the following:\n\n```\nheader(\"X-PHP-Author: Chris\
    \ Newman <chris@lightwood.net>\");\n```\n\nOf course, there is no reason you should\
    \ want to send a header like this, other than extreme vanity. A regular user browsing\
    \ the website would never even see this header!\n\nYou have already seen how cookies\
    \ are sent to a web browser by using the setcookie function. You have also seen\
    \ that what happens when this function is called is that a Set-Cookie HTTP header\
    \ is actually sent. The following two PHP statements are therefore equivalent:\n\
    \n```\nsetcookie(\"mycookie\", \"somevalue\");\nheader(\"Set-Cookie: mycookie=somevalue\"\
    );\n```\n\n# Redirection Headers"
  merge: -1
  img_proc: true
- pgno: 172
  md: "The header you will send most often is almost certain to be `Location`, which\
    \ instructs the web browser to redirect to another URL. You can use this header\
    \ to change the flow of a website according to events in script. Causing the user's\
    \ browser to forward to another page is as simple as this:\n\n```\nheader(\"Location:\
    \ anotherpage.php\");\n```\n\nYou can use either a relative or absolute URL in\
    \ the `Location` header, so you could even forward the user to another domain,\
    \ like so:\n\n```\nheader(\"Location: http://www.somedomain.com/newpage.php\"\
    );\n```\n\nWhen a `Location` header has been sent, you should halt the script\
    \ immediately, using `exit` , to make sure that no further output is sent to the\
    \ browser.\n\n# Checking Whether Headers Have Been Sent\n\nAs soon as PHP hits\
    \ the first piece of non-header output in a script, it makes sure all the necessary\
    \ headers have been sent to the web browser and begins to work on the page itself.\
    \ All the HTTP headers must be sent at once and must be sent before any of the\
    \ web page output.\n\nIf the headers have already been sent for a script and you\
    \ attempt to send another, PHP gives an error like this:\n\n[View full width]\n\
    Warning: Cannot modify header information - headers already sent by (output started\
    \ `/home/chris/ public_html/header.php:4)in /home/chris/ public_html/header.php\
    \ on line\n\nIn the case of a `Location` header, you don't need to display anything\
    \ on the page because the browser goes straight to the new URL. However, you still\
    \ need to be careful to avoid any HTML output, and particularly whitespace, before\
    \ the script begins; even a single carriage return before the opening `<?php`\
    \ tag will prevent you from being able to send custom HTTP headers.\n\nPHP provides\
    \ the function `headers_sent` , which you can use to detect whether the HTTP headers\
    \ have already been sent in that script. The function returns `trUE` if headers\
    \ have been sent and `FALSE` if it is not too late to send additional custom headers.\n\
    \nThe following condition makes sure the headers have not been sent before attempting\
    \ to perform a redirection:\n\n```\nif (!headers_sent()) {\n   header(\"Location:\
    \ newpage.php\");\n}\n```\n\nOf course, your script would still need to do something\
    \ else if this condition failed."
  merge: -1
  img_proc: true
- pgno: 173
  md: "Two optional arguments to headers_send allow you to find out the script name\
    \ and line number where the headers were sent. This is useful if your script is\
    \ giving an error but you think that the headers have not been sent at that point.\n\
    \nListing 16.1 attempts to perform a redirect by using a Location header, but\
    \ if it fails, it displays the reason and an alternative way to get to the destination\
    \ page. If you run this on your web server, you should add some whitespace or\
    \ HTML at the top of the script, outside the `<?php` tags, to make sure the headers\
    \ are sent prematurely.\n\n# Listing 16.1. Checking Whether Headers Have Been\
    \ Sent\n\n```\n<?php\n$destination = \"http://www.lightwood.net/\";\nif (!headers_sent($filename,\
    \ $line)) {\n    header(\"Location: $location\");\n} else {\n    echo \"Headers\
    \ were sent in line $line of $filename <br>\";\n    echo \"<A HREF=\"$destination\"\
    >Click here to continue</A>\";\n}\n?>\n```\n\n# Displaying HTTP Headers\n\nIf\
    \ you want to see which HTTP headers have been or will be sent, you use the `headers_list`\
    \ function, which is available in PHP version 5 and above. This function returns\
    \ an array that contains one header per element.\n\nYou can perform a loop on\
    \ the array returned to grab each value in turn. However, in many cases, all you\
    \ want to do is see the headers that are being output to check them over, and\
    \ in this case, passing the array to `print_r` does the trick:\n\n```\nprint_r(headers_list());\n\
    ```\n\nYou need to make sure to put `<PRE>` tags around this for readability.\
    \ The following is typical output:\n\n```\nArray\n(\n    [0] => X-Powered-By:\
    \ PHP/5.0.2\n    [1] => Set-Cookie: mycookie=somevalue\n    [2] => Content-type:\
    \ text/html\n)\n```\n\n# Changing Cache Settings"
  merge: -1
  img_proc: true
- pgno: 174
  md: 'You can use HTTP headers to change the cache settings for a web page, to determine
    whether a page is completely refreshed each time it is loaded or whether the user''s
    browseror his or her ISPwill keep a local copy for a period of time to save downloading
    it from your website again.


    You use the Cache-Control header to specify what caching scheme to use for a page.
    The primary control values for this header are shown in Table 16.1 .


    ```

    public

    ```


    May be stored in any web cache.


    ```

    private

    ```


    May be saved to the browser''s cache but may not be stored in a shared web cache.


    ```

    no-cache

    ```


    May not be stored in any cache between the web server and browser.


    # Table 16.1. Primary Cache-Control Settings


    Value Description


    Usually the reason for overriding the default cache settings is to make sure that
    a page is fully refreshed every time it is visited.


    In most cases, web caches detect that a PHP-generated page with changing content
    needs to be refreshed frequently, but to make absolutely sure that all your up-to-the-minute
    content is being displayed correctly around the world, you might want to give
    it a helping hand.


    To make absolutely sure your page will not be cached, using the following statements,
    which send a number of headers, is generally considered to be the definitive way
    to prevent caching of any kind:


    ```

    header("Cache-Control: no-store, no-cache, must-revalidate");

    header("Cache-Control: post-check=0, pre-check=0", false);

    header("Expires: Mon, 26 Jul 1997 05:00:00 GMT");

    header("Last-Modified: " . gmdate("D, d M Y H:i:s") . " GMT");

    ```


    A few different headers are used here. Two Cache-Control headers are sent, including
    a no-cache instruction. You can find more information on the other, less common,
    Cache-Control settings at www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.9
    .


    The Expires header tells the browser when a document goes out of date. If you
    send a historic date in this header, the document will always be considered to
    be old and need to be refreshed the next time it is viewed.


    The Last-Modified header tells the browser how recently the document was modified.
    When you use the date function, this header always sends the current date, so
    the browser always thinks it'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'has only just been modified and requests a new copy of the page in full.


    **Session Cache Control** When a PHP session is started, `no-cache` headers are
    automatically sent, along with the other HTTP headers that establish the session.
    You can use a different cache setting by using the `session_cache_limiter` function,
    with one of the values in Table 16.1 as an argument.'
  merge: -1
  img_proc: true
- pgno: 176
  md: "# # Server Environment Variables\n\nNow let's look at the information that\
    \ PHP allows you to find out from your web server.\n\nThe `$_SERVER` super-global\
    \ array contains a number of elements that give information about the web server\
    \ environment during the current page request. To see the full list within the\
    \ context of a script, you execute this statement at any time:\n\n```\n```php\n\
    print_r($_SERVER);\n```\n```\n\nThe examples in this section are common to most\
    \ web servers. However, some servers may not support all the values shown or may\
    \ use different names. You can always refer to the output from the previous statement\
    \ to check which values are available in your script.\n\n# ## Script Information\n\
    \nThe name of the current script can be found in `$_SERVER[\"SCRIPT_NAME\"]` .\
    \ Knowing this name can be useful if you want to create a form that submits to\
    \ itself but whose filename you might want to change in the future. You could\
    \ use the following tag:\n\n```\n```html\n<FORM ACTION=\"<?php print $_SERVER[\"\
    SCRIPT_NAME\"] ;?>\"\nMETHOD=POST>\n```\n```\n\nSimilar to `SCRIPT_NAME` is the\
    \ `REQUEST_URI` element, which contains the full uniform resource identifier of\
    \ the page request. This consists of the full path to the current script, including\
    \ the question mark and values in the query string, if there are any. The query\
    \ string is not included as part of the `SCRIPT_NAME` element, but you can access\
    \ it on its own as `$_SERVER[\"QUERY_STRING\"]` .\n\nIf you want to find the domain\
    \ name under which a script is running, you can look at `$_SERVER[\"HTTP_HOST\"\
    ]` . Your web server might be set up with several alias domains, and this provides\
    \ a way to see which domain name a visitor is viewing your pages on.\n\n# ## User\
    \ Information\n\nThe `HTTP_USER_AGENT` element contains a string that identifies\
    \ the user's web browser software and operating system. It might look like one\
    \ of the following:\n\n```\n```\nMozilla/4.0 (compatible; MSIE 6.0; Windows NT\
    \ 5.1; SV1)\nMozilla/5.0 (Windows; U; Windows NT 5.1; en-US; rv:1.7.5)\n Gecko/20041107\
    \ Firefox/1.0\n```\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "Lynx/2.8.5dev.7 libwww-FM/2.14 SSL-MM/1.4.1 OpenSSL/0.9.7a\n\nThese three examples\
    \ correspond to Internet Explorer, Mozilla Firefox, and Lynx, respectively. Notice\
    \ that both Internet Explorer and Firefox report themselves as Mozilla browsers,\
    \ so to find out specifically which program a user has, you have to look further\
    \ into the string.\n\nThe following condition can be used to produce different\
    \ output for Internet Explorer than for Firefox:\n\n```\nif (strstr($_SERVER[\"\
    HTTP_USER_AGENT\"], \"MSIE\")) {\n    echo \"You are using Internet Explorer\"\
    ;\n}\nelseif (strstr($_SERVER[\"HTTP_USER_AGENT\"], \"Firefox\")) {\n    echo\
    \ \"You are using Firefox\";\n}\nelse {\n    echo \"You are using some other web\
    \ browser\";\n}\n```\n\nYou may need to use this occasionally because of differences\
    \ in the browsers' implementations of DHTML or JavaScript.\n\nThe REMOTE_ADDR\
    \ attribute contains the IP address that the hit to the web server came from.\
    \ It should either be the IP address of the user's computer or the user's ISP's\
    \ web cache. You might want to use the remote IP address for logging or security.\n\
    \nIf the REMOTE_ADDR value is a web cache, the element HTTP_X_FORWARDED_FOR is\
    \ also present, and it contains the IP address of the user's computer.\n\nIf the\
    \ user has logged in by using basic HTTP authentication, you can also find out\
    \ his or her username by looking at the value in $_SESSION[\"REMOTE_USER\"] .\n\
    \n# Server Information\n\nOther elements in $_SERVER allow you to access various\
    \ values related to the web server configuration.\n\nFor instance, $_SERVER[\"\
    SERVER_NAME\"] corresponds to the ServerName Apache directive. This is the primary\
    \ name of this web server, but not necessarily the domain name the scripts are\
    \ being accessed from; it might not be the same as $_SERVER[\"HTTP_HOST\"] . Similarly,\
    \ $_SERVER[\"SERVER_ADMIN\"] holds the webmaster's email address that is set in\
    \ the ServerAdmin directive.\n\nThe SERVER_ADDR and SERVER_PORT elements contain\
    \ the IP address and port number of the machine the web server is running on.\
    \ Checking $_SERVER[\"REQUEST_METHOD\"] reveals whether a GET or POST method was\
    \ used to pass values to the script.\n\nFinally, if you are working on a shared\
    \ web host or someone else's web server and want to see what web server software\
    \ version that person is running, you can check $_SERVER[\"SERVER_SOFTWARE\"]\
    \ . This value is the same as the one transmitted in the Server"
  merge: -1
  img_proc: true
