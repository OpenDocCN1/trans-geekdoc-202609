- pgno: 181
  md: '# # Managing Files


    Let''s examine how PHP allows you to work with files stored on a web server''s
    hard disk.


    # ## File Permissions


    Before you can perform any filesystem access from PHP, you have to consider the
    permission settings for the files you want to work with. This section deals primarily
    with the file permissions system on Unix/Linux systems, but the same considerations
    apply to all platforms.


    Usually your web server will be running under either the `apache` or `nobody`
    username, yet your web documents and PHP scripts will be owned by your actual
    system user. Unless the web server user has permissions to access your files,
    any access attempts will fail.


    To grant to all users read-only access to a file, you use the `chmod` command,
    which sets the read flag (`r` ) on the file for all users other than the current
    one (`o` ):


    ```

    ```

    $ chmod o+r filename

    ```

    ```


    You can also set global read/write permissions on a file by using `chmod` as follows:


    ```

    ```

    $ chmod o+rw filename

    ```

    ```


    Refer to `man chmod` for full details and more examples.


    If a file has global permissions, the web server will be able to access it. However,
    any other user on your system will also have full access to these files. In some
    situations you might prefer to change the ownership on a file to the `apache`
    user rather than grant global write access. The superuser does this by using the
    `chown` command:


    ```

    ```

    # chown apache filename

    ```

    ```


    The PHP function `chmod` can also be used to alter file permissions. It takes
    two arguments: a filename and a mode. The mode argument can be either the string
    type, such as `o+rw` , or the numeric type, such as `0644` , as long as the number
    is prefixed with a zero.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Using **chmod** If you are familiar with the system command `chmod`,

    you may be used to giving a three-digit number as the mode

    argument. When run from the shell, `chmod` assumes that an octal

    value is given, whether or not it is prefixed with a zero; for example,

    `chmod 644` is the same as `chmod 0644`. In PHP, however, the leading

    zero is always required in the argument to `chmod`.


    # Getting Information About a File


    PHP provides a wide range of functions for getting information about a file on
    your system. The

    simplest, and one you may use often, is `file_exists`, which simply tells you
    whether there is a

    file with the given name argument. The `file_exists` function returns `True` if
    any item on the

    filesystem has the given name, even if it is a directory or a special file type.
    The argument may

    contain a path, as shown here:


    ```

    if (file_exists("/home/chris/myfile")) {

    echo "The file exists";

    }

    else {

    echo "The file does not exist";

    }

    ```


    A number of other functions allow you to test certain attributes of a file. These
    are shown in Table

    17.1 .


    # Table 17.1. Functions for Testing Attributes of a

    File


    | Function | Description |

    |---|---|

    | `is_executable` | Checks whether the file has the

    executable attribute. |

    | `is_readable` | Checks whether the file is

    readable. |

    | `is_writeable` | Checks whether the file is

    writeable. |

    | `is_link` | Checks for a symbolic link. |

    | `is_file` | Checks for a real file, not a link. |


    Yet other functions return information about the file itself. These are shown
    in Table 17.2 .'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Table 17.2. Functions That Find Information About a File


    | Function | Description |

    | :--- | :--- |

    | fileatime | Checks the time of the last file access, as a Unix timestamp. |

    | filectime | Checks the time of file inode creation. |

    | filemtime | Checks the time of the last modification to the file. |

    | fileowner | Checks the user ID of the file owner. |

    | filegroup | Checks the group ID of the file. |

    | fileinode | Checks the inode number of the file. |

    | fileperms | Checks the file''s permission settings as an octal value (for example,
    0644). |

    | filesize | Checks the size of the file in bytes. |

    | filetype | Checks the type of the file (fifo , char , dir , block , link , or
    file ). |


    # Moving and Copying Files


    Assuming that you have permission to do so, you can perform a file copy, move,
    or delete operation from PHP. The functions for these actions are copy , rename
    , and unlink , respectively.


    The copy and rename functions take two argumentsthe source and destination filenameswhereas
    unlink takes a single filename.


    ![](img/2edc6e6954e3485ad7d94117645931d8_183_0.png)


    **File Paths** You should be particularly careful when performing file operations
    from PHP, particularly when deleting. You need to always make sure you know what
    the current working directory is, or give a full path to the target file.


    # Working with Filenames


    The functions basename and dirname provide an easy way to dissect a string into
    a filename and path, respectively. You might use these functions to find out the
    base filename when a full path is given or to find the pathname if you want a
    file created with other files in the same place as a known filename.


    The basename function returns everything from the last slash character in the
    string to the end, whereas dirname returns the portion of the string before this
    slash.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The `realpath` function takes a pathname argument and returns its absolute
    pathname. Any symbolic links in the path are resolved to their actual location
    on disk, and any references to the current or parent directory using `.` or `..`
    are removed.


    If you want to write to a temporary file, you can use the `tempnam` function to
    generate a unique temporary filename. It takes two argumentsa directory name and
    a filename prefix. The prefix argument is required but can be an empty string.
    The following statement generates a temporary filename in `/tmp` with no prefix:


    ```

    $filename = tempnam("/tmp", "");

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# # Reading and Writing Files


    Now let''s see how to read and write files from PHP.


    # ## Simple Methods for Reading and Writing Files


    PHP provides some simple, high-level functions that can open a file and grab its
    contents or write data to a file in a singl e operation.


    To read the contents of a file into a string variable, you use `file_get_contents`
    . The argument is a filename, which can contain a relative or absolute path. The
    following statement reads a file called `file.txt` into the variable `$data` :


    ```

    ```php

    $data = file_get_contents("file.txt");

    ```

    ```


    An optional second Boolean argument can be set to `TRUE` to search the include
    path for the given filename. You will see how to configure the include path in
    Lesson 23 , "PHP Configuration."


    The function `file_put_contents` simply dumps the contents of a variable to a
    local file. Its arguments are the filename to write to and the data to write.
    The following statement writes the value of `$data` to `file.txt` :


    ```

    ```php

    file_put_contents("file.txt", $data);

    ```

    ```


    # ## Lower-Level File Access


    The functions `file_get_contents` and `file_put_contents` are high-level functions
    that perform a number of steps that can be done individually with lower-level
    PHP functions. Although in many cases reading the entire contents of a file or
    writing data to a file is the task you will want to perform, PHP provides a flexible
    way to interface with the filesystem.


    All file access begins with a file handler, which is established with the `fopen`
    function. The arguments to `fopen` are a filename and the mode in which to open
    the file. The available modes are shown in Table 17.3 .


    # ### Table 17.3. File Mode Arguments to `fopen`'
  merge: -1
  img_proc: true
- pgno: 186
  md: "| Mode | Description |\n| :--- | :--- |\n| r | Opens for reading only from\
    \ the beginning of the file. |\n| r+ | Opens for reading and writing from the\
    \ beginning of the file. |\n| w | Opens for writing only; overwrites the old file\
    \ if one already exists. |\n| w+ | Opens for writing and reading; overwrites the\
    \ old file if one already exists. |\n| a | Opens for writing only and appends\
    \ new data to the end of the file. |\n| a+ | Opens for reading and writing at\
    \ the end of the file. |\n\nEach file handler points to a position in the file.\
    \ You can see from Table 17.3 that when a file is opened by using fopen , the\
    \ handler always points to either the beginning or the end of the file. As you\
    \ read or write using that handler, its pointer location moves, and subsequent\
    \ actions take place from that point in the file.\n\nLet's look at an example\
    \ where you read the contents of a file a few bytes at a time. By calling fopen\
    \ with the r mode argument, you create a read-only file handler that initially\
    \ points to the start of that file.\n\nThe fread function reads a fixed number\
    \ of bytes from a file handler. Its arguments are the file handler and the number\
    \ of bytes to read. By performing this action in a loop, you can eventually read\
    \ the entire contents of a file:\n\n```\n$fp = fopen(\"file.txt\", \"r\");\nwhile\
    \ ($chunk = fread($fp, 100)) {\n    echo $chunk;\n}\n```\n\nThis is a very compact\
    \ statement that checks that fread has succeeded on each pass of the loop. When\
    \ there is no more data to read, fread returns FALSE . In fact, by using this\
    \ loop to output the file to screen, you cannot tell from the result that it was\
    \ actually done in smaller chunks.\n\nAn alternative to fread is fgets , which\
