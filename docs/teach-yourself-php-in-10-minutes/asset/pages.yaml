- pgno: 213
  md: '# # The PEAR DB Class


    Many different database abstraction layers are available for PHP, but the one
    you will learn how to use in this lesson is the PEAR DB class. In Lesson 25 ,
    "Using PEAR," you will find out more about PEARthe PHP Extension and Application
    Repositoryand some other useful classes it contains.


    The DB class implements database abstraction, using PHP''s database extensions,
    and it currently supports the extensions shown in Table 20.1 .


    # ### Table 20.1. PHP Database Extensions supported by the PEAR DB Class


    | Extension | Database |

    |---|---|

    | dbase | dBase ( .dbf ) |

    | fbsql | FrontBase |

    | ibase | Firebird/Interbase |

    | ifx | Informix |

    | msql | Mini SQL |

    | mssql | Microsoft SQL Server |

    | mysql | MySQL |

    | mysqli | MySQL 4.1 and higher |

    | oci8 | Oracle versions 7, 8, and 9 |

    | odbc | ODBC |

    | pgsql | PostgreSQL |

    | sqlite | SQLite |

    | Sybase | Sybase |


    > **DB Class Documentation** The online documentation for the PEAR DB class can
    be found at http://pear.php.net/package/DB .'
