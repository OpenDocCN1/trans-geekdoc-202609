    \ The following example defines the first few months for three years (the full\
    \ array would clearly be much larger than this):\n\n```\n$temps = array (\n  \
    \  1995 => array (\"jan\" => 36, \"feb\" => 42, \"mar\" => 51),\n    1996 => array\
