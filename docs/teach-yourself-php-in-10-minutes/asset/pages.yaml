- pgno: 137
  md: "# Creating Form Elements\n\nNow let's look at how some of the items in an HTML\
    \ form can be generated by using custom PHP functions. This type of modularization\
    \ means that you can use a function over and over again whenever you need to include\
    \ the same type of item on a form.\n\n# Creating a Dynamic Radio Button Group\n\
    \nA modular routine to generate a radio button group requires three pieces of\
    \ information: the name of the group, a list of values, and a list of labels.\
    \ You can use an associative array to pass the values and labels to the function\
    \ in one go.\n\nSay you want to be able to generate the HTML for a radio button\
    \ group by using simple code similar to the following:\n\n```\n$options = array(\"\
    economy\" => \"Economy\",\n                 \"standard\" => \"Standard\",\n  \
    \               \"express\" => \"Express\");\n$default = \"economy\";\n$html =\
    \ generate_radio_group(\"shipping\", $options, $default);\n```\n\nAs you can see,\
    \ this is the kind of function you are likely to use again and again when creating\
    \ HTML forms, and it is very useful to build up a toolbox of similar functions\
    \ to make it easy to perform common tasks. Here's how the generate_radio_group\
    \ function might be implemented:\n\n```\nfunction generate_radio_group($name,\
    \ $options, $default=\"\") {\n    $name = htmlentities($name);\n    foreach($Options\
    \ as $value => $label) {\n        $value = htmlentities($value);\n        $html\
    \ .= \"<INPUT TYPE=\\\"RADIO\\\" \";\n        if ($value == $default)\n      \
    \      $html .= \"CHECKED \";\n        $html .= \"NAME=\\\"$name\\\" VALUE=\\\"\
    $value\\\">\";\n        $html .= $label . \"<br>\";\n    }\n    return($html);\n\
    }\n```\n\nAt the heart of the function is a loop through $options that generates\
    \ each <INPUT> tag in turn, giving each tag the same NAME attribute but a different\
    \ VALUE attribute. The label text is placed next to each button, and in this sample\
    \ function, the only formatting is to place a <br> tag between each button in\
    \ the group. You could format the options in a table or in any other way you see\
    \ fit."
  merge: -1
  img_proc: true
- pgno: 138
  md: "At each step of the loop, the script compares the current value of $value with\
    \ the passed-in $default value. If they match, the CHECKED attribute is included\
    \ in the generated HTML. Again, spacing is important here; note that the space\
    \ after CHECKED is added to the HTML string.\n\nThe $default argument is specified\
    \ as optional. If generate_radio_group is called with only two arguments, none\
    \ of the radio buttons will be selected by default.\n\n**HTML Entities** The htmlentities\
    \ function is used to replace certain characters in a string with corresponding\
    \ HTML entities. Because the values of $name and $value are output inside another\
    \ HTML tag, the htmlentities function is important to ensure that there are no\
    \ characters in those strings that could break the tag.\n\n# Creating a Dynamic\
    \ Menu\n\nThe process for creating a drop-down menu is very similar to that for\
    \ creating a radio button group. Again, a loop is requiredthis time to generate\
    \ an <OPTION> tag for each option in turn. The function also needs to include\
    \ the <SELECT> and </SELECT> tags around the option list. The function generate_menu\
    \ would look like this:\n\n```\nfunction generate_menu($name, $options, $default=\"\
    \") {\n\n    $html = \"<SELECT NAME=\\\"$name\\\">\";\n    foreach($options as\
    \ $value => $label) {\n        $html .= \"<OPTION \";\n        if ($value == $default)\n\
    \            $html .= \" SELECTED \";\n        $html .= \"VALUE=\\\"$value\\\"\
    >$label</OPTION>\";\n    }\n    $html .= \"</SELECT>\";\n    return($html);\n\
    }\n```\n\nThe string returned by this function contains the entire HTML code to\
    \ produce a drop-down menu that contains the supplied options. You might prefer\
    \ to have the function return only the option tags and place your own <SELECT>\
    \ tags around them; this would allow you to easily add a JavaScript onChange event\
    \ on the menu, for instance.\n\n# Multiple Selection Items\n\nWhen used with the\
    \ MULTIPLE attribute, the <SELECT> form item allows a user to choose multiple\
    \ options from a menu, usually by holding the Ctrl key while clicking the options.\
    \ To handle more than one selection in PHP, the input name must be an array. Then\
    \ when the form is posted, the elements in the array contain the values of each\
    \ selected item in turn."
  merge: -1
  img_proc: true
- pgno: 139
  md: "For example, if you create a multiple-selection menu by using the following\
    \ HTML and submit it to a PHP script that contains just a print_r instruction,\
    \ you see that $_POST[\"colors\"] is an array that contains one element for each\
    \ option selected:\n\n```\n<SELECT MULTIPLE NAME=\"colors[]\">\n<OPTION VALUE=\"\
    red\">Red</OPTION>\n<OPTION VALUE=\"white\">White</OPTION>\n<OPTION VALUE=\"blue\"\
    >Blue</OPTION>\n</SELECT>\n```\n\nWith all three of the options selected, $_POST[\"\
    colors\"] contains three elements with numeric indices 0 to 2, having values red\
    \ , white , and blue , respectively.\n\nThe same principle applies to any type\
    \ of form input. If more than one item exists with the same name but the name\
    \ ends with a pair of square brackets, an array is created in PHP with that name,\
    \ containing elements for each of those items' values.\n\nThis is most useful\
    \ when you're implementing a multiple-selection input using check boxes. Rather\
    \ than having to give each check box a unique name, you can give each the name\
    \ of an array. The array created when the form is submitted contains an element\
    \ for each item checked.\n\nThe final example in this lesson involves the function\
    \ generate_checkboxes , which creates a set of check boxes with the same name\
    \ that can be used as an alternative to <SELECT MULTIPLE> to implement a multiple-option\
    \ selection in an HTML form. The function, along with a simple example of its\
    \ usage, is shown in Listing 12.4\n\n# # Listing 12.4. Creating a Multiple-Option\
    \ Selection Using Check Boxes\n\n```\n<?php\n\nfunction generate_checkboxes($name,\n\
    \    $options, $default=array()) {\n    if (!is_array($default))\n        $default\
    \ = array();\n\n    foreach($options as $value => $label) {\n        $html .=\
    \ \"<INPUT TYPE=CHECKBOX \";\n        if (in_array($value, $default))\n      \
    \      $html .= \"CHECKED \";\n        $html .= \"NAME=\\\"{$name}[]\\\" VALUE=\\\
    \"$value\\\"><br>\";\n    }\n\n    return($html);\n}\n\n$options = array(\"movies\"\
    \ => \"Going to the movies\",\n    \"music\" => \"Listening to music\",\n    \"\
    sport\" => \"Playing or watching sports\",\n    \"travel\" => \"Traveling\");\n\
    ```"
  merge: -1
  img_proc: true
