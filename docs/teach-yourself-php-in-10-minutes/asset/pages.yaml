- pgno: 46
  md: '# # Using Functions


    A function is used to make a task that might consist of many lines of code into
    a routine that can be called using a single instruction.


    PHP contains many functions that perform a wide range of useful tasks. Some are
    built in to the PHP language; others are more specialized and are available only
    if certain extensions are activated when PHP is installed.


    The online PHP manual (www.php.net ) is an invaluable reference. As well as documentation
    for every function in the language, the manual pages are also annotated with user-submitted
    tips and examples, and you can even submit your own comments if you want.


    **Online Reference** To quickly pull up the PHP manual page for any function,
    use this shortcut: www.php.net/function_name .


    You have already used the date function to generate a string that contains a formatted
    version of the current date. Let’s take a closer look at how that example from
    Lesson 1 , "Getting to Know PHP," works. The example looked like this:


    ```

    echo date(''j F Y'');

    ```


    The online PHP manual gives the prototype for date as follows:


    ```

    string date (string format [, int timestamp])

    ```


    This means that date takes a string argument called format and, optionally, the
    integer timestamp . It returns a string value. This example sends j F Y to the
    function as the format argument, but timestamp is omitted. The echo command displays
    the string that is returned.


    **Prototypes** Every function has a prototype that defines how many arguments
    it takes, the arguments'' data types, and what value is returned. Optional arguments
    are shown in square brackets ([ ] ).'
