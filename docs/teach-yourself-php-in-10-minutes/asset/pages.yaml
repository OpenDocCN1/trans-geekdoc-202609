    **Chopping Strings** Each line read by `fgets` ends with a newline character.
    If you want to exclude the newline, you can use the `rtrim` function on the string
    to remove it along with any trailing whitespace characters.


    When you are finished with a file pointer, you should free up its resources by
    calling the `fclose` function:


    ```

    fclose($fp);

    ```


    # Random Access to Files


    The file pointer does not have to be moved sequentially through a file; it can
    be reassigned to any position while the file handle is still open.


    To find the current location of the file pointer, you use `ftell` . An integer
    is returnedthe number of bytes from the start of the file:


    ```

    $filepos = ftell($fp);

    ```


    To send the file pointer to a specific location, you use the `fseek` function.
    The following statement places the file pointer 100 bytes from the start, using
    the file handler `$fp` :


    ```

    fseek($fp, 100);

    ```


    Most often you just want to return the file pointer to the beginning of the file.
    You could set `fseek` to position zero, or you could just use the built-in function
    `rewind` :


    ```

    rewind($fp);

    ```


    # Writing to a File Pointer'
