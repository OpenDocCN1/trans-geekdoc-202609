- pgno: 83
  md: "**Loops** You may have realized that with the `$temps` example, a `for` loop\
    \ counting from 0 to 11 could also be used to find the value of every element\
    \ in the array. However, although that technique would work in this situation,\
    \ the keys in an array may not always be sequential and, as you will see in the\
    \ next section, may not even be numeric.\n\n# # Associative Arrays\n\nThe array\
    \ examples so far in this chapter have used numeric keys. An *associative array*\
    \ allows you to use textual keys so that the indexes can be more descriptive.\n\
    \nTo assign a value to an array by using an associative key and to reference that\
    \ value, you simply use a textual key name enclosed in quotes, as in the following\
    \ examples:\n\n```\n$temps[\"jan\"] = 38;\necho $temps[\"jan\"];\n```\n\nTo define\
    \ the complete array of average monthly temperatures in this way, you can use\
    \ the `array` function as before, but you indicate the key value as well as each\
    \ element. You use the `=>` symbol to show the relationship between a key and\
    \ its value:\n\n```\n$temps = array(\"jan\" => 38, \"feb\" => 40, \"mar\" => 49,\n\
    \       \"apr\" => 60, \"may\" => 70, \"jun\" => 79,\n       \"jul\" => 84, \"\
    aug\" => 83, \"sep\" => 76,\n       \"oct\" => 65, \"nov\" => 54, \"dec\" => 42);\n\
    ```\n\nThe elements in an associative array are stored in the order in which they\
    \ are defined (you will learn about sorting arrays later in this lesson), and\
    \ traversing this array in a loop will find the elements in the order defined.\
    \ You can call `print_r` on the array to verify this. The first few lines of output\
    \ are as follows:\n\n```\nArray\n(\n    [jan] => 38\n    [feb] => 40\n    [mar]\
    \ => 49\n    ...\n```"
