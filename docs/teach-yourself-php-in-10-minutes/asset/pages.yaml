- pgno: 71
  md: '# Formatting Strings


    PHP provides a powerful way of creating formatted strings, using the printf and
    sprintf functions. If you have used this function in C, these will be quite familiar
    to you, although the syntax in PHP is a little different.


    # Using printf


    You use printf to display a formatted string. At its very simplest, printf takes
    a single string argument and behaves the same as echo :


    ```

    printf("Hello, world");

    ```


    The power of printf , however, lies in its ability to substitute values into placeholders
    in a string. Placeholders are identified by the percent character ( % ), followed
    by a format specification character.


    The following example uses the simple format specifier %f to represent a float
    number.


    ```

    $price = 5.99;

    printf("The price is %f", $price);

    ```


    The second argument to printf is substituted in place of %f , so the following
    output is produced:


    ```

    The price is 5.99

    ```


    There is actually no limit to the number of substitution arguments in a printf
    statement, as long as there are an equivalent number of placeholders in the string
    to be displayed. The following example demonstrates this by adding in a string
    item:


    ```

    $item = "The Origin of Species";

    $price = 5.99;

    printf("The price of %s is %f", $item, $price);

    ```


    Table 6.1 shows the format characters that can be used with the printf function
    in PHP to indicate different types of values.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Table 6.1. `printf` Format Characters


    | Character | Meaning |

    |---|---|

    | b | A binary (base 2) number |

    | c | The ASCII character with the numeric value of the argument |

    | d | A signed decimal (base 10) integer |

    | e | A number displayed in scientific notation (for example, 2.6e+3) |

    | u | An unsigned decimal integer |

    | f | A floating-point number |

    | o | An octal (base 8) number |

    | s | A string |

    | x | A hexadecimal (base 16) number with lowercase letters |

    | X | A hexadecimal (base 16) number with uppercase letters |


    Suppose you use the %d format specifier instead of %f to display the value of
    $price :


    ```

    $price = 5.99;

    printf("As a decimal, the price is %d", $price);

    ```


    In this case, PHP will treat the argument passed as an integer, so only the whole
    part of the value will be displayed. The output produced is as follows.


    As a decimal, the price is 5


    **Decimals** The %d format string represents a decimal integer, with *decimal*
    referring to base 10 numbers and not decimal points. There are different format
    specifiers to display numbers in base 16 (*hex*, %x ), base 8 (*octal* , %o ),
    and base 2 (*binary* , %b ).


    # Format Codes


    A format specifier can also include optional elements to specify the padding,
    alignment, width, and precision of the value to be displayed. This allows you
    to carry out some very powerful formatting.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'The width specifier indicates how many characters the formatted value should
    occupy in the displayed string and appears between the percent sign and the type
    specifier. For instance, the following example ensures that the name displayed
    takes up exactly 10 characters:


    ```

    $name1 = "Tom";

    $name2 = "Dick";

    $name3 = "Harry";

    echo "<PRE>";

    printf("%10s \n", $name1);

    printf("%10s \n", $name2);

    printf("%10s \n", $name3);

    echo "</PRE>";

    ```


    **Padding** These examples use <PRE> tags to make sure that multiple spaces used
    for padding are displayed onscreen. Usually a web browser will treat multiple
    adjacent whitespace characters as a single space.


    String padding is not used very often in creating dynamic web pages. However,
    it is useful when you''re producing plain-text output, such as generated email
    text, in PHP.


    If you run this example through a web browser, you will see that each name displayed
    is indented from the left of the screen by the correct number of characters to
    make each name right-aligned with the others.


    The default behavior is to right-align to the given width. However, you can reverse
    this by using the minus symbol as an alignment specifier. To left-align the strings
    in the previous example, you would use the format specifier %–10s . Although visibly
    this would not appear any different from simply using %s , the strings would be
    padded on the right with spaces to a length of 10 characters.


    You can change the padding character from a space to any other character by placing
    that character before the width value, prefixed with a single quotation mark.
    The following example ensures that a five-digit order number is always displayed
    padded with zeros if necessary:


    ```

    $order = 201;

    printf("Order number: %''05d", $order);

    ```


    The output produced is as follows:


    ```

    Order number: 00201

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'The precision specifier is used with a floating-point number to specify the
    number of decimal places to display. The most common usage is with currency values,
    to ensure that the two cent digits always appear, even in a whole dollar amount.


    The precision value follows the optional width specifier and is indicated by a
    period followed by the number of decimal places to display. The following example
    uses %.2f to display a currency value with no width specifier:


    ```

    ```php

    $price = 6;

    printf("The price is %.2f", $price);

    ```

    ```


    The price is correctly formatted as follows:


    The price is 6.00


    **Float Widths** With floats, the width specifier indicates only the width of
    the number before the decimal point. For example, %6.2f will actually be nine
    characters long, with the period and two decimal places.


    # # Using sprintf


    The sprintf function is used to assign formatted strings to variables. The syntax
    is the same as for printf , but rather than being output as the result, the formatted
    value is returned by the function as a string.


    For example, to assign a formatted price value to a new variable, you could do
    the following:


    ```

    ```php

    $new_price = sprintf("%.2f", $price);

    ```

    ```


    All the format specifier rules that apply to printf also apply to sprintf .'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# String Functions


    Let''s take a look at some of the other string functions available in PHP. The
    full list of string functions can be found in the online manual, at www.php.net/manual/en/ref.strings.php
    .


    # Capitalization


    You can switch the capitalization of a string to all uppercase or all lowercase
    by using strtoupper or strtolower , respectively.


    The following example demonstrates the effect this has on a mixed-case string:


    ```

    ```php

    $phrase = "I love PHP";

    echo strtoupper($phrase) . "<br>";

    echo strtolower($phrase) . "<br>";

    ```

    ```


    The result displayed is as follows:


    ```

    ```

    I LOVE PHP

    i love php

    ```

    ```


    If you wanted to functions capitalize only the first character of a string, you
    use ucfirst :


    ```

    ```php

    $phrase = "welcome to the jungle";

    echo ucfirst($phrase);

    ```

    ```


    You can also capitalize the first letter of each word which is useful for names
    by using ucwords :


    ```

    ```php

    $phrase = "green bay packers";

    echo ucwords($phrase);

    ```

    ```


    Neither ucfirst nor ucwords affects characters in the string that are already
    in uppercase, so if you want to make sure that all the other characters are lowercase,
    you must combine these functions with strtolower , as in the following example:


    ```

    ```php

    $name = "CHRIS NEWMAN";

    echo ucwords(strtolower($name) );

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Dissecting a String


    The `substr` function allows you to extract a substring by specifying a start
    position within the string and a length argument. The following example shows
    this in action:


    ```

    ```php

    $phrase = "I love PHP";

    echo substr($phrase, 3, 5);

    ```

    ```


    This call to `substr` returns the portion of `$phrase` from position 3 with a
    length of 5 characters. Note that the position value begins at zero, not one,
    so the actual substring displayed is `ove P` .


    If the length argument is omitted, the value returned is the substring from the
    position given to the end of the string. The following statement produces `love
    PHP` for `$phrase` :


    ```

    ```php

    echo substr($phrase, 2);

    ```

    ```


    If the position argument is negative, `substr` counts from the end of the string.
    For example, the following statement displays the last three characters of the
    `stringin` this case, `PHP` :


    ```

    ```php

    echo substr($phrase, -3);

    ```

    ```


    If you need to know how long a string is, you use the `strlen` function:


    ```

    ```php

    echo strlen($phrase);

    ```

    ```


    To find the position of a character or a string within another string, you can
    use `strpos` . The first argument is often known as the `haystack` , and the second
    as the `needle` , to indicate their relationship.


    The following example displays the position of the `@` character in an email address:


    ```

    ```php

    $email = "chris@lightwood.net";

    echo strpos($email, "@");

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: '**String Positions** Remember that the character positions in a string are
    numbered from the left, starting from zero. Position 1 is actually the second
    character in the string. When strpos finds a match at the beginning of the string
    compared, the return value is zero, but when no match is found, the return value
    is FALSE .


    You must check the type of the return value to determine this difference. For
    instance, the condition strpos($a, $b) == 0 holds true only when $b matches $a
    at the first character.


    The strstr function extracts a portion of a string from the position at which
    a character or string appears up to the end of the string. This is a convenience
    function that saves your using a combination of strpos and substr .


    The following two statements are equivalent:


    ```

    $domain = strstr($email, "@");


    $domain = strstr($email, strpos($email, "@"));

    ```'
