- pgno: 133
  md: "# Setting Default Values\n\nLet's begin with some simple examples that embed\
    \ PHP within form elements to set the default values of some items when the page\
    \ is loaded.\n\n# Default Input Values\n\nThe default value of a text input is\
    \ given in the VALUE attribute. This value displays in the field when the page\
    \ is loaded, and, unless it is overtyped, the same value is sent to the PHP processing\
    \ script when the form is submitted.\n\nConsider a shopping cart page for an online\
    \ store, where customers are given the opportunity to change the quantity of each\
    \ item in their cart before finalizing the order. The current quantity of each\
    \ line item would be displayed in a small text input box and could be overtyped,\
    \ and then the user would be able to click a button to refresh the contents of\
    \ the cart. Listing 12.1 is a very simple example of this, for a store that sells\
    \ only one product but allows you to choose the quantity to buy.\n\n# Listing\
    \ 12.1. Defaulting the Value of a Text Input Field\n\n```\n<?php\nif(isset($_POST[\"\
    quantity\"]))\n\t$quantity = settype($_POST[\"quantity\"], \"integer\");\nelse\n\
    \t$quantity = 1;\n\n$item_price = 5.99;\nprintf(\"%d x item = $%.2f\",\n\t\t$quantity,\
    \ $quantity * $item_price);\n?>\n<FORM ACTION=\"buy.php\" METHOD=POST>\nUpdate\
    \ quantity:\n<INPUT NAME=\"quantity\" SIZE=2\nVALUE=\"<?php echo $quantity;?>\"\
    \ >\n<INPUT TYPE=SUBMIT VALUE=\"Change quantity\">\n</FORM>\n```\n\nFirst of all,\
    \ you set an overall default value for $quantity of 1, so that the first time\
    \ the page is loaded, this is the quantity displayed in the field and used to\
    \ calculate the total price. Then, inside the VALUE tag, you run a single PHP\
    \ statement to echo the value of $quantity. If a quantity value is posted to the\
    \ form, then that value is used instead.\n\nThis script should be called buy.php\
    \ so that the form posts to itself when submitted. If you change the quantity\
    \ value and press the submit button, the script calculates the new total price.\
    \ Also, the quantity input field defaults to the value you just entered when the\
    \ page reloads."
  merge: -1
  img_proc: true
- pgno: 134
  md: '# # Checking a Check Box


    The `CHECKED` attribute determines whether a check box is on or off by default
    when a page loads. Using PHP, you can embed a condition within the `<INPUT>` tag
    to determine whether to include the CHECKED attribute on a check box:


    ```

    `<INPUT TYPE="CHECKBOX"

    NAME="mybox" <?php if(condition) echo "CHECKED"; ?>>`

    ```


    The way this looks can be confusing, particularly because two > symbols appear
    at the end of the tagone to close the PHP section and one to close the `<INPUT>`
    tag. In fact, the position of the CHECKED attribute is not important, so depending
    on your preference, you can move it around for readability:


    ```

    `<INPUT <?php if(condition) echo "CHECKED"; ?>

    TYPE="CHECKBOX" NAME="mybox">`

    ```


    > **Closing PHP Tags** When embedding small chunks of PHP, you should always try
    to include the closing `?>` tag as soon as possible. If you miss this closing
    tag, PHP attempts to interpret the subsequent HTML as PHP and is likely to come
    up with some interesting error messages!


    Spacing can be very important when you''re using PHP within HTML. In the previous
    example, if there is not a space on either side of the PHP statement and the condition
    is true, the actual HTML produced is as follows:


    ```

    `<INPUT CHECKEDTYPE="CHECKBOX" NAME="mybox">`

    ```


    Because `CHECKEDTYPE` is not recognized as part of the `<INPUT>` tag, your browser
    is likely to display this as a text input box, not a check box! It''s always better
    to have too much space around dynamic elements in HTML tags than to risk not having
    enough.


    # # Selecting a Radio Button Group Item


    The `CHECKED` attribute is also used to specify which item in a radio button group
    should be selected by default. For example, an online store may offer three shipping
    options, with each having a different cost. To make sure the customer always chooses
    a shipping option, one of the'
  merge: -1
  img_proc: true
