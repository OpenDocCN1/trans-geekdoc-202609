  md: "```\nbreak;\ncase 127: echo \"Command could not be found\";\nbreak;\ndefault:\
    \ echo \"Command failed with code $return\";\n}\n```\n\n# Using Backticks\n\n\
    The backtick ( ` ) character is a handy shortcut that can be used to indicate\
    \ a system command for execution on the web server itself. A string contained\
    \ between two backticks is executed, and the response produced by the host system\
    \ is returned.\n\nThe following is equivalent to the passthru example, but it\
    \ uses the backtick syntax:\n\n```\necho `hostname`;\n```\n\nWith backticks you\
    \ are able to assign the result of a host command to a variable, as shown in the\
    \ following statement:\n\n```\n$hostname = `hostname`;\n```\n\nIn fact, the backtick\
    \ characters can be used anywhere in a PHP script. They immediately interrupt\
    \ program execution to call the host command, with the resulting values replaced\
    \ into the script. The following example shows that the result of a host command\
    \ can even be used within a condition:\n\n```\nif (chop(`hostname`) == \"hal9000\"\
    ) {\n    echo \"Good evening, Dave\";\n}\n```\n\nBecause the result from hostname\
    \ ends with a carriage returnso that the output when run in a command shell looks\
    \ tidythe previous example uses chop to make sure that only non-whitespace characters\
    \ are compared.\n\n![](img/2edc6e6954e3485ad7d94117645931d8_193_0.png)\n\n**Exit\
    \ Codes** There is no way to obtain an exit code when using backticks. Instead,\
    \ you should use the exec function, which works just like passthru but returns\
    \ the command output as a string. The optional second argument can be used to\
    \ grab the exit code."
