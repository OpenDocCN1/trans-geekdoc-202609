- pgno: 188
  md: 'The complementary functions to `fgets` and `fread` to perform write operations
    on a file pointer are `fputs` and `fwrite`. These functions are actually identical
    to one another, with the newline character treated just like any other character
    as they are written to the file.


    The following example opens a file and writes to it the current time:


    ```

    $fp = fopen("time.txt", "w");

    fwrite($fp, "Data written at ".date("H:i:s"));

    fclose($fp);

    ```


    Remember that the apache user needs to have write permissions on the directory
    in order to create a new file.


    If you examine the new `time.txt` file, you will see that it does indeed contain
    the current time.


    # Working with Data Files


    One of the reasons you might need to access the filesystem from PHP is to load
    data from a structured file format into your script. One of the easiest file formats
    to use is comma-separated values (CSV).


    Although it would appear to be fairly easy to read a line of the file at a time
    and call `explode` to break up the line where each comma appears, this would not
    work where data elements in the CSV file contain commas. If you export data from
    a spreadsheet, columns containing commas are usually enclosed in quotes, so you
    need quite a complex rule to manipulate the data successfully.


    Fortunately, PHP includes the function `fgetcsv`. It works in a similar way to
    `fgets`, except that an array is returned, containing one element for each comma-separated
    value in the list. The size argument to `fgetcsv` is optional as of PHP 5.


    Often the first line of a CSV file contains the column headings. If you know that
    this is the case, you should discard the file line before processing the data
    file. The following example reads a comma-separated data file and dumps each record
    to screen by using `print_r`:


    ```

    $fp = fopen("data.csv", "r");

    while ($record = fgetcsv($fp, 1000)) {

    echo $chunk;

    }

    ```


    ![](img/2edc6e6954e3485ad7d94117645931d8_188_0.png)


    > **Reading CSV Files** The `fgetcsv` function requires a line length argument,
    just like `fgets`. In the previous example, this has an arbitrary value of `1000`,
    but you should ensure that whatever value you use is larger than the longest line
    in your data file.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'You can also write data to a CSV file without having to manually encode the
    format. The `fputcsv` function takes a file handle and an array argument and writes
    a comma-separated list of the elements in the array.


    The optional third and fourth arguments to `fputcsv` allow you to specify an alternate
    delimiter and enclosure characters, respectively; the defaults are the comma and
    double quote characters.


    # ## Working with URLs


    A powerful feature of PHP is its ability to deal with remote documents in the
    same way it deals with local files. It is possible to open a file handle or use
    the high-level filesystem access functions with a URL argument to read a web page
    from a PHP script.


    The following statements are both valid:


    ```

    `$page = file_get_contents("http://www.samspublishing.com/");`

    `$fp = fopen("http://www.samspublishing.com/", "r");`

    ```


    You cannot write to an HTTP URL by using `file_put_contents` or `fputs`, however.


    # ## Working with Directories


    Similarly to the way that `fopen` generates a file handle for accessing the contents
    of a file, you can create a directory handle to view the contents of a directory
    by using the `opendir` function.


    There are just three calls that can be performed on a directory handle`readdir`,
    `rewinddir`, and `closedir` each of which takes a single resource argument.


    Each call to `readdir` returns the next file from the directory. The order in
    which files are returned is the order in which they are stored by the filesystem
    and cannot be changed. The special items . and .. (the current working directory
    and its parent) are always returned.


    You use `rewinddir` to reset the directory handle to the beginning of the file
    list at any time, and you close the handle with `closedir` when you are finished
    with it.


    To find the name of the current working directory, you use `getcwd`. No arguments
    are required, and the full path to the current directory is returned. To change
    directory, you use `chdir` with a relative or absolute path.'
