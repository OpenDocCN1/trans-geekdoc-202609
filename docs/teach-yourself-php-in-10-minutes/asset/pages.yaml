- pgno: 41
  md: "# Loops\n\nPHP offers three types of loop constructs that all do the same thing\
    \ repeat a section of code a number of times in slightly different ways.\n\n#\
    \ The while Loop\n\nThe while keyword takes a condition in parentheses, and the\
    \ code block that follows is repeated while that condition is true. If the condition\
    \ is false initially, the code block will not be repeated at all.\n\n> **Infinite\
    \ Loops** The repeating code must perform some action that affects the condition\
    \ in such a way that the loop condition will eventually no longer be met; otherwise,\
    \ the loop will repeat forever.\n\nThe following example uses a while loop to\
    \ display the square numbers from 1 to 10:\n\n```\n$count = 1;\nwhile ($count\
    \ <= 10) {\n    $square = $count * $count;\n    echo \"$count squared is $square\
    \ <br>\";\n    $count++;\n}\n```\n\nThe counter variable $count is initialized\
    \ with a value of 1. The while loop calculates the square of that number and displays\
    \ it, then adds one to the value of $count. The ++ operator adds one to the value\
    \ of the variable that precedes it.\n\nThe loop repeats while the condition $count\
    \ <= 10 is true, so the first 10 numbers and their squares are displayed in turn,\
    \ and then the loop ends.\n\n# The do Loop\n\nThe do loop is very similar to the\
    \ while loop except that the condition comes after the block of repeating code.\
    \ Because of this variation, the loop code is always executed at least once even\
    \ if the condition is initially false.\n\nThe following do loop is equivalent\
    \ to the previous example, displaying the numbers from 1 to 10, with their squares:"
  merge: -1
  img_proc: true
- pgno: 42
  md: "```\n$count = 1;\ndo {\n  $square = $count * $count;\n  echo \"$count squared\
    \ is $square <br>\";\n  $count++;\n} while ($count <= 10);\n```\n\n# The **for**\
    \ Loop\n\nThe for loop provides a compact way to create a loop. The following\
    \ example performs the same loop as the previous two examples:\n\n```\nfor ($count\
    \ = 1; $count <= 10; $count++) {\n  $square = $count * $count;\n  echo \"$count\
    \ squared is $square <br>\";\n}\n```\n\nAs you can see, using **for** allows you\
    \ to use much less code to do the same thing as with **while** and **do** .\n\n\
    A **for** statement has three parts, separated by semicolons:\n\n+   - The first\
    \ part is an expression that is evaluated once when the loop begins. In the preceding\
    \ example, you initialized the value of $count .\n+   - The second part is the\
    \ condition. While the condition is true, the loop continues repeating. As with\
    \ a **while** loop, if the condition is false to start with, the following code\
    \ block is not executed at all.\n+   - The third part is an expression that is\
    \ evaluated once at the end of each pass of the loop. In the previous example,\
    \ $count is incremented after each line of the output is displayed.\n\n# Nesting\
    \ Conditions and Loops\n\nSo far you have only seen simple examples of conditions\
    \ and loops. However, you can nest these constructs within each other to create\
    \ some quite complex rules to control the flow of a script.\n\n> **Remember to\
    \ Indent** The more complex the flow control in your script is, the more important\
    \ it becomes to indent your code to make it clear which blocks of code correspond\
    \ to which constructs."
  merge: -1
  img_proc: true
