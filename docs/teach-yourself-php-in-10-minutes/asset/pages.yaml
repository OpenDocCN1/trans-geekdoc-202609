- pgno: 217
  md: "# # Performing a Query\n\nTo execute a SQL query through the DB class, you\
    \ use the query method. The return value depends on the type of query being executed,\
    \ but in the event of any error, a DB_Error object is returned, and the error\
    \ can be detected and diagnosed in the same way as can connection errors.\n\n\
    The following example executes the query stored in $sql with error checking:\n\
    \n```\n```php\n$res = $db->query($sql);\nif (DB::isError($res)) {\n    echo \"\
    Query error \" . $res->getMessage();\n    exit;\n}\n```\n```\n\nIf the query submitted\
    \ is an INSERT , UPDATE , or DELETE statement, the return value is the constant\
    \ DB_OK . You can find out the number of rows affected by the statement by calling\
    \ the affectedRows method on the database object itself, as shown in the following\
    \ example:\n\n```\n```php\n$sql = \"UPDATE mytable SET col2 = 'newvalue' WHERE\
    \ coll > 5\";\n$res = $db->query($sql);\necho $db->affectedRows() . \" row(s)\
    \ were affected\";\n```\n```\n\n# # Retrieving Selected Data\n\nIf you issue a\
    \ SELECT statement, the return value from the query is a DB_Result object, which\
    \ can then be used to access records from the result data set.\n\nTo view the\
    \ number of rows and columns in the data set, you use the numRows and numCols\
    \ methods, respectively, as in this example:\n\n```\n```php\n$sql = \"SELECT *\
    \ FROM mytable\";\n$res = $db->query($sql);\necho \"Query found \" . $res->numRows\
    \ . \" row(s) \".\n    \"and \" . $res->numCols . \" column(s)\";\n```\n```\n\n\
    You can use the fetchRow method on a DB_Result object to return a row of data\
    \ at a time in an array structure. The result pointer is then increased so that\
    \ each subsequent call to fetchRow returns the next row of data, in order. The\
    \ following code shows how you can fetch all the rows returned by a query by using\
    \ fetchRow in a loop:\n\n```\n```php\n$sql = \"SELECT coll, col2 FROM mytable\"\
    ;\n$res = $db->query($sql);\nwhile ($row = $res->fetchRow()) {\n    echo \"coll\
    \ = \" . $row[0] . \", \";\n    echo \"col2 = \" . $row[1] . \"<br>\";\n}\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 218
  md: "```\n}\n```\n\nIn this example, elements of `$row` are numerically indexed,\
    \ beginning at zero. Because the selected columns are specified in the `SELECT`\
    \ statement, the order is known and you can be sure that `$row[0]` contains the\
    \ value of `coll` .\n\nYou can give an optional argument to `fetchRow` to change\
    \ the array indexing. The default, which causes a numerically indexed array to\
    \ be created, is `DB_FETCHMODE_ORDERED` . By specifying `DB_FETCHMODE_ASSOC` ,\
    \ you cause an associative array to be created, using the column names as keys.\n\
    \nYou could use the following loop to reproduce the previous example, instead\
    \ using an associative array of the fetched values:\n\n```\nwhile ($row = $res->fetchRow(DB_FETCHMODE_ASSOC))\
    \ {\n   echo \"coll = \" . $row[\"coll\"] . \", \";\n   echo \"col2 = \" . $row[\"\
    col2\"] . \"<br>\";\n}\n```\n\nIf you prefer, you can use the `fetchRow` method\
    \ to create an object structure rather than an array, by passing the argument\
    \ `DB_FETCHMODE_OBJECT` . The following loop is equivalent to the previous two\
    \ examples, but it uses the object method:\n\n```\nwhile ($row = $res->fetchRow(DB_FETCHMODE_OBJECT))\
    \ {\n   echo \"coll = \" . $row->coll1. \", \";\n   echo \"col2 = \" . $row->col2\
    \ . \"<br>\";\n}\n```\n\n![](img/2edc6e6954e3485ad7d94117645931d8_218_0.png)\n\
    \n**Fetch Modes** Which fetch mode you use usually depends on your preference.\
    \ The associative array and object structures usually create mode-readable code.\
    \ However, where optimal performance is essential, you should try to use `DB_FETCHMODE_ORDERED`\
    \ .\n\n# Query Shortcuts\n\nIf a query will return only a single row and columnfor\
    \ instance, the result of a single aggregate functionyou can use the `getOne`\
    \ method to quickly execute the query and return the result. A string query argument\
    \ is supplied, and the database result is returned:\n\n```\n$sum = $db->getOne(\"\
    SELECT sum(coll) FROM mytable\");\n```"
