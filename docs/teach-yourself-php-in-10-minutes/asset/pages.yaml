    by `$temps["aug"]` , and so on.


    To reverse the sort order for any of these functions, you use `rsort` in place
    of `sort` . The reverse of `asort` is `arsort` , and the reverse of `ksort` is
    `krsort` . To reverse the order of an array as it stands without sorting, you
    simply use `array_reverse` .


    # Randomizing an Array


    As well as sorting the values of an array into order, PHP provides functions so
    that you can easily randomize elements in an array.


    The `shuffle` function works in a similar way to the sorting functions: It takes
    a single array argument and shuffles the elements in that array into a random
    order. As with `sort` , the key associations are lost, and the shuffled values
    will always be indexed numerically.


    # Set Functions


    By treating an array as a set of values, you can perform set arithmetic by using
    PHP''s array functions.


    To combine the values from different arrays (a union operation), you use the `array_merge`
    function with two or more array arguments, as in the following example:


    ```

    $union = array_merge($array1, $array2, $array3, ...);

    ```


    A new array is returned that contains all the elements from the listed arrays.
    In this example, the `$union` array will contain all the elements in `$array1`
    , followed by all the elements in `$array2` , and so on.


    To remove duplicate values from any array, you use `array_unique` so that if two
    different index keys refer to the same value, only one will be kept.


    The `array_intersect` function performs an intersection on two arrays. The following
    example produces a new array, `$intersect` , that contains all the elements from
    `$array1` that are also present in `$array2` :


    ```

    $intersect = array_intersect($array1, $array2);

    ```


    To find the difference between two sets, you can use the `array_diff` function.
    The following example returns the array `$diff` , which contains only elements
    from `$array1` that are not'
