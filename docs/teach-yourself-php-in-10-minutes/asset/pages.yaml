- pgno: 202
  md: '# Using MySQL


    This lesson assumes that you already have MySQL installed on your web server and
    that PHP has the MySQL module loaded. For information on installing MySQL, see
    http://dev.mysql.com/doc/mysql/en/Installing.html , and to learn how to activate
    MySQL support in PHP, refer to Lesson 23 , "PHP Configuration."


    ![](img/2edc6e6954e3485ad7d94117645931d8_202_0.png)


    **Further Reading** To learn about the MySQL database, read *Sams Teach Yourself
    MySQL in 24 Hours* by Julie Meloni. Or for a quick SQL language guide, refer to
    *Sams Teach Yourself SQL in 10 Minutes* by Ben Forta.


    PHP 5 introduced the mysqli extension, which can take advantage of new functionality
    in MySQL version 4.1 and higher and can also be used in an object-oriented manner.
    This book concentrates on the classic mysql extension, because it is still the
    version offered by many web hosting providers and remains available in PHP 5.


    Generally speaking, if you want to use mysqli instead of the classic mysql extension
    described in this lesson, most function names are prefixed mysqli rather than
    mysql , but they behave in a similar way. Refer to the online documentation at
    www.php.net/mysqli for more information.


    # Connecting to a MySQL Database


    You can connect to a MySQL database by using the mysql_connect function. Three
    arguments define your connection parameters: the hostname, username, and password.
    In many cases, the MySQL server will be running on the same machine as PHP, so
    this value is simply localhost . A typical mysql_connect statement may look like
    the following:


    ```

    ```

    $db = mysql_connect("localhost", "chris", "mypassword") ;

    ```

    ```


    ![](img/2edc6e6954e3485ad7d94117645931d8_202_1.png)


    **Database Hostnames** Because MySQL uses host-based authentication, you must
    provide the correct hostnameone that allows a connection to be made. For instance,
    your MySQL server may be running on www.yourdomain.com but it might only be configured
    to accept connections to localhost .


    Unless you are sure that the MySQL server is running somewhere else, the hostname
    to use is almost always localhost .'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'The `mysql_connect` function returns a database link identifier, which was
    assigned to `$db` in the previous example. This resource is used as an argument
    to the other MySQL functions.


    Notice that the connection parameters given to `mysql_connect` do not include
    a database name.

    In fact, selecting the database is a separate step after you are connected to
    a MySQL server; to

    do it, you use the `mysql_select_db` function. For example, the following statement
    selects `mydb`

    as the current database:


    ```

    `mysql_select_db ("mydb", $db);`

    ```


    Link Identifiers The `$db` argument is not actually required in

    `mysql_select_db` and many other MySQL functions. If it is omitted,

    PHP assumes that you mean the most recently opened MySQL

    connection. However, it is good practice to always include the link

    identifier in MySQL function calls for clarity in your code.


    After `mysql_select_db` has been called, every subsequent SQL statement passed
    to MySQL will

    be performed on the selected database.


    When you are finished using MySQL in a script, you close the connection and free
    up its resources

    by using `mysql_close` , like this:


    ```

    `mysql_close($db);`

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Executing SQL Statements


    The function to pass a SQL statement to MySQL is mysql_query . It takes two argumentsthe
    query itself and an optional link identifier.


    The following code executes a CREATE TABLE SQL statement on the MySQL database
    for $db :


    ```

    $sql = "CREATE TABLE mytable (coll INT, col2 VARCHAR(10 ))";

    mysql_query($sql, $conn);

    ```


    If you run a script that contains these statements in your web browser and check
    your MySQL database, you will find that a new table called mytable has been created.


    All types of SQL statement can be executed through mysql_query , whether they
    alter the data in some way or fetch a number of rows.


    # Commands That Change a Database


    Earlier in this lesson you saw an example of a CREATE TABLE statement. Other Data
    Definition Language (DDL) statements can be executed in a similar fashion, and,
    provided that no errors are encountered, they perform silently. You will learn
    about error handling later in this lesson.


    When executing a DELETE , INSERT , or UPDATE statemnts subset of SQL known as
    the Database Manipulation Language (DML)a number of rows in the table may be affected
    by the query. To find out how many rows are actually affected, you can use the
    mysql_affected_rows function. The following example shows how to do this with
    a simple UPDATE statement:


    ```

    $sql = "UPDATE mytable SET col2 = ''newvalue'' WHERE coll > 5";

    mysql_query($sql, $conn);

    echo mysql_affected_rows($conn) . " row(s) were updated";

    ```


    The argument to mysql_affected_rows is the database link identifier, and a call
    to this function returns the number of rows affected by the most recent query.
    The number of rows affected by this UPDATE statement is not necessarily the number
    of rows matching the WHERE clause. MySQL does not update a row if the new value
    is the same as the one already stored.


    ![](img/2edc6e6954e3485ad7d94117645931d8_204_0.png)


    **Deleting All Rows** If you execute a DELETE statement with no WHERE clause,
    the number returned by mysql_affected_rows is zero, regardless of the number of
    rows actually deleted. MySQL simply empties the table rather than delete each
    row in turn, so no count is available.'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# # Fetching Queried Data\n\nThe `SELECT` statement should return one or more\
    \ rows from the database, so PHP provides a set of functions to make this data\
    \ available within a script. In order to work with selected data, you must assign\
    \ the result from `mysql_query` to a result resource identifier, as follows:\n\
    \n```\n```php\n$res = mysql_query($sql, $db);\n```\n```\n\nYou cannot examine\
    \ the value of `$res` directly. Instead, you pass this value to other functions\
    \ to retrieve the database records.\n\nYou can use the function `mysql_result`\
    \ to reference a data item from a specific row and column number in the query\
    \ result. This is most useful when your query will definitely only return a single\
    \ valuefor instance, the result of an aggregate function.\n\nThe following example\
    \ performs a `SUM` operation on the elements in a table column and displays the\
    \ resulting value onscreen:\n\n```\n```php\n$sql = \"SELECT SUM(col1) FROM mytable\"\
    ;\n$res = mysql_query($sql, $conn);\necho mysql_result($res, 0, 0);\n```\n```\n\
    \nThe three arguments to `mysql_result` are the result resource identifier, a\
    \ row number, and a column number. Numbering for both rows and columns begins\
    \ at zero, so this example finds the first row in the first column in the result\
    \ set. In fact, because of the nature of aggregate functions, you can be sure\
    \ that there will always be only a single row and column in the result of this\
    \ query, even if there are no records in the table. An attempt to access a row\
    \ or column number that does not exist will result in an error.\n\nThe function\
    \ `mysql_num_rows` returns the number of rows found by the query, and you can\
    \ use this value to create a loop with `mysql_result` to examine every row in\
    \ the result. The following code shows an example of this:\n\n```\n```php\n$sql\
    \ = \"SELECT col1, col2 FROM mytable\";\n$res = mysql_query($sql, $db);\nfor ($i=0;\
