    |---|---|

    | `DB_PORTABILITY_NUMROWS` | Enables the numRows method to work correctly in Oracle
    |

    | `DB_PORTABILITY_RTRIM` | Forces trailing whitespace to be trimmed from fetched
    data |


    # Working with Quotes


    You can use the DB method quoteSmart to enclose a value in quotation marks so
    that it can be safely inserted into a column. String values are enclosed in quotes,
    and any characters that need to be delimited are automatically taken care of.


    The following example builds a SQL statement by using quoteSmart to ensure that
    the apostrophe in the string does not interfere:


    ```

    ```php

    $sql = "INSERT INTO phrases (phrase) ".

    "VALUES ( '' " . $db->quoteSmart($text) . " '' );";

    ```

    ```


    The following is the value of $sql when the previous statement is executed, using
    the MySQL driver:


    ```

    ```

    INSERT INTO phrases (phrase)

    VALUES ( ''Let\''s get ready to rumble'' )

    ```

    ```


    The output and the delimiting rules used depend on the database you are connected
    to.


    # Sequences


    The way sequences are implemented in different database engines varies considerably.
    In MySQL, for instance, you use the AUTO_INCREMENT attribute on a table column,
    and in SQL Server it is called an IDENTITY field. In Oracle you use CREATE SEQUENCE
    to create a database object that tracks the sequence value independently of any
    table.


    The DB class uses its own set of functions to manage sequences so that using any
    kind of auto-incrementing field does not tie your code to one particular database
    back end.


    ![](img/2edc6e6954e3485ad7d94117645931d8_221_0.png)


    **Sequences** If your back-end database supports CREATE SEQUENCE , that functionality
    will be used. Otherwise, the DB class emulates the sequence by using a table that
    holds the sequence value, and it performs an increment each time the sequence
    is accessed.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'To create a new sequence, you use the `createSequence` method on a database
    object, with a unique sequence identifier. After the sequence has been created,
    the `nextId` method can be called with that identifier to return the next sequential
    value.


    The following example creates a sequence called `order_number` and displays the
    first sequence value:


    ```

    $db->createSequence("order_number");

    echo $db->nextId("order_number");

    ```


    Subsequent calls to `nextId` for this sequence return incremental values.


    To drop a sequence when you no longer have a use for it, you call the `dropSequence`
    method.


    # Query Limits


    MySQL implements the `LIMIT` keyword in SQL statements, which you can use to restrict
    the number of rows returned by a query. This is nonstandard SQL, and other database
    systems do not include this feature.


    The `DB` class includes the `limitQuery` method, which you can use to emulate
    the `LIMIT` clause in a SQL statement for maximum compatibility. This method is
    called in the same way as a query, but it takes two additional arguments: to specify
    the starting row and number of rows to be returned.


    The following example returns five rows from the query''s data set, beginning
    at row 11 (where row numbering begins at zero):


    ```

    $res = $db->limitQuery("SELECT * FROM mytable", 10, 5);

    ```'
