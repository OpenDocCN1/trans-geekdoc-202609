- pgno: 68
  md: '# Anatomy of a String


    A *string* is a collection of characters that is treated as a single entity. In
    PHP, strings are enclosed in quotation marks, and you can declare a string type
    variable by assigning it a string that is contained in either single or double
    quotes.


    The following examples are identical; both create a variable called `$phrase`
    that contains the phrase shown:


    ```

    ```php

    $phrase = "The sky is falling";

    $phrase = ''The sky is falling'';

    ```

    ```


    > **Quote Characters** Quotation marks in PHP do not point in a direction. The
    same symbol is used to start a string as to indicate the end. You must use two
    apostrophe characters (` ` ) around a single-quoted stringdo not use backtick
    characters (` ` ).


    # Escaping Characters with Backslash


    Double quotes can be used within single-quoted strings and vice versa. For instance,
    these string assignments are both valid:


    ```

    ```php

    $phrase = "It''s time to party!";

    $phrase = ''So I said, "OK"'';

    ```

    ```


    However, if you want to use the same character within a quoted string, you must
    escape that quote by using a backslash. The following examples demonstrate this:


    ```

    ```php

    $phrase = ''It\''s time to party!'';

    $phrase = "So I said, \"OK\"";

    ```

    ```


    In the previous examples, if the backslash were not used, PHP would mismatch the
    quotes, and an error would result.


    Which style of quoting you use largely depends on personal preference and, hopefully,
    a desire to create tidy code. Remember, though, as you saw in Lesson 2 , "Variables,"
    that a variable'
  merge: -1
  img_proc: true
