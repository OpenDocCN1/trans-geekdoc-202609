- pgno: 115
  md: '# Creating and Using Objects


    To create an instance of an object from a class, you use the new keyword in PHP,
    as follows:


    ```

    $myObject = new myClass;

    ```


    In this example, myClass is the name of a class that must be defined in the scriptusually
    in an include fileand $myObject becomes a myClass object.


    **Multiple Objects** You can use the same class many times in the same script
    by simply creating new instances from that class but with new object names.


    # Methods and Properties


    The methods and properties defined in myClass can be referenced for $myObject
    . The following are generic examples:


    ```

    $myObject->myValue = "555-1234";

    $myObject->myMethod();

    ```


    The arrow symbol (-> )made up of a hyphen and greater-than symbolindicates a method
    or property of the given object. To reference the current object within the class
    definition, you use the special name $this .


    The following example defines myClass with a method that references one of the
    object properties:


    ```

    class myClass {

    var $myValue = "Jelly";


    function myMethod() {

    echo "myValue is " . $this->myValue . "<br>";

    }

    }

    ```


    ```

    $myObject = new myClass;

    ```'
