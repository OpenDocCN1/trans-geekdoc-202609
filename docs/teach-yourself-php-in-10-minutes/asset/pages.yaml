- pgno: 142
  md: '# Lesson 13. Form Validation


    In this lesson you will learn some techniques for validating form input in a user-friendly
    way.


    The principles of validating user-submitted input are fairly straightforward:
    Just check each item in $__POST in turn and make sure it matches a set of criteria.
    However, making sure the user is able to correct any mistakes and resubmit the
    form with a minimum of fuss presents a bit more of a challenge.'
  merge: -1
  img_proc: true
- pgno: 143
  md: "# Enforcing Required Fields\n\nThe most basic type of form validation is to\
    \ enforce that a particular field must contain a value. In the case of a text\
    \ input that is submitted with no value entered, the element in $_POST is still\
    \ created, but it contains an empty value. Therefore, you cannot use isset to\
    \ check whether a value was entered; you must check the actual value of the element,\
    \ either by comparing it to an empty string or by using the following, more compact\
    \ syntax with the Boolean NOT operator:\n\n```\nif (!$_POST[\"fieldname\"]) {\
    \ ... }\n```\n\nBecause each field on the form creates an element in $_POST ,\
    \ if every field requires a value to be entered, you could use a simple loop to\
    \ check that there are no empty values in the array:\n\n```\nforeach($_POST as\
    \ $field => $value) {\n    if (!$value) {\n        $err .= \"$field is a required\
    \ field <br>\";\n    }\n}\nif ($err) {\n    echo $err;\n    echo \"Press the back\
    \ button to fix these errors\";\n} else {\n    // Continue with script\n}\n```\n\
    \nRather than exit as soon as an empty field is found, this script builds up an\
    \ error string, $err . After the validation is done, the contents of $err are\
    \ displayed if there are any errors. If there are no errors, $err is empty, and\
    \ script execution continues with the else clause.\n\n> **Validation Warnings**\
    \ Always show all the warning messages that relate to the submitted data straight\
    \ away. You should give your users the opportunity to correct their errors all\
    \ at one time.\n\nOne obvious limitation of this approach is that you cannot pick\
    \ which fields require a value; every posted field must have been completed. You\
    \ could improve upon this by supplying a list of"
  merge: -1
  img_proc: true
- pgno: 144
  md: "required fields in the script, and by using an associative array, you can also\
    \ provide a label for each field to display in the warning message:\n\n```\n$required\
    \ = array(\"first_name\" => \"First name\",\n    \"email\" => \"Email address\"\
    ,\n    \"telephone\" => \"Telephone number\");\nforeach($required as $field =>\
    \ $label) {\n    if (!$_POST[$field]) {\n        $err .= \"$label is a required\
    \ field <br>\";\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 145
  md: "# Displaying Validation Warnings\n\nAnother issue to consider is where to send\
    \ the user when validation fails. So far we have assumed that a form submits to\
    \ a processing script, and when one or more validation errors are found, the form\
    \ prompts the user to use his or her browser's Back button to fix the errors.\n\
    \nNot only does this create one more step for the user to take in order to complete\
    \ the formand in an online store, you want as few obstacles between a customer\
    \ and a completed order as possibleit can also sometimes cause the data in the\
    \ form fields to be lost when Back is clicked.\n\nWhether the Back button causes\
    \ data to be lost usually depends on the cache settings, either on the web server,\
    \ in the user's browser, or at the user's Internet service provider. In many cases\
    \ there is no problem. However, most notably when a PHP session has been started,\
    \ no-cache headers are automatically sent to the browser, which causes data in\
    \ form fields to be reset to their original values when you click the Back button.\
    \ You will learn more about PHP sessions in Lesson 14 ,\"Cookies and Sessions.\"\
    \n\nA good technique is to have the form and processing script in the same file\
    \ and have the form submit to itself. This way, if there are errors, they can\
    \ be displayed on the same page as the form itself, and the previously entered\
    \ values can be automatically defaulted into the form.\n\nListing 13.1 shows a\
    \ fairly complete example of a registration form, register.php . The name and\
    \ email address fields are required, but the telephone number is optional.\n\n\
    # Listing 13.1. A Sample Registration Form with Required Fields\n\n```\n<?php\n\
    $required = array(\"name\" => \"Your Name\",\n                 \"email\" => \"\
    Email Address\");\n\nforeach($required as $field => $label) {\n   if (!$_POST[$field])\
    \ {\n      $err .= \"$label is a required field <br>\";\n   }\n}\n\nif ($err)\
    \ {\n   echo $err;\n}\n\n?>\n<FORM ACTION=\"register.php\" METHOD=POST>\n<TABLE\
    \ BORDER=0>\n<TR>\n   <TD>Your Name</TD>\n   <TD><INPUT TYPE=TEXT SIZE=30 NAME=\"\
    name\"\n      VALUE=\"<?php echo $_POST[\"name\"]; ?>\"></TD>\n</TR>\n<TR>\n```"
  merge: -1
  img_proc: true
- pgno: 146
  md: "```\n<TD>Email Address</TD>\n<TD><INPUT TYPE=TEXT SIZE=30 NAME=\"email\"\n\
    VALUE=\"<?php echo $_POST[\"email\"]; ?>\"></TD>\n</TR>\n<TR>\n<TD>Telephone</TD>\n\
    <TD><INPUT TYPE=TEXT SIZE=12 NAME=\"telephone\"\nVALUE=\"<?php echo $_POST[\"\
    telephone\"]; ?>\"></TD>\n</TR>\n</TABLE>\n<INPUT TYPE=SUBMIT VALUE=\"Register\"\
    >\n</FORM>\n\n<?php\n}\nelse {\n    echo \"Thank you for registering\";\n}\n?>\n\
    ```\n\nNote that the warning messages in this example appears even if the form\
    \ has not yet been submitted. This could be improved by also checking for the\
    \ existence of the `$_POST` array in the script by using `is_array`, but the check\
    \ for `$err` would also need to look for `$_POST` ; otherwise, the form would\
    \ never be displayed.\n\nThe condition that checks `$err` spans the HTML form\
    \ and, even though the PHP tags are closed around this chunk of HTML, the form\
    \ is displayed only if that condition is true.\n\nIn this example, after the form\
    \ has been completed successfully, only a simple message is displayed. This is\
    \ where you would do any processing based on the submitted data, such as storing\
    \ it to a database, which you will learn about in Lesson 19 , “Using a MySQL Database.”\
    \ Alternatively, the script could force the browser to redirect the user to another\
    \ page automatically by using a Location HTTP header, as follows:\n\n```\nheader(\"\
    Location: newpage.php\");\n```"
  merge: -1
  img_proc: true
- pgno: 147
  md: '# # Enforcing Data Rules


    You will often want to ensure not only that data is entered into required fields
    but that the quality of the data is good enough before proceeding. For instance,
    you might want to check that an email address or a phone number has the right
    format, using the rules developed in Lesson 8 , "Regular Expressions." You could
    also enforce a minimum length on a field to make sure a user cannot just enter
    an x in each field to continue to the next page.


    Because each field will probably have a different validation rule, you cannot
    enforce data rules in a loop; you must instead write a rule for each field to
    be checked. However, when used in conjunction with the check for empty fields
    in a loop from the previous examples, you should also check that the value has
    been entered before doing any further validation. Otherwise, the warning message
    will first tell a user that a field is required and then also that it has been
    entered in the wrong format!


    The following rules could be added to Listing 13.1 after the required fields check
    to enforce suitable values for email address and telephone number:


    ```

    if ($_POST["email"] &&

    !ereg("^[^@]+@([a-z0-9\-]+\.)+[a-z]{2,4}$",

    $_POST["email"]))

    $err .= "Email address format was incorrect <br>";


    if ($_POST["telephone"] &&

    !ereg("^\(([[:digit:]]{3})[[:digit:]]{3}-[[:digit:]]{4}$",

    $_POST["telephone"]))

    $err .= "Telephone must be in format (555)555-5555 <br>";

    ```


    Because these additional rules add new messages to $err if an error is found,
    the rest of the script remains unchanged.'
  merge: -1
  img_proc: true
- pgno: 148
  md: "# # Highlighting Fields That Require Attention\n\nRather than bombard the user\
    \ with a list of warning messages, it's more user-friendly to highlight the fields\
    \ in the form that require attention.\n\nThe technique to use here is very similar\
    \ to the previous example, but rather than append each warning message to $err\
    \ , you should give each field its own warning text. If you use an array of warnings,\
    \ it's simple to see whether the form has been successfully validated by counting\
    \ the elements in $warnings .\n\nYou write each rule to add an element to $warnings\
