- pgno: 161
  md: '# # Types of Authentication


    Chances are you have needed to log in to a website in the past, so you should
    be aware of how the process of authentication works from a user''s point of view.
    Generally speaking, you are asked to enter a usernamesometimes your email addressand
    a password.


    There are actually two ways that a website can authenticate a user, though: using
    basic HTTP authentication and using session-based authentication. The following
    sections clarify the differences between these two methods.


    # ## Basic HTTP Authentication


    Basic HTTP authentication can be performed by web server, without having anything
    to do with PHP script. The example in this section assumes that you are using
    Apache web server; for other web servers, you should refer to your documentation.


    Authentication is usually done on a per-directory basis but can be set up to apply
    to individual files if required. By using an .htaccess file on your website, you
    can specify for that directory a custom configuration that instructs the web server
    to require a login before proceeding. A typical set of configuration directives
    would look like this:


    ```

    AuthType Basic

    AuthName "Protected Website"

    AuthUserFile /home/yourname/htpasswd

    require valid-user

    ```


    AuthUserFile points to the location of a password file that is created by using
    the htpasswd program. To create a new password file, you would run a command like
    the following:


    ```

    $ htpasswd c /home/yourname/htpasswd chris

    New password:

    Re-type new password:

    ```


    > > **Password Files** You should use the c switch only when you want to create
    a new file. The htpasswd program does not ask whether you want to overwrite an
    existing file. Running htpasswd without the c option on an existing password file
    adds a user.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'You have to enter the new password twice, after which an entry is added to
    the password file given. The entry consists of the username and an encrypted version
    of the password, separated with a colon character. However, you should never need
    to work with this file directly. A typical password file entry might look like
    this:


    ```

    chris:XNiv7qSUTFPU6

    damon:ZxxE2PTExEVNU

    shelley:SVzAEtXmMLEAls

    vanessa:cX/t1Pv2oQfrY

    ```


    When you try to access a file in the protected directory, your web browser pops
    up a window that asks for a username and password, and the page requested loads
    only after you have entered the correct information.


    The `require valid-user` directive instructs the web server to show the page to
    any authenticated user. You might want to grant access to only certain users,
    which you can do with the `require user` directive:


    ```

    require user chris damon shelley

    ```


    Basic HTTP authentication also allows you to set up user groups to give access
    to particular sections of the site only to certain users. You can then use the
    `require group` directive to specify access to one or more user groups.


    The following groups file, usually named `htgroups`, divides the users in the
    password file into two groups:


    ```

    boys: chris damon

    girls:shelley vanessa

    ```


    To give access only to the boys group, you could use the following `.htaccess`
    file:


    ```

    AuthType Basic

    AuthName "Boys Only"

    AuthUserFile /home/yourname/htpasswd

    AuthGroupFile /home/yourname/htgroup

    require group boys

    ```


    Although it is fairly easy to set up and reasonably flexible, basic HTTP authentication
    has some drawbacks. First, you cannot change the look and feel of the pop-up login
    box. If you want to customize the process at all, you cannot use this method.
    Furthermore, the password file is stored on the server''s filesystem, and updating
    it from a script may be problematic; you will learn more about these issues when
    dealing with reading and writing to files in Lesson 17 , "Filesystem Access."'
  merge: -1
  img_proc: true
- pgno: 163
  md: '**Apache Add-ons** Several third-party modules for the Apache web servers such
    as `mod_auth_mysql` and `mod_auth_sqlite` allow you to use basic HTTP authentication
    with password information stored in a database. Check with your web host to see
    whether these modules are installed.


    # Session-Based Authentication


    To provide a completely customizable login process for your website, you must
    implement it yourself, and doing so in PHP requires using session variables.


    In a nutshell, once a user is logged in, the browser''s session contains enough
    information to convince the scripts on the website that you are allowed to view
    a page. Users log in by using a form on your site where they enter their username
    and password. You can set up the layout and flow of the login process any way
    you see fit.


    One fairly significant difference from basic HTTP authentication is that the instruction
    to check the validity of a user''s session appears in the script itself, not in
    a per-directory configuration file.


    **Protecting HTML** If your website includes plain HTML files that contain no
    PHP, you need to add PHP code to them to prevent them from being viewable to an
    anonymous user. You also need to change their file extension to `.php` .'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# # Building an Authentication System\n\nThe rest of this lesson walks you\
    \ through building an authentication mechanism using PHP sessions.\n\n# ## How\
    \ the System Works\n\nThere are two main components of the authentication system\
    \ you're going to build now. First, you need a login processor that checks the\
    \ validity of the username and password entered in the form. You also need a piece\
    \ of code that can be put at the top of each script to check the session and make\
    \ sure the user is authenticated before continuing.\n\n> **Login Forms** You need\
    \ to make sure you always use the POST method for login forms. Submitting a username\
    \ and password by using the GET method causes these values to appear in the URL\
    \ of the next page for anyone to see!\n\nYou should split off the session-checking\
    \ code into an include file, auth.inc , so that it is simple to protect a page\
    \ by simply putting the following statement at the top of the script:\n\n```\n\
    include \"auth.inc\";\n```\n\nYou can use a single session variable to store the\
    \ username of the logged-in user. If the variable contains a username, that user\
    \ is logged in; logging a user out is as simple as deleting this session variable.\
    \ As long as nobody else shares the domain on which your website is hosted and\
    \ could create a conflicting session, this is adequately secure. Knowing this,\
    \ auth.inc can really be as simple as the following:\n\n```\nsession_start();\n\
    if (!isset($_SESSION[\"auth_username\"])) {\n    echo \"You must be logged in\
    \ to view this page\";\n    exit;\n}\n```\n\nHere you simply display a message\
    \ and exit the script if the user is not logged in. You will see later on how\
    \ you can improve this for usability, but you need to create the login process\
    \ itself first."
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Authenticating a Login


    The login form, at its heart, needs to contain just two fieldsusername and password
    and a submit button. As long as these are present, the form''s layout is up to
    you. For now, you can keep it fairly plain, in a simple table layout. Listing
    15.1 shown the basic login form.


    # Listing 15.1. A Basic Login Form


    ```

    <FORM ACTION="login.php" METHOD="POST">

    <TABLE BORDER=0>

    <TR>

    <TD>Username:</TD>

    <TD><INPUT TYPE="TEXT" SIZE=10 NAME="username"></TD>

    </TR>

    <TR>

    <TD>Password:</TD>

    <TD><INPUT TYPE="PASSWORD" SIZE=10 NAME="password"></TD>

    </TR>

    </TABLE>

    <INPUT TYPE=SUBMIT VALUE="Log in">

    </FORM>

    ```


    ![](img/2edc6e6954e3485ad7d94117645931d8_165_0.png)


    > **Password Fields** The PASSWORD type input works exactly the same way as a
    TEXT type, but the characters entered are obscured as they are typed. The only
    restriction on a password field is that it cannot be given a VALUE attribute for
    a default value.


    The form handler script, login.php , needs to check the submitted username and
    password values against the list of valid users. In most cases, you would check
    the values against a user database. You will learn about database access in PHP
    in Lessons 19 , "Using a MySQL Database," and 20 , "Database Abstraction," and
    for now you can just use a simple array of users who are permitted to use the
    site. Listing 15.2 shows how to do this.


    # Listing 15.2. A Login Processor Script


    ```

    <?php


    session_start();


    $passwords = array("chris" => "letmein",

    "damon" => "thisisme",

    "shelley" => "mypassword",

    ```'
  merge: -1
  img_proc: true
- pgno: 166
  md: "```\n```php\n\"vanessa\" => \"opensesame\");\nif (!$_POST[\"username\"] or\
    \ !$_POST[\"password\"]) {\n    echo \"You must enter your username and password\"\
    ;\n    exit;\n}\nif ($_POST[\"password\"] == $passwords[$_POST[\"username\"]])\
    \ {\n    echo \"Login successful\";\n    $_SESSION[\"auth_username\"] = $_POST[\"\
    username\"];\n} else {\n    echo \"Login incorrect\";\n}\n?>\n```\n```\n\nFirst,\
    \ an associative array of passwords is built, using the usernames as keys. The\
    \ script first checks that both the username and password have been entered and\
    \ exits immediately if that information is missing.\n\nThen the submitted password\
    \ is compared to the array element whose key is the submitted username. If the\
    \ two passwords match, the user is logged in, and the `auth_username` session\
    \ variable is initialized. Otherwise, a message is displayed that the login failed.\n\
    \nAfter a user's session has been validated, he or she can view a protected page\
    \ without `auth.inc` interrupting the script's progress.\n\n# Encrypting Passwords\n\
    \nIn the previous example, the passwords are stored in plain text. You probably\
    \ suspected that this is not particularly secure; anyone who can view the source\
    \ code of this script can see the passwords for every user.\n\n![](img/2edc6e6954e3485ad7d94117645931d8_166_0.png)\n\
    \n> > **Prying Eyes** Even if your server security is airtight, can you be sure\
    \ that nobody is looking over your shoulder? You should always try to prevent\
    \ unencrypted passwords from being displayed onscreen.\n\nThe `crypt` function\
    \ in PHP provides a simple but effective one-way encryption algorithm. The same\
    \ kind of encryption is used by `htpasswd` and even Unix system passwords. To\
    \ encrypt a password, you pass the password to `crypt` , along with `$salt` another\
    \ string around which the encryption is based:\n\n```\n```php\n$crypt_password\
    \ = crypt($password, $salt);\n```\n```"
