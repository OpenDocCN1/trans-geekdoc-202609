- pgno: 226
  md: '# # PHP Shell Scripts on Linux/Unix


    On a Linux/Unix platform, a *shell script* is simply a text file that contains
    a series of instructions that are to be processed by a specific language interpreter.
    The simplest shell interpreter is the Bourne Shell, `sh`, although these days
    it has been superseded by the Bourne Again Shell, `bash`, which is fully compatible
    with `sh` but also includes other useful features.


    Because the command language available in most command shells is very restrictive
    and often requires calls to external programs, PHP is not only a more powerful
    language, suitable for many tasks, but its built-in features also usually give
    better performance than the standard system tools.


    ![](img/2edc6e6954e3485ad7d94117645931d8_226_0.png)


    **PHP Location** The `php` executable is usually installed to `/usr/local/bin`
    or `/usr/bin`, depending on whether it was installed from source or a binary package,
    but your actual location may vary. Try typing `which php` to find the location
    if you do not know it.


    All shell scripts must begin with the characters `#!` , followed by the path to
    the command interpreter that is to be used. For a traditional shell script, this
    would look like the following:


    ```

    #!/bin/sh

    ```


    However, for a PHP script, the first line would be


    ```

    #!/usr/local/bin/php

    ```


    ![](img/2edc6e6954e3485ad7d94117645931d8_226_1.png)


    **Hash Bang** The most widely used pronunciation for the character sequence `#!`
    , found at the start of a shell script, is "hash bang," although sometimes it
    is also referred to as "shebang."


    The file permissions on a shell script must allow the file to be executed. To
    set execute permission for the owner of the file, you use the following command:


    ```

    $ chmod u+x myscript.php

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'If your script is to be run by any system user, the command to set global execute
    permission is as follows:


    ```

    $ chmod a+x myscript.php

    ```


    If the execute bit is not set, you can still run a file that contains a series
    of PHP commands through the PHP interpreter by invoking php with a filename argument.
    The following two commands are identical to one another (the f switch can be used
    for clarity but is not required):


    ```

    $ php myscript.php

    $ php f myscript.php

    ```


    **Script Names** There are no naming requirements for any type of shell script.
    However, it is useful to retain the .php extension so that the filename indicates
    a PHP script. Bourne shell scripts sometimes have the file extension .sh but often
    are command names with no file extension at all.


    # # PHP Command Scripts on Windows


    Windows does not allow an alternate command interpreter to be used in a batch
    script, so to execute a PHP script under Windows, you have to pass a filename
    argument to php.exe . The f switch is optional, so the following two commands
    are identical to one another:


    ```

    > php.exe myscript.php

    > php.exe f myscript.php

    ```


    **Batch Scripts** If you want, you can create a simple batch script to invoke
    php.exe with the correct filename argument so that you can run your script by
    using a single command.


    To do so, you create a file named myscript.bat that contains the command php.exe
    , followed by your script name. You can then run that script by simply entering
    myscript at the command prompt.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# # Embedding PHP Code


    Just as when it is used in the web environment, PHP code in a command script needs
    to be embedded. Any text that does not appear inside <?php tags is sent straight
    to the output.


    Because you usually want to create a script that is entirely made up of PHP code,
    you must remember to begin every PHP shell script with a <?php tag. However, the
    embedded nature of PHP means you could create a PHP script that generates only
    certain elements within a largely static text file.'
