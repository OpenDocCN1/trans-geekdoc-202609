- pgno: 84
  md: "# # Array Functions\n\nYou have already seen the `array` function used to generate\
    \ an array from a list of values. Now let's take a look at some of the other functions\
    \ PHP provides for manipulating arrays.\n\nThere are many more array functions\
    \ in PHP than this book can cover. If you need to perform a complex array operation\
    \ that you have not learned about, refer to the online documentation at www.php.net/ref.array\
    \ .\n\n# ## Sorting\n\nTo sort the values in an array, you use the `sort` function\
    \ or one of its derivatives, as in the following example:\n\n```\nsort($temps);\n\
    ```\n\n> **Sorting Functions** `sort` and other related functions take a single\
    \ array argument and sort that array. The sorted array is not returned; the return\
    \ value indicates success or failure.\n\nSorting the original `$temps` array with\
    \ `sort` arranges the values into numeric order, but the key values are also renumbered.\
    \ After you perform the sort, index 0 of the array will contain the lowest value\
    \ from the array, and there is no way of telling which value corresponds to each\
    \ month.\n\nYou can use `asort` to sort an array while maintaining the key associations,\
    \ whether it is an associative array or numerically indexed. After you sort `$temps`\
    \ , index 0 will still contain January's average temperature, but if you loop\
    \ through the array, the elements will be retrieved in sorted order.\n\nUsing\
    \ the associative array `$temps` as an example, the following code displays the\
    \ months and their average temperatures, from coldest to hottest:\n\n```\n$temps\
    \ = array(\"jan\" => 38, \"feb\" => 40, \"mar\" => 49,\n    \"apr\" => 60, \"\
    may\" => 70, \"jun\" => 79,\n    \"jul\" => 84, \"aug\" => 83, \"sep\" => 76,\n\
    \    \"oct\" => 65, \"nov\" => 54, \"dec\" => 42);\nasort($temps);\nforeach($temps\
    \ as $month => $temp) {\n    print \"$month: $temp <br>\\n\";\n}\n```"
