  md: "To begin using the DB class in scripts, you simply include it by using the\
    \ following statement:\n\n```\ninclude \"DB.php\";\n```\n\nTo make a connection\
    \ to a database, you call the connect method on the DB class, giving your DSN\
    \ as the argument:\n\n```\n$db = DB::connect($dsn);\n```\n\nThe $db return value\
    \ is an object on which the DB class methods can be invoked to perform different\
    \ types of database operation.\n\n> **Database Objects** Note that you cannot\
    \ create a new instance of a DB object by using the `new` keyword. You must call\
    \ `DB::connect` to begin a new database session.\n\nIf the database connection\
    \ fails, the return value is a DB_Error object, which you can analyze by using\
    \ the `isError` and `getMessage` methods. The following code shows a database\
    \ connection attempt with error checking:\n\n```\n$db = DB::connect($dsn);\nif\
    \ (DB::isError($db)) {\n    echo \"Connection error: \" . $db->getMessage();\n\
    \    exit;\n}\n```\n\nThe function `isError` returns `True` only if the argument\
    \ passed is a `DB_Error` object, which indicates a problem of some kind with the\
    \ database connection. You can then call the `getMessage` method on the `DB_Error`\
    \ object to retrieve the actual error message from the database server.\n\n> **Connection\
    \ Errors** `$db` is assigned an object value of some kind, whether or not the\
    \ connection is successful. Its value will never be `NULL` or `FALSE`."
