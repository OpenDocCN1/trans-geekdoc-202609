  md: "# Bootstrapping Confidence Intervals\n\nBootstrapping is a resampling technique\
    \ that allows for the construction of confidence intervals without relying on\
    \ parametric assumptions. It involves repeatedly resampling the data with replacement\
    \ and calculating the statistic of interest for each resample.\n\n```\nuse rand::seq::SliceRandom;\
    \ use rand::thread_rng;\n\nfn bootstrap_confidence_interval(data: &[f64], num_resamples:\
    \ usize,\nconfidence_level: f64) -> (f64, f64) {\n    let mut rng = thread_rng();\n\
    \    let mut resample_means = vec![];\n\n    for _ in 0..num_resamples {\n   \
    \     let resample: Vec<f64> = data.choose_multiple(&mut rng,\ndata.len()).cloned().collect();\n\
    \        let resample_mean: f64 = resample.iter().sum::<f64>() / resample.len()\
    \ as\nf64;\n        resample_means.push(resample_mean);\n    }\n\n    resample_means.sort_by(|a,\
    \ b| a.partial_cmp(b).unwrap());\n    let lower_index = ((1.0 - confidence_level)\
    \ / 2.0 * num_resamples as\nf64).round() as usize;\n    let upper_index = ((1.0\
    \ + confidence_level) / 2.0 * num_resamples as\nf64).round() as usize;\n\n   \
    \ (resample_means[lower_index], resample_means[upper_index])\n}\n\nfn main() {\n\
    \    let data = vec![14.8, 15.1, 15.5, 14.9, 15.2];\n    let confidence_level\
    \ = 0.95;\n    let num_resamples = 1000;\n}\n```"
