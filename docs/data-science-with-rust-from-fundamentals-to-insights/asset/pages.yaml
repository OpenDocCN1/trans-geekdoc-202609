    # Statistical Inference

    Understanding the Basics of Statistical Inference


    At its core, statistical inference involves using data from a sample to make statements
    about a larger population. This process relies on two main types of inference:
    estimation and hypothesis testing.


    +   - **Estimation**: Involves estimating population parameters (such as the mean
    or variance) based on sample data. Estimators can be point estimates (single values)
    or interval estimates (ranges of values).

    +   - **Hypothesis Testing**: A procedure to test whether a hypothesis about a
    population parameter is supported by sample data. It involves formulating a null
    hypothesis (H0) and an alternative hypothesis (H1), then using sample data to
    determine whether to reject H0.


