  md: '# CHAPTER 5: MACHINE LEARNING FUNDAMENTALS


    Machine learning is a subset of artificial intelligence (AI) that focuses on the
    development of algorithms capable of identifying patterns and making decisions
    based on data. The primary objective of machine learning is to enable systems
    to learn from data autonomously and improve their accuracy over time without human
    intervention.


    Consider the task of predicting house prices in Vancouver. Traditional programming
    would require us to define explicit rules for pricing. With machine learning,
    we can train a model using historical data of house prices and various features
    (like size, location, number of rooms) to predict future prices with minimal manual
    coding.


    # Types of Machine Learning


    Machine learning can be broadly categorized into three main types: supervised
    learning, unsupervised learning, and reinforcement learning. Each type addresses
    different kinds of problems and requires different approaches.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# # Supervised Learning


    In supervised learning, the algorithm is trained on a labeled dataset, which means
    the input data is paired with the correct output. The goal is to learn a mapping
    from inputs to outputs based on the training data.


    **Example:** Predicting housing prices based on features such as size, location,
    and the number of bedrooms. The training data includes historical prices labeled
    with these features.


    **Common Algorithms:** - **Linear Regression**: Models the relationship between
    input and output variables by fitting a linear equation. - **Decision Trees**:
    Splits the data into subsets based on the value of input features, creating a
    tree-like model of decisions.


    # # Unsupervised Learning


    Unsupervised learning algorithms are trained on data without labeled responses.
    The goal is to find hidden patterns or intrinsic structures within the data.


    **Example:** Clustering similar types of fish found in Vancouver waters based
    on their characteristics like size, weight, and colour.


    **Common Algorithms:** - **K-Means Clustering**: Partitions data into K distinct
    clusters based on feature similarity. - **Principal Component Analysis (PCA)**:
    Reduces dimensionality by transforming data into a set of uncorrelated variables
    called principal components.


    # # Reinforcement Learning


    Reinforcement learning is an area of machine learning where an agent learns to
    make decisions by performing actions in an environment to maximize some notion
    of cumulative reward.'
  merge: -1
  img_proc: true
