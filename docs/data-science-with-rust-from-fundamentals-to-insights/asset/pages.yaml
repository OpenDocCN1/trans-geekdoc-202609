- pgno: 189
  md: "# # Types of Probability\n\nThere are several types of probability, each serving\
    \ different purposes in various applications.\n\n+   1. **Theoretical Probability**:\
    \ Based on known possible outcomes. For example, rolling a fair six-sided die.\n\
    +   2. **Experimental Probability**: Based on actual experiments and observed\
    \ outcomes. For instance, flipping a coin 100 times and observing the results.\n\
    +   3. **Subjective Probability**: Based on personal judgment or experience, rather\
    \ than exact calculations.\n\nTo illustrate experimental probability in Rust,\
    \ consider a simple dice roll simulation:\n\n```\n```rust\nuse rand::Rng;\n\n\
    fn main() {\n    let mut rng = rand::thread_rng();\n    let mut counts = [0; 6];\n\
    \n    for _ in 0..1000 {\n        let roll: usize = rng.gen_range(0..6);\n   \
    \     counts[roll] += 1;\n    }\n\n    for (i, count) in counts.iter().enumerate()\
    \ {\n        println!(\"P({}): {}\", i + 1, *count as f64 / 1000.0);\n    }\n\
    }\n```\n```"
  merge: -1
  img_proc: true
