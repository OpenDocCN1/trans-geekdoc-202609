  md: "# Conditional Probability\n\nConditional probability measures the probability\
    \ of an event occurring given that another event has already occurred. It's expressed\
    \ as: [ P(A|B) = \\frac{P(A \\cap B)}{P(B)} ]\n\nFor instance, in a deck of 52\
    \ cards, the probability of drawing an ace is 4/52. If we know the first card\
    \ drawn is an ace, the probability of drawing another ace is 3/51.\n\nIn Rust,\
    \ you might simulate this using conditional checks:\n\n```\n```rust fn conditional_probability(deck:\
    \ &mut Vec<&str>, event: &str) -> f64 { let total = deck.len(); let count = deck.iter().filter(|&&card|\
    \ card == event).count();\n\ncount as f64 / total as f64\n}\n\nfn main() {\n \
    \   let mut deck: Vec<&str> = vec![\"Ace\"; 4].into_iter().chain(vec![\"Other\"\
    ; 48].into_iter()).collect();\n    let event = \"Ace\";\n\n    println!(\"P(Ace):\
    \ {:.2}\", conditional_probability(&mut deck, event));\n\n    // Remove one ace\n\
    \    if let Some(pos) = deck.iter().position(|&x| x == event) {\n        deck.remove(pos);\n\
    \    }\n\n    println!(\"P(Second Ace | First Ace): {:.2}\", conditional_probability(&mut\
    \ deck, event));\n}\n```\n```"
