    # Hierarchical Clustering


    Hierarchical clustering builds a hierarchy of clusters by either a bottom-up (agglomerative)
    or a top-down (divisive) approach. Imagine starting with individual trees in Stanley
    Park and gradually merging them based on their similarities to form a forest,
    or starting with the entire forest and splitting it into individual trees. Hierarchical
    clustering provides a detailed view of data''s structure, often visualized through
    dendrograms.


    # Step-by-Step Guide to Agglomerative Clustering


    +   1. **Initialization**: Start with each data point as its cluster.

    +   2. **Merge Clusters**: At each step, merge the two closest clusters based
    on a distance metric (e.g., Euclidean distance).

    +   3. **Repeat**: Repeat the merging process until all data points are in a single
    cluster or a stopping criterion is met.


    # Mathematical Formulation


