  md: '# 2. Theoretical Foundations


    The core idea of SVM is to find the hyperplane that maximizes the margin. Let''s
    explore some key mathematical concepts:


    +   - **Linear SVM:** For linearly separable data, SVM identifies a hyperplane
    ( w \cdot x - b = 0 ) that maximizes the margin. [ \text{Maximize} \frac{2}{||w||}
    ] subject to the constraints: [ y_i (w \cdot x_i - b) \ge 1 ]

    +   - **Non-Linear SVM:** For non-linearly separable data, SVM uses kernel functions
    to project the data into a higher-dimensional space where a linear hyperplane
    can be found. Common kernels include:

    +   - **Polynomial Kernel:** ( (x_i \cdot x_j + 1)^d )

    +   - **Radial Basis Function (RBF) Kernel:** ( \exp(-\gamma ||x_i - x_j||^2)
    )


