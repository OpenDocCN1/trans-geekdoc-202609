  md: '# 3. Gradient Boosting Machines


    # Introduction to Gradient Boosting


    In the bustling heart of Vancouver, where the ocean meets the mountains, lies
    a city brimming with innovation and technology. It''s here, amidst the vibrant
    tech scene, that Gradient Boosting Machines (GBMs) have found their way into the
    toolbox of many data scientists. GBMs are a powerful ensemble learning technique
    that builds models incrementally, combining the strengths of multiple weak learners
    to create a robust predictive model.


    # The Mechanics of Gradient Boosting


    At its core, gradient boosting involves iteratively adding models to correct the
    errors made by the combined ensemble. The process starts with a simple model,
    often a decision tree, and subsequent models are trained to predict the residuals
    (errors) of the preceding model. This iterative process continues until the ensemble''s
    predictive performance no longer improves significantly.


    # Step-by-Step Guide to Gradient Boosting


    +   1. **Initialization**: Begin with an initial model, typically a constant value
    that minimizes the loss function. For regression tasks, this might be the mean
    of the target values.


    +   2. **Compute Residuals**: Calculate the residuals between the actual values
    and the predictions of the current model.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '+   3. **Fit New Model**: Train a new model on the residuals. This model aims
    to correct the errors made by the previous model.


    +   4. **Update Ensemble**: Add the new model to the ensemble, combining it with
    the previous models. The combination is typically weighted by a learning rate,
    which controls the contribution of each new model.


    +   5. **Repeat**: Repeat steps 2-4 for a pre-defined number of iterations or
    until the model''s performance stabilizes.


    # Mathematical Formulation


    Consider a dataset ({((x_i, y_i))}_{i=1}^N), where (x_i) represents the input
    features, and (y_i) represents the target variable. The goal is to build an ensemble
    model (F(x)) that predicts (y) from (x).


    +   1. **Initialize** the model with a constant value: [ F_0(x) = \arg\min\_\gamma
    \sum\_{i=1}^N L(y_i, \gamma) ] where (L) is the loss function.


    +   2. **For (m = 1) to (M)** (number of iterations):


    +   3. Compute the residuals: [ r_i^({m}) = -\left.\frac{\partial L(y_i, F(x_i))}{\partial
    F(x_i)}\right|_{{F(x) = F\{m-1\}(x)}} ]


    +   4. Fit a base learner (h_m(x)) to the residuals (r_i^({m})): [ h_m(x) = \arg\min\_\{h\}
    \sum\_{i=1}^N \left(r_i^({m}) - h(x_i)\right)^2 ]


    +   5. Update the model: [ F_m(x) = F_{m-1}(x) + \nu h_m(x) ] where (\nu) is the
    learning rate.'
  merge: -1
  img_proc: true
