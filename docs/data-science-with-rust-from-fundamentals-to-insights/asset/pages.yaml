    \ csv = \"1.1\" serde = { version = \"1.0\", features = [\"derive\"] } ```\n```\n\
    \nThe `serde` crate is also included to facilitate the serialization and deserialization\
    \ of data, making it easier to convert between CSV records and Rust structs.\n\
