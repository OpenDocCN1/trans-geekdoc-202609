  md: '# Methods of Hyperparameter Tuning


    There are several methods to tune hyperparameters, each with its strengths and
    weaknesses. The most common methods are:


    +   1. **Grid Search**: Exhaustively searches through a specified subset of hyperparameters.

    +   2. **Random Search**: Randomly samples hyperparameters from a defined range.

    +   3. **Bayesian Optimization**: Uses probabilistic models to select the most
    promising hyperparameters.

    +   4. **Gradient-Based Optimization**: Utilizes gradient information to optimize
    hyperparameters.


