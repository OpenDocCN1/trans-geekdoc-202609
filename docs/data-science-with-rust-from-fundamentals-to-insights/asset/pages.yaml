    # # Understanding Causation


    Causation implies that one event is the result of the occurrence of the other
    event; i.e., there is a cause-and-effect relationship between the variables. However,
    just because two variables are correlated does not mean one causes the other.
    Establishing causation requires rigorous experimentation and controls to rule
    out other factors.


