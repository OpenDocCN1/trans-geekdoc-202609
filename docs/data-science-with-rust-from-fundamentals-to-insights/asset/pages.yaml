  md: '# # CHAPTER 6: ADVANCED MACHINE LEARNING TECHNIQUES


    Ensemble methods operate on the principle that a group of weak learners can come
    together to form a strong learner. The primary types of ensemble methods are Bagging
    (Bootstrap Aggregating) and Boosting, each with distinct strategies for combining
    models.


    # ## Bagging


    Bagging aims to reduce variance by training multiple models on different subsets
    of the training data and averaging their predictions. This is particularly effective
    for models with high variance, such as decision trees.


