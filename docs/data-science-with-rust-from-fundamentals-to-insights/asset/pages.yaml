    # 2. K-Fold Cross-Validation


    K-Fold Cross-Validation is a more robust method as it reduces the variance of
    the model performance by averaging over multiple training and testing splits.
    The process involves dividing the dataset into K equal-sized folds. The model
    is trained on K-1 folds and tested on the remaining fold. This process is repeated
    K times, with each fold serving as the test set once.


    # **Example:**


    For a dataset with fish species characteristics, setting K=5 will create five
    subsets. Each subset will be used as a test set once, and the model''s performance
    will be averaged over all five runs.


