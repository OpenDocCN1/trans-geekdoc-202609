    # Understanding Bayesian Statistics


    At its core, Bayesian statistics revolves around Bayes'' Theorem, a simple yet
    profound equation that describes how to update the probability of a hypothesis
    based on new evidence. The theorem is stated as:


    ```

    [ P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)} ]

    ```


    Where: - ( P(H|E) ) is the posterior probability, the probability of the hypothesis
    ( H ) given the evidence ( E ). - ( P(E|H) ) is the likelihood, the probability
    of the evidence given that the hypothesis is true. - ( P(H) ) is the prior probability,
    the initial probability of the hypothesis before seeing the evidence. - ( P(E)
    ) is the marginal'
