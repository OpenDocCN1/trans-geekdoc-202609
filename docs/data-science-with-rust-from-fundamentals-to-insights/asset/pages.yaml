    # 5. Clustering: K-means and Hierarchical


    # Introduction to Clustering


    Clustering is one of the most fundamental tasks in unsupervised learning, where
    the objective is to group a set of objects in such a way that objects in the same
    group (or cluster) are more similar to each other than to those in other groups.
    Imagine walking through Stanley Park in Vancouver, where different species of
    trees form natural clusters based on their characteristics. Similarly, clustering
    algorithms help us identify natural groupings within data, revealing underlying
    patterns and structures.


    Two of the most widely used clustering techniques are K-means clustering and hierarchical
    clustering. Each has its unique strengths'
  merge: -1
  img_proc: true
