  md: "# # Key Probability Concepts\n\n# ## Random Variables\n\nA random variable\
    \ is a variable whose possible values are numerical outcomes of a random phenomenon.\
    \ There are two types of random variables:\n\n+   1. **Discrete Random Variables**:\
    \ Take on a countable number of distinct values. Example: Number of heads in 10\
    \ coin flips.\n+   2. **Continuous Random Variables**: Take on an infinite number\
    \ of possible values. Example: The exact time it takes for a computer to process\
    \ a task.\n\nIn Rust, we can generate and manipulate random variables using the\
    \ rand_distr crate for more complex distributions.\n\n```\n```rust\nuse rand_distr::{Normal,\
    \ Distribution};\n\nfn main() {\n    let normal = Normal::new(0.0, 1.0).unwrap();\n\
    \    let v: f64 = normal.sample(&mut rand::thread_rng());\n    println!(\"Generated\
    \ random variable: {}\", v);\n}\n```\n```\n\n# ## Probability Distributions\n\n\
    A probability distribution describes how the probabilities are distributed over\
    \ the values of the random variable. Common distributions include:\n\n+   1. **Binomial\
    \ Distribution**: Models the number of successes in a fixed number of independent\
    \ Bernoulli trials. Example: Number of heads in 10 coin flips."
  merge: -1
