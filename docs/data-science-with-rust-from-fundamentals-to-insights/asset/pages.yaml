  md: 'and is suited for different types of data and analysis objectives. K-means
    is efficient and scalable, making it suitable for large datasets. In contrast,
    hierarchical clustering provides a more nuanced view of the data''s structure,
    often revealing nested clusters within the data.


    # K-means Clustering


    K-means clustering is an iterative algorithm that partitions a dataset into K
    distinct, non-overlapping subsets (clusters) by minimizing the variance within
    each cluster. It''s akin to organizing a bustling Granville Island Market into
    distinct sections, where each section represents a cluster of similar items.


    # Step-by-Step Guide to K-means Clustering


    +   1. **Initialization**: Select K initial centroids randomly from the dataset.

    +   2. **Assignment**: Assign each data point to the nearest centroid, forming
    K clusters.

    +   3. **Update**: Calculate the new centroids by taking the average of all data
    points assigned to each cluster.

    +   4. **Repeat**: Repeat the assignment and update steps until the centroids
    no longer change or a maximum number of iterations is reached.


    # Mathematical Formulation


    Given a dataset (\mathbf{X} = {x_1, x_2, \dots, x_n}) and the number of clusters
    (K):


    +   1. **Initialization**: Select (K) initial centroids (\mu_1, \mu_2, \dots,
    \mu_K).'
