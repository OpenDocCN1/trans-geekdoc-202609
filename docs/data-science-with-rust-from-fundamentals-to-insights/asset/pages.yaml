    \ } else { -rank })\n        .sum();\n\n    signed_ranks.abs()\n}\n```\n\n```\n\
    fn rank(differences: &[f64]) -> Vec<f64> {\n    let mut ranked: Vec<(f64, usize)>\
    \ = differences.iter().enumerate()\n        .map(|(idx, &diff)| (diff, idx))\n\
    \        .collect();\n\n    ranked.sort_by(|a, b| a.0.partial_cmp(&b.0).unwrap());\n\
    \n    let mut ranks = vec![0.0; differences.len()];\n    let mut rank = 1.0;\n\
    \    for i in 0..ranked.len() {\n        ranks[ranked[i].1] = rank;\n        rank\
    \ += 1.0;\n    }\n\n    ranks\n}\n```\n\n...\n\n# **Explanation**:\n\n+   - `wilcoxon_signed_rank_test`\
    \ calculates the Wilcoxon signed-rank statistic."
