- pgno: 119
  md: '# CHAPTER 3: DATA EXPLORATION AND VISUALIZATION


    Descriptive statistics involve measures that succinctly capture the key properties
    of a dataset. These measures are typically divided into three categories: central
    tendency, variability, and shape of the data distribution. Central tendency includes
    metrics like the mean, median, and mode, which describe the center of the data.
    Variability (or dispersion) includes metrics like range, variance, and standard
    deviation, which describe the spread of the data. The shape of the data distribution
    is often captured through skewness and kurtosis.


    # Setting Up for Descriptive Statistics in Rust


    To begin, ensure that Rust and the polars library are set up in your development
    environment. Add polars to your Cargo.toml file:


    ```

    ```toml [dependencies] polars = "0.22" ```

    ```


    Run cargo build to fetch and compile the dependency.'
  merge: -1
  img_proc: true
