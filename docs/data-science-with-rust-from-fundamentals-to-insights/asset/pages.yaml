    +   2. **NoSQL Databases:**

    +   - Designed to handle unstructured data.

    +   - Examples include MongoDB, Cassandra, and Redis.


    +   3. **Data Warehouses:**

    +   - Optimized for analytical queries and reporting.

    +   - Examples include Amazon Redshift, Google BigQuery, and Snowflake.


    +   4. **Data Lakes:**

