    Three main criteria were identified for the analytical hierarchy to evaluate the
    concept (based on [10]), technical, organizational and economic criteria. The
    weights of the criteria were determined by literature review and external experience
    from the semiconductor fab in Dresden. Overall, the economic criteria are considered
    most important (54%), followed by technical (34%). Organizational criteria are
    considered important for this decision (12%) because an organization in need can
    quickly adapt to changes. The blockchain was compared with the current solutions
    in the case,, where different software tools are used for databases. Nevertheless,
    the blockchain is not predominant regarding technical criteria but outperforms
    on data quality, completeness, and fault tolerance. Nevertheless, the other criteria
    were determined by the authors. Transparency, security, customizability, standardization
    of data, strategic fit, and knowledge gains were provided by the experts. The
    full survey details, the AHP structure and results are provided in the Appendix,
    which is accessible at [24] due to limited space.


