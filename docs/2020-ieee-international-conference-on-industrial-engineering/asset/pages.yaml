    The results can be used to answer the following questions: The design process
    of the blockchain solution indicated that blockchain could also be suitable for
    supply chain applications in semiconductor manufacturing. In many cases, there
    are international interests in production segments as well as lack of transparency
    and control. Here, blockchain can offer an opportunity to move from centralized
    systems to a simple form of data transaction. The irreversibility is an essential
    feature. Besides, in reimbursement cryptocurrencies can be used for efficient
    payment processing. The choice of network type is not important. Important criteria
    for the customers are currently only obtainable in a private smart network


