  md: '# Development and Evaluation of a Blockchain Concept for Production Planning
    and Control in the Semiconductor Industry


    L. Herbst¹, J. Lohmer², G. Schneider², R. Lasch²

    ¹Infineon Technologies Dresden GmbH & Co. KG. Dresden, Germany

    ²Chair of Business Management, logistics, Technische Universität Dresden, Germany

    jacob.lohmer@tu-dresden.de


    Abstract — Blockchain technology provides several benefits for operations management,
    but most reported concepts and applications are rare. This contribution indicates
    the findings from a case study analyzing the suitability of blockchain technology
    for manufacturing at the 300 m wafer frontline of the industry. Here, several
    different integrated digital solutions were used to access centralized databases
    with different views and restrictions. We assess if and how a blockchain solution
    could be designed to enhance the analytics capabilities for manufacturing using
    the design science approach and evaluate the economic value of the designed application
    through the analytical hierarchy.


    related to the manufacturing process in a wafer fab (including volatile, high
    product mixes and complex process flows, and limited capacity of expensive equipment).
    To analyze the suitability of blockchain for semiconductor manufacturing, we conduct
    a case study of the 300 m wafer fab of Infineon Technologies in Dresden, Germany.
    Different digital tools have been implemented in the various departments over
    the past years, all of which access centralized databases with different views
    and restrictions. We explore the idea of applying blockchain as decentralized
    decentralized in semiconductor production using the design science approach of
    Heverner et al. [9] and evaluate the economic value of the designed application
    through the analytical hierarchy.


    **Keywords** Blockchain technology, semiconductor manufacturing, case study


    # I. INTRODUCTION


    Operations management (OM) may use several technologies in the industry of Industry
    4.0 [1]. One of the technologies with the potential for a substantial disruption
    in OM, manufacturing, and supply chain management (SCM) is blockchain technology,
    which is based on decentralization, transparency, and visibility [2–4]. Blockchain
    can be perceived as a trustless system since no entity has control over any specific
    component. The technology verifies confidence in the network with immutable transaction
    records and decentralized governance [2]; After first case in the industry de
    consider using blockchain in SCM, the area of OM and manufacturing has not been
    considered in-depth to date [5]. Although the prospective potentials are recognized
    throughout the industry, there are few publications or reports on this successful
    application of the technology [6].


    Especially manufacturing companies need to realign their strategic objectives
    and goals in the current investment revolution. It is essential to go beyond the
    hype surrounding technologies and identify the real potential in the context of
    Industry 4.0. In this contribution, we focus on one of the most complex and integrated
    domains: semiconductor manufacturing. To follow the More-than-Moore approach,
    semiconductor manufacturers invest heavily in automation and as well as productivity
    improvements and are at the forefront of virtual production control using sensors
    and IoT technologies [7]. However, there are several issues


    this contribution answers two questions regarding the application of blockchain
    technology for operations management, especially in the semiconductor industry
    and considering the specific case of the case:


    > RQ1: How could blockchain manufacturing profit from new technologies for the
    storage, analysis and visualization of production data? Would a blockchain solution
    be suitable?


    > RQ2: How should a blockchain application be structured for a suitable case in
    semiconductor manufacturing and how will it perform compared to the existing technology?


    The remainder of this contribution is structured as follows. In Section 2, we
    present the research methodology, followed by a collection of the results in this
    case in Section 3. Findings are presented and discussed in Section 4 and a conclusion
    will be drawn in Section 5.


    # II. METHODOLOGY


    To analyze whether blockchain technology could be a solution for the semiconductor
    industry, we conducted a case study of the 300 m wafer fab of Infineon in Dresden,
    Germany. The design science research (DSR) by Heverner et al. [9] was adopted
    for the case study. This method, which originates from information systems research,
    aims to increase the efficiency of the organization in the center of the research'
