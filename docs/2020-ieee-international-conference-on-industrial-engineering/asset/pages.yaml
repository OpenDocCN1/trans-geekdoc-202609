    Recent reviews identified countless numbers of scientific papers on blockchain
    in SCM and OM [4, 6]. Recent focus on successful proofs-of-concept or applications
    that are produced of OM in the industry landscape. Security, intellectual property
    concerns or standardization, and interoperability are major barriers for adoption
    [14]. Some authors have contributed with a technical perspective on manufacturing
    applications [15, 16], while others highlighted the benefits of blockchain with
    tracking and solutions for worthy products to ensure the declared prevalence [17].
    IBM and Maersk developed solutions for globalizing trade activities in a platform
    called TradeLens [18] that OM is one of the most promising areas for blockchain
    adoption by industry [19]. Supplier contract management, digital threat mitigation,
    as production and maintenance are some opportunities that would like to appear
    in future applications.


    Once the general flow is determined, the next decision involves the type of the
    network. Due to confidential data, a public blockchain is not suitable. For example,
    only supply chain partners are allowed and exchanging data within the blockchain
    at the moment, for a private blockchain. This could be adapted to private blockchain
    as more partners are added to the network in future operations.


    An open-source framework was chosen for this application. The Hyperledger project
    coordinated by the Linux Foundation has members who have joined the project community
    and the blockchain framework to optimize the solutions in the service and manufacturing
    industry. A very active community provides development support documentation,
    tutorials and as assistance of industry standards. Hyperledger Fabric was chosen
    for the used case because of its suitability for application in the industry [22].


    Several authors favor of implementation challenges and effective measures for
    implementation case studies [21]. Additionally, blockchain should be considered
    the technologies for the digital transformation of OM, SCM, and manufacturing,
    always keeping in the economic value of the technology.


    Hyperledger Fabric consists of the blockchain and a so-called world state. The
    blockchain irreversibly tracks the transactions that change the status of the
    data set and provides the current status of the system, but with no transaction
    history, making the process of calculating the data status after a new transaction
    more efficient. The smart contract - the program written for blockchain - can
    be directly executed without having the history stored in the blockchain. The
    world state will change after each transaction and is irreversible. The unique
    token is used as the key for the set and value all relevant data (e.g., date,
    price, product type, cycle time).


