  md: '# III. RESULTS


    By analyzing the manufacturing processes and supporting IT systems in our case
    study, three issues were identified: high product mix, complex process flows,
    and customer orders competing for limited capacities. These three issues created
    fragile flows, period of overload and even severe fluctuation in the individual
    process flows and a significant amount of insecurity in production, staff, and
    maintenance planning. The fluctuation resulted in increased maintenance utilization.
    Assembly based on real-time data from upstream processing steps of the lots would
    allow for better scheduling of downstream assembly in the focus of this case study.
    The pre-assembly area of the 300 mm is highly dependent on the upstream areas
    and usually receives information on incoming WIP at very short notice, if all
    data security


    is an important issue since some of the lots are exchanged between different factories
    in the supply chain and the data must be transferred consistently for this. Furthermore,
    as different segments in the production pursue their own KPIs and with a strong
    interest, values in the databases can change frequently and lead to inconsistent
    scheduling. Therefore, the different production divisions can be considered as
    independent to a certain extent sharing an even critical issue.


    All analytical systems are available to the planners and engineers to cope with
    this situation and prepare for future overload or scenarios. However, all of these
    systems (e.g., process flow visualization, reporting KPIs) can access a centralized
    database, which contains current status of production data and therefore serves
    the purpose of overall equipment effectiveness management (OEE). Current analysis
    tools are only on a static basis and provide all the data in real-time. For the
    semiconductor industry management (OCM) approach is more fitting than OEE. OCM
    takes into account dynamic information and data to also consider variables in
    the production process. An important step implementing this OCM is to provide
    high availability with optimal reliability. A new storage and data collection
    technology to accomplish this goal will benefit the data exchange and for strategic
    tactics,


    B. Knowledge base – blockchain technology

    Blockchain was identified as possible technology to help achieve this goal. The
    blockchain is a distributed ledger that is stored decentrally as a geographical
    record of data in blocks. The communication occurs across geographically distributed
    nodes through cryptography network, making the immutable ledger between all participants
    in the network. Organizations of all kinds can communicate and exchange data with
    others without needing to trust them or use an intermediary. For a detailed technical
    description, we would like to refer to the readers to current and systematic literature
    reviews on blockchain technology, e.g., [4], [11], [12]. Blockchain technology
    can be used in diverse applications, such as public records and consumer configuration.
    Furthermore, the security of contracts is probably the most important aspect for
    OM and SCM. A smart contract represents a computerized agreement that can be automated
    once a set of terms, of the contract, are met. Apart from the automation itself
    and to increase efficiency by using smart contracts, other properties of blockchain
    applications include immutability, transparency, and transparency which can be
    highlighted [11]. Through these technical features, blockchain as a decentralized
    data storage technique can provide a higher level of reliability, transparency,
    flexibility, irreversibility,


