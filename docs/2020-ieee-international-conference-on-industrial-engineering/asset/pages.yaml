  md: '# V. CONCLUSION


    Blockchain technology provides great potential for the manufacturing industry
    and, as indicated in this contribution, especially the semiconductor industry.
    Blockchain enables a guaranteed level of security, transparency and immortality
    that no centralized data storage can provide at this time. For the criteria examined,
    blockchain outperforms traditional solutions and delivers promising results, especially
    in critical areas. However, the knowledge acquired through blockchain in the industry
    suggests that more complex cases can be used. This may include including pay-per-use
    functionalities when outsourcing to semiconductor manufacturing to simplify financial
    controlling. Our future outlook consists of the integration of more production
    facilities and businesses into the network, as blockchain is particularly useful
    when data is exchanged between multiple parties.


