  \ 27001` | |\n| **管理与保护** | | | |\n| 资产管理 | ✓ | ✓ | 12.1 |\n| 信息安全策略 | ✓ | ✓ | 12.2\
  \ |\n| 物理与环境安全 | ✓ | ✓ | 12.3 |\n| 身份与访问控制 | ✓ | ✓ | 12.4 |\n| 恶意软件防护 | ✓ | ✓ |\
  \ 12.5 |\n| 配置与补丁管理 | ✓ | ✓ | 12.6 |\n| 加密 | ✓ | ✓ | 12.7 |\n| 系统安全 | ✓ | ✓ | 12.8\
  \ |\n| 网络与通信安全 | ✓ | ✓ | 12.9 |\n| 安全能力与培训 | ✓ | ✓ | 12.10 |\n| 员工意识培训 | ✓ | ✓ |\
  \ 12.11 |\n| 环境风险管理计划 | ✓ | ✓ | 12.12 |\n| 供应链风险管理 | ✓ | ✓ | 12.13 |\n| **识别与检测**\
