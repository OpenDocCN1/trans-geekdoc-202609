  | 治理结构与流程 | | |\n| 内部审计 | | |\n| 外部认证/验证 | **✓** | 15.6 |\n\n有关如何获得 Cyber Essentials/Cyber\
  \ Essentials Plus 认证的更多信息，请参阅：[`www.itgovernance.co.uk/cyber-essentials-scheme`](https://www.itgovernance.co.uk/cyber-essentials-scheme)。\n\
  \nICO，“国际航空公司因未能保护其客户个人数据被罚 500,000 英镑”，2020 年 3 月，[`ico.org.uk/about-the-ico/news-and-events/news-and-blogs/2020/03/international-airline-fined-500-000-for-failing-to-secure-its-customers-personal-data`](https://ico.org.uk/about-the-ico/news-and-events/news-and-blogs/2020/03/international-airline-fined-500-000-for-failing-to-secure-its-customers-personal-data)。\n\
  \n## 第 28 章：基线\n\n如果 Cyber Essentials 的程度不够，或者你正在寻找在英国以外认可的标准，那么你的下一个目标几乎肯定将是 NIST\
  \ CSF（见 28.1）或 ISO 27001（见 28.2）。\n\n### 28.1 NIST CSF\n\nNIST CSF 提供了一个简单直接且灵活的框架。NIST\
  \ CSF 有三个主要部分：`core`（核心）、`profiles`（描述）和 `implementation tiers`（实施层）。\n\n`core`\
  \ 包含了组织的网络安全活动，分为五个功能：\n\n1. **识别** 风险。\n2. **保护** 免受这些风险的影响。\n3. **检测** 任何异常。\n\
  4. **响应** 任何异常。\n5. **恢复** 从中恢复。\n\n每个功能随后被划分为 `categories`（类别），描述一般的活动。相应，类别又被划分为\
  \ `subcategories`（子类别），描述类别的具体结果。最后，每个子类别都对齐 `informative references`（信息参考）——源自一系列出版物（包括某些标准）的最佳实践来源。\n\
  \nNIST CSF 的下一个主要部分是 `profiles`，它是识别组织为了实现安全需要采取哪些行动的。`current profile`（当前描述）说明目前如何处理网络安全，而\
  \ `target profile`（目标描述）描述了组织的愿景。与我们的成熟度等级（见第 16 章一样，较高的等级并不意味着更好——它们只是描述了流程的复杂程度。\n\
  \nNIST CSF 的第三也是最后一个组件是四个 `implementation tiers`（`partial` 部分的、`risk-informed` 风险性的、`repeatable`\
  \ 可重复的和 `adaptive` 自适应的），它们描述了组织风险管理和其他安全措施的严谨性。\n\n### 28.2 ISO 27001\n\n国际标准 ISO/IEC\
  \ 27001 规范了最佳实践信息安全管理体系（ISMS）——跨组织管理信息风险的系统方法。\n\nISO 27001 描述了 114 项参考信息安全控制（分为\
  \ 14 个类别），你可以应用这些措施来改进你的信息安全。这 14 个类别为：\n\n1. A.5 信息安全策略\n2. A.6 信息安全组织\n3. A.7\
  \ 人力资源安全\n4. A.8 资产管理\n5. A.9 访问控制\n6. A.10 加密\n7. A.11 物理与环境安全\n8. A.12 操作安全\n\
  9. A.13 通信安全\n10. A.14 系统获取、开发与维护\n11. A.15 供应商关系\n12. A.16 信息安全事件管理\n13. A.17 业务连续性管理中的信息安全\n\
  14. A.18 合规性\n\n其理念是根据符合本标准某些要求的风险评估，仅适用于与其相关的控制措施。\n\n组织可以根据 ISO 27001 的要求寻求独立认证，以向客户和合作伙伴证明他们采用了公认的最佳实践处理信息安全。然而，还有一个更大的\
  \ ISO/IEC 27000 系列标准，其中 ISO/IEC 27002 是最值得关注的。\n\n\n\n\n\n当 `ISO 27001` 规定了有效信息安全管理体系（ISMS）的特征时，`ISO\
  \ 27002` 则提供了行为准则——即可用于执行规范的推荐最佳实践，为选择控制措施和实施有效的 ISMS 提供指导。从本质上说，`ISO 27002` 的设计是为了协助有效实施\
  \ `ISO 27001`。\n\n然而，`ISO 27000` 家族中还有其他标准可以提供帮助。例如，`ISO/IEC 27005` 提供了与 `ISO 27001`\
  \ 一致的信息安全风险管理指导，旨在帮助组织采取基于风险的方法处理信息安全。\n\n同时，`ISO 27017` 为提供或使用云服务时的信息安全控制提供了一套实践准则（在\
  \ 29.2 中进一步讨论），`ISO 27035` 提供了信息安全事件管理的指导（参见 29.3），而 `ISO 27036` 则提供了供应链安全的指南（参见\
  \ 29.4）。这些标准对于寻求实现更成熟安全水平的组织可能特别有益。\n\n由于 `ISO 27001` 使用与其他管理体系标准相同的 set 格式，因此它也可以与现有的管理体系（如\
  \ `ISO 9001` 质量管理体系或“QMS”）相结合，以创建一个集成管理体系。这允许您简化内部审计等共同活动，从长期来看可以节省成本。\n\n### 28.3\
  \ CRF 对齐\n\n下表显示了我们的 `CRF`、`NIST CSF` 和 `ISO 27001` 如何对齐：\n\n**表 8：NIST CSF、ISO\
