  \ | 12.4 |\n| 恶意软件防护 | **✓** | 12.5 |\n| 配置与补丁管理 | **✓** | 12.6 |\n| 加密 | | |\n\
  | 系统安全 | **✓** | 12.8 |\n| 网络与通信安全 | **✓** | 12.9 |\n| 安全能力与培训 | | |\n| 员工意识培训 |\
