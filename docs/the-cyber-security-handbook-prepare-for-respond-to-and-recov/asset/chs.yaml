  \ 179 段。\n\n## 第十三章：识别与检测\n\n开发一套系统，通过自动化、持续的安全监控结合人工跟进，识别可能意味着事件的异常。\n\n有效的安全是管理你的风险，监控风险以确保其在接受范围内，并在必要时采取适当行动。重要的是，它并不是消除所有风险并实现绝对安全，因为这种方法所需的权衡（例如不在线）实在太大了。然而，可接受的风险仍然是风险。\n\
  \n这就是为什么你必须采取深度防御的方法（在 12.12.8 中有更详细的讨论），并考虑让你不仅具有网络安全性、而且具有网络韧性的措施。韧性的一部分意味着，当预防措施失效时你做好了准备，因为你将它们与检测和响应事件的措施相结合了。换句话说，当预防失效时，检测是有效的（如果不进行跟进，检测将大用处——有关响应请见第十四章）。\n\
  \n\n\n\n\n例如，如果你投资了一个防火保险箱，无论如何，保险箱内的物品实际上并不能免受火灾的保护。相反，保险箱能够抵御火灾取决于其耐火等级——等级越高，保险箱内的物品被燃烧的时间就越长（但保险箱也越贵）。[79]\n\
  \n泛而言之，对于保险箱的情况，预防措施可能只需要抵御攻击直到响应人员到达。在进行风险评估并决定如何处理不可接受的风险时，这是一个需要考虑的重要点（另参见 [12]）——这不仅取决于你的资产可能受到什么影响，还取决于它们需要多久才能抵御威胁。12.7。为了知道何时采取行动并减少响应时间，检测措施起着关键作用。\n\
  \n检测措施的工作时间各异。并非所有措施都适用于事件或攻击，但在有效的情况下，它们将提供一种价值且通常具有成本效益的防御层。检测措施大致分为三类：\n\n###\
  \ 1. 事前检测（预防）：\n\n事前检测涉及根据关于你环境的信息、行业信息或从合作伙伴和机构获取的情报采取适当的预防措施，以防止攻击或事件发生。实际上，这是一种基于风险的方法，允许更有效地利用资源。然而，要意识到风险会随时间变化——这不仅是因为不断演变的威胁格局，还因为信息的价值取决于具体情况。例如，关于即将发生的合并或新产品的信息在进入领域之前价值巨大。因此，定期进行或审查你的事前检测活动以确保其有效性很重要。\n\
  \n具体的活动包括漏洞扫描（参见 13.1.2）和渗透测试（参见 13.1.3），可以在漏洞被恶意利用之前识别它们。\n\n### 2. 实时检测：\n\n当你无法完全阻止攻击时，你希望在遭受攻击（无论是恶意的还是其他的）实时。这可能是警报响起、安保人员发现入侵者、自动生成的通知（未知\
  \ IP 地址向你的服务器上传了文件等）。\n\n对于网络安全，依靠人工对输入的所有数据进行主动监控（和分析）是不可能的，即使不考虑人为疏忽，数据量也太大了且产生得太快。相反，你需要依赖自动化工具，如入侵检测系统\
  \ (`IDS`) 和安全信息和事件管理 (`SIEM`) 来持续监控并解释数据，并依靠人工确认任何警报是否真的是由攻击触发，并在必要采取适当行动。\n\n对于物理安全，人工实时检测（尝试）事件的机会比网络安全大——例如，安保人员监控\
  \ CCTV 画面。然而，他们在任何给定时间内接收和处理的数据量仍有很大限制——例如，一个人无法关注多个屏幕（这就是为什么 CCTV 的价值在于其建立存档的能力，这可以在事件响应过程中提供关键证据，详细讨论请参见\
  \ 14.1.3）。\n\n### 3. 事后检测：\n\n不幸的是，大多数事件是在发生后才发现的。在很多情况下，可能是几个月甚至几年后——在 2019 年，平均需要\
  \ 206 天才能识别突破（还需要 73 天来控制）。[80] 然而，尽管你尽了全力，攻击者还是攻破了你的安全，你仍然希望知道这件事，越早越好，以便你可以限制损失。如果未经授权的人员刚刚从意外区域登录并触发了\
  \ IT 的自动警报，他们可能还没有机会窃取机密数据提升权限。尽管如此，他们设法进入的事实构成了安全漏洞。\n\n尽管这种类型的检测发生在事件之后，但它需要仔细规划才能在需要时生效。你将传感器放在哪里？当警报被触发时，工作时间内谁会被通知？工作时间之外怎么办？你如何保证指定的人员能够及时查看情况？这些都是你的风险评估应该回答的问题（参见\
  \ 12.12）。\n\n### 13.1 威胁和漏洞情报\n\n从可能与组织相关的源中接收有关威胁、漏洞和安全措施的情报，以跟上不断变化的网络格局，并特别为事前和事后检测活动提供信息。\n\
  \n**关键输出：**跟踪相关的威胁快报并将其作为检测活动的输入，以及开展定期的漏洞扫描和渗透测试计划。\n\n战场上的指挥官需要在做出良好决策之前知道发生了什么。为此，他们需要情报。同样的原理也适用于网络安全：威胁和漏洞情报是选择安全措施的关键因素——毕竟，在有效防御它们之前，你需要知道你的威胁是什么，特别是在资源有限的情况下。\n\
  \n此外，战场可能会发生快速变化，指挥官必须意识到这一点——再次，这需要情报——并相应进行调整。在网络安全中，由于威胁格局不断变化，情况也是：你需要跟上最新的情报，并根据接收的信息调整防御。这可能意味着添加或更改你的预防措施，但也可能涉及调整检测工具的配置，或从不同的角度查看日志以检查遗漏的异常。自然地，最好是从源头上阻止事件的发生，但如果还是发生了，迟迟知情总比完全不知道好。\n\
  \n为了及时了解最新的威胁和漏洞以及最新的安全技术和解决方案，你可以采取诸如下措施，例如订阅每周威胁快报，如英国 NCSC 的每周威胁报告[81]、美国网络安全和基础设施局\
  \ (`CISA`) 的每周快报[82] 以及安全公司提供的定期快报。定期检查带有专门安全板块的新闻网站也有帮助，正如关注常见漏洞与披露 (`CVE®`) 数据库[83]（最简单的方法是通过如\
  \ NIST 国家漏洞数据库 (`NVD`)[84] 等馈送进行）。\n\n\n\n\n虽然频率较低，但定期进行漏洞扫描和渗透测试也是明智之举。这将让你有机会利用来自其他机构的情报——他们拥有如何检查最新威胁和漏洞的专家知识——而无需自己在内部内化这些信息。实际上，这为你提供了另一双经验丰富的眼睛，来发现你可能忽略的任何问题，并检查你已经采取的行动是否正确执行。此外，你可能获得的任何指导都将具体说明漏洞是什么、位于何处以及如何处理。\n\
  \n### 13.1.1 有效利用威胁快报\n\n当然，仅仅每周在收件箱中接收新威胁的通知本身并没有用。详细查阅所有快报也是如此，因为这是一种非常耗费精力的方法，且容易遗漏。\n\
  \n有效的网络安全需要对你可能面临的威胁有所了解。这不仅意味着关注最新威胁，还意味着如何识别可能与你相关的威胁。这要求对你的系统和风险评估有深入的了解——换句话说，要清楚你的网络中有什么，你的组织如何依赖这些系统，以及根据其固有脆弱性，你的系统成为目标的概率有多大，它们或其持有的信息价值多少。\n\
  \n了解这些情况将帮助你决定监控哪些信息源，以及如何有效地过滤它们。例如，如果你的员工严重依赖手机，你就需要留意新类型的短信诈骗（smishing）和语音诈骗（vishing）；如果你知道黑客行动主义（hacktivists）可能会针对你，你就需要了解他们最新已知活动的细节。\n\
  \n一旦你对通知过滤出（可能的）相关项目，使用这些情报有两种关键方式：\n\n**1. 自动化检测工具：**\n\n根据信息源的信息更改工具的配置或设置，以便你的工具未来能够识别新的异常情况。\n\
  \n**2. 日志：**\n\n如果你知道如何识别尝试利用你从信息源中学到的特定漏洞的活动或行为，你可以手动检查警发送之前的日志以查找这些迹象。你可能还可以使用自动化工具运行新的扫描或搜索，以追溯过滤日志中的新类型异常，从而使手动跟进变得更容易。尝试主动识别已进入系统的攻击者被称为“威胁狩猎”（threat\
  \ hunting）。\n\n使用自动化工具和日志进行常规安全监控活动在 13.2 中进行了讨论。\n\n### 13.1.2 漏洞扫描\n\n漏洞扫描工具通常与如\
  \ `CVE` 等漏洞数据库相关，可以检查漏掉的补丁、未经授权的项目、配置错误和其他可能的漏洞。在运行自动扫描之前，确保你已将工具和数据库更新到最新版本，以确保将使用最新的已知漏洞签名。当扫描器识别出任何弱点时，它通常会根据例如漏洞评分系统（`CVSS`）对漏洞分配风险评分，你可以利用它来确定更新和修复的优先级。由于许多工具与漏洞数据库相关，你通常还会获得或被引导至如何缓解所识别的弱点的指导。然而，请注意，自动化工具只能返回基准分——它没有考虑你的环境，而环境是决定漏洞真实严重性的一个重要因素。（另一方面，熟练的渗透测试人员会考虑这一点。）\n\
  \n你应该定期运行扫描，其频率应让你认为补丁发布与扫描之间的窗口期是可以接受的，并符合任何合同和其他相关要求。请记住，如果你依赖广泛的供应商，此类窗口期会因软件而异，因为每个供应商倾向于有不同的补丁或更新周期。\n\
  \n你可能还想比较连续扫描的结果，以确保漏洞已正确缓解（某些工具会自动执行此操作）。评估漏洞数量和重要性随时间的变化可能也是值得的——理想情况下，你会观察到它们随着你设定的任何目标而减少。然而，增加并不自动意味着担心，因为它可能是组织扩张或网络开发新方法的征象。\n\
  \n### 13.1.3 渗透测试\n\n与漏洞扫描一样，渗透测试（也称为道德黑客攻击）是另一种前置检测的形式。在进行渗透测试时，你有一位合格的测试人员（现场或远程），他们会系统地探测你的应用程序、系统和网络，以识别任何漏洞，让你有机会漏洞被具有恶意意图的人利用之前对其进行修复。它还能让你专注于安全工作——特别是因为渗透测试报告应该具体说明你的漏洞是什么、位于何处，并提供缓解建议——而不是采用可能需要大量投入且无法保证你的特定漏洞已缓解的宽泛方法。\n\
  \n渗透测试可以发现的漏洞类型比自动化工具识别的要广泛得多。丰富的渗透测试人员会模拟犯罪分子使用的技术，同时确保不造成任何损害（可以在网络和应用程序使用率最低时进行测试，以尽量减少对日常运营的影响）。这包括使用自动化漏洞扫描工具——犯罪黑客也会使用这些工具——不仅用于识别如未打补丁软件等更明显的弱点，还用于识别单独看似乎无害但结合时非常危险的漏洞。这种类型的弱点是普通观察者不太可能发现的，但犯罪黑客会刻意寻找此类机会。\n\
  \n与自动化工具不同，渗透测试人员还会尝试利用识别出的弱点作为概念证明（而不会对你的系统造成任何实际伤害）。他们还可能根据可能泄露数据的敏感性，或者由于测试人员发现的另一个漏洞导致某个漏洞可以被更有效地利用，从而上调或降低标准风险评分（由对齐\
  \ `CVSS` 或类似评分系统的工具自动分配）。也可能的情况是，漏洞在实践中相当难以访问，这是依赖于数量有限指标的评分系统并不总能考虑进去的。\n\n与漏洞扫描一样，不要将渗透测试视为一次性活动，而是一个应该定期进行的活动。你可能还需要在事件发生后进行测试，以帮助识别事件发生的原因以及需要哪些补救措施，或者作为缓解建议已正确执行的确认。渗透测试也可以合同义务，例如当你需要遵守\
  \ `PCI DSS` 时。\n\n\n\n\nWeb 应用程序通常是公开访问的，为你的组织信息提供了另一种访问点。测试通常（但不仅限于）侧重于最常见的漏洞，例如开放\
  \ Web 应用程序安全项目 (OWASP) 的前 10 项安全风险，检查是否存在 SQL 注入或跨站脚本 (XSS) 漏洞、不安全的会话管理等，攻击者可以利用这些漏洞获取数据或内部系统的访问。\n\
  \n许多组织兼具这两种情况，它们都应该接受测试，但方法和结果会有所不同。对于网络测试，你还需要考虑是进行外部测试还是内部测试。每种测试对数据泄露发生提供了不同的视角：\n\
  \n### 1. 外部测试\n\n这些测试识别了攻击者可能从互联网视角访问你网络和系统的途径。\n\n### 2. 内部测试\n\n这些测试寻找从内部访问的方法，或者外部攻击者在成功进入你的网络立脚后提升权限的方法。它们还会检查可能被蓄意提取或意外泄露的信息。它们还可以评估网络分段和隔离的效果（另见\
  \ [12.9.2]）。\n\n你可能还需要考虑移动应用程序测试、无线（Wi-Fi）测试或构建审查（也称为构建和配置测试）。渗透测试可能还包括非技术性测试，例如社会工程和网络钓鱼。这有助于确认你员工意识培训的有效性（参见\
  \ [12.11]）——或者证明可能有必要进行定期培训或使用海报等视觉提醒。\n\n许多组织从外部网络测试开始，但最适合你的测试将取决于你的需求。为了帮助确定哪些方案最符合你组织的需求，可以问以下问题：\n\
  \n• 为什么要考虑渗透测试？例如，你是否正试图满足合同要求、是否设立了新办公室或发布了新应用程序，或者你最近是否遭遇了安全事件？\n• 你想测试什么？这将有助于确定测试的范围。\n\
  • 你的预算是多少？\n• 你期望从测试中获得什么？例如，你只是在寻找关于你的安全措施是稳健的保证，还是正试图确定最近的泄露是如何发生的以及你如何防止其再次发生？\n\
  \n此外，还要执行工作的公司——你的安全测试提供商需要能够证明自己是值得信赖的，例如它是 CREST 的认证成员。如果你是为了满足特定要求（如符合 PCI DSS）进行测试，请确保你选择的公司能够针对该特定目的进行测试。\n\
  \n### 13.2 安全监控\n\n组织的系统和网络会持续进行异常监控，通过自动化工具和人工输入的相结合，力争尽快检测到事件，并持续记录以便能够识别和调查事件。\n\
  \n**关键输出：** 战略性部署的传感器用于收集数据，由自动化工具进行实时分析，随后由人工干预。收集的数据被存储起来，以便在需要时可以作为后续调查的证据。\n\
  \n重申一下，当你受到攻击时，你希望立即（或至少尽快）获知。同样，如果有人成功进入了你的系统，你越早知道，就越能采取行动来限制造成的损害。\n\n为了获得快速发现攻击的机会，你需要通过生成访问日志和流量日志，以及安装监控摄像头（CCTV），持续监控并记录你的系统、网络和场所发生的一切事情。这样做将为你提供可以监控和分析的数据，以确定发生了什么情况，识别异常活动，并建立你以后可能需要的存档，以确定事件的准确性质，从而指导你的修复和恢复活动。\n\
  \n### 13.2.1 实时监控\n\n当你通过实时监控和分析数据以尝试快速识别异常时，你需要依赖自动化工具，例如 `SIEM` 或 `IDS`。人类无法进行此类数字监控，因为从根本上说，我们在时间内接收和处理的信息量是有限，但人们在这个过程中仍然起着至关重要的作用。\n\
  \n人员将负责根据你组织的需求选择工具。例如，工具必须实时分析的数据量和类型是主要因素。另一个你可能考虑的点是报告能力，如果你的网络安全投资主要由法律或法规要求驱动，那么这种功能将增加大量价值。\n\
  \n此外，人员需要配置你的工具，使其能够在识别异常的同时最大限度地减少误报并避免漏报，并考虑到过往的结果和收到的情报（参见 [13.1]）。毕竟，异常仅仅仅仅是被认为是不寻常的行为——但工具需要通过人类和/或通过机器学习来教它什么是“不寻常”。正如在\
  \ [12.4.7] 中讨论的，它可能是短时间内多次尝试登录失败，但也可能是如磁盘使用率突然增加或突然出现大量空闲磁盘空间（这可能是勒索软件的迹）。另一个例子，你可能还想编写规则，如果从不属于你\
  \ Web 开发人员的 IP 地址上传文件到 Web 服务器，则向你发出警报。\n\n同样重要的是要考虑季节性等复杂性——特别是在电子商务背景下，例如，在财年结束或网络星期一期间被认为是正常水平的活动与学校假期期间的情况是不同的。教工具识别这些峰值或下降可以减少误报数量。你还可能在促销活动期间看到流量峰值，这可能会引发难以预测和因此无法避免的误报。\n\
  \n除此之外，你的工具只负责向人类识别并标记异常——后者才需要判断到底发生了什么，以及它是一个事件、误报还是其他情况的指示，例如磁盘空间简单的耗尽（在这种情况下，你应该采取行动以避免服务不可用）。此外，仅仅知道你被攻破而如果没有后续工作将作用有限——即确定确切发生了什么、是如何发生的以及如何控制和修复局面。\n\
  \n最终，你希望得到一个“漏斗”：从大量与特定事件相关的收集数据，通过自动化工具过滤出异常，然后由人员对异常进行查看、分类并根据需要进行上报。\n\n\n\n\n\
  因为物理安全的监控范围通常更易于管理，人类通过观看实时 CCTV 画面，有更好的机会实时发现攻击者。尽管如此，不要仅仅依靠人工实时检测至关重要，正如本章引言中所讨论的，即使在物理环境中也存在显著的局限性。你可以依靠\
  \ AI 检测视频帧之间的移动并提醒相关人员，由他们进行调查；或者在事后你察觉到某次（可能的）事件时，简单地回顾相关片段——无论哪种方式，CCTV 的主要价值在于其在事件发生后的检测和证据收集能力。\n\
  \n### 13.2.2 部署传感器\n\n为了使你的侦测措施有效，有策略地决定部署传感器的位置以及部署数量至关重要。仅依赖防火墙外的传感器会导致无休止的警报，且没有任何具体信息——毕竟，它仅仅是告诉你你正受到攻击，这本不应该令人意外。更有用的信息在于这些攻击中是否有任何已经成功（或可能成功），并且能够尽可能快地获取这些信息，这需要在防火墙内部也部署传感器。\n\
  \n尽管如此，在防火墙外放置一个传感器仍然有价值，因为它可以让你了解当前的趋势。例如，假设你突然从 VPN 服务器收到许多来自通常不连接的 IP 地址的请求，与此同时，你收到来自\
  \ IT 解决方案供应商的警报，说他们在其 VPN 服务器中发现了一个漏洞。将这两者结合起来，你就可以采取具体行动，例如修补软件，或者决定在一段时间内不需要该服务器，并在补丁发布前将其关闭。\n\
  \n然而，外部威胁并不是你唯一需要关心的事宜——还存在内部威胁的危险（在第 8 章 中有更详细的讨论）。这可能是有人滥用授权用户的访问权限（用户本人或通过盗取其凭据），也可能是绕过你防火墙的外部攻击者（这创建了一个指向你边界外的隧道，让未经授权的用户直接访问你的内部网络）。这些危险导致了“零信任”架构概念，即你不信任任何人，包括已经处于你网络边界内的人（另见\
  \ 12.9.5）。强大的身份识别和认证解决方案（另见 12.4）对于缓解这种风险至关重要，内部传感器也是如此，以便你监控网络内部的活动。\n\n为了在监控内部网络的同时感知外部的趋势，有策略地部署传感器至关重要。你应该在尽可能靠近互联网进入建筑的地方放置一个传感器，并在你使用安全设备（如防火墙）保护网络免受不受欢迎流量的地方放置另一个。在内部放置另一个传感器，并绕过你的过滤器，可以告诉你是否任何攻击已经攻破了防御。为了应对内部威胁，在网络分段或安全区域内放置传感器也是明智之举（另见\
  \ 12.9.2）。\n\n请同时考虑你需要多少个传感器：如果传感器太少，会有漏掉攻击（或其他异常）的巨大风险；如果传感器太多，则存在被警报淹没的风险。\n\n\
  ### 13.2.3 数据存储\n\n保留日志是安全不可或缺的一部分。你的网络规模将是做出这一决策的重要因素。如果你的网络较小，保留日志较长时间的成本会较低。如果你有一个较大的网络，可能需要对数据更具选择性，将某些数据保留较长时间，而另一些则保留较短。\n\
  \n### 13.2.4 端用户检测\n\n当一个人能够在自动化工具捕获之前检测到安全事件时，他们可能是端用户而非安全专家。端用户可能会立即察觉到不对劲，例如他们看到浏览器中弹出一个警告消息（例如，IT\
  \ 部门可能知道来自 ATP 的警报）。\n\n延续这个例子，如果一名员工点击了通过电子邮件发送给他们的链接，收到了浏览器警告并立即关闭了页面，那么他们访问页面的行为被阻止了，因此没有发生事件。通过员工培训（见\
  \ 12.11），该员工应该知道他们必须将此事件告知 IT，即使仅仅是为了确认没有造成损害。IT 部门可能会发现有更多员工收到了相同的邮件，并发送一份全员通报，警告他们可能正成为攻击目标。\n\
  \n### 13.2.5 事件后检测\n\n\n\n当然，即使是有效的即时检测系统，拥有配置良好的自动化工具和警觉的终端用户，也不可能是完美的，这仅因为新威胁在不断涌现。根据汇入的数据和识别出的异常，你可能还需要调整或增加已设置的规则。此外，可能存在某些可疑活动迹象，自动化工具不太可能将其识别为异常，例如交易发送给了错误的公司，或者针对该公司的交易金额大于正常水平。\n\
  \n尽管如此，自动化显然是一件好事事：它过滤了数据，减少了接收个人无法以任何效率处理的海量数据的问题。通过更小规模、经过过滤的数据集和更多的时间（使其成为事后检测），人员将有更大的机会遍历所有内容并进行准确的解读。这还能为他们留出定位自动化工具可能遗漏内容的时间，无论是由于信息过时、规则失效还是仅仅是纯属运气。手动审查日志的人员可能还希望关注策略失效的迹象，例如内部用户访问了他们与其职责无关的信息，这些不一定仍然是安全事件，但如果不加处理，可能会变成安全事件。\n\
  \n在识别出异常的地方，你的日志（对于物理安全而言，还有你的监控录像）可以为你的事件响应过程提供宝贵的证据，帮助你确定入侵的起源和完整范围。这一证据收集和分析过程将在\
  \ 14.1.4 中进一步讨论。\n\n⁷⁹ 还要记住，适用于某种类型内容（例如纸质文档）的安全箱可能适用于其他类型（例如磁介质），无论防火等级如何。\n\n\
