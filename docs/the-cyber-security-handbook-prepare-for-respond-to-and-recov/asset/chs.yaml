  \n¹⁶ 赛门克, “网络安全威胁报告 (ISTR) 第 24 卷”, 2019 年 2 月, *[`symantec-enterprise-blogs.security.com/blogs/threat-intelligence/istr-24-cyber-security-threat-landscape`](https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/istr-24-cyber-security-threat-landscape)*。\n\
  \n¹⁷ Alex Hern, “TalkTalk 因网络攻击被处 40 万英镑巨额罚款”, *卫报*, 2016 年 10 月, *[`www.theguardian.com/business/2016/oct/05/talktalk-hit-with-record-400k-fine-over-cyber-attack`](https://www.theguardian.com/business/2016/oct/05/talktalk-hit-with-record-400k-fine-over-cyber-attack)*。\n\
  \n## 第 8 章：人为威胁\n\n网络安全面临的一些最大威胁并非来自技术，而是来自使用技术的人。68% 的组织观察到内部攻击的增加，并且正如第 6 章中提到的，70%\
  \ 的组织在 2019 年实际上经历过至少一次内部攻击。¹⁸\n\n仔细想想，这其实是合情逻辑的——对于现有的各种类型的恶意软件，它们仍然需要找到进入组织系统的方法。让内部人员在无意中将其引入你的网络，例如通过打开一封看似来自首席执行官（CEO）的邮件中的恶意附件（换句话说，就是让他们掉入陷阱）\n\
  \n## 8.1 员工意识\n\n防御攻击需要员工了解如何识别和应对。\n\n## 8.2 社会工程学\n\n社会工程学攻击自人类文明早期一直存在。从古希腊人使用特洛伊木马到维多·卢斯蒂格（Victor\
  \ Lustig）在 20 世纪 20 年代试图出售埃菲尔铁塔铁，骗子在历史上一直在行骗并造成了许多痛苦。\n\n社会工程学是一种攻击手段，操纵某人去做不应该做的事情——打开附件或泄露敏感信息。\n\
  \n### 8.2.1 钓鱼攻击\n\n钓鱼攻击是最常见的社会工程学攻击形式，是通过看似合法来源的电子通信欺骗性获取信息，或试图诱导用户采取某些行动（如付款或下载恶意软件）。钓鱼攻击根据目标和执行方法有多种形式，但最常见的媒介是电子邮件。\n\
  \n\n\n\n钓鱼邮件中的链接看起来是法的，但仔细检查通常会发现一些不一致，例如故意的拼写错误或使用可疑的子域名。你访问的网站可能会窃取你的凭据，或者你打开的附件可能包含恶意软件载荷，让攻击者能够访问你的网络。其结果往往不会立即显现，因为在大多数情况下，这将触发安全响应——对于攻击者来说，大多数情况下保持隐藏状态要好得多。这为攻击者留了时间来提升权限、在你的网络中移动并造成最大的损害。\n\
  \n从历史角度来看，钓鱼主要由无针对性的“批量”攻击组成，但正如前文提到的，最近已转向质量更高、针对性更强的方法。针对特定组织或个人的钓鱼被称为“鱼叉式钓鱼”，它通常伪装成来自供应商或其他可赖第三方的电子邮件。另一种变体是“捕鲸鱼式钓鱼”，它针对高层管理人员，通过精心设计的电子邮件专门吸引他们——例如可能伪装成合同纠纷或升级的客户投诉。“捕鲸鱼式钓鱼”的对立面是商务电子邮件诈骗（BEC），其中钓鱼邮件看起来来自高管。\n\
  \n钓鱼的其他变体还包括电话钓鱼或基于 IP 的电话（`VoIP`）（`vishing`）以及短信钓鱼（`smishing`）。只要投入足够的精力，坚定的攻击者可以利用任何通信媒介来投放他们的钓鱼攻击。\n\
  \n### 8.2.2 社交媒体\n\n社交媒体可能是交流和共享信息的绝佳工具，但像任何在线活动一样，它也有自己的一风险。我们乐意分享自己的照片、位置和敏感信息，却很少考虑自己的安全或隐私。我们也很少考虑我们的社交媒体活动给他人可能带来的风险——无论是朋友、家人还是我们工作的组织。\n\
  \n在社交媒体上分享信息时，考虑这些信息可能如何被使用是非常重要的。例如，重置密码的功能通常有一个安全问题作为额外的安全保护层：你母亲的娘姓、你的第一只宠物或你读过的学校。你可能认为你对那个问题的答案很少人会知道，但如果你在社交媒体上发布了家庭细节或宠物照片，或者注册了同学聚会页面，那么攻击者就能以较小的努力找到这些信息。\n\
  \n在社交媒体上分享的信息具有巨大的价值，但被动信息收集并非唯一的风险。“猫捉钓鱼”（Catfishing）——使用虚假个人资料诱导个人的敏感信息——在社交媒体平台上很常见，包括约会应用和网站。虚假资料会开始一段看似无害的对话以获得接收者的信任，然后随着时间的推移，操纵接收者提供更多信息。\n\
  \n“猫捉钓鱼”经常被用于对组织进行侦察，从组织员工获取信息为攻击做准备。它还被用于窃取凭据甚至整个身份。\n\n社交媒体应用也可能是风险来源，即使它们是由 LinkedIn\
  \ 和 Facebook 这样的大组织开发的。2017 年，安全研究人员发现，尽管平台有安全限制，仍然可以将恶意文件作为附件通过 LinkedIn 消息发送。仅仅一年后，安全研究人员发现了\
  \ Facebook Messenger 应用中的一个漏洞，该漏洞允许犯罪黑客暴露用户的联系列表和消息。\n\n为了防御社交媒体攻击，请制定一项在工作电脑上使用社交媒体的政策。此类政策应禁止员工在手机和其他设备上使用社交媒体。培训员工理解社交媒体带来的风险。\n\
  \n### 8.3 远程办公\n\n在家里、火车上或其他国家工作的自由是一个巨大的福利，但它也带来了一系列风险。控制这些风险更具挑战性，因为员工在你的组织边界之外运行。在所有与远程办公相关的风险中，特别是这样做时，丢失或被盗可能是常见的。手机或笔记本电脑等移动设备很容易丢失，被盗长期以来一直是风险。你的远程办公政策应该包含处理设备的要求：不要让设备无人看管，特别是公共场所；不要将设备存放在车辆内；在任何情况下，设备都应该加密，这样即使丢失或被盗，信息的机密性也能保持完整。理想情况下，还可以远程擦除设备。\n\
  \n远程办公不可避免地需要连接互联网。免费 Wi-Fi 遍布各地，从火车到咖啡馆，但使用它是有风险的。犯罪黑客可以创建虚假的访问点（WAPs）来收集凭据和其他敏感流量，而安全性低的网络可能会让你遭受恶意软件和中间人攻击（MITM）。最安全的选项是完全禁止此类设备连接公共\
  \ Wi-Fi，但这并非总是可能的。如果无法避免使用公共 Wi-Fi 网络，次优方案是连接虚拟专用网络（VPN）。`VPN` 允许你通过互联网安全地连接到另一个网络，防止任何监控\
  \ Wi-Fi 流量的人截获你发送或接收的数据。\n\nUSB 充电是另一个潜在风险源。大多数 USB 接口不仅允许电力传输还允许数据传输，安全专业人员已经证明，可以向连接到充电器的设备投递恶意软件，甚至录制屏幕。因此，你可能希望考虑\
  \ USB 数据阻塞器（移除了数据传输引脚的 USB 接口）并禁用笔记本电脑和其他设备上的 USB 端口。\n\n远程办公的一个漏洞是我们许多人可能不会过多考虑的问题——窃听。我们大多数人即使在公共场所也假定有某种程度的隐私，我们会在酒吧、餐厅等地方公开讨论敏感话题，假设没有人在认真听。然而，有时确实有人在听。经常乘火车通勤并在旅途中经常打业务电话的高管是敌对行为者进行侦察的首要目标。攻击者可以乘坐同一班火车，并坐得足够近以便听到高管的对话。只要时间足够，攻击者可能会获得有关该高管组织的有用信息——这些信息随后可用于进行更具技术性的攻击。虽然此类泄露自然难以控制，但你可以确保你的网络安全培训包括不要在公共场所讨论机密事项的建议。\n\
  \n\n\n\n\n“窥视攻击”（Shoulder-surfing）是指有人从你肩膀后面阅读你的屏幕，这是在公共场所远程工作时的另一个潜在问题。虽然缓解这种风险最简单的方法是坐在一个让别人无法看到你屏幕的地方，但这并不总是可行。为了增加另一层保护，可以为用户提供笔记本电脑及类似设备的隐私屏。这些隐私屏可以缩小屏幕的有效视角，使得屏幕无法从侧面看到。\n\
  \n### 8.4 人为威胁示例：WannaCry\n\n2017 年，一场重大的勒索软件攻击袭击了全球系统。这种名为“WannaCry”的程序感染了包括日产（Nissan）和联邦（FedEx）在内的大量机构系统。在英国，国家医疗服务体系（NHS）遭受了严重打击，80\
  \ 个 NHS 机构的 70,000 台计算机和医疗设备受到影响。这次攻击导致超过 19,000 次手术被取消，并为 NHS 造成了估计 9200 万英镑（约\
  \ 1.18 亿美元）的损失 [24] —— 这完全是因为有人点击了恶意链接或打开了恶意文件。\n\nWannaCry 勒索软件通过利用 Windows Server\
  \ 服务器消息块（`SMB`）协议中的漏洞进行传播，该漏洞允许在目标系统上执行代码。据信美国国家安全局（`NSA`）早在 2012 年就发现了该漏洞，但并没有通知微软，而是开发了一个利用该漏洞的工具，代号为“永蓝”（EternalBlue）\
  \ [25]。\n\n在某个时刻 —— 目前还不清楚具体何时 —— NSA 意识到`EternalBlue`可能被盗了。由于认为该工具的效用正在减弱，并担心该漏洞被大规模利用可能产生的潜在影响，NSA\
  \ 向微软通报了该漏洞。微软反应迅速，于 2017 年 3 月为所有受支持的操作系统发布了关键安全补丁。\n\n2017 年 4 月，名为“影子经纪人”（Shadow\
  \ Brokers）的犯罪黑客组织发布了`EternalBlue`的代码。2017 年 5 月，WannaCry 登上了新闻头条。\n\nWannaCry 之所以传播得如此远、如此快，是因为事件响应程序不明确以及未能及时应用安全补丁共同导致的。尽管各个\
  \ NHS 机构在第一次攻击发生的当天早上就开始通知 NHS Digital、警方及其他人情况异常，但直到那天晚上才有了协调的响应 [26]。\n\n微软 2017\
  \ 年 3 月的安全补丁适用于包括 Windows7 在内的所有受支持操作系统 —— 然而，Windows7 占了全球 WannaCry 感染病例的约 98%\
  \ [27]。尽管 NHS Digital 在 2017 年 4 月曾建议安装补丁，但受影响的 80 个 NHS 机构中没有一个安装了该补丁 [28]。\n\n\
  WannaCry 攻击说明了有效的补丁管理（参见 [12.6.2]）的重要性，也说明了在一个经过测试且有效的事件响应计划，攻击扩散得有多快（参见 [14.1.2]）。如果当时应用了补丁并更好地协调了响应，攻击可能完全被避免。至少，它的影响会小得多。\n\
  \n[18] “2020 年内部威胁报告。”\n\n[19] Proofpoint，“2020 年钓鱼状态报告”，2020 年 1 月，[`www.proofpoint.com/uk/resources/threat-reports/state-of-phish`](https://www.proofpoint.com/uk/resources/threat-reports/state-of-phish)。\n\
  \n[20] 同上。\n\n[21] Check Point，“恶意软件是否隐藏在你的简历中？LinkedIn Messenger 的漏洞曾允许恶意文件传输”，2017\
  \ 年 8 月，[`blog.checkpoint.com/2017/08/18/malware-hiding-resume-vulnerability-linkedin-messenger-allowed-malicious-file-transfer/`](https://blog.checkpoint.com/2017/08/18/malware-hiding-resume-vulnerability-linkedin-messenger-allowed-malicious-file-transfer/)。\n\
  \n[22] Ron Masas，“已修复的 Facebook 漏洞本可能暴露你及你朋友的隐私信息”，*Imperva*，2018 年 11 月，[`www.imperva.com/blog/facebook-privacy-bug/`](https://www.imperva.com/blog/facebook-privacy-bug/)。\n\
  \n[23] Catalin Cimpanu，“官员警告使用公共 USB 充电站的危险”，*ZDNet*，2019 年 11 月，[`www.zdnet.com/article/officials-warn-about-the-dangers-of-using-public-usb-charging-stations/`](https://www.zdnet.com/article/officials-warn-about-the-dangers-of-using-public-usb-charging-stations/)。\n\
  \n[24] 健康与社会保障部，“保障医疗领域的网络韧性：2018 年 10 月更新”，2018 年 10 月，[`www.gov.uk/publications/securing-cyber-resilience-in-health-care-october-2018`](https://www.gov.uk/publications/securing-cyber-resilience-in-health-care-october-2018)。\n\
  \n[25] Ellen Nakashima 和 Craig Timberg，“NSA 官员担心其强大的黑客工具泄露。结果真的发生了，”*华盛邮报*，2017\
  \ 年 5 月，[`www.washingtonpost.com/business/technology/nsa-worried-about-the-day-its-potent-hacking-tool-would-get-loose-then-it-did/`](https://www.washingtonpost.com/business/technology/nsa-worried-about-the-day-its-potent-hacking-tool-would-get-loose-then-it-did/)。\n\
  \n[26] 国家审计局，“调查：WannaCry 网络攻击与 NHS”，2018 年，[`www.nao.org.uk/reports/investigation-wannacry-cyber-attack-and-the-nhs/`](https://www.nao.org.uk/reports/investigation-wannacry-cyber-attack-and-the-nhs/)。\n\
  \n[27] Russell Brandom，“几乎所有 WannaCry 受害者都在运行 Windows7 —— 研究人员称 Windows XP 的影响不足道，”*The\
  \ Verge*，2017 年 5 月，[`www.theverge.com/2017/5/19/15665488/wannacry-windows-7-version-xp-patched-victim-statistics`](https://www.theverge.com/2017/5/19/15665488/wannacry-windows-7-version-xp-patched-victim-statistics)。\n\
  \n[28] William Smart，“WannaCry 勒索软件网络攻击的教训回顾”，健康与社会保障部，2018 年 2 月，[`www.england.nhs.uk/publications/lessons-learned-review-of-the-wannacry-ransomware-cyber-attack/`](https://www.england.nhs.uk/publications/lessons-learned-review-of-the-wannacry-ransomware-cyber-attack/)。\n\
  \n\n\n\n一种“尾随”策略是让攻击者加入员工的抽烟休息，假装是最近入职公司的新员工（这恰好解释了为什么他们没有身份证或钥匙卡），然后在他们结束休息时跟随他们进入内部。先进的侦察可以提高此类攻击的成功率——在对话中提到一两个名字，或者提到某个项目或其他“内部”信息，将有助于增强攻击者是真实员工的幻觉。\n\
  \n为了完全避免与合法员工交流，另一种策略是假装在打电话——虽然受过培训的安保人员本应该停下并询问他们的身份和来意，但否则人们往往由于太礼貌而不会中断一个显然正在进行的对话，而是静静地为他们开门。攻击者只需要点头或口头表示感谢即可。²⁹\n\
  \n某些物理侵入威胁则更为公开。攻击者可以假装成访问员工的客人，或者装成维护人员，以此种方式进入。此类攻击者可能会拒绝护送，可能声称他们赶时间了，或者他们已经认路了。一旦被离开，他们就可以开始攻击。这些攻击通常用于安装物理硬件，如\
  \ `USB` 键盘记录器或键盘、视频、鼠标（`KVM`）切换器，后者旨在允许用户从单个工作站操作多台计算机。或者，他们可能会尝试获取你的信息，无论是通过纸质副本还是通过从计算机中外泄数据。\n\
  \n你可以采取一些措施来防止尾随和其他物理侵入威胁，这些内容将在 12.3 中进行详细讨论。\n\n## 9.2 物理安全与移动设备\n\n尾随并不是人为和物理威胁重叠的唯一领域。在使用移动设备时（特别是在远程工作时），之前讨论的丢失或被窃风险既是物理安全问题，也是人为安全问题。如何缓解此类风险将在\
  \ 12.3.5 中进行详细讨论。\n\n然而，还有更新颖的方式可以将物理威胁与社会工程技术相结合。例如，攻击者可能会将一个无标记的 `USB` 设备丢在员工可能遇到的地方——也许在停车场或入口处，希望员工看到它，捡起并插到电脑上查看里面有什么。\n\
  \n这种攻击类型的成功率惊人。2016 年的一项研究发现，大学校园内丢弃的 `USB` 驱动中，至少有 45%打开过一个或多个文件，且 98%被丢弃地点取出。³⁰这种攻击利用了我们的好奇心和天生的利他倾向（大多数用户捡起设备是打算将其还给所有者），而且非常难以防御。\n\
  \n在场所内或附近发现的任何未识别移动设备都可能是威胁。培训员工上交发现的移动设备，并理解恶意设备可能带来的风险（员工培训将在 12.11 中进行详细讨论）。培训你的\
  \ IT 部门在物理隔离的裸机测试系统上测试任何发现的设备，以便设备上的恶意软件不会扩散到网络中，并在设备证明是 `USB killer`（连接时，这种小型设备会发送高电压电涌，可能会损坏硬件组件）时最大限度地减少硬件损坏。\n\
  \n## 9.3 环境威胁\n\n在第 6 章中，我们讨论过环境威胁的例子——暴风雨。尽管这种威胁通常不是恶意的，但它与技术或人为威胁一样具有灾难性。然而，像任何其他威胁一样，它只有在存在它可以利用的漏洞时才会构成风险——例如，漏的屋顶。\n\
  \n极端天气并不是唯一需要考虑的环境威胁。洪水、地震和火灾都可能造成重大破坏，石油或化学等行业的邻近企业也是如此。重要的是你不要忽视这种威胁类型——在 12.3.7\
  \ 中，我们讨论了应对它的一些方法。\n\n## 9.4 物理威胁示例：KVM 攻击\n\n`KVM` 切换器是一种允许用户在不更换键盘、屏幕或鼠标的情况下切换操作计算机的设备。`KVM`\
  \ 切换器常见于数据中心，允许操作人员从同一个工作站连接到不同的服务器。知名制造商的 `KVM` 带有内置安全功能，防止外部攻击者连接到它们并访问连接的计算机，这很令人安心——但如果用来攻击你的\
  \ `KVM` 属于别人呢？\n\n`KVM` 攻击在 2013 年引发关注，发生了一系列针对伦敦银行的攻击。从 2013 年 4 月开始，一名攻击者进入巴克莱银行的一个分行，谎称是\
  \ IT 支持人员，并在银行计算机上连接了一个支持 `3G` 的 `KVM` 切换器。`3G` 连接允许攻击者通过互联网连接到 `KVM`，从而从远程位置对连接的计算机进行完全控制。一旦他们获得了控制权，只需将资金从一个账户转移到另一个账户，金额小到足以避免额外的审查。\n\
  \n攻击者盗取了 125 万英镑（约 160 万美元），其中 60 万英镑（约 77 万美元）被巴克莱银行追回。当年 7 月，攻击者袭击了另一家巴克莱银行分行，导致\
  \ 9 万英镑（约 11.5 万美元）被盗。这一次，虽然`KVM` 切换器被警方追回，但攻击者仍在逃外。\n\n2013 年 9 月，攻击者将目标转向桑坦德银行（Santander）的分行。和之前一样，攻击者以\
  \ IT 支持人员的假义进入场所，并在银行计算机上连接了另一个支持 `3G` 的 `KVM` 设备，而同犯则等待将资金转移到持有账户，就像他们在之前的攻击中做的那样。然而，这一次警方做好了准备。\n\
  \n对一名同犯房产进行的突击揭露了正在执行桑坦德银行攻击的计算机，以及大量被盗的信用卡、信件、用户名和密码以及用于实施诈骗的其他材料。警方在该“IT 支持工程师”离开银行后不久就逮捕了他。³¹\n\
  \n2013 年的 `KVM` 攻击者利用社会工程漏洞（通过假装 IT 支持）安装了基于硬件的威胁（支持 `3G` 的 `KVM` 切换器）。他们对银行系统的了解足以确保所进行的国际转账金额略低于触发额外检查的限制，这表明他们进行过研究和侦察，以识别最安全的方法提取资金（并可能也识别了目标分行）。\n\
  \n此类“组合型”攻击之所以有效，是因为它们绕过了许多为了防御它们而设置的控制。`3G` 路由器允许 `KVM` 切换器通过移动互联网连接运行，从而绕过了银行的网络安全控制，而社会工程技术则允许攻击者绕过物理侵入控制。防御组合攻击需要组合防御，或称“深度防御”，这将在\
  \ 12.12.8 中进行详细讨论。\n\n\n\n\n- Matthew Tischer 等，“用户确实会插上他们发现的 USB 盘”，*2016 IEEE\
  \ 安全与隐私对称会议 (SP)*，2016 年 5 月，[https://elie.net/publication/users-really-do-plug-in-usb-drives-they-find/]。\n\
  - Kate Ferguson，“从银行盗取 125 万英镑的网络犯罪集团被判定犯欺诈罪”，*Evening Standard*，2014 年 3 月，[https://www.standard.co.uk/news/crime/cyber-gang-who-stole-125m-from-banks-guilty-of-fraud-9190978.html]。\n\
  \n# 第 10 章：第三方威胁\n\n一个日益互联的世界需要日益互联的组织。无论你的组织经营在哪个领域，你都很有可能依赖于第三方生产的组件甚至整个产品。毫无疑问，你们还共享着数据——可能是通过电子邮件，或者通过专用的供应商门户。这种连通性带来了巨大的业务利益，但也让让你暴露在新的风险之中。直接与你的组织相关的风险完全在你的控制范围内，但你供应商的措施则是另一回事。\n\
  \n## 10.1 供应链威胁\n\n现代供应链横跨全球，涵盖成千上万个组织。供应链之间共享的数据比以往任何时候都多，尽管这提高了效率和生产力，但也引入了风险。\n\
  \n通过供应链进行的攻击曾是罕见现象，但一直在稳步上升。赛门铁（Symantec）2019 年的报告指出，较上一年增长了 78%。这种活动性的增加反映在因第三方导致的数据泄露的组织数量上——在\
  \ 2018 年庞蒙研究所（Ponemon Institute）的一项调查中，高达 59% 的受访者。\n\n即使你对供应商实施了广泛的控制，通过供应链对你的组织进行的攻击也不是你需要考虑的唯一因素。虽然许多供应链攻击专门设计用于利用供应商的安全弱点来攻击其一个或多个客户，但针对供应商本身的攻击可能会导致你失去对关键系统和/或服务的访问。\n\
  \n### 10.1.1 规模和权限问题\n\n防御供应链攻击是一项重大的网络安全挑战。第一个问题是规模问题。中小企业拥有一百多个供应商并不罕见，对于大型组织来说，数量往往会相应增加。庞蒙研究所调查的\
  \ 60% 受访者表示，由于缺乏资源，他们并不监控第三方的安全或隐私惯例，而这可能只是冰山一角。\n\n另一个问题是权限。拥有强大购买能力的大型组织更容易对其供应商施加网络安全要求，但规模较小的组织往往捉履从心。庞蒙研究所调查的\
  \ 60% 受访者表示，供应商拒绝允许对其安全和隐私活动进行独立监控或验证，只有 23% 的组织进行独立审计或第三方验证。此外，许多组织（47%）在考虑新供应商时仅进行法律或采购审查，但这些审查通常侧重于供应商满足生产或服务需求的能力，很少关注网络安全事宜。\n\
  \n在供应商身上强制执行网络安全要求是一个棘手的问题。即使在供应商接受你的要求的情况下，他们也可能没有资源或专业知识来实现这些要求。采取务实的方法至关重要——对于每个供应商来说，实施广泛的网络安全措施既没有必要也不符合实际情况。相反，应该为供应商定制需求——考虑他们所访问的信息量和敏感性，以及他们如何访问这些信息，并据此设定要求。还要记住，供应商不需要访问你的信息就能创建安全漏洞——例如，如果你的互联网（或通常的电力）中断，你就会失去对存储在云端信息的访问。\n\
  \n归根结底，你对自己的缓解措施的控制比对供应商的更多，因此尽可能通过应用你自己的措施来减少对供应商控制的依赖。\n\n### 10.1.2 理解数据流\n\n\
  最大的问题可能是理解你与供应商共享了多少数据，以及在数据离开你的控制后他们做了什么。根据 GDPR 等通用数据保护条例等数据保护法律，作为数据控制者，你仍对共享给数据处理器等供应商的数据负责。因此，一旦供应商发生泄露，你的组织将面临罚款的风险（除非存在特殊情况，例如供应商未遵守合同约定导致了泄露）。\n\
  \n为了避免此类情况，进行一定的尽职调查是关重要的。12.13.1 详细讨论了此类检查。\n\n### 10.1.3 云服务\n\n云服务在现代 IT 操作中日益普及。它们提供了可扩展的处理和存储，可以成为组织的巨大益处，但其透明度和距离使其成为最难有效控制的系统之一。\n\
  \n鉴于审计或以其他方式验证即使是直接供应商的 IT 安全都是如此困难，访问如亚马逊服务器机场进行安全审计的机会几乎为零。在许多情况下，你别无选择信任云供应商提供的信息（讽刺的是，出于安全目的这些信息也是有限的）。因此，确保云服务的网络安全需要研究和不可少量的信任。\n\
  \n尽管如此，通过仔细审查你的合同/服务水平协议（SLA），你可以取得很大进展——你可能无法谈判条款，但你至少可以确保你对提供的条款感到满意。这在 12.13.2\
  \ 中有更详细的讨论。\n\n## 10.2 第三方威胁案例：Target 数据泄露\n\n2013 年，美国零售商 Target 遭遇了数据数据泄露，导致 7000\
  \ 万份个人身份信息（PII）记录丢失以及多达 4000 万个支付卡凭据丢失。针对 Target 的一家暖空调供应商的成功网络钓鱼攻击安装了木马程序，该供应商有限的网络安全措施未能检测到它。该木马未被发现的时间足够长，获取了访问\
  \ Target 内部供应商门户的登录凭据。\n\n凭借这些凭据，攻击者渗透了 Target 的内部网络，并在 Target 商店的几台收银机上传了恶意软件，显然是为了测试恶意软件的有效性。一旦满意，攻击者继续将恶意软件上传到全美大部分\
  \ Target 商店的销售点（POS）设备中。每当客户在感染设备上使用卡时，恶意软件就会访问设备内存，拦截姓名、卡号和其他敏感信息。捕获后，恶意软件会对信息进行加密并存储在\
  \ Target 内部网络中受损的系统中，然后发送给攻击者。\n\n\n\n\n\n一份攻击后进行的渗透测试泄露报告暴露了 Target 存在的许多安全问题，但至关重要的是，报告发现“没有任何控制措施可以限制[测试人员]对任何系统的访问，包括商店内的设备，如销售点（POS）收银机和服务器”。39\
  \ 本质上，一旦攻击者通过供应商的登录访问了 Target 的网络，他们就可以随心所欲。\n\n几个月后，Home Depot 也遭到同种恶意软件变体的侵害。⁴⁰\
  \ 攻击导致 5600 万张支付卡和 5300 万个邮箱地址暴露——正如你所料，这追溯到一个受损的供应商。⁴¹\n\nTarget 和 Home Depot 的攻击动了美国消费者对大型零售商的信心，表明即使是大型、可靠的机构也可能使其个人信息面临风险。它们也标志着网络安全领域的一个分水岭，因为机构开始面对隐藏在其供应链中的风险。然而，诸如\
  \ 2018 年 Ticketmaster 数据泄露等事件表明，道路仍然长要走。⁴²\n\n³² 《互联网安全威胁报告 (ISTR) 第 24 卷》。\n\n\
  ³³ Ponemon Institute，“第三方生态系统中的数据风险——第三年度报告”，2018 年 11 月，[`promotions.opus.com/l/12092/2018-11-14/6bj4g6`](https://promotions.opus.com/l/12092/2018-11-14/6bj4g6)。\n\
  \n³⁴ 同上。\n\n³⁵ Ponemon Institute，“第三方生态系统中的数据风险——第三年度报告”，2018 年 11 月，[`promotions.opus.com/l/12092/2018-11-14/6bj4g6`](https://promotions.opus.com/l/12092/2018-11-14/6bj4g6)。\n\
  \n³⁶ 同上。\n\n³⁷ Brian Krebs，“Target 黑客通过 HVAC 公司入侵”，Krebs on Security，2014 年 2 月，[`krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/`](https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/)。\n\
  \n³⁸ 同上。\n\n³⁹ Brian Krebs，“2013 年泄露事件几天后的 Target 公司内部情况”，Krebs on Security，2015\
  \ 年 9 月，[`krebsonsecurity.com/2015/09/inside-target-corp-days-after-2013-breach/`](https://krebsonsecurity.com/2015/09/inside-target-corp-days-after-2013-breach/)。\n\
  \n⁴⁰ Brian Krebs，“Home Depot 遭到与 Target 相同的恶意软件攻击”，Krebs on Security，2014 年 9 月，[`krebsonsecurity.com/2014/09/home-depot-hit-by-same-malware-as-target/`](https://krebsonsecurity.com/2014/09/home-depot-hit-by-same-malware-as-target/)。\n\
  \n⁴¹ Tara Seals，“Home Depot：大规模泄露通过第三方供应商凭据发生”，《Infosecurity Magazine》，2014 年 11\
  \ 月，[`www.infosecurity-magazine.com/news/home-depot-breach-third-party/`](https://www.infosecurity-magazine.com/news/home-depot-breach-third-party/)。\n\
