  \n（此处省略原文中重复的段落，进入后续核心内容）\n\n### 14.3.1 业务影响分析\n\n在更正式的 BCM 中，在确定连续性计划细节之前，首先要进行\
  \ `BIA` 和风险评估。虽然风险评估对大多数经理来说很熟悉（其原则在 `12` 中进行了详细讨论），`BIA` 是与业务连续领域相关的流程。这也是 BCM\
  \ 中最重要的流程之一。\n\n与风险评估思考资产和业务流程可能受到什么影响以及给定风险情景的严重程度不同，在 `BIA` 中，你假设业务活动已经受到中断——无论什么原因——并思考如何在接受的时间范围内维持和恢复。\n\
  \n正式的 `BIA` 通常分为六个步骤，如下所示。仅需要基础业务连续性安排的组织不需要达到这种详细程度，对于许多他们来说，更简单的方法就可以。尽管如此，在决定使用什么方法之前，至少阅读这六个步骤并熟悉如何一致地评估业务影响的原则，对他们可能很有帮助。\n\
  \n**1. 识别关键活动和资源：**\n\n你需要确保哪些内容的连续性？实现这种连续性需要哪些资源？\n\n**2. 建立影响标准：**\n\n类似于风险评估中衡量影响和可能性的标准，最简单的方法是以表格形式展示你的业务影响标准，以确保所选标准在组织范围内一致。如果可能，将你的标准与不同类型的损害对应起来，例如财务影响、声誉影响等。类似的情况可能是类似的。例如，你可以为以下情况制定计划：\n\
  \n*   重大场所或建筑事件（火灾、洪水等）；\n*   信息和通信系统故障（无论原因如何）；\n*   供应链故障；以及\n*   流行病及类似情景。\n\n\
  这种处理方法可以让任命的人员专注于应对这些情景，节省时间、资金和精力。\n\n计划应该清晰具体，并直接引用触发计划定义的阈值。计划还应规定何时可以取消计划、如何进行报告、参与计划实施的角色和职责，以及任何必要的支持信息。计划还应让所有激活时可能需要使用的人能够获取，因此务必有效地传达给需要知道自己被要求做什么的人。正如一般的事件响应活动一样，记录事件日志以告知你的持续改进活动（见\
  \ `15.2`）并改进未来的响应也是明智之举。\n\n\n\n\n然而，你不应该等到事故发生后才首次激活你的计划。相反，应该每年进行一或两次演练，并记录和评估结果以识别任何问题或缺陷，将其作为你改进活动的输入。除了确保你的计划确实按预期运行外，它还能帮助员工熟悉他们需要做的工作。演练本身就是降低风险和使你的业务更安全的手段。真实的事故应该是罕见的，但这不能作为在来临时无法迅速行动的借口。\n\
  \n⁸⁷ “简述水电网络攻击。”\n\n⁸⁸ 当然，这并没有考虑到当时的所有问题，例如需求减少和供应链问题，但这是一个很好的开始。\n\n⁸⁹ 关于符合国际标准\
  \ `ISO 22301` 的正式 BCM，请参见 `29.1`。\n\n## 第 12 章：管理与保护\n\n部署风险适当的信息安全措施——依赖人员、流程和技术——来保护你的信息资产、业务流程和基础设施的\
  \ `CIA`（机密性、完整性、可用性）。\n\n“管理与保护”是 `CRF` 第一类也是最大的流程类别，由对管理网络安全和保护组织免受威胁的核心活动组成。当然，为了让防御措施有效，你需要知道那些威胁是什么。我们在这里指的不是泛泛的方式（正如本书的第\
  \ 2 部分所讨论的那样），而是专门适用于你的威胁。你需要理解谁可能攻击你以及如何攻击，以及他们的动机是什么。\n\n你从事的是什么行业？例如，受政治或社会驱动的个人或群体（黑客主义\
  \ `hacktivists`）可能会以你为目标吗？你持有哪些数据？谁可能想要这些数据（并准备为了获得它们不惜犯罪）？他们可能会使用什么方法？对于每种攻击类型，你的弱点在哪里？\n\
  \n清楚地知道你正试图防止哪些具体的事故也有帮助。每个人都想避免不利后果，但那些能专门对*你的*组织在运营、财务和或声誉方面造成损害的事故是独特的。你所持的信息并不是你需要保护的唯一资产——例如，你必须寻求保留的关键业务流程，以及需要保持运行的网站。此外，并非所有信息的价值都是相等的，更复杂的是，相同信息的价值可能会随着时间而改变——例如，关于新产品和服务的信息在尚未进入公共领域时价值高得多。你的监管或合同要求也可能指导你的优先事项。⁴³\n\
  \n理解你必须保护的资产将帮助你确定你可能面临的攻击或威胁，以及你的资产可能如何被破坏（实际上，这是风险管理，在 12.12 中进行了更详细的讨论）。从那里，你可以对实施的安全流程和控制做出更明智的决策。\n\
  \n正如 5.1 所讨论的，请记住`security` 同时需要`people`、`processes` 和`technology`（参见 5.2）。无论你做出什么决定，请记住`security`\
  \ 同时需要`people`、`processes` 和`technology`。\n\n### 12.1 资产管理\n\nIT 资产和信息资产在整个生命周期内都经过记录、跟踪和管理。每项资产都有一个定义的“所有者”负责。\n\
  \n**关键输出：** 一个用于跟踪（类）IT 和信息资产的良好系统，以及每个条目的有用信息。\n\n有效的网络安全从保护你的 IT 和信息资产开始。毕竟，在当今的信息经济中，你组织的知识资本（通常以数字形式存储）可能是你最关键的资产，并决定了你如何与竞争对手脱颖而出。任何对你的业务有价值的信息定义上都是信息资产。\n\
  \n\n\n\n### 12.1.2 资产清单\n\n尽管大多数组织资产管理的核心产物可能是相同的——即资产清单或资产登记——但清单的呈现和存储方式会根据组织的规模和复杂性，以及其打算将清单用于哪些活动和执行多少活动而产生显著差异。你可以使用电子表格、数据库或跟踪资产和/或资产类别的软件。每条条目还应指定某些特征，例如分类和位置，并需要识别所有者——负责管理该资产的人员。12.1.4\
  \ 进一步深入地讨论了这些特征。\n\n请注意，你并不一定需要追踪每一个物品——特别是对于大型或复杂的组织，这样做很快就会变得不可持续。即使是下面列表中的条目也足够了，只要你同时也为每个条目提供了特征：\n\
  \n• 台式电脑 – Windows\n• 台式电脑 – Mac\n• 手机 – Android\n• 手机 – iOS\n• 等等。\n\n或者，根据你的需求和预算，你可能希望采用更广泛的方法，例如：\n\
  \n• 台式电脑\n• 移动设备（笔记本电脑、手机和平板电脑）\n• 等等。\n\n没有“正确”的方法，只要你选择一种适合你需求的方法并一致地应用它。你选择的方法可能会随着你对信息资产、环境和网络安全需求的更深入了解（如果其中任何一项发生变化）而演变。\n\
  \n### 12.1.3 识别资产\n\n虽然计算机、移动设备和其他硬件是一个很好的起点，但你的 IT 资产范围远超这些内容。然而，请记住，你的重点是信息和网络安全——键盘和鼠标并不特别重要，甚至计算机本身的价值通常也有限，但其承载的数据以及对你内部网络的访问权限对你公司的生存往往至关重要。\n\
  \n识别信息资产尽管其定义相当直观（任何对你的业务有价值的信息），但可能是具有挑战性的，因为你可能需要追踪被遗忘的服务器或数据库，检查物理和数字位置，并建立未记录的员工知识。\n\
  \n除了硬件、软件、网络、信息和信息系统等，你可能还想记录诸如组织场所或结构、重要流程和人员等资产。尽管这些资产并不明显地标记为“IT”或“信息”资产，但它们显然影响着那些资产的安全，因此将流程、人员等以与“正式”IT\
  \ 和信息资产类似的方式对待是值得的。\n\n此外，识别流程和人员等资产将有助于你后期阶段的网络安全项目。例如：\n\n• 在风险评估中，流程和员工可能会引入或减轻风险。\n\
  • 在业务影响分析（BIA）中，对流程的影响可能是衡量业务中断的关键因素（另见 14.3.1）。\n• 从数据保护的角度来看，在清单中将你的数据处理活动记录为流程，在进行数据保护或隐私影响评估时将产生巨大的益处。保留此类处理活动记录本身也可能是一项监管要求，(44)]，并帮助你满足进一步的要求（例如，用于风险或影响评估）。\n\
  \n根据你的需求，你可能还会发现将资产分类为“主要的”或“支持性的”很有价值。这涉及将特定活动的核心流程和信息（主要资产）与支持这些核心流程和/或信息的资产（支持资产）区分开。此类支持资产可能包括硬件、软件和人员，并可能存在漏洞，如果被利用，可能会损害你的业务活动所依赖的主要资产。\n\
  \n所有这些考虑都将帮助你建立你认为资产的边界。\n\n为了实际识别有形资产，采购信息可以帮助你有一个良好的开头，但重要的是要意识到你不能仅仅依靠这些记录来完成你的清单，因为它们可能追溯得不够远。毕竟，组织使用超过五年的技术并不罕见，而且采购记录可能无法涵盖所有内容。\n\
  \n外部资产很容易被遗漏，但它们是关键的资产。例如，如果你使用云服务，由于需要保护，将其纳入清单中是关键的。由于云服务器可能位于国外，这可能带来跨国问题。远程办公和自带设备（BYOD）策略也可能带来额外的挑战。然而，有了正确的组织文化和管理支持，这是可能的。本书的[附录\
  \ 1](#Appendix_01.xhtml#app1）包含一份资产清单帮助你开始。\n\n### 12.1.4 完成清单\n\n根据你的需求，你可能还会发现，除了识别实际资产并将其记录在清单中之外，你还需要记录一些额外细节，例如：\n\
  \n• 资产所有者\n• 分类（反映信息的敏感性/重要性）\n• 资产标识符\n• 资产类别（例如“硬件”、“移动设备”、“软件”）\n以及\n• 估值\n\n\
  你可能还想添加更多细节，例如类型、版本号（特别是软件）、操作员、位置（物理或数字）、过期或更换日期、操作说明链接等。具体应该记录什么信息取决于你的需求以及你对清单的其他用途，但资产所有者是最低要求。在许多情况下，分类也将具有极价值。出于数据保护目的，你可能还想记录你持有的个人身份信息（PII），例如敏感数据、儿童数据、犯罪数据等。\n\
  \n\n\n\n资产的分类方法会因组织而异。无论这些分类是非常宽泛的（例如“硬件”）还是很窄的（例如“手机手机”），关键是在你的资产清单中一致地应用这些分类。\n\
  \n### 估值\n\n在资产清单中包含估值估计可能会有所帮助，特别是对于支持影响和风险评估。一种简单的方法是使用定义明确的量表，可以基于货币价值，例如 `>£1,000`、`£1,000–£10,000`\
  \ 等；而对于具有非货币价值的资产，使用“低”、“中”、“高”等抽象分级可能很有用。\n\n在任何情况下，术语都应该有明确的定义并保持一致，特别是考虑到每个资产所有者对估值可能会有不同的想法。\n\
  \n### 12.2 信息安全策略\n\n说明你的组织计划保护其物理和信息资产的文件。这应该包括确保策略传达给所有员工和承包商理解的活动。\n\n**关键产出：**一组由高层管理人员发布并批准的文件，确立了你们在信息安全方面的立场，并指导员工如何安全地行动。\n\
  \n从本质上讲，策略是公司范围内关于执行或禁止某些事情的指示。它们是意图声明，并结合记录的程序（这些程序以更务实的方式规定了如何应用策略），对你的网络安全项目来说是无价的。策略规定了你的组织运行的规则和边界（基于各种影响，例如法律要求），这些规则可以影响甚至指导员工的行为；而程序则在特定情况下指导员工，例如在报告潜在的违规行为或设置用户账户时。策略清晰地展示了你的组织对安全的立场和态度，这反过来有助于在整个组织建立并实施安全文化（参见\
  \ 12.11.5）。\n\n起草和审查策略（特别是程序）的另一个益处是，当你与业务各个部门的个人交流并检查实际操作情况时，你会自然地提高自己的信息安全意识和知识。这还将让你更好地了解策略如何影响程序。通过这一过程，你可能还会共同制定更高效的程序，并在与公司周围的人收集信息、明确职责和问责制的同时，鼓励员工保持警惕。这可能会导致一种自然的迭代方法，使持续改进变得丰富（另见\
  \ 15.2），并帮助你更快速、更有信心处理实施项目的其余部分。\n\n一个良好且执行得当的策略证明是比复杂的技术措施更有效的改变员工的方法（尽管请记住，你的整体安全计划需要这三者——人员、流程和技术——才能真正有效）。然而，将起草策略和程序视为一个持续的过程，而不是一次性的努力。随着你获得经验或新见解，你的组织处理事务的方法几乎会随着时间演变，因此你的记录说明应该根据这些变化进行审查和更新。\n\
  \n15.1 详细涵盖了有效的策略和程序，包括关于如何创建它们的提示。\n\n### 12.2.1 总体信息安全策略\n\n你最终可能会得到一组构成信息安全实施项目一部分的策略，其中一个总体信息安全策略以及从该策略派生的从属策略，例如密码策略（参见\
  \ 12.4.4）和补丁策略（参见 12.6.2）。你可能还会从这些策略衍生的进一步文档，如程序和记录。\n\n这种分级方法具有显著益处。拥有一个与你的安全目标明确关联、获得高层管理人员可见支持并链接到进一步、更具体的文件的中心策略，将提供连贯性和可用性的最佳平衡，因为你的替代方案要么是将所有内容拆分成许多没有清晰层级或结构的独立文档，要么是将所有内容放入一个难以阅读且可能被员工回避的巨大文档中。\n\
  \n### 12.2.2 策略内容\n\n虽然信息安全策略必然是一个高层次且相对抽象的文件，但它应该对你实施项目中关键的某些信息保持具体，例如：\n\n• 你的项目范围；\n\
  • 组织的背景；\n• 利益相关者的需求，包括相关的法律和合同要求；以及\n• 你的信息安全计划的战略目标。\n\n如前所述，定期审查策略（至少每年一次）以及在情况变化时审查是重要的。\n\
  \n你还需要通过让他们批准信息安全策略来获得高层管理的支持——事实上，`CEO` 或总经理应该对其签字。如果高层管理人员认真对待安全，员工更有可能效仿，并且可能会提供更多资源用于信息安全。策略应在内部发布，并传达给管理范围内的所有员工和承包商。策略还应根据要求提供给任何第三方。\n\
  \n### 12.2.3 建立你的信息安全目标\n\n信息安全目标本质上是你启动整个实施项目的内容以及你之后需要维护的信息安全计划（否则，你现在付出的努力将白东流）——换句话说，它们是你的网络安全目标。因此，它们也是评估你的进展并检查你所做的事情是否有效，或者是否需要改变方法的方法。\n\
  \n组织的目标很大程度上取决于其背景（在 12.2.4 中讨论）——你仅仅是在满足监管或合同要求吗？你是在试图匹配还是超越竞争对手？无论目标是什么，它们都会塑造你如何应对实施项目。我们将在八步实施法的第四步中详细讨论为你的信息安全计划建立信息安全目标。\n\
  \n### 12.2.4 确定范围和背景\n\n在确定范围时，你需要确保至少考虑到业务特征和组织结构、地点、资产和技术，因为它们可能都是你需要保护的资产，或者是在未妥善保护的情况下损害你资产的因素。你的资产清单（参见\
  \ 12.1）可以给你一个起点。\n\n然而，还有更多点需要考虑，包括你的业务需求和目标，以及利益方的需求或要求，这些员工、客户、供应商、合作伙伴、股东、监管机构和审计师。你还应该考虑你运营的业务环境和任何相关趋势——例如，如果竞争对手拥有强大的安全措施（并宣传这一点），你可能也应该这样做。相反，你可能希望将对安全的积极态度作为脱颖出的手段。\n\
  \n\n\n我们将在八步法的第 1-3 步中详细讨论实施项目的背景和范围——扩展之，即信息安全策略的内容（参见第 18 章）。\n\n### 12.2.5 将策略纳入实施项目\n\
  \n由于本策略涵盖了整个信息安全项目，并考虑了法律、合同要求，因此在早期阶段制定信息安全策略（或策略）至关重要。\n\n然而，你应该将此过程视为一个迭代过程，特别是当组织规模较大或复杂时——例如在我们八步法中，我们将编写工作分散到多个步骤，并在最后阶段进行评审和修订。\n\
  \n### 12.3 物理与环境安全\n\n存放信息的资产物理环境应免受未经授权的人员、自然灾害以及当地威胁的侵害。\n\n**关键输出：** 一个清晰定义的边界，通过适当的物理和环境安全控制进行保护，以减少物理和环境威胁带来的风险。\n\
  \n信息安全不仅是为了保护免受来自互联网的攻击，还为了防止未经授权的人进入场所，他们可能会损害你的信息或系统——如果有人可以直接走进建筑并带走它们（参见第 9\
  \ 章），那么使用一系列技术控制将毫无意义。\n\n同样，你还需要保护免受影响信息完整性或可用性的环境威胁，例如自然灾害和火灾。物理威胁还可能是政治或社会因素，如动乱或犯罪。\n\
  \n关键或敏感的信息和系统应安置在安全区域，例如你的办公室。这些区域需要一个定义的边界，这应该是物理防御的重点：通过物理屏障、访问控制和其他措施防止入侵者进入。\n\
  \n然而，保持场所的安全还需要其他方面的考虑。你需要确保机密信息或活动从外面不可见或不可闻，无论是对于路人（参见第 12.3.3 章））、经过垃圾桶的人（参见第\
  \ 12.3.4 章）还是在共享办公室内（参见第 12.3.2 章）。\n\n当这些信息特别敏感或关键时，你可能希望使用多个屏障，这样即使一个屏障失效，也不一定构成安全违规（参见第\
  \ 12.1.8 章）。为了进一步降低风险，在可行的情况下，确保建筑不要明显地标识其用途，以至于难以猜测那里发生了什么信息处理活动。如果无法做到，你至少应该避免指示具体的活动，包括让任何内部目录不可公开。\n\
  \n### 12.3.1 定义安全边界\n\n从标识需要保护的区域（即你的信息和系统所在地，例如你的组织场所）的场地图或平面图开始是很好的。这样的计划可以告诉你已经配备了哪些物理屏障（墙、门等），你可以将其整合到安全边界中。为了可视化整个边界，在场地图的场所周围画一条线，使你需要保护的所有资产都在该区域内。\n\
  \n你还应该注意以下几点：\n\n- 确保你的外墙、屋顶和地板都是实心结构。特别是吊顶可能会引入多种威胁。\n\n- 在图上标记所有外部门窗（包括疏散出口），必要时使用适当的访问控制（参见第\
  \ 12.4.8 章）和其他措施（如窗户前的报警器和防盗窗）。更敏感区域（如服务器房）的内部入口应该受到同样的对待。\n\n- 确保你的物理边界没有未处理的缝隙——天窗、空调通风口和电梯井等物品都可能更容易被破入，因此要仔细评估其风险并采取适当措施。\n\
  \n与大多数安全控制一样，在实用性（在本例中为可访问性）与安全性之间取得平衡非常重要。这意味着例如，在单层控制就足够的情况下，不要使用多层控制，并为你的访问控制做出明智的选择。例如，在多人共享的区域使用传统的锁和钥匙并不方便，因为这需要发放许多钥匙，或者需要某些员工经常中断工作去开门。这还存在门被遗留在未锁状态或顶着开启的风险，从而违背了访问控制的目的。\n\
  \n还要记住，未经授权的人员不非都是入侵者：即使访客或员工获得了进入场所的授权，该授权可能仅限于某些区域。这些区域可能是由其中存储的信息决定的。这同样涉及设计考量：接待处等半公共区域应该容易从入口进入达，而持有机密信息（如法律、财务或人事数据）的办公室应该更深地嵌入你的安全区域内，从边界更难到达。你可能还希望通过部署第二个安全边界来主动区分半公共区域和私有区域。\n\
  \n### 12.3.2 第二个边界的考量\n\n接待处、面试室和仓库等半公共区域位于你的边界内，但所需的方法与服务器房或安全区域等不同。在保持可访问性的同时，为第二个边界提供足够的安全水平，请考虑访客日志、监控摄像头和类似的措施。\n\
  \n\n\n如果您的员工使用了共享办公空间，那么将其视为公共区域是明智的（因为您对谁可能进入那里的了解要少得多，而且对物理安全几乎没有或完全没有控制），因此应将其中使用的任何便携式设备、纸质文件等视为您边界之外的资产。这些内容将在\
  \ 12.3.5 中进行更详细的讨论。\n\n### 12.3.3 清空屏幕与清空桌面策略\n\n定义物理边界并确定您将如何保护它以防止未经授权的人员进入是一个非常好的开始，但其本身还不足以让您认为在物理上是安全的。信息泄露——即敏感信息在无意中被未经授权的人员获取（无论是入侵者还是未授权查看该信息的员工）——是另一种常见的物理威胁。\n\
  \n通过实施清空屏幕和清空桌面策略，可以显著降低这种风险。这两者的理念都是员工不要将敏感信息暴露在视范围内，但您确实需要一种明智且务实的方法来获得最佳效果：不使用时将敏感纸质文件放在可锁的抽屉或文件柜中；离开屏幕较长时间时锁定电脑；并在夜关闭电脑并从白板上擦除机密信息。更全面的策略还可能规定，在没有可锁柜子或抽屉的情况下，这些办公室在无人占用时需要锁定，并且应尽可能对纸质文档进行扫描，将原件要么安全地销毁，要么作为备份被锁起来。\n\
  \n尽管如此，当电脑正在使用且纸质文件遗留在桌子上，而外部人员（或来自相邻建筑的人员）使用良好的变焦镜头观察时，清空屏幕和清空桌面策略将无法保护您。您甚至可能在向授权的访客介绍环境或面对现场承包商时面临风险。在让他们进入大楼之前对其进行彻底审查将有所帮助，向全体员工发送邮件提醒他们应避免将敏感信息暴露在视内的时间也有所帮助。为了防止建筑外的人窥视，您可以在窗户上使用单向透视膜，或在电脑和笔记本电脑上使用隐私屏。\n\
  \n### 12.3.4 安全信息处置\n\n信息泄露的另一个主要原因是安全处置不当，例如，未能在此处置前安全地擦除硬盘或粉碎敏感纸质文件。即使像不收集打印件这样看似微不足道的事，也可能泄露限制信息，无论是向不应访问该数据的员工，还是向清洁工或维护小组等现场承包商。2019\
  \ 年的一份 Shred-it® 报告显示，65% 的受访者担心遗留打印件可能导致数据泄露，71% 的人曾在公共空间捡到或看到他们发现的机密或敏感文件[⁴⁵]。只有\
  \ 45% 的受访者在每个办公区域粉碎文档，46% 的对员工进行了安全处置的培训。\n\n根据您的需求，您可能会使用经过认证的第三方安全处置服务是有益的。这可能比内部粉碎更安全、方便，特别是当有大量纸质文件需要安全销毁时。出于相同的原因，外包也可能比内部粉碎更经济，特别是从长期来看。\n\
  \n然而，即使您定期使用经过认证的安全处置服务，也应该培训所有员工识别什么构成机密或敏感信息，意识到其价值，并理解他们需要采取额外步骤来保护此类信息，包括安全存储和处置。您还应该为\
  \ IT 人员制定明确的程序，以安全地丢弃任何 IT 设备，包括硬盘。这样，如果第三方端出现流程故障，您的信息仍然保持安全（这是深度防御的一个示例）。这也有助于防止机密文件进入普通垃圾桶，这些垃圾可能永远不会被处置服务收回并进行安全销毁。\n\
  \n最后，档案、储藏室和文件柜往往会因堆积的纸质文件而变得混乱。扫描纸质副本并销毁它们将有助于保持这些区域易于管理，但可能值得安排每几个月在处置服务提供商的帮助下清理办公室。这不仅有助于降低信息泄露的风险，还能让您在需要时更容易找到文件。处置时间应在您的数据保留政策中详细说明。\n\
  \n### 12.3.5 边界之外的资产\n\n灵活办公和便携设备的日益普及意味着边界之外的资产数量也在增加。无论是使用共享办公空间、在通勤期间或其他公共区域工作，还是允许居家办公，任何形式的灵活工作都引入了需要解决的安全担忧和挑战。\n\
  \n对于便携设备，存在明显的物理安全担忧：这些设备不仅容易丢失或被盗，而且往往含有大量机密或敏感数据。笔记本电脑可以使用安全锁进行物理锁定，并使用隐私屏进一步保护，以防止坐在旁边的人查看您的屏幕并可能看到机信息。\n\
  \n您可能还需要对所有便携设备——包括笔记本电脑、手机、平板电脑和可移动媒体——进行加密，以在它们丢失或被盗时防止数据外泄（参见 12.7）。然而，即使内容已加密，设备的丢失或被盗仍然意味着丢失其中的数据，如果没有进行备份，这可能是灾难性的。即使已经备份，恢复这些数据也需要时间和精力，因此从根本防止丢失或被盗要得多。通过培训提高员工的警惕性是一个好主意（参见\
  \ 12.11）。您还应该执行移动设备政策，对移动设备的使用明确要求：不要让设备无人看管（例如放在汽车后座），始终存放在安全位置（如酒店保险箱）等。\n\n您还应该在适当的策略明确是否允许员工携带或使用自己的设备。如果是，则需要专门的\
  \ BYOD 政策来减轻个人设备可能引入的风险，因为您的 IT 团队对这些设备的控制比公司提供的设备要少得多。BYOD 政策应明确设备的访问控制、数据如何下载和存储，以及在发生已知或怀疑泄露时的必要行动，包括设备丢失或被盗时。您也可以在员工培训中提出这些观点。\n\
  \n政策和培训还应涵盖如将纸质文件带回家等事项：员工应避免将机密文件带回家，但如果他们确实离开了办公室区域，应该将其放在不显示内容的信封中，或者更好放在锁好的箱子里，并且只在没有人能从你肩膀后看的地方取出来。机密对话也应同样对待：不要在公共区域进行。在使用共享办公空间时，应寻找私人房间，这些房间通常在同一建筑内提供。\n\
  \n### 12.3.6 云安全\n\n\n\n\n如果你使用了云服务，你应该将存储在云端的任何信息视为你边界之外的资产，因为存储信息的物理基础设施是由云服务提供商控制的。你极不太可能获得对该基础设施进行物理审计的权限。尽管如此，根据你可能承担的法律义务，进行一些尽职调查检查是非常重要的：例如，如果你在云中存储了\
  \ `PII`，那么在 `GDPR` 和 `CPRA` 下，云提供商将被视为“处理者”或“服务提供商”，而你则是相应的“控制者”或“业务方”。这意味着你的组织负责这些数据的安全，并且如果云提供商端发生泄露，你将承担责任。\n\
  \n你可以检查以下几点以获得对提供商物理基础设施安全性的保证。例如，许多提供商会公开其物理和运行安全控制措施及流程的细节。云提供商可能还获得了相关的认证，如 `ISO\
  \ 27001`，这表明云提供商外部的授权机构已独立验证了所实施的安全措施落实得当且符合用途。你还可以采取的其他预防措施包括仔细审查与云提供商签订的合同协议，以获得充分安全性的保障（[12.13.2]\
  \ 中详细讨论了第三方合同审查）。\n\n但根结底，值得记住云服务提供商在保持其基础设施安全方面有着切利益，特别是当你的合同规定了他们必须满足的安全要求时。这并不意味着你应该认为云安全是理所当然的，而是意识到云相关的泄露更有可能是由于客户错误导致的，例如未更改默认密码（参见\
  \ [12.6]）或使用不当的访问控制（参见 [12.4]），而不是由于服务提供商侧的基础薄弱。因此，采取完全由你控制的个人步骤和预防措施将大有裨益。\n\n\
  例如，一个相当常见的问题是到云服务的自动化备份未通过适当的访问控制进行妥保护（这对于 BYOD 用户来说是一个特别大的问题）。通过自动化工具，犯罪人员确实可以在互联网上搜索云端包含机密数据的此类文件并下载。你可以说门被敞开着，甚至不需要撬棍或破门槌就能到达背后的资产。（顺便提一下，如果这种情况发生在你身上，请务必将其视为数据泄露。）\n\
  \n### 12.3.7 环境安全\n\n遗憾的是，入侵者和其他人类威胁并不是信息安全的唯一物理危险，尽管它们是影响机密性的主要威胁。即使在建立并加固边界后，你的物理防御也可能被另一种物理危险绕过：环境威胁。无论是自然灾害还是人为灾害，都可能影响你的信息资产和处理活动的完整性，特别是可用性。\n\
  \n你应该准备应对何种环境威胁完全取决于你的所在地和你的业务。即使你的组织没有进行实验室或制造工作，你的风险评估（也参见 [12.12]）也应该考虑邻近的企业，因为他们可能会引入影响你和/或你员工的风险，例如如果他们是石油或制药公司，可能会吸引抗议者、破坏者、纵火犯等。同样，你的风险评估还应该考虑已知哪些自然灾害或极端天气会影响你所在的地区，它们发生的概率如何，以及你如何通过建立适当的防御（如灭火器、出口和防洪屏障）来做好准备。\n\
  \n然而，你只应该在既可行又具有成本效益的地方采取预防措施。遗憾的是，在一个气候变化日益明显的世界上，你无法为不可预见的极端天气状况或自然灾害做好准备。此外，你无法控制邻近企业的活动。因此，你应该假设最坏的情况，并计划在发生任何中断的情况下继续你的核心业务活动。\n\
  \n这意味着要制定超出保险范围的业务连续性计划——能够申请理赔会让你放心，这无疑是你应该做的的安排，但它无法帮助你继续提供服务和提供客户支持。即使网站只宕机几分钟，也可能导致客户和潜在客户流失，因此在灾难发生时准备好至少继续你的核心业务流程将是至关重要的。\n\
  \n应急计划在不同组织之间差异很大，可能包括成本较低的操作，例如将备份存储在云端、鼓励灵活办公以及将资产分散在多个建筑中。更全面的计划还将明确责任归属以及在人员缺席时谁负责、包含电话树、指定恢复时间目标并详细说明特定场景的逐步程序。\n\
  \n关于业务连续性的全面讨论，请参见 [14.3]。\n\n### 12.4 身份与访问控制\n\n确保尝试访问信息和信息系统（物理或逻辑上）的人员如其实，并且他们授权访问这些信息的措施。\n\
  \n**关键输出：** 有效的控制和策略，有助于验证用户身份、防止滥用特权权限并阻止未经授权的人员进入场所。\n\n由适当策略支持的身份和访问控制有助于组织验证身份并授权用户，并确保员工、承包商和系统只能访问他们被许可的信息。此类控制应涵盖身份识别、身份验证、授权和问责（IAAA）：\n\
  \n- **身份识别 (Identification)**：通过名称、用户名或 ID 编号等识别某人。\n- **身份验证 (Authentication)**：通过输入密码或\
  \ PIN 码等证明他们是他们所称的人。\n- **授权 (Authorisation)**：根据下述两个安全原则授予该人员访问系统和数据的权限。\n- **问责\
  \ (Accountability)**：追踪个人账户活动，并确保不可否认性——换句话说，就是能够证明哪些操作是由哪些账户执行的。\n\n关于授权，尽管通过给每个人所有访问权限来换便利可能很具吸引力，但这种方法会大幅且不必要地增加泄露的概率和严重性。为了降低风险，需要遵循两个关键安全原则：\n\
  \n1. “知情所需”原则：仅授予用户为了有效履行其角色所需的信息——例如，只有人力资源和财务人员需要访问 HR 和财务数据，且只有部分财务人员需要访问薪资信息。\n\
  \n2. 最小权限原则（也称为 `PoLP` 或“最小权限原则”）：仅授予用户为了有效履行其角色所需的权限——例如，普通用户不需要安装软件，但可能需要运行备份；或者，某些用户可能需要访问特定信息但不需要编辑权限。\n\
  \n\n\n\n\n这些原则同时适用于身份控制（验证用户/个人的身份）和访问控制（将该人员的访问权限限制在所需的最小范围之内）。这些控制还必须兼及对信息和信息系统的物理访问与逻辑访问。\n\
  \n对于物理访问，这可能意味着你实施一个读卡器，用于识别并验证卡持有者——这些持有者领发的卡片仅允许他们访问其所需的区域——系统会自动生成日志，记录进入场所的成功和失败尝试，并定期对日志进行审查，以发现异常或可疑的行为。\n\
  \n对于逻辑访问，这通常意味着每个人至少有一个独立的用户账户，可以通过令牌（如生物识别数据或密码，这仅列举了两种可能的控制措施）进行访问，且该账户仅允许他们访问所需的信息。\n\
  \n请记住，对于这两种类型的访问，都会有比其他人拥有权限的个人或用户，通常被称为管理员。这些人特别需要被唯一标识，并且在使用这些额外访问权限之前，必须满足更严苛的安全要求。这可能意味着，例如，必须通过两种不同的方式进行身份验证（另见\
  \ 12.4.2），或者有更强的密码要求。此外，确保拥有管理员账户的个人也拥有一个“普通”用户账户，并且他们仅在实际需要管理员权限时才使用其高权限账户。\n\n\
  将身份与访问挂钩的一个关键优势是，你可以知道谁可以访问哪些信息或基础设施。使用自动化访问日志将让你识别出谁实际上使用了该访问权限（问责制），以及任何可能意味着被攻破的异常行为（参见\
  \ 12.4.7）。这意味着每个账户应只关联一个用户，以便任何访问（或访问尝试）都能追溯到特定个人——可供多人使用的共享账户将使这项任务变得显著困难得多。\n\n\
  ### 12.4.1 安全原则与文档\n\n“知其所需”原则和“最小权限”原则都应被纳入清晰记录的程序中，用于创建新用户账户和定期审查授予的任何特殊访问权限。你还需要为在公司内部变更角色的人员制定一套记录程序，以确保他们的访问权限仍然适当，以及一套针对离职人员的程序，他们的访问权限和账户应被删除或禁用。此外，还要考虑远程访问机密信息和\
  \ BYOD（自带设备，如果适用）的影响。\n\n尽管有效的策略和程序应该执行这两项原则，但建立一种组织文化，让员工意识到不同的访问级别有不同的目的，也是一个好主意。以此延伸，你可以鼓励他们思考是否真的需要他们所能访问的所有信息，并在适当的情况下，主动发起请求以删除或撤销不必要的用户权限。\n\
  \n### 12.4.2 身份验证因素\n\n从根本上说，身份控制关乎能够验证一个人的身份；“身份验证因素”则是你执行此操作的属性。对于物理和逻辑控制，有三种可能的验证因素：\n\
  \n1. **“你所知道的”——** 例如密码、口令或 PIN 码。\n2. **“你拥有的”——** 例如手机（用于向 ⁴⁸ 发送一次性密码 (OTP)）或门卡。\n\
  3. **“你所是的”**** 例如指纹（用于生物识别访问控制）。\n\n在许多情况下，仅依赖这些类别中的一种（即依赖单因素身份验证）是足够的——再次，网络和信息安全关乎在风险与控制之间取得平衡。\n\
  \n然而，当你需要保护特别高价值或敏感的信息时（例如对密码管理器或财务信息的访问），实施第二种（双因素身份验证或 `2FA`）甚至可能的第三种（多因素身份验证或\
  \ `MFA`）验证因素是值得的。任何额外的因素都不应仅仅依赖第一个因素，而应与其不同，以优化安全性。但请确保不要过度使用验证因素，否则可能会变得昂贵且低效。\n\
  \n### 12.4.3 访问控制\n\n逻辑访问控制用于验证和授权用户访问信息系统，是最常见的访问控制类型；同样，Active Directory (`AD`)\
  \ 系统也非常常用。\n\n你可以依赖的逻辑控制有很多，包括防火墙（参见 12.5.5）和 12.9.3）、加密（参见 12.7）、网络分段（参见 12.9.2）以及网络访问控制方案（检查公司和个人设备的补丁级别等），但最常用且最被误用的控制措施是密码。\n\
  \n请注意，未来几年生物识别或硬件解决方案等替代验证方法可能会常态——比尔·盖茨早在 2004 年就宣布密码无法满足你真正想要安全的挑战⁴⁹]——但目前，密码仍然许多服务的默认验证方法。此外，`MFA`\
  \ 和密码管理器现在比十年前更常见，使得密码不仅是一种易实施且成本低的选择，而且可能是相当安全的——只要你在适当的区域（例如在线账户或访客 Wi-Fi）使用它们并实施有效的密码策略。\n\
  \n## 12.4.4 密码策略\n\n尽管近年来数据泄露的数量和规模已有更广泛的报道，但许多用户在使用自己的设备时仍然保持着糟糕的密码习惯——SplashData\
  \ 从 2014 年到 2019 年每年发布的常用破解密码列表中，“123456”连续六年位列首⁵⁰。\n\n2019 年，紧随其后的是“123456789”、“qwerty”、“password”和“1234567”。\n\
  \n网络安全领域无疑将继续努力让人们在家庭和工作更好的密码。与此同时，组织最好依靠一种有效的密码策略，在强密码与实际考虑之间取得平衡。\n\n执行密码策略并确保使用唯一强密码的最可靠方法是尽可能减少用户的负担，更多地依赖技术措施。第二个关键点是鼓励使用用户易于记忆但计算机或个人难以猜测的密码——换句话说，关注长度而非复杂度。正如\
  \ NCSC 指出的，如果你强制用户编写难以记忆的“复杂”密码，他们不可避免会产生其他糟糕的密码习惯，包括可预测的模式⁵¹。这些可能包括：\n\n• 将“o”替换为“0”，将“i”替换为“1”等；\n\
  • 在字典词末尾添加连续数字；\n• 重复字符；以及/或\n• 易的键盘模式（例如 `qwerty`）。\n\n\n\n\n用户往往倾向于选择较短的密码，这使其更容易被破解，并且会在不同的账户上使用相同（或非常相似）的密码，导致数据泄露的可能影响增加。如果他们在工作账户和个人账户使用相同的密码，风险会进一步增加。\n\
  \n另一种方法是简单规定最小长度，而不规定任何其他要求。这将鼓励使用诸如将三个或四个随机单词组合的技巧，例如‘shelfpictureswimming’或‘mixertablehorseliquid’（也称为“短语”）。只要选择的单词不是太明显（例如运动队或‘thisismyworkpassword’），这都是一种极其安全的密码创建方法——毕竟，每增加一个字母或字符，可能的组合数量就会呈指数级增长——同时也能帮助用户创建既易于记忆又难以计算机破解的优质密码。\n\
  \n此外，如 NCSC（国家网络安全中心）指出的，复杂性要求无法保护您的组织免受社会工程攻击或不安全的密码存储的影响——尽管如此，任何其他的密码要求（包括完全不要求）都会面临同样的问题。因此，考虑开展强制性的员工意识培训是值得的，培训应在入职时进行，并每年对所有员工重复一次（我们将在\
  \ 12.11 中深入讨论这一点）。\n\n### 12.4.5 保持密码安全\n\n设置强密码只是良好密码管理的元素之一——安全地存储密码同样重要。一个臭名昭著的例子是\
  \ TV5Monde：这家国际性的法国电视台在园区内拍摄片片时，背景中可以看到社交媒体的密码。[(52) （这种情况也发生过其他组织身上。）\n\n当然，这是一个相当极端的情况，但密码被写下来的这一简单事实本身就是糟糕的安全实践。您应该教员工不要在任何地方写下密码或将其保存在未加密的文档中，并且永远不要与任何人分享密码。此外，如果他们怀疑账户可能已被破解，要确保员工知道他们需要向\
  \ IT 部门报告事件并更改密码。\n\n上述仅是密码安全的基础。密码有许多其他泄露或被发现的方式，包括通过：\n\n- 窥视（被他人看到输入密码的过程）；\n\
  - 键盘记录器，拦截输入的任何密码；\n- 社会工程攻击（包括网络钓鱼和胁迫），试图诱骗用户透露密码；\n- 暴力破解攻击（通过自动化过程猜测密码直到找到正确的密码）；\n\
  - 攻击者尝试使用之前成功破解的密码（这针对重复使用密码的人，但如果员工倾向于使用常用密码，可能会成为一个问题）；以及\n- 在网络传输过程中拦截密码或密码哈希值。\n\
  \n需要记住的一个关键点是，攻击者并不需要高超的技术就能成功拦截或确定某人的密码，特别是现在网上可以轻松获得许多自动化工具。\n\n幸运的是，在保持密码安全方面，并非一切都依赖于用户的警惕——您的组织\
  \ IT 团队应该能够实施某些技术措施，或者至少对哪些第三方提供足够的安全性提供建议。为了保护静态密码（at rest），请确保它们以哈希（理想情况下是加盐的）格式存储，而绝不以明文形式存储。对于传输中的密码，确保\
  \ Web 应用在需要身份验证时使用 `HTTPS`。最后，确保访问管理系统本身得到妥妥的保护（您可能需要联系第三方供应商检查此项）。\n\n### 12.4.6\
  \ 密码管理器\n\n密码管理器（或密码库）可以解决工作和家里记忆大量复杂密码的问题，它们甚至可能具有为每个账户自动生成复杂、唯一密码的功能。这些功能可以生成极其强大且复杂的密码——人类可能无法记住那种密码——同时也从用户身上几乎几乎所有的密码负担，因为他们只需要为密码管理器本身设计并记忆一组难以猜测的登录凭据即可。\n\
  \n当然，这不是一个完美的解决方案，仅仅因为存在所有账户同时被攻破的可能。然而，对于基于主机的密码管理器，这种概率是*极其*小的，因为攻击者不仅需要您的主密码，还需要访问您的机器或设备权限。[(53)\
  \ 密码管理器天生就是为了安全而设计的，但作为额外的安全措施（为了保险），您可能想考虑第二个身份验证因子。这样一来，在您的主密码泄露的情况下，入侵者将无法访问您的明文密码。\n\
  \n记住，良好的安全性并不是为了做到不可侵入——而是为了降低和最小化风险。正如 NCSC 指出的，只要您部署得当，密码管理器就是一个良好、安全的选择。[(54)\
  \ 这意味着：\n\n- 仅使用可信赖的软件提供者；\n- 启用 `2FA`/`MFA`；以及\n- 确保（通过您的密码策略和技术控制）用户选择强主密码并保持安全。\n\
  \n### 12.4.7 密码的技术控制\n\n还有其他可以且应该使用的技术控制来强制或加强您的密码策略，从而总体提高您的安全性。\n\n#### 单点登录 (SSO)\n\
  \n您可以通过实施 `SSO` 来增强整体安全性，它允许员工在身份验证一次后访问所有或部分账户。其理念是，通过让用户登录更容易，如果他们不需要重复输入或记忆多个密码，他们可能会选择强密码。\n\
  \n然而，这带来了一些风险：如果用户的账户被破解，攻击者将访问其所有账户。为了降低这种风险，请限制通过 `SSO` 访问的账户，或考虑实施 `MFA`。\n\n\
  #### 密码过期\n\n\n\n\n\n定期更改密码可以防止在泄露未被发现的情况下被无限访问，但这远不是一个完美的解决方案。其一，重置密码无法告诉你是否已经发生了泄露，而且依赖定期的密码更改可能会让潜在攻击者对已受影响的账户获得数周甚至几个月的访问权限。此外，如果泄露是因为密码存储不安全导致的，攻击者很可能轻易地找到新密码（如果他们拥有对被破解账户的访问权限，他们可能会注意到密码过期通知）。\n\
  \n不仅如此，还存在用户遗忘的风险，这可能导致生产力下降，因为用户会经常联系帮助台，或者更糟糕，会导致密码被写下来。或者，他们可能于选择一个与旧密码相似的新密码。\n\
  \n出于上述原因，国家网络安全中心（NCSC）建议仅在已知或怀疑发生泄露时强制更改密码，尽管对于具有特权访问权的账户，定期更改密码可能具有价值。如果有人不再需要（或被允许）访问共享账户，您应该更改该账户的密码。\n\
  \n然而，在放弃所有账户的定期更改密码之前，你需要对自己识别可能泄露的能力充满信心。鼓励员工报告任何可疑活动无疑会有帮助，而快速禁用或删除不必要的账户可以从源上降低泄露的风险。但是，还有其他措施可以帮助检测和防止入侵，包括安全监控和账户锁定。\n\
  \n### 安全监控与账户锁定\n\n每次登录或登录尝试都应该在访问日志中生成一条记录，显示每次尝试登录的唯一标识符。通过定期检查访问日志，你可能能够准确定异常或可疑的行为。自动化工具可以协助这一过程，尽管仍需要人工干预来确定是否真的发生了安全违规。\n\
  \n可疑行为可能包括：\n\n-   在意外的时间或从意外的地理区域进行登录尝试；\n-   密码喷洒攻击（在大量账户上尝试同一个少量密码）；\n-   多因素身份验证（MFA）仅第一步成功的登录尝试；以及\n\
  -   大量的失败登录尝试（例如，在短时间内进行五到十次尝试）。\n\n对这些行为的自动响应应该是锁定账户或“节流”（逐渐增加连续登录尝试之间的等待时间），因为这可能是暴力攻击的迹象。但是，请记住，这可能仅仅是合法用户忘记了密码，所以确保有一种方法让合法用户恢复密码并解锁设备。\n\
  \n关于安全监控的深入讨论，请参见 [13.2]。\n\n### 12.4.8 物理访问控制\n\n虽然在网络安全背景下，逻辑访问控制（特别是密码）比物理控制更常用，但不要忘记后者也是重要的。正如\
  \ [12.3] 中讨论的，信息安全不仅关乎保护自己免受网络攻击，还涉及防止未经授权的人进入场所。这包括确保场所在办公时间之外锁好、对承包商进行适当审查、员工对现场的陌生人质质，以及防止尾随和搭乘。你可能还希望实施识别特定人员并可以记录的控制（即纳入身份控制）。\n\
  \n你可以使用多种控制措施来实现这一点——下面列出了其中几种方法，并说明了每种方法的某些风险。请注意，取决于该控制的具体实现方式，并非所有方法都适用。\n\n\
  #### 钥匙和锁\n\n一种简单但有效的访问控制方法。虽然这是一种相对原始的访问控制形式，但它仍然有效，在商业环境中，非常适用于私人办公室或少数人共享的办公室，以及文件柜和抽屉。\n\
  \n**风险：** 钥匙丢失、被盗或遗忘；忘记锁上门/柜子/抽屉；将钥匙留在锁中。\n\n#### 组合锁或密码键盘\n\n一种需要数字组合才能打开的机械（组合锁）或数字（密码键盘）锁。由于不需要发放物理钥匙，对于拥有许多授权用户的区域或柜子来说，这是一种更实用的访问控制。\n\
  \n**风险：** 有人监视数字组合（两者）或根据指纹/数字磨损推断出来（密码键盘）；忘记或写下代码（两者）；未能正确混合数字（组合锁）。\n\n#### 读卡器\n\
  \n一种通过访问卡或身份卡授予访问权限的设备。如果清晰可见（例如挂在员工脖子上），它的额外优点是可以判断某人是否有权在那里。这些卡可以与用户的访问权限关联，以便读卡器能够相应允许或拒绝访问。\n\
  \n**风险：** 卡丢失、被盗或遗忘；员工在建筑外佩戴身份卡。\n\n#### 生物识别访问控制点\n\n可以识别身体部位（如指纹、掌或眼睛）以授予访问权限或解锁某些设备的设备。它的优点不需要发放任何类型的物理钥匙，并降低了人们遗忘或（无意）共享任何代码的风险。还可以用于身份识别使用锁的特定人员。\n\
  \n**风险：** 个人数据风险（特别是由于生物数据在现代数据保护法下被视为敏感/特殊类别数据，需要额外的保护）；对所有人都不有效（例如，由于疤痕或皮肤状况）和/或可能产生卫生问题。\n\
  \n#### 安保人员和监控摄像头\n\n一名或多名维护物理边界的员工，可能通过查看实时监控画面。他们可能还负责检查和核实想要进入场所的人员的凭证。安装监控摄像头也可以作为预防和/或取证措施，但请记住你可能需要张贴公共监控告示以履行你的数据保护义务。\n\
  \n**风险：** 人为错误；摄像头被遮住或故障；记录被覆盖；未履行数据保护义务或摄像头采集了过量数据（例如路人的脸）。\n\n#### 人员通道/气闸\n\n\
  一个带有两扇门的小空间，人们必须通过它进入安全区域（特别是高安全区域）。第一扇门完全关闭后第二扇门才能打开，通过第二扇门可能需要第二组凭据。用于防止尾随，并可用于检查人的重量以确保没有带入或带出设备，或拦截入侵者。\n\
  \n**风险：** 某人被困其中；生产力降低。\n\n每种控制措施都有其自身的优点和缺点（以及自身的风险），因此你极可能需要使用这些措施的组合来有效覆盖业务的不同区域。例如，上述非详尽列表包含了在可扩展性、成本、安全水平以及钥匙或卡片管理要求方面有所不同的控制措施（其中许多措施之间存在正相关或负相关关系）。\n\
  \n### 12.5 恶意软件保护\n\n保护你的计算机系统和信息免受各种恶意软件的措施。\n\n**关键输出：** 技术和组织措施，包括反恶意软件和反恶意软件策略，这些措施可以保护你的组织免受恶意软件的侵害。\n\
  \n\n\n\n\n恶意软件是最常见的技术威胁之一，可能会造成巨大的损害；例如，全球铝供应商 Norsk Hydro 曾遭受勒索软件攻击，估计损失了 5.5 亿至\
  \ 6.5 亿挪克（约 4600 万至 5500 万英镑或 5900 万美元）。幸运的是，相当基础的控制措施足以缓解大多数恶意软件攻击，而管理所有数据的导入和导出——换句话说，在您的网络边界扫描所有数据——是防止恶意软件侵入的关键。\n\
  \n我们将在下文中讨论多种防御方案。关于恶意软件类型的详细讨论，请参阅 7.2。\n\n### 12.5.1 反恶意软件策略\n\n良好的起点是反恶意软件策略，该策略应明确贵组织保护自身免受恶意软件侵害的立场，并制定规则，例如遵守软件许可协议、禁止使用未经授权的软件以及如何处理可移动介质。策略还可以将违反某些规则规定为纪律违规。\n\
  \n策略的具体内容取决于贵组织的情况和需求。因此，最好在风险评估的基础上起草，或者根据后期进行的评估结果进行调整。您还应该定期审查该策略，以考虑最新的技术建议，例如由\
  \ NCSC、NIST 或 Virus Bulletin 发布的建议（更多关于威胁和漏洞情报的信息，请参阅 13.1）。\n\n还要记住，许多病毒和其他恶意软件是意外引入的。这可能是因为员工插入了已经感染的\
  \ USB 闪盘（而他们对此并不知），或者错误地点击了恶意链接或下载了恶意文件。一个通过技术控制和员工培训执行的强大反恶意软件策略可以防止许多此类事件。\n\n\
  ### 12.5.2 提高意识\n\n尽管技术控制在阻止恶意软件进入网络方面起着至关重要的作用，但员工的意识同样关键，这从意识到安全是每个人的责任，到了解如何帮助防止恶意软件感染的发生。如前所述，许多感染是由于员工行为导致的意外结果。培训和意识培养有助于员工识别威胁并采取适当行动，并让他们意识到自己在保护组织方面所扮演的角色。\n\
  \n您的培训可以涵盖以下主题：\n\n-   恶意软件的风险；\n-   不同类型的恶意软件及其特征；\n-   如何预防——并识别恶意软件感染；\n-   如果认为自己可能点击了恶意链接或安装了恶意软件该怎么办；以及\n\
  -   恶意软件感染可能产生的影响（财务或其他方面），包括真实案例。\n\n我们将在 12.11 中深入深入讨论员工意识和培训。\n\n### 12.5.3 杀病毒和反恶意软件软件\n\
  \n杀病毒和反恶意软件软件是最常见的反恶意软件措施之一，通常免费包含在流行的操作系统中，包括 Windows (`Defender`) 和 macOS (`XProtect`)，这支持英国政府鼓励的“设计安全”方法（另请参阅\
  \ 12.8）。只需启用它们就能让您的安全性显著提高，但您需要保持它们更新，以确保它们对最新威胁依然有效（关于补丁管理的更多信息请参阅 12.5.9 和 12.6）。\n\
  \n除了启用并保持您的反恶意软件更新外，您还必须运行定期的全盘扫描。这些扫描可以设置为自动运行，例如每天或每周的某个时间，但您也可以在访问时进行，例如在插入 USB\
  \ 闪盘等可移动介质时，或下载邮件附件时——换句话说，在恶意软件可能进入您的网络节点进行。\n\n尽管许多免费的反恶意软件措施对大多数用户已经足够，特别是对于网络安全初学者，或者当与白名单等技术结合时，随着您的网络增长和网络安全成熟度的提高，您可能希望研究企业级反恶意软件方案（当然取决于您的需求）。企业解决方案在发生感染时提供更好的支持，并且通常能够应对业务环境和复杂网络特有的威胁。较大的软件包还将包含其他网络控制，以支持网络隔离、边界保护等。\n\
  \n### 12.5.4 移动反恶意软件软件\n\n虽然知名度不高，但智能手机和平板电脑也有杀病毒和反恶意软件解决方案。考虑公司设备作为恶意软件目标有多大的吸引力——它们通常存储或可以访问大量的机密或敏感信息，但通常缺乏计算机固具备的安全性。\n\
  \n风险管理是关键：如果员工的移动设备可以访问特别有价值或大量信息，那么安装和维护某种反恶意软件软件可能是值得的。如果它们无法访问或存储此类信息，仅允许用户从官方应用商店下载可能已经足够降低移动恶意软件的风险（因为用户将受益于这些商店对其列出的应用所进行的安全检查，而且如果应用在通过初始检查后在以后证明具有潜在危害，应用商店可以从用户设备中删除它们）。\n\
  \n通过也对应用进行白名单可以进一步降低风险——换句话说，只允许安装某些经过批准的应用（在 12.5.6 中详细讨论）。由于代码签名现在现代设备上已很常见，它可以确认开发者的身份并确认代码未被更改或篡改，因此您可以相当可靠地执行白名单。通过鼓励或防止用户连接公共或不可信的\
  \ Wi-Fi，转而使用移动数据，也将有助于降低恶意软件感染的风险。\n\n当然，结合这四种措施——移动反恶意软件软件、仅从官方应用商店下载、应用白名单以及不连接不可信\
  \ Wi-Fi——是最安全的选择，但需要更多资源并可能给用户带来不便。最终，您必须决定风险有多大，以及哪些控制措施足以将风险降低到可接受的水平。\n\n###\
  \ 12.5.5 防火墙\n\n防火墙通过仅允许授权流量通过为试图穿越边界的流量提供屏障——这需要将默认防火规则设置为“拒绝”，并对授权的协议、端口和应用程序实施白名单。有效来说，防火墙作为保护边界的过滤器，主机防火墙在使用公共或不可信的\
  \ Wi-Fi 网络时尤为重要。它们通常是希望保护网络边界组织的首选，因为系统将受到针对潜在恶意流量的更好保护。\n\n类似于反恶意软件或杀病毒软件，现在操作系统作为标准提供防火墙服务（包括\
  \ Windows 防火墙），因此只需启用它可能就已经满足您的需求。如果您需要更复杂的方法，市面上还有许多其他防火墙，但确保您的反恶意软件能与该防火墙协同工作是非常重要的。\n\
  \n防火将在 12.9 中进行深入讨论。\n\n### 12.5.6 白名单\n\n\n\n\n\n白名单（Whitelisting）涉及在设备上创建一个允许的应用程序列表，并阻止任何未出现在列表上的应用程序（或特定应用程序内的进程）运行。从本质讲，它将一切内容视为潜在威胁，以防止用户安装和运行未经授权且可能被感染的应用程序。\n\
  \n这是一项有用的技术，特别是与反病毒软件结合使用时，它可以降低软件未能检测某些恶意软件的风险，并且适用于计算机和移动设备（参见 12.5.3 和 12.5.4）。然而，如果限制过于严格，可能会增加管理员的工作量；或者如果部署不当，则会影响用户生产力，因此在易用性和安全性之间取得平衡至关重要。\n\
  \n白名单的另一个优点是它需要的维护工作比软件要少得多，因为它并不过度依赖于跟踪最新的威胁。然而，白名单可能仍需要定期审查，或者在用户请求许可下载或运行不在白名单上的软件时进行审查。\n\
  \n你可以根据几项内容建立白名单，包括可执行文件的名称或路径、数字签名、文件或加密哈希以及正则表达式（regex）匹配。编译白名单的进程也有多种选项。对于规模较小的组织，编译自己的白名单可能是行的，但你也可以考虑白名单服务和软件。这些服务已经设置了已知良好的可执行文件和域列表，你可以根据自己的需求进行定制。此外，将反病毒软件、防火墙和应用程序白名单作为捆包提供也变得越来越常见。\n\
  \n当然，白名单对所有人来说可能并不是方便的解决方案。例如，它可能会让 IT 部门负担过，或者你可能只想允许特定用户下载某些软件。对于后者，允许管理员定义某些异常情况的白名单软件（允许特定用户在指定时间执行某些应用程序）可能是一个很好的解决方案。\n\
  \n### 12.5.7 灰名单与黑名单\n\n对于电子邮件，灰名单（greylisting）可能是白名单的一种良好替代方案，因为垃圾邮件检测器可能会误过滤掉合法邮件。通过对邮件部署灰名单，你可以临时拒绝来自未知或可疑发送者的邮件。其原理是，合法的发送者稍后会尝试，而垃圾邮件发送者倾向于批量发送邮件，因此不会重试已经拒绝过他们的地址。\n\
  \n为了防止用户访问恶意网站，白名单是不可行的，因为几乎无法预测用户在日常业务中可能需要哪些网站。安全浏览的更佳解决方案是部署黑名单（blacklisting），以阻止访问已知的恶意网站或具有某些特征的网站（例如证书过期或包含某些关键词的网站）。尽管这种黑名单永远无法完全安全（因为恶意网站的数量不断增加），但它可以显著降低由于误操作或其他原因点击错误网站并导致下载恶意软件的风险。\n\
  \n你还可以设置黑名单，为即将进入未知（因此可能存在恶意）域名的用户提供弹出警告。然后你可以强制他们返回之前的页面，或让他们确认是否要继续进入该未知页面。\n\n\
  ### 12.5.8 沙箱\n\n沙箱（Sandboxing）涉及在隔离环境中运行应用程序，限制其对你其余网络和设备的访问。其原理是沙箱可以防止此类情况：例如包含恶意软件（无论已知未知）的\
  \ USB 盘插入某人的电脑并感染你网络的其他部分。某些浏览器和类似软件集成了简单的沙箱功能来保护用户浏览；在依赖该功能之前，你应该确认你选择的应用程序支持此功能。\n\
  \n更传统的沙箱本质上是小型、隔离的网络，并可能仅存在于虚拟机上。它们通常在操作系统、软件和应用程序方面模拟“普通”网络，使管理员能够观察某个软件或可疑恶意软件如何影响已知环境。在实际操作中，这可能涉及在任何移动介质插入某人的电脑之前对其内容进行扫描。\n\
  \n为了进一步帮助防止 USB 感染的发生，你可以：\n\n- 鼓励员工通过电子邮件、安全文件共享服务和云端共享文件，而不是移动介质；\n- 提供公司发放的、员工可在组织内`only`使用的移动介质；\n\
  - 限制物理端口的访问。\n\n### 12.5.9 保持系统更新\n\n制造商和开发者通常发布定期更新，这不仅改进你的 IT 设备或软件，还能修复已知漏洞，因为这些是恶意软件通常尝试利用的，也是犯罪黑客的天然目标。运行旧版本软件——或不再支持的软件的系统是许多安全漏洞的常见因素，因此在更新可用后尽快安装供应商更新对于缩短已知漏洞被利用的时间至关重要。\n\
  \n补丁管理将在 12.6 中进行更深入的讨论。\n\n### 12.5.10 安全备份\n\n定期备份是最基础、最古老的网络安全控制措施之一，但特别重要。一旦恶意软件突破你的防御并感染你的系统，手头有备份意味着例如，勒索软件无法有效强制你支付赎金。（当然，恢复这些数据的实际过程可能非常耗时，因此通过其他措施防止攻击的发生要好得多。）基于类似的逻辑，你可能还需要从经过加固的良好镜像（参见\
  \ 12.6.1）重建受感染的机器。\n\n尽管如此，某些勒索软件变体也可能删除或感染你的备份（例如 `Zenis ransomware`，它甚至在删除备份之前对其进行覆盖以确保你绝对无法恢复数据\
  \ 62），所以请确保备份服务本身受到反病毒软件等措施的充分保护。还要记住，恶意软件在触发之前可能会处于潜伏状态，因此考虑你需要多频繁地运行备份以及保留多久。这完全取决于信息对你有多么重要；例如，如果你依赖于不断输入的数据，你可能至少需要每日备份，且可能不需要保留超过一周。\n\
  \n你还应该考虑如何存储备份。你应该根据 12.4 中讨论的两个安全原则——“知其所需”和“最小权限”来限制访问。由于你想尽量减少任何账户泄露可能导致你的备份被污染、甚至疏忽员工不小心删除它们的风险，请通过实施适当的逻辑和物理访问控制确保只有可能需要恢复备份数据的用户才能访问它们。\n\
  \n\n\n\n\n最后需要记住的一点是，你可能保留了一些纸质数据，这些数据也可以被毁，尽管不是由于勒索软件攻击，而是火灾或洪水（或其他原因）导致。例如，你可以制定一项政策，保留重要文档的数字副本或在不同的站点保留副本，但最佳方法将因组织而异，取决于文件数量和重要性。关键点在于不要忽视纸质数据，并确保你对其进行了安全保护和备份。\n\
  \n### 12.6 配置与补丁管理\n\n确保软件和 IT 设备已经过安全配置并保持更新，且在不再支持时予以退役。\n\n**关键输出：** 一种系统性的流程，通过安全配置和补丁最大限度地减少影响硬件和软件的漏洞。\n\
  \nIT 设备和软件的默认配置通常为了最大程度的便利性而尽可能保持开放，但这也为未经授权的用户提供了更多访问点，增加了你组织的攻击面（漏洞总和）。因此，对系统进行“加固”是一个好主意，这包括禁用或移除任何不必要的功能，并更改默认密码（关于密码和其他访问控制的深入讨论，请参阅\
  \ 12.4），以减少你的攻击面，从而减少安全漏洞的风险。对于面向网络的设备，应当关闭未使用的端口。\n\n然而，仅仅安全地设置和配置你的设备和软件是不够的——定期对它们进行更新和打补丁至少同样重要。运行旧版本软件的系统或不再受开发者支持的软件是导致许多安全事件的常见因素。根据《2020\
  \ 年弹弹网络安全行业报告》，50% 的关键或高级风险源于过时、未打补丁或不支持的组件。⁶³\n\n过时的软件通常存在后续版本已解决的许多漏洞。虽然普通用户可能不会意识到这些漏洞，但信息灵明的攻击者往往会尝试从漏洞信息发布到修复措施实施的时间窗口内利用这一点（零日攻击）。通常情况下，漏洞最可能被利用的有三个时间窗口：\n\
  \n1. 在你安全地配置设备/软件或识别出漏洞之前。\n2. 在供应商发布补丁之前。\n3. 在每台机器都安装该补丁之前。\n\n一旦新漏洞的细节泄露，几小时内就可能出现利用它的手段（如恶意软件）。由于时间紧迫，拥有一个理想的自动化流程，在供应商发布补丁后立即可靠地更新你的系统至关重要（在\
  \ 12.6.3 中进一步讨论）。\n\n如果供应商完全停止提供支持，你应该更换或退役该设备/软件。如果你正在寻找替代品，务必检查供应商打算支持它多久。毕竟，稍旧的版本可能看起来更便宜，但如果你在一年后需要寻找另一个替代品，这可能被证明是虚假的经济效益——如果你继续使用它并因此遭受安全漏洞，代价会更高。\n\
  \n2017 年的 WannaCry 攻击就是一个特别好的例子：该恶意软件针对 `Windows` 中的一个漏洞，该漏洞已经有了可用补丁，但并不适用于 `Windows`\
  \ 的旧版本（如 `XP`，其支持已于 2014 年停止）。`Windows XP` 用户，包括英国国家医疗服务体系（NHS）的部分，是 WannaCry 影响的群体，这次攻击最终\
  \ NHS 一方就损失了 9200 万英镑（约 1.18 万美元）。⁶⁴ WannaCry 也是恶意软件传播速度之快的良好例子：具体数字因报告而异，但可以确定在一天内数十万台计算机被感染。（WannaCry\
  \ 案例研究在 8.4 中有详细讨论。）\n\n### 12.6.1 安全配置\n\n糟糕的系统配置可能允许外部攻击者，或者未经授权的内部用户访问他们不该访问的信息或功能，例如，标准用户账户在实践中可能拥有特权。并非所有漏洞本身都是“危险”的，但它们可能会给攻击者提供有关软件版本号或正在使用的系统的关键信息，这可能告诉他们应该尝试利用哪些漏洞，或帮助他们准备更复杂的攻击。\n\
  \n加固系统涉及例如，禁用或移除任何你不需要的功能、账户等，例如作为安装标准部分的默认访客账户。你可以通过在操作指南中详细说明安全配置程序，并在事件日志中记录系统配置更改来确保此点（参阅\
  \ 12.4.7）。\n\n你还可以利用“镜像”来简化工作，镜是设备设置和软件的完整快照，通常存储为“黄金”镜像或“主”镜像，以便具有相似需求的设备可以设置为相同的安全标准。这些“模板”让你的\
  \ IT 部门能够快速设置设备，而无需记住禁用功能、移除账户等的相同步骤，之后他们可以根据用户的特定需求进行更改。镜像还可以帮助监控设备的整体配置，而不会在检查单个软件或硬件元素的设置时迷失方向。\n\
  \n你还应该作为变更管理流程的一部分，定期审查现有的系统和软件——需求随时间推移而变化，当某个软件不再需要时，你应该将其移除。这样做减少了访问点和潜在的“后门”，有助于缓解安全漏洞的风险（无论是无意的还是故）。同样，通过预判何时需要进行哪些更改，你还可以避免由于时间压力导致的服务不可用。\n\
  \n最后，确保实施适当访问控制，更改默认密码，并仅根据“知其所需”和“最小权限”原则授予访问——安全配置和访问控制是相辅相成的（关于访问控制的完整讨论请参阅 [12.4](#Chapter_12.xhtml#sec12-4））。然而，请记住，过度限制会阻碍用户工作并增加帮助热线的的负担，因此务必在安全性和易用性之间取得平衡。\n\
  \n### 12.6.2 补丁\n\n当然，从开始进行安全配置只是保持系统安全的要素之一——另一个是定期更新和打补丁。这是一个可以自动化的过程，以减轻 IT 的负担。\n\
  \n补丁通常包含一组更改，这些更改：\n\n• 软件首次发布时未识别的漏洞，或由于其他补丁以及系统与应用程序之间的交互引入的漏洞；\n• 修复软件错误；以及/或\n\
  • 通常提高软件的功能或性能。\n\n补丁的想法是能够高效地对软件进行相对微小的更改，而无需修改源代码或重新组装程序。从安全角度来看，“高效”这一部分至关重要——我们已经讨论过新发现的漏洞被利用的速度有多快，因此快速创建并安装合适的补丁可以降低这种风险。\n\
  \n\n\n\n尽管如此，仍有一些负面因素需要考虑。由于开发人员通常面临着尽快发布补丁的巨大压力，特别是那些旨在解决安全问题的补丁，因此存在补丁引入意外副作用或未能充分缓解漏洞的风险。\n\
  \n为了管理这些风险，首先在沙箱环境中测试补丁是明智的（另参见 12.5.8）。这样，在整个整个范围内安装补丁之前，你可以检查是否存在任何意外影响，例如系统变慢或易用性变化。阅读补丁说明（其中应详细说明补丁的功能）通常也能在部署前发现潜在问题。如果补丁的负面影响超过了其益处，你可以选择不应用或延迟安装该补丁。然而，这一决定需要由不仅了解风险，而且对应用程序及其用途有充分理解的人来做出，并且你需要准备好采取替代措施来降低风险——例如临时禁用该软件。\n\
  \n如果你在安装补丁之前无法对其进行充分测试（例如，由于缺乏资源），你可以考虑推迟补丁，直到其他用户报告他们的使用体验。但是，这必须与不及时补丁的风险进行权衡。\n\
  \n无论你采取什么种方法，都要确保其明确列在补丁策略中。该策略应说明贵组织处理补丁的方法，明确不会使用任何不受支持的软件（或列出例外）、如何评估补丁（如果有的话）、已批准补丁的应用的截止日期（这可能根据软件类型而异）等。作为正式信息安全管理计划一部分策略和程序将在\
  \ 15.1 中进行更详细的讨论。\n\n### 12.6.3 资产与漏洞管理\n\n早些时候，我们提到需要一种流程来响应供应商发布补丁并可靠地更新你的系统——将软件设置为自动更新可以在很大程度上实现这一目标。然而，你还需要一种方法来确保没有遗漏任何软件。为此，拥有一最新的硬件和软件资产清单（另参见\
  \ 12.1）是一个前提条件——这就是为什么补丁管理软件通常也兼具资产管理工具的功能。出于漏洞管理的目的，你的资产清单至少应详细列出：\n\n• 供应商名称和联系方式；\n\
  • 版本号；\n• 补丁状态和机制；\n• 位置；以及\n• 资产所有者。\n\n补丁和漏洞管理对资产清单的必要性是双方面的。首先，了解哪些硬件和软件已授权将帮助你识别任何未经授权的项目（你可以部署工具来自动化或部分自动化此过程）。其次，你的资产数字列表可以与漏洞数据库关联，这将帮助你及时接收有关技术漏洞的全面信息，并允许你进行漏洞扫描以验证你的补丁情况。\n\
  \n### 12.6.4 验证你的配置与补丁\n\n验证你的配置和补丁都是重要的，这可以通过定期运行自动化漏洞扫描来实现，并可能辅以渗透测试。作为额外的预防措施，资产所有者还应该定期检查供应商通知以及供应商在其网站上提供的补丁列表（或委托该项责任），以确保所有补丁都已正确安装，特别是当他们注意到异常行为时。\n\
  \n漏洞扫描和渗透测试分别在 13.1.2 和 13.1.3 中进行了更详细的讨论。\n\n### 12.7 加密\n\n加密解决方案（包括加密、伪标识化和匿名化）在必要时部署，以降低静态存储和传输中信息的风险。加密和解密密钥保持安全。\n\
  \n**关键输出：** 一项加密策略，明确何时使用加密以及如何保护密钥，以及执行该策略的适当技术措施。\n\n加密作为密码学的常用形式，是保护静态存储、传输或两者中机密信息的手段。其思想是使用数学函数通过秘密值或“密钥”对你的数据进行编码，确保只有持有解密密钥的授权用户和应用程序才能查看该信息，从而保护其机性和完整性。加密解决方案广泛可用，有很多负担得起的选项，但并不是“万灵药”解决方案。\n\
  \n例如，网站可能会与浏览器提供加密连接，通过使用 `HTTPS`（相对于 `HTTP`）并持有有效的 `SSL` 证书，在发生拦截时保护机密性和完整性。显然，这是一件好事，员工应该接受培训以注意这一点（参见\
  \ 12.11）。然而，你还应该让员工意识到，攻击者可能会伪造整个地址栏（包括指示正在使用 `HTTPS` 的锁头图标），并且没有什么能阻止恶意者获取 `SSL`\
  \ 证书并向其自己的网站提供加密连接。换句话说，在这种情况下，加密并不自动意味着该网站实际上是安全的，但它仍然是你应该关注的，因为你任何想要信任信息的网站都应该使用\
  \ `HTTPS`（更多关于通信安全的信息，请参见 12.9）。\n\n另一个例子是，加密便携设备是你绝对应该做的，因为当设备丢失或被盗时它将保护数据。换句话说，它将保护这些数据的机性和完整性。尽管如此，丢失设备仍然等同于数据丢失，会影响其可用性，如果这些数据没有备份，将是灾难性的（即使备份了，恢复也需要时间和精力）。再次，加密是一项应该部署的好措施，但它只能保护信息的机性和完整性——不能保护其可用性，这意味着你需要实施进一步的措施来保护该方面的安全性并开发更具韧性的策略，例如采取备份。\n\
  \n简而言之，加密是一项有价值的安全措施，应该被考虑并在某种程度上部署，但应与其他安全措施（包括员工培训，参见 12.11 和备份）结合使用。加密也不是保护你数据的唯一有效方案——取决于上下文，伪标识化和匿名化可能是良好的替代方案。\n\
  \n如果你部署了加密，还应该考虑在生命周期的哪些阶段对信息进行加密，以及你将如何保护你的加密和解密密钥。\n\n#### 12.7.1 决定是否以及何时使用加密\n\
  \n通常来说，加密应在两种主要场景考虑：信息存储（静态）和信息传输（传输中）。在这两种情况下，它都可以防止未经授权的访问和修改，但需要正确部署和使用才能生效（即使如此也并非万无一失）。\n\
  \n\n\n\n重要的是，解密信息所需的密钥必须保持保密，否则加密将无于形。同样，如果丢失密钥，信息的可用性就会受到损害，导致即使是授权人员也无法访问。随着计算机性能的增强，密钥也可能被破解，因此应对对算法和密钥进行定期审查，并在必要时进行更新。查看诸如\
  \ `NIST` 等机构对特定加密标准的看法——例如哪些标准被认为是安全的，哪些标准在某些应用中引起担忧，哪些标准被认为已经过时——通常是一个很好的切入点。\n\
  \n例如，数据加密标准（`DES`）开发于 20 世纪 70 年代初，并于 2005 年退役。尽管早期因密钥长度较短而受到批评（这也是它最终被退役的原因——由于如今的计算能力，它对于大多数应用程序已不再安全），但\
  \ `DES` 在推动现代密码学方面具有巨大影响，`3DES` 就是其继任者之一。相应，`NIST` 在 2017 年限制了 `3DES` 的使用，对单个密钥包加密的数据量设定了上限，因为它对于更大数量已不再被认为是安全的。\n\
  \n在考虑是否使用加密时，请记住，大多数处理活动都需要在通信的任端或处理活动“活跃”时信息处于未加密状态，因此加密可能并不是所有活动的合适保护措施。\n\n你是否应该部署加密取决于几个因素：\n\
  \n*   信息被未经授权的人员访问/或修改的可能性有多大？\n*   如果信息发生泄露，对你的组织以及（如果适用）相关信息的个人所造成的后果有多严重？换句话说，信息的敏感性或机密性如何？\n\
  *   是否有法律或合同要求对数据进行加密？\n\n至于泄露的可能性，便携式设备和移动媒体相对容易丢失或被盗；此外，便携式设备可能会连接到不安全的/公共 Wi-Fi。移动媒体，特别是便携式设备，还可能可能可以访问业务关键信息。因此，未经授权访问或修改的风险很高，除了对其进行密码保护外，对存储在其中的信息进行加密是明智的。\n\
  \n另外两个示例是通过电子邮件发送敏感信息或将其存储在云端。无论何种情况，任何泄露的影响都可能是巨大的，而加密可以是缓解该风险的良好解决方案。在云端的情况下，最好在将数据传输到云端之前对其加密；然而，你可能不需要加密每封邮件——只需加密那些包含敏感或机密信息的邮件。为了帮助员工决定何时部署加密，一项专门政策可能会有所帮助，你可以在其中规定以下要点：\n\
  \n*   对机密或敏感信息加密（如 `PII`），或通过电子邮件以外的受保护/加密的服务发送信息，这可能包括：\n    ![image](img/cir.jpg)使用加密和/或受访问控制的专用系统进行信息传输；\n\
  \    ![image](img/cir.jpg)在将信息附加到邮件之前对其进行加密；或\n    ![image](img/cir.jpg)使用另一个专用的电子邮件账户（而非用户的普通邮箱）发送该数据。\n\
  *   始终对笔记本电脑、移动设备和移动媒体上的数据进行加密，并尽可能对设备进行密码保护；以及\n*   始终对身份验证凭据（如密码）和其他身份验证信息进行静态存储和传输中的加密。包括你的\
  \ IT 团队在内的任何人都不应以明文形式访问密码等。\n\n加密还可以用于验证某人的身份，例如在发送电子邮件时。数字签名作为密码学的另一种形式，可以验证电子邮件的真实性并保护其内容，确保收件人内容未被篡改，且发送者是真实的。它们也可以作为任何其他电子传输信息（如电子支付）的合适解决方案。使用数字签名可以确保发送者和收件人都能确认内容未被篡改。\n\
  \n无论你倾向于哪种解决方案，明确你的用途都是重要的：例如，你想保护机器、通信还是云端？你是试图保护静态数据、传输数据还是两者？每个目的可能都需要不同的解决方案。对于保护通信，你可能需要查看\
  \ `HTTPS` 和电子邮件加密。对于保护笔记本电脑，你应该考虑硬盘加密。\n\n### 12.7.2 去标识化与匿名化\n\n对于 `PII`——可能直接或间接识别特定个人的数据——匿名化和去标识化可以是加密的良好替代方案，特别是对于通常需要明文形式（而非加密形式）的处理活动。它们的方法相似，但有一个关键区别：去标识化数据可以重新识别，而匿名化数据不能。\n\
  \n去标识化意味着你以不识别特定个人的方式处理数据，但通过将数据与单独安全存储的信息相结合可以重新识别这些个人。因此，在存储该独立信息时可能仍涉及加密，而其余信息可以根据组织的要求进行处理。\n\
  \n匿名化意味着你移除识别数据或对其进行更改，使其无法识别与其相关的个人。但在实践中，完全的匿名化通常是不可能的，因此如果你的流程使得目标受众至少无法重新识别、且其他人不太可能重新识别所涉及个人，那么它通常被认为是匿名化的一种形式。根据你所在的地区，重新识别或尝试重新识别匿名化数据也可能是犯罪行为。\n\
  \n你可以使用多种技术对数据进行匿名化，包括：\n\n*   删除或其他销毁可能识别主体的数据；\n*   对数据进行近似处理，使数据主体无法再识别（例如，将出生日期简化为年份，或将地址简化为仅县份，这使得数据仍然适用于研究目的）；\n\
  *   仅显示某些数据的总和而非单个项目。\n\n\n\n\n\n去标识化（pseudonymisation）与匿名化（anonymisation）之间的区别在于特定个人是否仍然（旨在）可能被重新识别，这在法律上至关重要：因为个人数据特指能够识别或可用于识别特定个人的数据，而经过适当匿名化的数据不属于个人数据，从而免受\
  \ `EU GDPR` 等数据保护法律的约束。然而，确保几乎无法重新识别主体是十分重要的。\n\n关于应使用何种技术的决策应在流程生命周期的早期做出。这不仅可以降低早期的风险（例如，如果数据尚未进行匿名化或去标识化），还有助于执行\
  \ 12.8 中讨论的“设计隐私和默认隐私”以及“设计安全”原则。\n\n对于研究目的（无论是科学研究还是市场调研背景），匿名化通常是一个很好的选择。去标识化对于研究也可以是一个很好的选择，特别是在你希望向特定受众保护个人身份的情况下——例如，在外部或会议上展示研究结果——同时又希望在需要时保持重新识别他们的能力。这在医疗保健领域很常见，你可能希望将当前数据用于研究目的，但仍需让全科医生或专家能够访问其患者的病史。\n\
  \n### 12.7.3 密钥管理\n\n正如本书多次提到的，为了使任何加密生效并保持加密信息安全，妥善保管解密密钥至关重要。显然，如果未经授权的个人访问了该密钥（以及它能解密的信息），该信息的机密性和可能性的完整性就会遭到破坏。\n\
  \n然而，保护密钥对于可用性也至关重要：如果任何授权人员由于任何原因无法访问密钥（也许因为密钥被过早销毁），他们将无法访问或读取加密信息，使其变得毫无用处。尽管这可能被认为比信息落入他人之手要严重，但它仍被视为安全违规，且可能从不便到可罚款的犯罪等不等。\n\
  \n在做出密钥管理决策时，重要的是意识到这不仅关乎拥有技术实现知识，同样取决于知道应该问哪些问题。这些问题可能包括：\n\n* 如何为不同的加密系统和不同的应用程序生成密钥？\n\
  * 公钥证书将如何生成和获取？（务必使用受认可的认证机构。）\n* 密钥将如何分发给授权用户以及如何激活它们？\n* 密钥将如何以及在哪里存储，授权用户如何访问它们？\n\
  * 应该如何对密钥相关活动进行记录、监控和审计？\n* 应该多频繁地审查密钥和日志，由谁负责这些审查？\n* 密钥应该如何归档，因为加密信息可能在日后需要访问和解密？\n\
  * 由于你可能需要在法院命令的情况下提供密钥和/或加密材料的访问，应如何处理此类法律请求？\n* 应该以及何时撤销、退出或停用密钥？（例如，当密钥用户离开组织时。）\n\
  * 应该何时何时销毁密钥（如果有的话），在什么授权下进行？\n* 如何处理（疑似）受损的密钥？\n* 应该如何恢复丢失或损坏的密钥，以便检索加密信息？\n\n\
  对这些问题的答案应记录在 12.7.1 中讨论的加密策略中。\n\n### 12.8 系统安全\n\n系统的设计从最早阶段开始就应该考虑安全性。部署第三方系统也应考虑设计安全。\n\
  \n**关键输出：** 设计安全的流程，包括定期审查。\n\n系统的安全性与用户对灵活性和功能的持续需求之间往往存在脱节。这些需求通常要求系统变得复杂。遗憾的是，系统越复杂，就越难使其变得安全。特别是考虑到开发者往往面临的时间压力，为了满足这些需求而设计设计复杂的系统，不可避免地会导致错误、疏忽，并最终导致漏洞。此外，复杂的系统往往不那么用户友好，如果某些内容（如安全设置）难以使用或理解，用户更有可能避开它们。\n\
  \n在开发新技术时，安全性往往被视为事后考虑的问题，这一事实无助于解决这种脱节——只有 36% 的组织在新的业务计划的规划阶段引入了网络安全.⁶⁷。此外，事后尝试让某物变得安全通常不仅无效，而且成本更高。（这种事后考虑的做法对大多数发明来说也适用——例如，汽车锁花了几十年时间才成为常态。）\n\
  \n#### 12.8.1 设计安全\n\n非常基础的安全缺陷的出现导致“设计安全”和“设计隐私和默认隐私”概念在近年来变得更加广泛。它们也受到政府（包括欧盟和英国政府）的鼓励；英国政府的倡议是由日益增长的\
  \ IoT 设备驱动的，这些设备带来了“巨大的机会”，但许多消费设备“甚至缺乏基本的安全措施”。⁶⁸ 设计安全的理念是，产品和服务从最早阶段开始就从安全角度设计，无论是完全全新的东西，还是对现有技术的创新应用。\n\
  \n例如，一种包含交互式白板的尖端即插用视频会议室解决方案被发现存在多个重大漏洞。鉴于该技术极有可能用于讨论和显示高度机密的信息，消费者期望内置适当水平的安全是合理的。遗憾的是，第三方发现数据通过一个缺乏加密的公开访问云服务泄露了，此外该服务还存在其他缺陷，其中一些漏洞在发现五个月后仍未被修复.⁶⁹\n\
  \n正如安全先驱 Bruce Schneier 所说⁷⁰：\n\n这些并不是细微的漏洞。这些是那些完全不知道如何创建安全系统的工程师所做出的愚蠢设计决策。简而言之，这就是物联网的问题所在。\n\
  \n遗憾的是，问题并不局限于物联网。工程师们不断提出创新的系统，无论是新的移动应用或 Web 应用、硬件、IoT 还是完全其他的形式，旨在让生活更轻松。当然，只有在系统按照预期运行的情况下，情况才如此——考虑到目前的网络格局，实现这一点意味着在考虑安全性的前提下设计并执行创新。为此，威胁分析是关键。进行风险评估（参见\
  \ 12.12），考虑威胁格局和你的攻击面，并查看获取的情报（参见 13.1）。考虑提议的系统可能会失效或受到攻击，以及你如何缓解这些故障并防止这些攻击。然后，你可以在系统中构建必要的安全控制措施和手段，而不影响功能。\n\
  \n\n\n\n\n例如，如果你想开发一个可以远程开启家中暖气的移动应用程序——换句话说，创建一个互联网控制的恒温器——你需要在家用恒温器上安装一个网络接口，并设计一个`Cloud`\
  \ 服务，允许用户（通过手机）与该恒温器通信。一种安全设计（secure-by-design）的方法要求你考虑以下几点：\n\n-   网络接口是否支持加密？\n\
  \n![image](img/cir.jpg)由于支持加密需要处理能力，是否需要更强大的处理器？\n\n![image](img/cir.jpg)现在认为充分的加密方案在以后可能不再适用（因为新的漏洞不断被发现），那么我们该如何更新固件呢？\n\
  \n-   身份验证将如何工作？\n\n![image](img/cir.jpg)如果开关没有输入密码的方法，身份验证需要以不同的方式进行，也许只允许批准的终端用户设备与恒温器通信。这需要数字\
  \ ID 和证书等。\n\n![image](img/cir.jpg)由于数字 ID 和证书需要安全的公钥基础设施（`PKI`）支持，是否需要增加存储空间以留出空间？\n\
  \n![image](img/cir.jpg)由于 `PKI` 需要更新，固件是否需要更改以适应这一点？\n\n克服加密和身份验证挑战并不是你唯一关注的问题——还有意外的、非恶意的可用性问题。如果通信中断，系统或设备会做什么？它会将数据存储在本地并在连接恢复时上传吗？它能根据过去的操作在内部假设或预测行为吗？由于各种原因连接问题是不可避免的，在这种情况下，你的系统仍然需要按照合理的标准运行。\n\
  \n举一个现实例子，当支持联网宠物喂食器的`Cloud` 服务宕机时，许多宠物忍饿了整整一周。如果制造商能提前考虑并实施安全设计，宠物喂器就可以下载并本地存储一个喂食计划，并在特定的间隔（连接互联网时）检查该计划是否反映了最新数据。在没有互联网计划的情况下，宠物喂器可以继续按照之前的本地计划工作。考虑到机械宠物喂器早于联网型喂器（而且在服务器事故发生时仍在生产），这种内部功能无疑是可能的，而且可能正是客户所预期的。\n\
  \n### 12.8.2 审查现有系统\n\n如果你已经拥有在设计时没有考虑安全性的系统，或者考虑了但由于需要审查而进行的系统，许多“安全设计”原则仍然适用。例如，（重新）分析风险：哪些威胁可能针对你的系统？你的系统可能会失效？还值得进行漏洞扫描（参见\
  \ 13.1.2）和渗透测试（参见 13.1.3），并缓解任何识别出的弱点（这些通常与配置和补丁管理有关，另见 12.6）。\n\n根据你试图保护的系统类型，有一些需要注意的通用威胁。例如，对于网络服务或其他数据驱动的应用，你需要正确地清理用户输入以防止\
  \ SQL 注入攻击，并阻止未经授权的用户访问机密数据。另一个例子，对于`IoT`，你需要警惕通信被拦截（参见 12.9 的网络和通信安全），加密可能是一个合适的解决方案（参见\
  \ 12.7）。\n\n### 12.8.3 第三方考虑\n\n当你依赖第三方系统时，请确保 `SLAs` 提供了安全设计的保证。这可能以风险评估记录和所实施措施的广泛概述的形式存在。你还需要检查\
  \ `SLAs` 中的许多其他点，这些点在 12.13.2 中有详细讨论。\n\n你的采购流程可能已经要求你列出软件和系统需要实现的目标。这些可以扩展到列出你的安全需求——需要哪些加密？它需要与你的\
  \ `SSO` 解决方案兼容吗？它需要支持 `MFA` 吗？你需要哪些自定义控制？问这类问题将帮助你判断系统或软件是否符合你的安全需求。\n\n### 12.9\
  \ 网络和通信安全\n\n公司网络的设计应将安全在内，使用适当的技术和流程，如分段和隔离。\n\n**关键输出：** 定义符合组织安全要求的安全区域，并采取适当的技术措施（如防火墙和\
  \ `DMZs`）形成内部边界，以及形成外部边界，覆盖整个公司网络。\n\n在考虑保护你的网络和通信之前——或者说，保护任何其他事物之前——你需要确切知道你正在保护什么以及它存储在哪里，并遵循\
  \ 12.8.1 中讨论的安全设计原则。你的网络上有哪些设备？你在这些设备上存储和/处理哪些信息？这些信息被认为是个人数据还是在其他方面有价值？机密性、完整性和/或可用性问题的影响是什么？回答这些问题（通常作为风险评估的一部分，参见\
  \ 12.12）将帮助你将资产组织到不同的区域——我们将在 12.9.1 中详细讨论这一过程。\n\n然而，请记住，“网络”方面只是信息安全的一个方面——人为因素也很重要，这意味着你应该在适当的地方签署保密协议或非披露协议（`NDAs`）。坚定的攻击者还可能采取更具物理的方法，尝试直接连接你的网络，因此你可能需要研究安全无线路由器、网络端口（特别是半公共区域的端口，如会议室和接待区）以及网络布线（通常保存在不安全的机柜中）的方法。\n\
  \n注意，由于网络和通信安全是一个相对技术的过程，建立和维护网络所需的专业知识和经验显得尤为重要（另见 12.10）。你需要精通架构的人员来设计你的网络，还需要擅长分段、防火墙、路由等的人员来完成物理工作。你还应该制作网络图，以供技术人员和负责合规的人员使用。此类图表应清晰地解释安全区域并显示它们受到了单独的保护。\n\
  \n### 12.9.1 创建安全区域\n\n如引言部分所述，你需要考虑在网络中保留了哪些资产，并根据安全需求对它们进行分组以创建安全区域。例如，需要 100%\
  \ 可用的服务器可以组合在一个区域中，而你可以承受几小时不可用的服务器应该组合在另一个区域中，因为对它们所需的措施是不同的。根据类似的逻辑，`PII`（如客户和\
  \ `HR` 数据）应该与普通的机密信息处于不同的区域，并对敏感和非敏感个人数据进行区分，因为它们有不同的安全需求。\n\n\n\n\n如果你将所有资产都保留在单一区域内（这被称为“扁平网络”），那么一旦某个漏洞被利用，你的整个网络都面临崩溃的风险。此外，定位任何\
  \ IT 事件（无论是否由网络攻击引起）将变得更加困难，因此调查和解决这些问题也会变得更加困难和昂贵。最后，对所有资产应用相同的安全措施将被证明要么不足以满足所有安全需求，要么比实际成本更高。\n\
  \n另一方面，创建许多区域需要消耗资源，并可能让你的网络管理变得非常复杂（尽管虚拟局域网 VLAN 可以通过使用逻辑网络而非物理网络进行分段，来帮助减少设备的复杂性）。然而，你的首要任务应该是根据安全需求创建相应数量的区域。从长远来看，设置网络所额外投入的工时成本，几乎会被快速解决事件所节省的资金抵消甚至超过（如果你确切知道异常是在哪个分段检测到的，你需要检查的机器就更少），而且事件本身的规模更小，并降低了负面新闻和罚款的风险。\n\
  \n### 12.9.2 分段与隔离\n\n在决定如何将资产划分为不同的区域以及每个区域的要求后，你可以着设计网络以支持这些要求，包括每个区域所需的安全措施。\n\
  \n网络设计中的一个重要步骤是创建网络“分段”，每个分段都有自己的私有 IP 地址范围。这具有许多优点，例如提高性能（减少每个分段的流量）、更好地控制网络问题（局部故障对其他分段的影响应该是有限的），当然还有通过将流量路由到其需要的地方来提高安全性。\n\
  \n在对网络进行分段后，你应该将每个分段或分段组分配给你的安全区域，并编写规则规定允许哪些流量流出或进入每个区域，以满足你已经建立的安全需求。网络设计的这一阶段被称为“隔离”，它将帮助执行你的访问控制（参见\
  \ [12.4]）并减少泄露的影响，因为你实际上是创建了额外的内部边界。这将使得用户仅访问其所需的信息变得更容易，并减慢试图在你的网络中移动的攻击者的速度，为你赢得更多时间来检测其活动并在造成过损害之前阻止他们。\n\
  \n隔离可以通过多种方式实现，例如使用防火墙（参见 [12.9.3]）、DMZ 区（参见 [12.9.4]）和访问控制列表。在可能的情况下，你应该遵循零信任架构的原则（参见\
  \ [12.9.5]）。\n\n### 12.9.3 防火墙\n\n之前在 [12.5.5] 中，在反恶意软件保护的范围内讨论了防火墙：通过将默认防火墙规则设置为“拒绝”并对授权的协议、端口和应用程序实施白名单，你的防火墙将作为一个过滤器来保护你的边界，在允许所有流量进入你的网络之前对其进行分析，并阻止任何可能是恶意的流量。实际上，防火墙是门卫：它是你需要保持安全的内部网络与应该谨慎对待的\
  \ Internet 之间的屏障。防火墙也可用于内部边界，即安全区域之间，以控制流量流并确保只有授权的用户和设备可以访问机密数据。\n\n### 12.9.4\
  \ DMZ\n\n当防火墙作为网络与 Internet 之间的屏障或过滤器时，DMZ 的作用就像公共访问和私有访问之间的缓冲区。DMZ 是位于你组织外部边界（网关）的小型隔离网络分段，你应该在其中放置面向公众的服务器，如\
  \ Web 和电子邮件服务器。如果你同时使用 DMZ 和防火墙，结果应该类似于 [图 1]。\n\n![image](img/pg167-01.jpg)\n\n\
  **图 1：组织边界的基本图，带有相关的流量规则**\n\n你应该建立相应的规则，确保所有外部流量在进入你的内部网络之前通过你的 DMZ 进行评估。这些规则还应确保你网络之外的任何人（包括外部威胁）只能看到你的公网\
  \ IP 地址，从而隐藏你的私有 IP 地址。\n\n### 12.9.5 零信任架构\n\n重要的是，防火墙和 DMZ 只能保护你免受来自 Internet\
  \ 的外部威胁。它们无法保护你免受已经在你的网络内部、绕过了你的防火墙和其他边界的威胁。此外，在 [第 8 章] 中更详细讨论的内部威胁不仅限于疏忽或恶意的员工——它也可能是黑入合法用户账户的攻击者，或者是通过其他方式绕过防火墙以直接访问你私有网络的入侵者。为了帮助缓解这些风险，在可能的情况下遵循“零信任”架构的原则。\n\
  \n从历史上看，网络通常基于这样一个假设：如果某人在你的网络内部，他们被“信任”可以访问网络内的所有内容——然而，安全漏洞中的一个共同主题是，攻击者一旦在你的网络中获得立脚点，就会开始提升他们的权限，最终访问高度敏感的数据和/或业务关键系统。\n\
  \n在零信任环境中，信息和服务在首次登录时受到外部边界强识别、认证和授权解决方案的保护（参见 [12.4]），并且在访问这些信息时受到安全区域之间内部边界解决方案的保护。换句话说，访问控制从单次发生（进入整个网络）移动到内部网络内的多次实例（进入各个安全区域），并根据所持数据采取相应的特定措施。在零信任架构下，访问即时环境之外资源（例如云端或网络服务器上的资源）的权限默认被拒绝——你必须请求访问，只有在有正当理由的情况下才会授予访问，且这种访问仅限有限时间。\n\
  \n### 12.10 安全能力与培训\n\n承担安全角色或安全责任的员工应具有执行其职责的正确能力和资质。这些安全活动也可以外包。\n\n**关键输出：**\
  \ 识别、开发和维护必要能力的流程。\n\n除了日常与安全相关的职责（如使用安全密码或确保离开时关上门）外，还有专门的安全角色，负责实施安全措施（技术上的或其他方面的），和/或执行纯粹关注安全的活动，例如审查访问日志或评估漏洞补丁。具有直接安全影响的流程所有者（如数据处理活动）也可以被描述为具有安全角色或安全责任。\n\
  \n\n\n对于小型企业而言，许多此类安全活动可能会由外部资源提供（另参见 12.10.3），而对于较大的组织，这些通常会由 IT 部门以及可能在发生事件时具有指挥权限的高级管理人员负责（另参见\
  \ 14.1.1）。内部责任应分散在高级管理层和运营层中，并且可以是是持续的职责、定期执行的职责，或仅在需要时执行。无论你是将该活动留在内部还是将其外包，你都需要知道如何识别自己的能力需求。\n\
  \n### 12.10.1 需要考虑的角色和职责\n\n你需要定义和分配的责任将取决于你的法律和合同义务，以及你的业务需求，这些需求反过来又决定了你需要采取哪些其他安全措施。例如，如果你确定需要对你的\
  \ `PII` 数据库进行加密，那么你需要一个能够对不同加密方案的优缺点提供建议并帮助你实施的人。\n\n无论你的具体需求如何，许多组织都需要某种形式的 IT\
  \ 帮助台。这些人通常负责实施和维护大多数技术措施，而且在发生事件时通常通常是第一个联系点，他们随后可以根据情况进行上报。\n\n在某些司法管辖区，法律对具有特定能力的特定角色有明确要求，例如欧盟的\
  \ `GDPR` 数据保护官（`DPO`）。^(73 无论你是否需要 `DPO`，大多数现代数据保护法都要求你分配负责与数据主体及相关机构进行通信的责任、进行数据保护或隐私影响评估等职责。这些职责中的大部分需要专门的技能，理想情况下还需要实践经验。\n\
  \n在实施网络安全时，你还应该考虑负责实施项目的项目经理的能力，以及负责维护后期安全计划的高级管理人员的能力。这也意味着要意识到组织随时间推移产生的需求以及如何应对这些需求。这些经理并不一定需要具备理解技术知识（例如，不同加密类型及其各自的优势），但应该了解更通用的原则（例如加密应该实现什么目标，在什么情况下应该考虑加密）。他们还应该知道问哪些问题，以确保这些原则和相关目标得到实现。\n\
  \n### 12.10.2 培养能力\n\n在确定了所需的角色和职责后，你还需要建立这些角色所需的特定技能和能力。一个很好的起点是询问你打算任命的人，他们需要哪些资源（以工具或培训的形式）。如果你没有可以询问的人，查询相关的职位描述也可以引导你走向正确的方向。\n\
  \n在需要培养能力的地方，可以考虑此类选项，例如：\n\n* 证书或学位形式的正规培训；\n* 简单的培训活动；\n* 技术辅助；以及\n* 外包（参见 12.10.3）。\n\
  \n单是获得经验可能对培养正确的能力也至关重要，但通常与培训（无论是否是正式）相结合使用。然而，如果培训是正式的，证书提供了能力的简易证明。此类资质也可能是合同或法律强制要求的。\n\
  \n当你拥有专业人员时，维护他们的能力同样重要。提供定期培训将有助于保持他们的技能和知识与时俱进。展现你对他们职业发展的关注，鼓励他们留在你的组织中。\n\n\
  ### 12.10.3 外包考虑\n\n外包确实带来了益处，特别是对于较小的组织而言。它可能比拥有内部专家更廉价，特别是当你的网络安全需求不需要全职职位时。\n\
  \n此外，决定依赖外部供应商通常意味着能够接触到一些顶尖的专业知识——一个紧跟行业最新动态的专家团队，他们可以提供服务，并选择合适的产品和工具来帮助他们交付该服务。根据你的参与程度，这也可以帮助你在组织内部开发必要的能力。\n\
  \n### 12.11 员工意识培训\n\n员工接受定期的网络安全意识培训，并知道如何识别和应对安全威胁。安全也应该植于组织的文化中。\n\n**关键输出：**\
  \ 建立具有明确定义且可衡量的学习目标的员工意识培训计划。\n\n在本章的几个过程中，我们提到了员工意识培训，以及它如何能够显著提高你组织的安全态势。请注意，这是所有员工和承包商都应该接受的通用意识培训，而不是\
  \ 12.10 中讨论的专门培训。\n\n在这里，我们将更广泛地讨论培训、存在哪些培训选项、如何以可审计的方式衡量培训，以及如何在整个组织中建立安全文化。\n\n\
  ### 12.11.1 培养员工意识\n\n培养安全意识的起点是建立一个可靠的培训交付计划。对于大多数组织来说，这意味着在入职时向所有员工开展安全意识培训，随后至少每年进行一次复习。特别关键的一点是教他们，即使在非技术或非安全特定的职位上，他们——以及公司里的每一个人都对安全负责。培训还应该教他们如何能为良好的安全做出贡献。\n\
  \n但请记住，意识培训仅仅是如此——它并不能保证你的员工总是以正确或及时的方式行动，但它确实确保了每个人都知道应该做什么，而这是良好安全行为的基础。\n\n###\
  \ 12.11.2 确定你的培训需求\n\n确定你（以及你的学习者）的培训需求，首先要问自己初初寻找员工意识培训。你想让员工意识到什么？你正试图防止什么种类型的事件？你是否担心可疑事件没有在内部得到报告？“安全培训”可以涵盖广泛的主题，包括教员工：\n\
  \n* 如何选择强密码并保持其安全；\n* 如何识别钓鱼邮件；\n* 在离开办公位时锁定屏幕；\n* 关于公共 Wi-Fi 的风险；\n* 碎掉（或其他方式销毁）遗留在打印机上的任何机密文件；\n\
  * 挑战内的任何陌生人；以及\n* 报告任何已知或怀疑的安全违规行为。\n\n这并非详尽列表，但它应该让你对可以考虑的广泛学习目标有一个大致了解，取决于你试图解决的问题或想要防止的事件。查看你组织的事件历史（无论它们是否造成了实际损害）可能帮助你确定可能在员工培训中需要涵盖的内容。\n\
  \n良好的培训供应商会在你承诺购买之前提供所涵盖主题的信息。\n\n### 12.11.3 培训选项\n\n\n\n\n\n## 引言\n你正尝试解决的问题决定了要处理的主题细节以及培训的深度，但这并不是你唯一考虑的因素。学习者的需求（或偏好）和预算同样重要——预算问题可能会变得更加复杂，因为你还需要考虑计划培训多少人以及培训需要重复的频率（这取决于你组织的风险承受能力，请参见\
  \ 12.12.6）。\n\n目前流行且广泛使用的有三种安全意识培训方案：课堂培训、直播在线培训和电子学习——每种方案都有其优点，这些优点概括列在 表 3 中。某些交付方式更具成本效益，另一些则为学习者提供了提问的机会等——“最佳”方案取决于你的需求和优先事项。最终，对你而言最佳的交付方式取决于你的需求——你希望员工掌握多少信息、有多少员工需要培训、除了通用的网络和信息安全之外你还需要处理的额外主题（如欧盟\
  \ GDPR）、你的预算等。\n\n## 表 3：不同培训方案的优点\n\n| | **课堂培训** | **直播在线培训** | **电子学习** |\n|\
  \ --- | --- | --- | --- |\n| 导师引导 | **✓** | **✓** | |\n| 易于参与 | **✓** | | **✓**\
  \ |\n| 可提问/获取说明 | **✓** | **✓** | |\n| 成本效益 | | **✓** | **✓** |\n| 何地方便均可进行 | |\
  \ **✓** | **✓** |\n| 随时方便即可进行 | | | **✓** |\n\n在导师引导的课程中，导师与参与者有直接接触（特别是在教室环境中）——这应该让他们更容易判断学习者的反应（例如困惑），并通过重新解释概念或采取不同的方法做出恰当回应。然而，这很大程度上取决于导师在培训当技能和心理状态。此外，当员工被分成不同的培训小组时，每个小组可能接收到的解释并不相同（甚至可能是完全不同的导师），这意味着尽管使用了相同的学习材料，提供的培训在组织内部可能是不一致的。\n\
  \n至于参与度，与其通过定期练习来分解课程，仅仅观看一个冗长的演示更可能导致无聊（并且没有给学习者真正吸收信息的机会）。电子学习课程可以通过类似的练习来变得具有参与性，同时让学习者按照自己的节奏点击课程。另一方面，在直播在线环境中，参与者和导师不可避免地无法面对面——可能完全看不到，只能看到演示文——因此完全投入可能需要更多的努力。此外，让人们离开办公室通常会有更好的学习环境，因为这有助于他们从日常工作中抽离，帮助全神专注于学习。\n\
  \n数字培训方案（直播在线和电子学习）最大的优点是便利性和成本效益。你不需要因为员工消失去培训、产生旅行或住宿费用而停止整天或半天的生产。电子学习的额外优点是学习者可以按照自己的节奏点击课程。\n\
  \n记住，培训不是一次性的，因为人会遗忘的。尽管如此，即使有定期培训，意识到测试的局限性也是重要的。例如，模拟钓鱼攻击（参见 13.1.2）可以帮助确保员工保持意识。\n\
  \n### 12.11.4 衡量培训\n有效培训的另一个关键方面是衡量——而非轶事。当通过测试等方式衡量培训有效性时，了解员工是否能够识别钓鱼攻击非常重要。如果目标还为了确保员工报告事件，测试可能会询问相关问题。衡量的记录对于提交给审计员也很有用。\n\
  \n### 12.11.5 构建安全文化\n为了让组织各地的员工真正关注安全并应用从培训中学获得的知识，安全应该植于公司的文化之中。换句话之，你的目标应该是建立一种“安全文化”。然而，在你思考如何建立和影响任何组织的安全文化之前，首先理解什么是安全文化是重要的。\n\
  \n由于安全关于免于危险或威胁，而文化是一个群体收集起来思想、行为和习俗，因此“安全文化”可以定义为保护他们免受危险或威胁的群体思想、行为和习俗。\n\n\n\n\
  \n\n安全文化的强弱以及该文化的具体特征——不仅取决于人员；另外两个安全支柱——流程和技术——也做出了贡献。一个组织的社会依赖于权威，个人往往倾向于认可这一点（某些研究甚至表明，我们的大天生就适应了这一点⁷⁵）。这意味着，只要法律和规则看起来合理且公平，他们通常倾向于遵守——包括以政策或程序形式存在的规则。如果你的技术能够帮助他们遵循这些规则，执行起来将更加容易。\n\
  \n此外要记住，文化和整体氛围必须保持健康，因此避免对报告违规行为等行为进行惩罚；否则，你可能会营造一种恐惧文化，导致违规行为未报告且未处理的时间更长，从而指数级地增加对组织的损害。为了避免这种情况，请建立一种基于开放的文化——积极鼓励员工直言，并在他们这样做时给予赞扬（或以其他方式认可他们做了正确的事），都是构建这种健康安全文化的重要步骤。\n\
  \n你的安全文化越强大、越健康，组织的整体安全水平就越强——通常也越成熟。将安全融入组织的文化中还将帮助人们理解为什么安全培训是必要的，而且因应用所学而获得赞扬将产生激励作用，并帮助巩固所获得的知识。\n\
  \n由于建立这种文化的成本与潜在收益相比通常在财务上很小，这几乎是一项值得的投资。然而，请记住，建立和维护安全文化（或者，任何其他类型的文化）需要团队和自上而下的努力。\n\
  \n## 12.12 综合风险管理计划\n\n作为更广泛的风险管理计划的一部分，以结构化和方法化的识别、评估和应对网络及信息安全风险。\n\n**关键输出：**\
  \ 定期进行全面且结构化的风险评估。\n\n对于大多数 CRF 流程，进行风险评估是确定实施特定措施的关键部分。执行风险评估也是有效实施整个框架的必要步骤，因为它将帮助你对最初要考虑哪些流程做出合理且成本效益的决策，这就是为什么在我们实施网络安全的八步法中，它是一个独立的步骤（参见第\
  \ 6 步，第 23 章）。\n\n尽管许多组织都会进行风险评估，但很少有组织能以真正结构化、方法化的方式进行，以确保结果是合理的、跨业务不同部门一致的是可以重复的。\n\
  \n当然，任何种类的风险评估都是高效防御的第一步，即使是非结构化或直觉的方法可能也比完全没有要好。无论采用何种方法，风险评估都是确定具体哪些威胁和漏洞会对你的组织造成最大伤害的有效方法，并帮助你决定先处理哪些问题。\n\
  \n然而，以全面、结构化且更正式的方式进行该风险评估会带来额外的优势。它有助于确保流程能够被不同的人一致地应用，这将帮助你恰当地优先考虑风险处理。结构化的方法还降低了忽视任何风险的可能性。\n\
  \n正式的计划还便于规划风险评估审查，即在定期间隔以及在计划（或已经制定）重大变更时进行审查，并确保这些审查是按计划执行的。你的计划可能包含多次风险评估，也许可以按部门划分，并根据审查间隔、方法等进行分组。\n\
  \n你的组织选择的实际方法或方法论并不特别，只要它能确保有效、可比的结论并符合你的需求即可。你的方法论应该遵循一些原则以确保有效的分析和处理，这些原则在 12.12.1\
  \ 中进行了讨论。\n\n### 12.12.1 风险评估方法\n\n简单来说，风险是 `threat`（威胁）利用的 `vulnerability`（漏洞），这就是为什么在风险评估中经常使用以下公式或其变体：\n\
  \n`threat x vulnerability = risk`\n\n另一种表述方式是：\n\n`event x trigger = consequence`\n\
  \n无论措辞如何，关键在于你回答了`如何？`（威胁或事件）、`为什么？`（漏洞或触发因素）以及`又怎样？`（风险或后果）的问题。例如，如果攻击者利用了你没有更新的漏洞（`how`），数据可能会被盗取（`why`）。\n\
  \n然而，正如风险评估可以用于保护组织一样，它也可以用于评估风险活动的相对收益。例如，启动一项涉及更多数据收集的新服务可能会使你成为网络犯罪分子更具吸引力的目标，增加发生更严重数据泄露的风险，但这种风险可以与服务带来的利润增加相平衡。另一个例子是，允许员工使用个人设备进行工作可能会引入安全风险，但如果你预算紧张，这可能仍是明智的做法（尽管你至少应该通过引入\
  \ BYOD 政策来降低这种风险）。\n\n这是一个相当直接的方法，但它提供了收集信息以分析和理解风险，并在必要时处理风险的基础。对于之前的过时软件示例，基本的答案可能是更新该软件。更好的做法是考虑大局，通过对所有软件自动更新来解决根源，更好的是审查所有软件以检查你是否还需要它们以及是否受到支持，然后停用或替换不受支持或需要的软件。\n\
  \n如果风险被写成通用的陈述，如`数据泄露`、`业务损失`、`品牌损害`或 `GDPR 罚款`，那么这种分析和处理是不可能的。这种方法的问题在于它关注的是后果，而不是导致后果的情况。以后者的例子为例，你不应该问自己根据\
  \ GDPR 罚款的风险是什么，而应该问哪些行动或事件可能导致这些罚款。\n\n### 12.12.2 识别风险\n\n要确定如何识别构成风险的威胁和漏洞，以及确保你查看的是正确的风险可能是困难的。自然，你不想忽视任何风险，特别是那些需要处理的高级风险，但你还需要确保不要花费太多时间去处理那些对你的工作产生显著影响的风险，无论它们是否发生——这看起来显而易见，但在努力做到面时，这是一个很容易犯的错误（另见\
  \ 12.12.3）。避免这种情况的关键在于拥有一个明确定义的范围，涵盖你试图保护的资产、你的业务背景（如你的行业），以及你必须满足的利益相关者、监管、合同和运营要求。优先考虑正确的风险也很重要，为此你应该查看你的威胁格局和情报（参见\
  \ 13.1）。\n\n\n\n\n为了集中风险评估的注意力并避免偏离无关领域太远，请进行多次较小的评估。通过限制每次评估的范围（例如针对网络相关风险、云相关风险等分别进行评估），你会发现更清晰地定义并遵循每个范围会变得更容易。无论你如何划分这些范围，将这些较小的范围组合在一起时，应当涵盖你所有的资产和需求。\n\
  \n通过以相对狭窄的方式定义给定评估的范围，你还可以将需要考虑的需求保持在可控的范围内。例如，云服务风险可能会集中在数据安全、隐私和个人身份信息（PII）保护、硬件可靠性与可用性要求上，以及诸如机房冷却或备用电源等更务实的项目。采取这种更集中的方法最终将产生更好的风险评估结果。\n\
  \n一旦你定义了范围和相关需求，通常可以通过两种方法来识别相关风险：\n\n### 1. 基于资产的方法：\n\n这种方法需要一份资产清单（参见 12.1.2\
  \ 和 附录 1）、一份业务流程列表（如果未包含在资产清单中），以及理想情况下一个需要考虑的威胁和漏洞数据库或列表。\n\n其核心思想是建立你每项资产的漏洞模型，并考虑可能利用这些漏洞的威胁。例如，纸质文件（资产）偶尔需要从安全存储器中取出进行实际使用（漏洞），在此期间，它可能会被未经授权的人员查看或取走（威胁）。\n\
  \n每个“事件场景”——即特定威胁利用特定漏洞的组合——都是一个定义定义的风险，可以在下一阶段进行分析，并在必要时进行处理。资产所有者和相关利益者可以在此过程中提供宝贵的意见——他们对资产及其使用方式有最好的了解，这自然会影响资产对所识别出的威胁的易感性。\n\
  \n### 2. 基于场景的方法：\n\n在基于场景的风险评估中，你以宽泛的方式检查事件的所有后果——通常是许多组织通用的更大规模场景。例如，关键服务器房的火灾可能会影响广泛物理和数字资产及基础设施的完整性和可用性，这还涵盖了健康安全、业务连续性问题，以及可能出现的负面媒体报道和监管关注。\n\
  \n防御火灾还需要一种更广泛的方法。在易燃物品（如等待收集和处理的粉碎纸张）附近是否有吸烟区？是否安装了灭火系统？发热量大的设备是否得到了充分冷却？每项措施都对你的防御有所贡献，但仅依赖一两项措施可能证明是不够的——有必要考虑整个威胁场景才能确保真正的安全。\n\
  \n识别威胁场景始于与组织内部关键人员的讨论，例如设施经理、IT 经理等。他们对开展基于场景评估所需的规模的运营有最清晰的整体蓝图，并具有帮助识别相关风险和合适缓解措施的宝贵经验。资产所有者和低级利益者可能也由于他们能够协助基于资产评估的相同原因，提供宝贵的投入。\n\
  \n很有可能并不是每个相关场景都被识别出来。这是完全可以接受的——重点在于你收集了足够的信息，以便对实施哪些措施做出明智的决策。尽管如此，如果提出的某个场景在检查后被证明是多余的，则应该忽略它。\n\
  \n上述这两种方法没有优劣之分——“更好”的方法取决于你的需求。例如，基于资产的方法的一个局限性是它倾向于对每个风险只看一种威胁。如果你预计会被（例如）有组织犯罪所针对，那么基于场景的评估会更合适。\n\
  \n基于场景的方法对于较小组织或具有特定需求和义务的组织同样有效。另一方面，如果你更倾向于一种更有条理、类似于检查清单的方法，那么进行基于资产的评估可能更合适。\n\
  \n可以说最全面的方法是同时进行基于资产和基于场景的评估。从基于资产的方法开始可以减少基于场景评估的工作量，因为缓解给定场景所需的某些控制措施可能已经在基于资产的评估中被识别出来。另一方面，从基于场景的评估开始可以帮助你识别可能没有考虑过的资产风险，但如果某个特定场景为这些控制提供了新的视角，也可能要求你对基于资产的控制进行更改。\n\
  \n没有所谓的“正确”方法，如果你同时使用两种方法，也没有“正确”的顺序——这取决于选择最适合你的方法。然而，当你选择使用这两种方法时，请记住风险评估是一个循环过程，一种方法自然为另一种方法提供参考。此外，无论使用哪种方法，在识别风险后，不要立即假设它是该资产或场景的唯一相关风险。即使进一步的风险可以通过相同的措施缓解，也请确保你已经涵盖了所有风险并进行了尽职调查。\n\
  \n### 12.2.3 决定风险是否相关\n\n可能损害信息安全的广泛威胁导致了同样广泛的信息安全风险。为了确保你识别出的风险确实是信息安全风险，请问问自己它们是否会影响你的信息资产或系统的机密性、完整性和/或可用性，以及它们的韧性。\n\
  \n同样重要的是，组织内不同团队对信息安全风险的看法也会不同，因为同样的风险会根据每个团队的日常职责对其产生不同的影响。例如，董事会将主要关注战略影响，而 IT\
  \ 团队会更关注对系统和基础设施可能的影响。\n\n除了内部利益者，你还应该考虑外部利益者（如供应商）可能带来的风险（参见 12.13）。他们对安全的投入可能与你不同，因此你可能需要不同地评估相关风险，特别是考虑到许多情况下，如果你没有采取足够的预防措施（例如要求符合某些标准并进行尽职调查），你将对供应商端的违规承担责任。\n\
  \n\n\n你还应该考虑对你的安全措施有感兴趣的其他利益相关者，例如数据主体，因为你有责任保护他们数据的数据安全，而数据泄露对他们造成的损害可能比对你造成的更大（即使近期的数据隐私立法旨在加严未能充分保护个人数据可能导致的后果的严重性）。这种对个人权利和自由的风险是数据保护监管机构最关心的点，因此，了解数据主体可能如何看待或体验数据处理的风险，并采取适当措施，最终也将保护你的组织。开展数据保护或隐私影响评估可以帮助你确定某项处理活动可能会损害数据主体、他们受到损害的可能性，以及这种可能损害的程度。\n\
  \n### 12.12.4 风险所有者和风险登记表\n\n正如每项资产都应该有一个资产所有者并记录在资产清单中一样风险也应该分配一个风险所有者并记录在风险登记表中（该表应引用资产清单中的项目，特别是当你进行基于资产的风险评估时）。\n\
  \n风险所有者主要负责确保任何必要的风险处置（技术控制、策略或程序、员工培训等）得到实施并有效，且确保任何剩余风险都是可接受的（参见 12.12.7）。注意，风险是在风险评估过程的后期进行处理的，但在开始评估风险级别之前应该识别出风险所有者，因为他们可能在此之前提供有用的输入。\n\
  \n风险所有者还负责定期审查风险，确保它们仍然可接受，且控制措施仍在正常运行。\n\n与你的资产清单一样，你的风险登记表应该列出关于每个风险的细节，例如：\n\n\
  * 风险所有者；\n* 原始概率、影响和整体风险（基于固定标准；见下文）；\n* 剩余概率、影响和整体风险（基于相同的标准）；\n* 处置信息，或容忍某项风险的理由；\n\
  * 完成行动的目标日期和责任人；以及\n* 下一次审查的截止日期。\n\n随着你继续进行风险评估的后续步骤，你将逐渐获得完成风险登记表细节所需的信息。\n\n\
  ### 12.12.5 评估风险级别\n\n在识别出风险后，你需要以一种合理、结构化且一致的方式确定每项风险的重要性。要做到这一点，你需要衡量频率（风险发生的可能性有多大）和影响（如果风险发生，后果有多严重）。\n\
  \n广义而言，风险分析有两种方法：定量和定性。定量评估尝试根据大量数据为风险分配一个精确的数值值。在许多情况下，由于没有足够的数据进行分析，或者涉及的变量过多，因此在信息安全中采取定量方法可能是不切实际且不符合成本效益的。定性评估是信息安全中更常见的方法，它依赖利益相关者的知识和经验来确定“估计”的风险。这种方法具有主观性的缺点，但比定量评估更快、也更容易执行，并且通常仍然能良好的结果。本节描述的方法是定性的。\n\
  \n为了建立频率和影响，你通常需要定义三到七个风险“类别”，通常命名为：\n\n* “极高”、“高”、“中”、“低”和“微不足道”；\n* “几乎确定”、“可能”、“可能”、“不太可能”和“罕见”；以及\n\
  * “灾难性的”、“重大的”、“适中的”、“轻微的”和“无关紧要的”。\n\n选择什么类别名称并不重要，只要你在整个组织中一致地应用它们即可。为每个名称提供清晰的描述或数值也是重要的，在衡量影响时，最好与多种类型的标准对齐。表\
  \ 4 和表 5 提供了概率和影响标准的示例。\n\n**表 4：概率标准示例**\n\n| 等级 | 概率 | 描述 |\n| --- | --- | ---\
  \ |\n| 5 | 几乎确定 | 预计每周发生 |\n| 4 | 可能 | 预计每月发生 |\n| 3 | 可能 | 预计每一年一次 |\n| 2 | 不太可能\
  \ | 预计每三到五年一次 |\n| 1 | 罕见 |\n\n**表 5：影响标准示例**\n\n| 等级 | 类别 | 财务影响 | 声誉影响 |\n| ---\
  \ | --- | --- | --- |\n| 5 | 灾难性的 | > 500 万人民币 | 损失超过 30% 的客户 |\n| 4 | 重大的 | 200\
  \ 万 - 500 万人民币 | 损失 15% - 30% 的客户 |\n| 3 | 适中的 | 50 万 - 200 万人民币 | 损失 5% - 15% 的客户\
  \ |\n| 2 | 轻微的 | 10 万 - 50 万人民币 | 损失 1% - 5% 的客户 |\n| 1 | 无关紧要的 | < 10 万人民币 | 损失小于\
  \ 1% 的客户 |\n\n### 12.12.6 风险胃口\n\n风险胃口是在实施项目早期建立的一个重要点（我们的方法将其包含在第 2 步中，参见第 19 章）。你的风险胃口或风险承受度定义了组织可以接受的风险水平。这基于你的需求和目标——翻译你的业务、法律和合同要求可能会显示，例如，你不接受任何超过最低影响的风险，但可以容忍相当高的频率——根据需要，你可以根据可用资源进行调整。\n\
  \n你的风险胃口还反映了组织通常业务的方式。如果你通常对风险有很高的承受度，你可能会在信息和网络安全方面采取同样的方法。同样，如果你倾向于规避风险，那么在安全问题上采取类似的谨慎态度是合理的。\n\
  \n\n\n请注意，任何后续概率-影响矩阵（如上所示）都应该反映该风险偏好，并结合你设置的发生概率和影响标准。在表达你的风险偏好时，你可以设置一个最高风险分，或者单独为影响和发生概率设置最高级别——最合适的方法取决于你的需求。\n\
  \n### 12.12.7 风险响应\n\n通常情况下，你有四种方式来应对风险（有时被称为“四 T 策略”）：\n\n#### 1. `Treat`（减轻）\n\
  \n通过实施安全控制措施，将风险的影响和/或发生概率降低到可接受的水平。这些控制可以是预防性的、检测性的或响应性的，也可以三者的结合。你不需要局限于技术控制——员工培训、招聘以及制定（或修订）政策和程序都是降低风险的有效方法。此外，应用不同类型的控制有助于提供更深层次的“纵深防御”（在\
  \ 12.12.8 中进行了更详细讨论）。\n\n#### 2. `Transfer`（转移）\n\n将全部或部分风险转移给另一方，例如通过保险或将流程外包给更有能力管理风险的机构。\n\
  \n#### 3. `Terminate`（终止）\n\n终止威胁源，例如通过结束某项业务活动或改变执行方式。\n\n#### 4. `Tolerate`（接受）\n\
  \n如果无法处理风险或处理成本过高，或者该风险提供了获得积极结果的机会，则主动选择接受该风险。\n\n确保你记录了所选的响应方案，包括理由以及在适用情况下所选的控制措施。还要确保风险所有者已同意该方案，并能够确保其被正确实施。实施后，审查控制措施的有效性以确保风险已得到充分缓解。记住，你通常不需要（也无法）完全消除风险，只需将其降低到符合你风险偏好的可接受水平即可。\n\
  \n风险所有者还应定期审查风险，以确保它们仍然可接受，并审查风险处理措施以确保它们仍然有效并实现了预期目标——特别是当解决方案是技术性的时，可能会由于新漏洞的出现而失效，或被更先进、更安全的替代方案所取代。\n\
  \n风险评估和响应将在我们实施网络安全的八步法第 6 步和第 7 步中进一步讨论（分别在 23 章 和 24 节 中）。\n\n### 12.12.8 纵深防御\n\
  \n没有任何单一措施（特别是预防性措施）是 100% 有效的，这就是为什么经过处理的风险仍然是风险，只是发生的概率较低，且/或在发生时危害较小。即使你的措施得到了有效实施和良好维护，安全仍然可能失效（多年来，正如多部电影所永化的那样，像阿尔卡拉兹联邦监狱这样的高安全性监狱也出现过逃犯等）。因此，需要一种更动态的方法，让各个安全措施有效协同工作并弥补彼此的弱点。\n\
  \n在纵深防御方法中，你部署了多层防御，这样即使某一层失效，其他层仍然能阻止攻击成功。理想情况下，每一层还为攻击者提供了不同的挑战（想象一下城堡的护城河和城墙）。\n\
  \n回到之前的例子，历史上许多逃脱尝试被第二层或第三层安全层挡住（在突破了第一层之后）。在组织环境中，接待员（第二层）可能会发现一个通过了受 `PIN code`\
  \ 保护入口（第一层）的入侵者。作为第三层防御，如果入侵者进入了办公区域，可以通过传统的锁式私人办公室、抽屉和文件柜来阻止其访问特别敏感的数据。\n\n然而，纵深防御的概念不仅限于物理安全。例如，在防御恶意软件时，你的首要目标是完全阻止其进入你的网络，因此你的第一层防御将由白名单和防火墙等措施组成。下一层防御可能旨在防止恶意代码执行，而更深的一层可能假设代码已经执行，并尝试通过分段和隔离等措施阻止其进一步扩散。\n\
  \n在考虑纵深防御的选项时，关键是要考虑你的控制措施如何被绕过。这通常要求你找到安全体系中最薄弱的环节，聪明的攻击者会发现并尝试利用它。\n\n但请注意，找到最薄弱的环节并非易事，部分原因是这取决于威胁。例如，物理入侵者而言的最薄弱环节与网络罪犯来说大然不同，与想要感染病毒的人来说又不同。\n\
  \n作为纵深防御的补充，你可以利用“瓶颈点”（choke points），强制流量（无论是人还是数据）进入更易保护的窄通道，这样你就可以集中资源。如果你知道自己的弱点在哪里，也就知道该去哪里寻找。\n\
  \n### 12.13 供应链风险管理\n\n采取相应措施，包括尽职调查和适当合同，以确保整个供应链（包括物理供应商、软件供应商和云服务提供商）是安全的。\n\n\
  **关键输出：** 用于检查共享规则和安全责任的流程和清单是充分且具有法律执行力的。\n\n即使你自身的安全措施良好（如 第 10 章 中讨论的），如果你不进行相应程度尽职调查来确保供应链足够安全，你仍然可能通过任何供应商或合作伙伴受到攻击。\n\
  \n\n\n进行尽职调查可能是购买 IT 资产与购买 IT 负债之间的区别。并购可能会引入新的漏洞，例如在收购一个未经过适当配置且可能已经被攻破的系统或网络。这种情况发生在万豪国际酒店（Marriott\
  \ International）于 2016 年收购万豪酒店集团（Starwood Hotels）时。不幸的是，万豪酒店的系统在 2014 年就被破解了，但直到\
  \ 2018 年才发现这些系统上的客户信息发生了泄露。\n\n防止 Target 或万豪酒店情况的发生，首先要在考虑收购其他机构或寻求服务提供商或供应商时知道该问哪些问题。此类问题可能包括：\n\
  \n* 该组织对其 IT 基础设施的依赖程度如何？你们未来可能关系的性质是否取决于数据传输和/或服务可用性？\n* 进行过哪些 IT 审计？审计何时进行？其可靠性如何（例如，它们是否促成了公认的最佳实践认证，如\
  \ `ISO 27001`）？你们是否能够查阅这些报告？\n* 该组织是否妥善维护其 IT 基础设施？它是否能证明这一点（例如通过适当的文档）？\n* 该组织能否提供合理的保证，确保已采取适当的技术和组织措施，以保护其\
  \ IT 基础设施以及你们之间可能发生的任何数据传输？\n* 该组织是否有已知的安全事件记录？如果有，它是否能证明这些事件不太再次发生？\n* 如果该组织无法提供此类保证，是否存在重大的安全事件风险会阻碍该组织提供服务和/或产品的能力？如果是，这是否会阻碍你们有效运营业务的能力？\n\
  * 该组织是否维护供应商清单？\n\n对于可能的合并，你可能还需要考虑：\n\n* 你将要获取的任何数据质量是否足够，并符合相关的数据保护、隐私和电子通信法？多个机构提供了相关的尽职调查清单，可以对此有所帮助。\n\
  * 将 IT 与母公司分离有多容易？如果分离不是可行的方案，你们将采用哪些替代安排？\n* IT 人员是否具备正确的技能和知识，还是你是否需要招聘和/或培训专业人员？\n\
  * 员工是否符合你们组织的安全文化？如果不符合，你是否需要投入资金进行培训，并且是否有足够的预算让他们花时间适应？\n\n### 12.13.2 审查 SLA\n\
  \n对于供应商和服务提供商，你还应该采取预防措施，仔细审查合同/服务水平协议（SLAs），确保它们提供了充分的安全和合规性保证。即使条款和条件几乎或没有谈判余地（这是很常见的），你仍然可以检查以下要点：\n\
  \n* `SLA` 是否明确了供应商和客户双方的角和职责，包括数据控制者和处理者之间的关系？\n* `SLA` 是否具体说明了包含哪些以及不包含哪些服务？\n\
  * `SLA` 是否清晰地识别了相关的基准和指标？\n* `SLA` 是否规定了争议和问题解决的流程，包括必要的升级处理流程？\n* 供应商提供哪些安全保证？公认的认证计划对于这些目的是理想的，但要注意自认证方案的局限性。这些方案不需要外部独立机构的验证，完全取决于该组织的诚实和廉洁。\n\
  \n请记住，这是一份非详尽的通用列表，更具体的检查将取决于所提供服务的性质。例如，对于云服务提供商，你需要确保你提供的数据在默认情况下是机密的。\n\n最后，请记住尽职调查和仔细审查至关重要——未能这样做可能会付出高昂代价。\n\
