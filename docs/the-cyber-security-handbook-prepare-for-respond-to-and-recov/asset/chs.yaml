  \n## 第 15 章：治理与保证\n\n验证你的安全工作，在可能的情况下进行修正和改进，并确保董事会对网络安全进行持续的监督和承诺。\n\n最后一个 CRF\
  \ 控制类别——“治理与保证”，包含了确保并展示全组织范围内对安全的持续承诺的活动。治理是关于确保项目得到恰当的监督，而保证则是向监督机构（在必要时包括内部和外部）提供证据，以便他们对此做出合理、有理的决策。更具体地说，这可能意味着将你所选择的网络安全流程成为更大结构的一部分，具有清晰的治理路线（参见\
  \ 15.4）和可见的董事会支持（参见 15.3），并处于正式的安全计划中（参见 15.1）。\n\n治理路线应当使网络安全责任和问责清晰，或许可以通过将 CRF\
  \ 的不同元素组织成由一名负责的董事或指导委员会监督的职能，而董事会支持对于确保资源和在员工中推行安全文化至关重要。最终，人是安全中至关重要的因素，如果董事会似乎没有重视安全，遗憾的是，员工也会效法。\n\
  \n当然，强有沟通是使任何形式的正式计划成功的前提：管理该计划的人需要能够向董事会解释进展和活动，而员工需要理解对他们的期望，无论他们被赋予了特定的职责，还是只需要在进行任何在线操作时保持警惕。\n\
  \n另一种在验证措施有效性的同时展示你承诺的有用手段是进行定期审计（参见 15.5）以及潜在的外部认证（参见 15.6）。定期审计还将帮助管理整体计划的人员向董事会证明所采取措施是有效的，而寻求认证可以帮助向外部利益相关者证明你的组织承诺及其安全性。\n\
  \n此外，内部审计可以指出改进之处，以确保安全措施尽可能有效并符合你的需求——毕竟不仅网络环境经常变化演，你的业务也可能随时间变化，无论是进入新市场、基础设施变更、新的监管要求或其他。来自审计报告、用户反馈、性能监控的改进措施都是改进计划的重要输入，你应该作为持续流程的一部分循环开展（参见\
  \ 15.2）。\n\n所有这些“治理与保证”活动都为网络安全计划增加了价值，也是成熟计划的必要特征。本章讨论的所有活动都有助于维持组织对安全的承诺，无论是展示结果、寻找改进方法还是两者兼顾。\n\
  \n## 15.1 正式信息安全管理计划\n\n这一元流程整合并统一了其他 CRF 流程，涉及跨组织资产安全的结构化方法，考虑了人员、流程和技术。在建立流程和实施控制时，你还需要决定如何衡量和监控其性能以验证其有效性。\n\
  \n**关键输出：** 清晰的管理结构；定义的范围；角色与职责；记录的政策和程序；衡量策略。\n\n信息安全管理计划是一种信息和网络安全的结构化方法，承认有效的安全需要一组活动协调工作以保护你的信息资产和系统。该计划应在适当的文档中将这些活动以及相关的结构、角色和职责正式（参见\
  \ 15.1.1）。该计划还应该意识到，衡量和监控这些活动的性能以确定其是否有效（参见 15.1.2）。\n\n\n\n\n你可以在项目开始时建立正式的安全计划，这有助于为实施工作提供结构支持；但你也可以选择先逐步建立所需的实践，并在将它们所有内容纳入一个正式计划之前，对谁负责什么有一个良好的了解。该计划应具备：\n\
  \n• 具有清晰的管理结构；\n• 明确了范围、角色、职责和问责制度；以及\n• 拥有所有必要的文档，包括策略、程序和记录。\n\n这些元素不仅有助于你的安全相关活动运行得更加和谐，还能帮助加强你的安全文化（参见\
  \ 12.11.5）。它还将帮助你产生审计或调查时可能需要的证据，并让你自己验证流程是否正在有效运行。\n\n### 15.1.1 创建有效的策略和程序\n\n\
  在创建新的策略或程序（或重构现有策略）时，知道从何处并不并不，但良好的起点是理解它们之间的区别以及它们是如何联系的。\n\n策略通常是提供组织对策略范围内事务的愿景进行高层次概述的文档。例如，你的主信息安全策略（参见\
  \ 12.2.1）应该明确说明组织从安全角度希望实现的状态，并列出或链接到你的安全目标。策略从宏观角度描述你对该主题的方法，概述范围（以及在适当的情况下任何相关的目标或目的），并明确谁负责在必要时批准、评审和更新它。\n\
  \n显然，策略具有益处。它们可以有效地向所有员工、承包商以及任何外部利益相关者传达组织对给定事项的立场，这有助于他们在定义的流程或程序未具体涵盖的情况下做出关于如何行动的决策。它们也是安全专业人员向董事会、高层及任何其他利益相关者描述安全价值的好方法。最后，它们也是董事会或高层展示其对该流程的承诺和领导力的良好工具。\n\
  \n然而，如果策略设计不当，也可能产生严重的局限性。它们可能过于复杂或模糊，导致难以理解，这通常会导致策略被忽视。如果策略没有得到适当沟通，员工可能也不会遵循策略，这意味着他们忘记了它，甚至可能不知道它的存在。\n\
  \n从你的策略中，你可以推导出进一步的文档，如程序和记录。程序规定了如何在特定领域落实策略。程序的主体通常是执行特定任务的逐步指令，而记录则是在遵循程序时产生的，例如显示工作站已设置并清理好可使用的检查清单，或显示网络已进行恶意软件扫描的自动日志。程序应该足够清晰，以便任何需要使用它们的人都能轻松理解由谁负责执行每个元素以及如何执行，以及将生成哪些记录。因此，它们应该由接近流程本身的人来开发——例如，IT\
  \ 团队的某人会开发设置工作站的程序，而设施经理可能会开发更改正门门锁代码的程序。\n\n只要程序是清晰的，它们对于指导和引导员工执行特定任务非常有帮助。与策略一样，设计不当的程序将不会被遵循或或被完全忽视，这可能导致员工采取无结构化的、临时的方法。\n\
  \n当你开始起草针对特定策略或程序的细节时，有几个关键点需要记住，以帮助确保它们将是有效的：\n\n• **保持你的策略和程序具有现实性 –** 显然，策略需要具有远景性，而程序需要提供指导——前者的核心思想是说明你想去向哪里，而后者则指导员工完成更具体的任务。两者都可以影响甚至改变员工行为，但它们也应该是可行的——如果它们看起来像是情况的过度理想化版本，它们就不可能有效，因为员工会觉得它们不现实或不合理，最终可能会忽视它们。\n\
  \n• **保持你的程序尽可能清晰简单明了 –** 即使你的意图是现实的，如果你的程序难以遵循（要么是因为写得不够清晰，要么是因为让一个简单的想法显得过于复杂），员工将不会发现它们有帮助，这再次导致你的程序被忽视或未按预期执行。\n\
  \n• **对于程序，获取并采纳执行程序所需人员的意见 –** 尽管担任管理职位的人员可以对他们希望如何完成工作提供见解并设定目标，但那个人并不一定负责日常任务，这意味着他们可能无法完全了解典型的方法或挑战。相反，如果管理层坚持某种特定的方法或目标，操作层员工可能建议为了实现该目标需要哪些资源变更。与多位在操作层工作的人交谈将有助于保持你的程序具有现实性并易于执行。\n\
  \n• **避免重复 –** 就像我们的 CRF 有流程重叠一样，给定组织内的文档也会有重叠。考虑一个程序可能与另一个程序相互作用的地方，并确保它们不会以相同的方式覆盖相同点。如果你发现了这种情况，可以通过以下方式消除它们，例如仅保留文档\
  \ A 中的该部分，并在文档 B 中替换为对文档 A 的引用。这避免了精力的浪费，还防止了该流程仅在两个文档之一中更新的可能性，从而避免后续出现混乱。请记住，所有文档都应该有一个文档控制部分以跟踪更改。\n\
  \n• **定期评审和更新你的文档 –** 程序几乎总是随着时间的推移而演变，因此应该定期评审并在必要时更新。策略可能随着时间需要改变，尽管不像程序那样频繁，因此需要的评审频率较低。在这两种情况下，每份策略或程序都应该指定维护该特定文档的角色。因此，该人员还应该确保定期评审程序（或策略），以符合业务和监管要求。\n\
  \n除了定期评审（理想情况下至少每年一次），鼓励员工——特别是那些较新因此更有可能带来宝贵新视角的员工——在适当的情况下挑战现状并提出改进建议也是重要的。\n\n\
  ### 15.1.2 测量\n\n即使假设你带着良好的意图开始实施项目并对实施哪些措施做出了正确的决定，任何项目都可能在没有可见、清晰结果的情况下无声无终，特别是当这导致资源减少时。\n\
  \n遗憾的是，衡量安全的有效性很容易——除非它失败了。缺乏量化指标可能会使得向董事会和高层证明你所实施的措施是有效的具有挑战性。尽管如此，仍然有展示清晰结果的方法，包括但不限于：\n\
  \n• 展示风险评估结果，显示风险处理前后的风险水平（另见 12.12）；\n\n\n\n\n\n-   比较连续漏洞扫描的结果，以评估漏洞数量和重要性随时间发生的变化（另参见\
  \ 13.1.2）；\n-   渗透测试报告（另参见 13.1.3），用于展示诸如：\n\n![image](img/cir.jpg)“攻击者”（特别是依赖自动化工具的攻击者）没有\
  \ way 进入系统；\n\n![image](img/cir.jpg)漏洞已得到有效修复（通过连续测试）；或\n\n![image](img/cir.jpg)员工意识培训已证明有效（通过模拟社会工程测试）。\n\
  -   事件响应演练报告（另参见 14.1.2），用于指示是否满足了目标时间——该时间可能受法律违规通知要求的的影响；以及\n-   监控网络的攻击尝试（另参见\
  \ 13.2）——检测到大量失败的攻击说明你的检测措施（它们检测到了攻击）和预防措施（攻击未成功）都已正确实施。\n\n无论你打算如何进行衡量，都应该在选择控制措施时决定你的方法。建立基准也是重要的——根据控制措施的不同，基准可以是定性的或定量的——以便进行清晰的比较。你还应该对自己的目标、目的和要求有明确的认识，这将有助于解释衡量结果，并突出表现良好的领域和改进的机会。\n\
  \n最后，请记住，没有必要绝对地测量每一个事物来获得有意义的结果并看到清晰的投资回报。请优先考虑那些直接与你的目标相关风险最大、最可能失败、以及实施、维护和/或修复成本昂贵的控制措施。\n\
  \n在我们的实施网络安全的八步法第 8 步中进一步讨论了测量（参见 第 25 章）。\n\n## 15.2 持续改进过程\n\n安全措施应该在持续、循环的改进过程中进行定期审查，并在必要时进行改进或调整。\n\
  \n**关键输出：** 现有流程的正式审查和计划阶段，最好还能增加正式的“经验教训”过程。某些组织可能还希望采用更广泛的改进模型，或扩展已使用的模型以包含网络安全。\n\
  \n持续改进应该是任何组织运营中关键且频繁的一部分，无论是为了提高产品质量、流程效率、削减成本，还是任何可以帮助你的组织开展业务和运营的方法。然而，一个持续改进过程远比企业为提高韧性或盈利能力所做的一般努力得多。这在网络安全背景下尤其如此。\n\
  \n组织的网络安全策略往往由于非常充分的原因而容易变化——例如，当威胁格局发生变化时。然而，你的网络安全需求也因为其他原因发生——例如，如果你为了赢得一份大合同需要通过安全审计，或者新的安全法生效。\n\
  \n同样，可能会出现你被迫适应和创新的意外情况，反过来可能要求更新你的网络安全策略。一个特别极端的例子是对 COVID-19 疫情的全球应对，这要求世界各地的人留家里，许多企业让员工远程工作。从网络安全的角度来看，这需要采取迅速行动确保人们可以从家里安全工作，并可能从他们的个人设备工作——这两点本质上比办公室网络和环境更安全。\n\
  \n当你的网络安全策略、目标和/或需求发生时，建立持续改进过程可以帮助你完成必要的适应和变化。对于更多的持续变化（例如适应威胁格局），建立循环、持续的改进过程意味着你可以进行定期的、微小的更改，从而显著降低在突然需要通过巨大的更改来追赶进度时产生巨额成本的风险。\n\
  \n一个正式的、持续改进过程（在此过程中你保持更改小而频繁）也是将你的网络防御逐渐变为更成熟模式的绝佳方式，同时保持你的实施项目的可控性。这在我们的八步法第 5\
  \ 步中进行了更多讨论（参见 第 22 章）。\n\n### 15.2.1 改进倡议的输入\n\n改进想法和建议可以来自任何人，包括但不限于员工、客户、合作伙伴、供应商、监管机构和审计师。改进倡议的输入也可能源于审查、审计、“经验教训”活动、纠正措施等。\n\
  \n至关重要的是，不要仅仅依赖人们主动采取行动或其他临时方式获取输入。设置“意见箱”无害，但为了保持改进的持续性和可控，一致性是关键。这意味着将持续改进活动整合到你现有的流程中——如果审查和计划阶段变成常态，并将改进机会作为其中的一部分被识别和实施，那么你就很好地朝着你应该追求的循环持续改进过程迈进。\n\
  \n### 15.2.2 实施持续改进过程\n\n如果你的组织已经使用了持续改进方法论，最简单的方法就是将其扩展到包含网络安全倡议。然而，如果没有正式流程，将持续改进原则应用于现有流程可能更合理，稍后考虑采用正式的持续改进模型（其中两个在\
  \ 15.2.3 和 15.2.4 中进行了讨论）。\n\n你可以通过以下方式实现，例如在流程中引入正式审查阶段，如在项目完成以及完成后两个月后进行评估——项目是否实现了预期目标？是否在预算内并按时完成？回答此类问题——并在回答为否定的情况下，确定哪里出了问题以及如何防止错误再次发生——并跟进必要的更改，应该提高未来项目的成功概率。或者，如果一切都如预期般发生，这种审查让你能够断定该项目确实是成功的，这反过来表明对未来的项目不应做过多更改。\n\
  \n现有流程也将从整合正式计划阶段中受益，这些阶段应该考虑来自过去审查（以及审计）的反馈，确保改进不仅被提出，而且得到了实施。同样，如果审查发现很少有需要更改的地方，这将使你能够快速且自信地完成新项目的计划阶段。\n\
  \n拥有一个“经验教训”过程也是明智的，其中共同查看一段时间内所有审查的反馈和响应以识别模式或趋势，反过来可以导致新的改进倡议。\n\n### 15.2.3 计划-执行-检查-处理\
  \ (PDCA) 循环\n\n一种非常广泛使用的持续改进方法是 PDCA 循环或模型，如图 图 3 所示。它为持续改进发生提供了一个迭代过程，并往往形成许多管理系统的基础。\n\
  \n![image](img/pg263-01.jpg)\n\n**图 3：PDCA 循环的基础视觉化**\n\n\n\n\n\n该理念是，首先明确确定你打算做什么（`Plan`）——为了符合你的政策，需要哪些目标和流程？你是否需要根据上一个周期的反馈进行更改？\n\
  \n接下来，执行你计划的内容（`Do`），然后根据基准对输出进行监控和测量（`Check`；有关测量的更多信息，请参见 15.1.2）。测量结果应当进行报告和审查，并据此采取任何必要的纠正措施（`Act`），从而不断持续改进。\n\
  \n### 15.2.4 ITIL® 4 的持续改进模型\n\nITIL 4 是一种流行的 IT 服务管理（ITSM）框架，其持续改进模型包含的步骤比 PDCA\
  \ 循环多，但本质区别并不大。该模型是一个高层次的七步循环，旨在帮助组织从 ITSM 视角建立其当前和目标位置（尽管你也可以将其扩展到组织的其他部分）。它还可以帮助组织规划如何实现目标，以及如何嵌入成功的变更（或从失败的计划中汲取教训）。\n\
  \n这七个步骤如下：\n\n**1. 定义倡议的愿景：**\n这将有助于后续决策，并将行动与组织的整体目标和宗旨联系起来。\n\n**2. 了解你的起点：**\n\
  为了跟踪和理解你的改进，你需要知道从哪里开始——从各个方面评估产品、服务等的现状，最好通过客观测量来进行，这些测量也可用于第 6 步。\n\n**3. 概述你的目标应该是什么样的：**\n\
  定义目标同样重要。记住，你的目标不需要完全实现你的愿景，只需朝着它迈进，而且它是具有启发性的。换句话之，记住目标是改进，而不是达到完美。（无论使用何种方法论，这一点都值得记住！）\n\
  \n**4. 规划行程：**\n如果目的地相对于起点只需要微小的变化，那么行程应该是直接且简单的。如果需要更复杂的变更，可能值得将工作拆分为较小的努力并评估进度，在每次迭代后可能改变方向。\n\
  \n**5. 执行计划：**\n采取计划的行动，但要保持开放的心——特别是当工作被拆分成较小的努力时，你可能需要改变方向以到达目的地。\n\n**6. 检查你是否已到达理想目的地：**\n\
  检查并确认取得了哪些进展（理想情况下使用你在第 2 步中使用的相同的测量机制），以及你所取得的仍然具有价值（毕竟，客户预期等因素可能会变化）。如果其中或两者均不如此，你可能需要采取额外行动。\n\
  \n**7. 将变更嵌入组织：**\n为了保持势头并防止任何改进被反复，要推广你的成功并强化任何新方法。如果倡议失败，请分析问题所在，记录并传达教训，从而提高下一次迭代成功的概率。\n\
  \n第 7 步反馈回第 1 步，重新启动循环。注意，该模型是灵活的——不要求组织严格遵循这些步骤，而是根据其文化和目标进行调整，以确保其项目成功率的提高。90。\n\
  \n## 15.3 董事会的承诺与参与\n\n考虑到网络安全已成为日益重要的业务先决条件，泄露的潜在影响以及通过自上而下的方法使网络安全实施项目成功的需求，董事会和/或高级管理层应当对网络安全产生积极且可见的兴趣。\n\
  \n**关键输出：** 董事会和/或高级管理层通过分配充足的资源，并在必要时为网络安全工作提供方向和支持，显性地重视网络安全。\n\n根据安永集团 2020 年的一项研究，只有\
  \ 54% 的组织定期将网络安全列为董事会议的议程项目，更少的组织（40%）在董事会或执行管理层级设有网络安全负责人。91。\n\n过去，网络安全被认为主要是\
  \ IT 部门的问题。然而，在技术构成业务不可或缺的一部分的世界里，确保技术按预期运行是组织战略的一部分，因此这是董事会的事。组织在内部和外部交付 IT 服务的优劣直接影响客户的满意度，从而影响整体业务的成功。\n\
  \n事实上，拥有可靠和安全的服务的声誉可以帮助组织在颖颖而出，并成为产生收入的积极手段。2019 年的一项研究发现，特别是在经历糟糕体验后，消费者愿意为物联网设备的基础价格支付\
  \ 10–30% 的溢价，以换取隐私受保护的安全感。92。能够表现出对网络安全的明确承诺也是赢得新业务（特别是政府合同）日益常见的先决条件。\n\n此外，网络事件的可能影响和成本现在比以往任何时候都更加严重。不仅有越来越多的让组织可能面临巨额罚款的法律——最著名的是欧盟\
  \ `GDPR`——而且数据泄露和网络攻击现在往往会获得更多的媒体报道。反之，这可能导致重大的财务和声誉损害，例如服务不可用、失去客户和合同、股价下跌和竞争优势丧失。\n\
  \n### 15.3.1 确保董事会的承诺\n\n确保董事会和高级管理层对任何网络安全项目的承诺至关重要，因为没有，实施将由于资源不足和缺乏组织范围内的承诺而失败——如果员工看不到高层管理重视安全，他们也不可能重视。\n\
  \n由于泄露的可能影响如此巨大，人们可能会通过简单引用合作伙伴和竞争对手经历的真实案例来使用冲击策略来说服管理层。如果你确实使用了这些案例，请注意适度使用，因为它们在经理看来往往是极端且不太可能发生，并导致他们直接拒绝接受。与其过度关注这些事件，你应该清晰地强调：网络安全是竞争业务日益重要的先决条件，而且他们的可见支持对于任何网络安全计划的长期成功至关重要。\n\
  \n此外，值得提醒董事们，根据英国 2006 年《公司法》第 172 条 (1) 款（以及其他司法辖区的相应法律），他们有义务考虑`任何决策的长期后果`，以及`公司维持高标准业务准则声誉的愿景`。\n\
  \n### 15.3.2 展示董事会支持\n\n\n\n\n\n董事会可以通过不同的方式展示其对网络安全的承诺，尽管主要的两种方式是提供适当的资源以实施和维护安全，以及指导和支持人员。然而，后者根据组织的不同以非常不同的方式体现；例如，高级管理层可能会：\n\
  \n• 设定相关目标并将其整合到业务流程中；\n• 签署信息安全政策（参见 12.2）；\n• 目而可见地遵守安全最佳实践，并在有人认为可以改进时乐于接受挑战；\n\
  • 定期就网络安全的重要性以及组织正在采取的措施进行简报汇报；\n• 为网络安全培训材料提供主旨演讲或介绍；\n• 通过与运营层经理沟通其顾虑，识别实施过程中可能存在的障碍，并寻找克服这些障碍的方法；以及\n\
  • 审查内部审计结果（参见 15.5）并提出改进建议（参见 15.2）。\n\n请记住，关键在于`visibly`地遵守公司政策、推广最佳实践、支持基层员工等。如果董事会只在闭门后提供指导，或将其责任委托给他人，那么董事会支持的许多收益将失去或无法充分发挥潜力。\n\
  \n在董事会通常不是亲力亲为类型的情况下，高层管理应承担展示网络安全高层支持的责任，并在必要时指导和支持。\n\n## 15.4 治理结构与流程\n\n由于组织\
  \ IT 产品和服务的有效性和可靠性通常对组织的业务能力具有明确的战略意义，因此，知识资本和 ICT 应当由其治理机构进行监督。\n\n**关键输出：** 确定的董事对组织的\
  \ IT 产品和服务交付负责，并定期评估、指导和监控 IT 相关活动。\n\n通用的公司治理职责和原则（如设定战略目标、监控绩效和与股东沟通）已广为人知并执行。然而，将这些原则扩展到\
  \ IT 领域的情况并不常见。尽管，它们本应如此。IT 不仅仅是一个功能性或运营问题——知识资本和 ICT 对绝大多数组织都具有明确的战略意义。如果这些效率低下或直接受到破坏，将影响组织的业务能力——唯一的问题是严重种程度。\n\
  \n### 15.4.1 核心 IT 治理实践\n\n至关重要的是，董事（或指导委员会）应当：\n\n• 定期**评估**当前和未来的 IT 使用情况，以及网络安全措施的有效性——这包括策略、实施计划、供应安排等，并应考虑技术变化、威胁态势、经济和其他趋势以及政治气候等外部压力；\n\
  • 通过向管理层和 `CISO` 分配落实来实施 IT 和网络安全计划及政策的职责，进行**指导**工作。董事还应确保他们掌握最新信息，以便能够确保 IT 和网络安全项目平稳过渡到运营阶段，显著提高成功率；以及\n\
  • **监控**与 IT 和网络安全相关的活动绩效，理想情况下，应通过管理层的更新和内部审计（参见 15.5）相结合，使董事能够及时收到信息，以便在出现任何问题时迅速采取行动。\n\
  \n必须记住，即使在行动被委托的情况下，有效、高效且安全地交付 IT 服务的最终责任仍在于董事会。还有一些需要遵循的最佳实践原则，这些原则将有助于指导 IT 治理方面的良好决策：\n\
  \n1. **责任** – 承担 IT 和网络安全相关责任的人员必须拥有执行其所负责活动的权限。\n2. **战略** – 组织的整体业务策略应考虑当前和未来的\
  \ IT 能力，IT 和网络安全策略应考虑业务需求。\n3. **采购** – IT 和安全投资的决策应清晰透明，平衡成本与机会，并对短期和长期风险有清晰认识。\n\
  4. **绩效** – IT 产品和服务服务，以及网络和信息安全措施应符合用途。\n5. **合规性** – IT 资产和流程应符合所有相关的法律和合同要求，包括安全角度的要求。\n\
  6. **人类行为** – IT 和安全政策、实践和决策应尊重人类行为。\n\n## 15.5 内部审计\n\n组织的信息安全措施会定期对其有效性进行独立审查，以确保其符合用途并运行正常。审计结果由高级管理层进行审查和评估。\n\
  \n**关键输出：** 一项由公正审计员客观执行的定期内部审计计划，结果报告给管理层。\n\n内部审计是独立验证组织安全措施的有效手段，也是任何持续改进的要素要素（参见\
  \ 15.2）。在某些情况下，它也可以是合同或法律要求，尽管开展定期审计本身就是一项有价值的活动。\n\n审计员应检查以下点：\n\n• 是否有适当的文档，包括政策、流程和记录（另见\
  \ 15.1.1）？\n• 政策、流程和程序是否反映了现实，是否使用正确（或是否使用了）？\n• 是否进行了适当的风险评估（参见 12.12）。这保证了公正性，可以获得更好的专业知识并可能降低成本，还可能提高对审计结果的接受度（听从一个专门请来进行审计的毫无疑问的独立方的批评，通常比听从一个可能被认为有个人倾向的人的批评更容易，无论事实如何）。\n\
  \n\n\n\n\n除了公正性，审计的另一个关键特征是客观性。为此，证据是必不可少的。没有证据，审计结果将可能包含一些推测、臆断或假设。功能性审计所需的证据取决于审计的类型和被审计的功能，但通常情况下，审计人员看到这些证据并在报告中记录下事实就足够了——证据本身不需要被记录。然而，报告应由事实和客观的陈述组成，例如“发现五个\
  \ IT 流程已过时”或“事件报告流程未被执行，因为根据对被审计方的访谈，该流程已无法反映 2019 年 8 月 1 日引入的系统变更”。推测和臆断在此类报告中没有立足之地。\n\
  \n### 15.5.2 审计流程\n\n许多审计人员首先会要求查看您的文档，包括政策、程序和记录，因为这些文件指示了*应该*发生的情况。随后，审计人员将检查或让被审计方演示相关流程，以查看实际情况是否与文档说明相符；任何差异之处都会被记录为不符合项。\n\
  \n另一种常见的审计开始方式是访谈：审计人员可能会要求被审计方详细说明流程，这可以在他们检查任何文档之前就凸显出重大的差异。\n\n无论采取何种方式，请注意审计始终是基于抽样的——检查所有内容是不可能的。尽管审计有用，但从某种程度上，它们仍然是一个依赖于概率的过程。在特定的一天对特定组织进行审计，取决于当天执行的活动，可能会发现多个不符合项，也可能完全没有。因此，某次审计中没有不符合项并不意味着它们不存在。良好的审计表现，即使在较长的一段时间内，也不应作为放宽最初导致良好审计表现的措施的借口。\n\
  \n为了保持一致性并减少漏掉任何内容的风险（特别是对于详细审计），审计人员可以准备清单，这些清单可以基于组织的实施计划、风险评估或处理活动列表。只要有有效手段对高风险或高影响领域进行优先级排序，其中任何一种都是合适的；否则，审计将变成一项几乎没有实际意义的“勾选游戏”。审计人员还可以根据例如\
  \ NCSC（英国网络安全中心）或 ICO（信息监管办公室）发布的最佳实践指南，或特定的法规或管理体系标准来准备清单。\n\n然而，清单也有缺点，主要是因为它们可能会产生人为的限制。如果审计人员死板地遵循他们的清单，可能会错过深层挖掘他们所遇问题根源的机会。那些不强烈依赖或完全不依赖清单的人，会发现在审计期间更容易花时间深入调查某些问题，而不是记录下初步观察结果就继续进行。缺乏这种灵活性可能是一个严重的缺陷，因为确定的不符合项应该追溯到根本原因，即使这需要时间并/或会涉及业务的其他领域。\n\
  \n此外，请注意，即使是不依赖预先准备的清单的审计，也必须针对*某些标准*进行——毕竟，不符合项是不符合某种要求的事项。无论是特定法规还是组织的处理活动列表，必须有某种基础或要求集，以识别不符合项，或者以此准备清单。通过经验，审计人员将学会要寻找什么，特别是在他们已经熟悉的组织内部，因为他们知道失败的关键点在哪里。\n\
  \n记录不符合项后，必须发布纠正措施来减轻其影响。在不符合项显而易见的情况下，审计人员应该能够自己定义纠正措施。然而，在许多情况下，被审计方需要提供意见，因为他们通常最清楚问题所在以及如何缓解它。如果之前的审计中有不符合项（或改进机会）的记录，则应检查这些记录以确认纠正措施已正确实施。\n\
  \n### 15.5.3 审计计划\n\n由于识别改进空间是审计的关键结果，并对随时间推移不断改进您的措施和流程具有整体视角，因此审计作为一次性活动进行的意义不大。建立定期审计计划可以允许您在较长的时间内识别趋势并衡量进度。增加审计频率也将让您有机会及时发现不符合项，避免问题以外部可见的方式显现（这种情况下修复成本通常更高）。\n\
  \n假设您的目标是每年审计一次，您不需要一年内一次性完成整个审计。将审计拆分（例如按部门划分）可能会证明更方便。这种方法还可以更快速地检查纠正措施。只要您在一年内进行过完整审计，这种方法就是完全有效的。\n\
  \n您的审计计划理想情况下按风险最小化的频率安排审计——所有关键要求都应被涵盖，但高风险、频繁使用和/或频繁变化的流程应该更频繁地审计，以降低问题长期被忽视的风险，这可能导致严重后果。同样的逻辑，不经常使用的高层政策和流程在短期（甚至中期）内发生重大变化的概率较低，因此您可以降低对这些内容的审计频率。然而，当任何流程发生重大变化时，应在下一次审计中涵盖，以确保变更是有效的。\n\
  \n将计划审计与间歇性的无计划审计交替进行也是明智的，在这种情况下，被审计方没有在审计前几天——专门为了审计——更新其文档的机会。这将对各个业务部门的真实日常运行提供最佳洞察，并最有可能发现并修复不符合项。\n\
  \n### 15.5.4 向管理层报告\n\n高层管理应审查并评估审计报告（或摘要），特别关注可能产生重大财务或战略影响的发现，因为这些可以作为组织运营情况的有价值独立信息来源，且没有运营经理报告的偏差风险。它还可以告知他们，为了解决持续问题的根本原因，可能需要对业务的特定部分投入额外资源。\n\
  \n\n\n\n\n**核心输出：** 根据您的安全需求和目标，决定是否追求外部认证。\n\n自然地，在不寻求某种形式的外部验证的情况下，建立卓越的安防措施是完全可能的。组织可能会选择这样做，例如为了节省资金，或者因为他们认为受限于特定框架并无无益益处。下文的\
  \ 15.6.1 和 15.6.2 分别讨论了这些考量；然而，认证是否为追求的正确途径是每个组织需要根据其安全目标独立做出的决策。\n\n如果你确实决定要利用广泛认可的框架，本书的第\
  \ 5 部分），而供应商合同要求 `ISO 27001` 认证的情况（参见 28.2）也变得越来越普遍。此类计划的理念是，组织不仅是安全的，而且还向外部独立第三方证明了这一点。\n\
  \n从长远来看，能够有信誉地证明你重视安全这一事实，可能成为赢得新业务的决定性因素。它证明了你不仅仅是另一个在安全上口头造兵的组织——这种做法可能极端到宣称某些具体内容，例如声称提供端到端加密——结果这些说法在后期阶段被拆穿。Zoom\
  \ Video Communications 就是一个例子：随着越来越多高风险漏洞被公开，反驳了该公司重视安全的说法，Zoom 遭到了日益越来越多的知名机构的冷落或直接封禁，这些机构包括美国国防部和渣打银行。⁹⁵\n\
  \n此外，为了你自己的心安，能够通过外部审计这一事实可以与本“治理与保证”en 章中讨论的其他活动一起，帮助验证你的安全努力。实际上，一个广泛认可的框架可以为你提供一个衡量自身措施的基准。\n\
  \n### 15.6.2 灵活性考量\n\n某些组织可能希望避免被特定框架束缚，因为他们不想实施不需要的控制（例如），或者不想冒失去首要目标的风险：即增强业务性能的安全措施，而不是为了合从某些框架而没有建立起真正的安全文化。\n\
  \n这些考量是合理的，并展示了对认证计划潜在陷阱的理解——过度关注实现合规，以至于整个过程变成了一种“打勾式”的任务，而不是开发一个根据你组织需求和要求的安全计划。然而，在早期阶段意识到这种风险更容易避免隧道视野。\n\
  \n此外，通过可用计划范围的组合以及它们倾向于灵活的特点，这种风险比你想象的要小——毕竟，许多计划要求某种形式的风险管理，其理念是让你只处理针对你组织的特定风险以实现合规。在此基础上，许多标准仅在高层面上具有规定性，留下了阐释的空间，使组织能够根据其需求和情况适地予以实施。\n\
  \n⁹⁰ `ITIL®` 是 AXELOS Limited 的注册商标。保留所有权利。有关更多关于 `ITIL 4` 的信息，请参见 ITGP 的出版物 `ITIL®\
  \ 4 Essentials – Your essential guide for the ITIL 4 Foundation exam and beyond,\
  \ second edition`：`[https://www.itgovernancepublishing.com/product/itil-4-essentials-your-essential-guide-for-the-itil-4-foundation-exam-and-beyond-second-edition]`。\n\
  \n\n\n\n持续地定义成熟度水平将使你更容易将当前状态与理想目标状态（在我们八步法中的第 4 步）进行比较，让你清晰地概述最大的“差距”在哪里。反之，这些信息将指导你的项目计划。\n\
  \n如果你的当前状态与理想目标状态之间存在巨大差距，你可能希望采用迭代方法来实现成熟度（持续改进模型可以帮助这一点；请参见 15.2）。\n\n### 16.1\
  \ 确定目标成熟度水平\n\n在确定特定 CRF 流程所需的成熟度时，你应该首先评估对该流程的需求。例如，如果合同对`encryption`的使用规定了特定的一致性，这将决定你需要达到的成熟度。\n\
  \n同样，贵组织对网络安全的要求（将在我们八步法的第 2 步中建立；参见第 19 章）将帮助确定整个计划所需的成熟度。\n\n至关重要的是，你的需求以及由此衍生的安全和项目目标构成了你在理想目标状态中设置的成熟度水平的基础。\n\
  \n## 第 4 部分：实施网络安全的八步\n\n## 第 17 章：引入 IT 治理八步法\n\n本书的这部分解释了你如何使用 CRF 来引导你的网络安全项目。这种八步法是基于最佳实践以及我们经过验证的信息安全管理系统\
  \ (ISMS) 实施方法汇而成的。\n\n然而，你可能对实施此类项目有不同的偏好方法，或者你可能想对我们的八步法进行微调。例如，如果你只是想实现网络安全，并且没有特定的法律或合同要求的压力，那么先进行风险评估可能更好（第\
  \ 6 步，参见 23）。\n\n同样值得重申的是`良好的开端是成功的一半`（参见 21, 3）。\n\n## 第 18 章：第 1 步 – 启动项目\n\n\
  复杂项目的失败是因为这三个项目变量中的一个或多个识别和/或管理不当。范围蔓延是项目失败最常见的根源之一。因此，项目章程寻求明确识别项目范围并确定这三个变量，以支持有效的项目治理过程。（在我们八步法中，范围在第\
  \ 3 步最终确定，参见 20。）\n\n### 18.1 项目章程\n\n项目章程是你应该编写的第一份文档。它始于对你想要实现的陈述，并将获得领导团队的批准。从项目开始开始，记录所有内容至关重要。在此阶段建立项目章程，即使你还无法提供许多细节，也将帮助你记录所有的决策（参见\
  \ 15.3）。\n\n你的项目章程应涵盖以下四点：\n\n-   **交付物**：识别为什么网络安全对你的组织至关重要，以及你希望从实施项目中获得什么。目前，只需确定你最初启动这个项目的原因足够了——在第\
  \ 2 步（第 19 章）中，你将更具体地识别你的需求和目标并对其进行记录。\n-   **时间表**：创建一个项目计划草和目标完成日期。\n-   **预算**：识别项目所需的内部和外部资源。\n\
  -   **准许继续**：章程应包含管理层对项目的认可以及允许使用预算资源实现既定目标的授权书。\n\n### 18.2 项目团队\n\n\n\n\n\n在编制项目前期文档时，你应该已经确定了项目负责人将是谁。在此阶段，理想情况下你应该开始为项目创建一个\
  \ RACI 矩阵。该矩阵可以确定在关键项目决策以及正在制定的各项网络安全管理过程中，谁应该是 `R`ible（执行）、`A`ccountable（负责）、`C`onsult（咨询）和\
  \ `I`formed（知会）。\n\n项目团队应由能够代表组织每个关键部门利益的角色组成；这并不意味着组织的每个部分都必须被直接代表，因为那几乎会创建一个庞大且难以管理的团队，而是团队中的每一个人都应该意识到他们需要维护谁的利益。\n\
  \n理想情况下，邀请代表不同组织职的人员应该是他们中最资深、最有经验且最受尊重的人。如前所述，有效的网络安全需要一种安全文化（参见 12.11.5）。在刚开始开展网络安全时，这几乎需要文化转变，尽管程度取决于组织。至关重要的是是将最能够代表和阐述组织关键部门需求和忧切的人士纳入工作小组。如果没有他们的参与，网络安全措施可能无法获得有效开发和实施所需的支持。\n\
  \n显而易见，团队还应该至少包含一名经验丰富的项目经理，他负责跟踪并根据计划目标报告进度。\n\n至关重要的是，平衡是重要的。一个有效的网络安全计划取决于组织中的每个人都能理解并应用其控制措施；如果项目团队由大部分非技术人员组成，它更有可能产生让组织中每个人都能理解的内容。\n\
  \n除了项目团队对内部利益相关者的代表外，请记住还有对你组织网络安全有共同利益的外部利益相关者，例如客户、合作伙伴、供应商、监管机构等，他们可能会影响你的需求和/或流程。项目团队成员需要能够识别这些利益相关者的需求。在项目启动时就应该识别出利益相关者，并随着实施项目的进展和相关外部方的变得更加明确，使列表变得更加具体。\n\
  \n项目团队应直接向高层管理人员汇报或（最好）向 CEO 汇报，并应拥有实施项目计划的适当授权。\n\n### 18.3 项目领导力\n\n除非 CEO 亲自领导项目，否则项目负责人应寻求以下积极支持：\n\
  \n• 要求 CEO 务必理解追求网络安全策略带来的业务效益，以及该项目将为组织实现的投资回报率。\n• 要求 CEO 领导向董事会进行关于网络安全策略的演示（由项目负责人准备），将主要项目目标纳入组织当年的业务目标中，确保董事会对项目任务书中述的目标提供支持，并安排董事会在项目的整个生命周期内对项目进度进行持续监控（这将确保项目获得并维持能够提高其成功率的政治地位）。\n\
  • 要求 CEO 亲自领导向组织高层管理人员进行项目演示（由项目负责人准备），并通过通过用于员工沟通的组织论坛向所有员工进行演示，并为组织内包括高层管理人员在内的每个人明确设定该项目的优先级，以及项目负责人寻求所有对项目成功有至关贡献的人士的投入和参与的权限。\n\
  • 要求 CEO 以身作则，应用所有将成为新网络安全计划一部分的工作实践并遵循所有程序，并且如果员工认为 CEO 没有遵守某项程序，则欢迎他们的挑战。\n\n\
  ## 第 19 章：第 2 步 – 确定需求和目标\n\n可能某个特定需求促使你的组织启动网络安全项目，并使你阅读这本书。然而，既然你现在正启动一个全面的网络安全计划，那么超越催化因素并观察大局是非常重要的。\n\
  \n你必须满足哪些其他法律和/或合同要求？是否有你需要考虑的行业特定要求？你的竞争对手和合作伙伴正在做什么？客户期待什么？为了确保你可以经营，必须提供哪些关键产品和服务？对于一个真正有效且可持续的计划，你的业务需求必须与法律、合同和行业特定需求一起考虑。只有这样，你的网络安全计划才能成为产生收益的积极手段，而不仅仅是一项合规支出。\n\
  \n### 19.1 项目目标与网络安全目标\n\n一旦你建立了必须满足的全范围需求（无论是外部强制要求的还是为了实现业务目标的），你就可以将其作为定义和记录你的目标的依据。这些应该区分项目目标和网络安全目标。\n\
  \n项目目标指的是诸如在特定时间内范围内符合法律法规或合同的要求等事项。它们也可能指符合特定的规范、标准或框架，例如 `Cyber Essentials` 或\
  \ `ISO 27001`。换句话说，项目目标专门与实施网络安全的业务效益挂钩。此类目标通常是高层级的，并且容易跟踪。实现这些目标的责任在于组织的顶层。\n\n\
  网络安全目标可能与项目目标相关，但并不一定相关。网络（以及信息）安全目标无疑与信息和 IT 资产的 `CIA`（机密性、完整性和可用性）保护以及组织的风险承受能力有关。实现安全目标的进展必须是可衡量的，这意味着目标本身需要是、可衡量的、可行的、现实的有时限的。\n\
  \n例如，目标可能是将安全事故数量从每年 `14` 次减少到两次，或将网络可用性从 `97%` 和 `20×7×360` 提高到 `99.9%` 和 `24×7×365`。此类目标将被分解为更层次的目标，并将实现目标的责任分配给组织内部相应的部门和级别。\n\
  \n\n\n\n\n对于中小型企业而言，决策应当是果断的：涵盖整个组织。这是因为企业内部的所有信息系统与日常工作关系之间可能存在硬性连接，这使得试图将业务的某部分与另一部分隔离开变得极其困难或不切实际。\n\
  \n“隔离”的概念是有效范围确定（scoping）的核心：最终，你将尝试在项目范围内的业务部分与其他所有部分之间建立一道坚不可摧的屏障。你必须对哪些在你的信息堡垒内部、哪些在外部做出明确界定——任何信息系统、设备或业务部门都不应既在内部又在外部，因为那将成为你墙上的弱点。\n\
  \n随着远程办公变得日益普遍，你的防御边界必须运行到个人设备层面，并高度依赖用户对业务流程的合规性。换句话之，你的范围确定决策需要包含人们在工作中使用的所有信息设备——无论是笔记本电脑、智能手机还是平板电脑——以及更明显的中央办公室系统，如会计、支付处理、生产、销售和订单管理、电子邮件、办公自动化等。务必也考虑相关的云组件。\n\
  \n## 第 21 章：第 4 步 – 定义当前状态和理想目标状态\n\n大多数组织已经采取了一些网络安全措施——这些措施可能并不充分，或者没有达到应有的效果，但要点在于，你几乎肯定不是从零开始。因此，了解你的当前实践与目标状态之间有多大差距至关重要。\n\
  \n在此之前，你必须定义当前状态和理想目标状态，以便它们能够相互进行比较。`CRF` 可以让这项任务变得更容易。\n\n### 使用 CRF\n\n`CRF`\
  \ 对此过程最相关的部分是对流程的全面选择（在本书的第 3 部分中详细讨论）以及不同级别的成熟度（参见第 16 章）。该框架意识到，很少有组织需要其中的每一个流程，而且你需要的流程对于你的目的可能不需要非常成熟。\n\
  \n这种程度的细节和灵活性意味着该框架是帮助你定义当前和目标状态的有效工具。同时，清晰定义的成熟度级别可以使你的两种状态之间进行简单且一致的比较。\n\n附录\
  \ 2 提供了一个项目计划模板，你可以用它在“当前状态”（Current state）列中指示你已经具备哪些控制措施以及达到何种成熟度。在最后一行中，你应该指示你整体当前的成熟度。\n\
  \n在“理想目标状态”（Ideal target state）列的最后一行中，你也可以指示你打算实现的整体成熟度——你应该能够根据第 2 步中定义的目标（参见第\
  \ 19 章）推导出此。当你的目标足够具体（例如符合特定定义的要求的集，如 `PCI DSS`），你也可以开始为单个控制措施填写目标成熟度。\n\n如果你只是希望实现网络安全，而不一定受特定法律或合同要求的驱动，可能先先进行风险评估（第\
  \ 6 步）并据此选择控制措施（第 7 步，第 24 章），然后利用这些来完善你的项目计划。\n\n### 缺口分析\n\n在你在单个流程层面建立了当前状态和理想目标状态之后（也参见附录\
  \ 2 和 15.2.4 中进行了更深入的讨论。\n\n然而，持续改进不仅仅是你项目结束时才做的事情。对于复杂的项目（网络安全很有可能是），它可以作为一种循序渐进实现的有用方法，在每个步骤之间进行简短回顾，以确保你朝着正确的方向前进且目标状态仍然有效。96\n\
  \n为了在剩余项目中实现循序渐进、可控的方法，你需要在进行风险评估和开始实施之前确定你的持续改进方法。利用第 4 步的缺口分析输出（参见第 21 章）作为起点，并思考如何将工作拆分为步骤或阶段。在你进行风险评估并选择控制措施之后，你可以进一步详细说明工作计划，优先考虑重要的高风险领域。\n\
  \n确保定期审查你的工作并纳入改进计划，将进度记录在持续改进日志中。应向管理层展示中期结果，让他们看到正在取得进展，并继续获得他们的支持。96 当然，承诺你设定的目标是很重要的，但业务环境和网络威胁格局都很容易发生变化，因此保持某种程度的灵活性很重要，特别是如果你预计项目跨越数月甚至几年。\n\
  \n## 第 23 章：第 6 步 – 进行风险评估\n\n风险评估已经在 12.12 中进行了详细讨论，因此在这里不再进行深入讨论。然而，值得关注安全大师布鲁斯·施尼尔（Bruce\
  \ Schneier）五个步骤（或问题）的简化版本，旨在作为判断某些安全权衡是否值得做的机制。97 这五个问题是：\n\n1. 你正试图保护哪些资产？\n2.\
  \ 这些资产面临哪些风险？\n3. 安全解决方案缓解风险的效果如何？\n4. 安全解决方案又引发了哪些其他风险？\n5. 安全解决方案需要什么样的权衡？\n\n\
  这是一种简单的方法，涵盖了做出明智安全决策的所有关键点。第一个问题与本书八步法的第 3 步重叠（参见第 20 章），即确定实施范围。其余问题实际上构成了风险风险评估。\n\
  \n\n\n\n最终，你需要将自己限制在项目的范围内，决定哪些风险是适用的，以及哪些控制措施能最好缓解这些风险，同时考虑它们的有效性、缺点，以及这种权衡是否值得。此外，请记住你最大的风险是什么，以及哪些风险需要优先处理。\n\
  \n⁹⁷ Bruce Schneier, *Beyond Fear: Thinking Sensibly About Security in an Uncertain\
  \ World*, Copernicus Books, 2003, pp. 14–15. 虽然这本书可以追溯到 2003 年，但它的许多原则（包括这五个步骤）在今天仍然适用。\n\
  \n## 第 24 章：第 7 步—— 选择并实施控制措施\n\n你预期的风险处理措施可能属于 CRF 流程，这将告诉你需要哪些措施，以及每项措施应力争达到何种成熟度，并借此使你能够完善你的项目计划（参见附录\
  \ 2）。\n\n当当前状态与目标状态之间存在差距时，采用迭代方法是明智的，利用你在第 5 步中建立的持续改进模型（第 22 章）并优先考虑解决最大风险的控制措施。然而，重要的是每次迭代都应在安全三大支柱——人员、流程和技术之间保持平衡（参见\
  \ 5.2）。\n\n请记住，你实施的整套控制措施可能比你在风险评估中识别出的控制措施要多。这些额外的控制将由你所确定的法律、合同和特定行业的要求来定义。完全可能是这些要求并没有针对你实际面临的风险，或者该风险相对较低，但它们仅仅是客户、监管机构、政府或其他利益相关者的强制要求。\n\
  \n## 第 25 章：第 8 步——衡量并审查性能\n\n只有当你能够证明网络安全和项目目标正在实现时，你的网络安全计划才有用且可持续。为此，对第 7 步中实施的控制措施的日志和输出进行测量（参见第\
  \ 24 章）至关重要。这些测量的设计应当使你能够将现在获得的信息与未来采取的测量进行比较。（测量在 15.1.2 中简要介绍过。）\n\n为了获得最佳结果并从开始保持一致的方法，你应该在计划控制实施的同时规划测量工作。在投入使用之前，运行短测试以证明测量提供了可重复的结果可能是一个好主意。此外，在定期的、计划间隔内（理想情况下至少每年一次）以及在发生重大变化时进行测量也是重要的。\n\
  \n当然，衡量每项控制措施可能非常昂贵，更不用说衡量所有内容对于获得有意义的结果和看到清晰的投资回报并非必要的，因此选择性非常重要。在识别要衡量哪些控制措施时，请优先考虑那些：\n\
  \n* 旨在缓解最高风险的；\n* 最可能失败的；\n* 实施、维护或修复成本最昂贵的；以及\n* 最复杂的。\n\n请注意，在选择控制措施并确定如何衡量它们时，测量行为本身会影响被衡量人员的行为。例如，衡量执行某特定任务所需可能会导致员工优先考虑任务执行的`speed`而非任务的`quality`，尽管初衷是好的，但这可能对流程产生负面影响。确保你选择的测量方式不会驱动不利于流程的行为是很。\n\
  \n### 25.1 持续改进\n\n自然，你的测量活动可能表明某些控制措施的运行没有预期那么好。识别出的改进区域可以作为你循环持续改进努力的输入。在实施改进后，应再次对相关控制措施的性能进行测量，并在必要时进行进一步更改。\n\
  \n测量本身也应该接受持续改进。这并不意味着你需要对你的测量进行测量，但你应该能够在某个时刻证明你的测量系统正在改进。为了做到这一点，你可以采取定量或定性的方法。\n\
  \n定量方法可能涉及审查测量结果的趋势，以确定所使用的测量是否合适，并根据需要弃用或增加测量。这种方法在你的网络安全计划仍然较新时可能特别有用，因为它让你能够确保所采取的测量是合适的、提供了有用的信息且没有驱动不利的行为。\n\
  \n同时，定性方法可能涉及对被衡量流程的所有者进行调查。拥有经验的所有者可能意识到与其流程相关的测量系统存在任何缺陷，他们的意见可以成为改进的价值工具。这种方法在计划的后期非常有用，因为变化（新硬件、软件等）可能会影响正在进行的测量。\n\
  \n### 25.2 管理审查\n\n高层管理必须能够看到计划正在取得预期结果，并满足法规和合同要求。管理审查通过评估测量的汇总信息、相关日志、内部审计报告（适用；参见\
  \ 15.5）以及任何持续改进活动来支持这一点，以便管理层规划计划的战略方向并确保其持续有效。他们还应该检查上次管理审查中确正工作的进展。\n\n此类审查应定期进行，在计划仍在开发和发展阶段，可能相对频繁——也许每季度一次。一旦计划根植良好，可能每年进行一次。管理层对计划的信心程度将决定具体的频率。\n\
  \n\n\n\n在不使用国际认可的标准或框架的情况下，开发出一套稳健的网络安全系统是完全可能的。事实上，如果你纯粹将本书的第 3 部分视为参考，而不是我们韧性框架的构建模块，并且仅仅实施了讨论的最基础且相关的控制措施，你已经有了一个很好的开始。然而，随着你的网络安全态势不断演进，可能会发现标准或框架可以在多个方面为你的组织带来收益。⁹⁸\n\
  \n标准和框架提供了由领域专家开发的、经过反复尝试、测试且全面的网络安全方法。通过采用这种方法，你可以消除在开发或改进自己系统时的某些猜测，根据公认的行业最佳实践增强你的防御能力，并考虑到你可能可能没有考虑过的网络安全方面。\n\
  \n此外，许多标准现在的强制性已显著比以前少得多。因此，当你实施这些标准时，应该只将资金花在在你真正需要的控制措施上。\n\n## 26.1 标准类型\n\n\
  标准通常分为两类。有些是声明性的，依赖组织自身证明合规性；而另一些则允许外部第三方对合规性进行独立验证，但两种类型通常都采取全面的方法，涵盖相关领域更广泛的组织。\n\
  \n框架是控制措施及配套指南的列表，通常比标准更具针对性。框架通常由第三部门和商业组织开发，这意味着它们往往比标准更新得（国际标准的更新过程通常需要大约五年，甚至更长，并且需要广泛的利益相关者谈判，而第三部门和商业组织在这方面的限制通常较少），但它们很少允许独立验证。\n\
  \n有适用于各种规模组织和各种网络安全经验水平的组织的标准和框架。除了你所需的成熟度外，考虑你运营所在地区所认可的标准或框架也很重要——例如，符合`NIST 网络安全框架`（`CSF`）（参见\
  \ 28.1）在美国可能比在海外或其他地区更容易获得赞誉。\n\n在本书的最后这一部分，我们讨论了许多最佳实践标准和框架，每种都有其自己的优缺点，这应该让你对可选范围有一个大致的了解。然而，这里涵盖的只是冰山一角，如果你想使用某种标准或框架，最好的方法是针对你的行业和运营地区有哪些其他合适的选择进行自己的研究。\n\
  \n你在应用标准或框架方面能做到何种程度取决于你自己。有些组织使用允许认证的标准，但放弃了认证过程，同时应用了建议、指南和要求——这让你获得了标准的大部分益处，而无需支付认证过程的费用，或更长期的审计和其他验证活动的成本。\n\
  \n## 26.2 认证的好处\n\n认证（在 15.6 中进行了详细讨论）不应被轻视。经过独立验证的网络安全是唯一能够向当前和潜在客户保证你采取了行业认可的、最佳实践网络安全的方法。它还能节省资金，通过允许你以你的客户和合作伙伴认可的格式展示有效的网络安全，从而减少他们通过额外的审计（耗费双方时间和资源）来对其验证的需求。\n\
  \n此外，如果你想要网络保险，认证也可能是先决条件，或者有助于降低你的保费。最后，即使认证本身不是显性要求，它仍然是证明你的组织已采取适当的技术和组织安全措施的可靠方法——这是一个常见的合同和法律要求。\n\
  \n在许多情况下，标准和框架的采用是由业务需求驱动的——潜在客户或投资者期望达到某种水平的网络安全，并坚持要求你采用某种标准或框架，作为你能够实现并维持该水平的业务前提条件。虽然你可以根据客户的要求实施网络安全标准，但这样做通常会导致开发仓促和系统低效。更好的做法是在它成为谈判课题之前识别并采用最合适的标准或框架，这样你就可以按照自己的节奏实施它，而没有外部压力。\n\
  \n⁹⁸ 如果你对`CRF` 与本书此部分讨论的框架之间如何重叠感兴趣，请查看 27-30 章的末尾，那里有表格提供了该对齐情况的概述。\n\n# 第 27 章：核心\n\
  \n处理标准和框架的一种方法，特别是当你不它们是否适合你的组织时，是从小处着手逐步推进。更基础的框架也可以作为入门网络安全的一种良好方法，因为它们往往负担得起且实施相对简单。\n\
  \n## 27.1 网络基础要素 (Cyber Essentials)\n\n`Cyber Essentials` 是由 `NCSC` 支持的英国政府计划，旨在帮助任何规模的组织展示其对网络安全的承诺，同时保持方法简单且成本低。\n\
  \n该计划专注于五个关键的网络安全控制措施，这些措施虽然基础但可以保护组织免受约 80% 的常见网络攻击，并有两个级别的成就：\n\n1. `Cyber Essentials`；\n\
  \n2. `Cyber Essentials Plus`。\n\n两个级别都需要五项基础安全控制措施：\n\n1. `防火墙`；\n2. `安全配置`；\n3.\
  \ `访问控制`；\n4. `恶意软件防护`；以及\n5. `补丁管理`。\n\n尽管这些控制措施非常基础，认证过程可能简单，但在项目真正启动之前，确定你的范围（如第\
  \ 20 章中讨论）仍然至关重要。`Cyber Essentials` 认证适用于你企业 IT 全部或部分（必须满足某些条件），并可能包括硬件和软件。\n\n\
  一旦定义了范围，你就可以进行自评估问卷（或 `SAQ`）以及两个 `Cyber Essentials` 级别都需要外部漏洞扫描。`Plus` 级别还需要现场评估和一次额外的内部漏洞扫描，这为你和你的客户提供了额外的保障。获得任何级别的认证都提供了许多其他益处，包括能够参加以该计划认证为先决条件的业务招标，并降低保费。事实上，所有营业额低于\
  \ 2000 万英镑（约 2500 万美元）且获得涵盖整个组织的 `Cyber Essentials` 认证的英国组织，将获得总责任额为 25,000 英镑（约\
  \ 32,000 美元）的网络保险。⁹⁹\n\n\n\n\n\n这些基础控制措施就能带来如此巨大的益处，似乎令人意惊讶，但已经发生过多次泄露事件，事实证明其中至少一项控制措施没有到位。例如，考虑国际航空公司国航空（Cathay\
  \ Pacific）遭受的泄露事件，该公司因此根据英国 1998 年《数据保护法》（DPA）被处以最高额罚款（该法现已被欧盟 GDPR 和英国 2018 年 DPA\
  \ 取代）。它未能通过不少少于三项 Cyber Essentials 控制：英国数据保护监管机构披露的“错误清单”中包括：缺乏访问控制（备份文件未设置密码保护）、恶意软件防护不足以及补丁管理不善（存在未打补丁的面向云服务器，以及开发者不再支持的操作系统）。\n\
  \n非常值得记住，未能实施最基础的网络安全措施——这些措施通常也是最容易实施且最廉价的——如果你面临监管调查或审计，可能会导致最巨额的罚款。\n\n## 27.2\
  \ CRF 对齐\n\n下表显示了 CRF 与 Cyber Essentials 的对齐情况：\n\n**表 7：Cyber Essentials 与 CRF\
