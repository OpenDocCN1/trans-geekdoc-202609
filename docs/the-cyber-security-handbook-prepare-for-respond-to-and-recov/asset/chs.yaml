  \n## 第三部分：CRF 流程\n\n## 第 11 章：CRF 流程概述\n\n第三部分 —— 这是目前为止最长的一部分——详细介绍了 `CRF` 流程。为了方便参考，以下章节描述了\
  \ `CRF` 内的流程以及每个流程的成熟度。\n\n具体而言，`CRF` 被分为四类：\n\n1. **管理和保护**：部署安全措施来保护资产的机密性、完整性和可用性。\n\
  2. **识别和检测**：使用监控来识别可能意味着事件的异常。\n3. **响应和恢复**：制定计划以应对事件响应并从事件中恢复。\n4. **治理和保证**：确保您的安全措施是有效的，并提供董事会级别的监督。\n\
  \n`CRF` 还被分为四个成熟度级别：\n\n*   **第 1 （初始）**：流程是随意的，且没有记录或记录不全。\n*   **第 2 （可重复）**：流程已有记录，但可能没有被一致遵守。\n\
  *   **第 3 （已定义）**：流程在组织范围内经过正式记录、沟通并实施。\n*   **第 4 （优化）**：流程得到持续的衡量和改进。\n\n`CRF`\
  \ 的每个类别将在后续章节中进行更详细的描述。没有必要在最高水平上实施所有流程；相反，你应该根据适用于特定需求和风险概况的成熟度来实施流程。\n\n有关 `CRF`\
  \ 流程如何相互作用的高级概览，请参见 表 2。\n\n## 表 2：所有 CRF 流程的高级概述\n\n| 类别 | 目标 | 关键活动 |\n| :---\
  \ | :--- | :--- |\n| **管理和保护** | 保护资产 | 访问控制、加密、补丁管理 |\n| **识别和检测** | 发现事件 | 监控、日志、异常检测\
  \ |\n| **响应和恢复** | 减轻影响 | 应急响应、备份、灾难恢复 |\n| **治理和保证** | 确保有效性 | 审计、合规、风险管理 |\n\n\
  ## 第 14 章：响应和恢复\n\n我们已经讨论过无论安全措施有多强事件都会发生，以及当预防失效时检测是如何工作的。然而，如果没有响应，即使检测非常可靠也无用。拥有有效的预防-检测-响应系统还可以增强您的网络弹性，并是深度防御的形式。\n\
  \n你可能会观察到如下示例中的序列：\n\n### 示例 1：逻辑访问\n\n*   **预防措施**：密码保护。\n*   **检测措施**：访问日志显示来自意外区域的登录。\n\
  *   **更多预防措施**：第二个身份验证因子（如 OTP）和隔离。\n*   **响应措施**：强制注销；锁定账户；更改密码；取证（确定发生了什么）；考虑防御改进；与员工、合作伙伴（如果他们可能成为目标）以及监管机构（如果是可报告事件）共享信息。\n\
  \n### 示例 2：物理安全\n\n*   **预防措施**：物理边界——大门、墙、门等。\n*   **检测措施**：（静音）报警。\n*   **更多预防措施**：锁上的办公室、柜子和抽屉；保险箱。\n\
  *   **响应措施**：安全小组到达、联系当局、联系保险、修复任何物理损坏。\n\n在两个示例中，一系列响应措施被介入，涵盖了多种响应类型。通常情况下，响应措施属于以下五个阶段之一：\n\
  \n\n\n\n\n# 1. 识别 (Identification)\n除非你知道攻击正在发生，并且知道它是什么样的攻击，否则你无法对其做出反应（或做出有效反应。“识别”阶段在很大程度上与第\
  \ 13 章中详细讨论的检测过程重叠。\n\n# 2. 抑制 (Containment)\n一旦你意识到发生了（可能的）攻击，就应该寻求控制并限制损害。你可以通过旨在停止或延迟攻击者（例如强制注销），或者通过旨在减少对你资产的损害（例如锁定账户或机器）来这样做。\n\
  \n控制事件不太可能将攻击者从你的系统中完全移除，但它可以为你赢得时间来弄清楚到底发生了什么，并显著限制造成的总损失。\n\n# 3. 根 (Eradication)\n\
  一旦你确定攻击者访问了哪些内容、你正在处理哪种恶意软件、哪些系统受到了影响等，就可以着消除威胁，清除恶意软件和攻击者的所有痕迹，并加固和补丁你的系统。关键在于消除事件的根源，并准备好恢复系统。\n\
  \n# 4. 恢复 (Recovery)\n恢复的核心是确保生存。既然威胁已经被消除，你就应该以最小的数据损失恢复你的系统。这是一个可以迭代发生的过程（在完全恢复之前，在较低但可接受的水平上运行），并且应该优先考虑最关键的资产和流程。这需要明确定义的恢复目标，并且正如有效安全中固有的权衡一样，需要做出牺牲。\n\
  \n准备恢复需要预先缓解——如果你没有安装喷淋器，就无法使用它们；如果你没有保单，就无法依靠保险。然而，它还需要清晰的文档（包括正式程序和连续性计划），并确保员工熟悉这些内容。定期测试你的计划（至少每年两次）有助于这一点；这还将确定你的计划是否真正有效，并并在必要时提供改进或纠正它们的机会。\n\
  \n# 5. 教训总结 (Lessons learned)\n一旦你恢复，你可能仍然受到相同攻击的影响，特别是如果之前的系统加固和补丁并没有真正解决这一特定事件的原因。因此，重新评估风险并决定是否以及如何改变或改进你的防御措施是明智的。识别出的改进机会应纳入你的下一次持续改进循环中（参见\
  \ 15.2）。\n\n此外请记住，如果按照要求，你可能需要向受影响方（包括监管机构）通知事件，并且初始通知可能必须在你意识到事件后不久就做出（例如，欧盟 GDPR\
  \ 要求某些数据泄露必须在获知后 72 小时内报告）。除了法律要求外，通知外部实体可以帮助他们在成为受害者之前采取适当的预防措施。向网络安全社区做出此类贡献可以增加你所在组织获得同等礼遇的机会。\n\
  \n即时响应和后续响应都同样重要。前者将事件造成的损害降至最低，而后者将确保你的恢复。你的后续响应还将限制其对你业务运营的影响，并帮助你履行法律义务，因为全球范围内有许多法律要求报告数据泄露事件。\n\
  \n在考虑实施哪些响应措施时，请记住你的检测机制可能会产生误报，特别是在自动化的情况下。你的响应措施应该考虑到这一点——在采取进一步的响应行动之前，通过一个流程来确认该事件是否为真实的（或尝试性的）攻击，可能被证明是具有成本效益的，特别是对于可靠性较低的检测机制。\n\
  \n此外请记住，任何依赖于人（而人通常依赖于书面计划和程序）的响应都需要练习，以确保他们在需要时能够迅速行动。无论你的计划考虑得多么周全，理论都无法替代实践经验。测试不仅能确认计划有效，还能训练员工以尽可能高效的方式进行响应。归根结底，最好的响应是作为常规的一部分，或者至少是感觉是熟悉的响应。一个不经常使用（或测试）的响应措施可能会给人一种虚假的安全感，因为在千万一的时刻和恐慌中，如果没有练习，事情可能不会按计划进行。请记住，安全既是一种感觉也是一种现实（如在\
  \ 5.3 中讨论过的），两者并不总是收敛——这在这里尤为相关。此外，始终存在事件发生当天关键人员不在办公室的可能性，因此确保有几个人知道该做什么。这也是你的风险评估（参见\
  \ 12.12）应该考虑的因素：你无法确定风险将由接受过适当培训的特定人员面临，因此你不能假设风险响应始终是最好的。\n\n例如，在发生电火时，不应使用水基灭火器——但许多面对火灾的人会本能地寻找最近的灭火器。在这个例子中，安装适用于扑灭纸张*等*固体燃烧物火灾的灭火器，以及适用于扑灭电火灾的泡沫或水雾灭火器，也可以缓解风险。更广泛地说，这种风险——不确定最合适的人员将面临风险——可以通过记录并良好良好的指令得到部分缓解。\n\
  \n## 14.1 事件响应管理 (Incident response management)\n考虑到预防措施无论多么强大都可能失效，你需要能够对事件做出反应并进行缓解。为了做到这一点，你需要采取准备措施，以便在关键时刻尽可能做出正确的决策。\n\
  \n**关键输出：** 事件响应团队，以及经过测试的事件响应计划和程序。\n\n任何形式的管理都需要充分的计划和准备才能有效。对于事件响应管理，这需要风险评估（参见\
  \ 12.12）并采取相应的风险措施。显然，响应措施是事件响应管理的重点，但请记住，这些很大程度上取决于其他两者：检测和预防。检测措施在决定何时启动响应方面起着重要作用，而预防措施越有效，你就越少需要依赖你的响应（或检测）措施。\n\
  \n### 14.1.1 事件响应团队 (The incident response team)\n事件响应团队负责分析事件信息、讨论观察结果并协调活动并在内部共享重要的发现。这些信息通常源于你的检测活动，可能是自动化工具的报告，也可能是员工、承包商或外部人员的信息。\n\
  \n该团队还将参与制定事件响应计划（参见 14.1.2），这将是你整体事件响应管理的核心。在没有积极调查可活动或响应事件时，团队应至少每季度会一次会议，以审查当前的安全趋势和事件响应程序。\n\
  \n\n\n\n\n团队可能包括总监或高级经理、信息安全经理、设施经理和 IT 经理（正如 12.10 中所讨论，某些人员可能与通用安全团队重叠）。无论具体角色如何，团队都需要具备相关的专业知识和经验来评估事件的性质和影响，并拥有足够的权限迅速做出响应。此外，某些人应该对组织的法律通知要求充分了解，以便识别何时需要报告事件，并此知道何时需要通知其他团队（如法务或公关团队）。\n\
  \n此外请记住，如果你的组织跨越多个地点，事件也可能是如此。响应团队可能需要至少某些物理访问权限，仅仅是为了重启服务器。因此，在每个主要地点至少安排一名业务和/或\
  \ IT 运营的关键人员（且该人员也是响应团队的成员）是明智的。\n\n### 14.1.2 事件响应计划\n\n当事件发生时，必须在压力下快速做出明智决策。要成功实现这一点，通过书面且经过测试的事件响应计划来指导员工至关重要。这些计划应列出关键信息，包括：\n\
  \n• 明确的目标和优先级；\n• 职责；\n• 报告流程/沟通计划；以及\n• 基于场景的检查清单或步骤。\n\n你的计划应该设定明确的目标，使你的优先级和目标透明化。这意味着它们需要考虑到关键资产和流程：它们是什么？可能会受到什么威胁？你可以在多长时间内容忍多大的影响？你能负担起失去关键资产持续多久？你的恢复优先级是什么？从这里开始，通过工作研讨和咨询，你可以考虑包含在事件响应计划中的步骤和程序，以便能够对事件进行有效的分析、缓解和从中恢复。\n\
  \n你的计划还应该明确谁负责什么。指定关键人员及其角色和联系方式，并确保每项任务都至少有两个人可以执行——因为始终存在某人な某天缺席的风险。你的计划还应包括报告流程或沟通计划，以确保事件响应团队成员和相关利益相关者都能及时获知事件。此类流程应考虑升级标准——无论事件被升级并分配给谁，其都必须有做出关键决策的能力，包括是否以及如何通知任何相关机构。\n\
  \n针对特定场景采取的检查清单或步骤也可能是你事件响应计划的宝贵补充，确保对可以预见的事件做出快速恰当的响应。此类场景应根据你最关键的业务资产和流程以及可能面临的威胁开发，并在风险评估过程中识别出来。通过提前计划，你能够在没有任何不必要的延迟采取行动，这使得开发此类场景成为你事件响应计划的关键点。\n\
  \n为了确保你的事件响应程序切实有效，你必须对它们进行测试并记录所有学训，并在必要时纳入改进。至少每半年进行一次测试可确保你的程序有效并保持有效，还能让记录的计划尽可能详细。还要记住，真实事件相对罕见，但一旦发生，人们仍需要立即知道该做什么——为此，培训（参见\
  \ 12.10）和测试是必不可少的。此外，定期的练习有助于建立和加强组织的安全文化（参见 12.11.5）。\n\n### 14.1.3 事件响应过程\n\n\
  事件响应过程的准确步骤和细节取决于组织的独特情况，但总体思路在图 2 中所示。深色区域代表“核心”事件响应活动；其前后的浅色区域分别分别是检测和初步调查，以及后续活动。\n\
  \n\n**图 2：层级事件响应流程**\n\n检测到的任何异常行为（可能标志着事件），无论是来自自动化工具的警报，还是来自员工或外部人员的报告，都应进行人工调查，以确定其是误报还是应该升级。这种分诊过程必须在初步报告后尽快进行。反之，它将决定如果事件必须升级，其紧急程度——是可以在第二天处理，还是你需要有人放下手头工作（无论是否在办公时间）？\n\
  \n请注意，升级事件并不意味着它一定是实际泄露——它仍可能是一个非事件，例如误报或攻击失败。如果是后者，你需要检查失败是因为你的措施奏效良好还是由于运气好（例如攻击者的失误）。如果是运气，你可能仍需要采取补救措施，以防止未来发生更不幸的情况。\n\
  \n在升级事件时，你应该更详细地分析你的数据。这应该让你了解你是否真的在处理一个事件，如果是，那是什么事件。它还应该提供有关事件如何发生以及影响有多严重或可能有多严重的信息，所有这些都帮助你决定采取什么进一步行动。分析和证据收集在\
  \ 14.1.4 中进行了讨论。\n\n注意，即使事件结果证明是误报或非事件，且你可以将其标记为已解决，你仍应保留其记录。偶尔回顾一段时间内的所有记录是一项具有启发性的工作，例如可以表明你的某些检测机制不正确，导致返回了过多的误报。此外，此类记录可以在审计中证明尽职调查。\n\
  \n在你修复了状况——并检查且确认你已真正停止了事件/攻击者（这可能需要一段时间的监控和/或进一步分析）之后，你应该恢复数据和系统，特别是那些对于恢复业务正常运行至重要的系统。作为业务连续性管理（BCM）的一部分，恢复和重启关键业务流程在\
  \ 14.3 中讨论。\n\n在标记事件解决之前的最后一步是回顾你的措施和响应活动，并考虑如何改进它们。改进的想法和建议应该记录下来，并纳入下一次持续改进循环中（参见\
  \ 15.2）。\n\n### 14.1.4 分析和收集证据\n\n要采取的一些首要步骤相当基础，可以在没有专业知识的情况下完成。例如，如果员工报告了疑似事件，或者你知道警报来自哪个用户设备，你可以开始提问，例如：\n\
  \n• 他们当时在做什么？当时他们连接了互联网吗？\n• 他们是什么时候发现事件的？他们在设备上已经操作了多久？\n• 他们是如何发现已知或怀疑的事件的？例如，设备警报，或者意识到自己点击了钓鱼链接。\n\
  • 他们是否向任何人共享过登录凭据？\n• 他们是否已经采取了任何措施，例如联系 IT 人员或关闭设备？\n\n\n\n\n你还应该检查该设备上存储或可从该设备访问的信息。审查你的访问和/或流量日志也是一个好主意，看看是否可以识别事件可能源于何，以及是否有大量数据被传输到你的网络之外。检查你的威胁情报（参见\
  \ 13.1）也可能帮助识别你正在处理的是什么类型的威胁或恶意软件，以及你可以采取什么措施来缓解。如果这些选项都没有提供你所需的信息，你可能希望考虑聘请渗透测试员尝试识别导致事故的原因，以及你如何防止其再次发生（另见\
  \ 13.1.3）。\n\n经典的事故后场景始于外部第三方告知你，你网站的一部分或其他面向公众的 IT 资产已被攻破。由于目标是理解实际发生的细节，而不仅仅是意识到事故的发生，你需要线索和证据。这与调查入室窃窃逻辑相似——警察会调取监控录像，以了解犯手触碰过什么，并告诉他们应该在何处采集指纹——调查网络安全违规始于检查已知已攻破的资产的相关日志。一旦你确定了入侵者的\
  \ IP 地址，就可以利用它来检查日志，查看他们可能执行了哪些其他恶意活动。从那里，你可以推断出损害的完整范围和性质，这反过来指导你的遏制、缓解和修复工作。\n\
  \n当然，为了能够进行此类司法分析，你不仅需要建立安全监控和日志机制，还需要保留这些日志足够长，以便有合理的机会追溯攻击者的*所有*步骤。尽管如此，长期生成并存储所有内容的日志在财务上可能是昂贵的的，因此，评估风险并找到合适的平衡点是一个问题（在\
  \ 13.2.3），让你的 ICT 服务具有弹性是值得的。绝大多数现代组织（如果不是所有）如果没有他们的 ICT 将无法运行。这不仅是许多需要保护的 IT 资产的问题，而且组织通常需要其\
  \ ICT 服务来管理其许多其他连续性活动。例如，备份是保护数据的极佳方式，但前提是你有可用的系统来实际恢复它们。\n\n当向客户交付产品和或服务被中断时，运营会很困难，但如果你的\
  \ ICT 服务不可用（特别是长时间），业务将是不可能的。为了确保任何停机时间降至最低，ICT 连续性管理——为中断做好准备，以便你可以从网络事件中快速恢复——是关重要的。\n\
  \n然而，ICT 恢复管理不仅仅关乎准备恢复。与一般的网络韧性一样，你需要先考虑预防（参见 第 12 章），还要考虑检测（参见 第 13 章）。只有这样，你应该考虑采取哪些与风险匹配的缓解和恢复措施。虽然你理想情况下完全不想遭受事故，但\
  \ IT 故障确实会发生，无论是由恶意攻击者还是意外造成的，因此知道如何检测异常并迅速采取行动至关重要。\n\n当然，即使是高效的恢复仍然需要时间，因此确保你有某种备用方案，以便在维修和恢复进行期间保持你最关键的功能运行。例如，当\
  \ Norsk Hydro 在 2019 年遭受巨大的勒索软件攻击时，它依靠“劳动密集型的变通方案和手动程序”，使得某些业务领域“尽管受到攻击仍保持接近正常状态”。⁸⁷。这并不理想，但它起了作用，特别是在短时间范围内。你绝对不希望看到的是除了支付赎金外没有其他选择。这意味着要依赖攻击者的善意来实际提供解密密钥，*并且*不保留他们窃取的数据副本，并信任他们不会在几个月后再次针对你。（勒索软件在\
  \ 7.2.3 中进行了更深入的讨论。）\n\n由于由于每个组织的运作方式不同，你需要确定*你的*最关键的 ICT 服务是什么，并像任何其他主要资产一样对待它们。即使对于许多组织来说这最终是一个很短的列表——例如互联网连接、电子邮件和网站服务器以及关键数据库——但列表上的少数项目所需的保护与旗舰产品或任何其他主要资产一样甚至更多。分段隔离（参见\
  \ 12.9.2）是保护 IT 环境的重要控制措施，因为它们可以防止一次攻击击垮所有 ICT 服务，并阻止攻击者破坏你的恢复措施（如备份服务器）。你还应该与高层管理约定恢复时间和阈值。这些不仅决定了恢复有多快，还指示了任何临时服务需要多有效，以及它们需要保持功能多久。\n\
  \n对于预算有限的小型组织，研究可以快速部署以接管关键功能的云端 IT 服务可能是值得的；例如，在你们清理损坏时提供虚拟服务器来恢复备份。此外，如果你已经在使用基础设施即服务（`IaaS`）或类似服务，你的合同可能已经包含了服务连续性，允许你将这些许多问题转交给服务提供商。\n\
  \n最后，以类似于通用事件响应程序（参见 14.1）的方式，你应该记录发生的任何事故（无论大小），这样你就可以审查你的措施和响应，确定哪些做得好，哪些可以改进，并并在你的下一次持续改进循环中包含任何改进机会（参见\
  \ 15.2）。\n\n### 14.3 业务连续性管理\n\n各种性质和规模的中断（无论是预见的还是不可预见的）在业务中不可避免地发生。BCM 帮助你为这些中断做好准备，确保无论面临什么，都能继续运营——即使低于正常水平。\n\
  \n\n\n\n2020 年的极端事件——世界卫生组织宣布 COVID-19 为全球大流行，各国政府采取了和平时期所未有的规模进行干预以减缓病毒传播——使各机构开始以全新的视角审视业务连续性管理（BCM）。\n\
  \n虽然没有专门针对大流行制定计划可能是合理的，但各机构本应对火灾、洪水等更常见的事件做好准备，以及随之而来的意外办公室关闭和/或员工无法旅行的情况。尽管业务连续性计划可能很常见，但这些计划在某处隐喻意义上（有时也是字面意义上）落灰为尘的情况也几乎同样常有——换句话说，员工并不熟悉这些计划，因此在发生事件时他们不知道自己被要求做什么；而且，无论如何，无法保证这些计划实际上能发挥作用，因为它们几乎肯定过时、未经过测试或两者兼有。\n\
