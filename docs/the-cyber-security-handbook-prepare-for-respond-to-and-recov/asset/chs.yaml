  | 董事会承诺与参与 | ✓ | ✓ | 15.3 |\n| 治理结构与流程 | | | |\n| 内部审计 | | ✓ | 15.5 |\n| 外部认证/验证\
  \ | | ✓ | 15.6 |\n\n## 第 29 章：扩展\n\n您的基线框架可以通过更专业的标准和框架进行扩展——重点关注业务连续性（参见 29.1）、事件响应（参见\
  \ 29.2）、云安全与供应链安全（参见 29.3）以及隐私管理（参见 29.4）等领域——帮助您构建更全面的网络韧性。\n\n### 29.1 ISO 22301\
  \ – BCM\n\n国际标准 `ISO 22301` 为有效的业务连续性体系（BCMS）提供了规范，如果您考虑实施集成管理体系，它是 `ISO 27001`\
  \ 的极佳补充——`ISO 27001` 和 `ISO 22301` 涵盖了网络韧性的两个最基础方面：信息安全和业务连续性。\n\n同时，`ISO 27017`\
  \ 为提供或使用云服务时的信息安全控制提供了一套实践准则。云安全为客户和合作伙伴提供额外的保证。\n\n`BCM` 最重要的原则（无论是正式还是非正式）在 14.3\
  \ 中详细讨论，此处 `22301` 的核心原则：\n\n- 董事会支持：正如网络安全（参见 15.3）一样，成功的 `BCMS` 需要董事会和高层支持——否则管理体系可能无法维持。\n\
  - BIA：`BIA`（在 14.3 中详细讨论）与风险评估一起，是 `BCMS` 中关键的流程。它用于识别组织的关键活动和资源，以及如果这些活动中断的影响有多严重。\n\
  - 风险评估：同样，正如网络安全（参见 12.12）一样，只有理解哪些场景会导致中断，才能做出明智决策。您的业务连续性风险评估应确定这些场景发生的可能性及其可能的影响。\n\
  - 一个或多个业务连续计划：这些计划应根据 `BIA` 和风险评估制定，并定期进行测试以确保其有效。\n- 持续改进：持续改进（参见 15.2）是所有 ISO\
  \ 管理系统的共同特征。其理念是对所有业务连续性实践和活动进行定期测试和审查，识别并实施改进机会。这样，您的业务连续性流程随着推移会变得越来越严谨，从而提升您的计划质量。\n\
  \n### 29.2 ISO 27017 – 云安全\n\n`ISO 27017` 是 `ISO 27000` 家族的一部分，是云信息安全控制的实践准则。具体而言，它采用了\
  \ `ISO 27002` 的指导，使其更适用于云用户（以便他们实施适当的控制）和云提供商（以便他们支持此类控制措施的实施）。设立专门云安全的标准的原因是云计算的性质引入了其他计算类型中未见的风险。\n\
  \n在需要时对 `ISO 27002` 的控制进行详细说明外，`ISO 27017` 还引入了针对云特征的七项额外控制：\n\n- `CLD.6.3.1` 云环境中的共享角色和责任\n\
  - `CLD.8.1.5` 云服务客户资产清除\n- `CLD.9.5.1` 虚拟计算环境隔离\n- `CLD.9.5.2` 虚拟机加固\n- `CLD.12.1.5`\
  \ 管理员运维安全\n- `CLD.12.4.5` 云服务监控\n- `CLD.13.1.4` 虚拟与物理网络安全管理对齐\n\n### 29.3 ISO 27035\
  \ – 信息安全事件管理\n\n\n\n\n\nISO 27035 是 ISO 27000 家族的另一个成员，为信息安全事件管理提供了指导。该标准分为两个部分：第一部分概述了事件管理的原则；第二部分包含了计划和准备事件响应的指南。ISO\
  \ 27035 将信息安全事件管理分为五个阶段：\n\n### 1. 计划与准备：\n完成某些准备性活动，以确保在必要时能够有效激活并执行事件响应计划。\n\n\
  ### 2. 检测与报告：\n检测、收集与信息安全事件相关的信息，并报告信息安全事件（这些事件可能是实际事件，也可能不是）。这可以通过自动、手动或两者结合的方式进行。\n\
  \n### 3. 评估与决策：\n对检测到的事件信息信息进行评估，并决定每个事件是否应归类为事件。\n\n### 4. 响应：\n根据上一阶段决定的行动对实际事件做出响应。\n\
  \n### 5. 教训总结：\n在事件解决后，审查行动和控制措施以识别可能的改进之处。该标准明确指出，信息安全事件管理活动应该是迭代的。\n\n不独立于 `ISO\
  \ 27035`（或任何其他标准）的事件管理在 `14.1` 中进行了更详细的讨论。\n\n### 29.4 ISO 27036 – 供应链中的信息安全\n这项包含四部分的标准为保障供应链提供了指导。大多数组织会发现第二和第三部分（`ISO\
  \ 27036-2` 和 `ISO 27036-3`）最有价值，它们分别涵盖了供应商关系（不分规模或行业）的信息安全要求，以及保障 ICT 供应链安全的指南。\n\
  \n`ISO 27036-2` 围绕以下生命周期构建了其要求：\n* 供应商关系规划过程。\n* 供应商选择过程。\n* 供应商关系协议过程。\n* 供应商关系管理过程。\n\
  * 供应商关系终止过程。\n\n`ISO 27036-3` 意识到，由于 ICT 服务可以在物理距离外提供，并且通常通过多级分包交付，用户缺乏对整个 ICT 供应链的可见性，从而为采购组织带来了需要管理的风险。在结构上，它镜像了上述生命周期，但以更细粒度的级别讨论了各个过程（采购过程、供应过程、生命周期模型管理过程等）。\n\
  \n### 29.5 ISO 27701 – 隐私管理\n`ISO 27701` 作为信息安全的扩展，旨在填补保证缺口并提供一种真正的国际数据保护方法，它扩展了\
  \ `ISO 27001` 的要求，以包含隐私管理和 `PII`（个人身份信息）的安全性。它承认信息安全是有效隐私管理的关键方面，并且来自 `ISO 27001`\
  \ 的 `ISMS` 要求可以支持在 `ISMS` 之上添加特定行业的要求，而无需建立新的管理体系规范。\n\n`ISO 27701` 定义了 `ISMS` 涵盖隐私和\
  \ `PII` 处理的额外要求。这些要求由专门针对数据保护和隐私的额外控制支持。作为一个新的整体，这创建了标准中所谓的“隐私信息管理体系 (PIMS)”。\n\n\
  至于 `ISO 27701` 的认可认证，在编写时的可用方案尚未涵盖该选项。然而，组织可以在 `ISO 27001` 认可认证文件中的“适用性声明 (SoA)”中引用\
  \ `ISO 27701` 作为控制措施的来源。\n\n### 29.6 CRF 对齐\n下表显示了我们的 `CRF`、`ISO 22301`、`ISO 27017`、`ISO\
  \ 27035`、`ISO 27036` 的第二、第三部分以及 `ISO 27701` 如何对齐：\n\n**表 9：主要 ISO 标准如何与 CRF 对齐**\n\
  \n![_image](img/tab14.jpg)\n![image](img/tab15.jpg)\n![image](img/tab16.jpg)\n\n\
  `**` 仅包含控制扩展或增加（与 `ISO 27001` 和 `ISO 27002` 的指导相比）。\n\n`**` 仅与 `ISO 27001` 结合使用；详情请参阅\
  \ `28.2` 和 `28.3`。\n\n## 第 30 章：嵌入\n在此阶段，你应该已经开发了基础框架并根据特定需求对其进行了扩展，并在适当的情况下参考最佳实践标准和框架。现在，你应该思考如何将你的网络韧性目标和活动与更广泛的业务目标对齐，使安全计划的有效性和可持续性最大化。\n\
  \nIT 治理——企业治理的一个要素，旨在提高 IT 的整体管理并从信息技术投资中获得价值——在将你的网络安全和韧性活动与更广泛的业务目标对齐方面起着至关重要的作用。IT\
  \ 治理框架可以帮助你有效实现，允许你：\n* 更广泛的业务战略和目标展示可衡量的结果；\n* 满足相关的法律和法规义务；\n* 确保利益相关者对组织的 IT\
  \ 服务充满信心；\n* 促进 IT 投资回报率的提高。\n\n另请参见 `15.3` 以获取有关董事层承诺与参与的更深入讨论，`15.4` 获取有关治理结构和过程的更多信息，`18.3`\
  \ 获取有关首席执行官如何支持你的安全项目的信息。\n\n### 30.1 COBIT\n`COBIT`——即信息和相关技术控制目标——是一个旨在帮助组织解决合规、风险管理以及\
  \ IT 战略与组织目标对齐领域挑战的框架。\n\n框架的最新版本 `COBIT 2019` 基于企业有效管理和治理至关重要的六项原则：\n* 提供利益相关者价值。\n\
  * 整体方法。\n* 动态治理体系。\n* 治理管理分离。\n* 企业定制。\n* 端到端治理体系。\n\n这六项原则使组织能够建立一个 IT 治理与管理的框架，该框架基于七个组件（以前称为赋能因素），并可以是通用的或“通用体”：\n\
  * 过程。\n* 组织结构。\n* 策略和程序。\n* 信息流。\n* 文化和行为。\n* 技能。\n* 基础设施。\n\n原则和组件共同使组织能够将其 IT\
  \ 投资与其目标对齐，以实现这些投资的价值。\n\n### 30.2 ISO 27014\n`ISO 27014` 是 `ISO 27000` 家族的另一个成员，设计旨在与\
  \ `ISMS` 良好配合——它提供了信息安全治理指导，从而实现信息安全与整体业务目标及战略之间的战略对，为利益相关者交付价值，并确保治理机构负责信息安全风险得到充分解决。\n\
  \n实现这些目标要求治理机构应用六项原则：\n* 建立全组织的信息安全。\n* 采用基于风险的方法。\n* 设置投资决策的方向。\n* 确保符合内部和外部要求。\n\
  * 营造积极的安全环境。\n* 根据业务结果审查绩效。\n\n然而，该标准对于如何、何时或由谁实施这些原则是灵活的，因为最佳方法将因组织而异。尽管如此，某些过程是治理机构应该执行和/或支持的：\n\
  \n\n\n\n\n* 跨业务的性能监控与评估；\n* 根据组织的安全策略和政策提供指导；以及\n* 与利益相关者就信息安全活动、问题和需求进行双向通信。\n\n\
  ### 30.3 CRF 对齐\n\n下表显示了我们的 `CRF`、`COBIT` 和 `ISO 27014` 如何对齐：\n\n**表 10：COBIT、ISO\
  \ 27014 与 CRF 的对齐情况**\n\n| | **基准** | `CRF` |\n| :--- | :--- | :--- |\n| | `COBIT`\
  \ | `ISO 27014` |\n| **管理与保护** | | | |\n| 资产管理 | | | |\n| 信息安全策略 | | | |\n| 物理与环境安全\
