  \n## 第 31 章：结论\n\n如果你已经读到了这里，希望你觉得通往网络安全的道路不再是一段无法完成的旅程。你可以采取许多行动，这些行动既不会耗尽你的预算，也不需要大量的专业知识和经验来实施。如果你想更进一步，还有一系列标准和框架——包括我们的\
  \ `CRF`——你可以使用它们来增强和改进你的网络安全计划，而这些标准的顶端是提供独立外部认证路径的标准。\n\n为了让你的网络安全计划发挥最大作用，请在考虑防御措施的同时，考虑到韧性和恢复能力。攻击的成功只是“何时”而非“是否”的问题，一个经过测试且有效的响应计划可以通过及时恢复你的关键收入和支持流，帮助防御随之而来的财务和声誉损害。\n\
  \n无论你的组织规模如何，网络安全不再是可选项——它是业务成功的组成部分，也是应对信息时代风险的关键防御。剩下的唯一问题是决定你的旅程何时从何地开始。\n\n\
