- "# 网络安全手册：利用 IT 治理网络韧性框架 (CRF) 准备、响应并从网络攻击中恢复\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n## 关于作者\n\n艾兰·卡尔德 (Alan Calder) 于 2002 年创立了 IT Governance Limited，并于 2007 年开始在该公司全职工作。他是\
  \ GRC International Group plc 的集团首席执行官，这是一家拥有 IT Governance Ltd 的 AIM 上市公司。在此之前，艾兰曾担任多个职务，包括\
  \ 1995 年至 1998 年 Business Link London City Partners 的首席执行官（一家专注于帮助成长中企业的政府机构）、1998\
  \ 年至 2001 年 Focus Central London 的首席执行官（一个培训和企业委员会）、2001 年至 2003 年 Wide Learning\
  \ 的首席执行官（一家电子学习供应商）以及 2005 年 Outs 包培训公司的首席执行官。艾兰还于 2006 年至 2011 年担任 CEME（一个公私营部门技能伙伴关系）的主席。\n\
  \n艾兰是公认的国际网络安全大师，也是信息安全和 IT 治理问题的领先作家。他参与开发了广泛获得国际 IT 治理资格委员会 (IBITGQ) 认证的信息安全管理培训课程。艾兰曾为英国及海外客户提供咨询，并经常担任媒体评论员和演讲员。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n### 专业服务与咨询\n### 时事通讯\n\n# 第 1 部分：引言\n\n\
  ## 第 1 章：威胁格局\n\n我们生活在一个技术和海量数据在日常生活、个人和职业领域都起着重要作用的世界。在可预见的未来（可能在此之后），它们的增长和显赫地位没有减缓的迹象，即使所涉及的技术可能会以无法想象的方式发生变化。自然地，这一切给公司和个人都带来了巨大的机遇和利益。然而，这些利益的代价不仅仅是财务成本。在我们所知的世界中，你既可能受到物理攻击也可能受到虚拟攻击。对于当今极度依赖技术（尤其是互联网）开展业务的组织来说，后者比前者更具威胁性。威胁格局复杂且不断变化。每当修复一个漏洞，另一个漏洞就会出现，并正等待被利用。糟糕的是，当一个漏洞被识别时，能够利用该漏洞的工具通常在几小时内就会开发并投入——这比供应商通常发布补丁的时间快得多，也比许多组织安装补丁的时间快得多。\n\
  \n技术的参与使得攻击者比防御者拥有巨大的优势——他们不仅可以舒适地在家攻击任何地方、任何时间的人，而且从攻击者的角度来看，通常具有非常高的风险回报率：检测攻击是否已经发生就已经足够困难，更不用说背后者是谁了。我们试图保护的数字信息的本质非常易复制。事实上，窃取信息完全不需要将其从原始位置移除，这意味着该信息的所有者可能永远意识不到窃取已经发生。\n\
  \n对我们来说的是，在互联网上犯罪也可以非常获利。物理扒窃可能会赚取现金和信用卡（这些卡可能会很快被锁定，而且可能也只能用到限额），但数字化针对目标会给他们提供盗取个人身份的机会，并以受害者的名义发行信用卡。将此规模扩大，犯罪分子可能会考虑针对拥有数千甚至数百万个信用卡详情和所有者个人信息的企业。无论他们随后是自己使用这些信息，还是将其卖在暗网上（你可以在那里买到几乎任何东西，从药物到软件和被盗的凭据），利润显然远高于在相同时间内、相同的人力下实施的物理犯罪。\n\
  \n由于几乎每个组织都持有有价值的信息，且通常数量巨大（即使你是一家小企业），每个人都是目标。大多数情况下，如果失去了对这些信息的访问，组织将无法经营——这使其成为他们最重要的资产之一。与此同时，犯罪分子可以从这些信息中提取巨大价值的事实意味着这对他们来说也是资产。有充分理由称其为信息“资产”——根据定义，别人想要得到它们。很多时候，这个“别人”是一个通过正规渠道的业务伙伴——但并非所有人都会采取法律途径。\n\
  \n因此，仅英国就有 46%的企业在 2019 年经历了至少一次网络攻击或数据泄露，这并不意外，对于大型企业，这一数字增加到高达 75%。此类攻击可能涵盖从简单的钓鱼邮件到犯罪团伙策划的复杂详细操作——尽管根据英国政府\
  \ 2020 年《网络安全违约调查》报告，过去五年的趋势是网络攻击正在演变并变得更加频繁——但即使是最简单的攻击，如果执行成功，而你没有做好准备，也会造成毁灭性的影响。显然，保护自己符合你组织的利益。虽然这可能需要成本，但事实证明比经历数据泄露并处理随之而来的运营、财务和声誉损害要便宜得多。\n\
  \n然而，考虑到媒体上数据泄露和网络攻击的频率，且其中许多是大规模的，你可能会认为要保护你的组织免受网络攻击者的侵害是不可能的——毕竟，如果大型跨国公司都无法保持安全，那么小企业又何希望呢？\n\
  \n答案是：比你想象的要多。网络安全不需要花费巨额资金，也不需要多年时间来实现，特别是如果你采取了策略方法并优先处理那些“容易摘取的果实”的话。这是一项值得的投资：无论你的组织规模如何，提高网络安全都有助于保护你和你的客户的数据，改善业务关系并开启新的业务机会。\n\
  \n\n\n\n\n¹ 英国数字、文化、媒体和体育部，“2020 年网络安全漏洞调查报告”，2020 年 3 月，[`www.gov.uk/government/publications/cyber-security-breaches-survey-2020/cyber-security-breaches-survey-2020`](https://www.gov.uk/government/publications/cyber-security-breaches-survey-2020/cyber-security-breaches-survey-2020)。\n\
  \n² 同上。\n\n## 第 2 章：信息与网络安全\n\n“信息安全”和“网络安全”这两个术语经常互换使用，但实际上它们指的是不同的（尽管是相关的）事物。\n\
  \n首先从相似之处来看，信息安全和网络安全都关注三个方面的安全：\n\n### 1. 机密性：\n信息资产和系统应仅允许需要访问的人访问。\n\n### 2.\
  \ 完整性：\n信息资产和系统应免受未经授权的修改、破坏和丢失。\n\n### 3. 可用性：\n信息资产和系统应在需要时供授权人员访问。\n\n考虑安全的这三个方面（也称为“CIA”）意味着你不会犯下只考虑机密性的常见错误。显然，基于“知情所需的原则”（need-to-know）限制信息是安全的关键要素，但只有当你知道这些信息是正确的并且在需要时能够访问它们时，这些信息才是有用的。\n\
  \n然而，信息安全和网络安全之间存在一些重要的区别。前者考虑组织持有的所有信息，无论这些信息是电子格式还是纸质版格式；而网络安全是信息安全的子集，专门关注保护电子信息。\n\
  \n尽管考虑到我们的世界正变得日益数字化，网络安全似乎是组织采取的更而明显的路径，但总会有物理安全因素需要考虑，仅仅是因为你必须保护好硬件才能访问你的数字信息。除了可用性问题外，如果有人可以从你背后盯着你在做什么，或者直接拿走设备，防火墙和反恶意软件就无法完全保护你的设备。\n\
  \n本书的第 3 部分深入探讨了你可以采取哪些保护你的组织免受此类风险影响的措施。\n\n## 第 3 章：网络韧性\n\n遗憾的是，即使是最安全的组织也可能成为网络攻击的受害者。在很大程度上，这仅仅是由于处于劣势的情况：尽管你需要保护所有资产免受所有类型的威胁，但攻击者只需要一个弱点就能进入你的系统。此外，你采取的任何安全措施都只设计用于阻止少数威胁——至多如此。这意味着它对其他类型的威胁可能从本质上就是无效的。\n\
  \n意识到这些挑战并且不将它们视为不可逾越的障碍是至关重要的。\n\n要理解为什么前者如此重要，你只需要回顾过去。历史告诉我们，如果你假设某事绝不会出问题，那么当情况真的出现问题时，你可能会发现很难补救，甚至不可能。第二次世界大战期间，德国人认为\
  \ `Enigma` 密码是不可破的，`泰坦尼克号`被认为不可沉没的，`RMS` 被认为不可破解的。除了可用性问题外，如果有人可以从你背后盯着你在做什么，或者直接拿走设备，防火墙和反恶意软件就无法完全保护你的设备。\n\
  \n## 第 4 章：法规与合同要求\n\n如果你的组织必须在复杂的威胁环境中竞争以适应当今数字世界这一事实本身还不足以成为投资网络安全和韧性的理由，那么：\n\
  \n### 4.1 国际数据隐私法\n\n2016 年《通用数据保护条例》（GDPR）的引入（于两年后实施）标志着全球数据保护和隐私法的一个重大里程碑。我们大多数人还记得在\
  \ `GDPR` 生效前后的几天，收件箱里涌入大量的“我们需要您的同意”的邮件，³，但这些邮件只是冰山一角。\n\n`GDPR` 对处理欧盟居民数据的组织施加了广泛的安全和隐私义务，并由一套巨额罚款制度提供支持（最高达年度营业额的\
  \ 4% 或 2000 万欧元（约 1800 万英镑或 2300 万美元））。`GDPR` 还要求在境外处理欧盟居民个人数据的组织任命一名欧盟代表，将这些义务和处罚的范围扩大到远超欧盟的物理边界。该条例在国际上得到了进一步执行，禁止欧盟组织将数据传输到欧洲经济区（EEA）之外，除非“第三国”的接收组织能够保证符合\
  \ `GDPR` 的数据安全标准。\n\n然而，`GDPR` 并不是最近出现的数据隐私法。加利福尼亚州和巴西分别推出了《加州隐私权利法案》（CPRA）和《个人数据保护法》（Lei\
  \ Geral de Proteção de Pessoaaoais），预计未来几年在国际上还会有进一步的监管行动。\n\n### 4.2 关键基础设施的网络安全要求\n\
  \n对数据保护、隐私和关键服务连续性的关注日益增加，不可避免地导致对网络安全的关注，因为组织持有的大量信息都是电子格式。许多组织（包括大多数基础服务）也依赖电子基础设施。\n\
  \n鉴于这种依赖，近年来还出台了如欧盟网络和信息系统安全指令（NIS 指令）等法律。该指令对数字服务提供商（包括云服务提供商和基础服务运营商，如电力水水）提出了特定的网络安全和事件响应义务，旨在减轻重大网络安全事件可能导致的中断。\n\
  \n\n\n\n\n对于这类关键服务提供者来说，成功的网络攻击很容易对物理世界产生影响——例如，想想 `WannaCry` 对英国国家医疗服务体系（NHS）造成的影响，当时导致了数千次预约被取消。⁴\
  \ 由于医疗部门是无论任何情况下都必须维持运行至关重要的行业，医疗机构可能面临额外的网络安全要求，例如英国的《数据安全与保护（DSP）工具包》，以及美国的《健康保险流通与责任法案》（`HIPAA`）。\n\
  \n### 4.3 合同要求\n\n不仅仅是法律强制要求有效的网络安全。合同中的网络安全义务也变得越来越普遍，因为各机构正日益意识到供应商与合作伙伴之间信息共享所带来的风险（第三方威胁将在第\
  \ 10 章 顺带一下，并不是所有的邮件都是必要的。同意只是处理数据的六种合法依据之一——例如，如果你需要联系某人提供服务以履行合同，你可以依靠“合同必要性”。另一个例子是，如果你已经与某人建立了商业关系，你通常可以依靠“合法利益”向他们发送相关的营销材料。\n\
  \n⁴ BBC 新闻，“NHS‘可以防止’WannaCry 勒索软件攻击”，2017 年 10 月，*[`www.bbc.co.uk/news/technology-41753022`](https://www.bbc.co.uk/news/technology-41753022)*。\n\
  \n## 第 5 章：实施网络安全\n\n尽管第 1 章提到网络安全并不一定昂贵，而且你的实施并不需要花费很长时间，但要知道从哪里开始仍然可能很困难。\n\n\
  事实上，有许多不同且有效的实施网络安全的方法。适用于你机构的正确方法取决于你的目标和需求，因此一个良好的起点是清晰地定义这些需求。我们实施网络安全的八步法。\n\
  \n#### 5.1 权衡取\n\n尽管第 1 章提到网络安全并不一定昂贵，而且你的实施并不需要花费很长时间，但要知道从哪里开始仍然很困难。\n\n事实上，有许多不同且有效的实施网络安全的方法。适用于你机构的正确方法取决于你的目标和需求，因此一个良好的起点是清晰地定义这些需求。我们实施网络安全的八步法。\n\
  \n### 5.2 三大支柱\n\n尽管第 1 章提到网络安全并不一定昂贵，而且你的实施并不需要花费很长时间，但要知道从哪里开始仍然很困难。\n\n事实上，有许多不同且有效的实施网络安全的方法。适用于你机构的正确方法取决于你的目标和需求，因此一个良好的起点是清晰地定义这些需求。我们实施网络安全的八步法。\n\
  \n### 5.3 IT 治理网络韧性框架 (CRF)\n\n\n\n\n诚然，在网络安全方面有许多需要吸收的内容。然而，你不需要自己完成所有的准备工作——起初，像这样的书籍可以提供大量的实用建议和指导。还有许多可用的框架可以为你提供一个现成的、经过验证的结构供你参考，让你确信正朝着正确的方向进行。选择范围很大，尽管在英国有两个格为常见：`Cyber\
  \ Essentials`，它仅包含五个基本控制措施；以及 `ISO 27001`，它包含了多达 114 项控制措施，尽管你只需要实施与你相关的部分即可。本书的第\
  \ 5 部分 总结了十种不同的最佳实践框架，以便你可以了解可选的方案以及哪些方案可能适合你的组织。\n\n如果出于某种原因，这些类型的框架不适合你，请放心，本书主要提供符合最佳实践的内容，且不引用任何外部标准或框架。然而，由于本书仍需要以易于遵循的格式进行组织，因此所涵盖的安全控制措施和实施步骤是基于\
  \ `IT Governance CRF` 的，该框架在表 1 中部分描述。\n\n该框架首次于 2019 年 2 月发布，⁵，由于多种原因，它为任何网络安全项目奠定了良好的基础：\n\
  \n* 它提供了全面的流程选择（请参见表 1 中的第一列），减少了遗漏任何需要安全控制领域的概率。\n* 流程选择极其灵活——你仅需根据合规性和业务需求实施你所需的措施。正因如此，如果你愿意，可以将本书的第\
  \ 3 部分（详细讨论了每个 `CRF` 流程）以百科全书的方式来——按照你选择的顺序只阅读你需要的部分（尽管从头读到尾同样有效）。第 11 章 提供了每个流程的摘要，让你能够快速确定需要进一步查看哪些流程。\n\
  * 该`框架` 的四个成熟级别提供了进一步的灵活性，并在第 16 章中进行了更详细的讨论。这意味着，在排除任何不需要的流程之外，你对保留的流程仅实施到你所需的精细程度。\n\
  \n`CRF` 还提供了其流程相对于四组常见合规性要求的详细映射。自然地，每个组织都必须在不同程度上满足不同的需求，因此准确确定你的需求究竟是什么至关重要。第\
  \ 19 章 讨论了你如何做到这一点。\n\n**表 1：IT 治理 CRF（不包含参考框架）**\n\n\n\n\n\n\n诚然，在网络安全方面有许多需要吸收的内容。然而，你不需要自己完成所有的准备工作——起初，像这样的书籍可以提供大量的实用建议和指导。还有许多可用的框架可以为你提供一个现成的、经过验证的结构供你参考，让你确信正朝着正确的方向进行。选择范围很大，尽管在英国有两个格为常见：`Cyber\
  \ Essentials`，它仅包含五个基本控制措施；以及 `ISO 27001`，它包含了多达 114 项控制措施，尽管你只需要实施与你相关的部分即可。\n\n\
  \n\n\n\n\n`CRF` 还提供了其流程相对于四组常见合规性要求的详细映射。自然地，每个组织都必须在不同程度上满足不同的需求，因此准确确定你的需求究竟是什么至关重要。第\
  \ 19 章 讨论了你如何做到这一点。\n--- \n\n# 第 2 部分：威胁与漏洞\n\n## 第 6 章：威胁的剖析\n\n正如我们所看到的，尽管网络世界处处好处，它也带来了巨大的风险。与其他任何类型的风险一样，网络安全风险源于威胁与漏洞的结合——漏洞被威胁利用来实现某些目标，例如访问安全网络或安装恶意软件。然而，这并不意味着网络安全风险限于恶意行为者的蓄意行为——例如，机房内漏水的屋顶（漏洞）可能会被暴风雨（威胁）利用，导致导致灾难性的结果。理解你面临的威胁以及你需要寻找的漏洞类型，是开发有效防御的关键准备步骤。\n\
  \n威胁和漏洞可以以多种形式存在。例如，未能正确过滤用户输入的数据库可能会被攻击者使用 `SQL injection` 利用以访问敏感数据，而未补丁的软件可能允许攻击者安装恶意软件，导致各种糟糕的结果——仅举两例：完全删除文件或将其勒索。\n\
  \n硬件和软件一直在不断演变，漏洞也是如此——每一次创新都会带来新的安全挑战。即使是长期以来、受信任的软件和硬件也无法免俗。2018 年，主要的计算机芯片制造商震惊地发现，他们的处理器自\
  \ 1995 年以来一直存在严重的硬件级安全漏洞（命名为 `Meltdown` 和 `Spectre`）——这些处理器被认为存在于全球几乎每台计算机中。\n\n\
  网络威胁也呈现各种形态。尽管我们首先想到的可能是关在地下室里写代码开玩笑的“书呆子”，但现实大不相同。有组织犯罪集团、推动政治议程的“黑客行动主义者”甚至国家支持的行为者都代表了潜在威胁，无论你的组织规模如何。每个组织都成为目标的原因之一是，许多攻击是机会性的，针对的是漏洞而非公司。\n\
  \n一种特别普遍的威胁者是你生存离不开的：你的员工。即使撇开那些积极以某种方式伤害组织的员工（通常是因为不开心），许多网络安全事件是无意中通过人为错误造成的，因为员工不理解风险，或仅仅是犯了错。根据\
  \ 2020 年《内部威胁报告》，70% 的响应组织在 2019 年经历过至少一次内部攻击。\n\n\n\n\n本书的这部分涵盖了一系列威胁，并按威胁类型进行了分类。该列表远非详尽（无论如何，由于新的威胁和漏洞不断被发现，在此类出版物中做到这一点是不可能的），但它应该让你对最常见的威胁类型有所见解，并感受到它们的多样性。本书的第\
  \ 3 部分 深入讨论了如何应对这些威胁，以及如何通用识别并缓解你可能面临的风险。\n\n⁷ Samuel Gibbs，“Meltdown and Spectre:\
  \ ‘worst ever’ CPU bugs affect virtually all computers”，*The Guardian*， 2018 年 1\
  \ 月, *[`www.theguardian.com/technology/2018/jan/04/meltdown-spectre-worst-cpu-bugs-ever-found-affect-computers-intel-processors-security-flaw`](https://www.theguardian.com/technology/2018/jan/04/meltdown-spectre-worst-cpu-bugs-ever-found-affect-computers-intel-processors-security-flaw)*。\n\
  \n⁸ Cybersecurity Insiders，“2020 Insider Threat Report”，2019 年 11 月, *[`www.cybersecurity-insiders.com/portfolio/2020-insider-threat-report/`](https://www.cybersecurity-insiders.com/portfolio/2020-insider-threat-report/)*。\n\
  \n## 第 7 章：技术威胁\n\n大多数时候，当人们谈论网络安全时，他们首先会想到技术威胁。媒体经常报道大规模数据泄露事件，这些事件最终都会被追溯到某些硬件或软件漏洞，无论这些漏洞是隐藏还是为人知的。在\
  \ 2011 年至 2020 年间，恶意软件增加了惊人的 1,634%。⁹ 仅在不到两个月的时间，英国国家网络安全中心（NCSC）就收到了 1 百万封钓鱼邮件。¹⁰\n\
  \n尽管 NCSC 成功阻止或关停了数千万个恶意网站，但无疑随后又有更多新网站取而代之。遗憾的是，攻击者往往占据优势，因为他们只需要找到并成功利用一个漏洞，而防御者需要保护自己免受各种类型的攻击。“你的安全强度取决于你最薄弱的环节点”这一说法在这里非常贴切。\n\
  \n## 7.1 攻击者\n\n在能够保护自己之前，你需要了解是谁在攻击你，以及他们的武器是什么。在最基础的层面，犯罪黑客关注的是寻找并利用硬件及软件中的缺陷和漏洞。要寻找的漏洞也并不匮乏——没有任何软件或硬件是真正能够免疫的，而且每天都有新的漏洞被识别出来。零日漏洞（厂商尚未察觉的漏洞）是犯罪黑客喜爱的目标，因为这类攻击更有可能成功。\n\
  \n犯罪黑客是一个多样化的群体，涵盖了从典型的躲在地下室的极客到拥有广泛资源的国家支持型“黑客团队”的各类人员。为了更好地分类每类犯罪黑客构成的威胁，他们通常被归分为以下几类。\n\
  \n### 7.1.1 脚本小子 (Script kiddie)\n\n这个术语指的是低技能、通常是年轻的黑客，他们使用预构建的工具来执行低级攻击，且通常对底层原理没有任何真正的理解。尽管这并不能降低他们的威胁性——毕竟，他们的工具是由完全清楚自己在做什么的熟练黑客制作的——但这意味着他们利用的漏洞通常是常见的漏洞，这些漏洞可能已经有了修复程序，而且基础的网络安全措施（如定期补丁，参见\
  \ 12.6.2）通常可以提供保护。\n\n很大比例的网络犯罪正是以这种方式发生的——缺乏经验的恶意行为者购买简单的工具或僵尸网络来执行低级攻击，这些攻击虽然简单，但对组织构成了实质性的威胁，特别是当你使用过时的硬件或软件时，可能会导致严重的后果。许多脚本小子对攻击的更广泛影响或支撑攻击的原理很少或完全不理解，部分原因是在网上购买黑客工具和恶意软件工具包实在太容易了。他们对攻击的真实效果或成本几乎没有概念，并且经常会声称攻击只是“为了好玩”。\n\
  \n### 7.1.2 黑帽 (Black hats)\n\n识别新漏洞并开发用于利用这些漏洞的工具的熟练犯罪黑客被称为“黑帽”。财务动机是常见的——许多黑帽会在暗网上出售他们开发的黑客工具，他们也可能亲自发动攻击，以勒索资金（例如通过勒索软件）或将窃取的信息卖给其他犯罪分子。\n\
  \n与脚本小子不同，黑帽完全清楚自己在做什么，并且通常对想要从特定攻击中实现的目标非常明确。因此，他们是最有效且最令人恐惧的攻击者之一。\n\n### 7.1.3\
  \ 黑客行动主义 (Hacktivists)\n\n“黑客行动主义”更多是对动机的分类，而非技能或能力的分类。黑客行动者发动攻击是为了推动议程，尽管议程背后的意识形态往往定义不明，并可能随时间变化。黑客行动主义攻击很难预测，不仅是因为这些组织本身的迥异性，还因为潜在目标的范围广泛。例如，臭名昭彰的黑客行动主义组织“匿名者”（Anonymous）曾对科学技术教会、索尼在线娱乐、伊斯兰国和唐纳德·特朗普等发动过攻击。¹¹\n\
  \n### 7.1.4 国家行为者与网络战\n\n网络战争听起来像是科幻小说中的情节，但由国家行为者发起的网络攻击日益常见。2019 年 7 月，微软报告称其已通知近\
  \ 1 万名客户（其中 84%为企业账户）他们在过去一年中“成为国家攻击的目标或遭到入侵”。¹²](#Chapter_07.xhtml#fn12)\n\n国家支持的攻击者通常拥有大量的资金和设备，并可能在其国家获得实际或事实上的法律豁免，这使得他们他们变得非常困难（并非不可能）。国家攻击往往具有高度的针对性，并专注于实现特定目标，例如破坏基础设施或窃取知识产权。2010\
  \ 年针对伊朗核设施的 Stuxnet 攻击是网络战的一个著名案例。它针对管理离心机的编程控制器，通过改变转速导致离心机解体。¹³ 最近，在 2020 年寻找新冠疫苗期间，中国¹⁴和俄罗斯¹⁵政府被指控资助犯罪黑客试图窃取英国、美国和加拿的研究。\n\
  \n### 7.1.5 伦理黑客 (Ethical hacking)\n\n并不是每个黑客都是网络犯罪。伦理黑客使用与犯罪黑客相同的工具和技术搜索漏洞，但他们并不是利用漏洞，而是通知系统操作员以便修复漏洞。这种方法被称为“渗透测试”，有助于组织在遭受攻击之前识别并解决漏洞。\n\
  \n渗透测试在 13.1.3 中会有更详细的讨论。\n\n## 7.2 恶意软件 (Malware)\n\n自计算机普及以来，恶意软件就以各种形式存在。自我复制软件的概念最早在\
  \ 20 世纪 40 年代被构思，最早的病毒之一被称为“Creeper”，于 20 世纪 70 年代初创建，感染了美国政府计算机并在屏幕上显示“I’m the\
  \ Creeper, catch me if you can”。\n\n\n\n\n\n自那时起，恶意软件呈现了爆炸式增长。暗网网站提供了各种恶意软件程序供售，新的恶意软件每天都在出现。在编写恶意软件的攻击者与防御它们的网络安全专业人员之间永无止境的军备竞赛中，它们利用了最新的漏洞。“恶意软件”这一类别涵盖了一系列恶意程序，每种程序的运行方式都不同。\n\
  \n### 7.2.1 病毒\n\n病毒是自我复制的程序，旨在从计算机传播到计算机并传递载荷。病毒不是独立程序——它们是需要隐藏在其他程序中才能运行和复制的代码片段。当用户运行“宿主”程序时，病毒感染系统并开始开展工作。\n\
  \n一旦感染了系统，病毒就有两个目标：尽可能地复制自己并传递载荷，且最好在不被发现的情况下完成。最早的一些病毒被称为“引导区”病毒，因为它们感染驱动器中在计算机启动时会被读取的区域，这使得它们难以被检测，并且通常通过共享软盘（这在当时很常见）传播。\n\
  \n互联网时代最常见的病毒之一是“宏”病毒——即使用 Microsoft Office 中的脚本语言编写，并嵌入 Office 文件（如 Excel 表格或 Word\
  \ 文档）中的病毒。打开文档允许病毒感染系统，可能导致灾难性的后果。自 90 年代初以来，带有受感染 Office 文档的电子邮件已成为一种常见的攻击向量，以至于“不要打开可疑附件”已成为一条网络安全准则。\n\
  \n### 7.2.2 蠕虫\n\n如果说病毒的主要特征是它是必须嵌入另一个程序中才能运行的自我复制程序，那么蠕虫就是消除了这一限制的病毒。蠕虫不需要嵌入其他程序，并且可以在没有用户交互的情况下进行复制，这使得它们特别危险。\n\
  \n近年来最为人知的蠕虫之一是 Stuxnet，它在 7.1.4 中简要讨论过。\n\n### 7.2.3 勒索软件\n\n勒索软件随着 2017 年全球性的\
  \ WannaCry（蠕门庄）攻击而进入公众视野。勒索软件是一种载荷，通常通过自我复制的蠕虫或木马传输，它会加密或以其他方式阻止用户访问文件，直到支付赎金金（通常是比特币）。某些勒索软件会获取用户文件的副本并威胁要发布，但效果是一样的——要么付钱，要么损失。\n\
  \n在 WannaCry 攻击之前，勒索软件主要针对个人消费者。2017 年的攻击标志着重点转移的开始，2018 年 81% 的勒索软件攻击针对组织而非消费者。¹⁶\n\
  \n### 7.2.4 特洛伊木马\n\n特洛伊木马（简称木马）是一种伪装成其他东西的恶意软件。这个名字源于古希腊关于木马导致特洛伊陷落的故事。\n\n木马通常伪装成合法的程序以诱骗你激活它们，尽管某些木马可以在没有用户交互的情况下自行传播。最常见的攻击向量之一是电子邮件，因为木马可以嵌入到看似无害的附件中，如电子表格或\
  \ Word 文件。一旦激活，木马就会向地址录中的每一个人发送伪造邮件，进一步扩散感染。\n\n木马可以携带几乎任何种类的载荷，但键盘记录器（记录键盘上的按键击情况）和提供访问敏感信息或系统的“后门”是常见的。包含键盘记录器或其他信息获取方法的木马通常会定期向主服务器发送信息；这些传输有时可能是检测木马存在的唯一方法。\n\
  \n### 7.2.5 混合恶意软件\n\n混合恶意软件是结合了其他恶意软件不同特征以提高效率的软件。\n\n我们今天遇到的大多数恶意软件都是混合型的——例如，带有勒索软件载荷的蠕虫，如\
  \ WannaCry。带有木马或根内核程序（rootkit）载荷的蠕虫负责大多数“僵尸网络”——即连接的计算机或其他联网设备组，用于进行分布式拒绝服务（DDoS）攻击，在这种攻击中，大量设备同时与目标通信以使其过载。物联网（IoT）设备特别容易受到僵尸网络感染和相关威胁，因为它们在硬件和软件层面的安全防护通常较低（尽管随着对物联网威胁意识的提高，这种情况正在开始改变）。\n\
  \n### 7.2.6 “离地攻击”与无文件恶意软件\n\n网络威胁格局中一个较新的进展是，“离地攻击”（living-off-the-land）攻击涉及使用已安装在目标系统上的合法系统和管理工具（如\
  \ `PowerShell` 或 `TeamViewer`）。这些攻击很难检测，因为恶意活动与此类工具的其他合法管理用途混杂在一起。\n\n一个相关的概念是“无文件”恶意软件。离地攻击技术有时被称为无文件恶意软件，因为它们仅涉及现有的合法软件，不需要（例如）用户下载受感染的文件。这并不完全准确；相反，无文件恶意软件最好被看作是不需要或生成反恶意软件可能识别为可疑的额外文件的攻击。示例包括完全在系统内存中运行并传递载荷的恶意软件、嵌入\
  \ Windows 注册表系统的脚本以及某些基于浏览器的加密攻击。\n\n### 7.3 技术威胁案例：TalkTalk 数据泄露\n\n2015 年，TalkTalk\
  \ 遭受了 SQL 注入攻击，导致超过 150,000 名客户的个人数据泄露，英国信息专员办公室（ICO）为此提了 400,000 英元（约 515,000 美元）的罚款（后通过协议达成\
  \ 320,000 英元的和，约 412,000 美元）。\n\nICO 的报告指出，除了 SQL 注入漏洞外，还存在多处网络安全失效，包括之前在同一网页上发生的两次\
  \ SQL 注入攻击，这些攻击由于缺乏监控而未被发现。更糟糕的是，泄露的客户信息存储在一个过时的遗留数据库中，该数据库缺少供应商在三多年前就提供的安全补丁（如果应用了该补丁，本可以阻止攻击）。^(17\n\
  \n有效的安全开发流程本可以防止此类发生。代码注入攻击 20 多年来一直是一个已知且反复出现的漏洞，任何有效的安全开发流程都会强调这一事实。对于遗留数据库也是如此——有效的流程会强调与不受支持的软件相关的风险，特别是当其连接到互联网时，并强制数据库迁移到更近期或替代版本。\n\
  \n如果这被证明是不可行的，它至少可以确保供应商三年前提供的安全补丁已安装。相反，该网站上线了，TalkTalk 的客户遭受了损失。\n\n\n\n\n\n¹¹\
