    +   Kovan, en ampliar el algoritmo de consenso PoA, para obtener otros iguales
    al que Rinkeby pueden ser solicitados.


    +   Roeplein, en ampliar el algoritmo de consenso PoW, en este caso es posible
    realizar la minería para obtener otros para realizar las transacciones mediante
    una red de prueba.


    Es importante mencionar también el despliegue de las pruebas de aplicación descentralizada
    enmando las redes de prueba, luego seguir la solución en la red mainnet realizar
    una inversión de recursos.

    transparencia, confianza entre las partes del ideal es fundamental.


    Para la integración de la blockchain en el café y cualquier industria del mercado
    agrícola, se propone un enfoque que inicialice la industria, puesto se considera
    que es vital conocer sobre la industria y la situación actual para luego definir
    una solución de acorde a las verdaderas capacidades presentadas por esta industria.


    En el caso de Ethereum se establece un establecimiento para poder acceder a la
    red, no obstante, se requiere de tener equipos adecuados puesto en la actualidad
    en la red mainnet la información almacenada supera Terabets (TB) en referencia
    al peso. Así el establecimiento de un nodo requiere costos de hardware de mantenimiento
    y gastos de ancho de banda para permitir la operación del mismo sin energía, internet,
    etc.

    La integración de la blockchain en el ámbito agropecuario no actualmente trata
    de aspectos de tecnología y de desarrollo, engloba aspectos sociales, de considerar
    mejorar a los actores de la cadena para que puedan obtener beneficio de la tecnología
    y los beneficios que les traería ampliamente. Además, es importante de valor analizar
    la situación actual del sector puesto para considerar soluciones que incluyan
    presentar presente como problema de calidad y competitividad los cuales puedan
    orientar a los agricultores a mejores cooperativas.


    En el caso de Ethereum como Servicio (Infura) el cual es un servicio de prove
    un nodo necesita de establecer una infraestructura física de este modo poder acceder
    a la red mainnet.

    Como trabajo futuro pretende integrar tecnologías para la ejecución de contratos.
    Un contrato inteligente se refiere al lenguaje de código (codigo y funciones)
    y datos, los que están en la cadena de bloques que se ejecuta automáticamente
    cuando se cumplen ciertas condiciones. Los contratos inteligentes siguen siendo
    una tarea desafiante.


    Un vez probados los contratos inteligentes y el proceso siguiente es el despliegue
    del frontend. En este caso el framework más popular a nivel de aplicaciones descentralizadas
    es Web3. Para medir la resultado de la cumplimiento de los contratos por Ethereum
    existen los archivos JSON de contratos detallados con detalles del despliegue
    los que se define la dirección donde se almacena en la red y el contrato y sobre
    lo más importante es el contrato en formato ABI, el cual es un formato admitido
    por Web3.

    Además, se plantea explorar como trabajo futuro una solución utilizar un lenguaje
    de Web3 a servicios de registro de contratos en Ethereum.


    Web3 es una API de Javascript que permite la interacción local con un nodo Ethereum
    proporcionando métodos remoto mediante HTTP, IPCTo o WebSockets.

    Finalmente, a detalle de los frameworks y metodologías analizadas en el sector
    de trabajos relacionados, esta propuesta se centra en una solución ideal que pueda
    adapte a cualquier industria o producto, en el presente caso se ha como caso práctico
    a la industria del café, no obstante, no podría aceptarse en el sector cafacadero,
    de lácteo, de otros industrias.


    Para poder implementar la aplicación descentralizada se necesita de un navegador,
    este se puede instalar mediante un plugin para interactuar de forma sencilla con
    los navegadores mas populares y los usuarios con aplicaciones descentralizadas[Ethereum].

    Existe existe para Ethereum: Mist sin embargo de la comunidad. No obstante posee
    de mantenimiento de las mismas funcionalidades que promete MetaMask, y de la que
    este trabajo presente un desarrollo activo de parte de la comunidad.


