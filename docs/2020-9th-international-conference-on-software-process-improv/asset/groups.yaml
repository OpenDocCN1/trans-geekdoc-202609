    ## D. El desarrollo de la arquitectura para descentralizada


    - Remix IDE: es un compilador de interfaz de desarrollo que permite realizar entre
    varias funciones la prueba y de contratos. Para acceder a él debe realizar la
    siguiente dirección: remix.org. El ejemplo destaca que esta herramienta es fundamental
    para Ethereum. En la figura 7 se observa el desarrollo por remix, el cual es de
    despliegue de contratos.


    Definidos los aspectos cubiertos con la arquitectura en el caso de uso, como la
    definición del flujo de trabajo con la arquitectura para la solución, esta fase
    es del desarrollo descentralizado. En el caso de aplicación se elige la arquitectura
    de Ethereum de este modo es importante destacar que esta plataforma admite contratos
    inteligentes. En esta fase se debe realizar el análisis y desarrollo de contratos.
    En el caso del lenguaje de contratos es Solidity.


    Para realizar el despliegue de los contratos es necesario una herramienta que
    permita ejecutar este proceso, una de las disponibles es Truffle. Truffle es un
    entorno para el desarrollo de contratos inteligentes que permite la ejecución
    en la máquina virtual de Ethereum (EVM).


    Cuando se desarrollan contratos inteligentes es importante realizar pruebas antes
    de la fase de producción, de este modo se garantiza el funcionamiento de la solución
    y se evitan costos innecesarios con errores. Existen varias formas de realizar
    pruebas de contratos, ya que esto depende de qué servicios se están ofreciendo.


    ![](img/cfc3096c2400a0b12b787e5556e76b72_6_2.png)


    Las principales herramientas para la ejecución y prueba de contratos inteligentes
    se detallan a continuación:


    ![](img/cfc3096c2400a0b12b787e5556e76b72_6_3.png)


    Ganache, es una aplicación para simular una red blockchain de Ethereum, además
    prove una interfaz gráfica mediante la cual se puede comparar el funcionamiento
    de contratos y observar las transacciones que se están llevando a cabo, esta aplicación
    se encuentra disponible para Windows, Linux y Mac y obtenerla mediante el enlace
    presentado a continuación.


    También existe una variedad de red de pruebas (testnets) que permiten la realización
    de la aplicación descentralizada a la puesta en marcha de la red principal de
    Ethereum.


    Entre estas redes de prueba se encuentra Rsten, Rinkeby y Kovan, con más información:


    - Rinkeby es un blockchain que emplea el mecanismo de consenso de PoA, la ventaja
    de usar esta red de prueba es la facilidad para obtener mediante el faucet.


    - Kovan, en el algoritmo de consenso PoA, para obtener iguales al que Rinkeby
    pueden ser solicitados.


    - Roplein, en el algoritmo de consenso PoW, en este caso es posible realizar la
    minería para obtener para realizar las transacciones mediante una red de prueba.


    Es importante mencionar también el despliegue de las pruebas de aplicación descentralizada
    usando las redes de prueba, luego seguir la solución en la red mainnet realizar
    una inversión de recursos de transparencia, confianza entre las partes es fundamental.


    Para la integración de la blockchain en el café y cualquier industria del mercado
    agrícola, se propone un enfoque que inicialice la industria, puesto se considera
    que es vital conocer sobre la industria y la situación actual para luego definir
    una solución acorde a las verdaderas capacidades presentadas por esta industria.


    En el caso de Ethereum se establece un establecimiento para poder acceder a la
    red, no obstante, se requiere de tener equipos adecuados puesto en la actualidad
    en la red mainnet la información almacenada supera Terabytes (TB) en referencia
    al peso. Así el establecimiento de un nodo requiere costos de hardware de mantenimiento
    y gastos de ancho de banda para permitir la operación del mismo sin energía, internet,
    etc.


    La integración de la blockchain en el ámbito agropecuario no actualmente trata
    de aspectos de tecnología y de desarrollo, engloba aspectos sociales, de considerar
    mejorar a los actores de la cadena para que puedan obtener beneficio de la tecnología
    y los beneficios que les traería ampliamente. Además, es importante valorar analizar
    la situación actual del sector puesto para considerar soluciones que incluyan
    presentar presente como problema de calidad y competitividad los cuales puedan
    orientar a los agricultores a mejores cooperativas.


    En el caso de Ethereum como Servicio (Infura) el cual es un servicio prove un
    nodo necesita de establecer una infraestructura física de este modo poder acceder
    a la red mainnet.


    ## V. CONCLUSIONES Y TRABAJOS FUTU


    Las diferentes soluciones descentralizadas basadas en Blockchains proporcionan
    un mecanismo para almacenar y calcular datos distribuidos de forma segura. Estas
    plataformas distribuidas pueden ser útiles en dominios la


