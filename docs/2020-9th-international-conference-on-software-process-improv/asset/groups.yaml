    # D. El desarrollo de la arquitectura para descentralizada


    +   - Remix IDE: es un compilador de interfaz de desarrollo que permite realizar
    entre varias funciones de la prueba y de contratos inteligentes. Para acceder
    a él debe realizar la siguiente dirección: remix.ethereum.org. El ejemplo destaca
    que esta herramienta es muy fundamental para Ethereum. En la figura 7 se observa
