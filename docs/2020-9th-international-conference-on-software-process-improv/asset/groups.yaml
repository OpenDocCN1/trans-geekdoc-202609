    Definidos los aspectos cubiertos con la arquitectura en el caso de uso, como la
    definición del flujo de trabajo con la caracterización del proceso, la arquitectura
    para la solución, esta fase es del desarrollo del descentralizado.


    En el caso de aplicación se elige la arquitectura blockchain de Ethereum de este
    modo es importante destacar que esta plataforma admite soporta contratos inteligentes.
    De en esta fase se debe realizar el análisis y desarrollo de contratos inteligentes.
    En el caso del lenguaje de contratos inteligentes es Solidity.


    Para realizar el despliegue de los contratos inteligentes es necesario una herramienta
    que permita ejecutar este proceso, una de las alternativas disponibles es Truffle.
    Truffle es un entorno para el desarrollo de contratos inteligentes que permite
    la ejecución y establecer pipelines blockchain en la máquina virtual de Ethereum
    (EVM).


    Cuando se desarrollan contratos inteligentes es importante realizar pruebas antes
    de la fase de producción, de este modo se garantiza el funcionamiento de la solución
    y se evitan costos innecesarios con errores. Existen varias formas de realizar
    pruebas de contratos, ya que esto depende de qué de servicios se están ofreciendo.


    ![](img/cfc3096c2400a0b12b787e5556e76b72_6_2.png)


    Las principales herramientas para la ejecución y prueba de contratos inteligentes
    se detallan a continuación:


    ![](img/cfc3096c2400a0b12b787e5556e76b72_6_3.png)


    Ganache, es una aplicación para simular una red blockchain de Ethereum, además
    prove una con interfaz gráfica mediante la cual se puede comparar el funcionamiento
    de contratos y observar las transacciones que se están llevando a cabo, esta aplicación
    se encuentra disponible para Windows, Linux y Mac y obtenerla se puede realizar
    mediante el enlace presentado a continuación


    También, existe una variedad de red de pruebas (tests-net) que permiten la realización
    de la aplicación descentralizada a la puesta en marcha de la red principal de
    Ethereum.


    Entre estas redes de prueba se encuentra Ropsten, Rinkey y Kovan, con más información:


    +   - Reby es un blockchain que emplea el mecanismo de consenso de PoA, la ventaja
