    programas informáticos descentralizados especializados llamados Smart Contracts
    (SC) que se implementan en el mercado de BC. Estos SC están abiertos para una
    amplia gama de desafíos y utilizados para cualquier tipo de sistemas de usuarios
    finales donde se ejecutan en forma de códigos de bytes sin alterar asociados.


    En este trabajo pretende lograr la trazabilidad y transparencia de la industria
    del utilizando tecnología blockchain. Para lo cual se hace uso de Ethereum como
    plataforma con el objetivo de desarrollar una aplicación descentralizada. El documento
    describe la técnica utilizada el enfoque metodológico, los resultados obtenidos
    del estudio, finalmente conclusiones y trabajos futuros.


    # II. TRABAJOS RELACIONADOS


    Con el desarrollo y seguimiento de nuevas tecnologías, entre esta tecnología blockchain,
    en la actualidad existe un interés global por integrar esta tecnología en el sector
    agroalimentario. Para mejorar el proceso productivo, aumentar la productividad,
    valorar y rastrable de los productos que se han incrementado durante los últimos
    años, así también el interés del consumidor por la procedencia de los mismos.
    Se están desarrollando soluciones en la tecnología de precisión, sistemas de comercio
    electrónico, sistemas de trazabilidad para lograr la transparencia de la cadena
    de suministro.


    Astill y al [10] proponen una definición para la trazabilidad que contribuyen
    a la transparencia en la cadena de alimentos, los autores realizan un análisis
    detallado de la tecnología mediante la revisión de relación con transparencia,
    trazabilidad y sostenibilidad en la cadena de suministros. Los autores definiendo
    varias tecnologías que constituyen la transparencia de la cadena de suministros
    entre los alimentos.


    En [11] Rubio, Tarazona y Centeras, realizan la propuesta de un prototipo de aplicación
    para la cadena de suministro, con soporte integra grandes volúmenes de datos (big
    data) con blockchain para lograr la gestión de la cadena de suministro de las
    empresas involucradas; para presente presenta su propuesta la cual es abordada
    mediante un caso de estudio, en este trabajo se propone una arquitectura para
    integrar gran día de la cadena de suministro.


    En relacionado con estas arquitecturas de soluciones blockchain, Liu y AI [12],
    realizan la implementación de patrones de diseño en la construcción de contratos
    inteligentes. Los autores hablan mediante un caso de estudio relacionado con la
    cadena de suministros. blockchain. El trabajo aborda el diseño de soluciones inteligentes,
    mediante aplicar patrones de diseño encontrados en contratos inteligentes.


    En [13] los autores realizan un análisis de la aplicación de la tecnología blockchain
    en el sector agroalimentario, para lo cual se propone una revisión de propuestas
    y soluciones blockchain a este sector que buscan y se encuentran en producción,
    los autores realizan un análisis amplio del uso de blockchain el sector objeto.


    En [14], realizan una revisión de la literatura académica de aplicaciones y servicios
    basados en la tecnología blockchain, los autores analizan varias ventajas de esta
    tecnología blockchain, entre algunos de los sectores que mencionan el sector financiero,
    cadena de suministros, sector energético, gobierno eléctrico. De estos casos destacan
    las ventajas que consigue la aplicación de la tecnología blockchain en la industria.


    En lugar Bueno-Almeidaa et al [15] realizan una investigación con el objetivo
    de obtener los beneficios que consiga la aplicación de la tecnología blockchain
    en la cadena de suministro. Analizan un caso de uso real, por ejemplo, herramientas
    y métodos para mejorar la autenticidad de los productos alimenticios. Además,
    realizan varios casos de uso y la propuesta de blockchain para la producción de
    alimentos.


    Por parte Liao y Gineschi [16], realizan el análisis de varias aplicaciones blockchain
    desarrolladas para diversas industrias, realizan el análisis de las plataformas
    blockchain para el desarrollo de soluciones, los autores presentan un análisis
    de los beneficios encontrados en los casos analizados.


    En Yan, Chen y Liu [17] proponen la aplicación de un caso de éxito de la tecnología
    blockchain en la cadena de suministros de la multivitaminart, los autores analizan
    los beneficios obtenidos al implantar la tecnología blockchain en la cadena de
    suministros de los que destacan la reducción de los riesgos relacionados con la
    seguridad alimentaria uno entre los otros productos donde se encuentra el alimento,
    otros resaltan la eficiencia al momento de gestionar la cadena de suministro.


    Wang y Liu [18] proponen un marco para la aplicación de tecnología blockchain
    en el almacenamiento de información de productos relacionados con productos, analizan
    las ventajas de la tecnología tradicional y blockchain. También presentan varios
    aspectos de los sistemas analizados y proponen


    De forma similar Roy, Gayeshi y Ghosh [19] realizan una investigación sobre la
    tecnología blockchain para la gestión de información de la cadena de suministros,
    además de realizar una propuesta contextual de una solución enfocada al ámbito
    de su investigación. También también también de un enfoque tradicional en comparación
    a la solución que emplea tecnología blockchain.


    En [20] se propone un medio mediante el cual se buscar la certificación de los
    ingredientes empleados en una receta, por lo cual proponen la presencia de una
