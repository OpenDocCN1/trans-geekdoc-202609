  md: 'Por otra parte Viere, von Enden y Schaltegge [30] en su trabajo realizan el
    análisis de la cadena de suministro del café, otros autores dibujan 7 fases en
    las que concuerdan:


    +   * Cultivo;

    * Procesamiento en seco;

    * Procesamiento húmedo;

    * Refinamiento;

    * Tostado;

    * Venta; y;

    * Consumo


    +   * La fase de cosecha: en esta fase, una vez que el agricultor cosecha la cereza,
    se realiza la cosecha. La información que podría considerarse registrada en esta
    fase en que se realizó la cosecha, por ejemplo como de cosecha, detalles, otros
    aspectos.


    +   * La fase de pre-procesamiento: en esta fase, la cosecha cosechada, el agricultor
    finaliza el proceso. Existen dos métodos: un proceso seco (Secado) y uno húmedo
    (pulping, fermentation, lavado). Completados cualquiera de los procesos, la siguiente
    actividad es la de la cere procesada. En fase de pre-procesamiento, la información
    que podría registrar está vinculada al lote, por ejemplo, si fue tratada por un
    proceso seco o húmedo (hidratado), así como la fecha y el día que se llevó a cabo
    este proceso.


    Del mismo modo en [31] realizan el análisis de la cadena de suministro del café
    en el Perú algunas fases que destacan los autores muestran:


    +   * Lavado;

    * Secado;

    * Inspección;

    * Clasificado;

    * Trillado;

    * Empacado; y;

    * Carga.


    +   * La fase de procesamiento: en esta fase, se lleva a cabo la transformación
    de la cereza. Los actores en esta fase son el agricultor, trillador, molino, entre
    otros actores que podrían ser considerados.


    Esta comienza con el trillado de la cereza, se selecciona y empaca posteriormente
    el siguiente paso es el tostado de la cereza. En algunas presentaciones, el grano
    se secciona y dispone para la espera. Mientras que en otras se realiza la molienda
    empacada posteriormente para la venta de café. La información que podría generarse
    se referirá a la fecha y lugar de ejecución de cada fase, además de las características
    de cada una, por ejemplo, el tipo de tostado realizado.


    Así en función de los trabajos manejados y expertos se establecieron las siguientes
    fases para la cadena de valor: la cosecha, el pre-procesamiento, el empaque; el
    transporte (envío y recepción), lo cual se puede observarse en la figura 3.


    | Production | Harvesting | Pre-processing |

    | :--- | :--- | :--- |

    || Production | Harvesting | Pre-processing |

    | Transporting | Packaging | Processing |


    Figura 3 Metodología para la integración de blockchain en el sector agrouario


    Las fases mencionadas son descritas a su continuación:


    +   * La fase de plantación: constituye el inicio de la cadena de suministro de
    café. En esta fase, el agricultor realiza la planta de café para su posterior
    crecimiento y cosecha. En esta fase, la información generada corresponde a detalles
    de la plantación, como la fecha en que se le llevó a cabo, el nombre de la finca,
    el nombre del agricultor, la especie de café.


    Además, podrían registrar detalles para permitir la geolocalización de la finca
    e información adicional sobre la plantación.


    +   * La fase de transporte: este proceso consiste en transportar la cereza cruda,
    pre-procesada o procesada, en caso de ser necesario este proceso para que el flujo
    de producción continúe.


    De este modo la información generada en esta fase corresponde al envío y recepción
    del producto en cualquiera de los puntos previamente indic, así como detalles
    adicionales como la fecha de transporte, el actor encargado de este proceso es
    el transportista.'
