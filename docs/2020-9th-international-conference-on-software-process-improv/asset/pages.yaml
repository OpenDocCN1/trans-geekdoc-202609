    **Resumen -** En los últimos años la tecnología blockchain ha logrado una aplicación
    móvil en múltiples industrias debido a sus características únicas que son la transparencia,
    trazabilidad, interoperabilidad, integridad entre otras. Este trabajo presenta
    un marco metodológico para la integración de la tecnología blockchain en la industria
    del café. Para ello se propone una metodología para la implementación de esta
    tecnología en esta industria, el análisis detallado de los aspectos de producción,
    definición de una arquitectura para el desarrollo y soluciones de blockchain tecnología.
    Esta investigación plantea que las características de la tecnología blockchain
    sugieren que se puede establecer una solución que permita la transparencia y trazabilidad
    en el proceso productivo realizado por la industria del café.


    gestionar diversos desafios relacionados con garantizar la producción de calidad,
    y lograr que este sector sea atractivo y rentable para los pequeños agricultores
    [1].


    En este contexto, el mercado del café es una industria global. Según el Departamento
    de Agricultura de Estados Unidos (USDA) existen alrededor de 60.000 millones de
    gramos de café generados alrededor del mercado hasta el 21 de junio de 2020 [6].
    Un aumento en el precio de café de [8. La Organización Internacional del Café
    (ICA) reporta que el año 2017 y 2018 hubo un aumento en la producción mundial
    de café [7].


    El café se cultiva en Ecuador ha tenido mucho tiempo en las últimas décadas que
    ha ocupado un lugar importante de desarrollo de la agricultura. En Ecuador existen
    alrededor de 60.000 agricultores de café a lo largo del país. Esto tiene una capacidad
    de exportación de aproximadamente 80.000 sacos de café por año [8]. Las variedades
    de café con mayor demanda se espera exportar Washed Arabica, Natural y Robusta.
    Las variedades de café que más se consumen en el mundo son el café suave,, considerado
    en el resultado del mercado como un café de gran calidad.


    **Abstract -** In recent years, blockchain technology has showed remarkable application
    in multiple industries due to its inherent characteristics such as transparency,
    traceability, interoperability, integrity, and among others. This work presents
    a methodological framework for the integration of blockchain technology in the
    coffee industry. For this, several necessary steps are proposed to implement this
    technology in this industry, the detailed analysis of production aspects, definition
    of an architecture for the development and solutions of blockchain technology.
    This suggests that the characteristics of blockchain technology can be used to
    establish a solution that allows transparency and traceability in the production
    process carried out the coffee industry.


    **Palabras clave -** Blockchain, trazabilidad, Aplicación descentralizada, Industria
    del Café, Agricultura


    **Keywords -** Blockchain, Traceability, Decentralized Applications, Coffee Industry,
    Agricultural


