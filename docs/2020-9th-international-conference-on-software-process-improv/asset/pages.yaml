    # III. Metodología


    La integración de la blockchain en la industria y en la cadena de suministro debe
    estar alineada con el proceso productivo. Para ello en este trabajo se propone
    un marco metodológico que se divide en 4 etapas que comprenden la definición del
    alcance, la definición de la cadena de valor, la definición de una función en
    una arquitectura de blockchain y finalmente el desarrollo de la aplicación descentralizada.


    En esta etapa es importante definir la información que desea registrar en cada
    fase del proceso productivo definida, la información que posiblemente podría necesaria


    +   - Información relacionada con la siembra del producto, entre los cuales se
    podrán encontrar la fecha de la siembra, lugar y variedad


    +   - Información relacionada con la producción o mercados, entre los cuales podrán
    encontrarse referentes al proceso siguiente, temperatura, lugar donde se realizó
    el producto


    +   - Información relacionada al transporte, entre los cuales podrán encontrarse
    referentes al envío y recepción de productos, por ejemplo fechas, identificación
    de vehículo, entre otros datos.


    +   - Otra información de las fases definidas en la cadena de valor, por ejemplo
    el intercambio, venta, etc.


    A continuación, en la figura 1, se presenta la metodología propuesta por los autores
    para la integración de la blockchain en la industria del cual siendo posible usar
    un modelo general en el sector agrouario y alimentario.


