    # ## IV. METHODS


    # ### A. Problem Definition and Overview


    When being unaware of what brings higher expected returns, an agent should explore
    environments without bias to get sufficient results. At the same time, the agent
    has to gather information to discover the optimal action. One of the challenges
    in RL, is the trade-off between exploration and exploitation. To address this
    issue, exploration strategy should encourage an agent to explore in directed and
    global domains. Directed exploration is focused on related knowledge of training,
    such as trajectories of an agent, and global exploration is to explore based on
    long-term usefulness rather than immediate usefullness.


    Most of prior RL methods depend on naive exploration, such as Gaussian noise or
    $\epsilon$-greedy algorithm. These strategies only depend on randomness or cannot
    consider long-term usefulness, which makes it difficult to scale RL to real-world
    scenarios. Unlike prior exploration strategies, we propose an effective and efficient
    strategy to encourage exploration in directed and global manner. The key idea
    of exploration strategy is to inspire an agent to increase the value of actions
    it takes. We also introduce a framework that allows our exploration method to
    be applied to environments where reward is sparse or cannot be defined properly.
    Further details about our method and the introduced framework are described in
    the following sections.


    # ### B. Exploration Strategy based on Value of Actions


    Our method defines individual policies for exploration and exploitation. While
    the exploration policy


    encourages an agent to explore unknown environments, with the highest exploitation
    yield an agent to take action with. Unlike other methods which use only one policy,
    our method uses individual exploration and exploitation policies that an agent
    can explore more efficiently. Exploration is trained to take action with the highest
    intrinsic reward, and we extract this intrinsic reward to train a single policy,
    which we use to balance the independence of exploration and exploitation. In the
    settings mentioned above,


    we propose a KL-divergence Policy Selector to select a single action from two
    distributions. First of all, we hypothesize that actions are favorable from the
    point of view of exploration unfavorable from the point of view of exploitation.
    It is inspired from the idea that action if successful exploration leads to higher
    expected returns. To formulate the choice of actions, our exploration strategy
    chooses using zero property of KL divergence, which prevents the penalty that
    KL divergence $KL(\pi|\pi'')$ might incur. Our methods use the KL divergence $KL(\pi|\pi'')$
    in which exploitation yield is weighted to balance exploration and exploitation.
    Our KL-divergence policy selector selects the action with the following


    ```

    $$(\pi(s)(x) \times (1-KL(\pi|\pi'') - \lambda))$$

    ```


    ```

    $$(\pi(s)(x) \times f(KL(\pi|\pi'') - \lambda))$$

    ```


    where $f(x)$ is reward and $\lambda$ is threshold. According to this equation
    (1), an agent explores to gather information when KL divergence between policies
    is smaller than $\lambda$, otherwise explore the information and consider the
    action with the highest expected reward.


    Figure 2 shows how our exploration strategy handles tradeoff between exploration
    and exploitation in a single episode. In snapshot-1, Policy Selector selects the
    environment with high validity while in snapshot-4, agent explores environments
    where there is no validation at all. This shows that our proposed method allows
    an agent to explore environments in directed and global manner with following
    reasons: 1) Exploration is considered with considering the value of actions, it
    retains the knowledge of the agent which it conducts exploration in the directed
    manner, 2) It also conducts exploration in that it takes the long-term usefulness
