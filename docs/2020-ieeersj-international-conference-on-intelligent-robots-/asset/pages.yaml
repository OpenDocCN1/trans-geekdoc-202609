    # V. EXPERIMENTS


    # A. Experimental Setup


    We demonstrate our method with various tasks from classical tasks to high-dimensional
    urban driving tasks. We employed PPO[18] for a baseline algorithm. We obtained
    demonstrations from expert policies trained with RL algorithms. We tried to figure
    out how our method actually executes in an efficient way. As follows: $P_1$ indicates
    our proposed method uses policy Selector to select between exploration and exploitation,
    $P_2$ indicates our second method uses expert demonstration to guide an agent,
    $M_1$ indicates the baseline, $M_3$ indicates $M_1$ and $P_1$, $M_4$ indicates
    $M_1 + P_2$.


    # B. MountainCar


    For classical tasks, our method is demonstrated with MountainCarContinuous (MCC).
    The distribution of exploration and exploitation policy is shown in Figure 5.
    The x-axis indicates the range of action space, and y-axis indicates the probability
    of action space. We can gather that as the training process proceeds, the distribution
    of two policies are moving and converges with high KL divergence at last. Our
    method agent mainly explores at the initial training step while mainly exploits
    at the final step. In addition, average reward rewards, $M_2$ was 93.27 while
    $M_1$ was 87.13.


