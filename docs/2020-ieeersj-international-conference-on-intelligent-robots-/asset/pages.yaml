    # III. PRELIMINARIES


    # A. Learning from Demonstrations(LfD)


    As to explain why reward significantly affects the performance of an agent, it
    is hard to handle the agent''s exploration in sparse reward environments. Expert
    demonstrations can be used to tackle the challenges in sparse reward environments.
    There are several methods such as reinforcement learning from imitation. Behavior
    Cloning (BC) trains the agent with supervised learning from expert demonstrations.
    It is the basic method in LfD, BC requires much larger amount of data than other
    methods as it is based on supervised learning. Inverse Reinforcement Learning
    (IRL) tries to search an optimal reward function from the expert demonstrations,
    then the reward can be used to train the agent through reinforcement learning
    by minimizing the difference between the agent policy and the ground truth expert
    demonstrations. Our method employs framework of IL, which employs Generative Adversarial
    Imitation Learning (GAIL)[4] which as adversarial concept of Generative Adversarial
    Neural Network (GAN)[15] is shown to be effective in complex environments with
    large state space or high-dimensional domain.


