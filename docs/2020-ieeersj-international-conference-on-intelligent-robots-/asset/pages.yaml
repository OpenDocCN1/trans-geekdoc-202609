    # VI. CONCLUSIONS


    In this paper, we introduce a novel exploration strategy that can conduct directed
    and global exploration. The main idea behind our work is to consider the validity
    of the actions by using zeroed KL divergence. Our method is evaluated with various
    tasks ranging from high-dimensional autonomous driving tasks with continuous action
    and sparse reward. The results show that our method is capable of handling trade-off
    between exploration and exploitation. Future interest is to apply our method to
    off-policy RL. We also plan to demonstrate our method in more complex and various
    autonomous driving tasks or with real-world navigation tasks.


