    algorithm and Gaussian noise depend on random. It is crucial for an agent to consider
    its progress and long-term usefulness to efficiently explore environments, which
    remains a major challenge in reinforcement learning. To address this we propose
    a novel exploration method that selects actions based on their validity. The key
    idea behind our method is to estimate the validity of actions by leveraging redundant
    divergence to comprehensively evaluate actions in both exploration and exploitation.
    We also introduce a framework that allows an agent to explore efficiently in environments
    where reward is sparse or delayed. The framework uses expert demonstrations to
    guide the agent to visit relevant-state space by combining exploration strategy
    with attention learning on autonomous driving scenarios at roundabout. We show
    that our exploration strategy encourages an agent to visit relevant-state space
