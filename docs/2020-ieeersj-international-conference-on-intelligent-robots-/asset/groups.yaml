    # 深度强化学习基于动作有效性的探索策略


    Hyung-Sook Yoon, Sang-Hyun Lee, Seung-Woo Seo


    摘要——如何探索环境是强化学习中智能体最关键的因素之一。传统的探索策略如e-greedy算法和高斯噪声依赖于随机性。对于智能体而言，考虑其进度和长期用途以高效探索环境至关重要，这仍然是强化学习中的一个主要挑战。为了解决这个问题，我们提出了一种基于动作有效性选择的新型探索方法。我们方法的核心思想是利用冗余散度（redundant
    divergence）估计动作的有效性，从而全面评估探索和利用过程中的动作。我们还引入了一个框架，允许智能体在奖励稀疏或延迟的环境中进行高效探索。该框架通过将探索策略与环岛自动驾驶场景中的注意力学习相结合，利用专家演示引导智能体访问相关的状态空间。我们证明了该探索策略能够鼓励智能体访问动作有效性更高的相关状态空间，性能优于以往的方法。


    ![](img/81d27dbb84ef9a9ac54f10ffacad9e8d_0_0.png)


    图. 1：我们方法的概述。图中包含探索（蓝色）和利用（红色）策略。右下角描述了相对于训练步骤的探索与利用的使用比例。


    ## I. 引言


    强化学习（RL）是一个通过与环境交互来学习如何操作以最大化累积奖励的框架。虽然强化学习广泛应用于游戏[1]、机器人[2]和导航[3]等多个领域并取得了成功，我们在应用强化学习解决现实问题时仍然面临困难。主要问题之一是探索（exploration）与利用（exploitation）之间的平衡：在强化学习中，智能体应该通过探索来发现新动作，以确定最优动作并减少对环境的不确定性；同时智能体也必须利用收集的信息来获取高奖励。遗憾的是，这仍然是强化学习中的一个重大挑战。


    e-greedy算法和高斯噪声等新的探索策略仅依赖随机探索。虽然这些策略被用于许多强化学习方法，但在复杂或高维环境中进行高效探索需要引导性和全局性的探索。引导性和全局性的探索是指基于学习过程的知识和探索的长期用途来探索环境。


    近年来引入了许多探索策略。Bellemare等人[4] 提出了基于密度模型的伪计数（pseudo-count）方法概念。该方法使用基于计数的探索将其推广到非表格化设置。Tab等人[5]
    引入了基于前向动力模型预测误差构建的基于好奇驱动的探索策略。这些算法显著改进了探索结果，但并非所有算法都满足引导性和全局性探索的要求。此外，它们只关注一种探索策略，而没有考虑探索与利用之间的平衡。


    在本文中，我们提出了一种可以执行引导性和全局性探索的方法。我们工作的核心思想是根据动作的有效性选择动作。为了公式化，我们定义了探索和利用的独立策略，并根据Kullback-Leibler（KL）散度的属性引入了KL选择器来全面评估动作的有效性。在机器学习中，有效性被用于定义损失函数以最小化真实值与预测分布之间的差异，而我们利用它来最大化探索与利用之间的差异。


    例如，我们的方法如图1所示。它展示了训练完成时的情况。右上行的候选动作A和C尽管智能体已经通过高奖励进行了训练，但它们具有高有效性。候选动作B的有效性在经过足够训练后可以为其保证。因此，智能体很可能在空间B中进行利用。对于D，它可能从探索策略中选择；但该动作极有可能返回奖励，因此探索策略不太可能更新到那里。此外，在训练过程中，探索的比例减少而利用的比例增加，这意味着智能体先进行探索，然后开始利用。通过这个例子，我们可以看到探索和利用都是重要的。我们的方法在这个过程中建议了探索策略。


    我们的工作引入了一个框架，允许智能体在奖励稀疏或无法定义的环境中探索和利用。我们使用实验方法，通过将探索策略与模仿（imitation）相结合引导智能体进入任务相关状态。我们在CARLA[6]的经典任务和自动驾驶任务中评估了我们的方法。与经典任务相比，自动驾驶具有包括任务奖励在内的巨大状态空间。结果表明，所提方法允许智能体以直接和全局的方式进行探索，处理探索与利用的平衡。我们工作的主要贡献总结如下：1）我们提出了解决探索与利用平衡的学习策略；2）我们引入了适用于复杂和稀疏奖励环境的学习框架；3）我们在RL街道和自动驾驶任务上与多个基准方法相比验证了我们方法的性能。


    最近，许多研究正尝试用深度学习解决自动驾驶。Boarski等人[11] 提出了基于图像和动作输出的CNN端到端监督学习自动驾驶。Palisal[12] 针对CARLA中具有多智能体分类的复杂场景提出了强化学习算法。Codevilla等人[13]
    也引入了基于离策略强化学习世界模型的自动驾驶。然而，这些之所以能严格成功是因为它们采用了诸如动作离散化等额外技术。我们的工作在具有真实设置的CARLA模拟器城市自动驾驶中演示。


    ## II. 相关工作


    探索与利用之间的平衡问题已广泛研究了数十年。以前有几种方法[7],[8]可以保证探索的质量。然而，有限空间中的每个智能体都依赖于每个状态-动作对的访问次数，这在高维或连续空间中是不可行的。深度强化学习在各个领域取得了卓越成就，但许多方法在e-greedy等简单任务上仍然失败。为了解决复杂和高


    最近的若干工作在大规模领域提出了探索方法。Belle等人[4]和Wang[7] 引入了开发大规模领域传统探索策略的高效方法。Ha等人[10] 引入了一种探索策略，通过考虑当前策略与近期策略之间的差异，允许智能体尽可能多样化探索。据我们所知，我们的方法是第一个


    内在激励强化学习

    内在奖励是对智能体的一种定性引导，它由智能体自身产生。生成内在奖励的方法有状态新颖性和信息。在我们的工作中，内在好奇心模块（ICM）[5]基于预测误差奖励。它是一个状态转换（前向动力学）模型，根据当前状态和动作预测智能体的下一个状态。真实状态与预测状态之间的预测误差被用于最小化奖励。当预测误差很高时，意味着该状态访问较少，智能体必须对该状态进行探索，从而引导智能体


    ## III. 预备


    ### A. 演示学习 (LfD)


    为了解释为什么奖励会显著影响智能体的性能，在稀疏奖励环境中很难处理智能体的探索。专家演示可用于应对稀疏奖励环境中的挑战。有许多方法，如模仿强化学习。行为克隆（BC）通过专家演示的监督学习训练智能体。它是LfD的基础方法，由于基于监督学习，BC比其他方法需要更多的数据。逆强化学习（IRL）尝试从专家演示中搜索最优奖励函数，然后该奖励可以通过最小化智能体策略与真实专家演示之间的差异来训练智能体。我们的方法采用了IL框架，该框架利用了生成对抗模仿学习（GAIL）[4]，后者作为生成对抗网络（GAN）[15]的对抗概念，被证明在具有大状态空间或高维领域的复杂环境中是有效的。


