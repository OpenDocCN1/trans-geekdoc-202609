    As expected, $M_1$ shows the best performance and $M_2$ follows, $M_3$ is demonstrated
    with 0% success rate; it is verified that with random exploration, it is very
    hard to find task-relevant states with continuous action. Otherwise, $M_4$ shows
    high performance means that our method successfully and efficiently explores in
    a complex space with $P_i$.


    # VI. CONCLUSIONS


    In this paper, we introduce a novel exploration strategy. The main idea behind
    our work is to consider the trade-off between exploration and exploitation. Our
    method is evaluated with high-dimensional tasks ranging from real-world. The results
    show that our method is capable of handling complex tasks. Future interest is
    to apply our method to more tasks.


