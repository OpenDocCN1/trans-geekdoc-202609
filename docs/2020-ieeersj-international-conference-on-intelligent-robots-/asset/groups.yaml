    ## C. MuJo


    我们的方法在 MuJo[19] 上也得到了演示，特别是 Hopper、Halfetah 和 Walker。结果如图 4 所示。我们看到在每个任务结束时，$M_3$
    获得的奖励比 $M_1$ 高。特别地，我们方法的运行可以通过训练过程中的方差变化来很好地描述。它在在初始阶段和中期训练步骤表现出高方差，而在最后一步值较低。通过我们的方法，智能体的探索与利用在初始和中期步骤表现出高方差。然后，当智能体进行了足够的探索并开始主要以高质量的利用动作进行操作时，它识别出回合奖励的低方差。简而言，我们认为
    $P_1$ 引导智能体以更高效、有效的方式进行探索。


    # V. 实验


    ### A. 实验设置


    我们通过从经典任务到高维城市驾驶任务的各种任务演示了我们的方法。我们采用 PPO[18] 作为基准算法。我们从用 RL 算法训练的专家策略获取演示数据。我们试图弄明方法实际上如何以高效的方式执行。如下：$P_1$
    表示我们提出的方法使用策略选择器（Selector）在探索和利用之间进行选择，$P_2$ 表示我们的第二种方法使用专家演示来引导智能体，$M_1$ 表示基准，$M_3$
    表示 $M_1$ 和 $P_1$，$M_4$ 表示 $M_1 + P_2$。


    ### B. MountainCar


    对于经典任务，我们的方法在 MountainCarContinuous (MCC) 上进行了演示。探索与利用策略的分布如图 5 所示。x 轴表示动作空间范围，y
    轴表示动作空间概率。我们可以观察到随着训练过程的进行，两种策略的分布在移动，并在最后以高 KL 散度收敛。我们的方法智能体在初始训练步骤主要进行探索，在最后步骤主要进行利用。此外，平均奖励方面，$M_2$
    为 93.27，而 $M_1$ 为 87.13。


    ### D. 自动驾驶任务


    对于自动驾驶任务，我们使用 CARLA 以及其他不发生任何事故的车辆。与简单的驾驶任务不同，它要求智能体考虑并理解其他车辆的意图，并在道路上与其交互。我们在训练智能体周围使用了两个场景进行评估：单车环（RoundaboutOne）和双车环（RoundaboutTwo）。我们从
    CARLA 的自动驾驶功能中获取了约 1000 个回合的实验演示。我们通过 50 次试验的成功率对这些任务进行了评估，而非结果。


    如预期所示，$M_1$ 表现出最佳性能，$M_2$ 紧随其后，$M_3$ 的成功率为 0；证明了通过随机探索很难在连续动作中找到任务相关状态。相反，$M_4$
    显示出高性能，意味着我们的方法通过 $P_i$ 成功且高效地探索空间。


    # VI. 结论


    在本文中引入了一种新的探索策略。我们工作的核心思想是考虑探索与利用之间的平衡。我们的方法对从现实世界的高维任务进行了评估。结果表明我们的方法能够处理复杂任务。未来的兴趣是将我们的方法应用于更多任务。


    # VII. 致谢


    本工作得到了韩国国家科学基金会（NRF）基础科学计划的支持，并资助。


