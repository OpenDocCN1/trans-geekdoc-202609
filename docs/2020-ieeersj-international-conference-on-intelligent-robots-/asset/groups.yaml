    ## I. INTRODUCTION


    Reinforcement Learning (RL) is a framework for learning what to do as to maximize
    cumulative reward through interaction with environments. While RL is widely applied
    and shown success in various areas like games [1], robotics [2], and navigation
    [3], we struggle with applying RL to solve real-world problems. One of the main
    problems is the trade-off between exploration and exploitation: in RL, agent should
    explore to discover new actions in order to figure out the optimal action and
    reduce uncertainty over the environments, and the agent also has to exploit the
    gathered information to get high rewards significantly. Unfortunately, this still
    remains a significant challenge in RL.


    New exploration strategies like e-greedy algorithm and Gaussian noise just depend
    on random exploration. While these strategies are used in a lot of RL methods,
    directed and global exploration is required for efficient exploration in complex
    or high-dimensional environments. Directed and global exploration is to explore
    environments based on knowledge of the learning process and long-term usefulness
    of exploration.


    Exploration strategies introduced in recent years. Bellemare et al. [4] proposed
    the concept of a pseudo-count approach by a density model. This method uses count-based
    exploration to be generalized to non-tabular settings. Tab et al. [5] introduced
    the exploration strategy based on curiosity formulated with a prediction error
    of a forward dynamics model. These algorithms show significantly improved exploration
    results, yet not all of them satisfy all the requirements for directed and global
    exploration. Furthermore, they only focused on one exploration strategy, not the
    trade-off between exploration and exploitation.


    In this paper, we propose a method that can perform directed and global exploration.
    The key idea behind our work is to choose actions based on their validity. To
    formulate we define individual policies for exploration and exploitation, and
    introduce a Kullback-Leibler (KL) selector based on property of KL divergence
    to comprehensively evaluate validity of actions. While validity is used to define
    loss function for minimizing difference between ground truth and predicted distribution
    in machine learning, we use it to maximize difference between exploration and
    exploitation.


    As an example, our method is described in Figure 1. It shows the condition when
    training is completed. Candidates A and C in the top right row have high validity
    although an agent has been trained with high rewards. candidate act B has validity
    which it promises him after enough training. Therefore, an agent is likely to
    exploit in the action space B. In case of D, it could be selected from exploration
    policy; however action is highly likely to return reward, so exploration policy
    is not likely to be updated to that. Addition, in the training, the ratio of exploration
    decreases while the ratio of exploitation increases, which means the agent conducts
    exploration and then starts exploitation. With this example, we can see that both
    exploration and exploitation are important. Our method suggests exploration strategy
    in this process.


    Our work introduces a framework that allows the agent to explore and exploit in
    environments where reward is sparse or cannot be defined. We use experiment methods
    to guide the agent to task relevant state by combining exploration strategy with
    imitation. We evaluate our method in both classic and autonomous driving tasks
    in CARLA[6]. In contrast to classical tasks, autonomous driving have large state
    space including task-reward space. Results show that the proposed method allows
    an agent to explore in direct and global manner handling exploration and exploitation
    trade-off. The primary contributions of our work are summarized as follows: 1)
    we propose the learning strategy that addresses the trade-off between exploration
    and exploitation, 2) we introduce the learning framework applicable in complex
    and sparse reward environments, 3) we verify the performance of our method compared
    to several baselines on RL streets and autonomous driving.


    Recently, many researches are trying to solve autonomous driving with deep learning.
    Boarski et al. [11] proposed autonomous driving with CNN end-to-end supervised
    learning with image and actions outputs. Palisal [12] proposed reinforcement learning
    algorithm for complex multi agents in CARLA with the classifications of multi
    agents. Codevilla et al., [13] also introduced autonomous driving with the off-policy
    reinforcement learning world model. However, strictly to succeed, these is because
    they employed additional techniques like discretization of action. Our work is
    demonstrated in urban autonomous driving using simulator CARLA with realistic
    settings.


