  md: '# 3.4. Potential Applications of MLPs in MOFs


    Publicly available quantum calculation data to train MLPs are limited considering
    the vast chemical space of MOFs that originates from their high tunability and
    modularity. Hence, employing MLPs in MOFs is slower than in other materials, which
    makes it worthwhile to explore MLP applications in different domains and adapt
    them to the MOF.


    Most MOF simulations involving quantum calculations are restricted to considering
    only solid state frameworks due to computational costs. However, this approach
    can lead to discrepancies compared to experiments, as the fixed framework assumption
    may not fully capture real-world behaviors. On the other hand, MLPs have been
    proven to accurately simulate the physicochemical properties of various liquid
    systems and heterogeneous solid–liquid systems.99–102 Given that MOFs often interact
    with liquid systems such as water or other solvents, the simulation of heterogeneous
    systems including MOFs using MLPs represents an important area for future research.
    Likewise, MLPs can offer an attractive solution for research on MOFs in heterogeneous
    catalysis. In other materials, MLPs have been used to predict reaction pathways,
    free energy diagrams of heterogeneous catalysts, and the chemical environment
    of surfaces.103–108 Given the growing interest in using MOFs as potential heterogeneous
    catalysts, deployment of MLPs can accelerate this research field.


    In addition, MLPs increase the accessible scale of simulation systems. Through
    MLPs, amorphous phase of MOFs or MOFs with defects can be simulated, which have
    been challenging with conventional methods.70,109–112 Also, MLPs hold promise
    for simulating the bottom-up generation process of MOFs, which is anticipated
    to provide a deeper understanding of MOFs and their synthetic procedure.


    Despite potential usages of MLPs in MOFs, the main bottleneck remains the lack
    of organized quantum calculation data. The QMOF database51 (containing quantum-level
    calculated chemical properties of 20,000+ MOFs) and a recently published OpenDAC
    database113 (containing 40 M DFT calculations, targeting direct air capture using
    MOFs), provide enormous help and support to deploy MLPs in MOFs. Nonetheless,
    a larger amount of high-quality data is required to accelerate the development
    of MLPs in MOFs. The increased availability of quantum calculation data will drive
    the development of MLPs targeting MOFs, thereby enhancing the capability of atomistic
    simulations at the mesoscale, which is crucial for MOFs.


    # 4. GENERATIVE MODELS FOR MOF DESIGN


    # 4.1. Generative Models and Their Applications in Materials Design


    In recent years, the emergence of deep generative models has brought about huge
    success in the field of computer science. Unlike conventional discriminative models,
    by learning the intrinsic probability distributions of the data, generative models
    are capable of generating new data points which resemble a given data set. Various
    generative model architectures, including Variational Autoencoders (VAEs),114
    Generative Adversarial Networks (GANs),115 and diffusion models,116 have been
    developed and have achieved significant advancements in various domains. Notably,
    computer vision117,118 and natural language processing119,120 are areas where
    the success of generative models is particularly prominent. Their exceptional
    performance in generating realistic images has led to the


    development of image generators such as DALL-E121,122 and Midjourney,123 while
    large language models like ChatGPT124 have become irreplaceable tools in various
    applications.


    The huge success of generative models witnessed in other domains has facilitated
    their implementation in the field of materials science. Notably, the generation
    process of these models often initiate with the sampling of a random noise or
    a random vector within the latent space.114,116 Therefore, they offer theoretically
    unlimited search space without being restricted to a given data set, which is
    a fascinating characteristic in generating novel chemical structures. In addition,
    generation process of these models can be intentionally biased for the acquirement
    of desired samples, which is called conditional generation.125,126 Through such
    processes, materials with user-desired properties can be selectively generated,
    achieving the inverse design of materials.


    Generative models have been widely investigated for various domains, including
    drug-like molecules,127,128 proteins,129,130 and small crystals.131 However, as
    discussed in previous sections, the implementation of new technologies into porous
    materials is often relatively slow. This is due to their structural complexity,
    which often comprises a relatively large number of atoms spanning a wider range
    of atom types.13,132 In addition, the periodic nature of porous materials is another
    main bottleneck when dealing with crystalline structures, which slows the introduction
    of cutting-edge methodologies.


    Nonetheless, the industrial importance of porous materials has motivated researchers
    to continually explore them, and few pioneering studies have reported the implementation
    of generative models for these materials. Kim et al.133 have applied GAN architecture
    for the generation of zeolites, which is a class of porous materials that have
    received significant industrial attention. A GAN is a representative generative
    model composed of two components, a generator and a discriminator, that compete
    with each other to produce realistic data and evaluate its authenticity. They
    represented the zeolites as three channels of grids containing information on
    the location of silicon atoms, oxygen atoms, and energy of probe gas molecules,
    respectively. They successfully generated structures unseen in training sets and
    validated the capability of generating structures with user-desired properties.
    A follow-up study by Park et al.134 replaced the GAN with the diffusion model,
    while utilizing the same representations as the previous work. The diffusion model
    is one of the most recent generative model architectures, which iteratively refine
    noisy data to generate high-quality samples by simulating a diffusion process.
    Accordingly, Park et al. observed a 2,000-fold improvement in the generation performance,
    validating that diffusion models exhibit exceptional performance in materials
    generation. Conditional generation was aimed at void fraction, heat of adsorption,
    and Henry coefficient, and has successfully generated structures with the desired
    chemical properties.


    # 4.2. Generative Models for MOFs


    Compared with zeolites, MOFs exhibit much greater structural and chemical complexity.
    There are more than 100 types of atoms known to comprise MOFs,135 and the average
    number of atoms in the unit cell is much larger. Consequently, the number of experimentally
    synthesized MOFs exceeds 100,000,14 while there are only ~200 experimentally validated
    zeolite structures.136 Therefore, implementing MOFs into generative models is
    more challenging and may require alternative input'
