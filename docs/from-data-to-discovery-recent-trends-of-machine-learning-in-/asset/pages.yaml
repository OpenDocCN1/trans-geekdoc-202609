- pgno: 6
  md: 'Utilization of MLPs in MOFs is also highly encouraging, as the large and complex
    chemical environment causes difficulties in their atomistic simulations. In the
    following sections, examples of MLP implementation for modeling MOFs are demonstrated
    alongside potential future directions.


    # 3.2. Usage of MLPs in MOFs: Ab Initio Level Energy Calculation


    In many MOF systems, generic force field parameters cannot accurately model various
    adsorption properties, because these force fields were not specifically developed
    for MOFs, which often contain unique chemical moieties such as open metal sites
    (OMS). In this regard, MLPs can be an optimal method to calculate adsorption energies
    within a reasonable time scale and thereby significantly enhance accuracy compared
    to force field-based calculations.


    In particular, Zheng et al.⁹⁰ utilized MLP to simulate the potential energy surface
    along with the insertion of a single CO₂ molecule into Mg-MOF-74, which contains
    a 5-coordinated Mg–O cluster that induces OMS within the framework. Since quadrupole
    moments play a role in CO₂, the oxygen part of CO₂ shows strong interaction with
    the positively charged OMS. Although classical force fields can provide the plausible
    free energy profile, they still significantly underestimate the interaction between
    the OMS and the CO₂ molecules. However, the trained MLP in this work accurately
    accounted for the chemisorption between the OMS and the CO₂ molecule by predicting
    the intermolecular interaction to be much stronger than that predicted by the
    classic force field.


    Beyond the case of a single molecule, Goeminne et al. trained the MLP with snapshots
    containing different numbers of guest molecules (CO₂ in this case) from DFT calculations.⁹¹
    From this procedure, they efficiently considered the host–guest interactions within
    the entire framework and captured the subtle changes in host–guest or guest–guest
    interactions due to the confinement effects of the MOFs. Following the underlying
    assumption of the widely used conventional GCMC, they collected data with a static
    framework and rigid adsorbates and extracted interaction energies and forces from
    single point calculations. They applied this scheme to ZIF-8 and confirmed that
    MLP can reproduce the experimental adsorption isotherm. However, one limitation
    encountered in their study was the limited transferability of the MLP. The MLP
    trained with ZIF-8 cannot be directly used in other polymorphic MOFs that share
    the same components but exhibit different topologies. From this point of view,
    the distinct characteristics of MOFs can be a hurdle for the transferability of
    MLPs in MOFs. Similarly, Liu et al. attempted to run GCMC simulations to accurately
    reproduce the experimental H₂ adsorption isotherm of Al-soc-MOF-1d, with the aid
    of MLP (Figure 5a).⁹² Given that the MLP was trained using configurations collected
    from ab initio molecular dynamics (AIMD), one can anticipate that the guest-induced
    flexibility of the frameworks, which is often overlooked, may be implicitly considered
    during the adsorption simulation.


    Finally, Yu et al. tried to ascertain the stable position of Pt clusters in MOF-808
    using MLP.⁹³ They trained an MLP with a few representative fragments capable of
    representing the entire system and demonstrated that the trained MLP could accurately
    predict the optimal position of the Pt clusters and their corresponding energies,
    closely aligning with the DFT calculation results. Furthermore, given the relatively
    low computational cost compared to conventional DFT calculations, they were able
    to readily explore migration pathways,


    which are typically computationally intensive due to the numerous transition states
    between the initial and final states.


    # 3.3. Usage of MLPs in MOFs: Ab Initio Level Molecular Dynamics


    Given that MLP outputs both interaction energy and atomic forces, it theoretically
    allows one to simulate MD simulations at the DFT accuracy level. Furthermore,
    unlike conventional generic force fields widely used for MOFs, MLPs can simulate
    bond breaking and formation, allowing for the simulation of unpredictable intrinsic
    structural flexibilities regarding various external stimuli such as temperature,
    pressure, and gas adsorption. Thus, MLPs may help simulate phenomena observed
    in experiments that cannot be reproduced using conventional DFT calculations or
    force field based calculations. Additionally, they may provide new insights into
    experimentalists by revealing previously undiscovered behavior related to MOFs.


    In the early stages of MLP development in MOFs, structures were decomposed into
    molecular fragments, and the MLP was trained based on these units.⁹⁴,⁹⁵ These
    trained models were able to accurately predict the equilibrium lattice constant
    and be applied for more complex applications such as mechanistic and thermal behaviors.⁹⁵
    However, this method fundamentally has a limitation: the periodicity cannot be
    explicitly considered at the training level. To address this issue, several follow-up
    studies used the entire unit cell as a training set for MLPs. Vandenhaute et al.⁹⁶
    trained the MLP model named NequIP with an incremental learning approach that
    used the concept of metadynamics to efficiently sample configurations to train
    the model. In this work, UiO-66 (Zr) and MIL-53 (Al) were selected as representative
    rigid and flexible MOFs, respectively. With the merits of MLPs, which can simulate
    large cells with high accuracy, they expanded the simulation cell to 9 × 2 × 9
    for MIL-53 (Al) (comprising more than 10 000 atoms) and successfully reproduced
    the experimental transition pressure data (Figure 5b). In this work, they investigated
    the framework’s flexibility in response to external pressure, but the guest-induced
    flexibility has not yet been studied using MLP. Therefore, it would be a great
    suggestion for a future research topic. Similarly, Fan et al.⁹⁷ rationally designed
    two-dimensional MOFs that potentially exhibit phase transitions due to wine-rack
    motif and observed the mechanistic behaviors using an MLP model. While previous
    studies have matched simulation results to experimental ones, recent study from
    the same group utilized MLPs to unravel phenomena not observed in experiments
    at the molecular level.⁹⁸ They investigated the dynamics of CALF-20 and observed
    negative area compressibility (NAC) and negative thermal expansion (NTE), which
    are counterintuitive phenomena not observed experimentally with CALF-20.


    In addition to the deformation within the crystalline frameworks, Castel et al.²⁶
    used MLP to investigate the amorphous phases of MOFs at the molecular level. They
    selected ZIF-4 as the benchmark MOF, which has been shown to possess multiple
    amorphous phases in experiments. The amorphous phases were obtained using melt-quenching
    methods, which can intuitively be embodied using molecular dynamics. Since bonds
    should remain intact in conventional generic force fields, the breaking of the
    crystallinity of MOFs, which involves reversible bond breaking and formation,
    cannot be simulated. However, as previously mentioned, bond breaking and formation
    can be simulated using MLP similar to DFT calculations, enabling investigation
    of the loss of crystallinity.'
