    # 3. MACHINE LEARNING POTENTIALS


    # 3.1. Brief Introduction to MLPs


    Atomistic simulations enable the accumulation of various material property data,
    but the trade-off between accuracy and computational cost has long been a challenging
    aspect of exploring large chemical spaces. The widely used DFT calculation is
    considered to be relatively accurate but slow. For less computational cost, classical
    (empirical) interatomic potentials are used to simulate molecular dynamics, where
    Coulomb potential⁶⁷ and Lennard-Jones potential⁶⁸ are widely used examples. A
    reactive force field (ReaxFF)⁶⁹ is another notable example that can simulate flexible
    bond breaking and formation, but nonetheless, these interatomic potentials lack
    accuracy and are applicable to narrower chemical domains compared to quantum level
    simulations. In this regard, machine learning potentials (MLPs) overcome the trade-off
    between accuracy and computational cost by using predictive machine


    learning models trained on ab initio calculation data, allowing them to learn
    the potential energy surface at the level of quantum mechanics. These approaches
    of using MLPs have gained significant attention in various materials domains,
    and recent works in MLPs are approaching the level of covering a broad range of
    chemical space with a single transferable model.²⁵,⁷⁰,⁷¹


    To construct MLP models, one needs to represent atomic environments and train
    a model to learn the potential energy surface from the selected database (Figure
    4). There has been extensive effort to develop descriptors for atomic environments
    and to train models capable of learning interatomic potentials. The history and
    detailed examples are beyond the scope of this article, so one can refer to cited
    papers to understand the model architecture and concepts. As of the writing this
    manuscript, MACE⁸³,⁸⁴ (specifically MACE-mp-0) demonstrates the highest accuracy
    among publicly available MLPs in the Matbench Discovery benchmark,⁸⁵ which evaluates
    the performance of models in predicting solid-state thermodynamic stability properties.
    The MACE architecture combines atomic cluster expansion⁷³ and message passing
    neural network,⁸⁶,⁸⁷ where MPTrj data set⁸¹ has been used for training. As neural
    network architectures have advanced quickly and new ab initio data has been integrated
    in a compatible manner,⁸⁸,⁸⁹ the field of MLPs in atomistic simulations is growing
    rapidly.'
