    void fraction prediction, and metal cluster/organic linker classification. After
    fine-tuning, their model successfully predicted H₂ uptake, H₂ diffusivity, and
    bandgap with higher performance than baseline models. Multimodal learning is a
    new branch that has not been explored


    in depth for MOFs but has a huge potential for improving the accuracy and robustness
    of property predictions.


    # 2.4. Potential Weaknesses and Improvements


    Despite the significant advancements in property predictions brought about by
    machine learning, several challenges still remain. Regression models are highly
    dependent on data, and given that most property data are obtained through molecular
    simulations, the accuracy of the simulation methods significantly affects the
    model''s performance. Currently, several databases of MOFs, such as CoREMOF62
    and QMOF,51 exist, but they still contain relatively small amounts of data compared
    to other domains of materials. Particularly, properties that require DFT calculations,
    such as band gaps, demand a substantial amount of time to obtain, making it difficult
    to secure a large data set. Additionally, in the case of MD simulations, including
    gas diffusivity or bulk modulus calculations, the reproducibility of data is often
    low, leading to inaccuracies in machine learning predictions. These issues highlight
    the need for the continued development of more robust databases and improved simulation
    techniques to increase the reliability and accuracy of machine learning models.


    From descriptor-based models to multimodal transformer models, there have been
    significant advances in property prediction for MOFs. Looking ahead, developing
    innovative ways to represent MOFs and employing advanced machine learning techniques
    will be critical for further improving the accuracy and efficiency of these methodologies.
    In addition, to obtain MOFs with desired properties using regression models, the
    trained models are often implemented into high-throughput screening (HTS) schemes,
    replacing traditional molecular'
