    Insights provided by these methods have been actively utilized in planning future
    experiments or in designing new materials with desired characteristics.¹⁹⁻²² Another
    recent trend in materials design is the employment of deep generative models,
    which directly generate chemical structures as outputs without their search space
    being restricted to training databases.²³,²⁴ Moreover, recently emerging methodologies
