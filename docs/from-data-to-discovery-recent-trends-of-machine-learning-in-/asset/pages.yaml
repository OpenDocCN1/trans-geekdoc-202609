    areas of materials science is now encouraging. In this Perspective, we offer a
    comprehensive outline of recent trends and future directions in machine learning
    approaches in materials science with a particular focus on MOFs (see Figure 1).


    # 2. STRUCTURE–PROPERTY RELATIONSHIPS AND REGRESSION MODELS


    # 2.1. Importance of Structure–Property Relationship


    Elucidating how structural features affect the microscopic/macroscopic properties
    of materials (so-called structure–property relationships) is one of the primary
    tasks in the field of materials science.³⁷,³⁸ Based on the chemical intuitions
    provided by these relationships, researchers establish design principles, thereby
    enabling the construction of materials with the desired characteristics for targeted
    properties. In addition, elucidating the structure–property relationship provides
    insights into the underlying mechanisms of material behaviors, which can lead
    to the discovery of new phenomena beyond existing knowledge.


    Before the advent of machine learning techniques, elucidating structure–property
    relationships in materials science relied


    heavily on experimental characterization and theoretical modeling. Researchers
    would often hypothesize relationships between the atomic or molecular arrangement
    within a material and the macroscopic target property and then validate these
    hypotheses through extensive experimentation and/or theoretical analysis. However,
    the rapid development and widespread adoption of machine learning methods have
    provided powerful tools for analyzing complex relationships within vast amounts
    of data. With the help of various algorithms and architectures, procedures for
    unveiling structural-property relationships have become much more systematic and
    efficient over the last few decades. Specifically, regression models,³⁹ statistical
    methods used to understand and quantify the relationship between one or more independent
    variables and a dependent variable, is widely used in this purpose.


    Due to the large materials space and high structural complexity, structure–property
    relationships in MOFs are often complicated and not straightforward. So, elucidating
    structure–property relationships of MOFs may be more challenging compared with
    other material domains, which is why utilizing advanced data-driven methodologies
    becomes even more important. In this section, we focus on the research of MOFs
    with regression models. We first briefly summarize how the property predictions
    of MOFs have been conducted so far and pay special attention to recent attempts
    to utilize the transformer architectures for accurate property predictions.


    # 2.2. Conventional Machine Learning Approaches


    With regard to the data-driven approaches to predict material properties, input
    representation is crucial in determining the overall performance of the model.
    Early machine learning approaches for MOFs focused on representing structures
    using'
