    # 4.3. Strengths and Weaknesses


    Materials generation using generative models has several strengths over other
    material design methodologies. In general, the training process of generative
    models follows unsupervised learning, where a model is trained on data without
    explicit labels or annotations. Generative models can learn from unlabeled data
    by capturing the underlying distribution; therefore, the generative models can
    be beneficial in cases where labeled data are scarce or expensive to obtain. In
    addition, generative models


    can explore vast (often theoretically unlimited) search space, which is an attractive
    feature when it comes to generating diverse and novel chemical structures. Lastly,
    as introduced in previous research, materials with target properties can be designed
    through conditional generation.


    With more diverse and versatile conditioning methodologies being investigated,
    one interesting research direction is the incorporation of natural language processing
    as one of the conditions. Recently, large language models have been deployed to
    construct user-friendly platform for materials design.¹³⁹ Notably for MOFs, Kang
    et al. have developed a module named ChatMOF¹⁴⁰ which enables users to communicate
    with the module using their natural language. Likewise, handling text data during
    the conditional generation is a direction where generation models are pursuing.¹⁴¹
    This allows users to express their desired features in natural language, significantly
    lowering the barrier to using these models, especially for those without domain
    knowledge.


    However, there still exist several fundamental challenges when it comes to generative
    models for materials design. As previously mentioned, generative models work by
    learning the probability distributions of the given training data, and this fundamentally
    makes generative models highly dependent on their training data, where a bias
    in training data set would lead to the same bias in generated samples. This dependency
    can pose significant challenges for materials generation, where the construction
    of a perfectly nonbiased data set is frequently difficult to achieve. Therefore,
    considerable effort should be made in preparing a diverse yet evenly distributed
    training data set when training generative models.


    Another aspect worth sharing is that generative models are less suitable for extrapolation.
    As these models utilize the learned patterns from the training data, they are
    capable of generating new samples that are similar to the training data (i.e.,
    interpolation). However, generating data points that lie outside the range of
    the training data can be challenging. For example, tasks such as generating MOFs
    with an unprecedentedly high H₂ capacity could be challenging for these models.
    Nonetheless, research on generation models for extrapolation is actively ongoing,¹⁴²
    and through this, it is anticipated that more fundamental solutions for such tasks
    will emerge.


    # 5. FUTURE DIRECTIONS AND EMERGING TRENDS


    # 5.1. Enhancing Speed and Efficiency


    While conventional machine learning models have about 10,000 parameters, regression
    models using the transformer architecture can have up to 100 million parameters.³⁵,⁵⁶⁻⁵⁸
    The increase in the number of parameters improves the model''s potential to learn
    more complex patterns and relationships, thereby increasing its accuracy and flexibility.
    However, as the number of parameters increases, the training process becomes significantly
    longer and the amount of data required for training increases exponentially.¹⁴³,¹⁴⁴
    This presents a challenge in terms of computational resources and data acquisition,
    highlighting the need for efficient training strategies and robust data acquisition
    methods.


    In this context, transfer learning is considered a promising method to reduce
    both the training time and the amount of data required. Transfer learning is a
    machine learning technique where a predeveloped model serves as the foundation
    model that can be applied to other tasks.¹⁴⁵ It typically involves training a
    model on a large data set (known as the pretrained model) and'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'then initializing the training process for a specific task of interest (referred
    to as fine-tuning), often with smaller learning rates. This method can be effective
    when it comes to systems in which the number of data is relatively small. Transfer
    learning thus holds significant promise for enhancing the efficiency and accuracy
    of property prediction models for MOFs, which often exhibits complicated data
    distributions and insufficient data.35,146,147 In a similar context, knowledge
    transfer between different domains is also a promising approach, which is discussed
    in the following section.


    Furthermore, lightweight deep learning models can be considered to enhance the
    efficiency of their use in materials science. Lightweighting of models refers
    to designing models with a reduced number of parameters while preserving performance.148
    This practice is particularly important for handling large amounts of data, as
    it can mitigate the slow inference speeds and the resource-intensive pretraining
    steps. In this context, MLPs are noteworthy, as recent advancements have led to
    increased accuracy,149 but also larger model complexity and size, resulting in
    greater memory usage and computational costs. While MLPs have significant potential,
    in order to develop a method with high applicability, researchers should also
    consider the burden of large model sizes in addition to the model accuracy. Various
    techniques are being explored for lightweighting machine learning models, such
    as knowledge distillation,150,151 where smaller models are taught what larger
    models have learned, and model architectures are modified to reduce their size.152–155
    Although lightweighting has not yet been extensively studied in materials science,
    focusing research efforts on model efficiency within the trend of increasing model
    parameters could lead to the development of models with shorter learning times
    while maintaining high performance.


    # 5.2. Merging Tools/Data Set from Other Materials


    Due to complex structures and the need for high-fidelity data, data scarcity is
    one of the main bottlenecks that data-driven approaches frequently face, especially
    in porous materials research.156 Particularly, this problem is prominent in fields
    where the property of interest is hard to simulate, thus experimental assessment
    is demanded (e.g., proton conductivity157,158), or where simulation data is expensive
    (e.g., electronic structure calculation159). For such cases of having limited
    data for the specific task, if one has access to a large data set from another
    field, then transferring that data to your specific task would be a viable approach
    to remedy the issue of data scarcity. Especially for porous materials, as diverse
    classes of porous materials (e.g., zeolite, MOFs, COFs, PPNs, etc.) have been
    investigated for several decades, utilizing the accumulated data across porous
    materials domains (or even from nonporous materials) could propose a new paradigm
    in their investigation using data-driven approaches.


    One of the representative examples of utilizing cross-domain knowledge is the
    work by He et al.160 With the goal of verifying the electrically conductive MOFs,
    they developed a binary classification model that classifies whether a structure
    is conductive or not based on its band gap. At the time, there was no database
    specifically for MOF band gaps. (However, a QMOF database,51 now provides DFT-calculated
    band gaps of MOF structures.) To overcome this limitation, they utilized the accumulated
    data on inorganic compounds. The Open Quantum Materials Database (OQMD)161 contains
    band gap information for ~52,300 inorganic compounds calculated at DFT level.
    They trained their classification model on this data


    set and applied it to the MOF database to identify structures likely to be conductive.
    Their methodology predicted nine conductive MOFs, with subsequent computational
    validation confirming that six of them were metallic. This serves as an adequate
    example of using data from another domain to address the data scarcity issue in
    the field of MOF research.


    Transfer learning is a widely used method for the transfer of knowledge between
    different domains. Cai et al.162 explored the feasibility of implementing transfer
    learning in the context of heterogeneous porous materials. Their focus was on
    addressing the imbalance between the sizes of the computation-ready experimental
    (CoRE) data sets, where there are relatively few CoRE COF structures (about 1,000
    structures) compared to CoRE MOF (with over 10,000 structures).14 In order to
    achieve high accuracy in predicting Xe/Kr selectivity with CoRE COFs, the researchers
    employed transfer learning. Specifically, they pretrained the model using the
    CoRE MOF database and fine-tuned it with 300 COF structures. They confirmed that
    transfer learning consistently achieved higher accuracy compared to direct learning,
    which solely utilized the COF database.


    Park et al.163 presented another compelling application of transfer learning in
    porous materials. They trained a transformer architecture across various domains
    of porous materials, encompassing MOFs, COFs, zeolites, and PPNs. Empowered by
    a synergistic effect among different material classes, they aimed to address data
    imbalances via transfer learning. Their approach involved proposing a cross-material
    few-shot learning scheme. By transferring knowledge obtained from MOFs, they observed
    an enhancement in the accuracy of predicting the band gap of COFs in few-shot
    learning scenarios. Additionally, the authors further explored the feasibility
    of a zero-shot learning scheme where a model trained solely on material A could
    be applied for the prediction of unseen material B.


    As another representative example of knowledge transfer between porous materials,
    Sun et al.27 utilized a meta-learning scheme to seek for the optimal H2 storage
    conditions. Meta-learning and transfer learning are both approaches that aim to
    improve the efficiency of training by using prior knowledge. However, the goal
    of meta-learning is slightly different, as it aims to train a model that can generalize
    well across a variety of tasks. With utilizing high-throughput data for zeolites,
    MOFs, and hyper-cross-linked polymers, they developed a meta-learning model capable
    of jointly predicting the adsorption capacity for various materials across a wide
    range of pressure and temperature. It was verified that a model trained using
    the meta-learning method exhibits higher accuracy compared to separately trained
    models for each material.


    Several precedent works that utilized knowledge transfer across material domains
    to address the issue of data scarcity are covered in this section. As more data
    accumulate rapidly and new databases are constructed, the utilization of data
    without being restricted to the material class of interest is becoming a common
    approach. Even beyond dealing with data scarcity, chemical intuition obtained
    from other domains can enhance the performance of the model in the target domain.
    Therefore, as an intense amount of data continues to accumulate in the future,
    appropriately utilizing knowledge and data from other domains will become an increasingly
    important strategy.


    # 5.3. Data Extraction from Literature


    The quality of the data is crucial for developing reliable machine learning models.
    In this section, we focus on the discrepancies between real-world data and data
    obtained from simulations.'
