    their geometric descriptors, which is the simplest way of converting MOFs into
    machine interpretable vectors. These descriptors were typically processed using
    conventional machine learning models such as the Support Vector Machines (SVM),40
    XGBoost,41 and Random Forest42 (Figure 2a). For example, Fernandez et al.43 introduced
    a quantitative structure–property relationship (QSPR) for CH4 uptake in MOFs by
    utilizing geometric descriptors such as void fraction and volumetric surface area.


    Subsequent advances in machine learning models for MOFs involved considering additional
    relevant chemical descriptors that relied on empirical intuition. Fanourgakis
    et al.44 used descriptors derived from the potential energy surface for CH4 adsorption
    predictions (Figure 2b). They calculated the average Boltzmann factor by considering
    different probe atoms interacting with the scaffold and observed a meaningful
    improvement in the accuracy. Bucior et al.45 used a histogram of the energy grid
    to predict the H2 working capacity of MOFs (Figure 2c). The energy grid here represents
    the Lennard-Jones and Columbic potential energy between the probe gas and the
    MOF at each grid points. Using the Least Absolute Shrinkage and Selection Operator
    (LASSO) model, they achieved a high accuracy (R2 score of 0.96) and successfully
    identified 51 promising MOF candidates with a H2 working capacity greater than
    45 g L−1. These attempts highlight the importance of selecting appropriate and
    innovative descriptors to improve the predictive power of machine learning models
    in identifying high performing MOFs. Beyond the works mentioned above, there are
    a number of studies that have utilized intrinsic descriptors for MOF property
    prediction.46–48


    Recently, Graph Neural Networks (GNNs49) have become one of the most widely used
    input abstractions in various materials domains, including inorganic compounds
    and drug-like molecules. By representing atoms as nodes and bonds as edges, graph
    representations can effectively capture both local atomic environments and long-range
    structural information. These models have also been expanded to periodic (i.e.,
    crystalline) materials, with the Crystal Graph Convolutional Neural Network (CGCNN)50
    being the most representative example, successively addressing the issue regarding
    periodic boundary conditions (Figure 2d). As such, Rosen et al.51 built a QMOF
    database with more than 20,000 MOF band gap data calculated at the DFT level,
    and the CGCNN model achieved an R2 score of 0.876 in predicting band gaps of these
    structures. In their subsequent work,52 they achieved even higher performance
    with the Material Graph Network (MEGNET),53 another GNN-based prediction model.
    Recently, Shoghi et al.54 applied joint multidomain pretraining approach (JMP)
    based on GemNet-OC55 and achieved state-of-the-art performance in predicting the
    bandgap of MOFs. These advancements demonstrate the importance of using GNN models
    to significantly improve the predictive accuracy of MOF properties by effectively
    capturing complex interactions within their structures.


