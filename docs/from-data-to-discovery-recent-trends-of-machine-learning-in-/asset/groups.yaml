    ## 1. INTRODUCTION


    Metal–organic frameworks (MOFs), composed of an ordered network of metal ions/clusters
    and organic linkers, have emerged as an innovative class of crystalline materials
    in recent decades. Given their expansive interstitial pores and chemical versatility,
    MOFs have gained attention across a wide range of applications, including gas
    storage,1–4 catalysis,5–7 sensors,8,9 and drug delivery.10,11 In particular, the
    high structural diversity that originates from the countless combinations of their
    building blocks stands out as the most distinctive characteristic of MOFs.12,13
    Numerous MOFs with unique structures and novel functionalities have been identified,
    with the number of experimentally reported structures exceeding 100,000.14,15
    Furthermore, the relatively simple synthetic motif of MOFs has enabled their generation
    in silico, offering an unlimited number of hypothetical structures. Such high
    structural diversity and vast search space keep pushing the boundaries of the
    applications of MOFs into unexplored territories.13


    Paradoxically, the high structural diversity endows MOFs with boundless potential,
    yet at the same time, it presents a challenge in pinpointing the top performing
    structures for specific applications. While there are clear limitations in experimentally
    examining a large number of structures, molecular simulations have provided viable
    alternative opportunities. Various types of simulations, including Density Functional
    Theory (DFT) calculations, Grand Canonical Monte Carlo (GCMC) simulations, and
    Molecular Dynamics (MD) simulations, have been actively used in this context.
    Though simulations contain a certain amount of error, they have enabled much faster
    evaluation of structures, thereby contributing to the discovery of novel MOFs.
    However, the employment of molecular simulations within the vast material space
    of MOFs still faces several limitations. Even though molecular simulations are
    relatively fast compared to experimental assessment, evaluating every structure
    in the database (so-called high-throughput screening16,17) is inefficient or often
    not viable.13 More importantly, interpreting the large volumes of simulated data
    is not straightforward, and as such, there is a demand for effective methodologies
    to analyze accumulated data and extract meaningful information from these data.


    Data-driven approaches, represented by machine learning, have become an irreplaceable
    tool in materials design that successfully addresses the aforementioned challenges.
    By effectively capturing inherent patterns from large amounts of data, machine
    learning models have successfully unveiled various structure–property relationships,
    providing a comprehensive understanding of materials chemistry.18 Chemical insights
    provided by these methods have been actively utilized in planning future experiments
    or in designing new materials with desired characteristics.19–22 Another recent
    trend in materials design is the employment of deep generative models, which directly
    generate chemical structures as outputs without their search space being restricted
    to training databases.23,24 Moreover, recently emerging methodologies such as
    machine learning potentials (MLPs)25,26 or knowledge transfer between different
    domains27 are of great interest, and their incorporation into the various areas
    of materials science is now encouraging. In this Perspective, we offer a comprehensive
    outline of recent trends and future directions in machine learning approaches
    in materials science with a particular focus on MOFs (see Figure 1).


