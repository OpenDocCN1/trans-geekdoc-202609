    2021 Springer Nature（ref 30）。版权 2021 Springer Nature（ref 31），许可采用 CC BY 4.0（ref
    32）。版权 2021 Springer Nature（ref 33）。版权 2022 Springer Nature（ref 34）。版权 2023 Springer
    Nature（ref 35），许可采用 CC BY-NC（ref 36）。


    ## 2. 结构-性能关系与回归模型


    ### 2.1. 结构-性能关系的重要性


    阐明结构特征如何影响材料的微观/宏观性质（即所谓的 结构-性能关系）是材料科学领域的主要任务之一。37,38 基于这些关系提供的化学直觉，研究人员建立设计原则，从而能够构建具有针对目标性能所需特性的材料。此外，阐明结构-性能关系可提供材料行为背后机制的见解，从而可能导致超越现有知识的新现象的发现。


    在机器学习技术出现之前，材料科学中结构-性能关系的阐明很大程度上依赖于实验表征和理论建模。研究人员通常会假设材料内部原子或分子排列与宏观目标性质之间的关系，然后通过大量实验和/或理论分析验证这些假设。然而，机器学习方法的快速发展和广泛采用为分析大量数据中的复杂关系提供了强大的工具。在各种算法和架构的帮助下，揭示结构-性能关系的过程在过去几十年中变得更加系统和高效。具体而言，回归模型39
    是一种用于理解和量化一个或多个自变量与因变量之间关系的统计方法，在此目的中被广泛使用。


    由于材料空间庞大且结构复杂，MOFs 的结构-性能关系通常复杂且不直接。因此，与其他材料领域相比，阐明 MOFs 的结构-性能关系可能更具挑战性，这也是利用先进数据驱动方法变得更加重要的原因。在本节中，我们重点关注使用回归模型对
    MOFs 的研究。我们首先简要总结迄今为止 MOFs 性能预测是如何进行的，并特别关注最近利用 Transformer 架构进行准确性能预测的尝试。


