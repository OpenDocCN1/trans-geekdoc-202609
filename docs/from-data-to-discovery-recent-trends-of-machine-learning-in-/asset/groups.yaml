    Most existing MOF databases are generated through simulations, which allow them
    to cover vast chemical spaces with high time efficiency. However, simulation methods
    are not perfectly accurate and can introduce small or large errors. Additionally,
    simulations are often conducted under assumptions such as perfect crystallinity,
    which can lead to discrepancies from real materials. To overcome these limitations,
    researchers have attempted to extract data from the experimental literature (often
    referred to as data mining) so that experimental data can be directly utilized
    for model training.


    In the early stages of data mining for MOFs, rule-based extraction methodologies
    and relatively simple natural language processing (NLP) techniques were employed.
    Park et al. developed a text mining algorithm that captures units for surface
    area and pore volume from HTML format inputs. Nandy et al. used NLP and image
    analysis techniques to mine solvent-removal stability and thermal degradation
    temperatures of MOFs from experimental literature. The scope of data mining later
    expanded to include synthetic information on MOFs, where synthesis conditions
    of MOFs were extracted from experimental procedures and further processed for
    deeper understanding on their synthesis. More recently, large language models
    have emerged as an irreplaceable tool in data mining. Compared with rule-based
    algorithms, the use of large language models has made the mining process more
    flexible and accurate. These models have also impacted the MOF community, with
    the Yaghi group employing ChatGPT for the data mining of MOF data.


    Data mining is an evolving field and is expected to play a crucial role in constructing
    high-quality experimental databases. The MOF domain is particularly suited to
    active mining given the large volume of ongoing experimental work. One factor
    that could drive rapid progress in this field is the establishment of standardized
    practices in data reporting and management. If researchers adopt a uniform format
    for data reporting in the scientific literature, the accuracy of data mining could
    be significantly enhanced. Additionally, since researchers typically report only
    the top (or best) experimental results, the volume of experimental data could
    be dramatically increased if they also publish their failed or partially successful
    outcomes.


    # 5.4. Automation of Experiments and Autonomous Laboratories


    Lastly, in this section, we highlight promising and futuristic approaches of data
    acquisition. Automation of the experimental


    process is an emerging concept in materials discovery that has gained huge traction
    in recent days. This is made possible by using robotic systems, where robotic
    arms and other mechanical systems handle tasks such as sample preparation, mixing
    chemicals, and operating instruments. Such automation possesses huge advantages
    compared with experiments carried out by humans. Automated experiments can run
    continuously (i.e., 24 h per day/7 days a week) with higher efficiency, thereby
    allowing researchers to obtain more experimental data in an efficient manner.
    Additionally, it minimizes the risk of human error in experimental procedures,
    leading to more reliable and reproducible results. Due to these benefits, automation
    of experimental processes is an attractive method for obtaining large volumes
    of high-quality data.


    The implementation of autonomous systems has also been applied to the field of
    MOFs. In research carried out by Moosavi et al., they utilized an automated system
    to acquire experimental data on the synthesis of HKUST-1. Their system was able
    to carry out 30 reactions per cycle, where one cycle was completed within a single
    day. Through repeated experiments, they verified that the robotic platform provides
    a consistent synthesis protocol with high reproducibility and good control over
    the synthesis variables. They represented the synthesis conditions as 9-dimensional
    synthesis vectors and implemented genetic algorithms to find the optimal synthesis
    conditions. The synthesis served as the chromosome, and through selection, crossover,
    and mutation, the synthesis conditions were optimized generation by generation.
    As a result, they achieved the HKUST-1 sample with the highest surface area reported
    to date.


    In addition, Xie et al. used a robotic platform for the rapid synthesis of ZIF-67
    via the Joule heating method (Figure 7a). Their robotic platform controlled two
    chemical parameters (a molar ratio of Co ions to 2-methylimidazole and a total
    volume of precursors) and two processing parameters (applied DC voltage and reaction
    time). Using the data provided by the robotic system, they applied a Bayesian
    optimization algorithm to optimize the synthesis conditions of ZIF-67. Bayesian
    optimization suggests new synthesis conditions based on past evaluations (crystallinity
    of the samples in this work). It was observed that as iterations proceeded, structures
    with gradually higher crystallinity were obtained. Through this process and further
    analysis, they were able to retrieve chemical insights into the crystallinity
    of ZIF-67.'
