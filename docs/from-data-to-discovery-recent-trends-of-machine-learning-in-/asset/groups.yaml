    ## 3. 机器学习势


    ### 3.1. MLPs 简介


    原子模拟能够积累各种材料性质数据，但准确性与计算成本之间的权衡长期以来一直是探索大化学空间的挑战性方面。广泛使用的 DFT 计算被认为相对准确但速度慢。为了降低计算成本，经典（经验）原子间势被用于模拟分子动力学，其中库仑势⁶⁷和伦纳德-琼斯势⁶⁸是广泛使用的例子。反应性力场
    (ReaxFF)⁶⁹是另一个显著例子，可以模拟灵活的键断裂和形成，但尽管如此，这些原子间势的准确性不足，且与量子水平模拟相比适用于更窄的化学领域。在这一点上，机器学习势
    (MLPs) 通过使用在从头计算数据上训练的预测机器学习模型来克服准确性与计算成本之间的权衡，使其能够在量子力学水平上学习势能面。使用 MLPs 的这些方法在各种材料领域获得了显著关注，最近的
    MLP 工作正接近于用单一可转移模型覆盖广泛化学空间的水平。²⁵,⁷⁰,⁷¹


    构建 MLP 模型需要表示原子环境并训练模型从选定的数据库学习势能面（图 4）。在开发原子环境的描述符以及训练能够学习原子间势的模型方面付出了大量努力。历史和详细示例超出了本文的范围，因此可以参考引用的论文来了解模型架构和概念。截至本文撰写时，MACE⁸³,⁸⁴（具体为
    MACE-mp-0）在 Matbench Discovery 基准测试⁸⁵中展示了公开可用的 MLPs 中最高的准确性，该基准测试评估模型预测固态热力学稳定性质的性能。MACE
    架构结合了原子簇展开⁷³和消息传递神经网络⁸⁶,⁸⁷，其中 MPTrj 数据集⁸¹用于训练。随着神经网络架构的快速发展以及新的从头数据以兼容的方式被整合，原子模拟中
    MLPs 的领域正在迅速增长。


    MLPs 在 MOFs 中的利用也非常令人鼓舞，因为庞大而复杂的化学环境导致其原子模拟困难。在以下章节中，将展示用于建模 MOFs 的 MLP 实现示例以及潜在的未来方向。


    ### 3.2. MLPs 在 MOFs 中的使用：从头水平能量计算


    在许多 MOF 系统中，通用力场参数无法准确模拟各种吸附性质，因为这些力场并非专门为 MOFs 开发，而 MOFs 通常含有独特的化学基团，如开放金属位点
    (OMS)。在这一点上，MLPs 可以是在合理时间尺度内计算吸附能的最佳方法，从而与基于力场的计算相比显著提高准确性。


    特别是，Zheng 等⁹⁰利用 MLP 模拟了单个 CO₂ 分子插入 Mg-MOF-74 时的势能面，Mg-MOF-74 含有 5 配位的 Mg–O 簇，在框架内诱导
    OMS。由于四极矩在 CO₂ 中起作用，CO₂ 的氧部分与带正电的 OMS 表现出强相互作用。尽管经典力场可以提供合理的自由能曲线，但它们仍然显著低估了 OMS
    与 CO₂ 分子之间的相互作用。然而，本工作中训练的 MLP 通过预测分子间相互作用远强于经典力场的预测，准确地考虑了 OMS 与 CO₂ 分子之间的化学吸附。


    除了单分子情况外，Goeminne 等使用来自 DFT 计算的包含不同数量客体分子（本例中为 CO₂）的快照训练了 MLP。⁹¹通过此程序，他们有效地考虑了整个框架内的主-客体相互作用，并捕捉到由于
    MOFs 的限域效应导致的主-客体或客体-客体相互作用的细微变化。遵循广泛使用的常规 GCMC 的基本假设，他们使用静态框架和刚性吸附质收集数据，并从单点计算中提取相互作用能量和力。他们将该方案应用于
    ZIF-8 并确认 MLP 可以再现实验吸附等温线。然而，他们研究中遇到的一项限制是 MLP 的可转移性有限。用 ZIF-8 训练的 MLP 不能直接用于具有相同组分但表现出不同拓扑的多形
    MOFs。从这个角度来看，MOFs 的独特特性可能成为 MLPs 在 MOFs 中可转移性的障碍。同样，Liu 等尝试运行 GCMC 模拟以借助 MLP（图
    5a）⁹²准确再现 Al-soc-MOF-1d 的实验 H₂ 吸附等温线。鉴于 MLP 是使用从从头分子动力学 (AIMD) 收集的构型训练的，可以预期通常被忽略的框架的客体诱导柔性可能在吸附模拟期间被隐式考虑。


    最后，Yu 等尝试使用 MLP 确定 Pt 簇在 MOF-808 中的稳定位置。⁹³他们用几个能够代表整个系统的代表性片段训练了 MLP，并证明训练好的 MLP
    能够准确预测 Pt 簇的最佳位置及其相应能量，与 DFT 计算结果密切一致。此外，与常规 DFT 计算相比计算成本相对较低，他们能够轻松探索迁移路径，而迁移路径通常由于初始态和最终态之间存在大量过渡态而计算密集。


    ### 3.3. MLPs 在 MOFs 中的使用：从头水平分子动力学


    鉴于 MLP 输出相互作用能量和原子力，它理论上允许以 DFT 准确性水平模拟 MD 模拟。此外，与广泛用于 MOFs 的常规通用力场不同，MLPs 可以模拟键断裂和形成，从而能够模拟关于温度、压力和气体吸附等各种外部刺激的不可预测的内在结构柔性。因此，MLPs
    可能有助于模拟使用常规 DFT 计算或基于力场的计算无法再现的实验中观察到的现象。此外，它们可能通过揭示与 MOFs 相关的先前未发现的行为为实验人员提供新的见解。


    在 MOFs 中 MLP 开发的早期阶段，结构被分解为分子片段，MLP 基于这些单元进行训练。⁹⁴,⁹⁵这些训练好的模型能够准确预测平衡晶格常数，并可应用于诸如机理和热行为等更复杂的应用。⁹⁵然而，该方法从根本上存在一个限制：周期性在训练水平上无法明确考虑。为解决此问题，几项后续研究使用了整个晶胞作为
    MLPs 的训练集。Vandenhaute 等⁹⁶使用增量学习方法训练了名为 NequIP 的 MLP 模型，该方法使用了元动力学的概念来高效采样构型以训练模型。在这项工作中，UiO-66
    (Zr) 和 MIL-53 (Al) 分别被选为代表性刚性和柔性 MOFs。凭借 MLPs 的优点，其能够以高精度模拟大胞，他们将 MIL-53 (Al)
    的模拟胞扩展到 9 × 2 × 9（包含超过 10 000 个原子）并成功再现了实验转变压力数据（图 5b）。在这项工作中，他们研究了框架对外部压力的柔性响应，但客体诱导的柔性尚未使用
    MLP 进行研究。因此，这将是一个未来研究课题的绝佳建议。同样，Fan 等⁹⁷合理设计了可能由于酒架基序而表现出相变的二维 MOFs，并使用 MLP 模型观察了机理行为。虽然之前的研究将模拟结果与实验结果相匹配，但同一组的最新研究利用
    MLPs 在分子水平上揭示了实验中未观察到的现象。⁹⁸他们研究了 CALF-20 的动力学并观察到负面积压缩性 (NAC) 和负热膨胀 (NTE)，这些是与
    CALF-20 实验观察不一致的反直觉现象。


    除了晶体框架内的形变外，Castel 等²⁶使用 MLP 在分子水平上研究了 MOFs 的非晶相。他们选择 ZIF-4 作为基准 MOF，实验表明其具有多种非晶相。非晶相是通过熔融淬火方法获得的，这可以直观地用分子动力学体现。由于在常规通用力场中键应保持完整，涉及可逆键断裂和形成的
    MOFs 晶格破坏无法模拟。然而，正如前文所述，键断裂和形成可以使用 MLP 模拟，类似于 DFT 计算，从而能够研究晶格性的丧失。

