    ### 3.4. 机器学习势（MLPs）在金属有机框架（MOFs）中的潜在应用


    考虑到MOFs因其高度可调性和模块化而形成的广阔化学空间，用于训练MLPs的公开量子计算数据有限。因此，MLPs在MOFs中的应用进展比其他材料缓慢，这使得探索MLPs在不同领域中的应用并将其适配到MOF上显得很有价值。


    由于计算成本，大多数涉及量子计算的MOF模拟仅限于考虑固态框架。然而，固定框架假设可能无法完全捕捉真实行为，因此这种方法与实验相比会产生差异。另一方面，MLPs已被证明能够准确模拟多种液体体系和非均相固-液体系的物理化学性质。99–102
    鉴于MOFs通常与水或其他溶剂等液体体系相互作用，利用MLPs模拟包含MOFs的非均相体系是未来研究的一个重要方向。同样，MLPs可以为MOFs在多相催化中的研究提供有吸引力的解决方案。在其他材料中，MLPs已被用于预测反应路径、多相催化剂的自由能图以及表面化学环境。103–108
    鉴于人们对将MOFs用作潜在多相催化剂的兴趣日益浓厚，部署MLPs可以加速这一研究领域的发展。


    此外，MLPs扩大了可模拟体系的规模。通过MLPs，可以模拟MOFs的非晶相或含缺陷的MOFs，而这些用传统方法一直难以实现。70,109–112 同时，MLPs有望模拟MOFs的自下而上生成过程，这将有助于更深入地理解MOFs及其合成过程。


    尽管MLPs在MOFs中具有潜在用途，但主要瓶颈仍然是缺乏系统化的量子计算数据。QMOF数据库51（包含20,000多种MOFs的量子级计算化学性质）和最近发布的OpenDAC数据库113（包含4000万（40
    M）次DFT计算，针对利用MOFs进行直接空气捕集）为在MOFs中部署MLPs提供了巨大的帮助和支持。尽管如此，要加速MLPs在MOFs中的发展，还需要更多高质量的数据。量子计算数据可用性的提高将推动面向MOFs的MLPs的发展，从而增强介观尺度原子模拟的能力，这对MOFs至关重要。


    ## 4. 用于MOF设计的生成模型


    ### 4.1. 生成模型及其在材料设计中的应用


    近年来，深度生成模型的出现给计算机科学领域带来了巨大成功。与传统判别模型不同，生成模型通过学习数据的内在概率分布，能够生成与给定数据集相似的新数据点。多种生成模型架构已被开发出来，包括变分自编码器（VAEs）114、生成对抗网络（GANs）115和扩散模型116，并在各个领域取得了显著进展。尤其值得注意的是，计算机视觉117,118和自然语言处理119,120是生成模型成功尤为突出的领域。它们在生成逼真图像方面的卓越表现催生了DALL-E121,122和Midjourney123等图像生成器，而ChatGPT124等大型语言模型已成为各种应用中不可替代的工具。


    生成模型在其他领域取得的巨大成功推动了它们在材料科学领域的应用。值得注意的是，这些模型的生成过程通常从在潜在空间中采样随机噪声或随机向量开始。114,116
    因此，它们提供了理论上无限的搜索空间，不受给定数据集的限制，这是生成新型化学结构的一个引人入胜的特点。此外，这些模型的生成过程可以有意地偏向于获取所需样本，这被称为条件生成。125,126
    通过这样的过程，可以有选择地生成具有用户期望性质的材料，从而实现材料的逆向设计。


    生成模型已在多个领域得到广泛研究，包括类药分子、127,128 蛋白质、129,130 和小晶体。131 然而，如前几节所讨论的，新技术在多孔材料中的引入往往相对缓慢。这是因为多孔材料的结构复杂性，其通常包含相对较多的原子，涵盖更广泛的原子类型。13,132
    此外，多孔材料的周期性是处理晶体结构时的另一个主要瓶颈，这减缓了前沿方法的引入。


