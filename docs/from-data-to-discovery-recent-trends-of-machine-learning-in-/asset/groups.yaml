    在各种生成模型架构中，扩散模型因其在生成逼真样本和多样化条件能力方面的卓越性能而获得了巨大关注。¹¹⁶,¹¹⁸ 将扩散模型应用于 MOF 生成最近已被尝试，采用了多种不同的方法来处理
