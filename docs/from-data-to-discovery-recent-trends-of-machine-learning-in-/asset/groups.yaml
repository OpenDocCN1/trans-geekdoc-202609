    **Figure 7** Autonomous materials discovery. (a) Schematic showing a process of
    synthesizing ZIF-67 with improved crystallinity via the integration of a robotic
    platform with a Bayesian optimization algorithm. Reprinted with permission from
    ref 21. Copyright 2021 American Chemical Society. (b) Autonomous materials discovery
    with the autonomous lab. Powder dosing, sample heating, and product characterization
    were automated while the transfer between these stations is performed using robotic
