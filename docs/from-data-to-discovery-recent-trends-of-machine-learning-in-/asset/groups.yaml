    Most existing MOF databases are generated through simulations, which allow them
    to cover vast chemical spaces with high time efficiency. However, simulation methods
    are not perfectly accurate and can introduce small or large errors. Additionally,
    simulations are often conducted under assumptions such as perfect crystallinity,
    which can lead to discrepancies from real materials. To overcome these limitations,
    researchers have attempted to extract data from the experimental literature (often
    referred to as data mining) so that experimental data can be directly utilized
    for model training.


    In the early stages of data mining for MOFs, rule-based extraction methodologies
    and relatively simple natural language processing (NLP) techniques were employed.
    Park et al. developed a text mining algorithm that captures units for surface
    area and pore volume from HTML format inputs. Nandy et al. used NLP and image
    analysis techniques to mine solvent-removal stability and thermal degradation
    temperatures of MOFs from experimental literature. The scope of data mining later
    expanded to include synthetic information on MOFs, where synthesis conditions
    of MOFs were extracted from experimental procedures and further processed for
    deeper understanding on their synthesis. More recently, large language models
    have emerged as an irreplaceable tool in data mining. Compared with rule-based
    algorithms, the use of large language models has made the mining process more
    flexible and accurate. These models have also impacted the MOF community, with
    the Yaghi group employing ChatGPT for the data mining of MOF data.


    Data mining is an evolving field and is expected to play a crucial role in constructing
    high-quality experimental databases. The MOF domain is particularly suited to
    active mining given the large volume of ongoing experimental work. One factor
    that could drive rapid progress in this field is the establishment of standardized
    practices in data reporting and management. If researchers adopt a uniform format
    for data reporting in the scientific literature, the accuracy of data mining could
    be significantly enhanced. Additionally, since researchers typically report only
    the top (or best) experimental results, the volume of experimental data could
    be dramatically increased if they also publish their failed or partially successful
    outcomes.


    ### 5.4. Automation of Experiments and Autonomous Laboratories


    Lastly, in this section, we highlight promising and futuristic approaches of data
    acquisition. Automation of the experimental process is an emerging concept in
    materials discovery that has gained huge traction in recent days. This is made
    possible by using robotic systems, where robotic arms and other mechanical systems
    handle tasks such as sample preparation, mixing chemicals, and operating instruments.
    Such automation possesses huge advantages compared with experiments carried out
    by humans. Automated experiments can run continuously (i.e., 24 h per day/7 days
    a week) with higher efficiency, thereby allowing researchers to obtain more experimental
    data in an efficient manner. Additionally, it minimizes the risk of human error
    in experimental procedures, leading to more reliable and reproducible results.
    Due to these benefits, automation of experimental processes is an attractive method
    for obtaining large volumes of high-quality data.


    An autonomous lab (also called a self-driving lab) is a more advanced and futuristic
    concept, in which laboratory processes and experiments are conducted without human
    intervention ([Figure 7b](...)).¹⁷²,¹⁷³ The facility typically features robotics,
    artificial intelligence (AI), and multiple sensors, where sophisticated AI algorithms
    manage and optimize experimental parameters, analyze data in real-time, and autonomously
    make decisions based on predefined objectives. Active learning is often referred
    to in this context, as it helps in selecting the next set of experiments, thereby
    making the whole process more efficient. Few materials domains, including organic
    semiconductor lasers (OSLs), are being tested for the introduction of autonomous
    lab, yet several obstacles remain, including both mechanical and software challenges.¹⁷¹
    To the best of our knowledge, MOF synthesis in a completely autonomous lab with
    zero human intervention has not been reported yet, but it is our opinion that
    the efforts of researchers will make it possible in the near future.


    ## 6. CONCLUSIONS


    In this Perspective, we introduced the recent trends of machine learning studies
    in MOFs and the future directions pursued by the researchers. Regression models
    for elucidating structure–property relationships were first covered, from conventional
    methods to transformer-based models, which have recently shown exceptional performance.
    Subsequently, we covered the recent trends in machine learning studies with a
    particular focus on MLPs, which have immense potential across a wide range of
    applications. MLPs are now gaining attention in the field of MOFs, with the anticipation
    that they will pave the way for the complicated chemistry of MOFs to be handled
    in an effective manner. Generative models are another emerging branch offering
    a new paradigm in materials design. We shared recent attempts to implement them
    in MOFs, along with some aspects of materials design using generative models.
    Lastly, several challenges encountered using machine learning methodologies, and
    efforts to address them have been discussed.


    Machine learning has played a critical role in shifting the paradigm of research
    in the materials field. MOFs are a domain where their achievements are particularly
    pronounced, and significant advancements have been witnessed through the introduction
    of machine learning-based methodologies. Through continued research efforts, machine
    learning is poised to unlock the full potential of MOFs, driving further progress
    and innovation in materials science.


