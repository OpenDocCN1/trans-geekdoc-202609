    ## 从数据到发现：金属有机框架中机器学习的最新趋势


    Junkil Park, Honghui Kim, Yeonghun Kang, Yunsung Lim, and Jihan Kim*


    引用：JACS Au 2024, 4, 3727–3743


    在线阅读


    ACCESS | 指标与更多 | 文章推荐


    收稿日期：2024年7月10日

    修订日期：2024年8月28日

    接受日期：2024年8月29日

    发表日期：2024年9月12日


    **ABSTRACT:** 以其高孔隙率和结构多样性而闻名，金属有机框架（MOFs）是一类适用于广泛应用的有前景的材料。近几十年来，随着大规模数据库的发展，MOF
    社区见证了数据驱动机器学习方法带来的创新，这些方法加深了对 MOFs 化学本质的理解，并推动了新型结构的发展。值得注意的是，随着新方法、架构和数据表示的积极研究，机器学习持续快速发展，其在材料发现中的实施也积极推进。在这种情况下，密切关注近期研究趋势并识别正在引入的技术非常重要。在本述评中，我们重点关注
    MOF 领域机器学习的出现趋势、它们面临的挑战以及其发展的未来方向。


    ![](img/2f712768e5a4736e5d16a5c39e669a82_0_0.png)


    **KEYWORDS:** 机器学习，金属有机框架，数据驱动，回归模型，生成模型，机器学习势，数据挖掘，自主实验室


    ## 1. 引言


    金属有机框架（MOFs）由金属离子/簇和有机连接体的有序网络组成，近几十年来已成为一类创新的晶体材料。鉴于其宽敞的孔隙和化学多功能性，MOFs 在广泛的应用中受到关注，包括气体储存、1–4
    催化、5–7 传感器、8,9 和药物递送。10,11 特别是源于其构建单元无数组合而产生的高结构多样性，是 MOFs 最显著的特征。12,13 已鉴定出具有独特结构和新颖功能的大量
    MOFs，实验报道的结构数量超过 100,000 个。14,15 此外，MOFs 相对简单的合成基元使其能够在计算机中生成，提供无限数量的假设结构。如此高的结构多样性和庞大的搜索空间不断推动
    MOFs 的应用边界进入未探索的领域。13


    矛盾的是，高结构多样性赋予 MOFs 无限潜力，同时也给确定特定应用的最佳结构带来挑战。虽然实验上检查大量结构存在明显局限，但分子模拟提供了可行的替代方案。包括密度泛函理论（DFT）计算、巨正则蒙特卡洛（GCMC）模拟和分子动力学（MD）模拟在内的各种模拟类型在此背景下被积极使用。尽管模拟包含一定误差，但它们能够更快地评估结构，从而促进新型
    MOFs 的发现。然而，在 MOFs 庞大的材料空间中采用分子模拟仍面临若干局限。即使与实验评估相比分子模拟相对较快，对数据库中每个结构进行评估（即所谓的
    高通量筛选16,17）也是低效的或通常不可行的。13 更重要的是，解释大量模拟数据并非易事，因此需要有效的方法来分析积累的数据并从中提取有意义的信息。


    以机器学习为代表的数据驱动方法已成为材料设计中不可或缺的工具，能够成功解决上述挑战。通过有效捕捉大量数据中的固有模式，机器学习模型成功揭示了各种结构-性能关系，为材料化学提供了全面理解。18
    这些方法提供的化学见解已被积极用于规划未来实验或设计具有所需特性的新材料。19–22 材料设计中的另一个最新趋势是采用深度生成模型，该模型直接生成化学结构作为输出，且其搜索空间不受训练数据库的限制。23,24
    此外，诸如机器学习势（MLPs）25,26 或不同领域之间的知识迁移27 等近期出现的方法引起了极大兴趣，它们在材料科学各个领域的整合现在令人鼓舞。在本述评中，我们概述了材料科学中机器学习方法的最新趋势和未来方向，特别关注
    MOFs（见图 1）。


    ![](img/2f712768e5a4736e5d16a5c39e669a82_1_0.png)


    **Figure 1.** 机器学习的发展及其在 MOFs 中的应用。显著的机器学习架构或方法及其在 MOFs 中的代表性意义按时间顺序呈现。与回归模型、机器学习势和生成模型相关的元素分别用黄色、红色和橙色着色。图神经网络作为一类基础的人工神经网络，同时用黄色和红色着色，因为它在开发各种机器学习模型（包括回归模型和机器学习势）中被积极使用。经许可转载自参考文献
