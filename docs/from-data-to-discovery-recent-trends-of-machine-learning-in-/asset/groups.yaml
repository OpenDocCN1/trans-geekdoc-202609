    大多数现有的 MOF 数据库都是通过模拟生成的，这使得它们能够以较高的时间效率覆盖广阔的化学空间。然而，模拟方法并不完全准确，会引入微小或较大的误差。此外，模拟通常在诸如完美结晶性等假设下进行，这可能导致与真实材料存在差异。为了克服这些局限，研究人员尝试从实验文献中提取数据（通常称为数据挖掘），以便实验数据可以直接用于模型训练。


    在 MOF 数据挖掘的早期阶段，采用了基于规则的提取方法和相对简单的自然语言处理（NLP）技术。Park 等人开发了一种文本挖掘算法，可从 HTML 格式输入中捕获表面积和孔体积的单位。Nandy
    等人使用 NLP 和图像分析技术从实验文献中挖掘 MOF 的溶剂去除稳定性及热降解温度。数据挖掘的范围后来扩展到 MOF 的合成信息，其中 MOF 的合成条件从实验程序中提取并进一步处理以对其合成进行更深入的理解。最近，大型语言模型已成为数据挖掘中不可或缺的工具。与基于规则的算法相比，使用大型语言模型使挖掘过程更灵活、更准确。这些模型也影响了
    MOF 社区，Yaghi 小组采用 ChatGPT 进行 MOF 数据的数据挖掘。


    数据挖掘是一个不断发展的领域，预计将在构建高质量实验数据库中发挥关键作用。鉴于大量正在进行的实验工作，MOF 领域特别适合主动挖掘。推动该领域快速进展的一个因素是建立数据报告和管理方面的标准化实践。如果研究人员在科学文献中采用统一的数据报告格式，数据挖掘的准确性将得到显著提高。此外，由于研究人员通常只报告最佳实验结果，如果他们还发表失败或部分成功的成果，实验数据的数量将大幅增加。


    ### 5.4. 实验自动化与自主实验室


    最后，在本节中，我们重点介绍了数据获取的有前景且具有前瞻性的方法。实验过程的自动化是材料发现中一个新兴的概念，近年来获得了巨大的关注。这是通过使用机器人系统实现的，其中机械臂和其他机械系统处理诸如样品制备、混合化学品和操作仪器等任务。与人类进行的实验相比，这种自动化具有巨大的优势。自动化实验可以连续运行（即每天
    24 小时/每周 7 天），效率更高，从而使研究人员能够以高效的方式获得更多实验数据。此外，它最大限度地减少了实验程序中人为错误的风险，从而获得更可靠、可重复的结果。由于这些益处，实验过程的自动化是获取大量高质量数据的有吸引力的方法。


    自主实验室（也称为自主驾驶实验室）是一个更先进、更具前瞻性的概念，其中实验室流程和实验在没有人工干预的情况下进行（[图 7b](...)）。¹⁷²,¹⁷³
    该设施通常配备机器人、人工智能（AI）和多个传感器，其中复杂的 AI 算法管理并优化实验参数、实时分析数据，并根据预定义目标自主做出决策。在此背景下，主动学习经常被提及，因为它有助于选择下一组实验，从而使整个过程更高效。包括有机半导体激光器（OSLs）在内的少数材料领域正在测试自主实验室的引入，但仍存在若干障碍，包括机械和软件方面的挑战。¹⁷¹
    据我们所知，尚未报道在完全自主的实验室中实现零人工干预的 MOF 合成，但我们认为研究人员的努力将在不久的将来使其成为可能。


    ## 6. 结论


    在本述评中，我们介绍了 MOF 中机器学习研究的最新趋势以及研究人员追求的未来方向。首先介绍了用于阐明结构-性能关系的回归模型，从传统方法到最近表现出卓越性能的基于
    Transformer 的模型。随后，我们介绍了机器学习研究的最新趋势，特别关注 MLP，其在广泛的应用中具有巨大的潜力。MLP 现在在 MOF 领域受到关注，预计它们将为以有效的方式处理
    MOF 的复杂化学铺平道路。生成模型是另一个新兴分支，为材料设计提供了一种新范式。我们分享了在 MOF 中实施它们的最新尝试，以及使用生成模型进行材料设计的某些方面。最后，讨论了使用机器学习方法遇到的若干挑战以及解决这些挑战的努力。


    机器学习在材料领域的研究范式转变中发挥了关键作用。MOF 是一个成就特别显著的领域，通过引入基于机器学习的方法已见证了重大进展。通过持续的研究工作，机器学习有望释放
    MOF 的全部潜力，推动材料科学的进一步进步和创新。


