    四聚体）的 pcu 拓扑中。他们利用了 DiffLinker，¹²⁸ 这是一种预先开发的扩散模型，用于基于化学片段生成配体分子。他们将 0.1 bar 下
    CO₂ 容量高于 2 mmol/g 的结构定义为高性能 MOF，并从现有数据库中这些高性能 MOF 中获得了 540 个独特的分子片段。利用这些片段，他们获得了
    12,305 个配体，并据此获得了 120,000 个 MOF 结构。他们使用单独的预测模型筛选了 MOF 空间，并验证了六种 CO₂ 容量高于 2 mmol/g
    的 MOF。


    Fu 等人¹³⁸ 通过引入构建模块的粗粒化表示，巧妙地处理了 MOF 的结构复杂性。他们认为基于模板的方法会限制搜索空间并排除可行的材料，因此他们通过在三维坐标中直接定位粗粒化构建模块来生成
    MOF。作为后处理步骤，需要额外的 MOF 组装过程，以对齐构建模块的取向并确定它们之间的连接性。他们训练了一个额外的回归模型，该模型可从潜在向量预测 CO₂
    工作容量，并利用其选择性生成具有高 CO₂ 容量的结构。


    最近，Park 等人³⁶ 开发了一种用于 MOF 生成的扩散模型，特别关注在条件生成期间处理数据的多样化模态（图 6b）。他们指出，孔隙材料逆向设计研究中考虑的目标性质在灵活性方面迄今受到限制，并声称在条件生成期间处理多样化数据模态的必要性。值得注意的是，他们使用了符号距离函数（SDFs）作为输入表示，以精细描述
    MOF 的孔隙结构，其模型实现了 81.7% 的高结构有效性。此外，他们展示了对多样化数据模态进行条件化的能力，包括数值、类别、文本数据，甚至它们的组合。


    ## 4.3. 优势与劣势


    使用生成模型进行材料生成相比其他材料设计方法具有若干优势。一般而言，生成模型的训练过程遵循无监督学习，其中模型在没有显式标签或注释的数据上进行训练。生成模型可以通过捕捉潜在分布从未标记数据中学习；因此，在标记数据稀缺或获取成本高昂的情况下，生成模型是有益的。此外，生成模型可以探索庞大（通常在理论上无限）的搜索空间，这在生成多样化和新颖的化学结构时是一个有吸引力的特性。最后，如前研究所述，具有目标性质的材料可通过条件生成进行设计。


    随着更具多样性和多功能性的条件化方法被研究，一个有趣的研究方向是将自然语言处理作为条件之一纳入其中。最近，大型语言模型已被部署来构建材料设计的友好用户平台。¹³⁹
    特别针对 MOF，Kang 等人开发了一个名为 ChatMOF¹⁴⁰ 的模块，使用户能够使用自然语言与该模块进行交流。同样，在条件生成期间处理文本数据是生成模型正在追求的方向。¹⁴¹
    这使用户能够以自然语言表达其期望特征，显著降低了使用这些模型的门槛，尤其对于没有领域知识的人而言。


    然而，在材料设计的生成模型方面仍然存在若干根本性挑战。如前所述，生成模型通过学习给定训练数据的概率分布来工作，这从根本上使生成模型高度依赖其训练数据，其中训练数据集中存在的偏差会导致生成样本中出现相同的偏差。这种依赖性会给材料生成带来重大挑战，因为构建完全无偏的数据集通常难以实现。因此，在训练生成模型时，应在准备多样且分布均匀的训练数据集方面付出
    considerable 努力。


    另一个值得分享的方面是，生成模型不太适合外推。由于这些模型利用了来自训练数据的学习模式，它们能够生成与训练数据相似的新样本（即插值）。然而，生成超出训练数据范围的数据点具有挑战性。例如，生成具有前所未有的高
    H₂ 容量的 MOF 等任务对这些模型来说可能具有挑战性。尽管如此，针对外推的生成模型研究正在积极进行中，¹⁴² 通过此，预计将出现此类任务的更根本的解决方案。


    ## 5. 未来方向与新兴趋势


    ### 5.1. 提高速度和效率


    虽然传统的机器学习模型约有 10,000 个参数，但使用 Transformer 架构的回归模型可多达 1 亿个参数。³⁵,⁵⁶⁻⁵⁸ 参数数量的增加提高了模型学习更复杂模式和关系的能力，从而提高了其准确性和灵活性。然而，随着参数数量的增加，训练过程变得显著更长，且训练所需的数据量呈指数级增加。¹⁴³,¹⁴⁴
    这在计算资源和数据获取方面带来了挑战，突出了对高效训练策略和稳健数据获取方法的需求。


    在此背景下，迁移学习被认为是一种有前景的方法，可减少训练时间和所需数据量。迁移学习是一种机器学习技术，其中预先开发的模型作为可应用于其他任务的基础模型。¹⁴⁵
    它通常涉及在大型数据集（称为预训练模型）上训练模型，然后为特定感兴趣的任务（称为微调）初始化训练过程，通常使用较小的学习率。当数据量相对较少时，该方法可能有效。因此，迁移学习对提高
    MOF 性质预测模型的效率和准确性具有重要前景，而 MOF 通常表现出复杂的数据分布和数据不足。35,146,147 在类似背景下，不同领域之间的知识转移也是一种有前景的方法，这将在下一节中讨论。


    此外，可以考虑轻量级深度学习模型以提高其在材料科学中的使用效率。模型的轻量化是指在保持性能的同时设计参数较少的模型。148 这种做法对于处理大量数据特别重要，因为它可以减轻缓慢的推理速度和资源密集型的预训练步骤。在此背景下，MLP
    值得注意，因为最近的进展导致了准确性的提高，149 但也导致了更大的模型复杂性和规模，从而导致更大的内存使用和计算成本。虽然 MLP 具有巨大的潜力，但为了开发具有高适用性的方法，研究人员还应考虑模型准确性之外的较大模型规模的负担。正在探索各种技术来轻量化机器学习模型，例如知识蒸馏，150,151
    其中较小的模型被教导较大模型所学到的知识，以及修改模型架构以减小其规模。152–155 尽管轻量化在材料科学中尚未得到广泛研究，但在模型参数增加的趋势中关注研究工作对模型效率，可能会导致开发出学习时间更短同时保持高性能的模型。


    ### 5.2. 融合来自其他材料的工具/数据集


    由于结构复杂且需要高保真数据，数据稀缺是数据驱动方法经常面临的主要瓶颈，尤其是在多孔材料研究中。156 特别是在感兴趣的性质难以模拟从而需要实验评估的领域（例如质子电导率157,158），或模拟数据昂贵的领域（例如电子结构计算159）中，该问题尤为突出。对于特定任务数据有限的情况，如果可以访问来自其他领域的大型数据集，则将该数据转移到特定任务将是一种可行的补救数据稀缺问题的方法。特别对于多孔材料，由于多孔材料的各种类别（例如沸石、MOF、COF、PPN
    等）已被研究数十年，利用多孔材料领域（甚至来自非多孔材料）的积累数据可以为使用数据驱动方法对其进行研究提出新范式。


    利用跨领域知识的代表性示例之一是 He 等人160 的工作。以验证电导性 MOF 为目标，他们开发了一个二元分类模型，该模型基于带隙对结构是否具有导电性进行分类。当时，没有专门针对
    MOF 带隙的数据库。（然而，QMOF 数据库，51 现在提供了 MOF 结构的 DFT 计算带隙。）为克服这一限制，他们利用了无机化合物积累的数据。开放量子材料数据库（OQMD）161
    包含 ~52,300 种无机化合物的 DFT 水平计算的带隙信息。他们在该数据集上训练了分类模型并将其应用于 MOF 数据库，以识别可能具有导电性的结构。他们的研究方法预测了九种导电
    MOF，随后的计算验证证实其中六种为金属。这是一个使用来自其他领域的数据来解决 MOF 研究领域数据稀缺问题的适当示例。


    迁移学习是不同领域之间知识转移的广泛使用方法。Cai 等人162 探索了在异质多孔材料背景下实施迁移学习的可能性。他们的重点是解决计算就绪实验（CoRE）数据集大小之间的不平衡，其中
    CoRE COF 结构相对较少（约 1,000 个结构），而 CoRE MOF 超过 10,000 个结构。14 为了实现用 CoRE COF 预测 Xe/Kr
    选择性的高准确性，研究人员采用了迁移学习。具体而言，他们使用 CoRE MOF 数据库对模型进行预训练，并用 300 个 COF 结构进行微调。他们证实，与仅使用
    COF 数据库的直接学习相比，迁移学习始终实现了更高的准确性。


    Park 等人163 提出了多孔材料中迁移学习的另一个引人注目的应用。他们在多孔材料的各个领域训练了 Transformer 架构，涵盖 MOF、COF、沸石和
    PPN。在不同材料类别之间的协同效应推动下，他们旨在通过迁移学习解决数据不平衡问题。他们的方案涉及提出跨材料少样本学习方案。通过转移从 MOF 获得的知识，他们观察到在少样本学习场景中预测
    COF 带隙的准确性得到提高。此外，作者还进一步探索了零样本学习方案的可行性，其中仅在材料 A 上训练的模型可用于预测未见的材料 B。


    作为多孔材料之间知识转移的另一个代表性示例，Sun 等人27 利用元学习方案寻求最佳 H2 存储条件。元学习和迁移学习都是旨在通过使用先验知识提高训练效率的方法。然而，元学习的目的是略有不同，因为它旨在训练一个模型，使其能够很好地推广到各种任务。通过利用沸石、MOF
    和超交联聚合物的高通量数据，他们开发了一个元学习模型，能够在广泛的压力和温度范围内联合预测各种材料的吸附容量。已验证，使用元学习方法训练的模型与为每种材料单独训练的模型相比表现出更高的准确性。


    本节涵盖了利用跨材料领域知识转移来解决数据稀缺问题的若干先例工作。随着更多数据迅速积累和新数据库的构建，不受感兴趣材料类别限制地利用数据正成为一种常见方法。即使在处理数据稀缺之外，来自其他领域的化学直觉也可以提高目标领域模型的性能。因此，随着未来大量数据继续积累，适当利用其他领域知识和数据将成为越来越重要的策略。


    ### 5.3. 从文献中提取数据


    数据的质量对于开发可靠的机器学习模型至关重要。在本节中，我们关注现实世界数据与模拟数据之间的差异。

