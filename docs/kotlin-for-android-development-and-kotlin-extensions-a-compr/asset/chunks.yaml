    \ 块作为任何未匹配值的备备选方案。\n\n## 循环：高效执行重复任务\n\n循环对于执行重复任务以及遍历数据集合或序列至关重要。Kotlin 提供了 `for`\
    \ 和 `while` 循环来满足不同的场景。\n\n### 示例 3：`for` 循环\n\n`for` 循环非常适合遍历范围、数组或任何迭代对象。\n\n\
    ```kotlin\n// 打印从 1 到 5 的数字\nfor (i in 1..5) {\n    println(\"Count: $i\")\n}\n\
    ```\n\n在这个示例中，`for` 循环遍历从 1 到 5 的范围，在每次迭代时打印计数。`in` 关键字简化了语法，使其更具可读性。\n\n### 示例\
    \ 4：`while` 循环\n\n`while` 循环在指定条件为真时会重复执行代码块。\n\n```kotlin\nvar countdown = 3\n\
    while (countdown > 0) {\n    println(\"Countdown: $countdown\")\n    countdown--\n\
    }\n```\n\n在这里，`while` 循环通过打印 `countdown` 的当前值来创建倒计时，直到达到零。只要条件 `countdown > 0`\
    \ ，循环就会继续。\n\n### 示例 5：`do-while` 循环\n\n与 `while` 循环类似，`do-while` 循环先执行代码块然后再检查条件。这确保了代码块至少执行一次。\n\
    \n```kotlin\nvar attempts = 0\ndo {\n    println(\"Trying to connect...\")\n \
