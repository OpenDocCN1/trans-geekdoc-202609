    val capitals = mapOf(\n    \"USA\" to \"Washington, D.C.\",\n    \"France\" to\
    \ \"Paris\",\n    \"Japan\" to \"Tokyo\"\n)\n```\n\nIn this example, a map named\
    \ `capitals` is created, associating countries with their capitals.\n\n### Example\
