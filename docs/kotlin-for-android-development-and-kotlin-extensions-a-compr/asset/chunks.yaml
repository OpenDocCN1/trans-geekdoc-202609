    \## Inheritance: Building Hierarchies of Classes


    Inheritance is a fundamental concept in OOP that allows a class to inherit properties
    and behaviors from another class. Kotlin supports single-class inheritance, providing
    a clean and structured way to build class hierarchies.


    \### Example 7: Inheriting from a Base Class


    \`\`\`kotlin


    // Base class


    open class Animal(val name: String) {


    // Method to make a sound


    open fun makeSound() {


    println("Animal $name makes a generic sound")


    }


    }


    // Derived class inheriting from Animal


    class Dog(name: String) : Animal(name) {


    // Overriding the makeSound method


    override fun makeSound() {


    println("Dog $name barks loudly")


    }


    }


    \`\`\`


    In this example, we define a base class (\`Animal\`) with a property (\`name\`)
    and a method (\`makeSound\`). The \`Dog\` class inherits from \`Animal\` and overrides
    the \`makeSound\` method.


    \### Example 8: Using Inherited Classes


    \`\`\`kotlin


    // Creating objects of the base and derived classes


    val genericAnimal = Animal("Generic")


    val fluffyDog = Dog("Fluffy")


    // Calling the makeSound method on each object


    genericAnimal.makeSound()


    fluffyDog.makeSound()


    \`\`\`


    Objects (\`genericAnimal\` and \`fluffyDog\`) are created from the base and derived
    classes. The \`makeSound\` method is called on each object, demonstrating polymorphism.


    \## Polymorphism: Embracing Diversity in Types


    Polymorphism allows objects of different types to be treated as objects of a common
    base type. Kotlin supports polymorphism through class inheritance and interface
    implementation.


    \### Example 9: Using Polymorphism with Interfaces


    \`\`\`kotlin


    // Interface defining the sound behavior


    interface SoundMaker {


    fun makeSound()


    }


    // Class implementing the SoundMaker interface


    class Cat(val name: String) : SoundMaker {


    // Implementing the makeSound method


    override fun makeSound() {


    println("Cat $name purrs softly")


    }


    }


    \`\`\`


    Here, we define an \`SoundMaker\` interface with a \`makeSound\` method. The \`Cat\`
    class implements this interface.


    \### Example 10: Using Polymorphism with Interface Objects


    \`\`\`kotlin


    // Creating objects of the interface and implementing class


    val soundMaker: SoundMaker = Cat("Whiskers")


    // Calling the makeSound method on the interface object


    soundMaker.makeSound()


    \`\`\`


    An object (\`soundMaker\`) of


    the \`SoundMaker\` interface is created, pointing to a \`Cat\` instance. The \`makeSound\`
    method is called on the interface object, showcasing polymorphism.


    \## Encapsulation: Protecting the Inside World


    Encapsulation is the practice of bundling the data (properties) and methods that
    operate on the data within a single unit, known as a class. Kotlin provides visibility
    modifiers to control the accessibility of properties and methods.


    \### Example 11: Using Visibility Modifiers


    \`\`\`kotlin


    // Class with private and public properties


    class BankAccount {


    private var balance: Double = 0.0


    // Public method to deposit money


    fun deposit(amount: Double) {


    if (amount > 0) {


    balance += amount


    println("Deposit successful. New balance: $balance")


    } else {


    println("Invalid deposit amount")


    }


    }


    // Public method to check balance


    fun checkBalance() {


    println("Current balance: $balance")


    }


    }


    \`\`\`


    In this example, the \`BankAccount\` class has a private property (\`balance\`)
    and public methods (\`deposit\`, \`checkBalance\`). The \`balance\` is encapsulated,
    and its access is restricted to methods within the class.


    \### Example 12: Interacting with Encapsulated Class


    \`\`\`kotlin


    // Creating an object of the BankAccount class


    val account = BankAccount()


    // Performing operations on the object


    account.deposit(1000.0)


    account.deposit(-500.0) // Invalid deposit amount


    account.checkBalance()


    \`\`\`


    An object (\`account\`) of the \`BankAccount\` class is created, and operations
    like depositing money and checking the balance are performed. The encapsulation
    ensures that the \`balance\` property is accessed and modified only through the
    class methods.


    \## Abstract Classes and Interfaces: Blueprint for Types


    Abstract classes and interfaces provide blueprints for other classes to follow.
    Abstract classes can have both abstract and concrete methods, while interfaces
    only declare abstract methods.


    \### Example 13: Abstract Class


    \`\`\`kotlin


    // Abstract class with abstract and concrete methods


    abstract class Shape(val name: String) {


    // Abstract method to calculate area


    abstract fun calculateArea(): Double


    // Concrete method


    fun displayInfo() {


    println("$name - Area: ${calculateArea()}")


    }


    }


    \`\`\`


    Here, we define an abstract class (\`Shape\`) with an abstract method (\`calculateArea\`)
    and a concrete method (\`displayInfo\`).


    \### Example 14: Concrete Class Extending Abstract Class


    \`\`\`kotlin


    // Concrete class extending the abstract class


    class Circle(radius: Double) : Shape("Circle") {


    // Overriding the abstract method to calculate area


    override fun calculateArea(): Double {


    return 3.14 \* radius \* radius


    }


    }


    \`\`\`


    The \`Circle\` class extends the \`Shape\` abstract class and provides an implementation
    for the abstract method.


    \### Example 15: Using Abstract Class and Concrete Class


    \`\`\`kotlin


    // Creating an object of the concrete class


    val circle = Circle(5.0)


    // Calling the concrete and abstract methods


    circle.displayInfo()


    \`\`\`


    An object (\`circle\`) of the \`Circle\` class is created, and the \`displayInfo\`
    method is called, showcasing the use of abstract and concrete methods.


    \### Example 16: Interface


    \`\`\`kotlin


    // Interface defining the behavior of a printer


    interface Printer {


    fun print(document: String)


    }


    \`\`\`


    Here, we define a \`Printer\` interface with a single abstract method (\`print\`).


    \### Example 17: Class Implementing an Interface


    \`\`\`kotlin


    // Class implementing the Printer interface


    class LaserPrinter : Printer {


    // Implementing the print method


    override fun print(document: String) {


    println("Printing document: $document (Laser Printer)")


    }


    }


    \`\`\`


    The \`LaserPrinter\` class implements the \`Printer\` interface and provides an
    implementation for the \`print\` method.


    \### Example 18: Using Interface and Implementing Class


    \`\`\`kotlin


    // Creating an object of the implementing class


    val laserPrinter = LaserPrinter()


    // Calling the interface method through the implementing class


    laserPrinter.print("Sales Report")


    \`\`\`


    An object (\`laserPrinter\`) of the \`LaserPrinter\` class is created, and the
    \`print\` method is called, demonstrating the use of interfaces.


    \## Object-Oriented Programming Best Practices


    As you continue your journey into Object-Oriented Programming with Kotlin, keep
    these best practices in mind:


    1\. \*\*Follow the Single Responsibility Principle:\*\* Ensure that each class
    has a single responsibility, making your code more modular and maintainable.


    2\. \*\*Use Composition:\*\* Favor composition over inheritance to promote code
    reuse and flexibility.


    3\. \*\*Avoid Deep Inheritance Hierarchies:\*\* Keep your class hierarchies shallow
    to prevent complexity and improve readability.


    4\. \*\*Apply the Liskov Substitution Principle:\*\* Subtypes should be substitutable
    for their base types, ensuring consistency and reliability.


    5\. \*\*Prefer Interfaces over Abstract Classes:\*\* Use interfaces to define
    contracts and promote flexibility in your code.


    6\. \*\*Encapsulate with Care:\*\* Encapsulate your data and methods judiciously,
    striking a balance between hiding implementation details and providing necessary
    access.


    7\. \*\*Understand the Open-Closed Principle:\*\* Design your classes to be open
    for extension but closed for modification, allowing for future enhancements without
    altering existing code.'
