    \ 基础：变量、数据类型和运算符\n\n欢迎来到 编程的核心！在本章中，我们将深入学习 Kotlin 的基础模块：变量、数据类型和运算符。这些是赋予你表达逻辑和创建动态响应程序的本质工具。让我们深入探索\
    \ Kotlin 基础元素的简单与强大。\n\n## Kotlin 中的变量\n\n变量就像存储程序信息的容器。它们为值命名，使代码更具可读性。Kotlin\
    \ 引入了两个主要的关键字：`val` 用于只读变量，`var` 用于可变变量。\n\n### 示例 1：声明变量\n\n```kotlin\nval pi\
    \ = 3.14\nvar counter = 0\n```\n\n在这个示例中，`pi` 是一个初始化为 3.14 的只读变量，而 `counter` 是一个从\
    \ 0 开始的可变变量。`val` 关键字确保 `pi` 的值不变，而 `var` 允许 `counter` 在程序执行期间改变。\n\n### 示例 2：类型推断\n\
    \nKotlin 可以在不显式提到类型的情况下理解变量类型。\n\n```kotlin\nval age = 25\nval name = \"Alice\"\
    \n```\n\n在这里，Kotlin 推断出 `age` 是整数，`name` 是字符串。这种类型推断减少了对显式类型声明的需求，使你的代码更加简洁易读。\n\
    \n## Kotlin 中的数据类型\n\n数据类型定义了变量可以持的值类型。Kotlin 支持多种数据类型，每种都有特定的用途。\n\n### 示例 3：探索数据类型\n\
    \n```kotlin\nval age: Int = 25\nval height: Double = 175.5\nval isStudent: Boolean\
    \ = true\nval name: String = \"Alice\"\n```\n\n"
