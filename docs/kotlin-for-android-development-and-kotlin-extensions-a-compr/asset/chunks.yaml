    clickMeButton.setOnClickListener(new View.OnClickListener() {


    @Override


    public void onClick(View view) {


    // Handle button click


    Toast.makeText(MainActivity.this, "Button Clicked!", Toast.LENGTH\_SHORT).show();


    }


    });


    }


    }


    \`\`\`


    In this example, a button with the ID \`clickMeButton\` is identified in the layout,
    and a click listener is set using \`setOnClickListener\`. When the button is clicked,
    a toast message is displayed.


