    \n## 高级 Kotlin 扩展的最佳实践：\n\n在你探索和创建用于集合的高级 Kotlin 扩展时，遵循最佳实践至关重要，以确保你的代码保持可维护性和高效性。\n\
    \n### 偏向不可变性：\n\n在创建转换或过滤集合的扩展时，优先创建新实例，而不是修改现有实例。这促进了不可变性并减少了意外副作用的风险。\n\n###\
    \ 优化可重用性：\n\n在设计扩展时要考虑可重用性。可以应用于多种场景的扩展更具价值且更多功能。\n\n### 利用标准库函数：\n\nKotlin 的标准库为处理集合提供了丰富的函数\
    \ set。只要可能，请利用这些函数以避免重复造轮子，并确保与既定约定兼容。\n\n### 考虑性能影响：\n\n虽然具有表现力的代码至关重要，但请注意你的扩展对性能的影响。考虑集合的大小以及底层操作的效率。\n\
    \n## 结论：\n\n恭喜你！你已经进入了集合高级 Kotlin 扩展的领域。我们探索了过滤、转换、分组、聚合和链式操作，以增强你代码的力量和表达能力。\n\
    \n# 第 7 章：构建自定义 Kotlin 扩展\n\n欢迎来到《Kotlin 扩展入门：学者全面指南》的第 7 章。在本章中，我们将深入学习构建自己的自定义\
    \ Kotlin 扩展的精彩过程。准备好通过逐步示例和实践指导，探索如何创建针对你特定需求的扩展，从而释放你的创造力。\n\n## 了解创建扩展的基础知识：\n\
    \n构建自定义 Kotlin 扩展涉及向现有类添加新功能，提供定制化且具表达力的 API。让我们从创建扩展的基础知识开始。\n\n### 扩展函数的语法：\n\
    \n创建扩展函数的语法简洁且直观。假设你想为 `String` 类创建一个反转单词的扩展：\n\n```kotlin\nfun String.reverseWords():\
    \ String {\n    return this.split(\" \").reversed().joinToString(\" \")\n}\n```\n\
    \n现在，你可以将此扩展应用到任何字符串：\n\n```kotlin\nval originalSentence = \"Kotlin Extensions\
    \ are amazing\"\nval reversedSentence = originalSentence.reverseWords() // Result\
    \ 是 \"amazing are Extensions Kotlin\"\n```\n\n### 扩展函数的结构：\n\n拆解扩展函数的结构，我们有：\n\
    \n- `fun`: 声明函数的关键字。\n- `String`: 被扩展的类。\n- `reverseWords`: 扩展函数的名称。\n- `(): String`:\
    \ 参数列表和返回值。\n\n### 创建扩展属性：\n\n同样，你可以创建扩展属性来为现有类添加新属性：\n\n```kotlin\nval String.wordCount:\
    \ Int\nget() = this.split(\" \").count()\n```\n\n现在，你可以使用该属性：\n\n```kotlin\nval\
    \ sentence = \"Kotlin Extensions are amazing\"\nval count = sentence.wordCount\
    \ // Result 是 4\n```\n\n## 构建实用扩展：\n\n让我们深入研究自定义扩展的实际示例。\n\n### 日期的扩展：\n\n假设你经常需要格式化日期。创建一个扩展：\n\
    \n```kotlin\nimport java.text.SimpleDateFormat\nimport java.util.Locale\n\nfun\
    \ Date.formatPattern(pattern: String): String {\n    val sdf = SimpleDateFormat(pattern,\
    \ Locale.getDefault())\n    return sdf.format(this)\n}\n```\n\n现在，你可以格式化日期：\n\n\
    ```kotlin\nval now = Date()\nval formattedDate = now.formatPattern(\"yyyy-MM-dd\"\
    ) // Result 是当前日期\n```\n\n### 列表的扩展：\n\n考虑你需要找到列表的平均值的情况。为 `List<Double>` 创建扩展：\n\
    \n```kotlin\nfun List<Double>.average(): Double {\n    if (this.isEmpty()) return\
    \ 0.0\n    return sum() / size\n}\n```\n\n现在，计算平均值为：\n\n```kotlin\nval prices\
    \ = listOf(25.5, 30.0, 22.5)\nval averagePrice = prices.average() // Result 是\
    \ 26.0\n```\n\n### 自定义类的扩展：\n\n扩展不仅限于标准库；你也可以扩展自定义类。让我们为 `Person` 类创建一个扩展：\n\n\
    ```kotlin\ndata class Person(val name: String, val age: Int)\n\nfun Person.isAdult():\
    \ Boolean {\n    return age >= 18\n}\n```\n\n现在，你可以判断一个人是否已成年：\n\n```kotlin\n\
    val adultPerson = Person(\"Alice\", 25)\nval isAdult = adultPerson.isAdult() //\
    \ Result 是 true\n```\n\n## 高级扩展概念：\n\n当你对创建扩展更有信心时，让我们探索可以提升你扩展技能的高级概念。\n\n###\
    \ 空安全的扩展：\n\n考虑你想安全地将可空字符串转换为整数的情况。创建一个扩展：\n\n```kotlin\nfun String?.safeToInt(defaultValue:\
    \ Int = 0): Int {\n    return this?.toIntOrNull() ?: defaultValue\n}\n```\n\n\
    现在，你可以处理潜在的空值：\n\n```kotlin\nval number: String? = \"42\"\nval result = number.safeToInt()\
    \ // Result 是 42\n\nval invalidNumber: String? = \"abc\"\nval fallbackResult =\
    \ invalidNumber.safeToInt(10) // Result 是 10\n```\n\n### 带默认参数的扩展：\n\n利用默认参数让你的扩展更灵活。让我们为\
    \ `List<Int>` 类创建一个扩展，用于计算带有可选起始值的总和：\n\n```kotlin\nfun List<Int>.sumWithStartingValue(startingValue:\
    \ Int = 0): Int {\n    return this.fold(startingValue) { acc, next -> acc + next\
    \ }\n}\n```\n\n现在，你可以带或不带起始值计算总和：\n\n```kotlin\nval numbers = listOf(1, 2, 3,\
    \ 4, 5)\nval sumWithoutStartingValue = numbers.sumWithStartingValue() // Result\
    \ 是 15\n\nval sumWithStartingValue = numbers.sumWithStartingValue(10) // Result\
    \ 是 25\n```\n\n"
