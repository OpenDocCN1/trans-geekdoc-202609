    \       println(\"Division attempt completed.\")\n    }\n}\nval result = divide(10,\
    \ 0)\nprintln(\"Result of division: $result\")\n```\n\nIn this example, the `divide`\
    \ function attempts to perform a division. If an `ArithmeticException` occurs\
    \ (such as division by zero), the `catch` block handles the exception and prints\
    \ an error message. The `finally` block is executed regardless of whether an exception\
