    \ 3, 4, 5, 6, 7, 8, 9, 10)\nval evenNumbers = numbers.filterEvenNumbers()\n```\n\
    \n这个扩展清晰地传达了意图：你正在从列表中过滤偶数。\n\n## 使用 Kotlin 扩展创建可读的 DSL\n\n领域特定语言（DSL）提供了一种编写读起来像特定语言代码的方法。Kotlin\
