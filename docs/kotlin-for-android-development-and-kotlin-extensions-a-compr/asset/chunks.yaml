    \n## 标记循环\n\n在嵌套循环中，Kotlin 允许你对循环进行标记并指定要 break 或继续哪个循环。\n\n### 示例 8：带标签的 `break`\n\
    \n```kotlin\nouterLoop@ for (i in 1..3) {\n    for (j in 1..3) {\n        if (i\
    \ * j == 6) {\n            println(\"Breaking at $i, $j\")\n            break@outerLoop\n\
    \        }\n        println(\"Iteration: $i, $j\")\n    }\n}\n```\n\n在这个示例中，外层循环被标记为\
    \ `outerLoop`。当满足条件 `i * j == 6` 时，`break@outerLoop` 语句会终止两个循环。\n\n### 示例 9：带标签的\
