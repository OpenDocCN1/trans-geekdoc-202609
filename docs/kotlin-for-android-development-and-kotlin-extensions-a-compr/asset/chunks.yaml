    val product = operateOnNumbers(4, 6, multiply)\nprintln(\"Result of multiplication:\
    \ $product\")\n```\n\nIn this example, `multiply` is a lambda expression representing\
    \ a function that multiplies two numbers.\n\n## Inline Functions\n\nThe `inline`\
    \ modifier in Kotlin allows you to request that the compiler insert the body of\
    \ a function directly into the calling code. This can improve performance by avoiding\
    \ the overhead of function calls.\n\n### Example 16: Inline Function\n\n```kotlin\n\
    inline fun executeTask(block: () -> Unit) {\n    block()\n}\n```\n"
  raw: 'Welcome to the fascinating world of functions in Kotlin! In this chapter,
    we''ll unravel the power and flexibility that functions bring to your Kotlin programs.
    Functions serve as building blocks, allowing you to break down your code into
    manageable and reusable components. We''ll explore how to define functions, pass
    parameters, return values, and call functions with different approaches. Let''s
    dive into the heart of modular and efficient Kotlin programming.


    \## Defining Functions in Kotlin


    At its core, a function is a block of code that performs a specific task. In Kotlin,
    defining a function involves specifying its name, parameters, return type, and
    the code it executes.


    \### Example 1: Simple Function


    \`\`\`kotlin


    fun greet() {


    println("Hello, Kotlin Developer!")


    }


    \`\`\`


    In this example, we define a simple function named \`greet\`. The function body,
    enclosed in curly braces, contains the code to print a greeting message.


    \### Example 2: Function with Parameters


    \`\`\`kotlin


    fun greetByName(name: String) {


    println("Hello, $name!")


    }


    \`\`\`


    Here, the function \`greetByName\` takes a parameter \`name\` of type \`String\`.
    This allows the function to personalize the greeting based on the provided name.


    \### Example 3: Function with Return Type


    \`\`\`kotlin


    fun square(number: Int): Int {


    return number \* number


    }


    \`\`\`


    The function \`square\` calculates the square of a given number and returns the
    result. The colon \`:\` followed by \`Int\` specifies the return type of the function.


    \## Calling Functions in Kotlin


    Once you''ve defined a function, calling or invoking it is a straightforward process.
    You provide the required arguments, and the function executes its defined logic.


    \### Example 4: Calling Simple Function


    \`\`\`kotlin


    // Calling the simple greet function


    greet()


    \`\`\`


    Here, we call the \`greet\` function, and it prints the predefined greeting message.


    \### Example 5: Calling Function with Parameters


    \`\`\`kotlin


    // Calling the greetByName function with an argument


    greetByName("Alice")


    \`\`\`


    In this case, we call the \`greetByName\` function, passing the argument "Alice."
    The function then prints a personalized greeting for Alice.


    \### Example 6: Calling Function with Return Type


    \`\`\`kotlin


    // Calling the square function and printing the result


    val result = square(5)


    println("Square of 5 is: $result")


    \`\`\`


    The \`square\` function is called with the argument 5, and the result is stored
    in the \`result\` variable. We then print the calculated square.


    \## Default and Named Arguments


    Kotlin allows you to define default values for function parameters, making it
    more flexible when calling functions. Additionally, you can use named arguments
    to specify values for specific parameters.


    \### Example 7: Function with Default Argument


    \`\`\`kotlin


    fun greetWithDefault(name: String = "Developer") {


    println("Hello, $name!")


    }


    \`\`\`


    Here, the \`greetWithDefault\` function has a default value for the \`name\` parameter.
    If no argument is provided, the default value "Developer" is used.


    \### Example 8: Calling Function with Default Argument


    \`\`\`kotlin


    // Calling the greetWithDefault function without an argument


    greetWithDefault()


    \`\`\`


    In this example, calling \`greetWithDefault\` without providing an argument uses
    the default value, resulting in the greeting "Hello, Developer!"


    \### Example 9: Function with Named Arguments


    \`\`\`kotlin


    fun displayOrder(item: String, quantity: Int, priority: String = "Normal") {


    println("Item: $item, Quantity: $quantity, Priority: $priority")


    }


    \`\`\`


    Here, the \`displayOrder\` function has parameters \`item\`, \`quantity\`, and
    a default value for \`priority\`. Named arguments allow us to provide values in
    any order.


    \### Example 10: Calling Function with Named Arguments


    \`\`\`kotlin


    // Calling the displayOrder function with named arguments


    displayOrder(quantity = 3, priority = "High", item = "Laptop")


    \`\`\`


    Using named arguments, we can provide values for parameters out of order. In this
    example, the function call is clear and readable despite the different order.


    \## Function Overloading


    Function overloading in Kotlin allows you to define multiple functions with the
    same name but different parameter lists. The compiler determines which function
    to call based on the provided arguments.


    \### Example 11: Function Overloading


    \`\`\`kotlin


    fun greet(person: String) {


    println("Hello, $person!")


    }


    fun greet(person: String, age: Int) {


    println("Hello, $person! You are $age years old.")


    }


    \`\`\`


    In this example, we have two \`greet\` functions—one with a single parameter and
    another with two parameters. The function with the appropriate parameter list
    is called based on the context.


    \### Example 12: Calling Overloaded Functions


    \`\`\`kotlin


    // Calling the overloaded greet functions


    greet("Alice")


    greet("Bob", 30)


    \`\`\`


    Both \`greet\` functions are called with different arguments. The compiler determines
    which version of the function to invoke based on the number and types of arguments.


    \## Extension Functions


    Extension functions in Kotlin allow you to add new functions to existing classes
    without modifying their source code. This provides a powerful mechanism for enhancing
    the functionality of classes.


    \### Example 13: Extension Function


    \`\`\`kotlin


    // Extending the String class with a new function


    fun String.addExclamation(): String {


    return "$this!"


    }


    \`\`\`


    Here, we define an extension function named \`addExclamation\` for the \`String\`
    class. It appends an exclamation mark to the given string.


    \### Example 14: Using Extension Function


    \`\`\`kotlin


    // Using the extension function


    val greeting = "Welcome"


    val excitedGreeting = greeting.addExclamation()


    println(excitedGreeting)


    \`\`\`


    The \`addExclamation\` extension function is used to modify the string "Welcome,"
    resulting in the output "Welcome!"


    \## Higher-Order Functions


    Kotlin supports higher-order functions, allowing you to pass functions as parameters
    or return them from other functions. This functional programming feature enhances
    code readability and reusability.


    \### Example 15: Higher-Order Function


    \`\`\`kotlin


    // Higher-order function that takes a function as a parameter


    fun operateOnNumbers(a: Int, b: Int, operation: (Int, Int) -> Int): Int {


    return operation(a, b)


    }


    // Example operation function to be passed


    fun add(x: Int, y: Int): Int {


    return x + y


    }


    \`\`\`


    In this example, \`operateOnNumbers\` is a higher-order function that takes two
    numbers and a function as parameters. The provided function performs the desired
    operation.


    \### Example 16: Using Higher-Order Function


    \`\`\`kotlin


    // Using the higher-order function with the add function


    val result = operateOnNumbers(5, 3, ::add)


    println("Result of addition: $result")


    \`\`\`


    Here, we call \`operateOnNumbers\` with the \`add\` function as a parameter. The
    result is the sum of 5 and 3.


    \## Lambda Expressions


    Lambda expressions in Kotlin are concise ways to express anonymous functions.
    They are especially useful when working with higher-order functions.


    \### Example


    17: Lambda Expression


    \`\`\`kotlin


    // Using a lambda expression in a higher-order function


    val multiply: (Int, Int) -> Int = { x, y -> x \* y }


    // Using the higher-order function with the lambda expression


    val product = operateOnNumbers(4, 6, multiply)


    println("Result of multiplication: $product")


    \`\`\`


    In this example, \`multiply\` is a lambda expression representing a function that
    multiplies two numbers. We then use this lambda expression in the \`operateOnNumbers\`
    higher-order function.


    \## Inline Functions


    The \`inline\` modifier in Kotlin allows you to request that the compiler insert
    the body of a function directly into the calling code. This can improve performance
    by avoiding the overhead of function calls.


    \### Example 18: Inline Function


    \`\`\`kotlin'
