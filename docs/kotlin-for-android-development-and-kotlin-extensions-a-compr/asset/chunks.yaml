    fun divide(a: Int, b: Int): Int {


    return try {


    a / b


    } catch (e: ArithmeticException) {


    println("Error: ${e.message}")


    \-1


    }


    }


    val result = divide(10, 0)


    println("Result of division: $result")


    \`\`\`


    The \`divide\` function attempts to perform a division


    and catches any \`ArithmeticException\`. In case of an error, it prints a message
    and returns -1.


    \## Collections in Kotlin: Lists, Maps, and Sets


    Collections are containers that hold multiple items. Kotlin provides a rich set
    of collection types, including lists, maps, and sets.


    \### Example 13: Working with Lists


    \`\`\`kotlin


    val fruits = listOf("Apple", "Banana", "Orange")


    // Accessing elements


    val firstFruit = fruits\[0\]


    // Iterating through the list


    for (fruit in fruits) {


    println(fruit)


    }


    \`\`\`


    Here, \`fruits\` is a list of strings. We access the first element using index
    notation and then iterate through the list, printing each fruit.


    \### Example 14: Maps and Sets


