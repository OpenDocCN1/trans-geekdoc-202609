    \ `usaCapital` retrieves the capital of the USA, and `unknownCapital` fetches\
    \ the capital for Italy (which is `null`).\n\n### Example 7: Modifying a Map\n\
    \n```kotlin\n// Modifying the map\nval updatedCapitals = capitals.toMutableMap()\n\
    updatedCapitals[\"Germany\"] = \"Berlin\"\nupdatedCapitals.remove(\"France\")\n\
    ```\n\nTo modify a map, convert it to a mutable map (`toMutableMap()`) and use\
