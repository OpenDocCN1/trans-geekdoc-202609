    # \# Chapter 6: Object-Oriented Programming with Kotlin


    Welcome to the exciting world of Object-Oriented Programming (OOP) with Kotlin!
    In this chapter, we''ll unravel the principles and practices that make Kotlin
    a powerful language for building robust and scalable applications. Object-Oriented
    Programming revolves around the concept of objects, which are instances of classes,
    and Kotlin seamlessly integrates these concepts into its syntax. We''ll explore
    classes, objects, inheritance, polymorphism, encapsulation, and more. Let''s dive
    into the fundamentals of OOP and how they manifest in Kotlin.


    \## Classes and Objects: The Building Blocks of OOP


    At the core of Object-Oriented Programming are classes and objects. A class is
    a blueprint or template that defines the structure and behavior of objects. Objects,
    on the other hand, are instances of classes, representing real-world entities.
    Kotlin simplifies the creation of classes and objects, making it an ideal language
    for OOP.


    \### Example 1: Creating a Simple Class


    \`\`\`kotlin


    // Defining a simple class in Kotlin


    class Car {


    var brand: String = ""


    var model: String = ""


    var year: Int = 0


    // Method to display information about the car


    fun displayInfo() {


    println("Car: $brand $model, Year: $year")


    }


    }


    \`\`\`


    In this example, we define a \`Car\` class with properties (\`brand\`, \`model\`,
    \`year\`) and a method (\`displayInfo\`) to showcase information about the car.


    \### Example 2: Creating Objects from a Class


    \`\`\`kotlin


    // Creating objects of the Car class


    val car1 = Car()


    car1.brand = "Toyota"


    car1.model = "Camry"


    car1.year = 2022


    val car2 = Car()


    car2.brand = "Honda"


    car2.model = "Civic"


    car2.year = 2021


    // Calling the displayInfo method on each car object


    car1.displayInfo()


    car2.displayInfo()


    \`\`\`


    Here, we create two objects (\`car1\` and \`car2\`) from the \`Car\` class and
    set their properties. The \`displayInfo\` method is then called on each object
    to showcase their information.


    \## Constructors: Initializing Objects with Ease


    Constructors are special methods in a class that are responsible for initializing
    the properties of an object when it is created. Kotlin offers concise and flexible
    ways to define constructors.


    \### Example 3: Primary Constructor


    \`\`\`kotlin


    // Class with a primary constructor


    class Book(val title: String, val author: String, val year: Int) {


    // Method to display information about the book


    fun displayInfo() {


    println("Book: $title by $author, Year: $year")


    }


    }


    \`\`\`


    In this example, we define a \`Book\` class with a primary constructor. The properties
    (\`title\`, \`author\`, \`year\`) are declared directly in the constructor header.


    \### Example 4: Creating Objects with Primary Constructor


    \`\`\`kotlin


    // Creating objects using the primary constructor


    val book1 = Book("The Alchemist", "Paulo Coelho", 1988)


    val book2 = Book("To Kill a Mockingbird", "Harper Lee", 1960)


    // Calling the displayInfo method on each book object


    book1.displayInfo()


    book2.displayInfo()


    \`\`\`


    Objects (\`book1\` and \`book2\`) are created using the primary constructor, providing
    values for the properties. The \`displayInfo\` method is then called to showcase
    information about each book.


