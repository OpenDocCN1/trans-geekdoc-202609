    \ 达到最大三次。这保证了至少会进行一次连接尝试。\n\n## 跳出和继续循环\n\n在某些情况下，你可能想要提前退出循环或跳到下一次迭代。Kotlin 提供了\
    \ `break` 和 `continue` 语句来处理这些场景。\n\n### 示例 6：`break` 语句\n\n`break` 语句会终止它所在的的最内层循环。\n\
    \n```kotlin\nfor (i in 1..10) {\n    if (i == 5) {\n        println(\"Breaking\
