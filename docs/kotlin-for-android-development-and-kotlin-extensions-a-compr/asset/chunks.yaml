    \ to promote code reuse and flexibility.\n3. **Avoid Deep Inheritance Hierarchies**:\
    \ Keep your class hierarchies shallow to prevent complexity and improve readability.\n\
    4. **Apply the Liskov Substitution Principle**: Subtypes should be substitutable\
