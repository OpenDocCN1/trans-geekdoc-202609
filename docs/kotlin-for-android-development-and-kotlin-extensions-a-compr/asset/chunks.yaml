    \n## Kotlin 中的运算符\n\n运算符是对变量和值执行操作的符号。Kotlin 继承了 Java 运算符，但对其进行了增强以实现更具表达且简洁的语法。\n\
    \n### 示例 4：数学运算符\n\n```kotlin\nval x = 10\nval y = 5\nval sum = x + y\nval difference\
    \ = x - y\nval product = x * y\nval quotient = x / y\nval remainder = x % y\n\
    ```\n\n在此代码段中，对变量 `x` 和 `y` 执行了基础算术操作。每个操作的结果存储在一个新变量中，展示了 Kotlin 的简单易读性。\n\n\
    ### 示例 5：字符串拼接\n\nKotlin 让字符串操作变得直观。\n\n```kotlin\nval firstName = \"John\"\n\
