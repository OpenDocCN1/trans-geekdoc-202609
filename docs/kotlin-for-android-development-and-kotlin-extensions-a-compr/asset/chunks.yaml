    \ 1 迭代到 10，但当 `i` 达到 5 时，触发了 `break` 语句，循环终止。\n\n### 示例 7：`continue` 语句\n\n`continue`\
    \ 语句会跳过循环中当前迭代的剩余代码，并移动到下一次迭代。\n\n```kotlin\nfor (i in 1..5) {\n    if (i == 3)\
