  \ this.matches(emailRegex.toRegex())\n}\n\nfun String.isPositiveInteger(): Boolean\
  \ {\n    return try {\n        this.toInt() > 0\n    } catch (e: NumberFormatException)\
  \ {\n        false\n    }\n}\n```\n\n现在，你可以无缝地验证用户输入：\n\n```kotlin\nval userEmail\
  \ = \"john.doe@example.com\"\nval isEmailValid = userEmail.isValidEmail() // 结果为\
  \ true\n\nval userAge = \"25\"\nval isAgeValid = userAge.isPositiveInteger() //\
  \ 结果为 true\n```\n\n这些扩展简化了输入验证，使代码更整、更容易维护。\n\n### 金融应用中的数据处理：\n\n假设你正在构建一个需要对货币值进行计算的金融应用。\n\
  \n```kotlin\ndata class Money(val amount: Double)\nfun Money.formatAsCurrency():\
  \ String {\n    return \"$${\"%.2f\".format(amount)}\"\n}\n\nfun List<Money>.totalAmount():\
  \ Money {\n```\n\n\n\n\n\n```kotlin\nval total = this.map { it.amount }.sum()\n\n\
  return Money(total)\n\n}\n```\n\n现在，你可以轻松地格式化并计算货币值列表的总金额：\n\n```kotlin\nval expenses\
