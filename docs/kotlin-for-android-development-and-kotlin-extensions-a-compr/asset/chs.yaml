  此扩展简化了与偶数检查相关的逻辑。\n\n## 实际应用示例：\n\n让我们在实际场景中使用这些扩展，展示它们如何显著改进你的代码。\n\n### 用户输入验证：\n\
  \n考虑一个你为注册表单收集用户输入的场景。你想确保输入的邮箱格式有效，且年龄是正整数。\n\n```kotlin\nfun String.isValidEmail():\
