  md: '# 4.4.4 SMART HEALTHCARE


    Healthcare has grown rapidly with the integration of artificial intelligence and
    internet of things (IoT). The increasing number of chronic diseases have led researchers
    to use the latest technologies for healthcare for the diagnosis and treatment
    to control the patient''s critical condition. Patients can be supervised anywhere
    through various devices accessed through doctor''s workstation, and AI makes the
    machines intelligent enough to sound the alarm for emergency depending on parameters,
    under supervision and by means of various sensors. In smart healthcare, a patient''s
    affected organ is tested for every kind of threat automatically with optimal diagnosis
    that might have been missed in a doctor''s examination [54, 55].


    # 4.4.5 SMART AGRICULTURE


    Agriculture has been made smart with the use of AI and IoT. Wireless sensor nodes
    (WSNs) have found a huge application in smart agriculture. The network of WSNs
    is energized with AI over intelligent decisions on the circumstances. AI has provided
    the farmers with pest control at a very early stage to prevent damage to crops.
    The irrigation system can be only controlled remotely but also via sensor readings.
    Every robots can be used to seed and reap crops. Thus, in smart agriculture allows
    the efficient management of all agricultural resources [56, 57].


    # 4.5 AI FOR CYBER SCIENCE


    Some of the famous attacks are denial of service (DoS), distributed denial of
    service (DDoS), phishing attack, ping of death, ransomwares, man-in-the-middle
    attack, SQL injection, malware, etc. Some very huge cyber attacks occurred that
    directly affected the privacy and finances of the public as well as companies
    [58]. Previously, only malware could be detected because the developer had its
    identity and could be easily identified through signature detection, but unknown
    threats might not be detected, leading the way to the evolution of anomaly detection
    [59]. AI-based solutions have boosted the security industry with a variety of
    effect solutions. Some works proposed the use of AI in intelligent detection and
    prevention through artificial police agents in a decentralized fashion, creating
    an artificial immune system like the human body [60]. Some researchers have used
    ML-based IDS, IPS, firewalls, etc. for efficient network security against zero-day
    exploit. AI also proposes the cloud-based security solutions [61, 62]. Thus, the
    introduction of AI in cyber science, the critical infrastructure is more secure
    than with older security solutions.


