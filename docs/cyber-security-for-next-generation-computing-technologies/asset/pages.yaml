    hostile insiders, malicious insiders, non-malicious insiders, and nature. Risks
    posed by hostile agents may be to compromise, disrupt, or harm particular systems.
    Threats from nature include factors such as sunlight, weather, animals, or insects.
    These threats might cause harm or interfere with building systems [9]. Typically,
    these harmful threats come from one of the following categories [21]:


    +   - Sole activists

    - Activist groups

    - Competitors

    - Organized crime

    - Terrorists

    - Proxy threat attack agents with nation-state support

    - Nation-states


