    # 3.5.2 K-NEAREST NEIGHBOR


    The K-nearest neighbor (K-NN) is an algorithm for unsupervised learning, and it
    relies on a distance function to evaluate the dissimilarity between two data instances.
    Compared to other classifiers, K-NN requires time for training. The assumption
    underlying K-NN is that similar data points will be closer to each other in space,
    while dissimilar ones will be further away. K-NN used to have two different categories
    that can be utilized for anonymity identification. The K neighbor data point and
    density of each data instance are used to calculate scores [43]. The selection
    of the kth data point has a high effect on the classifier''s overall performance.
    K-NN is quite helpful in data analysis, which estimates distance function between
    data points. Moreover, this technique is computationally expensive because it
    needs a high level of storage capacity. The most common way to calculate the difference
    between two data points is by using Euclidean distance d(m, n) [44].


