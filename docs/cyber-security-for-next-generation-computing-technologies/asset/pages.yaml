    machine-learning model. The model can then use these features to learn patterns
    of attack and flag suspicious behavior that might indicate a new or unknown threat.


    In summary, IoCs and behavior analysis with UEBA are important tools for detecting
    and responding to cyber attacks. By incorporating IoCs into UEBA algorithms, security
    professionals can gain a more complete picture of an attack and its impact on
