  md: '# 8 Signature-Based Intrusion Detection System for IoT


    Bakhtawaar Nawaal, Usman Haider, Inam Ullah Khan, and Muhammad Fayaz


    # 8.1 INTRODUCTION


    The Internet of Things (IoT) is a network of devices that communicates over the
    Internet and distributes information among themselves and the external environment.
    The term IoT was first used by Kevin Ashton in 1998 when he mentioned that the
    IoT has the potential to change the entire world. It has improved people''s lifestyle
    by adding intelligent systems to our environments. Evolution in IoT has added
    billions of IoT devices to the Internet. Its applications have progressed in diverse
    streams including fitness, health, automation, and smart societies [1]. With IoT
    technologies, cities have become more efficient. Traffic is managed smartly using
    sensors. Smart parking has saved time and fuel for drivers by providing data on
    available slots. Smart waste management, street lights, water supply, environment,
    etc. have effectively enhanced the lifestyle of citizens. Smart farming has helped
    farmers in managing the requirements of water, fertilizer and manure for plants.
    The quality of human life has improved with effective healthcare systems that
    monitor the patient''s health and track changes [2].


    Increasing demand for devices has provided space for various attacks from worms,
    viruses, Trojan horses, malware, etc. [3]. With time, devices have become vulnerable
    to security attacks. Commonly encountered attack includes DDoS and DDoS. A denial-of-service
    (DoS) attack tends to shut down network resources for the host [4]. In a distributed
    denial-of-service (DDoS) attack, the attacker utilizes resources from multiple
    locations to affect the network. According to a Cisco white paper, DDoS attacks
    will reach total 15 million by 2023, compared to 7 million in 2018 [5]. IoT bots
    have posed a great danger to IoT devices. The most common examples of botnets
    include Linux/Hydra, PyBot, Linnartz, Spike (Dofook), BASHLIFE, Mirai, etc. [6].
    Other types of attacks include brute force attacks, rolling code attacks, Sybil
    attacks, and buffer overflow attacks. All Sybil attacks use fabricated devices
    to hide the performance of network devices and createので junctions [7]. The Blueborne
    virus attacks the device via Bluetooth and involves no human interaction [8].
    List of attacks keeps on increasing with the addition of devices on Internet.


    DOI: 10.1201/9781030040361-8'
