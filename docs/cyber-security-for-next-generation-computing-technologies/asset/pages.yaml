  md: '# Security and Intelligent Management


    # 2.9.3 AUTOMOTIVE CYBER SECURITY ASSURANCE


    Assurance “grounds for justified confidence claim that has been or will be achieved,”
    according to ISO/IEC/IEEE 15025–1 [56]. Also, this is accomplished by using an
    assurance case, which consists of methodical reasoning, its supporting data, and
    its presumptions. ISO/IEC/IEEE 15025 provides a mathematical specification for
    the structure of an assurance case, yielding graphical notations like GSN [57].
    Both strategies face the difficulty of having to take into account how cyber security
    is evolving, also the completeness and sufficiency of cyber security must be demonstrated
    by evidence. Completeness demonstrates that all risks are taken into account based
    on the state of the art, and sufficiency demonstrates that the risks are handled
    is adequate by proving that a methodical approach was followed throughout the
    life cycle. Evidence for sufficiency must demonstrate that risks are adequately
    managed. The common criteria and testing recommendations from NIST [58] can be
    used to meet the assurance requirements for this. Suggested methods begin with
    document reviews and include methods for ongoing testing. In the evaluation of
    systems that are already in use, determining when evidence is sufficient for cyber
    security assurance is one challenge [31].


    # 2.9.4 CSMS FRAMEWORK


    There is a need for a comprehensive framework that integrates development and
    operation that covers the entire life span, as discussed in previous sections.
    Therefore, it is suggested that a DevOps strategy can be used to organize the
    development, production, and operation processes. The suggested framework is divided
    into two main sections and is based on earlier work by Dobaj et al. [29]–30].
    A fifth-generation vehicle E/E architecture makes it possible to connect vehicle
    systems to cloud systems for ongoing monitoring and offers the technical basis
    for the construction of a modular system architecture. That is easily updated
    and reconfiguration [41].


    A DevOps life can be built up to create a continuous improvement cycle. A key
    component of this life cycle is represented by the monitoring and analysis processes,
    the groundwork for identifying errors and security issues during both development
    and operation [34]. The suggested DevOps framework is compatible with conventional
    system development procedures, as shown by the V-Model, however the same three
    steps make up both the development and the system improvement cycles: planning,
    implementation, verification and validation (V&V). Improvement cycles are automatically
    initiated by monitor and analyze processes, whenever a failure or security incident
    is recognized either in the V&V phase or during cycle [37]. Information security
    management is used in the subsequent release phase to provide a mechanism for
    guaranteeing system integrity. During the distributed software deployment process,
    each vehicle independently ensures security in the succeeding prevent phase. Local
    analysis of anomalies is followed by transmission to an outside system [6].'
