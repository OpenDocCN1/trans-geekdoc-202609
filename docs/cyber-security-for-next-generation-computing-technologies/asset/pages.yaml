    # 1.3.3 WEB APPLICATION ATTACKS


    Web applications constitute a substantial percentage of a company''s digital attack
    surface that is exposed to the public. The following vulnerabilities are among
    the most prevalent and damaging to web applications:


    +   - SQL Injection (SQLi): SQL (structured query language) is a language used
    to interact with databases; it mixes data and commands, which are often separated
    by single or double quotes. In a SQL injection attack, the attacker provides data
    for use in a SQL query that has been tampered with on purpose so that it is regarded
    as a command and the attack may be conducted against the database [27].n- Remote
    Code Execution (RCE): An attacker can take control of the host system where a
    vulnerable program is installed by exploiting a vulnerability known as remote
    code execution (RCE). For instance, a buffer overflow might allow an attacker
    to carry out arbitrary injections [28].n- Cross-Site Scripting (XSS): XSS is a
    form of cross-site scripting that takes advantage of the fact that HTML web pages
    allow scripts alongside the data defining the page structure and content. Malicious
    scripts are inserted into a website using XSS attacks if the website has flaws
    in its injection, access control, or other areas [29]. Attackers can use these
    scripts to steal information (passwords, credit card numbers, etc.) or run malicious
    code time a person visits the website.


    # 1.3.4 SUPPLY CHAIN ATTACKS


    Supply chain attacks exploit the relationships between an organization and external
    actors. Some of the ways an attacker can exploit these trust relationships are
    follows:


    +   - Third-Party Access: Companies often grant access to their IT environments
    and systems to vendors, suppliers, and other parties [30]. If an attacker gains
    access to the network of a trusted partner, they can exploit the partner''s legitimate
    access to a company''s systems.

    - Trustworthy Third-Party Software: Every business nowadays relies on and allows
    the use of software developed by another company. To get access to sensitive data
    and critical systems, an attacker must just insert malicious code into third-party
    software or an update to that program, as was the case with SolarWinds, and the
    code will be trusted by the organization''s environment [31].n- Third-Party Code
    and Libraries: Virtually all modern projects make use of open-source code and
    libraries. This external code may include vulnerabilities, such as Log4j, or malicious
    functionality injected by an attacker. If an organization''s apps are built on
    shaky or malicious programming, they might be breached or misused [32].'
