    +   **Unsupervised Learning**: Unsupervised learning is a type of machine learning
    that involves analyzing data without any prior knowledge of the expected outcomes
    or labels. In an intrusion detection system (IDS), unsupervised learning algorithms
    can be used to detect unknown or novel attacks that may not matching patterns
    or signatures [63–65]. In this approach, the IDS identifies anomalies or deviations
    from normal behavior in the network traffic, which may indicate potential security
    threats or malicious activity.


    Common unsupervised learning technique used in IDS is clustering, which involves
    grouping similar data points based on their characteristics. Clustering can be
    used to identify groups of network traffic that are similar in behavior or to
    detect new types of traffic that do not matching patterns [66]. One example of
    a clustering algorithm used in IDS is K-means clustering, which partitions the
    data into K clusters based on the distance between data points.

    Another unsupervised learning technique used in IDS is association rule mining,
    which involves discovering interesting relationships or patterns in the data.
    Association rule mining can be used to identify sequences of events or activities
    that are associated with malicious behavior [67]. For example, if an attacker
    is attempting to exfiltrate data from a system, association rule mining may detect
    a pattern of high outbound traffic to an unfamiliar destination.

    Component analysis (PCA) is another unsupervised learning technique that can be
    used in IDS. PCA involves reducing the dimensionality of the data by identifying
    the most important features or variables that explain the majority of the variance
    in the data [68]. This can be useful for identifying patterns or anomalies in
    the data that may not be immediately apparent in the original data. For example,
    PCA can be used to identify unusual patterns in network traffic, such as unusual
    data transfer rates or packet sizes.

    One challenge of unsupervised learning in IDS is the issue of false positives,
    which can occur when the algorithm identifies normal behavior as anomalous or
    malicious [69]. This can be especially problematic in unsupervised learning, where
    there is no prior knowledge of the expected outcomes or labels. To address this
    issue, unsupervised learning algorithms often require a human expert to review
    and validate the results.

    Another challenge of unsupervised learning in IDS is the computational complexity
    of the algorithms, which can be resource intensive and may require specialized
    hardware or software [70]. This can make unsupervised learning approaches less
    practical for real-time or high-performance IDS.

    In conclusion, unsupervised learning algorithms can be a valuable tool in an intrusion
    detection system for detecting unknown or novel attacks. Clustering, association
    rule mining, and PCA are common unsupervised learning techniques used in IDS [71].
    However, the issue of false positives and computational complexity should be considered
    when selecting'
