    +   Multifactor Authentication (MFA): MFA is the initial element of access control
    where users must provide multiple forms of authentication to access edge/fog applications.
    MFA helps not only to verify the users but also to track abnormal activities by
    clearly identifying the threat sources.

    - Cloud Access Security Brokers (CASBs): Edge/fog systems interact with cloud
