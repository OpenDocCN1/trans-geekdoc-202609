  md: '# #10 Cyber Security for Edge/Fog Computing Applications


    Hanane Lamaamai


    # ##10.1 INTRODUCTION


    Edge/fog computing has emerged as a promising solution to overcome centralized
    platform challenges, such as limited bandwidth and high response time, by placing
    the computing resources closer to end users [1]. However, the distributed nature
    of edge/fog computing platforms introduces new challenges to the security of infrastructure
    as well as data protection [2]. The diversity of deployed IoT devices used to
    sense data and transmission technologies produces an inconsistency of standardization,
    increasing the criticality of providing optimal and common security controls and
    services. Existing and emerging attacks edge/fog computing for many reasons, including
    their closeness to end users [3], local data storing and processing, and lack
    of normalized security solutions. The attacks can cause serious damage, such as
