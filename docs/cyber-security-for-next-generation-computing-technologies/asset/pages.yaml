    # ## 11.1 INTRODUCTION


    Smart cities are a novel idea for urban planners, with new programs like the U.S.
    Department of Mobility’s Smart City Challenge encouraging more effective urban
    mobility [1, 2]. To improve operational efficiency, intelligent cities use networked
    technologies to collect real-time data, analyze it, and make preventive and adaptive
    decisions [3]. Intelligent transportation systems (ITS) are generally used to
    describe innovative transportation systems. ITTs are the coordinated use of information
    processing, management, and communications technology in the transportation system.
    Computers, electronics, and sensors are used in the execution of transportation
    operations for traffic management, journey planning, and vehicle control. There
    are many benefits, but enhanced ease, efficacy, and safety are the most important
    ones [4]. An ITS aims to provide better services for drivers and commuters in
    transportation networks [5]. By integrating modern technologies into transportation
    infrastructure and vehicles, an ITS seeks to increase transportation efficiency
    and safety. ITS provides real-time data and information about traffic conditions,
    weather, road conditions, and other factors that influence the transportation
    system in order to assist transport operators and users in making better choices
    [6].


    The ITS movement began in the early 1970s when academics and decision makers looked
    into technology to increase transit efficiency and safety [7]. The cutting-edge
    traffic control and intelligent vehicle systems were developed at the outset of
    the ITS revolution [8]. Several ITS pilot projects emphasizing advanced information
    systems, real-time traffic management, and electronic toll collection were warranted
    in the 1980s in Europe and the United States [9, 10]. All current ITS projects
    need vehicular hoc networks (VANET), an essential component. Nodes (vehicles)
    in the VANET occasionally trade short messages known as beacons. Important information
    about the surroundings and moving vehicles, such as direction, acceleration, speed,
    road conditions, and weather conditions, is stored in the signals. User identity
    protection, interruptions, multi-communication, and considerable heterogeneity
    are just a few of the difficulties associated with wireless one-hop communication
    for vehicle connectivity (depending on whether the'
