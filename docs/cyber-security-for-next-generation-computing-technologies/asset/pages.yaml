    These two types of IDSs are further classified on the bases of their detection
    techniques: anomaly-based detection, signature-based detection, and hybrid-based
    detection.


    # 8.4.1 ANOMALY-BASED IDS FOR IoT


    Anomaly-based IDS senses attacks by detecting unusual behaviors in IoT environments
    [49]. An anomaly signifies abnormal actions in data patterns [50]. The IDS comprises
    a model that describes the normal expression of data. It is then compared with
    the patterns of the current data. If deviations occur, then the attack is detected
    in the environment [51]. Anomaly-based IDS techniques are further classified into
    several approaches. The data mining approach is applied to large data resources
    to extract knowledge from them in the form of patterns that describe the behavior
    of data in the IoT environment [52]. In a statistical approach, the model is created
    by using historical user data to detect any change. Statistical mathematical operations
    are applied in this technique to train datasets to capture anomalies [53].


    # 8.4.2 SIGNATURE-BASED IDS FOR IoT


    A signature-based technique uses patterns and signatures of known malicious codes
    to detect attacks [54]. It uses previous knowledge to detect these attacks. Hence,
    databases of patterns and signatures need to be updated. Writing signatures require
    expertise as new types of attacks are continuously being discovered. For this,
    we need to have enough data for analysis purposes and a good understanding of
    the behavior of signatures [55]. The signature-based technique minimizes false
    alarms detection due to the production of fewer false alarms [56]. However, advancement
    in technology has hindered the efficiency of signature-based IDS as the number
    of signatures would also be increased with technologies such as encrypted data
    channels, NOP generators, and payload encoders [57]. Figure 8.4 explains the concept
    of signature-based IDS.


    ![](img/6cda7de083ea84ec227ad15ed4045807_162_0.png)'
