    # 6.2.2 NETWORK LAYER ATTACKS


    the objective of this layer is to reduce communication latency in transmission,
    but some factors operate on this data. The security attacks in this layer are
    as follows (Figure 6.4):


    +   - Phishing Attack: These attacks can be launched over the application deployed
    over http services. If the ID and password are leaked, this attack can be done
    easily [10].

    - DoS/DDoS Attacks: A DoS attack is caused by flooding the target servers with
    abundant unwanted requests that incapacitate the server from answering. Moreover,
    it disrupts the server to have communication with the genuine devices, and results
    in denial of service. When substrate servers are flooded by using multiple sources,
    this is known as a distributed DoS attack. IoT systems have suitable complexity
    and heterogeneity, but the network layer is prone to distributed DoS attacks.
    Because of the weak configuration of applications and devices, attackers can access
    gateways for launching DDoS attacks in the servers [10]

    - Data Transit Attack: IoT is all about data exchange and the exchange of valuable
    information that is stored in the either the cloud or local servers, etc. [10].
    This data storage is more vulnerable or highly unsafe unless properly encrypted.
    Adversaries find data to resist more irresistible and impotant. The IoT system''s
    network layer, data exchange between actuators, sensors, cloud, etc. happens by
    means of several communication techniques, which makes it more susceptible to
    data breaches, as illustrated in Figure 6.4.

    - Routing Attack: A routing attack is the redirection of communication channels
    at the time of data transmission. One of the well-known kinds of routing attacks
    is the sinkhole attack, in which artificial paths tempt the feasible communication
    channel. Another kind of routing attack is the wormhole attack, in which a fast
    transmission path is provided between two devices. An adversary can detour security
    protocols by the creation of a wormhole between two devices. The wormhole can
    become a severe attack to an IoT system if combined with any other technique [10].


