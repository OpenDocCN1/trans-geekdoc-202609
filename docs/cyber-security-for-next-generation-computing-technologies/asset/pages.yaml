    support the operators using existing network and communication technologies. According
    to the *Global IoT Forecast Report 2021–30*, active IoT devices totaled 11.3 billion
    at the end of 2021, but this will dramatically increase to 29.4 billion by 2030[6].


    # ### 6.1.1 SECURITY IN THE IoT


    With the huge number of IoT devices to be used in such a vast number of IoT applications
    [6], the communication needs to be secured so that user data is kept private,
    no attacks can occur in the IoT network, and no vulnerabilities are present. But,
