    Ultimately these consequences of cyber attacks have led to the major development
    of intrusion detection system (IDS) and intrusion prevention system (IPS). An
    IDS provides extensive surveillance, which detects unusual or malicious traffic
    entering the network [9]. Three basic genres of IDS are:


    +   1. Signature-based IDS.

    2. Anomaly-based IDS.

    3. Hybrid-based IDS.


    A signature-based IDS consists of existing patterns of malicious codes that are
    utilized in identifying attacks. This IDS is easy to use. An anomaly-based IDS
    compares already created data of normal behavior of packets to detect abnormality
    [10]. A hybrid-based IDS is the union of both of the later types; hence it lowers
    the error rate. It can detect multiple categories of attacks from a variety of
    reckoning environments. An overview of signature-based intrusion detection is
    shown in Figure 8.1.


    Signature-based IDS systems depend on previously defined attacks and are better
    than anomaly-based in certain ways. It is simple and operates online in real time
    [11]. It observes certain patterns and events and matches them with signatures


