    # 8.8 LIMITATIONS IN SIGNATURE-BASED INTRUSION DETECTION SYSTEM


    the signature-based technique for IDS is a widely used approach because it usually
    has a low false alarm rate and very efficient results. But this technique has
    limitations that need to be addressed with proper solutions. Signature-based IDS
    can only identify the threats that attacks are saved; thus it fails to detect
    anything absent from the database [88, 90], and zero-day-exploit remains unattended
    [89]. Sometimes it causes a network packet, and it has a huge false alarm rate
    when operated in a large-scale network environment [91]. Each packet in signature-based
    approach needs to be match examined, in the case that large traffic anomalies
    occur. In most cases, the following scenario leads to packet drop when the IDS
    cannot handle the traffic, leaving the system open to the chance of missing potential
    threats [92]. Thus these limitations are termed design or implementation flaws
    of the signature-based technique [93].


    # 8.9 DISCUSSION AND FUTURE DIRECTIONS


    Advances in technology and the Internet of Things have caused great vulnerability
    to the security of data [94, 95]. Signature-based IDSs are among the widely installed
    IDSs in the commercial sector networks due to their pattern-based anomaly detection
    capability. These systems are improving every day to meet the complexity of new
    variant threats. A detailed survey of the signature-based IDS, along with various
    implementation techniques, was discussed in this chapter. Future work can be performed
    by implementing signature-IDS with specific techniques that make threat prone
    prevent. Software such as SNORT, WINPCAP, etc. can be focused on real-time detection
    and efficiency [96]. Markov DL also helps in packet filtering in IDS [97]. Furthermore,
    various DL algorithms can be used to reduce the computational complexity of the
    IDS as there is huge scope for this, and enormous work can be done in this field.


    # 8.10 CONCLUSION


    Security has no longer a choice in IT infrastructure; it is an utter commotion
    to be focused on. The mushroom growth of IoT devices has posed the challenge of
    security in the IoT environment. Signature-based IDS is an excellent approach
    to counter security threats. Many solutions using signature-based detection techniques
    have been suggested by different researchers using different methodologies. The
    pattern matching approach has been the identification of this type of detection,
    but it has some limitations leading to false negative conditions and potential
    danger. The machine learning and deep learning algorithm counters the limitation
    of signaturebased detection by means of training over various datasets, decreasing
    the false detection rate and improving accuracy. This work offers a detailed survey
    of a variety of signature-based IDSs and the techniques deployed with them different
    researchers.'
