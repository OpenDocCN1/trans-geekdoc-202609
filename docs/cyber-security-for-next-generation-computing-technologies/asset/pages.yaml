  md: '# # Cyber Security

    Future Trends and Solutions


    Syed Imamul Ansarullah, Mudasir Manzoor Kirmani, Ziema Mushtaq, and Gowhar Mohi
    ud din Dar


    # ## 1.1 INTRODUCTION


    Before the beginning of 1970, Trojan horses, worms, spyware, and malware were
    not even part of the mainstream lexicon of information technology. Robert Thomas,
    a BBN Technologies researcher in Cambridge, created the first computer “worm”
    and named that “Creeper” [1]. By jumping between systems, the Creeper disseminated
    infection; to combat this virus, Ray Tomlinson created the Reaper, the first antivirus
    application that would seek out and destroy Creeper [2]. In 1988, Robert Morris
    desired to determine the magnitude of the Internet and to accomplish this, he
    developed software that accessed UNIX terminals, traversed networks, and cloned
    itself. The Morris worm was so destructive that it rendered computers unusable
    by substantially reducing their speed. From that moment on, viruses became more
    lethal, pervasive, and difficult to manage. With it came the advent of cyber security.


    The collective set of technology, methods, and procedures that businesses utilize
    to safeguard their computing environments from harm and unauthorized data access
    caused by online or nefarious insiders is known as cyber security [4]. Organizations
    typically have a structure and system in place for dealing with successful cyber
    attacks. An effective framework can aid in threat detection and identification,
    network and system protection, and recovery in the event that an attack is successful.
    Cybersecurity is included in all systems that are vulnerable to threats and attacks
    to stop things like identity theft, cyber stalking, data loss, loss of sensitive
    data, and extortion attempts [5]. Sensitive information about themselves as well
    as their clients is held by critical infrastructures, including hospitals, financial
    services firms, power plants, etc. To operate without interruption, cyber researchers
    need inform people about the significance of cyber security. Since the introduction
    of the first mainframes, the CIA (confidentiality, integrity, and availability)
    triangle has de facto industry standard for computer security [6]. Figure 1.1
    shows the CIA triad in cybersecurity.


    +   - Confidentiality: Maintaining confidentiality requires divulging information
    to unauthorized parties. It involves making an effort to safeguard the privacy
    and anonymity of authorized parties engaged in data sharing'
  merge: -1
  img_proc: true
