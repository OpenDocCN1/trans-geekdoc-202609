    # 11.10.2.1 Financial Gain


    Financial gain is one of the most common motivations behind cyber threats [163].
    Cyber criminals can use various tactics to gain access to financial information
    or funds, including phishing schemes, malware, and ransomware attack. Phishing
    schemes sending phony emails that seem to be from a trustworthy source, like a
    bank or credit card service trick people into revealing their financial information.
    Malware is a software class that harms or interferes with computers and can be
    used to steal information or financial data. Malware, known as ransomware, encrypts
    a victim''s computer or requires payment to unlock them [120]. Cyber criminals
    also use tactics such as identity theft, credit card fraud, and bank fraud to
    gain access to financial information or funds. These tactics may involve stealing
    someone''s personal information, using it to operate fraudulent accounts or make
    unauthorized purchases, or transferring funds from a victim’s'
