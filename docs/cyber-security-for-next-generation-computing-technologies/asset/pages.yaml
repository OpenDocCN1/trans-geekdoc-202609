  md: 'Cyber Security


    # 1.3.5 DoS Attacks


    Denials of service (DoS) attacks are designed to disrupt the availability of a
    service. Common DoS threats include the following:


    +   - Distributed Denial-of-Service (DoS) Attacks: DDoS attacks include several
    compromised PCs or cloud-based resources simultaneously bombarding a service with
    a flood of spam requests. Because of the inherent limitations of any given program,
    hosting environment, and associated network connections, it is possible for an
    attacker to overload the system and prevent genuine users from accessing the service
    [33].

    - Ransom Denial (RDoS) Attacks: In an RDoS assault, the attacker requests payment
    in exchange for promising not to initiate a DDoS attack against the targeted organization
    or for ending a current DDoS attack. These assaults can be independent campaigns
    in and of themselves, or they could be included in ransomware operations to get
    the attacker more power in demanding payment from the victim [34].

    - Vulnerability Exploitation: Buffer overflow vulnerabilities and other faults
    in applications may be used to bring down the targeted program. A denial of service
    (DoS) attack might be conducted against the vulnerable service if an attacker
    has successfully exploited the flaws [35].


    # 1.3.6 MitM Attacks


    Man-in-the-middle (MitM) attacks are primarily concerned with intercepting communications.
    Threats posed by MitM include the following:


    +   - Man-in-the-Middle (MitM) Attack: An attacker can perform a man-in-the-middle
    (MitM) attack by snooping on communications between a sender and receiver. An
    attacker might possibly read and change intercepted traffic if it is not protected
    by encryption and digital signatures [36].

    - Man-in-the-Browser (MitB) Attack: An example of a browser-based assault is the
    man-in-the-browser (MitB) attack, in which malicious code is injected into the
    browser by means of a known vulnerability. As a result, an adversary can see sensitive
    information before it is presented to the user or sent to the server, allowing
    them to make changes or additions [37].


    The impact of various forms of cyber security risks is described in Figure 1.2.
    Cyber criminals often launch a wide variety of assaults on their targets in the
    hopes that at least one succeeds in bypassing security measures. Cyber security
    training and awareness, risk assessments, the principle of least privilege, password
    storage and procedures, periodic security reviews, data encryption at rest and
    in transit, etc. all important measures to prevent a cyber security breach.'
