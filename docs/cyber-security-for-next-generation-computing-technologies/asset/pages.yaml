  md: '# 3.11.7 DESIGNING PRACTICAL MODELS


    The formation of detection systems (i.e., IDS) that have real-time requirements
    are essential in attack detection, so they do not provide an interpretable basis
    for their decisions. The rise of network intrusion has prompted researchers to
    explore innovative approaches for network detection. As the field of ML and DL
    continue to evolve, online learning has emerged as a promising direction for the
    future. Online learning allows for the continuous updating of models in real time,
    making it ideal for dynamic environments like network IDS.


    By leveraging online learning, models can be updated as new data becomes available,
    increasing their accuracy and efficiency in detecting potential threats. This
    approach eliminates the need for retraining models from scratch every time new
    data is introduced, saving time and resources while improving performance. In
    a nutshell, the use of online learning, coupled with transfer learning, represents
    a powerful combination for enhancing the capabilities of network IDS. As the volume
    and complexity of data continue to grow, the adoption of these techniques will
    become increasingly important for safeguarding network infrastructure against
    potential threats.


    # 3.12 CONCLUSION


    Cyber security is a growing concern worldwide, and conventional security systems
    are inadequate in detecting and preventing unseen attacks. ML and DL techniques
    have emerged as a promising solution in enhancing security measures. The intersection
    between ML, DL, and cyber security has gained significant interest in both academia
    and industry, resulting in a significant increase in publications in the last
    decade. This chapter presents the basics of cyber security. ML, DL and provides
    a detailed survey of the ML and DL models by bridging the gap between the two
    fields in cyber security. Also, novel datasets are discussed. Furthermore, this
    chapter covers the importance of using ML- and DL-aided techniques to secure networks
    more accurately and also acknowledges the publication trend of past decades and
    future trends for the coming five years in cyber security.


