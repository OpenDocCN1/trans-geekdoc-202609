    # 10.5 CYBER MEASURES AND BEST PRACTICES FOR EDGE/FOG COMPUTING


    # 10.5.1 PROACTIVE CYBER SECURITY STRATEGY


    Proactive cyber security strategies are crucial for protecting edge/fog computing
    systems from cyber attacks [10]. These strategies cover regulations and standards,
    Auditing, employee training, and data recovery, as presented in Figure 10.2 and
    explained next.


    +   - Regular Security Audits: Securing edge/fog systems requires continuous assessment
    and audit. This helps identify vulnerabilities, standards violations, and emerging
    threats and remediate them through threat agents output. A set of techniques can
    be used to apply this assessment and auditing, such as penetration testing, threat
    analysis, patch remediation, certification verification, and compliance with regulations
    and standards such as ISO 27001, HIPAA, GDPR, etc. [11].


    +   - Employee Training: Some threats can be caused by insiders due to a lack
    of knowledge. Training employees is an important element of any cyber security
    strategy. Deploying employees with high and updated expertise reduces the probability
    that a vulnerability can be committed when designing, implementing, or configuring
    a system.


    +   - Use of Advanced Security Technologies: As sensitive entities, edge/fog computing
    systems need advanced protection and security depth, which should include multilayer
    security controls such as firewalls, intrusion detection and prevention systems,
    and security information and event management (SIEM) systems. Also, deploying
    new AI and machine learning technologies detect real-time attacks with fast response
    time [12].'
