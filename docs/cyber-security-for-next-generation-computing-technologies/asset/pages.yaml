  md: '# Cyber Attacks Against Intelligent Transportation Systems


    # 11.8.4 WANNACRY RANSOMWARE ATTACK ON UK’S NATIONAL HEALTH SERVICE (2017)


    The 2017 NHS (National Health Service) WannaCry ransomware attack had a significant
    impact on logistics and transportation services though it wasn''t significantly
    a transportation system [133]. The following happened: The WannaCry ransomware
    assault affected over 200,000 computers in May 2017, including NHS computers.
    The attack encrypted the data on the impacted computers, and a demand was made
    in exchange for the decryption key. The attack caused significant disruption to
    or shut down NHS computer systems, including those for patient data and appointment
    scheduling. This led to the cancellation of appointments and surgeries, and some
    patients were diverted to other hospitals. The attack also affected the transportation
    of medical supplies and equipment, with some deliveries due to disruptions to
    logistics systems.


    Although the perpetrators of the WannaCry attack have not been publicly named,
    North Korea is thought to be the attack''s country of origin. The attack highlighted
    the possible repercussions of cyber attacks on vital infrastructure and the requirement
    for effective cyber security to address and stop these threats. It highlighted
    the interconnectedness of transportation systems with other critical infrastructures
    and the potential impact of attacks on transportation-related logistics and supply
    chains. Following the attack, the NHS invested heavily in upgrading its cyber
    security infrastructure and implemented new policies and procedures to improve
    its overall cyber security posture. The attack also increased cyber security attention
    in other critical infrastructure sectors, including transportation [141, 142].


    # 11.8.5 STUXNET ATTACK ON IRANIAN NUCLEAR FACILITIES (2010)


    In 2010, researchers discovered Stuxnet, a type of malware developed mainly to
    target ICS in nuclear power plants [143]. The virus, intended to attack Iran’s
    centrifuges to enrich uranium, was thought to have been developed by the U.S.
    and Israeli governments. The attack had potential impact on transportation systems
    because disruption to nuclear program could have led to political and economic
    instability in the region, potentially affecting the transportation of goods and
    resources. In addition, the use of cyber attacks as a type of statecraft highlighted
    the potential risks of cyber warfare and the need for robust cyber security measures
    to prevent and respond to these threats. The Stuxnet attack was notable for its
    sophistication and for being one of the first examples of a cyber weapon used
    in a state-sponsored attack. It highlighted the growing importance of cyber security
    in national security and led to increased attention on the potential impacts of
    cyber attacks on critical infrastructure, including transportation systems. Since
    the Stuxnet attack, there have been many other examples of cyber attacks on critical
    infrastructure, including transportation systems. Governments and private sector
    organizations have invested heavily in upgrading their cyber security infrastructure
    to prevent and respond to these threats [144, 145].'
