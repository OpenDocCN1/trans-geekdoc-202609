    techniques are implemented for IDS to detect unknown data packets. IoT networks
    consist of hardware components, which irrelevant data slow down the entire system.
    The accuracy of IoT-based networks is reduced, which directly affects data modeling.
    Flexible mutual information-based feature selection identifies threats using the
    anomaly-based approach in IoT networks [36–38]. In addition, K-NN, ANN, and bagging
    are used to rank the features of unknown data in a network. Working on machine
    learning techniques requires datasets that are helpful in data preprocessing,
    model training, and testing. NSL-KDD and KDD99 are the datasets that are most
    utilized for experimentation [39].


