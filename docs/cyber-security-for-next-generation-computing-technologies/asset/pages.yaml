    #  5.4 DEFENSIVE TECHNIQUES AND ADAPTATIONS


    Defensive techniques and adaptations refer to strategies and measures that individuals
    and organizations can implement to protect themselves against cyber threats. With
    the increasing frequency and sophistication of cyber attacks, it is critical for
    individuals and organizations to adopt proactive measures to safeguard their digital
    assets and data.


    One of the most effective techniques is to regularly update software and applications
    to ensure that known vulnerabilities are patched. This includes operating systems,
    browsers, and other software programs that are used frequently. Another effective
    technique is to use strong and unique passwords for all accounts and to enable
    two-factor authentication wherever possible.


    Additionally, individuals and organizations should implement network segmentation
    and access controls to limit the potential impact of a cyber attack. This involves
    dividing the network into smaller, more manageable segments and limiting access
    to sensitive information only to authorized personnel. Data backups should also
    be performed regularly, with backups stored in secure and separate locations to
    prevent the loss of critical data in the event of a cyber attack.


    #  5.4.1 IoC AND BEHAVIOR ANALYSIS WITH UEBA


    Indicators of compromise (IoCs) are pieces of information that provide evidence
    of a cyber attack, such as IP addresses, domain names, file hashes, and other
    characteristics of malicious activity. IoCs can be used to detect and respond
    to attacks and to prevent future incidents by identifying patterns.


    Behavior analysis is another important tool for cyber security, as it can help
    detect abnormal or suspicious activity that might indicate an attack. User and
    entity behavior analytics (UEBA) is a type of behavior analysis that focuses on
    identifying unusual patterns of behavior among users and other entities in a network.
    UE uses machine learning algorithms to analyze data from a variety of sources,
    including logs, network traffic, and other security data.


    One way to use IoCs and behavior analysis is to use IoCs as input to UEBA algorithms.
    For example, IoCs can be used to train a UEBA model to recognize patterns of attack
    and flag suspicious behavior that might indicate a new or unknown threat. UEBA
    can also be used to correlate IoCs with other types of security data, such as
    logs and network traffic, to provide a more complete picture of an attack and
    its impact on the network.


    Mathematically, UEBA algorithms can be represented as follows:


    Let X be the input of features, such as user behavior, network traffic, and other
    security data. Let y be the output variable, representing whether a given entity
    is exhibiting normal or abnormal behavior. UEBA algorithms seek to learn a function
    f(X)=y that maps the features to the output variable, using techniques such as
    supervised learning, unsupervised learning, and reinforcement learning.


    UEBA algorithms can also incorporate IoCs into the learning process by adding
    input features. For example, an algorithm might include IP addresses, domain names,
    or other indicators of compromise as features in a'
