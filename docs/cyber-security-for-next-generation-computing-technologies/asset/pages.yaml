    Deep learning is the domain of ML consisting of neural networks that help in identifying
    high-level features of data through layers of modification [73]. In an intrusion
    detection system, the hidden layers of the neural network help in identifying
    the best features for pattern selection. It contains an input, hidden layer(s)
    and an output layer. Specific weights are associated with every input of the network,
    which are adjusted to get the best output via the backpropagation method [74].
    Deep learning techniques are classified into three main streams: supervised learning,
    unsupervised learning techniques, and hybrid methods [75].


    Some of the famous techniques like deep neural networks (DNN), convolutional neural
    networks (CNN), etc. are included in supervised learning methods. These methods
    provide high accuracy. Deep neural networks (DNN) contain numerous hidden layers
