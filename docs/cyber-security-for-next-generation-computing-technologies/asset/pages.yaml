    # 4.4 APPLICATIONS OF AI FOR SMART COMPUTING


    The definition of smart computing is hidden in itself as “SMART”: self-monitoring,
    analysis, and reporting technology. It is used to monitor and detect any failure
    in a system automatically and was first used for the following application with
    hard drives. Smart computing emerged to be an intelligent technology due to the
    integration of AI. powered the smart computing, and it is deployed in many applications.
    In smart computing, AI is used in smart houses, smart grid, smart agriculture,
    smart healthcare, smart cyber security, smart networking, smart vehicles, etc.


    # 4.4.1 SMART HOUSE


    Smart house is a building block of smart cities. Smart houses consist of intelligent
    appliances like smart air conditioners, smart TVs, smart refrigerators, smart
    lights, smart fans, etc. A smart house enables you to monitor the 24 hours a day
    and control all its gadgets remotely [47]. You can have a check on home security,
    and you can turn on the AC or a heater before coming home on a hot or cold day,
    respectively. Thus smart computing makes your house secure and comfortable.


    # 4.4.2 SMART GRID


    A smart grid is a digital network used to distribute electricity through twoway
    communication. It has various advantages over a conventional grid system as it
    is more efficient, transparent, and reliable, and it reduces the consumption as
    well as the cost of electricity [48]. It is also environment friendly and very
    flexible in applications. Smart grid is composed of three types of systems: (1)
    smart infrastructure, (2) smart management system, smart system protection [49].


    # 4.4.3 SMART NETWORKING AND SECURITY


    AI has opened doors for intelligent networking. Devices on both ends learn the
    path that would be feasible for the communication depending on the protocol. Cyber
    security has the main focus in AI, and various novel techniques have introduced
    in the security of networks. Intrusion detection system (IDS) and intrusion prevention
    system (IPS) have been powered with AI. They are trained properly using ML algorithms
    for the possible kinds of attack, are also made intelligent to detect zero-day
    exploitation, and are programmed to take action automatically in case of intrusion
    [50, 51]. In signature-based IDS, the attack signature is already saved and possible
    threats are matched, and in anomaly-based IDS, the system is trained to sense
    attack in real environments using the knowledge of a training dataset [52, 53].'
