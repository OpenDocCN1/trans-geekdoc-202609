    +   Incentives: The economics for cyber security have been criticized for having
    a flawed or even distorted incentive structure. Also, cyber crime is thought to
    be relatively safe, profitable, and inexpensive for the offenders. In contrast,
    cyber security can be costly because it is inherently flawed and the financial
    returns on investments are frequently uncertain [44]–[58].


    +   Consensus: There is little understanding of what cyber security is, how it
    should be implemented, and the risks among the various stakeholders. Also, there
    are significant barriers to consensus, not just within sectors but also among
    sectors [49]–[58], [66].


    +   Environment: In terms of size and characteristics, cyberspace has been dubbed
    the technological environment that is evolving quickly in human history. Emerging
    technologies such as social media, mobile computing, and the Internet of Things
    (IoT) may make the already challenging environment even worse. On certain issues,
    legislation and executive actions may have a big impact. On future, cyber security
    and development may influence the design of ICT. Also, cyber crime penalties may
    affect the design of incentives [62], 67].


