    # 9.3 I DESIGN AND ARCHITECTURE


    Many companies are investing in IoT devices. However, the Internet is the backbone
    used in IoT networks. Moreover, the integration of people, objects, and things
    is the combination of IoT devices. The IoT framework aims to connect the real
    and virtual worlds with one another. Machine-to-machine communication is the main
    foundation of IoT. Although IoT equipment is widely utilized, the concept of smart
    cities relies on IoT networks. Similarly, smart homes offer IoT-enabled connectivity
    for power management and automation. However, the concept of intelligent towns
    is becoming more of a reality with IoT systems [14–16].


    IoT uses a special kind of architecture that includes application, network, and
    perception layers. Every every layer needs service to ensure communication. Figure
    9.2 presents a three-layered IoT design and architecture. The network layer is
    responsible for data transmission between IoT nodes. The perception layer uses
    mainly IoT devices to collect information [17].


    Figure 9.3 describes a five-layered IoT architecture that has some distinct functions.
    The perception and application layers perform the same tasks as the previous model.
    Data processing can be made in the network. However, the network layer easily
    transfers data packets from sender to receiver using wire-communication technologies,
    which include 3G, 4G, LTE, 5G, Wi-Fi, and Bluetooth. In addition, the baseline
    easily visualizes overall data that satisfies future goals. Further research is
    needed to improve the IoT-enabled architecture [18].


    IoT-based sensors play an important role while collecting information. IoT devices
    are utilized in many different applications. While the actuator moves the IoT
    workstation, this technology has applications in healthcare, transportation, rescue
    operations, and many other areas [19–21].'
