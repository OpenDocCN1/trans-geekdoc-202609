  md: '# 2.10 CYBER SECURITY ISSUES AND CHALLENGES


    Technology for information and communications (ICT) is pervasive. It is constantly
    changing with time and development in technology and plays an ever bigger role
    in contemporary society. ICT equipment and parts create a system of interconnected
    networks. Cyberspace is the name for the local data and infrastructure, defending
    cyberspace against intrusions by others and foe is known as cyber security. Thus,
    depending on three factors, such attacks pose hazards and vulnerabilities [32].


    # 2.10.1 What ARE THE THREATS?


    Nation-state adversaries who develop capabilities and carry out cyber attacks
    in support of a country''s strategic objectives are known as “hacktivists”. These
    cyber attacks are carried out for monetary reasons such as theft or extortion,
    and spies become involved in espionage and stealing proprietary information used
    by government or private entities [18].


    # 2.10.2 What IS A VULNERABILITY?


    There is currently an arms race in cyber security between attackers and defenders.
    Attackers continuously look for flaws in ICT systems and for inadvertent or deliberate
    actions by insiders with access to supply chain vulnerabilities that allow the
    insertion of malicious software [49].


    # 2.10.3 What IS AN IMPACT?


    An impact affects the confidentiality, integrity, and availability of ICT system
    information, and depending on how it is connected could compromise everything
    with a successful assault. Financial, property, and personal information may be
    infiltrated as a result of cyber theft or cyber espionage, which is carried out
    frequently without the victim''s knowledge. However, attacks that cause a denial
    of service can impede or stop authorized users from using a system. Moreover,
    cyber attacks on systems and bot malware provide an attacker control of network
    of “zombie” computers. Attacks on industrial control systems can lead to the obliteration
    of the machinery, centrifuges, pumps, and generators [7]–[15].


    # 2.10.4 Federal Role


    The federal government’s participation in cyber security includes both defending
    its own networks and aiding in the defense of non-governmental ones. Federal agents
    also work for safeguarding their own systems, and have CI obligations. Various
    areas of cyber security are covered by more than 50 pieces of legislation, and
    the 113th and 114th Congresses have passed a number of additional laws [41]–[43].
    Generally speaking, NIST (National Institute of Standards and Technology) establishes
    FISMA (Federal Information Security Management Act of 2002) rules that apply to
    federal civilian ICT and OMB. These rules are intended to ensure'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Security and Intelligent Management


    that they are put into practice. The Department of Homeland Security (DHS) is
    the principal coordinating body government efforts to assist private firms in
    securing CI assets; their operational responsibility is to protect federal civilian
    networks. The DOJ is the primary enforcement body for the relevant legislation.
    The Department of Defense’s (DOD) acts in cyberspace to ensure the safety of defense
    assets and civil authorities. These and the National Security System (NSS) are
    all under the purview of DOD. IC also includes the National Security Agency (NSA)
    [59].


    # 2.10.5  LEGISLATIVE ACTIONS


    More than 200 bills that deal with cyber security issues have been introduced
    since the 111th Congress in the 113th and 114th Congresses. The legislation deals
    with a number of problems that include [60].


    +   - Federal Information Systems: Giving DHS more authority to prevent government
    advancements and FISMA to reflect developments in the ICT environment [59, 61]

    - Information Sharing: Allowing private sector organizations to monitor and manage
    defenses on their information systems and easing public and private sector sharing
    of information on cyber threats and defense measures [59]

    - Program Authorization: The National Science Foundation, NIST (framework for
    CI security, education, and awareness), and DHS (National Cyber-Security and Communications
    Integration Center [NCCIC]) carried out their outgoing activities with specific
    statutory authorization [47]

    - R&D: Updates to agency authorizations and strategic planning requirements [49]

    - Workforce: Enforcing an employment code system for federal cybersecurity employees,
    increasing the size, expertise, and readiness of DHS cyber security workforce
    [41]


    # 2.10.6  LONG-TERM CHALLENGES


    The legislation and executive-branch initiatives mentioned are primarily intended
    to address cyber security needs. Also, it prevents cyber-based disasters, espionage,
    and minimizing the effects of successful attacks, as well as enhancing inter-
    and intra-sector collaboration and outlining the roles and responsibilities of
    federal agencies and combating cyber crime. But such requirements are there in
    the context of matching long-term issues with regard to design, incentives, consensus,
    and environment (DICE) [23]


    +   - Design: According to experts, ICT design must include effective security
    as a key component. Due to financial constraints, developers are typically given
    functionality a higher priority than security. Additionally, many future security
    requirements cannot be forecasted, which presents a challenging task for designers
    [59, 60], [62]-[[65].'
