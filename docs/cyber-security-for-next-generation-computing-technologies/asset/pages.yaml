    # ## 6.1 INTRODUCTION


    The IoT is an inter-networking of things such as sensors, actuators, smart devices,
    intelligent systems, or anything consisting of transducers embedded in or connected
    via the Internet for sending and receiving data related to a particular application
    or service. The prevailing IoT applications usually provide high efficiency, automation,
    and comfort, as industries are currently producing a large number of IoT devices
    containing intelligent applications. The IoT has downgraded individual controlling
    and monitoring of services by providing smart services through smart applications
    as smart home [1], smart farming [2], smart city [3], smart grids [4], smart manufacturing
    [5], etc. The extreme increase in IoT devices and services has embraced the world.
