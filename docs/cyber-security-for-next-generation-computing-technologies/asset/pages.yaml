  md: '# Cyber Security for Next-Generation Computing Technologies


    and storage. Decrypting data that has been inadequately encrypted, manin-the-middle
    MITM attacks, and disclosing sensitive information frequently compromise secrecy.
    Data encryption, two-factor authentication, biometric verification, security tokens,
    and other standard procedures are utilized to protect confidentiality.


    +   * **Integrity**: Integrity relates to preventing unauthorized parties from
    altering information. It is required that information and programs... Integrity
    risks include turning a computer into a "zombie computer" and infecting online
    pages with malware. Typically, the following methods are used to ensure data integrity:
    cryptographic checksums, uninterrupted power supplies, data backups, etc.


    +   * **Availability**: Availability ensures that the information is accessible
    to authorized users when required. Data is only helpful if it is accessible to
    the right people at the right time. Information inaccessibility may result from
    security vulnerabilities as DDoS attacks, hardware failure, poor software, or
    human error. Common practices for ensuring availability include backing up data
    to external drives, installing firewalls, having a backup power supply, and replicating
    data.


