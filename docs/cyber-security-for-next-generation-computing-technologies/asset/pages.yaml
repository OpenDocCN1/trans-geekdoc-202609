    # 13.7 CONCLUSION AND FUTURE DIRECTIONS


    Recently, artificial intelligence has been widely used to detect threats in many
    fields. The identification of an attack is considered a serious problem in IoT-based
    UAV networks. This chapter provides a comparative analysis to evaluate the intrusion
    detection system trust factor. Therefore machine learning algorithms like XGBoost,
    naive Bayes, AdaBoost, and GaussianNB are implemented using the UNSW-NB15 dataset.
    Simulation is performed using Python. AdaBoost has better accuracy, 98.3431%,
    in detecting cyber attacks. Also, XGBoost accuracy in identifying attack is 98.2507%.
    Overall, binary classification is used to check performance. In near future, optimization
    techniques will provide optimal solutions for detecting cyber attacks.


