    # 8.4.3 HYBRID-BASED IDS FOR IoT


    In the hybrid intrusion detection technique, the concept of both HIDS and NIDS
    is used. It collects data from the host as well as from the network and analyzes
    it for intrusions. The analysis is held on anomaly detection or a database of
    signature-based patterns [58]. Hybrid intrusion detection includes two steps.
    In the first step, the anomaly detection part of HIDS functions to identify abnormalities
    using a particular approach. In case of any malicious code identification, its
    pattern is stored in the signature database to protect the IoT system from similar
    attacks. The hybrid-based IDS accomplishes the targets of a high alarm probability
    and low false positives [60].


    # 8.5 MACHINE-LEARNING-BASED SIGNATURE IDS SOLUTIONS FOR IOT


    Signature-based IDS can be implemented using various machine learning (ML) techniques.
    The machine learning technique consists of the training and testing stages [61].
    During training of a dataset, algorithms use data at the normal state as the information
    to train themselves on the features of the IoT network. Thereafter, classification
    is performed in the testing stage [62]. Some of the ML techniques that can be
    used to implement signature-based IDS for IoT are discussed next.


    In supervised learning, the classification model is created by the characteristics
    of the training datasets. This is the learning of the model [63]. The unsupervised
    learning model doesn''t use clustered training data.


    Naive Bayes algorithm can be used for probability calculations, using network
    traffic characteristics in a signature-IDS based on an IoT system [64]. Naive
    Bayes requires a lower amount of data in the characterization cycle to find the
    boundaries. It performs well on KDD CUP 1999+NSL and UNSW-NB15 datasets and helps
    in detecting DDoS, DoS, Code injection, etc. [65].


    The decision tree (DT) classifier facilitates decision making using the techniques
    of information gain and geni index. Decision trees can be manipulated, and missing
    values can be found by using this algorithm [66]. They can also be implemented
    on the CICIDS 2017, Bot-IDS, KDD999, NSL-KDD datasets and in identifying attacks
    by Sybil, flooding, spyware, etc. [67].


    K-nearest neighbor (K-NN) calculates the distance between the neighbors and. K-NN
    categorizes the new occurrence based on the maximum number of nearest neighbors.
    It can be implemented on datasets such as DS205, UNSW-NB15, etc. [69].


    Support vector machine (SVM) is another ML technique that helps in real-time detection
    of both known and unknown attacks [70]. SVM classifies separates data into two-dimensional
    planes. The kernel function in SVM converts nonlinear data into linear form for
    attack detection. The performance of SVM depends on the dataset and its environment
    [71]. Datasets such as UNSW-NB15, KDDCUP99,'
