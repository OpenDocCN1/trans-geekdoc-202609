    # 3.5.4 DECISION TREE (DT)


    A decision tree is a data structure used to represent a series of decisions and
    their possible outcomes. The decision tree is an efficient technique to provide
    possible solutions for classification-based issues. However, the leaf node presents
    the final output. The DT technique is mainly based on entropy and information
    gain. Various techniques like ID3, C4.5, and CART can be utilized for designing
    the decision tree. ID3 is considered a greedy method used to select the optimal
    attribute. The splitting technique is found in C4.5, which is the expansion of
    ID3. CART is used to support both classification and regression. The C4.5 demonstration
    is available on Weka tool [47, 48].


    It is worth noting that DT has its limitations. For instance, it can create complex
    trees that are difficult to interpret, which can cause overfitting or underfitting.
    The decision tree is sensitive to the data distribution and can create biased
    trees that affect the classifier''s accuracy.


    The development of DT started in the late 1950s, and, since, different versions
    and algorithms have been developed to improve its performance. ID3 was developed
    in 1986, C4.5 in 1993, and CART in 1984. These algorithms are widely used and
    have been implemented in various software and programming languages.


