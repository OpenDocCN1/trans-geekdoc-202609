    # 10.2 FUNDAMENTALS EDGE/FOG COMPUTING AND CYBER SECURITY


    It is important to understand the characteristics and functionalities of edge/fog
    computing and the need to secure these entities that constitute an attractive
    target for cyber attacks.

    Edge/fog computing was developed to offload the cloud and overcome some of its
    shortcomings. With the increase of connected devices, platforms, and users, the
    amount of data increases, and processing it within the local cloud becomes more
    complex. Shifting from a large-scale center platform for big data processing to
    diversified and distributed data storage with fast response and advanced computing
    capabilities has become a requirement [4]. Edge/fog computing inherits the benefits
    of cloud computing while bringing new advantages. It reduces the response time,
    and the data complexity allows local processing and minimizes the amount of network
    traffic, etc. Compared to cloud computing, edge/fog computing systems are constrained
    with resources limited computing capabilities. However, their heterogeneity makes
    them optimal for handling different tasks with different requirements, and their
    distribution in other locations makes them closer to the end users [4]. As mentioned
    previously, edge/fog computing can locally process the data; this means it can
    interact with the end user without the cloud''s internet communicating with the
    cloud to collect or store the data.


    In terms of security, cloud computing faces several issues and challenges due
    to its centralized nature. The data is stored with a third-party provider, while
    it can be accessed through the internet; this limits the visibility of the data
    and exposes it to theft, corruption, and falsification. Edge/fog computing reduces
    the security risks involved. Placing edge/fog computing close to the end users
    reduce time, and the chances that the data get intercepted become lower. Also,
    the data distribution among different edge/fog servers ensures the continuity
    of data processing; even with the destruction of one server, the others remain
    available. Considering their unique architecture and role as an intermediate layer
    between the cloud and end user, edge/fog computing platforms require strong cyber
    security systems that protect the infrastructure and the collected and stored
    data. Edge/fog computing can be a target for large attacks, threats, and risks
    for a set of reasons:'
