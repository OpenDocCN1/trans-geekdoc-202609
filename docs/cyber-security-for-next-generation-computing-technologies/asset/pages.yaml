    # 15.2 BLOCKCHAIN TECHNOLOGY BACKGROUND


    The data structure offered by blockchain technology possesses inherent security
    features like decentralization, cryptography, and consensus, ensuring the authenticity
    of transactions. Its potentials applications are vast and diverse, encompassing
    areas such as health, finance, smart production, IoT, and others.


    # 15.2.1 BLOCKCHAIN TECHNOLOGY


    Satoshi Nakamoto initially introduced blockchain [11] to tackle the issues associated
    with the traditional payment system, which relies on a third party to authenticate
    and verify transactions between parties. In contrast, blockchain is a public and
    decentralized (P2P) network where records are shared and replicated across multiple
    nodes in a peer-to-peer network. Transactions are recorded in unalterable blocks
    that form an immutable chain of records.


    The current digital economy relies on a trusted third party to secure transactions,
    because these parties are vulnerable to hacking or manipulation, blockchain technology
    has emerged [12]. Motivated by the idea of Bitcoin, blockchain can be implemented
    in finance, national governance, business operations, education, medicine, and
    other non-financial areas because of its benefits, such as decentralization, persistence,
    trust, immutability, anonymity, and audibility.'
