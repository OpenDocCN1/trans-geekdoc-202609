    # 6.2.1 Sensing Layer Attacks


    This layer includes a huge number of devices such as actuators, sensors, smart
    devices. The security attacks and threats are as shown in Figure 6.4 over this
    layer.


    +   * Node Capture/Tampering: This attack could be done by either tampering or
    replacing a node with a malicious node. The attacker''s aim is to get access and
    control of the IoT device. An unprotected environment makes it very difficult
    to capture attacks. If an attacker can get physical access over the node then
    any critical cryptographic information can be stolen [15].n* Sleep Deprivation:
    IoT devices have small batteries that make them more vulnerable to DoS attack
    in which the attacker tries to drain the battery and force the device into a shutdown
    state, leading to DoS [16]. This can have serious impacts on the functionality
    of an application such that, in an emergency case, the device would not be able
    to function and state the emergency. Moreover, the attacker would cause the sleep
    deprivation to the device by running infinite iterative malicious algorithms to
    the edge devices, keeping the device awake and stopping it from going into sleep
    mode, ending with sleep deprivation [10].

    * Malicious Code Injection Attacks: This attack is carried out by injecting malicious
    code into the memory of the device. The attacker can then use such device as a
    gateway for performing operations like providing false information and injecting
    an entire IoT system [10].

    * Side Channel Attacks (SCA): Most of the time in passive attacks, the goals of
    attackers are to hack confidential information. Adversaries use electromagnetic
    production on the micro-architectures of the time processes and other resource
    consumption to access confidential information. An SCA can be a timing or laser-based
    attack based on power consumption [10]. In current electronics, the prevention
    of an SCA is aimed at the implementation of cryptographic techniques on new FPGA
    chips.

    * Eavesdropping: The authentication mechanism, if not performed as required, may
    raise an eavesdropping attack possibility, since this information can be passively
    monitored between the device by an intruder.

    * Booting Attacks: When devices are in most of the time booting process, there
    is a zero-security level at that time. Specifically for IoT systems,'
