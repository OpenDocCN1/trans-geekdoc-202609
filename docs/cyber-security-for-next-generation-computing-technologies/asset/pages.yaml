    Usman Haider, Hina Shoukat, Muhammad Yaseen Ayub, Muhammad Tehmasib Ali Tashfeen,
    Tarandeep Kaur Bhatia, and Inam Ullah Khan


    # ## 13.1 INTRODUCTION


    The aerial ad hoc network is a newly emerged technology from MANETs. A-ANETS are
    used to group UAVs. Due to the involvement of IoT in UAV networks, a novel area
    of research is introduced, known as the Internet of Drones. UAVs have applications
    in both the civil and military domains. On the civil side, UAVs are commonly utilized
    in forestry, disaster management, sports, rescue operations, and smart farming
    as well. UAVs can be used for the surveillance and detection of intruders [1,
    2]. Cellular-connected UAVs are considered the advanced approach that overcomes
    end-to-end connectivity. Wireless networks like 5G and beyond in UAV networks
    will improve latency problems [3]. The agricultural industry has been revolutionized
    with the help of aerial vehicles, which are used to monitor crops more effectively
    [4]. Secure communication in UAVs is considered a serious problem. Intruders deploy
    DoS/DDoS security attacks sends malicious packets continuously to hijack the network.
    Denial of service is commonly called a third-party attack, which can render a
    workload unavailable [5]. Domain name system [6], distributed denial of service
    [7], and Sybil [8] attacks can unalarm hijacking. However, to identify and make
    fake attacks in UAV networks, there will be true/false positive and true/false
    negative approaches. A-ANETS have very short range of communication but are uniquely
    self-organizing in nature. Due to their dynamic movement, aerial vehicles are
    more exposed to cyber attacks [9]. Figure 13.1 illustrates the concept of sending
    fake packets to UAV networks for jamming or hijacking.


    Over-The identification of various attacks are quite difficult. Different methods
    and software help users in the detection of cyber attacks. Game theory technique
    can be used to detect intruders [10]. The intrusion detection system is designed
    to detect possible security attacks. This chapter offers insightful information
    about'
