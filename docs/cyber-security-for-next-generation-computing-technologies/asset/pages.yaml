    A defects and B defects} \end{cases} (5.5)

    ```


    if Payoff is the reward or penalty for a player, $R$ is the reward for mutual
    cooperation, $S$ is the penalty for exploited, $T$ is the temptation to defect,
    and $P$ is the punishment for mutual defection. This model can be used to analyze
    the behavior of attackers and defenders in a cyber security scenario:


    +   * Unusual going and incoming network traffic

    * Geographical irregularity: Traffic or attempted connections from areas or countries
    where the organization is not present

    * Unusual user account: User attempting to elevate privileges or access an account
    with higher privileges

    * Increase in the volume of a database read: When exfiltrating data, suspicious
    changes to the registry or system file

    * Anomalies in DNS queries: For example, when a command and control (CC) server
    sends commands

    * An increase in incorrect connections, which may indicate force attacks


    As previously explained, it is necessary to have already identified indicators
    of compromise and to create rules, so that they can be automatically detected
    later. UEBA (user and entity behavior analytics) allows the detection of unknown
    threats, especially internal ones. Through machine learning, it is possible to
    create a reference for "normal" behavior of a user, a group, or a network entity.
    Then, when a user performs an action that deviates from the expected behavior,
    an alert with a risk score is automatically raised.


    # 5.4.2 ARTIFICIAL INTELLIGENCE (AI)


    Artificial Intelligence (AI) has the potential to significantly enhance an organization''s
    ability to mitigate cyber threats by automating threat detection and response
    by providing faster and more accurate insights into potential security breaches.
    Here are a few ways AI can be used to mitigate cyber threats:


    +   * Threat Detection: AI can be used to analyze vast amounts of data to identify
    patterns and anomalies that could indicate a security breach. Machine learning
    algorithms can be trained on historical data to detect and respond to new types
    of threats in real time. This can help organizations identify and respond to threats
    faster, reducing the time that attackers have to cause damage.

    * Network Security: AI can be used to monitor network traffic in real time to
    identify potential threats, such as unauthorized access attempts, suspicious'
