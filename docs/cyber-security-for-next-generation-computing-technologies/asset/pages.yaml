    # 4.6.1 DENIAL OF SERVICE (DoS) ATTACK


    This is the most famous, and deadly attack. In this attack, the attacker''s sole
    intention is to keep the target down from its services, and even legal users are
    unable to connect to the server. A huge amount of traffic is sent by the attacker
    to the victim, who is unable to handle it, which takes the server down completely
    [63] (Figure 4.3).


    # 4.6.2 DISTRIBUTED DENIAL OF SERVICE (DDoS) ATTACK


    DDoS is a type of DoS that can be considered an advanced and more destructive
    version of DoS. The intention of the attacker is same but with a different approach.
    The attacker uses various PCs/systems to ping the victim through various parts
    of world, generating a huge amount of traffic and dismantling the up state of
    victim [64].


    # 4.6.3 DOMAIN NAME SYSTEM (DNS) ATTACK


    A DNS attack targets the DNS service of the network, then compromising its sustainability
    and availability. It can slow down the web server, affecting its ranking. It redirects
    the network traffic to a malicious website instead of the legitimate website by
    the IP address in DNS server, thereby corrupting it. A DNS attack is usually done
    through cache poisoning [65]. A DNS attack is shown in Figure 4.4.


    # 4.6.4 SYBIL ATTACK


    The intruder using the Sybil tries to own the network through variously active
    false identities by a single node. It is an especially serious threat to a peer-to-peer
    network because the hacker is pretending to be many persons at the same time and
    fully control the network. Usually, Sybil attacks are carried out the Tor network.
    According to studies, category accounts for 51% of the attacks in blockchain networks
    [66]. The fake reviews and comments on e-commerce websites like Amazon are an
    example of Sybil attacks. Figure 4.5 shows a sketch of a Sybil attack.


