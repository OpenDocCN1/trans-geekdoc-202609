    # 6.5 FUTURE RESEARCH DIRECTIONS


    These are some of the research directions for future.

    The gateways among the layers of an IoT system must be secured, or they provide
    entry points that attackers can use to attack the IoT system. End-to-end encryption
    might be a more promising solution for securing the data passing via gateways
    than the use of specific encryption techniques.


    Edge devices in the IoT are the most resource-constrained devices and are hence
    vulnerable to attacks. The studies show that, while little power is needed to
    implement suitable security practices for edge nodes, they are still vulnerable
    to many attacks.


    More reliable and efficient consensus methods could be designed for reaching consensus
    on the devices, along with avoiding the extensive use of computation power. The
    existing algorithms are extremely resource-hungry and are less efficient.


    # 6.6 CONCLUSION


    IoT is becoming much more popular, and its number of devices is increasing dramatically.
    With the increase of devices, the complexity of IoT systems is increasing as well.
    Since IoT devices are becoming more complex, cheaper, highly distributed, and
    heterogeneous, more security issues are on the rise. In this chapter, security
    issues and attacks have been identified at the various layers of an IoT network.
    The issues have been covered related to the application layer, gateways, middleware
    layer, network layer, and sensing layer. Also, the existing solutions to security
    threats of IoT have been discussed, which include blockchain, edge computing,
    machine learning, and AI. Many open issues and future research directions for
    the security enhancement of the IoT have also been discussed. This chapter is
    expected to serve as an important resource for enhancing security in upcoming
    IoT systems.


