    # 1.4 CYBER SECURITY ARCHITECTURE


    Cybersecurity architecture, also known as network security architecture, is the
    science of designing computer systems to ensure the security of the underlying
    data. A cyber security architectural framework contains the structure, standards,
    norms, and functional behavior of a computer network, encompassing both security
    measures and network characteristics. A cyber security framework explains how
    an organization safeguards the confidentiality, availability, and integrity of
    the data utilized in its business operations [38–40].


    To design cyber security architecture for an organization, we can opt to start
    from scratch or build it on an existing framework. A cyber security architecture
    framework should comprise three components: security and network components, standards
    and frameworks, and procedural and policy-related components. Detailed cybersecurity'
