    # 4.6.5 PING OF DEATH (PoD) ATTACK


    In this kind of attack, the attacker tries to freeze and destabilize the victim
    by sending malfunctioning or oversized packets. The attacker uses the hit-and-trial
    method to get to know the system''s limit by continuously sending packets. As
    the attacker exceeds the system limits, the system becomes unable to process beyond
    functional-packet-sized and stops responding. Some researchers call the PoD a
    kind of Dos and DDoS attack [67]. Figure 4.6 describes the idea of PoD attack.'
