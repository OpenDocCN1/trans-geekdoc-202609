    # 4.7 FUTURE DIRECTIONS


    In near future, everything is going to be smart, making security a serious problem.
    This critical problem is addressed by partial artificial intelligence, machine
    learning, by data, evolutionary computing, ant colony optimization, genetic algorithm,
    etc. Thus the researchers working on smart gadgets and IoTs should also work on
    their security and threat resistance as well. Moreover, security solutions with
    more accurate results are needed [68–70].


    # 4.8 CONCLUSION


    The technology is going to surpass 24 hours supervision in very near future, and
    artificial intelligence is the key to the new transformation. However, applications
    of AI are countless an intelligent system can be deployed and efficiently perform
    any assigned task if properly. Nowadays, everyone has a wireless device in his/her
    pocket and is connected with the huge communication system of a smart world. Wireless
    systems include base stations for local and national-level communication, as well
    as satellites on the national and international levels. AI in collaboration with
    wireless communication is going to change world dynamics and will give rise to
    smart computing. In short, the future is very bright on this planet through AI
    practices in intelligent systems, thus forming an entirely smart world.


