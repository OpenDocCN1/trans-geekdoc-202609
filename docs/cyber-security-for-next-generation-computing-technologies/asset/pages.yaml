    # 10.3 CYBER SECURITY THREATS, VULNERABILITIES, AND RISKS IN EDGE/FOG COMPUTING


    As with any technology, edge/fog computing systems can face attacks that exploit
    some vulnerabilities to penetrate the system and data. They can attain the confidentiality,
    integrity, and availability of stored and shared data [5, 6]. In this section,
    a set of common threats and risks related to cyber attacks on edge/fog computing
    systems are described.


    +   * Malware Attacks: Edge/fog computing systems can be vulnerable to malware
    attacks such as worms, viruses, and Trojan horses that use malicious software
    to affect devices to the systems'' operation [7]. They may manipulate system performances,
    steal data, or launch other attacks. Also, they can spread quickly through the
    network, where multiple devices and applications are affected.

    * Ransomware Attacks: Ransomware attacks can be destructive to edge/fog computing
    systems, particularly for time-sensitive data, where attackers can encrypt it
    and then ask for payment to provide the decryption key. This can disrupt the system''s
    availability, leading to significant consequences.

    * Insider Threats: Insider threats refer to attacks or security breaches from
    within an organization authorized users misuse their privilege and bypass security
    measures to access edge/fog systems. They can intentionally or unintentionally
    cause significant damage to data and infrastructures or disrupt availability.

    * Denial-of-Service (DoS): Attacks involve overloading edge/fog computing systems
    with requests, causing the system to become unavailable to users. This can cause
    a disruption of operations and data that requires real-time processing and communication.

    * Supply Chain Attacks: Supply chain attacks involve fabrication threats. Vendors
    or third-party suppliers of a target system can gain unauthorized access to software
    or hardware components of an edge/fog computing system, allowing manipulation
    of a system behavior or stalling sensitive data stored in the servers.

    * Lack of Standardization: Edge/fog computing environments may use inconsistent
    protocols and security measures. Without standardization, the risk of security
    breaches and loss of integrity of edge/fog computing systems becomes highly.

    * Human Error: Human error, such as configuration mistakes, poor password management,
    and weak programs, can make edge/fog computing systems vulnerable to cyber attacks.

    * Interception Attacks: It''s an attack on confidentiality [8]. It involves eavesdropping
    on communication, wiretapping communication between devices in edge/fog computing
    systems, and copying programs used to access sensitive data or further attacks.

    * Man-in-the-Middle (MitM) Attacks: In the context of edge/fog computing systems,
    MitM attacks can intercept data shared between IoT devices, edge/fog servers,
    and cloud servers [9].'
