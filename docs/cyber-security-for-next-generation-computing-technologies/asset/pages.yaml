  md: '# Cyber Security 5


    paid program. After a victim downloads and runs the Trojan, it will begin performing
    malicious actions on the infected machine [19].


    +   - Remote Access Trojan (RAT): Trojans designed to serve as a backdoor for
    additional attacks are known as remote access Trojans (RATs). Once the virus is
    active on an infected machine, the attacker gains access to the system remotely
    and can steal data, install further malware, or execute other malicious activities
    [20].

    - Spyware: Spyware is a form of malware that monitors a user''s activity on their
    computer and records that data. Hackers create spyware to gain access to private
    information that may be sold or used in future assaults [21]. This information
    can include log credentials, financial data, and other sensitive details.

    - Cryptojacking: In order to add blocks to the blockchain, Proof of Work (PoW)
    cryptrencies require a computationally intensive process called mining. In order
    to mine cryptocurrency, cryptojacking malware installs itself on a compromised
    computer and uses its processing power to create blocks [22].


    # 1.3.2 SOCIAL ENGINEERING ATTACKS


    Social engineering attacks involve deception, compulsion, and other forms of psychological
    manipulation to persuade the target to perform the desired action. Typical instances
    of social engineering techniques are as follows:


    +   - Phishing: Phishing is one form of social engineering in which the target
    is tricked into providing information or some other action that benefits the attacker
    [23]. The goal of phishing is to trick users (using emails, social media posts,
    and other kinds of electronic communication) into visiting a harmful website,
    downloading a malicious file, or providing personal information as such.

    - Spear Phishing: Spear phishing attacks are a type of phishing in which the attacker
    tries to trick a specific person or group into giving sensitive information by
    posing as a trustworthy organization [24]. A spear phishing email sent to the
    accounts payable clerk, falsely claimed to be one of the company''s legitimate
    vendors or suppliers, demanding payment for goods or services already rendered.

    - Smishing: What we call “smishing” attacks originate from “phishing,” except
    they use text messages instead of email [25]. These attacks take advantage of
    phishing features, such as the ability to hover the mouse over an SMS link to
    see where it leads and the prevalence of link shortening services (like bit.ly).

    - Vishing (Voice-Based Phishing): Vishing uses similar techniques to phishing
    but takes place over the phone. Convincing a victim to do a malicious action or
    reveal private information like passwords or credit card numbers is an attack
    technique [26].'
