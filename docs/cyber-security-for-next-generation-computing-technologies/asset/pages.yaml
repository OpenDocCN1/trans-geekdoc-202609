    ways to exploit weaknesses in computer systems, and ML can help them identify
    vulnerabilities quickly and efficiently.


    +   **Supervised learning** is one of the types of ML and aims to understand the
    relationship between input and output data. Once this relationship is established,
    the algorithm can predict the output for new input data based on what it has learned
    mainly focuses on classification and regression methods. **Classification** groups
    similarly breaks down data points into different classes. This supervised approach
    finds the best way to separate the data points and assign them to specific classes.
    On the other side, **regression** differs from classification in that it outputs
    a number instead of assigning data points to classes. Classification focuses on
    classifying and outputting the class, whereas regression produces a numerical
    output [19].

    * **In unsupervised learning**, the dataset has only input data, and it deals
    with unlabeled data. Its purpose is to identify patterns or similarities in the
    dataset. After obtaining the features, it groups the data based on those similarities
    [19]. Unlike supervised learning, the training process is unique since the algorithm
    learns from its own experiences instead of a predetermined set of inputs with
    an established relationship. In the absence of training data, the algorithm must
    rely on its experiences to learn.


