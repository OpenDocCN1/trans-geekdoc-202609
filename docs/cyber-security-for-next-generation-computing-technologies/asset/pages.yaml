    # 8.2 LITERATURE STUDY


    This section discusses the recent work performed to extract limitations related
    to intrusion detection systems using various techniques.


    Intrusion detection systems functions on a certain algorithm. There has been plenty
    of work related to various IDS which has helped in delivering important outcomes.
    To identify selective forwarding black hole attacks, Hidoussi et al. [13] presented
    a signature-based IDS. It was meant for wireless sensor networks (WSNs) that are
    cluster based. Another signature-based IDS was proposed by Patel SK et al. [14]
    to identify port scans via EPSDR, which is port scan detection rule. Mehare et
    al. [15] designed an IoT-based IDS that depended on the location and neighborhood
    information of the nodes that. This paper covered only the DoS attack and did
    not evaluate the proposed model in the paper. Krimling et al. [16] suggested a
    signature-based IDS based on ML algorithms. Liu et al. [17] established an artificial
    malcodes for an IoT environment. The IDS could learn new attacks, which are based
    on ML and signature-based methods.


    A unified intrusion detection system (UIDS) was suggested by Kumar et al. [18]
    for IoT-based networks. The model was analyzed on the upgraded dataset UNSW-NB15.
    An analysis of the UNSW-NB15 [19] dataset was detected by Mostafa et al. [14].
    They compared the operation of this system with KDD99 [20] using machine learning.
    Kornotis et al. [21] also conducted an analysis of ML techniques using to check
    it detects intrusions in the network. GarciaFont et al. [22] suggested an IDS
    for wireless sensor networks (WSNs) using a signature-based approach and ML techniques.
    They improved the detection rate and FPR. The main goal of the system is to identify
    malicious codes in WSNs in various smart city environments and was also applicable
    to large city environments.


    Various types of IDS have certain limitations. Anomaly-based IDS depend on the
    statistical features of normal traffic and can identify unknown attacks. Major
    issues encountered by these systems are the high false-positive ratio when it
    comes to unpredictable traffic [23]. Utilization of outdated datasets has also
    caused hindrances in evaluating the performance of IDS [24]. Labeling of datasets
    is not hardled if it makes the IDS reliable by defining all attacks [26]. Moreover,
    labeling improves the accuracy of detection by making use of supervised learning
    algorithms [27].


    Signature-based IDS also encounters problems in detecting polymorphic worms and
    metamorphic malware due to the rewriting process in every iteration. Polymorphic
    worms are the greatest challenge for signatures-based IDS as they modify and replicate
    themselves to follow the system. Y-Tang and S. Chen proposed an intrusion detection
    system that could detect polymorphic worms'
