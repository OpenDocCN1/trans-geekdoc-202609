  md: '# Cyber Security


    # 1.2 TYPES OF CYBER SECURITY


    Cyber security can broadly be divided into seven pillars [7–9]:


    +   1. **Network Security**: A planned set of guidelines and configurations is
    used to secure networks and data by ensuring their confidentiality, integrity,
    and accessibility. By safeguarding the infrastructure, network security aims to
    defend internal networks from intruders. The majority of attacks take place across
    networks, and network security solutions are made to spot and stop these attacks.
    Solutions incorporate data and access controls, including next-generation firewall
    (NGFW) application restrictions, network access control (NAC), data loss prevention
    (DLP), identity access management (IAM), and NAC (identity access management),
    to enact online regulations. Technologies for advanced and multilayered threat
    prevention include NGAV (next-gen antivirus), sandboxing, and CDR (content disant
    and reconstruction). Additionally significant are automated SOAR (security orchestration
    and response) solutions, threat hunting, and network analytics [10].


    +   2. **Cloud Security**: Technology, services, controls, and policies that safeguard
    cloud data, infrastructure, and applications against online threats and attacks
    are referred to cloud security [11]. Although a lot of cloud service providers
    offer security solutions, these are insufficient for providing enterprise-grade
    security in the cloud. Amazon AWS and Microsoft Azure are two examples of public
    computing, while VMware or OpenStack are examples of private clouds. The multi-cloud
    aspect of cloud security presents unique issues, including visibility, compliance,
    and cost control. Enabling MFA on all accounts, enabling security logs, encrypting
    your data, and double-checking your mobile needs are the standard procedures to
    take into account for cloud security.


    +   3. **Mobile Security**: Mobile security, also referred to as wireless security,
    is the safeguard in place to protect mobile devices like laptops, tablets, and
    smartphones, as well as the networks to which they are linked, from the dangers
    and risks associated with wireless computing [12]. Mobile devices like tablets
    and smartphones, which are frequently disregarded, have access to company data,
    putting firms at risk from phishing, malicious software, and IM (instant messaging)
    assaults. These attacks are stopped by mobile security, which protects operating
    systems and devices from rooting. This enables businesses to guarantee that only
    compliant mobile devices have access to company assets when combined with an MDM
    (mobile device management) solution.


    +   4. **Endpoint Security**: Companies must protect end devices like desktops/laptops
    and servers, mobile devices, network devices (routers, switches, and access points)
    with endpoint detection and response (EDR) solutions, advanced threat prevention
    (such as anti-phishing and anti-ransomware), and data and network security controls
    [13].'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Cyber Security for Next-Generation Computing Technologies


    5. **IoT Security:** Although deploying Internet of Things (IoT) devices undoubtedly
    increases productivity, it also exposes businesses to new online threats. Threat
    actors look for weak devices that are unintentionally connected to the Internet
    in order to utilize them for illicit purposes gaining access to corporate networks.
    With the use of auto-segmentation to manage work activity, discovery and classification
    of connected devices, and the use of IPS as a virtual patch to thwart attacks
    on susceptible IoT devices, IoT security safeguards these gadgets. To guard against
    exploits and runtimesattacks, the firmware of the device may in some situations
    be supplemented with tiny agents.


    6. **Application Security:** Addressing vulnerabilities originating from unsafe
    development procedures when creating, coding, and releasing software or a website
    is known as application security. It is crucial to integrate security standards,
    procedures, methods, and tools to safeguard applications during all phases of
    development because applications are directly accessible across networks. Cross-site
    scripting (XSS), DDoS attacks, access controls, a lock of encryption, etc. are
    procedures with application security [15]. Risk assessment, patching, secure development,
    backup firewalls, encryption software, and application security testing are of
    the procedures and solutions to take into consideration for this kind of cyber
    security.


    7. **Zero Trust:** Zero trust security, which takes a more granular approach to
    security by securing resources through a mix of microsegmentation, monitoring,
    and the implementation of role-based access controls, means that, by default,
    no one is trusted from inside or outside the network [16]. Continuous monitoring
    and validation, least privilege, device access control, preventing lateral movement,
    and multactor authentication are the core tenets of zero trust.


    # 1.3 CYBER SECURITY THREATS


    The main types of cyber security threats that companies face today are discussed
    next.


    # 1.3.1 MALWARE


    Malware is malicious software designed to perform a range of unwanted tasks on
    a compromised machine [17]. Some of the most common kinds of malicious software
    are:


    +   **Ransomware:** Files on a device infected with ransomware are encrypted using
    a key known to the attacker. The creator of the ransomware asks money in exchange
    for the decryption key [18]. Ransomware has become one of the most widespread
    and expensive cyber dangers that businesses face in recent years.


    +   **Trojan Horse:** Trojan horses are a type of malicious software that can
    trick users into downloading it by seeming to be a legitimate, free version of
    a'
