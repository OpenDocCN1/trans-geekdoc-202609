    # 6.1.3 SECURITY GOALS OF IOT


    The security attributes in general—confidentiality, integrity and availability
    (the CIA triangle)—are required, and specifically with IoT security, these attributes
    are especially important. Besides, that authentication and access control are
    other attributes that should be considered as well. By confidentiality of information,
    only authorized users may read it. By integrity of information, the information
    must be accurate and unchanged. By availability, the information needs to be available
    for access by users at any time. By authentication, the user’s identity is validated
    before using a system. By using authorization or access control, an authenticated
    user gets permission to access a particular resource or information. By imposing
    all security attributes, the system will be secure in terms of vulnerabilities
    and risks, but if any are lacking, security issues can be expected. If the user
    is not authenticated properly, high vulnerabilities are produced, the attacker
    can easily get into the system, and different threats can occur. After that, if
    authentication is done properly but authorization is not, different vulnerabilities
    and opportunities can be created for the attacker to access any resource in the
    system and can affect the whole IoT network.


    # 6.1.4 SECURITY REQUIREMENTS IN IOT


    By knowing these general security issues affecting the IoT, we can add security
    requirements to enhance the security and privacy of the IoT. Accordingly, some
    security features can be added as well, such as antiviruses, firewalls, security
    software, etc. Cryptographic algorithms can meet the security requirements, but
    there is a need for specific algorithms to be introduced at the physical layer
    to meet security requirements [10]. Some of the requirements for security of IoT
    are follows:


