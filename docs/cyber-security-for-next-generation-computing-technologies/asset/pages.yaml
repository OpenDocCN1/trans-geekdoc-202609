    # 1.6 CYBER SECURITY SOLUTIONS


    Cyber security solutions are a collection of technologies, tools, and services
    designed to defend businesses from cyber attacks and stolen data, reputational
    harm, compliance fines, and other negative outcomes that can occur from such attacks.
    Tools are an integral part of cybersecurity in the security environment, which
    features a wide array of threats that are always evolving [45–47]. We''ll take
    a look at three classes of cyber security measures:


    +   Cloud Security: As businesses use the cloud, they are exposed to security
    concerns and may not be adequately managed by solutions developed on-premise environments.
    These cloud security issues are addressed by cloud security solutions such as
    cloud access security brokers (CASB), server-less and container security solutions,
    et.


    +   Application Security: The majority of production applications have vulnerability,
    and some of these flaws can be used to the organization''s development. Web and
    API security solutions can prevent attacks to exploit weak applications; integrating
    application security into DevOps workflows can identify and fix vulnerabilities
    before they are exploited in production.


    +   Internet of Things (IoT) IoT devices, which have centralized monitoring and
    management of Internet-connected equipment, can be very beneficial to a company,
    but frequently have security issues. IoT security solutions in controlling access
    to vulnerable devices and defending them from exploitation.


    +   Endpoint security: Although defending endpoints from malware and other threats
    has always been crucial, the in remote work has made it even more crucial. Security
    of the endpoint depends on defense against ransomware, malware, phishing, and
    other threats.


    +   Mobile Security: As the usage of mobile devices for business becomes more
    common, cyber criminals increasingly focus their attention on mobile devices and
    launching attacks that are tailored to mobile platforms.'
