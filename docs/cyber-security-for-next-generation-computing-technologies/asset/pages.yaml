    # 11.10.2.2 Vandalism


    Vandalism as a cyber threat motivation is when an individual or group intentionally
    damages, deletes, or destroys digital assets or systems for malicious purposes
    [165]. Cyber vandalism is often motivated by a cause of disruption, gain attention,
    or expression political or ideological views. Some examples of cyber vandalism
    including defacing websites with offensive content or political goals, deleting
    or altering files, spreading malware or viruses, and launching denial of service
    attacks to overwhelm and shut down websites or servers. Cyber vandalism can have
    severe repercussions, including monetary loss, reputational harm, and possible
    legal issues. People and groups must take precautions to safeguard their digital
    assets and systems, including using strong passwords, updating software, and installing
    security tools like firewalls and antivirus software. Law enforcement organizations
    and cyber professionals also need to locate and detect those responsible for cyber
    vandalism so they can be held accountable for their deeds [166].


    # 11.10.2.3 Hacktivism, Nation-State Actors, Terrorism


    Hacktivism, nation-state actors, and terrorism are all potential motivations behind
    cyber threats:


    +   **Hacktivism**: Hacktivism refers to using hacking as a means to achieve political
    or social goals. Hackivists often target government organizations, corporations,
    and other organizations that they believe are engaging in unethical or unjust
    practices. For example, the hackivist group Anonymous has targeted organizations
    such as the Church of Scientology and the Ku Klux Klan [167].

    **Nation-State Actors**: Nation-state actors are government entities that engage
    in cyber attacks for political or economic gain. Nation-state actors can range
    from developed countries like the United States and China to smaller countries
    with advanced cyber capabilities. Nation-state actors often engage in espionage,
    stealing valuable intellectual property or secrets, and in disruptive attacks
    on critical infrastructure.

    **Terrorism**: Terrorism is using violence or intimidation to achieve political
    or social goals. In recent years, terrorist groups have increasingly used the
    Internet to spread propaganda, recruit members, and plan attacks. Cyber attacks
    by terrorist groups may include hacking government websites, stealing sensitive
    information, and disrupting critical infrastructure [168].


    All these motivations behind cyber threats pose a significant risk to individuals,
    organizations, and even entire nations. It is essential to be aware of these potential
    threats and take appropriate measures to protect against them.'
