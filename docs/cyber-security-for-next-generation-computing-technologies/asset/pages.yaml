    # 13.3 INTRUSION DETECTION SYSTEM USING MACHINE LEARNING


    The intrusion detection system is most used to identify security attacks. However,
    the anomaly-based IDS formulates a threshold to detect unknown attacks. Data monitoring
    is associated with packet headers. IDS techniques are quite advanced in detecting
    abnormal behaviors of an intruder. Attacks can be either active or'
