    # 3.5.12 GENERATIVE ADVERSARIAL NETWORK (GAN)


    GAN is considered subcategory of deep neural network that is used for generative
    modeling. GAN consists of two networks: a generator network and a discriminator
    network. The generator network generates data samples that are similar to the
    training data, while the discriminator network tries to distinguish between the
    generated samples and the real ones. The two networks are trained together in
    a mini-game, where the generator tries to fool the discriminator, and the discriminator
    tries to correctly identify the generated samples. GAN is used in a variety of
    applications, such as image synthesis, text-to-image generation, and video prediction
    [64].


