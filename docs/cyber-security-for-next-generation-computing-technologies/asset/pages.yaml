    # 3.11.1 DATASET


    Currently, the KDD99 dataset is widely used, but it has many limitations: Many
    of the available datasets are outdated, and there is a need for new datasets that
    are representative and balanced and that include a wide range of attack categories.
    Furthermore, each dataset has different features and categories, and much of the
    data about attacks is repetitive. ML-based techniques are used to improve overall
    performance, and massive data in benchmarks is utilized for training and testing.


    Data security needs to be ensured in various applications like social media platforms
    and traditional databases. ML-based techniques are usually applied on a huge amount
    of data, which is considered a problem as well. However, some datasets usually
    don''t include the last or most realistic types of attacks. As a result, there
    is still a need to develop an exemplary and up-to-date benchmark dataset that
    can address these challenges. To address this issue, systematic dataset construction
    and incremental learning may offer viable solutions.


    # 3.11.2 INFERIOR DETECTION ACCURACY


    Another challenge is the inferior detection accuracy of machine learning methods
    in actual environments, where they have used labeled datasets; the models'' performance
    on real-world samples is not covered by the dataset.


    # 3.11.3 EVALUATION METRICS AND REAL-TIME DETECTION COMPLEXITY


    Furthermore, the real-time nature of cyber attacks is often overlooked in the
    literature. As cyber criminals constantly develop new attack methods to exploit
    vulnerabilities, the detection rate and time complexity of intrusion detection
    algorithms must be considered. Efficient attack detection is critical, as false
    positives can lead to wasted time investigating benign activity and undermine
    analysts'' confidence in the system. The computational complexity of machine learning
    models must also be considered, with frequent models'' time complexity provided
    in Table 3.1. However, in near future, researchers are to be more focused on improving
    detection, prevention, and reduction of cost.


    As the field of cyber security progresses, the rate at which new attacks emerge
    is increasing rapidly, posing two main challenges for the application of machine
    learning (ML) to handle such attacks [121].'
