    In the unsupervised techniques, two different methods have been proposed. In [85],
    a new method proposed that combines different techniques. The results show improved
    precision and recall. In [86], a new dataset is created by combining the voted
    outputs of built models on the GA suggested features of the NSL KDD dataset based
    on five different labels, by executing kernel extreme learning machine (KELM)
    with optimized parameters using GA. The results show high accuracy, recall, and
    precision for SVM, MLP, DT, and K-NN algorithms (Table 3.3).


    # 3.8 SURVEY OF DI-ALED TECHNIQUES IN CYBER SECURITY


    In [87], a supervised approach is described that uses the RNN technique for cyber
    threats. Other research [88] uses another unsupervised approach that uses long
    term memory (LSTM) to secure channels. In [89], a supervised approach is simulated
    to identify categories of images in emails, achieving an accuracy of 75.10%. Another
    unsupervised approach [90] compares two deep neural network architectures, deep
    belief networks (DBNs), and cortical attention (CA) DNNs, for spam classification
    on the Spam dataset. The CA DNN architecture achieved higher accuracy than DBN
    with a six-layer architecture and decreasing hidden neurons, achieving an accuracy
    of 96.40%.


    Researchers [91] have also described an unsupervised approach that uses deep learning-based
    anomaly detection methods, including- denoising autoencoder (DAE), stacked autoencoder
    (SAE), generative adversarial network (GAN), and DBM-LSTM classification model,
    for detecting web attacks on the CSIC2010v2 dataset, achieving a precision, recall,
    and F1-score of 98.78%, as well as an accuracy of 98%. Another unsupervised approach
    [92] is used for cyber threat detection using KDD-99-dataset. The method achieved
    simulation results of around 94% when trained and tested on real data and 84-85%
    when trained on the KDD dataset and tested on real data. [93] describes an unsupervised
    approach to detecting false-data-injection attacks on smart grid. The experiments
    were conducted on generated data from the IEEE 14-bus, IEEE 30-bus, and IEEE 57-bus
    systems and the MATPOWER library. Table 3.4 provides information on different
    supervised, unsupervised approaches, and datasets.


