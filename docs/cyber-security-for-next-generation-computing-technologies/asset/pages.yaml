    # 6.4 SURVEY ANALYSIS


    Although the security threats have been identified across the different layers
    of IoT networks, there are many possible security threats in each layer of the
    IoT. All the commonly occurring threats to IoT security have been identified and
    discussed. All these security attacks make the IoT system vulnerable and insecure
    to use for mission-critical applications [36].


    Proposing different kinds of solutions to overcome these attacks, researchers
    have introduced many. Some have introduced cryptographic techniques to enhance
    encryption, some have introduced malware detection to detect the threats earlier,
    and some have introduced architectures that tighten security in the IoT. But not
    one solution can meet all the security requirements and make an IoT system fully
    secured. Each of them has tradeoffs


    Similarly, we have suggested many solutions to security threats based on advanced
    technologies like blockchain, machine learning, and edge computing. Although they
    provide security for IoT systems, they also have some drawbacks—some security
    issues and performance issues in the use of edge computing, blockchain-machine
    learning.


    The security of blockchain depends on how it is implemented and how the hardware
    and software are used in that implementation. As the transactions in blockchain
    made are all public, there is the chance that users'' private data can be leaked.
    With the increase of miners, the size of blockchain also increases, which decreases
    the speed of distribution across the network and increases storage cost. In turn
    leads to issues such as availability and scalability in blockchain [38].


    There are many algorithms of machine learning, and it is difficult to choose a
    suitable one for IoT security. If a wrong algorithm is selected, it may give useless
    or at least inaccurate and ineffective output. The success of a solution by machine
    learning depends on such factors, as well as the diversity of the data selected.
    Also, historical data might include missing values, ambiguous values, and meaningless
    data points. A huge amount of data is being created by the IoT systems; hence
    it is difficult to preprocess and clean that data with accuracy. Many features,
    such as removing redundancies, attributing credit, and linear regression, need
    to be considered in order to use machine learning effectively for IoT security.
