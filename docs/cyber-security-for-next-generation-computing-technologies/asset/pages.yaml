  md: '# 4 AI-Based Secure Wireless Communication Technologies and Cyber Threats for
    IoT Networks


    Usman Haider, Bakhtawar Nawal, Inam Ullah Khan, and Salma El Hajjami


    # 4.1 INTRODUCTION


    Artificial intelligence (AI) has opened countless opportunities to mankind, and
    each of them contains a world in itself. Researchers are exploring where humans
    can benefit from these emerging technologies. AI is applicable in almost every
    segment of life. However, autonomous vehicles are considered one recent application
    in this field of study [1]. Tesla is renowned for introducing driver-less cars.
    Further, AI-enabled medicines are very helpful in pandemic. Therefore, due to
    artificial intelligence, the detection and diagnosis of many deadly diseases are
    made possible. Various diseases are now being diagnosed by systems based on AI.
    Also, cancerous/tumor cells are easily monitored using AI models that are used
    to decrease the fatality rate [2, 3]. Moreover has found many applications in
    cardiology, neurology, and dermatology. For the purpose of data and information,
    end devices are used to safeguard networks from intrusion. More interestingly,
    intrusion detection systems (IDS) and intrusion prevention systems (IPS) powered
    by artificial intelligence can easily detect threats [4, 5]. All industries are
    on their way to automation AI has created a lot of room for progress [6]. AI tools
    are in much demand because they can easily make them decisions. AI-based systems
    are comprised of wireless sensor nodes that constantly monitor factors related
    to crops [7]. Figure 4.1 demonstrates the use of artificial intelligence in cyber
    security, autonomous vehicles, ad hoc networks, healthcare, and voice assistants.


    Wireless communication networks received attention from day now. The world is
    about to launch sixth generation (6G) wireless networks commercially, which are
    going to transform the world into a new place. Automation is necessary in the
    modern world; it drives AI-enabled networks to achieve various goals [8]. Wireless
    communication networks use wireless channels for a variety of communication needs
    [9, 10]. Advance networks are used in television, radio broadcasting,'
