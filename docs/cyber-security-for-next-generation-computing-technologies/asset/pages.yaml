    type approval. The entire vehicle, each system, and how they work together must
    be taken into account during the risk assessment [11]. Those important parts to
    be identified in the risk assessment are constructed and secured so that the risk
    is decreased to a manageable level. Elements consist of:


    +   - Vehicle systems and architecture.

    - Systems and components that are pertinent to cyber security.

    - Interactions between cyber-security-related parts and systems and other internal
    and external systems in the vehicle to show that all risks are sufficiently mitigated;
    the chain from recognized risk to mitigation strategy applied to test outcome
    must be followed. It is necessary to have a specialized and secure environment.
    If vehicle supports the execution or storage of aftermarket software, services,
    or data, the necessary data must gathered throughout the whole supply chain and
    confirmed [26].


    # 2.9 STATE-OF-THE-ART OF AUTOMIVE SECURITY FRAMEWORK


    A procedural structure for achieving cyber security over the whole life cycle
    of the vehicle is what UNECE demands. Every stakeholder with the ability to affect
    cyber security must be covered. By using this framework, the maker should be able
    to show why the vehicle''s cyber security is successful, even currently no comprehensive
    framework has been developed at the beginning. In the following sections, we will
    provide an overview of the:


    +   1. Current cyber security procedures for the automobile industry.

    2. Current assurance techniques.

    During the process, we must choose between:

    3. Methods for handling cyber security in pre-production, production, and post-production.

    4. Processes addressing the automotive domain''s scattered nature.

    5. Risk management processes to be used to outline the first set of procedures,
    whereby the automotive supply chain management can be used to summarize the second
    set [39].


    # 2.9.1 AUTOMOTIVE CYBER SECURITY RISK MANAGEMENT


    In ISO 31000 [23], generic risk management processes are described. However, risk
    management is characterized as an iterative process that must be carried out'
