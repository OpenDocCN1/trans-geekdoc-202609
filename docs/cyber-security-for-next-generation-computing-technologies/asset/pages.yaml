    In unmanned aerial vehicle (UAV) communication, the collection of data sent and
    received is the key factor in this technology. Through this type of network, a
    massive situational awareness in emergency response, disaster management, and
    security processes are enabled by using pattern recognition approaches [64]. Most
    of the time, they provide lots of data where security is risk, in a dark area
    or away from any eyewitness; camera sensors recognize an incident. For example,
    road accidents can be minimized by UAV-2-UAVs. UAVs are resource control communication
    systems that minimize mishap accidents [65].


    On the other hand, security is an issue of its own in UAVs. Due to its wireless
    medium, it holds all information in intervals. In the latter types of security
    mechanisms to protect the networks are discussed: cryptography and the intrusion
    detection system mechanism [66]. The basis of research in the expansion of UAVs
    is the expansion of control systems. At the current state of development, the
    problem of automatic flight control has been solved, but the problem of regulatory
    intelligent safety mechanisms has not been fully cracked [67]. The encryption
    process can be implemented on all devices that are connected to UAVs. Flight control,
    MANET, and ad hoc networks can be processed by their hardware mechanism as well
    as their software mechanism, and the mission is provided by the control system
    [68].


    One study has led to the invention of security mechanisms based on artificial-intelligence-based
    communication and classification for UAVs: the Effective Emergency Monitoring
    System (AISCC-DE2MS):


    +   1. AISCC-DE2MS performs the artificial gorilla unity optimizer (AGTO) algorithm
    with ECC-El Gamal encryption technology to provide security mechanisms.

    2. The AISCC-DE2MS model for instant-based state arrangement features dense net
    network feature extraction (dense net), penguin search optimization (PSO) hyperparameter
    tuning, and instant-based classification, long short-term memory (LSTM).


    Simulation analysis of the AISCC-DE2MS model is performed using the AIDER database.'
