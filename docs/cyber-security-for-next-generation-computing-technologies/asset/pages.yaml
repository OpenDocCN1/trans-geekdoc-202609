    - Protection of the cloud, as the centralized point for data storage, with proper
    security (Making data encrypted in the cloud can minimize the risk of stealing
    the data [11]).

    - Use of intelligent techniques of AI and machine learning for reducing human
    intervention and computational burden [12]

    - Centralized environment for communication devices'
