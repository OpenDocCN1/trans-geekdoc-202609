    # 12.5 PRIVACY AND MANAGEMENT IN THE INTELLIGENT TRANSPORTATION SYSTEMS


    The intelligent transportation system works dynamically in nonlinear sophisticated
    systems. In these types of networks, they depend on a source of information, which
    is provided on a real timeline. Multi-agent cooperators work in ad-hoc-based networks,
    which may mislead the information related to the task and put ITS management and
    privacy at risk [53].


    Attackers could be tempted to the authorized supervision and fairly confidential
    information. These malicious actors can enable attackers to easily access top-secret
    records internally and externally. An external attacker may constantly control
    the connection and examine traffic information, but the information cannot be
    interpreted. On the other hand, internal attackers, such as malicious agents or
    employees, have full authority to control public and private information of transportation
    networks. Consequently, if governors showed compromised behavior, they can become
    strong attackers. The following attacking scenarios were a part of the study [55].


    +   1. Impersonation of Genuine Staff: The attacker appears to be a staff member
    and access confidential information.

    2. Malicious Staff: Malicious actions can lead to unauthorized access to information
    and serious emergencies.

    3. Greedy Staff: Greedy staff takes advantage of their privilege and generate
    needless trouble such as traffic jams, lane blocking, etc.


    For reason, intelligent privacy and security technologies are needed to obfuscate
    things for attackers, or strategies are needed to find these connected entities.
    These steps are necessary to detect malicious content. Significantly, researchers
    have been working on how to achieve privacy using public key infrastructure (PKI)
    [56]. Two types of encryption rules allow the implementation of privacyaware policies.


    +   1. Policy-Based Encryption: This cryptographic primitive needs data for encryption
    regarding policies.

    2. Policy-Based Signature: These cryptographic primitives create digital signatures
    based on policies agreed upon between establishments. These cryptographic benefits
    include privacy policy creation, automatic trust negotiation, trust generation,
    access control, etc. [57].


