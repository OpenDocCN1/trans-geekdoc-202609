  md: '# #15 Blockchain Security Measures to Combat Cyber Crime


    Rahmeh Ibrahim and Qasem Abu Al-Haija


    # ##15.1 INTRODUCTION


    Both the business world and academia have recently paid close attention to cryptocurrencies.
    By 2023, the capital market for Bitcoin, frequently referred to as the first cryptocurrency,
    will reach US$24 million [1]. Bitcoin’s main working component is the blockchain.
    The year 2009 saw the implementation of a proposal that had surfaced recently.
    All committed transactions are kept in a chain of blocks in a public ledger called
    the blockchain. This chain expands each time a new block is added. The decentralization,
    persistence, anonymity, and audibility of blockchain technology are significant
    characteristics [2].


    Blockchain can work in a decentralized setting because it combines several technologies,
    such as distributed consensus mechanisms, digital signatures based on asymmetric
    cryptography, and cryptographic hashing. A transaction can be carried out decentralized
    using blockchain technology. Blockchain has the potential to cut costs while also
    greatly boosting efficiency. Blockchain can be used for various types of cryptocurrencies,
    even though Bitcoin is the most well-known application. Digital assets, remittances,
    and online payments are just a few services that can benefit from using blockchain
    because it eliminates the need for a bank or other intermediary [3, 4].


    The next generation of Internet connections comprises IoT, smart contracts, public
    utilities, reputation mechanisms, and security provisions. One of the most promising
    methods for doing this is blockchain technology [5–7].


    Even blockchain technology has great potential for creating new Internet infrastructure,
    it is plagued by several technical problems. First, scalability is a significant
    issue. A new block of Bitcoin is mined every 10 minutes, and block sizes are currently
    restricted to 1 MB. As a result, Bitcoin can only process 7 transactions/second,
    making it unfit for high-frequency trading. Second, a selfish mining strategy
    has been shown to allow miners to profit beyond their share of earnings [8]. To
    increase their future earnings, miners hide their extrated blocks. As a result,
