    To ensure these recommendations are properly implemented within an organization,
    it is important to create a PSSI (information system security policy), which governs
    the company’s information system. This is an integral part of ISMS (information
    security management system), which provides a framework for how security is managed
    globally in the company. In particular, it addresses the three principles of security:
    confidentiality, integrity, and availability.


    Finally, the implementation of an ISMS is based on ISO standards, such as ISO27001,
    which defines the requirements.


