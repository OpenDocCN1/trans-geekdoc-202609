    be remedied in order to increase SG, privacy, and trust. In order to aid researchers
    in this emerging field, it is essential to introduce innovative ways to ensure
    the safety of function. Therefore, through optimal operation of SG, this can become
    reality. Moreover, future research directions from both the technological and
    human aspects were presented.


