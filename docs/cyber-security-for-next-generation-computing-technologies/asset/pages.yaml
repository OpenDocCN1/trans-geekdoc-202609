    # 6.2.5 APPLICATION LAYER ATTACKS


    Services are provided by the application layer to the user. The security attacks
    in the application layer are as follows (Figure 6.5):


    +   - Access-Control Attacks: Access control relates to the authorization of the
    authenticated users. If this access is compromised, the whole IoT system is susceptible.


    +   - Reprogramming Attack: Attackers can reprogram IoT objects in embedded-firmware-based
    devices and achieve their aims by hijacking the whole system.


    +   - Sniffing Attacks: Sniffing into the applications lets the adversaries knowledge
    of the network traffic and sometimes learn passwords and usernames, making the
    system vulnerable. The adversaries can gain access to confidential information
    if the system is left with no security [10].


