  - P9. 在本题中，我们探讨 Diffie-Hellman（DH）公钥加密算法，该算法允许两个实体同意使用一个共享密钥。DH 算法使用一个大素数 $p$ 和另一个小于
    $p$ 的大数 $g$。$p$ 和 $g$ 都是公开的（因此攻击者会知道它们）。在 DH 中，Alice 和 Bob 各自独立选择秘密密钥，分别为 $S_A$
    和 $S_B$。然后 Alice 通过将 $g$ 提升到 $S_A$ 然后取模 $p$ 来计算她的公钥 $T_A$。Bob 类似地通过将 $g$ 提升到 $S_B$
    然后取模 $p$ 来计算他自己的公钥 $T_B$。然后 Alice 和 Bob 通过互联网交换他们的公钥。然后 Alice 通过将 $T_B$ 提升到 $S_A$
    然后取模 $p$ 来计算共享秘密密钥 $S$。类似地，Bob 通过将 $T_A$ 提升到 $S_B$ 然后取模 $p$ 来计算共享密钥 $S'$。
