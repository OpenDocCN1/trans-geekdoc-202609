    torrent 中冒充一个善意的对等节点并向 torrent 中少数对等节点发送伪造块来大搞破坏。这些不明真相的对等节点随后将这些伪造块重新分配给其他对等节点，后者又将这些伪造块重新分配给更多的对等节点。因此，BitTorrent
