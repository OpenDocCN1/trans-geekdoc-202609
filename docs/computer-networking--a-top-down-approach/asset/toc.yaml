  - 习题 P32. 考虑图 6.30 中具有分层拓扑的数据中心网络。假设现在有 80 对流量流，其中第一机柜和第九机柜之间有 10 条流，第二机柜和第十机柜之间有
    10 条流，以此类推。进一步假设，除了主机和 TOR 交换机之间的链路为 1 Gbps 外，网络中所有链路均为 10 Gbps。
- - '####'
  - 习题 P33. 考虑图 6.30 中的分层网络，并假设数据中心需要支持电子邮件和视频分发等其他应用程序。假设四个机架的服务器保留用于电子邮件，四个机架保留用于视频。对于每个应用程序，所有四个机架必须位于单个二层交换机之下，因为二层到一层链路的带宽不足以支持应用内流量。对于电子邮件应用程序，假设在
    99.9% 的时间里只使用三个机架，并且视频应用程序具有相同的使用模式。
