- - '##'
  - 8. 你配置访问控制系统，使得当门上的锁具系统发生故障时，它会处于锁定状态。这被称为以下哪一项？
- - '##'
  - 9. 你们组织的高级安全官希望降低某人通过旁观员工使用按键密码锁而获取设施访问权限的可能性。你会建议以下哪种安全控制措施？
- - '##'
  - 10. 你们公司的销售经理在未来几个月将频繁出差。大多数行程路程较长，这意味着销售经理将在机场的充电站为公司智能手机充电。你会实施什么安全控制措施来降低将公司手机连接到公共充电站所涉及的风险？
- - '##'
  - 实施环境控制
- - '##'
  - 11. 你配置数据中心，使得每个通道中的所有机柜相对而立。你采用此配置的目标是什么？
- - '##'
  - 12. 你们公司的取证官员没收了一名员工的手机，并将在手机上寻找与商业间谍活动相关的证据。取证官员应该把手机放在什么里面？
- - '##'
  - 13. 你是 ABC 公司的安全官员，负责设计公司数据中心的安全策略。你会使用以下哪种控制措施来确保数据中心内所有设备的最佳温度？
- - '##'
  - 基于性能的题目
- - '##'
  - 14. 使用以下展品，识别列出的哪些安全技术用于数据中心，哪些用于设备安全。并非所有项目都需要放入列中。
