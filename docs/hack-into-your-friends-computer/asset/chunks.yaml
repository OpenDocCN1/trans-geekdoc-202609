- fmt: '

    # Hack into your Friends Computer


    ## Start


    ## Important / Introduction / Copyright


    ### Important

    The author is not responsible for any abuse of this information. It is intended
    for educational use only. You may be quite shocked at how vulnerable you are!
    As an afterthought I added a section on database access due to a number of requests.


    The majority of successful attacks on computer systems via the Internet can be
    traced to exploitation of security flaws in software and operating systems. These
    few software vulnerabilities account for the majority of successful attacks, simply
    because attackers are opportunistic – taking the easiest and most convenient route.
    They exploit the best-known flaws with the most effective and widely available
    attack tools.


    Most software, including operating systems and applications, comes with installation
    scripts or installation programs. The goal of these installation programs is to
    get the systems installed as quickly as possible, with the most useful functions
    enabled, with the least amount of work being performed by the administrator. To
    accomplish this goal, the scripts typically install more components than most
    users need. The vendor philosophy is that it is better to enable functions that
    are not needed, than to make the user install additional functions when they are
    needed.


    This approach, although convenient for the user, creates many of the most dangerous
    security vulnerabilities because users do not actively maintain and patch software
    components they don’t use. Furthermore, many users fail to realize what is actually
    installed, leaving dangerous samples on a system simply because users do not know
    they are there. Those unpatched services provide paths for attackers to take over
    computers.


    For operating systems, default installations nearly always include extraneous
    services and corresponding open ports. Attackers break into systems via these
    ports. In most cases, the fewer ports you have open, the fewer avenues an attacker
    can use to compromise your network.


    For applications, default installations usually include unneeded sample programs
    or scripts. One of the most serious vulnerabilities with web servers is sample
    scripts; attackers use these scripts to compromise the system or gain information
    about it. In most cases, the system administrator whose system is compromised
    did not realize that the sample scripts were installed. Sample scripts are a problem
    because they usually do not go through the same quality control process as other
    software. In fact they are shockingly poorly written in many cases. Error checking
    is often forgotten and the sample scripts offer a fertile ground for buffer overflow
    attacks.


    The simplest means to gain access to a system is by simple file and printer sharing.
    This is used to allow others on say, a home local area network share files, printers,
    and internet connections. If the computer having file and printer sharing enabled,
    this in fact allows these resources to be shared, and on offer, to the entire
    internet! This is largely due to the fact that `Netbios` was originally intended
    for use on local area networks (`LAN’s`), where trusted sharing of resources made
    sense for many reasons. It was never intended to ‘go global’.


    ### Start

    First, search using a `Netbios scanner`, for a system with sharing enabled. A
    program such as `Netbrute`, by `Raw Logic Software`, is ideal. These programs
    can help the would-be hacker, as well as the network administrator. Run the scan
    over a subnet at a time, for example an IP address range from `80.1.1.1` to `80.1.1.254`.
    Choose a system which has, preferably, it’s whole hard disk

    '
