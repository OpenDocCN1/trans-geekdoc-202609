    could have put micro ’back-to-front’ across the line and sent a ENQ to see if
    an ID would be sent back. Instead he tried something less obvious.  The terminal
    was known to be programmable, provided one knew how and had the right type of
    keyboard. Engineers belonging to the service had been seen doing just that. How
    could the hacker acquire ’engineer’ status? He produced the following hypothesis:
    the keyboard used by the service’s customers was a simple affair, lacking many
    of the obvious keys used by normal terminals; the terminal itself was manufactured
    by the same company that produced a range of editing terminals for viewdata operators
    and publishers. Perhaps if one obtained a manual for the editing terminal, important
    clues might appear. A suitable photocopy was obtained and, lo and behold, there
    were instructions for altering terminal IDs, setting auto-diallers and so on.  Linux
    & Unix for beginners  Unix has become the primo operating system of the Internet.
    In fact, Unix is the most widely used operating system in the world among computers
    with more power than PCs. True, Windows NT is coming up fast as a common Internet
    operating system. But today Unix in all its flavours still is the operating system
    to know in order to be a truly elite hacker. So far we have assumed that you have
    been hacking using a shell account that you get through your Internet Service
    Provider (ISP). A shell account allows you to give Unix commands on one of your
    ISP''s computers. But you don''t need to depend on your ISP for a machine that
    lets you play with Unix. You can run Unix on your own computer and with a SLIP
    or PPP connection be directly connected to the Internet.  Note: Serial Line Internet
    Protocol (SLIP) and Point-to-Point Protocol (PPP) connections give you a temporary
    Internet Protocol (IP) address that allows you to be hooked directly to the Internet.
    You have to use either SLIP or PPP connections to get to use a Web browser that
    gives you pictures instead on text only. So if you can see pictures on the Web,
    you already have one of these available to you. The advantage of using one of
    these direct connections for your hacking activities is that you will not leave
    behind a shell log file for your ISP''s sysadmin to study. Even if you are not
    breaking the law, a shell log file that shows you doing lots of hacking can be
    enough for some sysadmins to summarily close your account.  What is the best kind
    of computer to run Unix on? Unless you are a wealthy hacker who thinks nothing
    of buying a Sun SPARC workstation, you''ll probably do best with some sort of
    PC. There are almost countless variants of Unix that run on PCs, and a few for
    Macs. Most of them are free for download, or inexpensively available on CD-ROMs.
    The three most common variations of Unix that run on PCs are Sun''s Solaris, FreeBSD
    and Linux. Solaris costs around $700. Enough said. FreeBSD is very good indeed.  Linux,
    however, has the advantage of being available in many variants (so you can have
    fun mixing and matching programs from different Linux offerings). Most importantly,
    Linux is supported by many manuals, news groups, mail lists and Web sites. out.  Historical
    note: Linux was created in 1991 by a group led by Linus Torvalds of the University
    of Helsinki. Linux is copyrighted under the GNU General Public License. Under
    this agreement, Linux may be redistributed to anyone along with the source code.
    Anyone 15  can sell any variant of Linux and modify it and repackage it. But even
    if someone modifies the source code he or she may not claim copyright for anything
    created from Linux. Anyone who sells a modified version of Linux must provide
    source code to the buyers and allow them to reuse it in their commercial products
    without charging licensing fees. This arrangement is known as a "copyleft." Under
    this arrangement the original creators of Linux receive no licensing or shareware
    fees. Linus Torvalds and the many others who have contributed to Linux have done
    so from the joy of programming and a sense of community with all of us who will
    hopefully use Linux in the spirit of good guy hacking. Viva Linux! Viva Torvalds!  Linux
    consists of the operating system itself (called the "kernel") plus a set of associated
    programs.  The kernel, like all types of Unix, is a multitasking, multi-user operating
    system. Although it uses a different file structure, and hence is not directly
    compatible with DOS and Windows, it is so flexible that many DOS and Windows programs
    can be run while in Linux. So a power user will probably want to boot up in Linux
    and then be able to run DOS and Windows programs from Linux. Associated programs
    that come with most Linux distributions may include:  \* a shell program (Bourne
    Again Shell \-- BASH \-- is most common);  \* compilers for programming languages
    such as Fortran-77 (my favorite!), C, C++, Pascal, LISP, Modula-2, Ada, Basic
    (the best language for a beginner), and Smalltalk.;  \* X (sometimes called X-windows),
    a graphical user interface  \* utility programs such as the email reader Pine
    (my favorite) and Elm Top ten reasons to install Linux on your PC:  1.When Linux
    is outlawed, only outlaws will own Linux.  2\. When installing Linux, it is so
    much fun to run fdisk without backing up first.  3.The flames you get from asking
    questions on Linux newsgroups are of a higher quality than the flames you get
    for posting to alt.sex.bestiality.  4.No matter what flavor of Linux you install,
    you''ll find out tomorrow there was a far more 3l1te ersion you should have gotten
    instead.  5.People who use Free BSD or Solaris will not make fun of you. They
    will offer their sympathy instead.  6.At the next Def Con you''ll be able to say
    stuph like "so then I su-ed to his account and grepped all his files for ''kissyface''."
    Oops, grepping other people''s files is a no-no, forget I ever suggested it.  7.Port
    surf in privacy.  8.One word: exploits.  9.Installing Linux on your office PC
    is like being a postal worker and bringing an Uzi to work.  10.But \- \- if you
    install Linux on your office computer, you boss won''t have a clue what that means.  What
    types of Linux work best? It depends on what you really want. Redhat Linux is
    famed for being the easiest to install. The Walnut Creek Linux 3.0 CD-ROM set
    is also really easy to install \-- for Linux, that is! My approach has been to
    get lots of Linux versions and mix and match the best from each distribution.
    I like the Walnut Creek version best because with my brand X hardware, its autodetection
    feature was a life-saver.  INSTALLING LINUX is not for the faint of heart! Several
    tips for surviving installation are: 1) Although you in theory can run Linux on
    a 286 with 4 MB RAM and two floppy drives, it is \*much\* easier with a 486 or
    above with 8 MB RAM, a CD-ROM, and at least 200 MB free hard disk space.  2) Know
    as much as possible about what type of mother board, modem, hard disk, CD-16  ROM,
    and video card you have. If you have any documentation for these, have them on
    hand to reference during installation.  3) It works better to use hardware that
    is name-brand and somewhat out-of-date on your computer. Because Linux is freeware,
    it doesn''t offer device drivers for all the latest hardware. And if your hardware
    is like mine \-- lots of Brand X and El Cheapo stuph, you can take a long time
    experimenting with what drivers will work.  4) Before beginning installation,
    back up your hard disk(s)! In theory you can install Linux without harming your
    DOS/Windows files. But we are all human, especially if following the advice of
    point 7).  5) Get more than one Linux distribution. The first time I successfully
    installed Linux, I finally hit on something that worked by using the boot disk
    from one distribution with the CD-ROM for another. In any case, each Linux distribution
    had different utility programs, operating system emulators, compilers and more.
    Add them all to your system and you will be set up to become beyond elite.  6)
    Buy a book or two or three on Linux. I didn''t like any of them! But they are
    better than nothing. Most books on Linux come with one or two CD-ROMs that can
    be used to install Linux. But I found that what was in the books did not exactly
    coincide with what was on the CD-ROMs.  7) I recommend drinking while installing.
    It may not make debugging go any faster, but at least you won''t care how hard
    it is.  Now I can almost guarantee that even following all these 6 pieces of advice,
    you will still have problems installing Linux. Oh, do I have 7 advisories up there?
    Forget number 7\.  But be of good cheer. Since everyone else also suffers mightily
    when installing and using Linux, the Internet has an incredible wealth of resources
    for the Linux \-challenged.  If you are allergic to getting flamed, you can start
    out with Linux support Web sites.  The best I have found is http://sunsite.unc.edu:/pub/Linux/.
    It includes the Linux Frequently Asked Questions list (FAQ), available from sunsite.unc.edu:/pub/Linux/docs/FAQ.  In
    the directory /pub/Linux/docs on sunsite.unc.edu you''ll find a number of other
    documents about Linux, including the Linux INFO-SHEET and META-FAQ, The Linux
    HOWTO archive is on the sunsite.unc.edu Web site at:  /pub/Linux/docs/HOWTO. The
    directory /pub/Linux/docs/LDP contains the current set of LDP manuals. You can
    get \`\`Linux Installation and Getting Started'' from sunsite.unc.edu in /pub/Linux/docs/LDP/install-guide.
    The README file there describes how you can order a printed copy of the book of
    the same name (about 180 pages).  Now if you don''t mind getting flamed, you may
    want to post questions to the amazing number of Usenet news groups that cover
    Linux. These include: comp.os.linux.advocacy Benefits of Linux compared comp.os.linux.development.system
    Linux kernels, device drivers comp.os.linux.x Linux X Window System servers  comp.os.linux.development.apps
    Writing Linux applications comp.os.linux.hardware Hardware compatibility  comp.os.linux.setup
    Linux installation  comp.os.linux.networking Networking and communications comp.os.linux.answers
    FAQs, How-To''s, READMEs, etc.  linux.redhat.misc  alt.os.linux Use comp.os.linux.\*
    instead  alt.uu.comp.os.linux.questions Usenet University helps you comp.os.linux.announce
    Announcements important to Linux 17  comp.os.linux.misc Linux-specific topics
    Want your Linux free? Tobin Fricke has pointed out that "free copies of Linux
    CD-ROMs are available the Linux Support & CD  Givaway web site at http://emile.math.ucsb.edu:8000/giveaway.html.
    This is a project where people donate Linux CD''s that they don''t need any more.
    The project was seeded by Linux Systems Labs, who donated 800 Linux CDs initially!
    Please remember to donate your Linux CD''s when you are done with them. If you
    live near a computer swap meet, Fry''s, Microcenter, or other such place, look
    for Linux CD''s there. They are usually under $20, which is an excellent investment.
    I personally like the Linux Developer''s Resource by Infomagic, which is now up
    to a seven CD set, I believe, which includes all major Linux distributions (Slackware,
    Redhat, Debian, Linux for DEC Alpha to name a few)plus mirrors of tsx11.mit.edu
    and sunsite.unc.edu/pub/linux plus much more. You should also visit the WONDERFUL
    linux page at http://sunsite.unc.edu/linux, which has tons of information, as
    well as the http://www.linux.org/. You might also want to check out http://www.redhat.com/
    and http://www.caldera.com/ for more information on commercial versions of linux
    (which are still freely available under GNU)."  What about Linux security? Yes,
    Linux, like every operating system, is imperfect. Eminently hackable, if you really
    want to know. So if you want to find out how to secure your Linux system, or if
    you should come across one of the many ISPs that use Linux and want to go exploring
    (oops, forget I wrote that), here''s where you can go for info: ftp://info.cert.org/pub/cert\_advisories/CA-94:01.network.monitoring.attacks
    ftp://info.cert.org/pub/tech\_tips/root\_compromise http://bach.cis.temple.edu/linux/linux-security/
    http://www.geek-girl.com/bugtraq/ There is also help for Linux users on Internet
    Relay Chat (IRC). Ben (cyberkid@usa.net) hosts a channel called #LinuxHelp on
    the Undernet IRC server.  Brief SQL Reference  To get all columns of a table without
    typing all column names, use: SELECT \* FROM  TableName; To get the total number
    of tuples (rows): SELECT Count(\*); FROM EMPLOYEE  To get the total number of
    female employees in reception: SELECT Count (\*) FROM  EMPLOYEE WHERE sex \= ‘m’
    AND Department \= ‘reception’; Relational Operators  There are six Relational
    Operators in SQL, and after introducing them, we’ll see how they’re used: \= Equal
    <> or != Not Equal < Less Than \> Greater Than <= Less Than or Equal To \>=  Greater
    Than or Equal To  For example, if you wanted to see the EMPLOYEE ID NO’s of those
    making at least, or over $50,000, use the following:  SELECT EMPLOYEEIDNO FROM
    EMPLOYEESTATISTICSTABLE WHERE SALARY \>=  50000;  Notice that the \>= (greater
    than or equal to) sign is used, as we wanted to see those who made greater than
    $50,000, or equal to $50,000, listed together.  The WHERE description, SALARY
    \>= 50000, is known as a condition (an operation which evaluates to True or False)
    . The same can be done for text columns: 18  SELECT EMPLOYEEIDNO FROM EMPLOYEE
    STATISTICSTABLE WHERE POSITION \=  ‘Manager’;  This displays the ID Numbers of
    all Managers.  More Complex Conditions: Compound Conditions / Logical Operators
    The AND operator joins two or more conditions, and displays a row only if that
    row’s data satisfies ALL conditions listed (i.e. all conditions hold true). For
    example, to display all staff making over $40,000, use:  SELECT EMPLOYEIDNO  FROM
    EMPLOYEESTATISTICSTABLE  WHERE SALARY \> 40000 AND POSITION \= ‘Staff’;  The OR
    operator joins two or more conditions, but returns a row if ANY of the conditions
    listed hold true. To see all those who make less than $40,000 or have less than
    $10,000 in benefits, listed together, use the following query:  SELECT EMPLOYEEIDNO
    FROM EMPLOYEESTATISTICSTABLE WHERE SALARY < 40000 OR BENEFITS < 10000  AND & OR
    can be combined, for example:  SELECT EMPLOYEEIDNO  FROM EMPLOYEESTATISTICSTABLE  WHERE
    POSITION \= ‘Manager’ AND SALARY \> 60000 OR BENEFITS \> 12000; First, SQL finds
    the rows where the salary is greater than $60,000 and the position column is equal
    to Manager, then taking this new list of rows, SQL then sees if any of these rows
    satisfies the previous AND condition or the condition that the Benefits column
    is greater than $12,000.  Subsequently, SQL only displays this second new list
    of rows, keeping in mind that anyone with Benefits over $12,000 will be included
    as the OR operator includes a row if either resulting condition is True. Also
    note that the AND operation is done first. This is a law of Boolean algerbra.
    This is analogous to  the principle of mathematics which state that ‘multiplication
    and division take precedence over addition and subtraction’.  To perform OR’s
    before AND’s, like if you wanted to see a list of employees making a large salary
    (>$50,000) or have a large benefit package (>$10,000), and that happen to be a
    manager, use parentheses:  SELECT EMPLOYEEIDNO  FROM EMPLOYEESTATISTICSTABLE  WHERE
    POSITION \= ‘Manager’ AND (SALARY \> 50000 OR BENEFIT \> 10000); IN & BETWEEN  19  An
    easier method of using compound conditions uses IN or BETWEEN. For example, if
    you wanted to list all managers and staff:  SELECT EMPLOYEEIDNO FROM EMPLOYEESTATISTICSTABLE
    WHERE POSITION  IN (‘Manager’, ‘Staff’); or to list those making greater than
    or equal to $30,000, but less than or equal to $50,000, use:  SELECT EMPLOYEEIDNO
    FROM EMPLOYEESTATISTICSTABLE WHERE SALARY  BETWEEN 30000 AND 50000;  To list everyone
    not in this range, try:  SELECT EMPLOYEEIDNO FROM EMPLOYEESTATISTICSTABLE WHERE
    SALARY  NOT BETWEEN 30000 AND 50000; Similarly, NOT IN lists all rows excluded
    from the IN list.  Additionally, NOT’s can be thrown in with AND’s & OR’s, except
    that NOT is a unary operator (evaluates one condition, reversing its value, whereas,
    AND’s & OR’s evaluate two conditions), and that all NOT’s are performed before
    any AND’s or OR’s.  SQL Order of Logical Operations (each operates from left to
    right) 1\. NOT 2\. AND 3\. OR  Using LIKE  If you wanted to see all people whose
    last names started with “L”; try: SELECT  EMPLOYEEIDNO FROM EMPLOYEESTATISTICSTABLE
    WHERE LASTNAME LIKE  ‘L%’; The percent sign (%) is used to represent any possible
    character (number, letter, or punctuation) or set of characters that might appear
    after the “L”. To find those people with LastName’s ending in “L”, use ‘%L’, or
    if you wanted the “L” in the middle of the word, try  ‘%L%’. The ‘%’ can be used
    for any characters in the same position relative to the given characters. NOT
    LIKE displays rows not fitting the given description. Other possiblities of using
    LIKE, or any of these discussed conditionals, are available, though it depends
    on what DBMS  you are using; as usual, consult a manual for the available features
    on your system, or just to make sure that what you are trying to do is available
    and allowed. This disclaimer holds for the features of SQL that will be discussed
    below. This section is just to give you an idea of the possibilities of queries
    that can be written in SQL.  Joins  In this section, we will only discuss inner
    joins, and as in general, they are the most useful. For more information, refer
    to an SQL manual.  Good database design suggests that each table lists data only
    about a single and detailed information can be obtained in a relational database,
    by using additional tables, and by using a  First, take a look at these example
    tables:  AntiqueOwners  OwnerID OwnerLastName OwnerFirstName 01 Jones Bill 02
    Smith Bob 15 Lawson Patricia 21 Akins Jane 50 Fowler Sam  20  Orders  OwnerID
    ItemDesired 02 Table 02 Desk 21 Chair 15 Mirror Antiques  SellerID BuyerID Item
    01 50 Bed 02 15 Table 15 02 Chair 21 50 Mirror 50 01 Desk 01 21  Cabinet 02 21
    Coffee Table 15 50 Chair 01 15 Jewelry Box 02 21 Pottery 21 02 Bookcase 50 01  Plant
    Stand  Keys  First, let’s discuss the concept of A primary key is a column or
    set of columns that uniquely identifies the rest of the data in any given row.
    For example, in the AntiqueOwners table, the OwnerID column uniquely identifies
    that row. This means two things: no two rows can have the same OwnerID, and, even
    if two owners have the same first and last names, the OwnerID column ensures that
    the two owners will not be confused with each other, because the unique OwnerID  column
    will be used throughout the database to track the owners, rather than the names.  A
    foreign key is a column in a table where that column is a primary key of another
    table, which means that any data in a foreign key column must have corresponding
    data in the other table where that column is the primary key. In DBMS-speak, this
    correspondence is known as referential For example, in the Antiques table, both
    the BuyerID and SellerID are foreign keys to the primary key of the AntiqueOwners
    table (OwnerID; for purposes of argument, one has to be an Antique Owner before
    one can buy or sell any items), as, in both tables, the ID  rows are used to identify
    the owners or buyers and sellers, and that the OwnerID is the primary key of the
    AntiqueOwners table. In other words, all of this “ID” data is used to refer to
    the owners, buyers, or sellers of antiques, themselves, without having to use
    the actual names.  Performing a Join  The purpose of these keys is so that data
    can be related across tables, without having to repeat data in every table— this
    is the power of relational databases. For example, you can find the names of those
    who bought a chair without having to list the full name of the buyer in the Antiques
    table...you can get the name by relating those who bought a chair with the names
    in the AntiqueOwners table through the use of the OwnerID, which relates the data
    in the two tables. To find the names of those who bought a chair, use the following
    query:  SELECT OWNERLASTNAME, OWNERFIRSTNAME  FROM ANTIQUEOWNERS, ANTIQUES  WHERE
    BUYERID \= OWNERID AND ITEM \= ‘Chair’;  Note the following about this query...notice
    that both tables involved in the relation are listed in the FROM clause of the
    statement. In the WHERE clause, first notice that the ITEM \= ‘Chair’  part restricts
    the listing to those who have bought (and in this example, thereby owns) a chair.  Secondly,
    notice how the ID columns are related from one table to the next by use of the
    BUYERID \= OWNERID clause. Only where ID’s match across tables and the item purchased
    is a chair (because of the AND), will the names from the AntiqueOwners table be
    listed. Because the joining condition used an equal sign, this join is called
    an The result of this query is two names: Smith, Bob & Fowler, Sam.  21  Dot notation
    refers to prefixing the table names to column names, to avoid ambiguity, as follows:  SELECT
    ANTIQUEOWNERS.OWNERLASTNAME,  ANTIQUEOWNERS.OWNERFIRSTNAME  FROM ANTIQUEOWNERS,
    ANTIQUES  WHERE ANTIQUES.BUYERID \= ANTIQUEOWNERS.OWNERID AND ANTIQUES.ITEM  \=
    ‘Chair’;  As the column names are different in each table, however, this wasn’t
    necessary.  DISTINCT and Eliminating Duplicates Let’s say that you want to list
    the ID and names of only those people who have sold an antique.  Obviously, you
    want a list where each seller is only listed once—you don’t want to know how many
    antiques a person sold, just the fact that this person sold one (for counts, see
    the Aggregate Function section below). This means that you will need to tell SQL
    to eliminate duplicate sales rows, and just list each person only once. To do
    this, use the DISTINCT keyword.  First, we will need an equijoin to the AntiqueOwners
    table to get the detail data of the person’s LastName and FirstName. However,
    keep in mind that since the SellerID column in the Antiques table is a foreign
    key to the AntiqueOwners table, a seller will only be listed if there is a row
    in the AntiqueOwners table listing the ID and names. We also want to eliminate
    multiple occurences of the SellerID in our listing, so we use DISTINCT on the
    column where the repeats may occur.  To throw in one more twist, we will also
    want the list alphabetized by LastName, then by FirstName (on a LastName tie).
    Thus, we will use the ORDER BY clause:  SELECT DISTINCT SELLERID, OWNERLASTNAME,
    OWNERFIRSTNAME FROM  ANTIQUES, ANTIQUEOWNERS WHERE SELLERID \= OWNERID ORDER BY  OWNERLASTNAME,
    OWNERFIRSTNAME;  In this example, since everyone has sold an item, we will get
    a listing of all of the owners, in alphabetical order by last name. For future
    reference (and in case anyone asks), this type of join is considered to be in
    the category of inner joins. Please note that by no means is this a complete reference!!!
    It is, however, a guide to the queries you will need to know in order to (hopefully)
    extract the data you seek. Have fun…  The ‘Ping of Death’  Essentially, it is
    possible to crash, reboot or otherwise kill a large number of systems by sending
    a ping of a certain size from a remote machine. This is a serious problem, mainly
    because this can be reproduced very easily, and from a remote machine. The attacker
    needs to know nothing about the machine other than its IP address. Be afraid.  It’s
    very easy to exploit \- basically, some systems don’t like being pinged with a
    packet greater than 65536 bytes (as opposed to the default 64 bytes).  '
