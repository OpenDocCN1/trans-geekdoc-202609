    TCP and UDP modes. Flexible port specification: You don’t always want to scan
    all 65535 ports! Also, the scanners which only allow you to scan ports 1 \- N
    often fall short of my need. The scanner should allow you to specify an arbitrary
    number of ports and ranges for scanning. For example, ‘21-25,80-113’ is often
    useful if you are only probing the most frequently running services.  •  Flexible
    target specification: You may often want to scan more then one host, and you certainly
    don’t want to list every single host on a large network! It is useful to scan,
    say a subnet at once, e.g. 131.111.11.0 – 131.111.11.254.  •  Detection of down
    hosts: Some scanners allow you to scan large networks, but they waste a huge amount
    of time scanning 65535 ports of a dead host! Annoying! You are advised to choose
    a scanner which allows timeout intervals to be adjusted.  •  Detection of your
    IP address: For some reason, a lot of scanners ask you to type in your IP address
    as one of the parameters. You don’t want to have to ‘ifconfig’ and figure out
    your current IP address every time you connect. Of course, this is better then
    the scanners I’ve seen which require recompilation every time you change your
    address! If you are using a cable  ‘always on’ connection, you may find that the
    IP address remains constant, as in my own case.  There are actually 65536 ports
    in all; however by convention services with which we are most familiar tend to
    use the lower numbers. Here are a few: FTP  21  Telnet  23  SMTP  25  HTTP  80  POP3  110  Although
    the services can be configured to use other ports, this is very unusual. Ports
    above 1024  tend to be used by the operating system. Essentially a port scanner
    sends packets of data on each port in tern, and listens for replies to determine
    what services are running. A detailed list is available at the end of the document.
    This is an example of a simple port scanner in use: 6    ![](image-6rtchb2n.png)Network
    Topology Views  This may be useful on occasion. It provides a graphical view of
    the resources on your network.  For example, it may show which systems are behind
    a firewall, and which routers are on-line.  A ‘network viewer’.  Packet Sniffing  A
    packet sniffer or protocol analyser is a wire-tap device that plugs into computer
    networks and eavesdrops on the network traffic. Like a telephone wiretap allows
    one to listen in on other people’s conversations, a “sniffing” program lets someone
    listen in on computer conversations.  However, computer conversations consist
    of apparently random binary data. Therefore, network wiretap programs also come
    with a feature known as “protocol analysis”, which allow them to  “decode” the
    computer traffic and make sense of it. Sniffing also has one advantage over telephone
    wiretaps: many networks use “shared media”. This means that you don’t need to
    break into a wiring closet to install your wiretap, you can do it from almost
    any network connection to eavesdrop on your neighbours. This is called a “promiscuous
    mode” sniffer. However, this  “shared” technology is moving quickly toward “switched”
    technology where this will no longer be possible, which means you will have to
    actually tap into the wire.  There is no single point on the Internet where it
    is possible to ‘see’ all of the traffic. The connectivity of the Internet looks
    similar a fisherman’s net. Traffic flows through a mesh, and no single point will
    see it all! The Internet was built to withstand a nuclear attack—and to survive
    any “single point of failure”. This likewise prevents any single point of packet
    sniffing. Consider this situation: you have two machines in your own office talking
    to each other, and both are on the Internet. They take a direct route of communication,
    and the traffic never goes across the outside public portion of the Internet.
    Any communication anywhere in the net follows a similar  “least-cost-path” principle.  Ethernet
    was built around a “shared” principle: all machines on a local network share the
    same wire. This implies that all machines are able to “see” all the traffic on
    the same wire. Therefore, 7  Ethernet hardware is built with a “filter” that ignores
    all traffic that doesn’t belong to it. It does this by ignoring all frames whose
    MAC address doesn’t match their own. A wiretap program effectively turns off this
    filter, putting the Ethernet hardware into “promiscuous mode”. Thus, Mark can
    see all the traffic between Alice and Bob, as long as they are on the same Ethernet
    wire.  Since many machines may share a single Ethernet wire, each must have an
    individual identifier.  This doesn’t happen with dial-up modems, because it is
    assumed that any data you send to the modem is destined for the other side of
    the phone line. But when you send data out onto an Ethernet wire, you have to
    be clear which machine you intend to send the data to. Sure, in many cases today
    there are only two machines talking to each other, but you have to remember that
    Ethernet was designed for thousands of machines to share the same wire. This is
    accomplished by putting a unique 12-digit hex number in every piece of Ethernet
    hardware. To really understand why this is so important, you might want to review
    the information in section 5.4 below. Ethernet was designed to carry other traffic
    than just TCP/IP, and TCP/IP was designed to run over other wires (such as dial-up
    lines, which use no Ethernet). For example, many home users install  “NetBEUI”
    for File and Print Sharing because it is unrelated to TCP/IP, and therefore hackers
    from across the Internet can’t get at their hard-drives.  Raw transmission and
    reception on Ethernet is governed by the Ethernet equipment. You just can’t send
    data raw over the wire, you must first do something to it that Ethernet understands.
    In much the same way, you can’t stick a letter in a mailbox, you must first wrap
    it in an envelope with an address and stamp.  Following a is a brief explanation
    how this works: Alice has IP address: 10.0.0.23  Bob has IP address: 192.168.100.54  In
    order to talk to Bob, Alice needs to create an IP packet of the form 10.0.0.23-->192.168.100.54  .
    As the packet traverses the Internet, it will be passed from router-to-router.
    Therefore, Alice must first hand off the packet to the first router. Each router
    along the way will examine the destination IP address (192.168.100.54) and decide
    the correct path it should take.  All Alice knows about is the local connection
    to the first router, and Bob’s eventual IP address.  Alice knows nothing about
    the structure of the Internet and the route that packet will take. Alice must
    talk to the router in order to send the packet. She uses the Ethernet to do so.
    An Ethernet frame looks like the following:  What this means is that the TCP/IP
    stack in Alice’s machine might create a packet that is 100  bytes long (let’s
    say 20 bytes for the IP info, 20 bytes for the TCP info, and 60 bytes of data).
    The TCP/IP stack then sends it to the Ethernet module, which puts 14 bytes on
    the front for the destination MAC address, source MAC address, and the ethertype
    0x0800 to indicate that the other end’s TCP/IP stack should process the frame.
    It also attaches 4-bytes on the end with a checksum/CRC (a validator to check
    whether the frame gets corrupted as it goes across the wire).  The adapter then
    sends the bits out onto the wire. All hardware adapters on the wire see the frame,
    including the ROUTER’s adapter, the packet sniffer, and any other machines. Proper
    adapters, however, have a hardware chip that compares the frame’s “destination
    MAC” with its own MAC address. If they don’t match, then it discards the frame.
    This is done at the hardware level, so the machine the adapter is attached to
    is completely unaware of this process.  When the ROUTER Ethernet adapter sees
    this frame, it reads it off the wire and removes the leading 14-bytes and the
    trailing 4-bytes. It looks at the 0x0800 ethertype and decides to send it to the
    TCP/IP stack for processing (which will presumably forward it to the next router
    in the chain toward the destination). In the above scenario, only the ROUTER machine
    is supposed to see the Ethernet frame, and all other machines are supposed to
    ignore it. The wiretap, however, breaks the rules and copies the frame off the
    network, too.  8  To see your own Ethernet address, do the following; Win9x: Run
    the program “winipcfg.exe”. It will tell you.  WinNT/2000: Run the program “ipconfig
    /all” from the command-line. It will show the MAC  address for your adapters.
    This is an example result: Windows NT IP Configuration  Host Name . . . . . .
