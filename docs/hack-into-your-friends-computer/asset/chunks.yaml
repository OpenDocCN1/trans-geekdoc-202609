    对于某些计算机硬件和通用电子设备知识的黑客，并且准备好处理电路图、烙铁以及可能的电压表、逻辑探针或示波器，还有进一步的可能性。最有用的设备之一包括一个廉价的无线接收机（MW/AM\
    \ 波）、一个麦克风和一个录音机。\n\n计算机附近的无线电、调制解调器和电话线可以轻松捕捉数字通信的 `chirp`。另一种是，带有小增益放大器的感应环电话线将给你一个你以后可以分析的记录。\n\
    \n通过识别使用的信号对，你可以分离开始和结束位 `characters` 和 `words`；通过示波器显示正在发生的事情。有了经验，更简单的技巧是记录和回放序列；限制是，即使你成功了，你可能不知道该做什么。1982\
    \ 年，伦敦银行 Holborn 分行被搜查；警报没有响，因为小偷们之前记录了电话线的“全通过”信号，然后在闯入期间回放了该信号。\n\n### 初学者使用的\
    \ Linux & Unix\n\nUnix 已经成为互联网的主要系统。事实上，在比 PC 更强大的计算机中，Unix 是广泛使用的操作系统。诚然，Windows\
    \ NT 正在崛起，但今天 Unix 的所有版本仍然是领先的操作系统。所以到目前为止，我们假设你正在通过你的互联网服务提供商（ISP）使用的账户进行黑客活动。\n\
    \n注意：序列线路协议（SLIP）和点对点协议（PPP）连接为你提供一个临时的网协议（IP）地址，允许你直接连接到互联网。你必须使用 `SLIP` 或 `PPP`\
    \ 连接来使用提供图像而非文本的网络浏览器。所以如果你能在网页上看到图像，你就已经拥有其中之一。使用这些直接连接进行活动的好处是，你不会为你的 ISP 系统管理员留下一个\
    \ shell 文件。即使你没有违法，一个显示你正在进行黑客活动的文件对于某些系统管理员来说也足够了。运行 Unix 的最好的计算机是什么？除非你是一个不在乎购买\
    \ Sun SPARC 工作站的富有黑客，否则你可能用某种 PC 效果最好。PC 上运行着几乎无数种 Unix 变体，还有几个适用于 Mac。大多数可以免费下载，或者在\
    \ CD-ROM 上廉价提供。PC 上最常见的三个 Unix 变体是 Sun 的 Solaris、`FreeBSD` 和 `Linux`。Solaris 价格约为\
    \ $700。话已如此。FreeBSD 确实非常好。然而，Linux 的优势在于有很多变体（所以你可以乐趣组合不同 Linux 提供的程序）。最重要的是，Linux\
    \ 得到了许多手册、新闻组、邮件列表和网站的支持。历史说明：Linux 是 1991 年由赫尔辛基大学的 Linus Torvalds 领导的小组创建的。Linux\
    \ 根据 GNU GPL 保护。根据该协议，Linux 与源代码一起分发给任何人。任何人都可以销售 Linux 的任何变体并对其修改和重新封装。但即使有人修改了源代码，他们也可以对从\
    \ Linux 创建的任何东西拥有版权。任何销售修改版 Linux 的人必须向买家提供源代码，并在商业产品中重用而不收取许可费。这种安排被称为“拷贝左”（copyleft）。在这种安排下，Linux\
    \ 的原始创建者没有获得许可或共享软件费用。Linus Torvalds 和许多对 Linux 做出贡献的人这样做是出于编程的快乐，以及与我们所有这些希望以好人黑客精神使用\
    \ Linux 的人的社区感。Linux 万岁！Torvalds 万岁！\n\nLinux 由操作系统本身（称为“内核”`kernel`）加上一组关联程序组成。内核与所有类型的\
    \ Unix 一样，是一个多任务、多用户的操作系统。虽然它使用不同的文件结构，因此与 DOS 和 Windows 不直接兼容，但它是灵活的，在 Linux\
    \ 中可以运行许多 DOS 和 Windows 程序。所以高级用户可能希望启动 Linux 并在其之后能够从 Linux 运行 DOS 和 Windows\
    \ 程序。大多数 Linux 发行版附带的关联程序可能包括：\n* 一个 shell 程序（Bourne Again Shell -- `BASH` ——\
    \ 最常用）；\n* 编程语言的编译器，如 `Fortran-77`（我的喜爱！）、`C`、`C++`、`LISP`、`Modula-2`、`Ada`、`Basic`（初学者最好的语言）以及\
    \ `Smalltalk`；\n* `X`（有时称为 Xwindows），图形界面\n* 实用程序，如电子邮件阅读器（我的喜爱）\n\n### 在 PC 上安装\
    \ Linux 的十个理由\n\n1. 当 Linux 被禁止时，只有非法者拥有它。虽然理论上你可以在有 4 MB 内存和两个软盘驱动的情况下运行 Linux，但在\
    \ 486 或以上具有 8 MB 内存、CD-ROM 和至少 200 MB 磁盘空间的情况下要容易得多。\n2. 尽可能了解主板、调制解调器、CD-ROM\
    \ 和显卡。如果你有这些任何文档，在安装时可以参考。\n3. 使用这些硬件效果更好。因为 Linux 是免费软件，它不提供最新的硬件驱动程序。如果你的硬件像我的一样——有很多\
    \ `drivers`，你可以花费长时间实验。\n4. 在安装之前，备份你的硬盘！理论上你可以安装 Linux 而不会损坏 DOS/Windows 文件。但我们都是人类，特别是遵循第\
    \ 7 点的建议。\n5. 获取多个 Linux 发行版。第一次成功安装 Linux 时，你发现通过使用 CD-ROM 得到了它。在任何情况下，每种 Linux\
    \ 发行版都有不同的实用程序、操作系统模拟器和编译器。将它们都加入你的系统，你就会成为精英。\n6. 买一本或两本关于 Linux 的书。它们比什么都好。大多数\
    \ Linux 书附带一个或两个 CD-ROM，可以安装 Linux。\n7. 我建议在安装时喝点水。这可能让调试更快，但至少你不会担心有多难。现在我几乎可以保证即使遵循了这些建议，你仍然会有问题。噢，我有建议吗？\n\
    8. 保持良好心情。由于其他人在安装和使用 Linux 时也痛苦，互联网拥有丰富的资源。\n9. 如果你对获取过敏，你可以从 Linux 支持网站开始。找到最好的\
    \ `http://www.unc.edu:/pub/Linux/`。它包含了 Linux 常见问题列表（`FAQ`），可在 `www.unc.edu:/pub/Linux/docs/FAQ`\
    \ 获取。\n10. 在 `unc.edu` 上的 `/pub/Linux/docs` 目录下你会发现许多关于 Linux 的其他文档，包括 Linux `INFO-SHEET`\
    \ 和 `META-FAQ`。Linux `HOWTO` 存档位于 `unc.edu` 站点站点：`/pub/Linux/docs/HOWTO`。`/pub/Linux/docs/LDP`\
    \ 目录包含当前的 LDP 手册。你可以在 `unc.edu` 的 `/pub/Linux/docs/LDP/install-guide` 获取 `Linux\
    \ Installation and Getting Started`。那里的 `README` 文件描述了你可以订购同名书籍（约 180 页）。\n\n\
    ### SQL 参考\n\n为了在不输入所有列的情况下获取表的所有列，使用：`SELECT * FROM TableName;`\n获取元组（行）的总数：`SELECT\
    \ COUNT(*) FROM EMPLOYEE;`\n获取接收部门女性员工的总数：`SELECT COUNT(*) FROM EMPLOYEE WHERE\
    \ sex='m' AND Department='reception';`\n\n### 关系运算符\n\nSQL 中有六种关系运算符，在介绍它们之后，我们将看到如何使用它们：`<>\
    \ `<`, `>`, `<=`\n\n大于等于：例如，如果你想看到至少或超过 50,000 的的 `EMPLOYEE ID`，请使用：`SELECT EMPLOYEEIDNO\
    \ FROM EMPLOYEESTISTICABLE WHERE SALARY >= 50000;` 注意使用了 `>=`（大于等于）符号，因为我们想看到大于\
    \ 50,000 或等于 5,000 的人列在一起。`WHERE` 描述 `SALARY >= 50000` 被称为一个条件（一个求值为真或假的操作）。文本列也可以进行这样做：`SELECT\
    \ EMPLOYEEIDNO FROM EMPLOYEE STATISTICABLE WHERE POSITION='Manager';` 这显示了所有经理的\
    \ ID 号。\n\n### 更复杂的条件：复合条件 / 逻辑运算符\n\n`AND` 运算符连接两个或多个条件，只有当该行的数据满足所有列出的条件时（即所有条件均真），才显示该行。例如，显示所有超过\
