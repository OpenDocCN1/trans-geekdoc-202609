- fmt: "\n# Introduction\n\nshared (You’d be amazed at some peoples stupidity!!!),\
    \ this shows up as a result such as `80.5.7.2\\C` or similar. Simply copy & paste\
    \ this link into the address bar of Windows Explorer, and hit enter! This is a\
    \ screenshot of Netbrute in operation: For more comprehensive information, use\
    \ a utility such as `Languard Network Scanner`. This returns a wealth of information\
    \ such as domain names, login names, and more. Here is a shot of this in use:\n\
    \nNeed I say more? If you find a system where the root directory of `C:` is shared,\
    \ then on Windows 9.X systems, you’ll be able to access the whole of the hard\
    \ drive. On Windows NT/2000 systems, you will have only access as according to\
    \ NTFS file access permissions. Here is a screenshot of Windows Explorer pointed\
    \ at the root directory:\n\nYou can even map it to a network drive (use tools\
    \ > map network drive), it’s as easy as that!\n\nFor best results, I recommend\
    \ choosing systems with ‘better than modem’ connections. If you don’t know where\
    \ to start, try your own IP address. To get this, do the following:\n\n- For Windows\
    \ 9.X, go to start > Run and type `Winipcfg` to get your IP address.\n- For Windows\
    \ NT/2000, got to start > programs > accessories > commend prompt, and type `ipconfig`.\n\
    \nThis will return your IP address. If you are using a dialup connection, you\
    \ will need to connect first. For ‘always on’ cable connection, omit this step.\
    \ Then run your scan over the subnet; e.g. if your IP address is `164.99.34.212`\
    \ then try a scan from `164.99.34.1` to `164.99.34.254`. This should be enough\
    \ to get you started. Have fun…\n\n## IP Scanning\n\nThis simple scan simply pings\
    \ a range of IP addresses to find which machines are alive. Note that more sophisticated\
    \ scanners will use other protocols (such as an `SNMP sweep`) to do the same thing.\
    \ This is a very simple technique which requires little explanation. It is however,\
    \ useful for the domain name to be returned also.\n\n## Port Scanning\n\nThis\
    \ section introduces many of the techniques used to determine what ports (or similar\
    \ protocol abstraction) of a host are listening for connections. These ports represent\
    \ potential communication channels. Mapping their existence facilitates the exchange\
    \ of information with the host, and thus it is quite useful for anyone wishing\
    \ to explore their networked environment, including hackers. Despite what you\
    \ have heard from the media, the Internet is NOT exclusively reliant on TCP port\
    \ `80`, used by hypertext transfer protocol (`HTTP`). Anyone who relies exclusively\
    \ on the WWW for information gathering is likely to gain the same level of proficiency\
    \ as your average casual surfer. This section is also meant to serve as an introduction\
    \ to the art of port scanning, in which a host system can be persuaded to yield\
    \ up it’s secrets. To accomplish this, you need to obtain a port scanner. There\
    \ are many available both for free or for a small fee.\n\nIt should have all these\
    \ features:\n\n- **dynamic delay time calculations**: Some scanners require that\
    \ you supply a delay time between sending packets. Well how should I know what\
    \ to use? You can always ping them, but that is a pain, and plus the response\
    \ time of many hosts changes dramatically when they are being flooded with requests.\
    \ For root users, the primary technique for finding an initial delay is to time\
    \ the internal `ping` function. For non-root users, it times an attempted `connect()`\
    \ to a closed port on the target. It can also pick a reasonable default value.\
    \ Again, people who want to specify a delay themselves can do so with `-w` (wait),\
    \ but you shouldn’t have to.\n- **Retransmission**: Some scanners just send out\
    \ all the query packets, and collect the responses. But this can lead to false\
    \ positives or negatives in the case where packets are dropped. This is especially\
    \ important for “negative” style scans like `UDP` and `FIN`, where what you are\
    \ looking for is a port that does NOT respond.\n- **Parallel port scanning**:\
    \ Some scanners simply scan ports linearly, one at a time, until they do all `65535`.\
    \ This actually works for TCP on a very fast local network, but the speed of this\
    \ is not at acceptable on a wide area network like the Internet. It is best to\
    \ use non-blocking i/o and parallel scanning in all TCP and UDP modes.\n- **Flexible\
    \ port specification**: You don’t always want to scan all `65535` ports! Also,\
    \ the scanners which only allow you to scan ports `1- N` often fall short of my\
    \ need. The scanner should allow you to specify an arbitrary number of ports and\
    \ ranges for scanning. For example, `21-25,80-113` is often useful if you are\
    \ only probing the most frequently running services.\n- **Flexible target specification**:\
    \ You may often want to scan more then one host, and you certainly don’t want\
    \ to list every single host on a large network! It is useful to scan, say, a subnet\
    \ at once, e.g. `131.111.11.0 – 131.111.11.254`.\n- **Detection of down hosts**:\
    \ Some scanners allow you to scan large networks, but they waste a huge amount\
    \ of time scanning `65535` ports of a dead host! Annoying! You are advised to\
    \ choose a scanner which allows timeout intervals to be adjusted.\n- **Detection\
    \ of your IP address**: For some reason, a lot of scanners ask you to type in\
    \ your IP address as one of the parameters. You don’t want to have to `ifconfig`\
    \ and figure out your current IP address every time you connect. Of course, this\
    \ is better then the scanners I’ve seen which require recompilation every time\
    \ you change your address! If you are using a cable ‘always on’ connection, you\
    \ may find that the IP address remains constant, as in my own case.\n\nThere are\
    \ actually `65536` ports in all; however by convention services with which we\
    \ are most familiar tend to use the lower numbers. Here are a few:\n- FTP: `21`\n\
    - Telnet: `23`\n- SMTP: `25`\n- HTTP: `80`\n- POP3: `110`\n\nAlthough the services\
    \ can be configured to use other ports, this is very unusual. Ports above `1024`\
    \ tend to be used by the operating system. Essentially a port scanner sends packets\
    \ of data on each port in tern, and listens for replies to determine what services\
    \ are running.\n\n## Network Topology Views\n\nThis may be useful on occasion.\
    \ It provides a graphical view of the resources on your network. For example,\
    \ it may show which systems are behind a firewall, and which routers are on-line.\
    \ `network viewer`.\n\n## Packet Sniffing\n\nA packet sniffer or protocol analyser\
    \ is a device that plugs into computer networks and eavesdrops on the network.\
    \ Like a telephone wire allows one to listen in on other people’ conversations,\
    \ a `sniffing` program lets someone listen in on computer conversations. However,\
    \ programs also come with a feature known as `protocol analysis`, which allow\
    \ them to `decode` the traffic and make sense of it. Sniffing also has one advantage\
    \ over telephonetaps: many networks use `shared media`. This means you don’t need\
    \ to break into a wiring closet, you can do it from almost any connection to eavesdrop\
    \ on your neighbours. This is called `promiscuous mode`. However, technology is\
    \ moving quickly toward `switched` technology where this will no longer be possible,\
    \ which means you will have to actually tap into the wire. There is no single\
    \ point on the Internet where it is possible to `see` all of the traffic. The\
    \ connectivity of the Internet looks similar a fisherman’s net. Traffic flows\
    \ through a mesh, and no single point will see it! The Internet was built to withstand\
    \ a nuclear attack—and to survive any single point of failure. Consider this situation:\
    \ you have two machines in your own office talking to each other, and both are\
    \ on the Internet. They take a direct route of communication, and the traffic\
    \ never goes across the outside portion. Ethernet was built around a `shared`\
    \ principle: all machines on a local network share the same wire. This implies\
    \ that all machines are able to `see` all the traffic on the same wire. Ethernet\
    \ is built with a `filter` that ignores all traffic that doesn’t belong to it.\
    \ `wiretap` program effectively turns off this filter. For example, many home\
    \ users install `NetBEUI` for File and Print Sharing because it is unrelated to\
    \ TCP/IP, and therefore hackers from the Internet can’t get at their hard-drives.\
    \ This is accomplished by putting a unique identifier in every piece of Ethernet\
    \ hardware. You just can’t send data raw over the wire, you must first do something\
    \ to it that Ethernet understands. In much the same way, you can’t stick a letter\
    \ in a mailbox, you must first wrap it in an envelope with an address and stamp.\
    \ Following is a brief explanation how this works:\n\nAlice has IP address: `10.0.0.23`\n\
    Bob has IP address: `192.168.100.54`\n\nIn order to talk to Bob, Alice needs to\
    \ create an IP packet of the form `10.0.0.23-->192.168.100.54`. As the packet\
    \ traverses the Internet, it will be passed from router-to-router. Therefore,\
    \ Alice must first hand off the packet to the first router. Each router along\
    \ the way will examine the destination IP address (`192.168.100.54`) and decide\
    \ the correct path it should take. All Alice knows about is the local connection\
    \ to the first router, and Bob’s eventual IP address. Alice knows nothing about\
    \ the structure of the Internet and the route that packet will take. Alice must\
    \ talk to the router in order to send the packet. She uses the Ethernet to do\
    \ so. An Ethernet frame looks like the following:\n\nWhat this means is that the\
    \ TCP/IP stack in Alice’s machine might create a packet that is 100 bytes long\
    \ (let’s say 20 bytes for the IP info, 20 bytes for the TCP info, and 60 bytes\
    \ of data). The TCP/IP stack then sends it to the Ethernet module, which puts\
    \ 14 bytes on the front for the destination MAC address, source MAC address, and\
    \ the ethertype `0x0800` to indicate that the other end’s TCP/IP stack should\
    \ process the frame. It also attaches 4-bytes on the end with a checksum/CRC (a\
    \ validator to check whether the frame gets corrupted as it goes across the wire).\
    \ The adapter then sends the bits out onto the wire. All hardware adapters on\
    \ the wire see the frame, including the ROUTER’s adapter, the packet sniffer,\
    \ and any other machines. Proper adapters, however, have a hardware chip that\
    \ compares the frame’s “destination MAC” with its own MAC address. If they don’t\
    \ match, then it discards the frame. This is done at the hardware level, so the\
    \ machine the adapter is attached to is completely unaware of this process. When\
    \ the ROUTER Ethernet adapter sees this frame, it reads it off the wire and removes\
    \ the leading 14-bytes and the trailing 4-bytes. It looks at the `0x0800` ethertype\
    \ and decides to send it to the TCP/IP stack for processing (which will presumably\
    \ forward it to the next router in the chain toward the destination). In the above\
    \ scenario, only the ROUTER machine is supposed to see the Ethernet frame, and\
    \ all other machines are supposed to ignore it. The wiretap, however, breaks the\
    \ rules and copies the frame off the network, too.\n\n## IP Configuration\n\n\
    To see your own Ethernet address, do the following:\n- Win9x: Run the program\
    \ `winipcfg.exe`. It will tell you.\n- WinNT/2000: Run the program `ipconfig /all`\
    \ from the command-line. It will show the address for your adapters.\n\nHere is\
    \ an example: Windows NT IP Configuration\nHost Name: robertgraham.com\nNode Type:\
    \ Hybrid\nDHCP Enabled: No\nNetBIOS Resolution: Yes\nDescription: Fast Ethernet\
    \ Adapter\nPhysical Address: 00-40-55-F0-9D-DC\nIP Address: 192.168.1.254\nSubnet\
    \ Mask: 255.255.255.0\nDefault Gateway: 192.168.1.1\nPrimary DNS Server: 192.168.1.253\n\
    WINS Server: No\n\nLinux: Run the program `ifconfig`. Here is a sample result:\n\
    eth0: flags=4163<BROADCAST,RUNNING,MULTICAST>  mtu=1500  ether 08:00:27:A4:C0:BD\n\
    \  inet 192.168.1.10  mask:255.255.255.0  broadcast 192.168.1.255\n  packets=113724\
    \ errors=0 coll=0  packets=99476 errors=0 coll=0\n\nSolaris: Use the `arp` or\
    \ `netstat -p` command, it will often list the local ARP entries.\n"
