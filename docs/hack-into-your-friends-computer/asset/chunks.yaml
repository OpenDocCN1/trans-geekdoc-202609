    ## 注册端口 (REGISTERED PORT NUMBERS)

    注册端口不受 IANA 控制，在大多数系统中可以由普通用户进程或普通用户执行的程序使用。端口在 TCP `RFC793` 中用于命名传输长时间的逻辑连接。为了向未知调用者提供服务，定义了服务联系端口。此列表指定了服务器进程作为其联系端口使用的。虽然
    IANA 可以控制这些端口的使用，但为了方便社区，注册或列出了这些端口的使用。在可能的情况下，这些端口分配也用于 UDP `RFC768`。注册端口范围为
    1024-65535。


