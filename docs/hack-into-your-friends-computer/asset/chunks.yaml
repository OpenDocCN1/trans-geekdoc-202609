    ## REGISTERED PORT NUMBERS

    The Registered Ports are not controlled by the IANA and on most systems can be
    used by ordinary user processes or programs executed by ordinary users. Ports
    are used in the TCP `RFC793` to name the ends of logical connections which carry
    long conversations. For the purpose of providing services to unknown callers,
    a service contact port is defined. This list specifies the port used by the server
    process as its contact port. While the IANA can control uses of these ports it
    does register or list uses of these ports as a convenience to the community. To
    the extent possible, these same port assignments are used with the UDP `RFC768`.
    The Registered Ports are in the range 1024-65535.


