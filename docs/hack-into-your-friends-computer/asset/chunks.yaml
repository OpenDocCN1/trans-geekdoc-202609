    # 简介


    共享（你会对某些人的愚蠢感到惊讶的！！！），这通常表现为如 `80.5.7.2\C` 或类似的结果。只需将此链接复制并粘贴到 Windows 资源管理器的地址栏中，然后按回车！这是
    Netbrute 运行时的截图：如需获取更全面的信息，请使用如 `Languard Network Scanner` 等实用程序。它可以返回大量信息，如域名、登录名等。这里是该工具的使用快照：


    我还需要多说些什么吗？如果你发现某个系统的 `C:` 根目录被共享了，那么在 Windows 9.X 系统上，你将能够访问整个硬盘。在 Windows NT/2000
    系统上，你将仅根据 NTFS 文件访问权限获得相应的权限。这里是 Windows 资源管理器指向根目录的截图：


    你甚至可以将其映射为网络驱动器（使用工具 > 映射网络驱动器），就如此简单！


    为了获得最佳效果，建议选择具有“比调制调器更快”连接的系统。如果你不知道从哪里开始，可以尝试自己的 IP 地址。获取此地址，请执行以下操作：


    - 对于 Windows 9.X，前往开始 > 运行并输入 `Winipcfg` 获取你的 IP 地址。

    - 对于 Windows NT/2000，前往开始 > 程序 > 辅助工具 > 命令提示符，并输入 `ipconfig`。


    这将返回你的 IP 地址。如果你在使用拨号连接，则需要先连接。对于“始终开启”的光纤连接，请跳过此步骤。然后对子网进行扫描；例如，如果你的 IP 地址是 `164.99.34.212`，则尝试从
    `164.99.34.1` 扫描到 `164.99.34.254`。这足够让你开始了。玩得开心……


    ## IP 扫描


    这种简单的扫描通过 ping 一范围 IP 地址来查找哪些机器是活跃的。请注意，更复杂的扫描器会使用其他协议（如 `SNMP sweep`）来完成相同。这是一种非常简单的技术，不需要太多解释。然而，对于返回域名也是很有用的。


    ## 端口扫描


    本节介绍了用于确定主机哪些端口（或类似的协议抽象）正在监听连接的许多技术。这些端口代表了潜在的通信通道。映射它们的存在有助于与主机交换信息，因此对于任何想要探索其网络环境的人（包括黑客）来说非常有用。尽管你从媒体中听到过什么，互联网并非完全依赖用于超文本传输协议（`HTTP`）的
    TCP 端口 `80`。任何完全依赖 WWW 进行信息收集的人，其熟练程度可能与普通休闲浪者相当。本节还旨在作为端口扫描艺术的介绍，在这种艺术中，主机系统可以被说服交出它的秘密。要实现这一点，你需要获取一个端口扫描器。有很多免费或只需少量付费的工具。


    它应该具备所有这些功能：


    - **动态延迟时间计算**：某些扫描器要求你在发送数据包之间提供一个延迟时间。嗯，我怎么知道用什么呢？你可以一直 ping 它们，但很麻烦，而且许多主机在被请求淹没时，响应时间会发生剧变。对于
    root 用户，寻找初始延迟的主要技术是对内部 `ping` 函数进行计时。对于非 root 用户，它是对目标上关闭端口的尝试性 `connect()` 进行计时。它还可以选择一个合理的默认值。再次，想要自己指定延迟的人可以使用
    `-w`（等待）来完成，但你不必这么做。

    - **重传**：某些扫描器只是发送所有查询包并收集响应。但在数据包丢失的情况下，这可能导致假阳性或假阴性。这对于“否定”风格的扫描（如 `UDP` 和 `FIN`）尤为重要，你寻找的是不响应的端口。

    - **并行端口扫描**：某些扫描器只是线性地一个一个扫描端口，直到 `65535`。这在非常快的本地网络上实际上可行，但在互联网这样的广域网上，这种速度是不可接受的。最好在
    TCP 和 UDP 模式下使用非阻塞和并行扫描。

    - **灵活端口规范**：你并不总是想扫描 `65535` 个端口！此外，只允许你扫描的扫描器往往满足不了。扫描器应该允许你指定任意数量的端口和范围。例如，`21-80`，如果你正在探测经常运行的服务，这非常有用。

    - **灵活目标规范**：你可能经常想扫描多个主机，并且你肯定不想列出大型网络上的每一个主机！一次性扫描一个子网是有用的，例如 `131.111.11.254`。

    - **死机检测**：某些扫描器允许你扫描大型网络，但它们浪费了大量时间扫描死机！真烦人！建议选择允许调整超时间隔的扫描器。

    - **检测你的 IP 地址**：由于某些原因，许多扫描器要求你输入你的 IP 地址作为参数之一。你不希望每次连接都要 `ifconfig` 并弄出当前的
    IP 地址！这比我看到的某些扫描器好。如果你使用“始终开启”连接，你可能会发现 IP 地址保持不变。实际上有 `65536` 个端口；但我们最熟悉的服务倾向于使用低数字。这里有几个：

    - FTP: `21`

    - Telnet: `23`

    - SMTP: `25`

    - HTTP: `80`

    - POP3: `110`


    虽然服务可以配置为其他端口，但这非常不寻。`1024` 以上的端口通常由操作系统使用。基本上端口扫描器向每个端口发送数据包，并监听回复以确定运行哪些服务。


    ## 网络拓扑视图


    这有时有用。它提供了你网络资源的图形化视图。例如，它可能显示哪些系统位于防火墙后，哪些路由器在线。`network viewer`。


    ## 数据包嗅探


    数据包嗅探器或协议分析器是一种接入计算机网络并窃听网络的设备。就像电话线允许监听他人的对话一样，`sniffing` 程序让某人监听计算机对话。然而，程序还带有名为
    `protocol analysis` 的功能，允许它们 `decode` 流量并理解它。嗅探与分分相比还有一个优势：许多网络使用 `shared media`。这意味着你不需要进入布线室，从几乎任何连接都可以监听你的邻居。这被称为
    `promiscuous mode`。然而，技术正快速向 `switched` 技术发展，这将不再可能，意味着你必须实际上接入接线。互联网上没有哪一个点可以
    `see` 所有流量。互联网的连接性类似于渔网。流量通过网格流动，没有任何一个点会看看到它！互联网的设计是为了抵御核攻击并生存任何单点故障。考虑这种情况：你办公室里有两台机器在互相通信，它们都在互联网上。它们采取直接通信路由，流量从未经过外部部分。以太网是围绕
    `shared` 原则构建的：本地网络上的所有机器共享同一根线。这意味着所有机器都能 `see` 同一线上的所有流量。以太网构建了一个 `filter`，忽略所有不属于它的流量。`wiretap`
    程序有效地关闭了这个过滤器。例如，许多家庭用户为了文件和打印共享安装 `NetBEUI`，因为它与 TCP/IP 无关，因此来自互联网的黑客无法获取他们的硬盘。这是通过在每件以太网硬件中放置唯一标识符来实现的。你不能直接在电上传输原始数据，你必须先对它进行以太网能理解的处理。同样地，你不能直接把信投进邮箱，你必须先把它装进有地址和邮票的封里。以下是工作原理的简要说明：


    Alice 的 IP 地址：`10.0.0.23`

    Bob 的 IP 地址：`192.168.100.54`


    为了与 Bob 通信，Alice 需要创建一个形式如 `10.0.0.23-->192.168.100.54` 的 IP 数据包。当数据包穿越互联网时，它将从路由器到路由器进行传递。因此，Alice
    必须先将包交给第一个路由器。沿途的每个路由器都会检查目标 IP 地址（`192.168.100.54`）并决定它应该采取的正确路径。Alice 只知道到第一个路由器的本地连接，以及
    Bob 最终的地址。这比我看到的某些每次更改地址都要重新编译的扫描器要好。


