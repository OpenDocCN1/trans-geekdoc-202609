    An IP datagram of 65536 bytes is illegal, but possible to create owing to the
    way the packet is fragmented (broken into chunks for transmission). When the fragments
    are reassembled at the other end into a complete packet, it overflows the buffer
    on some systems, causing a reboot, panic 22 or hang, but sometimes even having
    no effect at all. Most implementations of ping won’t allow an invalid datagram
    like this to be sent. Among the exceptions are Windows ‘95 and NT, although they
    are certainly not the only ones... IP packets as per `RFC-791` can be up to 65,535
    (2^16-1) octets long, which includes the header length (typically 20 octets if
    no IP options are specified). An ICMP ECHO request “lives” inside the IP packet,
    consisting of eight octets of ICMP header information (`RFC-792`) followed by
    the number of data octets in the “ping” request. Hence the maximum allowable size
    of the data area is `65535 - 20 - 8 = 65507` octets. Note that it is possible
    to send an illegal echo packet with more than 65507 octets of data due to the
    way the fragmentation is performed. The fragmentation relies on an offset value
    in each fragment to determine where the individual fragment goes upon reassembly.
    Thus on the last fragment, it is possible to combine a valid offset with a suitable
    fragment size such that `(offset + size) > 65535`. Since typical machines don’t
    process the packet until they have all fragments and have tried to reassemble
    it, there is the possibility for overflow of 16 bit internal variables, which
    can lead to system crashes, reboots, kernel dumps and the like. The problem can
    be exploited by anything that sends an IP datagram - probably the most fundamental
    building block of the net. Not only ICMP echo, but TCP, UDP and (apparently) even
    new style IPX can be used to hit machines where it hurts. This bug is extremely
    easy to exploit. Users are already trying it out “just to see if it works”!


    # Port Numbers and Services


    This data is from Internet Assigned Numbers Authority (IANA). IANA maintains the
    Assigned Numbers RFC. The entries in this file are in the same format as found
    in a standard Berkeley UNIX `/etc/services` file. There are also links between
    the protocol and services names, and their respective RFCs (their standard documentation).
    This file has two sections:


    - **Well known Port Numbers**: port numbers that IANA assigns.

    - **Registered Port Numbers**: port numbers that IANA does not assign.


    This provides a list of which ports are used my which services. There really is
    more to the net than HTTP alone!


    ## Well Known Port Numbers


    The Well Known Ports are controlled and assigned by the IANA and on most systems
    can only be used by system (or root) processes or by programs executed by privileged
    users. Ports are used in the TCP `[RFC793]` to name the ends of logical connections
    which carry long term conversations. For the purpose of providing services to
    unknown callers, a service contact port is defined. This list specifies the port
    used by the server process as its contact port. The contact port is sometimes
    called the “well-known port”. To the extent possible, these same port assignments
    are used with the UDP `[RFC768]`. The assigned ports use a small portion of the
    possible port numbers. For many years the assigned ports were in the range 0-255.
    Recently, the range for assigned ports managed by the IANA has been expanded to
    the range 0-1023.


