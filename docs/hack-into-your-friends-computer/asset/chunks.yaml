    ### SQL Reference


    To get all columns of a table without typing all column names, use: `SELECT *
    FROM TableName;`

    To get the total number of tuples (rows): `SELECT COUNT(*) FROM EMPLOYEE;`

    To get the total number of female employees in reception: `SELECT COUNT(*) FROM
    EMPLOYEE WHERE sex=''m'' AND Department=''reception'';`


    ### Relational Operators


    There are six Relational Operators in SQL, and after introducing them, we’ll see
    how they’re used: `=`, `<>`, `!=`, `<`, `>`, `<=`.


    Greater Than or Equal To: For example, if you wanted to see the `EMPLOYEE ID`s
    of those making at least, or over $50,000, use the following: `SELECT EMPLOYEEIDNO
    FROM EMPLOYEESTATISTICABLE WHERE SALARY >= 50000;` Notice that the `>=` (greater
    than or equal to) sign is used, as we wanted to see those who made greater than
    $50,000, or equal to $5,000, listed together. The `WHERE` description, `SALARY
    >= 50000`, is known as a condition (an operation which evaluates to True or False).
    The same can be done for text columns: `SELECT EMPLOYEEIDNO FROM EMPLOYEE STATISTICABLE
    WHERE POSITION=''Manager'';` This displays the ID Numbers of all Managers.


    ### More Complex Conditions: Compound Conditions / Logical Operators


    The `AND` operator joins two or more conditions, and displays a row only if that
    row’s data satisfies ALL conditions listed (i.e. all conditions hold true). For
    example, to display all staff making over $40,000, use: `SELECT EMPLOYEEIDNO FROM
    EMPLOYEESTATISTICABLE WHERE SALARY > 40000 AND POSITION=''Staff'';`


    The `OR` operator joins two or more conditions, but returns a row if ANY of the
    conditions listed true. To see all those who make less than $40,000 or have less
    than $10,000 in benefits, listed together, use the following query: `SELECT EMPLOYEEIDNO
    FROM EMPLOYEESTATISTICABLE WHERE SALARY < 40000 OR BENEFITS < 10000;`


    `AND` & `OR` can be combined, for example: `SELECT EMPLOYEEIDNO FROM EMPLOYEESTATISTICABLE
    WHERE POSITION=''Manager'' AND SALARY > 60000 OR BENEFITS > 12000;` First, SQL
    finds the rows where the salary is greater than $60,000 and the position column
    is equal to Manager, then taking this new list of rows, SQL then sees if any of
    these rows satisfies the previous `AND` condition or the condition that the Benefits
    column is greater than $12,000. Subsequently, SQL only displays this second new
    list of rows, keeping in mind that anyone with Benefits over $12,000 will be included
    as the `OR` operator includes a row if either resulting condition is True. Also
    note that the `AND` operation is done first. This is a law of Boolean algerbra.
    This is analogous to mathematics which state that multiplication and division
    take precedence over addition and subtraction.


    ### SQL Order Operations (Inner joins)


    Similarly, `NOT IN` lists all rows excluded from the `IN` list. Additionally,
    `NOT`s can be thrown in with `AND`s & `OR`s, except that `NOT` is a unary operator
    (evaluates one condition, whereas `AND`s & `OR`s evaluate two conditions), each
    operates from left right:

    1. `NOT`

    2. `AND`

    3. `OR`


    ### Using LIKE


    If you wanted to see all people whose last names started with `L`; try: `SELECT
    EMPLOYEEIDNO FROM STATISTICABLE WHERE LASTNAME LIKE ''L%'';` The percent sign
    (`%`) is used to represent any possible character (number, letter, or punctuation)
    or set of characters that might appear after the `L`. To find those with LastName
    ending in `L`, use `%L`, or if you wanted the `L` in the middle of the word, try
    `%L%`. The `%` can be used for any characters in the same position relative to
    the given characters. `NOT LIKE` displays rows not fitting the given description.
    Other possibilities of using `


    ### Performing a Join


    The purpose of these keys is so that data can be related across tables, without
    having to repeat data in every table— this is the power of relational databases.
    For example, you can find the names of those who bought a chair without having
    to list the full name of the buyer in the Antiques table...you can get the name
    by relating those who bought a chair with the names in the AntiqueOwners table.


    ### Joins


    In this section, we will only discuss inner joins, and as in general, they are
    the most useful. Good database design suggests that each table lists only about
    a single and detailed information can be obtained in a relational database, by
    using additional tables, and by An easier method of using compound conditions
    uses `IN` or `BETWEEN`. For example, if you wanted to list all managers and staff:
    `SELECT EMPLOYEEIDNO FROM STATISTICABLE WHERE POSITION IN (''Manager'', ''Staff'');`
    or to list those greater than or equal to $30,000, but less than equal to $50,000,
    use: `SELECT EMPLOYEEIDNO FROM STATISTICABLE WHERE SALARY BETWEEN 30000 AND 50000;`
    To list everyone not in this range, try: `SELECT EMPLOYEEIDNO FROM STATISTICABLE
    WHERE SALARY NOT BETWEEN 30000 AND 50000;`


