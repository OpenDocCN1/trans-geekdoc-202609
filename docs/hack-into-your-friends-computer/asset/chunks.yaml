    一个 65536 字节的 IP 数据报文是非合法的，但由于数据包分片（分成块进行传输）的方式，它是可以创建。当分片在另一端重新组装成完整数据包时，它会导致某些系统上的缓冲区溢出，从而引起重启、panic
    22 或挂起，但有时完全没有影响。大多数 ping 的实现都不会允许发送这样的无效数据报文。例外包括 Windows ''95 和 NT，尽管它们显然不是唯一的……根据
    `RFC-791`，IP 数据包的长度可达 65,535 (2¹⁶-1) 字节，这包含了头部长度（如果未指定 IP 选项，通常为 20 字节）。一个 ICMP
    ECHO 请求“存在”于 IP 数据包内部，由 8 字节的 ICMP 头部（`RFC-792`）以及“ping”请求中的数据字节数组成。因此，允许的数据区域最大大小为
    `65535 - 20 - 8 = 65507` 字节。注意，由于分片执行的方式，可能会发送超过 65507 字节数据的非法回显包。分片依赖于每个分片中的偏移值来确定单个分片在重组时的位置。因此，在最后一个分片上，可以将有效的偏移量与合适的分片大小相结合，使得
    `(offset + size) > 65535`。由于典型机器在获得所有分片并尝试重组之前不会处理数据包，因此存在 16 位内部变量溢出的可能性，这可能导致系统崩溃、重启、内核转储等。任何发送
    IP 数据报的程序都可以利用此漏洞——这可能是网络中最基础的构建模块。不仅是 ICMP echo，TCP、UDP 以及（显然）甚至新式的 IPX 都可以用来攻击致命要害。这个漏洞极易利用。用户已经在尝试它了，“只是为了看看是否管用”！


    # 端口号与服务


    这些数据来自互联网分配数字机构 (IANA)。IANA 维护《分配数字 RFC》。该文件中的条目格式与标准的 Berkeley UNIX `/etc/services`
    文件相同。协议与服务名称及其各自的 RFC（其标准文档）之间也存在链接。此文件有两个部分：


    -   **已知端口号**：由 IANA 分配的端口号。

    -   **注册端口号**：由 IANA 未分配的端口号。


    这提供了哪些服务哪些端口列表。网络不仅仅是 HTTP！


    ## 已知端口号


    已知端口由 IANA 控制和分配，在大多数系统中，这些端口只能由系统（或 root）进程或由特权用户执行的程序使用。端口在 TCP `[RFC793]` 中被用于命名载有长期会话的逻辑连接端点。为了向未知调用者提供服务，定义了服务联系端口。此列表指定了服务器进程作为其联系端口使用的端口。联系端口有时被称为“已知端口”。在可能范围内，这些相同的端口分配也用于
    UDP `[RFC768]`。分配的端口使用了可用端口号中的一小部分。多年来，分配端口范围在 0-255 之间。最近，IANA 管理的分配端口范围已扩展到
    0-1023。


