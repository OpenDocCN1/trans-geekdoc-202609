    ### Hardware Tricks


    For the hacker with some knowledge of computer hardware and general electronics,
    and who is prepared to mess about with circuit diagrams, a soldering iron and
    perhaps a voltmeter, logic probe or oscilloscope, still further possibilities
    open up. One of the most useful bits of kit consists of a small cheap radio receiver
    (MW/AM band), a microphone and a tape recorder.


    Radios in the vicinity of computers, modems and telephone lines can readily pick
    up the chirp chirp of digital communications without the need of carrying out
    a physical phone `tap`. Alternatively, an inductive loop with a small low-gain
    amplifier in the vicinity of a telephone or line will give you a recording you
    can analyse later at your leisure.


    By identifying the pairs of tones being used, you can separate the caller and
    the host. By feeding the recorded tones onto an oscilloscope display you can freeze
    bits, `characters` and `words`; you can strip off the start and stop bits and,
    with the aid of an ASCII-to-binary table, examine what is happening. With experience
    it is entirely possible to identify a wide range of protocols simply from the
    ‘look’ of an oscilloscope. A cruder technique is simply to record and playback
    sign-on sequences; the limitation is that, even if you manage to log on, you may
    not know what to do afterwards. Listening on phone lines is of course a technique
    also used by some sophisticated robbers. In 1982 the Lloyds Bank Holborn branch
    was raided; the alarm did not ring because the thieves had previously recorded
    the ‘all-clear’ signal from the phone line and then, duringthe break-in, replayed
    the recording up the line.


    ### Linux & Unix for beginners


    Unix has become the primo system of the Internet. In fact, Unix is the widely
    used operating system in the world among computers with more power than PCs. True,
    Windows NT is coming up fast as a common Internet system. But today Unix in all
    its flavours still is the operating system to know in order to be truly elite.
    So far we have assumed that you have been hacking using a shell account that you
    get through your Internet Service Provider (`ISP`).


    Note: Serial Line Protocol (`SLIP`) and Point-to-Point Protocol (`PPP`) connections
    give you a temporary Internet Protocol (`IP`) address that allows you to be hooked
    directly to the Internet. You have to use either `SLIP` or `PPP` connections to
    use a Web browser that gives you pictures instead on text only. So if you can
    see pictures on the Web, you already have one of these available to you. The advantage
    of using one of these direct connections for your activities is that you will
    not leave behind a shell file for your ISP''s sysadmin to study. Even if you are
    not breaking the law, a shell file that shows you doing lots of hacking can be
    enough for some sysadmins.


    What is the best kind of computer to run Unix on? Unless you are a wealthy hacker
    who thinks nothing of buying a Sun SPARC workstation, you''ll probably do best
    with some sort of PC. There are almost countless variants of Unix that run on
    PCs, and a few for Macs. Most of them are free for download, or inexpensively
    available on CD-ROMs. The three most common variations of Unix that run on PCs
    are Sun''s Solaris, `FreeBSD` and `Linux`. Solaris costs around $700. Enough said.
    FreeBSD is very good indeed. Linux, however, has the advantage of being available
    in many variants (so you can have fun mixing and matching programs from different
    Linux offerings). Most importantly, Linux is supported by many manuals, news groups,
    mail lists and Web sites. Historical note: Linux was created in 1991 by a group
    led by Linus Torvalds of the University of Helsinki. Linux is copyrighted under
    the GNU Public License. Under this agreement, Linux may be redistributed to anyone
    along with the source code. Anyone can sell any variant of Linux and modify it
    and repackage it. But even if someone modifies the source code he or she may not
    claim copyright for anything created from Linux. Anyone who sells a modified version
    of Linux must provide source code to the buyers and allow them to reuse it in
    their commercial products without charging licensing fees. This arrangement is
    known as a "copyleft." Under this arrangement the original creators of Linux receive
    no licensing or shareware fees. Linus Torvalds and the many others who have contributed
    to Linux have done so from the joy of programming and a sense of community with
    all of us who will hopefully use Linux in the spirit of good guy hacking. Viva
    Linux! Viva Torvalds!


    Linux consists of the operating system itself (called the "kernel") plus a set
    of associated programs. The kernel, like all types of Unix, is a multitasking,
    multi-user operating system. Although it uses a different file structure, and
    hence is not directly compatible with DOS and Windows, it is flexible that many
    DOS and Windows programs can be run while in Linux. So a power user will probably
    want to boot up in Linux and then be able to run DOS and Windows programs from
    Linux. Associated programs that come with most Linux distributions may include:

    * a shell program (Bourne Again Shell -- `BASH` -- is most common);

    * compilers for programming languages such as `Fortran-77` (my favorite!), `C`,
    `C++`, `LISP`, `Modula-2`, `Ada`, `Basic` (the best language for a beginner),
    and `Smalltalk`;

    * `X` (sometimes called Xwindows), a graphical interface

    * utility programs such as the email reader (my favorite)


    ### Ten reasons to install Linux on your PC:


    1. When Linux is outlawed, only outlaws will own it. Although in theory you can
    run Linux on a 286 with 4 MB RAM and two floppy drives, it is much easier with
    486 or above with 8 MB RAM, a CD-ROM, and at least 200 MB free disk space.

    2. Know as much as possible about your mother board, modem, disk, CD-ROM, and
    video card. If you have any documentation for these, have them on hand to reference
    during installation.

    3. It works better to use hardware that is name-brand and somewhat-of-date on
    your computer. Because Linux is freeware, it doesn''t offer device drivers for
    all the latest hardware. And if your hardware is like mine -- lots of `X` and
    Cheapo, you can take a long time experimenting with what drivers will work.

    4. Before beginning installation, back up your hard disk! In theory you can install
    Linux without harming your DOS/Windows files. But we are all human, especially
    following the advice of point 7.

    . Get more than one Linux distribution. The first time you successfully installed
    Linux, I finally hit on something that worked using the boot disk from one with
    the CD-ROM for another. In any case, each Linux distribution had different utility
    programs, operating system emulators, compilers and more. Add them all to your
    system and you will be set up to become elite.

    6. Buy a book or two or three on Linux. I didn''t like any of them! But they are
    better than nothing. Most books on Linux come with one or two CD-ROMs that can
    be used to install Linux. I found that what was in the books did not exactly coincide
    with what was on the CD-ROMs.

    7. I recommend drinking while installing. It may not make debugging go faster,
    but at least you won''t care how hard it is. Now I can almost guarantee that even
    following all these 6 pieces of advice, you will still have problems installing
    Linux. Oh, do I have advisories up there? Forget number 7.

    8. Be of good cheer. Since everyone else also suffers mightily when installing
    and using Linux, the Internet has an incredible wealth of resources for the Linux-challenged.

    9. If you are allergic to getting flamed, you can start out with Linux support
    Web sites. The best I found is `http://sunsite.unc.edu:/pub/Linux/`. It includes
    the Linux Frequently Questions list (`FAQ`), available from `sunsite.unc.edu:/pub/Linux/docs/FAQ`.

    10. In the directory `/pub/Linux/docs` on sunsite.unc.edu you''ll find a number
