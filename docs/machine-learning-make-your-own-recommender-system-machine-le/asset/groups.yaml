    recommendations are formed according to movie categories.


    This method is admittedly crude and overtly manual for the purpose of developing
    sophisticated recommender systems. This is why descending dimension algorithms
    are a more effective methodology for implementing dimension reduction, as we''ll
    uncover next.


    # Principal Component Analysis


    One of the most popular descending dimension algorithm techniques is principal
    component analysis (PCA). Known also as *general factor analysis*, PCA examines
    interrelations among a set of variables and removes components that have the least
    impact on data variability. This'
  - '[PAGE 33]


    helps to reveal hidden and simplified structures in the data and is often used
    as a pre-processing step before applying another algorithm, which will now run
    faster on a compressed dataset (less bloated by matrix sparsity).

    As with other descending dimension algorithms, PCA is useful for reducing data
    complexity and visualizing multidimensional data using fewer variables by synthesizing
    variables into components. The algorithm allows one to take a dataset with a high
    number of variables, such as 20-30 variables, and find the principal components
    that have the most impact on data variability. Components are identified through
    the statistical application of an orthogonal line perpendicular (at a right angle)
    to the regression hyperplane. The orthogonal line then takes the role of the new
    y-axis.


    ![](img/a19c36b1869b7a68ada55e0c3c42a30d_33_0.png)'
  - '[PAGE 34]


    In Figure 8 are four horizontal axes. The first two axes relate the x and y values
    denoted in the original data plot. The third and fourth axes measure the distance
    from the new x and y values with the orthogonal line taking the place of the original
    y-axis. The new x-axis is Principal Component 1 (PC 1), and the new y-axis is
    Principal Component 2 (PC 2).


    Under the new PC1 and PC2 axes (the third and fourth axis), we can see a change
    in variance amongst the data points. The variance in PC1 has expanded in comparison
    to the original x values (seen in the first axis). Meanwhile, the variance in
    PC2 has shrunk significantly as all data points are virtually stacked on top of
    each other, close to zero.


    As PC2 contributes the least to overall variance, we can focus our attention on
    studying the variance along PC1. While PC1 doesn’t contain 100% of the original
    information, it captures the data points that have the most impact on data patterns
    and improves computational performance.


    In this example we divided the dataset into two principal components before selecting
    one principal component. In other scenarios, you might select two or three principal
    components that contain 75% of the information from a total of ten components.
    (Of course, insisting on 100% of the information would defeat the purpose of data
    reduction and maximizing performance.)'
