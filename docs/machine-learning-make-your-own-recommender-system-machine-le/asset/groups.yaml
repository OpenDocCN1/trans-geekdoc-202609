    # # COLLABORATIVE FILTERING PART 1


    As you’ll recall from Chapter 2, recommender systems are not a specific algorithm
    but rather an application of machine learning and data mining techniques. The
    two primary architectures for recommending items are content-based filtering and
    collaborative filtering. This chapter examines collaborative filtering.


    Collaborative filtering recommends items to a user based on analysis of similar
    users and their preferences, past purchases, ratings or other general behavior.
    Collaborative filtering can also be split into two methods.


    The first method is user-based collaborative filtering, which generates recommendations
    to a target user based on the historical preferences of similar users. Another
    way of expressing this is people similar to you who buy x also buy y.


    In practice, like-minded users are first identified, and their ratings or preferences
    are then collected and grouped to produce a weighted average. The group’s general
    preferences are used to recommend items to individual users based on the ratings
    and preferences of their peers. For instance, if a user has never seen a given
    film or TV series which their peers watched and rated positively, the system will
    recommend this content item to the user based on peer observation.


    The second method is item-based collaborative filtering, which rather than finding
    users with similar preferences, finds a set of items similar to the target item
    based on user preferences. For example, Star Wars movies rated highly by a similar
    audience of users will be matched together as a set and then recommended to other
    users that like and rate one of the movies in the set. Item-based filtering can
    therefore be thought of as people who buy x also buy y.


    The main distinction between the two methods lies in the selection of input. Item-based
    filtering first takes a given item, finds users who liked that item, and then
    retrieves other items that those users liked. Conversely, user-based filtering
    first takes a selected user, finds users similar to that user based on similar
    ratings, and then recommends items that the similar users also liked. In reality,
    item-based and user-based collaborative filtering tend to produce similar item
    recommendations, but user-based filtering can be more'
  - "[PAGE 37]\n\naccurate for datasets that have a large number of users with esoteric\
    \ interests. Datasets that have less information regarding user characteristics\
    \ and tastes, though, are generally more compatible with item-based collaborative\
    \ filtering.\n\nLet's now review the advantages and drawbacks of collaborative\
    \ filtering.\n\n# Advantages\n\n+   **1) Low knowledge of item characteristics**\n\
    +   \n+   A major advantage of collaborative filtering is that it doesn’t rely\
    \ on a sophisticated understanding of items and their specific attributes. This\
    \ saves upfront effort as you don’t need to spend time meticulously documenting\
    \ items. This is especially convenient for online video and audio content items\
    \ that are generated daily and time-consuming to review and classify.\n\n+   **2)\
    \ Flexible over the long-term**\n+   \n+   As collaborative filtering responds\
    \ directly to user behavior and trends, this technique is generally more flexible\
    \ than content-based filtering at reacting to changes in user/consumer behavior.\
    \ Sudden short-term changes in fashion, pop culture, and other trends, though,\
    \ can be difficult to respond to —at least initially—depending on when the data\
    \ is collected.\n\n+   **3) Discoverability**\n+   \n+   Collaborative filtering\
    \ enables discoverability of items outside the user’s standard periphery as it\
    \ synthesizes preferences from users they’ve never met but who share similar interests.\n\
    \n# Disadvantages\n\n+   **1) Large-scale user data**\n+   \n+   A challenge and\
    \ potential drawback of collaborative filtering is the significant amount of upfront\
    \ information that is needed to document user preferences. Without this information,\
    \ collaborative filtering is largely ineffective. Amazon and Netflix have enough\
    \ user data to ride out sparsity problems in the data, but new entrants without\
    \ an established user base are handicapped. Obtaining or acquiring data from a\
    \ comparable platform, as Amazon did via its data partnership with AOL, is one\
    \ strategy to overcome the cold-start problem.\n+   \n+   Also, note that the\
    \ scalability of collaborative systems can be computationally expensive for platforms\
    \ with a massive number of users."
