    # CONTENT-BASED FILTERING


    As established in Chapter 2, content-based filtering methods provide recommendations
    based on similar item attributes and the profile of an individual user''s preferences.
    The content-based filtering system then attempts to recommend items similar to
    those that a user has liked or browsed in the past. After purchasing a book about
    “machine learning,” for example, Amazon''s content-based filtering is likely to
    serve you other books:


    +   - from the same author,

    +   - from the same category, e.g., data science, and

    +   - have similar title keywords, e.g., “machine learning.”


    As expected, content-based filtering relies heavily on a description of the item''s
    characteristics and the profiling of individual user preferences. Under this model,
    items such as documents, online posts, images, and videos need to be adequately
    described in the form of keywords/tagging/metadata or through more sophisticated
    methods such as image recognition (e.g., artificial neural networks) or text mining
    (e.g., TF.IDF).


    A book, for example, could be described by the following metadata:


    +   1. The author(s)

    +   2. The genre, e.g., thriller, romantic, statistics & probability

    +   3. The year of publication

    +   4. The type of book, e.g., fiction, non-fiction

    +   5. Book format, e.g., textbook, audiobook, e-book, hardcopy


    Likewise, user preferences need to be known and recorded. Individual user preferences’
    can be determined by examining:


    +   1. Past purchasing/consumption behavior

    +   2. Browsing history

    +   3. Personal details, e.g., gender, location, nationality, and hobbies

    +   4. The IP address to determine location and time zone


    From information gleaned about the user, filtering techniques can then compare
    this data with the description of available items and identify items to recommend.
    Content-based filtering can be a highly effective approach given that the items
    are properly tagged and there’s sufficient data about the user.


    # Advantages'
  - '[PAGE 54]


    # 1) Agnostic to crowd preferences


    A major advantage of content-based filtering is that it aids the discovery of
    relevant but low-profile items. As content-based filtering doesn''t take crowd
    preferences into account, relevant items with low exposure to the crowd can still
    be found.


    # 2) Content items are stable


    Items don''t change over time as much as people and are generally more permanent.
    People, on the other hand, are fickle and tastes change dramatically over time.
    We''re all guilty of following phases of consumption. But an item will always
    be an item, and content-based filtering is therefore less vulnerable (than collaborative
    filtering) to changes in crowd preferences.


    # 3) Items are generally fewer than users


    Most online platforms have fewer items than users, and content-based filtering
    can help to conserve computational resources by comparing a limited number of
    items rather than a larger volume of user relationships.


    # 4) Compatible with new items


    In cases where there are insufficient rating data for a new or existing item (cold-start),
    content filtering can be applied to gather information regarding other items rated/purchased/consumed
    by the target user that might share similar attributes. The item is therefore
    recommended based on the user''s interaction with similar items despite the lack
    of direct historical data.


    # 5) Mitigates cheating


    The other notable benefit of content filtering is that it''s generally more difficult
    to “game the system” because malicious actors have less control to manipulate
    or fabricate item-to-item relationships. This is not the case for item-to-user
    relationships, which can be easily inflated with a flood of fake reviews and purchases.


    # Disadvantages


    # 1) Low variety


    The variety of recommended items can be limited and less diverse than other methods.
    This is because content-based filtering depends on matching a specific item with
    similar items. Thus, items with low to no exposure to the target user are not
    likely to surface, which limits item discoverability.


    # 2) Ineffective for new users'
