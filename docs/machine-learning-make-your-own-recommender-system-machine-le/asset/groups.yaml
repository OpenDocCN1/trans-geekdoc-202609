    # Naive Bayes Classifier


    The Naive Bayes algorithm is used as a classifier in machine learning for finding
    the probability of a class based on conditional probability. This means the algorithm
    finds the probability of a target class (i.e. “pregnant” or “not pregnant”) given
    the relationship of each input feature (i.e. age, weight, etc) to that class.
    By multiplying the conditional probabilities for each feature belonging to a given
    class across the dataset, the algorithm finds the probability of a single data
    point belonging to the target class based on its input feature values.


    Naive Bayes also assumes that the influence of each feature on a given class is
    independent of other features (and not interdependent). This drastically simplifies
    the calculations, which is also why the algorithm is called “naive”.


    We’ll now use the Naive Bayes Classifier for user-based collaborative filtering
    to create a recommender system for online advertisements, where'
