    ### 人人都会撒谎：大数据、新数据以及互联网能告诉我们关于我们真实身份的信息


    **格式：** 电子书、图书、有声书


    **作者：** Seth Stephens-Davidowitz


    作者 Seth Stephens-Davidowitz 利用他在谷歌工作的经验和对古怪谷歌趋势的了解，调查常见观念，并将其与大数据和在线搜索模式进行检验，以提供数字真理血清以及关于人类行为的一些惊人启示。


