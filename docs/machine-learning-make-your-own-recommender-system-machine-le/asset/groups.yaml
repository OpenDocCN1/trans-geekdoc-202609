    While content-based filtering methods excel at recommending new items, this isn’t
    the case for new users. Without information about the user’s preferences to construct
    a user profile, there’s little way of recommending related items. To mitigate
    the cold-start problem, online platforms may attempt to extract relevant keywords
    when onboarding new users using a knowledge-based approach. Pinterest, for example,
    directs new users to specify a collection of over-arching interests that are used
    to establish a preliminary user profile and match item descriptions to content
    recommendations. Pinterest’s machine learning-based algorithms then refine the
    user’s profile and their specific interests based on observing their “pins” and
    browsing behavior.


    ## 3) Mixed quality of results


    Content-based filtering is generally accurate at selecting relevant items, but
    the quality of such items can sometimes be poor. As content-based filtering ignores
    the item ratings of other users, they are limited by their ability to decipher
    the quality of an item.


