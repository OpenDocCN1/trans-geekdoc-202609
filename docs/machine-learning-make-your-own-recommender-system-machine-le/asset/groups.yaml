    ## 隐私与伦理


    如前所述，推荐系统可以成为预测人们喜好与厌恶的极其强大的工具。它们对隐式和显式用户反馈的依赖有助于识别独特的用户偏好，但在此过程中，会揭示关于个人政治观点、健康状况、性取向以及其他私人信息的相关数据。在某些情况下，收集和处理的信息是无害的，例如，用户偏好的互联网浏览器，但其他时候，信息可能高度敏感，并引发关于个人隐私的担忧。


    搜索个人健康、健康和关系建议等敏感内容的用户，可能不愿在那些将其行为重新利用以生成推荐的平台上浏览。存在这样的风险：这些偏好后来可能会通过其屏幕上显示的内容和广告，被朋友、同事、同学和家人知晓。


    2009年，美国中西部的一名女性在其性偏好在网上被披露后起诉了Netflix。这名Netflix用户使用化名“Doe”，起诉该公司在2007年Netflix
    Prize数据集中包含她的个人信息。该诉讼是在德克萨斯大学的学术研究表明Netflix用于竞赛的数据集设计存在隐私缺陷后提出的。


    尽管Netflix试图从数据中删除个人标识符（包括个人姓名），但通过将竞赛数据集与公开可用的互联网电影数据库中的电影评级相匹配，身份还是被揭露了。研究人员发现，匿名用户对六部冷门电影的评分可以用于以84%的成功率识别特定的Netflix用户。[21]
    此外，当已知电影评论日期时，准确率上升到了99%。[22]


    在Doe诉Netflix案中，后者被判违反了美国反垄断法和《视频隐私保护法》。这场持续的诉讼还导致Netflix取消了原定于2010年举办的第二届Netflix
    Prize竞赛。


    尽管公开数据竞赛和推荐系统持续发展和扩张，数据隐私仍然是一个高度敏感的问题。2018年4月，Facebook创始人马克·扎克伯格就在其公司的用户数据共享政策出席国会听证会。他在国会山的出席是关于Facebook将选民偏好共享给一家据称为特朗普竞选活动提供支持的数据分析公司的听证会的一部分。虽然Facebook和Netflix的例子都凸显的是对用户数据管理而非特定算法（例如本书中探讨的算法）的使用的担忧，但当前的社会政治环境对推荐系统的使用产生了影响。围绕数据隐私的审查至关重要，因为用户数据被用来为个性化推荐系统提供数据。真实数据对公开竞赛的可用性对行业发展和基于算法模型的进步也至关重要，这正是第一届Netflix
    Prize的初衷。


    然而，新法规将对收集和存储用户数据的组织产生重大影响。这包括欧洲的新在线数据隐私法，即GDPR。该新法为用户如何处理其数据以及Web应用程序中Cookie的使用引入了更高的透明度，并明确了“被遗忘权”（即当用户不再希望其数据被保留时，只要没有合法保留依据）。GDPR还要求加密用户存储的个人数据，并赋予用户接受或拒绝将其个人信息用于在线推荐应用的权利。


    除了数据可用性和透明度的问题之外，关于推荐系统使用还存在特定担忧。基于欧洲近期的监管变化、美国国会的听证会以及特朗普的推特，政府们无疑对在线内容操纵日益增长的威胁感到担忧。这包括带有偏见的内容分发、国家支持的组织通过付费广告操纵公众情绪的企图，以及在线平台上的虚假新闻传播。


    所有三个担忧都与为用户提供内容的算法以及设计这些内容显示系统的平台有直接关系。例如，向Facebook用户推送内容的算法几乎无法将虚假新闻与真实新闻区分开来，也无法在政治选举期间保持中立。虽然可以采取措施屏蔽已知的虚假信息来源，但要阻止从用户收集的数据中固有产生的偏见几乎无能为力，除非完全避免这些系统。


    对于某些公司，例如Napster，避免可能是唯一的选择。尽管有呼声要求这个文件共享网站利用其对个人信息（多达7000万用户）的访问权限来向用户推荐音乐并帮助发现不太知名的艺术家，但该公司的管理层和法律顾问反对该提案。[23]
    实施协同过滤——正如当时在Napster担任计算机工程师的音乐爱好者所提议的那样——将加强唱片公司的主张，即该平台正在将用户引导至盗版内容。就像电信公司拒绝对其基础设施上进行的非法活动承担责任一样，Napster选择与其平台上的任何形式用户不当行为保持距离。[24]
    Napster坚称它仅仅是一个平台，因此，不能对其用户的行为负责。虽然这一决定并未阻止诉讼和Napster原始服务的最终消亡，但它凸显了实施推荐系统（尤其是协同过滤）的法律风险。


    无论出于对法律制裁的恐惧还是出于更利他的动机，所有从事个性化推荐系统的组织都必须制定并同意一套通用的伦理和合规准则。这包括遵守其运营和数据存储所在国家和地区的法律法规。例如，根据中国的新《网络安全法》，在中国大陆收集的中国公民个人数据不得转移和存储在境外。


    在当前背景下，美国国家科学院正在提出一份数据科学誓言，其中包括“我将尊重我数据主体的隐私”和“我将记住我的数据不仅仅是没有意义或上下文的数据数字，而是代表真实的人和情况，我的工作可能导致意想不到的社会后果”等承诺。[25]
    数据科学伦理社区倡导的其他原则包括考虑同意、警惕偏见以及保护数据免受去匿名化。


    对于希望尽量降低法律风险和其他公众后果的组织来说，一个实际的第一步是审查最初输入到推荐引擎中的信息。虽然对模型预测的输出控制能力有限，但可以采取措施限制用于过滤所选数据变量的范围。这可能意味着删除“婚姻状况”和“种族”等敏感变量，以预测信用卡申请人的适用性或在线广告的显示。此外，在内部鼓励透明度并确保高层管理和法律团队等相关部门了解用于生成推荐所选的变量，以及向用户输出的推荐内容的构成也很重要。后者尤其重要，鉴于人们对在线平台向用户推荐内容的审查日益严格。


    担忧的声音之一是Zeynep Tufekci，她是北卡罗来纳大学信息与图书馆科学学院的副教授，曾公开披露YouTube通过其自动播放推荐算法倾向于将用户推向极端内容。在2018年初发表的一篇《纽约时报》文章中，Tufekci记录了YouTube在她观看了平台上的特朗普集会后，如何将她引向白人至上主义演说、大屠杀否认和其他令人不安的内容。[26]
    同样，使用新创建的YouTube账户观看希拉里·克林顿和伯尼·桑德斯的视频，引导Tufekci观看了性质阴谋论的视频，包括秘密政府机构的存在以及美国政府涉嫌参与9·11袭击等内容。在这两种情况下，YouTube在Tufekci的用户旅程过程中推荐了越来越极端的内容，以及在观点上比她最初起点激进得多的非主流内容。


    前谷歌工程师Guillaume Chaslot也直言不讳地质疑母公司的伦理问题。在谷歌期间，Chaslot曾在开发YouTube推荐算法的团队工作。Chaslot指出他所说的对反媒体内容的偏见以及放大对其他媒体来源怨恨的推荐系统。[27]
    在2016年美国大选期间，Chaslot注意到，公开反对媒体的候选人被YouTube推荐的频率是其对手的四倍。[28]


    Chaslot还牵头启动了一个名为algotransparency.org的网站，其中包括研究工具，用于向公众说明驱动推荐算法（例如YouTube使用的算法）的因素。[29]
    跟踪的内容主题包括政治选举、大规模枪击事件和科学——甚至包括地球是否平坦的问题。毋庸置疑，关于推荐技术伦理影响的辩论将

