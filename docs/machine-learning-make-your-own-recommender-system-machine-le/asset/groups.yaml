    \ PC1 沿线的方差上。虽然 PC1 不包含原始信息的 100%，但它捕获了对数据模式影响最大的数据点，并提高了计算性能。\n\n在此示例中，我们将数据集分为两个主成分，然后选择一个主成分。在其他场景中，您可能会选择两个或三个主成分，这些主成分包含来自总共十个组件中\
    \ 75% 的信息。（当然，坚持 100% 的信息将违背数据缩减和最大化性能的目的。）\n\n![](img/a19c36b1869b7a68ada55e0c3c42a30d_35_0.png)\n\
    \n图 9：从 7 个原始特征中分离出 2 个主成分后的 PCA 示例\n\n就像将图像压缩到 JPEG 等较小的文件格式一样，包括 PCA 在内的降维技术确实会造成一定的信息丢失。因此，虽然降维有助于总结高维数据的变异性并加快训练速度，但可能会导致准确性略微下降。\n\
    \n在下一个练习中，我们将使用另一种称为奇异值分解的降维算法来压缩数据，以表示通用用户口味。\n\n## 协同过滤 第一部分\n\n如您在第 2 章中回忆的那样，推荐系统并非特定算法，而是机器学习和数据挖掘技术的应用。推荐项目的两种主要架构是基于内容的过滤和协同过滤。本章探讨协同过滤。\n\
    \n协同过滤根据对相似用户及其偏好、过去购买、评分或其他一般行为的分析，向用户推荐项目。协同过滤也可以分为两种方法。\n\n第一种方法是基于用户的协同过滤，它根据相似用户的历史偏好为目标用户生成推荐。另一种表达方式是：与您相似的人购买\
    \ x 也会购买 y。\n\n在实践中，首先识别志趣相投的用户，然后收集和分组他们的评分或偏好以得出加权平均值。群体的一般偏好用于根据同龄人的评分和偏好向单个用户推荐项目。例如，如果用户从未观看过其同龄人观看并给出正面评价的某部电影或电视剧，系统将根据同龄人观察向用户推荐此内容项目。\n\
    \n第二种方法是基于项目的协同过滤，它不是寻找偏好相似的用户，而是根据用户偏好找到与目标项目相似的一组项目。例如，由相似用户群体高度评价的《星球大战》电影将被匹配为一组，然后推荐给其他喜欢并给该组中某部电影评分的用户。因此，基于项目的过滤可以被视为：购买\
    \ x 的人也会购买 y。\n\n两种方法的主要区别在于输入的选择。基于项目的过滤首先采用给定项目，找到喜欢该项目的用户，然后检索那些用户喜欢的其他项目。相反，基于用户的过滤首先采用选定用户，根据相似评分找到与该用户相似的用户，然后推荐相似用户也喜欢的项目。在现实中，基于项目和基于用户的协同过滤倾向于产生相似的项目推荐，但基于用户的过滤对于拥有大量具有小众兴趣用户的数据集可能更准确。不过，关于用户特征和口味信息较少的数据集通常与基于项目的协同过滤更兼容。\n\
    \n现在让我们回顾协同过滤的优缺点。\n\n### 优势\n\n- **1) 对项目特征了解较少**\n\n  协同过滤的一大优势在于，它不依赖对项目及其特定属性的深入了解。这节省了前期工作，因为您不需要花费时间仔细记录项目。这对于每天生成且审查和分类耗时的在线视频和音频内容项目尤其方便。\n\
    \n- **2) 长期灵活性**\n\n  由于协同过滤直接响应用户行为和趋势，这项技术在应对用户/消费者行为变化时通常比基于内容的过滤更灵活。然而，时尚、流行文化和其他趋势中的突然短期变化——至少在最初阶段——可能难以应对，具体取决于数据收集的时间。\n\
    \n- **3) 可发现性**\n\n  协同过滤使用户能够发现其常规范围之外的项目，因为它综合了从从未见过但拥有相似兴趣的用户那里获得的偏好。\n\n###\
    \ 劣势\n\n- **1) 大规模用户数据**\n\n  协同过滤的挑战和潜在缺点之一是，记录用户偏好所需的大量前期信息。没有这些信息，协同过滤在很大程度上无效。亚马逊和\
    \ Netflix 拥有足够的用户数据来应对数据中的稀疏性问题，但没有建立用户基础的新进入者则处于劣势。像亚马逊通过与 AOL 的数据合作伙伴关系所做的那样，从可比平台获取或收购数据，是克服冷启动问题的一种策略。\n\
    \n  另外，请注意，对于用户数量庞大的平台，协同系统的可扩展性在计算上可能很昂贵。\n\n"
