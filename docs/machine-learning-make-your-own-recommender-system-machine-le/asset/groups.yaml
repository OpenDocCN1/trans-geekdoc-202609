    ### About Nearest Neighbors


    Nearest neighbors is a simple clustering technique that creates clusters based
    on the closest distance between data points. This technique finds the shortest
    distance between two data points and fuses them into one cluster. This step is
    repeated so that the next shortest distance between two data points is found,
    which either expands the size of the first cluster or forms a new cluster between
    two individual data points. For this exercise, we are searching for the closest
    three data points to a specified data point, which is determined by the user’s
    earlier search query.


