    ## PRIVACY & ETHICS


    As previously stated, recommender systems can be incredibly powerful predictors
    of people’s likes and dislikes. Their reliance on implicit and explicit user feedback
    helps to identify unique user preferences, but in doing so, reveals relevant information
    about a person’s political views, health condition, sexual orientation, as well
    as other private information. In some cases, the information collected and processed
    is benign, e.g., a user’s preferred Internet browser, but other times, information
    can be highly sensitive and provoke concerns regarding personal privacy.


    Users searching for sensitive content such as personal well-being, health and
    relationship advice might not feel comfortable browsing platforms that repurpose
    their behavior to produce recommendations. There is a danger that these preferences
    could later be revealed to friends, colleagues, classmates, and family from content
    and ads displayed on their screen.


    In 2009, a woman in America’s Midwest sued Netflix after her sexual preferences
    were disclosed online. Using the pseudonym “Doe”, the Netflix user sued the company
    for including her personal information in the 2007 Netflix Prize dataset. The
    lawsuit was filed after academic research at the University of Texas demonstrated
    privacy flaws in the design of the dataset Netflix used for the competition.


    Despite Netflix’s attempt to remove personal identifiers from the data, including
    the names of individuals, the identities were revealed by matching the competition’s
    dataset with film ratings from the publicly available Internet Movie Database.
    The researchers found that an anonymous user’s rating of six obscure movies could
    be used to identify an individual Netflix user with an 84% success rate.[21] Moreover,
    the accuracy rate rose to 99% when the date of a movie review was known.[22]


    In the case of Doe vs Netflix, the latter was ruled to have violated U.S. fair
    trade laws and the Video Privacy Protection Act. The ongoing lawsuit also led
    Netflix to cancel the second Netflix Prize competition planned for 2010.


    Although open data competitions and recommender systems have continued to develop
    and expand, data privacy remains a highly sensitive issue. In April 2018, Facebook
    Founder Mark Zuckerberg testified before Congress regarding his company’s sharing
    policies of user data. His appearance at Capitol Hill was part of a hearing into
    Facebook’s sharing of voter preferences to a data analysis firm that allegedly
    provided support to the Donald Trump election campaign. While the Facebook and
    Netflix examples both highlight concerns over the management of user data rather
    than the use of specific algorithms (such as those explored in this book), the
    current socio-political environment has repercussions on the use of recommender
    systems. The scrutiny surrounding data privacy is significant because user data
    is used to feed personalized recommender systems. The availability of real data
    for open competitions is also vital for the development of the industry and the
    advancement of algorithm-based models, as was the intention of the first Netflix
    Prize.


    New regulations, though, are set to have a major impact on organizations that
    collect and store user data. This includes Europe’s new online data privacy law
    known as GDPR. The new law introduces added transparency for users regarding how
    their data is processed and the use of cookies on web applications, as well as
    a clarified “right to be forgotten” when users no longer wish their data to be
    retained (given there are no legitimate grounds for keeping it). GDPR also requires
    the encryption of users’ stored personal data and the right of users’ to accept
    or reject the use of their personal information for the application of online
    recommendations.


    Beyond the issues of data availability and transparency, there are also specific
    concerns about the use of recommender systems. Based on recent regulatory changes
    in Europe, hearings by Congress in the United States, and tweets from Donald Trump,
    governments are undeniably concerned about the growing threat of online content
    manipulation. This includes biased content delivery, attempts by state-backed
    organizations to manipulate public sentiment through paid advertising, and the
    projection of fake news on online platforms.


    All three concerns have a direct relationship with content-feeding algorithms
    and the platforms that design these content display systems. The algorithms that
    feed content to users on Facebook, for example, have little way of weeding out
    fake stories from genuine news stories or the ability to remain bipartisan during
    a political election. While measures can be made to block known sources of false
    information, little can be done to halt the biases that inherently emerge from
    user-collected data, short of avoiding these systems altogether.


    For some companies, such as Napster, avoidance may prove the only option. Despite
    calls for the file-sharing site to capitalize on its access to personal information
    (on upwards of 70 million users) to recommend music to users and aid the discovery
    of lesser-known artists, the company’s management and legal advisors ruled against
    the proposal.[23] The implementation of collaborative filtering—as proposed by
    music enthusiasts working at Napster as computer engineers at the time—would have
    reinforced claims from the record labels that the platform was directing users
    to pirated content. Like telecommunication companies refusing to take responsibility
    for illegal activities conducted on their infrastructure, Napster chose to distance
    itself from any form of user misdoings on its platform.[24] Napster maintained
    that it was strictly a platform, and, thus, could not take responsibility for
    the actions of its users. While this decision didn’t impede lawsuits and the eventual
    demise of Napster’s original service, it highlights the legal risk of implementing
    recommender systems and especially collaborative filtering.


    Whether driven by fear of legal retribution or by more altruistic motives, it’s
    essential for all organizations that engage in personalized recommender systems
    to outline and agree to a general code of ethics and compliance. This includes
    compliance with the laws and regulations in the countries and regions they operate
    and where data is stored. Under China’s new Cybersecurity Law, for example, Chinese
    citizens’ personal data collected in Mainland China cannot be moved and stored
    outside the country.


    Amidst the current backdrop, the US National Academies are proposing a data science
    oath, including commitments that “I will respect the privacy of my data subjects”,
    and “I will remember that my data are not just data numbers without meaning or
    context, but represent real people and situations and that my work may lead to
    unintended societal consequences.”[25] Other principles advocated by the data
    science ethics community are consideration of consent, alertness to bias, and
    protecting data from becoming deanonymized.


    A practical first step for organizations that wish to minimize legal risk and
    other public repercussions is to scrutinize what information is fed to the recommendation
    engine in the first place. While there’s limited capacity to control the output
    of model-based predictions, steps can be taken to limit the scope of data variables
    chosen for filtering. This may mean removing sensitive variables such as “marital
    status” and “race” to predict the suitability of credit card applicants or the
    display of online advertisements. In addition, it’s important to encourage transparency
    internally and ensure that relevant departments such as upper management and legal
    teams are aware of the variables chosen to generate recommendations as well as
    the composition of what is recommended to users as output. The latter is especially
    important given the growing scrutiny of what online platforms recommend to users.


    One of the concerned voices is Zeynep Tufekci, an associate professor at the School
    of Information and Library Science at the University of North Carolina, who has
    publicized YouTube’s proclivity to push users toward extreme content through its
    autoplay recommendation algorithm. Published in a New York Times article in early
    2018, Tufekci documented how YouTube led her to white supremacist rants, Holocaust
    denials and other disturbing content following the viewing of Donald Trump rallies
    on the platform.[26] Similarly, viewership of Hillary Clinton and Bernie Sanders’
    videos—using a newly created YouTube account—led Tufekci to videos conspiratorial
    in nature, including the existence of secret government agencies and alleged involvement
    in the September 11 attacks by the U.S. government. In both cases, YouTube recommended
    content progressively more extreme over the course of Tufekci’s user journey and
    to content radically less mainstream in opinion than her original starting point.


    Former Google engineer Guillaume Chaslot is vocal as well in questioning the ethics
    of the parent company. While at Google, Chaslot worked in a team developing recommendation
    algorithms for YouTube. Chaslot points to what he calls a bias towards anti-media
    content and a recommender system that amplifies resentment against other media
    sources.[27] During the 2016 U.S. election, Chaslot noticed that candidates who
