  - '[PAGE 38]


    # 2) Malicious activity


    Collaborative filtering is, unfortunately, highly vulnerable to people gaming
    the system and doing the wrong thing. This includes driving fake traffic to target
    items, attacking competitor''s items with negative reviews, fabricating online
    user personas or creating a general system of user actions to cheat the system,
    also known as a shilling attack.


    One approach to minimize malicious activity is to limit the model''s analysis
    to user purchases, rather than browsing habits, as the former is more difficult
    to fabricate. That said, fraudulent online transactions are still common, and
    unscrupulous actors are continually developing their tactics to game recommender
    systems.


    Mitigating the influence of shilling attacks is an exciting and lucrative area
    of machine learning to consider as a future career path.


    # 3) Negative reputation


    As collaborative filtering relies heavily on extracting users'' personal information
    to execute recommendations to others, the use of such techniques can evoke concerns
    regarding data privacy (discussed in Chapter 10) and social manipulation. Criticism
    has surfaced in recent times regarding the 2016 U.S. election and the alleged
    role Facebook had in sharing user data to a third-party organization as well as
    their content display algorithms that potentially reinforce political biases and
    disseminate news stories.


    # 4) Consistency


    Aside from different tastes, users also have different standards—making it difficult
    to trust the consistency of rating data aggregated from multiple users. The meaning
    of a 3-star review, for example, can be interpreted differently among two users
    based on their average rating history. Standards also vary between countries and
    types of users (i.e. e-book readers versus physical book readers). Readers of
    physical books, for example, rate negatively when then are delivery delays/complications
    or production quality (i.e. paper quality) which doesn''t affect e-book readers
    who receive a digital copy on-demand. To improve the consistency of user standards,
    you may therefore need to filter user ratings by additional criteria such as country
    and customer type.


    # Exercise: Recommending books'
