    remain a hot topic in the years to come and should be a top-level consideration
    for data scientists and companies.


    Another major priority for the industry is upholding the trust of end-users. In
    countries and regions where there’s an established culture around data privacy,
    user trust can be preserved by offering users a clause to opt-out from using their
    personal information for predictive filtering. Trust can also be boosted through
    transparency and disclaimers on how and why the site delivers recommendations
    to its users.


    Part of the practice of transparency lies in the labeling of recommended content.
    In the 2013 research paper Sponsored vs. Organic Recommendations and the Impact
    of Labeling, researchers in Germany found that the labeling technique of recommended
    items significantly impacted users’ reactions.[30] The study found that the click-through
    rate for recommended content labeled as "Sponsored" was 5.93% but was 8.86% when
    the same content was labeled as "Organic." Content without a label attracted a
    click-through rate of 9.87%.


    This research indicates that it’s not necessarily in the best interest of online
    platforms, nor advertisers, to label recommended content. However, the exact click-through
    and response rate of labeled item recommendations will vary across platforms and
    use cases. Some platforms embrace transparency to their advantage. This includes
    Spotify, whose users are partly drawn to the service by the knowledge that other
    users’ tastes assist the discovery of music.


    In conclusion, the sensitivity of recommender systems can range from benign and
    inconsequential to legally unsafe and damaging to the long-term success of an
    organization. Understanding where your recommender engine sits on the spectrum
    of potential legal retribution and impact on users'' trust is essential. The answer
    will depend heavily on what data variables you choose to collect and process,
    how you store and use that information, what level of operational transparency
    you provide internally, and what you disclose externally to end-users.


    ## THE FUTURE OF RECOMMENDER SYSTEMS


    Recommender systems are one of the most visible applications of machine learning
    and data mining today, and their uncanny ability to convert our unspoken actions
    into presenting items we desire and accept is both addictive and concerning. Cloudera
    Founder Jeffrey Hammerbacher laments “the best minds of my generation are thinking
    about how to make people click ads,”[31] and Ex-Google employee Seth Stephens-Davidowitz
    envisions that “all the next Newton’s and Freud’s will be data scientists.”[32]
    It’s also difficult to foresee government intervention slowing down the sophistication
    of recommender systems and especially given that so many end-users are voluntarily
    sharing personal information with online platforms in exchange for access to their
    services. In this final chapter, we take a look at some of the coming developments
    in recommender system technology and architecture as this domain of machine learning
    continues to expand.


    ## Audio Content Mining


    With the recent explosion of audio content from podcasts and audiobooks, there
    are various opportunities in voice recognition, dictation, and natural language
    processing (NLP). This is especially so given that podcasts are a fertile medium
    for books, products, films, services, and other podcasts series recommendations.
    Given that podcast listeners generally consume content on the go or while multi-tasking,
    a system to link book and product recommendations made by their trusted podcast
    hosts to a more convenient setting such as Amazon could be highly lucrative. Audio
    content is also a great medium to build demographic profiles of users, such as
    sports fans, self-help enthusiasts, travel lovers, and computer programmers.


    One technique that can be used to extract data from audio content is named entity
    recognition. As a vital tool in the NLP toolbox, named entity recognition picks
    out salient parts of text or speech such as what (Strata Data Conference), where
    (New York), and who (data scientists). This extracted data can then be used as
    input data to feed knowledge-based, demographic or content-based recommendations
    to users.


    However, due to the inherent difficulties in decoding audio content into topics
    and conducting named entity recognition or sentiment analysis, podcasts have not
    undergone the same intense “recommendization” as text-based content or even video
    content.


    ## Voice-based Recommendations


    Siri, Echo, Alexa and other voice assistants are primed to become a dominant interface
    for recommendations as voice-based search continues to claim a larger share of
    the search market. Amazon’s Alexa has already been integrated into the LG Smart
    InstaView refrigerator, which can be used to add items to your shopping list from
    Amazon Prime among other tasks including recipe suggestions and playing music.


    ## Environment-based Recommendations


    Perhaps the most visionary of emerging recommender systems is Google’s patented
    environment-based recommender system. The tech behemoth has patented “advertising
    based on environmental conditions,” which draws on environmental factors such
    as temperature and humidity collected through device sensors. In addition to climatic
    factors, the technology is said to gather light, sound and air composition and
    translates this information into criteria for what ads to serve users.


    According to the official patent, "When determining what ads to serve to end users,
    the environmental factors can be used independently or in combination with matching
    of keywords associated with the advertisements and keywords in user search queries."[34]


    In other words, Google may intend to piece information about your online search
    activity together with your offline activities to push relevant advertisements.
    To bring this idea into focus, Google could, for example, pinpoint when you’re
    at the beach based on climatic conditions. Armed with this information, Google
    could send beach-related recommendations based on your previous search behavior,
    including preferences for local restaurants and retail outlets. GPS location tracking
    technology, though, is adequately advanced to underwrite this type of knowledge-specific
    recommendation.


    What about scenarios less reliant on location? When smoke drifts into the house
    from the BBQ cooking outside, will Amazon make ad recommendations based on your
    preference for grilled meat and vegetables? And will they make recommendations
    based on personal conversations, which TV channels you watch, and crying overheard
    by a linked device? These questions are yet to be answered, and a filed patent
    is not a linear indication that Google will ship this technology in the future.
    A patent merely secures the intellectual protection of an internal company idea.
    The patent, though, does draw attention to the simple and early-stage sophistication
    of current recommender systems, which as we know, are largely based on binary
    likes and ordinal star ratings.


    ## Recommendation-driven Story Arches


    Personalization stands at the forefront of recommender systems’ success so far,
    and a logical extrapolation of this trend is to go beyond recommending one item
    against another, to crafting content based on sophisticated personalization.


    A commercial manifestation of this concept might be a TV series with multiple
    story arches that vary according to the reaction of the individual. Facial recognition,
    for example, could be used to collect a user’s emotional ties to a particular
    protagonist. If Gandalf in the Lord of the Rings is centimeters from death and
    the viewer is clearly disturbed by this scene, Gandalf may suddenly be spared
    through the viewer’s 3-D glasses or viewing apparatus. Similarly, scenes may change
    to an alternative story arch based on the number of children in the audience through
    deep learning-backed face recognition technology that can detect the mean age
    of viewers.

