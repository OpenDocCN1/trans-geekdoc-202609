    ### The Netflix Prize and Production Machine Learning Systems: An Insider Look


    **Format:** Blog


    **Author:** Mathworks


    **Suggested Audience:** All


    A very interesting blog article demonstrating how Netflix applies machine learning
    to form movie recommendations.


    ### Recommender Systems


    **Format:** Coursera course


    **Presenter:** The University of Minnesota


    **Cost:** Free 7-day trial or included with $49 USD Coursera subscription


    **Suggested Audience:** All


    Taught by the University of Minnesota, this Coursera specialization course covers
    fundamental recommender system techniques including content-based and collaborative
    filtering as well as non-personalized and project-association recommender systems.


    ### Everybody Lies: Big Data, New Data, and What the Internet Can Tell Us About
    Who We Really Are


    **Format:** E-book, book, audiobook


    **Author:** Seth Stephens-Davidowitz


    Drawing on his experience working for Google and knowledge of bizarre Google trends,
    author Seth Stephens-Davidowitz investigates common beliefs and tests them against
    big data and online search patterns to deliver digital truth serum as well as
    some surprising revelations about human behavior.


    ### Amazon.com Recommendations Item-to-Item Collaborative Filtering


    **Format:** Industry report


    **Author:** Greg Linden, Brent Smith, and Jeremy York


    Industry report on item-to-item collaborative filtering by Amazon.com.


    ### Mining Massive Data Sets, Winter 2018


    **Format:** Stanford University course video archive


    **Lecturer:** Jure Leskovec


    Video archive of the 2018 course Mining Massive Data Sets taught at Stanford by
    Jure Leskovec. Two weeks of this course are specifically dedicated to recommender
    systems.


    ### Kaggle


    **Format:** Online platform


    **Suggested Audience:** All


    Kaggle is an online community for data scientists and statisticians to access
    free datasets, join competitions, and simply hang out and talk about data. A great
    thing about Kaggle is that they offer free datasets for download. This saves you
    the time and effort in sourcing and tidying up your own dataset. Meanwhile, you
    also have access to discuss and problem-solve with other users on the forum about
    particular datasets. All datasets used in the exercises in this book can be downloaded
    for free from Kaggle.


    ### Data and Goliath: The Hidden Battles to Collect Your Data and Control Your
    World


    Format: E-book, book, audiobook


    Author: Bruce Schneier


    Suggested Audience: All


    Regardless of your interest concerning private data security, this book is a must-read
    to understand the arguments against modern data surveillance. Of note to readers
    of this book, Schneier articulates the adverse effects of highly precise recommender
    systems which can do more damage than good in regards to customer loyalty for
    the companies that devise them.


    ### The Power of Habit: Why We Do What We Do in Life and Business


    Format: E-book, book, audiobook


    Author: Charles Duhigg


    Suggested Audience: All


    While better classified under the self-help genre than machine learning, this
    book offers practical insight into human nature, which is a compatible and potentially
    valuable field for data scientists to study. I believe that readers will find
    Chapter 7 (How Target Knows What You Want Before You Do) of this book inspiring
    and insightful as it includes one of the most detailed accounts of the famous
    Target marketing campaign that could discern if a customer was pregnant—even before
    the customer’s parents found out.


    ## BUG BOUNTY


    Thank you for reading this absolute beginners’ introduction to recommender systems.


    We offer a financial reward to readers for locating errors or bugs in this book.
    Some apparent errors could be mistakes made in interpreting a diagram or following
    along with the code in the book, so we invite all readers to contact the author
    first for clarification and a possible reward, before posting a one-star review!
    Just send an email to the author at **oliver.theobald@scatterplotpress.com** explaining
