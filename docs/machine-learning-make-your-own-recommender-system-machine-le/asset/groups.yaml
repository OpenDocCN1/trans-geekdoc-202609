    tidy profit from your feedback, and we can update the book to improve the standard
    of content for future readers.


    ## FROM THE AUTHOR


    Thank you for purchasing this book. Recommender systems offer an exciting field
    of opportunity for budding data scientists, and you’re now on the path to developing
    your own basic recommender systems.


    I sincerely wish you all the best with your future career in data science. If
    you have any direct feedback about aspects of the book you strongly liked or dislike,
