    accuracy of their recommender systems by focusing on the data that serves most
    useful to their goals of the analysis.

    Another reason why data reduction is useful is that it might not be possible to
    visualize the data until after it’s been compressed into fewer variables.

    Having an excessive number of variables or dimensions, greater than three (3-D)
    or four (4-D) dimensions, can make it difficult or impossible to visualize patterns
    and regularities in the dataset.

    The downside of data reduction, though, is a potential dip in accuracy and loss
    of relevant data, and this trade-off presents a constant challenge for data scientists.

    Let’s now take a look at specific examples of data reduction.


    # Row Compression


    Row compression involves reducing the volume of rows while attempting to preserve
    information from the original structure.

    Rather than outright deleting rows, this might take the form of compressing a
    large number of rows into a lower number of clusters (groups of data points) based
    on similar values using a technique called k-means clustering.

    YouTube, for example, has 1.3 billion users.

    This is not a dataset you want to fiddle with inside an Excel spreadsheet,[17]
    but using data reduction methods you can reduce the volume of rows into a smaller
    and more manageable number.


    # Dimension Reduction


    Known also as descending dimension algorithms, dimension reduction transforms
    data from high-dimensional to low-dimensional.

    This works through the strategic selection of dataset columns.

    Be wary that this is not a case of deleting columns or the data those columns
    contain but mathematically transforming data in a way that the information collected
    is captured using fewer dimensions.


    Dimensions are the number of variables characterizing the data, such as the city
    of residence, country of residence, age, and gender of a user.

    Up to four variables can be plotted on a scatterplot, but three-dimensional and
    two-dimensional plots are the easiest for human eyes to interpret.'
