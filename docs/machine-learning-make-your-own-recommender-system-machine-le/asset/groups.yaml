    **作者：** Charu C. Aggarwal


    **建议受众：** 所有人


    这本教科书远远是推荐系统领域最好的资源，对于任何希望在此领域深入研究的人来说，物超所值（电子版 59 美元，Amazon 上平装版 55 美元）。


    ### Netflix 奖与生产机器学习系统：内部视角


    **格式：** 博客


    **作者：** Mathworks


    **建议受众：** 所有人


    一篇非常有趣的博客文章，展示了 Netflix 如何应用机器学习来形成电影推荐。


    ### 推荐系统


    **格式：** Coursera 课程


