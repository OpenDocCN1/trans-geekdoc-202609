    # # EVALUATION


    If you’re familiar with the mechanics of machine learning, you might have noticed
    the absence of training and test data used in the models demonstrated thus far.
    An explanation for this vital question will be revealed later in this chapter,
    but, first, let’s review the purpose of split validation.


    The partitioning of a dataset into training data and test data, known as split
    validation, is a fundamental part of machine learning. The training data is used
    to detect general patterns and design a prediction model, while the test data
    is used to test the model and compare the results. In sum, if we reserve 30% of
    the data and test it with the model developed from patterns discovered in the
    initial 70% of the data, will the model’s predictions hold accurate?


    If the model’s predictions falter using the test data, this is generally an indicator
    of overfitting or underfitting. Overfitting happens when the model has to adjust
    itself to fit patterns in the training data but is too complicated and made-to-measure
    to replicate its prediction accuracy with the test data or new data. Underfitting,
    meanwhile, is where the model is too simple and underdeveloped, making it a weak
    predictor of the training and test data.


    There are numerous techniques to compare the performance of the model using the
    training data and the test data. For classification-based models, a popular method
    is the confusion matrix, which is a simple table that tabulates the performance
    of classification algorithms like Naive Bayes Classifier and logistic regression.


    | | Predicted 0 | Predicted 1 |

    |---|---|---|

    | **Actual is 0** | Correct | Incorrect |

