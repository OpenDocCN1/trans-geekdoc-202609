    ## FOREWORD


    From relevant friend suggestions on Facebook to product recommendations on Amazon,
    there’s no missing the presence of recommender systems. Take a look at what you’ve
    recently viewed and consumed online because many of your online activities, including
    finding this book, probably originated from algorithm-backed recommendations.
    These data-driven systems are eroding the dominance of traditional search engines
    while aiding the discoverability of niche and esoteric items. As a breakaway branch
    of machine learning, it’s more important than ever to understand how these models
    work, and in this book, we go a step further by coding three basic recommender
    systems.


    This book is designed for beginners with partial background knowledge of data
    science and machine learning, including statistics and computing programming using
    Python. If this is your first foray into data science, you may want to spend a
    few hours reading my first book Machine Learning for Absolute Beginners before
    you get started here.


    ## DATASETS USED IN THIS BOOK


    ### Goodbooks-10k Datasets (Chapter 6)


    These two datasets contain information about books and user ratings collected
    from www.goodreads.com. The first dataset contains book ratings from individual
    users, while the second dataset contains information about individual books such
    as their average rating, number of five-star ratings, ISBN number, author, etc.

    https://www.kaggle.com/sriharshavogeti/collaborative-recommender-system-on-goodreads/data


    ### Advertising Dataset (Chapter 7)


    This dataset contains fabricated information about the features of users responding
    to online advertisements, including their gender, age, location, daily time spent
    online, and whether they clicked on the advertisement. The dataset was created
    by Udemy course instructor Jose Portilla of Pierian Data and is used in his course
    Python for Data Science and Machine Learning Bootcamp.

    https://www.kaggle.com/fayomi/advertising/data


    ### Melbourne Housing Market (Chapter 8)


    This third dataset contains data on house, unit, and townhouse prices in Melbourne,
    Australia. This dataset comprises data scraped from publicly available listings
    posted weekly on www.domain.com.au. The full dataset contains 14,242 property
    listings and 21 variables including address, suburb, land size, number of rooms,
    price, longitude, latitude, postcode, etc.

    https://www.kaggle.com/anthonypino/melbourne-housing-market/


    ## INTRODUCING SCIKIT-LEARN


    Scikit-learn is the core library for general machine learning. It offers an extensive
    repository of shallow algorithms[1] including logistic regression, decision trees,
    linear regression, gradient boosting, etc., a broad range of evaluation metrics
    such as mean absolute error, as well as data partition methods including split
    validation and cross validation.


    Scikit-learn is also used to perform a number of important machine learning tasks
    including training the model and using the trained model to predict the test data.


    The following table is a brief overview of common terms and functions used in
    machine learning from Scikit-learn.


    | Term | Explanation | Code Example |

    |---|---|---|

    | estimator | An estimator refers to a set hyperparameter value, such as C in
    Support Vector Machines, n_neighbors in k-NN or n number of trees in random forests.
    Set prior to training your model, the estimator maps each hyperparameter value
    to the learning algorithm. | model = ensemble.GradientBoostingRegressor(<br>    n_estimators
    = 150,<br>    learning_rate = 0.1,<br>    max_depth = 30,<br>    min_samples_split
    = 4,<br>    min_samples_leaf = 5,<br>    max_features = 0.6,<br>    loss = "huber"<br>)<br><br>Each
    of the seven hyperparameters represents an individual estimator for the algorithm
    gradient boosting. |

    | fit() | After setting the estimator(s), the fit() function is used to run the
    learning algorithm on the training data and train the prediction model. | model
    = KNeighborsClassifier(n_neighbors=5)<br>model.fit(X_train, y_train)<br><br>This
    code excerpt fits the k-NN model to the X and y training data. |

    | predict() | After the model has been trained, the predict() function uses the
    newly trained model to make predictions using the X test data. In the case of
    supervised learning, this involves using the model to predict the labels or values
    of the X test data. | prediction = model.predict(X_test)<br><br>In this example,
    the trained model is asked to predict the X test data and is assigned as a new
    variable ("prediction"). |

    | transform() | The transform() function is used to modify the data before feeding
    it to a learning algorithm (pre-processing). This means taking the original data
    and outputting a transformed version of it. Examples include normalization, standardization,
    dimensionality reduction. | from sklearn.preprocessing import StandardScaler<br>scaler
    = StandardScaler()<br>scaler.fit(X_train)<br>X_train = scaler.transform(X_train)<br><br>After
    importing StandardScaler, we can use the transform method to rescale/standardize
    the X training data. The transformed training data is scaled to unit variance
    with a mean of zero and can now be fit to a learning algorithm. |


    Table 1: Overview of key Scikit-learn terms and functions


