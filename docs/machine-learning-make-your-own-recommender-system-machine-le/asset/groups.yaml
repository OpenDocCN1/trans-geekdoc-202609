    ### Kaggle


    **格式：** 在线平台


    **建议受众：** 所有人


    Kaggle 是一个面向数据科学家和统计学家的在线社区，用于访问免费数据集、参加竞赛，以及简单地交流和讨论数据。Kaggle 的一个优点是他们提供免费数据集下载。这为您节省了寻找和整理自己的数据集的时间和精力。同时，您还可以在论坛上与其他用户讨论特定数据集并解决问题。本书练习中使用的所有数据集均可从
    Kaggle 免费下载。


