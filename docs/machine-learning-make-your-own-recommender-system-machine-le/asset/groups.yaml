  - '[PAGE 13]


    # THE ANATOMY


    Before we dive into exploring specific algorithms, we first need to examine how
    recommender systems fit into the broader landscape of data science.


    Data science, itself, is an interdisciplinary field of methodologies and algorithms
    to extract knowledge or insight from data. Within the vast space of data science
    lies the popular field of artificial intelligence (AI), which is the ability of
    machines to simulate intellectual tasks. A prominent sub-field of artificial intelligence
    is machine learning, among other sub-fields such as perception, and search and
    planning. Recommender systems fall under the banner of machine learning and, to
    some extent, data mining.


    ![](img/a19c36b1869b7a68ada55e0c3c42a30d_13_0.png)


    Figure 1: Visual representation of data-related fields and sub-fields


    **Machine learning** applies statistical methods to improve performance based
    on previous experience. While the programmer is responsible for feature selection
    and setting the model''s hyperparameters (algorithm learning settings), the machine
    learning model makes decisions on the contents of the output based on advanced
    pattern recognition. This process of combing data for patterns and forming predictions
    is known as self-learning and represents a major distinction from traditional
    computer programming where computers are designed to perform set tasks in response
    to pre-programmed commands.'
  - '[PAGE 14]


    ![](img/a19c36b1869b7a68ada55e0c3c42a30d_14_0.png)


    Figure 2: Basic model representation of machine learning


    **Data mining** is the process of discovering and unearthing patterns contained
    in complex datasets. Popular self-learning algorithms such as k-means clustering,
    decision trees, and regression analysis are used in both data mining and machine
    learning. However, whereas machine learning focuses on incremental and ongoing
    problem-solving using models that evolve with experience, data mining concentrates
    on cleaning up large datasets to create valuable insight at a set point in time.


    Data mining describes what happened in the past, whereas machine learning uses
    the past to predict the future and refines its predictions over time based on
    experience and the iterative process of self-learning. Data mining, for instance,
    is suited for tasks like cleaning up historical road traffic data to find the
    optimal route for a delivery fleet based on past experience.


    Recommender systems draw on both machine learning and data mining techniques,
    but machine learning models are more typical because user preferences develop
    over time. Secondly, data mining is less conducive to solving tasks with a limited
    amount of data. In many recommender scenarios, there''s sparse upfront data regarding
    the user and their existing preferences. Machine learning, though, can be used
    to make inferences and gradually learn from user behavior and optimize recommendations
    through extensive trial and error.


    Let''s now talk about the actual algorithms. First, recommender systems shouldn''t
    be mistaken as a single algorithm or even a family of related algorithms. Unlike
    decision trees, regression analysis, and clustering analysis (three separate families
    of algorithms), recommender systems are a mismatch of different algorithms united
    under one common goal: to make relevant recommendations. Whether it''s logistic
    regression, nearest neighbors clustering or principal component analysis, recommender
    systems consist of algorithm(s) that can best recommends items to users. Second,
    recommender systems can be separated into two overarching methodologies: **collaborative
    filtering** and **content-based filtering**.'
