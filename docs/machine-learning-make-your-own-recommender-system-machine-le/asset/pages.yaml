- pgno: 33
  md: 'helps to reveal hidden and simplified structures in the data and is often used
    as a pre-processing step before applying another algorithm, which will now run
    faster on a compressed dataset (less bloated by matrix sparsity).

    As with other descending dimension algorithms, PCA is useful for reducing data
    complexity and visualizing multidimensional data using fewer variables by synthesizing
    variables into components. The algorithm allows one to take a dataset with a high
    number of variables, such as 20-30 variables, and find the principal components
    that have the most impact on data variability. Components are identified through
    the statistical application of an orthogonal line perpendicular (at a right angle)
    to the regression hyperplane. The orthogonal line then takes the role of the new
    y-axis.


