  md: '# INTRODUCTION


    It wasn’t long ago that surfing the Internet was a standalone activity in our
    daily life like reading the newspaper or watching a movie. For an hour or two,
    we disconnected the phone line and listened to the screech of the modem link to
    the world wide web.


    Load speed was slow, and there was a drawn-out thought-process that preceded each
    click. Waiting twenty seconds or longer for a page to render placed a heavy time
    penalty on clicking the wrong link. But, later, as wireless broadband Internet
    infiltrated more homes, schools, and offices, online behavior changed and our
    browsing habits started to become more brazen.


    Oops! Clicked on the wrong link? No problem. Jab the “Back” button and you’re
    right back where you started. A few seconds might be lost but as Steve Krug writes
    in Don’t Make Me Think: A Common Sense Approach to Web Usability, “there’s not
    much of a penalty for guessing wrong.”[2] Krug clarifies that users don’t choose
    the best option but rather the “first reasonable option,” a strategy he calls
    “satisficing.” “As soon as we find a link that seems like it might lead to what
    we’re looking for, there’s a very good chance that we’ll click on it.”[3]


    Design practices would also help to further streamline user habits. As Internet
    users became more familiar with site navigation, web designers caught on that
    it was easier and more effective to imitate existing design norms than attempt
    to reinvent the wheel. Web users came to expect to see the “Log In” button in
    the top right corner of the page, contact details and more menu options in the
    footer, and the biggest and brightest button as a clue for what to click next.


    But with this newfound confidence, we as users relinquished some of our behavioral
    programming from the offline world to carefully absorb and digest information.
    Inpatient and impervious to distraction, our attention spans plummeted and “satisficing”
    took hold. As Mike McGuire, vice president of the technology research firm Gartner,
    explains, “If there’s not something else there surfacing that meets your interest
    beyond what you initially dialed in for, then you’re out.”[4]


    Realizing the problem, the Internet companies pinpointed that they needed a new
    way to hook attention and curb our smash-and-grab mentality. They knew it was
    impossible to design online content catering to individual needs'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'and designing content tailored to a general audience merely made it easy for
    users to skim past on the way to what they came for. Flashing banners, intrusive
    pop-up windows, and hierarchical lists of popular or recent articles were tried
    but nothing could quite compare with a deliberately more quantitative approach.
    While this new strategy took almost two decades to perfect, it would radically
    change online browsing habits and empower platforms that could master this emerging
    and powerful technique.


    The answer was a system of algorithms called recommender systems; systems that
    could predict what an individual user liked and mirror related items to the user
    in highly visible sections of the website. Author Robert Green explains the psychological
    power of mirrors in The 48 Laws of Power.


    > “You look deep into the souls of other people, fathom their innermost desires,
    their values, their tastes, their spirit and reflect it back to them. Making yourself
    into a kind of mirror image. Your ability to reflect their psyche back to them
    gives you great power over them.”[5]


    While the theory was sound, it took time for the algorithms to work. Rudimentary
    systems evolved in the early 1990s and were refined in the mid-1990s as the web
    matured into a medium for online commerce. The early exponents of these systems
    were Dotcom companies like GroupLens who built models to predict a reader’s interest
    in online news articles.[6]


    Amazon was another front-runner to the new trend. Understanding the power of user
    data to drive operational decisions, the Seattle-based company adopted machine-generated
    recommendations as a tool to push relevant products to customers. Their early
    recommendations were crude and clumsy, relying on tags to serve items based on
    related categories and keywords. Then, in a series of tactical moves to improve
    their capacity to recommend products to users, the company made a deal with AOL
    in the early 2000s. The deal granted Amazon access to operate the technology behind
    AOL’s e-commerce platform and acquire access to their data. While AOL viewed its
    user data in terms of its primary value (recorded sales data), Amazon identified
    a secondary value that would improve its ability to push personalized product
    recommendations to users on the Amazon marketplace.


    Fueled with this new source of data, Amazon’s product recommendations became progressively
    sophisticated as different algorithms and filtering techniques attached to the
    site like a molecule chain. The use of'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'recommender systems contributed to Amazon’s expanding market share and played
    a critical role in helping authors in all genres reach more readers.


    Joe Simpson published his book Touching the Void (documenting his near-death experience
    scaling the Andes in Peru) in the mountain climbing category in 1988. According
    to Chris Anderson, the author of The Long Tail, Simpson’s book received positive
    reviews but struggled to maintain attention post its release. A decade later,
    another mountaineering book, Into Thin Air written by Jon Krakauer, was released
    and enjoyed initial success on the Amazon platform. Recognizing a statistically
    significant combination of customers that had purchased both books, Amazon began
    promoting Touching the Void to customers who bought Into the Air and vice versa.
    This sparked a sales revival of the former that would eventually eclipse the popularity
    of its more recent contemporary.[7]


    But the success of Amazon’s recommender algorithm came at a cost because like
    others in the book retail industry, Amazon relied on human editors to recommend
    books to customers. Amazon’s editors drew on their expert knowledge of literature
    sold on the platform and the Amazon customer base to propose recommendations.
    For a time, it seemed that both the in-house reviewers and the faceless algorithms
    could work together—not in unison but at least side-by-side. The fate of Amazon’s
    in-house editors was later settled when the company ran tests comparing sales
    data.


    “Eventually the editors were presented with the precise percentage of sales Amazon
    had to forgo when it featured their reviews online,” explain the authors of Big
    Data: A Revolution That Will Transform How We Live, Work and Think, Viktor Mayer-Schönberger
    and Kenneth Cukier.[8]


    Today a third of all of Amazon’s sales are thought to emanate from its recommendation
    engine[9] and the original team of in-house book reviewers has long since disbanded.
    Amazon now dominates the online book business and has forced many traditional
    giants to the side or expelled them from the publishing industry.


    The effectiveness of algorithm-based recommender systems appears to be having
    a similar effect on online organizations without the same data-driven mindset.
    In April 2018, the founders of Inbound.org (the “Hacker News” of the content marketing
    world) emailed subscribers explaining their uneasy decision to shut down the site.
    Inbound.org Co-founder, Dharmes Shah, sighted social recommendation engines as
    one of the barriers to its growth.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '...it’s time to say farewell to inbound.org, as we know it. Why? Primarily
    because though the concept of a community is compelling—the core use case of user-curated
    marketing content is not. My suspicion is that it’s because of the way people
    find and share content has changed a great deal since inbound.org’s inception.
    With the growth of messaging platforms and the sharpening of social recommendation
    engines, content curation via community submission and voting is useful—but not
    indispensable.”[10]


    In 2011, the co-author of Mosaic, co-founder of Netscape, and partner of Silicon
    Valley VC firm Andreessen Horowitz, Marc Andreessen, declared, “software is eating
    the world.” In 2018, it seems that recommender systems are having a similar impact
    on the web.


    In the next chapter, we’ll move past the macro impact of recommender systems and
    start to break down their unique features and ability to predict user preferences.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# THE ANATOMY


    Before we dive into exploring specific algorithms, we first need to examine how
    recommender systems fit into the broader landscape of data science.


    Data science, itself, is an interdisciplinary field of methodologies and algorithms
    to extract knowledge or insight from data. Within the vast space of data science
    lies the popular field of artificial intelligence (AI), which is the ability of
    machines to simulate intellectual tasks. A prominent sub-field of artificial intelligence
    is machine learning, among other sub-fields such as perception, and search and
    planning. Recommender systems fall under the banner of machine learning and, to
    some extent, data mining.


    ![](img/a19c36b1869b7a68ada55e0c3c42a30d_13_0.png)


    Figure 1: Visual representation of data-related fields and sub-fields


    **Machine learning** applies statistical methods to improve performance based
    on previous experience. While the programmer is responsible for feature selection
    and setting the model''s hyperparameters (algorithm learning settings), the machine
    learning model makes decisions on the contents of the output based on advanced
    pattern recognition. This process of combing data for patterns and forming predictions
    is known as self-learning and represents a major distinction from traditional
    computer programming where computers are designed to perform set tasks in response
    to pre-programmed commands.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/a19c36b1869b7a68ada55e0c3c42a30d_14_0.png)


    Figure 2: Basic model representation of machine learning


    **Data mining** is the process of discovering and unearthing patterns contained
    in complex datasets. Popular self-learning algorithms such as k-means clustering,
    decision trees, and regression analysis are used in both data mining and machine
    learning. However, whereas machine learning focuses on incremental and ongoing
    problem-solving using models that evolve with experience, data mining concentrates
    on cleaning up large datasets to create valuable insight at a set point in time.


    Data mining describes what happened in the past, whereas machine learning uses
    the past to predict the future and refines its predictions over time based on
    experience and the iterative process of self-learning. Data mining, for instance,
    is suited for tasks like cleaning up historical road traffic data to find the
    optimal route for a delivery fleet based on past experience.


    Recommender systems draw on both machine learning and data mining techniques,
    but machine learning models are more typical because user preferences develop
    over time. Secondly, data mining is less conducive to solving tasks with a limited
    amount of data. In many recommender scenarios, there''s sparse upfront data regarding
    the user and their existing preferences. Machine learning, though, can be used
    to make inferences and gradually learn from user behavior and optimize recommendations
    through extensive trial and error.


    Let''s now talk about the actual algorithms. First, recommender systems shouldn''t
    be mistaken as a single algorithm or even a family of related algorithms. Unlike
    decision trees, regression analysis, and clustering analysis (three separate families
    of algorithms), recommender systems are a mismatch of different algorithms united
    under one common goal: to make relevant recommendations. Whether it''s logistic
    regression, nearest neighbors clustering or principal component analysis, recommender
    systems consist of algorithm(s) that can best recommends items to users. Second,
    recommender systems can be separated into two overarching methodologies: **collaborative
    filtering** and **content-based filtering**.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Content-based filtering techniques, also known as item-based filtering, recommend
    similar items to a user based on items they have purchased or consumed in the
    past. Under this logic, a user who enjoys watching five cat videos is likely to
    watch a sixth cat video if recommended to them.


    Collaborative filtering, meanwhile, recommends items to an individual based on
    the items purchased or consumed by other users with shared interests. For instance,
    YouTube fans of cat videos may also like to watch fitness videos. In this particular
    case, the items (cat video and fitness video) have no direct relationship to each
    other in terms of genre or keywords found in their descriptions and metadata.
    The YouTube recommender will nevertheless suggest fitness videos to cat enthusiasts
    based on the behavior of similar users. Amazon and other online platforms often
    label this approach on their website as “See what other users bought.” Reflecting
    the wisdom of the crowd is another way of thinking about collaborative filtering.


    However, this isn’t to say that collaborative filtering is a blind framework for
    identifying popular items like a top ten list. More accurately, it’s a method
    to match items that share some form of popular association among similar types
    of users.


    A well-used example highlighting the difference between collaborative and content-based
    filtering is a side-by-side comparison of Last.fm and Pandora Radio. Both music
    platforms use recommender systems to feed songs to listeners, but where Last.fm
    draws on collaborative filtering, Pandora Radio employs a content-based approach


    Last.fm plays songs based on what artists and song tracks the user has listened
    to in the past and compares this information with the listening behavior of similar
    users. If other users with similar music tastes as the target user go through
    a phase of regularly listening to Billy Joel tracks, Last.fm is likely to recommend
    Billy Joel songs to the target user (based on the taste of those similar users).
    By tracking the interests of similar users, Last.fm also serves music that users
    may not discover on their own.


    Pandora’s approach to song selection generates less diverse results because it
    looks exclusively at the listener’s taste in music and generates a playlist based
    on similar content features. This might mean pairing songs from related genres
    or music vintages.


    Pandora also creates content-based recommendations based on similarities in musical
    style, song structure, and other attributes. Their analysis'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'comprises over 450 attributes to describe music properties including the gender
    of the lead vocalist, level of distortion on the electric guitar, and type of
    background vocals.[11]


    If you’re not familiar with Pandora, then you might have noticed similar content-based
    recommendations on YouTube. If you watch enough music videos from the early 2000s,
    the video player and sidebar lead you to other popular music videos from that
    era and not Billy Joel’s song Piano Man from 1977 or Macklemore’s Thrift Shop
    hit from 2014.


    As discussed further in later chapters, there is a constant trade-off between
    applying collaborative filtering and content-based filtering. Collaborative filtering,
    for example, requires a significant amount of upfront data about users to produce
    effective recommendations. This situation is known as the _cold-start problem_,
    which can also affect content-based filtering where there’s insufficient profiling
    of new items.


    We’ll explore the specific advantages and disadvantages as well as the practical
    application of these two methodologies in Chapter 6 and Chapter 7 (collaborative
    filtering) and Chapter 8 (content-based filtering).


    Beyond these two recommender frameworks, there are various other techniques that
    complement or serve as adaptations to content-based and collaborative filtering.


    # # The Hybrid Approach


    A popular alternative to collaborative and content-based filtering is the hybrid
    approach, which draws on a combination of techniques to serve useful recommendations.
    The amalgamation of methods and the flexibility built into this approach softens
    the drawbacks of using just one methodology.


    Hybrid recommender systems also benefit from the ability and flexibility to combine
    multiple data sources and data types. Ordinal data[12] values such as item ratings,
    for example, are generally used for collaborative based-filtering, whereas continuous
    variables such as item price and size are more suitable for content-based filtering.
    A hybrid solution enables the machine learning developer to pipe both data inputs
    and then segment analysis using different techniques.


    In practice, a hybrid recommender system operates by running as a unified model
    or by separating content-based and collaborative filtering or other'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'methods and then combining the predictions. Many popular online platforms including
    Netflix rely on this type of hybrid approach.


    # # Knowledge-based Recommenders


    Knowledge-based systems provide item recommendations based on a user’s needs and
    relevant information. This normally works on an inference basis, where the system
    makes recommendations based on unique knowledge about the user.


    Amazon, for example, leverages its knowledge of books a user has recently read
    on their Kindle device to send emails recommending other titles from the author,
    such as a sequel or other books by the same author.


    Another example of knowledge-based recommenders is the constant flow of advertisements
    that reverberate and pursue you online after searching for something on Google.
    Using the same techniques they use to recommend videos, YouTube serves advertisements
    based on specific knowledge gained from other platforms including your Google
    search history.


    Knowledge-based recommenders closely resemble content-based recommenders, and
    the demarcation line between the two methods can be difficult to discern.[13]
    Knowledge-based systems, however, are unique because they enable users to specify
    what they want directly and aren’t reliant on the historical data of interactions
    between items and users.[14]


    Knowledge-based recommenders are also highly effective at recommending rare items.
    This includes rarely purchased or consumed items related to tourism, real estate,
    relocation, car rental, legal services, and other less frequent business scenarios.


    As there’s generally limited historical data about a user’s preference for such
    items, it’s difficult for content-based filtering to generate useful recommendations
    or even anticipate the existence of such needs. Knowledge-based systems, though,
    excel at recommending relevant items without the aid of historical data, such
    as the once-in-a-lifetime need for a graduation gown.


    Knowledge, though, can be a double-edged sword. If the information is sensitive
    and collected through covert means, such as paid data acquisition from a third-party,
    that knowledge doubles as a breach of user privacy. This can cause problems both
    from an ethical standpoint and potentially from a legal point of view.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'For users that share a laptop or user account, the unintended consequences
    of knowledge-based systems can be harmful and may cross the line of user privacy.
    A user’s search for “divorce attorney” or “guidance for dealing with depression”
    may be detected by their otherwise uninformed partner or children through subsequent
    advertisements and related content recommendations.


    Finally, as they require highly specific information about user needs, knowledge-based
    systems can be difficult for smaller companies to develop and implement.


    # Demographic Recommenders


    Demographic recommenders deliver recommendations based on user stereotypes and
    are typically combined with other methods such as knowledge-based recommenders
    to build a hybrid model. Regular returning users, for example, might be served
    recommendations different from that of infrequent users. Other user profiles might
    be generated based on spending patterns among a specific demographic group or
    even by what football team they support.


    The key to this technique is data collection and gathering sufficient information
    about the target user from signup forms or user profile pages. Alternatively,
    data might be collected through observation such as the location of the user’s
    IP address, online spending, and saved cookies to discern whether they have visited
    the site before, and if so, how frequently.


    While demographic recommenders appear similar to knowledge-based systems, they
    rely on different types of data for input. Whereas knowledge-based systems focus
    on situational information, such as the user’s need to buy a car, demographic
    recommenders are dependent on the characteristics of the user, which are more
    stable and reliable over time.


    # Mobile-based Recommenders


    Given the ubiquitous nature of Internet-enabled mobile devices and smartphones,
    mobile recommenders are a rapidly emerging branch of recommender system and serve
    recommendations based on users’ geographic location.


    On Facebook, advertisers can send targeted ads to users active in a new geographic
    area. A tourist arriving in Australia, for example, might receive'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'recommendations to visit a local brewery 25 kilometers from their current location.
    Visits to an out-of-town brewery are often a one-time experience, but for the
    brewery, targeting newcomers to the local area provides an evergreen market for
    targeted ad campaigns.


    As the technology used to capture real-time insights from mobile devices develops,
    collaborative filtering is expected to become more integrated into mobile recommender
    systems. The composition of heterogeneous data, though, remains a bottleneck to
    expanding the use of these systems. As the data collected from mobiles is retrieved
    from a range of different devices, extra processing such as spatial and temporal
    autocorrelation is required. In addition, mobile recommender systems need to factor
    in a considerable amount of context-based information to produce useful recommendations.
    This includes consideration of local traffic, weather conditions, item availability,
    and so forth. There''s little use of recommending a tourist to visit a local brewery
    if public transport is not available. The logical solution to this issue is to
    combine a knowledge-based recommender system with a mobile recommender and utilize
    information about the user’s browsing activity (e.g., local car hire website)
    to inform its recommendations for local activities.


    Other variants of recommender systems not explored in this chapter include:


    +   - constraint-limited recommenders (e.g., bound to a user’s specified budget
    or vacation dates),

    +   - time-sensitive recommenders (e.g., the time of year or time of day). Pop-tarts
    at Walmart in the U.S., for example, sell well with essential storm supplies in
    the lead-up to a storm. Pop-tarts, however, are not necessarily a popular purchase
    choice with storm supplies at other times of the year.

    +   - location-based recommenders (arguably the same as mobile-based recommenders),

    +   - group-based recommenders that aggregate individual preferences to recommend
    content or activities to a group of users (e.g., music played at a bar, advertisements
    played on giant screens in shopping departments or restaurant recommendations
    for families), and

    +   - social recommenders based on social structures and mutual relationships
    (e.g., key opinion leader identification on Twitter or friend'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'suggestions on social media based on mutual friends).

    Other recommender system approaches set to become more prominent in

    the future are explored in Chapter 11.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# SETTING UP A SANDBOX ENVIRONMENT


    Now that you’re familiar with the theoretical framework of recommender systems,
    it’s time to turn our attention to building a prediction model. For the exercises
    presented in this book, we’ll be using the programming language Python, which
    is quick to learn and popular among data scientists. If you don’t have programming
    expertise or any experience coding in Python, don’t worry. The key purpose of
