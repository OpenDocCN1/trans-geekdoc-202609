- pgno: 46
  md: '# COLLABORATIVE FILTERING PART 2


    A large part of recommender systems is deciphering whether a user will be receptive
    to a recommended item. Singular-value decomposition, as explored in the previous
    chapter, is a method that can be used to predict user preferences in the case
    of a sparse dataset. For situations where data is not sparse, we can use other
    algorithms including logistic regression and Naive Bayes.


    The Naive Bayes Classifier—a classification method based on Bayes’ theorem—is
    often used in data science for predicting discrete classes such as spam filtering,
    A/B testing, sentiment analysis, text classification, and recommender systems.


    # Bayes’ Theorem


    Devised in the middle of the 18th Century, Bayes'' theorem is used for making
    inferences based on existing information (conditional probability) and is a central
    pillar of classical statistics. The formula for Bayes’ theorem is shown here:


    ```

    P(A|B) = \frac{P(A) P(B|A)}{P(B)}

    ```


    In this formula, A and B represent two events, and P represents the probability
    of that event occurring. Therefore:

    P(A|B) is the probability of A given that B happens (conditional probability)

    P(A) is the probability of A (marginal probability)

    P(B|A) is the probability of B given that A happens (conditional probability)

    P(B) is the probability of B (marginal probability)


    # Example: Evaluating a home pregnancy test'
  merge: -1
  img_proc: true
- pgno: 47
  md: "Let's say that following a clinical test, a drug company advertises a home\
    \ pregnancy test as 99% accurate in detecting pregnancy among pregnant women.\
    \ However, of the women who participated in the clinical test only 5% were pregnant.\
    \ This scenario can be expressed as follows:\n\nEvent A = Pregnant\nEvent B =\
    \ Positive test result\n\nP(A) is the probability of pregnancy without any regard\
    \ to the result of the test = 5%\nP(B|A) is the probability of a positive test\
    \ result given the woman is pregnant = 99%\nP(A|B) is the probability of pregnancy\
    \ given a positive test result = Unknown\nP(B) is the probability of a positive\
    \ test result without any regard to whether the woman is pregnant = Unknown\n\n\
    ```\nP(A|B) = \n 0.05 x 0.99\n -----------\n P(B)\n```\n\nWe now need to solve\
    \ for P(A|B) and P(B), which is the probability of pregnancy given a positive\
    \ test result, and the probability of a positive test result among all participants.\n\
    \n+   There are two elements to consider for P(B):\n+   1) True-positives: a woman\
    \ that tests positive (99%) who is pregnant (5%), and\n+   2) False-positives:\
    \ a woman that tests positive (1%) who isn’t pregnant (95%)\n+   P(B) = (0.99\
    \ * 0.05 + 0.01 * 0.95)\n\nLet's now add P(B) to the equation to solve for P(A|B):"
  merge: -1
