  md: '# # WORKING WITH DATA


    The data for recommender systems often consists of two entities in the form of
    “users” and “items” organized in what’s called a utility matrix. While it sounds
    intimidating, a utility matrix is a pivot table containing pairs of values, such
    as an individual user and their ratings for given items.


    | | Movie 1 | Movie 2 | Movie 3 | Movie 4 | Movie 5 | Movie 6 | Movie 7 |

    |---|---|---|---|---|---|---|---|

    | User 1 | | | | | 1 | | 1 |

    | User 2 | | 4 | | 5 | | 5 | |

    | User 3 | | 3 | 2 | 5 | | | |

    | User 4 | | | | 2 | 3 | 4 | |

    | User 5 | | 3 | | | | | |

    | User 6 | | | | 4 | | | 5 |

    | User 7 | | | 5 | 5 | 5 | | |


    Users are often arranged vertically in rows, and items are placed horizontally
    in columns. The preferences of each user to a given item can be found by searching
    for the relevant column. The aligning cell depicts the user’s preference for that
    item, which is generally represented as a numeric value. In the case of the evaluation
    systems used by Netflix and Amazon, these values are expressed as categorical
    integers (whole numbers) between one and five that specify user tastes.


    However, not all user preference systems boil down to a simple score between one
    and five. On Facebook, for example, users can only “like” posts that appear in
    their social feed. As a binary feature, these actions can be converted into numeric
    values using a technique called one-hot encoding, which transforms variables into
    binary form, represented as “1” or “0”—“True” or “False.” In the case of Facebook,
    “Likes” can be encoded as “1” and the absence of a “like” or “unknown” (where
    the value is null) is encoded as “0.”'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Before One-hot Encoding


    | Customer | Customer Action Status |

    |---|---|

    | Customer 1 | Purchased |

    | Customer 2 | Added to Shopping Cart |

    | Customer 3 | No Action Taken |


    # After One-hot Encoding


    | Customer | Purchased | Shopping_Cart | No_Action |

    |---|---|---|---|

    | Customer 1 | 1 | 0 | 0 |

    | Customer 2 | 0 | 1 | 0 |

    | Customer 3 | 0 | 0 | 1 |


    Table 3: Example of one-hot encoding


    In situations where users don’t offer feedback in the form of a rating, like,
    or other action to express their preference for that item—the value is referred
    to as “sparse,” meaning the value is unknown. This is common on the web, as most
    people don’t review every item they consume. Like most users, you probably only
    submit a rating and share direct feedback for a fraction of the items you consume
    and purchase online. Given the heavy presence of null values in a utility matrix,
    it can sometimes be difficult to generate high-quality recommendations.


    There are two general methods to counter the problem of a sparse matrix. The first
    method is to accelerate the collection of user feedback by enticing users to leave
    a review, a “like,” or other forms of feedback that help to define user tastes.
    This method, though, is generally met with hard resistance or false information
    provided by the user in exchange for a reward.


    The second approach is to generate inferences about user preferences through indirect
    feedback, known as latent variables. These are variables that are not directly
    observed but are inferred through observing other known variables. One of the
    most obvious indications of a user’s personal preferences is to analyze their
    historical purchase data,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'which has become more available with the growth of online commerce and smartphone
    usage.


    Other indirect ways of discerning users’ preferences are whether they watched
    a video clip through to its completion,[15] shared an online article to friends,
    and the time spent on page. Importantly, these examples don’t require direct feedback
    or additional effort by the user and are much easier to gather in high volume.


    Text mining and sentiment analysis can also be utilized to review user preferences
    contained inside text-based comments pertaining to video, news, and other digital
    content but these collection techniques are more advanced and resource-intensive
    to run.


    When collecting data, it’s important to keep in mind that utility matrixes work
    optimally with values that clearly categorize a users’ preference, including ordinal
    variables such as the 1 to 5-star rating system or binary/Boolean variables such
    as Facebook “Likes.” Ordinal variables are values categorized in a clear sequence,
    whereas Boolean variables are binary values that produce one of two set outcomes,
    such as yes/no, true/false, 0/1.


    To categorize user preferences, data scientists sometimes need to create a Boolean
    or ordinal threshold for other variable types. For instance, if a user watches
    a video clip through (or near to) its completion, this action is labeled as “1”
    (the user liked the video). If the user abandons the video halfway through or
    below a set playback threshold (of say 80%), then it is labeled as “0” (the user
    didn’t like the video or their preference is unknown).


    This technique, though, generally fails to compare with the convenience and precision
    of systems that collect data directly from the user as ordinal or Boolean variables.
    This is because the transformation of other variable types can come with interpretation
    bias. Unlike ordinal and binary variables, it’s challenging to define user preferences
    based on continuous variables (infinite/not limited to a set range of values)
    such as time spent on page. As an example, how do we know if a user liked an 800-word
    blog post that took seven minutes to read compared to another blog of similar
    length which took five and a half minutes to read? Perhaps the first blog was
    poorly written, and it took the user longer to digest. Alternatively, maybe the
    user found the information they needed from the second blog and then quickly jumped
    to another website to complete their tax return or'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'submit a visa application. Ordinal variables, on the other hand, clearly communicate
    user preferences based on predefined values that express whether a user liked
    a given item. It’s no coincidence that Amazon and Netflix—two of the most prolific
    exponents of recommendation systems—built a library of explicit user preferences
    organized into a five-star evaluation system.


    Keeping your utility matrix as objective and simple as possible, including the
    use of ordinal or binary values generated directly by the user, also makes your
    data more accurate and straightforward to process. Online platforms developing
    recommender systems can therefore learn from Amazon and Netflix’s success when
    designing their own user interface. Also, it’s important that data scientists
    cooperate and provide input on the design of the website or app being developed
    based on the data types they wish to analyze in the future.'
  merge: -1
  img_proc: true
