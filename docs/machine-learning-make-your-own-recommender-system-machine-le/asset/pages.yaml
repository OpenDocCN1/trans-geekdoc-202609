  md: '# # COLLABORATIVE FILTERING PART 1


    As you’ll recall from Chapter 2, recommender systems are not a specific algorithm
    but rather an application of machine learning and data mining techniques. The
    two primary architectures for recommending items are content-based filtering and
    collaborative filtering. This chapter examines collaborative filtering.


    Collaborative filtering recommends items to a user based on analysis of similar
    users and their preferences, past purchases, ratings or other general behavior.
    Collaborative filtering can also be split into two methods.


    The first method is user-based collaborative filtering, which generates recommendations
    to a target user based on the historical preferences of similar users. Another
    way of expressing this is people similar to you who buy x also buy y.


    In practice, like-minded users are first identified, and their ratings or preferences
    are then collected and grouped to produce a weighted average. The group’s general
    preferences are used to recommend items to individual users based on the ratings
    and preferences of their peers. For instance, if a user has never seen a given
    film or TV series which their peers watched and rated positively, the system will
    recommend this content item to the user based on peer observation.


    The second method is item-based collaborative filtering, which rather than finding
    users with similar preferences, finds a set of items similar to the target item
    based on user preferences. For example, Star Wars movies rated highly by a similar
    audience of users will be matched together as a set and then recommended to other
    users that like and rate one of the movies in the set. Item-based filtering can
    therefore be thought of as people who buy x also buy y.


    The main distinction between the two methods lies in the selection of input. Item-based
    filtering first takes a given item, finds users who liked that item, and then
    retrieves other items that those users liked. Conversely, user-based filtering
    first takes a selected user, finds users similar to that user based on similar
    ratings, and then recommends items that the similar users also liked. In reality,
    item-based and user-based collaborative filtering tend to produce similar item
    recommendations, but user-based filtering can be more'
  merge: -1
  img_proc: true
- pgno: 37
  md: "accurate for datasets that have a large number of users with esoteric interests.\
    \ Datasets that have less information regarding user characteristics and tastes,\
    \ though, are generally more compatible with item-based collaborative filtering.\n\
    \nLet's now review the advantages and drawbacks of collaborative filtering.\n\n\
    # Advantages\n\n+   **1) Low knowledge of item characteristics**\n+   \n+   A\
    \ major advantage of collaborative filtering is that it doesn’t rely on a sophisticated\
    \ understanding of items and their specific attributes. This saves upfront effort\
    \ as you don’t need to spend time meticulously documenting items. This is especially\
    \ convenient for online video and audio content items that are generated daily\
    \ and time-consuming to review and classify.\n\n+   **2) Flexible over the long-term**\n\
    +   \n+   As collaborative filtering responds directly to user behavior and trends,\
    \ this technique is generally more flexible than content-based filtering at reacting\
    \ to changes in user/consumer behavior. Sudden short-term changes in fashion,\
    \ pop culture, and other trends, though, can be difficult to respond to —at least\
    \ initially—depending on when the data is collected.\n\n+   **3) Discoverability**\n\
    +   \n+   Collaborative filtering enables discoverability of items outside the\
    \ user’s standard periphery as it synthesizes preferences from users they’ve never\
    \ met but who share similar interests.\n\n# Disadvantages\n\n+   **1) Large-scale\
    \ user data**\n+   \n+   A challenge and potential drawback of collaborative filtering\
    \ is the significant amount of upfront information that is needed to document\
    \ user preferences. Without this information, collaborative filtering is largely\
    \ ineffective. Amazon and Netflix have enough user data to ride out sparsity problems\
    \ in the data, but new entrants without an established user base are handicapped.\
    \ Obtaining or acquiring data from a comparable platform, as Amazon did via its\
    \ data partnership with AOL, is one strategy to overcome the cold-start problem.\n\
    +   \n+   Also, note that the scalability of collaborative systems can be computationally\
    \ expensive for platforms with a massive number of users."
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 2) Malicious activity


    Collaborative filtering is, unfortunately, highly vulnerable to people gaming
    the system and doing the wrong thing. This includes driving fake traffic to target
    items, attacking competitor''s items with negative reviews, fabricating online
    user personas or creating a general system of user actions to cheat the system,
    also known as a shilling attack.


    One approach to minimize malicious activity is to limit the model''s analysis
    to user purchases, rather than browsing habits, as the former is more difficult
    to fabricate. That said, fraudulent online transactions are still common, and
    unscrupulous actors are continually developing their tactics to game recommender
    systems.


    Mitigating the influence of shilling attacks is an exciting and lucrative area
    of machine learning to consider as a future career path.


    # 3) Negative reputation


    As collaborative filtering relies heavily on extracting users'' personal information
    to execute recommendations to others, the use of such techniques can evoke concerns
    regarding data privacy (discussed in Chapter 10) and social manipulation. Criticism
    has surfaced in recent times regarding the 2016 U.S. election and the alleged
    role Facebook had in sharing user data to a third-party organization as well as
    their content display algorithms that potentially reinforce political biases and
    disseminate news stories.


    # 4) Consistency


    Aside from different tastes, users also have different standards—making it difficult
    to trust the consistency of rating data aggregated from multiple users. The meaning
    of a 3-star review, for example, can be interpreted differently among two users
    based on their average rating history. Standards also vary between countries and
    types of users (i.e. e-book readers versus physical book readers). Readers of
    physical books, for example, rate negatively when then are delivery delays/complications
    or production quality (i.e. paper quality) which doesn''t affect e-book readers
    who receive a digital copy on-demand. To improve the consistency of user standards,
    you may therefore need to filter user ratings by additional criteria such as country
    and customer type.


    # Exercise: Recommending books'
  merge: -1
  img_proc: true
