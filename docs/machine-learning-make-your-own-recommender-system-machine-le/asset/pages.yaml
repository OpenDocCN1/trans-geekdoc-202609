  md: '# INTRODUCING SCIKIT-LEARN


    Scikit-learn is the core library for general machine learning. It offers an extensive
    repository of shallow algorithms[1] including logistic regression, decision trees,
    linear regression, gradient boosting, etc., a broad range of evaluation metrics
    such as mean absolute error, as well as data partition methods including split
    validation and cross validation.


    Scikit-learn is also used to perform a number of important machine learning tasks
    including training the model and using the trained model to predict the test data.


    The following table is a brief overview of common terms and functions used in
    machine learning from Scikit-learn.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '| Term | Explanation | Code Example |

    |---|---|---|

    | estimator | An estimator refers to a set hyperparameter value, such as C in
    Support Vector Machines, n neighbors in k-NN or n number of trees in random forests.
    Set prior to training your model, the estimator maps each hyperparameter value
    to the learning algorithm. | model = ensemble.GradientBoostingRegressor(<br>    n_estimators
    = 150,<br>    learning_rate = 0.1,<br>    max_depth = 30,<br>    min_samples_split
    = 4,<br>    min_samples_leaf = 5,<br>    max_features = 0.6,<br>    loss = "huber"<br>)<br><br>Each
    of the seven hyperparameters represents an individual estimator for the algorithm
    gradient boosting. |

    | fit() | After setting the estimator(s), the fit() function is used to run the
    learning algorithm on the training data and train the prediction model. | model
    = KNeighborsClassifier(n_neighbors=5)<br>model.fit(X_train, y_train)<br><br>This
    code excerpt fits the k-NN model to the X and y training data. |

    | predict() | After the model has been trained, the predict() function uses the
    newly trained model to make predictions using the X test data. In the case of
    supervised learning, this involves using the model to predict the labels or values
    of the X test data. | prediction = model.predict(X_test)<br><br>In this example,
    the trained model is asked to predict the X test data and is assigned as a new
    variable ("prediction"). |

    | transform() | The transform() function is used to modify the data before feeding
    it to a learning algorithm (pre-processing). This means taking the original data
    and outputting a transformed version of it. Examples include normalization, standardization,
    dimensionality reduction. | from sklearn.preprocessing import StandardScaler<br>scaler
    = StandardScaler()<br>scaler.fit(X_train)<br>X_train = scaler.transform(X_train)<br><br>After
    importing StandardScaler, we can use the transform method to rescale/standardize
    the X training data. The transformed training data is scaled to unit variance
    with a mean of zero and can now be fit to a learning algorithm. |


    Table 1: Overview of key Scikit-learn terms and functions'
  merge: -1
