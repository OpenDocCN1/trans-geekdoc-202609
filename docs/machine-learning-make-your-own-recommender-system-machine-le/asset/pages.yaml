    Reviewing the results of the confusion matrix for the training and test datasets
    can then be used to make comparisons regarding prediction performance.


    # Coding Example


    Below is a code example of the same Bayes’ model used to recommend online advertisements
    in Chapter 7, but, this time, using split validation and a confusion matrix to
    analyze prediction accuracy.


    ```

    #Import libraries

    import pandas as pd

    from sklearn.naive_bayes import GaussianNB

    from sklearn.model_selection import train_test_split

    from sklearn.metrics import classification_report, confusion_matrix


    #Import dataset

