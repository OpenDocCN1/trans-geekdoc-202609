    This is a classic case of a scarce dataset, as users haven’t submitted a rating
    for each individual item. To overcome this problem, we can compress individual
    user preferences into a lower number of general user tastes.


    # Step 4


    To compress the values of individual readers, we’ll use a descending dimension
    algorithm called singular-value decomposition (SVD) to convert the total number
    of individual readers into a limited number of components. Similar to principal
    component analysis, singular-value decomposition is used to rank the importance
    of features (dimensions) and reduce a high-dimensional dataset into fewer dimensions
    while retaining maximum variance.


    SVD is used here over PCA as it is more effective at handling missing values treated
    as zero in a sparse dataset. You can learn more about the mathematical differences
    between these two descending dimension'
