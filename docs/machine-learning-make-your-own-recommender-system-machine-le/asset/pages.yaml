  md: '# DATA REDUCTION


    Recommender systems rely on data as input, which can be collected through an assortment
    of channels including sign up forms, web crawling, logs of online user behavior,
    IP and geographic tracking, and many other channels.


    There are two major categories of input data: **structured data** and **unstructured
    data**. Structured data is information that resides in a fixed field within a
    record or file. This generally comprises information stored in rows and columns
    with a defined schema (a blueprint of how the database is constructed). Examples
    of structured data include event registration information stored in the rows and
    columns of a spreadsheet or user profiles stored in a relational database, including
    users’ personal information and shipping address.


    Unstructured data or non-structured data is information that doesn’t fit neatly
    into a pre-defined data model or isn’t organized in a pre-defined manner. This
    includes information found in emails, social media posts, word processing documents,
    voice recordings, etc. In this book, we focus on structured data stored in rows
    and columns as exemplified by the utility matrix discussed in the previous chapter.


    While structured data is far closer to “production-ready” than unstructured data,
    it still requires some manipulation and preparation before its ready for the model
    to analyze. This might entail deleting irrelevant data, redesigning non-numeric
    values as numeric values, discarding infrequent users/buyers, discarding extremely
    unpopular items, and reducing the overall quantity of data through column or row
    compression. If you aren’t familiar with the data reduction techniques mentioned
    so far, don’t worry, as we’ll cover most of these methods here in this chapter.


    First, though, what *is* the purpose of data reduction? In sum, data reduction
    helps to separate the signal from the noise, reduce processing time, and minimize
    the consumption of computational resources. Popular e-commerce platforms and social
    media networks have up to millions of individual users and items. iTunes and Spotify,
    alone, have approximately 40+ and 30+ million songs on their platforms respectively.[16]
    As these sites are working with massive datasets, the computational costs of managing
    data are significant as well as time-consuming to process. Using data reduction
    techniques, they can improve the performance, efficiency, and'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'accuracy of their recommender systems by focusing on the data that serves most
    useful to their goals of the analysis.

    Another reason why data reduction is useful is that it might not be possible to
    visualize the data until after it’s been compressed into fewer variables.

    Having an excessive number of variables or dimensions, greater than three (3-D)
    or four (4-D) dimensions, can make it difficult or impossible to visualize patterns
    and regularities in the dataset.

    The downside of data reduction, though, is a potential dip in accuracy and loss
    of relevant data, and this trade-off presents a constant challenge for data scientists.

    Let’s now take a look at specific examples of data reduction.


    # Row Compression


    Row compression involves reducing the volume of rows while attempting to preserve
    information from the original structure.

    Rather than outright deleting rows, this might take the form of compressing a
    large number of rows into a lower number of clusters (groups of data points) based
    on similar values using a technique called k-means clustering.

    YouTube, for example, has 1.3 billion users.

    This is not a dataset you want to fiddle with inside an Excel spreadsheet,[17]
    but using data reduction methods you can reduce the volume of rows into a smaller
    and more manageable number.


    # Dimension Reduction


    Known also as descending dimension algorithms, dimension reduction transforms
    data from high-dimensional to low-dimensional.

    This works through the strategic selection of dataset columns.

    Be wary that this is not a case of deleting columns or the data those columns
    contain but mathematically transforming data in a way that the information collected
    is captured using fewer dimensions.


    Dimensions are the number of variables characterizing the data, such as the city
    of residence, country of residence, age, and gender of a user.

    Up to four variables can be plotted on a scatterplot, but three-dimensional and
    two-dimensional plots are the easiest for human eyes to interpret.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/a19c36b1869b7a68ada55e0c3c42a30d_31_0.png)


    The ability to visualize relationships and patterns is convenient for communication
    purposes but isn’t necessary for producing predictions. Models that contain the
    input of 20 variables can be parsed to identify patterns and aid decision-making
    through binary outputs such as 1 (true) and 0 (false) or numeric predictions.


    Beyond the ability to visualize results in four or fewer dimensions, the other
    benefits of dimension reduction are the reduced consumption of computational resources
    through processing fewer variables and removing or minimizing the impact of variables
    that don’t have a significant impact on data patterns.


    There are several methods for reducing dimensionality, ranging from simple manual
    manipulation to more sophisticated algorithmic transformations. At the primitive
    end of the data reduction spectrum, there is the manual approach of merging variables.
    For example, if we examine the following dataset of user movie ratings, we can
    use categorization to reduce the total number of variables without deleting existing
    information.'
  merge: -1
  img_proc: true
