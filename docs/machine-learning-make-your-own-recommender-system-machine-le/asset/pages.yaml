    del df[''City'']

    del df[''Male'']

    del df[''Country'']


    #Assign X and y variables

    X = df.drop(''Clicked on Ad'',axis=1)

    y = df[''Clicked on Ad'']


    #Split the data into training and test tests (70/30)

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=10)

    ```'
