    # B. Deep Learning Model


    In this work, the data input is to a 1-D CNN which is followed by a LSTM layer.
    The duration of the ECG segments in the dataset varies but the CNN requirements
    are fixed. Some preliminary experiments showed that fixing the length of the signals
    to 15 seconds (7,500 sample points) achieved similar performance to fixing it
    to 60 seconds (30,000), but the length of the duration reduced. A significant
    advantage of using long signals over 60 long signals is reduced computational
    costs. Therefore, the length of all the signals were fixed at 15 seconds using
    zero-padding and cropping.


    An overview of the CNN architecture used in this work is provided in Fig. 2. The
    network has five convolutional layers each followed by a batch normalization layer
    and rectified linear unit (ReLU). The number of filters in the layers are 15,
    10, 10, 1, and 4, each with a stride of 1. The output of each convolutional layer
    is followed by a max pooling layer of size of 1x1, 1x10, 1x1, and 1x3, with a
    stride of 2. The final pooling layer is followed by a BiLSTM layer, then fully
    connected, and a softmax layer. The dropout layer has a probability of 0.2 and
    the number of hidden units in the BiLSTM layer is


    The distribution of labels is absent. In this work, this is accounted using cross
    entropy loss in the final layer


    ```

    $L = -\frac{1}{N} \sum_{i=1}^{N} c_i t_i \log(y_i)$

    ```


    where $Y$ represents the prediction scores, $T$ the training targets, the number
    of observations, $K$ the number of classes, and $c$ the class weights.


    The CNN model was trained using adaptive estimation (Adam) [19] algorithm. Adam
    uses the average of the first and second moments of the gradients to adapt the
    learning rate, for it is given


    ```

    $\hat{m}_t = \frac{m_t}{1-\beta_1^t} \quad \ \hat{v}_t = \frac{v_t}{1-\beta_2^t}}$

    ```'
