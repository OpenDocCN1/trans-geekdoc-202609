    # # Detecting Cardiac Abnormalities Using Use-Lead

    ECG and Deep Learning


    Roned V. Sharan

    Australian Institute of Health Innovation

    Sydney, Australia

    roned.sharan@mnq.edu.au


    **Abstract—** The standard 12-lead electrocardiogram (ECG) is widely used by cardiologists
    however manual interpretation of ECG can be time and depending on the skills of
    the clinicians. In this work, an approach for detecting cardiac abnormalities
    using automatic analysis of 1-lead ECG is presented and validated on a comprehensive
    dataset where all abnormalities have similar rhythm. The proposed approach uses
    raw ECG signals as a direct input to a model of convolutional neural networks.
    The dataset includes multiple cardiac conditions to account for which binary classification
    strategy is utilized, in particular the one-against-all classifier is used to
    compensate for the imbalance in the class. While the ECG signals in the dataset
    are up to 60 seconds long the automatic processing of the signals was used to
    produce comparable performance with lower computational costs. Our method achieved
    a Score of 0.8602 and AUC of 0.8624 when using the proposed method.


    techniques for studying the heart rate variability on the R-interval, analysis
    of the P, QRS, and T patterns [6], analyzing the power spectrum of the rhythms
    [7], and entropy-based measures [8]. However methods have been supervised by deep
    learning methods. In particular, convolutional neural networks (CNN) have been
    used to distinguish ECG signals [9], without the need for any signal processing,
    feature extraction, and feature selection.


    In this work, the 1-lead ECG signals are used as a direct input to a one-dimensional
    convolutional neural network (CNN) for detecting cardiac abnormalities without
    preprocessing steps. The long short-term memory (LSTM) is an artificial recurrent
    neural network that is particularly suited to sequence and data series classification.
    Deep learning the LSTM can learn and predict from past states. In this work, a
    LSTM is used with a CNN for classification of multi-channel ECG signals, as shown.
    This allows the network to learn the feature representations together and the
    temporal relationship between the features.


    **Keywords—**bidirectional short-term memory, cardiac abnormalities, convolutional
    neural networks, entropy


    # I. INTRODUCTION


    Cardiovascular diseases (CVD) are the leading cause of death globally. It is estimated
    that 19.9 million people died from CVD in 2016, accounting for 31% of all deaths
    [1]. In USA, CVD was the cause of death in 7.0 million in 2018 (27% of all deaths)
    and is considered avoidable cause of death in about 70,000 people.


    CVDs are a group of disorders of the heart and circulation. This includes various
    abnormalities such as cardiac arrhythmias. Early detection of cardiac abnormalities
    is crucial. Electrocardiogram (ECG) is a non-invasive method of recording the
    electrical activity of the heart using electrodes on the surface of the body.
    The standard 12-lead ECG is a widely used tool for diagnosis of various cardiac


    Manual interpretation of ECG is, however, time consuming and depending on the
    skills of the personnel [5]. Automatic analysis of the ECG signal can assist in
    the diagnosis of cardiac abnormalities, the signal processing and machine learning
    techniques in the detection of cardiac abnormalities has a lot of interest.


    Conventionally, this has been achieved using various signal processing, feature
    extraction, and feature selection


    The rest of the paper is organized as follows. The dataset used in this work is
    described in Section II with the CNN-LSTM classification method and the performance
    metrics. The experimental results are presented in Section III and discussion
    and conclusion in Section IV.


    # A. Dataset


    The dataset used in this work has 6,877 records of 12-lead ECG signals with a
    sampling frequency of 500 Hz [1]. The records come from 11 hospitals and the duration
    of the records varies from 6 to 60 seconds. Moreover, 3,699 records are from male
    subjects and subjects from female subjects.'
