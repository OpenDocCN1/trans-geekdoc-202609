- pgno: 160
  md: "# **CYBERSECURITY RISK MANAGEMENT PROGRAM OBJECTIVES (CYBERSECURITY OBJECTIVES)**\n\
    \n**DC3: The entity’s principal cybersecurity risk management program objectives\
    \ (cybersecurity objectives) related to availability, confidentiality, integrity\
    \ of data, and integrity of processing**\n\n# *Implementation Guidance*\n\n*When\
    \ making judgments about the nature and extent of disclosures to include about\
    \ this criterion, consider the following:*\n\n+   - An entity ordinarily establishes\
    \ cybersecurity objectives that address the following:\n    - Commitments made\
    \ to customers, vendors, business partners, and others related to the security\
    \ and availability of information and systems, including commitments related to\
    \ public well-being as it relates to the entity’s products and operations, infrastructure,\
    \ and extended supply chains\n    - Laws and regulations to which the entity is\
    \ subject as a result of the types of information it possesses or uses (for example,\
    \ protected health information and personally identifiable information)\n    -\
    \ Commitments made as part of a certification and authorization process for government\
    \ agencies and other parties\n    - Industry standards to which the entity is\
    \ subject as a result of the types of information it uses (for example, Payment\
    \ Card Industry Data Security Standards for organizations that accept or process\
    \ credit card transactions) and\n    - Other business initiatives\n\n+   - An\
    \ entity’s cybersecurity objectives depend on the nature of the entity’s business\
    \ and the industry in which it operates; accordingly, they should reflect the\
    \ entity’s specific cybersecurity risks. The following is an example of cybersecurity\
    \ objectives an entity might establish.\n\n    **Availability**\n    *Enabling\
    \ timely, reliable, and continuous access to and use of information and systems\
    \ to support operations and to*\n    - comply with applicable laws and regulations;\n\
    \    - meet contractual obligations and other commitments;\n    - provide goods\
    \ and services to customers without disruption;\n    - safeguard entity assets\
    \ and assets held in custody for others; and\n    - facilitate decision making\
    \ in a timely manner."
  merge: -1
  img_proc: true
- pgno: 161
  md: '# **Confidentiality**


    Protecting information from unauthorized access and disclosure, including means
    for protecting proprietary information and personal information subject to privacy
    requirements, to


    +   - comply with applicable laws and regulations;

    - meet contractual obligations and other commitments; and

    - safeguard the informational assets of an entity.


    # **Integrity of Data**


    Guarding against improper capture, modification or destruction of information
    to support the following:


    +   - The preparation of reliable financial information for external reporting
    purposes

    - The preparation of reliable nonfinancial information for external reporting
    purposes

    - The preparation of reliable information for internal use

    - Information nonrepudiation and authenticity

    - The completeness, accuracy, and timeliness of processing

    - Management, in holding employees and users accountable for their actions

    - The storage, processing, and disclosure of information, including personal and
    third-party information


    # **Integrity of Processing**


    Guarding against improper use, modification, or destruction of systems to support
    the following:


    +   - The accuracy, completeness, and reliability of information, goods, and services
    produced

    - The safeguarding of entity assets

    - Safeguarding of life and health


    Guarding against the unauthorized use or misuse of processing capabilities that
    could be used to impair the security or operations of external parties


    +   - An entity may consider risk appetite when establishing its cybersecurity
    objectives. An entity’s risk appetite refers to the amount of risk it is willing
    to accept to achieve its business objectives. Risk appetite often affects the
    entity’s risk management philosophy, influences the entity’s culture and operating
    style, and guides resource allocation. Therefore, it might be helpful for an entity
    to describe its cybersecurity objectives in relation to its risk appetite.


    (continued)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '**DC4**: The process for establishing, maintaining, and approving cybersecurity
    objectives to support the achievement of the entity''s objectives


    **Implementation Guidance**


    *When making judgments about the nature and extent of disclosures to include about
    this criterion, consider the following:*


    +   - *The process for establishing cybersecurity objectives based on the entity''s
    business and strategic objectives established by the board of directors* and management


    +   - *The process for obtaining board of director or executive management approval
    of the entity''s cybersecurity objectives*


    +   - *The use of security management and control frameworks in establishing the
    entity''s cybersecurity objectives and develop and maintaining controls within
    the entity''s cybersecurity risk management program, including disclosure of the
    particular framework(s) used (for example, NIST Cybersecurity Framework, ISO 27001/2
    and related frameworks, or internally- developed frameworks based on a combination
    of sources)*


    **FACTORS THAT HAVE A SIGNIFICANT EFFECT ON INHERENT CYBERSECURITY RISKS**


    **DC5**: Factors that have a significant effect on the entity''s inherent cybersecurity
    risks, including the (1) characteristics of technologies, connection types, use
    of service providers, and delivery channels used by the entity, (2) organizational
    and user characteristics, and (3) environmental, technological, organizational
    and other changes during the period covered by the description at the entity and
    in its environment.


    **Implementation Guidance**


    *When making judgments about the nature and extent of disclosures to include about
    the characteristics of technologies, connection types, use of service providers,
    and delivery channels used by the entity, consider the following:*


    +   - *Use of outsourcing such as cloud computing and IT-hosted services*


    +   - *Use of mobile devices, platforms, and deployment approaches*


    +   - *Network architecture and strategy, including the extent of the use of virtualization*


    +   - *Types of application and infrastructure (for example, DB, OS types and
    technologies) and the source (for example, internally developed or purchased without
    modification) of such applications and infrastructure*


    ¹ The term *board of directors* is used throughout this document to refer to those
    individuals with responsibility for overseeing the strategic direction of the
    entity and the obligations related to the accountability of the entity. Depending
    on the nature of the entity, such responsibilities may be held instead by a supervisory
    board for a corporation, a board of trustees for a not-for-profit entity, a board
    of governors or commissioners for a government entity, general partners for a
    partnership, or an owner for a small business.'
