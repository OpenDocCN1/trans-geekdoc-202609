  md: '# Defining Professional Responsibilities in AICPA Professional Standards


    AICPA professional standards applicable to attestation engagements use the following
    two categories of professional requirements, identified by specific terms, to
    describe the degree of responsibility they impose on a practitioner:


    +   - *Unconditional requirements.* The practitioner must comply with an unconditional
    requirement in all cases in which such requirement is relevant. The attestation
    standards use the word *must* to indicate an unconditional requirement.


    +   - *Presumptively mandatory requirements.* The practitioner must comply with
    a presumptively mandatory requirement in all cases in which such requirement is
    relevant; however, in rare circumstances, the practitioner may judge it necessary
    to depart from the requirement. The need for the practitioner to depart from a
    relevant presumptively mandatory requirement is expected to arise only when the
    requirement is for a specific procedure to be performed and, in the specific circumstances
    of the engagement, that procedure would be ineffective in achieving the intent
    of the requirement. In such circumstances, the practitioner should perform alternative
    procedures to achieve the intent of that requirement and should document the justification
    for the departure and how the alternative procedures performed in the circumstances
    were sufficient to achieve the intent of the requirement. The attestation standards
    use the word *should* to indicate a presumptively mandatory requirement.


    # References to Professional Standards


    In citing attestation standards and their related interpretations, references
    to standards that have been codified use section numbers within the codification
    of currently effective SSAEs rather than the original statement number.


    # Attestation Clarity Project


    In April 2016, the ASB issued SSAE No. 18 to address concerns about the clarity,
    length, and complexity of the attestation standards. To make the standards easier
    to read, understand, and apply, the ASB adopted the following clarity drafting
    conventions in redrafting the attestation standards:


    +   - Establishing objectives for each clarified section


    +   - Including a definitions section, when relevant, in each clarified section


    +   - Separating requirements from application and other explanatory material


    +   - Numbering application and other explanatory material paragraphs using an
    A- prefix and presenting them in a separate section that follows the requirements
    section


    +   - Using formatting techniques, such as bulleted lists, to enhance readability'
