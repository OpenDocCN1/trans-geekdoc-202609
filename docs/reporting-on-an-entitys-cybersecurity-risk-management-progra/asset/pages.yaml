    # Implementation Guidance


    When making judgments about the nature and extent of disclosures to include about
    the key security policies and processes, consider the following:


    +   - The existence of a formal security policy established to implement the entity''s
    cybersecurity strategy

    - Key topics addressed by the security policy


    When making judgments about the nature and extent of disclosures to include about
    the prevention of intentional and unintentional security events, consider the
    following:


    +   - Protection of data whether at-rest, during processing, or in-transit

    - Data loss prevention

    - User identification, authentication, authorization, and credentials management

    - Physical and logical access provisioning and de-provisioning, including remote
    access

    - Privileged account management

    - IT asset management, including hardware and software commissioning, configuration,
    maintenance, and decommissioning, as well as physical and logical servers and
    other devices

    - Operating location and data center physical security and environmental safeguards

    - Monitoring and managing changes to systems made internally or by external parties,
    including software acquisition, development, and maintenance and patch management


    When making judgments about the nature and extent of disclosures to include about
    the detection of security events; identification of security incidents; development
