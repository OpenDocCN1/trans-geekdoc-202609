  md: '# # Cybersecurity Risk Governance Structure


    # ### DC7: The process for establishing, maintaining, and communicating integrity
    and ethical values to support the functioning of the cybersecurity risk management
    program


    Management sets the organizational tone through policies, a code of ethics, a
    commitment to hiring competent employees, and the development of reward structures
    that promote an effective internal control and governance structure. The board
    of directors meets quarterly with members of executive management to review financial
    and operational performance, including the entity’s cybersecurity risk management
    program.


    Employees are required to sign the employee handbook upon hire, acknowledging
    their acceptance and adherence to the Company’s policies and code of conduct.
    Such policies and the code of conduct have been designed to promote integrity
    and ethical values throughout the workplace. The information security policy includes
    information about the following:


    +   - Information privacy, confidentiality, and acceptable use

    - Electronic communications

    - Data management

    - Disclosure


    # ### DC8: The process for board oversight of the entity’s cybersecurity risk
    management program


    The XYZ board of directors includes various outside directors with industry knowledge
    and experience including one board member who is a former IT director of an S&P
    100 company with 15 plus years of experience in IT and cybersecurity and serves
    as the board’s subject matter expert on cybersecurity matters. Additionally, the
    XYZ CISO joins the quarterly board meeting to present an overview of the Company’s
    cybersecurity risk management program, including activities of the entity’s risk
    governance committee. Feedback and action items are provided by the board, which
