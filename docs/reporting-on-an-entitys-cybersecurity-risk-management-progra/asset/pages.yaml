  md: 'or attest engagement over a long period of time, and to take appropriate action
    to eliminate those threats or reduce them to an acceptable level by applying safeguards.


    +   -   Require that the firm withdraw from the engagement if effective safeguards
    to reduce threats to independence to an acceptable level cannot be applied.


    +   -   Require written confirmation, at least annually, of compliance with the
    firm’s policies and procedures on independence from all firm personnel required
