  md: '# **Effectiveness of Controls Within the Entity''s Cybersecurity Risk Management
    Program**


    In addition to providing a description of the entity''s cybersecurity risk management
    program, the cybersecurity risk management examination report also provides information
    about whether the controls the entity has designed, implemented, and operated
    to mitigate cybersecurity risks were effective throughout the period of time covered
    by the engagement. For that reason, one of the subject matters of the cybersecurity
    risk management examination is the *effectiveness of controls within an entity''s
    cybersecurity risk management program* to achieve the entity''s cybersecurity
    objectives.


    Management''s assertion and the practitioner''s opinion on the effectiveness of
    controls encompass both the suitability of the design of controls and their operating
    effectiveness:


    +   - *Controls were suitably designed.* Suitably designed controls, if complied
    with satisfactorily, provide reasonable assurance of achieving the entity''s cybersecurity
    objectives based on the control criteria. Suitably designed controls operate as
    designed by persons who have the necessary authority and competence to perform
    the controls.


    +   - *Controls operated effectively.* Suitably designed controls operate effectively
    if they provide reasonable assurance of achieving the entity''s cybersecurity
    objectives based on the control criteria.


    # **Management''s Responsibilities During the Planning of a Cybersecurity Examination**


    Management needs to understand its responsibilities in the cybersecurity engagement.
    Management''s responsibilities include the following:


    +   - Identifying the types of information created, used, and stored by the entity
    and the systems used that are subject to cybersecurity risks


    +   - Identifying the entity''s cybersecurity objectives


    +   - Identifying and analyzing the risks that could prevent the entity from achieving
    its cybersecurity objectives based on the entity''s business objectives, including
    the cyber risks arising from interactions with third parties with access to one
    or more of the entity''s information systems


    +   - Designing, implementing, operating, monitoring, and documenting controls
    that are effective to achieve the entity''s cybersecurity objectives


    +   - Defining the scope of the engagement, including whether the examination
    will cover the entity''s cybersecurity risk management program or only a portion
    of that program, and the time frame of the examination


    +   - Selecting the description criteria against which the presentation of the
    description will be evaluated and the control criteria against which the effectiveness
    of controls within the cybersecurity risk'
