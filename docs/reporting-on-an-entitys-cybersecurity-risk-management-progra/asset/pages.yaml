    The key components of the XYZ information security policy are discussed in the
    following paragraphs.


    # Prevention of intentional and unintentional security events. The Company has
    the following processes in place to prevent intentional and unintentional security
    events:


    +   1.  *Physical and Logical Access Provisioning, De-provisioning, and Transfers
    (Including Remote Access).* XYZ employees are granted network access only after
    completing security-awareness training. Users are granted access to XYZ systems
    and data based on their job role. Access requests are approved by the user''s
    manager prior to access being granted. Upon termination, human resources sends
    a notification through the ticketing system, which is routed to the user administration
    team to remove user account access for the terminated user. Human resources provides
    a weekly list of terminations, which is then cross-referenced against the user
    account list to identify any user accounts that have not been properly terminated.
    User accounts that are inactive for 60 days are automatically disabled. For access
    modifications, the user''s manager is required to submit and approve an access
    request ticket via the ticketing system, which is routed to the user administration
    team for processing.


    +   2.  *Authentication.* Users are required to authenticate using a unique user
    ID and password before being granted access to the network. The network domain
    password policy is configured to include password minimum length, expiration intervals,
    complexity, history, and an invalid password account-lockout threshold. A new
    user''s account password is set to pre-expire so that the password must be reset
    the first time a user logs in to the network.


    +   3.  *Credentials Management.* Access is granted based on role-based security
    profiles that provide segregation of duties and limit transaction access. XYZ
    application and data owners review access rights on a semiannual basis. On an
    annual basis, the roles and the transactions assigned to the roles must be reviewed.


    +   4.  *Privileged User Management.* Access to privileged user or superuser accounts
    is authorized by management. Users with privileged user accounts are provided
