    # ## Establishing the Terms of the Engagement


    **2.74** Paragraph .07 of AT-C section 205 requires the practitioner to agree
    on, and document in a written communication, the terms of the engagement with
    the engaging party. Such a written communication reduces the risk that either
    the practitioner or management (who generally is the engaging party in the cybersecurity
    risk management examination) may misinterpret the needs or expectations of the
    other party. For example, it reduces the risk that management may intend to rely
    on the practitioner work to protect the entity against certain risks or to perform
    certain management functions. In addition, the practitioner''s preliminary understanding
    of the terms of the cybersecurity risk management examination enables the practitioner
    to identify whether there are any indications that either the scope of the engagement
    or the criteria to be used in the examination are unlikely to meet the information
    needs of report users.


    **2.75** According to paragraph .08 of AT-C section 205, the agreed-upon terms
