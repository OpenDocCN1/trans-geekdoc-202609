    # ## Informing the Practitioner About Subsequent Events and Subsequently Discovered
    Facts


    Events or transactions may occur after the specified period of time covered by
    the examination engagement, but prior to the date of the practitioner''s report,
    that could have a significant effect on the description of the entity''s cybersecurity
    risk management program or the conclusion about the effectiveness of controls
    within that program. In such circumstances, disclosure in the description or in
    management''s assertion may be necessary to prevent users of the cybersecurity
    risk management examination report from being misled.'
