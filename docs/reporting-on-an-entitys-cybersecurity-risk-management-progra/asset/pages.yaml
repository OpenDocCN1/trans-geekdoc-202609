    contains appli-cation guidance for practitioners.


    +   - **SOC 2®—SOC for Service Organizations: Trust Services Criteria.** The performance
    and reporting requirements for an examination of controls at a service organization
    relevant to security, availabil-ity, processing integrity, confidentiality, and
    privacy are found in AT-C section 205. AICPA Guide *Reporting on Controls at a
    Ser-vice Organization Relevant to Security, Availability, Processing In-tegrity,
    Confidentiality, or Privacy* (**SOC 2®**) contains application guidance for practitioners.


    +   - **SOC 3®—SOC for Service Organizations: Trust Services Criteria for General
    Use Report.** The performance and reporting require-ments for an examination of
    controls at a service organization rel-evant to security, availability, processing
    integrity, confidentiality, and privacy resulting in a general use report are
    found in AT-C section 205. AICPA Guide *Reporting on Controls at a Service Or-ganization
    Relevant to Security, Availability, Processing Integrity, Confidentiality, or
    Privacy* (**SOC 2®**) discusses reporting on such examinations.


    +   - **SOC for Cybersecurity.** The performance and reporting require-ments for
    an examination of an entity’s cybersecurity risk man-agement program and related
    controls are found in AT-C section 205. This guide, *Reporting on an Entity’s
    Cybersecurity Risk Man-agement Program and Controls*, contains application guidance
    for practitioners.


    In 2018, the AICPA plans to introduce a new examination service, SOC for ven-dor
    supply chains, and a related attestation guide to provide application guid-ance
    to practitioners engaged to examine and report on system-level controls in the
    supply chain. The purpose of such an examination is to enable entities to better
    understand and manage external risks, including cybersecurity risk, related to
    their vendors and distribution networks.


    # ## Guidance Considered in This Publication


    This guide considers relevant guidance issued through May 1, 2017. In par-ticular,
    this guide reflects SSAE No. 18.


    This guide does not include all attestation requirements that may be applica-ble
    to the types of engagements covered by this guide. This guide is intended to be
    used in conjunction with all applicable sources of relevant guidance. In determining
    the applicability of recently issued guidance, the effective date of the guidance
    should also be considered.


    # ## Applicability of Quality Control Standards


    QC section 10, *A Firm’s System of Quality Control* (AICPA, *Professional Stan-dards*),
    addresses a CPA firm’s responsibilities for its system of quality control'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'for its accounting and auditing practice. A system of quality control consists
    of policies that a firm establishes and maintains to provide it with reasonable
    assurance that the firm and its personnel comply with professional standards,
    as well as applicable legal and regulatory requirements. The policies also provide
    the firm with reasonable assurance that reports issued by the firm are appropriate
    in the circumstances.


    QC section 10 applies to all CPA firms with respect to engagements in their accounting
    and auditing practice. In paragraph .13 of QC section 10, an *accounting and auditing
    practice* is defined as "a practice that performs engagements covered by this
    section, which are audit, attestation, compilation, review, and any other services
    for which standards have been promulgated by the ASB or the AICPA Accounting and
    Review Services Committee under the "General Standards Rule" (*AICPA, Professional
    Standards, ET sec. 1.300.001*) or the "Compliance With Standards Rule" (*AICPA,
    Professional Standards, ET sec. 1.310.001*) of the AICPA Code of Professional
    Conduct. Although standards for other engagements may be promulgated by other
    AICPA technical committees, engagements performed in accordance with those standards
    are not encompassed in the definition of an accounting and auditing practice."


    In addition to the provisions of QC section 10, readers should be aware of other
    sections within *AICPA Professional Standards* that address quality control considerations,
    including the following provisions that address engagement-level quality control
    matters for various types of engagements that an accounting and auditing practice
    might perform:


    +   AT-C section 105


    +   AU-C section 220, *Quality Control for an Engagement Conducted in Accordance
    With Generally Accepted Auditing Standards* (AICPA, *Professional Standards*)


    +   AR-C section 60, *General Principles for Engagements Performed in Accordance
    With Statements on Standards for Accounting and Review Services* (AICPA, *Professional
    Standards*)


    Paragraphs .32–.33 of AT-C section 105 address the practitioner''s specific responsibilities
    regarding quality control procedures for an attestation engagement. When applicable,
    paragraph .42 of AT-C section 105 addresses the responsibilities of the engagement
    quality control reviewer.


    AU-C section 220 addresses the auditor''s specific responsibilities regarding
    quality control procedures for an audit of financial statements. When applicable,
    it also addresses the responsibilities of the engagement quality control reviewer.


    Paragraphs .19–.23 of AR-C section 60 address engagement-level quality control
    in an engagement performed in accordance with Statements on Standards for Accounting
    and Review Services.


    Because of the importance of engagement quality, we have added appendix I, "Overview
    of Statements on Quality Control Standards," to this guide. Appendix I summarizes
    key aspects of the quality control standards. This summary should be read in conjunction
    with QC section 10, AU-C section 220, AT-C section 105, AR-C section 60, and the
    quality control standards issued by the PCAOB, as applicable.'
