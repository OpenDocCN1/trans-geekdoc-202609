    and the practitioner’s report.


    **cyberspace.** The interdependent network of information system infrastructures
    including the Internet, telecommunications networks, computer systems, and embedded
    processors and controllers.


    **data subjects.** The individual about whom personal information is collected.


    **deficiency.** Used to identify misstatements in which controls were not suitably
    designed or did not operate effectively.


    **description misstatement.** Used when describing differences between (or omissions
    in) the presentation of the description of the cybersecurity risk management program
    and the description criteria.


    **design.** As used in the COSO definition of internal control, the internal control
    system design is intended to provide reasonable assurance of the achievement of
    an entity’s objectives, if those controls operated as designed.


    **design-only cybersecurity risk management examination.** An examination engagement
    to report on (a) whether management’s description of the entity’s cybersecurity
    risk management program is presented in accordance with the description criteria
    and (b) the suitability of the design of controls implemented within that program
    to achieve the entity’s cybersecurity objectives.


    **deviation.** Used to identify misstatements in which the operation of a control
    was not effective in a specific instance. A deviation may, individually or in
    combination with other deviations, result in a deficiency.


    **disclosure.** The release, transfer, provision of access to, or divulgence in
    any other manner of information outside the entity holding the information. Disclosure
    is often used interchangeably with the terms *sharing* and *onward transfer*.


    **disposal.** A phase of the data lifecycle that pertains to how an entity removes
    or destroys data or information.


    **environmental protections** and **safeguards.** Controls and other activities
    implemented by the entity to detect, prevent, and manage the risk of casualty
    damage to the physical parts of the information system (for example, protections
    from fire, flood, wind, earthquake, power surge, or power outage).


    **entity.** A legal entity or management operating model of any size established
    for a particular purpose. A legal entity may, for example, be a business enterprise,
    a not-for-profit organization, a government body, or an academic institution.
    The management operating model may follow product or service lines, divisions,
    or operating units, with geographic markets providing for further subdivisions
    or aggregations of performance.


    **entity-wide.** Activities that apply across the entity—most commonly in relation
    to entity-wide controls.


    **external parties** (or **external users**). Individuals, other than internal
    users, who are authorized by customers, entity management, or other authorized
    parties to interact with the entity’s information system.'
