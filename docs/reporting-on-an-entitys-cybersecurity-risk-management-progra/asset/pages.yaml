    # Restricting the Use of the Practitioner’s Report


    # Restricting Use When Required by Professional Standards


    4.49 In certain circumstances, a practitioner is required to include in his or
    her report an alert paragraph that restricts the use of the report to certain
    parties. Such an alert is designed to avoid misunderstandings related to the use
    of the report, particularly if the report is taken out of the context in which
    the report is intended to be used.


    4.50 In the following circumstances, paragraph .64 of AT-C section 205 states
    that the practitioner’s report should include an alert, in a separate paragraph,
    that restricts the use of the report:


    +   a. The practitioner determines that the criteria used to evaluate the subject
    matter are appropriate only for a limited number of parties who either participated
    in their establishment or can be presumed to have an adequate understanding of
    the criteria.


    +   b. The criteria used to evaluate the subject matter are available only to
    specified parties.


    4.51 If an alert paragraph is required, paragraph .65 of AT-C section 205 states
    that the alert should


    +   a. state that the practitioner’s report is intended solely for the information
    and use of the specified parties;


    +   b. identify the specified parties for whom use is intended; and


    +   c. state that the practitioner’s report is not intended to be and should not
    be used by anyone other than the specified parties.


    4.52 The practitioner may identify the specified parties in his or her report
    by naming them, referring to a list of those parties, or identifying the class
    of parties, for example, “prospective buyers of XYZ Company’s pharmaceutical division.”


    4.53 The following is an example of an alert paragraph that may be added to the
    practitioner’s report to restrict the use of the report to specified parties:


    This report is intended solely for the information and use of [identify the specified
    parties] and is not intended to be and should not be used by anyone other than
    the specified parties.


    # Restricting Use in Other Situations


    4.54 Although the practitioner is required to include an alert paragraph restricting
    the use of the practitioner’s report when the circumstances discussed beginning
    in paragraph 4.49 exist, paragraph .A94 of AT-C section 205 clarifies that the
