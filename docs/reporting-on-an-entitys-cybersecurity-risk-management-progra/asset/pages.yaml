    **system.** Refers to the infrastructure, software, people, processes, and data
    that are designed, implemented, and operated to work together to achieve one or
    more specific business objectives (for example, delivery of services or production
    of goods) in accordance with management-specified requirements. As used in this
    document, systems include manual, automated, and partially automated systems that
    are used for information processing, manufacturing and production, inventory management
    and distribution, information storage, and support functions within an organization.


    **system boundaries.** The specific aspects of an entity’s infrastructure, software,
    people, procedures, and data necessary to perform a function or provide a service.
    When the systems for multiple functions or services share aspects, infrastructure,
    software, people, procedures, and data, the systems will overlap, but the boundaries
    of each service’s system will differ. In an engagement that addresses the confidentiality
    and privacy criteria, the system boundaries cover, at a minimum, all the system
    components as they relate to the life cycle of the confidential and personal information
    within well-defined processes and informal ad hoc procedures.


    **system components.** Refers to the individual elements of a system. System components
    can be classified into the following five categories: infrastructure, software,
    people, processes, and data.


    **system requirements.** Specifications regarding how the system should function
    to meet the entity’s commitments to customers and relevant laws, regulations,
