  md: '• Procedures performed toward the end of the engagement that indicate a previously
    unrecognized risk of material misstatement. As an example, assume that, while
    testing management’s procedures to mitigate security incidents, a practitioner
    becomes aware of a deficiency in the design of a control that prevents unauthorized
    access. The practitioner may determine that additional testing is needed to evaluate
    whether there are other suitably designed controls that operated effectively to
    mitigate the risk of unauthorized access addressed by the deficient control.


    In such circumstances, the practitioner may need to reevaluate the planned procedures.


    4.07 The practitioner also evaluates the effect of such uncorrected description
    misstatements or deficiencies on the engagement and on the opinion. The practitioner
    may conclude that additional appropriate evidence is required in order to form
    a conclusion about the description or control effectiveness. In such a case, the
    practitioner should design and perform additional procedures to obtain sufficient
    appropriate evidence.


    4.08 If the practitioner concludes, based on the evidence obtained, that the description
    was not presented in accordance with the description criteria or that the controls
    were not effective to achieve the cybersecurity objectives based on the control
    criteria, he or she should modify the opinion to express a qualified or adverse
    opinion. Reporting in a cybersecurity risk management examination when the practitioner
    decides to modify the opinion is discussed beginning in paragraph 4.16.


    # Expressing an Opinion on the Subject Matters in the Cybersecurity Risk Management
    Examination


    4.09 As discussed in paragraph 4.01, the practitioner expresses an opinion on
    two distinct but complementary subject matters in the cybersecurity risk management
    examination: (1) description of the entity’s cybersecurity risk management program
    and (2) the effectiveness of controls within the program to achieve the entity’s
    cybersecurity objectives. Depending on the circumstances, the practitioner’s opinion
    may be different for each subject matter.


    4.10 When the practitioner concludes that an opinion modification on one of the
    subject matters is appropriate, the practitioner should also consider the effect
    on the opinion on the other subject matter. Consider the following examples:


    +   - A practitioner expresses a qualified opinion on the effectiveness of the
    controls because certain controls did not operate consistently throughout the
    period under examination. The practitioner may conclude that the qualified opinion
    has no effect on his or her unmodified opinion on whether the description of the
    entity’s cybersecurity risk management program is presented in accordance with
    the description criteria. Accordingly, the practitioner would issue an unmodified
    opinion on the description.

    - A practitioner expresses a qualified opinion on the description because management
    failed to disclose a significant subsequent event. The practitioner may conclude
    that, because the subsequent event did not affect the effectiveness of controls
    during the'
