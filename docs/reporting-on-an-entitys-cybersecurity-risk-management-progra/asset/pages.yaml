  md: '2.130 When planning to use internal auditors to provide direct assistance,
    paragraph .41 of AT-C section 205 requires the practitioner to obtain written
    acknowledgment from management that internal auditors providing direct assistance
    will be allowed to follow the practitioner''s instructions without management''s
    interference.


    # ## Evaluating Whether the Work of Internal Auditors is Adequate for the Practitioners''
    Purposes


    2.131 When using the work of the internal audit function, the practitioner should
    perform sufficient procedures, including reperformance, on the body of work of
    the internal audit function that the practitioner plans to use to evaluate whether
    such work is adequate for the practitioner''s purposes. Chapter 3 provides guidance
    on the practitioner''s considerations when performing procedures on that work.


    # ## Planning to Use the Work of an Other Practitioner


    2.132 In certain situations, the practitioner might plan to use the work of an
    other practitioner. For example, if the entity operates divisions or business
    units in other geographic locations, the practitioner might plan to use the work
    of a practitioner located in the same geographic region as the entity to obtain
    sufficient appropriate evidence to enable the practitioner to express an opinion
    on the description and on the effectiveness of controls in the cybersecurity risk
    management engagement.


    2.133 For those reasons, the practitioner who decides to use the work of an other
    practitioner is required by paragraph .31 of AT-C section 105 to


    +   * obtain an understanding of whether the other practitioner understands, and
    will comply with, the ethical requirements that are relevant to the engagement
    and, in particular, is independent. (The discussion beginning in paragraph 2.66
    of this guide also applies to the other practitioner.)

    * obtain an understanding of the other practitioner''s professional competence.
    (See paragraph 2.135)

    * communicate clearly with the other practitioner about the scope and timing of
    the other practitioner''s work and findings. (See paragraph 2.136)

    * be involved in the work of the other practitioner, if assuming responsibility
    for the work of the other practitioner.

    * evaluate whether the other practitioner''s work is adequate for the practitioner''s
    purposes. (See paragraph 2.137)

    * determine whether to make reference to the other practitioner in the practitioner''s
    report. (See paragraph 2.138)


    2.134 When using the work of an other practitioner, paragraph .A57 of AT-C section
    205 clarifies that the practitioner is responsible for directing, supervising,
    and performing the engagement in compliance with professional standards, applicable
    regulatory and legal requirements, and the firm''s policies and procedures. The
    practitioner is also responsible for determining whether the report issued is
    appropriate in the circumstances.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '**2.135** When evaluating the professional competence of the other practitioner,
    the practitioner may make inquiries of the professional reputation of the other
    practitioner, consider whether the other practitioner is subject to regulatory
    oversight, and read any publicly available regulatory reports.


    **2.136** Once the practitioner has decided to use the work of an other practitioner,
    he or she should communicate with the other practitioner about the scope and timing
    of the other practitioner''s work. Through this communication, the practitioner
    can better plan the nature, timing, and extent of any procedures that relate to
    the work of the other practitioner, including the practitioner''s involvement
    in directing, supervising, and reviewing the work of the other practitioner. Due
    to complexities involved in planning a cybersecurity risk management engagement,
    using the work of other practitioners is most likely to be successful when these
    matters are addressed early in engagement planning.


    **2.137** When using the work of an other practitioner, the practitioner is also
    required to evaluate whether the other practitioner''s work is adequate for the
    purposes of the engagement. The nature, timing, and extent of this involvement
    are affected by the practitioner''s understanding of the other practitioner, such
    as previous experience with, or knowledge of, the other practitioner and the degree
    to which the engagement team and the other practitioner are subject to common
    quality control policies and procedures.


    **2.138** The practitioner also determines whether to take responsibility for
    the work of the other practitioner or to make reference to the other practitioner
    in the practitioner''s report. Chapter 4 provides a more detailed discussion about
    reporting when the work of an other practitioner is used.


    # ## Planning to Use the Work of a Practitioner''s Specialist


    **2.139** When planning a cybersecurity risk management examination, a practitioner
    may decide that engaging or assigning a specialist with specific skills and knowledge
    is necessary to execute the planned examination. If a practitioner''s specialist
    will be used in the cybersecurity risk management examination, paragraph .36 of
    AT-C section 205 requires the practitioner to


    +   a. evaluate the specialist''s competence, capabilities, and objectivity;


    +   b. obtain an understanding of the specialist''s field of expertise to enable
    the practitioner to determine the nature, scope, and objectives of the specialist''s
    work and to evaluate the adequacy of that work; and


    +   c. agree with the specialist regarding the


    +   i. nature, scope, and objectives of the specialist''s work;


    +   ii. the respective roles and responsibilities of the practitioner and the
    specialist;


    +   iii. the nature, timing, and extent of communication between the practitioner
    and the specialist, including the form of any report or documentation to be provided
    by the specialist; and


    +   iv. the need for the practitioner''s specialist to observe confidentiality
    requirements.'
