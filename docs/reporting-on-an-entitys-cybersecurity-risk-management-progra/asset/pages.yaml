    **SOC 2 examination.** An examination engagement to report on the fairness of
    the presentation of management’s description of the service organization’s system,
    the suitability of the design of the controls included in the description, and,
    when a type 2 report is being issued, the operating effectiveness of those controls.
    The SOC 2 examination is performed in accordance with the attestation standards
    and AICPA Guide *Reporting on Controls at a Service Organization Relevant to Security,
    Availability, Processing Integrity, Confidentiality, or Privacy* (SOC 2®).


    **stakeholder.** Parties that are affected by the entity, such as shareholders,
    investors, the communities in which the entity operates, employees, customers,
    and suppliers.


    **subsequent events.** Events or transactions that occur after the specified period
    of time covered by the engagement, but prior to the period end date of management’s
    description, that could have a significant effect on the description of the entity’s
