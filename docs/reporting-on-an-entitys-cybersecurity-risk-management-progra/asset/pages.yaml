    # ## Engagements Under the AICPA Consulting Standards


    **1.50** In addition to examination engagements, practitioners may be engaged
    to perform procedures on an entity’s *cybersecurity risk management program* in
    accordance with CS section 100, *Consulting Services: Definitions and Standards*
    (AICPA, *Professional Standards*). A nonassurance consulting engagement may provide
