  md: '# Appendix B


    # Illustrative Comparison of the Cybersecurity Risk Management Examination with
    a SOC 2 Examination and Related Reports


    *This appendix is nonauthoritative and is included for informational purposes
    only.*


    The following table compares the cybersecurity risk management examination with
    a SOC 2 engagement and related reports. Within the Cybersecurity Risk Management
    Examination and the SOC 2 Engagement columns, certain text is set in bold to highlight
    key distinctions between the two types of engagement:


    | | **Cybersecurity Risk Management Examination**¹ | **SOC 2 Engagement**²,³ |

    |---|---|---|

    | **What is the purpose of the report?** | To provide **intended users** with
    useful information about an entity’s cybersecurity risk management program for
    making informed decisions | To provide a broad range of **system users** with
    information about controls at the service organization relevant to security, availability,
    processing integrity, confidentiality, or privacy to support users’ evaluations
    of their own systems of internal control |


    (continued)


    ¹ In a SOC 2 engagement, when the entity uses the services of a subservice organization,
    management may elect to use the *inclusive method* or the *carve-out method* to
    address those services in its description of its system. Those concepts are defined
    and discussed in the AICPA Guide *Reporting on Controls at a Service Organization
    Relevant to Security, Availability, Processing Integrity, Confidentiality, and
    Privacy (SOC 2®)* (the SOC 2 guide).

    In the cybersecurity risk management examination, however, management is responsible
    for all of the controls within the entity’s cybersecurity risk management program,
    regardless of whether those controls are performed by the entity or by a service
    organization. Therefore, the description criteria in appendix C, “Description
    Criteria for Use in the Cybersecurity Risk Management Examination,” require the
    description to address all of the controls within the entity’s cybersecurity risk
    management program.


    ² Some of an entity’s business partners may need a detailed understanding of controls
    implemented by the entity and the operating effectiveness of those controls to
    enable them to design and operate their own control activities. For example, business
    partners whose IT systems are interconnected with systems at the entity may need
    to understand the specific logical access protection over the interconnected systems
    implemented by the entity.

    This guide is not intended to meet the needs of business partners who need a detailed
    understanding of the entity’s specific controls and their operating effectiveness.
    The SOC 2 guide provides guidance for practitioners engaged to examine and report
    on system controls at a service organization. In addition, the AICPA intends to
    develop a vendor supply chain guide to provide guidance for practitioners engaged
    to examine and report on system controls at a manufacturer or distributor. The
    vendor supply chain guide is expected to be issued in 2018.


    ³ For illustrative purposes, this table focuses specifically on a type 2 SOC 2
    report, which includes both an opinion on suitability of design and operating
    effectiveness of controls.'
  merge: -1
  img_proc: true
