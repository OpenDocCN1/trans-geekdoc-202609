  md: 'by management achieve the cybersecurity objectives based on the current operating
    environment, the known risks and threats as of a given point in time, and the
    exploitation of evolving vulnerabilities.


    # **3.47** When considering the suitability of design, the practitioner should
    also consider *(a)* management''s process for assessing risks and for designing
    and implementing controls to address those risks, *(b)* the results of walk-throughs,
    and *(c)* evidence about the operating effectiveness of controls that indicated
    a deficiency in the design of the controls, in light of the practitioner''s knowledge
    and experience and the particular circumstances. Controls are intended to mitigate
    the risks that the entity''s cybersecurity objectives will not be achieved. For
    example, the risk that a server will not be able to support availability in the
    event of a distributed denial of service attack can be addressed by a control
    that provides redundant load balanced infrastructure protected by mechanisms for
    detecting and dropping access attempts.


    # **3.48** Identified risks that may impact the achievement of the entity''s cybersecurity
    objectives also encompass fraud such as management''s override of identified controls
    at the entity, misappropriation of assets by entity personnel, creation by entity
    personnel of false or misleading documents or records, and inappropriate physical
    and logical access controls to information and the underlying infrastructure through
    social engineering attacks or similar measures. The practitioner should consider
    both the risk of fraud and errors in evaluating the suitability of the design
    of controls.


    # **3.49** The practitioner''s evaluation of management''s risk assessment process
    (that is, the assessment of potential events and circumstances that could threaten
    the achievement of the entity''s cybersecurity objectives) includes consideration
    of items such as the following:


    +   * The process management uses to


    * identify its cybersecurity objectives,

    * identify information and other assets,

    * determine the threats to information and other assets,

    * design and implement controls to address identified risks, and

    * incorporate information from its monitoring activities that identify previously
    unconsidered potential events and circumstances

    * The frequency with which management updates the risk assessment and supporting
    risk management processes and controls

    * Whether management uses an appropriate management framework for managing its
    processes and controls (for example, the National Institute of Standards and Technology
    "Framework for Improving Critical Infrastructure Cybersecurity" [NIST cybersecurity
    framework] or International Standardization Organization/International Electrotechnical
    Commission [ISO/IEC] Standards 27001 and 27002) as part of its assessment and
    management process


    # **3.50** Factors such as the size and complexity of the entity, the goods or
    services provided, and commitments made to customers and others are important
    considerations when evaluating the suitability of the design of controls.'
