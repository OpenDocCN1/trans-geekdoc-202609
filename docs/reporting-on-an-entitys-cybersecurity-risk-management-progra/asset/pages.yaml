    section 205, *Examination Engagements (AICPA, Professional Standards).*


    1.31 There are two subject matters in the cybersecurity risk management examination:


    +   1.  A description of the entity''s cybersecurity risk management program and


    +   2.  The effectiveness of the controls within that program to achieve the entity''s
    cybersecurity objectives


    1.32 As previously mentioned, management is usually the responsible party (that
    is, the party responsible for the subject matter) in a cybersecurity risk management
    examination because management is ultimately responsible for the entity''s cybersecurity
    risk management program; therefore, it is management''s responsibility to develop
    and present the description of the entity''s cybersecurity risk management program.
