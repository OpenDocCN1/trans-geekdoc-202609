    2.68 When assessing independence in a cybersecurity risk management examination,
    the practitioner might consider matters including, but not limited to, (a) advisory
    work performed for the client that may directly or indirectly affect the entity’s
    cybersecurity risk management program, (b) fee arrangements for all services provided
    to the client, (c) firm and individual financial relationships, (d) firm business
    relationships, and (e) alumni and familial relationships with the client and client
    personnel. Because of the breadth of a cybersecurity risk management program and
    its relationship to all aspects of information technology, the practitioner needs
    to be particularly attentive to other services provided to the entity that may
    impair independence.


    2.69 It is anticipated that, in most cybersecurity risk management examinations,
    management will be both the engaging party (client) and the responsible party;
    thus, management will accept responsibility for the description of the entity’s
    cybersecurity risk management program and its assertion about the effectiveness
    of the controls within that program. In some engagements, however, the engaging
    party may be someone other than management. For example, in a proposed acquisition,
    the engaging party might be the party interested in acquiring the entity. As part
    of its due diligence on the target company, the engaging party might want information
    about the entity’s cybersecurity risk management program to evaluate the additional
    risks the engaging party might be taking on in the event of a security breach
    at the entity. In such a situation, the practitioner is not required to be independent
    of the engaging party; however, the Code of Professional Conduct requires the
    practitioner to consider the applicable interpretation regarding conflicts of
    interest prior to accepting the engagement.


    # ## Considering the Competence of Engagement Team Members


    2.70 Chapter 1 of this guide discusses quality in the cybersecurity risk management
    examination. Maintaining appropriate quality in the engagement involves having
    the work performed by engagement team members with the appropriate competence
    and capabilities. For that reason, as discussed in paragraph 2.12, the practitioner
    should not accept the cybersecurity risk management examination unless he or she
    has determined that the individuals performing the particular engagement have
    the appropriate competence and capabilities to perform it.


    2.71 When considering the competence and capabilities of engagement team members,
    the engagement partner should consider whether the team assigned to the engagement
    collectively has, or can acquire, the following:


    +   - An understanding, or the ability to obtain an understanding, of information
    security or cybersecurity risk management examinations gained through experience
    with engagements of a similar nature and complexity or through appropriate training
    and participation'
