- pgno: 64
  md: '# Accepting and Planning a Cybersecurity Risk Management Examination


    **2.125** To prevent undue use of the internal audit function in obtaining evidence,
    the practitioner should use less of the work of the internal audit function and
    perform more of the work directly in situations when


    +   - more judgment is involved to plan and perform the procedures or to evaluate
    the evidence obtained.

    - the assessed risk of material misstatement is high.

    - the internal audit function’s organizational status and relevant policies and
    procedures raise concerns about the objectivity of the internal auditors.

    - the level of competence of the internal audit function is low.


    # Coordinating Procedures With the Internal Auditors


    **2.126** When the practitioner plans to use the work of the internal audit function,
    the practitioner may find it helpful to review the internal audit function’s audit
    plan and discuss with management the planned use of the work of the internal audit
    function as a basis for coordinating the work of internal auditors with the practitioner’s
    procedures. The audit plan provides information about the nature, timing, extent,
    and scope of the work performed by the internal audit function, as well as the
    work that is planned to be performed.


    **2.127** As a basis for coordinating the respective activities between the practitioner
    and the internal auditors, it may be useful to address the following when planning
    to use the work of the internal audit function:


    +   - The nature of the work performed

    - The timing of such work

    - The extent of coverage

    - Proposed methods of item selection and sample sizes

    - Documentation of the work performed

    - Review and reporting procedures


    **2.128** Coordination between the practitioner and the internal audit function
    is effective when discussions take place at appropriate intervals throughout the
    period to which management’s assertion pertains. It is important that the practitioner
    informs the internal audit function of significant matters as they arise during
    the engagement. Equally important is that the practitioner has access to relevant
    reports of the internal audit function and is advised of any significant matters
    that come to the attention of the internal auditors, when such matters may affect
    the scope of the examination and the potential nature, timing, or extent of the
    examination procedures. Communication throughout the engagement provides opportunities
    for internal auditors to bring up matters that may affect the practitioner’s work.
    The practitioner is then able to take such information into account (for example,
    when assessing the risks that the description is not presented in accordance with
    the description criteria or that controls were not effective in achieving the
    entity’s cybersecurity objectives based on the control criteria).


    **2.129** Although the practitioner is not precluded from using work that the
    internal audit function has already performed, coordination of activities between
    the practitioner and the internal audit function is likely to be most effective
    when appropriate interaction occurs before the internal audit function performs
    the work.'
  merge: -1
  img_proc: true
