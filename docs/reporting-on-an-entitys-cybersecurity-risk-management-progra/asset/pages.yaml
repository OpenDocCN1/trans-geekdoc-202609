    # Preparing the Practitioner’s Report


    # Elements of the Practitioner’s Report


    **4.12** When a practitioner issues an unmodified opinion in the cybersecurity
    risk management examination, the practitioner’s report should include the following
    elements:


    +   a. A title that includes the word *independent*


    +   b. An appropriate addressee as *required* by the circumstances of the engagement
    (The report would ordinarily be addressed to management of the entity or to those
    charged with governance, such as board members.)


    +   c. Identification of the following:


    +   i. A description of the entity’s cybersecurity risk management program and
    the effectiveness of controls within that program,<sup>2</sup> as well as the
    specified period of time<sup>3</sup> to which they relate


    +   ii. The criteria used to evaluate the description of the entity’s cybersecurity
    risk management program (description criteria) and the criteria used to evaluate
    whether controls within that program were effective to achieve the entity’s cybersecurity
    objectives (control criteria)


    <sup>2</sup> If the subject matter of the engagement is less than entity-wide,
    the practitioner should modify the language used to identify the subject matter
    of the engagement.


    <sup>3</sup> As discussed in chapter 1, “Introduction and Background,” management
    is responsible for determining whether the engagement will be performed for a
    specified period of time or as of a point in time to be used in the cybersecurity
    risk management examination report. However, because most users are likely to
    find a conclusion about control effectiveness more valuable if it is over a period
    of time, this guide uses a period of time. If management elects to report as of
    a point in time, the practitioner would modify the language in the report to refer
    to the point in time.'
