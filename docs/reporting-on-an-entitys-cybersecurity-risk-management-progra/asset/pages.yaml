  md: "# Chapter 3\n# Performing the Cybersecurity Risk Management Examination\n\n\
    > This chapter discusses responding to the assessed risks, materiality considerations,\
    \ and other matters affecting the nature, timing, and extent of the practitioner’s\
    \ procedures to obtain sufficient appropriate evidence about whether *a) management’s\
    \ description of the entity’s cybersecurity risk management program is presented\
    \ in accordance with the description criteria and b) the controls within that\
    \ program were effective for the specified period of time to achieve the entity’s\
    \ cybersecurity objectives.*\n\n# ## Responding to Assessed Risks and Obtaining\
    \ Evidence\n\n**3.01**  Paragraphs 20–21 of AT-C section 205, *Examination Engagements*\
    \ (*AICPA, Professional Standards*), require the practitioner to respond to the\
    \ assessed risks when designing and performing examination procedures. Specifically,\
    \ they require the practitioner to\n\n+      a. design and implement overall responses\
    \ to address the assessed risks of material misstatement and\n   b. design and\
    \ perform further procedures whose nature, timing, and extent are based on, and\
    \ responsive to, the assessed risks of material misstatement.\n\n**3.02**  Paragraph\
    \ 10 of AT-C section 105, *Concepts Common to All Attestation Engagements* (*AICPA,\
    \ Professional Standards*), defines a *misstatement* as follows:\n\n> A difference\
    \ between the measurement or evaluation of the subject matter by the responsible\
    \ party and the proper measurement or evaluation of the subject matter based on\
    \ the criteria. Misstatements can be intentional or unintentional, qualitative\
    \ or quantitative, and include omissions. In certain engagements, a misstatement\
    \ may be referred to as a deviation, exception, or instance of noncompliance.\n\
    \n**3.03**  In this guide, the following terms are used when discussing misstatements\
    \ related to different aspects of the entity’s cybersecurity risk management program\
    \ and the effectiveness of controls within that program:\n\n+   -   The term *description\
    \ misstatement* is used when describing differences between (or omissions in)\
    \ the presentation of the description of the cybersecurity risk management program\
    \ and the description criteria.\n-   The term *deficiency* is used to identify\
    \ misstatements in which controls were not suitably designed or did not operate\
    \ effectively.\n-   The term *deviation* is used to identify misstatements in\
    \ which the operation of a control was not effective in a specific instance. A\
    \ deviation may, individually or in combination with other deviations, result\
    \ in a deficiency."
  merge: -1
