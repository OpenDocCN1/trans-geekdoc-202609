  md: "# # Obtaining Written Representations From Management\n\n**3.131** During the\
    \ cybersecurity risk management examination, management makes many oral and written\
    \ representations to the practitioner in response to specific inquiries or through\
    \ the presentation of the description of the entity's cybersecurity risk management\
    \ program and management's assertion. Such representations from management are\
    \ part of the evidence the practitioner obtains. However, they cannot replace\
    \ other evidence the practitioner could reasonably expect to be available, nor\
    \ do they provide sufficient appropriate evidence on their own about any of the\
    \ matters with which they deal. Furthermore, the fact that the practitioner has\
    \ received reliable written representations does not affect the nature or extent\
    \ of other evidence that the practitioner obtains.\n\n**3.132** Written representations\
    \ from management ordinarily confirm representations explicitly or implicitly\
    \ given to the practitioner; indicate and document the continuing appropriateness\
    \ of such representations, and reduce the possibility of a misunderstanding concerning\
    \ the matters that are the subject of the representations.\n\n**3.133** Paragraph\
    \ .50 of AT-C section 205 indicates that, in an examination engagement, a practitioner\
    \ should request written representations in the form of a letter from the responsible\
    \ party. The representations in the cybersecurity risk management examination\
    \ should\n\n+   * *a.*\n\n\tinclude management's assertion about the subject matters<sup>6</sup>\
    \ based on the criteria.<sup>7</sup>\n\n* *b.*\n\n\tstate that\n\n\t* i. all relevant\
    \ matters are reflected in the measurement or evaluation of the subject matters\
    \ or assertion,\n\n\t* ii. all known matters contradicting the subject matters\
    \ or assertion and any communication from regulatory agencies or others affecting\
    \ the subject matters or assertion have been disclosed to the practitioner, including\
    \ communications received between the end of the period addressed in the written\
    \ assertion and the date of the practitioner's report.\n\n* *c.*\n\n\tacknowledge\
    \ responsibility for\n\n\t* i. the subject matters and the assertion,\n\n\t* ii.\
    \ selecting the criteria, and\n\n\t* iii. determining that such criteria are appropriate\
    \ for management's purposes.\n\n* *d.*\n\n\tstate that any known events subsequent\
    \ to the period (or point in time) of the subject matters being reported on that\
    \ would have a material effect on the subject matters or assertion have been disclosed\
    \ to the practitioner.\n\n+   <sup>6</sup> Within this section of the guide, the\
    \ term *subject matters* refers to the two subject matters in the cybersecurity\
    \ risk management examination: (1) the description of the entity's cybersecurity\
    \ risk management program and (2) the effectiveness of controls within that program\
    \ to achieve the entity's cybersecurity objectives based on the control criteria.\n\
    \n+   <sup>7</sup> Within this section of the guide, the term *criteria* refers\
    \ to both the description criteria and the control criteria."
