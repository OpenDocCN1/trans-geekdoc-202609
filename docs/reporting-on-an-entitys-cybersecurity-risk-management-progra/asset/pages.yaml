  md: '# Changes to the Attestation Standards Introduced by SSAE No. 18


    # Restructuring of the Attestation Standards


    The attestation standards provide for three types of services—examination, re-view,
    and agreed-upon procedures engagements. SSAE No. 18 restructures the attestation
    standards so that the applicability of any AT-C section to a particular engagement
    depends on the type of service provided and the subject matter of the engagement.


    AT-C section 105 contains requirements and application guidance applicable to
    any attestation engagement. AT-C section 205, AT-C section 210, *Review Engagements*,
    and AT-C section 215, *Agreed-Upon Procedures Engagements*, each contain incremental
    requirements and application guidance specific to the level of service performed.
    The applicable requirements and application guidance for an engagement to report
    on any of these subject matters are contained in three AT-C sections: AT-C section
    105; AT-C section 205, 210, or 215, depending on the level of service provided;
    and the applicable subject matter section.


    To avoid repetition, the requirements and application guidance in AT-C section
    105 are not repeated in the level of service sections or in the subject matter
    sections, and the requirements and application guidance in the level of service
    sections are not repeated in the subject matter sections, with the exception of
    a repetition of the basic report elements for the particular subject matter.


    # Practitioner Is Required to Request a Written Assertion


    In all attestation engagements, the practitioner is required to request from the
    responsible party a written assertion about the measurement or evaluation of the
    subject matter against the criteria. In examination and review engagements when
    the engaging party is also the responsible party, the responsible party''s refusal
    to provide a written assertion requires the practitioner to withdraw from the
    engagement when withdrawal is possible under applicable laws and regulations.
    In examination and review engagements when the engaging party is not the responsible
    party, the responsible party''s refusal to provide a written assertion requires
    the practitioner to disclose that refusal in the practitioner''s report and restrict
    the use of the report to the engaging party.3 In an agreed-upon procedures engagement,
    the responsible party''s refusal to provide a written assertion requires the practitioner
    to disclose that refusal in the practitioner''s report.


    # Risk Assessment in Examination Engagements


    SSAE No. 18 incorporates a risk assessment model in examination engage-ments.
    In examination engagements, the practitioner is required to obtain an understanding
    of the subject matter that is sufficient to enable the practitioner to identify
    and assess the risks of material misstatement in the subject matter and provide
    a basis for designing and performing procedures to respond to the assessed risks.


    3  This exception is not available in the cybersecurity risk management examination
    discussed in this guide. See footnote 7 in chapter 2, "Accepting and Planning
    a Cybersecurity Risk Management Examination," of this guide.'
