  md: '# Assessing the Suitability of the Entity''s Cybersecurity Objectives


    **2.55** As discussed in chapter 1, the achievement of the entity''s overall business
    objectives depends upon the identification, assessment, and management of the
    risks that threaten their achievement. One type of risk is the entity''s cyber-security
    risks. Consequently, entities often establish sub-objectives, known as *cybersecurity
    objectives*, that address their specific cybersecurity risks. Sim-ilar to the
    entity''s overall business objectives, the cybersecurity objectives es-tablished
    by management need to be suitable to enable both management and the practitioner
    to evaluate whether controls within the entity''s cybersecurity risk management
    program are effective to achieve those objectives.


    **2.56** Management is responsible for establishing, and including in the de-scription,
    suitable cybersecurity objectives to enable report users to understand the context
    in which the entity''s cybersecurity risk management program oper-ates. Because
    control activities are designed and operated to address the risks that would prevent
    an entity''s cybersecurity objectives from being achieved, the practitioner is
    responsible for evaluating whether the cybersecurity objectives established by
    management are suitable to permit the practitioner to form a conclusion on the
    effectiveness of controls based on the control criteria. In mak-ing that evaluation,
    the practitioner should consider the attributes of suitable objectives described
    in the COSO framework. According to the COSO frame-work, suitable objectives are


    +   * *specific*. The objectives provide a clear understanding of the cyber-security
    risks that need to be mitigated.

    * *measurable or observable*. The objectives permit an objective de-termination
    about whether each cybersecurity objective has been met.

    * *attainable*. The objectives permit the implementation of controls that, if
    suitably designed and operated effectively, provide reason-able assurance of achieving
    each objective.

    * *relevant*. The achievement of each cybersecurity objective sup-ports the entity''s
    efforts to achieve its overall objectives.

    * *time-bound*. The objectives reflect the desired operation of cyber-security
    controls over time.


    **2.57** As discussed earlier, cybersecurity objectives are established to ad-dress
    the cybersecurity risks that could otherwise threaten the achievement of the entity''s
    overall objectives. Consequently, in establishing the entity''s cy-bersecurity
    objectives, management also considers whether the cybersecurity objectives completely
    address those risks. Because the achievement of the en-tity''s overall objectives
    depends on the achievement of the cybersecurity objec-tives, the cybersecurity
    objectives also need to meet one additional attribute: completeness. To be complete,
    the set of cybersecurity objectives established by management needs to address
    the significant cybersecurity risks that threaten the achievement of the entity''s
    overall business objectives.


    **2.58** Management is likely to establish cybersecurity objectives that ad-dress
    several basic matters, regardless of the nature of the business and the industry
    in which the entity operates. Basic matters that management may consider when
    establishing the entity''s cybersecurity objectives include the fol-lowing:'
