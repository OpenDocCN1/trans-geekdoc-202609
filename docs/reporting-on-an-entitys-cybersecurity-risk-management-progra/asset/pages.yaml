  md: '# Considering Whether the Description is Misstated or Otherwise Misleading


    3.22 Paragraph .60 of AT-C section 205 requires the practitioner to evaluate,
    based on the evidence obtained, whether the description of the entity''s cybersecurity
    risk management program is misleading within the context of the engagement.


    3.23 When making this evaluation, paragraph .A73 of AT-C section 205 states that
    the practitioner may consider whether additional disclosures are necessary to
    supplement the description of the entity''s cybersecurity risk management program.
    Additional disclosures may include, for example,


    +   * significant interpretations made in applying the criteria in the engagement
    circumstances (for example, what constitutes a security event or a security incident);

    * subsequent events,$^{1}$ depending on their nature and significance; and

    * when reporting on only a portion of the entity-wide cybersecurity risk management
    program, a significant security incident that occurred in another portion of that
    program not covered by the examination.


    Such additional disclosures may be presented in the description (in which case
    it would be subject to the practitioner''s examination procedures) or as other
    information.


    3.24 Although the description should be presented in accordance with the description
    criteria, paragraph .60 of AT-C section 205 does not require the practitioner
    to determine whether the description discloses every matter related to the entity''s
    cybersecurity risk management program that every user might consider useful when
    making decisions. For example, a description presented in accordance with the
    description criteria may omit certain information related to the entity''s cybersecurity
    risk management program when it is unlikely to be significant (in other words,
    it is immaterial) to report users'' decisions.


    3.25 As part of the practitioner''s evaluation of whether the description is misleading
    within the context of the engagement, the practitioner may consider whether the
    description


    +   * omits information involving one or more significant business units or segments,
    when the examination addresses the entity-wide cybersecurity risk management program.

    * contains statements that cannot be objectively evaluated. For example, describing
    an entity as being the "world''s best" or "most respected in the industry" is
    subjective and, therefore, could be misleading to report users.

    * contains or implies certain facts that are not true (for example, that certain
    IT components exist when they do not or that certain processes and controls have
    been implemented when they are not being performed).


    ¹ Subsequent events are discussed beginning in paragraph 3.139 of this guide.'
