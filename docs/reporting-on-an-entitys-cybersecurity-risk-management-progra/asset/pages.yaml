    2.60 In the cybersecurity risk management examination, management would tailor
    those cybersecurity objectives to reflect the entity''s business objectives based
    on the nature of the business and the industry in which it operates, the entity''s
    mission and vision, and the entity''s cybersecurity risk appetite.


    2.61 Because of the close relationship among the entity''s cybersecurity objectives,
    the practitioner''s opinion on the effectiveness of controls, and report users''
    understanding of the practitioner''s opinion, the practitioner should consider
    whether the cybersecurity objectives are suitable and complete. If the practitioner
    believes that the cybersecurity objectives established by management are not suitable
    and complete, the practitioner should discuss the matter with management. If management
    is unwilling to revise the cybersecurity objectives to address the practitioner''s
    concerns, the practitioner may decide (a) to refuse to accept the engagement or
    (b) to restrict the use of the report to those users who are able to understand
    the risks not addressed by the entity''s cybersecurity objectives. Chapter 3,
    "Performing the Cybersecurity Risk Management Examination," discusses the situation
    when, after accepting the engagement, the practitioner obtains evidence that causes
    him or her to believe that the entity''s cybersecurity objectives are not suitable
    for the engagement.


    # Requesting a Written Assertion and Representations From Management


    2.62 Paragraph .10 of AT-C section 205 requires the practitioner to request a
    written assertion from the responsible party that addresses both subject matters
    in the cybersecurity risk management examination. Specifically, the assertion
    addresses whether (1) the description is presented in accordance with the description
    criteria and (2) the controls within the program were effective to achieve the
    entity''s cybersecurity objectives.


    2.63 Management''s assertion is included in the cybersecurity risk management
    examination report along with management''s description and the practitioner''s
    report. Because of the important role that the assertion plays in the engagement,
    it may be useful for the practitioner to provide management with an example of
    a written assertion prior to engagement acceptance. Such an example can be found
    in appendix E, "Illustrative Management Assertion in the Cybersecurity Risk Management
    Examination."'
