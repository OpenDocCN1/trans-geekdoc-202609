  md: '**information and systems.** Refers to information in electronic form during
    its use, processing, transmission, and storage and systems that use such information
    to process, transmit or transfer, and store information.


    **information assets.** Data and the associated software and infrastructure used
    to process, transmit, and store information.


    **infrastructure.** The collection of physical or virtual resources that supports
    an overall IT environment, including the server, storage, and network components.


    **inherent limitations.** Those limitations present in all internal control systems.
    The limitations relate to the preconditions of internal control, external events
    beyond the entity''s control, limits of human judgment, the reality that breakdowns
    can occur, and the possibility of management override and collusion.


    **inherent risks.** Risks to the achievement of objectives in the absence of any
    actions management might take to alter either the risk likelihood or impact.


    **inherent cybersecurity risks.** Inherent risks arising from cybersecurity threats
    and vulnerabilities of information assets that would prevent the entity''s cybersecurity
    objectives from being achieved.


    **internal control.** A process, effected by an entity''s board of directors,
    management, and other personnel, designed to provide reasonable assurance regarding
    the achievement of objectives relating to operations, reporting, and compliance.


    **internal users.** Personnel whose job function causes them to be members of
    the people component of the information system.


    **management override.** Management''s overruling of prescribed policies or procedures
    for illegitimate purposes with the intent of personal gain or an enhanced presentation
    of an entity''s financial condition, compliance status, or cybersecurity risk
    management program.


    **outsourced service providers.** A service provider vendor that performs business
    processes, operations, or controls on behalf of the entity when such business
    processes, operations, or controls are necessary to achieve the entity''s objectives.


    **personal information.** Information that is, or can be about or related to,
    an identifiable individual.


    **policies.** Management or board member statements of what should be done to
    effect control. Such statements may be documented, explicitly stated in communications,
    or implied through actions and decisions. Policies serve as the basis for procedures.


    **privacy commitments.** Declarations made by management regarding the performance
    of a system processing personal information. Such commitments can be communicated
    in written agreements, standardized contracts, service level agreements, or published
    statements (for example, a privacy practices statement). In addition, privacy
    commitments may be made on many different aspects of the service being provided,
    including the following:


    +   - Types of information processed by the system'
