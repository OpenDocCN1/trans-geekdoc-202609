    # ## Preparing the Written Assertion


    As previously stated, management is responsible for preparing the written assertion.
    In its assertion, management confirms, to the best of its knowledge and belief,
    that


    +   a. the description was prepared in accordance with the description criteria.

    b. controls within the cybersecurity risk management program were effective to
    achieve the entity''s cybersecurity objectives based on the control criteria.


    # ## Having a Reasonable Basis for Management''s Assertion


    As previously discussed, management is responsible for having a reasonable basis
    for its assertion about the description and the effectiveness of controls within
    the cybersecurity risk management program. Furthermore, because management''s
    assertion generally addresses the effectiveness of controls over a specified period
    of time, management''s basis for its assertion should cover the same time frame
    as the assertion.


    The implementation of an effective cybersecurity risk management program is a
    significant endeavor for most entities, requiring the design and operation of
    technology solutions and complex processes and procedures, including those governing
    interactions with third parties (customers, vendors, business partners, and others)
    and their information systems. Because of these complexities, controls within
    the entity''s cybersecurity risk management program are unlikely to be effective
    without regular monitoring and assessment of controls. Therefore, monitoring and
    assessment of controls is ordinarily a key component of management''s basis for
    its assertion.


    For those reasons, management generally will need to perform a formal assessment
    of the effectiveness of its controls to make its assertion. In most cases, during
    the assessment process, management will do the following:


    +   a. Evaluate the effectiveness of the entity''s procedures for identifying

    i. cybersecurity objectives based on the entity''s business objectives (for instance,
    delivery of services, production of goods, or protection of assets);

    ii. information and other assets of the entity that are at risk, based on the
    scope of the engagement and defined cybersecurity objectives; and

    iii. the threats to the information and other assets based on internal and external
    threat intelligence data, inherent vulnerabilities of information assets and other
    assets, and the linkages between such vulnerabilities and identified threats.'
