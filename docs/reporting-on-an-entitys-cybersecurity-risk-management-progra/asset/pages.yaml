    section 105 and AT-C section 205 when describing those requirements in the context
    of a cybersecurity risk management examination. Although not all of the requirements
    in AT-C section 105 and AT-C section 205 are repeated or referred to in this guide,
    the practitioner is responsible for complying with all relevant requirements contained
    in those sections.


    # Code of Professional Conduct


    1.56  The AICPA Code of Professional Conduct (code) provides guidance and rules
    that apply to all members in the performance of their professional responsibilities.
    The code includes the fundamental principles that govern the performance of all
    professional services performed by CPAs and, among other things, call for CPAs
    to maintain high ethical standards and to exercise due care in the performance
    of all services. When providing attestation services, the “Considering or Subsequent
    Employment or Association With an Attest Client” subtopic (AICPA, Professional
    Standards, ET sec. 1.279) of the “Independence Rule” also requires CPAs to be
    independent in both fact and appearance. Independence in a cybersecurity risk
    management examination is discussed in more detail beginning in paragraph 2.66
    of this guide.


    # Quality in the Cybersecurity Risk Management Examination


    1.57  Paragraphs .06–.07 of AT-C section 105 discuss the relationship between
    the attestation standards and the AICPA quality control standards. Quality control
    systems, policies, and procedures are the responsibility of a firm when conducting
    its attestation practice. Under QC section 10, A Firm’s System of Quality Control
    (AICPA, Professional Standards), a CPA firm has an obligation to establish and
    maintain a system of quality control to provide it with reasonable assurance that


    +   a. the firm and its personnel comply with professional standards and applicable
    legal and regulatory requirements and


    +   b. reports issued by the firm are appropriate in the circumstances.


