    # ## Considering Materiality in Responding to the Assessed Risks and Planning
    Procedures


    3.04 As discussed in chapter 2, “Accepting and Planning a Cybersecurity Risk Management
    Examination,” paragraph .16 of AT-C section 205 requires the practitioner to consider
    materiality when establishing the engagement strategy. Paragraph .A15 states that
    materiality in an attestation engagement is considered in the context of qualitative
    factors and, when applicable, quantitative factors. The relative importance of
    each of those factors when considering materiality in a particular engagement
    is a matter of professional judgment, and those judgments are made in light of
    the surrounding circumstances. Furthermore, due to the nature of a cybersecurity
    examination, the application of materiality to different aspects of the entity
    will result in differences in planned procedures due to underlying differences
    in threats and vulnerabilities.


    3.05 Due to the vast number of information and other assets and the number of
    related processes and controls within even a small entity, or a business unit
    or segment of a larger entity, practitioners need to consider materiality during
    risk assessment and when determining the nature, timing, and extent of procedures
    to perform during the cybersecurity risk management examination. Adoption of an
    appropriate materiality allows the practitioner to prioritize testing efforts
    and supports an effective and efficient engagement.


    3.06 As discussed throughout this guide, there are two distinct but complementary
    subject matters in a cybersecurity risk management examination: (1) the description
    of the entity''s cybersecurity risk management program and (2) the effectiveness
    of the controls within that program to achieve the entity''s cybersecurity objectives;
    consequently, consideration of materiality is different as it relates to each.


    3.07 When considering materiality regarding the description, the practitioner
    should consider whether description misstatements (including omissions) in the
    presentation, individually or in the aggregate, could reasonably be expected to
    influence relevant decisions of report users. For instance, a material omission
    may result from the entity''s failure to describe a cybersecurity objective related
    to compliance with the European Union''s General Data Protection Regulation, when
    significant operations of the entity are subject to that regulation. Paragraph
    3.19 discusses materiality considerations when evaluating whether the description
    is presented in accordance with the description criteria.


    3.08 When considering materiality regarding the effectiveness of controls to achieve
    the entity''s cybersecurity objectives, the practitioner should consider both
    qualitative and quantitative factors, as discussed in paragraph 3.38.


    # ## Designing Overall Responses to the Risk Assessment


    3.09 The assessment of the risks of material misstatement is affected by many
    factors, including materiality considerations and the practitioner''s understanding
    of the effectiveness of entity-level controls. Effective entity-level controls,
    particularly the control environment and monitoring activities, may allow the
    practitioner to have more confidence in the processes and controls'
