  md: '+   a. the practitioner''s conclusion about the *sufficiency and appropriateness
    of evidence* obtained during the cybersecurity risk management examination and


    +   b. whether uncorrected misstatements are material, individually or in the
    aggregate.


    # Considering the Sufficiency and Appropriateness of Evidence


    **4.05** When forming his or her conclusion with respect to the sufficiency and
    appropriateness of evidence obtained during the examination, the practitioner
    exercises professional judgment, which is influenced by factors such as the following:


    +   * The significance of a potential description misstatement or deficiency and
    the likelihood that it will have a material effect, individually or aggregated
    with other potential description misstatements and deficiencies, on the presentation
    of the description of the entity''s cybersecurity risk management program or on
    the effectiveness of controls to achieve the entity''s cybersecurity objectives
    based on the control criteria


    +   * The effectiveness of management''s responses to address the known risks


    +   * The experience gained during previous consulting or examination engagements
    with respect to similar potential description misstatements and deficiencies


    +   * The results of procedures performed, including whether such procedures identified
    specific description misstatements and deficiencies


    +   * The source and reliability of the available information


    +   * The persuasiveness of the evidence


    +   * The practitioner''s understanding of the entity and its environment


    # Considering Material Uncorrected Description Misstatements and Deficiencies


    **4.06** The cybersecurity risk management examination is a cumulative and iterative
    process. As the practitioner performs planned procedures, evidence obtained may
    cause the practitioner to alter the nature, timing, or extent of other planned
    procedures. For example, information such as the following—which differs significantly
    from the information on which the risk assessment and planned procedures were
    based—may come to the practitioner''s attention:


    +   * The nature and number of identified description misstatements and deficiencies.
    (This may change the practitioner''s professional judgment about the reliability
    of particular sources of information.) For example, the practitioner may discover
    that management was unaware that detection tools were not implemented over a portion
    of the entity''s network. In response, the practitioner may determine that additional
    testing is needed to evaluate the effectiveness of other controls over that portion
    of the network.


    +   * Identified discrepancies in relevant information or conflicting or missing
    evidence.'
