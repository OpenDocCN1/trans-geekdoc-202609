    a limited number of specified parties for a report that is restricted in accordance
    with paragraph .64 of AT-C section 205.


    **retention.** A phase of the data lifecycle that pertains to how long an entity
    stores information for future use or reference.


    **risk.** The possibility that an event will occur and adversely affect the achievement
    of objectives.


    **risk of material misstatement.** The risk that management’s description of the
    entity’s cybersecurity risk management program is not presented in accordance
    with the description criteria or that controls within that program were not effective
    to achieve the entity’s cybersecurity objectives.


    **risk response.** The decision to accept, avoid, reduce, or share a risk.


    **risk tolerance.** The acceptable variation relative to performance to the achievement
    of objectives.


    **security event.** An occurrence, arising from actual or attempted unauthorized
    access or use by internal or external parties, that impairs or could impair the
    availability, integrity, or confidentiality of information or systems, result
