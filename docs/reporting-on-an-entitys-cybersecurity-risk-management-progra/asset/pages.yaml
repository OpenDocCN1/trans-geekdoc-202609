  md: 'The remainder of this section discusses additional considerations when evaluating
    whether management has a reasonable basis for its assertion in a cybersecurity
    risk management examination.


    **2.32** The implementation of an effective cybersecurity risk management program
    is a significant endeavor for most entities, requiring the design and operation
    of technology solutions and complex processes and procedures, including those
    governing interactions with third parties (customers, vendors, business partners,
    and others) and their information systems. Because of these complexities, controls
    within the entity’s cybersecurity risk management program are unlikely to be effective
    without regular monitoring and assessment of controls. Therefore, monitoring and
    assessment of controls is ordinarily a key component of management’s basis for
    its assertion.


    **2.33** For those reasons, management generally will need to perform a formal
    assessment of the effectiveness of its controls to make its assertion. In most
    cases, during the assessment process, management will do the following:


    +   a. Evaluate the effectiveness of the entity’s procedures for identifying

    i. cybersecurity objectives based on the entity’s business objectives (for instance,
    delivery of services, production of goods, or protection of assets);

    ii. information and other assets of the entity at risk, based on the scope of
    the engagement and defined cybersecurity objectives; and

    iii. the threats to the information and other assets based on internal and external
    threat intelligence data, inherent vulnerabilities of information assets and other
    assets, and the linkages between such vulnerabilities and identified threats.


    +   b. Evaluate the effectiveness of the processes it uses to design and implement
    controls to mitigate risks. Evaluating the effectiveness of such processes may
    involve comparing the results of monitoring activities and reviewing the results
    of independent assessments and other activities designed to continuously improve
    controls based on lessons learned from security events.


    +   c. Assess the effectiveness of controls, particularly controls that monitor
    the effectiveness of other controls, to provide reasonable assurance of achieving
    the entity’s cybersecurity objectives. (This is particularly important when aspects
    of the entity’s cybersecurity risk management program controls have been outsourced
    to service providers. Paragraph 2.37 further discusses third-party considerations.)


    **2.34** In addition to the factors discussed in paragraph 2.31, the effectiveness
    of the entity’s cybersecurity controls is highly dependent on the existence of
    an accurate and complete inventory of the entity’s information assets⁶ and standard
    acquisition processes and configuration settings. If these do not exist,


    > ⁶ As used in this guide, the term information assets refers to data and associated
    software and infrastructure used to process, transmit, and store information.
    Examples of information assets include employees’ personally identifiable information,
    protected health information, customers’ credit card information, and the systems
    that process, transmit, and store such information.'
