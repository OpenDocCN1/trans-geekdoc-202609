    might be appropriate and factors that practitioners consider when accepting such
    an engagement.


    # Other Engagements Related to Controls Over Security, Availability, Processing
    Integrity, Confidentiality, or Privacy


    **1.45**  Although the focus of this guide is on a practitioner engaged to perform
    and report on the cybersecurity risk management examination, there are other engagements
    a practitioner may be engaged to perform that also address an entity''s controls
    over the security, availability, processing integrity, confidentiality, and privacy
    of information. This section describes other types of engagements and discusses
    the differences between them and the cybersecurity risk management examination.


    # SOC 2 Engagements


    **1.46**  An entity''s management is responsible for assessing and addressing
    risks faced by the entity related to reporting, compliance with laws and regulations,
    and the efficiency and effectiveness of its operations. When an entity engages
    a service provider (referred to as a *service organization* in this context) to
    perform certain processes or functions, the entity (referred to as a *user entity*)
    exposes itself to additional risks related to the service organization''s system.
    Although management of a user entity can delegate tasks or functions to a service
    organization, the ownership and responsibility for the product or service provided
    to customers of the user entity cannot be delegated. Management of the user entity
    is held responsible by those charged with governance (for example, board members),
    customers, shareholders, regulators, and other affected parties for establishing
    effective internal control over outsourced functions.


    **1.47**  To assess and address the risks associated with an outsourced service,
    management of the user entity needs information about the service organization''s
    controls over the system through which the services are provided. When assessing
    controls at a service organization that may be relevant to and affect the services
    provided to user entities, management of a user entity may ask the service organization
    for a service auditor''s report on a description of the service organization''s
    system and the design and operating effectiveness of controls over the service
    organization''s system that may be relevant to the security, availability, or
    processing integrity of the system or the system''s ability to maintain the confidentiality
    or privacy of the information processed for'
