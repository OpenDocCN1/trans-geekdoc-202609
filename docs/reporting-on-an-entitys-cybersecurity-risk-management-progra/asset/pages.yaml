- pgno: 62
  md: '# Planning to Use the Work of Internal Auditors


    **2.116** If, after obtaining an understanding of the internal audit function,
    the practitioner concludes that *(a)* the activities of the internal audit function
    are not relevant to the cybersecurity risk management examination or *(b)* it
    may not be efficient to consider the work of the internal audit function, the
    practitioner does not need to give further consideration to the work of the internal
    audit function.


    **2.117** The practitioner may determine, however, that the engagement can be
    performed more effectively or efficiently by using the work of the internal audit
    function or obtaining direct assistance from internal audit function personnel.
    The phrase "using the work of the internal audit function" usually refers to using
    work designed and performed by the internal audit function, in accordance with
    an internal audit plan, to obtain evidence to support the various entity objectives.
    This differs from work the internal audit function performs to provide direct
    assistance to the practitioner, including assistance in performing tests of controls
    that are designed by the practitioner and performed by members of the internal
    audit function under the practitioner''s direction, supervision, and review. When
    members of the internal audit function provide direct assistance, the procedures
    they perform are similar to work performed by the engagement team. $ ^{11} $


    # Evaluating the Competence, Objectivity, and Systematic Approach Used by Internal
    Auditors


    **2.118** If the practitioner determines that the work of the internal audit function
    is relevant to the cybersecurity risk management examination, and the practitioner
    intends to use the work of the internal audit function in obtaining evidence,
    or plans to use internal auditors to provide direct assistance during the examination,
    the practitioner should determine whether the work can be used for purposes of
    the examination by evaluating several factors. The factors the practitioner should
    evaluate include


    +   *a.* the level of competence of the internal audit function or the individual
    internal auditors providing direct assistance;


    +   *b.* the extent to which the internal audit function''s organizational status
    and relevant policies and procedures support the objectivity of the internal audit
    function as a whole or, for internal auditors providing direct assistance, the
    existence of threats to the objectivity of those internal auditors and the related
    safeguards applied to reduce or eliminate those threats; and


    +   *c.* the application by the internal audit function of a systematic and disciplined
    approach, including quality control.


    **2.119** When evaluating competence, the practitioner should consider the attainment
    and maintenance of knowledge and skills of the internal audit function at the
    level required to enable assigned tasks to be performed diligently and with the
    appropriate level of quality, particularly as it relates to the work


    > $ ^{11} $ Regardless of whether the practitioner plans to use the internal audit''s
    work or to use the internal audit function in a direct assistance capacity, the
    term *engagement team*, as used throughout this guide, does not include individuals
    within the entity''s internal audit function.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'of the internal audit function that is to be used or, when using individuals
    for direct assistance, the individual. Consideration of factors such as the following
    may assist the practitioner with that evaluation: $(a)$ hiring policies; $(b)$
    the adequacy of resources relative to the size of the entity; $(c)$ technical
    training and proficiency of individuals; $(d)$ knowledge of the areas being examined,
    including industry-specific or technical knowledge required to perform the work;
    and $(e)$ whether internal auditors are members of relevant professional bodies
    or have certifications that oblige them to comply with the relevant professional
    standards, including continuing professional education requirements.


    **2.120** When evaluating objectivity, the practitioner should consider whether
    the internal audit function as a whole or, when using individuals for direct assistance,
    the individual performs tasks without allowing bias, conflict of interest, or
    undue influence of others to override professional judgments. Factors that may
    impact objectivity include whether there are $(a)$ any conflicts of interest or
    undue influence of others to override professional judgments, $(b)$ conflicting
    responsibilities, and $(c)$ constraints or restrictions on the internal audit
    function (or, when using direct assistance, the individual).


    **2.121** When evaluating the application by the internal audit function of a
    systematic and disciplined approach, including quality control, the practitioner
    may consider the function''s approach to planning, performing, supervising, reviewing,
    and documenting its activities. Relevant factors to consider may include, among
    others, $(a)$ the existence, adequacy, and use of documented internal audit procedures
    or guidance covering such areas as risk assessments, work programs, documentation,
    and reporting; or $(b)$ whether the internal audit function has appropriate quality
    control policies and procedures.


    **2.122** The objectivity and competence of internal auditors are important considerations
    when determining whether to use their work and, if so, the nature and extent to
    which their work should be used. However, as noted in paragraph .A46 of AT-C section
    205, a high degree of objectivity cannot compensate for a low degree of competence,
    nor can a high degree of competence compensate for a low degree of objectivity.
    Additionally, when the practitioner is considering whether to use the work of
    the internal audit function, neither a high level of competence nor strong support
    for the objectivity of the internal auditors compensates for the lack of a systematic
    and disciplined approach by the internal audit function.


    **2.123** Based on an evaluation of the preceding factors, it is up to the practitioner
    to determine whether the risks to the quality of the work of the internal audit
    function or the individual, when using direct assistance, are too significant
    and whether it is appropriate to use any of the work of the function or individual
    as examination evidence.


    # Determining the Extent to Which to Use the Work of Internal Auditors


    **2.124** The extent to which the practitioner plans to use the work of the internal
    audit function is a matter of professional judgment. Because the practitioner
    has sole responsibility for expressing an opinion on the description and on the
    effectiveness of controls, the practitioner makes all significant judgments in
    the examination, including when to use the work of the internal audit function
    in obtaining evidence.'
