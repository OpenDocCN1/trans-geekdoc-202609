- pgno: 16
  md: '# Chapter 1


    # Introduction and Background


    This chapter introduces cybersecurity and discusses why it has become a top concern
    for boards of directors, senior management, and others. This chapter also provides
    an overview of an examination of an entity''s cybersecurity risk management processes
    and controls (referred to as an entity''s *cybersecurity risk management program*)
    and related report designed by the AICPA to meet the informational needs of intended
    users. Finally, the chapter discusses the professional standards practitioners
    are required to follow when performing the examination.


    # Introduction


    **1.01** Almost every day a new cyberattack is announced in the media. Nation
    states, hackers, organized crime, and malicious insiders are attacking entities
    because of who they are, what they do, or the information they possess. Sometimes,
    the attacks are launched simply to cause a business disruption or broader economic
    interruption. Banks, big-box retailers, government agencies... it seems that none
    are immune from cyberattacks. Along with the increased number of reported attacks,
    the number of victims and the amount of information compromised by each attack
    is also increasing.


    **1.02** Cybersecurity has become a top concern for boards of directors and senior
    executives of many entities throughout the country, regardless of their size or
    the industry in which they operate. In addition, governmental officials are also
    concerned about cybersecurity at governmental agencies and departments. For most
    entities, cybersecurity is a significant business risk that needs to be identified,
    assessed, and managed along with other business risks the entity faces, and it
    is management''s responsibility to ensure that all employees throughout the entity,
    not only those in the information technology department, address cybersecurity
    risks. Managing this business issue is especially challenging because even an
    entity with a highly sophisticated cybersecurity risk management program has a
    residual risk that a material cybersecurity breach can occur and not be detected
    in a timely manner. In other words, an effective cybersecurity risk management
    program provides reasonable, but not absolute, assurance that material breaches
    are prevented or detected, and mitigated in a timely manner. Furthermore, the
    combined effects of entity''s dependency on information technology, the complexity
    of information technology networks and business applications, extensive reliance
    on third parties, and human nature (for instance, susceptibility to social engineering)
    are only likely to increase the need for effective cybersecurity risk management
    programs in the foreseeable future.


    © 2017, AICPA


    AAG-CYB 1.02'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# # Potential Users of Cybersecurity Information and Their Interests


    **1.03** To achieve the entity''s business objectives, senior management, as well
    as others within the entity, frequently need information about the effectiveness
    of the entity''s cybersecurity risk management program, including the processes
    and controls designed, implemented, and operated to mitigate threats against the
    entity''s sensitive information and systems.


    **1.04** Members of a board of directors (board members)¹ need information about
    the cybersecurity risks an entity faces and the cybersecurity risk management
    program that management implements to help them fulfill their oversight responsibilities.
    They also want information from independent third-party assessors that will help
    them evaluate management''s effectiveness in managing cybersecurity risks.


    **1.05** Others may also need information about an entity''s cybersecurity risks
    and its cybersecurity risk management program to make informed decisions. For
    example,


    * analysts and investors may benefit from information about an entity''s cybersecurity
    risk management program. This information is intended to help them understand
    the cybersecurity risks that could threaten the achievement of the entity''s operational,
    reporting, and compliance (legal and regulatory) objectives and, consequently,
    have an adverse impact on the entity''s value and stock price.


    * business partners may need information about the entity''s cybersecurity risk
    management program as part of their overall risk assessment. This information
    is intended to help business partners determine matters such as whether there
    is a need for multiple suppliers for a good or service and the extent to which
    they choose to extend credit to the entity.²


    * some industry regulators may benefit from information about an entity''s cybersecurity
    risk management program to support their oversight role.


    **1.06** Analysts, investors, business partners, and regulators recognize that
    entity management is responsible for identifying, assessing, and mitigating cybersecurity
    risks. However, many are not in a position to require management


    > ¹ This guide uses the term *board members* to refer to the governing body of
    an entity, which may take the form of a board of directors or supervisory board
    for a corporation, board of trustees for a not-for-profit entity, board of governors
    or commissioners for government entities, general partners for a partnership,
    or owner for a small business.


    ² Some business partners may need a detailed understanding of controls implemented
    by the entity and the operating effectiveness of those controls to enable them
    to design and operate their own control activities. For example, business partners
    whose IT systems are interconnected with systems at the entity may need to understand
    the specific logical access protection over the interconnected systems implemented
    by the entity.


    This guide is not intended to meet the needs of business partners who need a detailed
    understanding of the entity''s specific controls and their operating effectiveness.
    AICPA Guide *Reporting on Controls at a Service Organization Relevant to Security,
    Availability, Processing Integrity, Confidentiality, or Privacy (SOC 2®)* provides
    guidance for practitioners engaged to examine and report on system controls at
    a service organization.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'to provide information about an entity''s cybersecurity measures to enable
    them to make better decisions; they must rely on publicly available information,
    such as that found in general-purpose reports or regulatory filings, to meet their
    needs. In response to requests from these third parties, corporate directors and
    senior management have begun requesting general purpose reports from independent
    third-party assessors on the effectiveness of the entity''s cybersecurity risk
    management program.


    1.07 The potential users described in the previous paragraph are the primary users
    to whom general purpose reports on the effectiveness of the entity''s cybersecurity
    risk management program are directed. Individuals acting in a personal capacity
    often have different information needs and desires. For example, they might want
    information about how an entity protects credit card information used to purchase
    an item on the internet. Therefore, a general purpose report on the effectiveness
    of an entity''s cybersecurity risk management program may not always meet the
    information needs of such individuals. In addition, a general purpose report may
    include additional information that may not be easily understood by all individuals.
    Accordingly, although these individuals may find the report useful, they are not
    the primary intended users of such a report.


    # Cybersecurity Risk Management Examination


    1.08 To enable practitioners to provide a general purpose report on the effectiveness
    of an entity''s cybersecurity risk management program, the AICPA has developed
    the cybersecurity risk management examination described in this guide. In conjunction
    with this guide, the AICPA has also developed description criteria for use when
    preparing and evaluating the description of the entity''s cybersecurity risk management
    program and control criteria intended to be used when evaluating the effectiveness
    of controls within the entity''s cybersecurity risk management program.


    1.09 In the cybersecurity risk management examination, there are two distinct
    but complementary subject matters: (1) the description of the entity''s cybersecurity
    risk management program and (2) the effectiveness of controls within that program
    to achieve the entity''s cybersecurity objectives. As the responsible party, management
    prepares the description and makes an assertion about the subject matters. Specifically,
    management''s assertion addresses whether the description was prepared in accordance
    with description criteria and whether the controls within the program were effective
    to achieve the entity''s cybersecurity objectives based on the control criteria.
    The practitioner examines and reports on that information in accordance with the
    attestation standards. ³


    1.10 The practitioner performs the cybersecurity risk management examination described
    in this guide in accordance with the AICPA''s attestation standards. In the examination,
    the practitioner designs and performs procedures to obtain sufficient appropriate
    evidence about whether the description is presented in accordance with the description
    criteria and whether the


    ³ In certain circumstances, the practitioner may be engaged to report on the description
    and on the suitability of the design of controls within the entity''s cybersecurity
    risk management program, but not on the effectiveness of the controls. Such an
    examination (design-only examination) is discussed further beginning in paragraph
    1.42.'
