  md: "● Assign responsibility for the monitoring process to a partner or partners\
    \ or other persons with sufficient and appropriate experience and authority in\
    \ the firm to assume that responsibility.\n\n● Assign performance of the monitoring\
    \ process to competent individuals.\n\n● Require the performance of monitoring\
    \ procedures that are sufficiently comprehensive to enable the firm to assess\
    \ compliance with all applicable professional standards and the firm's quality\
    \ control policies and procedures. Monitoring procedures consist of the following:\n\
    \n+   — Review of selected administrative and personnel records pertaining to\
    \ the quality control elements.\n\n— Review of engagement documentation, reports,\
    \ and clients' financial statements.\n\n— Summarization of the findings from the\
    \ monitoring procedures, at least annually, and consideration of the systemic\
    \ causes of findings that indicate that improvements are needed.\n\n— Determination\
    \ of any corrective actions to be taken or improvements to be made with respect\
    \ to the specific engagements reviewed or the firm's quality control policies\
    \ and procedures.\n\n— Communication of the identified findings to appropriate\
    \ firm management personnel.\n\n— Consideration of findings by appropriate firm\
    \ management personnel who should also determine that any actions necessary, including\
    \ necessary modifications to the quality control system, are taken on a timely\
    \ basis.\n\n+   — Assessment of\n   ● the appropriateness of the firm's guidance\
    \ materials and any practice aids;\n   ● new developments in professional standards\
    \ and regulatory and legal requirements and how they are reflected in the firm's\
    \ policies and procedures where appropriate;\n   ● compliance with policies and\
    \ procedures on independence;\n   ● the effectiveness of continuing professional\
    \ development, including training;\n   ● decisions related to acceptance and continuance\
    \ of client relationships and specific engagements; and\n   ● firm personnel's\
    \ understanding of the firm's quality control policies and procedures and implementation\
    \ thereof.\n\n● Communicate at least annually, to relevant engagement partners\
    \ and other appropriate personnel, deficiencies noted as a result of"
