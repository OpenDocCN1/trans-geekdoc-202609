    # ## Responding to and Communicating Known or Suspected Fraud, Noncompliance With
    Laws or Regulations, Uncorrected Misstatements, or Internal Control Deficiencies


    # ### Known or Suspected Fraud or Noncompliance With Laws or Regulations


    **3.124** As discussed in chapter 2, the practitioner has a responsibility to
    consider known or suspected incidents of fraud and noncompliance with laws or
    regulations. The practitioner determines the effect of such incidents on management’s
    description of the entity’s cybersecurity risk management program, on the effectiveness
    of controls to achieve the entity’s cybersecurity objectives based on the control
    criteria, and on the practitioner’s report. Additionally, the practitioner communicates
    such information to appropriate parties.


    **3.125** When incidents of fraud or suspected fraud are identified during the
    engagement, the practitioner is expected to respond appropriately. For example,
    unless prohibited by law, regulation, or ethics standards, appropriate responses
    may include the following:


    +   - Discussing the matter with senior management (and the engaging party, if
    different) and other appropriate party(ies), unless senior management is suspected
    to have committed the fraud. If the practitioner suspects fraud involving senior
    management, the practitioner should communicate these suspicions to those charged
    with governance and discuss with them the nature, timing, and extent of procedures
    necessary to complete the examination.


    +   - Requesting that senior management (and the engaging party, if different)
    consult with an appropriately qualified third party, such as the entity’s legal
    counsel or a regulator


    +   - Considering the implications of the matter in relation to other aspects
    of the engagement, including the practitioner’s risk assessment and the reliability
    of written representations from management (and the engaging party, if different)


    +   - Obtaining legal advice about the consequences of different courses of action


    +   - Communicating with third parties (such as a regulator)


    +   - Withdrawing from the engagement'
