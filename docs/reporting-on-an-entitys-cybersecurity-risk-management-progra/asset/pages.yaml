  md: '# Control Criteria


    When selecting the control criteria to be used in the evaluation of the effectiveness
    of controls within the entity''s cybersecurity risk management program, management
    may select any criteria, as long as the criteria are both suitable and available
    to users. Management may select the criteria for the security, availability, and
    confidentiality categories in the 2017 Trust Services Criteria for Security, Availability,
    Processing Integrity, Confidentiality, and Privacy as the control criteria.


    Applying the trust services criteria in actual situations requires judgment. Therefore,
    each criterion also contains points of focus. The COSO framework states that points
    of focus represent important characteristics of the criteria. Consistent with
    the COSO framework, the points of focus may assist management when designing,
    implementing, and operating controls over security, availability, and confidentiality.
    In addition, the points of focus may assist both management and the practitioner
    when evaluating whether the controls were suitably designed and operated to meet
    the entity''s cybersecurity risk management objectives based on the trust services
    criteria.


    The security, availability, and confidentiality criteria in 2017 Trust Services
    Criteria for Security, Availability, Processing Integrity, Confidentiality, and
    Privacy were promulgated by the ASEC, which has determined that the trust services
    criteria for security, availability, and confidentiality are suitable for use
    in the cybersecurity risk management examination. Because they are also made available
    to general users, the trust services criteria for security, availability, and
    confidentiality are both suitable and available control criteria for the cybersecurity
    risk management examination.


    If management selects different criteria as either the description criteria or
    control criteria, the practitioner is responsible for determining whether he or
    she agrees with management''s assessment about the suitability and availability
    of the other criteria. If the practitioner determines that the selected criteria
    are not suitable, the practitioner typically works with management of the entity
    to identify suitable criteria.


    # Preparing the Description of the Entity''s Cybersecurity Risk Management Program
    in Accordance With the Description Criteria


    As previously discussed, the description of the entity''s cybersecurity risk management
    program is intended to provide report users with information that will enable
    them to better understand the entity''s cybersecurity risk management program.
    For example, disclosures about the environment in which the entity operates, the
    process used to develop its cybersecurity objectives, commitments made to customers
    and others, responsibilities involved in operating and maintaining a cybersecurity
    risk management program, and the nature of the IT components used, allow users
    to better understand the context in which the processes and controls operate within
    the entity''s cybersecurity risk management program.


    Ordinarily, a description of an entity''s cybersecurity risk management program
    is prepared in accordance with the description criteria when it'
