    # # Performing Risk Assessment Procedures


    # ## Obtaining an Understanding of the Entity’s Cybersecurity Risk Management
    Program and Controls Within That Program


    **2.100** Paragraph .14 of AT-C section 205 requires the practitioner to obtain
    a sufficient understanding of the subject matter of the engagement. As previously
    discussed, there are two subject matters in the cybersecurity risk management
    examination:


    +   1. A description of the entity’s cybersecurity risk management program in
    accordance with the description criteria

    2. The effectiveness of the controls within that program to achieve the entity’s
    cybersecurity objectives based on the control criteria


    **2.101** The practitioner’s risk assessment procedures to obtain the understanding
    may include the following, usually in some combination:


    +   - Inquiring of management, those charged with governance, and others within
    the entity who, in the practitioner’s judgment, may have relevant information

    - Observing operations and inspecting documents, reports, and printed and electronic
    records of transaction processing

    - Inspecting a selection of agreements between the entity and its customers and
    vendors and business partners (VBPs)

    - Reperforming the application of a control


    **2.102** One or more of the procedures discussed in the preceding paragraph may
    be accomplished through the performance of a walkthrough. In addition, the practitioner
    may perform such procedures concurrently with procedures to obtain evidence about
    whether the description is presented in accordance with the description criteria
    and whether the controls within the program were effective in achieving the entity’s
    cybersecurity objectives based on the control criteria.


    **2.103** When obtaining the understanding of the entity’s program and controls,
    the practitioner needs to understand certain controls at a detailed level to enable
    him or her to perform procedures designed to obtain evidence about whether such
    controls were effective in achieving the entity’s cybersecurity objectives. Chapter
    3 discusses the practitioner’s procedures in a cybersecurity risk management examination
    in more detail.


    # ## Assessing the Risk of Material Misstatement


    **2.104** In the cybersecurity risk management examination, the practitioner’s
    understanding of the entity’s cybersecurity risk management program and controls
    within that program should be sufficient to enable the practitioner to do the
    following:


    +   - Identify and assess the risks that'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - the description of the entity''s cybersecurity risk management program
    is not presented in accordance with the description criteria and

    - controls were not effective in achieving the entity''s cybersecurity objectives
    based on the control criteria, because of deficiencies in the design or operations
    of controls


    +   - Provide a basis for designing and performing further procedures that are
    responsive to the assessed risks and for obtaining reasonable assurance to support
    the practitioner''s opinion on the description and the effectiveness of controls


    **2.105** When assessing the risks of material misstatement, paragraph .15 of
    AT-C section 205 states that the practitioner should obtain an understanding of
    internal control, which, in the case of a cybersecurity risk management examination,
    focuses on evaluating the design of controls over the preparation of the description
    and determining whether they have been implemented by making inquiries of the
    personnel responsible for the description and by performing other procedures.
    In addition, the practitioner should consider controls, including monitoring activities,
    that the entity has designed and implemented to provide reasonable assurance that
    the entity''s cybersecurity objectives are achieved.


    **2.106** The practitioner should consider whether any risk assessment procedures
    and other procedures performed to obtain the understanding indicate a risk of
    material misstatement due to fraud or noncompliance with laws or regulations.
    For example, fraud risks might include the risk of management override of entity
    controls, misappropriation of information and other assets, and the creation,
    by entity personnel, of false or misleading documents or records. Chapter 3 discusses
    the practitioner''s responsibilities for responding to known or suspected fraud
    or noncompliance in further detail.


    **2.107** As previously discussed, the risk of material misstatement relates to
    the likelihood and magnitude of the risks that threaten the achievement of the
    entity''s cybersecurity objectives and whether the processes and controls the
    entity has designed, implemented, and operated were effective in mitigating those
    risks. In the cybersecurity risk management examination, risk assessment often
    begins with identifying and assessing the types, likelihood, and impact of risks
    that affect the preparation of the description and the effectiveness of controls
    within the entity''s cybersecurity risk management program. Risks to the entity''s
    information assets, including manufacturing and industrial control systems, may
    arise from any of the following:


    +   - Intentional (for example, fraud) and unintentional internal and external
    acts

    - Identified threats, vulnerabilities, and deficiencies

    - The use of external parties that store, process, or transmit sensitive information
    on the entity''s behalf (for example, suppliers, customers, vendors, business
    partners, "fourth parties")

    - The type of employee personnel (finance, administrative, operations, IT, sales
    and marketing, and so on) and others (contractors, vendor employees, business
    partners, and so on) with access to information and systems'
