  md: '# **134** Reporting on an Entity''s Cybersecurity Risk Management Program and
    Controls


    considerations are mainly qualitative in nature and center around whether there
    are misstatements in, or omissions of, the information disclosed that could reasonably
    be expected to influence users'' decisions. For that reason, an understanding
    of the perspectives and information needs of intended users of the report is necessary
    to the assessment of materiality.


    Qualitative factors to be considered include matters such as whether


    +   - the description is prepared at a level of detail likely to be meaningful
    to users.

    - each of the description criteria in *Description Criteria for Management''s
    Description of an Entity''s Cybersecurity Risk Management Program* has been addressed
    without using language that omits or distorts the information.

    - the characteristics of the presentation are appropriate, since variations in
    presentation may occur.


    For example, a description would not be presented in accordance with the description
    criteria if it


    +   - omits information involving one or more significant business units or segments,
    when the engagement addresses the entity-wide cybersecurity risk management program.

    - contains statements that cannot be objectively evaluated. (For example, describing
    an entity as being the "world''s best" or "most respected in the industry" is
    subjective and, therefore, could be misleading to report users.)

    - contains or implies certain facts that are not true (for example, that certain
    IT components exist when they do not, or that certain processes and controls have
    been implemented when they are not being performed).

    - omits or distorts significant information related to any of the description
    criteria in a manner that might affect users'' decisions.


    Nevertheless, a description prepared in accordance with the description criteria
    is not required to disclose every matter related to the entity''s cybersecurity
    risk management program that every user might consider useful when making decisions.
    For example, a description presented in accordance with the description criteria
    may omit certain information related to the entity''s cybersecurity risk management
    program when that information is unlikely to be significant (in other words, it
    is immaterial) to report users'' decisions.


    When evaluating whether the description describes the cybersecurity risk management
    program the entity has implemented (that is, placed in operation), management
    considers whether there is alignment between the key security policies and processes
    described in the description and the controls the entity has designed and implemented
    to achieve the entity''s cybersecurity objectives. Although management''s description
    only includes information about the key security policies and processes, such
    key security policies and processes should be supported by controls designed and
    implemented to achieve the entity''s cybersecurity objectives. The lack of comprehensive
