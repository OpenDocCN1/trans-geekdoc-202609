    # Difference Between Cybersecurity and Information Security


    1.15 Before the widespread use of the Internet and the World Wide Web, most businesses
    had only limited connectivity with information systems outside their organizations.
    As a result, an entity’s information security focused on the protection of its
    IT systems and data against unauthorized access, use, and changes from within
    the entity. Today, most entities conduct portions of their business in cyberspace;
    therefore, their IT systems are highly interconnected with other organizations.
    For the purposes of this guide, cyberspace is defined as an interdependent network
    of information system infrastructures including the Internet, telecommunications
    networks, computer systems, and embedded processors and controllers through which
    entities interact to conduct business and share information.


    1.16 An entity’s cybersecurity risks are the subset of its information security
    risks that arise specifically from threats and vulnerabilities related to the
    connection to and use of cyberspace. Cybersecurity refers to the processes and
    controls implemented by an entity to manage cybersecurity risks. Because the processes
    and controls that address cybersecurity risks also address the vast majority of
    the entity’s other information security risks, the terms cybersecurity and information
    security are often used interchangeably. The main difference between information
    security and cybersecurity is that information security also addresses risks that
    arise from computer systems that are physically isolated from other electronic
    systems and the protection of information stored in a format that is not accessible
    through electronic means (such as printed paper stored in filing cabinets). From
    a practical standpoint, however, the difference is minor because most entities
    store, process, use, and transmit information'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'electronically. For the purposes of this guide, there is no distinction between
    the two terms.


    **1.17** By using the term *cybersecurity* instead of *information security*,
    board members and senior management are acknowledging the new and magnified risks
    inherent with doing business in cyberspace. Additionally, they recognize that
    the cyberspace environment is becoming increasingly hostile. The almost daily
    appearance of new threat actors who exploit the vulnerabilities of cyberspace
    for criminal or malicious purposes—and their use of new technologies to implement
    their attacks—increases the risks of operating in cyberspace. Thus, entities have
    to continually develop more effective and more targeted processes and controls
    to respond to those risks. This requires board members and senior management to
    think well beyond the traditional IT areas of networks, applications, and data
    stores.


    # # Description of the Entity’s Cybersecurity Risk Management Program


    **1.18** As previously discussed, management’s description of the entity’s cybersecurity
    risk management program is designed to provide users with information about the
    environment in which the entity operates and the process used to develop its cybersecurity
    objectives, identify its information assets and the threats against them, and
    the processes within the cybersecurity risk management program that the entity
    has designed and implemented to respond to those risks. The description is intended
    to enable users to understand the cybersecurity risk management program and the
    conclusions expressed by management in its assertion and by the practitioner in
    his or her report. It does not, however, provide a detailed narrative of the entity’s
    controls nor a listing of tests of controls performed by the practitioner and
    the results thereof.


    **1.19** As used in this guide, an entity’s *cybersecurity risk management program*
    is defined as the set of *policies*, *processes*, and *controls* designed to protect
    *information and systems* from *security events* that could *compromise the achievement
    of the entity’s cybersecurity objectives* and to detect, respond to, mitigate,
    and recover from, on a timely basis, security events that are not prevented.


    **1.20** *Italicized* terms are defined as follows:


    +   * *Information and systems* refers to information in electronic form during
    its use, processing, transmission, and storage and the systems that use such information
    to process, transmit or transfer, and store information. A *system* refers to
    infrastructure, software, people, processes, and data that are designed, implemented,
    and operated to work together to achieve one or more specific business objectives
    (for example, delivery of services or production of goods) in accordance with
    management-specified requirements. As used in this document, systems include manual,
    automated, and partially automated systems that are used for information processing,
    manufacturing and production, inventory management and distribution, information
    storage, and support functions within an organization. Systems that have cybersecurity
    risks include, for example,'
  merge: -1
  img_proc: true
- pgno: 22
  md: '+   — manufacturing and production systems that are automated or partially
    automated (including the industrial control systems components);


    — inventory management or distribution systems; and


    — treasury and funds management and other types of back office systems.


    +   • A *security event* is an occurrence, arising from actual or attempted unauthorized
    access or use by internal or external parties, that impairs or could impair the
    availability, integrity, or confidentiality of information or systems, result
    in unauthorized disclosure or theft of information or other assets, or cause damage
    to systems. A security incident is a security event that requires action on the
    part of an entity in order to protect information and other assets and resources.


    • A *compromise* refers to a loss of confidentiality, integrity, or availability
    of information, including any resultant impairment of


    — processing integrity or availability of systems or


    — the integrity or availability of system inputs or outputs.


    • An entity’s *cybersecurity objectives* are those objectives that the entity
    establishes to address cybersecurity risks that could otherwise threaten the achievement
    of the entity’s overall business objectives (including compliance, reporting,
    and operational objectives). Understanding the entity’s cybersecurity objectives
    is integral to the assessment and evaluation of whether controls are effective.
    Cybersecurity objectives are discussed in more detail later in this chapter.


    1.21 The definition in paragraph 1.19 acknowledges a fundamental tenet of cybersecurity:
    an entity that operates in cyberspace is likely to experience one or more security
    events or breaches at some point in time, regardless of the effectiveness of the
    entity’s cybersecurity controls. Understanding this tenet is essential to dispelling
    user misconceptions that an effective cybersecurity risk management program will
    prevent all security events from occurring. In fact, because of inherent limitations
    in its cybersecurity risk management program, an entity may achieve reasonable,
    but not absolute, assurance that security events are prevented and, for those
    not prevented, that they are detected, responded to, mitigated against, and recovered
    from on a timely basis. In other words, an effective cybersecurity risk management
    program is one that enables the entity to detect security events on a timely basis
    and to respond to and recover from such events with minimal disruption to the
    entity’s operations.


    # The Entity’s Cybersecurity Objectives


    1.22 According to the Committee of Sponsoring Organizations of the Treadway Commission
    (COSO), in its 2013 *Internal Control—Integrated Framework* (COSO framework),
    internal control is a process, effected by an entity’s board of directors, management,
    and other personnel, designed to provide reasonable assurance regarding the achievement
    of the entity’s business objectives. Because of this relationship between internal
    control and objectives, the COSO framework states that management specifies suitable
    objectives so'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'that the risks that threaten the achievement of the entity’s overall business
    objectives can be identified, assessed, and managed.


    1.23  According to the COSO framework, there are three categories of objectives:


    +   • *Operations objectives.* These pertain to the effectiveness and efficiency
    of the entity’s operations, including operational and financial performance goals
    and safeguarding assets against loss.


    +   • *Reporting objectives.* These pertain to internal and external financial
    and nonfinancial reporting and may encompass reliability, timeliness, transparency,
    or other terms as set forth by regulators, recognized standard setters, or the
    entity’s policies.


    +   • *Compliance objectives.* These pertain to adherence to laws and regulations
    to which the entity is subject.


    1.24  Cybersecurity risks are one of the types of risks that threaten the achievement
    of an entity’s overall business objectives. Consequently, entities often establish
    cybersecurity objectives that address their specific cybersecurity risks. Generally,
    the nature of an entity’s cybersecurity objectives varies depending on the environment
    in which the entity operates, the entity’s mission and vision, the overall business
    objectives established by management, risk appetite, and other factors. For example,
    a telecommunications entity may have a cybersecurity objective related to the
    reliable functioning of those aspects of its operations that are deemed to be
    critical infrastructure, whereas an entity that promotes online dating is likely
    to regard the confidentiality of personal information collected from its customers
    as a critical factor toward the achievement of its operating objectives.


    1.25  Management is responsible for establishing, and including in the description,
    the entity’s cybersecurity objectives with sufficient clarity to enable users
    to understand how the processes and controls within the entity’s cybersecurity
    risk management program were designed, implemented, and operated effectively to
    provide reasonable assurance of achieving those objectives. Because of the importance
    of the cybersecurity objectives to the cybersecurity risk management examination,
    the cybersecurity objectives established by management should be suitable for
    the engagement. Chapter 2, “Accepting and Planning a Cybersecurity Risk Management
    Examination,” discusses the attributes of suitable cybersecurity objectives.


    1.26  The practitioner is responsible for determining whether the cybersecurity
    objectives established by management are suitable for the engagement prior to
    engagement acceptance. Chapter 2 also discusses that responsibility in further
    detail.


    # Effectiveness of Controls Within the Entity’s Cybersecurity Risk Management
    Program


    1.27  In addition to providing a description of the entity’s cybersecurity risk
    management program, the cybersecurity risk management examination report also
    provides information about whether the controls the entity has designed, implemented,
    and operated to mitigate those risks were effective throughout the period of time
    covered by the engagement. For that reason, one of the subject matters of the
    cybersecurity risk management examination is the'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'effectiveness of controls within an entity''s cybersecurity risk management
    program to achieve the entity''s cybersecurity objectives.


    1.28 As used throughout this guide, the term *effectiveness of controls* encompasses
    both the suitability of the design of controls and their operating effectiveness:


    +   *   *Controls were suitably designed.* Suitably designed controls, if complied
    with satisfactorily, provide reasonable assurance of achieving the entity''s cybersecurity
    objectives based on the control criteria. Suitably designed controls operate as
    designed by persons who have the necessary authority and competence to perform
    the controls.


    +   *   *Controls operated effectively.* Suitably designed controls operate effectively
    if they provide reasonable assurance of achieving the entity''s cybersecurity
    objectives based on the control criteria.


    1.29 Because there are specific considerations when evaluating each, chapter 3,
    *Performing the Cybersecurity Risk Management Examination,* of this guide contains
    separate discussions of suitability of design and operating effectiveness to support
    the practitioner''s overall opinion on the effectiveness of controls to achieve
    the entity''s cybersecurity objectives.


    # # Overview of the Cybersecurity Risk Management Examination


    1.30 The cybersecurity risk management examination is performed in accordance
