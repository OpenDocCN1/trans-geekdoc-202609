- pgno: 135
  md: 'assurance regarding the achievement of the entity''s business objectives.³
    Because of this relationship between internal control and objectives, the COSO
    framework states that management specifies suitable objectives so that the risks
    that threaten the achievement of the entity''s overall business objectives can
    be identified, assessed, and managed.


    According to the COSO framework, there are three categories of objectives:


    +   *   **Operations objectives.** These pertain to the effectiveness and efficiency
    of the entity''s operations, including operational and financial performance goals
    and safeguarding assets against loss.


    +   *   **Reporting objectives.** These pertain to internal and external financial
    and nonfinancial reporting and may encompass reliability, timeliness, transparency,
    or other terms as set forth by regulators, recognized standard setters, or the
    entity''s policies.


    +   *   **Compliance objectives.** These pertain to adherence to laws and regulations
    to which the entity is subject.


    Cybersecurity risks are one of the types of risks that threaten the achievement
    of an entity''s overall business objectives. Consequently, entities often establish
    cybersecurity objectives that address their specific cybersecurity risks. Generally,
    the nature of an entity''s cybersecurity objectives varies depending on the environment
    in which the entity operates, the entity''s mission and vision, the overall business
    objectives established by management, risk appetite, and other factors. For example,
    a telecommunications entity may have a cybersecurity objective related to the
    reliable functioning of those aspects of its operations that are deemed to be
    critical infrastructure, whereas an entity that promotes online dating is likely
    to regard the confidentiality of personal information collected from its customers
    as a critical factor toward the achievement of its operating objectives.


    Management is responsible for establishing, and including in the description,
    the entity''s cybersecurity objectives with sufficient clarity to enable users
    to understand what the entity is striving to achieve from a cybersecurity perspective
    and how the controls within the entity''s cybersecurity risk management program
    were designed, implemented, and operated effectively to provide reasonable assurance
    of achieving those objectives. Because of the importance of the cybersecurity
    objectives to the cybersecurity risk management examination, the cybersecurity
    objectives established by management should be suitable for the engagement.


    According to the COSO framework, suitable objectives are


    +   *   **specific.** The objectives provide a clear understanding of the cybersecurity
    risks that need to be mitigated.


    +   *   **measurable or observable.** The objectives permit an objective determination
    about whether each cybersecurity objective has been met.


    +   *   **attainable.** The objectives permit the implementation of controls that,
    if suitably designed and operated effectively, provide reasonable assurance of
    achieving each objective.'
