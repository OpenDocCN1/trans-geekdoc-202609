- pgno: 218
  md: 'The Company''s board of directors, with the support of management and outside
    resources engaged by the board, reviews and updates its formal business strategy
    annually. Based on that strategy, management and the board annually establish
    or update the Company''s overall business objectives, including objectives over
    operations, compliance, and reporting. At the completion of this process, the
    overall objectives are approved.


    Upon approval of the Company''s business strategy and overall objectives, management
    uses a top-down approach to establish or update specific business objectives for
    business units and functions, including information technology, within the organization.
    This process includes budgeting resources and establishing metrics for the achievement
    of the objectives. At the completion of this process, the specific business objectives
    and the budget is submitted to the board for approval.


    As part of the development of specific business objectives, the chief information
    security officer (CISO) updates the Company''s cybersecurity objectives with the
    objectives of the business units and other functional areas. These cybersecurity
    objectives are then approved by the Company''s executive management, including
    the CEO, COO, CFO, chief risk officer (CRO), general counsel (GC), and the CIO.


    The Company''s cybersecurity risk management program is based on specifications
    set forth in the National Institute of Standards and Technology "Framework for
    Improving Critical Infrastructure Cybersecurity" (NIST cybersecurity framework)
    and International Standardization Organization and International Electrotechnical
    Commission (ISO/IEC) standards. The Company''s portfolio of security controls
    is based on ISO/IEC controls and, for systems containing cardholder information,
    the Payment Card Industry Data Security Standards.


