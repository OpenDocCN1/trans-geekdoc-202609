  md: '# # Obtaining and Evaluating Evidence About the Suitability of the Design of
    Controls to Achieve the Entity''s Cybersecurity Objectives


    3.43 As discussed in chapter 1, the practitioner''s opinion on the effectiveness
    of controls encompasses both the suitability of the design of controls and their
    operating effectiveness. Because there are specific considerations when evaluating
    each, this chapter contains separate discussions of suitability of design and
    operating effectiveness to support the overall opinion on the effectiveness of
    controls to achieve the entity''s cybersecurity objectives. This section discusses
    evaluating the suitability of design, whereas the section beginning in paragraph
    3.57 discusses evaluating the operating effectiveness of controls.


    3.44 Paragraph .15 of AT-C section 205 states that the practitioner''s understanding
    of the controls within an entity''s cybersecurity risk management program includes
    an evaluation of the design of controls within that program and whether they have
    been implemented. Suitably designed controls, if complied with satisfactorily,
    provide reasonable assurance of achieving the entity''s cybersecurity objectives
    based on the control criteria. Suitably designed controls operate as designed
    by persons who have the necessary authority and competence to perform the controls.


    3.45 Matters that are relevant in determining whether controls are suitably designed
    include the following:


    +   - Whether the applicable control or set of controls adequately addresses the
    risks that threaten the achievement of the entity''s cybersecurity objectives
    based on the control criteria

    - Whether the applicable control or set of controls, if operated effectively,
    would protect information and systems from security events that could compromise
    the achievement of the entity''s cybersecurity objectives and detect, respond
    to, mitigate, and recover from, on a timely basis, security events that are not
    prevented

    - Whether the information used in the operation of the controls is reliable. For
    example, the operation of a control may rely on configuration parameters of the
    comparison of the data to another set of data that is expected to be complete
    and accurate

    - Whether the applicable control or set of controls is adequately changing, adapting,
    and evolving, from a cyber-threat monitoring perspective, as new threats and exploits
    are identified and become able to be defended against by entities.


    3.46 Management is responsible for designing and implementing controls to achieve
    the entity''s cybersecurity objectives, identifying the risks that threaten the
    achievement of the objectives, modifying the controls as necessary based on new
    and evolving risks, and evaluating the linkage between the controls and the evolving
    risks and threats that threaten the achievement of the objectives. In many cases,
    the practitioner is able to obtain management''s documentation of its identification
    of risks and evaluation of the linkage of controls to those risks. In these instances,
    the practitioner may evaluate the completeness, accuracy, relevance, and timeliness
    of management''s identification of risks and the design of the controls in mitigating
    those risks. The practitioner may also contemplate whether the controls designed
    and implemented'
