  md: '# # Preface


    (Updated as of May 1, 2017)


    # ## About AICPA Guides


    This AICPA Guide, Reporting on an Entity''s Cybersecurity Risk Management Program
    and Controls, has been developed by the AICPA''s Assurance Services Executive
    Committee (ASEC) Cybersecurity Working Group, in conjunction with the Auditing
    Standards Board (ASB), to assist practitioners engaged to examine and report on
    an entity''s cybersecurity risk management program.


    This guide is recognized as an interpretive publication as described in AT-C section
    105, Concepts Common to All Attestation Engagements.1 Interpretive publications
    are recommendations on the application of Statements on Standards for Attestation
    Engagements (SSAEs) in specific circumstances, including engagements for entities
    in specialized industries. The SSAEs are also known as the attestation standards.


    Interpretive publications are issued under the authority of the ASB after all
    ASB members have been provided an opportunity to consider and comment on whether
    the proposed interpretive publication is consistent with the SSAEs. The members
    of the ASB have found the attestation guidance in this guide to be consistent
    with the SSAEs.


    Although interpretive publications are not attestation standards, AT-C section
    105 requires the practitioner to consider applicable interpretive publications
    in planning and performing an attestation engagement because interpretive publications
    are relevant to the proper application of the SSAEs in specific circumstances.
    If the practitioner does not apply the attestation guidance included in an applicable
    AICPA Guide, the practitioner should be prepared to explain how he or she complied
    with the SSAE provisions addressed by such attestation guidance.


    AICPA Guides may include certain content presented as "Supplement," "Appendix,"
    or "Exhibit." A supplement is a reproduction, in whole or in part, of authoritative
    guidance originally issued by a standard-setting body (including regulatory bodies)
    and is applicable to entities or engagements within the purview of that standard
    setter, independent of the authoritative status of the applicable AICPA Guide.
    Both appendices and exhibits are included for informational purposes and have
    no authoritative status.


    # ## Purpose and Applicability


    This guide provides guidance to practitioners engaged to examine and report on
    an entity''s cybersecurity risk management program. In April 2016, the ASB issued
    SSAE No. 18, Attestation Standards: Clarification and Recodification, (AICPA,
    Professional Standards),2 which includes AT-C section 105


    > 1 All AT-C sections can be found in AICPA Professional Standards.


    2 Statement on Standards for Attestation Engagements No. 18, Attestation Standards:
    Clarification and Recodification (AICPA, Professional Standards), is effective
    for practitioner''s reports dated on or after May 1, 2017.'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'and AT-C section 205, *Examination Engagements*. Those sections establish the
    requirements and application guidance for performing and reporting on an entity''s
    cybersecurity risk management program in the cybersecurity attestation examination
    described in this guide. In the attestation standards, a CPA performing an attestation
    engagement is ordinarily referred to as a *practitioner*.


    The attestation standards enable a practitioner to report on subject matter other
    than historical financial statements. In the case of the cybersecurity risk management
    examination described in this guide, the subject matter is *(a)* the description
    of the entity''s cybersecurity risk management program in accordance with the
    description criteria and *(b)* the effectiveness of controls within that program
    to achieve the entity''s cybersecurity objectives based on the control criteria.


    This guide also presents description criteria that may be used when preparing
    and evaluating the description of the entity''s cybersecurity risk management
    program and applicable trust services criteria (which can be used as control criteria).
    Such criteria were promulgated by the ASEC, which is designated by the Council
    of the AICPA under the AICPA Code of Professional Conduct to issue criteria. Therefore,
    such criteria are considered *suitable criteria* for use in the cybersecurity
    examination engagement described in this guide.


    Nothing in this guide is intended to prohibit a practitioner from performing a
    different examination engagement related to an entity''s cybersecurity efforts
    in accordance with the attestation standards. In that case, the practitioner may
    find much of the guidance in this guide helpful.


