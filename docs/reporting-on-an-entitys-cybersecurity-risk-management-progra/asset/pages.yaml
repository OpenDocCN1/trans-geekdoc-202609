- pgno: 131
  md: '# Appendix A


    # Information for Entity Management


    The purpose of this appendix is to assist management with understanding the cybersecurity
    risk management examination that can be performed by a CPA (practitioner) in connection
    with certain entity-prepared cybersecurity information. It is also intended to
    help management understand and discharge its responsibilities in connection with
    that engagement. This appendix is nonauthoritative and is included for informational
    purposes only.


    # Introduction


    In response to requests for information about the effectiveness of an entity’s
    cybersecurity risk management program, the AICPA has developed the *cybersecurity
    risk management examination*. In conjunction with that examination, the AICPA
    has also developed description criteria for use when preparing and evaluating
    the description of the entity’s cybersecurity risk management program and control
    criteria for use when evaluating the effectiveness of controls within the entity’s
    cybersecurity risk management program.


    # Overview of the AICPA Cybersecurity Risk Management Examination


    A CPA (referred to as a *practitioner* in an attestation engagement) performs
    and reports in the cybersecurity risk management examination in accordance with
    the Statements on Standards for Attestation Engagements, commonly known as the
    attestation standards. Under those standards, an attestation engagement is predicated
    on the concept that a party other than the practitioner (that is, the responsible
    party) makes an assertion about whether the subject matter is measured or evaluated
    in accordance with suitable criteria. In the cybersecurity risk management examination,
    management is ordinarily the responsible party. As the responsible party, management
    prepares the description and makes an assertion about the subject matters. Specifically,
    management’s assertion addresses whether the description was prepared in accordance
    with the description criteria and whether the controls within the program were
    effective to achieve the entity’s cybersecurity objectives based on the control
    criteria.


    The practitioner designs and performs procedures to obtain sufficient appropriate
    evidence about whether the description is presented in accordance with the description
    criteria and whether the controls were effective to achieve the entity’s cybersecurity
    objectives based on the control criteria.¹ The practitioner reports on that information
    in accordance with the attestation standards.


    > ¹ In certain circumstances, the practitioner may be engaged to report on the
    description and on the suitability of the design of the controls within the entity’s
    cybersecurity risk management program. Such an examination, which is referred
    to as a design-only examination, is discussed further'
