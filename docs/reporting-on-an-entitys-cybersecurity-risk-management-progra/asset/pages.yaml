  md: '# # Chapter 4

    ## Forming the Opinion and Preparing the Practitioner''s Report


    This chapter describes the practitioner''s responsibilities when forming his or
    her opinion and preparing the report in the cybersecurity risk management examination.
    This chapter focuses on the required elements of the practitioner''s report and
    the practitioner''s considerations when determining the type of opinion and other
    modifications to the report that might be necessary.


    # ## Responsibilities of the Practitioner


    4.01 In the cybersecurity risk management examination, the practitioner is responsible
    for directly expressing an opinion, in a written report, on the following matters:


    +   a. Whether the description of the entity''s cybersecurity risk management
    program is presented in accordance with the description criteria and

    b. Whether the controls within that program were effective to achieve the entity''s
    cybersecurity objectives based on the control criteria


    4.02 Because there are two distinct but complementary subject matters, the practitioner
    expresses an opinion on each in his or her report. Therefore, unless otherwise
    stated, a reference to the practitioner''s report in this chapter includes the
    practitioner''s responsibility to express an opinion on both the (1) description
    and (2) effectiveness of controls within the cybersecurity risk management program.


    4.03 In some circumstances, management may engage the practitioner to perform
    an examination on the design of the controls rather than on their effectiveness.
    In that case, the practitioner reports on whether the (1) description of the entity''s
    cybersecurity risk management program is presented in accordance with the description
    criteria and (2) controls implemented within that program were suitably designed1
    to achieve the entity''s cybersecurity objectives. Paragraph 4.14 discusses how
    the elements of the practitioner''s report in paragraph 4.12 would be tailored
    in that situation.


    # ## Forming the Practitioner''s Opinion


    4.04 When forming his or her opinion, paragraph .59 of AT-C section 205, Examination
    Engagements (AICPA, Professional Standards), requires the practitioner to evaluate


    1 As used here, the concept of the suitability of design relates to controls that
    have been designed and implemented within the entity''s cybersecurity risk management
    program.'
