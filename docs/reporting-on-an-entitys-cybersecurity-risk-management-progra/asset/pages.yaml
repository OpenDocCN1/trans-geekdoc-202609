  md: '3.59 The practitioner should obtain information from management regarding changes
    made to controls during the period covered by the practitioner''s report. In addition,
    during the performance of his or her procedures, the practitioner is alert for
    any changes that may not have been identified by management. If the practitioner
    believes the control changes could be significant to users of the report and could
    be relevant to meeting one or more of the control criteria, both the superseded
    controls and the updated controls would be included in the controls the practitioner
    would test.


    # Designing and Performing Procedures to Evaluate the Operating Effectiveness
    of Controls


    3.60 Paragraph .24 of AT-C section 205 requires the practitioner to design and
    perform tests of controls to obtain sufficient appropriate evidence about the
    operating effectiveness of controls. The practitioner is responsible for determining
    the nature (how the controls are tested), timing (when the controls are tested
    and the frequency of the testing), and extent (the number of testing procedures
    performed or size of the sample) of testing necessary to provide sufficient and
    appropriate evidence that the controls operated effectively throughout the specified
    period of time.³


    3.61 When determining the nature, timing, and extent of procedures to be performed
    to obtain sufficient appropriate evidence of the operating effectiveness of controls,
    the practitioner should consider the type of evidence that can be obtained from
    the performance of the control and how long that evidence will be available.


    3.62 If the practitioner determines that certain entity-level controls (control
    environment, communication and information, risk assessment, and monitoring controls)
    did not operate effectively, the practitioner may be able to adjust the nature,
    timing, and extent of procedures performed to obtain evidence about whether the
    entity''s controls were effective to achieve the entity''s cybersecurity objectives.
    In some situations, deficiencies in the operation of entity-level controls may
    lead the practitioner to conclude that controls are not operating effectively
    to achieve certain cybersecurity objectives. For example, consider an entity whose
    ability to retain knowledgeable employees has been impaired. The practitioner
    may decide to increase the testing of controls that prevent and detect security
    incidents (for example, inspection of security configurations and event management
    scan logs) to determine whether controls operated effectively to achieve the cybersecurity
    objectives based on the control criteria.


    # Nature of Procedures to Evaluate the Effectiveness of Controls


    3.63 When designing and performing tests of controls, the practitioner


    +   a. makes inquiries and performs other procedures to obtain evidence about
    the following:

    i. How the control was implemented (For example, was the control performed as
    designed?)

    ii. The level of consistency with which the control was applied throughout the
    period


