- pgno: 60
  md: '**2.108** Accordingly, when understanding the inherent risks that may affect
    the entity’s ability to achieve its cybersecurity objectives, the practitioner
    should consider whether the entity


    +   - maintains information in the IT environment that is critical to operating
    its business or maximizing its advantage in the marketplace.

    - is dependent on internet connectivity to support its business operations.

    - is a high-profile entity within the sector in which it operates.

    - relies extensively on complex industrial controls systems.

    - has an extensive number of third-party vendors or service providers with connections
    into its systems.

    - operates within a regulated sector.

    - operates in a sector that has a history of being a target of cyberattacks.

    - operates in a sector that has been the target of attacks resulting in breaches
    that have had a material effect on the related entity.

    - has a history of being subject to cyberattacks.


    Some practitioners find it useful to use terms such as high, medium, or low to
    describe an entity’s overall inherent risk assessment. However, use of such terminology
    is not required.


    **2.109** Once the practitioner has identified and assessed the risks, the practitioner
    should consider the processes and controls the entity has designed, implemented,
    and operated to mitigate those risks. As required by paragraph .18 of AT-C section
    205, the practitioner should consider the assessed risk of material misstatement
    as the basis for designing and performing further procedures whose nature, timing,
    and extent *(a)* are responsive to assessed risks of material misstatement and
    *(b)* allow the practitioner to obtain reasonable assurance about whether the
    description is presented in accordance with the description criteria and whether
    the controls were effective to achieve the entity’s cybersecurity objectives based
    on the control criteria.


    **2.110** Most of the practitioner’s procedures in forming an opinion on the description
    and on the effectiveness of controls consist of obtaining and evaluating evidence.
    Procedures to obtain evidence include inspection, observation, reperformance,
    and analytical procedures, often in some combination, in addition to inquiry.
    Chapter 3 provides additional guidance on performing examination procedures in
    the cybersecurity risk management examination.


    # # Understanding the Internal Audit Function


    **2.111** If the entity has an internal audit function, then as part of understanding
    the entity’s cybersecurity risk management program, the practitioner also obtains
    an understanding of


    +   a. the nature of the internal audit function’s responsibilities and how the
    internal audit function fits into the entity’s organizational structure and'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'b. the activities performed or to be performed by the internal audit function
    as it relates to the cybersecurity risk management program.


    **2.112** If the internal audit function does not perform activities related to
    the cybersecurity risk management program, or if the entity does not have a function
    that performs similar activities, the practitioner should consider the effect
    on his or her conclusions regarding the effectiveness of monitoring of controls.


    **2.113** An entity’s internal audit function performs assurance and consulting
    activities designed to evaluate and improve the effectiveness of the entity’s
    governance, risk management, and internal control processes. Activities similar
    to those performed by an internal audit function may be conducted by functions
    with other titles within an entity. Some or all of the activities of an internal
    audit function may also be outsourced to a third-party service provider. For example,
    an entity may engage a service provider to perform (*a*) penetration testing;
    (*b*) responsibilities of the internal audit function that the function itself
    does not have the competency or qualifications to perform (for example, performing
    the IT internal audit function); or (*c*) a one-time special assessment at the
    request of the board of directors. Neither the title of the function nor whether
    it is performed by the entity or a third-party service provider are sole determinants
    of whether the practitioner can use the work of internal auditors. Rather, it
    is the nature of the activities, the extent to which the internal audit function’s
    organizational status and relevant policies and procedures support the objectivity
    of the internal auditors, the competence of internal auditors, and the systematic
    and disciplined approach of the function that are relevant. References in this
    guide to the work of the internal audit function include relevant activities of
    other functions or third-party providers that have these characteristics.


    **2.114** Activities of the internal audit function that may be relevant to the
    cybersecurity risk management examination include those that provide information
    or evidence about whether the description is presented in accordance with the
    description criteria or whether controls within the cybersecurity risk management
    program were effective to achieve the entity’s cybersecurity objectives.


    **2.115** When obtaining an understanding of the internal audit function’s responsibilities
    and activities, the practitioner makes inquiries of internal audit personnel and
    reads information about the internal audit function included in the description
    of the entity’s cybersecurity risk management program. Ordinarily, the practitioner
    also requests and reads any relevant internal audit reports related to the period
    covered by the engagement. For example, reading the internal audit plan and reports
    issued by the internal audit function enables the practitioner to understand the
    nature of the internal audit function’s responsibilities and how the internal
    audit function fits into the entity’s organizational structure. Additionally,
    any findings in internal audit reports that relate to the presentation of the
    description of the entity’s cybersecurity risk management program or the effectiveness
    of controls within that program should be taken into consideration as part of
    the risk assessment and in determining the nature, timing, and extent of the practitioner’s
    planned procedures.'
