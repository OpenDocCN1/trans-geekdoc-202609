    \ are subject to greater threats or have vulnerabilities that are more likely\
    \ to be exploited. In such instances, control activities designed and implemented\
    \ to prevent or detect security events associated with these threats and vulnerabilities\
    \ may require greater precision and reliability in order to be suitably designed.\n\
    \n**3.52** The practitioner evaluates the suitability of the design of controls\
    \ by using evidence and other information obtained when\n\n+   - obtaining an\
    \ understanding of the cybersecurity risk management program and the controls\
    \ within that program;\n- determining whether the description of the entity's\
