    may select any description and control criteria that are suitable and available
    to intended users.


    **2.43** According to paragraph .A42 of AT-C section 105, criteria are suitable
    when they exhibit all of the following characteristics:


    +   *Relevance.* Criteria are relevant to the subject matter.


    +   *Objectivity.* Criteria are free from bias.


    +   *Measurability.* Criteria permit reasonably consistent measurements, qualitative
    or quantitative, of subject matter.


    +   *Completeness.* Criteria are complete when subject matters prepared in accordance
    with them do not omit relevant factors that could reasonably be expected to affect
    decisions of the report users made on the basis of that subject matter.


    The relative importance of each characteristic to a particular engagement is a
    matter of professional judgment.


