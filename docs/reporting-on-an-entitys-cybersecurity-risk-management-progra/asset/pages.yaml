  md: '# Incorporates Certain Requirements Contained in the Auditing Standards


    SSAE No. 18 incorporates a number of detailed requirements that are similar to
    those contained in the Statements on Auditing Standards (SASs), such as the requirement
    to obtain a written engagement letter and to request written representations.
    SSAE No. 18 includes these requirements based on the ASB’s belief that a service
    that results in a level of assurance similar to that obtained in an audit or review
    of historical financial statements should generally consist of similar requirements.


    # Separate Discussion of Review Engagements


    SSAE No. 18 separates the detailed procedural and reporting requirements for review
    engagements from their counterparts for examination engagements. The resulting
    guidance more clearly differentiates the two services.


    # Convergence


    It is the ASB’s general strategy to converge its standards with those of the International
    Auditing and Assurance Standards Board. Accordingly, the foundation for AT-C sections
    105, 205, and 210 is International Standard on Assurance Engagements (ISAE) 3000
    (Revised), Assurance Engagements Other Than Audits or Reviews of Historical Financial
    Information. Many of the paragraphs in SSAE No. 18 have been converged with the
    related paragraphs in ISAE 3000 (Revised), with certain changes made to reflect
    U.S. professional standards. Other content included in this statement is derived
    from the extant SSAEs. The ASB decided not to adopt certain provisions of ISAE
    3000 (Revised); for example, a practitioner is not permitted to issue an examination
    or review report if the practitioner has not obtained a written assertion from
    the responsible party, except when the engaging party is not the responsible party.
    In the ISAE, an assertion (or representation about the subject matter against
    the criteria) is not required in order for the practitioner to report.


    # Examinations of System and Organization Controls: SOC Suite of Services


    In 2017, the AICPA introduced the term *system and organization controls* (SOC)
    to refer to the suite of services practitioners may provide in connection with
    system-level controls of a service organization and system or entity-level controls
    of other organizations. Formerly, SOC referred to *service organization controls*.
    By redefining that acronym, the AICPA enables the introduction of new internal
    control examinations that may be performed (*a*) for other types of organizations,
    in addition to service organizations, and (*b*) on either system-level or entity-level
    controls of such organizations. The following are designations for four such examinations
    in the SOC suite of services and the source of the guidance for performing and
    reporting on each:


    +   • *SOC 1®—SOC for Service Organizations: ICFR*. The performance and reporting
    requirements for an examination of controls at a service organization that are
    likely to be relevant to user entities’ internal control over financial reporting
    are found in AT-C section 320, *Reporting on an Examination of Controls at a Service'
  merge: -1
