    # ## Acceptance and Continuance of Client Relationships and Specific Engagements


    **1.11** The purpose of the quality control element that addresses acceptance
    and continuance of client relationships and specific engagements is to establish
    criteria for deciding whether to accept or continue a client relationship and
    whether to perform a specific engagement for a client. A firm’s client acceptance
    and continuance policies represent a key element in mitigating litigation and
    business risk. Accordingly, it is important that a firm be aware that the integrity
    and reputation of a client’s management could reflect the reliability of the client’s
    accounting records and financial representations and, therefore, affect the firm’s
    reputation or involvement in litigation. A firm’s policies and procedures related
    to the acceptance and continuance of client relationships and specific engagements
    should provide the firm with reasonable assurance that it will undertake or continue
    relationships and engagements only where it


    +   -   is competent to perform the engagement and has the capabilities, including
    the time and resources, to do so;

    -   can comply with legal and relevant ethical requirements;

    -   has considered the client’s integrity and does not have information that would
    lead it to conclude that the client lacks integrity; and

    -   has reached an understanding with the client regarding the services to be
    performed.


    **1.12** This assurance should be obtained before accepting an engagement with
    a new client, when deciding whether to continue an existing engagement, and when
    considering acceptance of a new engagement with an existing client. Establishing
    and maintaining policies such as the following assist the firm in obtaining this
    assurance:


    > 2 *A foreign-associated firm* is a firm domiciled outside of the United States
    and its territories that is a member of, correspondent with, or similarly associated
    with an international firm or international association of firms.'
