- pgno: 152
  md: 'The following are examples of events that could affect the description of the
    entity’s cybersecurity risk management program or management’s assertion:


    +   *   After the period covered by the examination engagement, management discovered
    that, during the last quarter of that period, the IT security director provided
    all the programmers with access to the production data files, enabling them to
    modify data.


    +   *   After the period covered by the examination engagement, management discovered
    that a confidentiality breach occurred at the entity during the period covered
    by the practitioner’s report.


    If such events exist, management should inform the practitioner, who should apply
    appropriate procedures to obtain evidence regarding the events. After obtaining
    information about the event(s), the practitioner ordinarily will discuss the matter
    with management to determine whether the facts existed at the date of the report
    and, if so, whether persons who would attach importance to these facts are currently
    using, or likely to use, the cybersecurity risk management examination report
    (which includes management’s description and assertion and the practitioner’s
    report).


    Specific actions to be taken at that point depend on a number of factors, including
    the time elapsed since the date of the practitioner’s report and whether issuance
    of a subsequent report is imminent. Depending on the circumstances, the practitioner
    may determine that notification of persons currently using or likely to use the
    practitioner’s report is necessary. This may be the case, for example, when


    +   *   the cybersecurity risk management examination report is not to be relied
    upon because


    +       *   the description, management’s assertion, or the practitioner’s report
    needs revision or


    +       *   the practitioner is unable to determine whether revision is necessary
    and


    +       *   issuance of a subsequent practitioner’s report is not imminent.


    If the practitioner believes the event is of such a nature and significance that
    its disclosure is necessary to prevent users of the cybersecurity risk management
    examination report from being misled, the practitioner should determine whether
    information about the event is adequately disclosed in the description or management’s
    assertion.


    Sometimes, events discovered subsequent to the period covered by the examination
    engagement would likely have had no effect on either the presentation of the description
    in accordance with the description criteria or the effectiveness of controls,
    because the underlying situation did not exist until after the period covered
    by the cybersecurity risk management examination report. However, the matter may
    be sufficiently important to warrant disclosure by management in its description
    and, potentially, emphasis by the practitioner in the practitioner’s report. The
    following are examples of such events:


    +   *   The entity was acquired by another entity.


    +   *   The entity experienced a significant operating disruption.'
  merge: -1
