    engagement. Practitioners may find the description criteria presented in appendix
    C, the control criteria presented in appendix D, and the performance and reporting
    guidance in this guide helpful when conducting such engagements.


    # ## Professional Standards


    **1.51** This guide provides guidance for practitioners performing the cybersecurity
    risk management examination under the attestation standards. In addition to the
    performance and reporting guidance in the attestation standards, practitioners
    performing a cybersecurity risk management examination are required to comply
    with requirements of other professional standards, such as professional ethics
    and quality control standards. This section discusses each of the professional
    standards that apply to a cybersecurity risk management examination.


    # ## Attestation Standards


    **1.52** AT-C section 105 applies to all engagements in which a practitioner in
    the practice of public accounting is engaged to issue, or does issue, an attestation
    report on subject matter or an assertion about subject matter that is the responsibility
    of another party. AT-C section 105 contains performance, reporting, and application
    guidance that applies to all examination engagements under the attestation standards.
    Therefore, a practitioner engaged to perform a cybersecurity risk management examination
    should comply with all relevant requirements in both of those AT-C sections.'
