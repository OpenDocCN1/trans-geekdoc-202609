    or outputs.


    contractor. An individual, other than an employee, engaged to provide services
    to an entity in accordance with the terms of a contract.


    control. A policy or procedure that is part of internal control. Controls exist
    within each of the five COSO internal control components: control environment,
    risk assessment, control activities, information and communication, and monitoring.


    control activity. An action established through policies and procedures to enable
    management''s directives to mitigate risks to the achievement of objectives are
