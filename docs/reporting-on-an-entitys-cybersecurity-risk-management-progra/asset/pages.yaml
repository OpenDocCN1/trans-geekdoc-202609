    # Implementation Activities to Mitigate and Recover from Identified Security Incident.


    The plan activation process begins when one or more of the incident response and
    recovery plan owners are informed of a cybersecurity event for which incident
    response is imminent or underway. The plan owner will ensure details about the
    cybersecurity event are clearly understood and documented to the extent necessary
    to enable future communications. This includes the identification of security
    monitoring or other mitigating processes and control factors which may be present
    and reduce the overall impact of the identified security event. Should the plan
    owner decide to activate the plan, he or she will convene an emergency meeting
    of the CIRP leadership team (including the CIO, CISO, CRO, GC, VP of human resources,
    and CFO) to determine


    +   • immediate tasks,

    • departments and functions required to carry out the plan based on the cybersecurity
    event,

    • the initial communication plan and the individual assigned to execute the plan.


    Once agreement is made, the leadership team is responsible for notifying members
    of their teams and others, including external advisors (such as investor relations
    and external general counsel) about the plan activation, initial decisions made,
    and assigned actions.


    Once activated, XYZ considers the current cybersecurity event and its effects
    on systems and business operations. The Company refers to the appropriate sections
    of the BC and DR plans, as well as the relevant and applicable data backup logs,
    to identify the following:


    +   • Where the IT systems and IT infrastructure affected by the cybersecurity
    event reside within the asset prioritization hierarchy

    • Where the business operations affected by the cybersecurity incident or event
    reside within the operations prioritization hierarchy

    • The planned alternative IT systems (such as the failover or load-balanced servers
    and network devices) and business processing activities (for instance, manual
    sales order forms) for the effected components of the environment

    • The time prior to the cybersecurity incident or event from when the Company
    will be able to respond to and recover from (recovery point objective [RPO]) for
    the affected IT systems and IT infrastructure'
