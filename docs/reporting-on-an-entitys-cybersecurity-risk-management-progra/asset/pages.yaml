    3.54 After performing the procedures and considering the guidance in paragraphs
    3.38–3.42, the practitioner should consider whether the controls have the ability,
    as designed, to provide reasonable assurance of achieving the entity''s cybersecurity
    objectives based on the control criteria. Further, the practitioner should consider
    whether the appropriate controls are in fact in place given the circumstances.


    # ### Identifying and Evaluating Deficiencies in the Suitability of Control Design


    3.55 In determining whether there is a deficiency in the design of a control,
    the practitioner determines whether


    +   * a control necessary to meet the one or more control criteria is missing
    or


    +   * an existing control is not properly designed, meaning that, even if the
    control operates as designed, one or more control criteria would not be met.


    3.56 When evaluating the suitability of the design of controls, the practitioner
    determines whether the controls are appropriate and whether they have been implemented.
    If a necessary control does not exist, this would be considered a design deficiency.
    If deficiencies exist in the design of a control, the practitioner often would
    not test the operating effectiveness of that control. Rather, the practitioner
    generally would consider the design of other controls that address the same risks.


    # ### Obtaining Evidence About the Operating Effectiveness of Controls to Achieve
    the Entity''s Cybersecurity Objectives


    3.57 Controls are suitably designed if they have the potential to achieve the
    entity''s cybersecurity objectives based on the control criteria. Suitably designed
    controls are operated as designed by persons who have the necessary authority
    and competence to perform the control. Controls that operated effectively provide
    reasonable assurance of achieving the entity''s cybersecurity objectives based
    on the control criteria.


    3.58 A control may be designed to address an identified risk on its own or may
    function in combination with other controls. For example, when a supervisor, prior
    to approving user credentials, is reviewing the list of authorized users to determine
    whether a new user has been authorized by the entity to access one or more of
    its systems, the review control (reviewing and approving the user''s credentials)
    may be complemented by an application control requiring that the supervisor acknowledge
    his or her review and approval by entering a sign-off in the system. In this instance,
    both the manual and automated controls would be tested by the practitioner because
    the two controls are dependent on each other.'
