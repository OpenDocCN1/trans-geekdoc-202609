- pgno: 57
  md: '**2.95** In the cybersecurity risk management examination, materiality relates
    to the likelihood and magnitude of the risks that threaten the achievement of
    the entity’s cybersecurity objectives and whether the processes and controls the
    entity has designed, implemented, and operated were effective in mitigating those
    risks to an acceptable level.


    **2.96** Accordingly, the practitioner should consider the nature of threats and
    the likelihood and magnitude of the risks arising from those threats to specific
    information and other assets. In addition, the practitioner should consider the
    technical environment and whether the realization of threats or exploitation of
    vulnerabilities related to specific information assets, which appear inconsequential,
    could expose (either directly or indirectly) information assets and thereby result
    in failure to achieve the entity’s cybersecurity objectives. For example, if access
    to the information assets of a financially immaterial business unit could provide
    access to the entity’s strategic business systems, and the practitioner determines
    there is a high likelihood that such a vulnerability might be exploited, the practitioner
    is likely to consider access to the information assets of the financially immaterial
    business unit material in the cybersecurity risk management examination.


    **2.97** The practitioner’s consideration of materiality is a matter of professional
    judgment and is affected by the practitioner’s perception of the common information
    needs of report users as a group. In this context, it is reasonable for the practitioner
    to assume that report users


    +   *   have a reasonable knowledge of cybersecurity, including the nature of
    cybersecurity risks and vulnerabilities and the processes and controls typically
    used to manage such risks, and are willing to study the topic with reasonable
    diligence.


    +   *   understand that the description of an entity’s cybersecurity risk management
    program and the controls within that program are measured or evaluated and examined
    to appropriate levels of materiality and understand any materiality concepts included
    in the description and control criteria.


    +   *   understand any inherent uncertainties involved in describing a cybersecurity
    risk management program and inherent limitations in the design and operation of
    controls. (To make sure that report users understand such uncertainties, both
    management’s assertion and the practitioner’s report disclose inherent limitations
    of a cybersecurity risk management engagement.)


    +   *   make reasonable decisions on the basis of the description and the effectiveness
    of controls, taken as a whole.


    **2.98** Unless the engagement has been designed to meet the particular information
    needs of specific users of the cybersecurity risk management examination report
    (and the report is restricted to those specific users), the possible effect of
    misstatements regarding the description of the entity’s cybersecurity risk management
    program or the effectiveness of controls on specific users, whose information
    needs may vary widely, is not ordinarily considered.


    **2.99** If the practitioner becomes aware, during the conduct of the engagement,
    of information that would have caused him or her to have initially determined
    a different materiality, paragraph .17 of AT-C section 205 requires the practitioner
    to reconsider materiality. Chapter 3 of this guide discusses'
