    # ## Determining Whether the Subject Matter is Appropriate for the Cybersecurity
    Risk Management Examination


    2.15 Determining whether the subject matter is appropriate in the specific cybersecurity
    risk management examination involves consideration of the following:


    +   - When management has requested that the subject matter of the engagement
    be less than the entity-wide program, whether information about only a portion
    of the entity''s cybersecurity risk management program is likely to meet the needs
    of report users

    - When management has requested that, in addition to the description, the subject
    matter of the engagement only be the suitability of the design of controls implemented
    by the entity, whether information about only the suitability of design of controls
    within the entity''s cybersecurity risk management program is likely to meet the
    needs of report users

    - Whether management is likely to have a reasonable basis for its assertion


    2.16 As previously stated, there are two distinct but complementary subject matters
    in the cybersecurity risk management examination: (1) the description of the entity''s
    cybersecurity risk management program and (2) the effectiveness of the controls
    within that program in achieving the entity''s cybersecurity objectives. When
    determining whether the subject matters of the engagement are appropriate in the
    particular circumstances, the practitioner may consider factors such as whether


    +   - users of the cybersecurity risk management examination report are likely
    to understand other factors related to the engagement, such as the nature of the
    engagement.

    - the description criteria used to evaluate the presentation of the description
    can be understood by the users.

    - the effect of third parties (customers, vendors, business partners, and others)
