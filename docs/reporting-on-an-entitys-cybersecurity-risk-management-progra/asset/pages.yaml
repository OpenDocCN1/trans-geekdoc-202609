  md: '# # Establishing an Overall Examination Strategy and Planning the Examination


    2.86 When planning the cybersecurity risk management examination, the engagement
    partner and other key members of the engagement team develop an overall strategy
    for the scope, timing, and conduct of the engagement and an engagement plan, consisting
    of a detailed approach for the nature, timing, and extent of procedures to be
    performed. Adequate planning helps the practitioner devote appropriate attention
    to important areas of the engagement, identify potential problems on a timely
    basis, and properly organize and manage the engagement to make sure it is performed
    in an effective and efficient manner. Adequate planning also assists the practitioner
    in properly assigning work to engagement team members and facilitates the direction,
    supervision, and review of their work. Furthermore, if the work of internal auditors,
    other practitioners, or specialists is used in the engagement, proper planning
    helps the practitioner coordinate their work.


    2.87 Paragraph .11 of AT-C section 205 requires a practitioner to establish an
    overall engagement strategy that sets the scope, timing, and direction of the
    engagement and guides in the development of the engagement plan. In establishing
    the overall engagement strategy, the practitioner does the following:


    +   * a. Obtains an understanding of the entity''s business, cybersecurity objectives,
    and cybersecurity risk management program that define the engagement

    * b. Ascertains the expected timing and nature of required communications

    * c. Should consider the factors that, in the practitioner''s professional judgment,
    are significant in directing the engagement team''s efforts

    * d. Should consider the results of preliminary engagement activities, such as
    client acceptance, and, when applicable, whether knowledge gained on other engagements
    performed by the engagement partner for the entity is relevant

    * e. Plans the engagement process, including possible sources of evidence and
    choices among alternative measurement or evaluation methods

    * f. Obtains an understanding of the influences and pressures on management and
    other appropriate party(ies) within the entity

    * g. Should consider intended users of the cybersecurity risk management examination
    report and their information needs

    * h. Should consider the risk of fraud relevant to the engagement

    * i. Ascertains the nature, timing, and extent of resources necessary to perform
    the engagement

    * j. Assesses the effect on the engagement of using the work of an internal audit
    function or obtaining direct assistance from internal audit function personnel


    2.88 The nature and extent of planning activities will vary depending on the practitioner''s
    previous experience with the entity and on whether security events were identified
    in prior periods. Planning activities also will vary based on the entity''s organizational
    characteristics, including the following:'
