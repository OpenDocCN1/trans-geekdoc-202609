    to detect and address unknown threats. An example of this is a data loss prevention
    (DLP) control that monitors and restricts outbound information, regardless of
    what caused the attempt to send the information externally.


    +   *Threats related to prior periods*. An identified threat or vulnerability
    in a prior period may affect the assessment of the entity''s cybersecurity risk
    management program or the effectiveness of controls for the current period.


    +   *Effect of deviations*. Identified deviations may affect the entity''s ability
    to mitigate threats or vulnerabilities to information and other assets and achieve
    the related cybersecurity objectives. For example, the practitioner may question
    management''s assertion that a control is effective when considering the nature
    and extent of observed deviations in the operation of the control.


    +   *Intentional acts*. A deficiency or deviation may be the result of an unintentional
    act or may be intentional. An intentional act perpetrated by management or senior
    management would be particularly relevant to materiality considerations.


    +   *Relationship to other parties*. A deficiency in controls may relate to the
    relationship between the entity and other parties. For example, a deficiency in
    controls at the entity that could also result in a deficiency in controls at a
    customer is more likely to be considered material.


    **3.41** Quantitative factors to be considered in a cybersecurity risk management
    examination relate to matters such as the tolerable rate of deviation and the
    observed rate of deviation. (In this guide, the tolerable rate of deviation is
    the maximum rate of deviation in the operation of the control that the practitioner
    is willing to accept without modifying the opinion relating to one or more of
    the control criteria.) Quantitative factors are less likely to apply when evaluating
    the design of controls but would be considered when evaluating the operating effectiveness
    of the controls. Note, however, that the practitioner should carefully consider
    the effect of identified deviations, either individually or in combination with
    other identified deviations, on the controls'' ability to mitigate assessed risks
    because such deviations could result in the failure to achieve one or more of
    the entity''s cybersecurity objectives.


