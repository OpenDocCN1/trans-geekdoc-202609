    data outside of the Company or on noncompany-owned devices. The DLP solution is
    configured to encrypt external storage devices and prevent the saving of sensitive
    data to removable media. Hard drives of all servers, workstations, and laptops
    are encrypted. XYZ Manufacturing and its vendors utilize transport layer security
    for encryption of transmissions across the Internet to XYZ web servers and the
    email system. A VPN requiring multifactor authentication is used for all remote
    access to XYZ’s internal network, ensuring that data is encrypted in transit when
    sent across the Internet from a Company computer system. Site-to-site VPNs are
    also utilized with certain XYZ vendors to provide encrypted channels for communication
    between locations.


    Data Destruction. Data that exceeds its retention period is removed from systems
    and all backup media. Data that is labeled as confidential is erased using secure
    deletion techniques approved by the U.S. government (multi-pass overwrite). All
    computer hard drives are required to be securely deleted before disposal, and
    a certificate of destruction is obtained from the third-party organization that
    disposes of all computer equipment for XYZ.


    Data Backup. Nightly incremental backups of all production servers and daily backups
    of production databases are conducted. Every month end, the Company is required
    to perform a full backup of the production servers. Backup tapes are encrypted
    and sent to a third-party vendor for storage. An automated backup system is implemented
    to monitor the completion of scheduled backups. When a backup job is not completed
    successfully, operations personnel create an incident ticket and assign personnel
    to resolve the failure.


    Virus Detection and Prevention. Antivirus software is required to be installed
    on all XYZ servers, desktops, laptops, and email infrastructure and is centrally
    managed to ensure timely delivery of signature updates. The antivirus software
    settings are preconfigured for automatic updates and locked to prevent any user
    tampering or disabling. Email filtering software is in place to restrict and reject
    emails that contain certain malicious file types, including executable files.
    The Company’s antivirus administrator is required to perform a quarterly inventory
    reconciliation against a system inventory list.


    Firewalls and Perimeter Security. XYZ Manufacturing deploys enterprise firewalls
    at the perimeter of the network and in other strategic locations throughout the
    network in an active failover configuration. Only a minimal number of ports and
    services are allowed into the XYZ environment. All firewalls are managed using
    a centralized console, and XYZ installs monitoring software on the firewalls to
    provide alerts when changes occur at the administrative level. Firewall rulesets
    are reviewed twice a year to ensure that they are appropriately configured.


    Secure System Configuration. Configuration specifications are installed on all
    systems before they are implemented into production. Monthly vulnerability and
    configuration scans to validate that all systems remain configured in accordance
    with XYZ’s security hardening standards are performed. When updates'
