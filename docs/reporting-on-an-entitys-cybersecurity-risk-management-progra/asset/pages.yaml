    **2.35** Management''s basis for its assertion usually relies heavily on monitoring
    of controls. Such monitoring activities typically include ongoing activities,
    separate evaluations, or a combination of the two. Ongoing monitoring activities
    are ordinarily built into the normal recurring activities of an entity''s cybersecurity
    risk management program and include activities such as the regular review by management
    of key system reports and participation in incident management processes. In addition,
    monitoring activities may include the periodic evaluations of controls through
    (a) assessments performed by the internal audit function or by knowledgeable personnel
    who are independent of the function being evaluated, (b) performance of penetration
    testing, and (c) review of reports of independent certifications made against
    established specifications (for example, International Standardization Organization
    and International Electrotechnical Commission [ISO/IEC] Standard 27001 and HITRUST
    CSF). When such monitoring activities do not exist or they appear to be inadequate,
    it may be difficult for management to have a reasonable basis for its assertion.


    **2.36** Management generally documents the assessment in a variety of ways, such
    as through the use of policy manuals, narratives, flowcharts, decision tables,
    procedural write-ups, or questionnaires. The nature and extent of documentation
    usually varies, depending on the size and complexity of the entity and its monitoring
    activities.


    # Consideration of Third Parties


    **2.37** Monitoring activities are of increased importance if the entity has identified
    cybersecurity threats and vulnerabilities arising from interactions with third
    parties. As used in this guide, third parties include customers, vendors, business
    partners, and others who have access to one or more of the entity''s information
    systems, store confidential entity information on their systems, or otherwise
    transmit information back and forth between, or on behalf of, the entity.


    **2.38** Therefore, it is important for management to assess the cybersecurity
    risks arising from interactions with third parties, particularly when third parties
    operate controls necessary to achieve the entity''s cybersecurity objectives.


    **2.39** If management determines the risks associated with third parties are
    likely to be material to the achievement of the entity''s cybersecurity objectives
    (for example, due to the nature of access the third party has to the entity''s
    systems and information assets, or because of the controls the third party operates
    on behalf of the entity), monitoring controls at the entity are needed to allow
    management to determine whether the processes and controls performed by the third
    parties effectively address the identified risks. Such monitoring controls may
    include, but are not limited to, a combination of the following:


    +   - Conducting assessments of whether third-party contractual agreements are
    in accordance with the entity''s policies

    - Conducting periodic discussions with third parties and their employees

    - Inspecting completed third-party security questionnaires and submitted documents
    to support their responses'
