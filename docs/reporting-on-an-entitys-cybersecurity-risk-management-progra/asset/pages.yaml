    Addresses Only a Portion of the Entity''s Cybersecurity Risk Management Program


    **3.27** As discussed in chapter 1, "Introduction and Background," the cybersecurity
    risk management examination usually addresses an entity-wide cybersecurity risk
    management program. However, there may be circumstances in which management engages
    the practitioner to examine and report on only a portion of that program. In other
    words, the cybersecurity risk management examination may be limited to any of
    the following:


    +   One or more specific business units or segments of an entity, when those units
    or segments operate under an entity-wide cybersecurity risk management program


    +   One or more specific business units or segments of an entity, when those units
    or segments operate under an independent cybersecurity risk management program


    +   One or more specific sets of systems or particular sets of information used
    by the entity


    **3.28** In those situations, the description is tailored to disclose only information
    about the portion of the cybersecurity risk management program (that is, the particular
    business unit, segment, or type of information) within the scope of the engagement.
    Likewise, when evaluating whether the description is presented in accordance with
    the description criteria, consideration is given to whether the description addresses
    all relevant aspects of the portion of the cybersecurity risk management program
    within the scope of the engagement. For example, if the engagement addresses only
    one specific business unit, and that unit''s cybersecurity risk management program
    relies on aspects of the entity-wide program, the description would also include
    disclosure of those aspects of the entity-wide program relevant to that business
    unit.


