    # # Cybersecurity Risk Management Examination Addresses Only the Suitability of
    the Design of Controls Within the Entity’s Cybersecurity Risk Management Program
    (Design-Only Examination)


    In some circumstances, management may not be prepared to make an assertion about
    whether the controls within the entity’s cybersecurity risk management program
    were effective to achieve the entity’s cybersecurity objectives. In such situations,
    rather than making an assertion about whether controls were effective to achieve
    the entity’s cybersecurity objectives, management may make an assertion about
    the suitability of the design of controls within the program.


    Such an examination, referred to as a *design-only cybersecurity risk management
    examination* (design-only examination), would include the following two subject
    matters: (1) the description of the entity’s cybersecurity risk management program
    and (2) the suitably of design of the controls implemented within that program
    to achieve the entity’s cybersecurity objectives. Accordingly, a design-only examination
    would not provide report users with sufficient information to assess the effectiveness
    of controls within that program. However, the resulting report (design-only report)
    may be useful to report users who want to obtain an understanding of the entity’s
    cybersecurity risk management program and an overview of the security policies
    and processes implemented within that program.


    If the practitioner is concerned that intended users are likely to misunderstand
    the practitioner’s opinion on the description and design only, the practitioner
    may restrict the use of a design-only report to board members, management, others
    within the organization, and specific third parties (specified parties) who are
    likely to understand it.


    # # Selecting the Description Criteria and the Control Criteria to Be Used in
    the Cybersecurity Risk Management Examination


    As previously discussed, two distinct sets of criteria are used in the cybersecurity
    risk management examination: description criteria and control criteria. Management
    is responsible for selecting both sets of criteria to be used.


    Management may select any description and control criteria, as long as they are
    suitable and available to intended users. According to the attestation standards,
    criteria are suitable when they exhibit all of the following characteristics:


    +   - *Relevance*. Criteria are relevant to the subject matter.

    - *Objectivity*. Criteria are free from bias.

    - *Measurability*. Criteria permit reasonably consistent measurements, qualitative
    or quantitative, of subject matter.

    - *Completeness*. Criteria are complete when subject matters prepared in accordance
    with them do not omit relevant factors that could reasonably be expected to affect
    decisions of the report users made on the basis of that subject matter.'
