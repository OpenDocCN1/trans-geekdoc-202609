- pgno: 258
  md: '# # Documentation of Quality Control Policies and Procedures


    **1.19** The firm should document each element of its system of quality control.
    The extent of the documentation will depend on the size, structure, and nature
    of the firm''s practice. Documentation may be as simple as a checklist of the
    firm''s policies and procedures or as extensive as practice manuals.


    # # Applying the Quality Control Standards to Four Hypothetical Firms


    **1.20** Subsequent chapters in this practice aid present four different hypothetical
    firms and the quality control policies and procedures each firm implements to
    address each of the quality control elements. Following is a description of those
    firms and their characteristics:


    +   * Multioffice CPA Firm has 10 offices in 3 states and is centrally managed.
    It has approximately 15 partners and 100 professionals. Its accounting and auditing
    practice has a concentration of financial institution clients for which it performs
    audit and attest services. Multioffice CPA Firm has no issuer clients. (Chapter
    2, "System of Quality Control for a CPA Firm''s Accounting and Auditing Practice—Firm
    With Multiple Offices")

    * Singleoffice CPA Firm has 1 office, 3 partners, and 10 professionals. Its accounting
    and auditing practice has a concentration of employee benefit plan audits. Singleoffice
    CPA Firm has no issuer clients. (Chapter 3, "System of Quality Control for a CPA
    Firm''s Accounting and Auditing Practice—Firm With a Single Office")

    * Sole Practitioner, CPA, is a sole owner who has no professional staff and occasionally
    hires per diem professionals. Her accounting practice consists only of engagements
    subject to Statements on Standards for Accounting and Review Services. (Chapter
    4, "System of Quality Control for a CPA Firm''s Accounting and Auditing Practice—Sole
    Practitioner") (Note: Sole practitioners who perform audit and attest engagements
    should refer to chapter 3)

    * Closely Aligned CPA Firm and Non-CPA-Owned Entity are organized in an *alternative
    practice structure*, which is a nontraditional structure in the practice of public
    accounting consisting of an attest and a nonattest portion of the practice. The
    attest portion is conducted through a firm, Closely Aligned CPA Firm, owned and
    controlled by CPAs. The nonattest portion is conducted through a separate entity,
    Non-CPA-owned Entity, owned and controlled by individuals who are not CPAs. (Chapter
    5, "System of Quality Control for an Alternative Practice Structure")


    **1.21** The policies and procedures described in each chapter are those that
    a firm of a similar size and type may consider establishing and maintaining. The
    policies and procedures used by an actual firm need not necessarily include nor
    be limited to all those used by the illustrative firms.'
