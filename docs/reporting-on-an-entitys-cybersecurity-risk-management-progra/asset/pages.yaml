  md: 'to existing standards are made, the changes are implemented on production systems.


    *Intrusion Prevention.* A threat intelligence database is regularly updated. Packets
    identified by the threat intelligence database that meet a certain risk threshold
    or exhibit certain characteristics are automatically dropped and prevented from
    entering the XYZ network.


    *Change Management.* A change approval board (CAB) that consists of representation
    from all IT departments within XYZ is in place. On a weekly basis, the CAB meets
    to review upcoming system and application changes, which are requested via the
    Company''s online ticketing software. All changes are required to have a documented
    back-out plan. All changes are required to have a documented test plan. All members
    of the CAB approve a change before it can be implemented. In the weekly CAB meeting,
    the previous week''s changes are reviewed. A root cause analysis report is completed
    for any changes that did not go as planned before they can be reconsidered.


    *Application Changes.* Change requestors submit a change request within the Company''s
    ticketing system. An application analyst reviews the change request and develop
    a project change budget estimate. On a monthly basis, application change requests
    and associated budgets are reviewed and categorized by IT and the business owners
    and ranked according to priority. Development occurs in a development environment
    that is separate from the production environment, using test data. Once development
    is completed, user acceptance testing takes place. Once user acceptance testing
    is completed, the business owner who sponsored the change and the applicable application
    analyst are required to approve the change within the ticket. The IT operations
    team migrates changes into production after they have been approved by the CAB.
    Emergency changes are required to be documented and logged in the ticketing system
    after changes are completed, and the CAB conducts an after-action review to approve
    the changes retroactively.


    *Patch Management.* When new patches are released, they are reviewed by a group
    of IT personnel, including a representative from the information security team.
    The team assigns a priority level to each patch. Patches that are assigned a rating
    of "critical" are applied to all affected systems within 7 days. Patches that
    are assigned a rating of "high" are applied to all affected systems within 30
    days. Patches that are assigned a rating of "medium" are applied within 60 days.
    All other patches are applied in regular system updates that typically occur quarterly.
    Once assigned a patch criticality rating, a patch is assigned to the appropriate
    IT system administrator for evaluation and testing in the XYZ test lab. When testing
    is completed, a change ticket is entered in the ticketing system, and the patch
    is reviewed and approved by the CAB. Monthly, the information security team is
    required to conduct vulnerability scanning of all systems to ensure that patches
    are properly in place. Any missing patches are immediately ticketed and a resolution
    is required within 5 business days.


