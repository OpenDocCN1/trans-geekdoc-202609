    recover from identified security incidents; consider the following:


    +   - The deployment of tools and programs, the implementation of monitoring processes
    and procedures, or operation of other measures to identify anomalies, analyzing
    anomalies to identify security events, and communicating identified security events
    to appropriate parties

    - The deployment of procedures to measure the effectiveness of activities planned
    in the event of a disruption to operations that requires the recovery of processing
    at alternate locations and the updating of plans based on the result of those
    procedures


    (continued)'
