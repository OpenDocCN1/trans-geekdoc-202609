    # ## Description of the Entity''s Cybersecurity Risk Management Program


    The description of the entity''s cybersecurity risk management program is designed
    to provide report users with information about the environment in which the entity
    operates and the process used to develop its cybersecurity objectives, identify
    its information assets and the threats against them, and design, implement, and
    operate controls to mitigate the risks of such threats. The description is also
    intended to provide report users with information about the processes within the
    cybersecurity risk management program that have been designed and implemented
    to respond to those risks. As such, the description is intended to enable users
    to understand the cybersecurity risk management program and the conclusions expressed
    by management in its assertion and by the practitioner in his or her report. It
    does not, however, provide a detailed narrative of the entity''s controls nor
    a listing of tests of controls performed by the practitioner and the results thereof.


    In the cybersecurity risk management examination, an *entity''s cybersecurity
    risk management program* is defined as


