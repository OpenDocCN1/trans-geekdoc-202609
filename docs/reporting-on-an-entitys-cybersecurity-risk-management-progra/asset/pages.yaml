    **The following points of focus highlight important characteristics relating to
    this criterion:**


    **Points of focus specified in the COSO framework:**


    +   -   *Considers a Mix of Ongoing and Separate Evaluations*—Management includes
    a balance of ongoing and separate evaluations.


    +   -   *Considers Rate of Change*—Management considers the rate of change in
    business and business processes when selecting and developing ongoing and separate
    evaluations.


    +   -   *Establishes Baseline Understanding*—The design and current state of an
    internal control system are used to establish a baseline for ongoing and separate
    evaluations.


    +   -   *Uses Knowledgeable Personnel*—Evaluators performing ongoing and separate
    evaluations have sufficient knowledge to understand what is being evaluated.


    +   -   *Integrates With Business Processes*—Ongoing evaluations are built into
    the business processes and adjust to changing conditions.


    +   -   *Adjusts Scope and Frequency*—Management varies the scope and frequency
    of separate evaluations depending on risk.


    +   -   *Objectively Evaluates*—Separate evaluations are performed periodically
    to provide objective feedback.


    **Additional point of focus specifically related to all engagements using the
    trust services criteria:**


    +   -   *Considers Different Types of Ongoing and Separate Evaluations*—Management
    uses a variety of different types of ongoing and separate evaluations, including
    penetration testing, independent certification made against established specifications
    (for example, ISO certifications), and internal audit assessments.


    | **CC4.2** | **COSO Principle 17: The entity evaluates and communicates internal
    control deficiencies in a timely manner to those parties responsible for taking
    corrective action, including senior management and the board of directors, as
    appropriate.** |

