  md: '# Considering Practitioner Independence


    2.64 If management refuses to provide a written assertion, paragraph .82 of AT-C
    section 205 requires the practitioner to withdraw from the engagement when withdrawal
    is possible under applicable laws and regulations.7 Consequently, it is important
    to obtain management''s agreement to provide the written assertion prior to engagement
    acceptance. If law or regulation does not allow the practitioner to withdraw,
    the practitioner should disclaim an opinion on the description and the effectiveness
    of controls.


    2.65 Management is also required to provide the practitioner with written representations
    at the conclusion of the engagement. It may be useful for the practitioner to
    provide management with an example of the expected representations prior to engagement
    acceptance.


    2.66 Paragraph .24 of AT-C section 105 and paragraph .06 of AT-C section 205 state
    that a practitioner must be independent when performing an attestation engagement
    such as the cybersecurity risk management examination. The only exception to this
    requirement is when the practitioner is required by law or regulation to accept
    the engagement and report on the subject matter. In that case, practitioner is
    required to disclaim an opinion on the description and the effectiveness of controls
    and to specifically state in the report that the practitioner is not independent.


    2.67 The "Independence Rule" (ET sec. 1.200.001) 8, 9 of the AICPA Code of Professional
    Conduct establishes independence requirements for attestation engagements. The
    "Independence Standards for Engagements Performed in Accordance with Statements
    on Standards for Attestation Engagements" subtopic (ET sec. 1.297) of the "Independence
    Rule" establishes special independence requirements for a practitioner who provides
    services under the attestation standards. In addition, the "Conceptual Framework
    Approach" subtopic (ET sec. 1.210) of the "Independence Rule" discusses threats
    to independence not specifically detailed elsewhere. The code specifies that,
    in some circumstances, no safeguards can reduce an independence threat to an acceptable
    level. For


    > 7 If management is not the engaging party, paragraph .10 of AT-C section 205
    provides an exception to the requirement that the practitioner withdraw from the
    engagement when management refuses to provide a written assertion. Because a written
    assertion is one of three key elements of the cybersecurity risk management examination
    report, that exception does not apply in the examination described in this guide.
    Therefore, management''s failure to provide a written assertion would prevent
    the practitioner from performing the cybersecurity risk management examination.


    > 8 All ET sections can be found in AICPA Professional Standards.


    > 9 The "Independence Rule" (ET sec. 1.200.001) and its interpretations apply
    to all attest engagements. However, when performing engagements in which independence
    is required in accordance with the attestation standards, the covered member needs
    to be independent with respect to the responsible part(yies), as defined in those
    standards. If the individual or entity that engages the covered member is not
    the responsible party, the covered member need not be independent of that individual
    or entity. However, the covered member should consider the "Conflicts of Interest"
    interpretation (ET sec. 1.110.010) of the "Integrity and Objectivity Rule" with
    regard to any relationships that may exist with the individual or entity that
    engages the covered member to perform these services. When providing nonattest
    services that would otherwise impair independence under the interpretations of
    the "Nonattest Services" subtopic (ET sec. 1.295) of the "Independence Rule,"
    threats would be at an acceptable level and independence would not be impaired
    if the following safeguards are met:


    +   * Nonattest services do not relate to the specific subject matter of the attestation
    engagement.

    * The "General Requirements for Performing Nonattest Services" interpretation
    (ET sec. 1.295.040) of the "Independence Rule" are met when providing the nonattest
    service.'
