    # Consideration of Third Parties


    Monitoring activities are of increased importance if the entity has identified
    cybersecurity threats and vulnerabilities arising from interactions with third
    parties. As used in this document, the term third parties includes customers,
    vendors, business partners, and other who have access to one or more of the entity’s
    information systems, store confidential entity information on their systems, or
    otherwise transmit information back and forth between themselves and the entity
    or on behalf of the entity.


    Therefore, it is important for management to assess the cybersecurity risks arising
    from interactions with third parties, particularly when third parties operate
    controls necessary to achieve the entity’s cybersecurity objectives.'
