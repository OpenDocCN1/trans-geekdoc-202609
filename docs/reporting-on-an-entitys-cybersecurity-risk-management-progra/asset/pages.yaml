- pgno: 257
  md: 'the monitoring process and recommendations for appropriate re-medial action.


    +   • Communicate the results of the monitoring of its quality control system
    process to relevant firm personnel at least annually.


    +   • Establish procedures designed to provide the firm with reasonable assurance
    that it deals appropriately with the following:


    +   — Complaints and allegations that the work performed by the firm fails to
    comply with professional standards and regulatory and legal requirements.


    +   — Allegations of noncompliance with the firm''s system of quality control.


    +   — Deficiencies in the design or operation of the firm''s quality control policies
    and procedures, or noncompliance with the firm''s system of quality control by
    an individual or individuals, as identified during the investigations into complaints
    and allegations.


    This includes establishing clearly defined channels for firm personnel to raise
    any concerns in a manner that enables them to come forward without fear of reprisal
    and documenting complaints and allegations and the responses to them.


    +   • Require appropriate documentation to provide evidence of the operation of
    each element of its system of quality control. The form and content of documentation
    evidencing the operation of each of the elements of the system of quality control
    is a matter of judgment and depends on a number of factors, including the following,
    for example:


    +   — The size of the firm and the number of offices.


    +   — The nature and complexity of the firm''s practice and organization.


    +   • Require retention of documentation providing evidence of the operation of
    the system of quality control for a period of time sufficient to permit those
    performing monitoring procedures and peer review to evaluate the firm''s compliance
    with its system of quality control, or for a longer period if required by law
    or regulation.


    1.18 Some of the monitoring procedures discussed in the previous list may be accomplished
    through the performance of the following:


    +   • Engagement quality control review


    +   • Review of engagement documentation, reports, and clients'' financial statements
    for selected engagements after the report release date


    +   • Inspection⁴ procedures


    ⁴ Inspection is a retrospective evaluation of the adequacy of the firm''s quality
    control policies and procedures, its personnel''s understanding of those policies
    and procedures, and the extent of the firm''s compliance with them. Although monitoring
    procedures are meant to be ongoing, they may include inspection procedures performed
    at a fixed point in time. Monitoring is a broad concept; inspection is one specific
    type of monitoring procedure.'
