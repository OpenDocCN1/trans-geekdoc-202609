    is inherently ordered. But we don’t care what order we see the books in, so long
    as they’re all present. To make the test reliable, then, we could *sort* the result
    slice before comparing it against our expectation.


    ## Sorting slices


    The standard library provides a very handy `sort.Slice` function that will do
    just what we need. It takes two arguments: the slice to be sorted, and a comparison
    function that explains how any two elements of the slice should be ordered.


