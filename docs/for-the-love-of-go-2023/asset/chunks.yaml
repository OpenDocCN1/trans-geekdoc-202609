    \n`([Listing 4.1](https://github.com/bitfield/ftl-code/blob/main/4.1/calculator_test.go))`\n\
    \n让我们运行测试看看进展得如何：\n\n`go test`\n\n```\nundefined: calculator.Multiply\n```\n\n\
    这完全没问题，因为这是我们预料到的。我们还没有写 `Multiply` 函数，所以难怪编译器找不到它。暂时忽略这个错误；一旦我们提供了 `Multiply`\
    \ 的定义，它就会消失。\n\n## 测试一个空实现\n\n现在我们准备好迈下一步来获取一个失败的测试。这听起来有点奇怪：我们不应该目标是一个通过的测试吗？\n\
    \n嗯，最终是这样。但首先有一个重要的步骤要执行。`TestMultiply` 函数的作用是检测 `Multiply` 中的错误（如果有的话）。我们如何知道它真的能做到这一点？\n\
    \n例如，如果我们现在编写了 `Multiply` 的正确实现并运行测试，预计它会通过。但测试中可能存在某些错误导致它意外通过。正如我们所看到的，如果我们不做任何操作让测试失败，Go\
    \ 的测试默认会通过。\n\n测试可能哪里出了什么问题？嗯，我们可能有一个错误的 `want` 值。假设由于某种不运，一个有错误的 `Multiply` 函数返回了我们放置在\
    \ `want` 中的完全错误的值。即使函数不起作用，测试也会通过。\n\n或者我们可能在 `if` 语句中写了错误的条件表达式。例如，这种错误很容易犯：通过编写\
    \ `==` 而不是 `!=`，我们让测试执行了与本该完全相反的操作。如果 `Multiply` 返回了正确答案，测试将失败！\n\n那么，我们如何向自己证明测试能正确检测到\
    \ `Multiply` 未正常工作？一种方法是故意写一个不工作的 `Multiply` 看看测试是否能通过。\n\n**目标：** 编写一个错误的 `Multiply`\
    \ 版本，并显示测试失败。\n\n我们将新函数添加到 `calculator.go` 文件，它看起来和现有的 `Add` 和 `Subtract` 函数非常相似。我们到底应该如何错误地编写函数来验证测试？嗯，这并不重要，因为对于我们的目的来说，任何非正确的结果都可以。最简单的可能是无论输入返回零：\n\
    \n这就是我们所谓的函数的空实现。它可以编译，我们可以从测试中调用它并得到结果。但由于该函数没有进行任何计算，结果几乎确定是错误的。\n\n记住，我们现在对\
    \ `Multiply` 不感兴趣。我们的任务仅仅是证明我们为 `Multiply` 编写的测试可以检测到错误。始终返回零是一个相当大的错误！如果我们无法检测到，我们的开始就糟糕了。让我们尝试：\n\
    \n`go test`\n\n```\n--- FAIL: TestMultiply (0.00s)\n    calculator_test.go:31:\
    \ want 9.000000, got 0.000000\n```\n\n太好了。这正是我们想要的。我们证明了 `TestMultiply` 可以检测到至少这个错误，所以它在起作用。如果我们没有做到这一点，我们真的无法知道\
    \ `TestMultiply` 是否能检测到任何错误——换句话说，它是否真的测试了某些东西。\n\n现在我们知道它是可以的，我们就可以放心地编写 `Multiply`\
    \ 的真实实现了，并确信测试会告诉我们是否写对了。\n\n## 编写真实实现\n\n这个过程的最后一步相对简单。我们只需要更改 `Multiply` 函数使其返回正确答案而不是零。正如我们所看到的，我们可以通过运行测试来检查代码。一旦它通过了，我们就完成了！\n\
    \n如果你卡住了，请查看 [Listing 4.1](https://github.com/bitfield/ftl-code/blob/main/4.1/calculator.go)\
    \ 中的一种可能的解决方案。\n\n现在我们已经通过测试引导成功设计并实现了一个新的计算器功能，是时候更多地思考更复杂的行为了。`Add`、`Subtract`\
    \ 和 `Multiply` 函数非常简单，以至于很难出错（尽管对于有决心的程序员来说这并非不可能）。如果 `TestAdd` 对于一组输入通过了（例如），很难想象还有哪些输入会让它失败。\n"
