    # 介绍结构体 (struct)


    在 Happy Fun Books，处理许多不同类型的数据。书籍就是一个例子：一本书关联了各种类型的信息，包括标题、作者、价格、ISBN 编码等。在我们的在线商店中，我们还需要处理关于客户的数据（姓名、地址等）以及订单（例如，哪些客户订了哪些书）。


    与其像我们之前所做的那样单独处理每一条书籍数据，我们更希望将一本书视为系统中的*单个*数据进行处理，这样我们就可以（例如）将一个书籍值传递给函数，或者将其存储在某种数据库中。


    由多个值组成且可以被视为单个单元处理的数据类型被称为*复合*类型（composite type，即“由多个部分组成”）。Go 中最有用的复合数据类型之一被称为*struct*（结构体），它是“结构化记录”（structured
    record）的缩写。


    结构体将相关的数据组合在一起，这些数据被称为*字段*（fields）。例如，描述我们商店客户的结构体可能有一个名为 `Name` 的字段用于存储姓名（这里使用
    string 类型很合理）。我们可能需要的另一个字段是 `Email`，用于他们的邮箱地址（我们在这里也使用 `string`）。


    那么，一个简单的 `Customer` 类型的定义可能如下：


