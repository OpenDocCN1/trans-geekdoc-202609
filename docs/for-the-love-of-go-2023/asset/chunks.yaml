    当执行到达（如果到达）`main` 的末尾时，程序就会停止。简单吧！当然，过程中可能会发生很多有趣的事情，但这就是你 Go 程序生命周期的基本形态。


    ## `init` 函数


    事实上，`main` 并不总是第一个运行的函数。如果存在一个名为 `init` 的函数，它将首先运行。如果你的 `main` 包导入了其他包，而*它们*拥有
    `init` 函数，那么它们也会在你的 `main` 函数启动之前被全部运行。


    我不建议你使用 `init`。虽然在程序启动之前设置某些内容，或者在每当某个包被导入时自动运行代码可能是很有用的，但 `init` 具有很强的“魔力”且不那么直观。你可能甚至不知道某个包是否有一个
    `init` 函数，除非你主动寻找它，这使得追踪控制流变得更加困难。


    而且，正如你已经在本书中中学到的，让程序的控制流尽可能尽可能简单、直而易见是一个好主意。如果你阅读他人的程序（我建议你这样做），你会发现他们并不总是这么做的。


    ## `init` 的替代方案


    幸运的是，我们永远不需要 `init`。有更好的方法可以实现相同的结果。最明显的方法是在 `main` 的开始直接执行任何你需要做的事情！


    不过，在导入的包中（也就是说任何名称不为 `main` 的包），你无法控制先调用哪个函数。所以，如果你需要在任何其他工作运行之前初始化某些数据结构，那么其中一种方法是使用
    `var` 语句。


    虽然几乎所有的 Go 代码都在函数内部（正如你在本书第一章中学到的），但我们允许在函数外部（包级别）放置 `var` 语句。由于 `var` 语句不仅可以声明变量还可以给它们赋值（包括从函数调用返回的值），你可以利用这一点完成初始化。


    例如：


    ```

    ```


    这假设你已经在该包的某处定义了 `initialiseThing` 函数，但这没关系。重点是，你可以确保该函数在包中的任何其他函数之前运行，而不需要依赖名为
    `init` 的函数的魔力行为。这只是纯粹的、每个人都能读懂理解的 Go 代码。


    ## 构建可执行文件


    那么，让我们写一个包含 `main` 包和 `main` 函数的可执行程序吧。创建一个名为 `hello` 的新文件夹（确保它不是你其他任何 Go 项目的子文件夹）。在该文件夹中添加一个名为
    `main.go` 的文件（就像任何其他包一样，按照惯例但并非必须，将文件命名为与其实现的包相同的名称）。


    在文件中添加以下内容：


    ```

    ```


    你现在知道，如果我们想生成一个可执行文件，`package main` 声明是必须的。我们还需要一个 `main` 函数，否则可执行文件将什么都不做。


    正如你可能所知道的，你可以通过输入 `go run main.go` 直接从命令行运行此程序。这对于测试或实验很有用，但这一次我们感兴趣生成一个二进制可执行文件。


    还记得本书前面我们如何使用 `go build` 命令为我们的计算器程序构建二进制文件吗？让我们在这个程序上也也试一试。在 `hello` 文件夹内运行以下命令：


    ```

    go build

    ```


    ## 可执行二进制文件


    如果没有错误，该命令不会产生任何输出，但你会发现你的 `main.go` 旁边创建了一个新文件，名为 `hello`。


    让我们检查一下它是什么类型的文件：


    `file hello`


    ```

    hello: Mach-O 64-bit executable x86_64

    ```


    你可能会根据你的操作系统或 CPU 架构看到不同的输出，但重点在于：Go 编译器仅以你的系统所需的格式生成了一个可执行文件。


    要运行它，直接使用程序名称本身作为命令：


    `./hello`


    ```

    Hello, world!

    ```


    成功了！这可能不是你第一次构建并运行 Go 程序，但现在你确切知道发生了什么，以及为什么。操作系统加载了你的二进制文件 `hello`，并从代表 `main`
    函数开头的机器码指令开始执行它。控制流一直进行到该函数的末尾，然后程序退出。


    拥有这样一个二进制文件的好处是，你可以将其复制到任何其他计算机上并在那里运行，没有任何其他依赖（前提是具有相同的操作系统和 CPU 架构）。那台计算机不需要安装
    Go 工具，事实上，不需要任何其他东西。你可以在 Docker 容器、Kubernetes 或任何其他方式运行这个二进制文件。


    ## 交叉编译


    你可能会奇怪如何为其他系统构建可执行文件？幸运的是，答案是不。你可以通过设置 `GOOS` 和 `GOARCH` 变量，为你喜欢的任何系统构建可执行文件。让我们尝试一个例子：


    ```

    GOOS=windows go build

    ```


    这产生了一个名为 `hello.exe` 的文件，这就是你在 Windows 上预期的。


    `file hello.exe`


    ```

    hello.exe: PE32+ executable (console) x86-64

    ```


    Linux 呢？


    `GOOS=linux GOARCH=arm go build`


    `file hello`


    ```

    hello: ELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), statically linked

    ```


    非常好！你可以运行 `go tool list` 获取所有支持的操作系统和架构组合。


    ## 退出


    正如你在本章前面看到的，Go 程序一旦到达 `main` 后会自动退出（即停止执行并将控制权交还操作系统）。但如果你在此之前退出呢？或者如果想向操作系统信号发生了某种错误呢？


    Go 提供了 `os.Exit` 函数专门为此。你需要向它传递一个参数，退出码（exit code）或退出状态（exit status）。这只是一个数字，按照惯，零退出状态表示一切正常，而而非零值则意味着发生了错误。


    这里有一个例子：


    ```


    ```


    如果你运行此程序（无论是通过 `go run` 直接运行，还是通过 `go build` 构建可执行文件后运行），你会看到 shell 报告：


    ```

    exit status 1

    ```


    你也可以在任何地方通过 `log.Fatal` 并传入消息，或者调用内置的 `panic` 函数来退出程序。这两者都会以非零退出状态立即终止程序（在 `panic`
    的情况下，还有关于代码中触发 panic 的信息）。


    `log.Fatal` 或 `panic` 的问题在于，如果它们深埋在代码中，读者很难看出程序会在何时以及何地退出。因此，一个良好的准则是只在 `main`
    函数中退出程序。它带你来到这个世界（如果你愿意这么说的话），所以它应该是送你离开的人。


    以此为题，我们该时候送自己离开了。一起工作和学习 Go 一直非常愉快，我希望你也是一样。但在最后一章中，我们只需简要谈谈我们*应该*如何编写 Go 程序：理想情况下，带着善良、简单和谦逊，并且不强求。

