    \ntype Book struct {\n\tTitle string\n\tPrice float64\n}\n```\n([列表 10.1](https://github.com/bitfield/ftl-code/blob/main/10.1/bookstore.go))\n\
    \n## 要点总结\n\n* Go 有各种*数据类型*来处理不同类型的信息：`string` 存储文本，`int` 存储整数，`float64` 存储小数，`bool`\
    \ 存储布尔值（真或假）。\n* Go 编译器会检查给定类型的变量或参数是否只被赋予该类型的值：如果检测到不匹配，就是编译错误。\n* `var` 关键字引入变量并指定其类型，以便我们稍后在程序中使用它。\n\
    * *字面量*（literal）是我们直接在 Go 代码中指定的某种类型的值，例如字符串字面量 `\"For the Love of Go\"`。\n* Go\
    \ 中的变量在被显式赋值之前有一个*默认*值：它是该类型对应的*零*值，例如字符串为 `\"\"`，数字为 0，布尔值为 `false`。\n* 我们 经常在一条语句中声明并给变量赋值，使用*短变量声明形式*，例如\
    \ `x := y`。\n* 当你想将相关的值组合到一个单个变量中时，你可以定义一个结构体（struct）。\n"
