    ## Go 语言的力量：测试


    带着信心进行编程意味着什么？你如何构建自测试软件？测试到底算是什么？[The Power of Go: Tests](https://bitfieldconsulting.com/books/tests)
    回答了这些问题以及更多问题。


    ![](https://bitfieldconsulting.com/books/tests)


    欢迎来到充满模糊变异体和间谍的惊人世界：游击测试、Mock 模拟与劣质实现、设计气味、幻象测试、深度抽象、爆炸指针、哨兵与六岁宇航员、覆盖率棘轮和黄金文件、单例与行走的骨架、金丝雀和臭味测试套件、脆弱测试和并发回调、虚假对象、CRUD
    方法、无限缺陷、脆弱的测试、乱七八糟的时空交叉、适配器和大使、只在午夜会失败的测试，以及在黑暗时刻从玩家手中偷东西的小精灵。


    > *如果你因为应用了书中的建议而被解雇，那么考虑到种种因素，那也许是最好的。但如果真的发生了，我将竭尽个人努力为你物找一家更好的公司：在那里，人们因产出真正运行的软件而受到奖励，而不是惩罚。*


    Go 内置的测试支持将测试置于任何软件项目的核心，从命令行工具到复杂的后端服务器和 API。这本易于上手、有趣的书籍将向你介绍 Go 的所有测试设施，展示如何使用它们为最棘手的问题编写测试，并提炼了
    Go 社区关于 Go 程序测试最佳实践的集体智慧。书中充斥着数百个代码示例，通过真实的测试和真实的问题一步一步向你展示确切该做什么。


    你将学习如何使用测试来设计解决用户问题的程序，如何在坚实的基础上构建可靠的代码库，以及测试如何帮助你对糟糕的、满是 Bug 的遗留代码库并让它们变得更易维护。从为测试选择具有信息量且关注行为的名称，到管理数据库和并发服务器等测试依赖的巧妙、强大的技术，[The
    Power of Go: Tests](https://bitfieldconsulting.com/books/tests)包含了你掌握 Go 测试艺术所需的一切。


    ## Go Go：泛型


    情况在发生变化了！超越基础，掌握 Go 1.18 引入的新泛型特性。通过这本简单易读但全面的指南，学习关于 Go 中类型参数和约束的所有知识以及如何使用它们。


    ![](https://bitfieldconsulting.com/books/generics)


    如果你是 Go 和泛型的新手，并好奇为什么会有这么大动静，那么这本书是为你准备的！如果你已经有了一些 Go 经验，但想学习新的泛型特性，这本书也适合你。如果你一直按不及待地等待
    Go 赶紧引入泛型以便你使用，别担心：这本书也适合你！


    你不需要计算机科学的高级学位或海量的编程经验。[Know Go: Generics](https://bitfieldconsulting.com/books/generics)
    用通平实、普通的语言解释了你需要了解的知识，并用简单的示例向你展示新内容是什么、语言的变化将如何影响你，以及究竟如何在你自己的程序和包中使用泛型。


    正如你所从《For the Love of Go》和《The Power of Go: Tools》作者所预期的那样，它读起来既有趣又简单，但同时也充满了你可以在实际应用中使用的强大思想、概念和技术。


    ## 进阶阅读


    你可以在这里找到更多关于 Go 的书籍：


    *   [John Arundel 编写的 Go 书](https://bitfieldconsulting.com/books)


    你可以在这里找到更多 Go 教程和练习：


    *   [Bitfield 的 Go 教程](https://bitfieldconsulting.com/golang)


    我有一个 YouTube 频道，偶尔发布关于 Go 的视频，那里还有我认为的最好的 Go 演讲和教程精选播放列表，地址如下：


    *   [YouTube 上的 Bitfield Consulting](https://www.youtube.com/c/BitfieldConsulting)


    ## 致谢


    Gopher 图像由卓越的 [egonelbre](https://github.com/egonelbre/gophers) 和 [MariaLetta](https://github.com/MariaLetta/free-gophers-pack)
    提供。


    # 致谢


    编写一本书需要众人的努力，而书中的思想是在几年里，通过与我在 [Bitfield Institute of Technology](https://bitfieldconsulting.com/golang/bit)（我的在线软件工程学院）的学生合作中塑造和完善的。他们教给我的并不比我教给他们的少，许多人已经在思科、微软和
    Facebook 等顶尖公司成为了出色的工程师。能在他们的技艺精进和职业成功中贡献哪怕是微不足道的一力，我感到非常荣幸。


    特别感谢（尽管不是全部）Adebayo Ogidiou, Bryan Green, Bukola Jimoh, Christian Sage, Dave Cottlehuber,
    Ivan Fetch, Jackson Kato, Jakub Jarosz, Jon Akeman, Joumana Eloui, Kevin Strong,
    Mike Stanton, Parish Mwangi, Piero Mamberti, Quinn Murphy, Richard Bright, Sherif
    Abdalla, Thiago Nache, Thibaut Girier, Thom Kling 以及 Umang Vanjara。


    非常感谢愿意阅读本书草稿并提供有用反馈的数百测试读者，他们帮助我识别出无效的解释、不好笑的笑话、无法编译的代码以及（特别是）让非母语者难以理解的内容。


    如果你想在未来成为我的测试读者之一，请访问我的网站，输入你的电子邮件地址并勾选相应的框加入我的邮件列表：


    *   [`bitfielding.com/**


    这本书献给我的母亲，非常感谢她花了数十小时倾听我疯狂的想法，并帮助我将它们理并组织成像书的东西。噢，感谢她给了我生命。这显然也有帮助。


    # 预览


    如果你在读完这本书后想下一步去哪里，这里是 [The Power of Go: Tools`](https://bitfieldconsulting.com/books/tools)
    第一章的预览。如果你喜欢这一章，请使用优惠代码 `LOVE-TOOLS` 获取全书 7 折优惠。只需前往产品页面，将书加入购物车，然后在结账时输入代码即可。


    祝阅读愉快！


    # 1. 包


    > *人们认为计算机科学是天才的艺术，但实际情况恰恰相反，只是许多人在相互构建的基础上进行工作，就像砌墙一样。*


    >


    —唐纳德·库斯


    ![](img/file20.png)


    编写编程书籍有很多方法，但我最喜欢的是 Brian Kernighan 和 Dennis Ritchie 在 1978 年的经典著作《C 语言程序》（以作者首字母命名为“K&R”）中采用的方法：


    > 学习新编程语言的唯一方法是用该语言编写程序。对于所有语言来说，第一个程序都是一样的：打印“Hello, world”这两个词。


    为什么要费力做这种琐事呢？他们解释道：


    > 这是一个基础障碍；要跨越它，你必须能够在某处创建程序文本、成功编译、加载、运行，并找到你的输出去哪里了。掌握了这些机械细节后，其他事情都会变得相对简单。

