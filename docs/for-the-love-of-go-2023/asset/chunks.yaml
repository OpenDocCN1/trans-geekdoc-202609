    here instead of `x`, providing that it evaluates to a value of the same type as
    your switch cases (in our example, that’s implicitly `int`, because the constant
    literals `1`, `2`, and `3` are integers).


    You can supply multiple values in the same case, as a comma-separated list. If
    any of the values match, the case will be triggered:


