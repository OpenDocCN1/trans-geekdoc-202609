- raw: 'We can recognise that we don’t know everything, and we can’t make very accurate
    predictions (especially about the future), so we shouldn’t waste time and energy
    pre-engineering things we may never need. We don’t assume we know best what *other*
    software people will want to use in conjunction with ours, so we don’t hard-wire
    in dependencies on it.


    We assume that anything we write will contain bugs, so we write careful tests
    that try to elicit unexpected behaviour or incorrect results. We understand there
    will inevitably be important things we don’t know or can’t anticipate correctly,
    so we don’t optimise code too much for the status quo, because a lot of that work
    will end up being wasted.


    We are humble enough to review our *own* code before asking anyone else to, because
    if we can’t be bothered, why should they? We take the time to go through it line
    by line, reading it as a new user or developer would, trying to follow the argument
    logically. Is it clear where to start reading? Does the program introduce the
    crucial types or constants at the beginning, and go on to show how they’re used?
    Do the names of things identify clearly and accurately what they do, or have they
    grown confusing and out of date through a dozen refactorings? Does the program
    fit neatly and naturally into its structure, or has it overgrown some parts and
    left others oddly empty?


    Because we’re not bound up with our own cleverness and elegance, we don’t need
    to cram three or four different ideas into a single line of code. Instead, we
    set out the logic plainly, obviously, step by step, statement by statement, in
    bite-size pieces that do exactly the necessary thing in exactly the way that the
    reader expects. Where this isn’t possible, we take the trouble to explain to the
    reader just what they need to know to understand what’s going on.


    Because we know we’re not geniuses, and we can’t write programs that are so brilliant
    as to be self-explanatory, we take some trouble over our explanations. We accompany
    code with documentation that shows not just what the *program* does, but how to
    accomplish things with it that *users* might want to do. We include detailed usage
    examples showing exactly what needs to be done, from scratch, to carry out realistic
    tasks, what users should expect to see when it’s done and what they should do
    next, and we check those examples rigorously and regularly to make sure they *still
    work*.


    ## Not striving


    The final teaching of the Tao is *wúwéi* (“not striving”). This is sometimes misunderstood
    as laziness, withdrawal, or passivity; quite the opposite. Working hard does not
    always mean working well. We all know people who are chronically busy, always
    in a rush, fussing and flapping and in a fury of activity, but they never seem
    to actually achieve anything very much. Also, they’re having a miserable time,
    because they know that too.


    Instead, we often do our best work when it might seem to others that we’re doing
    nothing at all: walking by a river on a beautiful day, or sitting on the porch
    watching a spider building a web. If we can be smart enough to stop *trying* so
    hard for just a minute, the right idea often pops into our heads straight away.


    Rather than treating every problem as an enemy to be attacked, a mountain to be
    climbed, or a wall to be demolished, we can use the “not striving” principle (sometimes
    “not *forcing*” would be a better translation). We’ve probably all had the embarrassing
    experience of fruitlessly pushing on a stubborn door, only to realise that this
    particular door responds better to a *pull*. What little signs are we overlooking
    in our daily work that we should be pulling instead of pushing?


    A problem-solving mindset is good, but problem *eliminating* is even better. Ask:
    how could we reframe this problem so that it just goes away? What restatement
    of the requirements would make the solution trivial and even obvious? Is there
    a simple and elegant design we’re not seeing because we’re fixated on some detail
    that turns out to be irrelevant? Could we get away without even trying to solve
    this problem? The best optimisation is not to do the thing at all.


    It’s a common mistake to confuse programming with typing. If someone’s just sitting
    there staring into space, it doesn’t look like they’re doing anything useful.
    If they’re rattling furiously on a keyboard, though, we assume they’re achieving
    something. In fact, real programming happens before the typing, and sometimes
    instead of it. When we’ve done a really good bit of programming, often the only
    key we need to press is the delete key.


    Next time you hit a problem, try not striving or forcing things for once, and
    see if the problem can be gently encouraged to solve itself. If you find yourself
    struggling to get a buffalo to where you want it to go, stop struggling. Ask yourself
    if you can find out where the *buffalo* wants to go, and whether perhaps that
    isn’t the best place for it after all.


    ## The love of Go


    Thanks for reading this book (and making it to the end!) You’re well on your way
    to becoming a master software engineer, and I feel honoured to have shared this
    part of your journey with you. I wish you every success and happiness in the future…
    for the love of Go!


    # About this book


    ![](media/file5.png)


    ## Who wrote this?


    [John Arundel](https://bitfieldconsulting.com/about) is a Go teacher and mentor
    of many years experience. He’s helped literally thousands of people to learn Go,
    with friendly, supportive, professional mentoring, and he can help you too. Find
    out more:


    *   [Learn Go remotely with me](https://bitfieldconsulting.com/golang/learn)


    ## Feedback


    If you enjoyed this book, let me know! Email [go@bitfieldconsulting.com](mailto:go@bitfieldconsulting.com)
    with your comments. If you didn’t enjoy it, or found a problem, I’d like to hear
    that too. All your feedback will go to improving the book.


    Also, please tell your friends, or post about the book on social media. I’m not
    a global mega-corporation, and I don’t have a publisher or a marketing budget:
    I write and produce these books myself, at home, in my spare time. I’m not doing
    this for the money: I’m doing it so that I can help bring the love of Go to as
    many people as possible.


    That’s where you can help, too. If you love Go, tell a friend about this book!


    ## Mailing list


    If you’d like to hear about it first when I publish new books, or even join my
    exclusive group of beta readers to give feedback on drafts in progress, you can
    subscribe to my mailing list here:


    *   [Subscribe to Bitfield updates](http://eepurl.com/hdYV0z)


    ## Video course


    If you’re one of the many people who enjoys learning from videos, as well as from
    books, you may like the *For the Love of Go* video course that accompanies this
    series:


    [![](media/file16.png)](https://bitfieldconsulting.com/courses/love-books-video-bundlelove)


    *   [For the Love of Go: Video Course](https://bitfieldconsulting.com/courses/love-books-video-bundle)


    ## The Power of Go: Tools


    Now that you’ve finished this book, you’re ready to unlock the power of Go, master
    obviousness-oriented programming, and learn the secrets of Zen mountaineering,
    with [The Power of Go: Tools](https://bitfieldconsulting.com/books/tools).


    [![](media/file17.png)](https://bitfieldconsulting.com/books/tools)


    *The Power of Go: Tools* is the next step on your software engineering journey,
    explaining how to write simple, powerful, idiomatic, and even beautiful programs
    in Go.


    This friendly, supportive, yet challenging book will show you how master software
    engineers think, and guide you through the process of designing production-ready
    command-line tools in Go step by step.


    How do you break down a problem into manageable chunks? How do you test functions
    before you’ve written them? How do you design reusable packages and tools that
    delight users? *The Power of Go: Tools* has the answers.'
  fmt: '

    We can recognise that we don’t know everything, and we can’t make very accurate
    predictions (especially about the future), so we shouldn’t waste time and energy
    pre-engineering things we may never need. We don’t assume we know best what `other`
    software people will want to use in conjunction with ours, so we don’t hard-wire
    in dependencies on it.


    We assume that anything we write will contain bugs, so we write careful tests
    that try to elicit unexpected behaviour or incorrect results. We understand there
    will inevitably be important things we don’t know or can’t anticipate correctly,
    so we don’t optimise code too much for the status quo, because a lot of that work
    will end up being wasted.


    We are humble enough to review our `own` code before asking anyone else to, because
    if we can’t be bothered, why should they? We take the time to go through it line
    by line, reading it as a new user or developer would, trying to follow the argument
    logically. Is it clear where to start reading? Does the program introduce the
    crucial types or constants at the beginning, and go on to show how they’re used?
    Do the names of things identify clearly and accurately what they do, or have they
    grown confusing and out of date through a dozen refactorings? Does the program
    fit neatly and naturally into its structure, or has it overgrown some parts and
    left others oddly empty?


    Because we’re not bound up with our own cleverness and elegance, we don’t need
    to cram three or four different ideas into a single line of code. Instead, we
    set out the logic plainly, obviously, step by step, statement by statement, in
    bite-size pieces that do exactly the necessary thing in exactly the way that the
    reader expects. Where this isn’t possible, we take the trouble to explain to the
    reader just what they need to know to understand what’s going on.


    Because we know we’re not geniuses, and we can’t write programs that are so brilliant
    as to be self-explanatory, we take some trouble over our explanations. We accompany
    code with documentation that shows not just what the `program` does, but how to
    accomplish things with it that `users` might want to do. We include detailed usage
    examples showing exactly what needs to be done, from scratch, to carry out realistic
    tasks, what users should expect to see when it’s done and what they should do
    next, and we check those examples rigorously and regularly to make sure they `still
    work`.


    ## Not striving


    The final teaching of the Tao is `wúwéi` (“not striving”). This is sometimes misunderstood
    as laziness, withdrawal, or passivity; quite the opposite. Working hard does not
    always mean working well. We all know people who are chronically busy, always
    in a rush, fussing and flapping and in a fury of activity, but they never seem
    to actually achieve anything very much. Also, they’re having a miserable time,
    because they know that too.


    Instead, we often do our best work when it might seem to others that we’re doing
    nothing at all: walking by a river on a beautiful day, or sitting on the porch
    watching a spider building a web. If we can be smart enough to stop `trying` so
    hard for just a minute, the right idea often pops into our heads straight away.


    Rather than treating every problem as an enemy to be attacked, a mountain to be
    climbed, or a wall to be demolished, we can use the “not striving” principle (sometimes
    “not `forcing`”).

    '
  trans: '

    我们意识到自己并非全知，也无法做出非常准确的预测（尤其是关于未来），因此我们不应浪费时间和精力和去预先工程化那些可能永远需要的东西。我们不假设自己最了解 `other`
    软件用户想如何与我们的软件配合使用，因此我们不会硬编码对它们的依赖。


    我们假设所编写的任何代码都会包含漏洞，因此我们编写了仔细的测试，试图诱发意外的行为或错误的结果。我们理解，不可避免地会有一些我们不知道或无法正确预测的重要事情，因此我们不会针对现状对代码进行过度优化，因为其中许多工作最终将付诸东流。


    我们足够谦逊，会在要求他人检查之前先审查自己的 `own` 代码，因为如果我们自己都不愿意做，他们又为什么要去读呢？我们会花时间逐行检查，像新用户或开发者的视角那样去阅读，尝试在逻辑上遵循其论证。从哪里开始阅读清晰吗？程序是否在开头引入了关键类型或常量，并随后展示它们是如何使用的？事物的命名是否清晰准确地标识了它们的功能，还是在经过十几次重构后变得变得混乱且过时？程序是否恰齐自然地融入了它的结构中，还是在某些部分过度生长而让另一些部分显得异常空虚？


    因为我们并不执着于自己的聪明和优雅，所以我们不需要将三四个不同的想法挤进单行代码中。相反，我们清晰、显而易见地一步步、逐句地以易于理解的形式阐述逻辑，让每一部分都恰好以读者预期的方式完成恰需要的事情。在无法做到的情况下，我们会费心向读者解释他们理解发生的情况所需要知道的知识。


    因为我们知道自己不是天才，无法写出那种卓越到自解释其明的程序，因此我们在解释上花了心思。我们为代码配上了文档，不仅显示 `program` 做了什么，还展示如何使用它来实现
    `users` 可能想完成的操作。我们包含了详细的用法示例，准确地展示了从零开始执行真实任务需要做什么、完成后用户应该预期看到什么，以及他们下一步应该做什么，并且我们会严格、定期地检查这些示例，以确保它们
    `still work`。


    ## 不为


    道的最终教诲是 `wúwéi`（“不为”）。这有时会被误解为懒惰、退缩或消极；事实恰恰相反。努力工作并不总是意味着工作得好。我们都认识那些长期忙碌的人，总是行冲撞撞、手忙脚乱、处于疯狂的活动中，但他们似乎从未真正取得过什么成就。而且，他们过得很痛苦，因为他们也知道这一点。


    相反，当在别人看来我们似乎什么都没做时，我们往往能完成最好的工作：在美妙的一天沿着河边散步，或者坐在廊台上看着蜘蛛织网。如果我们足够聪明，能够停止那么努力地
    `trying` 一分钟，正确的想法往往会立即跳入脑海。


    与其将每个问题都视为一个要进攻的敌人、要攀爬的山峰或要拆除的墙，我们可以使用“不为”原则（有时也称为“不 `forcing`”）。

    '
