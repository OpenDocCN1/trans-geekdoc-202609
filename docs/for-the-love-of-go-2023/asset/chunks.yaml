    more generally. All we really care about is that we can *write* to whatever it
    is, and this idea is expressed by the standard library interface `io.Writer`.
    So let’s make the parameter to `Print` be an `io.Writer`.


    Fine. What concrete type that satisfies `io.Writer` shall we use in the test,
    though? We want a type that doesn’t cause anything to be printed on the terminal,
    and ideally that we can inspect programmatically to see whether or not the expected
    message was actually written to it.


    A `*bytes.Buffer` is ideal for this purpose, so let’s create one, and pass it
    to the `Print` function. Here’s the revised test:


    ```


    ```


    ([Listing 1.2](https://github.com/bitfield/tpg-tools/blob/main/1.2/hello_test.go))


    As you can see, the `Print` function now takes an argument: the writer to write
    to. However, this creates a problem with the name: `Print` suggests that it prints
    whatever arguments you give it. But the argument we’re giving is not something
    to print: it’s something to be printed *to*. So let’s rename the function `PrintTo`,
    as in “print to… this!”

