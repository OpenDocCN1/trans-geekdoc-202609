    # 12: Switch 哪一个？


    ![](img/file12.jpg)


    我们在上一节中看到，我们的 Go 程序可以使用 `if` 选择一个可选路径，或者结合使用 `if` 和 `else` 采用两条路径。但如果有两个以上的候选项该呢？


    ## `switch` 语句


    假设你想知道某个数字是正数、负数还是零。你完全可以写一系列 `if` 语句来找出结果，有时这样做是可以的。但随着选择数量和可能代码路径的增加，这会变得非常冗长且复杂。


    我们需要的是一种条件语句，允许我们指定任意数量的 `cases`（即，可能的条件），并将每个 case 链接到不同的代码路径上。Go 的 `switch`
    语句正是这样做的。这里有一个示例：


    ```


    ```


    ```


    我们从关键字 `switch` 开始，后面紧跟一个左大括号，然后是 `cases` 列表，最后是右大括号。


    ## Switch cases


    每个 case 都由关键字 `case` 引入，后面跟着一些条件表达式（例如，`x < 0`）和一个冒号。


    然后，我们可以在 case 条件为真时提供一些要执行的语句（例如，打印一条消息）。


    当 Go 遇到这样的 `switch` 语句时，它会查看第一个 case 并求值其中的条件表达式。如果该表达式为真，则执行该 case 的语句，然后 `switch`
    语句结束；控制流移动到程序的下一个部分。


    如果表达式为假，执行将移动到下一个 case，依此类推，直到找到一个匹配的 case（即其条件表达式求值为 `true` 的 case）。如果没有一个匹配的
    case，则什么都不会发生，程序继续运行。


    需要知道的一点是，一旦匹配了 case，Go 就不会再检查后续的 case，而是跳到语句的末尾。你可能认为所有匹配的 case 都会执行，但运行机制并不是这样的：只有第一个匹配的
    case 会执行。


    有一个特殊的语句可以改变这种行为：在 case 的末尾编写 `fallthrough` 告诉 Go 执行下一个 case 中的语句，而不是跳到末尾。但 `fallthrough`
    很少被使用或需要；尽管如此，现在你了解它了。


    ## default case


    有一个名为 `default` 的特殊 case，它只有在没有其他 case 匹配时才会匹配。在上例例中，如果 `x` 既不小于零（第一个 case），也不大于零（第二个
    case），那么剩下的唯一可能就是 `x` 为零，这就是 `default` case。


    如果可能，你应该始终提供一个 `default` case：这会让你的程序更清晰、更可靠。


    `switch` 是一种非常方便的方法，用于编写根据一组条件采取 N 个可能路径中的之一的程序逻辑，它比编写相应的 `if ... else if ...
    else if ...` 语句更简洁。但请注意，你的 `switch` cases 之间应该是相互相关的。不要仅仅把 `switch` 当作避免编写多个不相关的
    `if` 语句的方法；这会导致产生困惑的代码。


    ## Switch expressions


    根据某些变量或表达式的值采取不同动作是非常常见的。例如，假设你想确定 `x` 的值是 1、2 还是 3。实现此事的简洁方法是使用 switch 表达式，它位于
    `switch` 关键字之后：


    ```


    ```


    我们说这是对 `x` 进行切换，即不同的 cases 代表可能的值。你可以使用任何表达式代替 `x`，只要它的求值类型与 switch cases 相同（在我们的示例中，它是隐式的
    `int`）。


    你可以在同一个 case 中提供多个值，用逗号分隔列表：


    ```


    目标：编写一个函数 `greet`，接收一个代表名字的字符串并根据名字返回不同的字符串。如果名字是 `Alice`，返回 `"Hey, Alice."`。如果名字是
    `Bob`，返回 `"What''s up, Bob?"`。对于任何其他名字，返回 `"Hello, stranger."`。


    ## 使用 break 提前退出 switch case


    有时我们在 switch case 的代码内部想要提前离开。`break` 关键字将终止当前 case 并跳转到 `switch` 语句之后的代码：


    ```


    ```


    你可以将其理解为 case “跳出” `switch` 语句，就像一个不想服完剩余刑期的犯人。


    ## Loops


    你正在学习许多控制 Go 程序执行流的有用技术。普通语句一个接一个，而 `if` 和 `switch` 语句根据某些变量或表达式的值采取不同的路径。


    但如果我们想重复某些语句怎么办？例如，假设我们要打印 10 次某些消息。我们可以简单地写十个相同的 `fmt.Println` 语句。但这既冗长又缺乏活性。


    相反，我们希望有一个单一的打印语句，并执行不同次数。无论你如何尝试，都无法仅使用 `if` 或 `switch` 语句创建这样的程序。我们需要一个新的关键字。


    ## `for` 关键字


    可以重复的语句集合被称为循环，在 Go 中，循环是由 `for` 关键字引入的。你可以将其理解为“只要某个条件成立，就执行以下操作”。


    ```


    ```


    我们从 `for` 关键字开始，后面跟着（可选的）条件表达式和一个左大括号。然后是一个（可选的）语句集合，最后是右大括号。


    '
