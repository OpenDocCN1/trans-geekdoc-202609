  fmt: "\nGo is humble, and that’s a good attitude for us to adopt, too. It doesn’t\
    \ claim to be the world’s greatest programming language, the most advanced, or\
    \ the most pure, elegant, and theoretically appealing. It isn’t. The designers\
    \ of Go wanted to maximise `productivity`, not elegance, and that explains a lot.\n\
    \nSimilarly, the programs we write with Go should be simple, straightforward,\
    \ and pragmatic. If they’re elegant too, that’s nice, but it’s not the goal. And\
    \ because Go programs tend to be simple and easy to understand, it’s easy to change\
    \ them later, so we don’t need to over-engineer everything at the start. We just\
    \ build what’s necessary to get the job done and leave it at that.\n\nWe try to\
    \ solve the problem we `have`, not the problem that might face us next week, or\
    \ next year. Rather than blindly applying coding dogmas like “always write short\
    \ functions”, regardless of the situation, Go programmers are more interested\
    \ in what makes the `program` clearer.\n\n## Programming with confidence\n\nIt’s\
    \ very important that the programs we write be `correct`. That is, they should\
    \ do what they’re intended to do. Indeed, if the program is not correct, hardly\
    \ anything else about it matters.\n\nOne way to improve our confidence in the\
    \ program’s correctness is to write `tests` for it.\n\nA test is also a program,\
    \ but it’s a program specifically designed to run `another` program with various\
    \ different inputs, and check its result. The test verifies that the program actually\
    \ behaves the way it’s supposed to.\n\nFor example, if you were considering writing\
    \ a function called `Multiply`, and you wanted to be able to check that it worked,\
    \ you might write a program that calls `Multiply(2, 2)` and checks that the answer\
    \ is `4`. That’s a test!\n\nAnd it turns out that it’s a good idea to write the\
    \ test even before you start writing the function it tests. It might seem a little\
    \ odd to do things this way round, if you’re not used to it. But it actually makes\
    \ a lot of sense.\n\nBy writing the test first, you are forced to think about\
    \ what the program actually needs to do. You also have to design its interface\
    \ (the way users interact with the program). If it’s really awkward to call your\
    \ function, or it has a name that doesn’t make sense in the context where it’s\
    \ used, all of these things will be obvious when you write your test. In effect,\
    \ you’re being your own first user.\n\nAnd it also means you know when to stop\
    \ coding, because when the test starts passing, you’re done!\n\nSo writing tests\
    \ is not just about gaining confidence that your code is correct, although that’s\
    \ definitely useful. It’s also a powerful process for designing well-structured\
    \ programs with good APIs. A phrase I like that describes this process is “development,\
    \ `guided by tests”.\n\n## What makes this book different?\n\nMost Go books will\
    \ start by telling you about the basic syntax of the language, variables, data\
    \ types, and so on. That’s important stuff to know, and we’ll cover it in this\
    \ book too. But because I want you to get thoroughly comfortable with the process\
    \ of software development guided by tests, we’re going to be doing that right\
    \ from the start.\n\nIn order to do this, we’ll `use` some Go concepts that won’t\
    \ be familiar to you yet: functions, variables, the `testing` package, and so\
    \ on. Don’t worry about understanding everything that’s going on at first: we\
    \ will get to the details later. For the first few chapters, just relax and enjoy\
    \ the ride, even if you come across some things that seem a little mysterious.\n\
    \nIn fact, this is often the situation we find ourselves in as programmers: we\
    \ `have` some existing code that we don’t necessarily totally understand, but\
    \ we will try to figure out just enough to solve the problem at hand. So this\
    \ will be good practice for you, and everything will be explained in its right\
    \ place.\n\n## How to use this book\n\nThroughout this book we’ll be working together\
    \ to develop a project in Go. Each chapter introduces a new feature or concept,\
    \ and sets you some goals to achieve. Goals are marked with `GOAL` in bold. (Don’t\
    \ worry if you’re not sure how to start. There’ll usually be some helpful suggestions\
    \ following the goal description.)\n\nSo let’s get started!\n\n# 1. Testing times\n\
    \n![](media/file1.png)\n\nIt’s your first day as a Go developer at Texio Instronics,\
    \ a major manufacturer of widgets and what-nots, and you’ve been assigned to the\
    \ Future Projects division to work on a very exciting new product: a Go-powered\
    \ electronic calculator. Welcome aboard.\n\nIn this exercise, all we need to do\
    \ is make sure our Go environment is set up and everything is working right. We’re\
    \ going to create a new Go project for the calculator package, add some test code\
    \ to it, and run the test.\n\n## Creating a new project\n\nEvery Go project needs\
    \ two things: a `folder` on disk to keep its source code in, and a `go.mod` file\
    \ which identifies the `module`, or project name.\n\nIf you don’t have one already,\
    \ I recommend you create a new folder on your computer to keep your Go projects\
    \ in (this can be in any location you like). Then, within this folder, create\
    \ a subfolder named `calculator`.\n\nNext, start a shell session using your terminal\
    \ program (for example, the macOS Terminal app) or your code editor. Set your\
    \ working directory to the project folder using the `cd` command (for example,\
    \ `cd ~/go/calculator`).\n\nNow run the following command in the shell:\n\n```bash\n\
    go mod init calculator\n```\n\n`go: creating new go.mod: module calculator`\n\n\
    You should find that a new file has been created named `go.mod`, with the following\
    \ contents (or something very similar):\n\n```go\nmodule calculator\n\ngo 1.19\n\
    ```\n\n([Listing 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/go.mod))\n\
    \nGo organises code into units called `modules`, and each module needs to be in\
    \ a separate folder (you can’t have modules within modules). Each module needs\
    \ a `go.mod` file which tells Go that this folder contains a module, and what\
    \ the name of the module is (in this case, it’s `calculator`).\n\nSo we should\
    \ now have a folder structure something like this:\n\n```\ncalculator/\n    go.mod\n\
    ```\n\nAll clear? Great! We’ll be creating a number of new Go projects throughout\
    \ this book, using the same steps shown in this section: create a new folder,\
    \ and inside the folder, run the command `go mod init MODULE_NAME`, where `MODULE_NAME`\
    \ represents the name we want to give the project.\n\nNext, we’ll see how to create\
