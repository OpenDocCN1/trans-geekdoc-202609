- raw: "But before we get to that, we need to make sure that our Go environment is\
    \ properly installed and working, the project is set up correctly, and that we\
    \ can successfully run tests for a project.\n\n## Running the tests\n\nEven though\
    \ it’s pretty small, this is a fully-functioning Go project, and as all good projects\
    \ should, it contains some tests. The next thing for us to do is to *run* them.\n\
    \n**GOAL:** Run the tests for this project and make sure they pass. The following\
    \ instructions will show you how to do that.\n\nStill in the `calculator` folder,\
    \ run the command:\n\n**`go test`**\n\nIf everything works as it should, you will\
    \ see this output:\n\n```\nPASS\nok      calculator      0.234s\n```\n\nThis tells\
    \ us that all the tests passed in the package called `calculator`, and that running\
    \ them took 0.234 seconds. (It might take a longer or shorter time on different\
    \ computers, but that’s okay.)\n\nIf you see test failure messages, or any other\
    \ error messages, there may be a problem with your Go setup. Don’t worry, everybody\
    \ runs into this kind of issue at first. Try Googling the error message to see\
    \ if you can figure out what the problem is, and check the installation instructions\
    \ on the Go website here:\n\n*   [https://go.dev/learn/](https://go.dev/learn/)\n\
    \nOnce the test is passing, you can move on!\n\nTry using your editor’s Go support\
    \ features to run the test directly in the editor. For example, in Visual Studio\
    \ Code, there’s a little *Run test* link above each test function, and a *Run\
    \ package tests* link at the top of the file. Find out how to do this in the editor\
    \ you’re using, and run the test successfully.\n\n## Formatting code with `gofmt`\n\
    \nThe next thing to do is ensure that our Go code is formatted correctly. All\
    \ Go code is formatted in a standard way, using a tool that comes with Go called\
    \ `gofmt` (pronounced, in case you were wondering, “go-fumpt”). In this exercise\
    \ we’ll see how to use it to check and reformat Go code (if necessary).\n\nFirst,\
    \ let’s introduce a deliberate formatting error into the code, so that we can\
    \ try to find it with `gofmt`. Edit the `calculator.go` file and look for this\
    \ line:\n\n```\n\n```\n\n([Listing 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator.go))\n\
    \nInsert an extra space before the word `Add`, so that the line looks like this:\n\
    \n```\n\n```\n\n**GOAL:** Run `gofmt` to check the formatting and find out what\
    \ is wrong:\n\n**`gofmt -d calculator.go`**\n\n```\n...\n // Add takes two numbers\
    \ and returns the result of adding\n // them together.\n-func  Add(a, b float64)\
    \ float64 {\n+func Add(a, b float64) float64 {\n        return a + b\n }\n```\n\
    \nIgnore the preamble for the moment, and focus on the lines beginning with `-`\
    \ and `+`:\n\n```\n-func  Add(a, b float64) float64 {\n+func Add(a, b float64)\
    \ float64 {\n```\n\n`gofmt` is telling us what it wants to do. It wants to remove\
    \ (`-`) the line that has the bogus extra space before the `Add` function, and\
    \ replace it (`+`) with a line where the space has been removed.\n\n**NOTE:**\
    \ If you’re using Windows, you may see an error like this:\n\n```\ncomputing diff:\
    \ exec: \"diff\": executable file not found in\n%PATH%\n```\n\nThis is because\
    \ the `gofmt` tool relies on there being a `diff` program in your `PATH` that\
    \ it can use to generate a visual diff of the file. If you don’t have `diff` installed,\
    \ or if it’s not in your default `PATH`, this won’t work. Don’t worry, though:\
    \ this isn’t a serious problem, and it won’t stop you being able to develop with\
    \ Go; it just means you won’t be able to use the `gofmt -d` command to check your\
    \ formatting.\n\nYou may find this Stack Overflow discussion helpful for resolving\
    \ this issue:\n\n*   [`gofmt -d` error on Windows](https://stackoverflow.com/questions/56206562/why-gofmt-d-gives-computing-diff-exec-diff-executable-file-not-found-in)\n\
    \n## Fixing format with `gofmt -w`\n\nWe could make the necessary formatting change\
    \ using an editor, but there’s no need: `gofmt` can do it for us automatically.\n\
    \n**GOAL:** Run:\n\n**`gofmt -w calculator.go`**\n\nThis will reformat the file\
    \ in place. Check that it’s worked by running `gofmt -d` on the file again. Now\
    \ there should be no output, because it’s already formatted correctly.\n\nIf you’re\
    \ using an editor that has Go support, set up the editor to automatically run\
    \ your code through `gofmt` every time you save it. This will help you avoid forgetting\
    \ to format your code.\n\nJust for fun, try experimenting with `gofmt` a little.\
    \ Try formatting code in different ways and see what changes `gofmt` makes to\
    \ it. It’s interesting to note what it does and doesn’t change.\n\nIf you like\
    \ `gofmt`, there’s a similar tool named [`gofumpt`](https://github.com/mvdan/gofumpt)\
    \ that works in much the same way, but does slightly more reformatting than the\
    \ standard `gofmt` tool.\n\n## Functions in Go\n\nLet’s take a closer look now\
    \ at the `Add` function and identify some important parts of function syntax in\
    \ Go:\n\n```\n\n```\n\n([Listing 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator.go))\n\
    \nThis is a *function declaration*. It tells Go the name of the function we’re\
    \ going to write, any *parameters* that it takes as its input, and any *results*\
    \ that it returns. Then come some statements within curly braces, known as the\
    \ *body* of the function. That’s the bit that actually does something.\n\nA function\
