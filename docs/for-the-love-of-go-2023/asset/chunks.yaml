    \ write a version of `Multiply` that we know doesn’t work and see if the test\
    \ detects it.\n\n**GOAL:** Write an incorrect version of `Multiply`, and show\
    \ that the test fails as a result.\n\nWe’ll be adding the new function to the\
    \ `calculator.go` file and it will look fairly similar to the existing `Add` and\
    \ `Subtract` functions. How exactly should we write the function incorrectly to\
    \ verify the test? Well it really doesn’t matter because literally any other result\
    \ than the correct one will do for our purposes. The easiest thing to do is probably\
    \ to return zero no matter what the inputs were:\n\nThis is what we call a null\
    \ implementation of the function. It compiles we can call it from a test and get\
    \ a result. But since the function doesn’t really do any calculation the result\
    \ is almost guaranteed to be wrong.\n\nRemember we are not interested in `Multiply`\
    \ right now. Our task is solely to show that the test we’ve written for `Multiply`\
    \ can correctly detect bugs in it. The fact that it always returns zero is a pretty\
    \ major bug! If we can’t detect that we’re off to a bad start. Let’s try:\n\n\
    `go test`\n\n```\n--- FAIL: TestMultiply (0.00s)\n    calculator_test.go:31: want\
    \ 9.000000, got 0.000000\n```\n\nGreat. That’s what we wanted. We’ve proved that\
    \ `TestMultiply` can detect at least this bug so it’s doing something. If we hadn’t\
    \ done that we’d really have no way of knowing whether `TestMultiply` could detect\
    \ any bugs at all—in other words, whether it really tests anything.\n\nNow that\
    \ we know it does, we can go ahead and write the real implementation of `Multiply`\
    \ with some confidence that the test will tell us whether or not we’ve got it\
