    ## 测试的结构


    所有测试在很大程度上遵循相同的结构：


    *   设置输入和预期结果

    *   调用函数并传递输入

    *   检查结果是否符合预期，如果不符合，则报错


    ## 开发流程


    1. 从编写测试开始（尽管函数还不存在）

    2. 看到测试失败，因为函数还不存在

    3. 编写必要的代码以让测试失败

    4. 确保测试失败时，错误信息是准确且具有信息量的

    5. 编写必要的代码以让测试通过

    6. 可选地，调整并改进代码

    7. 提交！


    这有时被称为“红-绿-重构”循环。失败测试阶段是“红”，通过测试阶段是“绿”，而美化代码是“重构”。在实践中，我们可能会多次通过循环。


    ## 比较浮点值


    大多数语言中表示小数的方法被称为*浮点数*（这就是为什么 Go 的小数类型被称为 `float64`）。而且关于浮点数的一点是它们具有有限的*精度*。如果你考虑三分之一的十进制，它是
    `0.33333...`，但它永远停止。在有限的位数（甚至在纸上）表示这样的数字不可避免会精度损失。


    让我们尝试在现有的 `TestDivide` 中添加这样一个用例：


    ```


    ```


    它以一个令人困惑的结果失败：


    ```

    Divide(1.000000, 3.000000): want 0.333333, got 0.333333

    ```


    看起来 `want` 和 `got` 是一样的，但测试失败了。它们之间的差异微小到在打印这些值时无法察觉，但足以让它们不相等。所以这不是比较此类值的正确方法。


    相反，我们可以添加一个函数来执行更宽松的比较：不是精确*相等*，而是“足够接近”，对于某种“足够”的值。


    让我们把它放在 `calculator_test` 包中，这是我们需要使用它的地方：


    ```


    ```


    然后我们可以使用这个函数而不是 `==` 来比较我们的 `tc.want` 和 `got` 值：


    ```


    ```


    第三个参数指定了值之间的差距在范围内范围内被视为“相等”。在这种情况下，差距是 `0.001`。我们可能需要根据测试用例或我们正在开发的特定程序的需求来调整这个值。例如，航天器导航程序所需的位数可能比机器人脑手术系统少。

