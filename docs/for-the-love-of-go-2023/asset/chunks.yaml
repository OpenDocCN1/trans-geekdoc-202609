  trans: '


    当 Go 在程序中遇到这样的循环时会发生什么？首先，会求条件的表达式的值。如果为 `true`，则执行大括号内部的语句。


    到目前为止，这就像一个 `if` 语句，但有一个转折。当 Go 到达循环末尾时，它会*再次*评估条件。如果条件*仍然*评估为 `true`，则循环体中的语句将再次执行，如此循环下去，或者直到条件变为
    `false` 为止。


    ## 无限循环


    由于省略条件等同于指定了条件 `true`（而它始终为真），你可以看到，没有条件的 `for` 循环将无限执行。（或者，至少直到你关闭电脑或通过其他方式中断程序。）我们可以称之为“无限循环”。


    这种循环有用吗？实际上是有用的！很多程序的工作就是无限重复某些过程：例如制造工艺。流水线上的焊接机器人只要流水线运行，就会反复执行相同的焊接序列。


    同样，HTTP Web 服务器等网络服务器运行着一个无尽的循环，等待请求到达、处理请求，然后返回等待状态。当然，有方法可以中断或关闭此类程序，但我们不需要将它们指定为循环的终止条件。


    ## 使用 `range` 遍历集合


    更常见的是，我们希望循环针对某些数据集合中的每个元素执行一次。例如，想象一个工资单程序，它的工作是为公司的每位员工计算并生成工资单。


    对于这样的程序，使用无限循环是没有意义的，因为它会达到一个点，即本月所有员工都已发放了工资，没有更多工作要做了。


    相反，编写一个针对切片（slice）或其他类型数据集合中的每个元素执行一次的循环会非常方便。`range` 关键字恰好可以做到。


    例如，假设我们有一个名为 `employees` 的切片变量，其中包含每个员工的数据（例如他们的工资）。我们可以使用 `for` 和 `range` 编写如下循环：


    ```go

    ```

    ```


    如果 `employees` 切片中有三个元素，那么这个循环将执行三次，打印输出输出：


    ```

    Found another employee!

    Found another employee!

    Found another employee!

    ```


    ## 从 `range` 接收索引和元素值


    然而，我们上一个例子中的循环并没有那么有用，因为尽管它可以为每位员工执行一组语句，但它并没有关于员工的任何*数据*（例如他们的工资）。因此，对于像工资单这样的程序，我们需要一种方法不仅为每个元素重复循环一次，还要让循环访问元素本身。


    正如你可能从我们在 Happy Fun Books 之前的工作中记得的，`range` 可以从切片返回最多两个值：每个元素的*索引值*（0, 1, 2, 3…）和*元素值*（元素本身）。


    例如：


    ```go

    ```

    ```


    在 `employees` 切片中提供适当的数据，可能会打印出如下内容：


    ```

    Employee number 0: Zhang Wen

    Employee number 1: Yu Luoyang

    Employee number 2: Qiu Zhenya

    ...

    ```


    通常，我们对索引值感兴趣，因此我们使用空白标识符（`_`）忽略它：


    ```go

    ```

    ```


    或者，如果我们*只*想要索引值，就不必费意提供任何变量来接收元素值了：


    ```go

    ```

    ```


    这是一个遍历数据的极其有用且常见的模式。也就是说，为切片中的每个元素、map 中的每个键值对或字符串中的每个 rune 执行一次一组语句。


    **目标：** 编写一个函数 `total`，它接收一个 `int` 切片并返回所有元素元素的和。例如，如果输入是 `[]int{1, 2, 3}`，该函数应返回
    6。


    ## 条件 `for` 语句


    让我们回到在本章早期介绍的*条件* `for` 循环，只要指定的某个条件为 `true`，它就会持续执行。正如我们所说，如果我们完全省略条件，等同于指定了条件
    `true`，循环将无限执行。但我们可以编写更有趣条件。


    例如，假设我们想打印 0 到 9 的数字。可以使用某个整数变量 `x`，并使用 `for` 语句反复打印 `x` 的值然后递增 `x`：


    ```go

    ```

    ```


    这种行为完全如你预期的，按顺序打印 0, 1, 2, 3 等值。但这个序列永远不会终止，因为我们从未告诉它停止！由于我们只对小于 10 的数字感兴趣，可以在
    `for` 语句中添加一个条件，指定循环只有在 `x` 小于 10 时才继续执行。这很直接：


    ```go

    ```

    ```


    现在循环完全执行了我们想要的操作，即打印 0 到 9 的数字然后停止。


    ## init 和 post 语句


    这种循环非常常见，以至于 Go 为我们提供了一个特殊的格式来方便地编写它。我们通常希望*初始化*某个变量为起始值，然后在其值满足某些条件时执行某些代码，然后以某种方式*更新*该值（例如递增）。


    因此，我们可以在条件之前添加一个初始化语句（称为 *init 语句*），并在条件之后添加一个更新语句，该语句在循环体*之后*执行（出于此原因被称为 *post
    语句*）。init 语句、条件和 post 语句由分号隔开。这是我们之前的示例用这种形式表示的：


    ```go

    ```

    ```


    这段代码产生的输出与之前完全相同，但它更紧凑。注意，初始化语句（`x := 0` 移动到了 `for` 语句内部、条件之前），而更新语句（`x++`）也移动到了
    `for` 语句内部、条件之后）。


    你现在可以看到，早的循环示例（`for x < 10`）实际上只是这种三部分 `for` 语句形式的一个特例，其中省略了 init 和 post 语句，只留下了条件表达式。


    这些对你来说可能有点复杂，但不要担心。在 Go 中，这种三部分的 `for` 语句并不常见，因为我们通常想做的是遍历某些数据（在这种情况下可以使用 `range`）或者只是无限循环，这完全不需要条件。


    **目标：** 编写一个函数 `evens`，使用三部分 `for` 语句打印 0 到 100（包含边界）的所有偶数。


    ## 使用 `continue` 跳到下一个元素


    我们已经看到了如何使用 `for` 循环来重复线性语句序列，但如果没那么简单呢？也许我们我们只想对数据的某些元素执行某些操作，而对其他元素不执行。


    我们的工资单程序可能只想为当前员工生成工资单，而不是那些辞职或退休的人。我们可以编写这样的代码：


    ```go

    ```

