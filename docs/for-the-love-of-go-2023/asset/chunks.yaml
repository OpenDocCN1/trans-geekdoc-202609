    3.  [Table of Contents](#nav.xhtml#toc)\n\n# Praise for *For the Love of Go*\n\
    \n> *A great way to dive into Go!*  \n\n> —Max VelDink\n\n> *One of the best technical\
    \ books I have read in a very long time.*  \n\n> —Paul Watts\n\n> *John is both\
    \ a superb engineer and, just as importantly, an excellent teacher / communicator.*\
    \  \n\n> —Luke Vidler\n\n> *A fantastic example of good technical writing. Clear,\
    \ concise and easily digestible.*  \n\n> —Michael Duffy\n\n> *This book’s writing\
    \ style feels as if John is speaking to you in person and helping you along the\
    \ way.*  \n\n> —@rockey5520\n\n> *Very well written, friendly, and informative.*\
    \  \n\n> —Chris Doyle\n\n> *John’s writing is personable, human and funny—his\
    \ examples are realistic and relevant. The test-driven instruction teaches Go\
    \ in a deep, meaningful and engaging way.*  \n\n> —Kevin Cunningham\n\n# Introduction\n\
    \n![](media/file0.png)\n\nHello, and welcome to learning Go! It’s great to have\
    \ you here.\n\n## What’s this?\n\nThis book is an introduction to the Go programming\
    \ language, suitable for complete beginners. If you don’t know anything about\
    \ Go yet, or programming, but would like to learn, you’re in the right place.\n\
    \nIf you do already have some experience with Go, or with programming in other\
    \ languages, don’t worry: this book is for you too! You’ll learn some ideas, techniques,\
    \ and ways of tackling problems that even many advanced Go programmers don’t know.\
    \ I hope to also help you fill in a few gaps in your knowledge that you may not\
    \ even be aware of.\n\n## What version of Go does it cover?\n\nThis book uses\
    \ Go 1.19, and all the code samples have been tested against at least that version.\
    \ However, Go puts a strong emphasis on backward compatibility, so all the code\
    \ in this book will still work perfectly well with later Go 1.x versions.\n\n\
    ## What you’ll need\n\nYou’ll need to install Go on your computer, if you don’t\
    \ have it already. Follow the instructions on the Go website to download and install\
    \ Go:\n\n*   [https://go.dev/learn/](https://go.dev/learn/)\n\nYou’ll also need\
    \ at least Go version 1.16 to run the code examples in this book. Run the following\
    \ command to see what version of Go you have:\n\n**`go version`**\n\n```\ngo version\
    \ go1.19 darwin/amd64\n```\n\nWhile all you need to write and run Go programs\
    \ is a terminal and a text editor, you’ll find it very helpful to use an editor\
    \ that has specific support for Go. For example, [Visual Studio Code](https://code.visualstudio.com/)\
    \ has excellent Go integration.\n\nThere’s a dedicated Go editor called GoLand\
    \ that you may come across: I *don’t* recommend this, at least for beginners.\
    \ Although GoLand is a very powerful tool for professional developers, it makes\
    \ some non-obvious choices about how to actually represent your Go code on screen,\
    \ and this can be confusing for newcomers. By all means try out GoLand to see\
    \ if you like it, but I’d recommend starting with Visual Studio Code and getting\
    \ used to that first.\n\nWhile not essential, it’s a great idea to use some kind\
    \ of *version control* software (for example, Git) to track and share your source\
    \ code. I won’t go into the details of how to install and use Git in this book,\
    \ but if you’re not already familiar with it, I recommend you learn at least the\
    \ basics. Go to [GitHub](https://github.com) to find out more.\n\n## Where to\
    \ find the code examples\n\nThere are dozens of challenges for you to solve throughout\
    \ the book, each designed to help you test your understanding of the concepts\
    \ you’ve just learned. If you run into trouble, or just want to check your code,\
    \ each challenge is accompanied by a complete sample solution, with tests.\n\n\
    All these solutions are also available in a public GitHub repo here:\n\n*   [https://github.com/bitfield/ftl-code](https://github.com/bitfield/ftl-code)\n\
    \nEach listing in the book is accompanied by a number (for example, [Listing 1.1](https://github.com/bitfield/ftl-code/tree/main/1.1),\
    \ and you’ll find the solution to that exercise in the numbered folder of the\
    \ repo.\n\n## What you’ll learn\n\nBy reading through this book and completing\
    \ the exercises, you’ll learn:\n\n*   How to write *tests* in Go and how to develop\
    \ projects guided by tests\n\n*   How to manage data in Go using built-in types,\
    \ user-defined struct types, and collections such as maps and slices\n\n*   How\
    \ to write and test *functions*, including functions that return multiple results\
    \ and error values\n\n*   How to use *objects* to model problems in Go, and how\
    \ to add behaviour to objects using *methods*\n\n*   How to use *pointers* to\
    \ write methods that modify objects, and how to use *types* and *validation* to\
    \ make your Go packages easy to use\n\n## The love of Go\n\nGo is an unusually\
    \ fun and enjoyable language to write programs in, and I hope to communicate something\
    \ of my own love of Go to you in this book. It’s a relatively *simple* language,\
    \ which isn’t the same as easy, of course. Programming is not easy, and no language\
    \ makes it easy. Some just make it a little more fun than others.\n\nGo lacks\
    \ many things that other programming languages have, and that’s no accident. In\
    \ some ways, the fact that Go doesn’t have many features is its best feature.\
    \ It has *enough* features to do everything we need to do in building software,\
    \ but no more. The fewer features there are, the less we have to learn, and the\
    \ more quickly we can get on to *using* our new tool to do interesting things.\n\
    \nBecause each little bit of code doesn’t really do much by itself, it’s quite\
    \ easy to read Go programs, even if you haven’t got much experience with Go. As\
    \ programmers, we don’t need to worry about choosing among many possible ways\
    \ to implement the same logic. This leaves us free to think about the much more\
    \ important issue of how to *structure* our programs in clear, simple ways that\
    \ are easy for readers to understand."
