    \ 将测试标记为失败，但它仍然继续执行测试的其余部分。\n\n相比之下，`t.Fatalf` 会立即退出测试；它表示情况已经糟糕到没有必要继续执行了。这里正是如此，因为如果\
    \ `err` 不是 `nil`，说明 `got` 值不应该被使用——它是无效的，因为在尝试生成它时发生了错误。\n\n如果我们成功通过了该检查而没有失败，我们就知道\
    \ `got` 值至少是*有效*的，即使不一定是*正确*的——我们现在将像之前的测试一样来检查这一点：\n\n```\n\n```\n\n这就是我们需要做的全部。这里是\
    \ `TestDivide` 的完整主体：\n\n```\n\n```\n\n```\n\n```（[代码列表 6.1](https://github.com/bitfield/ftl-code/blob/main/6.1/calculator_test.go))\n\
    \n如果我们现在运行 `go test`，假设没有拼写错误，我们应该期望看到一个编译错误，因为 `calculator.Divide` 还没有定义，所以我们确实看到了：\n\
    \n```\n./calculator_test.go:80:15: undefined: calculator.Divide\n```\n\n我们将在下一章介绍如何编写\
    \ `Divide` 本身。\n\n## 结语\n\n* 在编写多个相似的测试时，不要害怕复制粘贴现有的测试并修改它来实现你的需求（只需不要忘记检查是否已进行了所有必要的更改）。\n\
    * 编写测试的初始结果应该是编译器错误，如 `undefined: calculator.Multiply`（因为我们还没有写那个函数）。\n* 下一步是编写该函数的*空实现*，让它刻意返回错误的结果，这样我们就可以检查测试是否检测到了这种情况。\n\
    * 一旦我们验证了测试运行正常，就可以继续编写该函数的真实实现，而当测试通过时，我们就可以确信我们写得对了。\n* 当我们需要针对不同的输入多次测试某些行为时，我们可以使用*测试用例*的切片并对其进行循环，测试每一个用例。\n\
    * `for ... range` 循环将为切片中的每个元素执行一次某些代码。\n* 仅仅测试许多相似的案例没有意义：为了增加我们对函数正确性的信心，我们应该尝试我们所能想到的尽可能*不同*类型的案例：零、负数、空、反向、正向、侧向。\n\
    * Go 函数可以返回多个结果，而且通常如此：最常见的模式是*结果和错误*，其中错误值指示整个操作是否成功。\n* 如果函数的输入可以是*无效*的，那么函数的一个重要行为是在发生这种情况时返回一个非\
    \ `nil` 错误：为此编写一个单独的“无效输入”测试。\n* 总的来说，如果输入可以是无效的，函数的一个重要行为就是返回非 `nil` 错误。\n\n"
