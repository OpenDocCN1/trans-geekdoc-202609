    do something a little tricky. Instead of *calling* this function literal, let’s
    *append* it to a slice of such functions:


    ```


    ```


    Nothing has been printed out yet, because we haven’t *called* any of these three
    functions: we’ve simply stored them in a slice. Now let’s loop over that slice
    calling the functions. This is very easy:


    ```


    ```


    And here’s what it prints:


    ```

    3

    3

    3

    ```


    Wait, what? Why did this produce a different answer? The only change we made was
    to put off calling the functions until after the first loop had finished. So what’s
    going on? You might like to see if you can figure out the answer before reading
    on.


    We said that a function literal is a closure over certain variables, but what
    does that really mean? It means that when the function is called, it will be able
    to access the value of that variable. But *which* value? The value it had at the
    point the function literal was defined, or the value it has at the moment the
    function is called?


    We already know the answer, thanks to our program: it’s the value of the variable
    when the function is *called*, not when it’s *defined*. In our example, we set
    the variable `v` to the values 1, 2, and 3, in succession. So after the first
    loop has finished, `v` has the value 3; that’s straightforward.


    Now we call our three functions, each of which prints out the value of the variable
    `v`. And we know that’s 3. So this behaviour is entirely correct and not surprising
    at all… once you know that that’s how closures work.


    In fact, any time you’re updating a variable that’s referenced by a closure, you
    need to be careful that you don’t inadvertently get the wrong result when the
    closure is called. This most commonly happens in loops, but it can happen in other
    places, too.


    ## Cleaning up resources


    It often happens that we do something in a Go function that requires some kind
    of cleanup before the function exits. For example, when we open a file, we must
    also close it before exit, or that resource will *leak* (that is, the garbage
    collector won’t be able to purge it from memory, because it thinks it’s still
    in use).


    The operating system and the Go runtime need to maintain some data about open
    files, and this takes up memory space, so if we keep opening files and never closing
    them, eventually we will run out of memory. The same applies to any resource that
    takes up memory.


    To avoid this, we might write something like the following:


    ```


    ```


    Fine! The resource is cleaned up. But you know that a function can exit at any
    point by using `return`, not just at the end. This creates a potential problem,
    doesn’t it? What if we exit before `f.Close()` is called? That would mean `f`
    is never closed, and it will hang around in memory forever. For simple, one-shot
    programs like CLI tools, that’s maybe not so serious. But for long-running programs
    like servers, it will mean that the program’s resource usage keeps growing, until
    eventually it crashes.'
