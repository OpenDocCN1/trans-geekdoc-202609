    如果我们是勤奋且自律的程序员（毫无疑问我们是这样的），我们只需要尝试记住在函数可能返回的每一个地方调用 `f.Close()`。但没有人是完美的，如果其他人对这个函数进行了修改，他们可能甚至不会意识到他们应该在退出前关闭
    `f`。如果有多个资源需要清理，这可能还会导致大量的重复代码。


    我们真正想要的是某种方式，来表述为：“当这个函数准备退出时，无论在何处或以何种方式，都确保 `f` 被关闭”。


    ## `defer` 关键字


    事实证明，Go 的 `defer` 关键字正是我们要寻找的。一个 `defer` 语句接收某个函数调用（例如 `f.Close()`）并将其推迟执行。


    也就是说，它不会在*现在*调用该函数，而是将其“记住”以备后后用。当函数由于任何原因即将退出时，那个推迟的函数调用才会真正发生。


    在我们的文件示例中，它看起来是这样的：


    ```

    ```

    ```


    这里发生了什么？首先，我们尝试通过调用 `os.Open` 来获取 `f`。这可能会失败，在这种情况下，我们不需要担心关闭文件，因为我们无法打开它！所以在这种情况下我们返回一个错误。


    但现在我们知道已经成功打开了 `f`，所以我们立即执行 `defer f.Close()`。这并没有关闭 `f`，但它“记住”了我们需要在退出时调用 `f.Close()`。


    现在我们可以在函数的其余部分做任何想做的事，因为我们知道无论发生什么，`f` 都会被自动关闭，而我们不需要去担心它。


    ## 多个 defer


    这并不常见，但有时我们确实需要推迟多个一个函数调用。例如，也许我们打开了两个文件，并且我们想要分别推迟关闭每一个文件。


    这是没问题的，我们可以在函数中根据意愿使用任意次数的 `defer` 关键字，所有的推迟调用都会在函数退出时执行。值得知道的是，调用是按反序执行的：也就是说，最后推迟的最先运行。这有时被称为*栈式推迟*（stacking
    defers）。


    ```

    ```


    ```


    ## 命名结果参数


    回想上一章，当我们声明函数的返回列表时，可以给这些结果命名，也可以不命名。（通常我们不需要）。那么，我们以及为什么要给它们命名呢？


    其中一个非常重要的原因是*文档化*。毕竟，源代码是写给人类看的，而不是机器的。如果从函数签名中无法看出它的结果代表什么，那么给它们命名会有帮助。以我们之前的例子为例：


    ```

    ```


    如果根据名称判断，这个函数假定是获取你的位置，并返回两个 `float64` 结果（可能还有一个 `error`）。但这两个结果*到底*是什么？我们可以通过给它们命名来让它们更清晰：


    ```

    ```


    现在读者可以看到第一个值是纬度坐标（在某个约定的坐标系中），第二个是经度。我们可能*猜到*情况确实如此，但看到它被显式地写出来是很棒的。


    我们不需要因为结果被命名了就在函数中做任何特殊处理；我们继续像返回其他其他结果一样返回它们：


    ```

    ```


    但有一个方便的副作用；结果参数现在可以在函数内部可用供我们引用，就像它们是输入参数或局部变量一样。因此，我们可以给它们赋值，例如：


    ```

    ```


    ## 裸返回被认为是有害的


    [Go 规范](https://golang.org/ref/spec) 实际上允许我们在这种情况下省略 `return` 语句中的名称，这将隐式地返回 `latitude`
    和 `longitude` 的当前值。但这种做法通常被推荐的。

