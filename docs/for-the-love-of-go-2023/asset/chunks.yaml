    \ change is worth making in any case, but it’s interesting that it was more or\
    \ less forced on us just by trying to test the function.\n\nAnd we should expect\
    \ to change our minds like this many times during the process of building a package,\
    \ as we work through the TDD process. It’s not a sign that we did anything wrong:\
    \ in fact, we did everything right. We proceeded step by step from our analysis\
    \ of the required behaviour, and evolved our API design by using it to do something\
    \ specific, rather than reasoning about it in the abstract.\n\nSo now we have\
    \ something that we can actually test: we can look at `fakeTerminal` afterwards\
