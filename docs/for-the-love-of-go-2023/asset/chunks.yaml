    ```


    ```


    The compiler will complain about this:


    ```

    cannot assign to struct field catalog[1].Title in map

    ```


    Unfortunately, Go doesn’t allow you to modify fields of map elements directly
    like this. Instead, we have to get the element out of the map, assign it to some
    variable, and modify that variable instead. We can then use the modified value
