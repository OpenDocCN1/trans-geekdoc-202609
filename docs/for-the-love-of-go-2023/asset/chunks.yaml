    Go 中，你不太会有使用 `goto` 的充分理由，如果你想编写清晰、可读的代码，就应该避免使用它。


    ## 总结


    - `switch` 语句是一种简洁的方法，根据某些条件从多个可能的 *cases* 中选择一个，而无需编写大量连续的 `if ... else ...`
    语句。

    - `switch` 语句中的每个 case 都可以有一个条件，在这种情况下 Go 按顺序评估每个 case，并执行第一个条件为真的 case（如果有的话）。

    - 如果存在名为 `default` 的 case，则当且仅当没有其他 case 被匹配时，它才会被执行。


