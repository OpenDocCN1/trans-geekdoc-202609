    \ just see what that failure looks like:\n\n```\nwant error setting -1, got nil\n\
    ```\n\nGreat! Now we can go ahead and make it pass.\n\n**GOAL:** Add validation\
    \ to `SetPriceCents` so that it passes.\n\nHere’s one way to do it:\n\n```\n```\n\
    \n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore.go))\n\
    \n## Always valid fields\n\nThis is a big improvement, because now if some programmer\
    \ calls `SetPriceCents` with an invalid price, the program will detect it and\
    \ alert them.\n\nBut what’s to stop someone from just setting the field directly?\
    \ Books are usually arranged by category. What’s valid? Well, in this case it\
    \ would have to be one of a predefined set of values, representing the categories\
    \ we have: \"Romance\", \"Western\", or \"Quantum Mechanics\".\n\nAdding a `string`\
    \ field to the struct is no problem, but we want to make it impossible for people\
    \ to assign arbitrary values to it. One way would be to make the field unexported\
    \ (`category`), and then it won’t be possible to access this field outside the\
    \ `bookstore` package.\n\nPeople will still need to be able to set and read that\
    \ field, naturally, but we can give them a way to do that using methods. For example,\
    \ they could read the category by calling a method `Category` on the book, and\
    \ set it by calling `SetCategory`. These are sometimes called accessor methods,\
    \ since they give users a way to access a field they otherwise couldn’t.\n\nThis\
    \ is exactly the same idea as with `SetPriceCents`, except that we’re making the\
    \ relevant field unexported. See if you can write the appropriate tests before\
    \ reading on to see how I’d approach this.\n\n**GOAL:** Write tests for a `SetCategory`\
    \ method on `Book`, including both valid and invalid input cases. For the moment,\
    \ let’s assume that we only have one valid category, \"Autobiography\", and that\
    \ trying to set any other category would cause an error.\n\nLet’s consider the\
    \ invalid input case first this time, because it’s usually easier. We’ll start\
    \ with a book:\n\n```\n```\n\n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore_test.go))\n\
    \nWe’ll try to set some non-existent category on it (that is, any category other\
    \ than \"Autobiography\"), and fail the test unless there’s an error:\n\n```\n\
    ```\n\n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore_test.go))\n\
    \nThe valid input case starts out similarly, except that it doesn’t expect an\
    \ error:\n\n```\n```\n\n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore_test.go))\n"
  trans: "\n\n一位明明的书商知道如何调整价格以适应需求。因此，我们需要能够更新 Happy Fun Books 中书籍的价格，而且我们不希望直接修改\
    \ `PriceCents` 字段，因为没有办法对这种更改进行验证。\n\n相反，假设我们创建了一个方法来为我们完成更改。将其命名为 `SetPriceCents`。我们可以将新价格作为参数传递给它，重要的是，它能够检查价格以确保它不是负数。\n\
    \n**目标：** 为 `Book` 类型的 `SetPriceCents` 方法编写合适的测试。你至少需要两个测试，因为我们认为存在两种不同的行为：一种针对有效输入，另一种针对无效输入。如果你遇到困难，可以参考你之前为验证其输入的函数编写的测试，例如\
    \ `calculator.Divide` 和 `bookstore.GetBook`。\n\n让我们先考虑有效输入的情况。我们需要一些 `Book` 值来操作，所以让我们从定义它开始：\n\
    \n```\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore_test.go))\n\
    \n我们将在该值上调用 `SetPriceCents` 方法并传入一个新价格（假设为 3000），这就是我们 `想要` 它之后的价格：\n\n```\n```\n\
    \n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore_test.go))\n\
    \n由于这是有效输入的情况，我们不期望在这里遇到错误，所以如果看到错误，测试就应该失败。最后，我们将按照惯常方法比较 `want` 和 `got`。\n\n\
    ```\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore_test.go))\n\
    \n**目标：** 让这个测试通过。\n\n由于我们现在不需要实际执行任何验证，这应该非常简单。我们可以在 `Book` 类型上定义一个方法 `SetPriceCents`。让我们尝试一下：\n\
    \n```\n```\n\n这看起来很合理，但存在一个问题：\n\n```\n--- FAIL: TestSetPriceCents (0.00s)\n \
    \   bookstore_test.go:21: want updated price 3000, got 4000\n```\n\n哦！哪里出问题了？你能想出来吗？\n\
    \n回想一下上一章介绍指针的内容，如果一个方法 supposed 要修改其接收者（receiver），那么接收者必须是指针类型（例如，`*Book`）。\n\
    \n相反，如果我们不小心写了一个值方法（即接收非指针接收者的方法，例如 `Book`），那么我们在方法中对它进行的任何更改都不会持久。这可能会导致在不仔细测试的情况下难以检测的细微错误。\n\
    \n事实上，`staticcheck` 检查器（Visual Studio Code 以及其他 Go 编辑器会自动为你运行它）会向你警告这个问题：\n\n\
    ```\nineffective assignment to field Book.PriceCents (SA4005)\n```\n\n如果你不确定是否理解了这个问题，或者如何解决它，请复习指针的章节。如果你在这个概念上遇到困难，不要感到沮丧：这是一个让很多第一次学习\
    \ Go 的人困惑的概念。\n\n解决方案是像我们在上一章中对 `Double` 方法所做的那样：将其修改为接收指针接收者而不是值。\n\n```\n```\n\
    \n## 自动解引用引用\n\n在上一章中，你学习了当一个函数（或方法）想要对指针进行某些操作时，它需要先使用 `*` 运算符对其进行解引用，以获取它指向的值。我们在这里应该如何做呢？\n\
    \n实际上，我们什么都无需要做！我们可以像以前一样直接写：\n\n```\n```\n\n由于 `b` 现在是一个指针（具体说是 `*Book`），它是如何工作的？嗯，Go\
    \ 知道指针没有字段，只有结构体才有。所以如果你写了像 `b.PriceCents` 这样像结构体字段的内容，Go 足够聪明会认为你的意思是“解引用 `b`\
    \ 以获取它指向的结构体，然后修改它的 `PriceCents` 字段”。\n\n这被称为自动解引用，由于结构体上的大多数方法都是指针方法，这非常有帮助。否则，我们必须编写类似这样的代码，这感觉很笨拙：\n\
    \n```\n```\n\n考虑到这一点，我们可以再次尝试测试，看看在现在使用指针后，对 `PriceCents` 的更改是否已经持久化：\n\n```\n\
    PASS\n```\n\n太好了！有效输入的情况已经处理好了。我们可以继续编写无效输入情况的测试。\n\n```\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore_test.go))\n\
    \n我们尝试在书籍上设置一个负价格（-1 就可以了），除非 `SetPriceCents` 返回错误，否则我们的测试将失败。这就是这个测试需要做的所有工作。\n\
    \n它还没有通过，因为我们还没有完成这项工作，但让我们看看那个失败看起来是什么样的：\n\n```\nwant error setting -1, got\
    \ nil\n```\n\n太好了！现在我们可以继续让它通过。\n\n**目标：** 为 `SetPriceCents` 添加验证以使其通过。\n\n这里有一种实现方法：\n\
    \n```\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore.go))\n\
    \n## 有效的字段\n\n这是一个巨大的改进，因为现在如果程序员用无效的价格调用 `SetPriceCents`，程序将检测并提醒他们。\n\n但如何防止有人直接设置字段呢？书籍通常按类别分类。什么是有效的？嗯，在这种情况下，它必须是预定义集合之一，代表我们拥有的类别：“浪漫”、“西部”或“量子力学”。\n\
    \n向结构体添加 `string` 字段没有问题，但我们希望让人们无法分配任意值。一种方法是使字段变为私有（`category`），这样在 `bookstore`\
    \ 包之外就无法访问它。\n\n人们仍然需要能够设置和读取该字段，当然，但我们可以通过方法来实现。例如，他们可以通过调用书籍上的 `Category` 方法来读取类别，通过调用\
    \ `SetCategory`来设置。这些有时被称为访问器方法（accessor methods），因为它们为用户提供了原本无法访问字段的方法。\n\n这与\
    \ `SetPriceCents` 的想法完全相同，我们将相关字段变为私有。在继续阅读之前，看看你是否能写出相应的测试。\n\n**目标：** 为 `Book`\
