    to extend our calculator program from earlier in this book, so that instead of
    just adding *two* numbers, we could add any number of numbers.


    Let’s call this function `AddMany`. What would it look like? Here’s the beginning
    part of the function declaration:


    ```


    ```


    Notice that we only declare a *single* parameter, but its type is something strange.
    It’s `...float64`. What does that mean?


    The `...` indicates that there can be zero, one, two, or indeed any number of
    `float64` parameters to the function. Okay, fine. But how can we actually *refer*
    to the values of those parameters within the function? They don’t have names like
    `a` and `b`: all we have is the single parameter `inputs`.


    Well, inside the function body, `inputs` acts like a slice. For example, we can
    write a `for ... range` statement that loops over each element of `inputs`:


    ```


    ```


    See if you can do the rest. Use this idea to implement `AddMany` (with a suitable
    test, of course). Then extend your other functions `Subtract`, `Multiply`, and
    `Divide` to be variadic, too.


    For example, calling `DivideMany(12, 4, 3)` should divide 12 by 4, divide the
    result of that by 3, then return *that* result. Calling `MultiplyMany` with ten
    inputs should return the result of multiplying them all together.


    Once you’re done, or if you need some hints, have a look at my suggested solution
    in [Listing 8.3](https://github.com/bitfield/ftl-code/tree/main/8.3).


    ## Takeaways


    *   To declare a function, we begin with the `func` keyword, followed by the name
    of the function, a list of parameters, and a list of results.


    *   The parameter list gives the *name* and *type* of each parameter that the
    function receives.


    *   Similarly, the result list gives the types (and, optionally, the names) of
    the result values that the function returns, if any.


    *   This is followed by the function *body*, a list of statements enclosed in
    curly braces.


    *   Simply *declaring* a function doesn’t actually do anything, except notify
    Go that it exists: in order to execute the function’s code, we need to *call*
    it.


    *   A function call consists of the name of the function, followed by a list of
    arguments in parentheses (if the function takes no parameters, the parentheses
    are empty).


    *   We can use the results returned by a function call, if any, as part of an
    assignment.


    *   Inside a function body, we can exit the function early using a `return` statement;
    if the function returns results, we have to give a list of values with `return`,
    one for each declared result.


    *   Functions *themselves* are values in Go, so we can assign them to variables,
    or pass them as arguments to other functions, or even return them as results.


    *   When using a function as a value, we don’t necessarily have to give it a name;
    instead, we can write a *function literal*.


    *   A function literal can “see” all the variables in the enclosing function where
    it’s defined, thus making it what’s called a *closure* over them.


    *   This is powerful, since we can create a closure that executes later, but in
    this case we need to watch out for the enclosed variables being changed in the
    meantime—for example, in a loop.


    *   There are certain kinds of resources that can’t be automatically cleaned up
    by the Go garbage collector, such as file handles, which need to be explicitly
    closed by calling `Close`.


    *   We can try to remember to explicitly clean these up before any exit point
    from a function, but a better way is to use `defer`.


    *   The `defer` keyword lets us defer execution of some block of code until the
    current function exits: for example, cleaning up the resource.


    *   If we *stack* defers by using several `defer` statements, the deferred code
    will be run in reverse order on exit: the last thing deferred is the first thing
    to run.


    *   You can name a function’s result parameters, and the main value of this is
    to tell users and readers what those results *signify*: for example, latitude
    and longitude, rather than just `float64, float64`.


    *   *Naked* returns (bare `return` statements with no arguments) are legal syntactically,
    and you’ll even see them used in some [old blog posts](https://go.dev/blog/defer-panic-and-recover)
    and [tutorials](https://tour.golang.org/basics/7).


    *   But there’s no good reason to use a naked return, and it’s always clearer
    to return some explicit value, such as `nil`.


    *   When a function has named results, you can modify them in a deferred closure:
    for example, to return some error encountered when trying to clean up resources.


    *   Just because a function has named results doesn’t mean it *must* use a naked
    return: it *can*, but it shouldn’t, for the reasons we’ve discussed.


    *   A *variadic* function can take any number of arguments (including zero), using
    the special `...` form, and its arguments will appear inside the function as successive
    elements of a slice.


    # 14: Building blocks


    ![](media/file14.png)


    Most of the Go code that you or I write will be in the form of importable *packages*:
    useful, reusable chunks of functionality that we or other people can build into
    our programs. So what’s a *program*?


    Ultimately, if our Go code is to be any use to the world, it will need to be *executed*,
    that is to say, some actual computer somewhere will start our program, follow
    its instructions all the way to the end, and then stop. (Or not. Some programs,
    like network servers, are designed to run forever, or if not forever, then at
    least for the foreseeable future.)


    In this chapter, we’ll see how that works, and we’ll take a peek into the interesting
    world of *command-line tools* in Go.


    ## Compilation


    In order for your program to run there needs to be some *executable binary*: a
    file containing machine code that your computer’s CPU can understand, in a special
    format defined by your operating system.


    When you run the program, whether by typing its name on a command line in a terminal
    session, or invoking it through a graphical interface such as the macOS Finder,
    the operating system knows how to load this file into memory and start executing
    the machine code at the right point.


    Go uses a program called a *compiler* (that’s what gives you all the angry messages
    about undeclared variables and mismatched types). The compiler reads your Go source
    code and translates it directly into machine code, producing an executable binary
    that you can then run.


    All you need to distribute to the computer that will run your program is the executable
    binary file. This makes it very convenient to build and distribute Go programs:
    there’s only a single file to manage.


    ## The `main` package


    In order for a bunch of Go source code to produce an executable, there has to
    be at least some code in a special package named `main`. Since you can’t have
    more than one package in the same folder (apart from test packages), you’ll need
    to put your `main` package in a subfolder of your project. Because the `main`
    package produces a *command* (that is, an executable), it’s conventional to name
    this folder `cmd` (short for ‘command’).


    It’s not enough just to declare a `main` package, though. Whatever your program
    does, it has to *start* somewhere, and the Go compiler needs to know where that
    should be. The way we tell it is by defining a special function, also named `main`.


    ## The `main` function


    The flow of control in a Go program begins at the beginning of the `main` function,
    and proceeds from there in the way that you’re already familiar with from the
    previous chapters in this book.


    If `main` calls other functions, such as standard library functions like `fmt.Println`,
    or functions in your other packages, those will be executed, and control will
    then return to `main`.'
