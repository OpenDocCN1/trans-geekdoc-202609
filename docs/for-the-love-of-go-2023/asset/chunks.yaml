    \ it’s invalid.\n\n# 3. Errors and expectations\n\n![](media/file3.png)\n\nSo\
    \ how do we actually write the `Divide` function in order to pass the test we\
    \ wrote in the previous chapter? Let’s start by copying, pasting, and modifying\
    \ one of our existing arithmetic functions, such as `Multiply`.\n\n## Returning\
    \ an error value\n\nWe might produce something like this as a first draft:\n\n\
    ```\n\n```\n\nIt looks reasonable, so let’s try to run the tests and see what\
    \ we get.\n\n```\n./calculator_test.go:80:12: assignment mismatch: 2 variables\n\
    but calculator.Divide returns 1 values\n```\n\nApparently we’re not quite there\
    \ yet. What is this compiler error telling us? Let’s first of all look the relevant\
    \ file (`calculator_test.go`) and line (80):\n\n```\n```\n\nThe words “assignment\
    \ mismatch” tell us that the assignment here isn’t valid because the two sides\
    \ don’t match. We need the same number of variables on the left as there are values\
    \ on the right. And the compiler is telling us we have “2 variables” on the left,\
    \ which is perfectly correct, but the `Divide` function “returns 1 values”. This\
    \ can’t be right, because we need 2 values.\n\nWhy does the compiler think that\
    \ `Divide` returns one result? Because that’s what the function signature says:\n\
    \n```\n\n```\n\nBut we’ve said we now want to return *two* results, of type `float64`\
    \ and `error` respectively. Let’s make that change:\n\n```\n\n```\n\nNotice that\
    \ now we have to put parentheses around the list of results: `(float64, error)`.\
    \ When we had only one result, we could omit those, but now they’re required.\n\
    \nDoes this fix the problem? Well, only partially:\n\n```\n./calculator.go:30:2:\
    \ not enough arguments to return\n        have (float64)\n        want (float64,\
    \ error)\n```\n\nThe error messages from the Go compiler can be a bit intimidating\
    \ when you’re not used to them, but they’re extremely accurate and comprehensive.\
    \ They have all the information necessary to fix the problem, if only we can understand\
    \ them.\n\nLet’s break this error message down. First of all, it’s saying the\
    \ problem is in the `calculator.go` file at line 30. Here it is:\n\n```\n\n```\n\
    \nAnd the problem is “not enough arguments to return”. In other words, it was\
    \ expecting more values following the `return` keyword than it actually got. To\
    \ be even more specific:\n\n```\nhave (float64)\nwant (float64, error)\n```\n\n\
    So we *have* `float64`; that’s the value of `a / b`, which since both `a` and\
    \ `b` are `float64`, must itself be `float64`. But we *want* `float64, error`.\
    \ In other words, the function signature promised to return two results, `float64`\
    \ and `error`, and currently it’s only *returning* the `float64` value.\n"
