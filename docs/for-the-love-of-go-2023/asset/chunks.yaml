    \ want updated price 3000, got 4000\n```\n\nOops! What’s gone wrong? Can you figure\
    \ it out?\n\nRecall from the previous chapter introducing pointers that if a method\
    \ is supposed to modify its receiver, then the receiver must be a pointer type\
    \ (for example, `*Book`).\n\nIf instead we accidentally wrote a value method (one\
    \ that takes a non-pointer receiver, such as `Book`), then any changes to it we\
    \ might make in the method don’t persist. This can lead to subtle bugs that are\
    \ hard to detect without careful testing.\n\nIn fact, the `staticcheck` linter\
    \ (Visual Studio Code and some other Go editors run this for you automatically)\
    \ will warn you about this problem:\n\n```\nineffective assignment to field Book.PriceCents\
    \ (SA4005)\n```\n\nIf you’re not sure you understand the issue, or how to solve\
