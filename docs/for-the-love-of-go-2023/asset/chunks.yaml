    \ a Go test fails, it shows the exact file and line where the failure happened,\
    \ as well as what failed.\n- The `import` keyword tells Go what other packages\
    \ we want to use in this particular Go file.\n- The `testing` package is part\
    \ of Go’s standard library, and it provides everything we need to write and run\
    \ tests.\n- The names of test functions begin with the word `Test`, and they take\
    \ a `*testing.T` parameter which lets us control the test execution.\n- Use the\
