    ## Struct literals


    We’ve seen some literals of basic types already (`99` is an `int` literal, for
    example). Can we write struct literals too? Yes, we can. They look like this:


    ```


    ```


    The literal begins with the name of the type (`Book`), followed by curly braces.
    Then we write inside the curly braces a list of pairs of field names and values
    (for example, `Title: "Nicholas Chuckleby"`). Each field, including the last one,
    must be followed by a comma. Note that the struct definition itself doesn’t have
    commas at the end of each line, but struct literals must.


    ## Assigning a struct literal


    So now we know how to write a value of type `Book`, what shall we do with it?
    Here’s one idea:


    ```


    ```


    ([Listing 10.1](https://github.com/bitfield/ftl-code/blob/main/10.1/bookstore_test.go))


    Wait, what? Is that a test? *How even?*


    It seems like this isn’t really testing anything, because there’s no way for it
    to fail. There’s no call to `t.Error`, for example, or even any `if` statement
    that could *decide* whether the test passes or fails. It should always pass.


    So what’s actually happening in this test? There’s some struct literal of type
    `Book`, and we’re assigning it to something. To what?


    Remember earlier when we used the blank identifier (`_`) to ignore a value, because
    we didn’t need it? It’s the same thing here. We don’t want to *do* anything with
    this `Book` value. We just want to *mention* it, to help us get our ideas straight
    about what the `Book` type is and what fields it has.'
