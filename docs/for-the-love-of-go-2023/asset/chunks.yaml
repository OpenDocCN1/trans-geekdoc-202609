    \ with this concept: it’s one that trips up many, many people learning Go for\
    \ the first time.\n\nThe solution is to do just what we did with the `Double`\
    \ method in the previous chapter: modify it to take a pointer receiver instead\
    \ of a value.\n\n```\n```\n\n## Automatic dereferencing\n\nIn the previous chapter,\
    \ you learned that when a function (or a method) wants to do something with a\
    \ pointer, it needs to dereference it first, using the `*` operator, to get the\
    \ value that it points to. How would we do that here?\n\nActually, we don’t need\
    \ to do anything at all! We can write, exactly as we did before:\n\n```\n```\n\
    \nSince `b` is now a pointer (specifically, a `*Book`), how does this work? Well,\
    \ Go knows that pointers don’t have fields, only structs do. So if you write something\
    \ like `b.PriceCents` that looks like a struct field, Go is smart enough to assume\
    \ you meant “dereference `b` to get the struct it points to, then modify its `PriceCents`\
    \ field”.\n\nThis is called automatic dereferencing, and since most methods on\
    \ structs are pointer methods, it’s very helpful. We would otherwise have to write\
    \ something like this, which feels awkward:\n\n```\n```\n\nWith that in mind,\
    \ we can try the test again to see if the change to `PriceCents` has persisted,\
