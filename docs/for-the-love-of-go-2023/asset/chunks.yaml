    \ Tao of Go\n\n![](media/file15.png)\n\n> *You can make buffalo go anywhere, just\
    \ so long as they want to go there.*  \n\n> —Jerry Weinberg, [“Secrets of Consulting”](https://amzn.to/3uzcGE0)\n\
    \n*Tao* refers to the inner nature or natural tendency of things. For example,\
    \ water tends to flow downhill: that is its Tao. You can dam it, channel it, pump\
    \ it, or otherwise interfere with it, but despite all your efforts, it will probably\
    \ end up where it was going anyway.\n\nTo follow Tao, as a way of engaging with\
    \ the world, is to be sensitive to the natural tendency of things, and not to\
    \ waste energy struggling against them, but instead to go along with them: to\
    \ work *with* the grain, not against it.\n\nTo extend the water analogy, a poor\
    \ swimmer thrashes around making a lot of noise and fuss, but little actual progress.\
    \ A Taoist, on the other hand, surfs.\n\nSo what is the Tao of Go? If we were\
    \ to approach software development in Go in a sensitive, intelligent way, following\
    \ the natural contours of the language and the problem rather than trying to bulldoze\
    \ them out of the way, what would that look like? Let’s try to establish a few\
    \ general principles.\n\n## Kindness\n\n> *Here are my three treasures; look after\
    \ them! The first is kindness; the second, simplicity; the third, humility.* \
    \ \n\n> —“The Dàodé Jīng”](https://amzn.to/3PFTR9D)\n\nWhat does it mean to write\
    \ programs with kindness and compassion? It means that we write code for human\
    \ beings, not for computers. Those humans are fallible, impatient, inexperienced,\
    \ inattentive, and in every other way imperfect. We can make their lives (and\
    \ jobs) considerably easier by putting some thought into the design and detail\
    \ of our Go code.\n\nWe can be kind to our users by giving our packages descriptive\
    \ names, by making them easy to import, by documenting them well, and by assigning\
    \ them generous open-source licenses. We can design deep abstractions that let\
    \ users leverage small, simple APIs to access powerful, useful behaviours.\n\n\
    We can be kind to those who run our programs by making them easy to install and\
    \ update, by requiring a minimum of configuration and dependencies, and by catching\
    \ the most common usage mistakes and runtime errors and giving the user helpful,\
    \ accurate, and friendly information about what’s wrong and how to fix it.\n\n\
    We can be kind to those who have to read our code by being as clear, as simple,\
    \ and as explicit as possible. We can give types and functions meaningful names,\
    \ that make sense in context, and let users create their own programs using our\
    \ abstractions in straightforward, logical combinations. We can eliminate cognitive\
    \ roadblocks and speed bumps by sticking to conventions, implementing standard\
    \ interfaces, and doing the obvious thing the obvious way.\n\nFinally, we can\
    \ be kind to ourselves, by writing great tests, in the way that you’ve learned\
    \ to do in this book. Tests make it easy to understand, fix, and improve our programs\
    \ in the future. Without them, things can go downhill fast.\n\n> *Once a code\
    \ base turns to spaghetti, it is nearly impossible to fix.*  \n\n> —John Ousterhout,\
    \ [“A Philosophy of Software Design”](https://amzn.to/3NfCg6E)\n\nAnother way\
    \ to be kind to our future selves, and our successors, is to make small, continual\
    \ improvements to the program’s architecture and overall design. Good programs\
    \ live a long time (some bad ones, too), and the cumulative effect of many little\
    \ changes is usually to make the codebase messy, complicated, and kludgy. We can\
    \ help to avoid this by taking a little extra time, whenever we visit the codebase\
    \ on some errand, to refactor and clean it up. Since we rarely get the chance\
    \ to rewrite the system from scratch, investing small amounts of time in micro-improvements\
    \ over a long time is the only practical way to keep it healthy.\n\n## Simplicity\n\
    \nThe second virtue the Tao teaches us is frugality, modesty, simplicity: doing\
    \ a lot with a little, and eliminating clutter. Go itself is a frugal language,\
    \ with minimal syntax and surface area. It doesn’t try to do everything, or please\
    \ everyone.\n\n> *Our life is frittered away by detail. Simplify, simplify!* \
    \ \n\n> —Henry David Thoreau, [“Walden”](https://amzn.to/3aPAPyD)\n\nWe should\
    \ do the same, by making our programs small and focused, uncluttered, doing one\
    \ thing well. Deep abstractions provide a simple interface to powerful machinery.\
    \ We don’t make users do lots of paperwork in order to earn the privilege. Wherever\
    \ we can provide a simple API with sensible defaults for the common cases, we\
    \ do so.\n\nFlexibility is a good thing, but we shouldn’t try to handle every\
    \ case, or provide for every feature. Extensibility is great, but we shouldn’t\
    \ compromise a simple design to allow for things we don’t need. Indeed, a simple\
    \ program is easier to extend than a complicated one.\n\n## Humility\n\nThe third\
    \ treasure is humility. Like water, the Taoist seeks the low places, without striving,\
    \ competing, or attempting to impress others. Go itself is humble and pragmatic:\
    \ it doesn’t have all the high-tech features and theoretical advantages of some\
    \ other languages. Indeed, it deliberately leaves many features that are big selling\
    \ points of other languages. Its designers were less interested in creating an\
    \ impressive programming language, or in topping popularity polls, than in giving\
    \ people a small and simple tool for getting useful work done in the most practical\
    \ and direct way possible.\n\nGo recognises that we are prone to mistakes, and\
    \ it has many ways of protecting us from them. It takes care of allocating memory,\
    \ cleaning up things we’ve finished with, and warns us about unused imports or\
    \ variables. It’s a language designed for people who know they don’t know everything,\
    \ and who understand their own propensity for mistakes: humble people, in other\
    \ words.\n\n> *The most dangerous error is failure to recognize our own tendency\
    \ to error.*  \n\n> —Basil Liddell Hart, [“Why Don’t We Learn From History?”](https://amzn.to/3S7NY6Z)\n\
    \nAs Go programmers, we can be humble by not trying to be too clever. We are not\
    \ writing code to impress everybody with what terrific programmers we are: instead,\
    \ we are content to do the obvious thing. We express ourselves clearly and straightforwardly,\
    \ without feeling the need to obtrude our own personality on the code.\n\nWe use\
    \ the standard library when it solves the problem, and third-party packages only\
    \ when it doesn’t. If there’s a de facto standard package for something, we use\
    \ that: if it’s good enough for others, it’s good enough for us.\n"
  trans: "\n\n*   Go 程序的 `compiled` 形式是一种特殊文件，被称为 `executable binary`，它包含了针对特定 CPU\
    \ 类型和操作系统的机器码。\n*   要生成可执行二进制文件，我们的程序需要包含一个 `main` 包，并带有一个名为 `main` 的特殊函数，该函数是程序运行时的入口。\n\
    *   尽管如果存在名为 `init` 的函数，它会在 `main` 之前自动执行，也许是为了进行某些初始化工作。\n*   然而，使用 `init` 被广泛认为是一种糟糕的风格，因为我们可以使用普通的\
    \ `var` 语句以一种不那么“魔法化”的方式来初始化变量。\n*   `go build` 命令将带有 `main` 包的 Go 程序编译成我们可以运行的可执行二进制文件（或分发给他人以便他们运行）。\n\
    *   方便的是，通过使用 `GOOS` 和 `GOARCH` 环境变量，我们可以为任何我们 CPU 架构或操作系统构建可执行文件，而不仅仅是当前正在运行\
    \ `go build` 的系统。\n*   虽然程序在到达 `main` 结束时会自动退出，但也可以通过调用 `os.Exit` 函数在任何其他时间退出（例如，设置退出状态码）。\n\
    *   其他退出程序的方法（不推荐）是调用 `log.Fatal` 或 `panic`；但通常情况下，请不要使用 panic。\n\n# 15. Go 之道\
    \ (Tao)\n\n![](img/file15.png)\n\n> *你可以让水牛去任何地方，只要它们想去那里。*  \n\n> —Jerry Weinberg,\
    \ [《咨询的秘密》](https://amzn.to/3uzcGE0)\n\n*道*（Tao）指的是事物的内在本质或自然趋势。例如，水倾向于向下流：这就是它的“道”。你可以筑坝拦截、引导它、抽水，或以其他方式干扰它，但无论你如何努力，它最终可能还是回到它原本要去的地方。\n\
    \n遵循“道”作为一种与世界互动的方式，是对事物的自然趋势保持敏感，而不是浪费能量去斗争，而是顺应它们：*顺着*纹理工作，而不是逆势而为。\n\n延续水的类比，一个糟糕的游泳者拼命挣扎，发出巨大的噪音和混乱，但实际进展甚微。相比之下，道者在冲浪。\n\
    \n那么，Go 之道是什么？如果我们以一种敏感、智能的方式处理 Go 软件开发，遵循语言和问题的自然轮廓，而不是试图强行扫平障碍，那会是什么样子的？让我们尝试建立几条通用原则。\n\
    \n## 慈悲 (Kindness)\n\n> *此我有三件宝物；善加它们！第一是慈悲；第二是简单；第三是谦卑。*  \n\n> —[《道德经》](https://amzn.to/3PFTR9D)\n\
    \n带着慈悲和同情心编写程序意味着什么？这意味着我们是为人类编写代码，而不是为计算机。这些人类是会犯错的、没耐心的、缺乏经验的、注意力分散的，在各方面都是不完美的。通过在\
    \ Go 代码的设计和细节上花一些心思，我们可以让他们的生活（和工作）变得容易得多。\n\n我们可以通过给包起描述性的名称、使其易于导入、编写良好的文档以及分配慷慨的开源许可证来对用户保持慈悲。我们可以设计深层的抽象，让用户利用微小、简单的\
    \ API 来访问强大且实用的行为。\n\n我们可以通过让程序易于安装和更新、要求最少的配置和依赖、捕获最常见的用法错误和运行时错误，并向用户提供关于问题所在及修复方法的有用、准确且友的信息，对运行我们程序的人保持慈悲。\n\
    \n我们可以通过尽可能清晰、简单和明确来对必须阅读我们代码的人保持慈悲。我们可以为类型和函数赋予有意义的名称，使其在上下文中合理，并让用户通过直观、逻辑性的组合使用我们的抽象创建自己的程序。我们可以通过遵循约定、实现标准接口以及用显而易见的方法做显而易见的事，来消除认知障碍。\n\
    \n最后，我们可以通过编写出色的测试（正如你在书中学到的一样）来对自己保持慈悲。测试让我们在未来易于理解、修复和改进我们的程序。没有了它们，情况可能会迅速恶化。\n\
    \n> *一旦代码库变成意大利面条代码，就几乎无法修复。*  \n\n> —John Ousterhout, [《软件设计哲学》](https://amzn.to/3NfCg6E)\n\
    \n另一种对未来的自我和继任者保持善良的方法是对程序的架构和整体设计进行微小、持续的改进。良好的程序生命周期很长（有些坏程序也是如此），许多微小改变的累积效应会导致代码库变得混乱、复杂且拙劣。我们可以在每次因任务访问代码库时多花一点时间进行重构和清理，从而帮助避免这种情况。由于我们很少有机会从头重写系统，长期投入少量时间进行微改进是保持其健康的唯一可行方法。\n\
    \n## 简单 (Simplicity)\n\n“道”教给我们的第二种美德是节约、谦虚、简单：以少胜多，消除杂乱。Go 本身是一种节约的语言，语法和表面积最小。它并不尝试做所有事情或取悦所有人。\n\
    \n> *我们的生命被细节耗尽。简单，再简单！*  \n\n> —Henry David Thoreau, [《瓦登湖》](https://amzn.to/3aPAPyD)\n\
    \n我们也应该这样做，让我们的程序短小且聚焦、不杂乱，良好做好一件。深层抽象为强大的机制提供了简单的接口。我们不会让用户做大量的文书工作来获得这种权利。在任何我们可以为常见情况提供具有合理默认值的简单\
    \ API 的地方，我们就这样做。\n\n灵活性是好事，但我们不应该处理每一种情况，或为每个功能提供支持。可扩展性很棒，但我们不应该为了我们不需要的东西而牺牲简单的设计。事实上，一个简单的程序比复杂的程序更容易扩展。\n\
    \n## 谦卑 (Humility)\n\n第三件宝物是谦卑。像水一样，道者寻求低处，不奋斗、不竞争或试图给他人留下印象。Go 本身是谦卑且务实的：它没有某些其他语言的所有高科技特性和理论优势。事实上，它刻意留下了许多其他语言的卖点功能。它的设计师比起创建一个令人印象深刻的编程语言或在人气排行榜中领先，更感兴趣的是为人们一个简单的小工具，以最实用、直接的方式完成有用的工作。\n\
    \nGo 意识到我们容易犯错，它有许多方法保护我们免受错误影响。它负责分配内存、清理已完成的任务，并警告未使用的导入或变量。它是一种为那些知道自己无知并理解自己出错倾向的人设计的语言：换句话说，就是谦卑的人。\n\
    \n> *最危险的错误未能意识到我们自己犯错的倾向。*  \n\n> —Basil Liddell Hart, [《我们为什么不从历史中吸取教训？》](https://amzn.to/3S7NY6Z)\n\
    \n作为 Go 程序员，我们可以通过不试图表现太聪明而保持谦卑。我们写代码不是为了通过我们是优秀的程序员来打动所有人：相反，我们满足于做显而易见的事。我们清晰、直接地表达自己，而不需要将自己的个性强加于代码上。\n\
    \n当标准库可以解决问题时我们使用它，只有在它不能解决时才使用第三方包。如果某件事有事实标准包，我们就使用它：如果它对其他人来说足够，对我们来说也足够。\n\
    \n"
