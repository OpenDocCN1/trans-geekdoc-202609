- raw: "There’s a very useful standard library type called `strings.Builder` that\
    \ allows you to efficiently build up one big string from lots of little ones.\
    \ Let’s have a play with this type first, and then we’ll try to extend it with\
    \ some new methods.\n\nIn your `mytypes` package, start by adding a test that\
    \ will demonstrate how `strings.Builder` works:\n\n```\n\n```\n\n([Listing 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes_test.go))\n\
    \nLet’s break this down step by step. We don’t need to do anything special to\
    \ create a new `strings.Builder`; declaring a variable `sb` of that type is enough:\n\
    \n```\n\n```\n\n([Listing 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes_test.go))\n\
    \nWe can now write a couple of string fragments to the builder:\n\n```\n\n```\n\
    \n([Listing 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes_test.go))\n\
    \nThen we can retrieve the entire contents of the builder by calling its `String`\
    \ method, and we expect it to be the sum of the fragments we’ve written so far:\n\
    \n```\n\n```\n\n([Listing 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes_test.go))\n\
    \nTo get the length of the current contents, we call the builder’s `Len` method.\
    \ In this case, we expect the length to be 15, which is the number of characters\
    \ in the string `\"Hello, Gophers!\"`.\n\n```\n\n```\n\n([Listing 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes_test.go))\n\
    \n## Creating a type based on `strings.Builder`\n\nLet’s try defining a new type\
    \ based on `strings.Builder` and see what we can do with it. Suppose we call it\
    \ `MyBuilder`, for example:\n\n```\n\n```\n\nThis raises an interesting question.\
    \ Will `MyBuilder` have the same methods as `strings.Builder`? Let’s see what\
    \ happens if we write a test that calls the `Len` method on a `MyBuilder` value,\
    \ for example:\n\n```\n\n```\n\n([Listing 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes_test.go))\n\
    \nUnfortunately, this doesn’t compile:\n\n```\nmb.Len undefined (type mytypes.MyBuilder\
    \ has no field or\n    method Len)\n```\n\nIt looks like we don’t get `strings.Builder`’s\
    \ methods when we define a new type based on it. That’s a shame. But all is not\
    \ lost: because we defined `MyBuilder` ourselves, we can add our *own* methods\
    \ to it.\n\nFor example, suppose we wanted to add some method `Hello`, that just\
    \ returns the fixed string `Hello, Gophers!`. Not super useful, perhaps, but we’re\
    \ just experimenting. Let’s write a test first:\n\n```\n\n```\n\n([Listing 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes_test.go))\n\
    \nOver to you now to implement the method itself!\n\n**GOAL:** Make this test\
    \ pass. If you run into trouble, refer back to the previous chapter and the `MyInt`\
    \ type, with its `Twice` method.\n\nHere’s my version:\n\n```\n\n```\n\n([Listing\
    \ 20.1](https://github.com/bitfield/ftl-code/blob/main/20.1/mytypes.go))\n\n##\
    \ Wrapping `strings.Builder` with a struct\n\nSo, now we know how to create a\
    \ new type based on an existing type, and define our own methods on it. But what\
    \ if we *also* want our new type to have the methods of the underlying type? For\
    \ example, what if we wanted `MyBuilder` to have the `Len` and `String` methods\
    \ that `strings.Builder` has?\n\nWell, we can’t do that directly, but there *is*\
    \ a way to do something similar. We can create a *struct* type, with a field of\
    \ type `strings.Builder`. This is sometimes called *wrapping* `strings.Builder`.\n\
    \nLet’s see what that would look like by modifying our test. Suppose we name our\
    \ struct field `Contents`, and we assume that we’ll be able to call the usual\
    \ `strings.Builder` methods on it such as `WriteString`, `String`, and `Len`.\n\
    \n```\n\n```\n\n([Listing 20.2](https://github.com/bitfield/ftl-code/blob/main/20.2/mytypes_test.go))\n\
    \nWe expect some compilation errors here, since we haven’t yet updated the `MyBuilder`\
    \ type definition, and the compiler doesn’t disappoint us:\n\n```\nmb.Contents\
    \ undefined (type mytypes.MyBuilder has no field or\nmethod Contents)\n```\n\n\
    Can you figure out what to do?\n\n**GOAL:** Make this test pass.\n\nOne of the\
    \ nice things about developing software guided by tests is that, having done most\
    \ of the hard thinking in the test itself, we usually don’t find it too difficult\
    \ to write the necessary implementation. It’s merely a matter of cranking the\
    \ handle, if you like, and following the logic of what the test demands.\n\nIn\
    \ this case, we know that `MyBuilder` needs to be a struct type, because it has\
    \ a field. We also know what the name of that field must be, because it’s referenced\
    \ in the test as `Contents`.\n\nFinally, we know the type of that field, because\
    \ it needs to have the methods of `strings.Builder`:\n\n```\n\n```\n\n([Listing\
    \ 20.2](https://github.com/bitfield/ftl-code/blob/main/20.2/mytypes.go))\n\nThere’s\
    \ nothing magical about the way this works: in the test, `mb.Contents` is a `strings.Builder`,\
    \ so it has the methods that a `strings.Builder` has. But because `MyBuilder`\
    \ is a local type, defined by us, we can also add any methods to it that we want,\
    \ such as `Hello`.\n\nYou can see how to use this idea to extend any non-local\
    \ type that has methods, can’t you?\n\n**GOAL:** Write a test for a new type in\
    \ the `mytypes` package named `StringUppercaser`. This type wraps `strings.Builder`,\
    \ and adds a `ToUpper` method that returns the contents of the builder with all\
    \ characters converted to uppercase. Implement everything necessary to make the\
    \ test pass. (Hint: use the standard library function `strings.ToUpper` to do\
    \ the actual case conversion.)\n\nHere’s my attempt at the test:\n\n```\n\n```\n\
    \n([Listing 20.3](https://github.com/bitfield/ftl-code/blob/main/20.3/mytypes_test.go))\n\
    \nI’m assuming that there’ll be a `Contents` field on my struct type, as before,\
    \ that I can call `WriteString` on, but I’m also assuming, per the instructions,\
    \ that the struct type will have a `ToUpper` method. Here’s how I’ve implemented\
    \ that:\n\n```\n\n```\n\n([Listing 20.3](https://github.com/bitfield/ftl-code/blob/main/20.3/mytypes.go))\n\
    \nThere’s not much code here, so it’s tempting to think that nothing interesting\
    \ is going on. When you can confidently solve a challenge such as this, though,\
    \ it shows that you’ve fully understood some important rules about Go types and\
    \ methods—perhaps more deeply than many working Go programmers. If you get stuck\
    \ at any point, review the last couple of chapters and try to find the missing\
    \ step.\n\n## A puzzle about function parameters\n\nBy now, you know a bit about\
    \ functions in Go, though we haven’t talked about them in great detail. For example,\
    \ you know they can take *parameters*, which is to say that when you call a function,\
    \ you can pass some values to it.\n\nLet’s look a little more closely at how this\
    \ works. Suppose we write a test for a function in the `mytypes` package called\
    \ `Double`. It should take one parameter, an integer, and multiply it by 2.\n\n\
    Here’s something that should do the job:\n\n```\n\n```\n\n([Listing 21.1](https://github.com/bitfield/ftl-code/blob/main/21.1/mytypes_test.go))\n\
    \nNothing fancy here: `Double` is a function, not a method, and all it needs to\
    \ do is multiply its input by 2. Here’s my first attempt at an implementation:\n\
    \n```\n\n```\n\n([Listing 21.1](https://github.com/bitfield/ftl-code/blob/main/21.1/mytypes.go))\n\
    \nRecall from our work in an earlier chapter on the `Buy` function that Go lets\
    \ us write `input *= 2` as a short form for `input = input * 2`.\n\nSo does the\
    \ test pass now? Well, slightly surprisingly, no:\n\n```\n--- FAIL: TestDouble\
    \ (0.00s)\n    mytypes_test.go:14: want 24, got 12\n```\n\nWhat’s going on? Is\
    \ the `Double` function broken?\n\nActually, `Double` is doing exactly what we\
    \ asked it to do. It receives a parameter we call `input`, and it multiplies that\
    \ value by 2:\n\n```\n\n```\n\nSo why is it that, in the test, when we set `x`\
    \ to 12, and call `Double(x)`, the value of `x` remains 12? Shouldn’t it now be\
    \ 24?\n\n```\n\n```\n\n## Parameters are passed by value"
