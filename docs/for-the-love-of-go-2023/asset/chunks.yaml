    It’s very common to want to take different actions depending on the value of some
    variable or expression. For example, suppose you wanted to determine if `x` has
    the value 1, 2, or 3. A concise way to do this is to use a *switch expression*,
    which goes after the `switch` keyword but before the curly brace introducing the
    list of cases:


    ```


    ```


