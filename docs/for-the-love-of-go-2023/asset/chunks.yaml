    ## Takeaways


    *   When we want to retrieve a specified element from a collection *directly*,
    without looping to look for it, a *map* is a good choice of data structure.


    *   A map links *keys*, such as book IDs, to elements, and a map literal comprises
    a list of key-element pairs.


    *   Looking up a map element by key uses the same square-bracket notation as looking
    up a slice element by index: for example `catalog[ID]`.


    *   We can also assign a new element to a specified map key; if the key already
    exists, its old element will be replaced with the new one, and if it doesn’t exist,
    the new element will be added to the map.


    *   While you can *refer* to some field of a struct element in a map using the
    usual dot notation, you can’t *assign* to it: instead, you have to look up the
    element, store it in a variable, modify its field, and then write it back to the
    map.


    *   The result of looking up a key that doesn’t exist in the map is the zero value
    for the element type: for example, with a map of `Book`, if you look up some key
    that’s not in the map, you’ll get an empty `Book` value.


    *   If we receive a second `ok` value from the map lookup, it will tell us whether
    the key actually existed (`true`), or whether we’re just getting a default zero
    value instead (`false`).


    *   For functions like `GetBook` that retrieve a specified value, it makes sense
    to return `error` if the value doesn’t exist.


    *   And to make the error message more helpful, we can use `fmt.Errorf` to interpolate
    some data into it, such as the ID the user asked for.


    *   If we want a slice containing all the keys of some map, we can loop over the
    slice with `for ... range`, appending each key to our result slice.


    *   But the keys will be in a different, random order each time the program runs;
    this is by design, because maps just don’t *have* any defined key order.


    *   So if you don’t *care* about the order, which you shouldn’t if you’re using
    a map, then don’t *rely* on it, because it will keep changing.


    *   To simplify testing functions that return items from a map, we can use `sort.Slice`
    to sort the results so that we can compare them reliably.


