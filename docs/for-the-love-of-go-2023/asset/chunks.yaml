  trans: "\n测试的名称也需要更改，因为现在要求的行为不再是“打印到终端”，而是“打印到写入器（writer）”。这是一个非常符合 Go 风格的 API：我们不再局限于某个具体类型，而是使用接口（`io.Writer`）使我们的代码更加灵活且广泛适用。无论如何，这种变化都是值得的，但有趣的是，我们仅仅通过尝试测试该函数，就在某种程度上被迫使做出了这种改变。\n\
    \n在构建包的过程中，随着我们执行 TDD 流程，应该预期会这样多次改变主意。这并不意味着我们做错了任何事：事实上，我们所做的一切都是正确的。我们从对所需行为的分析开始逐步进行，并通过使用它来实现具体功能来演进我们的\
    \ API 设计，而不是在抽象中对其进行推演。\n\n现在我们有了可以实际测试的东西：之后我们可以查看 `fakeTerminal` 检查是否包含了预期的消息。我们定义了一个包含该消息的变量\
    \ `want`，将缓冲区的内容读入名为 `got` 的变量中，然后比较两者。\n\n## 开始的结束\n\n反思在编写测试过程中发生的事情是有意义的，因为我们完成了许多非常有用的设计工作：\n\
    \n* 我们决定了引擎包（engine package）的名字\n* 我们决定了入口函数（entrypoint function）的名字\n* 我们用文字记录了它预期的行为\n\
    * 我们注入了一个 `io.Writer` 以使包变得可测试，并防止不必要的终端输出\n\n这一切都是在我们编写第一行系统代码之前完成的。事实上，这完全合逻辑，因为如果我们一开始就开始写代码，那么在进行测试时最终将不可避免地不得不修改它。我们可能会把函数命名为\
    \ `Hello`，这在包内部是合理的，但在包外部则不然。我们可能会直接使用 `fmt.Println` 打印到终端，这在尝试测试它之前看起来是明智的。\n\
    \n这就是测试驱动开发的秘密法宝：通过先写测试（假装该函数已经存在），我们可以预先解决许多设计问题，并且还避免了编写出不可测试函数的陷阱。\n\n当然，我们最后还获得了一个测试，这太棒了，我们永远不应该低估拥有测试的价值（尝试在没有测试的情况下在一个非复杂的代码库上工作吧）。虽然大多数人都认为测试是必要的，但如果不是先编写测试，那么它们往往根本不会被编写。之后添加测试是非常困难的。如果没有重大的重构，甚至可能是不可能，而谁又想在没有测试安全网的情况下重构代码呢？\n\
    \n## 结语\n\n* 当我们尝试学习新的处理方式时，最好从我们已经熟悉的地方开始。\n* 包是力量倍增器，因此我们应该始终寻求编写一个可以在许多不同程序使用的包，而不仅仅是一个。\n\
    * 编写更好代码的一种良好方法是采用这种心态：我们在为数百万用户编写程序，而不仅仅是为了自己。\n* 既然没有人可以导入或测试你的 `main` 包，因此所有非复杂的行为都应该实现在可导入的包中。\n\
    * 一个 Go 程序可能包含许多包，但通常有一个核心引擎包提供了用户关心的主要功能。\n* 设计良好的包 API 的最佳方法——略微违反直觉——是从使用它开始，例如在测试中使用。\n\
    * 测试的重点应该是行为，而不是函数，这对于命令行工具尤为相关。\n* 如果你选择在其中放置信息，测试函数的名称可以包含有用信息。\n* 并行测试不仅更快，而且有助于发现潜在的并发漏洞，即使该包没有使用并发。\n\
    * 输出输出的函数应该接收一个 `io.Writer` 进行打印，这样我们可以在运行测试时避免噪音，并捕获输出进行检查。\n* 测试根本上是比较 `want`\
    \ 和 `got`，无论这在情况下意味着什么，因此这样编写测试有助于人们理解你的测试在寻找什么。\n* 先测试后设计包看起来很难，甚至是浪费时间，但它通过消除大量的重复工作让我们更快地获得良好的设计。\n\
    * 拥有测试也是很好的。\n\n## 进一步探索\n\n如果你急于阅读更多内容，请尽管进入下一章。如果你想进一步探索这些想法，我有一些小型项目建议，将让你有机会在\
    \ Go 中练习 TDD 原则。\n\n1. 如果你之前写过所有内容都在 `package main` 中的 Go 程序，尝试更新该程序以使用引擎包。\n\
    \   为程序程序的每个重要行为编写测试，并尝试组织包代码，使 `func main` 减少到极致。\n\n2. 不要写简单的打印“Hello, world”的程序，尝试写一个询问用户姓名然后打印“Hello,\
    \ [NAME]”的程序。\n   它的包 API 会长什么样？你会如何测试它？它的 `main` 函数又长什么样？\n\n3. 尝试写一个按以下格式打印当前时间的程序：\"\
    It's X minutes past Y\"。\n   假设你有一个执行此操作的函数，当你无法预知具体会打印什么时间时，该如何测试它？\n   你的测试在通过时不应产生任何输出（例如，当运行\
    \ `go test` 时，不能将时间打印到用户的终端）。\n\n"
