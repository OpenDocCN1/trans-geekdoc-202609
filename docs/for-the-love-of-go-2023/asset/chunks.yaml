- raw: "*   The *compiled* form of a Go program is a special kind of file called an\
    \ *executable binary*, containing machine code for a specific type of CPU and\
    \ operating system.\n\n*   To produce an executable binary, our program needs\
    \ to contain a `main` package, with a special function named `main` that is the\
    \ program’s entry point when it’s run.\n\n*   Though if a function named `init`\
    \ is present, it’s automatically executed even before `main`, perhaps to do some\
    \ initialisation, for example.\n\n*   However, it’s widely considered poor style\
    \ to use `init`, as we can initialise variables in a less magical way using plain\
    \ old `var` statements.\n\n*   The `go build` command compiles a Go program with\
    \ a `main` package into an executable binary that we can run (or distribute to\
    \ someone else so that they can run it).\n\n*   Conveniently, we can build an\
    \ executable for any CPU architecture or operating system we want, not just the\
    \ one we happen to be running `go build` on, using the `GOOS` and `GOARCH` environment\
    \ variables.\n\n*   While the program exits automatically when the end of `main`\
    \ is reached, it can also exit at any other time by calling the `os.Exit` function\
    \ (for example, to set an exit status code).\n\n*   Other ways to exit the program,\
    \ which are not recommended, are calling `log.Fatal` or `panic`; in general, though,\
    \ please *don’t* panic.\n\n# 15\\. The Tao of Go\n\n![](media/file15.png)\n\n\
    > *You can make buffalo go anywhere, just so long as they want to go there.* \
    \ \n\n> \n\n> —Jerry Weinberg, [“Secrets of Consulting”](https://amzn.to/3uzcGE0)\n\
    \n*Tao* refers to the inner nature or natural tendency of things. For example,\
    \ water tends to flow downhill: that is its Tao. You can dam it, channel it, pump\
    \ it, or otherwise interfere with it, but despite all your efforts, it will probably\
    \ end up where it was going anyway.\n\nTo follow Tao, as a way of engaging with\
    \ the world, is to be sensitive to the natural tendency of things, and not to\
    \ waste energy struggling against them, but instead to go along with them: to\
    \ work *with* the grain, not against it.\n\nTo extend the water analogy, a poor\
    \ swimmer thrashes around making a lot of noise and fuss, but little actual progress.\
    \ A Taoist, on the other hand, surfs.\n\nSo what is the Tao of Go? If we were\
    \ to approach software development in Go in a sensitive, intelligent way, following\
    \ the natural contours of the language and the problem rather than trying to bulldoze\
    \ them out of the way, what would that look like? Let’s try to establish a few\
    \ general principles.\n\n## Kindness\n\n> *Here are my three treasures; look after\
    \ them! The first is kindness; the second, simplicity; the third, humility.* \
    \ \n\n> \n\n> —[“The Dàodé Jīng”](https://amzn.to/3PFTR9D)\n\nWhat does it mean\
    \ to write programs with kindness and compassion? It means that we write code\
    \ for human beings, not for computers. Those humans are fallible, impatient, inexperienced,\
    \ inattentive, and in every other way imperfect. We can make their lives (and\
    \ jobs) considerably easier by putting some thought into the design and detail\
    \ of our Go code.\n\nWe can be kind to our users by giving our packages descriptive\
    \ names, by making them easy to import, by documenting them well, and by assigning\
    \ them generous open-source licenses. We can design deep abstractions that let\
    \ users leverage small, simple APIs to access powerful, useful behaviours.\n\n\
    We can be kind to those who run our programs by making them easy to install and\
    \ update, by requiring a minimum of configuration and dependencies, and by catching\
    \ the most common usage mistakes and runtime errors and giving the user helpful,\
    \ accurate, and friendly information about what’s wrong and how to fix it.\n\n\
    We can be kind to those who have to read our code by being as clear, as simple,\
    \ and as explicit as possible. We can give types and functions meaningful names,\
    \ that make sense in context, and let users create their own programs using our\
    \ abstractions in straightforward, logical combinations. We can eliminate cognitive\
    \ roadblocks and speed bumps by sticking to conventions, implementing standard\
    \ interfaces, and doing the obvious thing the obvious way.\n\nFinally, we can\
    \ be kind to ourselves, by writing great tests, in the way that you’ve learned\
    \ to do in this book. Tests make it easy to understand, fix, and improve our programs\
    \ in the future. Without them, things can go downhill fast.\n\n> *Once a code\
    \ base turns to spaghetti, it is nearly impossible to fix.*  \n\n> \n\n> —John\
    \ Ousterhout, [“A Philosophy of Software Design”](https://amzn.to/3NfCg6E)\n\n\
    Another way to be kind to our future selves, and our successors, is to make small,\
    \ continual improvements to the program’s architecture and overall design. Good\
    \ programs live a long time (some bad ones, too), and the cumulative effect of\
    \ many little changes is usually to make the codebase messy, complicated, and\
    \ kludgy. We can help to avoid this by taking a little extra time, whenever we\
    \ visit the codebase on some errand, to refactor and clean it up. Since we rarely\
    \ get the chance to rewrite the system from scratch, investing small amounts of\
    \ time in micro-improvements over a long time is the only practical way to keep\
    \ it healthy.\n\n## Simplicity\n\nThe second virtue the Tao teaches us is frugality,\
    \ modesty, simplicity: doing a lot with a little, and eliminating clutter. Go\
    \ itself is a frugal language, with minimal syntax and surface area. It doesn’t\
    \ try to do everything, or please everyone.\n\n> *Our life is frittered away by\
    \ detail. Simplify, simplify!*  \n\n> \n\n> —Henry David Thoreau, [“Walden”](https://amzn.to/3aPAPyD)\n\
    \nWe should do the same, by making our programs small and focused, uncluttered,\
    \ doing one thing well. Deep abstractions provide a simple interface to powerful\
    \ machinery. We don’t make users do lots of paperwork in order to earn the privilege\
    \ of calling our package. Wherever we can provide a simple API with sensible defaults\
    \ for the most common cases, we do so.\n\nFlexibility is a good thing, but we\
    \ shouldn’t try to handle every case, or provide for every feature. Extensibility\
    \ is great, but we shouldn’t compromise a simple design to allow for things we\
    \ don’t need yet. Indeed, a simple program is easier to extend than a complicated\
    \ one.\n\n## Humility\n\nThe third treasure is humility. Like water, the Taoist\
    \ seeks the low places, without striving, competing, or attempting to impress\
    \ others. Go itself is humble and pragmatic: it doesn’t have all the high-tech\
    \ features and theoretical advantages of some other languages. Indeed, it deliberately\
    \ leaves out many features that are big selling points of other languages. Its\
    \ designers were less interested in creating an impressive programming language,\
    \ or in topping popularity polls, than in giving people a small and simple tool\
    \ for getting useful work done in the most practical and direct way possible.\n\
    \nGo recognises that we are prone to mistakes, and it has many ways of protecting\
