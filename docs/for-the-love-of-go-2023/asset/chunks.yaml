    \ method in the previous chapter: modify it to take a pointer receiver instead\
    \ of a value.\n\n```\n\n```\n\n## Automatic dereferencing\n\nIn the previous chapter,\
    \ you learned that when a function (or a method) wants to do something with a\
    \ pointer, it needs to dereference it first, using the `*` operator, to get the\
    \ value that it points to. How would we do that here?\n\nActually, we don’t need\
