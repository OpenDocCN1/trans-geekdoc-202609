    ## Introducing structs


    Here at Happy Fun Books, we deal in many different kinds of data. Books are one
    example: a book has various kinds of information associated with it, including
    the title, author, price, ISBN code, and so on. In our online store, we’ll also
    need to deal with data about customers (name, address, and so on), and orders
    (which customers have ordered which books, for example).


    Instead of dealing with each piece of book data separately, as we’ve done so far,
    we’d prefer to deal with a book as a *single* piece of data in the system, so
    that we can (for example) pass a book value to a function, or store it in some
    kind of database.


    A data type made up of several values that you can treat as a single unit is called
    a *composite* type (as in, “composed of several parts”). One of the most useful
    composite data types in Go is called a *struct*, short for “structured record”.


    A struct groups together related pieces of data, called *fields*. For example,
    a struct describing a customer of our bookstore might have a field called `Name`
    for their name (a string would make sense for this). Another field we might need
    is `Email`, for their email address (let’s use `string` for this too).


    Here’s what a definition of a simple `Customer` type might look like, then:


    ```


    ```


    There’s more information we could store about customers, but this would be enough
    to get us started.


    Recall that earlier in this book you used a `testCase` struct type in your tests
    for the `calculator` package, to define the inputs and expected results for each
    case. Structs are a very convenient way to create a single value that contains
    multiple pieces of data inside it.


    ## Type definitions


    We begin with a comment, introduced by the `//` characters. It’s good practice
    to add an explanatory comment for each type you create in Go, telling readers
    what the type is intended to do. These are called *documentation comments*, because
    when you publish your project to a hosting site such as GitHub, your comments
    will be automatically turned into browsable documentation on the [pkg.go.dev](https://pkg.go.dev/)
    site. You can see some examples here:


    [https://pkg.go.dev/github.com/bitfield/script](https://pkg.go.dev/github.com/bitfield/script)


    Next, we can see a new keyword here: `type`. This introduces a new *type definition*.
    It’s followed by the name we want to give the type (`Customer`). It’s a bit like
    how the `var` keyword declares a variable. With the `type` keyword, we’re saying
    “Please create a type called… and here are the details…”


    The details, in this case, are the keyword `struct` (which introduces a struct
    type), and a list of fields inside curly braces `{ ... }`. Everything after `type
    Customer ...` is called a *type literal*. We’ve seen values before that were string
    literals, for example; here we have a type literal.


    ## Exported identifiers


    You might have wondered why the type is called `Customer`, with a capital C, instead
    of just `customer`. It turns out that names with initial capital letters have
    a special meaning in Go. Anything with such a name is available outside the package
    where it’s defined (we say it’s *exported*). If you define a type (or a function,
    a variable, or anything else) whose name starts with a lowercase letter (`customer`,
    for example), it is *unexported* and so you won’t be able to refer to it in code
    that’s outside this package (in a test, for example).


    You could think of exported names, with the initial capital letter, as identifying
    things that the package intends to be *public*, while the unexported names, with
    a lowercase initial letter, are *private* things that the package is going to
    use internally, but no one else needs to know about.


    ## The core package


    As you know, the *package* is Go’s way of organising chunks of related code. With
    most projects, there’s some kind of *core* package that implements the most basic
    functionality relating to the problem we’re solving. What would that be for our
    bookstore, and what should we name it?


    A single word is best, ideally a short word, and one that completely describes
    what the software is for. Let’s call our core package `bookstore`.


    ## The very first test


    As you’ll recall from our earlier work on the `calculator` package, we need to
    first of all decide what *behaviour* we want, and then write a *test* that specifies
    that behaviour precisely.


    Only once we’re happy with the test, and we’ve seen it fail when we *know* the
    system is incorrect, should we go on to write the code that *implements* that
    behaviour.


    So what’s the first behaviour we should try to describe and test for our bookstore
    application? We know we want a core `Book` type in our `bookstore` package, and
    it’s probably a good idea to set this up before anything else, but how can we
    create one if we’re not allowed to write any non-test code yet? What’s the behaviour
    that we would express as a test that requires `Book` to be implemented?


    Let’s get the project structure in place before answering this question. Create
    a new folder for the `bookstore` project if you haven’t yet, and run `go mod init
    bookstore` in it to create a new Go module here.


    Create a file named `bookstore_test.go`, and let’s start with the usual test preamble:


