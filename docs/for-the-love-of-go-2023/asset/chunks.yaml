- raw: "Like most Zen sayings, this sounds (and is) absurd, but aims to lead us to\
    \ something meaningful. If we usually only discover that the API is wrong when\
    \ we come to call it, let’s *start by calling it*, and save one entire wasted\
    \ design cycle. We will write calling code that is sensible, readable, and useful,\
    \ and only then proceed to implement everything necessary to make it work.\n\n\
    Let’s imagine that the engine package already exists, then, and start using it.\
    \ For example, let’s try to write a test. What should we write?\n\n## The first\
