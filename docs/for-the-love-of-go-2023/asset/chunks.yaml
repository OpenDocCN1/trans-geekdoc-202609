    \nSince this is the valid input case, we don’t expect an error here, so the test\
    \ should fail if we see one. Finally, we’ll compare `want` and `got` in the usual\
    \ way.\n\n```\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore_test.go))\n\
    \n**GOAL:** Make this test pass.\n\nSince we don’t need to actually do any validation\
    \ yet, this should be pretty straightforward. We can define a method `SetPriceCents`\
