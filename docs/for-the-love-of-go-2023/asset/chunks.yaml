    \nFirst, using your code editor, create a file in the `calculator` folder named\
    \ `calculator.go`. Copy and paste the following code into it:\n\n```go\n```([Listing\
    \ 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator.go))\n\n\
    If it’s not easy for you to copy and paste the code from this book, clone the\
    \ GitHub repository instead and copy from there:\n\n* [https://github.com/bitfield/ftl-code](https://github.com/bitfield/ftl-code)\n\
    \nDon’t worry about understanding all the code here for the moment; we’ll cover\
    \ this in detail later. For now, just paste this code into the `calculator.go`\
    \ file and save it.\n\nNext, create another file named `calculator_test.go` containing\
    \ the following:\n\n```go\n```\n\n([Listing 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator_test.go))\n\
    \nHere’s the folder structure we should end up with:\n\n```\ncalculator/\n   \
    \ calculator.go\n    calculator_test.go\n    go.mod\n```\n\nAgain, you don’t need\
    \ to fully understand what this code is doing yet (but you might be able to guess\
