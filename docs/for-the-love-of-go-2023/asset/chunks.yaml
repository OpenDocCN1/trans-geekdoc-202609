- raw: "In theory, we could model any real-world problem as a collection of objects\
    \ that have various properties, and relate to each other in various ways. For\
    \ example, a drawing program might deal with Shape objects, that might store information\
    \ about their vertices or edges, or perhaps Brush objects with different properties.\
    \ A card game program might have objects like Card, Hand, and Player.\n\nOr maybe\
    \ our program could use objects that don’t have any real-world counterparts: a\
    \ database, for example. Essentially, any piece of structured data can be considered\
    \ an object.\n\n## Doing computation with objects\n\nThere’s one other thing objects\
    \ have that we haven’t talked about yet, and that’s *behaviour*. For example,\
    \ shapes in our hypothetical drawing program could have the ability to draw themselves\
    \ on screen, or scale themselves to different sizes. That’s behaviour: when the\
    \ object doesn’t just passively store data, but *does* something with it.\n\n\
    Behaviour also requires *logic*: in other words, code. While we can store data\
    \ about an object in its fields, that data is *static*: all we can do is set it\
    \ and read it back. If we want to do any kind of computation with it, we have\
    \ to write a function and pass it the object as a parameter.\n\nFor example, let’s\
    \ suppose we wanted to extend our `Book` struct to include the book’s price. To\
    \ avoid the loss of precision that we’ve seen with floating-point values previously\
    \ in this book, let’s represent the price as an integer number of cents:\n\n```\n\
    \n```\n\n([Listing 18.1](https://github.com/bitfield/ftl-code/blob/main/18.1/bookstore.go))\n\
    \nAnd now let’s say that we also want to be able to discount certain books, as\
    \ a special offer. We could represent this with a `DiscountPercent` field on the\
    \ book. For example, `DiscountPercent: 50` would give 50% off the book’s cover\
    \ price.\n\nTo calculate the *net* price of the book (that is, the price after\
    \ applying the discount), we could imagine some function `NetPriceCents` that\
    \ takes a `Book` value and returns the discounted price. In fact, we can do more\
    \ than imagine. Let’s write it. We start with a test, of course.\n\n**GOAL:**\
    \ Write a test for the `NetPriceCents` function. If you get stuck, review previous\
    \ chapters, and try to describe the behaviour you want in words, before translating\
    \ it into Go code. Frame your test in terms of `want` and `got`.\n\n## Testing\
    \ NetPriceCents\n\nLet’s start by setting up some book with a given price and\
    \ discount amount, and then see if we get the expected value of `NetPriceCents`\
    \ for that book. Here’s what that might look like:\n\n```\n\n```\n\n([Listing\
    \ 18.1](https://github.com/bitfield/ftl-code/blob/main/18.1/bookstore_test.go))\n\
    \nLet’s write a null implementation of `NetPriceCents`—just enough to compile,\
    \ but fail the test:\n\n```\n\n```\n\nThis should give us a test failure, because\
    \ 0 is certainly not equal to 3000, and indeed that’s what we see:\n\n```\n---\
    \ FAIL: TestNetPriceCents (0.00s)\n    bookstore_test.go:18: want 3000, got 0\n\
    ```\n\n**GOAL:** Write the real implementation of `NetPriceCents`, so that the\
    \ test passes.\n\nThere are many different acceptable ways to write this function.\
    \ Here’s what I came up with:\n\n```\n\n```\n\n([Listing 18.1](https://github.com/bitfield/ftl-code/blob/main/18.1/bookstore.go))\n\
    \nIf yours looks different, no problem—so long as the test passes.\n\n## Methods\n\
    \nWe can imagine many other functions like `NetPriceCents` that take a `Book`\
    \ parameter, do some computation on it, and return the result. In fact, this pattern\
    \ is so useful that Go gives us a short-cut way to write it:\n\n```\n\n```\n\n\
    ([Listing 18.2](https://github.com/bitfield/ftl-code/blob/main/18.2/bookstore_test.go))\n\
    \nIn other words, if we have some book variable `b`, we can ask for its `NetPriceCents`\
    \ without *passing* `b` to a function. Instead, we call a *method* on `b` named\
    \ `NetPriceCents`.\n\nYou could think of a method as being like a kind of *dynamic*\
    \ struct field: every time you ask for its value, it can compute the result on\
    \ demand.\n\n## Defining methods\n\nA method definition in Go looks very similar\
    \ to a function, but with one small difference. It has a parameter called the\
    \ *receiver* that represents the object that the method is called on.\n\nLet’s\
    \ see what `NetPriceCents` looks like as a method:\n\n```\n\n```\n\n([Listing\
    \ 18.2](https://github.com/bitfield/ftl-code/blob/main/18.2/bookstore.go))\n\n\
    Can you spot the difference? Everything inside the function is the same, but it’s\
    \ the *signature* (the `func...` part) that has changed.\n\nThe `b Book` parameter\
    \ has moved *before* the function name, and the function now takes no parameters\
    \ at all, so the parentheses *after* its name are empty.\n\nTo the code inside\
    \ the function body, the receiver just appears as a normal parameter, so we don’t\
    \ need to change the implementation of `NetPriceCents`, only tweak its signature\
    \ a little.\n\n**GOAL:** Update your test to make `NetPriceCents` a method instead\
    \ of a function, and update the function definition so that the test passes.\n\
    \nIt’s worth knowing that an object’s methods (such as `NetPriceCents`) are closely\
    \ associated with its type (`Book`) and must be defined in the same package as\
    \ the type. That means we can’t add a method to a type from someone else’s package,\
    \ or from a standard library package, for example.\n\n## Methods on non-local\
    \ types\n\nWe’ve seen how to add methods to a struct type; can we add them to\
    \ other types of data, too? Let’s create a new package so that we can play around\
    \ with this idea. Create a new folder, wherever you keep your Go code (but not\
    \ inside the `bookstore` folder), and name it `mytypes`.\n\nInside this folder,\
    \ run `go mod init mytypes`, to tell Go you’re creating a new module called `mytypes`,\
    \ and create a new empty file called `mytypes.go`.\n\nWhat’s the first thing we\
    \ should try to add a method to? How about `int`? Add this code to your `mytypes.go`\
    \ file, and we’ll see what happens:\n\n```\n\n```\n\n([Listing 19.1](https://github.com/bitfield/ftl-code/blob/main/19.1/mytypes.go))\n\
    \nIf you run `go build` in this folder now, you’ll find this code doesn’t work,\
    \ because the compiler complains:\n\n```\ncannot define new methods on non-local\
    \ type int\n```\n\nThis is because `int` is a *non-local* type; that is, it’s\
    \ not defined in our package. Are our attempts to add behaviour to integers completely\
    \ doomed, though? Not necessarily.\n\n## Creating custom types\n\nIt’s actually\
    \ quite easy to create new types from existing ones in Go: all you need to do\
    \ is use the `type` keyword, like this:\n\n```\n\n```\n\n([Listing 19.2](https://github.com/bitfield/ftl-code/blob/main/19.2/mytypes.go))\n\
    \nThat might seem a bit pointless, since it just says that a `MyInt` is an `int`.\
    \ How does that help us?\n\nWell, we didn’t do anything particularly clever with\
    \ this type definition, but what we *did* do was create a new type that we “own”:\
    \ that is, a *local* type. And that means we can define a method on it:\n\n```\n\
    \n```\n\n([Listing 19.2](https://github.com/bitfield/ftl-code/blob/main/19.2/mytypes.go))\n\
    \nThis is perfectly acceptable to Go, since `MyInt` is a *local* type (that is\
    \ to say, it’s defined in this package). We can do whatever we want with it, including\
    \ adding methods such as `Twice`. We’ve simply defined `MyInt` in terms of some\
    \ *underlying type* that already exists: `int`, in this case.\n\nLet’s write a\
    \ test so that we can see how to use such a method. Create the file `mytypes_test.go`\
    \ and add:\n\n```\n\n```\n\n([Listing 19.2](https://github.com/bitfield/ftl-code/blob/main/19.2/mytypes_test.go))\n\
    \nYou might be wondering why we didn’t say, for example, just:\n\n```\n\n```\n\
    \nThe reason is that, as you know, Go considers `int` and `MyInt` distinct types.\
    \ You can’t pass an `int` value where a `MyInt` is expected, and vice versa. Since\
    \ `Twice` is a method on `MyInt`, we can’t call it on an `int`. And, similarly,\
    \ the value returned by `Twice` is a `MyInt`, so we can’t compare it with an `int`\
    \ directly.\n\nWhat we can do instead is convert some integer literal (`9`) to\
    \ a `MyInt` value using a *type conversion*:\n\n```\n\n```"
