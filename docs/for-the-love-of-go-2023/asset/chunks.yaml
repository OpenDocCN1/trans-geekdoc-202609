    ## Uncovering a problem


    Now the test is passing, and happy customers confirm that they’re not able to
    buy non-existent books, so let’s take this opportunity to review our test coverage:


    ```

    go test -cover

    PASS

    coverage: 75.0% of statements

    ```


    Oh dear, that’s a little lower than we’d like. Fully 25% of our code is untested.
    Let’s use the coverage tools to identify which lines are the problem (either by
    generating HTML or by using our editor’s built-in coverage highlighting). Here
    they are:


    ```


    ```


    So our `if` statement is executed by the test; that makes sense, because it will
    always compare `b.Copies` with zero, whatever’s passed in. But the `return` statement
    that returns an error value is never executed by any test.


    That doesn’t mean it’s incorrect, only that it’s not executed by any test. But
    that’s a risky situation to be in, because even if it happens that the code is
    correct *now* (and it is), there’s no guarantee that someone won’t come along
    and modify it later, breaking its behaviour. They’ll run the tests to satisfy
    themselves that nothing is wrong, and *they will pass*.


    We should fix that right away by adding a test for the new behaviour. What’s the
    behaviour? Well, if you try to buy a book with no copies, you should get an error.
    So let’s write that:


    ```


    ```


    ([Listing 13.1](https://github.com/bitfield/ftl-code/blob/main/13.1/bookstore_test.go))


    This passes, and we’re back to 100% coverage, so we can breathe a sigh of relief.


    ## “Covered” versus “tested”


    Untested code is a problem waiting to happen, so you can see why many people routinely
    check their test coverage numbers, and even sometimes require a minimum percentage
    value before code can ship.


    But there are a couple of caveats to be aware of. One is that just because a line
    of code is *executed* by a test, that doesn’t mean that the test necessarily tests
    anything useful about that code’s behaviour.


    For example, we could trivially *cover* the `Buy` function with a test like this:


    ```


    ```


    This test brings our coverage numbers up to 100%, but it’s useless all the same:
    it doesn’t verify anything about the behaviour of `Buy`. “Covered” isn’t the same
    as “tested”. If you remember the principle of “test behaviours, not functions”,
    you won’t fall into this trap.


    ## Juking the stats


    The other thing to beware of is “chasing coverage”: trying to make the numbers
    bigger just for the sake of the numbers. This is understandable in an environment
    that requires or rewards a high percentage of test coverage, but as we just saw,
    even 100% coverage doesn’t guarantee correct behaviour. (It does at least tell
    you that the code compiles, but perhaps there are easier ways of checking that.)


    It’s rare in real Go programs for our coverage to be 100%. But why? Consider a
    piece of code like this:


    ```


    ```


    Any test that calls this code will probably not show the `return err` line as
    covered, so overall our coverage will be less than 100%. Is that a problem? Not
    necessarily.


    We *could* test it: perhaps by writing a test that tries to pass in a non-existent
    file. That would improve the coverage numbers, but what are we really *testing*
    here? Nothing but that `if` statement.


    Again, the “behaviours, not functions” principle is helpful. If there’s no real
    *behaviour* in the untested code, it’s probably not worth testing. We can see
    it’s correct just by looking.


    So we don’t need 100% test coverage, and even when we have it, it doesn’t guarantee
    that the code is actually correct. 80-90% coverage is probably a reasonable figure
    to aim for.


    ## Takeaways


    *   A good way to start thinking seriously about what a package needs to do is
    to write some *user stories*: brief descriptions of some interaction with the
    program from the user’s point of view.


    *   User stories are not the same thing as *features*, which are just “things
    the program can do”: a given user story might make use of several features, while
    some features might not affect users at all.


    *   For any given program, it’s helpful to start by identifying the *core stories*,
    the smallest set of user stories that render the program useful at all, and we
    should aim to implement these stories first.


    *   When designing the code to implement a user story, it helps to think in terms
    of *behaviours* rather than *functions*: first ask, “How does the program need
    to behave?”, and when you know the answer to that, you’ll have a better idea of
    what functions you might need to write.


    *   It’s worth taking a little trouble over your test failure messages: include
    as much information as you can about what the test did, what was supposed to happen,
    what *actually* happened, and what kind of problem that indicates.


    *   We can set and get the values of struct fields by using the dot notation:
    for example, `b.Copies` refers to the `Copies` field of the struct `b`.'
