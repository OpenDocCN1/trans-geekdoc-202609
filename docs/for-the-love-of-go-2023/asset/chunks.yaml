    \n## 核心点总结\n\n- `go mod init` 命令初始化一个新的 Go 项目文件夹。\n- `go test` 命令运行 Go 包的测试。\n\
    - `gofmt` 命令将检查 Go 代码是否符合标准格式，并在必要时进行修复。\n- `function declaration`（函数声明）会宣布一个新函数的名称，并列出它接收的参数以及它返回的任何结果。\n\
    - 每当 Go 测试失败时，它都会显示发生错误的具体文件和行号，以及失败的内容。\n- `import` 关键字告诉 Go 我们想在这个特定的 Go 文件中使用哪些其他包。\n\
    - `testing` 包是 Go 标准库的一部分，它提供了我们编写和运行测试所需的所有内容。\n- 测试函数的名称以 `Test` 单词开头，并且它们接收一个\
    \ `*testing.T` 参数，允许我们控制测试的执行。\n- 使用 `want and got` 模式来构建测试：表达你“想要”（want）的结果，然后将其与从被测函数中“得到”（got）的结果进行比较。\n\
    - 我们可以调用 `t.Errorf` 来带消息地导致测试失败，如果我们不这样做，测试默认将通过。\n- `if` 语句用于在某些条件为真时（例如 `want`\
    \ 不匹配 `got`）执行某些操作（例如让测试失败）。\n\n# 2. 前进并繁衍\n\n![](img/file2.png)\n\n干得好。我们现在有了一个可以加法和减法的计算器。这是一个非常棒的开始。现在让我们构建一个新功能：`multiplication`（乘法）。\n\
    \n## 在测试引导下设计新功能\n\n到为止，我们一直在运行现有的测试并修改现有代码。现在我们将同时编写测试和它所测试的函数。\n\n我们将从测试开始，所以这是第一个挑战：\n\
    \n**目标：** 为函数 `Multiply` 编写测试，该函数接收两个数字作为参数，将它们相乘并返回一个表示结果的单个数字。\n\n我们应该从哪里开始？嗯，这是一个测试，所以从编辑\
    \ `calculator_test.go` 文件开始。我们正在添加一个新测试，因此我们需要在该文件中写一个新函数。我们应该叫它什么？\n\n嗯，我们知道\
    \ Go 测试函数的名称必须以 `Test` 开头，否则 Go 不会将其识别为测试。名字其余部分由我们决定。`TestMultiply` 怎么样？\n\n\
    根据我们在上一章中学到的知识，我们已经有了编写测试所需的所有内容。但我们不需要从零开始；毕竟我们有两个相似的测试可以作为模型。让我们从复制 `TestAdd`\
    \ 函数开始，将其粘贴到测试的末尾并进行一些更改。\n\n首先，我们需要更改测试的名称，因为 Go 不允许有两个同名的函数。我们将名称更改为 `TestMultiply`。\n\
    \n第二个我们需要更改的是对 `calculator.Add` 的调用。现在它应该是 `calculator.Multiply`。让我们也更改函数的参数，将它们改为\
