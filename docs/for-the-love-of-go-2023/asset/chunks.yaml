    Visual Studio Code’s Go extension lets you highlight covered code right there
    in the editor, using the command *Go: Toggle Test Coverage in Current Package*.
    Other editors have similar facilities.


    You’ll notice that some lines are not coloured at all. These are typically things
    like type definitions, constants, and so on. Although these are part of the program,
    they’re really instructions to the compiler, and don’t result in any generated
    object code in your program binary, so the coverage tool ignores them. They’re
    not counted towards the coverage statistics.


    As we’ve seen, if you’re developing your program guided by tests from the start,
    there shouldn’t really be any lines of system code that aren’t covered by tests.
    But what would it look like if there were? Let’s try an experiment.


    ## Test-last development


    Suppose you’re assigned to the Happy Fun Books project to implement a requested
    feature, and you’re not very experienced with writing tests, so you just charge
    right in and add a piece of system code. This may be covered by the existing tests,
    but most likely it won’t, so we should be able to use the coverage tools to detect
    the uncovered statements.


    It seems that some books are so popular that they’ve been selling out completely,
    but right now, the system doesn’t detect this situation. If there are zero copies
    of *Spark Joy* left in stock, the `Buy` function will happily decrement this value
    and return the book with its `Copies` set to -1.


    That makes no sense, and some angry customers have complained that they’ve received
    a negative number of books, and therefore we owe them money. Bad times. Let’s
    fix that.


    The basic problem here is that `Buy` doesn’t check whether `Copies` is zero before
    decrementing it. So we can add that check, but what should happen if it is zero?
    We should probably return some error:


    ```


    ```


    Recall that in the error case, we conventionally return zero for the data value,
    since it’s to be ignored (in this case, that would be `Book{}`).


    This doesn’t fit with the declared signature of `Buy`, as currently it’s only
    supposed to return one value. We’ll need to adjust that to match:


    ```


    ```


