    ## Takeaways


    *   A *slice* is a kind of Go type that represents an ordered collection of *elements*,
    all of the same type: for example, `[]string` is a slice of strings.


    *   A *slice literal* specifies the name of the slice type, followed by some elements
    in curly braces: for example, `[]string{"a", "b", "c"}`.


    *   In a slice literal of some custom type, such as a struct, we don’t need to
    repeat that type name as part of every element literal: the compiler can infer
    it.


    *   We use the square-bracket notation to refer to a particular numbered element
    of the slice: for example, `books[0]` refers to the first element of the `books`
    slice.


    *   The built-in function `len` tells us the number of elements in a slice.


    *   The built-in function `append` appends one or more elements to a slice, and
    returns the modified slice.


    *   The `range` operator lets us write `for` loops that execute once for each
    element of the slice in turn.


    *   In a loop like `for _, b := range books`, each time round the loop `b` will
    be each successive element of the slice `books`.


    *   The `==` operator isn’t defined on slices, so we can use the `go-cmp` package
    instead, which can compare all sorts of values using `cmp.Equal`, and produce
    a *diff* with `cmp.Diff` if they’re not equal.


    *   The output from `cmp.Diff` shows what was *expected* with a leading `-` sign,
    and what was actually *received* with a leading `+` sign.


    *   When you need to retrieve some specific thing from a collection of things,
    you need a way of uniquely identifying it by an *ID*, which can be whatever you
    want, but is often a number.


    *   One way to get a specific element from a slice, if you don’t already know
    its index, is to loop over the whole slice comparing each element with the one
    you want.


    # 7\. Map mischief


    ![](media/file7.png)


    Thanks to you, Happy Fun Books is already taking shape! We can store a catalog
    of books stocked by each store, get the list of all books in the catalog, and
    look up details on a specific book by ID.


    A successful bookstore, though, will have lots of books, and it could take a long
    time to loop through the whole list comparing IDs one by one. Can’t we do better?


    What we want is a data structure that, given a book ID, returns the corresponding
    book directly, without needing to loop. This would be a direct *mapping* from
    IDs to books.


    ## Introducing the map


    It turns out that Go has exactly the data type we want. And, for reasons that
    may now be clear to you, it’s called a *map*.


    Remember how a slice is a collection of values, each of which is uniquely identified
    by a number? A map is similar, but instead of a number, we can use a *key* that
    can be a value of any Go type. Here, our keys will be the book IDs, which are
    integers, so our map key type will be `int`.


    We should be able to rewrite `TestGetBook` in such a way that it sets up the `catalog`
    variable to be a map instead of a slice, shouldn’t we? Let’s try.


    The first thing we do in the test as it stands now is to assign a slice literal
    to `catalog`:


    ```


    ```


    ([Listing 15.3](https://github.com/bitfield/ftl-code/blob/main/15.3/bookstore_test.go))


    How would that change if we’re assigning a map literal instead? Not that much,
    it turns out:


    ```


    ```


    ([Listing 16.1](https://github.com/bitfield/ftl-code/blob/main/16.1/bookstore_test.go))


    The type of this literal is `map[int]bookstore.Book` (pronounced “map of int to
    bookstore dot book”). As you might expect, this sets up a mapping between some
    integer (the book ID) and some `Book` value, so that we can retrieve the `Book`
    directly by its ID.


    You can see that the individual `Book` literals are the same as before. What’s
    changed is that now there’s an ID, followed by a colon, before each `Book` value:


    ```


    ```


    ([Listing 16.1](https://github.com/bitfield/ftl-code/blob/main/16.1/bookstore_test.go))


    Here, the key is 1, and the value is the `Book` literal with that ID. Just as
    with a slice literal, we need a trailing comma after every element in a map literal.


    And the rest of the test doesn’t need to change at all. This is a good sign: tests
    shouldn’t be too tightly coupled to implementation details. If they are, that
    means your public API is coupled to those details too, so that you can’t change
    one without affecting the other. Instead, a useful abstraction *conceals* details
    that users shouldn’t need to care about.


    What do we need to change in the `bookstore` package to make this work? Let’s
    take a look at the current version of `GetBook`:


    ```


    ```


    ([Listing 15.2](https://github.com/bitfield/ftl-code/blob/main/15.2/bookstore.go))


    We know we won’t need this `range` loop anymore: a map lets us look up the book
    we want directly, without looping. And to do that, we can use a syntax very similar
    to a slice index expression:


    ```


    ```


    ([Listing 16.1](https://github.com/bitfield/ftl-code/blob/main/16.1/bookstore.go))


    Notice the square brackets? The key goes between those brackets in just the same
    way as the index of a slice, and the result of this expression is the element
    value.


    ## Adding a new element to a map


    Recall from the chapter on slices that we can update a slice by assigning a new
    element to a specific index. Here’s how we assign a new value to a map:


    ```


    ```


    If you do this with a key that already exists in the map, the new element will
    overwrite the old one. So each key is unique: you can’t have duplicate keys in
    the same map. (You can have duplicate *elements*, though, provided each is identified
    by a different key.)


    ## Accessing element fields


    If you just want to read the value of an element’s field (for example, a book’s
    `Title`), you don’t need to assign the whole element to a variable first. You
    can refer to the field directly like this:


    ```


    ```


    This expression is in two parts. First, a map *index expression*, identifying
    the element you’re interested in (ID number `1`). Next comes the field *selector*,
    naming the specific field of the element that you want, preceded by a dot: `.Title`.


    So given the expression `catalog[1].Title`, Go first of all looks up the `1` key
    in the `catalog` map, gets the `Book` element it identifies, and gives you the
    value of its `Title` field, which is `For the Love of Go`.


    ## Updating elements


    What if we don’t want either to add a new book to the map, or to completely overwrite
    an existing one? Instead, we might like to modify just one field of a given book.
    How can we do that?


    Since you know that you can *read* the value of a struct field in a map directly,
    as we saw in the previous section, you might wonder if you could also *set* it
