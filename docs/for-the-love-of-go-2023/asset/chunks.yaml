- raw: 'What happens when Go encounters such a loop in your program? First of all,
    the conditional expression is evaluated. If it is true, then the statements inside
    the curly braces are executed.


    So far, this is just like an `if` statement, but there’s a twist. When Go reaches
    the end of the loop, it evaluates the condition *again*. If it *still* evaluates
    to `true`, then the statements in the loop body are executed again, and so on
    forever, or at least until the condition is false.


    ## Forever loops


    Since omitting a condition is equivalent to specifying the condition `true`, which
    is always true, you can see that a `for` loop without a condition will execute
    forever. (Or, at least, until you turn the computer off or otherwise interrupt
    the program.) We might call this a “forever loop”.


    Is such a loop useful? Actually, yes! There are many programs whose job it is
    to repeat some process forever: manufacturing processes, for example. A welding
    robot on an assembly line just repeatedly performs the same sequence of welds
    as long as the line is running.


    Similarly, network servers such as HTTP webservers run an endless loop that waits
    for a request to arrive, services the request, and then goes back to waiting.
    There are, of course, ways to interrupt or shut such a program down, but we don’t
    need to specify them as a terminating condition for the loop.


    ## Using `range` to loop over collections


    More commonly, though, we want a loop to execute once for each element in some
    collection of data. Imagine a payroll program, for example, whose job is to calculate
    and generate a payslip for each employee of a company.


    It wouldn’t make sense to use a forever loop for such a program, because it would
    reach a point at which all employees have been paid for the current month, and
    there is no more work to do.


    Instead, it would be convenient to write a loop that executes once for every element
    in a slice, or some other kind of collection of data. The `range` keyword will
    do exactly this.


    For example, suppose we had a slice variable named `employees`, which contains
    data about each employee (such as their salary). We could write a loop using `for`
    and `range` as follows:


    ```


    ```


    If there are three elements in the `employees` slice, then this loop will execute
    three times, printing the following output:


    ```

    Found another employee!

    Found another employee!

    Found another employee!

    ```


    ## Receiving index and element values from `range`


    The loop in our previous example isn’t that useful, however, because although
    it can execute a set of statements for each employee, it doesn’t have any *data*
    about the employees (such as their salary). So for something like a payroll program,
    we’ll need a way not only to repeat the loop once for each element, but to give
    the loop access to the element itself.


    As you may recall from our earlier work at Happy Fun Books, `range` can return
    up to two values from a slice: the *index value* of each element (0, 1, 2, 3…)
    and the *element value* (the element itself).


    For example:


    ```


    ```


    Given suitable data in the `employees` slice, this might print out something like
    the following:


    ```

    Employee number 0: Zhang Wen

    Employee number 1: Yu Luoyang

    Employee number 2: Qiu Zhenya

    ...

    ```


    Often, we’re not interested in the index value, so we ignore it using the blank
    identifier (`_`):


    ```


    ```


    Or if we *only* want the index value, we just needn’t bother to supply any variable
    to receive the element value:


    ```


    ```


    This is an extremely useful and common pattern for looping over data. That is,
    executing a set of statements once for each element in a slice, or each key-value
    pair in a map, or each rune in a string.


    **GOAL:** Write a function `total` that takes a slice of `int` and returns the
    sum of all the slice elements. For example, if the input is `[]int{1, 2, 3}`,
    the function should return 6.


    ## Conditional `for` statements


    Let’s go back to the *conditional* `for` loop that we introduced earlier in this
    chapter, and that keeps executing as long as some specified condition is true.
    If we omit the condition altogether, as we said, that is equivalent to specifying
    the condition `true`, and the loop executes forever. But we can write more interesting
    conditions.


    For example, suppose we want to print out the numbers 0 through 9. We can use
    some integer variable `x`, and use a `for` statement to repeatedly print the value
    of `x` and then increment `x`:


    ```


    ```


    This behaves exactly as you’d expect, printing the values 0, 1, 2, 3, and so on
    in sequence. But the sequence never terminates, because we never told it to! Since
    we’re only interested in numbers less than 10, we can add a condition to the `for`
    statement which specifies that the loop should only keep executing as long as
    `x` is less than 10. That’s straightforward:


    ```


    ```


    Now the loop does exactly what we wanted, which is to print out the numbers 0
    through 9 and then stop.


    ## Init and post statements


    This kind of loop is so common, in fact, that Go provides us with a special form
    to write it conveniently. We usually want to *initialise* some variable to its
    starting value, then execute some code as long as its value meets some condition,
    and then *update* the value in some way (for example, incrementing it).


    So we can add an initialising statement before the condition (known as an *init
    statement*), and an updating statement, that follows the condition, and executes
    *after* the loop body (known as a *post* statement for this reason). The init
    statement, condition, and post statement are separated by semicolons. Here’s our
    previous example expressed in this form:


    ```


    ```


    This code produces exactly the same output as before, but it’s more compact. Notice
    that the initialising statement (`x := 0` has moved inside the `for` statement,
    before the condition, and the updating statement (`x++`) has also moved inside
    the `for` statement, after the condition.


    You can see now that the earlier loop example (`for x < 10`) was actually just
    a special case of this three-part `for` statement form, where the init and post
    statements were omitted, leaving only the conditional expression.


    This might all seem a little over-complicated to you, but don’t worry. Three-part
    `for` statements like this are relatively uncommon in Go, because what we usually
    want to do is either loop over some data (in which case we can use `range`) or
    just loop forever, which doesn’t require a condition at all.


    **GOAL:** Write a function `evens` that prints out all the even numbers between
    0 and 100 inclusive, using a three-part `for` statement.


    ## Jumping to the next element with `continue`


    We’ve seen how to use `for` loops to repeat a linear sequence of statements, but
    what if it’s not that simple? Maybe we only want to perform some operation on
    certain elements of the data, and not others, for example.


    Our payroll program might want to generate paychecks only for current employees,
    for example, and not those who have resigned or retired. We could write something
    like this:


    ```


    ```


    That’s okay, but not ideal; we have an extra level of indentation, inside the
    `if e.IsCurrent` block, and, as you’ll recall from earlier in this book when we
    talked about the “happy path”, we would like to keep indentation to a minimum
    to make our code easy to read.


    What we would like is a way, in the case of non-current employees, to say “Just
    do nothing in this case, and continue the loop with the next element instead”.
    That’s exactly what the `continue` keyword does:


    ```


    ```


    Now the happy path runs in a straight line down the left margin, and the only
    indented code is for handling exceptional or invalid situations, which is just
    what we wanted. You can imagine that there might be several different reasons
    to skip employees, each of which could trigger a `continue`.'
