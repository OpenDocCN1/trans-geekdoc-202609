    \ 将是一个好主意：也就是说，具有不同预期结果的不同输入。\n\n例如，`TestAdd` 的当前版本测试了调用 `Add(2, 2)` 并检查结果是否为\
    \ 4。我们可以写一个新函数 `TestAdd1`，例如，调用 `Add(1, 1)` 并期望结果为 2。但对于许多不同的输入，这将会非常繁琐。\n\n#\
    \ 引入测试用例\n\n相反，最优雅的解决方案是定义若干不同的测试用例——每个用例代表一对输入以及预期的输出——然后对它们进行循环，使用输入调用 `Add`\
    \ 并将输出与预期结果进行比对。如果任何测试用例失败，整个测试就会失败。这些测试有时被称为表格测试（table tests），因为它们将测试数据表示为输入及其结果的表格。\n\
    \n让我们看看它可能是什么样子。首先，定义一个 `struct` 类型来表示测试用例会很方便。`struct` 是 Go 中结构化数据类型的名称：也就是说，它是包含多个信息位并合并成单个记录的东西。\n\
    \n如果你对这不熟悉，不要担心；我们稍后会介绍这个话题。我们在这里真正关注的是测试逻辑，这只是设置测试用例的一种，以便我们实现该目标。让我们在 `TestAdd`\
    \ 函数内部进行操作，因为测试用例通常特定于某个函数：\n\n```go\n// Listing 5.1 ft-code/main/5.1/calculator_test.go\n\
    ```\n\n# 测试用例切片\n\n如果你已经有一些 Go 经验，你可能熟悉切片（slice）的概念：它只是 Go 对一组东西的称呼。在某些语言中，这被称为数组（array），但无论我们如何称呼，其核心思想是一样的：一组相同类型的值的序列。\n\
    \n再次，我们将在本书的后半部分详细讨论切片和其他数据类型。但现在，不必担心细节；我们只需要使用一个切片来表示一组测试用例。与其编写许多仅在输入上不同的测试，我们更希望只写一个测试许多用例的测试。对于每个用例，我们将像之前做的那样：使用输入\
