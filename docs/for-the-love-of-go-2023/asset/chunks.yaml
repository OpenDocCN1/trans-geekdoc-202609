  trans: "\n我们写出想要转换的类型名称（`MyInt`），然后在括号中写出想要转换的值（`9`）。\n\n并不是所有的类型转换都是可行的；例如，尝试将字符串转换为整数会导致编译错误：\n\
    \n```\n// \n```\n\n但在这种情况下，它是完全可能的，而且为了我们的测试能够正常运行，这确实是必不可少的。\n\n我们希望这个测试能够通过，因为\
    \ `Twice` 代码是正确的，事实上它确实是正确的。\n\n## 更多类型和方法\n\n现在我们开始弄清楚在 Go 中可以为哪些类型添加方法。如果它是我们自己定义的本地类型，我们就可以为它添加方法。另一方面，如果该类型定义在我们当前的包之外，我们就无法这样做。\n\
    \n但我们始终可以基于我们感兴趣的类型创建一个新类型，并为*那个新类型*添加方法。让我们进一步探讨这个想法。\n\n例如，假设我们想基于 `string`\
    \ 创建一个类型 `MyString`，并为其编写一个 `Len` 方法，用于告诉我们字符串的长度。像往常一样，我们将从一个测试开始。\n\n**目标：**\
    \ 编写一个名为 `TestMyStringLen` 的测试。它应该创建一个类型为 `mytypes.MyString` 的值。然后，测试应该在该值上调用\
    \ `Len` 方法并检查结果。如果你卡住了，请回顾本章早部分的 `TestTwice` 函数，看看你是否可以对其进行调整。\n\n如果你不想被剧透，请现在移开视线。这是我的尝试：\n\
    \n```\n// \n```\n\n([代码列表 19.3](https://github.com/bitfield/ftl-code/blob/main/19.3/mytypes_test.go))\n\
    \n**目标：** 让测试通过。如果你遇到任何问题，请参考[代码列表 19.2](https://github.com/bitfield/ftl-code/blob/main/19.2/mytypes.go)\
    \ 中 `MyInt` 类型和 `Twice` 方法的代码。\n\n实现在这里并不重要；这实际上只是为了学会如何定义和调用方法。这是我写的：\n\n```\n\
    // \n```\n\n([代码列表 19.3](https://github.com/bitfield/ftl-code/blob/main/19.3/mytypes.go))\n\
    \n## 创建 Catalog 类型\n\n现在让我们回到 Happy Fun Books，看看如何将这些想法应用到我们的书店应用程序。\n\n回想一下，我们创建了一个变量来存储书籍目录。我们最初从一个切片变量（`[]Book`）开始，并写了一个函数\
    \ `GetAllBooks`，返回所有书籍的切片。\n\n然后，在介绍 map 的章节中，我们将目录变量升级为 map。它是一个从整数 ID 到 `Book`\
    \ 元素的 map，因此其类型是 `map[int]Book`。我们升级了 `GetAllBooks` 函数以处理这种新的目录类型。\n\n既然我们已经为自己的\
    \ Go 工具箱添加了方法，让 `GetAllBooks` 成为目录的一个方法听起来会很有用，不是吗？事实上，任何查询或更新目录的函数都可能应该是目录的一个方法，而不是独立的函数。\n\
    \n我们知道目录将是 `map[int]Book`，因此假设我们从尝试将 `GetAllBooks` 转换为该类型的方法开始。作为第一次尝试，我们可能会写出类似下面的代码：\n\
    \n```\n// \n```\n\n但这样做是不被允许的：\n\n```\ninvalid receiver type map[int]Book (map[int]Book\
    \ is not a defined type)\n```\n\n这是合理的，因为尽管 `map[int]Book` 不是 Go 的内置类型之一，但也不是我们自己定义的类型。正如我们所看到的，我们只能在使用\
    \ `type` 关键字定义的类型上定义方法。\n\n但现在你知道如何绕过这一点了，对吧？我们可以创建一个带有某些名称的新本地类型（让我们称之为 `Catalog`，因为它将被用于存储目录），并将其定义为\
    \ `map[int]Book`。我们应该能够为这个新类型添加方法。\n\n像往常一样，让我们从测试开始。这是我们 `TestGetAllBooks` 的当前版本：\n\
    \n```\n// \n```\n\n([代码列表 17.3](https://github.com/bitfield/ftl-code/blob/main/17.3/bookstore_test.go))\n\
    \n我们从设置初始目录开始，将一个 map 字面量赋值给 `catalog` 变量。具体来说，是一个 `map[int]Book` 字面量。但我们说我们将为目录定义一个特殊的自定义类型，名为\
    \ `Catalog`。该类型的字面量看起来像什么样？\n\n嗯，实际上它和任何其他字面量一样。我们写下类型名称，后面跟着大括号中的一些数据：\n\n```\n\
    catalog := bookstore.Catalog{\n    1: {ID: 1, Title: \"For the Love of Go\"},\n\
    \    2: {ID: 2, Title: \"The Power of Go: Tools\"},\n}\n```\n\n([代码列表 19.4](https://github.com/bitfield/ftl-code/blob/main/19.4/bookstore_test.go))\n\
    \n这处理了目录设置。接下来，我们需要更新调用 `GetAllBooks` 的方式，以反映它现在是 `catalog` 变量的方法：\n\n```\n//\
    \ \n```\n\n([代码列表 19.4](https://github.com/bitfield/ftl-code/blob/main/19.4/bookstore_test.go))\n\
    \n我们预感到一些编译错误，因为我们引用了两个不存在的东西：`Catalog` 类型和 `GetAllBooks` 方法。\n\n**目标：** 修复这些错误使测试通过。如果你起初感到困难，不要担心，因为有很多部分需要处理。让我们一步步为营。首先，我们在\
    \ `bookstore` 中定义新类型：\n\n```\n// \n```\n\n([代码列表 19.4](https://github.com/bitfield/ftl-code/blob/main/19.4/bookstore.go))\n\
