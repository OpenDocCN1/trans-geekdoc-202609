- raw: 'The answer to this puzzle lies in what happens when we pass a value as a parameter
    to a Go function. It’s tempting to think, if we have some variable `x`, and we
    call `Double(x)`, that the `input` parameter inside `Double` is the variable `x`.
    But that’s not the case.


    In fact, the value of `input` will be the same as the value of `x`, but they’re
    two independent variables. The `Double` function can modify its local `input`
    variable as much as it likes, but that will have no effect on the `x` variable
    back in the test function—as we’ve just proved.


    The technical name for this way of passing function parameters is *pass by value*,
    because `Double` receives only the value of `x`, not the original `x` variable
    itself. This explains why `x` wasn’t modified in the test.


    ## Creating a pointer


    Is there any way, then, to write a function that can modify a variable we pass
    to it? For example, we’d like to write a version of `Double` that will actually
    have an effect on `x` when we call `Double(x)`. Instead of just taking a copy
    of the value of `x` at the moment of the function call, we want to pass `Double`
    some kind of reference to `x`. That way, `Double` could modify the original `x`
    directly.


    Go lets us do exactly that. We can create what’s called a *pointer* to `x`, using
    this syntax:


    ```


    ```


    ([Listing 21.2](https://github.com/bitfield/ftl-code/blob/main/21.2/mytypes_test.go))


    You can think of the `&` here as the *sharing operator*; it lets you share a variable
    with the function you’re passing it to, so that the function can modify it.


    ## Declaring pointer parameters


    There’s still something missing, though, because our modified test doesn’t compile:


    ```

    cannot use &x (type *int) as type int in argument to

    mytypes.Double

    ```


    The compiler is saying that `Double` takes a parameter of type `int`, but what
    we tried to pass it was a value of type `*int` (pronounced “pointer to int”).


    These are two distinct types, and we can’t mix them. If we want the function to
    be able to take a `*int`, we’ll need to update its signature accordingly:


    ```


    ```


    ([Listing 21.2](https://github.com/bitfield/ftl-code/blob/main/21.2/mytypes.go))


    It’s worth adding that the type here is not just “pointer”, but specifically “pointer
    to int”. For example, if we tried to pass a `*float64` here, that wouldn’t work.
    A `*float64` and a `*int` are both pointers, but since they’re pointers to different
    *base* types, they are also different from each other.


    ## What can we do with pointers?


    We’re still not quite done, because even with our updated function signature,
    the compiler isn’t happy with this line:


    ```


    ```


    It complains:


    ```

    invalid operation: input *= 2 (mismatched types *int and int)

    ```


    Another type mismatch. It’s saying “you tried to multiply two different kinds
    of thing”. The numeric constant literal `2` is interpreted as an `int`, while
    `input` is a pointer.


    ## The `*` operator


    Instead of trying to do math with the pointer itself, we need the value that the
    pointer *points to*. Because a pointer is a reference to some variable, the fancy
    name for this is *dereferencing* the pointer.


    To get the value pointed to by `input`, we write `*input` (“star-input”):


    ```


    ```


    ([Listing 21.2](https://github.com/bitfield/ftl-code/blob/main/21.2/mytypes.go))


    ## Nil desperandum


    You know that every data type in Go has some default value. If you declare a variable
    of type `int`, for example, it automatically has the value 0 unless you assign
    some other value to it.


    So what’s the default value of a pointer type? If you declare a variable of type
    `*int`, what value does it have?


    The answer is the special value `nil`, which you’ve encountered many times already
    in connection with `error` values. Just as a nil error value means “no error”,
    a nil pointer value means “doesn’t point to anything”.


    It makes no sense to dereference a nil pointer, then, and if this situation arises
    while your program is running, Go will stop execution and give you a message like:


    ```

    panic: runtime error: invalid memory address or nil pointer

    dereference

    ```


    This shouldn’t happen under normal circumstances, so “panic” in this context means
    something like “unrecoverable internal program error”.


    ## Pointer methods


    We know that a function parameter can be a pointer, so can a method receiver be
    a pointer, too? Certainly. Such a method is called a *pointer method*.


    Why would a method take a pointer receiver? Only because, just as in the function
    case, it needs to *modify* that object. In other words, if we want to write a
    method that modifies its receiver, then that receiver must be a pointer type.


    We wanted the `Double` function to modify the value passed to it, and we achieved
    that using a pointer. Could we turn `Double` into a method that takes a pointer
    receiver, then? Let’s find out.


    We already know we can’t create a method on `int`, but we also know how to deal
    with that: create a new type `MyInt` instead, and define the method on that.


    We’ll start by modifying the test to create a pointer to a `MyInt` value, and
    then call the `Double` method on it:


    ```


    ```


    ([Listing 21.3](https://github.com/bitfield/ftl-code/blob/main/21.3/mytypes_test.go))


    **GOAL:** Update the definition of `Double` to make this test pass. You know how
    to write methods, and you also now know how to declare pointer parameters. Can
    you combine these two ideas to solve the problem?


    Here’s one solution:


    ```


    ```


    ([Listing 21.3](https://github.com/bitfield/ftl-code/blob/main/21.3/mytypes.go))


    ## Takeaways


    *   When you define a new type, it doesn’t automatically “inherit” any methods
    that the underlying type has.


    *   But you can define a *struct* type instead, containing a field of the type
    that you want to *wrap* with new methods.


    *   When you pass a variable to a function, the function actually receives a *copy*
    of that variable’s value.


    *   So if the function modifies the value, that change won’t be reflected in the
    original variable.


    *   When you *want* the function to modify the original variable, you can create
    a *pointer* to the variable, and pass that instead.


    *   A pointer gives *permission to modify* the thing it points to.


    *   The `&` operator creates a pointer, so `&x` gives a pointer to `x`.


    *   A function that takes a pointer must declare the appropriate parameter type:
    `*int` for “pointer to `int`”, for example.


    *   Just as ordinary types are distinct and non-interchangeable, so are pointers
    to those types: for example, `*int` and `*float64` are different types.


    *   The only thing we’re allowed to do with a pointer value is *dereference* it
    using the `*` operator to get the value it points to, so `*p` gives the value
    of whatever variable `p` points to.


    *   The default (zero) value of any pointer type is `nil`, meaning “doesn’t point
    to anything”.


    *   Trying to dereference a pointer that happens to be `nil` will cause the program
    to *panic* and terminate with an error message.


    *   Just as functions can take pointer parameters, so methods can take *pointer
    receivers*, and indeed they must do so if they want to modify the receiver.


    # 10\. Very valid values


    ![](media/file10.png)


    Now that you know how to use pointer methods to modify the variables they’re called
    on, let’s see how to apply that to the valuable work you’re doing at Happy Fun
    Books.


    At the moment, if you want to modify some information about a book, you’d update
    the relevant field on the `Book` struct directly with a new value.


    But there’s a potential problem here: what if you make a mistake and assign some
    value that doesn’t make sense? For example, setting a negative `PriceCents` on
    a book, or a `DiscountPercent` that’s greater than 100, or less than zero.


    At the moment, we’ve no protection against that kind of problem: we don’t have
    any *validation* of the changes we make to books. Let’s think about how to solve
    this.


