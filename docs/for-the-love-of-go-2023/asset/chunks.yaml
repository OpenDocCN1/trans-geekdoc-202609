    \nLet’s run the tests to see how we’re doing:\n\n`go test`\n\n```\nundefined:\
    \ calculator.Multiply\n```\n\nThis is totally okay because we expected it. We\
    \ haven’t written the `Multiply` function yet so no wonder the compiler can’t\
    \ find it. Ignore this error for now; it will go away as soon as we’ve provided\
    \ a definition of `Multiply`.\n\n## Testing a null implementation\n\nNow we’re\
    \ ready to take the next step to get a failing test. sounds a bit strange: shouldn’t\
    \ we be aiming for a passing test instead?\n\nWell, yes eventually. But there’s\
    \ an important step to take first. The job of the `TestMultiply` function is to\
    \ detect bugs in `Multiply` if there are any. How do we know it will actually\
    \ do that?\n\nFor example, if we wrote the correct implementation of `Multiply`\
