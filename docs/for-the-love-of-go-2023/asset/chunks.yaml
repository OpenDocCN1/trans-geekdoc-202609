    Check that the result is 2, as expected.


    ## Closures


    Here’s an intriguing question, which may already have occurred to you. Let’s look
    more closely at the body of the anonymous function literal in the previous example
    using `sort.Slice`:


    ```

    ```

    ```


    What it says makes sense, but where did `nums` come from? This function takes
    parameters named `i` and `j`, and we use those, but we didn’t take a parameter
    `nums`. This variable exists in a different function: the one that called `sort.Slice`.
    So how come our function literal can “see” this variable?


    Well, our anonymous function is defined inside the calling function, and it can
    “see” all variables that are in scope in that function, including `nums`. This
    is referred to as a `closure`.


    If you think about it, a plain old ordinary function defined at package level
    can also “see” variables declared at package level, can’t it? And this is just
    the same. Any function has access to the variables available in the scope where
    it’s defined, and when this is a function literal, we call it a `closure` over
    those variables. In this example, our function literal is a closure over the `nums`
    variable.


    This might seem a little obscure at first, but it’s essential for things like
    `sort.Slice`. If the `less` function weren’t a closure over the slice to be sorted,
    how would it access that slice at all? We can’t pass it in, because the type of
    the function parameter to `sort.Slice` is fixed: it just takes two `int`s. Closures
    allow us to solve this problem in a very elegant way.


    It’s common to want to call some arbitrary function and say “perform some operation
    on this bunch of data”. Now we know we can specify the operation to be performed
    by passing a function literal, and we don’t even need to pass the data, because
    the function literal itself can be a closure over it!


    You can think of a closure as a little bubble, which traps all the variables in
    scope at the point where it’s defined. Then if you pass that bubble as an argument
    to some other function, those variables will still be trapped inside the bubble
    and available for use when it gets there. Well, that’s how I think of it, anyway:
    invent your own analogy!


    ## Closures on loop variables


    There’s a slightly subtle aspect of the way closures work in Go that can lead
    to surprising behaviour. Consider this simple program:


    ```

    ```

    ```


    What does this print? It seems like the answer should be:


    ```

    1

    2

    3

    ```


    and indeed it is; you might like to satisfy yourself that this is the case by
    trying it out.


    But suppose we replace the call to `fmt.Println(v)` with a call to an anonymous
    function literal:


    ```

    ```

    ```


    This is also extremely straightforward, and produces the same result. Now let’s
    do something a little tricky. Instead of *calling* this function literal, let’s
    *append* it to a slice of such functions:


    ```

    ```

    ```


    Nothing has been printed out yet, because we haven’t *called* any of these three
    functions: we’ve simply stored them in a slice. Now let’s loop over that slice
    calling the functions. This is very easy:


    ```

    ```

    ```


    And here’s what it prints:


    ```

    3

    3

    3

    ```


    Wait, what? Why did this produce a different answer? The only change we made was
    to put off calling the functions until after the loop finished. So what’s going
    on? You might like to see if you can figure out the answer before reading on.


    We already know that the function was defined. In our example, we set the variable
    `v` to 1, 2, and 3, in succession. So after the first loop has finished, `v` has
    the value 3; that’s straightforward.


    Now we call our three functions, each of which prints out the value of `v`. And
    we know that’s 3. So this behaviour is entirely correct and not surprising at
    all… once you know that’s how closures work.


    In fact, any time you’re updating a variable that’s referenced by a closure, you
    need to be careful that you don’t get the wrong result when the closure is called.
    This most commonly happens in loops, but it can happen in other places, too.


    ## Cleaning up resources


    It often happens that we do something in a Go function that requires some kind
    of cleanup before the function exits. For example, when we open a file, we must
    also close it before exit, or that resource will `leak` (that is, the garbage
    collector won’t be able to purge it from memory, because it thinks it’s still
    in use).


    The operating system and the Go runtime need to maintain some data about open
    files, and this takes up memory space, so if we keep opening files and never closing
    them, eventually we will run out of memory. The same applies to any resource that
    takes up memory.


    To avoid this, we might write something like the following:


    ```

    ```

    ```


    Fine! The resource is cleaned up. But you know that a function can exit at any
    point by using `return`, not just at the end. This creates a potential problem,
    doesn’t it? What if we exit before `f.Close()` is called? That would mean `f`
    is never closed, and it will hang around in memory forever. For simple, one-shot
    programs like CLI tools, that’s maybe not so serious. But for long-running programs
    like servers, it will mean that the program’s resource usage keeps growing, until
    eventually it crashes.

