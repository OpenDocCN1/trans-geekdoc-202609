- raw: 'It’s the line that calls `t.Errorf` to trigger the test failure, which makes
    sense. And why was that statement executed? Only because the condition in the
    `if` statement was true: in other words, `got` was not equal to `want`.


    And that’s reinforced by the failure message:


    ```

    want 2.000000, got -2.000000

    ```


    Now we have all the information we need to fix the problem. Before we tackle that,
    though, let’s go through the test in detail, breaking down exactly what it does.


    ## The `testing` package


    You might have noticed that in the `calculator_test.go` file, there’s an `import`
    statement near the top of the file that looks like this:


    ```


    ```


    In Go, we have to explicitly *import* any packages that we want to use, including,
    in this case, the `calculator` package itself. Since we’re testing it, we need
    to call its functions, and we can’t do that unless we have imported it.


    Similarly, we are using functions from the `testing` package, so we import that
    too. What is `testing`? It’s a package in the Go standard library that relates
    to testing, as you might have guessed.


    Go has built-in support for writing tests. Unlike with some languages, we don’t
    need any extra framework or third-party package in order to test Go code. There
    are plenty of such packages if you’d like to experiment with them, but I recommend
    the standard, built-in `testing` package to start with.


    We’ll be using the `testing` package a lot, so it’s worth taking a little time
    to read the documentation and get familiar with it:


    *   [https://pkg.go.dev/testing](https://pkg.go.dev/testing)


    ## The signature of test functions


    We can also see that `TestSubtract` is a Go function (because it’s introduced
    by the `func` keyword):


    ```


    ```


    Each test in a Go project is a function, just like the `Add` and `Subtract` functions
    we’ve already seen. But in order for Go to recognise a particular function as
    a *test*, there are a few special requirements.


    First, it must be in a file whose name ends in `_test.go` (there can be multiple
    tests in the same file). Go uses this filename pattern to recognise source code
    files that contain tests.


    Also, the name of a test function must begin with the word `Test`, or Go won’t
    recognise it as a test. It also has to accept a parameter whose type is `*testing.T`.
    Don’t worry about exactly *what* this is for the moment; think of it as the thing
    that allows us to control the outcome of the test.


    Finally, test functions don’t return anything (there’s a blank between the closing
    parenthesis and the opening curly brace, where the result list would normally
    go). So this is the signature of a test function in Go.


    ## The test body


    So what exactly is `TestSubtract` doing? Let’s take a closer look at the body
    of the function. Here it is again, and we’ll look at it line by line:


    ```


    ```


    ([Listing 3.1](https://github.com/bitfield/ftl-code/blob/main/3.1/calculator_test.go))


    Firstly, the `t.Parallel()` statement is a standard prelude to tests: it tells
    Go to run this test concurrently with other tests, which saves time.


    The following statement sets up a variable named `want`, to express what it *wants*
    to receive from calling the function under test (`Subtract`):


    ```


    ```


    Then it calls the `Subtract` function with the values `4` and `2`, storing the
    result into another variable `got`:


    ```


    ```


    We knew that the test must *call* the `Subtract` function at some point, if it’s
    to test anything about its behaviour. And this is where that happens. We call
    `Subtract` with 4 and 2, asking in effect “What is the result of subtracting 2
    from 4?”


    Whatever is returned by `Subtract` is what it thinks the result of that subtraction
    should be, and we’ve stored that value in the `got` variable.


    Now we have two variables, `want` and `got`. The `want` variable contains the
    value we expect from the subtraction—what we *want* the function to return when
    it’s working correctly. And `got` contains what it *actually* returned.


    You can guess what’s coming next: we’re going to compare the two. If they’re the
    same, then we *got* the result we *wanted*, so everything’s fine—test pass. We
    already know that’s not the case at the moment, though, which is why the test
    is failing.


