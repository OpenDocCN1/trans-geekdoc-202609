- raw: '![](media/file4.png)


    Welcome aboard! It’s your first day as a Go developer at **Happy Fun Books**,
    a publisher and distributor of books for people who like cheerful reading in gloomy
    times. You’ll be helping to build our new online bookstore using Go.


    First, let’s talk a little about *data* and *data types*. By “data”, we really
    just mean some piece of information, like the title of a book, or the address
    of a customer. So can we distinguish usefully between different *kinds* of data?


    Yes. For example, some data is in the form of text (like a book title). We call
    this *string* data, meaning a sequence of things, like “a string of pearls”, only
    in this case it’s a string of characters.


    Then there’s data expressed in numbers, like the price of a book; let’s call it
    *numeric* data.


    There’s also a third kind of data we’ve come across: *boolean* data that consists
    of “yes or no”, “true or false”, “on or off” information.


    ## Types


    The word “type” in programming means what you think it means, but with a special
    emphasis. It means “kind of thing”, but in a way that allows us to automatically
    make sure that our programs are working with the right kind of thing.


    For example, if we declare that a certain variable will only hold string data
    (we say the variable’s *type* is `string`), then the Go compiler can check that
    we only assign values of that type to it. Trying to assign some other type of
    value would cause a compile error.


    Let’s distinguish first between a *value* (a piece of data, for example the string
    `Hello, world`), and a *variable* (a name identifying a particular place in the
    computer’s memory that can store some specific value).


    Values have types; the type of `Hello, world` is named `string`. So we call this
    a *string value*, because it’s of *type `string`*. A variable in Go also has a
    type, which determines what values it can hold. If we intend it to store string
    values, we will give it type `string`, and we refer to it as a *string variable*.


    So a string variable can hold only string values. That’s straightforward, isn’t
    it? Make sure you feel comfortable in your understanding of types, values, and
    variables before continuing.


    ## Variables and values


    How do we create and use variables and values? Let’s find out. Go ahead and create
    a new folder, copy the example below to a file called `main.go` and run it with
    the command `go run main.go`.


    ```


    ```


    ([Listing 9.1](https://github.com/bitfield/ftl-code/blob/main/9.1/main.go))


    What’s happening here? Let’s break it down. As you learned in the previous chapter,
    all executable Go programs must have a `package main`. They also have a *function*
    called `main` that is called automatically when the program runs. Let’s see what
    happens inside `main`.


    First, we *declare* a variable `title`, of type `string`:


    ```


    ```


    ([Listing 9.1](https://github.com/bitfield/ftl-code/blob/main/9.1/main.go))


    The `var` keyword means “Please create a variable called… of type…”. In this case,
    please create a variable called `title` of type `string`.


    Next, we declare a variable `copies` of type `int` (a numeric type for storing
    integers, that is, whole numbers).


    ```


    ```


