    \n我们将尝试在它上设置一些不存在的类别（即除“自传”以外的任何类别），除非有错误否则测试将失败：\n\n```\n```\n\n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore_test.go))\n\
