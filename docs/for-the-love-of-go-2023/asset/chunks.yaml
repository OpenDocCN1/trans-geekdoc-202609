    \ `Divide` 本身。\n\n## 结语\n\n* 在编写多个相似的测试时，不要害怕复制粘贴现有的测试并修改它来实现你的需求（只需不要忘记检查是否已进行了所有必要的更改）。\n\
    * 编写测试的初始结果应该是编译器错误，如 `undefined: calculator.Multiply`（因为我们还没有写那个函数）。\n* 下一步是编写该函数的*空实现*，让它刻意返回错误的结果，这样我们就可以检查测试是否检测到了这种情况。\n\
    * 一旦我们验证了测试运行正常，就可以继续编写该函数的真实实现，当测试通过时，我们就可以确信我们写得对了。\n* 当我们需要针对不同的输入多次测试某些行为时，我们可以使用*测试用例*的切片并对其进行循环，测试每一个用例。\n\
    * `for ... range` 循环将为切片中的每个元素执行一次某些代码。\n* 仅仅测试许多相似的案例没有意义：为了增加我们对函数正确性的信心，我们应该尝试我们所能想到的尽可能*不同*类型的案例：零、负数、空、反向、正向、侧向。\n\
