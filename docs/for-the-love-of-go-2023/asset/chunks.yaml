    这将打开你的默认网络浏览器以查看生成的 HTML。


    Visual Studio Code 的 Go 扩展允许你直接在编辑器中高亮已覆盖的代码，使用的命令是 `Go: Toggle Test Coverage
    in Current Package`。其他编辑器也有类似的功能。


    你会发现某些行完全没有着色。这些通常是类型定义、常量等内容。虽然它们是程序的一部分，但它们实际上是给编译器的指令，不会在你的程序二进制文件中生成任何编译后的目标代码，因此覆盖率工具会忽略它们。它们不会被计入覆盖率统计中。


    正如我们所看到的，如果你从一开始就根据测试引导来开发程序，那么理论上不应该有任何没有被测试覆盖的系统代码。但如果有的话，看起来会什么样呢？让我们来做一个实验。


    ## 测试后开发（Test-last development）


    假设你被分配到 Happy Fun Books 项目去实现一个请求的功能，而你对编写测试并不熟悉，所以你直接上手并添加了一段系统代码。这可能会被现有的测试覆盖，但很可能不会，所以我们应该使用覆盖率工具来检测未被覆盖的语句。


