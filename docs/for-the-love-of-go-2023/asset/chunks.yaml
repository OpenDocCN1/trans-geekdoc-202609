    \nNow that we’ve successfully designed and implemented a new calculator feature,\
    \ guided by tests, it’s time to think a little more about testing more complicated\
    \ behaviour. The `Add`, `Subtract`, and `Multiply` functions are so simple that\
    \ it’s difficult (though not at all impossible, for a determined programmer) to\
    \ get them wrong. If `TestAdd` passes for one set of inputs, for example it’s\
    \ hard to imagine other inputs that would make it fail.\n"
