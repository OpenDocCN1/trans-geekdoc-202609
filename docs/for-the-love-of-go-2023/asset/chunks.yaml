  trans: '

    现在，这本书是为具有一定经验的 Go 程序员准备的，因此我假设你已经能够用 Go 编写一个“Hello, world”程序、编译它、运行它等等。（如果不会，我建议你先阅读同一位作者的
    [Go 语言入门](https://bitfieldconsulting.com/books/love)。）


    假设你对 Go 语言至少有一点经验，那么这本书将侧重于如何*使用*它来做些什么。换句话说，我们如何用 Go 构建可靠、易用且工程化良好的软件？


    这将涉及一些对你来说可能是新颖的想法、技术和流程。当你尝试学习新事物时，从你已经理解得相当好的东西开始（比如一个“Hello, World”程序）是有意义的。


    所以，让我们从一个简单且（希望）对你来说熟悉的 Go 版“Hello to world”程序开始，并在此基础上进行开发。


    ## Hello, world


    ```go

    //

    ```

    ```


    ([Listing 1.1](https://github.com/bitfield/tpg-tools/blob/main/1.1/main.go))


    列表 1.1 中的所有内容对经验丰富的 Gopher 来说都应该是熟悉的。我们声明了 `main` 包，它对 Go 编译器有特殊含义：指示它构建一个可执行的二进制文件。


    我们还声明了特殊函数 `main`，它将是二进制文件的入口。当运行二进制文件时，`main` 会被调用以启动程序。


    `main` 做了什么？它调用了标准库函数 `fmt.Println`，该函数将字符串打印到程序的标准输出。


    这个源文件的命名并不重要，因为 Go 只查看 `package` 声明；不过按照惯例，包 `main` 中的代码命名为 `main.go`。


    让我们运行它：


    `go run main.go`


    ```

    Hello, world

    ```


    这没问题：程序编译并运行，且打印了预期的消息。但我们能做得更好吗？这个程序有什么问题吗（如果有的话）？


    ## 写包，而不是程序


    事实上，它没有任何问题：许多程序的设计就是为了直接从命令行运行，执行某些任务，然后退出。这样的程序通常被称为*工具*。


    可能是计算机领域中除编程语言本身最重要的发明之一，就是可导入的*包*（package）的概念：一个可重用的软件单元，可以包含许多不同的程序中，通常用于执行某些特定任务。


    如果没有包，我们不得不一直向计算机说明我们想做的每一个细节。事实上，如果没有包，Go 标准库中的包将很难管理。例如，每当我们想写一个 HTTP 服务器时，都必须自己实现
    HTTP 协议，这可非易事。


    Go 在创建和使用包方面提供了极佳的支持。几乎每个存在的 Go 项目本身就是一个包（或者是一个相关包的库，如标准库），可以被其他程序导入。这对于程序员来说是一个巨大的力量倍增器：无论你想做什么，可能已经写好了一个包，可以几乎完全实现你的需求。


    在很多情况下，创建一个特定程序所需要做的就是弄清楚如何我们将所需的各种包组合在一起，工作就完成了。然后我们可以让*我们的*程序也成为一个包，反过来供其他程序员使用。


    由此推导出，你程序中的任何非本质代码都不应该放在 `main` 包中；它们应该放在某个*可导入*的包中。你所需要的只是导入那个包并在你的 `main` 函数中调用它。因为你导入了它，其他人也可以导入它并在他们自己的程序中使用它，而如果你把代码放在
    `main` 包中，他们就做不到。


    避免将代码放在 `main` 中的另一个原因是它是很难测试的，原因相同：你无法导入它。

    '
