    See the end of this book for a sneak preview of the first chapter of *The Power
    of Go: Tools*!


    ## The Power of Go: Tests


    What does it mean to program with confidence? How do you build self-testing software?
    What even is a test, anyway? [The Power of Go: Tests](https://bitfieldconsulting.com/books/tests)
    answers these questions, and many more.


    [![](media/file18.png)](https://bitfieldconsulting.com/books/tests)


    Welcome to the thrilling world of fuzzy mutants and spies, guerilla testing, mocks
    and crocks, design smells, mirage tests, deep abstractions, exploding pointers,
    sentinels and six-year-old astronauts, coverage ratchets and golden files, singletons
    and walking skeletons, canaries and smelly suites, flaky tests and concurrent
    callbacks, fakes, CRUD methods, infinite defects, brittle tests, wibbly-wobby
    timey-wimey stuff, adapters and ambassadors, tests that fail only at midnight,
    and gremlins that steal from the player during the hours of darkness.


    > *If you get fired as a result of applying the advice in this book, then that’s
    probably for the best, all things considered. But if it happens, I’ll make it
    my personal mission to get you a job with a better company: one where people are
    rewarded, not punished, for producing software that actually works.*


    Go’s built-in support for testing puts tests front and centre of any software
    project, from command-line tools to sophisticated backend servers and APIs. This
    accessible, amusing book will introduce you to all Go’s testing facilities, show
    you how to use them to write tests for the trickiest things, and distils the collected
    wisdom of the Go community on best practices for testing Go programs. Crammed
    with hundreds of code examples, the book uses real tests and real problems to
    show you exactly what to do, step by step.


    You’ll learn how to use tests to design programs that solve user problems, how
    to build reliable codebases on solid foundations, and how tests can help you tackle
    horrible, bug-riddled legacy codebases and make them a nicer place to live. From
    choosing informative, behaviour-focused names for your tests to clever, powerful
    techniques for managing test dependencies like databases and concurrent servers,
    [The Power of Go: Tests](https://bitfieldconsulting.com/books/tests) has everything
    you need to master the art of testing in Go.


    ## Know Go: Generics


    Things are changing! Go beyond the basics, and master the new generics features
    introduced in Go 1.18. Learn all about type parameters and constraints in Go and
    how to use them, with this easy-to-read but comprehensive guide.


    [![](media/file19.png)](https://bitfieldconsulting.com/books/generics)


    If you’re new to Go and generics, and wondering what all the fuss is about, this
    book is for you! If you have some experience with Go already, but want to learn
    about the new generics features, this book is also for you. And if you’ve been
    waiting impatiently for Go to just get generics already so you can use it, don’t
    worry: this book is for you too!


    You don’t need an advanced degree in computer science or tons of programming experience.
    [Know Go: Generics](https://bitfieldconsulting.com/books/generics) explains what
    you need to know in plain, ordinary language, with simple examples that will show
    you what’s new, how the language changes will affect you, and exactly how to use
    generics in your own programs and packages.


    As you’d expect from the author of For the Love of Go and The Power of Go: Tools,
    it’s fun and easy reading, but it’s also packed with powerful ideas, concepts,
    and techniques that you can use in real-world applications.


    ## Further reading


    You can find more of my books on Go here:


    *   [Go books by John Arundel](https://bitfieldconsulting.com/books)


    You can find more Go tutorials and exercises here:


    *   [Go tutorials from Bitfield](https://bitfieldconsulting.com/golang)


    I have a YouTube channel where I post occasional videos on Go, and there are also
    some curated playlists of what I judge to be the very best Go talks and tutorials
    available, here:


    *   [Bitfield Consulting on YouTube](https://www.youtube.com/c/BitfieldConsulting)


    ## Credits


    Gopher images by the magnificent [egonelbre](https://github.com/egonelbre/gophers)
    and [MariaLetta](https://github.com/MariaLetta/free-gophers-pack).


    # Acknowledgements


    It takes a village to raise a book, and the ideas in this one have been shaped
    and refined over several years in collaboration with my students at the [Bitfield
    Institute of Technology](https://bitfieldconsulting.com/golang/bit), my online
    software engineering school. They have taught me just as much as I’ve taught them,
    and many have gone on to become amazing engineers at top-tier companies like Cisco,
    Microsoft, and Facebook. I feel very privileged to have had some involvement,
    however minor, with their craft mastery and career success.


    I want to thank specifically, if not exclusively, Adebayo Ogidiolou, Bryan Green,
    Bukola Jimoh, Christian Sage, Dave Cottlehuber, Ivan Fetch, Jackson Kato, Jakub
    Jarosz, Jon Barber, Josh Akeman, Joumana El Alaoui, Kevin Strong, Mike Stanton,
    Parish Mwangi, Piero Mamberti, Quinn Murphy, Richard Bright, Sherif Abdalla, Thiago
    Nache, Thibaut Girier, Thom Kling, and Umang Vanjara. It’s been my pleasure and
    honour to be part of your Go journey.


    Many thanks also to the hundreds of beta readers who willingly read early drafts
    of this book, and took the time to give me detailed and useful feedback on where
    it could be improved. They never fail to help me identify explanations that don’t
    work, jokes that don’t land, code that doesn’t compile, and (especially) things
    that make it harder for non-native speakers to understand what I’m driving at.


    If you’d like to be one of my beta readers in future, please go to my website,
    enter your email address, and tick the appropriate box to join my mailing list:


    *   [https://bitfieldconsulting.com/**


    This book is dedicated to my mother, to whom I’m immensely grateful for the dozens
    of hours she spent listening to my wild ideas, and helping me clarify and organise
    them into something resembling a book. Oh, for giving me life in the first place.
    That helped too, obviously.


    # A sneak preview


    If you’re wondering where to go next after reading this book, here comes a sneak
    preview of the first chapter of [The Power of Go: Tools](https://bitfieldconsulting.com/books/tools).
    If you enjoy this chapter, please use the discount code `LOVE-TOOLS` to get 25%
    off the price of the full book. Just go to the product page, add the book to your
    cart, and then enter the code at the checkout.


    Happy fun reading!


    # 1. Packages


    > *People think that computer science is the art of geniuses but the actual reality
    is the opposite, just many people doing things that build on each other, like
    a wall of stones.*


    >


    —Donald Knuth


    ![](media/file20.png)


    There are many ways to write books on programming, but my favourite is the one
    adopted by Brian Kernighan and Dennis Ritchie in their 1978 classic, ‘The C Programming
    Language’ (known as ‘K&R’, after the authors’ initials):


    > The only way to learn a new programming language is by writing programs in it.
    The first program to write is the same for all languages: print the words “Hello,
    world”.


    Why bother doing something trivial? They explain:


    > This is the basic hurdle; to leap over it you have to be able to create the
    program text somewhere, compile it successfully, load it, run it, and find out
    where your output went. With these mechanical details mastered, everything else
    is comparatively easy.

