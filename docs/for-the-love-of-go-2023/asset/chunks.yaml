    \ is true. Instead of a straight line down the left margin, it zigzags inward,\
    \ to the right.\n\n## Takeaways\n\n- The `go mod init` command initialises a new\
    \ Go project folder.\n- The `go test` command runs tests for a Go package.\n-\
    \ The `gofmt` command will check Go code for standard formatting and fix it if\
