  fmt: "\nA wise bookseller knows how to adjust prices to keep up with demand. So\
    \ we’ll need to be able to update prices on the books at Happy Fun Books, and\
    \ we don’t want to modify the `PriceCents` field directly, because there’s no\
    \ way to validate changes like that.\n\nInstead, suppose we created a method to\
    \ make the change for us. Let’s call it `SetPriceCents`. We can pass it the new\
    \ price as a parameter and, importantly, it’ll be able to check the price to ensure\
    \ it’s not negative.\n\n**GOAL:** Write suitable tests for a `SetPriceCents` method\
    \ on the `Book` type. You’ll need at least two tests, because we’re saying there\
    \ are two different behaviours: one for valid input, and another for invalid input.\
    \ If you have trouble, refer back to previous tests you’ve written for functions\
    \ that validate their input, such as `calculator.Divide` and `bookstore.GetBook`.\n\
    \nLet’s consider the valid input case first. We’ll need some `Book` value to operate\
    \ on, so let’s start by defining that:\n\n```\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore_test.go))\n\
    \nWe’ll be calling the `SetPriceCents` method on this value with some new price\
    \ (let’s say 3000), and that’s the price we’ll `want` it to be afterwards:\n\n\
