    ## The `switch` statement


    Suppose you’re interested to know whether a certain number is positive, negative,
    or zero. You could perfectly well write a series of `if` statements to find this
    out, and sometimes that’s fine. But this becomes verbose and complicated as the
    number of choices, and possible code paths, grows.


    What we want is a conditional statement that lets us specify any number of *cases*
    (that is, possible conditions), linking each case to a different code path. Go’s
    `switch` statement does exactly this. Here’s an example:


    ```


    ```


    We begin with the keyword `switch`, followed by an opening curly brace, and then
    a list of *cases*, and a final closing curly brace.


    ## Switch cases


    Each case is introduced by the keyword `case`, followed by some conditional expression
    (for example, `x < 0`) and a colon.


    We can then supply some statements to be executed if the case condition is true
    (for example, print out a message).


    When Go encounters a `switch` statement like this, it looks at the first case
    and evaluates the conditional expression there. If this expression is true, the
    statements for this case are executed, and that’s the end of the `switch` statement;
    control moves on to the next part of the program.


    If the expression is false, execution moves on to the next case, and so on, until
    it finds a case that matches (that is, whose conditional expression evaluates
    to `true`). If no case matches, then nothing happens and the program moves on.


    It’s important to know that, once a case has been matched, Go doesn’t examine
    any further cases, and skips to the end of the statement instead. You might think
    that *all* matching cases are executed, but that’s not how it works: only the
    *first* matching case is executed.


    There’s a special statement to change this behaviour: writing `fallthrough` at
    the end of a case tells Go to execute the statements in the next case, instead
    of skipping to the end. But `fallthrough` is rarely used, or needed; still, now
    you know about it.


    ## The default case


    There is a special case named `default`, which matches only if no other case does.
    In the previous example, if `x` is neither less than zero (the first case), nor
    greater than zero (the second case), then the only possibility left is that `x`
    is zero, which is the `default` case.


    You should always supply a `default` case if you can: this makes your programs
    clearer and more reliable.


    `switch` is a very convenient way to write program logic that needs to take one
    of N possible paths depending on a set of conditions, and it’s more concise than
    writing the corresponding `if ... else if ... else if ...` statements. But note
    that your `switch` cases should all be related. Don’t just use `switch` as a way
    of avoiding writing multiple unrelated `if` statements; that leads to confusing
    code.


