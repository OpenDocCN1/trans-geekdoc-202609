    it compares, for any indexes `i` and `j`, the corresponding slice elements, and
    returns `true` if element `i` is less than element `j`, or `false` otherwise.
    (Note that it’s not comparing the values of `i` and `j` directly, but instead
    the values of the elements at index position `i` and `j`.)


    As `sort.Slice` proceeds, it will call this `less` function repeatedly, until
    it’s established that the slice is completely ordered according to this function.
    We could have written any function we want, of course, to describe any specific
    ordering that we’re interested in. But this particular function specifies ascending
    numeric order, which is usually what we need.


