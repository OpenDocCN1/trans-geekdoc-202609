  trans: '

    发生了一些奇怪的事情。进一步深入调查发现，大约一半的时间，`GetAllBooks` 返回了我们预期的切片，从而通过了测试。但在其余的时间里，切片元素的顺序是反的，书籍
    ID 为 2 的书籍排在第一。由于切片是有序的，因此它与我们的 `want` 切片并不相等，导致测试失败。


    事实上，我们可以用一个简单得多的循环重现这种奇怪的行为：


    ```


    ```


    ```


    该代码的输出是：


    ```

    1

    2

    ```


    或者，在大约一半的时间里是：


    ```

    2

    1

    ```


    显然，map 在此程序的每次运行之间并没有发生变化，因此 `range` 循环似乎是以不断变化的顺序在遍历 map 的键。是 Go 语言本身有什么问题吗？


    事实上，这种行为是设计如此的。Go 中的切片是有**序的（ordered）**，这意味着它们不仅仅是一组元素。它们以特定的**序列（sequence）**出现。但
    map 并非如此：在某种意义上，它们仅仅是一组键值对，没有任何特定的顺序。


    我们的测试使用了一个包含两本书的 map，提供了两种可能的排序方式，因此测试大约一半时间会失败。我们可以做什么来避免这种情况？


    嗯，让我们更仔细地思考*我们在这里真正测试的是什么*。当我们获取所有书籍列表时，我们在意它们是否有特定顺序吗？并不真正。所以 `GetAllBooks` 实际上在做正确的事：返回完整的书籍列表，没有特定的顺序。那么，问题出在我们的*测试*上。


    我们将 `GetAllBooks` 的结果与一个切片进行比较，正如我们所看到的，切片本质上是有序的。但只要所有书籍都存在，我们不在乎看到的书籍顺序。为了让测试变得可靠，我们可以在与预期值比较之前，对结果切片进行排序（`sort）。


    ## 排序切片


    标准库提供了一个非常实用的 `sort.Slice` 函数，它可以完成我们所需。它接受两个参数：要排序的切片，以及一个解释切片中任意两个元素应该如何排序的比较函数。


    比较函数告诉 `sort.Slice` *如何*排序元素。也就是说，给定两个元素（我们称它们为 `i` 和 `j`），比较函数决定元素 `i` 是否应该在元素
    `j` 之前。如果是的话，它返回 `true`。


    我们应该如何对书籍切片排序？嗯，这并不重要，只要它们最终的顺序与我们的 `want` 切片相同即可，而那恰好是 ID 排序的。所以让我们在这里也同样操作：


    ```


    ```


    ```


    ([列表 17.3](https://github.com/bitfield/ftl-code/blob/main/17.3/bookstore_test.go))


    ## 函数字面量


    这里有一种新语法：*函数字面量（function literal）*。你之前见过各种字面量：字符串、结构体、切片和 map。`sort.Slice` 的第二个参数是一个函数字面量。它的写法如下：


