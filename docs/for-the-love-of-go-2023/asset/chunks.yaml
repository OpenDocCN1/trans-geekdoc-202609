    \ Of course, lots of interesting things may happen along the way, but that’s the\
    \ basic shape of your Go program’s life cycle.\n\n## The `init` function\n\nIn\
    \ fact, `main` isn’t always the first function that runs. If there’s a function\
    \ named `init` present, that will run first. If your `main` package imports other\
    \ packages, and *they* have `init` functions, they will also all be run before\
    \ your `main` function starts.\n\nI don’t recommend that you use `init`. While\
    \ it can be useful to be able to set up certain things before the start of the\
    \ program, or to automatically run code whenever a package is imported, `init`\
    \ is rather magical and non-obvious. You may not even know that a package has\
    \ an `init` function, unless you go looking for it, so this makes it harder to\
    \ follow the flow of control.\n\nAnd, as you’ve learned already in this book,\
    \ it’s a good idea to make the flow of control in your programs as straightforward\
    \ and obvious as possible. If you read other people’s programs, which I recommend,\
    \ you’ll find that they don’t always do this.\n\n## Alternatives to `init`\n\n\
    Fortunately, we never need `init`. There are better ways to achieve the same result.\
    \ The most obvious one is to just do whatever you need to do at the start of `main`!\n\
    \nIn an imported package, though (which is to say any package whose name is not\
    \ `main`), you can’t control which function is called first. So if you need to\
    \ initialise some data structure, for example, before anything else will work,\
    \ one way to do that is to use a `var` statement.\n\nWhile almost all Go code\
    \ is inside functions, as you learned in the first chapter of this book, we’re\
    \ allowed to place `var` statements outside a function (at package level). And\
    \ since `var` statements can not only declare variables but also assign values\
    \ to them, including values returned from function calls, you can use this to\
    \ do your initialisation.\n\nFor example:\n\n```\n\n```\n\nThis presumes that\
    \ you’ve defined the `initialiseThing` function somewhere in this package, but\
    \ that’s fine. The point is that you can make sure that function runs before any\
    \ other in the package, and you don’t need to rely on the magical behaviour of\
    \ a function named `init`. This is just plain old Go code that everyone can read\
    \ and understand.\n\n## Building an executable\n\nLet’s write an executable program\
    \ that has a `main` package and a `main` function, then. Create a new folder named\
    \ `hello` (make sure it’s not a subfolder of any of your other Go projects). Add\
    \ a file named `main.go` in this folder (just as with any other package, it’s\
    \ conventional, but not actually necessary, to give the file the same name as\
    \ the package it implements).\n\nAdd this to the file:\n\n```\n\n```\n\nYou now\
    \ know that the `package main` declaration is essential if we want to produce\
    \ an executable. And we also need a function `main`, or the executable wouldn’t\
    \ do anything.\n\nAs you may know, you can run this program directly from the\
    \ command line by typing `go run main.go`. That’s useful for testing or experimenting,\
    \ but this time we’re interested in producing a binary executable.\n\nRemember\
    \ earlier in this book when we built a binary for our calculator program, using\
    \ the `go build` command? Let’s try that with this program. Run the following\
    \ command within the `hello` folder:\n\n```\ngo build\n```\n\n## The executable\
    \ binary file\n\nIf there are no errors, this command won’t produce any output,\
    \ but you’ll find that a new file has been created alongside your `main.go`, named\
    \ `hello`.\n\nLet’s inspect it to see what kind of file it is:\n\n**`file hello`**\n\
    \n```\nhello: Mach-O 64-bit executable x86_64\n```\n\nYou may see different output\
    \ depending on your operating system, or CPU architecture, but that’s the point:\
    \ the Go compiler has produced an executable file in just the format that your\
    \ system requires.\n\nTo run it, use the program name itself as the command:\n\
    \n**`./hello`**\n\n```\nHello, world!\n```\n\nSuccess! This may not be the first\
    \ time you’ve built and run a Go program, but now you know exactly what’s happening,\
    \ and why. The operating system loaded your binary `hello` file and started executing\
    \ it at the machine code instruction representing the beginning of the `main`\
    \ function. The flow of control proceeded all the way to the end of this function,\
    \ and then the program exited.\n\nThe nice thing about having a binary file like\
    \ this is that you can copy it to any other computer and run it there, with no\
    \ other dependencies (provided that it has the same operating system and CPU architecture).\
    \ That computer doesn’t need to have the Go tools installed, or, indeed, anything\
    \ else at all. You could run this binary in a Docker container, or in Kubernetes,\
    \ or in any other way, and all you need is one small file (this program takes\
    \ up about 2 MiB on my system).\n\n## Cross-compilation\n\nYou might be wondering\
    \ how to build executables for other operating systems, such as Linux or Windows,\
    \ and other types of CPU, such as ARM64? Do you need to compile your program again\
    \ on every system that you want to create executables for?\n\nHappily, the answer\
    \ is no. You can build an executable for any system you like, right here on your\
    \ own machine. The target operating system for the `go build` command is controlled\
    \ by the `GOOS` environment variable (pronounced, we are assured by the Go team,\
    \ “goose”). The target CPU architecture is set by the `GOARCH` variable (pronounced\
    \ “gorch”).\n\nLet’s try an example:\n\n```\nGOOS=windows go build\n```\n\nThis\
    \ produces a file called `hello.exe`, which is what you’d expect for a Windows\
    \ executable. But is it?\n\n**`file hello.exe`**\n\n```\nhello.exe: PE32+ executable\
    \ (console) x86-64 (stripped to external\nPDB), for MS Windows\n```\n\nHow about\
    \ an executable for an ARM-based Linux system?\n\n**`GOOS=linux GOARCH=arm go\
    \ build`**\n\n**`file hello`**\n\n```\n hello: ELF 32-bit LSB executable, ARM,\
    \ EABI5 version 1 (SYSV),\n statically linked, Go BuildID=xxx, not stripped\n\
    ```\n\nVery handy! You can get a list of all the GOOS and GOARCH combinations\
    \ supported by your Go version by running the command `go tool dist list`.\n\n\
    ## Exiting\n\nAs you saw earlier in this chapter, a Go program automatically exits\
    \ (that is, stops executing and returns control to the operating system) once\
    \ it reaches the end of `main`. But what if you want to exit before that? Or what\
    \ if you want to signal the operating system that there was some kind of run-time\
    \ error with the program?\n\nGo provides the `os.Exit` function for exactly this\
    \ purpose. You need to pass it a parameter called the *exit code*, or *exit status*.\
    \ This is just a number, and conventionally, a zero exit status indicates that\
    \ everything’s fine, whereas a non-zero value would imply that some error happened.\n\
    \nHere’s an example:\n\n```\n\n```\n\nIf you run this program (either by running\
    \ it directly with `go run`, or by building an executable with `go build` and\
    \ then running that) you’ll see that the shell reports:\n\n```\nexit status 1\n\
    ```\n\nYou can also exit the program at any point by calling `log.Fatal` with\
    \ a message, or by calling the built-in `panic` function. Both of these will immediately\
    \ terminate the program with a non-zero exit status (and, in the case of `panic`,\
    \ some information about where in the code the panic was triggered).\n\nThe problem\
    \ with either `log.Fatal` or `panic` is that, if they’re buried deeply in the\
    \ code, it can be hard for a reader to see how and where the program can exit.\
    \ A good rule of thumb, then, is to only exit the program from the `main` function.\
    \ It brought you into the world, if you like, so it should be the one to see you\
    \ out.\n\nAnd on that note, it’s nearly time to see ourselves out. It’s been great\
    \ fun working together and learning about Go, and I hope you feel the same. In\
