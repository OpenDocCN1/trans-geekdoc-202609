    \n`GetAllBooks` 的逻辑不需要更改；唯一不同的是签名。它现在有一个类型为 `Catalog` 的接收者（某种意义上）。\n\n这通过了测试，所以我们成功定义了\
    \ `Catalog` 类型以及 `GetAllBooks` 方法。你也能将这个想法扩展到 `GetBook` 吗？\n\n**目标：** 将 `GetBook`\
    \ 更新为目录的方法。从修改有效和无效输入的测试开始。确保你获得预期的结果。\n\n如果你卡住了，请查看我的[测试](https://github.com/bitfield/ftl-code/blob/main/19.5/bookstore_test.go)\
