    There’s nothing especially new to you here, except for the fact that our core
    struct type is unexported. But you might be puzzled about this, because you know
    that making an identifier unexported means it can’t be used outside the package
    where it’s defined. So how can we use it in the tests?


    The answer is that we don’t! We never refer to the name `creditcard.card` in any
    test code. We don’t need to. `creditcard.New` returns a value of some type that
    we don’t need to know the name of, because we don’t use its name. We call the
    `Number` method on it. Since the *method*’s name is exported, we’re allowed to
    call it.


    This very neatly ensures that values of type `card` are always valid. It’s impossible
    to construct an invalid one, at least from outside the `creditcard` package (try
    it yourself!)


    ## A set of valid values


    Now that we’ve seen how to use Go’s type machinery to ensure that data is validated,
    let’s think about that validation process in a little more detail. So far we’ve
    only done very simple validation, such as ensuring a value isn’t negative or empty.
    Can we do more?


    We would often like to ensure that some value is one of a predefined set of possibilities,
    like the book category in the previous chapter. Actually, in that case the set
    of valid values had only one element, `"Autobiography"`. What if that set were
    larger? A real bookstore might have dozens of categories, and we feel instinctively
    that we should be able to do better than writing a bunch of `if` statements.


    What would be very convenient is if we had some kind of data structure containing
    a set of unique elements. Actually, that sounds familiar, doesn’t it? The keys
    of a Go map have exactly those properties, so let’s see if we can use a map to
    store and validate our categories. Suppose we want there to be exactly three valid
    categories:


    ```


    ```


    Now this sounds like my kind of bookstore!


    ## Using a map to represent a set


    Here’s one way we could model the set of categories as a map. We could define
    a package-level variable in `bookstore.go` that looks something like this:


    ```


    ```


    Checking if a given value is in this set is as simple as performing a map lookup:


    ```


    ```


    If the category is in the map, the result will be `true`, since all the elements
    of the map are `true`. But what about categories that aren’t in the map? As you
    might remember from the chapter introducing maps, they return the *zero value*
    for missing keys, and the zero value for `bool` is `false`. So that means invalid
    categories will return `false` without us having to do anything. Ideal!


    By the way, you might have wondered why I named the map `validCategory`: wouldn’t
    `validCategories` make more sense? The answer is that it makes the code that *uses*
    the map read more naturally. `if validCategory...` reads almost like English,
    whereas `if validCategories...` just sounds a bit wrong. Little details like this
    can go a long way to making your code easier and more enjoyable to read.


    A question might have occurred to you: Can we implement categories in such a way
    that the *compiler* can validate them for us? In other words, these names (`"Large
    Print Romance"` and so on) are currently just arbitrary strings, but could we
    make them Go identifiers, like variable or function names, so that we can define
    a set of them in our package?


    Go has a special feature that’s intended for just this purpose: *constants*.


    ## Defining constants


    We define a constant using the `const` keyword:


    ```


    ```


    Just as with imports or variables, we can group multiple constant definitions
    together using parentheses:


    ```


    ```


    It’s easy to update our `validCategory` map to use these new constants instead
    of the string literals we had before:


    ```


    ```


    ## Referring to constants


    The real benefit of this is that now the user of our package can refer to these
    predefined constants, instead of arbitrary strings:


    ```


    ```


    Notice that if they should misspell the name of the category, the compiler will
    pick this up:


    ```


    ```


    ## Standard library constants


    This technique is used a lot in the standard library. For example, the `net/http`
    package defines named constants for all the various HTTP status codes, such as
    `http.StatusOK`, or `http.StatusNotFound`. Of course, this helps you catch your
    own mistakes when writing code that deals with HTTP statuses, since if you try
    to refer to a non-existent constant (`http.StatusBogus`), the compiler won’t let
    you.


    Using a constant like `http.StatusOK` also makes your code more readable, since
    anyone looking at it can see right away what that value signifies, unlike a literal
    value like `200`, which takes a little more thought.


    ## When the values don’t matter


    If we’re just defining a bunch of constants, and the only thing we care about
    is that some arbitrary value is one of those constants, then the actual *value*
    of the constant doesn’t matter, does it? It could be anything. It doesn’t even
    need to be a string.


    Suppose we make it an integer, for example:


    ```


    ```


    This would mean that a method like `SetCategory` would now take, not a `string`
    parameter, but `int`. That sounds a little bit strange: what have integers to
    do with book categories? Let’s trivially define a type `Category` to use instead:


    ```


    ```


    Now we can declare our constants to be of this type:


    ```


    ```


    Note that it’s not necessary to add the type `Category` for each constant, just
    the first one; all the others will automatically be the same type.


    ## Introducing `iota`


    We can imagine extending this idea to any number of categories, just by defining
    more constants with increasing integer values.


    In fact, that’s so common in Go, there’s a special “magic” constant to do it for
    us, called `iota`:


    ```


    ```


    ([Listing 23.2](https://github.com/bitfield/ftl-code/blob/main/23.2/bookstore.go))


    When you declare a constant and assign it `iota`, it will get the value 0, and
    successive constants will get successively increasing values: 1, 2, 3… The word
    “iota” is the name of the smallest letter in the Greek alphabet, incidentally,
    and it’s come to mean in common usage “the smallest possible amount” of something,
    as in “not one iota”.


    The `iota` constant is most useful when we want to declare a set of constants
    to represent the allowed values of something, but we don’t actually care what
    those values *are*. Instead of making up arbitrary values, we can use `iota` to
    enumerate them for us. All that we care about is that they’re different from each
    other, and `iota` will make sure of that.


    It might be, for example, that we later want to insert new constants somewhere
    in the middle of the list, and we won’t have to manually renumber dozens of them.
    `iota` renumbers them automagically. Thanks, `iota`!


    **GOAL:** Update your `bookstore` package, including the tests, to define a set
    of `iota`-enumerated category constants, and modify `SetCategory` to validate
    the category using a map of these constants.'
