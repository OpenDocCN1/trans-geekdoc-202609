- raw: "Use any standard or third-party packages you think are appropriate. The function\
    \ should return an error for negative inputs (no real number squared equals a\
    \ negative number, so taking the square root of a negative number is not a valid\
    \ operation). The test should check the error handling in the same way as the\
    \ tests for `Divide`.\n\nDon’t forget, because of the inexactitude of floating-point\
    \ calculations, we may need to use a function like `closeEnough` to compare the\
    \ results with expectations. Depending on the test cases, we may need to make\
    \ the tolerance value larger; perhaps as large as 0.1.\n\nWhen the feature is\
    \ complete, you’re done. Nice work. The company has awarded you a sizable bonus,\
    \ and an all-expenses-paid vacation. Enjoy it!\n\nIf you get stuck, or if you’d\
    \ like to compare your solution with mine, have a look at the sample implementations\
    \ of `TestSqrt`, `TestSqrtInvalid`, and `Sqrt` in [Listing 8.1](https://github.com/bitfield/ftl-code/blob/main/8.1/).\n\
    \n## Running programs\n\nSo far in this book, we’ve written tests and functions\
    \ in Go, and run the tests using the `go test` command. That’s all very well,\
    \ but you might be wondering how to run a *program* in Go, rather than just a\
    \ set of tests. In this section, we’ll see how to do exactly that.\n\nIn order\
    \ for any program to run on a computer it needs to be in the form of an *executable\
    \ binary*: a file containing machine code that the computer’s CPUs can understand,\
    \ in the particular format required by its operating system.\n\nTo turn a text\
    \ file containing source code into an executable binary file, Go uses a program\
    \ called a *compiler* (that’s what gives us all the angry messages about undeclared\
    \ variables and mismatched types). The compiler translates Go programs into machine\
    \ code, producing an executable binary that we can then run.\n\nSo how does that\
    \ work?\n\n## The `main` package\n\nIn order for a bunch of Go source code to\
    \ produce an executable, there has to be at least some code in a special package\
    \ named `main`. Since we can’t have more than one package in the same folder (apart\
    \ from test packages), we’ll need to put the `main` package in a subfolder of\
    \ your project.\n\nBecause the `main` package produces a *command* (that is, an\
    \ executable), it’s conventional to name this folder `cmd` (short for “command”).\n\
    \nIt’s not enough just to declare a `main` package, though. Whatever our program\
    \ does, it has to *start* somewhere, and the Go compiler needs to know where that\
    \ should be. The way we tell it is by defining a special function, also named\
    \ `main`.\n\nThe flow of control in a Go program begins at the beginning of the\
    \ `main` function, and works through it in statement order, perhaps calling other\
    \ functions along the way. When (and if) execution reaches the end of `main`,\
    \ the program stops.\n\n## The `go run` command\n\nLet’s write an executable program\
    \ that has a `main` package and a `main` function, then. We’ll use our `calculator`\
    \ package to perform some calculation, and print the result in the user’s terminal.\n\
    \nCreate a new subfolder named `cmd` in the `calculator` project. Because there\
    \ could be more than one command associated with this package, let’s create a\
    \ further subfolder `calculator`, too:\n\n**`mkdir -p cmd/calculator`**\n\nAdd\
    \ a file named `main.go` in this folder, containing the following:\n\n```\n\n\
    ```\n\n([Listing 8.2](https://github.com/bitfield/ftl-code/blob/main/8.2/cmd/calculator/main.go))\n\
    \nWe know that the `package main` declaration is required if we want to produce\
    \ an executable binary. And we also need a function `main`, or the binary wouldn’t\
    \ do anything.\n\nHere’s the folder structure we should end up with:\n\n```\n\
    calculator/\n    calculator.go\n    calculator_test.go\n    cmd/\n        calculator/\n\
    \            main.go\n    go.mod\n```\n\nWe can run this program directly from\
    \ the command line by using the `go run` command:\n\n**`go run cmd/calculator/main.go`**\n\
    \nHere’s the result:\n\n```\n4\n```\n\nThat’s encouraging!\n\n## The `go build`\
    \ command\n\nThe `go run` command is useful for quickly checking whether the program\
    \ works, but if we actually want to *distribute* our software to customers, a\
    \ more convenient way to do that is to build an executable file. Let’s see how\
    \ that works.\n\nTo create the executable, run the command:\n\n**`go build -o\
    \ add ./cmd/calculator`**\n\nWindows works slightly differently, so if you’re\
    \ on that platform you’ll need to run instead:\n\n**`go build -o add.exe ./cmd/calculator`**\n\
    \nIf there are no errors, this command won’t produce any output, but you’ll find\
    \ that a new file has been created in the current directory, named `add`.\n\n\
    To run it, use the program name itself as the command:\n\n**`./add`**\n\n```\n\
    4\n```\n\nOn Windows, run just:\n\n**`add`**\n\nGreat job! We’ll have more to\
    \ say about `go build` and what it can do later in the book, in the “Building\
    \ blocks” chapter, but this is all we need for the moment.\n\nNow that you’ve\
    \ successfully developed and shipped the calculator application, your engagement\
    \ at Texio Instronics is complete. It’s time to move on to your next gig: helping\
    \ to build an online bookstore.\n\n## Takeaways\n\n*   A common compiler error\
    \ is something like `assignment mismatch: 2 variables but X returns 1 values`:\
    \ this means that we tried to receive a different number of results than the function\
    \ actually returns.\n\n*   When a function declares multiple result values, the\
    \ list of result types must be enclosed in parentheses: for example, `(float64,\
    \ error)`.\n\n*   Another common kind of compiler error is `not enough arguments\
    \ to return`, meaning that the function *declares* a certain number of result\
    \ values, but there’s a `return` statement with a different number of arguments.\n\
    \n*   When there’s no error, return the explicit value `nil` as the `error` result:\
    \ `nil` means “no error”.\n\n*   The compiler won’t let us declare a variable\
    \ that we never refer to again (it correctly infers that this must be a mistake).\n\
    \n*   But sometimes we *need* a variable syntactically, as in the left-hand side\
    \ of an assignment statement: in this case, we can use the *blank identifier*\
    \ `_` to act as a placeholder.\n\n*   The test failure for “invalid input” cases\
    \ should say something like “want error for invalid input, got nil”, and since\
    \ there’s no data in this message, we use `t.Error` instead of `t.Errorf`.\n\n\
    *   When a function detects an error, it should return zero for the data value,\
    \ or whatever the appropriate zero value is for its type, along with the error.\n\
    \n*   `if` statements often use `==` or `!=` to compare two values, but there\
    \ are other kinds of comparison *operators*: for example, `<` (less than), `<=`\
    \ (less than or equal to), `>` (greater than), `>=` (greater than or equal to).\n\
    \n*   We can also join together two or more expressions using *logical operators*\
    \ like `&&` (true if all expressions are true) and `||` (true if at least one\
    \ expression is true).\n\n*   To *negate* an expression, use the “not” operator\
    \ `!` (true if the expression is false).\n\n*   People make a lot of fuss about\
    \ testing, but it’s essentially very simple: first we work out what we `want`,\
    \ and then we compare it against what we actually `got`.\n\n*   Our workflow can\
    \ be summarised by the phrase “red, green, refactor”: write a failing test (red),\
    \ implement the code to make it pass (green), and then refactor both the code\
    \ and the test.\n\n*   If you can’t figure out how to test something, try testing\
    \ a smaller, simpler function with less behaviour; similarly, if you can’t figure\
    \ out how to implement something, use a simpler function as a stepping-stone.\n\
    \n*   Tests are all about comparisons, but we need to be careful when comparing\
    \ floating-point values, because there’s an inherent loss of precision in the\
    \ way computers store these numbers.\n\n*   An exact comparison may not work with\
    \ some values, in which case we can instead check whether the `want` and `got`\
    \ are *close enough*, for some definition of “enough”.\n\n*   The `go run` command\
    \ both compiles *and* executes a program, which is useful for testing.\n\n# 4\\\
    . Happy Fun Books"
