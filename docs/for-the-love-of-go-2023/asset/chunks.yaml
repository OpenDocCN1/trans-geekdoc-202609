    can we solve this? When you frame the question this way, it’s not hard to come
    up with the answer. Instead of having `Print` write to the terminal, give it something
    else to write to.


    ## Faking the terminal


    What do we really mean by “terminal” in this context, anyway? We mean `os.Stdout`.
    So now we can imagine that we pass something to the `Print` function that, in
    the real program, will actually *be* `os.Stdout`, but in the test, could be something
    else. What?


