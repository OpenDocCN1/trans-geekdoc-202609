    Now we’re ready to think about the first test.


    ## Testing the core struct type


    A struct type doesn’t really have any behaviour by itself, but we’d like to at
    least establish the core `Book` type before we move on. So let’s write a very
    simple test that doesn’t actually *do* anything, but can’t pass unless the `Book`
