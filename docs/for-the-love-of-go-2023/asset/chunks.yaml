    There’s no way this test can compile correctly until those things are defined
    somewhere (we could call it a *compile-only test*). Before defining them, we would
    like to be at the point where this test fails to compile with some message like
    `undefined: bookstore.Book`.


    Let’s create a new file `bookstore.go` and add a package declaration:


