- raw: "But now we’re saying there’s *another* behaviour, too. If the input is invalid,\
    \ `Divide`’s error result should be set to something that indicates a problem.\
    \ For every different thing the function can do according to circumstances, we\
    \ say it has a distinct behaviour.\n\nA nice rule to remember is:\n\n**One behaviour,\
    \ one test.**\n\nThis helps us create small, simple, focused tests that are easy\
    \ to read and understand. Each test should be about one specific behaviour of\
    \ the program.\n\nSo for the “valid input” behaviour, we can use the same basic\
    \ structure of test that we did for `Add`, `Subtract`, and `Multiply`, with a\
    \ few small changes. Let’s do that, before considering how to test the “invalid\
    \ input” behaviour.\n\n## Testing valid input\n\nLet’s start by creating the `TestDivide`\
    \ function, and copying and pasting the code from one of our existing tests; perhaps\
    \ `TestAdd`. Here it is:\n\n```\n\n```\n\n([Listing 5.1](https://github.com/bitfield/ftl-code/blob/main/5.1/calculator_test.go))\n\
    \nWhat needs to change here? Well, we’ll be calling the `calculator.Divide` function\
    \ instead of `calculator.Add`; that’s straightforward, so let’s make that change.\
    \ Let’s also set up some suitable cases:\n\n```\n\n```\n\n([Listing 6.1](https://github.com/bitfield/ftl-code/blob/main/6.1/calculator_test.go))\n\
    \n## Receiving the error value\n\nBut there’s something else, too. Here’s how\
    \ `TestAdd` sets the `got` value:\n\n```\n\n```\n\nWe’re saying that `Divide`\
    \ is going to return *two* results, though. The first is `got`, as usual—the answer\
    \ to the sum. But we’re adding a second result: the error indicator. We’ll need\
    \ to receive both these values in the assignment statement. Let’s name the second\
    \ value `err`, short for `error`:\n\n```\n\n```\n\nFine. We know how to compare\
    \ that `got` with `tc.want` to check the arithmetic; that’s no problem. What about\
    \ the `err` value? What should the test expect it to be?\n\nWell, *this* test\
    \ is only for the “valid input” behaviour, so we expect there to be no error.\
    \ We can do this by comparing `err` with the special value `nil` (meaning, in\
    \ this case, “no error”). If they are different, then the test should fail:\n\n\
    ```\n\n```\n\nWhy call `t.Fatalf` in this case, rather than `t.Errorf`, as we’ve\
    \ been using up to now? What’s the difference? Well, `t.Errorf` marks the test\
    \ as failed, but it still continues executing the rest of the test.\n\n`t.Fatalf`,\
    \ by contrast, exits the test immediately; it says that things are so broken that\
    \ there’s no point continuing. And this is the case here, since if `err` is not\
    \ `nil`, that indicates that the `got` value shouldn’t be used—it’s invalid, because\
    \ there was an error while trying to produce it.\n\nIf we successfully made it\
    \ through that check without failing, then we know the `got` value is at least\
    \ *valid*, even if not necessarily *correct*—and we’ll check for that now, in\
    \ the same way as for previous tests:\n\n```\n\n```\n\nAnd that’s all we need\
    \ to do. Here’s the complete body of `TestDivide`:\n\n```\n\n```\n\n([Listing\
    \ 6.1](https://github.com/bitfield/ftl-code/blob/main/6.1/calculator_test.go))\n\
    \nIf we run `go test` now, assuming there are no typos, we should expect to see\
    \ a compile error because `calculator.Divide` isn’t defined yet, and so we do:\n\
    \n```\n./calculator_test.go:80:15: undefined: calculator.Divide\n```\n\nWe’ll\
    \ see how to write `Divide` itself in the next chapter.\n\n## Takeaways\n\n* \
    \  When writing several similar tests, don’t be afraid to copy and paste an existing\
    \ test and modify it to do what you want (just don’t forget to check that you\
    \ made all the necessary changes).\n\n*   The initial result of writing a test\
    \ should be a compiler error like `undefined: calculator.Multiply` (because we\
    \ haven’t written that function yet).\n\n*   The next step is to write a *null\
    \ implementation* of the function, that deliberately returns the wrong result,\
    \ so that we can check that the test detects this situation.\n\n*   Once we’ve\
    \ verified the test is working correctly, we can go ahead and write the real implementation\
    \ of the function, and when the test passes, we can be confident that we’ve got\
    \ it right.\n\n*   When we want to test some behaviour several times against different\
    \ inputs, we can use a slice of *test cases* and loop over them, testing each\
    \ one.\n\n*   A `for ... range` loop will execute some bit of code once for each\
    \ element in the slice.\n\n*   There’s no value in just testing lots of similar\
    \ cases: to increase our confidence in the correctness of the function, we should\
    \ try as many *different* kinds of cases as we can think of: zero, negative, empty,\
    \ backwards, forwards, sideways.\n\n*   Go functions can return more than one\
    \ result, and often do: the most common pattern is *something and error*, with\
    \ the error value indicating whether or not the whole operation succeeded.\n\n\
    *   If the input to a function can be *invalid*, then an important behaviour of\
    \ the function is to return a non-`nil` error when this happens: write a separate\
    \ ”invalid input” test for this.\n\n*   And in general, use the “one behaviour,\
    \ one test” rule (rather than, say, “one function, one test”, which can lead to\
    \ some very complicated tests).\n\n*   For “something and error” functions, the\
    \ “error” test only needs to check the error value and make sure it’s *not* `nil`:\
    \ the data value can be ignored, because it’s invalid.\n\n# 3\\. Errors and expectations\n\
    \n![](media/file3.png)\n\nSo how do we actually write the `Divide` function in\
    \ order to pass the test we wrote in the previous chapter? Let’s start by copying,\
    \ pasting, and modifying one of our existing arithmetic functions, such as `Multiply`.\n\
    \n## Returning an error value\n\nWe might produce something like this as a first\
    \ draft:\n\n```\n\n```\n\nIt looks reasonable, so let’s try to run the tests and\
    \ see what we get.\n\n```\n./calculator_test.go:80:12: assignment mismatch: 2\
    \ variables\nbut calculator.Divide returns 1 values\n```\n\nApparently we’re not\
    \ quite there yet. What is this compiler error telling us? Let’s first of all\
    \ look at the relevant file (`calculator_test.go`) and line (80):\n\n```\n\n```\n\
    \nThe words “assignment mismatch” tell us that the assignment statement here isn’t\
    \ valid because the two sides don’t match in some way. We need the same number\
    \ of variables on the left hand side of the `:=` as there are values to match\
    \ them on the right. And the compiler is telling us we have “2 variables” on the\
    \ left, which is perfectly correct, but the `Divide` function “returns 1 values”.\
    \ This can’t be right, because we need 2 values, one for each variable.\n\nWhy\
    \ does the compiler think that `Divide` returns one result value? Because that’s\
    \ what the function signature says:\n\n```\n\n```\n\nBut we’ve said we now want\
    \ to return *two* results, of type `float64` and `error` respectively. Let’s make\
    \ that change:\n\n```\n\n```\n\nNotice that now we have to put parentheses around\
    \ the list of results: `(float64, error)`. When we had only one result, we could\
    \ omit those parentheses, but now they’re required.\n\nDoes this fix the problem?\
    \ Well, only partially:\n\n```\n./calculator.go:30:2: not enough arguments to\
    \ return\n        have (float64)\n        want (float64, error)\n```\n\nThe error\
    \ messages from the Go compiler can be a bit intimidating when you’re not used\
    \ to them, but they’re extremely accurate and comprehensive. They have all the\
    \ information necessary to fix the problem, if only we can understand them.\n\n\
    Let’s break this error message down. First of all, it’s saying the problem is\
    \ in the `calculator.go` file at line 30. Here it is:\n\n```\n\n```\n\nAnd the\
    \ problem is “not enough arguments to return”. In other words, it was expecting\
    \ more values following the `return` keyword than it actually got. To be even\
    \ more specific:\n\n```\nhave (float64)\nwant (float64, error)\n```\n\nSo we *have*\
    \ `float64`; that’s the value of `a / b`, which since both `a` and `b` are `float64`,\
    \ must itself be `float64`. But we *want* `float64, error`. In other words, the\
    \ function signature promised to return two results, `float64` and `error`, and\
    \ currently it’s only *returning* the `float64` value."
