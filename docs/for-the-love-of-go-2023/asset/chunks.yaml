- raw: "The name of the test also needed to change, because the required behaviour\
    \ now isn’t “prints to terminal”, but “prints to writer”. And this is a reassuringly\
    \ Go-like API: rather than limiting ourselves to some concrete type, we take an\
    \ interface (`io.Writer`) to make our code more flexible and widely useful. This\
    \ change is worth making in any case, but it’s interesting that it was more or\
    \ less forced on us just by trying to *test* the function.\n\nAnd we should expect\
    \ to change our minds like this many times during the process of building a package,\
    \ as we work through the TDD process. It’s not a sign that we did anything wrong:\
    \ in fact, we did everything *right*. We proceeded step by step from our analysis\
    \ of the required behaviour, and evolved our API design by *using* it to do something\
    \ specific, rather than reasoning about it in the abstract.\n\nSo now we have\
    \ something that we can actually test: we can look at `fakeTerminal` afterwards\
    \ to see if it contains the expected message. We define a variable `want` with\
    \ that message, read the contents of the buffer into a variable called `got`,\
    \ and then compare the two.\n\n## The end of the beginning\n\nIt’s worth reflecting\
    \ on what’s happened during this test-writing process, because we’ve done quite\
    \ a bit of useful design work:\n\n*   We’ve decided the name of the engine package\n\
    \n*   We’ve decided the name of the entrypoint function\n\n*   We’ve written down\
    \ its desired behaviour in words\n\n*   We’ve *injected* an `io.Writer` to make\
    \ the package testable, and to prevent unwanted terminal output\n\nAll this before\
    \ we’ve written a single line of system code, and in fact, that makes perfect\
    \ sense, because if we’d started writing code, we would have ended up having to\
    \ change it anyway when we came to the test. We would have named the function\
    \ `Hello`, which makes sense *inside* the package, but not outside. We would have\
    \ probably printed directly to the terminal using `fmt.Println`, which seems sensible\
    \ until you come to try to test it.\n\nThis is the secret power of test-driven\
    \ development: by writing the test first, as though the function already existed,\
    \ we can solve a number of design problems in advance, and we also avoid the trap\
    \ of writing an untestable function.\n\nWe also get a test at the end of it, of\
    \ course, which is great, and we should never underestimate the value of having\
    \ tests (try working on a non-trivial codebase without them). While most people\
    \ agree that tests are desirable, if they’re not written *first*, then they often\
    \ don’t get written at all. It’s very hard to add tests afterwards. It may even\
    \ be impossible without significant refactoring, and who wants to refactor code\
    \ without the safety net of tests?\n\n## Takeaways\n\n*   When we’re trying to\
    \ learn a new way of doing things, it’s best to start from a place where we’re\
    \ already comfortable.\n\n*   Packages are a force multiplier, so we should always\
    \ seek to write a package that can be used in many different programs, not just\
    \ one.\n\n*   A good way to write better code is to adopt the mindset that we’re\
    \ writing programs for millions of users, rather than simply for ourselves.\n\n\
    *   Since no one can import, or test, your `main` package, it follows that all\
    \ non-trivial behaviour should be implemented in a importable package instead.\n\
    \n*   A Go program may contain many packages, but there’s usually one central\
    \ *engine* package that provides the main behaviour users care about.\n\n*   The\
    \ best way to design a good package API is, slightly counter-intuitively, to start\
    \ by *using* it—in a test, for example.\n\n*   The important thing to test is\
    \ *behaviour*, not functions, and this is especially relevant to command-line\
    \ tools.\n\n*   The names of test functions can contain useful information, if\
    \ you choose to put it there.\n\n*   Parallel tests are not only faster, but help\
    \ to flush out potential concurrency bugs, even when the package doesn’t use concurrency\
    \ itself.\n\n*   Functions that print output should take an `io.Writer` to print\
    \ to, so that we can avoid noise when running tests, and also capture the output\
    \ to check it.\n\n*   Tests are fundamentally about comparing `want` and `got`,\
    \ whatever that means for the specific situation, so writing them this way helps\
    \ people understand what your tests are looking for.\n\n*   Designing a package\
    \ test-first seems hard at the beginning, or even a waste of time, but it gets\
    \ us to a good design faster by eliminating a lot of rework.\n\n*   It’s also\
    \ nice to *have* tests.\n\n## Going further\n\nIf you’re impatient to read more,\
    \ by all means go on to the next chapter. But if you’d like to explore some of\
    \ these ideas further, I have some suggestions for mini-projects that will give\
    \ you a chance to practice applying TDD principles in Go.\n\n1.  If you’ve previously\
    \ written a Go program where everything was in `package main`, try updating that\
    \ program to use an engine package instead.\n\n    Write tests for each of the\
    \ important behaviours your program has, and try to organise the package code\
    \ so that your `func main` is reduced to the absolute minimum.\n\n2.  Instead\
    \ of a program that simply prints “Hello, world”, try writing a program that asks\
    \ the user for their name, then prints “Hello, \\[NAME\\]”.\n\n    What would\
    \ its package API look like? How would you test it? What would its `main` function\
    \ look like?\n\n3.  Try writing a program that prints the current time in the\
    \ following format: `\"It's X minutes past Y\"`.\n\n    Supposing you have some\
    \ function that does this, how can you test it when you don’t know in advance\
    \ exactly what time will be printed?\n\n    Your tests should produce no output\
    \ when they pass (so they mustn’t print the time to the user’s terminal when they\
    \ run `go test`, for example)."
