    Like most Zen sayings, this sounds (and is) absurd, but aims to lead us to something
    meaningful. If we usually only discover that the API is wrong when we come to
    call it, let’s *start by calling it*, and save one entire wasted design cycle.
    We will write calling code that is sensible, readable, and useful, and only then
    proceed to implement everything necessary to make it work.


    Let’s imagine that the `engine` package already exists, then, and start using
    it. For example, let’s try to write a test. What should we write?


    ## The first test


    A great principle to keep in mind with TDD is:


    > *Test behaviour, not functions.*


    Since we don’t actually *have* any functions yet, this is more or less forced
    on us anyway. What do we mean by “behaviour” here? Simply, what the program does
    in a given situation.


    In testing, we’re interested only in behaviours we can observe from the outside.
    There may be all sorts of important things happening inside the package that we’re
    not aware of, but when we speak of behaviour in this context, we’re referring
    to things that *users* of the package would see.


    What behaviour does the final program need to have? It needs to print out “Hello,
    world” on the terminal. Fine. Let’s try to write a test for this behaviour.


    **GOAL:** Write a test for the “Hello, world” printing program. This might be
    harder than it first appears.


    Where should we put this test? Well, it needs to be in a file whose name ends
    with `_test.go`, and it will be testing a package whose name we might start by
    guessing will be `hello`. So let’s call the file `hello_test.go` and start there.


    Here’s a first attempt:


    ```


    ```


    Let’s break this down, line by line. Since every Go file starts with a `package`
    clause, and the logic of what we’re doing suggests `hello_test` would be a good
    name.


    We need to import the standard library `testing` package for tests, and we will
    also need our engine package `hello`.


    The test itself has a name, which can convey useful information if we choose it
    wisely. It’s a good idea to name each test function after the behaviour it tests.
    You don’t need to use words like `Should`, or `Must`; these are implicit. Just
    say what the function *does* when it’s working correctly.


    As you probably know, every Go test function takes a single parameter, conventionally
    named `t`, which is a pointer to a `testing.T` struct. This `t` value contains
    the state of the test during its execution, and we use its methods to control
    the outcome of the test (for example, calling `t.Error` to fail the test).


    If you’re not familiar with tests in Go, I recommend you read [For the Love of
    Go](https://bitfieldconsulting.com/books/love), which will give you the background
    you’ll need to make use of what follows.


    ## Parallel tests


    The first line of any test should be:


    ```


    ```


    This signals that the test may be run concurrently with other tests, which is
    a good idea. Since we almost certainly have multiple CPUs available, it will be
    quicker to run multiple tests at once.


    And there’s another advantage to writing parallel tests. Even though our package
    may not itself use concurrency, it’s entirely possible that *users* will want
    to call it concurrently. It’s easy to overlook some race condition or global shared
    state when writing a package, so parallel tests are a way of battle-testing our
    code to make sure it’s concurrency-safe.


    If we do accidentally mutate some shared state somewhere, running all our tests
    in parallel gives us a good chance of catching this problem, especially if we
    run the tests with `go test -race` to enable the race detector.


    > *Code in a package should always be safe to call concurrently. Parallel tests
    help ensure that.*


    Occasionally there’s a good reason why some test can’t be run in parallel with
    others, but not often. In such cases, you can omit the call to `t.Parallel()`,
    and the test will be run on its own.


    ## The first hard problem: naming things


    In order to write this test, we needed to call the function, and in order to do
    that, we needed to decide its name. That, as I’m sure you already know, can often
    be tricky.


    We know that the function will be in the `hello` package. What name would make
    sense? We might intuitively want to call it `Hello`, but since we’re calling it
    from outside the package, we’ll refer to it as `hello.Hello`, which is a stutter.
    Since the package name `hello` already tells us it’s about saying hello, we don’t
    need to repeat that word in the function name.


    Since its job will be to print a message, perhaps `Print` would work. Complete
    with its package prefix, this will be referred to as `hello.Print`, which doesn’t
    seem unreasonable. We’ll see how it goes.


    We can also ask at this point whether the `Print` function needs to take any parameters.
    Well, nothing springs to mind, so let’s proceed to the next question: should it
    return any results?


    Again, there doesn’t seem to be anything obvious for the function to return, so
    let’s assume it doesn’t. So, assuming we’ve called the function successfully,
    we can ask: under what circumstances should the test fail?


    ## Tests that pass silently, but fail loudly


    But here we run into a problem: there don’t appear to *be* any! The behaviour
    we want is that the function prints a message to the terminal, but how can a *test*
    verify that? It can’t. We don’t have access to the user’s terminal from within
    the Go program.


    There’s another problem: running `go test` shouldn’t cause anything to be printed
    out, unless there’s a test failure. It’s a good general design principle for command-line
    tools that they should not be too chatty in operation, and this is certainly the
    way that `go test` works. This is sometimes called “the rule of silence”:


    > *When a program has nothing surprising, interesting or useful to say, it should
