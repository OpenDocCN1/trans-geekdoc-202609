    \nSince `b` is now a pointer (specifically, a `*Book`), how does this work? Well,\
    \ Go knows that pointers don’t have fields, only structs do. So if you write something\
    \ like `b.PriceCents` that looks like a struct field, Go is smart enough to assume\
    \ you meant “dereference `b` to get the struct it points to, then modify its `PriceCents`\
    \ field”.\n\nThis is called *automatic dereferencing*, and since most methods\
