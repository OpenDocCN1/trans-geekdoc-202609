    **目标：** 创建新模块 `creditcard` 并为创建 `card` 类型的构造函数 `New` 编写测试。该类型有一个不为空的字符串字段 `number`。使测试通过。


    对于任何验证函数，我们需要编写至少两个测试：一个针对有效输入，另一个针对无效输入。这是我对“有效输入”测试的尝试：


