    ## 核心要点


    - 尽管编译器会对对结构体字段的赋值强制执行类型检查，但并没有内置方法来*验证*我们赋值给它们的内容。

    - 因此，如果我们想防止用户意外分配一个无效值（例如，负价格），我们需要提供一些*访问器*（accessor）方法，以便在赋值之前可以检查该值。

    - 这必须是一个指针方法，因为如果没有指针，任何分配给结构体字段的内容都无法持久化：它只是修改了结构体自身的本地副本，而该副本在方法返回时就会被丢弃。

    - 验证性访问器方法有两种行为需要测试： “有效输入”行为和“无效输入”行为。

    - 即使有了验证性访问器方法，它实际上并不能阻止用户在导出的结构体字段上设置他们喜欢的任何值，从而完全绕过该方法。

    - 因此，如果我们想确保结构体的某些字段*始终有效*，我们需要将这些字段设为*未导出*（unexported），并且仅通过访问器方法可用：在这种情况下，我们需要提供一个*获取*值的方法，以及一个设置值的方法。

    - 然而，`cmp.Equal` 无法查看未导出的字段（包外的其他人也无法），因此我们可以传递选项 `cmpopts.IgnoreUnexported` 告诉它甚至不要尝试。

    - 就像你可以通过未导出字段名来创建始终有效的字段一样，你也可以通过未导出结构体本身来创建*始终有效的结构体*。

    - 这意味着需要某种*构造*函数，因为用户无法创建结构体的字面量（他们需要使用它的名称，但他们是不被允许的）。

    - 构造函数返回带有未导出名称的类型是可以的（事实上，这对于始终有效的结构体是至关重要的）：用户无法引用的是*名称*，而不是*值*。

    - 当你想将值限制在允许的集合中时，`bool` 映射是一个很好的方法，因为你可以编写类似 `if validCategory[category]` 这样的代码，映射查找本身就能给你正确答案，而无需额外代码。

    - 另一种防止用户错误的好方法是使用 `const` 关键字来定义一些用户可以引用的具名*常量*：如果他们拼写错了名称，或者引用了不存在的名称，编译器会捕获到。

