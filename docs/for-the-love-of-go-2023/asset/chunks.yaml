    \ in the test that makes it pass by accident. As we’ve seen, tests in Go pass\
    \ by default if we don’t do anything to make them fail.\n\nWhat could be wrong\
    \ with the test? Well we could have the wrong `want` value. Suppose by some unlucky\
    \ chance a buggy `Multiply` function returned the exact wrong value we placed\
