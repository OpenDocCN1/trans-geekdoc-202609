    If you think about the decimal representation of a fraction like one-third, it’s
    `0.33333333...`, but it never stops. It’s threes all the way down. Representing
    a number like this in a fixed number of bits (or even on a finite-sized piece
    of paper) is bound to involve some loss of precision.


