    或 `continue` 关键字会发生什么呢？


    嗯，`break` 本身只会跳出*当前*循环；也就是说，就是我们正处于内部的那个循环。它对任何外层循环都没有影响。同样，`continue` 会继续当前循环。那么，如果我们想从*内层*循环内部跳出*两个*循环，该怎么办？


    答案是我们可以使用*标签*（label）。Go 中的标签仅仅是为代码中的特定位置命名，以便我们以后引用它。标签的语法就是标签名称后跟一个冒号。例如：


