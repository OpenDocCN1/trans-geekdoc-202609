    ```


    ```


    我们还可以关于客户存储更多信息，但这些足够让我们开始了。


    回想一下，在本书的早期，你曾在 `calculator` 包的测试中使用过 `testCase` 结构体类型，来定义每个用例的输入和预期结果。结构体是创建一个包含多个部分数据的单值的一种非常方便的方法。


    # 类型定义 (Type definitions)


    我们从注释开始，由 `//` 字符引入。为你在 Go 中创建的每个类型添加一个解释性注释是一个良好的习惯，告诉读者该类型意图实现什么。这些被称为*文档注释*（documentation
    comments），因为当你将项目发布到如 GitHub 等托管网站时，你的注释将自动转换为 [pkg.go.dev](https://pkg.go.dev/)
    网站上的可浏览文档。你可以在这里看到示例：


    [`pkg.go.dev/github.com/bitfield/script`](https://pkg.go.dev/github.com/bitfield/script)


    接下来，我们可以看到一个新的关键字：`type`。它引入了一个新的*类型定义*。后面跟着我们要给该类型起的名字（`Customer`）。这有点像 `var`
    关键字声明变量。通过 `type` 关键字，我们在说“创建一个创建一个名为……的类型……”


    在这种情况下，细节是关键字 `struct`（它引入一个结构体类型）以及大括号 `{ ... }` 内的字段列表。`type Customer ...` 之后的所有内容被称为*类型字面量*（type
    literal）。我们之前见过像字符串字面量这样的值；而这里我们有一个类型字面量。


    # 导出标识符 (Exported identifiers)


    你可能想过为什么类型名是 `Customer`（大写字母 C），而不是简单的 `customer`。事实证明，首字母大写的名称在 Go 中具有特殊含义。任何具有此类名称的内容在定义它的包之外都是可用的（我们称之为*导出*，exported）。如果你定义的类型（或函数、变量或任何其他）名称以小写字母开头（例如
    `customer`），它就是*未导出的*（unexported），因此你无法在该包之外的代码中引用它（例如在测试中）。


    你可以将首字母大写的导出名称视为包意图向外*公开*的事物，而首字母小写的未导出名称则是包将在内部使用的*私有*事物，其他人不需要知道它们。


    # 核心包 (The core package)


    如你所知，*包*（package）是 Go 组织相关代码块的方式。对于大多数项目，会有某种*核心*（core）包，来实现与我们正在解决的问题最基础的功能。对于我们的商店来说，那是什么？我们应该如何命名？


    单单词是最好的，理想情况下是一个短单词，并且是完全描述软件用途的单词。让我们的核心包命名为 `bookstore`。


    # 第一个测试


    正如你回想起我们之前对 `calculator` 包的工作，我们首先需要决定我们想要的*行为*，然后编写一个精确指定该行为的*测试*。


    只有当我们对测试满意，并且在*知道*系统是错误的时看到它失败，我们才应该编写*实现*该行为的代码。


    那么，对于我们的商店应用程序，应该尝试描述和测试的第一个行为是什么？我们知道在 `bookstore` 包中需要一个核心 `Book` 类型，在其他任何事情之前设置它可能是一个好主意，但如果我们还没有被允许编写任何非测试代码，我们如何创建它呢？我们要表达为测试的行为是什么？让我们为
    `bookstore` 创建一个文件夹（如果还没有的话），并运行 `go mod init bookstore`。创建一个名为 `bookstore_test.go`
    的文件，并从通常的测试序言开始：


