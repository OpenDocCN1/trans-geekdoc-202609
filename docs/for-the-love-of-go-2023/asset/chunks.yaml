    ## Takeaways


    *   Go has various *data types* for dealing with different kinds of information:
    `string` holds text, `int` holds integer numbers, `float64` holds fractional numbers,
    and `bool` holds Boolean (true or false) values.


    *   The Go compiler checks that a variable or parameter of a given type is only
    ever assigned values of that type: if it detects a mismatch, that’s a compile
    error.


    *   The `var` keyword introduces a variable, and specifies its type, so that we
    can use it later on in the program.


    *   A *literal* is a value of some type that we specify directly in our Go code,
    such as the string literal `"For the Love of Go"`.


    *   Variables in Go have a *default* value before we assign something to them
    explicitly: it’s whatever the *zero* value is for its type, such as `""` for strings,
    0 for numbers, or `false` for `bool`.


    *   We often declare and assign values to variables in a single statement, using
    the *short declaration form*, for example `x := y`.


    *   When you want to group related values together into a single variable, you
    can define a *struct type* to represent them.


    *   The different *fields* of the struct are just like any other kind of Go variable,
    and they can be of any Go type, including other structs.


    *   Type definitions are introduced by the keyword `type`, and struct types with
    the additional keyword `struct`, followed by a list of fields with their types.


    *   Identifiers (that is, the names of functions, variables, or fields) with an
    initial capital letter are *exported*: that is, they’re public and can be accessed
    from outside the package where they’re defined.


    *   On the other hand, identifiers beginning with a lowercase letter are *unexported*:
    they’re private to the package.


    *   Most Go packages are “about” one or more core struct types, in some sense:
    they’re often the first things that you’ll define and test.


    *   A neat way to design a struct type guided by tests is to write a *compile-only
    test*, that simply creates a literal value of the struct: this test can’t pass
    (or, indeed, compile) until you’ve correctly defined the struct type.


    # 5\. Story time


    ![](media/file5.png)


    You’ve made a great start on the Happy Fun Books project, by setting up your basic
    package structure and core `Book` type. When we get to a point like this in a
    software project, it’s not always easy to know what to do next, or even more importantly,
    what to do *first*.


    ## User stories


    A great way to approach this is to think about it from the point of view of *users*
    of our software. Even if this is only a fun project for recreation or learning,
    and we don’t anticipate having any *real* users other than ourselves, we can use
    it as a thinking tool, and imagine what users would want to do with the software
    and how they’d like to interact with it.


    An online bookstore, for example, will need to have certain features in order
    to be usable for its customers. People will need to see what books are available,
    see the details of any given book, and perhaps search for a book they’re interested
    in. No doubt you can think of many more such interactions.


    We sometimes call these *user stories*, because each of them tells a little story
    about a user and something they want to do. Sometimes people talk about *features*
    instead, but this doesn’t necessarily make clear that all the work we do on the
    program should be aimed at interactions with users in some way. And there are
    lots of features a program could have that are in fact of no interest or value
    to users. (That doesn’t always stop software vendors from adding them, though.).
    As developers, starting with a user story helps keep our minds firmly focused
    on the user’s perspective.


    ## What are the core stories?


    Now, there are lots of possible user stories for an online bookstore. Here’s one:
    “As a customer, I want to see a sample preview of the book in my browser so that
    I can figure out if I’d like to read it.” Or “As a bookstore owner, I want to
    see my total revenue for the month, so that I’ll know if I can afford to take
    my family out for pizza yet.” I’m sure you can think of dozens more.


    So we don’t start by listing all possible user stories we *could* implement. That
    would be a very long list, and we’d have no idea what is the most important story,
    or which one we should implement first.


    Instead, it’s a good idea to ask what user stories we couldn’t possibly *leave
    out*. In other words, for the bookstore to be usable at all, there are a few non-negotiable
    things users need to be able to do. Here are three I can think of:


    1.  Buy a book


    2.  List all available books


    3.  See details of a book


    Identifying these *core stories* is a very helpful way to think about any product.
    Assuming that it costs us money (or at least time) to develop, and it can’t start
    *making* us money until it’s viable, it makes sense to focus on developing only
    the critical stories first: the ones without which we wouldn’t even really *have*
    a product, at least not one that users would want.


    ## The first story


    Let’s start with the “buy a book” core story, and plan how to implement it. As
    you’ll recall from our work on the `calculator` package, I find it very useful
    to think in terms of *behaviours*, rather than, for example, functions. Again,
    this keeps our minds focused on users and what they want, instead of what kind
    of program architecture seems logical to a software engineer.


    What’s the behaviour we’ll need for the “buy a book” story? Let’s simplify it
    by not worrying about payments for the time being, and just look at it from the
    point of view of stock control. When a user buys a book, that will necessarily
    decrease the number of copies available.'
