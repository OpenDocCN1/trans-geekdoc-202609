    look up details on a specific book by ID.


    A successful bookstore, though, will have lots of books, and it could take a long
    time to loop through the whole list comparing IDs one by one. Can’t we do better?


    What we want is a data structure that, given a book ID, returns the corresponding
    book directly, without needing to loop. This would be a direct `mapping` from
    IDs to books.


    ## Introducing the map


