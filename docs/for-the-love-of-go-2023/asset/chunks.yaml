    Great work on your project at Happy Fun Books! You have some experience now of
    writing useful Go programs, so let’s take a little time to explore the Go language
    itself in more detail. This will help you gain a deeper understanding of the code
    you’ve already written, and how it works.


    In the next few chapters, we’ll explore some features of Go syntax that let you
    define the *control flow* of your programs: that is to say, how they are *executed*.
    Some of these features will already be familiar, but you’ll learn more about them.
    Others will be new, and you might like to try incorporating them into your existing
    programs.


    So what is control flow? You can imagine a very simple program where “control”
    just “flows” from the first line of the program, in sequence, to the last. Some
    programs work exactly this way, but most have a more complicated control flow.
    Maybe instead of a simple sequence, they *repeat* a sequence multiple times, or
    perhaps execute different sequences depending on some condition.


    Before we get on to more complicated types of control flow in Go, let’s start
    with the basics.


    ## Statements


    The most basic element of control flow in a Go program is the *statement*. A statement
    is simply an instruction to Go to do something. Here’s an example:


    ```


    ```


    Thanks to your sterling work on the bookstore project, we have available a struct
    type called `Book`, to represent a book, and it has a string field called `Title`
    that stores the title of the book.


    ## Declarations


    The example above is an *assignment* statement: it assigns a literal value of
    the `Book` struct to a variable named `b`, which must already exist. How does
    a variable like `b` come into existence? By means of a *declaration*. For example:


    ```


    ```


    This introduces a new variable `b` that can hold `Book` values. A declaration
    doesn’t actually make anything happen when your program runs: instead, it asks
    the Go compiler “please reserve some space for a variable of a certain type that
    I’m going to do something with later”.


    A declaration isn’t technically a statement, because it doesn’t produce any effect
    at run time. It’s worth knowing that in Go, almost all our code must be inside
    some function, and no statements are allowed outside functions (at *package level*).
    The only kind of code allowed outside a function is a declaration, and that can
    be useful, as we’ll see later on in this book.


    ## What is assignment?


    Assignment statements *assign* some value to a variable, as we’ve seen, but what
    does that mean in practice? You could think of it as giving a *name* to the value.
    For example, the `Book` value in our earlier example can, following the assignment
    statement, be referred to using the name `b`. Any time we use the name `b` in
    an expression from now on, it will be “translated” into the literal `Book` value
    that we assigned to `b`.


    Another way of thinking about variables is as little boxes, that contain values
    of a certain type. Assignment is the act of putting a value into the box. If there
    was anything in the box beforehand, it gets replaced by the value we assign. What
    happens if you declare a variable and then assign two different values to it in
    succession?


    ```


    ```


    This is perfectly all right, and following these two assignments, the `name` variable
    has the value `"Jo"`; this second value has “overwritten” the first. You can assign
    to a variable as many times as you like, and it will always have the most recent
    value you assigned to it.


