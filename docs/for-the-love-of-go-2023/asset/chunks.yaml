    cases—each representing a pair of inputs, together with the expected output—and
    then loop over them, calling `Add` with the inputs and checking the output against
    that. If any test case fails, the whole test fails. These are sometimes called
    table tests, because they represent the test data as a table of inputs together
    with their results.


    Let’s see what that might look. First, it will be convenient to define a `struct`
    type to represent the test case. `struct` is Go’s name for a structured data type:
    that is, something that contains multiple bits of information, united into a single
    record.


    Don’t worry if this isnt familiar; we will cover this topic later. What’re really
    concerned with here is the test logic, and this is just a way of setting up our
    test cases so that we can get to that. Let’s do this inside the `TestAdd` function,
    since the test case will usually be specific to the function:


    ```go

    // Listing 5.1 ft-code/main/5.1/calculator_test.go

    ```


    # A slice of test cases


    If you already have some experience of Go, you may be familiar with the notion
    of a slice: it’s just Go’s name for a bunch of things. In some languages this
    is called an array, but it’s the same idea whatever we call it: a sequence of
    values of the same type.


    Again, we’ll talk more about slices and other data types later in this book. But
    for now, needn’t worry about the details; we’re just going to use a slice to represent
    a bunch of test cases. Rather than write lots of very tests that only differ in
    their inputs, we would like to write just one test that tests many cases. For
    each case, we’ll do what we did before: call the `Add` function with the inputs
    `a` and `b`, and check its result against `want`.


    So having defined the data type that we’re going to use for our test cases (`testCase`),
    let’s actually provide some data of this kind. To do this, we’ll create a variable
    `testCases`, and assign some values to it.


    ```go

    // Listing 5.1 ft-code/main/5.1/calculator_test.go

    ```


    Here, we’re creating a variable called `testCases`, whose value is a slice of
    `testCase` structs containing elements. Each element of this slice, then, is an
    instance of the `testCase` struct we defined earlier. It has the fields `a`, `b`,
    and `want`, representing the inputs and expected outputs of the test case.


    Next, we need to test the result of `Add` for each of our cases. That involves
    repeating a section of code multiple times, each time using a different test case.


    # Looping over test cases


    Now that we have the test cases, we can write the code to loop over them. We’ll
    be using the `range` operator to do this (again, don’t worry if this is unfamiliar
    now: we’ll come back to it later). We’re still inside the `TestAdd` function,
    and having previously declared our `testCases` slice, we can now proceed to use
    it in a `for` statement, introducing a loop:


    ```go

    // Listing 5.1 ft-code/main/5.1/calculator_test.go

    ```


    Inside the loop, `tc` will be the current `testCase` struct, so `tc.a` and `tc.b`
    will be the inputs to `Add`, and `tc.want` will be the expected result. Run this
    test and make sure it still passes—it should, shouldn’t it?


    **GOAL:** Rewrite `TestSubtract` and `TestMultiply` in the same way, to test multiple
    cases for each function. Try to think of interesting and varied test cases: for
    example, negative numbers, zeroes, fractional numbers. We’re not only testing
    the relevant functions, we’re also documenting their behaviour for anyone who
    reads or uses the program.


    Make sure that when the test fails, the failure message shows exactly which test
    case didn’t work. When you’re happy with the expanded tests, move on to the next
    section.


    If you get stuck, have a look at one possible solution in Listing 5.1.


    # A different kind of problem: division


    The board reviewed the calculator project yesterday, and they’re really pleased
    with your progress. The only remaining major feature to be completed is division,
    and that needs a little more thought than the others.


    Why? Because it’s possible to write division expressions that have undefined results.
    For example:


    ```

    6 / 0

    ```


    This looks reasonable at first sight, but what we’re really asking here is “What
    number, multiplied by zero, gives 6?” And there is no such number, is there? What
    should the calculator do in this case?


    # Error values in Go


    There are several options: it could give the answer `0`, which seems unsatisfying,
    or it could give an answer that represents infinity (perhaps the symbol ∞), or
    it could define some symbol that means not a number (the abbreviation `NaN` is
    sometimes used for this).


    But these are awkward attempts to work around a fundamental issue: dividing by
    zero is not allowed in the ordinary rules of arithmetic. So there’s something
    about the `Divide` function that wasn’t true of `Add`, `Subtract`, and `Multiply`:
    it’s possible to give it invalid input.


    A neat thing about functions in Go is that they’re not limited to returning a
    single value: they can return multiple values (and often do). Could this be a
    solution to the `Divide` problem?


    It sounds like `Divide` should return two values. One will be the result of the
    calculation, as with the other functions, but the other can be an error indicator.
    If something went wrong, like attempting to divide by zero, the error value can
    convey that information back to the code that called `Divide`.


    Go has a special type just for this, called `error`. It’s very common for Go functions
    to return two values, with the first being the result of the computation (the
    data value) and the second being an `error` value. I call this pattern “something
    and error”, where the error value indicates whether or not the data value is valid.


    # Test behaviours, not functions


    How could we test such a function? We could certainly test a set of valid inputs
    to `Divide`, in the same way that we did for `Add`, `Subtract`, and `Multiply`.
    But what about invalid inputs, and what about that extra error result returned
    from the function?


    It’s tempting to try to extend our table test to check both the result and the
    error value at the same time. But that’s complicated, and we want tests to be
    simple.


    A useful way to think about this problem is to frame it in terms of behaviours,
    not functions. What does this mean, exactly?


    The behaviour of a program describes what it does in different circumstances.
    For example, the behaviour of the `Add` function is to add its two inputs together
    and return the result. This is straightforward, and we’ve already tested that
    kind of behaviour in a few different cases.


    The behaviour of the `Divide` function, given valid input, is to return the computed
    answer, and a `nil` error value, indicating that everything’s fine and there was
    no error.

