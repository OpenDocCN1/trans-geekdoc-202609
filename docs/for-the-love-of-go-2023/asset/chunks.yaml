    * A pointer gives *permission to modify* the thing it points to.

    * The `&` operator creates a pointer, so `&x` gives a pointer to `x`.

    * A function that takes a pointer must declare the appropriate type: `*int` for
    “pointer to int”, for example.

    * Just as types are distinct and non-interchangeable, so are pointers to those
    types: for example, `*int` and `*float64` are different types.

    * The only thing we’re allowed to do with a pointer value is *dereference* it
    using the `*` operator to get the value it points to, so `*p` gives the value
    of whatever `p` points to.

    * The default (zero) value of any pointer type is `nil`, meaning “doesn’t point
    to anything”.

    * Trying to dereference a pointer that happens to be `nil` will cause the program
    to *panic* and terminate with an error message.

    * Just as functions can take pointer parameters, so methods can take *pointer
    receivers*, and indeed they must do so if they want to modify the receiver.


    # 10. Very valid values


    ![](media/file10.png)


    Now that you know how to use pointer methods to modify the variables they’re called
    on, let’s see how to apply that to the valuable work you’re doing at Happy Fun
    Books.


    At the moment, if you want to modify some information about a book, you’d update
    the relevant field on the `Book` struct directly with a new value.


    But there’s a potential problem here: what if you make a mistake and assign some
    value that doesn’t make sense? For example, setting a negative `PriceCents` on
    a book, or a `DiscountPercent` that’s greater than 100, or less than zero.


    At the moment, we’ve no protection against that kind of problem: we don’t have
    any *validation* of the changes we make to books. Let’s think about how to solve
    this.


    ## Validating methods

