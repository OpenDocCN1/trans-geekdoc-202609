- raw: 'Now, this book is for Go programmers with a little experience, so I’ll assume
    you’re already capable of writing a “Hello, world” program in Go, compiling it,
    running it, and so on. (If not, I recommend you first read [For the Love of Go](https://bitfieldconsulting.com/books/love),
    by the same author.)


    Assuming at least a little experience with the Go language, then, this book will
    focus on what to *do* with it. In other words, how do we build reliable, usable,
    well-engineered software with Go?


    This will involve some ideas, techniques, and processes that may be new to you.
    It makes sense that when you’re trying to learn something new, you should start
    from something that you already understand pretty well, such as a “Hello, World”
    program.


    So let’s start with a straightforward and (hopefully) familiar “Hello, world”
    program in Go, and develop it from there.


    ## Hello, world


    ```


    ```


    ([Listing 1.1](https://github.com/bitfield/tpg-tools/blob/main/1.1/main.go))


    Everything in Listing 1.1 should be familiar to experienced Gophers. We declare
    the package `main`, which has a special meaning to the Go compiler: it instructs
    it to build an executable binary.


    We also declare the special *function* `main`, which will be the entry point to
    our binary. When the binary is run, `main` will be called automatically to start
    the program.


    What does `main` do? It calls the standard library function `fmt.Println`, which
    prints a string to the program’s standard output.


    The name of this source file doesn’t matter, since Go looks only at the `package`
    declaration; conventionally, though, code in package `main` is named `main.go`.


    Let’s run it:


    **`go run main.go`**


    ```

    Hello, world

    ```


    This is fine: the program compiles and runs, and prints the expected message.
    But can we do better? What’s wrong with this program, if anything?


    ## Write packages, not programs


    There’s nothing wrong with it, in fact: many programs are designed to be run directly
    from a command line, to do something, and then to exit. Such programs are often
    referred to as *tools*.


    Possibly one of the most significant inventions in computing, after the programming
    language itself, is the idea of an importable *package*: a re-usable unit of software
    that can be included in many different programs, usually to do some specific task.


    Without packages we would always have to instruct the computer about every detail
    of what we want to do. The packages in the Go standard library, indeed, would
    be very hard to manage without. Every time we wanted to write an HTTP server,
    for example, we’d have to implement the HTTP protocol ourselves, which is no mean
    feat.


    Go has excellent support for creating and using packages. Almost every Go project
    in existence is itself a package (or a library of related packages, like the standard
    library) that can be imported by other programs. This is a huge force multiplier
    for programmers: whatever you want to do, there’s probably some package already
    written that does pretty nearly what you want.


    In many cases, all we need to do to create a particular program is to figure out
    how to glue together the various packages that we need, and the job is done. We
    can then make *our* program a package, for use in turn by other programmers.


    It follows, then, that any non-trivial code in your program should not be in package
    `main`; it should be in some *importable* package. All you need to do then is
    import that package and call it from your `main` function. And because you import
    it, others can import it and use it in their own programs, which they couldn’t
    do if you had put it in package `main`.


    Another reason to avoid putting code in `main` is that it’s hard to test, for
    the same reason: you can’t import it. So let’s adopt this mindset from the start:


    > *Write packages, not programs.*


    Let’s try to turn our “Hello, world” program from Listing 1.1 into a package.
    What will that involve?


    ## Designing for a million users


    The first step in designing a good package is a shift in mindset. This is no longer
    a tool just for our own private use or amusement: it’s a public resource, an open-source
    asset that may be useful to thousands or even millions of other programmers.


    We are now writing a piece of software that may be run in production at huge scale,
    in critical applications like healthcare, public transportation, or finance. It
    may stay in use for years or even decades, and be updated many times for security,
    language improvements, performance, new features, or other reasons.


    People’s livelihoods, or even their lives, may well depend upon it, and even if
    that’s not true of our little “Hello, world” package, let’s proceed as though
    it were, and build accordingly. If we treat every package we write as though it
    will have a million users, we won’t go far wrong.


    So what do we need? We need tests, we need a well-designed API, and we need documentation.
    Let’s deal with testing first, for reasons that will become clear shortly.


    ## Testing


    Automated tests in Go can do anything you want, including nothing at all. What
    they usually do is import some package and call functions in it, comparing the
    results against some predetermined expectations.


    This already gives us some important information about testing command-line interface
    (CLI) tools such as the “Hello, world” example. We will not be able to run the
    command itself as part of the test (or, at least, while we technically can do
    this, it’s inconvenient and unnecessary).


    Instead, we need a package that we can import, and some function in it that we
    can call. Since we can’t import the `main` package, that implies we’ll need to
    create some other package.


    This isn’t a problem, because we already decided that we were going to turn our
    tool into a package. But since we need a `package main` in order to build a binary,
    how do we reconcile this with all the actual functionality being in some non-`main`
    package?


    The answer is: we import it. In fact, if we’re lucky, `main` will need to do almost
    nothing but import our package and call some entrypoint function in it. This is
    ideal, as then there’s no behaviour in `main` itself, so we don’t need to test
    it, which is just as well, because we can’t.


    ## The engine package


    The package that does all the work is what we may call an *engine* package. There
    are many parts to a car, but it’s the engine that makes it move. Similarly, a
    Go application or module may have many packages, but there should be one central
    engine package that contains the core functionality. This is what the whole package
    is about; it may contain other packages, but they exist only to service and support
    the engine package.


    There are some important decisions to make about the engine package: what should
    it be called? What functions and types should it have? Should it define some constants,
    and what should they be? Should it contain any global state?


    While we could make all these decisions just by sitting down and *thinking* about
    them, I’m going to suggest a different approach.


    We could argue all day about the design of the engine package, and many people
    are happy to do this, at least on company time. But even after a lot of discussion,
    we might still find that when we come to actually *use* the package, its API is
    not ideal. There may be important things missing. There may be things present
    that it turns out we don’t need. Things we do need may have names and APIs that
    make sense in isolation, but not when used in context. And so on.


    Instead, let’s use a kind of mental trick. There’s a Zen saying I’m fond of:


    > *If you want to climb a mountain, begin at the top.*'
