- raw: "It should also check that the category was actually updated (in case we made\
    \ a mistake like the one I made earlier in this chapter, by omitting to take a\
    \ pointer receiver). But there’s a problem: we’re saying that the `category` field\
    \ will be unexported, meaning that we can’t refer to it from outside the `bookstore`\
    \ package. How, then, can the test check its value?\n\nWell, we already decided\
    \ that we’ll need a `Category` method too, so that users can read as well as set\
    \ the category. And it turns out we need it ourselves, for the purpose of testing\
    \ the `SetCategory` method! This is actually very common when writing accessor\
    \ methods: you need to both set *and* get the value in a test. So let’s do just\
    \ that:\n\n```\n\n```\n\n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore_test.go))\n\
    \nDo we need a separate test for `Category`? Not really, though there’d be no\
    \ harm in writing one if you want to. If `SetCategory` doesn’t work for some reason,\
    \ then we’ll detect that by calling `Category`. On the other hand, if `Category`\
    \ doesn’t work, then we won’t see the category that we just set with `SetCategory`.\
    \ And if *neither* of them works, the test will still fail, because the book just\
    \ won’t have a category at all.\n\nSo a single pair of tests, for valid and invalid\
    \ inputs, exercises the behaviour of both `Category` and `SetCategory`. Great.\
    \ Let’s go ahead and write these methods now.\n\n**GOAL:** Implement `Category`\
    \ and `SetCategory` so that the tests pass.\n\nThis might be a little bit of a\
    \ challenge, but as usual, you have all the information you need, and if you get\
    \ stuck, you can review the material in this chapter so far and it will help you.\n\
    \nWe can start by adding the necessary field to our struct type:\n\n```\n\n```\n\
    \n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore.go))\n\
    \nNote that the field name `category` starts with a lowercase letter, making it\
    \ unexported. That’s the crucial bit of syntax we need to enforce the “always\
    \ valid field” idea. If you find adding this field causes your existing tests\
    \ to fail, see the “Unexported fields and `cmp.Equal`” section that follows this\
    \ one.\n\nThe implementation of `SetCategory` is pretty similar to the `SetPriceCents`\
    \ method you wrote earlier in this chapter:\n\n```\n\n```\n\n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore.go))\n\
    \nI’m sure you remembered to have `SetCategory` take a pointer receiver instead\
    \ of a value (and if not, the test will remind you, as will `staticcheck`).\n\n\
    The `Category` method is even simpler:\n\n```\n\n```\n\n([Listing 22.2](https://github.com/bitfield/ftl-code/blob/main/22.2/bookstore.go))\n\
    \nBecause `Category` isn’t supposed to *modify* the receiver, it doesn’t need\
    \ to take a pointer. (It wouldn’t do any harm if it did, but it’s just not necessary.)\n\
    \nAnd we’ve done what we set out to do: create an *always valid field*. No matter\
    \ what kind of `Book` value someone has, or what they do to it, its category can\
    \ never be set to something invalid.\n\nIf they try to call `SetCategory` with\
    \ invalid input, they’ll get an error: your test proves that. If they try to write\
    \ directly to the `category` field, their program won’t compile. Making it impossible\
    \ to compile incorrect programs is the best kind of validation!\n\n## Unexported\
    \ fields and `cmp.Equal`\n\nIf you’re adding each new test and method to your\
    \ `bookstore` project as you work through the book, you might have suddenly encountered\
    \ a rather alarming error when running tests after adding the `category` field.\
    \ Something like this:\n\n```\n--- FAIL: TestGetAllBooks (0.00s)\npanic: cannot\
    \ handle unexported field at\n    {[]bookstore.Book}[1].category: \"bookstore\"\
    .Book\nconsider using a custom Comparer; if you control the\nimplementation of\
    \ type, you can also consider using an\nExporter, AllowUnexported, or cmpopts.IgnoreUnexported\n\
    [recovered]\n```\n\nWhere did that come from? Well, recall that we used `cmp.Equal`\
    \ in some of our tests, to compare some `Book` struct values. But `cmp.Equal`\
    \ can’t compare structs with unexported fields, because (like anyone else outside\
    \ the `bookstore` package) it’s not allowed to refer to them. That’s why it says\
    \ “cannot handle unexported field”.\n\nSince it’s quite common in Go to define\
    \ types with unexported fields, and `cmp.Equal` is invaluable in tests, you’re\
    \ bound to run into this problem at some point, so let’s see how to solve it.\n\
    \nIn fact, the panic message itself contains the answer: “consider using… cmpopts.IgnoreUnexported”.\
    \ There are various options you can pass to `cmp.Equal` to control how it compares\
    \ things, and `IgnoreUnexported` is the one we need in this case.\n\nAdd the following\
    \ import to your package:\n\n```\n\n```\n\nModify the calls to `cmp.Equal` in\
    \ your tests to change them from this:\n\n```\n\n```\n\nto this:\n\n```\n\n```\n\
    \nThis tells `cmp.Equal` to ignore any unexported fields on the `bookstore.Book`\
    \ struct, preventing the unpleasant panic message.\n\n## Always valid structs\n\
    \nThroughout this book we’ve been thinking about how to represent data in Go,\
    \ and what we can do with it. For example, we can add behaviour to it, by defining\
    \ methods on types. We’ve also seen how to *constrain* data to allowed values,\
    \ using unexported fields and validating accessor methods.\n\nWe can extend the\
    \ idea of an “always valid” variable or field to an entire data type. Let’s explore\
    \ that possibility by thinking about something else we’ll need in our bookstore\
    \ application: credit card information.\n\nHappy Fun Books needs to be able to\
    \ take payments, like any store, and that means we’ll need to deal with things\
    \ like credit cards. Although in practice we will probably use a third-party payment\
    \ processor to handle the actual card transactions, we might still want to be\
    \ able to store customers’ credit card details to save them time at the checkout,\
    \ for example.\n\nSuppose we’re writing a package to deal with credit cards, then,\
    \ and we want to make sure that only valid card values are created. Just as you\
    \ can ensure a field is always valid by making it unexported, could we use the\
    \ same idea to make an *always valid type*?\n\nWe could make an unexported type\
    \ `card`, for example, that can only hold valid credit card details, and enforce\
    \ that rule by requiring users to call a *constructor*: a function that creates\
    \ valid values of our chosen type.\n\nFirst, have a go yourself to see if you\
    \ can figure out how to put the necessary pieces together. Then we’ll work through\
    \ it step by step.\n\n**GOAL:** Create a new module `creditcard`, and write tests\
    \ for a constructor function `New` that creates values of type `creditcard.card`.\
    \ This type should have a string field `number` that is guaranteed not to be empty.\
    \ Make the tests pass.\n\nAs usual with any validating function, we’ll need to\
    \ write at least two tests: one for valid input, and one for invalid input. Here’s\
