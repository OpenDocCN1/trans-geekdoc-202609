    \ type that we specify directly in our Go code, such as the string literal `\"\
    For the Love of Go\"`.\n* Variables in Go have a *default* value before we assign\
    \ something to them explicitly: it’s whatever the *zero* value is for its type,\
    \ such as `\"\"` for strings, 0 for numbers, or `false` for `bool`.\n* We often\
    \ declare and assign values to variables in a single statement, using the *short\
    \ declaration form*, for example `x := y`.\n* When you want to group related values\
    \ together into a single variable, you can define a *struct type* to represent\
    \ them.\n* The different *fields* of the struct are just like any other kind of\
    \ Go variable, and they can be of any Go type, including other structs.\n* Type\
    \ definitions are introduced by the keyword `type`, and struct types with the\
    \ additional keyword `struct`, followed by a list of fields with their types.\n\
    * Identifiers (that is, the names of functions, variables, or fields) with an\
    \ initial capital letter are *exported*: that is, they’re public and can be accessed\
    \ from outside the package where they’re defined.\n* On the other hand, identifiers\
    \ beginning with a lowercase letter are *unexported*: they’re private to the package.\n\
    * Most Go packages are “about” one or more core struct types, in some sense: they’re\
    \ often the first things that you’ll define and test.\n* A neat way to design\
    \ a struct type guided by tests is to write a *compile-only test*, that simply\
    \ creates a literal value of the struct: this test can’t pass (or, indeed, compile)\
    \ until you’ve correctly defined the struct type.\n\n# 5. Story time\n\n![](media/file5.png)\n\
    \nYou’ve made a great start on the Happy Fun Books project, by setting up your\
    \ basic package structure and core `Book` type. When we get to a point like this\
    \ in a software project, it’s not always easy to know what to do next, or even\
    \ more importantly, what to do *first*.\n\n## User stories\n\nA great way to approach\
    \ this is to think about it from the point of view of *users* of our software.\
    \ Even if this is only a fun project for recreation or learning, and we don’t\
    \ anticipate having any *real* users other than ourselves, we can use it as a\
    \ thinking tool, and imagine what users would want to do with the software and\
    \ how they’d like to interact with it.\n\nAn online bookstore, for example, will\
    \ need to have certain features in order to be usable for its customers. People\
    \ will need to see what books are available, see the details of any given book,\
    \ and perhaps search for a book they’re interested in. No doubt you can think\
    \ of many more such interactions.\n\nWe sometimes call these *user stories*, because\
    \ each of them tells a little story about a user and something they want to do.\
    \ Sometimes people talk about *features* instead, but this doesn’t necessarily\
    \ make clear that all the work we do on the program should be aimed at interactions\
    \ with users in some way. And there are lots of features a program could have\
    \ that are in fact of no interest or value to users. (That doesn’t always stop\
    \ software vendors from adding them, though.). As developers, starting with a\
    \ user story helps keep our minds firmly focused on the user’s perspective.\n\n\
    ## What are the core stories?\n\nNow, there are lots of possible user stories\
    \ for an online bookstore. Here’s one: “As a customer, I want to see a sample\
    \ preview of the book in my browser so that I can figure out if I’ like to read\
    \ it.” Or “As a bookstore owner, I want to see my total revenue for the month,\
    \ so that I know if I can afford to take my family out for pizza yet.” I’m sure\
    \ you can think of dozens more.\n\nSo we don’t start by listing all possible user\
    \ stories we *could* implement. That would be a very long list, and we’d have\
    \ no idea what is the most important story, or which one we implement first.\n\
    \nInstead, it’s a good idea to ask what user stories we couldn’t possibly *leave\
    \ out*. In other words, for the bookstore to be usable at all, there are a few\
    \ non-negotiable things users need to do. Here are three I can think of:\n\n1.\
    \ Buy a book\n2. List all available books\n3. See details of a book\n\nIdentifying\
    \ these *core stories* is a very helpful way to think about any product. Assuming\
    \ that it costs us money (or at least time) to develop, and it can’t start *making*\
    \ us money until it’s viable, it makes sense to focus on developing only the critical\
    \ stories first: the ones without which we wouldn’t even *have* a product, at\
    \ least not one that users would want.\n\n## The first story\n\nLet’s start with\
    \ the “buy a book” core story, and plan how to implement it. As you’ll recall\
    \ from our work on the `calculator` package, I find it very useful to think in\
    \ terms of *behaviours*, rather than, for example, functions. Again, this keeps\
    \ our minds focused on users and what they want, instead of what kind of program\
    \ architecture seems logical to a software engineer.\n\nWhat’s the behaviour we’ll\
    \ need for the “buy a book” story? Let’s simplify it by not worrying about payments\
    \ for the time being, and just look at it from the point of view of stock control.\
    \ When a user buys a book, that will necessarily decrease the number of copies\
    \ available.\n"
