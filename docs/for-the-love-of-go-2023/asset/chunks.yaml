    \ input case taken care of. We can go on to write the test for the invalid input\
    \ case.\n\n```\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore_test.go))\n\
    \nWe try to set some negative price on the book (-1 will do just fine), and we\
