    但这里有一个潜在的问题：如果你犯了错误，并分配了一个没有意义的值呢？例如，为某本书设置一个负的 `PriceCents`，或者设置一个大于 100 或小于
    0 的 `DiscountPercent`。


    目前，我们对这类问题没有任何保护措施：我们没有对书籍所做的更改进行任何*验证*。让我们思考如何解决这个问题。


