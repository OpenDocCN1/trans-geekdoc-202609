    \nWe try to set some negative price on the book (-1 will do just fine), and we\
    \ fail the test unless `SetPriceCents` returns error. And that’s all this test\
    \ needs to do.\n\nIt doesn’t pass yet, because we haven’t done the work, but let’s\
    \ just see what that failure looks like:\n\n```\nwant error setting invalid price\
    \ -1, got nil\n```\n\nGreat! Now we can go ahead and make it pass.\n\n**GOAL:**\
    \ Add validation to `SetPriceCents` so that the test passes.\n\nHere’s one way\
    \ to do it:\n\n```\n\n```\n\n([Listing 22.1](https://github.com/bitfield/ftl-code/blob/main/22.1/bookstore.go))\n\
    \n## Always valid fields\n\nThis is a big improvement, because now if some poor\
    \ harassed programmer mistakenly calls `SetPriceCents` with an invalid price,\
    \ the program will detect the mistake automatically and alert them to it.\n\n\
    But what’s to stop someone from just setting the `PriceCents` field directly,\
    \ without going via the `SetPriceCents` method that you so obligingly provided\
    \ for them? Well, nothing. It’s an exported field on the `Book` struct, so anyone\
    \ who has a `Book` value can set the field to any value they want, including negative\
    \ ones.\n\nIs there anything we can do about this? Maybe there is. Books are usually\
    \ arranged in bookstores by *category*, such as romance novels, programming books,\
    \ or junior wizard school stories. So let’s add a new field to our `Book` struct\
    \ that identifies the category the book belongs to, and we’ll try to figure out\
    \ a way to make sure that it can only hold valid values.\n\nWhat’s valid? Well,\
    \ in this case it would have to be one of a predefined set of values, representing\
    \ the categories we have in the Happy Fun Books store: `\"Romance\"`, `\"Western\"\
    `, or `\"Quantum Mechanics\"`, for example.\n\nAdding a new `string` field to\
    \ the struct is no problem, but we want to make it impossible for people to assign\
    \ arbitrary values to that field. One way would be to make the field unexported\
    \ (`category`), and then it won’t be possible to access this field directly outside\
    \ the `bookstore` package.\n\nPeople will still need to be able to set and read\
    \ that field, naturally, but we can give them a way to do that using methods.\
    \ For example, they could read the category by calling a method `Category` on\
    \ the book, and set it by calling `SetCategory`. These are sometimes called *accessor\
    \ methods*, since they give users a way to access a field that they otherwise\
    \ couldn’t.\n\nThis is exactly the same idea as with `SetPriceCents`, except that\
    \ we’re making the relevant field unexported by giving it a lowercase name. See\
    \ if you can write the appropriate tests yourself before reading on to see how\
    \ I’d approach this.\n\n**GOAL:** Write tests for a `SetCategory` method on `Book`,\
    \ including both valid and invalid input cases. For the moment, let’s assume that\
    \ we only have one valid category, `\"Autobiography\"`, and that trying to set\
