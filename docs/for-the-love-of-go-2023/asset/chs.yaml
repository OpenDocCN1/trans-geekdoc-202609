  \n目前不要担心理解这里的所有代码；我们稍后会详细介绍。现在，只需将代码粘贴到 `calculator.go` 文件并保存。\n\n接下来，创建另一个名为 `calculator_test.go`\
  \ 的文件，包含以下内容：\n\n```go\n```([Listing 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator_test.go))\n\
  \n这是我们最终应该得到的文件夹结构：\n\n```\ncalculator/\n    calculator.go\n    calculator_test.go\n\
  \    go.mod\n```\n\n再次，你现在不需要完全理解这些代码在做什么（但你可能猜出其中一部分）。很快，你不仅会理解它是如何工作的，还将编写你自己的测试。\n\
  \n\n\n\n\n在我们开始之前，我们需要确保 Go 环境已正确安装并运行正常，项目已正确设置，并且我们能够成功地为项目运行测试。\n\n## 运行测试\n\n\
  尽管这个项目很小，但它是一个功能完整的 Go 项目，而且像所有良好的项目一样，它包含了一些测试。我们接下去要做的事情就是运行它们。\n\n**目标：** 运行该项目的测试并确保它们通过。接下来的指令将向你展示如何操作。\n\
  \n仍然在 `calculator` 文件夹中，运行以下命令：\n\n`go test`\n\n如果一切运行正常，你将看到此输出：\n\n```\nPASS\n\
  ok      calculator      0.234s\n```\n\n这告诉我们，名为 `calculator` 的包中所有测试都通过了，而且运行这些测试花费了\
  \ 0.234 秒。（在不同的计算机上，时间可能会更长或更短，但这没关系。）\n\n如果你看到测试失败信息或其他任何错误信息，说明你的 Go 配置可能存在问题。别担心，每个人刚开始都会遇到这类问题。尝试在\
  \ Google 上搜索错误信息，看看是否能找出问题所在，并检查这里 Go 网站上的安装说明：\n\n*   [`go.dev/learn/`](https://go.dev/learn/)\n\
  \n一旦测试通过，你就可以继续了！\n\n尝试使用你编辑器的 Go 支持功能直接在编辑器中运行测试。例如，在 Visual Studio Code 中，每个测试函数上方都有一个很小的\
  \ `Run test` 链接，文件顶部有一个 `Run package tests` 链接。了解在你正在使用的编辑器中如何进行操作，并成功运行测试。\n\n\
  ## 使用 `gofmt` 格式化代码\n\n接下来的工作是确保我们的 Go 代码格式正确。所有的 Go 代码都以标准方式格式化，使用 Go 附带的一个名为 `gofmt`\
  \ 的工具（如果你好奇，它的读音是“go-fumpt”）。在练习中，我们将看到如何使用它来检查和重新格式化 Go 代码（如有）。\n\n首先，让我们在代码中故意引入一个格式错误，以便我们可以尝试用\
  \ `gofmt` 找到它。编辑 `calculator.go` 文件并寻找这一行：\n\n```\n\n```\n\n```\n\n([列表 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator.go))\n\
  \n在单词 `Add` 之前插入一个额外的空格，使得该行看起来如下：\n\n```\n\n```\n\n```\n\n**目标：** 运行 `gofmt` 来检查格式并找出错误所在：\n\
  \n`gofmt -d calculator.go`\n\n```\n...\n // Add 两个数字并返回它们相加的结果。\n-func  Add(a, b\
  \ float64) float64 {\n+func Add(a, b float64) float64 {\n        return a + b\n\
  \ }\n```\n\n暂时忽略前言部分，关注以 `-` 和 `+` 开头的行：\n\n```\n-func  Add(a, b float64) float64\
  \ {\n+func Add(a, b float64) float64 {\n```\n\n`gofmt` 正在告诉我们它想做什么。它想要删除 (`-`) 在\
  \ `Add` 函数之前带有错误空格的行，并将其替换（+`）为一个已移除空格的行。\n\n**注意：** 如果你使用的是 Windows，可能会看到这样的错误：\n\
  \n```\ncomputing diff: \"diff\": executable not found in\nPATH%\n```\n\n这是因为 `gofmt`\
  \ 工具依赖于 `PATH` 中存在一个 `diff` 程序，以便它可以生成文件的视觉差异对比。如果你没有安装 `diff`，或者它不在你的 `PATH` 中，此功能将无法工作。不过别担心：这不是严重问题，也不会阻止你使用\
  \ Go 开发；它只是意味着你无法使用 `gofmt -d` 命令来检查格式。你可能会发现这个 Stack Overflow 页面对解决这个问题很有帮助：\n\n\
  *   [`Windows 上的 gofmt -d 错误`](https://stackoverflow.com/questions/5620562/why-gofmt-d-gives-computing-diff-executable-file-not-found)\n\
  \n## 使用 `gofmt -w` 修复格式\n\n我们可以使用编辑器进行必要的格式更改，但没有必要：`gofmt` 可以帮我们完成。\n\n**目标：**\
  \ 运行：\n\n`gofmt -w calculator.go`\n\n这将原地重新格式化文件。通过对该文件运行 `gofmt -d` 来检查其是否生效。现在应该没有输出了，因为已经已经格式化了。\n\
  \n如果你使用的是带有 Go 支持的编辑器，请设置编辑器在每次保存时自动通过 `gofmt` 运行你的代码。这将帮助你避免忘记格式化代码。\n\n为了好玩，尝试实验\
  \ `gofmt`。尝试用不同的方式编写代码，看看 `gofmt` 对其做了什么。观察它改变了什么以及没改变什么是有有趣的。\n\n如果你喜欢 `gofmt`，还有一个名为\
  \ [`gofumpt`](https://github.com/mvdan/gofumpt) 的类似工具，工作原理相同，但比标准的 `gofmt` 工具执行了稍更多的格式化。\n\
  \n## Go 中的函数\n\n让我们更仔细地看看 Go 中的函数，识别它的组成部分：\n\n```\n\n```\n\n```\n\n([列表 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator.go))\n\
  \n函数声明由 `func` 关键字引入。紧随 `func` 的是函数名，括号内是参数 `(a, b float64)`。\n\n括号后面是返回值类型 `float64`。大括号\
  \ `{}` 内部是函数体，其中 `return` 语句返回结果 `a + b`。\n\n我们稍会在书中详细讨论函数。\n\n## 一个失败的测试\n\n现在我们的开发环境已准备就绪，一位同事需要帮助。她一直在编写计算减法，但出现了一个问题：测试没有通过。看看我们可以做什么。\n\
  \n将以下代码粘贴到 `calculator_test.go` 文件中，位于 `TestAdd` 函数之后：\n\n```\n\n```\n\n```\n\n\
  ([列表 3.1](https://github.com/bitfield/ftl-code/blob/main/3.1/calculator_test.go))\n\
  \n这是她用于实现 `Subtract` 函数的代码。将其复制到 `calculator.go` 文件中，位于 `Add` 函数之后：\n\n```\n\n```\n\
  \n```\n\n([列表 3.1](https://github.com/bitfield/ftl-code/blob/main/3.1/calculator.go))\n\
  \n现在，显然这些代码无法工作，所以我们的挑战是找出原因并修复它。幸运的是，我们有一个失败的测试来帮助。\n\n保存修改后的文件，并运行命令运行测试：\n\n\
  `go test`\n\n```\n--- FAIL: TestSubtract (0.00s)\n    calculator_test.go:22: want\
  \ 2.000000, got -2.000000\nFAIL\nexit status 1\nFAIL    calculator      0.178s\n\
  ```\n\n这里有很多有用信息，所以让我们学习如何解释此测试输出。首先，某些失败了，因为我们看到了 `FAIL` 这个词。我们接下来想知道的是什么失败了，以及为什么。\n\
  \n我们有两个测试，目前只有一个失败了。是哪一个？`go test` 的输出告诉我们失败测试名称：\n\n```\n--- FAIL: TestSubtract\
  \ (0.00s)\n```\n\n这是一个很好的开始，但我们还可以了解更多。输出告诉我们测试故障发生的源文件和行号：\n\n```\ncalculator_test.go:22\n\
  ```\n\n让我们再次快速查看测试以找到第 22 行：\n\n\n\n\n它是调用 `t.Errorf` 来触发测试失败的那行代码，这很合逻辑。那么为什么那句语句会被执行呢？只因为\
  \ `if` 语句中的条件为真：换句话说，`got` 不等于 `want`。\n\n这一点在失败信息中得到了印证：\n\n```\nwant 2.000000,\
  \ got -2.000000\n```\n\n现在我们拥有了解决问题所需的所有信息。不过，在处理这个问题之前，让我们详细检查一下测试，拆解它具体做了什么。\n\
  \n## `testing` 包\n\n你可能已经注意到，在 `calculator_test.go` 文件中，文件顶部有一个这样的 `import` 语句：\n\
  \n```\n\n```\n\n在 Go 语言中，我们必须显式地 `import`（导入）任何我们想要使用的包，包括在本例中的 `calculator` 包本身。由于我们正在对其进行测试，我们需要调用它的函数，而如果不导入它，我们就无法做到这一点。\n\
  \n同样，我们正在使用来自 `testing` 包的函数，所以我们也把它导入了。`testing` 是什么？正如你可能猜的样，它是 Go 标准库中一个与测试相关的包。\n\
  \nGo 提供了编写测试的内置支持。与某些语言不同，我们不需要任何额外的框架或第三方包就可以测试 Go 代码。如果你想尝试一下，有许多这样的包可供选择，但我建议从标准的、内置的\
  \ `testing` 包开始。\n\n我们将频繁使用 `testing` 包，所以花一点时间来阅读它的文档并熟悉它它是值得的：\n\n* [`pkg.go.dev/testing`](https://pkg.go.dev/testing)\n\
  \n## 测试函数的函数签名\n\n我们还可以看到 `TestSubtract` 是一个 Go 函数（因为它是由 `func` 关键字引入的）：\n\n```\n\
  \n```\n\nGo 项目中的每个测试都是一个函数，就像我们已经过的 `Add` 和 `Subtract` 函数一样。但为了让 Go 识别某个特定函数为测试，有几个特殊要求。\n\
  \n首先，它必须位于一个以 `_test.go` 结尾的文件中（同一个文件中可以有多个测试）。Go 使用这种文件名模式来识别包含测试的源文件。\n\n此外，测试函数的名称必须以\
  \ `Test` 单词开头，否则 Go 将不会将其识别为测试。它还必须接受一个类型为 `*testing.T` 的参数。目前不要担心它的具体用途是什么；把它想象成一个允许我们控制测试结果的工具即可。\n\
  \n最后，测试函数不返回任何内容（右括号和左大括号之间有一个空格，那里通常是放置结果列表的地方）。所以这就是 Go 中测试函数的签名。\n\n## 测试体\n\n\
  那么 `TestSubtract` 到底在做什么呢？让我们仔细观察一下函数体。这里再次出现，我们将逐行查看：\n\n```\n\n```\n\n([代码列表 3.1](https://github.com/bitfield/ftl-code/blob/main/3.1/calculator_test.go))\n\
  \n首先，`t.Parallel()` 语句是测试的标准序言：它告诉 Go 与测试并发运行此测试，从而节省时间。\n\n接下来的语句设置了一个名为 `want`\
  \ 的变量，用来表示它想要从被测试的函数（`Subtract`）中接收的结果：\n\n```\n\n```\n\n然后它用值 `4` 和 `2` 调用了 `Subtract`\
  \ 函数，并将结果存储在另一个变量 `got` 中：\n\n```\n\n```\n\n我们知道，如果测试要对它的行为进行任何测试，就必须在某处调用 `Subtract`\
  \ 函数。而这正是发生的地方。我们用 `4` 和 `2` 调用了 `Subtract`，并询问“结果到底是什么？”\n\n它是调用 `t.Errorf` 的行，这很合逻辑。那么为什么那句语句会被执行呢？只因为\
  \ `if` 语句中的条件为真：换句话说，`got` 不等于 `want`。\n\n\n\n通常情况下，执行会沿着直线“向下”通过一个函数，如果你愿意的话，就是遵循代码的左侧边距。但\
  \ `if` 块内部的代码被缩进了，这表明如果条件为真，执行路径就会发生变化。它不是沿着左侧边缘直线向下，而是向右侧折线移动。\n\n## 核心点总结\n\n\
  - `go mod init` 命令初始化一个新的 Go 项目文件夹。\n- `go test` 命令运行 Go 包的测试。\n- `gofmt` 命令将检查\
  \ Go 代码是否符合标准格式，并在必要时进行修复。\n- `function declaration`（函数声明）会宣布一个新函数的名称，并列出它接收的参数以及它返回的任何结果。\n\
  - 每当 Go 测试失败时，它都会显示发生错误的具体文件和行号，以及失败的内容。\n- `import` 关键字告诉 Go 我们想在这个特定的 Go 文件中使用哪些其他包。\n\
  - `testing` 包是 Go 标准库的一部分，它提供了我们编写和运行测试所需的所有内容。\n- 测试函数的名称以 `Test` 单词开头，并且它们接收一个\
  \ `*testing.T` 参数，允许我们控制测试的执行。\n- 使用 `want and got` 模式来构建测试：表达你“想要”（want）的结果，然后将其与从被测函数中“得到”（got）的结果进行比较。\n\
  - 我们可以调用 `t.Errorf` 来带消息地导致测试失败，如果我们不这样做，测试默认将通过。\n- `if` 语句用于在某些条件为真时（例如 `want`\
  \ 不匹配 `got`）执行某些操作（例如让测试失败）。\n\n# 2. 前进并繁衍\n\n\n干得好。我们现在有了一个可以加法和减法的计算器。这是一个非常棒的开始。现在让我们构建一个新功能：`multiplication`（乘法）。\n\
  \n## 在测试引导下设计新功能\n\n到为止，我们一直在运行现有的测试并修改现有代码。现在我们将同时编写测试和它所测试的函数。\n\n我们将从测试开始，所以这是第一个挑战：\n\
  \n**目标：** 为函数 `Multiply` 编写测试，该函数接收两个数字作为参数，将它们相乘并返回一个表示结果的单个数字。\n\n我们应该从哪里开始？嗯，这是一个测试，所以从编辑\
  \ `calculator_test.go` 文件开始。我们正在添加一个新测试，因此我们需要在该文件中写一个新函数。我们应该叫它什么？\n\n嗯，我们知道 Go\
  \ 测试函数的名称必须以 `Test` 开头，否则 Go 不会将其识别为测试。名字其余部分由我们决定。`TestMultiply` 怎么样？\n\n根据我们在上一章中学到的知识，我们已经有了编写测试所需的所有内容。但我们不需要从零开始；毕竟我们有两个相似的测试可以作为模型。让我们从复制\
  \ `TestAdd` 函数开始，将其粘贴到测试的末尾并进行一些更改。\n\n首先，我们需要更改测试的名称，因为 Go 不允许有两个同名的函数。我们将名称更改为\
  \ `TestMultiply`。\n\n第二个我们需要更改的是对 `calculator.Add` 的调用。现在它应该是 `calculator.Multiply`。让我们也更改函数的参数，将它们改为\
  \ `3` 和 `3`。\n\n最后，我们需要更新赋值给 `want` 的值。我们希望 3 乘以 3 的结果是多少多少？我认为是 9，但你可能想检查一下我的计算。以下是进行这些更改后的结果：\n\
  \n`([Listing 4.1](https://github.com/bitfield/ftl-code/blob/main/4.1/calculator_test.go))`\n\
  \n让我们运行测试看看进展得如何：\n\n`go test`\n\n```\nundefined: calculator.Multiply\n```\n\n这完全没问题，因为这是我们预料到的。我们还没有写\
  \ `Multiply` 函数，所以难怪编译器找不到它。暂时忽略这个错误；一旦我们提供了 `Multiply` 的定义，它就会消失。\n\n## 测试一个空实现\n\
  \n现在我们准备好迈下一步来获取一个失败的测试。这听起来有点奇怪：我们不应该目标是一个通过的测试吗？\n\n嗯，最终是这样。但首先有一个重要的步骤要执行。`TestMultiply`\
  \ 函数的作用是检测 `Multiply` 中的错误（如果有的话）。我们如何知道它真的能做到这一点？\n\n例如，如果我们现在编写了 `Multiply` 的正确实现并运行测试，预计它会通过。但测试中可能存在某些错误导致它意外通过。正如我们所看到的，如果我们不做任何操作让测试失败，Go\
  \ 的测试默认会通过。\n\n测试可能哪里出了什么问题？嗯，我们可能有一个错误的 `want` 值。假设由于某种不运，一个有错误的 `Multiply` 函数返回了我们放置在\
  \ `want` 中的完全错误的值。即使函数不起作用，测试也会通过。\n\n或者我们可能在 `if` 语句中写了错误的条件表达式。例如，这种错误很容易犯：通过编写\
  \ `==` 而不是 `!=`，我们让测试执行了与本该完全相反的操作。如果 `Multiply` 返回了正确答案，测试将失败！\n\n那么，我们如何向自己证明测试能正确检测到\
  \ `Multiply` 未正常工作？一种方法是故意写一个不工作的 `Multiply` 看看测试是否能通过。\n\n**目标：** 编写一个错误的 `Multiply`\
  \ 版本，并显示测试失败。\n\n我们将新函数添加到 `calculator.go` 文件，它看起来和现有的 `Add` 和 `Subtract` 函数非常相似。我们到底应该如何错误地编写函数来验证测试？嗯，这并不重要，因为对于我们的目的来说，任何非正确的结果都可以。最简单的可能是无论输入返回零：\n\
  \n这就是我们所谓的函数的空实现。它可以编译，我们可以从测试中调用它并得到结果。但由于该函数没有进行任何计算，结果几乎确定是错误的。\n\n记住，我们现在对 `Multiply`\
  \ 不感兴趣。我们的任务仅仅是证明我们为 `Multiply` 编写的测试可以检测到错误。始终返回零是一个相当大的错误！如果我们无法检测到，我们的开始就糟糕了。让我们尝试：\n\
  \n`go test`\n\n```\n--- FAIL: TestMultiply (0.00s)\n    calculator_test.go:31: want\
  \ 9.000000, got 0.000000\n```\n\n太好了。这正是我们想要的。我们证明了 `TestMultiply` 可以检测到至少这个错误，所以它在起作用。如果我们没有做到这一点，我们真的无法知道\
  \ `TestMultiply` 是否能检测到任何错误——换句话说，它是否真的测试了某些东西。\n\n现在我们知道它是可以的，我们就可以放心地编写 `Multiply`\
  \ 的真实实现了，并确信测试会告诉我们是否写对了。\n\n## 编写真实实现\n\n这个过程的最后一步相对简单。我们只需要更改 `Multiply` 函数使其返回正确答案而不是零。正如我们所看到的，我们可以通过运行测试来检查代码。一旦它通过了，我们就完成了！\n\
  \n如果你卡住了，请查看 [Listing 4.1](https://github.com/bitfield/ftl-code/blob/main/4.1/calculator.go)\
  \ 中的一种可能的解决方案。\n\n现在我们已经通过测试引导成功设计并实现了一个新的计算器功能，是时候更多地思考更复杂的行为了。`Add`、`Subtract`\
  \ 和 `Multiply` 函数非常简单，以至于很难出错（尽管对于有决心的程序员来说这并非不可能）。如果 `TestAdd` 对于一组输入通过了（例如），很难想象还有哪些输入会让它失败。\n\
  \n\n\n但这并不适用于某些其他函数，在这些函数中，它们可能对某些输入可以正常工作，但对另一些输入则不能。在这种情况下，为每个函数测试多个 `cases` 将是一个好主意：也就是说，具有不同预期结果的不同输入。\n\
  \n例如，`TestAdd` 的当前版本测试了调用 `Add(2, 2)` 并检查结果是否为 4。我们可以写一个新函数 `TestAdd1`，例如，调用 `Add(1,\
  \ 1)` 并期望结果为 2。但对于许多不同的输入，这将会非常繁琐。\n\n## 引入测试用例\n\n相反，最优雅的解决方案是定义若干不同的测试用例——每个用例代表一对输入以及预期的输出——然后对它们进行循环，使用输入调用\
  \ `Add` 并将输出与预期结果进行比对。如果任何测试用例失败，整个测试就会失败。这些测试有时被称为表格测试（table tests），因为它们将测试数据表示为输入及其结果的表格。\n\
  \n让我们看看它可能是什么样子。首先，定义一个 `struct` 类型来表示测试用例会很方便。`struct` 是 Go 中结构化数据类型的名称：也就是说，它是包含多个信息位并合并成单个记录的东西。\n\
  \n如果你对这不熟悉，不要担心；我们稍后会介绍这个话题。我们在这里真正关注的是测试逻辑，这只是设置测试用例的一种，以便我们实现该目标。让我们在 `TestAdd`\
  \ 函数内部进行操作，因为测试用例通常特定于某个函数：\n\n```go\n// Listing 5.1 ft-code/main/5.1/calculator_test.go\n\
  ```\n\n## 测试用例切片\n\n如果你已经有一些 Go 经验，你可能熟悉切片（slice）的概念：它只是 Go 对一组东西的称呼。在某些语言中，这被称为数组（array），但无论我们如何称呼，其核心思想是一样的：一组相同类型的值的序列。\n\
  \n再次，我们将在本书的后半部分详细讨论切片和其他数据类型。但现在，不必担心细节；我们只需要使用一个切片来表示一组测试用例。与其编写许多仅在输入上不同的测试，我们更希望只写一个测试许多用例的测试。对于每个用例，我们将像之前做的那样：使用输入\
  \ `a` 和 `b` 调用 `Add` 函数，并将其结果与 `want` 进行比对。\n\n既然已经已经定义了用于测试用例的数据类型（`testCase`），让我们实际提供一些此类数据吧。为了做到这一点，我们将创建一个变量\
  \ `testCases` 并给它分配一些值。\n\n```go\n// Listing 5.1 ft-code/main/5.1/calculator_test.go\n\
  ```\n\n在这里，我们创建了一个名为 `testCases` 的变量，其值是一个包含元素的 `testCase` 结构体切片。那么，该切片中的每个元素都是我们之前定义的\
  \ `testCase` 结构体的实例。它具有字段 `a`、`b` 和 `want`，分别代表测试用例的输入和预期输出。\n\n接下来，我们需要为我们的每个用例测试\
  \ `Add` 的结果。这涉及到多次重复一段代码，每次使用一个不同的测试用例。\n\n## 遍历测试用例\n\n现在我们已经有了测试用例，可以编写代码来循环遍历它们。我们将使用\
  \ `range` 操作符来完成（再次，如果现在不熟悉请不要担心：我们稍后会回到这里）。我们仍然在 `TestAdd` 函数内部，由于之前已经声明了 `testCases`\
  \ 切片，我们现在可以在 `for` 语句中使用它，引入一个循环：\n\n```go\n// Listing 5.1 ft-code/main/5.1/calculator_test.go\n\
  ```\n\n循环内部，`tc` 将是一个 `testCase` 结构体，`tc.a` 和 `tc.b` 是输入，而 `tc.want` 是预期结果。\n\n\
  ```go\nfor _, tc := range testCases {\n    got := Add(tc.a, tc.b)\n    if got !=\
  \ tc.want {\n        t.Errorf(\"Add(%d, %d) = %d; want %d\", tc.a, tc.b, got, tc.want)\n\
  \    }\n}\n```\n\n\n\n但现在我们还要说有*另一种*行为。如果输入无效，`Divide` 的错误结果应该被设置为某个指示了问题的值。对于函数根据情况可以执行的每种不同操作，我们称其具有一个独特的行为。\n\
  \n一个很好记的规则是：\n\n**一个行为，一个用例。**\n\n这有助于我们创建短小、简单且集中的测试，使其易于阅读和理解。每个测试都应该针对程序的一个特定行为。\n\
  \n所以，对于“有效输入”行为，我们可以使用与 `Add`、`Subtract` 和 `Multiply` 相同的测试基本结构，只需进行一些小改动。在考虑如何测试“无效输入”行为之前，让我们先这样做。\n\
  \n## 测试有效输入\n\n让我们从创建 `TestDivide` 函数开始，并复制粘贴我们现有测试之一的代码；也许是 `TestAdd`。代码如下：\n\n\
  ```\n\n```\n\n```\n\n```\n\n（[代码列表 5.1](https://github.com/bitfield/ftl-code/blob/main/5.1/calculator_test.go))\n\
  \n这里需要修改什么？嗯，我们将调用 `calculator.Divide` 函数而不是 `calculator.Add`；这很直观，让我们来这个修改。让我们也设置一些合适的用例：\n\
  \n```\n\n```\n\n```\n\n```\n\n（[代码列表 6.1](https://github.com/bitfield/ftl-code/blob/main/6.1/calculator_test.go))\n\
  \n## 接收错误值\n\n但还有其他东西。这里是 `TestAdd` 如何设置 `got` 值的：\n\n```\n\n```\n\n但我们说 `Divide`\
  \ 将返回*两个*结果。第一个是像常的 `got`——和的答案。但我们增加了第二个结果：错误指示器。我们需要在赋值语句中接收这两个值。我们将第二个值命名为 `err`，是\
  \ `error` 的缩写：\n\n```\n\n```\n\n很好。我们知道如何通过比较 `got` 和 `tc.want` 来检查算术运算；这没问题。那么\
  \ `err` 值呢？测试应该期望它是什么？\n\n嗯，*这个*测试只针对“有效输入”行为，所以我们预期没有错误。我们可以通过将 `err` 与特殊值 `nil`（在这种情况下意味着“无错误”）进行比较来实现。如果它们不同，测试就应该失败：\n\
  \n```\n\n```\n\n为什么在这种情况下调用 `t.Fatalf` 而不是我们一直使用的 `t.Errorf`？它们的区别是什么？嗯，`t.Errorf`\
  \ 将测试标记为失败，但它仍然继续执行测试的其余部分。\n\n相比之下，`t.Fatalf` 会立即退出测试；它表示情况已经糟糕到没有必要继续执行了。这里正是如此，因为如果\
  \ `err` 不是 `nil`，说明 `got` 值不应该被使用——它是无效的，因为在尝试生成它时发生了错误。\n\n如果我们成功通过了该检查而没有失败，我们就知道\
  \ `got` 值至少是*有效*的，即使不一定是*正确*的——我们现在将像之前的测试一样来检查这一点：\n\n```\n\n```\n\n这就是我们需要做的全部。这里是\
  \ `TestDivide` 的完整主体：\n\n```\n\n```\n\n```\n\n```（[代码列表 6.1](https://github.com/bitfield/ftl-code/blob/main/6.1/calculator_test.go))\n\
  \n如果我们现在运行 `go test`，假设没有拼写错误，我们应该期望看到一个编译错误，因为 `calculator.Divide` 还没有定义，所以我们确实看到了：\n\
  \n```\n./calculator_test.go:80:15: undefined: calculator.Divide\n```\n\n我们将在下一章介绍如何编写\
  \ `Divide` 本身。\n\n## 结语\n\n* 在编写多个相似的测试时，不要害怕复制粘贴现有的测试并修改它来实现你的需求（只需不要忘记检查是否已进行了所有必要的更改）。\n\
  * 编写测试的初始结果应该是编译器错误，如 `undefined: calculator.Multiply`（因为我们还没有写那个函数）。\n* 下一步是编写该函数的*空实现*，让它刻意返回错误的结果，这样我们就可以检查测试是否检测到了这种情况。\n\
