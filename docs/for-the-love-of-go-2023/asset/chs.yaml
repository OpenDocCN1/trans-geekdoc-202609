  \n## 总结（Takeaways）\n\n*   开始认真思考包需要做什么的一种好方法是编写*用户故事*（user stories）：从用户角度对程序交互的简短描述。\n\
  *   用户故事并不等于*功能*（features），功能只是“程序能做的事”：一个特定的用户故事可能会用到多个功能，而某些功能可能完全不影响用户。\n*  \
  \ 对于任何程序，有效的开始是识别*核心故事*（core stories），即让程序具有意义的最小用户故事集，我们应该优先实现这些故事。\n*   在设计实现用户故事的代码时，用*行为*（behaviours）而不是*函数*（functions）来会有帮助：先问“程序需要如何表现？”，当你知道答案后，你就会更清楚可能需要编写哪些函数。\n\
  \n\n\n\n*   当我们对变量进行数字加减法操作时，可以使用 `+=` 和 `-=` 运算符：`b.Copies -= 5`。\n*   当我们只想恰好地加或减去\
  \ 1 时（这非常常见），可以使用 `++` 和 `--` 运算符：`b.Copies--`。\n*   一个给定的测试 `covers`（覆盖）某些特定的代码行：也就是说当我们运行测试时，这些行会被执行。\n\
  *   Go 工具可以告诉我们代码中有百分之几 `percentage` 被测试覆盖，并显示哪些被了覆盖、哪些没有被覆盖，这对于发现我们遗忘测试的内容很有帮助。\n\
  *   如果我们在实现每个行为之前都对其进行测试，那么就不可能 `be` 有任何未被测试的重要代码，但如果真的有代码漏掉了这张网，代码覆盖率工具将帮助我们找到它。\n\
  *   代码中任何时候出现 `if` 语句，都有两种可能的代码路径，代表两种不同的行为，我们可能需要对这两种行为都编写测试。\n*   我们应该注意不要过度解读测试覆盖率统计数据：它们只能证明某行被测试\
  \ `executed`（执行）了，而不是证明它实际上 `works`（有效）。\n*   通常情况下，测试覆盖率越高比越少好，但不要追求某个特定的数字，因为那没用：相反，目标应该是测试\
  \ 100% 的重要 `behaviours`（行为），而不是 100% 的 `lines`（行）。\n*   当未覆盖的是微不足道的、我们可以肉眼检查其正确性、且为它们编写测试没有实际价值时，覆盖率低于\
  \ 100% 是可以的：这通常适用于简单的 `if err != nil` 块。\n\n# 6. 切片与细分\n\n![](img/file6.png)\n\n\
  到目前为止，你的书店项目有一个很好的开始，但我们仍然缺少一些东西。我们可以创建一个 `Book` 单一值并将其赋值给变量，但一个体面的书店需要多本书。我们还没有处理物品\
  \ `collections`（集合，例如书籍）的方法。\n\n## 切片 (Slices)\n\n正如我们将一组不同类型的值组合到一个 `struct` 中，以便将其作为一个单元来处理，我们也希望有一种方法将一组`same`（相同）类型的值组合在一起。你可能记得书中前面的部分，在\
  \ Go 中，一类值的集合被称为 `slice`（切片）。\n\n例如，代表一组书籍的值将是一个 `slice of Book`（我们是这样称呼它的）。我们在元素类型之前使用空方括号来编写它：`[]Book`。正如\
  \ Go 中的每个单独的 `struct` 类型都是独立的类型，每个切片也是如此。\n\n## 切片变量 (Slice variables)\n\n我们可以声明切片类型的变量吗？可以，我们可以：\n\
  \n```\n\n```\n\n```\n\n这表示“请创建一个类型为 `[]Book`（`Book` 的切片）的变量 `books`”。\n\n## 切片字面量\
  \ (Slice literals)\n\n我们已经见过如何写结构体字面量；你可能记得在 `calculator` 测试中，我们也可以写 `slice literal`（切片字面量）：\n\
  \n```\n\n```\n\n```\n\n赋值右侧的值是一个空的 `[]Book` 字面量。如果我们想在其中包含一些实际书籍，可以这样做，通过在大括号内部放置一些\
  \ `Book` 字面量（每个都带有一个尾随逗号）：\n\n```\n\n```\n\n\n\n注意，我们不需要在切片内部的每个结构体字面量之前编写类型名 `Book`，因为\
  \ Go 知道只有 `Book` 值可能成为 `Book` 切片的成员。\n\n## 切片索引 (Slice indexes)\n\n我们可以对切片做一些基础类型或\
  \ `struct` 类型无法做到的操作：我们可以引用它的其中一个 `elements`（元素）。如果我们只需要（例如）切片中的第一本书，我们可以使用方括号中的\
  \ `index`（索引）来指定我们想要的元素：\n\n```\n\n```\n\n```\n\n索引是一个非负整数，用于指定我们感兴趣的单个元素，其中第一个元素的索引为\
  \ 0，第二个为 1，依此类推。（如果有帮助的话，可以将索引想象为从切片开始位置的 `offset`（偏移量）。）\n\n## 切片长度 (Slice length)\n\
  \n给定一个特定长度的切片变量，那么我们如何知道哪些索引是安全的？那是 `len`。\n\n## 修改切片 (Modifying slice)\n\n我们可以修改切片元素吗？确实可以，使用它的索引：\n\
  \n```\n\n```\n\n## 向切片追加元素 (Appending to slices)\n\n我们可以对切片做一些基础类型或 `struct` 类型无法做到的操作：我们可以引用它的其中一个\
  \ `elements`（元素）。如果我们只需要（例如）切片中的第一本书，我们可以使用方括号中的 `index`（索引）来指定我们想要的元素：\n\n```\n\
  \n```\n\n```\n\n## 书集合 (Collection of books)\n\n让我们用两个 `string` 切片尝试一下：\n\n```\n\
  \n```\n\n```\n\n输出看起来如下：\n\n\n\n\n\n```go\n   []string{\n    \"same\",\n -  \"same\"\
  ,\n +  \"different\",\n    \"same\",\n   }\n```\n\n看它是如何高亮两个切片之间不同的那个元素的？预期的值（来自\
  \ `want`）用 `-` 前缀标记，而实际收到的值则用 `+` 前缀显示出来。\n\n换句话说：\n\n```\nwant \"same\"\ngot \"\
