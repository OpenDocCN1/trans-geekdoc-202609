  \n\n在理论上，我们可以将任何现实世界的问题建模为对象的集合，这些对象具有各种属性，并以各种方式相互关联。例如，一个绘图程序可能会处理 `Shape` 对象，这些对象可能存储关于其顶点或边缘的信息，或者是具有不同属性的\
  \ `Brush` 对象。一个卡牌游戏程序可能包含像 `Card`、`Hand` 和 `Player` 这样的对象。\n\n或者我们的程序也可以可以使用现实世界中没有对应物的对象：例如，数据库。本质上，任何结构化数据都可以被视为一个对象。\n\
  \n## 使用对象进行计算\n\n对象还有另一点我们尚未讨论过的特征，那就是 `behaviour`（行为）。例如，在我们假设的绘图程序中，形状可能可以在屏幕上绘制自己，或者将自己缩放为不同的大小。这就是\
  \ `behaviour`：对象不仅仅是被动地存储数据，而是对数据*进行*了某种操作。\n\n行为还需要 `logic`（逻辑）：换句话说，就是代码。虽然我们可以在对象的字段中存储关于对象的数据，但这些数据是`static`的：我们能做的只是设置它们并读取回来。如果我们想对数据进行任何形式的计算，就必须编写一个函数并将对象作为参数传递。。\n\
