  * `for ... range` 循环将为切片中的每个元素执行一次某些代码。\n* 仅仅测试许多相似的案例没有意义：为了增加我们对函数正确性的信心，我们应该尝试我们所能想到的尽可能*不同*类型的案例：零、负数、空、反向、正向、侧向。\n\
