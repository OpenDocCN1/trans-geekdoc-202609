  \ 2, 3}`，该函数应返回 6。\n\n## 条件 `for` 语句\n\n让我们回到在本章早期介绍的*条件* `for` 循环，只要指定的某个条件为 `true`，它就会持续执行。正如我们所说，如果我们完全省略条件，等同于指定了条件\
