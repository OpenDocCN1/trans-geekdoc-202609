  \n## 重点总结\n\n* 当你定义一个新类型时，它不会自动“继承”基础类型拥有的任何方法。\n* 但你可以定义一个*结构体*类型，包含你想要*包装*的类型的字段。\n\
  * 既然函数可以接收指针参数，方法也可以接收*指针接收者*，事实上。\n* 当你把变量传递给函数时，函数接收的是该值的*副本*。\n* 如果函数修改了值，该更改不会反映在原始变量中。\n\
  * 当你*想要*函数修改原始变量时，你可以创建一个变量的*指针*并传递它。\n* 指针提供了*修改*它所指向的内容。\n* `&` 运算符创建一个指针，所以 `&x`\
  \ 给出了 `x` 的指针。\n* 接收指针的函数必须声明相应的类型：例如 `*int` 表示“指向 int 的指针”。\n* 正如类型是独特的且不可互换的，这些类型的指针也是如此：例如\
  \ `*int` 和 `*float64` 是不同的类型。\n* 我们对指针值唯一允许的操作是使用 `*` 运算符*解引用*它获取它指向的值，所以 `*p` 给\
  \ `p` 所向的值。\n* 任何指针类型的默认（零）值都是 `nil`，意味着“不指向任何内容”。\n* 尝试解引用恰好为 `nil` 的指针会导致程序*panic*并报错终止。\n\
