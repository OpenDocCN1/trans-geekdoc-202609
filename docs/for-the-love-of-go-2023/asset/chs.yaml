  \n> *写得很好，友好且见见。*\n\n> —Kevin.*\n\n# 引言\n\n\n你好，欢迎来到 Go 世界！\n\n## 这是什么？\n\n如果你没有\
  \ Go 经验，或者想要学习，那么你找对地方了。这本书是为初学者准备的，如果你已经有一些 Go 经验，也会发现它非常有帮助。\n\n## 它涵盖了什么？\n\n\
  这本书的设计是通过示例来教你 Go。我们没有使用任何高级特性，但使用了一些让 Go 强大的特性。\n\n## 你需要什么\n\n如果你没有 Go 经验，或者想要学习，那么你找对地方了。这本书是为初学者准备的，如果你已经有一些\
  \ Go 经验，也会发现它非常有帮助。\n\n## 在哪里找到代码\n\n书中书中有很多挑战供你解决。如果你遇到困难，或者只是想检查代码，所有的解决方案都可以在公共\
  \ GitHub 上找到：\n\n* [`github.com/bitfield/ftl-code`](https://github.com/bitfield/ftl-code)\n\
  \n每个章节 [1.1](https://github.com/bitfield/ftl-code/tree/1.1)\n\n## 你将学到\n\n通过阅读这本书并完成练习，你将学习：\n\
  \n* 如何在 Go 中编写*测试*，以及如何通过测试引导项目开发\n* 如何使用内置类型、自定义结构体类型以及 map 和 slice 等集合在 Go 中管理数据\n\
  * 如何编写和测试*函数*，包括返回多个结果和错误值的函数\n* 如何使用*对象*在 Go 中对问题进行建模，以及如何使用*方法*为对象添加行为\n* 如何使用*指针*编写修改对象的方法，以及如何使用*类型*和*验证*让你的\
  \ Go 包易于使用\n\n```\ngo version\n```\n\n\n\n\n\nGo 是谦逊的，这也是我们应该采取的良好态度。它并不声称是世界上最强大的编程语言、最先进的、或者最纯粹、优雅且在理论上具有吸引力的。它并非如此。Go\
  \ 的设计者想要最大化 `productivity`，而不是优雅性，这解释了很多问题。\n\n同样，我们用 Go 编写程序应该是简单、直 way 且务实的。如果它们也很优雅，那固然很好，但这不是目标。因为\
  \ Go 程序倾向于简单易于理解，所以以后修改它们非常容易，因此我们不需要在开始时对一切都进行过度工程。我们只需要构建完成任务所需的内容并到此为止。\n\n我们试图解决我们当前\
  \ `have` 的问题，而不是下周或明年可能面临的问题。Go 程序员不会盲目应用诸如“始终编写短函数”之类的编码教条（无论情况如何），他们更感兴趣的是什么能让\
  \ `program` 更清晰。\n\n## 信心心地编程\n\n我们编写的程序能够 `correct` 是非常重要的。也就是说，它们应该执行它们想要的功能。事实上，如果程序是不正确的，那么它的其他任何属性都不重要了。\n\
  \n提高我们对程序正确性信心的一种方法是为它编写 `tests`。\n\n测试也是一个程序，但它是专门设计用于用各种不同的输入运行 `another` 程序并检查其结果的程序。测试验证了程序的行为确实如其预期的那样。\n\
  \n例如，如果你正在考虑编写一个名为 `Multiply` 的函数，并且你想能够检查它是否正常工作，你可能会编写一个调用 `Multiply(2, 2)` 并检查答案是否为\
  \ `4` 的程序。这就是测试！\n\n事实证明，在开始编写它所测试的函数之前编写测试是一个好主意。如果你不习惯这样做，这种反过来的方法可能有点奇怪。但它实际上非常有道理。\n\
  \n通过先写测试，你被迫去思考程序实际上需要做什么。你还必须设计它的接口（用户与程序交互的方式）。如果调用你的函数非常别扭，或者它的名称在使用的语境下没有意义，所有这些问题在你编写测试时都会显而易**。实际上，你正在成为自己的第一个用户。\n\
  \n这也意味着你知道何时停止编写代码，因为当测试开始通过时，你就完成了！\n\n所以，编写测试不仅是为了获得对代码正确性的信心（尽管这绝对有用），它也是设计具有良好结构和良好\
  \ API 的程序的强大过程。我喜欢一个描述这个过程的短语是“由测试引导的开发 `development`”。\n\n## 本书有什么不同？\n\n大多数 Go\
  \ 教程将从向你介绍语言的基础语法、变量、数据类型等开始。这些是重要的知识，我们将在书中也会涵盖它们。但因为我希望你彻底熟悉由测试引导的软件开发流程，我们将从一开始就开始做这件事。\n\
  \n为了做到这一点，我们将 `use` 一些你可能还不熟悉的 Go 概念：函数、变量、`testing` 包等。不要担心一开始就理解发生的一切：我们稍后会涉及到细节。在前几章中，只需放松心情享受这段旅程，即使你遇到了一些看起来有点神秘的东西。\n\
  \n事实上，这通常是我们程序员经常面临的处境：我们 `have` 一些并不一定完全理解的现有代码，但我们会尝试弄懂足够解决当前问题的程度。所以这对你来说将是一次很好的练习，而且所有的内容都将在合适的地方得到解释。\n\
  \n## 如何使用本书书\n\n在整本书中，我们将共同开发一个 Go 项目。每一章都会引入一个新特性或概念，并为你设定一些要实现的目标。目标用加粗的 **GOAL**\
  \ 标记。（如果你不确定如何开始，不要担心。在目标描述之后通常会有一些有用的建议。）\n\n让我们开始吧！\n\n# 1. 测试时刻\n\n\n这是你在 Texio\
  \ Instronics 担任 Go 开发人员的第一天，该公司是大型小部件和各种杂货的制造商，你被分配到未来项目部门开发一个非常令人兴奋的新产品：一个由 Go\
  \ 驱动的电子计算器。欢迎加入。\n\n在这次练习中，我们只需要确保我们的 Go 环境已设置好，并且一切运行正常。我们将为计算器包创建一个新的 Go 项目，为其添加一些测试代码并运行测试。\n\
  \n## 创建新项目\n\n每个 Go 项目都需要两个东西：磁盘上一个存放源代码的 `folder`，以及一个用于识别 `module` 或项目名称的 `go.mod`\
  \ 文件。\n\n如果你还没有，我建议你在计算机上创建一个新文件夹来存放你的 Go 项目（可以放在你喜欢的任何位置）。然后，在这个文件夹内创建一个名为 `calculator`\
  \ 的子文件夹。\n\n接下来，使用你的终端程序（例如 macOS 的 Terminal 应用）或你的代码编辑器启动 shell 会话。使用 `cd` 命令将工作目录设置为项目文件夹（例如，`cd\
  \ ~/go/calculator`）。\n\n现在在 shell 中运行以下命令：\n\n```bash\ngo mod init calculator\n\
  ```\n\n`go: creating new go.mod: module calculator`\n\n你应该发现创建了一个名为 `go.mod` 的新文件，内容如下（或类似内容）：\n\
  \n```go\nmodule calculator\n\ngo 1.19\n```\n(注：此处根据示例逻辑补充了 1.19 版本号，以保持格式对齐)\n\n\
  Go 将代码组织成名为 `modules` 的单元，每个模块都需要一个 `go.mod` 文件来告诉 Go 该文件夹是一个模块，以及模块的名称（在本例中为 `calculator`）。\n\
  \n现在我们应该有了这样的文件夹结构：\n\n```\ncalculator/\n    go.mod\n```\n\n清楚了吗？我们将在书中创建多个新的 Go\
  \ 项目，使用本节所示的步骤：创建一个文件夹，然后在文件夹内运行 `go mod init MODULE_NAME`，其中 `MODULE_NAME` 是我们想给项目命的名字。\n\
  \n接下来，我们将学习如何创建 Go 文件。\n\n为了不完全从零开始，Texio Instronics 的一位热心同事向我们发送了一些 Go 代码，实现了计算器的部分功能，并带有一个测试。在本节我们将这些代码添加到项目文件夹中。\n\
  \n首先，使用你的代码编辑器在 `calculator` 文件夹中创建一个名为 `calculator.go` 的文件。将以下代码粘贴进去：\n\n```go\n\
  ```([Listing 1.1](https://github.com/bitfield/ftl-code/blob/main/1.1/calculator.go))\n\
