  \n祝阅读愉快！\n\n# 1. 包\n\n> *人们认为计算机科学是天才的艺术，但实际情况恰恰相反，只是许多人在相互构建的基础上进行工作，就像砌墙一样。*\n\
  \n>\n\n—唐纳德·库斯\n\n![](img/file20.png)\n\n编写编程书籍有很多方法，但我最喜欢的是 Brian Kernighan 和 Dennis\
  \ Ritchie 在 1978 年的经典著作《C 语言程序》（以作者首字母命名为“K&R”）中采用的方法：\n\n> 学习新编程语言的唯一方法是用该语言编写程序。对于所有语言来说，第一个程序都是一样的：打印“Hello,\
  \ world”这两个词。\n\n为什么要费力做这种琐事呢？他们解释道：\n\n> 这是一个基础障碍；要跨越它，你必须能够在某处创建程序文本、成功编译、加载、运行，并找到你的输出去哪里了。掌握了这些机械细节后，其他事情都会变得相对简单。\n\
  \n\n\n现在，这本书是为具有一定经验的 Go 程序员准备的，因此我假设你已经能够用 Go 编写一个“Hello, world”程序、编译它、运行它等等。（如果不会，我建议你先阅读同一位作者的\
  \ [Go 语言入门](https://bitfieldconsulting.com/books/love)。）\n\n假设你对 Go 语言至少有一点经验，那么这本书将侧重于如何*使用*它来做些什么。换句话说，我们如何用\
  \ Go 构建可靠、易用且工程化良好的软件？\n\n这将涉及一些对你来说可能是新颖的想法、技术和流程。当你尝试学习新事物时，从你已经理解得相当好的东西开始（比如一个“Hello,\
  \ World”程序）是有意义的。\n\n所以，让我们从一个简单且（希望）对你来说熟悉的 Go 版“Hello to world”程序开始，并在此基础上进行开发。\n\
  \n## Hello, world\n\n```go\n//\n```\n```\n\n([Listing 1.1](https://github.com/bitfield/tpg-tools/blob/main/1.1/main.go))\n\
  \n列表 1.1 中的所有内容对经验丰富的 Gopher 来说都应该是熟悉的。我们声明了 `main` 包，它对 Go 编译器有特殊含义：指示它构建一个可执行的二进制文件。\n\
  \n我们还声明了特殊函数 `main`，它将是二进制文件的入口。当运行二进制文件时，`main` 会被调用以启动程序。\n\n`main` 做了什么？它调用了标准库函数\
  \ `fmt.Println`，该函数将字符串打印到程序的标准输出。\n\n这个源文件的命名并不重要，因为 Go 只查看 `package` 声明；不过按照惯例，包\
  \ `main` 中的代码命名为 `main.go`。\n\n让我们运行它：\n\n`go run main.go`\n\n```\nHello, world\n\
  ```\n\n这没问题：程序编译并运行，且打印了预期的消息。但我们能做得更好吗？这个程序有什么问题吗（如果有的话）？\n\n## 写包，而不是程序\n\n事实上，它没有任何问题：许多程序的设计就是为了直接从命令行运行，执行某些任务，然后退出。这样的程序通常被称为*工具*。\n\
  \n可能是计算机领域中除编程语言本身最重要的发明之一，就是可导入的*包*（package）的概念：一个可重用的软件单元，可以包含许多不同的程序中，通常用于执行某些特定任务。\n\
  \n如果没有包，我们不得不一直向计算机说明我们想做的每一个细节。事实上，如果没有包，Go 标准库中的包将很难管理。例如，每当我们想写一个 HTTP 服务器时，都必须自己实现\
  \ HTTP 协议，这可非易事。\n\nGo 在创建和使用包方面提供了极佳的支持。几乎每个存在的 Go 项目本身就是一个包（或者是一个相关包的库，如标准库），可以被其他程序导入。这对于程序员来说是一个巨大的力量倍增器：无论你想做什么，可能已经写好了一个包，可以几乎完全实现你的需求。\n\
  \n在很多情况下，创建一个特定程序所需要做的就是弄清楚如何我们将所需的各种包组合在一起，工作就完成了。然后我们可以让*我们的*程序也成为一个包，反过来供其他程序员使用。\n\
  \n由此推导出，你程序中的任何非本质代码都不应该放在 `main` 包中；它们应该放在某个*可导入*的包中。你所需要的只是导入那个包并在你的 `main` 函数中调用它。因为你导入了它，其他人也可以导入它并在他们自己的程序中使用它，而如果你把代码放在\
  \ `main` 包中，他们就做不到。\n\n避免将代码放在 `main` 中的另一个原因是它是很难测试的，原因相同：你无法导入它。\n\n\n\n\n就像大多数禅语一样，这听起来（而且确实）很荒谬，但它旨在引导我们发现某些有意义的东西。如果我们通常在调用\
  \ API 时才发现它是错的，那么让我们*从调用它开始*，这样可以节省掉整个被浪费的设计周期。我们将编写出合理、易读且实用的调用代码，然后再去实现让其运行的所有必要工作。\n\
  \n让我们假设 `engine` 包已经存在了，然后开始使用它。例如，让我们尝试写一个测试。我们应该写些什么呢？\n\n## 第一个测试\n\n在 TDD（测试驱动开发）中，需要记住的一个伟大原则是：\n\
  \n> *测试行为，而不是测试函数。*\n\n由于我们实际上还没有*任何*函数，所以这在某种程度上是强加给我们的。我们在这里说的“行为”是指什么呢？简单来说，就是程序在给定情况下所的操作。\n\
  \n在测试中，我们只对可以从外部观察到的行为感兴趣。包内部可能发生各种重要的事情，而我们并不知情，但当我们在这个语境下谈论行为时，指的是包的*用户*会看到的内容。\n\
  \n最终程序需要具备什么行为？它需要在终端打印出“Hello, world”。很好。让我们尝试为这个行为写一个测试。\n\n**目标：** 为打印“Hello,\
  \ world”的程序编写一个测试。这可能比看起来要难。\n\n我们应该把这个测试放在哪里呢？嗯，它需要放在以 `_test.go` 结尾的文件中，而且它将测试一个包，我们先猜这个包的名字可能是\
  \ `hello`。所以，让我们把文件命名为 `hello_test.go` 并从这里开始。\n\n这是第一次尝试：\n\n```\n\n```\n\n让我们逐行拆解一下这段代码。由于每个\
  \ Go 文件都以 `package` 句开头，而且我们正在执行的逻辑表明 `hello_test` 是一个很好的名字。\n\n我们需要导入标准库 `testing`\
  \ 包来编写测试，我们还需要我们的引擎包 `hello`。\n\n测试本身有一个名称，如果我们选择得当，它这个名称可以传达有用的信息。将每个测试函数按照它所测试的行为来命名是一个好主意。你不需要使用像\
  \ `Should` 或 `Must` 这样的词；这些是隐含的。只需说明该函数在正常运行时*执行了*什么即可。\n\n正如你可能知道的，每个 Go 测试函数都接受一个参数，惯例命名为\
  \ `t`，它是指向 `testing.T` 结构体的指针。这个 `t` 值包含了测试在执行期间的状态，我们使用它的方法来控制测试的结果（例如，调用 `t.Error`\
  \ 使测试失败）。\n\n如果你不熟悉 Go 测试，我建议你阅读 [For the Love of Go](https://bitfieldconsulting.com/books/love)，它将为你提供使用后续内容所需的背景知识。\n\
  \n## 并行测试\n\n任何测试的第一行都应该是：\n\n```\n\n```\n\n这标志着该测试可以与其他测试并发运行，这是一个好主意。由于我们几乎肯定有多个\
  \ CPU 可用，同时运行多个测试会更快。\n\n编写并行测试还有另一个优势。尽管我们的包本身可能没有使用并发，但*用户*完全可能会并发调用它。在编写包时，很容易忽略某些竞态条件或全局共享状态，因此并行测试是用来对代码进行“实战检验”的一种方式，以确保它是并发安全的。\n\
  \n如果我们不意中在某处修改了某些共享状态，并行运行所有测试将让我们有很大机会发现这个问题，特别是当我们使用 `go test -race` 运行测试以启用竞态检测时。\n\
  \n> *包中的代码应该始终是并发调用安全的。并行测试有助于确保这一点。*\n\n偶尔会有充分的理由说明某些测试无法与其他测试并行运行，但并不常见。在这种情况下，你可以省略对\
  \ `t.Parallel()` 的调用，该测试将独立运行。\n\n## 第一个难题：命名命名\n\n为了编写这个测试，我们需要调用该函数，而为了做到这一点，我们需要决定它的名字。正如我确定你已经知道的，这通常很棘手。\n\
  \n我们知道函数将位于 `hello` 包中。什么名字才合理呢？我们直觉上可能想把它命名为 `Hello`，但由于我们是从包外部调用它，我们将它引用为 `hello.Hello`，这是一种词语重复（stutter）。既然包名\
  \ `hello` 已经告诉我们它是关于打问候的，我们就不需要在在函数名中重复这个词。\n\n由于它的工作是打印消息，也许 `Print` 就可以了。加上包前缀后，它将被引用为\
  \ `hello.Print`，这似乎并不合理。我们看看情况如何。\n\n此时，我们还可以询问 `Print` 函数是否需要接受任何参数。嗯，脑海中没出现什么，所以让我们进入下一个问题：它应该返回任何结果吗？\n\
  \n再次，函数似乎没有任何显而易见的返回值，所以假设它不返回。那么，假设我们已经成功调用了函数，我们可以问：在什么情况下测试应该失败？\n\n## 静默通过但大声失败的测试\n\
  \n但在这里我们遇到了一个问题：似乎*没有*任何问题！我们想要的行为是函数向终端打印消息，但*测试*如何能验证这一点呢？我们无法在 Go 程序内部访问用户的终端。\n\
  \n 还有另一个问题：运行 `go test` 不应该导致任何输出，除非测试失败。这是命令行工具的一个很好的通用设计原则，这有时被称为“沉默规则”：\n\n>\
  \ *当程序没有意外、有趣或有用的话时，它应该保持沉默。*\n\n> ——[`www.linfo.org/rule_silence.html`](http://www.linfo.org/rule_silence.html)\n\
  \n但如果假设 `Print` 函数执行了它的工作，它就会打印一些东西！我们如何解决这个问题？当你这样提出问题时，答案并不难找。与其让 `Print` 写入终端，不如给它其他写入目标。\n\
  \n## 伪造终端\n\n在语境中，我们所谓的“终端”到底指的是什么？我们指的是 `os.Stdout`。所以现在我们可以向 `Print` 函数传递一个东西，它在实际程序中将*是*\
  \ `os.Stdout`，但在测试中可以是其他的。是什么呢？\n\n我们可以使用 `os.File`，它是 `os.Stdout` 的实际类型，但让我们想得通用一点。我们真正关心的是可以对其*写入*，这个想法由标准库接口\
  \ `io.Writer` 表达。所以，让我们让 `Print` 的参数变为 `io.Writer`。\n\n很好。但在测试中我们应该使用什么 `io.Writer`\
  \ 的具体类型呢？我们想要一个不会在终端上打印任何内容的类型，并且最好可以通过程序进行检查，以查看预期消息是否已写入。\n\n`*bytes.Buffer` 是此目的的理想选择，所以让我们创建一个它，并将其传递给\
  \ `Print` 函数。这是修改后的测试：\n\n```\n\n```\n\n([列表 1.2](https://github.com/bitfield/tpg-tools/blob/main/1.2/hello_test.go))\n\
  \n如你所见，`Print` 函数现在接受一个参数：要写入的写入器。然而，这为名称带来了一个问题：`Print` 暗示会打印你给它的任何参数。但我们给出的参数不是要打印的内容：它是被打印的*目标*。所以让我们把函数重命名为\
  \ `PrintTo`，就像“打印到……这里！”\n\n\n\n\n测试的名称也需要更改，因为现在要求的行为不再是“打印到终端”，而是“打印到写入器（writer）”。这是一个非常符合\
  \ Go 风格的 API：我们不再局限于某个具体类型，而是使用接口（`io.Writer`）使我们的代码更加灵活且广泛适用。无论如何，这种变化都是值得的，但有趣的是，我们仅仅通过尝试测试该函数，就在某种程度上被迫使做出了这种改变。\n\
  \n在构建包的过程中，随着我们执行 TDD 流程，应该预期会这样多次改变主意。这并不意味着我们做错了任何事：事实上，我们所做的一切都是正确的。我们从对所需行为的分析开始逐步进行，并通过使用它来实现具体功能来演进我们的\
  \ API 设计，而不是在抽象中对其进行推演。\n\n现在我们有了可以实际测试的东西：之后我们可以查看 `fakeTerminal` 检查是否包含了预期的消息。我们定义了一个包含该消息的变量\
  \ `want`，将缓冲区的内容读入名为 `got` 的变量中，然后比较两者。\n\n## 开始的结束\n\n反思在编写测试过程中发生的事情是有意义的，因为我们完成了许多非常有用的设计工作：\n\
  \n* 我们决定了引擎包（engine package）的名字\n* 我们决定了入口函数（entrypoint function）的名字\n* 我们用文字记录了它预期的行为\n\
  * 我们注入了一个 `io.Writer` 以使包变得可测试，并防止不必要的终端输出\n\n这一切都是在我们编写第一行系统代码之前完成的。事实上，这完全合逻辑，因为如果我们一开始就开始写代码，那么在进行测试时最终将不可避免地不得不修改它。我们可能会把函数命名为\
  \ `Hello`，这在包内部是合理的，但在包外部则不然。我们可能会直接使用 `fmt.Println` 打印到终端，这在尝试测试它之前看起来是明智的。\n\n\
  这就是测试驱动开发的秘密法宝：通过先写测试（假装该函数已经存在），我们可以预先解决许多设计问题，并且还避免了编写出不可测试函数的陷阱。\n\n当然，我们最后还获得了一个测试，这太棒了，我们永远不应该低估拥有测试的价值（尝试在没有测试的情况下在一个非复杂的代码库上工作吧）。虽然大多数人都认为测试是必要的，但如果不是先编写测试，那么它们往往根本不会被编写。之后添加测试是非常困难的。如果没有重大的重构，甚至可能是不可能，而谁又想在没有测试安全网的情况下重构代码呢？\n\
  \n## 结语\n\n* 当我们尝试学习新的处理方式时，最好从我们已经熟悉的地方开始。\n* 包是力量倍增器，因此我们应该始终寻求编写一个可以在许多不同程序使用的包，而不仅仅是一个。\n\
  * 编写更好代码的一种良好方法是采用这种心态：我们在为数百万用户编写程序，而不仅仅是为了自己。\n* 既然没有人可以导入或测试你的 `main` 包，因此所有非复杂的行为都应该实现在可导入的包中。\n\
  * 一个 Go 程序可能包含许多包，但通常有一个核心引擎包提供了用户关心的主要功能。\n* 设计良好的包 API 的最佳方法——略微违反直觉——是从使用它开始，例如在测试中使用。\n\
  * 测试的重点应该是行为，而不是函数，这对于命令行工具尤为相关。\n* 如果你选择在其中放置信息，测试函数的名称可以包含有用信息。\n* 并行测试不仅更快，而且有助于发现潜在的并发漏洞，即使该包没有使用并发。\n\
  * 输出输出的函数应该接收一个 `io.Writer` 进行打印，这样我们可以在运行测试时避免噪音，并捕获输出进行检查。\n* 测试根本上是比较 `want`\
  \ 和 `got`，无论这在情况下意味着什么，因此这样编写测试有助于人们理解你的测试在寻找什么。\n* 先测试后设计包看起来很难，甚至是浪费时间，但它通过消除大量的重复工作让我们更快地获得良好的设计。\n\
  * 拥有测试也是很好的。\n\n## 进一步探索\n\n如果你急于阅读更多内容，请尽管进入下一章。如果你想进一步探索这些想法，我有一些小型项目建议，将让你有机会在\
  \ Go 中练习 TDD 原则。\n\n1. 如果你之前写过所有内容都在 `package main` 中的 Go 程序，尝试更新该程序以使用引擎包。\n  \
  \ 为程序程序的每个重要行为编写测试，并尝试组织包代码，使 `func main` 减少到极致。\n\n2. 不要写简单的打印“Hello, world”的程序，尝试写一个询问用户姓名然后打印“Hello,\
  \ [NAME]”的程序。\n   它的包 API 会长什么样？你会如何测试它？它的 `main` 函数又长什么样？\n\n3. 尝试写一个按以下格式打印当前时间的程序：\"\
  It's X minutes past Y\"。\n   假设你有一个执行此操作的函数，当你无法预知具体会打印什么时间时，该如何测试它？\n   你的测试在通过时不应产生任何输出（例如，当运行\
  \ `go test` 时，不能将时间打印到用户的终端）。\n\n"
