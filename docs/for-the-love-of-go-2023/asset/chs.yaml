  \n我们不需要因为结果被命名了就在函数中做任何特殊处理；我们继续像返回其他其他结果一样返回它们：\n\n```\n```\n\n但有一个方便的副作用；结果参数现在可以在函数内部可用供我们引用，就像它们是输入参数或局部变量一样。因此，我们可以给它们赋值，例如：\n\
  \n```\n```\n\n## 裸返回被认为是有害的\n\n[Go 规范](https://golang.org/ref/spec) 实际上允许我们在这种情况下省略\
  \ `return` 语句中的名称，这将隐式地返回 `latitude` 和 `longitude` 的当前值。但这种做法通常被推荐的。\n\n\n\n那么我们究竟该如何编写变长函数（variadic\
  \ function）呢？例如，假设我们想扩展之前的计算器程序，让它不仅仅是加两个数字，而是可以加任意数量的数字。\n\n我们将这个函数命名为 `AddMany`。它看起来会什么样？这里是函数声明的开头部分：\n\
  \n```\n\n```\n\n```\n\n```\n\n注意，我们只声明了一个参数，但它的类型很奇怪。它是 `...float64`。这意味着什么呢？\n\n\
  `...` 表示该函数可以接受零、一个、两个、或者实际上任意数量的 `float64` 参数。好的，没问题。但我们如何在函数内部实际引用这些参数的值呢？它们没有像\
  \ `a` 和 `b` 那样的名称：我们拥有的只有一个参数 `inputs`。\n\n嗯，在函数体内，`inputs` 的作用就像一个切片（slice）。例如，我们可以写一个\
  \ `for ... range` 语句来遍历 `inputs` 的每个元素：\n\n```\n\n```\n\n```\n\n```\n\n看看你不能完成剩余的部分。使用这个思路来实现\
  \ `AddMany`（当然，要带上合适的测试）。然后同样扩展你的其他函数 `Subtract`、`Multiply` 和 `Divide` 使它们也变成变长的。\n\
  \n例如，调用 `DivideMany(12, 4, 3)` 应该将 12 除以 4，再将结果除以 3，然后返回该结果。调用带有十个输入的 `MultiplyMany`\
  \ 应该返回它们所有数字相乘的结果。\n\n一旦你完成了，或者如果你需要一些提示，请查看我在 [Listing 8.3](https://github.com/bitfield/ftl-code/tree/main/8.3)\
  \ 中的建议解决方案。\n\n## 要点总结\n\n*   要声明一个函数，我们从 `func` 关键字开始，后面跟着函数名、参数列表和结果列表。\n\n* \
  \  参数列表提供了函数接收的每个参数的名称和类型。\n\n*   同样，结果列表提供了函数返回的结果值的类型（以及可选的名称），如果有结果的话。\n\n* \
  \  其之后是函数体，一组包含在大括号内的语句列表。\n\n*   仅仅声明一个函数实际上什么都不够做，除了通知 Go 它的存在之外：为了执行函数的代码，我们需要调用它。\n\
  \n*   函数调用由函数名组成，后面跟着括号中的参数列表（如果函数不接受参数，则括号为空）。\n\n*   我们可以将函数调用返回的结果（如果有的话）作为赋值的一部分。\n\
  \n*   在函数体内，我们可以使用 `return` 语句提前退出函数；如果函数返回结果，我们必须在 `return` 后面给出一个列表，每个值对应一个已声明的结果。\n\
  \n*   函数本身在 Go 中是值，因此我们可以将它们赋值给变量，或者将它们作为参数传递给其他函数，甚至作为结果返回。\n\n*   当把函数当作值使用时，我们并不非要给它命名；相反，我们可以写一个函数字面量（function\
  \ literal）。\n\n*   函数字面量可以“看到”它定义所在闭层函数中的所有变量，从而使其成为这些变量的闭包（closure）。\n\n*   这是非常强大的，因为我们可以创建一个稍后执行的闭包，但在这种情况下我们需要注意被包含的变量在此期间被改变——例如，在循环中。\n\
  \n*   某些资源无法被 Go 垃圾回收器自动清理的，例如文件句柄，它们需要通过调用 `Close` 来显式关闭。\n\n*   我们可以尝试记住在函数的任何退出点之前显式地清理这些资源，但更好的方法是使用\
  \ `defer`。\n\n*   `defer` 关键字让我们推迟某些代码块的执行，直到当前函数退出：例如，清理资源。\n\n*   如果我们通过使用多个 `defer`\
  \ 语句来堆叠 defer，那么延迟的代码将在退出时按反序运行：最后一个被延迟的内容是第一个运行的。\n\n*   你可以为函数的结果参数命名，主要...\n\n\
  \n\n当执行到达（如果到达）`main` 的末尾时，程序就会停止。简单吧！当然，过程中可能会发生很多有趣的事情，但这就是你 Go 程序生命周期的基本形态。\n\
  \n## `init` 函数\n\n事实上，`main` 并不总是第一个运行的函数。如果存在一个名为 `init` 的函数，它将首先运行。如果你的 `main`\
  \ 包导入了其他包，而*它们*拥有 `init` 函数，那么它们也会在你的 `main` 函数启动之前被全部运行。\n\n我不建议你使用 `init`。虽然在程序启动之前设置某些内容，或者在每当某个包被导入时自动运行代码可能是很有用的，但\
  \ `init` 具有很强的“魔力”且不那么直观。你可能甚至不知道某个包是否有一个 `init` 函数，除非你主动寻找它，这使得追踪控制流变得更加困难。\n\n\
  而且，正如你已经在本书中中学到的，让程序的控制流尽可能尽可能简单、直而易见是一个好主意。如果你阅读他人的程序（我建议你这样做），你会发现他们并不总是这么做的。\n\
  \n## `init` 的替代方案\n\n幸运的是，我们永远不需要 `init`。有更好的方法可以实现相同的结果。最明显的方法是在 `main` 的开始直接执行任何你需要做的事情！\n\
  \n不过，在导入的包中（也就是说任何名称不为 `main` 的包），你无法控制先调用哪个函数。所以，如果你需要在任何其他工作运行之前初始化某些数据结构，那么其中一种方法是使用\
  \ `var` 语句。\n\n虽然几乎所有的 Go 代码都在函数内部（正如你在本书第一章中学到的），但我们允许在函数外部（包级别）放置 `var` 语句。由于\
  \ `var` 语句不仅可以声明变量还可以给它们赋值（包括从函数调用返回的值），你可以利用这一点完成初始化。\n\n例如：\n\n```\n```\n\n这假设你已经在该包的某处定义了\
  \ `initialiseThing` 函数，但这没关系。重点是，你可以确保该函数在包中的任何其他函数之前运行，而不需要依赖名为 `init` 的函数的魔力行为。这只是纯粹的、每个人都能读懂理解的\
  \ Go 代码。\n\n## 构建可执行文件\n\n那么，让我们写一个包含 `main` 包和 `main` 函数的可执行程序吧。创建一个名为 `hello`\
  \ 的新文件夹（确保它不是你其他任何 Go 项目的子文件夹）。在该文件夹中添加一个名为 `main.go` 的文件（就像任何其他包一样，按照惯例但并非必须，将文件命名为与其实现的包相同的名称）。\n\
  \n在文件中添加以下内容：\n\n```\n```\n\n你现在知道，如果我们想生成一个可执行文件，`package main` 声明是必须的。我们还需要一个\
  \ `main` 函数，否则可执行文件将什么都不做。\n\n正如你可能所知道的，你可以通过输入 `go run main.go` 直接从命令行运行此程序。这对于测试或实验很有用，但这一次我们感兴趣生成一个二进制可执行文件。\n\
  \n还记得本书前面我们如何使用 `go build` 命令为我们的计算器程序构建二进制文件吗？让我们在这个程序上也也试一试。在 `hello` 文件夹内运行以下命令：\n\
  \n```\ngo build\n```\n\n## 可执行二进制文件\n\n如果没有错误，该命令不会产生任何输出，但你会发现你的 `main.go` 旁边创建了一个新文件，名为\
  \ `hello`。\n\n让我们检查一下它是什么类型的文件：\n\n`file hello`\n\n```\nhello: Mach-O 64-bit executable\
  \ x86_64\n```\n\n你可能会根据你的操作系统或 CPU 架构看到不同的输出，但重点在于：Go 编译器仅以你的系统所需的格式生成了一个可执行文件。\n\
  \n要运行它，直接使用程序名称本身作为命令：\n\n`./hello`\n\n```\nHello, world!\n```\n\n成功了！这可能不是你第一次构建并运行\
  \ Go 程序，但现在你确切知道发生了什么，以及为什么。操作系统加载了你的二进制文件 `hello`，并从代表 `main` 函数开头的机器码指令开始执行它。控制流一直进行到该函数的末尾，然后程序退出。\n\
  \n拥有这样一个二进制文件的好处是，你可以将其复制到任何其他计算机上并在那里运行，没有任何其他依赖（前提是具有相同的操作系统和 CPU 架构）。那台计算机不需要安装\
  \ Go 工具，事实上，不需要任何其他东西。你可以在 Docker 容器、Kubernetes 或任何其他方式运行这个二进制文件。\n\n## 交叉编译\n\n\
  你可能会奇怪如何为其他系统构建可执行文件？幸运的是，答案是不。你可以通过设置 `GOOS` 和 `GOARCH` 变量，为你喜欢的任何系统构建可执行文件。让我们尝试一个例子：\n\
  \n```\nGOOS=windows go build\n```\n\n这产生了一个名为 `hello.exe` 的文件，这就是你在 Windows 上预期的。\n\
  \n`file hello.exe`\n\n```\nhello.exe: PE32+ executable (console) x86-64\n```\n\n\
  Linux 呢？\n\n`GOOS=linux GOARCH=arm go build`\n\n`file hello`\n\n```\nhello: ELF\
  \ 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), statically linked\n```\n\n\
  非常好！你可以运行 `go tool list` 获取所有支持的操作系统和架构组合。\n\n## 退出\n\n正如你在本章前面看到的，Go 程序一旦到达 `main`\
  \ 后会自动退出（即停止执行并将控制权交还操作系统）。但如果你在此之前退出呢？或者如果想向操作系统信号发生了某种错误呢？\n\nGo 提供了 `os.Exit`\
  \ 函数专门为此。你需要向它传递一个参数，退出码（exit code）或退出状态（exit status）。这只是一个数字，按照惯，零退出状态表示一切正常，而而非零值则意味着发生了错误。\n\
  \n这里有一个例子：\n\n```\n\n```\n\n如果你运行此程序（无论是通过 `go run` 直接运行，还是通过 `go build` 构建可执行文件后运行），你会看到\
  \ shell 报告：\n\n```\nexit status 1\n```\n\n你也可以在任何地方通过 `log.Fatal` 并传入消息，或者调用内置的\
  \ `panic` 函数来退出程序。这两者都会以非零退出状态立即终止程序（在 `panic` 的情况下，还有关于代码中触发 panic 的信息）。\n\n`log.Fatal`\
  \ 或 `panic` 的问题在于，如果它们深埋在代码中，读者很难看出程序会在何时以及何地退出。因此，一个良好的准则是只在 `main` 函数中退出程序。它带你来到这个世界（如果你愿意这么说的话），所以它应该是送你离开的人。\n\
  \n以此为题，我们该时候送自己离开了。一起工作和学习 Go 一直非常愉快，我希望你也是一样。但在最后一章中，我们只需简要谈谈我们*应该*如何编写 Go 程序：理想情况下，带着善良、简单和谦逊，并且不强求。\n\
  \n\n\n\n*   Go 程序的 `compiled` 形式是一种特殊文件，被称为 `executable binary`，它包含了针对特定 CPU 类型和操作系统的机器码。\n\
  *   要生成可执行二进制文件，我们的程序需要包含一个 `main` 包，并带有一个名为 `main` 的特殊函数，该函数是程序运行时的入口。\n*   尽管如果存在名为\
  \ `init` 的函数，它会在 `main` 之前自动执行，也许是为了进行某些初始化工作。\n*   然而，使用 `init` 被广泛认为是一种糟糕的风格，因为我们可以使用普通的\
  \ `var` 语句以一种不那么“魔法化”的方式来初始化变量。\n*   `go build` 命令将带有 `main` 包的 Go 程序编译成我们可以运行的可执行二进制文件（或分发给他人以便他们运行）。\n\
  *   方便的是，通过使用 `GOOS` 和 `GOARCH` 环境变量，我们可以为任何我们 CPU 架构或操作系统构建可执行文件，而不仅仅是当前正在运行 `go\
  \ build` 的系统。\n*   虽然程序在到达 `main` 结束时会自动退出，但也可以通过调用 `os.Exit` 函数在任何其他时间退出（例如，设置退出状态码）。\n\
  *   其他退出程序的方法（不推荐）是调用 `log.Fatal` 或 `panic`；但通常情况下，请不要使用 panic。\n\n# 15. Go 之道 (Tao)\n\
  \n![](img/file15.png)\n\n> *你可以让水牛去任何地方，只要它们想去那里。*  \n\n> —Jerry Weinberg, [《咨询的秘密》](https://amzn.to/3uzcGE0)\n\
  \n*道*（Tao）指的是事物的内在本质或自然趋势。例如，水倾向于向下流：这就是它的“道”。你可以筑坝拦截、引导它、抽水，或以其他方式干扰它，但无论你如何努力，它最终可能还是回到它原本要去的地方。\n\
  \n遵循“道”作为一种与世界互动的方式，是对事物的自然趋势保持敏感，而不是浪费能量去斗争，而是顺应它们：*顺着*纹理工作，而不是逆势而为。\n\n延续水的类比，一个糟糕的游泳者拼命挣扎，发出巨大的噪音和混乱，但实际进展甚微。相比之下，道者在冲浪。\n\
  \n那么，Go 之道是什么？如果我们以一种敏感、智能的方式处理 Go 软件开发，遵循语言和问题的自然轮廓，而不是试图强行扫平障碍，那会是什么样子的？让我们尝试建立几条通用原则。\n\
  \n## 慈悲 (Kindness)\n\n> *此我有三件宝物；善加它们！第一是慈悲；第二是简单；第三是谦卑。*  \n\n> —[《道德经》](https://amzn.to/3PFTR9D)\n\
  \n带着慈悲和同情心编写程序意味着什么？这意味着我们是为人类编写代码，而不是为计算机。这些人类是会犯错的、没耐心的、缺乏经验的、注意力分散的，在各方面都是不完美的。通过在\
  \ Go 代码的设计和细节上花一些心思，我们可以让他们的生活（和工作）变得容易得多。\n\n我们可以通过给包起描述性的名称、使其易于导入、编写良好的文档以及分配慷慨的开源许可证来对用户保持慈悲。我们可以设计深层的抽象，让用户利用微小、简单的\
  \ API 来访问强大且实用的行为。\n\n我们可以通过让程序易于安装和更新、要求最少的配置和依赖、捕获最常见的用法错误和运行时错误，并向用户提供关于问题所在及修复方法的有用、准确且友的信息，对运行我们程序的人保持慈悲。\n\
  \n我们可以通过尽可能清晰、简单和明确来对必须阅读我们代码的人保持慈悲。我们可以为类型和函数赋予有意义的名称，使其在上下文中合理，并让用户通过直观、逻辑性的组合使用我们的抽象创建自己的程序。我们可以通过遵循约定、实现标准接口以及用显而易见的方法做显而易见的事，来消除认知障碍。\n\
  \n最后，我们可以通过编写出色的测试（正如你在书中学到的一样）来对自己保持慈悲。测试让我们在未来易于理解、修复和改进我们的程序。没有了它们，情况可能会迅速恶化。\n\
  \n> *一旦代码库变成意大利面条代码，就几乎无法修复。*  \n\n> —John Ousterhout, [《软件设计哲学》](https://amzn.to/3NfCg6E)\n\
  \n另一种对未来的自我和继任者保持善良的方法是对程序的架构和整体设计进行微小、持续的改进。良好的程序生命周期很长（有些坏程序也是如此），许多微小改变的累积效应会导致代码库变得混乱、复杂且拙劣。我们可以在每次因任务访问代码库时多花一点时间进行重构和清理，从而帮助避免这种情况。由于我们很少有机会从头重写系统，长期投入少量时间进行微改进是保持其健康的唯一可行方法。\n\
  \n## 简单 (Simplicity)\n\n“道”教给我们的第二种美德是节约、谦虚、简单：以少胜多，消除杂乱。Go 本身是一种节约的语言，语法和表面积最小。它并不尝试做所有事情或取悦所有人。\n\
  \n> *我们的生命被细节耗尽。简单，再简单！*  \n\n> —Henry David Thoreau, [《瓦登湖》](https://amzn.to/3aPAPyD)\n\
  \n我们也应该这样做，让我们的程序短小且聚焦、不杂乱，良好做好一件。深层抽象为强大的机制提供了简单的接口。我们不会让用户做大量的文书工作来获得这种权利。在任何我们可以为常见情况提供具有合理默认值的简单\
  \ API 的地方，我们就这样做。\n\n灵活性是好事，但我们不应该处理每一种情况，或为每个功能提供支持。可扩展性很棒，但我们不应该为了我们不需要的东西而牺牲简单的设计。事实上，一个简单的程序比复杂的程序更容易扩展。\n\
  \n## 谦卑 (Humility)\n\n第三件宝物是谦卑。像水一样，道者寻求低处，不奋斗、不竞争或试图给他人留下印象。Go 本身是谦卑且务实的：它没有某些其他语言的所有高科技特性和理论优势。事实上，它刻意留下了许多其他语言的卖点功能。它的设计师比起创建一个令人印象深刻的编程语言或在人气排行榜中领先，更感兴趣的是为人们一个简单的小工具，以最实用、直接的方式完成有用的工作。\n\
  \nGo 意识到我们容易犯错，它有许多方法保护我们免受错误影响。它负责分配内存、清理已完成的任务，并警告未使用的导入或变量。它是一种为那些知道自己无知并理解自己出错倾向的人设计的语言：换句话说，就是谦卑的人。\n\
  \n> *最危险的错误未能意识到我们自己犯错的倾向。*  \n\n> —Basil Liddell Hart, [《我们为什么不从历史中吸取教训？》](https://amzn.to/3S7NY6Z)\n\
  \n作为 Go 程序员，我们可以通过不试图表现太聪明而保持谦卑。我们写代码不是为了通过我们是优秀的程序员来打动所有人：相反，我们满足于做显而易见的事。我们清晰、直接地表达自己，而不需要将自己的个性强加于代码上。\n\
  \n当标准库可以解决问题时我们使用它，只有在它不能解决时才使用第三方包。如果某件事有事实标准包，我们就使用它：如果它对其他人来说足够，对我们来说也足够。\n\n\
  \n\n\n我们意识到自己并非全知，也无法做出非常准确的预测（尤其是关于未来），因此我们不应浪费时间和精力和去预先工程化那些可能永远需要的东西。我们不假设自己最了解\
  \ `other` 软件用户想如何与我们的软件配合使用，因此我们不会硬编码对它们的依赖。\n\n我们假设所编写的任何代码都会包含漏洞，因此我们编写了仔细的测试，试图诱发意外的行为或错误的结果。我们理解，不可避免地会有一些我们不知道或无法正确预测的重要事情，因此我们不会针对现状对代码进行过度优化，因为其中许多工作最终将付诸东流。\n\
  \n我们足够谦逊，会在要求他人检查之前先审查自己的 `own` 代码，因为如果我们自己都不愿意做，他们又为什么要去读呢？我们会花时间逐行检查，像新用户或开发者的视角那样去阅读，尝试在逻辑上遵循其论证。从哪里开始阅读清晰吗？程序是否在开头引入了关键类型或常量，并随后展示它们是如何使用的？事物的命名是否清晰准确地标识了它们的功能，还是在经过十几次重构后变得变得混乱且过时？程序是否恰齐自然地融入了它的结构中，还是在某些部分过度生长而让另一些部分显得异常空虚？\n\
  \n因为我们并不执着于自己的聪明和优雅，所以我们不需要将三四个不同的想法挤进单行代码中。相反，我们清晰、显而易见地一步步、逐句地以易于理解的形式阐述逻辑，让每一部分都恰好以读者预期的方式完成恰需要的事情。在无法做到的情况下，我们会费心向读者解释他们理解发生的情况所需要知道的知识。\n\
  \n因为我们知道自己不是天才，无法写出那种卓越到自解释其明的程序，因此我们在解释上花了心思。我们为代码配上了文档，不仅显示 `program` 做了什么，还展示如何使用它来实现\
  \ `users` 可能想完成的操作。我们包含了详细的用法示例，准确地展示了从零开始执行真实任务需要做什么、完成后用户应该预期看到什么，以及他们下一步应该做什么，并且我们会严格、定期地检查这些示例，以确保它们\
  \ `still work`。\n\n## 不为\n\n道的最终教诲是 `wúwéi`（“不为”）。这有时会被误解为懒惰、退缩或消极；事实恰恰相反。努力工作并不总是意味着工作得好。我们都认识那些长期忙碌的人，总是行冲撞撞、手忙脚乱、处于疯狂的活动中，但他们似乎从未真正取得过什么成就。而且，他们过得很痛苦，因为他们也知道这一点。\n\
  \n相反，当在别人看来我们似乎什么都没做时，我们往往能完成最好的工作：在美妙的一天沿着河边散步，或者坐在廊台上看着蜘蛛织网。如果我们足够聪明，能够停止那么努力地\
  \ `trying` 一分钟，正确的想法往往会立即跳入脑海。\n\n与其将每个问题都视为一个要进攻的敌人、要攀爬的山峰或要拆除的墙，我们可以使用“不为”原则（有时也称为“不\
  \ `forcing`”）。\n\n\n\n\n请参阅书末查看 *The Power of Go: Tools* 第一章的预览！\n\n## Go 语言的力量：测试\n\
