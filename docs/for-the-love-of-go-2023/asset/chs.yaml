  \ `sort.Slice` 示例中匿名函数字面量的体：\n\n```\n```\n```\n```\n\n它的逻辑是有道理的，但 `nums` 是从哪里来的？这个函数接收了名为\
  \ `i` 和 `j` 的参数，我们使用了它们，但我们并没有接收 `nums` 参数。这个变量存在于另一个函数中：调用 `sort.Slice` 的那个函数。那么我们的函数字面量为什么能“看到”这个变量呢？\n\
  \n嗯，我们的匿名函数定义在调用函数内部，它可以“看到”该函数作用域内的所有变量，包括 `nums`。这被称为`闭包`（closure）。\n\n如果你想想，定义在包级别的普通函数也可以“看到”声明在包级别的变量，不是吗？这本质上是一样的。任何函数都可以访问其定义所在作用域内的可用变量，当它是一个函数字面量时，我们称之为对这些变量的“闭包”。在这个例子中，我们的函数字面量是\
  \ `nums` 变量的闭包。\n\n这起初可能有些晦涩，但对于像 `sort.Slice` 这样的操作是非常关重要的。如果 `less` 函数不是对待排序切片的闭包，它又该如何访问该切片呢？我们不能把它传递进去，因为\
  \ `sort.Slice` 函数参数的类型是固定的。\n\n\n\n\n如果我们是勤奋且自律的程序员（毫无疑问我们是这样的），我们只需要尝试记住在函数可能返回的每一个地方调用\
  \ `f.Close()`。但没有人是完美的，如果其他人对这个函数进行了修改，他们可能甚至不会意识到他们应该在退出前关闭 `f`。如果有多个资源需要清理，这可能还会导致大量的重复代码。\n\
  \n我们真正想要的是某种方式，来表述为：“当这个函数准备退出时，无论在何处或以何种方式，都确保 `f` 被关闭”。\n\n## `defer` 关键字\n\n\
  事实证明，Go 的 `defer` 关键字正是我们要寻找的。一个 `defer` 语句接收某个函数调用（例如 `f.Close()`）并将其推迟执行。\n\n\
  也就是说，它不会在*现在*调用该函数，而是将其“记住”以备后后用。当函数由于任何原因即将退出时，那个推迟的函数调用才会真正发生。\n\n在我们的文件示例中，它看起来是这样的：\n\
  \n```\n```\n```\n\n这里发生了什么？首先，我们尝试通过调用 `os.Open` 来获取 `f`。这可能会失败，在这种情况下，我们不需要担心关闭文件，因为我们无法打开它！所以在这种情况下我们返回一个错误。\n\
  \n但现在我们知道已经成功打开了 `f`，所以我们立即执行 `defer f.Close()`。这并没有关闭 `f`，但它“记住”了我们需要在退出时调用 `f.Close()`。\n\
  \n现在我们可以在函数的其余部分做任何想做的事，因为我们知道无论发生什么，`f` 都会被自动关闭，而我们不需要去担心它。\n\n## 多个 defer\n\n\
  这并不常见，但有时我们确实需要推迟多个一个函数调用。例如，也许我们打开了两个文件，并且我们想要分别推迟关闭每一个文件。\n\n这是没问题的，我们可以在函数中根据意愿使用任意次数的\
  \ `defer` 关键字，所有的推迟调用都会在函数退出时执行。值得知道的是，调用是按反序执行的：也就是说，最后推迟的最先运行。这有时被称为*栈式推迟*（stacking\
  \ defers）。\n\n```\n```\n\n```\n\n## 命名结果参数\n\n回想上一章，当我们声明函数的返回列表时，可以给这些结果命名，也可以不命名。（通常我们不需要）。那么，我们以及为什么要给它们命名呢？\n\
