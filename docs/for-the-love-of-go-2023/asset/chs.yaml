  \n```\n\n搞定了！我们现在有了一组良好的、易于扩展的类别以及一种验证它们的方法。\n\n## 核心要点\n\n- 尽管编译器会对对结构体字段的赋值强制执行类型检查，但并没有内置方法来*验证*我们赋值给它们的内容。\n\
  - 因此，如果我们想防止用户意外分配一个无效值（例如，负价格），我们需要提供一些*访问器*（accessor）方法，以便在赋值之前可以检查该值。\n- 这必须是一个指针方法，因为如果没有指针，任何分配给结构体字段的内容都无法持久化：它只是修改了结构体自身的本地副本，而该副本在方法返回时就会被丢弃。\n\
  - 验证性访问器方法有两种行为需要测试： “有效输入”行为和“无效输入”行为。\n- 即使有了验证性访问器方法，它实际上并不能阻止用户在导出的结构体字段上设置他们喜欢的任何值，从而完全绕过该方法。\n\
  - 因此，如果我们想确保结构体的某些字段*始终有效*，我们需要将这些字段设为*未导出*（unexported），并且仅通过访问器方法可用：在这种情况下，我们需要提供一个*获取*值的方法，以及一个设置值的方法。\n\
  - 然而，`cmp.Equal` 无法查看未导出的字段（包外的其他人也无法），因此我们可以传递选项 `cmpopts.IgnoreUnexported` 告诉它甚至不要尝试。\n\
  - 就像你可以通过未导出字段名来创建始终有效的字段一样，你也可以通过未导出结构体本身来创建*始终有效的结构体*。\n- 这意味着需要某种*构造*函数，因为用户无法创建结构体的字面量（他们需要使用它的名称，但他们是不被允许的）。\n\
  - 构造函数返回带有未导出名称的类型是可以的（事实上，这对于始终有效的结构体是至关重要的）：用户无法引用的是*名称*，而不是*值*。\n- 当你想将值限制在允许的集合中时，`bool`\
  \ 映射是一个很好的方法，因为你可以编写类似 `if validCategory[category]` 这样的代码，映射查找本身就能给你正确答案，而无需额外代码。\n\
  - 另一种防止用户错误的好方法是使用 `const` 关键字来定义一些用户可以引用的具名*常量*：如果他们拼写错了名称，或者引用了不存在的名称，编译器会捕获到。\n\
  - 一个很好的例子是 `net/http` 中定义的 HTTP 状态常量：在没有的情况下，整数字面量 `200` 的意义并不显而易见，你可能会出错，但 `http.StatusOK`\
  \ 是不言而喻的，如果你拼写错误，编译器会告诉你。\n- 通常，常量的值*是什么*并不重要，只要它们是区分的，在这种情况下我们可以使用整数常量和 `iota`\
  \ 来自动为它们分配值。\n\n# 11: 开场白\n\n![](img/file11.png)\n\n你在 Happy Fun Books 的项目做得非常棒！你现在有了一些编写实用\
  \ Go 程序的经验，所以让我们花一点时间来更详细地探索 Go 语言本身。这将帮助你更深入地理解已经编写的代码以及它是如何运行的。\n\n在接下来的几章中，我们将探索\
  \ Go 语法的一些特性，这些特性允许你定义程序的*控制流*：也就是说，程序是如何*执行*的。其中一些特性你已经熟悉了，但你会对它们有更多的了解。另一些是新的，你可能喜欢将它们整合到现有的程序中。\n\
  \n那么什么是控制流呢？你可以想象一个非常简单的程序，“控制”从程序的第一行按顺序“流”到最后一行。有些程序正是这样工作的，但大多数程序有更复杂的控制流。也许它们不是简单的序列，而是*重复*执行某次序列，或者根据某些条件执行不同的序列。\n\
  \n在讨论 Go 中更复杂的控制流类型之前，让我们从基础开始。\n\n## 语句\n\nGo 程序中控制流最基本的元素是*语句*（statement）。语句仅仅是让\
  \ Go 执行某些操作的指令。这是一个例子：\n\n```\n\n```\n得益于你在书店项目上的出色工作，我们有了一个名为 `Book` 的结构体类型来表示书，它有一个名为\
  \ `Title` 的字符串字段，用于存储书的标题。\n\n## 声明\n\n上面的示例是一个*赋值*语句：它将一个 `Book` 结构体的字面量值赋值给名为\
  \ `b` 的变量，该变量必须已经存在。像 `b` 这样的变量是如何产生的呢？通过*声明*（declaration）。例如：\n\n```\n\n```\n这引入了一个新变量\
  \ `b`，它可以持有 `Book` 值。声明在你的程序运行时并不会实际发生任何事情：相反，它要求 Go 编译器“请为某个特定类型的变量预留一些空间，我稍后将对其进行某些操作”。\n\
  \n从技术上讲声明不是语句，因为它在运行时不会产生任何影响。值得知道的是在 Go 中，我们几乎所有的代码都位于某些函数内部，函数外部不允许语句（在*包级别*）。函数外允许的唯一代码类型是声明，它是用的，正如我们将在本书后面看到的。\n\
  \n## 什么是赋值？\n\n赋值语句正如我们所看到的，是将某个值*赋值*给变量，但在实践中这意味着什么？你可以将其理解为给值取一个*名称*。例如，我们之前示例中的\
  \ `Book` 值在赋值语句之后，可以使用名称 `b` 来引用。从现在开始，每在表达式中使用名称 `b`，它都会被“翻译”为赋值给它的 `Book` 字面量值。\n\
  \n另一种思考变量的方式将其看作包含特定类型值的小盒子。赋值是将值放入盒子的行为。如果盒子之前有任何东西，它会被我们赋值的值所替换。如果你连续声明一个变量并给它赋值两个不同的值会发生什么？\n\
  \n```\n\n```\n这完全没问题，在两次赋值之后，`name` 变量拥有值 `\"Jo\"`；第二个值“覆盖”了第一个值。你可以根据需要对变量进行多次赋值，它将始终拥有你最近赋值给它的值。\n\
  \n## 短变量声明\n\n在 Go 中，想要声明变量并给它赋值的情况是非常常见的，以至于它实际上有一种特殊的语法形式来实现这一点：*短变量声明*。它看起来像这样：\n\
  \n```\n\n```\n\n\n\n注意这里使用的是 `:=` 而不是普通的 `=`。这在同一个语句中既`声明了 declares）了一个新变量 `b`，又为其`赋值了\
  \ assigns）了一个 `Book` 字面。你可以将冒号（`:`）理解为“这里有一个新变量：请假设我已经声明过它了”。\n\n由于我们没有显式地声明它的类型，Go\
  \ 是如何知道变量 `b` 应该是什么类型的呢？答案是：与我们赋值给它的值相同的类型！编译器可以从赋值语句右侧的值中`推断`(infer）出 `Book` 类型。\n\
  \n**目标**：编写一个 Go 程序，使用短变量声明来声明并初始化变量 `eggs` 值为 42。打印该变量的值，然后将新值 50 赋值给 `eggs` 并再次打印该变量，以显示它的值已经发生了变化。\n\
  \n## 分配多个值\n\n当你有多个赋值操作要执行时，Go 有一个非常棒的功能可以帮助你：`元组赋值`(tuple assignment)。一个`元组`(tuple）是一组对象的有序列表（例如“五倍”、“六倍”等）。\n\
  \n假设我们有三个变量 `a`、`b` 和 `c`，我们想分别为它们赋值值 `1`、`2` 和 `3`。当然，我们可以写三个赋值语句，但我们都是忙碌的人。能够在一个元组赋值中完成这项工作是非常棒的：\n\
  \n```\n\n```\n\n```\n\n最好将元组赋值留给分配一组`相关的`(related)值：不要仅仅将其用作避免为无关变量编写单独赋值语句的方法。通过使用元组赋值，你是在告诉读者：“这些都是同一种类型的东西，所以我不会通过逐个列出它们来消耗你的耐心：我会一次性给它们全部赋值”。\n\
  \n同样，保持赋值语句简短清晰也是一个好主意。如果你的元组赋值既长又复杂，会让你的代码变得难以阅读。如果一眼不能完全清楚哪个变量获取了什么值，那么请将你的赋值拆分为多个语句以保持清晰。\n\
  \n也许多次赋值最常见的用法是函数返回多个值时（我们将在稍后的章节中详细讨论函数）。例如，假设你有一个函数 `getPosition`，它以坐标对的形式返回你在地球上的当前位置：比方是纬度和经度。我们可以使用元组赋值语句将这两个值赋值给两个变量：\n\
  \n```\n\n```\n\n```\n\n如果你距离地球中心的距离也重要，那么你需要三个坐标：\n\n```\n\n```\n\n在 Go 中，还有其他方式可以给我们提供多个值。你可能记得前面的章节中的一个例子是\
  \ map 索引表达式：\n\n```\n\n```\n\n```\n\n## 空标识符\n\n在赋值语句中，我们真的需要`变量`(variable) 吗？答案是不需要；有一个特殊的标识符叫做`空标识符`(blank\
  \ identifier)，写作 `_`（“下划线”），我们可以向它赋值。\n\n我们为什么想要使用空标识符呢？它看起来并不特别有用，因为尽管我们可以把东西“放入”它中，但无法再次将它们取出来：\n\
  \n```\n\n```\n\n```\n\n嗯，有时候我们对 Go 给出的多个值中的一个或多个并不感兴趣。例如，如果我们只想查看某个给定的 key 是否在 map\
  \ 中，我们真的只需要 `ok` 值，而根本不会真正使用鸡蛋的价格。问题是，如果你从不引用一个变量，Go 就不会让你声明它：\n\n```\n\n```\n\n\
  ```\n\n你可能会想，也许可以把 `price` 忽略，只把 `ok` 放在赋值的左侧：\n\n```\n\n```\n\n```\n\n但 `this`\
  \ 的问题在于 Go 是按照左到右的顺序给变量赋值的：第一个变量将接收来自 map 索引表达式的第一个值，在这种情况下，这将是鸡蛋的价格。\n\n\n\n此函数的逻辑与之前的完全相同，但现在更易读了。主路径（happy\
  \ path）沿着左侧边缘直线向下延伸。只有当 `x` 出现问题时，才会偏离主路径，而这些问题会在缩进块内部处理，从而在视觉上将它们与预期的控制流隔离开。\n\n\
  在决定如何编写 `if` 语句时，有一个非常有用的规则：*让主路径左对齐*。这可以尽可能地减少缩进，并为读者提供一个清晰的视觉指南，告诉他们预期程序如何运行。\n\
  \n**目标：** 编写一个函数 `bigger`，接收两个 `int` 参数并返回其中较大的一个。\n\n## `else` 分支\n\n到为止，我们把控制流想象成类似于页面下方的一条公路，`if`\
  \ 语句创建了可能的分叉，通往从公路分出的小路，可能在稍后又与公路汇合。\n\n但有时公路本身需要分叉，在条件为真时执行一组操作，否则执行另一组操作。这就是 `else`\
  \ 关键字大上用场的地方。\n\n```\n```\n```\n\n例如，如果 `x` 是 12，我们将看到如下输出：\n\n```\nLet's see what\
  \ the sign of x is:\nx is positive\nWell, that clears that up!\n```\n\n控制流再次变得清晰易于遵循。如果条件\
  \ `x <= 0` 为真，则打印消息 `\"x is zero or negative\"`。否则，打印另一个消息。单条的 `if` 语句只是根据条件执行或不执行某些操作，而\
  \ `if ... else` 语句则是执行某件事*或*另一件事（但绝不会兼顾）。\n\n## 提前返回（Early return）\n\n事实上，`else`\
  \ 在 Go 中并不常用。为什么呢？嗯，它通常根本不需要，因为当某个 `if` 语句导致控制流偏离了主路径时，函数会立即返回：\n\n```\n```\n```\n\
  \n显而易见，如果函数执行到了这里，条件*必须*是假的，否则我们早就返回了。因此，当一个 `if` 块以 `return` 语句结束时，就不需要 `else`\
  \ 了。这种模式被称为*提前返回*（early return），它可以帮助你的函数变得更加简洁且易于读。\n\n## 条件表达式\n\n现在我们知道了 `if`\
  \ 语句如何使用条件表达式来做出影响程序控制流的决策，让我们仔细观察这些表达式。在 `if` 条件中允许哪些类型的表达式？\n\n你在这章中已经见过一个例子了：*比较*表达式，例如\
  \ `x <= 0`（如果 `x` 小于或等于 0，则为真）。同样地，我们还可以使用其他比较运算符：`==`（等于）、`!=`（不等于）、`>`（大于）、`<`（小于），以及它们对应的\
  \ `<=`（小于或等于）和 `>=`（大于或等于）。\n\n## 与、或、非\n\n我们并不局限于像 `x > 0` 和 `x%2 == 0` 这样简单的布尔表达式。我们可以使用*逻辑*运算符将它们组合在一起：相当于英语句子中的“and”（与）、“or”（或）和“not”（非）。\n\
  \n例如，为了表达 `x` 既是数又是偶数的条件，我们可以这样写：\n\n```\n```\n```\n\n`&&` 运算符意味着“与”。同样，如果我们希望条件在其中一个表达式为真*或*另一个表达式为真时成立，我们就使用\
  \ `||` 运算符来表示“或”：\n\n```\n```\n```\n\n注意，在英语中，“or”是有歧义的：它有时意味着“异或”（两种可能性选其一，但不同兼有），有时意味着“并或”（两种可能性之一或两者都有），取决于如何使用。\n\
  \n“你可以学习 Go 或 Python”这显然不是排斥性的：你可以学习两者（而且你应该这样做）。但“你可以早起冥想，或者你可以一直睡到中午”就是排斥性的：你不能两个都选，除非你精通星际穿越。\n\
  \n但在 Go 中，`||` 是没有歧义的：它是一个包含性的“或”，因此如果以下条件中*任何一个*为真，表达式 `a || b` 就为真：\n\n*   `a`\
  \ 为真\n*   `b` 为真\n*   `a` 和 `b` 均为真\n\n唯一为假的情况是 `a` 和 `b` 均为假。\n\n对于那些当某个表达式*不*为真时为真的条件，我们使用\
  \ `!`（非）运算符：\n\n```\n```\n```\n\n## `bool` 变量\n\n正如你可能记得，可以是真也可以是假的值被称为*布尔*值（boolean\
  \ values），表示它们的 Go 数据类型命名为 `bool`。\n\n我们可以在任何需要布尔值的地方使用预定义的常量 `true` 或 `false`，包括\
  \ `if` 条件中。然而，写 `if true ...` 是没有意义的，因为它的块始终会被执行，所以我们不妨省掉 `if true` 部分。同样，`if false\
  \ ...` 语句永远不会被执行，所以我们可以完全将它弃掉。\n\n不过，一个 `bool` 变量本身就是一个常见的条件表达式：\n\n```\n```\n```\n\
  \n**目标：** 编写一个函数 `xor`（“异或”），它接收两个 `bool` 参数，如果参数中恰好有一个为真则返回 `true`，否则返回 `false`。（为了清楚起见，如果两个参数都为真，该函数应该返回\
  \ `false`。）\n\n## 复合 `if` 语句\n\n复合 `if` 语句允许你执行一个短语句，然后根据其结果做出决策。这在 Go 中很常见，用于给变量赋值然后使用\
  \ `if` 语句，并且它将变量的作用范围限制在这个代码块内。\n\n```\n```\n```\n\n通过使用这种形式，你是在告诉读者 `ok` 仅在该 `if`\
  \ 块内部需要。事实上，变量的*作用域*规则意味着，在这种形式下，`ok`*不能*在块外使用。之后尝试访问它将会导致编译器错误：\n\n```\n```\n```\n\
  \n你经常会看到类似下面的代码，它调用某个函数然后根据其结果做出决策，使用了复合 `if` 语句：\n\n```\n```\n```\n\n这比将赋值写成简单语句然后紧跟一个\
  \ `if` 语句要更简洁，并且它将 `err` 的作用范围限制在这个块中。如果外层作用域中已经存在 `err` 变量，它将被*屏蔽*（shadowed）：也就是说，在\
  \ `if` 块内部有一个新的且不同的变量 `err`，名字恰好相同，但它的值将是 `doStuff()` 的返回值。但在块之后，“外部”的 `err` 变量保持原始值。\n\
  \n如果你觉得这听起来很困惑，你是正确的。最好避免这样屏蔽变量。*Go* 不会困惑，因为它有明确的作用域规则，但*我们*可能会困惑，因为仅仅看这些代码并不知道发生了什么。很容易写出一个\
  \ bug，即你以为自己更新了外层作用域中某个变量的值，实际上却屏蔽了它。\n\n同样，你应该避免让复合 `if` 语句承担太多责任。直接的函数调用和赋值是可以的，但如果该函数调用复杂且冗长，那么等我们读到结尾时，可能已经忘记它是如何开始的。这是一个不利于可读性的例子：\n\
  \n```\n```\n```\n\n当我们读到 `}, -1); err != nil {` 这一行时，会感到困惑。这里遵循的一个良好规则是：如果你的复合 `if`\
  \ 语句很短且只占一行，是可以的；但如果它比这长，或者不清晰，就将其拆分成多个语句。\n\n## 总结\n\n*   Go 程序本质上由各种类型的*语句*组成，语句是让执行某些操作的指令。\n\
  \n*   *赋值*语句将值与变量关联。\n\n\n\n\n*   `declaration`（声明）语句引入一个我们稍后将使用的变量（例如，通过给它赋值）。\n\
  *   有一种特殊的语句将声明和赋值结合，称为 `short variable declaration`（短变量声明）：例如，`eggs := 42`。\n*\
  \   我们可以使用所谓的 `tuple assignment`（元组赋值）在单条语句中进行多次赋值，如下：`a, b, c := 1, 2, 3`。\n* \
  \  当你对元组赋值中的某个值不感兴趣时，可以使用 `blank identifier`（空白标识符）`_` 来忽略它，例如：`_, ok := menu[\"\
  eggs\"]`。\n*   `Increment`（自增）和`decrement`（自）语句会将某些数值变量的值加或减 1：例如，`x++` 或 `y--`。\n\
  *   `if` 语句根据某些 `condition`（条件）的值，控制某一组语句是否会被执行。\n*   在 Go 中，我们倾向于将程序结构化，使“主执行路径”（happy\
  \ path）左对齐：即 `if` 块倾向于处理错误或异常情况，而让直线的控制流作为一切按计划进行时的预期路径。\n*   原则上，我们也可以使用 `else`\
  \ 关键字在 `if` 条件不成立时执行某些语句块，但在实践中这并不常用；我们更倾向于让 `if` 块返回。\n*   `conditional expression`（条件表达式），例如\
  \ `if` 语句的条件，是一个求值为 `boolean`（布尔值，`true` 或 `false`）的表达式。\n*   条件表达式可以是 `comparisons`（比较），使用\
  \ `==` 或 `!=` 以及其他运算符如 `<`, `>`, `<=` 和 `>=`。\n*   我们还可以使用 `logical`（逻辑）运算符 `&&`（与）、`||`（包或或）和\
  \ `!`（非）来组合表达式。\n*   最简单的条件表达式仅仅是一个独立的 `bool` 变量，甚至是字面量值 `true` 或 `false`。\n*  \
  \ 有一种特殊形式称为 `compound if`（复合 if），它将赋值和控制语句块执行的条件结合在一起，但完全没有必要使用它，而且可能会导致代码产生困惑。\n\
  \n# 12: Switch 哪一个？\n\n![](img/file12.jpg)\n\n我们在上一节中看到，我们的 Go 程序可以使用 `if` 选择一个可选路径，或者结合使用\
  \ `if` 和 `else` 采用两条路径。但如果有两个以上的候选项该呢？\n\n## `switch` 语句\n\n假设你想知道某个数字是正数、负数还是零。你完全可以写一系列\
  \ `if` 语句来找出结果，有时这样做是可以的。但随着选择数量和可能代码路径的增加，这会变得非常冗长且复杂。\n\n我们需要的是一种条件语句，允许我们指定任意数量的\
  \ `cases`（即，可能的条件），并将每个 case 链接到不同的代码路径上。Go 的 `switch` 语句正是这样做的。这里有一个示例：\n\n```\n\
  \n```\n\n```\n\n我们从关键字 `switch` 开始，后面紧跟一个左大括号，然后是 `cases` 列表，最后是右大括号。\n\n## Switch\
  \ cases\n\n每个 case 都由关键字 `case` 引入，后面跟着一些条件表达式（例如，`x < 0`）和一个冒号。\n\n然后，我们可以在 case\
  \ 条件为真时提供一些要执行的语句（例如，打印一条消息）。\n\n当 Go 遇到这样的 `switch` 语句时，它会查看第一个 case 并求值其中的条件表达式。如果该表达式为真，则执行该\
  \ case 的语句，然后 `switch` 语句结束；控制流移动到程序的下一个部分。\n\n如果表达式为假，执行将移动到下一个 case，依此类推，直到找到一个匹配的\
  \ case（即其条件表达式求值为 `true` 的 case）。如果没有一个匹配的 case，则什么都不会发生，程序继续运行。\n\n需要知道的一点是，一旦匹配了\
  \ case，Go 就不会再检查后续的 case，而是跳到语句的末尾。你可能认为所有匹配的 case 都会执行，但运行机制并不是这样的：只有第一个匹配的 case\
  \ 会执行。\n\n有一个特殊的语句可以改变这种行为：在 case 的末尾编写 `fallthrough` 告诉 Go 执行下一个 case 中的语句，而不是跳到末尾。但\
  \ `fallthrough` 很少被使用或需要；尽管如此，现在你了解它了。\n\n## default case\n\n有一个名为 `default` 的特殊\
  \ case，它只有在没有其他 case 匹配时才会匹配。在上例例中，如果 `x` 既不小于零（第一个 case），也不大于零（第二个 case），那么剩下的唯一可能就是\
  \ `x` 为零，这就是 `default` case。\n\n如果可能，你应该始终提供一个 `default` case：这会让你的程序更清晰、更可靠。\n\n\
  `switch` 是一种非常方便的方法，用于编写根据一组条件采取 N 个可能路径中的之一的程序逻辑，它比编写相应的 `if ... else if ... else\
  \ if ...` 语句更简洁。但请注意，你的 `switch` cases 之间应该是相互相关的。不要仅仅把 `switch` 当作避免编写多个不相关的 `if`\
  \ 语句的方法；这会导致产生困惑的代码。\n\n## Switch expressions\n\n根据某些变量或表达式的值采取不同动作是非常常见的。例如，假设你想确定\
  \ `x` 的值是 1、2 还是 3。实现此事的简洁方法是使用 switch 表达式，它位于 `switch` 关键字之后：\n\n```\n\n```\n\n\
  我们说这是对 `x` 进行切换，即不同的 cases 代表可能的值。你可以使用任何表达式代替 `x`，只要它的求值类型与 switch cases 相同（在我们的示例中，它是隐式的\
  \ `int`）。\n\n你可以在同一个 case 中提供多个值，用逗号分隔列表：\n\n```\n\n目标：编写一个函数 `greet`，接收一个代表名字的字符串并根据名字返回不同的字符串。如果名字是\
  \ `Alice`，返回 `\"Hey, Alice.\"`。如果名字是 `Bob`，返回 `\"What's up, Bob?\"`。对于任何其他名字，返回\
  \ `\"Hello, stranger.\"`。\n\n## 使用 break 提前退出 switch case\n\n有时我们在 switch case 的代码内部想要提前离开。`break`\
  \ 关键字将终止当前 case 并跳转到 `switch` 语句之后的代码：\n\n```\n\n```\n\n你可以将其理解为 case “跳出” `switch`\
  \ 语句，就像一个不想服完剩余刑期的犯人。\n\n## Loops\n\n你正在学习许多控制 Go 程序执行流的有用技术。普通语句一个接一个，而 `if` 和\
  \ `switch` 语句根据某些变量或表达式的值采取不同的路径。\n\n但如果我们想重复某些语句怎么办？例如，假设我们要打印 10 次某些消息。我们可以简单地写十个相同的\
  \ `fmt.Println` 语句。但这既冗长又缺乏活性。\n\n相反，我们希望有一个单一的打印语句，并执行不同次数。无论你如何尝试，都无法仅使用 `if`\
  \ 或 `switch` 语句创建这样的程序。我们需要一个新的关键字。\n\n## `for` 关键字\n\n可以重复的语句集合被称为循环，在 Go 中，循环是由\
  \ `for` 关键字引入的。你可以将其理解为“只要某个条件成立，就执行以下操作”。\n\n```\n\n```\n\n我们从 `for` 关键字开始，后面跟着（可选的）条件表达式和一个左大括号。然后是一个（可选的）语句集合，最后是右大括号。\n\
  \n\n\n\n\n当 Go 在程序中遇到这样的循环时会发生什么？首先，会求条件的表达式的值。如果为 `true`，则执行大括号内部的语句。\n\n到目前为止，这就像一个\
  \ `if` 语句，但有一个转折。当 Go 到达循环末尾时，它会*再次*评估条件。如果条件*仍然*评估为 `true`，则循环体中的语句将再次执行，如此循环下去，或者直到条件变为\
  \ `false` 为止。\n\n## 无限循环\n\n由于省略条件等同于指定了条件 `true`（而它始终为真），你可以看到，没有条件的 `for` 循环将无限执行。（或者，至少直到你关闭电脑或通过其他方式中断程序。）我们可以称之为“无限循环”。\n\
  \n这种循环有用吗？实际上是有用的！很多程序的工作就是无限重复某些过程：例如制造工艺。流水线上的焊接机器人只要流水线运行，就会反复执行相同的焊接序列。\n\n\
  同样，HTTP Web 服务器等网络服务器运行着一个无尽的循环，等待请求到达、处理请求，然后返回等待状态。当然，有方法可以中断或关闭此类程序，但我们不需要将它们指定为循环的终止条件。\n\
