  \n## 测试覆盖\n\n既然提到了这个话题，让我们更仔细地观察测试代码与其测试的代码（通常称为系统代码以区别于测试代码）之间的关系。\n\n在整本书中，我们设计函数的方法是从用户故事开始，推导出实现它所需的行为，将其以测试的形式表达出来，然后编写使测试通过的最少代码。因此，理论上每一行系统代码都应该被某些测试执行（我们称覆盖）。但事实如此吗？\n\
  \nGo 工具提供了实用的代码覆盖函数来检查这一点。例如，如果你运行 `go test -cover`，你会看到结果：\n\n```\nPASS\ncoverage:\
  \ 100.0% of statements\n```\n\n这很棒，但如果并不是所有语句都被测试覆盖了呢？我们如何看到哪些未覆盖？幸运的是，Go 可以为我们生成覆盖配置文件：\n\
  \n```\ngo test -coverprofile=coverage.out\n```\n\n我们现在可以使用这个配置文件生成一个 HTML 页面，用绿色显示已覆盖的代码，红色显示未覆盖的代码，并将忽略的部分（不是语句的内容）显示为灰色：\n\
  \n```\ngo tool cover -html=coverage.out\n```\n\n\n\n这将打开你的默认网络浏览器以查看生成的 HTML。\n\n\
  Visual Studio Code 的 Go 扩展允许你直接在编辑器中高亮已覆盖的代码，使用的命令是 `Go: Toggle Test Coverage in\
  \ Current Package`。其他编辑器也有类似的功能。\n\n你会发现某些行完全没有着色。这些通常是类型定义、常量等内容。虽然它们是程序的一部分，但它们实际上是给编译器的指令，不会在你的程序二进制文件中生成任何编译后的目标代码，因此覆盖率工具会忽略它们。它们不会被计入覆盖率统计中。\n\
  \n正如我们所看到的，如果你从一开始就根据测试引导来开发程序，那么理论上不应该有任何没有被测试覆盖的系统代码。但如果有的话，看起来会什么样呢？让我们来做一个实验。\n\
