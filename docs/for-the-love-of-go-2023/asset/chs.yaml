  \n## 核心要点总结\n\n- `slice`（切片）是 Go 类型的一种，表示`elements`（元素）的有序集合，所有元素都具有相同类型：例如，`[]string`\
  \ 是字符串的切片。\n- `slice literal`（切片字面量）指定切片类型的名称，后面跟上大括号中的一些元素：例如，`[]string{\"a\",\
  \ \"b\", \"c\"}`。\n- 在某些自定义类型（如结构体）的切片字面量中，我们不需要在每个元素字面量中重复该类型名称：编译器可以推断出来。\n- 我们使用方括号符号来引用切片中特定的编号元素：例如，`books[0]`\
  \ 指向 `books` 切片的第一个元素。\n- 内置函数 `len` 告诉我们切片中元素的数量。\n- 内置函数 `append` 向切片添加一个或多个元素，并返回修改后的切片。\n\
  - `range` 运算符允许我们编写 `for` 循环，它为切片中的每个元素依次执行一次。\n- 在像 `for _, b := range books` 这样的循环中，每次循环时\
  \ `b` 都将是切片 `books` 的每一个后续元素。\n- `==` 运算符没有定义在切片上，因此我们可以使用 `go-cmp` 包代替，它可以使用 `cmp.Equal`\
  \ 比较各种值，并在它们不相等时使用 `cmp.Diff` 产生 `diff`（差异比较）。\n- `cmp.Diff` 的输出显示了以 `-` 开头的 `expected`（预期）内容，以及以\
  \ `+` 开头的实际 `received`（接收）内容。\n- 当你需要从对象集合中检索某些特定内容时，你需要一种通过 `ID`（标识符）唯一标识它的方法，ID\
  \ 可以是你想要的任何，但通常是数字。\n- 如果你不知道元素的索引，从切片获取特定元素的一种方法是遍历整个切片，并将每个元素与你想要的元素进行比较。\n\n\
  # 7. Map 的趣用\n\n![](img/file7.png)\n\n感谢大家的帮助，Happy Fun Books 已经初具规模了！我们可以存储每个商店库存的书籍目录，获取目录中所有书籍的列表，并通过\
  \ ID 查找特定书籍的详情。\n\n然而，一个成功的书店会有很多书籍，遍历整个列表逐一比较 ID 可能需要很长时间。我们难道不能做得更好吗？\n\n我们想要的是一种数据结构，给定书籍\
  \ ID 后，直接返回对应的书籍，而不需要循环。这就是一种从 ID 到书籍的直接 `mapping`（映射）。\n\n## 引入 map\n\n事实证明 Go\
