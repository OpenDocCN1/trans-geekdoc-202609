  \ Go 中，这种三部分的 `for` 语句并不常见，因为我们通常想做的是遍历某些数据（在这种情况下可以使用 `range`）或者只是无限循环，这完全不需要条件。\n\
  \n**目标：** 编写一个函数 `evens`，使用三部分 `for` 语句打印 0 到 100（包含边界）的所有偶数。\n\n## 使用 `continue`\
  \ 跳到下一个元素\n\n我们已经看到了如何使用 `for` 循环来重复线性语句序列，但如果没那么简单呢？也许我们我们只想对数据的某些元素执行某些操作，而对其他元素不执行。\n\
  \n我们的工资单程序可能只想为当前员工生成工资单，而不是那些辞职或退休的人。我们可以编写这样的代码：\n\n```go\n```\n```\n\n这也可以，但并不理想；我们在\
  \ `if e.IsCurrent` 块内部多了一层缩进，而且正如你可能从本书早些时候我们讨论“快乐路径”时记得的那样，我们希望尽可能减少缩进，使我们的代码易于阅读。\n\
  \n我们想要的是一种方法，在非当前员工的情况下，说“在在这种情况下什么都不做，而是继续循环处理下一个元素”。这正是 `continue` 关键字的作用：\n\n\
  ```go\n```\n```\n\n现在，“快乐路径”在左侧边距直线运行，而唯一的缩进代码是处理异常或无效情况的，这正是我们想要的。你可以想象可能有多种不同的原因要跳过员工，每种原因都可能触发一个\
  \ `continue`。\n\n\n\n\n\n**目标：** 编写一个函数 `nonNegative`，它接收一个 `int` 切片并只打印非负元素。例如，如果输入是\
  \ `[]int{2, -1, 0, -4}`，它应该只打印 2 和 0。\n\n## 使用 `break` 退出循环\n\n你已经知道，通过在 `for` 语句中添加条件表达式（或\
  \ `range` 表达式），可以控制循环的何时结束。但有时，我们需要在无法预先检测到的情况下终止循环；例如在循环期间发生的某些情况。\n\n我们已经见过 `continue`\
  \ 关键字会跳过*当前*循环的剩余部分并进入下一次循环，但这并不是我们想要的。我们想要完全跳出循环，就像我们达到了终止条件且循环工作已经完成一样。\n\n通常情况下，直接从当前函数\
  \ `return` 就足够了；`return` 语句可以出现在函数中的任何地方，包括循环内部。由于 `return` 会立即返回，这将产生跳出循环的效果。\n\
  \n但当函数在循环完成后还需要执行后续工作时，我们就不能使用 `return` 来退出循环；因为它会同时退出函数。在本书前面的关于 `switch` 语句的章节中，我们遇到了非常有用的关键字\
  \ `break`，用于提前退出语句，我们也可以用它来退出循环。\n\n例如，假设我们想在公司在循环期间用完钱时停止打印检查结果（这种情况偶尔会发生，但希望不要经常发生）。我们可以编写类似这样的代码：\n\
  \n```\n\n```\n\n```\n\n一旦 Go 遇到 `break` 语句，它会立即停止循环，并跳转到 `for` 语句结束大括号之后的后续代码。\n\
  \n## 使用标签控制嵌套循环\n\n如你所知，Go 中的循环可以包含任何代码，包括其他循环。你可能会想，如果在在一个已经嵌套另一个循环中的循环（这被称为*嵌套循环*）内部使用\
  \ `break` 或 `continue` 关键字会发生什么呢？\n\n嗯，`break` 本身只会跳出*当前*循环；也就是说，就是我们正处于内部的那个循环。它对任何外层循环都没有影响。同样，`continue`\
  \ 会继续当前循环。那么，如果我们想从*内层*循环内部跳出*两个*循环，该怎么办？\n\n答案是我们可以使用*标签*（label）。Go 中的标签仅仅是为代码中的特定位置命名，以便我们以后引用它。标签的语法就是标签名称后跟一个冒号。例如：\n\
  \n```\n\n```\n\n```\n\n如果我们有需要跳出的嵌套循环，可以在外层循环开始之前放置一个标签，然后在内层循环中使用带有该标签的 `break`：\n\
  \n```\n\n```\n\n```\n\n如果我们想 `continue` 外层循环而不是退出它，可以编写 `continue outer`。\n\n这是一个稍显刻意的例子，事实上，在\
  \ Go 程序中看到使用标签其实是非常罕见的。其其一，嵌套循环本身已经相当复杂且难以阅读了，因此我们倾向于尽可能避免使用它们。\n\n此外，任何这种类型的“跳转”控制流都会让程序更难理解。如果你发现自己需要在\
  \ Go 代码中使用标签，那么这可能是一个提示，说明你可以通过重构程序以不同的方式来实现，从而使程序更加清晰，而这种方式是不需要标签的。\n\n就好像使用 `break`\
  \ 和 `continue` 到处跳跃还不够糟糕似的，还有另一个 Go 关键字 `goto`，它会直接跳转到指定的标签。正如你可以想象的，这会让事情变得*真的*难以追踪。在\
  \ Go 中，你不太会有使用 `goto` 的充分理由，如果你想编写清晰、可读的代码，就应该避免使用它。\n\n## 总结\n\n- `switch` 语句是一种简洁的方法，根据某些条件从多个可能的\
  \ *cases* 中选择一个，而无需编写大量连续的 `if ... else ...` 语句。\n- `switch` 语句中的每个 case 都可以有一个条件，在这种情况下\
  \ Go 按顺序评估每个 case，并执行第一个条件为真的 case（如果有的话）。\n- 如果存在名为 `default` 的 case，则当且仅当没有其他\
