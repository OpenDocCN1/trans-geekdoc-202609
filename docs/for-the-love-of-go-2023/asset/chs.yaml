  \ Go 构建我们新的在线商店。\n\n首先，让我们聊聊 `data`（数据）和 `data types`（数据类型）。所谓的“数据”，我们实际上指的是某些信息，比如书名或客户的地址。那么，我们可以有效地区分不同\
  \ `kinds`（种类）的数据吗？\n\n可以。例如，有些数据是以文本形式存在的（如书名）。我们称之为 `string`（字符串）数据，意味着一个序列，就像“一串珍珠”，但在这种情况下，它是一串字符。\n\
  \n然后是用数字表示的数据，比如书的价格；我们称之为 `numeric`（数值）数据。\n\n我们还遇到了第三种数据：`boolean`（布尔）数据，它由“是或否”、“真或假”、“开或关”等信息组成。\n\
  \n## 类型 (Types)\n\n在编程中，“type”（类型）这个词的意思和你想象的一样，但带有一种特殊的强调。它意味着“某种东西的种类”，但这种方式允许我们自动确保程序正在处理正确种类的东西。\n\
  \n例如，如果我们声明某个变量只持有字符串数据（我们说变量的 `type` 是 `string`），那么 Go 编译器就可以检查我们是否只给它赋值了该类型的值。尝试赋值其他类型的值将导致编译错误。\n\
  \n让我们先区分一下 `value`（值，一段数据，例如字符串 `Hello, world`）和 `variable`（变量，标识计算机内存中某个特定位置的名称，该位置可以存储特定的值）。\n\
  \n值是有类型的；`Hello, world` 的类型命名为 `string`。因此我们称其为 `string value`（字符串值），因为它的 `type`\
  \ 是 `string`。Go 中的变量也有类型，这决定了它能持有什么样的值。如果我们打算让它存储字符串值，我们将赋予它 `string` 类型，并称其为 `string\
  \ variable`（字符串变量）。\n\n因此，字符串变量只能持有字符串值。这很直观，不是吗？在继续之前，请确保你对类型、值和变量的理解已经足够从容。\n\n\
