  \ 和 `Sqrt` 的示例实现。\n\n## 运行程序\n\n到目前为止，我们在书中编写了 Go 的测试和函数，并使用 `go test` 命令运行测试。这些都很好，但你可能想知道如何在\
  \ Go 中运行一个*程序*，而不仅仅是一组测试。在本节中，我们将看到如何实现这一点。\n\n为了让任何程序在计算机上运行，它必须以*可执行二进制文件*的形式存在：即一个包含计算机\
  \ CPU 可以理解的机器码的文件，并且符合其操作系统要求的特定格式。\n\n要将包含源代码的文本文件转换为可执行二进制文件，Go 使用了一个名为*编译器*的程序（这就是为什么我们总是收到那些关于未定义变量和类型不匹配的愤怒信息）。编译器将\
  \ Go 程序翻译成机器码，生成一个我们可以随后运行的可执行二进制文件。\n\n那么，它是如何工作的呢？\n\n## `main` 包\n\n为了让一组 Go\
  \ 源代码生成可执行文件，必须在一个名为 `main` 的特殊包中至少包含一些代码。由于我们不能在同一个文件夹中拥有多个包（测试包除外），我们需要将 `main`\
  \ 包放在项目的子文件夹中。\n\n由于 `main` 包会产生一个*命令*（即可执行文件），按照惯例将此文件夹命名为 `cmd`（“command”的缩写）。\n\
  \n然而，仅仅声明 `main` 包是不够的。无论我们的程序做什么，它都必须从某个地方*开始*，Go 编译器需要知道那个应该是哪里。我们告诉它的方法是定义一个也名为\
  \ `main` 的特殊函数。\n\nGo 程序的控制流从 `main` 函数开始，并按照语句顺序执行，在此过程中可能会调用其他函数。当（如果）执行到达 `main`\
  \ 的结尾时，程序停止。\n\n## `go run` 命令\n\n那么，让我们写一个拥有 `main` 包和 `main` 函数的可执行程序吧。我们将使用 `calculator`\
  \ 包来执行一些计算，并在用户的终端中打印结果。\n\n在 `calculator` 项目中创建一个名为 `cmd` 的新子文件夹。因为该包可能关联多个命令，让我们也创建一个名为\
  \ `calculator` 的子文件夹：\n\n```bash\nmkdir -p cmd/calculator\n```\n\n在此文件夹中添加一个名为 `main.go`\
  \ 的文件，内容如下：\n\n```\n```\n\n([Listing 8.2](https://github.com/bitfield/ftl-code/blob/main/8.2/cmd/calculator/main.go)）\n\
  \n我们知道，如果我们想生成可执行二进制文件，就需要 `package main` 声明。我们还需要一个 `main` 函数，否则二进制文件将将什么都不做。\n\
  \n这是我们最终应该得到的目录结构：\n\n```\ncalculator/\n    calculator.go\n    calculator_test.go\n\
  \    cmd/\n        calculator/\n            main.go\n    go.mod\n```\n\n我们可以通过使用\
  \ `go run` 命令直接从命令行运行此程序：\n\n```bash\ngo run cmd/calculator/main.go\n```\n\n结果如下：\n\
  \n```\n4\n```\n\n这太令人鼓舞了！\n\n## `go build` 命令\n\n`go run` 命令用于快速检查程序是否正常，但如果我们真的想向客户*分发*软件，更方便的方法是构建一个可执行文件。让我们看看它是如何工作的。\n\
  \n要创建可执行文件，运行命令：\n\n```bash\ngo build -o add ./cmd/calculator\n```\n\nWindows 的工作方式略有不同，如果你在该平台上运行，你需要运行：\n\
  \n```bash\ngo build -o add.exe ./cmd/calculator\n```\n\n如果没有错误，该命令不会产生任何输出，但你会发现当前目录下创建了一个名为\
  \ `add` 的新文件。\n\n要运行它，直接使用程序名本身作为命令：\n\n```bash\n./add\n```\n\n```\n4\n```\n\n在\
  \ Windows 上，只需运行：\n\n```bash\nadd\n```\n\n干得好！我们将在书后后的“构建块”章节中对 `go build` 及其功能进行更多说明，但目前这些就是我们需要的全部内容。\n\
