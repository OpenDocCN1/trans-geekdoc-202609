  \ `Divide` 足够了。让我们回顾一下我们所学。\n\n## 测试的结构\n\n所有测试在很大程度上遵循相同的结构：\n\n*   设置输入和预期结果\n\
  *   调用函数并传递输入\n*   检查结果是否符合预期，如果不符合，则报错\n\n## 开发流程\n\n1. 从编写测试开始（尽管函数还不存在）\n2. 看到测试失败，因为函数还不存在\n\
  3. 编写必要的代码以让测试失败\n4. 确保测试失败时，错误信息是准确且具有信息量的\n5. 编写必要的代码以让测试通过\n6. 可选地，调整并改进代码\n\
  7. 提交！\n\n这有时被称为“红-绿-重构”循环。失败测试阶段是“红”，通过测试阶段是“绿”，而美化代码是“重构”。在实践中，我们可能会多次通过循环。\n\n\
  ## 比较浮点值\n\n大多数语言中表示小数的方法被称为*浮点数*（这就是为什么 Go 的小数类型被称为 `float64`）。而且关于浮点数的一点是它们具有有限的*精度*。如果你考虑三分之一的十进制，它是\
  \ `0.33333...`，但它永远停止。在有限的位数（甚至在纸上）表示这样的数字不可避免会精度损失。\n\n让我们尝试在现有的 `TestDivide` 中添加这样一个用例：\n\
