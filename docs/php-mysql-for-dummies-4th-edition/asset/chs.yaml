  \n## 第一部分：使用 PHP 和 MySQL 开发 Web 应用程序\n\n## 数据类型\n\nMySQL 根据数据类型以不同的格式存储信息。主要类型有字符、数值和日期。\n\
  \n### 字符数据\n\n最常见的数据类型是字符数据——以字符串形式存储并可以处理。你存储的大部分信息都是字符数据，例如姓名、地址、电话和描述。字符数据可以移动和打印。两个字符串可以拼接，可以从长字符串中选择子字符串，也可以替换字符串。\n\
  \n字符数据可以通过两种格式存储：\n\n- **固定长度**：在这种格式下，MySQL 为数据留出固定空间。如果数据超过固定长度，只存储允许的部分——剩余字符不存储。如果字符串短于固定长度，额外的空间将会被浪费。\n\
  - **可变长度**：在这种格式下，MySQL 将字符串存储在长度相同的字段中。你指定字符串长度，但如果字符串短于指定长度，MySQL 只使用所需的空间，而不是留空。如果字符串超过指定长度，额外的字符将不存储。\n\
  \n如果字符串长度变化很小，使用固定长度格式。例如，长度为 10 的适用于所有包含邮编 4 的邮政编码。如果邮政编码不包含邮编 4，只会留五个空格。然而，大多数字符串的波动更大，因此大多数情况下使用可变长度格式。\n\
  \n### 数值数据\n\n另一种常见类型是数值数据——以数字存储的数据。小数（例如 10.5、2.34567、23456.7）和整数（例如 1、2、248）都可以被存储。当数据作为数字存储时，可以用于数值运算，例如加法、减法和平方。\n\
  \n如果数据不是用于数值运算，将其存储为字符字符串更好，因为程序员将将其作为字符串使用。\n\n\n\n\n不需要进行转换。例如，你可能不想对用户电话号码中的数字相加，因此电话号码应该存储为字符串。\n\
  \nMySQL 存储正数和负数，但你可以告诉 `MySQL` 只存储正数。如果你的数据永远不会是负数，请将数据存储为 `unsigned`（在数字前不使用 `+`\
  \ 或 `–` 符号）。例如，城市人口或文档的页数永远不会为负。\n\n`MySQL` 提供了一种特殊的数值列类型，称为自增列（auto-increment column）。当未提供特定数字时，这种类型的列会自动填充顺序数字。例如，当向表中添加一行并在自增列中填入\
  \ `5` 时，下一行的该列值将自动分配为 `6`，除非指定了不同的数字。在需要唯一编号（如产品编号或订单号）时，自增列非常有用。\n\n### 日期和时间数据\n\
  \n第三种常见的数据类型是日期和时间数据。以日期存储的数据可以以多种日期格式显示。它还可以用于确定两个日期或两个时间之间长度——或者特定日期或时间与某个任意日期或时间之间的长度。\n\
  \n### 枚举数据\n\n有时数据的值只有有限的几个。例如，某列的可能值只有 `yes` 或 `no`。`MySQL` 提供了一种名为 `enumeration`\
  \ 的数据类型用于此类数据。你告诉 `MySQL` 该列中可以存储哪些值（例如，`yes`、`no`），`MySQL` 将不会在该列中存储任何其他值。\n\n\
  ### MySQL 数据类型名称\n\n当你创建一个数据库时，通过使用 `MySQL` 数据类型名称告诉 `MySQL` 在特定列中期望什么类型的数据。表 3-1\
  \ 显示了 Web 数据库应用程序中最常用的 `MySQL` 数据类型。\n\n**表 3-1：MySQL 数据类型**\n\n| MySQL 数据类型 | 说明\
  \ |\n| :--- | :--- |\n| `CHAR(length)` | 固定长度字符字符串。 |\n| `VARCHAR(length)` | 可变长度字符字符串。可以存储的最大字符串为\
  \ `length`，必须在 1 到 255 之间。 |\n| `TEXT` | 最大长度为 64K 文本的可变长度字符字符串。 |\n| `INT(length)`\
  \ | 整数，范围从 –2147483648 到 +2147483647。可以显示的数字受 `length` 限制。例如，如果 `length` 为 4，则只能显示\
  \ –999 到 9999 的数字，即使存储了更大的数字。 |\n| `INT(length)` | 整数，范围从 0 到 4294967295。 |\n| `UNSIGNED`\
  \ | `length` 是可显示数字的大小。例如，如果 `length` 为 4，则只能显示到 9999 的数字，即使存储了更大的数字。 |\n| `BIGINT`\
  \ | 大整数。有符号范围为 –9223372036854775808 到 9223372036854775807。无符号范围为 0 到 18446744073709551615。\
  \ |\n| `DECIMAL(length, dec)` | 十进制小数，其中 `length` 是用于显示该数字的字符数（包括小数点、符号和指数），`dec`\
  \ 是允许的最大小数位数。例如，12.34 的 `length` 为 5，`dec` 为 2。 |\n| `DATE` | 包含年、月、日的日期值。显示为 `YYYY-MM-DD`（例如\
  \ 2009-09-03）。 |\n| `TIME` | 包含时、分、秒的时间值。显示为 `HH:MM:SS`。 |\n| `DATETIME` | 日期和时间存储在一起。显示为\
  \ `YYYY-MM-DD HH:MM:SS`。 |\n| `ENUM` | 只能存储列出的值。最多可以列出 65,535 个值（val1”、“val2”...)）。\
  \ |\n| `SERIAL` | `BIGINT UNSIGNED NOT NULL AUTO_INCREMENT` 的快捷名称。 |\n\n注意，数据类型\
  \ `SERIAL` 仅适用于 `MySQL` 5.0 或更高版本。此外，你不能使用 `phpMyAdmin` 设置 `SERIAL` 数据类型。必须像第 4\
  \ 章解释那样使用 `SQL` 来设置 `SERIAL` 数据类型。\n\n`MySQL` 允许许多其他数据类型，但它们的使用频率较低。有关所有可用数据类型的说明，请参阅\
  \ `MySQL` 在线手册 `http://dev.mysql.com/doc/refman/5.1/en/data-types.html`。\n\n## 记录下来\n\
