  $user=”admin”;\n$host=”localhost”;\n$passwd=$”;\n$dbname = “MemberDirectory”;\n\
  $cxn = mysqli_connect($host,$user,$passwd,$dbname)\nor die (“couldn’t connect to\
  \ server”);\nforeach($labels as $field => $value)\n{\n$good_data[$field] =\nstrip_tags(trim($_POST[$field]));\n\
  if($field == “phone”)\n{\n$good_data[$field] =\npreg_replace(\"/(\\[)( .-\\]/”,$$good_data[$field]);\n\
  }\n$good_data[$field] =\nmysqli_real_escape_string($cxn,\n$good_data[$field]);\n\
  }\n$query = “INSERT INTO Phone (“;\nforeach($good_data as $field => $value)\n{\n\
  $query .= “$field,”;\n}\n$query .= “)”;\n$query = preg_replace(\"/,$/”,$$query);\n\
  $result = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query. “.mysqli_error($cxn));\n\
  echo “<h4>New Member added</h4>”;\n}\n?>\n</body></html>\n```\n\n```该程序是在列表 13 中的\
  \ `checkAll.php` 程序的基础上构建的。它检查来自表单的数据是否存在空白字段和格式错误，并在发现问题时要求用户重新输入数据。如果数据正确，程序将对数据进行修剪、清理并存储在数据库中。\n\
  \n注意，该程序构建了存储数据的查询。它使用来自 `good_data` 数组的信息来构建查询。其工作原理如下：\n\n- **118**：SQL 查询的第一部分将数据存储在变量\
  \ `$query` 中。\n- **119**：启动 `foreach` 循环，使用连接赋值语句（`.=`）将字段名添加到查询语句中。\n- **123**：循环结束后，第\
  \ 123 行添加 SQL `INSERT` 查询的中间部分。\n- **124**：移除在最后一个字段名后插入的逗号。\n- **125**：重复此过程以将值添加到查询的最后部分。\n\
  \n\n\n\n\n```php\n}\n\n$field_array[]=$field;\n\n$value_array[]=$formdata[$field];\n\
  \n}\n\n$fields=implode(\",\",$field_array);\n\n$values=implode('\",',$value_array);\n\
  \n$query = “INSERT INTO $tablename ($fields)\nVALUES (\\\"$values\\\")”;\n\nif($result\
  \ = mysqli_query($cxn,$query))\nreturn TRUE;\nelse\nreturn FALSE;\n}\n```\n\n如果函数在没有错误的情况下完成了数据插入，则返回\
  \ `TRUE`；如果无法插入数据，则返回 `FALSE`。在开始时，函数会检查传递给它的数据是否确实为数组。如果 `$formdata` 不是一个数组，函数将停止并返回\
  \ `FALSE`。\n\n请注意，只有当表单中的字段名与数据库表中的列名相同时，此函数才能有效。此外请注意，此函数假设你已经连接到 MySQL 服务器并选择了正确的数据库。数据库连接是作为参数传递给函数的。\n\
  \n下面的代码显示了你如何调用该函数：\n\n# 第三部分：PHP\n\n```php\nelse //如果数据正常\n{\n$user=”admin”;\n\
  $host=”localhost”;\n$password=””;\n$database = “MemberDirectory”;\n$cxn = mysqli_connect($host,$user,$password,$database)\n\
  or die (“couldn’t connect to server”);\nif(storeForm($good_data,”Phone”,$cxn))\n\
  echo “New Member added to database<br>”;\nelse\necho “New Member was not added to\
  \ the database<br>”;\n}\n?>\n</body></html>\n```\n\n由于函数中包含了大部分语句，这个程序的可读性变得容易得多。此外，只要表单中的字段名与数据库表中的列名相同，此函数就适用于任何表单。如果函数无法执行查询，它将在该处停止执行并打印错误信息“无法执行查询”。如果查询在某些情况下可能会失败，你需要考虑这些因素。\n\
  \n#### 更新现有信息\n\n你将像我在第 4 章中描述的那样，使用 `UPDATE` 查询来更新现有信息。更新意味着更改数据库中已存在行的列数据——而不是向数据库表添加新行。其通用格式为：\n\
  \n```php\n$query = “UPDATE *tablename* SET *col*\\= *value* WHERE *col*\\= *value*”;\
  \ $result = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query.”);\n```\n\
  \n例如，更新 Goliath Smith 电话的语句为：\n\n```php\n$query = “UPDATE Member SET phone='$_POST[phone]’\n\
  WHERE lastName=’$_POST[lastName]’\nAND firstName=’$_POST[firstName]’”;\n$result\
  \ = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query.”);\n```\n\n如果你在\
  \ `UPDATE` 查询中不使用 `WHERE` 子句，则 `SET` 的字段将应用于所有行。这通常不是你想要执行的操作。\n\n第 8 章：数据输入，数据输出\n\
  \n你永远直接使用来自 `$_POST` 数组中表单字段的数据来更新数据。务必先检查其格式并进行清理，正如之前讨论的那样。\n\n列表 8-18 显示了一个名为\
  \ `updatePhone.php` 的程序，它可以更新现有数据库记录中的电话号码。`updatePhone.php` 处理的数据来自列表 8-16 显示的\
  \ `storePhone.php` 相同的表单。你只需要更改表单标签，使 `action` 属性中的程序变为 `updatePhone.php`，如下：\n\n\
  ```php\necho “<form action=’updatePhone.php’ method=’POST’>\";\n```\n\n##### 列表\
  \ 8-18：更新数据\n\n```php\n<?php\n/* 程序名：updatePhone.php\n* 说明：程序检查电话号码格式\n* 是否正确。更新数据库中\n\
  * 为指定姓名的电话号码。\n*/\n$labels = array (“first_name” => “First Name”,\n“last_name” =>\
  \ “Last Name”,\n“phone” => “Phone”);\n?>\n<html>\n<head>\n<title>Customer Number\
  \ Update</title>\n<style type='text/css>\n/*\nform { margin:1.5em 0 0; padding:\
  \ 0; }\n.field { padding-top: .5em; }\nlabel { font-weight: bold; float: left; width:\
  \ 20%;\nmargin-right: 1em; text-align: right; }\n#submit { margin-left: 35%; padding-top:\
  \ 1em; }\n*/\n</style>\n</head>\n<body>\n<?php\n/* 检查每个字段是否为空 */\nforeach($_POST\
  \ as $field => $value)\n{\nif(empty($value))\n{\n$blank_array[]=$field;\n}\n}\n\
  ```\n（续）第三部分：PHP\n\n##### 列表 8-18（续）\n\n```php\n/* 检查电话号码格式 */\nif(!preg_match(/^^[0-9]{7,20}([x]|(ext))?[0-9]{1,7})?$/$_POST['phone']))\n\
  {\n$bad_format[] = “phone”;\n}\n/* 如果任何字段不正确，显示错误和表单 */\nif(@sizeof($blank_array)\
  \ > 0 or @sizeof($bad_format) > 0)\n{\nif(@sizeof($blank_array) > 0)\n{\n/* 显示缺失信息的消息\
  \ */\necho “<p><b>请填写以下缺失信息：</b><br />\nforeach($blank_array as $value)\n{\necho\
