  \n### 5. 对字段定义修改后，点击 Save（保存）。\n\n### 6. 重复步骤 4 和 5，直到你修改了所有想要更改的字段。\n\n## 编写自己的\
  \ SQL 查询\n\n你可以使用 `ALTER` 查询来更改表结构。该查询的基本格式是 `ALTER TABLE tablename`，后面跟上指定的更改。表\
  \ 4-2 显示了你可以执行的更改。\n\n### 表 4-2：使用 ALTER 查询可以进行的更改\n\n| 更改 | 描述 |\n| :--- | :---\
  \ |\n| `ADD columnname` | 添加一列；`definition` 包含数据类型和可选定义。 |\n| `ALTER columnname\
  \ SET DEFAULT value` | 更改列的默认值。 |\n| `ALTER columnname DROP DEFAULT` | 移除列的默认值。\
  \ |\n| `CHANGE columnname new-columnname` | 更改列的定义并重命名；`definition` 包含数据类型和可选定义。\
  \ |\n| `DROP columnname` | 删除一列，包括该列中的所有数据。数据将无法恢复。 |\n| `MODIFY columnname` | 更改列的定义；`definition`\
  \ 包含数据类型和可选定义。 |\n| `RENAME new-tablename` | 重命名表。 |\n\n你可以通过向列发送此查询来增加 `lastName`\
  \ 字段的宽度：\n\n```\nALTER TABLE Member MODIFY lastName VARCHAR(50)\n```\n\n## 将数据移入和移出数据库\n\
  \n一个空的数据库就像一个空的饼干罐——一点也不有趣。搜索一个空的数据库并不比搜索空的饼干罐更有趣，或更有成效。数据库只有在其所持的信息方面才用的。\n\n数据库需要能够接收信息进行存储，并根据请求交付信息。例如，`MemberDirectory`\
  \ 数据库需要能够接收成员信息，并且在你请求时也需要能够交付其存储的信息。例如，如果你想知道某个成员的地址，数据库需要在你请求时交付该条信息。\n\n## 第\
