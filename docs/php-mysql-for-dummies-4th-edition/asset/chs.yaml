  - ➝**164** 开始一个 `if` 语句，如果用户名已存在，则执行该语句。创建一个错误消息并重新显示新成员表单（带有错误消息），以便用户可以输入不同的用户名。\n\
  - ➝**170** 开始一个 `else` 语句，如果在数据库中未找到用户名，则执行该语句。第 173–179 行创建并执行一个 SQL 查询，将新成员添加到数据库。\n\
