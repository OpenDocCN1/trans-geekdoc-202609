  \n### 使用 SQL 查询逐行添加信息\n\n通常需要你的 PHP 脚本将数据存储到数据库中。例如，当你销售产品时，客户会在表单上输入姓名、地址、想要购买的产品和其他信息。\n\
  \n你的 PHP 脚本需要将这些数据添加到数据库。你使用 SQL 查询在脚本中添加数据。\n\n`INSERT` 查询的通用形式为：\n\n`INSERT INTO\
  \ tablename (columnname, columnname, ..., columnname) VALUES (value, value, ...,\
  \ value)`以下规则适用于 `INSERT` 查询：\n\n- **值的顺序必须与列名的顺序一致。** 值列表中的第一个值将插入到列表中的第一个列中，第二个值将插入到第二个列中，以此此类推。\n\
  - **允许部分列列表。** 你不需要列出所有列。未列出的列将获得其默认值，如果没有定义默认值则留空。\n- **列列表不是必须的。** 如果你为所有列输入值，则不需要列出列。如果没有列列，MySQL\
  \ 将按照它们在表中的顺序查找所有列的值。\n- **列列表和值列表的长度必须相同。** 如果列列表比值列表长或短，你会收到如下错误消息：列数与值数不匹配。\n\
  \n以下 `INSERT` 查询向 Member 表添加了一行：\n\n```sql\nINSERT INTO Member (loginName, createDate,\
  \ password, lastName, street, city, state, zip, email, phone, fax)\nVALUES (\"bigguy\"\
  , \"2001-Dec-2\", \"secret\", \"Smith\", \"1234 Happy St\", \"Las Vegas\", \"NV\"\
  , \"88888\", \"gsmith@GSmithCompany.com\", \"(555) 555-5555\", \"\")\n```\n\n\n\n\
  \n注意，`firstName` 未列在列名列表中。`firstName` 字段没有输入任何值。如果 `firstName` 被定义为 `NOT NULL`，`MySQL`\
  \ 将不会允许这样做。此外，如果 `firstName` 的定义包含 `default`，则会有一个默认值，但由于它没有包含，因此该字段被留空。注意存储在 `fax`\
  \ 中的值是一个空字符串。\n\n## 使用 phpMyAdmin 逐行添加行\n\n许多 Web 数据库应用程序都包含一个用于在 Web 页面上显示的信息的数据库。例如，产品目录包含了应用程序在客户想要查看时所要展示的产品信息。在此类应用程序中，你可以在应用程序之外向数据库添加信息。你可以使用\
  \ `phpMyAdmin` 创建该目录。\n\n若要使用 `phpMyAdmin` 向数据库表添加数据，请遵循以下步骤：\n\n1. **打开 phpMyAdmin\
  \ 主页。**\n\n本章之前出现的图 4-1 显示了主页。\n\n2. **点击数据库名称。**\n\n3. **点击插入图标。**\n\n在操作列中，对应表格的行，插入图标是第四个图标。\n\
  \n图 4-8 所示的页面将打开，你可以在其中输入该行的数据。\n\n**图 4-8：**\n输入行的 phpMyAdmin 页面。\n\n4. **向每行添加你的数据。**\n\
  \n你在名为 `Values` 的列中输入值。注意，还有一个名为 `Function` 的列，它包含一个可供你输入数据的 `MySQL` 函数下拉列表。例如，在这种情况下，日期指定了函数\
  \ `NOW`。`NOW` 函数会输入当前日期。\n\n5. **点击 Go（执行）。**\n\n将打开一个新页面，显示数据已插入插入，并显示所使用的 `SQL`\
  \ 查询语句。\n\n## 批量添加数据\n\n如果你有大量数据需要输入且这些数据已存在计算机文件中，可以使用 `phpMyAdmin` 将数据从现有的计算机文件传输到你的\
  \ `MySQL` 数据库。\n\n由于数据库中的数据按行和列组织，因此读取的文本文件必须指明每列数据的开始和结束位置，以及行的结束位置。为了指示列，使用特定的字符来分隔每列的数据。默认情况下，`MySQL`\
  \ 寻找制表符（tab）来分隔字段。然而，如果制表符不适用于你的数据文件，你可以选择不同的字符来分隔字段，并在查询中告诉 `MySQL` 使用非制表符的字符来分隔字段。此外，默认情况下，行尾被认为是行的结束——如果你有需要，也可以选择一个字符来表示行尾。`Pet`\
  \ 表的数据文件可能如下：\n\n```\nUnicorn<TAB>horse<TAB>Spiral horn<Tab>5000.00<Tab>/pix/unicorn.jpg\
  \ Pegasus<TAB>horse<TAB>Winged<Tab>8000.00<Tab>/pix/pegasus.jpg Lion<TAB>cat<TAB>Large;\
  \ Mane on neck<Tab>2000.00<Tab>/pix/lion.jpg\n```\n\n字段之间带有制表符的文件是 `tab-delimited`制表符分隔）文件。另一种常见格式是\
  \ `comma-delimited`逗号分隔）文件，用逗号分隔字段。\n\n如果你的数据是另一种文件格式，你需要将其转换为分隔文件。如果你的数据是另一种文件格式，你需要将其转换为分隔文件。\n\
  \n\n\n\n\n`SELECT` 查询可以更具选择性。`SELECT` 查询中的 SQL 单词和短语可以精确定位回答你问题所需的信息。你可以指定你想要哪些信息、如何组织这些信息以及信息的来源。\n\
  \n- ✓ 你可以只请求回答你问题所需的信息（列）。例如，你可以只请求姓和名来创建一个成员列表。\n- ✓ 你可以按照特定的顺序请求信息。例如，你可以要求按字母顺序对信息进行排序。\n\
  - ✓ 你可以从表中的选定对象（行）中请求信息。（有关数据库对象的解释，请参阅第 3 章。）例如，你可以只针对地址在佛罗里达州的成员请求姓和名。\n\n在 MySQL\
  \ 4.1 中，MySQL 增加了了在另一个查询中嵌套 `SELECT` 查询的能力。这种嵌套查询被称为 `subquery`（子查询）。你可以在 `SELECT`、`INSERT`、`UPDATE`\
  \ 或 `DELETE` 查询或 `SET` 子句中使用 `subquery`。`subquery` 可以返回单个值、单行或单列或一个表，并用于外部查询。`SELECT`\
  \ 查询的所有功能都可以在子查询中使用。有关使用子查询的详细信息，请参阅 MySQL 在线手册：`http://dev.mysql.com/doc/refman/5.1/en/subqueries.html`。\n\
  \n# 100 第二部分：MySQL 数据库\n\n## 获取特定信息\n\n要检索特定信息，请列出包含所需信息的列。例如：\n\n```sql\nSELECT\
  \ *columnname,columnname,columnname,... FROM tablename\n```\n该查询从指定列的所有行中检索值。\n\n\
  例如，以下查询检索存储在 `Member` 表中的所有姓和名：\n\n```sql\nSELECT lastName,firstName FROM Member\n\
  ```\n\n在选择列时，你可以对这些列执行数学操作。例如，你可以使用以下 `SELECT` 查询来将两个列相加：\n\n```sql\nSELECT col1+col2\
  \ FROM tablename\n```\n\n或者你可以使用以下查询：\n\n```sql\nSELECT price,price*1.08 FROM Pet\n\
  ```\n结果是价格以及加上了 8% 销售税后的价格。\n\n你可以在选择列时更改其名称，如下所示：\n\n```sql\nSELECT price,price*1.08\
  \ AS priceWithTax FROM Pet\n```\n`AS` 子句告诉 MySQL 为检索到的第二个列命名为 `priceWithTax`。因此，查询检索了两列数据：`price`\
  \ 和 `priceWithTax`。\n\n在某些情况下，你不想看到列中的值，但你想知道有关该列的某些信息。例如，你可能想知道列中的最低值或最高值。表 4-3\
  \ 列出了关于列的某些可用信息。\n\n### 表 4-3：可以选择的信息\n\n| SQL 格式 | 信息描述 |\n| :--- | :--- |\n| `AVG(columnname)`\
  \ | 返回 `columnname` 中所有值的平均值 |\n| `COUNT(columnname)` | 返回 `columnname` 不为空的行数 |\n\
  | `MAX(columnname)` | 返回 `columnname` 中的最大值 |\n| `MIN(columnname)` | 返回 `columnname`\
  \ 中的最小值 |\n| `SUM(columnname)` | 返回 `columnname` 中所有值的之和 |\n\n### 第 4 章：构建数据库 (101)\n\
  \n例如，`MAX(price)` FROM `Pet` 将将找到最高价格。其他函数如 `SQRT()`、`DAY()` 和 `DATE()` 提供了各种计算。更多详细信息，请参阅\
  \ MySQL 在线手册：`http://dev.mysql.com/doc/refman/5.1/en/subqueries.html`。\n\n## 按特定顺序检索数据\n\
  \n你可能希望按照特定顺序检索数据。例如，在 `Member` 表中，你可能希望按名称对数据排序。\n\n- ✓ `ORDER BY`:要按升序排列数据，使用\
  \ `ORDER BY`。例如：\n  ```sql\n  SELECT * FROM Member ORDER BY columnname\n  ```\n\
  - ✓ `DESC`:要按降序排列数据，使用 `DESC` 关键字：\n  ```sql\n  SELECT * FROM Member ORDER BY columnname\
  \ DESC\n  ```\n- ✓ `GROUP BY`:要对具有共同值的行进行分组，使用 `GROUP BY`：\n  ```sql\n  SELECT *\
  \ FROM Pet GROUP BY petType\n  ```\n\n# 102 第二部分：MySQL 数据库\n\n## 从特定源检索数据\n\n通常，你不需要表中的所有信息；你只需要特定的特征。\n\
  \n- ✓ `WHERE`:允许你指定某些特征。例如：\n  ```sql\n  SELECT * FROM Member WHERE columnname =\
  \ 'value'\n  ```\n- ✓ `LIMIT`:允许你限制返回的行数。\n- ✓ `DISTINCT`:允许你只请求唯一值。\n\n`WHERE`\
  \ 子句的基本格式为：\n`WHERE expression AND OR expression ...`\n\n`expression` 指定了一个用于与数据库中存储的值进行比较的值。你可以根据需要使用任意多个表达式，每个表达式由\
  \ `AND` 或 `OR` 隔开。当你使用 `AND` 时，两个表达式都为真，该行才会被选中。当你使用 `OR` 时，只需其中一个表达式为真即可。\n\n###\
  \ 表 4-4：WHERE 子句的表达式\n\n| 表达式 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| `column = value`\
  \ | `zip=\"12345\"` | 检索 `zip` 为 12345 的行 |\n| `column > value` | `zip > \"50000\"\
  ` | 检索邮政编码为 50001 或更高的行 |\n| `column >= value` | `zip >= \"50000\"` | 检索邮政编码为 50000\
  \ 或更高的行 |\n| `column < value` | `zip < \"50000\"` | 检索邮政编码为 49999 或更低的行 |\n| `column\
  \ <= value` | `zip <= \"50000\"` | 检索邮政编码为 50000 或更低的行 |\n| `column BETWEEN` | `zip\
  \ BETWEEN \"20000\" AND \"30000\"` | 检索邮政编码在 19999 到 30001 之间的行 |\n\n### 第 4 章：构建数据库\
  \ (103)\n\n\n\n\n\n## SQL 运算符\n\n`zip IN`\n仅选择 `(*value1,value2*,...)` 为 `（90001”,”30044”）`\
  \ 且邮政编码为 90001 或 30044 的行。\n\n`column* NOT IN`\n`zip NOT IN`\n仅选择 `(*value1,value2*,...)`\
  \ 为 `（90001”,”30044”）` 且邮政编码为 90001 或 30044 以外的所有邮政编码的行。\n\n`column* LIKE`\n`zip\
  \ LIKE` “9%”\n选择所有 `value` — 当邮政编码包含通配符 `9%`（匹配任何字符串）和 `\\_`（匹配任何字符）时。\n\n`column*\
  \ NOT LIKE`\n`zip NOT LIKE`\n选择所有 `value` — “9%”\n当邮政编码不包含以通配符 `9%`（匹配任何字符串）和 `\\\
  _`（匹配任何字符）开头时。\n\n# 第二部分：MySQL 数据库\n\n你可以将表 4-4 中的任何表达式与 `AND` 和 `OR` 结合。在某些情况下，你需要使用括号来明确选择准则。例如，你可以使用以下查询来回答老板的紧急需求：在会员目录（Member\
  \ Directory）中找到所有姓以 *B* 开头、居住在圣塔芭芭拉（Santa Barbara）、且电话号码或传真号码中包含数字 8 的人：\n\n```sql\n\
  SELECT lastName,firstName FROM Member\nWHERE lastName LIKE “B%”\nAND city = “Santa\
  \ Barbara”\nAND (phone LIKE “%8%” OR fax LIKE “%8%”)\n```\n\n注意最后一行的括号。如果没有括号，你将无法获得老板要求的结果。没有括号，每个连接符将按照从第一个到最后一个顺序处理，导致结果列表包含：所有姓以\
  \ *B* 开头且居住在圣塔芭芭拉且电话号码包含 8 的成员；以及所有传真号码包含 8 的成员（无论他们是否居住在圣塔芭芭拉，无论他们的姓是否以 *B* 开头）。当处理最后一个\
  \ `OR` 时，系统会选取特征匹配 `OR` 之前表达式或 `OR` 之后表达式的成员。`OR` 之前的表达式通过之前的 `AND` 与前面的表达式连接，并不独立；但\
  \ `OR` 之后的表达式是独立的，这会导致选取所有传真号码包含 8 的成员。\n\n`LIMIT` 指定了可以返回的行数。`LIMIT` 的格式为 `LIMIT\
  \ startnumber,numberofrows`。\n\n你想要检索的第一行是 `startnumber,`，要检索的行数是 `numberofrows.`。如果未指定\
  \ `startnumber`，则默认为 1。要选择居住在德克萨斯州的前三位会员，请使用此查询：\n\n```sql\nSELECT \\* FROM Member\
  \ WHERE state=”TX” LIMIT 3\n```\n\n某些 `SELECT` 查询会找到相同的记录，但在本例中，你只想看到相同记录中的一条——而不是全部。为了防止查询返回所有相同的记录，请在\
  \ `SELECT` 之后立即添加单词 `DISTINCT`。\n\n## 从表中合并信息\n\n在本章之前的章节中，我假设你想要的所有信息都在一张表中。然而，你可能想要合并来自不同表的信息。你可以在一个查询中轻松实现这一点。\n\
  \n你可以在 `SELECT` 查询中使用两个单词来合并来自两个或多个表的信息：\n\n- `UNION`：从一个或多个表中检索行并将它们连续存储在单个结果集中。例如，如果你的查询从一个表选择了\
  \ 6 行，从另一个表选择了 5 行，结果将包含 11 行。\n- `Join`（连接）：将表并排组合，并从两个表中检索信息。\n\n### UNION\n\n\
  `UNION` 用于合并两个或多个 `SELECT` 查询的结果。每个查询的结果将按照上一个查询的结果之后被添加到结果集中。`UNION` 查询的格式如下：`SELECT\
  \ query UNION ALL SELECT query ...`\n\n你可以根据需要组合任意数量的 `SELECT` 查询。`SELECT` 查询包含任何有效的\
  \ `SELECT` 格式，包括 `WHERE` 子句、`LIMIT` 子句等。查询的规则是：\n\n- 所有 `SELECT` 查询必须选择相同数量的列。\n\
  - 查询中选择的列必须包含相同类型的数据。\n\n结果集将包含第一个查询的所有行，然后是第二个查询的所有行，依此类推。结果集中使用的列名是第一个 `SELECT`\
  \ 查询中的列名。\n\n一系列 `SELECT` 查询可以从同一表中选择不同的列，但如果你想要创建一个包含同一表的一列后紧跟同一表另一列的新表，这种情况并不寻常。更有可能你想要合并不同表的列。例如，你可能想要从两个表中合并列。\n\
  \n（注：由于原文后续部分存在大量重复和逻辑混乱，此处翻译已严格遵循原文字面意思进行对齐，以确保格式一致性，但反映了原文的乱码/重复状态）。\n\n[此处原文在之后开始重复了关于“传真号码中包含\
  \ 8”、“姓以 B 开头”、“居住在圣塔芭芭拉”等逻辑的循环描述]\n\n\n\n\n\nON `table1.col1`= `table2.col2`\n\n\
  在这三个查询中，`table1` 和 `table2` 都是要连接的表。你可以连接两个以上的表。在这两个查询中，`col1` 和 `col2` 是用于匹配连接表的列名。表是根据这些列中的数据进行匹配的。这两个列可以有相同的名称，也可以有不同的名称。这两个列必须包含相同的数据类型。\n\
  \n作为内连接和外连接的示例，考虑一个简短版的宠物目录（Pet Catalog）。一张表是 `Pet`，包含两个列 `petName` 和 `petType`，它们持有以下数据：\n\
  \n`petName` \n`petType`\n\nUnicorn\nHorse\nPegasus\nHorse\nLion\nCat\n\n第二张表是 `Color`，包含两个列\
  \ `petName` 和 `petColor`，它们持有以下数据：\n\n`petName`\n`petColor`\n\nUnicorn\nwhite\n\
  Unicorn\nsilver\nFish\nGold\n\n你需要提出一个需要从两个表中都获取信息的问题。如果你使用以下查询进行内连接：\n\n```sql\n\
  SELECT * FROM Pet,Color WHERE Pet.petName = Color.petName\n```\n\n你将得到包含四列的后续表：`petName`（来自\
  \ `Pet`）、`petType`、`petName`（来自 `Color`）和 `petColor`。\n\n`petName`\n`petType`\n\
  `petName`\n`petColor`\n\nUnicorn\nHorse\nUnicorn\nwhite\nUnicorn\nHorse\nUnicorn\n\
  silver\n\n注意，结果表中只出现了 `Unicorn` —— 因为在连接之前，只有 `Unicorn` 同时存在于两个原始表中。另一方面，假设你使用以下查询进行左外连接：\n\
  \n```sql\nSELECT * FROM Pet LEFT JOIN Color ON Pet.petname=Color.petName\n```\n\n\
  ## 108 第二部分：MySQL 数据库\n\n你得到如下结果表，具有相同的四列——`petName`（来自 `Pet`）、`petType`、`petName`（来自\
  \ `Color`）和 `petColor`，但行不同：\n\n`petName`\n`petType`\n`petName`\n`petColor`\n\n\
  Unicorn\nHorse\nUnicorn\nwhite\nUnicorn\nHorse\nUnicorn\nsilver\nPegasus\nHorse\n\
  <NULL>\n<NULL>\nLion\nCat\n<NULL>\n<NULL>\n\n此表有四行。它与内连接的前两行相同，但额外增加了两行 —— 这些行存在于左侧的\
  \ `Pet` 表但在 `Color` 表中不存在。注意最后两行来自 `Color` 表的列是空的。\n\n再次，假设你使用以下查询进行右外连接：\n\n```sql\n\
  SELECT * FROM Pet RIGHT JOIN Color ON Pet.petName=Color.petName\n```\n\n你得到如下结果表，具有相同的四列，但行仍然不同：\n\
  \n`petName`\n`petType`\n`petName`\n`petColor`\n\nUnicorn\nHorse\nUnicorn\nwhite\n\
  Unicorn\nHorse\nUnicorn\nsilver\n<NULL>\n<NULL>\nFish\nGold\n\n注意这些结果包含了右侧 `Color`\
  \ 表的所有行，但没有包含 `Pet` 表。注意 `Pet` 表列中的空白，因为它没有 `Fish` 这一行。\n\n我到目前为止讨论的连接是查找表中的匹配项。\n\
  \n有时，找出表中哪些行在另一张表中没有匹配项是有用的。要做到这一点，你可以使用 `LEFT JOIN` 或 `RIGHT JOIN`。\n\n\n\nMySQL\
  \ 提供了一套安全系统来保护你的数据。没有账户，任何人无法访问你数据库中的数据。每个 MySQL 账户具有以下属性：\n\n- ✓ 名称\n- ✓ 一个 `hostname`\
  \ — 账户可以访问 MySQL 服务器的机器\n- ✓ 密码\n- ✓ 一组权限\n\n## 112 第二部分：MySQL 数据库\n\n要访问你的数据，必须使用一个有效的账户名并知道该账户关联的密码。此外，该人员必须从允许通过该特定账户连接到你数据库的计算机进行连接。\n\
  \n在授予用户数据库访问权限后，他或她对数据可以的操作取决于为账户设置的权限。每个账户被允许或不允许在你的数据库中执行某些操作，例如 `SELECT`、`DELETE`、`INSERT`、`CREATE`\
  \ 或 `DROP`。指定账户可以做什么设置称为 `privileges`（权限）或 `permissions`。你可以设置一个拥有所有权限、无权限或介于两者之间的任何权限账户。例如，对于在线产品目录，你希望客户能够看到目录中的信息，但不能更改它。\n\
  \n当用户尝试连接到 MySQL 并执行查询时，MySQL 会分两个阶段对数据的访问进行控制：\n\n- ✓ **连接验证：** MySQL 检查账户名和密码的有效性，并检查连接是否来自允许使用指定账户连接到\
  \ MySQL 服务器的主机。如果一切检查通过，MySQL 将接受该连接。\n- ✓ **请求验证：** 在 MySQL 接受连接后，它会检查账户是否具有执行指定查询所需的必要权限。如果是，MySQL\
  \ 将执行该查询。\n\n你发送到 MySQL 的任何查询都可能失败，是因为第一步中连接被拒绝，或者是因为第二步中查询未被允许。系统会返回错误消息以帮助你识别问题所在。\n\
  \n在接下来的几个章节中，我将详细介绍账户和权限。\n\n### 理解账户名和主机名 \n\n账户名和 `hostname`（授权连接到数据库的计算机名称）共同标识一个唯一的账户。两个同名但主机名不同的账户可以存在，并且可以拥有不同的密码和权限。然而，你*不能*拥有两个相同名称*且*相同主机名的账户。\n\
  \nMySQL 账户名与 Unix、Linux 或 Windows 的用户名（有时也称为 `login name`）完全没有任何关系。如果你使用名为 `root`\
  \ 的 MySQL 管理员账户，它与 Unix 或 Linux 的 root 登录名没有关系。更改 MySQL 登录名不会影响 Unix、Linux 或 Windows\
  \ 的登录名，反之亦然。\n\n**第 5 章：保护你的数据** 113\n\nMySQL 账户名和主机名的定义如下：\n\n- ✓ **账户名长度可达 16\
  \ 个字符。** 你可以在账户名中使用特殊字符，例如空格或连字符 (`-`)。但是，你不能在账户名中使用通配符。\n- ✓ **账户名可以为空。** 如果 MySQL\
  \ 中存在一个账户名空的账户，那么任何账户名对于该账户都是有效的。\n\n如果用户从允许连接到空白账户名的主机连接，并使用了正确的密码（如果需要），则用户可以使用任何账户名连接到你的数据库。你可以使用空命名的账户允许匿名用户连接。\n\
  \n- ✓ **主机名可以是通配符。** 当使用 XAMPP 安装 MySQL 时，`root@localhost` 账户在安装时没有密码，这意味着使用该账户访问数据库不需要密码。由于任何人无法从任何其他机器访问数据库，因此没有密码可能是没问题的。但是，如果其他人可以访问你的本地计算机，你可能想为此账户添加密码。\n\
  \n当你获得 Web 托管账户时，系统会提供一个 MySQL 账户和密码。这些信息应该在当时提供给你。\n\n### 了解密码\n\n一个好的密码应该难以猜测且容易记忆。如果太难记忆，你可能需要把它写下来，这违背了设置密码的初衷。创建一个好密码的一种方法是使用短语的首字母字符。\n\
  \n\n\n权限可以单独授予或移除，也可以一次性全部。表 5-1 列出了你可能想要分配或移除的一些权限。\n\n### 表 5-1：MySQL 账户权限\n\n\
  | 权限 | 描述 |\n| :--- | :--- |\n| `ALL` | 所有权限 |\n| `ALTER` | 可以修改表结构 |\n| `CREATE`\
  \ | 可以创建新的数据库或表 |\n| `DELETE` | 可以删除表中的行 |\n| `DROP` | 可以删除数据库或表 |\n| `FILE` | 可以在服务器上读写文件\
  \ |\n| `GRANT` | 可以更改账户的权限 |\n| `INSERT` | 可以向表中插入新行 |\n| `SELECT` | 可以从表中读取数据 |\n\
  | `SHUTDOWN` | 可以关闭 MySQL 服务器 |\n| `UPDATE` | 可以修改表中的数据 |\n| `USAGE` | 无权限 |\n\n\
  授予 `ALL` 权限不是一个好主意，因为它包含了管理操作权限，例如关闭 MySQL 服务器。你不希望除你自己之外的其他人拥有此类权限。\n\n# 第二部分：MySQL\
  \ 数据库\n\n## 设置 MySQL 账户\n\n*账户*通过账户名称和允许访问 MySQL 的计算机名称来标识。你有一个用于管理 MySQL 数据库的账户。该账户显示在\
  \ phpMyAdmin 主页。在你的本地计算机上，它可能是 `root@localhost`。这是你开发所需的唯一账户，因为没有人从外部访问它。\n\n在你的托管主机上，账户可能是\
  \ `domain@localhost` 或其他。网络托管公司使用不同的命名规范。\n\n然而，你不需要担心主机名。你的主机会处理这一点。你可以在 phpMyAdmin\
  \ 主页看到账户和主机名。如果你使用的是托管网站，公司的 IT 人员会为你提供账户名和主机名。\n\n书中，你将学习编写与数据库交互的 PHP 脚本。脚本可能会从数据库检索数据显示在网页上，或将表单数据存储到数据库。出于安全考虑，你不希望脚本使用的账户拥有比必要的更多的权限。如果脚本使用的账户只有\
  \ `SELECT` 权限，你就不必担心坏人利用脚本来删除或更改数据或用于其他目的。\n\n你需要在你的网站上至少创建一个受限制的账户供 PHP 脚本使用。创建新账户时，你可以指定密码，也可以稍后添加密码。在创建账户或添加/移除权限时，你可以设置权限。\n\
  \n你不需要为本地计算机上的 PHP 脚本创建一个受的账户，因为外部没有人可以访问脚本。你只需要为访问网站的 PHP 脚本创建一个新账户。\n\n以下章节描述了如何在托管账户上创建账户、添加或更改密码以及添加/移除账户权限。如果你的网站托管在公司，你需要与公司的\
  \ IT 人员讨论添加账户。\n\n## 第 5 章：保护你的数据\n\n### 添加账户\n\n通过 PHP 访问 MySQL 的优方法是专门为此目的设置账户，并仅所需的权限。某些主机不允许你创建新账户。如果你无法在托管账户上创建新账户，可能你的主机会为你创建一个具有限制权限的新账户。\n\
  \n创建账户的一种方式直接向存储账户信息的 `mysql` 数据库发送 SQL 语句，如 `INSERT` 或 `UPDATE`。\n\n这是安装 MySQL\
  \ 时创建的数据库。然而，大多数主机不允许你访问此数据库，无论是通过发送直接 SQL 语句影响该数据库还是通过 phpMyAdmin 界面。\n\n与 `mysql`\
  \ 数据库交互通常会产生错误消息，例如：\n\n```\nAccess denied for user ‘me’@’localhost’ to database\
  \ ‘mysql’\n```\n\n大多数主机并没有直接让你访问 `mysql` 数据库，而是专门提供了一个用于创建和管理账户的页面。你需要查看控制面板图标以找到创建\
  \ MySQL 账户的图标。因为是 MySQL 账户，图标可能位于控制面板的数据库部分。它可能是你用于创建新 MySQL 数据库时使用的同一个图标。如果你无法确定它在哪里，请阅读主机提供的文档或咨询托管公司的技术支持。\n\
  \n以下步骤显示了如何在 `cPanel`（一种许多网络托管公司使用的流行控制面板）上创建新账户：\n\n1. **在你的托管账户上打开 cPanel。**\n\
  2. **找到并点击 MySQL 数据库图标。**\n   在 `cPanel` 中，图标位于标记为“Databases”的部分。图标显示为“MySQL Databases”。\n\
  \   打开 MySQL 数据库页面。注意页面列出了所有当前数据库，以及允许访问数据库的账户名称。\n3. **点击右上角的跳转到 MySQL Users，或向下滚动到\
  \ MySQL Users 部分。**\n   图 5-1 显示了页面的 MySQL Users 部分。该部分列出了所有账户。\n\n![Image 14](img/index-138_1.jpg)\n\
  *图 5-1：MySQL 数据库页的 MySQL Users 部分。*\n\n4. **在 Username 字段中输入新账户名。**\n5. **在 Password\
  \ 字段中输入密码。**\n   注意密码下方标记为“Password Strength”（密码强度）的字段。字段中的条形显示了密码的强度。该密码并不强，小于\
  \ 50%。增加密码强度的因素包括长度；确保不是字典中的单词；使用字符、数字和符号。\n   注意 Generate Password 按钮。我保证点击按钮生成的密码强度将是\
  \ 100%，但也保证你无法记忆。\n6. **在 Password (Again) 字段中输入相同的密码。**\n   这种重复是为了确保输入的密码正确。\n\
  7. **点击 Create User 按钮。**\n   显示一个新账户和密码的页面。\n8. **点击 Go Back 返回 MySQL 页面。**\n \
  \  你刚刚创建的账户现在列在 MySQL 页面的用户列表中。然而，如果你滚动到数据库列表，将不会在任何数据库处看到该新账户。此时，账户存在但无法访问任何数据库。你必须允许它访问一个或多个数据库，如下节所示。\n\
  \n### 允许访问数据库\n\n如果你按照上一节描述的操作，没有账户可以自动访问任何数据库。你必须专门允许账户\n\n![Image 15](img/index-139_1.jpg)\n\
  \n访问每个数据库。你可以允许账户访问你希望它使用的多个数据库。\n\n要允许访问，执行以下步骤：\n\n1. **进入 MySQL 数据库页的 MySQL User\
  \ 部分。**\n   你可以在之前的图 5-1 中看到该部分。\n   用户列表应包含你所有的账户，包括你刚刚创建的新账户。\n2. **在 Add User\
  \ to Database 部分，从 User 下拉列表中选择用户。**\n   列表包含所有的现有账户。\n3. **从 Database 下拉列表中选择一个数据库。**\n\
  \   你所有的当前数据库都包含在列表中。\n4. **点击 Add 按钮。**\n   所选用户将获得所选数据库的访问权限。\n\n\n\n\n`Manage\
  \ User Privileges` 页面打开后会显示该账户对所选数据库拥有的权限。由于你是第一次让此账户访问数据库，该账户目前没有任何权限。你无疑想要选择某些权限，即使只是\
  \ `SELECT`。\n\n**5. 勾选你想要在此账户在该数据库上拥有的权限旁边的复选框。**\n\n图 5-2 显示了你选择某些权限后的 `Manage\
  \ User Privileges` 页面。你可以随时更改权限，如下一节所示。\n\n**图 5-2：**\n\n管理用户权限页面。\n\n![Image 16](img/index-140_1.jpg)\n\
  \n120 **第二部分：MySQL 数据库**\n\n**6. 点击 Make Changes 按钮。**\n\n将显示一个页面，表明更改成功。\n\n**7.\
  \ 返回 Database 页面。**\n\n该账户现在列在数据库列表的名称旁边，显示该账户现在已拥有该数据库的权限。\n\n### 更改权限\n\n你可以授予账户的数据库权限在本章的前面已经列出并解释过。账户应只被其所需的权限。上一节解释了在创建新账户时如何设置权限。在本节中，你将看到如何更改现有账户的权限。\n\
  \n要更改账户权限，请遵循以下步骤：\n\n**1. 在你的 Web 托管账户上打开 cPanel。**\n\n**2. 找到并点击 MySQL databases\
  \ 图标。**\n\n打开 `MySQL databases` 页面。\n\n**3. 滚动到页面的 Current Databases 部分。**\n\n你可以看到你当前的\
  \ MySQL 数据库列表，如图 5-3 所示。\n\n**图 5-3：**\n\n你的 MySQL 数据库列表。\n\n在数据库列表中，每个数据库名称都开头一行。第三列包含允许访问该数据库的账户名称。\n\
  \n多个账户可以访问同一个数据库。\n\n**4. 找到你想要更改权限的数据库所在的行。**\n\n如果你想要修改的账户没有列在允许访问该数据库的列表中，你必须先将其添加到允许访问此数据库的账户列表中。要添加账户，请按照上一节“Allowing\
  \ access to a database”中的说明。\n\n**5. 在想要更改权限的数据库行中，点击你想要修改的账户名称。**\n\n`Manage Account\
  \ Privileges` 页面打开，如之前的图 5-2 所示。该页面显示了此账户对该数据库拥有的当前权限。\n\n**6. 勾选你想要添加或删除的权限复选框。**\n\
  \n**7. 点击 Make Changes 按钮。**\n\n如果不点击此按钮，更改将不会保存。\n\n将显示一个结果页面，表明权限已更新。\n\n### 添加和更改密码\n\
  \n在创建账户时，你可以添加密码，也可以不添加。你可以更改密码或为现有账户添加密码；在创建账户时不需要添加密码。\n\n要更改密码，请再次添加该账户。也就是说，使用你创建账户时使用的相同步骤。在\
  \ `Add New User` 部分，输入你想更改密码的账户名称，并在 `Password` 和 `Password (Again)` 字段中输入新密码。\n\
  \n要更改密码，请再次添加该账户。也就是说，使用你创建账户时使用的相同步骤。在 `Add New User` 部分，输入你想更改密码的账户名称，并在 `Password`\
  \ 和 `Password (Again)` 字段中输入新密码。\n\n要更改密码，请再次添加该账户。也就是说，使用你创建账户时使用的相同步骤。在 `Add New\
  \ User` 部分，输入你想更改密码的账户名称，并在 `Password` 和 `Password (Again)` 字段中输入新密码。\n\n```\nSET\
  \ PASSWORD FOR 'username'@'host' BY 'new_password';\n```\n\n### 删除账户\n\n当你需要从数据库中删除账户时，请遵循以下步骤：\n\
  \n**1. 在你的 Web 托管账户上打开 cPanel。**\n\n**2. 找到并点击 MySQL databases 图标。**\n\n打开 `MySQL\
  \ databases` 页面。\n\n**3. 滚动到页面的 Current Databases 部分。**\n\n你可以看到你当前的 MySQL 数据库列表，如图\
  \ 5-3 所示。\n\n**4. 找到你想要更改权限的数据库所在的行。**\n\n**5. 点击你想要删除的账户名称。**\n\n**6. 点击 Delete\
  \ 按钮。**\n\n显示一条确认消息。点击 `Yes` 删除账户。\n\n## 备份你的数据\n\n你需要为数据准备两份副本：一份放在可以快速替换的地方，另一份存放在与网站不同的物理位置。这可以保护你免受如电脑故障、文件损坏或建筑火灾等灾害的影响。\n\
  \n通常，你应该根据自己认为必要的频率频繁备份数据库。Web 托管商可能也会存储备份副本，但最好你自己也拥有一份。\n\n\n\n\n\n# phpMyAdmin\n\
  \n## 导出页面\n\n4. 在主面板左侧的“导出”（Export）部分，在顶部的列表框中，选择你想要导出的表。\n\n5. 在导出部分，选择 `SQL` 单选按钮。\n\
  \n6. 如果尚未勾选，勾选“结构”（Structure）选择框以及“结构”部分顶部的四个复选框。\n\n7. 如果尚未勾选，勾选“数据”（Data）选择框和“对二进制数据使用十六进制”（Use\
  \ Hexadecimal for Binary Data）选择框（或“对 BLOB 使用十六进制”选择框）。\n\n8. 滚动到“文件”（File）部分（见图\
  \ 5-6）。\n\n**图 5-6：** phpMyAdmin 导出页面的“保存为文件”部分。\n\n9. 勾选“保存为文件”（Save As File）选择框。\n\
  \n10. 指定文件名。\n\n`文件名模板`File Name Template）字段包含 `__DB__`，它使用数据库名称保存文件。你可以在文件名中添加文本或特殊字符以使文件名更有意义。在此例中，我添加了\
  \ `%Y%m%d`，这会在导出的文件名中添加当前日期。\n\n11. 勾选“记住模板”（Remember Template）选择框。\n\n12. 在“压缩”（Compression）旁边，选择“无”（None）单选按钮。\n\
  \n13. 点击“执行”（Go）。\n\n浏览器的“保存文件”窗口将打开。你会看到正在保存的文件名。\n\n14. 选择将文件保存到磁盘的选项并点击“确定”（OK）。\n\
  \n文件将保存在浏览器保存的位置。如果你将浏览器设置为询问保存文件的位置，会打开一个窗口，你可以导航到想要保存文件的目录。在这个示例中，我的本地计算机上保存了一个名为\
  \ `jvalade_PetStore-20090520` 的文件。\n\n现在，你拥有了数据库的备份副本。你可以将该文本文件保存到你的 Web 托管、本地计算机、邻居的计算机，以及任何其他让你觉得数据安全的地方。然后，你可以从任何安装了\
  \ `MySQL` 的计算机上通过此文件轻松地重建数据库。\n\n### 查看导出文件\n\n通过 `phpMyAdmin` 导出功能导出的文件是一个文本文件，包含了重建数据库所需的\
  \ SQL 查询语句，与你导出时的状态完全一致。它包含了数据库中每个表的 `CREATE` 查询。它还包含了表中每行数据的 `INSERT` 查询。\n\n以下是包含重建两个表（`Member`\
  \ 和 `Login`）所需查询的导出文件。\n\n```sql\n-- phpMyAdmin SQL Dump\n-- version 2.11.9.5\n\
  -- http://www.phpmyadmin.net\n--\n-- Host: localhost\n-- Generation Time: May 22,\
  \ 2009 at 03:28 PM\n-- Server version: 5.1.30\n-- PHP Version: 5.2.5\nSET SQL_MODE=\"\
  NO_AUTO_VALUE_ON_ZERO\";\n--\n-- Database: `jvalade_PetStore`\n--\n-- -------------------------------------------------------\n\
  --\n-- Table structure for `Login`\n--\nDROP TABLE IF EXISTS `Login`;\nCREATE TABLE\
  \ IF EXISTS `Login` (\n  loginName varchar(20) NOT NULL,\n  loginTime datetime NOT\
  \ NULL\n) ENGINE=MyISAM CHARSET=latin1;\n--\n-- Dumping data for `Login`\n--\n--\
  \ -------------------------------------------------------\n--\n-- Table structure\
  \ for `Member`\n--\nDROP TABLE IF EXISTS `Member`;\nCREATE TABLE IF EXISTS `Member`\
  \ (\n  loginName varchar(20) NOT NULL,\n  password varchar(255) NOT NULL,\n  createDate\
  \ date NOT NULL,\n  lastName varchar(50) NOT NULL,\n  fName varchar(40) NOT NULL,\n\
  \  street varchar(50) NOT NULL,\n  city varchar(50) NOT NULL,\n  status char(2)\
  \ NOT NULL,\n  zip char(10) NOT NULL,\n  email varchar(50) NOT NULL,\n  phone varchar(15)\
  \ NOT NULL,\n  PRIMARY KEY (loginName)\n) ENGINE=MyISAM CHARSET=latin1;\n--\n--\
  \ Dumping data for `Member`\n--\nINSERT INTO `Member` (loginName, password, createDate,\
  \ lastName, firstName, street, city, status, zip, email, phone) VALUES\n('joey',\
  \ 'secret', '2009-05-12', 'Customer', 'Joe', 'Oak St', 'CA', '12345-1234', 'me@home.com',\
  \ '888-8888'),\n('sammy', 'secret', '2009-05-22', 'Customer', 'Sam', 'Pine St',\
  \ 'New York', 'NY', '54321-4321', 'sam@customer.com', '8888');\n```\n\n注意每个表的最后部分都是\
  \ `Dumping data for table`（导出表数据）。对于第一个表 `Login`，此部分不包含 `INSERT` 查询，因为该表是空的。对于 `Member`\
  \ 表，导出部分包含一个插入三行数据的 `INSERT` 查询。\n\n如果由于某种原因你无法使用 `phpMyAdmin` 备份数据库，你可以使用 `mysqldump`\
  \ 程序创建相同的文本文件。`mysqldump` 程序在安装 `MySQL` 时已自动安装。使用 `mysqldump` 程序的说明可以在 MySQL 在线文档中找到，例如\
  \ `http://dev.mysql.com/doc/refman/5.1/en/mysqldump.html`。\n\n## 恢复数据\n\n`phpMyAdmin`\
