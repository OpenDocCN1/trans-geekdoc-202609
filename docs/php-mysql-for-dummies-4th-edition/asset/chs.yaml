  \n### 删除数据库\n\n你可以使用 `phpMyAdmin` 在本地计算机上删除数据库，步骤如下：\n\n1. **打开 phpMyAdmin 主页。**\n\
  \n2. **点击要删除的数据库名称。**\n\n你所有的数据库名称出现在左窗中。你可能需要从下拉列表中选择数据库。\n\n页面打开并显示数据库的名称和结构。页面顶部显示一组选项卡，如图\
