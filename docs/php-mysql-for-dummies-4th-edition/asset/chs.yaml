  \ 文件更改设置 (418)\n# 使用 PHP 语句更改设置 (419)\n# 索引 (421)\n\n## 引言\n\n欢迎来到令人兴奋的 Web 数据库应用世界。本书提供了构建任何\
  \ Web 数据库应用程序的基础技术，但我确实建议你从一个简单的应用开始。在本书中，我开发了两个示例应用程序，这两个程序被选用来代表 Web 上经常遇到的两种类型的应用程序：产品目录，以及需要用户注册并使用密码登录的客户或会员专属网站。这些示例程序的复杂度足够复杂，需要多个程序并使用各种数据和数据处理技术，但它们又足够简单，易于理解并适应到各种\
  \ Web 网站。在掌握了这些简单应用后，你可以扩展基础设计，包含你能想象到的所有功能。\n\n### 关于本书\n\n将这本书看作是你构建 Web 数据库应用程序的友好指南。本书的设计目的是作为参考资料，而不是教程，因此你不需要从头到尾阅读。你可以从任何地方开始阅读——第\
  \ 1 章、第 9 章，或者任何地方。我将构建 Web 数据库应用程序的任务分解成易于的信息块，因此请查看目录并找到你感兴趣的话题。如果你需要了解另一个章节的信息来理解你正在阅读的章节，我会引用该章节。\n\
  \n以下是我讨论的话题示例：\n\n* 构建和使用 `MySQL` 数据库\n* 在 `HTML` 文件中添加 `PHP`\n* 使用 `PHP` 语言的特性\n\
  * 使用 `HTML` 表单从用户处收集信息\n* 在 Web 页面中显示来自数据库的信息\n* 在数据库中存储信息\n\n### 本书使用的约定\n\n本书包含了许多\
  \ `PHP` 编程语句、`MySQL` 语句和 `HTML` 的示例。这些语句以不同的字体显示，看起来如下行：\n\nA A PHP 程序语句\n\n此外，`PHP`、`MySQL`\
  \ 和 `HTML` 的代码片段或关键术语有时出现在段落正文中。当它们出现时，段落中的特殊文本也将以示例字体显示，与段落字体不同。例如，这段文字就是段落文本中\
  \ `PHP` 语句的示例。\n\n在示例中，你经常会看到一些斜体单词。斜体单词是通用类型，需要替换为适用于你数据的特定名称。例如，当你看到如下所示示例时：`SELECT\
  \ *field1*, *field2* FROM *tablename*`\n\n`field1,`、`field2,` 和 `tablename` 需要替换为真实名称，因为它们是斜体。当你在程序中使用此语句时，可能会以以下形式使用：\n\
  \n`SELECT name,age FROM Customer`\n\n此外，你可能会在示例行的列表后面看到三个点（... )）。\n\n你不需要输入这三个点。它们仅意味着你可以在列表中包含任意数量的项目。例如，当你看到\
  \ `SELECT *field1*, *field2*, *...* FROM *tablename*` 时，三个点仅意味着你的字段列表可以比两个长。这意味着你可以继续写\
  \ *field3*、*field4* 等。例如，你的语句可能是\n\n`SELECT name,age,height,shoesize FROM Customer`\n\
  \n每隔一段时间，你还还会看到一些加粗的内容。注意这些内容；它们表示我希望你看到的内容或你需要输入的内容。\n\n### 你不需要阅读的内容\n\n书中的某些信息被标记为*技术内容（Technical\
  \ Stuff）*，并在左侧有一个图标。有时你会在侧边栏中看到这些技术内容：将其视为创建 Web 数据库应用不需要阅读的信息。这些额外信息可能包含对底层的进一步观察，或描述了需要更多技术知识才能执行的技术。某些读者可能对额外的技术信息或技术感兴趣，但如果你觉得它们没有趣味或用处，请尽管忽略它们。\n\
  \n### 愚人的假设\n\n为了写一本重点突出而非百科全书，我需要假设你作为读者具备某些背景。我假设你了解 `HTML` 和 `CSS`，并且用 `HTML`\
  \ 和 `CSS` 创建过 Web 网站。因此，尽管我在许多示例中使用了 `HTML/CSS`，但我并没有解释 `HTML/CSS`。如果你不知道 `HTML/CSS`，这本书将变得难以使用。\n\
  \n## 本书的结构\n\n本书分为六部分，每部分包含几个章节。\n\n### 第一部分：使用 PHP 和 MySQL 开发 Web 数据库应用\n\n第一部分概述了使用\
  \ `PHP` 和 `MySQL` 创建 Web 数据库应用概况。它描述并给出了 `PHP`、`MySQL` 以及它们结合使用的优势。你将了解到如何开始，包括你需要什么、如何获取\
  \ `PHP` 和 `MySQL` 以及如何测试你的软件。然后你将了解开发应用程序的过程。\n\n# 第二部分：MySQL 数据库\n\n在第二部分中，你将了解处理\
  \ `MySQL` 数据库的细节。你创建一个数据库、更改数据库，并将数据移入和移出数据库。\n\n# 第三部分：PHP\n\n第三部分提供了编写 `PHP` 程序的细节，使你的\
  \ Web 页面能够插入新信息、更新现有信息或从 `MySQL` 数据库中删除信息。你将了解到如何使用用于数据库交互和表单处理的 `PHP` 特性。\n\n###\
  \ 第四部分：应用程序\n\n第四部分描述了整个 Web 数据库应用程序。你将如何将 `PHP` 程序组织成一个与数据库交互的有效应用程序。书中提供了两个完整的示例应用程序，并进行了描述和解释。\n\
  \n### 第五部分：十项原则\n\n第五部分提供了一些在开发 Web 数据库应用时应该做和不要做的重要事项列表。\n\n# 第六部分：附录\n\n最后一部分第六部分为需要自行安装软件的人提供了安装\
  \ `PHP` 和 `MySQL` 的说明。附录 B 讨论如何配置 `PHP`。\n\n### 本书使用的图标\n\n此图标类似于便签，突出了值得记在心心的信息。\n\
  \n\n\n\n\n此图标标记了比书中其他部分更具技术性的信息和技巧。这里的信息可能有趣且有用，但你不需要理解它们就能使用书中的信息。\n\n提示（Tips）为特定目的提供额外信息。提示可以为你节省时间和精力的，因此非常值得一读。\n\
  \n你应该始终阅读警告（Warnings）。警告强调了你必须采取或必须避免的操作，以防止严重后果。\n\n## 接下来去哪里\n\n本书是按照完成任务的顺序组织内容的。如果你是一个新手，可能需要从\
  \ `Part I` 开始，该部分描述了如何着手，包括如何设计应用程序的组件以及这些组件将如何相互作用。在实现应用程序时，你需要先创建 `MySQL` 数据库，因此我在讨论\
  \ `PHP` 之前先讨论了 `MySQL`。在你了解 `MySQL` 和 `PHP` 的细节之后，你需要将它们整合成一个完整的应用程序，我在 `Part IV`\
  \ 中对其进行了描述。如果你已经熟悉书中的任何部分，可以直接跳转到你需要的部分。例如，如果你熟悉数据库设计，可以直接跳转到 `Part II`，该部分描述了如何在\
  \ `MySQL` 中实现该设计。或者如果你了解 `MySQL`，只需要阅读 `Part III` 中关于 `PHP` 的内容。\n\n如果你想获取*更多*信息，请查看\
