  \n320 第四部分：应用程序**\n\n# 第 11 章：构建在线目录\n\n## 本章内容\n* 设计在线目录\n* 为 Pet Catalog 构建数据库\n\
  * 为 Pet Catalog 设计 Web 页面\n* 为 Pet Catalog 编写程序\n\n在线目录在 Web 上随处可见。每个拥有产品的企业都会使用在线目录。有些企业利用在线目录销售产品，另一些企业利用它们向世界展示产品质量。客户通常在\
  \ Web 上开始搜索产品，通过 Web 查询可用性和价格。\n\n在本章中，你将了解如何构建一个在线目录。我选择宠物商店目录是因为它听起来比袜子目录更有趣。而且看宠物目录的照片比看袜子的照片有趣得多。我在第\
  \ 3 章中引入了 Pet Catalog 示例，并在贯书中多次使用了它。\n\n\n\n\n\n例如，如果客户选择了“狗”，目录随后会显示柯 Collie 犬、斯猎犬和狼。某些类型的产品在看到具体的产品之前，可能会有更多层级的类别。例如，家具可能有三层，而不是两层。顶层可能是房间，如厨房或卧室；第二层可能是类型，如椅子或桌子；第三层就是具体的产品。\n\
  \n目录的目的是促使查看它的人立即购买。对于宠物目录（Pet Catalog）而言，图片是促使客户购买的主要因素。宠物的照片会让人们发出“噢——”和“啊——”的惊叹，并说：“它真太可爱了！”这会产生销售额。你的宠物目录的首要目的是展示宠物照片。此外，目录还应该显示描述和价格。\n\
  \n# 第 11 章：构建在线目录\n\n为了向客户展示宠物，宠物目录将执行以下操作：\n1. 显示宠物类型列表并允许客户选择一种类型。\n2. 显示与所选类型匹配的宠物信息。这些信息包括描述、价格和宠物照片。\n\
  \n## 向目录中添加宠物\n\n你可以通过多种方式向目录中添加项目，但最简单的方法是使用专为此目的设计的应用程序。在许多情况下，你不会是那个向目录中添加产品的人。为你的目录应用程序添加维护功能的原因之一，是为了让其他人可以执行那些无聊的维护任务。目录越容易维护，错误渗入其中的可能性就越小。\n\
  \n一个向目录中添加宠物的应用程序应该执行以下操作：\n1. 提示用户输入宠物的类型。\n\n可能的宠物类型选择列表可以消除许多错误，例如替代拼写方式（`dog`\
  \ 和 `dogs`）和拼写错误。应用程序还需要在用户需要时允许添加新类别。\n\n2. 提示用户为宠物输入名称，例如 `collie` 或 `shark`。\n\
  \n名称选择列表将有助于防止错误。应用程序还需要在用户需要时允许添加新名称。\n\n3. 提示用户为新宠物输入宠物信息。\n\n应用程序应该明确说明需要哪些信息。\n\
  \n4. 将信息存储在目录中。\n\n目录条目应用程序可以检查数据错误，并将数据输入到正确的位置。输入新宠物的人不需要了解目录的内部机制。\n\n## 构建数据库\n\
  \n目录本身就是一个数据库。它也不非必须数据库；也可以将目录存储为一系列 HTML 文件，这些文件在 HTML 标签中包含产品信息，并在客户点击链接时显示相应的文件。然而，一想到维护这样的目录就让我感到头大。\n\
  \n想象一下手动添加和删除目录项目的枯燥——或者通过搜索许多文件来为每个项目寻找正确的位置。唉。由于这些原因，将你的宠物目录放在数据库中更好。\n\n### 第四部分：应用程序\n\
  \n`PetCatalog` 数据库包含了所有关于宠的所有信息。它使用了三个表：\n- `Pet` 表\n- `PetType` 表\n- `Color` 表\n\
  \n构建宠物目录的第一步是构建数据库。在没有可以运行的数据库来测试程序的情况下，编写程序几乎是不可能的。首先设计你的数据库；然后构建它；最后添加数据（或至少是开发程序时的一些示例数据）。\n\
  \n### 构建 Pet 表\n\n在你的宠物目录设计中，主表是 `Pet` 表。它包含了你出售的单个宠物的信息。以下 SQL 查询创建了 `Pet` 表：\n\
  \n```sql\nCREATE TABLE Pet (\n  petID INT(5) SERIAL,\n  petName VARCHAR(25) NOT\
  \ NULL,\n  petType VARCHAR(15) NOT NULL DEFAULT “Misc”,\n  petDescription VARCHAR(255),\n\
  \  price DECIMAL(9,2),\n  pix CHAR(15) NOT NULL DEFAULT “na.gif”,\n  PRIMARY KEY(petID)\
  \ );\n```\n\n`Pet` 表的每行代表一只宠物。列如下：\n- `petID`: 宠物的序列号。在另一个目录中，这可能是产品号、序列号或用于订购产品的编号。`petID`\
  \ 列是主键，必须是唯一的。MySQL 不允许输入两个相同 `petID` 的行。\n\n`CREATE` 查询将 `petID` 列定义为 `SERIAL`（在\
  \ MySQL 4.1 中添加）。`SERIAL` 是一个关键字，按以下方式定义列：\n- `BIGINT`: 字段中的数据预期为数字整数，范围可达 18446744073709551615。数据库不接受该字段中的字符字符串。\n\
  - `UNSIGNED`: 字段中的整数不能为负数。\n- `NOT NULL`: 此定义意味着该字段不能为空。它必须有值。主键必须始终为 `NOT NULL`。\n\
  - `AUTO-INCREMENT`: 此定义意味着如果你不提供特定的数字，该字段不会自动填充顺序数字。例如，如果添加的一行的 `petID` 为 98，那么下一行添加的\
  \ `petID` 将 99，除非你指定了不同的数字。这是指定具有唯一数字列（如产品号或订单号）的有用方法。\n\n你始终可以用自己的数字来覆盖自动序列号，但如果你不提供数字，就会存储一个顺序数字。\n\
  \n**注意：** 如果你使用 `phpMyAdmin` 创建数据库，`SERIAL` 关键字可能不可用。你需要将 `petID` 定义为 `BIGINT`、`UNSIGNED`、`NOT\
  \ NULL` 和 `AUTO_INCREMENT`，并将其专门定义为主键。\n\n- `petName`: 宠物的名称，例如狮子、柯 Collie 犬或独角兽。`CREATE`\
  \ 查询按以下方式定义 `petName` 列：\n- `VARCHAR(25)`: 此数据类型将字段定义为最大长度为 25 个字符的可变字符字符串。字段按其实际长度存储。\n\
  - `NOT NULL`: 此定义意味着该字段不能为空。它必须有值。毕竟，在目录中有一个没有名字的宠物是没有意义的。\n- 无默认值：如果你尝试在向 `Pet`\
  \ 表添加新行时不提供 `petName`，它将不会被添加。为宠物设置默认名称是没有意义的。\n\n- `petType`: 宠物的类型，例如狗或鱼。`CREATE`\
  \ 查询按以下方式定义 `petType` 列：\n- `VARCHAR(15)`: 此数据类型将字段定义为最大长度为 15 个字符的可变字符字符串。字段按其实际长度存储。\n\
  - `NOT NULL`: 此定义意味着该字段不能为空。它必须有值。在线目录将首先显示类别，然后显示类别内的宠物，因此没有类别的宠物永远不会显示在网页上。\n\
  - `DEFAULT “Misc”: 如果你没有为 `petType` 提供值，将存储值 “Misc”。这确保了 `petType` 始终有一个值。\n\n-\
  \ `petDescription`: 宠物的描述。`CREATE` 查询按以下方式定义 `petDescription`：\n- `VARCHAR(255)`:\
  \ 此数据类型将字段定义为最大长度为 255 个字符的可变字符字符串。字段按其实际长度存储。\n\n- `price`: 宠物的价格。`CREATE` 查询按以下方式定义\
  \ `price`：\n- `DECIMAL(9,2)`: 此数据类型将字段定义为最多 9 位数字并带有 2 位小数的数字。如果你在该字段中存储一个整数，返回时将带有两位小数，例如\
  \ 9.00 或 2568.00。\n\n- `pix`: 宠物照片的文件。网站上的图片存储在具有如 dog.jpg、dragon.gif 或 cat.png\
  \ 等命名的图形文件中。此字段存储你想为这只宠物显示的照片的文件名。`CREATE` 查询按以下方式定义 `pix`。\n\n\n\n\n\n- `CHAR(15)`:\
  \ 此字段中的数据预期是一个长度为 15 个字符的字符字符串。对于某些应用程序，图片文件可能位于其他目录或其他 网站上，需要更长的字段，但对于此应用程序，所有图片都在网站的一个目录中，并且名称较短。如果存储的字符串少于\
  \ 15 个字符，则该字段将进行填充，使其始终占用 15 个字符的存储空间。\n- `NOT NULL`: 此定义意味着该字段不能为空。它必须有一个值。你必须为宠物准备一张图片。当网站网站尝试显示一张找不到的图片时，它会在本应显示图形的浏览器窗口中显示一条难陋的错误信息。你不希望你的目录出现そのような情况，因此你的数据库应该要求提供一个值。在这种情况下，你定义了一个默认值，以便在该字段中始终放置一个值。\n\
  - `DEFAULT \"na.gif\"`: 如果你没有为 `pix` 提供值，将存储 `\"na.gif\"`。这样一来，`pix` 始终有一个值。`na.gif`\
  \ 文件可能是一张显示类似于“图片不可用”的图形。\n\n请注意关于此数据库表设计的以下几点：\n\n- **某些字段是 CHAR，而某些是 VARCHAR。**\
  \ 通常情况下，较短的字段应该是 `CHAR`，因为短字段不会浪费多少空间。例如，如果你的 `CHAR` 是 5 个字符，你可能浪费的最空间是 4 个字符。然而，如果你的\
  \ `CHAR` 是 200，你可能会浪费 199 个字符。因此，短字段可以使用 `CHAR`，浪费的空间非常少。\n- **petID 字段对于不同的宠物有不同的含义。**\
