  \ 8-1 中的程序生成的 Web 页面。\n\n### 使用函数获取数据\n\n在大多数应用程序中，你会从数据库获取数据。通常你会在程序中的多个位置获取数据。函数——即执行特定任务的语句块——是为了这种这种情况设计的（我在第\
  \ 7 章将详细介绍函数）。从数据库获取数据的函数非常有用。当程序需要数据时，你可以调用函数。函数不仅可以节省你大量的输入工作，还能让程序更易读。例如，考虑一个产品目录，如宠物目录。你需要多次获取某个产品的信息。你可以编写一个函数来获取数据，然后在需要时调用该函数。\n\
  \n代码列表 8-3 程序 `petDisplay.php` 显示了如何使用函数获取数据。列表 8-3 中的函数将获取宠物目录中的单个宠物信息。这些信息被放入一个数组并返回给主程序。主程序可以以任何想要的方式使用这些信息。在这种情况下，它将宠物信息输出到\
  \ Web 页面。\n\n#### 代码列表 8-3：从数据库获取数据\n\n```php\n<?php\n/* Program: petDisplay.php\n\
  \ * Desc: 使用函数从数据库获取数据\n */\n?>\n<html>\n<head><title>Pet Catalog</title></head>\n\
  <body>\n<?php\n$user=”catalog”;\n$host=”localhost”;\n$password=””;\n$database =\
  \ “PetCatalog”;\n$cxn = mysqli_connect($host,$user,$password,$database)\nor die\
  \ (“could’t connect to server”);\n$petInfo = getPetInfo(“Unicorn”); //调用函数\n$f_price\
  \ = number_format($petInfo['price’],2);\necho “<p><b>{$petInfo['petName']}</b><br\
  \ />\\\\n Description: {$petInfo['petDescription']}<br />\\\\nPrice: \\\\${petInfo['price']}\\\
  \\n”;\n?>\n</body>\n</html>\n<?php\nfunction getPetInfo($petName)\n{\n    $user=”catalog”;\n\
  \    $host=”localhost”;\n    $password=””;\n    $dbname = “PetCatalog”;\n    $cxn\
  \ = mysqli_connect($host,$user,$password,$dbname)\n    or die (“could’t connect\
  \ to server”);\n    $query = “SELECT \\* FROM Pet WHERE petName=’$petName’”;\n \
  \   $result = mysqli_query($cxn,$query)\n    or die (“Couldn’t execute query.”);\n\
  \    return mysqli_fetch_assoc($result);\n}\n?>\n```\n\n\n\n\n\n✓ 使用函数调用可以让程序比将函数中的所有语句都放在主程序中更易读。\n\
  \n✓ 函数调用发送了字符串“Unicorn”。在大多数情况下，函数调用使用变量名。\n\n✓ 程序创建了变量 `$petInfo` 来接收来自函数的数据。`$petInfo`\
  \ 是一个数组，因为存储在其中的信息也是一个数组。\n\n前面的函数非常简单：它以数组的形式返回一行结果。但函数可以更复杂。上一个节提供了一个用于获取指定类型所有宠物的程序。列表\
  \ 8-4 中的程序 `getPets.php` 使用了函数来实现相同的目的。该函数返回一个包含所有指定类型宠物数据的多维数组。\n\n### 列表 8-4：使用函数显示带编号的宠物列表\n\
  \n```php\n<?php\n/* Program: getPets.php\n* Desc: 从数据库中显示项目列表。\n*/\n?>\n```\n\n\
  （续）\n\n230 **第三部分：PHP**\n\n**列表 8-4（续）**\n\n```html\n<html>\n<head><title>Pet Catalog</title></head>\n\
  <body>\n<?php\n$type = \"Horse\";\n$petInfo = getPetsOfType($type); //调用函数\n/* 在表格中显示结果\
  \ */\necho \"<h1>{$type}s</h1>\\n\";\necho \"<table cellspacing='15'>\\n\";\necho\
  \ \"<tr><td colspan='4'><hr /></td></tr>\\n\"; for($i=1;$i<=sizeof($petInfo);$i++)\n\
  {\n$f_price = number_format($petInfo[$i]['price'],2);\necho \"<tr>\\n\n<td>$i.</</td>\\\
  n\n<td>{$petInfo[$i]['petName']}</td>\\n\n<td>{$petInfo[$i]['petDescription']}</td>\\\
  n\n<td style='text-align: right'>${$f_price}</td>\\n\n</tr>\\n\";\necho \"<tr><td\
  \ colspan='4'><hr /></td></tr>\\n\";\n}\necho \"</table>\\n\";\n?>\n</body></html>\n\
  ```\n\n```php\n<?php\nfunction getPetsOfType($petType)\n{\n$user=\"catalog\";\n\
  $host=\"localhost\";\n$passwd=\"\";\n$cxn = mysqli_connect($host,$user,$passwd,\"\
  PetCatalog\")\nor die(\"Couldn’t connect to server\");\n$query = \"SELECT * FROM\
  \ Pet WHERE petType='$petType'\";\n$result = mysqli_query($cxn,$query)\nor die(\"\
  Couldn’t execute query.\");\n$j = 1;\nwhile($row=mysqli_fetch_assoc($result))\n\
  {\nforeach($row as $colname => $value)\n{\n$array_multi[$j][$colname] = $value;\n\
  }\n$j++;\n}\nreturn $array_multi;\n}\n?>\n```\n\n**第 8 章：输入，数据输出** 231\n\n列表 8-4\
  \ 中的程序执行如下：\n\n1. 它调用了函数 `getPetsOfType()`。\n   它通过包含宠物类型的变量 `$type` 传递了“horse”。它还设置了\
  \ `$petInfo` 来接收函数返回的数据。\n2. 函数连接到数据库并选择数据库 `PetCatalog`。\n3. 函数发送一个查询，获取 `petType`\
  \ 列中所有匹配 `$petType` 的行。\n   `$petType` 在函数调用中传递给函数。数据存储在临时位置的一个表中。变量 `$result` 标识了临时表的位置。\n\
  4. 它设置了一个计数器。\n   `$j` 是在每次循环中递增的计数器。它在循环开始前为 1。\n5. 它启动了一个 `while` 循环。\n   函数尝试从临时数据表中获取一行并成功。如果临时位置没有可获取的行，`while`\
  \ 循环将结束。\n6. 它启动了一个 `foreach` 循环。\n   循环遍历行，处理每个字段。\n7. 它将值存储在一个多维数组中。\n   `$array_multi`\
  \ 是多维数组。它的第一个键是一个数字，由计数器设置。由于这是第一次通过 `while` 循环，计数器 `$j` 现在等于 1。行中的所有字段都以列名作为键存储在\
  \ `$array_multi` 中。（我将在第 7 章中详细解释多维数组。）\n8. 它递增计数器。\n   `$j` 增加 1。\n9. 到达 `while`\
  \ 循环的末尾。\n10. 回到 `while` 循环的顶部。\n11. 对结果中的每一行重复步骤 5-10。\n12. 将 `$array_multi` 返回给主程序。\n\
  \    `$array_multi` 包含了所有所选行的数据。\n13. `$petInfo` 接收来自函数的数据。\n    所有数据已传递。图 8-3 显示了函数执行完成后\
  \ `$petInfo` 的结构。\n\n![图像 25](img/index-252_1.png)\n\n232 **第三部分：PHP**\n\n**图 8-3：**\
  \ 多维数组 `$petInfo` 的结构。\n\n14. 主程序在 HTML 表格中将宠物描述发送到浏览器。适当的数据已传递。图 8-3 显示了函数执行完成后\
  \ `$petInfo` 的结构。\n\n列表 8-4 中的程序与图 8-2 相同，只是使用了函数。列表 8-4 中的网页与图 8-2 相同，只是使用了函数。函数让编程变得更容易。\n\
  \n## 从用户处获取信息\n\n许多应用程序的设计是为了让用户输入以下信息：\n\n- **在线订单**：客户需要提供配送和支付信息。\n- **注册**：许多网站需要账户名。\n\
  - **登录**：许多网站限制访问权限。\n- **查看信息**：许多网站允许用户指定他们想要的信息。\n\n**第 8 章：输入，数据输出** 233\n\n\
  你通过显示 HTML 表单来提问。用户通过向表单输入信息来回答。函数更容易更容易。\n\n### 使用 HTML 表单\n\nHTML 表单对于交互式网站非常重要。（如果不熟悉\
  \ HTML 表单，你需要阅读 HTML 的表单章节。）使用 PHP 显示表单，你可以采取以下方法之一：\n\n- **使用 `echo` 语句输出表单的 HTML**。例如：\n\
  ```php\n<?php\necho \"<form action='processform.php' method='POST'>\\n\n<input type='text'\
  \ name='fullname' />\\n\n<input type='submit' value='Submit Name' />\\n\n</form>\\\
  n\";\n?>\n```\n- **在 PHP 区域之外使用原生 HTML**。对于静态表单，没有理由将其放在 PHP 区域中。例如：\n```html\n\
  <?php\nPHP 区域中的语句\n?>\n<form action=\"processform.php\" method=\"POST\">\n<input\
  \ type=\"text\" name=\"fullname\" />\n<input type=\"submit\" value=\"Submit Name\"\
  \ />\n</form>\n<?php\nPHP 区域中的语句\n?>\n```\n\n这两种方法都会产生图 8-4 所示的表单。\n\nJoe Customer\
  \ 填写了 HTML 表单。他点击提交按钮。你现在有了想要的信息——他的名字。那么信息在哪里？你如何获取它？\n\n![图像 26](img/index-254_1.jpg)\n\
  \n234 **第三部分：PHP**\n\n**图 8-4：** 由 HTML 语句产生的表单。\n\n你通过运行接收表单信息的程序来获取表单信息。当点击提交按钮时，PHP\
  \ 会自动运行一个程序。表单标签中的 `action` 参数告诉 PHP 运行哪个程序。例如，在前面的程序中，`action=processform.php`\
  \ 参数告诉 PHP 运行 `processform.php`。\n\n\n\n\n当用户点击提交按钮时执行 `php`。程序 `processform.php`。\n\
  \n`php` 可以显示、存储或以其他方式使用表单提交时收到的表单数据。\n\n当用户点击提交按钮时，运行 `action` 属性指定的程序，该程序中的语句可以从\
  \ PHP 内置数组获取表单并在 PHP 语句中使用这些信息。\n\n包含表单信息的内置数组有 `$_POST`、`$_GET` 和 `$_REQUEST`，它们是`超全局数组`。当表单使用\
  \ `POST` 方法时，表单字段的信息存储在 `$_POST` 数组中。\n\n`$_GET` 数组包含作为 URL 部分传递的变量，包括使用 `GET` 方法从表单传递的字段。`$_REQUEST`\
  \ 数组包含了 `$_POST`、`$_GET` 和 `$_COOKIES` 数组中的所有数组元素。Cookies 在第 9 章中解释。\n\n当表单提交时，运行的程序可以从相应的内置数组获取表单信息。在这些数组中，每个数组索引都是表单中输入字段的。例如，如果用户在图\
  \ 8-4 所示的输入字段中输入了 **Goliath Smith** 并点击提交按钮，程序 `processform.php` 将运行并可以使用以下格式的数组变量：\n\
  \n`$_POST['fullname']`\n\n注意，输入表单的名称在 `$_POST` 数组中可用，因为表单标签指定了 `method='POST'`。此外，注意数组键是\
  \ HTML 表单中通过 `name` 属性 `name=\"fullname\"` 给字段指定的名称。\n\n## 第 8 章：数据输入，数据输出\n\n超全局数组（包括\
  \ `$_POST` 和 `$_GET`）是在 PHP 4.1 中引入的。在此之前，表单通过名为 `$HTTP_POST_VARS` 和 `$HTTP_GET_VARS`\
  \ 的旧数组传递。如果你正在使用 PHP 4.0 或早期版本，则必须使用旧数组。两种类型的内置数组一直存在到 PHP 5。\n\n旧数组在 PHP 6 中不再存在了。如果你正在处理某些使用旧数组名的旧程序，则需要将数组名称从旧名称（例如\
  \ `$HTTP_POST_VARS`）更改为全局数组名称（例如 `$_POST`）。在大多数情况下，在文本编辑器中进行搜索并替换可以通过命令完成每个数组的更改。\n\
  \n显示表单中所有字段的程序对于测试表单非常有用。你可以看到从表单传递的值，以确保你的表单格式正确，并发送了你预期的字段名和值。POST 类型表单中的所有字段都由列表\
  \ 8-5 中的程序显示，程序名为 `processform.php`。当提交图 8-4 所示的表单时，将运行以下程序。\n\n### 列表 8-5：一个显示表单所有字段的脚本\n\
  \n```php\n<?php\n/* Script name: processform.php\n* Description: Script displays\
  \ all the information\n* passed from a form.\n*/\necho “<<html>\n<head><title>Customer\
  \ Address</title></head>\n<body>”;\nforeach ($_POST as $field => $value)\n{\necho\
  \ “$field = $value<br />\\n”;\n}\n?>\n</</body>></html>\n```\n\n如果用户在图 8-4 的表单中输入\
  \ **Goliath Smith**，将显示以下输出：\n\n`fullname = Goliath Smith`\n\n输出只显示了一行，因为图 8-4 的表单中只有一个字段。\n\
  \n列表 8-5 中的程序编写用于处理来自任何使用 POST 方法的表单信息。假设你有一个稍微复杂的表单，例如列表 8-6 中的所示程序，它显示了一个包含多个字段的表单。\n\
  \n### 列表 8-6：显示电话表单\n\n```php\n<?php\n/* Program name: displayForm\n* Description:\
  \ Script displays a form that asks for\n* customer phone number.\n*/\n$labels =\
  \ array( “first_name” => “First Name”,\n“middle_name” => “Middle Name”,\n“last_name”\
  \ => “Last Name”,\n“phone” => “Phone”);\n?>\n<html>\n<head>\n<title>Customer Phone\
  \ Number</title>\n<style type=’text/css’>\n<!--\nform { margin: 1.5em 0 0 0; padding:\
  \ 0; }\n.field { padding-top: .5em; }\nlabel { font-weight: bold; float: left; width:\
  \ 20%;\nmargin-right: 1em; text-align: right; }\n#submit { margin-left: 35%; padding-top:\
  \ 1em; }\n-->\n</style>\n</head>\n<body>\n<h3>Please enter your phone number.</h3>\n\
  <form action=’processform.php’ method=’POST’\n<?php\n/* Loop that displays the form\
  \ fields */\nforeach($labels as $field => $label)\n{\necho “<div class=’field’>\n\
  <label for=’$field’>$label</label>\n<input type=’text’ name=’$field’ id=’$field’\n\
  size=’65’ maxlength=’65’ /></div>\\n”;\n}\necho “<div id=’submit’><input type=’submit’\n\
  valueSubmitSubmit Number’ />\\n”;\necho “</div>\\n</form>\\n</</body>>\\n</html>”;\n\
  ?>\n```\n\n如果用户在图 8-4 中输入了 **Goliath Smith**，将显示以下输出：\n\n`fullname = Goliath Smith`\n\
  `middle_name = Middle Name`\n`last_name = Smith`\n`phone = 555-5555`\n\n在 `processform.php`\
  \ 中，`$_POST` 内置数组的所有元素都显示了出来，因为本节所示的表单都使用了 POST 方法。\n\n## 使表单动态化 PHP 为 HTML 表单带来了新的功能。由于你可以在\
  \ PHP 表单中使用变量，你的表单现在可以是动态的。以下是 PHP 为表单带来的主要功能：\n\n- 使用变量在输入字段中显示信息\n- 使用变量为用户构建动态列表\n\
  - 使用变量构建动态单选按钮\n- 使用变量构建动态复选框\n\n### 在表单字段中显示动态信息\n\n在 Web 页面显示表单时，你可以在字段中填充信息而不仅仅是显示空白字段。例如，如果你大多数客户住在在美国，当你询问客户地址时，你可以在国家字段中自动输入\
  \ **US**。如果客户确实在美国，你就为客户节省了一些打字时间。如果客户不在美国，他或她可以将 *US* 替换为相应的国家。此外，输入字段的文本不会有拼写错误——除非你自己包含了一些错误。\n\
  \n要显示包含信息的文本字段，你使用以下格式的输入字段 HTML 语句：\n\n`<input type=\"\"text” name=\"\"country”\
  \ value=\"\"US” />`\n\n使用 PHP，你可以使用以下两个语句之一显示此信息：\n\n```php\n<input type=\"\"text”\
  \ name=\"\"country”\n```\n\n\n\n\n\n`value=”<?php echo $country ?>” />`\n\n`echo\
  \ “<input type=’text’ name=’country’ value=’$country’ />”;`\n\n第一个示例在 HTML 区域创建了一个输入字段，仅对\
  \ `value` 使用了简短的 PHP 代码段。第二个示例通过在 PHP 代码段内使用 `echo` 语句创建了一个输入字段。如果你在使用长表单，且仅偶尔使用变量，那么使用第一种格式会更有效。如果你的表单使用了许多变量，使用第二种格式会更有效。\n\
  \n如果你在数据库中存储了用户信息，你可能想在表单字段中显示来自数据库的信息。例如，你可能会将信息显示给用户，以便他们进行任何更改。或者，你可能会显示客户上次在线订单的收货地址，这样他们就不需要重新输入地址。列表\
  \ 8-7 显示了 `displayAddress.php`，它显示了一个包含数据库信息的表单。此表单与图 8-5 显示的表单相似，不同在于该表单包含信息（从数据库中检索），而图\
  \ 8-5 中的表单字段是空的。\n\n### 列表 8-7：显示带有信息的 HTML 表单\n\n```php\n<?php\n/* Program name:\
  \ displayAddress\n* Description: 脚本显示带有从数据库获取\n* 地址信息的表单。\n*/\n$labels = array(\
  \ “firstName”=>”First Name:”,\n“lastName”=>”Last Name:”,\n“street”=>”Street Address:”,\n\
  “city”=>”City:”,\n“state”=>”State:”,\n“zip”=>”Zipcode:”);\n$user=”admin”;\n$host=”localhost”;\n\
  $password=””;\n$database = “MemberDirectory”;\n$loginName = “gsmith”; // 用户登录名\n\
  $cxn = mysqli_connect($host,$user,$password,$database)\nor die (“couldn’t connect\
  \ to server”);\n$query = “SELECT \\* FROM Member WHERE loginName=’$loginName’”;\n\
  $result = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query.”);\n$row =\
  \ mysqli_fetch_assoc($result);\n?>\n<html>\n<head>\n<title>Customer Phone Number</title>\n\
  <style type=’text/css’>\n<!--\nform { margin: 1.5em 0 0 0; padding: 0; }\n.field\
  \ { padding-top: .5em; }\nlabel { font-weight: bold; float: left; width: 20%; margin-right:\
  \ 1em; text-align: right; }\n#submit { margin-left: 35%; padding-top: 1em; }\n-->\n\
  </style>\n</head>\n```\n\n#### 列表 8-7（续）\n\n```php\n<body\n<?php\necho “<div style=’text-align:\
  \ center’>\n<h1>Address for $loginName</h1>\\n”;\necho “<p style=’font-size: large;\
  \ font-weight: bold’>\n请检查下方信息并更改\n任何错误信息。</p>\n<hr /></div>\\n”;\necho “<form action=’processAddress.php’\
  \ method=’POST’>\"; foreach($labels as $field => $label)\n{\necho “<div class=’field’>\n\
  <label for=’$field’>$label</label>\n<input type=’text’ name=’$field’ id=’$field’\n\
  value=’$row[$field]’ size=’65’\nmaxlength=’65’ /></div>\\n”;\n}\necho “<div id=’submit’><input\
  \ type=’submit’\nvalue=’Submit Address’ />\\n”;\necho “</div>\\n</form>\\n</body>\\\
  n</html>”;\n?>\n```\n\n注意列表 8-7 程序中的以下内容：\n\n- **表单语句将操作传递给 processAddress.php。**\
  \ 该程序处理表单并更新数据库中更改的信息。\n- **表单中的每个输入字段都赋予了一个名称。** 这是由你自己编写的程序，将在本章“检查信息”和“将信息存入数据库”章节中分别讨论。\n\
  - **表单中的字段名称与数据库中的列名相同。** 这简化了在数据库和表单之间传输信息的过程。\n- **来自数据库的值在表单字段中显示。** `value`\
  \ 参数显示来自变量 `$row`。\n\n出于安全考虑，始终在你的 HTML 语句中包含 `maxlength`。`maxlength` 定义了允许用户输入字段的字符数。如果信息要存储在数据库中，将\
  \ `maxlength` 设置为与数据库列相同的宽度。\n\n图 8-6 显示了列表 8-7 程序生成的 Web 页面。表单中的信息是表单的内容。图 8-6：用于数据库的选择字段。\n\
  \n构建选择列表允许你从数据库提供列表。用户不再向字段输入，而是从列表中选择。在可行的情况下请使用选择列表。使用 PHP 时，你的选项可以是变量。这种能力允许你构建动态列表。\n\
  \n（注：此处为代码块，不翻译）\n\n```html\n<form action=\"processform.php\" method=\"POST\">\n\
  <select name=\"petType\">\n<option value=\"horse\">horse</option>\n<option value=\"\
  cat\" selected=\"selected\">cat</option>\n<option value=\"dragon\">dragon</option>\n\
  </select>\n<input type=\"submit\" value=\"Select Type of Pet\" />\n</form>\n```\n\
  \n### 列表 8-8：构建选择列表\n\n```php\n<?php\n/* Program name: buildSelect.php\n* Description:\
  \ 程序从数据库\n* 构建选择列表。\n*/\n$user=”admin”;\n$host=”localhost”;\n$password=””;\n$database\
  \ = “PetCatalog”;\n$cxn = mysqli_connect($host,$user,$password,$database)\nor die\
  \ (“couldn’t connect to server”);\n$query = “SELECT DISTINCT petType FROM Pet ORDER\
  \ BY petType”;\n$result = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query.”);\n\
  ?>\n<html\n<head><title>Pet Types</title></head>\n<body>\n<form action='processform.php'\
  \ method='POST'>\n<select name='petType'>\n<?php\nwhile($row = mysqli_fetch_assoc($result))\n\
  {\nextract($row);\necho “<option value='$petType'>$petType</option>\\n”;\n}\n?>\n\
  </select>\n<input type='submit' value='Select Type of Pet' />\n</form>\n</body>\n\
  </html>\n```\n\n\n\n\n注意程序 8-8 中的内容：\n\n- **查询中使用 DISTINCT：** `DISTINCT` 导致查询只获取每个类型一次。如果没有\
  \ `DISTINCT`，如果某个类型在数据库中出现多次，查询将返回多次。\n- **查询中使用 ORDER BY：** 类型将按字母顺序排序。\n- **循环前的\
  \ echo 语句：** `form` 和 `select` 标签在 `while` 循环开始前输出，因为只需要输出一次。\n- **循环中的 echo 语句：**\
  \ 循环输出 `option` 标签——对应数据库中的每个类型。没有被标记为 `selected`，因此列表中的第一个项会被自动选中。\n- **循环后的 echo\
  \ 语句：** `form` 和 `select` 标签在循环后输出，因为它们只需要输出一次。\n\n![图像 31](img/index-264.jpg)\n\
  \n# 第三部分：PHP\n\n此程序生成的选择列表与图 8-7 相同，其中 `cat` 被选中，因为它在 HTML 标签中被特意选中了。此程序生成的下拉列表按字母顺序排列，如图\
  \ 8-9 所示。\n\n**图 8-9：由程序 `buildSelect.php` 生成的选择字段**\n\n你可以使用 PHP 变量来设置选择框显示时选中的选项。例如，假设你希望用户从月、日、年列表中选择日期。你认为大多数人会选择今天的日期，因此希望在框显示时默认选中今天。列表\
  \ 8-9 显示了 `dateSelect.php` 程序，它显示了一个选择日期的表单。\n\n**列表 8-9：构建日期列表**\n\n```php\n<?php\n\
  \n/* 程序名：dateSelect.php\n* 描述：程序显示一个供用户\n* 选择日期的选择列表。\n*/\n$monthName = array(1\
  \ => “January”, “February”, “March”,\n“April”, “May”, “June”, “July”,\n“August”,\
  \ “September”, “October”,\n“November”, “December”);\n$today = time(); // 今天的日期\n\
  $f_today = date(“M-d-Y”,$today); // 格式化今天的日期\necho “<html>\n<head><title>选择日期</title></head>\n\
  <body>\n<div style ='text-align: center’>\";\n\n/* 显示今天的日期 */\necho “<h3>Today is\
  \ $f_today</h3><hr />\\\\n”;\n/* 创建包含选择列表的表单 */\necho “<form action=’processform.php’\
  \ method=’POST’\\\\n”;\n/* 构建月份选择列表 */\n$todayMO = date(“n”,$today); // 从今天获取月份\n\
  echo “<select name=’dateMO’\\\\n”;\nfor($n=1;$n<=12;$n++)\n{\necho “<option value=$n”;\n\
  if($todayMO == $n)\n{\necho “ selected='selected’”;\n}\necho “ > $monthName[$n]\\\
  \\n”;\n}\necho “</select>\\\\n”;\n/* 构建日期选择列表 */\n$todayDay= date(“d”,$today); //\
  \ 从今天获取日期\necho “<select name=’dateDay’\\\\n”;\nfor($n=1;$n<=31;$n++)\n{\necho “\
  \ <option value=$n”;\nif($todayDay == $n)\n{\necho “ selected='selected’”;\n}\n\
  echo “ > $n\\\\n”;\n}\necho “</select>\\\\n”;\n/* 构建年份选择列表 */\n$startYr = date(“Y”,$today);\
  \ // 从今天获取年份\necho “<select name=’dateYr’\\\\n”;\nfor($n=$startYr;$n<=$startYr+3;$n++)\n\
  {\necho “ <option value=$n”;\nif($startYr == $n )\n{\necho “ selected='selected’”;\n\
  }\necho “ > $n\\\\n”;\n}\necho “</select>\\\\n\\\";\n?>\n</form></body></html>```\n\
  ```\n\n![图像 32](img/index-266_1.jpg)\n\n列表 8-9 程序生成的网页如图 8-10 所示。日期出现在表单上方，你可以看到选择列表显示了正确的日期。月份选择列表展开时显示所有\
  \ 12 个月份。日期的选择列表展开时显示 31 天。年份选择列表显示四年。\n\n**图 8-10：选中今日日期的日期选择字段。**\n\n列表 8-9 程序通过以下步骤生成图\
  \ 10 中的网页：\n1. 创建一个包含月份名称的数组。数组的键是数字。第一个月份“一月”从键 1 开始，以便数组的键与月份的数字匹配。\n2. 创建包含当前日期的变量。`$today`\
  \ 包含系统格式的日期并用于表单。`$f_today` 是格式化后的日期，用于在网页中显示。\n3. 在网页顶部显示当前日期。显示当前日期是为了你可以将其与下拉列表中选中的选项进行比较。\n\
  4. 构建月份选择字段：\n    i. 创建包含今天月份的变量。\n    ii. 输出 `select` 标签，该标签只需输出一次。\n    iii. 启动循环\
  \ 12 次的 `for` 循环。\n    iv. 在循环内部，使用 `$monthName` 数组中的第一个值输出 `option` 标签。\n    v.\
  \ 如果正在处理的月份数字等于月份数字，则给 `option` 标签添加 `selected` 属性。\n    vi. 重复直到月份处理完毕。\n    vii.\
  \ 输出 `select` 结束标签，该选择字段只需输出一次。\n5. 构建日期选择字段：使用图 8-7 中描述的方法。循环重复 31 次。\n6. 构建年份选择字段：\n\
  \    i. 创建包含今天年份的变量。\n    ii. 输出 `select` 标签，该标签只需输出一次。\n    iii. 启动循环 4 次的 `for`\
  \ 循环。\n    iv. 在循环内部，如果年份数字等于起始年份，则给 `option` 标签添加 `selected` 属性。\n    v. 输出 `select`\
  \ 结束标签。\n\n\n\n此程序与列表 8-9 中的程序相似。该程序生成的网页 如图 8-11 所示。\n\n### 构建复选框列表\n\n你可能想在表单中使用复选框。复选框与选择列表和单选按钮不同，因为它们允许用户选择多个选项。例如，如果你显示的是一个带有复选框的宠物类别列表，用户可以选择两个、三个或多个宠物类别。列表\
