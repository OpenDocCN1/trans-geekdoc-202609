  \ { margin-left: 35%; padding-top: 1em; }\n-->\n</style>\n</head>\n<body>\n<?php\n\
  /* 来自表单的信息 */\nforeach($_POST as $field => $value)\n{\n/* 检查空白字段 */\nif(empty($value))\n\
  {\n$blank_array[] = $field;\n}\n/* 检查每个字段的格式 */\nelseif(preg_match(\"/name/i\",$field))\n\
