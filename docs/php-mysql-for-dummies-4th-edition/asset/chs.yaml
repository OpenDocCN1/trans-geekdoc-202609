  \ `$_SESSION['logname']` 搜索成员信息来创建查询。包含成员 ID 的会话变量 `logname` 已在登录程序中设置过。\n\n✓ PHP\
  \ 部分在第 28 行结束。程序的剩余部分是 HTML。\n\n✓ 程序使用两个不同的表单来提供两个不同的提交按钮。第 40 行和 44 行的表单语句启动了不同的程序。\n\
  \n由客户控制接下来发生什么。如果客户点击返回主页的按钮，将运行 `PetShopFront.php` 程序。如果客户点击“会员专区”（Members Only\
  \ Section）提交按钮，将显示你网站会员专区的第一页。\n\n## 编写会员专区\n\n会员专区的网页与其他任何网页并无区别。你只是将它们限制为已登录的成员。为了做到这一点，你在每个页面的顶部启动会话并检查他们是否登录。每个程序顶部的语句如下：\n\
  \n```\nsession_start();\n\nif(@$_SESSION['auth'] != \"yes\")\n{\n    header(\"Location:\
  \ Login.php\");\n    exit();\n}\n```\n\n### 第四部分：应用程序\n\n当 `session_start` 执行时，PHP\
  \ 会检查是否存在已的会话。如果存在，它将设置会话变量。当用户登录时，`$_SESSION['auth']` 被设置为 yes。因此，如果 `$_SESSION['auth']`\
  \ 未被设置为 yes，则用户未登录，程序会将用户带到登录页面。\n\n## 为增长做计划\n\n一个应用程序的原始计划通常包含了用户可能希望它做的所有精彩功能。从现实来说，尽快让用户可以使用该应用程序通常是重要的。因此，应用程序通常先发布计划功能的子集。\n\
  \n更多功能会在稍后添加。这就是为什么在编写应用程序时考虑到增长性是极其重要的。\n\n看看本章中的登录应用程序，我相信你能够看到很多可以添加其中的它的内容。这里是一些可能性：\n\
  \n- **通过电子邮件发送忘记的密码。** 用户经常忘记密码。许多登录应用程序都有一个链接，用户可以点击该链接将密码通过电子邮件发送给自己。\n- **更改密码。**\
  \ 成员可能想要更改密码。应用程序可以提供一个更改密码的表单。\n- **更新信息。** 成员可能会搬家或更改其电话号码或电子邮件地址。应用程序可以为成员提供更改自己信息的方法。\n\
  - **创建成员列表。** 你可能想输出一个数据库中所有成员的格式良好的列表。这可能是你只想让自己自己使用的内容。然而，在某些情况下，你可能想让所有成员都能看到该列表。\n\
  \n你可以轻松地向应用程序添加这些任何一种功能。例如，你可以在登录表单中添加一个“我忘记密码了”（Forgot my password）按钮，点击后会将密码发送到数据库中的电子邮件地址。该按钮可以运行带有发送密码邮件部分的登录程序，也可以运行另一个发送密码电子邮件的程序。同样地，你可以添加更改密码或更新客户信息的按钮。你不需要等到应用程序拥有了所有花哨功能后才让客户使用它。你可以一步一步地编写它。\n\
  \n![Image 54](img/index-407_1.png)\n\n## 第五部分：十之法则\n\n在这一部分……本部分的章节包含了基于我的经验提供的提示、技巧和警告。也许它们可以成为你通往自信的\
  \ Web 开发人员之路上的捷径。我诚挚地希望如此。\n\n## 第 13 章：你可能想使用 PHP 函数实现的十件事\n\n### 本章内容\n- 了解许多实用的函数\n\
  - 理解函数能做什么\n\nPHP 最强大的方面之一是它拥有许多内置函数。在本章中，我列出了我最常用的 PHP 函数。其中一些我在此书的其他地方进行了描述，某些我只带过提到，另一些我完全没有提到。PHP\
  \ 语言有数千个函数。\n\n要查看 PHP 函数的完整列表，请访问 PHP 文档 `www.php.net/manual/en/funcref.php`。\n\
  \n## 与 MySQL 通信\n\nPHP 有许多专门为与 MySQL 交互设计的函数。我在书中详细描述了以下 MySQL 函数：`mysqli_connect()`，`mysqli_fetch_assoc()`，`mysqli_num_rows()`，`mysqli_query()`。\n\
  \n以下函数可能有用，但我没有讨论它们，或者只是简要讨论它们：\n\n- `mysqli_insert_id($cxn)`：用于带有 AUTO-INCREMENT\
  \ 的 MySQL 列。此函数获取插入到列中的最后一个数字。\n- `mysqli_select_db($cxn,$database)`：选择一个数据库。当前选定的数据库将更改指定的数据库。所有后续查询将在所选数据库上执行。\n\
  - `mysqli_fetch_row($result)`：从临时结果位置获取一行。该行被放入一个以数字作为键的数组。\n- `mysqli_affected_rows($result)`：返回受查询影响的行数——例如，被删除或更新的行数。\n\
  - `mysqli_num_fields($result)`：返回结果中的字段数量。\n- `mysqli_field_name($result, N)`：返回由\
  \ `N` 指定的字段名称。例如，`mysqli_field_name($result,1)` 返回第二列的名称。第一列是 0。\n\n## 发送电子邮件\n\n\
  PHP 提供了一个从你的 PHP 程序发送电子邮件的函数。格式为 `mail(address, subject, message, headers)`。这些是你需要填充的值：\n\
  \n- `address`：接收消息的电子邮件地址。\n- `subject`：位于电子邮件消息主题行上的字符串。\n- `message`：电子邮件消息内部的内容。\n\
  - `headers`：设置标头值的字符串。例如，你可能有如下的 `headers` 字符串：`\"From: member-desk@petstore.com\\\
  r\\nbcc: mom@hercompany.com\"`。标头会将 From 标头设置为给定的电子邮件地址，并向妈妈发送该电子邮件的密抄。\n\n以下是你可以在脚本中用于设置和发送电子邮件消息的\
  \ PHP 语句示例：\n\n```php\n$to = \"me@test1.com\";\n$subj = \"Test\";\n$mess = \"This\
  \ is a test of the mail function\";\n$headers = \"bcc:techsupport@mycompany.com\\\
  r\\n\";\n$mailsend = mail($to,$subj,$mess,$headers);\n```\n\n有时你的电子邮件可能会遇到问题。PHP\
  \ 有一个在函数连接到系统邮件软件之前的配置设置。你的 Web 主机具有正确的设置。在其他计算机上，默认通常是正确的，但如果你的电子邮件似乎没有到达目的地，请通过查看\
  \ `phpinfo()` 输出中的以下内容来检查 PHP 配置设置：\n\n- `Sendmail_path`（在 Unix/Linux 上）\n- `SMTP`（在\
  \ Windows 上）\n\n你可以通过编辑 `php.ini` 文件更改设置。如果你使用 Windows，请查找以下行：\n\n```\n[mail function]\n\
  ; For Win32 only.\nSMTP = localhost\n; For Win32 only.\nsendmail_from = me@localhost.com\n\
  ```\n\n第一个设置是你放置外发邮件服务器名称的地方。无论你如何发送电子邮件——使用工作时的局域网、家里电缆调制解器或通过调制解器使用 ISP——你都是通过\
  \ SMTP 服务器发送邮件，该服务器有一个你需要知道的地址。\n\n\n\n\n如果你直接从计算机发送邮件，你应该能在你的电子邮件软件中找到发件邮件服务器的名称。例如，在\
  \ Microsoft Outlook Express 中，选择 `Tools➪Accounts➪Properties` 然后点击 `Servers` 选项卡。如果你找不到发件邮件服务器的名称，请向你的电子邮件管理员询问名称。如果你使用互联网服务提供商（ISP），你可以询问该\
  \ ISP。该名称的格式可能类似于：\n\n```\nmail.ispname.net\n```\n\n第二个设置是随你所有邮件发送的回件地址。按照如下方式将设置更改为你想要作为回件地址的电子邮件地址：\n\
  \n```\nsendmail_from = me@myhome.com\n```\n\n如果你正在使用 Unix 或 Linux，请在你的 `php.ini`\
  \ 文件中查找这些行：\n\n```\n; For Unix only.\n;sendmail_path =\n```\n\n这个默认值通常是正确的。如果不起作用，请与你的系统管理员讨论发件邮件服务器的正确路径。\n\
  \n不要删除行开头的分号。分号会使该行变为注释，因此在删除分号之前，该设置不会生效。\n\n# 392 第五部分：十项技巧\n\n## 使用 PHP 会话\n\n\
  下面是打开或关闭会话的函数。我将在第 9 章解释这些函数。\n\n```\nsession_start(); session_destroy()\n```\n\n\
  ## 停止你的程序\n\n有时你只想让你的程序停止、终止并退出。有两个函数可以做到：`exit()` 和 `die()`。实际上，它们是同一个函数的两个名称，但有时说“die”更有趣一点。如果你提供了消息，它们在停止时都会打印该消息。格式为：\n\
  \n```\nexit(\"message string”);\n```\n\n当 `exit` 执行时，会输出 `message string`。\n\n##\
  \ 处理数组\n\n数组在 PHP 中非常有用，特别是获取数据库函数的结果和表单变量。我将在书的其他地方解释以下数组函数，主要在第 7 章：\n\n```\n\
  array(); extract(); sort(); asort();\nrsort(); arsort(); ksort(); krsort();\n```\n\
  \n这里是其他实用的函数：\n\n- `array_reverse($varname)`：返回一个值顺序反的数组。\n- `array_unique($varname)`：移除数组中的重复值。\n\
  - `in_array(\"string\",$varname)`：在数组 `$varname` 中查找字符串 `\"string\"`。\n- `range(value1,\
  \ value2)`：创建一个包含 `value1` 和 `value2` 之间所有值的数组。例如，`range('a’,’z')` 创建一个包含 `a` 到\
  \ `z` 之间所有字母的数组。\n\n# 第 13 章：你可能想用 PHP 函数做的十件事 393\n\n- `explode(\"sep\",\"string\"\
  )`：创建一个字符串数组，其中每个项目都是 `string` 的子字符串，由 `sep` 分隔。例如，`explode (\" \",$string)` 创建一个数组，其中\
  \ `$string` 中的每个单词都是一个独立的值。这类似于 Perl 中的 `split`。\n- `implode(\"glue\",$array)`：创建一个包含\
  \ `$array` 中所有值的字符串，并在它们之间使用 `glue` 粘接。例如，`implode(\", \",,$array)` 创建一个字符串：`value1,\
  \ value2, value3` 等。这类似于 Perl 中的 `join` 函数。\n\n还有许多实用的数组函数可用。PHP 几乎可以对数组做任何事情。\n\
  \n## 检查变量\n\n有时你只需要知道变量是否存在。你可以使用以下函数来测试变量是否已设置：\n\n- `isset($varname);` // 如果变量已设置则为真\n\
  - `!isset($varname);` // 如果变量未设置则为真\n- `empty($varname);` // 如果值为 0 或未设置则为真\n\n\
  ## 格式化值\n\n有时你需要格式化变量中的值。在第 6 章中，我解释了如何使用 `number_format()` 和 `sprintf()` 将数字转换为货币格式。在第\
  \ 6 章中，我还讨论了 `unset()`，它可以移除变量中的值。在本节中，我描述了 `sprintf()` 的额外功能。\n\n`sprintf()` 函数允许你格式化任何字符串或数字，包括变量值。通用格式为：\n\
  \n```\n$newvar = sprintf(\"format\",$varname1,$varname2,... );\n```\n\n其中 `format`\
  \ 给出格式指令，`$varname` 包含要格式化的值。`format` 可以同时包含字面量和格式化 `$varname` 中值的指令。此外，仅包含字面量的\
  \ `format` 也是有效的，例如以下语句：\n\n```\n$newvar = sprintf(\"I have a pet\");\n```\n\n#\
  \ 394 第五部分：十项技巧\n\n该语句输出字面量字符串。然而，你也可以使用以下语句添加变量：\n\n```\n$ndogs = 5;\n$ncats =\
  \ 2;\n$newvar = sprintf(\"I have %s dogs and %s cats\",$ndogs,$ncats);\n```\n\n\
  `%s` 是格式指令，告诉 `sprintf` 将变量值作为字符串插入。因此，输出为 `I have 5 dogs and 2 cats`。\n\n`%` 字符信号\
  \ `sprintf` 格式指令从这里开始。\n\n格式指令具有以下格式：\n\n```\n% pad-width. dectype\n```\n\n这些是格式指令的组成部分：\n\
  \n- `%`：信号格式指令的开始。\n- `pad`：用于需要时填充数字的填充字符。\n\n如果你不指定字符，则使用空格。`pad` 可以是空格、`0` 或任何字符。\n\
  \n- `% pad-width. dectype`：格式指令具有以下格式：\n- `pad`：用于需要时填充数字的填充字符。`pad` 可以是空格、`0` 或任何字符。\n\
  - `width`：字符数。\n- `dectype`：值的类型。\n\n（等待，让我们根据原文的结构重新对齐列表）\n\n```\n$ndogs = 5;\n\
