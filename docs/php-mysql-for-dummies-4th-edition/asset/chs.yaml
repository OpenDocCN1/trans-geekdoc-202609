  6. 显示欢迎页。\n\n370 **第四部分：应用程序**\n\n这些任务由三个程序完成：\n- `StoreFront.php`：显示首页（任务 1）。\n\
  - `Login.php`：执行登录和创建账户（任务 2-6）。\n- `New_member.php`：显示欢迎页（任务 7）。\n\n### 编写首页\n\n\
