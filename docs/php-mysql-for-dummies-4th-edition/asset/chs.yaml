  text-align: center;\">\n<h1>Pet Store</h1>\n<p>What are you looking for?</p>\n<a\
  \ href=\"PetCatalog.php\">Pet Catalog</a>\n</div>\n</body>\n</html>\n```\n注意，链接指向\
  \ `PetCatalog.php`。当用户点击链接时，`PetCatalog.php` 程序开始。\n\n### 显示宠物类型\n获取宠物类型的页面（参见图\
  \ 11-2）显示了目录中所有的宠物类型。\n\n**列表 11-2：显示宠物类型**\n```php\n<?php\n/* Program: PetCatalog.php\n\
