  \ `http://dev.mysql.com/doc/refman/5.1/en/mysqldump.html`。\n\n## 恢复数据\n\n`phpMyAdmin`\
  \ 导出功能导出的文件是包含重建数据库所需的 SQL 查询的文本文件，其状态与导出时完全相同。它包含了数据库中每个表的 `CREATE` 查询。它包含了表中每行数据的\
  \ `INSERT` 查询。\n\n以下是包含重建两个表（`Member` 和 `Login`）所需查询的导出文件：\n\n（此处代码块保持原样）\n\n注意每个表的最后部分都是\
