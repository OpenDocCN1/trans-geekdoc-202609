  \ Apache 和 MySQL 都运行时，您的环境就准备就绪了。\n\n您现在可以关闭 XAMPP 控制面板了。您的软件已安装，并准备好为您开发 Web 数据库应用程序。\n\
  \n当控制面板运行时，它的图标会出现在您的 Dock（程序坞）中。您可以点击该图标打开控制面板。\n\n### 使用 XAMPP\n\n在完成前面的章节介绍的\
  \ XAMPP 安装程序后，Apache、PHP 和 MySQL 已准备好供您使用。\n\n如果 Apache 和/或 MySQL 看起来运行不正常，您可以打开\
  \ XAMPP 控制面板来检查它们的状态。有时它们可能没有运行，您可以启动它们。或者，有时停止然后重新启动 Apache 或 MySQL 可以解决问题。\n\n\
  XAMPP 还提供了一个主页面，提供了一些非常有用的功能。\n\nXAMPP 主页面与图 A-11 所示的页面相似。\n\n**图 A-11：**\nXAMPP\
  \ 主页面。\n\n**附录 A：从 XAMPP 安装 PHP、MySQL 和 Apache** 413\n\n要打开图 A-11 所示的 XAMPP 主页面，请打开浏览器并在地址栏中输入\
  \ `localhost`。第一次打开 XAMPP 时，您需要选择语言。\n\nXAMPP 主页面在页面左侧的菜单中提供了功能。提供一些实用功能包括\n\n*\
  \   **Status（状态）：** 打开显示您的 Web 相关软件状态的页面。\n*   **Documentation（文档）：** 为您的 Web 软件提供实用的文档。\n\
  *   **phpMyAdmin：** 提供打开 `phpMyAdmin` 的链接。但是，您不需要通过 XAMPP 页面打开 `phpMyAdmin`。可以通过输入\
  \ `localhost/phpmyadmin` 来打开 `phpMyAdmin`。\n*   **FileZilla：** 提供指向 `FileZilla`\
  \ 的链接。\n\n通常情况下，您完全不需要使用 `FileZilla`。\n\n414 **第六部分：附录**\n\n## 附录 B：配置 PHP\n\n本附录假设您已经安装了\
  \ PHP。PHP 有许多决定其行为的设置。我在上下文中讨论了各种设置。例如，我讨论了 `php.ini` 文件。\n\n设置存储在 `php.ini` 文件中。当您更改设置时，必须重启\
  \ Apache。\n\n\n\n\n例如，要关闭魔引号（magic quotes）设置，请在 `php.ini` 文件中添加以下行：\n\n```\nmagic_quotes_gpc\
  \ = Off\n```\n\n### 3. 保存 `php.ini` 文件。\n\n### 4. 将修改后的 `php.ini` 文件上传到您的网站。\n\n\
  修改后的 `php.ini` 文件将替换当前文件，设置也会随之更改。\n\n## 使用 .htaccess 文件更改设置\n\n名为 `.htaccess` 的文件是一个\
  \ Apache 配置文件。Apache 读取该文件并根据文件中的指令执行某些任务。你可以向 `.htaccess` 文件中添加指令，告诉 Apache 更改\
  \ PHP 的配置设置。正如本附录之前讨论的那样，并不是所有的 PHP 设置都可以在此文件中更改。\n\n`.htaccess` 文件中的设置适用于该 `.htaccess`\
  \ 文件所在目录及其子目录中的所有程序。你可以拥有多个 `.htaccess` 文件——即在不同目录中具有不同指令的文件。\n\n您的网站上可能已经有一个 `.htaccess`\
  \ 文件，也可能没有。某些 Web 主会在用户账户上使用 `.htaccess` 文件来实现自身的设置。如果您的网站上已经存在 `.htaccess` 文件，在编辑时请务必小心。\n\
  \n它可能包含对您的网站正常运行至关重要的指令。\n\n最好不要在开发环境中保留 `.htaccess` 文件的副本。您网站上的文件可能包含网站所需的指令，但这些指令在您的本地开发站点可能会导致问题，甚至导致您的本地站点无法运行。\n\
  \n在 `.htaccess` 文件中用于更改 PHP 设置的指令有：\n\n* `php_flag`：用于开启或关闭设置。\n* `php_value`：用于为设置指定值。\n\
  \n## 附录 B：配置 PHP\n\n如前节所示，要关闭魔引号，请在 `.htaccess` 文件中使用以下指令：\n\n```\nphp_flag magic_quotes_gpc\
  \ Off\n```\n\n如果您需要为某个设置指定值，则使用另一个指令，例如 `php_value post_max_size = 10M`。\n\n要更改设置，您只需要编辑\
  \ `.htaccess` 文件并添加新设置即可。如果您的 Web 主提供编辑网站上文件的功能，您可以在那里进行编辑。（`.htaccess` 文件是我之前陈述语句的例外，我之前曾建议您不要在网站上编辑文件，而只在开发站点上编辑。）\n\
  \n如果您需要在开发站点上编辑 `.htaccess` 文件，请下载当前的 `.htaccess` 文件，添加更改设置的指令，并将修改后的文件传回您的网站。在上传到网站后，请务必删除开发站点上的\
  \ `.htaccess` 文件。\n\n## 使用 PHP 语句更改设置\n\n您可以在程序中使用 PHP 语句临时地更改某些 PHP 设置。该设置仅在程序运行时生效。当程序结束时，PHP\
  \ 设置将恢复到之前的设置。正如之前提到的，并不是所有的 PHP 设置都可以在 PHP 程序中更改。\n\nPHP 提供了一个更改设置的语句。其通用格式为\n\
  ```\nini_set(\"setting\",\"value\");\n```\n\n在之前的两个章节中，我展示了关闭魔引号的示例。然而，我无法在此中使用魔引号。如果您查看本附录之前引用的表格，会发现\
  \ `magic_quotes_gpc` 被显示为 `PHP_INI_PERDIR`。这意味着在程序无法关闭魔引号。魔引号只能在 `php.ini` 文件或 `.htaccess`\
  \ 文件中关闭。\n\n在这个示例中，我正在关闭错误。关于您何时以及为何想要这样做，将在第 6 章中讨论。要关闭错误，请在程序开头添加以下语句：\n\n```\n\
  ini_set(\"display_errors\",\"Off\");\n```\n\nPHP 还针对某些设置提供了一些特定的语句。您可以使用这些语句代替通用的\
  \ `ini_set` 语句。例如，PHP 提供了一个语句用于设置您想要显示的错误类型。\n\n更改显示的错误类型是非常常见的需求。您可能希望在开发期间使用一个显示更多错误信息的语句，但在网站上线后，您希望显示较少的错误信息。您宁愿将错误信息显示在日志文件中，而不是显示给普通公众。\n\
  \n要临时更改显示的错误类型，请在您的程序开头使用以下语句：\n\n```\nerror_reporting( E_ALL );\n```\n\n该语句会在此程序运行时显示所有错误信息，但不会对其他程序产生影响。\n\
  \nPHP 提供的另一个更改设置的语句是\n```\nset_time_limit(seconds);\n```\n该语句设置了程序运行的最长时间，超过该时间\
  \ PHP 将认为出现了问题并终止程序。\n\n\n\n\n## 概述\n- 概述, 165–166\n\n## PHP 会话\n- 关闭 PHP 会话, 304\n\
