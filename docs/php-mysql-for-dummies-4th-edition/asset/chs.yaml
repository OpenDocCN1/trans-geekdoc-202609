  \ 第一部分：使用 PHP 和 MySQL 开发 Web 数据库应用程序\n\n## 构建数据库\n\n`Building the database` 将纸上的数据库设计转换为运行的数据库。构建数据库与你的应用程序用于与数据库交互的\
  \ PHP 程序是独立的。可以使用 PHP 以外的编程语言（如 Perl、`C` 或 `Java`）访问数据库。数据库独立存在以存储数据。\n\n你应该在编写\
  \ PHP 程序之前构建数据库。编写 PHP 程序是为了在数据库中进出地移动数据，因此在数据库可用之前，你无法对它们进行开发和测试。\n\n数据库设计指定了数据库名称，并定义了组成数据库的表。要构建数据库，你需要使用\
  \ `SQL` 语言与 `MySQL` 通信。你告诉 `MySQL` 创建数据库并向数据库添加表。你告诉 `MySQL` 如何组织数据表以及使用什么格式来存储数据。构建数据库的详细说明在第\
  \ 4 章提供。\n\n## 编写程序\n\n你的程序执行 Web 数据库应用程序的任务。它们创建了用户在浏览器窗口中看到的显示内容。它们通过接受和处理用户在浏览器窗口中输入的信息，使你的应用程序具有交互性。它们在数据库中存储信息并从数据库中获取信息。如果你不能在数据库中进出数据，数据库就毫无用处。\n\
  \n你制定的计划（正如在本章较前的章节中讨论的那样）概述了你需要编写的程序。通常情况下，计划中的每项任务都需要一个程序。如果你的计划说应用程序将显示一个表单，你需要一个显示表单的程序。如果你的计划说应用程序将存储来自表单的数据，你就需要一个从表单获取数据并将其放入数据库的程序。\n\
  \n`PHP` 语言专门为编写交互式 Web 应用程序而开发。它具有内置的功能，使编写应用程序程序变得尽可能轻松。该语言中包含了专门的方法，用于从表单中访问数据、将数据放入\
  \ `MySQL` 数据库以及从 `MySQL` 数据库中获取数据。你可以在第三部分找到编写 `PHP` 程序的详细说明。\n\n![Image 4](img/index-93_1.png)\n\
  \n# 第一部分 MySQL 数据库\n\n## 本部分内容……\n\n本部分提供了操作 `MySQL` 数据库的细节。你将了解到如何使用 `SQL`（结构化查询语言）与\
  \ `MySQL` 通信。此外，你还将发现如何创建数据库、更改数据库以及将数据移入数据库。\n\n## 第 4 章：构建数据库\n\n### 本章内容介绍\n\n\
  - 使用 `SQL` 向 `MySQL` 发出请求\n- 创建新数据库\n- 向现有数据库中添加信息\n- 查看现有数据库中的信息\n- 从现有数据库中删除信息\n\
  \n完成数据库设计后（如果你还没有完成，请参阅第 3 章），你就可以准备将其转换为运行的数据库。在本章中，你将了解到如何根据你的设计构建数据库——以及如何将数据移入其中。\n\
  \n数据库设计指定了数据库名称，并定义了组成数据库的表。要构建数据库，你必须与 `MySQL` 通信，提供数据库名称和表结构。之后，你必须与 `MySQL` 通信以向数据库添加数据（或从数据库请求信息）。你用于与\
  \ `MySQL` 通信的语言是 `SQL`。在本章中，我将解释如何创建 `SQL` 查询，并使用它们构建新数据库以及与现有数据库交互。\n\n## 与 MySQL\
  \ 通信\n\n`MySQL` 服务器是你数据库的管理器：\n\n- 它创建新数据库。\n- 它知道数据库存储的位置。\n- 它根据接收到的请求（或 `queries`）来存储和检索信息。\n\
  \n# 76 第二部分：MySQL 数据库\n\n为了发出 `MySQL` 能理解的请求，你需要构建一个 `SQL` 查询并将其发送到 `MySQL` 服务器。（关于\
  \ `MySQL` 服务器更完整的描述，请参阅第 1 章。）接下来的两个部分详细介绍了如何操作。\n\n### 构建 SQL 查询\n\n`SQL`（结构化查询语言）是你用于与\
  \ `MySQL` 通信的计算机语言。`SQL` 几乎就是英语；它主要由英语单词组成，组合成听起来类似于英语句子的单词字符串。通常情况下（幸运的是），你不需要理解任何晦涩的技术术语即可编写有效的\
  \ `SQL` 查询。\n\n每个查询的第一个单词是它的名称，这是一个动词（动词），告诉 `MySQL` 你想做什么。我在本章中讨论的查询包括 `CREATE`、`DROP`、`ALTER`、`SHOW`、`INSERT`、`LOAD`、`SELECT`、`UPDATE`\
  \ 和 `DELETE`。这些基础词汇足以在网站上创建并与数据库交互。\n\n查询名称后面跟着单词和短语——有些是必须，有些是可选的——它们告诉 `MySQL`\
  \ 如何执行操作。例如，你总是需要告诉 `MySQL` 要创建什么，并且总是需要告诉它向哪个表插入数据或从哪个表选择数据。\n\n以下是一个典型的 `SQL`\
  \ 查询。如你所见，它使用了英语单词：\n\n```\nSELECT lastName FROM Member\n```\n\n此查询检索存储在名为 `Member`\
  \ 表中的所有姓氏（lastName）。\n\n更复杂的查询（如下所示）就不那么像英语：\n\n```sql\nSELECT lastName,firstName\
  \ FROM Member WHERE state=\"CA\" AND city=\"Fresno\" ORDER BY lastName\n```\n\n\
  此查询检索住在加利福尼亚州弗雷诺（Fresno California）的所有成员的姓和名，然后按姓的字母顺序排序。这个查询没那么像英语，但仍然非常清晰。\n\n\
  在构建 `SQL` 查询时，有一些需要注意的通用要点，如前面的示例所示：\n\n# 77 第 4 章：构建数据库\n\n- **大小写：** 在本书中，我将 SQL\
  \ 单词全大写；变量信息项（如列名）通常给出全小写字母标签。我这样做是为了方便你阅读——而不是因为 MySQL 需要这种格式。SQL 单词的大小写并不重要；例如，对于\
  \ MySQL 而言，`select` 等同于 `SELECT`，`from` 等同于 `FROM`。另一方面，如果你的操作系统是 Unix 或 Linux，表名、列名和其他变量信息的大小写是有重要的。\n\
  \n当使用 Unix 或 Linux 时，MySQL 需要精确匹配列名，因此列名的大小写必须正确——例如，`lastname` 不等于 `lastName`。然而，Windows\
  \ 没有 Unix 和 Linux 那么挑剔；从它的角度来看，`lastname` 和 `lastName` 是相同的。\n\n- **空格：** SQL 单词必须由一个或多个空格分隔。你使用多少空格并不重要；你完全可以使用\
  \ 20 个空格或只用 1 个空格。SQL 也不忽略行尾。你可以在 SQL 语句的任何位置换行，或将整个语句写在一行。\n\n- **引号：** 注意在前面的查询中`CA`\
  \ 和 `Fresno` 被包含在双引号（“）中。`CA` 和 `Fresno` 是称为文本字符串或字符字符串的字符序列。（我在本章稍后详细解释字符串。）你正在要求\
  \ MySQL 将 SQL 查询中的文本字符串与数据库中存储的文本字符串进行比较。当你比较存储在数值列中的数字（如整数）时，不需要将数字括在引号中。\n\n\n\
  \n\n\n在构建 Web 数据库应用程序时，向 MySQL 服务器发送 SQL 查询有两种常用方式：\n\n* **phpMyAdmin：** `phpMyAdmin`\
  \ 是一种专门为管理 MySQL 数据库而开发的软件。它用 PHP 编写并在浏览器中运行。它提供了一个用户界面，极大地简化了你与 MySQL 的交互。\n* **PHP\
  \ 脚本：** PHP 语言包含了专门为了向 MySQL 数据库发送 SQL 查询以及从数据库接收信息而开发的特性。\n\n### 使用 phpMyAdmin\n\
  \n`phpMyAdmin` 软件页面提供了一个与 MySQL 服务器交互的界面。要打开 phpMyAdmin 管理主页，请在浏览器的地址栏中输入 `localhost/phpmyadmin/`。如果你正在使用\
  \ XAMPP，也可以点击 XAMPP 主页面左侧橙色面板底部的 `phpMyAdmin` 链接打开 `phpMyAdmin`。\n\n![Image 5](img/index-98_1.jpg)\n\
  \n78 **第二部分：MySQL 数据库**\n\n图 4-1 显示了 `phpMyAdmin` 主页。\n\n**图 4-1：** `phpMyAdmin`\
  \ 主页。\n\n注意页面左侧的面板。面板顶部显示了一些小图标。左侧第一个图标是主页图标。任何时候点击该图标，都会返回此主页。\n\n另一个图标是问号。当你点击问号图标时，会打开一个带有\
  \ `phpMyAdmin` 文档的新窗口。\n\n你可以通过两种方式使用 `phpMyAdmin` 来管理你的数据库：\n\n* **编写 SQL 查询。**\
  \ 你可以编写自己的 SQL 查询，并使用 `phpMyAdmin` 的 SQL 功能将你的查询发送到 MySQL 服务器。\n* **点击 phpMyAdmin\
  \ 界面中的链接和按钮。** 该界面提供了许多让 MySQL 交互变得简单的功能。例如，界面具有浏览数据、搜索数据、插入数据、删除数据、导入数据以及许多其他功能。\n\
  \n#### 使用 phpMyAdmin 查询发送器发送你自己的 SQL 查询\n\n你可以使用 `phpMyAdmin` 编写自己的 SQL 查询并将其发送到\
  \ MySQL 查询。要发送查询，请遵循以下步骤：\n\n![Image 6](img/index-99_1.jpg)\n\n**第 4 章：构建数据库**\n\
  \n79\n\n1. **打开 phpMyAdmin 主页。**\n2. **点击左侧面板顶部的 SQL 图标。**\n\n将打开后续页面，如图 4-2 所示。这是一个在主页上方打开的较页面。\n\
  \n**图 4-2：** `phpMyAdmin` SQL 查询页。\n\n3. **在页面顶部的面板输入 SQL 查询。**\n4. **点击 Go（执行）按钮。**\n\
  \n执行 SQL 查询后，响应显示在主页上。小窗口保持打开，以便你根据需要输入另一个查询。\n\n使用这种方法，你可以编写并发送你需要的任何 SQL 查询。响应将显示在主页上。\n\
  \n### 使用 phpMyAdmin 界面\n\n`phpMyAdmin` 软件提供了一个用于管理数据库的界面。它包含了按钮、链接和字段，用于执行你需要完成的任务，例如创建数据库、插入数据、浏览数据、搜索数据、删除数据等。\n\
  \n当你使用界面执行任务时，`phpMyAdmin` 实际上会创建所需的 SQL 查询来告诉 MySQL 你想做什么，并将查询发送到 MySQL 服务器。如果查询返回了任何信息（例如检索了一些数据），返回的信息将显示在\
  \ `phpMyAdmin` 页面上。结果页还会为你显示已执行的查询。\n\n在本章的剩余部分将讨论对数据需要的最常见操作。你将了解到如何执行这些操作，包括如何使用\
  \ `phpMyAdmin` 完成任务。\n\n80 **第二部分：MySQL 数据库**\n\n#### 一种向 MySQL 服务器发送 SQL 查询更快的方法\n\
  \n在某些情况下，你无法使用 `phpMyAdmin` 管理或修改你的数据库。而为了简单的数据库任务编写整个 PHP 脚本是浪费时间。本侧边栏解释了一种向 MySQL\
  \ 服务器发送 SQL 查询的简单快速的方法。\n\n当安装 MySQL 时，还会安装一个名为 `mysql` 的简单文本程序（有时称为 `terminal monitor`\
  \ 或 `monitor`）。与服务器通信的程序被称为`客户端软件；`，因为此程序与 MySQL 服务器通信，所以它是一个客户端。当在该客户端中输入 SQL 查询时，响应将返回给客户端并显示在屏幕上。监控程序可以通过网络发送查询。\n\
  \n使用客户端向 MySQL 发送 SQL 查询，请遵循以下步骤：\n\n1. **找到客户端。**\n   在 Unix 和 Linux 中，默认是 `/usr/local/mysql`。在\
  \ Windows 中，默认是 `C:\\Program Files\\MySQL Server 5.0\\bin`。\n\n2. **启动客户端。**\n \
  \  在 Unix 和 Linux 中，输入路径（例如 `/usr/local/mysql`）。在 Windows 中，打开命令提示符然后输入路径（例如 `C:\\\
  Program Files\\MySQL Server 5.0\\bin`）。如果你需要输入账户名或密码，请使用以下参数：\n   * `-uuser`: `user`\
  \ 是你的 MySQL 账户名。\n   * `-p`: 此参数提示你输入密码。\n   如果你启动客户端是为了访问网络上的数据库，请在 `mysql` 命令后使用以下参数：\n\
  \   * `-hhost`: `host` 是 MySQL 所在的机器名称。\n\n   示例：\n   ```\n   mysql -hmhost.mycompany.com\
  \ -u root -p\n   ```\n\n3. **在提示时输入密码。**\n   mysql 客户端启动，你会看到类似的内容：\n   ```\n  \
  \ Welcome to the MySQL monitor. Your MySQL connection id is 459 to server version:\
  \ 5.0.15\n   Commands end with ; or \\g. Type ‘help;’ or '\\h' for help. Type '\\\
  c’ to clear the buffer\n   ```\n\n4. **选择你想使用的数据库。**\n   在 mysql 提示符下，输入：\n   ```\n\
  \   use databasename\n   ```\n   使用你想查询的数据库名称。\n\n5. **在 mysql 提示符下，输入你的 SQL 查询并在后面加上分号\
  \ (;) 然后按回车。**\n   mysql 客户端会继续提示输入，直到你输入分号才会执行查询。查询的响应将显示在屏幕上。\n\n6. **要退出 mysql\
  \ 客户端，在提示符处输入 `quit` 然后按回车。**\n\n### 使用 PHP 脚本\n\n由于本书是关于 PHP 和 MySQL 的，因此重点是从 PHP\
  \ 脚本访问 MySQL 数据库。PHP 和 MySQL 配合得很好。PHP 提供了内置函数来与 MySQL 交互。你不需要了解与数据库交互的细节，因为函数处理了所有细节。你只需要知道如何使用这些函数。\n\
  \nPHP 函数连接到 MySQL 服务器、选择正确的数据库、发送查询并接收查询从数据库检索的任何数据。我将在第 8 章详细介绍使用 PHP 函数与你的 MySQL\
  \ 数据库交互。\n\n\n\n\n\n数据库包含两个部分：用于存储数据的结构和数据本身。在接下来的几个章节中，我将解释如何创建数据库结构。\n\n首先，你创建一个没有任何结构的空数据库，然后向其中添加表。\n\
  \n你很少通过 `PHP` 脚本来创建数据库。通常情况下，在你的 Web 应用程序执行任务之前，数据库就已经存在了——从数据库中显示数据、在数据库中存储数据，或者两者兼有。也许某个应用程序可能需要你为每个客户创建一个新表，例如为每个个人创建一个新的图片库表或产品信息表。\n\
  \n在这种情况下，应用程序可能在运行期间创建一个新表。但应用程序在运行时创建数据库或表是不寻常的。\n\n### 创建新数据库\n\n你可以使用 `phpMyAdmin`\
  \ 创建新的空数据库。在创建完新数据库后，你可以向其添加表。添加表的操作将在本章的稍后部分进行说明。\n\n在本节中，我将解释如何在你的本地计算机和 Web 托管账户上创建新数据库。\n\
  \n### 在你的本地计算机上\n\n要创建一个新的空数据库，请采取以下步骤：\n\n1. **在浏览器中打开 phpMyAdmin 主页。**\n\n`phpMyAdmin`\
  \ 页面打开了。（参考图 4-1。）\n\n2. **滚动到“创建新数据库”（Create New Database）标题。**\n\n该标题位于主面板左侧列。\n\
  \n3. **在空白字段中输入你想创建的数据库名称。**\n\n4. **点击“创建”（Create）。**\n\n当你创建新数据库时，会显示一个新的 `phpMyAdmin`\
  \ 页面，如图 4-3 所示。\n\n注意，新数据库名称 —— `Customer` —— 现在显示在左窗中。`Customer` 是你在字段中输入的为新数据库命名的名称。\n\
  \n数据库名称后的 0 表示数据库中还没有任何表。\n\n![Image 7](img/index-103_1.jpg)\n\n**第 4 章：构建数据库**\n\
  \n83\n\n**图 4-3：**\n\nphpMyAdmin 新数据库页面。\n\n在主面板中，显示如下内容：\n\n数据库 Customer 已创建\n\n\
  这表明数据库已成功创建。它还显示了显示了 `phpMyAdmin` 发送的创建数据库的 SQL 语句，语句为：\n\n```\nCREATE DATABASE\
  \ ‘Customer’\n```\n\n在 SQL 语句下方，页面显示尚未创建任何表，并提供了一个你可以继续创建表的区域。我将在本章稍后讨论创建表。\n\n\
  ### 在你的 Web 托管账户上\n\n大多数 Web 托管主机都提供 `phpMyAdmin` 供你使用。因此，在某些情况下，可以使用上一节描述相同相同来创建新数据库。然而，许多\
