  \n## 字符串与模式\n\n在书早前的章节中，我使用正则表达式作为模式匹配字符串。（我在第 6 章解释了正则表达式。）以下函数使用正则表达式查找和替换字符串：\n\
  \n- `preg_match(\"pattern\",$varname)`：检查 `$varname` 中是否找到了 `pattern`。\n- `preg_replace(\"\
  pattern\",\"string\",$varname)`：在 `$varname` 中搜索 `pattern` 并将其替换为 `string`。\n\n\
  ## 获取字符串信息\n\n有时你需要知道关于字符串的信息，例如它的长度或第一个字母是否大写。PHP 提供了许多函数来检查字符串：\n\n- `strlen($varname)`：返回字符串的长度。\n\
  - `strpos(\"string\",\"substring\")`：返回 `substring` 在 `string` 中的起始位置。例如，`strpos(\"\
  hello\",\"el\")` 返回 1。记住 PHP 的起始位置是 0。`strrpos()` 找到 `substring` 在 `string` 中的最后一个位置。\n\
  - `substr(\"string\",n1,n2)`：返回从 `string` 的 `n1` 开始长度为 `n2` 的子字符串。例如，`substr(\"\
  hello\",2,2)` 返回 `ll`。\n- `strtr($varname,str1,str2)`：遍历字符串 `$varname` 搜索 `str1`\
  \ 并并在处替换为 `str2`。\n- `strrev($varname)`：返回反转后的字符串。\n\n存在更多字符串函数。请参阅 www.php.net\
  \ 的文档。\n\n396 第五部分：十项技巧\n\n## 更改字符串的大小写\n\n将大写字母转换为小写字母反反之并不容易。感谢 PHP 提供了这些此此函数：\n\
  \n- `strtolower($varname)`：将字符串中的任何大写字母转换为小写字母。\n- `strtoupper($varname)`：将字符串中的任何小写字母转换为大写字母。\n\
  - `ucfirst($varname)`：将字符串的第一个字母转换为大写。\n- `ucwords($varname)`：将字符串中每个单词的首字母转换为大写。\n\
  \n\n\n\n\n# 第 14 章\n# 十个 PHP 陷\n\n## 本章内容\n- 识别常见的 PHP 错误\n- 解释错误信息\n\n我保证你都会遇到在本章中提到的所有问题。在不犯这些错误的情况下编写程序是不可能的。诀窍在于学会如何识别它们；翻个白眼；说“又来了”；然后纠正你的错误。你经常看到的一个错误信息是\
  \ `Parse error:` parse error in `c:\\test.php` on line `7`\n\n这是 PHP 表达“哈？”的方式。意味着它不理解某些内容。这条信息非常有帮助地了\
  \ PHP 产生困惑的文件和行号。有时它会直接指向错误，但有时 PHP 的困惑是由于程序早之前的错误引起的。\n\n## 缺少分号\n\n每个 PHP 语句都以分号（`;`）结束。在遇到分号之前，PHP\
  \ 不会停止读取语句。如果你在行末漏掉分号，PHP 就会继续读取下一行的语句。例如，考虑以下语句：\n\n```php\n$test = 1\necho $test;\n\
  ```\n\n当然，当 PHP 将这两行视为一条语句时，该语句对 PHP 来说没有意义，因此它会通过错误信息进行抱怨，例如那个恼人的 `Parse error:`\
  \ parse error in `c:\\test.php` on line `2`\n\n等你回过来，你会在写家庭地址的每一行末尾都加上分号。\n\n##\
  \ 等号不足\n\n当你在比较语句中询问两个值是否相等时，你需要两个等号（`==`）。使用一个等号是一个常见的错误。\n\n这完全合理，因为从你一年级发现 `2\
  \ + 2 = 4` 起，你就一直用一个等号来表示*相等*。这是一个很难识别的错误，因为它不会导致错误信息。它只是会让你的程序执行一些奇怪的操作，比如死循环或从不执行的\
  \ if 块。我一直惊讶于自己能盯着\n\n```php\n$test = 0;\nwhile ( $test = 0 )\n{\n    $test++;\n\
  }\n```\n\n却看不出它为什么在无限循环。\n\n## 变量名拼写错误\n\n变量名拼写错误是另一个 PHP 陷阱，不会导致错误信息，只会导致奇怪的程序行为。如果你拼错了变量名，PHP\
  \ 会认为它是一个新变量并按照你的要求执行操作。\n\n这是另一种编写死循环的聪明方法：\n\n```php\n$test = 0;\nwhile ( $test\
  \ == 0 )\n{\n    $Test++;\n}\n```\n\n记住，对于 PHP 来说，`$test` 和 `$Test` 不是同一个变量。\n\n\
  ## 缺少美元符号\n\n变量名中缺少美元符号很难发现，但至少它极有可能导致一个错误信息，告诉你该去哪里查找问题。它通常会导致那个老熟悉的解析错误：`Parse\
  \ error:` parse error in `test.php` on line `7`\n\n## 困扰的引号\n\n你拥有的引号太多、太少，或者类型错误。当你在引号内部放置引号时，引号就太多了，例如\n\
  \n```php\n$test = \"<table width=”100%>”;\n```\n\nPHP 将第二个双引号（100 之前的 `“`）视为结束双引号（`“`），并将\
  \ `1` 读取为指令，这毫无意义。*瞧（Voilà！）* 另一个解析错误。该行必须是：\n\n```php\n$test = \"<table width=’100%’>\"\
  ;\n```\n\n或者\n\n```php\n$test = \"<table width=\\”100\\\\”>\";\n```\n\n当你忘记结束引号字符串时，引号就太少了，例如\
  \ `$test = \"<table width=’100%’>;`。PHP 会继续读取后续行作为引号字符串的一部分，直到遇到另一个双引号（`“`），这可能在好几行之后才会出现。这是解析错误指向\
  \ PHP 困惑之处而非指向实际错误的情况之一。错误发生在几行之前，即你忘记结束字符串时。\n\n当你本该用双引号（`“`）却使用了单引号（`’`）或反之然时，你就使用了引号类型错误。单引号和双引号之间的区别有时很重要，正如我在第\
  \ 6 章中解释的那样。\n\n## 不可见输出\n\n某些语句（例如头部语句）必须在程序产生任何输出之前执行。如果你尝试在发送输出后使用此类语句，它们就会失败。以下语句将失败，因为头部信息不是第一个输出：\n\
  \n```html\n<html>\n<?php\nheader“Location: http://company.com”\n?>\n</html>\n```\n\
  \n`<html>` 不在 PHP 区域，因此被作为 HTML 输出发送。以下语句将有效：\n\n```php\n<?php\nheader“Location:\
  \ http://company.com”\n?>\n<html>\n```\n\n以下语句将失败\n\n```php\n\n<?php\nheader“Location:\
  \ http://company.com”\n?>\n<html>\n```\n\n因为在打开 PHP 标签之前有一个单空格。该空格被输出到浏览器，尽管生成的\
  \ Web 页面看起来是空的。因此，头部语句失败了，因为在它之前有了输出。这是一个常见的错误且难以发现。\n\n## 索引数组\n\nPHP 认为数组中的第一个值是从零（0）开始编号的。当然，人类倾向于认为列表是从数字一（1）开始的。这种根本不同的列表看待方式让我们人类在数组运行正常的情况下认为它没有正常工作。例如，考虑以下内容：\n\
  \n```php\n$test = 1;\nwhile( $test <= 3 )\n{\n    $test++;\n}\n```\n\n##  PHP 语句\n\
  \n在 PHP 区域读取文件时，我认为这些语句会被视为 PHP 处理。然而，如果名为 `inc` 的文件包含以下内容：\n\n```php\nif( $test\
  \ == 1 )\necho “Hi”;\n```\n\n我预计 Hi 这个词会出现在 Web 页面上。然而，Web 页面显示的是：\n\n```html\n\
  if ( $test == 1 ) echo “Hi”;\n```\n\n为了将 Hi 发送到 Web 页面，`inc` 需要 PHP 标签，如下：\n\n```php\n\
  <?php\nif( $test == 1 )\necho “Hi”;\n?>\n```\n\n## 缺失配\n\n括号和大括号是成对出现的且必须那样使用。开启\
  \ `(` 但没有 `)` 或开启 `{` 没有 `}` 会导致错误信息。我最喜欢的错误之一是在需要两个右括号的地方使用了一个，如下所示：\n\n```php\n\
  if( isset($test)\n```\n\n该语句末尾需要一个右括号。当你有嵌套块时，要发现某个块没有关闭要困难得多。例如，考虑以下内容：\n\n```php\n\
  while( $test < 3 )\n{\n    if( $test2 != “yes” )\n    {\n        if( $test3 > 4\
  \ )\n        {\n            echo “go”;\n        }\n    }\n}\n```\n\n你可以看到有三个左大括号但只有两个右大括号。假设这些块内部有\
  \ 100 行代码。发现问题可能很难——尤其是当你认为最后一个右大括号是关闭 while 循环的，但 PHP 认为它是在关闭 `$test2` 的 if 循环。在程序的后续地方，PHP\
  \ 可能会使用一个大括号来关闭你根本没在看的 while 循环。\n\n缩进块更容易看到右大括号所属的位置。此外，我经常使用注释来跟踪自己的位置，例如\n\n\n\
  \n```php\nwhile( $test < 3 )\n{\n    if( $test2 != “yes” )\n    {\n        if( $test3\
  \ > 4 )\n        {\n            echo “go”;\n        } // 关闭 if 块 for $test3\n  \
  \  } // 关闭 if 块 for $test2\n} // 关闭 while 循环\n```\n\n\n\n\n我不确定将圆括号误认为方括号反之亦然对所有人来说都是一个问题，还是仅仅对我而言如此，因为我不愿承认自己的视力不如以前了。虽然\
  \ PHP 在区分圆括号和大括号方面没有问题，但我的眼睛就不那么可靠了。特别是在连续持续了十小时编程马拉松之后，盯着电脑屏幕时，我很容易混淆 `(` 和 `{`。使用错误的符号会导致出现解析错误信息。\n\
