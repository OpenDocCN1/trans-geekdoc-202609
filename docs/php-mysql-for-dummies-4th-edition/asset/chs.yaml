  ## On your local computer\n\nTo test whether PHP is installed and working, follow\
  \ these steps:\n\n**1. Find the directory in which your PHP programs need to be\
  \ saved.**\n\nThis directory and the subdirectories under it are your *Web space.*\
  \ Apache calls this directory the *document root.* Here’s where you can find your\
  \ directory:\n\n• If you installed PHP from XAMPP, the default Web space is `c:\\\
  xampp\\htdocs` on Windows and `Applications/xampp/htdocs` on Mac.\n• If you installed\
  \ PHP and Apache yourself, individually, the default Web space is the subdirectory\
  \ `htdocs` in the directory where Apache is installed.\n• If you’re using IIS as\
  \ your Web server, it’s `Inetpub\\wwwroot`.\n• In Linux, it might be `/var/www/html`.\n\
  \nYou can set the Web space to a different directory by configuring the Web server\
  \ (see Appendix B).\n\n**2. Create the following file somewhere in your Web space\
  \ with the name `test.php`.**\n\n```html\n<html>\n<head><title>PHP Test</title></head>\n\
  <body>\n\n<p>This is an HTML line</p>\n<?php\necho \"<p>This is a PHP line</p>\"\
  ;\nphpinfo();\n?>\n\n</body>\n</html>\n```\n\nThe file must be saved in your Web\
  \ space for the Web server to find it.\n\n**3. Execute the `test.php` file created\
  \ in Step 2.**\n\n\n\n要在你自己的计算机上运行一个文件，你可以使用名称 `localhost` 访问默认的 Web 空间。因此，要执行该文件，请在浏览器地址栏中输入\
  \ `localhost/test.php`。\n\n为了让 PHP 处理该文件，你需要通过 Web 服务器访问文件 ——而不是从 Web 浏览器菜单中选择“文件➪打开”。\n\
  \n你应该会在 Web 浏览器中看到以下内容：\n\n这是一行 HTML 内容\n这是一行 PHP 内容\n\n## 第一部分：使用 PHP 和 MySQL 开发\
  \ Web 数据库应用程序\n\n在这些行下方，你应该看到一个大表格，显示了与你系统中 PHP 相关的信息。它显示了 PHP 信息、路径名和文件名、变量值以及各种选项的状态。该表格是由测试脚本中的\
  \ `phpinfo()` 行生成的。\n\n每当你对 PHP 设置有任何疑问时，都可以使用 `phpinfo()` 显示此表格并检查某项设置。\n\n###\
  \ 4. 检查你所需设置的 PHP 值。\n\n例如，你需要启用 MySQL 支持。浏览列表，找到 MySQL 部分，并确保 MySQL 支持为 On（开启）。\n\
  \n此外，在输出的顶部，你将看到正在运行的 PHP 版本号。请确保你运行的是 PHP 5，而不是 PHP 4。\n\n### 5. 根据需要更改值。\n\nPHP\
  \ 的通用设置存储在一个名为 `php.ini` 的文件中。你可以通过更改这些设置来改变 PHP 的行为。本书的相应章节将将讨论各种 PHP 设置。\n\n附录\
  \ B 讨论了你如何更改 PHP 设置。\n\n## 在 Web 托管公司上\n\n如果你的网站托管在 Web 托管公司上，你需要测试 PHP 是否运行正常并查看设置是哪些。在上一节的第\
  \ 2 步中，你创建了一个测试 PHP 程序。在此测试中，你把此文件上传到你的 Web 网站并确保它正确运行。\n\n1. **找到测试文件。**\n2. **将测试文件上传到你的\
  \ Web 网站。**\n3. **通过在浏览器地址栏中输入其地址在你的 Web 网站上执行测试 PHP 文件。**\n\n即，输入包含文件名的域名，例如 `www.myfinecompany.com/test.php`。\n\
  \n如果文件运行成功，你会在 Web 上看到一个长列表，与你在本地计算机上执行此文件时看到的输出相似。\n\n### 4. 检查你所需设置的 PHP 值。\n\n\
  检查并确保你的网站运行的是 PHP 5，而不是 PHP 4。此外，确保 MySQL 支持已激活。\n\n### 5. 根据需要更改值。\n\n在你的网站上，你无法更改通用\
  \ `php.ini` 文件中的设置。然而，你可以通过其他方式更改 Web 托管账户上的 PHP 设置。更改设置的方法详见附录 B。\n\n## 第 2 章：搭建你的工作环境\n\
  \n### 测试你的本地 PHP 配置文件\n\nPHP 有许多你可能想要更改的配置。这些设置存储在一个名为 `php.ini` 的文本文件中。你的 Web 托管商肯定不会提供访问影响所有用户\
  \ PHP 设置的通用 `php.ini` 文件的权限，但某些主机允许你在自己的网站中使用本地 `php.ini` 文件，该文件仅影响你的 PHP 设置。\n\n\
  如果你可以使用本地的 `php.ini` 文件，编写 程序 程序将简单得多。你应该测试你的 Web 托管商是否允许使用本地 `php.ini` 文件。方法如下：\n\
  \n1. **创建一个名为 `php.ini` 的空文本文件，并将空文件上传到你的 Web 网站主目录。**\n2. **在你 Web 网站上执行之前创建的 `test.php`\
  \ 程序。**\n3. **检查程序输出的设置列表。**\n\n靠近顶部有一个名为 `Loaded Configuration File` 的设置。此设置显示了当前生效的\
  \ `php.ini` 文件的路径。如果你的主机允许本地 `php.ini` 文件，该设置将显示你刚刚上传的空文件的路径。\n\n如果你上传的文件路径不是本地\
  \ `php.ini` 文件的路径，那么你的主机可能不允许本地 `php.ini` 文件。不过，问一下也无妨大碍。\n\n也许你或你的主机中的其中一人需要进行一些额外操作来设置它。又可能，如果有足够的人要求，你的主机将改变其政策。\n\
  \n### 测试 MySQL\n\n在你确认 PHP 运行正常后，可以测试是否能通过 PHP 访问 MySQL。（注：原文此处有大量重复句子，翻译已根据逻辑精简并保留核心意图）\n\
  \n\n\n\n如果您无法使用现有的账号和密码登录，请联系 IT 部门或提供该账号的 Web 托管公司。（有关 `MySQL` 账户和密码的进一步讨论，请参阅第\
  \ 5 章。）\n\n# 第一部分：使用 PHP 和 MySQL 开发 Web 应用程序\n\n## 第 3 章\n## 开发 Web 应用程序\n\n###\
  \ 本章内容\n- 规划你的应用程序\n- 选择和组织数据\n- 设计你的数据库\n- 构建数据库：概述\n- 编写应用程序程序：概述\n\n开发 Web 数据库应用程序不仅仅是在\
  \ `MySQL` 数据库中存储数据以及编写 `PHP` 程序。开发必须从规划开始。在规划之后才是构建程序的各个部分。开发步骤如下：\n\n1. 制定一个计划，列出你的应用程序将执行的任务。\n\
  2. 设计支持你的应用程序任务所需的数据库。\n3. 根据数据库设计构建 `MySQL` 数据库。\n4. 编写执行应用程序任务的 `PHP` 程序。\n\n\
  我将在本章中详细讨论这些步骤。\n\n## 规划你的 Web 数据库应用程序\n\n在开始敲击键盘编写 `PHP` 程序之前，你对对你的 Web 数据库应用程序进行规划。这可能是开发应用程序过程中最重要的一步。如果你在刚完成应用程序的最后一个程序后，才发现漏掉了某些内容而必须从头开始，那种感觉是非常痛苦的。当你通过把电脑踢到房间另一头来发泄挫败时，对你的电脑（以及你的脚）来说也是很残的。\n\
  \n良好的规划可以避免这种痛苦的回头重路。此外，它还能让你专注于应用程序的功能，从而防止你编写出一些看起来很酷但在最终完成的应用程序中没有实际用途的片段。如果有多个个人共同开发你的应用程序，规划可以确保所有部分最终能够完美契合。\n\
  \n### 确定你想要应用程序实现的功能\n\n规划阶段的第一步是准确确定你为什么要开发该应用程序，以及你希望从从中获得什么。例如，你的主要目的可能是：\n\n\
  - 收集用户的姓名和地址，以便建立客户列表。\n- 向用户提供有关产品的信息，例如客户目录。\n- 在线销售产品。\n- 为已经拥有你产品的人提供技术支持。\n\
  \n在明确识别出应用程序的总用途后，列出你确切想要该应用程序执行的每一个任务。例如，如果你的目标是为营销目的开发一个客户姓名和地址的数据库，那么应用程序所需的任务列表就很短：\n\
  \n- 为客户提供一个填写表单。\n- 将客户信息存储在数据库中。\n\n如果你的目标是在线销售产品，列表会长一些：\n\n- 向客户提供有关产品的信息。\n\
  - 激励客户购买产品。\n- 为客户提供在线订单产品的方法。\n- 为客户提供在线支付产品费的方法。\n- 验证支付，以便确保你确实会收到钱。\n- 将订单发送给负责填写订单并向客户发送产品的人员。\n\
  \n在规划过程的这一阶段，你希望应用程序执行的任务仍然相当通俗。你可以通过许多不同的方式完成这些每一个任务。因此，现在你需要仔细检查这些任务，并详细说明应用程序将如何实现它们。\n\
  \n### 第 3 章：开发 Web 应用程序\n\n到此时，你应该对想要从数据库应用程序中获得什么有一个相当清晰的思路。然而，这并不意味着你的目标不能改变。事实上，随着你开发数据库应用程序，你的目标很可能会改变。在项目开始时，从一个尽可能全面的计划开始保持专注。\n\
  \n### 考虑用户因素\n\n确定*你*想要数据库应用程序做什么只是规划的一个方面。你还必须考虑你的用户希望从中获得什么。例如，假设你的目标是收集一份用于营销的姓名和地址列表。客户愿意提供这些信息吗？\n\
  \n你的应用程序不仅要满足你的需求，还需要满足用户的需求。否则，他们会忽略它。例如，在用户愿意向你提供姓名和地址之前，他们需要感知到他们将从中受益。以下是用户可能愿意在你的网站注册姓名和地址的几个例子：\n\
  \n- 接收通讯报：为了具有价值，通讯报应该涵盖与产品相关的行业。它应该提供新闻并发现趋势——而不仅仅是关于你产品的营销材料。\n- 参加抽奖赢美奖品的活动：谁能拒绝赢得夏威夷全费用之旅或一辆全新的\
  \ SUV 的机会呢？\n- 接收特别折扣：例如，你可以定期向客户发送特别折扣优惠邮件。\n- 在新产品或产品升级可用时通知他们：例如，客户可能对在软件更新可下载时收到通知感兴趣。\n\
  - 获取有价值的信息：例如，许多杂志和报纸要求你在他们的网站上注册才能在线阅读他们的文章。\n\n现在，将客户任务添加到你希望应用程序执行的任务列表中。例如，考虑你为建立在线零售店确定的以下任务列表：\n\
  \n- 为客户提供一个填写表单。\n- 将客户信息存储在数据库中。\n\n\n\n\n\n如果你考虑到客户的观点，列表会稍微扩展一下：\n\n-   描述客户在网站上注册后可以获得的优势。\n\
  -   提供一个供客户填写的表单。\n-   将客户的电子邮件地址添加到时事通讯列表中。\n-   将客户信息存储在数据库中。\n\n当你列出你想要的任务以及你的用户需要的任务后，你就有了一个\
  \ Web 应用的计划，这个计划既值得你花时间去开发，也值得你的用户花时间去使用\n\n### 让网站易于使用\n\n除了规划你的 Web 应用要做什么之外，你还需要考虑它如何实现这些。让你的应用程序易于使用非常重要：如果客户找不到你的产品，他们就不会购买。\n\
  \n而且，如果客户在短时间内找不到他们需要的信息，他们就会去别的地方。在互联网上，客户可以很容易地去其他地方。\n\n让你的应用程序易于使用就是`可用性工程。`Web\
  \ 可用性包括以下问题：\n\n-   **导航：** 你的网站上有什么及其所在位置应该让用户一目了然。\n-   **图形：** 图形让你的网站具有吸引力，但图形文件的显示速度可能较慢。\n\
  -   **访问：** 某些设计决定可能让你的应用程序对于视觉障碍等残障用户可用或不可。\n-   **浏览器：**不同的浏览器（即使是同一浏览器的不同版本）可能会不同的方式显示同一个\
  \ HTML 文件。\n\nWeb 可用性是一个大而重要的课题，深入探讨该主题已超出本书的范围。但不要担心；你可以在 Web 上——你猜得没错——找到许多关于\
  \ Web 可用性的有用信息。务必查看可用性专家 Jakob Nielsen (`www.useit.com`) 和 Jared Spool (`www.uie.com`)\
  \ 的网站。Vincent Flanders 也有一个有趣的网站，里面充满了关于 Web 设计的有用信息，地址为 `http://webpagesthatsuck.com`。关于该主题的书籍也很有帮助，例如\
  \ Lisa Lopuck 编写的`Web Design For Dummies》（Wiley 出）。\n\n### 为扩展留出空间\n\n关于你的 Web 应用有一点是肯定的，那就是会随着时间的推移而改变。\n\
  \n将来，你可能会为它考虑新功能，或者只是想改变它的某些地方。也许 Web 软件得到了改进，使得你的 Web 应用能够完成一些在你最初上线时无法完成的事情。无论原因如何，你的网站都会改变。在规划应用程序时，你需要考虑到未来的变化。\n\
  \n你可以分步骤设计你的应用程序，并考虑到计划中的更改。你可以制定一个计划，在今天构建一个满足你最紧迫需求的应用程序，并在它准备就绪后立即发布。\n\n你的计划可以包括根据你开发的速度尽快地为应用程序添加功能。例如，你可以构建一个产品目录并在准备好后立即发布在你的网站上。然后你可以开始为该网站开发在线订购功能，等它准备好后再将其添加。\n\
  \n你不一定能预见到你可能在应用程序中想要的所有功能。例如，你今天在设计旅游 Web 网站时可能包含了所有可能的目的地的板块，但未来可能会给你惊喜。去火星旅行？去阿尔法参座？去平行宇宙？在规划应用程序时，要保持所需的灵活性，以便在未来添加功能。\n\
  \n## 记录下来\n\n*写下你的计划。* 你会经常从我这里听到这句话。我是从没有记录的痛苦经历中说出它的。当你制定计划时，它首先存在你的脑海中，而且非常清晰。但在短短几周后，你会惊讶地发现，当你的注意力转向其他紧迫的问题时，它已经变得完全模糊了。或者在一年后你想要对应用程序做一些更改，却记不起应用程序具体是如何设计的。或者你正与伙伴合作开发一个应用程序，你发现你的伙伴误解了你的口头解释，并开发了不符合你计划的应用程序功能。你可以通过记录一切来避免这些类型的问题\n\
  \n## 在书中介绍这两个示例\n\n在接下来的章节中，我将介绍为本书创建的两个示例应用程序。通过这些示例演示 Web 设计方面。\n\n### 销售商品\n\n\
  第一个示例是在线目录。你是一家宠物商店的主人，并希望目录向客户提供有关宠物的信息。在线销售是可行的，尽管你正在考虑让客户在线预订宠物——即在进入商店购买之前。目前，应用程序只是一个在线目录。关于所有宠物的信息存储在数据库中。\n\
  \n这是你对该应用程序的计划：\n\n-   **允许客户选择他们想要查看宠物信息。**\n    提供选择方法：\n    -   *从列表中选择：* 显示链接（狗、猫、恐龙等）。当客户点击类别链接时，将显示列表。列表中的每个宠物都是指向描述的链接。\n\
  \    -   *输入搜索词：* 显示一个表单，让客户在其中输入他们正在寻找的宠物类型。\n      应用程序搜索数据库中的匹配单词并显示宠物信息。\n \
  \     例如，客户可以输入 `cat` 来查看所有猫的列表。列表中的每只猫都是指向描述的链接。\n-   **当客户点击链接时显示宠物的描述。**\n  描述存储在数据库中。\n\
  \n### 会员专属\n\n第二个 Web 数据库应用程序与之前的示例有关。除了在线目录，你还想在你的宠物商店网站上开设一个会员专属区域。要访问该区域，客户必须注册——提供他们的姓名和地址。在这个专属区域，客户可以折扣购买食物，了解已订单尚未到达的宠物，并获取有关宠物和护理的文章。\n\
  \n这是对该应用程序的计划：\n\n-   **显示该区域提供的特殊功能和信息。**\n-   **为客户提供一个注册会员区域的区域。**\n    - *提供指向注册区域的链接。*\n\
  \    - *在注册区域显示一个表单，让客户在其中填写注册信息。*\n      表单应包含用户登录名称和密码的空间，以及你想收集的信息。\n    - *验证用户输入的信息。*\n\
  \      例如，验证邮政编码长度正确，并且电子邮件地址格式正确。\n    - *将信息存储在数据库中。*\n-   **为已经注册会员的客户提供一个登录部分。**\n\
  \    - *显示一个要求输入用户名和密码的登录表单。*\n    - *将录入用户名和密码与数据库中的用户名和密码进行比较。*\n      如果没有找到匹配项，则显示错误消息。\n\
  -   **在客户成功登录后显示会员专属 Web 页面。**\n\n\n\n\n\n## 设计数据库\n\n在你准确确定了 Web 数据库应用要做的功能之后（如果你还没有做这一点，请参阅本章的开头），你就可以准备设计存储应用程序所需信息的数据库了。设计数据库包括识别你需要的数据，并按照数据库软件的要求组织数据。\n\
  \n### 选择数据\n\n首先，你必须确定哪些信息属于你的数据库。查看你希望应用程序执行的任务列表，并确定为了完成这些每项任务你需要哪些信息。\n\n这里是几个例子：\n\
  \n- ✓ 在线产品目录需要一个包含产品信息的数据库。\n- ✓ 在线订单应用程序需要一个可以存储客户信息和订单信息的数据库。\n- ✓ 旅游网站需要一个包含目的地信息、预订、票价、时间表等信息的数据库。\n\
  \n在很多情况下，你的应用程序可能包含从用户那里收集信息的任务。你必须在“收集所有能想到的潜在有用信息”的冲动与“用户不愿提供个人信息以及避免填写看起来太耗时的表单”的心理之间取得平衡。一种折中方案是要求一些可选信息。\n\
  \n不介意的用户可以填写，而反感的用户可以留空。\n\n另一种可能性是提供激励：表单越长，你为了激励用户填写表单而需要提供的激励就越强。用户可能愿意填写一个短表单来参加赠送两张电影预影票作为奖品的抽奖。但如果表单长而复杂，奖品就需要更有价值，例如免费的加利福尼亚之旅和好莱坞电影制片厂导游。\n\
  \n在宠物目录应用程序中，你的客户在线目录中搜索他们可能想要购买的宠物信息。你希望客户看到能够激励他们购买宠物的信息。你希望在数据库中供客户查看的信息如下：\n\
  \n- ✓ 宠物的名称（例如贵宾犬或独角兽）\n- ✓ 宠物的描述\n- ✓ 宠物的照片\n- ✓ 宠物的费用\n\n在第二个示例应用程序“仅限会员”部分中，你想存储关于注册成员的信息。你希望在数据库中存储的信息如下：\n\
  \n- ✓ 成员姓名\n- ✓ 成员地址\n- ✓ 成员电话号码\n- ✓ 成员传真号码\n- ✓ 成员电子邮件地址\n\n花时间制定一份你需要在数据库中存储的信息的全面列表。虽然你可以在开发后更改和向数据库添加信息，但从一开始就包含这些信息更容易。此外，如果你在数据库在使用后才向其添加信息，数据库中的早期用户将拥有不完整的信息。例如，如果你更改了表单，现在要求填写用户的年龄，你将无法获得已经填写过表单并已经在数据库中的人的年龄。\n\
  \n### 组织数据\n\nMySQL 是一个 RDBMS（关系型数据库管理系统），这意味着数据被组织成表。（有关 MySQL 的更多信息请参阅第 1 章。）你可以在数据库的表之间建立关系。\n\
  \n### 在表中组织数据\n\nRDBMS 表格的组织方式与其他熟悉的表格类似——行和列，如图 3-1 所示。特定行和列相交的地方，即单个单元格称为 `field`（字段）。\n\
  \n```\nColumn 1 | Column 2 | Column 3 | Column 4\n------------------------------------------\n\
  Row 1    |          |           |         \nRow 2    |          |           |  \
  \       \nRow 3    | Field    |           |         \nRow 4    |          |    \
  \       |         \nRow 5    |          |           |         \n```\n\n**图 3-1：**\
  \ `MySQL` 数据被组织成表。\n\n每个表的关注点是你想要存储其信息的 `object`（事物）。这里是一些示例：\n\n- Customers\n-\
  \ Companies\n- Animals\n- Cities\n- Books\n- Computers\n- Shapes\n- Documents\n\
  - Projects\n- Weeks\n\n你识别你想要存储信息的对象。为每个 `object` 创建表。表名应清晰地标识它包含的内容。名称必须是字符串，包含字母、数字、下划线或美元符号，且没有空格。通常表名使用单数形式。因此，客户表可以命名为\
  \ `Customer`，客户订单表可以命名为 `CustomerOrder`。\n\n大小写在 Linux 上敏感，但在 Windows 上不敏感。在数据库中，每一行代表一个实体，每一列包含\
  \ `attributes`（属性）。\n\n以下是将数据组织成表的步骤：\n\n1. **命名数据库。** 为数据库分配一个名称。例如，包含家庭信息的数据库可以可能是\
  \ `HouseholdDirectory`。\n2. **识别对象。** 查看你想要存储的信息列表（见本文之前的“选择数据”部分）。分析你的列表并识别对象。例如，`HouseholdDirectory`\
  \ 可能需要：\n   - 每个家庭成员的姓名\n   - 家庭地址\n   - 电话号码\n   - 每个家庭成员的年龄\n   - 每个家庭成员的喜爱的谷物\n\
  \   当你仔细分析此列表时，你会意识到你正在存储两个对象的信息：家庭和成员。也就是说，地址和电话号码属于家庭，而姓名、年龄和喜欢的谷物属于成员。\n3. **为每个对象定义并命名表。**\
  \ 例如，`HouseholdDirectory` 数据库需要一个名为 `Household` 的表和一个名为 `HouseholdMember` 的表。\n\
  4. **识别属性。** 分析你的信息列表，识别每个对象所需的属性。将要存储的信息拆分为最小合理的单元。例如，在表中存储人的姓名时，可以将姓名拆分为 `firstName`\
  \ 和 `lastName`。这样做可以让你根据 `lastName` 进行排序，如果将姓和名存储在一起将非常困难。你甚至可以将姓名拆分为 `firstName`、`middleName`\
  \ 和 `lastName`，虽然许多应用程序并不单独使用中间名。\n5. **为你识别的每个独立属性定义并命名列。** 为每列给一个清晰标识该列信息的名称。列名应该是单个单词，没有空格。例如，你可能会将列命名为\
  \ `firstName` 和 `lastName`，或者 `first_name` 和 `last_name`。\n\n某些单词是 `MySQL` 和 `SQL`\
  \ 自身使用的保留词，不能作为列名。这些单词当前用于 `SQL` 语句或预留供以后使用。例如，`ADD`、`ALL`、`AND`、`CREATE`、`DROP`、`GROUP`、`ORDER`、`RETURN`、`SELECT`、`SET`、`TABLE`、`USE`、`WHERE`\
  \ 以及更多更多不能作为列名。有关保留字的完整列表，请参在线 `MySQL`手册：`www.mysql.com/doc/en/Reserved_words.html`。\n\
  6. **识别主键。**\n\n\n\n\n表中的每一行都需要一个唯一的标识符。表中任何两行之间都不应该是完全相同的。当你设计表时，你需要决定哪一列作为唯一标识符，这被称为\
  \ `primary key`（主键）。主键可以由多个列组合而成。在许多情况下，你的对象属性可能没有唯一的标识符。例如，客户表可能没有唯一标识符，因为两个客户可能有相同的名称。当没有唯一标识符列时，你需要专门添加一列作为主键。通常使用一个带有序列号的列来实现此目的。例如，在图\
  \ 3-2 中，主键是 `cust_id` 字段，因为每个客户都有一个唯一的 ID 号。\n\n| `cust_id` | `first_name` | `last_name`\
  \ | `phone` |\n| :--- | :--- | :--- | :--- |\n| 27895 | John | Smith | 555-5555\
  \ |\n| 44555 | Joe | Lopez | 555-5553 |\n| 23695 | Judy | Chang | 555-5552 |\n|\
  \ 27822 | Jubal | Tudor | 555-5556 |\n| 29844 | Joan | Smythe | 555-5559 |\n\n**图\
  \ 3-2：** 客户表的示例。\n\n**第 3 章：开发 Web 数据库应用程序** 59\n\n### 7. 定义默认值。\n你可以定义一个默认值，当字段中没有输入数据时，`MySQL`\
  \ 会为其分配。默认值不是必选的，但通常很有用。例如，如果你的应用程序存储了包含国家的地址，你可以指定 `US` 为默认值。如果用户没有输入国家，则将输入 `US`。\n\
  \n### 8. 识别需要数据的列。\n你可以指定某些列不允许为空（也称为 `NULL`）。例如，包含 `primary key` 的列不能不能为空。这意味着如果该列中没有存储任何值，`MySQL`\
  \ 将不会创建该行并返回错误消息。该值可以是空格或空字符串（例如 `\"\"`），但该列中必须存储某个值。除了 `primary key` 之外，其他列也可以设置为需要数据。\n\
  \n设计良好的数据库将每条信息仅存储在一个地方。存储在多个地方是低效的，并且在信息需要更改时会产生问题。如果你在一个地方更改了信息，但忘记在另一个地方更改，你的数据库可能会出现严重问题。\n\
  \n如果你发现自己正在几行中存储相同的数据，你可能需要重新组织你的表。例如，假设你正在存储关于书籍的数据，包括出版商的地址。当你输入数据时，你发现自己在许多行中输入了相同的出版商地址。\n\
  \n存储这些数据更有效的方法是将书籍信息存储在一个表中，将书籍出版商信息存储在另一个表中。\n\n你可以定义两个表：`Book` 和 `BookPublisher`。在\
  \ `Book` 表中，你将拥有 `title`、`author`、`pub_date` 和 `price` 列。在 `BookPublisher` 表中，你将拥有\
  \ `name`、`street Address` 和 `city` 等列。\n\n### 创建表之间的关系\n数据库中的某些表是相关的。通常情况下，一个表中的某行与另一个表中的几行相关。需要一列来连接不同表中的相关行。\n\
  \n数据库中的某些表是相关的。通常情况下，一个表中的某行与另一个表中的几行相关。需要一列来连接不同表中的相关行。\n\n数据库中的某些表是相关的。通常情况下，一个表中的某行与另一个表中的几行相关。需要一列来连接不同表中的相关行。\n\
  \n（注：此处原文存在大量重复段落，根据指令“不要重复输出原文”，此处保留核心逻辑结构并翻译为关于表相关性的描述）\n\n需要一列来连接不同表中的相关行。\n\n\
  （此处省略后续完全重复的段落翻译）\n\n设计数据库。\n\n**第 3 章：开发 Web 数据库应用程序** 61\n\n## 设计数据库\n你通过以下步骤设计\
  \ `PetCatalog` 数据库：\n\n#### 1. 命名你的数据库。\n数据库名称为 `PetCatalog`。\n\n#### 2. 识别对象。\n\
  信息列表是：\n- 宠物名称（贵宾或独角兽）\n- 宠物的描述\n- 宠物的照片\n- 宠物的价格\n- 宠物的分类\n\n所有这些信息都是关于宠物的，因此该列表唯一的对象是\
  \ `Pet`。\n\n#### 3. 为每个对象定义并命名表。\nPet Catalog 应用需要一个名为 `Pet` 的表。\n\n#### 4. 识别每个对象的属性。\n\
  现在你详细查看属性：\n\n- **Name of the pet**：单个属性（例如贵宾或独角兽）。然而，看起来你的宠物店可能同时有多个贵宾犬待售。因此，你的表需要一个唯一的标识符。\n\
  - **Pet identification number**（宠物编号）：当宠物添加到表时，为每个宠物分配的序列号。这个数字就是 `primary key`（主键）。\n\
  - **Description of the pet**：两个属性——打印时显示的宠物文字描述和宠物的颜色。\n- **Picture of the pet**：指向包含宠物美图片的图形文件路径。\n\
  - **Cost of the pet**：商店对宠物要求的美元金额。\n- **Category for the pet**：两个属性：一个包含宠物的分类名称（例如狗、马、龙）以及分类的描述。\n\
  \n在 `Pet` 表中包含两种信息是低效的：\n\n- **Category description**（分类描述）：分类信息包含了分类的描述。由于每个分类可以包含多只宠物，在\
  \ `Pet` 表中包含分类描述会导致相同的描述出现在多行中。更有效的方法是将宠物分类定义为拥有自己表的对象。\n- **Pet color**（宠物颜色）：如果宠物有多种颜色，所有的宠物信息将在每个颜色的单独行中重复。更有效的方法是将宠物颜色定义为拥有自己表的对象。\n\
  \n添加的表命名为 `PetType` 和 `PetColor`。\n\n**5. 定义并命名列。**\n**第一部分：使用 MySQL 开发 Web 数据库应用程序**\
  \ 62\n\n\n\n`Pet` 表每只宠物拥有一行数据。`Pet` 表的列如下：\n\n- `petID`: 分配给每只宠物的唯一序列号。\n- `petName`:\
  \ 宠物的名字。\n- `petType`: 类别名称。该列将宠物连接到 `PetType` 表中正确的行。\n- `petDescription`: 宠物的描述。\n\
  - `price`: 宠物的价格。\n- `pix`: 包含宠物照片的文件名。\n\n`PetType` 表每个宠物类别拥有一行数据。它包含以下列：\n\n-\
  \ `petType`: 某种类型宠物的类别名称。这是该表的主键。注意 `Pet` 表中有一个同名的列。这些列将此表与 `Pet` 表连接起来。\n- `typeDescription`:\
  \ 宠物类型的描述。\n\n# 第 3 章：开发 Web 数据库应用程序\n\n`PetColor` 表每种宠物颜色拥有一行数据。它包含以下列：\n\n- `petName`:\
  \ 宠物的名字。该列将颜色行连接到 `Pet` 表中正确的行。\n- `petColor`: 宠物的颜色。\n- `pix`: 包含指定颜色宠物照片的文件名。\n\
  \n### 6. 识别主键。\n\n- `Pet` 表的主键是 `petID`。\n- `PetType` 表的主键是 `petType`。\n- `PetColor`\
  \ 表的主键是 `petName` 和 `petColor` 的组合。\n\n### 7. 定义默认值。\n\n任何表均未定义默认值。\n\n### 8. 识别需要强制数据的列。\n\
