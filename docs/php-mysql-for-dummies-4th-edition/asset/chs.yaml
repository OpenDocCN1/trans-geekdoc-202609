  \n字体 启动会话。会话必须在程序开始时启动，即使用户尚未登录。\n- 启动 switch 语句。`switch` 包含三个部分，基于表单中提交按钮的值，该值从内置数组\
  \ `$_POST` 获取。第一部分在按钮值为“登录”时运行；第二部分在按钮值为 `Register` 时运行；第三部分是在未传递按钮值时运行的默认部分。\n\
  - 文件为 `dogs.inc`，这是一个具有误导性的名称。\n- `mysqli_connect($host,$user,$passwd,$dbname)`\
  \ 连接到数据库。\n- `SELECT loginName FROM Member WHERE loginName='$loginName'` 查找客户输入的用户名。\n\
  - `mysqli_query($cxn,$sql)` 执行查询。\n- `mysqli_num_rows($result)` 检查是否找到了行。\n\n\n\n\
  \n请注意，第 40 行开始的块会让用户知道他们拥有正确的登录名但密码错误。如果你的数据安全非常重要，你可能想以不同的方式编写此循环。提供这些信息可能对试图破解的人有所帮助，因为现在破解者只需要找到密码。为了更高的安全性，只需设置一个条件，无论用户名还是密码不正确，都给出相同的错误信息。在这个示例中，我倾向于提供这些信息，因为它对合法成员很有帮助（他们可能不记得自己是否创建过账户），我并没有保护任何重要信息。\n\
  \n- ➝**46** 结束在数据库中找到 Member ID 时执行的块。\n- ➝**47** 开始一个 `else` 块，当数据库中`not`  Member\
  \ ID 时执行。该块创建适当的错误消息并再次显示登录页面（其中包含错误消息）。\n- ➝**53** 结束当客户提交 Member ID 和密码进行登录时执行的\
  \ `case` 块。登录块从第 11 行延伸到此行。\n- ➝**55** 开始当客户填写表单获取新成员账户时执行的 `case` 块。该表单包含一个值为“Register”的提交按钮，导致程序跳转到\
  \ switch 语句的此部分。\n- ➝**57** 开始一个 `foreach` 循环，遍历新成员表单中的每个字段。该循环检查必填字段是否为空。循环中的语句在以下列表中有更详细的说明：\n\
  - ➝**59** 检查该字段是否为传真字段。传真字段不是必填的，因此不检查它是否为空。\n- ➝**61** 检查字段是否为空。如果是，`if` 块将字段名添加到名为\
  \ `$blanks` 的数组中。如果不为空，`else` 块将清理数据并将其添加到数组 `$good_data` 中。\n- ➝**71** 开始一个 `if`\
  \ 语句，如果发现任何空字段则执行该语句。`if` 块创建一个错误消息并重新显示登录表单（包括错误消息）。表单重新显示时，字段将带有数组 `$good_data`\
  \ 中的数据。\n- ➝**84** 开始一个 `foreach` 循环，遍历新成员表单中的每个字段。该循环检查字段内容的格式是否有效。在所有必填字段都包含数据之前，程序不会到达此循环。为空的非强制字段不会被检查（第\
  \ 86 行）。\n\n此循环包含了一系列 `if` 块，用于检查字段格式是否正确。`if` 块根据正则表达式对字段内容进行测试。如果字段内容无效，则会将一个信息错误消息添加到名为\
  \ `$errors` 的数组中。\n- ➝**140** 开始一个 `foreach` 循环，清理 `$_POST` 数组中的数据并将其存储在以字段名命名的变量中。例如，`$_POST['firstName']`\
  \ 中的数据会被清理并存储在变量 `$firstName` 中。这是通过变量变量（variable variable）实现的，在第 6 章中会有解释。\n- ➝**144**\
  \ 开始一个 `if` 语句，当发现无效数据时执行该语句。也就是说，如果 `$errors` 数组包含至少一个元素，则执行执行。`if` 块创建一个错误消息并重新显示表单（包括错误消息），以便用户可以输入正确的信息。错误处理块于第\
