  \ 使用一个数据库，并且只能在这个数据库中创建表。你可以尝试请求另一个数据库，但你需要一个充分的理由。`MySQL` 和 `PHP` 并不关心你所有的表在一个数据库中而不是组织成具有意义名称的数据库。只是对人类来说，当项目被组织时更容易跟踪。\n\
