  \n# 第 12 章\n## 构建会员专属网站\n\n### 本章内容\n* 设计会员专属网站\n* 构建成员目录的数据库\n* 设计会员区域的 Web 页面\n\
  * 编写登录会员专属区域的程序\n\n许多网站都需要用户登录。有时，用户在输入密码的情况下无法查看任何 Web 页面，而有时仅网站的小部分需要登录。以下是你可能想要要求用户登录的一些原因：\n\
  \n*   **信息是机密的。** 你不希望除授权人员以外的任何人看到这些信息。或者可能只有自己的员工才能看到这些信息。\n*   **信息或服务是出售的。**\
  \ 你的网站提供的信息或服务是你的产品，你希望对他们收费。例如，你可能拥有某些研究人员愿意付费的调查数据角数据。例如，AAA 汽车俱乐部提供部分信息是免费的，但你必须成为会员才能查看其酒店评分。\n\
  *   **你可以提供更好的服务。** 如果你知道客户是谁，或者拥有他们的部分信息，你就可以让他们与你网站的交互变得更加简单。例如，如果你在 Barnes and\
  \ Noble 或 Gap 拥有账户并登录其网站，它会使用你存储的收货地址，你无需再次输入。\n*   **你可以获取更多关于客户的信息。** 营销部门想知道谁在看你的网站。一份包含地址、电话号码以及可能还有某些喜好的客户列表是很有用的。如果你的网站提供一些吸引人的功能，客户可能愿意提供一些信息以访问你的网站。\n\
  \n360 第四部分：应用程序\n\n通常，登录需要用户输入用户 ID 和密码。通常，用户可以在网站上创建自己的账户，选择自己的用户 ID 和密码。有时，用户可以在线维护他们的账户——例如，更改密码或电话号码。\n\
  \n在第 11 章中，你将了解到如何为你的宠物商店网站构建在线目录。现在，你想为你的网站添加一个会员专属区域。\n\n你计划在会员专属区域提供折扣、时通讯、宠物信息数据库以及更多内容。你希望客户会认为该区域非常有价值，以至于他们愿意地址和电话号码来获取会员账户，从而可以使用受限区域的服务。在本章中，你为宠物商店构建一个登录部分。\n\
  \n## 设计应用程序\n\n设计的第一步是决定应用程序应该做什么。它的基本功能是收集客户信息并存储在数据库中。它为客户提供了访问价值信息和服务的机会，以激励他们为数据库提供信息。因为不涉及国家机密或信用卡风险，你不需要担心极安全性。\n\
  \n应用程序应该收集客户信息并存储在数据库中。它为客户提供了访问价值信息和服务的机会，以激励他们为数据库提供信息。因为不涉及国家机密或信用卡风险，你不需要担心极安全性。\n\
  \n应用程序应该收集客户信息并存储在数据库中。它为客户提供了访问价值信息和服务的机会，以激励他们为数据库提供信息。因为不涉及国家机密或信用卡风险，你不需要担心极安全性。\n\
  \n## 构建数据库\n\n构建数据库的第一步是设计表。我们需要两个表：`Member` 和 `Login`。\n\n### Member 表\n\n`Member`\
  \ 表将存储关于网站每个成员的信息。以下 SQL 查询创建了 `Member` 表：\n\n```sql\nCREATE TABLE Member (\n  \
  \  loginName VARCHAR(20) NOT NULL,\n    createDate DATE NOT NULL,\n    password\
  \ VARCHAR(255) NOT NULL,\n    lastName VARCHAR(50),\n    firstName VARCHAR(40),\n\
  \    street VARCHAR(50),\n    city VARCHAR(50),\n    state CHAR(2),\n    zip CHAR(10),\n\
  \    email VARCHAR(50),\n    phone VARCHAR(15),\n    fax VARCHAR(15),\n    PRIMARY\
  \ KEY (loginName)\n);\n```\n\n`Login` 表将存储成员每次登录尝试的信息。以下 SQL 查询创建了 `Login` 表：\n\n\
  ```sql\nCREATE TABLE Login (\n    loginName VARCHAR(20) NOT NULL,\n    loginDate\
  \ DATETIME NOT NULL,\n    PRIMARY KEY (loginName, loginDate),\n    FOREIGN KEY (loginName)\
  \ REFERENCES Member(loginName)\n);\n```\n\n\n\n\n\n- `firstName`: 客户的姓，由客户输入。`CREATE`\
  \ 查询将该字段定义为：\n  - `VARCHAR(40)`: 这种数据类型将该字段定义为最大长度 40 个字符的变长字符字符串。该字段按实际长度存储。\n\n\
  - `street`: 客户的街道地址，由客户输入。`CREATE` 查询将该字段定义为：\n  - `VARCHAR(50)`: 这种数据类型将该字段定义为最大长度\
  \ 50 个字符的变长字符字符串。该字段按实际长度存储。\n\n- `city`: 客户地址中的城市，由客户输入。`CREATE` 查询将该字段定义为：\n \
  \ - `VARCHAR(50)`: 这种数据类型将该字段定义为最大长度 50 个字符的变长字符字符串。该字段按实际长度存储。\n\n# 第 12 章：构建会员专属网站\
  \ 363\n\n- `state`: 客户地址中的州/份。该字符串是两个字母的州代码。客户从包含所有州的下拉列表列表中选择数据。`CREATE` 查询将该字段定义为：\n\
  \  - `CHAR(2)`: 这种数据类型将该字段定义为 2 个字符的字符字符串。该字段始终占用 2 个字符的存储。\n\n- `zip`: 客户输入的邮政编码。`CREATE`\
  \ 查询将该字段定义为：\n  - `CHAR(10)`: 这种数据类型将该字段定义为 10 个字符的字符字符串。该字段始终占用 10 个字符的存储，如果实际存储字符串少于十个字符，则会填充。该字段长度足够容\
  \ `zip+4` 代码，例如 `12345–1234`。\n\n- `email`: 客户输入的电子邮件地址。`CREATE` 查询将该字段定义为：\n  -\
  \ `VARCHAR(50)`: 这种数据类型将该字段定义为最大长度 50 个字符的变长字符字符串。该字段按实际长度存储。\n\n- `phone`: 客户输入的电话号码。`CREATE`\
  \ 查询将该字段定义为：\n  - `CHAR(15)`: 这种数据类型将该字段定义为 15 个字符的字符字符串。该字段始终占用 15 个字符的存储，如果实际存储字符串少于\
  \ 15 个字符，则会填充。\n\n- `fax`: 客户输入的传真号码。`CREATE` 查询将该字段定义为：\n  - `CHAR(15)`: 这种数据类型将该字段定义为\
  \ 15 个字符的字符字符串。该字段始终占用 15 个字符的存储，如果实际存储字符串少于 15 个字符，则会填充。\n\n### 构建 Login 表\n\n\
  `Login` 表通过记录每次会员登录的日期和时间来跟踪会员登录。由于每个会员都有多次登录，登录数据需要它自己的表。构建 `Login` 表的 `CREATE`\
  \ 查询如下：\n\n```sql\nCREATE TABLE Login (\nloginName VARCHAR(20) NOT NULL,\nloginTime\
  \ DATETIME NOT NULL,\nPRIMARY KEY(loginName,loginTime) );\n```\n\n364 **第四部分：应用程序**\n\
  \n`Login` 表只有两个列，如下：\n\n- `loginName`: 客户用于登录的会员 ID。`loginName` 是 `Member` 表（我在上一节中描述了）与此表之间的连接。注意\
  \ `loginName` 列在 `Member` 表和此表中的定义是相同的。这使得表连接成为可能，并使表中的行匹配变得容易。`CREATE` 查询以以下方式定义\
  \ `loginName`：\n  - `VARCHAR(20)`: 该语句将该字段定义为最大长度 20 个字符的变长字符字符串。该字段按实际长度存储。\n \
  \ - `PRIMARY KEY(loginName,loginTime)`: 主键标识该行且必须是唯一的。对于此表，两列共同组成主键。MySQL 不允许输入两个相同\
  \ `loginName` 和 `loginDate` 的行。\n  - `NOT NULL`: 此定义意味着该字段不能空。它必须有一个值。主键必须始终为 `NOT\
  \ NULL`。\n\n- `loginTime`: 会员登录的日期和时间。该字段同时使用日期和时间，因为该字段需要是唯一的。在宠物商店网站上，不太可能有两个用户在同一秒登录。但在某些繁忙的网站上，两个用户可能会在同一秒登录。在这样的网站上，你可能需要创建一个顺序登录号作为网站的唯一主键。`CREATE`\
  \ 查询以以下方式定义 `loginTime`：\n  - `DATETIME`: 这是一个被视为日期和时间的字符串。该字符串以格式 `YYYY-MM-DD HH:MM:SS`\
  \ 显示。\n  - `PRIMARY KEY(loginName,loginTime)`: 主键标识该行且必须是唯一的。对于此表，两列共同组成主键。MySQL\
  \ 不允许输入两个相同 `loginName` 和 `loginDate` 的行。\n  - `NOT NULL`: 此定义意味着该字段不能空。它必须有一个值。主键必须始终为\
  \ `NOT NULL`。\n\n## 向数据库中添加数据\n\n此数据库旨在存储客户输入的数据——而不是你输入。在确定了应用程序要做什么以及你想从客户处获取并存储到数据库的哪些信息之后，就可以设计应用程序的视觉效果。\n\
  \n365 **第 12 章：构建会员专属网站**\n\n### 设计视觉效果\n\n在确定了应用程序要做什么以及你想从客户处获取并存储到数据库的哪些信息之后，你可以设计视觉效果。视觉效果包含了用户看到的以及用户如何与应用程序交互。你的设计应该是吸引且易于使用的。你可以在纸上创建你的设计，说明用户看到的内容，或者使用文字描述。你还应该显示用户交互组件，例如按钮或链接。将应用程序的每个页面包含在设计中。\n\
  \n宠物商店会员专属应用程序包含三个登录程序的页面。此外，应用程序还包含了会员专属部分的所有页面。在本章中，你只构建登录程序的页面。你不构建会员专属部分的页面，但我讨论了它们中需要包含哪些内容以防止非会员查看。\n\
  \n登录应用程序包含三个页面，加上组成会员专属部分的页面组，如下：\n\n- `front page`: 客户看到的第一个页面。它提供了业务名称和网站目的。在第\
  \ 11 章中，我介绍了一个首页；在本章中，你修改该页面以访问会员专属部分。\n- `login page`: 允许客户登录或创建新会员账户。它显示一个客户填写以获取新账户的表单。\n\
  - `new member page`: 通过名字欢迎新用户，告诉他们账户已创建。提供他们需要的任何信息。提供一个按钮，让用户进入会员专属部分或返回主页。\n\
  - `members section`: 包含会员专属部分内容的组 Web 页面。\n\n## 首页\n\n`首页` 是宠物商店的介绍页。由于大多数人知道什么是宠物商店，该页面不需要提供太多解释。图\
  \ 12-1 显示了首页。此页上有两个客户操作：一个客户可以点击查看宠物目录的链接，和一个指向会员专属部分的链接。\n\n![Image 50](img/index-386_1.jpg)\n\
