  \nphpMyAdmin 页面顶部的选项卡。\n\n86 **第二部分：MySQL 数据库**\n\n谨慎使用 `DROP`，因为它是不可逆的。数据库被删除后，它就会消失。其中的任何数据也会消失。\n\
  \n要在 Web 托管账户上删除数据库，你需要使用托管公司提供的特定程序。例如，在 `cPanel` 中，你使用创建数据库时的同一个页面。如前文图 4-4 所示，该页面列出了所有的所有的数据库。表格包含一个“操作”（Actions）列，每个数据库都有一个“删除数据库”（Delete\
  \ Database）链接。点击“删除数据库”链接移除该数据库。然而，请记住，删除数据库后，它就消失了。\n\n## 向数据库添加表\n\n你可以向任何数据库添加表，无论是新创建的空数据库，还是已有表和数据的现有数据库。\n\
  \n在大多数情况下，你在 `PHP` 脚本访问数据库之前就会先在数据库中创建表。因此，在大多数情况下，你使用 `phpMyAdmin` 添加表。\n\n在我在第\
  \ 3 章介绍的示例数据库设计中，`PetCatalog` 数据库设计三个表：`Pet`、`PetType` 和 `PetColor`。`MemberDirectory`\
  \ 数据库有两个表：`Member` 和 `Login`。\n\n`Pet` 表的定义如表 4-1 所示。该表列出了列名数据类型。它还指定了哪一列是表的主键。\n\
