  \n向目录中添加宠物的应用程序应该执行以下任务：\n\n1. 创建一个请求类别的表单。\n2. 如果创建了新类型，检查是否输入了名称和描述。\n3. 创建一个请求宠物信息的表单——名称、描述、价格、图片文件名和颜色。\n\
  4. 如果选择了新宠物名称，检查是否输入了名称。\n5. 将新宠物存储到数据库中。\n6. 显示显示添加内容的反馈页面。\n\n这些任务由三个程序完成：\n\n\
  - `ChooseCat.php`：创建类型表单（任务 1）。\n- `ChooseName.php`：检查类别数据并创建宠物信息表单（任务 2 和 3）。\n\
  - `AddPet.php`：检查名称字段，将新宠物存储到数据库中并提供反馈（任务 4、5 和 6）。\n\n## 编写类别\n\n第一个程序 `ChooseCat.php`\
