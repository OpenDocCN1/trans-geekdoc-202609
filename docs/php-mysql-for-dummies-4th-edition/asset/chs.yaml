  \n请注意关于格式的几点：\n\n✓ `enctype` 属性用于 `form` 标签。在上传文件时，你必须将此属性设置为 `multipart/form-data`，以确保文件正确送达。\n\
  \n✓ 包含一个隐藏字段，用于发送 `MAX_FILE_SIZE` 的值（字节字节）。如果用户尝试上传大于此值的文件，文件将无法上传。你可以将此值设置得高达 2MB。如果你需要上传大于\
  \ 2MB 的文件，则在隐藏字段中为 `MAX_FILE_SIZE` 发送大于 2MB 的值之前，必须将 `php.ini` 中 `upload_max_filesize`\
  \ 的默认设置为一个更大的数字。\n\n✓ 用于上传文件的 `input` 字段类型为 `type=file`。注意，该字段有一个 `name` —— `user_file`\
  \ —— 这与表单中其他类型的字段是一样的。\n\n用户在表单中输入的文件名会被发送到处理程序，并可以在名为 `FILES` 的内置数组可用。我将在下一节中解释\
  \ `FILES` 的结构和信息。\n\n当用户提交表单时，文件会被上传到临时位置。\n\n处理表单的脚本需要将文件复制到另一个位置，因为临时文件在脚本完成后会被删除。\n\
  \n### 处理上传的文件\n\n关于上传文件的信息存储在 PHP 内置数组 `$_FILES` 中。每个上传的文件都有一个信息数组可用，导致 `$_FILES`\
  \ 成为多维数组。与任何其他表单一样，你可以通过字段名称从数组中获取信息。以下是每个上传文件从 `$_FILES` 中获取的数组：\n\n```php\n$_FILES['fieldname']['name']\n\
  $_FILES['fieldname']['type']\n$_FILES['fieldname']['tmp_name']\n$_FILES['fieldname']['size']\n\
  ```\n\n例如，假设你使用上一节所示的字段上传文件：\n\n```html\n<input type=\"file\" name=\"user_file\"\
  \ />\n```\n\n如果用户使用该表单上传了一个名为 `test.txt` 的文件，处理程序使用的生成数组看起来如下所示：`$_FILES['user_file']['name']\
  \ = test.txt`\n\n`$_FILES['user_file']['type'] = text/plain`\n\n`$_FILES['user_file']['tmp_name']\
  \ = D:\\WINNT\\php92C.tmp`\n\n`$_FILES['user_file']['size'] = 435`\n\n在此数组中，`name`\
  \ 是上传的文件名，`type` 是文件类型，`tmp_name` 是临时文件的路径/文件名，而 `435` 是文件的大小。注意 `name` 只包含文件名，但\
  \ `tmp_name` 包含了文件的路径以及文件名。\n\n如果文件太大而无法上传，数组中的 `tmp_name` 将设置为 `none`，而 `size`\
  \ 将被设置为 `0`。处理程序必须将上传的文件从临时位置移动到永久位置。移动文件的语句的标准格式如下：\n\n`move_uploaded_file(path/tempfilename,\
  \ path/permfilename);`。`path/tempfilename` 在内置数组元素 `$_FILES['fieldname']['tmp_file']`\
  \ 中可用。`path/permfilename` 是你想存储文件的路径。以下语句移动了本节之前显示的、名称为 `user_file` 的输入字段中上传的文件：\n\
  \n```php\nmove_uploaded_file($_FILES['user_file']['tmp_name'], 'c:\\data\\new_file.txt');\n\
  ```\n\n在将文件移动到目标目录之前，该目录（在此情况下为 `c:\\data`）必须存在。此语句不会创建目标目录。\n\n允许陌生将文件加载到你的计算机是一个安全风险；有人可能会上传恶意文件。你希望在文件上传后尽可能检查文件的多个因素，使用条件语句检查文件特征，例如预期的文件类型和大小。在某些情况下，为了更高的安全性，将文件名更改为其他可能是一个好主意，这样用户就不知道他们的文件在哪里或叫什么。\n\
  \n### 汇总\n\n列表 8-19 显示了一个完整的示例脚本。该程序显示了一个供用户上传文件的表单，保存上传的文件，并在文件成功上传后显示消息。也就是说，该程序既显示表单又处理表单。该程序预期上传的文件是图像文件，并进行测试以确保它是图像文件，但可以上传任何类型的文件。格式化并显示表单的\
  \ HTML 代码位于单独的文件中——列表 8-20 所示的包含文件。\n\n图 8-15 显示了显示表单的网页。\n\n**列表 8-19：使用 POST 上传文件**\n\
  \n```php\n<?php\n/* 脚本名称: uploadFile.php\n* 描述：通过 POST 表单上传文件。 */\nif(!isset($_POST['Upload']))\
  \ {\n    include(\"form_upload.inc\");\n}\nelse {\n    if($_FILES['pix']['tmp_name']\
  \ == \"none\") {\n        // ... 逻辑处理\n    }\n    // ...\n    if(!ereg(\"image\"\
  ,$_FILES['pix']['type'])) {\n        // ... 逻辑处理\n        include(\"form_upload.inc\"\
  );\n        exit();\n    }\n    else {\n        $destination = 'c:\\data\\new_file.txt';\n\
  \        if(move_uploaded_file($_FILES['user_file']['tmp_name'], $destination))\
  \ {\n            echo \"<p style='font-weight: bold'>文件已成功上传</p>\";\n        }\n\
  \    }\n}\n?>\n```\n（由于原始源码碎片，上述代码为了可读性进行了重构。）\n\n**列表 8-20：显示表单的包含文件**\n\n```html\n\
  <!-- 程序名称: form_upload.inc\n描述：显示上传文件的表单 -->\n<html>\n<head><title>文件上传</title></head>\n\
  <body>\n<ol>\n    <li>输入你想要上传的产品图片文件名，或使用浏览按钮导航到图片文件。</li>\n    <li>当文件路径显示在文本框中时，点击上传图片按钮。</li>\n\
  </ol>\n<div align=\"center\"><hr />\n<form enctype=\"multipart/form-data\" action=\"\
  uploadFile.php\" method=\"POST\">\n    <input type=\"hidden\" name=\"MAX_FILE_SIZE\"\
  \ value=\"500000\" />\n    <input type=\"file\" name=\"pix\" size=\"60\" />\n  \
  \  <p><input type=\"submit\" name=\"Upload\" value=\"上传图片\" /></p>\n</form>\n</div>\n\
  </body>\n</html>\n```\n\n\n\n\n\n# 本章内容\n\n- 让用户从一个页面跳转到另一个页面\n- 将信息从一个页面传递到另一个页面\n\
  - 在 URL 中添加信息\n- 查看 Cookie\n- 使用隐藏表单字段\n- 探索 PHP 会话\n\n大多数网站由多个 Web 页面组成。这包括你过去可能开发的静态\
  \ Web 页面。对于静态 Web 页面，用户点击一个页面中的链接，浏览器就会出现一个新的 Web 页面。当用户这种方式在页面之间跳转时，没有任何信息从第一个页面传输到第二个页面。发送到用户浏览器的每个新页面都独立于用户之前看到的任何其他页面。\n\
  \n对于动态 Web 页面，你可能需要将信息从一个页面传递到另一个页面。如果你是一名高级 HTML 开发者，你可能拥有使用 HTML 表单、CGI（通用网关接口）或\
  \ Cookie 从一个页面到另一个页面传输信息的有限经验。\n\n然而，PHP 是在 Web 页面之间传递信息的更强大的方法。\n\n286 第三部分：PHP\n\
  \n# 让用户从一个页面跳转到另一个页面\n\n当仅使用 HTML 时，你提供链接以便访问者可以在你网站的某个页面跳转到另一个页面。使用 PHP 时，你有三种方法让用户从一个页面跳转到下一个页面：\n\
  \n- **链接：** 你可以 `echo` 显示链接的 HTML 标签。显示链接的 HTML 语句的一般格式如下：\n\n```html\n<a href=”newpage.php”>用户看到的链接文本</a>\n\
  ```\n\n当用户点击链接时，程序 `newpage.php` 会被发送到他们的浏览器。这种方法在 HTML Web 页面中被广泛使用。你可能已经熟悉如何从\
  \ HTML 创建链接，但如果你需要复习，可以在任何 HTML 书中找到更多关于链接的知识，例如 Deborah S. Ray 和 Eric J. Ray 编写的第\
  \ 2 版 *HTML 4 For Dummies Quick Reference*（Wiley 出版）。\n\n- **表单提交按钮：** 你可以使用带有一个或多个提交按钮的\
  \ HTML 表单。当用户点击提交按钮时，表单标签中的程序会运行，并将新的 Web 页面发送到用户的浏览器中。你可以创建一个没有任何字段的表单——只有一个提交按钮——但用户必须点击提交按钮才能跳转到下一个页面。我将在第\
  \ 8 章中详细讨论表单和提交按钮。\n\n- **header 函数：** 你可以使用 PHP 的 `header` 函数向 Web 服务器发送消息，告诉服务器发送新页面。使用这种方法时，你可以在用户无需点击链接或按钮的情况下，在用户的浏览器中显示新页面。\n\
  \n你可以使用 PHP `header` 函数向用户的浏览器发送新页面。该程序使用一个 header 语句并在不需要任何用户操作的情况下显示新的 Web 页面。当执行\
  \ `header` 语句时，新页面就会显示。请求新页面的 `header` 函数格式如下：\n\n```php\nheader(“Location: *URL*”);\n\
  ```\n\n位于 *URL* 的文件会被发送到用户的浏览器。以下两个语句中的任意一个都是有效的 header 语句：\n\n```php\nheader(“Location:\
  \ newpage.php”);\nheader(“Location: http://company.com/cat/catalog.php”);\n```\n\
  \n# 第 9 章：将信息从一个 Web 页面传递到下一个页面 287\n\n## URLs\n\n`URL`（统一资源定位符）是 Web 上的一个地址。每个\
  \ Web 页面都有它自己的 `URL` 或地址。Web 服务器使用 URL 来查找该 Web 页面并将其发送到浏览器。\n\n以下是组成 URL 的部分的详细说明：\n\
  \nURL 的格式为：\n\n```\nHTTP://*servername*:*portnumber*/path#*target?*string=*string*\n\
  ```\n\n- **path（路径）：** 这是指向文件的路径，遵循任何路径的规则。路径的根是主网站目录。如果路径指向的是目录而不是文件，Web 服务器将搜索默认文件名，例如\
  \ `default.html` 或 `index.html`。网站管理员设置默认文件名。\n- **HTTP://*servername***：** 这部分告诉服务器该地址是一个网站，并给出该网站所在计算机的名称。可以指定其他类型的传输，例如\
  \ `FTP`（文件传输协议），但这些与本书的主题不相关。如果省略了 URL 的这部分，Web 服务器将假设该计算机就是输入 URL 的那台计算机。该部分的有效选择可能是\
  \ `HTTP://amazon.com` 或 `HTTP://localhost`。***注意：*** `HTTP` 不一定用大写字母。\n- **portnumber（端口号）：**\
  \ Web 服务器通过计算机上的特定端口与互联网交换信息。大多数情况下，Web 服务器被设置为通过端口 80 通信。路径 `/catalog/show.php`\
  \ 表示主网站目录中有一个名为 `catalog` 的目录和一个名为 `show.php` 的文件。路径 `catalog/show.php` 表示当前目录中有一个名为\
  \ `catalog` 的目录。\n- **#target（目标）：** HTML 标签定义了一个目标。URL 的这部分会在目标所在的位置显示 Web 页面。例如，如果标签\
  \ `<a name=”target”></a` 位于文件的中间，Web 页面将显示在标签处，而不是文件顶部。\n- **?string=*string（字符串）：**\
  \ 问号允许将信息附加到 URL 的末尾。get 方法通过连接符号（`&`）分隔来传递多个 `string=value` 对：例如 `?state=CA&city=home`。\n\
  \n288 第三部分：PHP\n\n## 必须在输出之前执行语句\n\n某些 PHP 语句只能在发送任何输出之前使用。`header` 语句、`setcookie`\
  \ 语句以及在本章中描述的所有会话函数必须在任何输出之前执行。如果你在发送输出后使用这些语句之一，可能会看到以下消息：`Cannot add header information\
  \ - headers already sent`。该消息还会提供文件名并指示哪一行发送了之前的输出。或者你可能看不到任何消息；新页面可能根本不显示。（是否看到错误消息取决于\
  \ PHP 中设置的错误消息级别；详情请参见第 6 章。）以下语句将失败，因为 header 消息不是第一个输出：\n\n```html\n<body>\n<?php\n\
  header(“Location: http://company.com”);\n?>\n</body>\n```\n\n在 header 语句之前发送了一行\
  \ HTML 代码。以下语句将可以工作，尽管它们没有太大意义：\n\n```php\n<?php\nheader(“Location: http://company.com”);\n\
  ?>\n<body>\n</body>\n```\n\n以下语句将失败：\n\n```html\n<?php\nheader(“Location: http://company.com”);\n\
  ?>\n</html>\n```\n\n\n\n\n尽管有局限性，`header` 函数也是很有用的。在调用 `header` 函数之前，你可以编写任意数量的\
  \ `PHP` 语句，只要它们没有输出内容。因此，以下语句可以工作：\n\n```php\n<?php\nif($customer_age < 13)\n{\n\
  \  header(“Location: ToyCatalog.php”);\n}\nelse\n{\n  header(“Location: ElectronicsCatalog.php”);\n\
  }\n?>\n```\n\n这些语句运行的程序：如果客户年龄小于 13 岁，则运行显示玩具目录的程序；如果年龄为 13 岁或以上，则运行显示电子产品的程序。\n\
  \n# 在页面之间传递信息\n\nHTML 页面之间是相互独立的。当用户点击链接时，Web 服务器会向用户的浏览器发送新页面，但 Web 服务器对上一个页面一无所知。对于静态\
  \ HTML 页面，这个过程运行良好良好。然而，许多动态应用程序需要信息在页面之间进行传递。例如，你可能想要存储用户的姓名，并在另一个 Web 页面上通过姓名引用该用户。\n\
  \n动态 Web 应用通常由许多页面组成，并期望用户查看多个不同的页面。从用户查看第一个页面开始到用户离开网站结束的这段时期称为 `session`（会话）。通常你希望信息在整个会话期间都是可用的。以下是需要在页面之间共享信息的会话示例：\n\
  \n*   **限制对的访问：** 假设你的网站是限制的，用户需要密码登录才能访问网站。你不希望用户在每个页面都重新登录。你希望他们登录一次，然后就能看到想看的所有页面。你希望用户携带信息访问到每个页面，证明他们已经登录并具有查看该页面的权限。\n\
  *   **根据浏览器提供 Web 页面：**由于浏览器解释某些 HTML 特性的方式不同，你可能希望为不同的浏览器提供不同版本的 Web 页面。你可以在用户查看第一个页面时检查用户的浏览器，然后根据用户的浏览器类型和版本交付所有其他页面。\n\
  \n# 第三部分：PHP\n\n通过 PHP，你可以使用以下任何方法在页面之间移动信息：\n\n*   **在 URL 中添加信息：** 你可以在新页面的 URL\
  \ 末尾添加某些信息，PHP 会将这些信息放入内置数组中，你可以在新页面中使用这些数组。当你只需要传递少量信息时，这种方法最为合适。\n*   **通过 cookies\
  \ 存储信息：** 你可以在用户的计算机上存储 `cookies` ——  `variable=value` 对的小量信息。存储 cookie 后，你可以从任何\
  \ Web 页面获取它。然而，用户可以拒绝接受 cookie。因此，这种方法仅适用于你确定用户已开启 cookie 的环境。\n*   **使用 HTML 表单传递信息：**\
  \ 你可以使用 `form` 标签将信息传递给特定的程序。当用户点击提交按钮时，表单中的信息会被发送到下一个程序。当你需要从用户那里收集信息时，这种方法非常有用。\n\
  *   **使用 PHP session 函数：** 从 PHP 4 开始，PHP 提供了设置用户会话并将会话信息存储在服务器上的函数；这些信息可以从任何 Web\
  \ 页面访问。当你预计用户在一个会话中查看许多页面时，这种方法非常有用。\n\n# 在 URL 中添加信息\n\n将信息从一个页面移动到下一个页面的简单方法是将信息添加到\
  \ URL 中。按照以下格式放置信息：`variable=value`\n\n`variable` 是变量名，但不要在其中使用美元符号（`$`）。`value`\
  \ 是要存储在变量中的值。你可以在任何使用 URL 的地方添加 `variable=value` 对。你用问号（`?`）标记信息的开始。以下语句都是在 URL\
  \ 中传递信息的有效方式：\n\n```html\n<form action=”nextpage.php?state=CA” method=”POST”>\n\
  <a href=”nextpage.php?state=CA”>go to next page</a> \nheader(“Location: nextpage.php?state=CA”);\n\
  ```\n\n你可以添加多个 `variable=value` 对，使用与符号（`&`）将它们分开，如下：\n\n```html\n<form action=”next.php?state=CA&city=home”\
  \ method=”POST”>\n```\n\n以下是你可能不想在 URL 中传递传递的两个原因：\n\n*   **安全性：** URL 显示在浏览器的地址栏中，这意味着附加到\
  \ URL 上的信息也会被显示。如果信息需要安全，你不希望它被如此公开显示。例如，如果你正在将密码从一个页面传递到另一个页面，你可能不想在 URL 中传递它。此外，URL\
  \ 可能会被用户书签。可能有某些原因你不希望用户保存你添加到 URL 中的信息。\n*   **字符串长度：** URL 长度有一个限制。该限制对于不同的浏览器和浏览器版本有所不同，但始终存在限制。因此，如果你正在传递大量信息，URL\
  \ 中可能没有空间存放它们。\n\n在 URL 中添加信息对于快速、简单的数据传输很有用。例如，假设你想要提供一个用户可以更新电话号码的 Web 页面。你希望表单的行为如下：\n\
  \n1. 当用户首次显示表单时，数据库中的电话号码将显示在表单中，这样用户就可以看到当前的号码。\n2. 当用户提交表单时，程序检查电话号码是否为空或格式正确。\n\
  3. 如果电话号码正确，它将（存储在数据库中。\n4. 如果电话号码为空或数据错误，程序将重新显示表单。然而，此时你并不希望显示数据库中的数据，而是想显示用户输入并提交的错误数据。\n\
  \n`changePhone.php` 程序在列表 9-1 中显示了如何使用 URL 来判断是首次显示表单还是后续显示。它显示用户姓名的电话号码并允许用户更改。\n\
  \n## 列表 9-1：在表单中显示电话号码\n\n```php\n<?php\n/* 程序名: changePhone.php\n 描述：从数据库检索电话号码并允许用户更改电话号码。\
  \ */\n?>\n<html>\n<head><title>更改电话号码</title></head>\n<body>\n<?php\n$host=\"localhost\"\
  ;\n$user=\"admin\";\n$password=\"\";\n$database=\"MemberDirectory\";\n$loginName\
  \ = \"gsmith\"; // 从上一个页面传递\n$cxn = mysqli_connect($host,$user,$password,$database)\n\
  or die (\"无法连接服务器\");\nif($_GET['first'] == \"no\")\n{\n  $phone = trim($_POST['phone']);\n\
  \  if(!ereg(\"^([0-9][ -]){7,20}$\",$phone) or $phone=\"\")\n  {\n    echo \"<h3\
  \ style=’text-align: center’> 号码看起来无效。</<h3>>\";\n    display_form($loginName,$phone);\n\
  \  }\n  else // 号码正常\n  {\n    $query = “UPDATE Member SET phone='$phone’ WHERE\
  \ loginName='$loginName’”;\n    $result = mysqli_query($cxn,$query)\n    or die\
  \ (“执行查询失败。”);\n    echo \"<h3>电话号码已更新。</h3>\";\n    exit();\n  }\n}\nelse // 首次显示表单\n\
  {\n  $query = “SELECT phone FROM Member WHERE loginName='$loginName’”;\n  $result\
  \ = mysqli_query($cxn,$query)\n  or die (“执行查询失败。”);\n  $row = mysqli_fetch_row($result);\n\
  \  $phone = $row[0];\n  display_form($loginName,$phone);\n}\n\nfunction display_form($loginName,$phone)\n\
  {\n  echo \"<div style=’text-align: center’>\";\n  echo \"<form action=’$_SERVER['PHP_SELF']?first=no’\
  \ method=’POST’>\";\n```\n\n\n\n\n#### 请检查下面的手机号码并在必要时进行修正。\n<hr />\n\n<p><b>$loginName</b></p>\n\
  \n<input type=’text’ name=’phone’ maxlength=’20’ value=’$phone’></p>\n\n<p><input\
  \ type=’submit’ value=’Submit phone number’></p>\n\n</form>\";\n\necho “</div>”;\n\
  \n}\n\n?>\n\n</body></html>\n\n注意关于此程序的以下关键点：\n\n✓ **同一个程序负责显示和处理表单。** 该程序的名称为 `changePhone.php`。第\
  \ 51 行的表单标签包含了 `action='$_SERVER[PHP_SELF]’`，这意味着当用户点击提交按钮时，同一个程序会再次运行。\n\n✓ **信息被添加到\
  \ URL 中。** 第 51 行的表单标签包含了 `action='$_SERVER[PHP_SELF]?first=no’`。当用户点击提交按钮且 `changePhone.php`\
  \ 第二次运行时，会传递一个值为“no”的变量 `$first`。\n\n✓ **在内置 `$_GET` 数组中传递的 `first` 的值，在程序第 19 行开始处进行了检查。**\
  \ 这段代码检查了这是否是程序的第一次运行。\n\n✓ **如果 `$_GET[first]` 等于 “no”，则检查手机号码。**\n\n只有当表单被提交时，`$_GET[first]`\
  \ 才会等于 no。\n如果这是程序的第一次运行，`$_GET[first]` 则不等于 no。\n\n- 如果手机号码不正确，将打印错误消息并重新显示表单。这部分代码从第\
  \ 22 行开始。\n- 如果手机号码正确，则将其存储在数据库中，程序结束。这部分代码从第 28 行开始。\n\n✓ **如果 `$_GET[first]` 不等于\
  \ “no”，则从数据库中检索手机号码。** 换句话说，如果 `$_GET[first]` 不等于 no，说明程序是第一次运行。程序应该从数据库获取手机号码。这部分代码从第\
  \ 38 行开始。\n\n![Image 38](img/index-314_1.jpg)\n\n![Image 39](img/index-314_2.jpg)\n\
  \n294 **第三部分：PHP**\n\n✓ **程序包含一个显示表单的函数。** 该函数定义于第 48 行。每当需要显示表单时，都会调用该函数（第 26 行和\
  \ 45 行）。\n\n清单 9-1 中程序显示的表单如图 9-1 所示。这显示了网页在首次显示时的样子。浏览器地址栏中的 URL 没有任何添加的信息。\n\n\
  **图 9-1：**\n更新手机号码的 HTML 表单。\n\n图 9-2 显示了用户在图 9-1 的表单中输入无效手机号码并点击提交按钮后的结果。注意浏览器地址栏中的\
  \ URL 现在末尾添加了 `?first=no`。\n\n**图 9-2：**\n用户提交无效手机号码时的 HTML 表单。\n\n### 通过 cookies\
  \ 存储信息\n\n通过 cookies 存储信息：你可以将信息存储为 cookies。Cookies 是存储在用户计算机上的少量 `name=value` 键对。\n\
  \n### 将信息从页面传递到下一个页面\n\n295 **将信息从页面传递到下一个页面**\n\n为什么 cookies 很有用？因为它们允许将信息从一个页面传递到另一个页面。例如，你可以将用户名存储在\
  \ cookie 中，然后在另一个页面上显示它。\n\n页面之间传递信息有几种方法：\n1. **URL 参数：** 信息附加到 URL 自身上（例如 `page.php?name=John`）。\n\
  2. **Cookies：** 信息存储在用户的浏览器中。\n3. **Sessions：** 信息存储在服务器上，session ID 存储在用户的浏览器中。\n\
  \n### 使用 Cookies\n\n要设置 cookie，你可以使用 `setcookie()` 函数。\n\n```php\nsetcookie(\"variable\"\
  , \"value\", expiretime);\n```\n\n`variable` 是 cookie 的名称，`value` 是你想要存储的数据。`expiretime`\
  \ 是可选的，指定 cookie 何时过期。如果不设置，cookie 将在浏览器关闭时过期。\n\n### 获取 Cookies\n\n要从 cookie 中获取信息，你可以使用\
  \ `$_GET` 或 `$_COOKIE` 超全局变量。\n\n```php\necho $_COOKIE[\"variable\"];\n```\n\n###\
  \ 删除 Cookies\n\n要删除 cookie，你可以将它的过期时间设置为过去的某个日期。\n\n```php\nsetcookie(\"variable\"\
  , \"\", time() - 3600);\n```\n\n### 使用 Sessions\n\nSessions 是 cookies 更安全的替代方案，因为信息存储在服务器上。要启动会话，请使用\
  \ `session_start()` 函数。\n\n```php\nsession_start();\n$_SESSION[\"variable\"] = \"\
  value\";\n```\n\n通常 通常优于 cookies，因为用户浏览器无法访问这些数据。\n\n\n\n\n\n✓ `mktime`: 此函数返回一个计算机可以理解的日期和时间格式。你必须按照以下顺序提供所需的日期和时间：小时、分、秒、月、日和年。如果未包含任何值，则将使用当前值。你使用\
  \ `mktime` 函数来设置 cookie 的过期时间，如下：`setcookie(“state”,”CA”,mktime(3,0,0,4,1,2009));`\n\
  \n```\n//于 2009 年 4 月 1 日凌晨 3:00 过期。\n\nsetcookie(“state”,”CA”,mktime(12,0,0,,,));\n\
  \n//于今天中午过期\n```\n\n---\n\n# 第 9 章：将信息从一个 Web 页面移动到另一个\n\n你可以通过将 cookie 的值为空来删除\
  \ cookie。以下语句中的任意一条都可以删除 cookie：\n\n```\nsetcookie(“name”);\n\nsetcookie(“name”,””);\n\
  ```\n\n`setcookie` 函数有一个主要的局限性。`setcookie` 函数只能在发送任何其他输出*之前*使用。你*不能*在程序中间向 Web 页面\
  \ echo 了输出后再设置 cookie。请查看本章其他部分的侧边栏“必须在输出之前的语句”。\n\n## 使用 HTML 表单传递信息\n\n从一个页面向\
  \ de 一个页面传递信息的最常用方法是使用 HTML 表单。HTML 表单带有一个提交按钮。当用户点击提交按钮时，表单字段中的信息将传递给表单标签中指定的程序。通用格式如下：\n\
  \n```html\n<form action=”processform.php” method=”POST”>\n\n一个或多个字段的标签\n\n<input\
  \ type=”submit” value=”string”>\n\n</form>\n```\n\n表单最常见的用途是收集用户信息（我将在第 8 章中详细讨论这一点）。然而，表单也可以使用*隐藏字段*来传递其他类型的信息——这些字段不会显示在表单中。事实上，你可以创建一个只包含隐藏字段的表单。你始终需要一个提交按钮，在用户点击提交按钮之前，新页面不会显示，但你不需要包含任何让用户填写的字段。\n\
  \n例如，以下语句会在用户点击名为 Next Page（下一页）的按钮时，将用户的偏好背景颜色传递到下一个页面：\n\n```php\n<?php\n\n$color=”blue”;\
  \ //通过用户表单传递到此程序\n\necho “<form action=’nextpage.php’ method=”POST’>\n\n<input type=’hidden’\
  \ name=’color’ value='$color’>\n\n<input type=’submit’ value=’Next Page’>\n\n</form>\\\
  \\n”;\n\n?>\n```\n\nWeb 页面显示一个标记为 Next Page 的提交按钮，但它不会向用户询问任何信息。当用户点击按钮时，`nextpage.php`\
  \ 运行并可以使用数组元素 `$_POST[color]`，其中包含“blue”。\n\n---\n\n# 第三部分：PHP\n\n## 使用 PHP Session\n\
  \n*session*（会话）是用户在你的 Web 站点花费的时间。用户在进入你的站点和离开之间可以查看许多 Web 页面。通常，你希望信息跟随用户浏览整个站点，以便在每个页面上都可用。PHP\
  \ 从 4.0 版本开始提供了一种实现方法。\n\n### 理解 PHP session 的工作原理\n\nPHP 允许你在一个 Web 页面上建立会并将变量保存为会变量。然后你可以在任何其他页面打开会，会话变量可以在内置数组\
  \ `$_SESSION` 中供你使用。\n\n为了实现这一点，PHP 执行了以下操作：\n\n1. **分配 session ID 数字。** 该数字是一个长且无意义的数字，对于用户是唯一的，且没有人可能猜。session\
  \ ID 存储在名为 `PHPSESSID` 的 PHP 系统变量中。\n2. **将会变量存储在服务器上的文件中。** 你的 Web 托管提供了一个存储会话文件的地方；你不需要知道它在哪里。在你的本地计算机上，文件在\
  \ Unix 和 Linux 的 `\\tmp` 中以 session ID 数字命名，在 Windows 中位于 PHP 主目录下的会话数据目录。在你的本地计算机上，你可以通过更改\
  \ `php.ini` 中的 `session.save_path` 设置来更改会话文件的存储位置。将路径更改为你想要存储文件的位置。\n3. **将 session\
  \ ID 数字传递给每个页面。** 如果用户启用了 cookie，PHP 将通过 cookie 传递 session ID。如果用户禁用了 cookie，PHP\
  \ 将在链接的 URL 中或使用 post 方法的表单的隐藏变量中传递 session ID。\n4. **为每个新的会话页面从会话文件中获取变量。** 每当用户打开属于会话的一部分的新页面时，PHP\
  \ 都会使用从旧页面传递的 session ID 数字从文件中获取变量，并将它们放入内置数组 `$_SESSION` 中。你可以使用变量名作为键来使用数组元素，它们具有你在上一个页面中分配的值。\n\
  \n如果用户禁用了 cookie，除非开启了 `trans_sid`，否则 session 将无法工作。你将在稍后的“使用 PHP session 变量”部分了解如何开启和关闭\
  \ `trans_sid`。\n\n### 打开会话\n\n你应该在每个 Web 页面上打开会话。使用 `session_start` 函数打开会话，如下所示：\n\
  \n```php\nsession_start();\n```\n\n该函数首先检查是否存在的 session ID 数字。如果找到，它将设置 `$_SESSION`\
  \ 数组。如果没有找到，它将通过创建一个 session ID 数字来启动新会话。\n\n### 使用 PHP session 变量\n\n当你想要将一个变量保存为会变量时——即对用户可能访问的其他页面可用——请在\
  \ `$_SESSION` 数组中如下保存它：\n\n```php\n$_SESSION['state'] = “CA”;\n```\n\n然后你可以在任何其他页面使用\
  \ `$_SESSION['state']`，它具有值 CA。\n\n以下两个程序展示了如何使用 session 将信息从一个页面传递到另一个。第一个程序 `sessionTest1.php`\
  \ 在列表 9-2 显示了第一个页面。列表 9-3 显示了会话的第二个页面。\n\n#### 列表 9-2：启动会话\n```php\n<?php\nsession_start();\n\
  ?>\n\n<html>\n<head><title>Testing Sessions page 1</title></head>\n<body>\n<?php\n\
  $_SESSION['session_var'] = “testing”;\n\necho “这是对 session 功能的测试\n\n<form action=’sessionTest2.php’\
  \ method=’POST’>\n\n<input type=’hidden’ name=’form_var’\nvalue=’testing’>\n\n<input\
  \ type=’submit’ value=’go to next page’>\n\n</form>\\\\n”;\n?>\n</body>\n</html>\n\
  ```\n\n#### 列表 9-3：会话的第二个页面\n```php\n<?php\nsession_start();\n?>\n\n<html>\n<head><title>Testing\
  \ Sessions page 2</title></head>\n<body>\n<?php\necho “session_var = {$\\_SESSION['session_var']}<br>\\\
  \\n”;\necho “form_var = {$\\_POST['form_var']}<br>\\\\n”;\n?>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n## 2. 点击“隐私”选项卡。\n\n## 3. 将滑块移动到较高级别，显示为“阻止所有 Cookie”，然后点击“确定”。\n\
  \n要在 Firefox 中禁用 Cookie，请遵循以下步骤：\n\n1. 选择 `工具` ➪`选项`。\n2. 点击 `隐私` 选项卡。\n3. 取消勾选\
  \ `接受网站的 Cookie` 选项，然后点击“确定”。\n\n当你在浏览器中关闭 Cookie 时，如果 `sessionTest2` 的输出显示 `$session_var`\
  \ 为空值，那么 `trans-sid` 可能没有开启。你可以在你的 `php.ini` 文件中开启 `trans-sid`。找到以下行：\n\n```\nsession.use_trans_sid\
  \ = 0\n```\n\n将 `0` 改为 `1` 即可开启 `trans-sid`。如果你无法解决这个问题，仍然可以使用会话（sessions），但你必须在编程语句中传递会\
  \ ID 码；当 Cookie 被关闭时，PHP 不会自动传递会 ID 码。有关在未开启 `trans-sid` 时如何使用会话详细信息，请查看下一节。\n\n\
  对于 PHP 4.1.2 或早期版本，除非在编译 PHP 时使用 `--enable-trans-sid` 选项启用，否则 `trans-sid` 是不可用的。\n\
  \n### 不使用 Cookie 的会话\n\n许多用户在浏览器中关闭了 Cookie。PHP 会检查用户的浏览器是否允许 Cookie 并据此采取行动。如果用户的浏览器允许\
  \ Cookie，PHP 将执行以下操作：\n\n* ✓ 将变量 `$PHPSESSID` 设置为会 ID 码\n* ✓ 使用 Cookie 将 `$PHPSESSID`\
  \ 从一个页面移动到另一个页面\n\n302 第三部分：PHP\n\n如果用户的浏览器被设置为拒绝 Cookie，PHP 将执行以下操作：\n\n* ✓ ✓ 设置一个名为\
  \ `SID` 的常量：该常量包含一个变量=值的对，看起来像 `PHPSESSID=*一长串数字`。\n* ✓ 可能移动也可能不将会 ID 码从一个页面移动到另一个页面，取决于\
  \ `trans-sid` 是否开启：如果已开启，PHP 会传递会 ID 码；如果未开启，PHP 则不传递会 ID 码。\n\n开启 `trans-sid` 有有优点也有缺点。优点是即使用户关闭了\
  \ Cookie，会话也能无缝工作，而且编写会话要容易得多。缺点是会 ID 码经常在 URL 中传递。在某些情况下，会 ID 码不应显示在浏览器的地址栏中。此外，当会\
  \ ID 码在 URL 中时，用户可以将其书签。那么，如果用户使用带有会 ID 码的书签返回你的网站，来自当前访问的新会 ID 码可能会与上一次访问的旧会 ID\
  \ 码混淆，并可能导致问题。\n\n### 开启 trans-sid 的会话\n\n当 `trans-sid` 开启且用户关闭了 Cookie 时，PHP 会自动在\
  \ URL 中或作为隐藏表单字段发送会 ID 码。如果用户通过链接、头部函数或使用 `get` 方法的表单移动到下一个页面，则会 ID 码将添加到 URL 中。如果用户通过使用\
  \ `post` 方法的表单移动到下一个页面，则会 ID 码将通过隐藏字段传递。PHP 将 `$PHPSESSID` 识别为会 ID 码，并在无需你方面进行任何特殊编程的情况下处理会话。\n\
  \n会 ID 码仅添加到你自己的 Web 网站页面的 URL 中。如果下一个页面的 URL 服务器名称，PHP 假设该 URL 在其他 Web 网站，就不会添加会\
  \ ID 码。例如，这里有两个链接语句：\n\n```html\n<a href=\"newpage.php\">\n<a href=\"HTTP://www.company.com/newpage.php\"\
  >\n```\n\nPHP 将会 ID 码添加到第一个链接中，但未添加到第二个链接中。\n\n### 未开启 trans-sid 的会话\n\n当 `trans-sid`\
  \ 未开启时，当用户关闭了 Cookie 时，PHP 不会向下一个页面发送会 ID 码。相反，你必须自己发送会 ID 码。\n\n幸运的是，PHP 提供了一个常量供你自己发送会\
  \ ID 码。常量（constant）是一个包含不可更改信息的变量。（常量在第 6 章中描述）。PHP 第 9 章：将信息从一个 Web 页面移动到另一个页面\
  \ 303 常量名为 `SID`，并包含一个你可以添加到 URL 的变量=值的对，如下：\n\n```html\n<a href=\"nextpage.php?<?php\
  \ echo SID?>\"> 下一页 </a>\n```\n\n此链接语句向 URL 中添加了问号 (?) 和常量 `SID`。`SID` 包含格式化为变量=值的会\
  \ ID 码。\n\n因此，发送的 URL 是\n\n```html\n<a href =nextpage.php?PHPSESSID=877c22163d8df9deb342c7333cfe38a7>\
  \ 下一页 </a>\n```\n\n由于几个原因之一（我在在本章前面的“向 URL 添加信息”部分中讨论过），你可能不希望会 ID 码出现在浏览器显示的 URL\
  \ 中。为了防止这一点，你可以在使用 `post` 方法的表单的隐藏字段中发送会 ID 码。首先，获取会 ID 码；然后在隐藏字段中发送它。执行此操作的语句是：\n\
  \n```php\n<?php\n$PHPSESSID = session_id();\necho \"<form action='nextpage.php'\
  \ method='POST'>\n<input type='hidden' name='PHPSESSID' value='$PHPSESSID'>\n</form>\"\
  ;\n?>\n```\n\n这些语句执行：\n\n1. 获取会 ID 码到变量 `$PHPSESSID`。\n2. 在隐藏字段中发送它。\n\n### 私有化会话\n\
  \n当使用用户名和密码登录时，会话是需要登录的限制性 Web 网站的理想选择。PHP 会话可以跟踪用户是否已登录。304 第三部分：PHP\n\n* ✓ 显示登录页面。\n\
  * ✓ 当用户成功登录时，设置并存储会话变量。\n* ✓ 每当用户进入新页面时，检查会话变量查看用户是否已登录。\n* ✓ 如果用户已登录，显示页面。\n* ✓\
  \ 如果用户未登录，带到登录页面。\n\n要检查用户是否已登录，请在每个页面顶部添加以下语句：\n\n```php\n<?php\nsession_start();\n\
  if( $_SESSION['login'] != \"yes\" ) {\n    header(\"Location: login.php\");\n  \
  \  exit();\n}\n?>\n```\n\n在这些语句中，`$_SESSION['login']` 是在用户登录时设置为“yes”的会话变量。这些语句检查\
  \ `$_SESSION['login']` 是否等于“yes”。\n\n### 关闭 PHP 会话\n\n对于用户登录的限制会话，你通常希望用户在结束后注销。要关闭会话，使用以下语句：`session_destroy()`。\n\
  \n该语句删除存储在会话文件中的所有会话变量信息。PHP 不再将会 ID 码传递给下一个页面。\n\n然而，语句不会影响当前页面上设置的变量：它们仍然原来的值。如果你想从当前页面移除这些变量，同时防止它们传递到下一个页面，请使用以下语句取消它们：\n\
  \n`unset($_SESSION);`\n\n![Image 40](img/index-325_1.png)\n\n## 第四部分：应用程序\n\n在本部分中\
  \ . . .\n\n在本部分中，你将了解到如何将第一部分的规划和入门信息、第二部分的 MySQL 信息以及第三部分的 PHP 信息结合起来，并将它们整合成一个动态\
  \ Web 基础应用程序。第 11 章和第 12 章展示了两个示例应用程序，包含了完整的数据库和所有的 PHP 程序。\n\n## 第 10 章：整合一切\n\n\
  ### 本章内容\n\n* 组织整个应用程序\n* 组织各个程序\n\n\n\n\n\n# 使你的应用程序安全\n\n# 为你的应用程序编写文档\n\n前面的章节为你提供了构建\
  \ Web 数据库应用程序所需的工具。在第一部分中，你了解了 `PHP` 和 `MySQL` 的工作原理以及如何访问它们。此外，你还发现了构建应用程序需要做什么以及按什么顺序进行。在第二部分中，你了解了如何构建和使用\
  \ `MySQL`\n\n数据库。在第三部分中，你发现了 `PHP` 具有哪些功能以及如何使用它们。此外，第三部分解释了如何在 Web 页面显示信息、从用户那里收集信息以及将信息存储在数据库中。现在第四部分的的第一章，你准备好将所有部分整合成一个完整的应用程序了。为了这一点，你需要：\n\
  \n* 组织应用程序。\n* 确保应用程序的安全。\n* 为应用程序编写文档。\n\n我将详细描述每一个步骤。\n\n## 组织应用程序\n\n组织应用程序对你有利。对于\
  \ `PHP` 而言，应用程序可以是 800 万条 `PHP` 语句全部写在一个计算机文件的一行中。`PHP` 并不关心行、缩进或文件。然而，程序是由人类编写和维护应用程序的，而人类需要组织。应用程序需要两个层面的组织：\n\
  \n* **应用程序级别：** 大多数应用程序需要多个程序来提供完整的功能。你必须将应用程序的功能划分为一组组织良好的程序。\n* **程序级别：** 大多数程序执行多个一个特定任务。你必须将程序的任务划分为程序内部的不同部分。\n\
  \n### 在应用程序级别进行组织\n\n通常情况下，Web 数据库应用程序每个 Web 页面对应一个程序。例如，你可能有一个程序提供表单来收集信息，另一个程序将信息存储在数据库中并通知用户数据已存储。\n\
  \n另一个组织依据是每个主要任务一个程序。例如，你可能有一个程序用于显示表单，另一个程序将数据存储在数据库中。对于 Web 应用程序，大多数主要任务涉及发送 Web\
  \ 页面。从用户那里收集数据需要一个用于 `HTML` 表单的 Web 页面；向客户提供产品信息需要 Web 页面；当你将数据存储在数据库中时，通常希望向用户发送一个确认页面。\n\
  \n每个页面一个程序或每个主要任务一个程序并不是规则，而只是指南。关于组织的唯一规则是它必须清晰易于理解，而这是主观的。尽管如此，像宠物目录之类的应用程序的组织并不需要复杂。\n\
  \n假设宠物目录的设计要求第一页列出用户可以选择的所有宠物类型——例如猫、狗和鸟。然后，当用户选择了一个类型后，在下一个 Web 页面显示该类型目录中的所有宠物。一种合理的组织是两个程序：一个用于显示宠物类型页面，另一个用于根据所选宠物类型显示宠物。\n\
  \n以下是关于组织程序的几个额外建议：\n\n* **为应用程序中的程序选择描述性的名称。** 程序名称是使应用程序易于理解的文档的一部分。例如，宠物目录程序的可用名称可能是\
  \ `ShowPetTypes.php` 和 `ShowPets.php`。程序名以大写字母开头是习惯，但并非要求。大小写无关。\n* **将程序文件放在子目录中。**\
  \ 例如，将所有图形放在名为 `images` 的目录中。\n\n### 在程序级别进行组织\n\n组织程序级别对你有利。以下规则将产生组织良好的程序：\n\n\
  * **将语句划分为每个任务的部分。** 在每个部分的开头写一个描述该部分作用的注释。通过添加空行将各个部分隔开。例如，对于宠物目录，第一个程序可能有三个任务：\n\
  \    1. 输出引导性文本，如页面标题和说明。\n    2. 从数据库获取宠物类型列表。\n    3. 创建一个显示宠物类型选择列表的表单。\n\n\n\
  \n\n\n✓ **复用语句块。** 如果你发现自己在程序的多个地方输入了相同的十行 PHP 语句，你可以将该块语句移动到另一个文件中，并在需要时调用它。\n\n\
  在程序中，读取 `getData()` 的单行代码比获取数据的十行代码要易读得多。不仅如此，如果你需要更改这些行中的某些内容，你只需要在一个外部文件中进行修改，而不需要在程序中的十几个甚至更多不同处逐一查找并修改。你可以通过两种方式复用语句：函数和\
  \ `include` 语句。第 7 章解释了如何编写和使用函数。接下来的两个部分将解释在程序组织中如何使用函数和 `include` 语句。\n\n✓ **使用常量。**\
  \ 如果你的程序多次使用同一个值（例如你所在州的销售税），你可以在程序的开始定义一个常量，通过一个函数创建一个名为 `CA_SALES_TAX` 的常量，其值为\
  \ `.97`，并在需要时使用它。通过定义常量来给数字命名，有助于任何阅读程序的人理解该数字的含义——而且，如果你以后需要更改它，只需要在一个地方进行修改即可。第\
  \ 6 章详细描述了常量。\n\n### 使用 include 语句\n\nPHP 允许你将语句放入*外部*文件中——即一个与你的程序分离的文件——并使用 `include`\
  \ 语句在程序中的任何位置插入该文件。`include` 文件对于存储重复的语句块非常有用。你可以在需要使用这些语句的地方添加 `include` 语句，而不是在多个位置添加整个语句块。这让你的程序变得更短、更易读。`include`\
  \ 语句的格式为：\n\n```php\ninclude(\"*filename*\");\n```\n\n文件名可以是任何名称。我喜欢使用 `.inc` 扩展名，这样我就可以从名称看出它们是\
  \ include 文件而不是脚本。文件中的语句会在使用 `include` 语句的地方被原样包含。\n\n语句是以 HTML 格式包含的，而不是 PHP 格式。因此，如果你想在\
  \ include 文件中使用 PHP 语句，必须在 include 文件中包含 PHP 标签。否则，include 文件中的所有语句都将被视为 HTML 并原样输出到网页上。\n\
  \n以下是使用 include 文件组织程序的几种方法：\n\n✓ **将所有或大部分 HTML 放入 include 文件中。** 例如，如果你的程序向浏览器发送表单，请将表单的\
  \ HTML 放入一个外部文件中。当你需要发送表单时，使用 `include` 语句。如果表单显示多次，将 HTML 放入 include 文件是一个好主意。即使表单只显示一次，这也是个好主意，因为它会让你的程序变得更容易读。第\
  \ 11 章和第 12 章中的程序将表单的 HTML 代码放在单独的文件中并在显示表单时包含这些文件。\n\n✓ **将访问数据库所需的信息存储在程序分离的文件中。**\
  \ 如下所示在文件中存储变量名：\n\n```php\n<?php\n$host=\"localhost\";\n$user=\"phpuser\";\n$password=\"\
  secret\";\n?>\n```\n\n注意，此文件需要 php 标签，因为 `include` 语句会将文件作为 HTML 插入。在每个需要连接数据库的程序顶部包含此文件。如果任何信息（如密码）发生变化，你只需要在一个地方更改。\n\
  \n✓ **将函数放在 include 文件中。** 如果你想在 include 文件中使用 PHP 语句，必须在 include 文件中包含 PHP 标签。否则，include\
  \ 文件中的所有语句都将被视为 HTML 并原样输出到网页上。\n\n✓ **将所有或大部分 HTML 放入 include 文件中。** 例如，如果你的程序向浏览器发送表单，请将表单的\
  \ HTML 放入一个外部文件中。当你需要发送表单时，使用 `include` 语句。如果表单显示多次，将 HTML 放入 include 文件是一个好主意。即使表单只显示一次，这也是个好主意，因为它会让你的程序变得更容易读。\n\
  \n✓ **将访问数据库所需的信息存储在程序分离的文件中。** 如下所示在文件中存储变量名：\n\n```php\n<?php\n$host=\"localhost\"\
  ;\n$user=\"phpuser\";\n$password=\"secret\";\n?>\n```\n\n注意，此文件需要 php 标签，因为 `include`\
  \ 语句会将文件作为 HTML 插入。在每个需要连接数据库的程序顶部包含此文件。如果任何信息（如密码）发生变化，你只需要在一个地方更改。\n\n✓ **将函数放在\
  \ include 文件中。** 如果你想在 include 文件中使用 PHP 语句，必须在 include 文件中包含 PHP 标签。否则，include\
  \ 文件中的所有语句都将被视为 HTML 并原样输出到网页上。\n\n### 第四部分：应用程序\n\n✓ **将访问数据库所需的信息存储在程序分离的文件中。**\
  \ 如下所示在文件中存储变量名：\n\n```php\n<?php\n$host=\"localhost\";\n$user=\"phpuser\";\n$password=\"\
  secret\";\n?>\n```\n\n注意，此文件需要 php 标签，因为 `include` 语句会将文件作为 HTML 插入。在每个需要连接数据库的程序顶部包含此文件。如果任何信息（如密码）发生变化，你只需要在一个地方更改。\n\
  \n✓ **将函数放在 include 文件中。** 如果你想在 include 文件中使用 PHP 语句，必须在 include 文件中包含 PHP 标签。否则，include\
  \ 文件中的所有语句都将被视为 HTML 并原样输出到网页上。\n\n###  include 文件\n\n你可以将 include 文件存储在存储脚本的相同目录中。如果\
  \ include 文件位于相同目录，`include` 语句就能找到。你也可以将 include 文件存储在单独的目录，例如主目录下的子目录，并命名为 `includes`。如果你这样做，你需要在\
  \ `include` 语句中使用完整路径，例如：\n\n```php\ninclude(\"includes/file1.inc\");\n```\n\n注意路径使用的是正斜杠。在\
  \ Windows 上使用反斜杠 `\\` 会导致错误信息。PHP 明白正斜杠的意思。\n\n你可以通过设置一个 include 目录来避免使用路径，PHP 会在该目录下查找\
  \ include 语句指定的任何文件。你通过 `include_path` 配置设置来设置 include 目录。见附录 B 关于 PHP 配置设置以及如何更改它们的讨论。\n\
  \n你可以在 `php.ini` 文件中设置 include 路径。在你的本地计算机或允许拥有本地 `php.ini` 文件的 Web 托管账户上，在 `php.ini`\
  \ 文件中设置 `include_path`。`include_path` 设置具有以下通用格式：\n\n```ini\ninclude_path = \"*paths*\"\
  \n```\n\n例如，常见的 include 路径为：\n\n```ini\ninclude_path = \".:/php/includes\"\n```\n\
  \n这一行设置了 PHP 查找 文件的两个目录。第一个目录是 `.`，表示当前目录，然后是第二个目录路径，即当前目录下名为 `includes` 的目录。\n\n\
  \n\n\n\n你也可以在 `.htaccess` 文件中设置包含路径，使用以下指令：\n\n```php\nphp_value include_path “.:./includes”\n\
  ```\n\n如果你在使用上述技术时遇到困难，可以在 PHP 脚本中使用 `ini_set` 语句来设置包含路径，例如下：\n\n# 第四部分：应用\n\n```php\n\
  ini_set(“include_path”,”./includes”);\n```\n\n`ini_set` 语句仅对包含该 `ini_set` 语句的脚本设置包含路径。你需要确保你网站中每个使用\
  \ `include` 语句的脚本也包含一个设置包含路径的 `ini_set` 语句。\n\n在大多数情况下，你可能希望将包含文件存储在一个单独的目录中，并将包含路径设置为该目录。这允许你在\
  \ `include` 语句中仅使用文件名，而不是整个路径。在 `include` 语句中仅使用文件名使代码更具灵活性且易于维护。如果你将包含文件移动到不同的目录，或者将脚本移动到另一台计算机上，你只需要更改包含路径的设置，程序就能找到它。如果你没有包含路径，而是使用完整路径，那么包含文件位置的任何更改都要求你找到脚本中的每个\
  \ `include` 语句并将路径更改为新路径。\n\n#### 保护包含文件\n\n当你将包含文件存储在网站的主目录下时，如果访问者知道文件名，他们就可以访问这些文件。例如，访问者可能会使用\
  \ URL `www.yoursite.com/file1.inc` 访问你的网站。如果她这样做了，就能看到你包含文件中的内容。如果这只是你网页的 HTML 代码，那没关系；但如果她查看的包含文件是\
  \ `secret passwords.inc`（其中包含了访问你数据库的信息），那么就不太妙了。\n\n保护包含文件的最佳方法是将其存储在一个受保护的目录中，让访问者无法访问该目录。上一节描述了如何设置一个包含包含文件的目录以及设置指向包含文件目录的路径。为了保护包含文件，你需要保护包含文件目录，以便你的网站访问者无法访问它。\n\
  \n你可以通过在想要保护的目录（例如 `includes/.htaccess`）中添加 `.htaccess` 文件，来防止 Web 托管主机上的访问者访问该目录。你可能在网站主目录中已经有一个名为\
  \ `.htaccess` 的文件。这个新的 `.htaccess` 文件是一个独立的文件，仅存放在受保护的子目录。在你的 `.htaccess` 文件中添加以下行：\n\
  \n```text\nDeny from all.\n```\n\n`Deny` 指令阻止任何用户访问该子目录下的任何文件。只有你自己的脚本可以访问包含文件。\n\
  \n如果你在公司计算机上发布网站，请你的 IT 人人员为你提供一个 Web 空间之外的目录用于存放包含文件。该目录不应该在你的网站主目录中，而是在计算机的其他地方，让网站访问者无法访问它。\n\
  \n#### 使用函数\n\n频繁使用函数来组织你的程序。（在第 7 章中，我将讨论函数的创建和使用。）当你的程序需要在程序的不同位置或应用程序中的不同程序中执行相同任务时，函数是非常用的。当你写完执行某个任务的函数后，可以在程序的许多地方调用它。这使得你的代码更容易阅读和维护。如果你需要更改任务的执行方式，只需要在一个地方更改该函数即可。\n\
  \n```php\ngetData()\n```\n\n```php\ngetState()\n```\n\n```php\ngetAllNames()\n```\n\
  \n```php\ngetData()\n```\n\n```php\ngetState()\n```\n\n```php\ngetData()\n```\n\n\
  ```php\ngetState()\n```\n\n# 第四部分：应用\n\n#### 保持私密\n\n你需要保护你的数据库。如果访问者可以访问你的数据库，他们就可以窃取你的信息或删除你的数据。保护数据库的最佳方法将其放在\
  \ Web 根目录之外。如果你必须将其放在 Web 根目录，你应该通过文件权限来保护它。\n\n- **窃取包含文件**：这是一个风险。\n- **窃取你的信息**：这非常严重。\n\
  - **破坏你的网站**：这非常严重。\n- **伤害你的用户**：这非常严重。\n\n- **确保计算机安全**：这很重要。\n- **不要让 Web 服务器显示文件名**：这是一个风险。\n\
  - **隐藏内容**：这很重要。\n- **不要信任来自用户提供的信息**：这很重要。\n- **使用安全的 Web 服务器**：这很重要。\n\n#### 确保计算机安全\n\
  \n首先，计算机本身必须是安全的。计算机的系统管理员负责防止未经授权的访问者和破坏者进入系统。安全措施包括防火墙、加密、密码影子和扫描检测器。在大多数情况下，系统管理员不是你。如果是你的话，你需要对安全进行一些调查。如果你使用\
  \ Web 托管公司，你可能想与那些人员讨论安全问题以让自己放心。\n\n你可能已经注意到，有时你在浏览器中访问一个 URL 时会得到一个文件名列表。如果你访问一个目录（而不是特定文件），且该目录不包含默认文件名（如\
  \ `index.html`）的文件，Web 服务器可能会显示一个文件列表供你选择。你可能不希望你的 Web 服务器这样做；如果访问者可以查看你网站上的任何文件，你的网站将非常不安全。在其他网站上，你可能看到过如下错误信息：\n\
  \n**Forbidden**（禁止）\n\n你没有权限访问此服务器上的 /secretdory。\n\n在那些网站上，Web 服务器被设置为：当 URL 指向目录时不会显示文件名列表。相反，它会交付此错误消息。这比列出文件名更安全。如果文件名是从你的网站发送的，则需要更改\
  \ Web 服务器的设置。\n\n\n\n\n\n# .htaccess 文件\n\n`.htaccess` 文件。这应该位于你网站主目录下的 `.htaccess`\
  \ 文件中。添加以下行：\n\n```Options -Indexes\n```\n\n网站中 `.htaccess` 文件中的此行可以防止用户查看文件名。\n\
  \n如果你没有访问 `.htaccess` 文件的权限，请请求网站管理员更改此设置。\n\n# 隐藏内容\n\n尽可能保持信息的私密。当然，你希望访问者看到的网页必须存储在你的公共\
  \ Web 空间目录中。但并非所有内容都需要存储在那里。例如，你可以将包含文件存储在另一个位置——存储在无法从 Web 访问的计算机空间。你的数据库显然没有存储在\
  \ Web 空间中，但如果将其存储在不同的计算机上，可能会更加安全。\n\n隐藏内容的另一种方法是给它们起一个误导性的名称。例如，包含数据库变量的包含文件不应该名为\
  \ `passwords.inc`。更好的名字可能是 `UncleHenrysChickenSoupRecipe.inc`。我知道这个建议违背了书中其他推崇使用信息化文件名的章节，但这是一个特殊情况。恶意人员有时会做一些显而易见的事，比如在浏览器中输入\
  \ `www.yoursite.com/passwords.html` 看看发生什么。\n\n318 第四部分：应用程序**\n\n# 不要信任来自用户的信息\n\
  \n恶意用户可以使用你 Web 页面上的表单向你的网站发送危险文本。因此，在没有对表单信息进行检查、清理和转义之前，永远不要直接将其存储到数据库中。检查收到的信息是否符合合理格式以及是否有危险字符。特别是，你不希望从表单中接受\
  \ HTML 标签，例如 `<script>` 标签。通过使用脚本标签，用户可以输入实际脚本——可能是恶意脚本。如果你在不检查的情况下接受表单字段并将其存储在数据库中，可能会引发问题，特别是如果存储的脚本通过\
  \ Web 页面发送给网站的访问者。关于检查、清理和转义表单数据的更多信息，请参见第 8 章。\n\n# 使用安全的 Web 服务器\n\n你的网站与其访问者之间的通信并非完全安全。\n\
  \n当你网站上的文件被发送到用户的浏览器时，互联网上你和用户之间的某人可以在这些文件经过他们时读取其内容。对于大多数网站来说，这不是问题；但是，如果你的网站收集或发送信用卡号或其他秘密信息，请使用安全的\
  \ Web 服务器来保护这些数据。\n\n安全的 Web 服务器使用安全套接层（`SSL`）来保护发送和接收来自浏览器的通信。这类似于你在间谍电影中听到的加密电话。信息在通过\
  \ Web 传输之前会被`加密`（转换为编码字符串）。接收软件会将其解密为原始内容。此外，你的网站使用一个验证你身份的证书。使用安全的 Web 服务器需要额外的工作，但对于某些应用程序来说是必要的。\n\
  \n你可以判断自己何时正在使用 `SSL` 进行通信。URL 以 `HTTPS` 而不是 `HTTP` 开始。\n\n许多 Web 主机为网站账户提供 `SSL`\
  \ 通信。咨询你的 Web 主机获取有关使用 `SSL` 的信息。\n\n## 完成你的文档\n\n这是我的最后一个建议。为你的 Web 数据库应用程序编写文档至关重要。你从一个描述应用程序应该做什么的计划开始。根据你的计划，创建一个数据库设计。保持计划和设计的更新。通常，随着项目的进行，会发生变化。确保你的文档也随新决策而发生更改。\n\
  \n**第 10 章：整合一切** 319\n\n在你设计程序时，将应用程序计划中的任务与你计划编写的程序相关起来。列出程序以及每个程序的功能。如果程序很复杂，你可能想要包含关于程序如何执行任务的简短描述。如果是团队协作，请列出谁负责每个程序。当你完成应用程序时，你应该拥有以下文档：\n\
  \n* **应用程序计划**：描述应用程序应该做什么，列出它将执行的任务\n* **数据库设计**：描述数据库中的表和字段\n* **程序设计**：描述程序如何执行应用程序计划中的任务\n\
