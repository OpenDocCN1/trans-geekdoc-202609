  \ 8-11（继续）\n\n```php\nextract($row);\necho “<input type=’checkbox’\nname=’interest[$petType]’\n\
  value='$petType’ />$petType<br />\\\\n”;\n}\necho “<p><input type=’submit’\nvalue=’Select\
