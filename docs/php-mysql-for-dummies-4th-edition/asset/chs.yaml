  \n![Image 36](img/index-283_1.jpg)\n\n# 第 8 章：数据输入，输出（第 263 页）\n\n此程序与列表 8-12 中的程序之间的区别在于：\n\
  \n- **此程序为问题数据创建了数组。** 它像之前的程序一样创建了 `$blank_array`。但此程序还为包含不可接受格式信息的字段创建了 `$bad_format`。\n\
  - **此程序遍历 `$bad_format` 以创建一个单独的问题数据列表。** 如果任何字段为空，它会像之前的程序一样创建一条错误消息和一个问题字段列表。如果任何字段\
  \ get 处于不可接受的格式，此程序还会创建第二个错误消息和一个问题字段列表。\n\n图 8-14 中的 Web 页面是当用户不小心将名（First Name）输入到中间名（Middle\
  \ Name）字段，并且为电话号码输入了乱码时生成的。注意出现了两个错误消息，显示名字段为空，且电话（Phone）字段包含错误信息。\n\n**图 8-14：**\
  \ 处理包含缺失和错误信息的表单的结果。\n\n## 使用多个提交按钮为用户选择\n\n你可以在表单中使用多个提交按钮。例如，在客户订单表单，你可能会使用一个显示*提交订单（Submit\
  \ Order）*的按钮和另一个显示*取消订单（Cancel Order）*的按钮。然而，你可以在表单标签的 `action=programname` 部分只列出一个程序，这意味着这两个按钮运行同一个程序。PHP\
  \ 解决了这个问题。通过使用 PHP，你可以根据用户点击哪个按钮来不同地处理表单。列表 8-14 中的程序显示了一个带有两个按钮的表单。\n\n### 列表 8-14：显示带有两个提交按钮的表单（第\
  \ 264 页）\n\n```php\n<?php\n\n/* Program name: displayTwoButtons.php\n* Description:\
  \ 程序显示一个带有两个\n* 按钮的表单。\n*/\n?>\n<html>\n\n<head><title>Two Buttons</title></head>\n\
  <body>\n\n<?php\n\necho \"<form action='processTwoButtons.php' method='POST'> Last\
  \ Name: <input type='text' name='last_name'\nmaxlength='50' /><br />\n\n<input type='submit'\
  \ name='display_button'\nvalue='Show Address' />\n<input type='submit' name='display_button'\n\
  value='Show Phone Number' />\n</form>\";\n\n?>\n</body></html>\n```\n\n注意，提交按钮字段都有一个名称：`display_button`。每个字段都有不同的值。无论用户点击哪个按钮，都会设置变量\
  \ `$display_button` 的值。列表 8-15 中的程序 `processTwoButtons.php` 处理上述的表单。\n\n### 列表 8-15：处理两个提交按钮\n\
  \n```php\n<?php\n\n/* Program name: processTwoButtons.php\n* Description: 程序根据点击了哪个\n\
  * 提交按钮显示不同的信息。\n*/\n?>\n<html\n\n<head><title>Member Address or Phone Number</title></head>\n\
  <body>\n\n<?php\n\n$user=\"admin\";\n$host=\"localhost\";\n$password=\"\";\n$database\
  \ = \"MemberDirectory\";\n$cxn = mysqli_connect($host,$user,$password,$database)\n\
  or die (\"Couldn’t connect to server\");\n\nif($_POST['display_button'] == \"Show\
  \ Address\")\n{\n\n$query = \"SELECT street,city,state,zip FROM Member\nWHERE lastName='$_POST[last_name]\
  \ '\";\n$result = mysqli_query($cxn,$query)\nor die (\"Couldn’t execute query.\"\
  );\n$row = mysqli_fetch_assoc($result);\nextract($row);\necho \"$street<br />$city,\
  \ $state $zip<br />\";\n}\nelse\n{\n$query = \"SELECT phone FROM Member\nWHERE lastName='$_POST[last_name]'\"\
  ;\n$result = mysqli_query($cxn,$query)\nor die (\"Couldn’t execute query.\");\n\
  $row = mysqli_fetch_assoc($result);\necho \"Phone: {$row['phone']}\";\n}\n\n?>\n\
  </body></html>\n```\n\n程序根据点击了哪个按钮执行不同的语句。如果用户点击地址按钮，程序将输出表单中提交的姓对应的地址；如果用户点击显示电话号码（Show\
  \ Phone Number）按钮，程序将输出电话号码。\n\n## 将信息存入数据库\n\n你的应用程序可能需要在数据库中存储数据。例如，你的数据库可能存储用户输入到表单中供你使用的信息——成员目录（Member\
  \ Directory）就是一个例子。或者你的数据库可能在应用程序运行期间临时存储数据。无论如何，你都会在数据库中存储数据。\n\n### 准备数据（第 265\
  \ 页）\n\n在将数据存储到数据库之前，你需要对其准备。准备数据包括：\n- 将数据放入变量\n- 确保数据格式正确\n- 清理数据\n- 转义数据\n\n\
  ### 使用数据（第 266 页）\n\n你通过将数据发送到数据库来存储。在设计数据库时，你为每一列设置数据类型。要存储的数据必须与列的数据类型匹配。以下是 MySQL\
  \ 存储常用类型数据的方式概述：\n\n- `CHAR` 或 `VARCHAR`：存储字符串。MySQL 将发送到字符列的任何数据（包括数字和日期）都存储为字符串。你在创建列时指定了长度。例如，如果你指定了\
  \ `CHAR(20)`，只能存储 20 个字符。\n- `INT` 或 `DECIMAL`：存储数字。MySQL 尝试将发送到数字列的任何数据解释为数字。\n\
  - `DATE`：存储日期。MySQL 期望日期为数字，年在前，月在后，日最最后。\n- `ENUM`：仅存储你在创建列时允许的值。\n\n\n\n\n\n在许多情况下，数据是以原始形式收集的并原样存储在数据库中的。例如，用户在表单中输入他们的姓名，程序对其进行存储。然而，在某些情况下，在存储数据之前需要对数据进行更改。例如，如果用户在表单的三个单独的选择列表（月、日、年）中输入日期（正如我在本章前面的“构建选择列表”节中所描述的那样），必须将这三个字段中的值合并到一个变量中。以下语句将这些字段合并在一起：\n\
  \n```php\n$expDate = $_POST['expYear'].\"-\";\n$expDate .= $_POST['expMonth'].\"\
  -\";\n$expDate .= $_POST['expDay'];\n```\n\n另一种你可能想在存储之前更改数据的情况是存储电话号码。用户以各种格式输入电话号码，使用括号、连字符、点或空格。与其在数据库中存储这些各异的格式，你可能只需要存储数字。\n\
  \n然后当你从数据库中检索电话号码时，你可以在显示之前按照你想要的方式对号码进行格式化。以下语句从字符串中删除字符：\n\n```php\n$phone = preg_replace(\"\
  /[ )(.-\\]/\", \"\",$_POST['phone']);\n```\n\n函数 `preg_replace` 使用正则表达式来搜索模式。\n\n\
  传递的第一个字符串是用于匹配的正则表达式。如果字符串的任何部分匹配该模式，它将被第二个字符串替换。在这种情况下，正则表达式是 `[ )(.-\\]`，意味着匹配方括号内的任意一个字符。第二个字符串是\
  \ `\"\"`，这是一个空字符串。\n\n因此，字符串中的任何空格、括号、点或连字符（即你在检查数据时可能认为是有效并允许允许的字符）都会被替换为空。\n\n\
  ## 清理数据\n\n早前的“从用户处获取信息”节描述了 HTML 表单的使用，该节讨论了表单中数据的检查。用户可能会无意中或恶意地向文本框中输入数据，这可能会给你的应用程序、数据库或用户带来问题。检查数据并只接受请求信息时预期的字符可以防止许多问题。然而，你可能会漏掉某些内容。此外，在某些情况下，用户输入的信息需要允许几乎任何内容。例如，你通常不会在字段中允许\
  \ `<` 和 `>` 字符。但可能会出现用户需要这些字符的情况——也许用户需要输入包含这些字符的技术公式或规范。\n\n# 第三部分：PHP\n\nPHP 有两个函数可以清理数据，从而使其无害：\n\
  \n*   `strip_tags`: 此函数从数据中移除所有被 `<` 和 `>` 包围的文本。该函数寻找起始 `<` 并移除它及其之后的所有内容，直到找到闭合的\
  \ `>` 或到达字符串末尾。你可以包含想要允许的特定标签。例如，以下语句会移除字符字符串除 `<b>` 和 `<i>` 之外的所有标签：\n\n```php\n\
  $last_name = strip_tags($last_name,\"<b><b><i>”\");\n```\n\n*   `htmlspecialchars`:\
  \ 此函数将对 HTML 有意义的特殊字符转换为 HTML 格式，允许它们在不产生任何特殊含义的情况下显示。更改如下：\n    * `<` 变为 `&lt;`\n\
  \    * `>` 变为 `&gt;`\n    * `&` 变为 `&amp;`\n\n通过这种方式，字符 `<` 和 `>` 可以在 Web 页面上显示，而不会被\
  \ HTML 解释为标签。以下语句更改这些特殊字符：\n\n```php\n$last_name = htmlspecialchars($last_name);\n\
  ```\n\n如果你确定不想允许用户在表单字段中输入任何 `<` 或 `>` 字符，请使用 `strip_tags`。但如果你想允许 `<` 或 `>` 字符，可以在它们经过\
  \ `htmlspecialchars` 处理后安全地存储。\n\n在将数据存储到数据库之前，你应该使用的另一个函数是 `trim`。用户经常会无意中在文本字段的开头或结尾输入空格。`trim`\
  \ 会移除任何领先或结尾的空格，以免它们被存储。使用以下语句移除这些空格：\n\n```php\n$last_name = trim($_POST['last_name']);\n\
  ```\n\n## 转义数据\n\n用户可以向你的表单输入信息，这些信息在用于查询时会改变你的查询，使其运行方式与你预期的不同。其中一些破坏性查询是通过操纵查询中的引号创建的。你可以通过转义表单字段中发送任何引号来防止这种被称为\
  \ `SQL 注入` 的攻击。转义（`Escaping`）特殊字符（如引号）意味着在字符前面放置一个反斜杠（`\\\\`）。随后该特殊字符将被视为任何其他字符，而不是具有特殊含义的特殊字符，从而使查询安全。我将在第\
  \ 6 章中讨论字符转义。\n\n### 第 8 章：输入与输出\n\nPHP 6 之前的 PHP 版本提供了一种名为“魔法引号”（magic quotes）的功能，它可以自动转义\
  \ `$_POST` 和 `$_GET` 数组中的所有字符串。单引号、双引号、反斜杠和空字符都会被转义。这一功能旨在帮助初学者，它由 `php.ini` 中的\
  \ `magic_quotes-gpc` 设置控制，并在 PHP 4 和 PHP 5 中默认开启。在 PHP 6 中，魔法引号功能不再可用。\n\n魔法引号功能非常方便，可以保护初学者免受他们可能未察觉的\
  \ SQL 注入攻击。然而，所有的 `$_POST` 和 `$_GET` 数据都被转义了，即使它们并不打算存储。\n\n\n\n\n\n如果你计划在其他计算机上运行你的脚本，那么假设魔术引号（magic\
  \ quotes）开启或关闭可能是不安全的。为了编写可移植的代码，你需要在脚本中测试魔术引号是否开启，然后使用符合该状态的代码。如果魔术引号关闭，你可以使用 PHP\
  \ 的转义函数，或者直接像魔术引号开启时那样存储数据。你可以在条件语句中使用 `get_magic_quotes_gpc()` 函数来测试魔术引号是否开启。该函数在魔术引号关闭时返回\
  \ 0，在开启时返回 1。\n\n## 添加新信息\n\n你使用 `INSERT` 查询（在第 4 章中描述）向数据库中添加新信息。`INSERT` 向数据库表中添加新新的一行。其通用格式为：\n\
  \n```php\n$query = “INSERT INTO *tablename* ( *col*, *col*, *col*...) VALUES ( *‘var*'],’\
  \ *var*’,’ *var*’...)”;\n\n$result = mysqli_query($cxn,$query)\nor die (“Couldn’t\
  \ execute query.”);\n```\n\n例如，存储用户在表单中输入的姓名和电话号码的语句如下：\n\n```php\n$query = “INSERT\
  \ INTO Member (lastName,firstName,phone)\nVALUES (`$_POST[lastName]`,’$_POST[firstName]’,\n\
  ‘$_POST[phone]’”,\n\n$result = mysqli_query($query)\nor die (“Couldn’t execute query.”);\n\
  ```\n\n你永远不要直接从 `$_POST` 数组中的表单字段插入数据。务必先检查其格式并进行清理，正如本章前面讨论过的。\n\n列表 8-16 显示了一个显示表单的程序，列表\
  \ 8-17 列出了一个名为 `savePhone.php` 的程序，它处理列表 8-16 中的表单，并将表单中的姓名和电话号码存储在数据库中。\n\n**列表\
  \ 8-16：显示表单**\n\n```php\n<?php\n/* 程序名：displayPhone\n* 说明：脚本显示一个表单，询问\n* 客户电话号码。\n\
  */\n\n$labels = array ( “first_name” => “First Name”,\n“last_name” => “Last Name”,\n\
  “phone” => “Phone”);\n?>\n<html>\n<head>\n<title>Customer Phone Number</title>\n\
