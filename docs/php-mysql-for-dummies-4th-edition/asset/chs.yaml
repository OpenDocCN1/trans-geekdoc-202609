  \ 查询以以下方式定义 `pix`：\n- `CHAR(15)`: 此数据类型将字段定义为长度为 15 个字符的字符字符串。\n- `NOT NULL`: 此定义意味着该字段不能为空。它必须有一个值。你需要为宠物提供一张图片。当网站尝试显示找不到的图片时，它会在本应显示图形的浏览器窗口中显示一个难看的错误信息。你不希望你的目录出现这种情况，因此你的数据库应该要求有一个值。在这种情况下，`CREATE`\
  \ 查询定义了一个默认值，以便在该字段中始终有一个值。\n- `DEFAULT \"na.gif\"`: 如果你没有为 `pix` 提供值，则存储值 `\"na.gif\"\
  `。这样，`pix` 始终存储有一个值。文件 `na.gif` 可能包含显示类似“图片不可用”的图形。\n\n# 第四部分：应用程序\n\n## 向数据库添加数据\n\
  \n你可以通过多种方式向数据库添加数据。你可以使用 SQL 查询向数据库添加宠物，或者使用我在本章中描述的应用程序。我在开发期间最喜欢的方法是从文件中读取数据向目录添加一些示例项目。然后，每当我的数据在开发过程中变得完全疯狂（由于编程错误或我古怪的幽默感导致），我可以在瞬间重新创建数据。只需\
  \ `DROP` 表，使用 `SQL` 查询重新创建它，然后重新读取示例数据即可。\n\n例如，`Pet` 表的数据文件可能如下：\n\n```\nPekinese\t\
  Dog\tSmall, cute, energetic. Good alarm system.\t100.00\tpeke.jpg\nHouse cat\tCat\t\
  Yellow and white cat. Extremely playful.\t20.00\tcatyellow.jpg\nHouse cat\tCat\t\
  Black cat. Sleek, shiny. Likes children.\t20.00\tcatblack.jpg\nChinese Bearded Dragon\t\
  Lizard\tGrows up to 2 feet long. Fascinating to watch. Likes to be held.\t100.00\t\
  lizard.jpg\nLabrador Retriever\tDog\tBlack dog. Large, intelligent retriever. Often\
  \ selected as guide dogs for the blind.\t100.00\tlab.jpg\nGoldfish\tFish\tVariety\
  \ of colors. Inexpensive. Easy care. Good first pet for small children.\t2.00\t\
  goldfish.jpg\nShark\tFish\tSleek. Powerful. Handle with care.\t20.00\tshark.jpg\n\
  Asian Dragon\tDragon\tLong and serpentine. Often gold or red.\t10000.00\tdragona.jpg\n\
  Unicorn\tHorse\tBeautiful steed with horn on forehead.\t20000.00\tunicorn.jpg\n\
  ```\n\n这些是数据文件的规则：\n- `<TAB>` 代表实际制表符——即通过按下 `Tab` 键创建的那种类型。\n- 每行代表一只宠物，且在输入时不能按下\
  \ `Enter` 或 `Return` 键。上述示例中的行被换行到了多行，以便你可以看到整行。然而，在实际文件中，数据行每行一个。\n- 每行的开头有一个制表符，是因为第一个字段没有输入。第一个字段是\
  \ `petID`，它是自动输入的；你不需要输入它。但是你确实需要制表符，以便 `MySQL` 知道开头有一个空字段。\n\n你可以在 `phpMyAdmin`\
  \ 中将数据从文件读取到数据库。从文件中读取数据将在第 4 章描述。每当数据表变得异常时，你都可以重新创建并再次读取数据。\n\n## 设计外观\n\n在知道应用程序将做什么以及数据库包含什么信息之后，你就可以设计应用程序的外观了。外观包含了用户看到的内容以及用户与应用程序交互的方式。你的设计应该是美观且易用的。你可以在纸上规划此设计，可能用草图或文字描述来标出用户看到的内容。在你的设计中，包含用户交互组件（如按钮或链接），并描述它们的动作。你应该在设计中包含应用程序的每一个页面。如果你足够幸运，你认识一个可以为你开发网页的图形设计师。如果你像我一样，你只能凭借有限的图形知识尽力而为。\n\
  \n宠物目录有两个外观设计：一个用于客户看到的目录，另一个是不那么华丽的，用于你（或任何人）向目录添加宠物的应用程序部分。\n\n## 向客户展示宠物\n\n\
  应用程序包含三个客户看到的页面：自家的 **商店首页 (storefront page)**：这是客户看到的第一个页面。它列出了业务名称和该网站的目的。\n-\
  \ **宠物类型页面 (pet type page)**：此页面列出了所有宠物类型，并允许客户选择他们想要看到的宠物类型。\n- **宠物页面 (pets page)**：此页面显示所选类型的所有宠物。\n\
  \n### 商店首页 (Storefront page)\n商店首页是宠物商店的介绍页。由于大多数人已经知道宠物商店是什么，所以此页面不需要太多的解释。图 11-1\
  \ 显示了商店首页。页面上唯一的客户操作是一个链接，客户可以点击该链接查看宠物目录。\n\n### 宠物类型页面 (Pet type page)\n宠物类型页面列出了目录中的所有宠物类型。每种宠物类型都列有其对应的描述。图\
  \ 11-2 显示了宠物类型页面。每种宠物类型旁边会出现单选按钮（或链接），以便客户可以选择他们想要看到的宠物类型。\n\n### 宠物页面 (Pets page)\n\
  宠物页面列出了所选类型的所有宠物。每只宠物都列出了其 `petID`、描述、图片和价格。宠物页面的格式不同，取决于目录数据库中的信息。图 11-3、11-4 和\
  \ 11-5 显示了一些可能的宠物页面。图 11-3 显示了一个列出目录中三只不同狗的页面。图 11-4 显示了多只宠物可以具有相同的名称。注意这些家猫有不同的\
  \ `petID` 数字。图 11-5 显示了在 `Color` 表中找到宠物时的输出，表明有多种颜色可选。在所有这些页面上，顶部的一行字写着“点击任何图片查看更大的版本”。如果客户点击图片，将显示图片的更大版本。\n\
  \n## 向目录添加宠物\n\n应用程序包含了三个客户看不到的页面；这些是用于向宠物目录添加宠物的页面。这三个页面按顺序工作，以添加单个宠物：\n\n1. **获取宠物类型页面\
  \ (Get pet type page)**：向目录添加宠物的员选择宠物类型的单选按钮。用户也可以输入新的宠物类型。\n2. **获取宠物信息页面 (Get\
  \ pet information page)**。\n\n\n\n\n用户选择要添加的宠物的单选按钮，并填写宠物描述、价格和图片文件名。用户还可以输入新的宠物名称。\n\
  \n### 3. 接收反馈页面。\n显示一个页面，列出已添加到目录的宠物信息。\n\n#### 获取宠物类型页面\n第一个页面获取需要添加到目录的宠物的类型。图\
  \ 11-6 显示了获取宠物类型页面。注意，目录中当前所有的宠物类型都已列出，并提供了一个区域，允许用户在需要时输入新的宠物类型。\n\n****图 11-6：**\
  \ 向目录添加宠物的第一个页面。\n![Image 47](img/index-356_1.jpg)\n![Image 48](img/index-356_2.jpg)\n\
  \n336 **第 IV 部分：应用程序**\n\n#### 获取宠物信息页面\n图 11-7 显示了第二个页面。此页面允许用户输入存入目录的宠物信息。此页面列出了目录中已选宠物类型的所有宠物名称，以便用户选择其中一个。它还提供了一个区域，允许用户在需要时输入新的宠物名称。\n\
  \n**图 11-7：** 第二个页面请求宠物名称。\n\n#### 反馈页面\n当用户提交宠物信息时，这些信息会被添加到 `PetCatalog` 数据库中。图\
  \ 11-8 显示了一个验证已添加到数据库信息的页面。用户可以点击链接返回第一个页面并添加另一个宠物。\n\n**图 11-8：** 最后一个页面提供反馈。\n\
  ![Image 49](img/index-357_1.jpg)\n\n337 **第 11 章：构建在线目录**\n\n#### 获取缺失信息页面\n应用程序会检查数据，以确保用户输入了所需信息，并对任何未输入的信息向用户提示。例如，如果用户在第一个页面上选择了“新类别”（New\
  \ Category），则用户必须输入类别名称和描述。如果用户没有输入名称或描述，将显示一个指出问题并请求信息的页面。图 11-9 显示了用户如果忘记输入类别名称和描述时看到的页面。\n\
  \n**图 11-9：** 此页面请求新的类别和描述。\n\n## 编写程序\n在了解页面将如何以及以及它们的功能之后，你就可以编写程序了。通常情况下，你会为每个页面编写一个程序，尽管有时将程序拆分为多个文件或将一个页面上的程序合并也是合理的。（关于如何组织应用程序的详情，请参见第\
  \ 10 章。）\n\n正如我在第 10 章中讨论的，将连接数据库所需的信息存储在单独的文件中并将该文件包含在所有需要访问数据库的程序中。出于安全考虑，文件应存储在安全的位置，并使用具有误导性的名称。对于此应用程序，以下信息存储在名为\
  \ `misc.inc` 的文件中：\n\n```php\n<?php\n$user=\"catalog\";\n$host=\"localhost\";\n\
  $password=\"\";\n$database=\"PetCatalog\";\n?>\n```\n\n宠物目录应用程序有两组独立的程序：一组用于向客户显示宠物目录，另一组用于向目录录入新宠物。\n\
  \n338 **第 IV 部分：应用程序**\n\n### 向客户显示宠物\n向客户显示宠物目录的应用程序有三个基本任务：\n- 显示商店首页，其中有一个指向目录的链接。\n\
  - 显示一个用户选择宠物类型的页面。\n- 显示一个包含所选宠物类型宠物的页面。\n\n### 显示商店首页\n商店首页不需要任何 PHP 语句。它只需显示一个带有链接的\
  \ Web 页面。HTML 语句就足以实现此功能。列表 11-1 显示了描述商店首页的 HTML 文件。\n\n**列表 11-1：商店首页的 HTML 文件**\n\
  ```html\n<?php\n/* Program: StoreFront.php\n* Desc: Displays the storefront page.\n\
