  214 **第三部分：PHP**\n\n## 建立连接\n\n在存储任何数据之前，你必须连接到数据库。在 PHP 5 中，你需要连接数据库，使用 `mysqli`\
  \ 函数来处理。连接数据库时，你需要知道数据库的名称。在 Web 托管主机上，你的 Web 托管提供商提供此信息，可能是另一个名称。\n\n在连接数据库时，使用\
  \ `mysqli` 函数。连接数据库后，你可以发送你需要的许多 SQL 查询。连接将保持开启，直到你关闭它。\n\n### 连接 MySQL 服务器\n\n\
  与 MySQL 通信的第一步是连接 MySQL 服务器。你需要知道数据库所在计算机的名称、MySQL 账户名称以及密码。为了打开连接，按如下方式使用 `mysqli_connect`\
  \ 函数：\n\n```\n$cxn=mysqli_connect(\"host\",\"acct\",\"password\",\"dbname\") or\
  \ die(\"message\");\n```\n\n- `host`: 安装 MySQL 的计算机名称。在本地计算机上，它是 localhost。你的 Web\
  \ 托管提供商提供此信息，可能是另一个名称。如果此信息为空 (\"\")，PHP 假设为 localhost\n- `acct`: MySQL 账户的名称。（我在第\
  \ 5 章中详细讨论了 MySQL 账户。）\n- `password`: `acct` 指定账户的密码。如果 MySQL 账户不需要密码，请在引号之间填写任何内容：\"\
  \"\n- `dbname`: 你想要通信的数据库名称。这是一个可选参数。如果你愿意，稍后可以使用单独命令选择数据库。\n\n- `message`: 连接失败时发送到浏览器的消息。如果计算机或网络中断或\
  \ MySQL 服务器未运行，连接将失败。如果提供的信息不正确，也可能失败——例如密码中有拼写错误。在开发期间，你可能希望使用描述性的消息，例如“无法连接到服务器”，但在应用程序投入使用后可以使用更通用的消息，例如“宠物商店目前不可，请稍后再试”。\n\
  \n如果你使用的是 `mysql` 函数，你无法在连接函数中选择数据库。你必须使用单独的函数 `mysql_select_db` 来选择数据库。\n\n\n\n\
  \n出于安全考虑，将连接信息存储在变量中并在连接语句中使用这些变量是一个好习惯，如下：`$host=”localhost”;`\n\n`$user=”catalog”;`\n\
  \n`$passwd=””;`\n\n`$dbname = “PetCatalog”;`\n\n`$cxn = mysqli_connect($host,$user,$passwd,$dbname)\
  \ or die (“Couldn’t connect to server.”);`\n\n# 第三部分：PHP\n\n为了更高的安全性，你可以将连接信息的赋值语句放在隐藏位置的单独文件中，这样账户名和密码甚至不会出现在程序中。我将在第\
  \ 10 章中解释如何实现这一点。\n\n变量 `$cxn` 包含了标识连接的信息。你可以通过使用多个变量名来同时打开多个连接。连接会保持开启，直到你关闭它或程序结束。你可以通过以下方式关闭连接：\n\
  \n```php\nmysqli_close($connectionname);\n```\n\n例如，要关闭上一个示例中的连接，使用此语句：\n\n```php\n\
  mysqli_close($cxn);\n```\n\n## 处理 MySQL 错误\n\n你使用 PHP 语言的 `mysqli` 函数（如 `mysqli_connect`\
  \ 和 `mysqli_query`）来与 MySQL 数据库交互。如果其中一个函数未能正确执行，将会返回一个包含问题信息的 MySQL 错误消息。然而，除非程序特意发送，否则此错误消息不会发送到浏览器。MySQL\
  \ 错误消息是由其自身的函数 `mysqli_error($csn)` 返回的。要查看包含错误额外信息的 MySQL 错误消息，你需要在脚本中包含 `mysqli_error`\
  \ 函数。\n\n以下是调用 `mysqli` 函数的常见种常用方式：\n\n- **不带错误处理的函数调用：** 调用函数时没有包含任何提供错误消息的语句。例如，可以按如下方式调用\
  \ `mysqli_connect` 函数：\n\n  ```php\n  $cxn = mysqli_connect($host,$user,$password,$dbname);\n\
  \  ```\n  如果该语句失败（例如账户无效），则不会建立连接，但程序中剩余的语句将继续执行。在大多数情况下，这是没用的，因为程序其余部分的某些语句可能依赖于已打开的连接，例如在数据库中获取或存储数据。\n\
  \n- **使用 die 语句调用函数：** 调用函数时带有一个 `die` 语句，该语句向浏览器发送消息。例如，可以按如下方式调用 `mysqli_connect`\
  \ 函数：\n\n  ```php\n  $cxn = mysqli_connect($host,$user,$password,$dbname) or die\
  \ (“Couldn’t connect to server”);\n  ```\n\n  如果该语句失败，则不会建立连接并执行 `die` 语句。`die`\
  \ 语句会停止程序并向浏览器发送消息。如果无法建立连接，将不再执行后续语句。你可以在 `die` 语句中放置任何想要的消息。\n\n- **在 if 语句中调用函数：**\
  \ 使用 `if` 语句调用函数，如果连接失败，则执行一个语句块。例如，可以按如下方式调用 `mysqli_connect` 函数：\n\n  ```php\n\
  \  if (!$cxn = mysqli_connect($host,$user,$password,$dbname)) {\n      $message\
  \ = mysqli_error($cxn);\n      echo “$message”;\n      die();\n  }\n  ```\n\n  如果该语句失败，将执行\
  \ `if` 块中的语句。`mysqli_error` 函数返回 MySQL 错误消息并将其保存在变量 `$message` 中。然后输出该错误消息。`die`\
  \ 语句结束程序，因此不再执行后续语句。注意 `if` 语句中的 `!`（感叹号）。`!` 表示“非”。换句话说，如果赋值语句不为真，则 `if` 语句为真。\n\
  \n你想要在程序中包含的错误处理类型取决于你的程序。你处理错误的方式取决于你预期会发生什么。在开发期间，你可能想要更具描述性的错误处理。例如，假设你在以下语句中输入了错误：\n\
  \n```php\n$host = “localhost”;\n$user = “rot”;\n$password = \"\";\nif (!$cxn = mysqli_connect($host,$user,$password,$dbname))\
  \ {\n    $message = mysqli_error($cxn);\n    echo “$message”;\n}\n```\n\n由于你输入了\
  \ `rot` 而不是 `root`，你会看到类似 `Access denied for user ‘rot’@localhost` 的错误。\n\n# 第三部分：PHP\n\
  \n 选择数据库\n\n如果你想选择数据库，可以使用 `mysqli_select_db` 函数。格式如下：\n\n```php\nmysqli_select_db($connectionname,$dbname)\
  \ or die (“message”)\n```\n\n- `connectionname`：包含连接信息的变量。\n- `dbname`：数据库名称。\n\
  - `message`：如果无法选择数据库则发送到浏览器的消息。\n\n例如，你可以可以使用语句选择数据库：\n\n```php\nmysqli_select_db($cxn,”PetCatalog”)\
  \ or die (“Couldn’t select database.”);\n```\n\n如果 `mysqli_select_db` 无法选择数据库，程序在此停止并发送消息。\n\
  \n出于安全考虑，将数据库名存储在变量并在连接语句中使用这些变量是一个好习惯，如下：\n\n```php\n$dbname = “PetCatalog”;\n\
  mysqli_select_db($cxn,$dbname) or die (“Couldn’t select database.”);\n```\n\n为了更高的安全性，你可以将数据库名的赋值语句放在隐藏位置的单独文件中，这样数据库名甚至不会出现在程序中。\n\
  \n# 第 8 章：数据输入，数据输出\n\n### 发送 SQL 查询\n\n在建立了 MySQL 服务器连接且 PHP 知道你想与哪个数据库交互后，就可以发送\
  \ SQL 查询。`query` 是向 MySQL 服务器存储、更新或检索某些数据的请求。\n\n要与数据库交互，将你的 SQL 查询放入变量中，并使用 `mysqli_query`\
  \ 函数发送到 MySQL 服务器，如示例所示：\n\n```php\n$query = “SELECT \\* FROM Pet”;\n$result = mysqli_query($cxn,$query)\
  \ or die (“Couldn’t execute query.”);\n```\n\n查询在当前选择的数据库上执行。变量 `$result` 持有执行查询的结果。该信息取决于查询是否从数据库获取了信息：\n\
  \n- **对于不获取数据的查询：** 变量 `$result` 包含了查询是否成功执行的信息。如果成功，`$result` 被设置为 `TRUE`；如果不成功，则\
  \ `$result` 被设置为 `FALSE`。某些不返回数据的查询是 `INSERT` 和 `UPDATE`。\n\n\n\n\n✓ **对于返回数据的查询：**\
  \ 变量 `$result` 包含一个结果标识符，它用于标识返回数据的位置，而不是返回的数据本身。某些确实返回数据的查询是 `SELECT` 和 `SHOW`。\n\
  \n从 MySQL 4.1 开始，如果你使用 `PHP 5` 和 `mysqli` 函数，你可以一次性向服务器发送多个查询，并用分号隔开。\n\n你使用 `mysqli_multiple_query`\
  \ 函数来实现此目的。然而，一次性发送多条查询可能会降低程序的安全性。\n\n请谨慎且少量地使用多条查询。有关如何使用多条查询的信息，请参阅 MySQL 在线手册：http://us2.php.net/manual/en/mysqli.multi-query.php。\n\
  \n在将查询字符串赋值给 `$query` 时，单引号和双引号的使用可能会让人有些困惑。你实际上在使用两个层级的引号：用于将字符串赋值给 `$query` 所需的引号，以及作为\
  \ SQL 语言查询本身部分的引号。以下规则可以帮助你避免任何引号问题：\n\n# 第三部分：PHP\n\n✓ 在字符串的开头和结尾使用双引号。\n✓ 在变量名之前之后使用单引号。\n\
  ✓ 在字面值之前之后使用单引号。\n\n以下是赋值查询字符串的示例：\n\n```php\n$query = “SELECT firstName FROM Member”;\n\
  $query = “SELECT firstName FROM Member WHERE lastName=’Smith’”; \n$query = “UPDATE\
  \ Member SET lastName='$last_name’”;\n```\n\n查询字符串本身不包含分号（`;`），所以不要在最后一个引号内放置分号。唯一的分号位于末尾；这是结束语句的\
  \ PHP 分号。\n\n## 从数据库获取信息\n\n从数据库中获取信息是 Web 数据库应用程序的常见任务。以下是数据库信息的两种常见用途：\n\n✓ **使用信息条件条件执行语句。**\
  \ 例如，你可能会从 `Member Directory` 中获取居住州，并向居住不同州的成员发送不同的消息。\n✓ **在 Web 页面中显示信息。** 例如，你可能想要显示数据库中的产品信息。\n\
  \n若要在程序中使用数据库信息，你需要将信息放入变量中。然后你就可以在条件语句、`echo` 语句或其他语句中使用这些变量。从数据库获取信息是一个两步骤的过程：\n\
  \n1. 你构建一个 `SELECT` 查询并将其发送到数据库。当查询执行时，选中的数据被存储在一个临时位置。\n2. 你将数据从临时位置移动到变量中并在程序中使用它。\n\
  \n### 发送 SELECT 查询\n\n你使用 `SELECT` 查询从数据库获取数据。`SELECT` 查询是用 SQL 语言编写的。\n\n要从数据库获取数据，请构建所需的\
  \ `SELECT` 查询，将其存储在变量中，然后将查询发送到数据库。以下语句选取了 `PetCatalog` 数据库中 `Pet` 表中的所有信息：\n\n\
  ```php\n$query = “SELECT * FROM Pet”;\n$result = mysqli_query($cxn,$query) or die\
  \ (“Couldn’t execute query.”);\n```\n\n`mysqli_query` 函数获取 `SELECT` 查询请求的数据并将其存储在临时位置。你可以将这些数据认为是存储在表中，类似于\
  \ `MySQL` 表，信息以行和列的形式存在。\n\n该函数返回一个结果标识符，该标识符包含了找到存储数据的临时位置所需的信息。在前面的语句中，结果标识符被放入变量\
  \ `$result` 中。如果函数失败（例如，查询不正确），`$result` 将包含 `false`。\n\n执行函数后的下一步是将数据从其临时位置移动到可以在程序使用的变量中。\n\
  \n### 获取并使用数据\n\n你使用 `mysqli_fetch_assoc` 或 `mysqli_fetch_row` 函数从临时位置获取数据。`mysqli_fetch_assoc`\
  \ 函数以关联数组的形式返回数据；`mysqli_fetch_row` 以索引数组的形式返回数据。偶尔你可能需要以关联数组和索引数组的形式获取数据，可以通过 `mysqli_fetch_array`\
  \ 实现。\n\n这些函数从临时位置获取一行数据。临时表可能只包含一行数据，也可能你的 `SELECT` 查询导致了多行数据。如果你需要从临时位置获取多行数据，请在循环中使用\
  \ `mysqli_fetch_assoc` 或 `mysqli_fetch_row` 函数。\n\n#### 获取一行数据\n\n要将数据从临时位置移动到程序可以使用变量，你在循环中使用\
  \ `mysqli_fetch_assoc` 或 `mysqli_fetch_row` 函数。这些函数的通用格式为：\n\n```php\n$row = mysqli_fetch_assoc($result);\n\
