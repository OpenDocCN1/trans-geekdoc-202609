  \n\n\n\n\n# 登录页面\n\n图 12-2 所示的登录页面允许客户登录或创建新的会员账户。它包含了客户需要填写的以获取会员账户的表单。该页面有两个提交按钮：一个用于使用现有会员账户登录，另一个用于创建新的会员账户。\n\
  \n**图 12-2：**\n客户登录或创建新会员账户的页面。\n\n![Image 52](img/index-387_1.jpg)\n\n**第 12 章：构建会员专属网站**\
  \ 367\n\n如果客户在登录页面上犯了错误错误（无论是在登录区域还是新成员区域），表单将带有错误消息重新显示。\n\n例如，假设某客户在输入她的电子邮箱地址时发生了错误：她忘记在电子邮箱地址末尾输入\
  \ `.com`。图 12-3 显示了她在提交带有错误的表单后看到的屏幕。\n\n注意打印在表单正方的错误消息。\n\n当成员使用有效的 `Member ID`\
  \ 和密码成功登录后，他们将进入会员专属区域的第一页。当新成员成功提交了信息看起来合理的表单后，他们将进入新成员欢迎页（见下一节）。此外，系统会向新成员发送一封电子邮件，内容如下：已为您设置了一个新的会员账户。您的新\
  \ `Member ID` 和密码是：\n\n`gsmith`\n`secret`\n\n我们感谢您对 `PetStore.com` 宠物商店关注。\n\n如果您有任何疑问或问题，请发送电子邮件至\
  \ `webmaster@petstore.com`\n\n**图 12-3：**\n显示因表单错误导致的消息的页面。\n\n![Image 53](img/index-388_1.jpg)\n\
  \n368 **第四部分：应用程序**\n\n这封电子邮件包含了客户的密码。我认为，为客户提供其密码的纸质副本对客户和业务都是有帮助的。客户*会*忘记自己的密码。这似乎是规则之一。一封带有密码的电子邮件可能在客户忘记密码时为其提供帮助，为他以及您省去一些麻烦。当然，电子邮件并不一定安全，因此通过电子邮件发送密码对于某些账户（如在线银行账户）来说不是好主意。但是，对于这个宠物商店应用程序，由于面临的风险仅限于授权的折扣和宠物护理信息，因此通过电子邮件发送密码是一个合理的风险。\n\
  \n## 新成员欢迎页\n\n新成员欢迎页问候客户并提供有用信息。客户看到账户已创建，然后可以立即进入会员专属区域。图 12-4 显示了一个欢迎页。\n\n**图\
