  \n不要忘记 `exit` 语句。如果没有 `exit` 语句，程序将继续执行，并在显示表单后显示欢迎消息。\n\n图 8-13 显示了如果用户没有输入名字或中间名生成的\
  \ Web 页面。注意，缺失信息列表不包含 `Middle Name`（中间名），因为 `Middle Name` 不是必填的。此外，请注意用户最初在表单中输入的信息仍然显示在表单字段中。\n\
  \n**图 8-13：**\n处理缺失信息的表单的结果。\n\n### 检查信息的格式\n\n每当用户必须在表单中输入信息时，你都可以预见到会有数量的拼写错误。你可以在提交表单时检测出其中一些错误，向用户指出这些错误，然后要求他们重新输入信息。例如，如果用户在邮政编码字段输入了\
  \ `8899776`，你就知道这是错误的。这个信息对于邮政编码来说太长了，对于 `zip+4` 来说又太短了。\n\n你还需要保护自己免受恶意用户——他们可能想要破坏你的网站或数据库，或者从你或你的用户那里窃信息。你不希望用户在表单字段中输入\
  \ HTML 标签——这些标签发送到浏览器时可能会产生意外的结果。一个特别危险的标签是 `script` 标签，它允许用户在表单字段中输入程序。\n\n**第\
  \ 8 章：数据输入，数据输出** 259\n\n如果你检查每个字段是否符合预期格式，你就能发现拼写错误并防止大多数恶意内容。然而，检查信息是一项平衡工作。你希望尽可能捕获错误数据，但不想阻止任何合法信息。例如，当你检查电话号码时，可能会将其限制为数字。这种检查的问题是，它会过滤掉表单中\
  \ `555-5555` 或 `(888) 555-5555` 等合法电话号码。因此，你还需要允许连字符 (`-`)、括号 (`( )`) 和空格。你可以将字段长度限制为\
  \ 14 个字符（包括括号、空格和连字符），但这会过滤掉海外号码或包含分机机的号码。底线是：你需要仔细考虑对于任何字段你想要接受或过滤掉哪些信息。\n\n你可以使用正则表达式（`regular\
  \ expressions`，即模式）来检查字段信息。你将字段中的信息与模式进行比较，看它是否匹配。如果不匹配，字段中的信息就是错误的，用户必须重新输入。（关于正则表达式的更多信息，请参阅第\
  \ 6 章。）\n\n通常情况下，你用于检查字段的语句如下：\n\n```php\nif(!preg_match(\"pattern\", $varilename))\
  \ {\n    echo error message;\n    redisplay form;\n    exit();\n}\necho “Welcome”;\n\
  ```\n\n注意 `if` 语句中的条件是负的。也就是说，`!`（感叹号）表示“不”。因此，`if` 语句的实际含义是：如果变量*不*匹配模式，则执行 `if`\
  \ 块。\n\n例如，假设你想检查一个包含用户姓氏的输入字段。你可以预见名字包含字母而不是数字，并可能包含撇号和连字符（如 `O’Hara` 和 `Smith-Jones`）以及空格（如\
  \ `Van Dyke`）。此外，很难想象一个超过 50 个字符的名字。因此，你可以使用以下语句来检查名字：\n\n```php\nif(!preg_match(\"\
  /^[A-Za-z’ -]{1,50}$/\", $last_name)) {\n    echo error message;\n    redisplay\
  \ form;\n    exit();\n}\necho “Welcome”;\n```\n\n260 **第三部分：PHP**\n\n如果你想将连字符 (`-`)\
  \ 作为由方括号 (`[ ]`）包围的允许字符集的一部分，你必须将连字符放在列表的开头或结尾。否则，如果你把它放在两个字符之间，程序将将其解释为这两个字符之间的范围，例如\
  \ `A–Z`。\n\n你还需要检查多选字段。虽然多选可以防止诚实的用户输入错误，但它不能阻止带有恶意意图的聪明用户向字段输入意外数据。你可以使用以下类型的正则来检查多选字段的合规输出：\n\
  \n```php\nif(!preg_match(\"/(male|female)/\", $gender))\n```\n\n如果字段包含 `male` 或\
  \ `female` 以外之外的任何内容，都会执行 `if` 块。\n\n在前面的节中，你了解到如何检查每个表单字段以确保它不是空的。此外，你可能还想检查所有带有数据的字段，以确保数据处于接受的格式。你可以通过对列表\
  \ 8-12 所示程序进行一些简单的更改来检查格式。列表 8-13 显示了修改后的程序，称为 `checkAll.php`。\n\n列表 8-13 中的程序与列表\
  \ 8-12 中的程序一样，处理从列表 8-6 中 `displayForm` 程序生成的表单提交的数据。要使用列表 8-13 中的程序，首先编辑列表 8-12\
  \ 所示的 `displayForm` 程序。列表 8-13：检查表单中的所有数据\n\n```php\n<?php\n/* checkAll.php 描述：检查所有表单字段\
