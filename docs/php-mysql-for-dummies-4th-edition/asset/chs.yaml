  \n339 **第 11 章：构建在线目录**\n\n以下是后续行的简要解释：\n12 `include` 语句引入了连接数据库所需的信息。我将其命名为 `misc.inc`，因为比命名为\
  \ `passwords.inc` 看起来更安全。\n14 连接到 MySQL 服务器。\n18 查询 `PetType` 表中的所有信息并按 `petType`\
  \ 字母排序。\n20 执行第 18 行的查询。\n\n\n\n\n确保表单中至少选择一个单选按钮，这样表单就不会在未选择任何按钮的情况下提交，否则会导致产生难看的错误消息或警告。计数器的设置仅是为了这一目的。\n\
  \n# 第 11 章：构建在线目录 (341)\n\n虽然在每个单选按钮上添加 `checked='checked'` 在某些浏览器中有效，但会令其他浏览器困惑。然而，仅对一个单选按钮添加\
  \ `checked='checked'` 所需的额外编程可以防止潜在问题。\n\n➝**48**\n输出单选按钮表单标签的剩余部分——关闭标签并显示宠物类型的那部分。\n\
  \n➝**49**\n在表格行的第二个单元格中输出回显宠物的描述。\n\n➝**50**\n给计数器加 1，以跟踪循环执行的次数。\n\n➝**53**\n向表单添加提交按钮。\n\
  \n➝**54**\n关闭表单。\n\n当用户选择一个单选按钮并然后点击提交按钮时，下一个程序（在表单标签中命名为 `ShowPets.php`）将运行，显示所选宠物类型的宠物。\n\
  \n## 显示宠物\n\n宠物页面（参见图 11-3、11-4 和 11-5）向客户显示当前目录中所有所选类型的宠物列表。列表 11-3 显示了生成宠物 Web\
