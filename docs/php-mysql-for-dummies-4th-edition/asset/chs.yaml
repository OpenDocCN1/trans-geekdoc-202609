  \ 实现。\n\n### 使用循环获取所有行数据\n\n\n\n\n\n如果你选择了多行数据，请使用循环从临时位置获取所有行。循环块中的语句会获取一行数据并对其进行处理。循环将重复执行，直到检索到所有行。你可以使用\
  \ `while` 循环或 `for` 循环来获取这些信息（`while` 循环和 `for` 循环将在第 7 章中介绍）。\n\n处理信息的最常用方法是使用如下的\
  \ `while` 循环：\n\n```php\nwhile($row = mysqli_fetch_assoc($result))\n{\n    block\
  \ of statements\n}\n```\n\n该循环将一直重复，直到从 `$result` 中获取最后一行。如果你只是想输出所有数据，例如，你将使用类似于下面的的循环：\n\
  \n```php\nwhile($row = mysqli_fetch_assoc($result))\n{\n    extract($row);\n   \
  \ echo “$petType: $petName<br />”;\n}\n```\n\n现在，来看一个如何为宠物目录（Pet Catalog）应用程序获取信息的示例。假设宠物目录有一个名为\
