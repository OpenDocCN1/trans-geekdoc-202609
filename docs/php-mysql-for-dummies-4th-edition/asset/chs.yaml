  \n\n# 互联网/网站设计：第 4 版\n## 让一切变得更简单！™\n**学习使用赋予网站生命力的工具 —— 第 4 版**\n**简单又有趣！**\n\n\
  ### 翻开本书发现：PHP & MySQL®\n\n静态网站已经无法满足需求了。为了提供 HTML、CSS 和基于数据库驱动的页面，你需要熟悉 `PHP` 和\
  \ `MySQL` 后端数据库。本书将教你如何构建两个常见的应用程序：一个产品目录和一个需要用户名和密码的会员网站。你将学习到一种基础设计，并可以根据自己的意愿对其进行扩展！\n\
  \n*   如何跟进 `PHP` 和 `MySQL` 的更新\n*   最新版本中哪些不同之处\n*   Web 托管公司的优缺点\n*   如何对你的数据库进行数据备份和恢复\n\
  \n### 初次接触这些内容？\n开始熟悉 `PHP` 和 `MySQL`，并了解如何在 `Windows`、`Mac` 或 `Linux` 上安装它们。\n\n\
  *   错误信息及其含义\n*   完美搭档——查看语言和数据库如何协同工作，以更少的麻烦的方式生成动态 Web 页面\n*   MySQL 的移动与存储——在数据库中存储数据并在\
  \ Web 页面上显示\n*   关于什么能为用户提供价值的建议\n*   符合规范——学习构建符合最新标准的脚本和代码\n*   十个搞乱你代码的“陷”\n\
  *   部分之和——组织应用程序的所有部分，确保安全性并完成文档工作\n*   创建符合 `PHP` 4、5 和 6 标准的格式良好的 PHP 代码\n*  \
  \ 访问辅助网站 `www.dummies.com/php&mysql` 以查找书中使用的所有代码、视频、分步示例或操作指南文章\n*   轻松安装并设置 `PHP`\
  \ 和 `MySQL`\n*   选择 Web 托管主机商并保护你的文件\n*   构建动态的、数据库驱动的 Web 网站\n\n**Janet Valade**\
