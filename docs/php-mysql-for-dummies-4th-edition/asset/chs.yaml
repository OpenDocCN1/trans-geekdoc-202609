  \      $bad_format[] = $field;\n        }\n    }\n}\n\n/* 如果任何字段不正确，显示错误消息和表单 */\n\
  if(@sizeof($blank_array) > 0 or @sizeof($bad_format) > 0) {\nif(!preg_match(\"pattern\"\
