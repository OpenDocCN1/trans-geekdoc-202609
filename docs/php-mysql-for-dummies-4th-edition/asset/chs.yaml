  \n## Part I\n### 开发 Web 数据库应用程序\n### 使用 PHP 和 MySQL\n\n**在本部分 . . .**\n\n在本部分，我将提供一个概述。我描述了\
  \ `PHP` 和 `MySQL`、它们的工作原理，以及它们如何协作来实现你的 Web 数据库应用程序。在描述完工具之后，我将向你展示如何搭建工作环境。我介绍了访问\
  \ `PHP` 和 `MySQL` 的选项，并指出了每个环境中需要注意的地方。\n\n在描述了工具和开发环境选项后，我将提供开发流程的概述。我讨论了应用程序的规划、设计和构建。\n\
  \n## 第 1 章：PHP 和 MySQL 简介\n\n**本章内容**\n\n*   了解什么是 Web 数据库应用程序\n*   探索 `MySQL` 的工作原理\n\
  *   了解 `PHP`\n*   了解 `PHP` 和 `MySQL 如何协同工作\n\n所以，你需要开发一个交互式 Web 网站。也许你的老板刚让你负责公司的在线产品目录。或者你想开发自己的\
  \ Web 业务。又或者你姐姐想在线上销售她的画作。或者你自愿建立一个仅对你马杂团演员协会成员开放的 Web 网站。无论你的动机是什么，你都会发现应用程序需要存储信息（例如产品信息或成员密码），因此需要数据库。你也可以发现应用程序需要与用户进行*动态*的交互；例如，用户选择一个产品进行查看或输入会员信息。这种类型的\
  \ Web 网站就是*Web 数据库应用程序*。\n\n我假设你以前用过 `HTML`（超文本标记语言）创建过静态 Web 页面，但创建一个交互式 Web 网站是一项新挑战，设计数据库也是如此。你向你认识的三位计算机大师请教做什么。他们说了很多话。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。他们说了很多，你可以看到很多东西。\
  \ \n\n10 **Part I: 使用 PHP 和 MySQL 开发 Web 数据库应用程序**\n\n\n\n\n\n你存储在数据库中的信息有许多类型。公司的在线目录需要一个数据库来存储有关公司所有产品的信息。会员网站需要一个数据库来存储成员信息。一个招聘网站需要一个数据库（也许是两个数据库）来存储职位空缺信息和来自简历的信息。你计划存储的信息可能与互联网上所有网站存储的信息相似——也有可能是你的应用程序所特有的信息。\n\
  \n`database`（数据库）一词指的是存储实际数据的文件或一组文件。这些数据通过一组称为 `DBMS`（数据库管理系统）的程序进行访问。如今几乎所有的 `DBMSs`\
  \ 都是 `RDBMSs`（关系型数据库管理系统），在这些系统中，数据被组织并存储在一组相关的数据表中。\n\n在本书中，我们使用 `MySQL` 作为 `RDBMS`，因为它特别适用于网站。`MySQL`\
  \ 及其优势将在本章后尾的“MySQL，我的数据库”章节中进行讨论。你可以在第 3 章中了解如何组织和设计一个 `MySQL` 数据库。\n\n## 应用程序：在数据库中进出数据\n\
  \n为了使数据库有用，你必须能够将数据移入和从从中取出。程序是你实现这一点的工具，因为它们通过与数据库交互来存储和检索数据。程序连接到数据库并发出请求：“获取这些数据并将其存储在指定位置。”另一个程序发出请求：“找到指定的数据并交给我。”与数据库交互的应用程序在用户与\
  \ Web 页面交互时运行。例如，当用户在填写 Web 表单后点击提交按钮时，程序会处理表单中的信息并存储在数据库中。\n\n**第一部分：使用 PHP 和 MySQL\
  \ 开发 Web 数据库应用程序**\n\n### 邮件讨论列表\n\n良好的技术支持可以通过 `e-mail` 软件相关的 `e-mail discussion\
  \ lists`（邮件讨论列表）获得，这些是宝贵的 `discussion lists`，即分发技术支持的人群。对于你订阅列表的任何主题，都有从几百到几千个软列表用户可供选择。软件供应商的开发人员通常也在列表中。你可以将其想象成：古代哲学、酿酒师、程序员和技术支持人员、烹饪、披士乐队、苏格兰梗梗、政治等等。`list\
  \ manager`（列表管理器）维护着一个 `e-mail` 地址的分发列表，列表中的任何人都不可能是第一个遇到你问题的人。无论你的问题是什么，或者想加入讨论，只需向讨论列表发送消息即可。当你向\
  \ `email list` 发布一个问题时，列表上的某人可能知道答案或解决方案。你的消息会发送到整个列表，以便每个人都能看到。答案会在几分钟内出现在你的收件箱中。因此，讨论是一项集体努力，任何人都可以对任何消息进行回复。此外，大多数列表都维护以前讨论的存档，以便你搜索答案。\n\
  \n`E-mail discussion lists` 有各种赞助商的支持。任何个人或组织都可以运行列表。你只需通过加入讨论并阅读几天消息就能发现这一点。大多数软件供应商都运行一个或多个专门针对其软件的列表。大学运行许多用于教育主题的列表。此外，每个大学都有几个关于\
  \ `PHP`、`MySQL` 以及特殊主题（如 `databases` 和 `PHP`）的讨论列表。一些网站管理讨论列表，例如 `Yahoo! Groups`\
  \ 和 `Topica`。用户可以通过 PHP (`www.php.net`) 和 `MySQL` (`www.mysql.com`) 网站上的加入指南找到邮件列表的名称，并创建新列表或加入现有列表。\n\
  \n## MySQL，我的数据库\n\n`MySQL` 是一种在许多网站上使用的快速、易用的 `RDBMS`。从一开始，速度就是开发人员关注的重点。为了速度，他们决定提供比其主要竞争对手（如\
  \ `Oracle` 和 `Sybase`）更少的功能。然而，尽管 `MySQL` 在功能上不如其竞争对手，但它在安装和使用上更简单且速度更快。\n\n`MySQL`\
  \ 最初由一家公司开发，但现在由 Sun 公司开发和营销。它以以下两种方式授权：\n\n*   `MySQL Community Server`：免费下载的开源\
  \ `MySQL` 版本，满足大多数开发者的需求。\n*   `MySQL Enterprise Subscription`：提供全面的生产支持、监控工具、咨询、技术支持和其他服务，你可以根据需要选择服务级别。\n\
  \n你可以在 `www.mysql.com` 网站上的 `e-mail lists` 存档找到关于 `MySQL` 的问题和答案。\n\n### MySQL 的优势\n\
  \n`MySQL` 是 Web 开发者非常喜欢的数据库。它的速度和小型化使其成为网站的理想选择。再加上它是开源的，这使得它非常受欢迎。以下是其优势的列举：\n\n\
  *   **速度快**：开发 `MySQL` 的人员初要目标就是速度。因此，该软件从设计之初就考虑了速度。\n*   **价格便宜**：`MySQL` 在开源\
  \ `GPL` 许可证下是免费的，商业许可费用也是合理的。\n*   **易于使用**：你可以通过 `SQL` 语言的几个语句来构建和交互 `MySQL` 数据库，`SQL`\
  \ 是与 `RDBMSs` 通信的标准语言。请查看第 4 章有关 `SQL` 语言的内容。\n*   **支持多种操作系统**：`MySQL` 运行在许多操作系统上——Windows、Linux、`Mac\
  \ OS`、大多数 `Unix` 变（包括 `Solaris` 和 `AIX`）、`FreeBSD`、`OS/2`、`Irix` 等。\n*   **所有主机均可用**：如果你要在\
  \ Web 托管公司运行你的网站，可以免费使用 `MySQL`。第 2 章将详细讨论使用 MySQL。\n*   **技术支持广泛**：大量的用户群通过邮件列表提供免费支持。`MySQL`\
  \ 开发人员也参与这些列表。\n*   **安全性**：`MySQL` 灵活的授权系统允许向特定用户或用户组授予某些或全部数据库权限（例如创建数据库或删除数据的权限）。密码是加密的。\n\
  *   **支持大型数据库**：`MySQL` 可以处理多达 5000 万行的数据库。表的默认文件大小限制为 4GB，但如果你的操作系统支持，你可以将其增加到理论上的\
  \ 800 万太字节 (TB)。\n*   **可定制性**：开源 `GPL` 许可证允许程序员修改 `MySQL` 软件以适应他们特定的环境。\n\n## MySQL\
  \ 如何工作\n\n\n\n\n\n# PHP 与 MySQL 简介\n\nMySQL 软件由 MySQL 服务器、若干个辅助管理 MySQL 数据库的实用程序，以及\
  \ MySQL 服务器所需的某些支持软件组成（你不需要了解这些）。\n\n系统的核心是 MySQL 服务器。\n\n## MySQL 服务器\n\nMySQL\
  \ 服务器是数据库的管理器。它处理所有的数据库指令。例如，如果你想创建一个新数据库，你会向 MySQL 服务器发送一条消息，说“创建一个新数据库并命名为……”。然后\
  \ MySQL 服务器会在其目录中创建一个子目录，为新子目录命名，并以所需的格式放入必要的文件。同样，为了向该数据库添加数据，你会向 MySQL 服务器发送一条消息，提供这些数据并告诉它你想将数据放在哪里。\n\
  \n## 与 MySQL 服务器通信\n\n与数据库的所有交互都是通过向 MySQL 服务器传递消息完成的。你有多种方式向 MySQL 服务器发送消息，但本书侧重于使用\
  \ PHP 发送消息。PHP 软件具有特定的语句，用它们向 MySQL 服务器发送指令。MySQL 服务器必须能够理解你发送给它的指令。你通过 `SQL`（结构化查询语言）进行通信，这是一种许多关系型数据库管理系统（RDBMS）都能理解的标准语言。MySQL\
  \ 服务器理解 `SQL`。PHP 并不理解 `SQL`，但它与 MySQL 服务器建立连接并发送 `SQL` 消息。MySQL 服务器解释消息并返回一个状态，说明它执行了什么（或者在无法理解或遵循指令时报告错误）。\n\
  \n书中还讨论了设计用于与数据库交互的软件。你可以在自己的计算机上使用名为 `phpMyAdmin` 的软件来与数据库通信。`phpMyAdmin` 几乎在所有的\
  \ Web 托管主机上可用。\n\nPHP 是一种专门设计用于 Web 端创建动态的脚本语言。PHP 拥有许多让 Web 设计和编程变得简单的丰富特性，已应用于超过\
  \ 2000 万个域名（根据 `www.php.net/usage` 的调查）。它的流行程度持续增长，说明它很好地履行了它的功能。PHP 代表 `HyperText\
  \ Preprocessor`（超文本预处理器）。在由一个名为 Rasmus Lerdorf 的人进行的早期开发阶段，它被称为 `Personal Home Page`（个人主页）。当开发成功能完整的语言后，名称被更改以符合其扩展的功能。\n\
  \nPHP 语言的语法与 C 语言的语法相似，因此如果你有 C 语言经验，你会习惯 PHP。PHP 实际上比 C 更简单，因为它没有使用 C 语言中一些较复杂的概念。PHP\
  \ 设计用于编写网站，不需要 C 语言所需的能力。PHP 在与数据库交互的能力方面特别强大。它几乎支持你听过的每一个数据库（以及一些你没听过的）。PHP 处理连接数据库并与其通信的过程。你不需要了解连接数据库或与其交换消息的技术细节。你只需要告诉\
  \ PHP 数据库的名称和它的所在位置，PHP 就会处理这些细节。它连接到数据库，将你的指令传递给数据库，并将数据库的响应返回给你。PHP 提供技术支持。你可以加入\
  \ PHP 网站（`www.php.net`）提供的多个邮件讨论列表之一。此外，在 `http://news.php.net` 提供了讨论列表的 Web 接口，你可以在那里浏览或搜索消息。\n\
  \n## PHP 的优势\n\nPHP 的流行因其许多优势而正在迅速增长：\n\n-   **它很快。** 因为它嵌入在 HTML 代码中，所以响应时间很短。\n\
  -   **它很便宜——实际上是免费的。** PHP 证明了世界上真的有免费午餐，而且你得到的比你付出的更多。\n-   **它易于使用。** PHP 包含了许多创建\
  \ Web 页面所需的特殊特性和函数。PHP 语言设计为可以于包含在 HTML 文件中。\n-   **它可以在许多操作系统上运行。** 它运行在各种操作系统上——Windows、Linux、Mac\
  \ OS 以及大多数 Unix 变体。\n-   **它在几乎所有 Web 主机上可用。** 如果你在 Web 主机上发布网站，你会发现几乎所有的主机上都安装了\
  \ PHP。\n-   **技术支持随处可见。** 大量用户通过邮件讨论列表提供免费支持。\n-   **它是安全的。** 用户看不到 PHP 代码。\n- \
  \  **它是为支持数据库而设计的。** PHP 包含了与特定数据库交互的功能。它让你免于了解与数据库通信的技术细节。\n-   **它是可定制的。** 开源许可允许程序员修改\
  \ PHP 软件，以适应自己的特定环境。\n\n## PHP 如何工作\n\nPHP 在 Web 页面中使用是一种嵌入式脚本语言。这意味着 PHP 代码嵌入在\
  \ HTML 代码中。你使用 HTML 标签来包裹嵌入在 HTML 文件中的 PHP 语言——就像使用其他 HTML 标签一样。你创建和编辑包含 PHP 的 Web\
  \ 页面的方式与创建和编辑普通 HTML 页面的方式相同。\n\nPHP 软件与 Web 服务器协作。Web 服务器是向世界交付 Web 页面的软件。当你向浏览器中输入\
  \ URL 时，你正在向该 URL 的 Web 服务器发送消息，请求它发送 HTML 文件。Web 服务器通过发送请求的文件做出响应。你的浏览器读取 HTML\
  \ 文件并显示 Web 页面。当你点击 Web 页面上的链接时，也会请求 Web 服务器发送文件。此外，当你点击提交表单时，Web 服务器会处理文件。\n\n\
  安装 PHP 后，Web 服务器被配置为期望某些扩展名包含 PHP 语言语句。扩展名通常为 `.php` 或 `.phtml`，可以使用任何扩展名。当 Web\
  \ 服务器收到对指定扩展名文件的请求时，它会原样发送 HTML 语句，但 PHP 语句在发送给请求者之前会被 PHP 软件处理。\n\n当 PHP 语言语句被处理时，只有输出会被\
  \ Web 服务器发送到浏览器。PHP 语言语句不会包含在发送到浏览器的输出中，因此 PHP 代码是安全透明的。例如，在这个简单的 PHP 语句中：\n\n```php\n\
  <?php echo \"<p>Hello World</p>\"; ?>\n```\n\n`<?php` 是 PHP 的起始标签，`?>` 是结束标签。`echo`\
  \ 是一个 PHP 指令，告诉 PHP 输出后续的文本。PHP 软件处理 PHP 语句并输出：\n\n\n\n\n\n<p>Hello World</p>\n\n\
  这是一个标准的 HTML 语句。该 HTML 语句传递给用户的浏览器。浏览器将该语句解释为 HTML 代码，并显示一个包含段落——Hello World 的网页。PHP\
  \ 语句不会传递给浏览器，因此用户永远看不到任何 PHP 语句。\n\nPHP 和 Web 服务器必须紧密配合。\n\nPHP 并没有集成到所有 Web 服务器中，但与许多流行的\
  \ Web 服务器兼容。PHP 是作为 Apache 软件基金的项目开发的——因此它与 Apache 配合得最好。PHP 还可以与 Microsoft IIS/PWS、iPlanet（原\
  \ Netscape Enterprise Server）等配合。\n\n尽管 PHP 支持多个 Web 服务器，但它与 Apache 配合得最好。\n\n如果你可以选择或影响组织内使用的\
  \ Web 服务器，请选择 Apache。Apache 本身就是一个很好的选择。它是免费、开源、稳定且受欢迎的。根据 `www.netcraft.com` 的\
  \ Web 服务器调查，它目前驱动了超过 60% 的所有 网站。它运行在 Windows、Linux、Mac OS 以及大多数版本的 Unix 上。\n\n#\
  \ MySQL 和 PHP，绝妙搭档\n\nMySQL 和 PHP 经常被一起使用。它们通常被称为 `dynamic duo.`。MySQL 提供数据库部分，而\
  \ PHP 为你的 Web 数据库应用程序提供应用程序部分。\n\n 第一部分：使用 PHP 和 MySQL 开发 Web 数据库应用程序\n\n### 这种关系的优势\n\
  \nMySQL 和 PHP 组合具有多个优势：\n\n- **它们是免费的。** 在性价比方面，免费是无法比拟的。\n- **它们面向 Web。** 两者都是专门为在网站中使用而设计的。两者都有一组专注于构建动态网站的功能。\n\
  - **它们易于使用。** 两者的设计目标都是为了快速建立网站。\n- **它们很快。** 两者在设计时都将速度作为主要目标。它们共同提供了向用户交付动态网页的最快方式之一。\n\
  - **它们之间通信良好。** PHP 具有与 MySQL 通信的内置功能。你不需要了解技术细节；只需交给 PHP 即可。\n\n### MySQL 和 PHP\
  \ 如何协同工作\n\nPHP 提供 Web 数据库应用程序的应用程序部分，而 MySQL 提供数据库部分。你使用 PHP 语言编写执行应用程序任务的程序。PHP\
  \ 可以用于简单任务（如显示网页），也可以用于复杂任务（如接受并验证用户在 HTML 表单中输入的数据）。你的应用程序必须执行的任务之一是将数据移入和移出数据库——在编写移动数据进出\
  \ MySQL 数据库的程序时，PHP 有置置功能可以使用。\n\nPHP 语句通过 PHP 标签嵌入到你的 HTML 文件中。当应用程序执行的任务需要存储或检索数据时，你会使用专门用于与\
  \ MySQL 数据库交互的 PHP 语句。\n\n你使用一个 PHP 语句连接到正确的数据库，告诉 PHP 数据库的位置、名称以及连接它所需的密码。数据库不需要与你的网站在同一台机器上；PHP\
  \ 可以跨网络与数据库通信。你使用另一个 PHP 语句向 MySQL 发送 SQL 消息，为 MySQL 执行你想完成的任务提供指令。MySQL 返回一个状态消息，显示它是否成功执行了任务。如果出现问题，它会返回错误消息。\n\
  \n# 第一章：PHP 和 MySQL 简介\n\n作为一种 RDBMS，MySQL 可以存储数据。作为一种脚本语言，PHP 可以执行操作。PHP 的当前版本是\
  \ 5。一些现有的应用程序仍在运行 4，但由于你正在构建自己的第一个应用程序，你应该使用 PHP 5。\n\nPHP 6 将即将发布。也许在你阅读这本书时，它已经发布了。当\
  \ PHP 从版本 5 变为版本 6 时，将发生以下重要变化：\n\n- `register_globals` 将不再存在。\n- `magic_quotes`\
  \ 将不再存在。\n- `HTTP_POST_VARS` 将不再存在。这些数组在 PHP 4 中很常用。\n\n如果你需要将在 PHP 4 或 5 下运行的脚本转换为在\
  \ PHP 6 下运行，你可能需要根据上述更改对脚本进行修改，以便脚本在 PHP 6 下正常运行。我在书中适用的地方解释了这些变化。\n\n## 跟进 PHP\n\
  \nPHP 和 MySQL 是开源的。PHP 变化频繁，而不是一年一次。当发现严重问题时，就会发布新版本。你从公告列表收到的邮件包含了你需要的信息。所以，现在趁忘记之前，快去\
  \ PHP 和 MySQL 网站并在 `www.php.net/mailing-lists` 和 `lists.mysql.com` 订阅一两个列表。\n\n\
  ### PHP 版本\n\nPHP 的当前版本是 5。一些现有的应用程序仍在运行 4，但由于你正在构建自己的第一个应用程序，你应该使用 PHP 5。\n\n###\
  \ MySQL 版本\n\n截至本文编写，MySQL 5.1 是当前版本。MySQL 5.0 也可用。书中的示例和脚本在两个版本下运行效果都一样。5.1 的某些高级功能在运行\
  \ 5.0 的网站上可能不可用，但书中没有讨论这些高级功能。\n\nMySQL 6 也可以在 MySQL 网站下载。然而，在本文编写时，版本 6.0 是一个 alpha\
  \ 版本，不适合工作中的网站或初级开发者。\n\n你可能会偶尔发现运行 MySQL 4.3.1 的网站。书中的示例和脚本在这些网站上也可以正常执行。使用 MySQL\
  \ 4.3.0 或早期版本运行网站是不明智的。\n\n\n\n\n\n\n# 通过公司网站和 Web 托管公司访问 PHP 和 MySQL\n\n- 从零开始构建自己的网站\n\
  - 测试 PHP 和 MySQL\n\n既然你已经决定使用 PHP 和 MySQL 来构建你的交互式网站，你就可以开始构建该网站了。你的首要任务是设置用于构建网站的环境。本章将描述如何设置网站环境，并提供构建\
  \ Web 数据库应用程序所需的所有工具。\n\n## 网站的剖析\n\n由于你很可能以前创建过简单的网站，所以你知道什么是网站。网站是文本文件的集合，其中包含了浏览器读取并显示网页的\
  \ HTML 代码。存储这些文件的计算机空间就是你网站的物理位置。\n\nWeb 用户经常谈论“网站访问者”，但 `visitors` 这个词在技术上是有误导性的。访问者并没有真正“访问”网站。当一个人在\
  \ Web 浏览器中输入网站的地址（称为 `URL` 或统一资源定位符）时，浏览器会通过互联网发送请求，要求查看该地址的网页。网站上的软件被称为 Web 服务器，它接收请求并通过发送所请求的网页来做出响应。浏览器接收到网页文件并在浏览器窗口中显示网页。\n\
  \n为了让你的网站对公众开放，你把包含 HTML 代码的文本文件放在用户可以访问的网站上。Web 数据库应用程序也是类似的。区别在于这些文件不仅包含 HTML\
  \ 代码，还包含 `PHP` 代码。\n\n为了提供讨论的动态 Web 数据库应用程序，你的网站必须具备以下软件：\n\n- **Web 服务器：** 将你的网页推向世界的软件。\n\
  - **MySQL：** 用于为你的 Web 数据库应用程序存储信息的 RDBMS（关系型数据库管理系统）。\n- **PHP：** 你将用来编写程序为你的网站提供动态功能的脚本语言。\n\
  \n我将在第 1 章中详细介绍这三个工具。\n\n# 构建网站\n\n正如上一节所述，网站是放置在用户可以访问的计算机上的文本文件集合。将网站文件放在公众可以访问的地方被称为“**发布**（`publishing`）网站。然而，这是构建网站的最后一步，而不是第一步。你不希望在网站完成（即准备好供公众查看的完美网站）之前就发布它。\n\
  \n为了防止公众看到你尚未完成、且缺陷百出的网站，你需要在一个公众无法访问的地方开发网站。在开发网站期间，你将进行各种测试和故障排除。你需要在私下完成这些工作。\n\
  \n由于你需要在私下构建网站，并推迟到完成且完美后再将其公开，你的工作环境需要两个站点：\n\n- **你的网站（Your Web site）：** 你发布的网站所在地。即公众查看你网站的地方。\n\
  - **你的开发站点（Your development site）：** 你开发网页的地方。\n\n当页面完成后，你再将它们移动到你的网站。你的网站将你的网页发布到世界上。你的开发站点不应该让世界看到你的错误和未完成的网页。你的开发站点需要隐藏在世界之外。在网页完成且完美之前，永远不要发布它们。\n\
  \n你需要决定在哪里发布网站，以及在哪里开发网站。本章接下来的几节将提供做出这些决定所需的信息。\n\n## 第 2 章：设置你的工作环境\n\n### 决定在哪里发布你的网站\n\
  \n你的第一个决定之一就是在哪里发布网站。你需要将它发布在连接到全球网的计算机上。正如之前提到的，计算机还应该提供你所需的工具：Web 服务器、`PHP` 和\
  \ `MySQL`。发布网站的最常见位置有：\n\n- **由 Web 托管公司托管的网站：** 网站位于 Web 托管公司的计算机上。托管公司安装并维护网站软件，并在其计算机上提供空间供你安装网站文件。\n\
  - **公司在其自己的计算机上搭建的网站：** 公司（通常是公司的 `IT` 信息技术部门）安装并管理网站软件。对于本本书而言，你的任务是为网站编程，无论是作为公司员工还是作为承包商。\n\
  - **由你自己搭建的网站：** 你计划自己安装和维护网站软件。这可能是你自己在计算机上从零开始构建的个人网站，也可能是你为客户在客户的计算机上安装的网站。\n\
  \n你很可能会在前两个选项之一上发布网站。对于这些选项，你不需要了解过多网站软件的管理和运行。Web 服务器、`PHP` 和 `MySQL` 已经安装完毕，你访问它们所需的信息由负责网站的公司提供。\n\
  \n第三种选项要求你自己来安装、设置、管理和维护网站软件。与他人为你提供软件的前两个选项相比，这个选项需要更丰富的计算机软件技术知识。然而，该选项的优势在于你拥有更多控制权。你可以按照偏好的设置来配置网站软件。\n\
  \n### 使用 Web 托管公司\n\n`Web 托管公司`（Web hosting company）为你提供建立网站所需的一切，包括计算机空间和所有站点软件。你只需要创建网页文件，并将它们移动到托管公司指定的位置即可。大多数中小型网站都由\
  \ Web 托管公司托管。\n\n无数公司提供网站托管服务。大多数公司收取月费（通常很便宜），有些甚至是免费的。（大多数但并非所有免费站点都要求显示广告。）通常，月费取决于为网站提供的资源。\n\
  \n在寻找托管地时，请确保托管公司提供以下内容：\n\n- **PHP 和 MySQL：** 并非所有公司都提供这些工具。你可能需要为访问 `PHP` 和 `MySQL`\
  \ 付费。\n- **最新版本的 PHP：** 有时提供的 `PHP` 版本并非最新版本。截至本书编写，`PHP 6` 即将发布。\n\n在 `PHP 6` 发布之前，通常有两个版本的\
  \ `PHP` 可用——`PHP 4` 和 `PHP 5`。尽管 `PHP 5` 已发布多年，但许多网站仍在运行 `PHP 4`。`PHP 4` 仍然受到支持，是因为现有的\
  \ `PHP 4` 代码在 `PHP 5` 下并不总是完美运行。许多开发者尚未将代码转换为可在 `PHP 5` 下运行的代码。然而，`PHP 4` 的终结迫在眉睫。`PHP\
  \ 4` 的支持已于 2007 年停止。不再会有 `PHP 4` 的发布，关键的安全修复也已于 2008 年底结束。开发新代码的人没有理由使用 `PHP 4`。\n\
  \n\n\n\n\n寻找提供 `PHP 5` 的 Web 托管公司。一些 Web 主机同时提供 `PHP 4` 和 `PHP 5`，但它们将 `PHP 4` 作为默认设置。你可能需要联系\
  \ Web 托管公司的技术支持，询问如何在你的网站上使用 `PHP 5` 而不是 `PHP 4`。\n\n✓ 较新版本的 `MySQL`：目前推荐的 `MySQL`\
  \ 版本是 `MySQL 5.1`。然而，使用旧版本的 `MySQL` 并不像使用旧版本的 `PHP` 那样成问题。书中的技术适用于旧版本的 `MySQL`。未来，你可能会学习更高级的\
  \ `MySQL` 特性，并可能需要更新版本的 `MySQL`。不过，即使是旧版本也提供了能够构建相当复杂的动态网站的功能集。\n\n# 第 2 章：搭建你的工作环境\n\
  \n✓ 修改 `PHP` 设置的能力：更改 `PHP` 设置会影响 `PHP` 的某些行为。不同的 Web 主机提供给客户客户的 `PHP` 设置访问权限各异。对\
  \ `PHP` 设置的权限越高，你对网站功能的控制力就越大。\n\n一个名为 `php.ini` 的文本文件包含了 `PHP` 设置。你的 Web 主机不会允许你访问主机系统的通用\
  \ `php.ini` 文件，但某些主机允许你使用本地的 `php.ini` 文件，该文件仅影响你的网站。这是一个非常值得去寻找的功能，因为它是更改设置的一种简单方法。\n\
  \n更改 `PHP` 设置的另一种方法是使用 `.htaccess` 文件。这是由 Apache Web 服务器读取的文件，其中可以包含一些 `PHP` 设置。许多\
  \ Web 主机允许你在网站上存储一个 `.htaccess` 文件，该文件仅更改你网站的设置。\n\n当你选择 Web 主机时，请确保托管公司允许你使用本地的\
  \ `php.ini` 文件或 `.htaccess` 文件。能够更改网站的 `PHP` 设置是非常重要的。\n\n✓ `phpMyAdmin`：为了创建和使用\
  \ `MySQL` 数据库，你需要特定的软件。任何提供 `MySQL` 的 Web 主机都必须提供与 `MySQL` 数据库通信的软件。大多数 Web 主机都提供\
  \ `phpMyAdmin`，这是一个用 `PHP` 编写并专门为管理 `MySQL` 数据库设计的 Web 应用程序。其他软件也可以，但本书假设你有访问 `phpMyAdmin`\
  \ 的权限。\n\n选择 Web 托管公司时的其他考虑因素包括：\n\n✓ 可靠性：你需要一个可以依赖的 Web 托管公司——一个不会明天破产消失、不会运行在用口香胶和铁丝维持的旧电脑上、停机时间多于运行时间的公司。\n\
  \n✓ 速度：下载缓慢的网页是一个问题，因为用户会变得不耐烦并去他处。页面缓慢可能是因为 Web 托管公司启动资金不足且缺乏良好设备，或者由于公司太成功，导致其设备无法应对新客户。无论如何，交付网页过慢的\
  \ Web 托管公司都是不可接受的。\n\n✓ 技术支持：某些 Web 托管公司没有人回答问题或排排除故障。技术支持通常仅通过电子邮件提供，如果响应时间短，这种方式非常好。有时你可以通过拨打技术支持电话来测试公司的支持质量，或者通过发送电子邮件来测试响应时间。\n\
  \n✓ 域名：每个网站都有一个域名，Web 浏览器通过它在网上找到该网站。每个域名每年支付小额费用进行注册，以确保只有一个网站可以使用它。一些 Web 托管公司允许你使用独立于托管公司注册的域名，一些协助你注册和使用新域名，而有些则要求你使用他们的域名。例如，假设你的名字是\
  \ Lola Designer，你希望网站命名为 `LolaDesigner`。一些 Web 托管公司允许你的网站为 `LolaDesigner.com`，但有些要求你的网站命名为\
  \ `LolaDesigner.webhostingcompanyname.com`、`webhostingcompanyname.com/~Lola Designer`\
  \ 或类似的名称。通常情况下，使用自己的域名会让你的网站看起来更专业。\n\n✓ 备份：`Backups` 是你的网页文件和数据库的副本，以防文件或数据库丢失或损坏。你想要确保公司对你的应用程序进行定期、频繁的备份。你还想知道在出现问题后，需要多长时间才能通过备份将你的网站恢复到运行状态。\n\
  \n✓ 功能：根据你网站的目的选择功能。通常，托管公司会将功能组合成不同的方案——功能越多，成本越高。需要考虑的功能包括：\n\n- 磁盘空间：你的网站需要多少\
  \ MB 或 GB 的磁盘空间？媒体文件（如图形或音乐文件）可能会很大。\n- 数据传输：某些托管公司会收取向用户发送网页的费用。如果你预计网站会有大量流量，这项成本应该在考虑范围内。\n\
  - 电子邮件地址：大多数托管公司都会为你的网站提供一个或多个电子邮件地址。例如，如果你的网站是 `LolaDesigner.com`，你可以允许用户向 `me@LolaDesigner.com`\
  \ 发送电子邮件。\n- 软件：托管公司提供各种 Web 开发软件访问。`PHP` 和 `MySQL` 是我在书中讨论的软件。某些托管公司可能提供其他数据库，有些可能提供其他开发工具，如\
  \ FrontPage 扩展、购物车软件和信用卡验证。\n- 统计数据：通常你可以获得有关网站流量的统计数据，如用户数、访问时间、按页面等。\n\n## 域名\n\
  \n每个网站都需要一个域名，Web 浏览器通过它在网上找到该网站。每个域名每年支付小额费用进行注册，以确保只有一个网站可以使用。首先，你测试潜在域名以确定其是否可用。定位网站的唯一地址是\
  \ `IP 地址`，它由四个 0 到 255 之间的数字组成，并用点分隔——例如 `172.17.204.2` 或 `192.163.2.33`。\n\n\n\n\
  \n这些位置使用相同的域名。任何人通过 `allwhois.com` 和 `BetterWhois.com` 都可以注册任何域名，只要通过 `www.betterwhois.com`。\n\
  \n从零开始研究 Web 托管公司是非常困难的\n\n在 `Google.com` 上搜索 `“Web hosting”` 会得到近 4 亿条搜索结果。研究 Web\
  \ 托管公司的最好方法是向具有这些公司运营经验的人寻求建议。使用过托管公司的人可以在服务缓慢或计算机经常宕机时向你发出警告。当你从满意的客户那里收集了几个 Web\
  \ 托管公司的名称后，你可以将列表缩小到最符合你需求且成本效益最高的一个。\n\n# 第一部分：使用 PHP 和 MySQL 开发 Web 数据库应用程序\n\n\
  以下是提供所需工具的 Web 托管主机列表，包括 `PHP 5`、`MySQL`、`phpMyAdmin`、`.htaccess` 文件以及良好的技术支持：\n\
  \n* ✓ Host Gator, `www.hostgator.com`\n* ✓ HostMonster, `www.hostmonster.com`\n\
  * ✓ WebHostingBuzz (WHB), `www.webhostingbuzz.com`\n* ✓ midPhase, `www.midphase.com`\n\
  * ✓ BlueHost, `www.bluehost.com`\n\n请记住，此列表完全基于托管公司的网站以及在 Web 托管主机评测网站上的评论，而不是基于个人经验。\n\
  \n### 使用公司网站\n\n当网站由公司运营时，你完全不需要理解 Web 网站软件的安装和管理。公司负责网站的运行，因此这项负担就从你的肩上卸下来了。在大多数情况下，网站已经存在，你的工作是对比现有的网站进行添加内容、修改或重新设计。在少数情况下，公司可能正在安装其第一个网站，而你的工作是设计该网站。无论哪种情况，你的责任都是编写并安装用于网站的\
  \ HTML 文件。\n\n你通过公司的 IT 部门访问网站 软件。该部门的名称在不同公司可能有所不同，但其功能是相同的：IT 负责保持公司的计算机运行并及时更新。\n\
  \n如果公司的网站上没有提供 `PHP` 或 `MySQL` 或两者兼备，IT 需要安装它们并使其供你使用。`PHP` 和 `MySQL` 有许多选项，但 IT\
  \ 可能并不了解最佳选项——而且设置选项的方式可能不符合你的需求。如果你需要更改 `PHP` 或 `MySQL` 选项，你需要请求 IT 进行更改；你无法自行更改。例如，`PHP`\
  \ 必须在启用 `MySQL` 支持的情况下安装，因此如果 `PHP` 无法与 `MySQL` 正常通信，IT 可能需要重新安装启用 `MySQL` 支持的 `PHP`。\n\
  \n随着需求的产生，你会经常与 IT 人人员互动。例如，你可能需要更改选项，可能需要信息帮助你解释错误信息，或者你可能需要报告网站软件的问题。因此，与 IT 人人员建立良好关系会让你的生活轻松得多。经常给他们带一些好吃的饼干和甜甜。\n\
  \n# 第二章：设置你的工作环境\n\n## 设置你自己的服务器\n\n如果你正从零开始设置自己的 Web 服务器来发布自己的网站，你需要非常熟悉 Web 网站软件。你必须对硬件和软件做出若干决定。你必须自己安装\
  \ Web 服务器、`PHP` 和 `MySQL`，并由自己维护、管理和更新系统。选择这条路线而不是使用他人提供的网站，需要更多的工作和知识。除非你对 Web、法律限制、安全考量以及其他相关问题非常了解，否则不要尝试。这样做的好处是你对\
  \ Web 开发环境拥有完全的控制权。\n\n以下是通用步骤：\n\n1. 设置你的计算机。\n\n2. 安装 Web 服务器。\n\n3. 安装 MySQL。\n\
  \n4. 安装 PHP。\n\n\n\n\n\n在你的公司网站上，IT 部门需要设置一个不对公众开放的独立位置，供你开发 Web 页面文件。你需要与 IT 部门沟通，以便为你设置这样一个位置，并允许在该位置与你的网站位置之间进行文件传输。\n\
  \n# 设置你的网站\n\n在你决定了在哪里发布你的网站之后，下一步是设置你的网站。接下来的章节将告诉你是需要了解的内容。\n\n### 使用 Web 托管公司\n\
  \n你在 Web 托管公司的网站上设置一个账户。大多数公司在其网站上提供多种类型的账户，资源各不相同，价格也各异。你通过在网站上填写表单并提供信用卡号来获取账户。Web\
  \ 托管商会向你提供使用新账户所需的信息，通常是通过发送电子邮件给你的。\n\n如果你在获取账户的过程中遇到困难，应该可以联系该 Web 托管公司的技术支持。有些公司提供电话号码，有些提供电子邮件地址，有些则通过即时消息提供支持。有些公司提供这三者。如果他们无法回答你的问题，或者回答需要很长时间，也许这并不是最适合你的\
  \ Web 托管商。\n\n当你拥有了新账户后，URL 可能需要一或两天时间才能连接到你的网站。当 URL 指向你的网站时，你的网站就公开了。你放在那里的任何内容都可以被全世界看到。\n\
  \n你的新账户提供了一个用于管理账户的控制面板。许多 Web 托管商提供名为 `cPanel` 的控制面板。其他则提供其他的控制面板，例如 Web 托管商特定的控制面板，但这些控制面板具有类似的功能，例如设置电子邮件账户。你使用控制面板访问允许创建新的\
  \ `MySQL` 数据库以及添加/更改 `MySQL` 账户和密码的软件。你还可以访问 `phpMyAdmin` 来管理你的 `MySQL` 数据库。MySQL\
  \ 账户和数据库的管理将在第 4 章和第 5 章中详细讨论。\n\n第一部分：使用 PHP 和 MySQL 开发 Web 数据库应用程序\n\n如前所述，存储在你\
  \ 托管账户中的 Web 页面文件可以被世界看到。因此，你希望在开发站点上开发并完善文件，然后将它们移动到此网站。大多数开发者首选方案是使用本地计算机上的软件来编辑和上传你的网站文件。在你的本地计算机上，你可以安装协助你组织和传输文件的软件。我将在“设置你的开发环境”章节中讨论这些软件。\n\
  \n如果由于某些原因，你无法从开发环境上传文件，你可以从 Web 托管商提供的控制面板上传文件。\n\n例如，要使用 `cPanel` 上传文件，找到标记为 `Files`\
  \ 的部分并点击 `File Manager` 图标。打开的页面允许你管理文件，包括上传和下载文件以及备份你的文件。如果你点击上传链接，可以浏览到本地计算机上你想要上传的文件。\n\
  \n文件管理器页面还提供让你直接在网站上编辑文件的选项。这通常不是一个好主意。对于你的工作环境来说，最有用的结构是由两个完整的网站——一个是开发站点，另一个是网站。你在开发站点上开发文件，并只将完整的文件传输到你的网站。因此，你拥有两个完整的网站，如果你的网站出现问题，你的本地开发站点可以作为备份。由于这个原因，你希望你的本地站点看起来和你的网站完全一样，包括相同的子目录和文件。因此，如果发生了神秘的灾难导致你的网站文件消失，你可以快速上传你的开发站点，并在几分钟内恢复运行。\n\
  \n### 在公司网站上\n\n当你在公司计算机上设置网站时，你需要与公司 IT 人员合作。设置你的网站并为你提供访问放置网站文件位置的权限由他们负责。\n\n\
  你需要通过他们协调一切。你需要确保他们确切知道你需要什么。\n\n哪些任务可以由独立完成，哪些任务必须由 IT 人员完成，取决于公司的政策。有些公司允许你对网站软件及其设置拥有相当的访问权限，而其他公司则希望你碰任何东西。例如，一家公司可能允许你编辑主\
  \ PHP 配置文件 (`php.ini`)，但另一家公司可能要求你请求设置更改，由 IT 人员来完成。无论你的访问权限级别如何，你都需要与公司 IT 部门紧密合作。\n\
  \n# 第 2 章：设置你的工作环境\n\n### 你需要的信息\n\n无论是在 Web 托管公司设置还是在公司网站上设置，你都需要一些信息来完成工作。当你在\
  \ Web 托管公司注册账户时，托管商需要向你提供使用 Web 软件工具和构建你的动态网站所需的信息。你通常会收到 Web 托管商发送的一封提供所需信息的电子邮件。如果你在公司网站上发布网站，IT\
  \ 部门需要为你提供必要的信息。\n\n务必从托管商处获得以下信息：\n\n- **网站的位置：** 你需要知道将 Web 页面文件放在哪里。Web 托管商或\
  \ IT 部门需要为你提供安装文件的目录名称和位置。此外，你还需要知道如何安装文件——复制、通过 FTP 传输或使用其他方法。如果你使用 Web 托管公司，你需要一个用户\
  \ ID 和密码来安装文件。在你的公司网站上，你可能需要也不需要 ID 和密码。\n- **默认文件名：** 当用户将浏览器指向 URL 时，一个文件会被发送给他们。当\
  \ URL 指向一个目录时，Web 服务器被设置为发送一个特定名称的文件。自动发送的文件是*默认文件*。通常默认文件命名为 `index.htm` 或 `index.html`，但有时使用其他名称，如\
  \ `default.htm`。你需要知道应该给你的默认文件起什么名字。\n- **MySQL 账户：** 对 `MySQL` 数据库的访问通过用户名和密码系统控制。你的托管商会为你设置具有适当权限的\
  \ `MySQL` 账户，并给你 `MySQL` 账户名和密码。（将在第 5 章详细解释 MySQL 账户。）\n- **MySQL 数据库的位置：** 当从\
  \ PHP 脚本访问 `MySQL` 数据库时，你需要指定 `MySQL` 服务器的位置。如果它与 PHP 在同一台服务器上，你可以指定 `localhost`。然而，`MySQL`\
  \ 数据库不需要位于与网站相同的计算机上。如果 `MySQL` 数据库位于网站之外的计算机上，你需要知道存放数据库的 `hostname`（例如，`thor.companyname.com`）。\n\
  - **PHP 文件扩展名：** 安装 PHP 时，Web 服务器被指示在具有特定扩展名的文件中预期 PHP 语句。通常使用的扩展名是 `.php` 或 `.phtml`，也可以使用其他扩展名。没有正确扩展名的文件中的\
  \ PHP 语句将不会被处理。询问你的 PHP 程序应该使用什么扩展名。\n\n# 设置开发环境\n\n开发站点是你在将完成的文件上传到网站之前编写和测试 Web\
  \ 文件的地方。你需要在开发环境中编辑并测试文件。\n\n## 自己的计算机\n\n\n\n\n\n开发站点最常见的位置是你自己的本地计算机。你可以在计算机上创建文件，并将它们上传到你的网站。\n\
  \n# 安装 Web 开发软件\n\n为了测试你编写的 `PHP` 程序，你需要在开发站点中安装 `Apache`、`PHP` 和 `MySQL`。你可以通过两种方法之一在你的机器上安装这些软件：\n\
  \n* ✓ **从合体包安装。** 从合体包安装软件是更快、更简单的方法。我更喜欢使用名为 `XAMPP` 的免费包。`XAMPP` 不推荐用于公共访问文件的\
  \ Web 服务器，但它非常适合开发 Web 站点。`XAMPP` 通过一个简单的程序安装 `Apache`、`PHP` 和 `MySQL`。它还会安装 `phpMyAdmin`。`XAMPP`\
  \ 支持 Windows、Mac、Linux 和 Solaris。关于下载和安装 `XAMPP` 的详细说明可以参考附录 A。\n* ✓ **单独安装每个软件包。**\
  \ 你可以单独安装这些软件。这些软件可以免费下载和安装。它们支持包括 Windows 和 Mac 在内的大多数操作系统。`Apache`、`MySQL` 和 `phpMyAdmin`\
  \ 都提供了一个运行即可安装软件的安装程序。`PHP` 也提供了一个安装程序，但我更倾向于从 `Zip` 文件进行安装。\n\n安装软件的说明可以在官方网站上找到，如下：\n\
  \n* *Apache:* `http://httpd.apache.org/docs/2.2/install.`\n* *PHP:* `www.php.net/manual/en/install.php`\n\
  * *MySQL:* `http://dev.mysql.com/doc/refman/5.1/en/installing.html`\n* *phpMyAdmin:*\
  \ `www.phpmyadmin.net`\n\n**第 2 章：搭建你的工作环境**\n\n## 编写文件\n\n除了测试程序的软件外，你还需要用于编写程序的软件。由于\
  \ `PHP` 程序仅仅是文本文件，就像 `HTML` 文件也是文本文件一样，你可以使用你喜欢的文本编辑器（例如 Windows 上的 `WordPad` 或\
  \ `NotePad`）来编写 `PHP` 程序。然而，有些工具提供的功能可以让程序编写变得简单得多。\n\n在编写程序之前，检查一下编程编辑器和集成开发环境（`IDEs`）是值得的。编程编辑器和\
  \ `IDE` 提供的功能可以在开发过程中为你节省大量时间。下载一些演示，尝试这些软件，并选择最适合你的一个。你可以利用节省下的时间去休假。\n\n### 编程编辑器\n\
  \n编程编辑器提供了许多专门用于编写程序的功能。大多数编程编辑器都提供以下功能：\n\n* ✓ **语法高亮：** 编辑器用不同的颜色高亮程序的部分——例如 `HTML`\
  \ 标签、文本字符串、关键字和注释——以便于识别。\n* ✓ **缩进：** 编辑器会自动在括号和花括号内部进行缩进，使程序更易读。\n* ✓ **行号：**\
  \ 编辑器会添加临时行号。这很重要，因为 `PHP` 错误信息会指定遇到错误时的行数。如果需要从文件顶部数第 872 行才能找到 `PHP` 所述的问题所在行，将非常麻烦。\n\
  * ✓ **多文件：** 你可以同时打开多个文件。\n* ✓ **快速插入代码：** 编辑器提供了用于插入代码的按钮，例如 `HTML` 标签或 `PHP` 语句或函数。\n\
  * ✓ **代码库：** 你可以保存自己的代码片段，通过点击按钮将其插入。\n\n互联网上有许多免费或低价的编程编辑器。其中一些流行的编辑器包括：\n\n* ✓\
  \ **Arachnophilia:** `(www.arachnoid.com/arachnophilia)` 这是一个用 `Java` 编写的多平台编辑器。它是免费软件。它面向\
  \ `HTML` 和 页面开发。\n* ✓ **BBEdit:** `(www.barebones.com/products/bbedit/index.shtml)`\
  \ 这是 Mac 上流行的编辑器。`BBEdit` 售价 125.00 美元。\n* ✓ **EditPlus:** `(www.editplus.com)`\
  \ 该编辑器为 Windows 机器设计。它可以高亮 `HTML`、`PHP` 和其他语言。售价 35.00 美元。\n* ✓ **Emacs:** `(www.gnu.org/software/emacs/emacs.html)`\
  \ `Emacs` 支持 Windows、Mac 以及多种版本的 Linux 和 Unix。它是免费的。\n* ✓ **HTML-Kit:** `(www.chami.com/html-kit)`\
  \ 这是一个功能齐全的编辑器。\n* ✓ **TextWrangler:** `(www.barebones.com/products/textwrangler)`\
  \ 该软件支持 Windows。\n\n### 集成开发环境 (IDE)\n\n`IDE` 是一个用于开发的完整工作空间。`IDE` 更强大。以下是 `IDE`\
  \ 的一些功能：\n\n* ✓ **调试：** 内置调试功能。\n* ✓ **预览：** 显示 Web 页面输出。\n* ✓ **测试：** 内置测试功能。\n\
  * ✓ **FTP：** 内置 FTP 功能。\n* ✓ **项目管理：** 将程序组织成项目。\n* ✓ **备份：** 对你的网站进行自动备份。\n\n以下是一些流行的\
  \ `IDE`：\n\n* ✓ **Dreamweaver:** `(www.adobe.com/products/dreamweaver)` 该 IDE 支持\
  \ Windows。它提供了视觉化布局工具，你可以通过拖动元素和点击按钮来创建 Web 页面。它也支持 `PHP`。\n* ✓ **Komodo:** `(www.activestate.com/komodo)`\
  \ `Komodo` 支持 Linux 和 Windows。它支持 `HTML`、`JavaScript`、`CSS`、`XML` 以及 `PHP`。\n* ✓\
  \ **PHPEdit:** `(www.phpedit.com)` `PHPEdit` 支持 Windows。\n\n## 上传你的文件到你的网站\n\n当你的\
  \ Web 页面文件完成并准备好发布时，你需要将它们传输到你的网站。在大多数情况下，你通过 `FTP` 从本地机器上传它们。你可以在计算机上安装 `FTP` 软件，让文件上传过程变得简单。\n\
  \n如果你像我之前建议的那样使用 `IDE`，那么你有一个内置功能。例如，如果你使用 `Dreamweaver`，当你第一次设置 `Dreamweaver` 项目时，你会设置一个连接到网站的远程站点。每你想上传或下载文件时，只需选中它并点击\
  \ `Dreamweaver` 按钮即可。此外，`Dreamweaver` 会跟踪版本，让你知道是否正准备用旧的文件替换较新的文件。\n\n某些编程编辑器也内置了\
  \ `FTP` 功能。例如，`HTML-Kit` 内置了 `FTP` 功能，让上传文件变得简单。\n\n你可以使用的用于传输文件的软件包之一是 `Filezilla`。\n\
  \n\n\n\n(filezilla-project.org)。这是一段你可以下载并安装的免费软件。如果你使用 XAMPP 安装你的 Web 软件，Filezilla\
  \ 会同时自动安装。其他一些 FTP 软件包括：\n\n✓ **FTP Voyager:** (www.ftpvoyager.com) 一款适用于 Windows\
  \ 的强大且安全的 FTP 客户端。它具有许多功能，包括拖放式文件传输。价格为 $39.95 美。\n\n✓ **WS_FTP:** (www.ipswitchft.com)\
  \ 一款适用于 Windows 的全功能 FTP 客户端。价格为 $54.95 美。这家公司还销售 Fetch，这是一款适用于 Mac 的 FTP 客户端。\n\
  \n✓ **SmartFTP:** (www.smartftp.com) 一款流行的 FTP 客户端，具有许多功能，特别是倾向于与 Web 托管公司通信的功能。家庭版价格为\
  \ $36.95 美，专业版价格为 $49.95 美。\n\n# 第一部分：使用 PHP 和 MySQL 开发 Web 数据库应用程序\n\n### Web 托管公司\n\
  \n如果你有必须在你的 Web 托管账户上进行开发的原因，那么你需要一个私位置存放开发文件。你可以从 Web 托管主机获取第二个账户用于开发，并在完成后将文件传输到你的\
  \ Web 站点。或者，你可以在你的 Web 站点上创建一个仅用于开发的子目录，完成后将文件传输到主 Web 站点目录。\n\n无论你采用哪种方法，你都需要设置一些东西。你需要确保开发区域是私有的，不对公众开放。你，还需要确保开发区域不被搜索引擎索引。如果搜索引擎在两个不同的位置运行相同的\
  \ Web 页面，这会大幅降低你的搜索引擎搜索结果。\n\n### 保持私有性\n\n你需要在你的 Web 托管账户中设置一个目录作为你的开发站点。你可以通过\
  \ `.htaccess` 文件将该目录设为私有，不允许公共访问。要阻止对开发目录的访问：**1. 在你想要保护的目录中创建一个名为 `.htaccess` 的文件。**\n\
  \n也就是说，如果你创建了一个名为 `devel` 的子目录作为你的开发站点，请在 `devel` 目录内部创建 `.htaccess` 文件。是的，文件名开头有一个点。\n\
  \n**2. 在 `.htaccess` 文件中添加一行内容。**\n\n该行的内容如下：\n\n```\nDeny from all\n```\n\n`.htaccess`\
  \ 文件中的 `Deny` 指令可以防止任何人访问 `.htaccess` 文件所在目录中的任何文件。\n\n### 排除搜索引擎\n\n你可以通过 `robots.txt`\
  \ 文件指示搜索引擎不要索引某个目录中的任何文件。创建此文件并包含以下内容：\n\n```\n###############################\n\
  #\n# 此网站的 robots.txt 文件\n#\n# 使用通配符 * 匹配所有机器人\n#\nUser-agent: *\n# 列出机器人不允许被索引的文件夹\n\
  Disallow: /\n#\n# 第 2 章：设置你的工作环境\n# 列出机器人不允许被索引的特定文件\n#\nDisallow: /tutorials/meta_tags.html\n\
  Disallow: /tutorials/custom_error_page.html\n#\n# robots.txt 文件结束\n#\n###############################\n\
  ```\n\n以以井号（`#`）开头的行是注释，会被忽略。\n\n请注意，只有两行不是注释。第一行是 `User-agent: *`。此行指定所有的搜索引擎都应该遵循此文件中的指示。第二行是\
  \ `Disallow: /`。此行指定搜索引擎应该忽略此目录中的所有文件，包括子目录。\n\n### 公司电脑\n\n如果你的开发站点位于公司电脑上，你的公司\
  \ IT 部门负责设置站点并将其私有化。你需要向你的 IT 部门沟通你的需求。你需要能够将完成的文件从开发站点传输到 Web 站点。\n\n你的 IT 部门应该告诉你是如何操作的。此外，你还需要能够将完成的文件从开发站点传输到\
  \ Web 站点。（注：此处原文似乎有重复逻辑，已按要求翻译）\n\n（）\n\n如果你有必须在你的 Web 托管账户上进行开发的原因，你需要一个私位置存放开发文件。你可以从\
  \ Web 托管主机获取第二个账户用于开发，并在完成后将文件传输到你的 Web 站点。或者，你可以在你的 Web 站点上创建一个仅用于开发的子目录，完成后将文件传输到主\
  \ Web 站点目录。\n\n无论你采用哪种方法，你都需要设置一些东西。你需要确保开发区域是私有的，不对公众开放。你，还需要确保确保开发区域不被搜索引擎索引。如果搜索引擎在两个不同的位置运行相同的\
  \ Web 页面，这会大幅降低你的搜索引擎搜索结果。\n\n### 保持私有性\n\n你需需要在你的 Web 托管账户中设置一个目录作为你的开发站点。你可以通过\
  \ `.htaccess` 文件将该目录设为私有，不允许公共访问。要阻止对开发目录的访问：**1. 在你想要保护的目录中创建一个名为 `.htaccess` 的文件。**\n\
  \n也就是说，如果你创建了一个名为 `devel` 的子目录作为你的开发站点，请在 `devel` 目录内部创建 `.htaccess` 文件。是的，文件名开头有一个点。\n\
  \n**2. 在 `.htaccess` 文件中添加一行内容。**\n\n该行的内容如下：\n\n```\nDeny from all\n```\n\n`.htaccess`\
  \ 文件中的 `Deny` 指令可以防止任何人访问 `.htaccess` 文件所在目录中的任何文件。\n\n### 排除搜索引擎\n\n你可以通过 `robots.txt`\
  \ 文件指示搜索引擎不要索引某个目录中的任何文件。创建此文件并包含以下内容：\n\n```\n###############################\n\
  #\n# 此网站的 robots.txt 文件\n#\n# 使用通配符 * 匹配所有机器人\n#\nUser-agent: *\n# 列出机器人不允许被索引的文件夹\n\
  Disallow: /\n#\n# 第 2 章：设置你的工作环境\n# 列出机器人不允许被索引的特定文件\n#\nDisallow: /tutorials/meta_tags.html\n\
  Disallow: /tutorials/custom_error_page.html\n#\n# robots.txt 文件结束\n#\n###############################\n\
  ```\n\n以以井号（`#`）开头的行是注释，会被忽略。\n\n请注意，只有两行不是注释。第一行是 `User-agent: *`。此行指定所有的搜索引擎都应该遵循此文件中的指示。第二行是\
  \ `Disallow: /`。此行指定搜索引擎应该忽略此目录中的所有文件，包括子目录。\n\n### 公司电脑\n\n如果你的开发站点位于公司电脑上，你的公司\
