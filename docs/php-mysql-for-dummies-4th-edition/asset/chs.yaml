  \ > 0)\n{\n/* 显示电话格式错误的消息 */\necho “<p><b>您的电话号码格式不正确。</b></p>”;\n}\n/* 重新显示表单 */\n\
  echo “<hr><h3>请输入以下信息：</h3><form action='$_SERVER[PHP_SELF]' method='post>\";\n\
