  \n\n\n\n\n在某些情况下，你可能只想替换数据库的一部分。例如，上一节中创建的备份文件包含两个表：`Member` 和 `Login`。如果只有 `Login`\
  \ 表损坏了，你只想替换 `Login` 表。\n\n现在，你的数据库已经恢复，并包含了创建副本时的时的所有数据。如果数据在创建副本后发生了变化，则这些更改将会丢失。例如，如果在制作备份副本后增加了更多数据，这些新数据将不会被恢复。如果你知道所做的哪些更改，可以在恢复的数据库中手动进行这些更改。\n\
  \n你可以通过编辑备份文件来控制替换哪些数据。由于备份是一个文本文件，你可以使用任何文本编辑器对其进行编辑。删除任何你不想执行的 SQL 查询。例如，如果你不想恢复\
  \ `Member` 表而只想恢复 `Login` 表，请从文件中删除所有 `CREATE` 或 `INSERT INTO` `Member` 表的 SQL 查询语句。\n\
  \n# 第二部分：MySQL 数据库\n\n![Image 21](img/index-151_1.png)\n\n# 第一部分：PHP\n\n在本部分 . .\
  \ .\n\n在第三部分中，你将了解到如何使用 PHP 来开发你的 Web 数据库应用程序。以下是描述的一些主题：\n\n* 在 HTML 文件中添加 PHP\n\
  * 有助于构建动态 Web 数据库应用程序的 PHP 特性\n* 使用 PHP 特\n* 使用表单收集用户信息\n* 在 Web 页面中显示数据库信息\n* 在数据库中存储数据\n\
  * 将信息从一个 Web 页面移动到另一个页面\n\n你将了解到编写 PHP 程序所需的所有知识。\n\n## 第 6 章：通用 PHP\n\n## 本章内容\n\
  * 在 HTML 文件中添加 PHP 部分\n* 编写 PHP 语句\n* 使用 PHP 变量\n* 比较 PHP 变量中的值\n* 为程序编写文档\n\n程序是你的\
  \ Web 数据库应用程序的逻辑部分。程序执行以下任务：创建并显示 Web 页面、接收并处理用户信息、在数据库中存储信息、从数据库中提取信息以及执行任何其他必要任务。\n\
  \nPHP 是你编写程序的语言，是一种专为 Web 设计的脚本语言。它具有帮助完成动态 Web 应用程序所需的编程任务的功能。\n\n在本章中，我描述了编写 PHP\
  \ 程序的通用规则——适用于所有 PHP 语句的规则。可以将这些规则比通用语法和标点符号规则。在第三部分的剩余章节中，你将了解到特定的 PHP 语句和特性，以及如何编写\
  \ PHP 程序来执行特定任务。\n\n## 在 HTML 页面添加 PHP 部分\nPHP 是 HTML 的伙伴，它让 HTML 能够完成无法独立完成的任务。例如，HTML\
  \ 可以显示 Web 页面，并且 具有允许你格式化这些页面的功能。HTML 还允许你在 Web 页面中显示图形和播放音乐文件。但仅凭 HTML 无法与查看 Web\
  \ 页面的用户进行交互。\n\n# 第三部分：PHP\nHTML 几乎具有交互性。也就是说，HTML 表单允许用户输入 Web 页面旨在收集的信息；然而，如果不使用\
  \ HTML 以外语言，你就无法访问这些信息。PHP 处理表单信息并允许其他交互任务。\n\nHTML 标签用于使 PHP 语句成为 HTML 脚本的一部分。\n\
  \n文件以 `.php` 扩展命名。文件以 `.php` 扩展命名。文件以 `.php` 扩展命名。\n\n在书中，假设 `.php` 是最常见的扩展名。如果你使用其他扩展名，Web\
  \ 服务器可能不知道如何处理它们。\n\nPHP 语句封装在 `<?php` 和 `?>` 标签中。\n\n```php\n<?php\n// PHP 代码放在这里\n\
  ?>\n```\n\n当 Web 服务器遇到 `<?php` 标签时，会切换到 PHP 模式。它处理内部的代码直到遇到 `?>` 标签。然后它返回 HTML 模式并继续扫描文件的其余部分。\n\
  \n如果你使用短标签，除非在配置中启用了它们，否则 Web 服务器可能不会处理。为了兼容性，最好使用完整的 `<?php` 和 `?>` 标签。\n\n\n\n\
  \n\n你添加到 HTML 文件中的 PHP 部分由一系列 PHP 语句组成。每个 PHP 语句都是让 PHP 执行某项操作的指令。在列表 6-2 所示的 Hello\
  \ World 程序中，PHP 部分仅包含一个简单的 PHP 语句。`echo` 语句指示 PHP 输出双引号之间的文本。\n\nPHP 语句以分号（`;`）结束。PHP\
  \ 不会忽略空白字符或行尾。它会继续读取语句，直到遇到分号或 PHP 结束标签为止，无论该语句跨越了多少行。遗漏分号是一个常见错误，会导致类似于所示的错误信息：\n\
  \n`Parse error`: expecting `’’,’’` or `’;’’` in `/hello.php` on line `6`\n\n**第\
  \ 6 章：PHP 基础** 137\n\n注意，错误信息给出了你遇到问题时的行号。这些信息可以帮助你定位程序中的错误。\n\n此错误信息可能意味着第 5 行末尾漏掉了分号。\n\
  \n我建议使用带有行号的编辑器来编写 PHP 程序。如果你的编辑器不允许你指定要跳转到的行，那么你每次收到错误信息时，都必须从文件顶部开始手动数行。你可以在 www.php-editors.com\
  \ 找到许多编辑器的信息，包括描述和评论。\n\n有时，一组语句会被组合成一个 `block`（块）。块由大括号 `{` 和 `}` 包围。块中的语句一起执行。块的一个常见用途是\
  \ `conditional block`（条件块），其中语句仅在特定条件为真时执行。例如，你可能希望程序执行以下操作：\n\n```\nif (the sky\
  \ is blue)\n{\n  put leash on dragon;\n  take dragon for a walk in the park;\n}\n\
  ```\n\n这些语句被包裹在大括号中，以确保它们作为一个块执行。如果天空是蓝色的，`put leash on dragon` 和 `take dragon for\
  \ a walk in the park` 都会执行。如果天空不是蓝色，这两个语句都不会执行（不牵绳；不散步）。\n\n使用块的 PHP 语句（如 `if` 语句，将在第\
  \ 7 章介绍）是 `complex`（复合）语句。PHP 读取整个复合语句，而不是在遇到第一个分号时停止。PHP 知道要预期一个或多个块，并在复合语句中寻找最后一个块的结束大括号。注意，结束大括号之前有一个分号。这个分号是必须的，但结束大括号后不需要分号。\n\
  \n如果你愿意，可以将整个 PHP 部分写在一行长线上，只要你用分号分隔语句并用大括号包裹块即可。然而，这样编写的程序对人类来说是不可的。因此，你应该将语句单独放置，除了偶尔非常短的语句外。\n\
  \n注意块内部的语句被缩进了。对于 PHP 来说，缩进并不是必要的。尽管如此，你应该缩进块中的语句，以便阅读脚本的人更容易判断块的开始和结束。\n\n通常，PHP\
  \ 并不在语句关键字是大写还是小写。`Echo`、`echo`、`ECHO` 和 `eCHo` 对 PHP 都是相同的。\n\n138 **第三部分：PHP**\n\
  \n### 错误信息和警告\n\n出现问题时，PHP 会尝试提供帮助。它提供如下错误信息和警告：\n\n✓ **Parse error:** 解析错误是 PHP\
  \ 在执行脚本前扫描时的语法错误。解析错误是致命错误，会导致脚本无法运行。解析错误看起来如下：\n\n`Parse error`: parse error, *error*,\
  \ in `c:\\test\\test.php` on line 6\n\n通常，你会收到此错误信息是因为你忘记了分号、括号或大括号。可能时，错误会提供更多信息。例如，error\
  \ might be unexpected `T_ECHO`, expecting ‘‘` or ‘;;’ 意味着 PHP 在它期待逗号或分号的地方发现了一个\
  \ `echo` 语句，这可能意味着你忘记了上一行末尾的分号。\n\n✓ **Error message:** 当 PHP 在程序执行期间遇到严重错误并导致程序无法继续运行时，你会收到此消息。该消息包含了尽可能的信息来帮助你识别问题。\n\
  \n✓ **Warning message:** 当程序发现问题但该问题的严重程度尚不足以阻止程序运行时，你会收到此消息。警告消息并不意味着程序不能运行；程序会继续运行。相反，警告消息告诉你\
  \ PHP 认为可能出了某些问题。你应该识别警告的来源，然后决定是否需要修复。通常是需要修复的。\n\n✓ **Notice:** 当 PHP 看到一个可能是错误也可能完全正常的条件时，你会收到通知（Notice）。像警告一样，通知不会导致脚本停止运行。通知指示严重问题的可能性比警告小得多。通知只是告诉你你正在做一些不寻常的事情，并让你再次检查你所做的事，以确保你真的想这样做。收到通知的一个常见原因是你正在输出不存在的变量。以下是在这种情况下你可能会看到的示例：`Notice`:\
  \ Undefined variable: age in `testing.php` on line 9\n\n✓ **Strict:** PHP 5 中添加的\
  \ Strict（严格）消息警告不符合良好习惯或已被更好的代码取代的语言。所有类型的消息都会指示导致问题的文件名和遇到问题的行号。你可以指定在网页上显示哪些类型的消息。通常，当你开发程序时，你想看到所有消息，但当程序发布在你的网站上时，你不希望看到任何消息。要更改网站错误消息级别以显示更多或更少的消息，必须更改\
  \ PHP 设置。附录 B 描述了如何更改 PHP 设置。在本地计算机上，你编辑 `php.ini` 文件，它包含一个解释错误消息设置（`error_reporting`）、错误消息级别以及如何设置它们的部分。一些可能的设置为**第\
  \ 6 章：PHP 基础** 139\n\n```\nerror_reporting = E_ALL | E_STRICT\nerror_reporting =\
  \ 0\nerror_reporting = E_ALL & ~ E_NOTICE\n```\n\n第一个设置是最好的，因为它显示所有内容。它显示除 strict\
  \ 以外的所有错误、警告和通知。第二个设置不显示任何错误信息。第三个设置显示所有错误和警告消息，但不显示通知或 strict。更改 `error_reporting`\
  \ 设置后，保存编辑过的 `php.ini` 文件并重启你的 Web 服务器。\n\n如果你在 Web 主机上使用本地的 `php.ini` 文件，只需向你的本地\
  \ `php.ini` 文件添加一条语句，就像前面的语句之一。\n\n如果你没有访问 `php.ini` 的权限，可以在程序中添加语句来仅设置该程序的错误报告级别。在程序开头添加以下语句：`error_reporting(errorSetting);`\n\
  \n例如，要查看除 strict 以外的所有错误，请使用：`error_reporting(E_ALL);`。你可能想在 Web 主机上运行脚本时将此语句放在脚本顶部。当你的程序运行完美且网站准备好供访问访问时，你可以从脚本中删除该语句。\n\
  \n此外，PHP 还提供了一个决定是否在网页上显示错误的设置。你的 `php.ini` 文件中的该设置是：\n\n```\ndisplay_errors = On\n\
  ```\n\n你可以在 `php.ini` 文件中将其更改为 Off，或者在脚本顶部添加以下语句：\n\n```\nini_set(“display_errors”,”Off”);\n\
  ```\n\n使用 PHP 变量\n\n\n\n\n变量是用于存储信息的容器。变量有一个名称，信息存储在变量中。例如，你可能会将变量命名为 `$age` 并在其中存储数字\
  \ `12`。信息存储在变量后，可以在程序的后续部分使用它。变量最常见的用途之一是存储用户在表单中输入的信息。\n\n# 第三部分：PHP\n\n### 变量命名\n\
  \n当你为变量命名时，请记住以下规则：\n\n- ✓ 所有的变量名前面都有一个美元符号（`$`）。这告诉 PHP 这是一个变量名。\n- ✓ 变量名的长度可以是任意的。\n\
  - ✓ 变量名可以只包含字母、数字和下划线。\n- ✓ 变量名必须以字母或下划线开头。它们不能以数字开头。\n- ✓ 大写字母和小写字母是不一样的。例如，`$firstname`\
  \ 和 `$Firstname` 不是同一个变量。如果你在 `$firstname` 中存储了信息，例如，你无法通过变量名 `$firstName` 来访问该信息。\n\
  \n在命名变量时，请使用能够明确变量中包含信息的名称。使用像 `$var1`、`$var2`、`$A` 或 `$B` 这样的变量名不利于提高程序的清晰度。虽然\
  \ PHP 不在乎你如何命名变量，也不会产生混淆，但尝试理解程序的人将很难跟踪哪个变量存储了什么信息。\n\n像 `$firstName`、`$age` 和 `$orderTotal`\
  \ 这样的变量名更具描述性且有用。\n\n## 创建变量并为变量赋值\n\n变量可以存储数字或字符字符串。你通过单个等号（`=`）向变量中存储信息。例如，以下四条\
  \ PHP 语句将信息分配给变量：\n\n```php\n$age = 12;\n$price = 2.55;\n$number = -2;\n$name =\
  \ “Goliath Smith\";\n```\n\n注意，字符字符串被引号括起来，但数字没有。我将在本章稍后的“处理数字”和“处理字符字符串”章节中提供有关使用数字和字符的详细信息。\n\
  \n你现在可以在 `echo` 语句中使用任何一个这些变量名。例如，如果你在 PHP 部分中运行以下 PHP 语句：\n\n```php\necho $age;\n\
  ```\n\n输出是 `12`。如果你在 HTML 文件中包含以下行：\n\n```html\n<p>Your age is <?php echo $age ?>.\n\
  ```\n\n网页上的输出是：\n`Your age is 12.`\n\n每当你将信息放入一个之前不存在的变量时，你就创建了该变量。例如，假设你使用以下 PHP\
  \ 语句：\n\n```php\n$firstname = “George”;\n```\n\n如果这是你第一次提到变量 `$firstname`，这条语句将创建该变量并设置为\
  \ `“George”`。如果你之前有一条语句将 `$firstname` 设置为 `“Mary”`，这条语句会将 `$firstname` 的值更改为 `“George”`。\n\
  \n你还可以从变量中移除信息。例如，以下语句从变量 `$age` 中取出信息：\n\n```php\n$age = “”;\n```\n\n变量 `$age`\
  \ 存在，但不包含任何值。这并不意味着 `$age` 被设置为 `0`（零），因为 `0` 是一个值。这意味着 `$age` 没有存储任何信息。它包含一个长度为\
  \ `0` 的字符串。\n\n你还可以更进一步，使用此语句来销毁该变量：\n\n```php\nunset($age);\n```\n\n执行此语句后，变量 `$age`\
  \ 不再存在。\n\n变量在整个程序中都会保留其信息，而不仅仅是单个 PHP 部分。如果变量在文件开头被设置为 `“yes”`，它在页面结束时仍然持有 `“yes”`。例如，假设你的文件有以下内容：\n\
  \n```php\n<?php\n$status = “yes”;\n?>\n<p>The status is <?php echo $status; ?>.</p>\n\
  ```\n\n\n\n\n# 描述\n\n+ 将两个数字相。\n\n- 从第一个数字中减去第二个数字。\n\n* 两个数字相乘。\n\n/ 将第一个数字除以第二个数字。\n\
  \n% 求第一个数字除以第二个数字的余。这被称为 `modulus.`。例如，在 `$a = 13 % 4,` 中，`$a` 被设置为 1。\n\n你可以同时进行多次算术运算。例如，以下语句执行了三次操作：\n\
  \n```php\n$result = 1 + 2 * 4 + 1;\n```\n\n算术执行的顺序非常重要。根据先执行的操作，你可能会得到不同的结果。PHP\
  \ 先执行乘法和除法，然后执行加减法。在其他条件相同的情况下，PHP 从左到右处理。因此，前面的语句按以下顺序将 `$result` 设置为 10：\n\n```php\n\
  $result = 1 + 2 * 4 + 1 (首先执行乘法)\n$result = 1 + 8 + 1 (接着执行最左侧的加法)\n$result = 9\
  \ + 1 (接着执行剩余的加法)\n$result = 10\n```\n\n## 第 6 章：通用 PHP 145\n\n你可以通过括号来改变算术运算的顺序。括号内的算术运算优先执行。例如，你可以像这样写之前的语句：`$result\
  \ = (1 + 2) * 4 + 1;`\n\n该语句按以下顺序将 `$result` 设置为 13：\n\n```php\n$result = (1 + 2)\
  \ * 4 + 1 (首先执行括号内的计算)\n$result = 3 * 4 + 1 (接着执行乘法)\n$result = 12 + 1 (接着执行加法)\n\
  $result = 13\n```\n\n根据“宁可信，不可错”的原则，当存在多个答案时，使用括号是最好的。\n\n通常情况下，你处理的数字是金额，例如产品价格。你希望客户在\
  \ Web 页面上以正确的格式看到价格。换句话说，金额应该始终保留两位小数。然而，PHP 以最高效率格式存储和显示数字。如果数字是 10.00，它将显示为 10。要将数字转换为正确的美元格式，你可以使用\
  \ `sprintf`。以下语句将数字格式化为美元金额：\n\n```php\n$newvariablename = sprintf(\"%01.2f\", $oldvariablename);\n\
  ```\n\n该语句重新格式化 `$oldvariablename` 中的数字，并以新格式存储在 `$newvariablename` 中。例如，以下语句以正确的格式显示货币：\n\
  \n```php\n$price = 25;\n$f_price = sprintf(\"%01.2f\",$price);\necho \"$f_price<br\
  \ />\";\n```\n\n你在 Web 页面上看到：\n\n25.00\n\n`sprintf` 的功能不仅仅是格式化小数。关于使用 `sprintf`\
  \ 格式化值的更多信息，请参阅第 13 章。\n\n如果你希望在数字中使用逗号分隔千位符，可以使用 `number_format`。以下语句创建一个带有逗号的美元格式：\n\
  \n```php\n$price = 25000;\n$f_price = number_format($price);\n```\n\n你在 Web 页面上看到：\n\
  \n25,000\n\n## 第三部分：PHP 146\n\n`sprintf` 的功能不仅仅是格式化小数。关于使用 `sprintf` 格式化值的更多信息，请参阅第\
  \ 13 章。\n\n如果你希望在数字中使用逗号分隔千位符，可以使用 `number_format`。以下语句创建一个带有逗号的美元格式：\n\n```php\n\
  $price = 25000;\n$f_price = number_format($price);\n```\n\n你在 Web 页面上看到：25,000\n\
  \n## 处理字符\n\n字符字符串是一系列字符。字符包括字母、数字和标点符号。当你使用双引号时，PHP 会解释变量和特殊字符。如果你使用单引号，PHP 会将字符串视为字面量。例如，考虑以下语句：\n\
  \n```php\n$string = \"Hello World\";\n$string = 'Hello World';\n```\n\n在双引号中，PHP\
  \ 会解释变量。在单引号中，它不会解释。然而，如果你想在字符串中包含单引号，就必须使用双引号。例如，你可以使用以下语句：\n\n```php\n$string\
  \ = \"It's Tom\";\n```\n\n同样，如果你想在字符串中包含双引号，就必须使用单引号。例如，你可以使用以下语句：\n\n```php\n$string\
  \ = 'He said \"Hello\"';\n```\n\n如果你想包含两种类型的引号，必须使用反斜杠进行转义。例如，考虑以下语句：\n\n```php\n\
  $string = \"It\\'s Tom \\\"Hello\\\"\";\n```\n\n## 字符转义\n\n反斜杠 `\\` 用于转义在双引号中具有特殊含义的字符。例如，转义序列\
  \ `\\n` 代表换行，`\\t` 代表制表符。在单引号中，这些序列被视为字面量。\n\n```php\n$string = \"Line 1\\nLine\
  \ 2\";\n$string = 'Line 1\\nLine 2';\n```\n\n第一个语句的输出将是：\n\nLine 1\nLine 2\n\n然而，第二个语句的输出将是：\n\
  \nLine 1\\nLine 2\n\n## 第 6 章：通用 PHP 147\n\n### 处理变量\n\n在双引号中，PHP 会对变量。在单引号中，它不求值。例如，考虑以下语句：\n\
  \n```php\n$age = 12;\necho \"$age\";\necho '$age';\n```\n\n第一个语句的输出将是 12，而第二个语句的输出将是\
  \ $age。\n\n### 换行\n\n转义序列 `\\n` 代表换行。在双引号中，PHP 会解释 `\\n`。例如，查看以下语句：\n\n```php\n\
  echo \"Line 1\\n Line 2\";\necho 'Line 1\\nLine 2';\n```\n\n第一个语句的输出将是：\n\nLine\
  \ 1\nLine 2\n\n第二个语句的输出是：\n\nLine 1\\nLine 2\n\n### 插入制表符\n\n转义序列 `\\t` 代表制表符。在双引号中，PHP\
  \ 会解释 `\\t`。例如，考虑以下语句：\n\n```php\necho \"Line 1\\tLine 2\";\necho 'Line 1\\tLine\
  \ 2';\n```\n\n第一个语句的输出将是：\n\nLine 1    Line 2\n\n第二个语句的输出将是：\n\nLine 1\\tLine 2\n\
  \n## 第三部分：PHP 148\n\n包裹整个字符串的引号决定了变量和特殊字符的处理方式，即使内部还有其他引号。例如，查看以下语句：\n\n```php\n\
  $number = 10;\n$string1 = “There are ‘$number’ people in line.”;\n$string2 = ‘There\
  \ are “$number” people waiting.’;\necho $string1,”br>\";\necho $string2;\n```\n\n\
  输出为：\n\nThere are 10 people in line.\nThere are \"$number\" people waiting.\n\n\
  ## 连接字符串\n\n你可以通过点 (.) 连接字符串，这种过程被称为拼接。例如，你可以使用以下语句连接字符串：\n\n```php\n$string1 =\
  \ 'Hello’;\n$string2 = 'World!';\n$stringall = $string1.$string2;\necho $stringall;\n\
  ```\n\necho 输出 输出\n\nHelloWorld!\n\n注意 Hello 和 World 之间没有空格。这是因为连接的两个字符串中没有包含空格。你可以通过使用以下拼接语句而不是早期的语句在单词之间添加一个空格：\n\
  \n```php\n$stringall = $string1.” “.$string2;\n```\n\n你可以使用 .= 向现有字符串添加字符。例如，你可以使用以下语句代替之前的语句：\n\
  \n```php\n$stringall = “Hello”;\n$stringall .= “ World!”;\necho $stringall;\n```\n\
  \necho 输出 输出：\n\nHello World!\n\n\n\n\nPHP 能够识别日期和时间，并以不同于普通字符串的方式处理它们。日期和时间由计算机存储为一种名为\
  \ `timestamp`（时间戳）的格式。然而，这并不是你或我希望看到的日期格式。PHP 将你使用的表示法的日期转换为计算机理解的时间戳，并将时间戳转换为人们熟悉的格式。PHP\
  \ 通过使用内置函数来处理日期和时间。\n\n时间戳格式是 Unix 时间戳（Unix Timestamp），它是一个整数，表示从 1970 年 1 月 1 日\
  \ 00:00:00 GMT（格林威治标准时间）到该时间戳所代表的时间之间的秒数。这种格式使得计算两个日期之间的时间变得简单——只需用一个时间戳减去另一个即可。\n\
  \n### 设置本地时间\n\n在 Web 上，当前时间是一个棘手的概念。当前时间是运行 PHP 的服务器上存储的时间。如果你正在使用 Web 托管公司，你可能甚至不知道你的托管公司在哪里维护存放你网站的服务器。此外，访问你网站的游客可能位于世界的任何地方。因此，你很少希望在你的网站上显示当前时间。如果你的\
  \ Web 服务器和访问者之间的时差足够大，甚至日期也可能不同。\n\n如果你有理由要在特定位置显示当前时间，可以在脚本中包含以下语句：`date_default_timezone_set(timezone)`；\n\
  \n其中 `timezone` 是你想要使用的时区代码。例如，你可能会使用\n\n```php\ndate_default_timezone_set(\"America/Los_Angeles\"\
  )\n```\n\n你可以在 PHP 在线文档的附录 H 中找到时区代码列表，网址为 www.php.net/manual/en/timezones.america.php。\n\
  \n在本地计算机上，如果你使用的是 PHP 5.1 或更高版本，你可能需要设置一个默认时区。如果没有设置默认时区，PHP 会进行猜测，这有时会导致 GMT 时间。此外，PHP\
  \ 会显示一条消息建议你设置本地时区。\n\n你可以在 `php.ini` 文件中设置时区：\n\n1. 用文本编辑器打开 `php.ini`。\n2. 向下滚动到以\
  \ `[Date]` 为标题的部分。\n3. 找到 `date.timezone =` 设置项。\n4. 如果该行以分号（`;`）开头，请删除分号。\n5. 在等号后添加时区代码。\n\
  \n你可以使用以下代码查看当前默认时区是哪个：\n\n```php\n$def = date_default_timezone_get()\necho $def;\n\
  ```\n\n### 格式化日期\n\n你最常使用的函数是 `date`，它将时间戳格式的日期或时间转换为你指定的格式。通用格式为\n\n```php\n$mydate\
  \ = date(\"format\", $timestamp);\n```\n\n`$timestamp` 是一个存储了时间戳的变量。你之前按照我在本节稍后描述的方法，使用\
  \ PHP 函数将时间戳存储在变量中。如果不包含 `$timestamp`，则从操作系统获取并使用当前时间。因此，你可以通过以下方式获取今天的日期：\n\n```php\n\
  $today = date(\"Y/m/d\");\n```\n\n如果今天是 2009 年 8 月 10 日，该语句返回 `2009/08/10`。\n\n\
  `format` 是一个字符串，指定了你想存储在变量中的日期格式。例如，格式 `y-m-d` 返回 `09-08-10`，而 `M.d.Y` 返回 `Aug.10.2009`。表\
  \ 6-2 列出了你可以在格式中使用的一些符号。（如需完整的符号列表，请参见 www.php.net/manual/en/date.php 的文档。）你可以用连字符（`-`）、点（`.`）、正斜杠（`/`）或空格来分隔日期的部分。\n\
  \n#### 表 6-2 日期格式符号\n\n| 符号 | 含义 | 示例 |\n| :--- | :--- | :--- |\n| `F` | 文本的月份，不缩写\
  \ | January |\n| `M` | 文本的月份，缩写 | Jan |\n| `m` | 带有前导零的数字月份 | 02 |\n| `n` | 不带前导零的数字月份\
  \ | 12 |\n| `d` | 日期；两位前导零 | 01 |\n| `j` | 不带前导零的日期 | 30 |\n| `l` | 文本格式的星期，不缩写\
  \ | Friday |\n| `D` | 文本格式的星期，缩写 | Fri |\n| `w` | 数字格式的星期几（0 星期日到 6 星期六） | 0 |\n\
  | `Y` | 四位数年份 | 2002 |\n| `y` | 两位年份 | 02 |\n| `g` | 0 到 12 之间的小时，不带前导零 | 12 |\n\
  | `G` | 0 到 23 之间的小时，不带前导零 | 15 |\n| `h` | 0 到 23 之间的小时，带有前导零 | 01 |\n| `i` | 分\
  \ | 00 |\n| `s` | 秒 | 59 |\n| `a` | 小写的 am 或 pm | am |\n| `A` | 大写的 AM 或 PM | AM\
  \ |\n\n### 在变量中存储时间戳\n\n你可以使用以下方式将带有当前日期时间戳赋值给变量：\n\n```php\n$today = time();\n\
  ```\n\n另一种存储当前时间戳的方法是使用\n\n```php\n$today = strtotime(\"today\");\n```\n\n你可以通过使用\
  \ `strtotime` 配合各种类似于英语的关键词和缩写来存储特定的时间戳。例如，你可以像这样创建一个 2009 年 1 月 15 日的时间戳：\n\n```php\n\
  $importantDate = strtotime(\"January 15 2009\");\n```\n\n`strtotime` 识别以下单词和缩写：\n\
  - **月份名称**：十二个月份名称及缩写\n- **星期**：七天及一些缩写\n- **时间单位**：year、month、fortnight（双周）、day、hour、minute、second、am、pm\n\
  - **某些英语单词**：ago、now、last、next、this、yesterday\n- **加减号**：`+` 或 `-`\n- **所有数字**\n\
  - **时区**：例如，`gmt`（格林威治标准时间）、`pdt`（太平洋夏令时间）和 `akst`（阿拉斯加标准时间）\n\n你可以以多种方式组合这些单词和缩写。以下语句都是有效的：\n\
  \n```php\n$importantDate = strtotime(\"tomorrow\"); // 24 小时后\n$importantDate =\
  \ strtotime(\"now + 24 hours\"); // 现在之后 24 小时\n$importantDate = strtotime(\"last\
  \ saturday\"); // 上个星期六\n$importantDate = strtotime(\"8pm + 3 days\"); // 3 天后晚上\
  \ 8 点\n$importantDate = strtotime(\"2 weeks ago\"); // 两周前\n$importantDate = strtotime(\"\
  next year\"); // 明年\n$importantDate = strtotime(\"now gmt\"); // 格林威治时间\n$importantDate\
  \ = strtotime(\"4am today\"); // 今天凌晨 4 点\n```\n\n如果你想知道 `$importantDate` 是多久以前，可以用\
  \ `$today` 减去它。例如：\n\n```php\n$timeSpan = $today - $importantDate;\n```\n\n该语句给出今天与该时间戳之间的秒数。或者使用\n\
  \n```php\n$timeSpan = (($today - $importantDate)/60)/60\n```\n\n来计算自 `$importantDate`\
  \ 之后的小时。\n\n#### 在 MySQL 使用日期\n\n你通常希望在 MySQL 数据库中存储日期。例如，你可能想存储客户下单的日期或成员登录的时间。MySQL\
  \ 也能识别日期和时间，并以不同于普通字符串的方式处理它们。然而，MySQL 的处理方式与 PHP 不同。要在你的应用程序中使用日期和时间，你需要同时理解 PHP\
  \ 如何处理日期（我在前几节中描述）以及 MySQL 如何处理日期。\n\n我在第 3 章中详细讨论了 MySQL 的 `DATE` 和 `DATETIME`\
  \ 数据类型。以下是总结：\n\n- **DATE**：MySQL `DATE` 列期望日期年份在前、月份在中、日期在后。年份可以是 `yyyy` 或 `yy`。月份可以是\
  \ `mm` 或 `m`。日期可以是 `dd` 或 `d`。日期的部分可以用连字符（`-`）、正斜杠（`/`）、点（`.`）或空格分隔。\n- **DATETIME**：MySQL\
  \ `DATETIME` 列期望日期和时间。日期的格式如上所述所述。日期之后紧跟 `hh:mm:ss` 格式的时间。\n\n在将日期存储到数据库之前，必须将其转换为正确的\
  \ MySQL 格式。可以使用 PHP 函数进行格式化。例如，你可以通过此语句将今天的日期转换为 MySQL 格式：\n\n```php\n$today = date(\"\
  Y-m-d\");\n```\n\n你可以使用语句格式化特定日期：\n\n```php\n$importantDate = date(\"Y.m.d\", strtotime(\"\
  Jan 15 2009\"));\n```\n\n然后你可以可以使用类似的 SQL 查询将格式化后的日期存储到数据库中：\n\n\n\n\n\n```sql\n\
  UPDATE Member SET createDate=”$today”\n```\n\n在某些情况下，MySQL 日期函数比 PHP 语句更容易用于处理日期。例如，MySQL\
  \ 提供了一个名为 `DATEDIFF` 的函数，它可以计算两个日期之间的天数，如下所示：`DATEDIFF(date1, date2)`\n\n# 第三部分：PHP\n\
  \n该函数返回从 `date2` 到 `date1` 的天数。例如，要确定表中某个日期与当前日期之间的天数，可以使用以下语句：\n\n```sql\nSELECT\
  \ DATEDIFF(NOW(),Birth_date) FROM Customer\n```\n\n`NOW()` 是一个 MySQL 函数，返回当前的日期和时间，而\
  \ `Birth_date` 是 `Customer` 表中的列名。\n\n你也可以使用该函数返回你提供的日期之间的天数，如下：\n\n```sql\nSELECT\
  \ DATEDIFF (‘2009-1-15’,’1997-12-30’)\n```\n\nMySQL 提供了许多实用的函数。所有的日期/时间函数可以在 [`dev.mysql.com/doc/refman/5.1/en/date-and-time-functions.html`](http://dev.mysql.com/doc/refman/5.1/en/date-and-time-functions.html)\
  \ 查看。\n\n## 比较值\n\n在程序中，你经常会使用条件语句。也就是说，如果某事为真，程序执行一项操作；如果不为真，程序执行不同的操作。以下是条件语句两个示例：\n\
  \n* 如果用户是儿童：显示玩具目录\n* 如果用户不是儿童：显示电子产品目录\n\n为了知道存在哪些条件，程序必须提问。然后你的程序根据答案执行任务。你可能想要问的问题（条件）以及想要执行的操作包括：\n\
  \n* 客户是儿童吗？如果是，显示玩具目录。\n* 哪种产品的销量更高？先显示最受欢迎的。\n* 客户是否输入了正确的密码？如果是，显示会员专属网页。\n* 客户住在俄亥俄州吗？如果是，显示俄亥俄州商店位置的地图。\n\
  \n## 第 6 章：通用 PHP\n\n要在程序中提问，你需要构造一个比较值的语句。程序会测试该语句并判断其是真是假。例如，你可以将上述问题表述为：\n\n\
  * 客户小于 13 岁。真还是假？如果是真，显示玩具目录。\n* 产品 1 的销量高于产品 2。真还是假？如果是真，先显示产品 1；如果是假，先显示产品 2。\n\
  * 客户的密码是私密的。真还是假？如果是真，显示会员专属网页。\n* 客户住在俄亥俄州。真还是假？如果是真，显示俄亥俄州商店位置的地图。\n\n比较可以非常简单。例如，第一个值是否大于第二个值？还是更小？或者相等？但有时你需要查看字符字符串以判断它们是否具有某些特征，而不是查看它们的精确值。例如，你可能想要识别以\
  \ `S` 开头的字符串或看起来像电话号码的字符串。对于这类比较，你将字符串与模式进行比较，我在本章后面的“字符字符串与模式匹配”章节中对此描述。\n\n###\
  \ 简单比较\n\n简单比较比较一个值与另一个值。PHP 提供了多种比较值的方法。表 6-3 显示了可用的比较。\n\n**表 6-3：比较值**\n\n| 比较符\
  \ | 说明 |\n| :--- | :--- |\n| `==` | 两个值相等吗？ |\n| `>` | 第一个值是否大于第二个值？ |\n| `>=` |\
  \ 第一个值是否大于或等于第二个值？ |\n| `<` | 第一个值是否小于第二个值？ |\n| `<=` | 第一个值是否小于或等于第二个值？ |\n| `!=`\
  \ | 两个值不相等吗？ |\n| `<>` | 两个值不相等吗？ |\n\n你可以比较数字，也可以比较字符串。字符串按字母顺序比较，所有大写字母都在任何小写字母之前。\n\
  \n例如，`SS` 在 `Sa` 之前。标点字符也有顺序，可以发现某个字符比另一个字符大。\n\n然而，比较逗号和句号并没有很大的实际价值。\n\n字符串根据其\
  \ ASCII（美国信息交换标准）码进行比较。在 ASCII 字符集中，每个字符都分配了一个对应的 ASCII 码。\n\n字符串根据其 ASCII 码进行比较。例如：\n\
  \n```php\nif ($weather == \"raining\") {\n    put umbrella;\n}\n```\n\n编写基于年龄逻辑的一种方法是使用以下代码：\n\
  \n```php\nif ($age < 13) {\n    $status = \"child\";\n}\n\nif ($age >= 13) {\n \
  \   $status = \"adult\";\n}\n```\n\n\n\n\n\n在网页上进行模式匹配最常见的用途是检查表单的输入。如果信息不合理，它可能不是你想要存储在数据库中的内容。例如，如果用户在表单中输入了一个名称，你可以通过匹配模式来检查它看起来是否像一个真实的名字。你知道名字主要由字母和空格组成。其他有效字符可能包括连字符（`-`）——例如，名字\
  \ `Smith-Kline`；以及单引号（`’`）——例如，名字 `O’Hara`。你可以通过设置一个仅包含字母、空格、连字符和单引号的字符串模式来检查名称，然后将名称与该模式进行匹配。如果名称不匹配——即它包含了模式中不存在的字符，如数字或问号（`?`），那么它就不是真实的名字。\n\
  \n# 第三部分：PHP\n\n模式由字面字符和特殊字符组成。*字面字符*是普通字符，没有其他特殊含义。`c` 就是 `c`，除了它是英语字母表中的 26 个字母之一外没有其他含义。特殊字符在模式中具有特殊含义，例如作为通配符使用时的星号（`\\\
  *`）。表 6-4 显示了模式中使用的特殊字符。\n\n## 表 6-4：模式中使用的特殊字符\n\n| 字符 | 含义 | 示例 | 匹配 | 不匹配 |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| `^` | 行首 | `^c` | cat | my cat |\n| `$`\
  \ | 行尾 | `c$` | tic | stick |\n| `.` | 任意单个字符 | `..` | 任意字符串 | `a, I` (至少包含两个字符)\
  \ |\n| `?` | 前一个字符可选 | `mea?n` | mean, men | moan |\n| `() ` | 将字面字符分组为必须完全匹配的字符串\
  \ | `m(ea)n` | mean | men, mn |\n| `\\[ \\]` | 包围一组可选的字面字符 | `m\\[ea\\]n` | men,\
  \ man | mean, mn |\n| `\\-` | 代表两个字符之间的所有字符 | `m\\[a-c\\]n` | man, mbn, mdn, mcn\
  \ | mun, maan |\n| `+` | 前一个项目的一个或多个 | `door\\[1-3\\]+` | door111, door, door131\
  \ | door55 |\n| `\\*` | 前一个项目的零或多个 | `door\\[1-3\\]\\*` | door, door4, door311 |\
  \ door445 |\n| `{ , }` | 重复范围的起始和结束数字 | `a{2,5}` | aa, aaaaa | a, xx3 |\n| `\\\\\
  ` | 后后的字符是字面量 | `m\\\\\\*n` | m\\*n | men, mean |\n| `(\\| \\|)` | 一组备字符串 | `(Tom|Tommy)`\
  \ | Tom, Thomas, Tommy | To |\n\n## 第 6 章：通用 PHP\n\n字面字符和特殊字符组合成模式——有时是长而复杂的模式。字符串与模式进行比较，如果匹配，则比较为真。以下是一些示例模式，包含了模式的分解以及一些匹配和不匹配的字符串示例：\n\
  \n*   `^[A-Z].\\*` — **以大写字母开头的字符串**\n    *   `^[A-Z]` — 字符串开头的大写字母\n    *   `.*`\
  \ — 长度为一个或多个字符的字符串\n    *   匹配的字符串：\n        *   Play it again, Sam\n        * \
  \  I\n    *   不匹配的字符串：\n        *   play it again, Sam\n        *   i\n*   `Dear\
  \ (son|daughter)` — **两个备选字符串**\n    *   `Dear` — 字面字符\n    *   `(son|daughter)`\
  \ — son 或 daughter\n    *   匹配的字符串：\n        *   Dear son\n        *   My Dear daughter\n\
  \    *   不匹配的字符串：\n        *   Dear Goliath\n        *   son\n*   `^[0-9]{5}(\\\
  -\\-[0-9]{4})?$` — **任何邮政编码**\n    *   `^[0-9]{5}` — 任意五位数字字符串\n    *   `\\-` —\
  \ 字面量\n    *   `[0-9]{4}` — 长度为四个字符的数字字符串\n    *   `()?` — 将模式的最后部分分组并使其变为可选\n \
  \   *   匹配的字符串：\n        *   90001\n        *   90002–4323\n    *   不匹配的字符串：\n \
  \       *   9001\n        *   12–4321\n*   `^.+@.+\\+\\.com$` — **嵌入 @ 且以 .com 结尾的任意字符串**\n\
  \    *   `^.+` — 开头的任意一个或多个字符字符串\n    *   `@` — 字面量 `@`（ 符号）；`@` 不是特殊字符\n    * \
  \  `.+` — 任意一个或多个字符\n    *   `\\.` — 字面点\n    *   `com$` — 字符串结尾的字面字符串 `com`\n \
  \   *   匹配的字符串：\n        *   mary@hercompany.com\n    *   不匹配的字符串：\n        *  \
  \ mary@hercompany.net\n        *   @mary.com\n\n你可以通过 `ereg` 将字符串与模式进行比较。通用格式为 `ereg(\"\
  *pattern*\", *string*)`。\n\n`pattern` 或 `string` 均可以是字面量，如下：`ereg(\"\\[0-9\\]\\\
  *\",\"1234\");`\n\n或者可以存储在变量中，如下：`ereg($pattern,$string);`\n\n要使用 `ereg` 检查用户在表单中输入的名称，请将名称与模式进行比较。\n\
  \n\n\n\n你可以使用括号来改变比较的顺序。括号内的单词会先求值。例如，你可以用括号将之前的语句重写如下：\n\n```\n( $age == 200 or\
  \ $age == 300 ) and $name == “Goliath”\n```\n\n括号改变了检查检查的顺序。\n\n现在首先检查 `or`。如果客户的名字是\
  \ Goliath 且他的年龄为 200 岁或 300 岁，该条件为真。你得到这些结果是因为程序按如下方式检查条件：\n\n1. 比较 `or`。\n   程序检查\
  \ `$age` 以确定它是否等于 200 或 300。如果是，该条件的这部分为真。然而，`and` 另一边的比较也必须为真，因此测试将继续。\n\n2. 比较\
  \ `and`。\n   程序检查 `$name` 以确定它是否等于 Goliath。如果是，条件为真。如果不是，条件为假。\n\n请尽情地使用括号，即使你认为自己已经知道了比较的顺序。不必要的括号无害，但产生意想不到结果的比较则会有害。\n\
  \n### 第 6 章：通用 PHP 163\n\n如果你熟悉其他语言（如 C），你可能已经过 `||`（逻辑或）和 `&&`（逻辑与）来代替单词。`||` 和\
  \ `&&` 在 PHP 中同样有效。语句 `$a < $b && $c > $b` 与语句 `$a < $b and $c > $b` 一样有效。`||` 在\
  \ `or` 之前检查；`&&` 在 `and` 之前检查。\n\n### 在你的程序中添加注释\n\n`Comments`（注释）是嵌入在程序本身的备注。在程序中添加描述其用途和作用的注释是关重要的。这对于“彩票因素”非常重要——也就是说，如果你中了大票并逃往法国里维埃海岸过上奢华生活，其他人将不得不完成该程序。新人员需要知道你的程序应该做什么以及是如何执行的。实际上，注释对你也有处。当你明年可能需要修订程序时，那时那些细节早已埋在你的记忆中，被最近的项目覆盖了。\n\
  \n请尽情地使用注释。PHP 会忽略注释；注释是给人类看的。\n\n只要你告诉 PHP 它们是注释，你就可以在程序的任何地方嵌入注释。注释的格式为：\n\n```php\n\
  /* comment text\nmore comment text \\*/\n```\n\n你的注释可以根据需要任意长长或短短。当 PHP 看到指示注释开始的代码（`/*`）时，它会忽略后续所有内容直到看到指示注释结束的代码（`*/`）。\n\
  \n每个程序开始处注释的一种可能格式如下：\n\n```php\n/* name: catalog.php\ndescription: 显示产品描述的程序。描述存储在\n\
  数据库中。产品描述是根据用户在表单中输入的\n类别从数据库中选择的\nwritten by: Lola Designer\ncreated: 2/1/09\n\
  modified: 3/15/09\n*/\n```\n\n你应该在整个程序中使用注释来描述程序的功能。当程序语句复杂时，注释尤为重要。请频繁使用如下注释：\n\
  \n164 **第三部分：PHP**\n\n```php\n/* 从数据库获取信息 \\*/\n/* 检查客户年龄是否超过 18 岁 \\*/\n/* 在订单总额中添加运费\
  \ \\*/\n```\n\nPHP 还有一种短注释格式。你可以使用井号（`#`）或双正斜线（`//`）以如下方式指定单行作为注释：\n\n```php\n#\
  \ 这是注释行 1\n// 这是注释行 2\n```\n\n从 `#` 或 `//` 直到行尾的所有文本都是注释。你也可以在行的中间使用 `#` 或 `//`\
  \ 来标记注释的开始。PHP 将忽略从 `#` 或 `//` 到行尾的所有内容。这种技术对于注释特定的语句非常有用，例所示：\n\n```php\n$average\
  \ = $orderTotal/$nItems // 计算平均价格\n```\n\n有时你想强调某条注释。以下格式会让注释非常醒目：\n\n```\n######################################\n\
  ## 检查此章节 ##\n######################################\n```\n\nPHP 注释不会包含在发送给用户浏览器的\
  \ HTML 代码中。用户看不到这些注释。\n\n在脚本中尽可能根据需要使用注释以使其清晰。然而，使用过多的注释是一个错误。不要对脚本中的每一行或你在脚本中做的每件事都写注释。如果你的脚本充满了注释，重要的注释可能会在迷宫中丢失。请使用注释来标记章节并解释不寻或复杂的代码——而不是显而易见的代码。\n\
  \n### 第 7 章\n### PHP 程序的构建模块\n\n#### 本章内容\n- 向 Web 页面输出内容\n- 为变量赋值\n- 停止并跳出程序\n\
  - 创建和使用数组\n- 使用条件语句\n- 构建并使用循环执行重复语句\n- 使用函数\n\nPHP 程序是文件中的一系列指令，文件名带有扩展名，该扩展名告诉\
  \ Web 服务器在文件中查找 PHP 部分。（扩展名通常为 `.php` 或 `.phtml`，但可以是 Web 服务器配置为期的任何内容。）PHP 从文件顶部开始，并按照出现的顺序执行每条指令。指令是\
  \ PHP 程序的构建模块。\n\n基础构建模块是简单的 `statements`（语句）——一个指令后跟一个分号。简单的程序由一系列语句组成。\n\n例如，第\
  \ 6 章中的 Hello World 程序就是一个简单的程序。\n\n然而，构成 Web 应用程序程序并不简单。它们是动态的，并与用户和数据库交互。因此，程序需要更多的构建模块。\n\
  \n以下是一些需要构建的常见任务：\n\n- **存储一组值**：你经常拥有相关信息，例如产品的描述、图片和价格。将这些信息存储在一个可以通过名称访问的组中是高效且实用的。这种\
  \ PHP 特性是 `array`（数组）。\n- **仅在满足某些条件时设置语句**：程序经常需要这样做。例如，你可能想对儿童显示玩具目录，对成人显示电子目录。\n\
  \n166 **第三部分：PHP**\n\n这种类型的语句是 `conditional statement`（条件语句）。PHP 条件语句是 `if` 语句和\
  \ `case` 语句。\n- **设置重复的语句块**：你经常需要重复语句。例如，你可能想创建一个客户列表。为了实现这一点，你可能使用两个语句：一个从数据库获取客户行，另一个将姓名存储在列表中。你需要对客户数据库中的每一行重复这两个语句。允许你执行此操作的是\
  \ `loop`（循环）。三种循环是 `for` 循环、`while` 循环和 `do..while` 循环。\n- **编写多次使用的语句块**：许多任务在程序的多个部分执行。例如，你可能想从数据库检索产品信息并在应用程序中多次显示。获取和显示信息可能需要几条语句。编写一个显示产品信息的语句块并比每次需要显示时重复编写语句要高效得多。PHP\
  \ 允许你通过创建 `function`（函数）来复用语句块。\n\n在本章中，你将了解如何使用 PHP 的构建模块。我描述了最常用的简单语句以及最重要的复杂语句和变量。你将了解如何构造构建模块以及它们的用途。然后在第\
  \ 8 章中，你将了解如何使用这些构建模块在数据库之间移动数据。\n\n## 有用的简单语句\n\n\n\n\n\n`simple statement`（简单语句）是一个后面跟着分号\
  \ (;)的单条指令。以下是 PHP 程序中用到的一些有用简单语句：\n\n✓ `echo` 语句：产生由浏览器处理为 HTML 的输出。\n\n✓ `Assignment`（赋值）语句：为变量赋值。\n\
  \n✓ `Increment`（自）语句：增加或减少变量中的数字。\n\n✓ `exit` 语句：停止程序的执行。\n\n✓ `Function call`（函数调用）：在程序的任何位置使用存储的语句块。\n\
  \n我将在接下来的章节中讨论这些简单语句以及何时使用它们。\n\n# 第 7 章：PHP 程序的构建模块 167\n\n## 使用 echo 语句\n\n你使用\
  \ `echo` 语句产生输出。`echo` 语句的输出会被发送到用户的浏览器，浏览器会将输出处理为 HTML。\n\n`echo` 语句的通用格式为：\n\n\
  `echo *outputitem*, *outputitem*, *outputitem*, ...*`\n\n其中适用以下规则：\n\n✓ 一个 `outputitem`\
  \ 可以是数字、字符串或变量。字符串必须包含在引号中。双引号和单引号的区别在第 6 章中解释。\n\n✓ 列出你需要的任意 `outputitem`，并用逗号隔开。\n\
  \n表 7-1 显示了一些 `echo` 语句及其输出。为了该表格，假设 `$string1` 被设置为 `Hello`，而 `$string2` 被设置为 `World!`。\n\
  \n**表 7-1：echo 语句**\n\n| echo 语句 | 输出 |\n| :--- | :--- |\n| `echo “Hello”;` | Hello\
