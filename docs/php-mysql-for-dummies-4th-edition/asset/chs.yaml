  \n## 编写 SQL 查询\n\n创建表后，你可以通过查询来查看它、检查其结构或将其删除。请勿使用任何 MySQL 保留字作为列名。\n\n* ✓ 要查看已添加到数据库的表，请使用此查询：`SHOW\
  \ TABLES`\n* ✓ 要查看表的结构，请使用此查询：`EXPLAIN tablename`\n* ✓ 要删除任何表，请使用此查询：`DROP TABLE\
  \ tablename`\n\n请谨慎地使用 `DROP`，因为它是不可逆的。表被删除后，它将永久消失，表中的任何数据也会随之消失。如果你使用保留字作为列名，MySQL\
  \ 会给你返回一个如下所示的错误消息：\n\n```\nYou have an error in your syntax near ‘order20)’ at\
  \ line 1\n```\n\n注意，此消息显示了它不喜欢的字段定义以及发现该定义所在的行。然而，该消息并没有告诉你问题所在。你 SQL 中的错误是使用了保留字\
  \ `order` 作为列名。\n\n你可以使用以下创建一个表：\n\n```\nCREATE TABLE Pet (\n    petID SERIAL NOT\
  \ NULL AUTO_INCREMENT,\n    petName VARCHAR(25) NOT NULL,\n    petType VARCHAR(15)\
  \ NOT NULL,\n    petDescription VARCHAR(255) NOT NULL,\n    price DECIMAL(9,2) NULL,\n\
  \    pix VARCHAR(15) DEFAULT \"missing.jpg\",\n    PRIMARY KEY (petID)\n)\n```\n\
  \n90 **第二部分：MySQL 数据库**\n\n你也可以使用以下定义第一个字段：\n\n```\nCREATE TABLE Login (\n    id\
  \ BIGINT NOT NULL AUTO_INCREMENT,\n    loginName VARCHAR(20) NOT NULL,\n    loginTime\
  \ DATETIME NOT NULL,\n    PRIMARY KEY (id)\n)\n```\n\n### 修改数据库结构\n\n你的数据库并不是固定不变的。你可以更改表名；添加、删除或重命名列；或者更改列的数据类型或其他属性。即使在表中包含数据后，也可以更改结构。\n\
  \n更改数据库并不罕见。你可能出于许多原因想要更改数据库。例如，假设你在 `MemberDirectory` 数据库的 `Member` 表中将 `lastName`\
  \ 列定义为 `VARCHAR(20)`。当时，20 个字符对于姓氏来说似乎足够。但现在你收到备忘录，宣布新 CEO 是 John Schwartzheimer-Losertman。糟糕，MySQL\
  \ 会把他的名字截断为前 20 个字母，这对老板并不理想的新名字。所以，你需要把该列改宽——尽快。\n\n要在 phpMyAdmin 中更改结构，请遵循以下步骤：\n\
  \n**1. 打开 phpMyAdmin 主页。**\n\n**2. 点击包含要修改表的数据库名称。**\n\n**3. 在要修改表的行中，点击第二个图标（结构图标）。**\n\
