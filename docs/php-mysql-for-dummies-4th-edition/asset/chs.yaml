  \ `$emess` 中跨多行创建的——从第 183 行开始，在每行使用 ``.=` 添加文本，并于第 189 行结束。这种格式是为了便于人类阅读，而不是因为\
  \ PHP 需要它。在电子邮件消息中（与 HTML 内容不同），额外的空格和换行是有影响的。例如，如果我创建了一个长消息并使用额外的空格进行缩进，这些空格将出现在邮件中。因此，我将消息设置在几行，以便在程序中为了可读性进行缩进。第\
