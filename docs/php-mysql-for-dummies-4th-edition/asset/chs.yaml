  \ 8-10 中的程序相似，该程序构建了一个单选按钮列表。然而，请注意输入字段使用了数组 `$interest` 作为字段名。这是因为可以选择多个复选框。该程序会为每个选中的复选框在数组中创建一个具有\
  \ `key/value` 键的元素。例如，如果用户同时选择了*马（horse）*和*龙（dragon）*，将创建如下数组：\n\n```php\n$interest[horse]=horse\n\
  $interest[dragon]=dragon\n```\n\n处理表单的程序可以在 POST 数组中获取这些选择，格式如下：\n\n```php\n$_POST['interest']['horse']\n\
  $_POST['interest']['dragon']\n```\n\n图 8-12 显示了 `buildCheckbox.php` 生成的网页。\n\n**图\
  \ 8-12:**\n由 `buildCheckbox.php` 程序生成的复选框列表。\n\n**第 8 章：数据输入，数据输出** 251\n\n### 使用来自表单的信息\n\
  \n正如在本节早时候讨论的，Joe Customer 填写一个 HTML 表单，从列表中选择并向文本字段中输入信息。他点击提交按钮。在 `form` 标签中，你告诉\
  \ PHP 在点击提交按钮时运行哪个程序。你通过在 `form` 标签中包含 `action=\"programname\"` 来实现。例如，在本章的大多数示例代码列表中，我使用了\
  \ `action=\"processform.php\"`。当用户点击提交按钮时，程序将运行并从表单接收信息。处理表单信息是 PHP 的最佳功能之一。你不需要担心表单数据——只需从其中一个内置数组中获取并使用即可。\n\
  \n表单数据以数组的形式存在于处理程序中，例如 `$_POST` 或 `$_GET`。数组元素的键名是表单中输入字段的名称。例如，如果你在表单中 `echo`\
  \ 以下字段：`echo “<input type=’text’ name=’firstName’ />”;`，处理程序就可以使用变量 `$_POST[firstName]`，它包含了用户在字段中输入的文本。用户从选择下拉列表或单选按钮选择的信息同样可以用于处理。例如，如果你的表单包含以下单选按钮列表\n\
  \n```php\necho “<input type=’radio’ name=’interest’\nvalue=’dog’ />dog\\\\n”;\n\
  echo “<input type=’radio’ name=’interest’\nvalue=’cat’ />cat\\\\n”;\n```\n\n你可以访问变量\
  \ `$_POST[interest]`，根据用户选择的内容，它包含 dog 或 cat。\n\n你处理复选框的方式略有不同，因为用户可以选择多个复选框。正如之前在列表\
  \ 8-11 所示，来自复选框列表的数据可以存储在数组中，以便使所有复选框都可用。例如，如果你的表单包含以下复选框列表：\n\n```php\necho “<input\
  \ type=’checkbox’ name=’interest[dog]’\nvalue=’dog’ />dog\\\\n”;\necho “<input type=’checkbox’\
  \ name=’interest[cat]’\nvalue=’cat’ />cat\\\\n”;\n```\n\n你可以访问变量 `$_POST[interest]`，它包含了：\n\
  \n```php\n$_POST[dog] = dog\n$_POST[cat] = cat\n```\n\n252 **第三部分：PHP**\n\n在某些情况下，你可能想要检查留空字段。正如之前在列表\
  \ 8-11 所示，来自复选框列表的数据可以存储在数组中，以便使所有复选框都可用。例如，如果你的表单包含以下复选框列表\n\n```php\necho “<input\
  \ type=’checkbox’ name=’interest[dog]’\nvalue=’dog’ />dog\\\\n”;\necho “<input type=’checkbox’\
  \ name=’interest[cat]’\nvalue=’cat’ />cat\\\\n”;\n```\n\n你可以访问变量 `$_POST[interest]`，根据用户选择的内容，它包含了：\n\
  \n```php\n$_POST[interest][dog] = dog\n$_POST[interest][cat] = cat\n```\n\n\n\n\n\
  \nJoe Customer 填写了一个 HTML 表单，从列表中进行选择并在文本框中输入信息。他点击了提交按钮。现在你拥有了你想要的所有信息。嗯，也许吧。Joe\
  \ 输入的信息可能包含拼写错误。或者他可能输入了无意义的内容。他甚至可能输入了恶意信息，可能会对你或其他使用你网站的人造成问题。在你在使用 Joe 的信息或将其存储在数据库之前，你希望对它进行检查，以确保它确实是你想要的信息。\n\
  \n检查数据就是对数据进行`validating`（验证）。\n\n验证数据包括以下内容：\n\n- ✓ **检查空字段：** 你可以要求用户在字段中输入信息。如果字段为空，系统会提示用户该信息是必填的，并重新显示表单，以便用户输入缺失的信息。\n\
  - ✓ **检查信息的格式：** 你可以检查信息以确保其格式正确。例如，`ab3&*xx` 显然不是一个有效的邮政编码。\n\n# 第三部分：PHP\n\n###\
  \ 检查空字段\n\n当你创建一个表单时，可以决定哪些字段是必填的，哪些是可选的。你的决定实现在 PHP 程序中。你检查需要信息的字段。如果某个必填字段为空，你会向用户发送一条消息，指示该字段是必填的，然后重新显示表单。\n\
  \n检查空字段的通用步骤如下：\n\n```php\nif(empty($last_name))\n{\n    echo “You did not enter\
  \ your last name. Last name is required.<br />\\n”;\n    display the form;\n   \
  \ exit();\n}\necho “<p>Welcome to the Members Only club. You may select from the\
  \ menu below.<br /></p>\\n”;\ndisplay the menu;\n```\n\n注意 `exit` 语句，它结束了 `if` 块。如果没有\
  \ `exit` 语句，程序将继续执行 `if` 语句之后的语句。换句话说，如果没有 `exit` 语句，程序将显示表单并继续输出欢迎语句和菜单。\n\n很多情况下，你想要检查表单中的所有字段。你可以通过遍历数组\
  \ `$_POST` 来实现。以下语句检查数组中是否存在任何空字段：\n\n```php\nforeach($_POST as $value)\n{\n   \
  \ if(empty($value))\n    {\n        echo “You have not filled in all the fields<br\
  \ />\\n”;\n        display the form;\n        exit();\n    }\n}\necho “Welcome”;\n\
  ```\n\n当你重新显示 Web 表单时，请确保它包含了用户已经输入的信息。如果用户必须重新输入正确的信息，他们可能会感到沮丧并离开你的网站。\n\n在某些情况下，你可能要求用户填写大部分但不是所有的字段。例如，你可能在表单中请求提供传真号码或为中间名提供一个字段，但你并不是真的想将你网站的注册限制在有中间名和传真号码的用户身上。在这种情况下，你可以像下面所示对非必填字段进行例外处理：\n\
  \n```php\nforeach($_POST as $field => $value)\n{\n    if( $field != “fax” and $field\
  \ != “middle_name” )\n    {\n        if(empty($value))\n        {\n            echo\
  \ “A required field is empty.<br />\\n”;\n            display the form;\n      \
  \      exit();\n        }\n    }\n}\necho “Welcome”;\n```\n\n注意，外部的 `if` 条件语句只有在当\
  \ `field` 不是 `fax` 且不是 `middle_name` 时才为真。对于这两个字段，程序不会进入检查空字段的内部 `if` 语句。\n\n在大多数情况下，程序应该创建两个数组：一个包含显示不当为空的字段名称，另一个包含正确的数据，以便你显示或存储它们。对正确数据数组的需求将在本节稍后的部分出现，届时我将讨论数据格式和数据清洗。\n\
  \n在某些情况下，你可能想准确地告诉用户哪些字段需要填写。列表 8-12 中的 `checkBlank.php` 程序处理由列表 8-6 显示的 `displayForm`\
  \ 生成的表单，该表单有四个字段：`first_name`、`middle_name`、`last_name` 和 `phone`。除了 `middle_name`，所有字段都是必填的。\n\
  \n要使用列表 12 中的程序，首先编辑列表 8-6 显示的 `displayForm` 程序，使 `checkBlank.php` 显示在表单标签的 `action`\
  \ 属性中。将 `form.php` 替换为 `checkBlank.php`，如下：\n\n```html\n<form action='checkBlank.php'\
  \ method='POST'>\n```\n\n然后运行 `displayForm.php` 程序，填写表单，并点击提交按钮，这将运行 `checkBlank.php`。\n\
  \n### 列表 8-12：检查空字段\n\n```php\n<?php\n/*\nProgram name: checkBlank.php\nDescription:\
  \ 程序检查所有表单字段是否存在空字段。\n*/\n?>\n```\n\n### 列表 8-12（续）\n\n```html\n<<html>\n<head>\n\
  <title>Customer Phone Number</title>\n<style type='text/css'>\nform { margin: 1.5em\
