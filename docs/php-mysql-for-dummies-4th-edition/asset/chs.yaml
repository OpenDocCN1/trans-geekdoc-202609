  Disallow: /tutorials/custom_error_page.html\n#\n# robots.txt 文件结束\n#\n###############################\n\
  ```\n\n以以井号（`#`）开头的行是注释，会被忽略。\n\n请注意，只有两行不是注释。第一行是 `User-agent: *`。此行指定所有的搜索引擎都应该遵循此文件中的指示。第二行是\
  \ `Disallow: /`。此行指定搜索引擎应该忽略此目录中的所有文件，包括子目录。\n\n### 公司电脑\n\n如果你的开发站点位于公司电脑上，你的公司\
