  \n数据类型并不是你可以应用到字段的唯一特征。这里是一些你可以使用的常用定义：\n\n* ✓ `NOT NULL`：此列必须有值；不能为空。\n* ✓ `DEFAULT`\
  \ `value`：在创建行时，如果没有为此列提供其他值，则该值将存储在列中。\n* ✓ `AUTO_INCREMENT`：你使用此定义来创建一个序列号。每添加新行，该字段的值都会比上一次输入的行增加一个整数。你可以通过给字段分配特定值来覆盖自动计数数字。\n\
  * ✓ `UNSIGNED`：你使用此定义表示该数值字段的值永远不会是负数。\n\n你可以在 phpMyAdmin 中通过界面或使用 SQL 查询来创建表。\n\
  \n## 使用 phpMyAdmin 界面\n\nPhpMyAdmin 提供了一个界面页面，用于向数据库添加新表，如下所示：\n\n**1. 打开 phpMyAdmin\
