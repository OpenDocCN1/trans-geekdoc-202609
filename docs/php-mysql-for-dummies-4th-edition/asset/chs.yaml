  \ 10 章。）\n\n正如我在第 10 章中讨论的那样，将连接数据库所需的信息存储在单独的文件中并包含在需要访问数据库的程序中。将该文件存储在安全的位置，并使用具有误导性的名称。对于此应用程序，以下信息存储在一个名为\
  \ `dogs.inc` 的文件中：\n\n```php\n<?php\n$user=\"admin\";\n$host=\"localhost\";\n$password=\"\
  \";\n$dbname=\"MemberDirectory\";\n?>\n```\n\n连接数据库所需的信息。在文件中包含在需要访问数据库的程序中。\n```\n\
