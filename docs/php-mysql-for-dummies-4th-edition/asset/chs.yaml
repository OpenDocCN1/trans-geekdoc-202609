  \ > 0 or @sizeof($bad_format) > 0)\n{\nif(@sizeof($blank_array) > 0)\n{\n/* 显示缺失信息的消息\
  \ */\necho “<p><b>You didn’t fill in one or more required fields. You must enter:</b><br\
  \ />”;\nforeach($blank_array as $value)\n{\necho “&nbsp;&nbsp;&nbsp;{$labels[$value]}<br\
