  \n如果你有必须在你的 Web 托管账户上进行开发的原因，那么你需要一个私位置存放开发文件。你可以从 Web 托管主机获取第二个账户用于开发，并在完成后将文件传输到你的\
  \ Web 站点。或者，你可以在你的 Web 站点上创建一个仅用于开发的子目录，完成后将文件传输到主 Web 站点目录。\n\n无论你采用哪种方法，你都需要设置一些东西。你需要确保开发区域是私有的，不对公众开放。你，还需要确保确保开发区域不被搜索引擎索引。如果搜索引擎在两个不同的位置运行相同的\
  \ Web 页面，这会大幅降低你的搜索引擎搜索结果。\n\n### 保持私有性\n\n你需要在你的 Web 托管账户中设置一个目录作为你的开发站点。你可以通过\
  \ `.htaccess` 文件将该目录设为私有，不允许公共访问。要阻止对开发目录的访问：**1. 在你想要保护的目录中创建一个名为 `.htaccess` 的文件。**\n\
  \n也就是说，如果你创建了一个名为 `devel` 的子目录作为你的开发站点，请在 `devel` 目录内部创建 `.htaccess` 文件。是的，文件名开头有一个点。\n\
  \n**2. 在 `.htaccess` 文件中添加一行内容。**\n\n该行的内容如下：\n\n```\nDeny from all\n```\n\n`.htaccess`\
  \ 文件中的 `Deny` 指令可以防止任何人访问 `.htaccess` 文件所在目录中的任何文件。\n\n### 排除搜索引擎\n\n你可以通过 `robots.txt`\
