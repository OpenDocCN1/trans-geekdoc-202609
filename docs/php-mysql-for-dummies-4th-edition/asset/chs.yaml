  n”;\n}\necho “<div id=’submit’><input type=’submit’\nvalue=’Submit Number’ />\\\
  n</div>\\nform>\\n</body>\\n</html>\n?>\n```\n\n```php\n\n显示的表单提供了三个字段：`first_name`、`last_name`\
  \ 和 `phone`。\n\n**列表 8-17：从表单存储数据**\n\n```php\n<?php\n/* 程序名：savePhone.php\n* 说明：程序检查所有表单字段是否存在\n\
  * 空白字段和格式错误。保存\n* 正确的字段到数据库。 */\n/* 设置标签 */\n$labels = array( “first_name” => “First\
