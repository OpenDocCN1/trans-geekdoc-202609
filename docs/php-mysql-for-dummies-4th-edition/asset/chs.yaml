  \ ‘Hello World!’;` | Hello World! |\n| `echo $string1;` | Hello |\n| `echo $string1,$string2;`\
  \ | HelloWorld! |\n| `echo “$string1 $string2”;` | Hello World! |\n| `echo “Hello\
  \ “,$string2;` | Hello World! |\n| `echo “Hello”,” “,$string2;` | Hello World! |\n\
  | `echo ‘$string1’,”$string2”;` | $string1World! |\n\n双引号和单引号对变量有不同的影响。当你使用单引号时，变量名按原样输出。当你使用双引号时，变量名会被变量值替换。\n\
  \n168 **第三部分：PHP**\n\n你可以用大括号（`{ }`）分隔变量名。例如，以下语句：\n\n`$pet = “bird”;`\n`echo “The\
  \ $petcage has arrived.”;`\n\n将不会输出 `bird` 作为 `$pet` 变量。换句话说，输出将不是 `The birdcage\
  \ has arrived`。相反，PHP 会寻找变量 `$petcage` 但无法找到。你可以通过使用大括号来分离 `$pet` 变量以输出正确的输出：\n\n\
  `$pet = “bird”;`\n`echo “The {$pet}cage has arrived.”;`\n\n上述语句将输出：\nThe birdcage\
  \ has arrived.\n\n`echo` 语句输出一行发送到浏览器的文本。浏览器将文本视为 HTML 并以这种方式进行处理。因此，你需要确保你的输出是有效的\
  \ HTML 代码，描述了你想让用户看到的 Web 页面。\n\n当你想要使用 PHP 显示 Web 页面（或 Web 页面的部分）时，你需要考虑生成 Web\
  \ 页面的三个阶段：\n\n✓ **PHP 程序：**你编写的 PHP `echo` 语句。\n\n✓ **HTML 源代码：**当你在浏览器中选择“查看➪源”时看到的\
  \ Web 页面源代码。`source code` 是 `echo` 语句的输出。\n\n✓ **Web 页面：**你的用户看到的 Web 页面。Web 页面是由\
  \ HTML 源代码产生的。\n\n`echo` 语句将你 echo 的内容原封不动地发送到浏览器——不多也不少。如果你没有 echo 任何 HTML 标签，就什么都不会发送。\n\
  \nPHP 允许一些格式化输出的特殊字符，但它们不是 HTML 标签。PHP 特殊字符只影响 `echo` 语句的输出而不影响 Web 页面上的显示。例如，如果你想在\
  \ PHP 输出中换行，必须包含一个特殊字符（`\\n`），告诉 PHP 开始新行。然而，这个特殊字符只是在输出中开始新行；它*并没有*发送一个 HTML 标签在\
  \ Web 页面上换行。表 7-2 显示了这三个阶段的示例。\n\n** 第 7 章：PHP 程序的构建模块 169**\n\n**表 7-2：Web 页面交付的阶段**\n\
  \n| echo 语句 | HTML 源代码 | Web 页面显示 |\n| :--- | :--- | :--- |\n| `echo “Hello World!”;`\
  \ | Hello World! | Hello World! |\n| `echo “Hello World!”;` | Hello World! | Hello\
  \ World!Here I am! |\n| `echo “Here I am!”;` | Here I am! | Here I am! |\n| `echo\
  \ “Hello World!\\n”;` | Hello World! | Hello World!Here I am! |\n| `echo “Here I\
  \ am!”;` | Here I am | Here I am |\n| `echo “Hello World!”;` | Hello World! | <br>\
  \ Hello World! |\n| `echo “<br>”;` | Here I am!” | Here I am! |\n\n*(注：由于原文表格 7-2\
  \ 存在大量内容重复和错位，译文在保持逻辑一致的基础上对内容进行了对齐处理)*\n\n### 使用赋值语句\n\n*Assignment statements*（赋值语句）是为变量赋值的语句。变量名位于等号的左侧；要给变量的值位于等号的右侧。这里是通用格式：`$variablename\
  \ = *value*;`\n\n# 第 7 章：PHP 程序的构建模块 171\n\n*value* 可以是单个值或多个值的组合，包括变量中的值。变量可以持有数字或字符，但不能同时包含。因此，值不能是数字和字符的组合。以下是有效的赋值语句：\n\
  \n`$number = 2;`\n`$number = 2+1;`\n`$number = (2 - 1) * (4 * 5) -17;`\n`$number2\
  \ = $number + 3;`\n`$string = “Hello World”;`\n`$string2 = $string.” again!”`\n\n\
  如果你在值中组合数字和字符，你不会得到错误消息；你只会得到意料之外的结果。例如，以下语句组合了数字和字符：\n\n`$number = 2;`\n`$string\
  \ = “Hello”;`\n`$combined = $number + $string;`\n`$combined2 = $number.$string;`\n\
  \n`echo $combined;`\n`echo <br />;\n`echo $combined2;`\n\n这些语句的输出是：\n2 ($string\
  \ 被评估为 0)\n2Hello ($number 被评估为字符)\n\n### 使用自增语句\n\n\n\n\n\n变量经常被用作计数器。例如，假设你想确保每个人都能看到你们公司的\
  \ Logo，因此你显示了三次。\n\n你将一个变量设置为 `0`。每当你显示一次 Logo 时，就给该变量加 `1`。当变量的值达到 `3` 时，你就知道该停止显示\
  \ Logo 了。以下语句展示了计数器的用法：\n\n```\n$counter=0;\n$counter = $counter + 1;\necho $counter;\n\
  ```\n\n这些语句将输出 `1`。因为计数器被频繁使用，PHP 提供了简写形式。以下语句与前面的语句效果相同：\n\n```php\n$counter=0;\n\
  $counter++;\necho $counter;\n```\n\n这个 `echo` 语句也会输出 `1`，因为 `++` 会给 `$counter` 的当前值加\
  \ `1`。或者你可以使用以下语句，它从 `$counter` 的当前值减去 1。\n\n```php\n$counter--;\n```\n\n有时，你可能想执行不同的算术运算。你可以使用以下任何简写形式：\n\
  \n```php\n$counter+=2;\n$counter-=3;\n$counter*=2;\n$counter/=3;\n```\n\n这些语句分别给\
  \ `$counter` 加 `2`、从 `$counter` 减去 3、将 `$counter` 乘以 2 以及将 `$counter` 除以 3。\n\n\
  ### 使用 exit\n\n有时，你希望程序停止执行——在程序中间的某一点停止。例如，如果程序遇到错误，通常你希望它停止而不是继续执行后续语句。`exit`\
  \ 语句会停止程序。在 `exit` 语句之后将不再执行任何语句。`exit` 语句的格式为 `exit(“message”);`。\n\n`message`\
  \ 是程序退出时输出的消息。例如，你可能会使用以下语句：\n\n```php\nexit(“程序正在退出”);\n```\n\n你也可以使用 `die` 语句来停止程序，如下：\n\
  \n```php\ndie(“程序正在死掉”);\n```\n\n`die` 语句与 `exit` 语句相同。有时说 `die` 只是更有趣而已。\n\n###\
  \ 使用函数调用\n\n`Functions`（函数）是执行特定指定任务的语句块。你可以将函数视为微程序或子程序。语句块存储在一个函数名下，你可以通过通过名称`调用`函数在任何地方执行该语句块。（有关如何使用函数的详情，请参阅本章稍后的“使用函数”章节。）\n\
  \n你可以通过列出函数名并跟上括号来调用函数，例如：`functionname()`。\n\n例如，你可能有一个函数，可以从数据库中获取所有居住在某个州的客户名称，并按\
  \ `姓, 名` 的格式在列表中显示这些名称。你编写执行这些任务的语句，并将它们存储为名为 `get_names` 的函数。\n\n然后，当你调用该函数时，需要指定是哪个州。你可以在程序的任何位置使用以下语句来获取指定州（在本例中为利福尼亚州）的客户列表：\n\
  \n```php\nget_names(‘CA’);\n```\n\n值 `‘CA’` 被传递给函数，这样它就知道你指定的是哪个州。你可以传递多个值。\n\n\
  PHP 提供了许多内置函数。例如，在第 6 章中，我讨论了一个名为 `unset` 的内置函数。你可以通过此函数调用销毁名为 `$testvar` 的变量：\n\
  \n```php\nunset($testvar);\n```\n\n## 使用 PHP 数组\n\n`Arrays`（数组）是复杂的变量。一个 `array`\
  \ 在单个变量名下存储一组值。数组对于存储相关值非常有用。例如，你可以将有关衬衫的信息（如尺码、颜色和成本）存储在一个名为 `$shirtinfo` 的数组中。数组中的信息可以很容易地处理、访问和修改。例如，PHP\
  \ 有几种排序数组的方法。接下来的章节将为你介绍数组的详细信息。\n\n### 创建数组\n\n创建数组最简单的方法是在变量名末尾使用方括号 `[]` 给其分配一个值。例如，假设你在程序早先的任何地方都没有引用过\
  \ `$pets`，以下语句创建一个名为 `$pets` 的数组：\n\n```php\n$pets[1] = “dragon”;\n```\n\n此时，名为\
  \ `$pets` 的数组已创建，并且仅有一个值：`dragon`。接下来，你使用以下语句：\n\n```php\n$pets[2] = “unicorn”;\n\
  $pets[3] = “tiger”;\n```\n\n现在，数组 `$pets` 包含了三个值：`dragon`、`unicorn` 和 `tiger`。\n\
  \n数组可以被视为一组 `key/value pairs`（键/值对）。要获取特定值，你需要在括号中指定 `key`。在前面的数组中，键是数字——`1`、`2`\
  \ 和 `3`。然而，你也可以使用单词作为键。例如，以下语句创建一个州首府数组：\n\n```php\n$capitals[‘CA’] = “Sacramento”;\n\
  $capitals[‘TX’] = “Austin”;\n$capitals[‘OR’] = “Salem”;\n```\n\n你可以使用简写形式，而不是为每个数字编写单独的赋值语句。一种简写使用了以下语句：\n\
  \n```php\n$pets[] = “dragon”;\n$pets[] = “unicorn”;\n$pets[] = “tiger”;\n```\n\n\
  当你使用这种简写创建数组时，值会自动分配序列键。当你使用这种简写创建数组时，值会自动分配序列键。当你使用这种简写创建数组时，值会自动分配序列键。\n\n```\n\
  $pets[] = \"\";\n```\n\n```php\n$pets[3] = “\";\n```\n```\n\n虽然这个语句将 `$pets[3]`\
  \ 设置为空字符串，但它并没有从数组中删除该字符串。你仍然拥有一个具有五个值的数组，其中一个值为空。要完全从数组中删除该项，你需要用以下语句 `unset` 它：\n\
  \n```php\nunset($pets[3]);\n```\n\n\n\n\n现在你的数组中只有四个值。`$pets[3]` 已被完全移除。数组现在包含四个元素：\n\
  \n`$pets[0] = dragon`\n`$pets[1] = unicorn`\n`$pets[2] = tiger`\n`$pets[4] = parrot`\n\
  \n# 数组排序\n\n数组最实的功能之一是 PHP 可以为它们进行排序。PHP 最初按照你创建元素的顺序存储数组元素。通常情况下，你在显示数组时想要更改这种顺序。例如，你可能想按值或键的字母顺序显示数组。\n\
  \nPHP 可以以多种方式对数组进行排序。要对以数字作为键的数组进行排序，可以使用如下 `sort` 语句：\n\n```php\nsort($pets);\n\
  ```\n\n该语句按值进行排序，并分配相应的数字作为新键。当值是字符串时，先按数字排序，接着是大写字母，最后是小写字母。当值是数字时，按数值顺序排序。不建议对包含混合值（部分字符串，部分数字）的数组进行排序，因为排序结果可能会产生意想不到的结果。\n\
  \n## 第 7 章：程序的 PHP 构建模块\n\n###考虑在前节中创建的 `$pets` 数组：\n\n```php\n$pets[0] = “dragon”;\n\
  $pets[1] = “unicorn”;\n$pets[2] = “tiger”;\n```\n\n执行以下排序语句后：\n\n```php\nsort($pets);\n\
  ```\n\n数组变为：\n\n```php\n$pets[0] = “dragon”;\n$pets[1] = “tiger”;\n$pets[2] = “unicorn”;\n\
  ```\n\n如果你使用 `sort()` 对以单词作为键的数组进行排序，键将更改为数字，单词键会被丢弃。\n\n要对以单词作为键的数组进行排序，请使用 `asort`\
  \ 语句。该语句按值对大写字母进行排序，但为每个值保留原始键，而不是分配数字键。例如，考虑在前节中创建的州府数组：\n\n```php\n$capitals['CA']\
  \ = “Sacramento”;\n$capitals['TX'] = “Austin”;\n$capitals['OR'] = “Salem”;\n```\n\
  \n执行以下排序语句后：\n\n```php\nasort($capitals);\n```\n\n数组变为：\n\n```php\n$capitals['TX']\
  \ = “Austin”;\n$capitals['CA'] = “Sacramento”;\n$capitals['OR'] = “Salem”;\n```\n\
  \n注意，当元素重新排序时，键与值保持在一起。现在元素是按字母顺序排列的，且正确的州键仍然对应相应的州府。如果键是数字，那么这些数字现在将处于不同的顺序。例如，如果原始数组是：\n\
  \n```php\n$capitals[1] = “Sacramento”;\n$capitals[2] = “Austin”;\n$capitals[3] =\
  \ “Salem”;\n```\n\n执行 `asort` 语句后，新数组将是：\n\n```php\n$capitals[2] = Austin\n$capitals[1]\
  \ = Sacramento\n$capitals[3] = Salem\n```\n\n你可能不想对一个以数字作为键的数组使用 `asort`。其他几个排序语句以其他方式进行排序。表\
  \ 7-3 列出了所有可排序语句。\n\n### 表 7-3：你可以对数组排序的方法\n\n| 排序语句 | 作用 |\n| :--- | :--- |\n|\
  \ `sort($arrayname)` | 按值排序；分配新数字作为键 |\n| `asort($arrayname)` | 按值排序；保留原有键 |\n|\
  \ `rsort($arrayname)` | 按值反序排序；分配新数字作为键 |\n| `arsort($arrayname)` | 按值反序排序；保留原有键\
  \ |\n| `ksort($arrayname)` | 按键排序 |\n| `krsort($arrayname)` | 按键反序排序 |\n| `usort($arrayname,\
  \ $functionname)` | 按函数排序（参见本章后半部分的“使用函数”） |\n\n# 从数组中获取值\n\n你你可以通过直接访问来检索数组中的任何单独值。这里有一个示例：\n\
  \n```php\n$CAcapital = $capitals['CA'];\necho $CAcapital;\n```\n\n这些语句的输出是：\n`Sacramento`\n\
  \n如果你在语句中使用不存在的数组元素，则会显示一个注意（notice）。（阅读第 6 章中关于注意的内容。）例如，假设你使用以下语句：\n\n```php\n\
  $CAcapital = $capitals['CAx'];\n```\n\n如果数组 `$capitals` 存在但没有键为 `CAx` 的元素，你会看到以下注意：\n\
  \n**Notice**: Undefined index: CAx in `d:\\testarray.php` on line `9`\n\n注意不会导致脚本停止。注意之后的语句将继续执行。但由于没有值被放入\
  \ `$CAcapital`，任何随后的 `echo` 语句都将输出空白。你可以通过使用 `@` 符号防止显示该注意：\n\n```php\n@$CAcapital\
  \ = $capitals['CAx'];\n```\n\n你可以使用 `list` 语句一次从数组中获取多个值，或者通过使用 `extract` 语句获取数组中的所有值。`list`\
  \ 语句从数组中获取值并将它们放入变量中。以下语句包含 `list` 语句：\n\n```php\n$shirtInfo = array (“blue”, “large”,\
  \ 12.00);\nlist($firstvalue,$secondvalue) = $shirtInfo;\necho $firstvalue;<br />\n\
  echo $secondvalue;<br />\n```\n\n上述第一行创建了 `$shirtInfo` 数组。第二行设置了 `$firstvalue` 和\
  \ `$secondvalue`。输出是：\n`blue`\n`large`\n\n你可以使用 `extract` 从带键的数组获取所有值。例如，假设你定义 `$shirtInfo`\
  \ 如下：\n\n```php\n$shirtInfo = array (“color”=>blue, “size”=>large, “cost”=>12.00);\n\
  ```\n\n以下语句获取所有信息：\n\n```php\nextract($shirtInfo);\necho “size is $size; color is\
  \ $color; cost is $cost”;\n\n### 遍历数组\n\n你通常想对数组中的每个值执行某些操作。你可能想 `echo` 每个值、将每个值存储到数据库中或对数组中的每个值进行计算。在技术术语中，遍历每个值被称为*迭代*。它有时也被称为*巡游*。遍历数组有两种方法：\n\
  \n1. **手动**：将指针从一个数组值移动到另一个。\n2. **使用 `foreach`**：从头到尾自动遍历数组。\n\n## 手动数组\n\n你可以使用指针手动遍历数组。为此，将你的数组想象成列表。想象一个指针指向一个值。指针会停在一个值上，直到你移动它。可以使用以下指令移动指针：\n\
  \n- `current($arrayname)`：引用指针当前指向的值；不移动指针。\n- `next($arrayname)`：移动指针到当前值之后的值。\n\
  - `previous($arrayname)`：移动指针到当前位置之前的值。\n- `end($arrayname)`：移动指针到数组的最后一个值。\n- `reset($arrayname)`：移动指针到数组的第一个值。\n\
  \n以下语句手动遍历包含州府的数组：\n\n```php\n$value = current ($capitals);\necho “$value<br />”;\n\
  \n$value = next ($capitals);\necho “$value<br />”;\n\n$value = next ($capitals);\n\
  echo “$value<br />”;\n```\n\n除非你之前移动过指针，否则开始时指针位于第一个元素。如果你认为数组指针在脚本早些时候可能移动过，请在开始遍历之前使用\
  \ `reset` 语句。\n\n\n\n这种方法赋予了你灵活性。你可以以任何方式遍历数组——而不只是一次处理一个值。你可以向后移动、直接跳转到末尾、通过连续使用两个\
  \ `next` 语句跳过每一个其他值，或者使用任何有用的方法。然而，如果你想从头到尾一次一个值地遍历数组，PHP 提供了 `foreach`，它能以高效得的方式完成你所需。`foreach`\
  \ 将在下一节中介绍。\n\n### 使用 foreach 遍历数组\n\n`foreach` 每次通过一个值来遍历数组。在每次执行语句块时，可以使用数组的当前键（key）和值（value）。其通用格式如下：\n\
  \n```php\nforeach( $arrayname as $keyname => $valuename )\n{\n    block of statements;\n\
  }\n```\n\n请填写以下信息：\n\n- ✓ `arrayname`: 你正在遍历的数组名称。\n- ✓ `keyname`: 你想要存储“键”的变量名称。`keyname`\
  \ 是可选的。如果你省略了 `$keyname =>`，则只将值放入一个可以在语句块中使用的变量中。\n- ✓ `valuename`: 你想要存储“值”的变量名称。\n\
  \n例如，以下 `foreach` 语句遍历了州首示例数组并回输一个列表：\n\n```php\n$capitals = array“CA” => “Sacramento”,\
  \ “TX” => “Austin”, “OR” => “Salem” );\nksort($capitals);\nforeach( $capitals as\
  \ $state => $city )\n{\n    echo “$city, $state<br />”;\n}\n```\n\n前面的语句产生以下 Web\
  \ 页面输出：\n\nSacramento, CA\nSalem, OR\nAustin, TX\n\n你可以用以下行替换前面语句中的 `foreach` 句：\n\
  \n```php\nforeach( $capitals as $city )\n```\n\n当使用这个 `foreach` 语句时，只有城市名称可以输出。你将需要使用下面的\
  \ `echo` 语句：\n\n```php\necho “$city<br />”;\n```\n\n这些更改后的输出为：\n\nSacramento\nSalem\n\
  Austin\n\n当 `foreach` 开始遍历数组时，它会将指针移动到数组的开头。在用 `foreach` 遍历数组之前，不需要重置数组。\n\n###\
  \ 多维数组\n\n在本章的前面的章节中，我描述了作为单一键值对列表的数组。然而，在某些情况下，你可能想存储具有多个键的值。例如，假设你想将这些产品价格一起存储在一个变量中：\n\
  \n- ✓ shirt, 20.00\n- ✓ pants, 22.50\n- ✓ blanket, 25.00\n- ✓ bedspread, 50.00\n\
  - ✓ lamp, 44.00\n- ✓ rug, 75.00\n\n你可以像下面将这些产品存储在数组中：\n\n```php\n$productPrices['shirt']\
  \ = 20.00;\n$productPrices['pants'] = 22.50;\n$productPrices['blanket'] = 25.00;\n\
  $productPrices['bedspread'] = 50.00;\n$productPrices['lamp'] = 44.00;\n$productPrices['rug']\
  \ = 75.00;\n```\n\n你的程序可以在需要知道价格时轻松地查找此数组。但假设你有 3000 个产品。你的程序需要遍历 3000 个产品才能找到键为\
  \ `shirt` 或 `rug` 的产品。注意，产品和价格列表包含了各种产品，它们可以被归类为：服装、床用品和家具。如果你对产品进行分类，程序只需要查找一个分类就能找到正确的价格。对产品进行分类会高效得多。你可以通过如下方式将成本放在多维数组中对产品进行分类：\n\
  \n```php\n$productPrices['clothing'] = 20.00;\n$productPrices['pants'] = 22.50;\n\
  $productPrices['linens'] = 25.00;\n$productPrices['bedspread'] = 50.00;\n$productPrices['furniture']\
  \ = 44.00;\n$productPrices['rug'] = 75.00;\n```\n\n这种数组是多维数组，因为它类似于一个数组的数组。图 7-1\
  \ 显示了 `$productPrices` 作为数组的数组的结构。该图显示 `$productPrices` 有三个键值对。键是 clothing、linens\
  \ 和 furniture。每个键的值都是包含两个键值对的数组。例如，键 `clothing` 的值是一个包含两个键值对的数组：`shirt/20.00` 和\
  \ `pants/22.50`（根据上下文）。\n\nPHP 也可以理解深达四、五层或更多层的多维数组。然而，如果我尝试理解一个超过三层的数组，我的头就开始疼了。当维度增加时，混淆的可能性随之增加。\n\
  \n你可以使用与处理一维数组相同的步骤从多维数组中获取值。例如，你可以通过此语句直接访问值：\n\n```php\n$shirtPrice = $productPrices['clothing']['shirt'];\n\
  ```\n\n你也可以输出该值：\n\n```php\necho $productPrices['clothing']['shirt'];\n```\n\n然而，如果你在双引号内组合该值，你需要使用大括号来包裹变量名。开始变量名的\
  \ `$` 必须紧跟在 `{` 后面，没有空格，如下：\n\n```php\necho \"The price of a shirt is ${productPrices['clothing']['shirt']}\"\
  ;\n```\n\n注意第一个美元符号 (`$`) 前面的反斜杠 (`\\`)。该反斜杠告诉 PHP `$` 是一个字面上的美元符号，而不是变量名的开头。输出是：\n\
  \nThe price of a shirt is $20\n\n你可以通过使用 `foreach` 语句遍历多维数组。你需要为每个数组一个 `foreach`\
  \ 语句。一个 `foreach` 语句位于另一个 `foreach` 语句内部。将语句放在其他语句内部被称为嵌套。\n\n因为二维数组（例如 `$productPrices`）包含数组，所以需要两个\
  \ `foreach` 语句来遍历它。以下语句从多维数组中获取值并在 HTML 表格中输出它们：\n\n```php\necho \"<table border='1'>\"\
  ;\nforeach( $productPrices as $category )\n{\n    foreach( $category as $product\
  \ => $price )\n    {\n        $f_price = sprintf(\"%01.2f\", $price);\n        echo\
  \ \"<tr><td>$product:</td><td>$$f_price</td></tr>\";\n    }\n}\necho \"</table>\"\
  ;\n```\n\n图 7-2 显示了这些 PHP 语句产生的 Web 页面。这里是程序解释这些语句的方式：\n\n1. 输出表格标签。\n2. 获取 `$productPrices`\
  \ 数组中的第一个键值对并将值存在变量 `$category`。该值是一个数组。\n3. 获取 `$category` 数组中的第一个键值对。将键存入 `$product`，将值存入\
  \ `$price`。\n4. 将 `$price` 中的值格式化为正确的货币格式。\n5. 输出该产品及其价格的表格行。\n6. 获取 `$category`\
  \ 数组中的下一个键值对。\n7. 格式化价格并输出下一个产品及其价格的表格行。\n8. 因为 `$category` 中没有更多键值对，内部 `foreach`\
  \ 语句结束。\n9. 获取外部 `foreach` 语句中的下一个键值对。将下一个值存入 `$category`，这是一个数组。\n10. 重复步骤 2-9，直到到达最后一个\
  \ `$category` 数组的最后一个键值对。内部 `foreach` 语句结束。外部 `foreach` 语句结束。\n11. 输出 `</table>`\
  \ 标签结束表格。\n\n换句话，外部 `foreach` 从数组的第一个键值对开始。键是 clothing，该对的值是一个数组，被放入变量 `$category`\
  \ 中。内部 `foreach` 然后遍历 `$category` 中的数组。当它到达 `$category` 的最后一个键值对时，它结束了。程序随后回到外部循环，继续处理第二个键/\n\
  \n\n\n\n键值对 . . 等直到外层的 `foreach` 到达数组末尾。\n\n## 有用的条件语句\n\n条件语句仅在满足特定条件时执行一个语句块。这里有两种有用的条件语句类型：\n\
  \n- ✓ `if statement:` 设置一个条件并对其进行测试。如果条件为真，则执行该语句块。\n- ✓ `switch statement:` 设置一组备选条件。测试为真的条件并执行相应的语句块。\n\
  \n### **第 7 章：PHP 程序的构建模块**\n\n我将在接下来的两个部分中详细详细描述这些语句。\n\n### 使用 if 语句\n\n`if` 语句询问某些条件是否存在。语句块的执行取决于满足了哪些条件。`if`\
  \ 条件语句的一般格式如下：\n\n```php\nif( condition ... )\n{\n    block of statements\n}\nelseif(\
  \ condition ... )\n{\n    block of statements\n}\nelse\n{\n    block of statements\n\
  }\n```\n\n`if` 语句由三个部分组成：\n\n- ✓ `if:` 该部分是必须的。它测试一个条件。\n    - **如果条件为真：** 执行语句块。语句执行后，程序移动到条件语句之后的下一条指令；如果条件语句包含任何\
  \ `elseif` 或 `else` 部分，程序将跳过它们。\n    - **如果条件为假：** 不执行语句块。程序跳过到下一条指令，该指令可以是 `elseif`、`else`\
  \ 或 `if` 条件语句之后的下一条指令。\n- ✓ `elseif:` 该部分是可选的。它测试一个条件。如果你需要，可以使用多个 `elseif` 部分。\n\
  \    - **如果条件为真：** 执行语句块。执行语句块后，程序转到条件语句之后的下一条指令；如果 `if` 语句包含任何额外的 `elseif` 部分或\
  \ `else` 部分，程序将跳过它们。\n    - **如果条件为假：** 不执行语句块。程序跳过到下一条指令，该指令可以是 `elseif`、`else`\
  \ 或 `if` 条件语句之后的下一条指令。\n- ✓ `else:` 该部分是可选的。只允许一个 `else` 部分。该部分不测试条件；而是执行语句块。如果程序进入了此部分，意味着\
  \ `if` 部分和所有 `elseif` 部分均为假。\n\n`if` 条件语句的每个部分都测试由一个或多个比较组成的条件。比较询问一个可以为真或假的问题。某些条件如下：\n\
  \n```php\n$a == 1;\n$a < $b\n$c != “Hello”\n```\n\n第一个比较询问 `$a` 是否等于 `1`；第二个比较询问\
  \ `$a` 是否小于 `$b`；第三个比较询问 `$c` 是否不等于 `\"Hello\"`。你可以通过 `and`、`or` 或 `xor` 连接比较符号，从而在一个条件中使用两个或多个比较。我将在第\
  \ 6 章中详细讨论值的比较和使用多个比较。\n\n接下来的示例使用了 `if` 条件语句的所有三个部分。假设你的产品目录有德语、法语、意大利语和英语版本。你希望程序根据客户的居住地显示正确的语言版本。以下语句将一个被设置为正确的目录版本（取决于客户居住的国家），并用正确的语言设置消息。然后你可以用相应的语言显示消息。\n\
  \n```php\nif($country == “Germany” )\n{\n    $version = “German”;\n    $message\
  \ = “Sie sehen unseren Katalog auf Deutsch”;\n}\nelseif($country == „France“ )\n\
  {\n    $version = „French“;\n    $message = “Vous verrez notre catalogue en francais”;\n\
  }\nelseif($country == „Italy“ )\n{\n    $version = „Italian“;\n    $message = „Vedrete\
  \ il nostro catalogo in Italiano“;\n}\nelse\n{\n    $version = „English“;\n    $message\
  \ = „You will see our catalog in English“;\n}\n\necho “$message<br />”;\n```\n\n\
  ### **第 7 章：PHP 程序的构建模块**\n\n`if` 条件语句的执行过程如下：\n\n1. 将变量 `$country` 与 `\"Germany\"\
  ` 进行比较。如果相同，则将 `$version` 设置为 `\"German\"`，用德语设置 `$message`，程序跳到 `echo`。如果 `$country`\
  \ 不等于 Germany，则 `$version` 和 `$message` 不被设置，程序跳到第一个 `elseif` 部分。\n2. 将变量 `$country`\
  \ 与 `\"France\"` 进行比较。如果相同，则设置 `$version` 和 `$message`，程序跳到 `echo` 语句。如果 `$country`\
  \ 不等于 France，则 `$version` 和 `$message` 不被设置，程序跳到第二个 `elseif` 部分。\n3. 将变量 `$country`\
  \ 与 `\"Italy\"` 进行比较。如果相同，则将 `$version` 设置为 `\"Italian\"`，程序跳到 `echo` 语句。如果 `$country`\
  \ 不等于 Italy，则 `$version` 和 `$message` 不被设置，程序跳到 `else` 部分。\n4. `$version` 设置为英语，`$message`\
  \ 设置为英语。程序继续执行 `echo` 语句。\n\n注意，在这个示例中只回显了消息。然而，变量 `$version` 被存储了，因为版本信息是程序稍后可以使用的有用信息。\n\
  \n当 `if` 条件语句的任何部分要执行的语句块只包含一个语句时，则不需要大括号。例如，如果前面的示例在块中仅有一个语句：\n\n```php\nif($country\
  \ == “France”)\n{\n    $version = “French”;\n}\n```\n\n你可以这样写它：\n\n```php\nif($country\
  \ == “France” )\n$version = “French”;\n```\n\n这种简写可以节省一些输入工作，但当你使用多个 `if` 语句时可能会导致混淆。\n\
  \n你可以在一个 `if` 条件语句内部嵌套另一个 `if` 条件语句。将一个语句放在另一个内部是*常见的。例如，假设你需要联系所有居住在爱达荷州（Idaho）的客户。你计划向有电子邮件地址的人发送电子邮件，向没有电子邮件地址的人发送信件。你可以使用以下嵌套的\
  \ `if` 语句来识别客户群：\n\n```php\nif( $custState == “ID” )\n{\n    if( $EmailAdd != “”\
  \ )\n    {\n        $contactMethod = “email”;\n    }\n    else\n    {\n        $contactMethod\
  \ = “letter”;\n    }\n}\nelse\n{\n    $contactMethod = “none needed”;\n}\n```\n\n\
  这些语句首先检查客户是否住在爱达荷州。如果客户确实住在爱达荷州，程序将测试电子邮件地址。如果电子邮件不为空，则将联系方式设置为 email。如果电子邮件为空，则联系方式设置为\
  \ letter。如果客户不住在爱达荷州，`else` 部分将设置联系方式，表示该客户将不会被联系。\n\n### 使用 switch 语句\n\n对于大多数情况，`if\
  \ if` 条件语句效果最好。然而，有时你有一组条件列表，并希望为每个条件执行不同的语句。例如，假设你的程序在计算销售税。你如何处理不同州的销售税率？\n\n\
  `switch` 语句就是为这类情况设计的。\n\n`switch` 语句测试一个变量的值，并为该变量的匹配值执行语句块。一般格式如下：\n\n```php\n\
  switch ( $variablename )\n{\n    case value :\n        block of statements;\n  \
  \      break;\n    case value :\n        block of statements;\n        break;\n\
  \    ...\n    default:\n        block of statements;\n        break;\n}\n```\n\n\
  ### **第 7 章：PHP 程序的构建模块**\n\n`switch` 语句测试 `$variablename` 的值。程序跳转到该值的 `case` 部分并执行语句，直到遇到\
  \ `break` 语句或 `switch` 语句结束。如果 `$variablename` 的值没有 `case` 部分，程序执行 `default` 部分。你可以根据需要使用任意多个\
  \ `case` 部分。`default` 部分是可选的。如果你使用了 `default` 部分，习惯是将 `default` 部分放在最后，但它也可以放在任何位置。\n\
  \n\n\n\n以下语句设置了不同州的销售税率：`switch ( $custState )`\n\n```\n{\ncase \" OR \" :\n  $salestaxrate\
  \ = 0;\n  break;\ncase \" CA \" :\n  $salestaxrate = 1.0;\n  break;\ndefault:\n\
  \  $salestaxrate = .5;\n  break;\n}\n```\n\n`$salestax = $orderTotalCost * $salestaxrate;`\
  \ 在这种情况下，俄勒冈州的税率为 0，加利福福尼亚州的税率为 100%，而所有其他州的税率均为 50%。`switch` 语句检查 `$custState`\
  \ 的值，并跳转到匹配该值的部分。例如，如果 `$custState` 为 `TX`，程序将执行 `default` 部分并将 `$salestaxrate`\
  \ 设置为 `.5`。在 `switch` 语句之后，程序计算 `$salestax` 为订单成本的 `.5` 倍。\n\n`break` 语句在 `case`\
  \ 部分是至关重要的。如果一个 `case` 部分不包含 `break` 语句，程序*不会*在 `case` 部分结束时停止执行。程序将继续执行 `case`\
  \ 部分结束后的语句，进入下一个 `case` 部分，一直遇到后续 `case` 部分中的 `break` 语句或 `switch` 语句的结束。\n\n`switch`\
  \ 语句中的最后一个 `case` 部分实际上不需要 `break` 语句。你可以省略它，但为了清晰起见，包含它是一个好主意。\n\n## 使用循环\n\n`循环`\
  \ 在程序中被频繁使用，用于设置一组重复执行的语句。有时，循环会重复指定的次数。例如，一个输出所有州首会的循环需要重复 50 次。\n\n有时，循环会一直重复直到某个条件存在。例如，一个显示所有产品信息的循环需要一直重复到显示完所有产品，无论有多少产品。这里有三种类型的循环：\n\
  \n-   **基础 for 循环：**设置一个计数器；在计数器达到指定数字之前重复语句块。\n-   **while 循环：**设置一个条件；检查该条件；如果条件为真，则重复一个语句块。\n\
  -   **do..while 循环：**设置一个条件；执行一个语句块；检查该条件；如果条件为真，则重复该语句块。\n\n我将在接下来的几节中详细描述这些循环。\n\
  \n### 使用 for 循环\n\n最基础的 `for` 循环基于计数器。你设置计数器的起始值、设置结束值，并设置计数器的增量方式。其通用格式为：\n\n```\n\
  for(startingvalue; endingcondition; increment)\n{\n  block of statements;\n}\n```\n\
  \n填入以下值：\n\n-   `startingvalue`：一个语句，用于设置一个变量作为你的计数器并将其赋值为起始值。例如，语句 `$i=1;` 将 `$i`\
  \ 设置为计数器变量并赋值为 1。通常情况下，计数器变量从 0 或 1 开始。起始值可以是数字组合 `(2 + 2)` 或一个变量。\n-   `endingcondition`：一个设置你结束值的语句。只要该语句为真，语句块就会不断重复。当该语句为假时，循环结束。例如，语句\
  \ `$i<10;` 将循环的结束值设置为 10。当 `$i` 等于 10 时，该语句不再为真（因为 `$i` 不再小于 10），循环停止。该语句可以包含变量，例如\
  \ `$i<$`。\n-   `increment`：一个增加你计数器值的语句。例如，语句 `$i++;` 在每个语句块结束时给计数器加 1。你可以使用其他增量语句，例如\
  \ `$i+=1;` 或 `$i--;`。\n\n基础 `for` 循环设置了一个变量——例如一个名为 `$i` 的变量——作为计数器。该变量在每次循环中都有值。变量\
  \ `$i` 可以用于重复的语句块中。例如，以下简单循环会显示三次 Hello World!：\n\n```\nfor($i=1;$i<=3;$i++)\n{\n\
  \  echo $i;\n}\n```\nPHP 并不在乎块中的语句是否缩进。然而，对语句块进行缩进会让你更容易理解。\n\n`for` 循环在遍历数组时特别有用。假设你有一个客户名称数组并想要显示所有名称。你可以轻松地通过循环做到这一点：\n\
  \n```\nfor($i=0;$i<100;$i++)\n{\n  echo $customerNames[$i];\n}\n```\n输出将显示一个包含所有客户名称列表的\
  \ Web 页面，每行一个。但假设你不知道有多少客户。你可以询问 PHP 数组中有多少个值，并在你的 `for` 循环中使用该值。例如，你可以使用以下语句：\n\
  \n```\nfor($i=0;$i<sizeof($customerNames);$i++)\n{\n  echo $customerNames[$i];\n\
  }\n```\n注意结束值是 `sizeof($customerNames)`。该语句会找出数组中值的个数并使用该数字。这样，你的循环重复的次数就与值的个数完全一致。带有索引的数组中，第一个值是\
  \ 0，除非你刻意将其设置为不同的数字。处理数组时的一个常见错误是将第一个数字误认为是 1 而不是 0。\n\n### 使用 while 循环\n\n`while`\
  \ 循环只要某些条件为真就会持续重复。循环的工作原理如下：\n\n1.  你设置一个条件。\n2.  在每次循环的顶部测试该条件。\n3.  如果条件为真，循环重复。如果条件为假，循环停止。\n\
  \n`while` 循环的通用格式为：\n\n```\nwhile(condition)\n{\n  block of statements\n}\n```\n\
  \n`condition` 是任何可以判断为真或假的表达式。比较操作经常用作条件：\n\n-   `$test <= 10`\n-   `$test1 == $test2`\n\
  -   `$a == \"yes\"` 和 `$b != \"yes\"`\n-   `$name != \"Smith\"`\n\n只要条件为真，循环就会重复。以下语句设置了一个\
  \ `while` 循环，在数组中查找名为 Smith 的客户：\n\n```\n$customers = array( \"Huang\", \"Smith\"\
  , \"Jones\" );\n$testvar = \"no\";\n$k = 0;\nwhile( $testvar != \"yes\" )\n{\n \
  \ if($customers[$k] == \"Smith\" )\n  {\n    $testvar = \"yes\";\n    echo \"Smith<br>\"\
  ;\n  }\n  else\n  {\n    echo \"$customers[$k], not Smith<br>\";\n  }\n  $k++;\n\
  }\n```\n\n这些语句将在 Web 页面上显示：\n\nHuang, not Smith\nSmith\n\n程序执行如下：\n\n1. 在循环前设置变量：`$customers`（包含三个值的数组）、`$testvar`（设置为\
  \ \"no\" 的测试变量）和 `$k`（设置为 0 的计数器）。\n2. 启动循环，测试 `$testvar != \"yes\"` 是否真。因为 `$testvar`\
  \ 设置为 \"no\"，该语句为真，循环继续。\n3. 测试 `if` 语句：`$customers[$k] == \"Smith\"` 是否真？此时 `$k`\
  \ 为 0，程序检查 `$customers[0]`。因为 `$customers[0]` 是 \"Huang\"，该语句为假。`if` 块中的语句不执行，因此程序跳转到\
  \ `else` 语句。\n4. 执行 `else` 块中的语句。`else` 块输出 \"Huang, not Smith\"。这是输出的第一行。\n5. `$k`\
  \ 加 1，现在它等于 1。\n6. 到达循环底部。\n7. 回到循环顶部。\n8. 再次测试条件：`$testvar != \"yes\"` 是否真？因为 `$testvar`\
  \ 尚未被改变且仍为 \"no\"，它是真的，循环继续。\n9. 测试 `if` 语句：`$customers[$k] == \"Smith\"` 是否真？此时\
  \ `$k` 为 1，程序检查 `$customers[1]`。因为 `$customers[1]` 是 \"Smith\"，该语句为真。因此循环进入 `if`\
  \ 块。\n10. 执行 `if` 块中的语句。\n\n\n\n\n将 `$testvar` 设置为“yes”。输出“Smith”。这是输出的第二行。\n\n\
  11. 给 `$k` 增加 `1`，现在它等于 `2`。\n12. 到达循环底部。\n13. 回到循环顶部。\n\n# 第三部分：PHP\n\n19614. 再次测试条件。\n\
  \n`$testvar != “yes”` 为真吗？因为 `$testvar` 已经改变并且现在被设置为“yes”，所以它*不是*真的。循环停止。\n\n可以编写一个无限的\
  \ `while` 循环——即条件始终为真的循环。如果条件永远不会变为假，循环永远不会结束。关于无限循环的讨论，请参阅本章稍后的“无限循环”部分。\n\n###\
  \ 使用 do..while 循环\n\n`do..while` 循环与 `while` 循环相似。只要某些条件为真，`do..while` 循环就会持续重复。你设置一个条件。该条件会在每个循环的底部进行测试。如果条件为真，循环就会重复。当条件不为真时，循环停止。\n\
  \n`do..while` 循环的通用格式为：\n\n```\ndo\n{\n    语句块\n} while( condition );\n```\n\n以下语句建立了一个寻找名为\
  \ Smith 的客户的循环。该程序与上一节中使用 `while` 循环的程序的功能相同：\n\n```php\n$customers = array( “Huang”,\
  \ “Smith”, “Jones” );\n$testvar = “no”;\n$k = 0;\ndo\n{\n    if ($customers[$k]\
  \ == “Smith” )\n    {\n        $testvar = “yes”;\n        echo “Smith<br />”;\n\
  \    }\n    else\n    {\n        echo “$customers[$k], not Smith<br />”;\n    }\n\
  \    $k++;\n} while ( $testvar != “yes” );\n```\n\n这些语句在浏览器中的输出是：\n\nHuang, not\
  \ Smith\nSmith\n\n# 第 7 章：用于程序的 PHP 模块\n\n197 这与 `while` 循环示例显示的输出相同。`while` 循环和\
  \ `do..while` 循环的区别在于检查条件的位置。在 `while` 循环中，条件在循环顶部被检查。因此，如果条件永远为假，循环将永远不会执行。在 `do..while`\
  \ 循环中，条件在循环底部被检查。因此，即使条件永远为假，循环也至少执行一次。\n\n例如，在前面检查名称 Smith 的循环中，假设通过使用此语句：$testvar\
  \ = “yes”;` 将原始条件设置为 yes 而不是 no。\n\n该条件从开始测试即为假。它永远不会为真。在 `while` 循环中，将没有输出。语句块将永远不会运行。然而，在\
  \ `do..while` 循环中，语句块会在测试条件之前运行一次。因此，`while` 循环将不会产生输出，但 `do..while` 循环将产生以下输出：Huang,\
  \ not Smith。\n\n`do..while` 循环在测试条件之前产生一行输出。它不会产生第二行输出，因为条件测试结果为假。\n\n## 无限循环\n\n\
  你可以轻松地设置循环让它们永远不会停止。这些是*无限循环*。它们会永远重复。然而，很少有人刻意创建无限循环。这通常是编程中的错误。例如，对设置 `while`\
  \ 循环的程序进行细微更改就可能使其变成无限循环。\n\n这里是本章前面“使用 while 循环”部分所示的程序：\n\n```php\n$customers\
  \ = array ( “Huang”, “Smith”, “Jones” );\n$testvar = “no”;\n$k = 0;\nwhile ( $testvar\
  \ != “yes” )\n{\n    if ($customers[$k] == “Smith” )\n    {\n        $testvar =\
  \ “yes”;\n        echo “Smith<br />”;\n    }\n    else\n    {\n        echo “$customers[$k],\
  \ not Smith<br />”;\n    }\n    $k++;\n}\n```\n\n198 第三部分：PHP\n\n这里是带有更改的程序：\n\n\
  ```php\n$customers = array ( “Huang”, “Smith”, “Jones” );\n$testvar = “no”;\n$k\
  \ = 0;\nwhile ( $testvar != “yes” )\n{\n    if ($customers[$k] == “Smith” )\n  \
  \  {\n        $testvar = “yes”;\n        echo “Smith<br />”;\n    }\n    else\n\
  \    {\n        echo “$customers[$k], not Smith<br />”;\n    }\n}\n```\n\n这里是带有细微更改的程序：\n\
  \n```php\n$customers = array ( “Huang”, “Smith”, “Jones” );\n$testvar = “no”;\n\
  $k = 0;\nwhile ( $testvar != “yes” )\n{\n    if ($customers[$k] == “Smith” )\n \
  \   {\n        $testvar = “yes”;\n        echo “Smith<br />”;\n    }\n    else\n\
  \    {\n        echo “$customers[$k], not Smith<br />”;\n    }\n    $k++;\n}\n```\n\
  \n将 `$k = 0;` 语句从循环外部移动到循环内部。这个细微更改使其变成了无限循环。\n\n```php\n$customers = array ( “Huang”,\
  \ “Smith”, “Jones” );\n$testvar = “no”;\nwhile ( $testvar != “yes” )\n{\n    $k\
  \ = 0;\n    if ($customers[$k] == “Smith” )\n    {\n        $testvar = “yes”;\n\
  \        echo “Smith<br />”;\n    }\n    else\n    {\n        echo “$customers[$k],\
  \ not Smith<br />”;\n    }\n    $k++;\n}\n```\n\n这个程序的输出是：\n\nHuang, not Smith\n\
  Huang, not Smith\nHuang, not Smith\n...\n\n这个循环永远重复。每次循环运行时，它都会将 `$k` 重置为 `0`。因此，数组中的第一个值\
  \ Huang 始终被读取。循环永远不会到达 `$testvar` 设置为 “yes”。\n\n如果你写了无限循环，不要感到尴尬。我保证世界上编程大师也写过很多无限循环。如果你在测试程序时发现网页上不断输出，你可以修复它。一个常见的错误是使用单等号（=）而不是双等号（==）。这会导致条件始终为真。\n\
  \n### 跳出循环\n\n有时你可能希望程序跳出循环。PHP 提供了两个语句来实现此目的：\n\n- `break`: 完全跳出循环并继续执行循环后的语句。\n\
  - `continue`: 跳到循环的末尾，在那里测试条件。如果条件为真，程序将从循环顶部继续。\n\n`break` 和 `continue` 通常用于条件语句。特别是\
  \ `break`，正如我在本章早些部分讨论的，它常用于 `switch` 语句。\n\n以下两组语句展示了 `continue` 和 `break` 之间的区别。第一组语句使用\
  \ `break` 语句：\n\n```php\n$counter = 0;\nwhile ( $counter < 5 )\n{\n    $counter++;\n\
  \    if ($counter == 3 )\n    {\n        echo “break<br />”;\n        break;\n \
  \   }\n    echo “End of while loop: counter=$counter<br />”;\n}\necho “After the\
  \ break loop<br />”;\n```\n\n200 第三部分：PHP\n\n第二组语句使用 `continue` 语句：\n\n```php\n\
  $counter = 0;\nwhile ( $counter < 5 )\n{\n    $counter++;\n    if ($counter == 3\
  \ )\n    {\n        echo “continue<br />”;\n        continue;\n    }\n    echo “End\
  \ of while loop: counter=$counter<br />”;\n}\necho “After the continue loop<br />”;\n\
  ```\n\n这些语句构建了两个循环，除了第一个使用 `break` 而第二个使用 `continue` 之外。使用 `break` 语句的第一组语句输出在你的浏览器中显示如下：\n\
  \nEnd of while loop: counter=1\nEnd of while loop: counter=2\nbreak\nAfter the break\
  \ loop\n\n使用 `continue` 语句的第二组语句输出为：\n\nEnd of while loop: counter=1\nEnd of while\
  \ loop: counter=2\ncontinue\nEnd of while loop: counter=4\nEnd of while loop: counter=5\n\
  After the continue loop\n\n\n\n第一个循环在 `break` 语句处结束。它停止循环并立即跳转到循环后的语句。第二个循环不会在 `continue`\
  \ 语句处结束。它只是停止循环的第三次重复，并跳转回循环顶部。然后它通过第四次和第五次重复完成循环，最后才到循环后的语句。`break` 语句的一个用途是防止死循环。循环内部以下语句可以在合理点停止循环：\n\
  \n```\n$testinfinity++;\nif ($testinfinity > 100) {\n    break;\n}\n```\n\n# 函数\n\
  \n应用程序通常会在程序的不同位置或不同的程序中执行相同的任务。例如，你的应用程序可能会在多个页面或程序的不同部分显示 Logo。假设你使用以下语句显示 Logo：\n\
  \n```php\necho \"<div style='float: left'><hr style='width: 50'>\\n<img src='/images/logo.jpg'\
  \ width='50' height='50' />\\n<hr style='width: 50'></div>\";\n```\n\n你可以创建一个包含上述语句的函数并将其命名为\
  \ `display_logo`。然后每当程序需要显示 Logo 时，你只需要通过简单的函数调用来调用它，如下：\n\n```php\ndisplay_logo();\n\
  ```\n\n注意函数名后的括号。函数调用中必须包含这些括号，因为它们告诉 PHP 这是一个函数。使用函数有几个优点：\n\n- **更少输入：** 你只需要在函数中输入一次语句。从此以后，你只需要使用函数调用，再也不需要输入这些语句了。\n\
  - **更易读：** `display_logo()` 让人一目就能更容易理解。\n- **更少错误：** 在你编写函数并修复了它的所有问题后，它会在你使用它的任何地方运行。\n\
  - **更容易修改：** 如果你决定更改执行任务的方式，你只需要在一个地方进行更改。你只需要修改函数，而不是在程序中寻找执行该任务的所有不同地方并修改所有地方的代码。例如，假设你更改了存储\
  \ Logo 的文件名。你只需要在一个地方（即函数中）更改文件名，它就会处处生效。\n\n你可以通过将代码放入函数块来创建函数。通用格式如下：\n\n```php\n\
  function functionname() {\n    block of statements;\n    return;\n}\n```\n\n例如，你使用以下语句创建了显示\
  \ Logo 的函数：\n\n```php\nfunction display_logo() {\n    echo \"<div style='float:\
  \ left'><hr style='width: 50'>\\n<img src='/images/logo.jpg' width='50' height='50'\
  \ />\\n<hr style='width: 50'></div>\";\n    return;\n}\n```\n\n`return` 语句会停止函数并返回主程序。函数末尾的\
  \ `return` 不是必须的，但它让函数更容易理解。它通常用于函数的条件结束。假设你的函数显示一个电子产品目录。你可能在函数的开头使用以下语句：\n\n```php\n\
  if ($age < 13) {\n    return;\n}\n```\n\n如果客户年龄小于 13 岁，函数将停止，不会显示电子产品目录。\n\n你可以将函数放在程序的任何地方，但通常的做法是将所有函数放在程序文件的开头或结尾。你计划在多个程序中使用的函数可以放在单独的文件中。每个程序都从外部文件访问这些函数。关于将应用程序组织到文件中以及访问单独文件的更多信息，请参阅第\
  \ 10 章。\n\n注意，示例函数非常简单。它没有使用变量，也没有与主程序共享任何信息。它只是在被调用时执行独立任务。只要你了解规则和限制，你就可以在函数中使用变量并在函数与主程序之间传递信息。本章的其余部分解释了如何使用变量和传递值。\n\
  \n# 在函数中使用变量\n\n你可以创建并使用局部于函数的变量。也就是说，你可以在函数内部创建并使用变量。然而，该变量在函数外部不可用；主程序无法使用。\n\n\
  你可以通过使用名为 `global` 的特殊语句让变量在程序的任何位置可用。例如，以下函数创建了一个变量：\n\n```php\nfunction format_name()\
  \ {\n    $first_name = \"Goliath\";\n    $last_name = \"Smith\";\n    $name = $last_name\
  \ . \",\" . $first_name;\n    return;\n}\n\nformat_name();\necho \"$name\";\n```\n\
  \n这些语句不会产生输出。在 `echo` 语句中， `$name` 不包含任何值。变量 `$name` 是函数内部创建的，因此它在函数外部不存在。\n\n要在函数内部创建一个函数外部存在的变量，你需要使用\
  \ `global` 语句。以下语句展示了：\n\n```php\nfunction format_name() {\n    $first_name = \"\
  Goliath\";\n    $last_name = \"Smith\";\n    global $name;\n    $name = $last_name\
  \ . \",\" . $first_name;\n    return;\n}\n\nformat_name();\necho \"$name\";\n```\n\
  \n现在程序输出：Smith, Goliath\n\n\n\n第一行显示该函数期望两个值，如下：`function compute_salestax($amount,$custState)`\n\
  \n最后一行是函数调用，它按预期值将两个值传递给函数 `compute_salestax`，正如它所预期的那样。传递的是订单金额和客户所在的州。该程序的输出结果为\
  \ 2000，因为加利福尼亚州的税率为 100%。\n\n# 206 第三部分：PHP\n\n你可以根据需要传递任意数量的值。值可以是变量，也可以是数值，包括计算后的值。以下函数调用都是有效的：`compute_salestax(2000,”CA”);`、`compute_salestax(2*1000,””);`\
  \ 以及 `compute_salestax(2000,”C”.”A”);`。\n\n值可以通过数组传递。函数接收变量作为数组。例如，以下语句传递了一个数组：\n\
  \n```\n$arrayofnumbers = array( 100, 200);\naddnumbers($arrayofnumbers);\n```\n\n\
  函数接收整个数组。例如，假设函数从以下语句开始：\n\n```\nfunction addnumbers($numbers)\n```\n\n变量 `$numbers`\
  \ 是一个数组。函数可以包含如下语句：\n\n```\n$total = $numbers[0] + $numbers[1];\n```\n\n传递的值是按位置传递的。也就是说，你传递的列表中的第一个值将用作函数期望列表中的第一个值，第二个值用于第二个，依此类推。如果你的值顺序不一致，函数在执行任务时将使用错误的值。例如，对于\
  \ `compute_salestax`，你可能会以错误的顺序传递值调用 `compute_salestax`：\n\n```\ncompute_salestax($custState,$orderCost);\n\
  ```\n\n函数将州（state）视为订单成本，并将其设置为 0，因为传递的值是一个字符串。它将州设置为 `$orderCost` 中的数字，但这与它的任何一个类别都不匹配。输出结果将是\
  \ 0。\n\n如果你发送的值不足，函数会将缺失的值对于字符串变量类型设为空字符串，对于数字变量类型则设为 0。如果你发送的值过多，函数将忽略多余的值。\n\n\
  如果你向函数传递了错误数量的值，可能会收到一条警告消息，取决于 PHP 设置的错误消息级别：`Warning`: Missing argument 2 for\
  \ `compute_salestax()` in `/test7.php` on line `5`。\n\n# 第 7 章：程序的 PHP 构建模块 ## 207\n\
  \n关于警告消息的解释，请参阅第 6 章。\n\n你可以设置在未传递值时使用的默认值。在编写函数时，通过为它期望的值分配默认值来设置默认，如下：\n\n```\n\
  function add_2_numbers($num1=1,$num2=1)\n{\n$total = $num1 + $num2;\necho $total;\n\
  return;\n}\n```\n\n如果一个或两个值未传递，函数将使用分配的默认值。但如果传递了值，则使用该值代替默认值。例如，你可以使用以下调用之一：\n\n\
  ```\nadd_2_numbers(2,2);\nadd_2_numbers(2);\nadd_2_numbers();\n```\n\n按顺序出现的结果如下：\n\
  \n```\n$total = 4\n$total = 3\n$total = 2\n```\n\n## 从函数获取值\n\n当你调用函数时，可以像上一节描述的那样传递值。函数还可以使用\
  \ `return` 语句将值传回调用它的程序。程序可以将该值存储在变量中，或直接使用该值，例如在条件语句中使用。`return` 语句还将控制权交回主程序；也就是说它会停止函数。\n\
  \n`return` 语句的通用格式为：\n\n`return *value*;`\n\n例如，在前节的税收程序中，我使用以下语句输出销售税：\n\n```\n\
  $salestax = $amount * $salestaxrate;\necho “$salestax<br />”;\n```\n\n## 208 第三部分：PHP\n\
  \n我可以使用以下语句将销售税传回主程序，而不是输出它：\n\n```\n$salestax = $amount * $salestaxrate;\nreturn\
  \ $salestax;\n```\n\n事实上，我可以使用快捷方式，通过一条语句将其传回主程序：\n\n```\nreturn $amount * $salestaxrate;\n\
  ```\n\n`return` 语句将 `salestax` 传回主程序并结束函数。主程序可以用任何通常的方式使用该值。以下语句以有效的方式使用了函数调用：\n\
  \n```\n$salestax = compute_salestax($cost,$custState);\n$totalcost = $cost + compute_salestax($cost,$custState);\n\
  if( compute_salestax($cost,$custState) > 100000.00 )\n$echo “Thank you very, very,\
  \ very much”;\nforeach($customerOrder as $amount)\n{\n$total = $amount + compute_salestax($amount,$custState);\n\
  echo “Your total is $total”;\n}\n```\n\n`return` 语句只能返回一个值。但返回值可以是数组，因此你实际上可以从函数返回多个值。\n\
  \n你可以在条件语句中使用 `return` 语句为不同的条件返回不同的值。例如，以下函数根据不同条件返回两个字符串之一：\n\n```\nfunction compare_values($value1,$value2)\n\
  {\nif($value1 < $value2)\n{\nreturn “less than”;\n}\nelse\n{\nreturn “not less than”;\n\
  }\n}\n```\n\n209\n\n\n\n从 PHP 5 开始，PHP 提供了两组用于与 MySQL 通信的函数：一组函数（`mysqli` 函数）用于\
  \ MySQL 4.1 及更高版本，另一组函数（`mysql` 函数）用于 MySQL 4.0 及更早版本。大多数 Web 托管提供商都提供 MySQL 5.0\
  \ 或 5.1 实例。如果他们只提供更早版本的 MySQL，你可能需要联系技术支持人员，询问他们何时会提供更新版本的 MySQL。\n\n如果你在 Web 托管提供商处使用\
  \ PHP 5，那么 `mysqli` 函数应该是可用的。如果只有 `mysql` 函数可用，请联系你 Web 托管提供商的技术支持，并要求他们激活 `mysqli`\
  \ 函数。在使用 PHP 5 或更高版本时，没有理由继续使用 `mysql` 函数。\n\n在你的本地计算机上，如果你按照书中的建议并在附录 A 中描述通过 XAMPP\
  \ 安装了软件，那么你的电脑上运行着 PHP 5，且 `mysql` 和 `mysqli` 函数都是可用的。\n\n你可以通过 XAMPP 主页切换到 PHP\
  \ 4，但通常没有理由这样做。除非你需要维护一个用 PHP 4 编写的现有网站，否则你不应该使用 PHP 4，因为它现在已经过时，且 PHP 开发者不再对其进行更新。对于学习\
  \ PHP 和开发任何新网站，你应该使用 PHP 5，或者在 PHP 6 发布后使用它。\n\n如果你出于某些原因在使用 PHP 4，则 `mysqli` 函数是不可用的。\n\
  \n相反，即使在使用较新版本的 MySQL，你也必须使用 `mysql` 函数。`mysql` 函数可以与后版本的 MySQL 通信，但它们无法访问后版本中添加的一些新功能。\n\
  \n`mysql` 函数在 PHP 4 中会自动激活。\n\n在整本书中，我的示例和程序都使用 MySQL 5.1，并使用 `mysqli` 函数与 MySQL\
  \ 通信。用于 MySQL 5.1 的 PHP 函数具有以下通用格式：\n\n```\nmysqli_function(value,value,...);\n\
  ```\n\n函数名中的 `i` 代表 `improved`（改进版 MySQL）。函数名的第二部分是特定于函数的，通常是一个描述该函数功能的单词。此外，该函数需要传递一个或多个值，用于指定数据库连接或数据位置等信息。以下是本章讨论的两个函数：\n\
  \n**第 8 章：数据输入，数据输出** 213\n\n```\nmysqli_connect(connection information);\nmysqli_query($cxn,\"\
  SQL statement\");\n```\n\n如果你正在使用 PHP 4 或正在与 MySQL 4.0 或更早版本通信，对应的 `mysql` 函数是：\n\
  \n```\nmysql_connect(connection information);\nmysql_query(\"SQL statement\");\n\
  ```\n\n这些函数的功能和语法是类似的，但对于所有函数并不完全相同。如果你需要使用 `mysql` 函数而不是 `mysqli` 函数，你需要编辑书中的程序，将\
  \ `mysqli` 函数替换为 `mysql` 函数。表 8-1 显示了等等的 `mysql` 函数及其语法。\n\n**表 8-1**\n**mysql 和\
  \ mysqli 函数的语法**\n\n| mysqli 函数 | mysql 函数 |\n| :--- | :--- |\n| `mysqli_connect($host,$user,$passwd,$dbname)`\
  \ | `connect($host,$user,$passwd)` |\n| `mysqli_select_db($dbname)` | `mysql_select_db($dbname)`\
  \ |\n| `mysqli_errno($cxn)` | `mysql_errno()` 或 `mysql_errno($cxn)` |\n| `mysqli_error($cxn)`\
  \ | `mysql_error()` 或 `mysql_error($cxn)` |\n| `mysqli_fetch_array($result)` | `mysql_fetch_array($result)`\
