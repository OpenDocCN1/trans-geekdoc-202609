  md: '# # 13 - ReAct: Reason + Act


    # ## 13.1 - What Is It?


    The ReAct (Reason + Act) framework represents an approach in the field of Large
    Language Models.


    Think of ReAct like a chef who not only tells you the recipe step-by-step but
    also occasionally steps out to get fresh ingredients.


    In this case, the “reasoning” part of ReAct is like the chef explaining each step.
    It allows the model to formulate plans, adjust them when necessary, and tackle
    unexpected issues.


    The “act” part is when our chef fetches the ingredients. This represents the model’s
    ability to communicate with external databases or tools to gather new data or
    insights, ensuring its responses are accurate and up-to-date. When ReAct combines
    these two capabilities, reasoning and acting, it does so in a coordinated manner,
    much like a chef adjusting a recipe based on the available ingredients.


    This innovative blend allows ReAct to perform exceptionally well on tasks, producing
    solutions that are both human-like and easily understood, ultimately boosting
    our confidence in the model’s abilities.


    In a research paper titled ReAct: Synergizing Reasoning and Acting in Language
    Models⁴⁹ (Yao, S., Zhao, J., Yu, D., Du, N., Shafran, I., Narasimhan, K., & Cao,
    Y. (2022)), the authors studied how Large Language Models can be made more effective
    by combining reasoning (like thinking through steps) and acting (like making plans).
    Instead of studying them separately, they interweave the two.


    ⁴⁹https://arxiv.org/pdf/2210.03629.pdf'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Language models are getting better at reasoning (e.g., chain-of-thought prompting)
    and acting (e.g., WebGPT, SayCan, ACT-1), but these two directions have remained
    separate.


    This means the model can think through its steps, adjust its plans, and even gather
    more data from outside sources. They named this approach “ReAct.” They tested
    ReAct on various tasks, like answering questions and verifying facts, and it performed
    very well. For example, when tasked with answering questions or verifying facts,
    ReAct could avoid common mistakes by using a Wikipedia API. It also performed
    better than other methods on tasks like online shopping, demonstrating its effectiveness
    and adaptability in different situations.


    On two interactive decision-making benchmarks (ALFWorld and WebShop), ReAct outperforms
    imitation and reinforcement learning methods by an absolute success rate of 34%
    and 10% respectively, while being prompted with only one or two in-context examples.


    We are going to better understand ReAct by looking at a practical example.


