    # 15.4 - Creating Your First Prompt Flow


    Make sure you are on the “Flows” tab, then click on “Create”, you’ll see the following
    screen:


    ![](img/ee54af4a0c9d9a4beda42d94caa5229b_144_0.png)


    Various flow types are available for creation, including:


    +   Standard Flow: This flow integrates Large Language Models, custom Python scripts,
    the Serp API, and other tools to design a personalized prompt flow. It allows
    for testing with custom datasets and offers straightforward deployment as an endpoint.

    Chat Flow: Building upon the standard flow, the chat flow incorporates that history
    support and offers an intuitive chat interface within the authoring/debugging
    user interface.

    Evaluation Flow: This flow is designed to assess the alignment of the output with
    predefined criteria and objectives.'
