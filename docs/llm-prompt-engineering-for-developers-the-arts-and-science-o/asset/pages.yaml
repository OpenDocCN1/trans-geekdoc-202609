    \n\n# ... repeat the same structure for other languages like es, fr, de, and it.\n\
    ```\n\n# 17.7 - Streamlining the Test with promptfoo Scenarios\n\nTesting models\
    \ or prompts with diverse inputs often leads to repetitive and manual test case\
    \ creation - a tedious and error-prone task. PromptFoo introduces Scenarios to\
    \ alleviate this. This feature bundles related data sets with uniform tests, eliminating\
    \ the need for repetitive test definitions.\n\nFor example, instead of crafting\
    \ separate tests for weather conditions like \"Sunny\", \"Rainy\", or \"Cloudy\"\
    , scenarios allow grouping these and testing against consistent expected outcomes.\
    \ The result? Efficient, organized, and comprehensive testing. Embrace Scenarios\
    \ in PromptFoo for a refined testing experience.\n\nLet's consider an example."
