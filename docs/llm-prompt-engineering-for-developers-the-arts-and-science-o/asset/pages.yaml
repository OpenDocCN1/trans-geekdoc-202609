    # 19.3 - Customer Service


    AI-powered chatbots and virtual assistants benefit from prompt engineering to
    provide relevant and context-aware responses to customer inquiries and support
    requests. The quality and effectiveness of a chatbot or virtual assistant depend
    on the quality of the prompts used to train it and its capacity to understand
    the user’s prompt and generate a relevant response. Chatbots use NLP techniques
    to analyze the user’s query.


    Before generating a response, the chatbot executes some steps on the query text
    (normalization). The process of text normalization typically involves several
    sub-steps:


    +   * **Lowercasing**: This involves converting all characters to lowercase to
    ensure consistent comparisons and avoid duplications due to case variations (e.g.,
    "Apple" and "apple" are treated as the same word).

    * **Tokenization**: This involves splitting the text into individual words or
    tokens to break down the text into smaller units for analysis.

    * **Removing punctuation**: This involves removing punctuation marks (e.g., periods,
    commas, exclamation marks) to eliminate noise and simplify the text.


    $^{87}$ https://contentscale.ai/'
  merge: -1
  img_proc: true
- pgno: 274
  md: "+   - **Expanding contractions**: This involves expanding contracted forms,\
    \ such as “can’t” to “cannot,” “won’t” to “will not,” etc., to represent the full\
    \ words and standardize the language.\n\n+   - **Removing special characters**:\
    \ This involves removing special characters, symbols, and emojis from the text\
    \ to focus on the main content (e.g., HTML tags, emoticons, etc.).\n\n+   - **Handling\
    \ numbers**: This involves converting numerical expressions to words (e.g., “10”\
    \ to “ten”) or removing them entirely, depending on the context and task.\n\n\
    +   - **Stopword removal**: This involves eliminating common and non-contextual\
    \ words, such as “the,” “is,” “and,” etc., that do not add significant meaning\
    \ to the text.\n\n+   - **Lemmatization or stemming**: This involves reducing\
    \ words to their base or root form (lemmas) to group together variations of the\
    \ same word (e.g., “running,” “runs,” “ran” to “run”).\n\n+   - **Handling abbreviations**:\
    \ This involves expanding abbreviations to their full forms (e.g., “USA” to “United\
    \ States of America”).\n\n+   - **Spelling correction**: This involves correcting\
    \ spelling mistakes to ensure accurate language processing.\n\nThe following is\
    \ a very basic text normalization function in Python. It uses libraries like nltk\
    \ and re to perform tasks such as lowercase conversion, tokenization, punctuation\
    \ removal, and more.\n\n```\nimport nltk\nimport re\nfrom nltk.corpus import stopwords\n\
    from nltk.tokenize import word_tokenize\n\nnltk.download('punkt')\nnltk.download('stopwords')\n\
    \ndef text_normalization(text):\n    # Convert text to lowercase\n    text = text.lower()\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 275
  md: '```

    # Remove punctuation using regular expressions

    text = re.sub(r''[^\w\s]'', '''', text)

    # Tokenize the text into words

    words = word_tokenize(text)

    # Remove stopwords

    stop_words = set(stopwords.words(''english''))

    words = [word for word in words if word not in stop_words]

    # Lemmatization using NLTK''s WordNetLemmatizer

    lemmatizer = nltk.WordNetLemmatizer()

    words = [lemmatizer.lemmatize(word) for word in words]

    # Join the words back into a normalized sentence

    normalized_text = '' ''.join(words)


    return normalized_text

    ```


    ```

    # Test the function

    input_text = "This is a sample sentence, showing off the stop words filtration."

    normalized_text = text_normalization(input_text)

    print(normalized_text)

    ```


