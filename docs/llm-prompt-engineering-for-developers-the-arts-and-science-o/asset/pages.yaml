- pgno: 234
  md: "A suitable illustration here would be testing a model's response to weather\
    \ conditions, particularly when a user is preparing for a hike. Our prompts provide\
    \ a concise instruction to the model and a weather condition. With the user planning\
    \ a hike, the system's role is clear: to guide the user appropriately.\n\nFor\
    \ instance, when the user mentions that it's \"Sunny\", the system advises that\
    \ it's an excellent day for outdoor activities, citing temperature and humidity.\n\
    \nExecute the following command to create a new prompts.txt file:\n\n```\ncat\
    \ << EOF > prompts.txt\n[\n  {\"role\": \"system\", \"content\": \"Provide a weather-related\
    \ recommendati\\on based on the user's input. context: the user is going for a\
    \ hike\"},\n  {\"role\": \"user\", \"content\": \"Sunny\"},\n  {\"role\": \"assistant\"\
    , \"content\": \"It's a great day for outdoor activi\\\nties! Temperature: 25°C,\
    \ Humidity: 40%\"}\n]\n---\n[\n  {\"role\": \"system\", \"content\": \"Provide\
    \ a weather-related recommendati\\on based on the user's input. context: the user\
    \ is going for a hike\"},\n  {\"role\": \"user\", \"content\": \"Rainy\"},\n \
    \ {\"role\": \"assistant\", \"content\": \"Don't forget your umbrella! Tempe\\\
    nature: 18°C, Humidity: 90%\"}\n]\n---\n[\n  {\"role\": \"system\", \"content\"\
    : \"Provide a weather-related recommendati\\on based on the user's input. context:\
    \ the user is going for a hike\"},\n  {\"role\": \"user\", \"content\": \"Cloudy\"\
    },\n  {\"role\": \"assistant\", \"content\": \"You might need a jacket today.\
    \ Tem\\perature: 20°C, Humidity: 60%\"}\n]\nEOF\n```"
  merge: -1
  img_proc: true
- pgno: 235
  md: "Scenarios are then used to organize our data. In this case, three different\
    \ weather conditions: “Sunny”, “Rainy”, and “Cloudy”. Each condition is paired\
    \ with the expected advice, temperature, and humidity.\nFor example, on a sunny\
    \ day, the anticipated advice is to bring sunscreen, with the expected temperature\
    \ being 25°C and humidity at 40%.\nExecute the following command to create a new\
    \ promptfooconfig.yaml file:\n\n```\n```bash\ncat << EOF > promptfooconfig.yaml\n\
    prompts: [prompts.txt]\nproviders: [openai:gpt-3.5-turbo-0613]\nscenarios:\n \
    \ - config:\n      - vars:\n          weatherCondition: Sunny\n          expectedAdvice:\
    \ \"If you are going for a hike, bring sunscreen\\.\"\n\n          expectedTemperature:\
    \ \"25°C\"\n          expectedHumidity: \"40%\"\n      - vars:\n          weatherCondition:\
    \ Rainy\n          expectedAdvice: \"If you are going for a hike, bring an umbrella\\\
    .\"\n\n          expectedTemperature: \"18°C\"\n          expectedHumidity: \"\
    90%\"\n      - vars:\n          weatherCondition: Cloudy\n          expectedAdvice:\
    \ \"If you are going for a hike, bring a jacket.\"\n          expectedTemperature:\
    \ \"20°C\"\n          expectedHumidity: \"60%\"\ntests:\n  - description: Forecast\
    \ Advice based on Weather Condition\n    vars:\n      input: '{{weatherCondition}}'\n\
    \    assert:\n      - type: similar\n```\n```"
  merge: -1
  img_proc: true
