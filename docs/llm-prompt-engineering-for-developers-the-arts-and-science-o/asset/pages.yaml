  img_proc: true
- pgno: 90
  md: 'For instance, on the GSM8K task, there was an improvement of 17.9% in accuracy.


    In practice, if we take this question:


    If you have 5 apples and eat 2, how many are left?


    The model using CoT might use the following reasoning path as a learning example:


    You start with 5 apples. You eat 2 of them. So, 5 minus 2 equals 3 apples. The
    answer is 3 apples left.


    On the other hand, a self-consistency model explores multiple ways of thinking
    about a problem to ensure its answer is correct. For the same question, the model
    might be prompted to think of different ways to solve it, such as:


    You had 5 apples and after eating 2, you have 3 left


    and


    Start with 5 apples, and if 2 are gone when eaten, that leaves 3 apples


    and


    If there were 5 apples and 2 are no longer there because you ate them, then 5
    minus 2 equals 3 apples remaining.


    Since all these different reasoning paths lead to the answer “3 apples”, the model
    gains confidence that 3 is the correct answer. So, while CoT provides a clear
    breakdown of the thought process, self-consistency cross-checks the problem in
    various ways to ensure the reliability of the answer.


    When implementing self-consistency, it’s recommended to provide as many examples
    as possible. This helps the model explore more reasoning paths'
