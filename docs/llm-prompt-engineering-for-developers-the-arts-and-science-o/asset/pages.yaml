- pgno: 225
  md: "```\ncat << EOF > promptfooconfig.yaml\nprompts: [prompts.txt]\nproviders:\
    \ [openai:completion:text-davinci-002]\ntests:\n  - description: Test 1\n    assert:\n\
    \      - type: contains\n        value: 25 years old\nEOF\n```\n\nUsing the assert\
    \ property, we can check if the model’s answer contains the expected answer. This\
    \ is the list of all the available assertions:\n\n+   - equals: output matches\
    \ exactly\n- contains: output contains substring\n- icontains: output contains\
    \ substring, case insensitive\n- regex: output matches regex\n- starts-with: output\
    \ starts with string\n- contains-any: output contains any of the listed substrings\n\
    - contains-all: output contains all of the listed substrings\n- is-json: output\
    \ is valid json (optional json schema validation)\n- contains-json: output contains\
    \ valid json (optional json schema validation)\n- javascript: provided Javascript\
    \ function validates the output\n- python: provided Python function validates\
    \ the output\n- webhook: provided webhook returns\n- similar: embeddings and cosine\
    \ similarity are above a threshold\n- llm-rubric: LLM output matches a given rubric,\
    \ using a Language Model to grade output\n- rouge-n: Rouge-N score is above a\
    \ given threshold\n- levenshtein: Levenshtein distance is below a threshold"
