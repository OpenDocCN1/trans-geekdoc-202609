    Firstly, you need to have an Azure subscription. If you don’t have one, you can
    create a free account here54, then go to the Azure ML Studio55 and create a new
    workspace. Click on the workspace, and then choose “Prompt flow” from the left
    menu.


    53 https://learn.microsoft.com/en-us/azure/machine-learning/prompt-flow/overview-what-is-prompt-flow


    54 https://azure.microsoft.com/en-us/free/


    55 https://ml.azure.com/'
