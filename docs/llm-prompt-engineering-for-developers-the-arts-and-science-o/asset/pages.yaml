- pgno: 176
  md: "+   - BasePromptTemplate: This is the base class for all prompt templates,\
    \ returning a prompt.\n- ABC: This is a helper class that provides a standard\
    \ way to create an ABC using inheritance (ABC stands for Abstract Base Class).\n\
    \nWhile chat prompt templates are designed to produce chat prompts, string prompt\
    \ templates provide a simple interface for generating prompts. We are going to\
    \ use StringPromptTemplate to create a custom prompt template.\n\nTo create a\
    \ custom prompt template, we need two things:\n\n+   - input_variables: A list\
    \ of input variables for the prompt template.\n- format: A method that takes in\
    \ keyword arguments and returns a formatted prompt.\n\nHere is an example:\n\n\
    ```\n```python\nfrom langchain.prompts import StringPromptTemplate\nfrom pydantic\
    \ import BaseModel, validator\n\nPROMPT = \"\"\"\\\nGenerate a pet name for {pet_description}\n\
    \"\"\"\n\nclass PetNameGeneratorPromptTemplate(StringPromptTemplate, BaseModel):\
    \ \\\n\n    @validator(\"input_variables\")\n    def validate_input_variables(cls,\
    \ v):\n        \"\"\"Validate that the input variables are correct.\"\"\"\n  \
    \      if len(v) != 1 or \"pet_description\" not in v:\n            raise ValueError(\"\
    pet_description must be the only input_variable.\")\n        return v\n```\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\ndef format(self, **kwargs) -> str:\n    # Generate the prompt to be sent\
    \ to the language model\n    prompt = PROMPT.format(\n        pet_description=kwargs[\"\
    pet_description\"],\n    )\n    return prompt\n\ndef _prompt_type(self):\n   \
    \ return \"pet-name-generator\"\n```\n\n```\npet_name_template = PetNameGeneratorPromptTemplate(input_variables=[\"\
    pet_description\"])\nuser_input = input(\"Enter a description of your pet. e.g.\
    \ 'A small, fluffy dog.'\\n\")\npet_description = user_input.strip().lower()\n\
    prompt = pet_name_template.format(pet_description=user_input)\nprint(prompt)\n\
