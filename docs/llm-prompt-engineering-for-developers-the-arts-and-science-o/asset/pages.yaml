  md: '# 12 - Perplexity as a Metric for Prompt Optimization


    # 12.1 - Avoid Surprising the Model


    Language models, when given prompts, can tackle a wide array of tasks with little
    to no prior examples. However, their effectiveness hinges greatly on the selected
    prompt. The reasons for this variation aren’t entirely clear. Some researchers
    have delved into the factors causing this discrepancy and proposed an idea: the
    better the model recognizes the language in the prompt, the more effectively it
    performs. Essentially, prompts that are more familiar or “natural” to the model
    yield better outcomes.


    In simpler terms, prompts that are more common in the training data tend to perform
    better. This is because familiar sequences help the model understand and provide
    relevant information. However, it’s challenging to gauge this precisely since
    many language models are trained on vast data, and we don’t always have access
    to this data, as in the case of OpenAI GPT models.


    This hypothesis was studied in the paper “Demystifying Prompts in Language Models
    via Perplexity Estimation” (Gonen, H., Iyer, S., Blevins, T., Smith, N. A., &
    Zettlemoyer, L. (2022)). We are not going to delve deep into the details of the
    paper, but the authors stated that over a wide range of tasks, the lower the perplexity
    of the prompt (i.e., closer to zero) is, the better the prompt is able to perform
    the task.


    Instead of considering the training data, the paper proposes the perplexity of
    the prompt as a proxy used to gauge how often it might appear in the data. This
    method helps bypass the issue of finding an exact match and considers similar
    versions of the prompt. It’s also beneficial because we'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'don’t need to access the vast training data, which isn’t always open to the
    public.


    Over a wide range of tasks, we show that the lower the perplexity of the prompt
    is, the better the prompt is able to perform the task.


    Perplexity is a measure or a metric of how well the model predicts a sample. A
    lower perplexity means the model is more certain and accurate in its predictions,
    while a higher perplexity indicates uncertainty. Think of perplexity as the model’s
    level of “surprise”. If a model reads a sentence and predicts the next word correctly
    without much doubt, it has low perplexity - it’s not very “surprised” by the actual
    next word because it expected it. Conversely, if it struggles to predict the next
    word, its perplexity is high - it’s more “surprised” by the actual word that comes
    next.


    Think of this as giving someone a task in a language they are fluent in versus
    a language they’ve just started learning. Naturally, they’d perform better with
    the familiar language.


    # ## 12.2 - How to Calculate Perplexity?


    In general, perplexity is calculated using the following formula:

    PP(s) = p(w1, w2, ..., wN) ^(-1/N)

    Where:


    +   * **s** is the sample

    * **wx** is a word from the sample

    * **N** is the number of words in the sample

    * **p(wx)** is the probability of the word


    If all words are independent, the formula can be simplified to:

    p(w1, w2, ..., wN) = p(w1) * p(w2) * ... * p(wN)'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'In case the next word depends only on the previous word, the formula can be
    simplified to:


    ```

    p(w1,w2,w3,...,wN) = p(w1) * p(w2|w1) * p(w3|w2) * ... * p(wN|wN-1)

    ```


    To implement the above formula directly, you''d need the joint probability of
    the entire sequence. However, models typically provide probabilities (or log probabilities)
    for one word at a time. That''s why we often work with modified formulas.


    For a given word w with probability p(w), its log probability is log(p(w)). If
    we''re looking at the likelihood of a sequence, instead of multiplying the probabilities,
    we add the log probabilities: log(p(w1,w2,w3,...,wN)) = log(p(w1)) + log(p(w2))
    + ... + log(p(wN))


    However, for log probabilities, a ''good'' or ''likely'' event has a high log
    probability (close to 0), whereas an ''unlikely'' event has a very negative log
    probability. We sometimes talk about the "negative log likelihood" (NLL), which
    is just the negative of the log probability. A higher NLL indicates a less likely
    event.


    Given that we have the NLL for each word in a sequence, the average NLL is: avg
    NLL= -log(p(w1)) - log(p(w2)) - ... - log(p(wN)) / N The perplexity is then: PP
    = exp(avg NLL).


    A practical example using an OpenAI language model translated to Python would
    be:


    ```

    import os

    import openai

    import math


    # Set the model name.

    model_name = "<MODEL_NAME>"


    # Set the API key for OpenAI.

    openai_api_key = os.environ["OPENAI_API_KEY"]

    openai.api_key = openai_api_key

    ```'
