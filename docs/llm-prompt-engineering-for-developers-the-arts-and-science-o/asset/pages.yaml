- pgno: 80
  md: 'Certain problems, such as symbolic and arithmetic reasoning, are complex for
    AI models like GPT. These problems often require a Chain-of-Thought (CoT) instruction
    to assist the model in better understanding the problem. This is because the model
    fundamentally lacks an understanding of the problem''s nature and attempts to
    guess the answer based on its generative capabilities, not logic.


    In our example, the CoT allowed the model to break down a problem into steps that
    are easier to understand. Think of this as a transparent box that enables the
    model to see what''s inside and comprehend the reasoning behind the answer.


    The authors of "[Chain-of-Thought Prompting Elicits Reasoning in Large Language
    Models](https://arxiv.org/abs/2201.11903)" (Wei, J., Wang, X., Schuurmans, D.,
    Bosma, M., Ichter, B., Xia, F., Chi, E., Le, Q., & Zhou, D. (2022)) explored the
    use of the CoT method to improve the reasoning capabilities of large language
    models. They showed that when large models are provided with a few examples of
    this method, they naturally enhance their reasoning abilities. Tests on three
    major language models revealed that this approach improves performance in arithmetic,
    commonsense, and symbolic reasoning tasks. Notably, by using only eight examples
    of this method, a 540B-parameter language model achieved top accuracy on the [GSM8K](https://paperswithcode.com/dataset/gsm8k)
    math word problem benchmark, surpassing even a specialized GPT-3 model.'
  merge: -1
  img_proc: true
