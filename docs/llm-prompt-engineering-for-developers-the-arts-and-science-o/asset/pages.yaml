- pgno: 231
  md: "```\n  value: \"to_lang\"\n  - type: contains\n    value: \"sentence\"\n...\n\
    etc\n```\n\nAs you can see, we are repeating the same assertions for each test\
    \ case. This is not a good practice. Fortunately, promptfoo allows us to use templates\
    \ to reuse assertions. Here is an example:\n\n```\ncat << EOF > promptfooconfig.yaml\n\
    assertionTemplates: &default_assertions\n  - type: is-json\n  - type: contains\n\
    \    value: \"translation\"\n  - type: contains\n    value: \"from_lang\"\n  -\
    \ type: contains\n    value: \"to_lang\"\n  - type: contains\n    value: \"sentence\"\
    \n\nprompts: prompts.txt\nproviders: exec:python lc.py\ntests:\n  - vars:\n  \
    \    fn: translate(Hi, en, dk)\n    assert: *default_assertions\n\n  - vars:\n\
    \      fn: translate(Hi, en, ar)\n    assert: *default_assertions\n\n  - vars:\n\
    \      fn: translate(Hi, en, es)\n    assert: *default_assertions\n```"
  merge: -1
  img_proc: true
- pgno: 232
  md: "```\n- vars:\n    fn: translate(Hi, en, fr)\n  assert: *default_assertions\n\
    \n- vars:\n    fn: translate(Hi, en, de)\n  assert: *default_assertions\n\n- vars:\n\
    \    fn: translate(Hi, en, it)\n  assert: *default_assertions\nEOF\n```\n\nAnother\
    \ possible solution, though not as elegant as the previous one, is to use the\
    \ $ref property:\n\n```\nassertionTemplates:\n  isJson:\n    type: is-json\n \
    \ containsTranslation:\n    type: contains\n    value: \"\\\\translation\\\\\"\
    \n  containsFromLang:\n    type: contains\n    value: \"\\\\from_lang\\\\\"\n\
    \  containsToLang:\n    type: contains\n    value: \"\\\\to_lang\\\\\"\n  containsSentence:\n\
    \    type: contains\n    value: \"\\\\sentence\\\\\"\n\nprompts: prompts.txt\n\
    providers: exec:python lc.py\ntests:\n- vars:\n```"
  merge: -1
