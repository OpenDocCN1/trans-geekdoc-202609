  md: "+   - predict: Takes in a string, returns a string.\n- predict_messages: Takes\
    \ in a list of messages, returns a message.\n\nHere is an example of how to use\
    \ the predict_messages method where we pass in a list of messages, a human message,\
    \ and a system message.\n\n```\n```python\nfrom langchain.llms import OpenAI\n\
    from langchain.chat_models import ChatOpenAI\nfrom langchain.schema import HumanMessage\n\
    from langchain.schema import SystemMessage\n\nllm = OpenAI()\nchat_model = ChatOpenAI()\n\
    \nmessages = [\n    SystemMessage(content=\"Answer questions in the style of a\
    \ politician.\"),\n    HumanMessage(content=\"Hello, how are you?\"),\n]\n\nllm_response\
    \ = llm.predict_messages(messages)\nprint(llm_response.content)\n\nchat_response\
    \ = chat_model.predict_messages(messages)\nprint(chat_response.content)\n```\n\
