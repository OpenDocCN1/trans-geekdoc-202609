    # ## 4.15 - Edit (Deprecated)


    The edit endpoint¹⁹ is used to edit existing text. This endpoint requires two
    prompts:


    +   - The input prompt

    - The instruction prompt


    The first prompt is used to provide the initial text, and the second prompt is
    used to provide the instructions for editing the text.


    Here’s an example of an input prompt:


    When the moon sets, all the birds fly back to their nests.


    Here’s an example of an instruction prompt:


