    # ## 19.5 - Virtual Assistants and Smart Devices


    If you have an Alexa or Google Home device, you’ve probably used it to ask questions
    like “What’s the weather like today?” or “What’s the capital of France?”. These
    devices use basic prompt engineering techniques to understand your questions and
    provide the most relevant answers. The same applies to other virtual assistants
    as well, like Siri and Cortana.


    With the rise of LLMs, virtual assistants will become more sophisticated and capable
    of answering more complex questions. For example, Amazon is developing AlexaTM
    (Alexa Teacher Model) to adapt its virtual assistant capabilities to the age of
    ChatGPT. Prompt engineering techniques will play a crucial role in making this
    possible.


