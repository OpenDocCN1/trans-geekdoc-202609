    \ import PromptTemplate\nimport random\nprompt = PromptTemplate(template=\"{var_x}+{var_y}={var_z}\"\
    , input_variables=[\"var_x\", \"var_y\", \"var_z\"])\n\ndef generate_x():\n  \
    \  # return random number between 0 and 10\n    x = random.randint(0, 10)\n  \
    \  print(\"x: \" + str(x))\n    return x\n\ndef generate_y(x):\n    # return x\
    \ + 1\n    y = x + 1\n    print(\"y: \" + str(y))\n    return y\n\ndef generate_z(x,\
    \ y):\n    # return x + y\n    z = x + y\n    print(\"z: \" + str(z))\n    return\
    \ z\n\nvar_x=generate_x()\nprompt = prompt.partial(var_x=var_x)\n\nvar_y=generate_y(var_x)\n\
    prompt = prompt.partial(var_y=var_y)\n\nvar_z=generate_z(var_x, var_y)\nprompt\
    \ = prompt.partial(var_z=var_z)\n```\n```"
