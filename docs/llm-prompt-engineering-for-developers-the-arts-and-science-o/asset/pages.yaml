    # ## 22.6 - PromptFlow


    PromptFlow$^{101}$ is a toolkit designed for those looking to integrate LLMs into
    applications with minimal coding. It features a graphical flowchart designer where
    users can create nodes, representing either a Prompt, a Python function, or an
    LLM. These nodes are interconnected by pathways that define the application’s
    logic. When activated, PromptFlow processes each node in order, transferring data
    between them. For a deeper dive into its functionalities, users can refer to the
    official documentation$^{102}$.'
