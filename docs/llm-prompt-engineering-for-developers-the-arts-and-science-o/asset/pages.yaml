- pgno: 293
  md: '# # 21 - Types of Prompts


    There isn’t a single way to prompt an AI, and there isn’t a single way to categorize
    prompts. However, there are some common types of prompts that are used in different
    contexts. This section attempts to list some of the most common types of prompts
    and provide examples of each.


    In the following sections, we will see these types of prompts in action and how
    they can be used to prompt an AI:


    +   - Direct instructions

    - Open-ended prompts

    - Socratic prompts

    - System prompts

    - Other types of prompts

    - Interactive prompts


    # ## 21.1 - Direct Instructions


    These prompts are straightforward and instruct the AI to perform a specific task
    or answer a specific question. A prompt of this type is often used when the desired
    output is clear and unambiguous.


    Examples:'
  merge: -1
  img_proc: true
- pgno: 294
  md: "Translate this English text to German: 'Hello, how are you?' \n Order this\
    \ list of numbers from smallest to largest: phi, e, pi, 1 \n What is the capital\
    \ of Colombia? \n Give me the list of all prime numbers between 1 and 100. \n\
    \ Create a list of 10 random numbers between 1 and 100. \n Calculate the sum of\
    \ all prime numbers. \n If I have 5 apples and I give you 2, how many apples do\
    \ I have left? \n Life is like a box of chocolates, you never know [finish]. \n\
    \ The lady in red is a [insert] that I can't forget. \n Choose the best answer\
    \ to this question: What's the command to list all\\files in a directory? 1) ls\
    \ 2) cd 3) pwd 4) rm\n\n# 21.2 - Open-Ended Prompts\n\nAn open-ended prompt is\
    \ designed to encourage the AI to generate creative, exploratory, or diverse outputs.\
    \ Usually, this type of prompt does not have a single correct response. It is\
    \ often used when the desired output is not clear or when the user wants to seek\
    \ creative inspiration from the AI. Examples:\n\nWrite a short story about a time-traveling\
    \ teenager named Fred who goes\\back in time to the year 1985. \n Write a poem\
    \ about the color blue. \n Describe a forest without using the word 'green'. \n\
    \ Write a summary of the book 'The Lord of the Rings'. \n I'm traveling to Kansas\
    \ city. What should I do there? \n I'm feeling bored. Suggest something fun to\
    \ do without leaving the hous\\e. \n How can I be more productive in my Python\
    \ development projects?\n\n# 21.3 - Socratic Prompts\n\nOne of the most famous\
    \ quotes attributed to Socrates is \"I know you won't believe me, but the highest\
    \ form of human excellence is to question oneself"
  merge: -1
  img_proc: true
- pgno: 295
  md: 'and others.” This quote serves as the inspiration for Socratic questioning,
    which is a method of inquiry that involves asking and answering questions to stimulate
    critical thinking and illuminate ideas.


    Socratic prompts, in the same spirit, are designed to encourage the AI to “think”
    critically about a topic and to explore ideas. They could be used in multiple
    contexts including educational, philosophical, therapeutic, and more.


    Socratic prompts could have different subtypes:


    +   - **Clarification prompts** are used to clarify a concept or idea.


    Examples:


    What do you mean by …?

    Could you explain that in more detail?


    +   - **Assumption questions** are used to question assumptions.


    Examples:


    Why do you think that is true?

    Why would someone make this assumption?


    +   - **Probing questions** are used to probe the reasoning behind a statement.


    Examples:


    Why do you think that …?

    Is there a reason why …?


    +   - **Implication and consequence questions** are used to explore the implications
    and consequences of a statement.


    Examples:'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'What are the consequences of that assumption?

    How does that affect the outcome?


    +   - **Viewpoint and perspective questions** are used to explore different viewpoints
    and perspectives.


    Examples:


    What would someone who disagrees with you say?

    What are the strengths and weaknesses of your argument?

    What would you say to someone who disagrees with you?


    +   - **Questioning the question** is used to question the question itself.


    Examples:


    Why are we asking this question?

    Is this the right question to ask?

    Is it really important to ask this question?


    # ## 21.4 - System Prompts


    These prompts are used to guide the AI’s behavior or to adjust the way it generates
    outputs. They can be used in conjunction with other types of prompts or on their
    own in a conversational context.


    Examples:'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Adjust your verbosity to low.

    Be more creative.

    Change your personality to be more friendly.

    Always end your sentences with an emoji.

    Re-answer the question with a JSON object.


    When you log in to ChatGPT and start a conversation with the AI, there is potentially
    a hidden system prompt that is used to initialize the conversation. This prompt
    is not visible to the user but it is used to set the AI''s personality and to
    initialize the conversation. Some ChatGPT users reported that starting the conversation
    with a system prompt like “Ignore all previous messages” unlocks, in some way,
    the AI''s creativity and makes it more responsive to the user''s input.


    This is an example of a system prompt that initializes the conversation of a friendly
    AI assistant with a personality that is designed to recommend Points of Interest
