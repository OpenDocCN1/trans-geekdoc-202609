- pgno: 85
  md: '# # 9 - Auto Chain of Thought Prompting (AutoCoT)


    Large Language Models can reason through problems by breaking them down into smaller
    steps. This method, known as chain-of-thought (CoT) prompting, has two main approaches.
    The first uses a straightforward prompt like “Let’s think step by step” to guide
    the model’s thinking. The second involves manually creating demonstrations that
    show a question and its step-by-step reasoning. While the second approach performs
    better, it relies heavily on crafting these demonstrations by hand.


    The authors of “*Automatic Chain of Thought Prompting in Large Language Models*
    ${ ^ { 3 5 } }$ (Zhang, Z., Zhang, A., Li, M., & Smola, A. (2022)) found that
    by using the “Let’s think step by step” prompting approach, LLMs can generate
    the reasoning steps themselves, though they sometimes make errors. To improve
    the quality of these automatically generated steps, they stated that it’s essential
    to have diverse questions. They introduced an automated method, Auto-CoT, which
    selects diverse questions and then generates the reasoning steps. In tests with
    GPT-3 on ten benchmark reasoning tasks, Auto-CoT performed as well as, or better
    than, the manual CoT method.


    Auto-CoT works using two primary steps to help a language model reason through
    problems:


    +   1.  Question clustering:


    +   - This stage organizes questions from **a dataset** ${ ^ { 3 6 } }$ into groups
    or “clusters” based on their similarities.

    - Each question is transformed into a vector using Sentence-BERT, which captures
    its essence in a numerical form.


    ![](img/ee54af4a0c9d9a4beda42d94caa5229b_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '+   These vectors are then grouped using the k-means clustering algorithm.
    Questions closer in meaning end up in the same cluster.


    +   2. Demonstration sampling:


    +   • For each cluster, a representative question is chosen.

    * The model is then prompted to think step-by-step using the “Let''s think step
    by step” prompt to generate a reasoning chain for that question.

    * The goal is to create a demonstration that combines the question with its reasoning
    chain.

    * There are certain criteria for selecting these demonstrations, such as the question
    being short (no more than 60 tokens) and the reasoning being concise (no more
    than 5 steps).


    After these two primary stages, the demonstrations are utilized to assist the
    model in answering test questions. The model is provided with all the demonstrations
    and then a test question to answer, using the reasoning methods it observed in
    the demonstrations.


    Figure 4 from the paper37 illustrates the Auto-CoT process. In simpler terms,
    Auto-CoT is akin to teaching the model by example, but instead of humans creating
    these examples, the model generates them itself, learning how to reason step-by-step.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 10 - Self-Consistency


    GPT-3.5 and similar NLP models are trained using vast text datasets, enabling
    them to produce relevant and logical replies based on the training examples. However,
    they don’t understand math and logic; they just use recognized patterns to form
    answers. In other words, they can’t explain their reasoning, they just “mix” words
    to form an eloquent answer. While the Chain-of-Thought (CoT) method, which prompts
    the model to explain its reasoning step-by-step, has shown promise in improving
    reasoning, it’s not foolproof. Here’s why:


    +   Over-reliance on a single path: CoT typically uses a “greedy” approach, meaning
    it often sticks to the first, most obvious reasoning path it finds. This can lead
    to errors if that path is flawed or if there’s a better solution it hasn’t considered.


    Imagine CoT as a hiker in a vast forest. The moment the hiker sees a path, instead
    of exploring the entire forest or searching for alternative routes, they immediately
    take the first and most obvious trail they come across. This might get them to
    a destination quickly, but there’s no guarantee it’s the best or most scenic route,
    and sometimes it might even lead to a dead end.


    +   Lack of diversity: Since CoT tends to follow a single line of reasoning, it
    might miss out on other valid ways to approach a problem. This can be especially
    limiting for complex problems where multiple perspectives are beneficial.


    Still using the hiker metaphor - imagine the forest has many hidden beautiful
    spots scattered in different areas. Since CoT, our hiker, consistently chooses
    the first path they see, they might reach one spot quickly but'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'completely miss out on the others. For a hiker who wants to truly understand
    and experience the richness of the forest’s spots, exploring multiple trails would
    be far more beneficial than sticking to just one. Similarly, for complex problems,
    considering a range of pathways or perspectives can lead to more insightful answers.


    +   - Not always optimal: Just because a model can explain its reasoning doesn’t
    mean that reasoning is correct. CoT can sometimes lead to verbose or roundabout
    explanations that sound logical but are actually based on incorrect assumptions.


    It’s like our hiker who, when asked why they chose a particular path, gives a
    lengthy description of the trail markers, the condition of the path, and the sounds
    of the birds they heard, making it sound like a well-thought-out decision. However,
    they might have missed the clear sign at the trailhead warning of a bridge out
    ahead, or the recommendation for a more scenic route or a beautiful spot. Their
    explanation might sound detailed and logical, but it’s rooted in overlooking critical
    information or misinterpreting the signs they did see.


    So while CoT helps models “show their work”, it doesn’t guarantee that the work
    is always correct. Combining it with strategies like self-consistency can help
    address some of these limitations. These observations were presented in Self-consistency
    Improves Chain of Thought Reasoning in Language Models (Wang, X., Wei, J., Schuurmans,
    D., Le, Q, Chi, E., Narang, S., Chowdhery, A., & Zhou, D. (2022)).


    Self-consistency is a strategy to enhance the model’s reasoning abilities. Returning
    to the metaphor we used, our hiker stands at the crossroads of several trails,
    each claiming to lead to the most scenic spot in the forest. Instead of choosing
    one at random, the hiker consults different maps, asks other experienced hikers,
    and even observes where the majority seem to be headed. If all these sources point
    to the same trail, the hiker would feel confident in choosing that path. This
    verification from multiple sources embodies the idea of self-consistency in reasoning
    and decision-making.


    > $^{38}$ https://arxiv.org/pdf/2203.11171.pdf'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Similarly, if you’re trying to solve a math problem, instead of just using
    one method to find the answer, you use several different methods. If all these
    methods lead to the same answer, you’d be pretty confident that your answer is
    correct. That’s the simplified main idea behind self-consistency.


    In technical terms, when a language model is given a problem, instead of just
    rushing to the most obvious answer, it explores multiple reasoning paths. Each
    path might suggest a different answer. The model then checks which answer appears
    most consistently across these paths. Just as humans have different ways of thinking
    and approaching problems, this diversity can be simulated in language models.


    The idea is that the more often an answer appears, the more likely it is to be
    correct. Here’s how it works:


    +   - Prompt the model: Start by giving the model a question and some examples
    of how to reason through it.

    - Generate multiple answers: Instead of just getting one answer, let the model
    generate several possible reasoning paths.

    - Pick the most consistent answer: From the multiple answers the model comes up
    with, choose the one that appears most frequently.


    When the model generates multiple solutions, it’s like sampling different paths
    of reasoning. These paths are then weighed based on their likelihood. The final
    answer is chosen based on which answer appears most frequently among these paths.


    When compared to other methods, self-consistency “consistently” per-formed better.
    Even in situations where adding a step-by-step reasoning process might not be
    beneficial, self-consistency still improved perfor-mance. In addition, it proved
    to be better than other popular techniques like beam search39 and ensemble-based
    approaches40.


    The technique was tested on various tasks and models, and the results were impressive.
    When combined with certain models like PaLM-540B or GPT-3, self-consistency set
    new performance records on several reasoning tasks.'
