    # 17.2 - Testing and Scoring Prompts with promptfoo


    promptFoo\(^{71}\) is a comprehensive tool designed to test and evaluate the output
    quality of Large Language Models. Its main objective is to streamline and improve
    the process of prompt engineering by implementing a test-driven approach, replacing
    the traditional trial-and-error method.


    The tool comes with a variety of features that enable users to test and evaluate
    prompts and models, including:


    +   - **Systematic testing:** This feature enables users to systematically test
    prompts and models using predefined test cases.

    - **Side-by-side evaluation:** This feature facilitates a thorough evaluation
    process by comparing LLM outputs side-by-side, ensuring users can readily discern
    variations and measure quality.

    - **Efficient evaluations:** This feature incorporates caching and concurrency
    features, speeding up evaluations and enhancing user efficiency.

    - **Automatic scoring:** Users can define specific test cases and score outputs
    automatically, simplifying the evaluation process.


    \(^{71}\)[https://github.com/promptfoo/promptfoo](https://github.com/promptfoo/promptfoo)'
