    # 17.4 - promptfoo: Testing with Assertions


    A more advanced use case is the following prompt, in which we attempt to teach
    a chatbot how to solve a math problem using a CoT instruction. Our goal is to
    compare the model’s answer with and without the CoT instruction.


    ```

    cat << EOF > prompts.txt

    When I was 10 years old, my sister was half my age. Now I am 30 years old. How
    old is my sister?

    ---

    user: When Harry was 4 years old, his sister was half of his age. Harry\ is now
    50 years old. How old is his sister?

    ai: When Harry was 4 years old, his sister was 4/2 years old. This mean\s there
    are 2 years difference between them. Harry is now 50 years old.\ His sister is
    50 - 2 = 48 years old.

    user: When I was 10 years old, my sister was half my age. Now I am 30 y\ears old.
    How old is my sister?

    ai:

    EOF

    ```


    > ℹ This example, when copied and pasted into your terminal, will create a prompts.txt
    file with the 2 prompts above. We are using a here document${}^{72}$ to create
    the prompts.txt file. You can also create the file manually if you are not using
    a Linux or Mac machine or if you are not familiar with here documents. Just remove
    the cat `<< EOF > prompts.txt` and `EOF` lines and paste the prompts into the
    file.


    Use this configuration in promptfooconfig.yaml:


    ${}^{72}$https://tldp.org/LDP/abs/html/here-docs.html'
