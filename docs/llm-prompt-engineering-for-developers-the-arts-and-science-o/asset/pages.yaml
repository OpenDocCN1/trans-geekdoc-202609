    # ### 19.4 - Data Analysis, Reporting, and Visualization


    Prompt engineering aids in data exploration and analysis by enabling users to
    ask complex questions and receive insightful responses from AI language models.


    Suppose you have a dataset of customer reviews for a product, and you want to
    explore the sentiments expressed by the customers.


    +   - Without prompts: You could use traditional keyword searches like "positive,"
    "negative," or "neutral" to categorize the sentiments, but this may not capture
    the full complexity of the reviews.

    - With prompts: You can use prompts to ask a more specific and nuanced question
    to the language model, like: "What are the main positive aspects mentioned by
    customers in the reviews?" or "What common complaints do customers have about
    the product?"'
