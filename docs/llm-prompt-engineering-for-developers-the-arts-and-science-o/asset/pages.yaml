    they are just placeholders for the flow’s inputs and outputs. Our goal here is
    to create a prompt and an endpoint that answers this question: “What are the macros
    of 100 grams of a given food?”


    Click on the “inputs” component, and you’ll be able to change the “Inputs” of
    the prompt.


