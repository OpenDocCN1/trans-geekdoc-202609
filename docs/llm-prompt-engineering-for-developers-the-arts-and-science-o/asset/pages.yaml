- pgno: 142
  md: '# Prompt Flow


    ![](img/ee54af4a0c9d9a4beda42d94caa5229b_142_0.png)


    Before using Azure Prompt Flow, you need to have a basic understanding of Azure
    Role-Based Access Controls (RBAC) since the service needs to access your Azure
    resources. Azure uses a system called RBAC to regulate access to its various operations.
    In the context of Prompt Flow, if you wish to deploy an endpoint, your account
    needs to have specific permissions.


    There are some configuration steps required when deploying and running a prompt.
    The Azure dashboard will guide you through the process. The whole process is not
    complicated, but it can be confusing if you are new to Azure.


    To be able to test and run prompts, you will need two things:


    +   A connection to an LLM like OpenAI GPT-3.5.

    A runtime.


    To add the first, you need to go to the Azure ML Studio56. Click on “Prompt flow”,
    then “Connections” and create a new connection. If you want to use OpenAI, you
    need to provide your API key. You can get your API key from here57. Other options
    are available as well.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/ee54af4a0c9d9a4beda42d94caa5229b_143_0.png)


    # Prompt Flow connections


    The same thing applies for the runtime, click on “Runtime”, start by adding a
    shared runtime. It is possible to create or use different types of runtimes, in
    this example, you can use a shared runtime. Before you consume the endpoint as
    runtime, you need to give the following permissions to the user-assigned identity:


    +   * “AzureML Data Scientist” role to workspace

    * “Storage Blob Data Contributor” permission, and “Storage Table Data Contributor”
    to the default storage of the workspace


    Without adding these permissions, the endpoint runtime will lack the correct access
    to run the prompt flow. More details can be found here\(^{58}\).'
