  md: '# ## 5 - Setting Up the Environment


    # ### 5.1 - Choosing the Model


    Since OpenAI GPT models are the most popular and widely used models, and because
    they are easily accessible through the OpenAI API, we are going to use them in
    this guide. However, to apply the concepts and techniques discussed in this guide
    to other models, you can use the same approach in almost all cases without any
    major changes.


    Our goal is to understand the concepts and techniques behind prompt engineering
    and how to apply them to different models. We are not going to focus on the technical
    details of each model.


    # ### 5.2 - Choosing the Programming Language


    The OpenAI API officially supports Python and Node.js officially $ ^ { 20 } $
    . Azure OpenAI libraries $ ^ { 21 } $ are available for .NET, Java, JavaScript,
    and Go. Other community libraries $ ^ { 22 } $ are available for other languages
