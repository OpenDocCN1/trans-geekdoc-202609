- pgno: 211
  md: "LangChain provides the `load_prompt` function, which loads a prompt from a\
    \ file:\n\n```\nfrom langchain.prompts import load_prompt\nprompt = load_prompt(\"\
    data.json\")\nformatted_prompt = prompt.format(word=\"happy\")\n```\n\nThis is\
    \ the content of data.json:\n\n```\n{\n    \"_type\": \"prompt\",\n    \"input_variables\"\
    : [\"word\"],\n    \"template\": \"Give me a synonym for \\\\\"{word}\\\\\".\"\
    \n}\n```\n\nIf the file were a YAML file, the content would be:\n\n```\n_type:\
    \ prompt\ninput_variables: [word]\ntemplate: Give me a synonym for \"{word}\"\
    .\n```\n\nThe code above will work with both JSON and YAML files. It is also possible\
    \ to use a JSON file to perform few-shot learning. This is how the data.json file\
    \ would look:\n\n```\n{\n    \"_type\": \"few_shot\",\n    \"input_variables\"\
    : [\"word\"],\n    \"prefix\": \"Write a sentence using the word in the input\"\
    ,\n    \"example_prompt\": {\n        \"_type\": \"prompt\",\n        \"input_variables\"\
    : [\"input\", \"output\"],\n        \"template\": \"input: {input}\\noutput: {output}\"\
    \n    },\n    \"examples\": [\n```"
