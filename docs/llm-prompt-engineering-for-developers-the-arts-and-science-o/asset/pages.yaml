- pgno: 26
  md: '# # 3 - Introduction to Prompt Engineering


    Prompt engineering is an emerging discipline in the field of artificial intelligence.
    Its focus is on creating and optimizing instructions given to a language model,
    such as ChatGPT. Relevant and well-formulated prompts can influence the responses
    generated by the model, thus improving the quality and relevance of the results.


    To be effective, prompt engineering requires an understanding of the underlying
    model, as well as an analysis of the training data to identify potential biases.
    By adjusting the instructions and model parameters, prompt engineers can shape
    the behavior of AI to more accurately meet user needs and produce more consistent
    and reliable results.


    In a tweet, Sam Altman, CEO of OpenAI, described prompt engineering as an "amazingly
    high-leverage skill and an early example of programming in a little bit of natural
    language."


    ![](img/ee54af4a0c9d9a4beda42d94caa5229b_26_0.png)


    **Prompt Engineering according to Sam Altman**


    Prompt engineering is a critical discipline that has gained significant attention
    in recent years. As AI language models, such as GPT-4 and'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'ChatGPT, have become more powerful and widely used, the importance of effectively
    guiding these models with carefully crafted instructions, known as prompts, has
    grown exponentially.


    Language models are trained on vast amounts of text data to learn patterns, language
    structures, and context. However, generating coherent and contextually relevant
    responses from these models can be a complex task, as they may produce outputs
    that are either irrelevant or biased, especially when given ambiguous or poorly
    formulated prompts.


    The history of prompt engineering can be traced back to the early stages of language
    model development. As AI researchers and developers sought to make language models
    more useful and user-friendly, they recognized the need for influencing the generated
    text by providing explicit instructions or context. Initially, simple prompts
    were used to guide the models, but they often led to generic or inadequate responses.


    GPT-4, LaMDA, Llama 2, and PaLM language models were the most important milestones
    in the emergence of this field. These models were trained on large amounts of
    text data and were able to generate coherent and contextually relevant responses.
    Speculations suggest that GPT-4 boasts an astounding 170 trillion parameters.
    In comparison, Llama’s most expansive version encompasses 65 billion parameters,
    while PaLM, a 540 billion parameter transformer model from Google, drives its
    AI chatbot, Bard, with exceptional genius. However, these models still required
    explicit instructions to produce desired outputs. This is what led to the development
    of prompt engineering as a new discipline.


    This field has even more relevance after the release of text-to-image models like
    Stable Diffusion, Midjourney, and DALL-E. These models can generate images from
    text prompts, but they require specific instructions to produce desired outputs.


    Over time, prompt engineering has evolved significantly, borrowing insights from
    various other related fields, such as NLP, computational linguistics, and human-computer
    interaction. Researchers have explored different strategies to design prompts
    that elicit precise and contextually accurate responses.'
  merge: -1
  img_proc: true
