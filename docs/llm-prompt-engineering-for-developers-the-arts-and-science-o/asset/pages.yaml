    # ## 4.6 - Costs, Tokens, and Initial Prompts: How to Calculate the Cost of Using
    a Model


    If you’re paying for monthly access to ChatGPT, the cost of using the model is
    fixed. However, if you’re using a GPT model through an API, the cost of using
    the model is based mainly on the number of tokens generated. This means that the
    longer the prompt and the generated output, the higher the cost of the API call.


    Here’s how it generally works:


    +   - **Number of tokens**: When you send text to the API, it is divided into
    tokens. This includes both the input text (prompt) and the generated response.'
