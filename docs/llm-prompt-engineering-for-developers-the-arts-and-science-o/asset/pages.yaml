- pgno: 153
  md: '# ## 16 - LangChain: The Prompt Engineer’s Guide


    # ### 16.1 - What is LangChain?


    LangChain is an innovative framework designed to supercharge applications with
    the capabilities of language models. It’s not just about integrating a language
    model; it’s about making that model smarter and more interactive. With LangChain,
    your application becomes data-aware, meaning it can seamlessly connect with various
    data sources. Moreover, it becomes agentic, allowing the language model to actively
    engage with its surroundings.


    What sets LangChain apart are its two primary offerings:


    +   - **Components**: These are well-defined abstractions tailored for language
    models. They come with a suite of implementations, making them adaptable. The
    beauty of these components is their modularity. Whether you’re fully invested
    in the LangChain ecosystem or just exploring, these components are designed to
    be plug-and-play.

    - **Off-the-shelf chains**: For those who want a quick start, LangChain offers
    pre-assembled component chains. These chains are structured to handle specific
    tasks, making it a breeze to integrate them into your application.


    While off-the-shelf chains provide a fast track for beginners, the individual
    components offer flexibility for advanced users.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 16.2 - Installation


    LangChain supports several LLM providers, like Hugging Face and OpenAI. We are
    going to use OpenAI for this project.


    To install LangChain, run the following command:


    ```

    pip install langchain==0.0.270

    ```


    Alternatively, if you want to use Hugging Face, install this additional dependency,
    then create an account on Hugging Face^{60} and get your API keys.


    ```

    pip install huggingface_hub

    ```


    Since we are using OpenAI, we need to have openai installed and configured. This
    was already done in one of the previous chapters, but if you haven''t done it
    yet, run the following command:


    ```

    pip install openai

    ```


    You will also need to set the OPENAI_API_KEY environment variable. You can do
    this by running the following command:


    ```

    export OPENAI_API_KEY=<your-api-key>

    ```


    # 16.3 - Getting Started


    To get started, let''s create an app that predicts the next word in a sentence
    using two types of outputs: LLM and ChatModel.'
