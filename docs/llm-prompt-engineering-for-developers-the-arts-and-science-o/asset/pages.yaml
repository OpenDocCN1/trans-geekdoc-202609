    # ## 18.2 - Start with an Action Verb


    Instead of using generic phrases like “Can you,” start your prompt with action
    verbs such as “Create,” “Write,” “Make,” or “Generate.” This helps to give clear
    instructions to the model. For example: “Create 10 article ideas for my meditation
    and wellness website.”


