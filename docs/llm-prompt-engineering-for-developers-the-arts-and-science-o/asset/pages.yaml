  md: '# # 4.4 - API Usage vs. Web Interface


    GPT models can be accessed using the OpenAI API or the web interface.

    The use of APIs versus web interfaces represents two different approaches to interacting
    with services or applications.


    Web interfaces are often geared towards end-users and provide a graphical interface
    that allows users to interact with a service or application through a web browser.
    This makes the usage of the service more intuitive for non-technical users. When
    we talk about web interfaces, we are referring to applications like ChatGPT that
    offer a web interface to interact with GPT-3.5 and GPT-4 or even the [Playground](https://platform.openai.com/playground)$^{10}$,
    a web interface provided by OpenAI to interact with different models and explore
    their capabilities.


    On the other hand, APIs are designed to be used by applications and developers.
    They enable programmatic communication between different services or software
    components. For example, a developer can use an API to query a specific model
    and retrieve the results in their application or integrate the model into their
    own service or application. Applications like copy.ai or Jasper are examples of
    web interfaces that use the OpenAI API to provide text generation services to
    their users through a web interface.


    # # 4.5 - Tokens


    GPT models process text in chunks called tokens. Tokens represent frequently occurring
    character sequences and they are different from words.

    For example, the string “Building a ChatBot” can be broken down into 3 words:
    “Building”, “a”, and “ChatBot”. But when we tokenize it, it is broken down into
    4 tokens: “Building”, “ a“, “Chat”, and “Bot”.


    It is worth noting that in a sentence, the first token of each word (except the
    first word) typically starts with a space. In the previous example, “ a“ and “
    Chat“ are the first tokens of the words “a” and “ChatBot” respectively, and both
    tokens start with a space.


    $^{10}$ [https://platform.openai.com/playground](https://platform.openai.com/playground)'
