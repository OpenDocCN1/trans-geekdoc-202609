  md: '**Felix:** Hi there. I am Felix, the chatbot. Let''s play a game.


    **You:** When James was 2 years old, his sister was 2*2 years old. James is now
    30 years old. How old is his sister? Think step by step (who''s older, the age
    difference..etc)


    **Felix:** To find out how old James''s sister is, we can work through the problem
    step by step:


    +   1. When James was 2 years old, his sister was 2 * 2 years old, which means
    his sister was 4 years old at that time.


    +   2. This implies that James''s sister is two years older than him, as she was
    4 years old when he was 2 years old.


    +   3. Since James is now 30 years old, we need to account for the age difference
    of two years between him and his sister.


    +   4. To calculate his sister''s current age, we add the age difference to James''s
    age: 30 + 2 = 32.


    Therefore, James''s sister is 32 years old.


    Surprisingly, the answer is correct, and the CoT instruction helped the model
    to understand that breaking the problem into smaller steps while taking into consideration
    the age difference is the right approach to solve the problem.


    This approach was introduced in the paper "Large Language Models are Zero-Shot
    Reasoners" [34] (Kojima, T., Gu, S. S., Reid, M., Matsuo, Y., & Iwasawa, Y. (2022)).
    While LLMs are praised for their few-shot learning, the authors of this paper
    discovered that these models can also reason without any prior examples (zero-shot)
    by simply prompting them to "think step by step."


    > We show that LLMs are decent zero-shot reasoners by simply adding "Let''s think
    step by step" before each answer.


    34 https://arxiv.org/abs/2205.11916'
