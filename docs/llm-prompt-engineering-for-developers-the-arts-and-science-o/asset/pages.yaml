  md: '# ## 11 - Transfer Learning


    # ### 11.1 - What Is Transfer Learning?


    Transfer learning (TL), by definition, is the enhancement of learning in a new
    task through the transfer of knowledge from a related task that has already been
    learned. The related task is typically either a task from the same domain or a
    task from a different domain that has shared concepts or shared low-level features.


    The concept of transfer learning is not new. In fact, it has been studied in the
    field of psychology and behaviorism for over 100 years. It was also used in pedagogy
    to teach children how to acquire new skills by building on what they already know.


    Here are some examples of transfer learning in the real world:


    +   - If someone learned to play the piano, they might find it easier to learn
    another keyboard instrument like the organ, due to the similarities between the
    two instruments.

    - A child who’s learned to be wary of a hot stove might also avoid touching a
    barbecue grill without being explicitly taught.

    - A child who learned to ride a tricycle might find it easier to learn to ride
    a bicycle than a child who has never ridden a tricycle.


    TL has only recently become a popular topic in the field of machine learning.


    For instance, when applied in image classification, transfer learning can be used
    to reuse knowledge gained while solving a problem in one domain (e.g., recognizing
    reptiles) to solve a problem in another domain (e.g., recognizing amphibians).'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'In other words, TL involves reusing a pre-trained model as a starting point
    for a new task. In the context of LLMs, this method allows us to leverage knowledge
    learned from vast datasets and apply it to a specific problem. There are two main
    approaches to transfer learning: inductive transfer and transductive transfer.
    Both approaches are based on the idea that knowledge learned in one task can be
    used to improve performance in another task.


    Let’s examine each approach in more detail.


    # # 11.2 - Inductive Transfer


    Inductive transfer is a prevalent approach in transfer learning. It’s about the
    ability of a learning mechanism to leverage knowledge or skills from one task
    to improve performance on another related, but distinct, task.


    In simple terms, inductive transfer occurs when a system becomes more proficient
    at a current task due to its previous experiences with similar tasks. It’s analogous
    to applying previously learned knowledge or a specific way of thinking to new
    challenges.


    Consider language acquisition as an example. If you first learn Spanish and later
    decide to pick up Portuguese, your proficiency in Spanish aids your learning process
    because of the many similarities between the two languages. This exemplifies inductive
    transfer: the knowledge of Spanish bolsters the learning of Portuguese.


    Similarly, in machine learning, a model that has been trained to recognize English
    handwriting might find it easier to identify handwritten letters in related languages
    such as French, Italian, Spanish, or Portuguese.


    # # 11.3 - Transductive Transfer


    Transductive transfer, in contrast to inductive transfer, focuses on leveraging
    knowledge from specific instances in one domain to make predictions'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'on specific instances in a closely related domain, all while the underlying
    task remains constant.


    Take, for instance, a student adept at solving math problems in class using methods
    they’ve encountered in their textbook. When faced with a slightly varied problem
    in an exam, they might recall a textbook problem and replicate its solution method,
    bypassing a true understanding of the underlying mathematical principle.


    To draw a parallel in machine learning, specifically in the field of computer
    vision, imagine a system trained to distinguish between cats and dogs in photos
    from a particular shelter. When presented with images from an unfamiliar shelter,
    using transductive transfer, the system would attempt to categorize these new
    images based on the specific examples it encountered from the original shelter,
    rather than generalizing the broader notion of distinguishing between cats and
    dogs in varied environments.


    # # 11.4 - Inductive vs. Transductive Transfer


    Inductive and transductive learning methodologies can sometimes appear similar,
    but a closer look reveals that there are distinct differences in their approaches.


    In inductive learning, the model is trained using only a set of labeled data and
    then seeks to generalize, predicting labels for data it hasn’t seen. This general
    model can be readily applied to any new data within the same domain.


    Conversely, transductive learning directly encounters both the labeled training
    and unlabeled testing data during its training process. Unlike induction, it doesn’t
    aim to create a generalized model; instead, it focuses on predicting the labels
    of the specific unlabeled data it has seen, based on its knowledge of the labeled
    data and other relevant information. This specificity means that introducing new
    data often requires the algorithm to start afresh – a process that can be both
    time-consuming and computationally expensive, especially with streaming data.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'While inductive learning emphasizes broad applicability, transductive learning
    optimizes for the data at hand. Knowing when to use each approach can be instrumental
    in various machine learning applications.


    In simpler words, inductive learning reasoning progresses from observed training
    cases and seeks to generalize to unseen scenarios, while transductive learning
    reasoning moves from specific observed cases to other specific yet unseen cases,
    without altering the fundamental task at hand.


    To draw a parallel from psychology, “Hugging”, suggested by Perkins and Salomon
    (1989) 43 , which emphasizes the similarities between the learning situation and
    future applications, can be likened to inductive learning, while “Bridging”, another
    technique used in teaching, which connects specific instances of knowledge to
    new situations, mirrors the principles of transductive learning.


    This table summarizes the differences between inductive and transductive learning:


    | Aspect | Inductive Learning | Transductive Learning |

    | --- | --- | --- |

    | Encountered Data | Only encounters training data during model training. | Encounters
    both training and testing datasets during model training. |

    | Predictive Model | Builds a predictive model that can be applied to unseen data.
    | Does not construct a standalone predictive model for unseen data. |

    | New Data Handling | When new data is introduced, the established model can quickly
    predict without retraining. | New data necessitates rerunning the algorithm from
    the start, retraining, and then predicting. |'
  merge: -1
  img_proc: true
- pgno: 99
  md: '| Aspect | Inductive Learning | Transductive Learning |

    | :------- | :------------------- | :--------------------- |

    | **Model''s Purpose** | Seeks to create a general model capable of predicting
    any new point within the data space. | Constructs a model tailored to the specific
    training and testing data points it has encountered. |

    | **Efficiency with Streams** | Can rapidly label new data points with minimal
    computational overhead. | Can become computationally intensive if new data points
    are continuously introduced. |


    # 11.5 - Transfer Learning, Fine-Tuning, and Prompt Engineering


    Prompt engineering and transfer learning serve different purposes but are both
    methodologies used to improve the performance and utility of machine learning
    models, particularly in the context of models like OpenAI''s GPT series.


    Fine-tuning is a type of transfer learning that involves taking a pre-trained
    model and adapting it to a new custom task. It''s a common practice in the field
    of natural language processing (NLP) and is often used to improve the performance
    of language models.


    But what''s the relationship between prompt engineering and fine-tuning?


    When you want to fine-tune a model like OpenAI GPT, you need to provide it with
    a set of training examples that each consist of a single input (“prompt”) and
    its associated output (“completion”). This is notably different from using the
    base models, where you might input detailed instructions or multiple examples
    in a single prompt.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'This is useful when you want the model to perform a specific task. For example,
    you might want to fine-tune a model to understand your customer support tickets
    and respond to them automatically based on your knowledge base or previous responses
    to similar tickets.


    # ## 11.6 - Fine-Tuning with a Prompt Dataset: A Practical Example


    For the sake of simplicity, we are going to use one of OpenAI’s base models and
    fine-tune it to perform a simple task: answer questions from a FAQ.


    To fine-tune a model, we will need a set of training examples that each consist
    of a single input (“prompt”) and its associated output (“completion”) as described
    previously. Here is what OpenAI’s documentation recommends:


    +   - Each prompt should end with a fixed separator to inform the model when the
    prompt ends and the completion begins. A simple separator which generally works
    well is `\n\n###\n\n`. The separator should not appear elsewhere in any prompt.

    - Each completion should start with a whitespace due to their (OpenAI’s) tokenization,
    which tokenizes most words with a preceding whitespace.

    - Each completion should end with a fixed stop sequence to inform the model when
    the completion ends. A stop sequence could be `\n, ###,` or any other token that
    does not appear in any completion.


    Suppose you have an e-learning platform called SkillUp Academy, and you also have
    the following FAQ page.'
