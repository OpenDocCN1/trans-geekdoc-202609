    # **16.12 - Using Prompts from a File**


    It is not a good idea to hard code tens or hundreds of few-shot examples in your
    code. While this will make your code unreadable, it will also make it difficult
    to maintain and update. Prompts can be stored in a file using the JSON or the
    YAML format. This way, you can easily add, remove, or update prompts without having
    to change your code. But how do you use these prompts in your code?'
