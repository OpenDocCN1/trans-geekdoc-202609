- pgno: 195
  md: '+   · ice-cream lover


    To compute the n-gram overlap score between two texts:


    +   · Extract all n-grams from both texts.

    · Count the number of shared n-grams between the two texts.

    · Divide the count of shared n-grams by the total number of unique n-grams across
    both texts.


    The resulting score will be between 0 and 1, with 1 indicating that the two texts
    share all their n-grams and 0 indicating no shared n-grams.


    # ## 16.11.2 - Max Marginal Relevance Example Selector


    MaxMarginalRelevanceExampleSelector$^{68}$ is a method designed to select examples
    that strike a balance between relevance and diversity.


    The primary goal is to find examples that are most similar to the given inputs.
    This is done by measuring the cosine similarity$^{69}$ between the embeddings
    of the examples and the inputs.


    > Cosine similarity is a metric used to measure how close two embeddings are in
    their orientation in the vector space. A higher cosine similarity indicates greater
    similarity. Imagine you have two vectors (embeddings) in a space. The cosine similarity
    measures the cosine of the angle between these two vectors. If the vectors are
    identical, the angle is 0°, and the cosine is 1. If the vectors are completely
    different, the angle is 90°, and the cosine is 0.


    While relevance is important, if we only focus on that, we might end up with a
    set of very similar examples. To avoid this, the selector also ensures diversity
    among the chosen examples. After selecting the most relevant example, it penalizes
    other examples that are too similar to the already selected ones. This ensures
    that the next chosen example is not just relevant to the input but also different
    from the examples already picked.'
