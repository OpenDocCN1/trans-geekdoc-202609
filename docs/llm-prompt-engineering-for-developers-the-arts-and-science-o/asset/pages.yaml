- pgno: 196
  md: '# ## 16.11.3 - Length-Based Example Selector


    `LengthBasedExampleSelector`$^{70}$ selects examples based on their length, ensuring
    it doesn''t exceed the maximum allowable length or context window of the language
    model.


    The total length of the constructed prompt is influenced by both the user''s input
    and the examples added to it. Depending on the length of the user''s input, the
    selector will adapt the number of examples it includes in the prompt. For instance,
    if the user''s input is lengthy, the selector will opt for fewer examples to ensure
    the combined length doesn''t exceed the model''s context window. Conversely, if
    the user''s input is short, the selector can afford to include more examples,
    making the most of the available space in the context window.


    This selector ensures that the constructed prompt, which includes the user''s
    input and the selected examples, always stays within the model limits.


    > Language models like GPT-3 have a maximum token limit for each prompt. If a
    prompt exceeds this limit, the model won''t be able to process it.


    # ## 16.11.4 - The Custom Example Selector


    If none of the available example selectors meet your needs, you can create your
    own custom example selector by subclassing `BaseExampleSelector` and implementing
    the `select_examples` method.'
