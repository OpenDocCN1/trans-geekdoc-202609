- pgno: 130
  md: '# # 14 - General Knowledge Prompting


    # ## 14.1 - What Is General Knowledge Prompting?


    This is one of the most useful techniques I learned through testing and experimenting
    with ChatGPT before using it in production. It’s a simple technique that can be
    used to improve the quality of the generated outputs.


    In the paper [Generated Knowledge Prompting for Commonsense Reasoning⁵¹](https://arxiv.org/pdf/2110.08387.pdf)
    (Liu, J., Liu, A., Lu, X., Welleck, S., West, P., Bras, R. L., Choi, Y., & Hajishirzi,
    H. (2021)), the authors tried to determine if adding outside information aids
    in better understanding common sense while using trained language models. To test
    this, they created a method where they first generated knowledge from a model
    and then used that knowledge to answer questions. This method doesn’t require
    special training or a database. It improved performance in several tasks and showed
    that large language models can be flexible sources of extra information.


    The method uses two main steps to do this.


    +   1.  Knowledge generation: They used a language model to produce “knowledge
    statements” based on the given question. Think of these statements as pieces of
    information that can help answer the question.

    2.  Knowledge integration: They then used these knowledge statements to help another
    language model pick the best answer from the choices. Without these statements,
    the model would just try to guess the answer based only on the question.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# ### 14.2 - Example of General Knowledge Prompting


    Here is an example of some prompts applying this technique. Let’s say you want
    to ask the model the following question:


    ```

    Write a short article about the advantages of using a chatbot on a website.

    ```


    We start by generating some knowledge statements that can help the model answer
    the question.


    We can do this by generating knowledge statements from a model using these prompts:


    ```

    What are the different types of chatbots? AI chatbots, rule-based chatbots, live
    chat agents..etc

    Why is it a good idea to use an AI chatbot on a website?

    What are the benefits of using a AI chatbot?

    Describe briefly the technical implementation process of an AI chatbot \ using
    OpenAI''s API.

    ```


    The generated knowledge will be used in the final prompt to help the model generate
    an article about the implementation of a smart chatbot on a website.'
  merge: -1
  img_proc: true
