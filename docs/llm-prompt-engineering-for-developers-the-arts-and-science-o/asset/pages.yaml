    sudo apt install python3-pip

    sudo pip3 install virtualenvwrapper

    ```

    ```


    If you are using Windows, you can install pip and virtualenvwrapper using [Chocolatey](https://chocolatey.org/):


    ```

    ```bash

    choco install pip

    pip install virtualenvwrapper-win

    ```

    ```


    However, I recommend using an Ubuntu virtual machine on Windows using [Multipass](https://multipass.run/)
    or any other virtualization tool. Alternatively, you can use a cloud service like
    DigitalOcean or AWS.


    We will also be using Python 3.9 for our development environment. You should have
    Python 3.9 installed. Follow this link to [install Python 3.9](https://www.python.org/downloads/).


    Next, create a virtual environment called pe (short for prompt engineering) using
    Python 3.9:


    ```

