- pgno: 64
  md: '# ## 6 - Few-shot Learning and Chain of Thought


    # ### 6.1 - What Is Few-Shot Learning?


    Few-shot learning, sometimes referred to as low-shot learning, is a method that
    allows models to make accurate predictions with only a few examples, thereby reducing
    data collection and computation efforts and costs. This technique has been applied
    in various fields such as:


    +   * Computer vision (character recognition, object tracking, classification)

    * NLP (text completion, translation, classification)

    * Audio processing (voice cloning, conversion)


    # ### 6.2 - Zero-Shot vs Few-Shot Learning


    Large language models such as GPT-4, PaLM 2, Llama 2, and others were trained
    on massive datasets, and they can perform well on a wide range of tasks. Therefore,
    they are usually prompted without any examples. This is what we call zero-shot
    learning. However, when the task is complex, the model needs to be trained on
    a few examples to perform well, and here comes the few-shot learning technique.


    Still, the quality of your prompt and using the best practices can help you achieve
    better results with zero-shot learning (context, coherence, persona, etc.).


    In fact, zero-shot learning is the preferred method for most cases. It''s faster
    and easier.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# ## 6.3 - Approaches to Few-Shot Learning


    There are different approaches to few-shot learning, and they include using:


    # ### 6.3.1 - Prior Knowledge about Similarity


    During training, we develop embeddings that can distinguish between different
    classes, even if they haven’t been seen before.


    Think of this like teaching an AI to recognize the difference between cats and
    dogs by showing it many pictures. Even if later it sees a breed of cat or dog
    it hasn’t seen before, it can still guess correctly because it has learned the
    general idea of what makes a cat different from a dog. This is a bit like a game
    where you match similar items, and the AI gets better at it over time.


    # ### 6.3.2 - Prior Knowledge about Learning


    We leverage pre-existing knowledge to guide the learning algorithm in selecting
    parameters that not only fit the data well but also generalize effectively. This
    helps in preventing overfitting, especially when working with limited data.


    Imagine you’re teaching someone to ride a scooter. Instead of starting from scratch,
    if they’ve ridden a bike before, you’d use that knowledge to help them learn faster.
    Similarly, when teaching an AI, we use what it already knows to help it learn
    new things without making common mistakes.


    # ### 6.3.3 - Prior Knowledge of Data


    By harnessing our understanding of the data’s inherent structure and variations,
    we can effectively train AI even when provided with only a handful of examples.
    This knowledge acts as a foundation for more efficient learning.'
  merge: -1
  img_proc: true
