    # ## 21.5 - Other Types of Prompts


    There are certainly other types of prompts that don''t fit neatly into the above
    categories or prompt types that are a mix of the above.


    # ## 21.6 - Interactive Prompts


    These prompts are designed for back-and-forth interaction. They are often used
    in conversational AI applications like ChatGPT. They can be a mix of the above
    types but are framed in a way that encourages ongoing dialogue with the AI. For
    example, “Tell me a joke, AI,” followed by “Why is that joke funny?” followed
    by “Tell me another joke, AI,” and so on.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# ## 22 - Prompt Databases, Tools, and Resources


    Prompt Engineering can be tricky, as a perfect prompt is the key to quality AI-generated
    content. That’s why there are community initiatives to share, optimize, improve,
    and organize prompts. However, let’s be clear, there is no such thing as a perfect
    prompt. It all depends on the use case and the model you are using. As seen previously,
    iteration and refining are the main keys to creating a good prompt. So, online
    prompt databases and directories are not that useful, but they can be an inspiration
    for your own prompts.


    With that in mind, let’s take a look at some of the most popular prompt databases,
    tools, and resources. Some of the following tools are paid, but all of them have
    a free plan if they are not totally open source.


    # ### 22.1 - Prompt Engine


    Prompt Engine is an NPM utility library for creating and maintaining prompts for
    Large Language Models. It was developed by Microsoft and is available on GitHub⁹⁵.
    It supports prompt engineering for both code generation and dialog scenarios.
    It also aims to codify patterns and practices around prompt engineering.


    # ### 22.2 - Prompt Generator for ChatGPT


    The Prompt Generator for ChatGPT⁹⁶ application is a desktop tool designed to help
    users generate character-specific prompts for ChatGPT, a chatbot model developed
    by OpenAI.


    ⁹⁵ https://github.com/microsoft/prompt-engine

    ⁹⁶ https://github.com/rubendi18/Prompt-generator-for-ChatGPT'
  merge: -1
  img_proc: true
- pgno: 300
  md: '![](img/ee54af4a0c9d9a4beda42d94caa5229b_300_0.png)


    Users enter a character''s name, click a button to generate a prompt in English
    or Spanish, and can copy the prompt or generate a new one. It allows for easy
    customization and adaptation of the chatbot to different characters and contexts.


    # **22.3 - PromptAppGPT**


    PromptAppGPT⁹⁷ is a low-code prompt-based rapid app development framework. PromptAppGPT
    comes with features such as low-code prompt-based development, GPT text generation,
    DALLE image generation, online prompt editor+compiler+runner, automatic user interface
    generation, support for plug-in extensions, etc. PromptAppGPT aims to enable natural
    language app development based on GPT.


    According to its developer, this open-source tool significantly lowers the barrier
    to GPT application development, allowing anyone to develop'
