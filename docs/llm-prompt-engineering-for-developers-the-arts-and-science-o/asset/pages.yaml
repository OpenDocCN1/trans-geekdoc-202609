    conflicts with other Python projects on your machine.


    To create a virtual environment, you can use Virtualenv, Virtualenvwrapper, or
    other tools. We are going to use [Virtualenvwrapper](https://github.com/python-virtualenvwrapper/virtualenvwrapper)
    for this guide.


    Start by installing pip and virtualenvwrapper:


    ```

