- pgno: 182
  md: "examples to better understand the task at hand, the ExampleSelector helps in\
    \ determining which examples to include in the prompt.\n\nInstead of hardcoding\
    \ examples or always using the same set of examples, ExampleSelector allows for\
    \ dynamic selection based on the input or other criteria. This ensures that the\
    \ most relevant examples are chosen for a given task. Additionally, when there's\
    \ a vast pool of examples available, it's inefficient and sometimes counterproductive\
    \ to include all of them. The ExampleSelector can pick the most effective examples\
    \ to guide the model towards the desired output.\n\nBy providing the model with\
    \ relevant examples, it can better understand the context and produce more accurate\
    \ and contextually appropriate responses.\n\nThe base interface is as follows:\n\
    \n```\nclass BaseExampleSelector(ABC):\n    \"\"\"Interface for selecting examples\
    \ to include in prompts.\"\"\"\n\n    @abstractmethod\n    def select_examples(self,\
    \ input_variables: Dict[str, str]) -> List[\\ dict]:\n        \"\"\"Select which\
    \ examples to use based on the inputs.\"\"\"\n```\n\nThe sole method that must\
    \ be implemented is `select_examples`. This method accepts input variables and\
    \ yields a list of examples. The manner in which these examples are chosen is\
    \ determined by the specific implementation of the class. Let's dive into an implementation\
    \ to understand this better.\n\nBefore starting, we have some requirements. First,\
    \ start by installing ChromaDB:\n\n```\npip install chromadb==0.4.6\n```\n\nChroma\
    \ requires sqlite3 >= 3.35.0. You can download and install it from here."
