    Prompt: Write a poem about quantum physics. Only use simple words.

    Prompt: Write a poem about quantum physics. Use a diverse vocabulary.

    ...

    ```


    On the other hand, developers who use the OpenAI API have the option to adjust
    certain parameters, including temperature, when integrating language models like
    GPT into their applications.


    Understanding and adjusting API parameters offers multiple advantages. By mastering
    these parameters, you not only gain insights into why the model produces certain
    responses, but also grasp the delicate balance between coherence and diversity.
    This understanding allows for more effective interactions, enabling users to craft
    prompts or conversation styles. Moreover, it provides guidance for generating
    content; a deep awareness of how parameters influence outcomes allows users to
    better structure prompts or directions.


    Here is a list of the most common parameters you may come across:


    +   • Temperature

    • Top-p

    • Top-k

    • Sequence length (max_tokens)

    • Number of responses (n)

    • Presence penalty (presence_penalty)

    • Frequency penalty (frequency_penalty)

    • Best of (best_of)


    # 4.9.1 - Temperature


    This controls the degree of variability in responses. A higher temperature makes
    responses more diverse but potentially less coherent, while a lower temperature
    makes responses more deterministic and focused. A higher temperature may lead
    to hallucinations when the response should be deterministic.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# ### 4.9.2 - Top-p


    The “top-p” parameter, also known as “nucleus sampling,” is a technique used in
    text generation models like GPT to control the diversity of generated responses.
    It allows for the selection of the most probable words while limiting the selection
    to a subset of words whose cumulative probability exceeds a certain threshold.


    In practice, suppose we use a GPT model to generate a sequence of words from a
    given context. The “top-p” parameter comes into play by selecting words from the
    most probable ones until the cumulative probability reaches the defined threshold.
    This way, only the most probable words up to that point are considered, reducing
    the pool of choices and introducing diversity in the generated responses.


    For example, if we set a threshold of 0.8 with the “top-p” parameter, it means
    only words with a cumulative probability reaching 80% will be considered. Less
    probable words will be eliminated, allowing for more targeted and coherent responses
    while maintaining some variety.


    Here is an example of using the “top-p” parameter to generate a sentence:


    Context: What is the best restaurant in town according to the reviews?" (Note:
    This is formatted as a code block in the original image)


    +   - Without “top-p”:


    Response: The best restaurant in town is Restaurant A. It offers delicious cuisine
    and exceptional service. The reviews love it! (Note: This is formatted as a code
    block in the original image)


    +   - With “top-p” (threshold of 0.8):


    Response: The best restaurant in town is undoubtedly Restaurant A. It''s\ incredibly
    popular and highly appreciated by the critics. (Note: This is formatted as a code
    block in the original image)'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'In this example, the “top-p” parameter helped generate a more focused response
    by using only the most probable words, while still maintaining some variety in
    the generated response.

    It is recommended not to use top-p together with temperature and to choose one
    or the other.


    # ### 4.9.3 - Top-k


    The “top-k” parameter is a technique used in text generation models to control
    the number of possible choices when selecting the next words in a generated sequence.
    It limits the pool of candidate tokens to the k most probable tokens at each generation
    step.

    Specifically, the “top-k” parameter specifies the maximum number of tokens to
    consider at each generation step based on their probability. Tokens are ranked
    in descending order of probability, and only the top k most probable tokens are
    taken into account. Therefore, less probable tokens are excluded from the pool
    of choices.

    By using the “top-k” parameter, you can control the diversity of generated responses.
    A lower value of k would make the response more deterministic and coherent, while
    a higher value of k would make responses more diverse but potentially less coherent.

    Experimenting with and adjusting the “top-k” parameter can help you achieve better
    results.


    # ### 4.9.4 - Sequence Length (max_tokens)


    The sequence length refers to the number of tokens generated by the model. For
    example, if you instruct the model to generate a sequence of 10 tokens, the model
    will simply generate 10 tokens based on the given context.

    If you want to generate longer responses, you can increase the sequence length.
    Conversely, if you want shorter responses, you can decrease the sequence length.


    > The sequence length can also impact the cost of the API call.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 4.9.5 - Presence Penalty (presence_penalty)


    The presence penalty parameter ranges from -2.0 to 2.0. Positive values of this
    parameter will penalize tokens based on their presence (i.e., if they have appeared
    even once) in the generated text so far. This encourages the model to introduce
    new tokens, which can help the response cover new topics.


    In contrast, a negative presence penalty might encourage the model to stick closer
    to tokens it has already introduced.


    > > Setting a high presence penalty can lead to more varied responses, but too
    high a value might result in less coherent outputs as the model tries to avoid
    tokens it has already used.


    # 4.9.6 - Frequency Penalty (frequency_penalty)


    The frequency penalty parameter also ranges from -2.0 to 2.0. Positive values
    penalize tokens based on how frequently they have appeared in the generated text.
    This means a token that has been used multiple times will be penalized more heavily
    than a token that has appeared only once. The aim here is to discourage excessive
    repetition.


    On the other hand, negative values would do the opposite and might encourage the
    model to repeat tokens it has used more frequently.


    The purpose of the frequency penalty is to ensure diversity in the generated responses
    and prevent overuse of certain phrases or words. Using this penalty can help achieve
    more varied and dynamic outputs from the text generation model.


    In summary, while both parameters control repetition in their own ways, the presence
    penalty is about whether a token has appeared at all, and the frequency penalty
    concerns how often a token has appeared. Adjusting these parameters requires a
    balance depending on the desired outcome and context of the application.


    > > The presence penalty penalizes a token if it has appeared at all, while the
    frequency penalty penalizes a token based on how often it has appeared.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 4.9.7 - Number of Responses (n)


    The number of responses refers to the number of responses generated by the model.
    For example, if you generate 3 responses, the model will generate 3 responses
    based on the given context.


    If you want to generate 10 responses, set the number of responses to 10. If you
    want to generate a single response, set the number of responses to 1 (default).


    The number of responses can also impact the cost of the API call.


    # 4.9.8 - Best of (best_of)


    The “best_of” option is used for optimal completions and returns the “best” completion
    (the one with the highest log-probability per token).


    When used together with the “n” parameter (number of responses), “best_ of” controls
    the number of candidate completions, and “n” specifies how many completions will
    be returned. It is important to note that the value of “best_of” should be greater
    than “n”.


    In practice, if you set “best_of” to 10 and “n” to 3, the model will generate
    10 candidate completions and return the 3 best ones based on their log- probability
    per token. This allows for choosing from a larger set of gener- ated completions
    and selecting the ones considered the “best” in terms of quality and coherence.


    Using the “best_of” option with “n” can be useful when you want to obtain multiple
    high-quality results from a larger set of generated completions. This allows for
    selecting the most optimal responses and better controlling the quality of the
    returned results.


