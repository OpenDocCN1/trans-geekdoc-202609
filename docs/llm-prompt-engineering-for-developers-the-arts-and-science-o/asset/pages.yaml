- pgno: 215
  md: '# 17 - A Practical Guide to Testing and Scoring Prompts


    # 17.1 - How and What to Evaluate in a Prompt


    Assessing the effectiveness of a prompt involves evaluating how well it elicits
    the desired response. There are no universal metrics for prompt effectiveness,
    as it depends on the context and purpose of the application, the model, and the
    prompt itself. For instance, a prompt that’s effective at eliciting a response
    from a small group of participants may not be as effective with a larger group.
    Similarly, a prompt that’s effective at eliciting a response from a specific demographic
    group may not be as effective with a different group.


    However, we can establish a few general guidelines for evaluating prompt effectiveness.
    Here are some methods to assess prompt effectiveness:

    Continually modify the prompt based on feedback and results, then retest it. The
    prompt’s effectiveness should improve with each iteration.


    An example of iterative testing for a prompt involves testing the prompt with
    different versions of the same purpose.


    ```

    Version 1: Summarize the main idea of the article in 1-5 sentences.

    Version 2: If this article was very short (1-5 sentences), how would you summarize
    its main idea?

    Version 3: Create a short summary of each paragraph in the article. Connect the
    summaries to create a summary of the entire article. Do not exceed 5 sentences.

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Testing involves not only evaluating the prompt itself but also other variables
    such as the scalability and generalizability of the prompt. Therefore, evaluate
    whether the prompt remains effective when presented to larger models and if it
    remains effective when presented to different models. This depends on whether
    the prompt is designed to be general or specific to a model.


    Testing prompts using controlled experiments is a good way to evaluate their effectiveness.
    Compare the response rates of different prompts in controlled environments to
    see which is more effective. This method helps isolate the effect of the prompt
    from other confounding variables.


    However, it’s not always feasible to conduct controlled experiments. In such cases,
    you can use other methods such as A/B testing: Present two versions of a prompt
    (or more, in the case of A/B/C testing, etc.) to different groups and compare
    the outcomes. This method can help pinpoint which version of the prompt is more
    effective.


    Example of an A/B test for a prompt:


    ```

    A = `Enumerate 10 things humans do better than machines.`

    B = `List 10 things humans do better than machines.`

    ```


    Ensure that the prompt is the only variable, as any differences in the outcomes
    should be attributed to the prompt itself.


    On the other hand, testing without having the right metrics is like shooting in
    the dark. Therefore, make sure to define the right metrics for your prompt, such
    as response time, response length, and response quality. This will help you evaluate
    the prompt more effectively.


    For example, measure the time it takes for a model to respond to a prompt. An
    efficient prompt may lead to faster response times if it’s clear and to-the-point.


    In addition to setting up the right metrics, you should also define the right
    test cases and gather qualitative feedback. The latter can be done by crowdsourcing
    the evaluation and gathering participants’ opinions on the clarity, relevance,
    and effectiveness of the response of your LLM to the prompt. Platforms like Amazon
    Mechanical Turk can assist you with this.'
  merge: -1
