  md: '# # 20 - Anatomy of a Prompt


    When creating a prompt, it’s important to understand the different com-ponents
    that you may use in it. The following list describes the different components
    of a prompt:


    +   - Role

    - Instructions

    - Input data

    - Context

    - Rules

    - Output

    - Examples


    There is no official standard for creating prompts, but most prompts contain at
    least one of these components.


    Here is an illustration:


    ![](img/ee54af4a0c9d9a4beda42d94caa5229b_284_0.png)


    Not all of these components are required, but they can be useful in getting more
    accurate and relevant results.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 20.1 - Role or Persona


    A role is a fictional character that represents a specific type of user. It is
    used to provide context for the prompt and guide the model’s response.

    Examples of roles include:


    +   - A customer service representative

    - A salesperson

    - A doctor

    - A lawyer

    - A teacher


    Here are some examples:


    ```

    Act as a customer service representative for a large retail company.

    ```


    ```

    Act as an experienced salesperson.

    ```


    ```

    You are a clever and friendly assistant. Your job is to help people fin\\

    d the best deals on the internet.

    ```


    ```

    Act as a movie critic for a popular website.

    ```


    ```

    You are an SEO specialist with more than 20 years of experience.

    ```


    A user on Hugging Face has an app based on the BART model and trained on a dataset
    of prompts. The app is called ChatGPT Prompt Generator$^{94}$ and it could be
    helpful to experiment and generate the role of your prompt.


    > $^{94}$https://huggingface.co/spaces/merve/ChatGPT-prompt-generator'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 20.2 - Instructions


    The instructions are the main part of the prompt and they provide the main task
    for the model. Instructions could be used to ask the model to perform a specific
    task or generate a specific type of output.


    Here is an example:


    Create a blog post titled "The Top 10 Movies of All Time".


    Depending on the prompt type, the instructions could be explicit (e.g., a clear
    task) or implicit (e.g., a question or a conversation). We are going to learn
    more about the types of prompts in the next sections.


    # 20.3 - Input Data


    Input data is what we feed to the model. It could be anything from a few sentences,
    a list, or a long paragraph. Input data is used to provide the model with guidance
    on what and how to generate the output.


    Let’s imagine you want to create a blog post about the top 10 movies of all time
    according to IMDB. You could assist the AI model by feeding it the following input:


    +   1. The Shawshank Redemption

    2. The Godfather

    3. The Dark Knight

    4. The Godfather Part II

    5. 12 Angry Men

    6. Schindler’s List

