    AP (from Lambda) +0.3, -2.35, -0.10. The probe was carefully fixed into position
    and anchored to the skull using dental cement (Unif Tread). To minimize electrical
    noise during recording, a mesh was attached to the skull using dental cement (Postite
    Funio).


