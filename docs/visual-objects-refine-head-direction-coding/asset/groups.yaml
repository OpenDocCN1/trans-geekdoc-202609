    和 180°指向细胞）是相同的。


    这由一个在 θ<sub>min</sub> = 0 处的计数、具有高 V<sub>max</sub> 和幅度的 M 不确定分量组成。我们假设头部的 I 和
    M 单元受到刺激的驱动强度相等。


    每个神经元的最终发放率是其取向的幂律函数。


    ```

    $V(θ) = V_{max}e^{-|θ-θ₀|}$

    ```


    参数取自 (46) 中的定义（见表 S7）。为了测试结果的稳健性，从均匀分布中采样了 12250 个具有不同权重的神经元群体（见表 S7）。对于每个输入 HD
    (0°) 的神经元，通过输入的小变化 (Δθ=) 计算了与 HD (0°, HD-场) 对齐以及与该 HD (180°) 对齐的神经元速率变化。


    # 响应延迟


    对于每个 HD，均呈现所有的试验和刺激以获得神经元的整体响应。响应延迟定义为神经元发放率上升到前一次标准差两倍的点。


    # 灌注与组织学处理


    在电生理实验结束后，使用戊比巴（100 mg/kg）和尿素（16 mg/kg）对动物进行深灌注，然后用 4% 甲醛固定的 0.5% 磷酸缓冲盐溶液同时灌注。


    在慢性记录的情况下，撤回电极以移除探针。将大脑取出并在更换溶液为 30% 蔗糖磷酸缓冲盐溶液后保存 4 小时。在 -20°C 下冻结后，使用冷冻切片机以 50μm
    的厚度对大脑进行冷冻切片。


    切片用 DAPT 染色并置于 Mifogli 培养基。含有探针的切片与抗 IIIβ 一抗体 (1:200) 和标记有荧光团 488 的二抗体在 4°C 下孵育过夜，随后——


    使用荧光显微镜获取神经元的图像和硅探针的轨迹。


    在急性记录的情况下，神经元收集在 ACSF 溶液中。大脑经过清洗并包埋在 4% ACSF 中。使用振动切片机（Vibrotome TX）切成厚度 100μm
    的冠状切并用 DAPT 染色。


    使用带有 20x 物镜的 Leica TCS 激光共聚焦显微镜捕捉图像。使用 LAS 软件和 Adobe Photoshop 进行处理。


    # SSN 模型


    上层环状网络模型 (46)，细胞连接网络 N=50 和 N=51 神经元被放置在 θ = [-π, π] 的环周围。以下方程描述了


    ```

    $V_i = V_{rest} + V_{max} - \sum_{j} W_{ij}(V_j)$

    ```


    其中 $V_i$ 和 $V_j$ 分别指在 θ₀ 和 θ 处的单元神经元的膜电位和电流，$V_{max}$ 是外部输入，$W_{ij}$ 是从 θ₀ 到 θ
    的突触连接强度，其固定值使得权重 $W_{ij}$、$W_{ji}$ 和 $I$ 的之和为


    ```

    $I_{h}(\theta_0) = I(t) + I_{max} \left[ \frac{\cos(\theta - \theta_0)}{\sin^2\theta}
    \right]$

    ```


