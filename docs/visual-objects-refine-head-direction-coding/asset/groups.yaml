    # 研究文章


    分析中包含了一种刺激（Wilcoxon 符号秩检验，经 FDR 校正）。对于每个细胞和刺激，计算了响应窗口内的最大放电率。这产生了细胞特有的偏好调优曲线（代表偏好刺激），为了视觉化不同的速率，该曲线被缩放至
    0 到 1 之间。


    调制组被分配了正向响应（相应地，负调制细胞也是如此）。为了视觉化环形 F4 中相对于细胞头部方向调优（活动凸起）的响应，将所有小鼠的细胞根据其偏好方向分入
    20 个角度箱。随后，对平均值（虚线）后的响应进行了归一化（0.1 缩放因子）。


    ## 啾啾刺激


    呈现了 20 次全长度的啾啾刺激，其穿插了 10 次全场灰色。刺激强度随着频率从 0.3 Hz 增加到 8 Hz，而平滑地从黑色变为白色。对幅度大于 3 Hz
    的刺激进行了分析。针对啾啾刺激，使用 i-D 小波变换（MATLAB `cwt.function`）对每个细胞的归一化放电率进行分解。随后，在分析所有频率后，在最后一次啾啾刺激之前，预测试刺激
    5 ms 以下的功率代表了细胞响应的最大频率。


    在每只小鼠中，我们观察到具有头部方向调优且活动增加的细胞（活动凸起）。这种活动在每只小鼠中是稳定的，因为从自由移动切换到头部固定装置时不存在系统性映射。按照要求，我们使用了在
    0° 附近强调制的 HD 偏好方向。例如，在每只小鼠中，将细胞偏好方向的平均值与视觉刺激进行比较，然后减去


    ## HD 调优


    HD 调优曲线的计算方法如前 (4)。简而言之，追踪动物头部的标记并连接到水平方向（方向的偏角）。偏角在坐标 (i) 中测量（与环境轴对齐，在整个研究期间保持一致）。HD
    调优曲线通过在每个方向上花费的时间比例生成，使用 1° 的箱和高斯核（3 个标准差）。细胞的偏好方向定义为调优曲线的平均值。


    为了确定一个细胞是否对头部方向调优，我们按照之前的描述 (6) 使用了这种方法：


    ```

    $i = \frac{\lambda(\theta)}{\sum\lambda(\theta)} \times p(\theta)$

    ```


    在这里，$n$ 代表细胞在第 $i$ 个箱 $\theta$ 中的总速率，$\lambda(\theta)$ 代表神经元在选择期间的平均放电率，$p(\theta)$
    表示 $\theta$ 的占用率（在 $\theta$ 中的平均时间）。信息率（以每秒比特表示）随后通过平均放电率进行调整，以符合细胞指标（头部方向，以比特为单位）。


    ## 细胞类型分类


    PoSB 细胞按照之前的描述 (4) 进行分类。简而言之，运动期间放电率高于 10 Hz 且峰持续时间短于 0.4 ms 的细胞被分类为快速旋转神经元。相反，放电率低于
    10 Hz 且持续时间 0.4 ms 的细胞被分类为慢旋转神经元。该组进一步分为 HD 细胞（头部方向信息高于 0.1 bit 的 HD 细胞）或慢 HD
    细胞（头部方向信息低于 0.1 bit）。所有其他细胞均被排除。


    ## 头部固定条件下的视觉响应及关联


    为了确定细胞是受视觉呈现的正向还是负向调制，我们使用 Wilcoxon 符号秩检验比较了该细胞在所有试验中刺激关闭 期间的平均放电率。校正 p 值（B-H
    相关性）和更多


    ## 自由移动小鼠的视觉响应和两种景观


    使用了与上述实验相同的测试，在该实验中线索被放置在彼此间隔 160° 的两个墙上。视觉图像为单色和双色屏幕，用于头部固定装置的实验对象（被显示在图表上）。窗口宽度为
    15 cm，物体或扰码物体为 13 cm。然后，我们只在动物看向视野时计算点。


