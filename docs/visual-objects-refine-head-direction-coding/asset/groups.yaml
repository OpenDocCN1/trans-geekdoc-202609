    # 研究论文摘要


    # 神经科学


    # 视觉对象精化了头方向编码


    Dominique Siegenthal, Henry Denny†, Sofia Skromme Carassor‡, Johanna Luisa Mayer§,
    Daniel Levenstein, Adrien Pyreche§, Stuart Trehrenheim¶, Émile Macé‡


    ![](img/63a3bc1539b69f0a7e4670d593b6c59a_0_0.png)


    全文及作者所属机构列表：https://doi.org/10.1038/s41593-018-0126-6


    **引言：** 在日常生活中，我们利用视觉对象（例如在镇中行走时的空间时钟）或作为空间地标来帮助我们在穿过世界时定位。我们之所以可以将视觉对象作为空间地标，是因为我们大脑在将世界解析为物体时会进行计算能力的解码。然而，我们在世界中的位置是由大脑中的位置细胞、网格细胞和头方向细胞（HD
    cells）处理的。但关于视觉对象如何调节编码空间变量的神经元调谐，仍有许多未知，因为目前尚不清楚大脑是如何处理视觉对象的，而空间导航正是研究得最广泛的领域。


    HD细胞根据其偏好方向受到视觉刺激的差异化调节；指向视觉刺激的HD细胞被激活，而背离视觉刺激的HD细胞则被抑制。在自由运动的条件下（即当环境中显示一个物体时），观察到了空间导航现象。


    **原理：** 为了填补这一知识空白，我们推论自由状态下的脑活动筛选可以以无偏偏的方式识别出偏好视觉对象的区域。通过电生理学方法，我们表征了响应自由移动物体区域内单个神经元的空间特性。


    **结论：** 视觉对象通过增加编码视觉刺激的HD细胞的响应，同时减少远离物体的HD细胞的放电率（并伴有一个伴体，在我们的实验中，伴体是大脑），精化了海马中HD的群体编码；每当我们使用地标（即……的图像）时，指南针就会变得更好、更准确。这些结果为大脑如何利用视觉地标来增强对世界空间信息的编码提供了见解。


    **结果：** 我们的基于超声成像的脑筛选显示，与空间导航相关的区域而非视觉皮层区域对视觉对象表现出偏好。作为HD系统的部分下丘脑（postsubiculum）表现出最强的偏好方向。在固定条件下，当


    视觉对象代表头方向的表征。


