    Full article and list of author affiliations: https://doi.org/10.1038/s41593-018-0126-6


    **INTRODUCTION:** In day-to-day life, we use visual objects (e.g., a spatial clock
    when walking around town), or as spatial landmarks to help orient ourselves as
    we make our way through the world. We can use visual objects as spatial landmarks
    because our brains decode computational power when parsing the world into objects.
    However, our location in the world is processed by place cells, grid cells, and
    head direction cells in the brain. However, many remain unknown about how visual
    objects modulate the tuning of the neurons that encode spatial variables, because
    it is unclear how visual objects are processed by brains, where spatial navigation
    has been most extensively studied.


    HD cells were differentially modulated by visual stimulation based on their preferred
    direction; HD cells pointing towards the visual stimulus were evoked, whereas
    HD cells pointing away from the visual stimulus were inhibited. The spatial navigation
    was observed in freeing conditions, when an object was displayed in the environment.


    **RATIONALE:** To address this gap in knowledge, we reasoned that a brainactivity
    screen in free could identify visual objects-preferring areas in an unbiased way.
    Using electrophysiology, we characterized the spatial properties of individual
    neurons in the areas responding to freely moving


    **CONCLUSION:** Visual objects refine the population encoding of HD in the hippocampus
    by increasing the response of HD cells that encode the visual stimulus while simultaneously
    decreasing the firing rate of HD cells away from the object (with a companion,
    which, in our experiments, is the brain), and each time we use a landmark (which
    is an image of), the compass needle becomes better and more accurate. These results
    provide insight into how the brain uses visual landmarks to enhance the encoding
    of spatial information about the world.


    **RESULTS:** Our brain screen based on ultrasound imaging revealing spatial navigation-related
    areas, not visual cortical areas, showed to show a preference for visual objects.
    The postsubiculum, a of the HD system, exhibited the strongest preference direction.
