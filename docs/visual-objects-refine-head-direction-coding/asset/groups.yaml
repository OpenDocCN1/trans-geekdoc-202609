    was scaled between 0 and 1.


    positive response was assigned to the modulated group (and accordingly for negatively
    modulated cells). To visualize the responses with respect to cell head direction
    tuning (activity bump) in ring F4, the cells of all mice were binned into 20 angular
    bins based on their preferred direction. The then responses were normalized (0.1
    scaling factor) from the average (dashed line).


    ## Chirp stimulus


    A full-length chirp stimulus was presented 20 times, interleaved with 10 of full-field
    gray. The stimulus intensity smoothly shifted from black to white with increasing
    frequency from 0.3 Hz to 8 Hz. With a stimulus with amplitude larger than 3 Hz
    the analysis was performed. In response to the chirp stimulus, the normalized
    firing rates of each cell were decomposed using i-D wavelet transform (MATLAB
    cwt.function). Then, after all frequencies were analyzed, the power below 5 ms
    of the pre-test stimulus was presented before the last chirp presented the maximal
    frequency the cell responded to.


    In each mouse we observed an accumulation of cells with head direction tuning
    and increased activity (activity bump). This activity was stable each mouse because
    there was no systematic mapping when moving from the freely moving to the head-fixation
    setup. As requested, we used the HD preferred directions which were strongly modulated
    around 0°. For, in each mouse circular the mean of the preferred directions of
    the cells was compared to the visual stimulus was determined, and then subtracted
    from


    ## HD tuning


    HD tuning curves were calculated as previously described (4). Briefly, markers
    on the animal''s head were tracked and connected to a horizontal orientation (yaw
    of direction). The yaw was measured in coordinates (i, aligned with the environment''s
    axes, consistent throughout the study). HD tuning curves were generated as the
    ratio of time spent in each direction, using 1° bins and with a Gaussian kernel
    (3 standard deviation). The preferred direction of a cell is defined as the mean
    of the tuning curve.


    To determine whether a cell is tuned to head direction, we used the head direction
    as previously described (6) with this method:


    ```

    $i = \frac{\lambda(\theta)}{\sum\lambda(\theta)} \times p(\theta)$

    ```


    Here, $n$ represents the total rate of the cell in the ith bin $\theta$, $\lambda(\theta)$
    represents the neuron''s average firing rate during election, and $p(\theta)$
    denotes the occupancy (mean time spent in) $\theta$. The information rate (expressed
    in bits per second) was then adjusted by the mean firing rate to align with the
    cell metric (head direction, measured in bits).


    ## Cell-type classification


    PoSB cells were classified as previously described (4). Briefly, cells with a
    higher firing rate than 10 Hz during the moving and a peak duration shorter than
    0.4 ms were classified as fast-spinning neurons. In contrast, cells with firing
    rates below 10 Hz and durations longer than 0.4 ms were classified as slow-spinning
    neurons. This group was further divided into HD cells (HD cells with head direction
    information above 0.1 bit) or slow-HD cells (HD direction information below 0.1
    bit). All other cells were excluded.


    ## Visual responses in head-fixed conditions and relating


    To determine whether a cell was positively or negatively modulated by the visual
    presentation we compared the mean firing rate during the stimulus OFF period across
    all trials of a cell with a Wilcoxon signed rank test. Cells with corrected p
    values (B-H correlation) and more


    ## Visual responses in free moving mice and two landscapes


    The same tests were used, as in the experiment above where cues were placed on
    two walls 160° off from each other. The visual images were of one and dichromorphic
    screens used in the head-fixed setup (experiment objects) were presented on a
    graph). The width of the window was 15 cm and the object or scrambled was 13 cm.
    Then we only counted points when the animal looked at the visual field.

