    apparatus. During the surgery we maintained with 1-2% isoflurane. We gave a subcutaneous
    injection (-0.8 mg body weight) and medobarbital (20 mg/kg, as a subcutaneous
    dose of 1 mL) at the incision site or as they were placed in the stereostatic.


