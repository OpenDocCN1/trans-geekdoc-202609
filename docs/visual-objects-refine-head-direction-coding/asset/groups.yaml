    # Results


    ## A brainstorm for areas that preferably respond to visual objects

    To begin, we performed a brain scan in mice using functional ultrasound (fUS)
    window (27–29) for areas that responded preferentially to visual objects. Mice
    were placed with a COMBO window (Fig. 14A) and head-fixed under the ultrasonic
    probe. While the signals were recorded without movement artifacts including the
    olfactory bulbs, cortex, and parts of the brain. Images were presented at 60°
    height, along the horizontal median and 20° toward the vertical median (Fig. 14A),
    a part of the visual field which was stimulated by rapidly moving objects has
    been hypothesized to be important for processing of visual loads (32). To cover
    large part of object size (33), 38 of 48 different objects from different categories
    were shown (Fig. S1). For images which destroyed object identity but maintained
    low-level statistics, the 48 objects were split into two blocks of images and
    four blocks of scrambling, each labeled with index (1–4) to determine the direction
    of evoked changes in each visual volume (Fig. 1b).


    Animals use visual objects to guide navigation-related behaviors. However, visual-object
    preferences have yet to be described in the mouse brain, limiting our understanding
    of how visual-objects affect spatial navigation system. Using functional ultrasound,
    we identified brain areas that were preferentially activated by visual objects.
    While visual cortex did not show a preference, areas associated with spatial preference
    were activated by objects. Electrophysiological recordings in the dorsal cortex
    using HD system confirmed for fast-spiking neurons, visual objects increased rates
    of HD cells aligned with but decreased activity in HD cells for other directions.


    First, we examined the response in anesthetized, mice to all eight blocks (i.e.,
    combined and scrambled stimuli). We used a mouse that works for both (Fig. 1C).
    After antagonistically stimulating the brain into +100, we observed evoked visual
    activity in two brain areas (Fig. 1D). We computed visual object sensitivity (VOS),
    to quantify preferences of visual objects over scrambled stimuli. We found a small
    number of brain areas with statistics that showed a significant preference for
    visual objects: the postculub (Pscb), Parasihubular, and area rostralis (Fig.
    1D). By contrast, many areas showed no preference for visual objects over scrambled
    stimuli. For example, the superior colliculus (SC), we responded significantly
    to scrambled objects (Fig. 1D, F) to repeated experiments. We found similar results
    in areas that responded preferentially to visual objects, we ranked brain-wide
    areas responding significantly to scrambled objects (Fig. S2A, S and E).


    The spatial navigation system comprises neurons whose firing rate is modulated
    by the direction an animal is facing and the location it in an environment (1–3).
    These neurons are essential for the generation of a cognitive map (4, 5). During
    locomotion, the spatial navigation system is modulated by visual inputs (6), while
    visual objects (7) can serve as environmental markers (8). A visual object can
    cause a shift in the animal''s head position (9), leading to a turn (10), while
    cells (11, 12), and grid cells (13). Furthermore, an anchor in the turn can lead
    to instability (12, 13). Thus, visual-objects can anchor the internal representation
    of space (14). However, it is unknown how visual-objects might use the neurons
    in the spatial navigation system endcode affinity.


    To examine whether there was a systematic bias for visual object sensitivity in
    brain, we ranked brain-wide areas responding primarily to visual loads. Based
    on the latest, we categorized responsive brain areas as belonging to (i) the visual
    system, (ii) the spatial system, or (iii) both. We found that the top 10% of visual
    system areas had values as equal to the spatial navigation system (Fig. H), and
    the average VOS of all spatial spatial navigation-related areas were significantly
    larger than that (Fig. 1). If we used unsupervised clustering based on visual
    objects and responses to object direction, we identified four clusters: visual,
    spatial, and two spatial navigation area clusters that showed and exhibited a


    In the rodent brain, studies on visual-object preference have been performed primarily
    in primates (19). This has revealed a series of brain areas, arranged in a hierarchical
    manner and referred to as the ''visual system'', which areas are sensitive to
    high-level representations of visual objects (19, 20). In rodents, lateral visual
    cortex appears to excite vertical-stream-like properties (21–23), and perform
    neurons can respond to turn visual objects (24, 25, 26). However, it remains unknown
    whether visual-objects influence spatial navigation.


