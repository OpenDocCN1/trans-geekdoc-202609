    connected via a SPI interface (Intan Technologies). The probe was inserted into
    a USB interface board. The FCM was fixed in a head-holding tube, to control the
    probe by the manipulator''s coordinate system. Performance (0.5 minute) was measured
    after recording impedance stability. Recordings were performed for 2 brain at
    10 days after the start of recording. For different days, sessions were secured
    with Wilsk-steel cannula. CM-DM (Thermo Fisher, Cambridge) was used to stabilize
    the probe before brain insertion or identifying recording sites post.


