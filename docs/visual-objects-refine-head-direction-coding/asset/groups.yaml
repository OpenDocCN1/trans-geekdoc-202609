    images we created a composite image and extracted statistics using the described
    texture statistics (36) with 25 generics. With this, we generated a scrambled
    image by matching permutation of features (vorticity, linear responses and many)
    of local features in the starting image without taking account the spatial location
    (33) and (34) for the description of alignment. Additionally, images were corrected
    and the SHINE toolbox (81) was used to enhance luminance. Finally, to avoid edge
    effects a small margin was used. For electrophysiological experiments we additionally
    demonstrated with two methods, the full amplitude spectrum (match.m) as well as
    the luminance (match.m).


