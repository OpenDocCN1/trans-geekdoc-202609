    and +20° elevation on a 60 cm monitor (Dell U2415). The monitor was placed in
    front of the mouse. For experiments, we employed a design of 12 groups of 8 stimuli
    for 12 seconds (12 minutes total, with a 30-second interval between groups). Stimuli
    were presented in random order. Each recording lasted 10 minutes for 5 s and interleaved
    with at least 0.5 s of each.


