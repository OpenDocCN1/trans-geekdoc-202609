    Electrophysiological recordings in awake animals

    The probe was lowered below the postmusculature during the motor cruise of 2-8
    hours before the start of recording. Neurophysiological signals were recorded
    at 20 kHz using a 26-channel system (Intan Technologies Headboard Interchanger
    and with) recording software.


    fUS acquisition

    fUS-imaging was collected using a 32-channel matrix probe (15 MHz, 1024 channels,
    resolution: 220 x 175 µm; Vernon) connected to a Vantage 256 system (Vernon, Inc.)
    and connected to a custom fUS acquisition module (Intan AUTC). A multiplexer linked
    the 1024-channel probe to the 256-channel system with hardware and software buffering.


    Behavior of the mice during freely moving assays was tracked using infrared markers
    that were mounted on the skull. Data were recorded using 30 infrared cameras and
    a 20 motion camera system (Optitrack). Behavior was captured by an additional
    mounted camera. Behavioral tracking was acquired at a rate of 120 Hz and synchronized
    with the fUS acquisition via the Intan USB Interface.


    The head was fixed in a head-holding tube and the probe was moved by a manipulator.
    fUS recordings were performed under the FCM coil and kept at 37°C with a temperature
    control. The mouse was viewed through a small quartz window. The compound ultrasound
    image was generated from the summation of planes at -45°, -3°, -1°, 0°, 1°, 3°,
    and 45°. A Power-weightedweighted fUS image was generated from the incoherent
    image of 160 compound images. Data reconstruction was performed in real time using
    the decomposition algorithm. Only 20% of significant signals were reconstructed.


    Visual stimuli

    Images were presented at a size of 60° with the center of the image at -30° width
    and +20° elevation on a 60 cm monitor (Dell U2415). The monitor was placed in
    front of the mouse. For experiments, we employed a design of 12 groups of 8 stimuli
    for 12 seconds (12 minutes total, with a 30-second interval between groups). Stimuli
    were presented in random order. Each recording lasted 10 minutes for 5 s and interleaved
    with at least 0.5 s of each.


    # Electrophysiology recordings under anesthesia


    Data was recorded at 20 kHz using silicon probes (Cambridge NeuroTech, type III)
    connected via a SPI interface (Intan Technologies). The probe was inserted into
    a USB interface board. The FCM was fixed in a head-holding tube, to control the
    probe by the manipulator''s coordinate system. Performance (0.5 minute) was measured
    after recording impedance stability. Recordings were performed for 2 brain at
    10 days after the start of recording. For different days, sessions were secured
    with Wilsk-steel cannula. CM-DM (Thermo Fisher, Cambridge) was used to stabilize
    the probe before brain insertion or identifying recording sites post.


    Silicon probe insertion for (chronic) anesthesia

    Animals were anesthetized with 5% isoflurane and prepared with a stereostatic
