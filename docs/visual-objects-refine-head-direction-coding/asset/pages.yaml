    Surgeries were performed anesthetized with a subcutaneous injection of ketamine
    (0.05 mg/kg), midazolam (5 mg/kg) and medetomidineidine (FMM complex). We were
    using a heating pad and kept at 37°C with a temperature-controlled probe during
    surgery. Local anesthesia was performed with lidocaine (Bayer, Bayern). A large
    cranial window was created using a skull dental drill, extension from +2.5 mm
    after peri, ensuring the dura remained intact. The wound was closed with sutures
    and cyanoacrylate (glue) and it was reinforced with dental cement (Sper-Bound).
    Anesthesia was reverted by administering intravenous bupentaniline (0.5 mg/kg)
