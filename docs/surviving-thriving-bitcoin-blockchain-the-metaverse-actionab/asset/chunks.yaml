    within a blockchain network. Another way to look at it is that the decentralized
    process works as a dependable transaction authentication protocol. Hence there
    are no third parties involved.


    With every transaction confirmed and authenticated, the miner responsible for
    it will earn a reward. Based on the high energy consumption required for bitcoin
    mining, many individuals can hardly provide the resources required. That’s why
    it’s mostly an activity dominated by big companies. To overcome the challenges
    associated with power consumption, some companies are moving their operations
    into areas with a sufficient supply of renewable energy.


