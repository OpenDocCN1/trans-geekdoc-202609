    企业破产是指公司清算资产，用所得偿还部分债务，然后完全停止营业。与所有企业实体一样，任何持有你资产的加密货币公司在面临重大运营瓶颈、市场违规或无法偿还总债务时，都可以申请具有法律依据的破产。风险之处在于，任何加密货币交易所都可能随时申请破产。当这种情况发生时，你可能会损失资金和交易账户。


    # 比特币挖矿


    这是另一种你可以现在就开始从比特币中获益的策略。尽管这是一个高技术性且资源密集型的过程，但如果你具备必要的条件，比特币挖矿具有巨大利润的潜力。在区块链技术和比特币的早期，挖矿是技术专才的乐场。但现在，资金雄厚的企业实体已经出现，使其对新入者更具吸引力。


    ### 什么是比特币挖矿


    比特币挖矿是通过解决密码和数学难题来获取数字货币（如比特币）奖励的竞争性过程。有趣的是，每位矿工都在与其他矿工竞争同一个奖励。挖矿竞争的本质是提供证明、验证并认证区块链网络内的交易。另一个角度来看，这种去中心化过程充当了可靠的交易认证协议。因此，没有第三方参与。


    随着每笔交易被确认和认证，负责该交易的矿工将获得奖励。基于比特币挖矿所需的高能，许多个人无法提供所需的资源。这就是为什么这主要是大公司主导活动。为了克服与消耗相关的挑战，一些公司正将其业务搬到可再生能源供应充足的地区。


    ### 比特币挖矿的益处


    *   巨大的盈利潜力

    *   无需处理债务负担

    *   高灵活性

    *   交易不可篡改

    *   没有第三方机构


    ### 挖掘比特币的要求


    **数字钱包：** 这是你开始挖掘比特币的首要任务。你通过挖矿赚取的币将存储在钱包中供未来使用。你可以从本书前面提到的某些加密货币交易平台获取钱包。从该钱包，你可能随时转移或使用你的挖矿收益。


    **计算机硬件：** 你需要一台具有巨大计算能力的高级计算机开始。这里需要注意的是，使用普通电脑挖掘比特币是不可行的。如果你访问一些零售网站，可以看到其他人专门用于挖掘比特币而使用的不同电脑的评论。在某些情况下，你还会看到专为高功耗挖矿而设计的计算机。


    **比特币挖矿软件：** 开始所需的下一步是特殊的挖矿软件。尽管硬件承担了大部分处理工作，但仍需要软件将你的比特币矿机连接到区块链网络。一些最好的比特币挖矿软件包括
    `Multi miner`、`CGMiner` 和 `Awesome Miner`。


    **比特币矿池：** 这指的是一组分布式矿工，他们通过区块链网络贡献计算资源来挖掘比特币矿。从技术上讲，你可以遵循单机挖矿或矿池路线。单机挖矿意味着你必须提供所有所需设备并开始经营。选择矿池意味着通过支付月费，接入分布在不同地点的现有计算资源。根据你所获得的知识，你可能想从单机挖矿或矿池选项开始。


    ### 最佳比特币矿池


    1. `Binance`

    2. `Foundry`

    3. `BTC.COM`

    4. `F2`

    5. `Antpool`

    6. `Via`


    **电源供应：** 还需要充足的电源供应。在挖矿活动中，检查可再生能源非常重要。除了上述要求外，你必须获得足够的知识和技能来参与矿。在投入任何资金之前，请注意涉及某些风险。在赚钱方面，没有陡峭的学习曲线要走。只需为你的钱包注资并投入你认为合适的任何金额即可。


    # 利息账户


    比特币利息账户类似于传统的储蓄账户。这种数字选择将为你存储的货币支付利息。尽管利率可能不是很高，但它是你在忙碌时获得被动收入的方式之一。


    **选择比特币钱包：** 一些数字钱包提供商也有比特币利息产品。这些公司通过保证金交易所交易和安全贷款盈利。这就是为什么它们可以对此类比特币利息账户支付利息。如果你还没有钱包，第一步是选择一个钱包提供商。


    **比较利率：** 比较该领域竞争对手提供的利率。但不要只看收益率或百分比。考虑每个提供利息账户的平台的条款和条件。由于各种原因（包括服务条款），利率每年在
    2%–15% 之间波动。


    除了利率比较，还要检查提现条款和条件。每个平台多久向你支付一次利息？这些需要记住的关键问题，以确保你符合自己的个人目标和需求。


    **创建账户：** 下一步是在所选平台上创建账户。假设你的加密货币钱包提供商提供利息产品，创建账户或注册此服务将相对容易。你可以在三分钟内准备好账户以赚利息。支付比特币利息的最佳平台包括：


    1. `BlockFi`

    2. `Gemini`

    3. `Nexo`

    4. `Value`

    5. `Binance`

    6. `Compound Finance`


    **验证你的身份：** 在所有允许你开始赚利息的信誉平台上，身份验证都是强制性的。如果你在之前提到的任何平台上验证过身份或个人资料，就不需要重复这一步骤。你只需要政府颁发的
    ID 和手机号码来验证你的身份。

