    在此之前，理解上的差距可能阻碍了你获取区块链技术和加密货币带来的收益与机会。正如我向许多人介绍过的那样，我知道你对这些新兴技术有一些（或许多）未得到解答且令人困惑的问题。我打赌你甚至不知道该从何处开始寻找。你可能会看到一个接一个的商业大师试图推销关于如何在几分钟内赚取数百万的课程——“我如何将
    1000 元变成 100,000 元”。停下，不要往前走，你会损失数百（甚至数千）美元。问问我是怎么知道的……但这正是我在这里的意义，这样你不需要重犯我犯过的那些错误。


    我理解，关于这一切的某些概念和未解决的问题，在你与你在网上和新闻中听到的所有炒作之间建立了一道障碍。


    也许你正在对自己说这是一个骗局，或者说太晚了。对自己诚实一点吧。为什么大公司会开始采用 `bitcoin`、`blockchain technology`
    和 `metaverse` 整合？这项技术正在让人们赚真钱，而且它仍然处于青少年期。


    在深入学习这本书之前，我需要你首要做到的是对新想法保持开放。如果你不能接受这项技术正在彻底改变每一个行业，再次，这本书不适合你。从头到尾，你将从书中获得生存和繁荣所需的所需的坚实基础。无论你的背景如何，你都将拥有一个稳固的平台来探索触手可及的机会。你只需要“伸手”。


    说认真的……


    ### 金融的现实

    在我们进入技术细节之前，承认金融新世界是波动的至关重要的，主要因为它是如此独特。它是充满风险的。你可能在几秒钟内失去一切。这就是为什么在考虑繁荣之前，你需要先考虑生存。


    如果你在投机赌博中失去了资本，那么作为一个初学者，你将一无所有去和繁荣。此外，在没有获得适当信息的情况下，你所做的一切只是投机赌博。虽然谨慎至关重要，但要利用最好的增长机会需要智能的决策。幸运的是，这本书将帮助你建立这种智能的基础。如果你花时间理解我将向你展示的一切，我将教你这几件事的基础：


    #### 尽早入场（是的，你现在仍然早）

    我最喜欢的几句来自中国学者深邃智慧的谚如下：“种一棵树最好的时间是 20 年前，其次是现在。” 想象一下，当 `bitcoin` 的价格低于 100 美元时你投资了几百美元。如果你持有投资，而现在
    `bitcoin` 的价格早已超过了 50,000 美元，你现在的财务状况会有多大不同？停下来思考一下。在 `bitcoin` 价值上发生同样的事情已经发生在多种不同的货币上。但并不是每种币都会变成
    `bitcoin`。现在，如果你拥有识别 `bitcoin` 为重大机会所需的知识，你就会是一个早期的采用者，可能不需要这本书了。所以，你需要在在这个行业中通过正确的知识来定位自己，使其值得你情感和财务投入的价值。


    #### 开始定位

    尽早入场是一回事。采取正确的立场完全是另一回事。这就是为什么你需要遵循一个在该领域深耕了九多年的人的指导。你今天所采取的立场将决定你未来的盈亏结果。这本书为初学者提供了一个可靠的价值知识来源，以建立那个基础并开始行动。


    #### 克服常见的入场障碍

    对于大多数人来说，阻碍他们的既不是缺乏资源、潜力或机会。缺乏知识和信心是两个最显著障碍。最终，这本书将赋予你克服这些对许多人来说无法逾越的障碍的能力。


    #### 发现不同的机会

    当涉及到 `bitcoin`、`blockchain` 和 `metaverse` 的新世界时，不存在“一种适合所有人”的情况。不同的投资工具和机会为不同的投资策略提供了多种选择。`blockchain
    technology` 正在被每个行业采纳，为每个人以不同方式参与创造了机会。在你现在所知的之外，该领域内还存在许多其他机会。你的挑战是找到与你的背景、兴趣、目标和风险偏好完美匹配的最佳机会。这是你将发现的内容之一。


    #### 投资加密知识是有利润的

    知识至关重要，金融领域所有最著名的人不断声称他们从未停止过学习。`Bill Gates`、`Warren Buffet` 等会告诉你他们每天阅读和消费多少知识。除了获取知识之外，这本书还可以让你处于一个在即将到来的技术革命中繁荣的地位。如果你拥有在这些领域进步的知识，你就领先于其他所有拒绝甚至承认这一点的人。知识的下一步是执行，而这正是我们正在为你做的准备。读完这本书后，你将不再受到知识障碍的限制，结果你将变得好得多。


    ### 我的经验

    九年后，我在这个领域积累了相当多的经验……好的、伟大的、坏的、丑的以及可怕的。我经历过上涨 1000%，也经历过下跌 1000%，你懂的。这就是为什么我想写这本书。我希望我曾拥有一套可靠、直接的知识来建立我的基础。但通过我的起起伏伏和丰富的技术经验，我可以为你提供这些。通过使用各种
    `blockchain technologies` 和投入自己的资金所获得的经验，书中分享的见解将引导你在这一领域中走上正确的道路。


    帮助培养对 `Web3 ecosystem` 如何运作的理解，并提供从未知到已知的桥梁，是我开始的原因，这也是你来到在这里的原因。当你阅读这本书时，我将涵盖适合每个人画像的信息和机会，这是这个领域最奇妙的地方。每个人都有自己的切入点。


    '
