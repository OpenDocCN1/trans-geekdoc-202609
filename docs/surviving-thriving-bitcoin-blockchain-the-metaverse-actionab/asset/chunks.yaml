    # WHAT IS BLOCKCHAIN?


    ## WHAT IS BLOCKCHAIN? A DEEPER LOOK


    In the last few years, the term blockchain has consistently been used, especially
    with the rise of cryptocurrencies like Bitcoin and Ethereum. In 2022, blockchain
    seems like the new internet. And like the internet, blockchain is here to stay.
    With this growing popularity, you might be wondering, what is blockchain? Blockchain
    is a chain of blocks that contain data.


    In more advanced terms, a blockchain is a database of records securely linked
    together and distributed among the nodes of a computer network. It is a distributed
    ledger that cannot be altered that is used for recording information and transactions
    electronically in a digital format within a business network. It is a form of
    a record-keeping system that guarantees security and immutability of a record
    of data and a high level of trust without a third party.


    ## WHAT IS BLOCKCHAIN TECHNOLOGY?


    Blockchain Technology is a structure that stores public transactional records,
    popularly known as blocks, in several databases (known as the chain) in a network
    connected through peer-to-peer nodes. This network of storage is usually referred
    to as a digital ledger.


    ## BLOCKCHAIN AS A PUBLIC DIGITAL LEDGER


    As mentioned above, the storage network in blockchain technology is usually referred
    to as a digital ledger. Like the old record-keeping system used for tracking and
    recording information on products, the blockchain also acts as a public digital
    ledger that relies on a similar record-keeping and public verification mechanism.
    Every transaction in this ledger has to be verified and authorized by the digital
    signature of the owner, safeguarding it from hacks and tampering. This makes the
    information contained in a digital ledger highly secured.


    In simpler terms, this public digital ledger is like a spreadsheet that is shared
    among the staff in a company for the record of transactional activities based
    on actual purchases. The interesting angle to the digital ledger is that all the
    computers in the network can access it. Anybody can see the data, but nobody can
    corrupt it. The main aim of a blockchain is to allow digital information to be
    recorded and shared, but not corrupted or edited. This makes the blockchain the
    building block for records of transactions that cannot be altered, hacked, deleted,
    or destroyed. Blockchain as a public ledger is used as a record-keeping system
    that keeps users'' information secure and maintains an immutable record of all
    the genuine transactions executed between network participants.


    ## HOW BLOCKCHAIN IS DECENTRALIZED


    The blockchain works on the concept of decentralization. In a blockchain, decentralization
    is the transfer of decision-making power and supervision from a centralized network
    to a dispersed network. The centralized network could be an individual, corporate
    body, or a group of people. The concept of decentralization aims to reduce the
    level of trust that participants place in central authority and themselves and
    also eliminate the need or ability to exert authority over one another in ways
    that degrade the functionality of the network.


    Decentralization in a blockchain is done by a network that is connected through
    scattered peer-to-peer nodes that verify the authenticity of a block before adding
    it to the chain. The verification of the block is done by a decentralized network
    of computers, which ensures that control and decision-making are not done by one
    individual or group of people but by an even distribution in a network eliminating
    the chance of bias, misuse of power, or misjudgment. Decentralization makes blockchain
    one step more secure for users. Due to decentralization, every transaction in
    the blockchain is highly encrypted and protected.


    ## WHY DECENTRALIZATION MATTERS


    Decentralization as a concept has been in existence long before blockchain. When
    developing a technological network, three major network architectures are usually
    considered; centralized, distributed, and decentralized. While most blockchain
    technologies apply the concept of decentralization, a blockchain network cannot
    simply be classified as decentralized or not. Rather, decentralization should
    be considered as a standard that should be applied to all blockchain applications.


    ***Here are a few benefits of decentralization:***


    **An extra layer of security:** Decentralization adds an extra layer of security
    to the blockchain network. In a decentralized blockchain network, whenever a new
    transaction takes place, it is not automatically added to the chain. Rather, it
    is verified by a decentralized network of computers. This adds an extra layer
    of security to the network because before you can tamper with the blockchain,
    you have to tamper with the blocks of the chain and hack into every node in the
    scattered network of computers.


    **Distribution of authority to every member in the network:** In a decentralized
    network, there is no single body or group that controls the activities or decision-making
    process of the network. Decentralization distributes authority to every member
    of the network, creating a system where no one has to know or trust anyone. Each
    member has a copy of the same data in the form of a distributed ledger with equal
    power to accept or reject any member’s ledger.'
