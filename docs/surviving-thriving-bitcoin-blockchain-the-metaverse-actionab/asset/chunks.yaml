    # 什么是区块链？


    ## 什么是区块链？深度解析


    在过去的几年里，`blockchain` 一词被一直频繁使用，特别是随着 `Bitcoin` 和 `Ethereum` 等加密货币的兴起。在 2022 年，`blockchain`
    似乎是新的互联网。就像互联网一样，`blockchain` 将一直存在。随着这种普及的提高，你可能会好奇，什么是 `blockchain`？`Blockchain`
    是一个包含数据的区块链。


    用更高级的术语来说，`blockchain` 是一个数据库，其记录安全地链接并分布在计算机网络的节点之间。它是一种不可篡改的分布式账本，用于在业务网络中以数字格式电子化记录信息和交易。它是一种记录系统，确保了数据记录的安全性和不可篡改性，并在没有第三方的情况下实现了高水平的信任。


    ## 什么是区块链技术？


    `Blockchain Technology` 是一种结构，它将公共交易记录（俗称为 `blocks`，区块）存储在多个数据库（称为 `chain`，链）中，这些数据库通过点对点节点连接到网络中。这种存储网络通常被称为数字账本。


    ## 作为公共数字账本的区块链


    如上述，存储网络通常被称为数字账本。`Blockchain` 作为一种公共数字账本用于记录活动。在去中心化的区块链中，每笔交易都由网络进行验证和授权。这使得
    `digital ledger` 极其安全。


    简单来说，`digital ledger` 就像一个共享的表格。任何人都可以看到数据，但没有人可以损坏它。`blockchain` 的主要目标是允许信息在一个不可篡改、删除或破坏的记录系统中进行记录和共享。


    ## 区块链是如何去中心化的


    `blockchain` 基于 `decentralization`（去中心化）的概念运行。在 `blockchain` 中，`decentralization`
    是将决策权和监督权从中心化网络转移到分散网络的过程。中心化网络可以是个人、公司实体或一组人。`decentralization` 的概念旨在减少参与者对中心权威以及自身的信任程度。


    `blockchain` 中的 `Decentralization` 通过节点网络完成，这些节点在将 `block` 添加到 `chain` 之前验证其真实性。这使得
    `blockchain` 对用户来说又安全了一步。由于 `decentralization`，`blockchain` 中的每笔交易都经过高度加密和保护。


    ## 为什么去中心化化重要


    `Decentralization` 作为一个概念在 `blockchain` 出现之前就已经存在了。在开发技术网络时，通常会考虑三种主要的网络架构：`centralized`（中心化）、`distributed`（分布式）和
    `decentralized`（去中心化）。虽然大多数 `blockchain` 技术应用了 `decentralization` 的概念，但一个 `blockchain
    network` 不能简单地被分类为去中心化与否。相反，`decentralization` 应该被视为所有 `blockchain` 应用的标准。


    ***以下是去中心化的几个益处：***


    **额外的安全层：** `Decentralization` 为 `blockchain network` 增加了额外的安全层。在去中心化的 `blockchain
    network` 中，每当发生新交易时，它不会被自动添加到 `chain` 中。相反，它通过一个去中心化的计算机网络进行验证。这为网络增加了额外的安全层，因为在你篡改
    `blockchain` 之前，你必须篡改 `chain` 的 `blocks` 并黑入分散网络中的每一个 `node`。


    **向网络中的每个成员分配权限：** 在去中心化网络中，没有单一的机构或团体可以控制网络的活动或决策过程。`Decentralization` 将权限分配给网络中的每个成员，创建了一个无需相互认识或信任的系统。每个成员都拥有以
    `distributed ledger` 形式存储的相同数据副本，并拥有接受或拒绝任何成员 `ledger` 的平等权力。


    '
