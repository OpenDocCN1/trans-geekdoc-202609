    ## 减少系统中的弱性

    去中心化可以极大地减少系统中由于权力过度赋予某个人或过度依赖某群体而产生的弱性，因为它消除了权力滥用、腐败和缺乏激励机制带来的风险。资源优化的分布确保了资源在系统中各个节点之间是均匀分布的，从而提供极佳的服务。


    ## 区块链网络类型

    区块链网络可以通过 4 种不同的方式构建：公共链、私有链、许可链（混合链）或联盟链。


    ### 公共链网络

    公链网络是一个完全去中心化的网络，对所有人开放。公链允许网络的所有成员访问区块链、创建区块并验证区块。你只需要连接互联网即可加入网络并开始交易。该网络通常为验证区块的用户提供激励。比特币和以太坊是公链的两个例子。公链是许可许可，这意味着你不需要任何许可即可加入或交互。


    ### 私有链网络

    私有链是工作在限制环境中的区块链网络，由单一实体控制。它们也被称为托管区块链、许可区块链或企业区块链，例如 Ledger 和 Ripple。出于隐私考虑，私有链通常需要较高级别的隐私保护。


    ### 许可链网络

    也称为混合区块链，这种区块链结合了私有链和公链的元素。它是由希望获得更大灵活性的企业建立并控制的。在混合网络中，某些数据可以是私有的，而另一些数据可以同时公开公开。


    ### 联盟链网络

    联盟链是混合区块链的一种类型，但由一组人或多个组织管理。它是半封闭的生态系统，被称为联邦区块链，比私有链具有更高的去中心化程度，在生态系统中提供了更高水平的安全效率。


    ## 什么是加密钱包？

    加密钱包是一个软件包，允许加密货币用户存储、传输、消费和接收数字资产。类似于物理钱包，加密钱包允许你存储加密货币账户，并提供访问加密货币的界面。使用加密钱包你需要一对密钥：私钥和公钥。私钥是加密钱包最重要的部分，拥有该密钥的人可以控制钱包及其所有资产。


    公钥由私钥生成，并作为发送加密货币的地址。加密钱包可以有多个公钥，但只有一个私钥。持有私钥的加密货币用户使用非第三方托管（自托管）加密钱包进行交易，钱包就像一个由你拥有并控制的银行账户。通过私钥，你可以发起交易以及发送和接收加密货币。


    ## 加密钱包类型

    加密钱包主要有两种类型：软件钱包和硬件钱包。软件钱包也称为热钱包，是计算机应用程序或浏览器扩展，用于发送、接收和存储加密货币。软件钱包中的资金存储在线。另一方面，硬件钱包是物理设备，可以插入计算机实现软件钱包相同的作用。它们有时被称为冷钱包，因为数字资产存储在本地。硬件钱包比软件钱包贵且使用复杂。软件钱包优先考虑便利性，而硬件钱包的设计是为了最大安全性。冷钱包与热钱包不同，连接互联网，不易受到攻击。


    ### 2022 年最流行的加密钱包回顾

    随着加密货币和数字资产的日益流行，现在有很多加密钱包可以选择。我们将简要回顾 2022 年 3 个最流行的加密钱包：


    #### Coinbase Wallet

    Coinbase 钱包是美国最流行的加密钱包之一，也是全球最大的钱包之一，交易超过 100 种加密资产。通过 Coinbase 钱包，你可以在同一个地方存储数字收藏品（NFT）和加密货币。


    **➕ 优点：**

    * 对于几乎或没有加密交易经验的初学者来说是一个极佳的选择

    * 它提供了丰富的加密货币选择；有 100 多种加密货币可供交易

    * 用户友好的设计，界面易于导航

    * 为加密账户注值的门槛低

    * 通过多签名和双重身份验证实现高安全性


    **➖ 缺点：**

    * 交易成本高

    * 交易类型有限


    #### Ledger Nano X

    Ledger Nano X 是一种冷钱包，旨在让你的数字资产尽可能安全。Nano X 被设计为 Ledger Nano S 的升级版，是一款高端硬件加密钱包，它提供了其廉价兄弟产品的所有功能，并增加了功能，例如能够存储更多数量的加密资产以及蓝牙连接，这使得可以在手机上访问钱包。


    **➕ 优点：**

    * 它支持多种加密货币和代币；超过 500 种

    * 拥有较好的电池续时间（8 小时）

    * 蓝牙连接允许你从手机控制钱包

    * 安全性高


    **➖ 缺点：**

    * 价格昂贵

    * 不支持触摸屏

    * 技术性用户界面


    #### Crypto.com Defi Wallet

    Crypto.com Defi Wallet 是 crypto.com 生态系统中一种安全的自托管钱包。作为自托管钱包，用户对自己的私钥拥有完全控制权，这与第三方访问的中央托管钱包不同。由于钱包的去中心化，所有交易都在链上处理，并需要交易费用作为在相应的代币/货币区块链上确认交易的激励。


    **➕ 优点：**

    * 对你的加密钱包和数字资产拥有完全控制权

    * 使用该钱包无需创建账户

    * 支持多种加密资产；超过 300 种，包括比特币、以太坊、BNB 和 Defi 代币

    * 用户友好的界面


    **➖ 缺点：**

    * 如果丢失了私钥和恢复助词，你将永远失去钱包。


    '
