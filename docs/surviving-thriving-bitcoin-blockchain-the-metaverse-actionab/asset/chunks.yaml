    and often employ third-party mediation. By simplifying these strategies with blockchain,
    transactions can be conducted sooner than usual and more efficiently. Documentation
    and transaction components can be preserved on the blockchain, discontinuing the
    need to swap papers. There''s no need to harmonize multiple ledgers, so clearing
    and payment can be much quicker.


    ***Automation***


    Smart deals can automate transactions, improving efficiency and speed up the process
    even further. Once pre-specified requirements are met, the next phase in the trade
    or process is automatically activated. Smart contracts lessen human intervention
    and dependence on third parties to validate that the terms of a contract have
    been fulfilled.'
