  trans: '


    比特币抗通胀的特性之一是去中心化。抗通胀意味着比特币能够不受经济中中央机构的决策和行动所可能引发通胀的改变的影响。换句话说，任何经济体的中央经济机构无论有意还是无意都会引发通胀。以下强调了可能导致通胀的一些特定经济行为。


    * 薪资上涨

    * 财政政策制定

    * 贬值

    * 经济监管

    * 政治违规


    ### 比特币供应有限


    据说比特币的供应量为 2100 万枚。由于这种有限供应，在所有货币创建后，新货币几乎不可能进入流通。与这一事实相反，流通中物理货币供应增加是通胀的影响因素。导致法定货币供应增加的因素包括政府支出增加和印刷更多货币来资预算。在这方面，与实体现金不同，比特币具有抗通胀性。


    ### 它不受单一经济体


    不同国家的通胀率很少相同。当你观察通胀的主要原因时，某些或所有原因可能在特定国家的经济中同时发生。与其他金融资产类别一样，比特币不受任何国家经济变化的影响。有趣的是，它是一种国际认可的金融资产类别，许多人利用它来进行获利的多元化配置。如果你想在房地产、股票和债券之外对投资进行多个类别的多元化，比特币是有价值的加密资产之一。


    ## 什么是去中心化金融？


    去中心化金融使用开源账本系统连接有利益的各方进行金融交易，而不涉及收取费用或对多方施加规则或条例的中间机构。


    比特币或加密货币是一种替代性金融系统，指的是任何人通过区块链网络访问的金融相关产品和服务的集合。作为一个开源网络，没有任何中央机构可以声称拥有或控制去中心化金融（DeFi）在世界上任何部分的运行方式。DeFi
    是一种新兴的全球金融系统，具有重塑金融未来的证明潜力。


    现在，你可能在想，我该如何定位自己以便在不可避免的未来中生存并繁荣？在进入参与的潜在机会之前，让我们来看看 DeFi 是如何工作的。


    ## 比特币如何引入去中心化金融


    作为第一个加密货币，比特币最初是为了与分布式或去中心化的数字账本系统配合而发明的。随后，其他加密货币，特别是以坊（另一种提供实用加密货币，目前正领先着 DeFi
    的加速）根据最初的去中心化原则被发明。金融交易的执行不再依赖于中央机构，而是由区块链网络活跃用户的参与驱动的。在技术术上，这种执行基于两个原则。


    ### 共识机制


    该计算系统用于在区块链网络参与者之间达成达成共识、信任和安全。在比特币区块链中，如前所述，共识机制也被称为工作量证明（PoW）。其核心功能是维护参与加密货币交易的分布式匿名用户的完整性。


    ### 自执行智能合约


    智能合约是基于计算机算法的数字合同，包含两个利益相关方（买方和卖方）之间的交易协议。从技术上说，这些合同是简单的代码行，用于在区块链网络中执行特定交易并为加密货币提供实用性。由于交易双方从未物理出现，因此使用加密的智能合约来维护信任、交易完整性和金融资产的安全。


    去中心化金融（DeFi）做的是将金融交易的多样性扩展到最初通过比特币引入的内容之外。现在，你如何从去中心化金融的出现中受益呢？


    **借贷**：你可以安全地获得不同类型的贷款。有趣的地方在于，你不需要经过繁琐的文件工作，然后等待无尽的时间。借贷的速度快且安全。


    **贷款**：根据你的兴趣，你可能想借出你的加密资金并在指定期限内赚取规定的利息。借出多少由你决定。最近，去中心化贷款平台为普通人创造了金融机会。


    **交易**：在没有传统交易所参与的情况下，你可以开始交易你选择的去中心化金融资产。把它想象成在声誉良好且安全的交易所买卖股票。再次，这些是通过去中心化金融和区块链技术创造的一些新机会。


    **储蓄**：你可以决定将法定货币存为加密货币并获得资金利息。唯一的要求是数字钱包和一些资金。有趣的地方在于，你的储蓄不受贬值其他类型金融资产的持续通胀影响。


    这些是你可能想通过去中心化金融的出现而探索的一些机会，并非全部。最棒的部分是你可以从全球任何地方开始探索这些金融机会。而且你不需要任何集权货币机构的许可。


    ## 中心化 vs. 去中心化金融：有什么区别？


    理解去中心化金融潜在益处的最好方法是通过对比视角。基于这一视角，你可以将核心概念与你的个人经历联系起来。这是识别可能适合你性格或当前财务目标的特定机会的一种有趣方式。让我们看看核心差异。


    ### 第三方参与


    在去中心化金融生态系统中，没有第三方参与交易验证和授权。交易验证不是基于中央机构，而是基于区块链网络中分布式用户之间的计算协议（`smart contracts`）。缺乏第三方也增加了交易速度和效率。


    ### 控制机制


    去中心化金融将活动的控制权交给参与每笔交易的个人。通过数字钱包、密码和访问密钥，你对自己的加密货币拥有 100%的控制权。这与中心系统中金融机构的监管行动相反，后者可能会改变规则、引发通胀和市场变化。


    ### 交易费用


    去中心化系统中缺乏第三方降低了金融交易费用。维护区块链网络运行所需的分布式计算资源的自愿贡献降低了运营成本和交易费用。这种系统的反面是贪婪的私人和中央银行参与，并随着时间的推移要求越来越费用。


    ### 匿名性


    在传统金融系统中，身份验证是花费大量时间和钱的主要因素之一。相比之下，区块链基于无许可系统，加密交易参与者的匿名性得到了维护。


    ### 黑客攻击漏洞


