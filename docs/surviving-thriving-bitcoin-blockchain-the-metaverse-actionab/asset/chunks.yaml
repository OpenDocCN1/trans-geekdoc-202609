  trans: '


    此类退款的棘手之处在于，银行可以在相关业务账户所属商户不知情或未经许可的情况下完成退款。最初，支持拒付（chargebacks）的法律旨在保护消费者免受欺诈性和剥削性收费的影响。遗憾的是，许多人利用同样的法律针对在线零售商和服务提供商。


    与传统金融系统的情况相反，银行在未经商户许可的情况下，无法从 `bitcoin` 账户发起或完成退款。本质上，对于接受 `bitcoin` 付的商户来说，减少拒付是有利的。


    ## 较低的手续费


    加密货币交易缺乏中间环节，通常会导致较低的处理费用。传统货币生态系统中费用较高的主要原因之一是各种第三方参与了交易的验证和认证。当支付流发生在两个遥远国家之间时，费用通常更高。在某些情况下，资金的发送方双方都需要支付费用以成功处理交易。


    由于区块链技术的计算能力，`bitcoin` 交易费用明显较低。与传统系统不同，交易费用几乎不会超过 1%。如果您的业务处理大量交易且正在支付高昂费用，您必须考虑这一点。


    ## 增强对业务资金的控制


    `bitcoin` 的特性使得账户所有者在任何时候对其资金拥有最大的控制权。当您使用传统的支付处理器销售产品和服务时，资金的访问会受到一定时间的限制。换句话说，在大多数情况下（例如信用卡支付），您无法立即获得从销售产品或服务中获得的资金。这种限制背后的原因是为了符合现行的金融法律。支付处理器必须合规才能维持经营。


    通过 `bitcoin`，您可以立即访问并控制商户账户中的资金。当资金在您的账户中时，未经许可，任何第三方或金融监管机构都无法获得访问权限或控制权。例如，您永远不会遇到像
    `Paypal` 或 `Stripe` 那样在没有任何解释的情况下限制您对资金的访问的情况。


    ## 最大的欺诈保护


    在今天，网络犯罪分子可以拦截业务资金的流动。此外，身份盗用和类似的数据泄露会导致某些罪犯获取财务信息，通常导致资金损失。相比之下，区块链生态系统中的匿名支付系统保护了消费者和商户。客户不需要使用个人信息进行购买，商户也不需要为代价的数据泄露付出代价。所有交易都需要购买者（或发送者）使用其私钥。


    '
