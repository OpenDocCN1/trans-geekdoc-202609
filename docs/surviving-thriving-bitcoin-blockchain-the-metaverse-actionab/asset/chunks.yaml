    # WHAT IS BITCOIN AND WHY IT''S THE FUTURE OF FINANCE


    ## WHAT IS BITCOIN?


    Bitcoin is a form of digital currency that uses computational processes for the
    storage of value, exchange of value, and peer-to-peer transactions. Unlike other
    types of money or currencies that have emerged in the financial services industry,
    bitcoin is not physical. It''s 100% digital. Every transaction record is stored
    on a publicly accessible network that uses cryptographic and encryption technology.


    Regardless of geographic location, anyone from anywhere around the world can own
    and exchange bitcoin for their local currency, otherwise known as a fiat currency.
    However, the transactions and ownership units are not within the control of central
    banks or private bank corporate institutional regulations.


    In other words, bitcoin transactions are not stored in a traditional ledger system.


    When you own a unit of bitcoin, you can access your funds through a digital wallet
    and personalized access keys. Instead of using a traditional ledger, units of
    ownership, ownership agreements, bitcoin transactions are stored in an encrypted
    public network. Contrary to being owned and controlled by central banks or corporations,
    the digital ledger system is decentralized.


    Many people across the globe use bitcoin for different types of transactions.
    For example, you can buy physical products online and pay with bitcoin in select
    stores where the digital currency is accepted. Even as a seller of different products
    or services, it is a good idea to recognize that bitcoin might be the currency
    of the future (or one of them) and consider how to utilize it in transactions.


    Before proceeding, I want you to acknowledge that bitcoin is just one of many
    available digital currencies or digital coins. As a beginner, it’s easy to assume
    that bitcoin is the be-all-end-all of cryptocurrency. While this is true to some
    extent, it is not the only coin or form of digital currency.


    Alternative Crypto Currencies Other Than Bitcoin


    *   Litecoin


    *   Dogecoin


    *   Bitcoin Cash


    *   Ethereum


    *   Stellar


    *   Tether


    *   Monero


    *   XRP


    *   Binance coin


    *   USD coin


    ## HOW BITCOIN STARTED


    For different reasons, you might have had an active interest in learning how bitcoin
    started. Let''s explore the brief history of bitcoin as a digital currency. I
    believe that an increased understanding of the original principles will make it
    easier to comprehend other related concepts discussed in this book.


    Following the 2008 global recession, public trust in private banks declined significantly.
    In many financial circles around the world, it is believed that the blockchain
    white paper published by Satoshi Nakamoto was inspired by the publicized large-scale
    accounting fraud which led to the fall of many banks.


    In that white paper, the proposed invention represents an alternative financial
    system through which everyday individuals can conduct transactions without the
    involvement of private banks, central banks, or the government of any country.


    That white paper was published on October 31, 2008. Satoshi''s writing described
    a new digital cryptocurrency named Bitcoin, which will be used as a peer-to-peer
    cash system. Instead of relying on traditional third parties, bitcoin was made
    to depend on cryptographic digital technology to maintain trust, stored value,
    and transaction integrity.


    Originally, the first bitcoin was invented and published in 2009 as open-source
    software. Then on January 12, 2009, the first bitcoin transaction was recorded.
    Dr. Craig Wright, whom many believe to be the same as Satoshi Nakamoto, sent ten
    bitcoins to Hal Finney, a renowned cryptographic expert.


    The first unit of bitcoin existed as a block (genesis block) in a public ledger
    system. That ledger system works as a digital chain of blocks of data, containing
    cryptographic hashes or codes.


    In simple terms, a hash is an algorithm-based function that meets the encrypted
    demands needed for a completed blockchain computation. Besides transaction verification,
    one of the key functions of the hash is to maintain the integrity and anonymity
    of information passing between senders and recipients in the blockchain network.


    Technically, the block and hash are made up of mathematical algorithms meant to
    perform different functions. Remember what I said earlier that the first bitcoin
    was invented as an open-source code. This was the humble beginning of bitcoin.


    ## HOW BITCOIN WORKS


    Based on the original definition in Satoshi''s white paper, bitcoin is a form
    of digital money or cryptocurrency. Unlike physical cash, it is a form of a computer
    file or algorithm meant for specific functions like definition, measurement, storage,
    and transfer of value. As a form of digital currency, bitcoin works as a chain
    of blocks of information that is not within the control of any central bank or
    corporate institution. Through the public ledger system, the blockchain, people
    can conduct financial transactions without physical contact or physical exchange.


    At any given time, owners and users of bitcoin can initiate a peer-to-peer( or
    person to person) transfer of measurable bitcoin value from one digital wallet
    to another. There are no time-bound restrictions as there is with the traditional
    financial markets or systems. For any reasons, people can buy


    bitcoin in exchange for fiat currency, transfer the bitcoin to their digital wallet
    and then use that bitcoin to transact with other bitcoin holders. That''s why
    cryptocurrency exchanges exist in the first place.


    There is also a bitcoin acquisition process called mining. But we''ll get to that
    later.


    Another important thing about how bitcoin works is that completed transactions
    are irreversible. As a beginner in the crypto space, this is fundamental to the
    nature of a decentralized currency.


    ## FIVE CORE CHARACTERISTICS OF BITCOIN'
