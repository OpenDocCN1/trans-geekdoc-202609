  ## 比特币如何为区块链技术铺路


  2004 年，在 `bitcoin` 发明之前，美国计算机科学家兼开发者 `Hal Finney` 为不可交换的 `hashcash` 引入了可重用的工作证明（`PoW`）机制，用以交换
  `RSA` 签名的令牌。如果你好奇，`hashcash` 是 `PoW` 系统的早期版本，旨在防止拒绝服务攻击和垃圾邮件。如果你不理解这项技术，不要担心，只需知道
  `bitcoin` 的起源可以追溯到 2004 年即可。


  在很大程度上，这是 `bitcoin` 和区块链技术发明的概念基础。从历史上看，`Hal Finney` 也是第一笔加密货币交易中第一个 `Bitcoin` 接收者。


  通过 `Satoshi Nakamoto` 发表介绍去中心化数字货币理念的白皮书，“区块链”的概念诞生了。从一开始，那篇论文中的数字货币概念被恰地命名为 `bitcoin`。2009
  年 1 月 8 日，`bitcoin V0.1` 作为开源软件发布。


  在 2009 年 1 月 12 日 `Satoshi` 向 `Finney` 转账 10 个 `bitcoin` 后，最初名为 `bitcoin` 的数字货币理念变成了现实。早期的开发者创建了一个
  `Bitcoin-Dev` 互动聊天频道，用于开发者社区内的讨论和新闻，以支持开源平台。


  这些发展增加了人们对区块链技术潜力以及去中心化数字货币可行性的认知，从 `bitcoin` 开始。


  这就是区块链技术革命的开始。因此，它为创建其他数字货币以及在银行金融之外的各行行业应用该技术提供了强大的土壤。


