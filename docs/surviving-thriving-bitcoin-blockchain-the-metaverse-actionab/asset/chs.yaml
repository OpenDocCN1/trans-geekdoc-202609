  ## 比特币是如何产生的


  出于不同的原因，你可能对学习比特币是如何产生的产生了浓兴趣。让我们探索比特币作为数字货币的简短历史。我相信，对原始原理的理解将有助于理解书中讨论的其他相关概念。


  继 2008 年之后，公众对银行的信任大幅下降。在许多世界金融圈中，中本聪（Satoshi Nakamoto）提出的白皮书代表了一种新的系统，人们可以在不涉及私人银行或政府的情况下进行交易。该白皮书发表于
  2008 年 10 月 31 日，描述了一种名为比特币的数字货币，它将作为点对点现金系统使用。与其依赖第三方，比特币依赖加密技术来维护信任、存储价值和交易的完整性。


  最初，比特币于 2009 年作为开源软件发明。在 2009 年 1 月 12 日，克拉格·赖特（Craig Wright，许多人认为他是中本聪）向哈尔·芬尼（Hal
  Finney）发送了十个比特币，芬尼是著名的密码学专家。


  比特币的第一个单位存在于公共账本系统的创世区块（genesis block）中。全球许多人使用比特币进行不同类型的交易。例如，你可以在接受数字货币的特定商店在网上购买实体产品并使用比特币支付。区块链是由加密哈希或代码组成的。


  简单来说，哈希是一种基于算法的函数，满足完成区块链计算的需求。除了交易验证外，哈希的关键功能之一是维护发送者和接收者之间信息的完整性和匿名性。


  从技术上讲，区块和哈希是由用于执行不同功能的数学算法组成的。记得我之前说的吗，比特币是通过开源代码发明的。这是比特币的起点。


  ## 比特币是如何工作的


  根据中本聪白皮书中的原始定义，比特币是数字货币或加密货币的形式。与物理现金不同，它是一种计算机文件或算法，用于特定的功能，如定义、测量、存储和转移价值。作为数字货币，比特币作为区块链运行，不受任何银行或公司机构的控制。通过公共账本系统（即区块链），人们可以在没有物理接触或物理交换的情况下进行金融交易。


  在任何时候，比特币的所有者和用户都可以从一个数字钱包向另一个数字钱包发起可衡量的比特币价值点对点传输。没有传统金融市场或系统那样的限制。出于任何原因，人们可以用法定货币兑换比特币，将比特币转移到他们的数字钱包，然后使用这些比特币与其他比特币持有者进行交易。这就是加密交易所存在的原因。


  还有一种被称为挖矿的比特币获取过程。但我们稍后会讨论。


  关于比特币如何工作的另一个重要点是，完成的交易是不可逆的。作为加密领域的初学者，这对于去中心化货币的本质至关重要。


  ## 比特币的五个核心特征






  ### 交易透明度

  在公共账本系统或区块链上，每笔交易具有极高的透明度。然而，只有拥有访问密钥的授权用户才能查看每笔 `bitcoin` 交易的详情。此外，公开访问增强了每笔 `bitcoin`
  交易中涉及每一方的信誉。因此，随着越来越多的区块添加到链中，整个生态系统将变得更有价值且更安全。


  ### 执行速度

  基于其技术，人们可以在几秒或几分钟内在全球范围内发送和接收 `bitcoin`。由于不需要第三方验证或授权协议（类似于传统的银行交易），它成为了最快的汇款方式。此外，交易手续费相对较低。这是使用
  `bitcoin` 代替传统转账系统的最大优势之一。


  ### 去中心化

  没有中央机构控制 `bitcoin` 在全球范围内的运行方式。世界上任何地方的任何人都可以成为区块链的活跃参与者和受益者。即使作为一名独立的企业主，你也可以决定开始接受
  `bitcoin` 作为你产品或服务的支付方式。有趣的是，在使用 `bitcoin` 接受支付之前，你不需要获得任何政府或公司机构的许可。同样，你可以在数字钱包中购买、出售、拥有和存储
  `bitcoin`，而无需任何金融机构的授权或验证。


  ### 高级安全性

  让 `bitcoin` 对所有人都安全可靠的因素之一是对用户配置和交易历史的简单验证。根据所涉及的加密钱包或交易所，你可以轻松与全球任何地方的任何人进行交易。换句话说，考虑到区块链技术的工作原理，大多数交易都是安全可靠的。


  ### 匿名性与隐私

  大多数 `Bitcoin` 用户通过字母数字钱包地址和访问密钥来表示。这意味着每个用户都是完全匿名的。这种匿名性使得交易既私密又安全。基于人们不使用真实身份信息的这一事实，政府或公司机构都无法追踪
  `bitcoin` 交易背后的人的身份。


  ## 区块链中的工作量证明是什么？


  工作量证明（Proof of work）是一种用于在区块链中验证和存储 `bitcoin` 交易的共识机制。该机制是支撑 `bitcoin` 作为数字货币可靠性的核心部分。因此，交易验证过程中不涉及任何第三方。从技术上说，工作量证明是一种奖励
  `bitcoin` 矿工的系统，奖励他们使用计算资源来验证并将新交易添加到区块链中。通过这种机制，参与挖矿过程的人通过向区块链添加近期交易来获得预定的 `bitcoin`
  价值单位。


  另一个角度来看是：在区块链网络中发起的每笔 `bitcoin` 交易都以区块的形式存在。换句话说，你可以说这些是交易记录区块。然而，每笔交易的确认需要生成一个目标
  `hash`。


  记住，发送的是一种数字货币。但由于没有传统的第三方参与，交易验证取决于工作量证明机制。


  就像你不需要完全理解引擎如何工作就能开车一样，你不需要完全理解区块链如何工作就能使用它！


  ## 比特币是如何制造的 – 什么是比特币挖矿？


  作为一种数字货币，你可能好奇 `bitcoin` 是如何制造的。就像现金一样，有许多获得 `bitcoin` 的方法。本节将关注制造或拥有 `bitcoin`
  的三种主要方式。随着对 `bitcoin` 挖矿工作原理的不断理解，你将进入赚这种数字货币的道路。


  ## 什么是比特币挖矿


  `Bitcoin` 挖矿是一个解决计算难题的过程，这导致了不同数量新 `bitcoin` 的产生。挖矿的主要目的是验证区块链网络内两个之间发起的 `bitcoin`
  交易，并以此获得奖励。简单来说，有匿名的第三方（称为矿工）负责验证 `bitcoin` 交易的所有权、转账、金额和发生时间，并将这些信息添加到账本或区块链中。这种挖矿过程是那些希望通过“挖矿”赚取小部分
  `bitcoin` 的个人和公司之间的竞争，就像他们制造实体法币一样。


  尽管加密货币挖掘是一个有趣的经济活动领域，但参与其中需要对计算设备和专业知识进行大量投资。此外，盈利的挖矿要求成本在特定时间内低于所获得的 `bitcoin`
  价值。


  以下是一些关于 `bitcoin` 挖矿如何工作的提示。然而，重点是，拥有专业知识和设备的人也可以参与挖掘其他加密货币。


  ### 高计算能力的消耗

  除了需要专用计算机和其他设备外，挖矿还消耗大量的计算能力。此外，你还需要足够的电力力和冷却系统来保持整个操作 24 小时运行。


  ### 激励竞争

  区块链网络的工作就像彩票。在这种情况下，矿工使用复杂的计算机系统在计算猜测中竞争一个 64 位的十六进制数字。这个数字在加密世界中被称为 `hash`。任何在任何获得正确
  `hash` 的竞争矿工都能获得规定的 `bitcoin` 价值。


  ### 自愿贡献

  保持区块链网络运行所需的计算资源和动力从不是由单一机构贡献或依赖于单一机构。相反，大多数人自己为挖掘 `bitcoin` 购买硬件和软件。当这些需求可用时，你必须投入劳动力以确保你的挖矿活动是盈利的。关键点是，贡献这种计算能力和资源是自愿的。


  这是另一些人用来制造比特币的第二种选择。如果你一直在询问如何赚取比特币，这是对你最好的选择之一。有趣的是，它比比特币挖矿简单。该过程是开始为你的产品销售或服务交付接受比特币支付。就像实体现金一样，你可以用它购买其他商品和服务。


  接受比特币支付的优点包括：1.


  1.  即时现金流

  2.  较低的手续费

  3.  易实施

  4.  防欺诈

  5.  无退单

  6.  匿名性






  比特币抗通胀的特性之一是去中心化。抗通胀意味着比特币能够不受经济中中央机构的决策和行动所可能引发通胀的改变的影响。换句话说，任何经济体的中央经济机构无论有意还是无意都会引发通胀。以下强调了可能导致通胀的一些特定经济行为。


  * 薪资上涨

  * 财政政策制定

  * 贬值

  * 经济监管

  * 政治违规


  ### 比特币供应有限


  据说比特币的供应量为 2100 万枚。由于这种有限供应，在所有货币创建后，新货币几乎不可能进入流通。与这一事实相反，流通中物理货币供应增加是通胀的影响因素。导致法定货币供应增加的因素包括政府支出增加和印刷更多货币来资预算。在这方面，与实体现金不同，比特币具有抗通胀性。


  ### 它不受单一经济体


  不同国家的通胀率很少相同。当你观察通胀的主要原因时，某些或所有原因可能在特定国家的经济中同时发生。与其他金融资产类别一样，比特币不受任何国家经济变化的影响。有趣的是，它是一种国际认可的金融资产类别，许多人利用它来进行获利的多元化配置。如果你想在房地产、股票和债券之外对投资进行多个类别的多元化，比特币是有价值的加密资产之一。


  ## 什么是去中心化金融？


  去中心化金融使用开源账本系统连接有利益的各方进行金融交易，而不涉及收取费用或对多方施加规则或条例的中间机构。


  比特币或加密货币是一种替代性金融系统，指的是任何人通过区块链网络访问的金融相关产品和服务的集合。作为一个开源网络，没有任何中央机构可以声称拥有或控制去中心化金融（DeFi）在世界上任何部分的运行方式。DeFi
  是一种新兴的全球金融系统，具有重塑金融未来的证明潜力。


  现在，你可能在想，我该如何定位自己以便在不可避免的未来中生存并繁荣？在进入参与的潜在机会之前，让我们来看看 DeFi 是如何工作的。


  ## 比特币如何引入去中心化金融


  作为第一个加密货币，比特币最初是为了与分布式或去中心化的数字账本系统配合而发明的。随后，其他加密货币，特别是以坊（另一种提供实用加密货币，目前正领先着 DeFi
  的加速）根据最初的去中心化原则被发明。金融交易的执行不再依赖于中央机构，而是由区块链网络活跃用户的参与驱动的。在技术术上，这种执行基于两个原则。


  ### 共识机制


  该计算系统用于在区块链网络参与者之间达成达成共识、信任和安全。在比特币区块链中，如前所述，共识机制也被称为工作量证明（PoW）。其核心功能是维护参与加密货币交易的分布式匿名用户的完整性。


  ### 自执行智能合约


  智能合约是基于计算机算法的数字合同，包含两个利益相关方（买方和卖方）之间的交易协议。从技术上说，这些合同是简单的代码行，用于在区块链网络中执行特定交易并为加密货币提供实用性。由于交易双方从未物理出现，因此使用加密的智能合约来维护信任、交易完整性和金融资产的安全。


  去中心化金融（DeFi）做的是将金融交易的多样性扩展到最初通过比特币引入的内容之外。现在，你如何从去中心化金融的出现中受益呢？


  **借贷**：你可以安全地获得不同类型的贷款。有趣的地方在于，你不需要经过繁琐的文件工作，然后等待无尽的时间。借贷的速度快且安全。


  **贷款**：根据你的兴趣，你可能想借出你的加密资金并在指定期限内赚取规定的利息。借出多少由你决定。最近，去中心化贷款平台为普通人创造了金融机会。


  **交易**：在没有传统交易所参与的情况下，你可以开始交易你选择的去中心化金融资产。把它想象成在声誉良好且安全的交易所买卖股票。再次，这些是通过去中心化金融和区块链技术创造的一些新机会。


  **储蓄**：你可以决定将法定货币存为加密货币并获得资金利息。唯一的要求是数字钱包和一些资金。有趣的地方在于，你的储蓄不受贬值其他类型金融资产的持续通胀影响。


  这些是你可能想通过去中心化金融的出现而探索的一些机会，并非全部。最棒的部分是你可以从全球任何地方开始探索这些金融机会。而且你不需要任何集权货币机构的许可。


  ## 中心化 vs. 去中心化金融：有什么区别？


  理解去中心化金融潜在益处的最好方法是通过对比视角。基于这一视角，你可以将核心概念与你的个人经历联系起来。这是识别可能适合你性格或当前财务目标的特定机会的一种有趣方式。让我们看看核心差异。


  ### 第三方参与


  在去中心化金融生态系统中，没有第三方参与交易验证和授权。交易验证不是基于中央机构，而是基于区块链网络中分布式用户之间的计算协议（`smart contracts`）。缺乏第三方也增加了交易速度和效率。


  ### 控制机制


  去中心化金融将活动的控制权交给参与每笔交易的个人。通过数字钱包、密码和访问密钥，你对自己的加密货币拥有 100%的控制权。这与中心系统中金融机构的监管行动相反，后者可能会改变规则、引发通胀和市场变化。


  ### 交易费用


  去中心化系统中缺乏第三方降低了金融交易费用。维护区块链网络运行所需的分布式计算资源的自愿贡献降低了运营成本和交易费用。这种系统的反面是贪婪的私人和中央银行参与，并随着时间的推移要求越来越费用。


  ### 匿名性


  在传统金融系统中，身份验证是花费大量时间和钱的主要因素之一。相比之下，区块链基于无许可系统，加密交易参与者的匿名性得到了维护。


  ### 黑客攻击漏洞





  在中心化系统中，单点故障可能会影响整个网络。该系统脆弱性的根源在于维持一切运行所需的计算机资源是中心化的。但区块链是去中心化的，数据泄露和网络攻击的概率几乎为零。


  这是这两个金融生态系统之间的核心区别。像你这样的人已经在利用新金融世界中的机会。现在是开始定位的最佳时机。既然我们已经定义了 `bitcoin` 是什么、它是如何产生的以及其他基本概念，我们准备好进入下一章。


