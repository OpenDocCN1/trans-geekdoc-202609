  # 什么是区块链？


  ## 什么是区块链？深度解析


  在过去的几年里，`blockchain` 一词被一直频繁使用，特别是随着 `Bitcoin` 和 `Ethereum` 等加密货币的兴起。在 2022 年，`blockchain`
  似乎是新的互联网。就像互联网一样，`blockchain` 将一直存在。随着这种普及的提高，你可能会好奇，什么是 `blockchain`？`Blockchain`
  是一个包含数据的区块链。


  用更高级的术语来说，`blockchain` 是一个数据库，其记录安全地链接并分布在计算机网络的节点之间。它是一种不可篡改的分布式账本，用于在业务网络中以数字格式电子化记录信息和交易。它是一种记录系统，确保了数据记录的安全性和不可篡改性，并在没有第三方的情况下实现了高水平的信任。


  ## 什么是区块链技术？


  `Blockchain Technology` 是一种结构，它将公共交易记录（俗称为 `blocks`，区块）存储在多个数据库（称为 `chain`，链）中，这些数据库通过点对点节点连接到网络中。这种存储网络通常被称为数字账本。


  ## 作为公共数字账本的区块链


  如上述，存储网络通常被称为数字账本。`Blockchain` 作为一种公共数字账本用于记录活动。在去中心化的区块链中，每笔交易都由网络进行验证和授权。这使得 `digital
  ledger` 极其安全。


  简单来说，`digital ledger` 就像一个共享的表格。任何人都可以看到数据，但没有人可以损坏它。`blockchain` 的主要目标是允许信息在一个不可篡改、删除或破坏的记录系统中进行记录和共享。


  ## 区块链是如何去中心化的


  `blockchain` 基于 `decentralization`（去中心化）的概念运行。在 `blockchain` 中，`decentralization`
  是将决策权和监督权从中心化网络转移到分散网络的过程。中心化网络可以是个人、公司实体或一组人。`decentralization` 的概念旨在减少参与者对中心权威以及自身的信任程度。


  `blockchain` 中的 `Decentralization` 通过节点网络完成，这些节点在将 `block` 添加到 `chain` 之前验证其真实性。这使得
  `blockchain` 对用户来说又安全了一步。由于 `decentralization`，`blockchain` 中的每笔交易都经过高度加密和保护。


  ## 为什么去中心化化重要


  `Decentralization` 作为一个概念在 `blockchain` 出现之前就已经存在了。在开发技术网络时，通常会考虑三种主要的网络架构：`centralized`（中心化）、`distributed`（分布式）和
  `decentralized`（去中心化）。虽然大多数 `blockchain` 技术应用了 `decentralization` 的概念，但一个 `blockchain
  network` 不能简单地被分类为去中心化与否。相反，`decentralization` 应该被视为所有 `blockchain` 应用的标准。


  ***以下是去中心化的几个益处：***


  **额外的安全层：** `Decentralization` 为 `blockchain network` 增加了额外的安全层。在去中心化的 `blockchain
  network` 中，每当发生新交易时，它不会被自动添加到 `chain` 中。相反，它通过一个去中心化的计算机网络进行验证。这为网络增加了额外的安全层，因为在你篡改
  `blockchain` 之前，你必须篡改 `chain` 的 `blocks` 并黑入分散网络中的每一个 `node`。


  **向网络中的每个成员分配权限：** 在去中心化网络中，没有单一的机构或团体可以控制网络的活动或决策过程。`Decentralization` 将权限分配给网络中的每个成员，创建了一个无需相互认识或信任的系统。每个成员都拥有以
  `distributed ledger` 形式存储的相同数据副本，并拥有接受或拒绝任何成员 `ledger` 的平等权力。






  ## 减少系统中的弱性

  去中心化可以极大地减少系统中由于权力过度赋予某个人或过度依赖某群体而产生的弱性，因为它消除了权力滥用、腐败和缺乏激励机制带来的风险。资源优化的分布确保了资源在系统中各个节点之间是均匀分布的，从而提供极佳的服务。


  ## 区块链网络类型

  区块链网络可以通过 4 种不同的方式构建：公共链、私有链、许可链（混合链）或联盟链。


  ### 公共链网络

  公链网络是一个完全去中心化的网络，对所有人开放。公链允许网络的所有成员访问区块链、创建区块并验证区块。你只需要连接互联网即可加入网络并开始交易。该网络通常为验证区块的用户提供激励。比特币和以太坊是公链的两个例子。公链是许可许可，这意味着你不需要任何许可即可加入或交互。


  ### 私有链网络

  私有链是工作在限制环境中的区块链网络，由单一实体控制。它们也被称为托管区块链、许可区块链或企业区块链，例如 Ledger 和 Ripple。出于隐私考虑，私有链通常需要较高级别的隐私保护。


  ### 许可链网络

  也称为混合区块链，这种区块链结合了私有链和公链的元素。它是由希望获得更大灵活性的企业建立并控制的。在混合网络中，某些数据可以是私有的，而另一些数据可以同时公开公开。


  ### 联盟链网络

  联盟链是混合区块链的一种类型，但由一组人或多个组织管理。它是半封闭的生态系统，被称为联邦区块链，比私有链具有更高的去中心化程度，在生态系统中提供了更高水平的安全效率。


  ## 什么是加密钱包？

  加密钱包是一个软件包，允许加密货币用户存储、传输、消费和接收数字资产。类似于物理钱包，加密钱包允许你存储加密货币账户，并提供访问加密货币的界面。使用加密钱包你需要一对密钥：私钥和公钥。私钥是加密钱包最重要的部分，拥有该密钥的人可以控制钱包及其所有资产。


  公钥由私钥生成，并作为发送加密货币的地址。加密钱包可以有多个公钥，但只有一个私钥。持有私钥的加密货币用户使用非第三方托管（自托管）加密钱包进行交易，钱包就像一个由你拥有并控制的银行账户。通过私钥，你可以发起交易以及发送和接收加密货币。


  ## 加密钱包类型

  加密钱包主要有两种类型：软件钱包和硬件钱包。软件钱包也称为热钱包，是计算机应用程序或浏览器扩展，用于发送、接收和存储加密货币。软件钱包中的资金存储在线。另一方面，硬件钱包是物理设备，可以插入计算机实现软件钱包相同的作用。它们有时被称为冷钱包，因为数字资产存储在本地。硬件钱包比软件钱包贵且使用复杂。软件钱包优先考虑便利性，而硬件钱包的设计是为了最大安全性。冷钱包与热钱包不同，连接互联网，不易受到攻击。


  ### 2022 年最流行的加密钱包回顾

  随着加密货币和数字资产的日益流行，现在有很多加密钱包可以选择。我们将简要回顾 2022 年 3 个最流行的加密钱包：


  #### Coinbase Wallet

  Coinbase 钱包是美国最流行的加密钱包之一，也是全球最大的钱包之一，交易超过 100 种加密资产。通过 Coinbase 钱包，你可以在同一个地方存储数字收藏品（NFT）和加密货币。


  **➕ 优点：**

  * 对于几乎或没有加密交易经验的初学者来说是一个极佳的选择

  * 它提供了丰富的加密货币选择；有 100 多种加密货币可供交易

  * 用户友好的设计，界面易于导航

  * 为加密账户注值的门槛低

  * 通过多签名和双重身份验证实现高安全性


  **➖ 缺点：**

  * 交易成本高

  * 交易类型有限


  #### Ledger Nano X

  Ledger Nano X 是一种冷钱包，旨在让你的数字资产尽可能安全。Nano X 被设计为 Ledger Nano S 的升级版，是一款高端硬件加密钱包，它提供了其廉价兄弟产品的所有功能，并增加了功能，例如能够存储更多数量的加密资产以及蓝牙连接，这使得可以在手机上访问钱包。


  **➕ 优点：**

  * 它支持多种加密货币和代币；超过 500 种

  * 拥有较好的电池续时间（8 小时）

  * 蓝牙连接允许你从手机控制钱包

  * 安全性高


  **➖ 缺点：**

  * 价格昂贵

  * 不支持触摸屏

  * 技术性用户界面


  #### Crypto.com Defi Wallet

  Crypto.com Defi Wallet 是 crypto.com 生态系统中一种安全的自托管钱包。作为自托管钱包，用户对自己的私钥拥有完全控制权，这与第三方访问的中央托管钱包不同。由于钱包的去中心化，所有交易都在链上处理，并需要交易费用作为在相应的代币/货币区块链上确认交易的激励。


  **➕ 优点：**

  * 对你的加密钱包和数字资产拥有完全控制权

  * 使用该钱包无需创建账户

  * 支持多种加密资产；超过 300 种，包括比特币、以太坊、BNB 和 Defi 代币

  * 用户友好的界面


  **➖ 缺点：**

  * 如果丢失了私钥和恢复助词，你将永远失去钱包。






  ## 以下是区块链知识如此重要的 5 个核心原因：


  ### 广阔的职业前景

  区块链将一直存在下去，并且已经改变了业务的运营方式。从银行、金融机构到农业和食品供应链，再到政府和医疗机构，区块链正在这些领域得到实施。在未来，会有更多部门和组织采用这项技术。这意味着，在不久的将来，对区块链技术知识的需求将比目前所看到的还要大。随着越来越多的组织在不同领域采用区块链技术，区块链知识正成为一种日益可迁移的技能。这意味着，如果你了解区块链，你可以在几乎每个行业工作。一旦你成为认证的区块链专业人士，你可以担任以下职位：


  *   区块链开发人员

  *   加密货币开发人员

  *   加密货币分析师

  *   加密货币交易员

  *   加密货币研究分析师

  *   比特币全栈开发者

  *   网络安全


  获得满足区块链人才需求指数增长的技能是一个极佳的主意，因为这确保了你拥有广阔的职业前景。


  ### 良好的收入潜力

  作为一名认证的区块链专业人士，由于对该技能的巨大需求，你的收入潜力非常惊。根据技术人才职业市场 Hired 的数据，区块链开发人员的年薪在 150,000 美元到
  170,000 美元之间。高收入不仅限于区块链开发人员；区块链分析师在美国的平均年薪约为 115,000 美元。作为美国的加密货币交易员，你的年收入可达 180,000
  美元。由于这项技术的指数级增长，不同领域的许多其他区块链职位也具有非常好的收入潜力。


  ### 出色的投资选择

  区块链知识允许你做出出色的投资并进行明智交易。投资区块链指数基金和区块链代币是从区块链技术中受益极好的方式。这些投资负担得起、简单且安全，并回报丰厚。


  ### 金融交易的变革

  区块链彻底了我们我们金融交易的方式。通过区块链，数字平台上的金融交易日益增加。它还让跨境支付变得无缝且安全，使企业无论位于何地都能轻松收到客户的付款。


  ### 在治理中的应用

  区块链知识必要的另一个原因是它在治理和政府系统中大规模的应用。自发布以来，全球各国已使用区块链来确保数据库的安全、功能和流程的透明度、降低选举成本和选民欺诈、增加选举参与度以及简化税收。美国、阿拉伯酋联合国、澳大利亚、英国、韩国、以色列、俄罗斯、德国等许多国家正在投资区块链技术，以保护其数据库，确保税务合规，并增强问责制和透明度。


  ## 不同行业的区块链采用


  随着许多以前犹豫不决的者开始承认其长期能力，区块链正处于进入一个更广泛、更具实证性的的新时代。跨行业的越来越多的公司正在扩大和多元化它们的区块链计划。然而，概括采用情况并没有实际意义，因为似乎没有两个行业对分布式账本技术在提升公司各自战略偏好方面的看法是相同的。尽管每个行业的区块链使命是不同的，但各地的管理者都渴望理解并更充分地审查该技术的多种潜力。


  ### 金融服务

  在比特币向世界推出区块链多年后，这项技术继续以完全不同于最初加密货币驱动的应用重塑金融服务业。区块链的本质非常适合金融服务，后者的生命线是多方交易。在过去的几年里，公司研究了区块链用例，以简化并提升数字支付、数据验证、“了解你的客户"/反洗钱、代币化资产、资产转移、贸易融资等的性能。


  ### 技术、媒体和电信

  任何个人技术、媒体和电信部门利用区块链的方式往往是视情况而定的。例如，电信领域可能采用区块链来减少漫游，而媒体公司则利用它来执行内容作者的数字权利和支付。该部门在联盟参与度（当前或计划中的）、对区块链可扩展性的观点以及对引人入胜用例的了解方面似乎领先于其他行业，因为他们正在寻求区块链在推动重要性、信心和透明度方面的潜力。


  ### 生命科学与医疗保健

  可能没有哪个领域比生命科学和医疗保健领域能产生更快速、更显著的影响，在该领域，数据的清晰度、传输速度、不可篡改性、可追溯性和信誉是基础。行业参与者已经指出区块链在临床协作、理赔提交和裁决、向向患者数据、患者报告结局等方面具有巨大影响。受访者将信息访问和分发视为他们最喜欢的区块链用例，但他们将互操作性和实施视为首要的采用障碍。


  ### 能源与资源 (E&R)

  广泛的能源和资源领域正在进行概念验证：计量、计费和安全；去中心化能源交易；批发能源交易；终端用户进入批发能源市场；电网管理；基于物联网的资产管理以及电动移动。这些项目目前倾向于价值链的下游；上游流程往往更具资本密集性，对区块链与遗留系统的集成存在担忧，这可能使其推销变得困难。


  ### 制造业

  区块链能力可能有助于缓解常见的供应链痛点。例如，该技术的审计性可能会减少关于追溯性的问题。鉴于所有交易的不可篡改性，它可以减少合规性问题。去中介化可以鼓励和促进受信任的点对点交易。可以说，区块链在推进供应链演进方面可以发挥重要的影响作用。


  ## 区块链技术与房地产代币化


  随着对区块链技术的接受日益增加，房地产行业在采用区块链方面也没有落后。随着这项技术的优势被广泛理解，在房地产领域使用区块链技术正变得日益流行。区块链正在改变房地产交易，因为它提供了一种安全的、去中心化的方式来记录和转移资产所有权。在区块链中，`tokenization`
  是将资产价值转换为可在区块链应用程序使用的数字代币。通过这一过程，你可以将不可分割的资产转换为数字代币。





  在房地产领域，代币化（tokenization）提供了一种更无缝的物业买卖方式。例如，如果你想出售一处价值 1000 万美元的房产，找到付得起如此金额的人可能具有挑战性。通过区块链技术，这变得更容易实现。如果你对房产进行代币化，你就可以找到多个共享该房产所有权的人。房产可以转换为
  100 万个每个价值 10 美元的代币。这样，每个代币都代表房产的百分比份额。这的一个显著优势是它允许你在买卖过程中去除中间环节。





  传统的基于纸质的流程既耗时、容易产生人为错误，而且通常需要第三方调解。通过区块链简化这些策略，交易可以比通常更早、更高效地进行。文档和交易组件可以保存在区块链上，从而消除了交换纸质的需求。无需对多个账本进行同步，因此结算和支付可以变得快得多。


  ## 自动化


  智能交易可以实现交易自动化，从而进一步提高效率并加速处理流程。一旦满足预设要求，交易或流程的下一阶段会自动激活。智能合约减少了人工干预，以及对第三方验证合同条款履约的依赖。


  '
