    **Abstract—**With the increasing popularity of the Internet, mobile Internet and
    the Internet, the current network security continues to become more complicated.
    Due to the increasing variety and severity of cybersecurity threats, traditional
    means of network security protection have used in a large scale to effectively
    predict the network development trend in the time based on historical data history,
    so this paper proposes a multi-scale swarm algorithm to optimize the Elman neural
    network to achieve posture prediction for network security. Taking advantage of
    the value of network security posture, the proposed scheme is introduced with
    an improved swarm algorithm to solve the problem that network training is prone
    to fall into a local optimum and achieve a more accurate prediction. Comparison
    of the proposed scheme with existing methods shows that the scheme has a good
    prediction accuracy.


    **Keywords-prediction:** Elman neural network; particle swarm algorithm


    # I. INTRODUCTION


    Network security situation prediction refers to the changes in the network security
    situation within a certain period of time in the future by integrating the current
    network environment status data and historical network environment data to achieve
    the purpose of preventing attacks. Currently, domestically and international researchers
    use various predictive algorithms to predict the network security posture, including
    Hidden Markov Model (HMM), support vector machines, and neural networks [1]


    Wei et al. [2] proposed a multi-scale entropy-based hidden Markov model for network
    security prediction, using multi-scale entropy information to provide the data
    training problem and optimizing the training parameter of the HMM transfer matrix,
    which makes the posture prediction more accurate. You et al [3] used a genetic
    algorithm to optimize the initial parameters of the Hidden Markov model to improve
    the accuracy of cybersecurity posture


    John et al. [4] and Chen et al. [5] proposed network security posture prediction
    models based on improved SVM algorithms, respectively, enriching the research
    on network security posture prediction using machine learning-algorithms.


    Neural networks are used in cybersecurity posture prediction. Commonly used neural
    network-based prediction methods include Radial Basis Function (RBF) and Elman
    neural networks.


    Jia et al. [6] applied RBF neural networks to the study of network security posture
    prediction. FAN et al. [7] introduced Simulated Anneal (SA) algorithm and a dynamic
    probability mechanism to optimize the RBF neural network model to avoid the model
    falling into a local optimum by using local search to obtain the global prediction
    results.


    The Elman network, one of the most commonly used recurrent neural networks, is
    used for solving the prediction problem. Yan et al. [8] implemented the network
    security posture prediction method based on Elman neural network by taking advantage
    of its dynamic memory characteristics and greater sensitivity to historical data.
    The Elman neural network-based network potential prediction model based on genetic
    optimization algorithm to initialize the parameters of the model and improve the
    accuracy of the prediction.


    The cybersecurity posture tends to exhibit randomness over time, but it also exhibits
    a range of periodicity [10], which limits Elman neural network structures. At
    the same time, traditional Elman neural networks are slow to converge and can
    easily fall into local optima. Therefore, in this paper, an improved structure
    of the traditional Elman SAPSO-Elman based network security posture prediction
    model is constructed.'
