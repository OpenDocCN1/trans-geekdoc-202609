    prediction values from the predictive training model


    The predictive model algorithm is based on an Elman network implementation optimized
    by the SAPO algorithm. The Sample Elman algorithm is derived from the principle
    of solid-state analysis in the theory of thermodynamics, which was introduced
    by Metrovitis [15] and others in 1953, and it is a stochastic optimization algorithm
    that can effectively solve local small values. The improved particle swarm algorithm
    in the previous section effectively enhances the global search capability of the
    swarm algorithm. Local search capacity is also improved. However, the ability
    of the algorithm to jump out of local solution is still lacking. Therefore, this
    paper introduces a new algorithm based on the improved swarm algorithm, and then
    uses the SAPO algorithm to learn and test the weights and self-feedback gain factors
    of the Elman neural network.


