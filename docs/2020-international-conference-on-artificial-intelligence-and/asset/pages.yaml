    SAPSO-ELMAN NEURAL NETWORK


    Improved Elman neural networks


    Neural structure is the most fundamental component of a neural network, the neural
    model is based on the P-M neuron model proposed by McCulloch [11].


    The Elman neural network structure consists of an input layer, a hidden layer,
    a context layer, and an output layer. The activation function receives the difference
    of the sum of the input and threshold comparison and processes the output of the
    resulting neuron. However, prediction speed limits time efficiency [12]; and the
    sigmoid function has the disadvantage of slow convergence practice. Therefore,
    this specific function improves the activation function.


    f(x, a, b, c) = \frac{1}{1+e^{ax+b}}$ is the constant, where a is the gain factor,
    b is the constant factor, and c is the offset parameter. The derivative function
    is


    ```

    f''(x) = \frac{-ae^{ax+b}}{(1+e^{ax+b})^2}

    ```


    By learning the values of the parameters, the factor can be made to converge.
    When the value of the f function is


    ```

    \frac{2b+a}{4}, the convergence of the network will reach maximum. Therefore,
    by selecting the optimal parameter training can make the convergence speed of
    the activation function reach an optimal value.

    ```


    This paper introduces the traditional Elman neural network structure based on
    the periodic characteristics of the network security posture over time and proposes
    an improved Elman neural network structure. The specific structure is in


    ![](img/343395632f8429b8260b3d101b629bf5_1_0.png)


    Figure 1. Elman neural network structure


    The improved Elman neural network uses the double hidden layer structure. With
    the traditional structure, Hidden Layer 2 adds a context layer between the output
    layer and hidden layer 1, in which the output sequence produced of the output
    results of the output layer neurons in the previous period of time is stored,
    after which a certain algorithm is used to combine the randomly


    selected output results of some moments with the output results of the input layers,
    and the combined results are used as the input information of hidden layer 1.
    Neurons in the input layer are only for receiving input from external data and
    information directly to the hidden layer. Hidden layer uses the activation function
    to process the data from the input layer and outputs. Processing of the Elman
    neural network is shown in the following diagram:


    ```

    hidden layer:

    x_i(k) = f(w_i x(k) + w_c x(k)) (2.1)

    ```


    ```

    hidden layer:

    x_i(k) = f(w_i x(k) + w_c x(k)) (2.2)

    ```


    ```

    sequence context layer:

    x_i(k) = f(w_i y(k-1) + w_c x(k-1) + ... + y(k-1)) (2.3)

    ```


    ```

    context layer:

    x_i(k) = f(w_i \beta_i(k) + w_c x(k-1)) (2.4)

    ```


    ```

    output layer:

    y(k) = h(w_ x(k)) (2.5)

    ```


    k is the time index of iteration, x_i is the output vector, f(*) is the activation
    function of hidden layer neurons, w_i is the weight of the input vector, w_max
    and w_min in the formula represent the maximum and minimum of the t temporal weights,
    where the parameter c is the base factor and d is the constant factor, in order
    to award the weights towards zero, u


    is the input vector of the input layer. g = \sum w_j y_j,


    that calculates the output, and u (0 <= a < 1) is the self-feedback feedback gain
    of the sequence context layer. This formula calculates the cumulative sum of the
    1 to the previous t output vectors of the current time k s stored in the sequence
    context layer and corresponding weights times. \beta is the self-feedback gain
    of the hidden layer 2, y is the output of the output layer, and h(*) is a linear
    fusion function.


    Improved particle swarm algorithms


    The Particle Swarm Optimization (PSO) is an evolutionary algorithm computed by
    Kennedy [13] in 1995 by observing the predatory behavior of a flock of birds,
    which aims to achieve an optimal solution by searching about each individual in
    the set. Suppose that there exists a population of particles, each has an adaptation
    value, an adaptation value and F is calculated by the adaptation function. The
    updating of the adaptation values facilitates the interaction of information between
    particles and their continuous motion, constantly updating the speed and


