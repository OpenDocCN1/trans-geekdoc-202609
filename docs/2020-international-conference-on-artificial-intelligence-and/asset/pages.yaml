    # IV. CONCLUSION


    This paper implements a network security posture prediction model based on the
    SAPSO-Elman network, which is able to predict the values of the time slices from
    the historical values of the input sequence of successive time. The activation
    function and network structure of the Elman network, the convergence of the network
    is accelerated, and the timeliness of network security posture prediction is improved.
    The SAPSO algorithm, which combines the simulated annealing algorithm and the
    improved particle swarm algorithm, optimizes the parameters of the Elman network


    network, and further proposes a network security prediction model based on the
    SAPSO-Elman network. Through experimental analysis and calculation, the error
    value of the prediction result of this improved algorithm is far lower than that
    of other algorithms, and it has a higher accuracy.


