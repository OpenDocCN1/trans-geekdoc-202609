    基础二次算法具有在迭代过程中期间对全局范围的认知能力不足的缺点 [14]。因此，本文改进了粒子群算法基础值更新函数中的速度调整，并在公式中加入了惯性权重以获得新的更新公式，从而更新粒子的速度和位置。


    最优解 $P_v = (v_{1}, v_{2}, \dots, v_{n})$ 的适应函数更新函数以及最优位置 $P_p = (p_{1}, p_{2},
    \dots, p_{n})$ 的更新函数如下：


    ```

    $F = \frac{\sum(y_{i}-y)^{2}}{2N}$

