    # 基于 SAPSO-Elman 神经网络的网络安全防护预测


    任讯逸（Xun-yi Ren）

    计算机学院

    南京邮电大学

    江苏南京


    罗其琪（Qi-qi Luo）

    计算机学院

    南京邮电大学

    江苏南京

    17751761905@163.com


    陈世（Chen Shi）

    计算机学院

    南京邮电大学

    江苏南京


    黄家明（Jia-ming Huang）

    计算机学院

    南京邮电大学

    江苏南京


    **摘要—** 随着互联网、移动互联网和物联网的日益普及，当前的网络安全形势变得越来越复杂。由于网络安全威胁的多样性和严重性不断增加，传统的网络安全防护手段已在大规模范围内基于历史数据有效预测网络的发展趋势，因此，本文提出了一种多尺度群算法来优化
    Elman 神经网络，以实现网络安全的态势预测。利用网络安全态势的价值，所提方案引入了改进群算法解决了网络训练容易陷入局部最优的问题，实现了更准确的预测。将所提方案与现有方法对比表明，该方案具有良好的预测精度。


    **关键词-预测：** Elman 神经网络；粒子群算法


    ## I. 引言


    网络安全形势预测是指通过整合当前网络环境状态数据和历史网络环境数据，预测未来某段时间内网络安全形势的变化以达到预防攻击的目的。目前国内外研究人员使用各种预测算法来预测网络安全态势，包括隐马尔可夫模型（HMM）、支持向量机和神经网络
    [1]。


    Wei 等人 [2] 提出了一种基于多尺度熵的隐马尔可夫模型用于网络安全预测，利用多尺度熵信息提供数据训练问题并优化 HMM 转移矩阵的训练参数，使得态势预测更加准确。You
    等人 [3] 使用遗传算法优化了隐马尔可夫模型的初始参数，提高了网络安全态势的准确性。


    John 等人 [4] 和 Chen 等人 [5] 分别提出了基于改进 SVM 算法的网络安全态势预测模型，丰富了利用机器学习算法进行网络安全态势预测的研究。


    神经网络被用于网络安全态势预测。常用的基于神经网络的预测方法包括径向基函数（RBF）和 Elman 神经网络。


    Jia 等人 [6] 将 RBF 神经网络应用于网络安全态势预测的研究。FAN 等人 [7] 引入了模拟退火（SA）算法和动态概率机制来优化 RBF 神经网络模型，通过局部搜索获取全局预测结果，避免模型陷入局部最优。


    Elman 神经网络是最常用的循环神经网络之一，用于解决预测问题。Yan 等人 [8] 利用 Elman 神经网络的动态记忆特性和对历史数据的较高敏感性，实现了基于
    Elman 神经网络的网络安全态势预测方法。基于遗传优化算法的 Elman 神经网络网络潜力预测模型通过初始化模型参数提高了预测的准确性。


    网络安全态势随时间呈现出随机性，但也表现出一定范围的周期性 [10]，这限制了 Elman 神经网络的结构。同时，传统的 Elman 神经网络收敛速度慢且容易陷入局部最优。因此，本文构建了一种改进的传统
    Elman SAPSO-Elman 网络安全态势预测模型。


    ## II. 基于 SAPSO-ELMAN 神经网络的网络 SAPSO 态势预测


    ### 改进 Elman 神经网络


    神经结构是神经网络最基础的组件，神经模型基于 McCulloch [11] 提出的 P-M 神经元模型。


    Elman 神经网络结构由输入层、隐藏层、上下文层和输出层组成。激活函数接收输入和与阈值比较的差值并处理所得神经元的输出。然而，预测速度限制了时间效率 [12]；且
    sigmoid 函数在实践中存在收敛缓慢的缺点。因此，该特定函数改进了激活函数。


    $f(x, a, b, c) = \frac{1}{1+e^{ax+b}}$ 是常数，其中 a 是增益因子，b 是常数因子，c 是偏移参数。其导函数为：


    $f''(x) = \frac{-ae^{ax+b}}{(1+e^{ax+b})^2}$


    通过学习参数值，可以使因子收敛。当 f 函数的值为 $\frac{2b+a}{4}$ 时，网络的收敛性达到最大。因此，通过选择最优参数训练可以使激活函数的收敛速度达到最优值。


    本文根据网络安全态势随时间变化的周期性特征，引入了传统的 Elman 神经网络结构，并提出了一种改进的 Elman 神经网络结构。具体结构如下：


    ![](img/343395632f8429b8260b3d101b8429)


    图1 Elman 神经网络结构


    改进的 Elman 神经网络使用了双隐藏层结构。在传统结构中，隐藏层2在输出层和隐藏层1之间增加了一个上下文层，用于存储前时期的输出层结果，随后使用某种算法将随机选择的输出结果与输入层结果结合，输入层神经元仅用于接收来自外部到隐藏层的输入。隐藏层使用激活函数处理数据。Elman
    神经网络的处理如下：


    $x_i(k) = f(\dots)$ (2.1)


    $x_i(k) = f(\dots)$ (2.2)


    $x_i(k) = f(w_i y(k-1) + w_c x(k-1) + \dots + y(k-1))$ (2.3)


    $x_i(k) = f(\dots)$ (2.4)


    $y(k) = h(\dots)$ (2.5)


    k 是迭代索引，x_i 是输出向量，f(*) 是隐藏层神经元的激活函数，w_i 是输入向量的权重，$w_{max}$ 和 $w_{min}$ 在公式中代表时间权重的最大值和最小值，其中参数
    c 是基础因子，d 是常数因子，为了使权重趋于零，u $g = \sum w_j y_j$ 计算输出，且 u ($0 \le a < 1$) 是序列上下文层的自反馈增益。


    ### 改进粒子群算法


    粒子群优化（PSO）是 Kennedy [13] 在 1995 年通过观察鸟群的捕食行为提出的进化算法，旨在通过搜索集合中的每个个体寻找最优解。假设存在一个粒子种群，每个粒子都有一个适应值，适应值
    F 是通过适应度函数计算的。适应值的更新促进了粒子间的信息交互和连续运动，不断更新速度和


