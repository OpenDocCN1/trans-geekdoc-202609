    The basic quadratic algorithm suffers from the disadvantage of having insufficient
    cognitive power over the global scope during iterations [14]. Therefore, this
    paper improves the velocity adjustment in the basic value update function of the
    particle swarm algorithm and adds the inertia weight to the formula to obtain
    the new update formula so that it can update the velocity and position of the
    particles.


    The adaptation function of the optimal solution $P_v = (v_{1}, v_{2}, \dots, v_{n})$
    update function, and the optimal position $P_p = (p_{1}, p_{2}, \dots, p_{n})$
    update function are as


    ```

    $F = \frac{\sum(y_{i}-y)^{2}}{2N}$

    ```


    ```

    $P_{k} = \begin{cases} p_{k}, &if F(x_{k}) > F[p_{k}] \ x_{k} + r_{1}v_{k} &if
    F(x_{k}) \leq F[p_{k}] \end{cases}$

    ```


    ```

    $v_{k} = \min\v_{max}, p_{k}, \dots, p_{n}\}$

    ```


    In the formula, $y_{i}$ and $y''_{i}$ are the actual and desired output of the
    i-th particle, respectively, $k$ is the level of evolution. For each generation,
    the velocity and position updates for the particles are shown in 2.9 and 2.10.


    ```

    $v_{k} = wv_{k} + r_{1}r_{2}(p_{k}-x_{k})$

    ```


    ```

    $x_{k} - (x_{k}-1) + r_{1}v_{k} + r_{1}r_{2}(p_{k}-x_{k})$

    ```


    ```

    $x_{k} = x_{k} + v_{k}$

    ```


    $r_{1}$ and $r_{2}$ are random numbers between 0 and 1, $c_{2}$ denote the velocity
    constants, and $c_{3}$, $k_{max}$ denote the maximum and minimum values of iterations
    set.


    ```

    $c_{1} = c_{1min} + \frac{k}{k_{max}}(c_{1max}-c_{1min})$

    ```


    ```

    $c_{2} = c_{2min} + \frac{k}{k_{max}}(c_{2max}-c_{2min})$

    ```


    and $c_{3}, k_{max}$ is the maximum and minimum values of iterations set.


    The formula for the inertia weight is shown as 2.13.


    ```

    $W = w_{max} - \frac{k}{k_{max}}(w_{max}-w_{min})$

    ```


    $w_{min}$ and $w_{max}$ denote the minimum and maximum values of the inertia.


    According to the improved weighting iteration, the weight tends to be at the beginning
    of the iteration, which makes updates faster and improves the global search capability.
    As the number of iterations increases, the inertia weight decreases linearly,
