  \n图 33.11 HIBP 上已泄露的个人账户。\n\n你也可以检查你的整个组织。这在图 33.12 中所示。\n\n![图 33.12 组织检查](img/fig33.12.jpg)\n\
  \n图 33.12 组织检查。\n\nPwnedlist 也很出色；然而，它甚至更进一步。它甚至可以获取你被攻破的密码哈希值。这在图 33.13 中所示。\n\n\
  ![图 33.13 被攻破的密码哈希](img/fig33.13.jpg)\n\n图 33.13 被攻破的密码哈希。\n\n### 云端漏洞与基础设施风险\n\n\
  在过去的几年中处理安全事件时，我们看到受攻破的云端系统数量大幅增加。这主要是由于人们倾向于将云计算机视为一种“眼不见，脑不烦”的技术而产生的问题。例如，在建立云系统时，这些系统是由第三方构建的。基础设施由第三方维护。人们很容易假设第三方也会负责这些系统的日常维护。一个很好的例子是几年前的\
  \ elasticsearch 漏洞。当时有大量系统处于漏洞之中，任何未经身份验证的用户都可以访问系统上的各种敏感文件和数据，甚至包括 `SSH` 密钥。有大量系统因为很长时间没有更新而被攻破。这个问题还被进一步恶化了，因为\
  \ Amazon 经常设置带有基于密钥的 `SSH` 访问的系统，这从安全角度来看是非常棒的。但当你意识到大量系统具有完全相同的漏洞和完全相同的配置时，这就不再那么妙了。这为攻击者提供了机会，他们可以轻松地创建自动化代码来利用此漏洞，并轻易攻击大量系统。\n\
  \n此外，随着云计算的出现，攻击者识别连接到更广泛互联网的系统中可能的漏洞变得越来越容易。例如，有一种误认为，攻击者需要首先使用 `Nmap` 或 `Nessus`\
  \ 等工具扫描你的外部云系统，然后才能准确识别出可供其攻击的服务和端口。然而，事实并非如此。安全研究人员和攻击者可以使用许多服务，主动地扫描互联网以寻找各种服务、端口甚至漏洞。\n\
  \n### 端口扫描服务\n\n让我们从端口开始。2012 年，一个名为 `Carna` 的机器人网络扫描了整个互联网，对所有可用端口进行了全面统计。有趣的地方在于，据我们所知，这个机器人网络的目标纯粹是基于研究的。攻击者在网上发布了他们所有的数据，包括可用\
  \ IP 地址和端口的完整列表。\n\n事实上，你可以通过许多网站在线访问这些数据。我们喜欢的网站之一是 [`www.exfiltrated.com/querystart.php`](http://www.exfiltrated.com/querystart.php)。你只需要输入相关范围的起始和结束范围即可。这在图\
  \ 33.14 中所示。\n\n![图 33.14 输入的起始和结束范围](img/fig33.14.jpg)\n\n图 33.14 输入的起始和结束范围。\n\
  \n然后，它将给你存活的系统和端口。这在图 33.15 中所示。\n\n![图 33.15 显示的存活系统和端口](img/fig33.15.jpg)\n\n\
  图 33.15 显示的存活系统和端口。\n\n这意味着，攻击者可以利用云服务识别你面向互联网的系统范围内的端口和服务。但是，它还可以更进一步。假设攻击者不仅想识别各种端口和系统。假设他们还想识别服务及其版本号。\n\
  \n### 横幅抓取（Banner Grabbing）与 Shodan\n\nShodan 登场。`Shodan` 是一个非常优秀的服务，安全专业人员、系统管理员和攻击者可以从你的系统中提取横幅信息（banner\
  \ information），而无需与之进行实际交互。\n\n这是可能的，因为 `Shodan` 正在积极扫描并收集整个互联网的横幅信息。例如，假设我想找到横幅中包含\
  \ Chuck Norris 的每一个系统。示例见图 33.16。\n\n![图 33.16 Shodan 示例](img/fig33.16.jpg)\n\n\
  图 33.16 Shodan 示例。\n\n是的，这确实有这种事，而且 `Shodan` 可以找到它。假设你的网络边缘运行着旧版本的 `IIS`。人们倾向于认为攻击者必须扫描你的边缘才能找到这些系统。不，`Shodan`\
  \ 已经拥有了这些，如图 33.17 所示。\n\n![图 33.17 已获取的系统](img/fig33.17.jpg)\n\n图 33.17 已获取的系统。\n\
  \n### 端口扫描服务\n\n这意味着，攻击者可以利用云服务来识别你面向互联网的系统范围内的端口和服务。但是，它还可以更进一步。假设攻击者不仅想识别各种端口和系统。假设他们还想识别服务及其版本号。\n\
  \n### 横幅抓取与 Shodan\n\nShodan 登场。`Shodan` 是一个非常优秀的服务，安全专业人员、系统管理员和攻击者可以从你的系统中提取横幅信息，而无需与之进行实际交互。\n\
  \n这是可能的，因为 `Shodan` 正在积极扫描并收集整个互联网的横幅信息。例如，假设我想找到横幅中包含 Chuck Norris 的每一个系统。示例见图\
  \ 33.16。\n\n*注：此处原文存在部分内容重复，根据指令“不要重复输出原文”，翻译已按逻辑合并或去重处理（以下为后续差异内容的翻译）*\n\n是的，这确实有这种事，而且\
  \ `Shodan` 可以找到它。假设你的网络边缘运行着旧版本的 `IIS`。人们倾向于认为攻击者必须扫描你的边缘才能找到这些系统。不，`Shodan` 已经拥有了这些，如图\
  \ 33.17 所示。\n\n![图 33.17 已获取的系统](img/fig33.17.jpg)\n\n图 33.17 已获取的系统。\n\n### 漏洞扫描服务\n\
  \n但是等等！还有更多！互联网上有很多允许攻击者在无需发送单个数据包的情况下，识别你系统的漏洞服务。其中一个令人恐惧的网站是 `PunkSpider`。它们通过\
  \ `Hyperion` 积极扫描如 `SQLI` 和 `XSS` 的漏洞，如图 33.18 所示。\n\n![图 33.18 PunkSpider 扫描](img/fig33.18.jpg)\n\
  \n图 33.18 PunkSpider 扫描。\n\n### 用户情报收集\n\n我们将从 `userID` 开始。在这个例子中，目标使用了 `strandjs`。如果我们通过高度针对性的钓鱼攻击攻击该用户，我们需要知道他们的兴趣。我们喜欢的此类信息网站之一是\
  \ `Namechk`。你只需要一个 `userID`，它就会自动识别该账户所属的社交网络。图 33.19 中所示。\n\n![图 33.19 显示的社交网络](img/fig33.19.jpg)\n\
  \n图 33.19 显示的社交网络。\n\n现在，假设我们想看看该用户去过哪里。我们可以使用 `tweetpaths` 等在线服务。图 33.20 中所示。\n\
  \n![图 33.20 tweetpaths 显示的轨迹](img/fig33.20.jpg)\n\n图 33.20 tweetpaths 显示的轨迹。\n\n\
  这项服务为我们提供了特定用户所在及去过地方的卓越路线图——我们甚至可以进一步通过 `echosec.net` 获取特定位置的数据。这将为我们提供包含该区域所有推文和\
  \ Flickr 照片的精地图，如图 33.21 所示。\n\n![图 33.21 通过 echosec.net 获取的路径](img/fig33.21.jpg)\n\
  \n图 33.21 通过 echosec.net 获取的路径。\n\n而且，它甚至可以为发现的媒体提供极佳的概述。示例见图 33.22。\n\n![图 33.22\
  \ 发现的媒体概述](img/fig33.22.jpg)\n\n图 33.22 发现的媒体概述。\n\n我们正致力于通过云计算提供一组更集成、更易用的服务。在我们进行此的过程中，攻击者可以使用许多服务和\
  \ API，以一种你的组织无法检测的方式来识别系统、用户和服务。\n\n\n\n\n\n## 33.3 云端穿越 (Cloudpassage)\n\n然而，针对服务器疯狂问题存在可能的解决方案。解决这些问题的一种方法是确保你对云基础设施拥有足够的可见性。这要求你像对待本地服务器一样尝试对待这些服务器。这需要稳健的补丁管理解决方案，结合可靠的日志记录和告警。此外，还需要利用云提供商如今提供的各种防火墙和安全功能。\n\
  \n## 33.4 总结\n\n长期以来，我们建立了各种保护措施，以正确地分段并将自己从更广泛的互联网隔离开。我们创建了 DMZ（脱敏区）和防火墙来帮助实施这种隔离。尽管我们尽了努力，但在安全方面仍然一直在失败。互联网过去、现在都是一个非常危险的地方。我们从未解决分段和隔离问题。现在，我们正将最敏感的资产直接放入互联网中，这就是为什么云安全是一个令人恐惧的话题……我们未能从过去中汲取任何教训，而且在许多方面，似乎在急切地重犯许多相同的错误，并不断发现新的错误。\n\
  \n但是，如果我们退后考虑一下：如果我们回顾起点，我们会问，我们真的曾经与互联网隔离过吗？互联网和云是紧密交织的实体。多年前，在云的概念完全兴起之前，我们仍然面临许多相同的问题。我们仍然用户访问互联网。我们仍然与客户和业务伙伴共享数据。我们仍然保持着紧密的连接。分段和隔离可能是过时的想法，因为它们从未真正可行。一种极大的可能是，云计算并不是一种新范式，而是在面对一个我们一直以来充其量在否认的、最坏的情况下在忽视的现实。\n\
  \n本章中不应该有什么对你来说是颠覆性的内容。我们涵盖了一些新技术和一些攻击者可以利用的新技巧。然而，计算机安全的核心原则和宗旨仍然在起。我们需要了解攻击者的能力。这就是为什么像\
  \ `DropSmack` 和 `Gcat` 这样的工具如此关键。我们需要可见性，并确保我们的系统定期进行补丁更新、更新和测试。\n\n信息安全是对基础和原理的启发性应用。将它们想象成乐高积木。你有一些用于补丁管理。你另有一些用于用户监控。你还有一些用于系统监控和减少攻击面。一旦你收集了这些核心功能区块，你就可以开始构建安全架构，无论是在本地还是在云端。\n\
  \n良好的安全就是良好的安全。无论在何处实施。\n\n## 参考文献\n\n1. Donnelly, Benjamin. 2015. `gcat.py`. 可于\
  \ `https://bitbucket.org/Zaeyx/gcat.git`。\n2. Williams, Jacob. 2013. `DropSmack`:\
  \ 云同步服务如何让你的企业防火墙形同虚设。内华达州拉斯维加斯 Blackhat 大。\n\n# 第 34 章 云计算安全的未来方向\n\n## 风险与挑战\n\
