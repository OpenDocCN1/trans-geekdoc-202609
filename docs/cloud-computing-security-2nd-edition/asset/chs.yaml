  \ Y.3502`。\n5. 国际电信联盟。2012 年 2 月。云计算专家小组报告第 2 部分：功能需求与参考架构。`ITU-T FG Cloud TR`。\n\
  6. 国际电信联盟。2012 年 2 月。云计算专家小组报告第 3 部分：云基础设施的需求与框架架构。`ITU-T FG Cloud TR`。\n7. Kandula,\
  \ A., Sengupta, S., and Patel, P. 2009 年 11 月。“数据中心流量的本质：测量与分析。”ACM SIGCOMM 互联网测量会议，ACM。\n\
