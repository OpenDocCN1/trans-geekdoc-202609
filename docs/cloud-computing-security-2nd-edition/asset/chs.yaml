  \ 安全影响\n### 5.2.5 管理\n### 5.2.5.1 安全影响\n## 5.3 总结\n\n\n\n\n\n参考文献\n\n为了将信息安全原则应用于云架构，理解该架构至关重要。在本章中，我们将回顾云基础设施的主要组件组成部分，以及一些可以帮助我们思考该架构安全性的概念。无论云环境是私有的、公有的还是混合的；是执行业务关键任务还是支持外围活动；是存储了公司的核心数据还是完全不存储数据，理解安全实践和控制措施在云环境中是如何运作的，将使我们能够应用正确的安全措施，以满足我们在任何情况下的风险容忍度。让我们开始吧！\n\
  \n## 5.1 场景考量\n\n当我们从云基础设施使用者的角度考虑安全性时，考虑大局——即云基础设施的整体运行如何可能影响我们作为该云的单一用户——将非常有价值的\
  \ [1]。\n\n一个重要的概念是“最大公约数”。在运行支持多个用户的云环境时，云运营商必须满足该环境中所有用户的安全需求。这些不同的用户通常会有不同的安全需求。“最大公约数”的概念规定，云环境必须是所有用户所提需求的并集，同时要理解没有任何用户是需要所有这些需求的。\n\
  \n在这种情况下，减少治理开销的一种方法是根据各种安全需求，将不同的租户组或应用程序隔离到不同的社区中。这种方法的关键是找到具有相似安全需求的用户并将他们归类。另一个需要记住的重要全局性概念是“共享影响”的概念，例如与共享基础设施遭受攻击或发生故障相关的影响。\n\
  \n## 5.2 云基础设施的组件\n\n云基础设施的设计旨在管理各种资源，并在工作负载和应用程序之间高效地分配这些资源（参见图 5.1）。在在接下来的章节中，我们将查看云基础设施管理和分配哪些类型的资源\
  \ [2]。\n\n![图 5.1 云基础设施的组件](img/fig5.1.jpg)\n\n图 5.1 云基础设施的组件。\n\n### 5.2.1 计算组件\n\
  \n计算实例实际上封装了云基础设施中计算节点的计算能力，形式为 `CPU` 处理时间和 `RAM` 工作空间，并将其部分化后提供给多个用户共享。云基础设施通常管理许多物理节点，每个节点上运行着数量得多的实例。每个实例可能专门用于单个工作负载，或者在适宜的情况下运行多个工作负载。实现计算实例有三种底层方法：虚拟机监控程序（hypervisor）、容器和裸机（bare\
  \ metal）[3]。\n\n最常见的虚拟化类型是虚拟机监控程序。虚拟机监控程序创建虚拟机，配备虚拟 CPU、内存、网卡、外设总线、磁盘，甚至是完整的虚拟 BIOS。通过虚拟化计算节点实际硬件的虚拟机监控程序，每个计算实例都运行着完全独立且隔离的操作系统。虚拟机监控程序的作用是管理对物理资源的访问，将\
  \ `CPU`、`RAM` 和存储分配给运行在由该虚拟机监控程序管理的物理计算节点上的虚拟化机器——即计算实例。\n\n与虚拟机监控程序方法相比，容器虚拟化了操作系统。容器通过保持其用户空间相互隔离开来隔离应用程序，同时允许它们共享单个内核空间。它比硬件虚拟机监控程序更复杂，但也更轻量。\n\
  \n裸机计算组件在不进行虚拟化的情况下管理工作负载。每个工作负载运行在独立的物理硬件上。\n\n#### 5.2.1.1 安全影响\n\n在虚拟化工作负载和应用程序之间维持严格隔离的能力，是虚拟机监控程序或容器虚拟化最重要的任务。虚拟机监控程序可能无法维持这种严格隔离，例如，如果它容易受到逃逸攻击（breakout\
  \ attack）的影响，即运行在一个虚拟机中的恶意代码可以跳出虚拟化环境，并接管虚拟机监控程序本身，从而控制该虚拟机监控程序管理的所有虚拟机。影响不那么剧烈但同样大的是存在漏洞的虚拟机监控程序，它允许一个虚拟机访问位于同一台主机计算节点上的另一个虚拟机所占用的物理内存内容。这两类漏洞以及更多漏洞在过去曾被发现，尽管目前没有这些漏洞适用于任何流行的虚拟机监控程序或容器的当前版本。\n\
  \n考虑资源耗尽也是重要的。恶意用户可能会通过消耗计算节点提供的 `CPU` 和 `RAM` 资源来瘫痪云基础设施，或者至少影响该基础设施其他用户的性能。这种漏洞大多数情况下不适用于裸机计算节点，因为\
  \ `CPU` 和 `RAM` 资源在多个工作负载之间是不共享的。尽管如此，为这种可能性做好准备是非常重要的，无论是由于恶意意，还是仅仅由于工作负载或应用程序失控。\n\
  \n最后一个主要的安全考量是云基础设施的运营信任模型。特别是使用虚拟机监控程序方法时，云基础设施的管理员能够无形地查看、复制和修改运行在该云环境中的工作负载或应用程序所包含的信息及其执行的操作。因此，对参与管理云基础设施的任何第三方进行彻底调查非常重要，这在传统的托管（colocation）安排中更为如此。\n\
  \n### 5.2.2 网络\n\n云基础设施的网络组件允许计算、存储以及该基础设施其他元素之间的连接，以及与基础设施之外的更广泛环境之间的连接。至少，网络组件将计算组件的网络设施连接到云环境的边缘，并管理计算实例之间以及与更广泛环境之间的访问类型。除了这些基本功能外，还有几种管理云网络拓扑的技术：虚拟交换、物理网络设备管理以及软件定义网络。\n\
  \n#### 5.2.2.1 安全影响\n\n与计算组件一样，网络组件最关键的安全责任是隔离。网络组件必须确保计算实例不会以未经授权的方式通信。例如，网络组件必须防止恶意工作负载访问可能被共享相同物理硬件的授权工作负载所访问的未经授权的\
  \ `VLAN` 和子网。\n\n### 5.2.3 存储\n\n云基础设施的存储组件为该基础设施提供数据存储服务。至少，存储组件存储云管理信息（如虚拟机和虚拟网络定义），并为运行云环境中的应用程序和工作负载提供工作空间。还有几种技术可以提供工作负载迁移、自动备份、集成版本控制以及针对特定应用程序优化的存储机制。\n\
  \n#### 5.2.3.1 底层方法\n\n\n\n\n存储组件的基础能力涉及管理云基础设施管理功能所需的存储。除了在云环境中运行工作负载的最低需求外，由大多数现代云基础设施技术实现的存储组件还可以提供各种附加功能，用以实现高级操作能力，或仅仅是为了提高管理便利性。现代存储组件可以通过与虚拟机程序协作，定期创建快照并根据配置的备份方案进行存储，从而实现备份或版本控制。存储组件与虚拟机程序或容器协作的另一种方式是，允许在主机计算节点之间进行工作负载迁移。\n\
  \n特别是对于大规模的分布式工作负载，专门的存储可以极大简化工作负载的实现。这些专门的存储机制通常实现为对象存储。存储组件的高级功能与更准确归属于数据库组件的功能之间存在着微妙的界限。例如，我们将在第\
  \ `5.2.4` 节讨论键值存储，但这些存储可能由提供更传统存储机制的同一组件实现。云基础设施技术发展飞速，这类灰色地带随处可见。\n\n### 5.2.3.2\
  \ 安全影响\n\n与云架构的其他组件一样，也许最关键的安全相关考虑因素涉及强制计算实例、工作负载和应用程序之间的完全隔离。在存储的情况下，计算组件在执行这种隔离方面起着重要作用；然而，存储组件也必须确保计算实例只能访问授权的存储区域，例如通过配置强健的网络文件系统（`NFS`）权限和\
  \ `iSCSI` 身份验证。一个计算实例上的恶意代码不应能够通过操控存储基础设施访问另一个工作负载的数据。\n\n这些考虑也扩展到存储组件功能的其他更高级方面。例如，取决于特定用例的语义，对象存储功能可能需要管理哪些计算实例可以访问哪些对象，以及该计算实例是否应该能够创建、修改和/或读取这些对象。权限管理不当和其他基础信息卫生任务是任何环境中风险的主要来源——考虑到这些基础设施的复杂性和多租户性质，在云基础设施中尤为如此。\n\
  \n### 5.2.4 数据库\n\n数据库是现代应用中无处不在的方面。云基础设施的数据库组件提供了一个集中管理的数据库机制。通过在适当的抽象级别提供这项服务，数据库组件允许运行在云环境中的应用程序和工作负载使用该服务满足其数据库需求，使它们的实现变得更简单、更易。数据库组件实现数据库功能的方式不仅易于应用程序利用，而且随着工作负载的增加以及云应用对数据库层的需求增加，这种方式能够扩展。至少，数据库组件提供了对集中管理的数据库系统（无论是\
  \ `SQL` 还是 `NoSQL`）的共享访问。大多数健壮的数据库组件允许云用户根据工作负载的需求实例化数据库服务，同时允许云基础设施运营商控制数据库的某些方面，例如备份计划或容量和性能参数。\n\
  \n#### 5.2.4.1 底层方法\n\n不同的云基础设施技术为不同类型的数据库提供不同层次的支持。每种技术背后的驱动需求是，云导型应用通常需要根据应用程序工作负载随时间的变化来进行扩展和收缩的能力。标准的\
  \ `SQL` 数据库从底层设计上并不是为了响应实时工作负载变化而动态扩展。我们不会花费大量时间来涵盖这些。相反，我们将涵盖替代的数据库方法，例如键值存储和图数据库，这些方法通常更容易以动态扩展的方式实现，而且此后云数据库组件的大部分开发都是围绕它们展开的。\n\
  \n文档型数据库是云环境中的一种热门技术。这些技术针对管理文档进行了优化，例如 `XML` 或 `JSON` 格式的文档。这些数据库有时被称为数据结构存储，因为它们处理的数据结构与典型编程语言逻辑中的结构非常相似。它们通常通过\
  \ RESTful 应用程序接口（`APIs`）暴露其功能。\n\n键值数据库也是云环境中的一个非常流行的选项。键值数据库以键/值对的形式存储数据。键值数据库中的值可以是复杂值，例如字典或哈希。这允许键值数据库存储与文档型数据库类似的数据结构，但通过使用键作为主要的查询机制来提高性能和可扩展性。\n\
  \n图数据库将数据存储为一组通过关系连接的节点，显式存储不同数据点之间的相互连接。社交网络是自然适用于图数据库的数据集示例。图结构中的自然拆分点可以用于构建图数据库实现，这些实现针对可分发、可扩展且通用的云友好进行了优化。\n\
  \n随着技术的演进，云架构的数据库组件将使分布式数据库变得比以往任何时候都更容易且强大。\n\n#### 5.2.4.2 安全影响\n\n与云架构的其他组件不同，数据库长期以来一直有隔离用户的需求，并对复杂的数据集对复杂的用户群配置特定的访问权限。正因如此，在数据库操作背景下，隔离问题得到了很好的理解。\n\
  \n然而，数据库被用于存储信息，这些信息通常是现代企业最重要的资产。出于这一原因，考虑存储在云基础设施中的信息的价值是重要的。无论涉及什么技术，我们都是将组织中最重要的资产信托给第三方。加密等缓解技术不在本节的考虑范围内，但它们通常是云基础设施中健壮数据库组件不可或缺的组成。\n\
  \n### 5.2.5 管理\n\n云基础设施的管理组件提供了用户和管理员可以借此来配置和操作该基础设施所有管理方面的方法。为了实现这一目标，它必须能够与每个组件通信，实现与计算、网络、存储甚至数据库组件深度集成的功能。\n\
  \n所有这些功能必须暴露给云基础设施的用户以及管理员。面向用户的前端应用程序（通常以 Web 应用程序的形式）为手动配置和操作提供图形用户界面。然而，这种手动接口无法扩展到大型云基础设施；管理组件必须通过某种编程接口暴露其功能，以简化云基础设施管理和操作常规活动的自动化。事实上，所有现代管理组件实现都支持用于此类自动化的\
  \ `API`。\n\n#### 5.2.5.1 安全影响\n\n\n\n\n保护管理组件是保障云基础设施部署安全的关键部分。可以说，它是云基础设施中妥善进行安全保护的最复杂部分。这既是因为管理组件所执行的操作具有复杂性，也是因为管理组件必须支持许多接口点。\n\
  \n管理组件具备执行所有设置和运行云基础设施所需的所有配置任务的能力。为了做到这一点，它必须管理多个计算节点、存储后端、网络连接和数据库提供商。管理组件必须对不同用户进行身份验证，理解每个用户在云环境运行中的角色，并跟踪许多复杂的授权依赖，以适当限制用户可能执行的任务。例如，它必须不允许用户配置超出其权限范围的存储空间。\n\
  \n此外，管理组件必须通过面向用户的图形化用户界面（GUI）和面向机器的 API 暴露其复杂的能力集。这些每种暴露方法都带来了其自身的安全考量，从输入清理到业务规则执行。理解健壮的管理组件所带来的巨大额外攻击面和操作复杂性至关重要。\n\
  \n## 5.3 总结\n\n云基础设施可能极其复杂，但为了妥善地保护云，深入理解它们至关重要。在这一章中无法彻底涵盖该主题，但这些内容足以为书中其他部分的信息提供适当的背景。\n\
  \n## 参考文献\n\n1. 1. Cem Gurkok, Securing Cloud Computing Systems, in Computer and\
  \ Information Security Handbook Second Edition, John R. Vacca (ed.), Elsevier: Boston,\
  \ 2013, pp. 97–123.\n2. 2. National Institute of Standards and Technology, The NIST\
  \ Definition of Cloud Computing, NIST Special Publication 800-145. Gaithersburg,\
  \ MD (February 23, 2018).\n3. 3. Raghu Yeluri and Enrique Castro-Leon, Building\
  \ the Infrastructure for Cloud Security, Apress Media: New York, 2014, pp. 160–163.\n\
  \n# II\n\n# 风险分析与责任分划分\n\n# 第 6 章\n\n# 风险与信任评估\n\n## 云服务方案\n\nErdal Cayirci\n斯格朗大学\n\
  挪威斯塔格朗\n\n## 目录\n\n- 6.1 引言\n- 6.1.1 定义\n- 6.1.2 本章结构\n- 6.2 风险分析、评估与管理\n- 6.3 云端的主要威胁\n\
  - 6.4 云风险评估\n- 6.5 云端风险与信任模型\n- 6.6 总结\n- 6.7 致谢\n- 6.8 延伸阅读\n- 6.9 参考文献\n\n## 6.1\
  \ 引言\n\n云客户（CC）与服务提供商（SPs）之间在迁移数据之前必须建立信任关系。例如，《数据保护指令》特别是第 2 条 1 要求云客户进行评估。\n\n\
  ### 6.1.1 定义\n\n我们希望先澄清一些后文用到的术语：\n\n- **威胁（Threat）**：威胁是导致意外事件的潜在原因，可能对系统、人员或组织造成危害。\n\
  - **漏洞（Vulnerability）**：漏洞是资产或控制措施的弱点，可以被威胁所利用。\n- **资产（Asset）**：资产是对组织有价值的事物，可以是有形的（例如，建筑、计算机硬件），也可以是无形的（例如，知识、经验、窍门、信息、软件）。\n\
  - **控制（Control）**：控制可以防止或减少安全、隐私或服务事件发生的概率（预防或威慑性控制），指示事件的发生（检测性控制），和/或最大程度地减少事件造成的损害，即减少或限制影响（纠正性控制）。\n\
  - **个人数据（Personal data）**：个人数据涉及可识别的活体个人。对人的识别不需要是直接的。\n- **个人身份信息（PII）**：PII 是识别身份的数据，例如社会安全号码。\n\
  - **数据主体（Data subject）**：数据主体是个人数据所属的个人或组织。\n- **数据控制者（Data controller）**：数据控制者是机构、组织实体或个人，其单独或与他人共同决定个人数据处理的目的和手段。\n\
  \n\n\n\n- **事件 (Incident)**：事件是指导致安全、隐私或服务违反/中断的事件，例如攻击后的机密数据泄露、未经数据主体适当同意的收集个人数据，或硬件故障后数据无法恢复。\n\
  - **事件 (Event)**：事件是指产生漏洞的情况，威胁可能利用该漏洞来损害某人的资产。不要将“事件”与“意外事件”混淆；例如，丢失访问卡是一个安全事件。如果外部人员使用丢失的卡在未经授权的情况下进入建筑，那么它就变成了意外事件。\n\
  - **安全事件 (Security incident)**：安全事件可以定义为单次攻击或一组攻击，可以通过攻击方法、攻击者身份、受害者、地点、目标、时间等与其他攻击区分。它导致了对计算机安全策略、可接受使用策略或标准安全实践的违反或即将违反的威胁。\n\
  - **隐私事件 (Privacy incident)**：隐私事件可以是故意或无意地违反数据控制者从数据主体处获得的同意，或违反了适用的数据保护监管框架。隐私事件可能是安全事件或服务事件的结果。例如，数据控制者将数据用于最初未声明的目的；攻击者获取了个人身份信息\
  \ (PII)；未经许可的情况下将个人数据传输给第三方。\n- **服务事件 (Service incident)**：服务事件是指违反服务条款、服务水平协议或云客户（CC）与云服务提供商（CSP）之间合同的事件。它可能是故障（例如停电、自然灾害、硬件故障或人为错误）、第三方攻击或干预（例如政府机构或执法部门）导致客户无法按照约定使用服务，导致服务中断。注意，我们将拒绝服务攻击导致的事件视为服务事件，因为其结果是服务中断。\n\
  \n### 6.1.2 本章结构\n\n下一节关于风险分析、评估和管理，我们将在那里定义风险并详细阐述风险分析、评估和管理之间的关系与区别。在第 6.3 节中，我们介绍了近期针对威胁和漏洞分析开展的研究，其中包括云安全联盟（CSA）发起的分析云主要威胁的计划，旨在更好地了解\
  \ CSP 对这些威胁的准备情况。在第 6.4 节中，介绍了两个欧洲机构进行的云风险评估，即欧洲网络信息安全局（ENISA）和法国国家信息与自由委员会（CNIL）的云风险评估。ENISA\
  \ 的风险评估是通用的，适用于所有 CSP 和 CC；它于 2009 年发布。CNIL 近期对云进行了隐私风险评估。CNIL 的工作更进一步，引入了一些措施来将风险降低到可接受的水平。第\
  \ 6.5 节关于风险模型和信任模型。在同一章中，我们还介绍了由 A4Cloud 开发的两个模型，它是欧洲 Framework Seven 项目的一部分。第一个是云采用风险评估模型\
  \ (CARAM)，这是一个定性模型，它根据 CSP 实施的控制以及 CC 计划在云中处理或存储的资产，将 ENISA 和 CNIL 框架适用于特定的 CSP-CC\
  \ 配对。第二个模型被称为联合风险与信任模型 (JRTM)，这是一个基于 CSP 性能数据的定量模型。最后，我们用第 6.6 节结束本章。\n\n## 6.2\
  \ 风险分析、评估和管理\n\n多个标准化机构，如国际标准化组织 (`ISO`)、国际电工技术委员会 (`IEC`)、美国国家标准与技术研究院 (`NIST`)\
  \ 以及信息系统审计和控制协会 (`ISACA`) 都发布了关于风险的标准：`ISO 31000`、`ISO/IEC 27010`、`NIST SP 800-30`、`NIST\
  \ SP 800-37` 和 `COBIT`。风险被定义为不确定性对目标的影响。注意，风险不仅关联负面结果（威胁），也关联正面结果（机会）。底线是风险本质上是威胁、漏洞以及利用漏洞后果的乘积。\n\
  \n我们可以将其分为两大大类：认知性 (epistemic) 或随机性 (aleatory)。认知不确定性源于知识的缺乏。随着云生态系统和服务的成熟，这类不确定性将转向随机性。Aleatory\
  \ 一词源于 Alea，在拉丁语中意为“掷骰子”。因此，随机性不确定性基于过程内在的随机性。\n\n当不确定性可以被视为随机时，就可以进行定量风险分析。在风险分析过程中会回答三个问题：\n\
  - 一个场景 `s`（即可能发生什么？）\n- 场景 `s` 的概率 `p`（即场景实现的概率）\n- 场景 `s` 的后果 `x`\n\n因此，风险 `R`\
  \ 是回答这三个问题的三元组集合，即对于 `i = 1, 2, …, N`，`R = {<s, p, x>}`，其中 `N` 代表可能场景的数量。\n\n场景的概率基于漏洞的存在、可以利用漏洞的威胁、对漏洞的威胁意识，以及威胁利用漏洞的能力和意愿。威胁的影响也被称为风险。\n\
  \n当不确定性大部分处于认知领域时，或者在偏好的情况下，也可以进行定性风险分析。对于定性风险分析，使用了可能性的定性量表（如几乎肯定的、可能的、可能的、不太可能的、罕见的）以及后果量表（如显著、重大的、中等的、微小的、微不足道的）。注意，在定性风险分析中我们使用\
  \ likelihood (可能性) 而不是 probability (概率)。\n\n对同一场景的风险感知在人与之间甚至随时间的推移而可能不同，因为不同人在不同时间点的概率和后果可能不同。这被称为感知风险\
  \ (perceived risk)。相反，绝对风险对每个人、每个时间都是相同的。计算绝对风险并不容易，因为一个人的绝对风险是另一个人的感知风险。\n\n\n\n\
  \n定性性和定量风险分析可以在多种方法论中进行，例如事件树、故障树和蝴蝶结模型 [9]]，这些方法通常被归类为归纳法或演绎法风险分析。例如，事件树分析是一种归纳法（即自下而上）技术，用于分析在事件发生的情况下，运行系统或故障系统所产生的影响。另一方面，故障树分析是一种演绎法（即自上而下）技术，它通过从顶层的不良事件向下推导，以理解可能导致该故障的原因，直到找到故障树中每个分支的根本原因。\n\
  \n风险分析是对风险场景的系统性检查，以理解其概率/可能性和后果。风险分析的下一步是风险评估，它可以简要描述为根据其概率/可能性和后果对风险场景进行评估（高风险、中等风险、低风险等）。风险管理是一个识别、分析、评估和沟通风险场景，并根据需要对其进行缓解的过程。这种风险分析、评估和管理的层级结构如图图\
  \ 6.1 所示。缓解计划可以针对减轻风险场景的原因或后果进行设计，并基于以下策略之一：风险接受、风险回避、风险限制和风险转移。风险接受并不降低风险场景的可能性或影响。由于回避、限制或转移的成本与场景的影响相比是无法负担或成本过高的，因此接受了该风险，并寄希望它不会发生。风险回避与接受完全相反；完全不采取针对该风险场景的行动以避免其发生。或者，可以实施或准备缓解计划，以限制风险场景的原因或后果。最后，可以将风险转移给另一方（例如保险公司），代价是支付转移所需的费用。\n\
  \n![图 6.1 风险分析、评估和管理。](img/fig6.1.jpg)\n\n图 6.1 风险分析、评估和管理。\n\n## 6.3 云端的主要威胁\n\n\
  对于云风险评估，CSA（云安全联盟）的十大威胁列表是一个重要的起点。CSA 对专家和利益相关者进行了调查，以深入了解他们对云威胁的认知，并将结果发表在名为《臭名昭彰的九大：2013\
  \ 年云计算主要威胁》的文档中。在本章中，我们使用了该文档的第二版（2013 年 2 月）。该出版物的早期版本于 2010 年发布。\n\n在文档中，被选为十大威胁的威胁按照参与调查的相同专家再次确定的优先级顺序介绍。对于每种威胁，除了描述外，还提供了图图\
  \ 6.2 所示的信息：哪些服务模型会受到此威胁的影响、百分比的专家认为其相关性、它在 2010 年调查中的排名以及它是如何被视为风险的——实际和/或感知。\n\
  \n![图 6.2 CSA“臭名昭彰的九大”中的数据丢失威胁。](img/fig6.2.jpg)\n\n图 6.2 CSA“臭名昭彰的九大”中的数据丢失威胁。\n\
  \n我们在本章中不再进一步阐述“九大”中的每项威胁，因为这些名称是自自明的，且本章并不是关于威胁的。关于这些威胁的进一步解释可以在 [12] 中找到。2013\
  \ 年的 CSA 列表包含了下面列出的威胁：\n\n1. 数据泄露\n2. 数据丢失\n3. 账户或劫持\n4. 不安全的接口\n5. 拒绝服务\n6. 恶意内部人员\n\
  7. 云滥用\n8. 尽职调查不足\n9. 共享技术\n\n除了“九大”之外，另一个对风险分析非常有用的重要来源是云评估倡议（CAIQ） [13]。它旨在解决“尽职调查不足”，并包含许多分类如下的问题：\n\
  \n* 合规性\n* 数据治理\n* 人力资源\n* 信息安全\n* 法律\n* 运营管理\n* 风险管理\n* 韧性\n* 安全\n\nSTAR（信任与保证注册表）是一个了解云服务提供商（CSP）应对威胁准备程度的资源\
  \ [14]。\n\n## 6.4 风险评估\n\nENISA（欧盟网络安全局）在其对云计算的建议中，提供了一份风险场景、资产和漏洞列表 [3][4][5][11][15][16]。\n\
  \nENISA 的风险场景分为四类：策略和组织、技术、法律和其他。这些每个场景的可能性及其对业务的影响是通过与专家小组协商确定的。可能性和影响的量表在极低到极高之间有五个离散级别。例如，策略和组织类别中的第一个事件场景是\
  \ P1–供应商锁定，其可能性和影响分别为高和中等。\n\n然后，根据专家确定的可能性（概率）和业务影响（影响）值，根据图图 6.3 所示的 0 到 8 之间的比例风险矩阵，转换为每个事件场景的风险水平。最后，将风险水平映射到定性量表中如下：\n\
  \n![图 6.3 ENISA 对风险级别的估计。](img/fig6.3.jpg)\n\n图 6.3 ENISA 对风险级别的估计。\n\n* 低风险：0–2\n\
  * 中等：3–5\n* 高风险：6–8\n\nENISA 还提供了 53 个漏洞（即 31 个云特定漏洞和 22 个非云特定漏洞）以及 CC 存储在云端的 23\
  \ 类资产。35 个事件场景中的每一个都与漏洞和资产的子集相关 [17]。\n\n\n\n\n云接收者（CC）可以对场景相关的风险水平进行定性评估，并通过检查了解每个场景涉及哪些漏洞和资产\
  \ [[17]]。然而，这些值代表了对一系列常见云部署的经验性推测，并不具有精确的语义。ENISA 的框架可以被归类为一种针对云计算的通用定性归纳法风险分析框架。\n\
  \n最近，法国国家信息与自由委员会（CNIL，英文为 The National Commission on Informatics and Liberty）发布了另一种定性归纳方案\
  \ [[18]]。CNIL 的方法与 ENISA 框架相似，但不同之处在于：它是一种关注云计算中隐私风险的风险评估。它仍然是通用的，不区分云服务提供商（CSP）或云接收者（CC）。\n\
  \nCNIL 的风险管理方案包含五个阶段，分析以下内容：(1) 背景、(2) 担忧场景、(3) 威胁、(4) 风险以及 (5) 措施。它不仅包括对列出的事件场景（即担忧的事件）的风险水平评估，还包括针对这些事件的某些措施。它还评估了实施这些措施后的剩余风险。\n\
  \n根据 CNIL 的说法，威胁利用资产（如计算机、数据存储和设施）的漏洞来影响或获取个人数据等主要资产，从而影响这些主要资产的所有者。其最终结果被称为“担忧的事件”。风险组成部分之间的这种关系如图图\
  \ 6.4 所示。\n\n![图 6.4 CNIL 风险组件。](img/fig6.4.jpg)\n\n图 6.4 CNIL 风险组件。\n\n根据 CNIL，隐私相关的担忧事件如下：\n\
  \n*   法律程序不可用\n*   处理过程变更\n*   对个人数据的非法访问\n*   个人数据的非预期更改\n*   个人数据的消失\n\n再次注意，CNIL\
  \ 仅针对隐私相关的担忧事件进行风险评估。CNIL 还将与这些事件相关的主要资产分为两类：\n\n*   流程：它们处理个人数据，或者根据流程要求告知数据主体、获取其同意、允许行使反对、访问、更正和删除权。\n\
  *   个人数据：它们是流程使用的数据，属于主要资产范畴。因此，它们不仅是被处理的数据，也是处理这些个人数据时所需的数据。\n\n*   CNIL 将针对云端隐私的威胁确定为：\n\
  \n*   组织内部的人员：用户、计算机专家等。\n*   组织外部的人员：接收者、提供者、竞争对手、授权第三方、政府机构、周围的人类活动等。\n*   非人类源：计算机病毒、自然灾害、易燃材料、流行病、啮齿动物等。\n\
  \n威胁可以利用以创建担忧事件的辅助资产在 [[18]] 中给出：\n\n*   硬件：计算机、通信中继、USB 优驱动器、硬盘等。\n*   软件：操作系统、消息传递系统、数据库、业务应用等。\n\
  *   网络：电缆、无线、光纤等。\n*   人员：用户、管理员、高层管理等。\n*   纸质介质：打印、复印等。\n*   纸质传输通道：邮件、工作流等。\n\
  \n与许多其他风险评估类似，CNIL 根据严重性和发生概率来计算风险水平。它实际上首先分析并分配概率和严重性的值，然后将它们相加，以得出公式 6.1 所示的风险水平。这与许多其他方法不同，后者将风险场景建模为概率和影响的积，而不是和。\n\
  \n| 风险水平 = 严重性 + 发生概率 | (6.1) |\n| --- | --- |\n\nCNIL 使用忽略、有限、显著等数值来确定云隐私的威胁。它还对这些值在不同语境下的含义给出了定义：担忧事件的识别、影响、漏洞和能力。\n\
  \n| 严重性 = 识别 + 影响 | (6.2) |\n| --- | --- |\n| 发生概率 = 漏洞 + 能力 | (6.3) |\n| --- |\
  \ --- |\n\n这些方程的结果映射到以下值：\n\n*   <5 可忽略\n*   =5 有限\n*   =6 显著\n*   >6 最大\n\n这种练习以图\
  \ 6.5 中的矩阵结束，该矩阵描述了每个担忧事件的风险水平。\n\n![图 6.5 担忧事件的风险。](img/fig6.5.jpg)\n\n图 6.5 担忧事件的风险。\n\
  \nCNIL 继续关于如何处理这些风险的建议，使其可以转移到矩阵的左下方。之后，它重新评估了这些风险（即剩余风险），并证明了它们是可以接受的。\n\n## 6.5\
  \ 云风险与信任模型\n\n从云的角度来看风险建模引起了研究者的关注 [[19], 20]]，并将作为服务的信任”被引入云领域。需要用于验证和问责的标准信任模型，但目前没有任何信任模型适用于云环境\
  \ [[21]]。许多信任模型试图适应 Marsh 定义的因素 [[22]] 以及 Banerjee 等人定义的因素 [[23]]，并且有许多旨在衡量它们的信任机制。\n\
  \n信任的定义可以作为建模的起点。在 Mayer 等人 [[24]] 和 Rousseau 等人 [[2]] 中，信任被定义为“信任方基于对对方执行特定行动的预期而处于脆弱的意愿，无论是否有监控或控制对方的能力”。这种定义没有完全捕捉信任的所有动态，例如受托方执行特定行动且不参与机会主义的概率\
  \ [[19]]。信任还有硬性和软性两个方面 [[25]][26]–27]]。信任的硬性取决于安全措施（如身份验证和加密），而软性信任则基于品牌忠诚度和声誉。在\
  \ Ryan 等人 [[28]] 中，作者不仅引入了安全性，还将问责和审计作为影响云计算信任的元素，并证明它们可以列在硬性方面中。在 Kandukuri 等人\
  \ [[29]] 中，服务水平协议（SLA）被认为是澄清 CSP 问责和审计的唯一方式，因此 CSP 可以鼓励 CC 信任它们。结论是，“信任”是一个很难定义的概念。\n\
  \n在 Rashidi 和 Movahhedinia [[20]] 中，CC 对 CSP 的信任与以下参数有关：\n\n*   数据位置：CC 知道其数据的实际所在位置。\n\
  \n\n\n\n\n*   调查：云客户（CC）可以调查其数据的状态和位置。\n*   数据隔离：每个 CC 的数据都与其他数据相互分离。\n*   可用性：CC\
  \ 可以随地访问服务及其数据。\n*   特权 CC 访问：特权 CC（如系统管理员）是值得信任的。\n*   备份与恢复：云服务提供商（CSP）具有从灾难性故障中恢复的机制和能力，且不易受到灾害影响。\n\
  *   合规性（监管合规性）：CSP 符合安全规章，已获得相关认证，并开放审计。\n*   长期生存能力：CSP 长期以来的表现高于要求标准。\n\n作者对 72\
  \ 个 CC 回答的问卷结果进行了统计学分析，以调查 CC 对上述参数重要性的感知。根据这项分析，备份与恢复对 CC 对云计算的信任影响最大，其后是可用性、特权\
  \ CC 访问、监管合规性、长期生存能力和数据位置。他们的调查显示，数据隔离和调查对 CC 对云计算的信任影响较小。\n\nKhan 和 Malluhi `[30]]`\
  \ 建议赋予 CC 控制权，以便他们监控上述解释的参数 `[20]]`。他们将这些控制分为五大类：存储数据控制、处理中数据控制、软件控制、监管合性和计费控制。这些控制需要开发的技术包括远程监控、防止访问残留数据、安全外包、数据加密、机器可读的法规和\
  \ SLA、合规性的自动推理、实时消费数据的自动收集，以及 CC 控制自身使用情况/账单的能力。尽管这些技术已在云计算和其他用途中开发出来，但许多 CSP 仍需要时间进行实施、部署和完善。它们还需要\
  \ CC 付出大量的努力和专业知识。此外，在云服务混杂（service mash-up）中的所有服务中使用这些控制并不总是可行的。\n\n在 Audun 和 Presti\
  \ `[31]]` 中，风险相对于信任进行建模。可靠性信任被定义为成功概率，并包含在基于的基于的交易决策过程中。在 Yudistira 等人 `[32]]` 中，作者引入了基于系统组织设置来评估风险的信任。取决于系统成功的执行者（actors）的可信度取决于其对风险场景概率的影响，这种关系在\
  \ `[32]]` 中被探讨。\n\n云采用风险评估模型（CARAM） `[5]]` 是由 A4Cloud 最近开发并实施的一个模型。A4Cloud 代表云及其他未来服务的问责（Accountability\
  \ for Cloud and Other Future Internet Services），是欧盟第七个框架项目。CARAM 是一个定性模型，它采用 ENISA\
  \ 和 CNIL 的方法论和评估来评估特定 CSP-CC 对的风险。为了将 ENISA 报告中的可能性和影响评估适配到 CSP 和 CC，CARAM 分别使用了\
  \ STAR 中可用的 CSP 信息和 CC 拥有的资产。它是一个决策支持工具，旨在帮助 CC 选择最符合其风险概况的 CSP。\n\nJRTM `[4, 33,\
  \ ]]` 是另一个由 A4Cloud 开发的模型。它是一个定量风险评估模型，根据 CSP 的性能数据计算安全、隐私和('风险的概率。它计算事件发生的概率以及事件在演变成事故之前消除消除概率，并从前者中减去后者。对于性能数据，JRTM\
  \ 依赖于 CSP 提供的事件报告，并对未准确报告的 CSP 实施了惩罚机制。通过定期审计、与用于监控即服务的工具类似的监控工具，例如 Amazon Cloud\
  \ Watch `[34]]`、Amazon CloudWatch `[35]]`、RackSpace `[36]]`、Ganglia `[37]]`、Nagios\
  \ `[38]]`、Zabbix `[39]]`、Monit `[40]]`、Grid `[41]]`、ICE `[42]]`、ENISA `[43]]`、云安全\
  \ `[44]]`、QoS `[45]]`、性能 `[46]]`、声誉 `[47]]`、生存能力 `[48]]`、隐私 `[49]]` 以及信任 `[50]]`\
  \ 被使用。\n\n已经提出了许多框架来帮助用户根据各种标准进行选择，例如性能 `[43]]`、信任 `[44]]`、声誉 `[45]]`、生存能力 `[46]]`、隐私\
  \ `[47]]`、性能 `[48]]`、隐私 `[49]]` 以及信任 `[50]]`。\n\n## 6.6 总结\n\n风险和信任是云服务的关键问题，且者之间密切相关。在文献中，信任被认为是潜在客户在采用云服务之前的主要障碍。为了实现云计算，必须建立\
  \ CC 与 CSP 之间的信任关系。这需要对对端风险有深入的了解。因此，CSA、ENISA 和 CNIL 等多个机构开展了研究以获得更好的洞察。到目前，CSA\
  \ 已经对云利益相关者进行了两次调查，分别在 2010 年和 2013 年。这些调查结果包含在名为《十大著名威胁》（The Notorious Nine）的报告中，该报告详述了主要的威胁。CSA\
  \ 还维护着一个名为 STAR 的问卷数据库。许多 CSP 回答了 CAIQ 并答案注册在 STAR 中。十大著名威胁和 STAR 都是云风险评估的重要资源。\n\
