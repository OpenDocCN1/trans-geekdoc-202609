  \n# 第 20 章\n# 云端法律合规性管理：理解合同与个人数据保护要求\n\nPaolo Balboni\nBalboni Bolognini and Partners\
  \ 律师事务所\n意大利米兰\n\n## 目录\n- 20.1 引言\n- 20.2 处理法律合规性\n- 20.2.1 合规步骤对照表\n- 20.2.1.1\
  \ 第一步：合同前阶段\n- 20.2.1.2 第二步：签署云服务合同的主要问题\n- 20.2.1.3 第三步：退出云服务合同：主要问题\n- 20.3 实际案例\n\
  - 20.3.1 识别签约方 – 常见条款\n- 20.3.2 处理商与分包商 – 常见条款\n- 20.3.3 对 CSA（云服务协议）的修改 – 常见条款\n\
  - 20.3.4 Term 与终止；终止的影响 – 常见条款\n- 20.3.5 数据位置 – 常见条款\n- 20.3.6 数据安全 – 常见条款\n- 20.3.7\
  \ 责任限制 – 常见条款\n- 20.3.8 管辖权与适用法律；遵守欧盟法律 – 常见条款\n- 20.4 总结\n\n## 20.1 引言\n随着技术的广泛应用以及其在业务中发挥着日益重要的角色，云计算的采用正以前所未有的速度增长。由于云计算在提高生产力、精简数据处理以及最重要的是降低成本和提高利润方面的巨大潜力，大多数大型公司已经转向云端。\n\
  \n在这种背景下，充分理解并分析云计算技术的法律和合规方面至关重要。在这方面，经济合作与发展组织（OECD）在《云计算：概念、影响与政府政策的角色》中强调，标准合同通常是“不接受就离开”的条款，因此不允许云端客户充分协商他们可能无法完全理解的合同条款，这导致即使对于提供者也存在巨大的不确定性，并且服务水平协议需要更好地解决停机等问题，这些问题可以通过行业准则的具体化在政策上得到推动（OECD\
  \ 2014:5）。在隐私方面，OECD 观察到，政府采取真正的全球性互操作方法是最大化云部署潜力的关键，建议政策制定者定义“哪些法律适用于存储在云端的数据，包括谁可以访问这些数据，以及在什么情况下在云端处理数据等同于跨境传输”（OECD\
  \ 2014:6）。\n\n欧盟（EU）也积极致力于以符合适用法律的方式实现云解决方案，以确保网络安全、互操作性、可移植性和市场行为。为此，欧盟委员会已强调：\n\
  \n（欧盟委员会 2020）\n\n\n\n\n\n本章的灵感来源于作者参与的两个项目：CloudWATCH 的“D3.5 云法律指南：如何在云服务合同中保护个人数据”以及云安全联盟（Cloud\
  \ Security Alliance）关于“符合 GDPR 的云安全联盟行为准则”的隐私协议（PLA）工作组。这两个项目都探讨了与本文贡献相关的云计算合同的基础方面。通过充分利用这些经验，作者旨在深化对云端法律合规风险及其管理方法的理解，并触及在与云服务供应商谈判合同及个人数据保护需求时应考虑的方面。虽然本章的目标是促进对该问题的全球性理解，但由于其欧洲律师的身份，作者将在很大程度上从欧盟合规的角度进行分析。\n\
  \n## 20.2 处理法律合规性\n\n云计算技术和服务的丰富随着 IT 服务交付模式的多样化而增长，这得益于移动和便携设备的显著普及。法律模型也随着这些技术的扩散而发展，尽管速度要慢得多。云计算合同通常继续由云服务供应商以标准格式编写。对于云服务客户来说，密切关注以下合同方面非常重要：\n\
  \n* 责任的免除或限制以及救济措施，特别是涉及数据完整性和灾难恢复的部分\n* 服务水平，也包括可用性\n* 安全与隐私，特别是欧盟《通用数据保护条例》（`GDPR`）下的监管问题\n\
  * 锁定与退出，包括期限、终止权以及在退出合同时的数据返回\n* 供应商单方面修改服务功能的能力\n\n然而，云客户与供应商充分谈判云计算合同的条款和条件仍然极具不可能性（见图\
  \ 20.1）。因此，识别出某些标准是有用的，这些标准可以帮助云客户尽力选择最其需求、并在根据当前欧洲法律的个人数据保护方面提供重大保障的供应商。\n\n![图\
  \ 20.1 此图显示了云客户与供应商充分谈判云计算合同条款和条件的可能性通常认为很低，且随着云提供商规模的增大，其谈判筹码正在下降。](img/fig20.1.jpg)\n\
  \n图 20.1 此图显示了云客户与供应商充分谈判云计算合同条款和条件的可能性通常认为很低，且随着云提供商规模的增大，其谈判筹码正在下降。\n\n### 20.2.1\
  \ 合规步骤对照表\n\n本节旨在为潜在客户在云服务合规分析中提供指南。它分离了与云关系三个阶段的主要问题，包括合同前阶段、合同阶段和合同后阶段。每个阶段在下文中都有更详细的讨论，并结合了实用的清单，以帮助客户做出明智决策。\n\
  \n### 20.2.1.1 第一步：合同前阶段\n\n合同前阶段，或合同实际签署之前的阶段，是任何合同协议中的一个重要时间点。重要的是要为客户提供有关云合同所有方面的清晰且充分的信息，以便尽可能地避免未来的诉讼（Helberger\
  \ and Verite 2014）。\n\n#### 20.2.1.1.1 云服务客户的风险与机会\n\n访问广阔网络、汇集并优化资源、在访问具有弹性和扩展性的服务的同时控制成本的能力，应当与法律合规性（或最大程度地缓解法律合规风险）相结合。在这方面，云计算在云端处理个人数据的保护方面存在固有风险。\n\
  \n欧洲数据保护机构将与云端隐私和个人数据保护相关的主要风险分为两类（Article 29 Working Party 2012: 5–6）：\n\n1. 对个人数据缺乏控制\n\
  2. 对个人数据的处理缺乏信息\n\n因此，组织在购买云服务之前，应当权衡外包给云供应商的预期优势与云端个人数据的风险（ENISA 2009）。\n\n####\
  \ 20.2.1.1.2 外包云服务\n\n购买云服务的人应始终首先经过外部和内部尽职调查。尽职调查中应考虑以下因素。表 20.1 和 20.2 分内部和外部尽职调查清单列出了客户在考虑购买云服务时应关注的考虑事项。\n\
  \n表 20.1 内部尽职调查清单\n\n| 1 | 定义云客户的隐私、安全和合规需求 |\n| --- | --- |\n| 2 | 识别云客户希望将哪些数据、流程或服务迁移到云端\
  \ |\n| 3 | 分析将服务外包到云端的风险 |\n| 4 | 识别数据传输到云端后保护所需的安全控制措施 |\n| 5 | 定义实施安全控制的责任和任务\
  \ |\n\n表 20.2 外部尽职调查清单\n\n| 1 | 使用例如《符合 GDPR 的云安全联盟行为准则》（Cloud Security Alliance\
  \ 2019）评估供应商是否满足其隐私和数据保护需求 |\n| --- | --- |\n| 2 | 检查供应商是否持有由独立第三方发布的任何认证或证明，和/或遵循相关的行为准则\
  \ |\n| 3 | 考虑服务条款是否可以修改、如何修改以及由谁修改 |\n| 4 | 了解供应商实施的安全控制是否以及如何能够被监控 |\n\n## 20.2.1.2\
  \ 第二步：签署云服务合同的主要问题\n\n签署云合同与任何其他类型的合同一样，给客户带来一系列必须仔细考虑的问题，包括管辖权、适用法律和隐私角色。这些考虑因素将在下文中进行更详细的讨论。\n\
  \n### 20.2.1.2.1 管辖权与适用法律\n\n\n\n\n\n# 管辖权与适用法律\n\n理解管辖权与合同中约定的义务的适用法律之间的区别（前者可由双方决定），以及相关数据处理活动相关的适用法律制度及主管监管机构（后者由法律规定，因此不取决于双方裁量）至关重要。云服务合同中通常包含此类条款，允许双方在协议中确定针对合同约约定义务的主管管辖权和适用法律。确定主管管辖权旨在将执行合同的权力分配给特定的主管管辖法官，而设定适用法律意味着建立适用于合同的规则。从理论上讲，合同自由原则赋予了双方约定并确定合同中规定的各项义务的管辖权和适用法律的可能性。但在实践中，云服务提供商是决定主管管辖法院和适用法律的实体，给客户留下的谈判空间非常小。\n\
  \n## 适用隐私法与监管机构\n\n关于适用的隐私法和主管监管机构，`GDPR` 在利用云计算技术服务处理个人数据时规定了相关规则并予以适用。还应考虑电子隐私指令\
  \ `2002/58/EC`，其适用触发条件是通过云向公共通信网络（例如电信运营商或互联网服务提供商）提供公开可用的电子通信服务。事实上，当云客户或云提供商符合公共通信网络中公开可用电子通信服务提供者的定义时，该法律就会发挥作用。\n\
  \n欧盟数据保护规则适用于欧洲经济区（`EEA`），包括欧盟国家和三个欧洲自由贸易组织（`EFTA`）国家：冰岛、列支敦敦和挪威。确定云计算服务提供商处理个人数据时适用法律的规则概述在\
  \ `GDPR` 的第 `3` 条中，区分了位于欧盟内的控制者、处理者与位于欧盟外的实体。通常在云环境中，数据控制者通常是云提供商的客户，而云提供商是数据处理者。考虑到这一点，需要说明\
  \ `GDPR` 主要适用于位于欧盟内的控制者和处理者。此外，`GDPR` 寻求对位于欧盟以外的控制者和处理者施加义务，前提是他们向欧盟内的个人提供商品或服务，或监控欧盟内个人的行为。确定主管监管机构的规则规定在\
  \ `GDPR` 的第 `55` 条和第 `56` 条中。简而言，每个机构在其所属的欧盟成员国领土内具有管辖权；然而，控制者或处理者主要或单一设立地的监管机构有权作为该控制者或处理者所进行的跨境处理的主管监管机构。如果控制者或处理者设立在欧盟以外，他们需要在欧盟境内任命一名代表。值得注意的是，此类代表的指定并不影响控制者或处理者在\
  \ `GDPR` 下的责任或法律责任。代表将就为确保符合 `GDPR` 所采取的任何行动与主管监管机构合作，并在控制者或处理者未合规的情况下，该代表将面临执行程序的制裁。\n\
  \n客户在决策过程中应审慎审查管辖权和适用法律，如表 20.3 所示。\n\n### 表 20.3 管辖权与适用法律\n\n| 编号 | 描述 |\n| :---\
  \ | :--- |\n| 1 | 关于合同管辖权和合同适用法律的合同安排可在《云服务协议》中 |\n| 2 | 在欧盟，适用的隐私法是数据控制者所在地欧盟成员国的法律，原则上意味着云客户居住地所属国家的法律\
  \ |\n\n### 20.2.1.2.2 隐私角色\n\n明确云端数据处理中的隐私角色至关重要，以便正确分配合同双方的法律义务和责任。责任的划分分配（`Article\
  \ 29 Working Party 2012:7`）表明，云端处理的个人数据的控制权属于客户。另一方面，云服务提供商通常被视为数据处理者。云客户作为数据控制者，承担着数据保护法律合规的主要责任。相反，云提供商在定义用于实现控制者目的的拟采用的方法以及技术或组织措施方面具有一定的自由余地。表\
  \ 20.4 充当了清单的作用，列出了云客户需要考虑的各个方面。\n\n### 表 20.4 云客户需要考虑的隐私角色维度\n\n| 编号 | 维度 |\n|\
  \ :--- | :--- |\n| 1 | 以明晰的方式分配数据保护角色 |\n| 2 | 选择保证符合欧洲数据保护法的云服务提供商 |\n| 3 | 确定作为数据处理者的云服务提供商在拟采用的方法和技术或组织措施方面的自主程度\
  \ |\n| 4 | 通过特定的数据处理协议约束作为数据处理者的云服务提供商，或在云服务协议中确立清晰的数据处理边界，并确保外包给云提供商的活动得到充分限制 |\n\
  | 5 | 避免使用位于欧盟外的复杂分包链的提供商 |\n\n### 20.2.1.2.3 合同修订\n\n云提供商通常保留单方面更改云合同的权利，并在云合同中加入此类此类条款。这对于客户来说是一个大问题，客户必须验证合同是否在这种情况下预见了提供方的通知，或是否允许客户在合同发生不利变更时终止。表\
  \ 20.5 就云客户修订云合同提供了一系列建议。\n\n### 表 20.5 合同修订清单\n\n| 状态 | 建议 |\n| :--- | :--- |\n\
  | ✓ | 合同应明确规定提供的服务，以及在服务过程中可以通过何种条件（包括程序性）进行修改 |\n| ✓ | 对关键任务水平和或个人数据保护水平不利的变更应在合同中排除\
  \ |\n| ✓ | 在变更前应通知客户 |\n| ✓ | 客户对任何变更的预先通知权可以纳入合同中 |\n| ✓ | 客户应验证，当发生违背、未通知且或不利的修订时，合同是否赋予了他们终止合同的权利\
  \ |\n\n\n\n\n云计算通常意味着数据在欧盟（EU）以外的服务器上处理或存储，因此将个人数据传输到欧洲经济区（EEA）之外的可能性很高。在云合约中，特别关注个人数据的流动非常重要。正如欧盟委员会网站专用页面上概述：“当个人数据被传输到欧洲经济区之外时，将采取特殊的保障措施，以确保保护措施随数据移动。2016\
  \ 年通过的欧盟数据保护立法改革案提供了一套多样化的工具箱，用于将数据传输到第三国：充分性认定、标准合同条款、约束性企业规则、认证机制、行为准则以及所谓的‘豁免’等。”^(16)\
  \ 因此，第一步是清晰识别提供云服务所固含的数据流。每当在一个 EEA 国家内处理的个人数据随后在另一个非 EEA 国家内被处理时，就会发生个人数据传输。这种情况可能会发生，例如，云提供商主动将个人数据从\
  \ A 国发送到位于 B 国的接收者（例如子处理器），同时也当云提供商允许位于 B 国的接收者远程访问存储在 A 国的个人数据时。第二步是为每种传输确定法律传输机制（包括通过多层分包商的后续传输），^(17)例如：欧盟委员会的充分性认定、模型合同/标准合同条款，^(18)批准的行为准则^(19)或认证机制，^(20)约束性企业规则\
  \ (BCRs)，^(21)以及隐私盾牌。^^(22)\n\n关于标准合同条款的使用，重要的是指出，在云提供商充当处理者的情况下，目前还没有批准的处理器与处理器之间的标准合同条款。因此，为了解决个人数据向非\
  \ EEA 子处理商的后续传输，作为处理者的云提供商需要考虑以下因素：\n\n*   如果云提供商位于欧盟/EEA：控制者——即云客户——必须与任何非 EEA\
  \ 接收者（子处理器）签订标准合同条款，这些接收者可能与服务接收其源自 EEA 的个人数据。云提供商必须识别如何确保这一点的实现——通常是让云客户直接与接收者签订标准合同条款，或者接收云客户的委托代表其执行该操作。\n\
  *   如果云服务提供商（CSP）位于欧盟/EEA 之外：云提供商可以考虑利用与云客户签订的、由委员会通过的控制者到处理者的标准合同条款中的`Clause 11`（“分包/转包”）（`Decision\
  \ 2010/87/EU`^(23)），以便与其非 EEA 子处理器签署书面协议，而无需云客户的直接干预。\n\n### 20.2.1.2.5 分包商对个人数据的处理\n\
  \n云服务提供商可能会为了云的运行将部分处理工作外包给分包商。重要的是，事实上，可能会雇用多个不同的子处理器，这可能导致对个人数据的控制缺失、数据处理者缺乏问责，从而导致数据主体难以行使他们的权利。GDPR\
  \ 对处理者（云提供商的典型数据保护角色）施加了义务，要求其向云客户披露其为提供服务而可能参与的处理/分包链的清晰信息，并接受控制者（即云客户）的授权（特定授权或通用授权）。更准确地说，希望雇用分包商/子处理者的云提供商-处理者应从云客户处获得此类特定授权（即云客户批准了特定标识的分包商/子处理器，未来的聘用须经云客户批准）或通用授权（即云客户通常接受使用分包商/子处理器，但前提是在任何未来的聘用前需通知云客户，以便其提出异议）。此外，云提供商-处理者必须通过合同（或其他约束性法律行为）对其他处理者（即分包商/子处理器）施加与云提供商和云客户之间规定的相同（或至少是实质等同）的数据保护义务，并应仅雇用提供足够保证以实施适当技术和组织措施的其他处理器（即分包商/子处理器），以确保处理符合适用欧盟法律的要求。^^(24)\n\
  \n此外，分包商可能位于欧盟之外，并接收来自云服务客户的个人数据，这需要根据前节所述（20.2.1.2.4 数据位置和数据传输）对数据传输进行适当规管。\n\n\
  `表 20.6`)\n\n客户应始终控制提供商是否保证在数据被进一步分包处理时，也能确保数据主体易于行使权利。此外，客户应确保在合同中云提供商明确承诺与云客户合作，以便有效行使数据主体权利，即使在数据被进一步分包处理时。\n\
  \n### 20.2.1.3 第三步：退出云服务合同：主要问题\n\n第三步审查了退出云服务合同时需要考虑的主要问题。将讨论锁定与互操作性以及合同终止。\n\n\
  ### 20.2.1.3.1 锁定与互操作性\n\n\n\n\n\n锁定可能是云供应商使用专有数据格式和服务接口的结果，这使得云供应商之间的数据互操作性和可移植性变得非常困难。缺乏互操作性和可移植性不可避免地导致服务迁移变得复杂（锁定效应）。客户应遵循表\
  \ 20.7 中提出的两个建议。\n\n### 表 20.7 锁定与互操作性清单\n\n| ✓ || 检查云提供商是否以及如何确保数据的可移植性和互操作性 |\n\
  | --- | --- |\n| ✓ || 优先选择有助于互操作性的标准数据格式和服务接口 |\n\n### 20.2.1.3.2 服务水平协议 (SLAs)\n\
  \n服务水平协议，或 `SLAs`，是云计算合同中不可或缺的一部分（参见表 20.8）。`SLAs` 帮助云客户识别云提供商提供的服务以及服务水平目标。`SLAs`\
  \ 以服务性能指标的形式表示；因此，通常以数字衡量。不同供应商之间的 `SLAs` 差异巨大。`SLAs` 可以定义服务的性能，例如有关服务的可用性、安全性以及数据管理方式，有时还包括个人数据保护条款。云客户应始终：\n\
  \n### 表 20.8 与整个云服务协议及数据保护条款相结合的 SLAs\n\n| ✓ || 仔细阅读并分析 `SLAs`，以理解其对云服务协议中规定的双方合同责任和义务的决策影响\
  \ |\n| --- | --- |\n| ✓ || 了解 `SLAs` 中规定的条款与适用的数据保护制度之间的相关性（例如在数据安全措施、机密性、完整性和可用性方面）\
  \ |\n| ✓ || 检查云服务协议是否为服务水平违约提供了服务额度补偿和/或补救措施，例如违约罚金、金钱赔偿等。 |\n\n1. 仔细阅读并分析 `SLAs`。\n\
  2. 检查云服务协议是否为服务水平违约提供了服务额度补偿和/或补救措施，例如金钱赔偿。\n\n### 20.2.1.3.3 合同终止\n\n在云合同终止阶段，客户必须能够检索传输到云的数据。这必须在供应商删除这些数据之前的特定时间段内完成。更准确地说，云合同应明确指示在合同/服务终止后，以允许数据可移植的格式向云客户返回个人数据的程序，以及云供应商及其分包商/子处理商在合同关系结束后将用于删除数据的方法。三个实用的建议可以在表\
  \ 20.9 中找到。\n\n### 表 20.9 建议：合同终止\n\n| ✓ || 云同协议中应明确识别终止流程的各个步骤 |\n| --- | --- |\n\
  | ✓ || 一份良好的云协议应包含规定数据检索时间的条款，例如客户从云服务中检索其数据副本的时间。还应包括数据保留期，以及供应商为了将个人数据传回给客户或允许客户以后迁移到其他供应商而遵循的程序\
  \ |\n| ✓ || 还应说明云提供商在合同终止后的数据数据删除程序（包括由其分包商/子处理商处理的数据） |\n\n## 20.3 实际示例\n\n云服务协议\
  \ (`CSA`) 由一组规范云服务提供商与客户之间关系的文档组成。如前所述，虽然云计算技术正在以快速速度发展，但云环境下的合同并非如此。由于云提供商和云客户之间通常存在规模不平衡，`CSAs`\
  \ 通常由云提供商以标准的、不可协商的、“不接受就走人”的条款提供。这种背景使得云客户难以确保他们能够履行由合同以及相关的有关隐私和数据保护的欧盟法律所施加的义务。在本节中，将说明一些云客户可能会在\
  \ `CSAs` 中发现的示例条款，以便读者对云服务提供商在处理各种合同方面方面采取的典型方法有更好的实践洞察。下列出的条款应被视为处理某些合同问题的不同方法。示例条款仅供参考，不构成法律建议；所有对地点、人名、事实性情况的引用均纯属巧合。\n\
  \n### 20.3.1 识别合同方 – 常见条款\n\n虽然许多人倾向于认为云服务合同的初始部分只是说明双方的正式形式，但实际上关注这一点非常重要，因为它揭示了一个关键细节：云服务客户签约的具体实体以及与其相关的其他重要信息，例如其位置。一些云供应商在欧洲设立了关联公司（参见上述示例\
  \ a），在这种情况下，客户是与一家位于欧盟的实体签约，合同很可能受特定关联公司所在地欧盟成员国法律的约束。在其他情况下，客户直接与关联公司的控股公司签约，而控股公司通常位于欧盟境外。因此，涉及适用于个人数据处理（特别是个人数据传输）的数据保护法问题将必须经过批判性评估（参见第\
  \ 20.2.1.2.4 节）。该引言条款还提供了可能构成协议一部分的其他文档或附件的信息，从而提供了整个合同关系的概述。例如，请看下方的常见条款：\n\n1.\
  \ a. 本云服务协议是位于……（例如法国）的提供商与签署本协议的个人或实体（“您”）之间的协议。\n2. b. 本协议由提供商与同意这些条款的实体（“订阅者”）共同签署。\n\
  3. c. 使用本协议，客户可以订阅云服务。本协议及相关附件和相关文件构成了合同的全部。\n\n也就是说，可以找到合同来源层级的信息，例如服务条款 (`ToS`)\
  \ 或主服务协议 (`MSA`)、服务水平协议 (`SLA`)（也参见第 20.2.1.3.2 节）、隐私政策、数据处理协议 (`DPA`)、可使用政策 (`AUP`)、针对额外服务的特定服务订单等。\n\
  \n### 20.3.2 子处理商和分包商 – 常见条款\n\n\n\n\n云服务经常涉及在位于欧盟以外的服务器上处理个人数据，因为一些主要的云服务提供商的总部位于欧盟以外，或使用欧盟以外的基础设施。因此，在云端处理的个人数据很可能会传输到位于欧盟以外的实体。`GDPR`\
  \ 第 28 条规定，控制者必须仅使用提供充分保证的处理器，以确保“实施适当的技术和组织措施，使处理活动符合本条例的要求，并确保数据主体权利的保护”。此外，处理过程应由特定的控制者-处理器协议涵盖，通过该协议处理器被要求遵守特定的法律规则，以保证可接受的数据保护水平。例如，请参阅下方的常见条款：\n\
  \n1.  a. 提供商可以使用世界各地各地的处理器和次级处理处理器（包括人员和资源）来提供云服务。客户的个人数据可能会跨国传输，包括传输到欧洲经济区（EEA）之外。客户内容可能被处理的国家列表见附件\
  \ `[\\_\\_\\_]`（例如《隐私和数据保护条款》）。有关数据处理的其他信息可根据要求提供。\n\n2.  b. 提供商在协议项下的部分或全部义务可能由提供商的关联公司履行，这些关联公司已签署了内部协议，根据该协议，关联公司处理个人数据采用与提供商一致的保护措施。此外，提供商可能会聘用分商协助提供云服务。提供商将根据要求向客户提供分商列表的副本。\n\
  \n从控制者向处理器合法传输数据的另一种方法是使用标准合同条款，以约束双方遵守特定的隐私义务（见第 `20.2.1.2.4` 节）。`GDPR`还规定了有关开发特定认证和行为准则的条款，这将使控制者和处理器能够证明其符合特定级别的数据保护。特别是第\
  \ `28(5)` 条规定，“处理器遵守已批准的行为准则 `[...]` 或已批准的认证机制 `[...]` 可作为证明具有充分保证 `[...]` 的要素之一”（另请参阅第\
  \ `20.1` 节）。\n\n强烈建议检查云服务提供商是否已建立程序，以确保数据在有效的法律基础上传输到其次级处理器，并且其聘用的次级处理器能够证明其遵守 `GDPR`\
  \ 规定的数据保护规则。在这方面，上述第 `b)` 条似乎更符合适用数据保护法律的规定。\n\n### 20.3.3 CSA 的修订 – 常见条款\n\n在处理协议可能修改的情况的条款中，经常发现一些反复出现的“关键词”。其中一个关键词（如下所示）是“合理的”（reasonable）或“商业上合理的”（commercially\
  \ reasonable）。这为云服务提供商为识别可以应用变更的情况留了相对宽泛的空间，有时无需通知客户。然而，同一个关键词（“合理的”）也可以作为知情客户的有力工具，用于争议修改的情况是否客观合理。更重要的是，正如在下方示例所示所示，强烈建议客户通过定期检查所选提供商网站上的“条款与条件”或“服务水平协议”（SLA）链接，随时关注任何潜在变更。变更通常必须以书面形式进行，但如下所示，为了使变更生效，双方并不总是必须接受它们。有时，如示例\
  \ a) 所示，修订后的协议将直接发布在云服务提供商的网站上。例如，请参阅下方的常见条款：\n\n1.  a. 如果提供商对服务进行了重大变更，提供商将通知客户，前提是客户已订阅了接收此类变更的通知。提供商可能会随时对本协议进行修改。重大修改应在发布三十天后生效，除非修改适用于新功能，在这种情况下将立即生效。如果客户不同修订后的协议，客户必须停止使用相关服务。\n\
  \n2.  b. 提供商可能会更改与数据处理和安全服务相关的条款，如果此类修改是为了遵守适用法律、适用法规、法院命令或政府监管机构或机构发布的指导意见，或者此类变更在商业上是合理的、不会导致服务整体安全性的下降，且对客户在条款下的权利未产生其他重大负面影响。\n\
  \n3.  c. 提供商可以合理地修改云服务，且不会降低其功能或安全特性。任何影响云服务商业条款（例如费用）的变更在下一次约定的续约或扩展之前将不生效。客户通过在变更生效日后下达新订单或继续使用，或在收到变更通知后允许交易续约来视为接受变更。除上述规定外，对协议的所有变更必须以经双方接受的书面形式进行。\n\
  \n### 20.3.4 条款与终止；终止的影响 – 常见条款\n\nCSA 通常包含有关终止情况和影响的条款。客户应始终检查每方为了有效终止协议而必须给出的通知。有时，提供商必须给出的通知期与客户必须给出的通知期不同。例如，请参阅下方的常见条款：\n\
  \n1.  a. 提供商可提前十二个月撤回云服务，除非附件另有说明。提供商将在客户剩余有效期内继续提供云服务，或与客户合作迁移到其他提供商的服务。客户可以随时提前书面通知便利终止协议，并在终止时停止使用相关服务。提供商可以随时便利终止协议，无需对客户承担责任。\n\
  \n2.  b. 如果协议终止，则：(i) 一方向另一方的授权立即停止；(ii) 欠提供商的所有费用在收到最终电子账单后立即支付；(iii) 客户删除软件、任何应用程序、实例、项目和任何客户数据；(iv)\
  \ 根据要求，双方将尽商业努力归还或销毁对方的所有机信息。\n\n3.  c. 云服务终止后，提供商将返回或提供检索客户云服务环境中个人数据。在返回数据后，或协议另有规定，提供商将及时删除或使无法访问生产云服务环境中所有个人数据的副本，除非法律另有要求。\n\
  \n\n\n\n\nCSA（云服务协议）中通常包含有关终止情况和影响的条款。客户应始终检查各方必须提供的通知，以便有效终止协议。有时，服务提供商必须提供的通知期与客户必须提供的通知期不同。\n\
  \n此外，检查提供商将如何（以及何时）返回客户数据也至关重要。人们应该注意用词选择上的差异，因为具体的含义对客户在 CSA 终止后访问其自己的数据可能产生重大影响。将“尽商业上的合理努力”返回信息与“将返回或以其他方式提供供调取”信息进行对比，可以发现这两种不同的方法，它们对于客户在\
  \ CSA 终止后访问数据可能产生非常截然不同的后果。在合同终止时，获得个人数据已完全删除的可靠证明至关重要。\n\n### 20.3.5 数据位置 – 常见条款\n\
  \n在云环境中处理个人数据的可能位置至关重要，因为向向欧洲经济区（EEA）以外的国家传输个人数据必须遵循 `GDPR` 第五章中规定的规则。提供商可以使用其任何关联公司来处理和存储客户数据，这就是为什么客户应该关注此类关联公司的位置以及提供商所建立的机制，以确保数据传输和后续的数据存储符合相关法律。例如，请参见下方的常见条款：\n\
  \n1. a. 客户可以选择某些客户数据的存储位置，提供商将根据 `Service Terms` 将其存储在该处。必要时，提供商可以在其或其代理拥有设施的任何地方处理和存储客户数据。根据本协议，提供商仅为处理者。\n\
  \n2. b. 如果提供商的关联公司或子处理商位于 EEA 或瑞士以外的国家，且这些国家未获得欧洲委员会或有权国家数据保护机构的约束性充分性认定，则数据传输管理如下：从客户到提供商或提供商关联公司的传输受本\
  \ `Data Processing Agreement` 条款以及 (i) `Model Clauses`（标准条款）的约束，客户作为“数据出口方”，提供商和/或提供商的关联公司作为“数据进口方”（如这些术语在\
  \ `Model Clauses` 中的定义）；或 (ii) 符合 `GDPR` 相关要求并提供充分保护水平的其他适当传输机制。本 `Data Processing\
  \ Agreement` 的条款应结合 `Model Clauses` 或前句提到的其他适当传输机制一起阅读。\n\n### 20.3.6 数据安全 – 常见条款\n\
  \n根据 `GDPR` 第 28(3) 条，数据处理者有义务采取第 32 条（“数据安全”）中包含的所有措施。第 32 条包含了一系列涉及匿名化和加密的规则，确保机密性、完整性、可用性和恢复能力，并在发生技术或物理事件时确保对数据的访问。此外，`GDPR`\
  \ 第 33 条还规定了发生数据泄露时需要采取的步骤：例如，通知客户并描述泄露的后果，以及为减轻数据泄露潜在不利影响而应采取的步骤。此外，请参见下方的常见条款：\n\
  \n1. a. 客户对任何安全漏洞以及客户内容和客户应用程序产生的此类漏洞后果负责，包括客户内容或客户应用程序中包含的病毒、木马、蠕虫或其他程序，这些程序可能会限制或损害计算机的功能，或可能损坏、拦截或剥夺数据。\n\
  \n2. b. 每个云服务的附件描述了 `Cloud Service` 的安全功能和特性。通过使用 `Cloud Service`，客户承认其符合客户的要求和处理指令。\n\
  \n在通用安全措施的基础上，每个处理者都可能提供额外的、可定制的安全功能，以便获得与其他处理者相比的竞争优势。在选择云云服务时，可以考虑此类额外的安全功能。\n\
  \n### 20.3.7 责任限制 – 常见条款\n\n云合同通常包含在法律允许范围内尽可能排除责任的条款。然而，重要的是，如示例 b) 所示，支付金额的限制不能超过客户在获得损害赔偿的事件发生前\
  \ 12 个月内为该服务支付的金额（如果是经常性费用，则适用最多 12 个月的费用）。然而，此类封限额并不总是设定在相同的阈值，且可能在不同提供商之间有所差异。建议云客户检查云提供商如何限制其责任，并在决策和签署协议时考虑这一因素。此外，请参见下方的常见条款：\n\
  \n1. a. 在适用法律允许的最大范围内，一方或提供商的供应商均不对本协议下的收入损失或间接、特殊、偶然、后果性、惩戒性或惩罚性损害不承担责任，即使该方知道或应知此类损害是可能的，即使直接损害无法提供补救措施。\n\
  \n2. b. 提供商对与 `Agreement` 相关的所有索赔的全部责任将超过客户就索赔标的的服务为止已支付的金额（如果是经常性费用，则适用最多 12 个月的费用）所遭受的任何实际直接损害金额，无论索赔依据为何。此限制共同适用于提供商、子公司、承包商和供应商。提供商不对特殊、偶然、惩戒性、间接或经济后果性损害，或利润损失、业务损失、价值损失、收入损失、声誉损失或预期节省不承担责任。\n\
  \n### 20.3.8 管辖权和适用法律；对欧盟法律的遵守 – 常见条款\n\n关于适用法律的概念，必须区分适用于合同并对其进行解释的法律，以及适用于个人数据处理的法律。前者通常由双方通过合同约定；后者可能无法由双方约定，因为它遵循法律中设定的标准。例如，`GDPR`\
  \ 第 3(1) 条规定，“本条例适用于在欧盟境内控制者或处理者的设立活动背景下对个人数据进行的处理，无论该处理是否在欧盟境内进行。”此外，第 3(2) 条进一步规定，如果控制者或处理者位于欧盟境外，且他们在欧盟境内提供商品或服务，或者监控位于欧盟境内人员的行为，则\
  \ `GDPR` 适用。因此，`GDPR` 的适用范围非常广泛。在上述情况下，如果满足法律规定的条件，无论双方约有何种不同的安排，欧盟法律均适用。\n\n此外，请参见下方的常见条款：\n\
  \n\n\n\n\n1. a. 双方同意适用于 `[\\_\\_\\_]` 州（例如：美国密歇根州）的法律，且不考虑法律冲突原则。各方的权利和义务仅在客户业务地址所在地国家有效。如果本协议的任何条款无效或不可执行，则其余条款继续完全有效。\n\
  \n2. b. 本协议受 `[\\_\\_\\_]`（例如：德国法律）管辖，双方同意对于任何因本协议引起或与本协议相关的争议，均应提交至 `[\\_\\_\\\
  _]`（例如：德国）法院的专属管辖，并作为审判地。\n\n## 20.4 总结\n\n本章为读者提供了在云关系中（合同前、合同中及合同后阶段）需要考虑的提示和建议。事实上，在迁移到云端之前，潜在客户始终应该敏锐地确保他们找到了一个提供足够水平数据保护的云提供商，从而做出知情决策，从提供最高保障的云提供商处采购。一些云提供商缺乏透明度，且其服务条款中往往含有不合理的限制和免责排除条款。然而，仅在采购时做出知情决策是不够的。客户还必须定期检查所选云提供商是否遵守数据保护合规控制，同时考虑到免责条款的限制和排除。\n\
  \n云客户（即企业和公共管理部门）需要关注云服务协议，确保其符合相关的法律合规要求，并明确规定双方的职责和义务。\n\n正如之前强调的，云计算的指数级增长正在改变企业和政府的思维和运作方式。云的增长将以比我们目前看到的更快的速度持续，这使得理解云合同的运作变得日益重要。\n\
