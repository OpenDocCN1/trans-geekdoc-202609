  \ 总结\n- 参考文献\n\n## 26.1 引言\n\n云计算改变了 IT 服务的的设计和部署方式，大大提高了灵活性并降低了成本。然而，这种创新是有付代价的，因为安全性受到了负面影响。由于数据和应用程序由最终用户管理，多种威胁随之出现：从对操作系统的直接访问到不同租户之间的攻击。CSA\
  \ 和 NIST 等机构已针对这些威胁提出了解决方案。然而，大多数解决方案严重依赖软件，因此只有在我们能够保证这些软件正确执行时它们才是可靠的。这意味着云环境中安全最基本的问题就是信任软件的能力。我们将证明通过可信计算（TC）可以实现这一目标。\n\
  \n## 26.2 可信计算技术\n\n可信计算引入于 20 世纪 90 年，用于解决平台信任性问题（即预期设备以特定方式运行）。可信计算组织（TCG）是一个促进和开发与可信计算相关文档的组织。TCG\
  \ 发布了多项定义可信平台的规范，更重要的是，它提出了一种被工业界广泛接受的实现方案，该方案依赖于一种额外的——可信平台模块（TPM），该芯片已随数百万台设备发布。\n\
  \n### 26.2.1 可信平台\n\n根据 TCG 的规范，从功能角度来看，如果一个计算平台至少具备三个特性，则它是一个可信平台（TP）：保护能力、完整性测量和完整性报告。保护能力是一项基本操作（通过硬件和固件的适当混合执行），对于信任整个\
  \ TCG 子系统至关重要。这与受保护区域（shielded locations）的概念密切相关：平台上的特殊区域（例如硬件寄存器），在这些区域内可以安全地存储和处理敏感数据。具有操作受保护区域排他权限的命令集构成了\
  \ TP 的保护能力。\n\n\n\n\n\n测量信任根（`RTM`）实现了一个能够进行本质可靠的完整性测量的引擎。它可以通过计算机系统启动时执行的第一个软件模块（即\
  \ BIOS 的一小部分）来实现，也可以通过最新一代的处理器直接在芯片上实现（例如配备了可信执行技术的 Intel 处理器，简写为 `TXT` [5\\]）。在平台启动时，应首先激活\
  \ `RTM`，以度量启动过程的完整性。此过程被称为可信启动或度量启动。在此阶段执行的一系列操作和指令被称为核心测量信任根（`CRTM`）。\n\n存储信任根（`RTS`）安全地持有完整性测量结果（或这些值的值的准确摘要和序列），并保护存储在外部存储器中的、由\
  \ TP 使用的数据和加密密钥。最后，报告信任根（`RTR`）能够可靠地向外部实体报告 `RTS` 所持有的测量结果。\n\n### 26.2.2 可信平台模块\n\
  \n可信平台模块（`TPM`）是一种由 TCG 标准化的廉价硬件芯片。其最新版本是 `TPM-2.0` [6\\]，它解决了以前版本的许多局限性并提供了更安全的加密原语。`TPM`\
  \ 可以在硬件中实现 `RTS` 和 `RTR`，以安全地存储并报告完整性测量结果。由于 `CRTM` 通常依赖于平台（例如 BIOS 的第一部分），通用的 `TPM`\
  \ 芯片本身无法提供 `RTM`。然而，通过与 `CRTM` 结合（例如通过 `TXT` 技术），`TPM` 为可信平台提供了完整的基础。\n\n`TPM-2.0`\
  \ 在硬件中实现了一系列丰富的加密原语，例如异步加密函数（如 `RSA` 和椭圆曲线加密算法，如 `ECDSA` 和 `ECDH`）、对称加密函数（如 `AES`）以及安全哈希函数（如\
  \ `SHA` 和 `SHA-256`）。标准定义了厂商必须实现的最小加密原语集，但也允许对其进行扩展。\n\n层级（Hierarchy）是一组作为组合管理的对象集合。这些对象包括种子、主密钥和证明值。每个层级都从自己的种子开始，种子是一个永远不会在芯片外暴露的大随机数，用于生成称为主密钥的加密密钥。此外，每个层级都有一些证明值，`TPM`\
  \ 使用这些值来确保提供给 `TPM` 的某些数据是由该 `TPM` 生成的。这些证明值可以独立生成（例如通过软件组件或使用 `TXT` 技术），也可以通过主密钥派生。它们通常被存储在称为平台配置寄存器（`PCRs`）的特殊寄存器中，这些寄存器也可以用于安全地存储其他类型的数据。标准规定，一个合规的\
  \ `TPM-2.0` 芯片必须至少有 24 个寄存器（编号从 0 到 23），能够存储至少 256 位。某些 `PCRs`（例如从 16 到 23）在平台正常使用期间具有被单独重置的可能性。\n\
  \n层级可以是持久的也可以是瞬态的。`TPM-2.0` 支持一种名为空层级（null hierarchy）的瞬态层级，它在每次重启时都会重置。`TPM-2.0`\
  \ 支持三种持久层级：\n\n- **平台层级 (Platform hierarchy)**：旨在供制造商使用，用于确保平台数据。\n- **存储层级 (Storage\
  \ hierarchy)**：供所有者（可以是用户）使用，并在每次平台敏感数据变化时重置。\n- **背书层级 (Endorsement hierarchy)**：供部门（可以是用户实体）使用。该层级的密钥也称为背书密钥（`EKs`），用于远程证明等关键任务（见\
  \ 26.2.4）。\n\n### 26.2.3 完整性测量\n\n在任何时刻，`TP` 都有一个信任边界，即其可信组件的集合。如果可信组件在执行另一个组件之前对该组件提供了可靠的描述（即对其进行测量），则该信任边界就可以扩展。结果是信任边界从第一个组件扩展到第二个。这个过程可以迭代，使得第二个实体可以对第三个实体提供可靠的描述，以此此类推。在实践中，平台创建了一个信任链，每个组件都由前一个组件进行测量。这种迭代过程被称为传递信任（transitive\
  \ trust），用于为整个平台提供可靠的描述。\n\n完整性测量是用于创建平台传递信任的操作。它是 TC 中的主要构建模块之一，为远程证明和可信存储等功能提供了基础。通常用于完整性测量的指标是平台组件的摘要。如前所述，此过程的起点是\
  \ `RTM`。后者通常位于 BIOS 的第一部分，是上电或重位时执行的第一个组件。它的任务是测量剩余的 BIOS 和引导程序，然后加载引导程序并将控制权交给它。\n\
  \n在符合 TP 的系统中，`extend` 操作对于平台完整性测量至关重要。给定一个 `PCR`，其存储值按以下方式扩展：\n\n```\nPCR_new =\
  \ hash(PCR_old || data)\n```\n\n其中 `PCR[new]` 和 `PCR[old]` 分别是寄存器中的新值和旧值；`data`\
  \ 是待测量/添加的数据；`hash` 是合适的安全哈希函数（例如 SHA 256），`||` 是连接操作符。\n\n\n\n\n\n如果平台感知 TPM，则可以获得关于加载器和操作系统内核的信赖描述：因此，`RTM`\
  \ 会计算加载器的哈希值，而加载器在加载内核之前会计算操作系统内核（以及任何参数或额外代码）的哈希值。在测量内核后，加载器将计算出的哈希值扩展（extend）到给定的\
  \ `PCR` 并启动内核。最后，内核可以测量一个受信的应用，计算应用程序代码、配置文件、命令行选项以及任何可能影响应用程序行为的其他数据的哈希值。同样，这一测量结果被存储在合适的\
  \ `PCR` 中（与内核使用的同一个或不同的 `PCR`）。从整体上看，这些完整性测量值代表了平台的配置，因此它们被安全地存储在 `PCRs` 中。\n\n\
  扩展过程的特性使得人们无法根据 `PCR` 的当前内容反向推导出存储值的列表。这就是为什么强烈建议记录每项完整性测量结果，即使这并不是强制性的。然而，TCG 的规范是与操作系统无关的。因此，它们没有规定如何处理这些测量值。一种可能的解决方案是将它们也存储在\
  \ `PCRs` 中；然而，它们是简单的对象，为了执行远程证明等更复杂的操作，可能需要对测量进行更复杂的管理。\n\n如前所述，TCG 未提供关于如何获取完整性测量值的实现细节或限制。在本文中，我们考虑完整性测量架构（`IMA`）[7]，因为它不需要修改\
  \ Linux 操作系统（因为自 `2.6.0` 版本以来它一直是内核组件），而且它是最受认可的符合 TC 标准解决方案之一。\n\n`IMA` 是 Linux\
  \ 内核先进的静态测量机制。它首次将 TCG 的信任测量概念扩展到从 BIOS 直到应用层的动态可执行内容，这是将符合 TC 标准的系统引入现实场景的重要一步。`IMA`\
  \ 证明了通过目前现商品化硬件和操作系统，可以提供强有力的信任保证，例如，验证者可以知道被证明平台中加载了哪些可执行文件和模块。这种保证不需要新的 CPU 模式或操作系统，只需要一个独立的受信实体，例如\
  \ `TPM-2.0`。\n\n一旦激活，`IMA` 将根据给定策略中指定的标准开始测量所有访问的文件，该策略可以通过内核命令行参数 `ima_tcb`（请求标准的\
  \ `IMA` 策略）或在用户空间通过向 `securityfs` 文件系统中的特殊文件 `policy` 写入所有语句（通常挂载在 `/sys/kernel/security/ima`）来提供。每个哈希值都在测量组件接管平台之前进行计算，确保获得的测量结果不会被组件本身篡改。此外，被测量的文件列表（及其哈希值）可以随时通过同一文件系统的另一个特殊文件\
  \ `ascii_runtime_measurements` 获取，该文件以 ASCII 文本格式或通过文件 `binary_runtime_measurements`\
  \ 以二进制形式编码。正如我们将看到的，该文件对于证明平台的完整性至关重要。\n\n如果系统配备了 `TPM`，`IMA` 将在一个可用寄存器之一（通常是 `PCR\
  \ #10`）上维护完整性测量的聚合值。挑战方可以使用 `IMA` 测量列表和扩展后的 `PCR` 值（图 26.1）验证系统的加载时完整性。具体而言，验证过程通过对每项测量值与上一个哈希值的拼接进行哈希计算来模拟扩展操作。如果结果与\
  \ `PCR #10` 中的验证值匹配，则说明经过验证的系统未被篡改。\n\n![Figure 26.1 IMA 验证过程。](img/fig26.1)\n\n\
  图 26.1 IMA 验证过程。\n\n### 26.2.4 远程证明](#chapter26.xhtml#re_ch-26-sec-6)\n\n远程证明（RA）是请求远程实体报告其平台状态的状态。远程证明是由想要获取平台配置或完整性证据的实体请求的。证明可以从几个维度来理解：由\
  \ `TPM` 证明、对平台的证明、平台的认证以及平台的身份验证。\n\n由 `TPM` 证明是提供 `TPM` 已知数据的操作。这是通过使用身份证明密钥（AIK）对特定的\
  \ `TPM` 数据（例如 `PCR` 值）进行数字签名实现的。验证者建立测量结果和 `AIK` 本身的有效性。\n\n对平台的证明是证明平台可以受信并报告完整性的操作。它是使用与平台关联的凭据执行的，这些凭据用于颁发\
  \ `AIK`。另一方面，平台的认证提供了声称平台身份的证据。平台认证使用任何不可迁移的签名密钥执行。认证密钥（即由 `AIK` 签名）具有可证明的额外语义。\n\
  \n基于 TCG 提出的 `PCR` 值的证明是最流行的解决方案。对于证明者和验证者来说，它都非常简单。验证者只需要向证明者发送 `TPM_Quote` 请求，指定用于执行数字签名的\
  \ `AIK`、要引用的 `PCR` 集合以及一个用于确保数字签名新鲜性的随机数（nonce）。位于证明者处的 `TPM` 验证使用 `AIK` 的授权，填充显示要引用的\
  \ `PCR` 集合的结构，对填充结构进行数字签名，然后作为 `TPM_Quote` 请求的响应返回数字签名。\n\n为了使用 `AIK` 验证证明数据（例如\
  \ `PCR` 值），需要获得一个证明该密钥是由真实的 `TPM` 生成且管理当的证书。此类证书由称为隐私认证机构（`PrivacyCA`）的特殊认证机构颁发。在创建证书之前，`PrivacyCA`\
  \ 必须验证 `TPM` 的真品性。这种验证是通过 `EK` 证书完成的。可以创建多个 `AIK`，并且为了防止平台操作的可追溯性，理想情况下与每个不同的评估者（即请求完整性证据的远程实体）交互时应使用不同的\
  \ `AIK`。\n\n### 26.2.5 局限性](#chapter26.xhtml#re_ch-26-sec-7)\n\n\n\n\n尽管有上述技术，TC\
  \ 技术并不能完全解决所有的信任问题。首先，作为一种被动组件，在远程证明过程中，`TPM` 无法对被证明测的平台提供主动保护：它的作用仅仅是为验证者提供不可伪造的证据，然后由验证者必须评估这些证据并决定是否信任被证明测的平台。其次，`TPM`\
  \ 虽然可以针对软件攻击提供强力保护，但硬件攻击仍然可能。目前已有研究证明，针对旧版 `TPM 1.2` 至少存在一种硬件攻击方法 [8]..。2018 年，有报告指出较新的\
  \ `TPM 2.0` 芯片在 `RTM` 子系统方面存在设计缺陷 [9]..。这可能允许攻击者伪造某些 `PCRs`，从而规避完整性检测。同年，研究还表明，运行\
  \ `TXT` 和 `TPM 2.0` 技术的计算机容易受到另一种 `RTM` 漏洞的影响，从而通过滥用电源中断欺骗可信平台模块（Trusted Platform\
  \ Module），使其认为自己运行在真实的平台上 [10]..。这两个攻击已在最近的固件补丁中修复。尽管如此，这证明了旧硬件仍然脆弱，且 `TPM 2.0`\
  \ 用户必须不断更新其固件。\n\n## 26.3 虚拟机的远程证明\n\n虚拟机（`VM`）是云计算技术的关键构建模块。为了平衡每个云节点的资源，提供给终端用户的服务通常托管在\
  \ `VMs` 中，而不是直接在物理机上。因此，`VMs` 的证明至关重要，因为运行在 `VMs` 中的服务可能会以验证者无法感知的方式受到破坏。物理计算平台的远程证明可以通过多种方式实现；然而证明虚拟机是一项挑战性任务。运行在二型虚拟机管理器（type\
  \ II hypervisor）之上的 `VMs` 无法直接访问信任实体（例如 `TPM`），而在使用一型虚拟机管理器（type I hypervisor）时，即使可以直接访问\
  \ `TPM`，可用的 `PCRs` 数量也不足以处理单个硬件平台上运行的所有 `VMs`。\n\n### 26.3.1 虚拟 TPM\n\n针对虚拟机的证明提出了许多解决方案。然而，没有一种方案能解决所有问题，这些解决方案与工业级应用之间仍然存在差距。\n\
  \n远程证明工作流包含三个阶段：测量、证明和验证。之前关于 `VMs` 证明的研究主要关注前两个步骤，即如何测量系统 [7, 11]]（无论是在物理机还是虚拟机中进行），以及如何正确地证明虚拟机\
  \ [12, 13]..。另一方面，大多数工作没有提供关于如何正确验证测量结果的信息。最直观的解决方案是将 `TPM` 中的 `PCR` 值与某些预定义的“黄金值”（golden\
  \ values）进行比较。这种方法提供了很高的安全保障，但 `PCR extend` 操作的性质使其难以应用于运行时测量。在启动过程中，每个组件都按照特定顺序加载，这一属性使得直接应用黄金值方法（例如可信\
  \ `PCR` 值的白名单表）变得简单可行。但在正常运行期间，情况不再如此，因为软件组件以不可预测的顺序加载，导致 `PCRs` 上的聚合结果每次都不同。\n\n\
  将信任链从硬件 `TPM` 扩展到 `VMs` 中的应用层的第一种方法是使用称为虚拟 TPM（`vTPMs`）的软件实体来模拟物理 `TPM` 的整个功能。在这种背景下，每个虚拟机都可以访问其通过软件组件模拟的私有\
  \ `TPM`。由于每个物理 `TPM` 对应许多虚拟机（通常每个硬件平台只有一个 `TPM`），因此需要多个 `vTPM` 实例。该解决方案解决的另一个问题是\
  \ `VM` 迁移，由 `vTPM` 提供相关功能（例如绑定和密封）。迁移是一项挑战性任务，因为存储的私有数据不仅需要随镜像传输，还需要在到达目标平台之前保持机密性。\n\
  \n图 26.2 虚拟机架构展示了 `vTPM` 构建块及其之间的关系。整个设施由一个 `vTPM` 管理器和多个实例组成。每个虚拟机都有自己的 `vTPM`\
  \ 实例，由管理器监督来自 `VMs` 的关联 `vTPM` 实例请求。\n\n![图 26.2 虚拟机架构](img/fig26.2.jpg)\n\n图 26.2\
  \ 虚拟机架构。\n\n客户 `OS` 将其 `TPM` 命令发送到名为客户端驱动程序的软件组件中。而服务器端 `TPM` 驱动程序运行在与 `vTPM` 管理器同一个特殊虚拟机中。该服务器端驱动程序从客户端驱动（每个\
  \ guest OS 一个）收集请求并发送给 `vTPM` 管理器。由于服务器端添加了 `vTPM` 实例编号，虚拟机无法伪造数据包并尝试访问另一个 `vTPM`\
  \ 实例。\n\n该解决方案中的硬件 `TPM` 被用作 `RTM`。它记录启动过程以及 BIOS 的测量结果。硬件 `TPM` 中的一组 `PCR` 值（通常是索引较小的\
  \ 0-8）映射到 `vTPM` 实例作为只读参数，而 `vTPM` 实例中的其余 `PCR` 值可以按通常方式扩展。\n\n在实际应用场景中，`VMs` 通常从一个云节点迁移到另一个，因此为了支持\
  \ `VM` 迁移，`vTPM` 扩展了标准的 `TPM` 命令集。`vTPM` 管理器是该框架的关键，因为它是迁移的启动者，并负责将 `vTPM` 实例及其关联的\
  \ `VMs` 传输到目标平台。它提出了一种安全的 `vTPM` 迁移协议，保持 `vTPM` 实例与其关联虚拟机之间的强关联，包括 `vTPM` 实例状态的加密/解密以及在目标平台上的恢复。\n\
  \n\n\n\n沿着这一思路，一些研究人员开始解决 vTPM 解决方案中的可扩展性问题，通过扩展 vTPM 模型来降低软件度量的复杂性。由于传统的周期性轮询模型扩展性不佳（每个虚拟机都会增加度量成本），一些作者\
  \ [13]] 提出了一种基于事件的监控和推送模型。新提出的架构如图图 26.3 所示。在之前的 vTPM 解决方案中，客户端 TPM 驱动通过 vTPM 管理器执行\
  \ TPM `extend` 命令到自身的子状态中（其工作方式类似于硬件 TPM 中的 PCR）。现在，vTPM 管理器将相同的 `extend` 操作重复到子状态的父状态中。一个父状态可以创建多个子状态，从而同时监控多个客户虚拟机。每当父状态被修改时，vTPM\
  \ 管理器就会通知订阅它的用户，从而实现了基于事件的度量。该解决方案的明显优势是其**可扩展性**（即它可以在单个平台上支持数百个虚拟机），并且几乎消除了**从测量时间到报告时间（ToM-ToR）攻击**（即在测量和报告时间之间存在一个时间窗口，期间机器可能被破坏而评估者检测不到篡改）和\
  \ **TPM 重置攻击**（即在执行恶意脚本后快速重启系统以立即重置 PCR 值）。\n\n![图 26.3 可扩展 vTPM 架构。](img/fig26.3.jpg)\n\
  \n图 26.3 可扩展 vTPM 架构。\n\n然而，这种解决方案并不实用。父状态的管理极其复杂。如果父状态随着每个子状态发生变化，通知的数量可能会迅速增加。此外，如果度量验证者对某些虚拟机感兴趣，它无法取消订阅，因为父状态反映了所有子状态。最后但重要的是，验证者如何知道父状态是可信的？子状态是不可预测的，且子状态的数量随时变化。评估者会对父状态感到困惑，因为没有办法预计算它的黄金值。\n\
  \n总而言，基于事件的监控更加方便，反馈时间可以快得多。在虚拟化环境中，管理程序控制所有运行在其上的虚拟机所执行的操作，从本质上说，它可以被修改以支持基于事件的监控。遵循这一想法，其他专家\
  \ [15]] 提出通过嵌入管理程序的完整性验证代理（IVP）来验证虚拟机的完整性，无论其类型如何。IVP 应该是易于验证的并能够在不需要频繁度量的情况下维护其完整性。由于用户依赖\
  \ IVP 来监控他们接触的虚拟机的完整性，因此 IVP 必须是可信的。例如，作者将 IVP 部署在二型管理程序 `QEMU/KVM` 宿主机内部的软件层 [16]]。IVP\
  \ 的完整性可以由依赖方进行验证，而不需要严格的周期性度量，否则将监控操作移动到宿主系统的目的就白费了。IVP 和主机系统的长期完整性通过传统的加载时度量协议进行验证。\n\
  \nIVP 是一个管理虚拟机执行并监控其完整性的守护进程。该守护进程使用与管理程序无关的接口 `libvirt` [17]] 来启动和停止虚拟机，收集虚拟设备设置的信息并控制加载时的虚拟机参数。由于内省运行中的虚拟机会直接引入巨大的性能开销，该解决方案定义了一组较小的强制点（这些点对于保护系统完整性至关重要）并对其进行监控，从而减少验证的频率和影响。\n\
  \nIVP 支持将细粒度监控技术（如虚拟机内存检查 VMI）集成到远程系统验证中。选择 `gdb` [18]] 调试器作为概念验证的 VMI 接口，因为 Linux\
  \ `KVM` 系统中的虚拟机作为用户态进程运行，这使得它们更容易监控。这些运行在 `KVM` 之上的虚拟机以调试模式运行，因此可以使用 `gdb` 设置观察点（例如内存中的位置），这些观察点会由\
  \ `IMA` 操作等与完整性相关的操作触发。一旦触发观察点，虚拟机将暂停，且无法进行出站或入站流量传输。在模块完成对新事件是否违反完整性标准的评估之前，不允许虚拟机恢复执行。\n\
  \n该解决方案非常成熟，并缓解了以前虚拟机完整性验证机制中对硬件瓶颈的要求。它不仅能够提供有关运行虚拟机完整性的相关信息，而且一旦用户注册了完整性关联，还可以通过挂起损坏的虚拟机提供主动保护，以避免恶意数据及时传输到客户端。\n\
  \n## 26.4 Keylime 框架](#chapter26.xhtml#re_ch-26-sec-10)\n\n`Keylime` [19]] 是一个开源框架，旨在成为远程度量和分布式基础设施运行时完整性的首选技术。该框架利用了\
  \ `TPM` 和 `IMA` 技术，充分支持物理和虚拟资源。\n\n`Keylime` 面向基础设施即服务（IaaS）；它旨在简化云提供商基础设施中可信计算的应用。如今，IaaS\
  \ 云服务提供商尚未提供建立信任环境所需的所有组件。此外，基础设施内的租户在部署服务时，缺乏验证底层平台完整性的有效方法。他们目前为绑定到硬件信任根的不同节点生成唯一、不可伪造的加密身份的能力也有限。通常，这些加密身份完全依赖软件，并且有时需要信任服务提供商。例如，`cloud-init`\
  \ [20]] 作为最采用的向虚拟机注入密钥的技术之一，依赖于这一前提。该技术利用一组脚本允许配置节点向 IaaS 提供者发送某些元数据，后者可以将加密密钥等敏感数据注入到虚拟机中。\n\
  \n这些问题开始通过如 `TPM` 等商品可信硬件得到解决。特别是，其理念是建立基于 `TPM` 的硬件信任根，反而形成节点身份凭据生成的 as。然而，这些技术在云环境中仍然面临一些重要问题。标准的复杂性、实现方式、性能（例如单个数字签名需要\
  \ 500 多毫秒）以及 `TPM` 的物理属性，与云平台对全虚拟化的承诺形成了鲜明对比。`Keylime` 的开发者为了解决这些问题，定义了 IaaS 可信计算系统应该具备的理想特性：\n\
  \n*   安全引导：租户应该能够安全地向其每个节点注入根密钥。\n\n\n\n\n\n- **系统完整性监控**：监控系统应允许租户在秒级内收到关于底层平台完整性偏差的更新。\n\
  - **安全分层**：在位于提供者基础设施并使用 `TPM` 的虚拟机中，应支持安全引导启动和完整性监控。\n- **兼容性**：系统应提供一种方法，在软件中利用硬件根信任的加密密钥来保护租户已使用的服务（例如磁盘加密）。\n\
  - **可扩展性**：在具有成千万个虚拟资源的 IaaS 系统中，能够满足上述要求。\n\n支持这些功能一直是 `Keylime` 开发过程的主要目标。该框架的关键点是将身份引导与身份管理解耦（请参见图\
  \ 26.4）。在这方面，可信计算在身份引导和执行完整性方面起着基础性作用，而高层安全服务负责管理身份。\n\n![图 26.4 可信硬件与高层安全服务的解耦。](img/fig26.4.jpg)\n\
  \n图 26.4 可信硬件与高层安全服务的解耦。\n\n鉴于这一见，`Keylime` 引入了一种新的引导密钥派生协议，使租户能够在云节点中安全地安装初始根密钥。它还根据云验证器模式\
  \ \\[21\\]提供了定期验证和节点自动撤销，以授予系统完整性监控。所有这些功能已在裸机和虚拟化 IaaS 场景中实现。该框架与常用安全服务的兼容性已通过与等技术的集成得到证明，例如用于初始配置的\
  \ `cloud-init`、用于定期重配置的 `puppet` \\[22\\]以及用于密钥管理的 `vault` \\[23\\]。\n\n此外，`Keylime`\
  \ 被证明是一个可扩展的解决方案，因为它可以同时管理成千万个虚拟节点，并在每秒进行数千次完整性报告验证。还可以考虑多种方案，在各种环境中（例如云实例、树莓派）中部署\
  \ `Keylime` 完整性测量验证器。\n\n### 26.4.1 Keylime 架构](#chapter26.xhtml#re_ch-26-sec-11)\n\
  \n为了深入理解关于 `Keylime` 的架构选择，描述该框架解决的假设和目标威胁是有用的。`Keylime` 的假设之一是服务提供商是“半信任”的，即它配备了一些控制系统和策略，以减少最终对平台攻击的影响。`Keylime`\
  \ 还假设攻击者无法从物理上篡改主机。尽管如此，仍然存在某些威胁，例如控制基础设施部分区域的恶恶管理员。然而，系统可以利用内核、虚拟机管理程序和应用程序的完整性测量来缓解这种威胁。此外，由于定期的验证过程，攻击者无法更改在节点上运行的代码。最后，服务提供商也可能访问租户的部分敏感数据（即启动时与节点交换的数据）。\n\
  \n`Keylime` 架构由以下组件组成（请参见图 26.5）：\n\n![图 26.5 Keylime 架构。](img/fig26.5.jpg)\n\n\
  图 26.5 Keylime 架构。\n\n- `registrar` 监督租户基础设施中 `TPM` 的 `AIKs` 的存储和认证。\n- `cloud verifier`\
  \ 是 `Keylime` 的核心组件，它利用 `registrar` 提供验证 IaaS 资源系统状态的机制。\n- `provider whitelist\
  \ authority service` 提供提供者基础设施完整性测量签名列表。\n- `software CA` 是一个证书机构，允许将信任和完整性测量与高层安全服务相关联，避免了需要感知可信计算的服务。\n\
  - `revocation service` 在发生证书撤销时加载并执行自定义脚本。\n\n`Keylime` 架构的引导始于创建 `registrar`，它保留了有关通过\
  \ `UUID` 标识的不同节点的 `AIKs` 信息。租户只有在能够验证其 `registrar` 的完整性时才能信任它。当基础设施初始化新节点时，执行的首个操作是在\
  \ `registrar` 中对其 `AIK` 进行验证。为了执行此项操作，`Keylime` 提出了一种特定的节点注册协议（请参见图 26.6）。\n\n![图\
  \ 26.6 节点注册协议。](img/fig26.6.jpg)\n\n图 26.6 节点注册协议。\n\n节点首先发送其 ID、`AIK` 的公部（`AIK\
  \ [pub]`）和其 `EK`（`EK [pub]`）。然后，`registrar` 检查 `TPM` `EK` 的有效性，如果有效，则创建一个临时密钥 `K[e]`，计算\
  \ `AIK[pub]` 的哈希，并使用 `EK` 对所有内容加密。然后，节点用其 `EK[priv]`（`EK` 的私部）解密 `K[e]`，并使用 `K[e]`\
  \ 发送其 ID 的 `HMAC` 以证明身份。\n\n在 `Keylime` 中，云验证器（CV）扮演着关键角色。在云基础设施中必须存在一个 `CV` 以验证平台的完整性。该组件利用\
  \ `registrar` 来验证用于签名的 `TPM` 引用。`registrar`、`CV` 和云节点是使用与 TPM 相关密钥的唯一组件。\n\nIaaS\
  \ 基础设施托管了物理和虚拟节点，这些通常由不同的租户管理。`Keylime` 和提出的架构是根据此逻辑设计的。特别是，`CV` 还参与了三方密钥派生协议（在\
  \ 26.4.2 节中详细说明），该协议允许租户与其节点进行密钥协商。\n\n云验证器监督的最后一个任务是定期验证。`CV` 定期验证每个节点的节点状态，以检查是否违反了运行时策略。定期验证的频率是\
  \ IaaS 基础设施中的关键点。在这种情况下，必须在单个 `CV` 能管理的节点数量与违规到相关 CV 检测之间的延迟之间建立平衡。\n\n\n\n\n\n\
  到为止描述的架构是对完整 Keylime 框架的简化。为了管理虚拟节点，必须实现某些扩展。\n\nKeylime 的目标是在虚拟机内部创建支持信任计算（TC-enabled）的\
  \ CA 和租户节点。为了完全实现这一目标，扩展后的架构还涉及了虚拟 TPM (vTPM) 的使用。这是因为多路复用的物理 TPM 无法扩展到现代基础设施中单个物理节点通常托管的虚拟机数量。这是显而易见的，考虑到\
  \ `TPM_quote` 操作的延迟可能超过 500 毫秒。\n\n`vTPM` 暴露了与传统经典 TPM 相同的接口，但额外允许执行“深度引证”（deep\
  \ quote）。该操作包括将 vTPM 引证的哈希值以及一个 `nonce` 添加到硬件 TPM 引证的 `nonce` 中。深度引证旨在维护一个根植于硬件的信任链。遗憾的是，深度引证受到物理\
  \ TPM 低性能的影响；因此，应谨慎使用。\n\n在多个租户共享同一提供商基础设施的这种场景下，提供商自身应为其基础设施建立一个注册机构（提供商注册机构）以及一个白名单权威机构（提供商白名单权威机构）。前者实现入站协议和物理节点的注册，而后者是提供商基础设施完整性测量的最新签名列表。完整性测量承诺提供商在其整个基础设施中使用特定版本的虚拟化程序（hypervisor）。这显然是一个局限性，但同时也防止了攻击者将管理程序替换为恶意版本。此外，攻击者为了执行攻击，还必须破坏完整性测量的签名过程。\n\
  \n另外两个关键构建块也必须进行扩展：租户注册机构和租户 CV（验证节点）。这些构建块在验证 IaaS 平台完整性的任务中利用了提供商注册机构和提供商白名单权威机构。在这种情况下，租户注册机构和\
  \ CV 都托管在租户的基础设施内部。出于可扩展性考虑，它们应该托管在 IaaS 虚拟机中，因此需要一个租户本地的 CV。\n\n图 26.7 概述了虚拟节点注册协议。该协议演进中的主要问题是，租户注册机构无法验证虚拟\
  \ EK (vEKs)，因为 vTPM 没有制造商。这可以使用深度引证操作来解决。\n\n![图 26.7 虚拟节点注册协议。](img/fig26.7.jpg)\n\
  \n图 26.7 虚拟节点注册协议。\n\n该过程从虚拟节点开始，它将与其 UUID 关联所需的凭据发送到租户注册机构（`ID`、`vAIK[pub]`、`vEK[pub]`）。租户注册机构随后返回\
  \ `AIK[pub]` 的哈希以及使用 `vEK` 加密的 `K[e]`。节点随后解密 `K[e]` 并要求使用 `K[e]` 的哈希作为 `nonce` 进行深度引证，以证明其对密钥的认知。此外，它通过\
  \ vTPM 凭据（`vAIK[pub]`、`vEK[pub]`）的哈希及其 ID 扩展 `PCR #16`，以便将这些数据与深度引证操作绑定。一旦租户注册机构接收到这些数据，它要求提供商注册机构验证\
  \ `AIK` 并返回最新的完整性测量白名单。由于此，租户注册机构可以验证 `H(K[e])`、绑定数据（`vTPM 的 PCR #16` 值）以及由提供商注册机构提供的物理\
  \ TPM 的 PCR 值。\n\n如前所述，深度引证在性能方面是昂贵的操作。无疑，在入站过程中执行深度引证是必要的，但对于周期性认证，深度引证可能重要也可能不重要。这取决于完整性检查的类型（例如加载时、运行时）以及可用的优化技术（例如批处理认证）。\n\
  \n一旦入站协议到位，就可以开始虚拟化软件 CA 的引导。如前所述，这一步对于高级安全服务能够“对信任计算无感知”是至关重要的。要执行此操作，应创建一个私密钥，并使用通过引导密钥派生协议生成的密钥对其进行保护。\n\
  \n### [26.4.2 三方密钥派生协议]\n\n引导密钥派生协议（图 26.8）旨在获取租户与云节点之间的密钥协商约。在此过程中，节点的完整性由云验证器授予。\n\
  \n![图 26.8 引导密钥派生协议。](img/fig26.8.jpg)\n\n图 26.8 引导密钥派生协议。\n\n该协议从租户开始，租户生成一个新的随机对称加密密钥\
  \ `K [b]` 并使用该密钥通过 `AES-GCM` 为节点加密某些敏感数据 `d`。这些数据，例如，可以是节点启动所需的 cloud-init 元数据。\n\
  \nKeylime 想要实现的是利用 CV 检查节点完整性，并依赖提供商管理节点部署。同时，租户不希望与 CV 和提供商共享其密钥 `K[b]`。由于由于，租户将密钥分成两个部分：`U`\
  \ 和 `V`，其中 `U = K[b] ⊕ V`。其中一部分发送给 CV，CV 在完整性检查后将机密传输给节点，另一部分由租户本身直接发送给节点。\n\n然而，还有另一个问题需要解决。事实上，CV\
  \ 和租户都必须在不可信的网络上与节点进行安全通信。这意味着我们需要瞬态密钥对来支持这种交换。请注意，我们正在引导节点，因此不存在预共享密钥。为了完成此密钥生成，Keylime\
  \ 利用云节点来创建密钥对 `NK`，并使用 `PCR #16` 的值将 `NK` 身份绑定到 TPM 身份。\n\n在创建 `K[b]` 之后，租户向服务提供商请求部署资源（即新节点、虚拟机）。租户还发送\
  \ `Enc [K]b` 作为资源创建的元数据。创建完成后，提供商返回节点 UUID 和 IP 地址。\n\n租户现在可以启动协议的 A 阶段（见图 26.8），将\
  \ `ID`、部分 `V`、`IP`、端口和节点的 TPM 策略发送给 CV。云验证器（B 阶段）随后发送一个新的 `nonce[CV]` 以及根据租户定义的\
  \ TPM 策略应包含在 TPM 引证中的 PCR 掩码。节点返回 `NK[pub]` 以及使用 TPM AIK 签引用，包含 `nonce`、带有 `NK[pub]`\
  \ 哈希的 `PCR #16` 以及 PCR 集合（其中 `x[i]` 是 PCR 编号，`y[i]` 是它们的值）。CV 然后通过注册机构验证 `AIK` 并检查完整性测量。如果有效，它将加密后的部分\
  \ `EncNK` 发送给节点。\n\n租户的 C 阶段类似，唯一的区别在于租户不检查完整性，仅检查 TPM 身份的有效性。这是因为 Keylime 的目标是由验证器集中完整性检查。\n\
  \n最后，租户发送 `EncNK` 和 `HMAC[K]b`，以便云节点解密数据 `d` 并继续引导过程。发送 HMAC 仅用于快速验证 `K[b]` 的正确性。\n\
  \n## [26.5 总结]\n\n\n\n\n\n我们已经证明，在云计算系统中对软件环境进行验证是可行的，无论对于仅运行一个操作系统的节点，还是对于作为虚拟机运行多个托管系统的节点都是如此。后者的情况更为复杂，并且仍然产生性能开销；因此，在该领域还需要更多研究。此外，云节点软件状态的定期度量在启动时（静态测量）和运行时（动态测量）都是可行的，但它是基于轮询机制进行的；因此，如果快速攻击在下一次轮询之前完成，就可能会成功。此外，在这种情况下，还需要研究如何使系统能够主动检测自身的更改并向云管理器发送警报以实现快速报警。尽管存在这些悬待解决的问题，但目前在云中使用通用硬件和软件采用信计算技术是可行的，并且极极大增强云基础设施的安全。\n\
