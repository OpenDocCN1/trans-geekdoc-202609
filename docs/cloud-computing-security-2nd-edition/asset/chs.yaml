  \nElectrosoft Services, Inc.\n\n弗吉尼亚州\n\n目录\n\n##11.1 引言\n\n##11.2 背景\n\n##11.3\
  \ 密钥管理生命周期\n\n##11.4 密钥管理系统设计选择\n\n\n\n\n\n# 11.5 云端密钥管理的设计驱动因素\n\n# 11.6 云端密钥管理挑战\n\
  \n# 11.7 云端密钥管理策略\n\n## 11.7.1 最小化待加密数据\n\n## 11.7.2 密文与密钥分离\n\n## 11.7.3 最大化密文与密钥之间的隔离程度\n\
  \n## 11.7.4 建立对加密模块的信任\n\n## 11.7.5 使用密钥拆分技术\n\n# 11.8 总结\n\n# 参考文献\n\n## 11.1 引言\n\
  \n在十年中，公共和私营部门组织以及个人一直在向云端迁移大量数据。尽管由于从根本上说，云计算具有不确定性，这导致其与传统信息技术环境（如数据中心）相比面临独特的安全挑战——这些不确定性源于固有的远程操作、共存的可能性、共享/分布式管理以及行政控制。\n\
  \n加密是保障云操作安全的关键技术。加密的使用意味着使用加密密钥。虽然加密密钥有助于保护数据安全，但密钥本身也需要受到保护，以确保它们不会被未经授权的实体发布或修改，并保持授权实体可访问以便获取数据。加密密钥必须在其整个生命周期内进行管理，以保护其机密性、完整性和可用性——本质上，它们的价值等同于其所保护的所有数据的总价值。因此，管理这些密钥生命周期的可靠技术对于整个加密基础设施的安全至关重要。在本章中，我们将描述加密密钥管理的基础概念、密钥管理系统的设计选择、云系统中密钥管理的挑战，以及在云中实施有效密钥运行的策略。\n\
  \n## 11.2 背景\n\n云环境中存在许多不确定性。通常不知道用户的进程在特定时刻运行在何处，或者用户数据存储在何处。用户的进程可能与其他用户的进程共享一个处理器，或者来自两个用户的数据可能共存在在同一个虚拟存储设备上。通常不清楚谁对云基础设施拥有管理权限，或者谁对特定用户的数据和审计记录拥有访问权限。此外，由于云环境固有的共享性质以及访问共享环境的主体较多，云环境往往会产生更多化的威胁主体和威胁事件。在这个不确定性和威胁的领域，加密是一项本质技术。\n\
  \n非对称（公钥/私钥）密钥和对称密钥都是有用的。在激活期间，云环境中数据的密钥管理包括以下阶段：\n\n* 密钥生成：创建或建立新密钥\n* 密钥分：通过各种方法让其他实体可以使用密钥\n\
  * 密钥使用：将密钥用于加密、解密和消息认证等操作\n* 密钥存储：将密钥保存到存储介质中供当前或未来使用\n* 密钥维护：在生命周期内支持密钥归档、更新和撤销等操作\n\
  * 密钥销毁：终止密钥的应用\n\n本章重点关注数据密钥的有效管理概念和方法。\n\n## 11.3 密钥管理生命周期\n\n加密密钥具有定义良好的生命周期，如图\
  \ 11.1 所示，包含某些内容。这些状态包括：\n\n* 密钥生成：创建或建立新密钥\n* 密钥分：让有需要的其他实体可以使用密钥\n* 密钥使用：将密钥用于适当的安全操作\n\
  * 密钥存储：密钥存储的位置\n* 密钥维护：支持密钥归档、更新和撤销等操作\n* 密钥销毁：终止密钥的应用\n\n密钥可能会被归档以备后用；恢复包括在主副本丢失或损坏时获取密钥替代副本的方法。更新允许密钥在初始激活期之后继续使用。撤销则在激活期间禁用密钥的使用。\n\
  \n对于这些生命周期阶段中的每一个，都有多种选项和决策，这些决策影响密钥的安全以及密钥旨在保护的数据或交易的安全。密钥管理涵盖了维持密钥贯穿每个阶段的所有参数和活动总和。\n\
  \n## 11.4 密钥管理系统设计选择\n\n在为数据加密密钥设计有效的密钥管理系统时，每个阶段都有许多选项和选择：\n\n* 密钥生成：密钥类型（对称/非对称）、算法、密钥强度、密码周期、密钥参数、硬件或软件加密模块、熵源等。\n\
  * 密钥存储：存储在何处、与加密数据的距离、如何保护、访问控制、可审计性等。\n* 密钥分：如何交换、分发和建立、在传输过程中如何保护、如何验证实体身份等。\n\
  * 密钥使用：受保护数据的粒度和量、谁有权访问密钥、用于操作的加密模块、在使用期间和之后如何保护等。\n* 密钥维护：哪些密钥需要恢复、谁需要恢复密钥、速度多快、密钥需要保持可恢复状态多久、如何审计密钥恢复、是否需要多方批准等。\n\
  * 密钥销毁：何时销毁、如何销毁、可审计性等。\n\n\n\n\n\n这些设计选择影响了整个系统的功能、性能和安全性。最佳实践是制定一套密钥管理策略（`KMP`），用于定义密钥管理基础设施的目标，并制定一份密钥管理实践声明（`KMPS`），用于描述为实现\
  \ `KMP` 目标而选择的参数和流程。`KMP`/`KMPS` 需要涵盖关键的密钥生命周期状态以及所有的密钥管理设计选择。\n\n## 11.5 云密钥管理设计的驱动因素\n\
  \n支持云系统内加密数据的密钥管理基础设施的设计选择，应该在该云系统预期的功能、经济、性能、合规性和安全目标背景下做出。见下文描述：\n\n*   功能目标：应用加密保护的系统的核心功能目标是什么？该系统设计用于存储海量数据还是较小块的事务数据？该系统设计为让多个用户或单个用户访问相同的数据吗？该系统支持企业级用户还是公共用户群？系统所支持的数据或服务价值有多高或关键性如何？\n\
  *   经济目标：适用于系统的成本限制有哪些？实施该系统的可用预算有效使用方式是什么？\n*   性能目标：系统的目标性能参数是什么？该系统设计用于高速或海量交易吗？该系统预计会有大量并发用户使用吗？\n\
  *   合规目标：根据其行业领域、所有权和功能，哪些政策、法律和指令适用于系统？这些要求如何影响系统的技术层面以及管理和运营层面？\n*   安全目标：系统的关键性如何？适用的威胁主体和事件有哪些？现有的漏洞有哪些？可接受的风险水平是多少？降低风险以达到可接受水平的方法有哪些？\n\
  \n`Figure 11.2` 显示了一个云系统的示意决策流程图。功能和经济目标可能会驱动适当云模型和服务种类型的选择，包括：\n\n![Figure 11.2\
  \ Decision flow for cloud system design.](img/fig11.2.jpg)\n\n图 11.2 云系统设计的决策流程。\n\
  \n1.  云部署模型：基础设施即服务 (`IaaS`）、平台即服务 (`PaaS`）或软件即服务 (`SaaS`）\n2.  云交付模型：私有云、社区云、公有云或上述模型的混合云\n\
  3.  云服务类型：处理服务或存储服务\n\n一旦选定了云模型，合规和性能目标可能会驱动整个云系统架构的定义。涉及使用一个或多个虚拟机、存储设备、系统功能组件、与其他系统的网络和连接、应用程序编程接口（API）以及图形用户界面的决策。\n\
  \n做出云架构决策的同时，还需要定义云系统的安全架构，这可能由合规和安全目标驱动。技术架构决策包括身份认证、访问控制、加密的使用、审计机制、安全连接的使用以及用于应用程序安全的消息协议和技术。如果系统内部使用了加密，则为系统开发适当的密钥管理策略和实践是至关重要的。\n\
  \n## 11.6 云密钥管理的挑战\n\n密钥管理是任何加密系统中最复杂的组件。然而，在云环境中为加密数据构建密钥管理系统面临着特殊的挑战。其中一些最大的挑战包括：\n\
  \n*   远程用户的身份验证：如前所述，云基础系统的每个用户都是通过共享介质连接到云系统的“远程”用户。为了允许远程用户访问存储在云系统上的加密数据，必须按照与所加密强度相相应的保证级别对用户进行身份验证。否则，用户身份验证将成为链中的薄弱环节，威胁主体可以利用该环节来破坏整个密钥管理系统。\n\
  *   硬件与软件加密：云系统设计旨在实现扩展性、快速部署以及多个云消费者的可能使用。这些属性使得云服务提供商很难提供使用硬件加密模块的加密服务；云系统的常态是使用软件。这对于某些根据法律要求使用硬件加密的云消费者来说可能会产生问题。在这种情况下，必须开发创新的设计解决方案，以在满足法律要求的同时适应云服务产品。\n\
  *   多层特权用户：与托管在组织自有数据中心中的系统不同，云系统构建在可能由不同云服务提供商提供的基础设施和平台服务层之上。每一层云服务都包含特权用户和管理员，此外还有云消费者组织内部的特权用户和管理员。这些多组特权用户为云系统构成了极高的内部威胁。\n\
  *   多租户：许多云系统设计为多租户模式，通过公共的基础设施、平台或应用程序服务支持许多云消费者。这些多个租户的数据和过程通过应用层（针对 `SaaS`）、平台层（针对\
  \ `PaaS`）以及虚拟机管理层（针对 `IaaS`）内部的软件机制进行隔离。\n*   数据和密钥的可用性：加密通常用于敏感和/或关键数据。当此类数据存在于云系统中时，在确保加密数据和相关密钥始终可用方面可能会面临挑战。\n\
  \n设计云密钥管理系统必须充分考虑云系统中存在的这些挑战。\n\n## 11.7 云密钥管理策略\n\n由于云系统固有的安全挑战，可能需要比在私有数据中心更频繁地加密加密技术以保护存储在云中的敏感或关键数据。在本节中，我们将探索一些云密钥管理策略。\n\
  \n### 11.7.1 最小化待加密数据\n\n密钥管理是复杂的，且加密操作计算密集且缓慢。因此，建议进行分析以识别哪些数据值得加密保护，然后优先考虑价值最高或关键性最高数据的加密需求。目标是减少需要通过加密密钥保护的数据集。\n\
  \n### 11.7.2 将密文与密钥分离\n\n由于云消费者对数据或密钥的存储位置以及谁有权访问的控制较少，建议设计一种云加密系统，使得可以使用密钥来解密密文（加密数据）。这种方法在\
  \ `IaaS` 云服务中可能是可能的，但在 `PaaS` 或 `SaaS` 云服务中可能难以或无法。\n\n### 11.7.3 最大化密文与密钥之间的分离\n\
  \n\n\n\n\n\n\n在可能范围内（同时考虑到云系统的功能、经济和性能目标），应该增加云系统中密文与相关密钥之间的分离程度。密文与相关密钥分离的一些可能方案包括：\n\
  \n*   密文和密钥存储在同一云基础设施（`IaaS`）上不同的虚拟虚拟机（`VMs`）中\n*   密文和密钥存储在不同云服务的不同 `VMs`上\n* \
  \  密文存储在云端，密钥存储在云消费者的本地\n*   密文存储在云端，密钥由独立的密钥管理服务管理\n\n### 11.7.4 在加密模块中建立信任#chapter11.xhtml#re_ch-11-sec-11\n\
  \n加密操作在加密模块内执行，该模块可以是基于硬件的或基于软件的。执行加密操作时，数据和密钥在加密模块中都是可用的。因此，云消费者需要建立某种信任，以确保所使用的加密模块不会被轻易破解，导致密钥或敏感数据被恶意第三方获取并使用。这可能意味着在云中使用硬件加密模块（可能的情况下），或使用由云消费者组织或提供此类服务的受信第三方操作的受信加密模块。\n\
  \n### 11.7.5 使用密钥分割技术#chapter11.xhtml#re_ch-11-sec-12\n\n在可能或可用的情况下，可以在云密钥管理系统中使用密钥分割技术，以确保云提供商无法轻松访问用于保护敏感数据的完整密钥。在这些实现中，部分部分密钥可能存储在云系统中，另一部分存储在受信的设备或第三方服务中。只有云消费者有能力将密钥碎片组合在一起，对敏感数据执行加密操作。\n\
  \n## 11.8 总结#chapter11.xhtml#re_ch-11-sec-13\n\n保护云系统内部的敏感和高价值数据需要使用加密技术和加密密钥。由于暴露在各种内部和外部威胁者的风险增加，这些密钥的管理在云环境中特别具有挑战性。有一些常识性的设计选择和策略有助于实施有效安全的密钥管理系统，以保护存储在云端的数据。\n\
  \n## 参考文献#chapter11.xhtml#re_b-9780429619649-bib12\n\n1. 1. Chandramouli, Ramaswamy,\
  \ Iorga, Michaela and Chokhani, Santosh, NISTIR 7956 Cryptographic Key Management\
  \ Issues & Challenges in Cloud Services. NIST, 2013.\n2. 2. Barker, Elaine, et al.,\
  \ NIST DRAFT Special Publication 800-130: A Framework for Designing Cryptographic\
  \ Key Management Systems. NIST, 2012.\n\n# 第 12 章#contents.xhtml#re_chapter12\n\n\
  # 云安全访问控制：分布式访问控制#contents.xhtml#re_chapter12\n\nJim Harmening\nComputer Bits, Inc.\n\
  \n伊利诺伊州，芝加哥\n\nRandall DeVitto\n伊利诺伊州立大学\n伊利诺伊州，奥兰公园\n\n目录\n\n* 12.1 引言#chapter12.xhtml#ch-12-sec-1\n\
