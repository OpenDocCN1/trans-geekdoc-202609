  \ 总结\n## 参考文献\n\n## 15.1 引言\n\n在计算的早期，大型机主导了数据处理时代，直到个人电脑（PC）的出现。大型机和小型机被安置在数据中心内。大型机的计算能力通过通过拨号调制解调器和专用网络连接到大型机的哑终端（dumb\
  \ terminals）来访问。当然，个人电脑的出现将计算范式转变为局域网（LAN），从而最小化了大型机和小型机的作用。在过去的十年里，PC 硬件已经获得了大型机的处理能力，而且网络硬件和软件能够提供更稳健、更可靠的连接。云计算架构的组件是用于交付云计算服务的硬件和软件。此外，这些云计算架构的组件被分为前端平台或云客户端、后端平台（如服务器和存储设备），以及一条连接前端和后端以访问云服务的路径，如[图\
  \ 15.1]所示。这条路径是网络，它可以是公共网络（互联网），也可以是私有网络。网络的作用是提供网络服务。\n\n![图 15.1 云计算架构。](img/fig15.1.jpg)\n\
  \n图 15.1 云计算架构。\n\n## 15.2 云服务特性\n\n云计算服务由云提供者提供，以便云客户能够利用云计算的优势并帮助他们实现目标。云提供者提供各种服务，云服务也可能以不同的方式部署和呈现。云提供者为其客户分配物理资源、逻辑资源或两者（资源的示例包括处理、内存、存储、网络带宽、虚拟机、软件等），但通常情况下，云计算服务具有以下共同特征，如[图\
  \ 15.2]所示：\n\n![图 15.2 云服务特性。](img/fig15.2.jpg)\n\n图 15.2 云服务特性。\n\n1. 客户和用户可以通过互联网等网络轻松访问云服务和资源。\n\
  2. 服务或资源按需可用：客户可以根据自己的需求和要求，随时随地使用资源。\n3. 在某些情况下，可以自动实现高度扩展的资源和服务能力。\n4. 服务是可计量的：分配的资源和服务（如存储、处理、内存等）的使用可以被控制、测量、管理和报告，以便客户和提供者都能清晰地查看使用情况。\n\
  \n## 15.3 云客户端\n\n云客户端有几种类型，但通常云客户端是一个计算平台。云客户端根据硬件或软件进行描述；在下文中，将检查硬件和软件类型。\n\n\
  ### 15.3.1 硬件客户端\n\n硬件客户端是指根据硬件区分的云客户端。硬件客户端有三种，如图 15.3 所示：\n\n![图 15.3 硬件客户端。](img/fig15.3.jpg)\n\
  \n图 15.3 硬件客户端。\n\n1. 厚客户端 (Thick clients)\n2. 瘦客户端 (Thin clients)\n3. 智能手机\n\n\
  ### 15.3.1.1 厚客户端\n\n厚客户端是指在客户端/服务器模型中执行大量数据处理的计算平台。厚客户端具有多个接口、内部内存、输入和输出设备（如 PC）。对于厚客户端，服务器和客户端之间不需要持续通信。大多数可用的云服务都是为厚客户端设计的，例如\
  \ `Microsoft Live` 和 `Elastic Compute Cloud (EC2)`。\n\n### 15.3.1.2 瘦客户端\n\n瘦客户端通常不是为大型处理设计的终端，它将海量数据的处理职责留给服务器。瘦客户端是不带硬盘驱动器的网络计算机，作为与服务器持续通信的终端。瘦客户端应用程序适用于终端用户对系统有特定任务需求的环境，例如学校、政府、制造工厂等。\n\
  \n#### 15.3.1.3 智能手机\n\n在过去的 5 年里，我们看到基于 `iOS` 和 `Android` 操作系统的移动设备处理能力已达到笔记本电脑和桌面\
  \ PC 相同的的服务水平。此类移动设备支持 `Wi-Fi` 和 `LTE` 连接，因此漫游客户端可以访问任何基于的服务。。，当漫游客户端访问投资组合管理、电子银行交易和社交网络时，安全性是一个关键问题。在未来几年内，随着设备屏幕尺寸变大，移动设备将取代\
  \ PC，从而实现全屏视图。\n\n### 15.3.2 软件客户端\n\n软件客户端是指根据软件操作区分的云客户端；例如，某些云应用程序在运行时需要互联网连接，而其他云应用程序虽然可以离线运行，但功能有限。软件客户端有三种，如图\
  \ 15.4 所示：\n\n![图 15.4 软件客户端。](img/fig15.4.jpg)\n\n图 15.4 软件客户端。\n\n1. 富客户端或丰富客户端\
  \ (Fat or rich clients)\n2. Web 客户端（有时也称为瘦客户端）\n3. 智能客户端\n\n#### 15.3.2.1 富客户端或丰富客户端\n\
  \n\n\n\n胖客户端（Fat clients）指的是可以在线运行但也可以离线运行且功能有限的应用程序，例如 iTunes。这类应用程序必须安装在终端用户的设备上。图\
  \ 15.5 显示了 iTunes 程序的截图。用户可以在离线模式下听音乐或看视频，而在线模式提供收听广播或下载歌曲等其他功能。\n\n![图 15.5 胖客户端或富客户端。](img/fig15.5.jpg)\n\
  \n图 15.5 胖客户端或富客户端。\n\n#### 15.3.2.2 瘦客户端或 Web 应用\n\n瘦客户端（thin client）术语通常指软件客户端，指的是用户无需安装且通常运行在网络浏览器上的应用程序。在数据处理早期，瘦客户端仅是具有原始功能的终端，例如存储密码的能力和连接大型主机的连接性。随着\
  \ PC 的日益普及，瘦客户端通过配置最小的 PC 得到了支持。在 20 世纪 90 年代中期，瘦客户端用于通过广域网（WAN）如 T1 和帧中继电路连接到当时的云计算服务提供商。\n\
  \n#### 15.3.2.3 智能客户端\n\n智能客户端（Smart clients）的应用程序可以将大部分数据保留在网上，但同时也利用 PC 的处理能力和其他资源来确保改进用户体验。云客户端软件的使用有三种类型：\n\
  \n1. 1\\. 基于 Web 的客户端：通过浏览器访问资源\n2. 2\\. 客户端应用程序：通过应用程序访问云资源\n3. 3\\. 带有云扩展的应用程序：某些桌面应用程序具有可选的云端扩展\n\
  \n## ## 15.4 后端平台\n\n云提供商拥有为客户最常用的存储服务和软件提供云所需的基础设施。云提供商使用各种技术和平台来确保服务的交付，此类平台的示例包括云存储和服务器。云存储提供存储服务，而云服务器运行客户的应用程序。\n\
  \n### ### 15.4.1 云存储\n\n云存储是一种将数字数据存储在逻辑池中的模型；物理存储可能跨越多个服务器，通常位于多个位置。物理环境通常由托管公司管理和拥有。存储提供商负责数据的可用性和可访问性，此外还要保持物理环境的安全和运行。\n\
  \n云存储基于高度虚拟化的基础设施，通常指的是托管的对象存储服务，但该术语已扩大到包括其他现在作为服务提供的数据存储类型，例如块存储。云存储的某些优势：\n\n\
  1. 1\\. 公司只需为实际使用的存储付费，但这并不一定意味着云存储更便宜。\n2. 2\\. 存储维护任务被交给了服务提供商。\n3. 3\\. 云存储为用户提供了对广泛资源的即访问。\n\
  4. 4\\. 云存储可以作为自然灾备备份。\n\n云存储的某些潜在担忧：\n\n1. 1\\. 安全问题和数据丢失。\n2. 2\\. 云存储提供商公司可能由于财务损失或市场状况多变而消失。\n\
  3. 3\\. 外包存储的性能取决于电信提供商为其基于铜或光纤电路的 WAN 链路提供的价格性能、可靠性和服务质量（QoS）。\n4. 4\\. 允许文件共享的网站可能导致盗版和版权侵权。\n\
  \n### ### 15.4.2 云服务器\n\n云服务器是通过云计算平台通过公共（互联网）或私有网络托管的逻辑服务器。云服务器提供与本地服务器相同的服务质量，只是它们是从云服务提供商远程访问的。在云服务模块中，云服务器被视为基础设施即服务（IaaS）。云服务器有两种类型：\n\
  \n1. 1\\. 逻辑云服务器：逻辑或虚拟云服务器被定义为云服务提供商作为服务销售的虚拟机。虚拟机是机器（如计算机）的软件实现，它们有自己的操作系统（OS）并像物理机一样执行程序。在云环境中，现有的物理硬件可以被划分为有限数量的虚拟机，并分配给客户或一个客户。这导致了计算资源的高效消耗。各种类型的虚拟机操作系统可能在同一台硬件上共存，但需要虚拟隔离来组织操作系统的操作。\n\
  2. 在这种交付模型中，物理服务器在逻辑上分布到两个或多个逻辑服务器上，每个逻辑服务器都有自己独立的操作系统、用户界面和应用程序，尽管它们共享同一台物理服务器。\n\
  3. 2\\. 物理服务器：这些也通过互联网远程访问，但它们不共享或分布。这通常被称为专用云服务器。\n\n## ## 15.5 交付模型\n\n云计算提供商根据三种基本模型提供其服务\
  \ [[[2]，如图 15.6\n\n图 15.6 云计算模型。\n\n1. 1\\. 基础设施即服务 (IaaS)\n2. 2\\. 平台即服务 (PaaS)\n\
  3. 3\\. 软件即服务 (SaaS)\n\n### ### 15.5.1 基础设施即服务\n\nIaaS 被认为是最基本的云服务模型，根据 IETF（互联网工程任务组），`IaaS`\
  \ 的提供者提供计算机——物理机或（更常见的）虚拟机以及其他资源。在 `IaaS` 模型中，可以为客户提供如主机硬件、软件、服务器、存储和其他基础设施组件等资源。\n\
  \n提供 `IaaS` 的云提供商提供按需且高度可扩展的资源，这使得 `IaaS` 适用于临时、实验性或意外变化的工作负载。此外，`IaaS` 可以是某些没有资金投资硬件或其他资源的组织，或正经历快速增长且扩展硬件具有挑战性的公司的良好解决方案。如今，许多公司倾向于外包服务器、软件、数据中心等，而不是购买资源并获得完全按需的服务。\n\
  \n虽然 `IaaS` 提供商为某些公司和组织提供了显著优势，但在某些情况下，其局限性可能会对业务产生问题，例如对于高性能至关重要的业务，或者合规性使得数据存储或处理难以外包。一些流行的\
  \ `IaaS` 提供商示例包括 Amazon Web Services、IBM SmartCloud Enterprise、Rackspace Open Cloud、Windows\
  \ Azure 和 Google Compute Engine。\n\n### ### 15.5.2 平台即服务\n\n\n\n\n\n在 PaaS 模型中，云提供者交付计算平台，这些平台通常包含\
  \ `OS`、编程语言执行环境、数据库和 Web 服务器。某些 PaaS 提供者为客户提供可扩展的资源，底层计算机和存储资源会根据应用程序的需求和需求自动伸缩，因此云客户端无需手动分配资源。PaaS\
  \ 提供者通常提供一种计算平台，允许快速高效地创建 Web 应用程序，使客户能够避免购买和维护任务所需的软件和基础设施的复杂性。PaaS 与 SaaS 相似，不同之处在于它不是通过网络交付软件，而是通过网络交付用于创建软件的平台。PaaS\
  \ 的基本特性通常包括以下内容：\n\n*   在集成开发环境中创建、测试、部署、托管和维护应用程序的各种服务。\n*   某些 PaaS 提供多租户架构，允许多个并发用户使用同一个开发应用程序。\n\
  *   某些 PaaS 平台支持团队协作开发。\n*   许多 PaaS 平台提供处理计费和订阅管理的工具。\n\n在多个开发人员共同从事一个开发项目，或者其他外部需要与该开发项目交互的情况下，PaaS\
  \ 被认为是最用的。此外，当开发者打算自动化测试和部署服务时，PaaS 同样有用。\n\n在某些情况下，PaaS 可能不是最佳解决方案；例如，专用语言会影响或阻碍后期迁移到其他提供者的情况，或者应用程序性能需要自定义底层软件和/硬件的情况。常见的\
  \ PaaS 提供者示例包括 Microsoft Azure Services、Google App Engine 和 Force.com 平台。\n\n##\
  \ 15.5.3 软件即服务\n\nSaaS 是交付为特定目的设计的业务应用程序，其中云提供者管理运行这些应用程序的基础设施和平台。SaaS 有两种不同的模式：\n\
  \n1.  简单多租户：每个客户都有自己的独立资源，运行在一个或多个计算平台上。\n2.  细粒度多租户：客户资源也被隔离，但方式更加有效。所有客户的资源是共享，但数据和访问权限在应用程序内部分开。\n\
  \n这里我们列出了 SaaS 的一些共同特性。Google Apps、Cisco WebEx 和 Salesforce 这些共同特性或共享某些特性：\n\n*\
  \   提供商业软件的 Web 访问。\n*   由中心位置负责管理软件。\n*   用户无需处理软件升级和补丁。\n\n## 15.6 云服务的部署\n\n\
  根据客户的需求和要求，云基础设施和服务可能会以不同的方式运行或部署，因为某些云客户对其敏感数据有安全和隐私担忧。出于安全考虑，他们宁愿不与其他客户共享云资源（这可能会产生更高成本），或者其他客户对廉价的解决方案感兴趣。云客户端云服务有五种主要的架构部署，如图\
  \ 15.7 所示。\n\n![图 15.7 云部署模型。](img/fig15.7.jpg)\n\n图 15.7 云部署模型。\n\n### 15.6.1 公有云\n\
  \n这种部署类型根据某种服务水平协议向公众提供云服务。该模型被许多消费者认为是最广知的云计算模型之一，云服务在虚拟化环境中提供，物理资源在许多用户之间共享，并可以通过公共网络访问。公云通常使用相同的共享基础设施为多个客户端提供服务。公云模型具有以下特征和优点。图\
  \ 15.8 展示了公云模型的部署。\n\n![图 15.8 公有云。](img/fig15.8.jpg)\n\n图 15.8 公有云。\n\n*   高度可扩展的资源，因为云资源按需可用\n\
  *   云服务和资源的高可用性\n*   降低成本\n*   灵活的服务\n*   与位置无关的服务访问\n\n### 15.6.2 私有云\n\n这种部署类型基本上赋予了组织创建远程数据中心的能力。从安全角度来看，该模型通常提供最高级别的控制。私有云是一种云计算架构，提供与公有云模型类似的服务（如可扩展性和灵活性），但与向多个组织提供服务的公有云不同，私有云专供单一组织使用，如图\
  \ 15.9 所示。\n\n![图 15.9 私有云。](img/fig15.9.jpg)\n\n图 15.9 私有云。\n\n公有云和私有云部署模型是不同的，因为公云在许多用户或企业之间共享计算基础设施。然而，这些共享资源并不适用于所有企业，例如具有关键任务业务、安全考量、可用性或管理要求的企业。相反，这些企业可以将其现有数据中心的一部分作为本地或私有云进行配置。\n\
  \n### 15.6.3 虚拟私有云\n\n分类为虚拟的私有云由按需共享的计算资源组成，这些资源可以分配给公云环境内的客户，如图 15.10 所示。不同组织和使用资源的客户之间存在某种程度的隔离。这种部署利用虚拟私有网络（`VPN`）与云提供者的网络建立安全连接。虚拟私有网络在互联网上提供安全的数据传输；它们还确保每个客户的数据在传输过程中和云提供者网络中都与其他客户的数据保持隔离。这是通过使用安全策略以及以下某些或全部过程实现的：加密、隧道技术，或者可能为每个客户提供专用的虚拟局域网（`VLAN`）或私有\
  \ IP 地址。\n\n![图 15.10 虚拟私有云。](img/fig15.10.jpg)\n\n图 15.10 虚拟私有云。\n\n### 15.6.4\
  \ 社区云\n\n这种云部署模型为有限数量的组织提供云计算解决方案，通常由所有参与方或第三方托管服务提供商共同管理和安全保护，如图 15.11 所示。通常，这种部署类型包括具有相似需求和/或策略的特定组织，可以从相同的基础设施中受益，或者正在进行需要中心计算设施的联合项目、研究或应用的组织。社区云可以被视为私有云的混合模型。\n\
  \n![图 15.11 社区云。](img/fig15.11.jpg)\n\n图 15.11 社区云。\n\n### 15.6.5 混合云\n\n混合云模型由公有云和私有云资源组成，其中公有云和私有云基础设施独立运行，通常通过加密连接进行通信，如图\
  \ 15.12 所示。重要的是，公有云和私有云是不同且独立的元素。\n\n\n\n\n\n![图 15.12 混合云。](img/fig15.12.jpg)\n\
  \n图 15.12 混合云。\n\n通常，组织会将关键或重要数据存储在私有云中，而公云可以使用私有云获取应用程序赖的计算资源，这增强了安全性并将数据暴露降低到接受的范围内。混合云具有许多优点并提供了许多解决方案，因为这种部署模型适用于在故障转移发生时创建备份、平衡重量负载，并且根据具体情况，比私有云和其他云更具成本效益。图\
  \ 15.12 展示了云端部署模型的分类。\n\n## 15.7 云客户\n\n云计算服务提供商为不同类型的客户提供服务。云客户可能是小型企业、中型企业、大型企业，或者只是为了个人目的受益于云服务的个人。无论客户的类型和目标如何，客户必须向云服务提供商指定其服务或服务需求，例如存储需求、`CPU`\
  \ 时间、内存需求、可用平台和应用程序。\n\n### 15.7.1 云存储需求\n\n云存储提供商根据客户的需求提供广泛的可用存储空间。客户可能只需要几 GB\
  \ 的存储空间，也可能需要数千 TB 的存储空间，并支付月费或年费。\n\n云存储提供商可能会提供影响客户选择提供商的额外服务和功能。例如，某些提供商提供灵活的存储计划且对存储容量没有限制，但其他因素可能会影响客户的决策。例如，数据访问的灵活性如何，某些云存储提供商公司提供智能手机访问云服务；这对于需要员工通过不同技术访问服务的业务来说，可能是一个重要因素。\n\
  \n### 15.7.2 云 OS 需求\n\n云 `OS` 是一种设计在云计算环境中运行的 `OS`。云 `OS` 的示例包括 `Ubuntu Linux`\
  \ 操作系统和 `Microsoft Windows` 操作系统。\n\n某些客户要求云 `OS` 在特定的计算环境中运行，另一些客户可能选择提供预装服务和应用程序的云\
  \ `OS`。通常情况下，云 `OS` 需要安全且高效地运行硬件和软件资源，以确保服务的最佳交付。\n\n基于浏览器的云 `OS` 是仅通过 浏览器访问的 `OS`。这使得只要设备包含网络浏览器（如智能手机），就可以在许多类型的设备上运行特定的\
  \ `OS`。基于浏览器的云 `OS` 被视为 `SaaS`，因为基于浏览器的云 `OS` 是作为云客户端的 `OS` 的软件部署。`OSs` 和基于浏览器的云\
  \ `OSs` 经常互相混淆。图 15.13 给出了基于浏览器的云 `OS` (`CloudMe`) 的一个示例。\n\n![图 15.13 基于浏览器的操作系统。](img/fig15.13.jpg)\n\
  \n图 15.13 基于浏览器的操作系统。\n\n某些客户要求基于浏览器的 `OS` 提供可管理的系统，以便根据每个用户或组提供权限和服务；另一些客户可能要求基于浏览器的\
  \ `OS` 为系统用户提供应用程序、实用程序或 `VoIP` 服务。\n\n### 15.7.3 内存需求\n\n高效的内存管理被认为是云计算中最重要的主题之一，其中需要按需分配资源以确保高效利用云服务。内存必须在需要时可用，且不会因被分配但未使用而被浪费。亚马逊的\
  \ `EC2` 被认为是云的高效实现之一，`EC2` 云仅按需分配资源。存在许多内存管理技术，可以控制甚至多个虚拟机之间的资源共享，例如虚拟交换空间管理机制 (`VSMM`)。\n\
  \n### 15.7.4 CPU 需求\n\n当客户计划采用云技术时，必须由客户指定所需的 `CPU` 功率。比较现代系统的 `CPU` 功率可能是挑战性的，因此某些云服务提供商提供标准的\
  \ `CPU` 单位，每个 `CPU` 单位等于 `1 GHz` `CPU` 的处理能力。例如，一个拥有四个核心、运行频率为 `2 GHz` 的四核 `CPUs`\
  \ 系统将拥有 32 个 `CPU` 单位。标准的 `CPU` 单位可以帮助客户准确地规划资源分配和容量。云服务提供商通常根据 `CPU` 时间或使用量向客户收费。\n\
  \n### 15.7.5 软件需求\n\n云管理软件实现了资源的优化利用及其与用户、服务之间的相互作用。云管理软件是设计用于监控和操作云环境中应用程序、服务和数据的软件。\n\
  \n## 15.8 云计算的优缺点\n\n云客户必须仔细考虑采用云计算服务的决策。云计算提供了几个非常有吸引力的选项，但尽管云解决方案在如今许多公司中非常流行，这些选项并不总是对客户有利或适用。云服务对某些业务可能是非常有用有效的解决方案，但对其他业务可能不是，因此在做出决定之前理解云计算的优缺点至关重要。接下来我们列出优点，然后是缺点：\n\
  \n1. 云解决方案如果应用得，通常可以降低运营成本并非常有成本效益。\n2. 云计算可以减少云客户的支持和硬件需求。\n3. 云计算提供了移动性，用户可以在任何地方访问服务和资源。\n\
  4. 云计算支持组织之间的协作。\n5. 云计算可以为灾难恢复和备份计划提供优秀的解决方案。\n6. 云计算提供了高度可扩展的动态资源。\n7. 云计算存在许多安全漏洞。\n\
  8. 采用云解决方案的组织必须拥有可靠连接来正常交付云服务，在许多情况下，组织无法承受长时间停机。\n9. 某些云提供商可能会停止存在。\n10. 某些云提供商可能会出现隐私、数据位置和合规性问题。\n\
  11. 组织技术与云提供商技术之间可能会出现兼容性问题。\n\n## 15.9 云计算的安全风险\n\n云计算面临若干安全风险。以下风险是由云安全联盟 (`CSA`)\
  \ 提出的，它是一个为了定义云计算安全指南参数而建立的非营利组织 [3]:\n\n1. 数据泄露：攻击者可能会利用客户设计不当的数据库获取每个客户的数据。\n\
  2. 数据丢失：多种问题可能导致数据丢失，例如攻击者、疏忽的服务提供商或灾难。\n3. 账户或流量劫持：攻击者在该领域实现许多恶意行为，一些示例如下：\n  \
  \  a. 获取客户凭据\n    b. 操纵数据\n    c. 将客户端重定向到非法网站\n    d. 将客户账户作为发起其他后续攻击的新基地\n\n\n\
  \n\n\n## 4. 不安全的接口和 API：IT 管理员依赖接口进行云管理和监控。API 对于通用云服务的安全性和可用性至关重要。因此，在许多情况下，第三方和组织会在这些接口的基础上构建，并注入广告服务或其他。\n\
  \n## 5. 拒绝服务 (DoS) 攻击：DoS 攻击可能会导致一个或多个服务的可用性问题。DoS 攻击会导致服务商失去客户，并给客户带来巨大损失。\n\n\
  ## 6. 恶意内部人员：这可能指云服务提供商的员工或带有恶目的承包，他们可能会对客户和云服务提供商造成损害。\n\n## 7. 云滥用：有很多关于云滥用的例子：\n\
  \n1. a. 客户使用云服务来破解在标准计算机上难以破解的加密密钥\n2. b. 客户计划发起 `(DoS)` 攻击、传播恶意软件或进行任何非法活动\n\n\
  ## 8. 组织在不了解相关风险的情况下采用云技术：在采用云服务之前，组织必须理解并识别云计算的安全性风险，并对组织是否应该利用云计算技术做出合理决策。这应该包括如何通过云计算获得最佳收益，以及必须采取哪些安全预防。\n\
  \n## 9. 共享技术漏洞：这种威胁存在于云服务提供商的所有交付模型中，受攻击的组件（如软件、平台或基础设施）可能会影响整个环境。\n\n云计算涉及更多的安全风险；上述提到的安全风险只是最常见的。其他与数据所有权、共享访问、隔离失败和虚拟漏洞相关的安全风险也存在。\n\
  \n## 15.10 安全预防\n\n尽管存在各种重大的安全风险，但不应阻止云计算客户采用其极具吸引力的优势。应该考虑安全风险并采取预防措施。云计算已成为一个价值数十亿美元的行业，大多数公司、组织和合作社已经采用了云计算服务和利益\
  \ [4, 5, ]。客户必须理解，不存在完全安全的网络，但云计算的安全风险可以通过缓解来达到良好的安全水平。客户可以采取以下步骤：\n\n1. 识别迁移到云的风险\n\
  2. 建立良好的合规、隐私和安全策略，并确保所有相关方执行这些策略\n3. 识别客户和云提供商双方的安全责任\n4. 确保提供运营服务的审计\n5. 评估云提供商的安全措施\n\
  6. 确保对数据和服务进行适当保护\n7. 理解与终止云提供商业务关系相关的安全措施\n\n## 15.11 总结\n\n云计算对公司来说是一个非常有吸引力的解决方案，提供了许多优势和方案，并被企业广泛采用。它提供了效率和成本效益优势，从而使企业能够专注于核心功能。当然，企业必须在数据中心和信息技术方面进行最少的资本投资。云计算已成长为数十亿美元的行业，预计将继续增长，但存在担忧，最主要的担忧是安全。云供应商已开始解决客户的安全担忧，但我们理解安全对于任何服务提供商来说都是一个动态且不断发展的特征。\n\
  \n## 参考文献\n\n1. 1. M. Hofer and G. Howanitz, The Client Side of Cloud Computing,\
  \ University of Salzbrg, Austria. Available at [`www.uni-salzburg.at/fileadmin/multimedia/SRC/docs/teaching/SS09/SaI/Hoefer_Howanitz_Paper.pdf,`](http://www.uni-salzburg.at)\
  \ 2009.\n2. 2. B. Hayes, Cloud computing, Communications of ACM, 51(7), 9–11, 2008.\n\
  3. 3. T. Samson, 9 Top Threats to Cloud Computing Security, InfoWorld Tech Watch,\
  \ InfoWorld Inc., Framingham, MA. Available at [`www.infoworld.com/-article/2613560/cloud-security/9-top-threats-to-cloud-computing-security.html?page=2,`](http://www.infoworld.com)\
  \ 2015.\n4. 4. J. P. Durbano, D. Rustvold, G. Saylor, and J. Studarus, Securing\
  \ the Cloud, Cloud Computing, edited by Antonoupolos, N. and Gillam, L., pp. 289–302,\
  \ Springer, London, UK, 2010.\n5. 5. K. Trivedi, and K. Pasley, Cloud Security,\
  \ Cisco Press, Indianapolis, IN, 2012.\n\n\n\n\n\n正如数据中心既是支持业务数据处理需求的业务构建，也是技术构建一样，云在某种意义上更像是一个业务构建，因为云的安全和隐私很大或少程度上由云服务提供者处理。公共云计算服务的用户不再拥有基础设施；因此，数据安全必须由云服务提供者管理。这是一种范式的转移，要求对隐私和安全的治理进行重新定义。这并不意味着云服务的消费者不需要对他们的数据隐私和安全负责，而是他们应该与云服务提供者签订服务水平协议（`SLA`），并确定符合其运营所在州法律的适当安全水平。风险管理必须考虑不同云部署模型的特定威胁，并制定解决方案来减轻这些威胁。与非云部署模型相比，云部署模型中的数据机密性、完整性和可用性更容易受到风险影响。安全的云计算架构必须具有可扩展性，以应对所有内部和外部威胁以及自然灾害。在本章中，我们将讨论公共云中隐私和安全的范围和本质，即：云有多安全（见图\
  \ 16.2）。）。\n\n![图 16.2 云有多安全？](img/fig16.2)\n\n图 16.2 云有多安全？\n\n## 16.2 云安全概况\n\n\
  接下来，我们列出了与云计算部署相关的安全风险。这些风险必须由服务提供者处理，并在 `SLA` 中说明。客户必须理解这些风险的全部影响，因为向客户提供服务的服务提供者被要求保护其客户的数据：\n\
  \n1.  治理：由于计算基础设施不由消费者管理，隐私和安全的治理要松散得多，但必须符合当地的州法律和联邦法规。\n2.  治理的模糊性：云服务提供者必须处理其所有消费者的隐私和安全需求，这些消费者在“什么构成最低治理”的要求上可能存在不同。\n\
  3.  监管合规性：云计算的消费者必须对存储在服务设施中的客户数据提供保护，这反过来要求服务提供者根据每个州获得适当的认证。\n4.  安全事件：安全泄露的检测、报告和管理必须透明，并立即报告给云计算消费者。\n\
  5.  数据保护：云计算服务提供者必须确保任务关键数据免受损坏或未经授权的访问，并提供全面的数据备份程序，以避免在在与云提供商之间传输过程中的数据机密性和完整性受损（中间人攻击）。\n\
  6.  数据删除：与消费者终止 `SLA` 时必须明确要求将消费者数据从存储介质中完全且不可恢复地删除。如果数据在二级市场被出售，这种情况将产生法律影响。\n\
  7.  业务失败：云服务提供者可能会申请破产，从而无法继续为客户提供资源访问，这将对消费者产生不利影响。\n8.  服务中断：网络服务提供者是云计算的骨干，他们提供了云消费者之间的连接性。\n\
  \n## 16.3 云管理概述\n\n云消费者面临的安全和隐私问题要求他们评估云环境中的风险及其管理；当然，云计算提供的最核心收益是降低业务成本。\n\n###\
  \ 16.3.1 治理与全面风险分析\n\n大多数企业都建立了良好的安全目标、策略和策略，这些策略与合规性要求一致，以保护其知识产权和客户数据。许多安全组件都会发挥作用，但四个关键组件如\
  \ `Figure 16.3`（chapter16.xhtml）所示。数据和数据传输必须通过安全通道进行。应用程序和存储安全都必须由云服务提供者维护。\n\n\
  ![图 16.3 安全组件。](img/fig16.3.jpg)\n\n图 16.3 安全组件。\n\n`Figure 16.4`（chapter16.xhtml）说明了安全代理起的作用，安全代理是云服务提供者和云客户之间的中间件。安全代理将代表云服务提供者和云客户采取。云审计员也可以提供审计服务。公共云计算客户可能需要安全代理的服务，安全代理还可以担任法律顾问来解释\
  \ `SLA`。\n\n![图 16.4 安全代理。](img/fig16.4.jpg)\n\n图 16.4 安全代理。\n\n安全策略框架是基于风险分析预测及其资产受损时对业务收入的影响设计的。云计算的安全和隐私需求与传统\
  \ IT 环境不同，但两者的共同点是安全泄露对公司资产的影响。在云计算中，安全泄露不仅会影响一个云计算客户，其影响可能是深远的，因为其他客户的安全也可能被破坏。因此，安全控制策略框架必须考虑对多个客户的支持。云客户必须了解他们所面临的风险，因此他们除了云服务提供者提供的控制之外，还需要实施自己的安全控制，因为并非所有云客户都对基础设施、软件和平台即服务的需求相同水平的服务。作为通用治理的一部分，如果安全泄露是因为服务提供者的故意行为或疏忽而导致的，云服务提供者必须向其客户赔偿。大多数公共云服务提供者拥有跨越地缘政治边界的多个数据中心，企业在注册云服务时需要考虑这一点；`Figure\
  \ 16.5`（chapter16.xhtml）展示了一个云客户尝试访问云提供者数据中心之间分布式数据的案例。在这种情况下，每个数据中心的数据都受其所在地国家法规和法律的约束，这引发了关于数据在这些国家或在传输过程中如何处理的安全担忧。这至关重要，因为隐私法在地缘政治边界之间并不统一，如果资产受损，可能会产生深远的影响。公认的信息安全合规国际标准是\
  \ `ISO/IEC 27001`。ISO 目前正在开发新标准，请参见 `ISO/IEC 27017 Security in Cloud Computing`。\n\
  \n![图 16.5 治理与全面风险分析。](img/fig16.5.jpg)\n\n图 16.5 治理与全面风险分析。\n\n### 16.3.2 审计与报告\n\
  \n云服务提供者必须定期生成其服务的审计报告，并按照 `SLA` 的规定与客户共享。审计报告应列出客户关于所有数据处理和数据存储访问活动的日志，包括任何明显的异常活动。\n\
  \n\n\n\n\n频繁的安全违规事件意味着服务提供商现在被强制要求执行合规性条例。当然，并不是每个州都拥有相同的合规条例，这可能对消费者产生重大影响。审计报告还必须额外指定以下内容由服务提供商实施和管理：\n\
  \n1. 风险评估矩阵的概述应确保消费者数据的完整性，即使这些数据可能存储在相同的物理介质上。其目的是确保一个云客户不会在无意中访问其他云客户的数据——隐私保护在公有云计算中具有至关重要的价值。\n\
  2. 已实施的安全控制不应被视为静态配置，而应具有可扩展性的设计和控制，这样当发现违规时，可以采取适当措施修复该设计。\n3. 安全意识计划通常不被视为信息安全的关键组成部分。人因素是安全设计和控制中最薄弱的环节。云计算服务人员必须定期接受安全意识计划培训，以强调如果不优先考虑消费者数据的保护，可能会遭受的损害。\n\
  \n### 16.3.3 数据信息的妥当保护\n\n任何类型的消费者数据（如结构化或非结构化数据），以及以任何格式（加密或未加密）存储在介质上的数据，都是任何企业的命脉。当然，当一家公司决定订阅云计算实体的服务时，它必须意识到其数据面临的风险。公司可能决定只将非关键数据迁移到云端，并将关键数据维护在本地\
  \ IT 基础设施中，从而降低风险因素。随着时间的推移，公司可能会发现这种数据划分并不实际，因此决定将所有企业数据都迁移到云端。云计算服务提供商可能有一项策略，将客户数据分布在他们的多个数据中心。云计算的本质是通过分布来克服单点故障，因此消费者可以\
  \ 24/7 访问其数据。云计算扩大了安全范围，涵盖静态数据和沿网络传输的数据流量，因此公司必须对其数据资产进行审计。\n\n数据（结构化和非结构化数据）应分类为数据集，每个数据集对应某些定义的函数，这些函数代表了与公司内部不同部门相关的业务流程。每个部门对这些业务流程（以及对数据集）拥有某些处理权限。在这里，我们需要使用分配给每个业务流程（以及每个数据集）的某种反射算法来定义安全权限；首席信息官\
  \ (`CIO`) 对所有数据集拥有最高级别的权限。反射算法还可以在访问管理下，识别出对数据集具有共同访问权限（包含）的部门以及具有排他访问权限的部门。因此，现在使用反射算法定义安全策略，并实施安全控制。下一步是建立业务流程的监控。\n\
  \n定义的安全策略和实施的控制应确保数据集的隐私性与当地合规条例一致（[图 16.6]）。当然，云计算服务提供商也必须建立安全控制来保护其消费者的数据集。消费者必须对哪些数据集应该加密做出决定。这一决定将取决于数据的性质以及访问频率。使用当前的加密算法，数据必须在处理时即时解密，从而增加了业务成本因素中的成本和延迟。\n\
  \n![图 16.6 公有云的参考架构](img/fig16.6.jpg)\n\n图 16.6 公有云的参考架构。\n\n### 16.3.4 云网络的安全方面\n\
  \n任何向客户提供服务的 ISP（互联网服务提供商）也受到黑客和其他形式的拒绝服务 (`DoS`) 攻击。因此，ISP 必须安装入侵检测系统 (`IDS`) 和入侵预防系统\
  \ (`IPS`) 来监控网络流量，并在检测到入侵时采取适当行动。类似于 ISP 暴露于恶意网络流量的风险，任何云服务提供商也面临相同水平的风险。因此，云服务提供商也需要安装\
  \ `IDS` 和 `IPS` 以提供网络边界安全措施，从而检测任何恶意网络流量。云计算资源的逻辑网络设计必须考虑一个连接互联网的前端路由器，用于为消费者提供服务。路由器的后端将连接到边界防火墙，该防火墙将支持一个军事化区\
  \ (`DMZ`)。此 `DMZ` 将支持基于 Web 的服务、电子邮件和外部服务的域名服务器。边界防火墙将为 `DMZ` 中的服务提供某种访问的控制和保护。边界防火墙的后端将连接到内部防火墙，所有的云计算资源将放置在其后面，如\
  \ [图 16.7] 所示。\n\n![图 16.7 服务提供者的逻辑网络设计](img/fig16.7.jpg)\n\n图 16.7 服务提供者的逻辑网络设计。\n\
  \n这些资源将配置在多个分段网络中。每个分段都可能被配置为虚拟局域网 (`VLANs`)，以提供资源免受未经授权访问的进一步保护，并确保消费者之间某种程度的隐私，如\
  \ [图 16.8] 所示。\n\n![图 16.8 数据中心网络分段](img/fig16.8.jpg)\n\n图 16.8 数据中心网络分段。\n\n考虑到这些，必须策略性地放置和配置以下网络控制以保护资源。网络流量必须记录以满足州法律要求的治理和合规性。由此生成的报告应定期提供给客户。\n\
  \n* 前端路由器应根据访问控制参数（如网络/IP 地址、端口号和协议）配置阻止入站和出站流量。将在互联网的网络层过滤网络流量。\n* 边界路由器应应对入站/出站网络流量添加严格设计的过滤（数据包过滤）。这实现了对\
  \ `DMZ` 中服务器资源所需的访问。\n* 网络资源必须免受 `DoS` 攻击。分布式拒绝服务 (`DDOS`) 攻击将需要额外增加具有适当配置的路由器。\n\
  * 配置为状态检测，它将为每个建立的传输控制协议 (`TCP`) 连接创建条目，以确保每个连接都建立了三次握手，从而防止 `TCP` 会话劫持。配置为应用层网关的将监控定义的允许应用程序。\n\
  * 策略性部署的 `IDS` 和 `IPS` 组合将允许深层数据包检查，以识别恶意数据包，如蠕虫、木马和病毒。基于主机的 `IDS/IPS` 将防止修改资源。基于网络的\
  \ `IDS/IPS` 将使用签名和异常检测。\n\n\n\n\n\n- 向消费者报告事件必须是首要任务，因为消费者对其客户的数据负责——责任范围必须在法律上进行定义。必须清晰地建立事件处理程序，从而最大限度地减少其对服务可用性停机时间的影响。\n\
  - 网络日志信息将提供给消费者，同时保护每个消费者之间的隐私。这取决于存储设备如何配置以及如何在跨分段网络中提供。需要处理网络日志记录和保留策略——是定期提供日志，还是根据消费需求按需提供。\n\
  \nSLA（服务水平协议）应明确无误地说明服务提供商所采用的安全策略。应当明确说明在发生网络泄露时消费者遭受的损害以及由此产生的责任范围。由于云服务提供商拥有许多消费者，一个消费者账户的数据泄露不应影响其他消费者账户的数据隐私和安全——当然，这取决于数据网络的内部配置，如\
  \ `VLANs`、`firewalls` 以及对数据存储的访问权限。\n\n### 16.3.5 物理基础设施上的安全控制\n\n局域网（LAN）将被配置为\
  \ `VLANs`，因此一个 `VLAN` 上的消费者永远无法看到或监控另一个 `VLANs` 上的流量（`VLAN hopping`）。消费者很有可能使用软件驱动的应用程序，该程序可以监控并记录\
  \ `VLANs` 上的流量，从而为了间谍目的破坏网络安全。这看起来似乎是不可能的，但报告的网络安全违事件数量不应让我们忽视这一点。\n\n消费者可以使用其家庭地点的虚拟专用网络（`VPN`）电路访问云服务，然后进入\
  \ `VLANs`（[图 16.9]），即公有云的数据中心扩展。这将提供站点之间的安全和隐私。当然，使用 `VPN` 需要消费者从服务提供商处获得安全的数字证书（`SSL/IPSec`）。我们在此处应该提醒读者，消费者现在正从非专用服务器访问服务，而从基础设施即服务（IaaS）提供商基础设施获取的安全连接数字证书现在开始发挥作用。多个消费者可能访问一台服务器或采用分布式服务器设计。\n\
  \n![图 16.9 公有云的数据中心扩展](img/fig16.9.jpg)\n\n图 16.9 公有云的数据中心扩展。\n\n云服务提供商支持私有局域网 (`PVLAN`)\
  \ 吗？`PVLAN` 除了功能在第 3 层（网络层）的 `VPN` 电路外，还划分了第 2 层（OSI 模型的数据链路层）广播域。因此，`PVLAN` 又增加了另一层安全性。\n\
  \n分段的内部网络设计使得云服务提供商网络与消费者网络隔离。云服务提供商需要保留其客户记录，存储在网络某处的数据库或分布式数据库中。服务提供商的网络与消费者网络的集成应降至最低，并与第\
  \ 3 层交换连接。流量监控活动将在消费者网络上进行，但生成的数据必须移动到服务提供商的网络，然后到达存储设备。这要求在发生泄露时进行仔细的规划和评估，以便在不关闭整个云服务的情况下隔离网络分段。云服务提供商及其消费者不仅会遭受收入损失，还会影响完整性和可靠性。安全且可扩展的云架构对于公有云服务提供商至关重要，其收入以数百万美元计算——公有云的经济效益必须从消费者的角度考虑成本/收益。\n\
  \n公有云计算的安全 [4] 更加悠久，因为公有云是一个平台，消费者的敏感数据可能存储在一个位置或多个分布式位置，例如在一个国家或多个国家。各国对于隐私和安全有不同的观念和法律。我们提出的问题如下：存储设备上的数据是否加密了？还是以明文格式存储？如果数据已加密，那么它们有多安全，加密技术的守护者是谁？云服务提供商会与消费者共享加密技术的细节，如密钥、数字证书和哈希算法。我们可以得出结论：隐私和安全必须被视为艺术与信息技术不断演变的融合。\n\
  \n云计算平台具有物理位置，尽管它在云端。物理基础设施和所在位置的设施必须是安全的。服务提供商的员工必须对设施拥有受控访问，并保留所有出入日志，供消费者审计使用。\n\
  \n物理基础设施必须免受洪水、地震和火灾等自然灾害的影响。应对对基础设施进行适当的维护/升级，以根据合同义务提供服务。\n\n云计算服务应具有不间断的电力供应，电力中断应考虑在基础设施的设计中。每个数据中心都有备份、冗余和应急计划，云计算服务提供商也应该如此——根据其业务计划。\n\
  \n### 16.3.6 SLA 的终止\n\nSLA 必须规定在消费者请求终止服务时，服务提供商必须遵守并实施的条件。服务提供商负责在存储介质上存储消费者的数据，并定期对数据进行备份。终止服务协议要求将消费者的数据从介质中删除，且在未来不可追溯。这需要对存储和备份了消费者数据的介质进行覆盖写。由于存在数据二级市场，必须根据州法律的要求删除消费者的整个历史。\n\
  \n消费者必须能够将其所有数据从服务提供商传输到其数据中心。如果 SLA 要求服务提供商在定义的时间内保留消费者的数据，则必须遵守，以防消费者在不久的将来再次注册云服务。\n\
  \n## 16.4 云安全风险评估\n\n在本节中，我们提出了一个矩阵（[表 16.1]）来评估与云计算服务相关的风险。在前三列中，我们识别了威胁类型，以及该威胁如何利用相关资产的漏洞。针对每个威胁给出了现有的保护措施，然后列出了后果以及相关的严重程度、可能性和风险评级。\n\
  \n表 16.1 风险评估矩阵\n\n![](img/T16.1.jpg)\n\n### 16.4.1 云计算内部 LAN 安全架构组件\n\n[图 16.10]（案例研究）显示了云计算服务提供商内部安全基础设施的示意图。观察放置在外部防火墙之前的边界路由的位置。内部\
  \ LAN 架构显示了内部防火墙的放置，以进一步保护网络。\n\n![图 16.10 安全架构](img/fig16.10.jpg)\n\n图 16.10 安全架构。\n\
  \n## 16.5 总结\n\n\n\n\n\n在本章中，我们回顾了云计算安全的各个方面，因为它是构建云服务的的基础构建块。我们的主要重点是公有云，但安全的某些方面也适用于私有云，甚至适用于混合云。云计算服务提供商必须向寻求注册云服务的潜在客户提供一份\
  \ `SLA`（服务水平协议）。`SLA` 是最重要的文档，在发生安全泄露时，它可以为云客户提供某种程度的满意保障。我们需要指出，安全风险的管理和评估都是动态过程，随着漏洞的发现，需要重新评估安全性；因此，安全管理是一个不断演进的过程。\n\
