  \ 问责制、安全与违规通知\n## 4.8 总结\n### 参考文献 \n\n## 4.1 引言\n\n持续的金融危机以及日益增长的计算和存储需求对现代 IT\
  \ 基础设施产生了严峻影响。通过将数据和计算卸载到云端实现了 IT 成本的降低。云服务涵盖了从数据存储、处理到软件提供的各个领域，这对高可用性和按需且无承诺的服务提供提出了很高要求。尽管这种经济模型已经找到了广泛的应用土壤并吸引了大量投资，但由于出现了一些若干安全、隐私和信任问题，许多个人和公司仍不愿使用云服务。\n\
  \n大多数安全专家认为，云计算问题应该通过现有的应对措施来处理，这些措施继承自于传统的 IT 系统，甚至是作为云计算环境祖先的分布式系统。然而，没过多久，他们就意识到这种初始方法是错误的，因为云计算模型具有主要特征：(a)\
  \ **规模**：为了实现显著的节省，云模型支持硬件资源的大规模集中，以提供所支持的服务；(b) **架构**：尽管共享硬件和软件资源的客户通常互不相关，但他们依赖逻辑隔离机制来保护自己的数据。计算、内容存储和处理是大规模分布的。这种趋向于全球分布和冗余的趋势意味着资源在物理和逻辑上通常都是批量管理的\
  \ [1]。\n\n云计算的这两个特征是所出现的云安全、隐私和信任问题的核心。随着规模（即我们分析的第一个特征）的扩大，云计算基础设施拥有海量的计算资源。因此，一旦发生成功的威胁场景，其影响将比普通\
  \ IT 和分布式系统中遇到的影响更大，会影响更大数量的基础设施、服务，最终影响更多使用它们的人。因此，我们应该说，随着资源的规模扩展，我们在云计算系统中也遇到了随之而扩的安全、隐私和信任问题。\n\
  \n提到的云计算的第二个特征是架构。云计算系统为客户承诺物理和逻辑隔离，因为他们在使用相同的云服务时通常会共享物理资源。然而，当他们使用云服务或虚拟机（`VMs`）共享同一物理机器的计算资源时，物理隔离是非常困难的。因此，大多数云提供商尝试为其客户提供逻辑隔离，这更具可行性。即使在这种情况下，也存在无法通过传统解决的安全、隐私和信任问题。因此，在这些情况下需要新的应对措施。\n\
  \n根据 ISO 27001，威胁是一个潜在事件。当威胁变成实际事件时，它可能会导致不符合预期的事件。之所以说它是不符合预期的，是因为该事件可能会损害组织或系统，导致安全事件和/或违反用户隐私。现有的对云环境中识别出的威胁进行分类的尝试要么基于主要的云依赖项（如网络或虚拟机的共享内存），要么基于各种风险评估工具的使用\
  \ [1]，例如 `CRAMM` 和 `Octave` [2, 3, ]。本章介绍的分类方法使用了三个不同的类别：与基础设施相关的威胁、与服务提供商相关的威胁以及通用威胁。所提分类的主要目标是通过指出出现的主要问题，从而减轻云管理员在安全相关问题上的负担，为他们节省时间和金钱。\n\
  \n为了实现创建适当分类的目标，必须提供适当的信息，以理解随着云计算系统新兴技术而来的威胁。在通过对针对云环境的识别威胁进行详细描述介绍所提分类后，我们将提供每个类别识别出的威胁概述，以及关于是否存在用于检测和预防每种威胁的应对措施的信息。\n\
  \n此外，从 2018 年 5 月开始，云提供商应遵守 `GDPR` [4]。《通用数据保护条例》（`GDPR`）有一个明确的目标：引入更高、更一致的个人数据保护水平，使公民能够对其个人数据拥有控制权，并简化业务的监管环境。该法规适用于持有或处理欧盟居民数据的所有公司，包括云计算用户、提供商及其其分包商。之前基于\
  \ 95/46 欧盟数据保护指令的法律框架未能实现成员国之间个人数据保护规则的统一。这些差异以及频繁冲突的规则增加了企业需求和程序的复杂性。作为一项条例，`GDPR`\
  \ 旨在确保相同的数据保护规则在整个欧盟范围内统一适用。此外，虽然 `GDPR` 的许多概念和原则基于 95/46 数据保护指令，但它引入了重大的新规则和增强。重点在于欧盟内部以及在某些情况下是欧盟外部的机构如何处理和保护个人身份信息（`PII`）。对于云提供商来说，新的义务是广泛且具有挑战性的。我们对云提供商应该考虑的内容以及为了采取哪些进一步行动以遵守\
  \ `GDPR` 提供了简要指南 [5]。\n\n## 4.2 理解威胁\n\n在介绍威胁分类之前，了解它们相对于在 IT 系统或分布式系统中遇到的其他威胁的独特性是恰当的。为了方便工作，我们将使用两个安全组织的信息，即\
  \ `ENISA` [1]] 和 `Cloud Security Alliance` [6]。\n\n`ENISA` 在几年前提交了一份云计算系统安全调查。该调查从分析云计算系统的优势开始。然而，尽管在规模和资源集中方面存在优势，但在顶级安全威胁会话中，显然威胁的数量多于优势。同一份调查对威胁进行了分类，并将其分为政策和组织威胁、技术威胁、法律威胁以及非云特有的威胁。每个威胁都被分配了一个从低到高等的等级，并根据其概率、影响、脆弱性和受影响资产进行定义。\n\
  \n\n\n\n\n必须强调的是，非云特有的威胁仅构成一类威胁，且数量少于其他所有威胁。结果，云计算系统的出现创造了一个全新的、过去未知的安全威胁新世界。优秀且具有代表性的例子包括：隔离失效（isolation\
  \ failure），指缺乏逻辑隔离；以及经济性拒绝服务（economic denial of service），指客户刻意耗尽云系统的计算资源，导致云提供商无法为其他客户提供服务。另一个值得关注的案例是恶意内部人员（malicious\
  \ insider），这是一个在云计算系统背景下被重新定义的概念。本调查还关注了漏洞，并简要解释了所提供分类中的每个元素。再次强调，非云特有的漏洞少于云系统存在而产生的漏洞。\n\
  \n云安全联盟（Cloud Security Alliance）认为，尽管 IT 环境与云系统之间的安全控制存在相似之处，但组织所面临的威胁存在许多差异。所采用的云服务、运营模式以及实施云服务的技术是新威胁的来源。此外，还注意到在不同的云服务模型中，提供者和消费者之间的安全责任存在差异。此外，由于云提供商追求成本效率，从而实现规模化、重用和标准化，这会导致安全机制失去灵活性。\n\
  \nENISA（欧盟网络安全局）和云安全联盟都认为，云系统的客户和普通用户可能与具有高权限的用户一样，成为最大的威胁之一。与传统的 IT 服务相比，云攻击面的扩大不仅是因为共享资源，还因为由于攻击者可能利用额外的攻击向量，来利用位于云管理平台中\
  \ `VM` 或云基础设施中任何其他组件的潜在漏洞。结果，恶意内部人员威胁已演变为云计算环境中面临的最大安全挑战之一。\n\n根据 Xiao 及其团队 `[7]`\
  \ 的说法，对于信息系统而言，`insider`（内部人员）一词适用于任何获得授权访问、权限或了解信息系统及其服务和任务的人。另一方面，恶意内部人员是指那些为了利用其权限，通过一系列损害信息机密性、完整性和/或可用性的行动，对组织的任务产生负面影响的人。同样，对于云计算而言，内部人员被认为是满足以下条件的实体：\n\
  \n*   为云主机提供工作\n*   对云资源具有特权访问权限\n*   使用云服务\n\n因此，云内部人员（图 4.1）大多是特权用户，他们可能具有破坏云基础设施安全的动机。根据其权限的大小，他们的行为可能导致临时性中断、违反合法用户的隐私，甚至导致所提供服务的永久性中断。文中强调，与\
  \ `VM` 相关信息（例如为所提供的 `VMs` 之间的内部通信而建立的虚拟网络结构）只能由特权用户提取，并在攻击的后续阶段被利用。沿着这一方向，恶意用户可能会尝试映射所有可用虚拟机，并提取其他\
  \ `VM`-相关信息 `[8]`，以突破云安全或违反用户隐私。\n\n![图 4.1 恶意内部人员威胁。](img/fig4.1.jpg)\n\n图 4.1\
  \ 恶意内部人员威胁。\n\n## 4.3 分类与对策\n\n为了便于分析云系统面临的威胁，有必要将威胁 `[1]` 分为三大类：(1) 影响云的基础设施和主机相关威胁；(2)\
  \ 可能影响客户的业务提供者相关威胁；以及 (3) 可能影响两者的通用威胁。必须强调的是，在本章的剩余部分，风险评估工具并不是指示对策，而是提供此类对策的建议。\n\
  \n### 4.3.1 基础设施和主机威胁\n\n云系统中的大多数威胁与基础设施有关。它们要么继承自传统的 IT，要么是云特有的。在这两种情况下，其重要性都很。\n\
  \n#### 4.3.1.1 可能损害基础设施的自然灾害\n\n地震、洪水、飓风、火灾和其他自然灾害可以被视为损害云的严重威胁。结果，它们对系统以及人类生命产生毁灭性的影响。目前已经开发了风险评估工具，如\
  \ `CRAMM` 和 `Octave` `[9, 10]`，它们可用于最小化自然灾害的后果 `[1]`。\n\n#### 4.3.1.2 对设施或设备的未经授权物理访问\n\
  \n未经授权的用户可能会尝试访问云系统的设施。这种未经授权的物理访问会威胁系统的设备和装置，并导致长时间的拒绝服务。像 `CRAMM` 和 `Octave` 等风险评估工具\
  \ `[2, 3]` 可以防止此类问题，并且在云系统的开发阶段必须考虑这些因素 `[1]`。\n\n#### 4.3.1.3 员工培训不足/疏忽\n\n员工往往会对云系统构成严重威胁。培训不足或疏忽与普通员工的无常和不可预测的行为有关。此类行动可能涉及备份数据以及运行或安全日志的意外丢失或删除。风险管理计划结合详尽的安全策略有助于避免类似事件。这些措施帮助员工遵循程序流程，从而显著减少了犯致命且不可恢复错误的概率。\n\
  \n#### 4.3.1.4 翻垃圾\n\n翻垃圾风险是指每个组织或个人在丢弃可能有用信息时所承担的风险。有时，从垃圾中提取的这些对于任何想要攻击云系统的人来说都是价值的。被丢弃的信息可能包括密码、电话号码和信用卡。利用垃圾中发现的信息没有限制。这种信息泄露可能被恶意用户利用以发起社交工程攻击或促进更具威胁的场景。每个组织必须针对秘密信息的生命周期和保护制定特定的政策，并规定员工必须无一例外地遵守该政策\
  \ `[11]`。\n\n#### 4.3.1.5 密码破解\n\n\n\n\n\n通过利用社会工程或其他工具，如 `Social Engineering Toolkit`\
  \ 和 `TrustedSec` \\[12, 13, \\]，恶意用户可以对所使用的密码进行有针对的猜想。这种攻击需要大量的尝试（暴力破解），因此通过设置无效密码尝试次数限制来防止相对容易\
  \ \\[11\\]。\n\n### 4.3.1.6 未经授权对数据或信息技术系统的访问\n\n这种访问可以通过启动社会工程攻击或黑客攻击来非法授权。在社会工程攻击中，攻击者只需通过诱导所需的信息（例如用户的凭据）即可获得访问权限。否则，特权提升技术可能会为恶意用户提供访问这些数据所需的许可。该问题的一个示例是\
  \ `SYSRET` 漏洞，恶意第三方利用了 Intel 平台上的 AMD 指令集 \\[14\\]。为了避免此类情况，利用适当且最新的安全防御措施以及严格的访问控制是非常必要的\
  \ \\[1\\]。\n\n### 4.3.1.7 运营安全日志的破坏\n\n在大型信息系统中，每一个操作都会被监控并存储在详细的安全日志中。这些日志主要供系统管理员和审计员使用，提供了恶意方可以用来发起攻击的关键信息。此外，由于这些日志包含敏感和隐私数据，它们可能会暴露用户的身份。安全日志的保护必须是重中之重，因为一旦被破坏，可能会影响整个信息系统或其用户\
  \ \\[1, 15, 16, \\]。\n\n### 4.3.1.8 网络中断\n\n每个信息系统，特别是云基础设施，都通过不同的网络提供其服务的访问。每个网络根据其特性（如拓扑结构和硬件）都有已知的漏洞。恶意用户可能会利用这些漏洞来破坏网络安全或停止其正常运行。这些网络中断会对云服务的提供构成严重威胁。成千上万的可能可能受到影响，云服务提供商（CP）将失去其当前和潜在客户的信任\
  \ \\[1, 17, \\]。入侵检测系统（IDS）通常可以减少此类威胁。Cheng 等人提出的解决方案（建议在虚拟机中安装 IDS 机制）可能会减少特定的威胁\
  \ \\[18 [](#chapter4.xhtml#re_TNF-CH004_CIT00019)–20\\]。\n\n### 4.3.1.9 特权提升\n\n\
  恶意用户可能利用虚拟机（VM）通过提升其访问权限来攻击另一个虚拟机。这可以通过使用云主机的虚拟机监控程序或虚拟机的共享内存来实现来实现。每个云服务提供商都需要最新版本的虚拟机监控程序和特权提升防御措施，以防止此类行为\
  \ \\[1, 21, \\]。\n\n### 4.3.1.10 不安全或无效的数据删除\n\n在云计算基础设施中，可能需要删除某些资源。大多数操作系统并不会完全擦除数据，而在其他情况下，可能无法及时删除数据。云服务提供商可能需要对其架构进行若干修改，例如更改服务器位置、进行硬件重新分配，甚至销毁旧硬件。在这些更改期间，由于技术原因，数据可能无法正确传输或销毁，导致其暴露。在某些情况下，硬盘的物理破坏可能会影响不应被删除的客户数据\
  \ \\[22\\]。\n\n### 4.3.1.11 恶意扫描或观察\n\n恶意方为了获取有关云系统的信息，使用网络探测工具如 `hping` \\[23\\\
  ], `nmap` \\[24\\], 以及 `wget` \\[25\\]，来监控云基础设施的网络。他们经常安装恶意软件来收集用于绘制云系统地图的信息。当用户知道其当前在云基础设施网络或物理机器中的位置时，他可以利用此点，通过提升访问权限来访问其他虚拟机。在这种情况下，访问共享资源的人将获取机密信息\
  \ \\[26\\]。\n\n### 4.3.1.12 不安全或过时的加密\n\n密码分析的进步可能会使加密机制或算法变得不安全。另一方面，云系统未准确加密是一个常见现象，而在最坏的情况下根本没有加密。因此，必须始终优先实施现代加密技术，因为它能保护系统\
  \ \\[9\\]。\n\n### 4.3.1.13 经济性拒绝服务 (EDoS) 和资源耗尽\n\n经济性拒绝服务出现在多种场景中。它是云环境中出现的新威胁。最重要的场景包括：\n\
  \n-   **身份盗窃**：攻击者可能窃取客户的账户和资源并为自己使用。在这种情况下，攻击者免费使用服务，而受害账户却被收费。此外，攻击者可能使用被盗的身份，并通过恶意行为威胁受害者的声誉。\n\
  - 云客户对付费资源的使用没有有效限制，导致他们给这些资源施加意外负载。\n- 攻击者可能利用公共通道使用客户的计费资源。一个例子是按会话付费的 DDoS 攻击。\n\
  - 在这些场景中，客户可能无法获得服务，访问控制可能被破坏。此外，云服务提供商的信誉不可避免地受到威胁。EDoS 攻击的首要目标是云服务提供商，次要目标是客户\
  \ \\[1\\]。Kaliski Jr, B. S. 和 Pauley, W. 建议通过风险评估来避免 EDoS \\[10\\]。\n\n### 4.3.1.14\
  \ 账单欺诈\n\n\n\n\n账单数据操纵和计单逃避是云环境中最重要的漏洞之一。云服务在适用于服务类型（如存储和处理）的抽象层上具有计量能力。计量数据用于服务交付和计单支持\
  \ [9]。Widder 等提出了一种方法，建议使用复杂事件处理引擎 [28]。\n\n### 4.3.1.16 日志记录与监控不足\n\n目前尚未提出任何用于云资源日志记录和监控服务的标准机制。这可能会引起严重关注。由于现有的日志机制通常监控基础设施的用户和业务，因此获取影响单个用户或服务的信息变得相当困难。在实施高效的监控和日志机制之前，考虑云计算中的安全控制是恰的\
  \ [9]。目前已经提出了一些用于日志记录、监控和配置服务的工具，例如 `openQRM` [29]、`Cobbler` [30]、`Crowbar` [31]、`Spacewalk`\
  \ [32] 和 `Cloudaudit` [33]，但这些工具无一个提供完整的解决方案。\n\n### 4.3.1.17 云服务故障或终止\n\n除了可能导致云服务短期不可用的\
  \ DoS 攻击外，还可能经历服务故障或终止。服务故障或终止意味着云基础设施无法永久或临时提供其服务。这可能是由于在基础设施中获得高权限的用户实施的恶意行为造成的，这些用户随后获得了可以干扰或禁用所提供服务功能的机制\
  \ [1]。正如 Cheng 等人建议的，在多台虚拟机中安装多种类型的 IDS 可以显著减少这种威胁 [18 [](#chapter4.xhtml#re_TNF-CH004_CIT00019)–20]。\n\
  \n### 4.3.1.18 第三方供应商故障\n\n云提供商通常将若干任务外包给第三方供应商。这意味着云基础设施的安全性取决于第三方所使用的安全机制。供应商并不总是可靠的。保持低安全标准或不关注云基础设施的安全策略可能会导致基础设施某些部分暴露，甚至让某些某些对恶意用户可用。任何合作伙伴都可能严重损害云的完整性、可用性和机密性，并对其生存能力产生进一步影响。因此，云提供商必须对合作伙伴保持谨慎，并最好在外包事务上留有备选方案\
  \ [1]。\n\n### 4.3.1.19 锁定\n\n当云基础设施发生所有权和/或策略变更，而原用户仍作为客户时，会发生若干问题。当客户无法轻松地将其服务或数据从一个云提供商转移到另一个时，就会出现一个极其重要的困难。在这种情况下，根据云系统的架构，我们会有各种“锁定”问题。在所有三种架构——SaaS、PaaS\
  \ 和 IaaS 中——数据锁定问题都是显而易见的。由于技术或法律原因，提取每个客户的数据极其困难。在 SaaS 架构的情况下，可能会出现服务锁定问题。这意味着每个云提供商使用不同的工具进行配置和监控，如\
  \ `openQRM` [29]、`Cobbler` [30]、`Crowbar` [31] 和 `Spacewalk` [32]。在 PaaS 架构中，问题存在于\
  \ API 层，因为每个云提供商并不使用相同的虚拟化平台。客户应该检查新提供商是否使用相同的平台或兼容的平台。IaaS 锁定取决于每个客户所使用的基础设施。为了避免此类情况，必须在广泛研究后决定选择合适的云提供商，同时必须特别注意云策略的任何变化\
  \ [1, 34, ]。\n\n### 4.3.1.20 合规性问题\n\n许多公司和组织出于多种原因迁移到云系统。由于这些公司在迁移之前一直在使用安全证书和其他标准，可能会出现合规性问题。这主要是因为云提供商可能没有使用相同的安全标准或策略，或者因为安全方案之间不兼容。因此，客户有必要检查云提供商能够提供与其部署兼容并根据其需求托管的服务。否则，这可能会导致长时间的服务拒绝，而用户的失望将不可避免地威胁运营商的声誉\
  \ [1]。\n\n### 4.3.1.21 云数据溯源、元数据管理与管辖权\n\n这是一个传统大型 IT 系统遗留的问题。由于云系统的各种元素可能分布在不同的国家，这种威胁变得更加严重。具体来说，这个问题包括：\n\
  \n- 云进程溯源：控制流动态及其进展、执行信息、代码性能跟踪等。\n- 云数据溯源：数据和数据流动态、文件位置、应用程序输入输出信息等。\n- 云工作流溯源：工作流本身的结构、形式、演变等。\n\
  - 系统（或环境）溯源：系统信息、操作系统、编译器版本、加载库、环境变量等。\n\n考虑到上述问题，得出数据溯源方面存在许多挑战的结论。这为使用数据的云客户带来了高度的不确定性。每个云提供商都应该建立自己的溯源系统，以保证提供服务的质量并保护数据机密性和用户隐私。如果这些需求受到威胁，可能会引发数据及其存储的管辖权问题\
  \ [1, 35, ]。\n\n### 4.3.1.22 基础设施修改\n\n\n\n\n\n随着技术的发展，更优且现代的硬件和软件解决方案被推出。云服务商可能会更新或升级其软件/设备。这可能导致每位客户产生额外费用，即使后者继续使用云端相同数量的资源。此外，如果存储/交换的数据没有得到适当安全机制的充分保护，其知识产权可能会面临风险。云服务商应该关注这些问题，并投入专门精力制定有关系统妥当使用的严格规则和安全策略，以避免法律问题。此外，通过利用适当工具\
  \ \\[2, 3, \\] 开发风险评估程序，可以为云客户提供更安全的服务 \\[33\\]。\n\n### 4.3.1.23 数据处理\n\n除了数据溯源之外，云计算中另一个严峻的关注点是数据处理。客户无法确定云系统如何操纵其数据，以及该处理过程是否符合其所在国家的法律框架。一些云服务商会描述他们遵循的流程以及可能拥有的认证。但即使数据已免受恶意用户的攻击，也无法保证用户存储的数据是否已合法获取。这引发了另一个问题：如何在不违反用户隐私的情况下，对这些数据进行合法性评估，并（同时）防止其被泄露\
  \ \\[1\\]。\n\n### 4.3.1.24 管理和所有权的变更\n\n云服务商可能会更换其管理人员（例如网络或系统管理员），甚至整个云系统可能被出售给另一家公司。由于原所有者/管理员的安全需求并不总能被新管理者满足，这可能会引发许多安全忧虑。这可能对数据的机密性、完整性和可用性产生影响，进而影响云服务商的声誉。因此，必须维持先先建立的安全措施一段时间，直到新管理层决定更改它们。这可以防止恶意实体利用此类情况。\n\
  \n### 4.3.1.25 因资源误判或分配不当导致共同租户被拒绝服务\n\n由于云系统提供资源共享，一个租户实施的恶意活动可能会对另一个租户产生影响。例如，为了防止安全事件，某个\
  \ `IP` 被封禁或拦截（例如该 `IP` 已用于发起攻击），某些未参与恶意行为的用户可能仍无法使用云服务。此外，客户可能无法访问特定服务，因为其他用户可能已经预定了可用资源。这可能变成一个重大问题，因为客户的不满会严重损害公司的声誉（他们无法获得其支付过费的服务）。因此，云服务商应当考虑并维护客户访问所提供服务的权利\
  \ \\[1\\]。\n\n### 4.3.1.26 传票和电子取证\n\n每一份传票和电子取证都是要求云服务商提供数据的法律要求。如果处理时不加极度小心，可能会导致敏感信息的泄露。云服务商必须拥有清晰的流程来处理此类请求，以便在履行法律义务的同时保护用户隐私。\n\
  \n### 4.3.2 服务提供商威胁\n\n这是另一个影响客户的类别。它与前两种不同，因为它涉及来自提供商本身的威胁。\n\n#### 4.3.2.1 重放攻击\n\
  \n重放攻击与中间人攻击非常相似。在这种情况下，攻击者拦截并保存了消息。其他防御措施可能仅包含一个时间戳，指示消息发送的时间 \\[11\\]。\n\n####\
  \ 4.3.2.2 数据拦截\n\n这类攻击是且在大多数情况下更为严重。具体而言，这组攻击包含：\n\n- **中间人**：在类类攻击中，攻击者可以通过更改公钥来冒充受害者。结果是攻击者可以接收、解密并修改消息。最后，攻击者用受害者的真实公钥加密伪造的消息，并将其转发给后者\
  \ \\[11\\]。\n- **窃听**：数据搜集、流量分析、社会工程、经济或政治间谍活动、嗅探、翻垃圾、键盘监控和窥视都是窃听的类型。其目的是获取信息或为后续攻击建立基础。\n\
  - **信道攻击**：在共享硬件中利用信道攻击使攻击者能够跨越虚拟机渗透数据 \\[11\\]。\n\n#### 4.3.2.3 浏览器安全\n\n云系统中最常见的威胁之一是浏览器安全。通常，云中的计算机客户端仅用于\
  \ I/O、身份验证和授权。云服务商并未为此开发足够安全的浏览器。因此，计算机客户端使用各种浏览器，其安全功能主要取决于软件版本。因此，当特定浏览器出现安全漏洞或漏洞时，它将影响整个云\
  \ \\[36\\]。\n\n#### 4.3.2.4 XML 签名封装\n\n这是针对使用 XML 签名进行完整性保护的协议的攻击。这种类型的攻击适用于 Web\
  \ 服务也适用于云系统。它一直仅处于理论阶段，直到 2008 年发现亚马逊的 `EC2` 服务易受封装攻击。特定的漏洞是结合该技术使用的 `soap` 架构利用。这组攻击很难被检测，仍然是云系统的一个巨大威胁\
  \ \\[36, 37, \\]。\n\n#### 4.3.2.5 注入漏洞\n\n这些漏洞通过操纵服务或应用程序输入来被利用。此类操纵可以强制解释并随后执行非法代码。典型的例子包括`SQL\
  \ 注入`、`命令注入`和`跨站脚本`攻击。由于这些攻击非常流行且在大多数情况下易于利用，云服务商应当从建立的第一阶段起就考虑部署防御措施和保护方案 \\[9\\\
  ]。\n\n\n\n\n\n### 4.3.2.6 客户疏忽与云安全\n\n云客户未能或忽略妥善保护其云环境，导致恶意用户能够攻击云平台。客户必须意识到他们有责任保护自己的数据和资源。在某些情况下，云客户错误地认为提供商负责确保数据的安全。这种威胁无法通过审计或其他技术来解决。即使客户没有遵循适当的程序，每个公司都应始终保持高安全标准\
  \ \\[1\\]。\n\n### 4.3.2.7 管理接口暴露\n\n恶意方可以利用互联网浏览器和远程访问的漏洞，从而访问云系统的多个控制接口。这包括控制大量虚拟机和整个云系统运行的客户接口\
  \ \\[1\\]。正如 Cheng 等人建议的，频繁更新浏览器以及在多个虚拟机中安装不同类型的 `IDS` 可以减少这种威胁 [18 [](#chapter4.xhtml#re_TNF-CH004_CIT00019)–20\\\
  ]。\n\n### 4.3.2.8 治理失效\n\n如前所述，云客户采用的安全方法与云提供商的方向存在显著偏差。这种矛盾可能导致治理和控制的丧失，这对云系统及其数据可能产生决定性的影响。为此，每个云提供商都应通过清晰且严格的安全程序和方向让客户了解最新情况；同时，在外包的情况下，合作伙伴的服务必须与这些方向/策略兼容\
  \ \\[1\\]。\n\n### 4.3.3 通用威胁\n\n这是最后一类威胁。它是一组可能同时影响基础设施和服务提供商/客户的威胁。一旦发生安全泄露，云环境将面临严重的后果。\n\
  \n#### 4.3.3.1 社会工程学攻击\n\n由于教育不足、疏忽或社会压力，用户或员工可能会泄露机密数据和其他关键信息。攻击者可以冒充（例如通过电话或电子邮件）主管、首席技术人员或其他重要实体，以诱导可用于直接或间接攻击系统的机密数据。此类信息可能包括密码、网络拓扑、所使用的软件和/或虚拟化程序版本等，这些信息可以为攻击者提供发起攻击所需的知识。这证明了人是安全中最薄弱的环节。社会工程学可以通过严格的程序以及审计来缓解，审计在避免此类攻击中起着至关重要的作用\
  \ \\[33, 38,]。\n\n#### 4.3.3.2 分布式拒绝服务 (DDoS)\n\n`DDoS` 攻击是 `DoS` 攻击的高级形式。与其他攻击的区别在于它具有\
  \ (a) 在互联网上以“分布式”方式部署武器的能力以及 (b) 聚合这些力量以产生压倒性的流量。`DDoS` 攻击的主要目标是为了个人原因、物质利益或名声对受害者造成损害。`DDoS`\
  \ 攻击变得更加强大，因为它们利用了继承了分布式系统优缺点的云架构 \\[39\\]。然而，Aman 和 Yogesh 提出了一种解决方案，建议在虚拟机中实现\
  \ `IDS` \\[40\\]。\n\n#### 4.3.3.3 加密密钥暴露或丢失\n\n在此类攻击中，员工的疏忽或缺乏安全策略使得密钥（文件加密、`SSL`、客户私钥）容易受到既未经授权也没有经过身份验证的恶意用户的攻击\
  \ \\[1\\]。这种疏忽可能导致未授权的用户获得访问，他们可能会对云基础设施或其他客户发起攻击。\n\n#### 4.3.3.4 服务引擎暴露\n\n服务引擎由云平台供应商开发和支持，在某些情况下由开源社区支持。具体而言，服务引擎代码容易受到攻击或意外故障；这意味着它可能受到各种恶意操作的影响。例如，攻击者可以操纵服务引擎并访问客户环境中包含的数据\
  \ \\[8\\]。频繁更新服务引擎的安全可以部分解决问题。此外，在整个风险评估过程中都应考虑这种威胁 \\[2, 3, 33,]。\n\n#### 4.3.3.5\
  \ 恶意软件\n\n恶意软件是恶意代码，可能隐藏在有用程序内部，攻击工作站、服务器或网络，或允许对这些设备进行未经访问。恶意代码可以通过互联网流量传输（例如 `FTP`\
  \ 下载或来自网站下载的小程序），也可以通过电子邮件传播。某些类型的恶意软件被设计为打开特定端口，以非法允许攻击者访问或为了可能利用系统漏洞 \\[11\\]。正如\
  \ Cheng 等人建议的，在事件管理器连接的虚拟机上安装多个 `IDS` 可能是有效的对策措施 \\[18 [](#chapter4.xhtml#re_TNF-CH004_CIT00019)–20\\\
  ]。因为恶意软件每天都在增加和进化，处理它并不是一项简单的任务。\n\n#### 4.3.3.6 云提供商的恶意内部\n\n恶意内部人员的活动会威胁云系统数据和服务的机密性、完整性和可用。这使得恶意内部人员成为信息系统特别是云计算最大的威胁之一，因为云架构需要某些角色（系统管理员和审计员、托管安全服务提供商），这些角色被认为具有极风险\
  \ \\[1\\]。\n\n## 4.4 威胁评估\n\n表 4.1 描绘了针对云系统的威胁，分为上述三个不同的类别。表格的最后两列提供了关于特定威胁是否可以通过某些技术防御措施（技术解决方案）或某些组织和/或程序防御措施（非技术解决方案）来解决的信息。关于每个威胁被覆盖（●）、部分覆盖（○）还是未覆盖（–）的判断基于相关的已出版著作以及作者的个人判断和经验。\n\
  \n表 4.1 威胁评估\n\n![](img/T4.1.jpg)\n\n## 4.5 面临云内部人员\n\n\n\n\n\n由于恶意内部人员对云基础设施构成了威胁，安全社区已经尝试了多种方法来追踪、禁用或应对恶意内部人员威胁。Spring\
  \ 等人 \\[41\\] 建议，在云边界部署一个能够拦截问题数据包的防火墙可以减少无法消除已知恶意实体获取访问权限的风险。Alzain 等人 \\[42\\\
  ] 建议，从单云向多云迁移将减少恶意内部人员的威胁，因为信息分布在各个云之间，不存在检索信息的单点故障。Sandhu 等人 \\[43\\] 采用逻辑回归模型来估计入侵检测和恶意内部人员识别中的假阳性和假阴性，从而开发出能够应对拒绝服务攻击和内部攻击，同时确保任务关键数据可预测交付的新协议。Rawat\
  \ 等人 \\[44\\] 通过二值加权余弦相似度量和 k-最近邻（`knn`）机器学习算法将系统调用分类为正常和异常。Alarifi 等人 \\[45\\]\
  \ 提出基于底层 `KVM` 虚拟机管理程序，对 IaaS 环境中每个 VM 主机上的系统调用进行监控，他们他们在收集了包括正常操作和恶意行为的大量数据后，调用统计分析对系统调用进行分类。\n\
  \nRawat 等人 \\[46\\] 和 Sharma 等人 \\[47\\] 在其工作中利用 `kNN` 算法和二值加权余弦相似度量实现了类似的目标，并使用流行的\
  \ `DARPA-1998` 数据将进程分类为正常或恶意。他们方法的进一步扩展源于 Eskin 等人 \\[48\\]，他们通过使用系统调用轨迹的子序列长度提出了动态窗口大小，该轨迹被作为程序或进程行为建模的基本单元。Kang\
  \ 等人 \\[49\\] 通过在系统调用序列中使用系统调用包（bag of system calls）表示法进一步改进了上述方法。Azmandian 等人 \\\
  [50, 51, \\] 在其检测入侵的过程中，在云基础设施上应用了机器学习。\n\nPitropakis 等人 \\[52, 53\\] 利用二值加权余弦相似量实现了类似的目标，并使用流行的\
  \ `DARPA-1998` 数据将进程分类为正常或恶意。他们方法的进一步扩展源于 Eskin 等人 \\[48\\]，他们通过使用系统调用轨迹的子序列长度提出了动态窗口大小，该轨迹被作为程序或进程行为建模的基本单元。Kang\
  \ 等人 \\[49\\] 通过在系统调用序列中使用系统调用包表示法进一步改进了上述方法。Azmandian 等人 \\[50, 51, \\] 在其检测入侵的过程中，在云基础设施上应用了机器学习。\n\
  \nPitropakis 等人 \\[52, 53\\] 将系统调用视为序列并利用了 `Smith-Waterman` 算法。由于 `Smith-Waterman`\
  \ 计算消耗极大，作者 \\[54\\] 通过捕获超调用（hypercalls）在基于 `Xen` 的虚拟机管理程序实现了安全性。\n\nMaglar 等人 \\\
  [55\\] 提出了一种关系模式下的审计引擎，以解决两个根本问题：(a) 缺乏数据以及 (b) 如何检测去匿名化的内部人员攻击。\n\nTripathi 和 Mishra\
  \ \\[56\\] 建议云服务商应该为客户提供一个工具。\n\nKollam 和 Sunny \\[57\\] 为云基础设施提供了一套机制。\n\nStolfo\
  \ 等人 \\[58\\] 建议了一种维护每个用户数据的监控类型。\n\nBates 等人 \\[59\\] 提出通过信道可以检测共存（co-residency）。\n\
  \n其他专注于存攻击的尝试使用安装在虚拟机上的多个代理将数据收集到中心，这引入了巨大的开销 \\[60, 61\\]。\n\nMundada 等人 \\[66\\\
  ] 旨在通过随机分配的 IP 地址实现数据和网络隔离。\n\nBakshi 和 Yogesh \\[67\\] 在检测到入站流量异常异常时，将目标应用程序迁移到另一个数据中心的虚拟机。遵循相同的理念，许多科学方法尝试使用移动防御来应对内部威胁，由于整个虚拟机或云服务的不断迁移，这产生了一个不断演变的攻击面\
  \ \\[68, 69, 70, 71\\]\n\n## 4.6 云信任\n\n信任是一个抽象且主观的术语。通常情况下它是对实体身份的认可以及对其行为的信任。在云语境下，信任通过应用信任模型的信任机制来实现。信任模型是包含信任建立、信任更新和信任撤销的管理方法或协议。云系统的信任管理无法通过传统的信任模型进行。这是由于云系统的特殊特性——即其规模、位置、缺乏边界、用户数量以及缺乏信任——使得现有的分布式系统的信任模型不再适用。\n\
  \n\n\n\n\n云系统广泛部署的主要障碍之一是用户与云服务提供者之间的互信问题。当数据存储在云端时，用户觉得他们失去了控制权，并对谁有权访问数据以及数据如何被处理或复制等问题产生疑虑。适用的信任机制可以作为上述疑虑的应对措施，因为信任能够快速、安全地建立实体之间的关系。然而，现有的信任模型（例如用于受限数据中心的模型）并不适用于云计算环境。其主要原因如下：\n\
  \n- 数据处理：当客户将数据传输到云端时，数据的处理者不再是所有者，而是提供者。这一事实使得信任方面的情况发生了变化，因为产生了一个新的参数。换句话说，数据处理者必须是完全可赖的。\n\
  - 数据位置：在传统系统中，数据的地理区域总是已知的。在云计算中部署服务时，数据的物理位置不再为人知晓或无法完全信任。不考虑传输中数据位置的信任模型不再被认为适用于云系统。\n\
  - 数据访问：用户访问云端的位置是未知的，且无法定位。\n- 用户数量：在传统系统中，定义访问系统的人数并不困难。但在云计算环境中，提供者和客户都对访问系统的人数感到不安。\n\
  - 复合服务：云端的一个常见场景是分包。换句话说，客户为服务付费，而该特定服务的提供者本应向客户交付。\n\n文献中提出了几种针对云的信任模型。然而，所有这些模型都应该通过云环境应满足的需求列表进行评估：\n\
  \n- 信任指标：在信任模型中，必须定义一种量化信任的方法。由于信任是一个抽象术语，应该定义云提供者或客户的信任值。有必要将量化的信任级别定义为模型的一部分。\n\
  - 异常行为：信任评估的一个主要因素应该是用户在云中的异常行为。偏离平均水平或历史记录的行为应导致零信任。因此，信任模型有必要定义哪些行为被认为是正常的，哪些不是。此外，还应该描述其判定标准（历史\
  \ vs. 异常）。\n- 身份管理/认证（`identity management/authentication`）：为了收集与信任相关的反馈，模型需要确保用户的身份是真实的。为此，有必要对用户进行身份验证。因此，该模型的另一个要求是应用\
  \ `identity management/authentication` 方案。\n- 数据安全：信任管理和相关模型是云整体安全管理实施的一部分。因此，信任模型应该规定达到可接受数据安全标准的最低要求。\n\
  - `SLA`：服务水平协议是提供者与用户之间的一种正式协议，明确规定了双方的要求。`SLA` 应该是信任管理过程的一部分。\n\n必须识别并强调现有信任模型的差距/缺陷，将其视为需要进一步工作的领域。\n\
  \n## 云提供者的 GDPR 要求\n\n云云提供者需要解决一系列主要的 GDPR 要求。下文列出了这些要求：\n\n### 4.1 实体范围和地域范围\n\n\
  GDPR 适用于云控制者（即决定如何以及为何处理个人数据的人）和处理者（即代表控制者处理个人数据的人）。更具体地说，所有位于欧盟的云控制者和/或处理者，以及未位于欧盟但向欧盟公民提供服务的云控制者和/或处理者，都应遵守\
  \ GDPR 要求。\n\n### 4.2 数据保护原则\n\n云提供者应确保遵循以下 GDPR 原则：合法性、公平性和透明、目的限制、数据最小化、准确性、存储限制、完整性和机密性、问责制。具体而言，应根据法律以公平透明的方式处理个人数据。特定要求强调了数据控制者需要采用对用户友好并促进隐私权利的隐私政策。云提供者应为特定且法的目的收集、存储和处理个人数据，禁止任何超出初始范围的处理。此外，为了符合最小化原则，存储在云场所的个人数据应当是充分的、具有相关性的，并且限制在与其收集目的相关的必要范围内。云控制者必须保持个人数据的准确和更新。为了遵守存储限制原则，如果数据不再为收集目的所需的需要，控制者应立即删除该数据。最后，应确保完整性和机密性，以避免未经授权或非法的处理和/或意外丢失、销毁或损坏。\n\
  \n### 4.3 同意\n\n云提供者对个人数据的收集/处理（`collection/processing`）应始终具有法律依据。在某些情况下，这一法律依据可以是数据主体的同意。换句话说，云控制者应该能够证明数据主体已同意处理其/她的个人数据。如果数据主体的同意通过涵盖其他问题的书面声明给出，则该声明必须是清晰可辨、易于访问并用清晰易懂的语言编写。数据主体有权随时撤回其同意。\n\
  \n### 4.4 儿童：父母同意\n\n如果数据主体是儿童，则需要父母同意（`Article 6(1)`）。只有当特定同意是由对孩子负有父母责任的人给出或经其授权时，才被认为是合法的。\n\
  \n### 4.5 敏感数据和合法处理\n\n根据 GDPR，敏感（特殊类别）数据是指揭示以下内容的：\n\n* 种族或民族起源\n* 政治观点\n* 宗教或哲学信仰\n\
  * 工会成员\n* 遗传数据\n* 用于唯一识别自然人的生物识别数据\n* 健康或自然人的性生活和/或性取向的数据\n\n收集/处理（`collect/process`）此类类别数据的云提供者应采取进一步行动以满足\
  \ GDPR 要求。在此范围内，处理的特殊类别数据应在云策略中识别并进行分析描述，并提供其必要性理由。\n\n### 4.6 信息通知\n\n云提供者必须通过其隐私政策和/或根据数据体的请求提供信息。这些信息涉及：\n\
  \n* 控制者的身份和联系方式\n* 涉及的数据、处理目的和法律依据\n* 接收者或接收者类别\n\n\n\n\n\n* 欧盟境外的数据传输详情\n* 数据保留期\n\
  * 个人的权利\n\n### 4.7.7 主体访问、更正与可携带性\n\n云提供商应满足数据主体访问/更正其个人数据的所有请求。此外，它们应以可携带的格式（例如\
  \ `xml`、`tab`、`csv`）导出其数据。\n\n### 4.7.8 反对权\n\n云提供商必须以简单且安全的方式，支持数据主体行使对其个人数据处理的反对权。常见的个人数据处理类型包括收集、记录、组织、结构化、存储、修改、查询、使用、发布、合并、删除和销毁数据。\n\
  \n### 4.7.9 删除权与限制处理权\n\n云提供商必须执行删除或限制处理。如果发生以下任何情况，应执行此类操作：\n\n* 数据不再是收集或处理其目的所必需。\n\
  * 个人撤回了同意。\n* 发生了非法数据处理。\n\n### 4.7.10 形象分析与自动化决策\n\n自动化处理（使用计算机进行处理）旨在评估个人或群体的个人方面（包括分析或预测），这是形象分析的广义定义。很显然，处理不需要涉及推理即可被纳入——“仅仅根据年龄、性别和身高等特征对个人进行评估或分类即可被视为形象分析，无论是否有任何预测目的。”形象分析有三个不同的阶段，每个阶段都符合\
  \ GDPR 的要求：(1) 数据收集，(2) 识别关联性的自动化分析，以及 (3) 将关联性应用于个人以识别现在或未来行为的特征。完全基于自动化处理的决策是指其决策过程中没有人类参与的决策。在过程中引入人类来规避关于纯自动化决策的规则是行不通的，因为人类的参与必须是有意义的，而不仅仅是形式上的做法。个人需要有权在考虑所有可用信息的情况下更改决策。\n\
  \n当决策完全基于自动化分析时，必须告知个人，且他们有权要求对该决策进行审查。审查应由具有相应权限和能力更改决策的能力的人员进行，并应对所有相关数据以及个人提供的任何额外信息进行彻底审查。使用自动化决策的组织还应对定期审查，并使用适当程序防止错误。\n\
  \n### 4.7.11 问责制、安全与违规通知\n\nGDPR 第 24 条规定了问责义务。它要求控制者：\n\n* 实施适当的技术和组织措施（包括在相关时引入设计数据保护和默认数据保护原则），以确保并能够证明数据处理是按照\
  \ GDPR 进行的。\n* 在必要时通过显著的内部和外部评估（如隐私认证）审查并更新措施。这些措施应考虑到处理的性质、范围、背景、目的以及对自然人权利和自由的风险。\n\
  \n在发生个人数据泄露的情况下，控制者应在获知泄露后不不延迟，并在可行的情况下不晚于 72 小时向监管机构报告泄露，除非个人数据泄露不太可能导致对自然人的权利和自由产生风险。如果未在\
  \ 72 小时内向监管机构通知，应说明理由。\n\n## 4.8 总结\n\n云计算是近年来最受欢迎的技术之一。其采用的主要障碍之一是安全和隐私。本章将此类分为三类。第一类包括安全威胁。第二类关于基础设施，最后一类包括服务。此外，重要的是，对云计算的信任取决于提供商保护数据和确保隐私的能力。云计算的安全是一项共同责任，但提供商必须实施强大的措施来赢得并维持用户的信任。\n\
