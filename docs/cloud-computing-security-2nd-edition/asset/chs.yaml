  ### 18.7 总结\n\n\n\n\n- 参考文献\n\n## 18.1 引言\n\n在过去的十年里，云存储已成为一种范式，承诺为现代 IT 基础设施提供可扩展的数据存储服务。与传统的本地存储基础设施相比，云存储提供了许多极具吸引力的优势，包括无处不在的网络访问、快速的弹性伸、基于用量的计费等（参见图\
  \ 18.1）。如今，将数据外包到公云存储已成为许多个人和小型企业的流行趋势，这导致了云存储普及度的急剧增长。这是因为云存储平台（例如 `Dropbox`、`Microsoft\
  \ OneDrive` 和 `Amazon S3`）不仅提供了用户友好、易于访问且更具成本效益的方法来存储和自动备份任意数据，还提供了用户之间的数据共享以及多个终端设备之间的同步。\n\
  \n![图 18.1 云存储服务示例。](img/fig18.1.jpg)\n\n图 18.1 云存储服务示例。\n\n尽管云存储提供了许多优势，但个人（尤其是企业）对于将数据托付给云存储服务仍然感到犹豫，因为使用云存储也让他们对外包到云端的数据完整性产生了担忧。例如，如果存储在云端的数据被攻击者损坏了怎么办？如果由于人为错误对存储的数据执行了错误操作怎么办？每个数据操作是否确实是由授权方执行的？这一问题之所以重要，是因为云存储平台（即使是知名的商业云存储平台）也可能遇到硬件/软件故障、人为错误和外部恶意攻击。此外，我们观察到，用户报告的数据损坏事件数量与服务提供商确认的数量之间存在巨大差异，这导致用户怀疑其云端数据是否真实完好。因此，在没有数据完整性强保证的情况下，云用户很难仅仅为了节省成本和服务灵活性就将数据迁移到云存储。\n\
  \n为了解决云存储中的完整性漏洞，并让云用户能够放心地无完整性担忧地将数据外包到云端，云存储完整性保障技术在今天备受期待。由于云用户无法像本地存储那样对数据拥有物理访问权限，因此要求他们通过本地存储策略直接检测数据损坏是不切实际的。例如，云用户必须从云服务器下载回数据进行完整性检查，考虑到外包到云端的数据规模，这显然是一个不切实际的解决方案。此外，由于存在许多有的内部/外部漏洞以及遗漏的数据损坏/丢失报告，云用户也不完全信任云服务提供商提供的数据完整性报告。因此，云用户渴望一种高效的方法，可以远程审计其外包到云服务器的数据完整性。考虑到云计算中实用的完整性审计方案的设计，我们需要支持以下重要（但不一定是完整列表）的特性：\n\
  \n*   **数据修改**：在云存储中，云用户不仅存储大型静态归档数据，还存储许多需要频繁修改的日常工作文件。在设计完整性审计方案时，云用户应该能够在享受完整性保证的同时，随时在云端修改他们的数据。\n\
  *   **数据共享**：数据共享是云存储最重要的功能之一，它让云用户的协作变得比以往任何时候都方便。考虑到这一重要特性，实用的数据完整性审计设计应该允许云用户共享的所有数据都能正确管理共享数据。具体而言，要确保每次数据修改确实是由授权的云用户执行的，并且数据之后保持完好并更新到最新。\n\
  *   **第三方完整性审计（公共可验证性）**：在当今的云计算中，第三方云管理代理（`CMB`）在云计算供应商和云用户之间扮演着重要的中介角色。由于云用户可能不了解如何在云计算中部署和管理他们的数据和服务，现在许多用户雇佣\
  \ `CMB` 来处理他们在云端的数据和服务。为了持续保证云端外包数据的完整性，应该定期进行完整性审计。在这种情况下，如果云用户还想将这些定期的完整性验证任务委托给\
  \ `CMB`，则需要公共完整性审计。通过公共完整性审计，`CMB` 可以在不知道云用户任何敏感数据的情况下代表云用户执行完整性验证。具体而言，公共完整性审计允许任何拥有公密钥的实体在没有数据所有者帮助的情况下检查数据完整性。\n\
  *   **可扩展性**：面对数据前所未有的增长，云存储因其人的特性已成为托管大数据的理想平台。在实践中，存储在云端的数据可以达到 TB 甚至 PB 级。为了为云存储提供高效且实用的完整性审计，在理想的审计方案中，用户的成本相对于数据大小应该是独立的，或者增长得非常缓慢（例如对数级增长）。另一个重要的可扩展性要求是对大量文件的高效支持。正如我们所知，云用户不仅在云端存储单个大文件，还存储了许多不同大小的文件。为了使完整性审计更具实用性，理想的完整性审计方案应该将大量文件的完整性审计聚合为少数几次操作。\n\
  \n为了给云存储提供完整性审计，主要有两类技术：可检索性证明（`POR`）（`Juels and Kaliski 2007`）和可证明数据占有（`PDP`）（`Ateniese\
  \ et al. 2007`）。`POR` 和 `PDP` 技术不是通过将存储在云端的数据下载回客户端进行完整性验证，而是让云用户能够通过检索一小部分证明信息来审计其云端数据的完整性。`POR`\
  \ 和 `PDP` 的主要区别在于在文件之上使用了纠删码。通过利用纠删码，`POR` 可以获得比 `PDP` 更好的错误检测概率。然而，使用纠删码也使得 `POR`\
  \ 无法像 `PDP` 那样支持高效的动态更新。因此，`POR` 方案主要用于确保云存储中归档文件（不变的文件）的完整性。`PDP` 方案旨在为存储在云服务器上的动态数据提供高效的完整性审计。\n\
  \n在本章中，我们首先介绍云存储完整性审计的系统模型和威胁模型。然后，我们回顾针对云存储第三方完整性审计提出的 `POR` 和 `PDP` 方案。最后，我们将介绍如何设计一种能够同时实现动态数据共享、多用户修改、公共可验证性以及在数据规模和文件数量方面具有高可扩展性的第三方完整性审计。\n\
  \n\n\n\n\n在考虑云存储的第三方完整性审计时，通常有三个主要实体，如图 18.2 所示：云服务器、云用户和第三方审计员（`TPA`）。云服务器是为云用户提供数据存储服务的方。云用户由许多普通用户和一个主用户组成，主用户是共享数据的所有者，并管理其他数据共享用户的成员关系。所有云用户都可以访问和修改数据。`TPA`指的是任何检查存储在云端数据完整性的方，例如\
  \ `CMB`。如果我们考虑公共完整性审计，只要该用户访问公密钥，`TPA` 实际上可以是任何云用户。一旦 `TPA` 在审计过程中检测到数据损坏，他们将向云用户报告错误。在系统中，数据可以由主用户或其他数据共享用户上传和修改。\n\
  \n![Figure 18.2 System architecture.](img/fig18.2.jpg)\n\n图 18.2 系统架构。\n\n整体完整性审计过程如图图\
  \ 18.2 所示。云用户首先为其想要存储在云服务器上的数据创建元数据，该元数据将与数据一起存储在云端。随后，`TPA` 可以向云服务器发送挑战消息进行完整性审计。接收挑战消息后，云服务器根据元数据创建证明信息，证明其正确存储了被挑战的数据。最后，`TPA`\
  \ 可以通过证明信息验证数据的完整性。\n\n### 18.2.2 威胁模型\n\n假设云服务器是“好奇但诚实”的，这与大多数商业云服务器的行为一致。具体而言，云服务器将遵循协议，但它可能会向用户关于其存储数据的损坏情况撒谎，以维护其服务的声誉。这种情况在现有的云存储平台中多次发生，无论有意无意：用户声称的数据丢失事件多于服务提供商承认的事件。在这种背景下，我们考虑可能影响数据完整性的以下因素：\n\
  \n1. `Byzantine failures`：硬件/软件故障以及系统管理员的操作错误\n2. `External adversaries`：自然灾害（如火灾和地震），以及攻击者通过修改和删除数据来破坏存储在云端数据的恶意黑客\n\
  3. `Unauthorized users`：那些没有数据访问权限但试图非法冒充合法用户的人\n\n由于合法用户始终被允许修改数据，我们假设他们总是诚实的。我们还假设每对实体之间存在安全的通信通道（例如，`SSL`）。\n\
  \n## 18.3 数据完整性审计技术回顾\n\n多年来，人们通过参考许多 `POR` 和 `PDP` 方案，对云数据完整性审计问题进行了广泛研究。在 Juels\
  \ 和 Kaliski (2007) 以及 Ateniese 等人 (2007) 的工作中，首次使用基于 `RSA` 的同态认证标签分别提出了 `POR` 和\
  \ `PDP` 概念。Juels 和 Kaliski (2007) 首次定义了 `POR`。\n\n## [18.3.1 POR 和 PDP 的演进]\n\n\
  多年来，人们通过参考许多 `POR` 和 `PDP` 方案，对云数据完整性审计问题进行了广泛研究。在 Juels 和 Kaliski (2007) 以及 Ateniese\
  \ 等人 (2007) 的工作中，首次使用基于 `RSA` 的同态认证标签分别提出了 `POR` 和 `PDP` 概念。Juels 和 Kaliski (2007)\
  \ 首次定义了 `POR`。\n\n## [18.3.2 云环境中的挑战]\n\n多年来，人们通过参考许多 `POR` 和 `PDP` 方案，对云数据完整性审计问题进行了广泛研究。在\
  \ Juels 和 Kaliski (2007) 以及 Ateniese 等人 (2007) 的工作中，首次使用基于 `RSA` 的同态认证标签分别提出了 `POR`\
  \ 和 `PDP` 概念。Juels 和 Kaliski (2007) 首次定义了 `POR`。\n\n## [18.3.3 多用户和动态扩展]\n\n多年来，人们通过参考许多\
  \ `POR` 和 `PDP` 方案，对云数据完整性审计问题进行了广泛研究。在 Juels 和 Kaliski (2007) 以及 Ateniese 等人 (2007)\
  \ 的工作中，首次使用基于 `RSA` 的同态认证标签分别提出了 `POR` 和 `PDP` 概念。Juels 和 Kaliski (2007) 首次定义了 `POR`。\n\
  \n## 18.4 实用的第三方完整性审计方案的设计\n\n在本节中，我们将介绍如何设计一种实用的第三方完整性审计方案。在提供详细构造之前，我们将介绍构造中将使用的技术预备和符号。\n\
  \n### 18.4.1 技术预备和符号\n\n\n\n\n\n# Shamir 秘密共享\n\nShamir 秘密共享：一种 `(k,n)` Shamir 秘密共享方案\
  \ (Shamir 1979) 根据多项式将秘密 `S` 分解为 `n` 个份额。通过任意 `k` 个份额，就可以恢复秘密 `S`。然而，仅有任意 `k − 1`\
  \ 个或更少的份额将使得秘密处于完全未定的状态。具体而言，由于 `k` 个点可以唯一地确定一个次数为 `k − 1` 的多项式，通过从大小为 `q` 的有限文件中随机选择\
  \ `k − 1` 个正整数 `a[1] + a[2] + … + a[k][–1]` 并设置 `a[0] = S`，我们可以构造出多项式：`f(x) = a[0]\
  \ + a[1] x + a[2] x² + … + a[k][–1] x ^k^(–1)`。其中 `a[i] < q` 且 `q` 是质数。当有 `n` 个参与者共享秘密\
  \ `S` 时，我们可以从 `f(x)` 构造出 `n` 个点 `(j,f(j))`，`1≤ j ≤ n`，并给每个参与者一个点。之后，给定这 `n` 个点中的任意\
  \ `k` 个，可以使用多项式插值法计算 `f(x)` 的系数并恢复常数项 `[α0]`，该项被设置为秘密 `S`。关于 Shamir 秘密共享方案的更多细节，请参考\
  \ Shamir (1979)。\n\n# 双线性映射\n\n双线性映射：双线性映射定义为 `e: G × G → G[1]`，其中 `G` 和 `G[1]`\
