  \n## 24.3 英特尔可信执行技术 (Intel Trusted Execution Technology)\n\n### 24.3.1 静态信任链\n\n\
  ### 24.3.2 动态信任链\n\n### 24.3.3 平台配置寄存器\n\n### 24.3.4 静态测量\n\n### 24.3.5 动态测量\n\n\
  ## 24.4 可信计算用例\n\n### 24.5 Trapezoid 的可见性\n\n## 24.6 总结\n\n## 参考文献\n\n## 24.1 引言\n\
  可信计算包含了对优于此类行业标准的需求。它还要求将尖端技术作为保障云安全的差异化优势。\n\n本章旨在通过 `UEFI`（可扩展固件接口）和 `SMM`（系统管理模式）等技术来更好地定义`可信计算`。我们将关注使用\
  \ `PCR`（平台配置寄存器）的`静态测量`和`动态测量`。\n\n`云安全联盟`（Cloud Security Alliance）通过为每个云供应商提供内部视角来提供帮助，但硬币的另一面是订阅者！这就是`开放数据中心联盟`（Open\
  \ Data Center Alliance，简称 `ODCA`）的作用。`ODCA` 的目标是通过根据我们想要订阅的云服务添加服务级别来进一步标准化，无论是`基础设施即服务`（`IaaS`）还是`平台即服务`（`PaaS`）。\n\
  \n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\n\n可信计算组（`TCG`）是一个致力于硬件硬件信任根标准化的组织。他们帮助开发了一种名为`信任平台模块`（`TPM`）的小型芯片组，该模块允许在硬件上执行可信的加密序列，并将测量结果存储在该芯片中。关于此点的规格和信息的完整目录可以在\
  \ `TCG` 网站上找到。`TPM` 模块基本上允许对某些可测量的平台行为进行报告。这使得能够判断即使是包含相同组件的物理上不同的平台，是否具有相同的测量值。`TPM`\
  \ 模块通过识别其所部署平台的硬件组件和软件组件来实现这一目标。\n\n`TCG` 规范中定义的不同概念不仅限于其 `TPM` 库中（`TCG` 于 2014\
  \ 年发布）提到的术语和定义库。我们将触及这里介绍的一些概念，但为了简洁起见，将不会完整涵盖这部分规范。那么，为什么这样一个如此小的附加芯片组会成为构建可信计算环境不可或缺的一部分呢？让我们从上述文档中涉及的基础可信计算概念开始。\n\
  \n我们首先需要确定哪些核心概念对于理解定义什么是可信计算非常重要。这些概念在文档中总结为可信构建块、可信计算基础、信任边界、传递信任和信任权威（`TCG` 于\
  \ 2014 年发布）。我们将仅触及信任边界、传递信任以及 `TPM` 和信任根。首先，让我们讨论一下什么是信任根。信任根是一种确保某些组件经过了评估的方法，并确定硬件是按照\
  \ `TCG` 规范在工厂组装的。例如，`OEM` 可以为需要正确组装 `TPM` 的系统拥有签名的证书。这尤其重要，因为当我们试图追踪可信计算系统供应链上游和下游发生的情况时。\n\
  \n随着行业继续追赶为什么以及如何使用这些 `TPM` 芯片，重要的是，对于大多数硬件来说，添加此芯片组的安全功能的成本是极小的。在上述提到的安全组件中，本章旨在简要触及每种组件，用通用术语解释它们各自代表什么。这将为本章后续内容的讨论奠基础。它还将帮助定义如何使用此\
  \ `TPM` 来帮助保护服务器并构建可信服务器工作负载。可信计算要求不仅能从软件层面验证真实性，更重要的是从硬件层面进行验证。这就是 `TPM` 通过添加安全功能来确保的，这些功能可以被用于将操作系统（`OS`）、硬件和自定义控制结合在一起，作为服务器/虚拟机管理程序硬件和软件上过去正确、现在正确且应该是正确的更佳指标。\n\
  \n信任边界是由 `TPM` 提取的测量值，并结合信任根来定义边界。通过这种方式，我们能够确保所取的测量值可以选择代码是否能够在系统上执行。因此，`TPM` 可以提供几种安全功能：平台配置寄存器、`SHA-1\
  \ 引擎`、非易失性存储、随机数生成、`RSA 引擎`、密钥生成和身份验证密钥（见图 24.4）。\n\n![图 24.4 信任平台模块安全功能 (TPM)。](img/fig24.4.jpg)\n\
  \n图 24.4 信任平台模块安全功能 (TPM)。\n\n### 24.2.1 TPM 安全功能概述\n\n列表中的第一个是平台配置寄存器，或 `PCRs`。`TPM`\
  \ 允许通过此功能进行身份验证或允许启动控制策略。这是一个非常重要的角色，因为它允许对硬件组件（包括 `BIOS`）的更改进行测量。`PCRs` 是用于这些测量值的特殊保护寄存器，存储在\
  \ 20 字节的哈希摘要中。其工作原理是，让 `TPM` 在硬件启动时对其所连接的硬件元素进行测量。然后它通过附加其值来扩展此 `PCR`，并使用 `SHA-1\
  \ 引擎`对所有元素进行哈希处理，从而给出这些值的结果性哈希摘要。需要说明的一点是，实体无法写入此 `TPM`，只能从上述操作读取扩展后的哈希值。\n\n接下来我们将介绍什么是\
  \ `TPM` 非易失性存储，与当今市场上的大多数计算机相比，它非常微小，大约只有 2000 字节。此内存存储了哈希值的索引，并提供读取或写入访问。在上述提到的安全组件中，本章旨在简要触及每种组件，用通用术语解释它们各自代表什么。这将为本章后续内容的讨论奠基础。它还将帮助定义如何使用此\
  \ `TPM` 来帮助保护服务器并构建可信服务器工作负载。可信计算要求不仅能从软件层面验证真实性，更重要的是从硬件层面进行验证。这就是 `TPM` 通过添加安全功能来确保的，这些功能可以被用于将操作系统（`OS`）、硬件和自定义控制结合在一起，作为服务器/虚拟机管理程序硬件和软件上过去正确、现在正确且应该是正确的更佳指标。\n\
  \n信任边界是由 `TPM` 提取的测量值，并结合信任根来定义边界。通过这种方式，我们能够确保所取的测量值可以选择代码是否能够在系统上执行。因此，`TPM` 可以提供几种安全功能：平台配置寄存器、`SHA-1\
  \ 引擎`、非易失性存储、随机数生成、`RSA 引擎`、密钥生成和身份验证密钥（见图 24.4）。\n\n### 24.3 英特尔可信执行技术\n\n现在我们已经有了\
  \ `TPM` 模块的总结概述，下一个问题是我们如何安全地实现它并帮助利用其力量和功能？这就是英特尔介入并在其主板上集成英特尔 `TXT` 的地方。英特尔 `TXT`\
  \ 是我们可以利用英特尔主板上的 `TPM` 芯片来结合操作系统和硬件，并开始解决我们目前面临的硬件安全挑战的方法。通过这种组合，我们可以建立基准，并确保我们正在追踪可能的供应链破坏并建立工作负载的安全执行。\n\
  \n\n\n\n\nIntel TXT 通过为其硬件建立安全基准，为服务器及其存储的信息提供了更多保护。`Intel TXT` 密封加密密钥和度量值以防止恶意代码和固件攻击，并为服务器上的\
  \ `TPM` 建立了启动时度量。它还将这些信息扩展到证明机制中，这些机制可以快速、有效地检测白名单值和变化，并作为系统出现异常或系统发生未记录更改的指标。当系统存储着敏感数据（如信用卡数据或个人身份信息\
  \ ****PII**，例如社会安全号）时，这一点尤为重要。\n\n所采取的度量被分为两个主要子部分：静态信任链和动态信任链。它们共同工作，为相关系统形成信任配置文件，并将硬件度量与操作系统度量相结合，以确保无论使用独立操作系统还是虚拟机管理程序，都能为服务器上的工作负载提供该受信任配置。静态信任链在初始测量硬件和\
  \ BIOS 组件，而动态信任链则从主引导记录（MBR）一直到操作系统/虚拟机管理程序的启动进行度量（Intel 公司，2012）。让我们进一步探讨这两个组件，以帮助解释它们如何独立以及共同工作。\n\
  \n### 24.3.1 静态信任链\n\n静态信任链度量是在可信计算系统启动时进行的。它始于处理器的嵌入式微代码，称为认证代码模块（`ACM`），英特在某些处理器上提供该模块。它首先测量\
  \ BIOS 代码，并将哈希值存储在 `TPM` 内部的 `PCRs` 中。在锁定这些值之后，在执行任何额外代码之前，会对该度量进行安全检查，然后将这些度量值锁定在\
  \ `TPM` 中。结果是锁定的 `PCRs`，它们在执行机器上包括 BIOS 在内的任何代码之前，就已经测量了硬件并在 `TPM` 中锁定了值。\n\n###\
  \ 24.3.2 动态信任链\n\n动态信任链在操作系统请求安全启动后开始。这是通过一个特殊的处理器指令对 `ACM` 进行测量。这包括验证 BIOS 是否通过了安全检查并已正确锁定。操作系统是下一个度量对象，反过来将确保其启动控制策略（`LCP`）正确地信任操作系统的\
  \ `ACM` 度量。这一切都在在本章开头提到的用于可信操作系统的相同 TCG 规范处理下（TCG 发布于 2014 年）。下图总结了这两者以及涉及的顺序（见[图\
  \ 24.5]）。\n\n![Figure 24.5 信任链工作流。](img/fig24.5.jpg)\n\n图 24.5 信任链工作流。\n\n重要的是，`Intel\
  \ TXT` 并不定义信任参数；相反，它允许我们在 `TPM` 上安全地存储引导前的度量值。这允许组织做出自己的信任决策，并为该组织的“可信操作系统”设定特定的指南。目前，这项技术仅用于主机操作系统或虚拟机管理程序，不包括任何客户操作系统或\
  \ Linux 容器（通常称为虚拟工作负载）的功能。现在已经解释了这一点，让我们深入研究它提供了哪些度量，以便我们根据在正确配置的可信操作系统中所采取的硬件和软件度量来做出信任决策。\n\
  \n### 24.3.3 平台配置寄存器\n\n到目前为止，我们描述了测量 BIOS 和操作系统所涉及的技术。所采取的这些度量存储在 `TPM` 中，其构建方式建立在之前的每一次检查和度量的基础上。这一过程就是所谓的“扩展\
  \ `PCRs`”。这些值在启动时被锁定，仅在重新启动相关机器时进行测量。这允许 `PCRs` 能够整洁地扩展，如前所述，这是一项启动时技术。现在，这些 `PCRs`\
  \ 是什么，它们为什么重要？\n\n`PCRs` 并不是精确的度量值，而是系列多个度量值，这些值由 `TPM` 按特定顺序进行哈希和扩展。这些扩展是非常重要的，因为它们可以指示系统硬件和操作系统的变化（例如恶意软件）。正是这种每次进行扩展的精确过程，通过拥有已知的良好度量和一个会导致检查这些值的策略，增加了价值，从而提高了系统的信任度。生成的\
  \ `PCRs` 集合为任何系统管理员提供了价值，确保任何正确配置的硬件都符合公司的可信系统策略。这些 `PCRs` 分为两类：静态和动态 `PCR` 度量。\n\
  \n### 24.3.4 静态 PCR 度量\n\n静态度量是在操作系统启动之前应用那些检查和验证。这些度量包括 16 个 `PCRs`（从 `PCR 0` 到\
  \ `15`），它们涵盖了操作系统启动前的硬件状态。这些值一直扩展在 `TPM` 上，直到服务器重启，届时它们将再次被进行测量和验证。以下是静态 `PCRs`\
  \ 列表以及它们在系统中实际测量的内容：\n\n*   `PCR0`—BIOS\n*   `PCR1`—主机配置\n*   `PCR2`—扩展 ROM 代码\n\
  *   `PCR3`—扩展 ROM 数据\n*   `PCR4`—通常为 MBR 或初始程序加载器（`IPL`）\n*   `PCR5`—IPL 数据\n* \
  \  `PCR6`—状态更改表\n*   `PCR7`—制造商控制\n*   `PCR8` 到 `15`—留给操作系统\n\n正如我们看到的，静态 `PCR`\
  \ 度量可以为我们提供大量信息。一段时间内系统启动的静态度量视图以及那里的扩展的哈希值，可以从上次启动到当前服务器值的启动时间产生许多结果。我们还没有结束这个扩展\
  \ `PCRs` 列表。在下文中，将在动态 `PCR` 度量中讨论该生态系统中的下一个值。\n\n### 24.3.5 动态 PCR 度量\n\n在有了上述静态度量后，我们进入下一个扩展值。动态\
  \ PCR 度量或动态信任根度量（`DRTM`）预留给操作系统启动，并且可以在不重置平台的情况下重置。它们之所以重要是因为它们构建在硬件链之上，并开始确保操作系统及其任何模块都经过测量和扩展以供进一步验证。这些\
  \ DRTM `PCRs` 如下：\n\n*   `PCR16`—调试\n*   `PCR17`—启动控制策略和 `DRTM`\n*   `PCR18` 到 `22`—留给可信操作系统使用，包括配置和加载的内核模块\n\
  \n通过这种扩展度量的结合，未记录更改的可视性更容易检测并更容易受到审查。`Intel TXT` 与 TCG `TPM` 模块的结合，使系统管理员和云运营能够能够洞察当今最具破坏性的恶意软件和根程序。重启时作为\
  \ BIOS 更新安装的根程序将报告这些任何值或工作负载的重大变化，从而可以将它们迁移到新的、更可信的主机组。\n\n## 24.4 可信计算用例\n\n\n\n\
  \n现在我们已经讨论了可信计算系统所有的硬件安全组件，但利用这项技术究竟能做什么呢？我们完全可以在带有 `TPM` 和 `Intel TXT` 的系统上设置启动时策略，检查\
  \ BIOS 测量值，并允许或不允许操作系统启动。这确实能为我们提供一些线索，但它无法让管理员知道系统无法正常启动的原因，导致时间和金钱被浪费在徒劳的搜索上。通过操作系统的集成，我们有机会启动一个可信的操作系统，该系统可以从与\
  \ `Intel TXT` 接口的 `TPM` 读取 `PCRs`，让系统管理员能够更清晰地了解哪些测量值被扩展，并使用其他安全策略执行工具做出更明智的决策。\n\
  \n随着能够洞察硬件的出现，我们还可以查看历史测量值，并对系统是否可信、信任何时发生变化以及哪些值预期会或不会发生变化做出明智的决策。因此，一旦操作系统作为可信系统启动，我们就可以查询操作系统获取扩展测量值，并让其报告这些测量值以供分析。我们在此再次强调，`Intel\
  \ TXT` 和 `TPM` 是启动时技术，这意味着这些测量仅在系统冷启动时进行。因此，作为可信计算系统的一部分，我们必须有一种重启策略，以便对想要监控的系统获取新的测量值。这仍然需要操作系统对这些值进行新的查询，并由系统管理员对所有值进行手动分析。这可能是非常乏味的，而且到目前为止，由于手动分析和检测这些变化的过程过于繁琐，许多系统管理员还没有尝试过。行业是否会使用这项技术取决于使用该技术的投入程度和/或自动化程度。但到目前为止，Trapezoid\
  \ 信任可见性引擎使得这一切变得更加简单，它不仅自动化了 `Intel TXT` 的配置，还提供了一个可以重放旧值并在检测到变化时发出警的引擎。\n\n## 24.5\
  \ Trapezoid 信任可见性引擎\n\n由于及时检测到硬件信任根的任何变化至关重要，Trapezoid 的信任可见性引擎 (`TVE`) 开始从不同的角度来看这个问题。Trapezoid\
  \ 增加了一种功能，允许我们在服务器的 `PCR 22` 中配置一个自定义值，称之为 Trapezoid 信任标记。这是一项专利技术，允许在可信操作系统部署到服务器的\
  \ `TPM` 芯片之前，为硬件写入唯一的加密标记，并在部署后通过可信操作系统传递该标记，从而为其稳健的报告机制增加另一个层级。这提供了虚拟机到物理硬件的取证映射。此外，它还通过提供数字水印帮助用户定义工作负载和数据边界。它们不是一种执行工具，而更像是一个可信系统记录工具或某种视频录像机，内置了基于信任的关联分析和变化报警。它们起初尝试减少任何供应链的破坏，并很快开始尝试解决获取上述可信计算技术可见性的更性问题。\n\
  \n该平台的工作方式是跟踪任何值，并通过其控制台报告硬件发生了哪些变化。Trapezoid `TVE` 是一项企业级云安全合规工具，用于监控和报告跨越云基础设施中单个设备的信任级别。通过从\
  \ BIOS 层验证系统完整性，Trapezoid `TVE` 引入了新的安全层，用于保护单个系统免受其他单个系统的影响。\n\n## 24.6 总结\n\n\
  随着更多客户端技术的出现（以及 `TPMs` 和 `Intel TXT` 对客户变得可用），组织是否拥有相应的技能和知识来正确利用它们——更不用说配置它们了。\n\
