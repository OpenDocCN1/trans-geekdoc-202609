  \ [i]`。如果该等式成立，则 TPA 信任数据已正确存储在云端；否则，TPA 将通知云用户其存储在云端的数据已损坏。验证的正确性可以通过以下方程于验证：\n\
  \n```\n| π ⋅ e ( k 0 − y , g R ) || |\n| \\= ∏ i \\in D e u B i p i ⋅ g f β i →\
  \ ( α ) , g ∈ 0 R ⋅ e g − y , g ∈ 0 R \\= ∏ i \\in D e u B i p i , g ∈ 0 R ⋅ e g\
  \ f A → ( α ) , g ∈ 0 R ⋅ e g − y , g ∈ 0 R \\= e u ∑ i \\in D B i p i i , g ∈ 0\
  \ R ⋅ e g f w → ( α ) , g x − μ \\∈ 0 R \\= e η , k 0 R ⋅ e φ R , v ⋅ k 0 − μ ||\
  \ |\n```\n\n### 18.4.2.6 用户撤销—基础\n\n我们首先提供一种基础的用户撤销设计。我们还将介绍一种改进了可靠性的进级用户撤销版本。每当有用户需要被撤销时（例如\
  \ `u[k]`，`k ≠ 0`），主用户 `u[0]` 首先计算 `χ \\= ε 0 + ρ` 并将其发送给 TPA。然后，云服务器更新由被撤销用户最后修改的元数据为\
  \ `σ i = u B i ⋅ g f β i → ( α )`。最后，TPA 丢弃密钥。\n\n注意，所有由撤销用户生成的元数据都会被更新。取决于被撤销用户修改的元数据数量，这些更新操作在通信和计算上可能很大。为了减轻主用户的潜在负担，我们的设计将所有更新操作安全地外交给云。\n\
  \n### 18.4.2.7 用户撤销—进级\n\n在基础的用户撤销设计中，我们利用单个云节点来更新元数据。在这种情况下，如果负责元数据更新的云节点遭到，被撤销的用户将能够再次生成元数据。因此，为了防止这种类型的破坏并增强我们设计的可靠性，我们独特地在设计中引入了\
  \ (U,N) 秘密共享技术，并将 `χ` 和元数据更新过程分配到多个云节点。\n\n具体而言，不再像基础设计那样将 `χ` 发送给单个云节点，主用户 `u[0]`\
  \ 对 `χ` 执行 (U,N) 秘密共享并生成 `N` 个点 `(j, f(j))`，这些点属于一个 `U – 1` 次多项式 `f(x) = χ + a[1]\
  \ x + a[2] x² + … + a[U][–1] x ^U^(–1)`。`u[0]` 将 `N` 个点发送到 `N` 个云节点。然后，为了更新元数据 `σ`，任何带有\
  \ `f(x)` 上点 `(j, f(j))` 的 `U` 个云节点计算拉格朗基多项式 `L i ( x ) \\= ∏ 0 ≤ m ≤ U , m ≠ j (x\
  \ − x m)/(x j − x m)`。之后，每个云节点更新元数据的片段 `σ ′ j \\= σ f ( j ) L j ( 0 )`。这些更新后的元数据片段将被聚合以生成最终的更新元数据\
  \ `σ ′ \\= ∏ 1 ≤ j ≤ U σ ′ j \\= σ ∑ j \\= 0 U f ( j ) L j ( 0 ) \\= σ χ`。\n\n\n\
  \n\n请注意，U 个云节点可以并行更新自己的元数据片段而无需相互交互，因此它可以实现与单个云节点更新相当的实时更新性能。在我们的元数据聚合过程中，每个节点的共享\
  \ `χ` 被构建到它们对应的元数据片段中。因此，即使攻击者破坏了聚合元数据片段的云节点，他们也无法访问并恢复共享的 `χ` 分段。通过我们先进的设计，攻击者必须同时攻破至少\
  \ U 个具有共享秘密的云节点才能恢复秘密 `χ`，因为 `χ` 是使用 Shamir 秘密共享方案共享给 U 个云用户的，而掌握任何 `U − 1` 个或更少的片段将使得秘密完全无法确定。\n\
  \n## 18.4.2.8 多文件审计（Multifile Auditing）\n\n在如今的云存储中，云用户存储大量文件。为了挑战所有文件的完整性，如果 TPA（第三方审计机构）可以将完整性审计操作聚合为一次挑战和一次验证以降低成本，将是非常理想的。为此，我们基于单文件审计设计引入批处理审计设计，并使\
  \ TPA 能够以单文件场景相当的成本处理多个文件的完整性审计。在批处理审计设计中，设置和更新过程与单文件场景相同。在这里，我们重点介绍批处理挑战、批处理证明和批处理验证的设计。\n\
  \n对 T 个文件审计挑战过程与单文件场景相同。注意的是，挑战消息 `CM = {D, X, g ^R , µ}` 现在包含了所有 T 个文件数据块的信息。\n\
  \n在接收挑战消息 `CM = {D, X, g ^R , µ}` 后，云端首先为每个单文件创建证明信息并生成 `φ[t]`, `π[t]`，`1 ≤ t ≤\
  \ T`。然后，云端将证明信息聚合为两个元素：`π = ∏ t = 1 T π t` 和 `φ = ∏ t = 1 T φ t`，如图 18.8 所示。云端还计算\
  \ `y = f A → ( u ) mod   q`，其中 `A → = { 0 , 0 , ∑ t = 1 T ∑ i ∈ D p i m t i , 0\
  \ , … , ∑ t = 1 T ∑ i ∈ D p i m t i , s t − 1 }`。最后，云端向 TPA 证明信息 `Prf = {π, φ, y}`。\n\
  \n![Figure 18.8 Batch prove.](img/fig18.8.jpg)\n\n图 18.8 批处理证明。\n\n在接收证明信息 `Prf`\
  \ 后，TPA 首先计算 `η = u ∑ t = 1 T ∑ i ∈ D p i B t i`。然后，TPA 可以通过以下方程共同验证 T 个文件的完整性：\n\
  \n```\n| e ( η , k 0 R ) ⋅ e ( φ R , v ⋅ k 0 − μ ) = ? π ⋅ e ( k 0 − y , g R ) ||\
  \ |\n```\n\n如果该方程成立，则 TPA 信任数据已正确存储在云端；否则，TPA 通知云用户其在云端的数据已损坏。根据上述批处理验证构造，我们可以看到，TPA\
  \ 审计 T 个文件所需的计算操作与审计一个文件几乎相同。\n\n## 18.5 第三方完整性审计设计的评估\n\n在本节中，我们将评估所提构造的性能。具体而言，我们将使用数值分析和实验结果来讨论我们构造的错误检测概率和审计效率。\n\
  \n### 18.5.1 错误检测概率\n\n在我们的设计中，我们没有选择文件所有的数据块来审计其完整性，而是随机选择 `d` 个块作为集合 `D`，以便在保持可接受错误检测概率的同时节省通信和计算成本。具体而言，正如\
  \ Ateniese 等人（2007）所示，错误检测概率为 `P = 1 – (1 – E)^d`，其中 `E` 是错误率。因此，如果有 1% 的数据块被损坏，460\
  \ 个挑战数据块将产生 99% 的检测概率，而 95% 的检测概率只需要 300 个挑战块，尽管文件中数据块的总数（分别大于 460 和 300）。因此，一旦确定了错误检测概率，在我们的方案中数量\
  \ `d` 可以被视为固定值。\n\n为了针对小数据损坏率实现高错误检测概率，我们的设计可以增加集合 `D` 的大小。例如，如果系统要求对 0.1% 的数据损坏率具有\
  \ 99% 的检测置信度，则集合 `D` 的大小可以设为 `4603`。在性能评估部分，我们将证明增加集合 `D` 的大小以获得更好的错误检测置信度对我们的审计性能影响影响。为了进一步提高错误检测概率，TPA\
  \ 可以通过我们的批处理审计同时审计多个文件。特别是，如果 TPA 同时审计 T 个文件且每个文件的检测概率为 `P [t]`，则它将获得错误检测概率 `P =\
  \ 1 – (1 – P [t] )^T`。例如，当我们设置 `T = 5` 且 `P [t] = 95%` 时，可以获得 `P = 99.99%`，这明显高于单文件的检测概率。\n\
  \n### 18.5.2 评估\n\n在本节中，我们首先从计算成本和通信成本的角度对第三方完整性审计设计进行数值分析，然后展示其实验性能。在本章的剩余部分，我们使用\
  \ `EXP` 和 `MUL` 分别表示在群 G 上执行幂运算和乘法运算的复杂度。当操作在椭圆上进行时，`EXP` 意味着标量乘法运算，`MUL` 意味着一次点加运算。我们在评估中忽略了哈希操作，因为其成本相对于\
  \ `EXP`、`MUL` 和配对运算来说可以忽略不计。\n\n#### 18.5.2.1 数值分析—计算成本\n\n\n\n\n\n在我们的设计中，方案包含六种算法：`setup`、`challenge`、`update`、`prove`、`verify`\
  \ 和 `user revocation`。`Setup` 是一个预处理过程，由组用户离线完成，不会影响实时验证性能。在 `setup` 算法中，主用户首先需要执行\
  \ `(s+K+4)` 次 `EXP` 操作来生成公钥、系统主密钥以及用户密钥，其中 `s` 是块中的元素数量，`K` 是组用户的数量。处理一个数据文件时，主用户对每个文件执行\
  \ `(s+2)n` 次 `EXP` 操作和 `sn` 次 `MUL` 操作，其中 `n` 是文件中块的数量。当用户需要修改或添加数据块时，执行 `update`\
  \ 算法，通过 `(s+2)EXP+(s+1)MUL` 操作生成相应的元数据。为了检查文件的完整性，TPA 执行 `challenge` 算法来生成挑战消息 `CM`。在\
  \ `CM` 中，根据给定的系统需求选择固定数量的随机数的代价可以忽略不计。要在 `CM` 中生成集合 `X`，TPA 需要执行 `|C|` 次 `EXP` 操作，其中\
  \ `|C|` 正修改最新文件块的用户数量。注意，集合 `X` 可以由 TPA 预计算并存储，而不会影响实时审计性能。例如，一个 1000 用户的用户组在单轮完整性审计中，TPA\
  \ 仅需集合 `X` 的任何可能元素存储 128 KB（多个文件的审计大小也相同）。随后，云服务器运行 `prove` 算法，涉及 `s` 次 `EXP`、`(s+d)`\
  \ 次 `MUL` 和 `d` 次配对操作，其中 `d` 是用于挑战的固定数量块。为了验证文件的完整性，TPA 仅需 `6` 次 `EXP`、`3` 次 `MUL`\
  \ 和 `3` 次配对操作。如果某些块是由被撤销的用户最后修改的，与没有用户撤销的情况相比，TPA 需多执行一次 `EXP` 操作。在同时验证多个文件的情况下，我们的设计可以将这些文件的验证操作进行批量处理并聚合为一个操作。因此，TPA\
  \ 执行多文件检查仅需 `6` 次 `EXP`、`3` 次 `MUL` 和 `3` 次配对操作，其代价与单文件场景相同。撤销一个组用户时，主用户仅需一次 `EXP`\
  \ 操作。云服务器需要 `Y` 次 `EXP` 操作来更新相应的元数据，其中 `Y` 是被撤销用户最后修改的数据块数量。考虑到我们先进的用户撤销设计，`U` 个云节点将并行执行\
  \ `UY` 次 `EXP` 和 `UY` 次 `MUL` 操作来更新由被撤销用户修改的元数据。\n\n### 18.5.2.2 数值分析——通信开\n\n在我们的设计中，数据完整性审计的通信代价主要来自日志记录、挑战消息\
  \ `CM` 和证明信息 `Prf`。为了生成挑战消息，TPA 需要大小为 `d*|log|` 的 次日志记录（通常日志记录的大小为 16 字节）。`CM =\
  \ {D, X, g ^R, µ}` 的大小为 `d*index+(|C|+1)|G|+λ` 位，其中 `index` 是块索引的大小，`|G|` 是组元素的大小。如果某些块是由被撤销的用户最后修改的，则\
  \ `CM` 中额外包含一个大小为 `|G|` 的组元素。对于证明信息 `Prf = {π, ψ, y}`，有两个组元素和一个位数为 `2|G|+ λ` 的多项式结果。因此，一个完整性验证任务的总通信代价为\
  \ `d*index+(|C|+3)|G|+2λ` 位。考虑到多个文件的同时检查，我们的批量验证设计允许用户将这些任务聚合为一个挑战和一个证明，从而实现与单文件场景相同的通信开销。当发生用户撤销时，我们的方案仅需主用户向云端发送一个组元素，并在公钥中添加一个组元素。\n\
  \n### 18.5.2.3 实验评估\n\n在本节中，我们对该设计提供了实验评估。具体而言，我们将根据不同的数据大小、不同的数据修改数量以及不同的审计文件数量，评估设计中每个阶段的性能。\n\
  \n#### 18.5.2.3.1 实验设置\n\n本章介绍的完整性审计设计可以使用 `JAVA` 结合 `JAVA` 基于配对的密码学库(`jPBC`) (Iovino\
  \ and Caro 2011) 实现。在云服务器上，我们部署了运行 `Linux` 具有 8 核 CPU 和 32 GB 内存的节点。验证者是运行 `Linux`、配备\
  \ 3.4 GHz Intel i7-3770 CPU 和 16 GB 内存的台式机。组用户的机器运行 `Linux`、配备 2.50 GHz Intel i5-2520\
  \ M CPU 和 8 GB 内存的笔记本电脑。我们将安全参数设置为 `λ=160` 位，由于我们的实现基于椭圆曲线密码学，这等同于 1024 位的 RSA 安全性。数据块大小设置为\
  \ `4` KB。为了验证设计在数据大小和文件数量方面的可扩展性，我们将单文件大小从 8 MB 改到 512 MB，并将审计文件数量从 16 增加到 2000。注意，集合\
  \ `X` 可以由 TPA 预计算并存储，而不影响实时审计性能。例如，一个 1000 用户的用户组在单轮完整性审计中，TPA 仅需集合 `X` 的任何可能元素存储\
  \ 128 KB（多个文件的审计大小相同）。\n\n#### 18.5.2.3.2 单文件审计性能\n\n正如 18.5.1 节所述，我们将挑战块的数量设置为\
  \ `460` 以实现 99% 的检测概率。我们首先根据文件大小测量我们设计的审计性能。表 18.1 显示，TPA 的计算代价和通信开销相对于文件大小是保持恒定的；即文件大小对\
  \ TPA 没有影响，这与我们之前在 18.5.2.1 和 18.5.2.2 节中的分析一致。\n\n表 18.1 不同文件大小下 TPA 的审计代价\n\n\
  ![](img/T18.1)\n\n我们还评估了用户数量对设计性能的影响。如表 18.2 所示，我们设计的计算/通信代价与最后修改挑战块的用户有关。在理想情况下，没有组用户修改过这些数据块；但在最坏情况下，`D`\
  \ 中的每个数据块都由不同的组用户修改过。在实验中，我们将此类组用户的数量从 0 变化到 460（回想一下，我们在实验中将挑战块的数量设置为 460），并评估其对系统性能的影响。表\
  \ 18.2 显示，TPA 的计算代价是恒定的，与最后修改挑战块的用户数量无关。这是因为我们的设计可以在审计过程中将不同用户密钥下的元数据转换为相同的格式，从而将计算任务聚合为固定的数量。然而，通信开销随最后修改挑战块的用户数量成比例增加，如表\
  \ 18.2 所示。这是因为 TPA 需要为每个最后修改挑战块的用户在挑战消息中添加一个组元素。注意，在最坏情况下（即 460 个用户修改了 D 中的 460\
  \ 个挑战数据块），我们设计的通信代价在 77 KB 以内，可以通过大多数现代网络进行高效传输。所有实验结果代表 50 次试验的平均值。\n\n表 18.2 不同挑战数据块修改数量下\
  \ TPA 的审计代价\n\n![](img/T18.2)\n\n#### 18.5.2.3.3 多文件审计性能\n\n\n\n\n\n为了展示我们的批量审计设计在多文件场景下的优势，我们将并行审计任务的数量从\
  \ `16` 改为 `2000`。在这里，我们测量了每个文件的平均完整性审计成本，并将批量审计设计与直接审计（即逐个处理任务）进行了对比。如图 18.9 所示，与直接审计相比，我们的批量审计在\
  \ `TPA` 上的平均计算成本与任务数量几乎成反比。这是因为我们的设计允许将最昂贵的审计操作聚合在一起。每个额外的审计任务只引入常数次的哈希操作，这些操作效率极高。图\
  \ 18.10 显示，我们的批量审计设计还减少了约 60%的平均通信成本。因此，我们的批量审计设计在任务数量方面显著增强了该方案的可扩展性。\n\n![图 18.9\
  \ 不同任务数量下的平均用户验证时间。](img/fig18.9.jpg)\n\n图 18.9 不同任务数量下的平均用户验证时间。\n\n![图 18.10 不同任务数量下的平均验证通信成本。](img/fig18.10.jpg)\n\
  \n图 18.10 不同任务数量下的平均验证通信成本。\n\n从上述实验结果可以清楚看出，文件大小对完整性审计的实时性能没有任何影响。此外，我们的设计可以高效处理大规模组和/或大量任务。因此，所提出的第三方完整性保障设计在文件/组大小以及任务数量方面具有高的可扩展性。\n\
  \n## 18.6 讨论\n\n我们现在讨论可能影响我们构造性能的因素。特别，我们将讨论我们的构造在小文件和不同块大小下的性能。\n\n### 18.6.1 小文件的完整性审计性能\n\
  \n正如错误检测概率章节所述，如果纠删码的容错传输率为 `1%`，用户可以随机挑战 `460` 个数据块来实现 `99%` 的错误检测概率。对于少于 `460`\
  \ 个数据块的小文件，用户可以简单地挑战所有数据块以来实现 100% 的错误检测概率。\n\n### 18.6.2 块大小与系统性能\n\n不同的云存储平台出于性能考虑需要不同的块大小。例如\
  \ `Amazon Elastic Block Store`，其中块大小是影响性能（如 `IOPS`（每秒输入/输出次数）率）的重要因素。正如评估章节所述的，我们方案的完整性审计性能独立于块大小，这意味着我们的方案可以高效地应用于偏好不同块大小的云存储平台。\n\
  \n## 18.7 总结\n\n在本章中，我们研究了当今云存储环境中存在的数据完整性问题。通过分析云存储第三方完整性审计解决方案的需求特性，我们引入了一种新型的数据完整性审计设计，该设计可以在不牺牲云存储理想特性的情况下为云存储提供完整性保障。具体而言，本章引入的完整性审计设计可以同时实现动态数据共享、多用户修改、公共验证性以及在数据大小和数据文件数量方面的高可扩展性。该设计的实际性能通过在\
  \ `Amazon AWS Cloud` 上的数值分析和实验结果得到了证明。\n\n## 参考文献\n\n1.  Ateniese, Giuseppe, Randal\
