  \n# 第 32 章 流量侧信道攻击与防御\n\nWen Liu，康加达大学，蒙特利尔\nLingyu Wang，康加达大学，蒙特利尔\n\n## 32.1 引言\n\
  \n云计算通常依赖于 Web 服务作为云与用户之间的接口。在享受 Web 服务便利的同时，用户面临着更高的隐私泄露风险。通过浏览器提供软件服务，Web 应用程序比桌面应用程序需要少的客户端资源，且更容易交付和维护。然而，由于不可信的互联网成为用户与服务提供商之间持续交互不可或缺的一部分，这也带来了新的安全和隐私挑战。\n\
  \n最近的研究表明，许多流行应用程序的加密流量实际上可能会泄露高度敏感的数据，例如健康信息和家庭收入，从而导致严重的用户隐私泄露 [1。通过分析观察到的信息（如方向包大小和计时），监听者可能会识别应用程序的内部状态转换以及用户输入。此外，由于\
  \ Web 程序的固有特性，包括低熵输入（由自动建议功能引起）、丰富多样的资源对象（产生独特的流量模式）以及有状态通信（允许攻击者结合多次观察），此类侧信道攻击在云计算时代被证明是普遍且基础性的。\n\
  \n### 32.1.1 动机示例\n\n\n\n\n\n表 32.1 显示了在用户与某个流行的真实搜索引擎之间观察到的数据包大小和方向。可以观察到，由于自动建议功能，浏览器每次按键都会向服务器发送一个\
  \ `b` 字节的数据包；服务器随后回复两个大小分别为 `54` 字节和 `s` 字节的数据包；最后，浏览器向服务器发送一个 `60` 字节的数据包。此外，在同一个输入字符串中，随后的每次按键都会使\
  \ `b` 值增加 1 字节，而 `s` 值不仅取决于当前的按键，还取决于之前所有的按键。显然，尽管流量经过了加密，窃听者也可以通过观察到的流量中具有固定大小模式（第一个、第二个和最后一个）的数据包，精确定位出与输入字符串对应的数据包。在本章中，我们假设了这样一种最坏情况，即窃听者可以识别与\
  \ Web 应用程序相关的流量（例如使用去匿名化技术 `[2]\\]`），并使用上述技术定位用户输入的数据包。\n\n#### 表 32.1 用户输入及对应的数据包大小\n\
  ![](img/T32.1.jpg)\n\n此外，第三个数据包（包）的大小将提供输入本身的良好指标。具体而言，表 32.2 显示了作为输入字符串第一个按键输入的每个字符的\
  \ `s` 值。我们可以看到，六个字符（i, j, p, r, v 和 x）可以通过这个 `s` 值被唯一识别。表 32.3 显示了作为第二个按键输入的字符的\
  \ `s` 值。在这种情况下，表 32.3 中每个字符的 `s` 值与表 32.2 中的值不同，因为现在数据包的大小同时取决于当前的按键和前一个按键。显然，仅凭表\
  \ 32.3 就能唯一识别 16 对字符中的 12 对。此外，通过结合两个表中所示的连续按键的观察结果，每个输入字符串都可以被唯一识别（为了简单起见，我们在这里只考虑了四个字符，而实际上可能需要两次以上的按键才能唯一识别一个输入字符串）。注意，模式可能会随时间变化，但攻击仍然以类似的方式运行；同样，不同的\
  \ Web 应用程序其模式可能不同，但由于上述内在特性，Web 应用程序总是存在某些模式。\n\n#### 表 32.2 作为第一个按键输入的每个字符的 s 值\n\
  ![](img/T32.2.jpg)\n\n#### 表 32.3 作为第二个按键输入的每个字符的 s 值\n![](img/T32.3.jpg)\n\n研究人员已经提出了不同的解决方案来防止\
  \ Web 应用程序中的此类侧信道攻击 `[1 [](#chapter32.xhtml#re_TNF-CH032_CIT00002) [](#chapter32.xhtml#re_TNF-CH032_CIT00003)\
  \ [](#chapter32.xhtml#re_TNF-CH032_CIT00004) [](#chapter32.xhtml#re_TNF-CH032_CIT00005)\
  \ [](#chapter32.xhtml#re_TNF-CH032_CIT00006)––7]`。本章重点关注一种在这种攻击下保护隐私的自然解决方案，即通过填充数据包使得每个数据包的大小不再映射到唯一的输入。\n\
  \n在本章中，我们首先在 32.2 节简要回顾了一些必要的定义。然后我们在 32.3 节讨论了现有的防御措施。接下来，我们在 32.4 节和 32.5 节中描述了我们的流量填充方法，以在不同的场景和假设下实现隐私保护、通信效率和计算成本之间的最佳权衡。我们在\
  \ 32.6 节讨论了一些开放性研究挑战，在 32.7 节回顾了相关工作，并在 32.8 节得出了结论。\n\n## 32.2 基本定义\n\n在这一节中，我们首先描述了交互和观察的流量填充模型。然后我们量化了隐私保护和填充成本（细节在本章中省略，可以在\
  \ Liu 等人的论文 `[8, 9, ])` 中找到）。\n\n### 32.2.1 流量填充\n\n我们从两个角度对流量填充问题进行建模：用户与服务器之间的交互以及窃听者的观察。对于交互，我们将触发流量的原子输入称为\
  \ `action`，例如按键或鼠标点击。我们将表示用户完整输入信息的动作序列称为 `action sequence`，例如在搜索引擎中输入的一连续按键序列。我们将一组动作序列中对应的观察结果可能被一起填充的所有第\
  \ `i` 次动作集合称为 `action set`。同一个动作序列内部动作被分到不同的动作集中，因为它们的关系通过流量模式已知，因此将它们填充在一起是无效的（防止此类关于应用程序状态转换的推断是一个未来的研究方向）。\n\
  \n相应地，对于观察，我们使用 `flow vector` 来表示流的序列，这些流是由动作触发的数据包大小。我们使用 `vector sequence` 表示由动作序列触发的流向量序列，以及与\
  \ `action set` 对应的 `vector set`。最后，给定一组动作序列和向量序列，我们将所有第 `i` 次动作与对应的第 `i` 次流向量对定义为\
  \ `vector action set`。对于给定的应用程序，我们将所有向量集合的集合称为 `vector action sequence`。\n\n然后，可以根据上述组件的差异和复杂性将\
  \ Web 应用程序分类为不同的情况：`单向量单维度 (SVSD)` 情况是指每个动作序列和流向量的长度均为 1 的情况；`单向量多维度 (SVMD)` 情况是指每个流向量可能包含多个流，而每个动作序列仍由单个动作组成的情况；`多向量多维度\
  \ (MVMD)` 情况是指每个动作序列包含多个动作，且每个流向量包含多个流的情况。\n\n### 32.2.2 隐私属性\n\n我们从两个角度对流量填充方案的隐私需求建模。首先，当攻击者观察由单个动作触发的流向量时，他们不应该将该动作与其他至少\
  \ `k-1` 个可能触发相同流向量的动作区分开，即 `k`-不可区分性（k-indistinguishability）。通过这个定义，更高的隐私现在可以明确定义为满足更大\
  \ `k` 的 `k`-不可区分性。\n\n我们将在 32.5 节中说明，窃听者的背景知识可能在已经满足 `k`-不可区分性的情况下如何帮助他们破解隐私。因此，我们需要刻画窃听者对用户执行的真实动作所面临的不确定性数量。为了这一目的，我们应用信息论中的熵的概念来量化窃听者对触发观察流量的动作的不确定性。\n\
  \n\n\n\n有人可能会认为，与加密相比，`k`-不可区分性和不确定性可能无法提供足够强大的保护。然而，如前所述，我们考虑的是加密已经通过侧信道攻击被破解的情况，因此加密提供的强机密性已经不再是一个选项。其次，从理论上讲，`k`\
  \ 始终可以设置为足够大的值以提供足够的机密性（从这个意义上说，完美加密所能实现的仍然等同于将 `k` 设置为所有可能输入的数量），尽管我们认为对于大多数实际应用，一个足够大的\
  \ `k` 通常就能满足用户的隐私需求。最后，由于大多数 Web 应用程序都是公开访问的，因此窃听者不可避免地可以获可能的输入，我们认为，关注于保护敏感用户输入（通过将其隐藏在其他可能的输入中）比关注于完美机密性（试图隐藏所有内容）具有更高的实践可行性和意义。\n\
  \n### 32.2.3 成本度量](#chapter32.xhtml#re_ch-32-sec-6)\n\n除了隐私需求外，我们还需要开销的指标，例如通信成本和处理成本。对于前者，我们测量数据包大小相对于原始流向量增加的比例，即\
  \ `padding cost`（填充成本）。对于后者，我们测量在向量动作序列的所有向量中有多少个向量需要被填充，即 `processing cost`（处理成本）。在本章中我们关注这些简单的指标，尽管确实存在其他建模此类成本的方法。\n\
  \n### 32.3 舍整与随机填充](#chapter32.xhtml#re_ch-32-sec-7)\n\n在讨论我们的解决方案之前，我们首先检查现有的应对措施：数据包大小舍整（将每个数据包的大小增加到给定字节数的最近倍数）和随机填充（将每个数据包的大小增加到随机值）。这两种解决方案都旨在填充数据包，使得每个数据包的大小不再映射到唯一的输入。然而，这些解决方案并不是免费的，因为填充数据包会导致额外的开销。事实上，研究表明，这些直接的解决方案可能会产生不可接受的开销。此外，由于这种与应用无关的方法独立于实际用户输入来确定填充量，它们通常旨在最大化但无法保证隐私保护程度。\n\
  \n我们将在本节的剩余部分通过继续第 32.1 节中的动机示例来展示两个例子（分别对应 `Table 32.2`(#chapter32.xhtml#T32.2)\
  \ 和 `Table 32.3`(#chapter32.xhtml#T32.3)）。在这些示例中，我们将填充 `s` 字节，使得每个数据包的大小映射到至少 `k\
  \ = 2` 种不同的输入，即 2-不可区分性。这些示例表明，较大的舍整尺寸并不意味着更多的隐私保护，也不会导致更大的开销。\n\n示例 32.1\n\n考虑将\
  \ `Table 32.2`(#chapter32.xhtml#T32.2) 所示的流（s 值）舍整为 `Δ = 128` 的倍数（例如，从 509 直到 `4\
  \ × 128 = 512`）。可以证明，这种舍整可以实现 5-不可区分性。然而，将舍整尺寸从 128 增加到 512 仍然只能满足 5-不可区分性，而进一步增加到\
  \ 520 实际上只能满足 2-不可区分性。\n\n示例 32.2\n\n再次查看 `Table 32.3`(#chapter32.xhtml#T32.3)（为了演示，我们只考虑其部分数据，将其视为完整数据的微型）。在\
  \ `Table 32.4`(#chapter32.xhtml#T32.4) 中，第三列显示使用 `Δ = 64` 和 256 进行舍整无法实现隐私，因为填充后\
  \ `(b)a` 的 `s` 值仍然是唯一的，而 `Δ = 160` 则。这个例子无法显式地显示不可接受的开销，但它仍然很大。对于上述搜索引擎的 4 位英字母组合，开销约为\
  \ 39%。\n\n表 32.4 针对 `Table 32.3`(#chapter32.xhtml#T32.3) 的舍整方案（部分数据）\n\n![](img/T32.4.jpg)\n\
  \n因此，我们可能被迫在找到满足所需隐私属性并最小化填充成本的最优解之前评估许多 `Δ` 值，这显然是一个不切实际的解决方案。\n\n### 32.4 天花板填充方法](#chapter32.xhtml#re_ch-32-sec-8)\n\
  \n在选择填充方法时，我们需要处理两个方面：满足隐私属性和最小化填充成本。如前所述，与应用无关的方法通常会产生高昂填充成本，但不一定能保证足够的隐私保护 [1]。另一方面，我们可以应用泛化隐私数据发布（PPDP）技术\
  \ [10] 来解决隐私流量填充（PPTP）问题。泛化技术会将向量动作集划分成填充组，然后通过填充组中的流向量来打破同组动作之间的关联。将泛化应用于 PPTP\
  \ 的独特之处是，填充只能增加每个数据包的大小，而不能减小它，也不能像普通泛化那样将其替换为一个范围。上述考虑导致了一种新的填充方法，即天花板填充方法（ceiling\
  \ padding approach）。基本上，在将向量动作集划分为填充组后，我们将填充组中的每个流填充到该组的最大值。\n\n示例 32.3\n\n在 `Table\
  \ 32.5`(#chapter32.xhtml#T32.5) 中，我们考虑对 `Table 32.4`(#chapter32.xhtml#T32.4) 的相同数据应用天花板填充。第一列和最后一列分别显示\
  \ `s` 值和对应的输入。中间两列提供了两种数据包填充选项（尽管此处未显示，确实存在其他选项）。具体来说，每个选项首先将六个字符分为三个（或两个）填充组，如图中（横线）所示。然后对同一组内的数据包进行填充，使其对应的\
  \ `s` 值相同。因此，每个填充组内的字符将不再根据 `s` 值相互区分。现在的目标是找到一种能够提供足够隐私保护并最小化填充成本的填充选项。\n\n表 32.5\
  \ 将 PPTP 映射到 PPDP\n\n![](img/T32.5.jpg)\n\n有趣的是，这个 PPTP 问题自然地解释为另一个广泛研究的问题：隐私数据发布（PPDP）。再次查看\
  \ `Table 32.5`(#chapter32.xhtml#T32.5)，如果我们把 `s` 值视为准标识符（如出生日期），输入视为敏感值（如健康状况），并将填充选项视为泛化出生日期的不同方式（例如删除出生日期），那么我们立即面临一个经典的\
  \ PPDP 问题，即在发布出生日期和健康状况的同时，防止攻击者通过出生日期将发布的健康状况关联到个人。\n\n这两个问题之间的相似性意味着我们可以借鉴 PPDP\
  \ 领域的许多现有工作来解决 PPTP 问题。另一方面，它们之间也存在显著差异，这为开发 PPTP 解决方案带来了挑战。本章将简要回顾其中的三个挑战。\n\n\
  ### 32.4.1 挑战](#chapter32.xhtml#re_ch-32-sec-9)\n\n本节将讨论以下两个挑战。前者涉及由于两个问题之间的差异导致的实现困难。后者涉及观测序列之间的依赖性\
  \ PPTP 问题，PPDP 等效性也是一个新问题。\n\n#### 32.4.1.1 挑战 1](#chapter32.xhtml#re_ch-32-sec-10)\n\
  \n\n\n\n例如，在表 32.5 中，第二种方案在 PPDP 中通常被认为比第一种方案差，因为它产生了更大的匿名分组，但在填充成本方面它实际上更好（总计为\
  \ 38 字节，而第一种方案为 40 字节）。这意味着 PPDP 问题的解决方案无法直接应用于 PPTP 问题，需要针对 PPTP 进行定制。\n\n### 32.4.1.2\
  \ 挑战 2\n\n如第 32.1.1 节所述，通过关联向量序列中的流向量，监听者可以细化其对实际操作序列的猜测。另一个例子是，我们将展示如下组合两个击键的效果等同于释放多个相互依赖的表，这产生了一个新型的\
  \ PPDP 问题。\n\n#### 示例 32.4\n\n回到表 32.3，假设监听者只观察到了第二次击键的流。为了保持 2-不具区分性，一种算法可能会将 16\
  \ 个单元划分为 8 个大小为 2 的组，并假设查询字符串 `(a)c` 和 `(c)a` 形成一组。当监听者观察到第二次击键的流为 501 时，他们无法确定查询字符串是\
  \ `(a)c` 还是 `(c)a`。\n\n然而，假设监听者也观察了第一次击键的流；当流分别为 509 或 502 时，他们可以确定第一次击键是 `(a)`\
  \ 或 `(c)`。因此，他们可以通过结合这两次观测结果来推断出查询字符串。\n\n一个看似有效的解决方案是填充流向量，以分别满足每次击键的 2-不具区分性。遗憾的是，这在关联两个连续观测结果时将会失败。原因如下：为了对第一次击键填充流量，最佳解决方案是将\
  \ `(a) - (d)` 划分为两组 `{(b), (c)}` 和 `{(a), (d)}`。然而，当监听者观察第一次击键的流时，当大小分别为 516 或 504\
  \ 时，他们仍然可以确定其必须是 `(a)` 或 `(c)`，因为只有当第一次击键以 `(a)` 或 `(c)` 开始时，第二次击键的流才能被填充为 501。因此，监听者将从猜测中排除\
  \ `(b)` 和 `(d)`，这违反了 2-不具区分性。\n\n另一个明显的可行方案是收集所有输入字符串的向量序列，然后对其进行填充，使得整个输入字符串无法与其他至少\
  \ `k - 1` 个字符串区分。遗憾的是，这种方法也无法确保隐私。例如，一种算法可能会将 `(a)c` 和 `(a)b` 分分为不同的组，其中 `(a)` 应分别填充为\
  \ 509 和 516。当服务器接收到 `(a)` 时，由于自动建议功能，必须立即响应。然而，由于服务器无法预测下次击键是 `b` 还是 `c`（或其他），它无法决定是将\
  \ `(a)` 填充为 509 还是 516。\n\n所讨论的挑战主要由于独立填充每个向量集的方法。在向量操作序列中划分不同的向量集时，需要应用额外的条件。直观上，每个操作对应的向量集的划分将遵循同一操作序列中所有之前操作的划分结果（此处省略了这两个额外条件的细节，请参见\
  \ Liu 等人的文献 \\[11, 12, \\]]）。\n\n一旦划分满足这些条件，无论监听者如何分析流量（无论是针对单个操作还是结合对之前操作的多次观测），关于实际操作序列的心理模型都保持不变。\n\
  \n遵循示例 4，在这些条件下，`(a)c` 和 `(c)a` 只有在它们前缀 `(a)` 和 `(c)` 位于同一组时才能形成一组。这确保了 `(a)c` 和\
  \ `(c)a` 在序列中具有相同的流值。\n\n### 32.4.1.3 算法设计的行性与隐私属性扩展\n\n上限填充方法可以很容易实现并转换为高效的算法，用于将向量操作集划分为填充组以满足给定的隐私需求。例如，用于\
  \ SVSD 情况的 `svsdSimple` 算法试图最小化填充组的基数；以及用于 SVSD 和 SVMD 情况的 `svmdGreedy` 算法，它递归地将填充组一分为二直到任何填充组的基数小于\
  \ `2 × k`；用于 MVMD 情况的 `mvmdGreedy` 算法应用 `svmdGreedy` 来划分序列中的向量操作集以满足第 32.4.1.2 节指定的两个条件。\n\
  \n此外，隐私属性可以扩展到更现实的情况。例如，在之前的讨论中，我们隐含地假设操作集中的每个操作发生概率相等。但在现实生活中，每个操作并不一定具有相同的执行概率（例如，某些输入的统计信息可能是公开的）。实际上，许多有的\
  \ PPDP 概念可以适配并扩展以处理 PPTP。对于上述特殊情况，我们可以适配 `l-diversity`[13] 来处理并非所有操作都应被平等对待的情况。基本思想是给每个操作分配一个整数权重，反映其在操作集中的出现概率（细节见\
  \ Liu 等人的文献 \\[11, 12, \\]]）。\n\n### 32.4.2 评估\n\n在本节中，我们通过对真实应用程序的实验总结解决方案的有效性和效率。我们从四个真实应用程序中收集测试向量集：两个热门搜索引擎\
  \ `engine B` 和 `engine C`（需要保护用户搜索关键词），以及两个权威信息系统——药品系统 `drug B` 和专利系统 `patent C`分别需要保护用户的健康信息和公司的专利利益）。\n\
  \n#### 32.4.2.1 通信开销\n\n图 32.1 和 32.2 显示了各算法针对 `k` 和 `l`（分别对应 k-不具区分性和 l-多样性）的填充成本。在所有情况下，舍入和最大化算法的填充成本都比我们的算法大。\n\
  \n#### 32.4.2.2 处理开销\n\n实际实现填充也会产生成本。因此，我们还必须最小化需要填充的数据包数量。图 32.3 和 32.4 显示了各算法针对\
  \ `k` 和 `l`（分别对应 k-不具区分性和 l-多样性）的处理开销。舍入和最大化算法无论 `ks` 和应用程序如何都必须填充每个流向量，而我们的算法在\
  \ `engine B`、`engine C` 上成本低得多，在 `drug B`、`patent C` 上成本也略低。\n\n\n\n\n\n![图 32.4\
  \ l-diversity 的开销（按比例）。(a) SVSD 情况；(b) MVMD 情况。](img/fig32.4.jpg)\n\n图 32.4 `l`-diversity\
  \ 的开销（按比例）。(a) SVSD 情况；(b) MVMD 情况。\n\n#### 32.4.2.3 计算开销](#chapter32.xhtml#re_ch-32-sec-16)\n\
  \n图 32.5 和 32.6 分别显示了各种算法相对于基数和隐私属性的计算时间。结果所示，我们的算法在实践上是高效的，尽管它们比舍入（rounding）和最大化（maximizing）方法稍多开销。然而，这部分是因为舍入和最大化方法具有与应用无关的特性，导致其在计算和通信成本方面的性能较差。\n\
  \n![图 32.5 k-不可区分性的执行时间（秒）。(a) 数据基数；(b) 隐私属性。](img/fig32.5.jpg)\n\n图 32.5 `k`-不可区分性的执行时间（秒）。(a)\
  \ 数据基数；(b) 隐私属性。\n\n![图 32.6 l-diversity 的执行时间（秒）。(a) 数据基数；(b) 隐私属性。](img/fig32.6.jpg)\n\
  \n图 32.6 `l`-diversity 的执行时间（秒）。(a) 数据基数；(b) 隐私属性。\n\n## 32.5 随机封顶填充方法](#chapter32.xhtml#re_ch-32-sec-17)\n\
  \n在之前关于封顶填充（ceiling padding）的讨论中，受隐私数据发布中类似方法的启发，将数据包划分为填充组，并将组内每个数据包的大小增加到该组内的最大大小，以提供所需的隐私保障\
  \ [12]。\n\n然而，大多数现有解决方案（包括上述舍入和封顶填充）共同的一个重要局限性是，它们假设对手不拥有关于可能的用户输入的任何背景知识，这被认为是另一个挑战，如下所示。\n\
  \n### 32.5.1 挑战 3](#chapter32.xhtml#re_ch-32-sec-18)\n\n当此类知识允许对手精炼其对用户输入的猜测时，隐私保障可能会失效。下面的运行示例展示了这一挑战。\n\
  \n考虑一个虚构的网站，该网站在用户登录后会显示与用户最近关联的疾病信息。表 32.6 显示了以字母 C 开头的疾病加密数据包大小和方向的简单示例。显然，第一个、第二个和最后一个数据包在方向大小上的固定模式将允许对手从观察到的流量中精确定位对应不同疾病的数据包。在这个示例中，如果对手观察到患者登录时\
  \ `s` 字节的值值为 360，他们就可以推断该患者可能患有癌症（注意，此示例为了便于讨论进行了简化，现实中的流量模式可能更加复杂）。\n\n表 32.6 用户输入及对应的数据包大小\n\
  \n![](img/T32.6.jpg)\n\n示例 32.5\n\n我们现在检查上述两种解决方案应用于此示例的情况：舍入 [1] 和封顶填充 [12]。这两种解决方案都旨在填充数据包，使得每个数据包的大小不再映射到唯一的疾病。在这个示例中，我们应该填充\
  \ `s` 字节，使得每个数据包的大小映射到至少 `k = 2` 种不同的疾病，即 2-不可区分性。在表 32.7 中，第三列显示较大的舍入尺寸并不一定意味着更高的隐私，因为使用\
  \ `Δ = 112` 和 `176` 进行舍入无法实现隐私（填充后癌症的 `s` 值仍然是唯一的），而 `Δ = 144` 则可以可以。\n\n表 32.7\
  \ 针对表 32.6 的舍入与封顶填充\n\n![](img/T32.7.jpg)\n\n接下来，表 32.7 中的最后一列显示封顶填充方法 [12] 实现了\
  \ 2-不可区分性。当对手观察到 360 字节的数据包时，他们只能推断患者患有癌症或宫颈炎，但无法确定哪种是真的。然而，如果对手恰好通过输出渠道拥有某些背景知识，例如该特定患者是男性，那么现在显而易见患者一定患有癌症，因为在这种情况下，对手可以进一步排除妇科疾病宫颈炎。\n\
  \n在本节中，我们在根据每个用户请求构建填充组的过程中引入了随机性。具体而言，响应某个操作，我们首先从某些分布中随机选择 `k - 1` 个其他操作来形成填充组。然后，我们对生成的组应用封顶填充。为了区分于上述固定填充和封顶填充，我们将动态生成的组称为瞬态组（transient\
  \ group），并将对应的方法称为随机填充。正如表 32.8 所示，在这个示例中，服务器不再确定性地形成填充组，而是随机选择三种方式中的一种。因此，我们可以看到癌症患者总是接收\
  \ 360 字节的数据包，而其他患者分别接收 290 字节和 360 字节。\n\n表 32.8 针对表 32.6 的建议方案\n\n| 可能的填充组（填充后）\
  \ | s 值 |\n| --- | --- |\n| 癌症患者 | --- |\n| {癌症, 宫颈炎} | 360 |\n| {癌症, 感冒} | 360\
  \ |\n| {癌症, 咳嗽} | 360 |\n| 宫颈炎患者 | --- |\n| {宫颈炎, 癌症} | 360 |\n| {宫颈炎, 感冒} | 290\
  \ |\n| {宫颈炎, 咳嗽} | 290 |\n\n令人惊讶的是，在构建填充组的过程中引入随机性改进了隐私，但这种改进并不意味着付出更高的代价。在这个示例中，封顶填充和随机封顶填充实际上导致了完全相同的填充成本，而后者在相同的\
  \ `k`-不可区分性下实现了更高的不确定性。\n\n### 32.5.2 随机封顶填充方案](#chapter32.xhtml#re_ch-32-sec-19)\n\
  \n我们通用随机封顶填充方案的主要思想如下：在响应用户输入时，服务器将根据某些分布从某些候选中随机选择组成成员，动态形成瞬态组。该方案包含两个阶段。第一阶段是一个一次性过程，用于推导随机参数并相应确定操作作为瞬态组成员的概率。一旦设置了随机参数，接收到操作后，第二阶段根据第一阶段的结果反复从操作集中选择其他操作以形成瞬态组。\n\
  \n\n\n\n显然，对此类候选者和分布的不同选择将导致不同的算法，从而在满足隐私需求的同时降低填充和处理成本。我们将简要讨论两种方法，以证明该方案可以根据特定应用的需求以多种不同的方式实例化。为了降低成本，我们首先根据填充成本对向量动作集进行排序形成一个链。然后，我们定义了更大、更接近的概念来量化链中两个动作之间的位置关系。\n\
  \n一种选项，即 `TUNI` 选项，从均匀分布中抽取候选者。它还允许用户限制考虑的候选动作基数，以及大于给定动作的动作数量。\n\n另一种选项，即 `NORM`\
  \ 选项，从正态分布中抽取候选者。在此选项中，向量动作集中较接近的动作有较高的概率被选为给定动作瞬态组的成员。\n\n### 32.5.3 评估\n\n在本节中，我们通过对两个真实\
  \ Web 应用的实验，评估了我们的方案在 `TUNI` 和 `NORM` 两种实现方案下的不性和成本。\n\n`图 32.7a` 到 `c` 分别展示了相对于隐私属性\
  \ `k` 的填充成本、不确定性和处理成本。总来说，所有算法的填充和处理成本都随着 `k` 的增加而增加，而 `TUNI` 和 `NORM` 的成本低于 `SVMD`。同时，我们的算法对于\
  \ `Drug` 的不确定性更大，对于 `Engine` 则略大。\n\n![图 32.7 隐私属性 k 的不确定性和成本。(a)。填充开销；(b)不确定性；(c)处理开销。](img/fig32.7.jpg)\n\
  \n图 32.7 隐私属性 k 的不确定性和成本。(a)。填充开销；(b)不确定性；(c)处理开销。\n\n注意，我们可以限制选项中的不同参数来解决隐私需求与成本之间的平衡。例如，在\
  \ `TUNI` 选项中，当动作的选取概率从均匀分布抽取时，我们可以限制较大动作的数量和被选可能动作的最小数量。同时，在 `NORM` 选项中，允许在从正态分布选取时调整均值和标准差（详细结果和相应的参数选择建议可参见\
  \ Liu 等人 [[9]]）。\n\n### 32.6 研究挑战\n\n在之前的章节中，我们讨论了不同场景下隐私保护流量填充中日益复杂的挑战，并提出了相应的解决方案。在本节中，我们指出了该领域的一些更多问题和其他挑战。\n\
  \n### 32.6.1 差异隐私\n\n解决 `PPTP` 问题的自然方法是应用广知的差分隐私概念 [[14]]，它为对抗者的背景知识提供了可证明的防御能力。然而，将差分隐私应用于流量填充将面临一些实际挑战。具体来说，引入噪声更适用于统计聚合（例如\
  \ `COUNT`）或其变体，这些聚合具有更具预测性且较小的敏感性；而对于敏感性难以预测且往往无边界（由于多种资源对象）的流量填充，适用性较低，且单个数据包大小而非其统计聚合是可以直接观测的。此外，虽然文献中对隐私参数\
  \ `E` 的定性意义已为人知，但该值与隐私保证程度之间的精确定量联系，是应用提供者说服用户隐私保证水平所需的，这一点受到的关注较少。\n\n### 32.6.2\
  \ 实现问题\n\n实现问题可能会使解决方案复杂化。首先，观测到的信息（如包大小）可能从不同的设置（浏览器、平台、网络等）发生整体偏移。然而，我们的解决方案将此类差异视为不同的输入，并由于以下事实认为每个输入集是等等的：收集的数据在流量大小区分方面保留了原始数据的充分特征；尽管\
  \ `HTTP` 请求和响应的长度可能因不同的浏览器和平台而异，但相同设置的差异是常量且可以预先确定。尽管如此，应用提供者必须为不同的设置收集数据集。\n\n\
  其次，之前的讨论重点是在减少填充通信开销的同时，确保每个流向量符合隐私属性。要在现有的 Web 应用中实现流量填充，如果 `HTTPS` 头部或数据被压缩，我们可以在压缩后填充并对头部进行填充；如果头部和数据未压缩，我们可以对实际数据进行填充（例如，可以在文本数据后附加所需填充字节的空格）。显然，浏览器的\
  \ `TCP/IP` 栈负责头部填充，而原始 Web 应用将数据填充视为普通数据。应用程序可以在处理请求的不同阶段选择并入填充；它可以参考我们算法对每个请求的输出，然后动态填充流向量。此外，应用程序还可以根据我们算法的输出预先修改原始数据，以便在修改后满足隐私属性。然而，无论采取何种方法，填充都可能产生处理成本。\n\
  \n第三，人们可能会收集可能的动作序列信息的实用性表示怀疑，因为此类序列的数量可能极大。然而，我们认为对于大多数 Web 应用来说是行的，原因如下：上述针对 Web\
  \ 应用的侧道攻击通常由于高度交互的功能引起，例如自动建议。此类功能的存在意味着应用程序设计人员已经为了实现该功能分析了可能的输入范围（即动作序列）。因此，此类信息已经以某种形式存在，并且可以以低成本轻松提取。此外，即使\
  \ Web 应用可能接受无限量的输入，这并不意味着会有无限的动作序列。例如，像 `Google` 这样的搜索引擎在查询字符串超过特定长度后不再提供自动建议功能。最后，上述所有三个步骤都是离线处理的一部分，只有在\
  \ Web 应用进行重新设计时才需要重复。注意，如果仅为了优化填充成本，实现现有的填充方法（如包大小排序）也需要经过上述三个步骤。例如，如果不收集和分析向量动作集，填充方法就无法有效选择填充参数。\n\
  \n### 32.7 相关工作\n\n\n\n\n\n有几篇论文关注了不同领域中不同类型的侧信道攻击以及相应的缓解解决方案。研究人员在文献中还研究了各种领域的众多隐私模型及相应的算法。在本节中，我们简要回顾了\
  \ Web 应用中侧信道攻击和隐私保护的现有工作。\n\n### 32.7.1 侧信道攻击\n\n文献中已广泛研究了各种侧信道泄露。通过测量响应查询所需的时间，攻击者可以提取出\
  \ `OpenSSL RSA` 隐私密钥 [15]..。通过区分按键产生的声音，攻击者在长训练样本的帮助下，可以识别出按下的按键 [16]..。通过从远处的观测点发送探针来利用路由器中的队列侧信道，攻击者可以对家庭宽带用户远程对网站进行指纹识别\
  \ [17]..。Ristenpart 等人发现了基于用户间共享物理基础设施的 Amazon EC2 上的跨虚拟机信息泄露 [18]..。搜索历史记录可能通过会话劫持攻击被重构\
  \ [19]..。而网页浏览历史可能受到基于缓存的定时攻击的影响 [20]..。Saponas 等人展示了加密视频流的传输特征如何允许攻击者识别电影标题 [21]..。\n\
  \n同时，研究人员在开发缓解此类泄露威胁的技术方面付出了大量努力。Sun 等人提出了基于流量整形机制（如填充、模拟、变形等）的防御措施，以防止加密 Web 流量身份的暴露\
  \ [2]..。Luo 等人提出了浏览器端系统 `HTTPOS`，通过可配置的流量转换技术防止加密 HTTP 流量的信息泄露 [5]..。Askarov、Zhang\
  \ 和 Myers 引入了一种定时缓解器，通过延迟输出事件来限制信息量，从而对定时信道泄露达到给定的边界 [22]..。Zhang 等人提出了一种验证虚拟机唯一使用物理机的方法。方法利用\
  \ `L2` 内存缓存中的侧信道作为防御检测工具，而不是攻击向量 [23]..。Aviram 等人提出通过消除所有内部定时信道来实现提供者强制的确定性执行，以应对云环境下的定时攻击\
  \ [24]..。\n\n### 32.7.2 Web 应用中的隐私保护\n\n隐私保护问题在各个领域受到了广泛关注，例如数据发布和数据挖掘 [25, 26]]、网络\
  \ [27, 28]]、社交网络 [29[30]-31]]、外包数据 [32, 33]]、多方计算 [34]]、Web 应用 [1, 35, 36]]等。\n\n\
  在 Web 应用的背景下，文献中已经识别出加密 Web 流量中的许多侧信道泄露，这允许对 Web 应用本身及其内部状态进行画像分析 [1, 17]..。基于缓存的定时攻击可能损害网页浏览历史\
  \ [20]..。Saponas 等人展示了加密视频流的传输特征如何允许攻击者识别电影标题 [21]..。\n\n与此同时，文献中已识别出加密 Web 流量中的许多侧信道泄露，这允许对\
  \ Web 应用本身及其内部状态进行画像分析 [1, 17].. 19].. 24]..。与此同时，多种方法 [2] 已用于分析这些泄露 [5].. 6]..\
  \ 22]..。最近，提出了一种黑盒方法来检测并量化 Web 应用中的安全漏洞 [4]..。最近还提出了一种形式化框架，根据泄露信息的量来衡量安全性 [3]..。\n\
  \nChen 等人通过案例研究证明侧信道问题在 Web 应用中普遍存在且日益加剧 [1]..。随后，作者进一步研究了识别此类威胁并量化信息量的方法 [7]..。他们表明，与应用程序无关的方法通常面临高开销和低隐私保护的问题，因此有效的解决方案可能依赖于对应用的深度理解。最后，他们设计了一个完整的流程作为此类侧信道攻击的基础解决方案。\n\
  \n流量变形被用于缓解通过网络流量的可观测属性泄露敏感信息的隐私威胁 [6]..。虽然他们提出的系统使流量类别变得不可区分，但实时填充或拆分数据包可能会损害应用程序的性能。此外，由于缺乏隐私需求，无法评估流量转换所实现的隐私程度。相比之下，我们的解决方案在理论上保证了隐私属性。\n\
  \n### 32.8 总结\n\n随着 Web 应用变得越来越流行，它们的安全问题也将引起更多关注。在本章中，我们展示了 Web 应用流量填充问题与隐私发布之间有趣的联系。基于这种联系，我们展示了调整\
  \ `PPDP` 中的概念以量化流量填充提供的隐私保护的可能性。本章还讨论了针对不同场景和假设的 Web 应用隐私流量填充的不同方法。这些方法可以很容易转换为高效的算法。\n\
  \n\n\n\n\n3. 3. M. Backes, G. Doychev, and B. Köpf . 防止网络流量中的侧信道泄露：一种形式方法。In Proceedings\
  \ of NDSS’13, 2013.\n\n4. 4. P. Chapman and D. Evans . Web 应用程序侧信道漏洞的自动化黑盒检测。In\
