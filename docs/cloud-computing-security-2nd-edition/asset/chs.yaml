  \n参考文献\n\n## 17.1 引言\n\n在本章中，我们回顾了云计算安全的各个方面，因为它是构建云服务的的基础构建块。我们的主要重点是公有云，但安全的某些方面也适用于私有云，甚至适用于混合云。云计算服务提供商必须向寻求注册云服务的潜在客户提供一份\
  \ `SLA`。`SLA` 是最重要的文档，在发生安全泄露时，它可以为云客户提供某种程度的满意保障。我们需要指出，安全风险的管理和评估都是动态过程，随着漏洞的发现，需要重新评估安全性；因此，安全管理是一个不断演进的过程。\n\
  \n## 17.2 责任与所有权\n\n首先，必须明确 `IaaS` 服务提供商不会确保运行在其基础设施上的云服务器的安全性。相反，责任将是底层云基础设施的安全，如数据中心、安装的硬件、后端网络以及虚拟化环境。此外，还将为云客户提供一套工具，用于管理和配置其虚拟服务器、使用的存储或底层虚拟网络配置。图\
  \ 17.1 显示了各种云模型（基础设施即服务 `IaaS`、平台即服务 `PaaS` 和软件即服务 `SaaS`）在运营责任上的差异。`IaaS` 设置涉及云客户最多。\n\
  \n![图 17.1 运营责任？](img/fig17.1.jpg)\n\n图 17.1 运营责任。\n\n云客户及其管理员完全负责在其云服务器格局中的所有层中确保并实施安全方案。这意味着此类\
  \ `IaaS` 云服务的客户必须了解并接受配置选项、服务水平协议以及使用此类服务的责任。安全措施是这种教育的一部分。云服务器管理员不能假设社区或云提供商提供的预配置软件镜像或\
  \ `VM` 是足够安全的，或者符合从客户场景或预期数据处理用例中提出的要求。下一章将概述在此类 `IaaS` 云环境中锁定云服务器的基本安全措施。\n\n##\
  \ 17.3 法律法规与许可方面\n\n\n\n\n云服务器通常是从预配置的 VM 镜像、快照创建并启动的，或者从现有的虚拟机克隆而来。VM 镜像的来源可以是互联网社区、某些开源镜像、某些商业付费设备，甚至是云服务提供商的镜像库。此外，云服务器客户也可以根据其软件库或自开发的源码创建自己的镜像或\
  \ `VM`。总而言之，必须明确所使用的操作系统是否已获得在云环境中使用的的适当许可。开源操作系统和免费的 Linux 发行版可以作为创建虚拟机的起点。在这种情况下，管理员需要检查许可是否仅涵盖了非商业用途。同样的考虑因素也适用于安装在\
  \ VM 镜像或运行中的虚拟机服务器中的第三方软件。\n\n克隆服务器的问题在于，所有的许可证密钥都被复制了，因此在每个运行的虚拟机服务器实例中都会被多次使用。根据供应商在软件中内置的许可证激活设计，这可能是被禁止的或存在问题的。一个很好的例子是\
  \ Windows 操作系统，根据所使用的版本，它依赖于许可服务器和定期许可检查等功能通过互联网进行系统激活。在这种情况下，必须通过安装后配置更改许可证密钥，或将新启动的云服务器激活/集成到软件供应商的许可系统中。\n\
  \n还要记住，`VM` 镜像、快照或云存储磁盘很容易创建，几乎可以在瞬间完成复制，并且传输并存储在世界任何地方。此类镜像在全球的分布和可用性一方面在可扩展性、可用性和性能方面是云的一大优势，但也包含了监管合规方面的风险。这是由于一个现实情况：云可能是全球性的，但世界上各国仍然根据本地司法管辖区和法律运行。例如，符合美国或加拿大规定的\
  \ `VM` 镜像可能不符合欧盟的隐私或银行法。因此，如果将这些镜像用于欧盟的生产性银业务，基于它们创建云服务器实例可能会出现问题。云端的 `VM` 必须来自能够满足相应法规的镜像，或者必须在显式的安装后步骤中进行重新配置以确保所需的合规性。如果在云服务器上运行业务关键系统，管理员必须尽早考虑特定国家的法规。考虑\
  \ `VM` 实例的来源（`VM` 镜像、快照或现有服务器的克隆）、目标云位置（例如欧盟范围内的云服务器场和存储）以及基于所涉及行业的适用法律和标准（例如银行、汽车、IT\
  \ 服务或医疗保健）。\n\n## 17.4 定义数据中心区域和可用性区\n\n云服务器可以托管在多个位置。数据中心区域通常是一个地理区域，如 `North America\
  \ West`、`North America East`、`South America`、`Europe` 或 `Asia-Pacific`。大多数供应商区分区域和可用性区，可以选择这些区域来存储和运行云服务器。在坏的情况下，供应商只有一个区。\n\
  \n每个可用性区都是区域内的一个隔离位置。每个区域应至少有两个、最好三个互连的可用性区。因此，单个区域的可用性区通过低延迟链路相互连接。区域本身是完全独立的，可以运行独立环境。图\
  \ 17.2 可视化了跨区域的这种设置。\n\n从安全角度来看，`VM` 管理员必须决定以下问题：\n\n*   云服务器应该使用哪个区域？云服务器可以分布在不同区域之间，还是必须留在一个区域？\n\
  *   所选区域中有多少个可用性区？\n*   是否为了高可用或故障转移设置而将云服务器分布到多个可用性区？\n\n从网络角度来看，如果需要高可用性设置，可用性区同样重要。在这种情况下，建议激活两个位于不同可用性区的并行虚拟专用网络\
  \ (`VPN`) 节点。这样如果一个区发生故障，通过在另一个区运行的第二个节点仍然可以确保 `VPN` 的连通性。\n\n\n\n\n\nIaaS 提供商的数据存储服务也非常重要，因为如果没有用于其\
  \ VM 镜像或数据磁盘文件的高可用存储，云服务器将无法运行。存储本身还需要在至少两个可用区之间分布数据，以确保基本的灾难恢复能力和至少 99.99% 的数据持久性。如今，大多数领先的云提供商为其区域存储服务提供了更高的数据持久性和可用性。某些\
  \ IaaS 提供商通过数十个特定国家的本地存储缓存系统来扩展其核心存储环境，在实际消费者或客户附近提供常用数据。这些缓存存储节点充当加速网络的作用，以减少终端用户的延迟和网络开销（例如，即使主存储位于美国，也可以在德国本地下载数据）。云提供商必须保证这种缓存是暂时的。在某些情况下，它必须由客户主动请求并配置。云服务器管理员必须决定是否需要此服务，以及其客户是否能够接受；例如，出于性能考虑，当非欧盟用户访问内容时，欧盟数据会被缓存在欧盟之外。\n\
  \n## 17.5 虚拟机安全设计\n\n云服务提供商使用各种虚拟化技术来优化其物理 IT 基础设施的利用率，并根据客户的性能和资源需求确保自动水平扩展能力。虚拟机监控（Hypervisor）安装在这些物理服务器场上，以建立一个虚拟化管理层，控制\
  \ CPU、磁盘、内存或网络等物理资源，并将它们动态分配给运行中的 VM。虚拟机监控还充当编排层，出于各种原因（例如为了优化负载）跨多个物理服务器移动、克隆、复制、启动或挂起\
  \ VM。在这种情况下，虚拟机监控在管理和限制使用的资源以及控制 VM 的处理和数据流方面起着核心作用。在该层面可以应用各种安全规则，以确保 VM 之间的适当隔离，或确保\
  \ VM 不会在特定环境或网络分段中使用。例如，克隆/复制的开发机不应放置在生产网络段中，不应消耗某些资源，或不应对底层物理共享服务器产生特定的负载。\n\n\
  通常情况下，云虚拟机监控可以托管不同客户的多个 VM。云服务器管理员无法直接控制 VM 在哪个物理虚拟机监控上执行。尽管如此，对于大型数据库云服务器，可以合理假设它们是云提供商物理服务器上运行的唯一实例。这是因为虚拟数据库服务器在启动时分配了大量的内存\
  \ (RAM)。该物理服务器上没有留留资源给并行运行的其他 VM。在这种情况下，可以确保运行数据库服务器的客户拥有专用的且隔离的底层物理服务器。但这是一种极端情况，可能会随着时间的推移而变化。因此，领先的\
  \ IaaS 云提供商提供了使用 `single tenancy`（单租户）标志将 VM 标记为独立的选项。即使虚拟机很小，它也会被分配到专用的物理服务器，云提供商/虚拟机监控将确保没有其他\
  \ VM 部署在同一个物理实例上。当然，这是一个非常昂贵的选项，因为即使只使用了其部分资源，客户也必须为整个物理服务器付费。但在某些受监管的行业以及高度机密或生产场景中，这可能是一个允许云部署的安全选项。\n\
  \nVM 始终有一个指向虚拟机监控的专用物理网络接口。云客户可以根据需要选择带宽，例如从几 Mbit 到 10 Gbit 不等。在大多数情况下，存储流量也将通过该网络接口，在存在大量并发连接或高数据存储传输活动时，可能会导致网络拥塞。这种外部网络和内部存储流量的结合可能成为巨大的瓶颈。这使得带宽管理变得异常重要，需要为消耗性带宽定义的规则，并找出峰值负载以相应确定带宽大小。处理该问题的另一种方法是仅为存储流量激活额外的并行的网络接口。这也具有安全影响，并允许服务器与其终端用户之间（例如）生产网络流量，以及服务器与其存储或备份节点之间的内部存储流量进行清晰分离。\n\
  \nIaaS 云提供商不会定期对旧的 VM 镜像进行安全补丁。运行中的实例也是如此。因此，整个 VM 镜像管理工作由客户负责。这包括保持 VM 镜像最新的流程，或定义哪种系统应使用何种镜像规格（例如，生产系统与演示或开发系统使用不同的镜像）。但幸运的是，某些云提供商允许对存储在其仓库中或用于在其虚拟机监控上运行\
  \ VM 的镜像进行标记和标签化。这种元数据管理可以用于标记例如用途（如生产 vs. 开发；环境 A vs. 环境 B）、安全组以及安全补丁或版本状态。\n\n\
  某些云提供商还提供了运行脚本的能力，这些可以在虚拟机实例启动时立即从镜像中读取这些标记或标签，并根据分析的信息触发某些过程。例如，虚拟机监控和启动脚本会在启动时检查\
  \ VM 是否用于生产环境，如果是这样，它需要获得特定的安全配置，或需要立即进行安全补丁。云服务器管理员应该调查可用选项，并尽可能使用这些安全/管理功能。\n\n\
  虚拟机监控层面的另一个常见功能是使用“安全组”。这些组充当 VM 入站和出站流量的状态包过滤。这是在已有的网络过滤规则或访问控制列表 (ACL) 之外的补充。安全组不能替代实际防火墙，但可以作为额外的安全概念，以确保运行在同一物理服务器和/或虚拟机监控上的\
  \ VM 之间的流量控制。最终，虚拟机监控服务器将自身与其他虚拟机监控服务器隔离，同时也隔离运行在虚拟机监控主机内部的虚拟机。图 17.3 解释了这种隔离概念，并显示了如何通过提到的\
  \ ACL 和虚拟私有云 (VPC) 网络设置将特定的虚拟机实例连接在一起。\n\n![图 17.3 虚拟机监控安全与隔离。](img/fig17.3.jpg)\n\
  ```\n\n图 17.3 虚拟机监控安全与隔离。\n\n云服务器管理员还应该检查虚拟机监控层面是否开启了安全组日志，客户是否可以访问这些日志。日志应至少包含“拒绝访问”事件，以对潜在攻击提供透明度。几乎所有云提供商都有某种中央日志报告，向客户显示各种云服务或使用的应用程序接口\
  \ (API) 中的所有安全相关事件。这些日志必须由管理员监控，并可以集成到客户内部的安全监控或事件处理过程中。云服务器必须像云客户运营的任何本地服务器一样进行监控和记录。\n\
  \n\n\n\n\n## 17.6 云服务器加密选项\n\n对存储在云端的数据、传输以及云环境内的通信进行加密，或使用强加密算法对管理命令进行身份验证，是所有云服务器安装中的一项关键功能。加密可能是解决云端安全问题的最重要的答案之一，所有云客户都应该尽可能使用它。\n\
  \n### 17.6.1 云存储加密\n\n通过使用至少通过 `FIPS140` 1 级和 2 级认证的磁盘和存储硬件，可以确保云存储设备和云数据中心的物理安全。此外，云提供商可以销毁所有需要更换或有缺陷的磁盘，以确保没有任何带有潜在客户数据的磁盘离开云提供商的数据中心。\n\
  \n许多云服务供应商可以使用服务器端加密（`SSE`）对存储数据本身进行加密。这将使用强加密算法对云存储设备上的数据进行加密，但加密密钥留在云提供商手中，不受云客户的控制。如果没有提供其他选项，云服务器管理员应默认对所使用的云存储激活\
  \ `SSE`。这种加密对防止未经授权访问客户数据提供了一些基本保护，但也意味着该解决方案的安全性取决于云提供商限制对存储加密密钥访问的能力（即使是对其他员工也是如此）。因此，最终这是一个信任问题。如果云提供商使用物理和逻辑安全的专用加密硬件，并经过独立审计师的认证和定期检查，信任可以增加。\n\
  \n云服务器管理员可以安装的另一种安全解决方案是专用存储网关服务器，它允许加密密钥和某些功能保留在网关内部。该服务器将位于现场，即客户的内部数据中心、服务器房或另一个托管合作伙伴的数据中心内。因此，存储请求将通过网关（由管理员控制）发送到云提供商控制的云存储服务。如果云客户希望不仅对加密密钥，还对密钥管理和使用的加密算法拥有完全控制权，这种解决方案非常有帮助。云客户还应该调查提供商是否为云存储原始设备提供块加密，或为每个存储卷提供进一步的加密选项。[图\
  \ 17.4] 显示了存储、虚拟机镜像或网络通信级别的加密选项。建议在所有这些层上使用加密，特别是当云系统处理机数据时。\n\n![图 17.4 云加密选项。](img/fig17.4.jpg)\n\
  \n图 17.4 云加密选项。\n\n云服务器管理员应为每个服务器或环境使用专用存储卷或磁盘（如果适用），以避免在不同安全区域或信息类别之间共享存储和访问权限。\n\
  \n## 17.6.2 云端加密密钥管理\n\n适当的加密系统依赖于生成真随机数的熵可用性，从而产生强大且唯一的加密密钥材料。虚拟化和 `VMs` 的使用消耗了大部分熵，如果密钥和种子可以被攻击者、其他云客户或云提供商预测，可能会引入漏洞。使用加密硬件代替基于软件的加密是解决此问题的方法。\n\
  \n专用加密硬件通常称为硬件安全模块（`HSM`）或密钥管理解决方案（`KMS`）。`HSM` 是一种物理硬件设备，用于保护和管理每个客户或云提供商核心加密服务的加密密钥，并在需要时提供加密处理。另一方面，`KMS`\
  \ 的范围更广，是一种集成方法，用于为各种设备、云服务甚至客户应用程序安全地生成、分发和管理加密密钥。\n\n云服务提供商可能提供基于云的 `HSM` 服务，允许客户存储和管理自己的加密密钥，这些密钥是提供商所未知的，且无法被云提供商或任何其他（合法）实体访问或提取。这些专用的客户\
  \ `HSM` 是纯密钥存储器，无法提供完整的 `KMS`。如果客户和云服务器管理员有极高的安全加密需求，建议使用额外的软件 `HSM` 或 `KMS` 设备作为\
  \ `VM` 镜像，可以在同一云环境中作为 `VM` 运行。在这种情况下，云服务器管理员必须在特定的云环境中作为额外的虚拟机实例来操作和配置 `HSM` 解决方案。所有\
  \ `KMS` 部署选项均如图 17.5 所示。\n\n![图 17.5 云中的密钥管理解决方案。](img/fig17.5.jpg)\n\n图 17.5 云中的密钥管理解决方案\n\
  \n但使用这些软件 `VM` 设备也带来了另一个需要优先解决的重要安全风险。发现包含特定密钥的 `VM` 镜像出现在每个启动的设备实例并不罕见。挑战在于配置、克隆或运行一个不嵌入复用敏感信息（如安全密钥和密码）的设备。否则，云管理员将面临风险，例如，相同的加密密钥或加密初始化向量被其他云用户使用，或被潜在的黑客或犯罪分子获取以破解所使用的加密。\n\
  \n### 17.6.3 管理访问的加密与身份验证\n\n指向云管理接口和服务的管理访问和命令必须始终使用强加密协议进行加密和身份验证。\n\n如果使用基于 Web\
  \ 的管理工具（例如通过互联网），必须使用加密的 `HTTPS` 连接进行设置，并至少使用用户名和复杂密码进行基本身份验证，或者更好，使用基于公钥/私钥登录的强身份验证。这同样适用于云管理员或管理员控制的其他服务器/工具发起的\
  \ Web 服务请求或 API 调用。某些云提供商决定对所有 API 请求和管理命令使用 `RSA` 密钥。在这种情况下，云管理员使用唯一的 `RSA` 私钥/公钥来管理云服务器实例或请求/配置云服务。加密\
  \ `RSA` 密钥对与使用的云账户关联，长度至少为 2048 位。公钥存储在云端，云提供商已知。私钥仅云服务器管理员知道并保密。该密钥可登录管理控制台、验证\
  \ API 调用或注册和创建云 `VM` 镜像。\n\n## 17.7 网络安全架构\n\n云服务器本身周围的网络安全架构对于任何云解决方案的整体安全完整性也至关重要。云服务器管理员必须对其服务器环境的网络安全特征和所需的网络拓扑有清晰的理解，以确保服务器通信得到适当保护并限制在最小暴露范围内。\n\
  \n### 17.7.1 私有有云安全设计\n\n\n\n\n\n云服务器可以在公有云或私有云环境中运行。云服务提供在其公有云内部提供一个 `VPC`，允许客户将虚拟机与其他客户或公共网络段隔离开。这在大多数情况下是通过通过分配私有\
  \ IP 子网，并结合多种网络技术（如虚拟局域网 `VLANs`）和加密通信通道（例如客户与云服务提供商之间的 `VPN` 隧道）来实现的。\n\n在大多数标准的虚拟云服务器部署中，默认并不使用\
  \ `VPC` 设置。相反，实例被部署在可能与其他客户共享的默认公有云环境中。云服务器管理员必须决定是否需要专用的私有环境以及相应的 `VPC` 配置。大多数公司倾向于为其核心\
  \ IT 业务系统使用 `VPC` 设置，以符合其内部安全策略和隔离需求。\n\n使用 `VPC` 允许管理员在环境中激活多个安全访问控制，以控制其云服务器的可见性，并管理这些服务器环境与其他系统甚至互联网之间允许的数据流。例如，所有的互联网网络流量都需要先通过\
  \ `VPC ACLs`，然后由前述的虚拟机监控程序安全组对指定的 `VM` 进行额外的检查。这允许实现多层防御，从而提高整体网络安全水平。\n\n关于 `VPC`\
  \ 功能，了解云服务提供商是如何实现它的也很重要。某些提供商执行一项规则：`VPS` 一旦创建，之后无法更改。如果云管理员想要更改 `VPC` 名称，他必须删除旧的\
  \ `VPC` 并从头开始创建一个具有新名称的新。`VPC` 通常仅针对某个区域定义，但可以跨越多个可用区。在 `VPC` ，云服务器管理员可以定义一个或多个\
  \ `VPC` 子网；这有助于划分云服务器环境，并设计符合应用程序或处理数据保护需求的网络拓扑和 `ACL` 规则集。\n\n管理员还需要定义一个互联网网关并主动允许流量通过某些\
  \ `VPC` 及其子网；否则，分配到这些 `VPC` 或子网段的云服务器无法连接互联网。在许多实现中，默认设置为封禁流量。这种 `ACL` 和网关概念允许云客户定义\
  \ `VPC`（子网）之间以及从/到互联网网关的清晰路由规则。\n\n云服务器实例（`VMs`）将被分配到 `VPC` 子网内的 IP 地址。`VPC` 路由规则应基于国际脚本或定义语言（如\
  \ `XML/JSON` 配置语法或 `Cisco ACL` 语法），以便网络或云服务器管理员能够以自动化的方式检查和修改 `ACLs`。当然，这意味着云服务提供商通过\
  \ `API` 或 Web 服务提供这些 `ACL` 规则以供下载和修改。建议至少建立基本的监控，以检测可能导致环境设置不符合预期法律和认证要求的更改。在理想情况下，这些规则的网络管理将透明地集成到网络管理员已使用的现有流程和工具中，使云环境成为内部（例如企业网络设计和网络安全管理）的自然扩展。\n\
  \n### 17.7.2 网络入侵检测与滥用处理\n\nIaaS 云服务提供商应运行入侵检测系统（`IDS`）或入侵防御系统（`IPS`）来监控整个云网络和核心服务。该检测系统与其他安全和操作监控工具相结合，其目的是检测云服务器的可疑行为，检测通过互联网对云环境的攻击，并根据系统在网络中的行为检测潜在的受损或感染恶意软件的系统。云服务提供商甚至可以检测其后端网络（例如虚拟机监控器或物理服务器场）中细微的配置错误或可疑活动，因为这些系统高度标准化且工作方式相同。可以预测并了解这些后端服务和系统可能的网络流量。如果某个后端服务器出现异常（例如尝试建立额外的网络连接或发送异常数据包），将立即被检测到。如果云服务提供商检测到客户云服务器的可疑或禁止活动，或来自互联网针对客户服务器的黑客尝试，他们将通知客户并可能关闭源实例。但云服务器管理员不应仅依赖此网络\
  \ `IDS`，还应监控系统的整体行为和安全状态。一旦检测到入侵或攻击尝试，也应通知云服务提供商。\n\n此外，管理员需要定义一个流程，确保向云服务提供商提供早期信息（例如通过“滥用”通道），以防计划进行漏洞扫描或某些可能被误解为针对云环境攻击的操作。图\
  \ 17.6 显示了此类滥用处理过程的可能实现，并概述了云服务提供商与客户之间的交互。需要注意的是，在这个示例中，客户服务器也可能是受害者并报告攻击，或者服务器可能是作案者并积极尝试入侵其他云系统或互联网系统。\n\
  \n![图 17.6 滥用处理过程示例](img/fig17.6.jpg)\n\n图 17.6 滥用处理过程示例。\n\n这里的挑战在于，当存在许多并行的云服务账户和复杂的环境设置时，管理员如何管理或响应此类通知。建议一个环境尽可能只使用一个账户，并将不同用途的系统环境分开。因此，如果开发环境的活动导致某些问题，将不会影响同一云中的生产环境。\n\
  \n### 17.7.3 客户云连接安全\n\n每种云解决方案都必须通过用户界面或 Web 服务与其客户交互。客户云连接实现了这种通信，并且必须确保安全，以防止数据泄露或向未经授权的第三方披露。所有\
  \ IaaS 云服务提供商都为此类连接提供了选项，从使用和安全角度来看都有优缺点。选择正确的选项取决于客户需求和传输数据的保护目标。\n\n### 17.7.3.1\
  \ VPN 网关\n\n\n\n\n\n许多 IaaS 云服务提供商提供 VPN 网关，以便在 VPC 场景与云客户内部网络之间建立加密隧道。VPN 网关使用由云提供商控制的共享密钥，并且仅支持特定的加密算法和密钥长度，例如\
  \ 128 位 AES 加密。由于许多人现在认为 256 位 AES 加密是强制性的，这对于某些客户来说可能是一个问题。一些供应商对这些担忧做出了回应，指出客户或云服务用户可以在云环境中安装自己的\
  \ VPN 网关（例如作为 VM 虚拟机设备镜像），这允许云服务器管理员控制加密密钥长度和算法，并确保 IaaS 提供商无法获知密钥。[图 17.7] 定义了一个用于业务关键型云系统的\
  \ VPN 网关设置，该系统需要以安全可靠的方式进行管理。除了实际的 VPN 网关外，它还使用了专用的管理服务器或终端系统，并允许仅通过某些代理或负载均衡器访问互联网。这些组件可以由客户安装，也可以作为云提供商服务的一部分提供。\n\
  \n![图 17.7 VPN 网关云架构示例。](img/fig17.7.jpg)\n\n图 17.7 VPN 网关云架构示例。\n\n### 17.7.3.2\
  \ 专线与直接连接\n\n在云客户与云提供商之间使用专用租用线路或多协议标签交换（MPLS）连接要复杂得多，设置耗时，且成本高昂。云提供商并不总是支持此类直接连接。从安全角度来看，重要的是要意识到这些连接默认并不是加密的，并且可能会受到中间人攻击或相关电信公司的网络流量拦截。云客户必须决定租用线路提供商是否可信。在任何情况下，都建议使用加密网络协议来确保数据传输。使用此类连接的巨大优点之一潜在的隔离性和保证带宽。通信是私有且专用的，这可能是某些在云端运行的行业或关键业务系统的要求。\n\
  \n### 17.7.3.3  HTTPS 连接\n\n连接到云服务器实例简单的方法是使用云服务提供商提供的面向互联网的 Web 服务和管理门户。使用 `HTTPS/TLS`\
  \ 加密已成为大多数 Web 服务、特别是管理接口的标准。从客户内部公司网络的大多数地方、家里或任何公共互联网访问点都可以访问。因此，访问云服务既方便又具有成本和时间效益。不需要大量的前期投资或设置阶段。它默认即可用。无需多说，某些高度关键的企业业务系统可能需要更私密、更专用的管理接口和网络连接。在这种情况下，纯互联网管理访问被\
  \ VPN 集成，甚至是云提供商与客户网络之间的专用线路所取代。\n\n云服务器本身可以使用负载均衡服务（如果可用）以便在互联网可见。这些组件不是主要的安全设备，而是用于动态将终端用户的\
  \ Web 服务器流量分发到可用的后端云服务器集群，以优化资源使用和应用程序的响应时间。\n\n尽管如此，IaaS 提供商的负载均衡服务应该能够导入客户特定的\
  \ `HTTPS` Web 服务器证书，以支持加密通信，甚至在负载均衡器上终止 `HTTPS` 连接。这对于实施无法在加密 `HTTPS` 连接上执行的路由或安全规则非常重要。然而，大多数提供商将不支持对此类流量进行重新加密，因此在终止\
  \ `HTTPS` 的情况下，将在 IaaS 负载均衡器与客户实际目标云服务器之间以明文发送。云服务器管理员需要调查使用负载均衡服务是否会损害应用程序的安全以及可能需要的加密需求，并决定在场景中如何使用负载均衡器。\n\
  \n## 17.8 云身份识别与访问管理\n\n对于存储或处理在云服务中的所有机密数据，一个实现职责分离的理念或组织结构是强制性的。在共享云或虚拟化环境中，我们可以区分出必须在身份和访问管理概念中处理和管理的三个层。这些层如下：\n\
  \n1. 客户应用程序管理员\n2. 操作系统、存储或网络层面的 VM 管理员\n3. Hypervisor 或虚拟化主机管理员\n\n可以安全假设第 3 层由云服务提供商的员工和运营伙伴涵盖。第\
  \ 1 层和第 2 层由云客户负责。云服务提供商必须允许客户以高度细粒度的级别管理其云服务器管理员的权限和管理能力。应提供一种访问管理技术，确保云客户之间有清晰的隔离，并额外确保云提供商在客户或外部审计员不知情的情况下无法访问或操纵客户的云服务器。如果您无法确定云账户内的管理用户是否获得了这种水平的隔离，建议为每个关键的云服务器场景使用不同的云账户。\n\
  \n在云账户内创建的用户应管理到对各种云服务功能的读/写和执行权限，例如启动 VM、停止、删除、克隆/快照或挂起的权限。对于每个云 API 调用或云端用户界面活动，必须实施此类基于角色的权限模型。新创建的用户必须仅拥有基本权限，没有任何管理权限。使用的密码和密钥对于该创建的用户必须是强且唯一的。创建新用户或更改现有用户权限角色的权利必须限制为少数几个甚至一个超级管理员用户。创建自定义角色配置文件是有益的，针对云服务器管理员或其他非管理云用户需要执行的任务进行优化。这可以定义到服务器实例或存储卷，例如，防止管理员\
  \ A 停止访问访问管理员 B 在同一云客户环境中运行场景的云存储。\n\n某些云提供商允许集成客户身份管理系统，将云用户和权限处理集成到云客户现有的企业身份和访问管理流中。云环境成为客户用户和访问管理的扩展，因此从安全角度来看也更容易控制。\n\
  \n\n\n\n保护最关键管理用户或云账户另一种方法是使用多因素身份验证技术（如果云提供商支持该技术）。在许多情况下，此类技术包括使用额外的安全令牌或设备，每次登录云端时都需要将其与用户账户和密码信息配合使用。此处，用户密码是第一个因素，设备上显示的\
  \ PIN 码是第二个因素。这种方法的安全性在于你不仅需要密码，还需要一个每分钟生成新 PIN 码的物理设备。这使得入侵者黑入云用户账户变得困难得多。云提供商应支持在多因素身份验证实现中使用开放标准的开放身份认证\
  \ (OATH) [15]。\n\n当然，必须激活云内部的日志和告警功能，以记录所有的管理活动以及对权限或角色概念的。它还将通知云客户执行某些命令、访问某些服务器或在云存储上读取/写客户数据失败的尝试。\n\
  \n## 17.9 通用云服务器安全措施 (#chapter17.xhtml#re_ch-17-sec-18)\n\n云服务器本身可以像任何其他物理或虚拟服务器一样被锁定。操作系统或应用程序安全的基本原则也适用于云服务器。本章将深入探讨设置安全服务器的一些关键考虑因素。\n\
  \n### 17.9.1 减少管理账户 (#chapter17.xhtml#re_ch-17-sec-19)\n\n管理账户通常拥有访问云服务器或操作系统上所有资源的权限。通过适度的努力，管理员通常可以绕过在应用程序和数据库层面实施的、旨在保护敏感数据的安全措施。因此，要求将管理员的数量减少到最低，并将管理员权限仅分配给负责系统管理的人员。应尽可能用个性化账户替代匿名管理服务账户。此类匿名账户的密码应应至少每\
  \ 3 个月更改一次。\n\n### 17.9.2 确保密码安全 (#chapter17.xhtml#re_ch-17-sec-20)\n\n必须配置并执行密码策略，以防止使用弱密码并确保定期更改密码。集中管理的服务账户和密码始终优于本地用户。一些关键要求如下：\n\
  \n* 强烈建议使用 15 个或更多字母数字字符的密码。\n* 密码不能在其他账户上重复。\n* 凭据不能包含简单的、易猜的单词（例如来自字典的单词）。\n*\
  \ 密码以加盐哈希的形式存储，并使用先进的哈希算法（例如 `SHA-256`）。\n* 对密码哈希的访问受到高度限制。\n* 必须定期更改密码，例如每 90 天一次。\n\
  \n为了在云服务器管理团队内部共享服务账户密码或为了跟踪复杂密码，建议使用密码管理解决方案。\n\n在怀疑凭据泄露的特殊情况下，必须立即更改密码。\n\n###\
  \ 17.9.3 实施防病毒软件 (#chapter17.xhtml#re_ch-17-sec-21)\n\n操作系统必须采用防病毒软件来防止恶意内容。防病毒软件必须支持基于已知病毒的检测。应满足以下要求：\n\
  \n* 防病毒软件必须进行集中管理。\n* 防病毒软件应提供监控和告警。\n* 防病毒特征码应集中分发。\n* 防病毒软件应确保客户端不被禁用。\n* 应至少每周运行一次定期扫描。\n\
  * 防病毒特征码必须每天更新一次。\n* 建议对文件进行实时扫描。\n\n云中此类防病毒解决方案的示例见图 17.8 (#chapter17.xhtml#re17.8)。它利用\
  \ VPN 网关下载新模式。\n\n![图 17.8 IaaS 云中的防病毒解决方案示例。](img/fig17.8.jpg)\n\n图 17.8 IaaS 云中的防病毒解决方案示例。\n\
  \n如果感染未完全修复，始终建议弃用云服务器并启动一个新的。受感染实例的快照可以存档以供取证分析。\n\n### 17.9.4 确保使用最新版本（补丁管理） (#chapter17.xhtml#re_ch-17-sec-22)\n\
  \n确保及时实施最新的补丁、更新和热修复。云服务器的所有核心软件组件（例如操作系统、数据库、Web 服务器）都应保持最新状态。需要建立流程来定期更新这些组件。图\
  \ 17.9 (#chapter17.xhtml#fig17.9) 显示了云中潜在的补丁管理设置。通过 VPN 网关，补丁管理系统可以与企业安全环境集成。补丁管理解决方案不仅扫描云服务器并发布安全补丁，还确保所使用的云\
  \ VM 镜像也是更新的。这确保了新的云服务器实例仅从已修补的 VM 镜像生成。\n\n![图 17.9 IaaS 云中的补丁管理示例。](img/fig17.9.jpg)\n\
  \n图 17.9 IaaS 云中的补丁管理示例。\n\n如果不适用自动更新，云服务器管理员必须监控新补丁的发布，以评估是否由于严重的安全漏洞而需要发布新版本或补丁。\n\
  \n### 17.9.5 为网络或存储共享设置最小权限 (#chapter17.xhtml#re_ch-17-sec-23)\n\n网络或存储共享必须设置最小权限。仅应允许授权的人员根据按需要原则访问此类共享。每个网络共享或存储卷必须分配给一个所有者，由其负责权限管理。所有者应至少每\
  \ 6 个月定期审查一次权限。在审查期间，必须移除不需要访问的账户，并修改账户的读写权限。\n\n### 17.9.6 最小化运行的服务数量 (#chapter17.xhtml#re_ch-17-sec-24)\n\
  \n云服务器上运行的服务数量必须减少到系统运行所需的的服务或业务场景需要的的服务。特别是必须禁用启用网络通信的必要的服务。最小化服务可以减少攻击面并提高性能。\n\
  \n\n\n\n\n### 17.9.7 仅安装操作所需的软件\n系统上应仅安装云操作所需的软件。不需要的软件会增加系统的攻击面，因此必须移除或从不安装。因此，检查所使用的\
  \ VM 镜像至关重要，并针对特定场景使用已经精简或加固的镜像。定制 VM 镜像也是一种可行方案，以确保新创建的云服务器实例中仅运行所需的软件。\n\n###\
  \ 17.9.8 管理协议的网络划分\n终端用户对运行在操作系统层面的特定应用的访问应与管理访问隔离。管理访问应通过单独网络端口使用加密协议进行。管理网络必须通过安全组和网络访问控制列表（network-ACLs）进行隔离，以确保只有授权的管理人员才能访问云服务器的操作系统管理接口。\n\
  \n### 17.9.9 使用安全通信\n每当传输敏感（评级为机密或更高）信息时，用户与云服务器之间或两个系统之间必须启用安全通信。这对于所有管理连接尤其如此。如果操作需要使用不安全的协议，则必须通过安全的\
  \ `VPN` 或 `SSH` 隧道进行隧道。\n\n### 17.9.10 实现备份和恢复流程\n实施备份和恢复程序至关重要。备份程序必须确保满足以下要求：\n\
  * 为所使用的云存储和/或云服务器建立备份流程。\n* 明确定义执行备份的职责。可以使用云备份/快照服务，也可以在云中实施备份解决方案。\n* 规定备份的类型（全量、差异、增量）并进行相应的调度。\n\
  * 备份所有对于成功恢复所需的所有相关数据，如内容/数据和配置。\n* 在每次备份事件后必须检查备份的一致性。\n* 通过执行恢复测试确保备份数据是可恢复的（对于业务关键系统，至少每年执行一次）。\n\
  \n### 17.9.11 确保时间同步\n出于日志记录和可追溯性目的，操作系统的日期时间必须与云提供商提供的时间服务（`NTP`）、其他互联网服务或客户特定的\
  \ `NTP` 服务器实现进行同步。这种时间同步的安全收益是，在云服务器基础设施中收集的所有操作或安全日志中都能获得可靠的时间戳。此外，许多应用程序服务器也需要适当的时间同步以以可靠的方式协同工作。\n\
  \n## 17.10 云端的持续监控\n透明度至关重要，并受到云客户的高度重视；他们开始要求云提供商提供完全的透明度。例如，`IaaS/PaaS` 必须能够立即暴露整个云服务栈的细粒度安全细节和外部审计结果，包括软件版本、补丁级别、防火墙规则、跟踪服务器快照、用户访问权限等。这是一项挑战，必须由云提供商在服务设计和监控工具中解决。云客户必须能够追踪账户中执行的所有活动，特别是当这些活动是由特权管理用户执行时。相应的日志条目必须尽可能保留，但至少保留\
  \ 12 个月，以满足企业云消费者的所有行业需求。日志条目必须包含与云基础设施相关的所有关键事件。关键事件被认为：\n* 用户登录成功\n* 用户登录失败\n\
  * 用户账户更改或删除\n* 云服务故障或命令执行被拒绝\n* 云服务器的启动和关闭\n* 云存储访问\n* 云网络 `ACL`、`VPC` 或 `VPN` 更改\n\
  * 客户云环境内的严重错误\n\n日志条目应包含以下信息（如果相关）：\n* 带有日期和当前时间的时间戳\n* 事件类型\n* 事件类别\n* 应用/服务\n\
  * 登录 ID/账户\n* 源 ID/IP/虚拟服务器名称/存储卷 ID\n\n[图 17.10] 显示了必须为云服务器实施安全监控的各个层级，并解释了哪些级别由云服务提供商覆盖，哪些元素是云客户的唯一责任。某些层级需要客户监控，但云提供商提供了某些监控、日志记录甚至自动应对措施的工具。底层后端层仅由云服务提供商监控，客户将无法获得任何数据或深度见解。客户只能获得定期的认证或证明报告，显示提供商是否有能力管理所请求服务的安全性。\n\
  \n![图 17.10 IaaS 服务器安全监控示例](img/fig17.10.jpg)\n\n图 17.10 IaaS 服务器安全监控示例。\n\n日志文件必须保护免受云提供商未经授权的修改，并应集成到客户的安全信息和事件管理系统中进行进一步分析，并用于客户内部的安全事件管理流程。\n\
  \n云提供商还必须确保对其后端服务和系统进行持续的实时安全监控，并经过独立且定期的外部审计师的确认。过去，许多企业投资于非常详尽的一次性的“快照式”安全审计。这是完全错误的方法。安全审计应被视为一个长期的、持续的、实时的连续过程。与其每\
  \ 6 个月执行一次安全审计，不如每分钟执行一次。这需要持续监控和持续保证。先进的 `IaaS/PaaS` 云提供商将拥有这样的解决方案。\n\n## 17.11\
  \ 总结\n\n\n\n\n总的来说，云服务器应该像任何运行业务关键应用程序和数据的物理或虚拟服务器一样被锁定。其安全保护措施与传统服务器相当，不同之处在于，部分责任和安全设计位于云服务提供商的手中。这也是每个云服务器管理员面临的关键因素，他们需要理解底层云基础设施的安全能力以及云本身提供的安全配置功能。请注意数据存储和处理的位置、可用的隔离选项、云存储或虚拟化程序层面的安全设置，以及云访问管理和监控服务提供的功能。根据用途选择合适的云设计（如私有云、公云或混合云）以及合适的云网络架构设计。此外，即使对于非关键的开发或演示云服务器，也要始终激活加密等某些关键安全措施。尝试在云服务器操作的所有方面纳入“默认安全”原则，并在创建或克隆新的云服务器实例时也考虑这一点，以确保所有服务器都符合所需的安全级别。如果云管理员愿意考虑云设计和云服务的安全特性，就有许多工具和服务以安全的方式锁定和操作云服务器。使用云服务提供具有许多优势，其可靠性或安全性并不低于任何其他部署模型。\n\
