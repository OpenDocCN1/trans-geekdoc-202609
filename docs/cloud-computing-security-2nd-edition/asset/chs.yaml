  ### 9.3.8 云桥接\n\n## 9.4 是什么让云风险变得更大或更小？\n### 9.4.1 增加额外的层\n#### 9.4.1.1 备份\n####\
  \ 9.4.1.2 二步身份验证\n#### 9.4.1.3 生物识别\n#### 9.4.1.4 密码破解概率\n#### 9.4.1.5 数据泄露\n####\
  \ 9.4.1.6 用户行为分析\n\n## 9.5 收益是什么？\n## 9.6 总结\n\n## 9.1 引言\n云已经成为软件生命周期开发的首选平台。开发者能够在利用持续集成（`CI`）和持续部署（`CD`）工具的同时进行软件开发。就像过去的主机一样，用户可以直接登录系统来部署和执行应用程序。云并没有偏离这一原则。云通过引入分布式概念扩展了传统服务器的能力。随着这些引入，对风险缓解也提出了新的需求。显然，云已经从单体主机架构走了很远，但随着安全协议可靠性的提高，风险减少了吗？只有当风险管理策略覆盖系统的所有其他方面时，云的优势才物价值。\n\
  \n## 9.2 我的风险是什么？\n计算机系统存在许多风险：硬件故障、软件漏洞、内部用户、物理安全、停电、网络中断、黑客、病毒、恶意软件、过时的软件、丢失或遗忘的密码以及过期的备份。在`图\
  \ 9.1`《谁是最大的安全风险》，我们看到内部用户和恶意员工处于领先地位。更多风险包括成本增加、供应商推迟维护，以及与托管站点或站点相关的天气风险。云正在扩展，我们面临来自硬件即服务、基础设施即服务、平台即服务和软件即服务的风险。这些许多云服务不受你的控制，并由许多供应商提供安全保护。此外，你通常无法控制他们何时更新你系统中的不同层。例如，当\
  \ `Microsoft` 发布新版本的 `Office 365` 时，你无法控制其中是否存在会暴露你电子邮件的漏洞。同样，当你在云服务器上开发应用程序时，你可能无法控制该基础设施以及它何时以及如何进行更新。管理这些风险对大多数企业来说已变得至关重要，利用技术和第三方合作伙伴来降低风险并增加运行时间是所有供应商和客户的共同目标。\n\
  \n![图 9.1 谁是最大的安全风险？](img/fig9.1.jpg)\n\n图 9.1 谁是最大的安全风险？\n\n### 9.2.1 硬件\n计算机系统存在许多风险：硬件故障、软件漏洞、内部用户、物理安全、停电、网络中断、黑客、病毒、恶意软件、过时的软件、丢失或遗忘的密码以及过期的备份。在`图\
  \ 9.1`《谁是最大的安全风险》，我们看到内部用户和恶意员工处于领先地位。更多风险包括成本增加、供应商推迟维护，以及与托管站点或站点相关的天气风险。云正在扩展，我们面临来自硬件即服务、基础设施即服务、平台即服务和软件即服务的风险。这些许多云服务不受你的控制，并由许多供应商提供安全保护。此外，你通常无法控制他们何时更新你系统中的不同层。例如，当\
  \ `Microsoft` 发布新版本的 `Office 365` 时，你无法控制其中是否存在会暴露你电子邮件的漏洞。同样，当你在云服务器上开发应用程序时，你可能无法控制该基础设施以及它何时以及如何进行更新。管理这些风险对大多数企业来说已变得至关重要，利用技术和第三方合作伙伴来降低风险并增加运行时间是所有供应商和客户的共同目标。\n\
  \n如果没有硬件故障，系统将能够运行。如果硬件发生故障，系统将受到破坏。减轻风险的最佳方法之一是通过冗余。当系统检测到故障时，可以将指定的备份快速切换到使用状态。冗余对于风险至关重要。在系统检测到故障的情况下，可以替换指定的组件。使用\
  \ `Windows Performance Monitor` 等系统诊断工具，管理员可以在故障发生前进一步预测发生的概率。\n\n### 9.2.2 软件\n\
  基础设施软件需要保持更新。这指不是由终端用户管理的应用程序和服务器软件；而是由服务提供商对基础设施的管理。如果平台没有得到妥善维护，黑客和破解者可能会获取你的数据。一个好的问题是，服务提供商如何处理\
  \ `BIOS` 的更新？当服务器软件发布漏洞修复补丁时，它是否被及时安装？询问运行虚拟机的软件年龄，以及其计划生命周期是什么。在计算机云业务中，三年就了一辈子。有许多运行良好的\
  \ `VMWare` 版本；你的服务器托管在哪个版本上？供应商会升级到更高版本的 `VMWare` 吗？软件还可以扩展到防火墙。\n\n### 9.2.3 网络中断\n\
  当家里网络中断时，在网络服务恢复之前，似乎要过几个世纪，尽管它只中断了不到一小时。现在想象你正在为 `Amazon` 运行一个价值数十亿美元的平台。你的服务器每停止一秒，你就会损失数百万美元。如果该服务器宕机一小时，基础设施部门可能会有人丢掉工作。没有不可摧的网络连接，云服务器一无是处。尽管如此，管理与网络连接相关的风险是具有欺骗性的简单。简单地从\
  \ `Comcast Business` 购买快速互联网是经历危险水平服务器停机的一种可靠方法。利用具有可靠第三方供应商的完善基础设施可以减少网络中断的风险。\n\
  \n\n\n\n\n防止迫在眉睫的提供商网络中断威胁的一种保障措施是 ISP 负载均衡。负载均衡涉及通过多个同时连接利用多个互联网服务提供商，例如 `Comcast`、`AT&T`\
  \ 或 `Google Fiber`。并非所有连接都以 100% 的带宽运行，但每条连接都会根据负载动态调整。负载均衡比例由系统架构师决定，通常基于提供商的可靠性和吞吐量。在市场上，有各种利用负载均衡的路由器和交换机。`Cisco`\
  \ 和 `Ubiquiti` 是 `enterprise-networking` 行业的知名品牌。\n\n与互联网通信相关的固有风险形式是 `DNS`（域名服务）中断。与互联网一样，`DNS`\
  \ 是由 `Google`、`Cloudflare`、`Cisco OpenDNS` 或 ISP 自身的第三方提供的服务。假设用户在浏览器中输入了一个 URL，例如\
  \ `[www.yourwebsite.com](http://www.yourwebsite.com)`，如果 `DNS` 宕机，用户将遇到 `HTTP 404`\
  \ 错误。作为业务所有者，遭遇 `DNS` 故障等于完全失去互联网。为了保护自己免受 `DNS` 中断的影响，你需要像互联网服务提供商一样运行多个 `DNS`\
  \ 供应商。在没有这些故障保护措施的情况下运行云平台可能会让你陷入困境。\n\n## 9.2.4 拒绝服务攻击\n\n一种攻击网站的方法是通过远程计算机网络向你的服务提供商发送请求。这有时被称为机器人或\
  \ bot 攻击。它会成功吗？服务提供商是否准备好应对外部攻击？有些路由器可以处理并拦截拒绝服务 (`DOS`) 攻击；这是否包含在你的月费中，还是你必须购买一个？云服务供应商的大多数大型防火墙会识别\
  \ `DOS` 攻击并在其到达你的网站之前将其拦截，但最好向供应商确认情况是否如此。对于一级托管服务提供商来说，除非攻击来自你的网络内部，否则 `DOS` 攻击不应能够接近你的托管系统。\n\
  \n## 9.2.5 黑客和其他敌手\n\n自互联网诞生以来，黑客一直是 IT 专业人员心头挥不掉的刺。他们持续测试他们任何可以触碰的数字系统的强度。虽然黑客的数量可能永远不会减少，但我们可以确定的是，他们访问你安全系统的方法将变得更加狡猾且难以检测。在考虑到归于黑客的风险时，防御分布式云系统变得更具挑战性。\n\
  \n就像人体一样，病毒可能从很小开始但最终会感染整个身体。软件在这一方面也是类似的，因为它可以在没有“健康”安全习惯的情况下感染系统。黑客获取访问的最简单方法之一是安装木马或勒索软件等恶意软件。虽然这类程序的主要目标是窃取财务或个人信息，但它们仍然可能撞上信用卡数据库或关键用户信息——导致你的系统被破解。使用防火墙、身份验证、用户权限和提高员工意识可以轻松击挡这类攻击。\n\
  \n如果你正在面对更有组织性的攻击会发生什么？受过良好教育的黑客可以测试你的云应用程序是否存在薄弱的 `SQL injection` 缓解措施、加密方法和用户身份验证。编写得糟糕的软件可能成为这类攻击的“敞门”。根据\
  \ `Facebook` 的说法，2018 年 9 月，“攻击者利用访问令牌未经授权访问了约 3000 万个 Facebook 账户的信息” [[[1]]。在这种情况下，黑客利用应用程序安全令牌（后端服务的密钥）抓取数百万用户的信息。从大系统到小系统，即使是像\
  \ `Facebook` 这样复杂的系统也面临着同样的风险，特别是当包含数百万用户大量个人信息的数据库处于危险之中时。持续用安全补丁更新软件并从开始就实施经过验证的设计模式是至关重要的。\n\
  \n尽管存在所有关于软件的紧迫担忧，黑客仍然可以从用户那里钓鱼密码和登录信息，以绕过上述所有防火墙、安全层和基于角色的权限。双因子用户身份验证（电子邮件、手机等）是当今大多数系统的行业标准。`Microsoft`\
  \ 和 `Google` 通过使用个人设备和身份验证应用，增强了超出简单验证码和方便登录方法之外的登录安全性。在任何情况下，让所有云用户（无论是低级用户还是管理员）使用安全密码并识别明显的钓鱼尝试都是重要的。\n\
  \n## 9.2.6 密码尝试\n\n在你的基础设施管理中，你有多少机会使用错误的密码登录？这是一个容易攻击的目标吗？你的用户呢；是否设置了限制和等待期？云服务被黑客的一个例子是\
  \ Apple 的 `iCloud™` 图片存储。拥有 iPhone 的名人成为目标，其密码被猜出以进入他们的私人照片流。密码猜测没有限制，因此小偷猜了常用密码，并获得了从他们的\
  \ iCloud 账户获取图片和信息的能力。\n\n一个好的规则是在输入五次错误密码后，系统将锁定你 15–30 分钟。根据你的服务提供商和操作系统，你可能可以选择错误登录次数和锁定分钟。除了锁定之外，通常还会向用户发送电子邮件警报，并通知管理员无效密码尝试和源\
  \ `IP` 地址。当这种情况发生时，系统管理员应该给用户发邮件或打电话，确保他们是输入错误密码的人。也许是大写锁定键开启了，或者他们忘记了。如果用户不是罪祸首，管理员可能希望阻止该\
  \ `IP` 地址进入网络。对无法追溯到个人的无效密码 IP 进行黑名单处理是网络安全的良好做法。确保你的云供应商提供 IP 拦截。\n\n## 9.2.7 密码管理\n\
  \n如何减少涉及密码的风险？密码是访问任何云系统的密钥。考虑到这一点，如果密钥容易被复制（或被访问），使用密钥的意义何在？因此，密码需要足够独特不易被猜到，但又要简单到让用户记住。使用像“password”之类的通用词汇是灾难的根源。\n\
  \n为了让密码被认为是“强密码”，建议其长度足够（在 10–15 个字符之间），并混合大小写、数字和特殊字符（`!`、`?`、`&` 等）。密码越难被破解，黑客访问你云系统的难度就越大。为了进一步加固你的密码，可以使用缩写或随机字符，因为随机字符比整个单词更难生成。\n\
  \n当你拥有一组新密码时，你如何存储它们？对于个人和企业用途，都有第三方密码应用程序，如 `LastPass`、`Dashlane` 和 `Keeper`；你可以通过加密安全地存储这些密码。通过上述应用程序，用户将密码添加到其账户中，密码会被加密。即使黑客获取了程序，密码也是使用只有用户才知道的密钥进行加密的。如果成本合理，此类应用程序可以极大减少密码管理的风险。\n\
  \n\n\n\n你获得了你付出的价值吗？你是否拥有所支付的访问速度、处理能力、内存使用和中央处理器（`CPUs`）？请确保有一种方法对你的云设备进行监控和测试。如果服务提供商过度推售，在每天的高峰时间之前，你可能会获得良好的响应时间。请务必确保问题出在服务提供商那里而不是你的本地网络速度。确保性能指标衡量的是正确的项目对于纠正任何潜在问题至关重要。某些服务商会限制你的处理速度，你不仅要为\
  \ CPU 操作次数付费，还要为这些操作的速度付费。\n\n## 9.2.9 信息泄露\n\n对于任何不幸遭遇数据泄露的人来说，数据泄露都是不可忍的。无论是源于编写糟糕的软件，还是通过内部员工（试图报复你），信息都可能在所有者不知情的情况下向公开。这类泄露不仅会让你的用户暴露在风险之中，还可能引发媒体风暴和随后的不可逆转的品牌损害。在防止内部数据泄露方面，云管理员需要限制对关键信息的访问。只有经过审查且值得信赖的人员才能查看填充姓名、信用卡以及无数其他类型敏感信息的数据库表。为了进一步减少“责任风险”，服务器管理员需要利用某种形式的日志来跟踪谁在何时访问了数据。这些日志使调查人员能够快速追踪到内部或外部泄露的源头。\n\
  \n## 9.2.10 法律追济\n\n如果你或你租赁服务的公司以任何方式违反了法律和/或合同协议，法律追济可能会影响你的底线。例如，如果你在芝加哥地区为数百个小微企业客户托管了云服务，而一次长时间的服务中断导致所有客户离线，他们将如何反应？无论什么情况下，至少会有人因为损失了他们的金钱而向你寻求法律追济。托管他们的网站和信息意味着你对关键运行时间的损失负责。现在，想象一个更糟糕的情况：你不仅丢失了他们的互联网服务，还丢失了他们所有的数据。那将是一场法律灾难。那么，如何妥善降低法律风险呢？\n\
  \n首先是编写合同协议，涵盖你运营云平台的所有责任。在签署客户合同之前，咨询法律专业人士（即精通信息技术的律师）是强制性的。如果你是客户，你的合同可能也需要同一位律师。仅与具有严格、硬性条款（带有或不带有可选协议）的合同签约，将确保你在开展业务时拥有不可更改的规则。此外，合同法律审查可以防止你在一切都出错错的情况下遭受损失，保护你的财务免于陷入巨额法律诉讼的泥潭。\n\
  \n## 9.2.11 供应商与可靠性\n\n你签署的任何书面合同都伴随着与该交易相关的固有风险。如果没有尽职调查，协议可能会将你锁定在一个充满后门或“隐藏”条款的交易中。涉及到风险时，你可以拥有最好的技术和硬件，但没有任何东西能保护你免受由于糟糕供应商导致的频繁停机。大多数为云资源提供服务的供应商不会从事“低质”服务业务，因此最好研究你所在市场的各种可用选择。像\
  \ `AWS`、`Azure` 或 `Google Cloud` 这样的巨型供应商提供最好的品牌产品，但也有无数中小型本地云服务商准备好满足所有预期。在投入大量资金之前，最后的考虑因素是预测该供应商的未来。他们近期会倒闭吗？他们可能倒闭吗？\n\
  \n## 9.2.12 支持级别\n\n你可以依靠什么水平的支持？\n\n## 9.3 通过架构降低风险\n\n想象你是一个架构师，你的新项目是从零开始构建的。正如任何经验丰富的架构师所知，一个良好的结构可以经受时间的考验。正确设计这种结构是架构师的责任。简单地部署你的应用程序，云就足够了。\n\
  \n### 9.3.1 IaaS——基础设施即服务\n\n基础设施是使我们现代生活方式成为可能的动脉命脉。桥梁、隧道、公路和电信网络仅仅是其中的几个例子。基础设施使个人能够进行导航、探索和构建。没有了这些网络，我们的业务和经济将会崩溃。\n\
  \n云是基础设施的一种形式。云由路由器、交换机和服务器的网络构建，它为客户提供“房地产”。`IaaS` 或“基础设施即服务”术语指的是一种向客户出租云服务器的业务模式。租赁服务器硬件允许客户抛弃传统的本地服务器。这些\
  \ `IaaS` 服务器要么是静态的，要么是根据客户需求定制的，并且可以对其“疏忽”操作进行监控。使用 `IaaS` 服务器无需手动升级硬件。供应商允许其客户随心所欲地完全操作云服务器。\n\
  \n与 `IaaS` 相关的风险可以很容易管理。如果你购买的供应商在可靠性和诚信方面有经证明的良好记录，作为客户，你几乎不需要担心。硬件、机器维护和运行时间都由他们负责。你所有的责任都取决于你的软件。\n\
  \n### 9.3.2 PaaS——平台即服务\n\n平台即服务或 `PaaS`，是 `IaaS` 和 `SaaS` 系统之间的中间节点。云 `PaaS` 使架构师能够管理关键软件而无需干预服务器的操作系统或硬件。任何\
  \ `PaaS` 平台本质上都是软件仓库。`PaaS` 平台的常见供应商有 `Pivotal (Cloud Foundry)`、`Google (Google\
  \ Cloud)` 和 `Microsoft (Azure)`。其他不常见的 `PaaS` 技术形式是如 `Google Chromebook` 等笔记本。它们作为云应用程序（如\
  \ `Gmail`）与 `Chromebook` 上的本地硬件之间的桥梁。\n\n\n\n\n\nPaaS 可能出现问题的地方是在供应商端，如图 9.2 所示。就像你自己运行服务器一样，供应商必须担心硬件和操作系统。硬盘、组件和\
  \ Bug 可能会导致关键性故障，最终让你付出金钱。\n\n![图 9.2 平台服务——平台之间的差异。](img/fig9.2.jpg)\n\n图 9.2 平台服务——平台之间的差异。\n\
  \n### 9.3.3 SaaS—软件即服务\n\n现在网上有很多服务，它们取代了以前运行在我们本地个人计算机上的常用应用程序。云端提供了你可以通过网络浏览器访问的软件，可以替代一些最常见的应用程序。许多应用程序都在云端，且其中几个占据主导地位；图\
  \ 9.3 中展示了一些新入者，软件即服务——客户关系管理（CRM）、财务软件和通用办公软件都是这些很好的例子。\n\n![图 9.3 软件即服务——客户关系管理、财务和通用办公软件都在云端。](img/fig9.3.jpg)\n\
  \n图 9.3 软件即服务——客户关系管理、财务和通用办公软件都在云端。\n\n电子邮件和文字处理可能是软件即服务应用最广泛的示例。微软有 Office 365，而\
  \ Google 拥有 Gmail 和 Google Docs 作为软件即服务。你还可以替换你的会计软件。QuickBooks 在线版具有完整的云版本，带有程序的\
  \ Web 界面。你所有的数据和程序都保存在云端的远程服务器上。你只需要一个轻客户端或网络浏览器即可访问此类类型的应用程序。对于 CRM，许多公司使用 Salesforce.com。\n\
  \n### 9.3.4 MaaS—监控即服务\n\n监控系统正变得越来越流行，尤其是其即插即用的特性以及在系统运行时可以更换的部件。服务公司将在你的服务器上安装一个应用程序，将服务器信息发送到其场外的云服务器上。收到的数据将经过分析，以确认你的系统健康状况。如果你的服务器或工作站性能下降和/或在\
  \ 100% 负载下过热；或者空间不足；或者有任何其他类型的警报，将发送警报或采取行动。\n\n### 9.3.5 CaaS—通信即服务\n\n顾顾义，通信即服务是一种允许用户之间进行云端通信的系统。这个术语通常被称为\
  \ VoIP（IP 语音）。流行的 VoIP 应用如 Skype（视频/音频/文本）、Google Hangouts（视频/音频/文本）和 Snapchat（以上所有）都利用\
  \ CaaS 作为它们系统的核心。这些系统中的每一个都利用客户端应用程序向其他用户发送和接收信息。CaaS 后端将消息路由给他人。\n\nCaaS 唯一的真正的缺点是服务中断。当\
  \ CaaS 系统宕机时，通信将在不确定的一时间内受到阻。在此期间，所有通信将通过另一个可用通道进行路由。此外，如果 CaaS 外包到其他地方（例如印度），延迟和连接问题也需要考虑在内。\n\
  \n### 9.3.6 XaaS—万物即服务\n\n这些供应商会将上述任何服务组合，并帮助客户根据其需求选择正确的平台和产品。这些 X 因素公司通常非常高端。他们为自己的经验以及绕过某些服务提供商官僚程序的能力而付费。把他们几乎看作是保险经纪人，为你检查哪些可用以及成本是多少。他们通常会获得账单的百分比作为报酬，并对初始工作收取每小时咨询费。\n\
  \n### 9.3.7 弹性\n\n橡胶可以动态地膨胀和收缩以适应特定的形状。由于其弹性，它是一种宝贵的资源。在我们的语境中，弹性指的是系统添加或删除资源的能力。具有弹性的系统可以根据需求调整内存、处理器核心和硬盘空间（或通过云提供商的基于时间的协议）。例如，像会计师事务所这样的公司可能希望在纳税季节之外通过减少资源来节省费用。一旦税季来临，同一家公司会被客户淹没。在这一期间，额外的云资源将变得价值得多。他们的云提供商可能会在合同协议出于这一特定原因提供虚拟机或专用服务器。\n\
  \n### 9.3.8 云桥接\n\n可以连接多个云应用程序并在它们之间共享数据的程序称为桥接。尝试连接你云中的应用程序就像图 9.4 所示的那样——连接在不同主机计算机上的云应用程序的桥接，可能需要你有一个中间或桥接软件，该软件可以与两个服务器通信并高效地转发你的数据和请求。如果你在云中有多个应用程序，并想在所有应用程序之间共享数据，你需要构建一个云桥接。让多个供应商整合他们的系统有时是困难的。一些流行的整合是银行系统和\
  \ QuickBooks。你的每月对账单可以投递到你的 QuickBooks 账户，从而在你需要平衡支票簿时让你的工作变得更容易。在签署合同之前，务必向不同的云供应商索要概念验证和支持。整合（Mashups）听起来可能很容易，但它们可能非常困难，特别是对于旧云应用程序而言。\n\
  \n![图 9.4 连接你云应用程序的桥接。](img/fig9.4.jpg)\n\n图 9.4 连接你云应用程序的桥接。\n\n## 9.4 是什么让云风险变得更大或更小？\n\
  \n规避风险是计算的一部分。这对于云服务尤其如此。如果云提供商破产了怎么办？如果云提供商遭到攻击了怎么办？图 9.5，控制你的风险表明，你交给云供应商的控制权越多，由于这种控制缺失，你的风险就越大。固有风险与云服务及部署模型的关系[2\\\
  ]显示风险包括系统可用性、成本和对数据的访问。显然，《云计算企业风险管理》出版物指出，你拥有的云越多，风险就越大，你的直接控制权就越少。\n\n![图 9.5\
  \ 控制你的风险。（来自 COSO (2012)。经许可。）](img/fig9.5.jpg)\n\n图 9.5 控制你的风险。（来自 COSO (2012)。经许可。）\n\
  \n采用计算机“租赁”或私有云选项可以获得更多的控制权和更小的风险。可以理解，如果其他应用程序或服务器在相同的硬件上运行，它们会导致你的应用程序变慢，并引发服务器的不可见问题，某些情况下会导致崩溃。当服务器池使用量很高时，带宽可能是一个问题。另一个风险是你的成本。你的模型越是基于按付费服务模型，由于使用或过度使用导致成本上升的风险越大。\n\
  \n### 9.4.1 添加额外的层\n\n在你的云系统涵盖了所有的基础安全设置后，如何调优安全设置，使得即使是最极端的情况也能覆盖？有多种方法可以使用最先进的解决方案优化你的云服务器。有很多选项可以选择，包括服务器备份、双重身份验证和生物识别。这些虽然是可选的，但可以为所有者以及系统终端用户提供额外的安全感。\n\
  \n#### 9.4.1.1 备份\n\n\n\n\n备份服务器不仅是从故障恢复的最快方法，也是最容易实现的解决方案。在发生所担的最坏情况时，你的文件、设置和运行时应用程序副本都可以以冗余方式保存。当该事件发生时，你的服务器可以迅速“转世”回巅峰运行效率。为了确保系统可以从还原点快速加载，系统管理员可以运行自定义的本地脚本，也可以使用专门的第三方软件。这些工具允许管理员选择每次备份发生的时间以及每个份备份的配置方式。\n\
  \n到目前，减轻风险最常见的方法是使用虚拟机（VMs）。每个 VM 都可以预先加载所有所需的软件、安全设置和资源配置，并在之前的 VM 失败时在实例中快速启动。即使恶意软件感染了\
  \ VM，该恶意软件也可以限制在 VM 内部，并可以通过创建新的 VM 实例轻松擦除。虽然这无法防止你遇到硬件故障、网络问题或云提供商争议，但在涉及你宝贵的服务器应用程序时，VM\
  \ 可以涵盖所有其他遗留问题。\n\n### 9.4.1.2 双重认证\n\n黑客对云服务器构成了特殊威胁。缓解这种威胁的方法之一是远程登录需要双重身份验证（参见图\
  \ 9.6）。许多服务设置了系统，你输入用户 ID 和密码，然后系统向你的手机发送一个代码以验证你的用户用户身份。这一额外的步骤可以防止他人即使拥有你的用户名和密码也无法访问你的系统。还有安全的令牌系统可以每隔\
  \ 30 秒更改一次你的密码。RSA SecureID `[3` 令牌可以集成到大多数云系统中。你输入用户名，然后按下令牌上的按钮，并将令牌生成的随机数作为密码，外加上只有你才知道的额外数字。有时这种系统被部署在网络边缘，一旦通过了第一层安全检查，你就要输入第二个用户名和密码以获得服务器的最终访问权限。这通常被称为双因素认证（2FA）。现在许多系统通过短信或电子邮件发送六位或七位数字作为第二次认证。一种风险是你的手机被克隆，黑客获取了二级短信以访问你的系统。\n\
  \n![图 9.6 系统在应用程序内处理双因子认证的示例流程。](img/fig9.6.jpg)\n\n图 9.6 系统在应用程序内处理双因子认证的示例流程。\n\
  \n在你的数据中心拥有政府、金融机构或零售商等大型目标可能会吸引黑客来到该地。大多数云服务公司不会公开其所有的客户，但许多公司会在网站上列出大型列表，让你对选择的服务提供商感到放心。做好研究并做出明智的决定。\n\
  \n### 9.4.1.3 生物识别\n\n除了密码认证外，许多新系统要求生物识别来访问系统。某些系统使用指纹访问。如图 9.7 所示，生物指纹具有独特的图案，可以进行扫描并与系统中捕获的指纹进行比较。2014\
  \ 年，Apple 为 iPhone 引入了指纹访问。通过将手指放在摄像头上，它能够识别不同的细节特征以实现正向匹配，从而允许用户只需将指纹放在摄像头上即可访问。随着\
  \ iPhone 6 的问世，指纹直接从 Home 键中获取。Apple 的 Touch ID 技术允许你快速访问手机，而无需输入密码。有关 Apple 使用的技术的更多信息，请查看\
  \ `[www.apple.com/iphone-6/touch-id/](http://www.apple.com)` `[4]]`。对于 iPhone X\
  \ 及后续机型，Apple 采用面部识别访问应用、密码甚至手机本身。\n\n![图 9.7 生物指纹。](img/fig9.7.jpg)\n\n图 9.7 生物指纹。\n\
  \n许多学校也使用这种技术购买午餐。与其使用借记卡，不如指纹技术向学生账户收费。芝加哥至少有一个云托管提供商需要几何结构访问服务器区域。最后，我们在科幻小说中见过这种视网膜扫描。有些州限制了生物信息的共享。伊利诺伊州的\
  \ Six Flags 因未披露其季票需要儿童指纹而被一位父母起诉。父母赢得了诉讼，现在 Six Flags 必须披露它将存储指纹的时间以及何时使用。某些州通过了法律，要求对生物识别进行通知。Amazon\
  \ 通过三维手部扫描进入生物识别领域。2019 年它仅处于测试阶段，但其错误率低于万分之一；其目标是降至百万分之一。\n\n![图 9.8 视网膜扫描。](img/fig9.8.jpg)\n\
  \n图 9.8 视网膜扫描。\n\n### 9.4.1.4 密码破解概率\n\n著名演员的照片账户被持续的密码尝试所破解。在 2014 年的一些情况下，顶级照片网站没有对错误密码设置计数器。一旦密码被破解，黑客就拿到了名人照片。在进行一定次数的无效密码尝试后设置锁定时间是一个好主意。\n\
  \n密码强度是防止他人猜中密码的另一种方法，使其变得强大。让长度超过 12 个字符。包含大写字母、数字和特殊字符，从而为程序或人类猜测制造梦梦。保持你的密码私密性，不要在登录的每个系统中使用相同的密码。\n\
  \n另一项重要技术是使用一次性密码 `OTP` `[5]`。这已经存在很长时间了，专家们一直撰文章鼓励公司利用 OTP。使用每 30-60 秒生成随机 OTP\
  \ 密码的安全令牌，比持续数月或数年的密码提供了更安全的环境。要对你的基础设施进行快速测试，你可以在 `passwordsarisky.emc.webcontentor.com`\
  \ 参加“你的密码有风险吗？”测试。\n\n\n\n员工可能是系统最常见的威胁之一。爱德华·斯诺登（Edward Snowden）从美国政府拷贝机密文件是一个极端数据泄露的典型案例。拷贝的数据量之巨大，以及拷贝的数据类型，本应该引起指挥链的警报。我确信美国安全局（NSA）已经实施了新政策来防止此类数据泄露，但大多数公司——想想被北朝鲜入侵的索尼——可能还没有。\n\
  \n### 9.4.1.6 用户行为分析\n\n一种新的科学已经应运而生，用于分析用户行为并捕获捣乱的黑客，因为他们会做普通用户不会做的事情。例如，大多数“正常”用户永远不会运行名为\
  \ `IPConfig` 的命令行工具。但为了获取当前电脑的 IP 地址，黑客在访问 PC 后可能会运行此命令。如果网络上的某台 PC 被入侵并开始不符合该“正常”用户特征的行为，那么网络操作中心（NOC）的员工和/或软件就会介入并阻止该设备进行任何操作。越来越多的公司增加了安全运营中心（SOC），与他们的\
  \ NOC 协同工作，以检测并响应安全威胁。\n\n## 9.5 收益是什么？\n\n在云中使用适当的风险缓解技术，短期、中期和长期投资回报是什么？这看起来像是个愚蠢的问题，但每个业务决策都有其固有的优缺点，需要解决。提出这类修辞性问题的目的是帮助阐明云风险缓解策略的内在价值，无论这种价值是否平衡。理解为什么系统如此完美地健健有助于我们间接地为规划系统的未来。在任何情况下，提问都是帮助的，但我们许多人很直率，想要知道经过验证的结果。那么，到底是什么赋予了风险缓解“内在价值”呢？\n\
  \n风险缓解有两个明显的优势。简单来说，从长期来看，你节省了时间和金钱。比这更好的投资呢？无论你是拥有云硬件还是租赁硬件，都节省了原本会投入昂贵的本地服务器（以及人员）的费用。将技术需求外包给微软、谷歌和亚马逊等公司，减少了对充斥着管理员和数据解决方案团队的臃肿\
  \ IT 部门的需求。服务器及其相应的软件环境可以由组织外的专业人士进行管理。这让你能够专注于更迫切的需求——特别是你的财务、营销和其他 IT 需求。云的另一个经常被忽视但为人知的方面是快速扩展的能力。如果你是一家中小型企业，云风险缓解的成本节省可以为你的蓬勃发展省下实打实的现金。仅为所需的内容付费，消除了冗余和未使用服务器资源上的浪费。\n\
  \n## 9.6 总结\n\n云服务时代以及“随处工作，随处连接”的利用时代已经到来。利用优点并规避坏处风险的企业将是生存并繁荣。处于高增长模式的企业将因其快速扩展和改变的能力而获得特别的回报。云业务中建立稳如磐石的基础并收取公平价格的公司将获得长期的客户。留心研究并准备好你的问题。良好的准备和周全的考虑是在云端成功翱翔的关键。\n\
