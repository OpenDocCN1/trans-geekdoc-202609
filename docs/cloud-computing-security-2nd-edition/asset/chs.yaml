  3.4.3 云端泄露的其他可能原因\n3.5 多云中的隐私与安全\n3.5.1 多云中期望的安全与隐私属性\n3.5.2 确保多云中的安全性、隐私性和可靠性\n\
  3.6 云问责机制\n3.7 总结\n参考文献\n\n## 3.1 引言\n\n本章讨论了云计算安全的要素，这是该领域面临的主要挑战之一。它从计算机安全概述开始，讨论了它的三个支柱——机密性、完整性和可用性，以及真实性和不可否认性等其他重要概念。本章还讨论了漏洞、威胁和攻击的一般概念，以及在云计算背景下的这些概念，随后对针对云计算威胁的最常见缓解措施进行了回顾。本章还考虑了云存储服务和多云中的隐私与安全，以及云问责机制。本章以总结和研究的讨论结束。\n\
  \n## 3.2 计算机安全概述\n\n计算机安全由三个主要支柱组成，广为人知的缩写为 `CIA`：即机密性、完整性和可用性。机密性涉及向未经授权的方隐藏敏感信息。有三种有助于执行机密性的机制。第一是`密码学`，它通过数学变换隐藏明文信息。第二是`访问控制`，它定义了允许访问系统某些部分或某些信息的方。第三是`授权`，它决定了每个授权方允许对数据或系统模块执行的操作。\n\
  \n完整性支柱意味着系统及其数据未被未经授权的方篡改。保护完整性的机制通常试图从源上防止篡改或破坏，或者在入侵发生后进行检测。\n\n第三个支柱`可用性`是指系统及其数据应能够及时提供给授权方的属性。还有其他重要概念，例如`真实性`（即数据和交易是真实的属性）和`不可否认性`（即确保一方无法否认某次交易、声明或签名）。\n\
  \n软件、固件和硬件的设计与实现过程存在错误或边界情况，这些可以被攻击者利用。在计算机安全中，我们把这些缺陷称为漏洞。计算机系统永远不会没有漏洞，因为它们是由人类设计、实现和测试的，而人类总是会犯错。因此，漏洞是对安全的威胁。我们将攻击定义为由攻击者实现的威胁，通常是利用了系统的一个或多个漏洞。\n\
  \n云计算中的安全挑战与传统计算并不很区别，只是云环境加剧了漏洞的数量和攻击的影响。由于云环境包含了所有抽象层——应用、操作系统、架构和网络——攻击者有若干种途径可以破坏云服务的安全性。例如，未对输入进行清理的\
  \ Web 云应用程序中的漏洞可能会导致存储在数据中心的敏感数据泄露。\n\n## 3.3 漏洞与攻击\n\n\n\n\n\n正如我们提到的，云计算服务在所有抽象层上都可能存在漏洞[4]]。图\
  \ 3.1 根据漏洞可能发生的抽象层展示了云安全漏洞。\n\n![图 3.1 云安全漏洞。](img/fig3.1.jpg)\n\n图 3.1 云安全漏洞。\n\
  \n### 3.3.1 应用层 (#chapter3.xhtml#re_ch-3-sec-4)\n\n在应用层级，云应用程序可能存在多个弱点，允许攻击者破坏系统。许多云应用程序是基于\
  \ Web 的，具有经典的 Web 漏洞，例如用户输入清理不足，这会导致诸如`SQL 注入`等攻击[5]]。`SQL 注入`漏洞允许攻击者将外部代码注入 Web\
  \ 脚本引擎中，并由`SQL 查询解释器`执行。尽管该漏洞从 21 世纪 20 年代初就开始被研究，但它仍然在漏洞数据库中被报告。\n\n为了理解这种漏洞，首先考虑一个典型场景：用户与托管\
  \ Web 应用程序的 Web 服务器交互，该程序将其数据存储在数据库中。通常，Web 应用程序和数据库存储在不同的机器上。在一个典型场景中，由图书零售商（例如\
  \ Amazon）部署的 Web 应用程序允许用户根据作者、标题、出版社等搜索书籍。整个书籍目录存储在数据库中，应用程序使用`SQL 查询`来检索书籍详情。假设用户搜索由\
  \ Wiley 出版的所有书籍。Web 应用侧的 Web 脚本引擎接收、处理并执行这些数据，将其解释为用户提供的数据。然后，Web 脚本引擎构建一个`SQL 命令`，该命令是应用程序开发人员编写的指令与用户输入的混合。此查询会导致数据库检查`books`\
  \ 表中的每一行，提取`publisher`列值为“Wiley”的每条记录，并返回所有这些记录的集合。该记录集由 Web 应用程序处理，并在`HTML` 页面中呈现给用户。现在，考虑一种场景：攻击者可以导致数据解释出现断裂并跳出数据上下文。`SQL\
  \ 查询`中的字符串数据必须封装在单引号内，以将其与查询的其他部分隔离开。在这种场景下，攻击者提供包含引号的输入来终止其控制的字符串（’），再加上一个新的`SQL\
  \ 命令`，用以修改开发人员意图让应用程序执行的查询。在 Web 脚本语言与`SQL 查询解释器`边界之间，输入的解释方式存在明显的断裂。攻击者输入中的双连字符（`--`）告诉查询解释器忽略行的剩余部分，即使应用程序开发人员可能包含了其他命令。在这种情况下，这种攻击的结果是删除数据库中的整个“books”表，如图\
  \ 3.2 所示。\n\n![图 3.2 SQL 注入漏洞。](img/fig3.2.jpg)\n\n图 3.2 SQL 注入漏洞。\n\n其他基于 Web 的漏洞包括`跨站脚本\
  \ (XSS)`[6]和`跨站请求伪造`[7]。此外，如果应用程序代码使用不验证数组边界的编程语言（如`C`或`C++`）编写，则可能由于`缓冲区溢出`遭受`远程代码注入`漏洞[8]]。如果应用程序没有采用加密技术来维护其处理数据的机密性，也可能面临敏感数据泄露。如果身份验证和访问控制程序存在缺陷，应用程序代码也可能被破坏。应用层的另一个漏洞源是缺陷的应用程序编程接口（API）函数。\n\
  \n### 3.3.2 操作系统层 (#chapter3.xhtml#re_ch-3-sec-5)\n\n操作系统层面的漏洞也会破坏云安全。操作系统（OS）作为任何用`C/C++`编写的软件，容易受到`缓冲区溢出`漏洞的影响。操作系统还容易受到与竞态条件相关的漏洞，例如`TOCTTOU`（检查时间到使用时间）漏洞。`TOCTTOU`\
  \ 漏洞是由系统在检查条件（如安全凭据）和使用检查结果之间发生变化引起的。`TOCTTOU` 包含一个检查阶段（建立一个不变的前置条件，如访问权限）和一个使用阶段（在假设不变性仍然有效的情况下对对象进行操作）。`TOCTTOU`通常发生在`SETUID`进程中，这些进程具有管理员权限，但可以被特权用户调用，以便进程代表用户执行任务。例如，打印程序通常是`SETUID-root`以便访问打印机设备，这是一个需要管理员权限的操作。打印程序以用户用户拥有\
  \ root 权限的方式运行，通过操作系统的`access`函数来发现调用其执行的用户是否有权限读取和打印某个文件。`TOCTTOU`的一个经典例子是系统调用序列`access()`后紧接`open()`。操作系统以交替的方式执行进程，因为操作系统每个\
  \ CPU 只调度一个进程。因此，进程在从开始到结束的执行过程中不会被中断。CPU 执行一个进程一段时间，然后操作系统暂停当前进程并恢复挂起进程的执行。假设图\
  \ 3.3 所示代码的进程在被允许访问`/home/bob/symlink`后执行`fopen()`之前被挂起。假设攻击者的进程被选中执行并将符号链接指向`/etc/passwords`。当第一个进程再次执行时，它将打开一个它无权限的文件（passwords）。\n\
  \n![图 3.3 TOCTTOU 漏洞。](img/fig3.3.jpg)\n\n图 3.3 TOCTTOU 漏洞。\n\n操作系统也容易受到恶意驱动程序和扩展的影响。内核扩展特别是设备驱动程序目前占据了现代代码库的大部分（`Linux`中约占\
  \ 70%，`Windows`中比例更高）[9]]。这些扩展大多是无害的，允许系统与日益多样化的 I/O 设备通信，而无需重启或重新编译操作系统。然而，由于它们以最高权限运行并可能存在漏洞或恶意，它们对系统的信誉构成了威胁。检测恶意扩展极具挑战性，文献中的大多数建议都没有被现代操作系统采用[10\
  \ [](#chapter3.xhtml#re_TNF-CH003_CIT00011)–12]]。\n\n### 3.3.3 虚拟机监控、存储、硬件和网络 (#chapter3.xhtml#re_ch-3-sec-6)\n\
  \n由于云计算依赖于虚拟化技术，虚拟机监控程序和虚拟机（VM）镜像的漏洞也会破坏安全。\n\n\n\n\n虚拟机管理程序复杂代码中的任何弱点或缺陷都可能损害同一服务器上虚拟机（VM）之间的隔离性。云计算也容易受到在服务器之间迁移虚拟机的代码漏洞的影响，以及虚拟机快照和回滚\
  \ `[13]` 的漏洞。这些漏洞可能导致完整性受损、数据泄露和拒绝服务（DoS）攻击。公共仓库中的虚拟机镜像可能包含恶意软件，或存在漏洞或未打补丁的代码。\n\
  \n数据方面存在一些云计算特有的漏洞。数据可能位于不同的国家，这些国家对数据所有权有不同的法律 `[14]`。此外，如果数据在移动或删除时没有从次级存储中妥善清理，可能会发生数据泄露\
  \ `[13]`。\n\n在架构层，与传统计算一样，云计算也容易受到硬件木马的影响，这些木马会在门电路级引入恶意功能 `[15]`。在网络层，云计算也容易受到网络协议漏洞的影响，通常会导致\
  \ DoS 攻击，例如 `TCP-SYN flood`，攻击者发送的连接请求包（`SYN packets`）多于服务器能处理的数量，从而导致合法客户端无法访问\
  \ `[16]`。云计算还容易受到虚拟网络中的嗅探和监视：恶意的虚拟机可以监听虚拟网络，甚至使用地址解析协议（`ARP`）欺骗来重定向指向或其他虚拟机的数据包\
  \ `[17]`。\n\n### 3.3.4 云安全机制\n\n有很多安全机制在应用于云环境中可以帮助缓解前一节描述的若干漏洞。在本节中，我们将讨论其中一些机制，包括数据安全和虚拟化安全机制。\n\
  \n### 3.3.4.1 数据安全\n\n加密通常用于保护云数据的机密性。它涉及使用数学方法和密钥（称为加密密钥）对信息进行转换（加密）。加密后的信息只能使用解密密钥向授权方公开。加密可以防止攻击者在云敏感数据存储于数据中心以及通过网络传输时进行窃听。加密技术有两种：对称加密和非对称加密\
  \ `[18, 19]`。\n\n对称加密使用相同的密钥来加密和解密数据，这使得算法比相应的非对称算法简单。因此，它们的性能优于非对称加密算法，通常快 100\
  \ 到 1000 倍 `[19]`。安全性取决于密钥长度。美国国家标准与技术研究院（`NIST`）建议使用 `160` 到 `512` 位。对称加密通常用于批量加密。\n\
  \n非对称加密使用两个密钥：公钥和私钥。公钥与任何人共享，而私钥由所有者保密。用公钥加密的数据只能用相应的私钥解密，反之亦然。这允许在不需要交换密钥的情况下进行安全通信。然而，非对称加密的计算开销比对称加密更昂。\n\
  \n非对称加密也用于数字签名。数字签名通过发送者的私钥对消息加密完成。任何人都可以使用发送者的公钥验证签名。这确保了消息是由声称的发送者发送且未被更改。用于数字签名的常用算法包括\
  \ `RSA`、`DSA` 和 `ECDSA`。\n\n### 3.3.4.2 数字签名\n\n数字签名是一种确保消息真实性的方法。数字签名实现了不可否认性；一方很难否认发送过消息。数字签名通过发送者的私钥对消息加密来创建。任何人都可以使用发送者的公钥验证签名。这确保了消息是由声称的发送者发送且未被更改。用于数字签名的常用算法包括\
  \ `RSA`、`DSA` 和 `ECDSA`。\n\n现在，让我们考虑一个典型的 Web 应用程序。为了理解 SSL 对 Web 应用程序安全的重要性，请考虑这样一个场景：你想在\
  \ Amazon 上买一本书。当你浏览该网站时，你的网络浏览器和服务器通过标准的 `TCP` 协议连接。通过这种类型的连接，你的浏览器（即正在搜索的物品）与 Amazon\
  \ 服务器（即关于 Amazon 商品的数据）之间交换的数据是没有经过加密的。因为这种交换没有加密，位于你本地网络中的攻击者可以利用网络嗅探程序来检查原始数据。例如，攻击者可以获知某特定机器的用户对关于尤利斯·凯撒的书籍感兴趣。显然，用户需要防止攻击者能够“嗅探”信用卡号和配送信息等敏感数据。另一个挑战是，你的浏览器无法保证它正在“会话”的服务器确实是\
  \ Amazon.com。例如，用户可能误打了 `Amazom.com`，并与虚假浏览器进行通信。因此，用户还需要确保接收信息的服务器确实是 Amazon.com。\n\
  \nSSL 协议通过解决两种需求：使用加密方法隐藏从一台计算机到另一台计算机发送的内容，并采用识别技术确保浏览器正在通信的计算机是可信的。换句话说，通过使用 SSL\
  \ 在 Amazon 购买书籍，用户可以确保没有攻击者会发现其信用卡信息，且任何共享信息仅与真实的 Amazon.com 进行交换。\n\n如图 3.4 所示，当用户在\
  \ Amazon.com 上进行金融交易时，浏览器和服务器会在 `HTTP` (`https`) 之下建立 SSL 连接。注意锁头变成了绿色，表示这是一个受信任的连接。还要注意它显示的是\
  \ `https` 而不是 `http`。\n\n![图 3.4 使用 SSL 进行安全认证的示例](img/fig3.4.jpg)\n\n图 3.4 使用 SSL\
  \ 进行安全认证的示例\n\n\n\n\n\n当用户在电子商务服务器（例如 Amazon）上点击“登录”或“登录”按钮时，其浏览器和服务器将通过“握手”建立 SSL\
  \ 连接，随后进入验证阶段。在握手阶段，浏览器和服务器会就特定的加密算法达成一致，服务器会向客户端发送证书。该证书是由受信任的数字认证机构（`CA`）颁发的数据，它将加密公钥绑定到特定实体（例如\
  \ `Amazon.com`），并用于证明服务器确实是其所声称的身份。\n\n### 3.3.4.3 哈希（Hashing）\n\n哈希用于出于安全目的生成一种单向、不可逆的数据表示形式。哈希函数将明文消息\
  \ `m` 转换为固定大小的哈希代码 `H(m)`，这通常称为哈希。哈希函数的一个有趣特性是：两个不同的消息具有相同的哈希值。此外，一旦信息经过哈希处理，就无法进行还原，因为不存在“解哈希密钥”。哈希可以告知存储在数据中心或传输过程中的数据是否被破坏。例如，可以为某些数据推导出固定长度的哈希代码或消息摘要。消息摘要通常比消息本身小。如果某一方需要通过网络将消息发送给另一方，可以将消息摘要附加在消息上。接收方通过对消息应用相同的哈希函数，并验证消息摘要与消息是否一致来验证消息的完整性。如果攻击者篡改了数据，消息摘要将有所不同。\n\
  \n### 3.3.5 虚拟化安全\n\n文献中有许多工作针对云环境中运行的虚拟机（VMs）的安全性。Wang 和 Jiang 引入了 `HyperSafe`，这是一种为虚拟机管理器提供控制流完整性的方法。它锁定了写保护的内存页并防止它们在运行时被操纵，从而保护虚拟机管理器代码的完整性。\n\
  \nSantos 等人提出了一种可信云计算平台（`TCCP`）方法，使基础设施即服务（`IaaS`）服务如 `Amazon EC2` 能够提供封闭执行环境。`TCCP`\
  \ 确保了虚拟机机机，并允许用户在启动虚拟机之前对 `IaaS` 提供者进行证明，并判断服务是否安全。\n\nZhang 等人引入了 `PALM`，这是一个虚拟机实时迁移框架。该策略由三个模块组成，用于保护敏感数据、元数据以及实时迁移过程本身的隐私和完整性。\n\
  \n## 3.4 云存储服务中的隐私与安全\n\n如今，越来越多的组织开始采用公共云服务来存储数据（例如 `Microsoft Skydrive` 和 `Dropbox`），并使用\
  \ `Amazon EC2` 和 `MapReduce Framework` 来处理数据。调查结果显示，云采用率稳步增长，2013 年受调查者中 75% 的使用了云平台，而\
  \ 2012 年这一比例仅为 67%。云技术的使用也将推动跨组织（例如政府机构）的数据共享发挥关键作用，这将有利于许多社会关键应用，如国土防卫、网络安全、疾病控制和绿色经济。\n\
  \n然而，数据机密性的关键问题阻碍了云技术（尤其是公共云）的广泛采用。确保存储在云中并共享的敏感数据免受未经授权的访问至关重要。这意味着存储在云中的数据应该根据访问控制策略，在不同用户（可能在不同组织）之间进行选择性共享。在执行访问控制时，保护授权用户的个人资料信息（例如用户角色和位置）同样重要，否则可能导致对数据内容的推断。这是因为先进的访问控制系统（例如著名的基于属性的访问控制模型）需要向访问控制系统披露有关用户的执行信息。此外，云中的数据可能会在位于不同地区（甚至不同国家）的数据中心之间传输，而云用户对其数据存储和处理的位置并不了解尽尽。因此，在日常运营中确保隐私合规性对于云服务提供商（`CSPs`）及其客户来说都是一项极具挑战性的任务。明确需要开发针对云的专用技术。本节首先介绍了一种通用的数据保护模型，然后回顾了先进的云保护技术。该节最后对云数据泄露的一些可能原因进行了讨论。\n\
  \n### 3.4.1 云数据保护模型\n\n在云中，我们观察到以下重要特征，这些特征为数据保护技术的发展带来了挑战。云服务可以通过提供者链提供。让我们将直接服务提供者标记为\
  \ `S`，直接和间接承包商为 `S1`、`S2` ... `Sn`。如图 3.5 所示，直接服务提供者与其他六个服务提供者连接，而 `P1`、`P2`、`P3`\
  \ 表示服务提供者子组内各自的策略。用户选择服务提供者时，需要检查候选服务提供者的隐私策略，以确保其符合用户的隐私偏好。更严格地说，可能需要验证间接承包商的策略以满足用户的隐私需求。在建立服务关系时，不仅用户与\
  \ `S` 之间需要达成策略一致，`S` 与 `S1`、`S1` 与 `S2` 等之间也需要达成。在整个服务期间，跨多个方保证并执行用户的隐私需求更具挑战性。\n\
  \n```\n![Figure 3.5 云中的服务链.](img/fig3.5.jpg)\n```\n\n图 3.5 云中的服务链。\n\n\n\n\n基于上述观察，本文提出了一种凝聚性的数据保护框架`[29``。该框架如图\
  \ 3.6 所示，由三个主要部分组成：策略排名、策略集成和策略执行。具体而言，用户加入云端后会面对多个云服务提供商（CSP），每家提供商都能提供其所需的服务。为了找到隐私策略最符合用户隐私需求的服务提供商，将用户的隐私需求和服务提供商的当前隐私策略共同输入到策略排名模块。该排名模块帮助用户选择具有最兼容隐私策略的服务提供商。由于所选的服务提供商可能还没有与用户需求完全匹配的策略，因此第二步是将其策略发送到策略集成模块，该模块将根据双方的协议自动生成一个集成策略。该集成策略以两种格式存在：一种是实际的策略格式，即用特定的策略语言编写的策略；另一种是可执行格式（如\
  \ Java `JAR` 文件），将用于后续的策略执行。在整个服务过程中，用户的数据隐私将受到可执行策略的保护，且可执行策略也可能在直接服务提供商相关的承包商之间传输。\n\
  \n![Figure 3.6 云数据保护模型。](img/fig3.6.jpg)\n\n图 3.6 云数据保护模型。\n\n### 3.4.2 在云端执行访问控制策略\
  \ (#chapter3.xhtml#re_ch-3-sec-14)\n\n如上述数据保护模型所示，策略执行组件对于云端数据的整体安全至关重要`[25, 26,\
  \ ]`。目前已经有一些研究旨在解决这个问题。\n\n某些方法`[30 [](#chapter3.xhtml#re_TNF-CH003_CIT00031)–32]`\
  \ 采用广播密钥管理方案来对云数据提供访问控制。此类方法根据访问控制策略对数据项进行分组，并用不同的密钥对每组进行加密。用户仅被赋予允许访问的数据项的密钥。所有这些加密活动必须在所有者的现场执行，从而导致高昂通信和计算成本。例如，如果某个用户被撤销，所有者必须从云端下载受此影响的数据，生成新的加密密钥，用新密钥重新加密下载的数据，然后将重新加密的数据上传到云端。除了广播密钥管理外，属性基加密（ABE）`[33]`也被用于保护云端的数据隐私。然而，这种方法在处理频繁的用户加入和离开时也不高效。\n\
  \n为了提高性能，一些工作引入了名为“代理”（proxy）的第三方`[28]`，在数据接收者发生变化时进行重加密。然而，它们不能保护用户的身份属性。\n\n另一类有趣的工作`[34]`\
  \ 旨在将数据与访问控制策略紧密绑定，以确保数据在何时何地被访问时，策略都能自动执行。其基本思想是利用 Java 归档（`JARs`）。使用 Java 技术的优势主要有两个：第一，`JARs`为数据及执行引擎提供了轻量级且便携的容器；第二，`JARs`对基础设施的要求极（即远程运行有效的\
  \ Java 运行时环境（`JRE`），这使得我们的方法容易被采用。“笼”（cage）是一个嵌套的 `JAR`，由一个外部 `JAR` 和一个或多个内部 `JAR`组成，如图\
  \ 3.7 所示。关于不同策略的用户数据项将以加密格式存储在不同的内部 `JAR` 中，并附带加密的日志文件。外部 `JAR`包含身份验证模块，它负责对想要访问数据的实体进行验证，选择内部\
  \ `JAR` 并执行相应的策略。\n\n![Figure 3.7 嵌套 JAR。](img/fig3.7.jpg)\n\n图 3.7 嵌套 JAR。\n\n\
  ### 3.4.3 云端泄露的其他可能原因 (#chapter3.xhtml#re_ch-3-sec-15)\n\n除了对实际数据执行用户策略外，数据索引还引发了另一个有趣且非常重要的隐私问题。索引可能包含大量关于数据本身的信息。由于索引通常在服务提供商接收数据并决定建立索引以提高搜索性能后才构建，用户可能并没有意识到数据会被此类使用，而这可能泄露比预期多得信息。更详细的讨论见下文。\n\
  \n支持高效搜索的最常见方案是建立集中索引。索引将每个术语映射到包含该术语的文档集，搜索者通过查询索引来获取匹配文档列表。这种方案通常由网络搜索引擎和中介机构采用。如`[35]`所示，该方案可以通过随内容传播访问控制策略来扩展，以支持访问控制搜索。由于只需要联系索引主机即可执行搜索，因此搜索效率很高。然而，集中索引会将内容提供暴露给任何访问索引的人。这种对访问控制的违反在云环境中可能是不可接受的，因为对索引服务器的信任假设不再成立。此外，索引主机的攻破解可能导致完全且毁灭性的隐私损失。去中心化索引是一种替代架构，用于识别匹配搜索者查询的文档集（或文档主机）。搜索者随后直接联系这些主机以检索匹配文档。访问控制可以通过让提供者在提供文档之前执行其策略来实现。为了克服上述问题，一些工作探索了基于谓词的密码学创建隐私索引的可能性`[36,\
  \ 37, ]`。\n\n尽管这些工作值得关注，但由于密钥管理需求和计算开销，它们缺乏具体的适用性。Bawa 等人`[35]`通过引入分布式访问控制执行协议，提出了一种有趣的隐私索引方法。较近期的工作`[38]`通过赋予用户对索引的更好的控制权，从不同的角度处理隐私问题。具体而言，提出了一种三层数据保护框架，根据数据所有者的需求提供强、中、低保护。这是通过构建类似于上一节所述的\
  \ `JAR` 文件实现的。该 `JAR` 文件封装了数据和策略，并按如下实现了不同级别的保护：\n\n\n\n\n\n*   **强保护**：服务提供商不允许读取用户文件的敏感部分，从而消除因对文档敏感部分进行索引而导致隐私泄露的风险。用户需要针对其数据文件提供敏感字段。然后，`JAR`\
  \ 将执行选择哪些字段供云服务提供商（CSP）读取的功能。在顺序读取文件期间，通过识别受保护字段的起始位置，直接跳过这些受保护字段。\n*   **中级保护**：此选项禁用了对数据文件的随机访问，以防止对文件进行有效的索引。强制\
  \ CSP 在定位其所需内容之前，必须按照顺序读取文件。\n*   **低级保护**：用户在策略中明确指定其数据文件的使用情况以及索引的使用。假设服务提供商是信任的，并将告知并与用户协商用于索引目的的关键词。\n\
  \n## 3.5 多云环境中的隐私与安全\n\n云计算正呈指数级增长，目前已有数百个不同规模的 CSP [39]。“云中云”（也称为云间云）的概念被提出并在近年来得到了研究\
  \ [39, 40, ]。在云中云中，我们将数据以一定程度的冗余分散在多个由不同供应商管理的独立云上，使得即使某部分云不可用，存储的数据也始终可用。\n\n多云环境（图\
  \ 3.8）[40]\\]为云消费者提供了许多许多新的机会和途径。云消费者不仅能够利用一个云提供商，还可以利用多个提供商来解决他们多样化的需求，并在某个提供商停止服务时切换供应商。为了促进多云发展，IEEE\
  \ 发起了云间云测试平台（Intercloud Testbed）项目 [39]，该项目帮助多云之间的交互成为现实。\n\n![Figure 3.8 多云。](img/fig3.8.jpg)\n\
  \n图 3.8 多云。\n\n### 3.5.1 多云环境中的预期安全与隐私属性\n\n虽然云消费者可以享受多个云提供的廉价数据存储和强大的计算能力，但消费者也面临着其外包数据更复杂的可靠性问题和隐私保护问题。具体而言，由于很难获得关于每个\
  \ CSP 可信度的明确保证 [41]]，通常建议云消费者采用可搜索加密技术 [42, 43, \\]，对其外包数据进行加密，使得 CSP 可以在不解密的情况下直接搜索加密数据。尽管在提高可搜索加密的效率和安全性方面做了许多努力，但对于确保可搜索加密数据的可靠性的考虑很少。虽然云存储提供了按需远程备份解决方案，但它不可避免地引发了与单点故障和可能的存储崩溃相关的可靠性担忧。理想的多云环境应该具备以下属性：\n\
  \n*   **可靠性**：给定 `n` 个 CSP，如果至少有 `t`（`t < n`）个 CSP 可，系统仍能运行，其中 `t` 是系统预定义的阈值值。\n\
  *   **语义安全性**：系统应通过以下两个要求来确保语义安全 [44]。首先，给定文件索引和加密文件集合，任何攻击者无法获取除文件长度之外的原始文件任何信息。其次，给定一组关键词查询的陷门（trapdoors），任何攻击者都无法获取除访问模式（即包含查询关键词的文件标识符）和搜索模式（即两次搜索是否在寻找同一个关键词）之外的原始文件任何信息。\n\
  *   **陷门安全性**：这要求任何关于查询关键词的信息（包括搜索模式）在多个 CSP 协作搜索之前都不应被泄露。即使 `t − 1` 个 CSP 被攻击者攻破，该要求依然成立。\n\
  *   **健壮性**：当协议成功完成时，用户将返回并重构正确的文件。当协议中止时，即使在协作搜索阶段，也不会返回任何内容，且 CSP 对文件集合或底层被搜索的关键词一无所知。\n\
  \n### 3.5.2 确保多云环境中的安全性、隐私性和可靠性\n\n值得注意的是，极少的工作考虑到同时确保外包到多个云的数据的可搜索性、隐私性和可靠性问题。现有的可靠性保证完全依赖于每个\
  \ CSP 自身的备份解决方案，但这可能导致单点故障。例如，Amazon 在 2011 年的弹性计算服务崩溃导致一些热门的社交媒体网站离线一天，一个能源部门的协作站点无法使用近\
  \ 2 天。更严重的是，这次崩溃永久地销毁了许多客户的数据，对某些用户造成了严重后果 [45]]。最近的研究 [46, 47, \\] 为云等分布式存储中的数据可靠性提出了了构码（regenerating\
  \ codes）。基于网络编码概念的再生码旨在智能地混合存储在现有存储节点中的数据块，然后在新的存储节点上生成数据。结果表明，在相同的容错水平下，再生码减少了相对于纠删码的数据修复/恢复流量。\n\
  \n实现外包到多个云的数据的可搜索性、隐私性和可靠性的一种朴素方法是简单的复制。特别是，我们将单用户可搜索加密方案复制到 `n` 个 CSP。每个 CSP 存储相同的可搜索密文。因此，即使\
  \ `n − 1` 个 CSP 不可用，远程文件仍然可以访问。然而，这种方法的空间效率不高，因为保存副本需要大量的容量。为了在允许 CSP 故障的同时减少冗余，另一种可能的方法是使用纠删码。具体来说，利用秘密共享技术将文件编码为一组份额并分发到\
  \ `n` 个 CSP，这样如果某些 CSP 不可用，可以使用剩余 CSP 的份额重构原始文件。与第一方法相比，第二种方法通过将可靠性保证从 `n − 1` 降低到\
  \ `n − t` 来节省存储空间。除了可靠性降低之外，由于完成协议需要在 CSP 之间进行多次通信，第二种方法也更加耗时。\n\n\n\n\n\n为了同时实现空间和时间效率，最近提出了一种名为隐私保护存储与检索（STRE）的机制\
  \ `[48]`。`STRE` 机制允许云用户在存在于多个云的 `CSPs` 中分布并搜索其加密数据，同时获得可靠性保证。`STRE` 机制的理念与第二种朴素方法相似，并提议了更高效的基于秘密共享的协议。此外，`STRE`\
  \ 机制还对用户的搜索模式提供了更好的保护。具体而言，许多关于可搜索加密的 `[44, 49, \\]` 的工作会完全泄露用户的搜索模式，而这种模式会揭示两次搜索是否是针对同一个查询关键词。在\
  \ `STRE` 机制中，这种模式泄露风险降低了，因为搜索是基于分布式进行的，并且只有当超过 `t` 个 `CSPs` 串通时，搜索模式才会暴露。以下是 `STRE`\
  \ 机制的概述。\n\n`STRE` 机制由三个主要阶段组成：设置阶段、存储阶段和检索阶段。在设置阶段，根据安全参数生成一个主密钥并将其分配给云用户。在存储阶段，用户获取一组输入文件和主密钥，生成一组文件份额和一个文件索引。文件份额和文件索引被上传到相应的\
  \ `CSP`。检索阶段是搜索包含特定关键词的文件。用户根据查询关键词和他/她的主密钥生成一组陷门份额（trapdoor shares）。陷门份额发送到相应的\
  \ `CSP`。然后，`CSPs` 协作使用各自的陷门份额进行搜索，并将结果传回用户。最后，用户重构并解密结果，每个结果包含查询关键词。\n\n## 3.6 云问责（CLOUD\
  \ ACCOUNTABILITY）\n\n云计算的主要动机之一是可以外包复杂计算并存储大量数据。然而，直到目前，用户在数据“发送”到云端后，很少或没有任何技术手段来实际检查资源消耗和数据状态。云提供者不允许用户观察其内部运行机制，虽然加密可以确保数据的机密性，访问控制可以通过控制谁访问部分数据（或更泛地说是资源）来增强这些保证，但确保完整性和验证数据使用仍然困难。为了应对这些问题，问责是云系统中的一个重要安全需求。问责旨在为云用户提供检测而非预防的解决方案\
  \ `[50]`。其目标不是保护数据隐私或控制资源使用，而是验证谁获取了资源以及如何获取。根据 Ruebsamen 和 Reich 的说法 `[51]`，云问责可以“使云端数据处理更加透明”，使得“采集的数据生命周期事件可以与审计策略进行匹配”。与基于“隐藏或丢失”视角的隐私保护技术不同，问责关注的是保持数据使用的透明和可追溯。传统的问责方法关注数据收集、事后分析和第三方审计。通常，一个问责系统将包括通过日志收集和事件监控收集数据，然后对收集到的证据进行审计和分析，以检测可能的异常或仅仅检查数据血缘。然而，正如\
  \ Ko 等人所述 `[50]`，虚拟化赋予云计算的弹性承诺为问责引入了若干新复杂性，涉及处理高度动态方式连接的多个虚拟和物理资源的能力。此外，日志收集本身也是一项具有挑战性的任务，因为对远程节点的信任可能有限，无法收集有效问责所需的证据。\n\
  \n尽管目前的行业实践基于客户端与云提供者之间的监管和合同协议来确保资源和数据问责 `[52]`，研究人员已调查了通过技术手段克服上述挑战的方法。一种常见方法是依赖计算和存储过程中产生的日志，并辅助以跟踪访问和其他针对数据的信息。最近的工作提议通过数字证据包（evidence\
  \ bags）来解决互操作性和证据完整性，而额外的元数据可以用于证据处理 `[51]`。其他人提议使用代理来促进分布式数据收集并提供更动态的基础设施 `[26,\
  \ 53, \\]`。\n\n另一类旨在解决类似安全问题的工作是日益增长的云溯（cloud provenance）文献。云溯源关注记录数据对象的所有权和处理历史，它被认为是云计算数据取证成功的关键组件\
  \ `[54, 55, \\]`。特别地，研究人员强调溯源可以是推导出所谓“监管链”（chain of custody）的一种，它应该清晰地描述数据是如何被收集、分析和保存的。这对于云取证特别重要，即在法律纠纷发生，确保溯源信息可以作为法庭证据。在现有的提案中，最近一项关于溯源的提案依赖于可证明数据拥有（PDP）的概念\
  \ `[26]`，它本质上构建了可以在客户端进行验证的数据拥有加密证明。\n\n## 3.7 总结\n\n本章讨论了云计算的安全基准，以及其分布式网络化环境如何扩大云软件和数据面临的安全威胁数量。传统计算的漏洞、威胁和攻击同样适用于云计算，此外还有来自虚拟化资源和管理程序的额外威胁。本章还讨论了针对多个抽象层威胁的应对措施。最后，本章探讨了云存储服务和多云中的隐私安全，以及云问责。\n\
  \n云安全中最大的挑战是云提供者如何向云客户端提供安全保证。云客户端别无信任他们的云提供者，而且通常对实际提供的安全水平没有保证。\n\n## 参考文献\n\n\
