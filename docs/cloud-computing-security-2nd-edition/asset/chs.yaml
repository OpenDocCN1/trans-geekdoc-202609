  \ RDIC\n    - 30.3.1 分布式存储中的纠删码\n    - 30.3.2 高可用性与完整性\n        - 30.3.2.1 对抗模型\n\
  \        - 30.3.2.2 HA 设计\n- 30.4 基于网络编码的分布式系统的 RDIC\n    - 30.4.1 分布式存储中的网络编码\n\
