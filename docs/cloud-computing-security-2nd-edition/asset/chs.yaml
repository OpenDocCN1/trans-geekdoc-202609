  \ 对抗模型\n        - 30.4.3.2 RDC-NC 方案概述\n        - 30.4.3.3 RDC-NC 方案细节\n- 30.5 RDIC\
  \ 的新方向\n    - 30.5.1 具有服务器端修复的分布式存储系统\n        - 30.5.1.1 RDC-SR 方案\n    - 30.5.2\
  \ RDIC 的其他范式\n- 30.6 总结\n- 延伸阅读\n- 参考文献\n\n## 30.1 引言\n\n远程数据完整性检查 (`RDIC`) 是一种价值的技术，客户端（验证者）可以通过它有效地确认存储在不可信服务器上的数据随时间推移保持完好。这种保证对于确保数据中心或云存储提供商（`CSPs`）外包数据的长期可靠性至关重要。`RDIC`\
  \ 方案包括可证明数据占有 (`PDP`)（Ateniese 等人 2007, 2011）和可检索性证明 (`PoR`)（Shacham 和 Waters 2008）。当与单个服务器配合时，`RDIC`\
  \ 最价值的部署在于其预防能力：验证者可以定期检查服务器上的数据所有情况，从而检测出数据损坏。\n\n然而，一旦检测到损坏，单服务器设置并不一定允许数据恢复，仅仅因为服务器故障导致了数据不可恢复的损失。因此，`RDIC`\
  \ 必须通过在多个服务器上冗余存储数据来补充。通过这种方式，验证者可以对每个服务器使用 `RDIC`，并在任何一个服务器上检测到数据损坏时，可以使用剩余的健康服务器通过在新服务器上存储数据来恢复所需的冗余水平。为了确保分布式存储系统中的长期数据可靠性，在数据冗余地存储在多个服务器上\
  \ 之后，我们可以将验证者的行为大致分为两个部分：预防和修复。在预防组件中，验证者使用 `RDIC` 协议确保存储服务器上数据的完整性。在修复组件中（当在任何服务器上检测到数据损坏时触发），客户端使用健康服务器的数据来恢复所需的冗余水平。在存储系统的整个生命周期内，预防和修复组件将交替进行。\n\
  \n当分布式存储系统与 `RDIC` 协同使用时，可以在存储系统的生命周期内区分几个阶段：设置、挑战、修复和检索。为了外包文件，数据所有者在设置阶段引入冗余对文件进行编码，并将编码后的数据分布到多个存储服务器。在挑战阶段，数据所有者可以定期要求每个服务器提供其存储数据保持完好的证明。如果在挑战阶段发现服务器损坏，数据所有者可以根据健康服务器的数据采取修复措施，从而恢复系统所需的冗余水平（修复阶段）。在检索阶段，数据所有者检索所存储的文件。\n\
  \n\n\n\n\n在分布式存储系统中引入冗余的主要方法包括通过复制、纠删编码，以及较近期的网络编码。数据复制的基本原理是在不同的存储服务器上存储数据的多个副本，而在纠删编码中，原始数据被编码成片段，并存储在多个存储服务器上。与复制相比，纠删码能够以显著更低的存储开销实现相同甚至更优的可靠性水平（Weatherspoon\
  \ and Kubiatowicz 2002）。用于存储的网络编码（Dimakis et al. 2007, 2010）提供了非常适合深度归档存储的性能特性，这类存储的特点是读取频率低。与纠删编码类似，网络编码可以将一个文件冗余地编码为片段，并将这些片段存储在多个服务器上。然而，当由于服务器故障导致编码丢失并需要重建以保持相同的可靠性水平时，网络编码相比纠删编码具有显著优势：通过联系某些健康服务器，可以以最优的最小通信开销构建一个新的编码片段（修复带宽可以低到与被修复片段相同的水平）。为了评估修复阶段的网络开销，可以使用网络开销因子作为指标，该因子定义为需要从（健康服务器）检索的数据量与创建存储在新服务器上的数据量之间的比例。\n\
  \n目前为止讨论的设置将数据存储外包了，但数据所有者仍然深度参与数据管理过程（特别是在修复受损数据期间）。\n\n如果数据所有者能够完全外包数据存储和数据管理，将是非常有用的；也就是说，在设置阶段之后，数据所有者只需要存储一少量的恒量的数据，并且尽可能少地参与数据的维护。服务器端修复（Chen\
  \ and Curtmola 2013）是一种为了适应这种设置而引入的新范式，在该范式中，服务器负责修复损坏，而客户端在修复期间充当轻量级协调员。\n\n在本章的剩余部分，我们将介绍用于基于复制（第\
  \ 30.2 节）、基于纠删编码（第 30.3 节）和基于网络编码（第 30.4 节）的分布式存储系统的 RDIC 技术。在 30.5 节中，我们将描述最近为分布式\
  \ RDIC 范式提出的新方向。\n\n## 30.2 基于复制的分布式存储系统的 RDIC\n\nCurtmola 等人 (2008a) 解决了在分布式存储系统中创建多个唯一文件副本的问题。这允许客户端查询分布式系统，以确保即使在存储节点共谋的情况下，网络中也存储了其文件的多个唯一副本。最初的动机是让那些使用第三方存储服务（如\
  \ `Amazon S3`(\\*) 或 `Storage Request Broker` (Baru et al. 1998)）归档数据的数据所有者能够对其数据进行自省和维护。然而，这些技术适用于所有基于复制的、分布式的且不可信的存储系统，包括点对点存储系统（Dabek\
  \ et al. 2001; Li et al. 2004; Lillibridge et al. 2003; Muthitacharoen et al. 2002;\
  \ Rowstron and Drusche 2001）。\n\n复制是确保数据可用性和持久性的基本原则（Haeberlen et al. 2005）。管理副本的数量和位置对这一过程至关重要。系统在副本故障时会重新复制数据（Chun\
  \ et al. 2006; Dabek et al. 2004），评估系统内副本的正确性（Maniatis et al. 2005），并在站点之间移动副本以满足可用性目标（Adya\
  \ et al. 2003; Bolosky et al. 2000）。\n\n然而，基于复制的分布式存储系统缺乏允许其安全确定系统中副本数量和位置的机制。执行副本维护的分布式存储系统通常让存储节点通过内容哈希交叉检查副本内容（Chun\
  \ et al. 2006; Maniatis et al. 2005）。最近，让客户端（没有数据副本）检查服务器是否拥有数据副本引起了极大兴趣（Ateniese\
  \ et al. 2011; Juels and Kaliski 2007; Schwarz and Miller 2006）。这类协议容易受到共谋攻击的影响，在这种攻击中，多个表面上在存储副本的服务器实际上只存储了一个副本。通常，这可以通过将挑战从多个站点重定向并转发到单个站点来实现。\n\
  \n存储单个副本但看起来像存储了许多副本，这有利于服务器是有的；第三方外包存储节点可以使用这种共谋攻击多次出售相同的存储空间。在这种情况下，客户端（数据所有者）无法感知由于副本丢失导致的数据可用性和持久性的降低。\n\
  \n### 30.2.1 对手模型\n\nCurtmola 等人考虑了一种模型，其中存储服务器是理性的且受经济驱动的（Curtmola et al. 2008）。在这种背景下，只有当欺骗行为无法被检测到且能获得某些经济利益（例如使用比要求的更少的存储）时，欺骗才有意义。这种对手模型是合理的，涵盖了许多实际设置，在这些设置中，恶意服务器不会为了欺骗而损害自己的声誉，除非能够获得明确的财务收益。此外，服务器可以共谋并仅共同存储一个副本，而不是在客户端不知情的情况下存储\
  \ t 个副本。\n\n### 30.2.2 基于加密的解决方案 (ENC-PDP)\n\n为了防止共谋攻击，客户端需要生成并存储唯一且可识别的文件副本。使副本变得唯一且可识别的简单方法是使用加密。如果客户端通过使用不同的保密密钥加密数据来生成每个副本，那么服务器就无法比较副本、使用一个副本回答另一个副本的挑战，或对副本之间进行压缩。每个副本都是一个单独的文件，使用数据所有权检查协议逐一创建和检查。\n\
  \nCurtmola 等人 (2008)引入了 `ENC-PDP`，这是一种通用的转换，允许客户端将任何确保单文件副本的 PDP 方案转换为允许客户端在 t 个服务器上创建并存储\
  \ t 个唯一且可区分副本的方案：客户端通过使用不同的不同的密钥加密原始文件创建 t 个不同的副本，存储这些 t 个副本，然后使用单副本 PDP 方案（Ateniese\
  \ et al. 2007）强制执行对每个副本副本的持有。本质上，这等同于客户端在 t 个不同的文件上独立应用单副本 PDP 方案。\n\n\n\n\n\n虽然这种转换是通用的，但生成的\
  \ ENC-PDP 方案的效率并非最优：客户端成本（包括设置阶段和挑战阶段）是单副本 PDP 方案客户端成本的 `t` 倍。之前的工作（Ateniese et\
  \ al 2007）已经表明，从客户端的角度来看，预处理阶段的成本是 PDP 方案的限制因素。因此，独立地应用 `t` 次单副本 PDP 方案将需要客户端付出巨大的努力，并可能导致该方案不符合实际需求，特别是当\
  \ `t` 值较大时。此外，为了在修复阶段创建一个新副本，客户端必须执行与生成原始 `t` 个副本中的某一个所需的等数量的计算。\n\n### 30.2.3 一种高效的解决方案\
  \ (MR-PDP)\n\n为了改进 ENC-PDP 方案，一个目标是基于对输入文件的“单次”预处理，创建出 `t` 个唯一且可识别的副本，这些副本适用于基于该预处理的\
  \ PDP。“单次”意味着预处理阶段的成本随 `O(n)` 缩放（其中 `n` 是文件块的数量），而不是 ENC-PDP 中在单独预处理每个副本时所需的 `O(nt)`。另一个目标是拥有一种动态生成新副本的“廉价”方法；换句话说，生成新副本应该复用生成第一个副本所投入的精力。MR-PDP（Curtmola\
  \ et al 2008）是一种用于基于副本的分布式存储系统的高效 RDIC 方案，实现了上述目标。\n\n#### 30.2.3.1 MR-PDP 概述\n\n\
  MR-PDP 对任何数量的副本都使用恒量的元数据，并且可以动态创建新副本，而无需再次预处理文件。此外，可以并发检查多个副本，因此检查 `t` 个副本的费用低于检查单个副本成本的\
  \ `t` 倍。因此，MR-PDP 克服了与 ENC-PDP 相关的的时间、空间和管理开销。\n\nMR-PDP 构建在 PDP 客户端/服务器数据完整性检查方案之上（Ateniese\
  \ et al 2007），因此继承了 PDP 的优点。PDP 允许客户端将文件存储在服务器上，以便稍后挑战服务器以证明其拥有权。在响应挑战时，服务器提供一个概率证明，证明它能够访问客户端之前存储的确切数据。由于挑战是概率性的，因此它是输入/输出（I/O）高效的；服务器在生成证明时访问少量的恒量数据。客户端仅存储少量的\
  \ `O(1)` 密钥材料来验证服务器的证明。该方案引入了同态验证标签的概念，这对于实现低带宽验证至关重要。一组验证标签与每个文件一起存储在服务器上（每个文件块一个标签），允许客户端在不访问实际数据块的情况下检查文件块的拥有权；此外，这些标签可以聚合，从而产生紧凑的拥有权证明。结果是该方案使用了\
  \ `O(1)` 带宽：挑战和响应均约占 200 字节。因此，PDP 允许客户端在不从服务器检索数据且不让服务器访问整个文件的情况下验证数据所有权。这使得检查远程存储的大量数据的所有权变得切实可行。\n\
  \nMR-PDP 将 PDP 扩展到适用于多个副本，因此最初存储 `t` 个副本的客户端随后可以接收到保证，即存储系统可以产生 `t` 个副本，每个副本都可以用于重建原始文件数据。副本由原始文件数据通过伪随机函数生成的随机数进行掩码组成。由于每个副本使用不同的伪随机函数，副本之间无法相互比较或压缩。MR-PDP\
  \ 修改了 PDP 的同态验证标签，使得一组标签可以用于验证任意数量的副本。这些标签需要针对原始文件数据生成一次。因此，副本的创建是高效且增量的；它由对现有副本进行去掩码并用新的随机数进行重新掩码组成。事实上，MR-PDP\
  \ 在所有相关参数上几乎与单副本 PDP 方案一样高效。\n\n#### 30.2.3.2 MR-PDP 方案细节\n\nMR-PDP 方案由四个阶段组成：设置、挑战、修复和检索。在设置阶段，客户端预处理要存储的文件。如[图\
  \ 30.1]所示，客户端首先将原始文件 `F` 加密为 `F ˜`，然后使用 `F ˜` 生成一组验证标签（每个文件块一个标签）。客户端还使用加密文件 `F\
  \ ˜` 生成 `t` 个不同的文件副本，其中每个副本 `F[u]` 是通过用随机值 `R[u]`（专门为该副本生成）掩码 `F ˜` 的数据块得到的。然后，客户端在每个服务器\
  \ `S[u]` 上存储副本 `F[u]` 和一组验证标签。注意，客户端生成一组验证标签，这独立于设置期间最初创建或稍后修复期间创建的副本数量。\n\n![图\
  \ 30.1 在设置期间，客户端将文件 F 加密为 F ˜，并使用 F ˜ 生成 Σ（验证标签集）和 t 个不同的文件副本 F1, …, F t。](img/fig30.1.jpg)\n\
  \n图 30.1 在设置期间，客户端将文件 `F` 加密为 `F ˜`，并使用 `F ˜` 生成 `Σ`（验证标签集）和 `t` 个不同的文件副本 `F1`、……`Ft`。\n\
  \n在挑战阶段，客户端挑战 `S[u]` 证明对副本 `F[u]` 中子集块的拥有权，如[图 30.2]所示。通过在每次挑战中采样随机块，客户端确保了：(a)\
  \ 服务器无法重用之前的回答；(b) 服务器的开销受采样数量限制；(c) 数据所有权保证适用于整个副本 `F[u]`。服务器 `S[u]` 根据客户端的挑战、存储的副本\
  \ `F[u]` 和一组验证标签计算拥有权证明。客户端根据其密钥计算出的随机值 `R[u]`、挑战和证明来验证来自 `S[u]` 的证明的有效性。\n\n![图\
  \ 30.2 在挑战阶段，对副本 F u 的单个挑战是客户端 C 和服务器 u 之间的四步协议：(1) C 挑战 u 以证明拥有 F u；(2) u 生成证明\
  \ V；(3) u 将 V 发送给 C；(4) C 检查 V。](img/fig30.2.jpg)\n\n图 30.2 在挑战阶段，对副本 `F[u]` 的单个挑战是客户端\
  \ `C` 和服务器 `S[u]` 之间的四步协议：(1) `C` 挑战 `S[u]` 以证明拥有 `F[u]`；(2) `S[u]` 生成拥有权证明 `V`；(3)\
  \ `S[u]` 将 `V` 发送给 `C`；(4) `C` 检查 `V` 的有效性。\n\n在修复阶段，客户端可以从加密文件 `F ˜` 动态生成新副本 `F[u]`。如果其本地存储中没有\
  \ `F ˜`，客户端会检索任何现有副本并进行去掩码以恢复 `F ˜`。新副本 `F[u]` 是通过与设置阶段衍生副本时相同的掩码方法从 `F ˜` 出的。副本创建过程非常轻量，因为它不需要客户端进行昂贵的指数运算。这允许客户端根据需要轻松创建新副本，满足任何副本管理系统的基本要求。在检索阶段，客户端只需检索一个副本并进行去掩码以恢复\
  \ `F ˜`。\n\n\n\n\n\n对于客户端而言，最昂贵的操作是生成验证标签，但这在设置阶段仅执行一次。新的副本被绑定到设置期间生成的同一组验证标签上。因此，生成新副本是一个轻量级操作，因为它不需要在客户端进行任何昂贵的幂运算。注意，挑战阶段和修复阶段可以交替进行。\n\
  \n### 30.2.3.3 MR-PDP 方案的效率\n\n在大多数参数上，MR-PDP 方案的效率与单服务器 PDP 方案一样。设置阶段的预处理需要客户端进行\
  \ `O(n)` 计算（其中 `n` 是文件块的数量），且与副本数量无关。挑战阶段中的单个挑战对于客户端和被挑战的服务器来说都需要 `O(1)` 计算。此外，服务器只需要访问\
  \ `O(1)` 个数据块即可回答单个挑战。单个挑战的通信成本也是 `O(1)`，因为客户端的挑战和服务器的回复均只有约 200 字节。客户端仅存储少量的常量级密钥材料；无论副本数量如何，存储服务器都需要存储一组验证标签（实际副本之外）。客户端可以在修复阶段廉价地生成新副本，因为这不涉及任何幂运算。\n\
  \n### 30.3 基于纠删码的分布式存储系统的 RDIC\n\n为了构建可靠的分布式存储系统，数据所有者通常将数据冗余存储在多个存储服务器上，即使部分存储服务器损坏，数据也是可的。纠删码已被证明在冗余-可靠性权衡方面是最优的（Weatherspoon\
  \ and Kubiatowicz 2002），并广泛用于确保存储系统的可靠性（Calder et al. 2011; Huang et al. 2012; Plank\
  \ and Greenan 2014）。此外，纠删码是系统的，其输入作为编码输出的一部分嵌入其中。这有一个优势是可以高效地读取文件的任何部分（我们称这种属性为“子文件访问”）。由于上述优势，纠删码被广泛应用于需要频繁读取且以读取密集型负载为特征的存储系统中，例如\
  \ Microsoft Azure ([`azure.microsoft.com`](http://azure.microsoft.com)) 和 HydraStor\
  \ (Dubnicki et al. 2009)。\n\n#### 30.3.1 分布式存储的纠删码\n\n在基于纠删码的存储系统中，要外包的文件被视为段的集合，每个段由多个符号组成\
  \ [一个符号是有限域 GF(2^w) 中的 w-bit 元素]。在将纠删码应用于存储系统时，通常考虑系统的 `(n, k)` 纠删码。该代码将 `k` 个段的文件转换为\
  \ `n` 个段的码字，使得：(a) 码字的前 `k` 个段是原始的 `k` 个文件段，且 (b) 可以从码字的 `n` 个段中的任意 `k` 个恢复原始文件。`n`\
  \ 个编码段存储在 `n` 台服务器上（每个服务器一个编码段）。因此，可以从 `n` 台服务器中的任意 `k` 台恢复原始文件。每当客户端检测到其中一个编码段损坏时，它就可以可以使用剩余的健康段来重新生成受损坏的编码段。与网络开销因子为\
  \ 1 的基于复制的分布式存储系统相比，纠删码在修复组件上具有更高的网络开销成本：为了创建一个新的编码块，客户端必须先重建整个文件（即检索 `k` 个编码块），从而产生\
  \ `k` 倍的网络开销因子。[图 30.3] 提供了一个基于 `(3, 2)` 纠删码的分布式存储系统的示例。在基于纠删码的存储系统中，只要 `n` 个编码块中至少有\
  \ `k` 个未损坏，原始文件就可以恢复。\n\n![图 30.3 在纠删码中，原始文件有两个 1 MB 的块 (b1, b2)，并使用 (3, 2) 纠删码编码为三个块\
  \ (c1, c2, c3)（因此可以从任意两个编码块重建 F）。每个编码块存储在不同的服务器上。当 c3 损坏时，客户端首先检索 c1 和 c2 来重建 F，然后重新生成编码块\
  \ c3。](img/fig30.3.jpg)\n\n图 30.3 在纠删码中，原始文件有两个 1 MB 的块 (b[1], b[2])，并使用 (3, 2)\
  \ 纠删码编码为三个块 (c[1], c[2], c[3])（因此可以从任意两个编码块重建 F）。每个编码块存储在不同的服务器上。当 c[3] 损坏时，客户端首先检索\
  \ c[1] 和 c[2] 来重建 F，然后重新生成编码块 c[3]。\n\n#### 30.3.2 高可用性和完整性层\n\nBowers 等人引入了高可用性和完整性层\
  \ (HAIL)，这是一种分布式云存储系统，在强对抗性设置下为云用户提供高可靠性保证（Bowers et al. 2009）。类似于 RAID (Patterson\
  \ et al. 1988) 使用廉价硬盘构建低成本可靠存储，HAIL 通过结合云服务提供商构建可靠的云存储。然而，它们是不同的：RAID 设计用于容忍良性故障（例如硬盘崩溃），而\
  \ HAIL 能够处理强（即移动和拜占庭）对抗模型，在该模型中，允许对手对存储提供商进行渐进式破坏。\n\n##### 30.3.2.1 对抗模型\n\nHAIL\
  \ 考虑了一种可以任意行为（即表现出拜占庭行为）的移动对手，可以在系统生命周期内损坏任何（以及可能的全部）服务器。然而，在任何给定的时间间隔（即一个 epoch）内，对手最多只能损坏\
  \ `n` 台服务器中的 `n – k – 1` 台。\n\n##### 30.3.2.2 HAIL 设计\n\nHAIL 系统通常包含四个阶段：设置、挑战、修复和检索。如图\
  \ 30.4 所示，在设置期间，客户端将文件 F 分为 `k` 个固定大小的段，每个段都是来自 GF(2^w) 的符号集合。作为第一层编码，HAIL 使用服务器码对\
  \ `k` 个段中的每一个段进行编码。服务器码可以修正段内的小 amount 损坏，这种损坏在挑战期间无法被检测。这实现了第 21 章为 RDIC 的健壮性属性。HAIL\
  \ 随后引入了第二层编码——分散码，它利用系统的 `(n, k)` 纠删码将 `k` 个段编码为 `n` 个编码段。为了提高效率，编码过程中使用了条带（striping），一个条带由\
  \ `k` 个文件符号和 `n – k` 个校验符号组成。\n\n图 30.4 HAIL 中文件的编码；k 个数据段存储在 k 台主服务器上，n – k 个校验段存储在\
  \ n – k 台备服务器上。](Images/fig30.4.jpg)\n\n\n\n\n为了便于完整性检查，HAIL 引入了完整性保护的分散码，它将消息认证码（MAC）嵌入到分散码的每个校验符号中，使得完整性检查不需要额外的存储空间。为了构造这种完整性保护的分散码，HAIL\
  \ 在每个校验符号中添加了一个唯一的随机值，该值通过一个带有秘密密钥的伪随机函数生成，该值依赖于唯一的文件句柄、分段索引（即包含该校验符号的校验分段索引）以及符号索引（即该校验符号在相应校验分段中的位置）。客户端计算原始文件\
  \ `F` 的 MAC，并将所有的 `n` 个编码分段外包给 `n` 个存储服务器：前 `k` 个编码分段存储在 `k` 个主上，剩余 `n – k` 个编码分段存储在\
  \ `n – k` 个备服务器上。\n\n在挑战阶段，客户端基于抽检对所有外包的编码分段进行交叉检查；即客户端从服务器的编码分段中随机采样。客户端向所有服务器发起挑战，要求每个服务器证明其存储的编码分段中相同随机符号子集的数据所有权。每个服务器检索并聚合受挑战的符号集，然后返回一个聚合后的符号。客户端检查所有服务器的响应，并可以检测是否存在损坏的分段，因为所有聚合后的符号共同构成了一个有效的分散码（注意，如果聚合后的符号来自校验分段，则需要剔除秘密随机值）。在图\
  \ 30.5 中，我们提供了一个挑战阶段的具体示例，其中客户端检查每个存储分段中相同的三个三个符号的随机子集。\n\n![图 30.5 HAIL 的挑战阶段。](img/fig30.5.jpg)\n\
  \n图 30.5 HAIL 的挑战阶段。\n\n在修复期间，客户端修复在挑战期间发现损坏的编码分段。客户端从存储服务器下载所有的 `n` 个编码分段，对它们进行解码以重构原始文件，并使用全文件\
  \ MAC 检查文件的正确性。然后，客户端重新计算新的编码分段并重新分发，以恢复受损坏服务器影响的冗余水平。在检索期间，客户端解码并重构原始文件。\n\n##\
  \ 30.4 基于网络编码的分布式存储系统的 RDIC](#chapter30.xhtml#re_ch-30-sec-14)\n\n用于存储的网络编码（Dimakis\
  \ et al. 2007, 2010）提供了非常适合具有少读负载特征的深度归档存储的性能特性。网络编码的参数使得读取数据的成本高于数据维护。与纠删码类似，网络编码可将文件冗余地编码为碎片，并将这些碎片存储在\
  \ `n` 个服务器上，以便从任何 `k` 个服务器恢复（并读取）文件。然而，当编码分段由于服务器故障丢失且需要重构以维持相同的可靠性水平时，网络编码比纠删码具有显著优势。通过联系某些健康服务器，可以以最优的最小通信代价构建新的编码分段（修复带宽可以低到仅修复碎片的大小）。这与纠删码（如\
  \ Reed–Solomon 码，Reed and Solomon 1960）形成鲜明对比，后者在从数据丢失中恢复之前必须重建整个文件。存储网络编码的最新结果表明，与标准纠删码相比，维护带宽可以几个数量级（Dimakis\
  \ et al. 2007, 2010）。\n\n然而，在存储中使用网络编码的建议有一个缺点：该码不是系统性的；它没有将输入作为编码输出的一部分。在不重建整个文件的情况下，无法读取文件的小部分。在线存储系统不使用网络编码，因为它们更倾向于优化读取（常用操作）性能。它们使用系统码来支持对数据的子文件访问。存储网络编码仅在数据修复频率远高于读取频率的系统中才有意义。\n\
  \n监管存储、数据托管和深度归档应用呈现了少读负载，这与网络编码的性能特性非常匹配。这些应用为了未来的访问保留数据，在任何时间段内访问的对象很少。这些许多应用不需要子文件访问；它们完整地检索文件。审计提供了几个例子，包括根据《萨班斯-奥克斯利法》保留\
  \ 7 年的业务记录，以及保留 5 年的退税申报。只有那些经过审计或修改的记录才需要访问，但保留所有数据是法律或监管要求。医疗记录也同样。约翰·霍普金斯大学医学档案在一个超过\
  \ 6 PB 的中央存储库中保留了医院收集的所有 MRI、CAT 扫描和 X 射线图像。只有极少数图像会被用于患者的历史追踪或检查类似案例的结果。旧书、手稿和数据集的存储系统也呈现出少读负载。此外，归档存储标准（OAIS\
  \ 2012）将数据表示为不可分割的包，且不支持子文件访问。在应用中，数据的大小和低读取频率决定了存储维护（为了减轻设备或系统故障导致的数据丢失而进行的重新编码）主了读取性能的需求。\n\
  \n### 30.4.1 分布式存储的网络编码](#chapter30.xhtml#re_ch-30-sec-15)\n\n纠删码在冗余–可靠性存储权衡方面是最优的（Weatherspoon\
  \ and Kubiatowicz 2002）。然而，它的修复组件具有较高的网络开销成本：为了创建一个新的编码块，客户端必须首先重建整个文件（即检索 `k` 个编码分段），从而产生\
  \ `k` 倍的网络开销。分布式存储的最新工作（Dimakis et al. 2007, 2010）表明，`k` 倍网络开销并非不可避免。\n\n给定一个由 `m`\
  \ 个块表示的文件 `b_1, b_2, ..., b_m`，客户端使用网络编码生成编码块的线性组合。每个输入块 `b_i` 可被视为列向量：`b_i = (b_i1,\
  \ b_i2, ..., b_iu)`，其中 `bij` 是有限域 `GF(2^w)` 中的元素，被称为符号。给定编码系数向量 `(x[1], ..., x[m])`，其中\
  \ `x[i]` 值从 `GF(2^w)` 中随机选择，计算出编码块 `c_bar` 作为输入块的线性组合[所有代数运算均在 `GF(2^w)` 上进行]：\n\
  \n```\nc_bar = ∑ i=1 m x i b_i\n```\n\n因此，编码块的大小与原始块相同，也可以被视为列向量：`c_bar = (c1, c2,\
  \ ..., cu)` 已证明（Ho et al. 2003, 2006），如果编码系数从足够大的域中随机选择（例如至少 `GF(2⁸)`），则可以通过求解 `m`\
  \ 个方程组恢复原始文件（因为 `m` 个编码块以高概率是线性无关的）。\n\n这些编码块随后存储在服务器上，每个服务器存储 `α'` 位，这包含 `α = α'/|B|`\
  \ 个编码块，其中 `|B| = |F|/m` 表示块的大小（原始和编码）。因此，`α = α'm/|F|`。\n\n\n\n为了实现与纠删码相似的可靠性水平，客户端将数据存储在\
  \ `n` 台服务器上，使得任意 `k` 台服务器都能以高概率恢复原始文件。这意味着任何 `k` 台服务器都共同存储了至少 `m` 个编码块。\n\n当客户端检测到其中一个存储服务器发生损坏时，它会联系\
  \ `l` 台健康服务器，并从每个服务器检索 `γ′` 比（这包含 `β = β′/|B| = β′m/|F|` 个编码块，这些块是通过该服务器存储的数据块的线性组合获得的）。然后，客户端对检索到的块进行进一步的线性组合，生成\
  \ `α` 个编码块并存储在新的服务器上。与基于纠删码的方法不同，客户端不需要为了给新服务器生成编码块而重建整个文件；相反，从健康服务器检索的编码块包含足够的新颖信息，以生成新的编码块。因此，其网络开销因子小于\
  \ `k`。\n\n所有服务器的总存储成本为 `nα′` 比（每台服务器 `α′` 比）。修复组件的网络开销为 `γ′ = lβ′` 比，因此网络开销因子为 `γ′/β′`。存储成本与修复网络开销成本之间存在权衡（Dimakis\
  \ et al. 2010）。简之，对于每个元组 `(n, k, l, α′, γ′)`，存在一组解，在最优权衡曲线上有两个极端点：\n\n*   一个极端点使用元对\
  \ `(α′, γ′) = (|F|/k, |F|l/k(l−k+1))` 来最小化服务器上的存储成本。被称为最小存储再生码（minimum storage regenerating\
  \ code）。每台服务器的存储成本为 `|F|/k`，与基于纠删码的方法相同（事实上，这个极端点提供了与纠删码相同的可靠性-冗余性能），但这种方法的网络开销因子为\
  \ `l/(l−k+1)`，且当 `l > k` 时在修复组件的网络成本方面优于纠删码。\n\n*   另一个极端点通过使用元对 `(α′, γ′) = (2|F|l/(2kl-k²+k),\
  \ 2|F|l/(2kl-k²+k))` 来最小化修复组件的网络开销。被称为最小带宽再生码（minimum bandwidth regenerating code）。值得注意的是，它产生的网络开销因子为\
  \ 1，与基于副本的方法相同。权衡是，该点要求每台服务器存储比纠删码多（略多）的数据。\n\n只要 `n` 台服务器中至少有 `k` 台共同存储了至少 `m`\
  \ 个编码块，且这些块是原始 `m` 个文件块的线性无关组合，就可以恢复原始文件。图 30.6 提供了一个基于网络编码的分布式存储系统的具体示例。\n\n![图\
  \ 30.6 在网络编码中，原始文件有三个 0.66 MB 的块，客户端计算原始块的线性组合作为编码块。两个这样的编码块存储在三台存储服务器的每一个上。注意，这种参数选择遵循了\
  \ (3, 2) 纠删码的保证，即任意两台服务器都可以以高概率恢复原始文件。这意味着任意两台服务器共同存储了至少三个编码块。当客户端检测到其中一个存储服务器发生损坏时，它会联系\
  \ `l` 台健康服务器，并从每个服务器检索 `γ′` 比（这包含 `β = β′/|B| = β′m/|F|` 个编码块，这些块是通过该服务器存储的数据块的线性组合获得的）。然后，客户端对检索到的块进行进一步的线性组合，生成\
  \ `α` 个编码块并存储在新的服务器上。与基于纠删码的方法不同，客户端不需要为了给新服务器生成编码块而重建整个文件；相反，从健康服务器检索的编码块包含足够的新颖信息，以生成新的编码块。因此，其网络开销因子小于\
  \ `k`。所有服务器的总存储成本为 `nα′` 比（每台服务器 `α′` 比）。修复组件的网络开销为 `γ′ = lβ′` 比，因此网络开销因子为 `γ′/β′`。存储成本与修复网络开销成本之间存在权衡（Dimakis\
  \ et al. 2010）。简之，对于每个元组 `(n, k, l, α′, γ′)`，存在一组解，在最优权衡曲线上有两个极端点：*   一个极端点使用元对\
  \ `(α′, γ′) = (|F|/k, |F|l/k(l−k+1))` 来最小化服务器上的存储成本。被称为最小存储再生码。每台服务器的存储成本为 `|F|/k`，与基于纠删码的方法相同（事实上，这个极端点提供了与纠删码相同的可靠性-冗余性能），但这种方法的网络开销因子为\
  \ `l/(l−k+1)`，且当 `l > k` 时在修复组件的网络成本方面优于纠删码。*   另一个极端点通过使用元对 `(α′, γ′) = (2|F|l/(2kl-k²+k),\
  \ 2|F|l/(2kl-k²+k))` 来最小化修复组件的网络开销。被称为最小带宽再生码。值得注意的是，它产生的网络开销因子为 1，与基于副本的方法相同。权衡是，该点要求每台服务器存储比纠删码多（略多）的数据。只要\
  \ `n` 台服务器中至少有 `k` 台共同存储了至少 `m` 个编码块，且这些块是原始 `m` 个文件块的线性无关组合，就可以恢复原始文件。图 30.6 提供了一个基于网络编码的分布式存储系统的具体示例。###\
  \ 30.4.2 基于网络编码的存储系统中对 RDIC 的需求](img/#chapter30.xhtml#re_ch-30-sec-16)\n\n归档存储需要内视和检查以确保数据保存且可检索。由于数据很少读取，仅检查数据的正确性和完整性是不够的。存储故障导致的错误（Krikov\
  \ et al. 2008）、潜在错误（Schroeder et al. 2010）以及管理不当可能会不可察觉地损坏数据。此外，存储供应商可能会恶意删除数据以降低成本（Ateniese\
  \ et al. 2007, 2011），而数据由第三方管理。这增加了数据所有者检查数据状态的需求。\n\nRDIC 协议的性能特性，如 PoR（Ateniese\
  \ et al. 2007）和 PoR（Juels and Kaliski 2007），也符合少读的工作负载。这些协议允许审计员通过恒定的客户端元数据、恒定的网络流量以及（最重要的）通过读取恒定数量的文件碎片来保证数据的完整性。对于大型归档数据集，定期读取每个字节是代价昂贵的。RDIC\
  \ 协议通过对存储数据进行采样来实现保证。与纠错码结合时，对于实际参数可以达到 10⁻¹⁰ 的置信度（Curtmola et al. 2008）。纠错码确保了少量数据损坏不会造成损害（因为损坏的数据可以通过代码恢复），并且大量的损坏很容易检测（因为它必须破坏许多数据块）。\n\
  \n### 30.4.3 RDC-NC 方案](#chapter30.xhtml#re_ch-30-sec-17)\n\n若干 RDIC 方案专门专注于最小化预防组件的成本（例如\
  \ MR-PDP [Curtmola et al. 2008] 和 HAIL [Bowers et al. 2009]）。然而，在少读的分布式存储环境中，修复组件的成本是巨大的，因为长时间内服务器会发生，数据需要重新分布到新服务器上。与基于纠删码的方法相比，基于网络编码的方法可以显著减少修复组件的通信开销。然而，这仅适用于良性环境中。\n\
  \n\n\nChen 等人 (2010) 提出了 `RDC-NC` 方案，该方案旨在在使用网络编码时，在对抗环境下尽可能地减少修复组件的通信开销。实现这一目标的主要挑战源于网络编码的本质：在修复阶段，客户端必须确保服务器执行的编码操作是正确的，而它又无法访问原始数据。同时，客户端的存储应随时间推移保持较小且固定，以符合外包存储的概念。\n\
  \n`RDC-NC` 方案的设计是为了抵抗针对网络编码系统特定的额外攻击，这些攻击在基于纠删码的系统中不会发生。在重放攻击中，攻击者试图重用旧的编码块，以将存储服务器上的冗余降低到原始数据无法恢复程度。在污染攻击中，受损坏的服务器使用正确的数据以在挑战阶段规避检测，但在修复阶段为新数据块的编码提供损坏的数据。客户端必须确保服务器在修复过程中正确地组合其数据块，而无需访问原始块。\n\
  \n### 30.4.3.1 对抗模型\n\n`RDC-NC` 考虑的对抗模型与 `HAIL` (Bowers et al. 2009) 中的模型。作者假设存在一个移动攻击者，它可以采取任意行为（即表现出拜占庭行为），并在系统生命周期内损坏任何（可能可能是所有）服务器。然而，在任何周期（epoch）内，攻击者最多损坏\
  \ `n` 个服务器中的 `n – k` 个。该周期的结构与 `HAIL` 相似，但有一处修改：`RDC-NC` 显式允许攻击者在挑战阶段之后损坏数据。这模拟了在挑战阶段表现诚实、但在修复阶段具有恶意的攻击者。\n\
  \n### 30.4.3.2 RDC-NC 方案概述\n\n客户端选择一组贯穿整个方案的参数集合 `(n, k, l, α′, γ′)`。待外包的文件 `F`\
  \ 被划分为 `m` 个块，`b_bar_1`、`b_bar_2`、……、`b_bar_m`。客户端在 `n` 个服务器中的每一个服务器上计算并存储 `α =\
  \ α′m/|F|` 个编码块（即服务器 `i` 存储编码块 `c_bar_i1`、……、`c_bar_iα`）。符号 `c_bar_ij` 用于表示第 `i`\
  \ 个服务器存储的第 `j` 个编码块。编码块被计算为原始 `m` 个文件块的线性组合。方案使用了两种文件块的相互独立逻辑表示，用于不同的目的：\n\n*  \
  \ 为了检查数据所有权（在挑战阶段），一个块（无论是原始块还是编码块）被视为 `s` 个段（segments）的有序集合。例如，一个编码块 `c_bar_ij\
  \ = (c_ij1, … , c_ijs)`，其中每个段 `c[ijk]` 是块 `c_bar_ij` 的连续部分（实际上，每个段包含一个符号）。\n\n*\
  \   为了网络编码目的，一个块（无论是原始块还是编码块）被视为一个包含 `u` 个符号的列向量。例如，一个编码块 `c_bar_ij = (c_ij1, …\
  \ , c_iju)`，其中 `c[ijk] ∊ GF(p)` 且 `p` 是一个至少 80 位的大质数。\n\n因此，使用了两种类型的验证标签。挑战验证标签（简称为挑战标签）用于检查数据所有权（在挑战阶段），修复验证标签（简称为修复标签）用于确保修复阶段的安全性。每个块中的每个段有一个挑战标签，每个块有一个修复标签。\n\
  \n为了检测直接数据损坏攻击，客户端使用类似于 `PoR` (Shacham and Waters 2008) 和 `PDP` (Ateniese et al.\
  \ 2007) 中基于抽点检查的挑战，检查存储在 `n` 个服务器中的每一个每个网络编码块的完整性。编码块中某个段的挑战标签将该段的数据与块的逻辑标识符绑定，并与用于获取该块的系数向量绑定。因此，客户端隐式地验证了服务器无法使用具有不同逻辑标识符的段来通过挑战，并且验证了客户端检索的系数向量与服务器用于通过挑战的块相对应。如果在挑战阶段发现故障服务器，客户端将使用剩余的健康服务器在修复阶段构建新的编码块，并将它们存储在新的服务器上。\n\
  \n### 30.4.3.3 RDC-NC 方案细节\n\n一个 `RDC-NC` 方案由四个阶段组成：设置、挑战、修复和检索。我们在本节的剩余部分介绍这些阶段的细节。\n\
  \n#### 30.4.3.3.1 设置阶段\n\n客户端首先生成密钥材料。然后生成编码块和要存储在 `n` 个服务器每一个上的元数据。对于每台服务器，客户端生成\
  \ `α` 个编码块、编码系数、对应每个编码块中段的挑战标签，以及每个编码块对应的修复标签。\n\n为了生成一个新的编码块 `c_bar_ij`（其中 `1 ≤\
  \ i ≤ n` 且 `1 ≤ j ≤ α`），客户端从域 `GF(p)` 中选取随机系数，并使用它们线性组合 `m` 个文件块 `b_bar_1`、`b_bar_2`、……、`b_bar_m`。对于编码块中的每个段，客户端计算一个存储在服务器上的挑战标签，服务器将在挑战阶段使用它来证明数据所有权。对于每个\
  \ `c_bar_ij`，客户端在挑战标签中嵌入获取 `c_bar_ij` 的系数向量，以及段索引和 `c_bar_ij` 的逻辑标识符。例如，在图 30.6\
  \ 中，存储在 `S[1]` 的第二个块使用系数向量 `[0, 1, 0]` 计算（其逻辑标识符为“1.2”）。因此，该块第 `k` 个段的挑战标签包含 `[0,\
  \ 1, 0]`、“1.2”和 `k`。\n\n对于每个编码块，客户端还计算一个修复验证标签，用于修复阶段确保服务器使用正确的块和系数生成新的编码块。注意挑战标签和修复标签都是同态验证标签。最后，客户端加密编码系数（这是为了防御重放攻击\
  \ [Chen et al. 2010]），并向每台服务器发送相应的编码块、加密系数和标签。\n\n#### 30.4.3.2 挑战阶段\n\n对于 `n` 个服务器中的每一个，客户端通过对每个编码块的段进行抽点检查，检查存储在该服务器上的\
  \ `α` 个编码块。在此过程中，每台服务器使用其存储的块和相应的挑战标签来证明数据所有权。\n\n#### 30.4.3.3 修复阶段\n\n假设客户端在挑战阶段识别了一个故障服务器并需要对其进行修复。客户端联系\
  \ `l` 台健康服务器 `S_i1`、……、`S_il` 并执行以下操作：\n\n*   对于每个连接的服务器 `i`，客户端从 `GF(p)` 中选择随机系数，供服务器使用以生成新的编码块。\n\
  \n*   服务器 `i` 使用客户端提供的系数线性组合其存储的 `α` 个块，生成一个新的编码块 `a_bar_i`。服务器 `i` 还使用这些系数线性组合相应的修复标签，生成正确编码证明\
  \ `τ[i]`。然后，服务器 `i` 将 `a_bar_i` 和 `τ[i]` 发给客户端，连同用于计算新编码块的块对应的加密系数。\n\n\n\n\n- \
  \  客户端解密系数，并能够检查 `server i` 是否正确执行了编码。结果是确保了 `server i` 使用客户端提供的正确数据块和系数计算了新的编码块。\n\
  \n客户端进一步结合这些 `l` 个编码块以生成 `α` 个新编码块和元数据，然后将它们存储在新的服务器上。图 30.7 展示了修复阶段的一个具体示例，在该阶段中，客户端从两个服务器中的每个服务器检索一个编码块，验证每个编码块的正确性，并使用它们生成用于修复的新编码块。\n\
  \n![图 30.7 RDC-NC 方案的修复阶段。](img/fig30.7.jpg)\n\n图 30.7 RDC-NC 方案的修复阶段。\n\n#### 30.4.3.3.4\
  \ 检索阶段 \n客户端选取 `k` 个服务器，从每个服务器检索存储的 `α` 个编码块、加密的系数以及 `α` 个修复标签。在验证了每个编码块的正确性后，客户端解码\
  \ `kα` 个编码块并恢复原始文件。\n\n## 30.5 分布式 RDIC 的新方向](#chapter30.xhtml#re_ch-30-sec-21)\n\
  \n最近，在分布式 RDIC 范式下，提出了几个新方向。这些包括服务器端修复和其他相关方案。\n\n### 30.5.1 带服务器端修复的分布式存储系统](#chapter30.xhtml#re_ch-30-sec-22)\n\
  \n在云存储外包中，数据所有将数据存储在由多个云存储服务器组成的分布式存储系统中。存储服务器可能属于同一个 `CSP`；例如，Amazon 在不同位置拥有多个数据中心，或者属于不同的\
  \ `CSPs`。数据所有者的最终目标是数据在未来的任何时间都是可检索的。根据这种存储外包的概念，数据所有者希望将数据的存储和管理都外包。换句话说，在设置阶段之后，数据所有者只需要存储少量的常量数据，并且应该尽可能少地参与数据的维护工作。\n\
  \n在之前关于分布式存储系统中 RDIC 的工作中（Bowers et al. 2009; Chen et al. 2010; Curtmola et al.\
  \ 2008），当使用具有公共可验证性的 RDIC 方案时，数据所有者在挑战阶段可以保持极少的参与（即验证数据仍然保持可检索的任务可以委托给第三方审计员）。然而，在所有之前的工作中，修复阶段给数据所有者造成了巨大的负担，他们需要花费大量的计算和通信。例如，为了修复故障服务器的数据，数据所有者需要首先下载与文件大小相等的数据，重新生成存储在新服务器上的数据，然后将这些数据上传到新的健康服务器（Bowers\
  \ et al. 2009; Curtmola et al. 2008）。归档存储处理大量数据（TB 或 PB 级），因此维护数据的健康给数据所有者带来了沉重的负担。\n\
  \n在 `RDC-SR` 方案中，`RDC-SR` 允许数据所有者通过将工作转移到服务器来减少修复阶段的负担。这是可能的，因为服务器可以协作生成新副本，而无需数据所有者的参与。主要的挑战在于如何确保不可信的服务器恰当运行。对于基于纠码的存储系统，也提出了具有服务器端修复的\
  \ RDIC 方案（Chen et al. 205）。\n\n#### 30.5.1.1 RDC-SR 方案](#chapter30.xhtml#re_ch-30-sec-23)\n\
  \n`RDC-SR` 方案允许数据所有者将 `F` 的存储外包给 `t` 个数据中心。为了确保高可靠性和容错性，客户端创建了 `t` 个副本。如果欺骗无法被检测，受利益驱动的攻击者会尝试这样做。`RDC-SR`\
  \ 设计旨在防止财务收益。\n\n两个见解启发了 `RDC-SR` 设计。第一个见解是副本区分：应要求 `t` 个存储服务器存储不同的副本。否则，如果所有副本相同，一组受利益驱动的合谋服务器就可以通过只存储一个副本来节省空间。例如，在图\
  \ 30.8 中，如果文件副本不区分，两个合谋服务器 `S[1]` 和 `S[2]` 就可以欺骗。当客户端挑战 `S[1]` 证明所有权时，它会将挑战重定向到\
  \ `S[2]`。\n\n![图 30.8 如果文件副本不区分，合谋服务器就可以欺骗。](img/fig30.8.jpg)\n\n第二个见解是服务器端修复：通过依靠服务器生成新副本，可以最大限度地减少数据所有者在修复阶段的负担。这样做有两个优势。首先，服务器通常通过优质网络连接（高带宽）连接，而数据所有者的连接可能具有有限的下载/上传带宽。其次，修复期间的计算负担转移到了服务器，允许数据所有者保持轻量化。\n\
  \n之前的基于副本的分布式存储系统的 RDIC 方案（Curtmola et al. 2008）没有让存储服务器访问原始数据所有者的文件。每个副本都是原始文件的掩码/加密版本。结果是修复阶段给数据所有者带来了沉重负担：创建新副本的通信和计算成本与副本的大小成线性关系，因为数据所有者需要下载副本、去掩码/解密、创建新副本并上传新副本。如果服务器无法访问原始文件，那么修复期间这种高强度的数据所有者参与是不可避免的。\n\
  \n#### 30.5.1.1.1 “即时复制”攻击\n\n一种直接的方法是让数据所有者通过对原始文件进行掩码/加密来创建不同的副本。数据所有者向服务器公开用于创建掩码/加密副本的密钥材料。在修复期间，服务器本身可以从健康副本恢复原始文件并恢复受损坏的副本，从而减轻数据所有者的负担。\n\
  \n\n\n\n\n这种基本方法容易受到潜在攻击，即时复制（replicate on the fly, ROTF）攻击：在修复过程中，一组恶意服务器可以声称每当一个现有副本失败时，它们就会生成一个新副本，但实际上它们并没有创建该副本（使用这种策略，受经济利益驱动的服务器组试图使用比其合约义务更少的存储空间）。当客户端在挑战阶段检查新生成的副本时，恶意服务器组可以协作即时生成副本并成功通过验证（该副本在通过挑战后会被立即删除，以节省存储空间）。这将损害存储系统的可靠性，因为随着时间推移，系统最终存储的副本数量将远少于预期数量（少于\
  \ `t` 个），而客户端对此一无所知。\n\n### 30.5.1.1.2 克服 ROTF 攻击\n\n为了克服 ROTF 攻击，RDC-SR 使副本的创建变得耗时。通过这种方式，恶意服务器无法在挑战期间不被发现的情况下生成副本。在设置阶段，客户端首先对原始文件进行预处理并生成\
  \ `t` 个不同的副本。为了区分这些副本，RDC-SR 采用了与 Curtmola 等人相似的掩码策略，其中原始文件的每个符号都通过加上一个模 `p` 的随机值被单独掩码，其中\
  \ `p` 是一个大素数（Curtmola et al. 2008）。此外，RDC-SR 引入了一个新参数 `η`，它表示在生成不同副本时对每个符号施加的掩码操作次数。`η`\
  \ 可以帮助控制掩码带来的计算负载；也就是说，`η` 越大，掩码操作的计算开销越高。这种方法的优势在于可以调整掩码负载以防御不同强度的攻击者。在挑战阶段，如果在一个特定时间\
  \ `τ` 内没有收到服务器的响应，则该服务器的副本将被认为损坏。\n\n### 30.5.2 分布式 RDIC 的其他范式\n\n除了服务器端修复，研究人员还研究了用于分布式\
  \ RDIC 的其他几种范式。RAFT（Bowers et al. 2011）是一种基于时间的 RDIC 方案，它允许客户端获取证明，证明给定文件分布在单个数据中心内预期的物理存储设备上。RAFT\
  \ 可以防御廉价且懒惰的攻击者，攻击者试图通过在较少磁盘上存储较少冗余数据或通过在硬盘上不均匀地映射文件块来走捷径。该方案依赖于单个硬盘的 I/O 瓶颈，具体来说是从两个不同驱动器进行两次并行读取所需明显少于从单个驱动器进行两次顺序读取的时间。\n\
  \n基础数据结构（BDS）模型（Benson et al. 2011）是第一个能够保证多个副本分布在云服务商（CSP）不同数据中心的 RDIC 方案。基于位置的存储（LoSt）（Watson\
  \ et al. 2012）通过依赖 BDS 模型（Benson et al. 2011）和可检索性证明进一步完善了位置证明（PoL）的概念。LoSt 旨在确保外的文件副本存储在指定的区域内，并需要地标基础设施来验证数据的位置。该方案依赖于重编码（由\
  \ CSP 使用其私钥完成）来高效地区分每个服务器的文件标签，而每个服务器将保留相同的文件副本。\n\nGondree 和 Peterson (2013) 进一步放了\
  \ PoL 方案的攻击模型和假设。他们提出了一种基于约束的数据地理定位协议，将基于延迟的地理定位技术与 PDP 方案相结合。\n\n### 30.6 总结\n\n\
  在本章中，我们调查了用于分布式系统的几种 RDIC 方案，这些系统在多个存储服务器上冗余存储数据。存储服务器可以位于相同的数据中心，也可以位于不同的数据中心。这些\
  \ RDIC 方案可以作为审计数据健康的价值机制，特别是在服务器不被完全信任的模型下。这些方案提供了高效检测和恢复损坏数据的机制，有助于确保数据的长期可用性和可靠性。\n\
