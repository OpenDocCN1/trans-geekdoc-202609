  \ Proc. of 点对点系统国际会议 (IPTPS ’02), 2002.\n\n# 高级云计算安全\n\n# 第 31 章\n\n## 云计算高级安全架构\n\
  \n### 31.1 引言\n又是一天，又一次泄露。这是目前云以及整个信息技术的现状。遗憾的是，大多数组织并没有做好充分准备来有效保护其在云端的资产。安全专业人员唯一能做的假设是，所有设备、系统和平台在某种程度上已经被入侵，发生安全漏洞或数据泄露是不可避免的。那么，你该如何防御那些已经被入侵、且在设计上就可以从世界上任何地方访问的资产呢？关注重点所在！\n\
  \n### 31.2 云安全\n“假设被入侵”是一种心态，我们是时候应该采用这种心态了。确定哪些数据是最敏感的以及这些数据是如何被访问的，研究如何监控环境内的活动，并对任何异常情况做出快速响应。仅仅将信息安全视为维护机密性、完整性和可用性已经不够了。虽然这些核心概念仍然重要，但在云中维护这三个支柱所所需的检测和保护机制可能会变得复杂。云是一系列广泛的虚拟化系统、应用程序、技术和策略，属于共同责任模型，而该模型每天都在变得复杂。组织必须在每个领域考虑保护和检测机制，同时不断提高其成熟度，最终驱动与业务对齐的安全战略。\n\
  \n### 31.3 安全设计\n#### 设计特性\n#### 行业标准与合规\n#### 参考架构\n\n### 31.4 利用 API 实现安全\n####\
  \ 云访问\n#### API 安全\n#### 商业工具\n#### 身份与访问管理\n\n### 31.5 IoT 设备\n\n### 31.6 总结\n\n\
  \n\n\n\n![图 31.1 信息安全策略基本概念。](img/fig31.1.jpg)\n\n图 31.1 信息安全策略基本概念。\n\n通过实施强大的技术控制并遵循行业最佳实践，攻击弹性有助于保护核心业务资产免受内部和外部攻击。在考虑如何保护云中的资产和数据时，区分公有云和私有云至关重要。保护公有云中的资产时，传统的保护机制是不够的，在许多情况下甚至无法适用，因为订阅者对底层基础设施或操作系统很少或没有访问权限。云订阅者需要对提供商有一定程度的信任，由其帮助保护他们的资产。这种信任必须是可验证和可审计的，并有强大的\
  \ SLA 和第三方认证的支持。\n\n事件应急准备是一项关键的战略组件，有助于早期检测安全泄露或事件并进行快速响应。当检测到安全泄露时，组织通常会寻求外部专业帮助来协助事件响应和恢复。主要问题是，当第三方介入并现场提供帮助时，他们做的第一件事就是请求相关信息，如日志数据、包捕获和取证镜像。如果组织在安全事件发生之前未进行尽职调查并采取必要的措施，那么等到调查时，所有的泄露痕迹已被覆盖或删除。\n\
  \n即使在今天，组织尚未达到能够显著阻止攻击者尝试破坏其数据的安全成熟度。建立一个与业务对齐的全面的、基于风险的成熟信息安全计划，对于其他控制措施的生效是必要的。成熟信息安全计划组成项目包括合理的策略、详尽的事件响应计划以及全方位的用户意识计划。\n\
  \n## 31.2 云安全\n\n在为组织的云环境部署安全控制措施时，考虑涉及的不同侧方面以及获得舒适的可见性和响应能力所需的需求至关重要。云提供者允许用户快速部署和扩展基础设施的便利性，使得该环境变成一个不断变化的、无形的对象。除非你完全了解业务需求以及业务如何利用云来实现这些需求，否则云中的完全可见性将与我们无缘。\n\
  \n### 31.2.1 云安全最佳实践\n\n当组织想要将服务迁移到云时，总会引入意外的挑战和安全问题。与私有云或传统的 IT 基础设施一样，保护公有云中资产所需的控制是类似的，甚至更加全面。所有基础设施（无论是否存在虚拟化和云服务）都应该遵循\
  \ SANS 在[图 31.2] [[7]] 中描述的安全最佳实践。换句话说，最佳实践对于信息安全团队的成功至关重要；核心区别在于，在公有云中，保护资产的共享责任部分由云提供商承担，而不完全由订阅者的内部\
  \ IT 团队。\n\n![图 31.2 公有云安全最佳实践 [8]。来自 SANS。经许可使用。）](Images/fig31.2.jpg)\n\n图 31.2\
  \ 公有云安全最佳实践 [[8]]。（来自 SANS。经许可使用。）\n\n#### 31.2.1.1 身份访问管理\n\n控制哪些用户对哪些数据具有读取/写入权限是保护云环境的另一个关键方面。幸运的是，主要的云提供商已经构建了自己的身份访问管理\
  \ (IAM) 工具来实现这一安全需求。将用户组织成组和类型是工具用于强制特权访问和职责分离的方法。IAM 平台通过基于角色的和条件的访问加强访问控制，这些通常受多因素身份验证\
  \ (MFA) 的保护。在大多数情况下，策略、角色和组的组合将产生一组权限，允许用户访问特定对象。\n\n#### 31.2.1.2 漏洞与配置分析\n\n漏洞扫描器通常是在在云中部署系统时帮助检查和识别安全风险及漏洞的答案。大多数扫描平台在针对其不断增长的漏洞签名和妥协指标数据库提供修复建议方面非常专业。制定一个在非业务高峰时段运行的扫描计划是实现这一目标的首选方法，以避免系统过载和故障。漏洞测试应该是严格且一致的。\n\
  \n使用内置的云安全工具和基准定期审核你的 IaaS 配置，这些基准可以从美国国家标准与技术研究院 (NIST) 等可信来源找到。NIST 存在用于安全的本地数据中心和云实现的安全标准。在云中部署新资源时，记录并遵循某些配置基准至关重要。常见的漏洞源于在部署新资源时接受默认配置，并且没有在生产之前进行能够加固系统的默认配置更改。\n\
  \n#### 31.2.1.3 网络与基础设施安全\n\n当谈到存储在本地的企业数据的基础设施安全时，其保护责任完全落在公司信息安全部门肩上，并与物理安全、法律、合规和其他内部团队协作。当将企业数据“平移”到云端时，托管这些数据的服务器和数据库的物理安全就变成了云提供商的责任。这绝不应该产生数据是安全的安慰感或虚假安全感。云提供商将为其客户提供其所需的最低安全水平。至于保护客户保留基础设施的其他方面，都是其信息安全部门的责任。讽刺的是，在许多方面，云基础设施内部的安全遵循了你本地环境的传统安全架构。在云计算中维护网络安全时要遵循的关键原则包括：\n\
  \n1. 健壮的网络分段\n2. 正确使用访问控制列表 (ACL) 和防火墙规则\n3. 入侵检测与防御系统 (IDS/IPS)\n4. 虚拟专用网络 (VPN)\n\
  5. 网络访问控制 (NAC)\n\n#### 31.2.1.4 主机与终端安全\n\n\n\n\n保护云实例免受恶意软件影响的方法与你保护本地物理终端的方式几乎相同：通常是通过基于主机的反杀病毒工具（`AV`），也称为终端检测与响应（`EDR`）。能力的提升以及与其他产品的集成使得\
  \ `AV/EDR` 保护在当前的安全格局中变得相关且有用。大多数 `AVs` 和 `EDRs` 提供一个托管在云端的集中化平台，让安全管理员能够看到所有安装了代理的终端。许多\
  \ `AVs` 是基于特征的、启发式的、基于行为的，或上述三者的结合；而 `EDRs` 通常包含某些 `LiveOps` 和终点取证能力，例如分析系统上安装的所有二进制文件，而不仅仅是恶意文件。最后，自主机器学习在技术方方面面的兴起也适用于\
  \ `AV/EDR` 领域，能够对你企业系统的健康状态和恶意软件感染率提供实时分析。\n\n### 31.2.1.5 数据保护与加密\n\n主要的云服务提供商为其平台托管的数据提供了自己的形式的加密。因此，虽然强烈建议在云控制台中并在合适的地方启用这些加密功能，但问题在此时并未得到解决。进出你云环境的数据必须经过加密，根据在何种情况下什么级别的加密合理，考虑如何在整个企业环境中实施数据加密至关重要。你会单独加密云中的每个数据资产，还是会利用专门跨所有云托管提供商进行数据加密的第三方解决方案？\n\
  \n记住，并非所有数据对业务都是至关敏感的，这意味着并不是所有数据（如果加密的话）都需要达到最高加密级别。另一个考虑因素是你希望实施的加密级别：文件级、块级，或使用全盘加密。加密问题在本质上是极具多样性的，需要对优先级和风险容忍度进行仔细分析。涉及数据安全时的一些考虑因素包括：\n\
  \n1. 谁应该能够共享、访问它，以及如何访问？\n2. 传输中数据的加密必须是端到端的。\n3. 已定义并执行数据删除策略。\n4. 增加用户级数据安全的保护层。\n\
  5. 仔细研究云服务提供商的合同和 `SLAs`。\n\n### 31.2.1.6 治理、风险与合规\n\n许多政府已经实施或正在起草客户数据保护法律法规，这些法律法规影响着企业的责任，特别是在发生数据泄露的情况下。为了降低责任风险，公司通常转向第三方\
  \ `GRC` 解决方案，为了合规和审计原因对客户敏感数据进行分类、归档和存档。大多数 `GRC` 解决方案都能与主要的云提供商良好集成。在实施数据治理工具时，有一些需要考虑的关键要点：\n\
  \n1. 管理并映射跨数据库和环境的数据。\n2. 对不同源类型和元数据的数据进行分类。\n3. 寻找可靠的提供商。\n4. 坚持要求提供商提供严谨的合规认证。\n\
  5. 他们是如何保护你的？当出现问题时谁来负责？\n\n### 31.2.1.6 日志、监控、威胁检测与分析\n\n日志是解决任何环境中缺乏可见性的答案。有一句广为人知且显然非常正确的语句：“如果你看不见，你就无法保护它。”在任何资产（无论是物理还是虚拟）上开启日志可能是一项简单任务。挑战随后变为如何实时或事后聚合、集中、关联并分析这些日志。为了这一点，组织要么构建自己的安全信息和事件管理（`SIEM`）软件，要么利用第三方解决方案。许多大型且资金充足的组织通常会有安全运营中心（`SOC`）每天使用这些\
  \ `SIEMs`。安全监控对于理解每个环境的现状至关重要，通过收集各种不同设备和系统的日志来实现。为了确保有效，一些最常用的日志类型包括：\n\n1. 启用\
  \ `API` 的应用程序和云平台（本章稍后会详细介绍）\n2. 网络日志，包括防火墙、`IDS/IPS`、`VPN`、`syslogs` 和无线\n3. 基于主机的日志，包括操作系统事件和\
  \ `AVs/EDRs`\n4. 身份验证日志，包括 `Active Directory`、`Radius` 和其他 `IAM` 平台\n5. 存储在 `SQL`\
  \ 和 `Dynamo` 等数据库中的数据库和应用程序日志\n\n### 31.2.1.7 应用安全\n\n代码和逻辑级别的漏洞是从安全角度需要解决的另一个重要点。无论是使用云原生技术构建，还是使用可能位于本地或部署在基础设施即服务（`IaaS`）中的传统应用程序，代码都是是一样的。正如处理系统漏洞一样，与开发团队的\
  \ `DevOps` 工作流同步扫描应用程序代码，是识别和修复软件内部漏洞的一种有力方法。应用层面的扫描可以在运行时之前（静态分析）或期间（动态分析）进行。虽然扫描应用程序不是解决软件漏洞的万能方案，但它确实提供了代码漏洞趋势的清晰可见性，这些趋势可以在生命周开发阶段进行处理。\n\
  \n### 31.2.2 感知威胁\n\n有很多与云安全相关的神话，这些神话夸大了组织在将服务迁移到公有云时面临的额外风险。通过研究其中的每一个，我们将探索为什么它们在公共云中的真实性并不比私有云或传统的本地\
  \ IT 基础设施那么高。下面列出了与公共安全相关的某些神话，我们将在其中分析在迁移服务到云之前，哪些风险和威胁真正值得考虑：\n\n- 云本质上是不安全的：云的安全性并不比私有基础设施更高或更低。任何基础设施的安全性取决于所实施的控制措施以及对异常或恶意活动监控的有效性。\n\
  - 云安全是一个复杂的问题，难以理解：这并非完全错误，但重要的是记住，主要的争论点应该围绕数据所有权、隐私和责任，而不是技术控制。安全公共云的技术需求与任何环境相同；由于第三方承担了部分数据隐私和安全责任，其实施细节可能会变得有些复杂。\n\
  - 云端的数据泄露更多：这并不准确。通常当组织发生安全泄露时，它跨越了内部基础设施和云服务。大多数情况下，被利用的是受损的凭据、钓鱼诈骗或传统的恶意软件，而不是直接与云服务相关的问题。因此，当攻击者获得对任何环境的授权访问后，他们就可以渗透并破坏其他资产，无论这些资产是否属于云实现。\n\
  \n\n\n\n-   数据的物理控制意味着安全性：数据的物理控制是安全的一个重要方面；然而，谁拥有数据的物理控制权并不意味着安全性更高或更低。通常，资源最多的组织能够更好地保护数据，而在很多情况下，这种者恰好是云提供商而非订阅者。\n\
  \n-   你无法为云应用程序构建边界：无论是在云端还是本地，清晰的网络边界时代早已已过去，而且无法在真空中维护应用程序安全。在设计任何应用程序的安全时，必须将“任何拥有授权凭据的人都可以从世界任何地方访问你的数据”作为一个既定前提。\n\
  \n-   影子 IT 是可以停止的：影子 IT 是不可避免的，必须将其视为组织在当今数字气候中生存发展的 Basic 需求的一部分。IT 服务已经深根于每位员工最基础的日常活动中，因此\
  \ IT 部门已无法控制技术的每一个方面。必须采用一套针对已批准和未批准云活动的策略，并理解到，无论任何组织如何努力，这些活动都将在企业中持续存在。\n\n-\
  \   云安全完全是云提供商的责任：许多人认为，在将数据和服务迁移到公有云后，他们可以放心云提供商会尽力为其资产提供安全保障——这并不准确。任何组织资产安全的最终责任是其自身的，无论数据存储在何处。数据所有者有责任进行必要的调查，以确保云提供商具有必要的控制措施来妥善保护其数据资产。\n\
  \n-   你拥有云端的所有数据：许多组织认为，当他们将数据迁移到云端（特别是软件即服务 SaaS 平台）时，他们仍然完全拥有自己的数据。事实并非如此。事实上，在大多数情况下，云提供商将保留复制、传输或将其数据交给政府机构和其他实体的权利，云提供商可能认为他们有权获取这些数据。必须审查云提供商的服务水平协议和隐私声明，以了解数据在存储在他们的基础设施上后归谁所有，以及如果你想将其取出来该如何操作。\n\
  \n-   云数据并不会保存在 BYOD 和移动设备上：毫无疑问，如今大多数个人（尤其是科技公司的工作人员）都拥有个人智能手机和设备。公司与个人活动分离的时代已经结束；每个拥有个人智能设备的人都会查看公司电子邮件，许多人也会访问公司文档。此外，公司设备越来越多地用于社交网络等个人活动。在当前的现状下，显而易见的是不仅必须保护云数据，还必须保护访问数据的终端设备。从设备到云端数据的直接访问存在重大风险，来自过度权限的第三方应用也存在风险，这些应用通常会收集并操纵设备和云端的数据。\n\
  \n-   单租户系统比多租户系统更安全，反之亦然：所选择的公有云架构或部署模型并不会固有让你的数据更安全。无论采用何种部署模型，云订阅者都必须进行尽职调查，以了解该供应商提供哪些保护机制，以及这些保护措施是否充分基于需要保护的数据类型。\n\
  \n-   没有办法或需要验证大型云提供商：云提供商提供不同的服务级别，如果你提出要求，可以与大多数提供商协商获得更高水平的保护。如果你不这样做，你的配置可能会比使用相同云服务的其他订阅者更安全。为了避免成为“手可摘的果实”，请确保你与提供商讨论安全话题，不要听天由命。通常，提供商会默认实施最低级别的安全防护。\n\
  \n### 31.2.3 真实风险\n\n攻击者经常出于多种原因针对云资源，例如，云资产通常从公共互联网访问且控制措施较少，并且由不同的团队管理环境，因此异常情况变得更难以识别。一旦获得特权访问，游戏就结束了，攻击者可以根据自己的意愿窃取、破坏或泄露数据。在分析云风险时，理解攻击者的动机非常重要。根据动机，可以相当确定地判断攻击的范围并开始减轻后果。\n\
  \n我们都听过在 `图 31.3` 中描述的事件序列。第一步，攻击者针对受害者并识别漏洞。这并不一定是指被利用的应用程序或系统中的技术性漏洞。事实上，通常是终端用户的凭据通过电子邮件钓鱼或其他低技术机制被破解了。一旦漏洞被利用，攻击者就获得了对某些资产的访问权限。这可以是云资产，如\
  \ Web 服务器、驱动器仓库或电子邮箱。初始访问可能处于用户层级，但通过监控受害者环境中的用户数据和网络活动，他们获得特权访问只是时间问题。\n\n![图 31.3\
  \ 针对受害者并利用漏洞。](img/fig31.3.jpg)\n\n一个常见目标是破坏商业，例如篡改网站或拒绝服务；如果是这样，那么通常归因于想要公开与其自身立场冲突的伦理或政治理想的黑客主义（hacktivists）。如果意图是身份盗窃、盈利或欺诈，那么你很可能正在面对组织犯罪，通知当局可能是一种选择。他们可能是为了知识产权或某种网络间谍，在这种情况下，你可能面对的是竞争对手、国家级力量或具有更多战略目标的资金充足的团体。我们观察到一种从业务破坏和盗窃到破坏数据和基础设施的担忧趋势。\n\
  \n动机和目标可能包括勒索组织的数据、意图通过泄露个人数据来损害高管的身份和声誉、破坏整个基础设施以及窃取机商业秘密或客户数据。这是对我们过去所见的范式转变，通常是资金充足的组织化攻击者与不满员工之间的协同努力。每个组织都应努力避免成为此类蓄意攻击的目标，因为这比大多数人愿意承认的容易得多。我们应该真正关注的顶级公有云威胁清单包括\
  \ `4` 个：\n\n\n\n\n\n*   **数据泄露**：最终目标仍然是未经授权访问公司数据。一旦数据泄露成功，攻击者的动机或意图可能有所不同，但在任何情况下，这都是成功攻击的第一步。数据泄露可能源于云端并在内部快速传播，反之亦然，但在我们所生活的这个互联互的物联网（IoT）世界中，数据安全至关重要。在处理公共云服务时，特别令人担忧的是，组织外部有大量人员对公共云拥有特权访问权限，其中任何一个人都可能由于主观或无意而成为泄露的源头。\n\
  \n*   **数据丢失**：由于攻击导致数据丢失是一回事；但存在一种现实可能性，仅仅因为在公共云环境中存储数据，组织就会经历意外的数据丢失。可能性有很多，但从从提供商端的服务中断到提供商之间接口的不兼容，在迁移或访问过程中，不可避免地可能会某些数据丢失或必须重新创建。\n\
  \n*   **账户或服务劫持**：这并不是一个新威胁；然而，将公共云用于关键任务服务可能会增加暴露风险。云服务由某处的某些账户管理，通常由多个账户管理。订阅者和提供商都有管理云服务实例的人员，因此，访问数据及相关服务的人比通常情况下要多。\n\
  \n*   **非安全 API**：公共云中的应用程序接口（`APIs`）等同于传统 IT 环境中的远程桌面会话。它们是你管理、配置和修改云环境的主要机制。当云提供商没有妥善保护其\
  \ `APIs` 且在执行管理任务时未要求适当授权时，问题就出现了。这可能导致对本受限制的管理活动进行未经授权甚至未经身份验证的特权访问。\n\n*   **拒绝服务**：拒绝服务攻击的潜在仍然是所有环境的威胁，但在使用共享公共云服务时，该问题变得更加普遍。组织可能会竭尽全力避免成为目标，但如果它与另一个客户共享云基础设施，而该客户由于某些原因变成了目标，那么它也可能在没有过错的情况下受到影响。\n\
  \n*   **恶意内部人员**：内部威胁是真实的，取决于你观察的衡量标准，它可能比外部威胁更大。再加上可能处理那些甚至不为你自己的组织工作的内部攻击者的潜在风险；这种威胁可能会增加。最重要的是，要理解通过参与任何类型的云服务，你正在让不为你组织工作的人员获得对数据的授权特权访问。\n\
  \n*   **滥用云服务**：云中最常见的滥用形式与使用社交平台进行大规模数据收集、误导许多用户或获取更高特权有关。当受信任的在线身份被破解时，它可以成为欺骗和操纵个人及组织的有力工具。\n\
  \n*   **尽职调查不足**：许多订阅者被公共云平台的可用性所说服，并沉迷于运营效率，而没有适当调查对安全和隐私的风险。在许多情况下，还有其他类似的云服务可能提供更灵活或更安全的环境，且其服务水平协议（SLA）更符合你组织的安全策略。在资产和数据迁移到任何云提供商的环境之前，尽职调查是一个至的环节。\n\
  \n*   **共享技术**：要理解，除非你明确支付专用基础设施（这可能比典型的云服务贵得多），否则你的数据和资产存储在共享技术上。这意味着，尽管可能性很小，云提供商环境中任何地方的安全漏洞都可能溢出并影响许多客户。\n\
  \n*   **供应链和第三方**：对大型组织的威胁可能来自许多不同的地方，其中最少也可能是承包商、第三方或供应链中的任何地方。每当你能够追踪购买设备的来源时，都是一个巨大的加分项。\n\
  \n### 31.2.4 挑战与问题\n\n在消除了一些关于云安全的迷思并对真实风险有了理解后，是时候提升一个水平了。除了分析事实，组织如何处理云计算面临的最大挑战将决定它随着时间的推移如何成功地让自己免于责任并降低风险。组织如何处理这些初始挑战将决定未来会出现哪些问题。其中某些问题可能会让组织在未来花费更多的时间、金钱和资源来修复。避免这些潜在的安全陷阱将帮助组织获得顺畅且高效的云体验。\n\
  \n最重大的云安全挑战围绕数据如何以及何处存储，以及保护数据是谁的责任。在传统的 IT 基础设施或私有云环境中，保护数据的责任和所有权是明确的。当决定将服务和数据迁移到公共云环境时，某些事情变得模糊不清，并且难以证明和定义。例如，如果一家大型政府医院在公共云环境中维护电子病历（`EMRs`）数据库，如果公共云提供商在世界各地都有数据中心怎么办？云提供商维护的某些虚拟系统是否可能在订阅者不知的情况下迁移或托管到美国之外？云提供商员工是否可能未经授权访问美国政府员工的医疗记录和个人信息？如果你的组织更改了云平台；是否可以信任所有提供商都会删除且不在其基础设施上保留你所有数据的副本？在迁移到公共云之前需要评估的最紧迫挑战是：\n\
  \n**数据驻留**：这指的是存储在云中的数据的物理地理位置。许多行业都有法规，要求组织将其客户或患者信息维护在在其原籍国内。这在政府数据和医疗记录中尤为常见。许多云提供商在多个国家拥有数据中心，并可能跨不同的地理区域迁移虚拟机或复制数据，导致云订阅者在不知情的情况下未能通过合规性检查甚至违反法律。\n\
  \n\n\n\n\n- **合规性**：需要满足 `HIPAA` 等监管合规要求或支付卡行业 (`PCI`) 等安全标准的行业，通常比不涉及这些要求的行业具有更高的问责水平和安全要求。这些组织应该特别注意决定部署哪些云服务，并确保云提供商能够满足或超过这些合规性要求。如今许多云提供商可以根据要求配置执行并监控严格的\
  \ `HIPAA` 或 `PCI` 标准的云环境，但这仅限于您要求并支付额外费用的情况下。请参见图 31.4，描述了根据数据所在的地理位置所适用的法律。\n\n\
  - **数据隐私**：维护用户隐私是大多数关注的重点。无论是员工、客户还是患者，个人身份信息都是高价值的目标。许多云订阅者没有意识到当他们委托供应商提供服务时，也同意允许该供应商收集并共享有关其环境的元数据和使用信息。在某些情况下，供应商甚至根据其隐私声明合法地出售或共享这些数据。\n\
  \n- **数据所有权**：如果一个组织认为云存储提供商比私有网络共享更合适，或者云数据库提供商比内部数据库集群更好，这是否意味着它放弃了对公司数据的所有权？在很多情况下，是这样的，而且他们并没有意识到这一点。许多云服务合同中包含此类条款，规定云提供商有权永久复制、重制或保留存储在其基础设施上的所有数据——这并不是大多数订阅者在将数据迁移到云端时所认为的情况。\n\
  \n- **数据保护**：谁来保护公司数据？云提供商是否拥有相应的控制机制来检测对客户数据的未经授权访问，还是说像数据在私有基础设施中一样，由客户负责确保云端数据的安全？这除非在聘用服务之前进行讨论，否则这一点并不明确。许多提供商确实提供了安全监控，但在大多数情况下，它默认是关闭的，或者相同水平服务的成本要贵得多。订阅者应该始终验证提供商保护公司数据的效性是否与公司本身一样，甚至比公司本身更有效。\n\
  \n![图 31.4 云数据存储何处以及适用哪些法律。](img/fig31.4.jpg)\n\n图 31.4 云数据存储何处以及适用哪些法律。\n\n如果不能妥善评估采用公有云的这些核心挑战，就可能会出现一些潜在的安全问题。另一方面，通过适当的准备和尽职调查可以避免这些问题。以下点是大多数组织在迁移到云端时会遇到的考虑因素和问题，通常是在为时已晚之后[9\\\
  ]：\n\n- 许多组织在自欺欺人，没有意识到他们已经在云端了。事实上，影子 IT（Shadow IT）很快将变成普通的 IT，组织应该已经相应地保护自己了。\n\
  \n- 在采用云之前定义安全风险的适当缓解策略至关重要，而不是在事后。经常看到许多没有考虑云组件的事件响应计划和修复技术。信息安全策略应始终包含所有公司资产，无论它们是托管在内部还是云端。\n\
  \n- 充分理解什么是“云”以及如何根据独特的业务需求利用云计算是罕见的。许多组织进入云端时，只评估所获得的运营效率提升和所经历的资金节约，而不考虑真实的风险和暴露情况。在很多情况下，对云架构和安全的深刻理解可以帮助组织决定哪些应该迁移，哪些不应该。\n\
  \n- 云环境通常提供的日志、身份验证和检测机制较弱，使得更难以识别用户凭据何时被破解并被用于恶意目的。\n\n- 许多组织认为云安全与本地数据安全是分开的。为了像保护内部网络数据一样妥善保护云端数据，通常需要订阅者在基础云服务之上叠加实现要求。\n\
  \n- 一旦你迁移到云端，是否可能无法使用自己的安全工具？那么该如何保护环境免受数据泄露或恶意攻击？在很多情况下，迁移到云意味着你必须信任用户和提供商的知识、判断和警惕。\n\
  \n- 云提供商构建并管理巨大的计算资源池，并租给许多租户，从而实现了规模经济；因此，理解“公有”一词的真实含义和影响是重要的。\n\n- 不要犯这样的错误，认为云提供商比你更擅长保护敏感数据，并且投入同样的精力。通常云提供商只会执行维护运营安全所需的最低工作，但订阅者需要根据自己的独特需求驱动其维护数据的警惕水平。\n\
  \n- 在云环境中维持与在组织内部相同的控制水平和合规性可能是困难的，甚至是不可能的。始终理解，云与私有环境的主要区别在于你（订阅者）不再拥有底层基础设施的控制权。尽管如此，与提供商公开讨论任何这些要求是非常关重要的。\n\
  \n- 太快进入云系统且不关注安全是组织可能掉入的最大陷阱之一。评估使用特定供应商而非另一个供应商的风险并不总是清晰，但对组织来说最糟糕的情况是缺乏相关知识的用户或董事会。\n\
  \n## 31.3 安全架构设计\n\n\n\n\n服务器、网络、存储和应用虚拟化是大多数云提供商专门提供的核心组件。这些不同的计算资源构成了大多数组织基础设施的大部分。主要的区别在于，在云中，这些资源的置备是全自动的，并且可以快速扩展或收缩。实现这种弹性且韧性架构的关键方面是通用硬件。云提供商需要能够透明且高效地配置更多的物理服务器、硬盘、内存、网络接口以及几乎任何操作系统或服务器应用程序。为了实现这一点，服务器和存储需要动态配置，并且它们不断地在不同的客户环境之间进行重新分配，而对底层硬件的考虑极少。只要满足了关于运行时间的服务水平协议（SLA）并将管理开销降至最低，云提供商几乎不保证或披露基础设施的真实貌。订阅者有责任去询问并验证其所签约服务的每个云提供商环境的设计特征。\n\
  \n定义云环境的特征有很多许多。图 31.5 提供了云设计特征的完整列表。大多数关键特征可以总结为下列表 [1,2,5]：\n\n![Figure 31.5 云计算的特征。](img/fig31.5.jpg)\n\
  \n图 31.5 云计算的特征。\n\n*   **按需服务**：云的始终在线的特性允许组织通过互联网对其整个基础设施进行自服务管理和维护，而无需与第三方交互。\n\
  *   **资源池化**：云环境通常配置为大型计算资源池，例如 `CPU`、`RAM` 和存储，客户可以从中选择使用，或者将其留空以分配给其他客户。\n*  \
  \ **可计量服务**：由于其按需付费的性质，云为终端用户带来了巨大的成本节省；因此，提供商能够衡量每个客户所利用的服务级别和资源水平至关重要。\n*   **网络连接性**：用户连接云的简易程度是云采用率如此高的原因之一。如今的组织拥有移动\
  \ workforce，这需要多个平台的连接性。\n*   **弹性**：云的一个重要组成部分是它必须能够根据客户需求进行扩展。订阅者可以季节性或在大型活动期间启动新资源，并在不再需要时将其下线。这是系统随时间推移自主适应能力的程度。\n\
  *   **韧性**：云环境必须始终可用，因为大多数服务协议保证了如果系统崩溃，将由提供商承担代价来保证可用。云的好坏取决于其可靠性，因此基础设施具有韧性并以可用性为核心交付至关重要。\n\
  *   **多租户**：多租户环境是指云中的所有租户之间应该被恰善隔离，如图 31.6 所示。在许多情况下，单个软件实例可能为许多客户提供服务，因此出于安全和隐私考虑，提供商花时间从底层构建安全的多租户至关重要。多租户环境侧重于租户数据的分离，以便采取所有合理措施防止租户之间未经授权的访问或资源泄露。\n\
  \n![Figure 31.6 公有云多租户。](img/fig31.6.jpg)\n\n图 31.6 公有云多租户。\n\n为了充分利用虚拟化基础设施提供的效率，控制措施必须采取所有合理措施，防止租户之间未经授权的数据泄露或资源重新分配。在每个层级必须考虑的核心组件\
  \ [1]：\n\n*   **分离**：在 OSI 模型层级，主要是存储、网络和计算\n*   **租户**：可能被定义为用户、客户或组织\n*   **数据**：包括传输中的数据和静态存储的数据\n\
  \n### 31.3.2 行业标准与合规性](#chapter31.xhtml#re_ch-31-sec-17)\n\n在研究云环境安全时，有很多组织发布云基础设施的最佳实践和安全标准，尽管数量并不多。在云安全与传统\
  \ IT 安全的话题中，进行最深入研究的组织是数据中心协会（ODCA）和云安全联盟（CSA） [5]：\n\n作为云提供商，在为不同基础设施和平台设计安全时，需要满足许多不同的需求。某些客户可能需要\
  \ PCI 级安全；另一些可能运行安全要求较低的环境；而另一个客户可能是政府机构。CSA 发布了一份全面的矩阵，列出并对比了合规要求。这使得提供商能够清晰地说明符合哪些标准。云订阅者可能需要更好地了解特定云服务的影响，因此\
  \ ODCA 发布了用法模型、安全标准以及根据订阅者需求构建问卷的工具。ODCA 模型专门用于帮助订阅者定义他们需要的云类型以及如何进行保护。它们还定义了哪些责任由提供商承担，哪些由订阅者承担。主题包括图\
  \ 31.7 所示的关键云用法和成熟模型 [10]。\n\n### 31.3.3 安全参考架构](#chapter31.xhtml#re_ch-31-sec-18)\n\
  \n如前所述，为了使一个环境被认为是云，有许多设计特征和架构要求。涉及到安全时，所有传统的系统保护机制都适用；区别在于实施方式。如果确定云中存储的数据是任务关键的，必须实施更先进的安全技术。由于提供商和订阅者之间的责任划分，这说起来做起来难。理解云不是革命性的，而是演进性的想法，有助于看待这一问题。它本质上是运营、开发和安全的编排，需要细致处理，以防止任何一个关键方面被忽视并被轻易利用。现在我们将查看某些推荐的云安全参考架构以及云数据安全访问监控的要求。\n\
  \n\n\n\n# 安全\n\n安全不再能是一个事后考虑的问题；它必须成为每种云部署的核心设计考量因素。对于大多数云订阅者来说，他们几乎没有能力要求云提供商对架构进行修改或增加。只有那些能够负担起私有云环境构建费用，或者能够支付符合某特定标准的一经过的共享云费用的客户，通常才能推动安全架构的变更。话虽如此，订阅者有责任对他们决定聘用的提供服务的任何云提供商进行安全性评估和验证。云拥有如此多的用例和使用模型，使得每种云体验都是不同的，因此不能根据某一套标准或参考架构来评估安全性。目前已发布了许多云安全参考架构，这些架构针对特定的用例，并考虑了不同的业务需求。例如，一个组织可能希望构建一个\
  \ `IaaS` 来为传统的 IT 业务运行基于 Windows 的环境。这通常需要一种常见的部署架构，并且可以适应传统的安全管理模型。部署何种类型的安全以及监控哪些活动取决于使用模型。\n\
  \n更复杂的用例可能涉及部署符合 `PCI` 标准或遵循 `NIST` 政府标准的 `IaaS` 环境 [11]，这些环境可能持有持卡人或联邦政府数据。如果是这种情况，则需要具有高级安全控制的更定制的安全参考架构。在更高级的用例中，订阅者可能希望获得提供商基础设施的可可见性，并测量信任数据、配置设置，以及提供商后端和每次连接时访问云数据的客户端设备的物理架构。图\
  \ 31.8 [7] 显示了若干高级的安全参考架构，这些架构根据客户端系统和与其连接的云服务器的测得信任级，动态地为云资源分配权限。\n\n![图 31.8 NIST\
  \ 云计算安全参考架构 [6]。（来自 NIST 云计算安全参考架构。经许可使用。）](Images/fig31.8.jpg)\n\n图 31.8 NIST 云计算安全参考架构\
  \ [6]。（来自 NIST 云计算安全参考架构。经许可使用。）\n\n许多云订阅者并没有这种气去设计一种其提供商有义务实施和维护的高级安全架构。他们可以做的是深入理解构成云基础设施的所有组件，并向每个提供商提问正确的问题，以便在将服务接入云端时尽可能做出最审慎且信息充分的决策。每家云提供商在安全方面都有不同的方法论和架构。有些关注于机密性，另一些关注于可用性，还有一些关注于最低标准的组合，尽力保护您的数据和计算环境的完整性。在您独特的云实例中将存储和进行何种类型的数据和操作将决定所需的安全水平。为了了解每个提供商如何保护和配置云的每个主要架构组件，对于组织而言，能够评估并比较在以下领域使用该提供商或服务时涉及的风险至关重要（云和\
  \ IoT 组件在图 31.9 中也有插图）：\n\n![图 31.9 云基础设施和 IoT 组件。（来自 Trapezoid, Inc., www.trapezoid.com。经许可使用。）](img/fig31.9.jpg)\n\
  \n图 31.9 云基础设施和 IoT 组件。（来自 Trapezoid, Inc., [www.trapezoid.com](http://www.trapezoid.com)。经许可使用。）\n\
  \n*   **计算**：物理服务器、操作系统、CPU、内存、磁盘空间等。\n*   **网络**：`VLANs`、`DMZ`、分段、冗余、连接性等。\n* \
  \  **存储**：`LUNs`、端口、分区、冗余、故障转移等。\n*   **虚拟化**：`Hypervisor`、地理位置、管理、授权等。\n*   **应用**：多租户、隔离、负载均衡、身份验证等。\n\
  \n在上述描述的每个基础设施组件中与您的提供商讨论安全架构时，需要记住的主要设计考量和标准是：\n\n*   在云基础设施的每一层实现最大的物理隔离。\n* \
  \  在云基础设施的每一层实现最大的逻辑隔离。\n*   可以实施使用合作伙伴工具的额外控制。\n\n记住这些设计考量并对构成每个云的基础设施良好的了解，将使组织获得开始构建其独特云需求列表所需的实践知识。组织实际上可以根据其使用模型创建自己的高级安全架构需求，甚至为他们自己的私有云制定蓝图。任何云服务与现有\
  \ IT 基础设施的互操作性也是决定哪种云服务适用于特定用例或组织的巨大因素。对于高度先进且具有安全意识的订阅者，还有一些应该考虑的云参考架构的额外基本支。最先进、最安全的云架构确保了以下考虑的实现\
  \ [9,11]：\n\n*   实现了尽可能高程度的租户数据和计算资源的安全隔离。\n*   服务保证级协议与根据数据妥当分类建立的最高安全水平一致。\n*\
  \   安全和合规要求达到或超过了内部 IT 组织实施的要求。\n*   通过与处理数据敏感性相适应的每个合理控制机制最大化可用性和数据保护。\n*   建立了明确且不妥协的租户管理和控制方法，并将后果与失效挂钩。\n\
  *   减少了服务提供商的管理和控制，使订阅者的内部团队对提供商的所有操作具有完全可见性。\n\n## 31.4 利用 API 进行安全 (#chapter31.xhtml#re_ch-31-sec-19)\n\
  \n安全监控是获得快速识别事件所需的可见性以及获取响应和修复所需信息的关键组成。监控任何环境都是困难的，云端还会出现一些难以克服的额外挑战，特别是在监控由提供商而非数据所有者或订阅者控制的基础设施部分时。获取云环境中发生情况的可可见性的一个主要挑战是无法分析网络流量并进行基本数据包捕或安装入侵检测系统。最近，一些云提供商（如亚马逊\
  \ `AWS` 的 `VPC` 流和流量聚合功能）已经解决了这个问题。\n\n\n\n\n\n作为此类活动监控的替代方案，出现了一些新的云访问安全技术，它们利用应用程序接口（`APIs`）不断查询特定的云服务，以记录在该云实例中发生的每一个活动。通过这种监控活动，可以识别并报告作为异常的**入侵指标（`IoC`）**。这些安全技术在指出此类异常（例如：在地理位置不同的区域同时使用相同的凭据进行登录）之外，还可以实施某些机器学习算法来分析每个用户的行为趋势，并在发生异常情况时发出警报。\n\
  \n### 31.4.1 云访问监控\n\n每个云提供商都会发布一组 `APIs` 子集，允许订阅者查询云实例以获取不同的数据；当订阅者需要监控比提供商 `API`\
  \ 支持的更细粒度的信息时，问题就出现了。如果能够获得足够细粒度的安全信息，就可以将其与威胁馈送和观察列表提供的活动进行比较，从而洞察在其他客户和云环境中观察到的恶意行为。除了用于监控传统\
  \ IT 基础设施的常规安全工具外，还应该实施这些技术和方法。以下是除传统控制之外应考虑实施的重要云安全监控技术：\n\n*   **安全 API**：安全的应用程序编程接口是自动化查询，允许监控云活动和操作。\n\
  *   **CASB**：云访问安全代理器是利用许多云服务的安全云 `APIs` 的平台，使订阅者能够在一个中心化位置对所有云事件进行监控和检查。\n*   **异常检测**：用于识别和警报不被视为正常且以前从未出现过的活动的方法，旨在在安全泄露失控之前进行预防。\n\
  *   **机器学习**：这是对过去用于识别异常的长期技术的自动化。过去事件的关联在很大程度上是手动完成的，但许多平台已经整合了无需用户干预即可自动开发异常标准的能力。\n\
  *   **威胁情报**：该术指的是威胁馈送、观察列表以及通过这些机制对针对特定环境的威胁进行识别并传递给终端用户、安全工具和客户。\n*   **行为检测**：如今许多安全工具通常先学习用户、系统和网络的行为，然后开始对未经的活动生成警报。这种行为检测超越了泛化的异常检测，并为使用云的每个对象创建一个配置文件。对于管理员来说，每天在云端之间传输\
  \ 10 GB 数据可能是正常的且不会触发警报，但典型的终端用户执行相同的操作就会触发警报，因为他们从未执行过该类型的操作。\n\n### 31.4.2 API\
  \ 安全化\n\n虽然保护云环境的网络流量取决于其复杂性和规模无疑是一项挑战，但保护托管在云中的应用程序也有其独特的挑战。随着应用程序在功能功能上变得更加自动化并划分为微服务，这种现象正成为一种增长的趋势。IoT\
  \ 设备的兴起尤为如此，小型设备之间进行无线通信并将数据传输到云网关进行数据聚合和分析。\n\n配置不当、损坏或暴露的 `APIs` 往往是攻击者的切入点，导致公司数据泄露和黑客攻击。同样，识别\
  \ `API` 中的漏洞并非易事，需要彻底的测试并对其功能有充分的理解。从安全角度向开发者询问 `APIs` 的重要问题是：\n\n1. 正在处理或传输什么类型的数据？\n\
  2. 数据传输到哪里或从哪里传输？\n\n如果数据从一个应用传输到另一个应用（两者均为内部开发的），那么你有更多机会控制组织内部的数据流。如果数据传输到第三方或来自第三方，那么在安全和数据治理方面，你的控制力就较小。关于向第三方传输数据，最重要的是理解所处理数据的敏感水平，并将\
  \ `API` 功能限制在其预期用途内，以避免通过忽视的漏洞导致误用。\n\n安全 `API` 配置的一个标志是访问控制。控制用户、应用或服务可以读写哪些特定数据对于保护\
  \ `APIs` 至关重要。目前 Web 上第三方访问授权的行业标准是 `OAuth`。`OAuth` 在 `HTTPS` 上运行，通过加密生成的访问令牌而非凭据来授权\
  \ `APIs`。`OAuth` 允许跨应用的联邦身份和单点登录。\n\nAPI 安全数据传输的实现也是如此。大多数 API 实现属于两类之一：`REST`（表示状态转移）或\
  \ `SOAP`（简单对象访问协议）。\n\n`REST` API 的优点是轻量级且高效，因为它使用了 `JSON`（即 JavaScript 对象表示法），这种文件格式以键/值对的形式显示数据，并放在大括号中。它易于读取并代表应用程序的当前状态，因此有了“状态转移”中的“状态（state）”。此外，`REST`\
  \ API 利用了互联网上的传输层安全（`TLS`），这意味着数据在传输过程中不会被非预期的接收用户或服务读取或修改。\n\n`SOAP` API 利用了由两个国际标准机构设定的\
  \ Web 数据传输标准：结构化信息标准促进协会（`OASIS`）和世界网联盟（`W3C`）。`SOAP` 使用的协议由这些机构规定了如何通过使用各种安全令牌格式在数据传输中强制机密性和身份验证。这些包括\
  \ `SAML`、`Kerberos` 和 `X.509`。最终结果允许数据传输中的 XML 加密和签名，以确保数据的完整性和机密性。`SOAP` API 在设计\
  \ API 通信安全方面更为全面，但不像 `REST` 那样轻量级，且管理更为复杂。\n\n\n\n\n\n### 31.4.3 商业安全工具\n\n各大云提供商不断地更新和改进其\
  \ IaaS，以满足客户需求并提高安全性。大多数大型云提供商都提供 IAM 控制台，可以选择与您的本地身份提供商（IDP，如 `Active Directory`）或\
  \ SSO 平台（如 `OKTA`）集成。在某些情况下，存在特定的安全工具，可以监控环境中的异常或未经授权的活动；应尽可能利用这些云原生的内置工具。\n\n####\
  \ 31.4.3.1 身份与访问管理\n\n这是一种用户访问控制服务，用于设置用户对 `AWS` 内相应资产的读/写权限。该服务在管理您的云基础设施方面无疑是最重要的。`IAM`\
  \ 是部署云环境的基础部分。正如极少数或没有员工应该拥有公司内每一扇锁门的物理访问权限一样，极少数或没有用户应该拥有 `AWS` 中每一个资产的授权。`IAM`\
  \ 允许 `MFA` 以及与非 AWS 服务的身份联合。\n\n#### 31.4.3.1.1 CloudTrail/CloudWatch\n\n该服务跟踪您的\
  \ `AWS` 基础设施内所有的用户和 API 活动。事件日志存储在 `S3 bucket` 中用于审计和分析。日志是加密的，并且在传输时始终验证其文件完整性。甚至有一个名为\
  \ `CloudTrail Insights` 的功能，资源消耗或访问尝试的峰值/失败可以提醒 AWS 控制台的管理员。`CloudTrail` 生成的日志随后可以摄入\
  \ `CloudWatch`，这是一种数据可视化服务，可以创建日志日志的仪表板和图表。该服务不仅面向安全，还面向 IT 运营、治理和合规性。\n\n#### 31.4.3.1.2\
  \ AWS Guard Duty\n\n它是亚马逊原生的威胁检测服务。其检测范围涵盖 API 监控、网络流量、DNS 查询和账户监控。`duty` 聚合所有日志，并根据传输、网络或应用层的可疑行为发送警报。该服务甚至进一步，允许通过\
  \ `AWS Lambda` 执行自动修复操作规则。这意味着预定义的策略违规或安全事件可以通过自动修复操作来应对。\n\n#### 31.4.3.1.3 Azure\
  \ Security Center\n\n此内置服务等同于 IaaS 环境的 `SIEM`。对于所有虚拟和物理资产，您都安装了 `Microsoft monitoring\
  \ agent`，并获得该资产资源消耗、网络连接以及大量其他元数据的可见性。通过这种单体结构，安全管理员拥有一个全方位资源来加强其组织的安全态势。`Security\
  \ center` 利用了许多驱动安全最新发展的下一代技术，例如行为分析和机器学习。\n\n#### 31.4.3.1.4 Google Cloud Security\
  \ Scanner\n\n这种 Web 安全扫描器侧重于应用层漏洞。您可以扫描公共 `URL` 或 `IP` 上的应用程序，并在 `Google Security\
  \ Command Center`（与之前描述的 Azure 版本相同）中获得发现报告。其功能主要侧重于测试身份验证机制和控制，以及授权管理。在扫描应用程序时，会利用云\
  \ `IAM` 中定义的访问控制策略。\n\n### 31.5 IoT 设备\n\n`IoT` 是我们目前作为一个社会共同开发的新技术前沿之一。以自动化和易用性的名义，各行业都在利用许多网络连接设备进行操作、数据聚合，甚至控制机制。由于制造商在这一市场萌芽阶段采取了抢占市场的策略，我们看到了\
  \ IoT 产品的爆炸式增长，但没有真正的标准或监管机构来指导它们。这种现象的后果是什么？这些设备（通常含有大量用户数据）的安全性并非首要考虑，导致大部分设备容易被利用。除了公开暴露或配置错误的云存储桶外，网络连接的\
  \ `IoT` 设备是针对用户或组织的攻击者的巨大入口点。\n\n2020 年，`IoT` 开发已经成熟了其萌芽阶段，目前处于幼儿阶段。更大、更有声誉的制造商通过更新固件和软件版本对客户反馈做出响应，提供了更安全的标准和控制，供用户在其\
  \ `IoT` 部署中实施。通常情况下（当然也有例外），趋势是：`IoT` 产品越贵越安全。遗憾的是，事实如此。拥有预算的大厂商有资源和时间投资于安全的 `IoT`\
  \ 产品。\n\n除了设备本身的安全配置外，还可以使用外部安全控制来在发生漏洞时限制用户数据的利用和暴露。管理和控制用户流量以及位于云端的组织应用程序的最明确的方法之一是通过云访问安全代理或\
  \ `CASB`。`CASBs`充当用户与其云环境之间的安全云网关。这对于与云应用通信的非 IoT 网络连接设备同样适用。如果网络 `IDS` 针对来自可能受损设备的可疑流量发出警报，`CASB`\
  \ 可以隔离它并执行由管理员设置的安全策略。出于保护 IoT 设备以外的原因，采用 `CASBs` 也是一种很好的策略，因为它们为您的组织提供了另一层保护。\n\
  \n如前所述，由于这是一个不断发展的领域，缺乏可以遵循的标准和模型。因此，如果您在组织内部使用 `IoT`，定义并设定它们是非常重要的。正如安全部门根据其设定的标准对服务器、计算机、无线和移动设备进行补丁一样，请将\
  \ `IoT` 设备作为一个独立的分段视为首要任务。\n\n### 31.6 总结\n\n每天都会发生安全事件，大小大小有之，且许多事件未被察觉和报告。大多数组织都会某个时间经历安全泄露，而且他们可能需要几个月的时间来识别问题。理解这一点的组织和安全专业人员在事件发生时会做得更好的准备。必须在泄露发生之前尽可能做好事件准备工作。安全部门必须能够提供一致且有效的方法，用于识别、响应和恢复事件。组织还应该记住，在订阅云服务时，他们将保护资产的责任转交给了云提供商。\n\
  \n\n\n\n\n我们已经回顾了基础和高级公云安全架构，并分析了它们的设计特性和独特的环境需求。在读完本章后，有几个问题需要思考：云安全和 IT 的未来是徒劳的吗？当我们无法控制数据时，如何保护数据？一个组织要负责任地将服务平移（lift\
  \ and shift）到公云，它需要在在其云基础设施中构建事件准备能力和攻击韧性方面投入大量思考。每个组织在利用公云服务之前，都应该通过尽职调查并针对数据保护、用户管理和业务运营制定强有力策略来维护安全成熟度。这些是实现成功云安全架构应采用的策略。\n\
