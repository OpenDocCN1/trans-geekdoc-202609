  \ 参与者\n    * 2.6.2 组件\n* 2.7 ITU-T 参考架构\n    * 2.7.1 参与者\n    * 2.7.2 分层架构\n   \
  \ * 2.7.3 功能性架构\n* 2.8 云计算的网络需求\n* 2.9 总结\n\n## 2.1 引言\n\n虽然云计算的基本概念可以追溯到 20 世纪\
  \ 50 年代，但云计算服务直到 21 世纪初才出现；它们最初主要针对大型企业。从那时起，云计算扩展到了中小企业，最近扩展到了消费者。\n\n本章首先介绍云计算的基本概念。接下来将讨论主要的业务类型。本章还将介绍各种部署模型，随后审查由\
  \ NIST 和 ITU-T 分别开发的参考架构。\n\n## 2.2 云计算要素\n\nNIST 在 `SP 800-145` [1] 中对云计算的定义如下：\n\
  \n* 云计算：一种通过提供按需便捷访问的池化可配置资源（例如网络、服务器、存储、应用和服务），以便在减少管理工作或与服务提供者交互的情况下快速配置和释放。这种云模型提高了可用性，并由五个核心特性、三种服务模型和四种部署模型组成。\n\
  \n该定义提到了各种模型和特性，其关系如图 2.1 所示。\n\n![图 2.1 云计算要素。](img/fig2.1.jpg)\n\n图 2.1 云计算要素。\n\
  \n## 2.3 核心特性\n\nNIST 定义的云计算核心特性如下：\n\n* 广网络访问：能力通过网络可用，并通过标准机制访问，促进异构瘦客户端或厚客户端（例如移动手机、笔记本电脑和\
  \ PDA）以及其他传统或云端软件服务的使用。\n\n* 快速弹性：云计算让你能够根据特定的服务需求扩展和减少资源。例如，你可能在执行特定任务期间需要大量的服务器资源。任务完成后，你可以释放这些资源。\n\
  \n* 度量服务：云系统通过在适用于服务类型的抽象层上使用计量功能（例如存储、处理、带宽和活动用户账户），自动控制并优化资源使用。资源使用可以进行监控、控制和报告，为所用服务的提供者和消费者均提供透明度。\n\
  \n* 按需自服务：消费者可以根据需要自动自行配置计算能力（如服务器时间和网络存储），而无需与每个服务提供者进行人工交互。由于服务是按需提供的，因此资源并不是\
  \ IT 基础设施的永久部分。\n\n\n\n\n\n- **资源池**：提供者的计算资源被池化，以多租户模型为多个消费者提供服务，根据消费者的需求对不同的物理和虚拟资源进行动态分配和重新分配。这在某种程度上具有位置无关性，因为客户通常对提供资源的准确位置没有控制权或感知，但可能可以在较高的抽象层级上指定位置（例如国家、州或数据中心）。资源的示例包括存储、处理、内存、网络带宽和虚拟机。即使是私有云也倾向于在同一组织的不同部分之间进行资源池化。\n\
  \n图 2.2 展示了典型的云服务背景。企业在企业局域网（LAN）或一组局域网内维护工作站，这些局域网通过路由器连接网络或连接到云服务提供商。云服务提供商维护着大量的服务器集合，并使用各种网络管理、冗余和安全工具进行管理。在图中，云基础设施显示为刀片服务器集合，这是一种常见的架构。\n\
  \n![图 2.2 云计算背景。](img/fig2.2.jpg)\n\n图 2.2 云计算背景。\n\n## 2.4 云服务 (#chapter2.xhtml#re_ch-2-sec-4)\n\
  \n本节介绍了常见的云服务，首先从 NIST 定义的三种服务模型开始：\n\n- 软件即服务 (SaaS)\n- 平台即服务 (PaaS)\n- 基础设施即服务\
  \ (IaaS)\n\n图 2.3 比较了云服务提供商为三种主要云服务模型实现的功能。这些模型被公认为云计算的基础服务模型。本节讨论了这些模型，然后检查了其他流行的云服务模型。\n\
  \n![图 2.3 云运营中的职责划分。](img/fig2.3.jpg)\n\n图 2.3 云运营中的职责划分。\n\n### 2.4.1 软件即服务\n\n\
  顾如其名，SaaS 云以软件的形式（特别是应用程序软件）向客户提供服务，这些软件运行在云端并可以通过云端访问。SaaS 遵循熟悉的 Web 服务模型，在这种情况下，该模型被应用于云资源。SaaS\
  \ 使用户可以使用运行在提供者云基础设施上的提供者应用程序。用户可以通过网络浏览器等简单界面从各种客户端设备访问这些应用程序。企业无需为其使用的软件产品获取桌面和服务器的许可，而是从云服务中获得相同的功能。使用\
  \ SaaS 避免了软件安装、维护、升级和补丁的复杂性。\n\nSaaS 的常见订阅者是希望为其员工提供典型办公生产力软件（如文档管理和电子邮件）的组织。个人经常使用\
  \ SaaS 模型来获取云资源。通常，订阅者按需使用特定的应用程序。云提供商通常还提供数据相关功能，例如自动备份和订阅者之间的数据共享。\n\n### 2.4.2\
  \ 平台即服务\n\nPaaS 云以平台的形式向客户提供服务，客户的应用程序可以在该平台上运行。PaaS 使用户能够在云基础设施上部署由客户创建或获取的应用程序。PaaS\
  \ 云提供了有用的软件构建构建块，以及许多开发工具，例如编程语言工具、运行时环境以及协助部署新应用程序的其它工具。实际上，PaaS 是云端的操作系统。对于想要开发新应用程序或定制化应用程序的组织，PaaS\
  \ 非常有用，因为只需根据需要支付所需的计算费用，且仅按所需的时间付费。\n\n### 2.4.3 基础设施即服务\n\n通过 IaaS，客户可以访问底层云基础设施的资源。IaaS\
  \ 提供了虚拟机以及其他抽象的硬件和操作系统。IaaS 为客户提供处理、存储、网络和其他基础资源，以便能够部署和运行软件。IaaS 允许客户访问计算基础设施的资源，包括操作系统和应用程序。\n\
  \n通常，订阅者使用基于 Web 的图形界面访问这些基础设施，以执行常见的任务，如数据存储和传输。`API` 访问也可以作为一种选项提供。\n\n### 2.4.4\
  \ 其他云服务\n\n已经提出了许多其他云服务，并作为供应商提供。提供了一些有用的额外服务列表。除了 SaaS、PaaS 和 IaaS 之外，`Y3500` 列出了以下代表性云服务类别：\n\
  \n- **通信即服务 (CaaS)**：集成实时交互和协作服务以优化业务流程。该服务提供了跨多个设备的统一体验。包含的服务示例有视频会议、网络会议和即时消息。\n\
  - **计算即服务 (ComaaS)**：提供部署和运行软件所需的处理资源。ComaaS 可以被视为简化的 IaaS，专注于提供计算能力。\n- **数据存储即服务\
  \ (DSaaS)**：提供数据存储及相关能力。DSaaS 描述了一种存储模型，客户通过 Internet 将数据传输到第三方提供者处，然后使用提供者提供的软件访问存储的数据。该软件用于执行与存储相关的任务，如数据备份和数据传输。\n\
  - **网络即服务 (NaaS)**：传输连接和服务和或云间网络连接服务。NaaS 通过将网络和计算资源视为整体来优化资源分配。NaaS 可以包括灵活扩展的虚拟专用网络\
  \ (VPN)、按需带宽、自定义路由、组播协议、安全防火墙、入侵检测与防御、广域网 (WAN)、内容监控与过滤以及杀病毒软件。\n\nY3500 区分了云能力和服务云。三种能力类型为应用、平台和基础设施，对应\
  \ SaaS、PaaS 和 IaaS 的基础服务类型。云服务类别可以包含来自一个或多个云能力类型。表 2.1 显示了七种云服务类别与三种云能力类型之间的关系。Y3500\
  \ 还列出了新兴云服务类别的示例：\n\n表 2.1 云服务类别与云能力类型\n\n![](img/T2.1.jpg)\n\n- **数据库即服务**：按需提供的数据库功能，由云服务提供者执行数据库的维护。\n\
  - **桌面即服务**：远程构建、配置、管理、存储、执行和交付用户桌面功能。本质上，桌面即服务将常用的桌面应用以及数据从用户的桌面或笔记本电脑卸到云端。旨在为远程使用程序、应用程序、流程和文件提供可靠、一致的体验。\n\
  \n\n\n\n\n*   邮件即服务（Email as a service）：一种完整的邮件服务，包括相关的支持服务，如邮件的存储、接收、传输、备份和恢复。\n\
  *   身份即服务（Identity as a service）：身份和访问管理 (IAM)，可以扩展并集中到现有的运行环境中。这包括开通/置备、目录管理以及单点登录服务的运行。\n\
  *   管理即服务（Management as a service）：包括应用管理、资产和变更管理、容量管理、问题管理（服务台）、项目组合组合管理、服务目录和服务水平管理。\n\
  *   安全即服务（Security as a service）：由云服务提供商将一系列安全服务集成到现有的运行环境中。这可能包括身份验证、防病毒、反恶意软件/间谍软件、入侵检测和安全事件管理等。\n\
  \n## 2.4.5 XaaS\n\nXaaS 是云服务交付的最新发展。该缩写有三种通认的解释，它们的含义大体相同：\n\n*   任何事物即服务（Anything\
  \ as a service）：其中“任何”指的是除传统服务以外的任何服务。\n*   万物即服务（Everything as a service）：虽然这个版本有时会被拼写出来，但它带有误导性，因为没有供应商能提供所有可能的云服务。这个版本旨在暗示云服务提供商正在提供广泛的服务产品。\n\
  *   X 即服务（X as a service）：其中“X”可以代表任何可能的云服务选项。\n\nXaaS 提供商从以下三个方面超越了传统的“三巨”服务：\n\
  \n*   某些提供商将 `SaaS`、`PaaS` 和 `IaaS` 打包，以便客户对企业日益信赖的基础云服务进行一站式采购。\n*   XaaS 提供商能够越来越多地取代\
  \ IT 部门通常为内部客户提供的更广泛的服务。这种策略减轻了 IT 部门获取、维护、补丁和升级各种常用应用程序和服务的负担。\n*   XaaS 模型通常涉及客户与提供商之间持续的关系，其中包含定期的状态更新和真正的双向实时信息交换。事实上，这是一种托管服务提供，允许客户根据需要仅投入任何所需的服务量，并随着客户需求的演变和可用服务的扩展而扩大服务的数量和类型。\n\
  \nXaaS 对客户来说变得越来越具有吸引力，因为它提供了以下优势：\n\n1.  总成本得到控制并降低。通过将最大范围的 IT 服务外包给合格的专家伙伴，企业可以看到即时和长期成本降低。由于不需要在本地获取得多的硬件和软件，资本支出大幅减少。由于使用的资源是根据即时需求定制的，且仅随需求变化而变化，因此运营成本较低。\n\
  2.  风险降低。XaaS 提供者提供约定的服务水平。这消除了内部项目中常见的成本超支风险。使用单一提供者提供广泛的服务为解决问题提供了单一接触点。\n3. \
  \ 加速了创新。IT 部门不断面临着这样的风险：安装了新硬件和软件后，结果发现安装完成时已经有了功能更强、价格更廉或两者兼具的后续版本。有了 XaaS，最新的产品可以更快地获得。此外，提供商可以快速响应客户的反馈。\n\
  \n## 2.5 云部署模型\n\n许多组织中存在一种日益明显的趋势，即将大部分甚至所有 IT 运营迁移到企业级云计算。该组织在云的所有权和管理方面面临着一系列选择。本节将介绍云计算的四种最主要的部署模型。\n\
  \n### 2.5.1 公有云\n\n公有云基础设施向公众或大型行业组开放，并由销售云服务的组织所有。云提供商既负责云基础设施，也负责云内部数据和操作控制。公有云可以由商业、学术或政府组织或其组合拥有、管理和运行。它存在于云服务提供商的办公场内。\n\
  \n在公有云模型中，所有主要组件都在企业防火墙之外，位于多租户基础设施中。应用程序和存储通过安全的 IP 在互联网上提供，可以是免费的，也可以按需付费。这种类型的云提供易于使用的消费者型服务，例如\
  \ Amazon 和 Google 的按需 Web 应用程序或容量、Yahoo 邮件，以及为照片提供免费存储的 Facebook 或 LinkedIn 社交媒体。虽然公有云廉价且可以扩展以满足需求，但它们通常不提供或提供较低的\
  \ SLA，并且可能无法提供私云或混合云服务中提供的防止数据丢失或损坏的保证。公有云适用于不需要防火墙内预期同等水平服务的消费者和实体。此外，公有 IaaS 云并不一定提供对隐私法律的限制和合规性，这些仍然是订阅者或企业终端用户的责任。在许多公有云中，重点是消费者和中小型企业，那里提供按需付费定价，通常相当于每\
  \ GB 几分钱。这里的服务示例可能是图片和音乐共享、笔记本电脑备份或文件共享。\n\n公有云的主要优势是成本。订阅组织仅为其需要的服务和资源付费，并可以根据需要进行调整。此外，订阅者极大地减少了管理开销。主要关注的是安全；然而，许多公有云提供商已经证明了强大的安全控制，事实上，此类提供商可能比私有云拥有更多资源和专业知识来投入安全工作。\n\
  \n图 2.4 一般地展示了用于为企业提供专用云服务的公有云背景。公有云提供商为多样化的客户池服务。任何企业的云资源都与其他客户使用的资源隔离开，但隔离程度在提供商之间有所不同。例如，提供商为特定客户分配了若干台虚拟机，但一个客户的虚拟机可能与其他客户的虚拟机共享相同的硬件。\n\
  \n```\n![图 2.4 公有云配置。](img/fig2.4.jpg)\n```\n图 2.4 公有云配置。\n\n### 2.5.2 私有云\n\n私有云在组织内部的\
  \ IT 环境中实施。组织可以选择在内部管理云，也可以将管理功能外包给第三方。此外，云服务器和存储设备可能存在场内，也可能存在场外。\n\n私有云可以通过内网或通过互联网上的\
  \ VPN 向员工或业务部门内部交付 IaaS，还可以向其分支机构提供软件（应用程序）或存储服务。在这两种情况下，私有云都是一种利用现有基础设施，并在组织网络隐私范围内交付并对组合或完整服务进行计费的方式。通过私有云服务的示例包括按需数据库、按需邮件和按需存储。\n\
  \n\n\n\n\n选择私有云的关键动力是安全性。私有云基础设施对数据存储的地理位置和其他安全方面提供了更严格的控制。其他优势还包括易于资源共享以及向组织实体进行快速部署。\n\
  \n图 2.5 展示了两种典型的私有云配置。私有云由相互连接的服务器和数据存储设备组成，用于托管企业应用程序和数据。本地工作站可以在企业安全边界内访问云资源。远程用户（例如，来自分支办公室的用户）通过安全链接访问，例如连接到安全边界访问控制器（如`firewall`）的\
  \ `VPN`。企业还可能选择将私有云外包给云提供商。云提供商建立并维护该私有云，该云由不与其他云提供商客户共享的专用基础设施资源组成。通常，边界控制器之间的安全链接为企业客户系统与私有云之间的通信提供了。此链接可能是专用的租线或通过互联网的\
  \ `VPN`。\n\n![图 2.5 私有云配置。（(a) 本地私有云；(b) 外包私有云。](img/fig2.5.jpg)\n\n图 2.5 私有云配置。（(a)\
  \ 本地私有云；(b) 外包私有云。\n\n### 2.5.3 社区云](#chapter2.xhtml#re_ch-2-sec-13)\n\n社区云共享了私有云和公共云的特性。像私有云一样，社区云限制访问。像公共云一样，云资源在多个独立组织之间共享。共享社区云的组织具有相似的需求，通常需要相互交换数据。采用社区云概念的一个行业示例是医疗行业。可以实施社区云以符合政府隐私和其他法规。社区参与者可以受控的方式交换数据。\n\
  \n云基础设施可能由参与组织或第三方管理，并可能存在于本地或异地。在这种部署模型中，成本分摊到用户身上的的人数比公共云少（但比私有云多），因此只能实现云计算的的成本节约潜力。\n\
  \n### 2.5.4 混合云](#chapter2.xhtml#re_ch-2-sec-14)\n\n混合云基础设施由两个或多个云（私有云、社区云或公共云）组成，这些云保持为独特的实体，但通过标准化或专有的技术结合在一起，从而实现数据和应用程序的可移植性（例如用于云之间负载均衡的云极速）。通过混合云解决方案，可以将敏感信息存放在云的私有区域，而不太敏感的数据可以利用公共云的优势。\n\
  \n混合公共/私有云解决方案对于较小的企业可能特别有吸引力。许多对安全性关注较少的应用可以在节省大量成本的情况下进行卸载，而无需迫使组织将更多敏感数据和应用程序迁移到公共云。表\
  \ 2.2 列出了四种云部署模型的一些相对优缺点。\n\n表 2.2 云部署模型比较\n\n![](img/T2.2.jpg)\n\n## 2.6 NIST 云计算参考架构](#chapter2.xhtml#re_ch-2-sec-15)\n\
  \n`NIST SP 500-292` \\[3\\] 建立了一个参考参考架构，描述如下：\n\n* 在整体云计算概念模型的背景下，说明并理解各种云服务\n*\
  \ 为消费者提供理解、讨论、分类和比较云服务的的技术参考\n* 有于对安全性、互操作性性和可移植性的候选标准及参考实现的分析\n\n### 2.6.1 云计算参与者](#chapter2.xhtml#re_ch-2-sec-16)\n\
  \n图 2.6 所示的参考架构根据下列表定义的角色和责任定义了五个主要参与者：\n\n![图 2.6 NIST 云计算参考架构。](img/fig2.6.jpg)\n\
  \n图 2.6 NIST 云计算参考架构。\n\n* 云消费者：与云提供商保持业务关系并使用其服务的个人或组织\n* 云提供商 (`CP`)：负责为利益相关方提供服务的个人、组织或实体\n\
  * 云审计员：能够对云服务、信息系统操作、性能以及云实施的安全性进行独立评估的第三方\n* 云经纪人：管理云服务的使用、性能和交付，并并在 CP 与云消费者之间谈判关系的实体\n\
  * 云运营商：提供从 CP 到云消费者的云服务连接和传输的中介\n\n云消费者和提供者的角色已经讨论过了。总结来说，云提供商可以提供一种或多种云服务以满足云消费者的\
  \ IT 和业务需求。对于三种服务模型（`SaaS`、`PaaS`、`IaaS`）中的每一种，`CP` 都提供支持该模型所需的存储和处理设施，以及用于云服务消费者的云接口。对于\
  \ `SaaS`，`CP` 在云基础设施上部署、配置、维护和更新软件应用程序的操作，以便服务按照预期的服务水平提供给云消费者。`SaaS` 的消费者可以是为成员提供软件应用程序访问的组织、直接使用软件应用程序的终端用户，或为终端用户配置应用程序的软件应用程序管理员。\n\
  \n对于 `PaaS`，`CP` 管理平台的计算基础设施，并运行提供平台组件的云软件，例如运行时软件执行栈、数据库和其他中间件组件。`PaaS` 云消费者可以利用\
  \ CP 提供的工具和执行资源来开发、测试、部署和管理托管在云环境中的应用程序。\n\n对于 `IaaS`，`CP` 获取服务的底层物理计算资源，包括服务器、网络、存储和托管基础设施。`IaaS`\
  \ 云消费者反过来使用这些计算资源（如虚拟机）满足其基础计算需求。\n\n云运营商是提供 CP 与云消费者之间云服务连接和传输的网络设施。通常，`CP` 会与云运营商建立服务水平协议\
  \ (`SLAs`)，以提供与向云消费者提供的 SLA 水平一致的服务，并可能要求云运营商在云消费者和 CP 之间提供专用安全连接。\n\n当云服务复杂到云消费者受于管理时，云经纪人非常有用。云经纪人可以提供三个领域的支持：\n\
  \n* 服务中介：这些是增值服务，如身份管理、性能报告和增强安全性。\n* 服务聚合：结合多个云服务以满足单一 无法满足的需求，或为了优化性能或降低成本。\n\
  * 服务套利：这与服务聚合类似，但所聚合的服务不是固定的。服务套利意味着经纪人可以灵活地从多个机构选择服务。例如，云经纪可以使用信用评分服务来衡量并选择得分最高的机构。\n\
  \n\n\n\n\n云审计员可以从安全控制、隐私影响、性能等方面对云服务商（CP）提供的服务进行评估。审计员是一个独立实体，可以确保 CP 符合一组标准。\n\n\
  图 2.7 阐了参与者之间的交互。云消费者可以直接或通过云经纪人向云服务提供者请求云服务。云审计员进行独立审计，并可能与其他方联系以收集必要信息。该图显示，云网络问题实际上涉及三种不同类型的网络。对于云生产者而言，网络架构是典型的大型数据中心架构，由高性能服务器和存储设备的机架组成，并与高速的机顶（ToR）以太网交换机相互连接。在这种背景下，关注的重点是虚拟机的放置与移动、负载均衡以及可用性问题。企业网络可能具有完全不同的架构，通常包括许多局域网（LAN）、服务器、工作站、PC\
  \ 和移动设备，涉及广泛的网络性能、安全和管理问题。生产者和消费者对于与许多用户共享的云载体，其关注点在于创建具有适当 SLA 和安全保障的虚拟网络的能力。\n\
  \n![图 2.7 云计算中参与者之间的交互。](img/fig2.7.jpg)\n\n图 2.7 云计算中参与者之间的交互。\n\n### 2.6.2 云提供者架构组件\n\
  \n图 2.6 显示了云提供者的四个主要架构组件。服务编排是指系统组件的组合，用于支持云提供者在安排、协调和管理计算资源方面的活动，从而向云消费者提供云服务。编排被显示为三层架构。我们在这里看到了通过资源抽象层将物理资源映射到消费者可见服务的熟悉映射。资源抽象组件的示例包括软件元素，如虚拟机管理器（hypervisors）、虚拟机、虚拟数据存储和其他计算资源抽象。\n\
  \n云服务管理包含了管理和运行云消费者所需或提议服务的服务所需的所有服务相关功能。它涵盖了三个主要领域：\n\n*   业务支持：这包括处理客户的业务相关服务，如会计、计费、报告和审计。\n\
  *   供应/配置：这包括用于为消费者快速部署云系统的自动化工具、调整配置和资源分配，以及对资源使用进行监控和报告。\n*   可迁移性/互操作性：消费者对支持数据和系统迁移性以及服务互操作性的云产品感兴趣。这在混合云环境中特别有用，在混合环境中，消费者可能希望更改本地与远程站点之间数据和应用程序的分配。\n\
  \n安全和隐私是云提供者架构所有层级和元素的问题。\n\n## 2.7 ITU-T 云计算参考架构\n\n查看在 ITU-T Y.3502 中发布的另一种参考架构\
  \ [4] 是很有用的。该架构在范围上比 NIST 架构稍宽，并将架构视为分层功能架构。\n\n### 2.7.1 云计算参与者\n\n在查看四层架构之前，我们需要注意\
  \ NIST 和 ITU-T 之间的差异。ITU-T 文档定义了参与者：\n\n*   云服务客户或用户：处于云服务使用关系的一方。其业务关系是与云服务提供者建立的。\n\
  *   云服务提供者：提供云服务的一方。云服务提供者专注于提供服务和确保其交付的必要活动。云服务提供者包括大量的活动（例如：提供服务、部署服务、管理业务）以及众多角色（例如：业务经理、服务经理、网络提供者）。\n\
  *   云服务合作伙伴：参与支持云提供者或云服务客户活动或作为其辅助活动的一方。云服务合作伙伴的活动取决于合作伙伴的类型及其与云服务的关系。云服务合作伙伴的示例包括经纪人和审计员。\n\
  \n云服务合作伙伴结合了（但不限于）NIST 的经纪人和审计员角色。图 2.8 描绘了由于这些参与者及其在云生态系统中的某些可能角色。\n\n![图 2.8 云计算中参与者之间的交互。](img/fig2.8.jpg)\n\
  \n图 2.8 云计算中参与者之间的交互。\n\n### 2.7.2 分层架构\n\n图 2.9 显示了四层 ITU-T 云计算参考架构。用户层是用户界面，云服务客户通过它与云服务提供者及云服务交互，执行与客户相关的管理活动并监控云服务。它还可以将云服务的输出提供给另一个资源层实例。当云接收服务请求时，它编排自己的资源和/或其他云的资源（如果通过跨云功能接收到其他云资源），并通过用户层提供云服务。用户层是云服务用户（CSU）所在地。\n\
  \n![图 2.9 ITU-T 云计算参考架构。](img/fig2.9.jpg)\n\n图 2.9 ITU-T 云计算参考架构。\n\n接入层为手动和自动访问服务层中的可用功能提供了通用接口。这些功能包括服务本身的功能，还包括管理和业务功能。接入层使用\
  \ `cloud APIs` 接收用户和/合作伙伴或其他提供者的云服务消费请求，以访问提供者的服务和资源。\n\n接入层负责通过一个或多个访问机制呈现云服务能力，例如，作为通过浏览器访问的一系列网页，或作为可以通过编程访问的一系列网络服务。接入层还处理安全和质量保证（QoS）。\n\
  \n服务层包含云服务提供者所服务的实现（例如：`SaaS`、`PaaS`、`IaaS`）。服务层包含并控制实现服务的软件组件（但不底层的虚拟机管理器、主机操作系统、设备驱动程序等），并安排通过接入层向用户提供云服务。\n\
  \n\n\n\n资源层由提供者可用的物理资源以及适当的抽象和控制机制组成。例如，虚拟机软件可以提供虚拟网络、虚拟存储和虚拟机能力。它还包含了提供提供者与用户之间底层网络连接所需的云核心传输网络功能。\n\
  \n多层功能包括一系列功能组件，这些组件与其他四层的功能组件相互作用以提供支持能力。它们包括五类功能组件：\n\n* 集成（Integration）：负责连接架构中的功能组件以创建统一的架构。集成功能组件在云架构及其功能组件之间、以及与外部功能组件之间提供消息路由和消息交换机制。\n\
  * 安全系统（Security systems）：负责应用安全相关的控制，以缓解云计算环境中的安全威胁。安全系统的功能组件涵盖了支持云服务所需的所有安全设施。\n\
  * 运营支持系统（OSS）：涵盖管理和控制提供给客户的云服务所需的运营相关管理能力。OSS 还涉及系统监控，包括报警和事件的使用。\n* 业务支持系统（BSS）：涵盖处理客户和支持流程（如计单和账户）的一系列业务相关管理能力。\n\
  * 开发功能（Development function）：支持云服务开发者的云计算活动。这包括对服务实现的开发和/或组合、构建管理以及测试管理的支持。\n\n\
  ### 2.7.3 ITU-T 云计算功能参考架构\n\n[图 2.9] 显示了 `Y.3502` 中定义的四层云计算参考架构。查看此架构的早期版本是有用的，该版本定义在\
  \ `[[5]]` 中并在[图 2.10]所示。该架构与 `Y.3502` 具有相同的四层结构，但对最底层提供了更多细节，该层被称为`资源和网络层`。该层由后续列表中定义的三个子层组成：\n\
  \n![图 2.10 ITU-T 云计算功能参考架构。](img/fig2.10.jpg)\n\n图 2.10 ITU-T 云计算功能参考架构。\n\n* 资源编排（Resource\
  \ orchestration）：由上层和用户对计算、存储和网络资源进行管理、监控和调度，转换为消耗的服务。它控制虚拟化资源的创建、修改、自定义和释放。\n*\
  \ 池化和虚拟化（Pooling and virtualization）：虚拟化功能将物理资源转换为虚拟机、虚拟存储和虚拟网络。这些虚拟资源随后根据用户需求由资源编排进行管理和控制。池化和虚拟化层中的软件和平台资产是用于编排和实现云服务的运行时环境、应用程序和其他软件资产。\n\
  * 物理资源（Physical resources）：提供云服务的基础计算、存储和网络资源。这些资源可能包括位于云数据中心内部的（例如计算服务器、存储服务器和云内网络）以及位于数据中心外部的（通常是网络资源，如云间网络和核心传输网络）。\n\
  \n## 2.8 云计算的网络需求\n\n云计算为流量通过网络的高效高效流动带来了严峻挑战。在这方面，考虑由 ITU-T 开发并在[图 2.11]中所示的云网络模型\
  \ `[[6]]` 将会有帮助。该图指示了云网络和业务提供者以及云服务用户的网络关注范围。\n\n![图 2.11 云网络模型。](img/fig2.11.jpg)\n\
  \n图 2.11 云网络模型。\n\n云服务提供者维护一个或多个本地或区域云基础设施。云内网络连接基础设施的元素，包括数据库服务器、存储阵列和其他服务器（例如防火墙、负载均衡器、应用加速设备和\
  \ IDS/IPS）。云内网络可能包含多个通过 IP 路由器互连的局域网。在基础设施内部，数据库服务器组织成虚拟机集群，为不同的用户提供虚拟化的、隔离的计算环境。\n\
  \n云间网络将云基础设施相互连接。这些云基础设施可能由同一云提供者所有，也可能由不同的提供者所有。最后，客户使用核心传输网络访问并消费部署在云提供者数据中心内的云服务。[图\
  \ 2.6] 还描述了两类 OSS：\n\n* 网络 OSS：传统的 OSS 是为电信服务提供者专用系统。网络 OSS 系统支持的过程包括网络资源库的管理和维护、特定网络组件的配置以及故障管理。\n\
  * 云 OSS：云基础设施的 OSS 是为云计算服务提供者专用系统。云 OSS 支持云资源的维护、监控和配置流程。\n\n这三个网络组件（云内、云间、核心）与\
  \ OSS 组件共同构成了云服务组合和交付的基础。ITU-T 云计算技术小组小组报告 `[[5]]` 列出了对该网络能力的以下功能需求：\n\n* 可扩展性（Scalability）：网络必须能够轻松扩展，以满足从当前具有数百或数千台服务器的云基础设施到具有数万甚至数十万台服务器的网络的需求。这种扩展在地址解析、路由和拥塞控制等领域带来了挑战。\n\
  * 性能（Performance）：大数据安装和云提供者网络中的流量是不可预测且变动很大的 `[[7]]`。同一机架内相邻服务器之间存在持续的峰值，单源服务器与多个目标服务器之间存在间歇性的高流量。云内网络需要为服务器之间提供可靠、高速的直接（逻辑点对点）通信，并确保数据中心内任意两个服务器之间具有无拥塞的链路和均匀的容量。ITU-T\
  \ 报告得出，数据中心使用的当前三层拓扑（接入、聚合和核心）并不适应于提供这些需求。更灵活、更动态的数据流控制，以及网络设备的虚拟化，为提供所需的服务质量提供了更好的基础。\n\
  * 敏捷性和灵活性（Agility and flexibility）：基于云的数据中心需要能够响应并管理云资源利用的高度动态性。这包括适应虚拟机迁移的能力，以及对穿过数据中心的流进行细粒度控制。\n\
  \n支持云计算的网络需求是网络技术开发和部署的关键驱动因素之一，特别是软件定义网络（SDN）和网络功能虚拟化 `[[8]]`。\n\n\n\n\n\n## 2.9\
  \ 总结\n\n云计算提供了规模经济、专业的网络管理和专业的安全管理。这些特征对于大小各的公司、政府机构以及个人 PC 和移动用户都具有吸引力。个人或公司仅需为所需的存储容量和服务付费即可。无论用户是公司还是个人，都不必经历设置数据库系统、获取所需硬件、进行维护和备份数据的烦恼：这一切都是云服务的一部分。\n\
  \n从理论上讲，使用云存储数据并与他人共享的另一个大优势是云提供商负责安全。然而，客户并不总是受到保护。云提供商已经发生过多次安全故障。Evernote 在 2013\
  \ 年初因发现入侵后要求所有用户重置密码而登上新闻头条。云安全将在后续章节中讨论。\n\n## 2. 参考文献\n\n1. 国家标准与技术研究院。2011 年\
  \ 1 月。NIST 云计算定义，特别出版 `SP-800-145`。\n2. 国际电信联盟。2014 年 8 月。云计算——概述与术语。`ITU-T Y.3500`。\n\
