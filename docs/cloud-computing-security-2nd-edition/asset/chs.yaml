  \ C2 表现为标准邮件流量。\n\n这个特定的示例之所以重要，有两个原因。首先，随着我们开始将数据和文档管理迁移到云端，区分恶意流量和合法流量将变得越来越困难。正如我们之前提到的，许多组织的目标是严格过滤任何第三方云端邮件流量，因为他们对此没有控制权。现在我们看到许多组织开始将其处理工作移动到云端，这使得检测此类\
  \ C2 流量变得非常困难，因为它们与“正常”流量混合在一起。图 33.7 说明了这一点。\n\n![图 33.7 C2 流量与“正常”流量混合。](img/fig33.7.jpg)\n\
  图 33.7 C2 流量与“正常”流量混合。\n\n另一个导致此问题的由于是，在我们的测试中，我们发现许多安全设备会忽略进出 Google 和 Microsoft\
  \ 等源的流量。花点时间自己测试一下。从工作邮箱发送一封邮件，给你的个人邮箱地址发送一系列 Windows 命令。\n\n它触发任何警报了吗？很可能没有。为什么？嗯，这是因为尝试对邮件和搜索数据中的命令与控制数据触发警报会导致不断产生警报。许多系统管理员和人员经常搜索命令行表达式。我们许多人也来回发送带有命令和输出的邮件。这是我们工作的一部分。因此，这些设备的开发者在面对生成的成百甚至上千条警报时，会简单地忽略通往许多此类云服务的流量。\n\
  \n但是，这不仅可以扩展到文档和搜索，还可以扩展到我们正变得越来越依赖的文件同步工具。例如，Jake Williams 公开发布了一个名为 `DropSmack`\
  \ 的工具，该工具在 DropBox 上建立了一个具韧性且可靠的 C2 通道。\n\n图 33.8 来自 DropSmack。特别感谢 Jake Williams\
  \ [2]。\n\n![图 33.8 DropSmack。](img/fig33.8.jpg)\n\n\n\n\n\n图 33.10 HIBP 上未泄露的个人账户。\n\
