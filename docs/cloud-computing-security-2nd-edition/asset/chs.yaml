  \ (FedRAMP)\n    - 28.4.1.3 国防信息系统局\n    - 28.4.2 加拿大 IT 安全指南\n    - 28.4.3 澳大利亚信号局与\
  \ IRAP 合规\n- 28.4.4 俄罗斯加密许可证与 FSTEC 认证\n- 28.4.5 中国互联网与云服务商\n- 28.4.6 德国 BSI 与 IT-Grundschutz\
  \ 认证\n- 28.5 云服务提供商面临的风险与挑战\n    - 28.5.1 云服务架构的潜在重新设计\n    - 28.5.2 缺乏标准\n    -\
  \ 28.5.3 政府云概念的复用有限\n    - 28.5.4 政府干预导致的控制权\n    - 28.5.5 未来认证或合规审计失败的风险\n    -\
  \ 28.5.6 政治和制裁对云业务的影响\n    - 28.5.7 成本和工作的显著增加\n- 28.6 总结\n- 参考文献\n\n## 28.1 引言\n\
  \n由政府和军事客户组成的公共部门是一个充满挑战的领域。在某种程度上，如果商业公司深度交互、生产、销售或处理军事或政府数据及产品，它们也受这些法规的约束。并不意外的是，这些政府客户所采用的要求和法规在国家之间并不统一。基本上，每个国家都定义自己的规则。当然，在加密的使用方面存在一些相似之处，但这种帮助有限，因为加密软件或硬件必须通过每个单独政府的认证。此外，他们还要求数据必须存储在本地，并仅由当地公民管理。如果云服务是基于“日夜不息”的支持支持模式进行全球化运营，并且没有用于全天（24/7）云运营的本地特定资源，那么这对云服务提供商来说就是一个挑战。除了这些技术性的云基础设施和云运营方面外，解决方案和服务还必须通过本地标准的认证。因此，云服务提供商可能需要维护几十种针对特定国家的实现方案。本章将描述云计算背景下的部分此类政府和特定国家的要求。它将解释可以作为云基准的现有国际标准和证明，并概述该领域的一些风险。\n\
  \n## 28.2 通用云认证与合规\n\n在云运行运行应用程序或系统具有特殊属性，在通用认证和合规控制框架中需要考虑这些属性。例如，云系统镜像、快照或云存储磁盘很容易创建，几乎可以在瞬间完成复制，并可以传输和存储在世界任何地方。此类镜像的全球分布和可用性一方面在可扩展性、可用性和性能方面是云的一大优势，但也可能带来监管合规方面的风险。此外，云服务提供商日益成为全球攻击者的焦点，因为所有有价值的公司（即目标）都集中在少数数据中心或云解决方案中。图\
  \ 28.1 展示了这种范式转变。云提供商面临的攻击更多，需要执行比其客户更高的安全标准，以保护云数据和系统的完整性。\n\n```\n![图 28.1 遭受攻击的云提供商。](img/fig28.1.jpg)\n\
  ```\n 28.1 遭受攻击的云提供商。\n\n另一个事实是，云可能是全球性的，但世界上各国仍根据当地管辖权法律行动。例如，符合美国或加拿大法规的云服务器镜像可能不符合欧盟的隐私或银法。因此，如果使用这些镜像创建云服务器实例（例如用于欧盟的生产性银业务），可能会出现问题。云中的虚拟机必须自能够满足所需法规的镜像，或者必须在显式的安装后步骤中进行重新配置，以确保必要的合规性。服务器管理员必须在云服务器上运行业务关键系统之前，必须尽早考虑特定国家的法规。\n\
  \n\n\n\n\n某些法律或监管合规性方面由云服务提供商及其认证涵盖。云客户必须检查是否具备所有需要的认证，例如针对所使用的数据中心或针对存储、网络和虚拟化等基础服务的认证。这些是行业独立的\
  \ `SOC1/SSAE16/ISAE3402` \\[1, 2, \\] 以及 `SOC2 Type II` 报告与证明，以及通用的 `ISO27001` \\\
  [3\\], `ISO9001` 或 `ISO22301` 认证。此外，大多数云服务提供商还提供针对各种行业和特定标准的额外认证，例如 `PCI DSS`、`HIPAA`、`ITAR`、`FIPS\
  \ 140-2` \\[4\\], `NIST` 或针对云解决方案的 `Cloud Security Alliance STAR` 认证。在此类云环境中运行关键业务系统，至少需要\
  \ `SOC` 证明和 `ISO` 认证。这些认证应涵盖提供商提供的整个云服务。图 28.2 显示了按地区和行业类型分组的各种政府和行业特定认证及证明标准示例。医疗或金融等受监管行业的限制更多，但公共部门由于包含政府和军事客户群，其要求无疑是最高且最复杂的。\n\
  \n![图 28.2 国家和行业特定的认证。](img/fig28.2.jpg)\n\n图 28.2 国家和行业特定的认证。\n\n## 28.3 全球范围内的数据保护与隐私\n\
  \n云端对客户数据保护和隐私的需求可能是大多数云产品的共同共同点之一。这也是一些国家制定跨大西洋条约和协议，并试图统一隐私标准和方法的领域。这对于大多数西方文明或民主国家都是如此。遗憾的是，还有其他像俄罗斯或中国这样的例子，它们并没有遵循美国/欧盟的方法，而是引入了自己关于本国个人数据保护处理方式的独特做法。\n\
  \n对于美国和欧盟，创建了风港框架 \\[5\\]，以便美国和欧洲公司通过应用一套统一的最小措施进行此类数据的处理、存储和删除，来交换各自公民的个人数据。在欧盟内部，所有成员国都采用了欧盟隐私条例，并实施了必须与欧盟要求保持一致的本地隐私法。个人数据可以在欧盟国家之间交换，如果他们实施并遵守风港计划，也可以与美国公司交换。如图\
  \ 28.3 所示，即使是像欧盟这样没有充分数据保护水平的国家，如果国际协议或公司之间的直接合同承诺弥补了差距，也可以交换个人数据，当然这前提是在法律框架允许的情况下。\n\
  \n![图 28.3 缺失数据保护水平的补偿。](img/fig28.3.jpg)\n\n图 28.3 缺失数据保护水平的补偿。\n\n俄罗斯等其他国家对公民个人数据有强力的保护措施，不允许此类数据传输或存储到另一个国家。在这些情况下，如果该国仍保留数据副本，或者提供商符合某些特定的俄罗斯本地标准和认证，则云服务提供商可能能够在俄罗斯境外处理和存储数据。这，当然只是许多示例中的之一。对于云服务提供商来说，这意味着在不检查当前的云基础设施和数据处理环境是否实际允许使用的情况下，业务无法扩展到新的国家或市场。图\
  \ 28.4 显示了不同国家不同的限制性数据保护和隐私立法。尽管这只是一个例子，但它展示了全球立法是如何碎片化的。\n\n![图 28.4 数据保护法示例世界地图。](img/fig28.4.jpg)\n\
  \n图 28.4 数据保护法示例世界地图。\n\n这些考虑因素主要影响提供软件即服务（SaaS）解决方案的云提供商，例如包含个人数据的基于网络的工作场所、人力资源或客户关系管理或供应商管理解决方案。在基础设施即服务（IaaS）或平台即服务（PaaS）设置中，数据保护也是云客户的直接责任，因为客户控制着数据处理应用程序的配置和运行。\n\
  \n## 28.4 云业务中的政府认证\n\n在大多数国家，没有专门针对云的政府认证；相反，政府对其内部 IT 运营定义了要求，这些要求在在使用外部托管或云提供商时也适用。遗憾的是，某些国家和政府标准甚至没有意识到云业务的存在。因此，关于如何在云环境中实施这些要求以及云提供商如何如何合规并获得认证，存在大量讨论。云服务提供商将为每个国家建立专门的认证项目，甚至可能建立专门的云环境，以满足特定政府的需求。我们将在本节中探索其中一些特定国家的政府要求，并概述云服务提供商如何解决这些问题。\n\
  \n### 28.4.1 美国联邦合规要求概述\n\n如果 IT 系统或云提供商想要托管和处理政府数据，或者它们与军事工业相关，美国有几项相关的法规和要求。在大多数情况下，美国国家标准与技术研究所（`NIST`）的相应标准也为此类政府\
  \ IT 系统的设置以及这些系统允许运行的模式概述了非常详细的技术要求。加密或使用认证设备是关键技术要求之一。此外，运行模式以及外国管理员的使用（例如）也是此类政府或军事相关机构的主要关注点。数据机密和防止外国损害国家利益起着至关重要的作用。这与可能在全球范围内按\
  \ 24/7 支持模式运行的全球云解决方案的想法冲突。\n\n#### 28.4.1.1 ITAR 和 EAR\n\n出口管理条例（`EAR`）和国际武器贸易条例（`ITAR`）涉及军事物品、信息或国防服务的出口控制。如果运行此类军事信息系统，可能会影响\
  \ IT 系统或云解决方案。出口控制有四个主要目的：\n\n*   保护美国免受恐怖主义威胁\n*   控制武器运输\n*   执行贸易保护\n*   控制犯罪\n\
  \n\n\n\n因此，国家安全和贸易保护是这项法规的主要驱动力。`EAR` 监管具有军事应用或相关性的商业和军民两物品及信息的出口。在允许此类物品或信息跨越“出口”或传输之前，受影响的公司必须申请出口许可证。适用于\
  \ `EAR` 的受限物品和信息定义在《商业管制清单》（Commerce Control List）中。`ITAR` 同样监管出口，重点是《美国军用清单》（U.S.\
  \ Munitions List）中定义的军用物品。这不仅包括例如武器系统，还包括技术数据、结构图或相关信息。大多数为此类客户提供解决方案的托管和云服务提供商关注的是\
  \ `ITAR` 合规性而非 `EAR`。图 28.5 显示了 `ITAR` 法规的目标以及 `ITAR` 出口许可证的使用。\n\n![图 28.5 ITAR\
  \ 出口许可证。](img/fig28.5.jpg)\n\n图 28.5 ITAR 出口许可证。\n\n目前还没有友好的指南来来实现 `ITAR` 合规，因此对于提供商来说，实施起来相当困难。在云的背景下，出口始终意味着受限的军事信息在\
  \ `U.S.` 边界之外传输、处理或存储。通常情况下，这些数据仅允许 `U.S.` 公民访问，而不允许外国人访问。即使云数据中心位于 `U.S.`，来自印度的远程支持也将是有问题的，并被视为数据出口。这意味着如果云处理、存储或支持人员不是位于\
  \ `U.S.`，你就需要出口许可证。如果云提供商或运营团队是 `NATO` 国家的一部分，则对于某些类型的信息，出口可能是被允许的，特别是当这些信息对抗 `U.S.`\
  \ 的能力有限时。只有非分类信息可以由 `U.S.` 永久居民或不在制裁名单上的国家处理，而无需出口许可证。例外情况必须获得军械管制办公室（Office of\
  \ Munitions Control）的许可和批准。\n\n#### 28.4.1.2 联邦风险授权管理计划 (FedRAMP)](#chapter28.xhtml#re_ch-28-sec-7)\n\
  \n许多 `U.S.` 政府机构有需要与承包商合作或运行自己的 IT 系统。根据决定，需要一个统一的政府范围风险管理计划来管理此类外包或多机构信息系统。`联邦风险授权管理计划\
  \ (FedRAMP)` \\[6\\] 通过定义包括云计算需求在内的安全监控解决了这些需求。`FedRAMP` 流程定义了五个角色和参与者：\n\n* 云服务提供商\n\
  * 想要使用云服务的 `U.S.` 机构\n* 一个联合授权委员会，负责审查并批准供政府使用的云提供商或云解决方案\n* 潜在的第三方评估员，协助审查和筛选过程\n\
  * `FedRAMP 计划管理办公室`，为上述各方提供支持和协调服务。\n\n该审查和批准过程的主要目的是确保云解决方案和云运营商符合必要的信息安全措施，并分析政府面临的剩余风险。图\
  \ 28.6 通过列出所需的审查和批准步骤并展示相应的工作流解释了这一评估过程。在初始步骤之后，该流程将进入持续监控和年度审查循环，以确保最初实现的合规性不会随时间推移而丢失。\n\
  \n![图 28.6 FedRAMP 评估过程。](img/fig28.6.jpg)\n\n图 28.6 FedRAMP 评估过程。\n\n第三项任务是降低总成本并监控潜在的重复工作（成本效益分析）。因此，`U.S.`\
  \ 拥有跨机构批准并定义的安全基准，这些基准由云服务提供商实施。如果这样一个云提供商符合 `FedRAMP` 合规并获得批准，它将自动使服务能够与各种机构合作，而无需构建特定机构的政府云实现。\n\
  \n`NIST` 被指定为 `FedRAMP` 计划的技术顾问。他们帮助定义了 `FedRAMP` 流程和基础安全需求。需要注意的是，`NIST` true 执行机构。`FedRAMP`\
  \ 的治理和实施由联邦 CIO 委员会（Federal CIO Council）负责。\n\n在此背景下，`NIST` 为云计算创建了特别出版物 `800-53`\
  \ \\[7\\]。他们还开发了《联邦信息处理标准》(FIPS)，用于监管（例如）加密的使用 \\[5\\]。`NIST` 负责 `U.S.` 配置基准，为各种软件产品的安全配置和运行提供清晰指导。\n\
  \n因此很清楚，云提供商需要实施这些 `FIPS` 和 `NIST` 要求，才能获得 `FedRAMP` 的批准。`U.S.` 政府云客户在大多数情况下只会购买符合\
  \ `FedRAMP` 标准并获得批准的云解决方案。\n\n#### 28.4.1.3 国防信息系统局](#chapter28.xhtml#re_ch-28-sec-8)\n\
  \n对于 `U.S.` 军事或国防部 (DoD) 相关的云产品，国防信息系统局 (DISA) 负责对解决方案进行认证。`DISA` 运行并确保联合战斗人员或国家级领导人使用的全球\
  \ IT 基础设施，他们希望为 `U.S.` 的防御提供 IT 优势。因此，所有的 IT 基础设施在数据可用性、完整性和机密性方面必须满足最高要求，因为美国人的生命可能取决于此。此外，他们的系统需要在战争情况下确保做出有效的决策。\n\
  \n### 28.4.2 加拿大 IT 安全指南](#chapter28.xhtml#re_ch-28-sec-9)\n\n加拿大定义了一系列信息安全指南 (ITSG)，用于运行政府\
  \ IT 系统。例如，`ITSG-22` 和 `ITSG-38` 处理网络区域的边界要求，`ITSG-13` 处理加密密钥的使用和排序。特别是对于公共云，定义了\
  \ `ITSB-105` 为政府机构在想要使用云解决方案时必须考虑的因素列表 \\[8\\]。由于与 `U.S.` 接近，`NIST` 和 `FIPS` 标准的许多原则在加拿的要求中可见。当局并不拒绝云产品，而是非常关注基于风险的评估和风险管理方法\
  \ (`ITSG-33`)，以确保其数据的必要安全性。\n\n作为一个复杂的因素，必须提到加拿大各省在这些政府法规方面是高度独立的。大多数省份都有自己的本地规则和法律，需要由云提供商实施。这正是主要的复杂性所在。联邦\
  \ `ITSG` 文档可能没有约束力，或者对于某些省份来说并不充分。\n\n\n\n\n澳大利亚信号方向局（ASD）创建了信息安全注册评估员计划（IRAP），旨在为希望处理、存储或传输高达最高机密级政府数据的信息技术系统或云服务提供评估框架。ASD\
  \ 的角色与美国的 `NIST` 类似，并提供了一份信息安全手册（`ISM`），概述了针对不同机密级别采取的必要技术和组织措施。例如，它定义了加密算法（甚至精确到密钥长度或技术实现）以及网络电缆的颜色代码或标签。它还要求对于某些政府数据只能使用经过\
  \ ASD 认证的设备。这给云服务架构造成了巨大压力，因为使用的硬件或软件可能不被允许，并且需要替换为认证版本。`ISM` 包含了数百项非常具体的要求，这些要求需要与云解决方案以及云提供商的运营流程相匹配。最终，这可能会导致必须运行和维护一个完全隔离的云解决方案的风险。`IRAP`\
  \ 评估员是经 ASD 的第三方，具备执行此类评估并定义与 `ISM` 相比差距的技能。云提供商应在 `IRAP` 评估员再次深入审查解决方案以评估所有发现的问题是否已解决之前，修复所有识别出的差距。之后，报告将提交认证机构（也是\
  \ ASD），由其对是否授予 `IRAP` 认证做出最终决定。[图 28.7] 以流程图的形式展示了获得必要的 `IRAP` 认证和认可所需的基本步骤。这些审计和评估步骤会根据目标云解决方案和处理的数据类型，在特定的间隔内重复进行。最重要的是，有两个审计步骤。第一阶段仅用于识别差距和缺失的控制措施，第二次审计是确认控制措施已实施并起草实际报告。评估员不授予认证；这由权威根据提供的审计报告和剩余风险完成。在云提供商将其解决方案用于澳大利亚政府数据之前，必须实现这一\
  \ `IRAP` 合规性。\n\n![图 28.7 IRAP 认证流程。](img/fig28.7.jpg)\n\n图 28.7 IRAP 认证流程。\n\n\
  ### 28.4.4 俄罗斯加密许可证与 FSTEC 认证\n\n俄罗斯是一个并不那么在意 `ISO27001` 等国际认证，或欧洲、美国定义的 `SOC1/2`\
  \ 等证明的国家，因为他们有自己的标准和认证。如果数据存储在俄罗斯境外，俄罗斯公司不愿意使用云解决方案。此外，新引入的俄罗斯法规进一步限制了俄罗斯公民数据的存储。因此，俄罗斯公司无法轻易使用在（例如）美国数据中心运营并管理员工的人力资源云解决方案。如果云提供商决定在俄罗斯境内为这些客户提供服务，则必须进行详尽详细的审查和审批流程，涉及多个俄罗斯电信机构，甚至可能涉及\
  \ `FSB`（联邦安全局）。加密需要使用名为 `GOST` 的俄罗斯开发的加密算法，且所有加密硬件或软件必须事先获得当局批准。如果云软件无法使用不同的加密算法，并且硬编码了\
  \ `ASE` 或 `RSA` 等国际加密标准，这可能会成为问题。云解决方案本身必须在安全功能上进行检查，并创建特殊的运营和安全方案。在大多数情况下，需要联邦技术和出口控制局（`FSTEC`）的认证和批准。[图\
  \ 28.8] 解释了在云解决方案中使用 `FSTEC` 认证硬件和软件的三个基本步骤，从对解决方案及其所有组件进行安全和数据保护认证，到最后注册进入俄罗斯市场并获得所有必要的批准和许可证。\n\
  \n![图 28.8 FSTEC 认证与注册。](img/fig28.8.jpg)\n\n图 28.8 FSTEC 认证与注册。\n\n这一切对于获得俄罗斯许可证以允许销售是必要的。这产生了对合作伙伴的某种依赖，并限制了业务选择。此外，中国以其限制性的互联网使用政策闻名，这些政策也适用于云服务。\n\
  \n### 28.4.5 中国互联网与云提供商\n\n外国（例如，`美国` 或 `欧盟`）公司不允许自行销售或提供云服务。云提供商始终需要当地的互联网服务合作伙伴（例如中国）来进行销售和运营。这产生了对合作伙伴的某种依赖。最终，将中国云解决方案直接连接到现有的全球网络可能是不可行的，独立版本对于中国来说可能是更好的选择。\n\
  \n### 28.4.6 德国 BSI 与 IT-Grundschutz\n\n德国联邦信息安全局（德语缩写为 `BSI`）为政府机构和承包商定义了信息安全标准。它的角色与美国的\
  \ `NIST` 或英国的 `CESG` 类似。他们的专业知识领域专注于安全配置和操作的所有层；他们还帮助公民提出互联网安全措施。因此，他们就安全威胁和应对措施对公众和政府进行教育。他们的主要关注点是对政府\
  \ IT 系统的安全支持。另一个功能是定义 `IT-Grundschutzhandbuch`（IT 基本保护手册）。它是一个按安全领域和保护需求分组的基础安全措施（`Grundschutz`）目录。它包含了数百项与威胁和风险挂钩的单一措施。该目录定义了如基础设施、网络、应用程序和\
  \ IT 系统等模块，其中包含服务器机房、工作场所、`VPN`、Web 服务器等子主题。这些子模块包含了所有相关的风险和保护措施列表；因此，如果需要，你只需要查看保护你办公空间的安全措施。此外，所有措施和风险/威胁也被分组在各自的目录中（例如，组织措施与技术基础设施措施）并相互关联。[图\
  \ 28.9] 显示了这些安全模块或构建块，以及它们如何与保护措施和威胁目录相互作用，从而对网络等方面提供全面的 360 度视图。\n\n![图 28.9 IT-Grundschutz\
  \ 目录。](img/fig28.9.jpg)\n\n图 28.9 IT-Grundschutz 目录。\n\n\n\n\n需要采取的措施数量取决于政府数据的保护目标。例如，云服务提供商可以选择中等保护级别，并通过在相关模块中实施所有相关的安全措施来获得该级别的认证。`BSI`\
  \ 定义的 `IT-Grundschutz` 也坚持要求实施信息安全管理体系和风险管理流程。在这方面，它与 `ISO27001` 类似。`IT-Grundschutz`\
  \ 的认证和审计由 `BSI` 培训并批准的外部评估员执行。\n\n所有政府 IT 系统必须符合 `IT-Grundschutz`，但 `BSI` 也建议其他德国商业公司实施该标准以提高其安全水平。目前，对于想要向德国机构销售服务的云提供商而言，`IT-Grundschutz`\
  \ 认证并非强制性，只要这些提供商拥有类似 `ISO27001` 的认证，并能为其云的安全和可靠运行提供必要的保证。\n\n## 28.5 云服务提供商的风险与挑战\n\
  \n与政府或军事相关的业务通常被总结为公共部门客户群，也包括政府自身的承包公司，这些公司可能从事制造业，并为政府或军队交付产品或服务。一方面，公共部门是全球范围内巨大的市场，拥有许多销售尖端技术的机会。在许多国家，政府或军队愿意投入数十亿美元升级其\
  \ IT 基础设施，并投入到通过外包某些任务来减少政府或军事开支的服务中。在这里，云业务是一个潜在的解决方案。但另一方面，由于这些客户的高要求和特殊需求，提供商和\
  \ IT 合作伙伴必须意识到与政府或军事合同相关的重大风险和成本。`图 28.10` 显示了云提供商在进入特定国家的公共部门和政府市场之前必须面对的各种风险。\n\
  \n![图 28.10 云服务提供商的风险。](img/fig28.10.jpg)\n\n图 28.10 云服务提供商的风险。\n\n全球性的“一刀切”云解决方案可能不适用于这些客户群，因此云服务提供商必须专门为此业务建立并支持特殊的云解决方案。下一节将更详细地解释云提供商必须解决的风险和挑战。\n\
  \n### 28.5.1 云服务架构的潜在重新设计\n\n大多数云服务提供商为其解决方案使用全球架构或后端云服务设计。在全球范围内可能有本地实例或实现，以确保本地云交付以及将数据存储在特定区域（例如美国与欧盟）的选择，但云服务的基本原理特别是提供者的后端支持保持不变。提供商只能通过优化运营成本，从而使用全球工具和标准的硬件或软件解决方案，以低价格提供这些云解决方案。此外，网络设计以及各种组件的设置（如`防火墙`、`负载均衡器`、`入侵检测系统`、`虚拟机管理器`\
  \ 或如中央资产和配置管理（`CMDB`）之类的管理系统）都是集中的，或者至少基于全球范围内使用的通用设计模板。\n\n在许多国家，政府云实际上需要专门的部署，甚至是特殊的硬件和软件配置，这些可能与云解决方案的原始设计或后端云服务冲突。因此，提供商可能需要完全重新设计云架构的某些方面，以符合政府或军事标准，并允许托管或处理机密数据。云提供商必须分析当前设计与所需更改之间的差距，以确定修改后的解决方案是否与现有云架构足够相似，以便提供相同的服务水平甚至相同的价格。如果差距过大，政府云就不是现有云解决方案的变体，而实际上是云服务的全新实现。此外，“云”的优势可能会丢失，政府解决方案将变得更像传统的托管和外包合作。只有通过分析这种差距，云提供商才能判断对于公共部门客户是否存在一个合理的业务案例。\n\
  \n### 28.5.2 缺乏标准化\n\n政府特定云的另一个方面是国家之间缺乏标准化。最终，每个国家和政府都定义自己的需求和合规活动。当然，在通用需求（如需要强身份验证和权限配置文件或数据加密）方面有很多相似之处，但技术细节可能有所不同。因此，一个国家的加密算法可能是强制性的，而在另一个国家，相同的算法可能被拒绝用于政府。这给云提供商带来了巨大的工作，要么要支持并实施所有这些不同的安全措施和技术控制，要么根据需求按国家扩展这些需要的功能。它还引入了复杂性，因为云解决方案中的错误或失败现在可能针对特定的政府云实现。标准的修复可能对这些实现无效，需要特殊的支持模型。政府云将原有的全球云解决方案转换为一组并行的本地特定国家云，这些云需要完全独立地运营和支持。因此，需要一个针对此类本地云实现的专用团队，以便准备好必要的技能，并满足政府在这些特殊云的某些行政活动中仅使用当地公民的要求。云提供商必须找出全球支持网络和\
  \ 24/7 维护环境中哪些部分仍然可以使用，哪些部分需要复制为本地支持团队和隔离的本地行政基础设施。过去，全球设置可以从全球支持员工的专家知识中获益。现在，本地支持团队必须提升技能，能够处理几乎所有的技术问题，并掌握所有需要的专家知识。额外的人员和培训为这种政府云部署增加了大量工作量和成本。\n\
  \n### 28.5.3 政府云概念的可复用性有限\n\n\n\n\n\n政府与其需求之间缺乏标准化，也导致现有政府云概念和架构的重用性有限。为了满足所有当地的合规性需求，每个部署和云实现都需要针对不同的国家和地区从头开始。现有的政府批准的云实现应被视为国家秘密或至少是机密信息，不应作为其他国家的模板公开。因此，提供商在向全球其他政府客户解释或共享现有架构时也受到限制。类似于云提供商内部的“中国防火墙”概念，可能物理隔离这些地方政府或军事云的设计、开发、运营和支持团队。这为云提供商的业务增加了额外的紧张感复杂性。\n\
  \n### 28.5.4 政府干预导致控制权\n\n政府认证和合规性要求可能要求云提供商披露业务秘密或机密架构或源代码元素，以证明其实现没有后门或关键漏洞。这对云提供商的知识产权具有潜在影响，特别是当相关政府机构不够可靠时。向你自己的政府披露这些信息是一回事，但如果请求机构来自俄罗斯、中国、法国或澳大利亚，而云服务提供商是一家美国公司呢？或者一家需要向美国政府披露某些公司云秘密的欧洲云公司。欧洲客户会如何看待这种披露？因此，某些国家之间的紧张关系可能会影响云提供商的业务和客户群，被困在这些政府之间。一种解决方法是按国家分离这些业务，并尝试尽可能减少披露或依赖，这又导致可能创建一个相应的当地独立子公司，并产生更高的成本。\n\
  \n此外，云提供商可能担心相关政府的某些影响，从而限制了为其他客户或其他国家开展业务的能力。问题在于，政府或军事合同将在多大程度上限制或影响云业务以及云解决方案本身的整体设置和运行？这种来自政府法规的额外依赖为云服务提供商带来了风险。\n\
  \n### 28.5.5 未来认证或合规审计失败的风险\n\n政府认证和合规审计不仅要求在在上线或签署客户合同之前通过一次，整个解决方案和支持模型还需要定期进行重新认证。随着时间的推移，需求和基础政府标准可能会发生很大变化，并且必须在现有解决方案中实施，同时不破坏现有客户群和生产性云系统。这本身是一项挑战，但如果重新审计失败，情况更糟，因为可能导致运营和合规许可的撤销，从而危及整个业务。所有客户都会立即受到影响，并可能需要关闭。考虑到高昂的启动和初始认证成本，此类重新审计存在相当大的风险。此外，由于云提供商必须为多个国家执行此操作，问题变得更加严剧。这可能导致提供商在全年都处于审计状态。这使得有必要自动化和优化运营，使持续审计成为可能，但不会成为云团队的负担。\n\
  \n### 28.5.6 政治和制裁影响云业务\n\n最后但同样重要的是，参与政府合规要求对于想要销售到全球市场的云提供商来说也引入了对世界政治气候的一些依赖。政治议程可能会意外变化并影响云业务。例如，一个或多个国家对另一个国家新发布的制裁可能导致向制裁名单上的这些客户提供云服务变为非法。名单本身可能在\
  \ 24 小时内发生变化。这种做法的一个近期例子是由于乌克兰政治和活动对俄罗斯实施的制裁。欧盟或美国的云提供商可能会发现，服务此类俄罗斯公司并履行合同约定的服务水平面临挑战，如果政府某一天突然禁止与这些客户进行任何支持或业务。云提供商可能只能选择关闭受影响的云解决方案，因此可能成为惩罚和法律纠纷的目标。因此，建议尽早通过定义此类此类策略来应对这种风险，并相应地起草与客户的云服务合同条款。\n\
  \n### 28.5.7 成本和精力的大幅增加\n\n总体而言，通过在特殊硬件、软件、云架构和人员方面投入额外资金，可以缓解所有讨论的风险。必须尽早准确计算业务案例和额外成本，以确保云提供公司能够根据初始设置和后期运营成本评估收益和潜在收入。需要注意的是，增加的成本不仅适用于建立特定国家和符合政府要求的云解决方案的初始阶段，后期还适用于随后的日常运营和支持，因为这需要专业技能的当地员工，以及与商业和全球云设置并行的额外基础设施。云提供商内部的云开发团队还必须考虑，是否有需要为这种特殊的政府实现增加额外的代码行和云产品开发，该实现需要与主代码行并行维护。这将为开发和支持团队增加额外的成本和精力。\n\
  \n## 28.6 总结\n\n本章应该让人初步了解云解决方案在被用于政府数据之前，需要实现的各种政府需求和认证的复杂性和多样性。整个公共部门（包括军事或军事相关行业）对所有云提供商来说都是巨大的挑战，目前迫使他们实施特定国家的政府云实例，这些实例一方面与现有的商业云业务严格隔离，另一方面在外国使用或访问方面也受到限制。北约伙伴关系和国际条约最终并没有真正简化要求。如果云解决方案变成国家安全问题，每个国家和政府都希望对其政府数据保持独立性和严格控制。因此，预计短期内政府不会就此类公共部门云系统达成国际标准。每一个经过政府认证的云解决方案都会为云提供商带来巨大的成本和精力，这必须与潜在市场和收入进行权衡。只有少数云提供商能够负担起这样的投资，即使他们可能无法覆盖所有提到的国家。\n\
