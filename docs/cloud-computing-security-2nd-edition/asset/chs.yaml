  \n# III\n\n# 保护云基础设施\n\n# 第 10 章\n\n# 访问策略的规范与执行\n\nSabrina De Capitani\n米兰大学\n\n\
  Sara Foresti\n米兰大学\n\nPierangela Samarati\n米兰大学\n\n目录\n\n10.1 引言\n\n10.2 基于视图的访问控制\n\
  \n10.3 访问模式\n\n10.4 主权连接\n\n10.5 两对授权\n\n10.6 查询优化中的偏好\n\n10.7 多提供者的协作执行\n\n10.7.1\
  \ 场景与数据模型\n\n10.7.2 安全模型\n\n10.7.2.1 权限\n\n10.7.2.2 关系配置\n\n10.7.2.3 模式与视图图\n\n\
  10.7.3 授权视图\n\n10.7.4 安全查询计划\n\n10.8 用于启用多提供者查询的加密\n\n10.9 总结\n\n致谢\n\n参考文献\n\n\
  10.1 引言\n\n\n\n\n信息共享和数据传播是我们数字社会的基础。用户和公司都通过访问、传播并与其他方共享信息，以提供服务、执行分布式计算，或仅仅是让自己的信息可用。然而，这种传播和共享过程通常是选择性的，不同的参与可能仅授权查看数据的特定子集。数据交换和协作计算应受到控制，以确保授权得到适当执行，并确保信息不被不当访问、发布或泄露。例如，存储在某提供者处的医院患者数据可能只被选择性发布给特定的提供者（例如，与医院合作的研究机构），并处于特定的语境中（例如，出于研究目的）。这种情况需要定义一种策略规范和执行框架，以监管各方交互中的信息交换和访问。这一问题一直受到研究和开发社区的关注，并已经进行了多项调查，为新兴和分布式场景提出了新颖访问控制解决方案。特别是，人们重点关注了用于开放环境的强大灵活的授权语言和框架、策略组合技术、隐私增强型访问控制和身份管理解决方案、策略协商与信任管理策略、容错策略以及基于用户需求的方案选择，以及用于监管分布式多权威场景下查询执行的访问控制模型和策略（例如，`[6,7,9,14–19,27,30–32,42]]`）。其他工作处理了私密且安全的多方计算问题——即不同方执行协作计算学习，只有查询结果而对输入内容无处可见（例如，`[41]]`）。在本章中，我们关注这样一个场景：不同方（数据所有者或提供者）需要协作并共享信息，以执行具有数据选择性披露的分布式查询计算。简单起见，我们假设存储在每个提供者处的数据建模为关系表\
  \ `r(a [1],…,a [m])`，其中 `r` 是关系名称，`a [1],…,a [m]` 是其属性。在下文中，我们的示例引用一组四个不同的提供者，每个提供者存储一个关系（图\
  \ 10.1）：拥有关系 `Insurance` 的保险公司 `S [I]`、拥有关系 `Patient` 的医院 `S [P]`、拥有关系 `Treatment`\
  \ 的研究中心 `S [T]`，以及拥有关系 `Medicine` 的制药公司 `S [M]`。在这样的场景下，在确保信息不被不当泄露的情况下执行分布式查询计算的问题，可以转化为产生具有数据共享约束的查询计划的问题。传统的查询优化器通过下推选择和投影操作来优化查询计划，并为查询计划中的每个操作选择负责评估的提供者以及操作应如何执行（例如，它们决定采用何种连接评估算法和/或使用何种索引）。查询优化器没有考虑到所有者可能希望对其数据实施的可能共享限制。例如，医院可能希望保护患者疾病隐私，因此仅允许保险公司访问其客户的数据。在定义高效查询计划时，查询优化器还应该考虑访问权限，以确保查询评估不会导致本禁止的信息流。在本章的剩余部分中，我们将综述解决上述问题的现有方法。\n\
  \n![图 10.1 存储在四个不同提供者处的四个示例。](img/fig10.1.jpg)\n\n图 10.1 存储在四个不同提供者处的四个示例。\n\n*\
  \   **基于视图的访问控制**：在关系数据库范围内，有必要定义访问原始关系部分的授权。在 10.2 节中，我们描述了通过定义视图来解决此问题的方案，视图用于向用户授予访问权限，并在查询评估时执行这些权限。\n\
  *   **访问模式**：在许多场景下，数据源的能力可能有限；也就是说，只能根据某些模式指定给定属性的值来访问数据。在 10.3 节中，我们描述了与每个关系关联配置的方法，以跟踪应作为输入提供的以获取数据访问属性。\n\
  *   **主权连接（Sovereign join）**：当关系由不同方所有时，它们之间的连接操作评估可能会向负责评估的服务器以及拥有操作数的两个提供者泄露敏感信息。在\
  \ 10.4 节中，我们展示了一种连接评估策略，该策略不对评估连接的服务器揭示操作数或结果。\n*   **联盟网络**：在联盟网络中，不同方的目标是为了共享数据以提高查询效率，同时保护数据机密性。在\
  \ 10.5 节中，我们描述了一种基于定义成对授权以选择性监管数据发布的解决方案。\n*   **基于用户的限制**：除了提供者外，用户可能还希望在查询评估中定义隐私限制，以保护其查询相对于提供者的目标。在\
  \ 10.6 节中，我们展示了一种提议，允许用户对负责其查询评估的提供者指定偏好。\n*   **分布式查询评估中的授权组合与执行**：在数据发布具有选择性的分布式场景中，有必要定义一种简单但能保证各方不会不当访问数据的授权模型。在\
  \ 10.7 节中，我们描述了一种监管每个提供者对数据可见视图的授权模型，并展示了一种组合授权的方法。\n*   **通过加密实现分布式查询评估**：查询评估可以受益于提供竞争价格计算资源的外部云提供者，但这些提供者可能未授权访问明文数据。在\
  \ 10.8 节中，我们提出了一种区分三种可见性级别（例如：不可见、加密可见、明文可见）的授权模型，以允许第三方参与查询评估，并展示了一种通过动态调整数据可见性在查询执行中实施此类授权的方法。\n\
  \n\n\n\n\n在关系数据库上下文中，访问限制可以定义为视图，这些视图仅对底层关系的某些部分提供访问[29,35,38,39]]。授权视图代表了一种强大且灵活的机制，用于控制哪些信息可以被访问，并可以将传统关系视图与参数化视图区分来。\n\
  \n参数化视图（Parameterized view）在条件中使用输入参数（例如 `$user_id`、`time`）来根据执行上下文（例如执行访问的主体身份）可能改变受授权的数据子集。访问模式视图是参数化视图，其参数在访问时被限制为任何值。例如，图\
  \ 10.2(a–c)展示了针对图 10.1 中关系的三个授权视图。\n\n*   第一个视图（`AvgPremium`）是一个传统视图，授权发布每种保险类型的平均保费。\n\
  *   第二个视图（`MyData`）是一个参数化视图，允许每个用户访问其与 `Insurance` 相关的数据（变量 `$user_id`）。\n*   第三个视图（`Customers`）是一个访问模式视图，允许访问使用其活性成分作为输入（变量\
  \ `$values`）的药物的治疗方案（treatments）。\n\n基于视图的解决方案的主要缺点是，它强制请求者（即最终用户和提供者）了解并直接查询授权视图。为了克服这种局限性，较新的模型以授权透明的方式运行（例如[[35,38,39]]）。这些解决方案允许请求者在基础关系上构建查询。访问控制系统将负责检查此类查询应被允许还是拒绝。可以使用两种模型来确定查询\
  \ `q` 是否满足授予请求者的授权视图[29,38]]。\n\n![图 10.2 传统视图 (a)、参数化视图 (b)、访问模式视图 (c) 和有效查询 (d)\
  \ 的示例](img/fig10.2.jpg)\n\n图 10.2 传统视图 (a)、参数化视图 (b)、访问模式视图 (c) 和有效查询 (d) 的示例。\n\
  \n*   **Truman 模型**：对查询 `q` 进行重写，将原始关系替换为授权视图以及请求者有权访问的基础关系。这种重写旨在确保请求者不会获得其无法访问的信息。该解决方案的优点是它始终为请求者构建的每个查询提供答案。缺点是这种方法可能会返回误导性结果。例如，假设用户被授权访问视图\
  \ `MyData` 并提交了图 10.2(d)中的查询。在评估之前，查询被重构为“SELECT AVG(premium) FROM MyData”，这将返回用户的保费。用户随后会认为她的保费恰好等于保险公司所有客户的平均保费。\n\
  \n*   **非 Truman 模型**：查询 `q` 需要通过有效性检查，其目的是验证是否仅可以使用请求者可访问的授权视图和基础关系中包含的信息回答查询。如果查询有效，则按原样执行而不进行任何修改。否则，查询\
  \ `q` 被拒绝。为了检查其有效性，将查询 `q` 与请求者的授权视图进行比较。例如，图 10.2(d)中的查询对于图 10.2(a–c)中的授权视图是有效的。事实上，该查询可以在视图\
  \ `AvgPremium` 上进行评估。相反，查询“select AVG(premium) from Insurance join Patient on I.ssn=P.ssn\
  \ group by disease”是无效的。\n\n基于视图的访问控制解决方案已为集中化场景开发，但它们也可以适应于分布式数据库系统。然而，由于涉及的提供者多样化（其视图大量且动态变化），基于视图的访问控制方法接近访问的极限——因此需要为每个可能的访问显式定义视图。这一方面在组织间频繁协作且提供者访问限制具有高度异质性的场景中至关重要。\n\
  \n## 10.3 访问模式\n\n在许多场景中，通过提供某些属性的值来访问数据源。这些值被用于正确限制查询结果。例如，为了访问网络上的数据，用户通常需要填写包含强制字段的表单。提供者随后根据表单的内容限制返回的数据。另一个例子是，研究中心只有在提供药物标识符的情况下，才与制药公司共享测试结果。访问模式[26]被用于正式定义此类访问限制，这些限制必须由查询引擎正确执行。分布式数据库中的每个关系模式\
  \ `r(a[1],...a[m])` 随后被分配一个访问模式 `α`，它是对应每个属性的符号字符串，正式定义如下。\n\n### 定义 10.1：访问模式\n\
  \n*   给定基于关系模式 `r(a[1],...a[m])` 的关系 `r`，与 `r` 的访问模式 `α`（记作 `r^α`）是一个由 m 个符号组成的序列\n\
  \n如果访问模式的第 j 个符号为 `i`，则关系模式中的第 j 个属性 `a[j]` 称为输入属性；否则，它是输出属性。输入属性是指为访问 `r` 中的子集而必须作为输入的属性。输出属性对于数据访问不受限制。（注意，输入属性和输出属性也可以分别称为边界属性和自由属性，分别标记为\
  \ `b` 和 `f`）。图 10.3 展示了针对图 10.1 中关系定义的访问模式示例，例如，`Insurance^(ioo)(ssn, type, premium)`\
  \ 表示必须提供客户的 `ssn` 作为输入以访问其保险合同的 `type` 和 `premium`。\n\n![图 10.3 访问模式的示例](img/fig10.3.jpg)\n\
  \n图 10.3 访问模式的示例。\n\n访问模式的存在可能会增加查询评估的复杂度。事实上，在访问限制下执行查询 `q` 可能需要递归查询计划，其中从关系（假设为\
  \ `r[y]`）中提取的值（甚至可能在查询本身中未显式提到）必须被用于访问 `q` 中的另一个关系（假设为 `r[x]`）。显然，关系 `r[x]` 和 `r[y]`\
  \ 的模式必须包含相同域的属性（例如连接属性）。例如，参考图 10.3 中的访问模式，`Treatment` 关系中属性 `ssn` 的投影结果可以作为 `Insurance`\
  \ 关系的输入，以获取接受治疗患者的方案。\n\n\n\n\n\n对由访问模式建模的访问限制进行强制执行需要对传统的查询评估策略进行修订。事实上，经典的解决方案没有考虑到查询计划可能需要递归运行这一事实。\n\
  \n大多数用于带有访问模式的查询计划定义的解决方案考虑了交集查询（例如，[3,8,20,26,28,34,36]),），即仅包含选择、投影和连接操作的查询，旨在识别满足查询输入给定值所隐含的所有条件的元组。一种有效的（尽管未优化的）确定满足所有访问限制的查询计划按照以下三个步骤操作：\n\
  \n*   使用 `q` 中的常量值初始化常量值集合 `B`，并将本地缓存初始化为空集。\n*   根据其访问模式，使用 `B` 中的值迭代地访问关系，并对于每个被访问的关系，使用获取的元组更新缓存，同时用相应的值更新\
  \ `B`。\n*   在本地缓存的元组上评估查询 `q`。\n\n例如，考虑图 10.4 中的查询 `q` 和图 10.3 中的访问模式。条件 `M.principle=\"\
  paracetamol\"` 为访问关系 `Medicine` 中的元组提供了所需的输入值，并提取出包含此种活性成分的药物的标识符列表 `mid`。此 `mid`\
  \ 值列表反过来又可以作为访问关系 `Treatment` 中感兴趣的元组的输入，这些元组包括使用这些药物治疗的患者的 `ssn`。`ssn` 值列表配合属性\
  \ `disease` 的值 `\"flu\"`，最终允许访问关系 `Patient` 中的元组，这些元组对应于查询 `q` 的结果。上述方法随后通过考虑例如运行时优化技术得到了增强。\n\
  \n![图 10.4 图 10.1 中关系查询的示例，查询计划的生成和完整性约束（例如，[2,3,5,8,20,28,36]）。](Images/fig10.4.jpg)\n\
  \n图 10.4 图 10.1 中关系查询的示例，查询计划的生成和完整性约束（例如，[2,3,5,8,20,28,36])。\n\n## 10.4 主权连接\n\
  \n在操作由不同提供者拥有的所有关系时，最可能向非授权主体泄露敏感信息的操作是连接，它结合了不同关系的元组。事实上，两个关系 `r[x]` 和 `r[y]` 之间连接的评估会向评估连接的服务器\
  \ `S` 暴露两个操作数的内容。然而，在许多情况下，参与连接操作的关系内容应该保持保密，即使连接结果可能会披露给提交查询的请求者。例如，假设我们需要提取关于药物对患者的随年龄增长的副作用的信息；通过这种方式，医院和进行实验的研究中心都希望（或受法律强制）保持自己的数据私密性。主权连接\
  \ [1] 已被提出作为一种连接评估策略，旨在解决这一隐私问题，允许在评估连接操作时不向负责连接计算的服务器暴露操作数，假设该服务器不是操作数所有者中的任何一个。主权连接的目标评估连接操作\
  \ `r[x] ⋈J r[y]`（其中 `J` 是任意连接条件），其方式使得：(i) 只有请求连接的一方可以访问连接结果；以及 (ii) 任何其他方都不应能够学习\
  \ `r[x]`、`r[y]` 和 `r[x] ⋈J r[y]` 的内容。主权连接解决方案依赖于位于服务器 `S` 的安全协处理器，它是系统唯一受信任的组件。安全协处理器可以访问\
  \ `r[x]`、`r[y]` 和连接结果。\n\n为了防止未经授权方访问 `r[x]`、`r[y]` 和连接结果的内容，应该仔细地执行连接评估。请注意，即使服务器拥有安全协处理器，连接操作数也无法完全加载到内存中。事实上，安全协处理器的资源有限，特别是内存有限。因此，连接评估算法应保证，协处理器与\
  \ S 之间交互的任何观察都不会泄露关于连接操作数的任何信息。例如，考虑以下对连接嵌套循环算法的简单改进。S 分别从 `P[x]` 和 `P[y]` 接收 `r[x]`\
  \ 和 `r[y]` 的加密版本。协处理器迭代地从 `r[x]` 中读取一个加密元组并对其解密，得到 `t[x]`。对于每个元组 `t[x]`，协处理器迭代地读取\
  \ `r[y]` 中的每个元组，对其解密以获得 `t[y]`，并检查它是否与 `t[x]` 匹配。如果元组 `t[x]` 和 `t[y]` 连接，协处理器对对\
  \ `<t[x], t[y]>` 进行加密并将生成的密文写入连接结果。然后它处理 `r[y]` 中的下一个元组。当 `r[x]` 和 `r[y]` 中的所有元组对都经过协处理器评估后，连接评估结束。通过观察读取和写入操作的序列，S（以及任何观察者）可以推断出\
  \ `r[x]` 中的哪些加密元组与 `r[y]` 中的哪些加密元组连接。为了保证满足这两个属性，主权连接解决方案采用了嵌套循环算法的变体。这种连接计算策略消耗\
  \ CPU 周期以保持固定的计算时间，并依赖伪装（即假元组）来保持连接结果固定的大小。算法被设计为：如果输入元组 `t[x]` 和 `t[y]` 满足连接条件，则返回加密的连接元组，否则返回相同的加密伪装。由于伪装与原始元组无法区分，服务器\
  \ S 无法得出任何推理。\n\n\n\n# 引言\n\n不同实体之间需要交换和共享数据的新场景由联盟网络（coalition networks）表示。联盟网络是一个分布式系统，其特征是一组希望协作并共享数据以实现共同目标的提供者（例如，联盟网络通常结合为了军事、科学或应急目的而合作的组织）[43,44]。联盟网络中的每个提供者\
  \ `P` 拥有一个或多个关系，以及用于计算和数据存储的一个或多个服务器。提供者的服务器被称为“伙伴”（buddies），并且通常共享相同的权限。\n\n联盟网络传统上建模为无向图\
  \ `G(N,E)`，表示服务器之间相应的覆盖网络。联盟网络中的每个服务器由 `N` 中的一个节点表示，服务器之间的连接由 `E` 中的加权边表示，其中边 `(S\
  \ [i],S [j])` 的权重表示在服务器 `S [i]` 和 `S [j]` 之间传输数据单元的成本。图 10.5(a)展示了一个加权图的示例，该图表示存储图\
  \ 10.1 中关系的服务器与另一个不存储任何关系且是 `S [P]` 伙伴的额外服务器 `S [Q]` 之间的覆盖网络。\n\n![图 10.5 联盟网络建模示例\
  \ (a) 及其两对授权 (b)。](img/fig10.5.jpg)\n\n图 10.5 联盟网络建模示例 (a) 及其两对授权 (b)。\n\n# 查询优化与访问控制\n\
  \n给定一个查询 `q`，查询优化器的目标是最小化参与查询评估的服务器之间的数据传输成本。例如，考虑一个需要连接关系 `Patient`（存储在 `S [P]`\
  \ 上）、`Treatment`（存储在 `S [T]` 上）和 `Medicine`（存储在 `S [M]` 上）的查询。最小化数据传输成本的计划将在服务器\
  \ `S [P]` 上评估连接操作。事实上，存储 `Treatment` 的 `S [T]` 与存储 `Medicine` 的 `S [M]` 之间的最短路径通过了存储\
  \ `Patient` 的 `S [P]`。\n\n然而，该计划可能意味着未经授权的数据发布。事实上，在联盟网络并非所有服务器都能执行查询计划中的所有操作。调节联盟网络数据访问的访问控制模型必须让数据所有者能够：\n\
  (i) 对其数据集的不同部分进行授权；\n(ii) 对谁可以访问其数据保持完全且自主的控制；以及\n(iii) 定义在元组级上的访问控制限制。两对授权（pairwise\
  \ authorizations）满足了所有这些要求，其正式定义如下 [43]。\n\n## 定义 10.2：两对授权\n\n给定两个提供者 `P [i]` 和\
  \ `P [j]` 以及由 `P [i]` 拥有的关系 `r [i]`，由 `P [i]` 对 `r [i]` 定义的两对授权如下形式的规则：\n\n`P [i]\
  \ !!!rx^(\\=)!^σ(ri!) !→ P [j]`，其中 `r [x]` 是满足选择条件的 `r [i]` 元组子集。\n\n两对授权 `P [i]\
  \ !!!rx^(\\=)!^σ(ri!) !→ P [j]` 允许 `S [j]` 访问满足条件的 `r [i]` 子集。注意，`P [i] !!!rx^(\\\
  =)!^σ(ri!) !→ P [j]` 意味着 `S [j]` 被授权：(i) 访问数据集的不同部分；(ii) 对谁可以访问其数据保持完全且自主的控制；以及\
  \ (iii) 定义在元组级上的访问控制限制。\n\n# 连接策略\n\n给定一个查询 `q`、联盟网络 `G(N,E)` 和一组两对授权，选择最小化数据传输的策略至关重要。在我们总结了四种可以用于连接的策略（参见图\
  \ 10.6 了解有关在每个服务器上执行的操作的详情）。为了具体，我们考虑服务器 `S [Q]` 需要的连接 `r [x] ⋈[=] r [y]`，其中 `r\
  \ [x]` 和 `r [y]` 分别存储在 `S [x]` 和 `S [y]` 上。\n\n![图 10.6 不同连接策略的工作原理。](img/fig10.6.jpg)\n\
  \n图 10.6 不同连接策略的工作原理。\n\n*   **代理连接 (Broker-join)**：`S [x]` 和 `S [y]` 都将其关系发送到 `S\
  \ [Q]`，由 `S [Q]` 计算连接结果。这种方法可以取决于 `S [x]`、`S [Q]` 和 `S [y]` 是否为伙伴而独立应用。\n*   **对等连接\
  \ (Peer-join)**：服务器 `S [y]` 将关系 `r [y]` 发送到 `S [x]`，由 `S [x]` 计算连接并将结果发送到 `S [Q]`。当\
  \ `S [x]` 和 `S [Q]` 是伙伴而 `S [y]` 不是时，这种方法效果良好。\n*   **半连接 (Semi-join)**：服务器 `S [x]`\
  \ 和 `S [y]` 交互以计算连接结果，操作分为四个步骤。假设 `S [x]` 作为主节点，它首先将关系 `r [x]` 连接属性的投影发送到 `S [y]`。作为第二步，`S\
  \ [y]` 计算从 `S [x]` 接收的关系与 `r [y]` 的连接，并将结果传回给 `S [x]`。第三步，`S [x]` 计算接收到的关系与 `r [x]`\
  \ 的连接，得到连接结果。第四步，`S [x]` 将连接结果发送到 `S [Q]`。\n\n\n\n\n\n-   拆分连接（Split-join）：令 `r\
  \ [x1]` 为 `r [x]` 中服务器 `S [y]` 可以访问的元组集，`r [y1]` 为 `r [y]` 中服务器 `S [x]` 可以访问的元组集。为了评估\
  \ `r [x]` 和 `r [y]` 之间的连接，该操作重写为三个连接的并集：`(r [x] ⋈ax[\\= [ay] r [y1]) ∪ (r [x1] ⋈ax[\\\
  = [ay] r [y2]) ∪ (r [x2] ⋈ax[\\= [ay] r [y2])`，其中 `r [x2]` 为 `r [x]` 中 `S [y]` 无法访问的元组集，`r\
  \ [y2]` 为 `r [y]` 中 `S [x]` 无法访问的元组集。连接结果的计算分三个步骤：首先，`S [x]` 和 `S [y]` 将 `r [x]\
  \ ⋈ax[\\= [ay] r [y1]` 作为对等连接（peer-join）计算，由 `S [x]` 作为主节点；其次，`S [x]` 和 `S [y]`\
  \ 将 `r [x1] ⋈ax[\\= [ay] r [y2]` 作为对等连接计算，由 `S [y]` 作为主节点；最后，`S [Q]` 与 `S [x]` 和\
  \ `S [y]` 协作，作为评估 `r [x2] ⋈ax[\\= [ay] r [y2]` 的代理连接（broker join）的主节点，并计算这三个部分结果的并集。这种方法可以根据\
  \ `S [x]`、`S [y]` 和 `S [Q]` 是否为伙伴关系而独立应用。此外，它也适用于 `S [x]`、`S [y]` 和 `S [Q]` 属于三个不同提供者的场景。\n\
  \n例如，考虑图 10.5(b)中的两两对授权以及图 10.4 中的查询。图 10.7(a)展示了该查询的一个安全查询计划，该计划表示为树形，其中叶子节点是 FROM\
  \ 子句中的关系，每个非叶子节点对应一个关系操作符。在图中，每个操作担任主节点的服务器记录在每个节点的侧边。树中最深层的连接被评估为拆分连接，而另一个连接被评估为对等连接。在每个服务器上评估的操作及相应的信息流详见图\
  \ 10.7(b)。\n\n![图 10.7 这是图 10.4 (a) 所示查询的一个安全查询树计划示例以及相应的信息流 (b)。node_descriptor\
  \ 用于标识条件所适的查询部分，并代表查询树计划中的一个节点。node_descriptor 是一个形式为 <operation, parameters, master>\
  \ 的三元组，其中 operation 是查询计划中节点所表示的操作，parameters 是其输入参数，master 是负责其评估的提供者。节点描述符中三个组件中的每一个一个都可能包含一个自由变量（用符号\
  \ @ 表示）或通配符 *（代表对应元素的任何可能值）。REQUIRING 或 PREFERRING 子句中的条件对 node_descriptor 中出现的自由变量的值施加限制。例如，节点描述符\
  \ <*, {(Treatment.ssn)}, @p> 指由任意提供者 @p 对关系 Treatment 中的属性 ssn 进行任何操作。条件 @p <> S\
  \ P 意味着 Hospital 不能对接受治疗的患者的 ssn 属性进行操作。](img/fig10.7.jpg)\n\n\n\n\n\n给定一个包含 `REQUIRING`\
  \ 和/或 `PREFERRING` 子句的查询 `q`，相应的查询计划必须满足 `REQUIRING` 子句中的所有强制条件，并最大化 `PREFERRING`\
  \ 子句中条件的偏好。为了实现这一目标[24] 方法建议修改传统的查询优化器。该解决方案采用自底向上的动态规划方法，在每次迭代中迭代构建一个包含查询中更大关系子集的安全查询树计划。图\
  \ 10.8(b)展示了针对图 10.8(a)中查询的执行查询树计划。我们注意到：(i) 树中最深层的连接只能由 `S [T]` 执行，因为 `S [M]` 无法在属性\
  \ `mid` 上操作（如 `q` 中 `REQUIRING` 子句的要求）；(ii) 另一个连接操作只能由 `S [T]` 执行，因为 `S [P]` 无法在属性\
  \ `ssn` 上操作（如 `q` 中 `REQUIRING` 子句的要求）。\n\n## 10.7 多提供者的协作查询执行\n\n协作分布式系统支持分布式查询的评估，这些查询可能需要选择性地共享由不同方存储和管理的数据。在这种情况下，正确定义和执行访问权限以确保数据不被不当访问和共享，是大型分布式系统有效协作和集成的关键点（例如，[11–13,33,40]）。在本节中，我们介绍了一种一种在存在访问限制的情况下进行协作分布式查询执行的方法[11–13]]。\n\
  \n### 10.7.1 场景与数据模型\n\n给定一组协作提供者，假设它们存储的所有关系集合（用 `R`）是无环且无损的。无环性意味着跨越任何关系子集的连接路径是唯一的。无损意味着关系之间的连接只会产生正确的信息。在实例级别，每个关系\
  \ `r` 都是元组的有限集合，其中每个元组 `t` 是一个将属性映射到其域中值的函数，而 `t[A]` 表示 `t` 中属性集合 `A` 的映射。每个关系 `r`\
  \ 都有一个主键和一组外键完整性约束。关系 `r(a [1],….,a [m])` 的主键 `K` 是 `{a [1],….,a [m]}` 中属性的子集，能够唯一标识\
  \ `r` 的元组，这意味着在 `K[i]` 上存在函数依赖 `F[j]`。\n\n不同关系的元组可以通过连接进行组合。符号 `I` 表示所有连接的集合。特别是，所考虑的方法关注自然连接，其连接条件形如\
  \ `a[x]=a[y]`，其中 `a[x]` 是左操作数的属性，而 `a[y]` 是右操作数的属性。连接符号 `J` 将表示为元对 `<A[x],A[y]>`，其中\
  \ `A[x]` (A[y]) 分别是参与连接的 `r[x]` (r[y]) 的属性。符号 `J` 表示 `R` 之间引用完整性约束的集合。图 10.9 是引用完整性约束和连接的一个示例，它阐述了定义在图\
  \ 10.1 之上的引用完整性约束和连接的示例（为了可读性，这些内容在图中列出）。组合属于两个以上关系的元组的操作序列被称为连接路径，其正式定义如下。\n\n\
  定义 10.3：连接路径\n*   给定一个关系序列 `r[1],…r[n]`，其上的连接路径表示为 `joinpath(r[1],…r[n])`，是 `n –\
  \ 1` 个连接 `J[1],…J[n–1]` 的序列，使得对于 `∀i=1,…n–1, J[i]=<A[k],A[i]> ∈(J[∪] I)`，其中 `A[k]`\
  \ 是 `J[k]` 中的属性（k<i），且 `A[i]` 是关系 `r[i]` 的属性。\n\n### 10.7.2 安全模型\n\n调节分布式系统中数据访问的安全模型依赖于权限的定义（规定哪个方可以访问数据集的哪个部分）以及关系轮面（代表关系的内容信息）。在本节的后续部分，我们将介绍权限、关系轮面及其图形化表示。\n\
  \n#### 10.7.2.1 权限\n\n权限定义了给定主体可以访问的数据视图，其正式定义如下。\n\n定义 10.4：权限\n*   权限是一种形如 `[A,R]®P`\
  \ 的规则，其中 `A` 是属于一个或多个关系的属性集合，`R` 是关系集合，使得对于 `A` 中的每个属性，`R` 中都有包含它的关系，而 `P` 是权限的主体。\n\
  \n\n\n\n\n权限 `[A,R]®P` 规定提供者 `P`（以及其授权范围内的任何服务器或用户）可以查看属性集合 `A` 上的元组，这些属性属于关系 `R`\
  \ 中关系之间连接操作的结果。由于关系集合 `R` 是无环的，因此 `R` 中关系之间的连接操作是唯一的。请注意，集合 `A` 中仅出现属性名称，而它们所属的关系则在\
  \ `R` 中被指明。这也适用于出现在多个关系中的属性，这与这些属性代表现实世界中相同实体的事实是一致的。图 10.10 展示了图 10.9 中关系的一组权限。需要注意的是，虽然权限集合\
  \ `R` 中存在某个关系可能意味着释放了更少的元组（仅释放符合连接条件的元组），但它并不意味着释放了更少的信息。事实上，被权限 `[A,R]®P` 授权释放的元组隐含地提供了关于它们满足连接路径\
  \ `joinpath(R)` 的信息，这意味着它们匹配其他关系的元组。例如，图 10.10 中的权限 `p` [5] 允许 Alice 访问用于治疗患者的某些药物的标识符和授权日期。只有当存在从\
  \ `R` 中关系的外键指向 `r` 中属性的引用完整性约束（referential integrity constraint）时，在关系集合 `R` 中包含关系\
  \ `r` 才不会披露任何额外信息。例如，图 10.10 和 a 中的权限 `p` [2] 以及具有相同属性集合和关系集合 `(Treatment, Patient)`\
  \ 的 `p` [2] 允许 Alice 访问与 `p` [2] 相同的信息。还要注意，关系集合 `R` 可能包含不具有 `A` 中任何属性的关系。这可能发生在需要某个关系来：(i)\
  \ 在属于不同关系的元组之间建立正确的关联（连通性约束）；或 (ii) 将 `A` 中属性的值限制为仅出现在可与此类关系关联的元组中的值。例如，权限 `p` [3]\
  \ 包含关系 `Treatment`，它仅用于正确关联 `Patient` 中的元组与 `Medicine` 中的元组，而权限 `p` [5] 包含关系 `Treatment`，它仅用于限制有关释放药物的信息。\n\
  \n![图 10.10 图 10.1 中关系权限的示例。](img/fig10.10.jpg)\n\n图 10.10 图 10.1 中关系权限的示例。\n\n\
  #### 10.7.2.2 关系剖面](#chapter10.xhtml#re_ch-10-sec-11)\n\n基础或派生（即通过查询计算）关系 `r` 的关系剖面（relation\
  \ profile）刻画了它的信息内容，对于确定提供者是否可以访问该关系是必要的。关系 `r` 的剖是一个三元组 `[r^p,r⋈,r^s]`，其中 `r^p`\
  \ 是 `r` 中的属性集合，`r⋈` 是用于定义/构建 `r` 的关系集合，而 `r^s` 是涉及 `r` 定义/构建中选择选择的属性集合。直觉上，关系剖面\
  \ `[r^p,r⋈,r^s]` 的含义是基础或派生关系 `r` 带来了关于连接关系集合 `r⋈` 中出现的 `r^p∪r^s` 属性的信息。例如，图 10.4\
  \ 中查询结果导致的关系剖面为 `[(ssn, name, dob), (Patient, Treatment, Medicine), (principle,\
  \ disease)]`。\n\n#### 10.7.2.3 模式与视图图](#chapter10.xhtml#re_ch-10-sec-12)\n\n关系集合\
  \ `R` 可以通过模式图（schema graph）表示，模式图是一种混合图，其中为 `R` 中关系的每个属性提供一个节点，为 `J` 中的每个连接提供一个非无向弧，为\
  \ `I` 中的每个引用完整性约束提供一个有向弧，以及关系的主键与其非主键属性之间的函数依赖关系。图 10.11(a) 展示了表示图 10.9 中关系、引用完整性约束和连接的模式图。\n\
  \n![图 10.11 图 10.9 (a) 中关系的模式图 (a) 以及图 10.10 (b) 中权限的视图图；以及图 10.9 中的关系、引用完整性约束和连接。图部分\
  \ (b–f) 展示了对应于图 10.10 中权限的视图图。](img/fig10.11.jpg)\n\n图 10.11 图 10.9 (a) 中关系的模式图\
  \ (a) 以及图 10.10 (b) 中权限的视图图；以及图 10.9 中的关系、引用完整性约束和连接。图 (b–f) 展示了对应于图 10.10 中权限的视图图。\n\
  \n每个权限 `[A,R]®P` 和每个关系剖面 `[r^p,r⋈,r^s]` 都被视为关于 `R` 的视图，该视图被建模为 `[Attr, Rel]`，其中\
  \ `Attr` 对应于权限/剖面（即 `r^p∪r^s`）中的属性，而 `Rel` 对应于权限/剖面（即 `R/r⋈`）。在视图的刻画中，我们考虑了这样一个事实：关系集合\
  \ `Rel` 可以通过插入从已在 `Rel` 中的关系可的关系来扩展，而无需添加信息。给定关系集合 `R`，我们用 `R*` 表示通过引用完整性约束集合 `I`\
  \ 闭的关系集合。例如，`{Treatment}` 的闭是 `{Treatment, Patient, Medicine}`。事实上，`Treatment` 中属性\
  \ `ssn` 的所有值也出现在 `Patient` 中；同样，`Treatment` 中属性 `mid` 的所有值也出现在 `Medicine` 中。\n\n\
  视图 `V=[Attr, Rel]` 可以通过视图图 `G[V]` 图形化表示，对模式图进行着色：白色、黑色和透明色。染色根据以下规则进行[11]：(i) 所有出现在\
  \ `Attr` 中的节点以及所有属于 `joinpath(Rel*)` 或从 `Rel*` 中的关系键指向 `Attr∪joinpath(Rel*)` 中属性的弧均为黑色；(ii)\
  \ 所有属于 `Rel*` 但不是黑色的节点以及从 `Rel*` 中的关系键指向其不属于 `Attr` 也不在 `joinpath(Rel*)` 中的属性的弧均为白色；(iii)\
  \ 剩余的节点和弧为透明色。图 10.11(b–f) 展示了对应于图 10.10 中权限的视图图。在图中，黑色节点和弧由填充节点和粗线表示，白色节点和弧由连续节点和实线表示，透明节点和弧由虚线节点和虚线表示。\n\
  \n### 10.7.3 授权视图](#chapter10.xhtml#re_ch-10-sec-13)\n\n\n\n\n给定一个主体及其权限集 `P`，当关系所直接或间接传达的信息包含在某项权限中时，向该主体发布基关系或派生关系的操作是经过授权的。（在接后的讨论中，我们指的是特定主体的权限，因此省略了主体部分）。\n\
  \n通过查询 `q` 计算出的关系 `r` 可能引起的间接信息释放与：\n(i) 在 `WHERE` 子句中使用的但未出现在 `q` 的 `SELECT` 子句中的属性（即未出现在\
  \ `r` 中的属性）有关，这些属性被关系轮面 `(r^s)` 捕获了；以及 (ii) `q` 中存在限制其元组集合的连接条件。\n\n权限 `p=[A,R]`\
  \ 授权关系 `r` 的释放，当且仅当 `p` 包含以下内容时：\n(i) 至少包含所有直接或间接属于 `r` 的属性（即 `(r^p∪r^s) ⊆ A`）；以及\
  \ (ii) 包含且仅包含用于确定 `r` 的所有所有连接条件（即 `R* = r⋈*`）。\n\n注意，连接集合（扩展到考虑与引用完整性约束对应的连接）对于授权权限和被授权的关系必须完全相同。这保证了\
  \ `p` 和 `r` 指向相同的元组集合（即属于连接结果的元组）。\n\n例如，考虑图 10.10 中的权限集，假设 Alice 提交了一个用于检索所有患者姓名的查询。权限\
  \ `p` [1] 授权了该查询的执行。从视图图的角度来看，这等于于：派生关系的视图图 `G[r]` 与权限的视图图 `G[p1]` 在不同关系的属性之间具有完全相同的黑色弧，且查询视图图中所有为黑色的节点在权限视图图中也同样为黑色。\n\
  \n注意，虽然某个主体可能没有单一的权限 `p` 来授权关系 `r` 的发布，但她可能通过连接其他已授权的关系来计算 `r`。例如，考虑查询 `SELECT name\
  \ FROM Patient JOIN Insurance ON Patient.ssn=Insurance.ssn`。即使图 10.10 中没有权限授权 Alice\
  \ 执行此查询，此类查询也没有提供任何她无法访问的信息（Alice 可以对 `Patient` 和 `Insurance` 分别执行两个查询，并仍然可以对它们的结果进行连接）。\n\
  \n因此，只要有授权关系 `r` 发布的权限或其组合，就应该允许关系 `r` 的发布。然而，权限的组合必须仔细执行，以避免组合权限授权了原始权限未授权的发布。特别是，两个权限\
  \ `p[i]=[A[i],R[i]]` 和 `p[j]=[A[j],R[j]]` 可以进行组合，当且仅当在 `R` 之上的两个对应视图之间的连接是无损的（即连接产生的结果相对于\
  \ `R` 而言是正确的），这意味着（在我们的情景中）交集 `A[i] ∩ A[j]` 中的属性构成了其中一个视图的键。\n\n例如，图 10.10 中的权限\
  \ `p[1]` 和 `p[4]` 可以进行组合，因为公共属性 `ssn` 是关系 `Patient` 的键（也是关系 `Insurance` 的键）。相反，`p[1]`\
  \ 和 `p[3]` 无法组合，因为 `name` 不是这两个权限对应视图的键。从视图图的角度来看，两个权限 `p[i]` 和 `p[j]` 可以进行组合，当且仅当存在一条黑色边路径，从在\
  \ `G[pi]` 和 `G[pj]` 中均为黑色的节点 `n` 连接到 `G[pi]` 中的每个黑色节点（或连接到 `G[pj]` 中的每个黑色节点）。\n\n\
  两个权限 `p[i]=[A[i],R[i]]` 和 `p[j]=[A[j],R[j]]` 的组合是一个新权限 `p[i] ⊗ p[j] = [A[i] ∪ A[j],\
  \ R[i] ∪R[j]]`。图 10.12 展示了由图 10.10 中权限组合后产生的一些权限。注意，权限 `p[i] ⊗ p[j]` 随后可能与另一个权限\
  \ `p[k]` 组合，而该权限既不能与 `p[i]` 组合，也不能与 `p[j]` 组合。\n\n符号 `P^⊗` 表示 `P` 关于组合操作的闭包。例如，图\
  \ 10.10 中权限的闭包为 `P^⊗ = {p[1], p[2], p[3], p[4], p[5], p[1]⊗ p[2], p[1]⊗ p[4], p[2]⊗p[4],\
  \ p[2]⊗ p[5], p[1]⊗ p [2]⊗ p [4], p[1]⊗p [2]⊗p[5], p [1]⊗p [2]⊗ p [4]⊗p [5]}`。给定主体的权限集\
  \ `P`，如果存在 `P^⊗` 中的权限 `p` 授权了 `r`，则该主体被授权发布 `r`。[11] 提出了一种高效算法，用于验证一个关系是否被授权，而无需计算所有权限组合。\n\
  \n![图 10.12 是组合权限的示例，其中 (a–f) 展示了由图 10.10 中权限组合产生的一些权限。](img/fig10.12.jpg)\n\n###\
  \ 10.7.4 安全查询计划\n\n对于查询 `q` 的查询树计划，需要将每个操作分配给负责执行的服务器。这种分配应该是安全的，这意味着该服务器应该被授权执行相应的操作。由于每个服务器都有权查看其持有的关系，因此所有元操作（即选择和投影）都可以由持有关系的服务器执行。\n\
  \n连接操作则需要连接关系的服务器之间协作。给定连接操作 `r[x] ⋈J r[y]`，其中 `r[x]` 是服务器 `S[x]` 的关系，`r[y]` 是服务器\
  \ `S[y]` 的关系，连接可以作为常规连接或半连接执行。常规连接意味着从机将其关系发送给主服务器，然后由主服务器计算连接。半连接意味着主服务器将其关系在连接属性上的投影发送给从机，由从机与其关系计算连接。然后从机将此类操作的结果返回给主服务器，由后者计算最终结果。表\
  \ 10.1 总结了执行关系操作期间发生的数据交换，以及每次交换时的关系轮面。在表中，我们在每个操作之前报告执行该操作的服务器 `S[i]`。列 `[m,s]`\
  \ 以对的形式报告分配，第一个元素是作为主服务器的服务器，第二个元素是作为从机的服务器。对于应用于关系 `r` 的一元操作，主服务器是存储关系 `r` 的服务器，从机为\
  \ NULL。\n\n\n\n\n例如，考虑图 10.13 中的额外权限，并假设 Alice 在图 10.4 中提交查询 `q`。`[12]`中提出的用于计算安全分配的算法首先验证\
  \ Alice 是否有权访问 `q` 产生的关系配置（relation profile）。在这种情况下，显而易见 `q` 的配置 `[(ssn, name, dob),\
  \ (Patient, Treatment, Medicine), (principle, disease)]` 是由 `p` 产生的权限 [1]⊗`p` [2]\
  \ = `[(ssn, name, dob, disease, mid, date, results), (Patient, Treatment, Medicine)]`\
  \ 授权的。然后，该算法为查询树计划中出现的所有操作确定一个安全分配。图 10.14 展示了与相应查询树计划中的每个节点关联的关系配置，以及相应的安全执行器分配。\n\
  \n![图 10.13 图 10.9 中关系权限的示例。](img/fig10.13.jpg)\n\n图 10.13 图 10.9 中关系权限的示例。\n\n\
  ![图 10.14 图 10.4 中查询的安全分配示例。](img/fig10.14.jpg)\n\n图 10.14 图 10.4 中查询的安全分配示例。\n\n\
  ### 10.8 用于启用多提供者查询的加密\n\n用于协作查询的受控数据共享可以从提供具有性价格计算资源的提供者中受益。然而，数据可能是敏感的，或者受到访问限制的影响，这可能会影响依赖外部提供者进行管理和处理的可能性。`[10]`中描述的模型通过提出一种方法解决了这一问题，该方法允许在可能无法完全信任访问数据内容的提供者受控参与的情况下，实现协作和分布式查询执行。为了具体起见，在不失通用性的情况下，该方法是在关系数据库系统的背景下构建的。所提出的方法基于三个级可见性的定义：\n\
  \n*   明文可见性（Plaintext visibility）：主体可以访问关系属性的明文值。\n*   加密可见性（Encrypted visibility）：主体无法访问关系属性的明文值，但可以查看相同属性的加密版本。\n\
  *   无可见性（No visibility）：主体既无法以明文通过加密的形式访问关系属性的值。\n\n为了使关系所有者（权威）能够独立制定权限（即不需要相互协调），每个权限都调节单个关系（由权威拥有的关系）的发布。形式上，权限定义如下。\n\
  \n**定义 10.5: 权限——具有加密可见性**\n\n*   给定关系 `r` 和提供者集合 `P`，权限是一种形式为 `[A,E]®P` 的规则，其中\
  \ `AÍr` 和 `EÍr` 是 `r` 中属性的子集，使得 `AÇE=Æ`，且 `PÎ PÈ{any}`。\n\n权限 `[A,E]®P` 表示提供者 `P`（因此也包括其授权内的任何服务器或用户）可以明文查看\
  \ `A` 中的属性，并加密形式查看 `E` 中的属性，而 `P` 不能看到 `r` 中既不属于 `A` 不属于 `E` 的属性。注意，每个提供者对每个关系只能有一个权限。使用关键字“any”作为规则主体的指定的默认权限，在未为提供者定义权限时适用。图\
  \ 10.15 展示了图 10.1 中关系 `Insurance` 和 `Patient` 的一组权限，分别对应服务器 `S [I]` 和 `S [P]`、用户\
  \ Alice 以及一个可能参与查询评估的外部服务器 `S [X]`。从图中可见，每个数据所有者都被授权以明文形式访问其关系中的所有属性（例如，`S [P]`\
  \ 可以明文访问关系 `Patient` 的所有属性），并且可能还以明文或加密形式访问其他权威拥有的关系的属性（例如，`S [P]` 可以明文访问关系 `Insurance`\
  \ 的属性 `ssn`，并加密形式访问属性 `type`，但无法访问属性 `premium`）。外部提供者可以以明文或加密形式访问关系属性的子集（例如，`S [X]`\
  \ 可以明文访问关系 `Insurance` 的属性 `premium` 并加密形式访问属性 `ssn`，但它无法访问属性 `type`）。\n\n![图 10.15\
  \ 图 10.1 中 Insurance 和 Patient 关系的权限示例。](img/fig10.15.jpg)\n\n图 10.15 图 10.1 中关系\
  \ `Insurance` 和 `Patient` 的权限示例。\n\n为了验证主体是否有权查看某个关系（基于子查询的评估），有必要捕获其内容。为了这一目的，类似于第\
  \ 10.7 节所示，每个关系都由一个取决于其信息的配置来表征。为了考虑到属性的明文和加密可见性，关系配置被定义为五元组 `[r ^(vp), r ^(ve),\
  \ r ^(ip), r ^(ie), r^~]`，其中：\n\n*   `r ^(vp)` 和 `r ^(ve)` 是 `r` 模式中可见的（分别为明文和加密）属性。\n\
  *   `r ^(ip)` 和 `r ^(ie)` 是隐性的（分别为明文和加密）属性，即未出现在 `r` 模式中但参与计算的属性（例如出现在分组句中的属性）。\n\
  *   `r^~` 是等价属性，即在计算中被比较的属性。\n\n考虑一个在图 10.1 关系上运行查询，返回患有流感的患者支付的费用（例如 `SELECT I.premium,\
  \ P.disease FROM Insurance JOIN Patient ON I.ssn=P.ssn WHERE P.disease=“flu”`）。图\
  \ 10.16 展示了该查询评估的带有加密解密操作的查询计划示例。在图中，每个节点补充了由节点评估产生的关系配置。加密属性以灰色背景表示。连接操作的结果配置包含了可见明文部分的\
  \ `I.premium` 和 `P.disease`，以及可见加密部分的 `I.ssn` 和 `P.ssn`。隐性部分包含明文的 `P.disease`，因为它跟踪了选择条件\
  \ `P.disease=“flu”` 的评估。最后，等价部分包含属性 `I.ssn` 和 `P.ssn`，它们通过连接条件进行了比较。\n\n![图 10.16\
  \ 带有配置和分配的查询计划示例。](img/fig10.16.jpg)\n\n图 10.16 带有配置和分配的查询计划示例。\n\n给定基础或派生关系 `r`\
  \ 及其配置 `[r ^(vp), r ^(ve), r ^(ip), r ^(ie), r^~]`，如果主体的权限允许其访问由 `r` 传递的显式和隐性信息，则主体有权访问\
  \ `r`。更准确地说，当满足以下条件时，`P` 有权访问 `r`：\n\n1.  1\\. `P` 被授权以明文形式访问 `r` 中以明文表示的所有可见和隐性属性（即\
  \ `r ^(vp) ∪ r ^(ip)` 中的属性）。\n\n\n\n\n\n2. `P` 被授权以明文或加密的形式访问 `r` 中以加密形式表示的所有属性，包括可见属性和隐式属性（即\
  \ `r^(ve)` ��等于 `r^(ie)` 中的属性）。事实上，明文可见性自然地意味着加密可见性，因为属性值的加密表示所传达的信息比其对应的明文值要少。\n\
  \n3. `P` 被授权以相同的形式（无论是明文还是加密）访问所有等价的属性（即出现在 `r^~` 中同一个等价类中的属性）。其核心思想是：释放等价类中的任何一个属性都会间接泄露关于该等价类中其他属性值的信息。通过这种一致的可见性可以防止由于查询评估中的比较导致属性值的意外信息泄露。例如，对\
  \ `P.ssn=I.ssn` 的评估不应将 `P.ssn` 的值泄露给被授权明文访问 `I.ssn` 并加密访问 `P.ssn` 的主体。\n\n考虑图 10.15\
  \ 中的权限以及图 10.16 中扩展了加密操作的查询计划。服务器 `S [X]` 被授权访问连接操作产生的关系，而 `S [I]` 和 `S [P]` 无法访问该关系。事实上，`S\
  \ [P]` 未被授权访问属性 `I.premium`，该属性在关系配置中以明文形式表示。另一方面，`S [I]` 可以访问关系中可见部分和隐式部分的所有属性，但它对\
  \ `I.ssn` 和 `P.ssn` 不具有一致的可见性，这两个者在连接条件中被比较。事实上，`S [I]` 只能以加密形式访问 `P.ssn`，而它对 `I.ssn`\
  \ 有明文访问权限。\n\n考虑到查询计划 `q`，根据授权策略 `[3,10,21]`，每个操作都应分配给一个服务器执行。直观上，一个操作可以分配给任何授权查看以下内容的服务器：(i)\
  \ 操作的操作数数，考虑到关系模式中所有不需要用于操作评估的属性都可以在查询评估时即时加密；以及 (ii) 操作结果。在所有潜在候选者中，负责每个操作执行的服务器选择是基于经济和/或性能参数的。可以动态插入加密和解密操作，以调整属性的可见性以满足权限并允许操作的评估。特别是，加密可用于保护属性，从而允许将操作分配给其他情况下无法考虑的服务器。解密允许在计算需要时访问加密属性的明文值。例如，对于查询计划中的每个节点，图\
  \ 10.16 报告了其分配情况。注意，属性 `P.ssn` 和 `I.ssn` 在连接操作之前被加密，因为负责连接评估的服务器 `S [X]` 未被授权以明文访问这些属性。\n\
  \n## 10.9 总结\n\n实体共享信息以及他人合作的需求日益增长。这种情况需要定义相应的方法，以便易于定义并有效执行存储在不同提供者处的信息选择性共享需求，这些需求可能跨越行政和企业领域。在本章中，我们调查了旨在为数据所有者提供有效控制的最新解决方案，他们希望选择性共享数据以协作分布式计算。我们还说明了定义查询评估计划的方法，以满足不同协作方定义的所有数据发布限制。\n\
