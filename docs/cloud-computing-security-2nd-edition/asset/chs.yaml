  加州州立大学\n加利福尼亚州富尔勒顿\n\n## 目录\n- 19.1 引言\n- 19.2 以结构为中心的谈判\n- 19.3 以策略为中心的谈判\n- 19.4\
  \ 以过程为中心的谈判\n- 19.5 以行为为中心的谈判\n- 19.6 恶意意谈判\n- 19.7 整合性谈判\n- 19.8 总结\n- 参考文献\n\n\
  ## 19.1 引言\n\n各类机构正日益采用云外包（cloudsourcing）来满足其信息技术需求。在这种采购策略下，企业所需的 IT 产品和服务是按公用事业计费模式从供应商处获取的，由供应商负责维护底层\
  \ IT 基础设施。在许多非常显眼且尴尬的信息安全泄露事件发生后，机构也日益意识到其信息资产存在安全相关问题。这两种现象的同时兴起，导致客户组织必须与云服务提供商进行谈判的频率增加，以确保其信息安全需求得到满足。因此，了解谈判理论和谈判策略对于组织云端信息技术计划的成功比以往任何时候都更加重要。本章将回顾几种不同的谈判取向，并探讨这些取向在通过服务提供商建立云外包关系获取\
  \ IT 产品服务的组织安全需求背景下的影响。\n\n尽管信息技术文献对云外包谈判的技术和管理基础做出了贡献，但支撑这一范式的理论框架源于谈判文献。在英语语者中，“谈判”一词已用于许多不同的情境，包括政治语境（Ikle\
  \ & Leites, 1962）、国际关系（Nikolaev, 2007）、商业（Kaufmann, 1987）、劳资关系（Walton, 1991）、法律实践（Gifford,\
  \ 2007）、讨价还价（Raiffa, 1985）以及人际关系（Thompson, 2007）等。这种应用的多样性就谈判过程产生了几种不同的理论传统。虽然谈判理论取向的分类法最初包含七个学派（Zartman,\
  \ 1976），但最近的学术研究已将其集合减少为五个不同的理论视角：(1) 结构视角、(2) 策略视角、(3) 过程视角、(4) 行为视角以及 (5) 整合视角（Zartman,\
  \ 1988）。此处还将考虑第六种视角——恶意意谈判（Cox, 1958）——因为它与前五个视角一样，可能对安全背景下的云外包谈判具有重要的实务意义。这六种谈判理论视角如图\
  \ 19.1 所示。\n\n![图 19.1 谈判的理论视角。](img/fig19.1.jpg)\n\n图 19.1 谈判的理论视角。\n\n在接下来的章节中，将逐一考虑上述每种理论视角，并特别关注每个视角对云安全需求谈判的影响。为了简单起见，这些学派将在双边（即双方）谈判的背景下进行考虑。这种取向不仅方便，而且是恰当的，因为双方谈判（例如涉及供应商和客户的谈判）是目前最常见的云外包谈判类型。尽管每个谈判理论视角都是独立考虑的，但重要的是，经验丰富的谈判者在谈判过程中通常会使用一种以上的方法（Zartman,\
  \ 2008）。\n\n## 19.2 以结构为中心的谈判\n\n在这种理论取向中，谈判结果被认为是定义该特定谈判的结构特征的函数，例如正在谈判的问题或参与的双方之间的对比权力（Raiffa,\
  \ 1985）。如果对这些特征有充分的先验知识，就可以构建谈判结构模型，以预测给定谈判的结果。双方之间的权力动态在结构化谈判中起着核心作用（Bell, 1977;\
  \ Kim, Pinkley, & Fragale, 2005; Zartman & Rubin, 2000），从这个视角来看，可以预期双方会在“冲突中的任何一方都不强大到足以强加自己的意志或单方面解决冲突”时进行谈判（Zartman,\
  \ 1997）。通过这个透镜来看，每个伙伴都被认为拥有优势和缺点，这些优缺点可能有助于或限制其影响谈判的能力（Fisher, Ury, & Patton, 1993）。根据双方的特征，双方之间的权力分布可以是对称的也可以是非对称的（Dwyer\
  \ & Orville, & Walker, 1981），而且对权力的感知可能会随着谈判过程的发展而改变（Zartman & Rubin, 2000）。\n\n\
  因此，最终谈判协议中编码条款的性质预计是谈判双方之间权力动态的函数（Mannix & Neale, 1993）。例如，考虑旨在结束战争的和平条约谈判。如果一方已确立了其军事支配地位，那么该一方被认为对另一方具有高度不对称的权力优势。这种以结构为中心的理论视角将预测，最终谈判协议将包含不比例倾向于更有实力的一方的条款。另一方面，如果冲突产生了军事僵局，那么谈判过程中的权力分布将更加对称，从而导致对更平衡的最终协议的预期。虽然结构预测模型具有吸引力，但它引发了所谓的结构主义困境（Zartman,\
  \ 1997）。\n\n\n\n\n\n结构主义困境探讨了在权力不对称的情况下进行谈判的非理性行为。引用扎特曼（Zartman，1997）关于这一主题的观点：“预期失败的弱势方应该不惜一切避免与强势方进行谈判，但他们做不到；而预期会胜的强势方本不需要谈判来获得他们想要的东西，但他们必须这样做。”关于这一困境的当前理论涉及关系对双方谈判意愿的约束作用（Zartman\
  \ & Rubin, 2000）。如果强势方希望为了未来的利益而维护双方关系，他们就不能简单地击垮并支配其弱势对手。同样，如果弱势方认为谈判可能会产生比其他方式更好的结果，他们也无法拒绝参与谈判。这一理论命题对于云安全需求谈判具有重要意义，因为数据存储和处理等非专业化云服务的市场竞争非常激烈，这使得客户忠诚度对云服务提供商而言至关重要（Reichheld\
  \ & Schefter, 2000）。换句话说，在高度竞争的市场中，客户组织可以自由地从各种云服务提供商中选择满足其非专业信息技术的需求，这种情况赋予了客户组织巨大的权力。因此，非专业\
  \ IT 服务的云服务提供商必须寻求在最大化自身短期收入与提供足够的激励和服务水平以留住客户之间取得平衡，以获取长期利益。\n\n在高度竞争的市场中，需要非专业\
  \ IT 服务的客户组织通常没有为了维持关系本身而与云服务提供商维持关系的压力。因此，以结构为中心的谈判取向意味着，服务提供商将努力寻找加强与客户之间纽带的方法以增加客户对双方关系价值的感知。相比之下，以结构为中心的取向也意味着客户组织可以且应该在谈判过程中利用其不对称的权力优势，确保服务提供商以合理的价格满足其安全需求。否则，服务提供商之间的高度竞争意味着客户组织可以很容易离开不满意的谈判，并在其他处寻找更具配合的服务提供商。图\
  \ 19.2\n\n图 19.2 结构化谈判的特征。\n\n## 19.3 以策略为中心的谈判\n\n谈判的另一种理论观点将策略而非权力置于谈判过程的核心。与关注某一方可能实现其目标的结构性手段不同，策略方法侧重于目标本身在决定谈判结果中的作用。谈判的策略模型假设双方都是理性行动者，每个伙伴都寻求使其自身效用最大化（Nikolaev,\
  \ 2007）。因此，这些模型在本质上是规范性的，因为它们定义了高度理性的谈判者在谈判过程中应该如何表现（Raiffa, 1985; Schilling, 2007）。简而言之，这种以谈判为中心的理论取向，力求在理性决策的框架内开发理想谈判行为的模型。这一理论取向的关键点是“**否决权**”（notion\
  \ of the veto）的概念，它承认谈判的每一方都是一个拥有拒绝权的独立实体（Kremeniuk & Sjöstedt, 2000）。这不仅包括拒绝最终协议的权利，还包括在整个谈判过程中拒绝对方提出的条款和条款的权利。在双方谈判中，这种拒绝权意味着协议将在四种可能的谈判结果中的一种中达成。这一概念在图\
  \ 19.3\n\n图 19.3 双方谈判的可能结果。\n\n因此，谈判桌变成了一种策略战场，其特点是招招破解以及冷酷、无情的计算。正是如此，策略谈判与博弈论原则如此紧密交织（Snyder\
  \ & Diesing, 1977）。\n\n与所有的博弈论模型一样，策略谈判模型在本质上是数学性的（Myerson, 1997）。从云服务提供商的角度来看，数学框架在与客户谈判安全需求及其相关成本结构方面极具吸引力。这是因为服务提供商至少在理论上对与其谈判交易另一方相关的特定货币价值有完全了解。例如，在参与谈判之前，服务提供商应该精确地知道她可以提供哪些安全机制和服务水平，以及通过在不同服务水平上提供这些安全机制将承担的实际成本。在掌握这些信息的情况下，鉴于客户的报价完全以特定服务、服务水平和货币金额表示，服务提供商可以轻松计算出潜在客户所提任何报价的客观定量价值，并能利用所得知识来指导其理性决策过程。在以策略为中心的谈判取向中，双方的方法本质上都是算法化的，鉴于算法本质上是数学的，策略谈判方法所采用的数学框架为潜在客户和服务提供商双方的理性决策提供了天然基础。\n\
  \n除了上述预先知识外，策略方法还假设谈判双方完全了解自己的替代方案，并且这些替代方案已经过了客观估值。通过对其替代方案及其价值的了解，一方能够识别出其**最佳谈判替代方案**（`BATNA`），这建立了一个参考点，可以以此对谈判桌上提出的条款进行有效的比较（Fisher,\
  \ Ury, & Patton, 2011）。例如，如果一个理性的客户组织正在就特定服务水平的某项信息安全需求进行谈判，并且意识到她在其他处获得相同服务可能需要支付的最低价格（即她知道自己的\
  \ `BATNA`），那么从理性的角度来看，客户组织在谈判中同意任何高于其最佳替代方案的价格将都是失职的。与其数学框架一样，策略取向中关于替代方案及其价值的概念可以很容易地适用于云安全需求的谈判。图\
  \ 19.4\n\n图 19.4 策略性谈判的特征。\n\n## 19.4 以过程为中心的谈判\n\n\n\n\n\n与谈判的策略方法一样，过程取向（processual\
  \ orientation）关注的是谈判结果。然而，在过程方法中，谈判结果是根据谈判过程本身来考虑的。在这种理论取向中，谈判过程受互惠交换关系的引导，谈判双方以一种迭代的、轮流的方式进行报价交换。在典型情况下，一方将通过提出开场报价来启动谈判，对方将用自己的自己的开场报价作为回应。随后，第一方将评估形势，并通过接受报价、退出谈判，或给出一个相对于其原始立场具有某种程度让步的新报价来做出回应。通过做出这种让步，第一方不仅向对方传达了其意图，还在鼓励对方离开其初始立场（Zartman,\
  \ 1978）。因此，每一方都参与了让步行为，以便在对方中创造一种社交和行为上的义务，使其以类似的自己的让步作为回应（Dawson, 2001）。在云背景下，信息安全需求的谈判非常符合这种迭代的、轮流的议价框架。\n\
  \n在评估对手提供的让步时，一方被认为正处于一个学习过程中，通过该过程，它希望对对方的图和边界条件获得更全面的理解（Zartman, 1978）。每当提交报价时，接收报价的一方必须依靠其积累的见解在三种可能的行动方案中做出决定：即\
  \ (1) 接受报价，(2) 退出，或 (3) 反报价。如果采取了前两种行动方案之一，谈判过程将结束——第一种方案成功，第二种方案则失败。这种关于三种可能行动方案的理论概念，可以被参与云安全谈判的双方有效应用。\n\
  \n也许从以过程为中心的理论视角产生的最具实用价值的构建之一，就是后来被称为“可能协议区域”（Zone of Possible Agreement，ZOPA）。`ZOPA`\
  \ 在数学上定义了双方都认为可以接受的结果可能范围（Young, 1991）。该范围的边界由双方的 `BATNAs` 定义，因此 `ZOPA` 是所有可能的谈判结果的集合，这些结果使每一方的处境都比选择退出并追求其谈判协议的最佳替代方案（即其\
  \ `BATNA`）要好。当谈判的唯一问题是价格时，`ZOPA` 可以方便地表示在一个一维轴上，如图 19.5 所示。\n\n![Figure 19.5 Zone\
  \ of Possible Agreement.](img/fig19.5.jpg)\n\n图 19.5 可能协议区域。\n\n前述图表说明了一个场景，在该场景中，客户通过谈判获取服务的最佳替代方案价值为\
  \ $4000.00，而提供者通过谈判销售服务的最佳替代方案价值为 $1500.00。因此，`ZOPA` 是双方 `BATNAs` 之间存在的 $2500.00\
  \ 价值范围，且该范围内的任何协议都将产生恰好 $2500.00 的价值。\n\n更广泛地说，在过程取向中，`ZOPA` 量化了如果谈判以协议结束时所创造的价值总量。如果我们假设双方对价格一个单位的变化赋予相等的效用，那么中点就代表了一个公平的结果。由于非公平结果的可能性远多于公平结果，概率法则意味着公平结果是相对稀少的。在零和博背景下，中点与最终结果之间的几何距离可以作为衡量每一方所取得成功的标准。从这个角度来看，谈判者的目标就是尽可能地占据\
  \ `ZOPA` 的份额。当然，这可以通过获得一个更接近对手 `BATNA` 而不是接近自己 `BATNA` 的协议来实现。与报价/反报价框架以及提交报价后出现的可能决策路径集一样，这种\
  \ `ZOPA` 理论概念也可以有效应用于云安全谈判中。图 19.6\n\n图 19.6 过程谈判的特征。\n\n## 19.5 以行为为中心的谈判\n\n与上述描述的三种理论取向不同，行为视角主要关注人类谈判者的个别特征、性格、情绪、技能和行为如何影响谈判结果（Zartman,\
  \ 1978）。这种方法大量借用了社会学和心理学文献，以建立谈判模型，在这些模型中，结果可以作为谈判者特征以及谈判者之间社交互动的函数被预测和解释。因此，群体动态、合作、感知、对对手行为的预期以及双方之间的信任等构建是这种理论取向的核心（Hausken,\
  \ 1997; Ross & LaCroix, 1996; Thompson, 1990）。行为学派进行的谈判研究揭示了，许多个人谈判者特征如年龄、性别、经验和性格类型对影响谈判结果起着显著作用（Lax\
  \ & Sebenius, 2011; Thompson, 2007）。这些观察对于云安全需求的谈判具有重要意义，因为此类谈判中的双方都是在这些维度上存在个体差异的人。\n\
  \n\n\n\n\n谈判者困境的教训对云安全需求谈判具有重要启示，因为这些它们揭示了谈判者在谈判过程中必须遵循的行为方式。具体而言，在与潜在客户谈判时采用强硬的、交易型方法的服务提供商，可能会在财务状况上获得短期利益，但这种利益是以牺牲客户满意度为代价的，而不满意的客户不太可能成为回头客。鉴于云服务市场的竞争本质，服务提供商必须在竞争性和合作性的谈判行为之间寻求平衡，旨在通过公平的行为和维护客户关系来实现长期收益最大化。图\
  \ 19.7 提供了以行为为中心的谈判的总结。\n\n![图 19.7 行为谈判的特征。](img/fig19.7.jpg)\n\n图 19.7 行为谈判的特征。\n\
  \n## 19.6 诚意谈判\n\n虽然 Zartman (1988) 最初并未将其列出，但对恶意谈判的研究已成为谈判领域本身一个重要的理论取向。在恶意谈判中，双方同意坐在谈判桌前，但其中一方或双方实际上并无意达成妥协（Cox,\
  \ 1958）。相反，参与谈判这一行为本身就为一方或双方创造了价值（Shell, 1991）。从理论角度来看，促使参与恶意谈判动力是从谈判行为中获得的效用，而不是对成功达成协议后可能获得的收益的预期。尽管在美国，联邦法律并没有规定在谈判中必须履行诚实信用的一般义务，但法院仍然表现出惩罚那些显然进行恶意谈判的人员的意愿（Rakoff,\
  \ 2007; Shell, 1991）。\n\n作为恶意谈判的一个例子，考虑两个同意就一项有争议的立法问题进行谈判的政党。这两个政党中的一个或双方在进入谈判时预先决定在立场上保持固执，并故意避免与对方达成妥协。尽管谈判过程在设计上是失败的，但某一方仍可能从中获益：要么通过其妥协的姿态和公众对其妥协意愿的认知，要么通过将谈判过程失败的责任归咎于另一方。在云安全谈判的背景下，必须仔细考虑恶意行为的概念，因为这种行为会侵蚀谈判环境的完整性。\n\
  \n作为恶意行为如何负面影响云服务提供商财务表现的例子，考虑以下场景：竞争服务提供商伪装成潜在客户，与该提供商就购买特定服务进行谈判。通过与提供商进行购买服务的谈判并在最后一刻放弃或“离开”谈判，竞争对手正在进行恶意行为，其目的是阐明服务提供商的底层成本结构。从理论角度来看，竞争对手正在利用系统漏洞，试图对表现良好的服务提供商获得不公平的优势。在这种情况下寻求的不公平优势是获取关于提供商\
  \ `BATNA` 的精确知识，竞争提供商随后可以利用其为自己 get。因此，在竞争激烈的云服务市场运营的服务提供商和客户组织必须保持警惕，以防对方出现这种恶意行为。图\
  \ 19.8 提供了恶意谈判的总结。\n\n![图 19.8 恶意谈判的特征。](img/fig19.8.jpg)\n\n图 19.8 恶意谈判的特征。\n\n\
  ## 19.7 整合性谈判\n\n虽然上述描述的五种谈判理论取向可以交替标记为零和、固定和、分配型或固定饼视角，但整合性谈判取向拥抱了正和、双赢的方法，而且日益流行的“扩大饼”谈判策略正源于这种理论取向（Thompson,\
  \ 2007, 2011）。过去几十年中发表的大量谈判研究——包括原则谈判（Fisher, et al., 2011）——都属于整合性学派的大伞下。正如 Hopmann\
  \ (1998) 所指，自 20 世纪 90 年代以来，谈判理论的研究“已经超越了讨价理论，转向强调整合解决问题核心作用的方法”（Hopmann, 1998）。正因如此，敏锐的读者可能已经注意到，支撑此前讨论的理论取向的许多关键引用都早于对整合性方法兴趣的兴起。整合性谈判可能适用于云安全需求谈判的背景，但仅当此类谈判涉及的问题不仅限于服务价格时才有效。否则，谈判在定义上就是固定和和分配性的，整合性方法将价值无几（Thompson,\
  \ 2007）。\n\n整合性谈判方法的底层哲学是，对立的谈判者应该合作共同努力，超越立场谈判，转而关注他们所代表的双方的利益（Fisher, et al.,\
  \ 2011; Thompson, 2007）。通过这样做，每一方都试图使谈判过程中创造的价值总量最大化，同时尽可能获取这些总价值（Harvard Business\
  \ School, 2005）。通过这种方式，双方可以从谈判过程中提取更多价值，从而使双方的状况都比参与立场性的、零和谈判时更好。这一概念在 图 19.9 中所示，其中每个“饼”的总面积代表了从谈判过程中提取的价值总额。\n\
  \n![图 19.9 零和谈判与正和谈判。](img/fig19.9.jpg)\n\n图 19.9 零和谈判与正和谈判。\n\n\n\n\n为了实现整合谈判的目标，该过程被建模为分为三个不同的阶段：(1)\
  \ 诊断阶段、(2) 方案构建阶段以及 (3) 细节阶段 (Nikolaev, 2007)。诊断阶段主要关注谈判前的准备，涉及如评估议题空间的结构、与对方共享信息，以及寻求对方以诚意和诚信的态度进行谈判的承诺\
  \ (Zartman, 2008)。方案构建阶段在双方积累了足够启动谈判的信息后开始。在这一阶段，双方通过重新界定正在谈判的议题，或通过合作努力寻找创造性的解决方案来弥补双方之间的分歧并“扩大蛋糕”，初步尝试制定一个共同的解决方案框架\
  \ (Hopmann, 1998; Nikolaev, 2007; Zartman & Berman, 1983)。最后，在有了通用的解决方案框架后，随着双方着手处理最终协议的具体条款的复杂性和细微之处，细节阶段随之展开。此阶段的谈判者通常会寻求与对方进行让步和权衡，以实现双方价值的净增长，从而达成互利互惠且满意的最终协议\
  \ (Bazerman & Neale, 1992)。\n\n如上述讨论所示，整合方法旨在提高涉及多个议题的谈判情境中谈判者之间的结果。如果谈判的唯一议题是价格，那么表征整合派思想的理论构筑在云安全需求谈判的背景下可能认为价值不大。然而，如果服务提供商和潜在客户同时谈判多个议题——例如价格和（质量——那么整合方法的理论要点在云服务谈判期间可能非常有用，因为根据定义，整合方法的成功应用会为双方带来更大的价值。图\
  \ 19.10 提供了整合谈判的总结。\n\n![图 19.10 整合谈判的特征。](img/fig19.10.jpg)\n\n图 19.10 整合谈判的特征。\n\
  \n## 19.8 总结\n\n在云安全需求谈判的背景下，本章描述的任何一种谈判理论取向本身可能都是够的。相反，取决于情况，每种取向都有可能做出不同程度的。换句话说，取决于服务提供商和客户组织所处的具体情况，上述讨论的每种谈判理论取向对云安全需求的谈判都有所贡献。因此，参与这一过程的谈判者必须熟悉每种理论取向，并学会在适当的情况下应用每种视角，以实现各自组织的目标。表\
  \ 19.1 总结了上述讨论的六种谈判理论取向，并突出了每种取向中与云安全需求谈判相关的理论构筑。\n\n表 19.1 谈判理论取向总结\n\n![](img/T19.1.jpg)\n\
  \n最终，客户组织调节其与云供应商谈判信息安全需求方面的预期至关重要。特别是像 Google、Microsoft 和 Amazon 这样的大云提供商通常通过提供一系列可选的产品、服务和服务水平来运营，并配有相应的固定的定价和有限的定制空间。由于这些巨头字面上拥有数百万客户，他们考虑谈判或提供非菜单列表之外的云产品、服务或服务水平的意愿很大程度上取决于对潜在关系的感知价值，其中涉及更高价值或更丰厚合同的用例通常对谈判最开放。因此，需要谈判高度特定或高度定制的数据安全或隐私需求的客户组织可以考虑接触许多专门针对利基情况的较小云提供商，特别是如果建议合同的价值不足以引起最大云提供商的特殊关注或考虑时。\n\
  \n作为最后的实用的建议，谈判者会发现，在谈判过程中控制好情绪对他们最有利 (Voss & Raz, 2016)。记住，谈判的核心不在于赢或输，而是关乎相关各的利益。你在谈判桌另一侧的对手正在尽力代表他们组织的利益，而你的目标也是如此。在谈判开始时承认并公开讨论这一点可以建立信任和关系，并鼓励双方以伙伴关系共同努力，从关系中获得尽可能多的价值。记住，双方通常不会对谈判中可能包含的所有内容都赋予相同的价值。例如，提议将云提供商的标志添加到你组织的网站上，或在组织的\
  \ Facebook 页面或 Twitter 账户上提到云提供商，这对云提供商可能非常有价值，尽管这对你的组织来说几乎没有任何成本。共同努力发现这类隐藏的宝藏可以加强双方之间的关系，并确保每个人离开谈判桌时获得的价值都比他们最初认为可能的要。\n\
