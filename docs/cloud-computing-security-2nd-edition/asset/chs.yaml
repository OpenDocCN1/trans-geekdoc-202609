  - 延伸阅读\n- 参考文献\n\n## 14.1 引言](#chapter14.xhtml#re_ch-14-sec-1)\n\n互联网的演进可以分为三个时代：20\
  \ 世纪 70 年代标志着第一代的到来，特征是通过终端访问昂贵的主机；20 世纪 80 年代末和 90 年代初见证了第二代，以具有图形用户界面（GUI）的个人电脑爆发为特征；21\
  \ 世纪的第一个十年带来了第三代，其定义是移动计算——物联网——以及云计算。\n\n1997 年，Ramnath Chellappa 教授首次将云计算定义为一种“边界由经济理性而非技术限制的新范式”。无处不在的（ubiquitous）计算成为许多定义和模型自以来最热门的趋势之一，2000\
  \ 年代云计算开始造福供应商和消费者。虚拟化和服务架构（SOA）的广泛采用使得现有和新的服务能够高效、便捷和安全。\n\n信息系统现在处于三因素拐折点（见图 14.1）。计算基础设施的虚拟化为无处不在的（fn-2）和无孔不的（pervasive，fn-3）计算奠定了基础。云计算、移动性以及物联网（IoT）或网络物（NoT）的快速扩张是引发转折点的驱动组件，将世界从连接转变为超连接。由于其弹性和低廉成本提供的扩展能力，云资源已成为恶意活动的目标和来源，导致了网络犯罪的指数级增长。\n\
  \n信息系统现在处于三因素拐折点（见图 14.1）。\n\n![图 14.1 信息系统的三因素拐折点](img/fig14.jpg)\n\n图 14.1 信息系统的三因素拐折点。\n\
  \n## 14.2 云计算定义](#chapter14.xhtml#re_ch-14-sec-2)\n\n美国国家标准与技术研究院（NIST）提供了被广泛采用的云计算定义，该定义还识别了其主要特征、部署方式和服务模型。根据\
  \ NIST 特别出版（SP）800-145 中发布的定义：“云计算是一种模型，通过通过无处不在、便捷、按需的网络访问来共享可配置计算资源池（例如网络、服务器、存储、应用程序和服务），这些资源可以在最少管理工作或服务提供商交互的情况下被快速配置和释放。”企业可以利用这些资源，随时随地、通过任何设备以灵活的方式按需开发、托管和运行服务及应用程序。\n\
  \nNIST 定义还为云服务的五个基本特征提供了一个统一视图：按需自服务、广泛网络访问、资源池、快速弹性和可衡量服务。此外，NIST 为云消费者提供的三种服务模型提供了一个简单且明确的分类法：基础设施即服务（IaaS）、平台即服务（PaaS）和软件即服务（SaaS）；以及四种云部署模式：公共、私有、社区和混合。服务模型和部署模式的结合定义了云服务的交付方式。NIST\
  \ SP 800-145 对三种服务模型的定义如下：\n\n\n\n\n\n### 1. IaaS\n提供给消费者的能力是提供处理、存储、网络和其他基础计算资源，消费者能够在这些资源上部署和运行任意软件（包括操作系统和应用程序）。消费者不管理或控制底层的云基础设施，但对操作系统、存储、已部署的应用程序以及可能对某些特定的网络组件（例如主机防火墙）具有控制权。\n\
  \n### 2. PaaS\n提供给消费者的能力是将消费者创建或获取的应用程序部署到云基础设施上，这些应用程序是使用供应商支持的编程语言和工具开发的。消费者不管理或控制底层的云基础设施（包括网络、服务器、操作系统或存储），但对已部署的应用程序以及可能的应用程序托管环境配置具有控制权。\n\
  \n### 3. SaaS\n提供给消费者的能力是使用运行在云基础设施上的供应商应用程序。用户可以通过轻客户端界面（如 Web 浏览器，例如基于 Web 的电子邮件）访问这些应用程序。消费者不管理或控制底层的云基础设施（包括网络、服务器、操作系统、存储，甚至单个应用程序的功能），但可能对特定的用户应用程序配置设置进行配置。\n\
  \nISO/IEC JTC1 SC38 WG3 和 ITU-T 还开发了源自 `NIST SP 800-145` 的云计算分类法：国际标准 `ISO/IEC 17788`，建议书\
  \ `ITU-T Y.3500` 《信息技术—云计算—概述和术语》。\n\n云计算的主要概念和许多术语在 NIST 和 ISO/IEC 标准之间很大程度上是可以通用的。然而，由于\
  \ NIST 的云计算定义出现得早，且构成了 ISO/IEC 标准定义的核心概念，本本采用了 NIST 的定义。这三种云服务模型均允许以下能力：\n\n*  \
  \ IaaS 允许云消费者在云供应商提供的硬件和资源抽象层（虚拟机监控程序）上运行选择的任何操作系统和应用程序。消费者的操作系统和应用程序可以迁移到云供应商的硬件上，可能会取代公司的数据中心基础设施。\n\
  *   PaaS 允许消费者创建自己的云应用程序。基本上，云供应商提供了一个虚拟化环境和一组工具，以允许创建新的 Web 应用程序。云供应商还提供硬件、操作系统以及常用的系统软件和应用程序，例如数据库管理系统\
  \ (`DBMS`)、Web 服务器等。\n*   SaaS 允许云消费者运行在线应用程序。用户通过互联网访问现成应用程序。云供应商拥有这些应用程序，消费者被授权根据双方签署的服务协议使用它们。\n\
  \n总而言之，云计算提供了一种便捷的、按需的访问共享的可配置资源池（例如网络、服务器、存储、应用程序和服务），使用户能够随时、随地、在任何设备上以灵活的方式按需开发、托管和运行服务及应用程序。\n\
  \n## 14.3 云计算参考架构\n\nNIST 还是首次定义了与技术和实现无关的云计算参考架构（`NIST SP 500-292`），该架构识别了主要的云参与者、其角色以及管理和提供云服务所需的架构组件（例如服务部署、服务编排、服务管理、服务聚合）。\n\
  \n源自 `NIST SP 500-292`，ISO/IEC JTC1 SC38 WG3 和 ITU-T 也开发了参考架构标准：国际标准 `ISO/IEC 17789`\
  \ | 建议书 `ITU-T Y.3502` 《信息技术—云计算—参考架构》，该标准描述了云计算参与者，重点关注云供应商和云客户，同时将其他云参与者归类在单独的云合作伙伴类别中。云参考架构和云分类法是基础性文档，帮助云计算利益相关者交流概念、架构或运营和安全需求，这仅仅是其益处的一角。\n\
  \nNIST 在 `NIST SP 500-292` 中引入的与无关的云计算参考架构 (`RA`) 是 NIST 云计算定义的逻辑扩展。如前所述，云 `RA`\
  \ 是一个通用的、高层的概念模型，有助于理解云计算的运营复杂性。`RA` 并不代表特定云计算系统的系统架构；相反，它是一个使用通用参考框架来描述、讨论和开发特定系统架构的工具。\n\
  \n`图 14.2` 所示的架构未与任何特定的供应商产品、服务或参考实现绑定，也不提供规定性的解决方案。`RA` 定义了一组云参与者及其活动，以及可用于编排云生态系统的功能。云计算\
  \ `RA` 与配套的云计算分类法相关，并包含一组视图和描述，这些视图是讨论云计算特性、用途和标准的依据。基于参与者的模型旨在通过代表角色和责任的整体视图为利益相关者服务，以便通过实施安全隐私控制来评估和管理风险。\n\
  \n![图 14.2 NIST 云计算安全参考架构方法。（来自 NIST 特别出版 500-292，NIST 云计算参考架构，2011 年 9 月。经许可使用。）](img/fig14.2.jpg)\n\
  \n图 14.2 NIST 云计算安全参考架构方法。（来自 NIST 特别出版 500-292，NIST 云计算参考架构，2011 年 9 月。经许可使用。）\n\
  \n如 `图 14.2` 所示，`RA` 识别了五类主要的云参与者：消费者、供应商、经纪商、运营商和审计员。NIST `RA` 定义的每个云参与者都是参与交易或过程并/或在云计算中执行任务的实体（个人或组织）。NIST\
  \ 在 `SP 500-292` 中引入的云参与者定义重录在下表 14.1 中。\n\n表 14.1 云参与者定义\n\n| 参与者 | 定义 |\n| ---\
  \ | --- |\n| 云消费者 | 与云供应商建立业务关系并使用其服务的个人或组织。 |\n| 云供应商 | 负责为利益方提供服务的个人、组织或实体。 |\n\
  | 云审计员 | 可以对云服务、信息系统操作、性能和云实现进行独立评估的方。 |\n| 云经纪商 | 管理云服务的使用、性能和交付并在云供应商与云消费者之间协商关系的实体。\
  \ |\n| 云运营商 | 提供从云供应商到云消费者服务连接和传输的中介。 |\n\n来源：NIST, `SP 500-292`.\n\n\n\n\n\n图 14.2\
  \ 中的 NIST RA 图也描绘了 14.2 节之前讨论的三种服务模型：以倒 L 型表示的 `IaaS`、`PaaS` 和 `SaaS`，突显了构建云服务的堆栈方法。此外，NIST\
  \ RA 图还识别了每个云参与者在云生态系统中的通用活动。该参考架构旨在有助于理解云计算中的操作复杂性。它并不代表特定云计算系统的系统架构；相反，它是一个使用通用参考框架来描述、讨论和开发特定系统架构的工具，我们计划在稍后讨论云环境中的密钥管理问题时利用该框架。\n\
  \n为了增强 NIST SP 500-292 云 RA，NIST 在 NIST SP 500-299《云安全参考架构》中识别了两种类型的云提供商：\n\n1.\
  \ `Primary provider`（主提供商）\n2. `Intermediary provider`（中间提供商）\n\n以及两种类型的云经纪人：\n\n\
  1. `Business broker`（业务代理）\n2. `Technical broker`（技术代理）\n\n为了增强 NIST SP 500-292\
  \ 云 RA，NIST 在 NIST SP 500-299《云安全参考架构》（见图 14.3）中识别了两种类型的云提供商以及属于提供者责任的密钥管理功能。根据所提供的云服务的架构细节，可能需要在两个提供商之间进行划分。从云消费者的角度来看，这种划分是不可见的。\n\
  \n![图 14.3 复合云生态系统安全架构。（来自 NIST Special Publication 500-299，NIST Cloud Security\
  \ Reference Architecture [draft]。经许可使用。）](Images/fig14.3.jpg)\n\n图 14.3 复合云生态系统安全架构。（来自\
  \ NIST Special Publication 500-299，NIST Cloud Security Reference Architecture [draft]。经许可使用。）\n\
  \n`primary provider` 提供托管在其自己拥有的基础设施上的服务。它可能会通过第三方（如 `broker` 或 `intermediary provider`）向消费者提供这些服务，但\
  \ `primary provider` 的定义特征是它不从其他提供商处获取其服务产品的来源。\n\n`intermediary provider` 具有与其他云提供者交互的能力，而不提供对\
  \ `primary provider(s)` 的可见性或透明度。`intermediary provider` 将 `primary provider` 提供的服务作为其服务的不可见组件，并作为集成方案呈现给客户。从安全角度来看，`primary\
  \ provider` 需要的所有安全服务和组件对 `intermediary provider` 也是同样要求的。\n\n`business broker`\
  \ 只提供业务和关系服务，与云中云消费者的数据、操作或产物（例如镜像、卷、防火墙）没有任何接触，因此，无论云架构如何，它在实施任何密钥管理功能方面都不承担责任。相反，`technical\
  \ broker` 确实与消费者的资产进行交互；`technical broker` 聚合来自多个云提供商的服务，并通过解决单点入口和互操作性问题增加了一层技术功能。\n\
  \n`cloud technical broker` 有两个区别于 `intermediary provider` 的关键定义特征：\n\n1. 能够为多个不同的提供者提供单一且一致的接口（用于业务或技术目的）\n\
  2. 经纪人允许透明地看到后台是谁在提供服务——与不提供此类透明度的中间提供商相反。\n\n由于 `technical broker` 允许这种透明可见性，消费者知道哪些云能力是由\
  \ `technical broker` 实现的，哪些是由与 `technical broker` 合作的云提供者提供的。这种情况与涉及 `intermediary\
  \ provider` 的情况不同，因为 `intermediary provider` 是不透明的，消费者在适用情况下并不知道密钥管理功能是如何在 `intermediary\
  \ provider` 和 `primary provider` 之间划分的。\n\n## 14.4 云计算安全核心要素\n\n云计算为企业在资本支出（CAPEX）和运营支出（OPEX）方面都提供了重大的成本节约，并允许他们利用领先技术来满足其信息处理需求。在云环境中，安全和隐私是所有云参与者的交叉关注点，因为这两者都触及云计算参考架构的所有层级，并影响云服务的许多部分。因此，与云服务相关的资源安全管理是云计算的关键方面。在云环境中，针对不同的云部署模型存在不同的安全威胁和安全需求，而针对此类威胁的必要缓解措施以及实施安全控制的云参与者责任取决于所选的服务模型和选定的服务类别。许多安全威胁可以通过应用传统的安全流程和机制来缓解，而另一些则需要云特定的解决方案。由于云计算参考架构的每一层都可能有不同的安全漏洞并可能暴露于不同的威胁中，云服务的架构直接影响其安全态势和系统的密钥管理方面。\n\
  \n对于每个服务模型，图 14.4 使用区块方法描述了云消费者对云环境不同层级的可见性和可访问性的图形表示。如图所示，在 `IaaS` 服务模型中，云消费者对应用程序接口（`API`）层之上的一切具有很高的可见性，而云提供者在\
  \ `API` 层以下实施控制（这些控制对消费者通常是不可见的）。在 `PaaS` 模型中，云消费者的可见性和密钥管理控制有限，因为云提供者实现了集成和中间件层以下的所有层的安全功能。在\
  \ `SaaS` 模型中，云消费者失去了可见性和控制权，通常情况下演示层以下的控制对云消费者是不可见的，因为云提供者实施了所有安全功能。\n\n![图 14.4\
  \ 控制层级。（来自 NIST SP 800-173。经许可使用。）](img/fig14.4.jpg)\n\n图 14.4 控制层级。（来自 NIST SP\
  \ 800-173。经许可使用。）\n\n虽然所有参与云生态系统的云参与者都负责处理操作、安全和隐私问题，但云消费者保留数据所有权，因此仍然完全负责：\n\n\
  * 正确识别数据的敏感性\n* 评估数据泄露或误用的风险以及对业务的影响\n* 确定与数据敏感性匹配的安全需求\n* 批准必要的风险缓解措施\n\n云消费者的一些关注领域包括：\n\
  \n* 风险管理\n    * 风险分析\n    * 风险评估\n    * 漏洞评估\n    * 事件报告与响应\n* 业务连续性\n    * 灾难恢复计划\n\
  \    * 包含并量化服务恢复点目标（RPO）和恢复时间目标（RTO）的恢复计划\n* 物理安全\n    * 物理环境安全策略\n    * 应急备计划\n\
  \    * 应急响应计划\n    * 设施布局\n    * 安全基础设施\n    * 人力资源\n    * 环境安全\n    * 设施视视检查\n\n\
  \n\n\n\n*   用户账户终止程序\n*   符合国家和国际/行业安全标准\n*   对云提供商、经纪商和运营商的安全态势提供透明的视图\n\n技术的进步使云计算成为满足许多组织技术需求的可行替代方案。然而，为了让云消费者能够充分利用云计算的规模经济、灵活性和整体潜力，消费者需要解决上述列出的问题，并量化与采用云端信息系统相关的风险。由于在云生态系统中衡量和管理风险是一个复杂的问题，因此专门设立了一个单独的章节——第\
  \ 7 章的讨论），云提供商和云技术经纪商（在涉及时）成为数据保管者，负责履行云消费者识别的所有安全和隐私需求。始终建议云消费者在授权使用云端信息系统之前，审查所有安全和隐私控制的实施情况并确保满足所有要求。\n\
  \n## 14.5 划分运营职责\n\n一旦云消费者选择了最合适的云架构并确定了其他云生态伙伴来编排云生态系统，所有参与者必须共同努力，明确识别他们的运营职责。这些职责通常分配在不同的参与者之间，责任层级根据所采用的部署和服务模型而转移。理想情况下，云消费者应最终负责定义保护数据和云端信息系统所需的安全和隐私控制。其中许多控制的实施通常是云提供商或云技术经纪商（在涉及时）的责任。\n\
  \n一旦确定了云架构，参与编排生态系统的云参与者会识别暴露给云消费者的控制接口。云提供商和/或经纪商可以暴露的控制接口示例包括\n\n*   系统、安全和应用程序日志\n\
  *   用于监测的经纪商 `APIs`\n*   管理云消费者应用程序的经纪商 Web \n\n最终，每个云参与者都根据云信息系统安全授权中的定义负责相应的运营任务。\n\
  \n## 14.6 云生态系统中的可见性与信任\n\n\n\n\n\n在云计算范式下，组织放弃了对安全和隐私许多方面的直接控制，并借此对云提供商（商）和云技术中间人授予了高度的信任。同时，云消费者作为数据所有者，有责任保护信息和信息系统，其程度应与未经授权的访问、使用、披露、中断、修改或破坏所造成的风险和损害规模相适应，无论这些信息是由云消费者收集或维护的，还是代表云消费者收集或维护的。为了维持云生态系统中的信任并适当缓解与云端信息系统相关的风险，云参与者需要对彼此的领域具有可见性。\n\
  \n向云计算服务的转型意味着责任的转移，即由云提供商和云技术中间人实施必要的安全和隐私控制，以保护运行云消费者数据和应用程序的系统部分。\n\n对云提供商运营方式的可见性（包括组合服务的置备）是云消费者对系统安全和隐私进行有效监督的关键要素。为了确保策略和程序在整个系统生命周期内得到执行，服务协议应包含某些手段，使组织能够获得云提供商所采用的安全和隐私控制、过程及其随时间推移表现的可见性。\n\
  \n信任是与风险管理相关的重要概念。云参与者处理信任的方式会影响其行为及其内外部信任关系。对云计算服务的依赖导致云参与者之间需要信任关系。然而，建立可信度需要对提供商和技术中间人的实践以及风险/信息安全决策具有可见性，以便正确评估风险并估计风险容忍度。需要注意的是，信任程度可能会不同，且接受的风险取决于所建立的信任关系。\n\
  \n下一节将进一步讨论建立信任的重要性，并引入信任边界的概念。此外，第 7 章将详细讨论云消费者在云生态系统中的风险管理。\n\n## 14.7 云生态系统中的边界\n\
  \n在云生态系统中，云消费者以中立的方式在所有层上建立信息系统边界的清晰界限至关重要。此外，无论供应商、所有权或服务水平水平如何，云消费者均有责任建立措施以确保云端信息系统得到适当的保护。\n\
  \n为了避免供应商锁定并允许对设计的防御措施进行警惕性的改进，云消费者不仅需要制定一个采用云解决方案的计划，还要准备过渡到备云提供商或中间人。因此，在每个层和子系统层级，云消费者需要识别安全和隐私控制，并协商由哪个云参与者负责每个控制功能的实施和运行。每个云参与者都需要监控和管理服务级别和许可，并需要逐边界地支持信息系统的完整性和可用性。此外，如果到云服务的外部集成提供了功能、数据馈或服务，则需要识别所有层级并建立信息系统控制边界。此外，对于聚合的云服务，云参与者需要对维护、监控和保护外部提供的功能、交易及相关数据的方法建立清晰的所有权。\n\
  \n建立信息系统边界以及相关的风险管理影响仍然是一项全组织范围的活动，与供应商交互独立。云消费者需要与所有参与云生态系统解决方案编排的者进行仔细协商，以满足组织的所有业务需求、所有关于信息安全的复杂技术考量以及对组织的程序化成本。\n\
  \n为了为数据构建基础级保护并为云端信息系统提供足够的整体安全态势，云提供商和云技术中间人实施的继承安全和隐私控制（当参与编排时）需要在每个边界处进行适当的评估和监控。为了提升系统的安全态势并保护与其敏感性相适应的数据，云消费者通常需要通过参数选择或实施补偿性安全和隐私控制，来对现有控制进行裁切。由于数据所有者保留确保所有云安全控制得到持续管理和跟踪的责任和义务，在安全计划和服务协议中纳入对以下内容的清晰协调和考虑是重要的：\n\
  \n*   针对云端系统的安全控制的选择、实施、评估和监控\n*   云服务功能的变化对云端信息系统整体安全态势的影响以及对该系统支持的任务和业务流程的影响\n\
  *   信息系统的变更对云服务及其控制的影响\n\n由云消费者识别并由云参与者实施的安全控制被记录在整体信息系统的安全计划中，并在风险管理过程中对其有效性进行评估（即在信息系统的初始授权期间，以及随后的持续监控过程中）。如果在信息系统获得运行许可后增加了额外功能，也应对云安全控制的有效性进行评估。\n\
  \n作为数据所有者，云消费者需要采取适当措施，确保云系统任何内部边界内的变化不会影响整个系统的安全态势。此外，他们需要在数据层、应用层、平台层和基础设施层聚合从云提供商和云技术中间人处获得的所有相关信息，并对聚合信息进行整合、实时监控和安全影响分析。\n\
  \n以下章节将识别并讨论云生态系统中的每个逻辑或物理边界。在构建云端信息系统和编排支持性的云生态系统时，云消费者首先对用户数据和应用程序进行分类，并识别相应的边界。接下来，消费者需要识别支持应用程序和保护数据所需的功能能力或组件、对应于服务模型的多个边界、云生态系统的编排、云部署模型，最后同样重要的信任边界。在接下来的章节中，我们将讨论这些边界。\n\
  \n### 14.7.1 用户数据边界\n\n\n\n\n云生态系统的核心是用户数据边界（user-data boundary）。该边界跨越云生态系统的所有堆栈功能层，并包含了云消费者的数据，这些数据定义了所有外部层所需的安全级别。用户数据边界与表示边界、API\
  \ 边界和应用边界交叉的方式，要求清晰理解存储在用户数据边界内的信息的价值，以及为了部署上述外部功能层所需的相应安全控制措施。\n\n作为云生态系统的中心，用户数据边界（图\
  \ 14.5）包含了包含在用户数据边界内的用户数据。用户数据边界是用户数据在云消费者之间以及跨越所有云参与者在云生态系统中传输时的逻辑容器化。当用户数据边界内包含的用户数据从云提供者移动到云消费者时，用户数据边界跨越表示边界、API\
  \ 边界和应用边界，并需要确保这些信息的安全性。\n\n![图 14.5 用户数据边界。](img/fig14.5.jpg)\n\n图 14.5 用户数据边界。\n\
  \n利用边界方法的以数据中心的架构要求云生态系统的所有元素都根据云消费者数据的敏感性进行设计和部署。\n\n## 14.7.2 服务边界\n\n服务边界是一个通用概念，用于识别云消费者获取或由消费者以外的云参与者实现的服务层。根据\
  \ NIST SP 800-145 中定义的架构服务层，这种通用服务边界可以是 IaaS、PaaS 或 SaaS 类型：\n\n*   SaaS 边界\n  \
  \  *   表示模态边界\n    *   表示平台边界\n    *   应用程序接口边界\n    *   应用边界\n    *   数据边界\n  \
  \  *   元数据边界\n    *   内容边界\n*   PaaS 边界\n    *   集成与中间件边界\n*   IaaS 边界\n    *  \
  \ 应用程序接口边界\n    *   核心连接与交付边界\n    *   抽象边界\n    *   硬件边界\n    *   设施边界\n\n后续章节讨论了边界定义的关键要素和可接受风险。由于这些章节提供了消费者的视角，因此消费者管理的功能被视为内部的；为了更好地突出围绕用户数据的分层以数据中心的架构，定义消费者管理层的边界被称为**内部服务边界**。相比之下，定义由其他云参与者（提供商、技术经纪人等）管理的边界将被称为**外部服务边界**。此外，由于三种类型服务边界在图形表示上的相似性，下方仅提供了\
  \ PaaS 边界的图形表示。\n\n### 14.7.2.1 IaaS 安全边界\n\nNIST SP 800-145 对 IaaS 的定义如下：\n\n提供给[云消费者]的能力是提供处理、存储、网络和其他基础计算资源，消费者可以在其中部署和运行任意软件，这些软件包括操作系统和应用程序。[云消费者]不管理或控制底层的云基础设施，但对操作系统、存储和部署的应用程序具有控制权；并可能对选的网络组件（例如主机防火墙）具有有限控制权。\n\
  \n既有内部边界也有外部边界，云消费者必须与云提供者建立这些边界，以划定管理控制和责任范围。\n\nIaaS 边界在基础设施层划分云生态系统，通过以服务的形式暴露\
  \ `IaaS API`，同时将消费者外部的层定义为包含核心连接、硬件和设施的互连堆栈。\n\n从逻辑上讲，IaaS 边界之外是生态系统编排边界、云部署边界和信任边界。内部和外部\
  \ IaaS 边界需要协调，以建立可接受的信任水平，并与其他云参与者协调安全工作。\n\n消费者通过与任何签约的服务提供者协作，在 IaaS 边界内建立信任。无论服务是否在消费者的控制范围内提供，都必须在\
  \ IaaS 上建立信任。定义良好的边界应清晰地划定服务边界内安全、隐私和服务质量的责任。消费者需要评估与系统边界内外其他参与者的所有接口（逻辑和物理）的信任度。\n\
  \n云消费者选择的云部署模型直接影响与云提供者之间的信任关系。对于 IaaS 服务模型，云消费者对所提供的服务比云提供者或其他参与者承担更高级别的责任。\n\n\
  ### 14.7.2.2 PaaS 安全边界\n\nNIST SP 800-145 对 PaaS 的定义如下：\n\n提供给[云消费者]的能力是在[云提供者]上部署由消费者创建或获取的应用程序，这些应用程序是使用提供者支持的编程语言、库、服务和工具创建的。[云消费者]不管理或控制底层的云基础设施（包括网络、服务器、操作系统或存储），但对部署的应用程序以及应用程序托管环境的可能配置设置具有控制权。（**）\n\
  \nPaaS 边界在平台层划分云生态系统，提供集成开发环境和集成点，同时将消费者外部的层定义为从操作系统环境到设施的、网络、服务器、操作系统和存储互连堆栈，允许云消费者部署或构建其选择的兼容应用程序。\n\
  \n与 IaaS 服务边界类似，基于 PaaS 的生态系统具有 PaaS 内部和外部边界，云消费者与云提供者建立这些边界，以划定管理控制和责任范围（参见图 14.6\
  \ 和 14.7）。提供者在实施和监控安全方面承担着日益增加的责任。\n\n![图 14.6 平台服务边界——消费者的层。](img/fig14.6.jpg)\n\
  \n图 14.6 平台服务边界——消费者的层。\n\n![图 14.7 平台服务边界——提供者的层。](img/fig14.7.jpg)\n\n图 14.7 平台服务边界——提供者的层。\n\
  \n图 14.7 描述了 PaaS 外部边界，它由一个互连堆栈组成，连接 IaaS 的设施边界与 PaaS 的集成边界。PaaS 边界下方是 API、连接与交付、抽象与控制以及硬件与设施边界。提供\
  \ PaaS 接口的边界需要协调，以与云提供者建立可接受的信任水平并协调安全。\n\n如前，云消费者需要评估使用系统的风险并建立风险忍度。在评估完成后授权使用云服务，消费者需要与任何签约的云参与者共同，与所有编排基于\
  \ PaaS 的云生态系统的方建立信任关系。在大多数情况下，基于 PaaS 的云生态系统中，云提供者在安全和服务协调方面承担了比云消费者更大的责任。\n\n\n\
  \n\n\n## 14.7.2.3 SaaS 安全边界\n\nNIST SP 800-145 对 SaaS 的定义如下：\n\n提供给[云用户]的能力是使用运行在[由提供者或技术经纪人管理的云生态系统内]的[云提供者]应用程序。用户可以通过各种客户端设备访问这些应用程序，通过轻级客户端界面（如网络浏览器，例如基于\
  \ Web 的电子邮件）或程序接口。[云用户]不管理或控制底层的云[生态系统]，包括网络、服务器、操作系统、存储，甚至单个的应用程序功能，但有限的特定用户应用程序配置设置可能除外。\n\
  \n云提供者必须承担起在满足所有标准合规性要求，以及实施和监控安全与隐私控制的最高程度的责任。\n\nSaaS 边界在应用层对云生态系统进行划分，将应用程序和\
  \ SaaS API 作为服务暴露出来，同时将用户外部的层定义为从应用程序层到物理设施的互连堆栈。\n\n内部 SaaS 边界由相互连接的层层边界堆栈组成，包括用户数据、呈现、API\
  \ 和应用程序。SaaS 外部边界始于 SaaS 层，并构建在 PaaS 外部边界之上。PaaS 和 SaaS 层之间存在集成边界。在 SaaS 层上暴露接口的边界需要与云提供者进行运营、安全和隐私协调，以建立可接受的信任水平。基于\
  \ SaaS 的云生态系统中的信任需要由云用户与任何约定的云主体（提供者、经纪人等）共同建立。在 SaaS 边界内，建立信任不仅更具挑战性，而且是一个更关键的组件，因为提供者承担了大多数有时是所有的部署和运行服务的责任。由于服务位于云用户的物理或逻辑控制之外，信任的建立和维护只能通过具有可执行条款和条件的、定义良好的的部署和编排边界来实现。\n\
  \n与 IaaS 和 PaaS 服务模型相比，在基于 SaaS 的云生态系统中，云提供者在实施安全隐私控制以及协调和运行服务方面承担了最大的责任。SaaS 边界内部以及内部与外部\
  \ SaaS 边界之间（对于云用户和云提供者而言）的信任水平需要达到可实现的最高水平，因此需要更具限制性的服务协议和 SLA，并附有明确的惩罚和责任。\n\n\
  ## 14.7.3 生态系统编排边界\n\n为了最大限度地减少业务支出并降低云服务的成本，提供者设计的针对尽可能多潜在客户的云解决方案集。此类解决方案让行业细分领域更容易理解并在云内部以及向云之间之间迁移工作负载。这些预封装的解决方案集通常包含相同的组件模块，具有相同的配置，并且在各种云生态系统中易于复制。本章将云生态系统定义为相互依赖组件的复杂系统，这些组件共同工作以实现基于云的信息系统。\n\
  \n非常重要的一点是，在提供基于云的信息系统时，云生态系统可以由多个协作构建它的云主体进行编排。生态系统的基础由云提供者构建。云技术经纪人可能提供多层功能，以提供中介、聚合或互操作性。\n\
  \n由经纪人或中间提供者构建的层级继承了由提供者实现的堆栈中较低层的控制措施。根据服务模型的不同，云用户为云生态系统添加功能，同时继承由所有其他云主体实施的安全和隐私控制。通常，由于云计算的多租户性质（multitenant\
  \ nature），一个云生态系统的组件会与服务不同信息系统的云生态系统共享。\n\n此外，除本地私有云外，大多数云都运行在第三方数据中心。而且，即使在本地私有云中，在极端条件下也可能存在向另一个云爆发（cloud\
  \ burst）的规定。阻碍广泛采用云计算的障碍之一是云用户无法持续监控其他云主体实施的控制措施或由这些主体管理的组件的运行。通过确保所有云主体都明确其职责，并确保云主体妥善实施安全计划中确定的约定安全和隐私控制，云主体就可以定义云生态系统编排边界，并合理评估所讨论的信息系统的特定编排带来的风险。\n\
  \n\n\n\n\n一旦建立了云生态系统编排边界，下一步的逻辑步骤是选择最符合云消费者需求的云部署模型。云部署模型有四种类型：私有、公有、混合和社区云。云部署边界是一个逻辑边界，它为评估云消费者对云端信息系统所需的独占性程度提供了一个通用框架。通常，信息系统的影响程度决定了对云部署模型的最终决择。在图\
  \ 14.9 中，云部署边界以图形形式表示，描绘了其中包含的所有元素，包括生态系统编排边界、IaaS、PaaS、SaaS 和用户数据边界。\n\n![图 14.9\
  \ 带有 PaaS 外部层的部署边界](img/fig14.9.jpg)\n\n图 14.9 带有 PaaS 外部层的部署边界。\n\nNIST 云计算参考架构\
  \ (`NIST SP 500-292`) 和 NIST 云计算安全参考架构 (`Draft NIST SP 500-299`) 文档介绍并讨论了这些部署模型：\n\
  \n*   **私有**：云基础设施供单一所有者专用使用。云实例可以由所有组织管理，也可以由第三方运行。私有云可以位于云端，也可以位于本地地。\n*   **公有**：云基础设施供公众使用，或者供大型行业组使用，并由销售云服务的组织所有。\n\
  *   **社区**：提供了一个组织用于服务于共同目的或功能的云实例。\n*   **混合**：提供了多种云模型（私有、公有、社区）的集成，这些云租户在保持其特性的同时形成一个整体。提供了通用的无协议来访问数据进行展示。\n\
  \n### 14.7.5 信任边界](#chapter14.xhtml#re_ch-14-sec-15)\n\n为了消费服务，云提供商和云消费者都必须将信任扩展到自身的\
  \ IT 资源之外，扩展云消费者与其他云参与者之间服务访问点之外。云消费者负责在其侧实施所需的安全隐私控制，但依赖于其他云参与者所实现的服务。云消费者实施的许多安全和隐私控制继承自其他云参与者。因此，云消费者信任云提供商及相关参与者实施必要的安全措施，以保护云消费者的数据并履行服务协议和服务水平协议（如果存在）。识别所有系统组件、破解这一复杂生态系统的复杂性、识别为云端信息系统服务并构成云生态系统的所有信任组件的逻辑边界——信任边界，并在云参与者之间建立信任关系，对于云消费者以及云端信息系统的成功部署和运行至关重要。\n\
  \n信任边界是逻辑周边界，通常跨越物理边界，代表了已建立云生态系统内的云端 IT 资源受信任的程度（概念的图形表示请参见图 14.10）。\n\n![图 14.10\
  \ 信任边界——概念解释](img/fig14.10.jpg)\n\n图 14.10 信任边界——概念解释。\n\n这种扩展的信任边界包含了来自所有云参与者的资源，并从云消费者的视角识别了云端信息系统及其支持子系统的逻辑动态边界。信任边界是弹性的，并根据资源配置或销毁触发的云生态系统动态变化，以及数据的安全传输或静态存储进行调整。\n\
  \n为了在云生态系统中建立并维护信任，云消费者需要能够检查部署在该边界内部的安全控制，并确定组织对运行此云端信息系统所产生的机密性、完整性和可用性风险的容忍度。与云提供商建立协议的典型方法是通过服务协议和服务水平协议，这些协议描述了安全需求、能力以及约定的标准、策略和信任实施方法（包括监控和审计）。\n\
  \n图 14.10 将信任边界描绘为最外层的边界。例如，在 IaaS 云生态系统中建立信任并识别信任边界，意味着在设计时建立创建受信平台并将其聚合到受信资源池的流程。在运行时，随着云的多租户和资源池化特性的显现，信任边界变得具有弹性并进行动态调整。例如，从本地资源向云端的突发性扩展需要信任边界动态重塑，以覆盖突发性的云计算基础设施，因此该基础设施需要被信任。在另一端，访问云资源的用户也需要被信任，因此支持它们的身份验证和访问控制机制以及连接它们与资源的网络也需要被信任。在这种情况下，信任意味着已经建立了保证级别，评估了组件的安全态势，并根据用户数据边界处数据的敏感性，对所有处理方面的残余风险进行了评估。\n\
  \n在运行时，审计和日志需要支持保证机制，以确保信任边界的所有关键方面都适用于工作负载处理，并满足数据机密性、完整性和可用性要求。还需要对安全计划的状态持续监控，它是风险管理过程的关键部分。对组织的安全架构以及相应的安全策略和控制进行监控，以确保在考虑任何变化的情况下，整个范围内的操作保持在可接受的风险水平。\n\
  \n### 14.8 定义你的信任根](#chapter14.xhtml#re_ch-14-sec-16)\n\n信任是一种具有特定层次结构的非传递关系。这意味着信任沿着链向下流动，直到到达信任根。云实现具有多个抽象层，从硬件到虚拟化再到客体操作系统。用户数据的安全和隐私取决于云生态系统的完整性和信任度，而这取决于可能操纵或破坏数据完整性或机密性的层的累积信任度。每一层的信任都依赖于硬件或软件安全模块\
  \ (`HSM/SSM`)，这些模块是本质上受信任的，并执行设计用于保护云栈每一层数据和操作的加密功能。\n\n\n\n\n在以数据为中心的架构中，云消费者拥有与其云消费者用户数据及相关用户数据边界相关的信任根至关重要。这意味着云消费者需要拥有\
  \ `HSM/SSM` 使用的加密密钥，该硬件/软件负责保护云层（存储、虚拟化程序、虚拟机 [`VM]`、应用程序以及处于租用中、传输中和内存中的用户数据）。云消费者应根据其中存储数据的敏感性，拥有用于保护云生态系统“最小公分数”的密钥。包含非敏感数据的信息系统可能只需要对云承载者进行加密。包含更敏感信息的信息系统可能需要\
  \ `VM` 或存储加密，其中云消费者拥有密钥，并使用硬件或软件加密设备解锁 `VM` 或存储。云访问安全代理（CASB）用于加密云提供商内部传输中和静态存储的数据，确保云消费者的数据在穿越云生态系统时始终保持加密状态。定义信任根是云架构的关键要素，且应该在为信息系统发布安全授权之前确定。\n\
  \n## 14.9 管理用户身份验证与授权\n\n理解并定义云参与者之间的用户身份验证与授权是云架构的另一个关键要素。如果不知道谁正在登录基于云的信息系统，以及谁在访问什么数据，云参与者将无法保护云生态系统所存储的数据。了解用户是谁、他们试图访问什么数据、数据存储在何处，以及用户试图如何获取这些数据——这些都是帮助云消费者确定适当云架构和部署模型的关键信息。\n\
  \n用户身份验证是建立对用户身份信任的过程，通常通过输入有效的用户名和有效的令牌（密码、密钥和生物识别信息），用以授予访问特定信息系统（或）或资源的权限。身份验证服务器将用户的身份验证凭证与存储所有用户凭证的数据库进行比较。凭证是一个对象或数据结构，它权威地将身份（以及可选的附加属性）绑定到用户拥有并控制的令牌上。例如，用户名和密码对就是一种数据结构或凭证。如果提供的凭证与身份验证数据库中的信息匹配，则授予用户对该信息系统的访问权限。如果凭证不匹配，则身份验证失败并拒绝访问。\n\
  \n所使用的凭证类型应与云消费者用户数据敏感性定义的定义的保证级别相适应。通过利用用户、数据和位置，如果上述任何一个变量发生变化，就可以使用不同级别的凭证。例如，如果一个云用户目前位于美国并通常通过其个人电脑上的网页浏览器访问云信息系统，他们将会被提示输入用户名和密码以访问该系统。在后台，信息系统可以验证从用户设备收集的额外信息，例如地理位置、IP\
  \ 地址等。当同一云用户进行国际旅行并通过公共电脑上的网页浏览器访问云信息系统时，云信息系统的身份验证服务器可以识别出不同的 IP 地址或不同的地理位置。一旦从用户设备中收集到这些新信息，系统就可以提示用户提供额外的凭证以获得更高水平的保证，并在授予此类访问权限之前验证用户的身份。\n\
  \n用户授权是执行策略的过程，例如确定用户被允许访问哪些资源或服务。通常情况下，用户授权发生在身份验证的语境中。一旦用户通过了身份验证，他们就可能被授权访问云信息系统的不同组件。确保用户授权应用于云生态系统中每个元素的“最小公分数”，对于确保存储在云信息系统中的数据安全至关重要。授予用户超过其所需的权限可能会损害系统。此外，保护并保护用户凭证以防篡改或滥用是至关重要的，并且需要作为基于云的信息系统安全授权程序中所采用的安全策略的一部分。\n\
  \n在云生态系统中执行授权策略至关重要。这种执行可以通过用户身份验证和授权工具来实现。\n\n## 14.10 总结\n\n总结来说，技术的进步导致了无处不在的云计算，它已成为满足许多技术需求的可行方案。然而，为了让云消费者充分利用云计算的规模效应，建立必要的信任并获得可见性至关重要。这应当充分利用云提供者和云技术商提供的先进技术，并根据业务的速度和动态变化弹性地配置资源。\n\
