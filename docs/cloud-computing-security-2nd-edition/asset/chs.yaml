  \ 和 Rasib Khan\n\n\n\n\n# 前言\n\n我曾质问过一家大型电信公司的 IT 执行官，他是否已经对公司拥有的数千台计算机采取了安全措施。他说：“等我找到它们的时候。”那是\
  \ 25 多年前的事。但现在，这可能同样描述了保护云端计算资产的努力，就像那时计算机分布在中西部各州的几十栋建筑中一样。\n\n\n\n\n\n在本书中，John\
  \ R. Vacca 探讨了保护云端 IT 资产的基础问题和挑战。他提供了实用的知识和可操作的建议。他还针对针对 IT 资产管理提供了一些非常可靠的公理。例如，你需要了解你拥有什么、它们有什么用、位于何处、如何工作、需要做什么来确保其安全并确保它们在需要时可用。\n\
  \n云端并非万事完备的魔法之地。它和其他任何拥有 IT 资产的地方一样。我强烈建议你阅读这本书。\n\n**Michael Erbschloe (1951–2019)**\n\
  \n信息安全顾问\n（Michael Erbschloe 曾在密苏里州圣路易斯市韦伯斯特大学教授信息安全课程。）\n\n# 前言\n\n## 涵盖范围\n\n\
  本综合手册既是一本专业参考书，也是从业者指南，提供了今天最完整、最简洁的云计算安全视角。它深入涵盖了云计算安全理论、技术和实践，并涉及了既有技术以及最新进展。它探索了解决各种云计算安全问题的实际解决方案。各章节由领域的领先专家撰写，探讨了各自专业领域中面临的短期和长期挑战。\n\
  \n本手册的主要受众是对于监控和分析特定可测量云计算安全环境感兴趣的工程师/科学家，这些环境可能包括：运输和/基础设施系统、机械系统、地震事件和水下环境。这本书对于对战术监控以及移动云计算安全目标分类与跟踪感兴趣的安全及相关专业人士也有用；其他对使用云计算安全来理解特定环境感兴趣士；学术界、政府和工业界的人员；任何寻求利用云计算安全技术获益的人（包括评估云计算的架构、组件、操作和工具）；以及任何参与云计算安全方面且具有云计算入门知识或同等经验的人员。本综合参考书和从业者指南对于云计算安全高年本科和研究生课程的学生也具有价值。\n\
  \n## 本书结构\n\n本书分为八部分，由各领域领先专家撰写的 34 章组成，以及五个附录，其中包括一个详尽的云安全术语和缩写表。\n\n### 第一部分：引论\n\
  \n第一部分讨论了云计算的基础知识，例如云计算服务模型——如软件即服务 (SaaS)、平台即服务 (PaaS)、基础设施即服务 (IaaS) 和桌面即服务 (DaaS)，包括公共云、私有云、虚拟私有云和混合云。还讨论了网络安全基础以及软件和数据隔离安全。\n\
  \n`Chapter 1`，“云计算基础”通过介绍云计算核心思想的见解为本书奠定了基础，该思想是将软件和硬件资源的管理和交付外包给第三方公司（云提供商），这些公司专门从事特定服务，并以更方便的方式以更低的成本提供更优质的服务。此外，作者们还介绍了云计算的关键概念和赋能技术，包括虚拟化、负载均衡、监控、可扩展性和伸弹性。\n\
  \n`Chapter 2` “云计算概述”对云计算的基本概念进行了详细描述。接下来讨论了云提供商通常提供的主要服务类型。然后，该章节查看了云系统的各种部署模型，随后检查了分别由\
  \ `NIST` 和 `ITU-T` 开发的两种云计算参考架构。对这两个不同模型进行考虑，有助于洞察云计算的本质。\n\n`Chapter 3` “云安全基线”介绍了云计算安全的要要，这是该领域面临的主要挑战之一。它从计算机安全概述开始，讨论了机密性、完整性和可用性这三大支柱，以及真实性和不可否认性等其他重要概念。该章节还讨论了泛义意义以及云计算背景下的漏洞、威胁和攻击。随后，本章节回顾了针对云计算威胁的最常见缓解措施。它还讨论了云存储服务中的隐私和安全，以及多云和云责任制。该章节以总结和对研究挑战的讨论结束。\n\
  \n`Chapter 4` “云安全、隐私与信任基线”引入了一种替代分类方法，将风险分为三类。第一类包括针对云系统基础设施和主机的威胁。第二类是关于影响服务提供者的威胁，第三类则包括各种其他通用安全威胁。所提分类的目的是为云系统创建一个非常高效的安全检查清单，对于任何愿意构建或使用云基础设施的人都有用。\n\
  \n`Chapter 5` “基础设施即服务 (IaaS)”检查了云基础设施的主要组件，以及帮助人们思考该架构安全的一些概念。无论云环境是私有的、公有的还是混合的；它是执行业务关键任务还是支持辅助活动；它存储了公司的核心数据还是没有任何数据——理解安全实践和控制在云环境中如何工作，将允许人们根据任何情况应用正确的安全措施以满足其风险承受能力。\n\
  \n### 第二部分：风险分析与责任划分\n\n\n\n\n\n# 第 6 章：风险与信任评估\n\n“风险与信任评估：云服务方案”对各种机构开展的云风险评估进行了综述，并介绍了为云环境开发的风险和信任模型。下一节涉及风险分析、评估与管理，作者在其中节定义了风险，并详细阐述了风险分析、评估与管理之间的关系和区别。随后，他们介绍了近期用于分析威胁和漏洞的研究，其中包括云安全联盟（CSA）的倡议，该倡议旨在分析针对云的主要威胁，并深入了解云服务提供商（CSP）对这些威胁的准备情况。接下来，介绍了由两个欧洲机构开展的云风险评估，即欧洲网络和信息安全局（ENISA）和法国国家信息与自由委员会（CNIL）。他们还介绍了由\
  \ A4Cloud 开发的两个模型，A4Cloud 是一个欧洲框架“七项项目”。第一个模型是云采用风险评估模型（CARAM），是一种定性模型，它根据 `CSPs`\
  \ 实现的控制措施以及 `CC` 计划在云中处理或存储的资产，将 `ENISA` 和 `CNIL` 框架适配特定的 `CSP CC` 组合。第二个模型被称为联合风险与信任模型（JRTM），是一种基于\
  \ `CSP` 性能数据的定量模型。\n\n# 第 7 章：云中风险管理\n\n“云中风险管理”探讨了与云信息系统操作和使用相关的 3 级安全风险。为了防止和缓解任何威胁、不利影响行为、服务中断、攻击或破坏，组织需要将其残余风险量化至可接受水平的阈值以下。\n\
  \n# 第 8 章：云安全风险管理\n\n“云安全风险管理”对云安全风险管理的基础方面进行了深入介绍，从风险的定义开始，并分析了云特有的风险。在风险管理方面，作者强调了云计算的合同性质，因此特别关注服务水平协议（SLAs），这一问题在近年来一直是多项相关分析和建议的主题。\n\
  \n# 第 9 章：安全云风险管理\n\n“安全云风险管理：风险缓解方法”解释了在计算机系统中存在着许多风险：硬件故障、软件漏洞、内部用户、物理安全、停电、网络中断、黑客、病毒、恶意软件、过时软件、丢失或遗忘的密码以及过期的备份。其他风险可能包括：成本增加；提供商的维护延迟；以及针对托管站点或站点的天气相关风险。管理这些风险对大多数企业来说已变得非常重要，利用技术和第三方合作伙伴来降低风险并增加运行时间是所有提供商和客户的共同目标。\n\
  \n## 第三部分：保障云基础设施安全\n\n第三部分讨论了平台安全，包括通过安全组限制网络访问、配置平台特定的用户访问控制以及集成云身份验证/授权系统。该节还涵盖了通过划分访问来保护数据的机密性和可用性，例如保护传输中数据和静态数据，以及识别您的安全边界。此外，还包括云访问控制和密钥管理、云计算架构和安全概念、安全云架构以及设计韧性的云架构等主题。\n\
  \n# 第 10 章：访问策略的规范与执行\n\n“新兴场景下访问策略的规范与执行”解决了一个不同方（数据所有者或提供者）需要协作并共享信息以执行分布式查询计算，并进行数据选择性显示的场景。接下来，作者描述了既用于授予用户访问权限又用于在查询评估时执行这些权限的解决方案。然后，他们总结了将配置文件与每个关系关联的方法，以跟踪应作为输入以获取数据数据的属性。他们还说明了一种连接评估策略，该策略向评估连接的服务器既不显示操作数也不显示结果。接下来，作者描述了一种基于成对授权定义的解决方案，用于选择性地监管数据发布。此外，他们展示了一个提议，允许用户对负责其查询评估的提供者指定偏好。最后，作者描述了一种监管每个提供者对数据视图的授权模型，并说明了组合授权的方法。\n\
  \n# 第 11 章：加密密钥管理\n\n“数据保护加密密钥管理”描述了密钥管理的基础概念、密钥管理系统的设计选择，以及云系统中有效密钥管理的挑战。\n\n#\
  \ 第 12 章：云安全访问控制\n\n“云安全访问控制：分布式访问控制”详细介绍了许多系统仅需简单的用户生成密码即可访问，而另一些系统则更为健壮。接下来，作者讨论了应用程序的需求、适用于您的法律以及您如何通过良好的安全实践来降低风险。然后，作者涵盖了通过\
  \ `SNMP`、加密、防火墙、防病毒软件和强密码来有效监控并保护任何云平台免受攻击。最后，作者关注了密码选择糟糕、笔记本电脑被盗、不同网站间共享相同密码以及离开电脑开启以便访问等主要威胁。\n\
  \n# 第 13 章：云安全密钥管理\n\n“云安全密钥管理：云用户控制”涵盖了一种基于覆盖加密的新型密钥访问控制机制。接下来，作者提出了 `LightCore`，一种具有密钥访问控制的敏感数据协作编辑云服务。然后，他们提出了一种基于覆盖加密的新型密钥访问控制机制，通过强制双加密来实现访问策略的更新。此外，作者展示了一种双头部结构，以便在授予新授权时无需重新加密相关数据资源，并在撤销发生时提出批量撤销以减少重新加密的开销，从而实现加密云存储中访问策略的有效更新。接下来，他们描述了\
  \ `LightCore` 的系统设计。最后，作者展示了实验结果，表明实现了高性能 `LightCore`，并为不同的使用场景建议了合适的密钥流策略。\n\n\
  # 第 14 章：云计算安全基础\n\n“云计算安全基础与架构”将云生态系统定义为协作实现云信息系统的相互依赖组件复杂系统。接下来，作者讨论了建立信任的重要性并引入了信任边界的概念。然后，他们识别并讨论了云生态系统中每个逻辑或物理边界。最后，作者讨论了边界定义和可接受风险的关键要素。\n\
  \n\n\n\n\n# 第 15 章 (#chapter15.xhtml#chapter15)，“云计算架构与安全概念”侧重于客户和用户可以通过互联网等网络轻松访问的云服务和资源。它还将关注按需服务或资源，客户可以根据自己的需求和要求随时随随地使用这些资源。此外，作者还将向您展示在某些情况下如何自动实现高度可扩展的资源和服务能力。最后，本章将涵盖计量服务，即对分配的资源和力（如存储、处理和内存）的使用进行控制、测量、管理和报告，以便客户和提供商都能对资源的需求和消耗有清晰的视图。\n\
  \n# 第 16 章 (#chapter16.xhtml#chapter16)，“安全云架构”探讨了公共云中隐私和安全的范围及其性质。此外，在本章中，作者回顾了云计算安全的各个方面，因为它是构建云服务的基石。他们的主要重点是公有云，但某些安全方面也适用于私有云，甚至是混合云。\n\
  \n## 第四部分：操作系统与网络安全\n\n第四部分讨论了如何锁定云服务器：漏洞扫描与修补，以及配置管理的控制与验证。本节还涵盖了利用特定提供商的安全选项：定义安全组以控制访问；通过端口号过滤流量；利用提供商的内置安全功能；以及保护存档数据。例如：\n\
  \n# 第 17 章 (#chapter17.xhtml#chapter17)，“锁定云服务器”概述了在 IaaS 云服务提供商环境中锁定云服务器的基本安全措施。它还将解释云服务器管理员可以使用的一些关键安全特性，以确保所部署的虚拟机是“默认安全的”。\n\
  \n# 第 18 章 (#chapter18.xhtml#chapter18)，“用于数据外包的第三方提供者完整性保障”涵盖了用于云存储完整性审计的系统模型和威胁模型。然后，作者回顾了提出的针对云存储第三方完整性审计的现有\
  \ `POR` 和 `PDP` 方案。最后，他们介绍了如何设计一种第三方完整性审计，使其能够同时实现动态数据共享、多用户修改、公共可验证性，以及在数据大小和数据文件数量方面的高可扩展性。\n\
  \n## 第五部分：满足合规性要求\n\n第五部分讨论了云治理管理，包括保留对数据准确性的责任、验证存储和传输数据的完整性，以及证明尽职调查和正当谨慎。该节还涵盖了：数据外包的完整性保障、安全计算外包、完整性与可验证计算、独立验证与确认、加密数据计算以及可信计算技术。此外，本节重点关注符合政府认证和认可法规的合规性，包括：`HIPAA`、`Sarbanes-Oxley`、《数据保护法》（`PCI\
  \ DSS`、信息系统审计标准以及第三方提供商审计的谈判。\n\n# 第 19 章 (#chapter19.xhtml#chapter19)，“与供应商谈判云安全需求”回顾了谈判的几种取向，并探讨了在从基于云的服务提供商购买的信息技术产品或服务的组织安全需求背景下，这些取向的影响。\n\
  \n# 第 20 章 (#chapter20.xhtml#chapter20)，“在云中管理法律合规：理解合同和个人数据保护需求”提到了在云环境中需要考虑的提示和建议。\n\
  \n# 第 21 章 (#chapter21.xhtml#chapter21)，“数据外包的完整性保障”调查了过去几年提出的几种 RDIC 方案。作者首先介绍了静态设置下的\
  \ RDIC 方案，在这种情况下初始存储的数据不会改变。然后，他们转向允许数据所有者执行更新的 RDIC 方案。\n\n# 第 22 章 (#chapter22.xhtml#chapter22)，“安全计算外包”帮助读者理解安全计算外包的挑战，并熟悉最先进的解决方案以及该领域的开放问题。\n\
  \n# 第 23 章 (#chapter23.xhtml#chapter23)，“加密数据计算”介绍了几种不需要用户密钥即可对加密数据进行计算的方法。作者随后关注非交互式方法，用户一旦将数据上传到云端就不再需要参与。特别是描述了以下类别的技术：同态加密、函数加密和程序混淆。在本章的最后部分，作者查看了用户和云共同计算数据的变方法。\n\
  \n# 第 24 章 (#chapter24.xhtml#chapter24)，“可信计算技术”旨在更好地定义一个特定领域，涵盖硬件信任根和服务器端的现有技术。作者解决了云信息安全的核心关注领域，确保针对\
  \ `UEFI`（统一扩展固件接口）和 `BIOS`（基本输入输出系统）硬件的底层攻击对系统管理员是可见的。\n\n# 第 25 章 (#chapter25.xhtml#chapter25)，“云云安全技术：调查与开放问题”专门探讨了可信执行技术，该技术在保护代码执行和访问付费数据方面有着长期的尝试（部分成功）。特别是，作者调查了可信计算技术，强调了既有技术和创新解决方案的优缺点。他们深入研究了此类技术的现状，并讨论了它们在云中的用法。\n\
  \n# 第 26 章 (#chapter26.xhtml#chapter26)，“可信计算技术与解决云计算问题的建议”表明，对云计算系统的软件环境进行验证是行的，无论是对于运行单个操作系统还是运行多个托管虚拟机系统的节点。\n\
  \n# 第 27 章 (#chapter27.xhtml#chapter27)，“确保符合政府认证和认可法规”回顾了与云信息系统认证和认可相关的政府法规以及相关的认证和认可体系。\n\
  \n# 第 28 章 (#chapter28.xhtml#chapter28)，“政府认证、认可、法规与合规风险”描述了云计算背景下的政府和特定国家需求。它解释了可以作为云基线的现有国际标准和证明，并概述了该领域的一些风险。\n\
  \n## 第六部分：灾难恢复准备\n\n\n\n\n\n VI 讨论了维持可用性计划的实施，这包括将数据分布到云端以确保可用性和性能，并解决因云服务商变更引起的数据可移植性和互操作性问题。该部分还包含了利用云进行灾难恢复的方案：实现具有效益的恢复时间目标，并采用冗余策略以更好地抵抗拒绝攻击（DoS）。最后，本节重点关注数据中心内部及跨数据中心的安全数据管理，以及可用性、恢复和审计。\n\
  \n第 29 章“通过云数据中心简化安全云计算环境”深入探讨了使用云数据中心的特定安全和风险方面，以及云客户如何评估和基准测试所选云数据中心提供商的安全性。\n\
  \n第 30 章“跨数据中心的可用性、恢复与审计”介绍了基于复制、基于纠删码和基于网络编码的分布式存储系统的 RDIC 技术。本章还描述了最近为分布式 RDIC\
  \ 范式提出的新方向。\n\n## 第七节：高级云计算安全\n\n第七节侧重于高级故障检测与预测、高级安全移动云、云计算安全的未来方向——风险与挑战、具有高级安全服务的云计算，以及用于云计算的高级安全架构。\n\
  \n第 31 章“云计算的高级安全架构”分析了公有云的特殊之处，以及在迁移服务之前哪些风险和威胁真正值得关注。\n\n第 32 章“云流量的侧信道攻击与防御”简要回顾了一些必要的定义。然后，作者们讨论了现有的应对措施。接下来，他们描述了流量填充方法，以在不同的场景和假设下，实现隐私保护、通信与计算成本之间的最佳权衡。最后，作者们讨论了一些开放的研究挑战。\n\
  \n第 33 章“云是邪恶的”向你展示了如何寻找并与供应商及服务建立联系，以及这些供应商和服务如何反向连接你及其他人。本章旨在警告人们要避免和拥抱的事物。它还涵盖了在向云端迈进的过程中，你需要忘记哪些信息安全传统，以及需要拥抱哪些传统。\n\
  \n第 34 章“云计算安全的未来方向：风险与挑战”讨论了云计算如何成为主导计算范式。它还讨论了由于在活性、性能和效率方面的巨大优势，云计算如何被几乎所有行业缓慢但稳定地采用。本章还描述了随着更多行业迁移到云计算，云计算不仅要完全应对性能预期，还要应对所有类型的潜在安全问题、风险和挑战，这变得非常重要。此外，本章强调，由于云计算仍然是一项新技术，现在是批判性地思考安全考量并为下一代计算做好做好准备了。最后，本章建议在医疗、银行和政府等关键领域广泛应用云，并指出识别主要问题并主动向可信云迈进是关键一步。\n\
