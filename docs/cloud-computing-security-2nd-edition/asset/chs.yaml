  \   参考文献\n*   进阶阅读\n\n### 1.1 云计算简介\n\n云计算正被誉为解决流量激增不、计算过载以及数据处理和备份中潜在昂贵硬件投资问题的终极方案\
  \ [1]。它通过重塑硬件的设计和购买方式，可能会改变 IT 行业，使软件和基础设施作为服务更具吸引力。在实践中，云计算是一种计算范式，通过在互联网提供动态可扩展且通常是虚拟化的资源，来补充基于互联网的现有\
  \ IT 服务消费和交付模型。\n\n\n\n\n云计算范式并不是新概念，可以被看作是我们使用互联网方式的延伸。事实上，`cloud` 一词也被用来代表互联网。云计算的核心思想是将软件和硬件资源的管理和交付外包给第三方公司（云提供商），这些公司专门从事该特定服务并能够以更方便的方式以更廉的成本提供更优质的服务。例如，现在企业可以根据实际需求购买硬件资源的访问权限，而无需支付预付成本。如果需求减少，企业可以减少其付费的远程硬件资源量；如果需求增加，企业可以轻松根据需求调整资源。尽管这种分布式计算范式具有巨大的优势，但新的挑战也随之产生，特别是与数据和计算安全相关的挑战。由于计算资源在场外，企业对其资源和数据的控制程度不再相同。在大多数情况下，他们对所操作资源的安全性和保护水平没有保障。例如，一个企业可能会购买一个被攻击者破解的操作系统的访问权限，攻击者可以窃取其数据或干预其计算。公司数据可能存储在另一个国家，那里的数据所有权法律可能与公司的预期不同。例如，一个决定将数据库存储在美国云提供商那里的欧洲云消费者可能会发现，由于美国《爱国者法》，其数据会受到检查。由于云计算市场不受监管，且云提供商与云消费者之间的服务水平协议（`SLAs`）内容模糊，仍然很难让云提供商承担安全违规的责任。\n\
  \n云计算的主要优势是便利性和降低成本。云提供商专注于他们提供的服务：租用硬件、操作系统、存储和软件服务。因此，公司不需要聘用各种 IT 人员，而可以专注于其首要任务。例如，公司不需要配备专门负责备份的人员，因为它可以从专从事备份的公司（如\
  \ `Code42 CrashPlan`）购买此类服务 [2]。备份云提供商提供的服务可能比聘用临时人员来维护要好得多。与便利性相关，这种计算外包模型还减少了企业的预付和持续成本。公司不需要为资源消耗的波动做计划。云计算服务以按需付费模式运行，并将设备和软件更新及维护等繁重任务从云消费者手中解放出来。云消费者可以将未来设备投资和管理中节省的资金投入到任务具有战略意义的领域。\n\
  \n美国国家标准与技术研究院（`NIST`） [3] 将云计算定义为“一种实现无处不在、便利、按需网络访问共享可配置计算资源池（例如网络、服务器、存储、应用程序和服务）的模式，这些资源可以以最少的管理工作或与服务提供商的交互进行快速配置和释放。”\n\
  \n## 1.2 云计算的特征\n\n`NIST` [3] 致力于提供一种统一的方法来定义云计算及其主要功能。尽管其具有复杂性和异构性，`NIST` 仍识别了代表云计算平台的五大基本特征：\n\
  \n*   **按需自服务 (On-demand self-service)**：云计算供应商根据采用者的需求，随时按需提供云资源的配置。按需自服务的资源源寻被认为是云计算范式的一个关键特征，因为它允许用户在不中断主机操作的情况下，将所需的基础设施扩展到相当的水平。\n\
  *   **广网访问 (Broad network access)**：可以通过基础网络连接为多种设备类型访问和配置云计算资源。\n*   **资源池化 (Resource\
  \ pooling)**：资源被池化以实现更高效、有效的使用。通过多租户和虚拟化技术，同一台物理硬件可以为多个用户提供服务。\n*   **快速弹性 (Rapid\
  \ elasticity)**：云计算资源是弹性的，可以根据需要实时进行“尺寸调整”和“重新调整大小”。当客户需要更多（或更少）服务器或存储时，可以调整资源分配。云弹性的核心涉及云端网络及相关控制的持续重配置。`NIST`\
  \ 区分了两种扩展类型：水平扩展和垂直扩展，分别涉及启动额外的服务和/或资源，以及更改所分配资源的计算能力。\n*   **垂直扩展 (Vertical scaling)**：垂直扩展涉及在保持物理机器数量不变的同时，更改分配给资源的计算能力。\n\
  \n其他区分云计算环境与标准本地计算环境的特征特征是资源的虚拟化和多租户性（图 1.1）。多租户是公有云和私有云的关键共同属性，并适用于云的所有三层。它指的是从同一基础设施和软件应用程序为多个租户提供服务的能力。在某种程度上，多租户是虚拟化的副产品。虚拟化使得能够创建虚拟机、软件应用程序和工具，从相同的物理基础设施中同时为多个租户提供服务。\n\
  \n![图 1.1 多租户与虚拟化。](img/fig1.1.jpg)\n\n图 1.1 多租户与虚拟化。\n\n在云环境中，计算资源是远程的，并作为虚拟化资源呈现给云消费者。云消费者在购买硬件平台的访问权限时，无法访问实际专用硬件，而是访问一个虚拟平台。其他资源（如\
  \ `Google Docs` 等云软件也在许多云消费者之间共享。租户之间是隔离的，就像现代操作系统中的进程之间相互隔离一样。\n\n云计算服务按按需付费模式提供，并遵循“计量服务”模型。云提供商根据各种原因衡量或监控服务的提供，包括计费、资源有效利用或整体预测规划。各种特定用途的指标（网络\
  \ I/O、使用的存储空间等）被用于计算采用者的费用。\n\n## 1.3 云计算模型\n\n云计算根据其提供的服务包含多种实现，从应用程序服务配置到网格计算和公用计算。下面我们将讨论云范式下最著名的模型。\n\
  \n### 1.3.1 服务模型\n\n云计算资源是异构的，从软件服务到数据存储，再到操作系统和硬件基础设施。根据服务的类型或粒度，有不同的云交付模型：基础设施即服务\
  \ (`IaaS`）、平台即服务 (`PaaS`）和软件即服务 (`SaaS`）。云消费者通过安装在各种场所（组织建筑）和设备（台式电脑、笔记本电脑、平板电脑和智能手机）上的云客户端应用程序访问云资源。图\
  \ 1.2 展示了这三个模型，它们将在后续的小节中进行介绍。\n\n\n\n\n![图 1.2 云计算交付模型：基础设施即服务 (IaaS)、平台即服务 (PaaS)\
  \ 和软件即服务 (SaaS)。](img/fig1.2.jpg)\n\n图 1.2 云计算交付模型：基础设施即服务 (IaaS)、平台即服务 (PaaS) 和软件即服务\
  \ (SaaS)。\n\n### 1.3.1.1 基础设施即服务 (IaaS)\n\n在这种模型中，硬件、存储、IP 地址和防火墙等原始 IT 资源通过互联网提供给云消费者。虚拟机管理器（如\
  \ `Xen`、`Oracle VirtualBox`、`KVM`、`VMware ESX/ESXi` 或 `Hyper-V`）在真实的 IT 资源上运行一组虚拟机，并为云消费者提供这些资源的虚拟化版本。云消费者可以自由地在这些平台上安装任何环境和他们所需的软件，并在管理这些资源以及控制其安全可靠性方面拥有极大的自由。`IaaS`\
  \ 云提供者的示例包括 `Amazon Web Services (AWS)`、`Windows Azure`、`Google Compute Engine`、`Rackspace\
  \ Open Cloud` 和 `IBM SmartCloud Enterprise`。\n\n### 1.3.1.2 平台即服务 (PaaS)\n\n对于希望实现更高层次计算和管理外包的云消费者，云提供者还提供了即用的平台服务。在这种模型中，可以租赁一个安装了操作系统镜像的完整虚拟化环境。通常还会提供开发平台、Web\
  \ 服务器和数据库。获取特定平台后，云消费者可以自由地安装和管理运行在虚拟化环境中的应用程序。对系统的治理和控制水平也随之降低，因为云提供者负责平台的安装、管理和打补丁。硬件和操作系统层面的安全完全依赖于云提供者的策略和机制。\n\
  \n### 1.3.1.3 软件即服务 (SaaS)\n\n最细粒度的交付模型是云消费者通过互联网访问第三方软件。访问权限可以是免费授予的（例如 `Google\
  \ Docs`），也可以通过订阅模式提供（例如用于文件同步的 `DropBox` 或用于照片管理的 `SmugMug`）。云消费者对云软件的运行方式以及其访问数据的安全性几乎没有控制权。云软件提供者承担了所有的管理负担。\n\
  \n### 1.3.2 部署模型\n\n云服务的部署方式可能根据服务的所有权、云资源的大小以及客户端访问的限制而异。主要有三种模型：公有云、私有云和混合云。\n\
  \n公有云（[图 1.3]）由第三方所有，并将云资源向普通公众商业化。一切运行方式就像组织将 IT 资源、环境和软件供应的服务外包给了场外的第三方一样。在这个环境中，多个不同的组织或个人可能通过多租户和虚拟化共享一个物理资源（例如服务器）。安全性是一项挑战，因为云客户端依赖云提供者来保证异构客户端组之间数据和计算的隔离。公有云的示例包括\
  \ `Microsoft`、`Google` 和 `Amazon`。\n\n![图 1.3 公有云供公众访问。](img/fig1.3.jpg)\n\n图 1.3\
  \ 公有云供公众访问。\n\n私有云（[图 1.4]）由组织所有，位于场内，并为各个部门提供 IT 资源集合。它集中了 IT 资源，使得各个部分都能体验到云的所有优势：弹性、按需自服务和可扩展性。作为云提供者，该组织承担了资源管理和可靠性的所有成本。混合云（[图\
  \ 1.5]）结合了一组公有云和私有云。例如，组织可以使用私有云运行性能密集型任务。这两个环境之间应该存在某种控制。\n\n![图 1.4 私有云通常由组织所有。](img/fig1.4.jpg)\n\
  \n图 1.4 私有云通常由组织所有。\n\n![图 1.5 混合云结合了一组公有云和私有云。(Images/fig1.5.jpg)\n\n图 1.5 混合云结合了一组公有云和私有云。\n\
  \n## 1.4 云服务与技术\n\n云计算是一种外包服务的相对新型业务模式。然而，云计算背后的技术并非完全新。虚拟化、数据外包和远程计算在过去的 40 年里已经得到了发展，而云计算为客户供应和交付此类服务提供了一种高效的方法。在这方面，云计算经常被批评为仅代表一种新趋势，而不是创新的计算技术。因此，最好将其描述为一种业务范式或计算模型，而不是特定的技术。在本节中，我们将介绍云计算的关键概念和实现技术，包括虚拟化、负载均衡、监控、可扩展性和弹性。\n\
  \n直观上，虚拟化是实现高服务器利用率和多租户的关键因素。\n\n云消费者在购买硬件平台的访问权限时，无法访问实际硬件，而是访问虚拟平台。其他资源（如 `Google\
  \ Docs` 等云软件）也在许多云消费者之间共享。租户之间相互隔离，就像现代操作系统中的进程之间相互隔离一样（[图 1.6]）。隔离技术旨在确保位于同一节点或虚拟机管理器上的虚拟环境互不干扰，并保护它们免受由于恶意软件或信息泄露导致可能的污染。这些技术是共存的核心，对于控制和保持多租户的隔离和独立有用。一些研究人员指出，虚拟资源的隔离仍然是一个开放的挑战\
  \ [4], [5]。正如 Raj 及其同事所指出的 [6]，虚拟机之间可能被隐式共享的资源（例如多核处理器上的末级缓存 (LLC) 和内存带宽）存在安全或性能干扰的机会。一些人建议，可能的解决方案是未来的云计算环境将安全和性能隔离限制作为服务水平协议（SLA）的一部分，以提高云资源的透明度（[图\
  \ 1.7]）。\n\n\n\n\n\n![图 1.6 每当公司进行合作时，它们通常会访问共享的应用程序和数据来开展业务。尽管这些公司之间存在合作关系和协议，但数据和应用程序功能对于其业务需求可能是敏感且关键的。](img/fig1.6.jpg)\n\
  \n图 1.6 每当公司进行合作时，它们通常会访问共享的应用程序和数据来开展业务。尽管这些公司之间存在合作关系和协议，但数据和应用程序功能对于其业务需求可能是敏感且关键的。\n\
  \n![图 1.7 混合云环境与设备无关，并且都安全地连接到云端。](img/fig1.7.jpg)\n\n图 1.7 混合云环境与设备无关，并且都安全地连接到云端。\n\
  \n隔离技术为多租户提供了保障，而负载均衡是可扩展计算的关键要素之一。负载均衡涉及物理或逻辑实体，负责在多个服务器之间分配网络或计算任务，以满足应用程序和网络的工作负载。在云中，这些服务器是云计算节点，负责高性能计算任务。通过负载均衡器，可以增加应用程序的容量（并发用户数）和可靠性。常见的负载均衡形式有轮询、基于优先、低延迟等。注意，负载均衡既可以在软件（运行在标准操作系统上）中实现，也可以在硬件（应用专用集成电路）中实现。\n\
  \n随着负载均衡方法而来的是复制技术。复制技术提供了一种在云中维护数据多个副本的方法，可能是基于主机的或基于网络的。通常，对于任何敏感数据存储技术，复制技术对于提供可靠性和业务连续性保障都是至关重要的。基于云的复制方法以负载均衡和动态的方式在多个位置进行数据复制。特别是，复制通常被视为提供给云消费者的许多服务之一，可以以成本效益的方式复制其本地数据，以便在发生灾难时实现更高的业务连续性和更快的恢复。\n\
  \n## 1.5 研究挑战\n\n云计算作为一种业务和计算模型出现以来，学术界和工业界的研究人员对其兴趣日益浓厚 [1]。研究途径有很多，这源于人们对云计算作为一种范式、一种商业模式及其对终端用户和组织影响的日益增长的兴趣\
  \ [7]。直到目前，已有数十个学术会议致力于云的各个方面。\n\n我们可以通过将云计算视为研究资源以及研究问题本身来组织我们对云计算研究挑战的理解。从第一个角度来看，云如何帮助回答困难的研究问题？数据密集型应用程序能否提供开启我们理解新边界的知识和答案？虽然这是网格计算架构研发的主要驱动力，但目前尚不清楚如何在科学领域（例如物理学和工程学）中优化地运行云系统。此外，如何以可靠且高效的方式实现大规模计算？致力于高性能计算的工作正努力不断改进高效且有效的计算和并行处理模型\
  \ [8]。\n\n其次，改进云服务和架构的方法有哪些？云计算是否能够以一种持续透明且又可靠的方式，为更数量的用户提供服务？\n\n大多数最近的工作侧重于改进服务供给，解决与并行化、可扩展性、效率和大规模处理相关的问题，以及数据密集型应用程序的监控和服务业务控制。正如\
  \ Barker 等人指出的 [9]，云计算研究方面还有一些需要进一步探索的重要机会。这些包括用户驱动的研究（如何开发支持基于一组用户驱动需求的预算受限计算的环境），以及新的编程模型（`MapReduce`\
  \ 的替代方案是什么，如果有的话？）、PaaS 环境以及支持弹性扩展和大规模调试的改进工具。\n\n最后，我们如何提高云端采纳者的信心 [10] 并限制使用云服务带来的潜在风险？一些最近的统计数据显示，由于对云提供商所提供的安全保障缺乏信心，特别是缺乏透明度，用户在采用云方面表现出犹豫\
  \ [11]。用户报告的具体问题涉及缺乏机密性、完整性保障差以及潜在的可用性限制。\n\n## 1.6 总结\n\n云计算在过去几年中引起了工业界和学术界的极大兴趣。尽管目前正在进行标准化工作，但在以连贯且统一的方式定义云计算方面仍有许多工作要做。有趣的是，尽管云最初被许多怀疑的用户认为仅仅是一个热词，但在最近几年中，云已被证明是许多企业和组织的关键推动者，这也归功于它的灵活性以及以定制且具有成本效益的方式为云采用者服务的独特能力。\n\
  \n直到目前，云计算仍有几个方面值得研究，包括技术性和非技术性问题，例如并行化或定价方案。特别是隐私和安全问题仍然是阻碍云采用的重要障碍。随着云周边技术的发展速度非常快，要确保用户的数据和过程始终保持机密和正确是挑战性的。考虑到竞争日益激烈的市场，大多数云提供者专注于使服务具有有效性和可扩展性，往往忽视了可靠性和弹性问题。\n\
