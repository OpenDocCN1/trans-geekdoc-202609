  \ Proceedings of ICDCS’11, pages 373–382, 2011.\n\n\n\n\n当人类遇到新颖且强大的事物时，往往会直接投入并拥抱它，而没有真正理解我们所处理之事的全部影响。例如，当我父亲小时候，他曾对我祖父那块带有放射性表盘的手表出的美丽光芒赞叹不已。我祖父参与了早期早期的核试验，那块表是一份礼物。多年年后，我们才意识到这些精美手表所伴的巨大危险。要点在于，仅仅因为某件事看起来闪亮新颖，并不意味着它在设计时考虑了安全性。\n\
  \n我在本书中的作用是提供一个警示。指出像云计算这样的技术，它能以我们以前梦梦想的方式将我们联系在一起，但也可能包含暗流，在接触时应当保持谨慎态度。在本章中，我们将学习当我们寻找并与供应商及服务连接时，这些供应商和服务商是如何反过来连接到我们以及其他人身上的。由于个人和公司之间的这种连通性，很多时候一个环节的漏洞就会将我们暴露在未知的风险之中。\n\
  \n我们正被暴露于一个新世界，作为云计算一部分的工具也被恶意分子用作感染和控制系统的手段。在过去，“合法”流量与“恶意”流量之间通常有明确的区分。创建签名来检测邪恶并留下良性是很容易。而现在，这些界限变得模糊且混淆。\n\
  \n因此，本章并不是为了引发恐惧并让读者陷入一种隔绝云端的模式，而是作为对应该避免的事和应该拥抱的事物的警告。在我们迈向云的过程中，我们涵盖哪些信息安全传统需要被忘记，哪些传统需要被拥抱。\n\
  \n## 33.2 命令与控制\n\n多年来，我们在信息安全领域的一个指导原则之一是区分善恶。我们将绝大多数的安全防御建立在能够检测邪恶的基础上。这种检测被称为黑名单机制。它基本上意味着能够识别恶意软件或攻击流量并为其编写签名。这是入侵检测和\
  \ `AV` 解决方案的基础。总的来说，这些方法已经失败了，而且失败得很惨烈。\n\n然而，尽管这些技术存在严重缺陷以至于几乎毫无价值，但许多组织仍然固守着它们。很多时候，这些技术是防御者认为唯一可用的防御手段。这很大程度上是“锤子与钉子”在现实世界的体现。如果你只有一把锤子，所有问题看起来都是钉子。\n\
  \n那么，这一切究竟如何应用于云安全呢？随着我们的云技术在环境中不断交织，要准确确定什么是恶、什么不是正变得越来越困难。这需要一些背景知识。年前，恶意软件的大部分命令控制流量是通过明文协议传输的。攻击者喜欢（现在仍然喜欢）像\
  \ `IRC` 这样的协议。只需查找通过端口 `6667` 的网络流量并进行嗅探即可。很多时候，你可以很容易地看到命令控制流量。然后，攻击者遇到了一个问题：防御者很容易编写一个寻找\
  \ `C2` 流量的签名。因此，攻击者必须随机应变并进化。于是，他们转向使用加密协议，如 `HTTPS` 和带有编码参数的 `HTTP`。防御者通过实施更好的黑名单以及识别恶意域名和\
  \ `IP` 地址的技巧来提升他们的水平。接下来，攻击者利用快速泛洪（fast flux）技术来增加黑名单无法赶上的概率。\n\n随后，许多高度安全的组织转向利用互联网白名单作为解决方案。老实说，我曾坚定地支持使用互联网白名单，现在依然如此。我认为对于任何良好的安全支持结构来说，都是可靠且必要的方法。然而，我在向朋友和客户推荐它时，会带上一些保留意见和警告。原因在于，今天提供的几乎所有云技术和服务也可以被用于恶意目的。\n\
  \n我们开始看到使用如 `Google` 等服务进行命令控制的恶意软件。例如，其中一种工具是由来自 Black Hills Information Security\
  \ 的 Benjamin Donnelly 开发的 `gcat.py`。这个工具有趣的地方在于，它利用 `Google Mail` 作为从环境中提取数据的命令控制向量。\n\
  \n为什么这很重要？它的重要性有以下几点。长期以来，信息安全领域有一大批人赞同互联网白名单。原因在于，今天提供的几乎所有云技术和服务也可以被用于恶意目的。\n\n\
