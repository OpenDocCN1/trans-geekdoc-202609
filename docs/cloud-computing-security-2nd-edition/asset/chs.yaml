  \ Pearson。\n\n# 第 3 章\n\n## 云安全基线\n\nDaniel Oliveira, 佛罗里达大学, 盖恩斯维尔\nAnna Squicarini,\
  \ 宾夕法尼亚州立大学, 帕夕法尼亚州公园\nDan Lin, 密苏里州理工大学, 罗拉\n\n## 目录\n\n3.1 引言\n3.2 计算机安全概述\n3.3\
  \ 漏洞与攻击\n3.3.1 应用层\n3.3.2 操作系统层\n3.3.3 虚拟机监控、存储与网络\n3.3.4 云安全机制\n3.3.4.1 数据安全\n\
