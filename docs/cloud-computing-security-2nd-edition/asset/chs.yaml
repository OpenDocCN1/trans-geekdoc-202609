  云存储具有某些优势，例如按需付费、部署快速、易于调整以及容灾恢复。然而，云提供商通常被认为是“诚实但好奇”的，这意味着云会诚实地执行操作，但会窥探敏感数据。为了确保安全并防止非法访问者（包括云提供商）未经授权的访问，简单的解决方案是应用加密技术，使数据在外包之前被加密。在这种情况下，只有持有密钥的授权协作者才能访问数据。然而，当访问策略需要更新时（例如，新协作者加入或某些协作者离开），数据所有者使用新密钥对数据进行重加密是非常昂\
  \ coûte 的。由于重加密（加密/解密）的计算开销和传输开销与数据大小成正比，策略更新可能无法实时传播，特别是对于大量数据。因此，能力有限的数据所有者不建议承担沉重负担。另一种解决方案是应用代理重加密，它将重加密的负担从数据所有者转移到代理。然而，由于计算开销，公钥加密的应用阻碍了代理加密算法的广泛使用。一种名为“过度加密”的对称加密方案（数据在被客户端加密后再次加密）是向云服务器委托密钥更新和重加密的实用对称加密解决方案。尽管如此，在云计算的“按需付费”模型中，数据所有者为云端的密文操作付费仍然是昂贵的。\n\
  \n## 13.4 总结\n（总结内容保持原始结构不变）\n\n\n\n\n协作编辑云服务的服务器执行着繁重的处理，以协调所有在线用户的操作。首先，云服务器负责接收来自客户端的操作输入，通过操作转换（OT）[5\\\
  ]来转换操作以解决冲突，根据这些转换后的操作将存储的文档修改为联合版本，然后将修改广播给所有在线客户端。\n\n为了转换操作，服务器会根据所有其他并发操作来修订修改的位置。例如，当\
  \ Alice 和 Bob 分别在第 $i$ 个和第 $j$ 个位置插入‘a’和‘b’时，如果 Alice 的操作先执行且 $i < j$，则 Bob 的操作被转换为将在第\
  \ $(j + 1)$ 个位置执行。其次，在编辑阶段，上述步骤以实时的方式持续重复进行，以便客户端能够进行即时读写。最后，服务器必须维护联合版本的历史记录，因为由于不确定的网络延迟，用户的操作可能在不同的版本上进行。\n\
  \n简而言之，这种中心化架构充分利用了云服务器强大的计算能力、弹性和可扩展性，为资源受限的客户端带来了便利。为了使云服务器能够通过 OT 控制操作并解决可能的冲突，现有的在线协作编辑系统仅处理明文（或未加密）输入。因此，云服务提供商始终能够读取所有客户端的文档。这种不友特性可能会泄露用户的敏感数据，例如泄露给云系统内部好奇的运维人员。尽管采用了安全套接层/传输层安全（SSL/TLS）协议来保护传输中的数据免受网络外部攻击者的攻击，但输入数据在被云服务器处理之前总是会被解密。在本章中，我们提出了\
  \ LightCore，这是一种针对敏感数据的具有密钥强制访问控制的协作编辑云服务，将在 13.3 节中详细阐述。\n\n## 13.2 高效的密钥强制访问控制\n\
  \n在本节中，我们提出了一种基于重加密（over-encryption）[1, 4, \\\\]的新密钥强制访问控制机制，该机制通过强制双层加密来实现访问控制策略的更新。在重加密中，数据资源在基础加密层（BEL）由数据所有者进行首次加密，并在表面加密层（SEL）由云端进行二次加密。\n\
  \n当访问控制更新时，数据只需调用云端来更新 SEL 处的加密策略。然而，授予和撤销授权都需要云端对预加密的数据再次加密，这为重加密计算带来了巨大的开销，并且当同时发生大量访问控制策略更新操作时，会对性能产生影响。为了在加密云存储中实现高效的访问控制策略更新，本节提出了一种“双头部结构”，以消除在授予新授权时重新加密相关数据资源的需求，并提出了“批量撤销”机制，以减少发生撤销时重加密的开销。\n\
  \n在我们的双头部结构中，数据由数据所有者在 BEL 处加密，然后由云服务器在 SEL 处进行重加密。每个数据资源被分为主体中的数据内容和头部中的数据内容加密密钥。在外包到云端之前，数据资源的主体和头部都由数据所有者预加密。数据上传到云端后，云服务器将首先通过加密对头部进行封装。因此，所有资源的头部都通过双层加密初始化，并且始终保持较小尺寸。在授予新权限时，云服务器只需要更新较小的头部，而不是主体。\n\
  \n*   **高安全性**：双头部结构防止了未经授权的访问者访问敏感数据。即使云服务器遭受攻击，敏感数据也不会泄露给未经授权的访问者。\n*   **低开销**：双头部结构使得授予权限的开销与数据大小无关。通过双头部结构，不需要对任何数据内容（可能很大）进行重加密，因此在授予新权限时减少开销方面具有显著优势。\n\
  \n为了防止被撤销的用户利用其持有的密钥访问数据的未来版本，撤销操作带来的重加密开销是无法避免的。我们的批量撤销机制结合了针对一组撤销请求的惰性撤销，通过减少对大量数据的操作次数，为重加密系统提供了显著改进。\n\
  \n### 13.2.1 预备\n\n加密云存储 [6\\]被用于将敏感数据资源安全地外包给“诚实但好奇”的云。它通过在外包之前在客户端对数据进行加密，保护敏感数据免受云提供商和非法访问者的侵害。安全性在于根据协作者之间共享数据的访问控制策略，向用户（协作者）适当分配密钥。对于有高安全要求的数据所有者来说，对云提供商隐藏加密密钥至关重要。然而，当协作关系发生变化时，数据所有者难以寻求云提供商更新访问控制策略。此外，当需要细粒度数据访问控制时，不同访问控制策略的数据应使用不同的密钥加密。这会让用户感到困扰，因为他们需要为不同的数据资源维护多个密钥。\n\
  \n工作基于重加密方法 [1, 4, \\\\]，该方法旨在避免在访问控制策略变化后将资源传回所有者进行重加密的需求。在实现细粒度访问控制的前提下，重加密还通过巧妙构建密钥派生结构，强制用户保留一个或两个私钥来访问所有授权资源。在重加密中，数据资源在\
  \ BEL 和 SEL 处进行双重加密。在 BEL 处，数据由数据所有者在客户端加密，数据所有者负责向用户分发解密密钥。数据外包到云端后，加密数据在云端的 SEL\
  \ 处被重加密以更新访问控制策略。只有拥有两个层加密密钥的人才能解密数据，因此云提供商提供了额外的保护，以防止获取 BEL 密钥的人访问数据。\n\n\n\n\n\
  当数据所有者的合作关系或访问控制需求发生变化时，访问控制策略也应相应更新。在过度加密（over-encryption）中，数据所有只需要调用云服务器在 `SEL`\
  \ 处对数据进行重新加密。然而，当发生多次访问控制策略更新时，重新加密大量数据以及跨多个副本的服务器传输请求对于云端来说也是昂贵的。过度加密的一个潜在局限性是，当授予新权限时，云可能需要重新加密相关数据资源的内容。另一个可以改进的点是，当频繁撤销对同一资源的访问权限时，立即撤销会增加重复密文操作的开销。\n\
  \n### 13.2.1.1 过度加密\n\n在过度加密中，如果一组数据资源可以被同一组访问用户访问，则它们在 `BEL` 处使用相同的密钥加密，否则将使用不同的密钥加密。用户只需要维护一个或两个私钥即可访问所有授权给他的资源。过度加密通过构建密钥派生结构来实现，其中一个密钥可以通过公共令牌从另一个密钥派生。\n\
  \n过度加密的密钥派生结构基于数据资源的访问控制列表 (`ACL`)，其中过度加密将所有用户划分为不同的访问用户组，每个访问用户组关联一个密钥。具有相同访问用户组的数据资源使用相同的密钥加密。访问用户组的关联密钥可以通过该访问用户组任何子集的关联密钥派生。这通过在每个派生路径上发布公共令牌和标签来实现。例如，有三个数据资源\
  \ `r [1]`、`r[2]` 和 `r[3]`：`r[1]` 的访问用户组为 `{A,B}`，关联密钥为 `K [AB]`；`r[2]` 和 `r[3]`\
  \ 具有相同的访问用户组 `{A,B,C}`，使用密钥 `K [ABC]` 加密；通过发布令牌 `t [AB,ABC] = K [ABC] ⊕ h [a] (K\
  \ [AB], l [ABC])`，拥有 `K [AB]` 的用户可以通过计算 `K [ABC] = t [AB,ABC] ⊕ h [a] (K [AB], l\
  \ [ABC])` 来派生 `K [ABC]`，其中 `l [ABC]` 是与 `K [ABC]` 关联的公开可用标签，`⊕` 是位异或运算符，`h [a]`\
  \ 是安全哈希函数。\n\n我们通过图来表示密钥派生结构，其中顶点 `v [U]` 关联一组资源和用于加密资源的密钥。如果 `U [i]` 是 `U [j]`\
  \ 的子集且发布了令牌 `t [i,j]`，则存在一条连接两个顶点 `(v [Ui], v [Uj])` 的边。例如，`表 13.1` 代表访问控制策略的一个示例，其中\
  \ `h [d]` 和 `h [a]` 是安全哈希函数。在该例中，资源 `{r[1],r[9],r[10]}` 可以被 A 和 B 访问；资源 `{r[1],r[9],r[10]}`\
  \ 可以被 A、B 和 C 访问；资源 `{r[2],r[6]}` 可以被 C 访问；资源 `{r[7],r[8]}` 只能被 D 访问。为了减少用户需要维护的密钥数量，密钥\
  \ `K[ABC]` 可以通过 `K[AB]` 和 `K[C]` 派生，然后构建如 `图 13.1`所示的密钥派生结构。\n\n表 13.1 访问控制策略实现的示例\n\
  \n![](img/T13.1.jpg)![图 13.1 密钥派生结构。](img/fig13.1.jpg)\n\n图 13.1 密钥派生结构。\n\n###\
  \ 13.2.1.2 局限性\n\n在密钥派生结构中，具有相同访问用户组的数据资源在顶点中使用相同的密钥加密。这减少了密钥数量并显著简化了用户的密钥管理。然而，当授予新权限时，可能会导致重新加密被授予数据资源所在顶点中的其他数据资源。在\
  \ `图 13.1`所示的示例中，如果数据所有者授予用户 D 访问数据资源 `r[1]` 的权限，数据所有者需要提供 D 解密密钥 `h [d] (K [AB]\
  \ )` 而不是派生密钥 `K [AB]`，后者可能用于派生其他顶点中资源（例如 `r[3],r[4],r[5]`）的密钥。然而，这无法阻止未经授权的 D 解密\
  \ `r[9]` 和 `r[10]`。因此，云提供商应该在 `SEL` 处对过度加密 `r[9]` 和 `r[10]`，而不是将它们发回数据所有者。事实上，在授予权限时应避免重新加密相同顶点的数据资源。\n\
  \n过度加密的另一个可改进点在于撤销。为了防止被撤销的用户使用其持有的密钥访问数据的未来版本，云应该在表面层加密（surface layer encryption）处对其重新加密。然而，当频繁发生撤销时，昂贵的重新加密操作会影响性能。此外，由于数据资源可能被一组用户访问，立即撤销访问会产生重复的加密操作并导致延迟。\n\
  \n### 13.2.2 方案\n\n我们构建了一种基于过度加密的双重头部结构，并提出了批量撤销，以实现云存储中访问控制策略的高效更新。为了实现快速加密，我们在方案采用了对称加密。数据首先在\
  \ `BEL` 处由数据所有者加密。当访问控制策略变化时，数据所有者不再重新加密数据。所有匹配新策略的加密操作由云执行。双重头部结构使得授予权限的开销与数据大小无关。因此，云只需要更新授予资源的头部，而不是具有相同密钥的其他资源。\n\
  \n#### 13.2.2.1 双重头部结构\n\n我们将每个数据资源分为两个部分：头部的密钥和主体的数据内容。在初始化阶段（上传之前），主体内容在 `BEL`\
  \ 处使用头部密钥进行加密。在我们的方案中，每个资源使用不同的密钥来加密其内容。为了防止云提供者和未经授权的访问者获取密钥，`BEL` 处的头部密钥由数据所有者加密。当以头部/主体形式的数据资源上传到云服务器时，云需要在\
  \ `SEL` 处对头部进行过度加密。因此，所有资源的头部都施加了双层加密，我们称之为双重头部结构。我们的双重头部结构中有四种密钥：\n\n*   数据内容密钥：`dek`。在\
  \ `BEL` 处用于加密主体内容的对称密钥。它由数据所有者生成并加密，并在云的头部保持不变。每个数据资源都有不同的数据内容密钥。该密钥以加密格式存储在头部，不需要分发。\n\
  *   表面内容密钥：`sek`。在 `SEL` 处用于加密已加密主体内容的对称密钥。在初始化阶段，它为空。当数据资源发生撤销时，云将设置新的表面内容密钥并在主体中使用它对预加密数据进行加密。分离资源的密钥也是不同的，并在发生撤销时发生更改。该密钥以加密格式存储在头部，不需要分发。\n\
  \n\n\n\n\n*   基础头部密钥（Base head key）：`BK [U]`。该对称密钥用于加密头部中的数据内容密钥。数据所有者在将头部上传到云端之前生成它，它在云端保持不变。它可能用于加密一组具有相同访问控制策略的资源。该密钥通过构建从用户私钥到\
  \ `BK [U]` 的派生路径，分给集合 `U` 的所有授权用户。\n*   表面头部密钥（Surface head key）：`SK [U]`。该对称密钥在存储加密层（SEL）中用于加密头部中的预加密数据内容密钥和表面内容密钥。它由云端生成，并在访问控制策略更新时发生变化。具有相同访问控制策略的数据资源共享表面头部密钥。该密钥也通过构建从用户私钥到\
  \ `SK [U]` 的派生路径，分给集合 `U` 的授权用户。\n\n我们在两个加密层中使用了四种类型的对称密钥来保护外包数据。由于访问控制策略可能会更新，存储在云端的数据状态并非不可变。在初始化阶段将数据资源上传到云端后，该数据资源处于表\
  \ 13.2 所示的初始状态。当数据资源的访问控制策略更新时，数据状态将变为表 13.3 所示的通用状态。\n\n#### 表 13.2 数据资源的初始状态\n\
  \n| Id | 头部 (Header) | 主体 (Body) |\n| --- | --- | --- |\n| `Id(r)` | `E [SKUi] (E\
  \ [BKUi] (dek),null)` | `E [dek] (data)` |\n\n#### 表 13.3 数据资源的通用状态\n\n| Id | 头部\
  \ (Header) | 主体 (Body) |\n| --- | --- | --- |\n| `Id(r)` | `E [SKUj] (E [BKUi] (dek),sek)`\
  \ | `E [sek] (E [dek] (data))` |\n\n在初始化阶段，数据所有者首先使用数据内容密钥 `dek` 对数据资源进行加密并生成主体\
  \ `E [dek] (data)`，然后使用基础头部密钥 `BK [Ui]` 加密 `dek` 并获得头部 `E [BKUi] (dek)`，最后将 `Id(r)`（数据资源\
  \ `r` 的标识）、`E [dek] (data)` 和 `E [BKUi] (dek)` 上传到云端。云端接收数据后，首先使用表面头部密钥 `SK [Ui]`\
  \ 加密头部中的 `E [BKUi] (dek)`，得到 `E [SKUi] (E [BKUi] (dek),null)`（null 表示云端尚未对 `E [dek]\
  \ (data)` 进行重加密）。然后数据资源以初始状态存储。\n\n当访问控制策略发生时，数据所有者应防止拥有 `dek` 的用户访问数据。如果数据所有者不愿下载数据资源并重新加密，可以调用云端对其重加密。如果数据资源仍处于初始状态，云端需要生成一个表面内容密钥\
  \ `sek` 和一个新的表面头部密钥 `SK [Uj]`，然后用 `sek` 重加密 `E [dek] (data)` 并用新的 `SK [Uj]` 重新加密\
  \ `(E [BKUi] (dek),null)`。此时数据状态将变为通用状态。如果数据资源处于通用状态，云端将用旧的 `sek` 解密 `E [sek] (E\
  \ [dek] (data))` 并用新的 `sek` 重新加密。\n\n我们的工作假设每个数据资源都有一个 ACL（访问控制列表）。为了通过合理分配密钥来实现细粒度访问控制，我们定义了密钥派生函数\
  \ `KeyDerivation(U)` 来生成加密密钥、分发密钥给共享用户并发布令牌以为授权用户派生密钥。有关详细算法，`KeyDerivation(U)`\
  \ 的代码请参考重加密基础模型中定义的密钥派生函数[4]。`KeyDerivation (U) → (K, T, L)` 的定义如下：\n\n*   访问用户集\
  \ `U`：`U` 是由所有数据资源的 ACL 派出的所有用户子集族。例如，如果数据资源 `r [i]` 的 ACL 规定用户 {A,B,C} 可以读取它，那么\
  \ `U [i] = {A,B,C}`（`U [i] ∊ U`）为 `r [i]` 的访问用户集。\n*   密钥 `K`：`K` 可以是所有用于派生头部密钥（基础头部密钥\
  \ `BK [Ui]` 或表面头部密钥 `SK [Ui]`）的密钥集合。在初始化阶段的 BEL 中，`∀U [i] ∊ U, ∃K [Ui]` 与访问用户集 `U\
  \ [i]` 相关，其中 `BK [Ui] = h [d] (K [Ui])`。在 SEL 中，`∀ U [i] ∊ U, ∃ SK [Ui]` 与访问用户集\
  \ `U [i]` 相关。\n*   公共令牌 `T` 和标签 `L`：`T` 是所有用于为用户派生密钥的公共令牌集合。`L` 是所有用于标记访问用户集的标签集合。如果\
  \ `∃U [j]` `U[j]` 是 `U` 的最大子集，则存在一个令牌 `t [Ui][,] [a] (K [Ui], l [j])` 是 `U` 的标签。\n\
  \n\n\n\n\n策略更新操作通常在大多数网络应用或系统中执行。例如，根据 MIT 在 Plutus 中关于延迟撤销（lazy revocation）提供的数据\
  \ \\[8\\]，从 7 个月的 AFS 保护服务器日志中提取出的 2916 个不同的 ACL 中，共存在 29,203 次单独的用户撤销操作。如果访问控制策略的更新需要巨大的开销，它将对性能产生负面影响。在过度加密（over-encryption）中，授予和撤销都从磁盘读取数据、加密数据资源和解密数据资源，这会导致巨大的传输开销和计算开销。我们的双头部结构通过对授予资源的小头部进行操作而非大数据内容，在新授予权限时高效地减少开销。对于撤销，我们的方案采用批量撤销来减少重复重加密操作的开销。\n\
  \n### 13.2.3.1 授予权限\n\n我们定义函数 `Grant(u,r)` 用于授权用户 `u` 访问加密云存储系统中的数据资源 `r`。我们方案中的权限授予通过将相关密钥分配给授权用户来实现。在之前的过度加密工作中，Full\
  \ SEL 和 Delta SEL 方法 \\[4\\]中的授予操作涉及对数据资源内容以及使用 `r` 的相同密钥加密的其他相关资源进行加密和解密操作。然而，我们不需要对内容进行重加密，只需要云端重加密\
  \ `r` 的头部。\n\n执行 `Grant(u,r)` 时，数据所有者首先更新访问用户集 `r`。`r` 的 `USet` 根据 `r.USet` 获取派生密钥\
  \ `K`，并通过哈希值 `K` 计算 `r` 的基础头部密钥 `r.BK`。由于初始化阶段具有相同权限的资源是用相同的基础头部密钥加密的，该密钥不随访问控制策略改变，`r.BK`\
  \ 可能由 `u` 的私钥 `K [u]` 导出。如果 `r` 的基础头部密钥不在 `u` 可派生的密钥集 `KSet` 中，数据所有者必须从 `K [u]`\
  \ 添加一个令牌到 `r.BK`，以确保 `u` 能派生出 `r.BK`。然后数据所有者调用云端过度加密 `r` 的头部，以确保只有新的访问用户集 `r.USet`\
  \ 可以解密 `r` 的头部。当云接收请求时，它需要用旧的表面头部密钥解密 `r` 的头部，重加密头部并添加令牌，以确保 `U` 访问用户集中所有授权用户都能解密\
  \ SEL 处的头部，这通过调用函数 `ReEncryptHeader(header,U)` 实现。详细步骤见表 13.4。\n\n表 13.4 授权的授予与撤销算法\n\
  \n| 授予新权限 || | 撤销权限 |\n| --- | --- |\n| 数据所有者：`Grant(u, r)` | 数据所有者：`Revoke(U, r)`\
  \ |\n| --- | --- |\n| 1\\. `r.USet ← r.USet∪{u}` | 1\\. `r.USet ← r.USet − U` |\n\
  | 2\\. `K [Ui] ← GetKey(r)` | 2\\. `OverEncryptResource(r, r.USet)` |\n| 3\\. `r.BK\
  \ ← H d` | |\n| 4\\. `KSet ← FindAllKey(K [u])` | 云端：`BatchRevoke(r, U [new] )`\
  \ |\n| 5\\. 如果 `r.BK ∉ KSet` | 1\\. `r.USet ← U [new]` |\n| 则 `AddToken(K [u] ,r.BK)`\
  \ | 2\\. 如果 `T [curr] ≥ RevocationTime(r)` |\n| 6\\. `OverEncryptHeader(r,r.USet)`\
  \ | 或满足预定义条件 |\n| | 则 `r.SK ← GetKey(r)` |\n| 云端：`OverEncryptHeader(r,U [new])`\
  \ | `r.Header ← DecryptHeader(r.Header, r.SK)` |\n| 1\\. 如果 `r.USet ≠ U [new]` |\
  \ 如果 `r.Header.sek ≠null` |\n| 则 | 则 `sek [old] ← r.Header.sek` |\n| `r.SK ← GetKey(r)`\
  \ | `r.Body ← DecryptBody(r.Body, sek [old] )` |\n| `r.Header ← DecryptHeader(r,r.SK)`\
  \ | `r.Header.sek ← GenNewKey()` |\n| `ReEncryptHeader(r.Header,U [new])` | `EncryptBody(r.Body,\
  \ r.Header.sek)` |\n| | `ReEncryptHeader(r.Header, Unew)` |\n| | 3\\. 否则等待…… |\n\
  | 云端：`ReEncryptHeader(header;U)` | |\n| 1\\. 如果 `∃U [i]` 是访问用户集且 `U [i] = U` 则 `SK\
  \ ← GetSurfaceHeadKey(U)` | |\n| 2\\. 否则 `SK ← GenNewKey()` | |\n| 3\\. `EncryptHeader(header,\
  \ SK)` | |\n| 4\\. 当 `U ≠ null` % 确保 `U` 中的用户可以解密头部 | |\n| `U [max] ← MaxSub(U)`\
  \ | |\n| `AddToken(SK, U [max])` | `U ← U [max]` |\n\n### 13.2.3.2 撤销权限\n我们方案中的撤销通过更新密钥和重加密头部来实现。将被撤销的用户可能保留密钥，因此资源需要重加密。当客户端执行\
  \ `Revoke(r,U)` 时，数据所有者通过从 `r.USet` 中删除 `U` 来更新访问用户集 `r`，并要求 `r.USet` 中的用户通过 `OverEncryptResource(r,r.USet)`\
  \ 访问新的解密密钥。当云接收请求时，它记录最新的访问用户集并等待撤销时间以执行 `BatchRevoke(r,U [new])`。数据所有者也可以为资源定义撤销周期，然后云在时间到达时执行撤销。当云需要对撤销资源\
  \ `r` 执行重加密时，它必须解密 `r` 的头部并提取其表面内容密钥 `sek [old]`。如果 `sek [old]` 为空，意味着 `r` 的主体尚未被云端过度加密，或者云应该用\
  \ `sek [old]` 解密 `r` 的主体。最后，云应用新的表面内容密钥加密 `r` 的主体并重加密头部，以确保访问用户集 `U [new]` 中的授权用户可以解密\
  \ `r` 的头部。\n\n### 13.2.4 性能分析\n在加密云存储系统中，加密数据资源的密钥需要更新，并可能需要重加密以匹配新的访问控制策略。然而，重加密的开销不忽视，特别是对于云中的大量数据资源。例如，通过应用\
  \ OpenSSL 0.9.8 k（块大小 8 KB）加密 1 GB 的数据（AES-256，编码速率：143.30 MB/s）需要 7.15 秒 \\[9\\\
  ]。因此，我们的方案目标是减少访问控制策略变化后的重加密开销。\n\n#### 13.2.4.1 授予权限的开销\n\n\n\n\n在我们双表头结构中，权限授予的开销始终涉及令牌检索和密钥派生、从磁盘读取数据以及加密/解密。在客户端，主要的计算开销是在授予新权限时，为了向新授权用户分发密钥而进行的令牌检索和密钥派生。在云端，云服务器则必须通过检索令牌和派生密钥找到相关资源的密钥，从磁盘读取相关资源并对其进行重新加密。\n\
  \n根据扩展工作中对过度加密（over-encryption）的性能评估 [1]]，检索令牌的时间（与资源大小无关）远低于下载和解密大型数据资源的时间。然而，在过度加密的实验分析\
  \ `11]]` 中，在本地网络配置下，对于大小大于 1 MB 的资源，传输和解密所需的时间占据了授权开销的主体。该时间也随资源大小的增加而线性增长。尽管云端没有将数据资源传回客户端，但云端需要从磁盘读取资源、对其重新加密，有时可能在具有副本的不同云服务器之间传输重新加密的请求。因此，从磁盘读取数据、解密和加密数据占据了访问控制策略更新开销的主要。由于从磁盘读取、解密和加密数据的时间与数据资源的大小正比，我们的方法操作较小的（约\
  \ KB 级）头部而非数据内容（可能是 MB/GB/TB 级），在减少开销方面具有显著优势。\n\n### 13.2.4.2 撤销的开销](#chapter13.xhtml#re_ch-13-sec-14)\n\
  \n我们发现，逐个撤销资源的一组用户与批量撤销该组用户相比，云服务器对数据资源的操作次数是不同的。这是因为具有相同 ACL 的数据资源使用了相同的密钥加密。我们假设数据资源\
  \ `r` 的头部或主体在云端的特定加密层（SEL）使用密钥 `K` `[ABCDEF]` 加密，这意味着它可以被一组用户 `{A,B,C,D,E,F}` 读取，现在经过一系列撤销后，`r`\
  \ 仅可由 `{A,E,F}` 访问。我们在表 13.5 中对逐个撤销 `{B,C,D}` 与批量撤销这些用户进行了对比。我们可以看到，通过批量撤销可以减少数据资源上重复操作的次数。这可以显著减少传输和加密操作的开销，特别是对于需要重新加密主体内容的大型数据资源而言。\n\
  \n表 13.5 数据资源内容操作次数对比\n\n| | | 功能 | 主要操作 |\n| --- | --- | --- | --- |\n| 逐个撤销 |\
  \ `Revoke(B,r)` | `Read(r)`, `Decrypt(r, K [ABCDEF] )`, `Encrypt(r, K [ACDEF] )`\
  \ |\n| --- | --- | --- | --- |\n| | | `Revoke(C,r)` | `Read(r)`, `Decrypt(r, K [ACDEF]\
  \ )`, `Encrypt(r, K [ADEF] )` |\n| 批量撤销 | `Revoke(D,r)` | `Read(r)`, `Decrypt(r,\
  \ K [ADEF] )`, `Encrypt(r, K [AEF] )` |\n| | | `Revoke({B,C,D},r)` | `Read(r)`,\
  \ `Decrypt(r, K [ABCDEF] )`, `Encrypt(r, K [AEF] )` |\n\n注：示例—访问策略更新：`{A,B,C,D,E,F}`\
  \ 可以读取 `r` → `{A,E,F}` 可以读取 `r`。使用新的表面密钥 `K [U]` 重新加密 `r` 的头部或主体，其中 `U` 是 `r` 的访问用户集。\n\
  \n### 13.2.5 安全分析](#chapter13.xhtml#re_ch-13-sec-15)\n\n我们方案中对敏感数据的访问控制通过合理分发两个加密层（BEL\
  \ 和 SEL）的密钥来实现。在“诚实但好奇”（honest-but-curious）模型中，当更新访问控制策略的重新加密依赖云端时，很难保护敏感数据免受未经授权的访问者和云的影响。因此，我们方案的安全性在于跨层加密密钥的分发，这由数据所有者和云提供者通过适当发布公开令牌来构建派生路径执行。\n\
  \n为了防止敏感数据被未经授权访问，数据资源首先由数据所有者在 BEL 层使用数据内容密钥进行加密。攻击者必须获得 BEL 的密钥（数据内容密钥和基础头部密钥）才能获取数据资源的明文。由于头部中的数据内容密钥是用基础密钥加密的，攻击者只有拥有基础密钥才能解密\
  \ BEL 中的数据内容。事实上，我们方法中的基础密钥等于过度加密中 BEL 层的密钥。\n\n我们利用云端来保护 SEL 层头部的基础密钥。事实上，在我们的方案中，未经授权的用户可能会获得基础密钥。例如，被撤销的用户可能在本地保留被撤销资源的基础密钥；新授权的用户在被授权访问由基础密钥加密的资源\
  \ `r ^j` 时，可能会无意中获得资源 `r ^i` 的基础密钥。然而，已获得基础密钥的未经授权用户无法解密数据内容，因为云端整合了防御屏障。对于仅有基础密钥的用户，云端用表面密钥加密头部中预加密的数据内容密钥。没有表面密钥，攻击者无法获取数据内容密钥。对于那些同时拥有基础密钥和数据所有者生成的数据内容密钥的用户（被撤销的用户），云端通过表面内容密钥加密数据内容，而表面内容密钥也受到表面密钥的保护。没有表面密钥，攻击者无法解密数据内容。表面密钥等于过度加密中\
  \ SEL 层对预加密数据内容进行过度加密的密钥。\n\n因此，我们方案的安全性在于保护表面密钥和基础密钥，相当于保护过度加密中 BEL 和 SEL 两层的密钥。关于云端与获得\
  \ BEL 密钥的未经授权用户之间的相关协同攻击分析，可以参考过度加密 [4]]。\n\n### 13.2.6 相关工作](#chapter13.xhtml#re_ch-13-sec-16)\n\
  \n为了在不完全信任的服务器中保护共享敏感数据免受非法访问，实现访问控制的共享加密文件系统经历了大量的开发。SiRiUS [10]] 和 Plutus [8]]\
  \ 是早期的文件系统，它们采用加密技术来实现访问控制。SiRiUS 加密每个数据文件并将其分为元数据文件和加密数据内容文件，但元数据文件的大小与授权用户数量成正比。Plutus\
  \ 将不同的文件分组，并将每个文件分成多个文件块。每个文件组使用一个文件锁密钥，每个文件块使用唯一密钥加密。然而，由于不同的文件组关联不同的文件锁密钥，用户维护多个密钥是不明智的。\n\
  \n\n\n\n基于属性的加密（ABE）首次提出于模糊身份基的加密 [11]，它是在云环境中共享敏感数据的另一种分支，无需为每个文件或每个文件组维护密钥。ABE\
  \ 现在在云计算中被广泛研究，以保护敏感数据 [12 [](#chapter13.xhtml#re_TNF-CH013_CIT00013)–14]。于树成（Shucheng\
  \ Yu）在云计算中提出了一种细粒度数据访问控制方案 [12]，该方案结合了 ABE、代理重加密 [15, 16, ],]以及惰性加密。它支持策略更新。然而，它无法更新用户对某个特定文件的权限，且撤销用户需要更新所有关联属性，并通知维护相关属性密钥的用户。我们的方法只需更新被撤销资源的密钥即可。\n\
  \n过度加密（Over-encryption）[1, 4, \\] 保护了诚实但好奇的云中的共享敏感数据，并实现了访问控制策略的更新。其访问控制架构基于密钥派生结构\
  \ [17 [](#chapter13.xhtml#re_TNF-CH013_CIT00018) [](#chapter13.xhtml#re_TNF-CH013_CIT00019)–20]，该结构可以用有向图来描述，只有当从\
  \ `V[1]` 到 `V[2]` 存在边时，顶点 `V[1]` 的密钥才能通过顶点 `V[2]` 的密钥派生。在密钥派生结构中，用户只需维护私钥即可派生所有授权资源的密钥。在之前的过度加密工作中，授予和撤销权限都需要加密相关资源。这消耗了大量的资源和时间，特别是对于那些\
  \ GB/TB/PB 级的数据。\n\n为了减少撤销的开销，Cepheus 中提出的惰性撤销（lazy revocation） [21] 被现有加密系统广泛采用\
  \ [22]。以略微降低安全性为代价的惰性重加密 [23] 将所需的重加密推迟到下一次写访问。因为这为撤销带来了巨大的开销（读取磁盘、解密数据和加密数据），我们采用了结合惰性撤销的批量撤销，这减少了开销并提升了云存储服务的性能。\n\
  \n## 13.3 协作编辑的机密性和访问控制](#chapter13.xhtml#re_ch-13-sec-17)\n\n在本节中，我们提出了 LightCore，一种用于敏感数据的协作编辑云服务。在\
  \ LightCore 中，所有输入字符在发送到云之前都会通过流加密算法加密，该算法逐字节加密明文。这些字符构成了文档的内容。文本始终以密文的形式传输、处理和存储。加密密钥由授权用户共享，加密算法假设是安全的。输入文本的其他参数仍以明文形式发送和处理，因此云服务器可以使用\
  \ OT 将所有操作协调到一个联合版本，但并不一定理解文档。\n\nLightCore 假设云服务器是诚实但好奇的。一方面，诚实的云服务器总是按照其规范执行请求的操作；另一方面，好奇的服务器会尝试读取或推断用户文档中的敏感文本。注意，假设诚实性特征是为了确保服务的可用性和数据完整性，而不是为了敏感数据的机密性。任意偏离协议的恶意云服务器可能会破坏服务可用性或数据完整性，但无法损害机密性，因为密钥仅由客户端持有，且每个输入字符在客户端之外从未以明文形式出现。\n\
  \n通过采用流加密算法，LightCore 保持了客户端轻量级的负载，并像现有的协作编辑云解决方案一样利用云服务器强大的资源。由于流加密算法逐字节加密文本，且每个输入文本在加密后长度不变，服务器可以在不理解密文的情况下进行\
  \ OT 和其他处理。相反，块加密算法块加密文本（通常为 128 位或 16 字节），因此服务器对密文进行 OT 处理是极其困难的，因为用户是以字符为单位修改文本（即插入或删除）。这意味着每个字符都必须加密成一个填充后的块，以支持字符级的用户操作，这将导致存储和传输的巨大浪费；否则，解决冲突的工作负载将转移到客户端，这对于资源受限的设备是不适合的。\n\
  \n事实上，逐字节加密特征可以通过流加密或块加密的 CTR 模式实现。chapter13.xhtml#fn-1) 在 LightCore（以及其他编辑系统）中，文档的文本由一系列长度不固定的文本段组成。由于文档是多个用户协作编辑的结果，这些文本段按时间顺序输入并加密；例如，`Collaborative`、`Editing`、`Cloud`\
  \ 序列是在删除 `Document` 后插入 `Editing` 产生的 `Collaborative Document` 结果。每个文本段关联一个名为 `keystream_info`\
  \ 的属性([chapter13.xhtml#fn-2)，包含解密它所需的参数。对于块加密的 CTR 模式，`keystream_info` 包含密钥标识符、一个随机字符串\
  \ `nonce`、一个初始计数器和一个偏移；对于流加密，它包含一个密钥标识符和一个密钥流的初始位置偏移。注意，所有用户共享一个静态主密钥，每个初始化加密器的数据密钥都从主密钥和密钥标识符派生。\n\
  \nLightCore 的效率随密钥流策略的变化而异，即 (a) 使用不同的方法生成密钥流，(b) 在某些场景中使用不同的流加密密钥更新规则（如果使用流加密）。通常情况下，流加密的加密速度更快、延迟更小\
  \ [[24]，但在生成密钥流之前有较重的初始化阶段。此外，与无状态的 CTR 模式不同，流加密是有状态的：给定一个密钥，要生成第 j 字节密钥流，必须先生成所有\
  \ k 字节（k < j）。因此，随机位置的插入操作（例如在第 2 行之后在第 1 行插入）需要解密器缓存密钥流字节备后用；删除操作会导致解密器产生大量的过期密钥字节。这种性能下降通过更新\
  \ LightCore 中流加密的数据密钥来缓解：用户（或加密器）生成一个新的数据密钥，重新初始化加密器，然后逐字节生成密钥流以加密文本。密钥更新规则通过平衡\
  \ (a) 初始化和密钥流生成的成本，以及 (b) 删除和插入操作的分布和顺序来设计。\n\n\n\n\n\n我们基于 Etherpad（一个开源协作编辑云系统）实现了\
  \ LightCore。LightCore 原型支持 `RC4` 流加密算法和 `AES CTR` 模式。该系统采用了两种流加密密钥更新规则原则，即用户（或加密者）在以下情况下更新流加密密钥：(a)\
  \ 生成的密钥流字节达到预设长度，或 (b) 用户移动到当前光标行之前的另一个位置以插入文本。随后，对原型的评估和分析为不同的典型使用场景给出了带有详细参数的适用密钥流策略。LightCore\
  \ 为在线用户提供协作编辑云服务，具有以下属性：\n\n*   针对“诚实但好奇”的云服务器具有合理的机密性：所有输入字符在发送到云服务器之前都在客户端进行加密，无论这些文本最终是保留在文档中还是删除。文档内容对服务器保密，但长度、段落、字体和颜色等格式信息是已知的，使得服务器能够协调用户操作。\n\
  *   客户端负载轻量：LightCore 的云服务器负责接收用户的编辑输入、解决编辑冲突、维护文档以及将最新版本分发给在线客户端。与现有的协作编辑解决方案相比，LightCore\
  \ 用户仅需额外作为加密者生成密钥流以保护输入文本，并作为解密者从服务器解密文本。\n*   实时性且功能全：字节级的轻量级加密与非加密的实时协作编辑服务完全兼容，因此没有任何编辑功能会受阻或禁用。即使对于登录系统访问非常长且被反复编辑的文档的新用户，密钥流策略也能方便用户进行实时解密。\n\
  \n### 13.3.1 背景与相关工作\n\n#### 13.3.1.1 实时协作编辑系统\n\n协作编辑是小组通过个人贡献共同创作作品的实践。在当前的协作编辑系统中，修改（如插入、删除、字体格式或颜色设置）会标记其作者并及时从一位协作者传播到另一位协作者（小于\
  \ 500 毫秒）。在文本文档、程序化源码 [[25], [26]] 或视频中应用协作编辑已成为主流。\n\n用于排序 [[27]] 和存储的分布式系统技术已应用于实时协作编辑系统\
  \ [[28]–[29–30]]，包括协作编辑器软件和基于浏览器的协作编辑器。其中大多数都选了去中心化设置，但一些知名系统使用中央云资源来简化客户端之间的同步（例如\
  \ Google Docs [[31]] 和 Microsoft Office Online [[32]]）。在去中心化设置的协作编辑系统中，客户端在广播、排序修改和解决冲突方面的负担更大。然而，在基于云的协作系统中，云服务器帮助排序和合并修改、解决冲突、广播操作并存储文档。这不仅节省了部署和维护成本，还通过使用云资源减轻了客户端的负担。\n\
  \n然而，用户可能无法完全信任云。为了保护敏感数据免受未经授权的泄露，用户数据在发送到云之前会被加密 [[18], [20], [33], [34]]。SPORC\
  \ [[35]] 在客户端使用块密码 `AES` 对修改进行加密，但云服务器只能排序、广播和存储操作，因此客户端在访问文档时，通过一系列操作解决冲突并恢复文档是一个巨大的负担。在我们的方案中，数据使用流加密加密，且云服务器的功能不受阻碍或禁用。\n\
  \n实时协作编辑系统有四个主要特征：(a) 高交互客户端通过网络获得即时响应；(b) 参与者可以在会话期间随时加入或离开；(c) 修改不是参与者预先计划的；(d)\
  \ 同一数据的编辑冲突需要得到良好的解决，以实现所有客户端的一致视图。由于修改是在 500 毫秒内收集并发送的，尽管存在复制粘贴，输入文本的大小也较小（约 2–4\
  \ 个字符）。在这种情况下，编辑冲突频繁发生。\n\n#### 13.3.1.2 操作转换\n\n由并发操作引起的编辑冲突是协作编辑系统的主要挑战之一。如果没有高效的冲突解决方案，可能会导致不同客户端之间的文本不一致。有很多解决冲突的方法，例如锁机制\
  \ [[36], [37]] 和差异补丁（differ-patch） [[38]–[39–40]]。这些方法中，我们系统采用的操作转换（OT） [[5]] 是并发操作发生时维护一致性的高效技术。OT\
  \ 由 C. Ellis 和 S. Gibbs [[41]] 在 GROVE 系统中创立。在 20 多年里，OT 已经演进并在新应用中获得了新能力 [[22]–[43–44]]。2009\
  \ 年，OT 被采用为 Apache Wave 和 Google Docs 协作功能背后的核心技术。\n\n在 `OT` 中，来自客户端的修改被定义为一系列操作。OT\
  \ 通过同步共享状态来确保一致性，即使并发操作在不同的时间点到达。例如，一个名为 `S` 的字符串 `preotto` 在客户端 `C[1]` 和 `C[2]`\
  \ 上共享，`C[1]` 通过删除第 3 个字符将 `S` 修改为 `pretty`，而 `C[2]` 同时在第 5 个位置后插入 `il` 将 `S` 修改为\
  \ `preottily`，一致的结果应该是 `prettily`。然而，如果没有适当的解决方案，会导致客户端 `C[1]` 出现不一致：从删除结果的 `pretty`\
  \ 变为插入结果的 `prettyil`。\n\n\n\n\nOT 通过根据之前执行的并发操作转换操作的位置来保持一致性。通过采用 OT，对于任意两个执行顺序无关的并发操作\
  \ `op [i]` 和 `op [j]`，OT 函数 `T(.)` 满足：`op [i] ∘ T(op [j], op [i]) ≡ op [j] ∘ T(op\
  \ [i], op [j])`，其中 `op [i] ∘ op [j]` 表示包含 `op [i]` 后接 `op [j]` 的操作序列，而 `º` 表示两个操作序列的等价。在上面的示例中，通过根据“删除第\
  \ 3 个位置的字符”操作，将“在第 5 个位置后插入‘il’”转换为“在第 4 个位置后插入‘il’”，可以在客户端 `C[1]` 上完美地实现一致的结果。\n\
  \n在协作编辑云服务中，云服务器负责接收并缓存队列中的编辑操作，对每个编辑操作进行排序，根据顺序迭代对并发操作执行 OT，将这些编辑操作广播到其他客户端，并在其本地副本中应用它们以维护文档的最新版本。当从客户端接收操作\
  \ `op rc` 时，云服务器按如下方式执行 OT：\n\n* 注意，操作 `op rc` 是由客户端的最新修订 `r[c]` 生成的。\n* `S 0 →\
  \ S 1 → ... S rc → S rc + 1 ... → S rH` 表示存储在云端的操作序列。`op [c]` 与 `S rc` 相关。\n* 云服务器需要相对于\
  \ `S rH` 计算新的 `op rc'`。云服务器首先通过计算 `T(S rc + 1, op rc)` 计算相对于 `S rc + 1` 的新 `op rc'`。同样，云服务器可以对\
  \ `S rc + 2` 重此类类推，直到实现相对于 `S rH` 的 `op rc'`。\n\n编辑冲突也需要由客户端通过 OT 解决。考虑到网络延迟和客户端非阻塞编辑的需求，本地编辑操作可能无法被服务器快速处理。因此，客户端应将其本地操作缓存在队列中，并根据这些缓存操作对并发操作执行\
  \ OT。\n\n### 13.3.2 假设与威胁模型\n\nLightCore 在功能上允许多个协作者利用云资源编辑共享文档并查看其他协作者的更改。我们假设所有授权的协作者相互信任，并共同努力完成同一任务（例如，起草报告或编写系统）。也就是说，任何协作者客户端提交的所有更改都是善意的，并受到其他协作者的尊重。\n\
  \n协作权限由一个名为“发起者”（initiator）的特殊协作者授予和管理，该发起者负责为未来的协作编辑创建目标文档、生成共享秘密密码，并通过带外通道分发给所有授权的协作者。密码用于派导出主加密密钥，以保护共享内容和更新。我们假设密码足够强大，能够抵抗猜测攻击和暴力破解攻击。带有随机字符串的主密钥用于生成数据密钥，数据密钥初始化加密算法以生成密钥流。我们假设用于加密数据的加密算法是安全的。同时，我们假设随机字符串不会被客户端重复生成。我们假设每个协作者的客户端运行在安全环境中，该环境保证：\n\
  \n* 发起者客户端上的共享密钥生成、分配以及权限管理得到了适当维护。\n* 出现在客户端中的秘密密码和密钥不会被任何攻击者窃取。\n* 客户端与云之间的通信通道足以实时传输所有必要数据，并受到现有技术（如\
  \ `SSL/TLS`）的保护。\n\n在 LightCore 中，云服务器负责存储和维护最新内容、对内容执行操作（删除、插入等）、解决操作冲突并在多个客户端之间广播更新。云服务器被认为是“诚实但好奇的”（honest-but-curious）。在可能损害其声誉的情况下，诚实的云服务器会及时、正确地传播所有授权客户端提交的修改，而不会恶意尝试添加、删除、更改或延迟操作请求。然而，受经济利益或好奇心驱动，云提供商或内部员工可能会监视或探测共享内容，通过格式和布局判断文档类型（例如信）。\n\
  \n### 13.3.3 系统设计\n\n本节描述 LightCore 的系统设计。我们首先给出基础模型，包括客户端服务器的规范以及加密方案。然后介绍 LightCore\
  \ 的密钥管理，并分析了生成密钥流的两种方法。\n\n#### 13.3.3.1 基础模型\n\n类似于协作编辑系统，LightCore 涉及一组协作用户和一个云服务器。每个客户端都通过互联网与服务器通信，实时发送其操作并接收他人的修改。对于每个文档，服务器维护版本历史。也就是说，它持续接收来自用户的操作，这些修改使文档从一个版本迁移到另一个版本。在版本上应用修改时，服务器可能需要\
  \ OT 来转换某些操作。服务器还不断向用户发送最新版本，即自上一个版本以来所有转换的操作。因为在发送最新版本时，用户仍在旧版本上进行编辑，因此可能还需要 OT\
  \ 处理来更新客户端侧的视图。上述过程如图 13.2 所示。\n\n```\n![图 13.2 LightCore 系统模型。](img/fig13.2.jpg)\n\
  ```\n图 13.2 LightCore 系统模型。\n\n在 LightCore 中，我们设计了加密模块来保护客户端的文档。插入操作的输入字符（无输入的删除操作）使用密钥流逐字节加密，但每个操作的位置以明文发送。当从一个客户端接收到操作时，云服务器可能会通过\
  \ OT 转换操作并根据位置将其应用到最新版本中。也就是说，云服务器的功能在密文中不会受到干扰或禁用。通过云服务器接收来自其他用户的操作后，操作的输入字符首先被解密，以便以明文形式呈现在屏幕上。\n\
  \n##### 13.3.3.11 客户端\n\n在客户端侧，用户在进入系统前由云进行身份验证。协作权限由发起者授予和管理，发起者负责创建目标文档。因此，只有授权用户才能下载或编辑文档。同时，用于生成加密文档文本的密钥流的主密钥仅由发起者交付给授权用户。没有主密钥，云服务器和网络上的攻击者都无法读取或理解文档。\n\
  \n\n\n在 LightCore 中，客户端编辑文档主要有两个阶段：编辑前阶段（pre-edit phase）和编辑阶段（editing phase）。在编辑前阶段，客户端请求文档以维护本地副本，服务器将向客户端返回当前最新版本的文档。在生成本地副本之前，用户需要输入密码，并使用从密码派生出的主密钥对文档进行解密。这种解密时间取决于文档长度，与编辑阶段对每个操作（`Op`）的小文本进行解密不同。随后，本地副本将用于用户的编辑操作，这样编辑操作就不会被网络延迟或拥塞中断。在编辑阶段，客户端在将操作发送到云服务器之前，会对每个操作的输入字符进行加密。同时，操作缓存在一个队列（`Ops`）中，以便在服务器未成功接收并处理时，其并发操作可以通过\
  \ OT 进行转换。在系统中，每个操作都与文档的修订号相关，该修订号表示生成该操作的版本。当从云服务器接收其他客户端的操作时，首先会对操作的输入字符进行解密。然后，客户端可能会根据修订号对操作执行\
  \ OT，并将修改应用到其本地副本中。\n\n### 13.3.3.1.2 服务器\n\n首先，为了遵循用户需求和规范，云服务器执行访问控制。服务器为每个文档维护版本历史。在编辑前阶段，服务器向客户端发送最新的加密文档，并持有一个该文档的有序修改记录列表（`Ops`）。每条修改记录都包含一个操作、其修订号和作者信息。在编辑阶段，服务器持续接收来自客户端的操作，根据修改记录执行\
  \ OT 函数对其进行转换，通过为每个操作施加全局修订号来对其进行排序，并将这些带有新修订号的更新操作广播给其他协作客户端。同时，云服务器将这些操作合并到密文版本的最新版本文档中，并将它们添加到修改记录中。\n\
  \n### 13.3.3.1.3 加密操作\n\n我们通过在客户端采用具有字节级加密特对称加密算法来保护用户数据的机密性。在我们的系统中，客户端的每次修改都被称为一个操作。编辑操作有两种类型：插入和删除。其他操作（包括复制和粘贴）也可以通过这两种操作来表示。插入由在文档中的插入位置和插入的文本组成。删除由删除位置和被删除文本的长度组成。操作中的每个插入文本段都与一个名为\
  \ `keystream_info` 的属性相关，包含加密和解密它的参数。与设置字体或颜色相关的操作也通过将字体或颜色值作为属性受到支持。\n\n通过应用字节级加密算法，每个输入文本的长度在加密后保持不变。云服务器可以在理解密文的情况下进行\
  \ OT 和其他处理。与块加密相比，在系统中使用流加密（包括块加密的 CTR 模式）具有以下优势：\n\n* 云服务器很难帮助解决冲突。为了满足实时视图显示，操作每\
  \ 500 毫秒提交一次，因此操作的输入文本通常很小（大约 2–4 个字符）。\n\n* 云服务器很难帮助解决冲突。为了满足实时视图显示，操作每 500 毫秒提交一次，因此操作的输入文本通常很小（大约\
  \ 2–4 个字符）。\n\n### 13.3.3.2 密钥管理\n\n我们在客户端构建了一个加密模块来加密和解密文本。在加密模块中，支持流加密和块加密的 CTR\
  \ 模式。每个文档都分配一个从密码派生的主密钥（`mk`）。当用户访问文档时，需要输入密码。我们假设密码的传输是安全的。\n\n文档的文本段使用数据密钥（`DK`）加密，数据密钥初始化加密算法以生成密钥流。数据密钥通过以下计算生成：\n\
  \n```\nDK = H(mk, userId||KeyId)\n```\n\n其中 `H` 是一个安全的密钥哈希函数（例如 `SHA256-HMAC`），`mk`\
  \ 是主密钥，`userId` 是协作者的身份，`keyId` 是随机密钥标识符。系统中具有唯一值的 `userId` 作为属性 `author` 附加到每个操作中，以区分不同的写入者。客户端生成的\
  \ `keyId` 是包含在属性 `keystream_info` 中的一个参数。对于块加密的 CTR 模式，`keystream_info` 包含一个密钥标识符、一个随机字符串\
  \ `nonceIV`、初始计数器和一个块偏移量；字符串 `nonceIV || counter` 是块加密生成密钥流的输入，计数器在每个块之后加 1。对于流加密，它包含一个密钥标识符和一个密钥流的初始位置偏移；初始位置偏移用于定位密钥流的字节，以解密文本段的第一个字符。随机生成的\
  \ `keyId` 和 `nonceIV` 确保密钥流不会被重用。因此，具有不同数据密钥的不同协作者会产生不重叠的密钥流，且密钥流字节不会重用以加密数据。\n\n\
  加密输入文本后，客户端将发送带有 `author` 和 `keystream_info` 属性的操作。因此，具有相同主密钥的授权读取和写入者可以在解密文本时根据属性计算出数据密钥并生成相同的密钥流。\n\
  \n\n\n\n我们的系统同时使用了流加密和分组加密的 CTR 模式。通常情况下，流加密的加密速度更快、延迟更小于分组加密 [[24]]，但在解密由随机插入和删除生成的文档时，有状态的流加密的性能可能会下降。为了实现高效的加密方案，我们为流加密设计了两种密钥更新规则，以便在充分利用流加密优势的同时，匹配协作编辑云服务的特征。\n\
  \n#### 13.3.3.3.1 两种加密算法的比较\n\n在流加密和分组加密的 CTR 模式中，明文的每个字节都通过与密钥流对应的字节逐个加密，产生一个字节的密文。在两种加密算法的执行过程中，涉及到初始化阶段和密钥流生成阶段。我们通过浏览器上的\
  \ JavaScript 测试了 `ISSAC`、`Rabbit`、`RC4` 和 `AES CTR` 的初始化延迟和密钥流生成速度。表 13.6 中的结果表明，这些流加密算法的速度远快于\
  \ `AES`，但它们在生成密钥流之前都经历一个较重的初始化阶段。例如，执行 1000 次 `RC4` 初始化所需的时间约同于生成 0.38 MB 字节密钥流的时间。对于无状态分组加密的\
  \ CTR 模式，密钥流的生成仅与分组加密输入的计数器有关。给定计数器和加密密钥，分组加密的 CTR 模式输出对应的密钥流字节。\n\n**表 13.6 流加密与分组加密\
  \ CTR 模式的比较**\n\n![](img/T13.6.jpg)\n\n通常，分组加密的 CTR 模式对于多次分组加密或解密只需要一次初始化（轮密钥调度）。与分组加密的\
  \ CTR 模式不同，流加密是有状态的：给定一个密钥，为了生成第 `j` 个密钥流字节，必须先生成所有第 `k` 个字节（`k < j`）。因此，当使用流加密解密文档时，随机位置的插入操作（例如在\
  \ `Line 2` 之后后在 `Line 1` 插入）需要解密器缓存密钥流字节以备后用；删除操作则会导致解密器产生大量过时的密钥流字节。随机插入和删除的影响示例见图\
  \ 13.3。\n\n![图 13.3 随机插入和删除的示例](img/fig13.3.jpg)\n\n图 13.3 随机插入和删除的示例。\n\n在解密由随机插入生成的文档时，对于缓存不足的客户端，可能需要反复初始化流加密并生成过时的密钥流字节。如果所有协作客户端都在文档的顺序位置输入字符，则文档中插入文本的位置将与密钥流中使用字节的位置保持一致。在这种情况下，解密文档只需要一次初始化，顺序生成的密钥流将得到充分利用。然而，由于随机插入，文档的文本段并不是按时间顺序输入和加密的。在这种情况下，可能会导致文本段与其使用的字节之间位置不一致。\n\
  \n\n\n\n\n#### 13.3.4.1 客户端改进\n\n在预编辑阶段（pre-edit phase），解密器从头到尾解密整个文档。如果使用了流加密且数据密钥发生了更新，解密器可能会发现交替使用的多个数据密钥；例如，使用数据密钥\
  \ `DK[1]` 加密的文本段可能会由于插入另一个使用数据密钥 `DK[2]` 加密的文本段，而被切分为两个部分；从而导致交替使用的密钥列表 `DK[1],\
  \ DK[2]`。因此，在预编辑阶段，解密器保持多个用不同密钥初始化的流加密状态；否则，它可能需要多次初始化同一个密钥并生成相同的密钥流。为了平衡内存需求和效率，在原型中，客户端为文档的每位作者维护两个用不同密钥初始化的加密状态。一个称为当前解密器，另一个称为备份解密器。当解密由新解密器加密的文本段时，客户端会备份当前解密器，并通过用新密钥初始化它来更新当前解密器。如果需要由备份解密器解密文本段，客户端将交换当前解密器和备份解密器。每个解密器生成的密钥流字节会被缓存，直到达到预定长度或解密器更新。\n\
  \n在编辑阶段（editing phase），每个插入的输入字符在发送到云端之前都会加密；因此，用户接收并解密文本的顺序与加密器加密的顺序相同。客户端为每个解密操作仅维护一个解密器状态。密钥流字节按顺序生成使用，但生成的密钥流不缓存，因为它们将不断重用。\n\
  \n##### 13.3.4.1 属性更新\n\n为了正确解密文本，每个插入都附带了属性 `keystream_info`，其中包含了所用密钥流字节的位置信息。位置信息通过密钥流中相对于插入第一个字符的字节偏移量（offset）来表示。然而，随机插入会改变\
  \ `keystream_info` 的值。例如：文本段 `T = <c[1], c[2], ..., c[n]>` 由某个密钥流的第 `k` 到 `k + n`\
  \ 个字节加密，偏移量 `k` 被视为属性 `keystream_info` `A` 的值；然后，`T` 的 `c[i]` 和 `c[i+1]` 之间插入了新文本；最终，`T`\
  \ 被切分为两个段 `T1 = <c[1], c[2], ..., c[i]>` 和 `T2 = <c[i+1], c[i+2], ..., c[n]>`，它们具有相同的\
  \ `A` 值。事实上，在解密整个文档时，`T2` 的 `A` 值应该修订为 `k + i`。幸运的是，这个属性值在客户端预编辑阶段很容易修订。与其维护所有旧操作的属性\
  \ `keystream_info` 并在编辑阶段为每个随机插入进行修订，不如客户端根据具有相同 `keystream_info` 的之前文本段的长度来计算后续文本段的正确属性值更为高效，因为所有文本和属性都在预编辑阶段的解密过程中从服务器下载的。\n\
  \n#### 13.3.4.2 服务器改进\n\n为了在加载整个文档时能够成功解密数据，服务器也应该针对随机删除更新属性。最终结果将导致密钥位置的变化以及客户端无法修正的解密错误。\n\
  \n##### 13.3.4.2.1 属性更新\n\n属性 `keystream_info` 的正确值也可以通过随机删除发生改变。例如：文本段 `T = <c[1],\
  \ c[2], ..., c[n]>` 由一个密钥流的第 `k` 到 `k + n` 个字节加密，偏移量 `k` 被视为属性 `keystream_info`\
  \ `A` 的值；然后，`T` 的子串 `<c[i+1], c[i+2], ..., c[j]>`（i > 0, j < n）被删除；最终，`T` 被切分为两个段\
  \ `T1 = <c[1], c[2], ..., c[i]>` 和 `T2 = <c[i+1], c[i+2], ..., c[n]>`，具有相同的 `A`\
  \ 值。事实上，在解密整个文档时，`T2` 的 `A` 值应该更新为 `k + j`。这个问题在服务器端得到了完美解决，而在客户端端是无法完成的。\n\n由于所有带有相关属性的文本段都存储在云端，且服务器在文档的最新版本上应用每个操作。用于更新\
  \ `keystream_info` 值的简短嵌入代码会在云服务器处理收到的操作时执行。与其在不维护删除文本属性的客户端进行修订，不如让服务器进行修订并将更新后的属性与文本一起存储更为合理。\n\
  \n\n\n\n\n保护用户文档的机密性是 LightCore 的主要目标。首先，在我们的系统中，只有共享主密钥的授权用户才能读取文档文本。LightCore\
  \ 采用流密码和分块密码的 CTR 模式在客户端对数据进行加密。在编辑阶段，每次操作的输入文本在发送到云端之前都会被加密。因此，输入文本以密文形式传输，云端的文档也以密文形式存储。其次，假设算法是安全的，且密钥仅出现在客户端。因此，这些密钥只可能通过协作用户或客户端泄露，而这些者也被认为是可信的。最后，数据密钥由每个用户以随机方式生成，LightCore\
  \ 仅使用一次由数据密钥生成的密钥流中的每个字节。任何文本都由专门为其生成的密钥流进行加密。因此，好奇的服务器无法通过分析两个解密后文本的差异来推断其内容。\n\
  \n为了维持云服务器的功能，我们只加密每次操作的输入文本，而不加密操作的位置。每个操作的位置和被操作文本的长度会对云服务器公开，这可能会泄露某些间接敏感信息（包括行数、段落分布和其他结构信息）。我们假设这些数据只能由授权的客户端和云服务器访问，并通过采用\
  \ SSL 协议确保不向外部攻击者公开。在这种情况下，相关数据限于云端和客户端。此外，附加到文本段的属性（包括字体、颜色、作者身份、`keystream_info`）也可能用于推断文档的底层信息。例如，具有**粗体**属性的文本段可能会暴露其重要性；具有列表属性的文本段也可能泄露某些相关信息。然而，某些属性可以通过\
  \ LightCore 在客户端进行加密来轻松保护，因为云服务器不需要处理所有属性（例如字体、大小和颜色）。因此，加密这些属性不会阻碍云服务器的基本功能。保护这些属性将包含在我们未来的工作中。无论如何，作者和\
  \ `keystream_info` 无法加密，因为这些属性涉及到云服务器的基本功能。\n\n云端的另一个威胁是通过由于对客户端输入的细致观察，收集并分析数据访问模式来推断敏感数据。即使所有数据都以加密格式传输和存储，流量分析技术也能揭示有关文档的敏感信息。例如，对某个位置修改频率的分析可以揭示数据的某些属性；多个文档的访问历史可能暴露用户的访问习惯和文档之间的关系；多个用户访问同一个文档甚至同一行可能暗示了共同的兴趣。我们不解决由此类流量分析和访问模式分析引起的攻击。然而，在一个高交互的协作编辑系统中，修改每隔\
  \ 500 毫秒就会提交并发送一次，这在编辑阶段产生了大量的信息流。因此，对于好奇的云服务器来说，收集和分析流量信息以及访问模式的成本很高，而且不会直接泄露敏感信息。\n\
  \n### 13.3.6 性能评估\n\nLightCore 的基本要求是高交互客户端可以实时查看其他客户端的修改。在编辑过程中，每次操作都由发送客户端、云服务器和接收客户端处理。整个过程将非常短，且传输延迟很低。因此，增加的加密计算对实时性不会产生影响。快速加入编辑的特性也预期能够满足。因此，当新客户端加入时，解密文档的时间应该是很短的。在本节中，我们展示了实验结果，证明\
  \ LightCore 实现了高性能，并且为不同的使用场景建议了合适的密钥流策略。\n\n我们在 Ubuntu 系统的机器上安装了云服务器，该机器配置为 3.4\
  \ GHZ Inter(R) Core(TM) i7-2600 和 4 GB RAM。我们评估了 Firefox 浏览器 34.0.5 版本上加密模块的性能。LightCore\
  \ 中流密码或分块密码（CTR 模式）的算法是可以配置的。在实验中，我们测试了实现流密码 RC4 或分块密码 AES CTR 模式的客户端加密性能。\n\n####\
  \ 13.3.6.1 实时\n\n我们评估了没有加密模块的原始协作系统以及带有加密模块的 LightCore 的客户端性能。在客户端，每次插入的输入文本在发送到云服务器之前会被加密。接收到操作时，客户端首先对其进行解密，根据本地队列中的操作进行转换，并将其应用于本地副本。为了评估这些主要程序的时间，我们创建了一个实验，让来自不同客户端的\
  \ 20 个协作者同时在同一文档中快速输入文本。\n\n转换操作的时间（称为队列时间）、在本地副本中应用操作的时间（称为应用时间）以及每次操作的传输时间如 [表\
  \ 13.7] 所示。事实上，主要区别在于增加了的加密/解密过程；其他过程不受影响。小于 500 毫秒的解密时间对实时性没有影响。为了测试并发能力，我们在实验中设置了一个客户端\
  \ `C`，仅负责接收来自 20 个客户端的操作。从开始时间到客户端 `C` 在本地副本中应用 20 次操作的总时间如 [表 13.7] 所示。我们可以看到，LightCore\
  \ 的 1236 毫秒总时间仅比原始系统长 27 毫秒，这对人类感知没有影响。\n\n表 13.7 20 个客户端并发修改的性能\n\n![](Images/T13.7.jpg\n\
  \n#### 13.3.6.2 编辑前阶段的解密时间\n\n在 LightCore 中，云服务器通过将存储的文档修改联合版本来维护最新的良好的文档。加入编辑时，客户端下载最新文档，对其进行解密，然后在编辑器中应用（或展示）。对于具有解密功能的资源限制客户端，预计加入时间（即编辑前阶段）是短的。与无状态分块密码不同，有状态流密码在解密由不同插入和删除生成的文档时性能存在差异。对于资源限制客户端，LightCore\
  \ 中缓存密钥流字节的缓冲区大小限制小于 1 KB。由于没有足够的缓冲区来缓存密钥流字节供后续使用，随机位置的插入操作需要重新初始化并生成无效的密钥流字节。删除操作也可能导致无效的密钥流字节。\n\
  \n\n\n\n\n对于这两类操作，我们在 LightCore 中实现了两种流加密密钥更新规则，即客户端在以下情况下更新流加密的密钥：(a) 生成的密文密钥流字节达到预设长度，或\
  \ (b) 用户移动到当前行之前的行并插入某些文本。我们进行了两个实验：一个是评估解密由随机插入生成的文档时展现的性能，另一个是测量解密由随机删除生成的文档时展现的性能。\n\
  \n### 13.3.6.2.1 随机插入实验\n\n在本次实验中，首先通过在文档的随机位置插入文本来生成 1 MB 的文档。我们假设用户通常在视野范围内编辑文档，因此我们将两次连续插入之间的位置距离限制在\
  \ 50 行以内。虽然用户在修改文档时可能会在随机位置插入短文本，但我们假设用户会在特定位置后连续输入文本，这符合常规编辑的习惯。在实验中，我们设定在特定位置连续插入\
  \ 256 个字符。我们将当前光标所在行之前的位置插入定义为正向插入。由于正向插入破坏了文本与其使用的密钥流字节之间位置关系的一致性，不同比例的正向插入可能对流加密实现的解密性能产生不同影响。因此，我们测量了从\
  \ 0% 到 50% 不同比例正向插入下随机插入生成的文档的解密时间。\n\n首先，不带密钥更新规则的流加密解密文档的性能见图 13.4a。结果显示，解密时间随正向插入比例的增加而增加。当正向插入比例达到\
  \ 15% 时，解密时间超过 8 秒，对于用户可能仍然无法接受。我们评估了 0.5 KB 到 32 KB 不同预设密钥流长度的 LightCore 流加密性能。图\
  \ 13.4b 中的结果显示，使用流加密解密文档的时间小于 500 毫秒。尽管采用 AES CTR 的解密时间保持在 300 毫秒左右，但预设长度为 16 KB\
  \ 或 32 KB 的流加密性能优于 AES CTR。主要区别在于初始化次数和废弃密钥流字节数的不同，具体见表 13.8。\n\n![图 13.4 随机插入生成的\
  \ 1 MB 文档解密时间。(a) 无密钥更新的单个加密密钥；(b) 带密钥更新的多个加密密钥。](img/fig13.4.jpg)\n\n图 13.4 随机插入生成的\
  \ 1 MB 文档解密时间。(a) 无密钥更新的单个加密密钥；(b) 带密钥更新的多个加密密钥。\n\n表 13.8 显示了解密随机插入生成的 1 MB 文档时，生成的废弃密钥流字节的详细大小和初始化次数。表\
  \ 13.8 的第一行表示正向插入（或在当前光标行之前的位置插入文本）的比例，从 0 到 0.5 (50%)。第一列表示密钥流的预设长度。我们在 Obsol 列中给出了相关的废弃密钥流，废弃字节的大小以\
  \ KB 为单位。相关的初始化次数显示在 Init 列中。在给定预设长度时，初始化次数和废弃字节的大小随正向插入比例的增加而增加。结果显示，如果在整个加密过程中不更新初始化流加密的密钥（单种子），会导致大量的初始化和大量的废弃密钥流字节。当\
  \ LightCore 采用流加密密钥更新规则两个原则时，较长预设密钥流长度的流加密会导致更少的初始化和更多的废弃密钥流字节。\n\n表 13.8 随机插入产生的废弃密钥流和初始化结果\n\
  \n![](img/T13.8.jpg)\n\n### 13.3.6.2.2 随机删除实验\n\n在本次实验中，我们通过顺序追加 2 MB 文本随后在随机位置删除\
  \ 1 MB 文本来生成 1 MB 的文档。这些文档使用 0.5 KB 到 32 KB 不同预设密钥流长度的流加密或 AES CTR 进行加密。我们假设每个被删除文本的长度可能对流加密的解密时间有影响。例如，长文本使用密钥流中第\
  \ 0 到第 n 个位置的字节加密，且密钥流的预设长度为 n。如果每个删除的文本都大于 `n`，那么在解密文档时，T 可能被删除且该密钥流无需生成。如果每个删除的文本很短，字符\
  \ `c[n]` 可能不会被删除。\n\n为了解密 `c[n]`，需要生成该密钥流中第 1 到第 (n – 1) 个废弃字节。我们测试了长度从 32 到 8192\
  \ 个字符的不同长度删除文本的文档解密时间。图 13.5 中的结果显示，RC4 流加密的解密时间随每个删除文本的长度线性递减。尽管 AES CTR 的解密时间保持在\
  \ 300 毫秒左右，但对于长于 16 KB 的密钥流长度，RC4 的性能更高效。\n\n![图 13.5 先追加 2 MB 文本后在随机位置删除 1 MB 生成的\
  \ 1 MB 文档解密时间。](img/fig13.5.jpg)\n\n图 13.5 先追加 2 MB 文本后在随机位置删除 1 MB 生成的 1 MB 文档解密时间。\n\
  \n当删除的文本大于 2048 个字符时，8 KB 曲线的值约等于 16 KB 曲线的值。当删除的文本大于 4096 个字符时，8 KB 曲线在 4096 处的值（219\
  \ ms）和 16 KB 曲线的值（229 ms）小于 32 KB 曲线。事实上，采用大于 32 KB 的预设密钥流长度加密不会更好。主要区别在于初始化次数和废弃密钥流字节数，具体见表\
  \ 13.9。如果预设长度值大于 32 KB，即使初始化次数减少，更多的废弃密钥流也会带来更多开销。\n\n表 13.9 随机删除产生的废弃密钥流和初始化结果\n\
  \n![](img/T13.9.jpg)\n\n\n\n\n为了推导不同场景下性能差异的原因，我们在 表 13.9 中详细给出了过时字节的详细信息。它展示了在解密一个\
  \ 1 MB 的文档时（该文档是通过在 2 MB 的基础上顺序追加文本，然后在随机位置删除文本缩减至 1 MB 生成的），待生成的密钥流过时字节的细节以及初始化次数。表\
  \ 13.9 的第一行表示每个被删除文本的长度。第一列表示预设的密钥流长度。我们在标题为 `Obsol` 的列中提供了相关的密钥流过时字节，过时字节的大小以 KB\
  \ 为单位。相关的初始化次数在标题为 `Init` 的列中。`random` 列表示每个被删除文本的长度是随机定的。在给定预设长度的情况下，初始化次数和过时字节的大小随着每个被删除文本长度的增加而减少。如果密钥流预设较小（例如\
  \ 0.5 或 1 KB），初始化带来的开销可能大于密钥流的过时字节。结果表明，当为流加密密钥更新规则提供较大的预设长度时，会导致更少的初始化和更多的密钥流过时字节。\n\
  \n### 13.3.6.2.3 密钥流策略建议\n\n上述实验结果表明，`LightCore` 的效率随密钥流策略的变化而变化。因此，用户可以根据不同使用场景的需求确定不同的密钥流策略。如果期望稳定的解密时间，采用块加密的\
  \ `CTR` 模式可能更合适。如果期望更短的解密时间，特别是对于大型文档，建议采用具有不同密钥更新规则的快速流加密。如果在每次向前插入后顺序输入大型文本，可以通过新的数据密钥设置较大的预设长度来实现高效的流加密性能。然而，当通过频繁插入小文本（例如\
  \ 2–10 个字符）来修正文档时，我们建议在 `LightCore` 中将流加密与块加密 `CTR` 模式结合，即：(a) 用户在某些位置顺序追加文本时，客户端使用流加密加密数据；(b)\
  \ 当发生向前插入时，使用块加密 `CTR` 模式加密数据。在这种情况下，不会导致频繁初始化流加密产生沉重开销。注意，块 `CTR` 模式和流加密可以在 `LightCore`\
  \ 中同时使用。\n\n高效的密钥更新规则应该平衡初始化开销与生成密钥流过时字节的开销。每个密钥流的预设长度较会导致频繁初始化，而较大的长度会导致大量的密钥流过时字节。当文档未通过频繁删除进行修改时（即删除文本占整个文档的比例较小时），可以将密钥流预设长度设置为较大的值。否则，我们应该根据初始化和密钥流生成的开销为预设长度设置合适的值。例如，`RC4`\
  \ 的预设长度 16 或 32 KB 可以带来更高效的性能。\n\n## 13.4 总结\n\n在本章中，我们为云端的强制访问控制提出了两种方案。方案一实现了加密云存储中访问控制策略的高效更新。性能分析表明，提出的双头部结构和批量撤销可以显著减少授权开销。然而，由云端和获得\
  \ `BEL` 密钥的未授权用户发起的共谋攻击在本章中仍无法解决。为了缓解这种共谋攻击的可能性，将数据资源分散在多个云之间并应用秘密共享技术可能是一种解决方案。由于在几乎所有加密存储系统中对撤销资源进行重加密是不可避免的，对大数据资源进行高效重加密也将是下一个研究方向。我们还提出了\
  \ `LightCore`，一种针对“诚实但好奇”服务器的敏感数据协作编辑云解决方案。`LightCore` 为一组并发用户提供实时在线编辑功能，类似于现有系统（如\
  \ `Google Docs`、`Office Online` 和 `Cloud9`）。我们采用流加密或块加密的 `CTR` 模式来加密（解密）客户端内的文档内容，而只有授权用户共享密钥。因此，服务器无法读取内容，但字节级加密允许云服务器以与现有协作编辑系统相同的方式处理用户操作。为了优化某些场景下预编辑阶段的解密时间，我们分析了不同的密钥流策略，包括生成密钥流的方法和密钥更新规则。对原型系统的实验表明，`LightCore`\
  \ 为资源限制的客户端提供了高效的在线协作编辑服务。\n\n`LightCore` 可以在以下方面扩展。首先，在当前的设计和实现中，只有文档文本受到保护，服务器可能会从格式中推断出关于文档有限的信息。我们将分析加密更多属性（例如字体、颜色和列表）的可能性，同时确保服务器的处理不受阻或禁用。其次，对于给定的文档，客户端可以根据发生的编辑操作和预测智能地在不同的密钥流策略之间切换。最后，`LightCore`\
  \ 将支持不同语言的字符。\n\n## 参考文献\n\n1. 1. S. De Capitani di Vimati, S. Foresti, S. Jajodia,\
