  \n# 第 27 章\n\n# 确保符合政府认证与认可\n\nSarbari Gupta\n\nElectrosoft Services, Inc.\n\n弗吉尼亚州，雷斯顿\n\
  \n目录\n\n27.1 引言\n\n27.2 管理和预算条例 A-130, 附录 III\n\n27.3 联邦信息安全管理\n\n27.4 NIST 风险管理框架\n\
  \n27.5 美国国防部(DoD)风险管理框架\n\n27.6 联邦风险与授权管理计划(FedRAMP)\n\n27.6.1 FedRAMP 评估（认证）\n\n\
  27.6.2 FedRAMP 授权（认可\n\n27.6.2.1 JAB 临时运行授权(JAB p-ATO\n\n27.6.2.2 机构运行授权(Agency\
  \ ATO\n\n27.6.3 利用 FedRAMP 授权\n\n27.7 DoD 云计算安全需求\n\n27.8 总结\n\n\n\n\n\n在信息安全领域，认证（Certification）和认可（Accreditation）是确定信息系统安全态势以及接受信息系统运行风险的两步过程。认证（与评估同义使用）是指评估信息系统（具有定义边界）内实施的信息安全技术和过程的有效性，其依据是既定的一系列安全需求，以确定信息系统中残留的安全风险。认可（与授权同义使用）是组织层面的决策，即接受由该组织使用或运行的信息系统所带来的风险，并正式允许该信息系统在生产模式下运行\
  \ [1]。\n\n全球范围内各级政府机构都高度依赖信息技术（IT）来完成其使命，并保护和服务其公民及利益相关者。然而，政府机构使用信息技术时，由于 IT 系统存在无数漏洞（这些漏洞代表了潜在的攻击向量），且存在大量具有高度动机破坏这些系统的威胁主体，因此信息技术的使用代表着巨大的风险。因此，对于政府机构所依赖的\
  \ IT 系统，存在多种政府法规。这些法规要求政府机构及其使用的供应商和供应商（负责开发、部署和运行政府信息系统）建立正式的合规证明。虽然所有 IT 系统都会对其利益相关者构成风险，但基于云的信息系统可能带来更大的风险，因为它们包含了较新的技术，且云系统通常暴露在更广泛的潜在威胁主体面前。因此，制定了额外的政府法规重点关注基于云的信息系统的安全性，而对这些法规的合规涉及认证和认可活动。在本章中，我们将回顾与基于云的信息系统的认证和认可相关的关键政府法规以及相关的认证认可机制。\n\
  \n## 27.2 管理和预算局 A-130 通告附录 III](#chapter27.xhtml#re_ch-27-sec-2)\n\n 1996 年，管理和预算局（OMB）发布了\
  \ A-130 通告附录 III 的更新版本，题为《联邦自动化信息资源安全》[2]。在该附录中建立的政策对于行政分支机构在其 IT 环境中开发和实施信息安全实践具有强制性。A-130\
  \ 附录 III 建立了一套最低控制集，包含在联邦自动化信息安全计划中；分配了联邦机构对自动化信息安全的责任；并将机构的自动化信息安全计划与机构管理控制系统相关联。在附录中，“通用支持系统”被定义为“在相同直接管理控制下、共享共同功能的互联信息资源集”。主要应用程序”被定义为“由于应用程序中信息的丢失、误用或未经授权的访问或修改而导致损害风险和规模，在安全方面需要特别关注的应用程序”。该政策的亮点包括：\n\
  \n- **安全责任分配**：要求将每个信息系统的安全责任分配给熟悉所用技术及如何保护系统安全的个人。\n- **系统安全计划**：要求根据美国国家标准与技术研究院（NIST）的指导意见，制定一个在信息系统内实施充分安全措施的计划。计划必须涵盖以下要素：\n\
  \    - 建立一套用于系统使用的行为准则，以管理风险\n    - 确保个人已接受充分培训，以履行其在组织角色中被分配的安全职责\n    - 对对信息系统具有特权访问的人员进行筛选\n\
  \    - 实施在安全事件发生时协助用户并对事件进行报告的能力\n    - 在连接其他信息系统之前获得书面授权\n- **安全控制审查**：要求在发生重大变化时以及至少每\
  \ 3 年对信息系统的安全控制进行一次审查\n- **授权**：确保由高级管理人员签署运行信息书面授权，该人员已审查了系统带来的风险，并至少每 3 年获得重新授权一次\n\
  \n## 27.3 联邦信息安全管理法](#chapter27.xhtml#re_ch-27-sec-3)\n\n《联邦信息安全管理法》（FISMA）作为《2002\
  \ 年电子政府法》的第三部分发布 [3]。鉴于信息安全对美国经济和国家安全利益的重要性，FISMA 规定了加强支持联邦业务和资产的信息资源安全态势的责任和目标。它要求开发和维护一套最低安全控制，以充分保护联邦信息和信息系统。它还要求每个联邦机构开发、记录并实施一项全机构范围的计划，为支持机构运营和资产的信息及信息系统提供信息安全，包括由其他机构、承包商或其他来源提供或管理的信息。FISMA\
  \ 要求机构制定全面的信息安全计划，包括以下核心要素：\n\n- **定期风险评估**：确定由于支持机构运营的信息和信息系统遭受安全泄露而可能导致的损害规模\n\
  - **信息安全策略和程序**：定义在机构内部实施信息安全的范围和方法，以将信息系统运行的风险降低到可接受水平\n- **安全意识和培训**：确保处于各种角色的机构人员（包括承包商和其他支持人员）意识到与其职责相关的信息安全风险，并具备如何避免或最大限地减少这些风险的充分知识\n\
  - **定期安全评估**：每年（至少一次）评估每个信息系统内实施的信息安全控制的有效性，以确定机构面临的剩余风险水平\n- **修复跟踪**：建立一个流程，用于计划、记录和跟踪通过定期安全评估在机构信息系统中识别出的信息安全风险并进行修复的行动\n\
  - **事件响应**：建立检测、响应和报告与机构信息系统及资产相关的安全事件的能力\n- **业务连续性**：建立计划和方法，确保支持机构使命的 IT 资源的业务连续性\n\
  \nFISMA 强调在联邦机构内部实施信息安全时采用基于风险的方法，这是考虑到机构在其使命背景下，信息安全运营的成本必须与其组织的风险状况成比例的。\n\n\n\
  \n\n\n2014 年，政府发布了《联邦信息安全现代化法》(FISMA) \\[4\\]，以更新由 2002 年 FISMA 确立的政府网络安全实践。FISMA\
  \ 2014 重新设立并修订了管理和预算局（OMB）局长对机构信息安全政策和实践的监督权限。它还规定了国土安全部（DHS）部长的权限，负责管理此类政策和实践的实施，以支持支持联邦行政分支文事机构的信息系统，并根据要求向此类机构提供技术援助和技术部署。\n\
  \nFISMA 2014 要求机构在发生重大安全事件和数据泄露时立即以及每年向国会报告。它还指导 OMB 简化 FISMA 报告，以“消除低效和浪费的报告”。\n\
  \n## 27.4 NIST 风险管理框架\n\n作为 FISMA 执行项目的关键要素，美国国家标准与技术研究院（NIST）开发了一个集成风险管理框架（RMF），该框架有效地整合了所有与\
  \ FISMA 相关的安全标准和指南，促进机构开发全面且平衡的信息安全计划。\n\nNIST RMF 定义了一种结构化方法，用于在信息系统的生命周期内选择、实施、评估和维护安全控制的有效性，其方式与系统的关键性以及系统对更广泛组织构成的风险相适应。NIST\
  \ RMF 的六个步骤为：\n\n1. `1. Categorize`分类：根据信息和信息系统受损的潜在影响，确定信息系统的关键性。\n2. `2. Select`选择：根据信息系统的安全分类，识别出减轻信息系统风险所需的最小安全控制集（基准）；并根据组织的风险评估，按需裁切和补充安全控制基准。\n\
  3. `3. Implement`实施：对所选的安全控制实施实施，并记录实施状态以及控制的实施方式。\n4. `4. Assess`评估：使用适当的评估方法评估安全控制，以确定控制是否正确实施、按预期运行以及在安全方面是否产生了预期结果。\n\
  5. `5. Authorize`授权：审查通过评估识别出的缺陷和对组织构成的风险，以确定风险是否可接受以及信息系统是否可以批准运行。\n6. `6. Monitor`监控：随着信息系统的变化和运行环境的演变，持续评估安全控制的实施状态和有效性。\n\
  \n作为 RMF 一部分实施的安全控制定义在最新版本的 NIST 特别出版物 800-53 \\[5\\]中。RMF 模型的重点是拥有或运行目标系统的组织的风险识别、缓解和接受。\n\
  \n## 27.5 国防部 (DoD) 风险管理框架\n\n国防部指令（DoDI）8510.01 号由国防部首席信息官（CIO）于 2014 年发布 \\[6\\\
  ]，旨在为国防部信息技术（IT）建立 RMF，建立相关的网络安全政策，并分配执行和维护 RMF 的责任。在此之前，国防部的评估和授权活动是基于在 DoDI 8500.2（信息保证实施）中列出的信息保证控制以及\
  \ DIACAP/RMF 知识服务上的信息保证控制验证程序。\n\nDoDI 8510.01 与 NIST SP 800-37《应用风险管理框架指南》 \\[1\\\
  ]一致，该指南定义了联邦政府的 RMF。国家安全系统委员会（CNSS）指令 1253 号《国家安全系统的安全分类与控制选择》以及 NIST SP 800-53《联邦信息系统和组织的安全与隐私控制》\
  \ \\[5\\]已纳入此国防部政策，并作为国防部信息系统评估过程中使用的安全控制和控制基准的基础。DoDI 8510.01 还为国防部内部与其他联邦机构之间授权决策和文件的互惠认可提供了程序性指导。\n\
  \n## 27.6 联邦风险与授权管理计划 (FedRAMP\n\n为了给美国联邦政府使用的云端信息系统提供一致的安全要求，并利用跨多个政府客户的同一项云服务的评估和授权，联邦风险与授权管理计划（FedRAMP）由通用服务管理局（GSA）、国防部、国土安全部和\
  \ NIST 共同开发。OMB 于 2011 年 12 月发布了一份名为《云计算环境中信息系统的安全授权》的备忘录，指示所有行政部门和机构的 CIO 使用 FedRAMP\
  \ 基准和流程为云服务授予安全授权。\n\nFedRAMP 使联邦组织能够快速采用已获得运行的云服务。云服务可能会获得 FedRAMP 联合授权委员会（JAB）的临时授权，或来自联邦机构的完全授权。先获得的\
  \ FedRAMP 授权可以被一个或多个希望使用相同云服务的机构利用，从而节省大量的成本和精力。FedRAMP 框架 \\[7\\]包含以下主要组件，以促进云认证和认可：\n\
  \n* 针对低影响和中等影响水平云系统的标准化安全控制基准，解决适用于云环境的特定威胁和漏洞\n* 用于开发包含云系统安全包的文档模板集，以及引导 FedRAMP\
  \ 流程的指南\n* 关于 FedRAMP 流程的在线培训\n* 对 FedRAMP 第三方评估机构（3PAOs）进行正式认可的模型，这些机构被批准可对云服务进行独立安全控制评估\n\
  * 由 FedRAMP JAB 对提交的临时运行许可（ATO）的 FedRAMP 授权包进行严严格审查\n* 将 FedRAMP 要求纳入采购文件的指南和标准化合同语言\n\
  * 可供全政府范围内的云服务授权包存储库\n\n如果满足以下条件，则云服务提供商（CSP）即被认为符合 FedRAMP 的要求和流程：\n\n* 安全包使用了要求的\
  \ FedRAMP 模板。\n* 所有的 FedRAMP 安全控制已通过直接或补偿控制（在允许的情况下）满足。\n* CSP 已由对该系统无利益冲突或偏见的独立评估员进行评估。\n\
  * 针对临时运行许可（p-ATO）或完全 ATO 的授权信已在 FedRAMP 项目管理办公室（PMO）存档。\n\n### 27.6.1 FedRAMP 评估（认证](#chapter27.xhtml#re_ch-27-sec-7)\n\
  \n\n\n\nFedRAMP 流程旨在确保所有获得 FedRAMP 合规性的云服务提供商（CSP）都以标准化的方式接受评估 [8]。CSP 需要选择与其授权路径一致的独立评估员——对于\
  \ JAB p-ATO 路径，必须选择经 FedRAMP 批准的第三方评估组织（3PAO），但对于机构 ATO 路径，则是可选的。所选评估员负责使用 FedRAMP\
  \ 提供的模板准备安全评估计划（`SAP`），该计划必须在开始测试前获得 CSP 的批准。此外，`SAP` 还必须在测试前获得 FedRAMP JAB（针对 JAB\
  \ p-ATO 路径）的批准。在对 CSP 进行评估时，评估员必须使用 FedRAMP 提供的安全评估测试用例（这些测试用例基于 `NIST SP 800-53A`，并根据云系统的独特性进行了扩展），并在测试用例模板中记录发现结果。\n\
  \n在 FedRAMP 下，自动化扫描（经过身份验证和未经身份验证）以及渗透测试是强制性的。如果 CSP 在其产品中开发并使用自定义代码，则要求其运行源代码扫描。FedRAMP\
  \ 提供了执行这些技术测试步骤的方法论指导。\n\n安全评估报告（`SAR`）由评估员在评估活动结束后使用 FedRAMP 提供的模板编制，并包含评估员关于 CSP\
  \ 是否准备好授权的建议。对于 JAB p-ATO 路径，评估员将向 FedRAMP PMO 和 JAB 汇报评估结果以及授权建议的依据。\n\n### 27.6.2\
  \ FedRAMP 授权（认证](#chapter27.xhtml#re_ch-27-sec-8)\n\nFedRAMP 为 CSP 支持两种基本的授权模型：JAB\
  \ p-ATO 和机构 ATO。下文将对其描述。\n\n### 27.6.2.1 JAB 临时运行授权 (JAB p-ATO](#chapter27.xhtml#re_ch-27-sec-9)\n\
  \n在该模型下，CSP 向 FedRAMP PMO 申请 JAB p-ATO，并根据现有的模板和指南准备 FedRAMP 文档。FedRAMP PMO 和 JAB\
  \ 在 CSP 移动到流程的下一步之前，会在每一步审查并批准这些文档。例如，CSP 必须在开发 `SAP` 之前获得批准；`SAP` 必须在开始实际测试和开发\
  \ `SAR` 之前获得批准。CSP 需要聘请经 FedRAMP 批准的 3PAO 来执行评估。评估结果记录在 `SAR` 中，并由评估员提交给 JAB。整个授权包将由\
  \ JAB 进行严格审查。CSP 需要根据需要进行调整，以达到 JAB 要求的合规和质量水平。当 JAB 认为授权包满足所有技术和质量要求时，CSP 将获得临时运行授权（`p-ATO`）。随后，FedRAMP\
  \ PMO 将授权包上传到 FedRAMP 仓库。\n\n### 27.6.2.2 机构运行授权 (Agency ATO](#chapter27.xhtml#re_ch-27-sec-10)\n\
  \n在该模型下，CSP 与特定的机构终端客户合作以获得授权。（注：原文此段存在大量重复句子，译文遵循原文句式结构）\n\n\n\n\n1. 联合任务组转型倡议，NIST\
  \ 特别出版 800-37 修订 1《将风险管理框架应用于联邦信息系统的指南》，2010 年。\n2. 管理和预算局，OMB A-130 号公告附录 III，《联邦自动化信息资源安全》，1996\
  \ 年。\n3. 美国国会，公法第 107-347 号，《电子政府法》第三章，信息安全，2002 年。\n4. 美国国会，公法第 113-283 号，《2014\
  \ 年联邦信息安全现代化法案》，2014 年。\n5. 联合任务组转型倡议，NIST 特别出版 800-53 修订 4《联邦信息系统和组织的安全与隐私控制》，2013\
  \ 年。\n6. 国防部，第 8510.01 号指令，《国防技术（IT）风险管理框架 (RMF》，2014 年。\n7. FedRAMP，《理解 FedRAMP\
  \ 指南，版本 2.0，2014 年》。\n8. FedRAMP，《FedRAMP 安全评估框架，版本 2.0，2014 年》。\n9. 国防部，《云计算安全需求指南\
  \ (SRG)，第 1 版，发布版 1，2015 年》。\n\n# 第 28 章：政府认证、认可、法规与合规风险\n\nThorsten Herre\nSAP\
