  \ 安全相关数据中心事件定义\n### 29.4.5 数据中心员工意识培训\n### 29.4.6 数据中心合规性与认证\n## 29.5 总结\n\n# 参考文献\n\
  \n## 29.1 引言\n云计算（或简称云）已成为一种业务模式，也是一种应用交付模式。许多云服务提供商通过软件即服务 (`SaaS`)、平台即服务 (`PaaS`)\
  \ 或基础设施即服务 (`IaaS`) 交付云计算。所有交付类型的共同点是它们都在云数据中心运行，这些中心需要满足最高的安全和数据保护需求。云模型中的安全担忧例如：信息会被窃取吗？泄露会损害机数据吗？谁可以访问数据中心中的客户数据？数据是否会被存储或传输到其他国家？\n\
  \n\n\n\n\n因此，云模型的核心安全关注点集中在身份管理、数据存储位置、系统操作、数据传输和流量控制[1]。在本章中，我们想要深入探讨使用云数据中心的特定安全和风险方面，以及云客户如何评估和衡量其选择的云数据中心提供者的安全性。\n\
  \n## 29.2 使用云数据中心的优势 (#chapter29.xhtml#re_ch-29-sec-2)\n\n与传统的内部或本地 IT 运营相比，云数据中心提供商可以为客户提供许多优势[2,\
  \ 3, ]。大多数中小型企业由于成本、技能或无法跟上技术进步，在本地 IT 方面十分挣扎。越来越多的初创公司（尤其是来自硅谷的）正将纯粹的 IT 和数据中心运营视为应由专业的云服务提供商处理的商品。即使是许多过去运营自己数据中心的财富\
  \ 500 强也发现，使用云数据中心提供商具有更大的收益，至少作为其核心 IT 系统和业务应用程序的可扩展扩展。我们可以将云数据中心的主要优势分为七个领域：\n\
  \n*   云数据中心更安全。\n*   云数据中心降低了投资成本。\n*   云服务提供商提供了更好的扩展选项。\n*   云数据中心提供灵活的资源。\n*\
  \   云数据中心使用先进的 IT 和安全技术。\n*   云数据中心客户无需处理数据中心运营。\n*   云数据中心在全球可用，并允许即时的高可用设置。\n\n\
  在接下来的章节中，我们将检查这些优势并进行更详细的解释。\n\n### 29.2.1 云数据中心通常更安全 (#chapter29.xhtml#re_ch-29-sec-3)\n\
  \n大多数云数据中心比其本地对应更安全，特别是对于那些不将 IT 安全作为其主要技能或重点的公司而言。许多公司需要使用 IT 服务来经营业务，但希望将精力集中在核心业务流程上，如银行、制造业、石油天然气、零售、物流或医疗保健。对他们来说，IT\
  \ 及相应的 IT 安全是一项复杂且昂贵的尝试。特别是小企业，可能无法很好地保护自己免受新兴的网络威胁。在这种情况下，外部云服务提供商可能是最安全且最便宜的解决方案。\n\
  \n云数据中心提供商的核心业务是确保数据中心运营的稳定安全。如果客户不再信任其设施以及数据处理或存储能力的安全性，他们将立即破闭。因此，此类提供商投入了大量预算来增加和确保其服务的物理和逻辑安全。图\
  \ 29.1 显示了云数据中心需要通过实施安全控制和持续监控这些领域来涵盖的安全域层级。由于它们也是许多关键业务的中央托管伙伴，它们也成为了黑客或犯罪分子的首要目标。这使得云数据中心不可避免地需要提供可能的安全标准和措施，例如高级的拒绝服务保护或入侵检测监控系统[4]。\n\
  \n![图 29.1 数据中心安全控制层级。](img/fig29.1.jpg)\n\n图 29.1 数据中心安全控制层级。\n\n此外，广泛的云客户及其各自特定的行业或国家特定需求，要求云数据中心必须满足一系列认证和证明，才能允许与此类行业或在这些国家工作。作为副作用，这些组合需求通常会将数据中心的安全性提高到公司自有数据中心无法比拟的水平。\n\
  \n### 29.2.2 将投资成本替换为运营成本 (#chapter29.xhtml#re_ch-29-sec-4)\n\n建设、维护或扩展数据中心是一项非常昂贵的长期投资[5]。这同样适用于购买最新服务器、网络或存储硬件所需的投资。通常，这些是预先花费的数百万美元。互联网或广域网（WAN）链路提供商还有额外的运行成本、设备支持和维护费用，最后但同样关重要的巨大的电力和冷却成本。在瞬息变化的\
  \ IT 应用世界中，所有这些因素都需要考虑进去，因为它们的设施需求每年可能会变化。购买的设备在一年后可能已经过时，或者系统仅在峰值时期（例如季度末结算）才充分利用所购买的基础设施。因此，存在在错误的地方花费大量资金的风险。\n\
  \n通过使用云数据中心，所有这些成本都由云服务提供商承担，客户仅按租赁模式支付使用的服务器或存储等基础设施资源费用。你不需要为空闲系统付费，也不需要预先投资。这种按需付费的模式对许多公司来说比建立自己的基础设施更有吸引力。省下的钱可以更有效地花在公司的核心业务上，而不是投资在自己的\
  \ IT 组织中。\n\n### 29.2.3 从云服务提供商的规模和可扩展性获利 (#chapter29.xhtml#re_ch-29-sec-5)\n\n\
  由于全球许多数据中心托管了超过 10 万台服务器和数 PB 的存储空间，每台服务器或每个存储磁盘的成本非常低。由于批量订单和设备更换合同，他们可以与供应商谈判出出非常低的单价。许多\
  \ IT 基础设施规模小得多的公司无法从供应商处获得此类折扣，或极具吸引力的维护和支持条件。\n\n云数据中心客户通过获得相同的基础设施成本直接从这些条件下获利。某些\
  \ IaaS 提供商甚至推销他们在过去几年中降低了服务器或存储成本的事实，并提供市场上最低的成本模型。\n\n云数据中心提供商只有在持续降低基础设施和运营成本时，才能提供竞争性的产品。因此，对于云用户或客户来说，通过获得最低成本从这些发展中获利是一个受欢迎的副作用。\n\
  \n### 29.2.4 提供灵活的资源容量 (#chapter29.xhtml#re_ch-29-sec-6)\n\n云数据中心提供商始终确保有足够的计算能力，从而减轻了云端用户处理硬件和资源规划的负担。在传统的\
  \ IT 环境中，所需网络、服务器和存储硬件的容量管理和成本计算是 IT 总体成本计算的重要部分，并使长期规划变得必要。例如，你无法立即双倍处理能力（服务器 CPU）或内存消耗，因为这需要新的或扩展的硬件，而这些硬件的交付和建立时间需要数周，并将花费数十或数百万美元。你可能只想在季度末财务报告或某些密集的短期科学计算中消耗这些额外功率。在这些情况下，租赁所需的资源比购买整个硬件更有意义。此外，你无法轻易地丢弃不必要的或未使用的硬件。\n\
  \n\n\n\n在云数据中心中，你不再需要关注底层硬件，只需为实际消耗的资源付费（例如，以分钟为单位）。提供商为所有客户批量购买硬件，并计算必要的冗余以服务未来客户的增长和增加的需求。从外部角度看，这为云端用户提供了看似无限且即时的资源缩缩能力。\n\
  \n### 29.2.5 始终从最先进的技术中获益\n\nIT 行业节奏极快，今天的顶尖硬件技术可能在 1 到 2 年后就被更好、更快的产品取代。更糟糕的是，数据的指数级增长以及新应用对处理能力的需求迫使你必须定期购买新设备。这些投资是巨大的，对于中小型企业甚至单个终端用户来说大多数情况下负担不起。全球社区和企业正在产生越来越多需要存储和处理的数据。在未来，每个行业中的几乎每个产品都将拥有传感器或某种数据生成或处理能力。大型云数据中心提供商不断投入更换和升级基础设施，以满足所有客户的需求。他们被迫使用新的硬件技术，以便以相同甚至更低的价格提供更高效的资源。图\
  \ `29.2` 显示了在数据中心服务器架中使用冷通道设计的优点，这可以优化热交换，从而降低冷却成本或允许每个机架上放置更多服务器（高密度配置）。与传统的托管模式相比，云客户通过此类投资获得了更好、更廉价的处理能力、存储空间或网络连接。\n\
  \n![图 29.2 冷通道设计的优势。](img/fig29.2.jpg)\n\n图 29.2 冷通道设计的优势。\n\n### 29.2.6 数据中心或服务器运营维护无直接成本\n\
  \n云客户无需处理硬件管理、寿命结束硬件的更换或所需的硬件和软件支持合同。整个数据中心的运行由云提供商完成，其中包含了必要的运营团队。因此，云客户可以减少对熟练\
  \ IT 或数据中心员工的需求。运行拥有持续培训员工的数据中心是一项重大的长期投资。通过将数据中心和基础云服务运营交给云提供商，这些成本可以减少甚至完全消除。\n\
  \n### 29.2.7 即时全球范围和高可用性选项\n\n大多数云服务提供商为客户提供多个可选的数据中心站点。这些数据中心在全球范围内不同的司法管辖区运行。选择靠近消费者或终端用户的数据中心和存储位置是有利的。此外，选择也可以基于某些行业或公司给出的先决条件。例如，数据应仅在美国处理或仅在欧盟境内处理。许多公司无法投资建立全球数据中心站点网络，因此依赖于此类已经具有这种全球范围的提供商。\n\
  \n此外，云提供商的全球化布局使得通过将数据复制到多个站点甚至外包到其他国家来设计高可用性解决方案变得更容易。本地附近的数据中心站点可以协同工作，构建如 `Figure\
  \ 29.3` 所示的市级集群配置以实现最大冗余，或者实现在线同步切换场景。\n\n![图 29.3 数据中心市级集群配置示例。](img/fig29.3.jpg)\n\
  \n图 29.3 数据中心市级集群配置示例。\n\n更有甚，这些切换和数据冗余配置可以根据云客户的业务需求随时更改。因此，消费者从其数据和应用的极高可用性和冗余选项中获益。\n\
  \n## 29.3 使用云数据中心的风险\n\n在使用云服务提供商或云数据中心之前，需要考虑许多问题和风险。在责任、响应或透明度义务上会出现合同问题，这在云服务提供商与客户之间产生了不匹配的预期。从自建或自运营的应用切换到基于云的应用可能会导致安全控制的丢失，这些控制在云环境中不再存在，甚至无法实现。认为云服务可以像旧的“内部”本地应用程序一样运行或操作的想法在很大程度上是一个错误的假设。此外，云客户在与服务提供商合作时，必须意识到已变化的运营和架构设计原则，以确保以安全可靠的方式使用云技术。\n\
  \n企业和组织迁移到云解决方案的底线是，他们必须对云服务提供商进行尽职调查，以了解这种新合作中涉及的风险 `[6]`。\n\n### 29.3.1 安全风险\n\
  \n云服务提供商应实施与云客户预期或行业最佳实践相同、甚至更高水平的安全控制。由于存在不安全的应用程序或权限处理功能，存在信息泄露或数据完整性的逻辑风险。应用程序或底层基础设施可能被黑客利用。用户权限和角色模型也可能被外部黑客或拥有过多访问权限的内部员工利用。通常情况下，需要应用与任何\
  \ IT 系统相同的安全措施。其复杂性源于云技术模型，该模型基于虚拟化和基础设施层之间的分担责任。云服务提供商必须负责其唯一责任的物理和逻辑安全。对于 IaaS\
  \ 提供商，这适用于数据中心、后端网络层、虚拟化和虚拟机设置以及其他基础基础设施服务（如存储、备份或负载均衡）。PaaS 和 SaaS 提供商也负责操作系统、数据库和应用程序层的安全。相反，这意味着云客户必须明智地使用安全功能和配置选项来建立安全环境。例如，云服务提供商可能提供加密，但由客户激活并使用它。网络、操作系统和应用程序安全措施的清晰责任划分是实现此类安全云解决方案的关键优先事项。\n\
  \n\n\n\n云数据中心的物理安全措施的实施是为了防止犯罪、“黑客主义”或恐怖主义攻击；防止环境威胁（如自然灾害）；或防止企业或政府间谍活动。犯罪分子试图窃取或操纵云客户的数据来获利。他们针对的是那些提供易于出售或变现的高价值数据的系统。个人数据、银行账户或信用卡数据是他们的关注重点。犯罪分子并不想破坏数据或公司，因为这会破坏他们从这些活动中获取资金的意图。归类在“黑客主义”术语下的黑客大多具有政治意图，或希望在黑客社区中获得认可。因此，他们喜欢操纵网站或数据以服务其政治目标或获得理想的媒体关注。与提到的其他威胁相比，他们是远程操作，并利用逻辑安全漏洞入侵云系统。另一方面，恐怖分子也有非常强烈的政治或宗教意图，但他们想要伤害并破坏他们的目标。与犯罪分子相比，他们不想窃取数据，而是想通过震慑等战术造成最大的破坏。形成鲜明对比的是，企业或政府间谍想要待在阴影中，在不被数据所有者发现的情况下窃取或操纵数据。他们也不受金钱或个人声名的驱动。这种威胁最难检测和防范。\n\
  \n## 29.3.2 数据丢失概率\n\n正如著名的格言所，“不要把所有的鸡蛋放在同一个篮子里”，考虑数据分段和数据备份策略至关重要。尽管云提供商已同意提供高数据可用性，但决定例如，至关重要的核心业务数据是否应仅存储在一个提供商或一个位置中，是云客户的责任。作为一般原则，数据必须存储并复制到另一个数据中心站点，该站点不不受与主数据中心位置相同威胁的影响。IT\
  \ 部门至少应该在几百英里之外，甚至在另一个州/国家。此外，如果适用，客户还应该考虑在自己的数据中心或办公大楼中存储数据的备份。\n\n另一个风险是由于访问云服务和数据本身一直需要远程连接，这是持续的需求。远程连接的稳定性和足够的带宽成为云服务契约中至关重要的业务要素。一方面，云提供商必须为客户提供冗余且快速的互联网提供商或专线（MPLS、WAN），而客户本身必须与其电信供应商约定良好且稳定的连接。\n\
  \n如果某些功能或数据现在位于公司外的云服务提供商处，集成内部 IT 系统将变得更加困难。旧的内部 IT 系统需要以安全可靠的方式与新的云解决方案对接。在私有云部署中，云系统和数据存储甚至作为企业自有网络的扩展，并应该透明地集成到内部\
  \ IT 中。在这种情况下，内部和外部的边界变得模糊，这使得清晰的操作模型和安全控制变得更加重要。\n\n许多公司也没有明确的数据丢失防护计划。云可能会允许前员工在每天在公共云中进行的正常上传过程中访问机密文档或数据。云客户需要一个清晰的内部信息分类标准，并必须决定哪些数据应该上传到云解决方案中。必须对员工进行正确使用云的培训，监控也必须扩展到云环境。\n\
  \n## 29.3.3 停机与韧性\n\n云提供商必须证明（例如通过独立审计）可用性和冗余功能如广告的那样运行，并提供必要的服务和数据可用性。缺乏此类备份或恢复能力将被视为任何生产性云解决方案的重大风险。特别是，恢复或快照功能必须定期测试。但如果云客户没有正确配置，最好的备份和归档技术也是徒劳。因此，在将数据上传到云之前，也有必要定义清晰的数据可用性和备份策略。\n\
  \n此外，核心云数据中心服务（如电源、冷却、网络、存储和服务器虚拟化）的运行稳定性对于防止停机或至少减少停机的影响至关重要。冗余高可用电源和冷却的示例如图 29.4\
  \ 和 29.5 所示。该示例数据中心使用了多个电源提供商，并通过油发电机和电池提供应急电源。同样，在主冷水器故障的情况下，使用冷水箱进行应急冷却。\n\n![图\
  \ 29.4 冗余电源](img/fig29.4.jpg)\n冗余电源\n\n![图 29.5 冗余冷却示例](img/fig29.5.jpg)\n冗余冷却示例\n\
  \n数据中心和基础设施运营团队必须具备处理停机并防止逻辑或物理威胁发生的技能。员工需要是的，管理活动需要云提供商 24/7 监控。如果不是这样，会导致云用户面临巨大的运营风险。\n\
  \n而言，云客户需要考虑云数据中心停机的影响和后果，并问自己其核心业务流程是否依赖于此。他必须与云提供商定义清晰且可接受的服务水平。\n\n## 29.3.4\
  \ 考虑学习曲线\n\n首先，建立成功的云采用策略需要多个技术领域的知识。即使之后，管理和使用生产性云解决方案可能是一个问题。需要专门培训的员工来理解和处理私有云技术。使用公共\
  \ SaaS 云必须建立明确的责任划分、数据处理规则和运营概念。“它运行良好”不是不理解给定云模型的借口。熟悉的内部流程和控制在云部署中可能不再适用，需要采用并推广到员工甚至终端用户。\n\
  \n## 29.3.5 供应商锁定\n\n考虑数据导出和迁移选项以防止云供应商锁定。大多数提供商都有进入云端的方法，但将数据甚至系统移动到另一个云提供商可能会很困难。这是因为缺乏跨云数据交换格式或标准。即使有下线功能，也可能非常耗时，甚至不完整（例如丢失应用程序自定义数据）。云客户应提前三或五年进行计划，并考虑可能的退出策略。云提供商还可能停止部分或全部服务，使云客户陷入险地。\n\
  \n## 29.3.6 法律与合同风险\n\n\n\n\n\n许多云提供商使用消费者而言不可协商的标准合同以及条款和条件。消费者必须接受云提供商运行其业务以及处理和/或访问云数据的方式。所有这些“即服务”的云产品都有共同点，即它们为所有客户提供标准化服务，且定制化选项有限。但某些受监管的行业（如银行、保险、制药或医疗保健）要求经过修改的控制措施或特殊的审计权限，这些可能与标准的云协议发生冲突。一些位于美国的云提供商在处理特定国家的法律法规时（例如欧盟数据保护法）面临较大困难，因为它们的协议是在美国法律思维背景下编写的。某些国家（如俄罗斯或中国）甚至要求专门的本地云安装和运行，以符合其法律并允许本地业务投入使用。如果云客户不考虑这些法律问题，可能会违反其所属行业标准或适用法律\
  \ [7]。\n\n### 29.3.7 合规性与控制权\n\n在许多情况下，使用云提供商意味着将 IT 基础设施的关键部分甚至核心业务应用程序交给外部公司。因此，过去执行的某些控制措施现在由云提供商负责。客户对这些控制措施没有或只有非常有限的监督。云提供商可以信任吗？\n\
  \n云服务提供商应该执行并展示行业认可的认证和证明，如 `SOC1`、`SOC2`、`ISO27001`、`ISO22301`、`PCI`、`HIPAA`、`CSA`，以符合特定行业法规以及整体安全可靠的云运行。\n\
  \n此外，必须讨论云提供商运营所在地国家监控的法律依据。必须明确在什么条件下，对个人的重大数据收集和存储需要向公共机构报告。\n\n合规问题必须进行端到端的讨论，这包括云服务提供商使用的分包商或供应商。这些分包商或合作伙伴必须遵守并在合同上约束与提供商同水平的安全和控制措施。\n\
  \n## 29.4 云数据中心安全\n\n以下章节描述了云数据中心提供商应应用哪些措施来防止上述的风险和威胁。列出的要求可以作为云提供商评估的起点，或作为定义自有云数据中心策略的依据\
  \ [8]。这些要求和措施源于各行业的企业业务需求以及全球数据中心提供商的最佳实践。\n\n### 29.4.1 数据中心可用性要求\n\n使用的云数据中心应至少符合\
  \ `ANSI/TIA-942` 标准概述的 III 级可用性和数据中心组件冗余 [9]。某些提供商甚至运行符合 III+ 或 IV 级的数据中心。一个符合 III\
  \ 级标准的云数据中心应保证整体 99.982% 的可用性并使用双电源设备。图 29.6 显示了不同层级在整体可用性方面的差异。这种对电源、网络和冷却组件的容错设置是提供此类高可用性保证所需的。我们区分\
  \ `n+1` 和 `2n` 安装。`n+1` 配置意味着，如果你运行某项功能需要 `n` 台设备，你将额外拥有一个备用件。如果任何一个设备损坏，一切仍然可以按预期工作。在\
  \ `2n` 配置中，你拥有的设备数量是需要的两倍。因此，所有 `n` 台设备都可以故障而不中断云数据中心的服务。所有使用的云数据中心核心组件必须至少使用 `n+1`\
  \ 冗余设置。\n\n![图 29.6 数据中心层级。](img/fig29.6.jpg)\n\n图 29.6 数据中心层级。\n\n### 29.4.2 数据中心物理安全要求\n\
  \n数据中心的物理安全要求可以按领域分组，如位置威胁、周边界安全、影响安全的建筑设计措施或通用访问控制措施。将这些物理安全方面在规划阶段就构建到数据中心是至关重要的，因为在大多数情况下，对现有建筑进行改造以满足所需的物理安全要求是非常困难且昂贵的。\n\
  \n#### 29.4.2.1 数据中心位置\n\n数据中心的位置不能受到环境威胁的增加，如风暴、暴雪、地震或洪水。数据中心的核心建筑组件不应超过 15 年或处于荒废状态，以避免电布线不良、材料退化和管道生锈的风险。\n\
  \n作为额外建议，如果位置紧邻机场、化工厂、核电站或主要铁路线，或位于高犯罪区域，数据中心应进行风险评估研究。这些元素会为数据中心提供商的可用性或数据安全带来额外风险。\n\
  \n#### 29.4.2.2 周边界安全\n\n数据中心建筑周围应有围栏。如果没有围栏，数据中心房间的墙不应位于建筑的外墙。如果安装了围栏，其高度应至少为 2\
  \ 米（7 英尺）。应部署闭路电视 (`CCTV`) 系统来监控边界和访问点。对 `CCTV` 管理系统和存储视频的访问应根据按需使用的原则进行限制。`CCTV`\
  \ 录像必须存档至少 30 天，除非有其他法律限制。图 29.7 显示了数据中心周围此类 `CCTV` 设计的示例，显示必须有足够的摄像头防止建筑周围和围栏处出现任何盲点。\n\
  \n![图 29.7 数据中心围栏和 CCTV 设置示例。](img/fig29.7.jpg)\n\n图 29.7 数据中心围栏和 CCTV 设置示例。\n\n\
  该设施从外部不应能被识别为数据中心，且围栏附近不允许停车，以降低利用停放车辆越围栏或放置汽车炸弹的风险。如果数据中心使用警卫巡逻边界并确保建筑安全措施不被篡改，也将有所帮助。\n\
  \n#### 29.4.2.3 建筑安全\n\n主入口点门应为实心门（首选金属门），并提供合理的防入侵和防开锁能力。在某些国家（例如欧盟国家），甚至有政府批准的门强度等级\
  \ [10]，可以作为检查数据中心入口点的基准。门的耐火等级应与相邻墙体相同，以确保整个房间或隔间能抵抗等时间的火灾。这既适用于外门，也适用于内部机房。它们必须具有\
  \ 60 分钟 (`F60`) 或更好的 90 分钟 (`F90`) 耐火等级和保护 [11]。如果向外开启的外门具有密封（焊接）的合页销和插销，将会有益，这样它们无法被拆卸。\n\
  \n\n\n\n\n数据中心机房或大厅不应有任何外窗。如果数据中心建筑没有外围栏但安装了外窗，则应加装入侵检测器和玻璃破碎传感器。\n\n走廊和机房的照明应始终保持开启。确保连续照明或开启运动检测的照明是良好做法。这可以确保监控摄像头（CCTV）获得最佳视野。\n\
  \n装卸区用于将 IT 设备等物品运输到数据中心，必须遵循与其他主要入口相同的访问控制和 CCTV 要求。使用装卸区传输的材料或设备应进行记录和记录。\n\n\
  此外，必须安装防盗报警和入侵检测系统，进行 24/7 监控，并自动通知安保服务或当地警方。\n\n云数据中心提供商应设立安全监控中心或房间，并配备 24/7 值守。对于高安全运行需求，建议使用专门的工作区域或服务器/机架组装室，这可以减少在生产性机房内的工作时间，并确保组装副产物（例如工具、螺丝和包装材料）不会留在数据中心机房内。这同时也减少了需要进入生产性机房的人员数量。\n\
  \n通常情况下，根据所在地，数据中心建筑应采取防止害虫、电磁场和过度震动的保护措施。\n\n## 29.4.2.4 访问控制\n\n数据中心提供商必须确保只有定义的特定人员可以物理访问数据中心核心基础设施。服务提供商必须记录进入服务器区域的人员姓名和时间。因此，必须实施云数据中心设施的访问请求工作流。数据中心访问日志和访客日志必须保留\
  \ 3 个月。此外，数据中心访问撤销流程必须遵循相同的安全措施。必须撤销不再需要访问的用户访问权限。通常，此数据中心访问管理流程由独立的认证和审计伙伴进行审计，并记录在案，例如记录在\
  \ `SOC1` 或 `SOC2` 报告的数据中心控制措施中。\n\n为了更好地控制访问并达到更高的安全标准，访问控制系统应使用电子门卡或生物识别技术，特别是结合双因素访问控制（例如：门卡+指纹读器）。`Figure\
  \ 29.8` 显示了需要使用门卡和指纹的服务器管理员的访问控制设置示例。需要注意的是，技术人员不需要进入服务器楼层的权限，因为用电间是分开的。另一方面，如 `Figure\
  \ 29.9` 所示，技术人员有自己的访问配置，甚至通往用电间（如电池间或变压器间），这些房间在物理上与实际服务器房是隔离的。\n\n![Figure 29.8\
  \ Data center access for server administrators.](img/fig29.8.jpg)\n\n图 29.8 服务器管理员的数据中心访问控制。\n\
  \n![Figure 29.9 Data center access for external technicians.](img/fig29.9.jpg)\n\
  \n图 29.9 外部技术人员的数据中心访问控制。\n\n数据中心主要入口处应至少使用感应间（风道/防撞门，Ingress mantraps）。感应间门互锁的设计规范规定，任何两扇相邻的门不能同时开启（例如，从外部进入大厅的门和进入感应间的门不能同时打开）。）。这样做是为了防止任何人在进入或离开数据中心时绕过安全访问程序（包括系统驱动和办公驱动）。仅靠闸机是不够的。如果使用了物理钥匙和锁（例如用于紧急访问），这些钥匙应储放在有守卫的安全地点，并对所有使用情况进行记录。\n\
  \n## 29.4.2.5 消防保护\n\n数据中心必须安装火灾检测传感器，如气体、烟雾或热传感器，并按照制造商建议定期进行维护和检查。这同样适用于自动灭火系统，如氩气、水雾系统或喷淋系统。火警系统必须由数据中心运营团队进行\
  \ 24/7 监控。如果使用便携式灭火器，它们必须适用于存放技术设备的数据中心区域或服务器机房，并定期进行维护和检查。\n\n## 29.4.2.6 防水保护\n\
  \n在执行核心功能的房间或区域内应避免任何类型的水管。如果无法避免使用水管，则应采取措施尽快检测任何泄漏，从而将影响降至最低。\n\n### 29.4.3 数据中心安全级别\n\
  \n安全级别的目的是定义数据中心正确安全、可靠运行的安全相关参数，并应在云服务提供或相应的服务协议（`SLA`）中描述，如 `Table 29.1` 所示。这些合同条款或协议还应涵盖报告实例的定义、报告频率和渠道。云数据中心安全级别主要指的是核心组件（如\
  \ CCTV 摄像头系统、入侵检测系统、访问控制系统或消防系统）的可用性和维护水平。这些核心组件必须 24/7 运行并在故障后几天内修复。\n\nTABLE 29.1\
  \ 数据中心安全级别协议示例 (S-SLA)\n\n![](img/T29.1.jpg)\n\n### 29.4.4 安全相关数据中心事件的定义\n\n作为原则，数据中心的安全事件处理应集成到云服务提供商的整体事件管理流程中，并由独立的第三方审计师进行审计。安全事件可以被视为影响云服务可用性和完整性的特殊形式的重大事件。云服务提供商和底层数据中心提供商必须对安全相关数据中心事件有明确的定义。所有相关员工必须清楚如何检测此类事件，以及他们如何反应或使用事件流程和升级路径（例如，向管理层或以数据泄露客户通知的形式）。以下列表包含了数据中心相关的安全事件示例：\n\
  \n*   基础设施相关数据中心事件\n    *   访问控制系统事件\n        *   电子门卡系统故障/损坏\n        *   访问日志或访客日志丢失\n\
  \        *   感应间或通往服务器楼层的门故障\n        *   双因素访问控制故障（如适用）\n    *   安全系统事件\n     \
  \   *   CCTV 摄像头故障\n        *   火灾检测系统故障\n        *   入侵检测系统故障\n        *   允许进入数据中心用电间或服务器房的物理钥匙丢失\n\
  \    *   发现数据中心建筑完整性被破坏\n        *   墙体破洞\n        *   门损坏\n\n\n\n\n\n- 影响服务器或机房室安全的施工工程\n\
  - “任务关键型”数据中心事件：\n    * 数据中心发生火灾并影响服务器楼层\n    * 检测到盗窃\n    * 检测到服务器、存储设备或网络设备被盗\n\
  \    * 生产用设备发生未计划/未经授权的移动\n    * 恐怖袭击（例如，数据中心建筑附近发生汽车弹）\n    *影响数据中心运营的自然灾害\n\n\
  基础设施相关的安全事件应在检测后 24 小时内通知受影响客户。应在同一时间范围内触发对此类事件的响应。另一方面，任务关键安全事件必须在检测后立即进行处理并通知。在这种情况下，极可能需要执法部门的参与。图\
  \ 29.10 显示了潜在的安全事件管理和客户通知流程。此外，数据中心或云服务提供商可以提供月报告，用于后续的根原因分析以及此类安全事件的总体统计。\n\n![图\
  \ 29.10 安全事件管理流程示例。](img/fig29.10.jpg)\n\n图 29.10 安全事件管理流程示例。\n\n### 29.4.5 数据中心员工意识培训](#chapter29.xhtml#re_ch-29-sec-29)\n\
  \n拥有无监管访问权限的数据中心人员必须接受意识培训，内容包括：\n\n* 验证数据中心内第三方的身份\n* 确保在没有官方变更请求和批准的情况下，不安装、维修或更换生产性云资产（例如服务器、存储磁盘）\n\
  * 报告可疑行为或被篡改的设备\n* 了解安全事件处理程序\n\n数据中心提供商应对此项培训的执行情况进行跟踪和记录。培训本身对于每位新入职员工都是强制性的，并应定期（例如每年）对所有员工重复。\n\
  \n### 29.4.6 数据中心合规与认证](#chapter29.xhtml#re_ch-29-sec-30)\n\n根据从数据中心交付的云服务，提供商需要定期向客户提供有效的证明，如\
  \ `SOC 1`（`SSAE 16` 或 `ISAE 3402`）Type II、`SOC 2` Type II 报告，此外还包括有效的 `ISO 27001`\
  \ 认证。此类证明和认证的目的是为客户为定义良好的内部控制系统提供独立保证，并确认定义的安全措施和操作流程在日常运行中得到了遵循。因此，`SOC` 和 `ISO`\
  \ 审计充当通用基准，为所有托管和/或云服务提供商在安全可靠运营方面提供了不分行业的标准。大多数公司需要这些报告和证书，以便其内部审计人员允许将业务关键数据外包或托管到外部云服务或数据中心。\n\
  \n某些数据中心甚至提供特定行业的认证，以符合信用卡行业要求（`PCI 认证`）或医疗或制药行业的要求。最严格的要求来自公共部门（例如政府客户），这在许多情况下迫使云提供商仅为此类业务和数据构建隔离的专用云，这些数据也托管在专门设计的数据中心。云数据中心提供的\
  \ `SOC 1`（`SSAE 16` 或 `ISAE 3402`）和/或 `SOC 2` 报告应确保以下通用控制目标：\n\n* 指定进入服务器楼层的访问请求工作流，包括审批步骤。\n\
  * 服务器房运行带有电子门禁卡的访问控制系统，包括访问日志。\n* 及时撤销对服务器楼层和/或数据中心的访问。\n* 入侵检测系统监控所有数据中心区域以防止意外访问。入侵检测系统至少每年维护一次。\n\
  * 摄像头监控服务器楼层的周围区域，至少每年维护一次。\n* 服务器房提供备用电源。备用发电机至少每年维护一次。\n* 服务器和机房配备适当消防应急系统，至少每年维护一次。\n\
  * 服务器和机房配备空调系统，至少每年维护一次。\n\n如果数据中心提供商在合同签署时未持有 `ISAE3402`/`SSAE16`/`SOC1` Type 2\
  \ 证明或 `ISO 27001` 认证，应在合同签署后给予 12 个月的宽限期提供相应的报告。\n\n## 29.5 总结](#chapter29.xhtml#re_ch-29-sec-31)\n\
  \n使用云数据中心带来的收益总体大于风险，特别是对于无法或不愿负担运营和建立自己的数据中心设施及云基础设施服务的中小型企业而言。使用共享的高质量数据中心在大多数情况下也是扩展和构建面向互联网业务最快、最便宜的方案。这就是为什么许多\
  \ IT 行业初创公司（例如在硅谷）倾向于托管在云数据中心。如果公司和/或终端用户仅考虑一些基本规则，使用此类数据中心服务的风险是可控的。首先，必须明确在云数据中心为了什么用途托管哪些数据。此类数据和用例是否带有法律或特定行业要求，云提供商必须遵守？如果是，必须通过相应的认证以及详细的合同条款和条件满足这些要求。云数据中心内部实施的安全措施和灾难恢复控制必须由客户或受信任的第三方审计师确认。这些检查和审计是持续性活动，应至少每年重复一次。此外，潜在的数据中心客户应该了解市场现状、参考客户或之前的安全事件。这应该确保所选的数据中心能够在合同约定的服务水平内安全地运行客户数据。在本章中，我们概述了使用云数据中心所需的安全措施。它为评估新数据中心的安全合规性提供了合理的基准，并供企业准备此类外包活动使用。\n\
