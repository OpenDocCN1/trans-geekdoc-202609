  \ 总结\n- 延伸阅读\n- 参考文献\n\n## 21.1 引言\n\n我们正见证远程存储服务的爆炸式增长，这些服务允许资源或专业知识有限的客户以低廉成本存储和分发大量数据。客户将数据的存储和管理外包给存储服务提供商\
  \ (SSP)，这些供应商通过合同保护数据并确保数据可以随时供检索。广而言之，SSP 包括云存储提供商（如 Amazon、Google 和 IBM）、面向企业和个人消费者的在线数据备份、恢复或归档服务提供商（如\
  \ Iron Mountain、EVault、Mozy 或 Carbonite），甚至基于 Web 的电子邮件服务提供商（如 Google Gmail 和 Yahoo\
  \ Mail）。验证存储在不可信服务器上的远程数据真实性已成为一个关键问题。该问题出现在点对点存储系统（Kubiatowicz et al. 2000）、网络文件系统（Li\
  \ et al. 2004; Kallahalla et al. 2003）、长期存档（Maniatis et al. 2005）、网络服务对象存储（Yumerefendi\
  \ and Chase 2007）以及数据库系统（Maheshwari et al. 2000）中。此类系统通过让数据所有保留一小部分元数据，允许其在检索时检查数据的真实性，从而防止存储服务器误报或修改数据。\n\
  \n然而，归档存储需要对存储中数据的真实性提供保障，即存储服务器确实拥有这些数据。仅在访问数据时检测数据损坏是不够的，因为此时恢复丢失或损坏的数据可能已经太晚了。归档存储服务器保留着海量数据，其中很少被访问。它们还长期持有数据，在此期间随着存储物理实现的演变（例如备份和恢复、数据向新系统迁移以及点对点系统中成员的变化），可能会面临管理错误导致数据丢失的风险。\n\
  \n在这种情况下，进行审计以确保 SSP 履行其合同义务是必要的。SSP 有许多不履行义务的动机；例如，SSP 可能会试图隐藏因管理错误、硬件故障或攻击导致的数据丢失事件以维护其声誉；SSP\
  \ 可能会丢弃很少访问的数据，以便重新销售相同的存储空间。远程数据完整性检查 (RDIC) 允许审计员挑战服务器提供数据拥有证明，以验证服务器确实拥有客户端原始存储的数据。我们称一种\
  \ RDIC 方案旨在提供数据拥有保障。现有的 SSP 缺乏这一重要功能：每当数据所有者请求时都能证明数据拥有。RDIC 提供了一种定期检查的方法，确保服务器继续存储与客户端原始存储的完全相同的数据。在缺乏此类功能的情况下，SSP\
  \ 必须被无条件地信任，数据所有者失去了对其数据可靠性的控制，因为现有的云存储平台是不透明的，外部审计员不允许检查有关数据冗余和保护水平的声明。当我们在这一图中加入大量数据丢失事件的报告时，云存储就不适用于需要强大的长期安全和可靠性保障的应用。因此，外包存储的风险无法评估。\n\
  \n当存储系统与 RDIC 配合使用时，我们可以区分存储系统整个生命周期内的几个阶段：设置、挑战和检索。要外包文件 `F`，数据所有者在设置期间对文件进行预处理，并将处理后的文件存储在存储服务器上。在挑战阶段，数据所有者可以定期要求服务器提供数据完好的证明。在检索阶段，数据所有者从存储服务器检索数据。\n\
  \n在本章的剩余部分中，我们将概述过去几年提出的几种 RDIC 方案。我们首先介绍为静态设置提出的 RDIC 方案，在这种情况下客户端初始存储的数据不随时间改变（第\
  \ 21.2 节）。然后我们将注意力转向允许数据所有者对外包数据进行更新的 RDIC 方案（第 21.3 节）。在这两种情况下，RDIC 都作为一种审计机制，用于检查存储服务器仍然拥有外包数据，并且在存储服务器不可信时数据可以被检索。\n\
  \n## 21.2 静态设置下的远程数据完整性检查\n\n我们通过介绍此类静态设置 RDIC 方案的要求开始描述这些方案。然后我们介绍了几个早期提出的、不满足所有要求的方案。最后，我们将重点放在静态设置下提出的\
  \ RDIC 的两个主要框架上。\n\n### 21.2.1 RDIC 方案的要求\n\n归档网络存储具有独特的性能需求。鉴于文件数据量大且存储在远程站点，访问整个文件在存储服务器的\
  \ I/O 成本和跨网络传输文件的成本都是昂贵的。读取整个归档（即使是定期读取）也会极大限制网络存储的可扩展性。此外，为了建立数据拥有关系而产生的 I/O 会干扰到按需存储和检索数据的带宽。我们得出结论：客户需要验证服务器是否保留了文件数据，而无需从服务器检索数据并让服务器访问整个文件。\n\
  \n\n\n\n一种远程数据完整性审计方案应当同时是轻量化且稳健的。轻量化意味着它不会给 SSP（存储服务提供商）带来过重的负担；这包括 SSP 处的开销（即计算和\
  \ I/O）以及 SSP 与审计者之间的通信。这一目标可以通过依赖“抽点检查”（spot checking）来实现，即审计者随机对数据的小部分进行抽样并检查其完整性，从而最大限地减少\
  \ SSP 处的 I/O。抽点检查允许客户端检测存储在服务器上的部分数据是否被损坏，但它无法检测数据中极小部分的损坏。稳健意味着方案能够检测到数据的大部分损坏，并在不过度增加开销的情况下减轻\
  \ SSP 的负担；这包括通过计算和 I/O 操作来减轻 SSP 的负担，以及减少 SSP 与审计者之间的通信。这一目标可以通过随机对数据的小部分进行抽样并检查其完整性来实现，从而最大限地减少\
  \ SSP 处的 I/O。\n\n在生成证明时，RDIC 方案包含以下内容：\n\n*   计算开销：生成证明的计算（在客户端）\n*   I/O 开销：在服务器处的数据访问\n\
  *   通信开销：在客户端和服务器之间传输的数据\n\n对于 RDIC 方案，这些开销是轻量化的。轻量化意味着它不会给 SSP 带来过重的负担；这包括 SSP\
  \ 处的开销（即计算和 I/O）以及 SSP 与审计者之间的通信。这一目标可以通过随机对数据的小部分进行抽样并检查其完整性来实现，从而最大限地减少 SSP 处的\
  \ I/O。抽点检查允许客户端检测存储在服务器上的部分数据是否被损坏，但它无法检测数据中极小部分的损坏。\n\n稳健意味着方案能够检测到数据的大部分损坏，并在不过度增加开销的情况下减轻\
  \ SSP 的负担；这包括通过计算和 I/O 操作来减轻 SSP 的负担，以及减少 SSP 与审计者之间的通信。这一目标可以通过随机对数据的小部分进行抽样并检查其完整性来实现，从而最大限地减少\
  \ SSP 处的 I/O。\n\n在生成证明时，RDIC 方案包含以下内容：\n（重复省略）\n\n### 21.2.3 可证明数据所有权（Provable Data\
  \ Possession）\n\nWei 等人（2007, 2011）引入了数据所有权（PDP）模型，该模型允许客户端通过抽点检查来确保服务器仍然保留了数据。在该模型中，客户端在设置阶段预处理文件；在挑战阶段向服务器发送挑战以验证其是否拥有该文件；在检索阶段，客户端从服务器检索数据。这种方法是轻量化的，因为它不需要客户端下载整个文件。\n\
  \n在生成证明时，可证明数据所有权（PDP）方案包含以下内容：\n\n*   计算开销：生成证明（在客户端）\n*   I/O 开销：在服务器处的数据访问\n\
  *   通信开销：在客户端和服务器之间传输的数据\n\n\n\n\n\nAteniese 等人 (2007, 2011) 提出的 RDIC 方案使用了同态可验证标签（HVTs）。给定一个消息\
  \ `b`（对应于文件块），令 `T[b]` 表示其同态可验证标签（每个文件块有一个标签）。这些标签将与文件 `F` 一起存储在服务器上。同态可验证标签作为文件块的验证元数据，它们是不可伪造的，并具有以下属性：\n\
  \n- **无块验证（Blockless verification）**：使用 HVTs，服务器可以构建一个证明，允许客户端验证服务器是否拥有某些文件块，即使客户端无法访问实际的文件块。\n\
  - **同态标签（Homomorphic tags）**：给定两个值 `T[b_i]` 和 `T[b_j]`，任何人都可以它们合并为一个值。`T[b_i] +\
  \ T[b_j]` 对应于消息之和 `b[i] + b[j]`。\n\n由于同态属性，为多个文件块计算的标签可以合并为一个单一值。客户端预先计算文件中每个块的标签，然后将文件及其标签存储在服务器上。在稍后，客户端可以通过对一组随机选择的文件块生成随机挑战，来验证服务器是否拥有该文件。服务器检索被查询的块及其对应的标签，并使用它们生成所有权证明。因此，客户端确信数据所有性，而无需实际检索文件块。\n\
  \nPDP 方案有两个阶段：设置阶段和挑战阶段。在设置阶段，客户端使用密钥材料 `KM` 为每个文件块 `b[i]` 计算一个同态可验证标签 `T[i, b_i]`。每个值\
  \ `T[i, b_i]` 都是块 `b[i]` 的索引 `i` 的函数。这会将块上的标签与特定块绑定，并防止使用该标签获取不同块的证明。标签 `T[i, b_i]`\
  \ 和文件 `F` 存储在服务器上，并从客户端的本地存储器中删除。客户端仅保留密钥材料 `KM`，这是一个很小的固定大小值。服务器上的额外存储是允许薄客户端的开销，这些客户端只存储少量常量的数据，无论文件大小如何。\n\
  \n在挑战阶段，如图 21.2 所示，`C` 请求 `F` 中一个子集块的所有权证明。此阶段可以执行无限次，以确定 `S` 是否仍然拥有所选块。更准确地说，客户端要求服务器提供\
  \ `c` 个文件块的所有权证明，这些块的索引是使用伪随机排列选择的，该排列为每个挑战使用一个新随机选择的密钥。这种随机抽检技术防止了服务器预测每次挑战中哪些块将被查询。`C`\
  \ 还会生成一个全新的（随机的）挑战 `CHAL`，以确保 `S` 不复用之前一个挑战阶段的任何值。服务器返回一个由两个值组成的所有权证明：`T` 和 `ρ`。`T`\
  \ 是通过将请求块对应的单个标签 `T[i, b_i]` 合并为一个单一值得到的。`ρ` 是通过将挑战 `CHAL` 提升为请求块的函数得到的。值 `T` 包含了关于客户端请求的块索引的信息。然后，客户端通过检查\
  \ `T` 和 `ρ` 之间是否存在特定关系，来验证服务器证明的有效性。直观地说，PDP 方案的安全性取决于客户端在每次挑战中都选择不同的块子集进行挑战并使用不同的\
  \ `CHAL` 值，以及 HVT 标签的不可伪造性。\n\n![图 21.2 PDP 的挑战阶段涉及随机抽检和无块验证。](img/fig21.2.jpg)\n\
  \n图 21.2 PDP 的挑战阶段涉及随机抽检和无块验证。\n\n在效率方面，每次挑战都需要 `C` 和 `S` 之间少量的常量级通信（挑战和响应的均略大于\
  \ 1 千比特）。在服务器块访问方面，`S` 需要 `c` 次访问；而在计算方面，`C` 和 `S` 都要进行 `c` 次幂运算。当 `S` 损坏了部分比例的文件块时，`c`\
  \ 是一个相对较小的常量值。由于文件大小为 `O(f)`（其中 `f` 是文件块的数量），容纳额外的标签不会（渐近地）改变服务器的存储需求。\n\n为了满足 RDIC\
  \ 的性能目标，PDP 方案对服务器存储进行采样，访问块的随机子集。通过这种方式，PDP 方案提供了数据所有性的概率保证：在不访问所有块的情况下，无法提供确定性保证。采样通过访问文件中的少量块来以高概率证明数据所有性，这从根本上改变了证明数据所有性的性能。有趣的是，当服务器损坏了文件的一部分比例时，客户端可以通过请求常量数量块的证明来高概率检测检测服务器异常，而与文件块的总数无关。例如，对于一个具有\
  \ `f = 10,000` 个块的文件，如果 `S` 损坏了 1% 的块，那么 `C` 只需请求 460 个随机选择块的所有权证明，即可以大于 99% 的概率检测到服务器异常。\n\
  \n### 21.2.3.3 实现稳健性\n\n为了增强所有性保证，作者定义了稳健审计（robust auditing）的概念，该概念将前向纠错（FEC）码与远程数据检查相结合。损坏少量数据的攻击不会造成损害，因为损坏的数据可以通过\
  \ FEC 恢复。造成不可恢复损害的攻击很容易被检测，因为它们必须损坏许多数据块来克服冗余。\n\n作者确定了指导稳健方案设计、实现和参数化的要求。重要问题包括\
  \ FEC 代码的选择、输出数据的组织或布局以及编码参数的选择。这些设计力量是微妙且复杂的。集成方案无论攻击策略如何、无论数据的访问模式如何，都必须保持数据完整性检查的安全性。集成还必须最大化数据的编码率和远程存储文件的\
  \ I/O 性能，并最小化冗余的存储开销和审计数据的 I/O 复杂度。\n\n识别既安全又高效的特定编码具有挑战性。事实上，所提出的几种 FEC 代码用法（Juels\
  \ and Kaliski 2007; Shacham and Waters 2008）并不是最优的，可能会导致糟糕的 I/O 和编码性能。作者提出了一种通用转换，以满足特定要求并使用\
  \ FEC 代码对文件进行编码，为任何基于抽检的 RDIC 方案增加稳健性。文件被视为一组块（chunks），每个块包含多个文件块。属于每个块的文件块基于伪随机排列来确定。对每个块应用\
  \ Reed-Solomon 码。编码每个块产生的校验块集会被置换和加密。这些步骤是为了防止攻击者确定 (1) 数据块与校验块之间的关系，以及 (2) 校验块之间的关系。例如，图\
  \ 21.3 显示了一个具有两个块且每个块有四个块的文件。该图展示了稳健性编码以及结果的文件布局。原始文件数据顺序输出且不加密，随后是置换和加密的校验数据。\n\
  \n\n\n\n\n![图 21.3 用于鲁棒性计算的 (6, 4) Reed-Solomon 码。每个分块用不同的颜色显示（块 1 包含块 b1, b3, b6\
  \ 和 b8，块 2 包含块 b2, b4, b5 和 b7）。](img/fig21.3.jpg)\n\n图 21.3 用于鲁棒性计算的 (6, 4) Reed-Solomon\
  \ 码。每个分块用不同的颜色显示（块 1 包含块 `b[1]`、`b[3]`、`b[6]` 和 `b[8]`，而块 2 包含块 `b[2]`、`b[4]`、`b[5]`\
  \ 和 `b[7]` ）。\n\nBowers 等人 (2009b) 描述了 Reed-Solomon 码与系统化文件布局的集成，该布局与鲁棒 PDP 方案中提出的文件布局相似。它是独立发现的，时间与\
  \ `PDP` 鲁棒性的最初提案相似（Curtmola 等人 2008b）。\n\n#### 备注\n\nAteniese 等人 (2007) 提出了对基本 `PDP`\
  \ 方案的扩展，以实现公共验证性，这允许任何人（而是是所有者）对服务器的数据所有权发起挑战。具有公共验证性的优势类似于公钥相对于对称密钥加密的优势。\n\n所提出的\
  \ `PDP` 方案对数据格式没有限制；特别是存储在服务器上的文件不必加密。这一特征非常重要，因为此类 `PDP` 方案在用于大型公共存储库（例如数字图书馆、天文学/医学/法律库和档案）时可能会产生最大的影响。\n\
  \n### ### 可检索性证明\n\n在引入 `PDP` 的同时，Juels 和 Kaliski (2007) 引入了与 `PDP` 类似的概念，即可检索性证明\
  \ (`PoR`)，它允许客户端确信它可以检索之前存储在服务器上的文件。所提的 `PoR` 方案如图[图 21.4]所示。在设置阶段，客户端首先加密文件的块，然后在普通文件块之间的随机位置插入伪装块（称为\
  \ `sentinels`）。以这种方式修改的文件随后存储在服务器上。由于 `sentinels` 与加密的文件块不可区分，因此它们对服务器是“隐藏”的。在挑战阶段，客户端向服务器请求\
  \ `sentinels` 并检查其有效性。如果 `sentinels` 损坏，则表明服务器损坏了数据。其直觉上是服务器在不同时损坏 `sentinels` 的情况下无法损坏文件的真实块。\n\
  \n![图 21.4 基于 sentinels 的可检索性证明方案。](img/fig21.4.jpg)\n\n图 21.4 基于 sentinels 的可检索性证明方案。\n\
  \n尽管在范围上与 `PDP` 相当，但此 `PoR` 方案只能应用于加密文件，并且只能处理有限数量的查询（查询必须预先固定），因为 `sentinels` 每次挑战都会被消耗且不能重用。然而，`PoR`\
  \ 模型的不同之处在于它寻求提供一种针对大范围和小损坏保护的统一处理方法：`PoR` 方案已被证明能够抵抗安全定义，该定义允许数据所有者检索存储在远程服务器上的数据。与\
  \ `PDP` 的鲁棒性一样，对小损坏的保护是通过集成前向纠错码实现的，这种集成最初由 Juels 和 Kaliski (2007) 引入。他们讨论了将文件分成分块。`PoR`\
  \ 方案被证明能够抵抗允许数据所有者检索存储在远程服务器上数据的安全定义。就像 `PDP` 的鲁棒性一样，对小损坏的保护通过集成前向纠错码获得，这种集成最初由\
  \ Juels 和 Kaliski (2007) 引入。\n\n\n\n\n\nDPDP 在挑战阶段通过采用与 PDP 在静态设置下使用的类似的抽样检查（spot\
  \ checking）机制，保持了高效性。客户端使用一种认证数据结构来确保所检索文件的新鲜性，并防止服务器在回答挑战时使用旧版本的文件。该数据结构是一个基于验证标签（verification\
  \ tags）计算的认证跳跃列表（authenticated skip list）。客户端存储跳跃表的根节点，并用它来验证服务器执行的更新操作，同时确保服务器在回答挑战时使用的是最新版本的文件。每当客户端执行数据更新时，客户端都会安全地更新认证跳跃表的根节点。\n\
  \n其他几种 DPDP 也遵循相同的原理：客户端使用认证数据结构来防止重放攻击。该数据结构通常是基于验证标签计算的树形结构，客户端保留该结构根节点的副本（例如：跳跃列表\
  \ [Erway et al. 2009]、RSA 树 [Erway et al. 2009]、Merkle 哈希树 [Wang et al. 2011]、2–3\
  \ 树 [Zheng and Xu 2011] 或平衡更新树 [Zhang and Blanton 2013]）。例如，在图 21.5 中，基于 Merkle\
  \ 哈希树的一种方案对文件块计算出一个二叉树。树的叶节点被计算为文件块的哈希值，内部节点被计算为其子节点拼接后的哈希值。例如，`h[3-4]` 的计算值为 `h(h(b[3])\
  \ || h(b[4]))`。客户端对树根进行签名，签名根可以存储在客户端的本地存储中，或与外包数据一起上传到服务器。服务器关于文件块的持有证明（proof of\
  \ possession）将包含从对应文件块的叶节点到树根路径上的兄弟节点。例如，块 `b[4]` 的证明将包含节点 `h(b[3])`、`h[1–2]` 和\
  \ `h[5–8]`。\n\n![图 21.5 一个基于文件块 b1, b2, …, b8 计算的 Merkle 哈希树示例。这里，h 是一个加密哈希函数。](img/fig21.5.jpg)\n\
  \n图 21.5 一个基于文件块 `b[1]`、`b[2]`、 …, `b[8]` 计算的 Merkle 哈希树示例。这里，`h` 是一个加密哈希函数。\n\n\
  在比较 DPDP 方案与为静态设置设计的 PDP 方案的效率时，依赖树形认证结构的 DPDP 方案在外包数据大小方面，增加了更新阶段的对数级开销。\n\n###\
  \ 21.3.2 动态可检索性证明\n\nDPDP 在挑战阶段采用抽样检查以提高效率，因此仅提供概率保证，这使得它容易受到小规模损坏攻击的影响。抽样检查无法检测攻击者是否损坏了极少量的数据（例如\
  \ 1 字节）。后续工作尝试通过增加鲁棒性（robustness）来缓解此类攻击，即一种能够实现免受少量数据损坏保护的属性。在静态设置中，鲁棒性是通过特殊应用纠错码生成冗余数据来实现的，从而可以修复未被检测到的微小损坏（Ateniese\
  \ et al. 2011; Bowers et al. 2009a, 2009b）。当数据可以进行动态更新时，将纠错码与 RDIC 结合比在静态设置要挑战得多。在对抗性设置下，高效的动态更新与实现鲁棒性所需的编码之间存在根本性的紧张关系，因为即使更新文件的一小部分也可能需要检索整个文件。目前已有少量\
  \ RDIC 解决方案实现了动态设置下的鲁棒性。\n\nChen 和 Curtmola (2012) 识别了在对抗性设置下为 DPDP 方案添加鲁棒性时需要克服的挑战。Reed-Solomon\
  \ (RS) 码在静态情况下提供了高效的纠错能力，但其线性本质使得即使仅需更新原始数据的一小部分（对于插入/删除操作），也会产生高昂的通信成本。此外，在实现低更新通信开销的同时，很难隐藏文件符号之间的关系（这是鲁棒性所需的）。他们给出了鲁棒\
  \ DPDP（R-DPDP）方案的定义，这是一种支持动态更新并同时提供鲁棒性的远程数据完整性检查方案。他们提出了两种实现该定义的 R-DPDP 构造。第一种通过将技术从静态扩展到动态设置来实现鲁棒性。生成的\
  \ R-DPDP 方案在编码上是的，但更新（特别是插入/删除）需要高通信成本。第二种构造通过以下方式克服了这一缺点：(a) 将鲁棒性编码与符号在文件中的位置解耦，而是依赖符号的值；(b)\
  \ 在更新 RS 编码校验数据时，将昂贵的插入/删除操作简化为追加/修改操作，确保了即使在对抗性设置下也能高效更新。第二种方案相对于第一种提供的改进是有益的，因为插入/删除操作占了几个热门软件项目源代码库所有更新大部分。\n\
  \n在提出 R-DPDP 的同时，Stefanov 等人 (2012) 提出了 Iris，这是一个支持动态检索性证明（D-PoR）的系统，包括对小数据损坏的保护。D-PoR\
  \ 旨在将 PoR 适配到动态设置，并像静态设置一样，提供一种针对动态设置下大小和小损坏的统一安全定义。在基础层面上，就像 PoR 方案一样，D-PoR 方案需要隐藏文件块与校验块之间的对应关系以实现鲁棒性。Iris\
  \ 引入了一个受信组件——门户（portal），它是客户端基础设施的一部分。当客户端执行更新时，校验信息缓存在门户中，并仅在定期被发送到云端进行备份。通过这种方式，云端只能感知多次更新后的聚合校验，无法推断出鲁棒性的编码结构。因此，出于工程考虑，Iris\
  \ 通过在客户端存储纠错码的校验数据来实现鲁棒性。这与 R-DPDP 的方法相反，后者为了最小化客户端存储，将包括校验数据在内的所有数据都存储在服务器上。\n\n\
  Cash 等人 (2013) 了一种符合外包存储定义的 D-PoR 方案：客户端需要渐常级存储，数据和校验数据都存储在服务器端。与 R-DPDP 需要客户端从服务器检索校验数据不同，他们通过使用不规则内存（ORAM）来隐藏客户端从服务器检索部分校验数据时的访问模式，从而实现了鲁棒性。\n\
  \n\n\n\n\nShi 等人 (2013) 提出了一种轻量级的 D-PoR 方案，其（分摊）带宽开销和客户端计算量与标准的 Merkle 哈希树相当，极大地降低了由\
  \ Cash 等人 (2013) 提出的 D-PoR 方案的渐近成本。除了数据的纠删编码副本外，客户端还在服务器上存储了一个纠删编码的日志结构，该结构包含了最近写入的块；新更新的块不会立即存储在数据组件的副本中，因此客户端不需要在每次写入操作后立即更新奇偶块。这种结构的访问和更新方式使人们联\
  \ ORAM 方案（Goldreich and Ostrovsky 1996）有相相似之处。另一项节省成本的创新是，服务器积极参与存储在服务器上的数据的定期重建，而客户端只需要检查服务器是否正确地执行了重建即可。后者的这种方法类似于\
  \ Chen 和 Curtmola 提出的服务器端修复方法，旨在减少分布式存储系统中修复受损数据时客户端的负载。\n\n总结对 D-PoR 方案的讨论，已经提出了若干\
  \ RDIC 解决方案以实现动态设置下的鲁棒性，但这些方案涉及大量的额外成本：其中一个系统要求在客户端存储大量的冗余数据（Stefanov 等人 2012）；其他系统则通过要求客户端访问整个冗余（Chen\
  \ and Curtmola 2012）或使用 ORAM 这种隐藏访问模式的低效机制（Cash 等人 2013）在服务器端存储并访问冗余数据。最近，Shi 等人\
  \ (2013) 声称了一种更实用的 D-PoR 方案。总体而言，具有真正实用价值的 D-PoR 方案仍然难以捉摸。\n\n### 21.3.3 可审计的版本控制系统\n\
  \n版本控制提供了跟踪和控制随时间对数据更改的能力。这包括恢复文档旧版本的能力。软件开发通常依赖版本控制系统（VCS）来自动管理源代码、文档和配置文件的管理。VCS\
  \ 将版本控制过程自动化。VCS 将对数据的所有更改记录在一个名为名为存储库（repository）的数据存储中，以便在未来的任何时候检索数据的任何版本。RDIC\
  \ 可用于解决对托管 VCS 仓库的第三方不可信赖性质的担忧。\n\n由 VCS 管理的文件的演变可以被视为一系列更新，每次更新都会产生一个新的文件版本。因此，VCS\
  \ 存储库的完整性可以使用旨在允许数据动态更新的 RDIC 协议进行验证。动态 RDIC 方案可以直接检查最新文件版本的完整性（每个新文件版本都可以被视为对上一个文件版本的一系列更新）。动态\
  \ RDIC 也可以通过将文件版本组织在认证结构中，调整以检查整个 VCS 存储库的完整性——基本上是检查文件的所有版本。已经提出了若干检查 VCS 完整性的方案，它们通过扩展依赖树形结构的动态\
  \ RDIC 方案，从而在挑战（challenge）和提交（commit）阶段增加了对数成本（Erway 等人 2009；Etemad and Küpçü 2020）。\n\
  \n一个动态 RDIC 方案可以直接检查最新文件版本的完整性（每个新文件版本都可以被视为对上一个文件版本的一系列更新）。动态 RDIC 方案也可以通过将文件版本组织在认证结构中，调整以检查整个\
  \ VCS 存储库的完整性——基本上是检查文件的所有版本。已经提出了若干检查 VCS 完整性的方案，它们通过扩展依赖树形结构的动态 RDIC 方案，从而在挑战和提交阶段增加了对数成本（Erway\
  \ 等人 2009；Etemad and Küpçü 2020）。\n\n一个动态 RDIC 方案可以直接检查最新文件版本的完整性（每个新文件版本都可以被视为对上一个文件版本的一系列更新）。动态\
