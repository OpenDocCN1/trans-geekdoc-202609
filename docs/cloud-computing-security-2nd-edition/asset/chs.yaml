  \ 位于 DIN DIN-Platz, DIN 4102 建筑材料和部件的防火行为，第 2 部分和第 3 部分。德国柏林。2015。\n\n# 第 30 章 跨数据中心的可用性、恢复与审计\n\
  \nReza Curtmola\n新泽西理工学院 (NJIT)，新泽西州新华市\n\nBo Chen\n宾夕法尼亚州立大学，宾夕法尼亚州大学克克园区\n\n##\
  \ 目录\n- 30.1 引言\n- 30.2 基于复制的分布式系统的 RDIC\n    - 30.2.1 对抗模型\n    - 30.2.2 一种基于加密的解决方案\
