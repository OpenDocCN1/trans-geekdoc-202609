  - 22.5.2 法律问题\n- 22.6 总结\n- 参考文献\n\n## 22.1 引言\n\n云计算已被广泛采用，用户在日常生活中享受各种云服务，如 Gmail、Google\
  \ Calendar、Dropbox、Microsoft Office Live 等。由于云计算的快速普及，云的市场价值未来将继续增长 [1, 2–3]。除了私营部门外，云计算在政府部门也变得流行。云支出已占美国联邦政府\
  \ IT 支出的 5% [4]。预计联邦云计算市场在 2015 年至 2020 年间以 16.2% 的复合年增长率增长，并在 2020 年突破 100 亿美元\
  \ [5]。\n\n云的主要用场景之一是计算外包，计算能力较弱的客户可以将计算任务外包给更强大、可扩展且廉价的云端。客户将计算任务和数据发送到云，云进行计算并将结果返回给客户。通过这种计算模式，客户不再受到资源受限设备（如智能手机、平板电脑和物联网设备）处理速度慢、内存等限制的约束。云提供的高度扩展性和非常方便的按需付费服务，激励着客户转向基于云的计算外包模型以满足其计算需求。\n\
  \n\n\n\n然而，云的某些基本属性（如多租户使用模型和虚拟化）在确保资源得到良好利用的同时，也使得确保云端安全计算变得困难。由于云的黑箱性质，客户无法直接控制那些消耗数据、执行计算功能并产生结果的系统。计算的正确性和效率可能会受到软件漏洞、硬件故障或外部攻击的影响。由于缺乏透明度，云提供商还可能故意提供糟糕的性能以获取财务利益。遗憾的是，客户没有办法验证外包计算任务的效率或正确性。\n\
  \n除了计算的正确性，在外包计算时确保数据隐私也至关重要。外包计算的数据通常包含机密信息，例如敏感的财务记录、专利研究数据、医疗数据或敏感的政府信息。有各种规则和法规保护医疗和业务相关数据的隐私，例如《萨班斯-奥克斯莱法案》（SOX）[6]，和《健康保险流通性与责任法案》（HIPAA）\\\
  [7\\]。处理此类敏感信息的外包计算任务必须确保遵守相应的法规。在外包到云端之前对敏感信息应用普通的加密技术可能是确保隐私的一种方法。然而，对加密数据进行计算是一项挑战性问题，我们无法在确保隐私的同时实现高效计算的目标。\n\
  \n在将计算任务外包给云时，应当确保各种安全属性，如正确性、可验证性、效率和隐私。如果为提供安全计算外包的机制，处理敏感数据和计算的客户将缺乏动力转向云端进行计算外包。本章将帮助读者理解向云提供安全计算外包面临的挑战，并熟悉该领域现有的先进解决方案以及开放的研究问题。\n\
  \n### 22.1.1 组织结构\n\n本章的其余部分组织如下：在 22.2 节中，我们介绍了关于基于云的安全计算外包的背景信息，以及可以高效外包给云的各种计算。在\
  \ 22.3 节中，我们介绍了使得云端安全计算外包具有挑战性的主要问题。22.4 节讨论了计算外包的先进解决方案。在 22.5 节中，我们讨论了基于云的安全计算外包领域的一些开放问题。最后，我们在\
  \ 22.6 节中总结了本章。\n\n## 22.2 背景\n\n在本节中，我们首先介绍基于云的计算外包的简要背景以及一些可以高效外包给云的计算。我们还讨论了向云安全计算外包的威胁模型所需的属性。\n\
  \n### 22.2.1 基于云的计算外包\n\n计算外包的想法始于云计算兴之前，特别是为了满足智能嵌入式设备的计算需求。计算外包模型可以定义如下：\n\n客户希望在特定的时间段\
  \ `P` 内完成任务 `T`，但客户可用的计算资源无法满足性能目标。存在一台工作机器 `W` 可以在 `P` 时间内解决任务 `T`。因此，客户可以将任务 `T`\
  \ 外包给工作机器 `W` 以满足性能要求。然而，同时客户不想向工作机器 `W` 泄露真实的 `T`。客户可以验证 `W` 返回的结果，但验证的计算开销与解决实际任务相比应该要小。基于云的计算外包概述如图图\
  \ 22.1\n\n图 22.1 基于云的计算外包。\n\n高度可扩展的云计算模型非常适合这种计算外包模型，客户可以利用云利用几乎无限的计算资源来完成任务。云的弹性允许客户根据任务负载扩展或缩小计算资源。因此，客户现在不再受到其本地资源的限制，而是可以通过将计算工作负载外包给云端来执行任何大规模计算。此外，云的按需付费策略也使得云比投资建设和管理同等能力的本地基础设施要便宜得多。客户可以在需要时购买所需的资源。由于智能手机或物联网设备等移动设备受到处理能力和存储容量的限制，因此不适合大规模计算，云提供的设施引发了向云端外包计算的新趋势。无处不在的移动设备正推动着云端计算外包的广泛采用。\n\
  \n另一个驱动基于云的计算外包的因素是大数据。各种计算的数据量增长已经超过了本地计算机的计算能力。例如，一台拥有 64 GB 内存的 IBM `P570` 需要\
  \ 7 天 17 小时才能解决一个线性规划 (`LP`) 问题 \\[[8\\]，这在某些场景下可能是不可行的。因此，客户正转向云端解决大规模问题。\n\n###\
  \ 22.2.2 可以外包给云的计算\n\n利用云的可扩展、强大计算能力，我们可以在将各种计算任务外包给云时获得更好的性能。在计算外包先进工作中主要讨论的计算任务可以分为代数运算、字符串操作、MapReduce\
  \ 和模幂运算。\n\n#### 22.2.2.1 代数运算\n\n各种具有多项式时间复杂的代数运算可以外包给云，例如线性方程组 (`LEs`)、`LP` 和矩阵乘法。这些运算对于各种工程任务至关重要，且计算的数据量可能大到本地系统无法处理。下面我们给出一些代数运算的概述：\n\
  \n矩阵求逆是寻找矩阵 `A⁻¹` 的过程，使得对于逆矩阵 `A` 满足以下方程：\n\n```\nA A⁻¹ = In\n```\n(22.1) 其中 `I\
  \ [n]` 是 `n×n` 单位矩阵。\n\n有很多求逆方案，例如高斯消元法、牛顿法和特征值分解。然而，所有的方案都具有二次时间复杂度；因此，大维矩阵的求逆可以外包以获得更好的性能。\n\
  \n线性方程组 (`LE`) 是一组涉及相同变量的线性方程。线性方程组可以用矩阵方程表示如下：\n\n```\nAx = b\n```\n(22.2) 其中 `A`\
  \ 是 `m×n` 系数矩阵，`x` 是包含 `n` 个变量的列向量，`b` 是包含 `m` 个常数的列向量。\n\n线性方程是线性代数的基础部分，广泛用于解决工程、物理、化学、计算机科学和经济学中的各种数学问题。\n\
  \n\n\n\n\n线性规划是一种在满足线性等式约束和线性不等式约束的情况下，寻找线性目标函数最优值的方法。LP 适用于寻找现实世界问题的最优解，例如最大网络流问题\
  \ [9]。在标准形式下，LP 任务定义为\n\n| m i n i m i z e   c T   x   s u b j e c t   t o   A x\
  \ ≥ b ，   x ≥ 0 , || (22.3) |\n| --- | --- |\n\n其中 `x` 是不变量向量，`c` 和 `b` 是（已知）系数向量，而\
  \ `A` 是一个 `m × n`（已知）系数矩阵。需要极大或最小化的表达式称为目标函数 `(c ^T x)`。应用线性方程组（LEs）可以解决 LP 问题。\n\
  \n### 22.2.2.2 字符串比较\n\n字符串比较广泛用于 DNA 比对，这需要巨大的计算能力才能在合理时间内完成任务。因此，将此类任务外包给低成本、高扩展性的云端可以节省建立等能力本地基础设施的成本。DNA\
  \ 分析中经常使用的字符串比较示例是计算两个字符串之间的编辑距离。编辑距离用于量化两个字符串的相似性，即将一个字符串转换为另一个字符串所需的插入、删除和替换的最少次数。\n\
  \n### 22.2.2.3 MapReduce\n\n为了处理大数据，`MapReduce` 框架被工业界和学术界广泛接受。在这个框架中，任务可以被分为 map\
  \ 阶段和 reduce 阶段。输入文件首先分布到 mapper 节点，这些节点在数据块上并行执行任务。mapper 节点产生的结果随后被 reducer 节点消费，由它们计算最终结果。图\
  \ 22.2 展示了基于云的 `MapReduce` 框架。云的弹性特性适用于 `MapReduce` 框架，因为我们可以通过添加新的 mapper 或 reducer\
  \ 节点来轻松扩展基础设施。\n\n![图 22.2 基于云的 MapReduce 框架。](img/fig22.2.jpg)\n\n图 22.2 基于云的 MapReduce\
  \ 框架。\n\n### 22.2.2.4 模幂\n\n基于离散对数的加密协议是基于模幂设计的。遗憾的是，确定大素数的模是非常昂贵的，且无法由资源受限的设备（如\
  \ RFID 标签或智能卡）处理。如果没有计算外包，客户端需要 `O(n)` 次模乘法来对 `n` 位指数执行模幂运算。然而，如果客户端能将任务外包给两个不可信的工人，那么对于任何基于幂的方案，其时间复杂度将降低到\
  \ `O(log[2] n)`。\n\n由于模幂是几乎每个公钥算法的基础，因此在功率受限的设备上执行公钥加密是不可能的。这意味着向云外包计算正变得流行。\n\n\
  ### 22.2.3 云端安全计算\n\n由于云的多租户性，向云外包计算引入了新的威胁。我们讨论对抗模型和所需的属性。\n\n#### 22.2.3.1 对抗模型\n\
  \n图 22.3 说明了计算外包的威胁模型。在这个模型中，云提供者被认为是不诚实的或“诚实好奇”的。由于云的黑盒性质，操作细节对客户端是不透明的。云提供者可以故意提供错误结果以获取经济利益。云提供者还可以从客户端处获取敏感信息。\n\
  \n![图 22.3 云计算的对抗模型。](img/fig22.3.jpg)\n\n图 22.3 云计算的对抗模型。\n\n#### 22.2.3.2 安全外包的属性\n\
  \n在向云外包计算任务时，安全计算协议应确保四种属性，如图 22.4 所示。以下是这些属性的详细介绍：\n\n![图 22.4 安全计算的属性。](img/fig22.4.jpg)\n\
  \n图 22.4 安全计算的属性。\n\n- **正确性 (Correctness)**：任何诚实遵守外包协议的云服务器必须产生可以被客户端成功验证的输出；也就是说，如果云提供者变得不诚实，客户端应该检测到故障。\n\
  - **可靠性 (Soundness)**：云提供者产生的错误结果无法被客户端成功验证。任何计算不实的结果必须被客户端侧的验证程序拒绝。\n- **隐私性 (Privacy)**：云工人执行任何计算时无法从客户端的隐私数据中获取任何敏感信息。因此，安全外包算法应向云提供者隐藏有关实际计算的信息。\n\
  - **效率 (Efficiency)**：客户端运行的结果验证过程在计算复杂度上应低于解决实际问题的复杂度。\n\n## 22.3 挑战\n\n云计算在廉价访问海量计算能力方面潜力巨大。尽管云的优势是不言而疑的，但存在各种问题使得确保云计算计算的安全性具有挑战。\n\
  \n#### 22.3.1 缺乏透明度\n\n由于云提供者可能存在恶意，在云中保护外包计算的安全性是挑战性的。目前的云计算模型旨在隐藏内部操作，以保护云基础设施和客户端隐私。云的这种黑盒性质不允许用户查看外包计算；客户端只能看到云提供者允许的内容。此外，由于云服务提供者提供的接口有限，用户通常无法对其虚拟机\
  \ (`VMs`) 或在云上运行的应用进行控制。控制权的缺失和云的黑盒性质为云提供者提供了恶意的机会。例如，为了在单台机器上部署更多客户端，云提供者可以降低其低于向客户端承诺的性能。\n\
  \n\n\n\n\n由于数据需要传输到云端进行计算，云提供者也可能违反客户的隐私。敏感的业务或健康相关数据可能被恶意的云提供者泄露。例如，某公司可能选择将一些大量的业务分析操作外包给云端，这些操作包含了关于客户的机密信息。由于操作流程缺乏透明度，云提供者可以在未经公司同意的情况下存储客户信息，并将其出售给其他业务机构，这将违反客户的隐私。\n\
  \n### 22.3.2 多租户\n\n在云中，多个用户共享同一个云基础设施的相同物理硬件和资源。多租户云模型引入了新的攻击面，可能会影响外包计算的正确性、效率和隐私。云供应商使用的虚拟机管理程序（hypervisor）或虚拟机技术中的潜在漏洞，是确保多租户云架构中外包计算安全的关键问题。通常，云计算架构支持计算和存储资源的逻辑分离而非物理分离\
  \ [10]，这带来了侧信道攻击的可能性。已经证明，针对 `Amazon EC2` 的某些侧信道攻击是可能的 [11]。要发起攻击，攻击者首先必须通过逆向 `Amazon\
  \ EC2` 的内部 IP 地址分配映射来识别目标 `VM` 的位置。然后，利用该映射和基于网络的共存检查方案，可以实现与目标 `VM` 的共存。在实现共存后，攻击者可以发起多次攻击。例如，攻击者可以消耗共享内存，这将导致计算期间性能下降。甚至攻击者实际上可以使用侧信道攻击窃取加密密钥\
  \ [12]，这将导致安全计算隐私属性的被违反。\n\n### 22.3.3 云架构中的漏洞\n\n云计算架构可能成为攻击的目标，从而影响计算的正确性、效率和隐私。例如，由于云架构的漏洞，可以在云上执行\
  \ `SQL injection`（SQL 注入）和 `cross-site scripting`（跨站脚本）攻击。云提供者/用户可能是网络钓鱼攻击的受害者，并丢失访问凭据。如果客户端与云端之间的通信通道不安全，客户端可能会受到云端的攻击，反之亦然。\n\
  \n如果云容易受到分布式拒绝服务（`DDoS`）攻击，攻击者可以利用这一漏洞简单地阻碍在云端运行的计算性能。由于攻击，云在一段时间内对客户端不可用，这将阻碍外包计算的性能。\n\
  \n### 22.3.4 法规与合规问题\n\n云基础设施不符合许多法律法规，例如 `HIPAA` [13]、`SOX Act`（萨班斯-奥克斯利法案）[6]\
  \ 以及 `Gramm–Leach–Bliley Act`（格拉姆-莱里奇-布莱利法案）[14]。向云提供者披露客户或员工的个人信息，或患者的电子医疗记录（`EMR`）通常受到不同监管政策的限制。《1974\
  \ 年隐私法》（Privacy Act of 1974）对个人信息的收集、维护、使用和披露制定了标准 [15]。由于联邦机构与云服务商之间没有合同协议，在云上外包个人信息可能会违反《1974\
  \ 年隐私法》。格拉姆-莱里奇-布莱利法案》强制金融机构不能向其消费者披露财务数据。根据 `HIPAA`，`EMR` 是隐私且机密的。`HIPAA` 规定了涵盖实体对可识别健康信息的披露政策。对于涵盖实体而言，将\
  \ DNA 分析任务外包给云可能会违反 `HIPAA`，因为它需要将机密信息发送给云提供者。\n\n云提供者的数据中心的位置对适用于计算包隐私的法律有重大影响。云提供者的数据中心遍布全球。可能会出现客户位于一个司法辖区，而外包任务的云数据中心位于另一个司法辖区的情况。两个地区之间的法律差异会影响云提供者的隐私计算程序。欧盟运营云服务的隐私水平协议（PLA）指南规定了所有可能处理、存储、镜像、备份和恢复的数据中心的位置\
  \ [16]。\n\n因此，对业务或健康数据进行计算时，我们需要确保计算程序不违反法规。客户可能无法验证云提供者的数据实践，因此无法确定数据是以合法方式处理的\
  \ [17]。\n\n## 22.4 安全计算外包解决方案\n\n由于云的扩展性和低成本，计算外包具有巨大的优势。然而，确保敏感操作计算的隐私性和完整性至关重要。在本节中，我们将讨论针对不同类型计算的各种安全计算外包解决方案。\n\
  \n### 22.4.1 任意函数的安全计算\n\n计算外包的想法在云计算时代开始之前，研究人员就提出了多种向不可信服务器进行安全计算外包的解决方案。由于在威胁模型中云也被认为是不诚实的，任何针对不可信服务器计算外包的解决方案都可以云计算模型。安全计算外包的两个主要构建模块是\
  \ `garbled circuits`（加密电路）[18] 和 `fully homomorphic encryption`（全同态加密）[19]。下面，我们将讨论这两种方案。\n\
  \n#### 22.4.1.1 加密电路\n\n\n\n\n\n由姚（Yao）提出的混淆电路（GC）通过加密计算函数 `F(x)` 来确保计算安全。客户端使用对称加密对函数进行加密，不可信的工作节点服务器使用与输入数据对应的密钥对函数进行解密；这些被称为混淆值（garbled\
  \ values）。客户端在设置阶段生成混淆值，不可信的工作节点对这些混淆值进行计算。客户端可以验证计算的正确性。然而，该方案的问题在于 GC 只能评估一次，而为了第二个输入重用该电路是不安全的。其原因是，一旦第一个输入\
  \ `x ^i` 的输出标签被泄露，工作节点就可以将这些层级作为第二个输入 `x ^(ii)` 的正确标签。另一方面，创建一个新的 GC 所需的工作量与客户端求解实际函数的工作量几乎相当。因此，研究人员提出了多种\
  \ GC 的变体来克服这些瓶颈。\n\n#### 22.4.1.2 全同态加密\n\n同态加密允许工作节点在加密数据上进行计算 [20]？然而，普通的同态加密属性只能应用于非常有限的操作，例如\
  \ RSA 的乘法 [21] 和 Paillier 的加法 [22]，并可用于不可信的工作节点创建加密和签名。全同态加密方案 [19] 可用于对加密数据进行安全的任意计算，并允许人们在没有解密密钥的情况下对加密数据计算任意函数。如果一个加密方案满足以下条件，则可以认为它是全同态的：\n\
  \n|   E (  m 1  θ  m 2  ) \\= E  (   m 1   )  θ E  (   m 2   )  ;     f o r   a\
  \ l l    m 1  ,    m 2    E   M   || (22.4) |\n| --- | --- |\n\n其中 θ 代表任意操作。根据该方程，云提供者仅接收数据的密文，并在不知道操作了什么数据的情况下对密文进行计算，并将结果的编码值返回给用户。只有用户可以解密加密结果。\n\
  \n从理论上，通过将全同态加密结合 GC，可以确保输入/输出隐私以及正确性/可靠性属性 [23]?。在这种模型中，客户端计算与计算函数 `F` 相关的公共值和私有值，该函数仅计算一次。在此阶段，客户端根据姚构造的构造方法混淆电路\
  \ `C`。客户端在混淆过程中公开与 `x` 的输入位相关的随机标签。为了解决与 GC 相关的问题，客户端使用全同态方案的公钥对标签加密，并将公值发送给工作节点。为了防止将某一次执行的信息重用到另一次执行，每个输入都会生成一个新的公钥。然后，工作节点利用同态属性从\
  \ `F` 和 `x` 的公值计算出值 `π[x]`，并将 `π[x]` 发送给客户端。客户端随后从 `π[x]` 构建 `F(x)` 并验证正确性。然而，全同态加密方案效率低下，无法在现实应用场景中使用\
  \ [24, 25]。此外，如果数据在多个客户端之间共享，仅靠加密无法确保安全性。\n\n#### 22.4.1.3 安全计算输出架构\n\n通过利用云端中的可信平台模块\
  \ `TPM`，可以构建一个用于安全计算输出的可信计算平台（TCCP） [25]?。TCCP 的概述如图 22.5 所示。TCCP 由两个模块组成：可信监视器\
  \ `TVMM` 和可信协调员 `TC`。基于 TCCP 的方案，云提供者可以确保机密性和可验证的计算。在这种模型中，不可信的公云对加密形式存储的数据进行操作。Smith\
  \ 等人提出了一种硬件令牌——安全协处理器，它可以连接到云提供者以执行安全计算 [26]?。\n\n![图 22.5 可信计算平台](img/fig22.5.jpg)\n\
  \n图 22.5 可信计算平台\n\n研究人员 [27] 提出了一种结合安全函数评估（SFE）与硬件令牌的安全计算输出协议。该工作的主要目的是减少计算延迟，即从提交新查询到接收结果的时间。该协议确保了隐私性和验证。对于基于令牌的解决方案，遗憾的是用户需要信任硬件令牌。\n\
  \nBugiel 等人提出了名为 TwinCloud 的架构，用于向不诚的云外包任意计算 [28]?。该架构可以归类为混合云，在客户端和不可信的公云之间引入了一个可信云实体。可信云将在设置阶段使用姚混淆电路对外包的数据和程序进行加密，这只需要对称加密操作和恒定的内存。引入可信云实体的原因是，可信云主要用于设置阶段的敏感操作，而关键操作将由快速且扩展的公云处理。客户端通过安全套接层/传输层安全（SSL/TLS）使用定义良好的表示状态转移（REST）应用程序接口（API）与可信云通信，允许客户端管理外包的数据、程序和查询。不可信的公云对加密数据进行操作，可信云验证结果。图\
  \ 22.6 展示了 TwinCloud 的架构。\n\n![图 22.6 TwinCloud 架构](img/fig22.6.jpg)\n\n图 22.6 TwinCloud\
  \ 架构\n\n上述解决方案提供了安全计算输出的通用方案，但也有特定的计算解决方案，它们对于特定计算提供了比通用方案更好的性能。在下面我们将讨论针对各种代数运算、加密计算、MapReduce\
  \ 操作和字符串计算提出的某些解决方案。\n\n### 22.4.2 代数运算\n\n\n\n\n\n在代数计算领域，研究人员提出了安全计算外包方案，用于求解\
  \ `LEs` 组、`LP`、矩阵乘法和逆以及整数运算。求解 `LEs` 组是一种频繁使用的代数计算，它也被用于 `LP`。另一方面，`LEs` 组可以表示为矩阵运算（等式\
  \ 22.1 和 22.2）。因此，所有问题都可以被视为各种矩阵运算的安全计算。此类计算的通用思想是对输入参数进行转换，使得不诚实的云提供者无法泄露真实值，但能够计算并提供正确且可验证的结果。代数运算安全外包的通用框架在图\
  \ 22.7 中给出。下面列出了部分变换方案。\n\n![Figure 22.7 A generic framework for secure outsourcing\
  \ of algebraic operations.](img/fig22.7.jpg)\n\n图 22.7 代数运算安全外包的通用框架。\n\n*   **左乘**：在这一方案中，矩阵\
  \ `A` 和常数向量 `b` 左侧乘以一个随机可逆矩阵 `P`。这种变换适用于维护操作的正确性。原因是由于 `P` 是可逆的，系统的所有解（甚至是最优解）保持不变。\n\
  *   **右乘**：在这一方案中，矩阵 `A` 和常数向量 `b` 右侧乘以一个随机可逆矩阵 `Q`。然而，这在 `LP` 中是不可行的，因为如果存在 `LP`\
  \ 中的某些外部约束，这将改变最优解。\n*   **缩放与置换**：在这一方案中，矩阵 `A` 和向量 `b` 乘以一个正名义矩阵，导致变量的缩放和置换。正名义矩阵是正对角矩阵与置换矩阵的积。\n\
  *   **平移**：对于 `LP` 计算，初始变量向量 `x` 不仅被缩放，还可以被平移。可以使用特殊的松弛变量对每个变量进行平移。\n\n虽然通用框架适用于大多数代数运算，但研究人员针对特定的代数问题提出了各种解决方案，以获得更好的效率和安全性。下面我们讨论某些特定代数运算的各种解决方案。\n\
  \n### 22.4.2.1 线性规划\n\nWang 等人提出了一种利用矩阵乘法和仿射映射 `[29]` 的隐私保护 `LP` 问题变换技术。这种变换允许将原始\
  \ `LP` 问题转换为另一个问题，同时保护输入和输出的机密信息。为了应用此变换，首先将客户端拥有的用于 `LP` 问题的私有数据表示为矩阵和向量。由于客户端负责问题变换，原始问题与变换后问题的解之间的关系只有客户端知道。云端求解变换后的问题并将结果返回给客户端。最后，客户端使用\
  \ `LP` 对偶理论来验证返回的解是否正确。\n\n目前已提出了一种针对大规模 `LP` 问题的安全计算方案 `[30]`。根据所提方案，密钥 `S` `[K]`\
  \ 在问题变换阶段用于编码输入 `x` 并产生一个公开值 `σ[x]`。然后将该公开值发送给工作节点进行计算，而秘密值 `T [x]` 则由客户端保留。工作节点使用客户端的公钥和编码输入\
  \ `σ[x]` 计算实际结果的编码版本 `σ[y]`。客户端使用密钥 `S` `[K]` 和秘密 `T [x]` 将编码的输出 `σ[y]` 转换为实际输出。在该方案中，客户端的本地计算复杂度为\
  \ `O(n²)`，优于之前的方案 `[29]`。\n\nChen、Xiang 和 Yang 提出的安全 `LP` 求解器不需要任何同态加密或客户端与云之间的交互即可变换问题\
  \ `[31]`。该协议使用线性变换技术向不诚实的云提供者隐藏问题。如果只向云端发送一次 `ø = (A, b)`，该变换技术可能会少量微忽略的信息。如果需要向云端发送多次问题，则协议要求对矩阵\
  \ `A` 进行额外的变换，例如置换 `A` 的行。\n\n### 22.4.2.2 线性方程\n\n在 Wang 等人提出的安全 `LE` 求解方案 `[32]`\
  \ 中，客户端和不可信的云通过遵循特定协议进行交互，只有客户端知道找到了解。经过几轮交互，客户端最终将获得满意的解。验证协议耗时 `O(n²)`，小于求解实际问题的复杂度。然而，该协议存在漏洞——由于对\
  \ Paillier 公钥加密的使用不当，可以通过恢复输入数据来破坏隐私。\n\n### 22.4.2.3 矩阵运算\n\nLei 等人提出了一种安全矩阵求逆技术\
  \ `[33]`。根据所提方案，客户端可以乘以特殊矩阵，通过应用置换函数在 `O(n²)` 时间内计算矩阵积。使用蒙特卡洛验证算法，可以在 `O(n²)` 时间内验证返回结果的正确性。基于置换和蒙特卡洛技术，通过将矩阵求逆外包给云端，客户端可以将原始\
  \ `O(n³)` 工作减少到 `O(n²)`。其他研究人员 `[34]]` 提出了一种提供服务的安全计算外包协议。如图 22.8 所示，在该协议中，可信的代理人负责将计算任务分发到多个云工作节点。在该协议中，可信的代理人负责将计算任务分发到多个云工作节点。安全外包协议可以通过工作流模板手动设计和定义。客户端可以根据性能和安全性需求自由选择协议，或由代理人自动选择。客户端可以使用任何编程语言并通过\
  \ REST API 与代理人通信。\n\n\n\n在一种建议的矩阵乘法方案 [35] 中，客户端首先将矩阵 `A` 和 `B` 转换为 `A″` 和 `B″`\
  \ 并发送给云工作节点。要变换矩阵，首先生成一个随机单位矩阵三个随机对角矩阵 `P`、`Q` 和 `D`。然后 `A″= (P × (A × U)) × D`，且\
  \ `B″= D^(−1)  ×((U ^T × B)  ×Q)`。工作节点根据 `A″` 和 `B″` 生成结果 `C ^i`，其中 `C′= A″ × B″`。工作节点将\
  \ `C ^i` 发给客户端，客户端从 `C ^i` 中检索实际结果 `C` 并执行验证程序。该方案确保工作节点无法获取私有数据 `A`，也无法从 `A″` 推导出\
  \ `A`。工作节点无法从 `C ^i` 识别 `C`。对于输入数据从私有到公开的变换，客户端需要 `O(n ^t)` 的计算开销，其中 `2 ≤ t<3`。云工作节点执行所需的矩阵乘法计算约为\
  \ `O(n³)`。\n\nAtallah 和 Frikken 提出了一种无需昂贵加密操作的安全矩阵乘法协议 [36]。该方案基于他们提出的假设在证明上是安全的——弱秘密隐藏假设\
  \ (WSHA)。根据该协议，每个服务器仅执行 `O(t)` 次矩阵乘法，其中 `t` 是 Shamir 秘密共享的安全参数。给定 `t +1` 个份额可以恢复秘密\
  \ `x`，但如果只有 `t` 个或更少的份额则无法恢复秘密。在此协议中，客户端将为两个输入矩阵 `A` 和 `B` 创建随机隐藏多项式，并向每个云工作节点发送每个矩阵的份额。云工作节点计算各自份额的矩阵乘法，并将结果传回客户端。客户端随后对结果进行插值以确定实际结果。\n\
  \n### 22.4.3 MapReduce 计算\n\n关于 MapReduce 大数据处理结果验证的现状主要关注 MapReduce 计算环境中内部节点的计算完整性。Ding\
  \ 等人提出了一种外包 MapReduce 任务的结果验证方案 [37]。图 22.9 展示了一种名为基于信任采样的第三方结果验证 (TS-TRV) 的第三方采样验证方法，旨在防止云工作节点的欺骗并确保采样数据的真实性。与开销为\
  \ `O(N)` 的朴素采样验证相比，TS-TRV 的网络传输开销仅为 `O(logN)`。通过对 MapReduce 中间结果进行采样，所提方案可以防止云工作节点的欺骗并确保采样数据的真实性。\n\
  \n\n\nAtallah 等人 \\[43\\]在安全两方计算框架下开发了一种高效的序列比较协议，在该框架下每个方都有一个私有字符串；该协议允许双方计算两个序列的编辑距离，且任何一方都不会获对方私有序列的任何信息。他们使用动态规划来比较序列，其中每个方维护一个由加法拆分生成的矩阵。两个矩阵之和为真实矩阵，该矩阵被隐式地用于计算编辑距离。在他们的后续工作\
  \ \\[44\\]中，提出了一种改进方案，使客户端不再需要进行二次方计算来访问代价表。改进后的协议使用两个互不合谋的代理，输入字符串和中间结果（矩阵 `M`）在两个代理之间进行加法拆分，使得任何一个代理都不会获关于真实输入和结果的信息。然而，两个代理可以在不知晓内容的情况下隐式地使用\
  \ `M` 矩阵并获得加法拆分的答案。\n\n### 22.4.5 加密操作\n\nHohenberger 等人提出了一种将模幂运算安全地外包给不可信工作机器的算法\
  \ \\[45\\]。该方案允许客户端安全地外包计算质数模变指数和变基数指数幂运算所需的大部分工作。首先，在预处理阶段，该算法尝试优化用于签名生成（例如 El\
  \ Gamal, Schnorr, DSA）和加密（例如 El Gamal, Cramer-Shoup）的随机对 `(k, gk mod p)` 的产生。给定任何能为\
  \ `T` 提供随机对 `(x, g ^x mod p)` 的预言，该方案都能高效地计算任何模 `p` 幂运算。他们还提供了一种使用两个不可信幂黑盒来计算和检查模幂结果的技术，一旦确定了初始策略，这两个黑盒之间无法相互通信。在这种策略中，最多有一个黑盒可以在不可忽略比例的输入上偏离其宣传的功能。所提方案未泄露除输入大小以外的任何信息，对于\
  \ `n` 位指数，运行时间减少到了 `O(log[2] n)` 次乘法。\n\nChen 等人提出了一种使用两个不可信工作服务器对大质数模（变指数和变基数）计算幂运算的安全外包算法\
  \ \\[46\\]。基于该算法，他们展示了如何实现外包且安全的 Cramer-Shoup 加密和 Schnorr 签名。随后，他们提出了一种安全外包基于属性的签名（ABS）的方案以便在不违反消息隐私的情况下对属性上的消息进行签名\
  \ \\[47\\]。Li 等人提出了另一种基于属性签名的安全计算方案 \\[48\\]。使用 `MapReduce` 的该系统尚未证明自己是安全的。\n\n\
  ## 22.5 待解决的问题\n\n研究人员已经为安全外包提出了许多解决方案。然而，仍有问题尚未解决。下面我们讨论其中一些。\n\n### 22.5.1 合规性问题\n\
  \n目前的技术水平无法保证安全性。例如，在将任务外包到云端时，系统如何符合 `SOX`？同样，在将计算外包到云端时，我们如何符合 `HIPAA`？尚未证明云端可以符合医疗法规。现有解决方案没有考虑监管政策。因此，安全计算方面存在研究机会。\n\
  \n### 22.5.2 法律问题\n\n由于云可以在范围内访问，客户端位于不同的司法管辖区是非常可能的。在多客户端模型中，如果位于美国的客户端向云端发送计算函数，而云端接收来自位于欧洲的客户端的数据，系统是否应该遵守欧盟的隐私法规？云提供商与消费者之间的现有服务水平协议（`SLAs`）并未澄清这个问题。\n\
  \n## 22.6 总结\n\n计算外包通常用于实体需要执行任务但没有足够的计算资源在合理时间内完成任务的情况。由于高度可扩展的设施和按需付费模式，向云端外包计算正变得非常流行。虽然普通的计算外包技术适用于日常生活，但当计算涉及敏感信息时，挑战就变得严峻。云外包的主要安全关注点是云提供商可能不诚实，这会影响外包计算的完整性、隐私性能。在本章中，我们总结了云外包现有的挑战、解决方案和开放的研究问题。在主要用户采用云计算进行敏感计算之前，许多开放性问题需要得到解决。我们需要公营和私营机构以及学术界的共同努力来克服这些开放问题。一种健壮、安全的计算外包技术可以带来更多的云消费者，从而降低成本并对我们的整个社会产生更广泛的影响。\n\
