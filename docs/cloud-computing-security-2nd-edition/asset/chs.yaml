  \ 可信的服务计费\n### 34.3 总结\n### 延伸阅读\n### 参考文献\n\n## 34.1 引言\n\n与之前引入计算的尝试不同，云计算在各个领域取得了成功。凭借其便利的按需付费服务、低成本的计算提供以及灵活但无限的资源，云计算极有可能是未来的主要范式之一。根据美国信息技术研究和咨询公司\
  \ Gartner Inc. 的报告，2016 年是云计算兴起的定义性的一年，到 2017 年底，近一半的大型企业参与了云端部署。\n\n安全是分布式系统和服务的要关注点。云计算继承了其前代的所有这些问题。此外，云计算引入的新概念（如计算外包、资源共享和外部数据仓库）增加了隐私忧虑，并使云平台更容易受到新的安全问题和威胁。因此，云解决方案的安全性至关重要，并被认为是广泛采用和接受的最重大障碍之一。2014\
  \ 年的 iCloud 数据泄露事件证明了云计算的脆弱性和安全性。云计算不仅引入了额外的风险和挑战，还为部署和维护现有安全标准增加了各种复杂性。广泛的移动设备访问和云提供商提供的按需服务进一步放大了安全担忧和威胁。表\
  \ 34.1 列出了某些已知攻击及其后果。\n\n表 34.1 针对云计算的已知攻击\n\n| 攻击 | 后果 | 类别 |\n| :--- | :--- |\
  \ :--- |\n| 服务盗取 | 服务被盗 | 云基础设施 |\n| 拒绝服务 | 服务不可用 | 云基础设施 |\n| 恶意软件注入 | 恶意软件注入 |\
  \ 云基础设施 |\n| 跨虚拟机侧信道 | 信息泄露 | 云基础设施 |\n| 针对性共享内存 | 云恶意软件注入 | 云基础设施 |\n| 钓鱼 | 未授权的访问\
  \ | 访问控制 |\n| 僵尸网络 | 服务不可用 | 访问控制 |\n| 虚拟机回滚攻击 | 发起暴力破解 / 敏感信息泄露 | 云基础设施, 访问控制 |\n\
  \n\n\n\n\n根据美国法律，信息安全定义为保护信息和信息系统不受未经授权的访问、使用、披露、中断、修改、检查、记录或破坏，以提供信息的完整性、机密性和可用性。因此，为了应对时间的考验，云计算应该提前解决所有这些安全问题。Gartner\
  \ Inc. \\[1, 4, \\] 提出了七大主要的云计算安全风险：服务外包、合规性问题、数据位置、共享环境、业务连续性与灾难恢复、调查非法活动的困难环境，以及长期可行性。第\
  \ 34.2 节对云安全问题进行了分类讨论。\n\n## 34.2 分类\n\n云计算模型中的不同层级可能会出现安全问题。存在系统级威胁（即入侵者绕过安全措施获取未经授权的访问），以及云基础设施和网络级威胁。云的每个组件都应该单独处理，并需要给予同等的关注以保护整个云计算平台。正如\
  \ Khalil、Khreishah 和 Azeem \\[5\\] 所述，云计算面临的潜在挑战可以分为表 34.2\n\n大数据是计算服务关注关注，因为大多数系统没有足够的本地数据存储能力。处理大数据系统的个人和企业将本地数据管理外包给云端，从而获得了更大的灵活性、成本效益和巨大的计算能力。然而，基于云的解决方案是以安全隐私问题为代价的。当数据不再由用户物理掌握时，数据的机密性、可用性和完整性就会面临风险。Amazon\
  \ EC2 云服务在 2011 年永久丢失了部分用户数据 \\[6\\]，这显示了云外包数据的脆弱性。\n\n数据隐私是数据外包解决方案的固有属性。云计算平台引发了巨大的隐私担忧，因为客户无法访问甚至不知道系统环境或防火墙，特别是在软件即服务（`SaaS`）和平台即服务（`PaaS`）模型中。云服务提供商处的共享硬件资源使数据外包模型中的隐私问题变得更加复杂。此外，网络上的数据处理是防止隐私信息在数据传输的各个阶段发生未经授权泄露的一个大挑战。\n\
  \n某些应用程序可能严格执行针对单点故障或停机问题的韧性，并可能要求相应的数据不仅复制到多个系统，还要复制到多个地理位置。因此，此类应用程序必须向用户保证其个人数据的安全存储，以及高水平的可用性和容错能力。遗憾的是，由于用户并不了解云提供者的运营基础设施，云服务提供商可能会利用用户的无知和服务的抽象，可能不按承诺提供服务，从而降低运营成本并增加利润。\n\
  \n#### 34.2.1.1 数据外包方法\n\n数据外包的安全问题多年来一直在解决。针对云计算中新引入的威胁，研究人员提出了多种隐私和安全模型、技术和算法。这些研究主要集中在提供服务证明和确保外包数据的隐私。\n\
  \n表 34.3\\]，Dodis 等人 \\[34\\]，Shacham 和 Waters \\[35\\]，Zhang 等人 \\[36\\] |\n| 数据拥有证明\
  \ | Ateniese 等人 \\[37\\]，Gritti 等人 \\[38\\] |\n| 动态数据拥有证明 | Erway 等人 \\[39\\]，Barsoum\
  \ 和 Hasan \\[40\\] |\n| 隐私 | Roy 等人 \\[41\\]，Zhang 等人 \\[42\\]，Liu 等人 \\[43\\] |\n\
  | 地理定位 | Bowers 等人 \\[7\\]，Katz-Bassett 等人 \\[8\\] |\n\n为了应对云用户对单点故障和服务可用性的担忧，证明数据复制到多个物理位置已成为云服务提供商面临的一个大挑战。Bowers\
  \ 等人 \\[7\\]提出了一种利用处理特定请求的响应时间对多磁盘数据进行验证的技术。Katz-Bassett 等人 \\[8\\]提出了一种基于拓扑的地理定位的方法估计任意\
  \ Internet 主机的地理位置，这有助于验证多个地理位置的数据位置。\n\n\n\n\n数据的隐私与安全要求对云平台中的数据处理方法论进行重新思考和设计。可以肯定的是，在不久的将来，大多数如果不是所有的计算服务模型都将迁移到云端。因此，数据库即服务（`DaaS`）将成为云服务提供商的一种流行模型。遗憾的是，现有的查询服务程序并非为这种新的分布式技术设计的，因此可能会导致云平台面临重大的隐私泄露风险。云端数据交换的巨大增长可以认为是云原生数据库管理系统的驱动力。因此，利用加密机制来保护数据，然后在在加密数据上部署查询机制\
  \ [9]\\]将成为防止隐私和安全泄露的首要关注。\n\n### 34.2.2 访问控制\n\n传统的访问控制架构基于这样一个假设：数据存储管理位于信任域内，且所有者对系统有足够的了解。然而，在云计算范式中，这一假设不再成立。多个利益相关者作为用户参与到云平台中，并拥有不同级别的数据访问权限。因此，需要更细粒度的访问控制，以确保每个利益相关者只能访问其获得授权的内容，并确保云服务的隐私性和机密性。\n\
  \n研究人员和专家在考虑分布式系统的安全问题时，主要关注外部攻击者。因此，人们付出了巨大努力将恶意攻击者挡在边界之外。遗憾的是，这些努力在云计算范式中并不总是有效的。谷歌因员工违反内部隐私政策而解雇工程师的事件证实了，攻击者可能存在于服务框架内部\
  \ [10]\\]\n\n卡内基梅隆大学计算机应急响应小组（`CERT`）将恶意内部人员定义为：\n\n现任或前任员工、承包商或业务伙伴，他们拥有或曾拥有网络的授权访问权限，并故意利用该权限负面影响任何信息或信息系统的机密性、完整性或可用性。[11]\\\
  ]\n\n由于内部威胁，云服务面临知识产权被窃、IT 破坏和信息泄露的严重风险。因此，内部威胁引发的安全漏洞应该通过策略、技术解决方案和适当的检测方法来解决。\n\
  \n#### 34.2.2.1 访问控制方法\n\n安全操作系统中广泛采用的两种主要访问控制模式是自主访问控制（`DAC`）和强制访问控制（`MAC`）（表 34.4）。除了这两者之外，基于身份的访问控制（`IBAC`）、基于角色的访问控制（`RBAC`）和基于属性的访问控制（`ABAC`）是确保安全访问控制的主要方法（表\
  \ 34.4）。`IBAC` 使用访问控制列表管理授权用户的身份，因此对于用户量巨大增长的云服务来说，其扩展性并不高。相反，`RBAC` 利用一组带有访问控制定义的特定角色，并将所有用户映射到相应的角色。权限被分配给角色，因此每个用户都根据其在系统中的角色获得相应的访问。在\
  \ `ABAC` 系统中，用户和数据分别标记了特定的属性和访问策略。因此，利用映射算法为单个用户的特定属性集定义访问权限。\n\n表 34.4 不同访问控制机制的比较\n\
  \n![](img/T34.4.jpg)\n\n由于云计算涉及多样化的利益相关者，访问控制一直是最关键的安全问题之一。然而，访问控制与系统的可用性和灵活性成反比。在为云服务设计访问控制机制时，灵活性是必不可少的。此外，由于云中不同的服务级别需要单独的授权策略，因此需要细粒度的访问控制。再次，云计算中不可避免的多租户问题应当被考虑，因此给定的访问控制模型应显式定义共享资源的访问。如前所述，`RBAC`\
  \ 将角色映射到用户。如果可以定义每个利益相关者的角色，`RBAC` 将成为云的潜在解决方案。在云中部署 `RBAC` 的主要挑战在于确定所需的权限权限。\n\n\
  ### 34.2.3 多租户\n\n将物理资源复用给不同的客户环境使得云计算挑战变得独特且复杂。它将客户的隐私暴露给恶意租户。事实上，恶意租户可能会在不违反法律的情况下收集受害者的活动信息。Risten\
  \ 等人 [12]\\]显示，恶意客户只需投入少量资金启动虚拟机（`VMs`），即可获得高达 40%的租户攻击成功率。因此，云服务提供商必须确保强隔离。大多数服务提供商在应用程序栈的多个层次使用逻辑隔离\
  \ [13]\\]\n\n曾出现过企业因对机密性的极度担忧而要求隔离部署的情况 [14]\\]。在与 NASA 的需求后，亚马逊推出了物理隔离的用户专享云服务\
  \ [4]\\]。由于云服务提供商的基础是一个与客户的黑盒，客户被迫完全依赖云服务提供商在多租户环境中提供适当隔离承诺。因此，对于客户和审计员来说，强制或验证云服务提供商是否提供了必要的隔离是一个大挑战。\n\
  \n#### 34.2.3.1 多租户方法\n\n多租户问题从云计算初期就得到了解决。大量的研究，如 `HyperSentry` [15]\\]、`Hypersafe`\
  \ [16]\\]和 `Cloudvisor` [17]\\]，都关注保护虚拟化程序以缓解多租户问题。另一种，Keller 等人引入了 `noHype` [18]\\\
  ]，它并不是尝试进行保护，而是完全消除了虚拟化层（表 34.5）。遗憾的是，虚拟化是云基础设施的关键因素，使其能够以最小延迟按需扩展，而这种方法可能会消除云计算令人兴奋的特性。\n\
  \n\n\n\n\n# 表 34.5 针对共存问题的研究方法示例\n\n| 方法 | 研究工作 |\n| --- | --- |\n| 消除风险 | `noHype`\
  \ [18\\] |\n| 缓解风险 | `HyperSentry` \\[15\\], `Hypersafe` \\[16\\], `Cloudvisor`[17\\\
  ] |\n| 共存性验证 | `HomeAlone` \\[4\\] |\n\n云基础设施对物理隔离的需求引入了一个新领域，研究人员专注于服务隔离的验证。Zhang\
  \ 等等人介绍了 `HomeAlone` \\[4\\\\]，它允许租户通过对 L2 缓存进行时间测量来检测共存，从而验证虚拟机（VM）是否实现了物理隔离。\n\
  \n遗憾的是，验证共存性无法避免共存带来的安全威胁。同时，共存无法被消除，因为它是云计算以及灵活且成本效益的服务模型的核心概念。因此，来自共存的威胁将是一个至重要的安全问题。用于分配和确定特定服务位置的先进算法是混淆恶意用户与其目标共存的关键。\n\
  \n## ## 34.2.4 安全标准\n\n云计算技术的不断演变导致了非标准的安全实现和实践。此外，缺乏审计治理机制，创造了一个极具挑战性的环境，以验证云服务提供商是否遵守相关标准。因此，云计算安全可能尚未准备好接受审计\
  \ \\[19\\]。用户依赖服务水平协议（SLA），并且必须依靠云服务提供商来履行其承诺。然而，云服务是尽力而为的服务，服务提供商可能无法保证安全标准。因此，由于\
  \ SLA 在确保云服务安全方面起着至关重要的作用，机构和安全专家应当成为 SLA 和法律方面的一部分，而这在云服务模型的实践中尚未体现 \\[20\\\\]。\n\
  \n### ### ### 34.2.4.1 取证学\n\n云计算是其自身潜力的受害者。云计算平台为任何人（包括恶意用户）提供巨大的计算能力。此外，云平台配备了网络犯罪分子所需的所有功能和服务。短持续环境的能力可以根据需要建立并在极短时间内终止，这降低了为数字取证调查留下任何线索的机会。因此，云计算是执行暴力攻击、发起垃圾邮件活动和运行僵尸网络程序的完美环境\
  \ \\[21\\\\]。近期在 Amazon EC2 中的僵尸网络事件 \\[22\\\\] 就是此类攻击的例子。\n\n加密算法的安全性通常基于计算能力有限和理论上多项式时间的假设。然而，云计算凭借其巨大的计算资源对这一既有的安全假设构成了威胁。巨大的云计算能力可能被用于破解密码。攻击者可以通过从云端租赁大量计算能力，使用暴力破解算法在相对短的时间破解加密密码。在\
  \ 2011 年 4 月侵入索尼 PlayStation 游戏的攻击者曾使用 Amazon EC2 资源破解某些加密密钥 \\[23\\\\]。Thomas Roth\
  \ 展示了如何使用 `EC2` 和一些自定义软件在 20 分钟内破解 `WPA-PSK 保护网络` 的密码 \\[24\\\\]。\n\n云服务提供商在不同的地理位置建立其数据中心，以确保服务的可用性并避免单点故障。这些位置可能处于不同的法律管辖区下。即使在美国内部，不同的州也有不同的法律并相应的执行。为了使法律问题更加复杂，云计算平台由于其黑箱性质，不会向消费者披露地理位置。对不同地理位置的隐私的理解并不一致。因此，分发云端内容会导致一个问题：底层技术可以在不经用户同意和知情的情况下部署不同的隐私标准。此外，在服务提供商物理位置执行的法律管辖权可能与在数据仓库所在地执行的法律管辖权完全不同。因此，多管辖区和多租户挑战被确定为数字取证专家最关注的法律问题。\n\
  \n云计算中的审计概念不像通用客户端-服务器模型那样简单。对特定的云利益相关者进行取证调查审计的过程可能会与同一物理资源内其他共存者的隐私发生冲突。此外，参与法律调查的特定者可能能够在不留痕迹的情况下更改、伪造、修改甚至删除电子证据。因此，监管机构和审计人员建立云服务证据的完整性面临挑战。由于云服务提供商的架构各异，针对数据收集工具的标准化并不是可行的方法，因此云服务提供商有义务遵守法律。同时，云技术应该部署符合有效数字取证要求的的安全架构。\n\
  \n在云计算合规性领域的研究非常少 \\[4\\\\]。尽管在本地存储系统遵守这些规定方面已有大量研究，但尚不清楚任何云系统是否符合规定。云提供商与消费者之间现有的\
  \ SLA 并没有说明这些问题。\n\n### ### ### ### 34.2.4.2 信任不对称\n\n控制系统的能力是决定客户与服务提供商之间信任关系的重要因素。对资源的控制越多意味着消费者对云服务提供商越信任。如图\
  \ 34.1（chapter34.xhtml#fig34.1）所示，`IaaS` 提供者提供了最高的资源控制，这导致了最小的安全性。相反，`SaaS` 提供者的最低资源控制确保了最大的系统安全性。表\
  \ 34.6（chapter34.xhtml#T34.6）显示了客户对不同云服务模型中不同层的控制。由于 `SaaS` 和 `PaaS` 模型中的控制有限，用户必须依赖云服务提供商来解决底层操作层的安全问题。因此，可以看出云服务提供商在其利益相关者之间面临着独特的不对称信任关系。随着云解决方案的日益普及，这种不对称信任关系对于那些将其服务迁移到云端的企业来说是一个主要关注的问题。\n\
  \n\n\n\n\n# 表 34.6 云计算不同服务模型下消费者对不同层的控制能力\n\n![](img/T34.6.jpg)\n\n任何新技术都面临着信任问题。云服务提供商与用户之间的信任仍处于初级阶段。然而，一种可持续的技术要求客户与服务提供商之间建立信任关系。云服务提供者主要关注云端资源的性能、便利性、灵活性和按需可扩展性，在很大程度上牺牲了机密性、完整性和隐私性。这种做法增加了潜在云用户对采用云的不安全感和恐惧。此外，竞争市场中的企业由于云服务提供商可能会对其复杂的机密数据发生泄露，因此对安全非常关注。\n\
  \n用户对系统的信任与其在使用系统时拥有的控制程度直接相关。遗憾的是，为了确保系统环境的安全，云服务提供商不愿为用户提供更多控制。研究人员已经为云计算环境提出了各种信任模型\
  \ [25, 26, 27, ]]。然而，这些解决方案大多取决于服务水平协议（SLAs）或建立第三方信任代理。\n\n## 34.2.4.3 可信的服务计费\n\
  \n计算即服务允许客户外包计算，而云服务提供商根据消耗的资源量进行结算。在实践中，每个服务提供者都部署了不同的结算模型，而没有特定的行业标准。云的黑箱性质使用户无法直接控制其实际资源消耗和相应的费用。此外，除了漏洞、网络拥塞和侧道攻击外，物理资源上的共存（cotenancy）可能导致服务无法完全隔离\
  \ [28]。因此，用户可能被收取过度费用，这并不意外。\n\n与传统的客户端-服务器模型不同，云服务提供商无法被完全信任。恶意的云服务提供商可能会生成虚假账单，或者可能缺乏生成资源使用精确成本的适当工具。公用事业计算\
  \ CPU 时间计费的标准尚未在云计算平台中定义。例如，`Amazon EC2` 根据消费者指定的实例运行状态时间收费，而 `Google AppEngine`\
  \ 在计费时考虑的是总 CPU 周期。另一方面，`HP` 使用 `Computon` 术语，基于处理器的使用时间和和其他资源进行计费。\n\n虽然作为云计算前身的网格计算已经考虑并建立了开放网格服务架构的资源计费标准\
  \ [29]，但云计算尚未实现服务计费流程的标准。因此，服务计费对于云消费者来说仍然是不可信的。该过程需要一个系统的、可验证的且可靠的框架使云计算具有可持续性。随后，云服务提供商与客户及企业之间的信任关系将得到增强，从而使云解决方案被广泛采用。\n\
  \n一个可靠且可验证的服务计费框架解决了以下关注问题：账单是否是根据准确消耗生成的？消耗是否是真实需要的？在各项研究中 [30, 31, ]，研究人员从云的大量数据和黑箱性质的角度应对了可信性的实际挑战。\n\
  \n安全溯源技术（Secure provenance technologies）可能为取证和可信的服务计费提供极佳解决方案。数字溯源是指数字对象的连续监管链以及对该对象执行的操作序列的记录。除了溯源的生成外，数字溯源的安全性也是关于溯源对象真实性和可验证性的一大主要关注点\
  \ [32]。溯源对象建立了数字对象的谱缘和修改记录，在数字取证调查中起着至关重要的作用。鉴于云计算框架复杂的运行结构，云端数据和服务的安全溯源将是不久后的重点研究领域。\n\
  \n## 34.3 总结\n\n近年来，云计算已成为主导性的计算范式。由于其在灵活性、性能和效率方面的巨大优势，云计算正逐渐缓慢但稳定地被几乎所有领域采用。随着越来越多的部门迁移到云计算平台，云服务不仅要完全准备性能预期，还要准备应对所有类型的潜在安全问题、风险和挑战，这变得非常重要。由于云计算仍然是一项新技术，现在是时候批判性地思考安全问题并为下一代服务模型准备好云计算了。然而，云安全研究的一个主要局限是脱离了现实场景。因此，在解决现实问题时，性能开销、经济合理性和实际威胁模型都是重要因素。此外，识别主要关注点并主动迈向可信云计算范式是关键一步，这将确保技术的可持续性以及在医疗、银行和政府等关键领域的广泛应用。\n\
