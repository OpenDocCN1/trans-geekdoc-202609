  \n# 7. 云端风险管理\n\n## 7.1 引言\n云信息系统面临着威胁，这些威胁会对组织的运营（任务、功能）、组织资产、个人和其他组织产生不利影响。恶意实体可以利用已知和未知的漏洞来破坏信息的机密性、完整性可用性。组织需要处理许多类型的风险：程序管理、投资、法律责任、安全、库存、供应链、安全等。风险管理可以被视为一种完全整合到组织每个方面的整体性活动。风险管理活动可以根据处理风险的级别分为三类：\n\
  \n1. 组织层级（第 1 级）\n2. 任务与业务流程层级（第 2 级）\n3. 信息系统层级（第 3 级）\n\n## 7.2 风险框架\n风险管理需要是一个循环执行的过程，由一组用于监督和控制风险的协调活动组成。该过程的目标是增强战略和战术安全，包括执行风险评估、实施风险缓解策略，以及采用风险控制技术和程序来持续监控信息系统的安全状态。云信息系统与传统信息系统一样，要求在整个系统开发生命周期（`SDLC`）中进行风险管理。\n\
  \n## 7.3 提供者的风险管理\n在本章中，我们仅关注与云信息系统的运行和使用相关的第 3 级安全风险。为了防止和缓解任何威胁、不利行为、服务中断、攻击或破坏，组织需要将其残余风险量化至可接受风险水平阈值以下。\n\
  \n第 1 级和第 2 级的风险决策将根据数据的敏感性、合适的云架构以及信息系统层级的保护措施和对措施（即安全控制），影响组织系统的最终选择。信息安全需求通过从标准化的安全控制目录中选择适当的管理、运维和技术安全控制措施来满足（例如：美国国家标准与技术研究院\
  \ `NIST` 特别出版物 800-53 第 4 版、ISO/IEC 27001、ISO/IEC 27002 等）。\n\n## 7.4 消费者的风险管理\n\
  正如`第 3 章`所述，我们讨论了云端需要的可视性。\n\n## 7.5 总结\n\n## 参考文献\n\n\n\n\n\n在云生态系统中，云参与者之间复杂的的关系、参与者的个人使命、业务流程及其支持的信息系统需要一个集成的、整个生态系统的风险管理框架（`RMF`），以满足所有云参与者的需求。与任何信息系统一样，对于基于云的信息系统，云参与者负责评估其可接受的风险，这取决于他们对云生态系统范围剩余风险设置的风险容忍阈值。\n\
  \n为了在生态系统层面有效管理信息安全风险，必须建立以下高层要素：\n\n*   为参与云生态系统编排的云参与者分配风险管理职责。在内部，每个云参与者需要进一步将职责分配给其高级领导者、执行人员和代表。\n\
  *   建立云生态系统范围的风险容度，并通过其服务水平协议（`SLA`）通信这种风险容度，包括影响风险容忍度的决策活动信息。\n*   每个云参与者对利用云生态系统的信息系统的运行和/或使用过程中产生的信息安全风险进行近实时监控、识别和理解。\n\
  *   云参与者的问责机制，以及对云参与者事件、威胁、风险管理决策和解决方案进行近实时信息共享。\n\n## 7.2 风险管理框架\n\n风险通常表示为发生负面结果的概率乘以此类负面结果的大小。在信息安全中，概率被理解为对系统的威胁、可被利用的漏洞以及这些漏洞被利用后果的函数。因此，安全风险评估侧重于识别云生态系统中破坏性事件可能发生的位置。\n\
  \n基于风险的信息系统管理方法是一项整体活动，需要完全集成到组织的每一个方面，从规划到 `SDLC` 过程，到安全控制分配和持续监控。\n\n因此，`RMF`\
  \ 提供了一个严谨且结构化的过程，将信息安全和风险管理活动集成到 `SDLC` 中。`RMF` 主要运行在风险管理层级的 `tier 3` 层，但它也可以与 `tier\
  \ 1` 和 `tier 2` 发生交互。一些示例交互包括：向风险执行官提供来自持续监控和授权决策的反馈；将更新后的风险信息发布给授权官员和信息系统所有者等。\n\
  \n图 7.1 中所示的 `RFM` 重现了 `NIST 特别出版物`（`SP`）`800-37 Revision 1` 风险管理过程——该过程已被政府机构和私营部门验证为其传统信息系统的最佳实践。正如\
  \ `NIST SP 800-37 Rev. 1`《将风险管理框架应用于联邦信息系统的指南：安全生命周期方法》所述：定义信息系统需求是任何系统开发过程的关键部分，并且需要在系统的启动阶段开始。由于安全需求是整体功能和非功能需求的子集，因此安全需求需要与功能和非功能需求同步集成到\
  \ `SDLC` 中。需要定义安全需求，并且从系统开发开始就对解决方案进行研究和工程设计。将安全视为系统的补丁或添加，并独立于 `SDLC` 进行架构设计和实施，是一个更加困难的过程，可能会产生更高的成本，且有效缓解风险的潜力较低。\n\
  \n![Figure 7.1 Risk management framework (NIST SP 800-37 Rev. 1).](img/fig7.1.jpg)\n\
  \n图 7.1 风险管理框架 (NIST SP 800-37 Rev. 1)。\n\n应用 `RMF` 的六个定义良好的风险相关步骤的过程，应由处于定义组织角色的选定个人或小组作为\
  \ `SDLC` 过程的一部分（或与之并行）并发执行。这些步骤或任务也列在表 7.1 中，并与本节早些时候描述的风险管理行动保持一致。\n\n### 表 7.1\
  \ 风险管理活动与风险管理框架步骤 (NIST SP 800-37 Rev. 1)\n\n| 风险评估（分析云环境以识别潜在漏洞和缺陷） | 步骤 1：基于系统影响分析对信息系统以及由系统处理、存储和传输的信息进行分类。识别操作、性能、安全和隐私需求。\
  \ |\n| :--- | :--- |\n| 步骤 2：根据安全分类为信息系统选择初始安全控制集（称为基准安全控制）。然后，根据组织对风险的评估和运行环境的情况，调整并补充基准安全控制集。开发安全控制有效性的持续监控策略。在安全计划中记录所有控制措施。审查并批准安全计划。\
  \ |\n| 风险处理（设计缓解策略和计划） | 步骤 3：实施安全控制，并描述这些控制措施在信息系统及其运行环境中是如何使用的。 |\n| 步骤 4：使用评估计划中记录的适当评估程序对安全控制进行评估。评估确定控制是否实施正确，以及它们是否有效地产生预期结果。\
  \ |\n| 步骤 5：根据信息系统运行产生的确定风险以及对该风险可接受的决策，授权信息系统运行。评估时考虑了对组织运营（包括任务、功能、形象或声誉）、组织资产、个人和其他组织的风险。\
  \ |\n| 风险控制（风险监控——调查、审查事件、识别策略调整） | 步骤 6：持续监控信息系统中的安全控制，包括评估控制有效性、记录系统或运行环境的变化、对这些变化进行安全影响分析，并向指定的组织官员报告系统的安全状态。\
  \ |\n\n`NIST SP 800-37 Rev. 1` 提供了安全分类、安全控制选择、安全控制实施、安全控制评估、信息系统授权和安全控制监控的详细信息。该文档通过实施稳健的持续监控过程，促进了近实时风险管理和持续信息系统授权的概念。鼓励读者查看\
  \ `NIST SP 800-37 Rev. 1`，本文利用其来讨论在云生态系统中应用 `RMF`。需要注意的是，尽管 NIST 文档处理了由不同实体运行的多个子系统组成的复杂信息系统，但它并未涉及基于云的信息系统或其他任何利用公用资源的系统。\n\
  \n在为基于云的信息系统编排云生态系统时，云消费者作为相关数据的所有者，仍负责确保系统和数据的安全，使其与数据敏感性相。然而，云消费者的控制水平和直接管理取决于云部署模型。\n\
  \n\n\n\n\n图 7.2 基于本书在第 12 章中讨论的消费者控制级别，并与应用于功能栈不同层级的风险管理框架（RMF）并行说明了这一方面。它展示了对于基础设施即服务（IaaS）云，云用户管理虚拟机管理器之上的功能栈顶部分；而对于平台即服务（PaaS）云，消费者管理的功能栈按比例减少；在软件即服务（SaaS）云生态系统中，则减少到极小。\n\
  \n![图 7.2 将风险管理框架应用于云生态系统 (RMF4CE)。](img/fig7.2.jpg)\n\n图 7.2 将风险管理框架应用于云生态系统 (RMF4CE)。\n\
  \n如上所述，图 7.2 还显示，在表 7.1 以及`NIST SP 800-37 Rev. 1`中列出的 RMF 过程可以由云参与者应用于其管理下的功能栈层。在仅由云用户和云提供者编排的简化云生态系统模型中，表\
  \ 7.1 中列出的 RMF 由云提供者应用于栈的下部分，该部分是作为提供服务的一部分构建的。云用户将 RMF 应用于上层功能层，即在作为服务提供的云基础设施之上构建并部署的层。\n\
  \n然而，在获取云服务之前，云用户需要分析与特定信息系统采用云解决方案相关的风险，并对与该系统云操作相关的风险处理和风险控制活动进行计划。为了做到，云用户需要获得服务其云信息系统运行的整个云生态系统的视角。云用户还必须以定制的方式应用\
  \ RMF，以便他们能够：\n\n* 实施风险评估\n* 识别最匹配的云架构\n* 选择最合适的云服务\n* 获取对云产品的必要可见性\n* 在最终确定 SLA（服务水平协议）并进行安全授权之前，定义并协商必要的风险处理和风险控制缓解措施\n\
  \n图 7.2 从云用户的角度描绘了这种用于云生态系统的 RMF（RMF4CE），将其展示为一个涵盖整个云生态系统的重复过程。第 7.3 节进一步讨论了这一主题，第\
  \ 7.2 节提供了云提供者风险管理过程的概述。\n\n## 7.3 云提供者的风险管理过程\n\n云提供者开发云架构并构建包含核心功能和运行特征的云服务，包括满足基线要求的安全和隐私控制。他们的解决方案旨在以最小定制化的方式满足大量云用户的需求。云提供者在选择和实施其安全和隐私控制时，会根据云提供者必须遵守的适用法律、指令、政策、标准或法规，考虑其有效性、效率和约束。云用户的特定需求和指令是未知的，因此被投影为一组通用的核心集合。\n\
  \n在第 14 章中，图 14.7 和 14.8 描绘了 PaaS 的服务边界，说明了分配给云服务的资源集。云提供者在确定什么构成云服务及其相关边界方面具有极大的灵活性，但在系统架构和实现时，他们只能假设云用户将生成的数据性质。因此，云提供者选择并实施的安全和隐私控制是满足大量潜在用户需求的集合。然而，所提供的云服务的中心化使得云提供者能够设计出高度技术、专业的安全解决方案，这些解决方案可以提供比传统\
  \ IT 系统更高的安全态。\n\n将标准化或经过良好验证的方法应用于云服务风险管理，对于整个云生态系统及其支持的信息系统的成功至关重要。由于提供的云服务由云提供者直接管理和控制，对该系统应用\
  \ RMF 不需要比经典 IT 系统更多的额外任务；因此，第 7.2 节描述的风险管理方法是广泛接受、经过良好验证方法的良好示例。\n\n需要注意的是，云生态系统的安全态强度取决于最薄弱的子系统或功能层。由于云提供者的声誉和业务连续性取决于其用户解决方案的顺利运行和高性能，在应用\
  \ RMF 时，云提供者旨在补偿云用户解决方案中可能的弱点。\n\n## 7.4 云用户的风险管理过程\n\n通常情况下，当组织对涉及的过程和设备具有更大的控制权时，他们更倾向于接受风险。高程度的控制使组织在面临事件时能够权衡替代方案、设定优先级并为了自身的最佳利益采取果断行动。为了成功采用云信息系统解决方案，云用户必须能够清晰理解系统的云特定特性、每种服务类型和部署模型的架构组件，以及云参与者在建立安全云生态系统中的角色。此外，对于云用户的业务和任务关键流程，他们必须具备以下能力：\n\
  \n* 识别所有云特定的、经过风险调整的安全和隐私控制\n* 从云提供者和经纪人处（在适用且通过合同手段）请求服务协议和 SLA，其中安全和隐私控制的实施是云提供者的责任\n\
  * 评估安全和隐私控制的实施情况\n* 持续监控所有识别的安全和隐私控制由于云用户直接管理和控制他们实现的功能能力，对这些功能层应用 RMF 不需要比经典 IT\
  \ 系统更多的额外任务或操作；因此，第 7.2 节描述的风险管理方法是广泛接受、经过良好验证方法的良好示例。对于云服务，某些子系统或子系统组件位于云用户组织直接控制之外。由于采用云解决方案本身并不能提供与传统\
  \ IT 模型中指令等水平的安全性和对指令的合规性，能够进行全面的风险评估是构建对云系统信任的关键，也是授权其运行的第一步。\n\n云生态系统的特征包括：\n\n\
  * 广域网络访问\n* 云用户可见性和控制的减少\n* 动态的系统边界以及云用户与云提供者之间混合的角色/责任\n* 多租户制\n* 数据驻留\n* 可计量的服务\n\
  * 规模（按需）、动态性（弹性、成本优化）和复杂性（自动化、虚拟化）的显著增加\n\n\n\n\n\n这些特征通常会导致云消费者面临与传统信息技术解决方案不同的安全风险。为了在云解决方案中维护其信息系统和数据的安全水平，云消费者需要预先识别所有云特有的、经过风险调整的安全及隐私控制措施。他们还必须通过合同手段和\
  \ SLA 向云提供商和经纪商要求，确保所有安全和隐私组件都得到识别，并且其控制措施得到了完全准确的实施。\n\n理解不同的云计算部署模型与服务模型之间的关系和相互依赖性，对于理解云计算中涉及的安全风险至关重要。保护不同服务与部署模型组合的安全方法和责任存在差异，给云消费者带来了重大的挑战。\n\
  \n他们需要进行彻底的风险评估，作为风险处理过程的一部分，准确识别维护其环境安全水平所需的安全和隐私控制措施，并根据其风险控制需求，对迁移到云后的操作和数据进行监控。\n\
  \n云消费者在寻求确定哪种云服务提供能最有效地解决其云计算需求，同时以最安全、高效的方式支持其业务和任务关键流程和服务时，目前面临着若干挑战。本节的目的是从云消费者的角度应用第\
  \ 7.2 节描述的 RFM（风险管理框架），并为云消费者揭秘描述、识别、分类、分析和选择云服务的流程。\n\n通常情况下，采用云解决方案的云消费者需要遵循以下步骤：\n\
  \n1. 描述可能利用云解决方案的服务或应用程序\n2. 识别该服务必须实现的所有功能能力\n3. 识别保护该服务或应用程序所需的安全和隐私需求以及安全控制措施\n\
  \n对于 NIST 标准和指南的采用者，云消费者需要根据联邦信息处理标准（分别为《联邦信息和信息系统安全分类标准》即 `FIPS` 199，以及《联邦信息和信息系统的最低安全要求》即\
  \ `FIPS` 200）来确定信息系统的安全类别和相关的影响层级。信息系统的影响层级决定了需要实施的安全控制基准。三组基准控制分别对应低影响、中等影响和高影响的信息系统。\n\
  \n1. 通过结合云部署模型（公有、私有、混合、社区）和云服务模型（IaaS、PaaS、SaaS），分析并选择最合适的云生态系统架构：\n    * a. 公有\
  \ IaaS、公有 PaaS、公有 SaaS\n    * b. 私有 IaaS、私有 PaaS、私有 SaaS\n    * c. 混合 IaaS、混合 PaaS、混合\
  \ SaaS\n    * d. 社区 IaaS、社区 PaaS 和社区 SaaS。\n2. 识别并选择参与云生态系统协调的云主体（例如提供商和/或经纪商）。\n\
  3. 理解云提供商和经纪商的安全态以及继承的安全和隐私控制措施。调整安全和隐私控制措施以满足特定用例的安全隐私需求，或在必要时识别额外的补偿性安全控制措施。\n\
  4. 通过显式分配和选择语句，为组织定义的安全参数分配特定值。\n5. 如果需要，用额外的安全和隐私控制增强补充基准。\n6. 为安全和隐私控制的实施提供额外的规范信息。\n\
  \n根据所选的云生态系统架构，组织将保留并承担为云消费者识别的安全控制措施实施，并辅以针对消费者特定案例的补充控制 set。\n\n在 `图 7.3` 中，我们展示了从云消费者的视角应用于云生态系统的\
  \ RMF。云消费者需要执行的额外操作和步骤用*斜体*标记。\n\n![图 7.3 云消费者视角应用于云生态系统的风险管理框架。](img/fig7.3.jpg)\n\
  \n图 7.3 云消费者视角应用于云生态系统的风险管理框架。\n\n从消费者视角应用于云生态系统的 RMF 可用于解决与云信息系统相关的安全风险，方法是将结果纳入与外部云提供商和云经纪商合同的条款中。这些条款的性能方面也被纳入\
  \ `SLA` 中，它是安全授权过程以及云消费者、云提供商和经纪商（如适用）之间服务协议 (`SA`) 的内在部分。合同条款应包含云消费者及时访问或提供商及时交付云审计日志、持续监控日志以及任何用户访问日志。\n\
  \n`表 7.2` 将风险管理活动与 `NIST SP 800-37 Rev. 1` 中的相应步骤对齐，并提供了映射到 `图 7.3` 的额外细节。\n\n表\
  \ 7.2 风险管理框架——云消费者视角\n\n| 风险管理活动 | NIST SP 800-37 RMF 步骤 | 风险管理框架——云消费者视角 |\n| ---\
  \ | --- | --- |\n| 风险评估（分析云环境以识别潜在漏洞和缺陷） | 1. 分类 | 根据系统影响分析，对信息系统以及由系统处理、存储和传输的信息进行分类。识别操作、性能、安全和隐私需求\
  \ |\n| | 2. 选择（包括评估–选择–协商） | 识别并选择整个信息系统的功能能力，根据系统影响层级选择相关的基准安全控制、隐私控制措施和控制增强<br>-\
  \ 为此信息系统识别并选择最合适的云架构<br>- 评估/审查符合消费者标准的云提供商（架构、功能能力和控制措施）<br>- 选择最符合所需架构和安全需求的云供应商（理想情况下应选择提供尽可能多措施的供应商，以减少需要调整的控制措施数量）<br>-\
  \ 在过程中，识别由消费者实施的控制措施、由提供商作为服务的一部分实施的控制措施，以及需要调整的控制措施（通过补偿控制和/或参数选择）<br>- 在采购过程中协商\
  \ SLA、指标并签署 SA<br>- 在安全计划中记录所有控制措施。审查并批准安全计划 |\n| 风险处理（设计缓解策略和计划） | 3. 实施 | 实施云消费者负责的安全隐私控制措施\
  \ |\n| | 4. 评估 | 评估云提供商对调整的安全隐私控制措施的实施情况<br>- 评估安全隐私控制措施的实施情况，并识别提供商控制措施与消费者控制措施之间的任何继承和依赖关系\
  \ |\n| | 5. 授权 | 授权云信息系统运行 |\n\n\n\n\n\n| 风险控制（风险监控——调查、审查事件、识别策略调整） || 6. 监控 |\n\
  \n*   对消费者管理下的安全和隐私控制的操作及其有效性进行持续/近实时监控\n*   对云提供商与云信息系统相关的运营进行持续/近实时监控，并评估系统的安全态势\n\
  * 对云提供商的服务进行重新评估和重新授权（定期或持续）\n\n表 7.2 中步骤所涵盖的方法使组织能够向采购人员、云提供商、运营商和经纪人系统地识别其通用的、混合的特定系统的安全控制措施以及其他安全需求。\n\
  \n云消费者在选择云提供商和/或经纪商之前，仍负责进行风险评估，识别其云服务（s）的所有安全需求，并选择合适的安全和隐私控制措施。应直接或从授权的云供应商库中选择最符合云消费者需求的提供商和经纪商。云消费者需要进行彻底的评估（理想情况下使用第三方独立评估员），以评估使用该服务的风险。成功创建并迁移到稳健的云生态系统取决于对云提供商的安全态势和系统性能进行评估，识别为了保护服务或应用程序而应实现的剩余安全和隐私控制，以及识别实施这些控制的云参与者。剩余的安全和隐私控制需要在云消费者与其他云参与者之间的协议中解决。\n\
  \n`SLA` 是 `SA` 的组成部分，详细说明了将提供的服务级别和类型，包括但不限于交付时间和性能。云提供商使用基于服务的协议向潜在云消费者描述其产品方案和服务条款。在某些情况下，云消费者可能对云提供商的方案和服务条款表示满意；然而，也有某些情况下云消费者对基于客户的协议和定制服务感兴趣。云消费者需要特别关注\
  \ `SLAs`，并让组织的采购、技术和政策专家参与，以确保 `SLA` 条允许组织履行其使命和性能要求。\n\n比较和选择服务方案时面临的一个挑战是，云提供商可能提供从提供者角度编写的默认合同。此类默认合同可能无法充分满足云消费者的需求，并可能限制云消费者对服务交付机制的可见性。\n\
  \n## 7.5 总结\n\n总之，为信息系统采用云解决方案需要云消费者尽力识别其安全需求，评估每个潜在提供商的安全和隐私控制，谈判 `SLAs` 和 `SAs`，并在授权服务之前与云提供商建立信任。本书介绍的详尽风险分析结合稳健的云生态系统，以及在谈判\
  \ `SLAs` 方面的充分指导，旨在帮助云消费者管理风险并在采用云服务时做出明智决策。\n\n## 参考文献\n\n1. `NIST Special Publication\
  \ 800-37 (Revision 1)`: Guide for Applying the Risk Management Framework to Federal\
  \ Information Systems: A Security Cycle Approach, 2010 年 2 月。\n2. `NIST Special\
  \ Publication 800-53 (Revision 4)`: Security and Privacy Controls for Federal Information\
  \ Systems and Organizations, 2013 年 4 月 [2015 年 1 月 22 日更新]。\n3. `NIST Special Publication\
  \ 800-144`: Guidelines on Security and Privacy in Public Cloud Computing, 2011 年\
  \ 12 月。\n4. `NIST Special Publication 800-145`: The NIST Definition of Cloud Computing,\
  \ 2011 年 9 月。\n5. `NIST Special Publication 800-146`: Cloud Computing Synopsis and\
  \ Recommendations, 2012 年 5 月。\n\n# 第 8 章：云安全风险管理\n\nMarco Cremini\n米兰大学\n克雷马\n\n\
  ## 目录\n\n* 8.1 引言\n* 8.2 风险分析的两大支柱\n    * 8.2.1 风险基础\n    * 8.2.2 信息安全中的风险定义\n \
  \   * 8.2.3 风险的定量模型\n* 8.3 云基础系统的风险管理\n* 8.3.1 非云计算特定的安全风险\n    * 8.3.2 云计算采纳/迁移的风险\n\
  \    * 8.3.3 云计算风险评估标准\n    * 8.3.4 云安全风险与服务水平协议\n    * 8.3.6 供应链的云安全风险\n* 8.4 总结\n\
  * 参考文献 2–3]。\n\n这种严峻的结论直接在 IT 风险管理、信息安全风险管理以及不可避免的云安全风险管理的低质量技术文献中得到了反映。然而，不应简单地将整个\
  \ IT 行业归咎为不成熟，并认为 IT 专业人士在自己的专业领域之外在科学和技术上普遍未做好准备，而以此逃避对糟糕现状的解释。相反，应该仔细研究问题，以便朝着正确的方向前进。\n\
  \n\n\n\n\n风险管理是一项艰巨的任务，它往往隐藏着其复杂性，对于缺乏经验的人来说尤为如此。那些显然将复杂性掩盖之下的简单化解决方案，通常被 IT 专业人员和学者认为是获取风险感知解决方案的有用且有效的“可行之径”，而这些方法完全没有对我们在处理风险条件下的决策问题时不断面临的误差、近似、假设以及终极不确定性进行正确评估\
  \ [4, 5, 2]。\n\n在本章中，我们对一些最相关的云安全风险管理研究和分析进行了综述。我们从风险分析与管理的支柱开始，以建立建立理论基准和术语的必要性，然后转向云安全风险管理。首先，我们介绍了通用的云计算安全威胁和漏洞工作。随后，我们考虑了与云风险管理最最相关的问题，组织、公司和学者已针对这些问题提出了相关的工具和建议。具体而言，我们讨论了从传统基础设施和业务迁移的企业在采用云计算时面临的风险，以及与云风险相关的标准和指南，这是我们近年来取得一些有趣新颖成果的领域；之后，我们转向考虑云服务水平协议（SLA）的风险以及纳入云安全水平目标（SLO）的可能性。最后，我们讨论了云供应链的风险，这是一个近期且重要的课题。\n\
  \n## 8.2 风险分析的两大支柱\n\n在一个专注于云风险管理的书籍章节中，人们很容易辩称，从询问什么是风险开始代表了对风险分析历史的过度偏离。每个人似乎都知道什么是风险；我们都必须不断识别风险并管理它们，否则在失败时承担后果。当我们开车、服药、决定假期、做出职业选择、选择金融投资，甚至当我们陷入浪漫恋情或与心爱的人结婚时，我们都在识别风险并管理它们。\n\
  \n### 8.2.1 风险的基础\n\n这是一个生活事实——我们都知道什么是风险，甚至将其作为父母共同教育的一部分传教给孩子。也许我们甚至可以说，没有风险，生活将变得极其无聊且毫无意义。那么，为什么要再次强调风险是什么，而不是立即关注云风险管理的最新进展呢？因为另一个事实是，风险的概念并没有被明确地理解，没有达成广泛的共识，最重要的是，它往往取决于上下文。简而言之，每当我们试图解释什么是风险时，我们总是挣扎于找到一个良好的通用描述，并转而求助于经验中的轶事和案例。技术文献中也是如此：风险有多种定义方式，这些定义往往是互不可调和的（即即使在国际标准之间，我们也能找到冲突的风险定义）；它经常被过度简化以获得一个方便的操作定义（即一个可以放入算法的方便公式），而且往往忽视了风险的内在特征：没有不确定性就没有风险，而在处理风险时，不确定性是不可约的（这并不是说不确定性和风险不能被缓解或管理；当然可以——但无论应用什么技术、管理方法或控制手段，在大多数情况下都无法消除）。\n\
  \n此外，风险的定义在不同的上下文中会有。例如，如果目标是分析不确定性对财务投资的影响，风险的定义通常不分正负。在其他上下文中，学者和分析师将风险分为危害或机会，前者意味着负面结果，后者意味着正面结果\
  \ [1]。计算机科学和信息安全的典型做法是将风险视为严格的负面结果，例如由系统故障、断开、故障、编程错误或破坏导致的结果。在其他领域（如自然管理）也是如此。通常，当我们处理安全问题时，风险具有严格的负面意义；当考虑投资时，它是与正负无关的\
  \ [6, 7]]。传统的决策模型，例如 20 世纪 40 年代的冯·诺伊曼和莫根斯坦期望效用模型 [8]并未考虑损失或负面结果，因为这会让负责方的处境比什么都没有还要糟。相反，特沃斯基和卡尼曼在\
  \ 20 世纪 70 年代的前景理论引入了相对于参考点的相对收益或损失 [9[10–11]。\n\n### 8.2.2 信息安全中的风险定义\n\n考虑到信息安全，我们可以找到不同风险定义的的相关示例。2011\
  \ 年的 NIST 特别出版物 800-39《信息安全风险管理：组织、任务和信息系统视角》将风险定义为：“衡量实体受潜在情况或事件威胁的程度，它通常是 (i)\
  \ 如果该情况或事件发生将产生的负面影响，以及 (ii) 发生的概率的函数” [12]。2012 年的 NIST 特别出版物 800-30 修订 1 版《进行风险评估的指南》也给出了相同的定义\
  \ [13]。\n\n考虑这些定义在 10 年间是如何变化的是非常有趣的。事实上，2002 年发布的 NIST 特别出版物 800-30 第一版 [14]] 将风险与\
  \ IT 相关风险视为同义词，后者被定义为：“考虑到 (1) 特定威胁源行使（意外触发或蓄意利用）特定信息系统漏洞的概率，以及 (2) 如果这种情况发生将产生的净任务影响。”IT\
  \ 相关风险由于以下原因导致法律责任或任务损失：\n\n1. 信息的未经授权的（恶意或意外）泄露、修改或破坏\n2. 无意错误和遗漏\n3. 自然灾害或人为灾害导致的\
  \ IT 中断\n4. 在 IT 系统的实施和操作中缺乏尽职尽责\n\n\n\n\n在 IT 领域，自从第一批引入风险相关因素的文章出现以来，现在几乎无处不在，人们认为一个事实：风险应该由可能性/概率与后果/影响的结合来定义。例如，云安全风险评估的主要框架之一\
  \ `QUIRC` \\[15\\] 认为风险意味着概率与影响的结合。一些人通过添加其他参数对这一基本定义进行了详述，但逻辑并未改变。值得注意的是，定量风险分析（或称为概率风险分析）的专家们几乎一意见一致地认为这种表述方法从根本上是错误的；正如许多评论和文章中反复强调的那样，风险不是一个公式，更不是一个数字。我们将在下一节进一步阐述这一点。\n\
  \n### ISO-IEC 和 NIST 的视角\n\nISO-IEC 世界在定性上与 NIST 的情况并没有区别：风险的定义在多年不断演变，在某些情况下采取了不同的路径。让我们首先考虑\
  \ 2005 年第一版 `ISO/IEC 27001`《信息技术 – 安全技术 – 信息安全管理体系规范》标准 \\[16\\]以及 2013 年修订版 \\\
  [17\\]。在 `ISO/IEC 27001:2005` 中，风险没有被正式定义；该术语经常在使用，即使在其他定义中也是如此（例如，“剩余风险`[是]`风险处理后剩下的风险”），但它被隐含为众所周知。\n\
  \n相反，`ISO/IEC 27001:2013` 引用了 `ISO/IEC 27000:2009`《信息技术 – 安全技术 – 信息安全管理体系 – 概述与术语》\
  \ \\[18\\],，该标准为整个 27000 系列 ISO 标准正式设定了术语。在那里，风险再次被定义为“事件概率及其后果的结合”。`ISO/IEC 27001:2013`\
  \ 明确提到“风险与机遇”；因此，我们可以推导出风险仅适用于负面影响。\n\n### ISO 31000 方法\n\n然而，当考虑到另一个标准时，情况变得特别有趣了：`ISO\
  \ 31000`《风险管理 – 原则和指南》（首次于 2009 年发布，随后于 2018 年更新 \\[19\\]），顺便说，它与近期云安全风险管理领域的提案最为相关。该标准引言的第一段这样写：“各种类型和规模的组织面临内部和外部因素的影响，这使得它们是否以及何时实现目标变得不确定。这种不确定性对组织目标的影响就是‘风险’。”\n\
  \n值得注意的是，这里的风险是“不确定性对目标的影响”，这代表了对所有之前定义的意外偏离，显然呼应了早期基于不确定性的普遍性和损害程度的风险分析研究，而不是提供一个操作性的、基础的公式，将不确定性仅仅埋没在负面事件的概率/可能性中。在风险分析的一篇性论文\
  \ \\[5\\] 中，Kaplan 和 Garrick 定义了 `risk = 不确定性 + 损害` 以及 `风险 = 危险/防护`。这些是风险的有趣公式化，但它们仅旨在用于推理的符号表达式，而不是操作性公式，后期应用于\
  \ IT 领域的风险分析似乎忽略了这一关键区别。\n\n在这方面，一个有用的评论（以及批评）来自著名的风险分析学者 Terje Aven \\[20\\]。一方面，他注意到\
  \ `ISO 31000` 的风险定义中，不确定性取代了概率，这是一个很好的选择，因为概率是衡量或描述风险的一种。Aven 继续写道，测量理论的一个基本原则是区分概念与如何衡量或描述该概念。概率是衡量风险最相关的工具，它有自己的优缺点，而不是风险本身，而且存在其他替代方案。这一点很少被记起。\n\
  \n另一方面，Aven 观察到，`ISO 31000` 的风险定义存在歧义。其是“目标”的确切性质。它指的是预期的吗？遵循这些观点，分析学会（Society of\
  \ Analysis，代表了对风险感兴趣的最大的国际跨学科协会）依赖于其自身的《风险分析》[21\\]和《风险原则》[22\\]。从实践来说，IT 领域很少有人熟悉\
  \ SRA（系统风险分析）。语言和意义上的另一个差异由 Open Group 很好的描述，他们通过考虑不同的专业领域如何形成自己的风险观点：“如果一个业务经理倾向于将‘威胁’认为是可能导致损失且该业务在不严重损害其交易地位的情况下无法吸收的东西”，而技术人员却认为是[任何能够导致对资产和或组织造成损害的行为；例如，天灾（天气、地质事件等等）；恶意行为者；错误；故障]’”，那么我们应该意识到在这两个类别之间的交流存在大量的误解空间。\n\
  \n总结来说，对于研究和从事相关主题的学科和专业人士来说，格局是碎片化的；实践领域（特别是 IT 领域）脱离了传统风险分析的主流；而受工业过程管理启发的国际标准，似乎在简化概念以及最终简化风险问题的内在性方面出现了偏差。\n\
  \n### 8.2.3 风险定量模型\n\n风险分析的第二个支柱是定量风险分析（QRA）的定义以及它与定性方法的区别。再次，这似乎显而易见，但事实是，这是一个长期的歧义之源，特别是在\
  \ IT 领域，因此云安全风险也是如此。许多关于云安全风险的最新提案似乎都在定量与定性的区别上挣扎，经常混淆概念，有时试图将它们模糊在一种没有合理定义的、被称为“半定量”的模糊混合体中。在继续之前，我们需要澄清这些概念，并解释为什么这样做很重要。\n\
  \n\n\n\n\n为了阐明这一问题，George Apostolakis -在 \\[24\\] 根据 `QRA` 在复杂技术系统安全决策中的应用背景提出了一个基础性贡献。安全分析通常是一个自下而上的过程，从识别故障（历史性的或假设性的）开始，然后考虑其后果。如果故障后果被认为是不可接受的，则将采取措施来降低其发生概率（通常不知道定量上具体降低了多少）或减轻其潜在后果。简而言之，这代表了现代风险管理标准中详述的风险评估过程的核心，它与旧式安全分析的区别仅在于推论和某些背景。因此，`QRA`\
  \ 按照以下通用步骤进行：\n\n1. **终态（End states）**：识别故障的负面后果（在典型的信息安全术语中称为“威胁”）。\n2. **启动事件（Initiating\
  \ event）**：对于每个终态，开发一组启动事件（例如对正常操作的干扰、错误、攻击），这些事件如果不加管理，可能会导致终态的发生。\n3. **事件树和故障树（Event\
  \ and fault trees）**：从逻辑上识别从启动事件开始并结束于终态的事件序列（例如通过图表）。\n4. **事故场景（Accident scenarios）**：这些场景应通过事件树和故障树（或其他逻辑表示法）得出，并可能包括硬件故障、人为错误和自然现象。共因故障的识别以及系统与组件故障之间的依赖关系，是这些事故场景的关键。\n\
  5. **不确定性与概率（Uncertainty and probabilities）**：必须对不确定性进行评估和量化。实现此点的工具是评估与事故场景相关的概率。概率评估使用了所有可用证据，包括部分和不完整的信息、过去经验的低质量数据以及专家判断，并且可以是频率派概率或主观概率。在概率论被认为不合适的情况下，存在其他方法，例如有时对于认知不确定性，使用区间分析。\n\
  6. **排序标准（Ranking criteria）**：根据预期发生频率对事故场景进行排序。\n\n步骤 5 是 `QRA` 的关键，如果没有使用科学的、概率或随机的方法对不确定性进行形式化的量化，任何风险评估方法都不能称为风险评估（更不用说是那些模糊且无意义的形式，如半定量形式）\
  \ \\[25\\]。许多 IT 和云相关的风险管理建议忽视了这一基本方面，而这显然不仅是一个术语问题，而是方法论问题。很容易找到一些自称为“定量”的建议，这可能是为了表现得严谨，但实际上它们基于纯粹定性方法，没有对概率进行任何评估，有时仅仅因为用数字刻度列出风险类别而非命名类别这一事实，就声称其具有定量性。同样，信息安全领域的风险经理经常假设无法进行定量风险分析，因为数据稀缺、不完整，或由不可靠的历史数据集提供。事实上，这些恰恰是概率论在风险分析中更适用的情况\
  \ \\[26\\]。这种误导性地使用定性风险方法的一个不幸例子，可以在 ENISA 针对中小企业的云安全指南中找到 \\[27\\]。该报告利用风险矩阵——这是最常用的定性风险评估方法之一，因其简单且具有良好的视觉效果，也是最容易被误导的方法之一。风险矩阵作为风险评估工具具有许多局限性，正如几项分析中所述\
  \ \\[28 [](#chapter8.xhtml#re_TNF-CH008_CIT00029)–30\\]。除了所有定性风险方法共同包含的局限性说明外，风险矩阵的一个理论属性在风险分析领域被广泛讨论，并证明对于在风险矩阵的定性风险评估与相应的、假设的定量评估之间提供至少部分部分的连贯性是有用的。简而言之，定量风险分析的著名学者\
  \ Anthony Cox 定义并正式证明了赋予风险矩阵重要属性的某些公理，被称为“弱一致性”（weak consistency） \\[31\\]。其原理是为方法论上稳实的、概率性的\
  \ `QRA` 提供至少少量的客观性和一致性。一个遗憾的事实是，ENISA 中小企业的云安全指南 \\[27\\] 未遵循弱一致性属性。该指南所示的风险矩阵（即第\
  \ 12、35、40 页）都表现出最基础的逻辑错误，这些错误使得风险矩阵不是弱一致的，反而是与定量评估是一致的，因此在对不同风险进行排序时完全具有误导性。与风险分析方法讨论逻辑相关的是“以风险为参考的”（risk-informed）决策与“基于风险的”（risk-based）决策之间的区别，以及前者更重要的作用\
  \ \\[24\\]。再次，这种源自风险分析经验的知识在信息安全学科中似乎没有坚实的基础，在该学科中关于风险评估目的和范围的不准确陈述屡见不鲜。正如 Apostolakis\
  \ 所言：“QRA 结果绝不是决策小组的唯一依据。换句话之，与安全相关的决策是以风险为参考的，而不是基于风险的。”这再次似乎是显而易见的，但在实践中并非如此。相反，在信息安全领域，不常见这样的项目：假设风险评估过程应直接驱动决策，可能是以自动算法的方式。例如，基于标准指标（如\
  \ `CVSS` \\[32\\]）为软件漏洞关联风险值的建议，或者是漏洞评估工具与自动修复操作相结合的集成框架。在所有这些情况下，都应该明确这种方法仅在时间紧迫和紧急情况下才是合理的，或者相反，适用于最微小的情况。\n\
  \n## 8.3 云系统的风险管理\n\n关于云安全风险管理，一些研究和建议首先考虑了影响云解决方案但属于网络化和去中心化系统通用安全风险的风险。另一些则专门考虑云计算风险。这种区分的原理很明确：不要重复轮子，因为我们可能已经有了对于云系统的通用安全风险分析和解决方案，反之，我们需要分析如何应对新问题。\n\
  \n\n\n\n文献所给出的答案并非完全统一，尽管它似乎已经最终确定了：许多传统的安全威胁（例如与身份验证、机密性和完整性相关的威胁，以及软件漏洞）并没有真正改变我们面临的问题；而另一方面，确实存在一些通常与云服务的“即服务”属性相关的问题，这些问题需要新的解决方案来解决\
  \ [33]。在接下来的章节中，我们将总结当前研究和争论的最新水平，首先讨论并非云系统特有的安全风险，然后转向特有的风险；我们还将讨论与从传统架构向云基础架构迁移过程相关的风险和建议、服务水平协议（SLAs）的中心性及其向更具风险意识的定义的演进、标准和准则在建立通用管理实践中的作用，以及更具挑战性的云供应链问题。\n\
  \n### 8.3.1 并非云计算特有的安全风险\n\nChen、Paxon 和 Katz [34] 在于 2010 年分析了影响云计算环境的安全问题，并将他们的报告命名为《云计算安全新何何？》，这表明答案并非显而易见，而且可能在频繁发布云计算带来的新安全威胁的公告中存在某种程度的过度炒作。相反，正如作者所声明的：“我们认为，很少有云计算安全问题从根本上来说是全新的或无法解决的；很多时候，所谓的‘新’仅仅是相对于过去几年的‘传统’计算而言。”\n\
  \n因此，在评估云计算的安全以及风险问题时，首要任务应该是排除那些并非云计算特有、且已经有了已知并可行的成熟解决方案或应对措施的问题。十多年后，对云安全问题的理解有所提高，但过度炒作的倾向并未消失。\n\
  \n让我们考虑 NIST 对云计算的定义 [35]，这是被引用次数最多的定义之一：\n\n它包含五个基本特征：\n\n-   按需提供服务\n-   网络服务\n\
  -   资源池化\n-   快速弹性\n-   可计量服务\n\n对于客户而言，这种模型几乎总是通过基于 Web 的远程配置接口实现的。该设置过程可能会受到与\
  \ Web 应用程序、远程通信以及误配置（无论是无意还是故意的）相关的传统问题的影响。可能会发生事故（而且确实发生过）[36 [](#chapter8.xhtml#re_TNF-CH008_CIT00037)–38]，但从分析的角度来看，其原因不应特指归咎于云计算。考虑到云提供商，它可能会遇到所有\
  \ IT 平台和基础设施典型的安全问题，如数据不一致、备份失败、网络中断、断开以及系统管理员的错误。对于这些威胁，必要的网络保护、业务连续性和灾难恢复、用户授权和身份验证与所有数据托管提供商都是相同的。\n\
  \n### 8.3.2 采用云计算的风险\n\n尽职调查往往被发现是主要威胁之一。组织评估风险的方法之一是影响评估（BIA）。Cayirci 等人 [39] 最近提出的一个名为云采用风险模型（CARAM）的建议非常有意思，它尝试将一些独立的内容整合起来，并符合欧洲网络和信息安全局（ENISA）\
  \ [40] 和云安全联盟（CSA）的建议：\n\n-   云服务客户（CSCs）\n-   云评估问卷（CAIQ）\n-   云控制矩阵（CCM）\n\nCSA\
  \ CAIQ [41] 是一个为云服务提供商（CSPs）准备的用于记录其安全覆盖范围的问卷。许多 CSP 回答的问卷可以在 CSA 安全、信任和保证注册表（STAR）中公开\
  \ [42]。CAIQ v3.0 被组织为 133 个控制域，每个控制域都包含一个控制规范和一个或多个共识问题。这些控制域被分为 16 个类别，列于表 8.1](#chapter8.xhtml#T8.1)\
  \ 中。在表 8.2](#chapter8.xhtml#T8.2) 中，为了演示，展示了控制域、规范和共识问题的示例。\n\n#### 表 8.1 CAIQ v3.0\
  \ 中的控制域列表\n\n| ID | 控制域 |\n| :--- | :--- |\n| 1 | 应用与接口安全 |\n| 2 | 审计保证与合规性 |\n\
  | 3 | 业务连续性管理与运营弹性 |\n| 4 | 变更控制与配置管理 |\n| 5 | 数据安全与信息生命周期管理 |\n| 6 | 数据中心安全 |\n\
  | 7 | 加密与密钥管理 |\n| 8 | 治理与风险管理 |\n| 9 | 人力 |\n| 10 | 身份访问管理 |\n| 11 | 基础设施与虚拟化安全\
  \ |\n| 12 | 互操作性与迁移性 |\n| 13 | 移动安全 |\n| 14 | 安全事件管理、电子取证与云取证 |\n| 15 | 供应链管理、透明度与问责制\
  \ |\n| 16 | 威胁与漏洞管理 |\n\n#### 表 8.2 CAIQ v3.0 中控制域、规范和共识问题的示例\n\n| 控制域 | 控制规范 |\
  \ 共识评估问题 |\n| :--- | :--- | :--- |\n| 身份访问管理 | 实用程序访问 | 能够绕过系统、对象、网络、虚拟机和应用程序控制的实用程序应受到限制。\
  \ | 是否对可以管理虚拟分区（例如关机、克隆）的实用程序进行了适当的限制和监控？ |\n| | | 是否有能力检测直接针对虚拟基础设施的攻击（例如 shim、Blue\
  \ Pill、超视跳转）？ |\n| | | 是否通过技术控制阻止了针对虚拟基础设施的攻击？ |\n\n\n\n\n\n## 基础设施与虚拟化安全\n\n##\
  \ 审计日志/入侵检测\n\n| | |\n| :--- | :--- |\n| 审计日志的保护、保留和生命周期管理需要更高水平保证，遵守相关的法律、法规或监管合规义务，并提供唯一的用户访问追责机制，以检测潜在的可疑网络行为和/或文件完整性异常，并在发生安全漏洞时支持取证调查能力。\
  \ | 是否实施了文件完整性（主机）和网络入侵检测（IDS）工具，以有助于及时检测、通过根因分析进行调查以及对事件做出响应？ |\n| 审计日志的物理和逻辑访问是否仅限于授权人员？\
  \ |\n| 您是否能提供证据，证明已对法规和标准与您的控制/架构/流程进行了尽职调查映射？ |\n| 审计日志是否集中存储并保留？ |\n| 是否定期审查审计日志以检查安全事件（例如，使用自动化工具）？\
  \ |\n\n关于 ENISA（欧盟网络安全局）指南，已发布了多项与云计算相关的指南。`CARAM` 的作者将其 2009 年的文件作为其支柱之一（该文件目前\
  \ 2012 年的 `Rev. B` 版本 `[40]` 可用），这仍然是被引用最多的云计算安全风险分析。ENISA 两个版本指南的作者付出了巨大努力来指出云特定的风险，例如承认管理和合同问题对云计算至关重要，并对其给予了极大关注。他们的列表混合了\
  \ `CSC` 和 `CSP` 风险，其中一些主要基于合同协议和信息系统治理（即治理丧失、由于共同租户活动导致的业务声誉损失、锁入、合规性、可审计性），另一些则纯是技术性的（例如数据的高冗余和动态重位，以及不安全或不完整的数据删除），还有少数结合了技术和管理方面（即所有与多租户相关的方面，如客户加固程序与云环境之间的冲突），还有一些并非特定于云计算（例如传输中数据或分布式拒绝服务）。\n\
  \nNIST 与 ENISA 指南相对应的文件是 `Special Publication 800-144 公共云计算安全与实践指南`，于 2011 年发布 `[44]`。虽然该指南非常全面且在许多方面与\
  \ ENISA 的分析相似，但在识别云特定风险方面，NIST 没有像欧洲机构那样精确和分类。其叙述更加详尽，讨论了许多传统的安全问题，有时与 NIST 的其他出版物重复。然而，两者都强调了一类关键风险：隐藏在\
  \ `SLA`（服务等级协议）规范中的风险。以下是 NIST 作者的说法：\n\n> 这是一个关键点，直到今天它仍然是关于云风险许多研究、报告和讨论的主题。我们将检查一些使用特定\
  \ `SLA` 指标管理安全风险的最新建议。\n\n最近，ENISA 还发布了一篇关于云取证的短论文 `[38]`。由于云计算的许多特定特性，云取证比传统系统更难。多租户制可能跨越不同的司法管辖区和数据所有权；资源的动态分配；易失性数据和时间同步问题；数据删除程序（通常为了遵守数据隐私法规）；可访问性和可审计性降低（这是云系统的常态）；用户追责；以及\
  \ `CSPs` 缺乏协作，都是使云系统取证分析复杂的因素。例如，Keller 和 König 在 `[45]` 中强调，对云提供商底层网络结构的了解匮乏是准确识别云特定风险的最严重障碍之一。在\
  \ `[46]` 中展示了一个案例研究的介绍性分析。\n\n考虑到云计算的多租户特性，它导致了全方位的新威胁。在 `[47]` 中，共享资源环境被利用以允许共址虚拟机之间存在侧信道和隐蔽信道；而在\
  \ `[34]` 中，多租户制可能导致“命运共同体（fate-sharing）”。命运共同体在两个事件中有所体现：第一个是由于拒绝服务攻击导致可用性丢失而声誉损害（例如，假设对于某服务）；第二个是刑事调查后根据法律要求没收设备。\n\
  \n### 8.3.3 云计算的风险评估标准\n\n将国际标准作为 IT 安全的优选方法之一在过去十年中受到了越来越多的关注。这一十年见证了诸如在 20 世纪\
  \ 90 年代末和 21 世纪初建立的 `ISO 27001` `[16]]` 以及其前身 `BS 7799/ISO 17799` `[48]]`，并持续至今。在关于云风险的最新建议和研究中，有一个标准变得格外突出：`ISO\
  \ 31000`，第一版于 2009 年发布，第二版于 2018 年发布 `[19]]`。例如，前述用于选择 `CSPs` 的 `CARAM` 风险评估模型 `[39]]`\
  \ 在设计时考虑了 `ISO 31000` 的风险评估过程，以及微软的云风险决策框架 `[49]]`。后者特别具有相关性，不仅是因为其影响力的来源，还因为它明确指出存在一个应以云风险评估为依据的决策过程，而后者的方法论模型正是\
  \ `ISO 31000` 标准。在图 8.1 中，展示了 `ISO 31000` 的示意图，并描勒了一个阶段的输出如何成为后续阶段的输入。`识别（Identify）`、`分析（Analyze）`和`评估风险（Evaluate\
  \ Risks）`构成了风险评估的逻辑步骤链，根据更新/细化标准，这种评估可能是循环的，该标准用于评估风险评估结果是否足够精确，以指导风险处理解决方案的选择（`处理风险（Treat\
  \ risks）`阶段），以及完成整个风险管理过程的最终 `评审/决定（Review/Decide）` 阶段。\n\n![图 8.1 ISO 31000 风险管理过程示意及包含的风险评估](img/fig8.1.jpg)\n\
  \n微软的云风险决策框架根据定性评分建议了两个风险影响和概率的模板，并以概率范围和频率间隔的示例作为支持。定性评分与概率/频率之间的映射本质上是主观的，缺乏支持这种关联性的数据或模型，这在类似的定性方法中很常见，但总体而言，该方法是透明的，且理由充分。\n\
  \n\n\n\n\n云风险决策框架的结果汇总在一个表格中，其中包含了所有信息：风险类别（例如：合规、战略、运营以及市场和财务风险）、风险控制领域（例如：法律问题、数据保护、供应商锁定、供应链中断、备份失败、数据中心运营、声誉损失、容量管理）、风险发生的概率和影响（即根据云风险决策框架的建议，采用五级定性量表），以及基于从绿到红的典型颜色分级为每个控制领域规定的风险值。\n\
  \n云安全风险管理的另一项相关且近期的贡献是由云安全联盟（CSA）提出的[42]云控制矩阵（`Cloud Control Matrix`）。`CCM` 专门为提供基础安全原则以指导云服务提供商（CSP），并协助潜在的云服务客户（CSC）评估\
  \ CSP 的整体安全风险而设计。`CCM` 提供了一个控制框架，能够详细理解在 13 个领域中与云安全联盟指南一致的安全概念和原则。`CCM` 现在经常被云安全风险解决方案采用，并且是\
  \ `CAIQ` 的自然补充，两者均由上一节介绍的 CSA 生成。`CCM` 控制领域与我们在表 8.1 中显示的相同。每个领域与特定的控制措施和相关信息相关。在表\
  \ 8.3 中，我们展示了 `CCM v3.0.1` 的摘录，其中包含了“数据安全和信息生命周期管理”控制领域的三个控制措施及其相应的描述。\n\n### 表\
  \ 8.3 云安全联盟 CCM v3.0.1 的云控制措施示例\n\n| 控制领域 || CCM V3.0 控制 ID | 更新后的控制规范 |\n| ---\
  \ | --- | --- |\n| 数据中心安全 | 受控制的访问点 | `DCS-02` | 应实施物理安全围护（例如：围栏、墙壁、屏障、守卫、大门、电子监控、物理身份验证机制、接待台和安全巡逻），以保护敏感数据和信息系统。\
  \ |\n| 数据中心安全 | 设备识别 | `DCS-03` | 应使用自动化设备识别作为连接身份验证的方法。可以使用位置感知技术根据已知的设备位置验证连接身份验证的完整性。\
  \ |\n| 数据中心安全 | 场外授权 | `DCS-04` | 在硬件、软件或数据迁移或传输到场外场所之前必须获得授权。 |\n\n在表 8.4 中，我们展示了\
  \ `CCM` 中与每个控制措施相关的信息列表。对于图 8.2 中所示三个控制措施（参考其控制 ID，见图 8.2），我们展示了信息在与特定控制措施相关时如何进行标记（例如，控制\
  \ ID `DCS-02` 对应“架构”，仅与“物理”相关，而控制 ID `DCS-03` 则与“物理”、“计算”、“存储”和“应用”相关）。\n\n### 表\
  \ 8.4 CCM 中每个控制措施的相关信息（包含三个示例）\n\n![](img/T8.4.jpg) ![图 8.2 带有 SLO 的云安全 secSLA 架构示例。](img/fig8.2.jpg)\n\
  \n图 8.2 带有 SLO 的云安全 secSLA 架构示例。\n\n### 8.3.4 云安全风险与服务水平协议\n\n在受监管的场景中，根据法律或合同义务，有时会简单地假设存在合同义务足以消除不确定性。遗憾的是，在现实世界中，当发生法律争议时，一切并不简单。这取决于措辞和细节。一个关键问题由\
  \ `SLAs` 代表，它是规范 CSC 与 CSP 之间云计算关系的手段。然而，与法律和商业合同一样，仅说将规定某些 `SLAs` 并不能解决不确定性和风险，因为这取决于这些\
  \ `SLAs` 具体规定了或未规定的内容。\n\n缺乏保证和透明度以及量化安全技术的匮乏，是 CSC（尤其是中小企业）对 CSP 的安全和管理质量产生不确定性和缺乏信心的重要原因[50\
  \  –52]。针对此，许多 CSP 实施了安全过程管理标准，如上一节所述，从基于 `ISO 31000` 的风险管理过程及其在信息安全领域的应用（即 `ISO\
  \ 27001`、`27002` 和 `27005`），到像 `CAIQ` 和 `CCM` 等 CSA 工具。尽管如此，每项云服务的关键部分（如果不是云计算最独特的特征）尚未适应紧迫的云风险需求：即以\
  \ `SLAs` 形式存在的、用于规范云服务的提供、数据处理、问责、责任等[53, 54]]。\n\n在[50]中，分析了一些云提供商的 `SLAs`。意乎意料的是，没有一家表现出足够的性能保证，而且检测\
  \ SLA 违规的负担始终落在客户身上。云计算 `SLAs` 中包含的典型 `QoS` 参数列在表 8.5 中。\n\n### 表 8.5 包含在云 SLA 中的典型\
  \ QoS 参数列表\n\n| SLA 参数 | 描述 |\n| --- | --- |\n| 服务保证 | 用于衡量一段时间内服务提供情况的指标（例如：可用性、响应时间）\
  \ |\n| 服务保证时间段 | 必须满足服务保证规定的持续时间（例如：一个计费月、自上一次索赔以来所过的时间、一小时） |\n| 服务保证粒度 | 指定服务保证的资源规模（例如：每个服务、每个数据中心、每个实例、每笔交易）；\
  \ |\n| 服务保证排除 | 排除在评估之外的实例（例如：客户滥用系统、计划维护导致的停机） |\n| 服务额度 | 违反保证时给予客户的积分金额（例如：全额或部分退还客户费用）\
  \ |\n| 服务违规测量和报告 | 如何以及由谁测量和报告违反保证的情况 |\n\n考虑到这个 SLA 参数列表，人们应该提醒，客户与云提供商谈判合同条款是一个罕见的可能性。常态是客户（特别是中小企业）没有谈判能力，而选择\
  \ CSP 是一个“要接受就离开”的选择。这通常导致 CSC 无法免受重要安全风险的保护，或者在报告 SLA 违规并寻求补偿或补救措施时面临紧迫的时间限制，这一事实使\
  \ CSC 承担了实施高效监控和报告程序的全部负担。\n\n\n\n\n再次在 `[50]` 中，作者考虑了一些知名的云服务提供商。它们都以某种方式保证了表 8.3\
  \ 中几乎所有的 QoS 参数，但合同条款差异巨大，而且通常看起来更像是一种形式化的而非实际保证。例如，考虑到服务额度，SLAs 通常非常复杂且不透明，使得很难在不同商业报价之间进行比较，也难以掌握从云服务客户（CSC）到云服务提供商（CSP）风险转移的效率。如果未达到特定的服务可用性阈值，违反\
  \ QoS 的补偿通常仅为客户账单的一部分（例如，如果可用性低于 99.95%，则补偿账单的 10%；每停机 30 分钟补偿账单的 5%，最高可达 100%）。相反，CSP\
  \ 的典型做法是在 SLAs 中规定，检测违规行为的责任应完全由 CSC 承担，并且允许索赔的时间窗口较短（例如，一个账单月，或自上次索赔起 30 个工作日）。总之，SLAs\
  \ 的主要局限性在于它们仅关注少数 QoS 参数，如服务可用性或请求完成率。\n\n对云服务安全日益增长的关注，是学者和从业务者对定义将安全需求纳入 SLA 的指南产生极大兴趣的原因，这通常被称为云安全\
  \ SLA，简称为 secSLAs。挑战在于开发用于规范云安全 SLA 的指南、标准和框架，使 CSC 与 CSP 之间的合同义务能够以透明平衡的方式，包含更多安全需求并更全面地涵盖安全功能\
  \ `[55]`。\n\n此方面的努力始于几年前，并且仍在持续。在 `[51]` 中，作者对基于 SLA 或面向安全的开源及商用云监控工具进行了详细调查。他们讨论的情况是：虽然存在许多工具，但尚未没有任何工具成为明确的标准，大多数工具仍处于成熟周期的早期阶段。\n\
  \n欧盟网络安全局（ENISA）发布了首批云安全监控指南之一，题为《云合约中安全服务水平监控指南》`[56]`。将参数纳入云安全 SLA 的列表，是首次尝试通过合同条款定义如何管理云计算服务中的安全风险。这看起来可能似乎不完整，但目前大多数真实的云\
  \ SLA 尚未涵盖这些内容。这些参数包括：\n\n* 服务可用性\n* 事件响应\n* 服务弹性与负载容忍能力\n* 数据生命周期管理\n* 技术合规性与漏洞管理\n\
  * 变更管理\n* 数据隔离\n* 日志管理与取证\n\n有趣的是，ENISA 引入的并非严格依赖于安全的参数，而是一份更通用的安全管理需求列表（例如，变更管理和日志管理比单纯的安全管理更通用，但显然对于其有效性至关重要，且是风险分析的基础）。此外，事件响应参数显示了之前未讨论过的额外特征，但该特征对于其有效性至关重要，是风险分析的基础。\n\
  \n### 云安全监控与指南\n\n这些参数看起来似乎不完整，但目前大多数真实的云 SLA 尚未涵盖这些内容。参数如下：\n* 服务可用性\n* 事件响应\n\
  * 服务弹性与负载容忍能力\n* 数据生命周期管理\n* 技术合规性与漏洞管理\n* 变更管理\n* 数据隔离\n* 日志管理与取证\n\n### SLA 参数与挑战\n\
  \n挑战在于开发用于规范云安全 SLA 的指南、标准和框架，使 CSC 与 CSP 之间的合同义务能够以透明平衡的方式，包含更多安全需求并更全面地涵盖安全功能\
  \ `[55]`。\n\n此方面的努力始于几年前，并且仍在持续。在 `[51]` 中，作者对基于 SLA 或面向安全的开源及商用云监控工具进行了详细调查。他们讨论的情况是：虽然存在许多工具，但尚未没有任何工具成为明确的标准，大多数工具仍处于成熟周期的早期阶段。\n\
  \nENISA 发布了首批云安全监控指南之一，题为《云合约中安全服务水平监控指南》`[56]`。将参数纳入云安全 SLA 的列表，是首次尝试通过合同条款定义如何管理云计算服务中的安全风险。这看起来似乎不完整，但目前大多数真实的云\
  \ SLA 尚未涵盖这些内容。参数包括：\n* 服务可用性\n* 事件响应\n* 服务弹性与负载容忍能力\n* 数据生命周期管理\n* 技术合规性与漏洞管理\n\
  * 变更管理\n* 数据隔离\n* 日志管理与取证\n\n有趣的是，ENISA 引入的并非严格依赖于安全的参数，而是一份更通用的安全管理需求列表（例如，变更管理和日志管理比单纯的安全管理更通用，但显然对于其有效性至关重要，且是风险分析的基础）。此外，事件响应参数显示了之前未讨论过的额外特征，但该特征对于其有效性至关重要，是风险分析的基础。\n\
  \n### 事件响应与风险分析\n\n事件响应参数显示了之前未讨论过的额外特征，但该特征对于其有效性至关重要，是风险分析的基础。\n\n\n\n\n## 治理与企业风险管理\n\
  \n组织治理和衡量由云计算引入的企业风险的能力。相关项目包括：协议违约的法律先例、用户组织充分评估云提供商风险的能力、当用户和提供者均可能存在过错时保护敏感数据的责任，以及国际边界如何影响这些问题。\n\
  \n### 法律问题：合同与电子取证\n使用云计算时可能面临的法律问题。本节涉及的问题包括信息和计算机系统的保护需求、安全违露泄露法、合规要求、隐私需求、国际法等。\n\
  \n### 合规性与审计管理\n在使用云计算时如何维护并证明合规性。这里讨论了关于评估云计算如何影响对内部安全策略的合规性，以及各种合规性要求（监管、立法等方面）的问题。该领域还包含了关于在审计期间证明合规性的某些指导。\n\
  \n### 信息治理\n对存储在云端的数据进行治理。这里讨论了围绕云端数据的识别和控制，以及用于处理数据迁移到云端时失去物理控制的补偿性控制措施。还提到了诸如谁负责数据的机密性、完整性和可用性等。\n\
  \n### 管理计划与业务连续性\n保护访问云时使用的管理平面和管理接口，包括 Web 控制台和 `APIs`。确保云部署的业务连续性。\n\n### 基础设施安全\n\
  核心云基础设施安全，包括网络、负载安全和混合云考虑。该领域还包括私有云的安全基础知识。\n\n### 虚拟化与容器\n虚拟机监控（hypervisors）、容器和软件定义网络的安全。\n\
  \n### 事件响应、通知与修复\n适当且充分的事件检测、响应、通知和修复。这些尝试旨在解决提供者和用户层面都应具备的项目，以便实现适当的事件处理和取证。该领域将帮助你理解云给当前事件处理程序带来的复杂性。\n\
  \n### 应用安全\n保护运行在云端或在云端开发的应用程序软件。这包括诸如：迁移应用程序或设计应用程序运行在云端是否合适，如果是，哪种云平台（`SaaS`、`PaaS`\
  \ 或 `IaaS`）最为合适。\n\n### 数据安全与加密\n实施数据安全和加密，并确保可扩展密钥管理。\n\n### 身份权限与访问管理\n管理身份并利用目录服务提供访问控制。重点在于将组织身份扩展到云端时会遇到的问题。本节提供了评估组织开展基于云的身份、权限与访问管理（`IdEA`）准备情况的见。\n\
  \n### 服务型安全\n提供第三方促进的安全保障、事件管理、合规证明以及身份和访问监督。\n\n### 相关技术\n与云计算有密切关系的既有技术和新兴技术，包括大数据、物联网和移动计算。\n\
  \n另一个与云安全风险管理相关的重要方面是云计算中的安全透明度问题 [61]。我们提到过，`CSPs` 在披露与其产品相关的安全信息方面缺乏透明度是云采纳的一个障碍。此外，它还阻碍了\
  \ `CSCs` 或第三方评估和审计云计算系统的可能性，并大大减少了实施有效的云安全 `SLAs` 自动执行的可能性。Ismail 等人 [62] 彻底分析了非透明\
  \ `CSP` 产品的后果，以及相反的对完全透明产品的需求。安全透明度有几个需要考虑的维度：可能是主动的（自愿的）、响应的（必要的）和合同的（法定的）——所有这些类别都是必需的。\n\
  \n在评估和审计云计算系统方面，这些关键功能已在研究中涉及，例如 [63 [](#chapter8.xhtml#re_TNF-CH008_CIT00064)–65]。安全和隐私评估与审计是评估内部系统风险和暴露的\
  \ ing 做法。对于云系统则并非如此，因为云系统的核心特征——多租户、按需服务和位置无关性——使得外部评估和审计变得极不实际且困难。`CSC` 在 `CSP`\
  \ 场所进行独立审计的权利仍然稀少，且绝不是中小企业（`SMEs`）的典型活动。即使在这种情况下，分析师也研究了哪些特定的云计算特性使得审计与传统系统相比不同，可能更加困难。\n\
  \n云安全 `SLAs` 的自动执行已得到研究，例如 Casola 等人 [66]。在这种情况下，安全透明度至关重要，因为为了自动执行安全 `SLAs`，这些必须以声明性和可衡量的术语明确地表达出来。声明性术语描述了受\
  \ `SLA` 保护的服务上所确保的标准安全控制，而 `SLOs`（即可衡量的术语）则通过与所声明的安全控制相关的指标来表示。\n\n### 8.3.6 面向供应链的云安全风险\n\
  \n在许多情况下，可以认为云服务比典型的传统对应更安全，因为多项调查已知并证明，企业网络中的信息安全水平差异巨大，特别是对于非 IT 部门的 `SMEs` 而言，水平往往低得惊\
  \ [67]。然而，前节已提到的云服务安全问题之一是难以验证，比传统背景更困难。在供应链的情况下，情况更为关键。\n\n为了澄清这一概念，云供应链可以定义为两个或多个共同共同提供、开发、托管、管理、监控或使用云服务的系统，每个参与方都面临内部和外部风险因素及影响，使得他们是否以及何时能实现业务目标变得不确定\
  \ [68 [](#chapter8.xhtml#re_TNF-CH008_CIT00069)–70]。因此，通过考虑供应链，`CSC` 与 `CSP` 之间合同关系的典型场景被扩大到更多的参与方和更多的合同关系，所有这些为了云供应链的运行和提供而连接。图\
  \ 8.3 显示了云供应链的典型组件 [69]。托管基础设施代表云架构的物理资源、基础设施和平台层；交付平台代表提供服务的平台设备；控制系统是管理整个云供应链多租户、复制和数据移动的框架。\n\
  \n![图 8.3 云供应链。(Images/fig8.3.jpg)\n\n\n\n\n\n# 图 8.3 云供应链。\n\nAkinrolabu 等人在 [69,\
  \ 70, ]] 中提出了一种新颖云供应链网络风险评估（CSCCRA）模型，其前提是：目前尚缺乏一种可用于识别、评估和管理云风险的结构化框架，而许多非结构化、主观且定性的方法层出不穷。当考虑到复杂的云供应链时，问题变得更加严峻，因为\
  \ `CSP` 提供的服务是来自不同 `CSP` 的不同服务的协调组合而成的。\n\n在此基础上，`CSCCRA` 模型基于三个基本因素：\n\n*   **定量风险评估**：在\
  \ `CSCCRA` 模型中，风险被表示为事件发生的概率及其后果的结合，该模型遵循类似于 `ISO 31000` 的结构化风险评估流程。该模型利用对风险因素（例如威胁频率、漏洞和损失规模）进行概率估计，将预测表示为一种分布。\n\
  *   **云供应商安全评估 (CSSA)**：`CSSA` 是一种决策支持系统，要求 `CSP` 向 `CSC` 提供服务，以感知其供应链以及供应链中涉及的其他\
  \ `CSP` 的可能弱点。`CSSA` 旨在作为一个正式流程，将云供应链分解为各个组件过程阶段，以评估供应商的安全风险。\n*   **云供应链映射 (CSCM)**：`CSCM`\
  \ 是一个提供端到端供应链可视化特征的框架，有助于评估云风险并识别薄弱环节。对供应链中固有风险进行图形化表示的益处在于消除风险估计和决策中的任何偏差。\n\n\
  总体而言，`CSCCRA` 模型旨在通过对过程中的所有主体和阶段进行全面分析来评估云供应链风险。其目标可以描述如下 [70]：\n\n*   了解云利益相关者对供应链风险的认知水平\n\
  *   捕获涉及云供应商选择的决策过程\n*   识别云服务提供者和消费者环境中采用的传统风险识别/评估方法\n*   识别导致云计算中供应链风险的因素\n\n\
  总结来说，`CSCCRA` 模型是云安全风险管理领域最新且野心勃勃的提案之一。与过去几年提出的其他模型相比，它的目标更加全面，并且考虑了“云供应链”这一场景，该场景比传统的云计算案例具有更高程度的复杂性和难度。这似乎是一个值得遵循的方向，它更地意识到了定性风险评估的局限性，并关注于更复杂的服务提供模型。另一方面，就建立一个可操作、经过测试且适用的云风险管理参考框架这一目标而言，它仍然是一个处于早期阶段的模型。\n\
  \n## 8.4 总结\n\n本章讨论了云安全风险管理，这是一个在信息安全泛领域被广泛讨论的话题，因此在云计算领域中也如此，尽管它具有若干特殊性。尽管该问题并不新，但整体场景在不断变化，在过去的五年里，改进是有限的，且在业界、学术界和\
  \ IT 专业人士中获得接受的速度非常缓慢。关于 IT 领域安全风险的讨论和建议通常在方法论上仍然不成熟且具有高度主观性。尽管如此，云安全风险管理问题正受到许多学者和专业人士的积极分析，尽管项目和提案仍处于原型阶段和开发早期，但其范围已变得更加全面，专注于更复杂的场景（例如云供应链案例就是典型的代表），并且更加具体详细——正如关于云安全\
  \ `SLAs` 的工作所示的那样。随着云服务的日益普及，积累了更多的经验；真实的案例研究；以及对威胁、风险和管理方法的了解也更加深入。\n\nAkinrolabua\
  \ 等 [71] 最近发表了一篇关于云风险评估模型最新现状优秀综述。在那里，除了概述最相关的模型外，作者还试图描述云计算服务在安全风险管理方面的未来需求。正如\
  \ Casola 等人 [66] 所承认的，一个重要性日益增长的方面是对 `SLAs` 进行自动化评估的需求，而透明度是一个前提，但这一点并不总是实现。在未来的云服务中，云供应链的成员（例如共同构成供应链的\
  \ `CSPs`）应该对风险和漏洞进行动态监控，并决定动态修复。这一目标因其潜在益处非常有吸引力，但需要质量更好的云风险方法论，而这不能是目前主要采用的定性类型。此外，还需要对云环境进行结构化分析，并使用供应链的形式模型来描述组件之间的相互依赖关系，表示不断进化系统的动态，并评估修改、故障、中断或错误的结果。此外，未来的云安全风险管理模型和方法论不应仅涵盖安全事件的技术后果；应该包括对业务的影响，而且对人类（即客户、员工、社会）、伦理和环境的影响必须比过去更加认真考虑。\n\
