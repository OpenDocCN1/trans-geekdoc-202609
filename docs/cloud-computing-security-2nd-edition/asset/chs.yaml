  - 25.2.2 对可信计算的一些批判\n- 25.2.3 一些 TEE 的用例\n- 25.3 TPM 实现\n- 25.3.1 ARM Trustzone\n\
  - 25.3.2 AMD 安全处理器\n- 25.3.3 Intel SGX\n- 25.4 可信计算与云\n- 25.5 云中的安全元素\n- 25.5.1\
  \ 主机卡模拟\n- 25.5.2 容器作为安全解决方案\n- 25.6 相关工作\n- 25.7 总结\n- 参考文献\n\n## 25.1 引言\n\n云计算（见[图\
  \ 25.1]）在扩展性、维护成本和灵活性方面为组织（提供者和用户）带来了许多好处。然而，由于安全和隐私担忧，潜在的云服务供应商和用户对采用云计算仍持怀疑态度。可信执行技术在旨在代码执行和优质内容访问控制的异构领域日益成功，尽管与此类技术相关的某些关键问题已开始显现——正如本章讨论的那样。\n\
  \n![图 25.1 相关的云计算架构组件。（来自 Sam Johnston, Cloud computing. Wikimedia Foundation, San\
  \ Francisco, CA, 2013. 经许可使用。）[3]](Images/fig25.1.jpg)\n\n图 25.1 相关的云计算架构组件。（来自\
  \ Sam Johnston, Cloud computing. Wikimedia Foundation, San Francisco, CA, 2013.\
  \ 经许可使用。）[[3]]\n\n云通信环境是基于互联网的，即资源、软件和数据是按需提供的，用户对所采用资源的信任程度几乎没有或完全没有有效控制。云计算主要基于在独立分布的服务器和单个客户端之间共享资源。这种共享通过控制/调解客户端对存储的文件和数据的访问来实现。潜在的云消费者由于安全和隐私担忧，仍犹豫于采用云计算，因为通过使用云服务，用户将\
  \ IT 操作的控制权交了出去。特别是服务提供的非功能性方面会影响服务的可信度。然而，平台提供商可以利用和服务数据复制来提供更高的服务质量（QoS）和更稳健的安全标准，并可以通过\
  \ SLA 进行监管 [[1]]。在其他利益相关者中，云安全联盟（CSA [[2]]，其使命是促进使用提供安全的最佳实践）为云提供者和客户提供了简化安全的工具。特别是，可以遵循\
  \ CSA 安全模型来防止入侵者篡改数据。在共享环境中保障安全和信任是基础。在修订和更新后的章节中，我们专门探讨了具有长期历史（并取得部分成功）的安全代码执行和优质内容访问的可信执行技术。我们还突出了容器等极具前景的技术以及此类方法引入的安全问题。此外，我们深入研究了此类技术的现状，并讨论了它们在云中的用法。最后，我们讨论了它们对云计算的影响和收益。\n\
  \n## 25.2 技术背景\n\n可信计算（TC）技术旨在强制真实性，从而减少计算机硬件和软件出现错误和恶意行为的可能性。这些目标将通过在硬件中插入唯一的加密密钥来检查软件和硬件的完整性来实现。在理论上，无法篡改此类密钥以及此类系统的输入/输出。\n\
  \nIntel、AMD 和 ARM 提出了多种可信计算架构技术，并得到了 MS Windows（服务器、桌面和移动版）、Apple OsX 和 Google Android\
  \ 等操作系统的支持。特别是在移动端，可信执行环境（TEE [[4]]）是可信平台模块（TPM）的最新实现（见[图 25.2]）[[5]]，主处理器的安全区域被保留用于检查其他组件和软件的可信度。\n\
  \n![图 25.2 可信平台模块的架构。（来自 Guillaume Piolle, TPM, Wikimedia Foundation, San Francisco,\
  \ CA, 2013. 经许可使用。）[6]](Images/fig25.2.jpg)\n\n图 25.2 可信平台模块的架构。（来自 Guillaume Piolle,\
  \ TPM, Wikimedia Foundation, San Francisco, CA, 2013. 经许可使用。）[[6]]\n\nTEE 旨在保证代码和数据的机密性和完整性，因为它提供了一个孤立的执行环境，在该环境中可以检查应用程序的完整性，还可以确保其数据的某种机密性。TEE\
  \ 提供了一个执行空间，提供了比传统操作系统更高级别的安全性，以及比安全元素更多的功能。\n\n\n\n\nTEE 被定义为一组硬件和软件组件，为支持必须满足两个定义的安全级别之一的的应用程序提供必要的设施：\n\
  \n*   配置 1：针对软件攻击\n*   配置 2：针对软件和硬件攻击\n\nTEE 是一个与主操作系统并行运行的隔离环境，为功能更丰富的环境提供安全保障。它比主操作系统更安全，并且比\
  \ SE 提供更高层次的功能，采用了一种结合硬件和软件的混合方法来保护数据 [4]。TEE 提供的安全级别允许经过许可的应用程序几乎拥有对设备主处理器和内存的完全访问权限。尽管如此，TEE\
  \ 硬件隔离机制可以防止运行在主操作系统中的用户安装程序。TEE 此外声称可以保护受信应用程序免受相互干扰。\n\n### 25.2.1 可信计算——核心概念\n\
  \n可信计算（TC）概念至少在过去的三十年里为人知。因此，不同的实现方式和特征描述了其随时间的演变。尽管如此，我们可以说 TC 确实包含了一些关键技术概念 [7]：\n\
  \n*   终端密钥（Endorsement key）：它是一对公私钥。在制造时随机创建并存储在芯片硬件的受保护区域中。私钥无法更改且永远离开芯片。公钥用于证明以及对发送到芯片的敏感数据进行加密。\n\
  \n*   内存屏帘（Memory curtaining）：它应该对敏感内存区域提供完全隔离，即使是设备操作系统也不应具有完全访问权限。\n\n*   密封存储（Sealed\
  \ storage）：它应该通过将隐私信息绑定到平台配置信息（包括正在使用的软件和硬件）来保护隐私。它通常用于执行数字版权管理（DRM）。\n\n*   远程证明（Remote\
  \ attestation）：它应该允许授权方检测计算机数据或代码的变化，即使是远程的。基本思想是让硬件生成一个证书，说明当前正在运行什么软件。然后计算机可以将此证书提交给远程方，以证明当前执行的是未篡改的软件。\n\
  \n*   可信第三方（Trusted third party）：为了在提供可信平台的同时尝试保持匿名性，可以使用可信第三方作为用户与其自有计算机之间、以及用户与其他用户之间的中介。\n\
  \n### 25.2.2 对可信计算的一些批评\n\n可信计算引发了一些争议，因为所采用的机制能够保护硬件不仅是为了其所有者的利益，还可以防止所有者的攻击。也就是说，正如理查德·斯尔曼\
  \ [8] 所提到的，这种方式防止了用户自由选择运行在其硬件上的操作系统和软件应用程序的类型。此外，在硬件中插入唯一密钥可能会破坏互联网能提供的匿名性保证。一方面，TC\
  \ 支持者声称这种技术可以帮助防止病毒和恶意软件。另一方面，TC 实际上大部分用于执行数字版权管理策略。\n\n### 25.2.3 TEE 的一些用例\n\n\
  如前所述，TEE 特性在移动环境中特别有用，TEE 可以防止未经授权的访问。其用例广泛，包括：\n\n*   身份验证：TEE 可以支持生物识别认证（例如人脸识别）[7]。\n\
  \n*   安全交易：TEE 对金融交易特别有用。\n\n*   防盗版：TEE 可以在传输期间保护优质内容 [8]。\n\n*   BYOD 安全（自带设备安全）：TEE\
  \ 帮助确保敏感信息的安全处理 [9]。\n\n## 25.3 TPM 实现\n\n本节调查了近期架构对可信平台的支持。在过去的几年中，实现工作量很大。\n\n\
  ### 25.3.1 ARM Trustzone\n\n作为 TrustZone 营销的安全扩展提供了两个由硬件访问控制支持的虚拟处理器。这使得应用程序内核可以在两种状态之间进行切换，以防止信息从更可信的环境泄漏到较不可信的环境。该环境对处理器的所有其他功能都是透明的，而内存和外围设备则会感知操作系统环境。\n\
  \nARM TrustZone 通过将 CPU 划分为两个“世界”（如图 25.3 所示）创建一个安全环境。敏感任务在“安全世界”中运行——而其他任务在标准模式下运行。这有助于敏感数据的安全存储和处理。它还保护了关键资源的完整性和机密性，例如用户界面和服务资产。\n\
  \nTrustZone 技术的典型应用是在不可信的环境中运行丰富的操作系统，并在更可信的环境中运行较小的安全专用代码（称为 TrustZone 软件，见图 25.4）。在实践中，由于\
  \ TrustZone 的具体实现细节是专利且尚未公开审查，尚不清楚特定的威胁模型提供了什么水平的保证。\n\n### 25.3.2 AMD 安全处理器\n\n\
  \n\n\n\nAMD Secure Processor（也称为“平台安全处理器”）是一个嵌入（在 x86 64 处理器中）的专用 ARM 处理器，它具有 `ARM\
  \ TrustZone` \\[11\\]技术，以及一种基于软件的可信执行环境，旨在启用第三方可信应用程序。AMD Secure Processor 实现了从\
  \ BIOS 到 `TEE` 安全执行环境的安全启动。\n\n可信的第三方应用程序可以利用标准 API 访问并使用 `TEE`。\n\nAMD 采纳了 `ARM\
  \ TrustZone` 行业标准方法，以便快速有效地允许软件和硬件合作伙伴构建具有信任链的平台，该信任链由应用程序和硬件集成并开放访问。AMD 在最新的加速处理单元（APU）中引入了此类技术，用于防病毒和防盗软件、生物识别身份验证以及电子商务安全。然而，目前该技术仍仅受少数应用程序和系统支持。\n\
  \n### 25.3.3 Intel SGX\n\nIntel `SGX` \\[13\\] 是一种旨在保护客户代码和数据免受 hypervisor/VMM 攻击的硬件技术。它是一种架构扩展，通过“反向沙箱”机制提高软件的安全性（见图\
  \ 25.5）。在这种方法中，与其试图识别并隔离平台上的所有恶意软件，合合法软件可以封装在飞地（enclave）内部，并免受恶意软件的攻击，无论后者的权限级别如何。这将补充保护平台免受恶意软件入侵的持续性工作，就像我们在家里安装保险箱来保护贵物，即使同时引入了更复杂的锁具和报警系统来防止和捕获入侵者一样\
  \ \\[14\\]。`SGX` 的设计旨在满足一些明确的要求/目标 \\[14\\]：\n\n![图 25.5 Intel SGX 架构。（来自 Frank\
  \ McKeen 等人的 *Intel software guard extensions*, Intel Corp., Santa Clara, CA, 2013.\
  \ 经许可使用。） \\[12\\]](Images/fig25.5.jpg)\n\n图 25.5 Intel SGX 架构。（来自 Frank McKeen\
  \ 等人的 *Intel software guard extensions*, Intel Corp., Santa Clara, CA, 2013. 经许可使用。）\
  \ \\[12\\]\n\n*   允许应用程序开发者保护敏感数据免受运行在较高权限级别上的恶意软件的未经授权的访问或修改。\n*   允许应用程序保持敏感代码和数据的机密性和完整性，同时不破坏合规系统软件调度和管理平台资源使用的能力。\n\
  *   允许计算设备用户保留对其平台的控制权，以及根据意愿安装和卸载应用程序及服务的自由。\n*   允许平台对应用程序的可信代码进行测量，并生成一个基于处理器的签名证明，该证明包含了此测量结果，以及其他关于代码已在可信环境中正确初始化的认证。\n\
  *   允许使用熟悉的工具和流程开发可信应用程序。\n*   允许可信应用程序的性能随底层应用处理器的能力而扩展。\n*   允许软件供应商按照自己的节奏，使用其选择的分发通道交付可信应用程序和更新。\n\
  *   允许应用程序定义代码和数据的安全区域，即使攻击者对平台拥有物理控制权并能对内存进行直接攻击，也能保持机密性。\n\n通用计算平台可以被信任的程度受限于其巨大的软件栈中漏洞出现的概率\
  \ \\[13\\]。保护模块架构（如 `Intel SGX`）最小化了提供保护模块架构支持的代码量。模块状态（受机密性保护）的持久化存储被委托给不可信的操作系统。尽管如此，必须保证状态的连续性，因为攻击者不应该导致模块使用过旧的状态（所谓的回滚攻击），而且当系统未受到攻击时，模块应该始终能够取得进展，即使系统可能在意外、随机的时间点崩溃或丢失电源（即系统应该具有崩溃恢复能力）\
  \ \\[13\\]。提供状态连续性支持并非易事，因为许多算法容易受到攻击、需要片上非易失性内存、会耗尽现有的片外安全非易失性内存或对于许多应用程序来说太慢。Strackx\
  \ 开发的 `ICE` \\[13\\] 是一种为保护模块提供状态连续性保证的系统。`ICE` 的安全性通过机器检查证明保证，它并不依赖于每次状态更新（例如缓慢的\
  \ `TPM` 芯片）。此外，`ICE` 是被动的，攻击者中断主电源或其他任何电源无法破坏状态连续性。\n\n尽管 `SGX` 等技术专门设计用于支持虚拟化环境中的信任，但在几年的狂热和炒作后，它们的缺点开始显现。特别是在\
  \ \\[15\\]中，作者实际上演示了第一个飞地恶意软件，它可以完全且隐蔽地伪装其主机应用程序。在实践中，`SGX` 并没有保护用户免受伤害，反而构成了安全威胁，助长了恶意软件。该领域的另一个结果可以在\
  \ [16]找到，作者引入了一类新型异常执行攻击（`LVI`），利用现代处理器中的微架构漏洞将攻击者数据注入受害者程序并窃取敏感数据和密钥。该攻击完全可行，目标是\
  \ `Intel SGX`。\n\n## 25.4 可信计算与云\n\n如上所述，云计算的主要问题之一是用户与提供者之间缺乏信任。尽管已经付出了巨大努力来解决这些问题，但目前仅实现了部分解决方案。在下文中介绍了一些针对云的可信计算的主要贡献（另见图\
  \ 25.6）。\n\n![图 25.6 虚拟化组件和信任级别。\n\n作为第一个示例，Jayaram 等人 \\[17\\] 提出了一种架构，能够在多核系统上创建和管理多个并发的安全执行环境。他们的架构适用于云环境，在云环境中，每个用户可能都需要一个独立的安全环境来运行其敏感应用程序。他们的解决方案仅创建一个安全环境，并依赖于轻量级处理器扩展和基于硬件的虚拟化\
  \ `TPM`。\n\n\n\n\n\n当前的 TPM 并不适用于信任移动应用程序中的跨设备场景。事实上，它们阻碍了多个设备之间的数据共享。Chen \\[18\\\
  ]提出了 cTPM，这是 TPM 设计的一种扩展，它在 TPM 中添加了额外的根密钥并将该根密钥与云端共享。因此，云端可以在同一用户拥有的多个设备之间创建并共享受\
  \ TPM 保护的密钥和数据。此外，额外的密钥允许 cTPM 分配云端支持的远程存储，使得每个 TPM 都能从受信任的实时时钟和高性能非易性存储中受益。Chen\
  \ \\[18\\] 显示，对 TPM 规范的这种更改是行的，因为其基本概念——主根密钥和离线非易性存储——已经存在于当前的 TPM 2.0 中。\n\nDai\
  \ 等人 \\[4\\]通过利用动态度量根（DRTM）的虚拟化技术深入研究了 TEE 的细节。他们的工作非常有趣，因为它可以让 cTPM 确定 TPM 命令的来源。\n\
  \n正如 Tang 等人 \\[19\\] 所讨论的那样，SaaS 的采用带来了严重且独特的安全风险。将公司的敏感数据交由云提供商处理会扩大并复杂组织所运营环境的风险图谱。Tang\
  \ \\[19\\] 强调了结构化选择云服务提供商（CSP）对于根据组织的特定安全态势实现所需的保障水平的重要性及其影响。他的论文提出了一种整体模型，即功能性、可审计性、可治理性和互操作性（简称\
  \ FAGI），作为一种方法，帮助云服务消费者（CSC）通过四个主要决策来参与并选择受信任的 CSP：选择具有足够安全功能的安全的云；通过第三方认证/评估或自测选择可审计的云；挑选一个提供所需透明度的可治理云；选择一个确保了所需迁移性的可迁移云。\n\
  \nYap 等人 \\[20\\] 引入了一个用于 TPM 2.0 半虚拟化的框架。该框架证明，只要有特定的外部组件，TPM 2.0 的核心功能就适用于半虚拟化。这是一项有趣的工作，尽管由于外部组件引入了增加复杂性，它并没有完全符合预期。\n\
  \nWallon 的《My Trusted Cloud》 \\[21\\] 显示，云计算提供了一种优的基础设施，提供了对可扩展计算资源的瞬时访问，这对于许多用户社区面临的时间和财务限制来说尤为重要。采用\
  \ Amazon Web Services \\[22\\] 或 Microsoft Azure \\[23\\] 等大型公云资源的社区日益增多，这证明了云计算范式的成功，因此具有其用性。尽管如此，公云的典型用例涉及非业务关键型应用程序，特别是在共享公共服务内应用程序使用或存储数据的安全性问题成为先决条件的情况下。\n\
  \nChens 等人 \\[24\\] 提出了 AppShield 的设计与实现，这是一种基于虚拟机程序的方法，能够比现有系统更高效地保护关键应用程序的代码、数据和执行完整性。保护开销仅限于受保护的应用程序，因此未受保护的应用程序和操作系统可以在没有任何性能损失的情况下运行。除了性能优势外，AppShield\
  \ 还解决了 \\[24\\] 中的多种威胁。基于微型虚拟机程序构建的 AppShield 原型显示了 AppShield 在 CPU 计算、磁盘 I/O 和网络\
  \ I/O 方面的低性能成本。\n\n然而，上述方法引入的复杂性在分析底层安全属性时，或者更糟糕的是在评估这些系统提供了什么信息保障时，产生了一种新的难度。例如，即使是标准化的服务活动（如取证服务），在云背景下也变得极其复杂。一个例子是云架构中发生事件的时间线的简易重构：如\
  \ \\[25\\]所示，这样的时间线只能得到部分保障，这显然需要在云架构信息保障通用领域进行进一步研究——而云取证是一个被特别忽视的特定领域。\n\n## 25.5\
  \ 云中的安全元素\n\n在许多旨在保护（移动）云操作的有趣解决方案中，CSE 是之一。安全元素云（简称 CSE）背后的想法是将应用程序存储在云端的安全元素中，并将智能手机作为\
  \ NFC 读取器（或 NFC 发起器）与远程安全元素之间的安全 NFC 桥。通过将安全元素移动到远程环境（如图 25.7 所示），应用程序发行者可以直接向安全元素配置其应用程序，而无需任何第三方参与。安全元素云（CSE）由以下五个元素组成：\n\
  \n![图 25.7 物理安全元素与云安全元素。](img/fig25.7.jpg)\n\n图 25.7 物理安全元素与云安全元素。\n\n*   应用程序：（通常用\
  \ `Javacard` 编写）存储在安全元素中。应用程序通过 `AID` 识别并交换通过 `ISO7816 APDU` 传输的信息。旧服务仅处理 NFC 读取器/卡范式，因此由一组\
  \ APDU 定义。应用程序存储在托管发行者安全域（ISD）的安全元素中，该安全域根据全局平台标准控制下载、激活或删除操作。因此，它们可以从一个 `GoSE`（下文详细）切换到另一个，以减少往返时间。\n\
  *   安全元素网格（GoSE）：安全元素嵌入了发行者安全域，该域管理应用程序的生命周期。应用程序可能会从一个网格移动到另一个。安全元素网格实现了 CSE 技术的核心。在\
  \ \\[26\\]中提出了一种基于专用硬件的首次实验，该硬件由配备有 `Linux` 操作系统的主电子机架和子板（每个子板管理多达 32 个 `SEs`）组成。网格协议运行在\
  \ `TCP` 服务器上，并支持 `SEs` 清单和选择功能。\n\n\n\n\n\n- `中继协议 (relay protocol)`：通过如 `TLS` 等安全通道，强制执行\
  \ `GoSE` 与 `NFC proxy` 之间的安全性。在当今的软件工具 [27, 28, \\]] 中，中继协议以点对点模式工作，使用固定的服务器 IP\
  \ 地址，并辅以偶尔出现的安全特性。对于 `GoSE` 而言，所需的特性更为严格，并针对安全安全、命名、本地化和缓存。安全性意味着移动终端与 `GoSE` 之间的双向身份验证以及安全通道的建立。标记信息（Tagged\
  \ information）可以高效地实现 `GoSE` 操作所需的数据结构，例如 `APDUs` 转发、应用本地化或 `SE` 管理。应用程序通过 `AIDs`\
  \ 进行标识；然而，在一个或多个 `SE` 中可能存在同一个 `AID` 的多个实例，每个实例都由唯一的序列号（`SN`）标识。对于存储在安全元件中的 `ISD`\
  \ 也是如此。需要一种命名方案（例如类似于 `User.AID.index` 的树结构），以便标识属于某个用户并由 `GoSE` 托管的应用程序实例。一旦完成双向身份验证即可与\
  \ `GoSE` 交换命令。\n\n- `NFC 安全代理 (NSP)`：根据中继协议控制与 `NFC 读器`（或启动者）的会话以及与 `GoSE` 的对话。该软件实体应管理位于智能手机中的\
  \ `SE`。`NFC Secure Proxy` 管理两个会话：首先是 `NFC 读器`（或 `NFC 启动者`），其次是 `GoSE`。它通常是运行在智能手机上的移动应用程序。对于遗留服务，得益于中继协议，`APDU`\
  \ 请求被转发到相应的安全元件。后者处理命令并在随后交付响应，响应随后被传输给读器。对于 P2P 服务，代理管理与启动者之间的 `LLCP` 协议；它与位于 `GoSE`\
  \ 中的远程 `SE` 执行交换 `LLCP` 负载所需的操作（如 `SNEP` 消息 [29] 或 `TLS` 数据包 [30])；\n\n- `NFC 读器\
  \ (或 NFC 启动者)`：用于遗留应用程序；但未来的服务可以以 P2P 模式工作。`NFC 读器/启动者`是处理 `NFC` 服务（如支付、交通或访问控制）服务的遗留组件。`CSE`\
  \ 概念的优点之一是不需要对基础设施进行修改。\n\n上述对 `CSE` 概念、安全信任的描述是允许移动和云环境进行安全协作的基础概念。在下一节中，我们将通过详细介绍某些特定技术（卡片仿真）来补充这些信息，旨在提高远程操作设备的信任度。\n\
  \n### 25.5.1 主机卡片仿真#chapter25.xhtml#re_ch-25-sec-12\n\n主机卡片仿真（简称 `HCE`，见图 25.8）旨在允许与远程操作的智能卡进行交易。在术语出现之前，卡片仿真仅存在于物理空间。换句话说，只能通过另一个多功能安全元件硬件（通常位于智能手机外壳内部）来复制卡片。`HCE`\
  \ 的首次公开实现由 `SimplyTapp, Inc.` 发布，当时他们为 `CyanogenMod` Android 社区发布了他们的 `Tapp` 近场通信支付钱包\
  \ [31]。\n\n![图 25.8 Android 实现的卡片仿真模式。](img/fig25.8.jpg)\n\n图 25.8 Android 实现的卡片仿真模式。\n\
  \n主机卡片仿真不同于简单的卡片仿真，因为卡片仿真代表了从外部非接触式终端读器直接到嵌入式安全元件的通信路由。事实上，操作系统不受此类通信控制。只有安全元件和\
  \ `NFC 控制器` 其中，手机在读器看来是一个非接触式智能卡。示例包括 `Google Wallet`、`Isis` 以及其他依赖卡片仿真将支付凭证传输到\
  \ `PoS` 的 `NFC` 移动钱包。然而，该解决方案的缺点是支付应用受到 `SE` 容量的限制（`Nexus S` 原始嵌入式 `SE` 上为 72 kb），`SE`\
  \ 访问较慢，且向 `SE` 发凭证是一个复杂且脆弱的过程，涉及多个 `TSM`、多个运营商（在 `Isis` 的情况下）以及多种 `SE` 类型和手机 [31]。\n\
  \n值得注意的是，主机卡片仿真（或软件卡片仿真）与简单的卡片仿真不同，因为它不是将 `NFC 控制器` 接收到的通信路由到安全元件，而是将其交付给 `NFC 服务管理器`——从而允许安装在手机上的应用程序处理这些命令。因此，这种方法允许我们通过将凭证存储在任何地方（例如应用程序内存中、`TEE`\
  \ 中或云端）来打破对安全元件的依赖。在 `HCE` 方法引入的所有优点中，最重要的是 [31]：\n\n1. `NFC` 仅作为通信标准使用，允许任何钱包使用它与\
  \ `PoS` 通信。\n2. 不再需要担心复杂的 `SE` 卡片置备问题。\n3. 多个 `NFC` 支付钱包可以并于手机，而无需担心 `SE` 存储大小。\n\
  4. 无需为空中 `SE` 置备和生命周期管理向运营商付费。\n\n然而，这仍然不是理想解决方案，因为 Android 尚未向应用程序暴露软件卡片仿真，且主机卡片仿真补丁尚未合并到主分支。因此，除非手机已获取根（root），否则\
  \ Android 用户无法使用。`SimplyTapp` [31] 已被提出作为 `Google Wallet` 的替代方案用于通过 `NFC` 支付。在前者，凭证存储在云端；在后者，存储在嵌入式\
  \ `SE` 中。`SimplyTapp` 的原理是创建一个主机卡片仿真补丁，解决了由于两个竞争应用程序（`SimplyTapp` 和 `Google Wallet`）注册同一个来自非接触读器的\
  \ `NFC` 事件而可能产生的冲突。\n\n除了引发 `HCE` 趋势的 `SimplyTapp` 之外，Android 4.4 引入了新的平台支持，通过 `HCE`\
  \ 实现安全的交易，用于支付、忠诚计划、访问控制、交通通行证和其他自定义服务。通过 `HCE`，Android 设备上的任何应用程序都可以仿真 `NFC` 智能卡，让用户可以使用选择的应用程序启动交易——无需设备中预置安全元件（`SE`）。应用程序还可以使用新的读器模式作为\
  \ `HCE` 卡和其他 `NFC` 交易的读器。Android `HCE` 要求设备中存在 `NFC 控制器`。大多数 `NFC 控制器`已广泛支持 `HCE`，它们动态支持\
  \ `HCE` 和 `SE` 交易。支持 `NFC` 的 Android 4.4 设备将包含 `Tap & Pay` 以使用 `HCE` 进行支付。最后，值得注意的是，通过实现高效便携的监控系统，保护\
  \ `NFC` 免受无授权读取读取的解决方案开始出现 [32]，尽管该领域显然需要进一步的研究。\n\n### 25.5.2 容器作为安全解决方案#chapter25.xhtml#re_ch-25-sec-13\n\
  \n与虚拟化相比，容器提供了接近裸金属的性能，并进一步允许在同一台机器上无缝运行多个版本的应用程序。可以随时创建新的容器实例以应对客户需求高峰。\n\n\n\n\
  \n\n![图 25.9 容器化场景。应用程序在用户空间级进行隔离，共享单个内核用于信任管理和监控。](img/fig25.9.jpg)\n\n图 25.9 容器化场景。应用程序在用户空间级进行隔离，共享单个内核用于信任管理和监控。\n\
  \n容器长期以来一直以各种形式存在，其区别在于它们所提供的隔离级别不同。例如，`BSD jails` 和 `chroot` 可以被视为容器技术的早期形式。近期基于\
  \ Linux 的容器解决方案强烈依赖内核支持的隔离机制加上用户空间库，以为系统调用和前端应用程序提供接口。主要的实现包括基于 `cgroups` 和 `namespaces`\
  \ 的 `LXC` 以及 `OpenVZ`。\n\n容器广泛部署在云端，既可以利用传统硬件机制提供的安全解决方案，也可以利用来自底层安全虚拟化方法提供的信任。容器本身由于共享单个内核，比传统应用程序略微安全一些。然而，由于\
  \ `cgroups` 和内核机制提供的隔离性远非完美，正如关于该主题的各种已发表的研究所示。尽管如此，鉴于相对于其他解决方案的性能优势，可信计算需要考虑这种场景，并提供与传统安全和信任机制的更好的集成。\n\
  \n## 25.6 相关工作\n\n关于移动计算——信任执行环境，Bouzefrane [33] 旨在充分利用云计算设施的可用性，特别关注移动云计算（MCC）。MCC\
  \ 移动用户利用云基础设施来克服移动技术的局限性，即数据存储、处理能力和电池寿命有限。特别是 Bouzefrane [33] 调查了一些可用的信任平台，以评估\
  \ MCC 可信平台的安全性。这项调查涵盖了可信平台安全方面的概述，包括 `SE`、`HCE`、`TEE` 和 `TPM`。\n\n`TCG` 软件栈（`TSS`）规定了应用程序开发者使用\
  \ `TPM` 提供的函数的软件层。然而，当前的 `TSS` 接口极其复杂，导致使用困难且容易出错，高复杂性使其不适用于嵌入式设备或安全内核。Stuble 等人\
  \ [34] 了一种简化的 `mTSS` 设计和实现，为基于 `TPM` 主规范的开发者提供了一个轻量且直观的编程接口。`mTSS` 设计的主要原则是降低复杂度、获得类型安全、对象封装和简单的错误处理。这些原则确保了生成的\
  \ `mTSS` 具有可维护性和易用性。此外，`mTSS` 的模块化架构允许根据需要仅使用提供的子集，例如用于嵌入式系统、移动设备或安全内核背景下。\n\nWinter\
  \ 等人 [35] 分析了 `TPM` 与主机平台之间的通信。虽然信任平台模块被认为是抗篡改的，但这些模块与信任平台其余部分的通信信道被证明相当不安全。研究表明，可以使用相当廉价的设备对\
  \ `TPMs` 及其总线通信发起被动攻击。然而，尚未报告过类似的主动攻击。Winter 等人追求主动攻击的想法，并展示了如何主动操纵 `LPC` 总线的通信协议，以及如何利用我们的操纵来绕过现代信任平台提供的安全机制（例如信任链）。\n\
  \nGonzales 和 Bonnet [36] 提出了一种结合商用硬件和开源软件的框架，可用作为信任执行环境来研究未来的大数据平台（另见图 25.10）。基于\
  \ `PKI` 的可信计算平台（`TCP`）要求用户申请多个平台身份密钥（`PIK`）证书以提供远程证明；用户必须为数字证书付费，这增加了他们的经济负担。正因如此，几乎没有\
  \ `TCP` 真正执行过可信计算和平台远程证明的核心功能，因此其应用并不广泛。Yu [15] 提出了一种基于层次组合公钥（`HCPK`）的可信计算加密方案，该方案可以减少单个私钥生成器（`PKG`）的风险，并允许验证者在没有任何第三方的情况下直接验证\
  \ `TCP`，因此平台用户不需要申请额外的数字证书。该方案可以降低用户使用 `TCP` 的成本，并鼓励 `TCP` 应用的发展。\n\n![图 25.10 UCONABC\
  \ 模型：引用监器根据属性、授权、义务和条件执行使用决策。（经 Springer Science + Business Media 许可：Cyberspace\
  \ safety and security, lecture notes in computer science, Towards an open framework\
  \ leveraging a trusted execution environment, Vol. 8300, 2013, pages 458–467, Javier\
  \ González and Philippe Bonnet。）[36]]](Images/fig25.10.jpg)\n\n图 25.10 `UCON[ABC]`\
  \ 模型：引用监器根据属性、授权、义务和条件执行使用决策。（经 Springer Science + Business Media 许可：Cyberspace\
  \ safety and security, lecture notes in computer science, Towards an open framework\
  \ leveraging a trusted execution environment, Vol. 8300, 2013, pages 458–467, Javier\
  \ González and Philippe Bonnet.） [36]\n\n***\n\n提到不可信执行环境时，[37] 提出了 `OASIS`，这是一种\
  \ CPU 指令集扩展，用于外部验证的隔离执行环境的启动、执行和终止，其信任根基仅由 CPU 组成。`OASIS` 利用商用 CPU 上的硬件组件来实现低成本、低开销的设计。\n\
  \nJasim [38] 的一篇有趣的论文引入了“CCCE”，这是一种量子密钥分布（`QKD`）机制与高级加密标准（`AES`）相结合的加密环境。另一个相关的贡献是\
  \ `Iso-X` [39]，这是一种灵活、细粒度的硬件支持框架，为应用程序的安全关键部分提供隔离，使其即使在存在不可信系统软件的情况下也能安全执行。`Iso-X`\
  \ 的隔离通过创建和动态管理隔区来托管关键代码片段和关联数据来实现。`Iso-X` 在内存页级提供细粒度隔离、灵活的内存分配以及低复杂度的纯硬件信任根基。`Iso-X`\
  \ 需要极少的额外硬件、少量用于管理隔区的新 ISA 指令，以及对操作系统进行极少修改（操作系统无需包含在信任根基中）。`Iso-X` 声称比 Intel 的\
  \ `SGX` 设计具有更高的内存灵活性，允许可用内存空间进行灵活划分以及隔区的动态增长。\n\n\n\n\n正如 Dunn 等人 [40] 所示，TPM 也可以用于载送恶意软件。事实上，TPM\
  \ 可以实现一种隐藏计算（cloaked computation），其内存状态无法被任何其他软件（包括操作系统和虚拟机监控器）观察。Dunn 等人展示了恶意软件可以使用隐藏计算来向恶意软件分析师隐藏核心秘密（例如攻击目标）。受感染的主机可以向远程恶意软件分发平台证明密钥的合法性，并接收并执行加密载负载，且这种方式可以防止软件看到解密后的载负载。\n\
  \n即使利用了隐私强制措施，恶意的操作系统内核也能轻松访问主内存中的用户私有数据和人机交互数据。Ren 等人 [41] 引入了 AppSec（见图 25.11），这是一种基于虚拟机监控器的安全执行环境，能够透明地保护安全敏感型应用的内存数据和人机交互数据免受不可信操作的影响。AppSec\
  \ 引入了安全加载器来检查应用程序和动态共享对象的代码完整性。在运行时，AppSec 防止应用程序和动态共享对象被被修改，并根据应用程序的意图验证内核内存访问。AppSec\
  \ 提供了设备隔离机制，防止人机交互设备被受损的内核访问。此外，AppSec 还提供了一个基于权限的窗口系统来保护应用程序资源。AppSec [41] 主要引人注目的特性是在在运行期间验证并保护动态共享对象。AppSec\
  \ 根据应用程序的意图协调内核内存访问，但并未加密所有的应用程序数据。此外，AppSec 提供了一条从终端用户到应用程序的可信 I/O 路径。\n\n![图 25.11\
  \ Ren 等人的 AppSec 架构（出自 Jianbao Ren et al. Appsec: A safe execution environment for\
  \ security sensitive applications. In Proc. of the 11th ACM SIGPLAN/SIGOPS International\
  \ Conference on Virtual Execution Environments, VEE ’15, pages 187–199, ACM, New\
  \ York, NY, 2015. Used with permission.) \\[41\\]](Images/fig25.11.jpg)\n\n图 25.11\
  \ Ren 等人的 AppSec 架构（出自 Jianbao Ren et al. Appsec: A safe execution environment for\
  \ security sensitive applications. In Proc. of the 11th ACM SIGPLAN/SIGOPS International\
  \ Conference on Virtual Execution Environments, VEE ’15, pages 187–199, ACM, New\
  \ York, NY, 2015.）[41] \n\n关于近期成功的技术，在虚拟化环境中提供安全性的另一种观点是求助于容器技术。容器的兴起可以归因于基础设施对不断缩短的开发周期、持续交付和成本节约的需求；因此，这是一项短期内不会消退的趋势。相反，这种趋势还将加速。特别是在\
  \ [42] 中，作者通过对 Docker 生态系统进行基于漏洞导向的分析，研究了在典型用例中使用容器的安全影响。这一选择是合理的，因为在所有容器解决方案中，`Docker`\
  \ 目前领先市场。作者对该领域的相关工作进行了详尽综述，将其按照安全驱动的类别进行组织，随后对容器的安全生态系统进行了分析，并识别了 Docker 环境不同组件中的若干漏洞。在\
  \ [43] 中，作者提供了容器生态系统的概述，并并通过真实的用例讨论了 Docker 环境的安全影响。此外，他们定义了一种新型的 adversary 模型，指出了影响当前使用的若干漏洞，并展示了相关的研究方向。[44]\
  \ 中，作者从安全的角度阐明了当前的虚拟化技术及其演进，其目标是其在云环境中的应用。\n\n最后，值得引用一项贡献 [45]，它展示了边缘计算与虚拟化技术之间的相互作用。特别是，作者讨论了影响这一特定场景的架构、技术和开放的安全问题。\n\
  \n## 25.7 总结\n\n本章调查了一些相关的可信计算环境解决方案，例如 `SGX` 和容器。特别是，我们展示了云能够如何利用分析执行技术来帮助保护代码的执行并保护对访问的访问。我们讨论了大多数相关的硬件/软件行业和研究方法，并特别关注了极具前景的观点。尽管产生的情景并不令人放心，一方面，本该被解决的安全问题仍然存在；另一方面，那些被引入解决许多（尽管不是所有）安全问题的技术本身引入了新的漏洞——后者对于\
  \ `SGX` 来说是完全成立的，而对容器则不那么如此。总之之，在基础层和应用层都需要进一步努力，以开发出更可靠且有望是可证明的解决方案。\n\n## 参考文献\n\
