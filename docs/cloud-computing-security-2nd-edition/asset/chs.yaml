  \ j ∈ Z q`。\n\n## 18.4.2 第三方审计方案的构造\n\n在本节中，我们将介绍如何根据 Yuan and Yu (2014) 中的初始设计构造一种实用且高效的完整性审计方案。该方案能够同时支持动态数据共享、多用户修改、公共可验证性以及在数据大小和文件数量方面的高扩展性。从现在起，假设数据以文件的形式存储，并进一步划分为若干块。我们假设有\
