  \n## 12.1 引言#chapter12.xhtml#ch-12-sec-1\n\n云安全访问控制可能是一项艰巨的任务。拥有多层潜在的安全风险也提供了许多思考空间。正如\
  \ 12.1 所示的层级，如果你有一个弱环节，链条就会断裂。我们越来越多地生活在一个分布式世界中，有许多设备寻求访问。虚拟服务器由全球的大型集团托管。员工和用户位于世界的某个地区，而他们访问的系统却很远。有时，服务器会根据时间或世界其他地区的需求增加从一个数据中心转移到另一个；我们现在有了需要保护的“移动目标”。想想\
  \ Netflix。一部热门电影或一部新剧——它将这些内容移动到最靠近客户的地方。此外，还有 BYOT（自带技术）的概念，这使得信息安全专家的工作变得更加困难。\n\
  \n![图 12.1 弱环节会导致断裂并引发麻烦](img/fig12.1.jpg)\n\n图 12.1 弱环节会导致断裂并引发麻烦。\n\n查看你所需的安全控制的最佳方法之一是审查可能出现问题的层次。就像链条一样，系统中的每一层都有必须解决的挑战。有时这些挑战很容易解决，但通常需要进行彻底检查以防止未经授权的。\n\
  \n## 12.2 安全需求层次#chapter12.xhtml#ch-12-sec-2\n\n第一层也是最脆弱的层是设备层。正如图 12.2 需要考虑的安全层级所示，我们从用户开始，在考虑每个点时都必须考虑安全性。用户层通常是主要的用户界面设备。通常，人们使用个人电脑、平板电脑或手机访问云系统。大多数设备上最流行的网络浏览器有\
  \ Internet Explorer、Chrome、Firefox、Opera 和 Safari。每个手机厂商可能都有自己的浏览器，这些浏览器可能可能不符合你组织的安全标准。在一个手机制造商处运行良好的浏览器，在另一个手机制造商处可能会产生安全问题。\n\
  \n![图 12.2 需要考虑的安全层级](img/fig12.2.jpg)\n\n图 12.2 需要考虑的安全层级。\n\n\n\n\n接下来是应用层，这需要严谨的程序员不仅要为系统应该做的功能进行编程，还要防止程序执行不该执行的操作。第三层是服务器操作系统。与世界上程序员的数量相比，精通创建操作系统的专家寥寥无几。我们往往倾向于信任操作系统供应商来维护系统这一层的健康。最后，我们将检查网络基础设施和硬件。正如图\
  \ 12.2 所示，安全层从用户开始到网络结束，所有层都应该被考虑在内。我们需要某种方法与我们所有的硬件和软件进行通信；一种被广泛使用的标准是简单网络管理协议（`SNMP`）。`SNMP`是一组通信标准，用于在不同的代理程序之间发送消息——协议数据单元（PDUs），这些代理在管理信息库（MIBs）中本地存储信息，并向请求者提供信息作为响应。根据\
  \ `SNMP` 研究国际的说法：“简单网络管理协议（`SNMP`）是互联网的标准运行维护协议。基于 `SNMP` 的管理不仅为系统、应用程序、复杂设备和环境控制系统产生管理解决方案，还提供了支持\
  \ Web 服务的互联网管理解决方案。由互联网工程任务组（`IETF`）批准的最新标准 `SNMPv3` 增加了安全功能（如加密）[1]。”Douglas Mauro\
  \ 和 Kevin Schmidt 在一本名为《EssentialEssential SNMP`》的书中写了一本关于 `SNMP` 的技术指南[2]，他们认为利用该标准可以监控所有不同类型的设备和网络健康状况。某些设备甚至设计为包含其温度信息。警告可以是自动化的，其他设备（如风扇）可以指令自动开启。\n\
  \n## 12.3 第 1 层 用户界面 (#chapter12.xhtml#re_ch-12-sec-3)\n\n出于许多原因，Web 浏览器占据了用户界面。最简单的原因是，无论用户使用什么平台，他们都拥有它。手机、平板电脑、笔记本电脑、台式电脑和高性能工作站都可以访问网络浏览器。`Linux`、`Windows`、`Chrome`\
  \ 和 `Apple 操作系统` 都有它们。你甚至可以获得适用于所有平台版本的网络浏览器。`Firefox` 和 `Chrome` 是市场领先的两个 [3]。\n\
  \n为了访问云端，你需要一个“前端”用户界面。许多云系统的前端是 Web 浏览器。连接到基于浏览器的应用程序，你就进入了云端，利用了世界上某处数据中心内服务器的资源。其他允许你利用服务器资源的常见前端包括\
  \ `Microsoft’s Remote Desktop Services (RDS)`、`Citrix XenApp` 和 `Citrix XenDesktop`\
  \ 应用程序，这些程序允许用户安全地 BYOD（自带设备）。将安全嵌入前端应用中，且不允许其他应用干扰主机与设备之间的连接，可以比大多数 Web 浏览器实现提供更高的安全级别。前端的安全气泡首先检查内部软件，以确保前端版本有效且未被篡改。这有时会导致此类设备的登录时间较长。如果前端软件版本与预期的前端版本不匹配，软件将拒绝该用户的访问。\n\
  \n大多数商业云服务和应用程序都希望许多用户加入他们的系统。这给安全工作人员带来了更多挑战。面对普通公众意味着黑客和破解者也会尝试找到进入的方法。\n\n为了保持内部网络安全，许多公司限制了对其他应用程序的访问。可以安装在手机和平板电脑上的程序用以限制用户可以执行的应用程序。当允许员工自带设备（BYOD）工作时，这变得更加困难。\n\
  \n当用户访问云资源时，管理员想要知道他们是谁，并限制他们危害的能力。有很多病毒和恶意软件；一个能够作为入侵防火墙的前端至关重要。在有人进入之前，前端检查是保护网络和云服务器的关键。\n\
  \n## 12.4 第 2 层 软件 (#chapter12.xhtml#re_ch-12-sec-4)\n\n在开发运行在云端的软件时，软件工程师有很多编程语言可以选择。低复杂性的编程语言更受青睐，因为它们能够与硬件工作且处理速度快；`C`\
  \ 是首选语言之一。由于过去十年处理器能力的提高，高级语言（如 `Java` 和 `Ruby`）在软件开发中变得越来越流行。软件框架如 `Microsoft.NET`、`Adobe\
  \ AIR` 和 `Oracle Database` 被持续用于云端编程。基于 Web 的语言如 `HTML/AJAX`、`Adobe Flash` 和 `Flex`\
  \ 也可以用于创建云应用程序的底层代码。\n\n保护应用层是非常复杂的。程序员需要防止栈溢出、监控代码注入，并考虑用户或其计算机上的程序可能执行的所有操作。程序员需要意识到其允许访问可能被滥用，并防止对数据的未经授权访问。应用程序的设计需要对无效和无效请求进行测试。防止授权用户进行未经授权的交易必须始终在程序员脑中。\n\
  \n应用程序开发者使用的一种技术是在查询未经授权的请求或表时，捕获错误并向用户返回通用消息。而不是返回代码和程序员错误信息，用户只会收到一个关于他们做了错误的通用警告。将详细的错误信息远离用户，可以防止系统细节被黑客触及。\n\
  \n\n\n保护应用程序的另一种方法是创建分层。三层架构图 12.3 通过中间应用程序进行通信，确保您的数据库具有更好的安全性，并展示了数据如何通过中间人或中间件流转以隔离数据库服务器。这种架构由\
  \ John J. Donovan 于 1992 年开发。他通过一家名为 Open Environment Corporation 的公司开发了三层架构，该公司在\
  \ 1996 年被 Borland 收购。该系统从三个不同的层来看待应用程序。这种方法有时被称为 N 层编程，它利用了前端、包含业务规则的中间件以及数据库存储和访问的后端。这种软件开发风格接收前端的请求并将其通过中间件传递，然后将请求发送到数据库后端。中间软件部分了解传递事务到后端服务器所需的正确格式、布局、业务规则和访问控制。后端数据库服务器只会响应来自中间件的请求，且仅以正确的格式和适当的凭据。中间件与数据库服务器之间请求的任何偏差都将返回空结果。通过这样，前端只能与中间件通信，后端也只会与中间件通信，从而在数据库服务器和前端用户之间提供了隔离。\n\
  \n![图 12.3 三层架构通过中间应用程序通信，确保您的数据库具有更好的安全性](img/fig12.3.jpg)\n\n图 12.3 三层架构通过中间应用程序通信，确保您的数据库具有更好的安全性。\n\
  \n这种类型的编程需要多层硬件来匹配这三层。随着虚拟服务器成本的降低，增加硬件层已变得越来越普遍。它增加了故障点，因此大多数应用开发公司不希望层数过多，但如果程序写得好，通过创建中间件的多个实例可以提高系统的响应速度。\n\
  \n增加更多服务器的另一个例子是使用 RDS 或 Citrix 前端服务器。以每个服务器可以处理 200 个用户为例。当您的社区规模超过 200 人时，在网络中添加另一个前端服务器是有意义的，而不是为单个服务器增加更多内存或处理能力。\n\
  \n使用三层架构还创建了为程序员分离工作的能力。您可能有六名开发人员在一个项目上工作。让他们定义并开发规则以及接口如何工作，可以让他们获得物理上的隔离，从而处理项目的各个部分。三层架构的最后一个优点是它将数据库与用户隔离开。当您的首要目标是保持数据库服务器安全时，这一点尤为真实。\n\
  \n## 12.5 第三层托管服务器操作系统\n\n互联网的大部分运行在 Linux 及其所有变体以及 Microsoft Windows Server 及其所有版本上。项目经理、程序员和管理员选择的应用开发平台通常强制选择主机操作系统。在决定应用程序开发时，应该考虑服务器操作系统的几个重要方面。软件和托管的成本可能是一个问题。最流行的两个操作系统在托管选择方面有许多选项。\n\
  \n图 12.4 显示了一些最流行的服务器操作系统，包括 Windows 和 Linux。在选择服务器供应商时，应该解决一系列问题，其中最少的是谁有权访问您的服务器以及运行它的硬件。对服务器进行定期维护也至关重要。安全更新对于保持服务器平台更新非常重要，因此请询问谁负责软件更新。除了软件之外，还要进行硬件维护以确保系统长期健康地运行。磁盘驱动器可能会故障并需要更换。电源也是关注的问题。\n\
  \n![图 12.4 一些最流行的服务器操作系统](img/fig12.4.jpg)\n\n图 12.4 一些最流行的服务器操作系统。\n\n除了维护之外，还有许多服务器监控应用程序可以警告你服务器的问题。这些程序从检查磁盘空间到高内存利用率不等。此外，许多新服务器可以跟踪机箱内部的物理温度。如果系统正在使用中且网络流量异常高，某些服务器监控器将产生错误。更具体的监控器可以显示哪些数据进出系统以及来自何处。可以向服务器管理员生成警报，或者系统可以立即采取纠正措施阻止产生警告的位置。\n\
  \n保持操作系统安全的顶级方法之一是将对服务器的物理访问限制在少数人身上。大多数托管中心都有每个人进入和离开的视频。换句话说，会检查人员人员可能带入或带出机房的任何设备。在离开时，他们会检查重量是否与他们留下的物品一致。目前还在大力推动某种生物识别访问。某些服务器房使用手几何识别，而另一些使用指纹技术。我甚至看到过使用视网膜扫描仪和人脸识别。每种生物识别都有其优缺点；关键点是检查您的供应商在使用什么，并决定这对于您的应用程序是否足够。利用加密、长而复杂的密码、跟踪每个管理员所做的访问和更新的个性化用户\
  \ ID，可以形成良好的审计追踪。了解系统何时启动和关闭，以及何时安装应用程序，也是应该完成的基本跟踪工作，以确保管理员遵守规则。\n\n## 12.6 第四层托管基础设施硬件和网络\n\
  \n保护基础设施硬件非常重要。系统的物理安全对于防止不受欢迎的用户和黑客至关重要。有了物理访问权限，人员可以拔掉电源线和网络线，插入 U 盘，从 U 盘启动服务器或盗走整个物理服务器。许多托管公司还在服务器机架上安装锁，并设有跟踪和仅允许授权人员进入机房的安全措施。大多数数据中心设施还受到\
  \ 24 小时的视频监控。图 12.5，云计算的复杂性和访问点，让你一览了网络上的所有目标。\n\n![图 12.5 云计算的复杂性和访问点](img/fig12.5.jpg)\n\
  \n图 12.5 云计算的复杂性和访问点。\n\n除了保护服务器硬件外，还应该保护网络硬件。交换机、路由器和配线管理系统不应让非授权人员访问。上锁的机房或电话间是保护网络硬件的最常见方法。如果入侵者或黑客拥有网络的人物理访问权限，他们就可以安装捕获传输数据的设备。良好的物理安全只是开始。\n\
  \n\n\n网络安全的第二部分是积极管理设备，并仅允许来自信任设备的请求。物联网（`IoT`）由于摄像头和其他传感器的加入，使得这一变得变得更加复杂；我们正在赋予各种公司访问我们网络的权限。这些设备通常直接从供应商那里获取更新，而无需你的参与。我们可以通过使用应用程序和网网的物理\
  \ `MAC` 地址来实现更好的设备安全。积极管理的交换机允许为每个端口分配一个 `MAC` 地址，因此如果有不同的设备连接到交换机，它将不允许其进入系统。这可以在网络的物理位置完成，从而允许对云进行远程访问。\n\
  \n许多公司在办公室里会有多个网络连接。每个连接都应该被管理，并且只有在在使用时才在物理上连接到交换机。为网络建立物理屏障可能是防止不必要的入侵者最安全的方法。\n\
  \n第三部分是保护网络免受在线入侵者的侵扰。利用网络地址翻译（`NAT`）和良好的防火墙设置可以限制外部黑客的威胁。此外，你还可以限制访问你托管解决方案的全球区域。如果你是一家位于美国的公司，可以对美国的\
  \ `IP` 地址建立白名单并拦截所有其他地址。当你有需要旅行并预计检查电子邮件或在线系统的用户时，这会变得更加困难，但对于大多数对安全最敏感的公司来说，这是一个选项。你可以购买防火墙服务来拦截不同类型的网站。例如，你可能不希望在你的网络上访问社交媒体。这类服务可以被拦截。许多防火墙对分级内容的拦截。有些会拦截股票交易公司和银行网站，以便无人从他们的网络访问任何财务网站。因此，如果有人获得了未经授权的访问，他们仍然无法进入金融机构。\n\
  \n第四部分是从内部保护你的网络。你的用户可能会恶意或在无意中感染病毒，这种病毒会将他们的计算机变成另一个用户的机器人。这些 `BOTs` 随后可以被黑客用来追踪你的操作，并允许恶意代码从你的内部网络发出。从内部保护的关键在于良好的间谍软件和防病毒措施。此外，使用最新的补丁更新你的操作系统和应用程序软件至关重要。这包括手机、iPad、工作站和服务器。它还包括交换机和路由器，大多数\
  \ IT 人可能不会定期进行这些操作。应该每六个月对基础设施进行一次审查，以确保设备是最新的且运行正常。\n\n2013 年，一种新型病毒被创建并并在整个互联网中部署。这种程序通常被称为勒索软件，它会加密你所有的图片或所有的文档文件。弹出的警告屏幕会要求你通过\
  \ `bitcoin` 或西联汇（Western Union）等现金交易支付，否则你的文件将永远无法恢复。建立能够阻止这种恶意软件的系统是非常重要的。`Cryptolocker`\
  \ 是最受欢迎的勒索软件病毒之一，根据 `PC World Magazine` 2013 年 12 月 20 日的一篇文章提到，在 100 天内被勒索了 3000\
  \ 万美元 [4]。勒索软件在 2015 年仍然盛行，并且可能会与我们长期很长一段时间。这是一种很难拦截的病毒，因为用户可以访问自己的文件，而且越来越多的人正在使用加密。区别在于“密钥”在用户手中，而不是在犯罪分子手中。\n\
  \n## 12.7 各层面的改进 #chapter12.xhtml#re_ch-12-sec-7\n\n云有几个缺点。最大的其中之一是你失去了对运行你业务的物理硬件的控制。如果你使用来自\
  \ `Google` 的 `Gmail`，那么你已经将电子邮件外包到了云端，并且真的不知道你的所有数据存储在哪里。此外，对于免费服务，提供者总是得到了什么，对吧？提供者可以以电子方式读取和解读你所有的电子邮件和图片，以便更好地向你进行营销。人们付钱给\
  \ `google` 来运行针对你想要的内容和位置投放的广告。\n\n云的另一个危险是服务提供商破产。这会让你和数据处于什么境？确保你所有的云信息都备份到另一个供应商的服务或你自己的本地备份驱动器上。在许多情况下，有一些很好的解决方案可以让你实现这一点。\n\
  \n云将在未来的业务和互联网功能中发挥巨大作用。云在工作方式方面是非常动态的。例如，云（位于离线位置）可以允许现场拥有更小的 IT 配置，这节省了资金，并为用户通过在线远程支持进行更方便的计算机维修打开了大门。企业不仅将拥有更小的\
  \ IT 部门，还将拥有更少的现场硬件。除了控制网络和连接到云之外，不需要机房。根据国际电信联盟的说法：“对于中小企业，外包 IT 服务和应用程序的能力不仅提供了降低整体成本的潜力，还可以降低许多处理密集型活动的准入门槛，因为它消除了前期资本投资和维护专用基础设施的必要性”\
  \ [5]。\n\n云允许将本地服务器和工作站外包给更高效虚拟计算机。托管在最高安全的数据中心，结合 256 位加密算法，云是存储数据最安全的选项之一，甚至是最安全的。像中国或印度这样的国家还没有庞大的\
  \ IT 基础设施。云可以为全球用户开启新的市场和选择，使云变得更有优势和先进。云计算能够减少 IT 费用，并让快速增长或收缩变得不那么痛苦。不仅如此，它还将以前所未见或想象的方式连接人类。\n\
  \n## 12.8 多级认证 #chapter12.xhtml#re_ch-12-sec-8\n\n管理员可以使用许多多级认证形式来防止对敏感云数据的非法访问。目前，访问任何云服务器的认证标准范围很大。有些使用简单的文本密码；有些则需要包含数字和特殊字符的复杂密码。有些会有与密码一起的图片作为第二次验证。你需要知道文本密码和与账户关联的图像。使用生物识别、回拨验证、文本密码验证和随机生成器令牌密码变得越来越常见。这些认证过程在大多数情况下有效，但在受到暴力破解或\
  \ `DoS`（拒绝服务）攻击时会严重失败。解决此问题的方案是使用 3 层以上的复杂密码实施多级认证。正如图 12.6 多级密钥访问所示，H.A. Dinesha\
  \ 指出：“一级认证是组织级密码认证/生成。第二级认证是团队级密码。最后级别将是用户级密码认证/生成，这确保终端用户拥有特定的权限” [6]。\n\n\n\n\n\
  ![图 12.6 多级密钥访问。（源自 Dinesha (2012)。经许可使用。）](img/fig12.6.jpg)\n\n图 12.6 多级密钥访问。（源自\
  \ Dinesha (2012)。经许可使用。）\n\n身份验证过程有时会很繁琐，因此自然有一些应用程序可以帮助管理密码。我们将在 12.10 节中详细讨论密码。\n\
  \n对于某些应用程序，进入系统时有一个通用密码，但为了进行更改或覆盖现有数据，需要第二个密码。这种管理级身份验证在零售业中常见。店员可以创建新交易，但在没有经理级密码的情况下无法清除项目或进行退款。目前有许多免费的身份验证器可用，如\
  \ Google 身份验证器。它位于您的手机上，可以处理许多不同网站的每 15 秒变化一次的二级密码。\n\n## 12.9 加密\n\n如果用户使用单台机器访问云端，端到端加密的密钥可以由该机器上的应用程序持有。由于用户可以在智能手机和平板电脑等多个设备上访问云端，设备之间安全地共享这些密钥可能具有挑战性。建议使用强密钥的\
  \ `AES-256` 进行端到端加密。强密钥长度应超过 12 个字符，并包含大小写字母、数字和特殊字符。\n\n加密密钥的管理不仅对数据安全至关重要，对于符合《健康保险流通与责任法案》（HIPAA）或支付卡行业数据安全标准（PCI-DSS）也同样重要。加密密钥应由最终用户控制和维护。如图\
  \ 12.6“多级密钥访问”所示，你可以有一个域管理器（DM）和一个域客户端（DC）。域管理器将管理域成员，在未注册用户进入系统之前就阻止其访问。客户端将加密数据并发送到域，消除了云端用户直接到域的直接链接。这有时被称为边缘安全，许多供应商提供边缘系统来帮助保护您的\
  \ IT 资产。Check Point 软件是一家大型供应商，通过防火墙和威胁防护软件解决系统安全挑战。Gartner® 将 Check Point 和 Palo\
  \ Alto Networks 称为企业网络防火墙的领导者。\n\n## 12.10 密码管理\n\n用户有不同的方式在云端利用密码管理来获益。其中一种方法是使用可以自动同步到云端的密码管理软件。如\
  \ `Safe-in-Cloud` 等程序使用 `Google Drive`、`Dropbox` 和 `SkyDrive` 等服务将数据库中存储的数据同步到离线数据中心。这些程序还提供加密高达\
  \ 256 位的强加密算法。云的优之处在于可以在世界上任何地方远程恢复密码。\n\n尽管如此，密码管理软件也有缺点。管理软件极易受到本地机器入侵的影响，并导致备份文件被盗。解决此问题的方法是相同的互联网加密标准将密码管理器托管在云端本身。Agilebits、`LastPass`\
  \ 和 `mSeven` 就是几个以这种方式运行的工具。\n\n关键在于拥有一个极好的密码并阻挡门外的任何小偷。这将确保你的密码库的安全。另一种选择是使用动态令牌，它包含用户的部分密码，其余部分是令牌上生成的随机数。令牌通常与小型\
  \ USB 闪盘一样大。提供 `RSA secureID` 令牌的公司之一是 `EMC²`。除了物理令牌，他们还有可以在智能手机上运行的软件令牌。优点是不随身携带额外的设备。\n\
  \n## 12.11 分布式服务器\n\n随着时间的推移，Google、Microsoft 和 Amazon 等大型网站服务提供商已从孤立的分布式服务器中心转向大规模、扩张的数据中心。这些数据中心容纳了数千台服务器，旨在云计算并为用户提供互联网服务。云托管数据中心的吸引使得企业和普通用户节省了时间和金钱。分布式云服务器允许通过互联网连接远程访问世界上任何地方的数据。这允许企业外包其\
  \ IT 部门，并消除维护现场服务器的成本。公司可以使用 HP、Microsoft 和 Amazon 等各种云服务来补充内部技术需求。数据中心在物理和云端都实施了强大的安全措施，为客户数据提供可靠的保护。无论托管公司大小，你组织的安全需求都应该得到满足。\n\
  \n选择托管公司时需要考虑的一个重要事项是，你是在与另一个网站共享资源、在计算机上获取虚拟机，还是为你的应用程序获取整台服务器。在考虑安全性时，拥有自己的硬件可能是安全的。遗憾的是，大多数公司不愿意花\
  \ 500 美元或更多购买专用服务器。使用虚拟机可以给你极好的安全性，同时保持良好的成本控制。对于具有静态信息或指向社交媒体链接的面向用户的网站，运行 `WordPress`\
  \ 的共享服务器应该足够安全。\n\n## 12.12 总结\n\n许多系统只需要简单的密码即可访问，而另一些则更为强大。考虑你应用程序的需求，并尝试通过良好的安全实践来降低风险。`SNMP`、`加密`、`firewall`、`防病毒`和强密码对于有效监控和保护任何云平台都是必要的。人为疏忽安全可能是云网络入侵的最大因素。根据在线信任联盟（Online\
  \ Trust Alliance）的数据，如果企业有更好的内部控制，90% 的数据泄露是可以避免的。在线信任联盟有更多关于防护的信息。密码选择糟糕、笔记本电脑被盗、在不同网站间共享相同密码以及长时间开启计算机都是主要威胁。\n\
