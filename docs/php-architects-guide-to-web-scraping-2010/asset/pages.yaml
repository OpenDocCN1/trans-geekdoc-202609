- pgno: 102
  md: "+   • The `stream_get_contents` function is used to read all available data\
    \ from the connection, in this case the response to the request.\n• The `fclose`\
    \ function is used to explicitly terminate the connection.\n\nDepending on the\
    \ nature and requirements of the project, not all facets of a request may be known\
    \ at one time. In this situation, it is desirable to encapsulate request metadata\
    \ in a data structure such as an associative array or an object. From this, a\
    \ central unit of logic can be used to read that metadata and construct a request\
    \ in the form of a string based on it.\n\nManually constructing requests within\
    \ a string as shown in the example above also doesn't have ideal readability.\
    \ If exact requests are known ahead of time and do not vary, an alternative approach\
    \ is storing them in a data source of some type, then re-trieving them at runtime\
    \ and sending them over the connection as they are. Whether it is possible to\
    \ take this approach depends on the level of variance in requests going between\
    \ the web scraping application and the target application.\n\nIf the need arises\
    \ to manually build query strings or URL-encoded POST request bodies, the `http_build_query`\
    \ function allows this to be done using associative arrays.\n\n# ## Parsing Responses\n\
    \nOnce you've received a response, the next step is obtaining the data you need\
    \ from it. Taking the response from the last example, let's examine what this\
    \ might look like.\n\n```\n<php\n    // Split the headers and body into separate\
    \ variables\n    list($headers, $body) = explode(\"\\r\\n\\r\\n\", $response,\
    \ 2);\n\n    // Remove the status line from the headers\n    list($status, $headers)\
    \ = explode(\"\\r\\n\", $headers, 2);\n\n    // Parse the headers segment into\
    \ individual headers\n    preg_match_all(\n        \"/(?P<name>[^:]+): (?P<value>[^\\\
    r\\n]+)(?:$|\\r\\n[\\t ]*)/U\",\n        $headers,\n        $headers,\n      \
    \  PREG_SET_ORDER\n    );\n    ?>\n```"
  merge: -1
