- pgno: 61
  md: 'containing the authentication credentials to use in the format `username:password`.

    Note that this has to be set for each request requiring authentication.


    # ## Redirection


    `CURLOPT_FOLLOWLOCATION` can be set to `true` to have cURL automatically place
    process redirections. That is, it will detect `Location` headers in the server
    response and implicitly issue requests until the server response no longer contains
    a `Location` header. To set the maximum number of `Location` headers to have cURL
    process automatically before terminating, use the `CURLOPT_MAXREDIRS` setting.
    To have authentication credentials persist in requests resulting from redirections,
    set the `CURLOPT_UNRESTRICTED_AUTH` setting to `true`.


    # ## Referers


    `CURLOPT_REFERER` allows you to explicitly set the value of the `Referer` header.
    Setting `CURLOPT_AUTOREFERER` to `true` will cause cURL to automatically set the
    value of the `Referer` header whenever it processes a `Location` header.


    # ## Content Caching


    `CURLOPT_TIMECONDITION` must be set to either `CURL_TIMECOND_IFMODSINCE` or `CURL_TIMECOND_IFUNMODSINCE`
    to select whether the `If-Modified-Since` or `If-Unmodified-Since` header will
    be used respectively.


    `CURLOPT_TIMEVALUE` must be set to a UNIX timestamp (a date representation using
    the number of seconds between the UNIX epoch and the desired date) to indicate
    the last client access time of the resource. The time function can be used to
    derive this value.


    # ## User Agents


    `CURLOPT_USERAGENT` can be used to set the User Agent string to use.'
