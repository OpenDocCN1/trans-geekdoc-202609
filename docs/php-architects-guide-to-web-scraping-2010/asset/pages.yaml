  md: '# # Chapter 3


    # ## HTTP Streams Wrapper


    At this point, you should be fairly well-acquainted with some of the general concepts
    involved in using an HTTP client. The next few chapters will review some of the
    more popular mainstream client libraries, particularly common use cases and the
    advantages and disadvantages of each. This client covered in this chapter will
    be the HTTP streams wrapper.


    PHP 4.3 saw the addition of the Streams extension to the core. According to the
    related section of the PHP manual, the intention was to provide “a way of general-
    izing file, network, data compression, and other operations which share a common
    set of functions and uses.” Streams introduced several concepts, one of which
    is a **wrapper**. The job of a wrapper is to define how a stream handles communications
    in a specific protocol or using a specific encoding. One such protocol for which
    a wrapper is available is HTTP


    The advantage to the HTTP streams wrapper is that there is very little to learn
    in terms of the API. It’s fairly easy to get something simple working quickly.
    The disad- vantage is that it’s very minimalistic in terms of the feature set
    offered. It gives you the ability to send HTTP requests without having to construct
    them entirely on your own (by specifying the body and optionally any headers you
    want to add) and access data in the response. That’s about it. The ability to
    debug requests is one example of a feature that it does not include at the time
    of writing.


    The fact that the wrapper is written in C is a bit of a double-edged sword. On
    the positive side, there is a substantial performance difference between C code
    and PHP'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'code (though it is more noticeable in a high load environment). On the negative
    side, you have to either know C or depend on the community to deliver patches
    in a timely fashion for any issues that may arise. This also applies to extensions
    written in C that will be covered in subsequent sections.


    The streams wrapper is part of the PHP core and as such has no installation re-quirements
    beyond that of PHP itself.


    # Simple Request and Response Handling


    Here''s a simple example of the HTTP streams wrapper in action.


    ```

    <?php

    $response = file_get_contents(''http://localhost.example'');

    print_r($http_response_header);

    ?>

    ```


    There are a few things to note.


    +   * The **allow_url_fopen** PHP configuration setting must be enabled for this
    to work, which it is in most environments.

    * In this example, the **file_get_contents** function call is equivalent to making
    a GET request for the specified URL ''http://localhost.example''.

    * **$response** will contain the response body after the call to the **file_get_contents**
    function completes.

    * **$http_response_header** is implicitly populated with the HTTP response status
    line and headers after the **file_get_contents** call because it uses the HTTP
    streams wrapper *within the current scope*.


    While this example does work, it violates a core principle of good coding prac-tices:
    no unexpected side effects. The origin of **$http_response_header** is not en-tirely
    obvious because PHP populates it implicitly. Additionally, it''s more restric-tive
    because the variable is only populated within the scope containing the call to
    **file_get_contents**. Here''s a better way to get access to the same data from
    the re-sponse headers.'
