  md: "```\n$ch1 = curl_init('http://localhost.example/resource1');\n**curl_setopt**($ch1,\
    \ CURLOPT_RETURNTRANSFER, **true**);\n/* other curl_setopt calls */\n\n$ch2 =\
    \ curl_init('http://localhost.example/resource2');\n**curl_setopt**($ch2, CURLOPT_RETURNTRANSFER,\
    \ **true**);\n/* other curl_setopt calls */\n\n$mh = curl_multi_init();\ncurl_multi_add_handle($mh,\
    \ $ch1);\ncurl_multi_add_handle($mh, $ch2);\n\n$running = null;\ndo {\n    curl_multi_exec($mh,\
    \ $running);\n} while ($running > 0);\n\n$ch1_response = curl_multi_getcontent($ch1);\n\
    $ch2_response = curl_multi_getcontent($ch2);\n\ncurl_multi_remove_handle($mh,\
    \ $ch1);\n**curl_close**($ch1);\n\ncurl_multi_remove_handle($mh, $ch2);\n**curl_close**($ch2);\n\
    \ncurl_multi_close($mh);\n?>\n```\n\n+   * Two cURL session handles `$ch1` and\
    \ `$ch2` are initialized and configured normally. Note that more than two can\
    \ be used in this type of operation; two merely satisfy the purpose of this example.\n\
    \n+   * A cURL multi handle `$mh` is initialized and the two session handles are\
    \ added to it.\n\n+   * A loop is used in conjunction with the flag `$running`\
    \ to repeatedly check (i.e. poll) the multi handle for completion of all contained\
    \ operations.\n\n+   * `curl_multi_getcontent` is used on the two session handles\
    \ to get the response bodies of each."
