  md: '# ### Relative Addressing


    The above examples use what is called **absolute addressing**, similar in concept
    to absolute filesystem paths. The next example covers use *relative addressing*.


    ```

    ```php

    <?php

    // Returns all ul nodes that have li child nodes

    $list = $xpath->query(''/body//ul/li/..'');

    ?>

    ```

    ```


    Where `/body//ul/li` selects `li` nodes, `/body//ul/li/..` instead selects `ul`
    nodes by using relative addressing (specifically `..`) to indicate that the parent
    node of the addressed node (`li`) should be returned rather than the addressed
    node itself. Compare this with the same sequence used to refer to the parent directory
    of the current directory on a UNIX filesystem.


    # ### Addressing Attributes


    Examples thus far have dealt with element nodes in particular. XPath also supports
    the selection of attribute nodes.


    ```

    ```php

    // Returns the id attribute nodes of all ul nodes

    $list = $xpath->query(''//ul/@id'');


    // Returns all ul nodes that have id attribute nodes

    $list = $xpath->query(''//ul/@id/..'');


    // Returns all id attribute nodes

    $list = $xpath->query(''//@id'');

    ?>

    ```

    ```


    +   * `/ul/@li` addresses all `id` attribute nodes associated with `ul` element
    nodes that are descendants of the context node.


    +   * Note how the use of relative addressing in the second example applies to
    attributes nodes just as it would apply to child element nodes.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '• **/@id** addresses all **id** attribute nodes that are descendants of the
    context node regardless of the element with which they are associated.


    # ## Unions


    When addressing nodes, it is possible to perform a single query that uses multiple
    expressions. This is referred to as addressing the **union** of those expressions.


    ```

    <?php

    // Returns the li child nodes of all ul and ol nodes

    $list = $xpath->query(''//ol/li|//ul/li'');

    // Returns the th and td nodes of all tr nodes

    $list = $xpath->query(''//tr/th|//tr/td'');

    ?>

    ```


    • The first example returns all list items (**li**) of both unordered (**ul**)
    and ordered (**ol**) lists.


    • The second example returns all header (**th**) and data (**td**) cells of table
    rows (**tr**).


    # ## Conditions


    In addition to their surrounding hierarchical structure, nodes can also be addressed
    based on **conditions**.


    ```

    <?php

    // Returns all ul nodes with an id attribute node

    $list = $xpath->query(''//ul[@id]'');


    // Returns all li child nodes of the ul node with an id of "thelist"

    $list = $xpath->query(''//ul[@id = "thelist"]/li'');


    // Returns the first ul node that is a descendant of the context node

    $list = $xpath->query(''//ul[1]'');

    ```'
