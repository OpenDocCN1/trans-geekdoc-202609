  md: '# ## Chapter 13


    # ### CSS Selector Libraries


    This chapter will review several libraries that are built on top of the XML extensions
    described in previous chapters. These libraries provide interfaces that uses CSS
    selector expressions to query markup documents rather than a programmatic API
    or XPath expressions. Don''t be concerned if you aren''t familiar with CSS selectors,
    as part of this chapter showcases basic expressions alongside their XPath equivalents.


    ![](img/1e839861f06c77df9ecabc0aed9127b5_148_0.png)


    # **CSS Versions**


    There are multiple versions of the CSS standard and supported selectors vary with
    each version. This chapter will cover a subset of those available in CSS3. Versions
    of the CSS standard supported by particular libraries are noted where available.
    A list of differences between the two common versions, CSS2 and CSS3, can be found
    at http://www.w3.org/TR/css3-selectors/#changesFromCSS2.


    # ## Reason to Use Them


    Before getting into the “how” of using CSS selector libraries, it''s probably
    best to get the “why” (and “why not”) out of the way first. It goes without saying
    that these libraries add a layer of complexity to applications that use them,
    introducing another potential point of failure. They implement expression parsers
    in order to take CSS'
  merge: -1
  img_proc: true
- pgno: 149
  md: "selector expressions as their input and translate them into equivalent userland\
    \ operations, which can have an impact on performance.\n\nThose points aside,\
    \ they do offer a syntax that is considered by some to be more intuitive. Most\
    \ developers these days know at least some CSS and probably have a little experience\
    \ with a JavaScript library that uses CSS selectors for node selection on the\
    \ client side, such as jQuery. Thus, knowledge of that particular area is transferable\
    \ to the server side when libraries based around it are used.\n\nTo sum this up,\
    \ if you're particularly concerned about performance or simplicity of the application\
    \ with regard to the number of components on which it is dependent, it's probably\
    \ best to stick with something like XPath. Otherwise, CSS selector libraries are\
    \ worthy of consideration for making use of a common existing skillset.\n\nEven\
    \ if your decision is to stick with XPath, keep reading. This chapter will also\
    \ show some XPath equivalents for each set of explained CSS selectors, which may\
    \ help to further your understanding of XPath. Note that these comparisons are\
    \ not necessarily comprehensive and there may be multiple ways to express the\
    \ same thing in any given case.\n\n![](img/1e839861f06c77df9ecabc0aed9127b5_149_0.png)\n\
    \n# jQuery Examples\n\nThe documentation for the jQuery library itself actually\
    \ has excellent visual client-side examples of selectors. If you find you aren't\
    \ certain that you understand any of the descriptions of CSS selectors that follow,\
    \ the jQuery demos and source code will likely prove to be helpful supplements.\
    \ You can find them at http://api.jquery.com/category/selectors/.\n\n# Basics\n\
    \nLet's look at a few basic selectors and their results when applied to a markup\
    \ example.\n\n```\n```html\n<html>\n<body>\n  <div id=\"nav\">\n    <ul class=\"\
    horizontal\">\n      <li><a href=\"/home\">Home</a></li>\n```\n```"
  merge: -1
