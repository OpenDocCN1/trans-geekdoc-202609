    +   * In the first two examples, note that the root element (html) is referenced
    in the expression even though it is assumed to be the context node (since no other
    node is specified as the second parameter in either query call).


    +   * A **single forward slash** / indicates a parent-child relationship. */html/body
    addresses all body nodes that are children the document’s root html element (which
    in this case only amounts to a single result).


    +   * A **double forward slash** // indicates an ancestor-descendant relationship.
    //body addresses all body nodes that are descendants of the context node (which
    again only amounts to a single result).


    The single and double forward slash operators can be used multiple times and in
    combination with each other as shown below.


