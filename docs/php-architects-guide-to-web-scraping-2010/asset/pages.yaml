  md: 'will become the **context node** and query results will be restricted to that
    node and its descendants. Otherwise, the root element of the document is assumed
    to be the context node.


    The difference between *evaluate* and *query* is that the latter will always return
    an instance of *DOMNodeList* whereas the former will attempt to return an appropriately
