  md: "# ## Setting Multiple Options\n\nIf you're working with PHP 5.1.3+ you have\
    \ access to the `curl_setopt_array` function, which allows you to pass in an associative\
    \ array of setting-value pairs to set with a single function call. If you're working\
    \ with an older version of PHP, the function is relatively easy to write.\n\n\
    Using this function results in not only less and cleaner code, but in the case\
    \ of the native C function it also results in fewer function calls and by proxy\
    \ improved performance.\n\n```\n```php\n<?php\nif (!function_exists('curl_setopt_array'))\
    \ {\n    function curl_setopt_array($ch, $options) {\n        foreach ($options\
    \ as $setting => $value) {\n            curl_setopt($ch, $setting, $value);\n\
    \        }\n    }\n}\n\n$ch = curl_init();\n$opts = array(\n    CURLOPT_URL =>\
    \ 'http://localhost.example',\n    CURLOPT_RETURNTRANSFER => true\n);\ncurl_setopt_array($ch,\
    \ $opts);\n$response = curl_exec($ch);\ncurl_close($ch);\n?>\n```\n```\n\n# ##\
    \ Handling Headers\n\n`CURLOPT_HEADER` holds a boolean flag that, when set to\
    \ `true`, will cause headers to be included in the response string returned by\
    \ `curl_exec`.\n\nAnother option for getting at some of the data included in the\
    \ response headers, such as the HTTP response code, is to use the `curl_getinfo`\
    \ function as shown in the following example. For more on what other information\
    \ this function offers, see its entry in the PHP manual."
