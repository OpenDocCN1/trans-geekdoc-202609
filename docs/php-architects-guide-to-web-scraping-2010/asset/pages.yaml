- pgno: 62
  md: '# Byte Ranges


    CURL\_OPT\_RESUME\_FROM can be used to set a single point within the document
    from which to start the response body. This will cause the Range header to be
    set with a value of $X -$ where $X$ is the specified starting point.


    In order to specify multiple ranges, CURL\_OPT\_RANGE accepts a string in the
    same format as the Range header (ex: X-Y, Z-).


    # DNS Caching


    You may notice that code using the cURL extension appears to run faster than code
    using streams. The reason for this is that cURL implements its own DNS cache,
    which is more likely to be apparent if your operating system or internet service
    provider does not provide one.


    DNS, or Domain Name System, is a system used to derive an IP address for a domain
    name in a manner similar to how phone directories are used to obtain a phone number
    for a person using their name. The process of obtaining an IP address for a domain
    name, called a DNS lookup, can be a costly operation in terms of the time required.


    Because the results of DNS lookups don''t change often, DNS caching is often used
    to retain the results of lookups for a certain time period after they are performed.
    This can be done at multiple levels including the source code level as with cURL,
    natively at the OS level, or via software like nscd or dnsmasq run either locally
    or on remote servers such as those used by internet service providers.


    cURL DNS caching is enabled by default. Some situations like debugging may warrant
    disabling it, which can be done by setting CURL\_OPT\_DNS\_USE\_GLOBAL\_CACHE
    to false. cURL will also by default retain the results of DNS lookups in memory
    for two minutes. To change this, set the CURL\_OPT\_DNS\_CACHE\_TIMEOUT setting
    to the number of seconds a result should remain in the cache before expiring.


    Also noteworthy is the fact that cURL DNS caching is not thread-safe. Threading
    is a particular style of parallel processing. The most common implementation of
    threading consists of multiple threads of execution contained within a single
    operating system process that share resources such as memory. Because of this,
    it may'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'operate unpredictably in a threaded environment such as Windows Server or \*NIX
    running a threaded Apache MPM such as worker.


    If you are using the HTTP streams wrapper or either of the PHP-based HTTP client
    libraries covered in this chapter and you have access to install software on your
    server, you may want to install a local DNS caching daemon to improve performance.
    Try nscd or dnsmasq on \*NIX. Writing DNS caching into your own client will be
    covered in a later chapter on writing your own HTTP client.


    # ## Timeouts


    CURLOPT\_CONNECTTIMEOUT is a maximum amount of time in seconds to which a connection
    attempt will be restricted for a cURL operation. It can be set to 0 to disable
    this limit, but this is inadvisable in a production environment. Note that this
    time includes DNS lookups. For environments where the DNS server in use or the
    web server hosting the target application is not particularly responsive, it may
    be necessary to increase the value of this setting.


    CURLOPT\_TIMEOUT is a maximum amount of time in seconds to which the execution
    of individual cURL extension function calls will be limited. Note that the value
    for this setting should include the value for CURLOPT\_CONNECTTIMEOUT. In other
    words, CURLOPT\_CONNECTTIMEOUT is a segment of the time represented by CURLOPT\_TIMEOUT,
    so the value of the latter should be greater than the value of the former.


    # ## Request Pooling


    Because it is written C, the cURL extension has one feature that cannot be replicated
    exactly in libraries written in PHP: the ability to run multiple requests in parallel.
    What this means is that multiple requests can be provided to cURL all at once
    and, rather than waiting for a response to be received for the first request before
    moving on to sending the second, all requests will be sent and processed as responses
    are returned. This can significantly shorten the time required to collectively
    complete all the requests. However, care should be taken not to overload a single
    host with requests when using this feature.


    ```

    `<?php`

    ```'
