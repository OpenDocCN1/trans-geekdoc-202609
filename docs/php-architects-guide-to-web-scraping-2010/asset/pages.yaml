    \ differ.\n\n```\n```php\n<?php\n// Procedural\n$issues = tidy_get_error_buffer($tidy);\n\
    \n// Object-oriented\n$issues = $tidy->errorBuffer;\n?>\n```\n```\n\nNote that\
    \ errorBuffer is a property of the $tidy object, not a method. Also note the slight\
    \ difference in naming conventions between the procedural function and the object\
    \ property, versus the consistency held throughout most other areas of the APIs.\n\
    \nThe error buffer contained within a string is in and of itself mostly useless.\
    \ Below is a code sample derived from a user contributed comment on the PHP manual\
    \ page for the tidy_get_error_buffer function. This parses individual components\
    \ of each issue into arrays where they are more easily accessible.\n\n```\n```php\n\
    <?php\npreg_match_all(\n        '/^(?:line (?:P<line>\\d+) column (?:P<column>\\\
    d+) - ?)' .\n        '(?:P<type>\\S+): (?:(?:(?:\\d+\\.?){4}):)?(?:P<message>.*)?$/m',\n\
    \        $tidy->errorBuffer, // or tidy_get_error_buffer($tidy)\n        $issues,\n\
    \        PREG_SET_ORDER\n);\n\nprint_r($issues);\n/*\nExample output:\n```\n```"
