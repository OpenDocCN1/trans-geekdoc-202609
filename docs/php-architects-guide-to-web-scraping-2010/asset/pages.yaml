- pgno: 118
  md: '# Chapter 10


    # DOM Extension


    Once the retrieved markup document has been cleaned up so that it validates, the
    next step is extracting useful data from it. For this, the ideal approach is to
    take advantage of the fact that the document is valid markup and apply an XML
    extension to it. PHP has several of these and the next few chapters will be devoted
    to covering them.


    The namesake of this chapter is the Document Object Model (DOM) extension. This
    extension gets its name from a standardized language-independent API for navigating
    and manipulating valid and well-formed XML and HTML documents. The standard is
    maintained and recommended by the World Wide Web Consortium (W3C), an organization
    devoted to emerging internet-related standards. The chapter won''t cover the DOM
    extension in its entirety, only parts that are relevant and essential to web scraping.


    > DOM XML

    The DOM extension is only available in PHP 5. Its PHP 4-compatible predecessor,
    the DOM XML extension, has a somewhat different API but shares many of the same
    concepts. Examples in this chapter will be restricted to the DOM extension. The
    related section of the PHP manual can be consulted for equivalent specifics in
    the DOM XML extension at http://php.net/manual/en/book.domxml.php.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Before going much further, you should be aware that there are two types of
    XML parsers: **tree parsers** and **pull parsers**. Tree parsers load the entire
    document into memory and allow you to access any part of it at any time as well
    as manipulate it. Pull parsers read the document a piece at a time and limit you
    to working with the current piece being read.


    The two types of parsers share a relationship similar to that between the `file_get_contents`
