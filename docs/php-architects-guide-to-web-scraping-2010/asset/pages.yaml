  md: "Element nodes can have attributes. When the iterator points to an element node,\
    \ the **hasAttributes** property indicates the presence of attributes and the\
    \ **getAttribute()** method can be used to obtain an attribute value in the form\
    \ of a string.\n\nThe example below uses both of these together to parse data\
    \ from an HTML table.\n\n```\n```php\n<?php\n$inTable = false;\n$tableData = array();\n\
    \nwhile ($doc->read()) {\n  switch ($doc->nodeType) {\n    case XMLREADER::ELEMENT:\n\
    \      if ($doc->localName == 'table'\n          && $doc->getAttribute('id') ==\
    \ 'thetable') {\n          $inTable = true;\n      } elseif ($doc->localName ==\
    \ 'tr' && $inTable) {\n        $row = count($tableData);\n        $tableData[$row]\
    \ = array();\n      } elseif ($doc->localName == 'td' && $inTable) {\n       \
    \ $tableData[$row][] = $doc->readString();\n      }\n      break;\n    case XMLREADER::END_ELEMENT:\n\
    \      if ($doc->localName == 'table' && $inTable) {\n        $inTable = false;\n\
    \      }\n      break;\n  }\n}\n?>\n```\n```\n\nThis showcases the main difference\
    \ between pull parsers and tree parsers: the former have no concept of hierarchical\
    \ context, only of the node to which the iterator is currently pointing. As such,\
    \ you must create your own indicators of context where they are needed.\n\nIn\
    \ this example, the node type is checked as nodes are read and any node that isn't\
    \ either an opening or closing element is ignored. If an opening element is encountered,\
    \ its name ($doc->localName) is evaluated to confirm that it's a table and its\
    \ **id** attribute value ($doc->getAttribute('id')) is also examined to confirm\
    \ that it has a value of 'thetable'. If so, a flag variable **$inTable** is set\
    \ to **true**. This is used to indi-"
