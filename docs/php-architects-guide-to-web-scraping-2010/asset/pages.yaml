    to an empty string so that cookie data is persisted in memory. `setCookies accepts
    an associative array of cookie name-value pairs just like the `cookie'' request
    option. `addCookies does the same thing, but merges the array contents into any
    existing cookie data rather than deleting the latter as `setCookies does.


    +   • Once the `send method is called on `$request, cookie data from the response
    is retrieved by calling the `getResponseCookies method.


    # HTTP Authentication


    The `httppauth'' request option is used to set credentials in the format `username:password''.
    The type of HTTP authentication to use is specified via the `httppauthtype'' request
    option using one of the pecl_http `HTTP_AUTH_\* constants, which are similar to
    those intended for the same purpose in the cURL extension.


    Lastly, the `unrestrictedauth'' request option can be set to `true if authentication
    credentials should be included in requests resulting from redirections pointing
    to a different host from the current one.'
