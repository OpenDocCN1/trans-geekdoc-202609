    # ## Connectivity


    The `timeout` configuration setting is an integer value specifying the number
    of seconds for which the client should attempt to connect to the server before
    timing out. In the event of a timeout, an instance of the exception `Zend_Http_Client_Adapter_Exception`
    will be thrown.


    By default, the client assumes that only one request will be performed on the
    connection it establishes. That is, it will automatically include a `Connection`
    header with a value of `close`. When sending multiple requests to the same host,
    the `keepalive` configuration can be set to `true` to have all requests sent on
    the same connection for improved performance.


    # ## Debugging


    The last request sent by the client can be obtained in the form of a string via
    its `getLastRequest` method. For the last response received, the corresponding
    method `getLastResponse` can be called. This returns an instance of `Zend_Http_Response`
    rather than a string. To convert this object to a string, call its `asString`
    method. See below for examples of both.


    ```

    ```

    <?php

    $requestString = $client->getLastRequest();

    $responseObject = $client->getLastResponse();

    $responseString = $responseObject->asString();

    ?>

    ```

