    # ## Basic HTTP Authentication


    Another less frequently used method of persisting identity between requests is
    HTTP authentication. Most third-party clients offer some form of native support
    for it. It’s not commonly used these days, but it’s good to be aware of how to
    derive the appropriate header values in cases where you must implement it yourself.
    For more information on HTTP authentication, see RFC 2617.


    HTTP authentication comes in several “flavors,” the more popular two being Basic
    (unencrypted) and Digest (encrypted). Basic is the more common of the two, but
    the process for both goes like this.


    +   * A client sends a request without any authentication information.

    * The server sends a response with a 401 status code and a `WWW-Authenticate`
    header.

    * The client resends the original request, but this time includes an `Authorization`
    header including the authentication credentials.

    * The server either sends a response indicating success or one with a 403 status
    code indicating that authentication failed.


    In the case of Basic authentication, the value of the `Authorization` header will
    be the word `Basic` followed by a single space and then by a Base64-encoded sequence
    derived from the username-password pair separated by a colon. If, for example,
    the username is `bigbadwolf` and the password is `letmein` then the value of the
    header would be `Basic YmlnYmFkd29sZnM6RtZWlru` where the Base64-encoded version
    of the string `bigbadwolf:letmein` is what follows `Basic`.'
