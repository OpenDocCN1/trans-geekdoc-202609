- pgno: 188
  md: '# Appendix B


    # Multiprocessing


    When a PHP script is executed using the CLI SAPI (i.e. from a command line), that
    instance of execution exists as a process in the local operating system. The Process
    Control (pcntl) extension makes it possible for PHP scripts to perform what is
    called a process **fork**. This entails the original PHP process (then called
    the **parent process**) creating a copy of itself (appropriately called the **child
    process**) that includes everything from the data associated with the process
    to the current point of execution following the fork instruction.


    Once the fork completes, both processes exist and execute independently of each
    other. The parent process can fork itself multiple times in succession and retains
    a limited awareness of its child processes. In particular, it is notified when
    any given child process terminates.


    Because each child process is a copy of its parent process, the number of child
    processes that can be forked is limited by the hardware resources of the local
    system. CPU will merely limit the speed at which all child processes can complete.
    Memory, however, can become a bottleneck if the local system''s RAM is exceeded
    and it has to resort to using swap space for storage.


    This restriction creates the desire to fork as many processes as possible to complete
    a job in parallel without hitting any resource limits. This is generally achieved
    by using a predetermined cap on the number of processes to fork. Once any given
    child processes completes, however, it may be desirable to create a new child
    process'
  merge: -1
  img_proc: true
- pgno: 189
  md: "in its place to complete another unit of work. An implementation of this is\
    \ presented in the example below.\n\n```\n<?php\n// Maximum number of child processes\
    \ to fork\n$children_max = 10;\n\n// Counter for current number of child processes\n\
    $children_count = 0;\n\n// Temporary variable for the status of a terminated child\
    \ process\n$child_status = null;\n\n// Process identifier, initialized so the\
    \ parent branch executes\n$pid = 1;\n\nwhile (true) {\n    if ($pid == -1) {\n\
    \        trigger_error('Unable to fork process', E_USER_ERROR);\n    } elseif\
    \ ($pid) {\n        // Parent process\n\n        // Check for more work\n\n  \
    \      // Break out of the loop if the job is finished\n\n        // Fork another\
    \ child\n        $children_count++;\n        $pid = pcntl_fork();\n\n        //\
    \ Wait to fork more children if the max is reached\n        if ($children_count\
    \ == $children_max) {\n            pcntl_wait($child_status);\n            $children_count--;\n\
    \        }\n    } else {\n        // Child process\n\n        // Perform a unit\
    \ of work\n\n        exit;\n    }\n}\n?>\n```"
