- pgno: 162
  md: '# Chapter 14


    # PCRE Extension


    There are some instances where markup documents may be so hideously malformed
    that they''re simply not usable by an XML extension. Other times, you may want
    to have a way to check the data you''ve extracted to ensure that it''s what you
    expect. Changes to the structure of markup documents may be significant, to the
    point where your CSS or XPath queries return no results. They may also be small
    and subtle, such that while you do get query results, they contain less or different
    data than intended.


    While either of these tasks could be done with basic string handling functions
    and comparison operators, in most cases the implementation would prove to be messy
    and unreliable. **Regular expressions** provide a syntax consisting of **meta-characters**
    whereby patterns within strings are expressed flexibly and concisely. This chapter
    will deal with regular expressions as they relate to the Perl-Compatible Regular
    Expression (PCRE) PHP extension in particular.


    A common bad practice is to use only regular expressions to extract data from
    markup documents. While this may work for simple scripts that are only intended
    to be used once or very few times in a short time period, it is more difficult
    to maintain and less reliable in the long term. Regular expressions simply were
    not designed for this purpose, whereas other markup-specific extensions discussed
    in previous chapters are more suited for the task. It is a matter of using the
    best tool for the job, and to that end, this practice should be avoided.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# POSIX Extended Regular Expressions


    Many PHP developers will cut their teeth on regular expressions using the POSIX
    regular expression extension, also called the ereg extension. The functions from
    this extension are being deprecated in PHP 5.3 in favor of those in the PCRE extension,
    which are faster and provide a more powerful feature set. Aside from differences
    in syntax for some special character ranges, most ereg expressions require only
    the addition of expression delimiters to work with preg functions.


    # Pattern Basics


    Let''s start with something simple: detection of a substring anywhere within a
    string.


    ```


    <?php

    // Substring detection with a basic string function

    $present = (strpos($string, ''foo'') !== false);


    // Same with a PCRE function

    $present = (preg_match(''/foo/'', $string) === 1);

    ?>


    ```


    Notice that the pattern in the `preg_match()` call is fairly similar to the string
    used in the `strpos()` call. In the former, `/` is used on either side of the
    pattern to indicate its beginning and end. The first character in the pattern
    string is considered to be the pattern delimiter and can be any character you
    specify. When choosing what you want to use for this character (`/` is the most
    common choice), bear in mind that you will have to escape it (covered in the Escaping
    section later) if you use it within the pattern. This will make more sense a little
    later in the chapter.


    A difference between the two functions used in this example is that `strpos()`
    returns the location of the substring within the string beginning at `0` or `false`
    if the substring is not contained within the string. This requires the use of
    the `!==` operator to tell the difference between the substring being matched
    at the beginning of the string or not at all. By contrast, `preg_match()` returns
    the number of matches it found. This will be either `0` or `1` since `preg_match()`
    stops searching once it finds a match.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Anchors


    You may want to check for the presence of a pattern at the beginning or end of
    a string rather than simply checking to see if the pattern is contained anywhere
    within the string. The meta-characters for this are collectively referred to as
    **anchors**.


    ```

    ```php

    <?php

    // Beginning of the string with a basic string function

    $start = (strpos($string, ''foo'') === 0);


    // Same with a PCRE function

    $start = (preg_match(''/^foo/'', $string) == 1);


    // End of the string with basic string functions

    $end = (substr($string, - strlen(''foo'')) == ''foo'');


    // Same with a PCRE function

    $end = (preg_match(''/foo$/'', $string) == 1);


    // Means the same as an exact match with the string

    $equal = (preg_match(''/^foo$/'', $string) == 1);

    ?>

    ```

    ```


    +   * `^` (also called the circumflex character) is used at the beginning of an
    expression within a pattern to indicate that matching should start at the beginning
    of a string.

    * Likewise, `$` is used to indicate that matching of an expression within a pattern
    should stop at the end of a string.

    * When used together, `^` and `$` can indicate that the entirety of `$string`
    matches the pattern exactly.


    > **Start of String or Line**

    It''s important to note that the behavior of these two operators can vary. By
    default, they match the beginning and end of `$string`. If the multi-line modifier
    is used, they match the beginning and end of each line in `$string` instead. This
    will be covered in more detail later in the Modifiers section of this chapter.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'It''s possible to check for multiple expressions simultaneously in a single
    pattern, also called **alternation**, using the pipe meta-character `|`.


    ```

    ```php

    <?php

    // Matches ''foo'' or ''bar'' or ''baz'' anywhere

    $matches = (preg_match(''/foo|bar|baz/'', $string) == 1);

    ?>

    ```

    ```


    Note that the `^` and `$` are not implicitly applied to all expressions in an
    alternation; they must be used explicitly for each expression.


    ```

    ```php

    <?php

    // $result == 1

    $result = preg_match(''/^foo|bar/'', ''abar'');


    // $result == 0

    $result = preg_match(''/^foo|^bar/'', ''abar'');

    ?>

    ```

    ```


    The first example returns 1 because `abar` contains `bar`, since `^` is not applied
    to that expression in the pattern. The second example does apply `^` to `bar`
    and, since `abar` begins with neither `foo` nor `bar`, it returns 0.


    Part of a pattern may or may not be present, or may be repeated a number of times.
    This is referred to as **repetition** and involves using meta-characters collectively
    referred to as **quantifiers**.


    ```

    ```php

    <?php

    // Matches ''a'' 0 times or 1 time if present

    $matches = (preg_match(''/a?/'', $string) == 1);


    // Matches ''a'' 0 or more times, however many that may be

    $matches = (preg_match(''/a*/'', $string) == 1);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 166
  md: '```

    // Matches ''a'' 1 or more times, however many that may be

    $matches = (preg_match(''/a+/'', $string) == 1);


    // Matches ''a'' 0 times or 1 time if present, same as ?

    $matches = (preg_match(''/a{0,1}/'', $string) == 1);


    // Matches ''a'' 0 or more times, same as *

    $matches = (preg_match(''/a{0,}/'', $string) == 1);


    // Matches ''a'' 1 or more times, same as +

    $matches = (preg_match(''/a{1,}/'', $string) == 1);


    // Matches ''a'' exactly 2 times

    $matches = (preg_match(''/a{2}/'', $string) == 1);

    ?>

    ```


    Note that any use of curly brackets that is not of the form {X}, {X,}, or {X,Y}
    will be treated as a literal string within the pattern.


    # ## Subpatterns


    You’ll notice in the examples from the previous section that only a single character
    was used. This is because the concept of **subpatterns** hadn’t been introduced
    yet. To understand these, it’s best to look an example that doesn’t use them in
    order to understand the effect they have on how the pattern matches.


    ```

    <?php

    // Matches ''a'' follow by one or more instances of ''b''

    $matches = (preg_match(''/ab+/'', $string) == 1);

    ?>

    ```


    Without subpatterns there would be no way to match, for example, one or more instances
    of the string ''ab''. Subpatterns solve this pattern by allowing individuals parts
    of a pattern to be grouped using parentheses.


    ```

    <?php

    // Matches ''ab'' one or more times

    $matches = (preg_match(''/(ab)+/'', $string) == 1);

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: '```

    // Matches ''foo'' or ''foobar''

    $matches = (preg_match(''/foo(bar)?/'', $string) == 1);


    // Matches ''ab'' or ''ac''

    $matches = (preg_match(''/a(b|c)/'', $string) == 1);


    // Matches ''ab'', ''ac'', ''abb'', ''abc'', ''acb'', ''acc'', etc.

    $matches = (preg_match(''/a(b|c)+/'', $string) == 1);

    ```


    # Matching


    Subpatterns do a bit more than let you define parts of a pattern to which alternation
    or repetition apply. When a match is found, it''s possible to obtain not only
    the sub-

    string from the original string that matched the entire pattern, but also substrings
    that were matched by subpatterns.


    ```

    <?php

    if (preg_match(''/foo(bar)?(baz)?/'', $string, $match) == 1) {

    print_r($match);

    }

    ?>

    ```


    The third parameter to preg_match(), $match, will be set to an array of match
    data if a match is found. That array will contain at least one element: the entire
    substring that matched the pattern. Any elements that follow will be subpattern
    matches with an index matching that subpattern''s position within the pattern.
    That is, the first subpattern will have the index 1, the second subpattern will
    have the index 2, and so on.


    If a pattern is conditional (i.e. uses ?) and not present, it will either have
    an empty element value in the array or no array element at all.


    ```

    <?php

    if (preg_match(''/foo(bar)?/'', ''foo'', $match) == 1) {

    // $match == array(''foo'');

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: '```

    if (preg_match(''/foo(bar)?(baz)?/'', ''foobaz'', $match) == 1) {

    // $match == array(''foo'', '''', ''baz'');

    }

    ?>

    ```


    +   - In the first example, the `(bar)?` subpattern ends the entire pattern and
    is not matched. Thus, it has no entry in $match.

    - In the second example, the `(bar)?` subpattern does not end the entire pattern
    and is not matched. Thus, it has an empty entry in $match.


    Subpatterns can also contain other subpatterns.


    ```

    <?php

    if (preg_match(''/foo(ba(r|z))?/'', ''foobar'', $match) == 1) {

    // $match == array(''foobar'', ''bar'', ''r'');

    }

    ?>

    ```


    Aside from passing $match to print_r() or a similar function, an easy way to tell
    what a subpattern''s position will be in $match is to count the number of opening
    parentheses in the pattern from left to right until you reach the desired subpattern.


    Using the syntax shown above, any subpattern will be captured (i.e. have its own
    element in the array of matches). Captured subpatterns are limited to 99 and total
    subpatterns, captured or no, is limited to 200. While this realistically shouldn''t
    become an issue, it''s best to denote subpatterns that do not require capture
    using (?: instead of ( to begin them.


    Additionally, since PHP 4.3.3, subpatterns may be assigned meaningful names to
    be used as their indices in the array of matches when they are captured. To assign
    a name to a subpattern, begin it with the syntax (?P<name> instead of ( where
    name is the name you want to assign to that subpattern. This has the advantage
    of making code more expressive and easier to maintain as a result.'
  merge: -1
