  md: '# Chapter 7


    # Zend_Http_Client


    Zend Framework (often abbreviated ZF) was conceived in early 2005. Contrary to
    PEAR1, ZF tends to remain relatively current in the version of PHP it requires
    and often takes advantage of features available in newer versions. As of ZF 1.10.1,
    PHP 5.2.4 is required.


    Designed to take full advantage of the new object system introduced in PHP 5,
    ZF has a fully object-oriented API. The project team strives to maintain an E_STRICT
    level of compliance and good code coverage via unit testing.


    Among the components included in ZF is Zend_Http_Client, an HTTP client library
    with a fairly comparable feature set to the others already covered in previous
    chapters. With that, let’s move into how it works.


    # Basic Requests


    Let’s start with a basic request.


    ```

    ```php

    <?php

    $client = new Zend_Http_Client;

    $client->setUri(''http://localhost.example'');

    $response = $client->request();


    // This does the same thing

    $client = new Zend_Http_Client(''http://localhost.example'');

    $response = $client->request(''GET'');

    ```

    ```'
