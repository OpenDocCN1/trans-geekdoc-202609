- pgno: 169
  md: '# # Escaping


    There may be instances where you want to include literal characters in patterns
    that are usually interpreted as meta-characters. This can be accomplished via
    a \ meta-character.


    ```

    ```php

    <?php

    // Matches literal [

    $matches = (preg_match(''/\\[/'', $string) == 1);


    // Matches literal \\

    $matches = (preg_match(''/\\\\/'', $string) == 1);


    // Matches expression delimiter /

    $matches = (preg_match(''/\\//'', $string) == 1);


    // Matches any of the standard escape sequences \r, \n, or \t

    $matches = (preg_match(''/\\r|\\n|\\t/'', $string) == 1);

    ?>

    ```

    ```


    Note that it is necessary to double-escape `"` in the second example because the
    string `''` is interpreted to be a single backslash by PHP whether or not it is
    used in a regular expression. In other cases, no escaping of `"` is needed for
    the escape sequence to be interpreted properly.


    > **Double Escaping**


    For more information on the reasoning behind the double-escape example in this
    section, see `http://php.net/manual/en/language.types.string.php#language.types.string`
    and the Backslash section of `http://php.net/manual/en/regexp.reference.php`.


    # # Escape Sequences


    There are three ways to match a single character that could be one of several
    characters.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'The first way involves using the . meta-character, which will match any single
    character except a line feed ("\n") without use of modifiers (which will be covered
    later). This can be used with repetition just like any other character.


    The second way requires using special escape sequences that represent a range
    of characters. Aside from the escape sequences mentioned in the previous section''s
    examples, here are some that are commonly used.


    +   - \d: a digit, 0 through 9.

    - \h: a horizontal whitespace character, such as a space or a tab.

    - \v: a vertical whitespace character, such as a carriage return or line feed.

    - \s: any whitespace character, the equivalent of all characters represented by
    \h and \v.

    - \w: any letter or digit or an underscore.


    Each of these escape sequences has a complement.


    +   - \D: a non-digit character.

    - \H: a non-horizontal whitespace character.

    - \V: a non-vertical whitespace character.

    - \S: a non-whitespace character.

    - \W: a character that is not a letter, digit, or underscore.


    The third and final way involves using **character ranges**, which are characters
    within square brackets ([ and ]). A character range represents a single character,
    but like normal single characters they can have repetition applied to them.


    ```

    <?php

    // Matches the same as \d

    $matches = (preg_match(''/[0-9]/'', $string) == 1);


    // Matches the same as \w

    $matches = (preg_match(''/[a-zA-Z0-9_]/'', $string) == 1);

    ?>

    ```'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Ranges are respective to ASCII (American Standard Code for Information Inter-change).
    In other words, the ASCII value for the beginning character must pre-cede the
    ASCII value for the ending character. Otherwise, the warning “Warning: preg_match():
    Compilation failed: range out of order in character class at offset $n$” is emitted,
    where $n$ is character offset within the regular expression.


    Within square brackets, single characters and special ranges are simply listed
    side by side with no delimiter, as shown in the second example above. Additionally,
    the escape sequences mentioned earlier such as \w can be used both inside and
    outside square brackets.


    ![](img/1e839861f06c77df9ecabc0aed9127b5_171_0.png)


    # ### ASCII Ranges


    For an excellent ASCII lookup table, see http://www.asciitable.com.


    There are two other noteworthy points about character ranges, as illustrated in
    the examples below.


    ```

    <?php

    // Using a literal ] in a character range is done like so

    $matches = (preg_match(''/[\]]/'', $string) == 1);


    // Matches any character that is not ''a''

    $matches = (preg_match(''/[^a]/'', $string) == 1);


    // Using a literal ^ in a character range is done like so

    $matches = (preg_match(''/[\^]/'', $string) == 1);

    $matches = (preg_match(''/[a^]/'', $string) == 1);

    ?>

    ```


    +   - To use a literal ] character in a character range, escape it in the same
    manner in which other meta-characters are escaped.


    +   - To negate a character range, use ^ as the first character in that character
    range. (Yes, this can be confusing since ^ is also used to denote the beginning
    of a line or entire string when it is not used inside a character range.) Note
    that nega-tion applies to all characters in the range. In other words, a negated
    character range means “any character that is not any of these characters.”'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   • To use a literal `^` character in a character range, either escape it
    in the same manner in which other meta-characters are escaped or do not use it
    as the first or only character in the range.


    # ctype Extension


    Some simple patterns have equivalent functions available in the ctype library.
    These generally perform better and should be used over PCRE when appropriate.
    See http://php.net/ctype for more information on the ctype extension and the functions
    it offers.


    # Modifiers


    The reason for having pattern delimiters to denote the start and end of a pattern
    is that the pattern precedes **modifiers** that affect the matching behavior of
    meta-characters. Here are a few modifiers that may prove useful in web scraping
    applications.


    +   • i: Any letters in the pattern will match both uppercase and lowercase regardless
    of the case of the letter used in the pattern.


    +   • m: `^` and `$` will match the beginning and ends of lines within the string
    (delimited by line feed characters) rather than the beginning and end of the entire
    string.


    +   • s (lowercase): The `.` meta-character will match line feeds, which it does
    not by default.


    +   • S (uppercase): Additional time will be spent to analyze the pattern in order
    to speed up subsequent matches with that pattern. Useful for patterns used multiple
    times.


    +   • U: By default, the quantifiers `*` and `+` behave in a manner referred to
    as “greedy.” That is, they match as many characters as possible rather than as
    few as possible. This modifier forces the latter behavior.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   - u: Forces pattern strings to be treated as UTF-8 encoded strings.


    The example below matches because the *i* modifier is used, which means that the
    pattern matches ''`a`'' and ''`A`''.


    ```

    ```php

    <?php

    $matches = (preg_match(''/a/i'', ''A'') == 1);

    ?>

    ```


    # ## Wrap-Up


    This chapter has covered the most essential aspects of regular expressions that
    apply to validation of scraped data. There are more advanced aspects of regular
    expressions that may be useful in other areas. Further review of the PCRE section
    of the PHP manual is encouraged.


    +   - For pattern modifiers, see [http://php.net/manual/en/reference.pcre.pattern.modifiers.php](http://php.net/manual/en/reference.pcre.pattern.modifiers.php).

    - For pattern syntax, see [http://php.net/manual/en/reference.pcre.pattern.syntax.php](http://php.net/manual/en/reference.pcre.pattern.syntax.php).

    - For an excellent book on regular expressions, see “Mastering Regular Expressions,”
    ISBN 0596528124.'
