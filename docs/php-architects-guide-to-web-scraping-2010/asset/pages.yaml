  md: '+   CURLOPT_RETURNTRANSFER is set to `true` in the `curl_setopt_array` call
    even though the return value of `curl_exec` isn''t captured. This is simply to
    prevent unwanted output.


    +   CURLINFO_HEADER_OUT is set to `true` in the `curl_setopt_array` call to indicate
