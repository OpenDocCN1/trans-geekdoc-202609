- pgno: 146
  md: "# ## DOM Interoperation\n\nOne nice feature of the XMLReader extension is the\
    \ expand() method, which returns an object of the equivalent DOM extension class\
    \ for the node to which the iterator currently points. Element nodes, for example,\
    \ cause this method to return a DOMElement instance.\n\nThe example below illustrates\
    \ a modification to the previous example and provides another alternative to the\
    \ readString() method for getting at the contents of table cells by taking advantage\
    \ of this DOM interoperability.\n\n```\n```php\n<?php\nif ($doc->localName ==\
    \ 'td' && $inTable) {\n    $node = $doc->expand();\n    $tableData[$row][] = $node->nodeValue;\n\
    }\n?>\n```\n```\n\n# ## Closing Documents\n\nOnce all necessary read operations\
    \ have been conducted on a document, the close() method of the XMLReader instance\
    \ should be called to cleanly terminate file access or otherwise indicate that\
    \ access to the original data source is no longer needed.\n\n# ## Wrap-Up\n\n\
    Hopefully this chapter has given you an idea of how pull parsers work in general\
    \ and when it's better to use one like XMLReader over a tree parser. For more\
    \ information on XMLReader, check out its section in the PHP manual at http://www.php.net/manual/en/book.xmlreader.php."
