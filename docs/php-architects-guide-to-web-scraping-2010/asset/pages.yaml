  md: '# ## Elements and Attributes


    At this point, the DOM transcends the tree analogy. There are multiple types of
    nodes, or to phrase that within the context of the DOM extension, `DOMNode` has
    multiple subclasses. The main two you''ll be dealing with are `DOMElement` for
    **elements** and `DOMAttr` for **attributes**. Here are how these concepts apply
    to the example in the last section.


    +   - `ul` is the name of an element.

    - `id` is the name of an attribute of the `ul` element.

    - `thelist` is the value of the `id` attribute.

    - `Foo` and `Bar` are the values of the `li` elements.


    # ## Locating Nodes


    Two methods of the `DOMDocument` class allow you to reduce the number of nodes
    you have to traverse to find the data you want fairly quickly.


    `getElementById` attempts to locate a single element that meets two criteria:
    1) it is a descendant of the document''s root element; 2) it has a given `id`
    attribute value. If such an element is found, it is returned as a `DOMElement`
    instance; if not, `null` is returned.


    `getElementsByTagName` attempts to locate all elements that meet two criteria:
    1) it is a descendant of the document''s root element; 2) it has a given element
    name (such as `ul`). This method always returns a `DOMNodeList` of any found elements.
    The `DOMNodeList` class has a `length` property that will be equal to 0 if no
    elements are found. It is also iterable, so it can be used as the subject of a
    `foreach` loop.


    The `DOMElement` class also has a `getElementsByTagName` method, which functions
    the same way with the exception that located elements will be descendants of that
    element instead of the document''s root element.


    ```

    ```php

    <?php

    // One way get the list items in the last example

    $listItems = $doc->getElementsByTagName(''li'');

    ```

    ```'
