    # ## Absoluting Addressing


    The process of using an XPath expression to obtain a set of nodes to which that
    expression applies is referred to as **addressing**. The remainder of the chapter
    will cover various aspects of addressing and related expression syntax.


    XPath expressions share several similarities with UNIX filesystem paths, both
    of which are used to traverse conceptual tree structures. See the example below
    for specific instances of this. The previous HTML example used to illustrate various
    concepts of markup languages is reused here to showcase XPath addressing.


    ```

    ```php

    <?php

    // Load a markup document

    $doc = new DOMDocument;

    $doc->loadHTML(''<

    <html>

    <body>

    <ul id="thelist">

    <li>Foo</li>

    <li>Bar</li>

    </ul>

    </body>

    </html>

    '');


    // Configure an object to query the document

    $xpath = new DOMXPath($doc);


    // Returns a DOMNodeList with only the html node

    $list = $xpath->query(''/html'');


    // Returns a DOMNodeList with only the body node

    $list = $xpath->query(''/html/body'');

    ```

