  md: '# # Chapter 8


    # ## Rolling Your Own


    First, it should go without saying that it''s generally better to use and build
    upon an existing library rather than trying to roll your own from scratch. For
    one thing, you can get a number of features “for free” that way with no work required
    on your part. For another, developers outside of your team and projects work on
    those libraries, and in the words of Eric S. Raymond, “Given enough eyes, all
    bugs are shallow.”


    However, it certainly doesn''t hurt to be familiar with this information even
    if you don''t plan to build your own client. Doing so gives you more capability
    to troubleshoot issues with existing libraries and contribute patches back to
    their project teams.


    Whatever your motivation, here we go.


    # ## Sending Requests


    In addition to wrappers for specific protocols, the streams extension also offers
    socket transports for dealing with data at a lower level. One of these socket
    transports is for TCP, or Transmission Control Protocol, which is a core internet
    protocol used to ensure reliable delivery of an ordered sequence of bytes. The
    socket transport facilitates sending a raw data stream, in this case a manually
    constructed HTTP request, to a server.


    ```

    ```php


    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: "```\n```php\n$stream = stream_socket_client('tcp://localhost.example:80');\n\
    $request = \"GET / HTTP/1.1\\r\\nHost: localhost.example\\r\\n\\r\\n\";\nfwrite($stream,\
    \ $request);\necho stream_get_contents($stream);\n\n/*\nExample output:\nHTTP/1.1\
    \ 200 OK\nDate: Wed, 21 Jan 2009 03:16:43 GMT\nServer: Apache/2.2.9 (Ubuntu) PHP/5.2.6-2ubuntu4\
    \ with Suhosin-Patch\nX-Powered-By: PHP/5.2.6-2ubuntu4\nVary: Accept-Encoding\n\
    Content-Length: 12\nConnection: close\nContent-Type: text/html\n\nHello world!\n\
    */\n```\n\n\n```\n\n+   - The stream_socket_client function is used to establish\
    \ a connection with the server, returning a connection handle resource assigned\
    \ to $stream. \n   - `tcp://` specifies the transport to use. \n   - `localhost.example`\
    \ is the hostname of the server. \n   - `:80` specifies the port on which to connect\
    \ to the server, in this case 80 because it is the standard port for HTTP. The\
    \ port to use depends on the configuration of the web server. \n   - `$request`\
    \ contains the request to be sent to the server, where individual lines are separated\
    \ with a CRLF sequence (see Chapter 2 “GET Requests”) and the request ends with\
    \ a double CRLF sequence (effectively a blank line) to indicate to the server\
    \ that the end of the request has been reached. Note that the request *must* contain\
    \ the ending sequence or the web server will simply hang waiting for the rest\
    \ of the request. \n   - The fwrite function is used to transmit the request over\
    \ the established connection represented by $stream."
