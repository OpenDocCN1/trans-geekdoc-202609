  md: "false once it reaches the end of the document. As such, it’s perfect for use\
    \ in a while loop as shown above.\n\n# Nodes\n\nAs in other extensions, each node\
    \ has a type that is stored in the reader’s nodeType property. The types in which\
    \ you are generally interested are still elements (XMLReader::ELEMENT) and attributes\
    \ (XMLReader::ATTRIBUTE), possibly also text (XMLReader::TEXT) and CDATA (XMLReader::CDATA)\
    \ elements as well. Additionally, the XMLReader extension has a node type for\
    \ ending elements (i.e. closing tags), XMLReader::END_ELEMENT. Its importance\
    \ will become more obvious in the next section.\n\nThe example below shows how\
    \ to check the node type against an appropriate constant. For a list of these\
    \ constants, see http://php.net/manual/en/class.xmlreader.php#xmlreader.constants.\n\
    \n```\n```php\n<?php\nwhile ($doc->read()) {\n    if ($doc->nodeType == XMLReader::ELEMENT)\
    \ {\n        var_dump($doc->localName);\n        var_dump($doc->value);\n    \
    \    var_dump($doc->hasValue);\n    }\n}\n?>\n```\n```\n\nAlso like other extensions,\
    \ nodes have names. There are two properties for this, name and localName. The\
    \ former represents the fully qualified name, including the namespace specification,\
    \ while the latter represents the node name by itself and is the one you will\
    \ generally want to use.\n\n# Elements and Attributes\n\nAttribute nodes can have\
    \ values. When the iterator points to an attribute node, the value property will\
    \ be populated with the node’s value and the hasValue property can be used to\
