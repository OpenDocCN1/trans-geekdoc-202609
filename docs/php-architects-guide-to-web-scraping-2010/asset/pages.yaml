  md: "# # Error Handling\n\nBefore PHP 5.3.0, an HTTP streams wrapper operation resulting\
    \ in an HTTP error response (i.e. a 4xx or 5xx status code) causes a PHP-level\
    \ warning to be emitted. This warning will only contain the HTTP version, the\
    \ status code, and the status code description. The function calls for such operations\
    \ generally return false as a result and leave you without a stream resource to\
    \ check for more information. Here's an example of how to get what data you can.\n\
    \n```\n```php\n<?php\nfunction error_handler($errno, $errstr, $errfile, $errline,\n\
    \          array $errcontext) {\n\n    // $errstr will contain something like\
    \ this:\n    // fopen(http://localhost.example/404): failed to open stream: \n\
    \    // HTTP request failed! HTTP/1.0 404 Not Found\n\n    if ($httperr = strstr($errstr,\
    \ 'HTTP/')) {\n\n        // $httperr will contain HTTP/1.0 404 Not Found in the\
    \ case\n        // of the above example, do something useful with that here\n\
    \    }\n}\n\nset_error_handler('error_handler', E_WARNING);\n\n// If the following\
    \ statement fails, $stream will be assigned false\n// and error_handler will be\
    \ called automatically\n$stream = fopen('http://localhost.example/404', 'r');\n\
    \n// If error_handler() does not terminate the script, control will\n// be returned\
    \ here once it completes its execution\nrestore_error_handler();\n?>\n```\n```\n\
    \nThis situation has been improved somewhat in PHP 5.3 with the addition of the\
