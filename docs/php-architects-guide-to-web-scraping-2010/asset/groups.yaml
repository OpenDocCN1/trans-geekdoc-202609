    # Chapter 9


    # Tidy Extension


    At this point, you should have completed the retrieval phase of the web scraping
    process and have your raw response body ready and awaiting analysis. Congratulations
    on making it to the halfway mark.


    While other response formats are certainly possible, chances are good that you
    are dealing with a markup-based language like HTML or XHTML. As such, this chapter
    and subsequent chapters will deal specifically with those formats. More often
    than not, HTML will be the language in use.


    There are a number of available XML-focused PHP extensions that can deal with
    markup, which will be reviewed in chapters to follow. While these extensions do
    provide some support for HTML and are even somewhat forgiving about malformed
    markup, well-formed XHTML is their ideal input. This being the case, the first
    step in the analysis process is to perform any necessary cleanup on the response
    body in order to minimize the number of issues that can be encountered later during
    analysis.


    # Validation


    The World Wide Web Consortium (W3C) provides a markup validation service in order
    to promote adherence to web standards. You can access this service by going to
    `http://validator.w3.org`. It accepts markup to be tested by URL, file upload,
    or'
  - '[PAGE 109]


    direct input. This will give you an indication of what issues, if any, your document
    has with markup malformation.


    # Tidy


    There are two ways to proceed in cleaning up markup malformations. One is manual,
    involves the use of basic string manipulation functions or regular expression
    functions, and can quickly become messy and rather unmanageable. The other is
    more automated and involves using the tidy extension to locate and correct markup
    issues. While the process is configurable, it obviously lacks the fine-grained
    control that comes with handling it manually.


    The majority of this chapter will focus on using tidy to correct markup issues.
    For those issues that tidy cannot handle to your satisfaction, the approach mentioned
    earlier involving string and regular expression functions is your alternative.
    Regular expressions will be covered in more detail in a later chapter.


    The tidy extension offers two API styles: procedural and object-oriented. Both
    offer mostly equivalent functionality (relevant differences will be covered later)
    and which to use is really a matter of preference. Though both API styles use
    objects of the tidy class, it is recommended that only one style be used as much
    as is feasible for the sake of consistency in syntax. Code examples in this chapter
    will use both styles.


    # Input


    Before correcting markup issues in a set of markup data, the data has to be parsed
    into a tidy object. More often than not markup data will already be contained
    within a string when it is ready to be parsed, but may also be stored in an external
    file. See below for example of how to handle either of these cases.


    ```

    ```php

    <?php

    // Procedural

    $tidy = tidy_parse_string($string, $config);

    $tidy = tidy_parse_file($filename, $config);


    // Object-oriented

    ```

