    * `li:first` selects only the first li node found in the document.

    * `li:last` likewise selects the last li node found in the document.

    * `li:even` selects all evenly positioned nodes in the document beginning from
    0.

    * `li:odd` likewise selects all oddly positioned nodes in the document, also beginning
    from 0.

    * `li:eq(0)` selects the li node with a position of 0 within the set of li nodes
    (i.e. the first one) in the document.

    * `li:gt(0)` selects all li nodes with a position greater than 0 within the set
    of li nodes (i.e. all but the first one) in the document.

    * `li:lt(1)` selects all li nodes with a position less than 1 within the set of
    li nodes (i.e. the first one) in the document.

    * `:header` matches all header nodes. (i.e. h1, h2, etc.)

    * `:not(:first)` negates the `:first` selector and thus selects all li nodes except
    the first one in the document.


    | Selector | CSS | XPath |

    | --- | --- | --- |

    | first node | `li:first` | `//li[1]` |

    | last node | `li:last` | `//li[last()]` |

    | even nodes | `li:even` | `//li[position() mod 2 = 0]` |

    | odd nodes | `li:odd` | `//li[position() mod 2 = 1]` |

    | specific node | `li:eq(0)` | `//li[1]` |

    | all nodes after | `li:gt(0)` | `//li[position() > 1]` |

    | all nodes before | `li:lt(1)` | `//li[position() < 2]` |

    | header nodes | `:header` | `//h1//h2//h3//h4//h5//h6` |

    | all nodes not matching an expression | `:not(:first)` | `/*[not(position() =
    1)]` |


    Note when reading this table that CSS selectors begin set indices at 0 whereas
    XPath begins them at 1.


    ## Content Filters


    Where basic filters are based mainly on the type of node or its position in the
    result set, content filters are based on node value or surrounding hierarchical
    structure.


    * `a:contains("About Us");` selects all a nodes where the node value contains
    the substring “About Us”.

    * `img:empty` selects all img nodes that contain no child nodes (including text
    nodes).

    * `li:has(a:contains("About Us"))` selects all li nodes that contain an a node
    with the substring “About Us” in its node value.

    * `li:parent` selects all li nodes that contain child nodes (including text nodes).


    | **Selector** | **CSS** | **XPath** |

    |---|---|---|

    | nodes containing text | `a:contains("About Us")` | `//a[contains(text(), "About
    Us")]` |

    | nodes without children | `img:empty` | `//img[not(node())]` |

    | nodes containing a selector match | `li:has(a:contains("About Us"))` | `//li[//a[contains(text(),
    "About Us")]]` |

    | nodes with children | `li:parent` | `//li[node()]` |


    ## Attribute Filters


    Filters up to this point have been specific to element nodes, but they also exist
    for attribute nodes. Attribute filters are surrounded by square brackets in both
    CSS and XPath, but differ in that CSS uses mostly operators for conditions while
    XPath uses mostly functions. Unlike other filters described in this chapter, support
    for attribute filters is fairly universal between different libraries.


    * `[href]` matches all nodes that have an attribute node with the name `href`.

    * `[href="/home"]` matches all nodes with an attribute node named `href` that
    has a value of "/home".

    * `[href!="/home"]` matches all nodes with an attribute node named `href` that
    do not have a value of "/home".

    * `[href^="/"]` matches all nodes with an attribute node named `href` and have
    a value that starts with "/".

    * `[href$="-us"]` matches all nodes with an attribute node named `href` and have
    a value that ends with "-us".

    * `[href*="-us"]` matches all nodes with an attribute node named `href` and have
    a value that contains "-us" anywhere within the value.

    * `[src*="ad"][alt^="Advertisement"]` matches all nodes that have both an attribute
    node named `src` with a value containing "ad" and an attribute node named `alt`
    with a value starting with "Advertisement".


    | Selector | CSS | XPath |

    | :--- | :--- | :--- |

    | has attribute | `[href]` | `//*[@href]` |

    | has attribute value | `[href="/home"]` | `//*[@href="/home"]` |


    ## Child Filters


    Child filters are fairly similar to the basic filters reviewed earlier, except
    applied to child nodes.


    * `ul:nth-child(2)` selects the second child element within each ul node. The
    parameter passed to the filter can also be even or odd (which are figured relative
    to child position within the parent element) or can use expressions involving
    a variable *n* (such as 3n for every third child).

    * `li:first-child` selects all li nodes that are the first child of their parent
    node.

    * `li:last-child` likewise selects all li nodes that are the last child of their
    parent node.

    * `li:only-child` selects all li nodes that are the only child of their parent
    node.


    | Selector | CSS | XPath |

    | :--- | :--- | :--- |

    | nth child nodes | `ul:nth-child(2)` | `//ul/*[position() = 2]` |

    | first child nodes | `li:first-child` | `//***/[name() = "li" and position()
    = 1]` |

    | last child nodes | `li:last-child` | `//***/[name() = "li" and position() =
    last()]` |

    | only child nodes | `li:only-child` | `//***/[name() = "li" and count() = 1]`
    |


    ## Form Filters


    Form filters are just a more convenient shorthand for other expressions.


    * `:input` matches all input, textarea, select, and button elements.

    * `:text`, `:hidden`, `:password`, `:radio`, `:checkbox`, `:submit`, `:image`,
    `:reset`, and `:file` all matches input elements with their respective types.

    * `:button` matches all button elements and input elements of type button.

    * `:enabled` matches all form elements that are not disabled, `:disabled` matches
    those that are.

    * `:checked` matches all radio and checkbox elements that are checked.

    * `:selected` matches all option elements that are selected.


    | Selector | CSS | CSS Alt | XPath |

    | :--- | :--- | :--- | :--- |

    | all form elements | `:input` | `input, textarea, select, button` | `//input
    \|//textarea \|//select \|//button` |

    | form elements of specific types | `:text` | `input[type="text"]` | `//input[type="text"]`
    |

    | button elements | `:button` | `button, input[type="button"]` | `//button \|//input[type="button"]`
    |

    | enabled elements | `:enabled` | `:not([disabled="disabled"])` | `//*[contains("input
    textarea select button", name()) and not(@disabled) or @disabled!="disabled"]`
    |

    | disabled elements | `:disabled` | `[disabled="disabled"]` | `//*[contains("input
    textarea select button", name()) and @disabled="disabled"]` |

    | checked elements | `:checked` | `:input[checked="checked"]` | `//input[contains("checkbox
    radio", @type) and @checked="checked"]` |

    | selected elements | `:selected` | `option[selected="selected"]` | `//option[@selected="selected"]`
    |


    ## Libraries


    At this point, CSS selectors have been covered to the extent that all or a subset
    of those supported by a given library are explained. This section will review
    some library implementations that are available, where to find them, what feature
    set they support, and some advantages and disadvantages of using them.


