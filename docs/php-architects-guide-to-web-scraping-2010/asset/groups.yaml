    DNS 缓存，这种优势可能会更明显。


    DNS，即域名系统，是一种以类似使用姓名查找电话号码的方式来为域名推导 IP 地址的系统。为域名获取 IP 地址的过程称为 DNS 查询，就所需时间而言可能是一个代价高昂的操作。


    由于 DNS 查询的结果并不经常变化，通常使用 DNS 缓存来在查询执行后的特定时间段内保留结果。这可以在多个层级完成，包括源代码层级（如 cURL）、操作系统原生层级，或通过本地或远程服务器（如互联网服务提供商使用的服务器）上的软件（如
