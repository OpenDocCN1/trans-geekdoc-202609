    \ 10));\n\n// If Content-Encoding is deflate...\n$decoded = gzuncompress($body);\n\
    ?>\n```\n\n- 是的，函数名称是正确的。人们可能会认为使用 `deflate` 编码方案编码的正文应该使用 `gzinflate` 来解码。显然，这只是\
    \ zlib 库使用的命名方案中的一个怪癖。\n- 当编码方案为 `gzip` 时，响应中会包含一个 GZIP 头部。`gzinflate` 对此响应不佳。因此，在将正文传递给\
    \ `gzinflate` 之前，会先去除该头部（包含在正文的前 10 个字节中）。\n\n有关内容编码的更多信息，请参见 RFC 2616 第 3.5 节。RFC\
    \ 1951 介绍了 `deflate` 编码方案所基于的 DEFLATE 算法的具体细节，而 RFC 1952 则详细说明了 `gzip` 编码方案所基于的\
    \ `gzip` 文件格式。\n\n### 时间控制\n\n每当 Web 服务器接收到一个请求时，都会创建或复用一个以进程或线程形式的独立执行流来处理该请求。如果不加控制，这可能会消耗服务器上的所有资源以应对大量的请求负载。因此，Web\
    \ 服务器通常会限制其可以并发处理的请求数量。超过此限制请求将被阻塞，直到服务器完成已分配资源现有的请求为止。长时间未得到服务的请求最终会超时。\n\n“节流”是一个术语，用于描述客户端向服务器发送过多请求，导致其消耗可用资源池，从而延迟或阻止请求处理（包括客户端自己最后发送的请求）的情况。显然，出于两个原因，避免这种行为是理想的：1)\
    \ 这可以被视为滥用行为，并可能导致你的 IP 被禁止访问服务器；2) 这阻碍了客户端保持持续的功能正常。\n\n大多数 Web 浏览器在加载特定资源及其依赖项时，每个域名最多建立四个并发连接。因此，这是测试托管目标应用程序的服务器负载的良好起点。在可能的情况下，测量单个请求的响应时间，并将其与并发发送的请求数量进行比较，以确定服务器能承受多大的负载。\n\
    \n根据应用程序的情况，与目标应用程序进行实时交互可能不是必需的。如果与目标应用程序及其处理数据的交互仅限于你的 Web 抓取应用程序的用户群，则可能可以在需要时检索数据，将其本地缓存，在本地存储修改，并在非高峰时段以批量方式将它们推送到目标应用程序。要确定这些时段是哪些，请观察请求发出时间与响应时间的关系，以找到响应时间\
    \ consistently 较高的时段。\n\n"
