    However, it can function independently and apart from the framework and provides
    the functionality needed in the analysis phase of web scraping. At the time of
    this writing, Zend Framework 1.10.1 requires PHP 5.2.4 or higher.


    Zend_Dom_Query makes extensive use of the DOM extension. It supports XPath through
    use of the DOM extension''s DOMXPath class and handles CSS expressions by transforming
    them into equivalent XPath expressions. Note that only CSS 2 is supported, which
    excludes non-attribute filters.

