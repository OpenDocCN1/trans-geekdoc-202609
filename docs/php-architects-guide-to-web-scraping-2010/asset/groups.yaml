    ## Chapter 2


    ### HTTP


    The first task that a web scraping application must be capable of performing is
    the retrieval of documents containing the information to be extracted. If you
    have used a web browser without becoming aware of all that it does “under the
    hood” to render a page for your viewing pleasure, this may sound trivial to you.
    However, the complexity of a web scraping application is generally proportional
    to the complexity of the application it targets for retrieving and extracting
    data.


    For targets consisting of multiple pages or requiring retention of session or
    authentication information, some level of reverse-engineering is often required
    to develop a corresponding web scraping application. Like a complex mathematics
    problem with a very simple answer, the development of web scraping applications
    can sometimes involve more analysis of the target than work to implement a script
    capable of retrieving and extracting data from it.


    This sort of reconnaissance requires a decent working knowledge of the **HyperText
    Transfer Protocol** or **HTTP**, the protocol that powers the internet. The majority
    of this chapter will focus on familiarization with that protocol. The end goal
    is that you become capable of performing the necessary research to learn how a
    target application works such that you are capable of writing an application to
    extract the data you want.


    ### Requests


    The HTTP protocol is intended to give two parties a common method of communication:
    **web clients** and **web servers**. Clients are programs or scripts that send
    requests to servers. Examples of clients include web browsers, such as Internet
    Explorer and Mozilla Firefox, and crawlers, like those used by Yahoo! and Google
    to expand their search engine offerings. Servers are programs that run indefinitely
    and do nothing but receive and send responses to client requests. Popular examples
    include Microsoft IIS and the Apache HTTP Server.


    You must be familiar enough with the anatomy and nuances of HTTP requests and
    responses to do two things. First, you must be able to configure and use your
    preferred client to view requests and responses that pass between it and the server
    hosting the target application as you access it. This is essential to developing
    your web scraping application without expending an excessive amount of time and
    energy on your part.


    Second, you must be able to use most of the features offered by a PHP HTTP client
    library. Ideally, you would know HTTP and PHP well enough to build your own client
    library or fix issues with an existing one if necessary. In principle, however,
    you should resort to finding and using an adequate existing library first and
    constructing one that is reusable as a last resort. We will examine some of these
    libraries in the next few chapters.


