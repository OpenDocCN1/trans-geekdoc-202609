    # Chapter 15


    # Tips and Tricks


    Chapters preceding this one are intended to lay out pertinent information about
    the skills required to build a web scraping application. This chapter focuses
    more on a collection of practical applications and methodologies for that material.
    It is meant to tie all previously covered material together and round out the
    book as a whole. Some topics covered here will be specific to a particular class
    of web scraping applications, some will be generally applicable, and most will
    assume that the application is intended for long-term use. Hopefully they will
    all illustrate what matters to consider when designing your application.


