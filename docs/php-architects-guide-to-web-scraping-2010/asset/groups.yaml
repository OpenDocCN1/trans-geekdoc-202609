    \n// Returns TRUE for 400- and 500-level status codes\nvar_dump($response->isError());\n\
    ?>\n```\n\n## URL 处理\n\n默认情况下，Zend_Http_Client 使用 Zend_Uri_Http 来验证传入客户端的任何 URI。使用非常规\
