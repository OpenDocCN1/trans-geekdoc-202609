    \ `DOMNode` 的 `previousSibling` 和 `nextSibling` 属性中。\n\n最后，某节点的子节点、这些子节点的子节点，依此类推，统称为**后代节点**。同样地，某节点的父节点、该父节点的父节点，依此类推，统称为**祖先节点**。\n\
    \n一个示例可能有助于展示这些术语。\n\n```html\n<html>\n<body>\n<ul id=\"thelist\">\n<li>Foo</li>\n\
