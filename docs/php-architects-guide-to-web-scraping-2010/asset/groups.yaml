    \n// This does the same thing\n$client = new Zend_Http_Client('http://localhost.example');\n\
    $response = $client->request('GET');\n\n// Another way to set the request method\n\
    $client->setMethod(Zend_Http_Client::GET);\n?>\n```\n\n- 请求的 URL 可以作为 `Zend_Http_Client`\
    \ 构造函数的第一个参数传入，或者在创建客户端实例后通过 `setUri` 方法传入。这两种方法都接受 URI 作为字符串或 `Zend_Uri_Http`\
    \ 实例。\n- 客户端的 `request` 方法用于发送请求，接受一个可选参数，即包含要使用的 HTTP 请求方法的字符串。默认使用 `GET`。也可以通过使用命名为该\
    \ HTTP 请求方法的客户端类常量，利用客户端的 `setMethod` 方法来设置 HTTP 请求方法。\n\n## 响应\n\n客户端 `request`\
    \ 方法返回的响应具有许多有用的访问器方法。\n\n```php\n<?php\n// Returns an integer containing the\
