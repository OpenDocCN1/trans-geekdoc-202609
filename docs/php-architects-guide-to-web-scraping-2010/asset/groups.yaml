    \ 的第一个（也是唯一的）子节点。\n- `ul` 是 `body` 的第一个（也是唯一的）子节点。\n- 包含**Foo**和**Bar**的 `li`\
    \ 节点分别是 `ul` 的第一个和最后一个子节点。\n- 包含**Bar**的 `li` 节点是包含**Foo**的 `li` 节点的下一个兄弟节点。\n\
    - 同样，包含**Foo**的 `li` 节点是包含**Bar**的 `li` 节点的上一个兄弟节点。\n- `ul` 和 `li` 节点是 `body`\
    \ 节点的后代。\n\n### 元素和属性\n\n至此，DOM 超越了树的类比。存在多种类型的节点，或者用 DOM 扩展的语境来表达，即 `DOMNode`\
    \ 拥有多个子类。您主要将要处理的是用于**元素**的 `DOMElement` 和用于**属性**的 `DOMAttr`。以下是这些概念在上节示例中的具体应用。\n\
    \n- `ul` 是一个元素的名称。\n- `id` 是 `ul` 元素的一个属性的名称。\n- `thelist` 是 `id` 属性的值。\n- `Foo`\
    \ 和 `Bar` 是 `li` 元素的值。\n\n### 定位节点\n\n`DOMDocument` 类的两种方法允许您相对快速地减少需要遍历的节点数量，以找到您想要的数据。\n\
    \n`getElementById` 试图定位满足两个条件的单个元素：1) 它是文档根元素的后代；2) 它具有给定的 `id` 属性值。如果找到这样的元素，则作为\
    \ `DOMElement` 实例返回；否则，返回 `null`。\n\n`getElementsByTagName` 试图定位满足两个条件的所有元素：1)\
    \ 它是文档根元素的后代；2) 它具有给定的元素名称（例如 `ul`）。此方法始终返回找到的任意元素的 `DOMNodeList`。`DOMNodeList`\
    \ 类有一个 `length` 属性，如果未找到任何元素，该属性将等于 0。它也是可迭代的，因此可以作为 `foreach` 循环的主题使用。\n\n`DOMElement`\
    \ 类也有一个 `getElementsByTagName` 方法，其功能相同，只是定位到的元素将是该元素的后代，而不是文档根元素的后代。\n\n```php\n\
    <?php\n// 获取上一示例中列表项的一种方法\n$listItems = $doc->getElementsByTagName('li');\n\n\
    // 一种更具体的方法（如果有多个列表时更好）\nif ($list = $doc->getElementById('thelist')) {\n\t$listItems\
    \ = $list->getElementsByTagname('li');\n}\n\n// 另一种方法，如果列表没有 id\n$lists = $doc->getElementsByTagname('ul');\n\
    if ($lists->length) {\n\t$list = $lists->item(0);\n\t$listItems = $list->getElementsByTagname('li');\n\
    }\n\n// 输出 \"thelist\"（不带引号）\necho $list->getAttribute('id');\n\n// 第一行输出 \"Foo\"\
    ，第二行输出 \"Bar\"\nforeach ($listItems as $listItem) {\n\techo $listItem->nodeValue,\
    \ PHP_EOL;\n}\n\n// 输出 <ul id=\"thelist\"> 和 </ul> 内的文本内容\necho $list->nodeValue;\n\
    ?>\n```\n\n# XPath 和 DOMXPath\n\n类似于正则表达式允许在字符串中找到字符模式的实例，XPath 允许在 XML 兼容的文档中找到节点模式的实例。这两种技术都是通过提供由**元字符**组成的语法来实现其目的的，从而以简洁明了的方式表达这些模式。在\
    \ DOM 扩展中，XPath 标准的 1.0 版本支持是作为**DOMXPath** 类实现的。\n\n**DOMXPath** 构造函数有一个必需的参数：现有的**DOMDocument**\
    \ 实例，查询将在该实例上执行。**DOMXPath** 还有两个相关的方法：evaluate 和 query。这两个方法的第一参数都是包含 XPath 表达式的字符串，用于查询文档。\n\
    \n可选地，可以与文档相关联的 **DOMNode** 实例可以作为第二个参数（$contextNode）传递给任一方法。当指定时，该节点将成为**上下文节点**，查询结果将被限制在该节点及其后代中。否则，假设文档的根元素为上下文节点。\n\
    \n*evaluate* 和 *query* 之间的区别在于，后者始终返回 *DOMNodeList* 的实例，而前者在仅找到一个结果时会尝试返回适当类型的结果。\n\
    \n### 绝对寻址\n\n使用 XPath 表达式获取该表达式应用的一组节点的过程被称为**寻址**。本章的其余部分将介绍寻址的各个方面以及相关表达式语法。\n\
    \nXPath 表达式与 UNIX 文件系统路径有几个相似之处，两者都用于遍历概念上的树结构。请参阅下面的具体实例。此处重新使用了上文中用于说明标记语言各种概念的\
    \ HTML 示例，以展示 XPath 寻址。\n\n```php\n<?php\n// 加载一个标记文档\n$doc = new DOMDocument;\n\
    $doc->loadHTML('\n<html>\n<body>\n<ul id=\"thelist\">\n<li>Foo</li>\n<li>Bar</li>\n\
    </ul>\n</body>\n</html>\n');\n\n// 配置用于查询文档的对象\n$xpath = new DOMXPath($doc);\n\
    \n// 返回仅包含 html 节点的 DOMNodeList\n$list = $xpath->query('/html');\n\n// 返回仅包含 body\
    \ 节点的 DOMNodeList\n$list = $xpath->query('/html/body');\n\n// 同样返回仅包含 body 节点的\
    \ DOMNodeList\n$list = $xpath->query('//body');\n?>\n```\n\n- 在前两个示例中请注意，即使在查询调用中未指定其他节点作为第二个参数（这意味着假设根节点（html）为上下文节点），根元素（html）也在表达式中被引用。\n\
    - 一个**单斜杠** / 表示父子关系。`/html/body` 寻址文档根 html 元素的所有作为子节点的 body 节点（在此情况下仅产生单个结果）。\n\
    - 一个**双斜杠** // 表示祖先后代关系。`//body` 寻址上下文节点的所有后代 body 节点（同样仅产生单个结果）。\n\n单斜杠和双斜杠运算符可以多次使用，并如以下所示相互组合。\n\
    \n```php\n<?php\n// 返回所有作为 body 节点后代的 ul 节点\n$list = $xpath->query('//body/ul');\n\
    \n// 返回所有作为 ul 节点子节点的 li 节点\n$list = $xpath->query('//body/ul/li');\n?>\n```\n\
    \n# 命名空间\n\n如果您尝试通过元素名称寻址节点，但本应得到结果时却未收到，有可能文档正在对节点进行命名空间处理。解决此问题的最简单方法是用条件替换元素名称。\n\
    例如，如果您使用的表达式是 `ul`，则忽略命名空间的等效表达式将是 `*[name()=\"ul\"]`，其中 `*` 是所有节点的通配符，`name`\
    \ 函数将节点名称与给定值进行比较。\n\n### 相对寻址\n\n上述示例使用所谓的**绝对寻址**，其概念类似于绝对文件系统路径。下一个示例涵盖使用*相对寻址*。\n\
    \n```php\n<?php\n// 返回所有具有 li 子节点的 ul 节点\n$list = $xpath->query('/body//ul/li/..');\n\
    ?>\n```\n\n其中 `/body//ul/li` 选择 `li` 节点，而 `/body//ul/li/..` 通过使用相对寻址（具体来说是 `..`）选择\
    \ `ul` 节点，这表明应返回寻址节点（`li`）的父节点，而不是寻址节点本身。请将其与在 UNIX 文件系统中使用相同序列引用当前目录的父目录进行比较。\n\
    \n### 寻址属性\n\n迄今为止的示例主要处理的是元素节点。XPath 也支持属性节点的选择。\n\n```php\n<?php\n// 返回所有 ul\
    \ 节点的 id 属性节点\n$list = $xpath->query('//ul/@id');\n\n// 返回所有具有 id 属性节点的 ul 节点\n\
    $list = $xpath->query('//ul/@id/..');\n\n// 返回所有 id 属性节点\n$list = $xpath->query('//@id');\n\
    ?>\n```\n\n- `/ul/@id` 寻址与作为上下文节点后代的 `ul` 元素节点相关联的所有 `id` 属性节点。\n- 请注意第二个示例中相对寻址的使用如何同样适用于属性节点，就像它适用于子元素节点一样。\n\
    \n"
