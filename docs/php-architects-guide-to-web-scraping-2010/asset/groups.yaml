    Beyond that, here are a few element-specific considerations to take into account.


    +   - input elements with a type attribute value of checkbox or radio that are
    not checked when the form on the web scraping application side is submitted should
    not have their value attribute values included when the POST request is eventually
    made to the target application. A common practice that negates this is positioning
    another element with a type attribute value of hidden with the same name as the
    checkbox element before that element in the document so that the value of the
    hidden element is assumed if the checkbox is not checked.


    +   - select elements may be capable of having multiple values depending on whether
    or not the multiple attribute is set. How this is expressed in the POST request
    can depend on the platform on which the target application is running. The best
    way to determine this is to submit the form on the target application via a client
    that can show you the underlying POST request being made.


    +   - input elements that have a maxLength attribute are restricted to values
    of that length or less. Likewise, select elements are restricted to values in
    the value attributes of their contained option child elements. Both should be
    considered when validating user-submitted data.'
