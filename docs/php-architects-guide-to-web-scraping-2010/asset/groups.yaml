    # Debugging


    Debugging transmitted requests and responses with pecl_http is actually pretty
    simple. Configure and send a request, then call the `getRawRequestMessage` and
    `getRawResponseMessage` methods on the request instance as shown below.


    ```

    ```php

    <?php

    $request = new HttpRequest(''http://localhost.example/index.php'');

    // configure $request

    $request->send();


    // returns a string containing the entire request

    echo $request->getRawRequestMessage();


    // returns a string containing the entire response

    echo $request->getRawResponseMessage();

    ?>

    ```

    ```


    # Timeouts


    As with cURL, pecl_http has options for handling timeouts.


    The ''timeout'' request option, which corresponds to `CURLOPT_TIMEOUT`, is the
    maximum number of seconds an entire request may take before timing out.


    Likewise the ''connecttimeout'' request option, the counterpart for `CURLOPT_CONNECTTIMEOUT`,
    is the maximum number of seconds that a connection attempt, which includes DNS
    resolution, may take.


    Finally the ''dns_cache_timeout'' request option, which is equivalent to `CURLOPT_DNS_CACHE_TIMEOUT`,
    is the maximum number of seconds that a DNS cache entry will be retained and defaults
    to 120 seconds (two minutes).


    # Content Encoding


    If you are unfamiliar with content encoding, see "Content Encoding" in Chapter
    8 for more information. To enable it when using pecl_http, the ''compress'' request
    option must be set to true.'
