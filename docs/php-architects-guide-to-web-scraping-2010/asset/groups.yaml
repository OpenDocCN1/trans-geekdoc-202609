    \ with a specific response value that the server will verify before it allows\
    \ the client to proceed. To derive that value requires use of the MD5 hash algorithm,\
    \ which in PHP can be accessed using the md5 or hash functions. Here is the process.\n\
    \n- Concatenate the appropriate username, the value of the realm key provided\
    \ by the server, and the appropriate password together separated by colons and\
    \ take the MD5 hash of that string. We’ll call this HA1. It shouldn't change for\
    \ the rest of the session.\n\n```php\n$ha1 = md5($username . ':testrealm@host.com:'\
    \ . $password);\n```\n\n- Concatenate the method and URI of the original request\
    \ separated by a colon and take the MD5 hash of that string. We'll call this HA2.\
    \ This will obviously vary with your method or URI.\n\n```php\n$ha2 = md5('GET:/wiki/Main_Page');\n\
    ```\n\n- Initialize a request counter that we'll call nc with a value of 1. The\
    \ value of this counter will need to be incremented and retransmitted with each\
    \ subsequent request to uniquely identify it. Retransmitting a request counter\
    \ value used in a previous request will result in the server rejecting it. Note\
    \ that the value of this counter will need to be expressed to the server as a\
    \ hexadecimal number. The dechex PHP function is useful for this.\n\n```php\n\
    $nc = 1;\n```\n\n- Generate a random hash using the aforementioned hashing functions\
    \ that we'll call the client nonce or cnonce. The time and rand functions may\
    \ be useful here. This can (and probably should) be regenerated and reset with\
    \ each request.\n\n```php\n$cnonce = md5($_SERVER['REMOTE_ADDR'] . microtime(true));\n\
    ```\n\n- Take note of the value of the nonce key provided by the server, also\
    \ known as the server nonce. We'll refer to this as simply the nonce. This is\
    \ randomly generated by the server and will expire after a certain period of time,\
    \ at which point the server will respond with a 401 status code. It will modify\
    \ the WWW-Authenticate header it returns in two noteworthy ways: 1) the key-value\
    \ pair stale=TRUE will be added; 2) the nonce value will be changed. When this\
    \ happens, simply rederive the response code as shown below with the new nonce\
    \ value and resubmit the original request (not forgetting to increment the request\
    \ counter).\n\n- Concatenate HA1, the server nonce (nonce), the current request\
    \ counter (nc) value, the client nonce you generated (cnonce), an appropriate\
    \ value (most likely \"auth\") from the comma-separated list contained in the\
    \ qop (quality of protection) key provided by the server, and HA2 together separated\
    \ by colons and take the MD5 hash of that string. This is the final response code.\n\
    \n```php\n$response = implode(':', array(\n    $ha1,\n    $nonce,\n    dechex($nc),\n\
    \    $cnonce,\n    'auth',\n    $ha2\n));\n```\n\n- Lastly, send everything the\
    \ server originally sent in the WWW-Authenticate header, plus the response value\
    \ and its constituents (except the password obviously), back to the server in\
    \ the usual Authorization header.\n\n```\nAuthorization: Digest username=\"USERNAME\"\
    ,\n                realm=\"testrealm@host.com\",\n                nonce=\"dcd98b7102dd2f0e8b11d0f600bfb6c093\"\
    ,\n                uri=\"/wiki/Main_Page\",\n                qop=\"auth\",\n \
    \               nc=00000001,\n                cnonce=\"0a4f113b\",\n         \
    \       response=\"6629fae49393a05397450978507c4ef1\",\n                opaque=\"\
    5cc069c403e8af9f0171e9517f40e41\"\n```\n\nSome third-party clients implement this,\
    \ some don't. Again, it's not commonly used, but it's good to be aware of how\
    \ to derive the appropriate header value in cases where you must implement it\
    \ yourself. For more information on HTTP authentication, see RFC 2617.\n\n## Wrap-Up\n\
    \nAt this point, you should feel comfortable looking at HTTP requests and responses\
    \ and be capable of deducing information about them by analyzing their individual\
    \ components. The next few chapters will expound upon this information by reviewing\
    \ several commonly used PHP HTTP client implementations.\n\n# Chapter 3\n\n##\
    \ HTTP Streams Wrapper\n\nAt this point, you should be fairly well-acquainted\
    \ with some of the general concepts involved in using an HTTP client. The next\
    \ few chapters will review some of the more popular mainstream client libraries,\
    \ particularly common use cases and the advantages and disadvantages of each.\
    \ The client covered in this chapter will be the HTTP streams wrapper.\n\nPHP\
    \ 4.3 saw the addition of the Streams extension to the core. According to the\
    \ related section of the PHP manual, the intention was to provide “a way of generalizing\
    \ file, network, data compression, and other operations which share a common set\
    \ of functions and uses.” Streams introduced several concepts, one of which is\
    \ a **wrapper**. The job of a wrapper is to define how a stream handles communications\
    \ in a specific protocol or using a specific encoding. One such protocol for which\
    \ a wrapper is available is HTTP.\n\nThe advantage to the HTTP streams wrapper\
    \ is that there is very little to learn in terms of the API. It’s fairly easy\
    \ to get something simple working quickly. The disadvantage is that it’s very\
    \ minimalistic in terms of the feature set offered. It gives you the ability to\
    \ send HTTP requests without having to construct them entirely on your own (by\
    \ specifying the body and optionally any headers you want to add) and access data\
    \ in the response. That’s about it. The ability to debug requests is one example\
    \ of a feature that it does not include at the time of writing.\n\nThe fact that\
    \ the wrapper is written in C is a bit of a double-edged sword. On the positive\
    \ side, there is a substantial performance difference between C code and PHP\n"
