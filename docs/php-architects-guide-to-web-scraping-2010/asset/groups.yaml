    \ setting must be enabled for this to work, which it is in most environments.\n\
    - In this example, the `file_get_contents` function call is equivalent to making\
    \ a GET request for the specified URL 'http://localhost.example'.\n- `$response`\
    \ will contain the response body after the call to the `file_get_contents` function\
    \ completes.\n- `$http_response_header` is implicitly populated with the HTTP\
    \ response status line and headers after the `file_get_contents` call because\
    \ it uses the HTTP streams wrapper *within the current scope*.\n\nWhile this example\
    \ does work, it violates a core principle of good coding practices: no unexpected\
    \ side effects. The origin of `$http_response_header` is not entirely obvious\
    \ because PHP populates it implicitly. Additionally, it's more restrictive because\
    \ the variable is only populated within the scope containing the call to `file_get_contents`.\
    \ Here's a better way to get access to the same data from the response headers.\n\
    \n```php\n<?php\n$handle = fopen('http://localhost.example', 'r');\n$response\
    \ = stream_get_contents($handle);\n$meta = stream_get_meta_data($handle);\nprint_r($meta['wrapper_data']);\n\
    ?>\n```\n\nLet’s step through this.\n\n- The resource `$handle` is created to\
    \ read from the URL http://localhost.example.\n- The `stream_get_contents` function\
    \ is called to read the remaining data on the stream pointed to by the `$handle`\
    \ resource into `$response`.\n- The `stream_get_meta_data` function is called\
    \ to read metadata for the stream pointed to by the `$handle` resource into `$meta`.\n\
    - The `wrapper_data` index of the `$meta` array outputs the same array as `$http_response_header`\
    \ would within the current scope. So long as `$handle` is accessible within the\
    \ current scope, `stream_get_meta_data()` can be called on it. This makes it more\
    \ flexible than `$http_response_header`.\n\n### Stream Contexts and POST Requests\n\
    \nAnother concept introduced by streams is the context, which is basically a set\
    \ of configuration options used in a streams operation. A context is created by\
    \ passing an associative array of context options and their corresponding values\
    \ to the `stream_context_create` function. One use of contexts with regard to\
    \ the HTTP streams wrapper is making POST requests, as the wrapper uses the GET\
    \ method by default.\n\n```php\n<?php\n$context = stream_context_create(array(\n\
    \  'http' => array(\n    'method' => 'POST',\n    'header' => implode(\"\\r\\\
    n\", array(\n      'Content-Type: application/x-www-form-urlencoded',\n      'Referer:\
    \ http://localhost.example'\n    )),\n    'content' => http_build_query(array(\n\
    \       'param1' => 'value1',\n       'param2' => 'value2'\n     ))\n  )\n));\n\
    \n$response = file_get_contents(\n   'http://localhost.example/process',\n   false,\n\
    \   $context\n);\n?>\n```\n\nHere is a walk-through of this example.\n\n- `'http'`\
    \ is the streams wrapper being used.\n- `'POST'` is the HTTP method of the request.\n\
    - The `'header'` stream context setting is populated with a string containing\
    \ HTTP header key-value pairs, in this case for the Content-Type and Referer HTTP\
    \ headers. The Content-Type header is used to indicate that the request body data\
    \ is URL-encoded. When multiple custom headers are needed, they must be separated\
    \ by a carriage return-line feed (`\"\\r\\n\"` also known as CRLF sequence). The\
    \ `implode` function is useful for this if key-value pairs for headers are stored\
    \ in an enumerated array.\n- The `http_build_query` function is being used to\
    \ construct the body of the request. This function can also be used to construct\
    \ query strings of URLs for GET requests.\n- `http://localhost.example/process`\
    \ is the URL of the resource being requested.\n- `file_get_contents` is called\
    \ to execute the request, the options for which are passed via the context `$context`\
    \ created using `stream_context_create`.\n- The body of the response is returned\
    \ and stored in the variable `$response`.\n\n## Error Handling\n\nBefore PHP 5.3.0,\
    \ an HTTP streams wrapper operation resulting in an HTTP error response (i.e.\
    \ a 4xx or 5xx status code) causes a PHP-level warning to be emitted. This warning\
    \ will only contain the HTTP version, the status code, and the status code description.\
    \ The function calls for such operations generally return false as a result and\
    \ leave you without a stream resource to check for more information. Here's an\
    \ example of how to get what data you can.\n\n```php\n<?php\nfunction error_handler($errno,\
    \ $errstr, $errfile, $errline,\n          array $errcontext) {\n\n    // $errstr\
    \ will contain something like this:\n    // fopen(http://localhost.example/404):\
    \ failed to open stream: \n    // HTTP request failed! HTTP/1.0 404 Not Found\n\
    \n    if ($httperr = strstr($errstr, 'HTTP/')) {\n\n        // $httperr will contain\
    \ HTTP/1.0 404 Not Found in the case\n        // of the above example, do something\
    \ useful with that here\n    }\n}\n\nset_error_handler('error_handler', E_WARNING);\n\
    \n// If the following statement fails, $stream will be assigned false\n// and\
    \ error_handler will be called automatically\n$stream = fopen('http://localhost.example/404',\
    \ 'r');\n\n// If error_handler() does not terminate the script, control will\n\
    // be returned here once it completes its execution\nrestore_error_handler();\n\
    ?>\n```\n\nThis situation has been improved somewhat in PHP 5.3 with the addition\
    \ of the `ignore_errors` context setting. When this setting is set to true, operations\
    \ resulting in errors are treated the same way as successful operations. Here's\
    \ an example of what that might look like.\n\n```php\n<?php\n$context = stream_context_create(\n\
    \    array(\n        'http' => array(\n            'ignore_errors' => true\n \
    \       )\n    )\n);\n\n$stream = fopen('http://localhost.example/404', 'r', false,\
    \ $context);\n\n// $stream will be a stream resource at this point regardless\
    \ of\n// the outcome of the operation\n$body = stream_get_contents($stream);\n\
    $meta = stream_get_meta_data($stream);\n\n// $meta['wrapper_data'][0] will equal\
    \ something like HTTP/1.0 404\n// Not Found at this point, with subsequent array\
    \ elements being\n// other headers\n$response = explode(' ', $meta['wrapper_data'][0],\
    \ 3);\nlist($version, $status, $description) = $response;\nswitch (substr($status,\
    \ 0, 1)) {\n    case '4':\n    case '5':\n        $result = false;\n    default:\n\
    \        $result = true;\n}\n?>\n```\n\n## HTTP Authentication\n\nThe HTTP stream\
    \ wrapper has no context options for HTTP authentication credentials. However,\
    \ it is possible to include the credentials as part of the URL being accessed.\
    \ See the example below. Note that credentials are not pre-encoded; this is handled\
    \ transparently when the request is made. Also, note that this feature only works\
    \ when Basic HTTP authentication is used; Digest authentication must be handled\
    \ manually.\n\n```php\n<?php\n$response = file_get_contents(\n    'http://username:password@localhost.example'\n\
    );\n?>\n```\n\n### A Few More Options\n\nBelow are a few other stream context\
    \ options for the HTTP streams wrapper that may prove useful.\n\n- `user_agent`\
    \ allows you to set the user agent string to use in the operation. This can also\
    \ be set manually by specifying a value for the User-Agent header in the `header`\
    \ context option value.\n- `max_redirects` is used to set the maximum number of\
    \ redirections that the operation will process prior to assuming that the application\
    \ is misbehaving and terminating the request. This option is only available in\
    \ PHP 5.1.0 and up and uses a default value of 20.\n- `timeout` is used to set\
    \ a maximum limit on the amount of time in seconds that a read operation may be\
    \ allowed to execute before it is terminated. It defaults to the value of the\
    \ default_socket_timeout PHP configuration setting.\n\nAll other features utilizing\
    \ headers must be implemented manually by specifying request headers in the `header`\
    \ context option and checking either `$http_response_header` or the `wrapper_data`\
    \ index of the array returned by the `stream_get_meta_data` function for response\
    \ headers.\n\n### Wrap-Up\n\nFor more information about the HTTP streams wrapper\
    \ itself, see [http://www.php.net/manual/en/wrappers.http.php](http://www.php.net/manual/en/wrappers.http.php).\n\
    \nFor details about the context options specific to the wrapper, see [http://www.php.net/manual/en/context.http.php](http://www.php.net/manual/en/context.http.php).\n"
