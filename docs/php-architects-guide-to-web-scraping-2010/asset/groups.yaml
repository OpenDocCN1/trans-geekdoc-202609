  md: "\n## Using the Client\n\nHTTP_Client persists explicit sets of headers and\
    \ request parameters across multiple requests, which are set using the `setDefaultHeader`\
    \ and `setRequestParameter` methods respectively. The client constructor also\
    \ accepts arrays of these. Default headers and request parameters can be cleared\
    \ by calling `reset` on the client instance.\n\nInternally, the client class actually\
    \ creates a new instance of HTTP_Request per request. The request operation is\
    \ set depending on which of the client instance methods are called; `get`, `head`,\
    \ and `post` are supported.\n\nThe capabilities of the client described up to\
    \ this point can all be accomplished by reusing the same request instance for\
    \ multiple requests. However, the client also handles two things that the request\
    \ class does not: cookies and redirects.\n\nBy default, cookies are persisted\
    \ automatically across requests without any additional configuration. HTTP_Client_CookieManager\
    \ is used internally for this. For custom cookie handling, this class can be extended\
    \ and an instance of it passed as the third parameter to the client constructor.\
    \ If this is done, that instance will be used rather than an instance of the native\
    \ cookie manager class being created by default.\n\nThe maximum number of redirects\
    \ to process can be set using the `setMaxRedirects` method of the client class.\
    \ Internally, requests will be created and sent as needed to process the redirect\
    \ until a non-redirecting response is received or the maximum redirect limit is\
    \ reached. In the former case, the client method being called will return an integer\
    \ containing the response code rather than `true` as the request class does. In\
    \ the latter case, the client method will return an error instance. Note that\
    \ the client class will process redirects contained in meta tags of HTML documents\
    \ in addition to those performed at the HTTP level.\n\nTo retrieve information\
    \ for the last response received, use the `currentResponse` method of the client\
    \ instance. It will return an associative array containing the keys '`code`',\
    \ '`headers`', and '`body`' with values corresponding to the return values of\
    \ request methods `getResponseCode`, `getResponseHeader`, and `getResponseBody`\
    \ respectively.\n\nBy default, all responses are stored and can be accessed individually\
    \ as shown below. To disable storage of all responses except the last one, call\
    \ `enableHistory` on the client instance and pass it `false`.\n\n```php\n<?php\n\
    for ($client->rewind(); $client->valid(); $client->next()) {\n    $url = $client->key();\n\
    \    $response = $client->current();\n}\n?>\n```\n\n## Observing Requests\n\n\
    Both HTTP_Request and HTTP_Client have `attach` and `detach` methods for adding\
    \ and removing instances of HTTP_Request_Listener. This class implements the observer\
    \ design pattern and serves to intercept events that occur during the process\
    \ of transmitting a request and receiving a response. To create an observer, first\
    \ create a class that extends HTTP_Request_Listener as shown below.\n\n```php\n\
    <?php\nclass Custom_Request_Listener extends HTTP_Request_Listener\n{\n    function\
    \ Custom_Request_Listener()\n    {\n        $this->HTTP_Request_Listener();\n\
    \    }\n\n    function update(&$subject, $event, $data = null)\n    {\n      \
    \  switch ($event) {\n            // Request events\n            case 'connect':\
    \      // handle the 'connect' event\n            case 'sentRequest':  // ...\n\
    \            case 'disconnect':   // ...\n\n            // Response events\n \
    \           case 'gotHeaders':   // ...\n            case 'tick':         // ...\n\
    \            case 'gztick':       // ...\n            case 'gotBody':      //\
    \ ...\n\n            // Client events\n            case 'request':      // ...\n\
    \            case 'httpSuccess':  // ...\n            case 'httpRedirect': //\
    \ ...\n            case 'httpError':    // ...\n\n            default:\n     \
    \           PEAR::raiseError('Unhandled error: ' . $event);\n        }\n    }\n\
    }\n?>\n```\n\n- Declare a constructor that calls the parent constructor and performs\
    \ any needed custom logic.\n- Declare the `update` method with the signature shown.\
    \ `$subject` is the request or client instance to which the listener is attached.\
    \ `$event` is a string containing one of the events shown in the switch statement.\n\
    - `$data` is data specific to events related to reception of the server response.\n\
    - Request and response events occur within HTTP_Request instances. Client events\
    \ occur within HTTP_Client instances.\n- Note that not all events need to be handled,\
    \ only those with which you are concerned.\n\nThe `attach` method in HTTP_Request\
    \ takes a single parameter, a listener instance. The equivalent method in HTTP_Client\
    \ takes two parameters, a required listener instance and an optional boolean flag.\
    \ When the latter is `false` (which it is by default), attached listeners will\
    \ not be propagated to requests created within the client instance. That is, a\
    \ listener added will not be notified of request and response events, only client\
    \ events. To have an added listener receive all events, explicitly specify the\
