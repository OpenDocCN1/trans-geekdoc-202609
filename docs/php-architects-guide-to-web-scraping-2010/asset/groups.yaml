    # # Chapter 6


    # ## PEAR::HTTP_Client


    The PHP Extension and Application Repository (PEAR) project houses a library of
    reusable components written in PHP and a package system for distributing them,
    one of which is the **HTTP_Client** package that will be covered in this section.
    PEAR spurred the creation of the PECL project, a repository of C extensions from
    which the pecl_http extension discussed in the previous section originates.


    One trait of many components in PEAR is backward compatibility with older versions
    of PHP. The **HTTP_Client** package itself only requires 4.3.0, while the latest
    and last version of the PHP 4 branch is 4.4.9. As such, this client may be a good
    solution when feature requirements are more advanced than what the HTTP streams
    wrapper natively supports and the intended runtime environment is restricted to
    an older PHP version. Otherwise, if you still want an HTTP client written in PHP,
    have a look at Zend_Http_Client as described in the next section. It should go
    without saying that support for PHP 4.x has ceased and that it is highly advisable
    to run a more current stable version of PHP in production environments.


    PHP source tarballs have a configure option to include PEAR when compiling. Some
    operating systems may have a package for PEAR apart from PHP itself. Once PEAR
    is installed, `pear install HTTP_Client` should be sufficient to install PEAR::HTTP_Client.
    There is also the option to manually download tarballs for the necessary PEAR
    packages (HTTP_Client, HTTP_Request, Net_URL, and Net_Socket), though this is
    a bit more difficult to maintain in the long term as updates are released.'
