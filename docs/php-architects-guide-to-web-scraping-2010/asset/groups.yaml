    There are multiple situations in which the specification of a referrer can occur.
    A user may click on a hyperlink in a browser, in which case the full URL of the
    resource containing the hyperlink would be the referrer. When a resource containing
    markup with embedded images is requested, subsequent requests for those images
    will contain the full URL of the page containing the images as the referrer. A
    referrer is also specified when redirection occurs, as described in the previous
    section.


    The reason this is relevant is because some applications depend on the value of
    the Referer header by design, which is less than ideal for the simple fact that
    the header value can be spoofed. In any case, it is important to be aware that
    some applications may not function as expected if the provided header value is
    not consistent with what is sent when the application is used in a browser. See
    subsection 14.36 of RFC 2616 for more information.


    ## Persistent Connections


    The standard operating procedure for an HTTP request is as follows.


    - A client connects to a server.

    - The client sends a request over the established connection.

    - The server returns a response.

    - The connection is terminated.


    When sending multiple consecutive requests to the same server, however, the first
    and fourth steps in that process can cause a significant amount of overhead. HTTP
    1.0 established no solution for this; one connection per request was normal behavior.
    Between the releases of the HTTP 1.0 and 1.1 standards, a convention was informally
    established that involved the client including a Connection header with a value
    of Keep-Alive in the request to indicate to the server that a persistent connection
    was desired.


    Later, 1.1 was released and changed the default behavior from one connection per
    request to persist connections. For a non-persistent connection, the client could
    include a Connection header with a value of close to indicate that the server
    should terminate the connection after it sent the response. The difference between
    1.0 and 1.1 is an important distinction and should be a point of examination when
    evaluating both client libraries and servers hosting target applications so that
    you are aware of how they will behave with respect to persistent connections.
    See subsection 8.1 of RFC 2616 for more information.


    There is an alternative implementation that gained significantly less support
    in clients and servers involving the use of a Keep-Alive header. Technical issues
    with this are discussed in subsection 19.7.1 of RFC 2068, but explicit use of
    this header should be avoided. It is mentioned here simply to make you aware that
    it exists and is related to the matter of persistent connections.


    ## Content Caching


    Two methods exist to allow clients to query servers in order to determine if resources
    have been updated since the client last accessed them. Subsections of RFC 2616
    section 14 detail related headers.


    The first method is time-based where the server returns a `Last-Modified` header
    (subsection 29) in its response and the client can send that value in an `If-Modified-Since`
    header (subsection 25) in a subsequent request for the same resource.


    The other method is hash-based where the server sends a hash value in its response
    via the `Etag` header (subsection 19) and the client may send that value in an
    `If-None-Match` header (subsection 26) in a subsequent request for the same resource.


    If the resource has not changed in either instance, the server simply returns
    a 304 Not Modified response. Aside from checking to ensure that a resource is
    still available (which will result in a 404 response if it is not), this is an
    appropriate situation in which to use a HEAD request.


    Alternatively, the logic of the first method can be inverted by using an `If-Unmodified-Since`
    header (subsection 28), in which case the server will return a 412 Precondition
    Failed response if the resource has in fact been modified since the provided access
    time.


    ## User Agents


    Clients are sometimes referred to as user agents. This refers to the fact that
    web browsers are agents that act on behalf of users in order to require minimal
    intervention on the user’s part. The `User-Agent` header enables the client to
    provide information about itself, such as its name and version number. Crawlers
    often use it to provide a URL for obtaining more information about the crawler
    or the e-mail address of the crawler’s operator. A simple search engine query
    should reveal a list of user agent strings for mainstream browsers. See subsection
    14.43 of RFC 2616 for more information.


    Unfortunately, some applications will engage in a practice known as **user agent
    sniffing** or **browser sniffing** in which they vary the responses they deliver
    displayed based on the user agent string provided by the client. This can include
    completely disabling a primary site feature, such as an e-commerce checkout page
    that uses ActiveX (a technology specific to Windows and Internet Explorer).


    One well-known application of this technique is the robots exclusion standard,
    which is used to explicitly instruct crawlers to avoid accessing individual resources
    or the entire web site. More information about this is available at http://www.robotstxt.org.
    The guidelines detailed there should definitely be accounted for when developing
    a web scraping application so as to prevent it from exhibiting behavior inconsistent
    with that of a normal user.


    In some cases, a client practice called **user agent spoofing** involving the
    specification of a false user agent string is enough to circumvent user agent
    sniffing, but not always. An application may have platform-specific requirements
    that legitimately warrant it denying access to certain user agents. In any case,
    spoofing the user agent is a practice that should be avoided to the fullest extent
    possible.


    ## Ranges


    The Range request header allows the client to specify that the body of the server''s
    response should be limited to one or more specific byte ranges of what it would
    normally be. Originally intended to allow failed retrieval attempts to resume
    from their stopping points, this feature can allow you to minimize data transfer
    between your application and the server to reduce bandwidth consumption and runtime
    of your web scraping application.


    This is applicable in cases where you have a good rough idea of where your target
    data is located within the document, especially if the document is fairly large
    and you only need a small subset of the data it contains. However, using it does
    add one more variable to the possibility of your application breaking if the target
    site changes and you should bear that in mind when electing to do so.


    While the format of the header value is being left open to allow for other range
    units, the only unit supported by HTTP/1.1 is bytes. The client and server may
    both use the Accept-Ranges header to indicate what units they support. The server
    will include the range (in a slightly different format) of the full response body
    in which the partial response body is located using the Content-Range header.


    In the case of bytes, the beginning of the document is represented by 0. Ranges
    use inclusive bounds. For example, the first 500 bytes of a document would be
