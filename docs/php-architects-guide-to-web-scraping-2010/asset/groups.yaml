    \ below for the multitude of ways in which headers can be set.\n"
  mdcn: "\n## 使用客户端\n\nHTTP_Client 在多个请求中持久化显式设置的标头和请求参数集合，这些集合分别通过 `setDefaultHeader`\
    \ 和 `setRequestParameter` 方法设置。客户端构造函数也接受这些集合的数组形式。通过调用客户端实例上的 `reset` 方法可以清除默认标头和请求参数。\n\
    \n内部地，客户端类实际上为每个请求创建一个 HTTP_Request 的新实例。请求操作根据调用的客户端实例方法而设置；支持 `get`、`head` 和\
    \ `post`。\n\n此处描述的客户端功能都可以通过重用同一个请求实例进行多次请求来实现。然而，客户端还处理了请求类未涉及的两项功能：Cookie 和重定向。\n\
    \n默认情况下，Cookie 会在没有额外配置的情况下自动跨请求持久化。内部使用 HTTP_Client_CookieManager 来实现此功能。对于自定义的\
    \ Cookie 处理，可以扩展此类并将其实例作为第三个参数传递给客户端构造函数。如果这样做，将使用该实例，而不是默认创建的 native cookie manager\
    \ 类实例。\n\n可以使用客户端类的 `setMaxRedirects` 方法设置处理的最大重定向前数。内部，将根据需要创建并发送请求以处理重定向，直到接收到非重定向响应或达到最大重定向限制为止。在前一种情况下，被调用的客户端方法将返回包含响应代码的整数，而不是像请求类那样返回\
    \ `true`。在后一种情况下，客户端方法将返回一个错误实例。请注意，除了 HTTP 层执行的重定向外，客户端类还将处理 HTML 文档中 meta 标签包含的重定向。\n\
    \n要检索最后接收到的响应信息，请使用客户端实例的 `currentResponse` 方法。它将返回一个关联数组，包含键 '`code`'、'`headers`'\
    \ 和 '`body`'，其值分别对应请求方法 `getResponseCode`、`getResponseHeader` 和 `getResponseBody`\
    \ 的返回值。\n\n默认情况下，所有响应都会被存储，并且可以像下面那样单独访问。要禁用除最后一个响应以外的所有响应存储，请在客户端实例上调用 `enableHistory`\
    \ 并传入 `false`。\n\n```php\n<?php\nfor ($client->rewind(); $client->valid(); $client->next())\
    \ {\n    $url = $client->key();\n    $response = $client->current();\n}\n?>\n\
    ```\n\n## 观察请求\n\nHTTP_Request 和 HTTP_Client 都有 `attach` 和 `detach` 方法，用于添加和移除\
    \ HTTP_Request_Listener 实例。此类实现了观察者设计模式，用于拦截在发送请求和接收响应过程中发生的事件。要创建一个观察者，首先创建一个扩展\
    \ HTTP_Request_Listener 的类，如下所示。\n\n```php\n<?php\nclass Custom_Request_Listener\
    \ extends HTTP_Request_Listener\n{\n    function Custom_Request_Listener()\n \
    \   {\n        $this->HTTP_Request_Listener();\n    }\n\n    function update(&$subject,\
    \ $event, $data = null)\n    {\n        switch ($event) {\n            // Request\
    \ events\n            case 'connect':      // handle the 'connect' event\n   \
    \         case 'sentRequest':  // ...\n            case 'disconnect':   // ...\n\
    \n            // Response events\n            case 'gotHeaders':   // ...\n  \
    \          case 'tick':         // ...\n            case 'gztick':       // ...\n\
    \            case 'gotBody':      // ...\n\n            // Client events\n   \
    \         case 'request':      // ...\n            case 'httpSuccess':  // ...\n\
