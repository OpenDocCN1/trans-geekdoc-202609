    # Chapter 10


    # DOM Extension


    Once the retrieved markup document has been cleaned up so that it validates, the
    next step is extracting useful data from it. For this, the ideal approach is to
    take advantage of the fact that the document is valid markup and apply an XML
    extension to it. PHP has several of these and the next few chapters will be devoted
    to covering them.


    The namesake of this chapter is the Document Object Model (DOM) extension. This
    extension gets its name from a standardized language-independent API for navigating
    and manipulating valid and well-formed XML and HTML documents. The standard is
    maintained and recommended by the World Wide Web Consortium (W3C), an organization
    devoted to emerging internet-related standards. The chapter won''t cover the DOM
    extension in its entirety, only parts that are relevant and essential to web scraping.


    > DOM XML

    The DOM extension is only available in PHP 5. Its PHP 4-compatible predecessor,
    the DOM XML extension, has a somewhat different API but shares many of the same
    concepts. Examples in this chapter will be restricted to the DOM extension. The
    related section of the PHP manual can be consulted for equivalent specifics in
    the DOM XML extension at http://php.net/manual/en/book.domxml.php.'
  - '[PAGE 119]


    Before going much further, you should be aware that there are two types of XML
    parsers: **tree parsers** and **pull parsers**. Tree parsers load the entire document
    into memory and allow you to access any part of it at any time as well as manipulate
    it. Pull parsers read the document a piece at a time and limit you to working
    with the current piece being read.


    The two types of parsers share a relationship similar to that between the `file_get_contents`
    and `fgets` functions: the former lets you work with the entire document at once
    and uses as much memory needed to store it, while the latter allows you to work
    with a piece of the document at a time and use less memory in the process.


    When working with fairly large documents, lower memory usage is generally the
    preferable option. Attempting to load a huge document into memory all at once
    has the same effect on the local system as a throttling client does on a web server:
    in both cases, resources are consumed and system performance is debilitated until
    the system eventually locks up or crashes under the stress.


    The DOM extension is a tree parser. In general, web scraping does not require
    the ability to access all parts of the document simultaneously. However, the type
    of data extraction involved in web scraping can be rather extensive to implement
    using a pull parser. The appropriateness of extension over the other depends on
    the size and complexity of the document.


    # Loading Documents


    The DOMDocument class is where use of the DOM extension begins. The first thing
    to do is instantiate it and then feed it the validated markup data. Note that
    the DOM extension will emit warnings when a document is loaded if that document
    is not valid or well-formed. To avoid this, see the previous chapter on using
    the tidy extension. If tidy does not eliminate the issue, errors can be controlled
    as shown in the example below. Note that errors are buffered until manually cleared,
    so make a point of clearing them after each load operation if they are not needed
    to avoid wasting memory.


    ```

    <?php

    ```'
