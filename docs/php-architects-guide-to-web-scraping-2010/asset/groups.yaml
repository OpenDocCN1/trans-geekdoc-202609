    # Chapter 11


    # SimpleXML Extension


    Like the DOM extension, the SimpleXML extension provides a tree parser. However,
    the DOM extension keeps an API fairly consistent with that of the standard on
    which it is based. The API offered by SimpleXML is one that most PHP developers
    will find to be less massive, more intuitive and easier to use compared to that
    of the DOM extension.


    SimpleXML makes use of the flexibility and versatility of PHP arrays by using
    them to access both individual elements from a collection with the same element
    name as well as element attributes. It also adds iterability to markup documents,
    making them simple to traverse.


    However, these advantages do not come without cost. Like other tree parsers, SimpleXML
    must parse the entire document before it can be used. As such, it tends to be
    slower when parsing larger documents than a pull parser like XMLReader (which
    will be covered later). For a script dealing with a smaller document, however,
    SimpleXML works well in a pinch.


    # Loading a Document


    Where DOMDocument is the central class in the DOM extension, SimpleXMLElement
    is its counterpart in the SimpleXML extension. Loading a markup document is as
    simple as specifying it via the class constructor.'
  - '[PAGE 133]


    ```

    <?php

    // Loads markup already contained within a string

    $exe = new SimpleXMLElement($markupString);


    // Loads markup contained within an external file

    $exe = new SimpleXMLElement($filePath, null, true);

    ?>

    ```


    The constructor''s second parameter (specified as null in the second example shown
    above) allows for further configuration of the instance. For documents with less
    than valid markup, using the value LIBXML_NOERROR | LIBXML_NOWARNING for this
    parameter may be useful as it suppresses error and warning reports.


    Finally, the third parameter used in the second constructor call is set to true
    to indicate that $filePath is in fact a path to a file containing markup rather
    than the markup itself.


    # ## Accessing Elements


    Use of SimpleXML looks a bit like XPath expressions, except that the same effect
    is accomplished programmatically through the API rather than via formatted expressions
    stored in strings. Unlike XPath expressions, SimpleXML automatically assumes that
    element access is relative to the root node.


    ```

    <?php

    $markupString = ''

    <html>

    <body>

    <ul id="thelist">

    <li>Foo</li>

    <li>Bar</li>

    </ul>

    </body>

    </html>

    '',


    // Outputs "Foo" -- note that the "html" element isn''t referenced

    $exe = new SimpleXMLElement($markupString);

    echo $exe->body->ul->li[0];


    // Also works, assumes the first "li" element if several are present

    ```'
  - "[PAGE 134]\n\n```\necho $sxe->body->ul->li;\n\n// Also outputs \"Foo\" -- note\
    \ that \"html\" is referenced this time\n$doc = new DOMDocument();\n$doc->loadHTML($markupString);\n\
    $xpath = new DOMXPath($doc);\necho $xpath->evaluate('/html/body/ul/li[0]');\n\n\
    // Outputs \"ul\"\necho $sxe->body->ul->getName(), PHP_EOL;\n\n// Outputs \"Foo\"\
    \ then \"Bar\"\nforeach ($sxe->body->ul->li as $li) {\n    echo $li, PHP_EOL;\n\
    }\n\n// Does the same thing\nforeach ($sxe->body->ul->children() as $li) {\n \
    \   echo $li, PHP_EOL;\n}\n?>\n```\n\nWhen referencing a child element of the\
    \ current element (via the body property of $sxe above, for example), note that\
    \ the child element being accessed is also an instance of SimpleXMLElement. This\
    \ means it's not only possible to chain element access, but also to reference\
    \ the last element in such a chain using a variable. See the first foreach loop\
    \ shown above for an example of both of these.\n\n# ## Accessing Attributes\n\n\
    Where element access makes use of enumerated arrays for accessing multiple elements\
    \ with the same name on the same hierarchical level, attribute access makes use\
    \ of associative arrays. The example below uses the same $markupString sample\
    \ data as in the previous example.\n\n```\n<?php\n// Outputs \"thelist\"\necho\
    \ $sxe->body->ul['id'];\n\n// Outputs \"id=thelist\"\n```"
  - "[PAGE 135]\n\n```\nforeach ($sxse->body->ul->attributes() as $name => $value)\
    \ {\n    echo $name, '=', $value, PHP_EOL;\n}\n\n// Another way to output \"thelist\"\
    \n$attrs = $sxse->body->ul->attributes();\necho $attrs->id;\n?>\n```\n\nWhat the\
    \ attributes() method actually returns is a SimpleXMLElement instance that provides\
    \ access to attribute names and values in the same way that SimpleXMLElement normally\
    \ makes child elements and their values available. As such, the returned instance\
    \ can be used as the subject of a foreach loop to iterate over the properties\
    \ that it exposes.\n\n```\n<!-- Actual markup -->\n<ul id=\"thelist\"></ul>\n\n\
    <!-- How attributes() exposes it as a SimpleXMLElement instance -->\n<ul>\n  \
    \  <id>thelist</id>\n</ul>\n```\n\n![](img/1e839861f06c77df9ecabc0aed9127b5_135_0.png)\n\
    \n# A Debugging Bug\n\nBug #44973, which affects the SimpleXML extension, is reported\
    \ to be present in PHP 5.2.6 and may be present in other versions as well. The\
    \ bug is exposed when an attempt is made to output a node accessed via a SimpleXMLElement\
    \ instance using echo, print_r(), var_dump(), and other similar functions. If\
    \ the node has both attributes and a text value, the attributes will not be shown\
    \ in the output of these functions. This does not mean that attribute values are\
    \ not accessible in this situation; they simply can't be output in this fashion\
    \ unless referenced directly. More information on this is available at http://bugs.php.net/bug.php?id=44973."
