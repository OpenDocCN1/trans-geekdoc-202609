    \ ...\n\n            default:\n                PEAR::raiseError('Unhandled error:\
    \ ' . $event);\n        }\n    }\n}\n?>\n```\n\n- 声明一个构造函数，该构造函数调用父类构造函数并执行所需的自定义逻辑。\n\
    - 声明具有所示签名的 `update` 方法。`$subject` 是监听器所附加的请求或客户端实例。`$event` 是一个包含 switch 语句中所示事件之一的字符串。\n\
    - `$data` 是与接收服务器响应相关的事件特定数据。\n- 请求和响应事件发生在 HTTP_Request 实例中。客户端事件发生在 HTTP_Client\
    \ 实例中。\n- 请注意，并非所有事件都需要处理，只需处理您关注的那些事件即可。\n\nHTTP_Request 中的 `attach` 方法接受单个参数，即一个监听器实例。HTTP_Client\
    \ 中的等效方法接受两个参数，一个必需的监听器实例和一个可选的布尔标志。当后者为 `false`（默认情况）时，附加的监听器不会传播到客户端实例内部创建的请求中。也就是说，添加的监听器不会收到请求和响应事件的通知，只接收客户端事件。要使添加的监听器接收所有事件，在调用\
    \ `attach` 时显式指定 `$propagate` 参数为 `true`。\n\n## 总结\n\n有关此处介绍的 PEAR 包更多信息，请参见下面列出的资源。\n\
    \n- http://pear.php.net/manual/en/package.http.http-request.php\n- http://pear.php.net/manual/en/package.http.http-client.php\n\
    - http://pear.php.net/manual/en/package.http.http-request.listeners.php\n\n# 第\
    \ 7 章\n\n# Zend_Http_Client\n\nZend Framework（通常缩写为 ZF）构想于 2005 年初。与 PEAR 不同，ZF\
    \ 倾向于保持其要求的 PHP 版本相对较新，并且经常利用新版本中可用的功能。截至 ZF 1.10.1，要求使用 PHP 5.2.4。\n\nZF 旨在充分利用\
    \ PHP 5 引入的新对象系统，具有完全面向对象的 API。项目团队努力保持 E_STRICT 级别的合规性以及通过单元测试实现良好的代码覆盖率。\n\n\
    ZF 中包含的组件之一是 Zend_Http_Client，这是一个 HTTP 客户端库，其功能集与前面章节中已介绍的其他库相当可观。既然如此，让我们来看看它的工作原理。\n\
    \n## 基本请求\n\n让我们从一个基本请求开始。\n\n```php\n<?php\n$client = new Zend_Http_Client;\n\
