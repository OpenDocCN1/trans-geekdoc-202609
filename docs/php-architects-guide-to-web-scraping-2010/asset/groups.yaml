  mdcn: "\n可以在单个模式中同时检查多个表达式，这也被称为**交替匹配**（alternation），使用管道元字符 `|` 即可实现。\n\n```php\n\
    <?php\n// 匹配 'foo' 或 'bar' 或 'baz'，位置不限\n$matches = (preg_match('/foo|bar|baz/',\
    \ $string) == 1);\n?>\n```\n\n请注意，`^` 和 `$` 不会隐式地应用于交替匹配中的所有表达式；必须为每个表达式显式使用它们。\n\
    \n```php\n<?php\n// $result == 1\n$result = preg_match('/^foo|bar/', 'abar');\n\
    \n// $result == 0\n$result = preg_match('/^foo|^bar/', 'abar');\n?>\n```\n\n第一个示例返回\
    \ 1，因为 `abar` 包含 `bar`，而在该模式中，`^` 并未应用于该表达式。第二个示例则对 `bar` 应用了 `^`，由于 `abar` 既不以\
    \ `foo` 也不以 `bar` 开头，因此返回 0。\n\n模式中的某部分可能存在也可能不存在，或者可能被重复多次。这被称为**重复**（repetition），涉及使用一组统称**量化符**（quantifiers）的元字符。\n\
    \n```php\n<?php\n// 如果存在，则匹配 'a' 0 次或 1 次\n$matches = (preg_match('/a?/', $string)\
    \ == 1);\n\n// 匹配 'a' 0 次或多次，数量不限\n$matches = (preg_match('/a*/', $string) ==\
    \ 1);\n\n// 匹配 'a' 1 次或多次，数量不限\n$matches = (preg_match('/a+/', $string) == 1);\n\
    \n// 如果存在，则匹配 'a' 0 次或 1 次，等同于 ?\n$matches = (preg_match('/a{0,1}/', $string)\
    \ == 1);\n\n// 匹配 'a' 0 次或多次，等同于 *\n$matches = (preg_match('/a{0,}/', $string)\
    \ == 1);\n\n// 匹配 'a' 1 次或多次，等同于 +\n$matches = (preg_match('/a{1,}/', $string)\
    \ == 1);\n\n// 匹配恰好 2 次 'a'\n$matches = (preg_match('/a{2}/', $string) == 1);\n\
    ?>\n```\n\n请注意，任何非 {X}、{X,} 或 {X,Y} 形式的大括号使用，都将被视为模式中的字面字符串。\n\n### 子模式\n\n你会注意到上一节示例中只使用了单个字符。这是因为**子模式**（subpatterns）的概念尚未引入。为了理解这些，最好查看一个不使用它们的示例，以了解它们对模式匹配方式的影响。\n\
    \n```php\n<?php\n// 匹配 'a' 后跟一个或多个 'b'\n$matches = (preg_match('/ab+/', $string)\
    \ == 1);\n?>\n```\n\n如果没有子模式，就无法匹配例如字符串 'ab' 的一个或多个实例。子模式通过允许使用括号将模式的各个部分分组来解决这个问题。\n\
    \n```php\n<?php\n// 匹配 'ab' 一次或多次\n$matches = (preg_match('/(ab)+/', $string)\
    \ == 1);\n\n// 匹配 'foo' 或 'foobar'\n$matches = (preg_match('/foo(bar)?/', $string)\
    \ == 1);\n\n// 匹配 'ab' 或 'ac'\n$matches = (preg_match('/a(b|c)/', $string) ==\
    \ 1);\n\n// 匹配 'ab'、'ac'、'abb'、'abc'、'acb'、'acc' 等\n$matches = (preg_match('/a(b|c)+/',\
    \ $string) == 1);\n```\n\n## 匹配\n\n子模式的作用不仅仅是允许你定义应用交替匹配或重复的部分。当找到匹配项时，不仅可以获取原字符串中与整个模式匹配的\
    \ substrings，还可以获取由子模式匹配的 substrings。\n\n```php\n<?php\nif (preg_match('/foo(bar)?(baz)?/',\
    \ $string, $match) == 1) {\n    print_r($match);\n}\n?>\n```\n\n`preg_match()`\
    \ 的第三个参数 `$match`，如果在找到匹配项时，将被设置为一个包含匹配数据的数组。该数组将至少包含一个元素：与模式匹配的整个 substrings。随后的任何元素将是子模式匹配项，其索引与该子模式在模式中的位置相匹配。也就是说，第一个子模式的索引为\
    \ 1，第二个子模式的索引为 2，依此类推。\n\n如果模式是条件性的（即使用了 `?`）且不存在，则数组中要么有一个空元素值，要么根本没有数组元素。\n\n\
    ```php\n<?php\nif (preg_match('/foo(bar)?/', 'foo', $match) == 1) {\n    // $match\
    \ == array('foo');\n}\n```\n\n- 在第一个示例中，`(bar)?` 子模式结束了整个模式，并且未匹配。因此，它在 `$match`\
    \ 中没有条目。\n- 在第二个示例中，`(bar)?` 子模式未结束整个模式，并且未匹配。因此，它在 `$match` 中有一个空条目。\n\n```php\n\
    <?php\nif (preg_match('/foo(bar)?(baz)?/', 'foobaz', $match) == 1) {\n    // $match\
    \ == array('foo', '', 'baz');\n}\n?>\n```\n\n子模式还可以包含其他子模式。\n\n```php\n<?php\n\
    if (preg_match('/foo(ba(r|z))?/', 'foobar', $match) == 1) {\n    // $match ==\
    \ array('foobar', 'bar', 'r');\n}\n?>\n```\n\n除了将 `$match` 传递给 `print_r()` 或类似函数外，确定子模式在\
    \ `$match` 中位置的一种简便方法是，从模式左侧开始计数，直到到达目标子模式，计算模式中的左括号数量。\n\n使用上述所示的语法，任何子模式都会被捕获（即在匹配数组中拥有自己的元素）。捕获的子模式限制为\
    \ 99 个，而总子模式数量（无论是否捕获）限制为 200 个。虽然这在现实中不太可能成为问题，但最好使用 `(?:` 而不是 `(` 来开始不需要捕获的子模式，以明确表示。\n\
    \n此外，从 PHP 4.3.3 开始，可以为子模式分配有意义的名称，当它们被捕获时，用作匹配数组中的索引。要为子模式分配名称，请以 `(?P<name>`\
    \ 语法开头，而不是 `(`，其中 `name` 是你想分配给该子模式的名称。这样做的好处是使代码更具表达性，从而更易于维护。\n\n### 转义\n\n\
    在某些情况下，你可能希望在模式中包括那些通常被解释为元字符的字面字符。可以通过 `\\` 元字符实现这一点。\n\n```php\n<?php\n// 匹配字面量\
    \ [\n$matches = (preg_match('/\\\\[/', $string) == 1);\n\n// 匹配字面量 \\\n$matches\
    \ = (preg_match('/\\\\\\\\/', $string) == 1);\n\n// 匹配表达式分隔符 /\n$matches = (preg_match('/\\\
    \\//', $string) == 1);\n\n// 匹配标准转义序列 \\r、\\n 或 \\t 中的任意一个\n$matches = (preg_match('/\\\
    \\r|\\\\n|\\\\t/', $string) == 1);\n?>\n```\n\n请注意，第二个示例中必须双重转义 `\\\\`，因为无论是否用于正则表达式，PHP\
    \ 都将字符串 `'\\\\'` 解释为单个反斜杠。在其他情况下，无需转义 `\\` 即可正确解释转义序列。\n\n> **双重转义**\n>\n> 有关本节中双重转义示例背后原因更多信息，请参阅\
