    on a regular interval. For write operations, changes are stored locally and then
    pushed out in batches (hence the name) to the target application, also on a regular
    interval. The pros and cons to this approach are the complement of those from
    the real-time approach: updates will not be real-time, but the web scraping application''s
    response time will not be increased. It is of course possible to use a batch approach
    with a relatively low interval in order to approximate real-time while gaining
    the benefits of the batch approach.


    The selection of an approach depends on the requirements of the web scraping application.
    In general, if real-time updates on either the web scraping application or target
    application are not required, the batch approach is preferred to maintain a high
    level of performance.


