    # Chapter 4


    # cURL Extension


    The cURL PHP extension, available since PHP 4.0.2, wraps a library called libcurl
    that implements client logic for a variety of internet protocols including HTTP
    and HTTPS. Its API is fairly small and applications of it consist mostly of calls
    to set configuration options and their respective values.


    cURL assumes fewer default configuration values than the HTTP streams wrapper,
    like whether or not to process redirections and how many of them to process. The
    disadvantage to this is that, combined with the rich feature set of the extension,
    PHP code to use cURL is often more verbose than equivalent code using other client
    libraries.


    Like the streams wrapper, the cURL extension is written in C and has the same
    pros and cons in that respect. cURL uses a **session handle** (of the PHP resource
    data type) with which configuration settings can be associated in a similar fashion
    to how they are associated with contexts for stream wrappers. Also like stream
    contexts, cURL session handles can be used multiple times to repeat the same operation
    until passed to the `curl_close` function.


    The cURL extension is included in the PHP core, but must either be compiled into
    PHP or installed as a separate extension. Depending on the runtime environment''s
    operating system, this may involve installing a package in addition to the OS
    PHP package.'
