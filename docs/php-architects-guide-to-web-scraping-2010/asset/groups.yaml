    \ 函数来构建请求体。此函数也可用于为 GET 请求构建 URL 的查询字符串。\n- `http://localhost.example/process`\
    \ 是被请求资源的 URL。\n- 调用 `file_get_contents` 来执行请求，其选项通过使用 `stream_context_create`\
    \ 创建的上下文 `$context` 传递。\n- 响应体被返回并存储在变量 `$response` 中。\n\n## 错误处理\n\n在 PHP 5.3.0\
    \ 之前，导致 HTTP 错误响应（即 4xx 或 5xx 状态码）的 HTTP 流包装器操作会触发 PHP 级别的警告。此警告仅包含 HTTP 版本、状态码和状态码描述。此类操作的函数调用通常返回\
    \ false，导致你无法获得流资源来检查更多信息。以下是获取尽可能多数据的方法示例。\n\n```php\n<?php\nfunction error_handler($errno,\
    \ $errstr, $errfile, $errline,\n          array $errcontext) {\n\n    // $errstr\
    \ 将包含类似以下内容：\n    // fopen(http://localhost.example/404): failed to open stream:\
    \ \n    // HTTP request failed! HTTP/1.0 404 Not Found\n\n    if ($httperr = strstr($errstr,\
    \ 'HTTP/')) {\n\n        // 在上述示例中，$httperr 将包含 HTTP/1.0 404 Not Found，\n    \
    \    // 在这里对该信息做一些有用的处理\n    }\n}\n\nset_error_handler('error_handler', E_WARNING);\n\
    \n// 如果以下语句失败，$stream 将被赋值为 false\n// 并且会自动调用 error_handler\n$stream = fopen('http://localhost.example/404',\
    \ 'r');\n\n// 如果 error_handler() 未终止脚本，控制将在此处返回，\n// 在其执行完成后\nrestore_error_handler();\n\
    ?>\n```\n\n在 PHP 5.3 中，由于添加了 `ignore_errors` 上下文配置项，这种情况有所改善。当此配置项设置为 true 时，导致错误的操作与成功操作的处理方式相同。以下是其可能呈现的样子示例。\n\
    \n```php\n<?php\n$context = stream_context_create(\n    array(\n        'http'\
    \ => array(\n            'ignore_errors' => true\n        )\n    )\n);\n\n$stream\
    \ = fopen('http://localhost.example/404', 'r', false, $context);\n\n// 无论操作结果如何，此时\
    \ $stream 将是一个流资源\n$body = stream_get_contents($stream);\n$meta = stream_get_meta_data($stream);\n\
    \n// 此时 $meta['wrapper_data'][0] 将类似于 HTTP/1.0 404 Not Found，\n// 随后的数组元素为其他头部\n\
    $response = explode(' ', $meta['wrapper_data'][0], 3);\nlist($version, $status,\
    \ $description) = $response;\nswitch (substr($status, 0, 1)) {\n    case '4':\n\
    \    case '5':\n        $result = false;\n    default:\n        $result = true;\n\
    }\n?>\n```\n\n## HTTP 身份验证\n\nHTTP 流包装器没有用于 HTTP 身份验证凭据的上下文选项。但是，可以将凭据作为正在访问的\
    \ URL 的一部分包含在内。参见下方示例。请注意，凭据不会预先编码；这是在发起请求时透明处理的。另外，请注意，此功能仅在使用基本（Basic）HTTP 身份验证时有效；摘要（Digest）身份验证必须手动处理。\n\
    \n```php\n<?php\n$response = file_get_contents(\n    'http://username:password@localhost.example'\n\
    );\n?>\n```\n\n### 更多其他选项\n\n以下是 HTTP 流包装器中可能很有用的其他几个流上下文选项。\n\n- `user_agent`\
    \ 允许你设置用于该操作的用户代理字符串。也可以通过在 `header` 上下文选项值中指定 User-Agent 头部的值来手动设置。\n- `max_redirects`\
    \ 用于设置在假定应用程序行为异常并终止请求之前，该操作将处理的最大重定向次数。此选项仅在 PHP 5.1.0 及更高版本中可用，默认值为 20。\n- `timeout`\
    \ 用于设置读操作允许执行的最大时间限制（以秒为单位），超过该时间将被终止。它默认为 default_socket_timeout PHP 配置项的值。\n\
