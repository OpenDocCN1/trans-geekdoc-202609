    # Chapter 14


    # PCRE Extension


    There are some instances where markup documents may be so hideously malformed
    that they''re simply not usable by an XML extension. Other times, you may want
    to have a way to check the data you''ve extracted to ensure that it''s what you
    expect. Changes to the structure of markup documents may be significant, to the
    point where your CSS or XPath queries return no results. They may also be small
    and subtle, such that while you do get query results, they contain less or different
    data than intended.


    While either of these tasks could be done with basic string handling functions
    and comparison operators, in most cases the implementation would prove to be messy
    and unreliable. **Regular expressions** provide a syntax consisting of **meta-characters**
    whereby patterns within strings are expressed flexibly and concisely. This chapter
    will deal with regular expressions as they relate to the Perl-Compatible Regular
    Expression (PCRE) PHP extension in particular.


    A common bad practice is to use only regular expressions to extract data from
    markup documents. While this may work for simple scripts that are only intended
    to be used once or very few times in a short time period, it is more difficult
    to maintain and less reliable in the long term. Regular expressions simply were
    not designed for this purpose, whereas other markup-specific extensions discussed
    in previous chapters are more suited for the task. It is a matter of using the
    best tool for the job, and to that end, this practice should be avoided.


    ## POSIX Extended Regular Expressions


    Many PHP developers will cut their teeth on regular expressions using the POSIX
    regular expression extension, also called the ereg extension. The functions from
    this extension are being deprecated in PHP 5.3 in favor of those in the PCRE extension,
    which are faster and provide a more powerful feature set. Aside from differences
    in syntax for some special character ranges, most ereg expressions require only
    the addition of expression delimiters to work with preg functions.


    ## Pattern Basics


    Let''s start with something simple: detection of a substring anywhere within a
    string.


    ```php

    <?php

    // Substring detection with a basic string function

    $present = (strpos($string, ''foo'') !== false);


    // Same with a PCRE function

    $present = (preg_match(''/foo/'', $string) === 1);

    ?>

    ```


    Notice that the pattern in the `preg_match()` call is fairly similar to the string
    used in the `strpos()` call. In the former, `/` is used on either side of the
    pattern to indicate its beginning and end. The first character in the pattern
    string is considered to be the pattern delimiter and can be any character you
    specify. When choosing what you want to use for this character (`/` is the most
    common choice), bear in mind that you will have to escape it (covered in the Escaping
    section later) if you use it within the pattern. This will make more sense a little
    later in the chapter.


