    ## 第 1 章


    ### 简介


    如果你想知道这本书是关于什么的，或者你是否属于其目标读者群体，那么这一章就是为你准备的。它将提供关于后续章节内容的背景信息，并解决一些相关的常见顾虑，这些问题可能对你很切题。如果你对网络抓取已经有了一个很好的高层概念，并希望直接跳入本书更技术性的内容，你可以安全地跳到下一章。


    ### 目标读者


    本书面向中级或高级开发人员，要求读者已经对使用 PHP 5 进行编程有相当程度的熟悉感。你应该熟悉面向对象编程原则，如继承、抽象和封装，以及这些原则如何与
    PHP 5 对象模型相关联。本书将详细介绍一般概念，并使用 PHP 作为（一种非常有限的）手段，通过实际示例来说明这些概念。对 HTTP 协议、XML 概念和相关
    PHP 扩展库或 JavaScript 的了解也将特别有帮助。


    ### 如何阅读本书


    如果你遇到一个不熟悉的 PHP 函数，请尝试将你的首选 Web 浏览器指向 `http://php.net/functionname`，其中 `functionname`
    是相关函数的名称。这通常会将你引导至该函数在手册中的条目，或包含该函数条目的手册部分的着陆页。


    除此之外，各章节可以独立阅读，但它们之间存在相互关联，因此从头到尾阅读全书有助于形成更完整的理解。


    ### 网络抓取的定义


    网络抓取是一个过程，涉及从互联网检索半结构化文档（通常是 HTML 或 XHTML 等标记语言的网页），并分析该文档以提取特定数据，以便在其他上下文中使用。它通常（尽管不完全准确）也被称为屏幕抓取。网络抓取在技术上不属于数据挖掘领域，因为后者暗示尝试从已获得的大型数据集中识别语义模式或趋势。网络抓取应用程序（也称为智能、自动或自主代理）仅关注通过检索和提取获取数据本身，涉及的数据集大小可以差异很大。


    你可能会对自己说，网络抓取听起来很像充当 Web 服务的客户端。区别在于文档的目标受众，进而由之决定的文档格式和结构。Web 服务由于其既定目的，本质上受限于生成有效标记的要求，以保持其有用性。它们必须保持一致的标准格式，以便机器能够解析其输出。


    另一方面，Web 浏览器在处理文档的视觉渲染时，即使其标记无效，通常也更具宽容性。此外，Web 浏览器旨在供人类使用，它们消费信息的方式并不总是与机器在使用等效
    Web 服务时消费信息的方式平行。这在某些情况下会使网络抓取应用程序的开发变得困难。就像 Web 服务生成有效标记的义务一样，Web 浏览器也有某些责任。这些包括尊重服务器请求以不索引某些页面，以及将发送给服务器的请求数量保持在合理范围内。


    简而言之，网络抓取是 Web 浏览器功能的一个子集，用于以一种适合数据使用方式获取和渲染数据。


    ### 网络抓取的应用


    虽然网站使用 Web 服务公开其数据变得越来越普遍，但缺乏针对机器定制的数据源（该数据源提供对应网站的所有数据）仍然是一种常见情况。在这种情况下，网站本身必须有效地成为你的数据源，而网络抓取可以被用来自动化消费其提供的数据。此外，Web
    服务还用于将信息传输到外部数据系统。在没有它们的情况下，网络抓取也可以用于与那些不提供 Web 服务但为其用户提供基于 Web 接口的系统集成。


    网络抓取的另一个应用可能更为知名，即开发名为爬取器（crawlers）的自动代理，它们寻找用于存储和分析的资源，这些资源最终将构成提供给你的搜索结果。在互联网的最初日子里，这种类型的数据是由人类手动寻找的，这是一个缓慢且繁琐的过程，限制了搜索引擎扩展其服务的速度。网络抓取提供了一种替代方案，让计算机来完成查找新页面和提取其内容的繁重工作。


    最后，网络抓取是实现 Web 应用程序集成测试的一种方式——不是唯一的方式，也不一定是推荐的方式，但确实是其中一种方式。利用其作为客户端提取和传输数据的能力，网络抓取应用程序可以模拟普通用户的浏览器活动。这有助于确保
    Web 应用程序的输出符合其预期的响应，以应对应用程序的需求。


    ### 网络抓取的适当使用


    一些数据提供者可能只提供网站，而另一些可能提供不提供等效数据（以 conducive 格式或根本不提供）的 API。一些 Web 服务可能涉及广泛的身份验证流程，或不可用于公共消费。与网站相比，Web
    服务端点的不可靠性也可能使其不可行。正是在这些情况下，网络抓取成为一种理想的替代方案。


    通常的做法是避免进行破坏现有使用 Web 服务 API 的应用程序向后兼容性的更改，或者对它们进行版本管理，以允许应用程序供应商有时间过渡到新版本。因此，与网站页面的标记结构相比，Web
    服务被修改的可能性要小得多，尤其是没有事先警告的情况下。对于经常更改的网站，这一点尤其成立，这可能会严重影响使用网络抓取的应用程序的稳定性。


    简而言之，当没有其他可行的选项来获取所需数据时，网络抓取应作为最后手段使用。


    ### 网络抓取的合法性


    这个问题的答案相当详细，并偏离到了“法律领域”。因此，它被收录在附录 A 中，以免分散本书的主要目的。


    ### 涵盖的主题


    你显然正在阅读第 1 章，本章提供了网络抓取的简要介绍，回答了常见问题，并引出本书的主要内容。


    - 第 2 章讨论 HTTP 协议的相关细节，因为在文档检索过程中使用了 HTTP 客户端。这包括请求和响应的结构，以及在实现 Cookie、HTTP 身份验证、重定向等功能时使用的各种头部信息。


