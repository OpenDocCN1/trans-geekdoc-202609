  md: "\n- The `HttpRequestPool` constructor accepts a variable number of arguments,\
    \ all of which should be preconfigured `HttpRequest` instances.\n- Request instances\
    \ can also be added via the `attach` method of the `HttpRequestPool` class.\n\
    - `send` is called on the pool instance to transmit all requests and blocks until\
    \ all responses are received. Once complete, all request instances contain their\
    \ respective sets of response data as if they had been sent individually.\n\n\
    # Wrap-Up\n\nFor more information on the `pecl_http` extension, see http://php.net/http.\n\
    For more information on its request options, http://php.net/manual/en/http.request.options.php.\n\
    \n# Chapter 6\n\n## PEAR::HTTP_Client\n\nThe PHP Extension and Application Repository\
    \ (PEAR) project houses a library of reusable components written in PHP and a\
    \ package system for distributing them, one of which is the **HTTP_Client** package\
    \ that will be covered in this section. PEAR spurred the creation of the PECL\
    \ project, a repository of C extensions from which the `pecl_http` extension discussed\
    \ in the previous section originates.\n\nOne trait of many components in PEAR\
    \ is backward compatibility with older versions of PHP. The **HTTP_Client** package\
    \ itself only requires 4.3.0, while the latest and last version of the PHP 4 branch\
    \ is 4.4.9. As such, this client may be a good solution when feature requirements\
    \ are more advanced than what the HTTP streams wrapper natively supports and the\
    \ intended runtime environment is restricted to an older PHP version. Otherwise,\
    \ if you still want an HTTP client written in PHP, have a look at `Zend_Http_Client`\
    \ as described in the next section. It should go without saying that support for\
    \ PHP 4.x has ceased and that it is highly advisable to run a more current stable\
    \ version of PHP in production environments.\n\nPHP source tarballs have a configure\
    \ option to include PEAR when compiling. Some operating systems may have a package\
    \ for PEAR apart from PHP itself. Once PEAR is installed, `pear install HTTP_Client`\
    \ should be sufficient to install PEAR::HTTP_Client. There is also the option\
    \ to manually download tarballs for the necessary PEAR packages (HTTP_Client,\
    \ HTTP_Request, Net_URL, and Net_Socket), though this is a bit more difficult\
    \ to maintain in the long term as updates are released.\n\n**PEAR Developments**\n\
    At the time of writing, efforts are being put into PEAR 2, the successor to the\
    \ current incarnation of the PEAR project. This will include a newer package distribution\
    \ system and ports or revamps of many existing packages to bring them up-to-date\
    \ with features available in PHP 5. However, because there is currently little\
    \ in the way of stable ported code for PEAR 2, coverage in this book will be limited\
    \ to PEAR 1.\n\n# Requests and Responses\n\nThere are two ways to perform HTTP\
    \ requests with the related PEAR components: HTTP_Request and HTTP_Client. The\
    \ latter composes the former to add capabilities such as handling redirects and\
    \ persisting headers, cookie data, and request parameters across multiple requests.\
    \ Here's how to perform a simple request and extract response information when\
    \ using HTTP_Request directly.\n\n```php\n<?php\nrequire_once 'HTTP/Request.php';\n\
    \n$request =& HTTP_Request('http://localhost.example');\n$request->setMethod(HTTP_REQUEST_METHOD_GET);\n\
    $request->setURL('http://localhost.example');\n$response = $request->sendRequest();\n\
    ?>\n```\n\n- The HTTP_Request constructor has two parameters, both of which are\
    \ optional. The first is a string containing the URL for the request; note that\
    \ the `setURL` method is an alternative way to specify a value for this. The second\
    \ is a parameters array, which will be discussed later.\n- By default, the GET\
    \ method is used. `setMethod` is used to change this using constants, the names\
    \ for which are formed by prefixing the desired request method with `HTTP_REQUEST_METHOD_`\
    \ as in `HTTP_REQUEST_METHOD_GET`.\n\n`sendRequest` intuitively dispatches the\
    \ request and obtains the response. It returns either `true` to indicate that\
    \ that request succeeded or an error object (of the PEAR_Error class by default)\
    \ if an issue occurred.\n\nIssues that cause errors include environmental requirements\
    \ of the component not being met or the target of the request exceeding the redirect\
    \ limit. `PEAR::isError` is used to determine if the `sendRequest` call resulted\
    \ in an error. If the request is sent successfully, several methods of the request\
    \ object are available to extract response information.\n\n```php\n<?php\nif (!PEAR::isError($response))\
    \ {\n  $code = $request->getResponseCode();\n  $reason = $request->getResponseReason();\n\
    \  $body = $request->getResponseBody();\n  $cookies = $request->getResponseCookies();\n\
    \  $headers = $request->getResponseHeader();\n  $contentType = $request->getResponseHeader('Content-Type');\n\
    }\n?>\n```\n\nHere are a few specifics about the response information methods.\n\
    \n- `getResponseCode` returns an integer containing the HTTP status code.\n- `getResponseReason`\
    \ returns a string containing a description that corresponds to the HTTP status\
    \ code.\n- `getResponseCookies` returns `false` if no cookies are set; otherwise\
    \ it returns an enumerated array of associative arrays each of which contains\
    \ information for an individual cookie such as its name, value, and expiration\
    \ date.\n- `getResponseHeader` will return an associative array of all headers\
    \ indexed by header name (in all lowercase) if no parameter is passed to it; otherwise,\
    \ it takes a single string parameter containing a specific header name for which\
    \ it will return the value.\n\n`sendRequest` does not modify any parameters set\
    \ by you that are specific to the request (as opposed to the response). That is,\
    \ request instances can be reused and individual parameters modified only as needed\
    \ to change what differs between consecutive requests. To \"start fresh\" with\
    \ an existing request instance, simply explicitly call its constructor method.\n\
    \n```php\n<?php\n$request =& new HTTP_Request;\n// ...\n$request->HTTP_Request();\n\
    // all parameters previously set will be cleared\n?>\n```\n\n## Juggling Data\n\
    \nHTTP_Request makes data management pretty easy and straightforward, so it's\
    \ all covered in this section.\n\n```php\n<?php\n$request =& new HTTP_Request('http://localhost.example');\n\
    \n// GET\n$request->addQueryString('variable', 'value');\n$request->addRawQueryString('foo=bar');\n\
    \n// POST\n$request->addPostData('variable', 'value');\n$request->clearPostData();\n\
    \n// COOKIE\n$request->addCookie('variable', 'value');\n$request->clearCookies();\n\
    \n// FILES\n$request->addFile('fieldname', '/path/to/file', 'text/plain');\n?>\n\
    ```\n\n- `addRawQueryString` isn't named very intuitively, as it actually overwrites\
    \ any query string that you've previously set.\n- By default, `addQueryString`\
    \ and `addPostData` will URL-encode the variable value. To prevent this if your\
    \ data is already pre-encoded, pass the value `true` as the third parameter to\
    \ either method.\n- `clearPostData` and `clearCookies` reset internal variables\
    \ used to store data passed in by `addQueryString` and `addPostData` respectively.\n\
    - `setURL` and `addQueryString` or `addRawQueryString` can be used together to\
    \ control the content of the internal variable for the URL of the request. `getURL`\
    \ can be used to see the effects of these during development.\n- `addFile` is\
    \ intended to simulate uploading a file via a file input field in an HTML form.\
    \ For forms with multiple file upload files with the same name, pass an array\
    \ of file paths as the second parameter and (optionally) an array of corresponding\
    \ file MIME types as the third parameter.\n- To send the contents of a file as\
    \ the entire body of a request, use `file_get_contents` to retrieve the file contents\
    \ into a string and pass that to the `setBody` method of the request instance.\n\
    \n## Wrangling Headers\n\nHandling headers is also relatively straightforward.\
    \ The only header-specific convenience method that's included is for handling\
    \ Basic HTTP authentication, as shown below.\n\n```php\n<?php\n$request =& new\
    \ HTTP_Request;\n$request->addHeader('name', 'value');\n$request->removeHeader('name');\n\
    $request->setBasicAuth('username', 'password');\n?>\n```\n"
  mdcn: "\n\n- `HttpRequestPool` 构造函数接受可变数量的参数，所有参数都应是预配置好的 `HttpRequest` 实例。\n- 也可以通过\
    \ `HttpRequestPool` 类的 `attach` 方法添加请求实例。\n- 在池实例上调用 `send` 会发送所有请求，并阻塞直到接收到所有响应。完成后，所有请求实例都包含各自的响应数据，就好像它们被单独发送一样。\n\
    \n# 小结\n\n有关 `pecl_http` 扩展的更多信息，请参阅 http://php.net/http。\n有关其请求选项的更多信息，请参阅 http://php.net/manual/en/http.request.options.php。\n\
    \n# 第 6 章\n\n## PEAR::HTTP_Client\n\nPHP 扩展和应用程序库 (PEAR) 项目包含一个由 PHP 编写的可重用组件库以及用于分发它们的系统，其中\
    \ **HTTP_Client** 包将在本节中介绍。PEAR 推动了 PECL 项目的创建，这是一个 C 扩展库，上一节中讨论的 `pecl_http`\
    \ 扩展就源自于此。\n\nPEAR 中许多组件的一个特点是与旧版本的 PHP 保持向后兼容性。 **HTTP_Client** 包本身仅要求 4.3.0，而\
    \ PHP 4 分支的最新且最终版本是 4.4.9。因此，当功能需求超出 HTTP 流封装器原生支持的范围，且预期的运行环境限制在旧版本的 PHP 时，此客户端可能是一个不错的解决方案。否则，如果您仍然希望使用用\
    \ PHP 编写的 HTTP 客户端，可以查看下一节中描述的 `Zend_Http_Client`。不言而喻，对 PHP 4.x 的支持已经停止，在生产环境中强烈建议运行更新的稳定版本\
    \ PHP。\n\nPHP 源代码包包含一个配置选项，用于在编译时包含 PEAR。某些操作系统可能提供了独立于 PHP 本身的 PEAR 软件包。一旦安装了\
    \ PEAR，`pear install HTTP_Client` 通常就足以安装 PEAR::HTTP_Client。也可以选择手动下载必要的 PEAR\
    \ 包（HTTP_Client、HTTP_Request、Net_URL 和 Net_Socket）的 tarball，尽管随着更新的发布，这在长期维护上会稍微困难一些。\n\
    \n**PEAR 的发展**\n在撰写本书时，正在进行 PEAR 2 的开发工作，它是当前 PEAR 项目版本的继任者。这将包括新的软件包分发系统，以及对许多现有软件包的移植或重新开发，使其与\
    \ PHP 5 中可用的功能保持同步。然而，由于目前 PEAR 2 缺乏稳定的移植代码，本书的范围将仅限于 PEAR 1。\n\n# 请求与响应\n\n使用相关的\
    \ PEAR 组件执行 HTTP 请求有两种方法：HTTP_Request 和 HTTP_Client。后者组合前者，以增加处理重定向以及在多个请求间持久化头部、cookie\
    \ 数据和请求参数等功能。以下是直接使用 HTTP_Request 执行简单请求并提取响应信息的方法。\n\n```php\n<?php\nrequire_once\
    \ 'HTTP/Request.php';\n\n$request =& HTTP_Request('http://localhost.example');\n\
    $request->setMethod(HTTP_REQUEST_METHOD_GET);\n$request->setURL('http://localhost.example');\n\
    $response = $request->sendRequest();\n?>\n```\n\n- HTTP_Request 构造函数有两个参数，均为可选。第一个是包含请求\
    \ URL 的字符串；注意，`setURL` 方法是指定此值的另一种方式。第二个是参数数组，将在后文中讨论。\n- 默认情况下，使用 GET 方法。使用常量通过\
    \ `setMethod` 更改此设置，常量的命名方式是在所需请求方法前加上 `HTTP_REQUEST_METHOD_` 前缀，例如 `HTTP_REQUEST_METHOD_GET`。\n\
    \n`sendRequest` 直观地分发请求并获取响应。它返回 `true` 表示该请求成功，或者如果出现问题则返回一个错误对象（默认为 PEAR_Error\
    \ 类）。\n\n导致错误的问题包括组件的环境要求未得到满足或请求目标超出了重定向限制。`PEAR::isError` 用于确定 `sendRequest`\
    \ 调用是否导致了错误。如果请求成功发送，可以使用请求对象的几种方法来提取响应信息。\n\n```php\n<?php\nif (!PEAR::isError($response))\
    \ {\n  $code = $request->getResponseCode();\n  $reason = $request->getResponseReason();\n\
    \  $body = $request->getResponseBody();\n  $cookies = $request->getResponseCookies();\n\
    \  $headers = $request->getResponseHeader();\n  $contentType = $request->getResponseHeader('Content-Type');\n\
    }\n?>\n```\n\n以下是关于响应信息方法的几个具体细节。\n\n- `getResponseCode` 返回包含 HTTP 状态码的整数。\n-\
    \ `getResponseReason` 返回包含与 HTTP 状态码对应的描述字符串。\n- 如果没有设置 cookie，`getResponseCookies`\
    \ 返回 `false`；否则，它返回一个关联数组的枚举数组，其中每个数组包含单个 cookie 的信息，如其名称、值和过期时间。\n- 如果未向 `getResponseHeader`\
    \ 传递参数，它将返回一个包含所有头部的关联数组，索引为头部名称（全部小写）；否则，它接受一个包含特定头部名称的字符串参数，并返回其值。\n\n`sendRequest`\
    \ 不会修改你设置的特定于请求的参数（相对于响应而言）。也就是说，请求实例可以重用，仅根据需要修改个别参数，以改变连续请求之间的差异。要使用现有的请求实例“重新开始”，只需显式调用其构造函数方法。\n\
    \n```php\n<?php\n$request =& new HTTP_Request;\n// ...\n$request->HTTP_Request();\n\
    // 所有之前设置的参数都将被清除\n?>\n```\n\n## 数据处理\n\nHTTP_Request 使数据管理变得非常简单直接，因此本节涵盖了所有内容。\n\
    \n```php\n<?php\n$request =& new HTTP_Request('http://localhost.example');\n\n\
    // GET\n$request->addQueryString('variable', 'value');\n$request->addRawQueryString('foo=bar');\n\
    \n// POST\n$request->addPostData('variable', 'value');\n$request->clearPostData();\n\
    \n// COOKIE\n$request->addCookie('variable', 'value');\n$request->clearCookies();\n\
    \n// FILES\n$request->addFile('fieldname', '/path/to/file', 'text/plain');\n?>\n\
    ```\n\n- `addRawQueryString` 的命名不太直观，因为它实际上会覆盖你之前设置的任何查询字符串。\n- 默认情况下，`addQueryString`\
    \ 和 `addPostData` 会对变量值进行 URL 编码。如果数据已经预先编码，想要防止此行为，请在任一方法中传递值 `true` 作为第三个参数。\n\
    - `clearPostData` 和 `clearCookies` 分别重置用于存储由 `addQueryString` 和 `addPostData`\
    \ 传入数据的内部变量。\n- `setURL` 和 `addQueryString` 或 `addRawQueryString` 可以一起使用，以控制请求\
    \ URL 内部变量的内容。在开发期间可以使用 `getURL` 来查看这些操作的效果。\n- `addFile` 旨在模拟通过 HTML 表单中的文件输入字段上传文件。对于具有多个同名文件上传的表单，第二个参数传递文件路径数组，（可选地）第三个参数传递相应的文件\
    \ MIME 类型数组。\n- 要将文件内容作为请求的整个正文发送，请使用 `file_get_contents` 获取文件内容到一个字符串，并将其传递给请求实例的\
    \ `setBody` 方法。\n\n## 处理头部\n\n处理头部也相对简单。包含的唯一特定于头部的便捷方法用于处理基本的 HTTP 身份验证，如下所示。\n\
    \n```php\n<?php\n$request =& new HTTP_Request;\n$request->addHeader('name', 'value');\n\
    $request->removeHeader('name');\n$request->setBasicAuth('username', 'password');\n\
    ?>\n```\n\n"
