    - S (大写): 将花费额外的时间来分析模式，以加速后续使用该模式的匹配。适用于多次使用的模式。

    - U: 默认情况下，量词 `*` 和 `+` 表现为所谓的“贪婪”模式。也就是说，它们尽可能匹配尽可能多的字符，而不是尽可能少的字符。此修饰符强制使用后一种行为。

