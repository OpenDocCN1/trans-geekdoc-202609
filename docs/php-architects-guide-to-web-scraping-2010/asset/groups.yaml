    # 致谢


    我知道这部分可能不是你们购买本书的主要原因，但我还是鼓励你们继续读下去。我在大学期间学到的一件事是，即使我无法记住所有教给我的知识，但对这些知识拥有哪怕模糊的意识，也能拓宽并改善我的视角。我认为，在阅读某位作者写的书时，更多地了解这位作者也是同理，尤其是那些在其生活和完成作品过程中给予支持的人。这里提到的人都是好人，他们值得被铭记。


    ## 惠特尼


    我花了无数个夜晚和周末来写这本书。那几个月简直是个时间黑洞。这也是我自我提升、展示能力以及分享我所拥有之物的个人追求的一部分。我无法想象对于配偶来说，理解并支持我坚持这么久直到完稿是一件多么不容易的事，而我的妻子做到了。对此，我找不到足够的言语来描述，更别提回报，所以我不会尝试。我只想说，希望你们喜欢这本书，因为如果没有她，这本书将不会存在。


    ## MTA


    在我真正开始着手写书之前，我曾尝试向几家大型技术出版商推介这个书稿概要，但没有成功。不过，最终结果反而是更好的，因为 PHP 社区正是我的目标读者。事后看来，为了达到这一目的，我不认为我能找到比
    php|architect 更好的出版商了。当时，我在 php|architect 杂志上仅有一篇关于该主题的文章出自我的手笔。Liz 审阅了提案并将其推介给
    Marco，最终由 Marco 做出了接受的决定，而 Beth 则在初稿完成后进行了审阅。每个人都在确保本书成为一部打磨精良的出版作品方面发挥了作用，即使书已经付梓很久之后，我依然会感激他们的付出。


    ## 卢克


    我没能找到比卢克·朱利亚尼（Luke Giuliani）更好的技术编辑了。他有一种细致入微和超凡的注重细节的习惯，有时甚至超越了我自己，但大多数时候，这是我们共同拥有的令人愉快的特质。即使我陷入困境，他也总能提供动力和鼓励。他的建议不仅包括与书籍内容相关的更正和建议，还包括关于组织和呈现方式的指导，以最大化清晰度。如果没有卢克的参与，我严重怀疑我的书不会像你们眼前看到的这个版本如此精良。我欠他很多。


    ## 本


    本是一个令我极度尊敬的人。他愿意表达他的观点，包括开发和遵守 Web 标准的重要性。我们从 HTTP 协议到罗伊·菲尔丁（Roy Fielding）关于 REST
    的论文解读的讨论，都令我着迷并深受启发。当这本书完稿的曙光在隧道尽头显现时，我开始考虑如果由一位拥有他这般专业知识的人为本书撰写前言，将会为它带来多大的价值。当我就此事联系他并询问他是否愿意担此重任时，他愉快地接受了。尽管完成项目本身感觉美好，但他对其价值的评价让这场胜利变得更加甜蜜。


    ## 朋友们


    “朋友”一词并非我轻率使用的。长久以来，我一直认为家人不是由血缘决定的，而是由人们如何对待彼此决定的，我对朋友也持同样的看法。在 PHP 社区中，有一群特殊的人，我将这个称号赋予他们。他们人数众多，无法一一列举，但其中每一位都在我需要的时刻提供过批评、建议或精神支持。我想他们都清楚自己是谁。无论他们如何看待自己付出的大小，我希望他们知道其重要性以及我对它的感激之情。


    ## 你们


    虽然写一本书可能需要更长的时间，但花时间读书也是个人投资。这本书经历了一段漫长的发展旅程才到达你们手中。你们是它的读者。我感激你们花费时间阅读这本书，并希望它能证明这段时间是值得的。无论你们读完后的看法如何，我都鼓励你们写一篇书评，在你喜欢的社交网站上讨论它，或者发送电子邮件至
    me@matthewturland.com 告诉我你们的想法。


    # 前言


    网络爬虫是 Web 的未来。当马修第一次找到我，邀请我为这本书写前言时，我并不相信这一点。事实上，我当时持有截然相反的观点。网络爬虫？那不是一个老话题吗——我们曾经在
    Web 开发早期做过的事情？我为什么要读关于网络爬虫的内容？这难道不道德吗？


    你们可能也在问自己同样的问题。


    于是，我开始思考——思考网络爬虫究竟是什么——我考虑得越多，它就越让我想起蒂姆·伯纳斯·李（Tim Berners-Lee）关于链接数据之 Web 的愿景，关于语义数据，它们相互连接并向所有人开放以共享和使用。网络爬虫难道不就是一种从一个来源获取数据并解析以用于自己应用程序的行为吗？这难道不是语义
    Web 的目标吗？


    当 Web 刚刚起步时，它的目的是共享数据。教育和研究社区利用 Web 来展示数据，并通过超链接将这些数据与其他数据联系起来。由于在早期，XML、网络服务和数据馈送（data
    feeds）（甚至更少）尚不存在，编写脚本从其他网站获取数据、解析接收到的 HTML、以某种方式处理数据，然后将其显示在自己的网站上，已成为一种常见做法。


    我最早接触网络爬虫的经历是在 1998 年，当时我想在一个网站上显示最新的新闻标题。当时，某个特定的新闻网站（名字不便透露）为其客户提供新闻标题的 HTML
    代码片段，以便嵌入他们的网站。然而，我并非客户，但我找到了一种方法来抓取原始 HTML，解析它，并将其显示在我的网站上。无论这种行为多么不道德——我绝不提倡这种行为——我参与的行为后来被发现被称为“网络爬虫”。


    '
