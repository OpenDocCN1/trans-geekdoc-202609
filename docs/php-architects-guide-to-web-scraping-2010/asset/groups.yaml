    ```

    GET /wiki/Main_Page HTTP/1.1

    Host: en.wikipedia.org

    ```


    此请求的各个组成部分如下。


    - **GET** 是 **方法或操作**。把它想象成句子中的动词，即你想对某物执行的动作。其他方法的例子包括 POST 和 HEAD。这些将在本章后面详细讲解。

