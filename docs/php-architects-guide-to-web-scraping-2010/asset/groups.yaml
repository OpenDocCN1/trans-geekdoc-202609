    not by default.


    +   • S (uppercase): Additional time will be spent to analyze the pattern in order
    to speed up subsequent matches with that pattern. Useful for patterns used multiple
    times.


    +   • U: By default, the quantifiers `*` and `+` behave in a manner referred to
    as “greedy.” That is, they match as many characters as possible rather than as
    few as possible. This modifier forces the latter behavior.'
