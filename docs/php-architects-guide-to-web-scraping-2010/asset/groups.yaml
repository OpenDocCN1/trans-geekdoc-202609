    ## Query Strings


    Another provision of URLs is a mechanism called the **query string** that is used
    to pass **request parameters** to web applications. Below is a GET request that
    includes a query string and is used to request a form to edit a page on Wikipedia.


    ```

    GET /w/index.php?title=Query_string&action=edit

    Host: en.wikipedia.org

    ```


    There are a few notable traits of this URL.


    - A question mark denotes the end of the resource path and the beginning of the
    query string.

    - The query string is composed of key-value pairs where each pair is separated
    by an ampersand.

    - Keys and values are separated by an equal sign.


    Query strings are not specific to GET operations and can be used in other operations
    as well. Speaking of which, let''s move on.


    ## Query String Limits


    Most mainstream browsers impose a limit on the maximum character length of a query
    string. There is no standardized value for this, but Internet Explorer 7 appears
    to hold the current least common denominator of 2,047 bytes at the time of this
    writing. Querying a search engine should turn up your preferred browser''s limit.
    It''s rare for this to become an issue during development, but it is a circumstance
    worth knowing.


    ## POST Requests


    The next most common HTTP operation after GET is POST, which is used to submit
    data to a specified resource. When using a web browser as a client, this is most
    often done via an HTML form. POST is intended to add to or alter data exposed
    by the application, a potential result of which is that a new resource is created
    or an existing resource is changed. One major difference between a GET request
    and a POST request is that the latter includes a **body** following the request
    headers to contain the data to be submitted.


    ```

    POST /w/index.php?title=Wikipedia:Sandbox&action=submit HTTP/1.1

    Host: en.wikipedia.org


    wpAntispam=&wpSection=&wpStarttime=20080719022313&wpEdittime=200807190221006&wpScrolltop=&wpTextbox1=~7%B7Please+leave+this+line+alone+%28sandbox%21+heading%29%7D%7D+%3C%21---Hello%21+Feel+free+to+try+your+formatting+and+editing+skills+below!this+line._As+this+page+is+for+editing+experiments%2C+this+page+will+automatically+be+cleaned+every+12+hours.+---%3E&wpSummary=&wpAutoSummary=d41d8cd98f00b204e9800998ecf8427e&wpSave=Save+page&wpPreview=Show+preview&wpDiff=Show+changes&wpEditToken=%5C%2B

    ```


    A single blank line separates the headers from the body. The body should look
    familiar, as it is formatted identically to the query string with the exception
    that it is not prefixed with a question mark.


    ![](img/1e839861f06c77df9ecabc0aed9127b5_32_0.png)


    ## URL Encoding


    One trait of query strings is that parameter values are encoded using percent-encoding
    or, as it''s more commonly known, **URL encoding**. The PHP functions urlencode
    and urldecode are a convenient way to handle string values encoded in this manner.
    Most HTTP client libraries handle encoding request parameters for you. Though
    it''s called URL encoding, the technical details for it are actually more closely
    associated with the URI as shown in section 2.1 of RFC 3986.


    ## HEAD Requests


    Though not common when accessing target web applications, HEAD requests are useful
    in web scraping applications in several ways. They function in the same way as
    a GET request with one exception: when the server delivers its response, it will
    not deliver the resource representation that normally comprises the response body.
    The reason this is useful is that it allows a client to get at the data present
    in the response headers without having to download the entire response, which
    is liable to be significantly larger. Such data can include whether or not the
    resource is still available for access and, if it is, when it was last modified.


    ```

    HEAD /wiki/Main_Page HTTP/1.1

    Host: en.wikipedia.org

    ```


    Speaking of responses, now would be a good time to investigate those in more detail.


    ## Responses


    Aside from the first response line, called the **status line**, responses are
    formatted very similarly to requests. While different headers are used in requests
    and responses, they are formatted the same way. A blank line separates the headers
    and the body in both requests and responses. The body may be absent in either
    depending on what the request operation is. Below is an example response.


    ```

    HTTP/1.0 200 OK

    Date: Mon, 21 Jul 2008 02:32:52 GMT

    Server: Apache

    X-Powered-By: PHP/5.2.5

    Cache-Control: private, s-maxage=0, max-age=0, must-revalidate

    Content-Language: en

    Last-Modified: Mon, 21 Jul 2008 02:06:27 GMT

    Content-Length: 53631

    Content-Type: text/html; charset=utf-8

    Connection: close


    [body...]

    ```


    Aside from headers, the main difference in content between requests and responses
    is in the contents of the request line versus the status line.


    - 1.0 is the minimum HTTP protocol version under which the response can be correctly
    interpreted by the client.

    - 200 is a response **status code** and OK is its corresponding human-readable
    description. It indicates the result of the server attempting to process the request,
    in this case that the request was successful.


    Status codes are divided into five classes distinguished by the first digit of
    the code. Below is a brief summary of each class. See section 10 of RFC 2616 for
    further descriptions of circumstances under which specific status codes may be
    received.


    - 1xx Informational: Request received, continuing process.

    - 2xx Success: Request received, understood, and accepted.

    - 3xx Redirection: Client must take additional action to complete the request.

    - 4xx Client Error: Request could not be fulfilled because of a client issue.

    - 5xx Server Error: Request was valid but the server failed to process it.


    Moving right along, let us examine headers in more depth.


    ## Headers


    An all-purpose method of communicating a variety of information related to requests
    and responses, headers are used by the client and server to accomplish a number
    of things including retention of state using cookies and identity verification
    using HTTP authentication. This section will deal with those that are particularly
    applicable to web scraping applications. For more information, see section 14
    of RFC 2616.


