  - '[PAGE 112]


    compare tidy output to the original document to confirm that correction of document
    malformations hasn''t resulted in data loss.


    Document encoding is one area where issues may arise later depending on the configuration
    of tidy when it''s used. For example, the XMLReader extension uses UTF-8 encoding
    internally, which may be problematic if your input document''s encoding conflicts.
    `input-encoding` and `output-encoding` can be used to control the assumed encoding
    for each.


    Other options are useful mainly for debugging purposes and should generally be
    turned off in production environments. This is a good reason for subclassing the
    `tidy` class to control default option values, so that two separate sets are easily
    accessible for different development environments.


    Three of these options are `indent`, `indent-spaces`, and `indent-attributes`.
    The first of these, `indent`, is a boolean value indicating whether tidy should
    apply indentation to make the hierarchical relationships between elements more
    visually prominent. `indent-spaces` is an integer containing the number of whitespace
    characters used to denote a single level of indentation, defaulting to 2. Lastly,
    `indent-attributes` is a boolean value indicating whether each individual attribute
    within an element should begin on a new line.


    Speaking of attributes, `sort-attributes` can be set to `alpha` in order to have
    element attributes be sorted alphabetically. It is set to `none` by default, which
    disables sorting.


    If lines within a document tend to be long and difficult to read, the `wrap` option
    may be useful. It''s an integer representing the number of characters per line
    that tidy should allow before forcing a new line. It is set to 68 by default and
    can be disabled entirely by being set to 0.


    Having no empty lines to separate blocks can also make markup difficult to read.
    `vertical-space` is a boolean value intended to help with this by adding empty
    lines for readability. It is disabled by default.


    # ## Debugging


    As good a job as it does, tidy may not always be able to clean documents. When
    using tidy to repair a document, it''s generally a good idea to check for what
    issues it encounters.'
  md: "\n# Chapter 9\n\n# Tidy Extension\n\nAt this point, you should have completed\
    \ the retrieval phase of the web scraping process and have your raw response body\
    \ ready and awaiting analysis. Congratulations on making it to the halfway mark.\n\
    \nWhile other response formats are certainly possible, chances are good that you\
    \ are dealing with a markup-based language like HTML or XHTML. As such, this chapter\
    \ and subsequent chapters will deal specifically with those formats. More often\
    \ than not, HTML will be the language in use.\n\nThere are a number of available\
    \ XML-focused PHP extensions that can deal with markup, which will be reviewed\
    \ in chapters to follow. While these extensions do provide some support for HTML\
    \ and are even somewhat forgiving about malformed markup, well-formed XHTML is\
    \ their ideal input. This being the case, the first step in the analysis process\
    \ is to perform any necessary cleanup on the response body in order to minimize\
    \ the number of issues that can be encountered later during analysis.\n\n## Validation\n\
    \nThe World Wide Web Consortium (W3C) provides a markup validation service in\
    \ order to promote adherence to web standards. You can access this service by\
    \ going to `http://validator.w3.org`. It accepts markup to be tested by URL, file\
    \ upload, or direct input. This will give you an indication of what issues, if\
    \ any, your document has with markup malformation.\n\n## Tidy\n\nThere are two\
    \ ways to proceed in cleaning up markup malformations. One is manual, involves\
    \ the use of basic string manipulation functions or regular expression functions,\
    \ and can quickly become messy and rather unmanageable. The other is more automated\
    \ and involves using the tidy extension to locate and correct markup issues. While\
    \ the process is configurable, it obviously lacks the fine-grained control that\
    \ comes with handling it manually.\n\nThe majority of this chapter will focus\
    \ on using tidy to correct markup issues. For those issues that tidy cannot handle\
    \ to your satisfaction, the approach mentioned earlier involving string and regular\
    \ expression functions is your alternative. Regular expressions will be covered\
    \ in more detail in a later chapter.\n\nThe tidy extension offers two API styles:\
    \ procedural and object-oriented. Both offer mostly equivalent functionality (relevant\
    \ differences will be covered later) and which to use is really a matter of preference.\
    \ Though both API styles use objects of the tidy class, it is recommended that\
    \ only one style be used as much as is feasible for the sake of consistency in\
    \ syntax. Code examples in this chapter will use both styles.\n\n## Input\n\n\
    Before correcting markup issues in a set of markup data, the data has to be parsed\
    \ into a tidy object. More often than not markup data will already be contained\
    \ within a string when it is ready to be parsed, but may also be stored in an\
    \ external file. See below for example of how to handle either of these cases.\n\
    \n```php\n<?php\n// Procedural\n$tidy = tidy_parse_string($string, $config);\n\
    $tidy = tidy_parse_file($filename, $config);\n\n// Object-oriented\n$tidy = new\
    \ tidy;\n$tidy->parseString($string, $config);\n$tidy->parseFile($filename, $config);\n\
    ?>\n```\n\n## Configuration\n\nLike the cURL extension, the tidy extension operates\
    \ largely on the concept of configuration; hence, $config parameters are present\
    \ in all calls in the above example. Unlike most other extensions, this parameter\
    \ can actually be one of two things: an associative array of setting-value pairs\
    \ or the path to an external configuration file.\n\nThe configuration file format\
    \ is somewhat similar to individual style settings in a CSS stylesheet. An example\
    \ is shown below. It's unlikely that a non-developer will need to access the configuration\
    \ settings and not the PHP source code using tidy as well. As such, separation\
    \ into an external configuration file is really only useful for the sake of not\
    \ cluttering source code with settings. Additionally, because the configuration\
    \ file is read from disk, it may pose performance concerns when in high use.\n\
    \n```\n// single-line comment\n/* multi-line comment */\nindent: false /* setting:\
    \ value */\nwrap: 78\n```\n\nWhen using the object-oriented API, an alternative\
    \ to using configuration files is subclassing the tidy class and overriding its\
    \ parseString and parseFile methods to automatically include specific configuration\
    \ setting values. This method allows for easy reuse of tidy configurations.\n\n\
    ```php\n<?php\nclass mytidy extends tidy {\n    private $._default = array(\n\
    \        'indent' => false,\n        'wrap' => 78\n    );\n```\n\n```php\npublic\
    \ function parseFile($filename, $config, $encoding, $use_include_path=false) {\n\
    \    return parent::parseFile(\n        $filename,\n        array_merge($this->_default,\
    \ $config),\n        $encoding,\n        $use_include_path\n    );\n}\n\npublic\
    \ function parseString($filename, $config, $encoding, $use_include_path=false)\
    \ {\n    return parent::parseString(\n        $filename,\n        array_merge($this->_default,\
    \ $config),\n        $encoding,\n        $use_include_path\n    );\n}\n?>\n```\n\
    \n- `array_merge` is used to consolidate default parameter values in the `$_default`\
    \ property into the specified `$config` array. Any parameters specified in the\
    \ original `$config` array will take precedence over corresponding parameters\
    \ specified in `$_default`.\n- `parseFile` and `parseString` pass the modified\
    \ `$config` parameter with all other provided parameters to their respective methods\
    \ in the tidy class and return the resulting return value.\n\n## Options\n\nTidy\
    \ includes a large number of configuration options, only a few of which are relevant\
    \ in the context of this book.\n\nTwo options deal with output formats applicable\
    \ for web scraping: `output.html` and `output.xhtml`. Both are specified as boolean\
    \ values. These options are mutually exclusive, meaning that only one can be set\
    \ to `true` at any given time. Generally `output.xhtml` is preferable, but may\
    \ not always be feasible to use. It's important to compare tidy output to the\
    \ original document to confirm that correction of document malformations hasn't\
    \ resulted in data loss.\n\nDocument encoding is one area where issues may arise\
    \ later depending on the configuration of tidy when it's used. For example, the\
    \ XMLReader extension uses UTF-8 encoding internally, which may be problematic\
    \ if your input document's encoding conflicts. `input-encoding` and `output-encoding`\
    \ can be used to control the assumed encoding for each.\n\nOther options are useful\
    \ mainly for debugging purposes and should generally be turned off in production\
    \ environments. This is a good reason for subclassing the `tidy` class to control\
    \ default option values, so that two separate sets are easily accessible for different\
    \ development environments.\n\nThree of these options are `indent`, `indent-spaces`,\
    \ and `indent-attributes`. The first of these, `indent`, is a boolean value indicating\
    \ whether tidy should apply indentation to make the hierarchical relationships\
    \ between elements more visually prominent. `indent-spaces` is an integer containing\
    \ the number of whitespace characters used to denote a single level of indentation,\
    \ defaulting to 2. Lastly, `indent-attributes` is a boolean value indicating whether\
    \ each individual attribute within an element should begin on a new line.\n\n\
    Speaking of attributes, `sort-attributes` can be set to `alpha` in order to have\
    \ element attributes be sorted alphabetically. It is set to `none` by default,\
    \ which disables sorting.\n\nIf lines within a document tend to be long and difficult\
    \ to read, the `wrap` option may be useful. It's an integer representing the number\
    \ of characters per line that tidy should allow before forcing a new line. It\
    \ is set to 68 by default and can be disabled entirely by being set to 0.\n\n\
    Having no empty lines to separate blocks can also make markup difficult to read.\
    \ `vertical-space` is a boolean value intended to help with this by adding empty\
    \ lines for readability. It is disabled by default.\n\n## Debugging\n\nAs good\
    \ a job as it does, tidy may not always be able to clean documents. When using\
    \ tidy to repair a document, it's generally a good idea to check for what issues\
    \ it encounters.\n"
  mdcn: "\n# 第 9 章\n\n# Tidy 扩展\n\n至此，你应该已经完成了网络爬虫流程中的检索阶段，原始的响应体已准备就绪，等待进一步分析。恭喜你在整个过程中达到了半程里程碑。\n\
    \n虽然其他响应格式也是可能的，但你极有可能正在处理基于标记的语言，例如 **HTML** 或 **XHTML**。因此，本章及后续章节将专门讨论这些格式。通常情况下，所使用的语言是\
    \ HTML。\n\n有许多可用的专注于 XML 的 PHP 扩展可以处理标记语言，这些将在后续章节中审查。虽然这些扩展确实提供了一些对 HTML 的支持，并且在处理格式错误的标记时也有一定的宽容度，但格式良好的\
    \ XHTML 才是它们的理想输入。鉴于此，分析过程的第一步是对响应体进行必要的清理，以最大程度地减少在后续分析过程中可能遇到的问题数量。\n\n## 验证\n\
    \n万维网联盟（W3C）提供了一个标记验证服务，旨在促进对 Web 标准的遵守。你可以通过访问 `http://validator.w3.org` 来访问此服务。它接受通过\
    \ URL、文件上传或直接输入方式提交的标记进行测试。这将让你了解你的文档是否存在标记格式问题，如果存在的话，具体是什么问题。\n\n## Tidy\n\n\
    清理标记格式错误有两种方式。一种是手动方式，涉及使用基本的字符串操作函数或正则表达式函数，但这种方式很快就会变得杂乱且难以管理。另一种方式更为自动化，涉及使用\
    \ tidy 扩展来定位和修正标记问题。虽然这个过程是可配置的，但显然它缺乏手动处理时的那种细粒度控制。\n\n本章的大部分内容将侧重于使用 tidy 来修正标记问题。对于那些\
    \ tidy 无法令你满意地处理的问题，前面提到的涉及字符串和正则表达式函数的方法是你的替代方案。正则表达式将在后续章节中更详细地介绍。\n\ntidy 扩展提供两种\
    \ API 风格：过程式和面向对象的。两者提供的功能大多等效（相关差异将在后文说明），选择使用哪一种纯属个人偏好。尽管两种 API 风格都使用 tidy 类的对象，但为了语法的一致性，建议在可行范围内尽量只使用一种风格。本章中的代码示例将同时使用这两种风格。\n\
    \n## 输入\n\n在修正一组标记数据中的标记问题之前，必须将数据解析到一个 tidy 对象中。通常情况下，当标记数据准备被解析时，它已经包含在一个字符串中，但也可能存储在一个外部文件中。请参阅下文，了解如何处理这两种情况的示例。\n\
    \n```php\n<?php\n// 过程式\n$tidy = tidy_parse_string($string, $config);\n$tidy =\
    \ tidy_parse_file($filename, $config);\n\n// 面向对象\n$tidy = new tidy;\n$tidy->parseString($string,\
    \ $config);\n$tidy->parseFile($filename, $config);\n?>\n```\n\n## 配置\n\n与 cURL\
    \ 扩展类似，tidy 扩展在很大程度上依赖于配置概念；因此，上述示例中的所有调用都包含 $config 参数。与大多数其他扩展不同，此参数实际上可以是两种形式之一：一个由设置-值对组成的关联数组，或者指向外部配置文件的路径。\n\
    \n配置文件格式与 CSS 样式表中的单独样式设置有些相似。一个示例如下所示。非开发人员不太可能需要访问这些配置设置，也不会像使用 tidy 访问 PHP\
    \ 源代码那样访问它们。因此，将配置分离到外部配置文件中，其唯一的作用实际上是为了避免使源代码被设置项弄乱。此外，由于配置文件是从磁盘读取的，在高使用率下可能会带来性能方面的顾虑。\n\
    \n```\n// 单行注释\n/* 多行注释 */\nindent: false /* 设置: 值 */\nwrap: 78\n```\n\n当使用面向对象的\
    \ API 时，使用配置文件的替代方案是子类化 tidy 类，并覆盖其 parseString 和 parseFile 方法，以自动包含特定的配置设置值。这种方法允许轻松复用\
    \ tidy 配置。\n\n```php\n<?php\nclass mytidy extends tidy {\n    private $._default\
    \ = array(\n        'indent' => false,\n        'wrap' => 78\n    );\n```\n\n\
    ```php\npublic function parseFile($filename, $config, $encoding, $use_include_path=false)\
    \ {\n    return parent::parseFile(\n        $filename,\n        array_merge($this->_default,\
    \ $config),\n        $encoding,\n        $use_include_path\n    );\n}\n\npublic\
    \ function parseString($filename, $config, $encoding, $use_include_path=false)\
    \ {\n    return parent::parseString(\n        $filename,\n        array_merge($this->_default,\
    \ $config),\n        $encoding,\n        $use_include_path\n    );\n}\n?>\n```\n\
    \n- `array_merge` 用于将 `$_default` 属性中的默认参数值合并到指定的 `$config` 数组中。在原始 `$config`\
    \ 数组中指定的任何参数都将优先于在 `$_default` 中指定的对应参数。\n- `parseFile` 和 `parseString` 将修改后的\
    \ `$config` 参数以及其他提供的参数传递到 tidy 类中各自的方法，并返回相应的返回值。\n\n## 选项\n\nTidy 包含大量配置选项，其中只有少数几个与本书的上下文相关。\n\
    \n两个选项涉及适用于网络爬虫的输出格式：`output.html` 和 `output.xhtml`。两者都指定为布尔值。这些选项是互斥的，意味着在任何给定时间只能将其中一个设置为\
    \ `true`。通常 `output.xhtml` 更可取，但可能并不总是可行。重要的是将 tidy 的输出与原始文档进行比较，以确认修正文档格式错误没有导致数据丢失。\n\
    \n根据使用时的配置，文档编码可能是后来会出现问题的领域之一。例如，XMLReader 扩展内部使用 UTF-8 编码，如果你的输入文档的编码与此冲突，可能会产生问题。`input-encoding`\
    \ 和 `output-encoding` 可用于控制各自的假设编码。\n\n其他选项主要用于调试目的，在生产环境中通常应将其关闭。这是一个子类化 `tidy`\
    \ 类以控制默认选项值的好理由，以便可以轻松访问两组不同的配置，用于不同的开发环境。\n\n这三个选项是 `indent`、`indent-spaces`\
    \ 和 `indent-attributes`。其中的第一个，`indent`，是一个布尔值，指示 tidy 是否应应用缩进，以使元素之间的层级关系在视觉上更突出。`indent-spaces`\
    \ 是一个整数，表示用于表示单级缩进的空格字符数量，默认为 2。最后，`indent-attributes` 是一个布尔值，指示元素内的每个单独属性是否应在新行开始。\n\
    \n说到属性，`sort-attributes` 可以设置为 `alpha`，以便按字母顺序对元素属性进行排序。默认设置为 `none`，这将禁用排序。\n\
    \n如果文档中的行往往很长且难以阅读，`wrap` 选项可能很有用。它是一个整数，表示 tidy 在强制换行前每行应允许的最大字符数。默认设置为 68，可以将其设置为\
    \ 0 来完全禁用。\n\n没有空行来分隔代码块也可能使标记难以阅读。`vertical-space` 是一个布尔值，旨在通过添加空行来提高可读性。默认情况下它是禁用的。\n\
    \n## 调试\n\n尽管 tidy 做得很好，但它并不总能清理文档。当使用 tidy 修复文档时，检查其遇到的问题是通常是个好主意。\n\n"
