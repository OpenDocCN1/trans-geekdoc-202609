    # ## Hierarchical Selectors


    Now let''s move on to hierarchical selectors, which use document structure as
    a way to select elements, using the previous markup example.


    +   - body ul would select all ul elements that are descendants of body elements.

    - ul > li would select all li elements that are children of ul elements.

    - ul + img would select all img elements that immediately follow a ul sibling
    element (i.e. are their next sibling).

    - ul ~ img would select all img elements that follow a ul sibling element (i.e.
    come after them and have the same parent node).


    The third and fourth items in this list probably look fairly similar. The difference
    is in the word “immediately.” By this example, the third item in the list would
    only select the Advertisement#1 image because it comes immediately after its ul
    sibling element in the document. The fourth item in the list, on the other hand,
    would select both images because both follow their ul sibling element.


    | **Selector** | **CSS** | **XPath** |

    | --- | --- | --- |

    | ancestor descendant | body ul | body//ul |

    | parent > child | ul > li | //ul/li |

    | prev + next | ul + img | //ul/following-sibling::img[1] |

    | prev ~ siblings | ul ~ img | //ul/following-sibling::img |


    # ## Basic Filters


    The selectors reviewed up to this point in the chapter have always changed the
    type of nodes being selected. Conversely, when a filter is appended to an expression,
    it merely restricts the returned set of nodes to a subset of those matching the
    original expression.


    Note that available filters vary per library. Support for filters in jQuery is
    fairly comprehensive and as such it is used as the primary reference for sections
    related to filters in this chapter.'
  md: "\n...cate to subsequent if branch cases that the iterator points to a node\
    \ that is within the desired table.\n\nThe next if branch is entered when table\
    \ row elements within the table are encountered. A combination of checking the\
    \ node name and the previously set `$inTable` flag facilitates this. When the\
    \ branch is entered, a new element in the `$tableData` array is initialized to\
    \ an empty array. This array will later store data from cells in that row. The\
    \ key associated with the row in `$tableData` is stored in the `$row` variable.\n\
    \nFinally, the last if branch executes when table cell elements are encountered.\
    \ Like the row branch, this branch checks the node name and the `$inTable` flag.\
    \ If the check passes, it then stores the current node’s value in the array associated\
    \ with the current table row.\n\nHere’s where the XMLREADER::END_ELEMENT node\
    \ type comes into play. Once the end of the table is reached, no further data\
    \ should be read into the array. So, if the ending element has the name ‘table’\
    \ and the `$inTable` flag currently indicates that the iterator points to a node\
    \ within the desired table, the flag is then set to false. Since no other tables\
    \ should theoretically have the same id attribute, no if branches will execute\
    \ in subsequent while loop iterations.\n\nIf this table was the only one of interest\
    \ in the document, it would be prudent to replace the `$inTable = false;` statement\
    \ with a `break 2;` statement. This would terminate the while loop used to read\
    \ nodes from the document as soon as the end of the table was encountered, preventing\
    \ any further unnecessary read operations.\n\n## readString() Availability\n\n\
    As its entry in the PHP manual notes, the `readString()` method used in the above\
    \ example is only present when the XMLReader extension is compiled against certain\
    \ versions of the underlying libxml library.\n\nIf this method is unavailable\
    \ in your environment, an alternative in the example would be to have opening\
    \ and closing table cell checks that toggle their own flag (e.g., `$inCell`) and\
    \ switch cases for the TEXT and CDATA node types that check this flag and, when\
    \ it is set to true, add the contents of the `value` property from the XMLReader\
    \ instance to the `$tableData` array.\n\n### DOM Interoperation\n\nOne nice feature\
    \ of the XMLReader extension is the `expand()` method, which returns an object\
    \ of the equivalent DOM extension class for the node to which the iterator currently\
    \ points. Element nodes, for example, cause this method to return a DOMElement\
    \ instance.\n\nThe example below illustrates a modification to the previous example\
    \ and provides another alternative to the `readString()` method for getting at\
    \ the contents of table cells by taking advantage of this DOM interoperability.\n\
    \n```php\n<?php\nif ($doc->localName == 'td' && $inTable) {\n    $node = $doc->expand();\n\
    \    $tableData[$row][] = $node->nodeValue;\n}\n?>\n```\n\n### Closing Documents\n\
    \nOnce all necessary read operations have been conducted on a document, the `close()`\
    \ method of the XMLReader instance should be called to cleanly terminate file\
    \ access or otherwise indicate that access to the original data source is no longer\
    \ needed.\n\n### Wrap-Up\n\nHopefully this chapter has given you an idea of how\
    \ pull parsers work in general and when it's better to use one like XMLReader\
    \ over a tree parser. For more information on XMLReader, check out its section\
    \ in the PHP manual at <http://www.php.net/manual/en/book.xmlreader.php>.\n\n\
    ## Chapter 13\n\n### CSS Selector Libraries\n\nThis chapter will review several\
    \ libraries that are built on top of the XML extensions described in previous\
    \ chapters. These libraries provide interfaces that use CSS selector expressions\
    \ to query markup documents rather than a programmatic API or XPath expressions.\
    \ Don't be concerned if you aren't familiar with CSS selectors, as part of this\
    \ chapter showcases basic expressions alongside their XPath equivalents.\n\n![](img/1e839861f06c77df9ecabc0aed9127b5_148_0.png)\n\
    \n**CSS Versions**\n\nThere are multiple versions of the CSS standard and supported\
    \ selectors vary with each version. This chapter will cover a subset of those\
    \ available in CSS3. Versions of the CSS standard supported by particular libraries\
    \ are noted where available. A list of differences between the two common versions,\
    \ CSS2 and CSS3, can be found at <http://www.w3.org/TR/css3-selectors/#changesFromCSS2>.\n\
    \n### Reason to Use Them\n\nBefore getting into the “how” of using CSS selector\
    \ libraries, it's probably best to get the “why” (and “why not”) out of the way\
    \ first. It goes without saying that these libraries add a layer of complexity\
    \ to applications that use them, introducing another potential point of failure.\
    \ They implement expression parsers in order to take CSS selector expressions\
    \ as their input and translate them into equivalent userland operations, which\
    \ can have an impact on performance.\n\nThose points aside, they do offer a syntax\
    \ that is considered by some to be more intuitive. Most developers these days\
    \ know at least some CSS and probably have a little experience with a JavaScript\
    \ library that uses CSS selectors for node selection on the client side, such\
    \ as jQuery. Thus, knowledge of that particular area is transferable to the server\
    \ side when libraries based around it are used.\n\nTo sum this up, if you're particularly\
    \ concerned about performance or simplicity of the application with regard to\
    \ the number of components on which it is dependent, it's probably best to stick\
    \ with something like XPath. Otherwise, CSS selector libraries are worthy of consideration\
    \ for making use of a common existing skillset.\n\nEven if your decision is to\
    \ stick with XPath, keep reading. This chapter will also show some XPath equivalents\
    \ for each set of explained CSS selectors, which may help to further your understanding\
    \ of XPath. Note that these comparisons are not necessarily comprehensive and\
    \ there may be multiple ways to express the same thing in any given case.\n\n\
    ![](img/1e839861f06c77df9ecabc0aed9127b5_149_0.png)\n\n### jQuery Examples\n\n\
    The documentation for the jQuery library itself actually has excellent visual\
    \ client-side examples of selectors. If you find you aren't certain that you understand\
    \ any of the descriptions of CSS selectors that follow, the jQuery demos and source\
    \ code will likely prove to be helpful supplements. You can find them at <http://api.jquery.com/category/selectors/>.\n\
    \n### Basics\n\nLet's look at a few basic selectors and their results when applied\
    \ to a markup example.\n\n```html\n<html>\n<body>\n  <div id=\"nav\">\n    <ul\
    \ class=\"horizontal\">\n      <li><a href=\"/home\">Home</a></li>\n      <li><a\
    \ href=\"/about-us\">About Us</a></li>\n      <li><a href=\"/contact-us\">Contact\
    \ Us</a></li>\n    </ul>\n    <img src=\"/img/ad1.jpg\" alt=\"Advertisement #1\"\
    >\n    <img src=\"/img/ad2.jpg\" alt=\"Advertisement #2\">\n  </div>\n</body>\n\
    </html>\n```\n\n- `#nav` would select the div element because it has an id attribute\
    \ value of nav.\n- `li` would select all li elements by their node name.\n- `.horizontal`\
    \ would select the ul element because it has a class of horizontal. (Note that\
    \ elements can have multiple classes.)\n- `*` would select all elements in the\
    \ document.\n- `li, a` would select all li and a elements in the document by combining\
    \ the two selectors li and a into a comma-delimited list.\n\nHere are the XPath\
    \ equivalents along side their respective CSS counterparts. Aside from the .class\
    \ selector, the XPath expressions are not significantly longer or more complex.\n\
    \n| Selector | CSS | XPath |\n| :--- | :--- | :--- |\n| id | `#nav` | `//*[@id=\"\
    nav\"]` |\n| element | `li` | `//li` |\n| class | `.horizontal` | `//*[@class=\"\
    horizontal\"] or starts-with(@class, \"horizontal \") or contains(@class, \" horizontal\
    \ \") or ends-with(@class, \" horizontal \")` |\n| wildcard | `*` | `//*` |\n\
    | multiple | `li, a` | `//li | //a` |\n\n### Hierarchical Selectors\n\nNow let's\
    \ move on to hierarchical selectors, which use document structure as a way to\
    \ select elements, using the previous markup example.\n\n- `body ul` would select\
    \ all ul elements that are descendants of body elements.\n- `ul > li` would select\
    \ all li elements that are children of ul elements.\n- `ul + img` would select\
    \ all img elements that immediately follow a ul sibling element (i.e. are their\
    \ next sibling).\n- `ul ~ img` would select all img elements that follow a ul\
    \ sibling element (i.e. come after them and have the same parent node).\n\nThe\
    \ third and fourth items in this list probably look fairly similar. The difference\
    \ is in the word “immediately.” By this example, the third item in the list would\
    \ only select the Advertisement#1 image because it comes immediately after its\
    \ ul sibling element in the document. The fourth item in the list, on the other\
    \ hand, would select both images because both follow their ul sibling element.\n\
    \n| **Selector** | **CSS** | **XPath** |\n| --- | --- | --- |\n| ancestor descendant\
    \ | `body ul` | `body//ul` |\n| parent > child | `ul > li` | `//ul/li` |\n| prev\
    \ + next | `ul + img` | `//ul/following-sibling::img[1]` |\n| prev ~ siblings\
    \ | `ul ~ img` | `//ul/following-sibling::img` |\n\n### Basic Filters\n\nThe selectors\
    \ reviewed up to this point in the chapter have always changed the type of nodes\
    \ being selected. Conversely, when a filter is appended to an expression, it merely\
    \ restricts the returned set of nodes to a subset of those matching the original\
    \ expression.\n\nNote that available filters vary per library. Support for filters\
    \ in jQuery is fairly comprehensive and as such it is used as the primary reference\
    \ for sections related to filters in this chapter.\n"
  mdcn: "\n\n...类到后续 if 分支案例中，指示迭代器指向的节点位于目标表格内部。\n\n当遇到表格行元素时，进入下一个 if 分支。通过检查节点名称和先前设置的\
    \ `$inTable` 标志来促进这一过程。当进入该分支时，`$tableData` 数组中的新元素被初始化为空数组。该数组稍后将存储该行中单元格的数据。与\
    \ `$tableData` 中该行关联的键存储在 `$row` 变量中。\n\n最后，当遇到表格单元格元素时执行最后一个 if 分支。与行分支类似，此分支检查节点名称和\
    \ `$inTable` 标志。如果检查通过，则会将当前节点的值存储在关联于当前表格行的数组中。\n\n这就是 XMLREADER::END_ELEMENT\
    \ 节点类型发挥作用的地方。一旦到达表格末尾，就不应将更多数据读入数组。因此，如果结束元素名为 'table'，且 `$inTable` 标志当前指示迭代器指向目标表格内的节点，则将该标志设置为\
    \ false。由于理论上没有其他表格应拥有相同的 id 属性，因此在后续 while 循环迭代中不会执行任何 if 分支。\n\n如果该表格是文档中唯一感兴趣的表格，将\
    \ `$inTable = false;` 语句替换为 `break 2;` 语句是明智的。这将在遇到表格末尾时终止用于从文档读取节点的 while 循环，防止任何进一步的无谓读取操作。\n\
    \n## readString() 可用性\n\n正如 PHP 手册条目中所述，上述示例中使用的 `readString()` 方法仅在 XMLReader\
    \ 扩展针对特定版本的底层 libxml 库编译时才存在。\n\n如果你的环境中此方法不可用，示例中的替代方案是使用开/关表格单元格检查来切换它们自己的标志（例如\
    \ `$inCell`），并为 TEXT 和 CDATA 节点类型添加情况，这些情况会检查该标志，并且当标志设置为 true 时，将 XMLReader 实例的\
    \ `value` 属性的内容添加到 `$tableData` 数组中。\n\n### DOM 互操作\n\nXMLReader 扩展的一个良好特性是 `expand()`\
    \ 方法，它返回迭代器当前指向的节点对应的 DOM 扩展类对象。例如，元素节点导致此方法返回 DOMElement 实例。\n\n下面的示例说明了前一个示例的修改，并利用这种\
    \ DOM 互操作性提供了获取表格单元格内容的 `readString()` 方法的另一种替代方案。\n\n```php\n<?php\nif ($doc->localName\
    \ == 'td' && $inTable) {\n    $node = $doc->expand();\n    $tableData[$row][]\
    \ = $node->nodeValue;\n}\n?>\n```\n\n### 关闭文档\n\n在对文档执行所有必要的读取操作后，应调用 XMLReader\
    \ 实例的 `close()` 方法，以干净地终止文件访问，或者以其他方式表明不再需要访问原始数据源。\n\n### 总结\n\n希望本章能让你了解拉式解析器（pull\
    \ parsers）通常是如何工作的，以及在何时使用 XMLReader 这样的解析器比使用树解析器更好。要获取更多关于 XMLReader 的信息，请查看\
    \ PHP 手册中位于 <http://www.php.net/manual/en/book.xmlreader.php> 的相应章节。\n\n## 第 13\
    \ 章\n\n### CSS 选择器库\n\n本章将回顾几个建立在前面章节描述的 XML 扩展之上的库。这些库提供了使用 CSS 选择器表达式来查询标记文档的接口，而不是使用编程\
    \ API 或 XPath 表达式。如果你对 CSS 选择器不熟悉，请不要担心，因为本章的一部分将展示基本表达式及其 XPath 等价物。\n\n![](img/1e839861f06c77df9ecabc0aed9127b5_148_0.png)\n\
    \n**CSS 版本**\n\nCSS 标准有多个版本，支持的随版本变化的选择器各不相同。本章将涵盖 CSS3 中可用选择器的一个子集。特定库支持的 CSS\
    \ 标准版本会在可用的情况下注明。可以在 <http://www.w3.org/TR/css3-selectors/#changesFromCSS2> 找到两个常见版本\
    \ CSS2 和 CSS3 之间差异的列表。\n\n### 使用它们的理由\n\n在深入探讨使用 CSS 选择器库的“如何”之前，最好先弄清“为什么”（以及“为什么不”）。不用说，这些库为使用它们的应用程序增加了一层复杂性，引入了另一个潜在的故障点。为了实现将\
    \ CSS 选择器表达式作为输入并将其转换为等效的 userland 操作，它们实现了表达式解析器，这可能会影响性能。\n\n除上述观点外，它们确实提供了一些被认为更直观的语法。如今大多数开发人员至少了解一些\
    \ CSS，并且很可能对使用 CSS 选择器在客户端进行节点选择的 JavaScript 库（例如 jQuery）有一点经验。因此，当使用基于此的库时，该特定领域的知识可以转移到服务器端。\n\
    \n总而言之，如果你特别关注性能或应用程序的简洁性（相对于其依赖组件的数量），最好坚持使用像 XPath 这样的工具。否则，CSS 选择器库值得考虑，以便利用现有的通用技能集。\n\
    \n即使你的决定是坚持使用 XPath，请继续阅读。本章还将展示每组已解释 CSS 选择器的 XPath 等价物，这可能有助于进一步加深你对 XPath 的理解。请注意，这些比较并不一定是全面的，并且在任何给定情况下，可能有多种方式来表达相同的内容。\n\
    \n![](img/1e839861f06c77df9ecabc0aed9127b5_149_0.png)\n\n### jQuery 示例\n\njQuery\
    \ 库本身的文档实际上拥有出色的选择器可视化客户端示例。如果你不确定是否理解下面任何 CSS 选择器的描述，jQuery 演示和源代码很可能会证明是有益的补充。你可以在\
    \ <http://api.jquery.com/category/selectors/> 找到它们。\n\n### 基础\n\n让我们查看一些基本选择器及其应用于标记示例时的结果。\n\
    \n```html\n<html>\n<body>\n  <div id=\"nav\">\n    <ul class=\"horizontal\">\n\
    \      <li><a href=\"/home\">Home</a></li>\n      <li><a href=\"/about-us\">About\
    \ Us</a></li>\n      <li><a href=\"/contact-us\">Contact Us</a></li>\n    </ul>\n\
    \    <img src=\"/img/ad1.jpg\" alt=\"Advertisement #1\">\n    <img src=\"/img/ad2.jpg\"\
    \ alt=\"Advertisement #2\">\n  </div>\n</body>\n</html>\n```\n\n- `#nav` 将选择 div\
    \ 元素，因为它的 id 属性值为 nav。\n- `li` 将根据节点名称选择所有 li 元素。\n- `.horizontal` 将选择 ul 元素，因为它具有\
    \ horizontal 类。（注意元素可以具有多个类。）\n- `*` 将选择文档中的所有元素。\n- `li, a` 通过将两个选择器 li 和 a 组合成逗号分隔列表来选择文档中所有的\
    \ li 和 a 元素。\n\n以下是各自的 CSS 对应项旁边的 XPath 等价项。除了 .class 选择器外，XPath 表达式并没有显著变长或变得复杂。\n\
    \n| 选择器 | CSS | XPath |\n| :--- | :--- | :--- |\n| id | `#nav` | `//*[@id=\"nav\"\
    ]` |\n| 元素 | `li` | `//li` |\n| 类 | `.horizontal` | `//*[@class=\"horizontal\"\
    ] or starts-with(@class, \"horizontal \") or contains(@class, \" horizontal \"\
    ) or ends-with(@class, \" horizontal \")` |\n| 通配符 | `*` | `//*` |\n| 多重 | `li,\
    \ a` | `//li | //a` |\n\n### 层级选择器\n\n现在让我们继续讨论层级选择器，它们使用文档结构作为选择元素的方式，使用之前的标记示例。\n\
    \n- `body ul` 将选择所有 body 元素的 descendants（后代）中的 ul 元素。\n- `ul > li` 将选择所有 ul 元素的\
    \ children（子级）中的 li 元素。\n- `ul + img` 将选择所有紧随 ul 兄弟元素之后的 img 元素（即它们的下一个兄弟）。\n\
    - `ul ~ img` 将选择所有跟随 ul 兄弟元素的 img 元素（即它们之后且拥有相同父节点）。\n\n此列表中的第三项和第四项可能看起来非常相似。区别在于“immediately”（紧接）这个词。在此示例中，列表中的第三项只会选择\
    \ Advertisement#1 图像，因为它紧接在文档中其 ul 兄弟元素之后。另一方面，列表中的第四项将选择两个图像，因为两个都跟随其 ul 兄弟元素。\n\
    \n| **选择器** | **CSS** | **XPath** |\n| --- | --- | --- |\n| 祖先 后代 | `body ul`\
    \ | `body//ul` |\n| 父级 > 子级 | `ul > li` | `//ul/li` |\n| 前 + 后 | `ul + img` |\
    \ `//ul/following-sibling::img[1]` |\n| 前 ~ 兄弟 | `ul ~ img` | `//ul/following-sibling::img`\
    \ |\n\n### 基本过滤器\n\n本章到目前为止回顾的选择器始终改变所选择节点的 *类型*。相反，当在表达式后附加过滤器时，它仅仅是将返回的节点集限制为匹配原始表达式的子集。\n\
    \n请注意，可用的过滤器因库而异。jQuery 对过滤器的支持相当全面，因此在本章中，它被用作与过滤器相关部分的主要参考。\n\n"
