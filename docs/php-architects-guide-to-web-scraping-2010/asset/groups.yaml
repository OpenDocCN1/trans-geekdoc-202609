    Web scraping applications intended for long-term use generally function in one
    of two ways: real-time or batch.


    A web scraping application implemented using the real-time approach will receive
    a request and send a request out to the target application being scraped in order
    to fulfill the original request. There are two advantages to this. First, any
    data pulled from the target application will be current. Second, any data pushed
    to the target application will be reflected on that site in nearly the same amount
    of time it would take if the data had been pushed directly to the target application.
    This approach has the disadvantage of increasing the response time of the web
    scraping application, since the client essentially has to wait for two requests
    to complete for every one request that would normally be made to the target application.


