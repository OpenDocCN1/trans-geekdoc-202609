    ## 重定向


    Location 头由服务器使用，用于将客户端重定向到某个 URL。在此场景中，响应很可能包含 3xx 类状态码（例如 302 Found），但也可能包含
    201 代码以指示新资源的创建。有关更多信息，请参阅 RFC 2616 的子章节 14.30。


    从理论上讲，功能失调的应用程序可能会导致服务器在自身和客户端之间发起一系列无限的重定向。为此，客户端库通常会实现一个限制，规定在处理连续重定向的次数之前，假设被访问的应用程序行为不当并终止处理。库通常实现一个默认限制，但允许你用自己的限制覆盖它。


    ## 来源 URL


    被请求的资源可能以某种方式引用其他资源。当这种情况发生时，客户端传统上会在 Referer 头中包含来源资源的 URL。是的，该头的名称拼写错误，且是故意为之。该特定拼写错误的普遍性导致其进入了官方
    HTTP 规范，从而成为引用该特定头时使用的标准行业拼写。


    规范来源的情况有多种。用户可能在浏览器中点击超链接，在这种情况下，包含该超链接的资源的完整 URL 将是来源。当请求包含嵌入图像的标记资源时，随后对这些图像的请求将包含包含这些图像的页面的完整
    URL 作为来源。如前一节所述，发生重定向时也会指定来源。


    这一点之所以相关，是因为某些应用程序在设计上依赖于 Referer 头的值，而从简单事实来看，头值可以被伪造，因此这不是理想的情况。无论如何，重要的是要知道，如果提供的头值与应用程序在浏览器中使用时发送的值不一致，某些应用程序可能无法按预期运行。有关更多信息，请参阅
    RFC 2616 的子章节 14.36。


    ## 持久连接


    HTTP 请求的标准操作程序如下。


    - 客户端连接到服务器。

    - 客户端通过已建立的连接发送请求。

    - 服务器返回响应。

    - 连接终止。


    然而，在向同一服务器发送多个连续请求时，该过程中的第一步和第四步会产生大量的开销。HTTP 1.0 没有为此建立解决方案；每个请求一个连接是正常行为。在 HTTP
    1.0 和 1.1 标准的发布之间，非正式地建立了一种约定，涉及客户端在请求中包含一个值为 Keep-Alive 的 Connection 头，以指示服务器期望持久连接。


    后来，1.1 发布并将默认行为从每个请求一个连接更改为持久连接。对于非持久连接，客户端可以包含一个值为 close 的 Connection 头，以指示服务器在发送响应后终止连接。1.0
    和 1.1 之间的区别是一个重要的区别，在评估客户端库和托管目标应用程序的服务器时，应将其作为一个检查点，以便你了解它们相对于持久连接的行为。有关更多信息，请参阅
    RFC 2616 的子章节 8.1。


    存在一种替代实现，在客户端和服务器中获得的显著支持较少，涉及使用 Keep-Alive 头。此技术问题的讨论见 RFC 2068 的子章节 19.7.1，但应避免明确使用此头。这里提到它只是为了让你意识到它的存在，并且它与持久连接有关。


    ## 内容缓存


    存在两种方法允许客户端查询服务器，以确定自客户端上次访问以来资源是否已更新。RFC 2616 第 14 节的子章节详述了相关的头。


    第一种方法是基于时间的，服务器在响应中返回 `Last-Modified` 头（子章节 29），客户端可以在对同一资源的后续请求中通过 `If-Modified-Since`
    头（子章节 25）发送该值。


    另一种方法是基于哈希的，服务器通过 `Etag` 头（子章节 19）在响应中发送哈希值，客户端可以在对同一资源的后续请求中通过 `If-None-Match`
    头（子章节 26）发送该值。


    如果资源在任一情况下均未更改，服务器只需返回 304 Not Modified 响应。除了检查资源是否仍然可用（如果不可用将导致 404 响应）外，这是使用
    HEAD 请求的适当情况。


    或者，可以通过使用 `If-Unmodified-Since` 头（子章节 28）反转第一种方法的逻辑，在这种情况下，如果资源自提供的访问时间以来确实已被修改，服务器将返回
    412 Precondition Failed 响应。


    ## 用户代理


    客户端有时被称为用户代理。这指的是 Web 浏览器作为代理，代表用户行动，以最小化用户干预的事实。`User-Agent` 头使客户端能够提供关于自身的信息，例如名称和版本号。爬虫通常使用它来提供获取有关爬虫或爬虫操作员电子邮件地址的更多信息的
    URL。简单的搜索引擎查询应该会揭示主流浏览器的用户代理字符串列表。有关更多信息，请参阅 RFC 2616 的子章节 14.43。


    不幸的是，一些应用程序会参与一种被称为**用户代理嗅探**或**浏览器嗅探**的做法，它们根据客户端提供的用户代理字符串调整它们交付的显示内容。这可能完全禁用主要站点功能，例如使用
    ActiveX（一种特定于 Windows 和 Internet Explorer 的技术）的电子商务结账页面。


    此技术的一个著名应用是机器人排除标准，用于明确指示爬虫避免访问单个资源或整个网站。有关此标准的更多信息可在 http://www.robotstxt.org
    获取。在开发网络爬虫应用程序时，务必考虑那里详述的指导原则，以防止其表现出与正常用户不一致的行为。


    在某些情况下，一种称为**用户代理伪造**的客户端实践，涉及指定虚假的用户代理字符串，足以规避用户代理嗅探，但并非总是如此。应用程序可能有平台特定的要求，正当理由使其拒绝访问某些用户代理。无论如何，伪造用户代理是一种应尽可能避免的做法。


    ## 范围


    Range 请求头允许客户端指定服务器响应正文应限制为其正常正文的一个或多个特定字节范围。最初旨在允许失败的检索尝试从其停止点恢复，此功能允许你最小化应用程序与服务器之间的数据传输，以减少带宽消耗和网络爬虫应用程序的运行时间。


    这适用于你对目标数据在文档中的位置有大致了解的情况，尤其是当文档相当大且你只需要其包含数据的一个小子集时。然而，使用它确实为你的应用程序增加了一个变量，如果目标站点发生变化，这可能会破坏你的应用程序，你在选择这样做时应牢记这一点。


