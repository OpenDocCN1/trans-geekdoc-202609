    );\n?>\n```\n\n## Iteration\n\nThe XMLReader instance acts as both an iterator\
    \ over the entire document as well as a data object for the current node pointed\
    \ to by that iterator. It contains a set of read-only properties (described at\
    \ http://php.net/manual/en/class.xmlreader.php#xmlreader.props) that represent\
