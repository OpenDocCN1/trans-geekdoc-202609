    HTTP 被设计为一个无状态协议。也就是说，一旦服务器返回了请求的响应，它就实际上“忘记”了这个请求。它可能会记录关于请求及其提供的响应的信息，但它不会在同一个客户端的请求之间保留任何状态感。Cookies
