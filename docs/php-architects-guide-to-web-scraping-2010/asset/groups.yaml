    # Query String Limits


    Most mainstream browsers impose a limit on the maximum character length of a query
    string. There is no standardized value for this, but Internet Explorer 7 appears
    to hold the current least common denominator of 2,047 bytes at the time of this
    writing. Querying a search engine should turn up your preferred browser''s limit.
    It''s rare for this to become an issue during development, but it is a circumstance
    worth knowing.


    # POST Requests


    The next most common HTTP operation after GET is POST, which is used to submit
    data to a specified resource. When using a web browser as a client, this is most
    often done via an HTML form. POST is intended to add to or alter data exposed
    by the application, a potential result of which is that a new resource is created
    or an existing resource is changed. One major difference between a GET request
    and a POST request is that the latter includes a **body** following the request
    headers to contain the data to be submitted.


    ```

    POST /w/index.php?title=Wikipedia:Sandbox&action=submit HTTP/1.1

    Host: en.wikipedia.org


    wpAntispam=&wpSection=&wpStarttime=20080719022313&wpEdittime=200807190

    221006&wpScrolltop=&wpTextbox1=~7%B7Please+leave+this+line+alone+%28s

    andbox%21+heading%29%7D%7D+%3C%21---Hello%21+Feel+free+to+try+your+format

