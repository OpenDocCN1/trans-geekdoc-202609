    $tidy->parseFile($filename, $config);\n?>\n```\n\n# Configuration\n\nLike the\
    \ cURL extension, the tidy extension operates largely on the concept of configuration;\
    \ hence, $config parameters are present in all calls in the above example. Unlike\
    \ most other extensions, this parameter can actually be one of two things: an\
    \ associative array of setting-value pairs or the path to an external configuration\
    \ file.\n\nThe configuration file format is somewhat similar to individual style\
    \ settings in a CSS stylesheet. An example is shown below. It's unlikely that\
    \ a non-developer will need to access the configuration settings and not the PHP\
    \ source code using tidy as well. As such, separation into an external configuration\
    \ file is really only useful for the sake of not cluttering source code with settings.\
    \ Additionally, because the configuration file is read from disk, it may pose\
    \ performance concerns when in high use.\n\n```\n// single-line comment\n/* multi-line\
    \ comment */\nindent: false /* setting: value */\nwrap: 78\n```\n\nWhen using\
    \ the object-oriented API, an alternative to using configuration files is subclassing\
    \ the tidy class and overriding its parseString and parseFile methods to automatically\
    \ include specific configuration setting values. This method allows for easy reuse\
    \ of tidy configurations.\n\n```\n<?php\nclass mytidy extends tidy {\n    private\
    \ $._default = array(\n        'indent' => false,\n        'wrap' => 78\n    );\n\
    }\n```"
