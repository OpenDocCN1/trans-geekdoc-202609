    # Chapter 7


    # Zend_Http_Client


    Zend Framework (often abbreviated ZF) was conceived in early 2005. Contrary to
    PEAR1, ZF tends to remain relatively current in the version of PHP it requires
    and often takes advantage of features available in newer versions. As of ZF 1.10.1,
    PHP 5.2.4 is required.


    Designed to take full advantage of the new object system introduced in PHP 5,
    ZF has a fully object-oriented API. The project team strives to maintain an E_STRICT
    level of compliance and good code coverage via unit testing.


    Among the components included in ZF is Zend_Http_Client, an HTTP client library
    with a fairly comparable feature set to the others already covered in previous
    chapters. With that, let’s move into how it works.


    # Basic Requests


    Let’s start with a basic request.


    ```

    ```php

    <?php

    $client = new Zend_Http_Client;

    $client->setUri(''http://localhost.example'');

    $response = $client->request();


    // This does the same thing

    $client = new Zend_Http_Client(''http://localhost.example'');

    $response = $client->request(''GET'');

    ```

    ```'
  - '[PAGE 91]


    ```

    // Another way to set the request method

    $client->setMethod(Zend_Http_Client::GET);

    ?>

    ```


    +   * The URL for the request can either be passed as the first parameter to the
    Zend_Http_Client constructor or via the setUri method after the client instance
    is created. Both methods accept the URI as either a string or an instance of Zend_Uri_Http.


    +   * The request method of the client is used to dispatch the request, taking
    an optional parameter of a string containing the HTTP request method to use. GET
    is used by default. The HTTP request method can also be set via the client setMethod
    method using the client class constant named for that HTTP request method.


    # Responses


    The response returned by the client’s request method has a number of useful accessor
    methods.


    ```

    <?php

    // Returns an integer containing the status code

    var_dump($response->getStatus());


    // Returns a string containing a description for the status code

    var_dump($response->getMessage());


    // Returns a string containing the fully decoded response body

    var_dump($response->getBody());


    // Returns a string containing the unaltered response body

    var_dump($response->getRawBody());


    // Returns an associative array of headers

    var_dump($response->getHeaders());


    // Returns a string or array of values for a single header

    var_dump($response->getHeader(''Content-Type''));

    ```'
