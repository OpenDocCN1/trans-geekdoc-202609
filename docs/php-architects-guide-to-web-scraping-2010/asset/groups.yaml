    Clients are sometimes referred to as user agents. This refers to the fact that
    web browsers are agents that act on behalf of users in order to require minimal
    intervention on the user’s part. The `User-Agent` header enables the client to
    provide information about itself, such as its name and version number. Crawlers
    often use it to provide a URL for obtaining more information about the crawler
    or the e-mail address of the crawler’s operator. A simple search engine query
    should reveal a list of user agent strings for mainstream browsers. See subsection
    14.43 of RFC 2616 for more information.


    Unfortunately, some applications will engage in a practice known as **user agent
    sniffing** or **browser sniffing** in which they vary the responses they deliver
    displayed based on the user agent string provided by the client. This can include
    completely'
