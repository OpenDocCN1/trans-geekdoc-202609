  md: "\n## Chapter 4\n\n### cURL Extension\n\nThe cURL PHP extension, available since\
    \ PHP 4.0.2, wraps a library called libcurl that implements client logic for a\
    \ variety of internet protocols including HTTP and HTTPS. Its API is fairly small\
    \ and applications of it consist mostly of calls to set configuration options\
    \ and their respective values.\n\ncURL assumes fewer default configuration values\
    \ than the HTTP streams wrapper, like whether or not to process redirections and\
    \ how many of them to process. The disadvantage to this is that, combined with\
    \ the rich feature set of the extension, PHP code to use cURL is often more verbose\
    \ than equivalent code using other client libraries.\n\nLike the streams wrapper,\
    \ the cURL extension is written in C and has the same pros and cons in that respect.\
    \ cURL uses a **session handle** (of the PHP resource data type) with which configuration\
    \ settings can be associated in a similar fashion to how they are associated with\
    \ contexts for stream wrappers. Also like stream contexts, cURL session handles\
    \ can be used multiple times to repeat the same operation until passed to the\
    \ `curl_close` function.\n\nThe cURL extension is included in the PHP core, but\
    \ must either be compiled into PHP or installed as a separate extension. Depending\
    \ on the runtime environment's operating system, this may involve installing a\
    \ package in addition to the OS PHP package.\n\n### Simple Request and Response\
    \ Handling\n\n```php\n<?php\n$ch = curl_init('http://localhost.example/');\ncurl_setopt($ch,\
    \ CURLOPT_RETURNTRANSFER, true);\n$response = curl_exec($ch);\ncurl_close($ch);\n\
    ?>\n```\n\nLet's look at this line by line.\n\n- `curl_init` is called and passed\
    \ 'http://localhost.example/path/to/form' as the URL for the request. Note this\
    \ parameter is optional and can also be specified by calling `curl_setopt` with\
    \ the cURL session handle ($ch in this case), the `CURLOPT_URL` constant, and\
    \ the URL string.\n- `curl_setopt` is called to set the configuration setting\
    \ represented by the `CURLOPT_RETURNTRANSFER` parameter to have a value of true.\
    \ This setting will cause `curl_exec` to return the HTTP response body in a string\
    \ rather than outputting it directly, the latter being the default behavior.\n\
    - `curl_exec` is called to have it execute the request and return the response\
    \ body.\n- `curl_close` is called to explicitly close the cURL session handle,\
    \ which will no longer be reusable after that point.\n\nA useful setting worth\
    \ mentioning early on is `CURLOPT_VERBOSE`, which outputs debugging information\
    \ when set to true. This output is sent to either stderr (the default) or the\
    \ file referenced by the value of the `CURLOPT_STDERR`.\n\n### Contrasting GET\
    \ and POST\n\nObviously the cURL extension has other functions, but by and large\
    \ most HTTP requests made using the cURL extension will follow the sequence of\
    \ operations shown in the above example. Let's compare this with a POST request.\n\
    \n```php\n<?php\n$data = array(\n        'param1' => 'value1',\n        'param2'\
    \ => 'value2',\n        'file1' => '@/path/to/file',\n        'file2' => '@/path/to/other/file'\n\
    );\n\n$ch = curl_init();\ncurl_setopt($ch, CURLOPT_URL, 'http://localhost.example/process');\n\
    curl_setopt($ch, CURLOPT_POST, true);\ncurl_setopt($ch, CURLOPT_POSTFIELDS, $data);\n\
    curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n$response = curl_exec($ch);\n\
    curl_close($ch);\n?>\n```\n\nHere are the differences between this example and\
    \ the previous one.\n\n- The URL is passed using the curl_setopt function this\
    \ time, just to show how to do it without passing it to the curl_init function.\
    \ This is important when reusing cURL session handles with different URLs.\n-\
    \ CURLOPT_POST is set to true to change the request method to POST.\n- CURLOPT_POSTFIELDS\
    \ is an associative array or preformatted query string to be used as the data\
    \ for the request body. Files can be uploaded by specifying a value where the\
    \ first character is @ and the remainder of the value is a filesystem path to\
    \ the file intended for upload.\n\nHere are a few other cURL configuration setting\
    \ constants related to the request method.\n\n- CURLOPT_HTTPGET: Boolean that,\
    \ when set to true, explicitly resets the request method to GET if it’s been changed\
    \ from the default.\n- CURLOPT_NOBODY: Boolean that, when set to true, excludes\
    \ the body from the response by changing the request method to HEAD.\n\n### Setting\
    \ Multiple Options\n\nIf you're working with PHP 5.1.3+ you have access to the\
    \ `curl_setopt_array` function, which allows you to pass in an associative array\
    \ of setting-value pairs to set with a single function call. If you're working\
    \ with an older version of PHP, the function is relatively easy to write.\n\n\
    Using this function results in not only less and cleaner code, but in the case\
    \ of the native C function it also results in fewer function calls and by proxy\
    \ improved performance.\n\n```php\n<?php\nif (!function_exists('curl_setopt_array'))\
    \ {\n    function curl_setopt_array($ch, $options) {\n        foreach ($options\
    \ as $setting => $value) {\n            curl_setopt($ch, $setting, $value);\n\
    \        }\n    }\n}\n\n$ch = curl_init();\n$opts = array(\n    CURLOPT_URL =>\
    \ 'http://localhost.example',\n    CURLOPT_RETURNTRANSFER => true\n);\ncurl_setopt_array($ch,\
    \ $opts);\n$response = curl_exec($ch);\ncurl_close($ch);\n?>\n```\n\n### Handling\
    \ Headers\n\n`CURLOPT_HEADER` holds a boolean flag that, when set to `true`, will\
    \ cause headers to be included in the response string returned by `curl_exec`.\n\
    \nAnother option for getting at some of the data included in the response headers,\
    \ such as the HTTP response code, is to use the `curl_getinfo` function as shown\
    \ in the following example. For more on what other information this function offers,\
    \ see its entry in the PHP manual.\n\n```php\n<?php\n$ch = curl_init();\n// ...\
    \ \n$response = curl_exec($ch);\n$info = curl_getinfo($ch);\n$responsecode = curl_getinfo($ch,\
    \ CURLINFO_HTTP_CODE);\n?>\n```\n\nCURLOPT_HTTPHEADER holds an enumerated array\
    \ of custom request header name-value pairs formatted like so.\n\n```php\n<?php\n\
    $ch = curl_init();\ncurl_setopt($ch, CURLOPT_HTTPHEADER, array(\n    'Accept-Language:\
    \ en-us,en;q=0.5',\n    'Accept-Charset: ISO-8859-1,utf-8;q=0.7,*;q=0.7',\n  \
    \  'Keep-Alive: 300',\n    'Connection: keep-alive'\n));\n?>\n```\n\n### Debugging\n\
    \nPreviously mentioned in the last section on handling headers, the curl_getinfo\
    \ function also enables you to view requests being sent by cURL. This can be quite\
    \ useful when debugging. Below is an example of this feature in action.\n\n```php\n\
    <?php\n$ch = curl_init();\ncurl_setopt_array(array(\n    CURLINFO_RETURNTTRANSFER\
    \ => true,\n    CURLINFO_HEADER_OUT => true\n));\ncurl_exec($ch);\n$request =\
    \ curl_getinfo($ch, CURLINFO_HEADER_OUT);\n?>\n```\n\n- CURLOPT_RETURNTRANSFER\
    \ is set to `true` in the `curl_setopt_array` call even though the return value\
    \ of `curl_exec` isn't captured. This is simply to prevent unwanted output.\n\
    - CURLINFO_HEADER_OUT is set to `true` in the `curl_setopt_array` call to indicate\
    \ that the request should be retained because it will be extracted after the request\
    \ is made.\n- CURLINFO_HEADER_OUT is specified in the `curl_getinfo` call to limit\
    \ its return value to a string containing the request that was made.\n\n### Cookies\n\
    \n```php\n<?php\n$cookiejar = '/path/to/file';\n\n$ch = curl_init();\n\n$url =\
    \ 'http://localhost.example';\ncurl_setopt($ch, CURLOPT_URL, $url);\ncurl_setopt($ch,\
    \ CURLOPT_COOKIEJAR, $cookiejar);\ncurl_exec($ch);\n\n$url = 'http://localhost.example/path/to/form';\n\
    curl_setopt($ch, CURLOPT_URL, $url);\ncurl_setopt($ch, CURLOPT_COOKIEFILE, $cookiejar);\n\
    curl_exec($ch);\n\ncurl_close($ch);\n?>\n```\n\nHere is a quick list of pertinent\
    \ points.\n\n- After the first `curl_exec` call, cURL will have stored the value\
    \ of the the Set-Cookie response header returned by the server in the file referenced\
    \ by '/path/to/file' on the local filesystem as per the CURLOPT_COOKIEJAR setting.\
    \ This setting value will persist through the second `curl_exec` call.\n- When\
    \ the second `curl_exec` call takes place, the CURLOPT_COOKIEFILE setting will\
    \ also point to '/path/to/file'. This will cause cURL to read the contents of\n"
  mdcn: "\n## 第 4 章\n\n### cURL 扩展\n\n自 PHP 4.0.2 起可用的 cURL PHP 扩展封装了名为 libcurl 的库，该库实现了各种互联网协议的客户端逻辑，包括\
    \ HTTP 和 HTTPS。其 API 相当小巧，应用程序的使用主要由设置配置选项及其相应值的调用组成。\n\n与 HTTP 流包装器相比，cURL 假设的默认配置值更少，例如是否处理重定向以及处理多少重定向。这带来的缺点在于，结合该扩展丰富的功能集，使用\
    \ cURL 的 PHP 代码通常比使用其他客户端库的等效代码更冗长。\n\n与流包装器类似，cURL 扩展是用 C 编写的，在这方面具有相同优缺点。cURL\
    \ 使用 **会话句柄**（一种 PHP 资源数据类型），可以以此将配置设置以类似于流包装器上下文关联方式联系起来。同样，像流上下文一样，cURL 会话句柄可以多次使用以重复相同的操作，直到将其传递给\
    \ `curl_close` 函数。\n\ncURL 扩展包含在 PHP 核心中，但必须将其编译到 PHP 中或作为单独的扩展安装。根据运行环境的操作系统，这可能涉及安装除\
    \ OS PHP 软件包之外的其他软件包。\n\n### 简单的请求和响应处理\n\n```php\n<?php\n$ch = curl_init('http://localhost.example/');\n\
    curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n$response = curl_exec($ch);\n\
    curl_close($ch);\n?>\n```\n\n让我们逐行查看这段代码。\n\n- 调用 `curl_init` 并传入 'http://localhost.example/path/to/form'\
    \ 作为请求的 URL。请注意，此参数是可选的，也可以通过调用 `curl_setopt` 来指定，参数为 cURL 会话句柄（在此为 $ch）、`CURLOPT_URL`\
    \ 常量和 URL 字符串。\n- 调用 `curl_setopt` 将 `CURLOPT_RETURNTRANSFER` 参数所表示的配置设置值设为 true。此设置将导致\
    \ `curl_exec` 以字符串形式返回 HTTP 响应体，而不是直接输出它，后者是默认行为。\n- 调用 `curl_exec` 以执行请求并返回响应体。\n\
    - 调用 `curl_close` 以显式关闭 cURL 会话句柄，之后该句柄将不再可重用。\n\n值得及早提到的一个有用设置是 `CURLOPT_VERBOSE`，当设置为\
    \ true 时会输出调试信息。该输出被发送到 stderr（默认值）或 `CURLOPT_STDERR` 值所引用的文件。\n\n### 对比 GET 和\
    \ POST\n\n显然，cURL 扩展还有其他函数，但总体而言，使用 cURL 扩展发出的大多数 HTTP 请求都将遵循上述示例所示的操作序列。让我们将其与\
    \ POST 请求进行比较。\n\n```php\n<?php\n$data = array(\n        'param1' => 'value1',\n\
    \        'param2' => 'value2',\n        'file1' => '@/path/to/file',\n       \
    \ 'file2' => '@/path/to/other/file'\n);\n\n$ch = curl_init();\ncurl_setopt($ch,\
    \ CURLOPT_URL, 'http://localhost.example/process');\ncurl_setopt($ch, CURLOPT_POST,\
    \ true);\ncurl_setopt($ch, CURLOPT_POSTFIELDS, $data);\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER,\
    \ true);\n$response = curl_exec($ch);\ncurl_close($ch);\n?>\n```\n\n以下是此示例与前一个示例之间的差异。\n\
    \n- 这次 URL 是使用 curl_setopt 函数传入的，只是为了展示如何在不将其传递给 curl_init 函数的情况下完成操作。这在以不同 URL\
    \ 重用 cURL 会话句柄时非常重要。\n- 将 CURLOPT_POST 设置为 true 以将请求方法更改为 POST。\n- CURLOPT_POSTFIELDS\
    \ 是用作请求体数据的关联数组或预格式化的查询字符串。可以通过指定第一个字符为 @ 且其余部分为文件系统路径的值来上传文件，该路径指向要上传的文件。\n\n\
    以下是其他一些与请求方法相关的 cURL 配置设置常量。\n\n- CURLOPT_HTTPGET：布尔值，当设置为 true 时，如果请求方法已从默认值更改，则明确将其重置为\
    \ GET。\n- CURLOPT_NOBODY：布尔值，当设置为 true 时，通过将请求方法更改为 HEAD 来从响应中排除请求体。\n\n### 设置多个选项\n\
    \n如果你使用的是 PHP 5.1.3 或更高版本，你可以访问 `curl_setopt_array` 函数，该函数允许你传入由设置-值对组成的关联数组，通过单次函数调用进行设置。如果你使用的是旧版本的\
    \ PHP，编写该函数相对容易。\n\n使用此函数不仅使代码更少且更整洁，而且对于原生 C 函数而言，还减少了函数调用次数，从而间接提高了性能。\n\n```php\n\
    <?php\nif (!function_exists('curl_setopt_array')) {\n    function curl_setopt_array($ch,\
    \ $options) {\n        foreach ($options as $setting => $value) {\n          \
    \  curl_setopt($ch, $setting, $value);\n        }\n    }\n}\n\n$ch = curl_init();\n\
    $opts = array(\n    CURLOPT_URL => 'http://localhost.example',\n    CURLOPT_RETURNTRANSFER\
    \ => true\n);\ncurl_setopt_array($ch, $opts);\n$response = curl_exec($ch);\ncurl_close($ch);\n\
    ?>\n```\n\n### 处理请求头\n\n`CURLOPT_HEADER` 持有一个布尔标志，当设置为 `true` 时，将使请求头包含在 `curl_exec`\
    \ 返回的响应字符串中。\n\n获取包含在响应头中的某些数据（例如 HTTP 响应码）的另一种方法是使用 `curl_getinfo` 函数，如下例所示。有关此函数提供的其他信息，请参阅\
    \ PHP 手册中的条目。\n\n```php\n<?php\n$ch = curl_init();\n// ... \n$response = curl_exec($ch);\n\
    $info = curl_getinfo($ch);\n$responsecode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n\
    ?>\n```\n\nCURLOPT_HTTPHEADER 持有一个枚举数组，包含自定义请求头名称-值对，格式如下。\n\n```php\n<?php\n\
    $ch = curl_init();\ncurl_setopt($ch, CURLOPT_HTTPHEADER, array(\n    'Accept-Language:\
    \ en-us,en;q=0.5',\n    'Accept-Charset: ISO-8859-1,utf-8;q=0.7,*;q=0.7',\n  \
    \  'Keep-Alive: 300',\n    'Connection: keep-alive'\n));\n?>\n```\n\n### 调试\n\n\
    在前一节关于处理请求头的讨论中已经提到，curl_getinfo 函数还允许你查看由 cURL 发送的请求。这在调试时非常有用。下面是此功能的一个示例。\n\
    \n```php\n<?php\n$ch = curl_init();\ncurl_setopt_array(array(\n    CURLINFO_RETURNTTRANSFER\
    \ => true,\n    CURLINFO_HEADER_OUT => true\n));\ncurl_exec($ch);\n$request =\
    \ curl_getinfo($ch, CURLINFO_HEADER_OUT);\n?>\n```\n\n- 在 `curl_setopt_array`\
    \ 调用中，即使没有捕获 `curl_exec` 的返回值，CURLOPT_RETURNTRANSFER 也被设置为 `true`。这只是为了防止不需要的输出。\n\
    - 在 `curl_setopt_array` 调用中，CURLINFO_HEADER_OUT 被设置为 `true`，以指示应保留请求，因为它将在发出请求后被提取。\n\
    - 在 `curl_getinfo` 调用中指定 CURLINFO_HEADER_OUT，以将其返回值限制为包含所发出请求的字符串。\n\n### Cookie\n\
    \n```php\n<?php\n$cookiejar = '/path/to/file';\n\n$ch = curl_init();\n\n$url =\
    \ 'http://localhost.example';\ncurl_setopt($ch, CURLOPT_URL, $url);\ncurl_setopt($ch,\
    \ CURLOPT_COOKIEJAR, $cookiejar);\ncurl_exec($ch);\n\n$url = 'http://localhost.example/path/to/form';\n\
    curl_setopt($ch, CURLOPT_URL, $url);\ncurl_setopt($ch, CURLOPT_COOKIEFILE, $cookiejar);\n\
    curl_exec($ch);\n\ncurl_close($ch);\n?>\n```\n\n以下是相关要点列表。\n\n- 在第一次 `curl_exec`\
    \ 调用之后，cURL 会将服务器返回的 Set-Cookie 响应头的值存储在与本地文件系统中 '/path/to/file' 路径引用的文件中，依据 CURLOPT_COOKIEJAR\
    \ 设置。此设置值将持续存在，直至第二次 `curl_exec` 调用。\n- 当第二次 `curl_exec` 调用发生时，CURLOPT_COOKIEFILE\
    \ 设置也将指向 '/path/to/file'。这将导致 cURL 读取文件内容\n\n"
