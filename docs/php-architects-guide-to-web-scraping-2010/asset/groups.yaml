    # 第 14 章


    # PCRE 扩展


    有些情况下，标记文档可能格式错误得如此严重，以至于无法被 XML 扩展使用。在其他时候，你可能希望有一种方法来检查已提取的数据，以确保其符合预期。标记文档结构的重大变更可能导致你的
    CSS 或 XPath 查询返回没有结果。变更也可能微小而微妙，导致虽然你能获得查询结果，但它们包含比预期更少或不同的数据。


    虽然这两项任务都可以使用基本的字符串处理函数和比较运算符完成，但在大多数情况下，其实现会显得杂乱且不可靠。**正则表达式**提供了一套由**元字符**组成的语法，从而能够灵活且简洁地表达字符串内的模式。本章将专门讨论与
    Perl 兼容正则表达式 (PCRE) PHP 扩展相关的正则表达式。


    一种常见的错误做法是仅使用正则表达式从标记文档中提取数据。虽然这对于旨在短时间内容仅使用一次或很少几次的简单脚本可能有效，但长期来看更难维护且可靠性较低。正则表达式并非为此目的设计，而前面章节讨论的其他标记专用扩展更适合这项任务。这是关于为工作选择最佳工具的问题，因此应避免这种做法。


    ## POSIX 扩展正则表达式


    许多 PHP 开发者是从使用 POSIX 正则表达式扩展（也称为 ereg 扩展）开始学习正则表达式的。在 PHP 5.3 中，该扩展的函数正被弃用，转而采用
    PCRE 扩展中的函数，后者速度更快且提供更强大的功能集。除了某些特殊字符范围在语法上的差异外，大多数 ereg 表达式只需添加表达式定界符即可配合 preg
    函数使用。


    ## 模式基础


    让我们从简单的开始：检测字符串中任意位置子串的存在。


    ```php

    <?php

    // 使用基本字符串函数检测子串

    $present = (strpos($string, ''foo'') !== false);


    // 使用 PCRE 函数实现相同功能

    $present = (preg_match(''/foo/'', $string) === 1);

    ?>

    ```


    注意，在 `preg_match()` 调用中的模式与 `strpos()` 调用中使用的字符串非常相似。在前者中，模式两侧使用 `/` 来表示其开始和结束。模式字符串中的第一个字符被视为模式定界符，可以是您指定的任意字符。在选择用于此字符时（`/`
    是最常见的选择），请记住，如果在模式内部使用它，你将不得不对其进行转义（后面转义章节会有介绍）。这在本章稍后会更清晰。


    这个例子中使用的两个函数之间的区别在于，`strpos()` 返回子串在字符串中的位置（从 `0` 开始），如果字符串中不包含该子串则返回 `false`。这需要使用
    `!==` 运算符来区分子串是在字符串开头匹配还是根本没有匹配。相比之下，`preg_match()` 返回它找到的匹配次数。由于 `preg_match()`
    在找到匹配后立即停止搜索，所以结果将是 `0` 或 `1`。


    ## 锚点


    你可能希望检查模式是否存在于字符串的开头或结尾，而不仅仅是检查模式是否包含在字符串的任意位置。这些功能的元字符统称为**锚点**。


    ```php

    <?php

    // 使用基本字符串函数检查字符串开头

    $start = (strpos($string, ''foo'') === 0);


    // 使用 PCRE 函数实现相同功能

    $start = (preg_match(''/^foo/'', $string) == 1);


    // 使用基本字符串函数检查字符串结尾

    $end = (substr($string, - strlen(''foo'')) == ''foo'');


    // 使用 PCRE 函数实现相同功能

    $end = (preg_match(''/foo$/'', $string) == 1);


    // 相当于字符串的精确匹配

    $equal = (preg_match(''/^foo$/'', $string) == 1);

    ?>

    ```


    - `^`（也称为尖音符字符）用于模式内表达式的开头，表示匹配应从字符串的开头开始。

    - 类似地，`$` 用于指示模式内表达式的匹配应在字符串的结尾停止。

    - 当 `^` 和 `$` 一起使用时，它们可以指示 `$string` 的全部内容精确匹配该模式。


    > **字符串或行的开头**

    > 重要的是要注意，这两个运算符的行为可能会有所不同。默认情况下，它们匹配 `$string` 的开头和结尾。如果使用多行修饰符，它们匹配的是 `$string`
    中每一行的开头和结尾。本章后面的修饰符部分将更详细地介绍这一点。


