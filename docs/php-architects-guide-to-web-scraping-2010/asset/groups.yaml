    \    $xmlString,\n    null,\n    LIBXML_NOERROR | LIBXML_NOWARNING\n);\n?>\n```\n\
    \n# ## Iteration\n\nThe XMLReader instance acts as both an iterator over the entire\
    \ document as well as a data object for the current node pointed to by that iterator.\
    \ It contains a set of read-only properties (described at http://php.net/manual/en/class.xmlreader.php#xmlreader.props)\
    \ that represent those of the current node and are updated as the iterator position\
    \ changes.\n\n```\n<?php\nwhile ($doc->read()) {\n    // ...\n}\n?>\n```\n\nThe\
    \ read() method attempts to move the iterator position to the next node and returns\
    \ a boolean value indicating whether or not it was successful. That is, it returns"
  - "[PAGE 143]\n\nfalse once it reaches the end of the document. As such, it’s perfect\
    \ for use in a while loop as shown above.\n\n# Nodes\n\nAs in other extensions,\
    \ each node has a type that is stored in the reader’s nodeType property. The types\
    \ in which you are generally interested are still elements (XMLReader::ELEMENT)\
    \ and attributes (XMLReader::ATTRIBUTE), possibly also text (XMLReader::TEXT)\
    \ and CDATA (XMLReader::CDATA) elements as well. Additionally, the XMLReader extension\
    \ has a node type for ending elements (i.e. closing tags), XMLReader::END_ELEMENT.\
    \ Its importance will become more obvious in the next section.\n\nThe example\
