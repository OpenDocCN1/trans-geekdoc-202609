    通常需要在这些情况下发生。首先，如果网络抓取应用程序旨在向用户展示，则必须向该用户呈现一个至少在一定程度上相似的表单。其次，应验证用户通过该表单提交的数据，以确保其很可能被目标应用程序接受。


    根据项目的需求和表单结构的不同，此技术的适用性会有所不同。它涉及抓取目标应用程序中表单的标记，并使用抓取的数据生成类似元数据文件或 PHP 源代码文件，可直接放入网络抓取应用程序项目中。这对于加速具有多个表单或复杂表单且必须模拟
    POST 请求的目标应用程序的开发工作非常有用。


    为了构建 POST 请求，你需要查询具有 name 属性的 input、select、textarea 或可能是 button 元素。除此之外，还需考虑以下几个与特定元素相关的注意事项。


    - 当网络抓取应用程序侧的表单提交时，那些 type 属性值为 checkbox 或 radio 且未被选中的 input 元素，其在最终向目标应用程序发起
    POST 请求时，不应包含其 value 属性值。一种常见的做法是，在文档中将该 checkbox 元素之前放置另一个 type 属性值为 hidden 且具有相同
    name 的元素，以便在 checkbox 未被选中时假定使用 hidden 元素的值。


    - select 元素是否支持多个值取决于是否设置了 multiple 属性。这在 POST 请求中的表达方式可能取决于目标应用程序运行的平台。确定此点的最佳方法是使用能够显示底层
    POST 请求的客户端在目标应用程序上提交表单。


    - 具有 maxLength 属性的 input 元素被限制为长度小于或等于该值。同样，select 元素也被限制为其包含的 option 子元素的 value
    属性值。在验证用户提交的数据时，这两者都应予以考虑。


    ## Web 服务


    构建网络抓取应用程序的原因通常是目标应用程序没有提供 Web 服务或格式化为可自动消费的数据。然而，有些网站在已经构建好网络抓取应用程序之后，最终会提供 Web
    服务。因此，在设计阶段保持对这种潜在可能性的警惕非常重要。


    Web 服务的引入并不会消除之前提到的关于检索的问题。对于试图实时访问目标应用程序或相应 Web 服务的应用程序来说，延迟仍然可能成为一个问题。理想情况下，从网络抓取应用程序切换到
    API 时，分析过程中的复杂性将降低，性能将提高。


    然而，如果 API 服务确实推出，这两个区域的代码可能都需要被替换。因此，重要的是设计一个尽可能接近假想 Web 服务提供的 API，并集中那些在该情况下需要替换的逻辑。通过这样做，使用现有
    API 的现有本地应用程序逻辑将只需要很少或无需更改。


    撇开法律问题不谈（关于法律问题的更多信息见附录 A），与新的 Web 服务提供相比，考虑维护现有的网络抓取应用程序有其原因。这些原因可能包括与 Web 服务提供的数据相比，前者受到限制或不完整，或者
    Web 服务的正常运行时间低于可接受的容差。在前一种情况下，网络抓取逻辑可以替换为 Web 服务调用，以在两种数据提供重叠的地方提高数据可靠性。在后一种情况下，当服务可用时，网络抓取逻辑可以执行
    Web 服务调用，并在服务再次可用之前使用缓存数据或在本地存储数据更新。


    ## 测试


    单元测试对于应用程序的质量保证有多么重要，它对网络抓取应用程序就更重要，因为它依赖于其目标保持不变。必须检查标记文档的查询，以断言它们产生可预测的结果，并且必须验证从这些标记文档中提取的数据，以确保其符合预期。对于实时应用程序，还必须检查
    HTTP 响应，以确保目标应用程序可访问，并且没有发生巨大变化导致资源不再位于其原始位置。


    在开发过程中，建议下载要抓取的文档的本地副本，并将其作为单元测试套件的一部分包含在内，随着套件的开发而不断完善。此外，测试套件应包括两种工作模式：本地和远程。前一种情况会对上述本地文档副本执行测试，而后者则会实时从目标站点下载文档。如果网络抓取应用程序的任何部分停止按预期工作，对比这两种工作模式的结果对于确定问题的原因非常有帮助。


    PHPUnit 是现有的 PHP 单元测试框架中最受欢迎的之一。更多信息请访问 http://phpunit.de。其众多功能之一是将测试结果以 XML 格式输出到文件的选项。此功能以及
    PHPUnit 和其他单元测试框架中类似的其它功能，对于生成可移植到另一数据介质并对网络抓取应用程序本身可访问的结果非常有用。这促进了在相关功能测试失败时，暂时限制或禁用该应用程序中功能的能力。


    归根结底是这样的：调试 Web 应用程序就像试图用豌豆射手去杀一只飞行的苍蝇。重要的是让定位问题原因尽可能容易，以最小化更新网络抓取应用程序以适应变化所需的周转时间。测试失败应警告开发人员并锁定任何敏感的应用程序区域，以防止数据的错误传输、损坏或删除。


    ### 结束了，大家


    感谢阅读本书。希望你喜欢并在此过程中学到了新东西，或者至少获得了一些思考的素材。理想情况下，阅读本书将对你未来如何构建网络抓取应用程序产生深远影响，并且它将成为你不断参考的书之一。除了这本书之外，剩下的学习要靠实践。所以，出发去抓取吧！


    ## 附录 A


    ## 网络抓取的法律性


    网络抓取的法律性是一个相当复杂的问题，主要由于版权法和知识产权法。不幸的是，没有一个简单且完全明确的回答，特别是因为这些法律在不同国家之间可能存在差异。然而，在审查潜在的网络抓取目标时，有少数几个常见的考察点。


    首先，网站通常有一些被称为服务条款（TOS）、使用条款或用户协议的文件（为了引用方便，以下简称为 TOS 文档）。这些文件通常位于一个不起眼的地方，如网站页脚中的链接或在法律文档或帮助部分。这些类型的文档在较大且较知名的网站上更为常见。以下是几个明确禁止抓取其内容的网站中的此类文档片段。


    - “您特别同意不通过任何自动化手段（包括使用脚本或网络爬虫）访问（或试图访问）任何服务……” – Google 服务条款，截至 2010 年 2 月 14
    日的第 5.3 节


    - “未经许可，您不得以自动化方式（如收割机器人、机器人、蜘蛛或爬虫）收集用户的内容或信息，或以其他方式访问 Facebook。” – Facebook 权利与责任声明，安全部分，截至
    2010 年 2 月 14 日


