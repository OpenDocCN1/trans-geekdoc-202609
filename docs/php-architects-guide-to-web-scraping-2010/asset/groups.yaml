    \ `stream_get_meta_data()`。这使其比 `$http_response_header` 更灵活。\n\n### 流上下文和 POST\
    \ 请求\n\n流引入的另一个概念是上下文（context），基本上它是一组用于流操作的配置选项。上下文是通过将上下文选项及其对应值的关联数组传递给 `stream_context_create`\
    \ 函数来创建的。关于 HTTP 流包装器，上下文的一个用途是发起 POST 请求，因为包装器默认使用 GET 方法。\n\n```php\n<?php\n\
    $context = stream_context_create(array(\n  'http' => array(\n    'method' => 'POST',\n\
    \    'header' => implode(\"\\r\\n\", array(\n      'Content-Type: application/x-www-form-urlencoded',\n\
    \      'Referer: http://localhost.example'\n    )),\n    'content' => http_build_query(array(\n\
    \       'param1' => 'value1',\n       'param2' => 'value2'\n     ))\n  )\n));\n\
    \n$response = file_get_contents(\n   'http://localhost.example/process',\n   false,\n\
    \   $context\n);\n?>\n```\n\n以下是此示例的详细解析。\n\n- `'http'` 是正在使用的流包装器。\n- `'POST'`\
    \ 是请求的 HTTP 方法。\n- `'header'` 流上下文配置项被填充为一个包含 HTTP 头部键值对的字符串，在本例中用于 Content-Type\
    \ 和 Referer HTTP 头部。Content-Type 头部用于指示请求体数据是 URL 编码的。当需要多个自定义头部时，它们必须用回车换行符分隔（`\"\
