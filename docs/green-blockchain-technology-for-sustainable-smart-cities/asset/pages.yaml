  md: 'highlights the added value role of the United Nations (According to the Secretary-General,
    2019).


    The World Bank launched a blockchain lab in 2017 to serve as a forum for learning,
    experimentation, and collaboration on distributed ledger technology (DLT). This
    blockchain lab brings together internal and external participants to work on blockchain
    use cases, and its core focus areas include land registry, digital identity, aid
