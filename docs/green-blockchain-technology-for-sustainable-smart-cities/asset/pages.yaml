  md: 'facilitating the trade of renewable energies, and enhancing financial flows.
    Applying blockchain technology in green finance, such as tokenizing green assets
    and issuing green bonds, helps to decentralizing crowd funding for green projects.
    Blockchain can pave the way for initiatives in this field and bring about greater
    certainty and acceptability for investors.


