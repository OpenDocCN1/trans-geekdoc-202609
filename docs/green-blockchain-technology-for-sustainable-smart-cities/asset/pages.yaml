  md: 'Clean energy investment grew by only 2% a year in the five years after the
    Paris Agreement was signed in 2015. But since 2020, the pace of growth has accelerated
    significantly to 12%. Spending has been underpinned by fiscal support from governments
    and aided by the rise of sustainable finance, especially in advanced economies.
    Renewable grids and storage now account for more than 80% of total power sector
    investment. Spending on solar photovoltaics, batteries, and electric vehicles
    is now growing at rates consistent with reaching global net zero emissions by
    2050. Investment in battery energy storage is expected to more than double to
    reach almost $20 billion in 2022 (Report of World Energy investment, 2022).


    The growth of green finance seems conclusive to continue as most of the governments
    in worldwide focus on how to cut pollution and greenhouse gases. The value of
    sustainability-themed funds traded on exchanges hit a record $41.6 billion last
    year (Report of Bloomberg Intelligence, 2022).


    The current investments in sustainable management amount to $133 billion, most
    of which comes from public sources and calls for investments to triple by 2030
    and to increase fourfold by 2050 from the current level. If the world is to meet
    targets for climate change, biodiversity, and land degradation, it needs to close
    a $4.1 trillion financing gap by 2050 (Report of United Nations Environment Program,
    2021).


    Tapping green finance credibly signals commitment to environmental impact that
    has turned its attention in recent years to more sustainable and inclusive growth.
    Asian firms that issue green bonds typically improve their environmental performance
    by 17% within a year after issuance and by 30% within two years. Evidence further
    suggests that green finance signals increased awareness of and commitment to the
    SDGs (Report of Asian Development Outlook, 2021).


    Cash inflow into any kind of asset is labeled green or sustainable. At least $30.7
    trillion of funds is held in sustainable or green investments, up 34% from 2016.
    Overall, these money flows account for one-third of the tracked assets under management
    and seek to financing environmentally sound and sustainable projects that foster
    a net-zero emissions economy and protect the environment (Report of Global Sustainable
    Investment Alliance, 2019).


    An investment opportunity on the use of Green Bond promotes a change in transparency
    that facilitates the tracking of funds to environmental projects, while simultaneously
    aiming to improve insight into their estimated impact. Green credentials alongside
    provide transparency and disclosure and promote integrity in the development of
    the Green Bond market by clarifying the approach for issuance of a Green Bond
