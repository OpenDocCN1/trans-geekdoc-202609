    # 1. Introduction


    The innovation-driven economy and embanking on the path of green development has
    become a widely recognized goal of people around the world. Green technology innovation
    is playing a vital importance for organizations and communities all around the
    world. Investigations in these innovative green technologies have mainly witnessed
    an increasing trend over recent years. Moreover, environmental degradation has
    turned into a major threat to human well-being. A large number of organizations
    and communities have been targeted for green tech innovation, as it’s a strategy
    to achieve environmental protection and economic boom (Cao et al., 2021). To attain
    the sustainability, the people should not harm and overuse natural resources in
    extraordinary manner. Furthermore, environmental sustainability and economic profitability
    are great significance for future technological innovation, without green technology
    innovation; there can be no sustainable development in a real sense (Laut & Fliaster,
    2020). As a global financial center with a growing strategic interest in green
    finance, this integrates environmental risks and opportunities into day-to-day
    financing and investment decisions for the development of financial services and
    products that make a substantial contribution to environmental sustainability.


    The blockchain as an emerging technology can perfectly adapt to the information
    needs of sustainable management, given its significant potential for addressing
    environmental and economic sustainability taking place all around the world. Blockchain
    technology promotes effective monitoring, reporting, and verification and increases
    transparency and accountability in green finance (Tian et al., 2020). Green financing
    could be promoted through changes in'
