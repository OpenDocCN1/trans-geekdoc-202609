    and build with its nonprofit and technology partners and to produce proofs of
    concept that can then be rolled out in the field. It also enables greater understanding
    of the technology itself, as well as its accompanying security, legal, and policy
    implications.


    The initiative of the Programme is to increase the access of banking services
    through developing innovative and sustainable retail payments services as a point
    of entry for low-income populations. The Programme supports the development of
    innovative and sustainable retail payment solutions using technologies such as
    mobile phones, electronic funds transfer at point of sale, and payment card infrastructure
    to deliver payment services at low cost to the base of the pyramid as well as
    other users. Implementation is in close cooperation with the World Bank Payment
    Systems (Global Innovative Retail Payments Program).


    # 3.2 Innovative green technology for a greener economy and restoration


    Global energy investment is set to increase by 8% in 2022 to reach USD 2.4 trillion,
    with the anticipated rise coming mainly in clean energy. Although encouraging,
    the growth investment is still far from enough to tackle the multiple dimensions
    of today''s energy crisis and pave the way toward a cleaner and more secure energy
    future (Report of International Energy Agency 2022).


    The global green tech and sustainability market through across the globe investments
    in green technologies hit a whopping $755 billion in a year, a significant increase
    from the previous year. Governments and private organizations are investing more
    heavily in green tech, leading to more advancement, innovation, and overall market
    growth (Report of Allied Market Research, 2021).


    The G20 countries are expected to provide $97 trillion by 2040 for green infrastructure
    improvements and sustainable developments (United Nations Office for Project Services,
    2019). Even before the COVID-19 pandemic, sustainable investments were insufficient
    and much lower than the required amount. Since the pandemic, in the case of developing
    countries, the $2.5 trillion annual SDG financing gap is predicted to increase
    due to global economic uncertainty (Organization for Economic Co-operation and
    Development, 2020).'
