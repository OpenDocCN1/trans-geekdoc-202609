    index, and development of financial derivative that can hedge risk. Moreover,
    blockchain could promote the formation and liquidity of carbon emission reduction
    trading market.


    # ## 6.2 Nurturing green finance through tokenized securities


    Utilizing green blockchain technology as a financial instrument will streamline
    the process of green finance with the utmost trust, transparency, cost reduction,
    mobilization, and immutable traits (Volz, 2018). Banks can list tokenized green
    assets in the primary or secondary market and make them accessible to small/retail
    investors through a public blockchain exchange or a stock exchange that supports
    security token trading (Kowalski et al., 2021). With the emergence of innovative
    technology, blockchain-enabled asset tokenization shows the potential to create
    green assets and bonds, which will engage more individuals to contribute in sustainable
    investment.


    However, further accelerating green finance is necessary to meet the SDGs and
    blockchain can help across the entire lifecycle of green assets, from tracking
    and origination to trading, settlement, and reporting.


    # ## 6.3 Blockchain-based firms nurturing green finance


    The financial sector is quickly evolving. Many firms and initiatives are emerging
    and influencing green finance and sustainable growth, mainly providing innovative
    Fintech solutions, tokenized green bond issuance, peer-to-peer renewable energy
    trading, carbon credit trading, and climate finance through crowd funding (Cao
    et al., 2021).


    **Stockholm Green Fintech:** The nonprofit organization conceived to strengthen
    green finance and investments through groundbreaking digital technology solutions.
    High intention to emphasize the solutions within the community of green finance
    and sustainable investments, which support financial innovations technology. This
    independent platform stimulates, conceives, and promotes solutions for the green
