    countries’ regulatory frameworks, harmonizing public financial incentives, increases
    in green financing from different sectors, alignment of public sector financing
    decision-making with the environmental dimension of the Sustainable Development
    Goals (SDGs), increases in investment in clean and green technologies, financing
    for sustainable natural resource–based green economies and climate smart blue
    economy, and increased use of green bonds. Developing a greener economy has become
    a global consensus which needs the support of green technology to guarantee the
    coordinated development of environment and economy (Tan et al., 2021).


    The other way blockchain technology can facilitate the advent of new green financial
    products is to package the returns of environmental financial products with those
    of other instruments and debt applied to financing environmentally friendly assets,
    and to do so entirely digitally. Financial exclusion is estimated to affect around
    1.7 billion people worldwide who lack access to even the most basic of financial
    services. There are many reasons for financial exclusion including geographic
    barriers, lack of identity documents, and lack of trust in local financial institutions.
    Blockchain can help to achieve the solutions by supporting the creation of a trusted
    framework for transactions between parties who do not know each other and the
    use of smart contracts and to make the relation between fundamental design and
    blockchain applications robust (Krishnan et al., 2020).


    In addition, blockchain technology can improve the carbon asset transaction system
    and provide global investors with a seamless and frictionless transaction solution.
    It can also make trading schemes more efficient through new approaches to price
    carbon credits and connect distributed carbon markets, besides decentralizing
    the trade of renewable energies and carbon credits (Thaker et al., 2022). The
    efficient use of smart contracts in the process will also facilitate automation,
    high-speed execution, traceability, and transparency in transactions.


    # 2. Green finance


    Sustainable finance or environmental finance is a financial innovation aiming
    to connect financial industry to meet the needs of environmental protection and
    imply financial tools designed for developing, promoting, and supporting positive
    and durable production activity, which has committed to solve problems like environmental
    pollution and the greenhouse effect and promote coordinated economic society.
    Green finance is becoming increasingly sophisticated. As it becomes more complex,
    it becomes harder to trace the financial flows and ensure investment is reaching
    its desired destiny. It includes many financial products and services, such as
    green bonds, green investment funds, carbon market, and energy trading, alongside
    initiative financial institutions, including green banks and green funds (Taghizadeh-Hesary
    and Yoshino, 2019). Green finance is a financial tool that improves'
  - '[PAGE 2]


    environmental quality to support sustainable development. Green financial services
    have become the mainstream trend of financial development, and it paves the way
    of financial innovation in environmental protection, which acts as a link between
    the financial industry and the environmental industry.


    # ## 2.1 Green financial development


    Green finance is introduced to make this world a better place for corporate and
    individuals. Currently, the top-most organizations throughout the world are introducing
    and implementing green finance in their countries to create a sustainable and
    eco-friendly environment. Green finance mainly promotes the flow of financial
    instruments toward the development of sustainable business projects, social investment,
    social trade, and environmental policies. Green financing could be promoted through
    changes in countries’ regulatory frameworks, harmonizing public financial incentives,
    increases in green financing from different sectors, alignment of public sector
    financing decision-making with the environmental dimension of the SDGs, increases
    in investment in clean and green technologies, financing for sustainable natural
    resource–based green economies, and increased use of green bonds (Zhang and Wei,
    2020). Since public budgets in green finance are insufficient, the market must
    change its approach to accelerate the flow of capital and investments to green
    projects for sustainable development.


    It is important to recognize that the ideals on which green finance operates are
    not anything new. There have always been people who believed in investment that
    focused on more than simply returns. Credit unions, rural co-operatives, and many
    philanthropic groups were using sustainable investment principles (Wang et al.,
    2021). Nevertheless, the world of green finance today is far larger and more diverse
    than anything seen in history. The industry is made up of many stakeholders all
    of which play a critical role in raising and using capital in sustainable projects.


    # ## 2.2 The revolution of green finance by adopting financial innovative technology


    The green finance revolution is underway with a powerful beginning to a pivotal
    decade for climate action. The financial innovation shows the tremendous potential
    for acceleration in the green bond market. Reaching the vital milestone of the
    first $1trillion in annual green investment toward clean technologies, transition
    and building climate resilience can become a reality by 2030 ESG goals. While
    green bonds have the potential to become powerful financial tools in creating
    positive climate action, there are areas for optimization and improvement in the
    traditional green bond model.


    According to the report of the United Nations Environment Programme (UNEP), green
    financing is to increase the level of financial flows (from'
  - '[PAGE 3]


    banking, microcredit, insurance, and investment) from the public, private, and
    not-for-profit sectors to sustainable development priorities. Green finance for
    many years was only a small niche of the investment world; however, now it is
    taking both the public and private sectors by storm. Green financial development
    may provide sufficient funds for activities of green technology innovation, which
    leads to improve energy efficiency, decrease carbon emission, and reduce extreme
    weather risks. Technological innovation with rational financial support can stimulate
    the environmentally friendly industrial scale, which result in attaining global
    goals. The interaction of innovation in green tech and green finance has served
    as a potential solution to problems of energy structure transformation, environmental
    pollution reduction, and climate change mitigation.


    The United Nations and other organizations have standards like CERES (Coalition
    for Environmentally Responsible Economies) principles, which is a model corporate
    code of environmental conduct that tries to identify qualities to look for in
    green finance when evaluating projects or companies. There are also organizations
    that help to identify companies and score them for environmental, social, and
    governance (ESG) or socially responsible investors like Sustainalytics or Morgan
    Stanley Capital International. Each investor, firm, and government must decide
    for themselves what fits their goals.


    There is the public sector of green finance which is composed of governmental
    identities that create incentives like subsidies or take on projects of their
    own like public transport or water management using bonds for funding. They can
    also work with the private sector using Green Banks. Green Banks, which can be
    established in numerous forms, set sustainable goals and then achieve these by
    leveraging large amounts of private capital using relatively small amounts of
    public money. Green Banks use multiple financial tools to do this such as credit
    enhancements and loan programs and then expect to be paid back. With proper management,
    green banks can have a dramatic environmental impact as well as be revenue positive.
    Often, projects taken on by the public sector are ones that the private sector
    will not provide adequate financing for due to either a lack of adequate return
    on investment or too much risk.


    # 3. Embracing green technological innovation for sustainable development


    The advancement in green technology reflects a highly positive impact on the environment,
    which helps us to utilize naturally occurring energy and reduce the negative impact
    of human activity on the environment. Investments in green technologies are blooming
    every year and more countries contemplate to adopt green technologies and ditch
    nonrenewable resources; this could help to build a more sustainable future.'
