    multistakeholder group to mobilize climate finance and helps to facilitate networking,
    research, governance, and demonstrations, and support the DLT applications and
    related Fintech solutions to address climate change.


    **Project Genesis:** A green bond issuance prototype launched by the Bank of International
    Settlements Innovation Hub and the Hong Kong Monetary Authority. It is a digital
    platform combining DLT to tokenize assets infrastructure structure focused specifically
    on governments green bonds. It is based on a private blockchain that offers a
