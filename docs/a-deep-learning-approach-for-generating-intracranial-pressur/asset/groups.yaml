    \ 2001 年 6 月 1 日至 2012 年 10 月 31 日期间，波士顿州波士顿以色列长老会医学中心记录的 46,520 名患者和 58,976 次入院的去标识数据\
    \ [27]。数据包括人口统计学、入院和出院记录、国际疾病分类第 1999 版（ICD9）诊断代码、生理发现、生存数据、访诊记录和药史。在部分患者中收集了生理小波数据。我们决定根据\
    \ ABP、ECG 和 PPG 对 ICP 进行建模。通过这些波形，我们预测 ICP 的三种模式以及每种波形的贡献。\n\n# 4. 方法\n\n本工作是在马萨诸塞理工学院（MIT）物理存储库（https://physrepo.mit.edu/）提供的完全发布数据集上进行的。在\
    \ MMIC-III 数据库中，我们获得了马萨诸塞医疗中心机构审查委员会（IRB）批准（编号 P-2001/1694），允许将数据库用于研究，并提取了去标识化的数据。由于数据库不包含受保护的健康信息，IRB\
    \ 批准中包含了免除知情同意的要求。\n\n# 4.1 预处理、队列选择和数据方法\n\n我们提供了该数据库中年龄 18 岁及以上，且入院、ABP、PPG\
    \ 和 ECG 记录至少 5 分钟的患者。我们仅 ECG 导联 II [28]。排除了记录超过 5 分钟 PPG 波形数据的患者。这是因为在确定何种 ICP\
    \ 时段具有临床意义时，小于 5 分钟通常被认为是临床发现的典型时长。\n\n从剩余患者中提取了波形数据（同步或异步）。从每个波形中提取不包含任何非零值（NA）或生理上不可能值（ICP\
    \ < -100 mmHg 或 200 mmHg；PPG < 20 mmHg 或 300 mmHg；平均心率）的五分钟序列用于波形预测。为了解决 CVD 评估的潜在问题，对信号应用了插值法和带通滤波器以消除可能导致数据不准确的高频和低频波形。\n\
    \n对于本研究，颅内高压发作被定义为 ICP > 20 mmHg [29]。最近的创伤性脑损伤指南建议阈值为 20 mmHg，但我们的研究包括了进入 ICU\
    \ 的异质人群，该 ICU 同时负责儿童和老年患者。报告显示患者存在大量的颅内高压事件，总时长超过 60 分钟。最后，排除了 ECG 数据少于 5 分钟的患者\
    \ [30]。预处理的每一步均在补充表-IA 中报告。\n\n本次分析排除的受者数量为 N=129 人（2.3 %），对应 2,755 次 5 分钟的数据。然而，其中高达\
    \ 50% 的波形缺失（NA），这表明插值并非可行策略。此外，缺失值大多是序列性的，使得填补变得困难。通过训练深度学习模型，可以缓解缺失值带来的偏差。结果，我们决定在维持严格缺失值标准下\n\
    \n研究表明心血管与颅内变化之间存在双向关系。ICP 波形是一种高度振荡的形态，捕捉了动脉压的特征。动脉血压是脑阻力的主要决定因素，理想在血液动力学循环中确保脑压保持恒定。当血压处于极端时，血灌注可能导致脑减少和\
    \ ICP 升高 [8]。\n\n在此我们探索 ICP 与 ICU 获取的三种生理波形之间的关系：动脉血压（ABP）、容积脉波（PPG）和心电图（EEG）。利用颅外生理数据准确估计\
    \ ICP 可能为目前的评估提供更安全、侵侵入性的方案。\n\n# 相关工作\n\n我们的研究提出了一种预测 ICP 波形的新方法，这与文献中的报道显著不同。我们利用深度学习通过高频（125\
    \ Hz）ABP、PPG 和 ECG 数据预测 ICP。其他小组开发了基于物理模拟和统计模型来解释 ICP，以及预测 ICP 的驱动方法 [1, 14-17]。某些小组开发了用于颅内高压的潜力算法\
    \ [18,19]。我们在有限范围内尝试提供相对方案。许多研究关注于利用颅外生理特征预测 ICP，但它们尚未采用深度学习 [12, 13]。深度学习模型能够直接从数据中学习波形的特征。深度学习是否有助于捕捉输入波形（颅外）与输出波形（颅内）之间的层次化和非线性关系以进行特征工程？\n\
    \n一项关于比较 ICP 和血压的研究 [20]。我们使用 ECG、ABP 和血流速度（源自经颅多普勒 TCD）波形来计算 ICP。用于 TCD 波形数据的方法\
    \ [23] 已应用于 ABP、ECG 和 PPG。此外，其他研究使用了监测的颅内 PPG 信号进行研究 [24]。我们在此研究 PPG 作为 ICP 的潜在相关物。\n\
    \n"
