    It should be noted that our work is not without flaws predicting the ICF but the
    entropy of the waveform. We found this to be a tractable problem, and the computational
    power might be reduced by re-encoding the dataset, a reflection of our method
    which validates PPG and ECG can help to sufficiently predict ICF models. Using
    RNN, and VNET models shows that our approach of predicting the ICF from extracellular
    waveforms can be adopted in lower resource settings, particularly when arterial
    blood pressure cannot be measured.


    # 6.3. Limitations


    We acknowledge several limitations in this research. This is a proof-of-concept
    study with a sample size that was small, leaving justifiable concerns about statistical
    power, generalizability, and reality. Our results are reflective of the method
    used and the Bland-Alt analysis were relatively wide, indicating that the model
    will need further validation before it is considered in clinical works. Additionally,
    our patient sample was heterogeneous with respect to the etiology of their brain
    injury. Furthermore, the current dataset contains fields that were uncertain,
    potentially affecting model performance due to variations in input extraction
    signals and methods. With our application of a pre-processing scheme, absence
    of PPG and ECG detection system can help filter out noisy high-quality waveform
    data which could introduce bias into the training models and affect performance.
    Furthermore, our use of deep learning algorithms limits on the interpretation
    of important features in computing ICF. Given the nature of our experiment, we
    have not decided which model metrics are appropriate. A threshold of 5 mmHg is
    considered and would need to be agreed upon before consideration of clinical implementation.
    Finally, we have not externally validated our model in an independent dataset,
    restricting the generalizability of the findings found around the MIMIC III Waveform
    Database.


    6.4. Future direction


    Ongoing and future research will concentrate on aggregating the sample size of
    evaluated patients and examining differences in model performances. We plan to
    expand our work by including more de-identified waveforms (e.g., continuous monitoring)
    and adding patient demographics, thereby enhancing patient representation and
    improving model generalizability. We will also test the models on an external
    dataset outside of the MIMIC III Waveform


    Database to assess the generalizability of model performance. Ideally, we intend
    to externally validate our data on a more homogeneous group of TBI patients enrolled
    in a larger prospective database. Finally, we will tune our independent deep learning
    models and methods for aggregating the outputs of each into a ‘super-ensemble’
    learner to enhance performance.


    # 7. Conclusions


    In conclusion, the results of this study indicate that algorithmic prediction
    of the ICF from discrete set of continuous physiological signals is possible and
    yields accuracies that are higher than most other nonlinear techniques and on
    par with methods like ICP. With further refinement and validation, this could
    provide an accessible alternative to ICF measurements, enabling prompt treatment
    of severe brain injury in lower resource settings.


