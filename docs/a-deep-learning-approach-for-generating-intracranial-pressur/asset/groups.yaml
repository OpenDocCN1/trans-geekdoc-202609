    evaluated patients and examining differences in performance. We plan to expand
    our work by including more de-identified waveforms (e.g., continuous monitoring)
    and adding demographics, thereby enhancing patient representation and improving
    generalizability. We will also test the models on an external dataset outside
    of MIMIC III Database to assess the generalizability of model performance. Ideally,
    we intend to externally validate our data on a more homogeneous group of TBI patients
    enrolled in a larger prospective database. Finally, we will tune our independent
    deep learning models and methods for aggregating the outputs of each into a ‘super-ensemble’
    learner to enhance performance.


    # 7. Conclusions


    In conclusion, the results of this study indicate that algorithmic prediction
    of ICP from discrete set of continuous signals is possible and yields accuracies
    that are higher than most other techniques and on par with methods like ICP. With
    further refinement and validation, this could provide an accessible alternative
    to ICP measurements, enabling prompt treatment of severe brain injury in lower
    resource settings.


