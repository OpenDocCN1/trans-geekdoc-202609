    # 6. 讨论


    ## 6.1. 主要结果


    我们展示了一种连续 ICP 波形框架，该框架利用深度学习融合在 ICU 中测得的 PPG 波形数据。最佳预测 ICP 的 MAE 为 5.5 mmHg 且系统性偏差有限，表明
    PPG 是预测 ICP 的重要信号，而波形提供了更全面的证据。总体而言，发现支持了我们的假设，即从非侵入性 PPG 中提取 ICP 波形信息，并可能从颅外数据准确重建
    ICP 波形；我们算法的实时性和非侵入性特征可以集成到连续 ICP 监测流中，这与目前的侵入性方法相比将是一个巨大的优势。


    我们将我们的发现与最近的研究进行了对比，这些研究使用了在基于 TCD 导出的血流速度、ABP 和 ICU 中 ICP 上训练的深度学习算法。他们方法的报告平均绝对误差为
    3.88 ± 3.26 mmHg 和 3.44 ± 1.71 mmHg，然而，许多设置下使用的 TCD 无法持续监测，这表明它是对 ICP 的无意评估；本研究的方法提供了数值计算，而不是像当前工作那样重新形成波形。


    ## 6. 优势


    通过关注非侵入性 ICP，我们的研究潜力在资源有限的地区显著推进严重脑损伤患者的监测和治疗。使用深度学习进行实时波形重建可以集成到目前的监测流程中，作为 ICP
    产生场景下更安全、更准确的替代方案，扩大了可能受益于非侵入性 ICP 治疗急性脑损伤的患者的潜力。


    我们的最佳结果达到了与侵入性 ICP 相似的精度，误差为 5.5 mmHg [52]。我们还可以将其算法的性能与 TCD 超声等技术进行比较，该技术的 ICP
    估算误差范围为 12–55 mmHg [52]，且不支持持续评估 [53]。其他非侵入性 ICP 技术的误差范围为 15–55 mmHg，并且需要将探头插入脑部
    [8]。


    虽然后者技术提供了实时和持续监测，


