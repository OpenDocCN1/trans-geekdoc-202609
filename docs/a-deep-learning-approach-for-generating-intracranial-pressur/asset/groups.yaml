  mdcn: "\n\n# 生物学与医学中的计算机 177 (2024) 108677\n\nScienceDirect 提供目录列表\n\n# 生物学与医学中的计算机\n\
    \n期刊主页：www://www.elsevier.com/locate/combiomed\n\n![](img/c1f600d4443c664084dc5e3430046d05_0_0.png)\n\
    \n![](img/c1f600d4443c664084dc5e3430046d05_0_1.png)\n\n# 一种在重症监护室常规从颅外信号生成颅内波波的深度学习方法\n\
    \nShiker S¹, Alina Guo², Joseph Boen³, Atas Agarwal⁴ O Chahal ⁵ Arushi Tandon\
    \ ⁶ Meet Pael⁷, Sreenidhi Sankaraman⁸ Nicholas Julian⁹, Durr¹⁰, Te D Azad¹¹ Romain\
    \ Piraccchio¹¹ Robert D Stevens¹¹¹**\n\n# 文章信息\n\n- 关键词：\n    - 深度学习\n    - 颅内压\n\
    \    - 动脉血压\n    - 心电图\n    - 容积脉波\n    - 无创性诊断\n\n颅内压（ICP）通常用于监测创伤性脑损伤（TBI）、缺血性及出血性中中、脑代谢或炎症疾病以及脑水肿患者。评估\
    \ ICP 的现有方法消耗资源且具有高度侵入性。我们从重症监护室（ICU）获取的三种信号中连续获取 ICP 波形：动脉血压（ABP）、容积脉波（PPG）和心电图（EEG），涵盖了\
    \ 10 名患者在 600 小时内同步采集的高频（125 Hz）ICP、ABP 和 PPG 小波波（wavelet）数据。我们训练了深度学习（DL）模型来重构\
    \ ICP 波形。在单患者和多患者测试中评估了不同深度学习模型的预测性能。最佳模型的平均绝对误差（MAE）在单患者测试中为 1.34 mmHg，多患者测试中为\
    \ 2.11 mmHg。通过分析比较了不同模型之间统计学上的独立性能（EEG、PPG 和 ABP 的标准差 SD = 0.63 ± 0.75，0.66 ±\
    \ 0.96；p = 0.42）。结果证明了利用电生理波形进行无创连续监测的潜力。通过完善和验证，该方法可以为侵入性 ICP 监测提供一种更易获取的替代方案，能够在资源限制的环境下实现稳定的评估和治疗。\n\
    \n# 1. 引言\n\n颅内压（ICP）是一种生理变化参数，用于管理创伤性脑损伤（TBI）、缺血性及出血性中风、脑代谢或炎症疾病以及脑水肿患者。ICP 升高是危及生命的事件，可能导致颅内损伤扩大、脑肿或死亡。通常，ICP\
    \ 可以通过侵入性复苏措施进行有效治疗，并对某些严重 TBI 和其他患者\n\n监测和评估 ICP 的标准是放置脑室引流术（EVD）或颅内监测仪（PIM⁵）。这些是经钻穿颅骨置入大脑的高度侵入性设备。根据一项荟萃\
    \ [6]，EVD 放置错误、出血和感染的风险分别为 13.5%、5.8% 和 12.1%。插入 EIM 的过程涉及巨大风险，需要专门设备和神经外科专业知识，而这些在许多环境中是不可用的\
    \ [7]。因此，需要一种更易获取、更准确且可靠的侵入性 ICP 监测替代方案。\n\n* 约翰斯·霍普金斯大学麻醉学与重症监护医学相关系，美国马里兰州巴尔的摩。\n\
