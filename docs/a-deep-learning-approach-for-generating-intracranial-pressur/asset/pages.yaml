    # # A deep learning approach for generating intracranial waveforms from extrancranial
    signals routinely in the intensive care unit


    Shiker S¹, Alina Guo², Joseph Boen³, Atas Agarwal⁴ O Chahal ⁵ Arushi Tandon ⁶
    Meet Pael⁷, Sreenidhi Sankaraman⁸ Nicholas Julian⁹, Durr¹⁰, Te D Azad¹¹ Romain
    Piraccchio¹¹ Robert D Stevens¹¹¹**


    # ARTICLE INFO


    +   Keywords:

    Deep learning

    Intracranial pressure

    Arterial blood pressure

    Electrocardiogram

    Plethysmography

    Non-invasive diagnosis


    Intracranial pressure (ICP) is commonly monitored to treat patients with brain
    disorders such as traumatic brain injury (TBI). Established methods to assess
    ICP are resource intensive and highly invasive. We obtained ICP waveforms continuously
    from three signals acquired in the Intensive Care Unit (ICU): arterial blood pressure
    (ABP), plethysmography (PPG), and electrocardiogram (EEG) over 600 h of high-frequency
    (125 Hz) simultaneously acquired ICP, ABP, and PPG wavelet data from 10 patients.
    We trained deep learning (DL) models to reconstruct ICP waveforms. The predictive
    performance of different DL models was evaluated in single-patient and multi-patient
    tests. The mean absolute error (MAE) of the best-performing models was 1.34 mmHg
    in the single-patient test and 2.11 mmHg in the multi-patient test. Analysis was
    conducted to compare statistically independent performances across the models
    (SD = 0.63 ± 0.75, 0.66 ± 0.96, for EEG, PPG, and ABP; p = 0.42). The results
    demonstrate the potential of non-invasive continuous monitoring using electrophysiological
    waveforms. With refinement and validation, this method could provide a more accessible
    and alternative to invasive ICP, enabling stable assessment and treatment in resource-constrained
    settings.


    # 1. Introduction


    Intracranial pressure (ICP) is a physiologically variable used in the management
    of patients with traumatic brain injury (TBI), ischemic and hemorrhagic stroke,
    metabolic or inflammatory disorders of the brain, and hydrocephalus. Elevations
    in ICP are life-threatening events which may expand intracranial damage, cerebral
    edema, or death. In fashion, ICP may be effectively treated with invasive resuscitative
    measures and in selected patients with severe TBI and other


    The standard for monitoring and ICP is the placement of an external ventricular
    drain (EVD) or intracranial monitor (PIM⁵). These are highly invasive devices
    placed in the brain by drilling through the skull. For EVDs, the risk of misplacement,
    hemorrhage, and infection, is 13.5 %, 5.8 %, and 12.1 %, respectively, according
    to a meta-analysis [6]. The procedure of inserting an EIM involves significant
    risks, requiring specialized equipment and neurosurgical expertise which is not
    available in many settings [7]. There is, therefore, an unmet need for alternatives
    to invasive ICP that are more accessible and accurate, yet reliable


