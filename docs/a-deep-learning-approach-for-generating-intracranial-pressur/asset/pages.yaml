    # 4.2. Determining length for prediction task


    To ensure that the prediction task was as real-time as possible, a window size
    of 10 s was used dynamic windowing (DTW) to analyze information drop-off when
    10 s compared to windows for the ICP wavelet (Table 2). We tested different window
    adjustments for each extracranial wavelet and ICP in a pairwise manner. We found
    that the correlation of DTW scores of each extracranial wavelet with respect to
    ICP for adjacent windows showed that expected 10 s window was sufficient as the
    drop-off in DTW correlation between windows was not significant, supporting the
    use of the (10-s) windows (Table 2).¹


    # 4.3. Model selection and architecture


    The goal of this study is to predict the entire ICP wavelet (125 Hz) from ABP,
    EEG, and PPG waveforms (125 Hz). Given that this is a multivariate time series
    prediction problem, we developed models that fit this architecture and have been
    used in several similar problems for space-time-based predictions (Fig. 3):


