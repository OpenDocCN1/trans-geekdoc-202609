    To ensure that the best-performing models were generalizable to new patients,
    a multi-patient analysis was conducted 6 patients for training, 2 for validation,
    and for the rest the intracranial pressure (ICP) along with each patient''s count
    of hypertensive and total more than 10 patients. This approach ensures that the
    models are evaluated on data from patients that are different from those used
    in the training phase, providing a robust assessment of the models. The performance
    on the training and testing sets was reported for each model, to provide a measure
    of model performance and accuracy. Furthermore, follow-up analysis was performed
    to evaluate the models on the validation and testing sets. This analysis is crucial
    for ensuring that the models are generalizable and can be applied to new patients
    in practice, where the algorithm will be trained on different patients than the
    patients it was used in the ICU.


    In the single-patient analysis for predicting ICP using PPG, and ECG, the average
    MAE loss over the 10 patients for the deep learning models was as follows: RNN
    3.17 ± 0.68, GRU 1.31 ± 0.59, LSTM 1.63 ± 0.60, TCN 1.18 ± 0.57, VNET 1.22 ± 0.57,
    and Transformer 2.65 ± 0.82 (Table 3). Individual performance of each the models
    can be found in Supplementary Table IV-A. Analysis of the results shows that the
    GRU, LSTM, TCN, and VNET all performed significantly better than the RNN and Transformer
    models. While there is some variance for GRU, the results were consistent across
    all conditions.


    The multi-patient analysis indicates that all models performed to a similar degree
    with an MAE close to 5mmHg (Table 4). Four examples of a predicted ICP value generated
    by the LSTM model and similar results for other models can be seen in Supplementary
    Figures IV-A.


    # 4.7. Ablation on multi-patient top model


    To assess extracranial performance, an analysis was conducted in the multi-patient
