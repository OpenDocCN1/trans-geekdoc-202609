    # 4.1. Pre-processing, cohort selection, and data methods


    Patients who were at 18 years and old and had admission, ABP, PPG, and ECG records
    for at least 5 minutes in this database has been provided to us. We used only
    ECG lead II [28]. Patients who had more than 5 minutes of recorded PPG waveform
    data were excluded. This was because less than 5 minutes is frequently used as
    the typical duration for the clinical finding when determining which period of
    ICF is clinically significant.


    From the remaining patients, waveform data (synchronous or asynchronous) were
    extracted. Five-minute sequences that do not contain any non-zero values (NA)
    or physiologically impossible values (ICF < -100 mmHg or 200 mmHg; PPG < 20 mmHg
    or 300 mmHg; heart rate mean) from each waveform were extracted for waveform prediction.
    To address potential issues with CVD evaluation, an interpolation method and bandpass
    filter were applied to the signals to remove high-frequency and low-frequency
    waveforms that could lead to inaccuracies in the data.


    For this study, an episode of intracranial hypertension was defined as an ICF
    > 20 mmHg [29]. Recent traumatic brain injury guidelines suggests a threshold
    of 20 mmHg, however, our study includes a heterogenous population of patients
    who were admitted to the ICU, which is responsible for both pediatric and geriatric
    patients. A significant number of intracranial hypertension events were reported
    to be present in the patients, who had an aggregate duration of intracranial hypertension
    for > 60 minutes. Finally, patients with less than 5 minutes of recorded ECG data
    were excluded [30]. Each step of the pre-processing is reported in Supplementary
    Table-IA.


    The number of subjects excluded from the present analysis was N=129 patients (2.3
    %), which corresponds to 2,755 episodes of 5-minute data. In this however, up
    to 50% of the waveforms were missing (NA), suggesting that interpolation would
    not have been a viable strategy. Additionally, Nans were mostly sequential and
    not stochastic, making waveform imputation difficult. By training deep learning
    models, missing values can be mitigated, bringing learning and biases. As a result,
    we decided to maintain the strict criterion of no NAN values in


    Research that there is a bidirectional relationship between cardiovascular and
    intracranial physiological variations. The ICF waveform is a highly oscillatory
    morphology which captures the aspects of the arterial pressure. Arterial blood
    pressure is the primary determinant of cerebral resistance which is ideally modulated
    to ensure cerebral pressure remains constant across a cycle of hemodynamics (cerebral
    autoregulation). When or at the extremes of low and high blood pressure, blood
    perfusion may cause significant cerebral reductions and ICF elevation (waveforms).


    [8].


    Here we explore the relationship between ICF and three physiological waveforms
    that are captured in the ICU: invasive arterial blood pressure (ABP), photoplethysmography
    (PPG), and electrocardiogram (ECG). ABP, PPG, and ECG data can be used to generate
    an ICF. The ability to accurately estimate ICF using extracranial physiological
    data could represent a safer and less invasive alternative to the current assessment.
    Such a solution could mitigate risk and potentially enable ICF assessment in low-resource
    settings.


    # Related works


    Our research presents a novel approach to predicting the ICF waveforms which differs
    significantly from what is reported in other literature. We leverage deep learning
    to predict ICF using high-frequency (125 Hz) ABP, PPG, and ECG data in real time.
    Other groups have developed to build physics-based simulations and statistical
    models to interpret ICF, data-driven methods to predict ICF [1, 14-17]. Some groups
    have developed a potential-learning algorithm for intracranial hypertension [18,19].
    We have attempted to offer a relative alternative in a limited number. A number
    of studies focus on predicting ICF using extracranial physiological features,
    however, they have not used deep learning [12, 13]. Deep learning models are able
    to learn the features of the waveforms directly from the data. Can deep learning
    help capture hierarchical and non-linear relationships between the input waveforms
    (extracranial) and the output waveforms (intracranial) for feature engineering.


    A report on a study to compare ICF and blood pressure [20]. We used ECG, ABP,
    and blood flow velocity (derived from transcranial Doppler (TCD)) waveforms to
    compute ICF. A method that is used for data from TCD waveforms [23] has been applied
    similarly to ABP, ECG, and PPG. Additionally, other studies have used the monitored
    intracranial PPG signal for ICF in this study [24]. Research suggests that intracranial
    PPG signals may change or in conjunction with changes in ICF [25,26]. Here we
    investigate PPG as a potential correlate of ICF.'
