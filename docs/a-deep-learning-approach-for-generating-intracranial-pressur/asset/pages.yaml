    # 6. Discussion


    # 6.1. Key results


    We present a framework for continuous ICP waveform that leverages deep learning
    to fuse PPG waveform data measured in ICU. The best predicted ICP with an MAE
    of 5.5 mmHg and limited systematic bias show that PPG is an important signal in
    predicting ICP, while the waveform provides more comprehensive evidence. Overall,
    the findings support our hypothesis that information on the ICP waveform can be
    extracted from non-invasive PPG and


    is possible to accurately reconstruct an ICP waveform from extracranial data,
    the real-time and non-invasive nature of


    nature of our algorithms could be integrated into the continuous flow of ICP monitoring,
    which would represent a significant advantage with respect to current invasive
    approaches.


    We compare our findings with recent studies that employed deep learning algorithms
    trained on TCD-derived blood flow velocity, ABP, and ICP in ICU. The reported
    mean absolute error of their methods were 3.88 ± 3.26 mmHg and 3.44 ± 1.71 mmHg,
    However, TCD used in many settings cannot be monitored continuously, suggesting
    that this would represent an inadvertent assessment of ICP, the approach in this
    study provided a numerical computation instead of re-forming the waveform as is
    the case in the current work.


    # 6. Strengths


    By focusing on non-invasive ICP, our research has potential to significantly advance
    the monitoring and treatment of patients with critical brain injuries, in resource-limited
    settings. Real time waveform reconstruction using deep learning could be integrated
    into the current monitoring workflows as a safer, more accurate alternative in
    ICP-generation scenarios, expanding the potential of patients who would benefit
    from non-invasive ICP for the treatment of acute brain injuries.


    Our best results performed with similar accuracy to invasive ICP show an error
    of 5.5 mmHg [52]. We can also compare our algorithms'' performance to technologies
    such as TCD-ultrasoundography, where ICP estimation has an error of range of 12–55
    mmHg [52], and, do not support continuous evaluation [53]. Other non-invasive
    ICP techniques have an error range of 15–55 mmHg and require a probe to be inserted
    into the ear of the brain [8].


