    * `β0` 是截距，

    * `β1,β2,...,βn` 是系数，


    # 决策树与随机森林


    决策树和随机森林是强大的机器学习算法，可以应用于广泛的分类和回归问题。决策树提供了解释性和灵活性，随机森林通过组合多棵树提供了更好的性能和鲁棒性。


    ## 决策树


    决策树是一种树形结构，每个内部节点代表基于特征的决策，每个叶子节点代表预测的类别或值。构建决策树的过程涉及递归地划分特征空间，形成对于目标变量尽可能同的区域。在每一步中，算法选择最佳划分数据的特征和阈值，以最大化信息增或
    Gini 纯度等特定标准。这一过程持续到满足停止标准，例如达到最大深度或每个叶子节点的最小样本数。


    决策树具有高度的可解释性，并能捕捉复杂的关系。然而，它们容易过拟合，特别是当允许树生长得过深时。


    ## 随机森林


    随机森林通过聚合多棵决策树的预测解决了决策树的过拟合问题。随机森林中的每棵树都是基于训练数据的自助样本（有放回采样）训练的，并且每次划分时仅考虑特征的随机子集。这种随机性有助于降低树的相关性并减少过拟合，从而带来更好的泛化性能。


    与单个决策树相比，随机森林具有许多优势，包括提高准确性、对噪声数据和离群点的鲁棒性以及减少方差。与其他模型相比，它们对超参数不敏感，且特征工程需求较。此外，随机森林可以处理分类和回归任务，适用于具有混合特征的高维数据集。


    # 支持向量机 (SVM)


    支持向量机（SVM）是一种强大且多功能的监督学习算法，用于分类和回归任务。SVM 特别适用于类别之间的决策边界是非线性或复杂的分类任务。它们通过在特征空间中寻找最佳分离类别的超平面来工作，同时最大化间隔（即超平面与每个类别最近数据点之间的距离）。这种间隔最大化原理赋予了
    SVM 对离群点的鲁棒性，并使其了发生过拟合的概率。


    '
- fmt: '

    # SVMs Core Concepts


    The key idea behind SVMs is to transform the input data into a higher-dimensional
    space using a kernel function, where the classes become linearly separable. The
    hyperplane that separates the classes in this higher-dimensional space corresponds
    to a non-linear decision boundary in the original feature space. Commonly used
    kernel functions include linear, polynomial, radial basis function (RBF), and
    sigmoid kernels, each of which has different properties and is suitable for different
    types of data and problems.


    One of the main strengths of SVMs is their ability to handle high-dimensional
    data and find complex decision boundaries without explicitly computing the transformations
    to the higher-dimensional space. Instead, SVMs use a technique called the kernel
    trick, which allows them to implicitly compute the dot products between data points
    in the higher-dimensional space without explicitly transforming the data. This
    makes SVMs computationally efficient and memory-efficient, even for large datasets
    with many features.


    SVMs offer several advantages over other classification algorithms, including
    logistic regression and decision trees. They are effective in high-dimensional
    spaces and can capture complex relationships between features and the target variable.
    SVMs are also robust to overfitting and perform well with small to medium-sized
    datasets. Moreover, SVMs have a strong theoretical foundation and are widely used
    in various domains, including image classification, text classification, bioinformatics,
    and finance.


    However, SVMs also have some limitations, including the need to select appropriate
    kernel functions and tune hyperparameters such as the regularization parameter
    `CC` and kernel parameters. SVMs can also be sensitive to the choice of kernel
    and may require careful preprocessing of the data, such as feature scaling. Despite
    these challenges, SVMs remain a popular and powerful tool for classification tasks,
    particularly when dealing with non-linear and high-dimensional data.


    # Model Evaluation and Validation Techniques


    Model evaluation and validation are essential steps in the machine learning workflow
    to assess the performance and generalization ability of trained models. These
    techniques help ensure that the model performs well on unseen data and can be
    trusted for making accurate predictions in real-world applications. Several methods
    and metrics are commonly used for model evaluation and validation, including:


    ### Train-Test Split


    This is one of the simplest and most commonly used techniques for model evaluation.
    The dataset is divided into two subsets: a training set used to train the model
    and a separate test set used to evaluate its performance. The model is trained
    on the training set and then evaluated on the test set to estimate its generalization
    error. The train-test split ratio is typically chosen based on the size of the
    dataset and the desired trade-off between bias and variance.


    The train-test split method stands as one of the foundational and widely employed
    techniques for evaluating machine learning models. It embodies a straightforward
    yet effective approach by partitioning the dataset into two distinct subsets:
    the training set, utilized to train the model, and the test set, employed to assess
    its performance. This segregation facilitates a robust estimation of the model''s
    generalization error, gauging how well it can extrapolate its learned patterns
    to unseen data.


    In practice, the train-test split method involves allocating a certain proportion
    of the dataset to each subset, typically with the majority of the data designated
    for training and a smaller portion reserved for testing. The selection of this
    split ratio is critical, balancing the need for an adequately sized training set
    to train the model effectively with the necessity of a sufficiently large test
    set to provide a reliable evaluation of its performance.


    The choice of the train-test split ratio hinges on several factors, including
    the size of the dataset, the complexity of the model, and the desired trade-off
    between bias and variance. A larger training set can yield a model with lower
    bias but higher variance, whereas a larger test set enhances the reliability of
    the performance evaluation but may lead to a reduction in the training data available
    for model fitting.


    The train-test split method serves as a fundamental tool in the machine learning
    practitioner''s arsenal, offering a simple yet robust means of assessing model
    performance and guiding the iterative refinement of predictive algorithms. By
    systematically partitioning the dataset into training and test sets and rigorously
    evaluating the model''s performance on unseen data, this technique facilitates
    the development of models that generalize well to real-world scenarios, thereby
    enhancing their utility and effectiveness in various applications.


    ### Cross-Validation


    Cross-validation is a more robust technique for model evaluation, especially when
    the dataset is small or when there is concern about the randomness of the train-test
    split. In `k-fold cross-validation`, the dataset is divided into `k` equally sized
    folds, and the model is trained and evaluated `k` times, each time using a different
    fold as the test set and the remaining folds as the training set. The performance
    metrics are then averaged across the `k` iterations to obtain a more reliable
    estimate of the model''s performance.


    Cross-validation stands as a pivotal technique in the arsenal of model evaluation
    methods, particularly in scenarios where datasets are limited in size or where
    concerns arise regarding the randomness of the train-test split. This method offers
    a more robust and comprehensive evaluation by systematically partitioning the
    dataset into multiple subsets and iteratively training and evaluating the model
    on different combinations.


    In `k-fold cross-validation`, the dataset is divided into `k` equally sized folds,
    with each fold serving as a test set exactly once while the remaining `k-1` folds
    are utilized as the training set. This process is repeated `k` times, ensuring
    that each data point is included in the test set exactly once. By averaging the
    performance metrics obtained from these iterations, cross-validation provides
    a more stable and reliable estimate of the model''s performance compared to a
    single train-test split.


    Cross-validation offers a robust and statistically sound methodology for model
    evaluation, enabling practitioners to obtain a more accurate assessment of a model''s
    performance and generalization capabilities. By systematically validating the
    model across multiple subsets of the data, cross-validation enhances confidence
    in the reliability and effectiveness of machine learning models, fostering greater
    trust and transparency in their application across various domains and use cases.


    ### Stratified Sampling


    In classification tasks with imbalanced class distributions, it is essential to
    ensure that each class is represented proportionally in both the training and
    test sets. Stratified sampling ensures that the class distribution is preserved
    when splitting the data into train and test sets, helping to prevent biased evaluations
    and misleading performance estimates.

    '
