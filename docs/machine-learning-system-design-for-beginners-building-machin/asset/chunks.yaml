    是输入特征。


    2. **多元线性回归**：在多元线性回归中，有多个输入特征，但假设输入与输出之间的关系仍然是线性的。模型方程变为 `y=β0+β1x1+β2x2+...+βnxn`，其中
    `x1,x2,...,xn` 是输入特征。


    3. **多项式回归**：多项式回归通过引入输入特征的多项式项扩展了线性回归，能够捕捉更复杂的关系。例如，二次回归模型在线性项之外，可能包含 `x²`、`x³`
    等项。


    线性回归被广泛应用于经济、金融、工程、社会科学等领域，用于预测股价、估计销售收入、分析实验数据以及变量之间关系的建模等任务。尽管线性回归非常简单，但它仍然是预测建模和推理的强大且多功能的工具。然而，重要的是，线性回归对数据提出了若干假设，包括线性、同方差性（误差的方差恒定）和误差独立性，这些假设在应用模型之前应该经过验证。此外，当输入与输出变量之间的关系高度非线性或数据中存在显著离群点时，其表现可能并不理想。


    # 逻辑回归


    逻辑回归是一种强大且广泛用于二分类统计技术，其任务是根据输入特征预测两个可能结果之一。尽管名称带有回归，但逻辑回归是一种分类算法而非回归算法。它特别适用于输出变量为二值（即具有两个类别或分类）的问题，例如垃圾邮件检测、疾病诊断、客户流失预测等。


    逻辑回归的核心思想是对给定输入实例属于特定类别的概率建模。与线性回归（输出是连续值）不同，逻辑回归使用逻辑函数（也称为 sigmoid 函数）对正类（通常标记为
    `class 1`）的概率进行建模。逻辑函数将任何输入值映射到 0 到 1 之间的值，该值可以被解释为正类的概率。


    逻辑函数定义为：


    ```

    p(y=1|x)=1/(1+e^{-(β0+β1x1+β2x2+...+βnxn)})

    ```


    其中：


