    reduction technique that focuses on preserving the local structure of the data
    in a low-dimensional space. t-SNE aims to map high-dimensional data points to
    a lower-dimensional space in a way that maintains the pairwise similarities between
    neighboring points. It achieves this by modeling the conditional probability distribution
    of pairwise similarities in the high-dimensional space and minimizing the Kullback-Leibler
    divergence between the conditional distributions in the high-dimensional and low-dimensional
    spaces. t-SNE is particularly useful for visualizing high-dimensional data clusters
    or manifolds and capturing complex nonlinear relationships. However, it is computationally
    intensive and sensitive to the choice of hyperparameters.


