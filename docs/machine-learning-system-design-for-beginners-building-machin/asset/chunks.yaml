    Machine Learning-based Methods: Machine learning-based approaches leverage supervised
    or unsupervised learning techniques to identify anomalies in the data. In supervised
    anomaly detection, the algorithm is trained on labeled data with both normal and
    anomalous instances, allowing it to learn to distinguish between the two classes.
    Examples of supervised techniques include support vector machines (SVM), random
    forests, and neural networks. In unsupervised anomaly detection, the algorithm
