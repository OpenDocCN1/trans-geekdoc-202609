    Organizations are increasingly turning to containers and Kubernetes to overcome
    the challenges of scaling their machine and deep learning efforts.


    It turns out we’ve seen this before. The introduction of Docker containers in
    2013 initiated a dramatic shift in the way software applications are developed
    and deployed by allowing engineering teams to overcome a similar set of challenges
    to those faced by data scientists and ML engineers.


    Container images provide a standardized, executable package that provides everything
    needed to run an application, including its code, dependencies, tools, libraries
    and configuration files. A running Docker container is an instantiation of a container
    image.


    Compared with virtual machines, container images are lighter weight, easier to
    move between environments, and faster to spin up. This is in large part because
    they can share the host operating system’s (OS) kernel, as opposed to containing
    their own copy of a complete OS.


    The fact that lightweight containers could be reliably run across disparate computing
    environments helped address many of the difficulties faced by software development
    and operations organizations as they sought to modernize their software delivery
    processes, applications, and infrastructure, leading to their ultimate popularity.


    But containers alone offer a partial solution. For organizations operating at
    scale, supporting multiple concurrent machine learning projects in various stages
    of development, it quickly becomes necessary to use multiple containers, make
    the services they offer easily accessible, and connect them to a variety of external
    data sources. In this case, a container orchestration platform is required—in
    practice if not in theory—to efficiently manage the containers and their interactions
    with one another and the outside world.


    That’s where Kubernetes comes in. Kubernetes is an open source container orchestration
    platform developed and open-sourced by Google in 2014. Kubernetes has since become
    the de facto standard for container orchestration, due to its popularity among
    users, the flexibility it confers to them, the support it has gained from cloud
    computing and software vendors, and the degree of portability it offers between
    on-premises and public cloud environments.


    Kubernetes provides the necessary features required for complete lifecycle management
    of containerized applications and services in a manner that has proved to be highly
    scalable and reliable.


    Before exploring what this means for machine learning workloads, let’s learn a
    bit about Kubernetes itself.'
