    | 案例研究：沃尔沃汽车 | 23 |\n| 入门 | 25 |\n| 关于 TWIML | 29 |\n\n## 赞助商\n\n本《Kubernetes\
    \ for MLOps：扩展企业机器学习、深度学习和人工智能》副本由 HPE 和 Intel 提供。我们感谢他们的支持。\n\n![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_2_0.png)\n\
    \n### 惠普企业\n\n惠普企业是一家全球边缘到云平台即服务公司，帮助组织通过释放其所有数据的价值（无论身在何处）来加速成果。HPE 建立在数十年重塑未来、推动我们生活和工作方式创新的基础之上，提供独特、开放和智能的技术解决方案，在所有云和边缘上保持一致的体验，帮助客户开发新商业模式、以新方式互动，并提升运营性能。欲了解更多信息，请访问：www.hpe.com。\n\
    \n![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_2_1.png)\n\nIntel 是行业领导者，创造改变世界的技术，推动全球进步并丰富人们的生活。受摩尔定律启发，我们不断努力推进半导体的设计和制造，以帮助解决客户面临的最大挑战。通过在云、网络、边缘及各种计算设备中嵌入智能，我们释放数据的潜力，以更好的方式改变商业和社会。欲了解\
    \ Intel 的创新，请访问 www.intel.com。\n\n## 第二版前言\n\n2018 年 12 月，我加班加点赶在 Kubecon Seattle\
    \ 之前完成这本电子书的第一版。经过几周的研究、采访和撰写，我迫切希望为一个虽小但正在壮大的社区揭晓一份及时且必需的资源。\n\n我赶在了截止日期前，但当我坐在会议的主题演讲和分会场中，聆听关于\
    \ Kubernetes 上机器学习（ML）和人工智能（AI）工作负载的众多新公告时，我的心沉了下去。虽然我知道这本电子书对读者来说是一份宝贵的资源，但我也知道它很快就需要更新。\n\
    \n从那时起，使用 Kubernetes 支持组织 ML/AI 项目的做法已从一个晦涩的想法，演变为许多面临将 ML 模型投入生产并进行规模化挑战的组织正在探索和追求的方向。\n\
    \n随着在 Kubernetes 上运行 ML/AI 工作负载的兴趣日益增长，周围的生态系统也随之扩大。在撰写第一版时，Kubeflow 尚处于起步阶段，刚刚发布了\
    \ 0.3 版本。1 当时，这个由 Google 创立的项目距离生产可用还很远，且仍然相当狭隘地专注于在 Kubernetes 上运行 TensorFlow\
    \ 作业。\n\n自那以后，Kubeflow 发布了该项目的普遍可用性（GA）版本，现在致力于支持 Kubernetes 上各种端到端机器学习工作流。该项目\
    \ 1.0 版本于 2020 年 3 月发布，伴随着美国银行、摩根大通商业银行和沃尔沃汽车等公司的推荐。（我很高兴在本书中包含沃尔沃之旅的首个公开案例。）\n\
    \n更广泛的 Kubernetes ML/AI 生态系统也呈爆发式增长，各种开源和商业产品均构建在 Kubernetes 提供的基础之上。我们将在本书中提及其中一些产品，但由于需要跟踪的服务和产品众多，且产品演进迅速，我们决定将开源和商业工具目录移至新\
    \ home：在线 TWIML AI 解决方案指南。\n\n见证这一领域的演变是一次迷人的旅程，我很高兴为您带来这本电子书的第二版。我希望此处共享的信息能帮助您更好地了解在组织内构建、部署和规模化机器学习模型的这一有前途的方向，并最终为贵组织在机器学习和\
    \ AI 方面的创新应用做出贡献。\n\n感谢阅读！\n\nSam\n\n## 简介\n\n企业对机器学习和人工智能的兴趣持续增长，组织正在为 ML/AI\
    \ 项目投入越来越庞大的团队和资源。随着企业扩大投资，构建可重复、高效且可持续的模型开发和部署流程变得至关重要。\n\n推动机器学习中更一致、更高效流程的趋势，与软件开发中为实现相同目标所做的努力相呼应。后者被称为\
    \ DevOps，而前者则越来越多地被称为 MLOps。\n\n虽然 DevOps 和 MLOps 主要关注实践而非技术，但只要这些实践专注于自动化和可重复性，工具就是其兴起的重要推动因素。特别是，像\
    \ Docker 这样的容器技术的出现，极大地推动了 DevOps 的发展，使用户能够在软件开发工作中实现更高的敏捷性、效率、可管理性和可扩展性。\n\n\
    容器仍然是 DevOps 和 MLOps 的基础技术。容器提供了一种核心功能，允许我们在任何地方运行给定的代码——无论是笔记本、实验还是已部署的模型——而无需忍受其他软件共享方法所困扰的“依赖地狱”。但是，要扩展容器以支持大型团队、工作负载或应用程序，还需要额外的技术。这种技术称为容器编排系统，其中最流行的是\
    \ Kubernetes。\n\n在本书中，我们将探讨 Kubernetes 在支持 MLOps 中所发挥的作用：\n\n- 第 1 章对机器学习流程进行了高层次概述，并介绍了组织在规模化时倾向于遇到的挑战。\n\
    - 第 2 章阐述了大规模支持机器学习为何如此困难，并涵盖了数据科学家和机器学习工程师在将模型大规模投入生产时面临的许多挑战中的一些。\n- 第 3 章介绍了容器技术和\
    \ Kubernetes，并展示了它们如何帮助解决前面提到的挑战。\n- 在第 4 章中，我们将深入探讨 Kubernetes 的更多细节。\n- 在第 5\
    \ 章中，我们将回到 ML 工作流，并展示 Kubernetes 如何帮助组织克服其带来的各种挑战。\n- 第 6 章和第 7 章探讨了 Kubeflow\
    \ 和其他高级别工具在交付 MLOps 中的作用。\n- 在第 8 章中，我们有机会坐在副驾驶座上，与早期的 Kubernetes 和 Kubeflow 用户沃尔沃汽车一同体验，从他们在这些技术之上构建\
    \ ML 平台的经验中学习。\n- 第 8 章提供了有关如何启动您自己的项目的一些简要建议。\n\n如果您刚开始接触 MLOps，请知道，现在是开始这段旅程的最佳时机。用户和从业者社区正在爆发式增长，实践和技术日趋成熟，支持和教育资源也与日俱增，质量越来越高。\n\
    \n## 机器学习流程\n\n在讨论如何实现和规模化机器学习交付之前，我们必须了解机器学习流程的完整范围。尽管行业关于机器学习的许多讨论仍然集中在建模上，但现实是，建模只是该流程的一小部分。这一点在\
    \ 2015 年 Google 作者的一篇论文2中得到了深刻的说明，直到今天依然成立。\n\n![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_5_0.png)\n\
    \n图 1. 摘自《机器学习系统中的隐藏技术债务》论文的插图。机器学习模型由图表中心标记为“ML 代码”的小方框表示。该论文将支持基础设施称为“庞大且复杂。”\n\
    \n为了让组织从机器学习工作中获益并实现任何程度的规模和效率，模型必须在可重复的流程中开发，该流程需要考虑模型开发之前和之后的关键活动。\n\n面临需要解决的新问题时，数据科学家将开发并运行一系列实验，以可用数据作为输入，旨在生成可接受的模型作为输出。图\
    \ 2 展示了端到端 ML 工作流的高层次视图，代表了该流程中的三个主要“步骤”——数据获取和准备、实验管理与模型开发、模型部署与性能监控——以及连接它们的迭代循环。\n\
