    # Introduction


    Enterprise interest in machine learning and artificial intelligence continues
    to grow, with organizations dedicating increasingly large teams and resources
    to ML/AI projects. As businesses scale their investments, it becomes critical
    to build repeatable, efficient, and sustainable processes for model development
    and deployment.


    The move to drive more consistent and efficient processes in machine learning
    parallels efforts towards the same goals in software development. Whereas the
    latter has come to be called DevOps, the former is increasingly referred to as
    MLOps.


    While DevOps, and likewise MLOps, are principally about practices rather than
    technology, to the extent that those practices are focused on automation and repeatability,
    tools have been an important contributor to their rise. In particular, the advent
    of container technologies like Docker was a significant enabler of DevOps, allowing
    users to drive increased agility, efficiency, manageability, and scalability in
    their software development efforts.


    Containers remain a foundational technology for both DevOps and MLOps. Containers
    provide a core piece of functionality that allow us to run a given piece of code—whether
    a notebook, an experiment, or a deployed model—anywhere, without the “dependency
    hell” that plagues other methods of sharing software. But, additional technology
    is required to scale containers to support large teams, workloads, or applications.
    This technology is known as a container orchestration system, the most popular
    of which is Kubernetes.


    In this book we explore the role that Kubernetes plays in supporting MLOps:


    +   - Chapter 1 presents a high-level overview of the machine learning process
    and the challenges organizations tend to encounter when it comes time to scale
    it.

    +   - Chapter 2 elaborates on why supporting machine learning at scale is so difficult,
    and covers a few of the many challenges faced by data scientists and machine learning
    engineers in getting their models into production, at scale.

    +   - Chapter 3 provides an introduction to container technology and Kubernetes,
    and shows how they help address the challenges referenced earlier.

    +   - In chapter 4, we zoom in to discuss Kubernetes in more detail.

    +   - In chapter 5, we return to the ML workflow, and show how Kubernetes can
    help organizations overcome the various challenges it presents.

    +   - Chapters 6 and 7 look at the role of Kubeflow and other higher-level tools
    in delivering MLOps.

    +   - In chapter 8, we get an opportunity to sit in the passenger seat and ride
    along with Volvo Cars, an early Kubernetes and Kubeflow user, to learn from their
    experiences building a ML platform atop these technologies.

    +   - Chapter 8 offers some brief advice on how you can get started with your
    own project.'
  - '[PAGE 5]


    If you''re just getting started with MLOps, know that there''s no better time
    than the present to begin this journey. The user and practitioner communities
    are exploding, the practices and technology are maturing, and the support and
    educational resources are more plentiful and of higher quality with each passing
    day.


    # The Machine Learning Process


    Before we can discuss enabling and scaling the delivery of machine learning, we
    must understand the full scope of the machine learning process. While much of
    the industry dialogue around machine learning continues to be focused on modeling,
    the reality is that modeling is a small part of the process. This was poignantly
    illustrated in a 2015 paper2 by authors from Google, and remains true today.


    ![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_5_0.png)


    Figure 1. Illustration from Hidden Technical Debt in Machine Learning Systems
    paper. Machine learning models are represented by the small box labeled “ML Code”
    in the center of the diagram. The paper refers to the supporting infrastructure
    as “vast and complex.”


    In order for organizations to reap the rewards of their machine learning efforts
    and achieve any level of scale and efficiency, models must be developed within
    a repeatable process that accounts for the critical activities that precede and
    follow model development.


    When presented with a new problem to solve, data scientists will develop and run
    a series of experiments that take available data as input and aim to produce an
    acceptable model as output. Figure 2 presents a high-level view of the end-to-end
    ML workflow, representing the three major “steps” in the process—data acquisition
    and preparation, experiment management and model development, and model deployment
    and performance monitoring—as well as the iterative loops that connect them.'
