    # The Kubernetes MLOps Ecosystem


    Kubeflow is one of the many available offerings that take advantage of Kubernetes
    to deliver MLOps capabilities. These offerings range in scope from narrow tools
    that aim to address particular pain-points experienced by data scientists, to
    end-to-end platforms that seek to provide comprehensive support for the ML workflow.
    Licensing and delivery models vary as well, including open source projects, commercially
    supported software products, and cloud-based services.


    > One of the most important distinctions among the various tools available to
    help you build out your organization''s machine learning platform is whether the
    tool aims to be wide or deep. This distinction, and the interesting paradox that
    arises as a result, is explored in detail in TWIML''s The Definitive Guide to
    Machine Learning Platforms.


    The ML/AI tools, infrastructure, and platforms landscape continues to evolve rapidly.
    For this reason we have developed the TWIML ML/AI Solutions Guide, an online resource
    available at twimlai.com/solutions.


    Visit the Solutions Guide for profiles of ML/AI tools and platforms supporting
    Kubernetes and Kubeflow, and check back frequently for updates as we expand its
    coverage and features.


    # Driving Data Science Innovation with Kubernetes: Volvo Cars'' Journey


    Sweden-based Volvo Cars is a luxury automobile manufacturer whose brand has long
    been associated with safety and innovation. The company''s Consumer Digital group
    is responsible for a variety of products that aim to enhance the owner experience,
    including the Volvo On Call app, which offers features like roadside assistance,
    remote climate control, and the ability to lock and unlock owners'' cars from
    a distance.


    Data scientists in the Consumer Digital group use machine learning to both deliver
    end-user features, like search and recommendations, as well as to better understand
    how their products are being used.


    The group''s data scientists began using Kubernetes to support their workloads
    in 2018, when they needed a way to automate data acquisition, transformation,
    and reporting pipelines in support of a high-profile collaboration with Amazon
    to allow Volvo owners to receive in-trunk deliveries. The team wanted to build
    these pipelines using Jupyter Notebooks, and found no off-the-shelf tools at the
    company that let them easily do this.'
  - '[PAGE 23]


    Inspired by work done at Netflix⁶, Leonard Aukea, senior data scientist and tech
    lead for the company’s data science platform, set out to build a notebook-centric
    data science workflow for his team.


    The Netflix system, though container-based, used that company’s homegrown container
    orchestration system. At Volvo, however, Kubernetes was already gaining traction
    to support containerized workloads. With the help of a DevOps colleague and considerable
    research, Leonard was able to get a Kubernetes cluster up and running for data
    science workloads.


    The team’s first step was to set up the Apache Airflow workflow management system
