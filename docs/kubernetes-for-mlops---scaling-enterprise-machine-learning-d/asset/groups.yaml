    # Getting Started


    Meeting the infrastructure needs of machine and deep learning development represents
    a significant challenge for organizations moving beyond one-off ML projects to
    scaling the use of AI more broadly in the enterprise.


    Fortunately, enterprises starting down this path need not start from scratch.
    The pairing of container technologies and Kubernetes addresses many of the key
    infrastructure challenges faced by organizations seeking to industrialize their
    use of machine learning. Together, they provide a means for delivering scalable
    data management and automation, the efficient utilization of resources, and an
    effective abstraction between the concerns of data scientists and MLEs and the
    needs of those providing the infrastructure upon which they depend.


    In addition to supplying many of the features required of a robust machine learning
    infrastructure platform right out of the box, the open source Kubernetes project--with
    its broad adoption, active community, plentiful third-party tools ecosystem, and
    multiple commercial support options--also checks the most important boxes for
    executives and business decision-makers investing in a platform for future growth.'
