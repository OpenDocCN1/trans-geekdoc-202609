    While working with containers and containerized workloads may be a new skill for
    many data scientists, these tools will be familiar to machine learning engineers
    exposed to modern software development practices.


    Custom and third-party user interfaces, command-line tools, or integration with
    source code repositories can simplify creating and managing containers for end
    users. Because Kubernetes is workload independent, once users are familiar with
    the tools required to work with their Kubernetes environment, they can apply these
    tools across a wide range of projects.


    While introducing its own set of tools, the use of containers to facilitate data
    acquisition, experiment management and model deployment ensures that the correct
    and consistent dependencies are in place wherever jobs are run—whether on the
    developer laptop, training environment, or production cluster. This provides the
    valuable benefit of shielding those workloads from the complexity of the underlying
    technology stack, while supporting a wide variety of runtime configurations.


    Kubernetes also helps support and enforce a separation of concerns, giving end-users
    control over defining their workloads and administrators control over the properties
    and configuration of the infrastructure.


    # ## Unifying the ML workflow


    For all its benefits, Kubernetes alone won''t unify the end-to-end machine learning
    process. It will go a long way, however, in doing so for much of the software
    and hardware infrastructure that supports machine learning, and, in achieving
    that, it provides a strong platform for tools that go even further.


    # ## MLOps on Kubernetes with Kubeflow


    Kubeflow is an open source project designed to make machine learning workflows
    on Kubernetes simple, portable and scalable. Kubeflow is sponsored by Google and
    inspired by TensorFlow Extended, or TFX, the company''s internal machine learning
    platform.


    Originally intended to simply allow TensorFlow users to run training jobs on their
    Kubernetes clusters, the project now integrates a broad set of tools in support
    of many steps in an end-to-end machine learning process.


    Kubeflow includes components for:


    +   - **Launching Jupyter Notebooks.** Kubeflow includes support for setting up
    Jupyter notebook servers and creating and managing notebooks. Notebooks launched
    via Kubeflow are integrated with the authentication and access control policies
    an organization has established with its Kubernetes deployment, are easier to
    share across the organization, can help organizations standardize notebook images,
    and can readily take advantage of the compute capacity and other features available
    in the Kubernetes environment.'
  - '[PAGE 20]


    +   **Building ML Pipelines**. Kubeflow Pipelines is a platform for building and
    deploying complex, repeatable ML workflows on Kubernetes. Pipelines themselves
    consist of a graph detailing the relationships between steps in a workflow. The
    workflow steps themselves are called components, and are provided by the user
    as Docker containers. Pipelines allow users to package up the various data access
    and transformation, model training, and model evaluation steps that make up an
    experiment, simplifying experimentation and re-use.


    +   **Training Models**. Kubeflow provides a variety of Kubernetes Operators allowing
    users to easily create and manage training jobs for ML frameworks like TensorFlow,
    PyTorch, MXNet, XGBoost. In addition to the distributed training support provided
    by these frameworks, it also supports MPI-based distributed training through the
    MPI Operator.


    +   **Tracking Experiment Metadata**. The Kubeflow Metadata project provides a
    Python SDK for tracking and managing information about the executions (runs),
    models, datasets, and other artifacts generated during machine learning. It also
    provides a UI for viewing a list of logged artifacts and their details.


    +   **Hyperparameter Tuning**. Tuning model hyperparameters is an important element
    of optimizing model performance and accuracy, yet manually adjusting hyperparameters
    during experimentation is tedious. Kubeflow includes Katib, an open-source hyperparameter
    tuning project inspired by Google’s internal black-box optimization service, Vizier.
    Katib is framework agnostic and deploys optimization tasks as Kubernetes pods.


    +   **Serving Models**. Users may choose from two model serving systems within
    Kubeflow—KFServing and Seldon Core—as well as any of several standalone model
    serving systems. These options support a wide variety of ML frameworks, and offer
    features supporting various strategies for model rollout, scaling, logging, and
    analytics.


