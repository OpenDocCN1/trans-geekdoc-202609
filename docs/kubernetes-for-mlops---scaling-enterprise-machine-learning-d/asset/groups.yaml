    现在是开始学习 Kubernetes 和 MLOps 的绝佳时机。专注于 ML/AI 的 Kubernetes 用户社区规模庞大、不断增长且友好；该平台和工具可用于生产工作负载并快速成熟；而且拥有所需技术栈经验的人才池也在不断扩大。（同样，反之亦然，你在帮助组织扩展其
    MLOps 平台时学到的技能具有可迁移性，并在市场上受到重视。）


    尽管功能强大，但 Kubernetes 带来的一定复杂性对于小型数据科学团队来说可能具有挑战性。它最适合那些规模、资源和需求足以证明投资合理性的组织，不仅要投资构建用于数据科学的集中式平台，还要投资组建专门的支持团队。


    如今，采用 Kubernetes 进行机器学习和 AI 的组织可以从众多选项中受益，以帮助缓解其复杂性。MLOps 堆栈的每一层——从服务器、网络和存储等物理基础设施；到
    Kubernetes 控制平面；再到提供流水线和实验等抽象的 MLOps 软件——都可以使用现成组件在本地实现，也可以从各供应商处获取为完全托管的服务。


    与任何新技术一样，最佳行动方案是研究并了解你的需求和选项，然后从小处着手，立足当前需求，同时着眼未来。你对 Kubernetes 的探索可以从在笔记本电脑或云端少量机器上运行的“集群”开始，让你亲身体验和领会它为机器学习工作负载带来的价值。从那里开始，你可以根据自己的经验、需求和资源进行扩展。


    一路顺风。


    ## HPE ML Ops 与 Intel：携手交付企业级大规模机器学习


    惠普企业（Hewlett Packard Enterprise）帮助大型企业克服在整个组织中部署和运营 AI/ML 所面临的障碍。HPE ML Ops 为
    ML 生命周期带来了类似 DevOps 的速度和敏捷性。HPE ML Ops 解决方案支持 ML 生命周期的每个阶段——数据准备、模型构建、模型训练、模型部署、协作和监控。HPE
    ML Ops 是一个端到端的数据科学解决方案，具有在本地、多个公有云或混合模式下运行的灵活性，使客户能够针对各种用例响应动态业务需求。


    ![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_26_0.png)


    ### HPE ML Ops 提供：


    | 模型构建 | 预打包的自助式沙箱环境 |

    | :--- | :--- |

    | 模型训练 | 可安全访问大数据的可扩展训练环境 |

    | 模型部署 | 灵活、可扩展的端点部署 |

    | 模型监控 | 端到端可见性，用于跟踪、衡量和报告 ML 管道中的模型性能 |

    | 协作 | 使用代码、模型和项目仓库启用 CI/CD 工作流 |

    | 安全与控制 | 与企业身份验证机制集成的安全多租户 |

    | 混合部署 | 在本地、公有云或混合模式下部署 |


    在 hpe.com/info/MLOps 上了解更多信息。


    HPE 解决方案利用最新的 Intel® 技术，在已知且可信赖的基础设施上交付扩展企业机器学习工作负载所需的性能。


    ### Intel 创新包括：


    - 经验证的世界一流第二代 Intel® Xeon® 可扩展处理器为各种分析和其他企业应用提供可扩展性能。该处理器配备 Intel® Optane™ 持久内存
    (PMem)，这种强大的组合在靠近 CPU 的位置提供了更大的内存容量，以支持内存中工作负载，同时还具有原生持久性，可实现更高的弹性和生产力。

    - Intel® Deep Learning Boost 为高级分析和 AI 工作负载带来了全新的嵌入式性能加速，与上一代相比，推理工作负载的性能最高可提升
    30 倍，为未来分析和 AI 能力的演进奠定了基础。

    - 在为 Kubernetes 和 Kubeflow 做贡献方面有着良好记录，包括支持 AVX 指令集特性发现、增强 Kubernetes 调度框架、贡献
    CRI 资源管理器，以及开发 Kubernetes Topology Manager（可增强对高性能非统一内存访问 (NUMA) 节点的支持）。


    JD 提供了一个示例，展示了当 Intel 创新大规模交付时可以实现什么。JD.com 是中国最大的零售商，其超大规模运营由其自身内部需求以及云计算和 AI
    客户的需求驱动。该公司利用机器学习和 AI 支持多种零售用例，包括广告、仓库自动化和机器人、无人机配送、基于面部识别的支付以及个性化营销。


    2016 年，JD.com 开始开发 JDOS，这是其定制和优化的 Kubernetes 版本，如今支持各种工作负载和应用程序。该公司运行着全球最大的生产
    Kubernetes 集群，拥有超过 20,000 个节点。


    Intel 与 JD 紧密合作，优化其大数据和机器学习框架及工具包，例如 Kubernetes 上的 Apache Spark、TensorFlow 等，这些框架和工具包通过单一的基于
    Kubernetes 的架构向用户暴露，JD 称该架构为 Moonshot。


    ## MOONSHOT 架构


    ![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_27_0.png)


    Intel 与 JD 合作，定制了下一代 Intel Xeon 可扩展处理器的版本，以支持 JD 独特的 JD Cloud 和电子商务工作负载。除了 CPU
    之外，JD 还采用了其他 Intel 创新，例如 Intel Optane DC SSD，并计划采用即将推出的 Intel Optane DC Persistent
    Memory——这是一种新型存储技术，提供高容量、高性价比和持久性的前所未有的组合。


    这些定制在分析和 AI 工作负载上提供了显著的性能提升，从而帮助 JD 区分其云服务产品、个性化网上购物体验并提高供应链效率。


    ## 关于 TWIML


    机器学习和人工智能正在戏剧性地改变企业运营和人们生活的方式。通过我们的出版物、播客和社区，TWIML 将 ML 和 AI 领域的领先思想和人才带给广大且有影响力的数据科学家、工程师以及精通技术的商业和
    IT 领导者社区。


    TWIML 源于我们在 2016 年推出的播客 This Week in Machine Learning & AI，起初反响虽小但热情高涨。时光来到 2020
    年，TWIML AI 播客如今已成为该领域的领先声音，拥有超过八百万次下载量和庞大且活跃的社区追随者。我们的产品如今包括像本报告这样的研究报告，以及 **线上聚会和学习小组**、**会议**和各种
    **教育内容**。


    TWIML AI 播客始终是我们使命的核心。通过分享和放大广泛而多样的机器学习和 AI 研究人员、实践者和创新者的声音，我们的项目有助于使 ML 和 AI
    更加易于使用，并改善我们的受众及其社区的生活。


    TWIML 由 Sam Charrington 创立，他是备受追捧的行业分析师、演讲者、评论员和思想领袖。Sam 的研究侧重于机器学习和 AI 的商业应用，将基于
    AI 的产品推向市场，以及支持 AI 和实现 AI 的技术平台。


