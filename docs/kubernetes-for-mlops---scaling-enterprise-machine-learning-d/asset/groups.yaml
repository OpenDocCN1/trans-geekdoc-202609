  - '[PAGE 21]


    In addition, Kubeflow provides a central dashboard through which users can access
    and manage the various components of a Kubeflow deployment, support for multi-tenancy
    and multi-user isolation, and through Kubeflow Fairing, the ability to more easily
    build, train, and deploy training jobs across a hybrid cloud environment directly
    from a Jupyter notebook.


    Kubeflow exposes Kubernetes concepts like namespaces and pods to users and requires
    that they use command-line tools to perform tasks like configuring and submitting
    jobs. As a result, it is more geared towards users with engineering skill sets,
    rather than those of the traditional data scientist. The requisite job configuration
    files are not altogether unfamiliar, however, with their configuration parameters
    resembling those of other distributed tools they may be familiar with, like Apache
    Spark.


    Furthermore, the project is making progress in this regard, with the dashboard
    and pipeline visualizations representing solid progress. Some users choose to
    build custom user interfaces for their data scientists that aim to further abstract
    the underlying Kubeflow and Kubernetes tooling.


    Using Kubeflow allows users to save time integrating support for common ML and
    DL components. In the past, Kubeflow''s integrations felt rather shallow, and
    the project felt a bit like a hodgepodge of third-party open source offerings.
    To its credit, the project is now a much more highly curated and unified offering.


    That said, Kubeflow is still a collection of components under the covers. Though
    the Kubeflow core has attained GA status, the overall project remains immature,
    with many of the aforementioned components still in beta. This state of affairs
    may prove problematic for some organizations, who value the stability and predictability
    of more mature and tightly integrated offerings. Further, some enterprise IT organizations
    might find that Kubeflow lacks an adequate security and governance framework that
    spans workloads, data and infrastructure, though progress is being made in this
    regard.


    On the topic of governance, though a different kind, there are concerns in some
    circles with Kubeflow''s lack of independent governance. While the Kubernetes
    project is overseen by the CNCF, which provides for a certain level of transparency
    and community-driven governance, Kubeflow, remains under Google''s control. This
    creates some uncertainty about the future direction of the project, though the
    project does have a broad base of contributors and advocates.'
