    # # Preface to the Second Edition


    In December 2018, I raced to complete the first edition of this ebook in time
    for Kubecon Seattle. After weeks of research, interviews, and writing, I was excited
    to unveil a timely and needed resource for a small but growing community.


    I made the deadline, but as I sat through the conference''s keynotes and sessions,
    listening to the many new announcements relating to machine learning (ML) and
    artificial intelligence (AI) workloads on Kubernetes, my heart sank. While I knew
    the ebook would prove a valuable resource to readers, I knew too that it would
    soon need an update.


    Since that time, the use of Kubernetes to support an organization''s ML/AI projects
    has evolved from an obscure idea to one being explored and pursued by many organizations
    facing the challenge of getting ML models into production and scaling them.


    As interest in running ML/AI workloads atop Kubernetes has grown, so has the surrounding
    ecosystem. When the first edition was written, Kubeflow was yet in its infancy,
    having just seen its 0.3 release.1 At the time, the Google-founded project was
    far from production ready, and still fairly narrowly focused on running TensorFlow
    jobs on Kubernetes.


    Kubeflow has since published a general availability (GA) release of the project,
    and now aspires to support a wide variety of end-to-end machine learning workflows
    on Kubernetes. The announcement of version 1.0 of the project in March of 2020
    was accompanied by testimonials from companies such as US Bank, Chase Commercial
    Bank, and Volvo Cars. (I''m excited to include the first public profile of Volvo''s
    journey in this book.)


    The broader Kubernetes ML/AI ecosystem has exploded as well, with a wide variety
    of open source and commercial offerings building upon the foundation offered by
    Kubernetes. We''ll mention a few of these in this book, but with so many services
    and offerings to keep track of, and with offerings evolving so quickly, we''ve
    decided to move our directory of open source and commercial tools to a new home:
    the online TWIML AI Solutions Guide.


    Following the evolution of this space has been a fascinating journey, and I''m
    pleased to bring you the second edition of this ebook. My hope is that the information
    shared here will help you better understand this promising direction for building,
    deploying, and scaling machine learning models in your organization, and ultimately
    contribute to your organization''s own innovative use of machine learning and
    AI.


    Thanks for reading!


    Sam'
