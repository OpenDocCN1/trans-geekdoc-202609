    Ready access to scalable storage is the foundation upon which users can construct
    automated and repeatable data processing pipelines. This ensures the ability to
    reliably deliver properly transformed data to models, without manual intervention,
    and also facilitates the reuse of transformed data and processed features across
    projects.


    # Driving efficient resource use


    For resource-intensive workloads like machine learning, users face the constant
    conundrum of over-allocation or under-utilization. That is, they must manage the
    fine balance between either having more resources than is needed at any particular
    point in time, or not enough.


    Kubernetes offers two solutions to this problem. The first is multi-tenancy. A
    single physical Kubernetes cluster can be partitioned into multiple virtual clusters
    using Kubernetes'' **namespaces** feature. This allows a single cluster to easily
    support multiple teams, projects, or functions.


    Each namespace can be configured with its own resource quotas and access control
    policies, making it possible to specify the actions a user can perform and the
    resources they have access to. Namespace-level configuration allows resources
    like storage to be configured on a per-team, -project, or -function basis.


    Multi-tenancy features allow many users to share the same physical resources,
    with the aggregate usage having less variance and requiring less over-provisioning.
    Another solution Kubernetes offers to the resource efficiency problem is auto-scaling,
    of which there are two types.


    Workload (or pod) autoscaling which is the ability to scale up the number of pods
    running a given workload as needed. This works with multi-tenancy to take full
    advantage of the resources available in a given Kubernetes cluster


    Cluster autoscaling is the ability to scale up or down the number of nodes in
    the entire cluster without disrupting the cluster or any of its applications or
    users. This is helpful, but of limited utility, when you''re running the cluster
    on physical nodes in your own datacenter. When you''re running Kubernetes on virtual
    servers in the cloud, though, this allows you to continually right-size your cluster
    so you''re only paying for the resources you need at any given time.


    Because Kubernetes-enabled workloads can be run on any Kubernetes cluster in any
    location without any changes to the application''s code, users can move applications
    between deployment environments with relative ease. In theory a single Kubernetes
    cluster can span clouds and/or on-premises data centers, but this is difficult
    to implement and not recommended.


    # Hiding complexity


    Containers provide an efficient way of packaging machine learning workloads that
    is independent of language or framework. Kubernetes builds on this to provide
    a reliable abstraction layer for managing containerized workloads and provides
    the necessary configuration options, APIs, and tools to manipulate these workloads
    declaratively.'
