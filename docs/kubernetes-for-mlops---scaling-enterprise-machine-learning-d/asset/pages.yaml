    # Driving Data Science Innovation with Kubernetes: Volvo Cars'' Journey


    Sweden-based Volvo Cars is a luxury automobile manufacturer whose brand has long
    been associated with safety and innovation. The company''s Consumer Digital group
    is responsible for a variety of products that aim to enhance the owner experience,
    including the Volvo On Call app, which offers features like roadside assistance,
    remote climate control, and the ability to lock and unlock owners'' cars from
    a distance.


    Data scientists in the Consumer Digital group use machine learning to both deliver
    end-user features, like search and recommendations, as well as to better understand
    how their products are being used.


    The group''s data scientists began using Kubernetes to support their workloads
    in 2018, when they needed a way to automate data acquisition, transformation,
    and reporting pipelines in support of a high-profile collaboration with Amazon
    to allow Volvo owners to receive in-trunk deliveries. The team wanted to build
    these pipelines using Jupyter Notebooks, and found no off-the-shelf tools at the
    company that let them easily do this.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Inspired by work done at Netflix⁶, Leonard Aukea, senior data scientist and
    tech lead for the company’s data science platform, set out to build a notebook-centric
    data science workflow for his team.


    The Netflix system, though container-based, used that company’s homegrown container
    orchestration system. At Volvo, however, Kubernetes was already gaining traction
    to support containerized workloads. With the help of a DevOps colleague and considerable
    research, Leonard was able to get a Kubernetes cluster up and running for data
    science workloads.


    The team’s first step was to set up the Apache Airflow workflow management system
    on Kubernetes, and use this in conjunction with the Netflix Papermill tool to
    run notebooks as steps of a pipeline. Pipeline outputs were fed into Nteract,
    another Netflix tool, providing a convenient, notebook-based dashboard.


    Automated pipelines were a big win for Leonard’s team, and other teams soon reached
    out for help with their own workloads. It was then that the limitations of the
    team’s initial approach became apparent.


    One challenge was that the elements of the system weren’t tightly integrated.
    Users had to visit several different internal web sites to get anything done.


    "Here, you visualized the notebook; here, you specify the DAG in this GitHub repository;
    here, you go to the Airflow UI; and then here, you go to JupyterHub. It became
    a mess. It was hard to explain... and it didn’t scale in the way that we wanted."


    After obtaining the go-ahead to put a more enterprise-ready solution in place,
    Leonard eventually found the Kubeflow project.


    The team at Volvo appreciated that Kubeflow is Kubernetes-native, so everything
    fit together under a unified user interface and set of APIs.


    Kubeflow "glues all of these services together and gives a unified interface that
    a user could go in and enter the platform and do their job in an easier fashion."


    "Some things were working quite nicely... in terms of setup, and then moving from
    one version to another, and just reliability of [the] service."


    That didn’t mean that everything was perfect, however.


    The team found Kubeflow "hard to configure because you need to configure all of
    these individual services, dig into the manifests that you’re actually deploying,
    and [deploy them using the] kcftl tool. I’m not a hundred percent a fan of it...
    You have to spend significant [effort] in order to make it work."


    The integrated nature of the tool put more responsibility on Leonard and his team
    when it came to support.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'They often found themselves needing to "dig deeper into the individual applications
    and look at source code, for example, where documentation is not centralized.
    [...] It''s also not what you would traditionally expect from a service in that
    sense."


    As of this writing, Leonard''s data science platforms team has Kubeflow running
    in beta with several teams on board. Adoption has been relatively smooth, though
    the team acknowledges a steep learning curve. The use of Docker containers and
    Kubeflow''s tooling is more natural for the Python data scientists they support
    than for the company''s R-based data scientists.


    Ultimately, the team sees in Kubeflow a way to help the company''s data scientists
    move more quickly and be more self-sufficient. They want data science teams that
    deploy models to be responsible for them throughout their lifecycle, but also
    to have access to the tools and training and best practices that are needed for
    them to be successful.


    The platform team is currently gathering statistics to compare user productivity
    on the new platform with previous results.


    "I don''t have actual numbers on it, but what I hear from other teams and also
    [my own use], it''s way more effective when you get the hang of it."


    "I''m hoping that we have a lot more models in production that would otherwise
    go to waste or have been laying stagnant for a while in the organization because
    [a team] has not had the available tooling or the support in order to get their
    model to production. This could be very valuable for Volvo Cars as a company."


    # Getting Started


    Meeting the infrastructure needs of machine and deep learning development represents
    a significant challenge for organizations moving beyond one-off ML projects to
    scaling the use of AI more broadly in the enterprise.


    Fortunately, enterprises starting down this path need not start from scratch.
    The pairing of container technologies and Kubernetes addresses many of the key
    infrastructure challenges faced by organizations seeking to industrialize their
    use of machine learning. Together, they provide a means for delivering scalable
    data management and automation, the efficient utilization of resources, and an
    effective abstraction between the concerns of data scientists and MLEs and the
    needs of those providing the infrastructure upon which they depend.


    In addition to supplying many of the features required of a robust machine learning
    infrastructure platform right out of the box, the open source Kubernetes project--with
    its broad adoption, active community, plentiful third-party tools ecosystem, and
    multiple commercial support options--also checks the most important boxes for
    executives and business decision-makers investing in a platform for future growth.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'This is a great time to be getting started with Kubernetes and MLOps. The community
    of ML/ AI-focused Kubernetes users is large, growing, and welcoming; the platform
    and tools are viable for production workloads and maturing quickly; and there
    is a growing pool of talent with experience in the requisite tech stack. (And,
    conversely, the skills you learn helping your organization scale its MLOps platform
    are portable and valued in the marketplace.)


    While powerful, Kubernetes brings with it a degree of complexity that can be challenging
    for small data science teams. It is most appropriate for those organizations whose
    scale, resources, and requirements justify the investment not only in a centralized
    platform for data science but also a dedicated team to support it.


    Today, organizations adopting Kubernetes for machine learning and AI have the
    benefit of many options to help mitigate its complexity. Each of the layers of
    the MLOps stack—from the physical infrastructure such as servers, network and
    storage; to the Kubernetes control plane; to MLOps software providing abstractions
    such as pipelines and experiments—can be implemented on-premises using off-the-shelf
    components or can be obtained as a fully managed service by various vendors.


    As with any new technology, the best course of action is to research and understand
    your requirements and options and start small, with your feet grounded firmly
    in your current needs but with an eye towards the future. Your exploration of
    Kubernetes can start with a "cluster" running on your laptop or a handful of machines
    in the cloud, allowing you to experience and appreciate firsthand what it brings
    to the table for your machine learning workloads. From there you can grow as your
    experience, needs, and resources allow.


    Godspeed.'
  merge: -1
  img_proc: true
