- pgno: 17
  md: '> "Deep learning is an empirical science, and the quality of a group''s infrastructure
    is a multiplier on progress. Fortunately, today''s open-source ecosystem makes
    it possible for anyone to build great deep learning infrastructure."

    > OpenAI


    # # Kubernetes for Machine and Deep Learning


    While the challenges faced by developers building traditional software are similar
    to those faced by data scientists and ML engineers, they aren''t the same. In
    many ways, those faced by the latter are greater, significantly exacerbated by
    the highly iterative nature of the machine learning workflow.


    Still, the capabilities provided by containers and Kubernetes can help organizations
    address the challenges presented by the machine learning process.


    | Simplifying Data Management | Driving Efficient Resource Use | Hiding Complexity
    |

    | :--- | :--- | :--- |

    | Kubernetes provides connectors for diverse data sources and manages volume lifecycle
    Data workflow & pipeline abstractions (3rd party) allow complex data transformations
    to be executed across cluster Data fabrics (3rd party) extend scalable, multi-format
    storage to cluster | Kubernetes provides elasticity, allowing cluster and workloads
    to be easily scaled up/down Multitenancy allows multiple teams to share cluster
    Users can deploy workloads on-demand via CLI, API without IT intervention Users
    and tools can programmatically deploy and control workloads | Containers provide
    a convenient format for packaging workloads and declaring dependencies Kubernetes
    abstracts infrastructure, allowing users to think of cluster as unit of compute
    |


    Figure 5. Containers and Kubernetes address major ML/DL challenges


    # ## Data acquisition and preparation


    By providing a mechanism for connecting storage to containerized workloads, the
    Kubernetes CSI enables support for a wide variety of stateful applications, including
    machine and deep learning. CSI drivers provide direct access to many different
    file, object, and block storage systems, as well as data fabric products which
    provide unified access to data stored in a variety of enterprise systems.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Ready access to scalable storage is the foundation upon which users can construct
    automated and repeatable data processing pipelines. This ensures the ability to
    reliably deliver properly transformed data to models, without manual intervention,
    and also facilitates the reuse of transformed data and processed features across
    projects.


    # Driving efficient resource use


    For resource-intensive workloads like machine learning, users face the constant
    conundrum of over-allocation or under-utilization. That is, they must manage the
    fine balance between either having more resources than is needed at any particular
    point in time, or not enough.


    Kubernetes offers two solutions to this problem. The first is multi-tenancy. A
    single physical Kubernetes cluster can be partitioned into multiple virtual clusters
    using Kubernetes'' **namespaces** feature. This allows a single cluster to easily
    support multiple teams, projects, or functions.


    Each namespace can be configured with its own resource quotas and access control
    policies, making it possible to specify the actions a user can perform and the
    resources they have access to. Namespace-level configuration allows resources
    like storage to be configured on a per-team, -project, or -function basis.


    Multi-tenancy features allow many users to share the same physical resources,
    with the aggregate usage having less variance and requiring less over-provisioning.
    Another solution Kubernetes offers to the resource efficiency problem is auto-scaling,
    of which there are two types.


    Workload (or pod) autoscaling which is the ability to scale up the number of pods
    running a given workload as needed. This works with multi-tenancy to take full
    advantage of the resources available in a given Kubernetes cluster


    Cluster autoscaling is the ability to scale up or down the number of nodes in
    the entire cluster without disrupting the cluster or any of its applications or
    users. This is helpful, but of limited utility, when you''re running the cluster
    on physical nodes in your own datacenter. When you''re running Kubernetes on virtual
    servers in the cloud, though, this allows you to continually right-size your cluster
    so you''re only paying for the resources you need at any given time.


    Because Kubernetes-enabled workloads can be run on any Kubernetes cluster in any
    location without any changes to the application''s code, users can move applications
    between deployment environments with relative ease. In theory a single Kubernetes
    cluster can span clouds and/or on-premises data centers, but this is difficult
    to implement and not recommended.


    # Hiding complexity


    Containers provide an efficient way of packaging machine learning workloads that
    is independent of language or framework. Kubernetes builds on this to provide
    a reliable abstraction layer for managing containerized workloads and provides
    the necessary configuration options, APIs, and tools to manipulate these workloads
    declaratively.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'While working with containers and containerized workloads may be a new skill
    for many data scientists, these tools will be familiar to machine learning engineers
    exposed to modern software development practices.


    Custom and third-party user interfaces, command-line tools, or integration with
    source code repositories can simplify creating and managing containers for end
    users. Because Kubernetes is workload independent, once users are familiar with
    the tools required to work with their Kubernetes environment, they can apply these
    tools across a wide range of projects.


    While introducing its own set of tools, the use of containers to facilitate data
    acquisition, experiment management and model deployment ensures that the correct
    and consistent dependencies are in place wherever jobs are run—whether on the
    developer laptop, training environment, or production cluster. This provides the
    valuable benefit of shielding those workloads from the complexity of the underlying
    technology stack, while supporting a wide variety of runtime configurations.


    Kubernetes also helps support and enforce a separation of concerns, giving end-users
    control over defining their workloads and administrators control over the properties
    and configuration of the infrastructure.


    # ## Unifying the ML workflow


    For all its benefits, Kubernetes alone won''t unify the end-to-end machine learning
    process. It will go a long way, however, in doing so for much of the software
    and hardware infrastructure that supports machine learning, and, in achieving
    that, it provides a strong platform for tools that go even further.


    # ## MLOps on Kubernetes with Kubeflow


    Kubeflow is an open source project designed to make machine learning workflows
    on Kubernetes simple, portable and scalable. Kubeflow is sponsored by Google and
    inspired by TensorFlow Extended, or TFX, the company''s internal machine learning
    platform.


    Originally intended to simply allow TensorFlow users to run training jobs on their
    Kubernetes clusters, the project now integrates a broad set of tools in support
    of many steps in an end-to-end machine learning process.


    Kubeflow includes components for:


    +   - **Launching Jupyter Notebooks.** Kubeflow includes support for setting up
    Jupyter notebook servers and creating and managing notebooks. Notebooks launched
    via Kubeflow are integrated with the authentication and access control policies
    an organization has established with its Kubernetes deployment, are easier to
    share across the organization, can help organizations standardize notebook images,
    and can readily take advantage of the compute capacity and other features available
    in the Kubernetes environment.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   **Building ML Pipelines**. Kubeflow Pipelines is a platform for building
    and deploying complex, repeatable ML workflows on Kubernetes. Pipelines themselves
    consist of a graph detailing the relationships between steps in a workflow. The
    workflow steps themselves are called components, and are provided by the user
    as Docker containers. Pipelines allow users to package up the various data access
    and transformation, model training, and model evaluation steps that make up an
    experiment, simplifying experimentation and re-use.


    +   **Training Models**. Kubeflow provides a variety of Kubernetes Operators allowing
    users to easily create and manage training jobs for ML frameworks like TensorFlow,
    PyTorch, MXNet, XGBoost. In addition to the distributed training support provided
    by these frameworks, it also supports MPI-based distributed training through the
    MPI Operator.


    +   **Tracking Experiment Metadata**. The Kubeflow Metadata project provides a
    Python SDK for tracking and managing information about the executions (runs),
    models, datasets, and other artifacts generated during machine learning. It also
    provides a UI for viewing a list of logged artifacts and their details.


    +   **Hyperparameter Tuning**. Tuning model hyperparameters is an important element
    of optimizing model performance and accuracy, yet manually adjusting hyperparameters
    during experimentation is tedious. Kubeflow includes Katib, an open-source hyperparameter
    tuning project inspired by Google’s internal black-box optimization service, Vizier.
    Katib is framework agnostic and deploys optimization tasks as Kubernetes pods.


    +   **Serving Models**. Users may choose from two model serving systems within
    Kubeflow—KFServing and Seldon Core—as well as any of several standalone model
    serving systems. These options support a wide variety of ML frameworks, and offer
    features supporting various strategies for model rollout, scaling, logging, and
    analytics.


    ![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_20_0.png)


    Figure 6. Kubeflow builds on top of Kubernetes to address key challenges in the
    ML workflow'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'In addition, Kubeflow provides a central dashboard through which users can
    access and manage the various components of a Kubeflow deployment, support for
    multi-tenancy and multi-user isolation, and through Kubeflow Fairing, the ability
    to more easily build, train, and deploy training jobs across a hybrid cloud environment
    directly from a Jupyter notebook.


    Kubeflow exposes Kubernetes concepts like namespaces and pods to users and requires
    that they use command-line tools to perform tasks like configuring and submitting
    jobs. As a result, it is more geared towards users with engineering skill sets,
    rather than those of the traditional data scientist. The requisite job configuration
    files are not altogether unfamiliar, however, with their configuration parameters
    resembling those of other distributed tools they may be familiar with, like Apache
    Spark.


    Furthermore, the project is making progress in this regard, with the dashboard
    and pipeline visualizations representing solid progress. Some users choose to
    build custom user interfaces for their data scientists that aim to further abstract
    the underlying Kubeflow and Kubernetes tooling.


    Using Kubeflow allows users to save time integrating support for common ML and
    DL components. In the past, Kubeflow''s integrations felt rather shallow, and
    the project felt a bit like a hodgepodge of third-party open source offerings.
    To its credit, the project is now a much more highly curated and unified offering.


    That said, Kubeflow is still a collection of components under the covers. Though
    the Kubeflow core has attained GA status, the overall project remains immature,
    with many of the aforementioned components still in beta. This state of affairs
    may prove problematic for some organizations, who value the stability and predictability
    of more mature and tightly integrated offerings. Further, some enterprise IT organizations
    might find that Kubeflow lacks an adequate security and governance framework that
    spans workloads, data and infrastructure, though progress is being made in this
    regard.


    On the topic of governance, though a different kind, there are concerns in some
    circles with Kubeflow''s lack of independent governance. While the Kubernetes
    project is overseen by the CNCF, which provides for a certain level of transparency
    and community-driven governance, Kubeflow, remains under Google''s control. This
    creates some uncertainty about the future direction of the project, though the
    project does have a broad base of contributors and advocates.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# The Kubernetes MLOps Ecosystem


    Kubeflow is one of the many available offerings that take advantage of Kubernetes
    to deliver MLOps capabilities. These offerings range in scope from narrow tools
    that aim to address particular pain-points experienced by data scientists, to
    end-to-end platforms that seek to provide comprehensive support for the ML workflow.
    Licensing and delivery models vary as well, including open source projects, commercially
    supported software products, and cloud-based services.


    > One of the most important distinctions among the various tools available to
    help you build out your organization''s machine learning platform is whether the
    tool aims to be wide or deep. This distinction, and the interesting paradox that
    arises as a result, is explored in detail in TWIML''s The Definitive Guide to
