- pgno: 3
  md: '# # Preface to the Second Edition


    In December 2018, I raced to complete the first edition of this ebook in time
    for Kubecon Seattle. After weeks of research, interviews, and writing, I was excited
    to unveil a timely and needed resource for a small but growing community.


    I made the deadline, but as I sat through the conference''s keynotes and sessions,
    listening to the many new announcements relating to machine learning (ML) and
    artificial intelligence (AI) workloads on Kubernetes, my heart sank. While I knew
    the ebook would prove a valuable resource to readers, I knew too that it would
    soon need an update.


    Since that time, the use of Kubernetes to support an organization''s ML/AI projects
    has evolved from an obscure idea to one being explored and pursued by many organizations
    facing the challenge of getting ML models into production and scaling them.


    As interest in running ML/AI workloads atop Kubernetes has grown, so has the surrounding
    ecosystem. When the first edition was written, Kubeflow was yet in its infancy,
    having just seen its 0.3 release.1 At the time, the Google-founded project was
    far from production ready, and still fairly narrowly focused on running TensorFlow
    jobs on Kubernetes.


    Kubeflow has since published a general availability (GA) release of the project,
    and now aspires to support a wide variety of end-to-end machine learning workflows
    on Kubernetes. The announcement of version 1.0 of the project in March of 2020
    was accompanied by testimonials from companies such as US Bank, Chase Commercial
    Bank, and Volvo Cars. (I''m excited to include the first public profile of Volvo''s
    journey in this book.)


    The broader Kubernetes ML/AI ecosystem has exploded as well, with a wide variety
    of open source and commercial offerings building upon the foundation offered by
    Kubernetes. We''ll mention a few of these in this book, but with so many services
    and offerings to keep track of, and with offerings evolving so quickly, we''ve
    decided to move our directory of open source and commercial tools to a new home:
    the online TWIML AI Solutions Guide.


    Following the evolution of this space has been a fascinating journey, and I''m
    pleased to bring you the second edition of this ebook. My hope is that the information
    shared here will help you better understand this promising direction for building,
    deploying, and scaling machine learning models in your organization, and ultimately
    contribute to your organization''s own innovative use of machine learning and
    AI.


    Thanks for reading!


    Sam'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# Introduction


    Enterprise interest in machine learning and artificial intelligence continues
    to grow, with organizations dedicating increasingly large teams and resources
    to ML/AI projects. As businesses scale their investments, it becomes critical
    to build repeatable, efficient, and sustainable processes for model development
    and deployment.


    The move to drive more consistent and efficient processes in machine learning
    parallels efforts towards the same goals in software development. Whereas the
    latter has come to be called DevOps, the former is increasingly referred to as
    MLOps.


    While DevOps, and likewise MLOps, are principally about practices rather than
    technology, to the extent that those practices are focused on automation and repeatability,
    tools have been an important contributor to their rise. In particular, the advent
    of container technologies like Docker was a significant enabler of DevOps, allowing
    users to drive increased agility, efficiency, manageability, and scalability in
    their software development efforts.


    Containers remain a foundational technology for both DevOps and MLOps. Containers
    provide a core piece of functionality that allow us to run a given piece of code—whether
    a notebook, an experiment, or a deployed model—anywhere, without the “dependency
    hell” that plagues other methods of sharing software. But, additional technology
    is required to scale containers to support large teams, workloads, or applications.
    This technology is known as a container orchestration system, the most popular
    of which is Kubernetes.


    In this book we explore the role that Kubernetes plays in supporting MLOps:


    +   - Chapter 1 presents a high-level overview of the machine learning process
    and the challenges organizations tend to encounter when it comes time to scale
    it.

    +   - Chapter 2 elaborates on why supporting machine learning at scale is so difficult,
    and covers a few of the many challenges faced by data scientists and machine learning
    engineers in getting their models into production, at scale.

    +   - Chapter 3 provides an introduction to container technology and Kubernetes,
    and shows how they help address the challenges referenced earlier.

    +   - In chapter 4, we zoom in to discuss Kubernetes in more detail.

    +   - In chapter 5, we return to the ML workflow, and show how Kubernetes can
    help organizations overcome the various challenges it presents.

    +   - Chapters 6 and 7 look at the role of Kubeflow and other higher-level tools
    in delivering MLOps.

    +   - In chapter 8, we get an opportunity to sit in the passenger seat and ride
    along with Volvo Cars, an early Kubernetes and Kubeflow user, to learn from their
    experiences building a ML platform atop these technologies.

    +   - Chapter 8 offers some brief advice on how you can get started with your
    own project.'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'If you''re just getting started with MLOps, know that there''s no better time
    than the present to begin this journey. The user and practitioner communities
    are exploding, the practices and technology are maturing, and the support and
    educational resources are more plentiful and of higher quality with each passing
    day.


    # The Machine Learning Process


    Before we can discuss enabling and scaling the delivery of machine learning, we
    must understand the full scope of the machine learning process. While much of
    the industry dialogue around machine learning continues to be focused on modeling,
    the reality is that modeling is a small part of the process. This was poignantly
    illustrated in a 2015 paper2 by authors from Google, and remains true today.


    ![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_5_0.png)


    Figure 1. Illustration from Hidden Technical Debt in Machine Learning Systems
    paper. Machine learning models are represented by the small box labeled “ML Code”
    in the center of the diagram. The paper refers to the supporting infrastructure
    as “vast and complex.”


    In order for organizations to reap the rewards of their machine learning efforts
    and achieve any level of scale and efficiency, models must be developed within
    a repeatable process that accounts for the critical activities that precede and
    follow model development.


    When presented with a new problem to solve, data scientists will develop and run
    a series of experiments that take available data as input and aim to produce an
    acceptable model as output. Figure 2 presents a high-level view of the end-to-end
    ML workflow, representing the three major “steps” in the process—data acquisition
    and preparation, experiment management and model development, and model deployment
    and performance monitoring—as well as the iterative loops that connect them.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_6_0.png)


    # Data acquisition & preparation


    To build high quality models, data scientists and machine learning engineers must
    have access to large quantities of high-quality labeled training data. This data
    very rarely exists in a single place or in a form directly usable by data scientists.
    Rather, in the vast majority of cases, the training dataset must be built by data
    scientists, data engineers, machine learning engineers, and business domain experts
    working together.


    In the real world, as opposed to in academia or Kaggle competitions, the creation
    of training datasets usually involves combining data from multiple sources. For
    example, a data scientist building a product recommendation model might build
    the training dataset by joining data from web activity logs, search history, mobile
    interactions, product catalogs, and transactional systems.


    > While the specific use of labeled training datasets is characteristic of supervised
    learning, as opposed to unsupervised, self-supervised or reinforcement learning,
    the former remains the most popular type of machine learning in use today. While
    this book occasionally refers to labels and other supervised learning concepts,
    its key messages apply broadly.


    Once compiled, training data must then be prepared for model development. To do
    this, data scientists will apply a series of transformations to the raw data to
    cleanse and normalize it. Examples include removing corrupt records, filling in
    missing values, and correcting inconsistencies like differing representations
    for states or countries.


    Transformations may also be required to extract labels. For example, developing
    a model that predicts the likelihood of churn among customers will require a label
    indicating which of the customers in our transactional database are examples of
    churn. This can, in turn, require a complex query against the data warehouse that
    considers factors such as the products or services that we are basing the prediction
    on, the number of days without a transaction, the window in which we want to make
    predictions, and more.³'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'As a result of the organizational and technical complexity involved, the process
    of acquiring and preparing enterprise data can consume the vast majority of a
    data scientist''s effort on a given project—50 to 80 percent, according to some
    reports.4


    If not accounted for during planning or supported by appropriate processes and
    tools, data acquisition can consume all of the time and resources allocated for
    a project, leaving little available for the remaining steps in the machine learning
    process.


    # Experiment management and model development


    Experimentation is central to the machine learning process. During modeling, data
    scientists and machine learning engineers (MLEs) run a series of experiments to
    identify a robust predictive model. Typically, many models—possibly hundreds or
    even thousands—will be trained and evaluated in order to identify the techniques,
    architectures, learning algorithms, and parameters that work best for a particular
    problem.


    Feature engineering is the iterative process of creating the features and labels
    needed to train the model through a series of data transformations. Feature engineering
    is often performed in lockstep with model training, because the ability to identify
    helpful features can have a significant impact on the overall success of the modeling
    effort. That said, a fine line separates the preliminary data cleansing and normalization
    steps associated with data preparation from feature engineering.


    Simple examples of feature engineering include generating derived features (such
    as calculating an age from a birthdate) or converting categorical variables (such
    as transaction types) into one-hot encoded, or binary, vectors.


    With deep learning, features are usually straightforward because deep neural networks
    (DNNs) generate their own internal transformations. With traditional machine learning,
    feature engineering can be quite challenging and relies heavily on the creativity
    and experience of the data scientist and their understanding of the business domain
    or ability to effectively collaborate with domain experts.


    In addition, a variety of tools under the broad banner of “AutoML” are finding
    popular use to automate aspects of experimentation and model development. Offerings
    exist to automate feature engineering by creating and testing a wide variety of
    candidate features, identify the best machine learning or deep learning models
    (the latter referred to as neural architecture search), automatically tune or
    optimize model hyperparameters, and automate the compression of large DNNs so
    that they’re more amenable to mobile or edge deployment.


    Whether manually performed or automated, the various aspects of experimentation
    and model training can be quite computationally intensive, especially in the case
    of deep learning. Having ready access to the right infrastructure for each experiment,
    such as CPUs, GPUs, memory, etc.—whether locally or in the cloud—can significantly
    impact the speed and agility of the data science team during the model development
    phase of the process.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Model deployment


    Once a model has been developed, it must be deployed in order to be used. While
    deployed models can take many forms, typically the model is embedded directly
    into application code or put behind an API of some sort. HTTP-based (i.e. REST
    or gRPC) APIs are increasingly used so that developers can access model predictions
    as microservices.


    While model training might require large bursts of computing hardware over the
    course of several hours, days or weeks, model inference—making queries against
    models—can be even more computationally expensive than training over time. Each
    inference against a deployed model requires a small but significant amount of
    computing power. Unlike the demands of training, the computational burden of inference
    scales with the number of inferences made and continues for as long as the model
    is in production.


    > Or not so small in the case of some deep learning models. Google''s efforts
    to build its Tensor Processing Unit (TPU), a specialized chip for inference, began
    in 2013 when engineer Jeff Dean projected that if people were to use voice search
    for 3 minutes a day, meeting the inference demands of speech recognition would
    require Google data centers to double in capacity.


    Meeting the requirements of inference at scale is a classic systems engineering
    problem. Addressing issues like scalability, availability, latency, and cost are
    typically primary concerns. When mobile or edge deployment is required, additional
    considerations like processing cycles, memory, size, weight, and power consumption
    come into play.


    At a certain point, we often end up needing to turn to distributed systems to
    meet our scalability or performance goals. This of course brings along its own
    set of challenges and operational considerations. How do we get our model onto
    multiple machines and ensure consistency over time. How do we update to new models
    without taking our applications out of service? What happens when problems arise
    during an upgrade? How can we test new models on live traffic?


    Fortunately for those deploying models, much progress has been made addressing
    these questions for microservices and other software systems.


    # Model monitoring


    Once a model is put into production, it is important to monitor its ongoing performance.
    Machine learning models are perishable, meaning that the statistical distribution
    of the data a model sees in production will inevitably start to drift away from
    that seen during training. This will cause model performance to degrade, which
    can result in negative business outcomes such as lost sales or undetected fraudulent
    activity if not detected and addressed.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Production models should be instrumented so that the inputs to and results
    of each inference are logged, allowing usage to be reviewed and performance to
    be monitored on an ongoing basis. Owners of models experiencing degraded performance
    can use this information to take corrective action, such as retraining or re-tuning
    the model.


    Business or regulatory requirements may impose additional requirements dictating
    the form or function of model monitoring for audit or compliance purposes, including
    in some cases the ability to explain model decisions.


    Model monitoring is generally a concern shared by all of an organization’s production
    models, and thus ideally supported by a common framework or platform. This has
    the advantage of making monitoring “free” for data scientists, that is, something
    they get the benefit of but don’t need to worry about building. While some models
    or applications may have unique monitoring or reporting requirements requiring
    the involvement of data scientists or ML engineering staff, they should ideally
    be able to take advantage of low level “plumbing” that is already in place.


    # # Machine Learning at Scale


    When an enterprise is just getting started with machine learning, it has few established
    ML practices or processes. During this period, its data scientists are typically
    working in an ad hoc manner to meet the immediate needs of their projects. Data
    acquisition and preparation, as well as model training, deployment, and evaluation,
    are all done hand crafted with little automation or integration between steps.


    Once a team has operated this way for more than a handful of projects, it becomes
    clear that a great deal of effort is spent on repetitive tasks, or worse, on reinventing
    the wheel. For example, they may find themselves repeatedly copying the same data,
    performing the same data transformations, engineering the same features, or following
    the same deployment steps.


    Left to their own devices, individual data scientists or MLEs will build scripts
    or tools to help automate some of the more tedious aspects of the ML process.
    This can be an effective stopgap, but left unplanned and uncoordinated, these
    efforts can be a source of distraction and lead to technical debt.


    For organizations at a certain level of scale—typically when multiple machine
    learning teams and their projects must be supported simultaneously—“data science
    platform” or “ML infrastructure” teams are established to drive efficiency and
    ensure that data scientists and MLEs have access to the tools and resources they
    need to work efficiently.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'At Airbnb, for example, after gaining experience with applying machine learning
    to applications like search ranking, smart pricing, and fraud prevention, the
    company realized that it would need to dramatically increase the number of models
    it was putting into production in order to meet its business goals. To enable
    this, an ML infrastructure team was established. The team''s mission is to eliminate
    what it calls the incidental complexity of machine learning—that is, getting access
    to data, setting up servers, and scaling model training and inference—as opposed
    to its intrinsic complexity—such as identifying the right model, selecting the
    right features, and tuning the model''s performance to meet business goals.


    Common challenges encountered by ML infrastructure teams include:


    # Simplifying and automating data access & management


    Because so much of model building involves acquiring and manipulating data, providing
    a way to simplify and automate data acquisition and data transformation, feature
    engineering, and ETL pipelines is necessary to increase modeling efficiency and
    ensure reproducibility.


    Data acquisition is greatly facilitated when a centralized data repository or
    directory is available, such as a data lake, fabric, warehouse, or catalog. These
    enable efficient data storage, management, and discovery, allowing data that is
    generated from a variety of disparate systems to be more easily worked with by
    minimizing the time data scientists spend looking for data or trying to figure
    out how to access new systems.


    Data and feature transformations create new data needed for training and often
    inference. The data produced by these transformations is not typically saved back
    to the systems of origin, such as transactional databases or log storage. Rather,
    it is persisted back to facilities such as those mentioned above. Ideally, transformation
    and feature engineering pipelines are cataloged for easy sharing across projects
    and teams.


    In addition to the efficiency benefits they offer, feature data repositories can
    also help eliminate time consuming and wasteful data replication when architected
    in a way that meets the latency and throughput requirements of a wide range of
    machine learning training and inference workloads. Because of the scalability,
    security, and other technical requirements of feature data repositories, ML infrastructure
    teams typically work with data engineers and corporate IT to establish them.


    # Driving efficient resource use


    Today, we have more raw computing power at our disposal than ever before. In addition,
    innovations such as high-density CPU cores, GPUs, TPUs, FPGAs, and other hardware
    accelerators are increasingly targeting ML and DL workloads, promising a continued
    proliferation of computing resources for these applications.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Despite declining computing costs, the machine learning process is so bursty
    and resource-intensive that efficient use of available computing capacity is critical
    to supporting ML at scale. The following are key requirements for efficiently
    delivering compute to machine learning teams:


    +   - **Multitenancy.** Establishing dedicated hardware environments for each
    machine learning team or workload is inefficient. Rather, the focus should be
    on creating shared environments that can support the training and deployment needs
    of multiple concurrent projects.


    +   - **Elasticity.** Data preparation, model training, and model inference are
    all highly variable workloads, with the amount and type of resources they require
    often varying widely in time. To efficiently meet the needs of a portfolio of
    machine learning workloads it is best when the resources dedicated to individual
    tasks can be scaled up when needed, and scaled back down when done.


    +   - **Immediacy.** Data scientists and MLEs should have direct, self-service
    access to the number and type of computing resources they need for training and
    testing models without waiting for manual provisioning.


    +   - **Programmability.** The creation, configuration, deployment and scaling
    of new environments and workloads should be available via APIs to enable automated
    infrastructure provisioning and to maximize resource utilization.


    These are, of course, the characteristics of modern, cloud-based environments.
    However, this does not mean that we''re required to use the third-party “public”
    cloud services to do machine learning at scale.


    While the public cloud''s operating characteristics make it a strong choice for
    running some machine learning workloads, there are often other considerations
    at play. Performance requirements often demand co-locating training and inference
    workloads with production applications and data in order to minimize latency.


    Economics is an important consideration as well. The cost of renting computing
    infrastructure in the cloud can be high, as can the cost of inbound and outbound
    data transfers, leading many organizations to choose local servers instead.


    As both cloud and on-premises resources have their place, hybrid cloud deployments
    that harness resources from both are a worthy consideration for many organizations.
    Hybrid cloud deployment allows organizations to distribute workloads across cloud
    and on-premises resources in ways that allow them to quickly and cost effectively
    meet fluctuating workload demands and provide increased computational power when
    needed.


    Ultimately, in a world of rapid hardware innovation, dynamic infrastructure economics,
    and shifting workloads, it is prudent to build flexibility into new tools and
    platforms, so that they can be efficiently operated in any of these environments.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Hiding complexity


    With the rise of Platform-as-a-Service (PaaS) offerings and DevOps automation
    tools, software developers gained the ability to operate at a higher level of
    abstraction, allowing them to focus on the applications they are building and
    not worry about the underlying infrastructure on which their software runs.


    Similarly, in order for the machine learning process to operate at full scale
    and efficiency, data scientists and MLEs must be able to focus on their models
    and data products rather than infrastructure.


    This is especially important because data products are built on a complex stack
    of rapidly evolving technologies. These include more established tools like the
    TensorFlow and PyTorch deep learning frameworks; language-specific libraries like
    SciPy, NumPy and Pandas; and data processing engines like Spark and MapReduce.
    In addition, there has been an explosion of specialty tools aiming to address
    specific pain-points in the machine learning process, many of which we discuss
    in our accompanying book, _The Definitive Guide to Machine Learning Platforms_,
    and cover in our online **ML/AI Solutions Guide**.


    These high-level tools are supported by a variety of low-level, vendor-provided
    drivers and libraries, allowing training and inference workloads to take advantage
    of hardware acceleration capabilities. Some of these driver stacks are notoriously
    difficult to correctly install and configure, requiring that complex sets of interdependencies
    be satisfied.


    Manually managing rapidly churning software tools and the resulting web of dependencies
    can be a constant drain on data scientist productivity, and the source of hard-to-debug
    discrepancies between results seen in training and production.


    # Unifying the ML workflow


    Ultimately, as an organization’s use of data science and machine learning matures,
    both business and technical stakeholders alike benefit from a unified ML workflow,
    with a common framework for working with the organization’s data, experiments,
    models, and tools.


    The benefits of a common platform apply across the ML workflow. A unified view
    of data, as we’ve previously discussed, helps data scientists find the data they
    need to build models more quickly. A unified view of experiments helps individual
    users and teams identify what’s working faster, and helps managers understand
    how resources are being allocated. A unified view of deployed models helps operations
    and DevOps teams monitor performance across a wide fleet of services. And a unified
    view of infrastructure helps data scientists more readily access the resources
    they need for training.


    With a unified approach to the machine learning workflow, it becomes much easier
    to facilitate and manage cross-team collaboration, promote the reuse of existing
    resources, and take advantage of shared skills. It also enables individual team
    members to more quickly become productive when transitioning to new projects,
    driving increased efficiency and better overall outcomes for data science and
    ML/AI projects.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Enter Containers and Kubernetes


    Organizations are increasingly turning to containers and Kubernetes to overcome
    the challenges of scaling their machine and deep learning efforts.


    It turns out we’ve seen this before. The introduction of Docker containers in
    2013 initiated a dramatic shift in the way software applications are developed
    and deployed by allowing engineering teams to overcome a similar set of challenges
    to those faced by data scientists and ML engineers.


    Container images provide a standardized, executable package that provides everything
    needed to run an application, including its code, dependencies, tools, libraries
    and configuration files. A running Docker container is an instantiation of a container
    image.


    Compared with virtual machines, container images are lighter weight, easier to
    move between environments, and faster to spin up. This is in large part because
    they can share the host operating system’s (OS) kernel, as opposed to containing
    their own copy of a complete OS.


    The fact that lightweight containers could be reliably run across disparate computing
    environments helped address many of the difficulties faced by software development
    and operations organizations as they sought to modernize their software delivery
    processes, applications, and infrastructure, leading to their ultimate popularity.


    But containers alone offer a partial solution. For organizations operating at
    scale, supporting multiple concurrent machine learning projects in various stages
    of development, it quickly becomes necessary to use multiple containers, make
    the services they offer easily accessible, and connect them to a variety of external
    data sources. In this case, a container orchestration platform is required—in
    practice if not in theory—to efficiently manage the containers and their interactions
    with one another and the outside world.


    That’s where Kubernetes comes in. Kubernetes is an open source container orchestration
    platform developed and open-sourced by Google in 2014. Kubernetes has since become
    the de facto standard for container orchestration, due to its popularity among
    users, the flexibility it confers to them, the support it has gained from cloud
    computing and software vendors, and the degree of portability it offers between
    on-premises and public cloud environments.


    Kubernetes provides the necessary features required for complete lifecycle management
    of containerized applications and services in a manner that has proved to be highly
    scalable and reliable.


    Before exploring what this means for machine learning workloads, let’s learn a
    bit about Kubernetes itself.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Getting to Know Kubernetes


    Kubernetes takes a hierarchical approach to managing the various resources that
    it is responsible for, with each layer hiding the complexity beneath it.


    The highest-level concept in Kubernetes is the **cluster**. A Kubernetes cluster
    consists of at least one Kubernetes **Master** which controls multiple worker
    machines called nodes. Clusters abstract their underlying computing resources,
    allowing users to deploy workloads to the cluster, as opposed to on particular
    **nodes**.


    A **pod** is a collection of one or more containers that share common configuration
    and are run on the same machine. It is the basic workload unit in Kubernetes.
    All containers within a pod share the same context, resources, and lifecycle.
    Resources include local and remote storage volumes and networking. All containers
    in a pod share an IP address and port space. To run containers in pods, Kubernetes
    uses a container runtime, such as Docker, running on each node.


    ![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_14_0.png)


    Figure 3. Basic Kubernetes architecture


    The master can be thought of as the “brain” of the cluster. It responds to cluster
    configuration and management requests submitted via the Kubernetes client or API.
    It is responsible for determining which pods are deployed to which nodes based
    on their respective requirements and capabilities, a process called **scheduling**.
    The master maintains the overall health of the cluster by re-scheduling pods in
    reaction to faults such as server failures.


    Nodes in a Kubernetes cluster run an agent called the **kubelet** that listens
    for instructions from the master and creates, runs, and destroys containers accordingly.
    Collectively, the master and the kubelet processes govern the operation of the
    cluster and are referred to as the Kubernetes Control Plane.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'To run a workload on a Kubernetes cluster, the user provides a plan that defines
    which pods to create and how to manage them. This plan can be specified via configuration
    documents which are sent to the cluster via Kubernetes'' APIs or client libraries.
    In this way, Kubernetes is said to be a “declarative” system; users declare the
    state of the system they want, and Kubernetes tries to affect that state given
    the resources at its disposal.


    To run a workload on a Kubernetes cluster, the user provides a plan that defines
    which pods to create and how to manage them. This plan can be specified via configuration
    documents which are sent to the cluster via Kubernetes'' APIs or client libraries.
    In this way, Kubernetes is said to be a “declarative” system; users declare the
    state of the system they want, and Kubernetes tries to affect that state given
    the resources at its disposal.


    When the master receives a new plan, it examines its requirements and compares
    them to the current state of the system. The master then takes the actions required
    to converge the observed and desired states. When pods are scheduled to a node,
    the node pulls the appropriate container images from an image registry and coordinates
    with the local container runtime to launch the container.


    Files created within a container are ephemeral, meaning they don''t persist beyond
    the lifetime of the container. This presents critical issues when building real-world
    applications in general and with machine learning systems in particular.


    First, most applications are stateful in some way. This means they store data
    about the requests they receive and the work they perform as those requests are
    processed. An example might be a long training job that stores intermediate checkpoints
    so that the job doesn''t need to start over from the beginning should a failure
    occur. If this intermediate data were stored in a container, it would not be available
    if a container fails or needs to be moved to another machine.


    Next, many applications must access and process existing data. This is certainly
    the case when building machine learning models, which requires that training data
    be accessible during training. If our only option for data access was files created
    within a container, we would need to copy data into each container that needed
    it, which wouldn''t be very practical.


    To address these issues, container runtimes like Docker provide mechanisms to
    attach persistent storage to the containers they manage. However, these mechanisms
    are tied to the scope of a single container, are limited in capability, and lack
    flexibility.


    Kubernetes supports several abstractions designed to address the shortcomings
    of container- based storage mechanisms. **Volumes** allow data to be shared by
    all containers within a pod and remain available until the pod is terminated.


    **Persistent volumes** are volumes whose lifecycle is managed at the cluster level
    as opposed to the pod level. Persistent volumes provide a way for cluster administrators
    to centrally configure and maintain connections to external data sources and provide
    a mechanism for granting pods access to them.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/7ae4bd70c4b8a91a2f0a81163d918a5f_16_0.png)


    Figure 4. Kubernetes volumes provide a flexible abstraction for accessing a wide
    variety of storage systems from containerized workloads


    Kubernetes has long supported first- and third-party volume plugins allowing users
    to access different types of storage resources. More recently, the general availability
    of support for the Container Storage Interface (CSI) specification has significantly
    expanded the ability to access a wide variety of software and hardware-based storage
    systems via community- and vendor-provided drivers.


    Beyond CSI, Kubernetes offers additional capabilities that allow users to customize
    their deployments and support complex application scenarios, including:


    +   • Custom resources, which extend the Kubernetes API to manage new types of
    objects


    +   • Operators, which combine custom resources and controllers to manage stateful
    applications and systems


    +   • Scheduler extensions, which can be used to change the way Kubernetes manages
    pods and assigns them to nodes


    +   • The Container Network Interface (CNI) which provides a common interface
    between containers and the networking layer


    +   • Device plugins, which allow Kubernetes nodes to discover new types of hardware
    resources and perform vendor specific initialization and setup. Once made discoverable,
    the availability of these resources can then be considered by the Kubernetes scheduler
    when making pod placement decisions.'
  merge: -1
