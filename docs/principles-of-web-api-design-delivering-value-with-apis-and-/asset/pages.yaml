    # Pass-by-Reference versus Pass-by-Value API Tokens


    Pass-by-reference API tokens do not contain any content or state, only a unique
    identifier for dereferencing on the server side. For example:


    ```

    GET http://api.example.com/projects HTTP/1.1

    Accept: application/json

    Authorization: Bearer a17d41b4f1

    ```


    It is the responsibility of the API server to dereference the API token to determine
    the specific user making the API call, along with any other details.


    Pass-by-value API tokens contain name/value pairs included within the token. This
    reduces the number of lookups required to dereference a token to its associated
    values by the API server.


    API tokens that use pass by value typically allow the API client to access the
    same name/value pairs that are available to the API server. Therefore, pass-by-value
    API tokens should embed feature flags or other sensitive data that could be used
    to compromise a system. Instead, use them to convey minimal details, such as opaque
    identifiers.'
