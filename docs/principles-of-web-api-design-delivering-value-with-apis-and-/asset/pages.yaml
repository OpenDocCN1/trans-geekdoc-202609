  md: '3. **Unsafe:** The operation makes state changes to the target resource(s)
    and cannot not guarantee the same results if called multiple times with the same
    input. This safety classification is typically assigned to create and update (POST
    and PATCH) operations.


    Review each operation to determine the safety classification type that is required
