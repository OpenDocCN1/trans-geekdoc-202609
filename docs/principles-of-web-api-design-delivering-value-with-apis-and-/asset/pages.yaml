- pgno: 22
  md: '# series EDITOR FOREWORD


    We can readily think of numerous organic objects—living organisms—from the very
    large to the microscopic single-celled forms. The second use of organism, though,
    may not as readily pop into our mind. One example is an organization, which includes
    the prefix of both organic and organism. In this use of organism, I''m describing
    something that is structured with bidirectional dependencies. An organization
    is an organism because it has organized parts. This kind of organism cannot survive
    without the parts, and the parts cannot survive without the organism.


    Taking that perspective, we can continue applying this to nonliving things because
    they exhibit characteristics of living organisms. Consider the atom. Every single
    atom is a system unto itself, and all living things are composed of atoms. Yet,
    atoms are inorganic and do not reproduce. So, it''s not difficult to think of
    atoms as living in the sense that they are endlessly moving, functioning. Atoms
    bond with other atoms. When this occurs, each atom is not only a system unto itself,
    but becomes a subsystem with other atoms as subsystems, with their combined behaviors
    yielding a greater system.


    So, then all of concepts regarding software are quite organic that nonliving things
    are still “characterized” by aspects of living organisms. When we discuss software
    model concepts using concrete scenarios, or draw an architecture diagram, or write
    a unit and its corresponding domain model unit, software starts to come alive.
    It''s not static, we continue to discuss how to make it better, suject to refinement,
    where one scenario leads to another, and that has an impact on the architecture
    and the domain model. As we continue to iterate, the increasing value in refinements
    leads to incremental growth of the organism. As time progresses does the software.
    We wrestle with tackle complexity through useful abstractions, and the software
    grows and changes shapes, with the explicit purpose of making work better for
    living organisms at global scales.


    Sadly, software organics tend to grow poorly more than they grow well. If they
    start out in good health then they get diseases, become deformed, grow unnatural
    appendages, atrophy; and deteriorate. Worse still is that these symptoms are caused
    by efforts to refine the software that went wrong making things better. The worst
    part is that every failed refinement, everything that goes wrong with these complex
    bodies causes their death. (Oh, if they could just die!) Instead, we have to kill
    them and killing requires nerves, skills, and the intestinal fortitude of a dragon
    slayer. No, not, but dozens of vigorous dragon slayers. Actually, make that dozens
    of dragon slayers who have really big brains.


    That''s where this series comes into play. I am curating a series to help you
    mature and reach greater success with a variety of approaches—reactive, object,
    and functional architecture and programming; domain modeling; right-sized services;
    patterns; and APIs. And along with that, the series covers best uses of the'
