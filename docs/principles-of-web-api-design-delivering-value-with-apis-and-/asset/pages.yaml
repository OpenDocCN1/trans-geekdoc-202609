- pgno: 119
  md: '# Step 2: Identify the Resources


    The next step is to use the API profile to identify resources for the API. Resources
    are often domain entities that will be operated by the API. Finding the target
    for each operation helps identify the initial set of resources. This is often
    a difficult task when first starting an API design. However, the Align and Define
    phases of the process provide sufficient understanding to inform designers of
    an initial set of candidates.


    Using the Shopping API example to illustrate the resource identification process,
    Figure 6.4 shows that the Book and Cart resources are used by the operations and
    are resource candidates.


    For each candidate resource, create a table that captures the resource name and
    any properties that are currently known. Including a description helps align understanding
    and is useful when moving into the API design phase.


    When creating an API profile, focus on capturing only the properties that are
    essential to the operation. Doing so speeds up the modeling process and ensures
    the focus remains on the API profile rather than implementation details.


    Figure 6.5 shows the Shopping API resources, including a new resource called Book
    Author that was discovered while enumerating the properties of the Book Resource.


    # A Word of Caution on Resource Identification


    While it may be tempting to use a database schema as the starting point for resource
    identification, keep in mind that API designs should not leak implementation details.
    A database schema reflects optimizations for transactional and write operations
    rather than exposing business domain concepts over a network API.


    It is best to work top-down when modeling an API to avoid leaking internal data
    model decisions into the API design. If the implementation phase demonstrates
    a one-to-one relationship between resources and a database schema, then it becomes
    a “happy accident,” as painter Bob Ross would say.


    +   2. Bob Ross, “We Don’t Make Mistakes,” clip from The Joy of Painting, season
    3, episode 5, “Distant Hills” (Schmidt1942, 2013; originally aired Feb. 1, 1984),
    https://www.youtube.com/watch?v=wCaO56kWWtc.'
