- pgno: 194
  md: 'Most discussions surround Web-based APIs center on synchronous request/response
    interactions common with REST-based, query-based, and remote procedure call (RPC)–based
    APIs. They are easy to understand and approachable for developers and non-developers
    with minimal experience working with HTTP.


    Yet, synchronous APIs have their limitations. The API server is unable to notify
    interested parties about changes in the representation of a resource or notify
    when workflow between multiple parties completed. Instead, they require the client
    to initiate the interaction with an API server before receiving any notifications.


    Asynchronous APIs, or async APIs, unlock the full potential of a digital product
    or platform. They extend the API conversation from client-originated to server-oriented,
    allowing clients to react to an event rather than start a conversation. New capabilities
    may be built on a single type of event notification. And all of this may be done
    without the involvement of the team that owns an API.


    Including async API design as part of an overall API design empowers teams to
    craft new solutions based on notifications or data streams. But it takes few considerations
    to unlock the full potential of an async API. This chapter presents some of the
    challenges and design patterns around async APIs. It also demonstrates how to
    design and document an async API by building on the previous API modeling steps
    outlined in Chapter 6.


    # The Problem with API Polling


    If an API client wishes to know when new data is available, it must periodically
    check the server to see if any new resources have been added or existing resources
    have been modified. This pattern is known as API polling and is a common solution
    for clients that need to become aware of new resources or modifications to existing
    resources.


    API polling is flexible and may be implemented by the client on top of just any
    API that uses a request/response style. However, API polling isn''t an ideal solution.
    Coding the logic necessary to detect and track modifications is complex, wasteful,
    and can result a poor user experience. The API client must send a GET request
    to a resource collection to fetch the latest list of resources, compare the list
    to the last retrieved by the API client, and determine if anything has been added.
    Some APIs offer an operation to provide recent changes based on a timestamp since
    the last request, but it is up to the API client to continue to perform API polling
    to determine when changes have been made.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Yet, many developers are forced to build polling code to constantly check for
    changes in server-side state. Building polling code includes additional challenges
    to the developer:


    +   - The API sends responses back with default, nonoptimal sorting (e.g., oldest-to-newest).
    The consumer must then request all entries to find out if anything new is available,
    often keeping a list of the IDs already seen to determine what is new.

    - Rate limiting may prevent making requests at the desired intervals to detect
    change in a timely fashion.

    - The data offered by the API doesn''t provide enough details for the client to
    determine if a specific event has occurred, such as a resource modification.


    The ideal situation is to have servers inform any interested API consumers about
    new data or recent events. However, this isn''t possible with traditional request/response
    API styles common with HTTP; as API clients are required to submit a request before
    the API server can communicate any changes.

    Async APIs help this need. Rather than constantly polling and implementing change
    detection rules on the API client, API servers send asynchronous push notifications
    to interested API clients when something on the server has changed. This opens
    a whole new series of possibilities compared to traditional, synchronous Web-based
    APIs that are rooted in HTTP/response.


    # Async APIs Create New Possibilities


    As discussed in Chapter 1, “The Principles of API Design,” APIs provide interfaces
    to data and behavior to deliver digital capabilities, typically over HTTP. Digital
    capabilities include a customer profile search, customer registration, and attaching
    a customer profile to an account. These digital capabilities are combined to create
    API products and API platforms that empower business units within an organization
    and among partners and customers to create new outcomes.

    Async APIs are digital capabilities as well. They go beyond traditional REST-based
    APIs to open new possibilities for digital business:


    +   - Reacting to business events in real-time: Solutions can react to state changes
    and critical business events when they happen.

    - Extending the value of solutions with message streams: Additional value is unlocked
    from existing solutions and APIs. New opportunities emerge to'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'take advantage of internal events by surfacing them alongside the capabilities
    offered by their APIs. New solutions are built on top of existing APIs through
    an event-driven interaction style.


    +   - Improving API efficiency: Constant API polling is no longer needed to check
    for state changes. This reduces the resources required to support an API by pushing
    state change events to those interested, thereby reducing infrastructure costs.


    | CASE STUDY: GitHub Webhooks Created a New CI/CD Marketplace |

    | GitHub Webhooks have been around for some time, allowing teams to be notified
    when new code has been pushed to a GitHub-hosted repository. While Git supports
    writing scripts to create these kinds of events within a source code repository,
    GitHub was one of the first vendors to turn these script-based hooks into Webhooks.
    Any individual or organization hosting their code with GitHub could be notified,
    via an HTTP-based POST, when new code was available and trigger a new build process.
    Over time, continuous integration and delivery (CI/CD) tools that were previously
    restricted to on-premises installations could now be offered via a software-as-a-service
    (SaaS) model. These solutions would be granted permission to receive the Webhook-based
    notification and start a new build process. This async API notification ultimately
    created an entire SaaS market of hosted CI/CD tools. That is the power of async
    APIs. |


    By the full potential of async APIs can be unlocked, it is important to understand
    messaging fundamentals.


    # A Review of Messaging Fundamentals


    Messages contain data that are published by a message producer to a message receiver.
    Receivers may be a local function or method, another process on the same host,
    a process on a remote server, or middleware such as a message broker. There are
    three types of messages: commands, replies, and events:


    +   - A command message requests that work be done immediately or in the future.
    Command messages are often imperative: `CreateOrder`, `RegisterPayment`, and so
    on. Command messages are sometimes referred to as `request messages`.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# A REVIEW OF MESSAGING FUNDAMENTALS 163


    +   - A reply message provides the result, or outcome, of a command message. Reply
    messages often add the suffix Result or Reply to differentiate them from their
    command counterparts: CreateOrderReply, RegisterPaymentResult, and so on. Reply
    messages are also referred to as response messages. Not all command messages have
    a reply message


    +   - Event messages tell the receiver about something that has happened in the
    past. A good event uses past tense to indicate that an action has taken place:
    OrderCreated, PaymentSubmitted, and so on. Event messages are typically used when
    a business event has occurred, a workflow state has changed, or data has been
    modified.


    # Messages Are Immutable


    It is important to note that messages are immutable. Once they are published,
    they may not be modified. Therefore, a message that requires modification must
    be republished as a new message. If necessary, include a correlation identifier
    to map the new message to the original message.


    Figure 9.2 shows an example of each kind of message and the context that it provides.


