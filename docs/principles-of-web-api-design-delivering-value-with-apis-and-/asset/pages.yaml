- pgno: 259
  md: '# Chapter 12


    # API Testing Strategies


    Software defect removal is the most expensive and time-consuming form of work
    for software.


    > — Caspers Jones


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_259_0.png)


    Figure 12.1 API testing refines the API design by identifying API quality issues
    early.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'When building an API product or platform, it is important to have an API testing
    strategy established. Selecting the right approach for API testing contributes
    to the success of an API program''s supportability. It also contributes to faster
    delivery while avoiding one of the costly aspects of software development: defect
    removal. Finally, it offers another perspective on the developer experience of
    an API because of the consumer-oriented nature of automated testing.


    # Acceptance Testing


    Acceptance testing, also called *solution-oriented testing*, ensures that the
    API supports the captured job stories. It seeks to answer the following questions:


    +   - Does the API solve real problems that our customers have?

    - Does it produce the desired outcomes for the jobs to be?


    Acceptance testing verifies the coloration of API operations required to achieve
    a desired outcome. Composing acceptance tests using only the API interface to
    verify that the system meets all end-to-end functionality. The internals of the
    API can and likely change over the course of development, but this should not
    affect the results of the acceptance tests.


    Acceptance testing is the most valuable style of testing for an API. The process
    of writing acceptance tests helps identify poor developer experience for a single
    API operation or the end-to-end integration. It is where the most testing effort
    should be spent, after code testing, when limited time is available.


    # Automated Security Testing


    Each week, a new headline indicates that a company has been hacked and private
    information exposed. Security is a process, not a product, and a continual one
    at that. Security testing aims to answer the following questions:


    +   - Is the API protected against attacks?

    - Does the API offer opportunities for sensitive data to be leaked?

    - Is someone scraping my API and compromising business intelligence through data?


    While not typically associated with automated testing, security testing is an
    active process that includes design-time review processes, development-time static
    and dynamic code analysis, and runtime monitoring.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'API CONTRACT TESTING 227


    Design-time and development-time testing often comprise policies and tools that
    are designed to prevent leaking sensitive data through design reviews that identify
    potential concerns. It also includes authorization policies for each API operation
    to ensure proper access is enforced.


    An API management layer may be employed to apply runtime monitoring and enforcement.
    Authorization enforcement is managed through configuration, avoiding the need
    to implement access restrictions within the API implementation. Log analysis may
    be used to detect and block malicious attacks. More details on security protection
    are offered in Chapter 15, “Protecting APIs.”


    # Operational Monitoring


    APIs can and often provide the primary interface for applications to interact
    with a system. Because the API service plays the role of a dependency, it is critical
    for the service to be available, whether other services are internal to an organization
    or to external partners and customers. In addition, there may be service-level
    agreements (SLAs) that the company has agreed to undertake with customers and
    partners regarding the performance and uptime of an API. Failing to meet an SLA
    could yield a negative financial result as well as angry or upset customers.


    Operational monitoring answers the following questions:


    +   - Is the API available and performing as expected?

    - Is the API staying within expected SLAs?

    - Is there a need to provision more infrastructure to meet performance goals?


    Monitoring and analytics solutions are an important component to API operational
    monitoring. Analytics verify that real-world usage matches what was seen in testing
    for both correctness and performance. Analytics measurements can be as simple
    as logging of performance counters or as complex as integrating third-party libraries
    with extensive monitoring and visualization support.


    # API Contract Testing


    API contract testing, sometimes referred to as functional testing, is used to
    verify that each API operation meets the expected behavior and honors the API’s
    defined contract for the consumer.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 228 CHAPTER 12 API TESTING STRATEGIES


    Contract testing answers the following questions:


    +   - Is each operation working to the specification for all success cases?

    - Are input parameters being followed? How are bad inputs handled?

    - Are the expected outputs received?

    - Is response formatting correct? Are the proper data types used?

    - Are errors being handled correctly? Are they reported back to the consumer?


    In the Align-Define-Design-Refine (ADDR) process, API descriptions are defined
    during the process, prior to implementation. These description files may be used
    to verify the API contract as part of the contract testing process. Some common
    specification formats for REST APIs OpenAPI (Swagger), API Blueprint, and RESTful
    API Modeling Language (RAML). GraphQL APIs have a schema defined, which helps
    drive contract testing. gRPC defines service contracts using an interface definition
    (IDL) file. This topic is discussed further in Chapter 13, "Documenting the API."


    API contract testing must first ensure the correctness of each API operation.
    Handling thousands of clients per minute does not get the information that the
    API is providing or acting on not meet the API''s specification. Identifying and
    eliminating bugs, hunting out inconsistencies, and verifying that an API meets
    the specification against which it has been designed all fall under the umbrella
    of testing for correctness.


    Next, API contract testing must focus on reliability. The API should provide the
    correct information every time an operation is called. Executing the same action
    repeatedly for an API operation designed to be idempotent should produce the same
    results. API operations that support pagination page produce results in a predictable
    way.


    Finally, API contract testing should submit invalid and missing data and verify
    that the expected error response is received. String values may be submitted in
    place of numeric values, along with values outside the range of acceptable values.
    Date formats should be incorrect or result in dates outside an expected range
    of acceptable dates.


    # User Interface Testing versus API Testing


    Some members may suggest that building dedicated tests for an API is wasteful.
    They may attempt to make the case that user interface (UI) tests cover the API
    sufficiently, given that the UI calls the API. However, this is not'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# SELECTING TOOLS TO ACCELERATE TESTING 229


    the case. Instead, the UI tests the API as far as the UI exercises the API.

    This means that if the UI is performing client-side validation of user input,

    then UI tests would never verify the API’s ability to handle bad data.


    While some may say that this level of testing is sufficient, they may be for-getting
    the recommendation of the Open Web Application Security Project

    OWASP): do not trust user input. A user or client will not always submit

    a a way that an API expects. Always validate the data that comes from

    forms as well as from HTTP request headers.


    One of the goals of API testing is to ensure that the API is able to handle a

    mitude of good and bad values that may be submitted outside of a specific

    UI. If we depend on UI tests, then the API should not be considered sufficient
    tested.


    Another goal of API testing is to ensure that the API cannot be deployed

    into production without passing tests. This requires API tests become

    part of the continuous integration and delivery pipeline, just like all other

    types of automated testing.


    # Selecting Tools to Accelerate Testing


    Some organizations may have an established quality assurance (QA) group that

    specializes in automated testing and manual exploratory testing. QA teams may
    be

    composed of those who write code and others who use testing tools that help

    compose automation suites without the need to write code. Other organizations

    may not have QA teams at all, instead relying on developers to write and

    maintain API test code. These factors must be considered when selecting API testing

    tools.


    A number of open source and commercial testing tools are available today

    the creation of API testing using API specification formats to help jumpstart

    t testing process. Some are designed to support the creation of tests through
    a

    UI to reduce or eliminate the need to write test code. Others are designed to
    offer

    a scripting environment or test libraries that require coding. Be sure to select
    the right

    solutions that match the testing preferences and skills found in the organization.


    Performance and monitoring solutions, offered as third-party API monitoring-as-a-service,
    are available from a range of companies and often start as

    a freemium service for a small number of tests. Open-source monitoring tools are

    available that can be run on-premises or cloud-hosted infrastructure. Custom

    tools built to perform load and performance testing can be modified to run less

    frequently and at a smaller scale for the purpose of monitoring or soak testing.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'API testing is often automated through code or test scripts and executed in
    a dedicated test environment. Automating these tests has a higher infrastructure
    cost because of the need for additional nonproduction environments that contain
    infrastructure resources. Be sure to take into consideration how tests will be
    automated and the infrastructure cost required to support them.


    Finally, consider test-driven development (TDD) may be extended through the strategic
    selection of API testing tools. Dedicated QA teams may build automated test suites
    that are created by developers as they implement the API. Developers who are tasked
    with writing the API tests themselves may wish to take a similar approach, which
    they apply TDD to their day-to-day development process. This approach helps to
    demonstrate progress and validate that an API implementation handles all cases,
    invalid, and error cases.


    # The Challenges of API Testing


    One of the challenges that must not be overlooked when establishing an API test
    strategy is the need for test data sets. While unit testing may not require complex
    data sets, API testing has the exact opposite demands. API testing often involves
    a tremendous effort to build a cohesive set of data that will support the necessary
    test sets.


    There are two common approaches to creating test data sets for APIs: snapshot
    of existing data sets and cleanroom data creation. Taking a snapshot of a production
    system and cleansing the data set of sensitive data is often the most direct path.
    It requires less effort to separate the necessary data, instead opting to accept
    an entire data store snapshot as a starting point. The snapshot may be used to
    restore the test data back to a known state. This is a great approach when production
    data exists.


    Cleanroom data creation is a more challenging and takes considerable time, but
    once completed, it enables more robust test sets. Cleanroom data involves the
    creation of cohesive data sets from the ground up to support the API testing process.
    Tools such as Mockarang may be used to synthesize some of the data while providing
    more real-world values than simply using random values. However, handicrafting
    data elements is often required to construct deeply nested data sets that represent
    entire scenarios rather than just a single table of data.


    For example, JSON''s Bookstore would require books, carts, orders, and custom-ers
    that are not easily generated randomly. Instead, it is often necessary for domain'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'experts to construct these elements manually, perhaps using a spreadsheet.
    A script then loads this data into the appropriate data stores, ensuring the elements
    are properly connected through shared identifiers, foreign keys, and link tables.
    Tests could then use the API to retrieve a customer, examine their orders, execute
    a new shopping experience, and verify that the API functions as expected.

    Some API testing may depend on third-party services that do not offer their own
    sandbox or test environments. In this case, techniques such as API mocking may
    be used to isolate external dependencies and prevent the need to involve production
    systems as part of an API test suite. Rather than connecting to the system, a
    mock response may be created to take the place of the system. Of course, this
    often requires additional data preparation work to ensure that the mock properly
    satisfies the cases that are to be supported.


    # Make API Testing Essential


    Too often, teams choose to take shortcuts when time is short, and this typically
    involves poor or no API testing. Like documentation, testing is often seen as
    a nice-to-have in the development process. However, we should view testing and
    documentation as essential steps to truly calling the API and ready to deploy.
    Otherwise, we are creating opportunities for bugs to creep into partner and customer
    interactions. Worse, it could open the organization up to malicious attacks through
    one or more APIs.


    # Summary


    A robust API testing strategy is an important step to API delivery and is a formidable
    foe against regressions sneaking into an API. A proper API testing strategy helps
    to ensure API correctness and reliability while ensuring the desired outcomes
    are achievable. It should also extend beyond the development phase and into runtime
    testing to maintain a secure and performance environment. An API should not be
    considered complete until all tests have been created, executed, and passed.'
  merge: -1
  img_proc: true
