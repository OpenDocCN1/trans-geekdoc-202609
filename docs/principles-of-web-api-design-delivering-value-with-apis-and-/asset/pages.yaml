    \ all of the same color (typically orange), and places them on the canvas. Brandolini\
    \ recommends using consistent colors for specific items. Step 4: Expand Domain\
    \ Understanding.\"\n\nDomain events are phrased in the past tense to indicate\
    \ that something has already happened. Phrasing events in the past tense can be\
    \ challenging for some attendees. Help them rephrase the domain events until the\
    \ habit is built. Consistent in this effort pays off during subsequent steps.\
    \ Table 4.3 demonstrates the preferred conventions for domain events and those\
    \ to avoid.\n\nThis step offer two passes of 15 to 30 minutes. For a session with\
    \ a larger scope, more passes may be required. The result is a large number of\
    \ unordered sticky notes over all the canvas.\n\nAs events are placed, attendees\
    \ may start to slow down. This is common and easily remedied. Between each pass,\
    \ review some areas of the canvas to identify missing events. Ask attendees to\
    \ review all domain events and identify causation events that may come before\
    \ a business domain event. If the causation event is missing, have them add it\
    \ as a new domain event sticky note.\n\nFigure 4.2 demonstrates what this would\
