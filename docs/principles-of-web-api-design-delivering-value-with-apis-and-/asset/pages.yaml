- pgno: 204
  md: 'With the ability to specify the offset of where they wish to start, clients
    are able to solve new kinds of problems using solutions that were not possible
    with message brokers:


    +   * Achieve real-time data processing and data analytics as soon as incoming
    data is received from other systems or third parties due to the highly scalable
    and low-latency design of message streaming servers.

    * Use historical messages to verify the results of code changes prior to pushing
    new code to production.

    * Execute experimental data analytics against historical messages.

    * Remove the need to subscribe to all message broker queues and topics in an effort
    to store all messages processed by a message broker for auditing purposes.

    * Push data into a data warehouse or data lake for consumption by other systems,
    without the need for traditional extract-transform-load (ETL) processes.


    The higher scalability of message streaming lends itself to a shift in the way
    data is managed and shared. Rather than sharing access to a data store or replicating
    the data store, each new or modified data event message is pushed to a topic stream.
    Any consumers are able to process the data change, including storing it locally
    for caching or for further analysis.


    # Message Streaming Considerations


    In certain circumstances, message streaming may not be the best option:


    +   * **Duplicate message processing**: Subscriptions must keep track of their
    current location in the stream. Therefore, duplicate message processing must be
    expected and handled. This may be the case if the current location was not stored
    prior to a failure.

    * **No message filtering**: Message brokers support messages on a queue or topic
    based on specific values. Message streaming does not support this filtering out
    of the box. Instead, it requires receivers to process all messages from a given
    offset or to apply a third-party solution, such as Apache Spark.

    * **Authorization is limited**: Because message streaming is relatively new, fine-grained
    authorization control and filtering is limited or nonexistent for today''s solutions.
    Be sure to verify authorization needs are'
