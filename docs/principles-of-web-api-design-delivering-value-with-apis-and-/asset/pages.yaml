- pgno: 96
  md: '# Share: Communicating the EventStorming Session


    Achieving a successful EventStorming session requires preparation and effective
    communication before a session, and after the start of a session, after has been
    completed. The following are suggestions for facilitators to communicate effectively
    via email, video, and to face before the session:


    +   - Product management attendance is essential. Insist that product owners and
    product managers attend. A developer-heavy session will focus on how things work
    today, existing systems, and delivering the status quo. In addition, alignment
    will occur, rendering an incorrect understanding of the domain and desired outcomes.

    - Share the purpose and scope of the session. If the purpose and scope are not
    shared ahead of time, many will be confused or fail to participate. Communicating
    the purpose and scope will also ensure the right people are in the room, which
    is key for EventStorming to be most effective. Establish expectations initially
    and reinforce at the start of the session.

    - Establish mutual expectations. Confusion or unmet expectations will lead to
    an ineffective session or a poor view of EventStorming. Establish expectations
    regarding the process, desired outcome, and design assets to be produced. Reiterate
    these at the start of the session to reinforce the goals and establish a proper
    mindset.

    - Ensure that API design has not started yet. Teams that have already started
    API design will likely ignore the output of the session in favor of moving forward
    with the current design. The session should be used to guide vision with immediate
    execution. Teams unwilling or unable to incorporate the output of the session
    will likely fail to obtain the highest possible value of an EventStorming session.
    Ensure team buy-in from everyone before proceeding.

    - Reinforce how EventStorming fits into the overall API design. Share a progress
    indicator or revisit the overall process often to demonstrate where the session
    fits into the bigger picture. Remind the audience that EventStorming produces
    valuable insights that will inform the upcoming API modeling and design steps.
    Otherwise, the session may seem like busy work.


    At session kickoff, review the items once more. Reviewing everything the day of
    the session helps to bring everything top-of-mind and sets the expectations for
    the session.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Execute: Conducting the EventStorming Session


    At the start of a session, review the expectations, process, and scope of the
    session. Then start with the first step of the session. Most first-time attendees
    will a bit uncertain how to get started. Be ready to help them along or allow
    those more familiar to start the process.


    Show how the process works by first demonstrating it. Post the first business
    domain event by taking input from the group, phrase it into the past tense to
    demonstrate the expected format, then post it on the timeline at an approximate
    location. Request that the group start to create their own independently. Use
    the same technique for each step in the session.


    Establish clear reasons for each step of the process. Most first-time attendees
    won''t fully understand why each step in the process is necessary. Help them understand
    the value of the time spent. While the process may be obvious to the facilitator,
    most attendees will need time to adapt to the process of EventStorming.


    # Wrap-up: Capture Activities and Activity Steps


    Once the session is complete, take photos of canvas with the sticky notes for
    sharing. Before leaving the area, the photos should be checked to ensure that
    all handwriting is legible. If not, move closer to the board and take more photos.


    To make the canvas available digitally, use a tool to produce a single panoramic
    photo, or number the photos from left-to-right to ensure they can be reassembled
    as needed. If the team resides in a shared office space, the canvas may be carefully
    removed and placed in a new location for reference.


    Digital tools, as Miro, may be helpful for remote sessions and support PDF or
    image export of the final canvas. It is also possible to use a shared document,
    such as Google Docs or a Word document hosted on SharePoint, if other tools are
    not readily available. Experience shows that color-coded text works just as well
    as virtual sticky notes and is easier to cut-and-paste as the canvas is manipulated.


    Finally, use the canvas to identify and capture activities and activity steps,
    described at the start of this chapter.


    # Follow-up: Post-Session Recommendations


    The facilitator should send a follow-up email two days after the session. The
    two-day email should thank everyone for their participation and share the new
    location of the sticky notes and the digital folder where the photos reside. A
    survey link may also be provided for input for process improvement.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 64 CHAPTER 4 CAPTURE ACTIVITIES AND STEPS


    A second email from the facilitator should be sent two weeks after the session.
    This email should ask how the output of the session is being used by the team.
    Use this opportunity to find blocking issues that prevent the team from proceeding.
    Schedule a follow-up discussion to coach the team on next steps if they are blocked.


    Finally, writing a case study of the session and including quotes from attendees,
    if permission is provided. This helps teams uncertain about the EventStorming
    process understand the value that it provides and increase their willingness to
    invest the necessary time. It also helps to share team wins across the organizations.


    # Customizing the Process


    Remember that EventStorming is a tool that offers discovery-based learning in
    a collaborative environment. Customizing the process helps organizations gain
    the most from sessions. The following additions or modifications have been explored
    beyond the original process suggested by Brandolini.


    +   * **The three-lane approach:** Rather than a single sheet of paper covering
    the wall, using narrow paper allows for creating three separate lanes in parallel.
    All initial events are attached to the top line during business event identification.
    When ordering them into a narrative, the events are moved to the middle lane.
    The top line is then used to expand the available space when expanding the canvas
    with new sticky notes beyond the initial business events. The bottom line is used
    as a "parking lot" for events considered out of scope or identified as duplicate.
    This approach was built out of necessity, as the only available paper rolls from
    an organization’s supply closet were only 12 inches (30 cm) high.


    +   * **45-degree sticky notes:** When a note is clear, needs to be rewritten
    into past tense, or is revisited for another reason, anyone is empowered to tilt
    a sticky note at a 45-degree angle. This flags the note for follow-up before proceeding
    to the next step of the process.


    +   * Multipart EventStorming sessions:** With the introduction of remote sessions,
    fatigue often sets in more quickly than with high-energy in-person sessions. In
    this case, consider breaking an EventStorming session into multiple parts that
    take more than two hours before a one-hour break. If necessary, a session may
    be spread across two days as long as all attendees will be available to participate
    both days.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   Shared facilitation: The facilitator is encouraged to ask different people
    to lead the narration/storytelling effort. Shared facilitation encourages ownership
    of the session, keeps team members engaged and away from email, and helps cross-train
    others in the EventStorming process. The facilitator demonstrates, facilitates
    for a time, then asks for a volunteer or selects someone to facilitate a portion
    of the process. This continues until everyone has had a chance to facilitate some
    portion of the session. During the activity, the original facilitator remains
    available and coaches everyone as needed.


    # Summary


    It is essential for teams to establish a detailed understanding of domain concepts,
    processes, and workflows. Capturing these details as activities and activity steps
    helps to align all team members and establish a foundation for future API design
    work. The EventStorming framework may be used as a collaborative method for exploring
    the domain concepts in detail alongside domain and subject matter experts.


    The next step in the API design process is to start defining the bounded contexts
    and APIs needed to realize the digital capabilities offered by an API product
    or API platform.'
  merge: -1
  img_proc: true
