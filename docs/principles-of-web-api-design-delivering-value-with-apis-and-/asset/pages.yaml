- pgno: 324
  md: '# Reason 1: API Security is a Moving Target


    Want to make it easier for an attacker to find and exploit a security hole in
    an API? Build a custom API gateway. Ask any company that has experienced a breach
    through its API—security is hard, even with right components in place.


    Applying proper security requires focused attention to detail at every aspect
    of the organization. Unless the organization has a staff of security experts on
    hand, building an in-house, secure API gateway will take much longer than it takes
    to build a proof-of-concept version. And it will require continued resources to
    keep it to date with the latest vulnerabilities.


    # Reason 2: It Will Take Longer Than Expected


    Building a custom gateway often starts as a romantic notion. Rationalization begins
    with "it shouldn''t take too long" and continues with "It do exactly what I need
    to do—no more—and it will be much faster as a result," only to end with the dreaded
    rhetorical question, "How could it be?


    The reality is building and maintaining a production-worthy API gateway and APIM
    vendor is not trivial. There is a reason why API gateway vendors are able to charge
    for their product. Beyond the baseline set of features, deviations by nonstandard
    clients and proxy servers will force sorts of troubleshooting throughout the life
    of the API gateway. In addition, implementing OAuth 2.0, OpenID Connect, SAML,
    and other specifications is complex and takes considerable time to build, test,
    and support.


    It is important to ask first if the time spent building a custom API gateway is
    well spent by the organization. Count the full cost of building and maintaining
    the API gateway, including patches and improvements to handle new and emerging
    attack vectors that are not currently handled. Many organizations have gone down
    this path only to never deliver their intended solution to market.


    # Reason 3: Expected Performance Takes Time


    In software, there are three recommended phases of development: make it work,
    make it right, and make it fast. Often, developers are good at the first step—make
    it work. They experiment with code to see if something is possible or perhaps
    to see what the result might look like before proceeding.


    The effort required to go from making work to making it right for production is
    vast. The edge cases are numerous and unforeseen. It takes time to make it right.
    To make it fast requires even more investment. The organization ready to dedicate
    staff on building a solution that already exists?'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# What about Helper Libraries?


    Perhaps a team is considering that the features of an API gateway could be included
    right inside the source code. Maybe an existing helper library offers API token
    generation and some basic security features. That might work for today. However,
    it will be sustainable in the long term?


    In addition, many developers assume that the library was written by security experts,
    designed to address the needs of the organization, and will be maintained in the
    future against all forms of exploits, bugs, and language/framework major version
    releases. Unless it is a library offered by a commercial company, at least one
    of these assumptions will be wrong. That is a risk the organization is willing
    to take?


    Leverage third-party IAM solutions that offer authentication and authorization
    whenever possible. Avoid implementing a custom authentication and authorization
    solution, as it will expose the API to malicious attacks that take advantage of
    weak or abandoned code.


    # Summary


    API design requires considering how an API will be protected from malicious attackers.
    Unprotected APIs are an open door that welcome attackers to damage an organization
    and its customers. An API protection strategy involves the implementation of the
    right components, selection of an API gateway solution, and integrating an identity
    and access management to tie it all together.


    Don''t leave API protection to someone''s side project or to a well-intentioned
    team within the organization. Select the right approach with vendor-supported
    components that ensure that the front door of the organization''s APIs is barred
    shut rather than left unlocked.'
  merge: -1
  img_proc: true
