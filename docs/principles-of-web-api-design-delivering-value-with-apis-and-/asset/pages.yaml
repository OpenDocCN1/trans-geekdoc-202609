- pgno: 172
  md: '# CHAPTER 8 RPC and Query-Based API DESIGN


    While the REST-based API style comprises most API products available in the market

    today, that may not always be the case. Nor is a REST-based API style always the
    best

    for every API. As an API designer, it is important to understand the options

    available and the tradeoffs of each API style to determine the best fit for the
    target

    developers who consume the API.


    Remote call (RPC)-based and query-based APIs are two

    additional API styles beyond REST. RPC-based APIs have been available for decades

    but have begun to experience a resurgence through the introduction of gRPC. Query-

    based APIs are gaining popularity owing to the introduction of GraphQL, making

    it the choice for many frontend developers who wish to have greater control over
    the

    shape of API responses.


    With multiple API styles available, it is important to understand the advantages

    de challenges of each API style. For some API products and platforms, a single
    API

    style may be sufficient. For others, a mixture of intended uses and preferences
    for the

    developed tasked with integrating the API may require a mixture of API styles.


    This chapter explores RPC- and query-based API styles and how they may be

    as an alternative or supplement to REST-based (Figure 8.1). The chapter also

    defines a design process for RPC- and query-based API styles based on the API

    profiles captured during the Design phase outlined in Chapter 6, "API Modeling."


    # What Is an RPC-Based API?


    RPC-based APIs execute a unit of code, the procedure, over the network as if it
    were

    exuting locally. The client gets a list of available procedures that may be

    voked on the server. Each procedure defines a typed and ordered parameter list
    and

    the structure of a response structure.


    It is important to recognize that the client is tightly coupled to the server’s

    procedure. If the procedure on the server is modified or removed, it becomes the

    responsibility of developers to accommodate the changes. This includes modifying

    the code so that the client and server are in sync and communicating properly

    once more. However, with this tight coupling often comes better performance.


    RPC-based APIs must agree to a specification that supports the marshaling

    of the procedure invocation for the target programming language(s). In the early

    days of Java, the use of the remote method invocation (RMI) libraries supported

    Java-to-Java communication, with Java''s object serialization capabilities used

    as the binary format exchanged between Java processes. Other popular RPC

    standards include CORBA, XML-RPC, SOAP RPC, XML-RPC, JSON-RPC,

    and gRPC.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Following is an example of a JSON-RPC call over HTTP. Notice the explicit mention
    of the method (the procedure) and the ordered parameter list that results in a
    tight coupling between client and server:


    ```

    POST https://rpc.example.com/calculator-service HTTP/1.1

    Content-Type: application/json

    Content-Length: ...application/json

    ```


    ```

    {"jsonrpc": "2.0", "method": "Subtract", "params": [42, 23], "id": 1}

    ```


    Most RPC-based systems take advantage of a helper library and code generation
    tooling to generate the client and server stubs that are responsible for network
    communications. Those familiar with the fallacies of distributed computing recognize
    that failures can occur whenever code is executed remotely. One of RPC''s goals
    is to remove invocation behavior as if it is calling a local procedure, network
    outages and failure-handling support is often incorporated into the client and
    server stubs and raised as an error.


    The remote procedures are defined using an interface definition language (IDL).
    Code generators use the IDL to generate the client stub and a server skeleton
    that is ready for implementation. RPC-based APIs are generally faster to design
    and implement for this reason but are less resilient to method renaming and reordering
    of parameters.


    # The gRPC Protocol


    gRPC was created by Google in 2015 to speed the development of services through
    the use of RPC and code generation. Initially started as an initiative, it has
    since released and adopted by many organizations and open-source initiatives,
    including Kubernetes.


    gRPC is built upon HTTP/2 for transport and Protocol Buffers for serialization.
    It also leverages the bidirectional streaming offered by HTTP/2, allowing the
    client to stream data to the server and the server to stream data back to the
    client. Figure 8.2 shows how multiple programming languages communicate using
    generated client stubs with a gRPC server within a GoLang-based service.


    +   1. Wikipedia, s.v. "Fallacies of Distributed Computing," last modified July
    24, 2021, 20:52, https://wikipedia.org/wiki/Fallacies_of_distributed_computing.

    2. https://developers.google.com/protocol-buffers.'
