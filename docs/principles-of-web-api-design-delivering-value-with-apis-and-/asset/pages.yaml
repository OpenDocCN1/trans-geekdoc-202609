- pgno: 130
  md: 'First, assess the business and competitive value that the API offers. Ask the
    following questions to assess the value that each API brings:


    +   - Does the API help provide a competitive advantage over other market offerings?

    - Does the API reduce the cost of doing business, perhaps by reducing manual processes?

    - Does the API create a new revenue stream or improve an existing stream?

    - Is the API producing business intelligence, market insights, or decisioning
    factors?

    - Does the API automate repetitive tasks that free the organization for more critical
    business functions?


    If the answer to all the questions is no, then the value produced is low. Answering
    yes to one or more results in the API offering value to the business or marketplace.


    Next, size the effort to build each API from scratch. One approach is to use a
    relative sizing approach by classifying the APIs as small, medium, or large. Consider
    the details surfaced during EventStorm and write activity steps to estimate the
    size and complexity to build the API from the ground-up.


    Finally, determine if there are existing APIs that can be leveraged or extended.
    These APIs may be commercial-off-the-shelf (COTS) APIs, internal APIs produced
    by another team, or open-source solutions that can be leveraged to speed delivery.
    Organizations often forget this step, resulting in wasted time and effort building
    duplicate or however APIs. Performing this step encourages organizations to reuse
    APIs first and build new APIs only when necessary.


    Figure 6.12 shows a tabular format that captures examples of these details for
    JSON''s Bookstore API profiles modeled in this chapter.


    # Summary


    API modeling helps to bring together the insights and artifacts produced in the
    Align phase of the design process into a model that describes the scope and intent
    of the APIs required. Review the following checklist to ensure nothing was missed:


    +   - Resource taxonomies identify the properties of each resource along with
    the relationships and dependencies among them.'
  merge: -1
