    The facilitator is responsible for asking the group clarifying questions to ensure
    the narrative is properly formed. Find the starting domain event for the narrative,
    then seek to find the next domain event and place it after the first. Leave plenty
    of space on the canvas to insert them as needed.


    It is common for sessions to become stuck if there are branching or parallel narratives.
    To expedite the session, select a single narrative and order the domain events
    accordingly. Branching or parallel narratives may be captured below the primary
