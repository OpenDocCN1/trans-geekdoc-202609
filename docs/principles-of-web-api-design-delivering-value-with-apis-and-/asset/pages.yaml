- pgno: 257
  md: 'To offer a great CLI experience, API teams need to become students of human-first
    CLI design. The excellent *Command Line Interface Guidelines*² site offers in-depth
    details on how to design a human-first CLI based on 40 years of patterns and practices
    across tooling and operating systems.


    Also, teams should seek to understand the pipe and filter design pattern commonly
    seen "nix tools such as `sed`, `awk`, and grep to better understand how tool chaining.
    Finally, carefully examining popular CLIs from Kubernetes, Heroku, and others
    help teams see how to design a user-friendly CLI that wraps remote APIs.


    # Using Code Generators for Helper Library and CLI Generation


    Whether a small team is tasked with delivering multiple APIs in quick succession
    or an organization is scaling its API program, leveraging code-generation tools
    is essential. Code generation ensures APIs are delivered consistently and at scale
    by incorporating boilerplate code and common patterns. While some API styles such
    as gRPC rely heavily on code generation, other API styles consider code-generation
    as optional. Code generators are helpful to generate SDKs and helper libraries
    consistently across a variety of target programming languages.


    For REST-based APIs, the Swagger Codegen³ project is the most popular. This project
    offers open-source client-side code generators for a variety of programming languages.
    Another popular option for REST-based APIs is APIMatic,⁴ which is a freemium tool
    that offers code-generation support. All of these tools generate client code based
    on an OAS description file. The resulting code may be packaged up and distributed
    by the API team.


    Some organizations have found that creating their own client-side generators is
    a better option. While doing so requires more investment, the generated code can
    be customized as needed. For example, code can be customized to track rate limiting,
    detect special error response codes, and incorporate retry loops where appropriate.


    +   2. Anand Prasad, Ben Fishman, Carl Tashian, and Eva Parish, *Command Line
    Interface Guidelines*, accessed August 20, 2021, https://cli.dev.

    3. https://swagger.io/tools/swagger-codegen

    4. https://www.apimatic.io'
  merge: -1
