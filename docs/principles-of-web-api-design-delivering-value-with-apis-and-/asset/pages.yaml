    +   4. **Refine:** Refines the API design through feedback from developers, in
    addition to documentation, prototyping, and testing efforts


    There are seven steps across the phases, which are explored in-depth for the remainder
    of this book:


    +   1. **Identify digital capabilities:** Identify the customer needs and desired
    outcomes, including the corresponding digital capabilities that are required.


    +   2. **Capture activity steps:** Expand the digital capabilities to include
    a unified understanding and clarity through collaborative API design sessions.


    +   3. **Identify API boundaries:** Group the digital capabilities into API boundaries
    and determine whether the APIs already exist or new APIs are required.


    +   4. **Model API profiles:** Use a collaborative API modeling session to define
    the high-level API design, including resources and operations into an API profile.


    +   5. **High-level API designs:** Select one or more API styles that each API
    profile will offer and document the high-level design elements.


    +   6. **Refine the design:** Incorporate design feedback from API consumers using
    techniques that encourage improvement in the developer experience.


    +   7. **Document the API:** Complete the API documentation, including reference
    documentation and getting started guides, to accelerate integration.


    Figure 2.4 summarizes the ADDR process that supports an API design first approach.


    The process achieves the following goals:


    +   Deliver an API design that emphasizes and solves the customer problems using
    a vocabulary they understand.


    +   Reduce the constant design churn common with informal design processes.


    +   Optimize the entire organization, not just developers, for API design and
    delivery.


    +   Avoid unnecessary steps whenever possible to expedite delivery.


    +   Create a repeatable process that delivers an API design with a mixture of
    technical and nontechnical roles, some of don''t fully understand the nuances
    of API design but are able to contribute their insights.'
