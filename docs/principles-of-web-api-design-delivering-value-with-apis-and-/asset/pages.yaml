    }\n```\n\nAPIs clients can be designed to use the next link to follow the search\
    \ results page by page until the next link is no longer present, indicating all\
    \ search results have been processed.\nAPIs that offer hypermedia controls help\
    \ to create context-driven responses. These controls are able to indicate what\
    \ operations are possible, or not, based on the presence or absence of hypermedia\
