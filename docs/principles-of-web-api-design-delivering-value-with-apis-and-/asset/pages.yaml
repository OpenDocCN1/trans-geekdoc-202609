- pgno: 44
  md: '# CHAPTER 1 THE PRINCIPLES OF API DESIGN


    Web APIs extend these concepts by grouping related API operations for high cohesion
    while ensuring that the internal details are encapsulated to encourage a loosely
    coupled API design.


    # Resource-Based API Design


    A resource is a digital representation of a concept, often an entity or collection
    of entities that may change over time. It consists of a unique name or identifier
    that can reference documents, images, collections of other resources, or a digital
    representation of anything in the real world such as a person or time. Resources
    may even represent business processes and workflows.


    Resource-based APIs focus on interactions across a network, independent of how
    they are stored in a database or manifested as objects. They offer different operations,
    or affordances, possible interactions with a specific resource. In addition, resources
    support multiple representations that allow a Web app, mobile app, and reporting
    tool to interact with the resource using different media formats as JSON or XML.


    # Resources Are Not Data Models


    It is important to recognize that resources are not the same as a data model that
    resides with a database. The data model, often reflected as a schema design in
    a database, is optimized for the read and write interactions necessary to support
    the I/O performance and reporting needs of a solution.


    While data may be part of an API, the data model should not be used as the basis
    of API design. Data models meet a set of requirements, including read and write
    performance, optimized data storage, and optimized query support. Data models
    are optimized for the internal details of an application.


    Like the choice of programming languages and frameworks, the choice of data types
    and changes over time directly to a data or object model expose these internal
    implementation details to API consumers. The result is a more fragile API that
    must introduce significant design changes when the data model changes.


    Web API seeks to achieve a different set of goals, including delivering outcomes
    and experiences, optimized network access, and programming language independence.
    Because APIs involve integration between systems, they should remain stable over
    a long period of time, whereas data models may change to accommodate new or changing
    data access requirements.


    While APIs may have an impact on the data model, an API design should evolve independently
    from the latest database trends.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# What Happens When Teams Expose a Data Model as an API?


    **Constant code changes:** Database schema changes will result in a constantly
    changing API, as the API must keep in lockstep with the underlying database. This
    change to the data model consumers into a complex conform relationship in which
    they must rewrite their API integration every time the underlying data model changes.
    This hindrance may be overcome by an anticorruption layer that isolates a unit
    of code from these. However, the constant flow of the API creates a high cost
    of development as downstream developers maintain the anticorruption layer.


    **Create network chattiness:** Exposing link tables as separate API endpoints
    causes API “chattiness,” as the consumer is forced to make multiple API calls,
    one for each table. This is similar to how an n+1 query problem degrades performance.
    While an n+1 problem can be a performance bottleneck for databases, API chattiness
    has a devastating impact on API performance.


    **Data inconsistencies:** Not only performance suffer from network chattiness,
    but the n+1 problem also results in data inconsistencies. Clients are forced to
    make multiple API calls and stitch the results together into a single unified
    view. This may result in incomplete or corrupted data due to inconsistencies,
    perhaps across transactional boundaries, that occur from multiple API requests
    to obtain necessary data.


    **Confuse API details:** Columns optimized for query performance, such as a CHAR(1)
    column that uses character codes to indicate status, become meaningless to API
    consumers without additional clarification.


    **Expose sensitive data:** Tools that build APIs that mirror a data model expose
    all columns with a table using SELECT FROM [table name]. This also exposes data
    that API consumers should never see, such as personally identifiable information
    (PII). It may also expose data that hackers compromise systems through a better
    understanding of the internal details of the API.


    # Resources Are Not Object or Domain Models


    API resources are not the same as objects in an object-oriented codebase. Objects
    support collaboration within a codebase. Objects are often used to map data models
    into code for easier manipulation. They suffer from the same issues as exposed
    data models: constant code changes, network chattiness, and data inconsistencies.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Likewise, domain models, typically comprised of objects, represent the specific
    business domain. They may be used in a variety of ways to address the needs of
    the system. They may traverse different transactional contexts based on how they
    are applied. Web APIs, however, are most effective when they take transactional
    boundaries into consideration rather than directly exposing internal domain or
    object behavior.


    Keep in mind that API consumers don''t have the luxury of seeing the details of
    a data model and all the code behind an API. They didn''t sit in the endless meetings
    that resulted in the multitude of decisions that drove a data model design. They
    don''t have the context of why data model design decisions were made. Great APIs
    avoid leaking internal details, including database design choices, by shifting
    from data design to message design.


    # Resource-Based APIs Exchange Messages


    Resource-based APIs create a conversation between the business and a user or remote
    system. For example, suppose a user of a project management application was conversing
