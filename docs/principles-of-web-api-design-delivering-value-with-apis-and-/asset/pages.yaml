    # Components of API Protection


    There are several components that may be used to protect APIs. When combined,
    these components form the foundation of a security strategy for APIs.


    # API Gateways


    API gateway is both a pattern and a classification of middleware. The API gateway
    pattern involves the addition of an extra network hop that the client must traverse
    to access the API server.


    API gateway middleware is responsible for externalizing APIs across network boundaries.
    They may act as a pass-through or perform protocol transformation as part of the
    process. The API gateway becomes a central gatekeeper for all traffic in and of
    the API.


    API gateway may be standalone products or a component within a larger product
    offering, such as an API management layer. API gateways may be built from the
    ground up, some gateways are composed from building blocks as a reverse proxy
    and plug-ins to enable the features needed. API gateways rarely address more advanced
    features needed to manage APIs as products. These concerns are offered by API
    management layers.


    # API Management


    API management layers, or APIMs, include an API gateway but also extend their
    capabilities to include a complete API lifecycle management solution. The solution
    includes publishing, monitoring, protecting, analyzing, and monetizing APIs. It
    may also include community engagement features.'
  merge: -1
  img_proc: true
