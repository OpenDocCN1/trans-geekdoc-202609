- pgno: 283
  md: "Code examples come in a variety of forms, from just a few lines that demonstrate\
    \ how a specific operation works to more complex examples that demonstrate a complete\
    \ workflow.\n\n# Write Getting Started Code Examples First\n\nInitially, the developer\
    \ must overcome basic understanding of the API and how it will solve their problem.\
    \ It is important to remember that during this phase, the developer just wants\
    \ to see something working.\n\nTime to First Hello World, or TTHW, is a key metric\
    \ for determining API complexity. The longer it takes to get developers to their\
    \ first \"win\", the more likely they are to struggle with the API and abandon\
    \ it or build their own solution.\n\nTo help developers get started quickly, provide\
    \ concise examples that remove the need for explicit coding. Look at the following\
    \ example from Stripe:\n\n```\nrequire \"stripe\"\nStripe.api_key = \"your_api_token\"\
    \nStripe::Token.create({\n  card => {\n    :number => 424224242424242,\n    :exp_month\
    \ => 6,\n    :exp_year => 2024,\n    :cvc => \"314\"\n  }\n})\n```\n\nNotice in\
    \ this example there is no code to write. The developer only needs to fill in\
    \ their API key to obtain a credit card token in their sandbox environment.\n\n\
    Example code that requires developers to write lots of code should be avoided\
    \ at this stage to achieve a lower TTHW. Never require developers to write code\
    \ to complete an example when first trying out the API. Instead, make it easy\
    \ to start and see the request work successfully.\n\n# Expanding Documentation\
    \ with Workflow Examples\n\nAfter developers have had time to try the API using\
    \ some code examples, the next step is to begin to demonstrate use cases and workflows.\n\
    \nWorkflow examples focus on achieving specific outcomes. These examples offer\
    \ complete understanding of production-ready coding conventions. The use of inline\
    \ comments is helpful to explain why each step is necessary. Use hardcoded"
  merge: -1
  img_proc: true
