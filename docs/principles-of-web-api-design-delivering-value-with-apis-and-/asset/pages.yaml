    \ time limit is exceeded, the reservation is invalidated or deleted from the system\
    \ and the API client begins again.\n\n# Looking for More Patterns?\n\nThese are\
    \ only a few of the design patterns useful for REST and other API styles. Refer\
    \ to the API workshop examples^16 GitHub repository for more pattern resources.\n\
    \n# Summary\n\nWhen speaking about REST-based APIs, many conflate the idea of\
    \ CRUD-based APIs that use JSON with the REST architectural style. However, REST\
    \ defines a set of architectural constraints that help APIs mimic the best aspects\
    \ of the Web. Of course, REST APIs may apply various design patterns, including\
    \ CRUD, to produce an approachable interaction model for resources.\n\nBy applying\
    \ a five-step design process, a resource-based API design is created that applies\
    \ the REST constraints to the API profiles created during the API modeling process.\
    \ Mapping the design into machine-readable API description allows tools to generate\
    \ documentation for review by the team and the initial set of developers that\
    \ will consume the API.\n\nWhat if REST isn't the right API style for some or\
    \ all the APIs identified during API modeling? Chapter 8 examines how GraphQL\
