    # Passwords and API Keys


    Some APIs choose to allow API clients to provide their username and password credentials
    that are used to log in to the Web or mobile application. While this is an easy
    way to get started, it is highly discouraged for several reasons:


    +   - Passwords are fragile because they change often, which would render any
    code unable to use the API until it is updated with the new password.


    +   - Delegating access to some or all data to third parties requires sharing
    the password with them.


    +   - The use of username and password does not support multifactor authentication.'
