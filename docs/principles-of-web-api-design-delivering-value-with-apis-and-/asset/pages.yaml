  md: '# CHAPTER 3 IDENTIFY DIGITAL CAPABILITIES


    Job stories were created by Alan Klement⁴ and are based on JTBD formulated by
    Christensen. They offer a simple framework to capture all the aspects of the job

    to be done.


    Teams producing job stories will find their API designs focus more on the desired
    outcomes of the audience. They will also have the details necessary to create
    acceptance criteria for automated tests. It is important to note that job stories

    sn''t contain implementation specifications. Instead, they should elaborate on
    what

    to to happen to make the necessary progress to deliver the outcome.


    The ADDR process leans heavily on job stories to capture business requirements
    in a customer-centric way. Job stories express customer requirements in a simple
    format\and provide a natural way to identify digital capabilities that will drive
    API design.


    # The Components of a Job Story


    Job stories are composed of three components using the “When, I want to, so I
    can"

    format:


    +   1. **When:** The triggering event to establish causality is the situation
    or reason why the customer chooses the outcome. Triggering events are key indicators
    for when an API will be used.


    +   2. **I want to:** The capability is what the customer has identified as the
    action that needs to be taken. The capability identifies the important role that
    the API will

    play to deliver the desired outcome. It is also used to deconstruct the opera-

    tions that the API will deliver.


    +   3. **So I can:** The outcome is the desired end state. It is the result of
    applying thencapability when the triggering event occurs. The outcome delivers
    the accep-

    trance for the API design.


    Figure 3.2 shows an example Forgot Password job story, highlighting its three

    components.


    The job story in Figure 3.2 demonstrates how a job story may be used to

    in the design of a digital capability. In this case, it captures a digital capability

    treet Reset My Password. This is one of many digital capabilities the API must
    offer

    to meet the needs of the target customers.


    > ⁴. Alan Klement, “Replacing the User Story with the Job Story,” JTBD.info, November
    12, 2013, https://njtbd.info/replacing-the-user-story-with-the-job-story-af7cdee10c27.'
