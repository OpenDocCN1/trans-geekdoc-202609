    the response and not additional images, stylesheets, JavaScript, and so on. The
    HTTP client is responsible for parsing the HTML, identifying the tags that reference
    these additional assets, and sending subsequent HTTP requests for each one. For
    a Web page with 20 images, 21 separate HTTP requests are required to gather all
    of the files necessary to retrieve the Web page—one request for the HTML page,
    along with the 20 requests necessary to retrieve each image.


    # Common HTTP Methods


    HTTP methods inform the server what kind of operation or interaction the client
    would like to perform. Common interactions include retrieving a resource, creating
    a new resource, performing a calculation, and deleting a resource.


    The following HTTP methods are commonly encountered when using Web-based APIs:


    +   - GET: Retrieves a resource from the server—response may be cached by the
    server or an intermediary caching server

    - HEAD: Requests only the response headers but not the actual response body'
  merge: -1
  img_proc: true
- pgno: 342
  md: '+   POST: Submits data to the server, often for storage or for calculations—nresponse
    not cacheable


    +   PUT: Submits data to the server, often as a replacement of existing data—nresponse
    not cacheable


    +   PATCH: Submits data to the server, often as a partial update of existing data—nresponse
    not cacheable


    +   DELETE: Deletes an existing resource on the server—response not cacheable


    HTTP methods have additional semantics that are important for clients to take
    into consideration: safety and idempotence.


    A safe method indicates that the HTTP method will not generate side effects, such
    as altering data. This is common for GET and HEAD methods, as they are intended
    for resource retrieval and do not alter data. APIs that implement altering operations
    using safe HTTP methods risk generating unpredictable results, especially when
    middleware, such as caching servers, are involved.


    Idempotent methods ensure that the same side effects are produced when identical
    requests are submitted. This is true for GET and HEAD retrieval methods because
    no data is altered. PUT and DELETE are guaranteed by the HTTP specification to
    be idempotent, as PUT replaces the resource with a completely new representation
    and DELETE removes the resource from the server.


    POST is not guaranteed to be idempotent, as it may create new resources on each
    subsequent request or alter data in way that is not guaranteed to produce the
    same results (e.g., incrementing a value). Likewise, PATCH is not idempotent,
    as only a subset of fields, rather than the entire resource, is altered.


    Figure A.5 summarizes the semantics of the common HTTP methods used for Web-based
    APIs.


    | Method | Safe | Idempotent |

    |---|---|--|

    | GET | Yes | Yes |

    | POST | No | No |

    | PUT | No | Yes |

    | PATCH | No | No |

    | DELETE | No | Yes |

    | HEAD | Yes | Yes |

    | OPTIONS | Yes | Yes |


    **Figure A.5** Common HTTP methods used with APIs, including safety and idempotency
    traits that help guide the client on how to recover from errors.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# HTTP Response Codes


    HTTP responses include a response code that indicates to the API consumer whether
    the request succeeded or failed. HTTP provides a series of response codes that
    the API server can send back to the client to indicate the result.


    HTTP response status codes belong to four primary response codes families:


    +   - 200 codes indicate that the request was processed successfully.

    - 300 codes indicate that the client may need to take additional action(s) to
    complete the request, such as follow a redirect.

    - 400 codes indicate a failure in the request that the client may wish to fix
    and resubmit.

    - 500 codes indicate a failure on the server that is not the fault of the client.
    The client may attempt a retry at a future time, if appropriate.


    Table A.1 offers a list of the common response codes from the HTTP specification
    that are used by REST-based APIs.


    Table A.1 Common HTTP Response Codes Used in API Design

    | HTTP Response Code | Description |

    |---|---|

    | 200 OK | The request has succeeded, |

    | 201 Created | The request has been fulfilled and resulted in a new resource
    created. |

    | 202 Accepted | The request has been accepted for processing, but the processing
    has not been completed. |

    | 204 No Content | The server fulfilled the request but does not need to return
    a body. This is for delete operations. |

    | 304 Not Modified | The server determined that the content has not changed since
    the last request as determined by the client-provided If-Modified-Since or If-None-Match
    request header. |

    | 400 Bad Request | The request could not be understood by the server due to malformed
    syntax. |

    | 401 Unauthorized | The request requires user authentication. |

    | 403 Forbidden | The server understood the request but is refusing to fulfill
    it. |

    | 404 Not Found | The server has not found anything matching the requested URL.
    | |

    | 412 Precondition Failed | The client submitted a request with a condition based
    on the last modified timestamp or ETag, and the condition failed. The client should
    refetch the resource and attempt the change again, if desired. |'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# APPENDIX


    # Table A.1 (continued)


    | | |

    |---|---|

    | 415 Unsupported Media Type | The server was unable to respond with any of the
    client-supplied media types supported as specified in the Accept header. |

    | 428 Precondition Required | The server requires a preconditioning header to
    be supplied before the request may be processed. Often enforced where concurrency
    control headers are required. |

    | 500 Internal Server Error | The server encountered an unexpected condition that
    prevented it from fulfilling the request. |


    # Content Negotiation


    Content negotiation allows clients to request one or more preferred media type(s)
    for the server response. With content negotiation, a single operation may support
    different resource representations, including CSV, PDF, PNG, JPG, SVG, and others.

    The client requests the preferred media type using the Accept header. This example
    demonstrates an API client requesting a JSON-based response:


    ```

    GET https://api.example.com/projects HTTP/1.1

    Accept: application/json

    ```


    More than one supported media type may be included in the header, as shown in
    this example:


    ```

    GET https://api.example.com/projects HTTP/1.1

    Accept: application/json, application/xml

    ```


    The asterisk may be used as a wildcard when selecting media types. A text/* indicates
    that any subtype of the text media type is acceptable. Specifying a value of */
    indicates that the client will accept any media type in the response. This is
    a common scenario for browsers, which will prompt the user to save the file or
    launch a choice when encountering an unknown media type. However, for clients
    working with an API, it is important to be explicit to avoid runtime errors that
    could occur when encountering an unknown or unsupported content type.


    Requests may specify for specific media types supported within the Accept header
    through the use of quality factors. Quality factors are expressed as a value between
    0 and 1 that helps to assign a preferred order of media types. The API server
    reviews the header values and return the response using the content type that
    matches both what the server supports and what the client requested. If the server
    cannot respond with an accepted content type, it returns a 415 Unsupported Media
    Type code.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# CACHE CONTROL 311


    Here is an example of using qvalues to specify a preference for XML, with JSON
    also supported if XML is unavailable:


    ```

    GET https://api.example.com/projects HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0

    ```


    The use of qvalues allows API client to support a specific type, perhaps XML for
    improved transformation capabilities and JSON as a fallback.

    Because API clients may specify more than one media type, they must pay special
    attention to the Content-Type header to determine which parser is appropriate.
    The following is a response that provides XML based on the previous example:


    ```

    HTTP/1.1 200 OK

    Date: Tue, 16 June 2015 06:57:43 GMT

    Content-Type: application/xml


    <project>...</project>

    ```


    Content negotiation extends the media support of an API beyond a single type,
    such as JSON or XML. It allows some or all operations of an API to respond with
    the content type that best meets the needs of the API client.

    Likewise, language negotiation allows APIs to support multiple languages in a
    response. The approach is similar to content negotiation using the Accept-Language
    request header and Content-Language response header.


    # Cache Control


    The fastest request is the one that doesn''t need to be made. A cache is a local
    store of data to prevent re-retrieval of the data in the future, thereby optimizing
    network communications. Developers familiar with the term have likely used server-side
    caching tools such as Memcached to keep data in memory and reduce the need to
    fetch uncached data from a database to improve application performance.


    HTTP cache control allows for cacheable resources to be stored locally by API
    clients or intermediary cache servers. This moves the cache closer to the API
    client and reduces or removes the need to traverse the network all of the way
    to the backend API server. Users experience better performance and reduced network
    dependence.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'HTTP makes available several caching options through the Cache-Control response
    header. This header declares whether the response is cacheable, and if so, for
    how long it should be cached.


    Here is an example from an API operation that returns a list of projects:


    ```

    HTTP/1.1 200 OK

    Date: Tue, 22 December 2020 06:57:43 GMT

    Content-Type: application/xml

    Cache-Control: max-age=240


    <project>...</project>

    ```


    In this example, the max age indicates that the data may be cached for up to 240
    seconds (4 minutes) before the client should consider the data state.

    APIs may explicitly mark a response as not cacheable, requiring a new request
    each time the response is required:


    ```

    HTTP/1.1 200 OK

    Date: Tue, 22 December 2020 06:57:43 GMT

    Content-Type: application/xml

    Cache-Control: no-cache


    <project>...</project>

    ```


    Applying thoughtful use of the cache control header to APIs reduces network traffic
    and speeds up Web and mobile applications. It is also the building block for conditional
    requests.


    # Conditional Requests


    Conditional requests are a lesser known but powerful capability offered by HTTP.
    Conditional requests allow clients to request an updated resource representation
    only if something has changed. Clients that send a conditional request will either
    receive a 304 Not Modified response if the content has not changed or a 200 OK
    along with the changed content.


    There are two precondition types for informing the server about the client’s local
    cached copy for comparison: time-based and entity tag-based preconditions.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Time-based preconditions require that the client store the Last-Modified response
    header for later requests. The If-Modified-Since request header is then used to
    specify the last modified timestamp that the server will use to compare against
    the last known modified timestamp to determine if the resource has changed.

    Following is an example of a client/server interaction that uses the last modified
    in a subsequent request to determine the resource has changed on the server:


    ```

    GET /projects/12345 HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0


    HTTP/1.1 200 OK

    Date: Tue, 22 December 2020 06:57:43 GMT

    Content-Type: application/xml

    Cache-Control: max-age=240

    Location: /projects/12345

    Last-Modified: Tue, 22 December 2020 05:29:03 GMT

    ```


    ```

    <project>...</project>

    ```


    ```

    GET /projects/12345 HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0

    If-Modified-Since: Tue, 22 December 2020 05:29:03 GMT

    ```


    ```

    HTTP/1.1 304 Not Modified

    Date: Tue, 22 December 2020 07:03:43 GMT

    ```


    ```

    GET /projects/12345 HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0

    If-Modified-Since: Tue, 22 December 2020 07:33:03 GMT

    ```


    ```

    Date: Tue, 22 December 2020 07:33:04 GMT

    Content-Type: application/xml

    Cache-Control: max-age=240

    Location: /projects/12345

    Last-Modified: Tue, 22 December 2020 07:12:01 GMT

    ```


    ```

    <project>...</project>

    ```'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# 314 APPENDIX


    The entity tag, or ETag, is an opaque value that represents the current resource
    state. The client may store the ETag after a GET, POST, or PUT request, using
    the value to check for changes via a HEAD or GET request.


    An ETag is a hashed value of the entire response. Alternately, servers may provide
    a weak ETag, which is semantically equivalent but perhaps not an exact byte-for-equivalence.


    Here is a client/server interaction using ETags rather than the last modified
    date:


    ```

    GET /projects/12345 HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0


    HTTP/1.1 200 OK

    Date: Tue, 22 December 2020 06:57:43 GMT

    Content-Type: application/xml

    Cache-Control: max-age=240

    Location: /projects/12345

    ETag: "17f0fff99ed5ae4edffd6496d7311f"


    <project>...</project>

    ```


    ```

    GET /projects/12345 HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0

    If-None-Match: "17f0fff99ed5ae4edffd6496d7311f"


    HTTP/1.1 304 Not Modified

    Date: Tue, 22 December 2020 07:03:43 GMT


    GET /projects/12345 HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0

    If-None-Match: "17f0fff99ed5ae4edffd6496d7311f"


    HTTP/1.1 200 OK

    Date: Tue, 22 December 2020 07:33:04 GMT

    Content-Type: application/xml

    Cache-Control: max-age=240

    Location: /projects/12345

    ETag: "b252d66ab3ec050b5fd2c3a6263ffaf51db10ffcb"


    <project>...</project>

    ```'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'Conditional requests reduce the effort required to validate and refetch cached
    resources. ETags are opaque values that represent the current internal state,
    whereas last modified timestamps rather than ETags may be used for time-based
    comparison. They may also be used for concurrency control when making modifications
    to resources.


    # Concurrency Control in HTTP


    Concurrency control with HTTP is a challenge encountered by teams that need to
    support APIs that modify data by different users at the same time. Some API designers
    find clever ways to implement resource-level locking over HTTP. However, HTTP
    has built-in concurrency control that prevents teams from building it.


    Conditional requests are also used to support concurrency control in HTTP. By
    combining ETags or last modified dates with state change methods as PUT, PATCH,
    or DELETE, we can ensure that data is not overwritten accidentally by another
    API client via a separate HTTP request.


    To apply a conditional request, the API client adds a precondition to the request
    to prevent modification if the last modified timestamp or ETag of the resource
    has changed. The failure 412 Precondition Failed response is sent by the server.
    API servers may also enforce the requirement of a precondition header to enforce
    concurrency control by responding with a 428 Precondition Required response if
    neither of the conditional headers was found in the request.


    Following is an example in which two API clients are trying to modify a project.
    First, each client retrieves the project resource using a GET request, then each
    attempts a change, but only the first API client is able to apply the change:


    ```

    GET /projects/12345 HTTP/1.1

    Accept: application/json;q=0.5, application/xml;q=1.0

    nHTTP/1.1 200 OK

    Date: Tue, 22 December 2020 07:33:04 GMT

    Content-Type: application/xml

    Cache-Control: max-age=240

    Location: /projects/12345

    ETag: "b252d6ab33ec05b5fd2c3a6263ffaf51db10fcb"


    <project>...</project>

    ```'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# 316 APPENDIX


    ```

    PUT /projects/1234

    If-Match: "b252d6ab3ec050b5fd2c3a6263ffaf51db10fcb"

    ```


    ```

    { "name":"Project 1234", "Description":"My project" }

    ```


    ```

    HTTP/1.1 200 OK

    Date: Tue, 22 December 2020 08:21:20 GMT

    Content-Type: application/xml

    Cache-Control: max-age=240

    Location: /projects/12345

    ETag: "1d720c9d54e1a94cf730be411eff1424fffb6"

    ```


    ```

    <project>...</project>

    ```


    ```

    PUT /projects/1234

    If-Match: "b252d6ab3ec050b5fd2c3a6263ffaf51db10fcb"

    ```


    ```

    { "name":"Project 5678", "Description":"No, it is my project" }

    ```


    ```

    HTTP/1.1 412 Precondition Failed

    Date: Tue, 22 December 2020 08:21:24 GMT

    ```


    The second API client that received the failed precondition response must now
    refetch the current representation of the resource instance, inform the user of
    the changes, and request whether the user wishes to resubmit the changes or leave
    it as-is.


    Concurrency control may be added to an API through HTTP preconditions in the request
    header. If the ETag/last modified date hasn''t changed, then the request is processed
    normally. If it has changed, a 412 response code is returned, preventing the client
    from overwriting data as a result of two separate clients modifying the same resource
    concurrently. This is a powerful capability built into HTTP, preventing the need
    for teams to invent their own concurrency control support.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Summary


    HTTP is a powerful protocol with a robust set of capabilities, including some
    that are less known. Using content negotiation allows API clients and servers
    to agree on a supported media type. Cache control directives provide client-side
    and intermediary caching support. HTTP preconditions can be used to determine
    if expired caches are still valid while protecting resources from overwriting
    changes. By applying these techniques, teams are able to build robust APIs that
    drive complex applications in a resilient and evolvable way.'
  merge: -1
  img_proc: true
