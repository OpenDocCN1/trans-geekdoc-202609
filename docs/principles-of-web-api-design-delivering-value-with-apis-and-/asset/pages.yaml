- pgno: 258
  md: '# Summary


    API design doesn''t stop with the details of API operations and protocol semantics.
    It requires thoughtful consideration regarding how the API will be integrated
    by developers. While some code decisions are important for the API provider, these
    are internal concerns that do not have a direct impact on the many API consumers
    that will use the API. The more complex the API, the more (e.g., API mocks, helper
    libraries, CLIs) is required to support the design and delivery process.


    API teams must consider how their decisions may have a positive or negative impact
    on future API consumers. Avoid making decisions that provide local optimizations
    for a few developers, instead opting to make global optimizations for the many
    current and future consumers of the API.'
