- pgno: 235
  md: '# MICROSERVICE ARCHITECTURE STYLES 201


    Asynchronous microservices offer several advantages. The greatest advantage is
    that new microservices can be brought online to replace older ones without the
    knowledge of the consumer. The new microservice subscribes to the same topic and
    queue and begins processing messages.


    In addition, consumers have the flexibility to use one or more of the following
    interaction patterns, as needed: fire-and-forget, fire-and-listen for events,
    or fire-and-follow-up using the provided response URL.


    Finally, asynchronous error handling and recovery is built in message brokers
    and streaming solutions. Avoiding the need for synchronous call chaining error
    recovery greatly simplifies the infrastructure requirements, reducing or eliminating
    the need for a service mesh.


    Of course, asynchronous integration is a more complex interaction than a standard
    request/response approach. Developers must learn to integrate with asynchronous
    services and handle failures by checking for error response messages and unprocessed
    messages using dead letter queues (DLQs).


    # Microservice Architecture Styles


    A microservice-based architecture is not limited to a single style or approach.
    There are three common styles of applying microservices. Each offers a slight
    variation on how microservices may be used to reduce coordination between teams.
    Some have chosen to apply one or more of these styles in combination to support
    the needs and culture of the organization.


    # Direct Service Communication


    In this style, each service communicates with other services directly using a
    synchronous or asynchronous model. This approach is the most common style found
    during the early days of microservices. Using a synchronous model encounter challenges
    such service communication failure and call chain fragility. The introduction
    of a service mesh helps overcome these challenges, as does the shift to a more
    asynchronous model that is message driven. Figure 10.6 depicts this traditional
    microservice architecture style.


    # API-Based Orchestration


