- pgno: 69
  md: '# WHAT ARE JOB STORIES?


    In JTBD, jobs are more than just functions that need to be performed. Jobs are
    really about the desired outcome or accomplishment. Jobs may be new and unresolved
    or may be solved in some way that doesn''t quite meet the customers'' needs. A
    product that produces the desired outcome is one that considers all of these factors
    about the jobs to be done. JTBD applies to APIs as well as all other aspects of
    product and software design with the organization.


    The idea behind JTBD is rooted in the voice of the customer (VOC)³ from the mid-1980s,
    product managers attempted to improve product performance by getting into the
    mindset of the customer. VOC combines market research data with specific waits
    and needs that have been identified through surveys and customer interviews.


    Christensen also reminds us that there is an emotional and social side to the
    jobs that a product attempts to solve. The job extends beyond the immediate problem
    to include a reduction or removal of the anxiety involved. The product should
    provide a positive experience while producing progress toward the desired outcome.
    May even go so far as to enjoyment while completing the job.


    # Principle 2: API design starts with an outcome-based focus


    A focus on the outcome ensures the API deliver value to everyone. This requires
    a product-thinking approach to API design rather than one is driven purely by
    data and systems integration. The ADDR process is focused on identifying and realizing
    these outcomes.


    # What Are Job Stories?


    Customers and users don''t care about APIs, microservices, serverless, or the
    flavor of frontend framework used. They want a solution to a problem. They care
    about outcomes.


    Job stories capture the jobs to be done for any product, including the customer
    motivations, events, and expectations for a new product, service, or API. They
    frame every design problem from the perspective of the customer. Job stories seek
    to identify the problems that customers have and the eventual outcome they wish
    to achieve. Jobs are identified that will solve these problems. APIs will offer
    digital capabilities that will power these JTBD to produce the desired outcome.


    > 3. Wikipedia, s.v. "Voice of the Customer," last modified July 15, 2021, 12:112,
    https://en.wikipedia.org/wiki/Voice_of_the_customer.'
  merge: -1
  img_proc: true
