  md: '# 282 CHAPTER 15 PROTECTING APIs


    This preference had a considerable impact on the organization''s choice for API
    management deployment. It also forced the organization to consider an independent
    APIM vendor to avoid using two separate API gateways, for each cloud vendor. Be
    sure to factor such considerations into an API management strategy architecture
    to avoid vendor lock-in and losing potentially lucrative business.


    # API Network Traffic Considerations


    It is important to include network communication considerations as part of establishing
    an API security strategy. The traffic entering an existing data center requires
    different treatment than traffic within the data center. This difference has an
    impact on how organizations manage their API network traffic.


    To better understand the decisions involved in API network traffic protection,
    it is important to review network topology concepts. When in doubt, consult a
    network engineer to establish a secure and efficient network topology for an-premises
    or cloud-based infrastructure.


    North-south traffic describes the flow of data in and out of the data center.
    Northbound traffic is exiting the data center. Southbound traffic is entering
    the data center. East-west traffic denotes the flow of data within a data center.


    In the case of request/response API styles, all API requests from applications
    outside the data center are considered southbound traffic, and API responses are
    northbound. The traffic between an API and a database, or service-to-service communications,
    is east-west traffic.


    Note with the introduction of zero trust architecture (ZTA), the differentiation
    between north-south and east-west traffic is decreasing. In ZTA, all traffic,
    corporate traffic, and virtual private network (VPN) traffic is viewed with no
    initial trust. Instead, all devices and services are required to establish their
    trust through per-request access decisions. This places even greater emphasis
    on establishing well-architected access policies that incorporate identity and
    access management, authentication, and authorization services combined with a
    comprehensive access control policy for every API, service, and application. More
    details on ZTA may be found in the NIST special publication on Zero Trust Architecture.¹


    +   ¹ Scott Rose, Oliver Borchert, Stu Mitchellchell, and Sean Connelly, Zero
    Trust Architecture (National Institute of Standards and Technology (NIST) Special
    Publication 800-207, August 2020), https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-207.pdf.'
