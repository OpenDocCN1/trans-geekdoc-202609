    are clearly marked to denote key transitions between steps. Figure 4.6 shows a
    fully explored Place an Order job story using the sticky notes necessary to express
    the understanding gained during the session.


    This completes the EventStorming session. The canvas should be saved for future
    reference, as it will be useful for informing future steps in the API design process.
    Considering taking photos of the canvas and sharing them with the team. Rolling
    the canvas or relocating it to a shared space is helpful for team members-colored
    in the same office space. If the team used a digital tool, such as Miro³ export
    the work as a PDF or image for sharing on a wiki or as part of other project assets.


    Finally, write the activities and activity steps identified during the session
    using the format outlined previously.'
