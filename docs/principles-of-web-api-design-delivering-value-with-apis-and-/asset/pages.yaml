- pgno: 66
  md: '# CHAPTER 3 IDENTIFY DIGITAL CAPABILITIES


    APIs are the most common manifestation of digital capabilities, as they power
    Web and mobile apps, partner integrations, and workforce solutions. They allow
    the casual or expert developer to take advantage of data, business processes,
    and internal systems systematically to produce desired outcomes. Organizations
    must develop the skills to identify digital capabilities (see Figure 3.1) and
    use them to shape the API design to help users produce results.


    The ADDR process starts with defining the digital capabilities necessary to deliver
    customer outcomes. It also elaborates on the specific activities and steps needed
    to deliver the outcomes, prior to designing the APIs.


    This chapter introduces the concepts of digital capabilities, explains how they
    relate to APIs, and outlines an approachable method for mapping requirements into
    a format that identifies necessary digital capabilities. These digital capabilities
    are then used to inform the design of product and platform APIs.


    # Ensuring Stakeholder Alignment


    As discussed in Chapter 2, "Collaborative API Design," API design is a communication
    process. It communicates the digital capabilities offered by an API to external
    and internal developers across team and organizational boundaries. Those outside
    of the API-producing team that will consume the API cannot, and should not, be
    required to read the actual code of the API to fully understand how it works.
    In fact, external developers may not have access to the source code at all. Therefore,
    the API design and any subsequent documentation should strive to communicate with
    developers in the simplest way.


    Effective API design incorporates the needs of customers. In this context, customers
    are defined as a segmented group of developers and end users whose experience
    will be shaped, for better or worse, by the API design. Keeping an API design
    in alignment with customer needs helps to deliver a great user and developer experience.


    An API design that misses the mark will deliver a poor experience, often requiring
    significant changes that will break existing integrations. Once an API has at
    least one integration in production, it is very difficult to convince internal
    or external teams to spend the time and money to upgrade to the next version of
    an API. This leaves no room for an API design that breaks existing integrations.
    Therefore, arriving at an API design that meets the needs of customers requires
    focused effort rather than guesswork.


    Unless the organization is small enough to support direct communication between
    developers and customers, multiple roles are involved with product definition:
    product owners, product managers, business analysts, software analysts, and account'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'managers, to name just a few. These roles represent the needs of the customers.
    An effective API design includes input from many roles across the organization,
    not just the technical details of how to push data in and out of a data store
    or legacy system.

    It is also necessary to create alignment between stakeholders and the development
    teams responsible for implementing the API. If the API lacks business context,
    it may meet the needs of customers but lack sufficient factors to meet business
    goals. If the API lacks a customer context, it may meet the needs of business
    but fail to deliver the desired outcomes of customers. If it lacks both, the API
    will serve no real purpose and efforts will have been wasted. In the ADDR process,
    digital capabilities are used to create alignment between business, customers,
    and technology to avoid these negative consequences.


    # What Are Digital Capabilities?


    Business capabilities describe the enablers an organization brings to market.
    Examples of business capabilities include consumer product design, manufacturing,
    and customer support.

    Digital capabilities are assets that turn desired outcomes into reality through
    automation. They offer the workforce, partners, and customers the ability to interact
    with the organization digitally. Digital capabilities may take the form of one
    or more technology solutions. Examples include REST APIs, Webhook-based asynchronous
    APIs for integration, SOAP services, message streams, and bulk data exchange through
    a nightly, weekly, or monthly file-based export process.

    Reviewing the digital capabilities offered by an in-house or competitor’s product
    or service provides greater insights into what the organization values, including
    the market segments address.

    Digital capabilities portfolio is the collection of digital capabilities offered
    by a product or organization. For organizations building a platform to connect
    two or more parties within a marketplace, the terms digital platform and platform
    capabilities may be more familiar.

    While digital capabilities may be mapped to business capabilities, they operate
    at different levels of concern. Business architects define business capabilities,
    such as customer service, and may associate key performance indicators (KPIs)
    or objectives (OKRs) to track growth. Digital capabilities focus on producing
    outcomes and include the activities required to deliver the business capabilities
    of the organization. Business capabilities describe the “what” of the organization;
    digital capabilities describe the “how.”'
  merge: -1
  img_proc: true
