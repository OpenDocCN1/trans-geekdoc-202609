    \nScheduled Time: 90–120 minutes\n\nNext, the domain event stickies are ordered\
    \ into a narrative from beginning to end. Along the way, duplicate events are\
    \ removed, and clarifications are made to ensure the events start to frame the\
    \ narrative.\n\n| Avoid | Preferred |\n|---|---|\n User Authentication Successful\
    \ | User Authenticated |\n| Place an Order | Order Placed |\n| Print Shipping\
    \ Label | Shipping Label Printed |"
