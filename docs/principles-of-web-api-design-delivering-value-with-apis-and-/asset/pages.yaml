    # Challenge 3: Additional User Context Is Needed


    User stories have the benefit of the “As a” phrase used to start the story. This
    phrase helps to identify the persona that the user story is designed to address.
    However, some products may end up with a long list of user stories that start
    with the same prefix—for example, “As a user,...”. If this is the case, then the
    persona isn''t a necessary detail after and just clusters the user story.


    The job story format by default doesn’t concern itself with the persona. However,
    there are times when the details about a persona help to shed additional context
    in a job story. In this case, substitute the persona name in the “I want to” clause,
    as demonstrated in this example:


    When a decision is needed on the dates for a special sale,

    A manager wants to produce a sales report with customized criteria

    So the manager can view the sales history and determine the best days to run the
    sale.


    This approach provides a nice blend between job stories and user stories.


