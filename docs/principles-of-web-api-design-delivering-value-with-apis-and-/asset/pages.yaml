- pgno: 109
  md: '# NAMING AND SCOPING APIs 75


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_109_0.png)


    **Figure 5.3** APIs identified through the shift in language on the EventStorm
    canvas.


    As an example, the activities and activity steps from Table 4.2 in the previous
    chapter are presented in Table 5.1. Notice the shift from Books to Cart, then
    to Order and Payment. These shifts provide a starting point for identifying boundaries,
    from which APIs are formed.


    # #Naming and Scoping APIs


    Next, the boundary is given a name to represent the API that will be designed.
    Seek to assign a name that includes the scope, outcome, or target audience. Examples
    of well-known API names include Twitter’s Followers API and eBay’s Seller API.'
  merge: -1
