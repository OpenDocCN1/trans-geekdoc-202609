- pgno: 92
  md: '# The Benefits of EventStorming


    Alignment between stakeholders and development teams is achieved through a shared
    understanding of terminology, processes, goals, and required integrations with
    internal and external systems. Questions are surfaced for follow-up after the
    session to prevent assumptions or misunderstandings from being captured into the
    API design and code. An EventStorming session helps everyone to surface these
    insights and communicate effectively through a fun and effective exercise.


    There are five additional benefits of conducting an EventStorming session:


    +   1. Shared understanding of requirements and scope of the problem modeled

    2. Shared understanding of the workflow processes, business rules, and constraints

    3. Establishment of a shared domain vocabulary, replacing multiple terms with
    a ubiquitous language

    4. Identification of unknowns that require follow-up and clarification prior to
    software design and development

    5. Identification of boundaries within the solution, useful for scoping team efforts
    and division of labor to minimize cross-team dependency


    There are circumstances when EventStorming is most effective:


    +   * Prior to API and microservice design and implementation to help establish
    outside-in design thinking

    * Prior to software design and development to clarify assumptions and address
    open questions

    * After clearly documenting desired outcomes, typically through the use of job
    stories, discussed in Chapter 3

    * When all roles are represented in the session

    * When embarking on a significant scope of effort or one that spans multiple teams'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'There are also circumstances when the value of an EventStorming session may
    be reduced. To avoid spending unnecessary time in an EventStorming session, consider
    these factors that contribute to an ineffective session:


    +   - The process is well known and documented, as results will likely produce
    the same insights.

    - The scope of the problem is small enough that the identified business requirements
    are sufficient and complete.

    - The business requirements have not yet been identified. In this case, start
    with constructing job, covered in Chapter 3, to clearly define the desired outcomes
    and parties involved.

    - Business stakeholders cannot attend or not see in the exercise. While development
    teams may still conduct a session, doing so may lead to a process based on too
    many technical assumptions that do not meet business needs

    - Software delivery has begun, and delivery dates are fixed. If the teams are
    early in the process, the output of the session may be used to make software architectural
    and design adjustments prior to a release. Otherwise, teams will be forced to
    proceed with existing decisions rather than the insights obtained through an EventStorming
    session


    # Who Should Be Involved?


    Including the right mix of attendees is critical for a successful EventStorming
    session. A session must involve a few representatives from various roles and responsibilities.
    It should be kept to no more than twelve people to ensure full participation by
    all attendees. Larger groups can prevent assertive attendees from engaging in
    the session.


    Optional participants that may raise the group size should be considered for inclusion
    on a case-by-case basis to avoid overloading the session with too many voices.
    With dozens of people often slow down or result in participants looking down at
    their phone or checking email. Smaller groups benefit from the need for smaller
    space when conducting an in-person session. Avoid observers whenever possible,
    as they dont add value and may distract from the session. Rarely do observers
    strictly observe.


    When selecting the participants for an EventStorming session, be sure to consider
    the following roles, in priority order:


    +   - Business owners, including those helping to define the requirements, such
    as product managers and product owners'
  merge: -1
  img_proc: true
- pgno: 94
  md: '+   2. SMEs with familiarity of the domain space


    +   3. Technical leads, architects, and senior developers involved in leading
    the soft-ware delivery


    +   4. Security experts, especially when the problem space requires the involvement
    of privacy or security concerns


    +   5. Individual software developers and contributors not involved with decision
    making (on a case-by-case basis only)


    # Facilitating an EventStorming Session


    A facilitator familiar with EventStorming is important. Facilitators are responsible
    for moving the process forward and keeping everyone engaged throughout the process.


    Emails and message notifications may lead to distractions, slowing down progress,
    causing questions to be missed, or preventing SMEs from answering clarifying questions.
    Remote sessions add only to the number of distractions possible, as it is easy
    to task switch. Facilitators must work towards preventing these issues by controlling
    the pace of the session and the frequency of breaks and providing clear transitions
    between each step in the process.


    When in doubt, facilitators need to evaluate discussions to determine if they
    are infringing or becoming a digression. If necessary, apply the hotspot sticky
    to capture an area of contention and revisit. Otherwise, the session will slowly
    become a forum for opinion by one or two people.


    Because EventStorming is relatively new and experienced facilitators are in short
    supply, this section provides insights and tips from recently conducted sessions.


    # Prepare: Gathering Necessary Supplies


    When conducting an in-person session, EventStorming requires some essential supplies.
    Be sure to have all the necessary supplies ordered and on hand several days prior
    to the session. Avoiding gathering supplies the day before or the morning of the
    session.


    The session will require a large number of sticky notes that includes a variety
    of colors. Typically, orange stickies are used the most, so having more of color
    is important. Most office supply stores offer boxes of colors that match the needs
    for EventStorming. However, feel free to adjust to team preferences or to what
    is available. Remember that most attendees will be attending their first EventStorming'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'session, so they won''t know the "proper colors" anyway. If experienced participants
    complain about the wrong colors, request that they be in charge of the supplies
    for any future sessions.


    A large wall is also required for hanging a large paper sheet as a modeling surface
    where sticky notes are applied and moved around needed. Some organizations prefer
    to use paper sheets that are no more than 18 to 24 inches (45–60 cm) to allow
    two or three lines of sheets along the wall.


    A legend should be visible to ensure that everyone is reminded of each color of
    sticky note used. Be sure to write out a legend that shows all sticky note colors,
    their type (e.g., "Business Domain Event" for orange stickers), and arrows that
    show how they are typically combined to produce a narrative. An example legend
    is shown in Figure 4.7.


    Black markers should be used to write on the sticky notes, ensuring words are
    easy to read when stepping away from the modeling surface. Ensure there is at
    least one marker for each participant, with a few extra scattered around the room
    in case some are lost.


    Remote sessions may choose to use a diagramming tool to simulate sticky notes.
    Another option is to use a shared document that is accessible by each attendee,
    applying similar color-coding to text as those used with sticky notes. Whatever
    is chosen, practice using the tool prior to the event to ensure an effective use
    of time during the session.


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_95_0.png)


    **Figure 4.7** A legend that shows how common color-coded sticky notes work together
    to capture the domain during an EventStorming session.'
  merge: -1
