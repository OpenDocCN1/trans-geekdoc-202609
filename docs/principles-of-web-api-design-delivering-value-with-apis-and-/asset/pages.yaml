- pgno: 144
  md: '# CHAPTER 7 REST-BASED API DESIGN


    REST-based APIs offer four primary hypermedia control types:


    +   1. Index hypermedia controls: Offer a list of all available API operations,
    typically as an API homepage

    2. Navigation hypermedia controls: Include pagination links within payload responses
    or by using the LInk header

    3. Relationship hypermedia controls: Links that indicate relationships with other
    resources or for master-detail relationships

    4. Context-driven hypermedia controls: Server state that informs the client what
    actions are available


    It is important to note that any API style that does not encourage a unique URL
    per resource is unable to take advantage of hypermedia controls. This is the case
    for GraphQL and gRPC API styles, detailed in Chapter 8, “RPC- and Query-based
    API Design,” along with older network API styles and messaging specifications
    such as SOAP and XML-RPC.


    # Measuring REST Using the Richardson Maturity Model


    The Richardson Maturity Model, or RMM for short, is a maturity model created by
    Leonard Richardson that describes four levels of REST-based API design maturity.
    The four levels are generally defined as the following:


    +   * Level 0: A single API operation, or endpoint, that receives all requests.
    Further, the nature of the desired action is reflected with some sort of action
    parameter or embedded within the payload of the request (e.g., POST /api?op=getProjects)

    * Level 1: Incorporation of resource-based design through URL-based naming but
    with additional action parameters where needed (e.g., GET /projects?id=112345)

    * Level 2: Addition of properly applied HTTP methods, such as GET, POST, PUT,
    and response codes to improve client/server interaction

    * Level 3: Self-descriptive APIs that include hypermedia controls to suggest related
    resources and client affordances based on server-side state'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# What Is a REST-Based API?


    111


    RMM was meant to be used as a general classification of an API''s improvement
    as designers seek to reach a design that uses hypermedia controls. Unfortunately,
    it has been used to denigrate the efforts of designers by proving that an API
    labeled as REST-compliant has not met sufficient criteria to be truly labeled
    REST.


    Richardson described the confusion and intent of RMM in a 2015 REST fest titled
    "What Have I Done?" Richardson described the whole idea of RMM as "very embarrassing"
    and said it was meant simply as possible measurement of improvement and maturity
    when attempting to target a hypermedia API. It was not meant to be a canonical
    method of classifying all APIs as REST-compliant. Instead, design to meet the
    needs of clients rather than trying to measure a specific level of design maturity.


    # When to Choose REST


    Fielding''s dissertation explicitly defines REST as an architectural style for
    coarse-grained data transfer:


    The REST interface is designed to be efficient for large-grain hypermedia data
    transfer, optimizing for the common case of the Web, but resulting in an interface
    that is not optimal for other forms of architectural interaction.


    While Fielding defines fine grain explicit, the Web is a good example. An HTML
    page is sent as a single, complete resource. It is not split into separate assets
    and retrieved separately. Once the HTML resource has been received and parsed,
    all images, JavaScript, and style sheets are retrieved individually.


    REST is a good architectural style when the interaction level requires course-grained
    resources over HTTP. This is common for APIs that may encounter additional latency
    or unpredictable connectivity.


    For finer-grained interaction styles, RPC or other styles may be a better fit.
    RPC styles offer improved performance and long-running connections that do not
    meet the REST constraints outlined by Fielding. This includes the choice of gRPC
    and asynchronous API styles, discussed in Chapter 8 and Chapter 9, "Messaging,
    Streaming, and Event-Based Async APIs," for service-to-service and client-to-service
    interactions.


    +   2. Leonard Richardson, "What Have I Done?" (lecture, REST Fest, Greenville,
    SC, September 18, 2015).'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'In addition, many organizations default to REST for their API style choice
    when offering customer- and partner-facing Web APIs. Most select the REST-based
    API style internally because of the abundance of tooling, infrastructure, operational,
    and management support. Because REST builds on the patterns of the Web, it is
    familiar to developers, easily managed by ops teams, and offers an abundance of
    tools and libraries for producing and consuming APIs.


    # REST API Design Process


    Now that one or more APIs have been modeled, as described in Chapter 6, “API Modeling,”
    it is time to start the API design process. While the goal of API modeling is
    to explore and capture the API requirements into a series of API profiles, the
    API design process maps the API profiles into HTTP using the REST-based principles
    discussed earlier in this chapter. Most of the effort involved in API design was
    focused on modeling the API to produce the API profile, there are five quick steps
    to a high-level API design.


    # Step 1: Design Resource URL Paths


    Next, convert each resource name into a URL-friendly name using lowercase letters
    and hyphens in place of spaces. Start the path with a leading slash, followed
    by the resource name in pluralized form to denote that this is a collection of
    resource instances.


