- pgno: 198
  md: '# Messaging Styles and Locality


    An application or service may choose from one or more styles of messaging:


    +   - Synchronous messaging involves the message producer sending a message and
    waiting while the receiver processes it and returns a reply.


    +   - Asynchronous messaging allows the message producer and receiver to operate
    in their own time rather than waiting upon one another. The message producer sends
    the message to the receiver, but the receiver may not be able to process it immediately.
    The message producer is free to perform other tasks while waiting for a reply
    from the message receiver.


    In addition, messages may be exchanged across different localities:


    +   - Local messaging assumes messages are sent and received within the same process.
    As such, the programming language and host will be the same as well. The Smalltalk
    programming language was built to support sending and receiving messages between
    objects. Actor-based frameworks, such as Vlingo¹ also support this. A “mailbox”
    sits between the code that produces the message and the code that will process
    the message. The consumer code processes each message as soon as possible, sometimes
    using threads or dedicated CPU cores to process multiple messages in parallel.


    +   - Interprocess messaging exchanges messages between separate processes but
    on the same host. Examples include UNIX sockets and dynamic data exchange (DDE).


    +   - Distributed messaging involves two or more hosts for messaging. Messages
    are transmitted over a network using the desired protocol. Examples of distributed
    messaging include message brokers using Advanced Message Queuing Protocol (AMQP),
    Message Queuing Transport (MQTT), SOAP-based web services, REST-based APIs, and
    so on.


    The combination of synchronous and asynchronous messaging styles, along with the
    locality of the messaging, determines the possibilities of a message-based solution.


    > ¹ https://vlingo.io'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# The Elements of a Message


    When a discussion around message design emerges, most of the focus is on the message
    body. The message body is usually in a structured format, such as JSON or XML,
    binary or plain text are also valid. Some organizations choose to wrap the message
    body within a message envelope that contains useful metadata about the message
    contents and the message publisher.


    There is more to a message than just the message body, however. Messages may also
    transport protocol semantics. Network protocols such as HTTP, MQTT, and AMQP include
    message headers with details such as timestamps, time-to-live (TTL), priorities/quality
    of service, and so on. A message is not fully described unless it includes all
    necessary information to process the message over the protocol. 9.2 demonstrates
    the elements of each message exchanged between an API client and API server for
    a REST-based API.


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_199_0.png)


    **Figure 9.3** A REST API example that shows the elements of the request and response
    messages exchanged between the API client and the API server.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Understanding Messaging Brokers


    Message brokers act as an intermediary between message producers and message receivers.
    The result is a loosely coupled design, as producers are only aware of the message
    broker but not the components ultimately receiving the messages. Examples of message
    brokers include RabbitMQ,2 ActiveMQ,3 and Jmqtt.4

    Message brokers also offer additional features such as the following:


    +   - **Transactional boundaries** ensure that messages are published or marked
    as delivered only if the transaction is committed.

    - **Durable subscriptions** store messages before dispatching to message receivers.
    Undeliverable messages, perhaps because the message receiver is offline, are stored
    on the client''s behalf until they reconnect (i.e., the store and forward pattern).

    - **Client acknowledgement mode** specifies how a message is considered acknowledged
    by the client to provide flexibility in balancing performance with failure recovery.
    A message is considered dispatched either (1) automatically upon delivery or (2)
    upon client acknowledgment that the message was processed successfully.

    - **Message processing failures** are handled by dispatching messages to a different
    receiver in the event of a failure or outage of the original message receiver.
    This behavior is controlled by the client acknowledgment mode established by the
    client when connecting to the broker.

    - **A dead letter queue (DLQ)** stores messages that could not be processed because
    of uncoverable errors by message receivers. Allows automated or manual review
    and processing of failed message delivery.

    - **Message priority and TTL** assist the message broker in prioritizing the delivery
    of messages and removing unprocessed messages if they exceed a specific period
    of time without being processed.

    - **Standards-based connectivity** is achieved through the AMQP protocol, along
    with optimized protocols for Java via Java Message Service (JMS) and other language
    bindings.


