    # The API Profile Structure


    API profiles capture all necessary information about an API, independent of the
    API style or styles that it will expose (e.g., REST and GraphQL). The API profile
    is used to drive the design of an API, but also provides the beginnings of the
    API documentation effort during the early stages of API definition.

    An API profile captures the following details about each API:


    +   * The name and a short description of the API

    * The scope of the API (internal, public, partner, etc.)

    * API operations with input and output message details

    * Participants allowed to perform each operation, in preparation for securing
    the API

    * Events generated by each API operation, to drive extensibility beyond the API’s
    original intent

    * (Optional) architectural requirements identified, such as a service-level agreement
    (SLA)


    A spreadsheet or document is sufficient to capture each API profile. Using a collaborative
    spreadsheet allows teams to capture and refine API profiles without the need to
    email among team members. Some teams prefer to use tools such as wikis for capturing
    API profiles. No matter what tool is selected, be sure that everyone in the organization
    has access to read and comment on the API profiles produced. Using a tool that
    is provisioned for only a subset of the organization is not recommended.


    Figure 6.2 shows a template that is easy to read and fits both spreadsheet and
    document formats.


    # The API Modeling Process


    The goal of the API modeling process is to produce one or more API profiles, for
    each API identified during modeling. The modeling process is divided into five
    quick steps. Each step adds additional detail to the API profile until a blueprint
    of the API emerges.'
