    \n```\n{\n  \"links\": {\n    \"self\": {\"href\": \"/projects\"},\n    \"next\"\
    : {\"href\": \"/projects?since=d266f6cd&maxResults=20\"},\n    \"prev\": {\"href\"\
    : \"/projects?since=43be807d&maxResults=20\"},\n    \"first\": {\"href\": \"/projects?since=ef2426a&maxResults=20\"\
