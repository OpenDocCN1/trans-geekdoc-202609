    # RPC and Query-Based API Design


    Choosing the right architectural style for a network-based application requires
    an understanding of the problem domain and thereby the communication needs of
    the application, an awareness of the variety of architectural styles and the particular
    concerns they address.


    > — Roy Fielding


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_171_0.png)'
