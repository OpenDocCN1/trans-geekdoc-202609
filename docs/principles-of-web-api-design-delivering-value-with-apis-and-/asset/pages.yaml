- pgno: 39
  md: 'The growth of the software-as-a-service (SaaS) business model, along with the
    increase in demand for Web APIs, have shifted the discussion from one-off integration
    with partners and customers to a focus on product thinking.


    Applying product thinking to the API design process shifts the focus from a single
    customer or partner to an effective API design that is able to handle new automation
    opportunities with little to no customization effort for a given customer segment.
    It also enables a self-service model for workforce, business-to-business, and
    customer-driven integration.


    The focus of an API product becomes less on custom implementations and more on
    meeting market needs in a scalable and cost-effective way. Reusable APIs emerge
    from considering multiple consumers at once. When embarking on the design of a
    new API, use a product thinking approach to obtain feedback from multiple parties
    that will consume the API. Doing so will shape the API design early and lead to
    increased opportunities for reuse.


    # Developer Experience


    User experience (UX) is the discipline of meeting the exact needs of users, from
    their interactions with the company to its services and the product itself. Developer
    experience (DX) is just as important for APIs as UX is for products and services.
    The DX focuses on the various aspects of engagement with developers for an API
    product. It extends beyond the operational details of the API. It also includes
    all aspects of the API product, from first impressions to day-to-day usage and
    support.


    A great DX is essential to the success of an API. When a DX is delivered, developers
    quickly and confidently consume a Web API. It also improves market traction of
    productized APIs by moving developers from being integrators to becoming experts
    on the API. The expertise translates directly into the ability to deliver real
    value to customers and their business quickly and with reduced effort.


    API teams seek to understand how to design a great experience for their API, remember
    that DX is an important factor for internal developers, also. For example, great
    documentation enables internal developers to understand and consume an API quickly,
    whereas an API with poor documentation requires contacting the internal team responsible
    for the API to learn how to use it properly. While they may be able to gain direct
    access to the developers that designed and implemented an API, it adds unnecessary
    communication overhead. Internal developers benefit from DX because they can create
    business value faster.'
