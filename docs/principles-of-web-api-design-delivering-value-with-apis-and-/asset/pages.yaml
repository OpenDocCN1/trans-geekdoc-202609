- pgno: 295
  md: '# # Chapter 14


    # # Designing for Change


    You have to be really consciously careful about API design. APIs are forever.
    Once you put the API out there, maybe you can version it, but you can''t take
    it away from your customers once you''ve built it like this. Being conservative
    and minimalistic in your API design helps you build fundamental tools on which
    you may be able to add more functionality, or which partners can build layers
    on top of.


    > — Werner Vogels


    Managing change is not easy, yet it is an inevitable part of maturing an API.
    For developers working within a single codebase, change can be difficult but manageable.
    Refactoring tools and automated test coverage are leveraged to assess the impact
    of a change.


    When the change involves Web-based APIs, change becomes even more challenging.
    Some teams may have a direct relationship with every API consumer, allowing for
    changes to be introduced gradually and in coordination with all parties. However,
    that is usually not the case. Instead, most consumers of an API have no personal
    relationship with the team that owns the API. Extra care is required to manage
    changes to an API design to avoid customer churn. This chapter presents considerations
    to determine the impact of change and strategies to introduce change to API designs
    that minimize the impact to API consumers.


    # # The Impact of Change on Existing APIs


    The Align-Define-Design-Refine (ADDR) process will work for any organization,
    whether an early-stage startup or an organization with hundreds of existing APIs.
    The process surfaces the outcomes and activities needed by customers, partners,
    and the workforce. This approach is useful whether a team is designing their first
    or fiftieth API.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# CHAPTER 14 DESIGNING FOR CHANGE


    The fictional online bookstore example used throughout this book assumes that
    the APIs identified throughout the process did not already exist, resulting in
    a greenfield project. The reality is that organizations already have APIs in production
    for a variety of purposes, and any proposed API designs must fit the reality that
    brownfield development will be required.


    These brownfield initiatives are forced to reconcile the findings from the ADDR
    process with any existing API designs to determine the best path forward. This
    chapter details some considerations for handling change when APIs already exist.


    # Perform an API Design Gap Analysis


    Teams should perform a gap assessment of the ideal API design identified during
    the process with the way it is designed today. The team must then determine whether
    to follow the same style and design decisions of the API design for consistency,
    mix the new design alongside the older design decisions, or consider alternatives.


    Factors to consider when performing this design gap analysis include the:


    +   - Introduction of differing terminology for resources and resource properties
    during the design process

    - A shift from data-centric to resource-centric API design styles

    - Change in vision and direction for the API product compared to what exists today


    Using these factors as a starting point, itemize the differences between existing
    APIs and the ideal API design created as a result of the ADDR process. Assign
    a sizing for the value provided to API consumers by the new design and the size
    of the impact in API design change. Using t-shirt sizing (e.g., small, medium,
    large, extra-large) ensures the measurement is an effective way to size the value
    and impact. Then determine what is best for API consumers.


    # Determine What Is Best for API Consumers


    Making an API design decision, particularly when breaking changes will be required,
    involves more than the direct impact to the organization. It must also include
    what is best for API consumers.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# THE IMPACT OF CHANGE ON EXISTING APIs


    Consider the following questions to determine the impact of API changes to current
    and future API consumers:


    +   * Who are the API consumers? Internal consumers may find easier change coordination,
    whereas partners may be resistant to making changes to integrations. Customers
    and third parties acting on behalf of customers may be unable to make changes
    because of limited or no development resources available.

    * What kind of relationship has with API consumers? An internal or external party
    that the team knows personally can more easily negotiate for breaking changes.
    API consumers that have no relationship may be more challenging. API consumers
    that are heavy influencers in the market may have a negative impact on current
    and future consumer prospects if they are coerced into adopting unnecessary API
    changes.

    * What value is being delivered to API consumers as a result of the change? API
    changes that improve the use of the API may be well received. Changes may also
    unlock new capabilities that consumers have been requesting, with the cost of
    change. For others, it may give them pause to consider moving to a different vendor,
    resulting in customer churn.


    How an organization manages changes with its API consumers tells a lot about what
    and what it values. If the API provider prefers to deliver API design elegance
    at the cost of constant breaking changes, API consumers may soon start shopping
    for alternatives. If, however, the API provider values the API consumer above
    having the perfect API, it may find itself the leader in the marketplace.


    # Strategies for Change


    Proceeding with an existing design style may require compromises in the API design
    that are less ideal. These compromises may include minor annoyances, such as continuing
    forward with a misnamed resource that doesn''t necessarily reflect the insights
    gained during the ADDR process.


    Compromises such as supporting the old formats alongside the new are commonly
    found in the real world. In this case, the server first checks for the new message
    format, falling back to the older message format when necessary. The versioning
    responsibility is placed on the server rather than on the API consumers, ensuring
    that no changes are introduced.


    Another example is adding the new design style alongside the older style. New
    operations use the new design style, and the older remain as-is for a time. Gradually,
    older operations are replaced by newer operations using a deprecation'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# CHAPTER 14 DESIGNING FOR CHANGE


    strategy that encourages existing integrations to migrate to the new operations
    at a time.


    However, some compromises may be more significant, such as an existing API design
    that is too low level. This issue is common for APIs that opt to expose database
    tables compared to the new proposed API design that would apply a more coarse-grained
    design with an outcome-based focus. Mixing low-level and high-level APIs may create
    too much cognitive dissonance for developers and are therefore less than ideal.


    Teams must determine if they wish to add the new design to an existing API, start
    a new API as if it were a brand-new product offering, or deliver the new design
    as a new version of the existing API. Each option will have an impact on both
    the organization and on current and future API consumers.


    If the existing API impedes the consumer''s ability to use the API effectively,
    more greenfield approach may be required. Keep in mind if the team chooses to
    release a new API product or version, additional resources will be required to
    maintain both APIs for some amount of time in the future. The next section discusses
    API versioning strategies and considerations.


    # Change Management Is Built on Trust


    The most important thing is that the ADDR process helps to align business and
    API teams in a unified understanding of the problem space. A unified understanding
    may create a vision of the design target state of the API design and reality.
    Work through the process using the recommendations provided in this chapter. Doing
    ensures that enhancements to an existing API or the delivery of a new API meets
    the needs of the API consumers and the trust between API provider and consumer
    is not lost.


    # Principle 5: APIs are forever, so plan accordingly


    Thoughtful API design combined with an evolutionary design approach makes APIs
    resilient to change. Extra care is required to manage changes to an API design.
    This helps avoid frustrating developers who are required to stay updated with
    the latest changes.


    # API Versioning Strategies


    APIs are contracts established between the providers of an API and their consumers.
    Ideally, they will never have to alter this contract. However, the ideal may not
    be the reality. There may be times when a change to the contract is required.
    When'
