    **Figure A.2** The elements of a Uniform Resource Locator (URL).


    Figure A.2 demonstrates the elements of a URL.


    # HTTP Request


    An HTTP request is composed of several parts: the HTTP method, the path, the header,
    and the message body.


    The HTTP method informs the server what kind of interaction the client would like
    to request. Common HTTP methods are GET, to request data, and POST to submit data.
    The methods commonly used for Web-based APIs are detailed later in this appendix.


    The path is the portion of the URL that references a resource on the server. The
    resource may be a static file, such as an image, or a piece of code that performs
    dynamic request processing.


    The header tells the server about the client and specifics about the request.
    The header is comprised of header fields in name:value format. Common HTTP request
    headers used with Web-based APIs include the following:


    +   **Accept**: Informs the server what content types the client is able to support.
    Examples may include image/gif and image/jpeg. If the client is willing to accept
    any kind of response, "*" is used. This header is often used with content negotiation,
    detailed later.


    +   **Content-Type**: Informs the server the content type of the request body.
    Used when submitting data using a HTTP method that requires a message body (e.g.,
    POST).


    +   **User-Agent**: Provides a free-form string indicating the kind of HTTP client
    that is making the request. This may indicate a specific browser type and version
    or may be customized to indicate a specific helper library or command-line tool.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 306


    # APPENDIX


    ```

    GET http://www.google.com/HTTP/1.1

    User-Agent: Mozilla/5.0 [en] (X11; Linux 2.2.013 i686)

    Host: google.com

    Accept: image/gif, image/x-bitmap, image/jpeg,/*

    Accept-Encoding: gzip

    Accept-Language: en

    Accept-Charset: iso-8859-1, "*,utf-8

    ```


    Figure A.3 A line-by-line examination of an HTTP request to https://www.google.com.


    +   - Accept-Encoding: informs the server, if any, compression support the client
    is able to process it. This allows the server to compress the response using gzip
    or compress formats to reduce the byte size of the response.


    The message body provides details to the server when data is submitted and may
    be human-readable or binary, as required by the server. For a retrieval request
    using GET, the message body may be empty.

    Figure A.3 shows an example of an HTTP request sent to Google to request the homepage
    that contains the form search, documented line by line.


    # HTTP Response


    Once the request is received by the server, the server processes the request and
    sends a response. The response is composed of three parts: the response code,
    the response header, and the response body.


    The response code is a number that corresponds to a success or error code indicating
    whether the request could be fulfilled. The response code sent must be one of
    the those outlined in the HTTP specification and are detailed later. Only one
    response code is allowed per response.


    The response header tells the client about the result of the request. The header
    is composed of header fields in name:value format. Common HTTP response headers
    used with Web-based APIs include the following:


    +   - Date: The date of the response.

    - Content-Location: The fully qualified URL of the response. Useful if the request
    resulted in redirects that may require the client to update its URL for the resource.

    - Resource: The length, in bytes, of the response message body.

    - Content-Type: Informs the client of the content type of the message body.'
  merge: -1
