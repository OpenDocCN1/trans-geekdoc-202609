  md: "# CHAPTER 7 REST-Based API DESIGN\n\nTable 7.4 Categories of API Representation\
    \ Formats\n| Category | Overview |\n| --- | --- |\n| Resource Serialization |\
    \ The representation reflects the serialization of a resource into various formats,\
    \ e.g., JSON, XML, Protocol Buffers, and Apache Avro |\n| Hypermedia Serialization\
    \ | A serialized representation with support for embedded hypermedia controls\
    \ |\n| Hypermedia Messaging | A general message format that supports resource\
    \ properties with hypermedia controls |\n| Semantic Hypermedia Messaging | A general\
    \ message format that supports semantic field mapping with hypermedia controls\
    \ |\n\n# Resource Serialization\nThe resource serialization category of representation\
    \ formats is the most commonly encountered. They directly map property of the\
    \ resource and its value into the desired format, often in JSON, XML, or YAML.\
    \ Binary formats such as Protocol Buffers and Apache Avro are gaining acceptance\
    \ as well.\n\nThese representation formats require explicit code that handles\
    \ the serialization between the resource and the target format. This mapping logic\
    \ may be created through code generators or hard coded. Formatter and representer\
    \ libraries often help manage some of the mapping between the target format and\
    \ an object or struct that represents the resource in code.\n\nNo matter how serialization\
    \ is handled, the parsing and mapping code is unique to the resource, as it must\
    \ as aware of the expected fields and nested structures. Listing 7.1 provides\
    \ an example of a Book resource using a serialized representation in JSON.\n\n\
    # Listing 7.1 Serialized Representation Using JSON\n\n```\n{\n  \"bookId\": \"\
    12345\",\n  \"isbn\": \"978-0321834577\",\n  \"title\": \"Implementing Domain-Driven\
    \ Design\",\n  \"description\": \"With Implementing Domain-Driven Design, Vaughn\
    \ has made an important contribution not only to the literature of the Domain-Driven\
    \ Design community, but also to the literature of the broader enterprise application\
    \ field.\",\n  \"authors\": [\n    { \"authorId\": \"765\", \"fullName\": \"Vaughn\
    \ Vernon\" }\n  ]\n}\n```\n\n+   5. https://developers.google.com/protocol-buffers/docs/proto3\n\
    6. https://avro.apache.org/docs/current"
