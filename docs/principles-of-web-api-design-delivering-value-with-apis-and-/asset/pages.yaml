    +   4. **Deliver**: Deliver the API through a parallelized effort across developers,
    quality assurance, operations, and documentation teams. API capabilities are released
    iteratively rather than through a single release, driven by the agreed-upon API
    design.


    +   5. **Onboard**: Ensure customers, partners, and/or internal developers are
    onboard with the API, integrating it with their solutions. Support is critical
    at this stage to help teams with complex integration needs.


    The iterative design process that occurs as stakeholder input is gathered. Feedback
    is incorporated early and often, making design changes along the way. This results
    in an API contract, which provides the specific details of how the design is realized.
    Prototypes or mock implementations demonstrate the API in action, prior to the
    full delivery process. Once delivery begins, the effort is parallelized across
    all teams, with the API contract as the communication artifact. After developers
    are onboarded with the API, additional feedback results in a new design effort.


    # Principle 1: APIs should never be designed in isolation


    Collaborative design is essential for a great API. Both technical and technically
    participants should be involved throughout the API design process. Leaving the
    API design effort only to development teams will greatly reduce the chances of
    maximizing the API''s potential.'
  merge: -1
