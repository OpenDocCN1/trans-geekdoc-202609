    # ## Step 5: Share and Gather Feedback


    The final step is to share the API design for feedback from the immediate team,
    API architects from the organization, and internal/external teams planning to
    immediately integrate the API once ready.


    Once the API has been officially released and integrated, the API design is locked,
    and only nonbreaking changes may be made. New endpoints may be added, and perhaps
    new fields added to existing resource representations, renaming or modifying existing
    endpoints will break existing API consumers, leading to upset customers and perhaps
    customer churn. Getting it right the first time is important. Sharing the API
    design early for feedback helps to avoid significant design changes post release.


    Mock implementations of an API are also helpful to explore API designs. Because
    reading API documentation provides only a basic understanding of an API, mock'
  merge: -1
