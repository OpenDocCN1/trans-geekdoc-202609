  md: '# Using EventStorming for COLLABORATIVE UNDERSTANDING


    # Using EventStorming for Collaborative Understanding


    EventStorming² is a collaborative process to help surface the business processes,
    requirements, and domain events as a visual model. It is a tool designed by Alberto
    Brandolini that has been adapted in different ways to fit the needs of organizations
    around the world.


    EventStorming is most effective when conducted as an in-person session. Remote
    sessions may be used, when necessary, though they result in limited dynamic conversation.
    A facilitator helps the group navigate the process and helps to keep the session
    on track. Everyone is expected to contribute throughout the entire session by
    offering insights, clarifying questions, and identifying missing facts that require
    follow-up research.


    Unlike other techniques that focus on the software design of a solution, EventStorming
    seeks to create a shared understanding of all or a portion of a domain. Artifacts
    and learnings from EventStorming sessions are used as input to the design process,
    including the API design process.


    # CASE STUDY


    # EventStorming for International Wire Transfers


    A recent EventStorming session was conducted for a group developing support for
    sending international wire transfers. The team was very familiar with the mechanics
    of performing the wire transfer but wished to explore the process leading to the
    transfer. It was decided that EventStorming would be a useful tool for the exploration
    process.


    In the weeks leading up to the EventStorming session, job stories were used to
    capture the requirements. A specific set of job stories was selected for the upcoming
    EventStorming session. The selected job stories expressed jobs to be done for
    the areas the group wished to explore. The participant list was selected, and
    the team met for a remote session.


    During the remote session, several insights were achieved:


    +   1. Team alignment regarding the overall process to support international wire
    transfers


    +   2. Identification of open questions regarding some fundamental business policies


    +   3. Clear definitions of key terminology, referred to as ubiquitous language
    in domain-driven design, that included input from business


    > 2. https://www.eventstorming.com'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# CHAPTER 4 CAPTURE ACTIVITIES AND STEPS


    The most valuable insight, however, was the number of unknowns around the specifics
    of currency conversion. No one was familiar with the internal policies regarding
    when a conversion was conducted. There were several options, from performing the
    conversion at the time of wire initiation to waiting until the wire transfer process
    started. The gap in knowledge was identified within an hour of starting the session.
    We decided that further investigation was necessary. Domain experts were brought
    into the session to clarify the matter.


    With better knowledge at hand, significant decisions needed to be made. The session
    was halted to gain further clarification on the scope of the release. The EventStorming
    concluded at a future time when more information was known, ensuring that the
    initial release met all business and customer needs.


    Had the EventStorming session not been conducted, developers would have assumed
    a specific set of business policies with regard to currency conversion. SMEs would
    have required a different set of business policies, forcing developers to make
    last minute changes and incur significant technical debt to deliver on time.


    # How EventStorming Works


    The ADDR process separates the EventStorming session into five distinct steps.
    Each step seeks to add more detail and understanding until a better understanding
    of the domain is gained. Along the way, assumptions are clarified to ensure greater
    alignment between the team and the SMEs. The resulting output of an EventStorming
    session is used immediately to capture activities and steps. It is also used later
    in the process to help identify API boundaries, as detailed in Chapter 5.'
  merge: -1
  img_proc: true
