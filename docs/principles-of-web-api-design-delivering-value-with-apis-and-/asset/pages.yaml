- pgno: 101
  md: '# Part III


    # Defining Candidate APIs


    At this point in the API design process, digital capabilities have been identified
    using job stories. Activities required to produce the outcomes have been captured
    and are based on insights from an EventStorming session. By starting with a focus
    on outcomes and activities, teams remain aligned with the needs of customers and
    business goals.


    The next step in the API design process is to identify candidate APIs. These candidate
    APIs will reflect one or more boundaries that are identified using an EventStorming
    canvas or list of activities produced from the previous step. As the boundaries
    are identified, one or more API profiles begin to emerge.


    Each API profile provides more detailed clarity about the API and informs the
    eventual API design. It reflects the API resources that need to be designed, along
    with the operations to be offered. This definition step is essential in designing
    an API that is focused on delivering the desired outcomes of customers, partners,
    and the workforce.'
  merge: -1
