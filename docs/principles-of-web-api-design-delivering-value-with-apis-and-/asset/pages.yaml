    # Essential API Protection Practices


    Whether the API is available for public developers or hidden for private use,
    protecting the API is important. API protection requires a variety of practices
    that are essential to an overall API security strategy.


    +   - Authentication (auth): Used to determine the identity of callers and verify
    their identity. Using username and a password is most common for Web apps but
    is not recommended for API use because passwords may change often. Instead, use
    OpenID Connect or similar solution to ensure the identity of the caller is verified
    before allowing API requests to be processed.'
