- pgno: 281
  md: "# Improving API Discovery Using APIs.json\n\nMultiple API description formats\
    \ may be necessary to help developers consume the APIs using various tools. APIs.json\
    \ is a description format that assists in API discovery through a machine-readable\
    \ index file. It is similar to a site map for a Web site that directs search engine\
    \ indexers to important areas of the Web site.\n\nA single APIs.json file may\
    \ reference multiple APIs, making this format useful for bundling multiple, separate\
    \ API description files into a single product or platform view. When combined\
    \ with other machine-readable formats, APIs may be discovered, indexed, and made\
    \ available within a public or private API catalog.\nAs the name indicates, the\
    \ default format is JSON, although the YAML-based format, in Listing 13.6, is\
    \ also available.\n\n**Listing 13.6** APIs.json Example Offering an Indexed View\
    \ of an API and Its Various Machine-Readable Description Files\n\n```\nname: Bookstore\
    \ Example\ntype: Index\ndescription: The Bookstore API supports the shopping experience\
    \ of an online bookstore, along with ...\ntags:\n  - Application Programming Interface\n\
    \  - API\ncreated: '2020-12-10'\nurl: http://example.com/apis.json\nspecificationVersion:\
    \ '0.14'\nis:\n  - name: Bookstore Shopping API\n    description: The Bookstore\
    \ Example REST-based API supports the shopping experience of an online bookstore\n\
    \    humanURL: http://example.com\n    baseURL: http://api.example.com\n    tags:\n\
    \      - API\n      - Application Programming Interface\nproperties:\n  - type:\
    \ Documentation\n    url: https://example.com/documentation\n```"
  merge: -1
  img_proc: true
