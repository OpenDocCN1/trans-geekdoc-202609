- pgno: 201
  md: '# A Review of MESSAGING FUNDAMENTALS


    Message brokers offer two methods of message distribution: point-to-point and
    fanout.


    # Point-to-Point Message Distribution (Queues)


    Point-to-point messaging allows a publisher to send a message to a single subscriber
    selected from a pool of registered subscribers. The broker is responsible for
    selecting the subscriber that will receive the published message for processing
    via a round robin or similar selection process. Only one subscriber will receive
    a message published to the queue. If the subscriber fails to process the message
    within a timeout period, the broker selects a new subscriber for processing. Figure
    9.4 demonstrates an example of a point-to-point queue.


    Point-to-point queues are useful for publishing command messages that have only
    one consumer processing a message at a time to ensure consistency and predictability
    and to avoid duplicate processing. This is a common pattern for background job
    processing, where each job should be processed only once by a pool of workers.


    # Fanout Message Distribution (Topics)


    Fanout messaging allows every message published to a topic to be distributed to
    every subscriber currently registered (see Figure 9.5). The broker doesn''t care
    if the message was processed by all subscribers or a subset of them. Unlike point-to-point
    queues, a message will be processed by all subscribers.


    All topic subscribers receive a copy of each published message. The distribution
    method supports independent, parallel processing logic for each published event
    message. Subscribers are not aware of each other or the publisher, only that a
    new message has been sent to them for processing.


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_201_0.png)


    **Figure 9.4** A point-to-point queue that dispatches each message to a single
    message receiver subscribed to the queue.'
