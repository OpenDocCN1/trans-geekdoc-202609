  md: '# Chapter 2


    # Collaborative API Design


    > Big design up front is dumb but doing no design up front is even dumber.

    Dave Thomas


    An API design that looks good to the designer may not be the best to solve the
    problems at hand. The initial assumptions about an API design may be incorrect
    as the API encounters the real world of customer, partner, and workforce needs.


    API contract design is a separate and critical step of software delivery. Following
    an API design process encourages communication internally within the organization
    and externally between the organization and the developers ultimately tasked with
    integrating the API. It helps to identify incorrect assumptions and validate the
    assumptions that are correct. Finally, it encourages collaboration between API
    designers and the developers who will integrate the API.


    This chapter presents a design process that is flexible to meet the needs of a
    single API product or mid- to large-scale enterprise API platform. Organizations
    from as small as 10 employees to those with a staff of more than 10,000 developers
    have used this collaborative design process. Ultimately, it delivers business
    value with a customer-centric focus by applying outside-in design using the five
    principles outlined in Chapter 1, “The Principles of API Design."


    # Why an API Design Process?


    Before presenting the design process review, it is important to recognize that
    teams can design and deliver an API successfully without the need for a formal
    API design process. I have worked with many companies across the world that have
    managed to deliver an API into production without any kind of consistent approach
    to API design. However, the APIs they produced took longer to deliver, as they
    required'
