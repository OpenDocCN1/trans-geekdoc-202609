- pgno: 248
  md: 'When teams think about delivering an API, the primary focus is on the code
    that must be built. They focus on considerations such as the target programming
    language, frameworks that aid in building the API, continuous integration and
    delivery (CI/CD) pipelines, and other factors. All of these decisions are important,
    they involve the API provider only. They do not directly expose the tens, hundreds,
    or thousands of future API consumers that will use the API.


    As an API provider, it is important to keep the API consumers first in everything
    that is designed and delivered. This responsibility includes creating mock APIs
    to help early adopters receive feedback early on the API design (Figure 11.1).
    It also requires consideration of whether to offer helper libraries and command-line
    interfaces to reduce the integration time by developers across all skill levels
    consuming the API. This chapter addresses these concerns in an effort to multiply
    the impact across the many current and future API consumers that will integrate
    the API.


    # Creating a Mock API Implementation


    API design is a mixture of patterns and subjective design decisions. What makes
    sense during the API design phase may not make sense to developers who integrate
    the API. API mocking is the creation of a simulated version of an API design.
    Generating a mock version of an API design helps to verify that the API design
    will meet the needs of target developers.


    Mock implementations are quick to deliver, as they lack production-ready code.
    They also bypass backend database servers and legacy systems. Mock APIs implement
    the API design while returning static responses or responses based on synthesized
    data sets.


    With mock implementations, developers are able to integrate portions of an API
    before the implementation has begun. Consequently, API teams can see if the API
    design is missing critical functionality. Mock implementations also help teams
    to identify important data elements that may be missing from the API design.


    API design includes compromises. Once developers start to integrate with an API,
    they will provide feedback on how it should be changed. If the API design is frozen,
    this change must wait until a new version of the API is released. Integrating
    with a mock implementation identifies these problem areas early, with the cost
    of change is much lower.


    An added benefit is that mock implementations help accelerate the delivery process.
    Rather than waiting until the entire API has been coded, mock implementations
    may be used to produce API integration code for frontend development. They may
    also'
