- pgno: 327
  md: '# Chapter 16


    # Continuing the API Design Journey


    > When done effectively, governance can provide clear direction, remove obstacles,
    and allow different parts of the organization to function independently.


    — Matt McLarty


    An organization that produces more than one API product must learn to scale its
    API design process. Otherwise, designs will lack consistency across the portfolio
    of APIs produced by the organization. Authentication and authorization will vary
    between APIs. Naming conventions and error responses will deviate. In short, the
    API pro-gram will become a mess.


    This chapter explores the factors required to scale API design efforts within
    an organization. These factors include establishing a style guide for consistency,
    incorporating design reviews, and encouraging a culture of reuse. Once these measures
    are applied, teams will be able to function independently while maintaining consistency
    across the API portfolio. Finally, the chapter takes a look back at the topics
    covered in this book and offers some guidance on how to continue the API design
    journey.


    # Establishing an API Style Guide


    Many API programs begin as a single API or a few small APIs. Over time, more APIs
    emerge across the country. Consistency for all API consumers is an important component
    of a great developer experience. A common design approach makes integration more
    intuitive and can reduce troubleshooting and support costs.


    Great style guides go beyond basic design decisions to include common error strategies,
    applying patterns consistently across APIs, and even suggest common architecture
    styles for teams looking to get started quickly.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'An API style guide commonly includes the following topics:


    +   - Introduction: The scope of the style guide, who to contact for questions,
    clarifications, or enhancements

    - API fundamentals: Used to educate and coach those less familiar with the basics;
    may consist consist of links to internal or external training materials

    - Standards: Naming conventions, guidance paths, for selecting HTTP methods and
    response codes, organizing resource paths, resource lifecycle design, payload
    and content formats, and when to use hyperlinks

    - Design patterns: Common patterns encountered, including pagination, error responses,
    bulk processing, singleton resources

    - Lifecycle management: Recommendations for moving an API into production, along
    with deprecation and sunset procedures

    - Tools and technologies: List of tools that are recommended, including those
    with site licenses already available

    - Operational recommendations: Recommended API management tools, configurations,
    marketing recommendations, and common practices for highly available, robust,
    and resilient APIs

    - Further reading: Additional resources that may be interesting to the reader,
    including both internal and publicly available papers, articles, and videos


    Too often, style guides are used to push an agenda. Full compliance, or else.
    That isn’t what style guides should be about. Their goal should be to advise teams
    designing APIs toward a more consistent API with other APIs across the organization.
    A newly hired developer should be able to work with a variety of APIs across the
    organization without realizing that different teams designed them.


    # Methods for Encouraging Style Guide Adherence


    Style guides, without some kind of incentive to adhere to the recommendations,
    will be ignored. There are three common methods to enforcing style guide compliance:


    +   - Incentivized: A centralized team oversees and enforces the guide. Reviews
    are conducted by the centralized team for any new API prior to production deployment.
    API teams are incentivized to adhere to the style guide to gain'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'access to shared services and support (e.g., API management layer, operational
    and infrastructure support) rather than being forced to implement it themselves.


    +   2. Federated: A centralized team oversees and maintains the style guide, by
    coaches, embedded locally within the business unit and/or, are available to address
    their specific needs. This method avoids the ivory tower problem of a committee
    designing standards without understanding the needs of specific units.


    +   3. Clone and customize: A single group manages the style guide. Teams clone
    the standards as a starting point, making minor enhancements locally for business
    unit consistency. For organizations that have many independent teams within and/or
    across business units, this is the most effective method.


    These methods may be used independently or in combination to achieve the desired
    results that meet the needs of the organization.


    # Selecting Style Guide Tone


    Some style guides are informal, and are very formal, including the use of RFC
    2119¹ for requirement levels. Deciding upon a tone and formality for the style
    guide depends upon the answers to three questions:


    +   * Will the organization be enforcing the standard? If so, then use RFC 2119
    recommendations to enforce what MUST, SHOULD, and MAY be implemented.


    +   * Will enforcement be deferred to a future date? Then go ahead and start using
    RFC 2119, but keeping the word to lowercase (e.g., must, should, may) until it
    is enforced. This demonstrates expectations and likely future enforcement with
    less of a formality during the initial introductory period.


    +   * Is the guide shared across business units, limiting the organization''s
    ability to control or strictly enforce the guidelines? Then soften the tone and
    focus on design consistency by encouraging teams to adopt many of the guidelines
    as possible rather than using a more formal tone.


    > 1. S. Bradner, "Key Words for Use in RFCs to Indicate Requirement Levels," March
    1997, https://datatracker.iet.org/doc/html/rfc2119.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Tips for Getting Started with an API Style Guide


    +   * Browse Arnaud Lauret''s (aka the API Handyman) API Stylebook.,2 API Style-book
    aims to help API designers to solve API design matters and build their API design
    guidelines. Browse other publicly available style guides as well for insights.

    * Start small. The scope of an API style guide may be too much for one individual
    or a small team to take on initially. Start simple and expand over time.

    * Socialize the style guide. Just because the style guide exists doesn''t mean
    people in the organization know about it. Spend time evangelizing the style guide
    with teams. Gain your insights from early release candidates before releasing
    an official version.


    > Remember

    The goal of an API style guide is to advise teams designing APIs toward consistency
    with other APIs across the organization.


    # Supporting Multiple API Styles


    While organizations may suggest or mandate a single API style, this won''t always
    be the case. As new API styles emerge, API portfolios become challenged with the
    push for new ways of interacting with the enterprise. Remember, it was only a
    decade ago that many organizations stopped developing SOAP-based Web services.
    API programs must consider how new API styles will be evaluated, approved, and
    supported as they gain popularity.


    API programs must consider async APIs, such as Webhooks, WebSockets, Server-Sent
    Events (SSE), data streaming, and internal messaging as the API portfolio. Like
    the design of synchronous APIs, the design of async APIs must be governed and
    managed as part of the overall API portfolio.


    The API style guide must address each of these API styles as they are introduced
    into the organization. While it is possible to share elements of the style guide
    between different API styles, it is highly recommended to write a style guide
    for each API style at the start.


    Over time, common recommendations such as naming conventions and reserved words
    may be shared between API style guides. However, most organizations'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# CONDUCTING API DESIGN Reviews


    that there is significant deviation in standards and common practices across API
    styles. Remember that it is better to follow common practices for each API style
    than to try to unify all API styles into a single set of recommendations.


    Finally, keep in mind that there is a cost to supporting each API style. Take
    time to understand the needs for the new API style. Then determine if the needs
    outweigh the cost required to build and support another API style guide.


    # Conducting API Design Reviews


    API design reviews seek to improve the design of APIs through constructive review
    and feedback. Implementing a healthy API design review process helps to capture
    insights, patterns, and lessons into a repeatable process, guiding organizations
    toward a more consistent design and a better developer experience.


    API design reviews offer a chance to


    +   - Share knowledge of upcoming APIs.

    - Incorporate design feedback before coding begins.

    - Become an advocate for the many developers who will use the API once it is released.

    - Offer a more consistent developer experience through consistently designed APIs.

    - Catch missing or incorrect assumptions before code changes become more expensive
    or time is limited.


    Following are some tips and insights on conducting healthy API design reviews.


    > A Word of Caution about Design Reviews


    Design reviews go two ways: constructive or destructive. A constructive design
    review provides an opportunity to coach those nearer API design and build up and
    refine the entire organization. Destructive design reviews are the opposite, typically
    sowing the seeds of frustration and mistrust. Worst case, design reviews will
    be a cause for team attrition as caustic team members invade an otherwise healthy
    and useful process.


    Therefore, use caution when conducting an API design review. Seek to ask questions
    first. Too often, biases and assumptions are incorporated into'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'design reviews. Instead, seek to first understand by asking questions and listening.
    Don''t claim to know everything about API design—everyone can benefit from learning
    something new. Never accuse someone of deliberately designing a poor API—no one
    sets out to do so. Assume good intentions, listen carefully, seek to understand,
    provide some recommended next steps for design improvement. Remember: Everyone
    starts as a newbie API design reviewer. Model the proper reviewer behavior that
    encourages improvement in a constructive way.


    # Start with a Documentation Review


    API reviews are not code reviews. API reviewers are acting as an advocate for
    the developers who consume the API. Therefore, it is important to start with the
    API documentation.


    API exists for a variety of reasons, including data access, customer automation,
    system-to-system integration, marketplace creation, and workforce automation.
    An introduction should be clear about why the API exists and how it might collaborate
    with other APIs to accomplish more complex workflows or outcomes. Use the following
    a review checklist for all areas of documentation:


    +   - API name: The name should be descriptive and make it easy to determine the
    scope of the API when first discovered.

    - API description: The description should be comprehensive, starting with an overview
    of the API and including a list of use cases it solves.

    - API operations: Each operation should offer a summary of what task, activity,
    or outcome it produces along with a description that includes detailed usage instructions.
    Ensure all input and output values are captured and properly described, including
    expected formats that could cause errors if violated.

    - Example usage: Examples of API usage are often the most important, yet missing
    of an API’s documentation. These examples do not need to be in a specific programming
    language (although helps when trying to offer an API to a broad audience). Simple
    HTTP request/response examples, perhaps complemented with Postman collections,
    will go a long way toward accelerating developer understanding and completing
    the integration effort.

    - Avoid internal references: Great documentation assumes that readers have no
    idea about the internal systems or implementation choices behind the scenes. They
    just want to get something done and they want to find out if the API will help
    them achieve their goals.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# CONDUCTING API Design Reviews


    # 299


    # Check for Standards and Design Consistency


    One of the common challenges for many mid- to large-sized organizations is API
    design consistency. It is easy to spot APIs that were independently designed by
    teams without any cross-organization consistency applied. Commonly, lack of consistency
    is associated with organizations that lack a design review process. Even with
    a review in place, inconsistencies may creep in from time to time.


    Part of the API design review should be verify that the standards and design choices
    any established style guides and standards. This task may be performed by a combination
    of a manual review and the use of an API linter such as Spectral.


    Finally, look for opportunities to apply common design patterns consistently.
    Examples include create-read-update-delete (CRUD), consistent use of pagination
    techniques, multipart MIME for file uploads, and so on. While these common patterns
    may be captured as part of the style guide, identifying deviations and discussing
    them with the team will help to provide consistency whenever possible and making
    exceptions when appropriate.


    # Review Automated Test Coverage


    While an API design review focuses on the design, reviewing test coverage is as
    important as well. Including test coverage review ensures that the testing strategies
    for the API have been considered as part of the design. It also helps to ensure
    that the API''s operations can be used in combination to produce the desired outcomes
    identified during the align phase.


    If the review is conducted early in process, there may not be any specific code
    or test coverage in place. In this case, review test plans to surface missing
    or incorrect design assumptions. A good starting place is to review job stories,
    API profiles produced during modeling, and other artifacts. This will help surface
    any missing test plans and ensure the test coverage will be sufficient to verify
    operational functionality along with acceptance tests that will verify intended
    objectives.


    # Try It Out Support


    Nothing provides a better review of an API design than interacting with it. If
    code already exists for the API, go ahead and try out the API. This will help
    to exercise the documentation, the API design, and the implementation.


    If the team took a design-first approach, little or no code exists yet. Mocking
    tools help to address this issue. Mocking tools are a great way to fill the gap
    and catch bad design decisions or missing endpoints sooner than later in the delivery
    process. These tools often accept a definition in OpenAPI Specification, API Blueprint,
    and'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# CHAPTER 16 CONTINUING THE API DESIGN JOURNEY


    other description formats to produce a mock version of the API design. While the
    mock API won''t be fully formed, it will provide a basic understanding of how
    the API will be used once complete and catch suboptimal design decisions early.


    # Developing a Culture of Reuse


    API consumers are an essential ingredient of any program. However, many organizations
    focus on strategy, objectives, and governance to create APIs without addressing
    the need to adoption of APIs easy through discovery.


    For most organizations, API documentation is an afterthought. This is unfortunate,
    as it leads to serious consequences for API discovery and adoption, resulting
    in reduced reuse of valuable APIs. Organizations implementing effective API discovery
    subscribe to the following mantra: Digital capabilities when possible; build them
    when necessary.


    API documentation is the first encounter developers will have with an API


    **Figure 16.1** The API consumption lifecycle, showing the phases that a development
    team experiences when they find a new API.'
  merge: -1
