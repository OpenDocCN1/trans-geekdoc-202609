  md: "# Exploring GraphQL\n\nGraphQL⁷ is an RPC-based API style that supports the\
    \ querying and mutation of data. It is a specification that was developed internally\
    \ by Facebook in 2012 before publicly released in 2015. It was originally designed\
    \ to overcome the challenges of supporting Web and mobile clients that need to\
    \ obtain data via APIs at different levels of granularity and with the option\
    \ of retrieving deeply nested structures. Over time, it has become a popular choice\
    \ by frontend developers who need to bridge backend data with single-page applications\
    \ (SPAs) and mobile apps.\n\nAll GraphQL operations are tunneled through a single\
    \ HTTP POST or GET-based URL. Requests use the GraphQL query language to shape\
    \ the response of desired fields and any nested resources in a single request.\
    \ Mutations support modifying or performing calculation logic and use a similar\
    \ language to query the data input for a modification or calculation request.\
    \ All resource structures are defined in one or more schema files, ensuring that\
    \ clients may introspect resources at design time or runtime. Listing 8.4 provides\
    \ an example of a GraphQL query.\n\nListing 8.4 GraphQL Query to Fetch the San\
    \ Francisco Airport by IATA code\n\n```\ngraphql\n{\n  airports(iataCode: \"SFO\"\
    )\n}\n\n{\n  \"data\" : {\n    \"Name\": \"San Francisco International Airport\"\
    ,\n    \"iataCode\": \"SFO\",\n    \"Location\": {\n      \"Address\": \"South\
    \ McDonnell Road, San Francisco, CA 94128\",\n      \"City\": {\n        \"CountryRegion\"\
    : \"United States\",\n        \"Name\": \"San Francisco\",\n        \"Region\"\
    : \"California\"\n      }\n    }\n  }\n}\n```\n\n7. https://graphql.org"
