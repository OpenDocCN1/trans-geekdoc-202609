- pgno: 135
  md: '# Chapter 7


    # REST-Based API Design


    The REST interface is designed to be efficient for large-grain hypermedia data
    transfer, optimizing for the common case of the Web, but resulting in an interface
    that is not optimal for other forms of architectural interaction.


    > — Roy Thomas Fielding


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_135_0.png)


    Figure 7.1 The Design phase offers several options for API styles. This chapter
    covers REST-based API design.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'As teams move from the modeling to the design phase, they are faced with a
    variety of decisions. Some of these will resolve easily, while others will take
    time and deliberation. Just know that it is difficult to get an API design right
    the first time. There, teams are encouraged to spend time designing and prototyping
    their APIs to get feedback from early adopters before coding.


    This chapter presents an overview of REST, along with a step-by-step process for
    migrating an API profile, created during the API modeling phase, into a REST-based
    API design. Along the way, various decisions and common design patterns are explored.
    The result will be a high-level API design (Figure 7.1) that applies REST-based
    principles.


    # Principle 3: Select the API design elements that match the need


    Trying to find the perfect API style is a fruitless endeavor. Instead, seek to
    understand and apply the API elements appropriate for the need, whether that is
    REST, GraphQL, gRPC, or an emerging style just entering the industry. The next
    three chapters provide insights into popular API styles to help teams select the
    right style or styles that fit the need. The chapters discuss when to apply each
    style, when to select synchronous or asynchronous interaction models, and whether
    to offer SDK libraries.


    # What Is a REST-Based API?


    Representative State Transfer (REST) is an architectural style for distributed
    multimedia systems. Unlike HTTP, REST is not a specification that is managed by
    a standards group. The term was coined by Roy Thomas Fielding in his PhD dissertation,
    "Architectural Styles and the Design of Network-based Software Architectures."1
    This paper outlines the core concepts and constraints for understanding an architectural
    style and how these constraints were applied in varying degrees to architect the
    World Wide Web.


    When discussing REST APIs or REST-based APIs, many people reference Fielding’s
    work without realizing that it extends beyond Web-based APIs. The paper seeks
    to establish fundamental constraints for designing evolvable and scalable distributed
    systems. Those interested in software architecture, particularly distributed software,
    should read Fielding’s paper as part of their studies.


    > 1 Roy Thomas Fielding, "Architectural Styles and the Design of Network-based
    Software Architectures" (PhD diss., University of California, 2000), https://www.ics.uci.edu/~fielding/pubs/dissertation/top.htm.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# What Is a REST-Based API?


    The paper does not require the use of HTTP as the underlying protocol for REST-based
    architecture. It does, however, discuss how the authors of the HTTP specification
    relied on the outlined architectural constraints to make it more evolvable. Because
    HTTP is the protocol of choice for most network-based APIs, the details offered
    in this and later chapters rely on HTTP as the protocol of choice.


    The set of architectural properties outlined in Fielding''s paper to establish
    constraints create agreement around flexibility and evolvability when applied
    to distributed systems, including network-based APIs:


    +   **Client/server:** The client and server act independently, and the interaction
    between them is only in the form of requests and responses.


    +   **Stateless:** The server does not remember anything about the user who uses
    the API, so all necessary information to process the request must be provided
    by the client on each request. Note: This isn''t about server-side state.


    +   **Layered system:** The client is agnostic to how many layers, if any, are
    there between the client and the actual server responding to the request. This
    is a key principle of HTTP, allowing for client-side caching, caching servers,
    reverse proxies, and authorization layering—all transparent to the client sending
    the request.


    +   **Cacheable:** The server response must contain information about or not the
    data is cacheable, allowing the client and any middleware servers to cache data
    outside of the API server.


    +   **Code on demand (optional):** The client can request code from the server,
    usually in the form of a script or binary package, for client-side execution.
    This is performed today by browsers requesting JavaScript to extend the behavior
    of a Web page. Code on demand is an opportunity for API teams to provide JavaScript
    files for clients to retrieve that perform form validation and other responsibilities.
    Thus, evolvability can be extended to clients code on demand.


    +   **Uniform interface:** Encourages independent evolvability by leaning on resource-based
    identification, interaction using representations, self-descriptive messages,
    and multimedia controls.


    The architectural constraints outlined in Fielding''s paper are important when
    considering the design of a Web-based API. When taken together, these constraints
    contribute to the design of evolvable Web APIs.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# REST Was Never about CRUD


    As already mentioned, REST is not a specification or a protocol. Contrary to popular
    opinion, a REST-based API does not require JSON or the use of the create-read-update-delete
    (CRUD) pattern of data interaction. REST is simply a set of constraints and agreements
    on how the individual components work together. This offers flexibility to address
    architectural issues. Many of today''s Web-based APIs use JSON and the CRUD pattern
    as design elements.


    Unfortunately


    Frankly, these disagreements are not beneficial. Instead, it is best to approach
    an API labeled RESTful or REST-based with a mindset of grace and understanding
    that not everyone has read and fully applied the original REST paper. Use the
    opportunity to gently coach teams on how their architecture and API design can
    be improved over time. Whatever you do, please don''t use the opportunity to show
    how much more you know about REST than they do.


    # REST Is Client/Server


    The client/server architecture is an essential REST constraint. The server hosts
    available resources, supporting operations through synchronous, message-based
    interactions that the client and server allows the user interface of the client
    interacts with it.


    Separating the client and server allows the user interface of the client to change
    over time. New devices and interface styles may be used without requiring changes
    to the server.


    Most important is that the client is able to evolve independently of the server.
    The server may offer new resources or additional representation formats without
    negatively impacting the client. This is fundamental to why APIs may be offered
    as products, with or without a preexisting user interface provided by the vendor.


    # REST Is Resource-Centric


    The key abstraction of information in REST is a resource. As mentioned in Chapter
    1, “The Principles of API Design,” a resource consists of a unique name or identifier
    that can reference documents, images, collections of other resources, or a digital
    representation of anything in the real world, such as a person or thing.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# What Is a REST-Based API?


    Resource representations capture the current state or intended state of a resource.
    Every resource must support at least one representation format but may support
    more than one. These representations may include a data format such as JSON, XML,
    CSV, PDF, image, and other media types.


    The representation formats supported for any given resource may vary depending
    on the needs of the client. For example, JSON may be a default media format offered
    by a REST-based API. However, some resources may need to be manipulated in a spreadsheet
    and therefore offer an alternative CSV-based representation of the same resource.


    For example, a resource may represent a person named Vaughn Vernon. The resource
    may have one or several representations. There may be a JSON-based representation,
    along with an XML representation. If a historical record is kept of all changes,
    each change may also exist as a representation that is available in JSON and XML
    media formats.


    # REST Is Message Based


    Readers of Fielding''s dissertation may have noticed that it focuses on the message
    exchange between client and server. Notice the use of the terms messages and self-descriptive
    messages in the paper. REST-based API design goes beyond the priorities within
    a JSON or XML representation.


    A resource representation is the message body within the overall message. Transport
    protocol design is also part of a complete REST-based API design. The URL path,
    URL query parameters, and HTTP request/response headers must all be considered
    as part of the design process. Focusing only on the message body results in an
    incomplete design.


    The combination of the HTTP method, URL, and request body is a command message
    sent from the client to the server. It tells the server what you would like to
    do. The response headers, status code, and response payload comprise the reply
    message to the client. When developers think of REST-based APIs as exchanging
    messages with clients, their API designs become more capable of evolving over
    time as the message evolves and grows and matures.


    # REST Supports a Layered System


    The REST architecture style is a layered system, which means that a client should
    not be built on the assumption it is communicating directly with the server. There
    may be multiple middleware layers between the client and server that offer caching,
    logging, access controls, load balancing, and other infrastructure needs, as shown
    in Figure 7.2.'
  merge: -1
  img_proc: true
