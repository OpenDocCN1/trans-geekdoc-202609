    \ server-side business logic and keep that in sync at all times.\nIt is important\
    \ to note that Fielding has expressed a preference to use the term hypermedia\
    \ controls rather than HATEAOS. Through the remainder of the book, the term hypermedia\
    \ controls will be used in place of HATEOAS for clarity."
