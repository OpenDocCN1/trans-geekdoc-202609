- pgno: 224
  md: '# CHAPTER 10 FROM APIs TO MICROSERVICES


    All organizations want to deliver business value as fast as possible. At the same
    time, they must ensure their software consistently works as expected. Increasing
    the speed of development risks an increase in bugs and decrease in reliability.
    The larger a software solution becomes, the greater this risk.


    To mitigate these risks, organizations are required to reduce velocity in software
    delivery by coordinating through meetings. These meetings seek to optimize delivery
    while addressing risks along the way. The larger the software solution, the more
    meetings that are required to mitigate associated risks. Every, however, the balance
    between speed and delivering quality software is important.


    Decomposing APIs into microservices (Figure 10.1) is one option for teams to address
    this need for balance. This chapter explores the topic of microservices, including
    benefits, challenges, and alternatives to microservices.


    # What Are Microservices?


    Microservices are small, independently deployed components that deliver one or
    a small number of bounded digital capabilities. Each service offers one of the
    digital capabilities required, ensuring that each service has a limited scope.
    When combined, microservices deliver a highly complex solution using smaller building
    blocks than the traditional service-oriented approach, as shown in Figure 10.2.


    Microservice adoption has typically been used to decompose highly complex systems
    into independently deployed components rather than containing the complexity within
    a single codebase. The cognitive load required to understand a single microservice
    is lower compared to that of understanding a single codebase.


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_224_0.png)


    Figure 10.2 The traditional way of thinking about monolithic, service-oriented,
    and microservice architectures. Dashed lines represent traditional course-grained
    boundaries that are further decomposed to reduce the complexity of more course-grained
    services.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# WHAT ARE MICROSERVICES?


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_225_0.png)


    **Figure 10.3** Microservices decompose high complexity into smaller, independently
    deployable components.


    Testing becomes more approachable, and automated test suites become more focused
    on the single component (see Figure 10.3).


    The idea of microservices has been around for more than a decade but only recently
    have microservices gained widespread use by the late majority. In the early days
    of microservices, teams had to weigh the effort required to establish and maintain
    the infrastructure necessary for a microservices architecture. Over time, many
    of these factors were addressed through cloud-native infrastructure, the growth
    of the DevOps culture, better delivery pipeline automation, and the use of containers
    for producing self-contained deployment packages.


    # ### A Warning about the Term Microservices


    It is important to recognize that there is a variety of definitions and scope
    assigned to microservices. Some organizations or individuals may define microservices
    as individual entities that offer a Web API, resulting in many network calls between
    services unnecessarily. Other definitions exist as well. Use caution when the
    organization makes a broad declaration that it is moving to microservices.


    First, be sure to understand what is meant by the term. Be specific in the definition
    and intent. Next, seek a reference architecture and one more reference applications
    to demonstrate the desired target state. Ask questions as necessary to ensure
    a shared understanding of the purpose and outcomes when shifting to microservices.
    Otherwise, everyone will assign their own definition of a microservice, and chaos
    will reign across the organization.


    Finally, recognize that organizations may be using the term microservices in a
    specific way, while others may use the term to indicate that teams should “think
    smaller” than large, siloed systems that exist today. Do not assume understanding
    without following these recommended steps to align on a mutual definition and
    goals when shifting to microservices.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Microservices Reduce Coordination Costs


    With many of these factors addressed today, organizations are now taking a microservice-based
    approach by default. However, it is important to understand both the benefits
    and the challenges of architectural decisions around microservices. Both technical
    and nontechnical factors that can have a positive or negative impact on the people
    behind the services and must be considered in the decision making.


    The cost of coordinating many teams working within the same codebase is extremely
    high. Meeting after meeting is required to ensure that developers don''t introduce
    bugs and merge conflicts are avoided. For large organizations, the introduction
    of additional managers is required to coordinate the coordination.


    The greatest benefit of microservices is to reduce team coordination. A team operating
    independently to maintain one or a few microservices can coordinate within their
    team with limited coordination points outside their team. Metcalf¹ smaller teams
    result in fewer communication paths. The benefit is that it takes fewer meetings
    to communicate intent and resolve issues across the organization. The result is
    a team with more time to design, code, test, and deliver their services.


    Coordination across teams is not eliminated with microservices, however. Integration
    must be coordinated to ensure that all the microservices fit the solution needs.
    Timelines must be synced between product managers, business, and service teams.
    Therefore, the number of smaller team meetings may increase, whereas the number
    of attendees and the scope of discussion is greatly reduced for each meeting.
    Teams are given more independence and meetings are more efficient as coordination
    efforts are limited to the scope of the team''s deliverables.


    To achieve the goal of reduced team coordination, several factors are required:


    +   - Self-service, automated infrastructure resources ensure rapid onboarding
    of new services. These resources are commonly associated with a DevOps culture
    of automation tooling with continuous delivery processes.


    +   - Team ownership of services throughout the software development lifecycle,
    including enhancements and support services. Team ownership across the lifecycle
    results in a culture of “you own it, you manage it” rather than delivery to operations
    teams may also include software reliability engineers and other roles to augment
    the team.


    +   - Removal of centralized data ownership, allowing each service to own and
    manage the data associated with their services.


    > 1. Wikipedia, s.v. “Metcalfe''s Law”, last modified April 13, 2021, 13:48, https://en.wikipedia.org/wiki/Metcalfe%27s_law.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# WEIGHING THE COMPLEXITY OF MICROSERVICES 193


    Without incorporating these important factors, any shift to microservices will
    be met with challenges, including bloated microservices, slower velocity of delivery,
    and even project failure. This topic is discussed further in Chapter 6 of Strategic
    Monoliths and Microservices in the section "Open-Host Service."


    The benefits of moving to microservices have less to do with technology choices
    and more to do with the impact they have on the organization. The shift to microservices
    must be considered thoughtfully, as they may have a positive or negative impact
    on day-to-day development and operations.


    # The Difference between APIs and Microservices


    While API products and microservices each offer network-based APIs, the differences
    between them are vast:


    +   - API products target stability and evolvability, whereas microservices enable
    experimentation. Consumers of an API expect the contract to never break unless
    migrating to a new version of an API. Microservices are designed for experimentation
    and constant change. As such, microservices may be split, combined, or removed
    at any time.

    - API products offer a set of digital capabilities for integration into solutions.
    Microservices decompose a solution into distributed components. They are not an
    external contract with the developer beyond the immediate boundary. If an external
    contract becomes a requirement, the service must be transitioned to an API product
    with a stable interface.


    Just because the codebase is small doesn''t make it a microservice. A microservice
    is an internal component and shouldn''t be shared directly with external consumers.
    API products may be shared within a specific team, across teams, the organization,
    and/or with partners/public developers.


    # Weighing the Complexity of Microservices


    The most important factor when considering microservices is the complexity of
    the solution. Complexity cannot be fully removed from a software solution. However,
    it may be distributed across the solution. Microservices allow the complexity
    to be


    > 2. Vaughn Vernon and Tomasz Jaskula, Strategic Monoliths and Microservices:
    Driving Innovation Using Purposeful Architecture (Boston: Addison-Wesley, 2021).'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'spread across components, making each individual component easier to build
    and manage. However, separating the problem into distributed components introduces
    other complexity.


    Each team and organization must consider the complexity of a solution and the
    complexities that microservices introduce to determine if a shift to microservices
    will help or hinder the organization''s ability to deliver solutions with speed
    and safety. While a single microservice may offer lower complexity, the infrastructure
    and automation requirements to deliver, monitor, and protect the service at runtime
    increases.


    If the solution has a low factor of complexity, then microservices are often unnecessary
    and may even be detrimental to solution success. If the complexity of the solution
    is unknown, weigh the factors that follow and then starting with a minimal solution
    that balances these factors, migrating to microservices when and the complexity
    increases.


    # Self-Service Infrastructure


    Microservices require a self-service, fully automated infrastructure. Teams must
    be able to design a microservice, build it, and deploy code without any manual
    processes or approvals. Organizations that have not fully automated their provisioning
    and deployment pipeline will encounter considerable friction. Without full automation
    support, new code will be added to existing microservices to avoid manual processes,
    resulting in a very large, siloed services.


    # Independent Release Cycles


    Microservices must have their own release cycle. Some organizations opt to use
    their existing release processes, such as a two-week sprint and release, rather
    than allowing microservices to be released when they are ready. This coordinated
    deployment of all microservices at once results in a large release process rather
    than independent teams that may deploy their microservices as needed.


    # Shift to Single-Team Ownership


    Each microservice should be owned, monitored, and managed by a single team. Teams
    should own only one or a few microservices to focus their efforts. They must own
    the service from definition to design and delivery. They must support the service,
    much like a product that seeks to incorporate improvements as feedback received
    from other teams.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# WEIGHING THE COMPLEXITY OF MICROSERVICES 195


    Smaller organizations find it challenging to assign single-team ownership, instead
    sharing the ownership of all services across a small number of developers. Developers
    spend more time moving between codebases and dealing with the challenges of distributed
    computing than they deliver solutions to market.


    # Organizational Structure and Cultural Impacts


    Microservices require proper organizational support and structure. Organizational
    structure and culture may be at odds with the ownership and independence of microservices
    teams. Reporting structures may be optimized for larger delivery teams. Challenges
    may arise in coordinating service integrations across teams that span managers.
    Organizations that prefer centralized oversight may encounter difficulties shifting
    control to individual teams.


    These organizational challenges may create an unhealthy tension that makes it
    difficult to move to microservices while achieving the speed and safety often
    promised with microservices. Keep the organization''s structure in mind before
    shifting to microservices by ensuring that buy-in exists from the executive team
    and managers who oversee service teams.


    > Tip

    Don''t discount the organizational and cultural impacts of adopting microservices.
    The shift from product- or project-based ownership to the ownership of one or
    a few microservices within a bounded area will have an impact on reporting structures
    and team alignment. Count the cost before proceeding. Otherwise, the organization
    may be trading code complexity for organizational complexity.


    # Shift in Data Ownership


    Microservices must own their own data. This can be a challenging item, as rarely
    think beyond the source code when it comes to shifting to microservices. When
    services do not own their data, the coordination cost of underlying schema changes
    can ripple across multiple microservices that share the data. It can require large,
    coordinated release efforts to bring every service in line with a breaking schema
    within a shared data source.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Distributed Data Management and Governance


    Microservices require considerable data management and governance. Because microservices
    own their own data, investment must be made to ensure that proper data management
    policies exist for reporting and analytics. Today data management is typically
    handled through extract-transform-load (ETL)-based processes that migrate data
    into an online analytical processing (OLAP)–based store for optimized queries
    and decision support.


    Shifting to microservices requires shifting to data streaming rather than bringing
    data from multiple services for the purposes of data aggregation and reporting.
    More emphasis is needed to be placed on managing glossaries that create a strong
    ontology and taxonomy to unify distributed data models. Organizations with centralized
    data governance and large shared databases must use caution when migrating to
    a microservices architecture. Finally, don’t underestimate the effort required
    to separate a monolithic data store into data store per.


    # Distributed Systems Challenges


    The journey toward microservices requires a deep understanding of distributed
    systems. Those not familiar with the concepts of distributed tracing, observability,
    eventual consistency, fault tolerance, and failover will encounter a more difficult
    time with microservices, the eight fallacies of distributed computing, written
    by L. Peter Deutsch and others at Sun Microsystems in 1994 and still applicable
    today, must be understood by every developer.


    In addition, many find that architectural oversight is required to initially decompose
    and subsequently integrate services into solutions. Teams unable to have architectural
    support may suffer from lack of architectural consideration in the design of their
    microservices, resulting in poor boundaries and overlapping team responsibilities
    that produce cross-team coordination. The Align phase of the ADDR process seeks
    to address this concern early.


    Finally, layered architectures are common within a monolithic codebase but are
    frowned upon them. If microservices are layered incorrectly, a change to a single
    microservice may ripple to other services and require additional coordination
    efforts to synchronize the changes. Microservices that apply a layered approach
    must ensure that the impact of a service change is limited. Revisited the layered
    principle of REST to see how layers may be used to add independence between components.


    > 3. Wikipedia, s.v. “Fallacies of Distributed Computing,” last modified July
    24, 2021, 20:52, https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Resiliency, Failover, and Distributed Transactions


    With more microservices comes greater complexity when calls between services are
    required. Synchronous microservices require call chaining across a network and
    are therefore susceptible to network failure.


    Resiliency must be built into each microservice to ensure retries and failover
    occur in the event of a temporary network outage. The concept of a service mesh,
    discussed in Chapter 15, "Protecting APIs," was introduced to address these crosscutting
    concerns, but a service mesh introduces further deployment and operational complexity
    that may be unnecessary for simple solutions.


    Another side of synchronous call chaining is that failures beyond the first call
    require previous service calls to roll back transactions. During the height of
    service-oriented architecture (SOA), transaction managers were used to create
    distributed transactions, usually through the use of two-phase commit (2PC) transactions.
    This isn''t an option with a highly distributed microservice architecture.


    Instead, distributed transactions are often implemented using the Saga pattern.
    A transactional context is applied within each service call, with compensating
    transactions used to perform the opposite operation when a rollback is required
    for each resource involved. Event sourcing is often used alongside the Saga pattern
    to ensure that all operations are atomic transactions backed by a ledger for auditing
    and troubleshooting purposes.


    # Refactoring and Code Sharing Challenges


    Refactoring code is more challenging with microservices, as integrated development
    environments (IDEs) and other refactoring tools can only refactor within a single
    codebase. Refactoring code across multiple microservice codebases becomes more
    error prone.


    When microservices use the same programming language, the tendency is to utilize
    a shared codebase for common code. Sharing code between services can create coordination
    coupling, requiring more meetings to ensure a change to code shared across microservices
    doesn''t negatively impact others. When sharing code between services, all changes
    must be optional to avoid forcing other teams to be in lockstep.


    > 4. Chris Richardson, "Pattern: Saga," Microservice Architecture, accessed August
    19, 2021, https://microservices.io/patterns/data/saga.html.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Do You Really Need Microservices?


    After weighing the challenges of microservices and the underlying operational
    complexity, it may be determined that an API boundary doesn''t need to be decomposed
    into microservices. Instead of microservices, perhaps all that is needed is one
    or more monolithic APIs that are designed to be modular, known as monoliths.


    Modular monoliths apply loose coupling and high cohesion within single codebase
    to avoid the complexity of distributed computing. Over time, the monolith may
    be decomposed into microservices if the solution becomes too complex for a single
    codebase. However, only apply this approach once all paths to refactoring and
    reorganizing the modules of a single codebase have been exhausted.


    Remember that organizations aren''t limited to a single monolith. Multiple modular
    monoliths may be sufficient for the needs of the team. Each monolith offers one
    or a few APIs that support the operations within the bounded contexts contained
    within the monolith.


    # Synchronous and Asynchronous Microservices


    Microservices may be designed to be synchronous or asynchronous. Synchronous microservices
    apply a more traditional request/response model, typically via HTTP REST, RPC,
    or a query API style.


    While synchronous, request/response-based APIs are more familiar to developers,
    the result can be the creation of fragile integrations. Services that orchestrate
    API calls between services may fail midstream if a problem occurs with a single
    service, requiring a reversal of previously successful API calls. Services that
    call other services, termed call chaining, may fail midstream but are unable to
    reverse the previous API calls themselves. Figure 10.4 illustrates this concern,
    as the client only called Service A, which results in more service calls that
    can fail in the event of a downstream error.


    Alternatively, an asynchronous access pattern may be used for microservice integration.
    In this style, messages are submitted to a message queue or topic hosted on a
    message broker or streaming server. One or more microservices listen for messages,
    in turn, and emit messages containing business events as the result.'
  merge: -1
  img_proc: true
