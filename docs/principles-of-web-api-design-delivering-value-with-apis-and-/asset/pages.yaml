- pgno: 114
  md: '# CHAPTER 6 API MODELING


    Developers are often tempted to start writing code immediately. Code is the primary
    tool for developers. It is everything—the hammer, screwdriver, ruler, and saw.
    When code is seen as the one and only tool to design an API, the quality of the
    API design can suffer. The march to produce code for production becomes more valued
    than the outcomes the API is meant to produce.


    Of course, code produces value when it is used to explore a specific area of a
    solution to reduce risk. It is also valuable to use code to experiment, surface
    unknowns, or explore a new technology. The term tracer bullet was applied to software
    by David Thomas and Andrew Hunt in their book The Pragmatic Programmer.¹ The term
    describes the use of code as a means of exploration and risk reduction. Tracer
    bullet delivers value through learning rather than through production-ready code.


    API modeling is a tracer bullet for API design. It is a technique for exploring
    the necessary elements of an API prior to the design and delivery process. API
    modeling (see Figure 6.1) helps to bring the insights and artifacts from the previous
    steps into an API profile that describes the scope and intent of the APIs needed
    to deliver the desired outcomes of ends.


    # What Is API Modeling?


    Just as a beautiful web design begins with a wireframe, a great API design begins
    with an API model that helps define its scope and responsibilities. The goal of
    API modeling is to fully understand and validate the needs of developers and end
    users. Unlike a wireframe, which focuses strictly on end user interaction, API
    modeling focuses on both developer and end user goals. Often, these goals are
    aligned, but sometimes they are not. API modeling helps to surface issues quickly
    so that they may be resolved before writing code.


    API modeling uses job stories, activities, and activity steps to produce a cohesive
    view of each API, called an API profile. An API profile captures characteristics
    about the API, including its name, scope, operations, and edited events that will
    be used to deliver desired outcomes. API modeling is done before designing and
    developing begins—while the cost of code is significantly lower.


    After completing API design, teams will need to migrate the API profiles produced
    into an API design. API modeling can be used as input for a single API design
    style of choice, such as REST, GraphQL, or gRPC. It may also be used to


    +   1. David Thomas and Andrew Hunt, The Pragmatic Programmer: Your Journey to
    Mastery, 20th Anniversary Edition, 2nd ed. (Boston: Addison-Wesley, 2020).'
