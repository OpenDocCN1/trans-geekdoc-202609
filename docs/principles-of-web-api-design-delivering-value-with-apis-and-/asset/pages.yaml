  md: '# CHAPTER 9 ASYNC APIs FOR EVENTING AND STREAMING


    SSE does have few cases where it may not be a fit:


    +   * The API gateway isn not capable of handling long-running connections or
    has a brief timeout period (e.g., less than 30 seconds). While this isn''t a stopover,
    it will require the client to reconnect more often.

    * Some browsers do not support SSE. Refer to Mozilla''s list of compatible browsers$^{12}$
    for more information.

    * Bidirectional communication between client and server is required. In this case,
    the WebSocket protocol may be a better option, as SSE is server push only.


    The W3C SSE specification is easy to read and offers additional specifications
    and examples.


    # Bidirectional Notification via WebSocket


    WebSocket supports the tunneling of a full-duplex protocol, called a subprotocol,
    within a TCP connection that is initiated by HTTP. Because they are full-duplex,
    bidirectional communication becomes possible between API clients and servers.
    Clients are able to push requests to the server over a WebSocket connection, and
    while the server is able to push events and responses back to the client.


    WebSocket is a standardized protocol maintained by the Internet Engineering Task
    Force for RFC 6455.$13}$ Most browsers support WebSocket, making it easy to use
    for browser-to-server, server-to-browser, and server-to-server scenarios. Because
    WebSocket connections are tunneled through HTTP connections, they can also overcome
    proxy restrictions in some organizations.


    An important factor to keep in mind is that WebSocket doesn''t behave like HTTP,
    even though it uses HTTP to initiate the connection. A subprotocol must be selected.
    There are many subprotocols officially registered with IANA.$14}$ WebSocket supports
    both text and binary format subprotocols. Figure 9.9 shows an example WebSocket
    interaction using a plain text subprotocol.


    WebSocket is more complex to implement but supports bidirectional communication.
    This means that they allow clients to send data to the server as well as receive
    data from the server using the same connection. While SSE is easier


