- pgno: 110
  md: '# CHAPTER 5 IDENTIFYING API BOUNDARIES


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_110_0.png)


    **Table 5.1** Activity Steps for JSON''s Bookstore; Separators Indicate Shifts
    in Vocabulary that Identify Boundaries


    | Digital Capability | Activity | Activity Step | Participants | Description |

    |---|---|---|---|---|

    | Place an Order | Browse for Books | List Books | Customer, Call Center | List
    books by category or release date |

