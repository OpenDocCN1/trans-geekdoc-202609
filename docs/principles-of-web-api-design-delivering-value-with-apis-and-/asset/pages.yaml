    \ #13 <- this one failed. What now?\nPUT /seats/seat4 to reserve seat #4\n```\n\
    \nInstead, consider creating a Reservation resource that represents the transaction:\n\
    \n```\nPOST /reservations\n{\n  \"seatIds\": [\"seat1\", \"seat2\", \"seat3\"\
