    lines of communication are extended in three distinct ways:


    +   1. **Communication across network boundaries**: An API''s design, including
    its choice of protocol, has an impact on the chattiness of the API. Network protocols,
    such as HTTP, are better for coarse-grained communication. Other protocols, such
    as Message Queuing Telemetry Transport (MQTT) and Advanced Message Queuing Protocol
    (AMQP), often used for messaging APIs, are better suited for fine-grained communication
    within a defined network boundary. The API design reflects the frequency of communication
    between systems and the impact it may have on performance because of network boundaries
    and bottlenecks. The API design process has a heavy impact on performance of the
    client and server.


    +   2. **Communication with consuming developers**: API design and associated
    documentation are the user interface for developers. They inform developers how
    and when they are able to use each API operation. They also determine whether
    and how developers can combine operations to achieve more complex results. Communication
    early and often during the API design process is essential to meet the needs of
    developers consuming the API.


    +   3. **Communication to the marketplace**: API design and documentation information
    prospective customers, partners, and internal developers what outcomes the APIs
    make possible through the digital capabilities they offer. Effective API design
    helps to communicate and enable these digital capabilities.


    API design is an important part of communication. An API design process helps
    us to consider these aspects of communication during the design phase.


