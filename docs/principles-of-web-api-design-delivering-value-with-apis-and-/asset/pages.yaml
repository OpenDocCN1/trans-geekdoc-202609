- pgno: 278
  md: "# JSON Schema\n\nThe JSON Schema specification offers a machine-readable format\
    \ for capturing the structure and validation rules for JSON-based structures.\
    \ The specification is divided into core foundational rules and validation rules,\
    \ making it a comprehensive solution for defining JSON schemas that require validation.\
    \ JSON Schema can be thought of as the JSON equivalent to XML Schema.\n\nWhile\
    \ independent of any one API style, JSON Schema may be used to describe resource\
    \ representations for REST-based APIs and other API styles. It is also found in\
    \ organizations as a single format for defining schema formats for domain objects\
    \ across the enterprise.\n\nWhile the schema definition portion of OAS is quite\
    \ flexible, it lacks some of the robust definition support offered by JSON Schema.\
    \ Recent efforts have helped bring JSON Schema and OAS into alignment to allow\
    \ for the use of both formats. Expect JSON Schema to continue gaining tooling\
    \ support forward given its acceptance within the OAS description format. JSON\
    \ Schema is demonstrated in Listing 13.4.\n\n**Listing 13.4** Example JSON Schema\n\
    \n```\n{\n  \"$id\": \"https://example.com/BookSummary.schema.json\",\n  \"$schema\"\
    : \"http://json-schema.org/draft-07/schema#\",\n  \"description\": \"Summarizes\
    \ a book that is stocked by the book store...\",\n  \"type\": \"object\",\n  \"\
    properties\": {\n    \"bookId\": {\n      \"type\": \"string\"\n    },\n    \"\
    isbn\": {\n      \"type\": \"string\"\n    },\n    \"title\": {\n      \"type\"\
    : \"string\"\n    },\n    \"authors\": {\n      \"type\": \"array\",\n      \"\
    items\": {\n        \"$ref\": \"#/definitions/BookAuthor\"\n      }\n  }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 279
  md: "```\n}\n}\n,\"definitions\": {\n  \"BookAuthor\": {\n    \"type\": \"object\"\
    ,\n    \"properties\": {\n      \"authorId\": {\n        \"type\": \"string\"\n\
    \      },\n      \"fullName\": {\n        \"type\": \"string\"\n      }\n    }\n\
    \  }\n}\n}\n```\n\n# API Profiles Using ALPS\n\nApplication-Level Profile Semantics\
    \ ALPS is a description format for defining application-level and domain semantics,\
    \ independent of the API style(s) and protocol(s) available. It helps to define\
    \ a profile of the digital capabilities and messages exchanged for an API rather\
    \ than the specifics of how to interact with the API. ALPS is a machine-readable\
    \ format that is useful for capturing API profiles produced during API modeling\
    \ (detailed in Chapter 6, “API Modeling”).\n\nALPS was designed to provide API\
    \ and service discovery, API catalogs, and tooling metadata where an API profile\
    \ may be implemented using one or multiple API styles, including REST-based, gRPC,\
    \ and/or GraphQL. The specification provides support for XML, JSON, and YAML formats.\n\
    \nALPS supports the combination of two fundamental elements: data (the message)\
    \ and transitions (operations). When combined, these elements capture the operational\
    \ and message semantics for an API profile. The default format for ALPS is XML,\
    \ though a JSON-based specification is planned.\n\nListing 13.5 provides an example\
    \ API profile that could be used to describe the operations and messages for any\
    \ number of API style implementations that are available."
  merge: -1
  img_proc: true
