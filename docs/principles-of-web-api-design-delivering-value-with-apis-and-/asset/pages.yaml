- pgno: 299
  md: 'happens, teams should try to ensure that they do not introduce breaking changes
    that will force their API consumers to fix code. For some API consumers, updating
    code to adapt to an API change may not be an option at all. Then, it is important
    to understand what may constitute a breaking change, then establish an API versioning
    policy that encourages the evolution of an API over time without breaking existing
    API consumers.


    # Common Nonbreaking Changes


    Nonbreaking changes tend to be additive in nature, although this isn’t always
    the case. These kinds of changes may include


    +   * Adding a new API operation. Existing client code won’t use the operation,
    no harm is done to existing integration.


    +   * Adding an optional field to a request message. In this case, existing client
    code will not be forced to add the new field.


    +   * Adding a required field to a request message with a default value. For client
    code written prior to the addition, the server will apply the default value because
    it would be missing from the request.


    +   * Adding a field to a response message. Existing client code should safely
    ignore the new field(s) unless they opted to use a mapping library that raises
    an error if the newly added field cannot be found in the destination object. This
    is an antipattern for API consumption but may be encountered in some circumstances,
    use caution.


    +   * Adding a value to an enumeration field. A new value that is serialized on
    the client may not have a known display string associated to it. To be a nonbreaking
    change, older clients must run correctly when receiving a new enum value. Not
    all clients may be designed in this way, so caution is advised.


    # Incompatible Changes


    Changes that are incompatible with existing integration code include, but are
    not limited to, the following:


    +   * Renaming fields and/or resource paths, as existing client code will require
    a code change to adapt to the renamed value


    +   * Renaming or removing fields in a request or response


    +   * Removing API operations used by existing API client code'
  merge: -1
  img_proc: true
- pgno: 300
  md: '+   Changing fields from a single value to a one-to-many relationship (e.g.,
    moving from one email address per account to a list of email addresses for an
    account)


    +   Changing the HTTP method or the response codes returned by an API operation


    Remember that once an API is released into production and has at least one integration,
    the design decisions are permanently a part of the API. This is why the ADDR process
    is so important—it helps teams to validate design decisions before an API goes
    into production. However, a proper API versioning strategy can assist in mitigating
    some of these issues while allowing an API design to evolve over time.


    # API Versions and Revisions


    There have been many discussions, articles, and debates about API versioning.
    The most critical aspect of every discussion must be the differentiation between
    safely evolving an API design and introducing breaking changes that force code
    modification as a result. One of the best tools in the API versioning toolbox
    is the introduction of API versions and revisions.


    API versions represent a grouped set of API operations. Within each version, modifications
    to an API should be backward compatible. However, across versions there is no
    guarantee of compatibility. Each version of an API is often treated as a separate
    product with differing behaviors and capabilities. API consumers opt into a specific
    version and write code against that version. They migrate to a new version only
    when they are ready, which may be a long time after the new version is released—or
    perhaps never. Versions may be numbers or strings (e.g., v1 or 2017-01-14). For
    those familiar with semantic versioning (semver), this is the same thing as a
    major version.


    Figure 14.1 illustrates two versions of an API, each offered a different product
    that the API consumer selects when making the API request.


    An API revision identifies an internal enhancement that should have no negative
    impact on a specific API version. Revisions should be transparent to the API consumer,
    as consumers should be subscribed to a specific version only. The provider opts
    to release a new revision of a specific API version with or without knowledge
    of the API consumer. Internally, a team may release v1.2, but API consumers only
    know they are using v1 of the API (see Figure 14.2). API consumers may review
    changelogs for each revision to see if an enhancement would be useful but otherwise
    take no action when the provider releases a new API revision. This is equivalent
    to increasing the minor number when using semver.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# API VERSIONING STRATEGIES


