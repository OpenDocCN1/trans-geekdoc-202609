  md: '# A Real-World API Design Project 41


    recommendations, but feel free to use anything that enables communication and
    collaboration within and across teams.


    +   * Spreadsheets: Spreadsheets are the universal tool and are quite useful for
    capturing stories. One job row in a spreadsheet will suffice. The first column
    should be a job story identifier. Dedicate the next columns to each of the three
    components, "When," "I want to," "so I can." Finally, add a fifth column for notes.
    Many spreadsheets support collaborative editing, enabling multiple people to review,
    comment, and contribute as needed.

    * Documents: Documents are also useful, though they are a bit less structured.
    They are useful when teams wish to mimic an index style for capturing job stories.
    Start with a heading that indicates the job story identifier, as a number or brief
    description. Place each of the three components of a job story, "When," "I want
    to," "so I can," on a separate line for readability. Leave room for capturing
    additional insights or details as a list of bulleted items. Add a blank space
    between each job story to help separate each one, or assign one job per page.

    * Markdown: Markdown is a text file with an approachable syntax for capturing
    job stories. Markdown files may be used to export stories into HTML, PDF, and
    other formats. Use a single Markdown file with all job stories, or create a Markdown
    file for each job story. Combine with a version control system, such as git, to
    view a history of changes to the job stories. Of course, this approach is targeted
    at teams with deeper technical expertise.


