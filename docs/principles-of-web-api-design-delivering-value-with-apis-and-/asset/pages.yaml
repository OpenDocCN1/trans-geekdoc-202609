- pgno: 141
  md: '# REST Supports Code on Demand


    Code on demand is a powerful but underutilized constraint. When a client requests
    a resource, it may also request code to act upon it. The client does not have
    to know what is in the code, it just has to understand how to execute it. The
    primary benefit is that the API can extend itself without requiring the client
    applications to perform a specific upgrade.


    This technique is something that browsers do every day by downloading JavaScript
    files to execute locally within the browser. The browser does not need to know
    what is in the JavaScript files it downloads, only that they require the built-in
    JavaScript engine and therefore may be executed within the confines of the security
    sandbox offered by the browser. As new features and functionality become available,
    they are immediately available to the user without requiring a browser upgrade.


    While heavily used by Web-based applications, the REST constraint is one of the
    least utilized for REST-based APIs but one of the most powerful. Imagine an API
    that offers the option of downloading code to create Forms and client-side validation
    behavior without the need to code and maintain it on the client side!


    # Hypermedia Controls


    A hypermedia API is one driven by self-descriptive links in the representation.
    These links point to other, related API operations that reference related resources.
    They may also be used to reference other possible uses of the API, commonly referred
    to as *affordances*. Fielding considers hypermedia important to a REST-based architecture.


    APIs that use hypermedia controls extend the conversation between client and server
    by offering runtime discovery of operations. They may also be used to convey-state
    to the client through the presence or absence of links in the representation.
    This powerful concept is explored later in this section.


    Hypermedia controls help connect the dots of resources within and across APIs,
    making it operate more like the Web. Imagine using a search engine to find some
    results, only to never be offered links to click to explore the results. Unfortunately,
    that is the way most developers design their APIs, offering only data and not
    hypermedia controls that afford the client the opportunity to explore the depth
    of the data and operations offered by the API.'
  merge: -1
  img_proc: true
- pgno: 142
