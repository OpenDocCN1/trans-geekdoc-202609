    # # Summary


    Web API design incorporates three important elements to deliver a successful API:
    business capabilities, product thinking, and developer experience. These cross-functional
    disciplines mean that organizations cannot ignore the process of API design. Developers,
    architects, domain experts, and product managers must work together to design
    APIs that meet the needs of the marketplace.


    In addition, Web API design builds on the principles of software design, including
    modularization, encapsulation, loose coupling, and high cohesion. API designs
    should hide the internal details of the systems they externalize. They should
    not expose underlying data models but rather focus on a system-to-system message
    exchange that is both flexible and resilient to change over time.


    So, how do we go from business requirements to an API design that is evolvable
    while delivering the desired outcomes to customers, partners, and the internal
    workforce? That is the subject of the next chapter, which introduces a process
    that bridges business and product requirements into an API design. The process
    is explored in detail in subsequent chapters.'
