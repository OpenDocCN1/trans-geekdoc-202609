- pgno: 56
  md: '# Remaining Agile with API Design-First


    An API design-first approach is focused on frequent feedback and opportunities
    to make adjustments throughout the design and delivery process. An API design-first
    approach does not specify that all design work must be complete before proceeding
    into code. To understand how, it is time to revisit the Agile Manifesto and see
    how it can be applied to an API design-first approach.


    # The Agile Manifesto Revisited


    A quick review of the Agile Manifesto principles helps help us us better understand
    how API design-first fits with agile development. Following are a few principles
    relevant to the concerns of API design-first:


    +   * Our highest priority should be to satisfy the customer.

    * We should welcome changing requirements, even late in development.

    * We must strive to deliver working software frequently.

    * Business people and developers must work together daily.

    * Working software is the primary measure of progress.

    * Be attentive to technical excellence and good design, as this enhances agility.

    * Seek the simpel by maximizing the amount of work not done.


    Keeping these principles in mind, teams have the opportunity to remain agile while
    communicating early and often with stakeholders on the API design. These stakeholders
    may include internal development teams, channel partners, and the developers tasked
    with integrating the API.


    Delivering an API design progressively, rather than all at once, allows teams
    to meet the principle of welcoming changing requirements and delivering working
    software. It also helps teams avoid last-minute scrambles that can negatively
    impact API design.


    "seek the simple" encourages teams to design in a simple way. Teams should design
    an API that avoids clever designs that require a higher cognitive load to understand.
    Instead, designs should be intuitive based on the use cases it addresses and should
    use vocabulary that is appropriate for the solution domain. They should offer
    only the necessary information to support the case.


    > 1. Kent Beck, et al., “Principles behind the Agile Manifesto,” https://agilemanifesto.org/principles.html.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# The Agility of API Design-First


    The goal of API design-first should be to gather sufficient details to limit the
    risk of a breaking change in the future. It doesn''t mandate that an entire design
    process must be completed before development begins. Agile development and API
    design-first make terrific companions.


    # Remember


    Teams can always add to an API design, but it is impossible to take things away
    without breaking integrations that depend on them. Take advantage of agile software
    development to incrementally design APIs with the needs of customers, partners,
    and the workforce in mind.


    An API design-first process enables teams to move quickly, thoughtfully, and with
    the agility to make changes early in the process. It is the complete opposite
    of the waterfall approach to API design.


    # The Align-Define-Design-Refine Process


    One of the biggest challenges most API design teams encounter is how to deliver
    an API design from business requirements in any variety of forms: use cases, spreadsheets,
    wireframes, and so on. Those with a background in software analysis may find this
    to be an easier task. However, there are still challenges when it comes to mapping
    a domain model and capabilities into a Web-based API design. One of the challenges
    is the need to ensure alignment of scope and deliverables among all technical
    and nontechnical team members.


    As the name suggests, the Align-Define-Design-Refine (ADDR) process² guides teams
    through an API design-first approach. The process groups the step-by-step process
    into four distinct phases:


    +   - **Align:** Ensures alignment of understanding and scope across business,
    product, and technology around a set of desired outcomes

    - **Define:** Maps business and customer requirements into digital capabilities
    that will form the basis of one or more APIs to deliver the desired outcomes


    ² The ADDR process is based on the many lessons learned during my years of experience
    in API design coaching.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# CHAPTER 2 COLLABORATIVE API DESIGN


    +   3. **Design:** Applies specific design steps for each API to meet the desired
