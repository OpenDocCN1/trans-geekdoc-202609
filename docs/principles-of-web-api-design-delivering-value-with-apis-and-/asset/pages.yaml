    # API Versioning Methods


    There are three popular methods of implementing API versioning: header-based,
    URI-based, and hostname-based versioning.


    Header-based versioning places the desired version as part of the Accept header
    in the HTTP request (c.g., Accept: application/vnd.github.v3+json). Many consider
    the preferred form of versioning, as the URI remains the same across versions,
    and the media type defines which version of the resource representation is desired.


    URI-based versioning includes the version as part of the URI, either as a prefix
    or as a suffix. Examples include /v1/customers. This method of versioning tends'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'to be the most commonly encountered, as it works across a variety of tools
    that may not support customizing request headers. The downside is that URIs change
    with each new version, which some consider counter to the intent of supportingvolvability
    through a resource URI that never changes.


    Hostname-based versioning includes the version as part of the hostname rather
    than the URI (e.g., https://v2/api.myapp.com/customers). This approach is used
    when technology limitations prevent routing to the proper backend version of the
    API based on the URI or accept header.


    No matter which option is selected, API versions should include only the version
    number. Minor numbers should not be used; otherwise, code changes are required
    and thus typically nonbreaking changes to become breaking changes. For example,
    code changes would be required to move from /v1/customers to /v2/customers, even
    if the only difference between versions is the addition of a new operation.


    # Business Considerations of API Versioning


    Each time a new version is released, customers must decide whether or not they
    wish to opt in. The decision is based on the cost versus the reward. The effort
    to migrate the cost it will take to migrate?


    Moving to a new API version is a forcing factor. Just because an API design isn''t
    perfect means the team should release a new version with breaking changes to get
    the design exactly right. Every time a new version is released to accommodate
    a desired change, the organization introducing customer churn because the customer
    must weigh the cost of migration versus moving to a competitor.


    In addition, introducing a new version often requires keeping the current API
    version around for some indeterminate period of time. While some organizations
    have the leverage to force customers to upgrade by some period of time, this isn''t
    always the case. Consequently, any previous versions of an API must be supported
    for the foreseeable future.


    Every new API version is like a completely new product that requires additional
    infrastructure, support, and development costs to maintain. Keep in mind when
    the temptation arises to create a new API version to fix that annoying design
    decision that was created in last year.


    # Deprecating APIs


    Nothing will ruin a team''s week more than scrambling to find a replacement for
    an API that has been shut down overnight. To avoid this kind of impact on existing
    API consumers, teams must define their deprecation policy and communicate it to
    their API consumers.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# DEPRECATING APIs 269


    Deprecating an API operation or product provides an opportunity for an API provider
    to maintain a level of trust with its API consumers. But this requires a clear
    policy and planning to deprecate and eventually sunset an API. When executed properly,
    API consumers are notified early and often of the deprecated API and are given
    a chance to move to an alternative solution prior to the retirement of the API.


    # Establish a Deprecation Policy


    The organization should have a clearly documented deprecation policy and process
    as part of the API program standards and practices. This policy should include


    +   - Details on when deprecations are allowed

    - Steps to establish a deprecation process

    - The minimum duration of the deprecation period prior to retirement of the API
    or operation

    - A requirement to establish a migration path for consumers, even if that includes
    other vendors that provide a solution similar to the deprecated operation or product

    - A clear definition of the organization’s deprecation policy in the API’s terms
    of service


    Organizations that establish a deprecation policy will be better equipped to deprecate
    an API operation or product while maintaining the trust of their API consumers.


    # Announcing a Deprecation


    Communicating a deprecation is a significant factor in maintaining API consumer
    trust. The methods of communication vary, but should include


    +   - Well-written emails that address the deprecated operation(s) or product(s)

    - Notification banners at the top of a Web-based dashboard

    - Warnings embedded in all related API documentation

    - Blog posts or a dedicated landing page for deprecations that discuss the decision
    and address frequently asked questions

    - Frequent social media notifications with a link to the blog post'
  merge: -1
  img_proc: true
- pgno: 304
  md: '270

    CHAPTER 14 DESIGNING FOR CHANGE


    The announcement strategy should include most or all of these methods of communication.
    Keep in mind that employee turnover may result in email addresses that are not
    current, so using a variety of methods ensures the most effective communication
    possible.


    For APIs using OpenAPI descriptions, use the deprecated: true indicator, resulting
    in the rendering of a deprecation warning in HTML documentation. GraphQL and gRPC-based
    IDL APIs have similar provisions for their schema and interface language (IDL)
    formats.


    Use the Sunset Header RFC to programmatically communicate when it will be retired.
    Consider including a step-by-step guide to using the Sunset Header as part of
    the API documentation. It will help API consumers receive automated notifications
    of deprecated API operations.


    Finally, if API helper libraries are offered, include a warning in the log file
    or console regarding the existence of the Sunset Header. Backend code that uses
    the library may redirect logs to log aggregators, resulting in internal alerts
    in monitoring dashboards.


    # Establishing an API Stability Contract


    As at the start of this chapter indicates, an API design isn''t finished until
    someone uses it. So, how can teams design an API that lasts forever if the design
    isn''t finished until after it is used? This requires a few disciplines that encourage
    evolutionary API design, including listening to early feedback, continually seeking
    additional insights, and establishing expectations through an API stability contract
    with developers.


    The ADDR process is designed to engage with stakeholders early and often to ensure
    that the API meets the needs of its target audience. API designers must be willing
    to listen, learn, and adjust their API designs according to the feedback they
    receive. Anything short of this will only serve the needs of the API owners rather
    than those of current and future API consumers.


    Not only must teams listen to feedback during the initial design process, but
    they must continue to listen after the initial release. Seek to better understand
    how the API is being used beyond its original intent. Conduct interviews with
    customers and developers to see how API design and documentation improvements
    can help them. Communication must be continuous rather than a one-time discussion
    at the start of the API design process.


    +   1. E. Wilde, “The Sunset HTTP Header,” February 3, 2016, https://tools.ietf.org/html/draft-wilde-sunset-header-01.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'An API stability contract is a method of establishing expectations of change
    between the API provider and its API consumers. The contract defines the level
    of support and longevity of API operations or entire API-based products. Following
    is a recommended starting point for organizations:


    +   - Experimental: This is an early release for experimentation and feedback.
    There is no guarantee that it will be supported. The design may change, or it
    may be removed completely in a future release.


    +   - Prerelease: The design has prereleased for feedback and will be supported
    in the future. However, the design is not frozen and therefore may introduce a
    breaking change.


    +   - Supported: The API is in production and supported. Any design changes must
    not break existing consumers.


    +   - Deprecated: The API product or API operation(s) is still supported but will
    soon retired.


    +   - Retired: No longer available or supported.


    Applying an API stability contract gives API providers the freedom to introduce
    new API operations or experimental APIs early for design feedback prior to supporting
    it on a long-term basis.


    # Summary


    Changes to API design cannot be avoided. Whether internal or external, consumers
    depend on the API to remain stable in the face of improvements. Introducing changes
    to an API’s design provides an opportunity for the owning team and the organization
    to maintain the trust of their API consumers. By applying an appropriate API versioning
    strategy, taking appropriate steps to deprecate APIs when they are no longer needed,
    and establishing an API stability contract, teams are able to manage change while
    avoiding negative impacts to their API consumers.'
  merge: -1
