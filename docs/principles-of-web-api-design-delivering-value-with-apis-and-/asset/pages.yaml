- pgno: 54
  md: 'While an API design process does not guarantee a perfect design the first time,
    it helps challenge assumptions quickly. It also encourages early communication
    with subject matter experts and customers to address flawed design issues before
    they are too expensive to rectify.


    # The Unused API Antipattern


    Teams do not want their project to be considered a failure, or worse, to languish
    with little to no use in production. This is often the case, as API designs may
    miss the underlying goals and desires of the target audience. An API may be released
    to great fanfare, only to languish with few, if any, integrations. When an integration
    is finally started, bugs are encountered by brittleness of the design and implementation.
    Rather than designing in isolation, an API design process should encourage validation
    early and often from stakeholders to avoid an API going unused.


    # The API Design-First Approach


    An API design is a predictable method of moving from business requirements to
    an API design. The goal of API design is to make it easier to discover, integrate,
    and deploy solutions that are scalable for the organization and external parties.


    An API design-first approach is important, as APIs last forever. Once an API has
    at least one integration in production, it is nearly impossible to migrate consumers
    to the next version of an API.


    Taking an API design-first approach starts by identifying the capabilities to
    deliver, then moves toward an API design to meet the desired outcomes—all before
    writing a line of production code.


    Of course, reality doesn''t work exactly in this way. Code and data may already
    exist and must be leveraged from an existing system. API design-first doesn''t
    require strict adherence to a greenfield process that assumes no preexisting code
    or data. It should, however, emphasize the API design effort as a separate and
    critical of software delivery.


    An API design-first approach has five rapidly executed, iterative phases, as shown
    in Figure 2.3:


    +   1. **Discover**: Determine the digital capabilities the API needs to deliver,
    searching for APIs that may already exist to meet the requirements.

    2. **Design**: Produce an initial API design or improve an existing API design
    to address the digital capabilities required but not available.'
  merge: -1
