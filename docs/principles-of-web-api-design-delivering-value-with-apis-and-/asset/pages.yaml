  md: '# CHAPTER 4 CAPTURE ACTIVITIES AND STEPS


    +   - External system (pale pink): Systems outside of the solution. These may
    be external to the team internal to the organization or a third-party system.
    They are best thought of as aggregates outside of the group''s control.


    +   - User interface (white): A user interface that will offer one or more roles
    the capability to execute a command against an aggregate.


    +   - User (yellow, small): A specific role that is interacting with the system,
    typically via a UI, but perhaps as a result of an automated call, or other mechanism.


    Start by adding commands (blue stickies) to capture what actions are taken by
    a system or user that will result in one or more of the identified business domain
    events. Commands are sent to aggregates, to capture those as well. Business rules,
    often phrased as “when xyz happens, . . .” may be captured as policies (lilac).
    Hot pink stickies are used as hotspot indicators where more information is required.


    # Step 5: Review the Final Narrative


