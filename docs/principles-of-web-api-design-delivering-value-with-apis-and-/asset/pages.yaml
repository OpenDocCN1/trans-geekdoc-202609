    # Factors When Considering RPC


    RPC-based APIs often trade performance for tighter coupling. Code generation offered
    by many RPC protocols, such as gRPC, speed the development process by autogenerating
    stubs and producing skeleton code for server implementation purposes. These factors
    result in teams selecting RPC-based APIs when they own both API client and server
    sides, allowing for development and runtime performance improvements.


    However, there are several disadvantages to using an RPC-based API style that
    should be considering before proceeding:


    +   - The integration between client and server are tightly coupled. In production,
    the order of the fields cannot be changed without breaking API clients.


    +   - The serialization for marshaling and unmarshaling of procedure calls is
    fixed. Unlike REST-based APIs, multiple media types cannot be used, and HTTP-based
    content negotiation is therefore not possible.


    +   - Some RPC protocols, such as gRPC, require custom middleware to work with
    browsers and enforce authorization and role-based access when operations are tunneled
    through a single URL.


    Finally, keep in mind that gRPC depends on HTTP/2 and requires default security
    restrictions to perform considerable customization of HTTP request headers; browsers
    cannot support gRPC natively. Projects such as grpc-web offer a library and gateway
    to transform HTTP/1 requests into gRPC-based procedure calls.


    In summary, RPC-based APIs are best used when the organization owns both the API
    client and server. The API team exposes an RPC-based service or API for other
    teams within the organization to consume as needed but must strive to keep their
    client code up to date with the latest changes.


    > 3. https://github.com/grpc/grpc-web'
