    # Async APIs for Eventing

    and Streaming


    The key to safety lies in the encapsulation. The key to scalability lies in how
    messaging is actually done.


    — Alan Kay


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_193_0.png)


