- pgno: 147
  md: 'Dependent resources are nested under the parent, requiring the parent identifier
    in the path to interact with the dependent resources.


    # A Warning about Dependent Resources


    It is common to see a considerable number of dependent resources when APIs are
    designed from the bottom up from a relational database or by using a relational
    style to resource design.

    Nesting dependent resources is for constraining the navigability of children to
    the scope of the parent. While it may be tempting to create dependent resources,
    keep in mind that each nested level requires the API consumer to include the parent
    identifier in the path. For example:


    ```

    GET /users/{userId}/projects/{projectId}/tasks/{taskId}

    ```


    For an API consumer to retrieve a task by a given identifier, it also needs to
    have the parent project and user identifiers. This places additional work on the
    client to track these parent identifiers.

    esting dependent resources is a useful design option but should be used only when
    it improves the usability of the API.


    The results are shown in Figure 7.4. Notice that the resource collections are
    plural names. While required, this convention is commonly found with REST APIs.

