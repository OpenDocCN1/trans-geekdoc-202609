- pgno: 174
  md: "# 140 CHAPTER 8 RPC AND QUERY-Based API DESIGN\n\n![](img/6a422bfe4f2691ab7de274bb6978b0eb_174_0.png)\n\
    \nBy default, gRPC uses the proto file format used by Protocol Buffers to define\
    \ each service, the service methods offered, and the messages exchanged. Listing\
    \ 8.1 shows an example IDL file for a calculate service that offers a subtract\
    \ operation.\n\n# Listing 8.1 gRPC-Based IDL That Defines a Subtract Operation\n\
    \n```\n// calculator-service.proto3\nservice Calculator {\n  // Substracts two\
    \ integers\n  rpc Subtract(SubtractRequest) returns (CalcResult){\n}\n\n// The\
    \ request message containing the values to subtract\nmessage SubtractRequest {\n\
    \  // number being subtracted from\n  int64 minuend = 1;\n  // number being subtracted\n\
    \  int64 subtrahend = 2;\n}\n```"
