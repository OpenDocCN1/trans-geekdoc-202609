    # The Role of DDD in API Design


    As mentioned, an API design process should emphasize and solve the customers''
    problems using a vocabulary they understand. This requires a deep understanding
    of how the API will address market and customer needs, combined with business
    strategy. The design and development of an API occurs without factoring in these
    concerns, it will often miss the mark for being a great API that is a joy to use.


    Domain-driven design (DDD) is an approach to software development that encourages
    collaboration between domain experts and software developers to address complex
    solutions. DDD''s core principles include discussion, listening, understanding,
    discovery, and delivering,, strategic business value. Every member of the team
    across nonlocal and technical roles contributes to the insightful depth of business
    innovations in the software solutions. Those new to DDD may wish to refer to the
    seminal book on DDD by Eric Evans and Vaughn Vernon''s Implementing Domain-Driven
    Design, which provides insights on implementing DDD in an organization.


    The Adder process is built loosely on concepts and practices found in DDD. However,
    organizations do not be practicing DDD, or even familiar with it, to be effective
    at applying the process. Those familiar with DDD may recognize some of the concepts
    and techniques used. However, it is important to recognize that the ADDR process
    may deviate from DDD practices when necessary to ensure that it remains approachable
    and repeatable in a variety of situations. As such, those familiar with DDD may
    wish to make adjustments to the process to fit their needs and preferences.


    # API Design Involves Everyone


    Most software development involves several people across a variety of roles. Business
    leaders and product owners analyze market needs. Software architects and technical
    leads map out the important design decisions for the solution.


    3 Eric Evans, Domain-Driven Design: Tackling Complexity in the Heart of Software
    (Boston: Addison-Wesley, 2003).


    4. Vaughn Vernon, Implementing Domain-Driven Design (Boston: Addison-Wesley, 2013).'
