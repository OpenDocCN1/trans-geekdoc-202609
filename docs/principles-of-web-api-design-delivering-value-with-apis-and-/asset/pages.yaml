  md: '# CHAPTER 9 ASYNC APIs for Eventing and Streaming


    to implement, clients are not able to send requests on the same connection, making
    WebSocket a better option when full duplex communication is necessary. Keep this
    in mind when choosing an async API.


    # gRPC Streaming


    TCP protocol is optimized for long-lived bidirectional communications. HTTP/1.1
    was built on top of TCP but required multiple connections to allow clients to
    achieve concurrency. While this multiconnection requirement is to load balance
    and therefore scale, it has a considerable performance impact, as each connection
    requires establishing a new TCP socket connection and protocol negotiation.


    HTTP/2 is a new standard built on the work of the SPDY protocol by Google to optimize
    requests and includes response multiplexing. In response multiplexing, a single
    HTTP/2 connection is used for one or more simultaneous requests. This avoids the
    overhead of creating new connections for each request, similar to how HTTP/1.1
    supports keep-alive connections. However, HTTP/2 multiplexing allows requests
    to be sent at once rather than sequentially using a keep-alive connection.


    In addition, HTTP/2 servers may push resources to the client rather than require
    the client to initiate the request. This is a considerable shift from the traditional
    request/response interaction style of HTTP/1.1.


    gRPC takes advantage of HTTP/2''s bidirectional communication support, removing
    the need to separately support request/response alongside WebSocket, SSE, or other
    push-based approaches on top of HTTP/1.1. Because gRPC supports bidirectional
    communication, async APIs can be designed and integrated alongside traditional/response
    RPC methods using the same gRPC-based protocol.


    There are three options for gRPC streaming: client-to-server, server-to-client,
    and bidirectional, illustrated in Figure 9.10.


    Like WebSocket, gRPC can send and receive messages and events as a single, full-duplex
    connection. Unlike WebSocket, there are no subprotocol decisions to be made and
    supported, as gRPC uses Protocol Buffers by default. However, browsers have no
    built-in gRPC support. The grpc-web project¹⁵ is working on bridging gRPC to browsers,
    with limitations. Therefore, gRPC streaming is often limited to service-to-service
    interactions.'
  merge: -1
  img_proc: true
