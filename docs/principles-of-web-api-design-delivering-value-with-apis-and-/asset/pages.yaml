    # Server Push Using Server-Server Events


    SSE is based on the EventSource interface,¹¹ standardized as part of HTML5 by
    the W3C. It defines the use of HTTP to support longer-lived connections to allow
    servers to push data back to the client. These incoming messages contain event
    details that are useful to the client.


    SSE is a simple solution that supports server-push notification while avoiding
    the challenges of API polling. While SSE was originally designed to support pushing
    data to a browser, it is becoming a more popular way to push data to a mixture
    of browsers and server-side subscribers.


    SSE uses a standard HTTP connection but holds onto the connection for a longer
    period of time rather than disconnecting immediately. This connection allows API
    servers to push data back to the client when it becomes available.


    The specification outlines a few options for the format of the data coming back,
    allowing for event names, comments, single- multiline text-based data, and event
    identifiers.


    Subscribers submit a request to the SSE operation using a GET with the media type
    of text/event-stream (see Figure 9.8). Existing operations are therefore able
    to support standard request response interactions using JSON, XML, and other


