  md: '# Step 2: Map API Operations to HTTP Methods


    The next step is to determine which HTTP method is appropriate for each operation.
    Table 6 outlined three safety classifications that each HTTP method may be assigned:
    safe, idempotent. Table 7.1 outlines the safety classifications for common HTTP
    methods based on their intended use.


    During modeling, common verbs were likely identified in the operation name and/or
    description of the API profile. These verbs often provide clauses to the HTTP
    method that best matches the operation. By combining the safety classification
    of HTTP methods, as outlined in Table 7.1, with the operation mappings listed
    in Table 7.2, the appropriate HTTP method can be selected.


    Using Table 7.2 as a reference, along with the list of resource paths created
    previously in step 1, assign the appropriate path and HTTP method to each operation
    based on the intended use. If the operation is interacting with a specific resource
    instance, include the resource identifier in the path. The results are shown in
    Figure 7.6.


    | HTTP Method | Method Description | Safety Classification | Safety Description
    |

    |---|---|---||

    | GET | Returns requested data | Safe | No state changes are made |

    | POST | Used in a variety of scenarios, from calculations to creating new resources
    | Unsafe | Cannot guarantee the same results for multiple calls with the same
    input |

    | PUT | Representation from client to replace resource | Idempotent | Guarantees
    the same results for multiple calls with the same input as is providing to the
    entire resource representation |

    | PATCH | Performs a partial update of a resource | Unsafe | Cannot guarantee
    the same results for multiple calls with the same input, as only the client provides
    representation of the resource |

    | DELETE | Deleted a resource from the server | Idempotent | Multiple calls to
    delete the same resource will still result in the resource being deleted (even
    if it doesn''t exist) |'
  merge: -1
