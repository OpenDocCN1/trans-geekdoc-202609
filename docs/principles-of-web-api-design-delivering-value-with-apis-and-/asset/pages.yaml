  md: '# Part I


    # Introduction to Web API Design


    APIs are forever. Once an API is integrated into a production application, it
    is difficult to make significant changes that could potentially break those existing
    integrations. Design decisions made in haste become future areas of confusion,
    support issues, and lost opportunities far into the future. The API design phase
    is an important part of any delivery schedule.


    Part 1 examines the fundamentals of software design and how it produces a positive
    or negative impact on API design. It then examines the API first design process
    and presents an overview of an API design process. This process incorporates an
    outside-in perspective to deliver an effective API to meet the needs of customers,
    partners, and the workforce.'
