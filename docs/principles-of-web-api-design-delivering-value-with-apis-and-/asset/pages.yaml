- pgno: 176
  md: "# RPC API Design Process\n\nThe RPC design process leverages the API profiles\
    \ created during API modeling, as described in Chapter 6. Because the API profiles\
    \ already identified operations and basic input/output details, the RPC API design\
    \ process is a rapid three-step process. While the examples provided using gRPC\
    \ and Protocol Buffers 3, the process may be adapted with little or no modification\
    \ for other RPC-based protocols.\n\n# Step 1: Identify RPC Operations\n\n Migrate\
    \ the list of operations, including their descriptions and request/response details,\
    \ into a new tabular format designed to capture the high-level design. This is\
    \ shown in Figure 8.3.\n\nThough not necessary, following a verb-resource operation\
    \ naming pattern, such as listbooks(), helps the RPC-based API to be more resource-centric\
    \ and therefore more familiar to those who use REST-based APIs.\n\n# Step 2: Detail\
    \ RPC Operations\n\n Expand each operation's request and response details using\
    \ the resource definitions and fields captured during API modeling. Most RPC protocols\
    \ support a parameter list of fields, much like a local method invocation. In\
    \ this case, list the input parameters that will be part of the request and the\
    \ value(s) that will be returned in the response.\n\n For gRPC-based APIs that\
    \ use Protocol Buffers, the parameter list must be wrapped within the definition\
    \ of a message. Ensure each request has an associated message type that includes\
    \ each input parameter. Likewise, each response will return a message, an array\
    \ of messages, or an error status response. Figure 8.4 shows the Shopping Cart\
    \ API design for a gRPC-based API.\n\n It is important to standardize on an error\
    \ response type so that clients are able to process server-side errors consistently.\
    \ For gRPC, it is recommended to use the google.rpc.Status message type, which\
    \ supports an embedded details object with any additional details that the client\
    \ may need to process."
