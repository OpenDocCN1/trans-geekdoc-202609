    {\n  \"id\": \"12345\",\n  \"projectName\": \"My Project\"\n}\n```\n\n**Figure\
    \ A.1** An overview of the HTTP protocol.\n\n# The Uniform Resource Locator\n\n\
    HTTP uses a URL as a unique address where data or services are located. Requests\
    \ are sent to the URL, where the server processes and sends a response back to\
    \ the client. The URL is commonly seen in the location bar in a browser. Examples\
    \ include:\n\n+   * https://www.google.com\n* https://launchany.com/effective-api-programs/\n\
    * https://deckofcardsapi.com/api/deck/new/shuffle\n\nA URL is comprised of the\
    \ following items:\n\n+   * **Protocol:** The protocol used to connect (e.g.,\
    \ http [unsecure] or https [secure]).\n* **Hostname:** The server to connect (e.g.,\
    \ api.example.com).\n* **Port number:** A number ranging from 0 to 65535 that\
    \ identifies the process on the server where the request is to (e.g., 443 for\
    \ https or 80 for http).\n* **Path:** The path to the resource requested (e.g.,\
    \ /projects). The default path is /, which indicates the homepage.\n* **Query\
    \ string:** Contains data to be passed to the server. Starts with a question mark\
    \ and contains name=value pairs, using an ampersand as a separator between them\
    \ (e.g., ?page=1&per_page=10)."
  merge: -1
