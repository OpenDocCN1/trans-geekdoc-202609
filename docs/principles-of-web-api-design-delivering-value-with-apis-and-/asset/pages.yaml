- pgno: 221
  md: '# Part V


    # Refining the API Design


    Following the Align-Define-Design-Refine (ADDR) process so far, the outcomes are
    identified and digital capabilities captured during the Align phase. The Define
    phase then elaborates on these details, forming API profiles with bounded scope
    and responsibilities. The Design phase applies one or more API styles to the API
    profile, producing a high-level design of the APIs needed to deliver the desired
    outcomes.


    The Refine phase seeks to improve the developer experience and prepare for delivery
    of the API. Topics addressed in Part V include decomposing an API into services
    to shift complexity, applying proper API testing strategies, and strategies for
    offering robust API documentation. Offering helper libraries and command-line
    interfaces is also explored. Finally, tips are provided for scaling the ADDR process
    for larger organizations.'
