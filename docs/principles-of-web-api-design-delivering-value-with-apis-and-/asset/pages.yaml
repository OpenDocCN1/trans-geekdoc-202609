- pgno: 61
  md: '# API DESIGN INVOLVES EVERYONE


    Developers design and write the code that makes it all work. Designers and user
    experience (UX) experts pull everything together as a user interface, with an
    eye toward usability.


    Each person contributes their experience and can leverage their strengths and
    skills as part of the API design process. For smaller organizations, a single
    person may be required to fill multiple roles. Whenever possible, assign the more
    technical roles separately from the product and business roles to ensure a healthy
    balance of perspectives when designing APIs.


    The roles typically involved in API design sessions may include, but are not limited
    to, following:


    +   - API designers and architects help facilitate the design process and bring
    in API design expertise.

    - Subject matter experts (SMEs) and domain experts help to clarify requirements
    and shape the vocabulary used in API design.

    - Technical leads are responsible for guiding implementation efforts and may require
    additional clarifying questions for estimation purposes.

    - Product managers incorporate market opportunities and customer needs into the
    API design.

    - Technical writers ask clarifying questions during scope and design sessions
    that will impact the capabilities delivered and drive the production of API documentation
    and getting started guides.

    - Scrum Masters and project managers provide input to assist in scheduling and
    identifying risks.

    - QA teams can provide input on designing testable APIs, determine how and when
    to test APIs, and design test plans in parallel with development efforts.

    - Infrastructure and operations ensure server, network, container platforms, message
    brokers, streaming platforms, and other necessary resources are available for
    the teams that are building and consuming APIs.

    - Security teams review API designs for personally identifiable information (PII)
    and nonpublic information (NPI) concerns, identify risks, limit the surface area
    of attacks, and help to design APIs that will access sensitive data.


    An API design process integrates perspectives from each of these roles to align
    the business with development teams, define the clear goals and outcomes of an
    API, and design the API to meet the defined goals. Upcoming chapters explore this
    process in further detail.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Applying the Process Effectively


    The ADDR process may be integrated with any existing process. However, be prepared
    that some steps may seem uncertain or awkward at first. Over time, the processes
    will become more familiar, and the labor will be rewarded. Give the organization
    time to become familiar with the process. It may also be useful to spend time
    listing previous challenges and how the process seeks to address them.


    Organizations may wish to incorporate this process incrementally. In this case,
    it is recommended to start with identifying the activities and steps needed for
    an API, as detailed in Chapter 4, “Capture Activities and Steps,” then proceed
    with Chapter 6, “API Modeling.” Additional steps may be introduced over time as
    they are needed.


    # Summary


    The design of an API''s contract is a separate and critical step of software delivery.
    API design requires communication with the organization and with the developers
    using the API. It helps to course-correct wrong assumptions. It also encourages
    communication between business, product, and technology teams.


    An API design-first approach takes an outside-in perspective on the design of
    an API by focusing on the customers and developers who are building the solution.
    Combined with design techniques that take a bottom-up approach, APIs will have
    a more balanced design that both reflects the domain and the needs of customers
    and developers. An API design process requires a variety of roles that help to
    align, define, and design the capabilities and outcomes that APIs will provide.


    With the introduction to the art and fundamentals of API design complete, it is
    time to dive into the details of the ADDR process with the first phase: Align.'
