  md: "Resource serialization–based formats offer only the properties of the resource\
    \ using key-value pairs.\n\n# Hypermedia Serialization\n\nThe hypermedia serialization\
    \ category is similar to resource serialization but adds specifications on how\
    \ hypermedia links are represented. It may also include specifications for including\
    \ related and/or nested resources, called *embedded resources*, in a uniform way.\n\
    \nFormats such as Hypertext Application Language (HAL)⁷ enable resource serialization\
    \ formats to be extended with hypermedia with few to no changes. This prevents\
    \ breaking API clients while migrating existing serialization-based APIs to include\
    \ hypermedia controls. This is how HAL tends to be a popular choice when moving\
    \ to hypermedia APIs. Listing 7.2 shows an example of a HAL-based representation\
    \ that extends Listing 7.1 with hypermedia links and a related list of author\
    \ resources.\n\n# Listing 7.2 Hypermedia Serialization Approach Using HAL\n\n\
    ```\n{\n  \"bookId\": \"12345\",\n  \"isbn\": \"978-032183457\",\n  \"title\"\
    : \"Implementing Domain-Driven Design\",\n  \"description\": \"With Implementing\
