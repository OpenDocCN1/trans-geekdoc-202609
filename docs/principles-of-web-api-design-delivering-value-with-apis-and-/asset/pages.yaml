    details for each operation, synchronicity, and safety classification. The API
    profile will then be finalized by capturing any architectural requirements, such
    as SLAs, necessary to support consumers and industry standards that may need to
    be considered during design (e.g., adherence to an open banking standard).


    Refer to the API workshop repository⁴ available on GitHub for API profile templates
    and examples to help jumpstart the effort.


    # # Validating the API Model with Sequence Diagrams


    The API design team has a responsibility to ensure the APIs will meet the requirements
    of everyone using it. This requires two final actions: validating the API model
    to ensure no gaps exist and gathering feedback from stakeholders.


    Validate the API profiles against the previously produced original job stories
    and activities to validate that all requirements have been met. To validate the
    API model, create sequence diagrams that demonstrate typical usage scenarios.
    These scenarios may be sourced from the EventStorming, job stories, and other
    sources. Figure 6.11 shows an example scenario that supports a shopping and checkout
    experience using the modeled APIs.


    During the validation process, clarify all details to ensure full alignment and
    definition of the API scope and operations. If operations are missing to complete
    the scenario, revisit the modeling steps to capture the missing operations.


    Once the model has been validated, share the model with all stakeholders and obtain
    feedback. If API modeling was performed with the entire team, including business
    and product stakeholders, then feedback was obtained during the process. Otherwise,
    share the produced assets and seek to incorporate feedback prior to moving into
    the design phase of the process.


