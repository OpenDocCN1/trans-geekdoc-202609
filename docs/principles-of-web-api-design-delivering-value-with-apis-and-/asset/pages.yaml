    # Step 3: Define the Resource Taxonomy


    Once the resources have been identified, it is time to find the relationships
    among resources to define the API taxonomy. *Taxonomy* is a classification of
    concepts and how they are arranged. An API taxonomy captures the set of resources
    the API will offer and its relationships to other resources.


    There are three relationship types that resources may have between another:


    +   1. **Independent**: The resources exist standalone and do not require another
    resource''s existence. Independent resources may reference other independent or
    dependent resources.

    2. **Dependent**: One resource cannot exist without the existence of a parent
    resource. Be sure not to confuse a dependent resource relationship with one resource
    referencing another. This is a very specific case and not frequently encountered.

    3. **Associative**: The resources may exist independently; however, their relationship
    requires additional properties to describe it. The result is a third resource
    that represents the relationship between the two resources. The third resource
    may have an independent or dependent relationship between each of the others


    Dan Klyn, “Understanding Information Architecture,” TUG, https://understandinggroup.com/ia-theory/understanding-information-architecture.'
