- pgno: 309
  md: '# ESSENTIAL API PROTECTION PRACTICES 275


    +   * Authorization (authz): Prevents unauthorized access to individual or groups
    of API operations based on the caller''s assigned scopes. API keys, API tokens,
    and/or OAuth 2 are commonly used authorization techniques for APIs.


    +   * Claims: Assigns access controls at a finer-grained level than authorization
    allows, ensuring that API resource instances are protected.


    +   * Rate limiting (throttling): Restricts API requests to prevent traffic spikes
    from negatively impacting API performance across consumers. Also prevents denial-of-service
    attacks, either malicious or perhaps unintentional due to developer error. Rate
    limits are typically based on an IP address, API token, or by a combination of
    factors and are limited to a specific number over a period of time.


    +   * Quotas: Limits an application or device from using the API more than permitted
    within a specific time frame. Quotas typically have a monthly limit and may be
    established on the basis of the assigned subscription level or through formal
    agreements between organizations.


    +   * Session hijack prevention: Enforces proper cross-origin resource sharing
    (CORS) to allow or deny API access based on the originating client. Also prevents
    cross-site request forgery (CSRF), which is often used to hijack sessions.


    +   * Cryptography: Applies encryption in motion and at rest to prevent unauthorized
    access to data. Keep in mind that encryption requires additional precautions to
    protect private keys used to encrypt data elements; otherwise, attackers will
    easily decrypt the data from API responses using a compromised key.


    +   * Mutual TLS: Mutual TLS, or mTLS, is used when a guarantee of client identity
    is required. mTLS may be used when communicating between services or when HTTP-callbacks
    using webhooks are used to prevent malicious parties from attempting to forge
    their identity.


    +   * Protocol filtering and protection: Filters requests from API clients that
    may be used for malicious purposes. This security measure detects invalid combinations
    of the HTTP method and path, enforces the use of secure HTTP via Transport Layer
    Security (TLS) for encrypted communications, and blocks known malicious clients.


    +   * Message validation: Performs input validation to prevent submitting invalid
    data or overiding protected fields. It may also prevent parser attack such as
    XML entity exploits, SQL injection, and JavaScript injection attacks sent via
    requests to gain access to unauthorized data.'
  merge: -1
