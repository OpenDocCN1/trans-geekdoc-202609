- pgno: 43
  md: '# REVIEWING THE PRINCIPLES OF SOFTWARE DESIGN


    occur without impacting other modules that depend on its public methods. Some-times
    encapsulation is referred to as information hiding, a concept applied to soft-development
    since the 1970s by David Parnas.


    Web APIs encapsulate this concept bit further. They hide the internal details
    of programming language, choice of Web framework, the classes and objects of a
    system, and database design behind an HTTP-based API. Internal details, encapsulated
    behind the API design, encourage a loosely coupled API that depends on messages
    rather than underlying database design and models for communication. No longer
    do organizations need to understand all the internal implementations details,
    such as for a payment gateway. Instead, they only need to understand the operations
    that the API offers and how to use them to achieve the desired outcomes.


    High cohesion is a term used when the code within a module is all closely related
    to the same functionality. A highly cohesive module results in "spaghetti code,"
    as method calls aren''t jumping over the codebase. When code is scattered across
    the entire codebase, calls frequently jump across modules and back. This style
    of code is considered to exhibit low cohesion.


    Coupling is the degree of interdependence between two or more components. Tightly
    coupled components indicates that the components are very constrained by the implementation
    details of the other. Loosely coupled components hide their internal details away
    from others, restricting the knowledge between modules to a public interface,
    or programming language API, that other areas of the code can invoke.


    Figure 1.2 demonstrates the concepts of high cohesion and loose coupling within
    modules.


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_43_0.png)'
