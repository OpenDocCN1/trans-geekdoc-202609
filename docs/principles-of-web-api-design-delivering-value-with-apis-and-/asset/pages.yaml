- pgno: 159
  md: 'implementations offer a chance for developers to experience how the API may
    work using mock data. Tools are beginning to emerge that accept an API description
    format, such as OAS, and generate a mock API implementation without writing a
    single line of code.


    Refer to Chapter 16, “Continuing the API Design Journey,” regarding other API
    lifecycle techniques that help to gain feedback on an API, even after it has been
    developed and deployed.


    # Selecting a Representation Format


    So far, the discussion of resource design has been centered on the resource names
    and properties. However, the representation format of an API’s resources needs
    to be determined as well. Selecting a representation format is an important step.


    For some organizations, the preferred representation format has already been determined
    as part of the API style guide and standards. In that case, the decision has been
    made and no further action is required. However, if this is a new API product
    or one of the first APIs of a new API program or platform, there is more work
    to be done to complete the design effort.


    Whenever possible, select a single format as the default representation that will
    be offered across all APIs. Using a single format ensures consistency when a developer
    integrates with this and other and future APIs from the organization.


    Additional formats may be added for operations over time, allowing an existing
    API to slowly migrate to a new format without disrupting existing integrations.
    A multiformat approach requires the use of HTTP to allow clients to specify the
    preferred representation format desired. Content negotiation is discussed in the
    HTTP primer offered in Appendix I.


    Table 7.4 summarizes the four categories of representation formats available.
    Each category builds upon the previous one, adding more options for representing
    resource and messaging formats. However, with more options comes more complexity.
    Each category is explained, and an example presented to inform the selection process.
    The examples provided in this chapter are available in the API workshop examples
    GitHub repository.


    4. https://bit.ly/align-define-design-examples'
