- pgno: 335
  md: 'THE JOURNEY Has Only Begun 301


    with an API—stay in contact with them through newsletters or distribution lists.
    Announce new and upcoming improvements, success stories, and common use cases
    through consistent developer communication. Highlight the teams that are responsible
    for building and supporting APIs to demonstrate their commitment to meeting developers''
    needs.


    # The Journey Has Only Begun


    The focus of this book has been on principles of Web API design that produce a
    repeatable, collaborative API design process that helps to deliver value using
    an outcome-based focus. These principles are as follows:


    +   * **Principle 1:** APIs should never be designed in isolation. Collaborative
    API design is essential for a great API. (Chapter 2)


    +   * **Principle 2:** API design starts with an outcome-based focus. A focus
    on the outcome ensures the API delivers value to everyone. (Chapters 3–6)


    +   * **Principle 3:** Select the API design elements that match the need. Trying
    to find the perfect API style is a fruitless endeavor. Instead, seek to understand
    and apply the API elements appropriate for the need, whether that is REST, GraphQL,
    gRPC, or an emerging style just entering the industry. (Chapters 7–12)


    +   * **Principle 4:** API documentation is the most important user interface
    for developers. Otherwise, API documentation should be first class and not left
    as a last-minute task. (Chapter 13)


    +   * **Principle 5:** APIs are forever, so plan accordingly. Thoughtful API design
    combined with an evolutionary design approach makes APIs resilient to change.
    (Chapter 14)


    The principles are the foundation for a four-phase process: Align-Define-Design-Refine
    (ADDR). The ADDR process focuses on aligning stakeholders, defining the digital
    capabilities required, designing the API to produce the outcomes, and then refining
    the design based on feedback.


    The process recognizes that an API should never be designed in isolation. It requires
    the collaboration of a variety of roles, including subject matter experts. When
    involved in API design are aligned on the outcomes first, the API remains focused
    on the value delivered. Along the way, stakeholders are aligned in their understanding
    using collaborative techniques such as EventStorming and API'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'modeling prior to designing the API. The API is then designed and refined through
    feedback with those who will integrate the API into their solution.


    While some may think that the journey has been completed, this is only the beginning.
    The API design will now be delivered and managed. It will meet real-world usage,
    perhaps even encountering new use cases never considered. The ADDR process will
    be used once again as the API grows and matures. For larger organizations, this
    API design lifecycle will be repeated for many new APIs, requiring the ADDR process
    to be scaled for use by multiple teams. The journey has only begun.'
