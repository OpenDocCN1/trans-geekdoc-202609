    \ the literature of the Domain-Driven Design community, but also to the literature\
    \ of the broader enterprise application architecture field.\",\n  \"links\": {\n\
    \    \"self\": { \"href\": \"/books/12345\" }\n  },\n  \"embedded\": {\n    \"\
    authors\": [\n      {\n        \"authorId\": \"765\",\n        \"fullName\": \"\
    Vaughn Vernon\",\n        \"_links\": {\n  \n  }\n```\n\n⁷. Mike Kelly,\"JSONHypertext\
    \ Application Language\" (2016),https://tools.ietf.org/html/draft-json-kelly-hal-08."
