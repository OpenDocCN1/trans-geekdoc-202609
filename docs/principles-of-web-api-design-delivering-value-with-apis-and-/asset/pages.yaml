    design. Now, after reading through this book, I am equally happy to recommend
    it to you, the reader.


    The field of Web APIs and the work of designing them has matured rapidly over
    the last few years, and keeping up with the latest developments is a major undertaking.
    Issues like changing business expectations for APIs; maturing processes for gathering,
    recording, and documenting the work of API design; as well as evolving technology
    changes and all the work of coding, releasing, testing, and monitoring APIs make
    an API landscape large enough that few people have been able to successfully tackle
    it. Through his Align-Define-Design-Refine process, James offers an excellent
    set of recommendations, examples, and experience-based advice to help the reader
    navigate the existing space of Web APIs and prepare for the inevitable changes
    ahead in the future.


    One of the things about James’s work that has always stood out is his ability
