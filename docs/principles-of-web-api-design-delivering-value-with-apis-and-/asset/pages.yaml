  md: 'track of specific details that have been previously discussed. Consider the
    following example that has too many details:


    **When I find a product I want to buy,**

    **I want to** provide the quantity, color, and style of the product

    **So I can** add it to my shopping cart and see the current subtotal, shipping
    costs, and estimated sales tax.


    When a job story contains too many details, extract the details as additional
    items below the job story. Doing ensures the details are not lost and keeps the
    job story clear and focused. Here is the same job story, rewritten with the details
    moved outside of the job story narrative:


    **When I find a product I want to buy,**

    **I want to** add the product to my shopping cart

    **So I can** include it in my order.


    **Additional details:


    +   - The following fields will be required when adding an item to a cart: quantity,
    and style.

    - The shopping cart will then show the current subtotal, shipping costs, and estimated
    sales tax.


    These details can be extracted into bullet points in a document or Markdown or
    added as an additional notes column in a spreadsheet.


    # Challenge 2: Job Stories Are Feature Centric


    Those familiar with writing user stories tend to craft job stories with a focus
    on features rather than outcomes. This challenge may be encountered for existing
    products that already have a user interface or high-fidelity wireframes. Instead
    of focusing on the problem and desired outcome, the author of the job story immediately
    jumps to the solution.


    The following is an example of a job story that focuses on feature details:


    **When I find a product I want to buy,**

    **I want to** add the product to my shopping cart by clicking a yellow button

    **So I can** include it in my order.'
