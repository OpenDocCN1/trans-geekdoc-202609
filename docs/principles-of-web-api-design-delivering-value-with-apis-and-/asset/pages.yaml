    # Step 3: Assign Response Codes


    The API design is starting to emerge. The next step is to assign the expected
    response codes for each operation. HTTP response status codes belong to three
    primary response code families:


    +   * 200 codes indicate success, some with more clarity (e.g., 201 CREATED vs.
    200 OK).

    * 400 codes indicate a failure in the request that the client may wish to fix
    and resubmit.

    * 500 codes indicate a failure on the server that is not the fault of the client.
    The client may attempt a retry at a future time, if appropriate.


    Be sure to use the right code for the right reason. When in doubt, refer to the
    most current RFC that details the intended usage for the code. If a specific code
    isn''t available within the response code family, then use the default 200, 400,
    or 500 code as appropriate.'
