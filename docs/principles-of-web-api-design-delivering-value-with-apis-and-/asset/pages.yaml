    # Focus on the Jobs to Be Done


    Jobs to be done (JTBD) are the identified needs fulfilled by a product or service
    offering. JTBD involves capturing how a customer problem, the task to be performed,
    and the desired outcome that should result.


    > JTBD was formulated by Clayton Christensen, author of The Innovator''s Dilemma,
    as a method of taking the viewpoint of the customer when designing a product or
    service. JTBD ensures that the product addresses a specific need and therefore
    has a better chance of gaining market adoption. It starts by identifying the needs
    of customers, the job, and then defining how product or service will fill that.


    +   1. Christensen Institute, “Jobs to Be Done,” accessed August 12, 2021, https://www.christenseninstitute.org/jobs-to-be-done.

    2. Clayton M. Christensen, The Innovator''s Dilemma: When New Technologies Cause
    Great Firms to Fail (Boston: Harvard Business Review Press, 2016).'
