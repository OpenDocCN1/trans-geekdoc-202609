- pgno: 37
  md: '# Chapter 1


    # The Principles of API Design


    All architecture is design, but not all design is architecture.Architecture represents
    the set of significant design decisions that shape the form and the function of
    a system.


    > — Grady Booch


    Organizations have been delivering APIs for decades. APIs started as libraries
    and components shared across an organization and sold by third parties. They then
    grew into distributed components using standards such as CORBA for distributed
    object integration and SOAP for integrating distributed services across organizations.
    These standards were designed for interoperability but lacked the elements of
    effective design, requiring months of effort to successfully integrate them.


    As these standards were replaced by Web APIs, only a few APIs were needed. Teams
    could take the time to properly design them, iterating as needed. This is no longer
    the case. Organizations deliver more APIs and at greater velocity than ever before.
    The reach of Web APIs goes beyond few internal systems and partners.


    Today''s Web-based APIs connect organizations to their customers, partners, and
    workforce using the standards of the Web. Hundreds of libraries and frameworks
    exist to make it cheap and fast to deliver APIs to a marketplace or for use. Continuous
    integration and continuous delivery (CI/CD) tools make it easier than ever to
    build automation pipelines to ensure APIs are delivered with speed and efficiency.


    Yet, the biggest challenge for today''s API programs continues to be successfully
    designing APIs that can be understood and integrated by developers in a consistent
    and scalable fashion. Facing this challenge requires organizations to recognize
    that Web APIs are more than just technology. Just as works of art require the
    balance of color and light, API design benefits from the blending of business
    capabilities, product thinking, and a focus on developer experience.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# The Elements of Web API Design


    An organization''s collection of APIs provides a view into what the business values
    in the marketplace. The design quality of its APIs provides a view into how the
    business values develop. Everything an API offers—and doesn''t offer—speaks volumes
    about what an organization cares about most. Effective Web API design incorporates
    three important elements: business capabilities, product thinking, and developer
    experience.


    # Business Capabilities


    Business capabilities describe the enablers an organization brings to market.
    They may include external-facing capabilities, such as unique product design,
    amazing customer service, or optimized product delivery. They may also include
    internally facing capabilities such as pipeline management or credit risk assessment.


    Organizations deliver business capabilities in three ways: directly by, outsourced
    via a third-party provider, or through a combination of organization and third-party
    processes.


    For example, a local coffee shop may choose to sell custom coffee blends. To do
    so, it sources coffee beans through a third-party distributor, roasts the coffee
    beans in-house, then utilizes a third-party point-of-sale (POS) system for selling
    its coffee blends in a retail store. By outsourcing some of the necessary capabilities
    to specialized third parties, the coffee shop is able to focus on delivering specific
    business capabilities that differentiate from others in the marketplace.


    APIs digitize business capabilities that an organization brings to a marketplace.
    When embarking on designing a new API or expanding an existing API, the underlying
    business capabilities should be well understood and reflected into the API design.


    # Product Thinking


    Organizations are integrating with partners and customers to prize the growth
    of Web APIs. The challenge many organizations face, however, is that each integration
    has been custom made. For each new partner or customer integration, a dedicated
    team consisting of developers, a project manager, and an account manager were
    tasked with building a custom integration. This involved tremendous effort and
    was often repeated, with per-partner customizations.'
