- pgno: 89
  md: '# How EventStorming Works


    # 55


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_89_0.png)


    **Figure 4.5 The Place Order job story for JSON’s Bookstore, expanded to include
    additional color-coded sticky notes for commands, aggregates, and users. There
    is also a hotspot sticky with an open question to resolve after the session.


    Following is a summary of the common sticky note types—and the colors typically
    designated for each type—that are used throughout an EventStorming session:


    +   * **Business event (orange):** The result of an action or policy that indicates
    progression through a workflow or process

    * **Hotspot (bright pink):** Unknown or missing data that requires research and
    follow-up after the session.

    * **Command (dark blue):** An action taken by a user or system.

    * **Aggregate (large, pale yellow):** Behavior or logic that executes as a result
    of a command and behavior often results in one or more events. In domain-driven
    design (DDD), Aggregates are defined as units of transactional consistency. In
    EventStorming, this is a higher-level representation of workflows, state machines,
    and other behavior.

    * **Policy (lilac):** The triggering event or motivation for a new command is
    executed and is always required. It acts as the bridge or glue between an event
    and a command. Policies may start with the word when or whenever.'
  merge: -1
