    desiderations to address before proceeding.


    # Additional Microservice Design Considerations


    Note that all APIs will benefit from service decomposition. Anytime there is a

    new microservice involved, there is an opportunity for increased network latency

    could negatively impact API clients.


    Increased network latency is of particular importance when service call chaining

    occurs as a result of a synchronous service calling another, which may call another,
    and

    so on. The total time for a client to receive a response is the sum of the time
    required

    to execute each service call sequentially. For highly efficient service implementations

    that are less than 10 milliseconds each, latency may not be too much of concern.

    Services that integrate with legacy systems that may suffer from degraded performance

    d peak usage, resulting in several seconds of wait time for an end user. Finally,
    for

    some microservices ecosystems, it may not be possible to know how many services
    are

    involved or predict the total time required for execution.


    When possible, keep a transaction within a single service boundary. Transaction

    boundaries span multiple service calls require additional design considerations.

    of a service call fails, any previous calls must be rolled back. Because each

    service manages its own transactional boundary, a compensating transaction may

    be required to reverse the transaction—this is the Saga pattern in action. Whenever

    possible, seek to decompose microservices such that transaction integrity is

    maintained.


