    An API design process encourages efficiency throughout the delivery process. By
    focusing on the API contract first, the design represents the needs of users and
    developers as a primary concern. Also, implementation details are less likely
    to leak into the API design, resulting in a fragile API design that must introduce
    breaking changes as implementation details change over time.


    A backend API is the primary blocker for any frontend delivery schedule. If frontend
    developers are forced to wait until the backend developers have completed the
    API implementation, the end-to-end delivery process will take too long. Any errors
    in design feedback isn''t be identified until the frontend developers start to
    integrate the API. Customer feedback isn''t available until all of the integration
    work has been completed. Figure 2.1 visualizes this problem and the impact it
    has on the delivery schedule.


    An API design process encourages an iterative, team-oriented design effort that
    allows for greater overall efficiency. The frontend and backend API teams work
    together to arrive at a design, parallelize their specific tasks. Customer feedback
    may be incorporated earlier as well, avoiding last-minute rework efforts. As depicted
    in Figure 2.2, the process is repeated for each release, ensuring the design process
    becomes more rapid while incorporating feedback iteratively. Remember that the
    sooner an API mistakes are caught, the cheaper they are to fix.


    # API Design Process Antipatterns


    Failing to adopt an API design process or adopting a process that is less effective
    can lead to the antipatterns that result in negative impacts for the team and
    the entire organization. Review the common API design antipatterns detailed here
    and see if any of them resonate.


