    Not all hypermedia formats offer the same features. Mike Amundsen has created
    a list of these factors, called H-Factors,⁸ that support reasoning about the level
    and sophistication of hypermedia support across formats.


    # Hypermedia Messaging


    Hypermedia messaging formats differ from serialization in that they propose a
    uniform message-based format to capture resource properties, hypermedia controls,
    and embedded resources. This makes it easy to use a single parser over all resources
    represented by the message format rather than unique mapping code for each resource
    type to parse a serialized format such as JSON or XML.


    While the differences are nuanced between serialization and message-based formats,
    consider that teams will no longer to worry about what the JSON or XML payload
    should look like. Instead, they focus on the resource representations, relationships,
    and hypermedia controls within the message format itself. No more meetings to
    decide if a data wrapper is required around a JSON-based response!


    Hypermedia messaging formats include JSON:API and Siren.¹⁰ Both of these formats
    offer a single structured message that is flexible enough to include or complex
    resource representations and embedded resources, and both offer hypermedia control
    support.


    Siren''s messaging capabilities are similar to JSON:API, but it also adds metadata
    that is useful for creating Web-user interfaces with minimal customization effort.


    JSON:API is an unspecified specification that removes the need to decide on many
    design options commonly included in an API style guide. Representation format,
    when to use different HTTP methods, and how to optimize connections through response
    shaping and eager fetching of related resources are just a few of the decisions
    already provided by JSON:API.


    Listing 7.3 provides an example of a JSON:API message-based representation.


