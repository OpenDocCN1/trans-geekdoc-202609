    Using this approach gives teams time to think through the API design and how it
    will be used to produce outcomes—without the overhead of writing or changing code.
    It also increases the quality of documentation and the surrounding conversations.
    README-driven design can be thought of as the hand-written version of an acceptance
    test using behavior-driven development (BDD) frameworks such as Cucumber.¹


    # Providing Helper Libraries and SDKs


    Client-side helper libraries wrap all of the HTTP connection management, error
    detection, JSON marshaling, and other concerns for a single programming language.
    Some developers prefer helper libraries, as they help speed development by avoiding
    the need to deal with low-level HTTP concerns. They also enable code completion
    within popular integrated development environments (IDEs) that isn''t possible
    when working directly with HTTP.


    A software development kit, or SDK, is a packaged solution that includes helper
    libraries, documentation, example code, reference applications, and other resources
    for developers. While SDKs may be distributed by API providers, the growth of
    API developer portals has replaced the need to package a complete SDK.


    Many developers tend to use the terms interchangeably, but there is a distinct
    difference between an SDK and helper library. The important thing is to be clear
    what is provided in the distribution to set proper expectations with the developer.


    Don''t expect all developers to take advantage of helper libraries, however. Those
    familiar with HTTP generally prefer working with it directly rather than with
    a helper library. This preference is centered on the inflexibility of some helper
    libraries that, because of missing features within the library, may prevent developers
    from being able to fit the exact needs of the use case.


    +   1. https://cucumber.io'
