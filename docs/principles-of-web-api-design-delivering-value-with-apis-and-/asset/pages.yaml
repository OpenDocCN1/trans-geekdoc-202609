  md: '# Series Editor Foreword


    My signature series emphasizes organic growth and refinement, which I describe
    in more detail below. Before that, I will tell you a little about how organic
    reactions brought the author and I together for the first time.


    If you''ve ever spent a summer in a desert, you know that flesh-and-blood organism
    becomes very uncomfortable with the heat. That''s certainly the case with summer
    in the Sonoran Desert of Arizona. Temperatures can rise to near 120°F, or 49°C.
    At 118°F/47.8°C, the Phoenix Sky Harbor Airport shuts down operations. So, if
    you are going to be free from the heat, you get out before you are stuck in the
    desert. That''s what we did in early July 2019, when we escaped to Boulder, where
    we had previously resided. Knowing that the author of this book, James Higginboth,
    had relocated to Colorado Springs, Colorado, gave us the opportunity to meet up
    for a few days in nearby Colorado City. (In the western US, 100 miles/160 km is
    considered to be nearby.) I''ll tell you more about our collaboration once I''ve
    introduced you to my signature series.


    My Series is designed and curated to guide readers towards advances in software
    development and greater success with business-centric practices. The series emphasizes
    organic refinement with a variety of approaches—reactive, object, as well as functional
    architecture and programming; domain modeling; right-sized services; patterns;
    and APIs—and covers best of the used underlying technologies.


    From here I am focusing now on only two words: organic refinement.

    The first word, organic, stood out to me recently when a friend and colleague
    used it to describe software architecture. I have heard and used the word organic
    in connection with software development, but I didn''t think about that word care-fully
    as I did when I personally consumed the two used together: organic architecture.


    Think about the word organic, and even the word organism. For the most part these
    are used when referring to living things, but are also used to describe inanimate
    things that feature some characteristics that resemble life forms. Organic originates
    in Greek. Its etymology is with reference to a functioning organ of the body.
    If you read the etymology of organ, it has a broader use, and in fact organic
    followed suit: body organs; to implement; describes a tool for making or doing;
    a musical instrument.'
