- pgno: 244
  md: 'In addition, consider whether a dedicated team will own the microservice. If
    so, the introduction of the candidate microservice reduce or increase cross-team
    coordination? Not all decisions about service decomposition are about reducing
    code size.


    Finally, avoid splitting services based on the CRUD lifecycle, creating one service
    per operation (e.g., Create Project Service, Update Project Service, Read Project
    Service, List Project Services, Delete Project Service). This pattern creates
    more coordination requirements between each service team. A change to the resource
    representation for projects requiring coordination with each of the teams that
    own the service. The exception is when complexity dictates the need to split one
    part of a CRUD lifecycle due to increased complexity. For example, the complexity
    of payment processing integration may merit shifting this behavior to a separate
    microservice.


    # Considerations When Transitioning to Microservices


    While there are many benefits to moving to microservices, the transition shouldn''t
    be taken lightly. After some time and reflection, some organizations choose to
    simplify their microservice journey, others decide to abandon their journey in
    favor of thinking smaller without microservices, and the rest continue move forward
    with microservices.


    First, verify that a microservices-based approach is being applied to the correct
    context. Some microservices initiatives are dictated by the executive team without
    proper context. It usually starts with an executive who mandates microservices
    so that teams can increase the velocity of delivery. However, context isn''t provided
    to inform teams to avoid microservices complexity when the solution is simple
    (e.g., an application that offers CRUD-based services to manage a dataset). The
    result is wasted time and effort to decompose a simple solution into microservices
    that introduce unnecessary complexity over runtime management, troubleshooting
    complexity, and distributed transaction management.


    Next, be sure the organization''s reporting structure and culture are ready to
    shift alongside the move to microservices. Some organizations are not prepared
    for teams to own services for the long term. Instead, they treat microservices
    as projects that are delivered but never owned. The team that built the service
    moves on to other projects and higher priorities. Teams that could benefit from
    a minor change to an existing service are required to build their own service
    as a result.


    Finally, find ways to build smaller. Modularize code within a single codebase.
    Design clear APIs for consumers to use. Decompose APIs into microservices only
    when high complexity makes it necessary.'
  merge: -1
  img_proc: true
- pgno: 245
  md: "# Summary\n\nMicroservices are independently deployable units of code that\
    \ are combined to create distributed systems. Moving to microservices requires\
    \ a combination of new technologies and top-down organizational support. After\
    \ an organization reflects carefully on the decision factors, its shift to microservices\
    \ may result in the primary benefit of reduced coordination costs across multiple\
    \ teams. \n\nBe wary of technology trends that do not inject more benefit than\
    \ the complexity they require. Microservices have offered benefits to some organizations,\
    \ but not without their challenges. Organizations must count the cost of moving\
    \ to microservices outweighs the complexity of designing, building, and operating\
    \ microservices to determine if the complexity of a single, monolithic codebase.\n\
    \nAlternatives, such as modular monoliths and cell-based architectures, support\
    \ many of the goals of microservices but with varying support for reduced coordination\
    \ and local decision optimization. When in doubt, apply the “you ain't gonna need\
    \ it” (YAGNI) principle of agile software by starting with a modular monolith\
    \ API and decomposing it into microservices when the need arises."
