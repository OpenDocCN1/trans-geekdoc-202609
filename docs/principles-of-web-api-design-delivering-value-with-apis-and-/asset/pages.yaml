    # Async API Styles


    Async APIs allow an API interaction style that allows the server to inform the
    consumer

    when something has changed. There are a variety of API styles that support asynchronous

    Webhooks, Server-Sent-Events (SSE), and WebSocket are the most common.


    # Server Notification Using Webhooks


    Webhooks allow API servers to publish notifications to other interested servers
    when an

    event has occurred. Unlike traditional callbacks, which occur within the same
    codebase,

    webhooks over the Web, using an HTTP POST. The term webhooks was coined by

    Jeff Lindsay in 2007. Since then, the REST Hooks patterns have been developed
    to offer

    a standard way to manage and secure webhook subscriptions and notifications.


    Webhooks are dispatched when the API server sends a POST request to a URL that

    is provided by the system receiving to receive the callbacks. For example, an
    interested

    subscriber may register to receive new task event notifications on a specific
    URL they

    provide, such as https://myapp/callbacks/new-tasks. The API server then sends
    a

    POST request to each subscriber''s callback URL with a message containing the
    event

    details. The full sequence is shown in Figure 9.6.


    Webhooks must be network accessible by the API server and must be able to host

    an API server of its own to receive the POST requests. As, webhooks are a good
    fit

    for server-to-server communication between systems but not useful for browser
    and

    mobile applications.


    # Implementing Webhooks Effectively


    Webhooks require a variety of considerations, including handling delivery fail-

    ures, securing communications between client and server, and callbacks that take

    t long to acknowledge the notification. Refer to the REST Hooks document-

    tion¹ for tips on implementing webhooks servers effectively.


