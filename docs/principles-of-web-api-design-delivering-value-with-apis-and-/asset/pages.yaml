- pgno: 256
  md: '# CHAPTER 11 IMPROVING THE DEVELOPER EXPERIENCE


    Offering a CLI tool expands the reach of an API beyond full-time developers to
    automation engineers who are better equipped to write shell scripts rather than
    applications to integrate with APIs. CLI tools may offer human-friendly output,
    in addition to JSON, CSV, or other output formats that support better automation
    and tool chaining.


    Designing a CLI tool that wraps an API is no different than designing the API
    itself. It requires understanding the desired outcomes, activities, and steps
    required to accomplish the jobs to be done (JTBD). Then, design the CLI interface
    to meet these outcomes. The following code block shows how a CLI interface could
    be designed to support the Shopping API designed in previous chapters:


    ```

    $ bookcli books search "DDD"

    ```


