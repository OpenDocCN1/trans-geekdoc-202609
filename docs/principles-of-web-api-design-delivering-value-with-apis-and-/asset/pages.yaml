  md: '# CHAPTER 7 REST-BASED API DESIGN


    Notice how the size of the representations grew compared to the more compact resource
    serialization formats. With the increased size comes the addition of linked data
    and more powerful interactions with API clients. These representation formats
    offer more insight into how to navigate related resources and tap into new operations,
    including operations that were not available when the client was built.


    The goal is to enable generic clients to interact with APIs without the need for
    custom code or user interfaces. Instead, a client can interact with an API it
    has never seen before, using all the details provided in a semantic, message-based
    resource representation.


    Remember that it is always better to include additional details in the message
    than to force clients to use more code that defines behavior. This is the essence
    of why HTML works so well, as browsers are not required to implement custom code
    for every Web site that exists. Instead, the browser rendering logic, and the
    HTML message is crafted to deliver the desired result. While this may result in
    a more verbose message, the result is a more resilient API client that avoids
    hardcoded


    # Common REST Design Patterns


    While covering REST API design patterns is the subject of a separate book, this
    provides some basic patterns commonly encountered in REST-based API designs. Each
    of the following patterns offers an overview of when they should be applied to
    help API designers address commonly encountered design requirements.


    # Create-Read-Update-Delete


    CRUD-based APIs are APIs that offer resource collections that contain instances.
    The resources instances will offer some or all of the create, read, update, and
    delete lifecycle pattern.


    The CRUD pattern may offer a complete or partial CRUD lifecycle around a resource
    collection and its instances in a consistent way. The CRUD pattern follows this
    particular pattern:


    +   * GET /articles—List/paginate/filter the list of available articles

    * POST /articles—Create a new article

    * GET /articles/{articleId}-Retrieve the representation of an article instance

    * PUT /articles/{articleId}-Replace an existing article instance

    * PATCH /articles/{articleId}-Update specific fields (i.e., a selective update)
    for an article instance

    * DELETE /articles/{articleId}-Delete a specific article instance'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# COMMON REST Design PATTERNS 133


    It is recommended to avoid fine-grained CRUD-based APIs, which result in multiple
    API calls that cross transactional boundaries. Not only does it force the client
    to orchestrate multiple API requests across fine-grained resources, but clients
    will be unable to rollback previously successful requests when encountering failures
    in subsequent API requests. Instead, design resources around digital capabilities
    rather than based on backend data models.


    # Extended Resource Lifecycle Support


    It is not uncommon to identify a state transition that goes beyond the typical
    CRUD interaction model. With the limited selection of HTTP methods, designers
    must find new ways to offer the extended lifecycle while honoring the HTTP specification.
    For example, consider a content management system that manages a resource collection,
    Articles that now needs to add basic review and approval workflows beyond the
    standard CRUD-based lifecycle. Additional operations may be provided to facilitate
    the workflow:


    +   * /articles/(articleId)/submit

    * /articles/(articleId)/approve

    * /articles/(articleId)/decline

    * /articles/(articleId)/publish


    Using this functional operation approach, article resource instances are able
    to support the workflow necessary. In addition, it offers a few advantages:


    +   * Fine-grained access control can be enforced at the API management layer
    because each specific action is a unique URL that can be assigned different authorization
    requirements. This avoids coding specific authorization logic into a single update
    operation, such as a PUT or PATCH, when the state of a file is changed

    * Hypermedia controls are used to signal to clients the possible action(s) available
    based on the user''s authorization scope, as discussed earlier in this chapter.

    * The workflow supported by the API is more explicit, as clients don''t have to
    look at the PATCH endpoint documentation to understand the valid status values
    available, with re-creating the state rules for every API client.


    For teams that prefer to use this style of functional operations for a resource
    instance or collection, an alternative approach is to support hypermedia controls
    that reference the same PUT or PATCH operation but support different message structures
    based on the type of action taken.'
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Singleton Resources\n\nSingleton resources represent a single resource instance\
    \ outside of a resource collection. Singleton resources may represent a virtual\
    \ resource for direct interaction of an existing resource instance within a collection\
    \ (e.g., a user's and only profile). APIs may also offer nested singleton resources\
    \ when there is a one and only one instance in the relationship between the parent\
    \ resource and its child resource (e.g., a user's configuration). The following\
    \ examples illustrate possible uses of a singleton resource:\n\n+   - GET /users/{userId},\
    \ avoiding the need for consumers to know their own user identifier or risk accessing\
    \ another user's data due to an insecure security configuration\n- PUT /users/567/configuration—Used\
    \ to manage a single configuration resource instance for a specific account\n\n\
    Singleton resources should already exist and therefore should not require a client\
    \ to create them ahead of time. While singleton resources may not offer the full\
    \ spectrum of CRUD-style lifecycles like their collection-based brethren, they\
    \ may still offer GET, PUT, and/or PATCH HTTP methods.\n\n# Background (Queued)\
    \ Jobs\n\nHTTP is a request/response protocol, requiring that a response be returned\
    \ for any submitted request. For operations that take a long time to complete,\
    \ it may not be optimal for applications to block with an open connection waiting\
    \ for a response. HTTP provides the 202 Accepted response code for this purpose.\n\
    \nFor example, an API operation exists to support bulk importing accounts. The\
    \ API client could submit the following valid request: \n\n```\nPOST /bulk-import-accounts\n\
    Content-Type: application/json\n\n{\n  \"items\": [\n    { ... },\n    { ... },\n\
    \    { ... },\n    { ... }\n  ]\nn}\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "The server could return the following response to indicate that the request\
    \ was valid but that it could not be processed fully:\nHTTP/1.1 202 Accepted\n\
    Location: https://api.example.com/import-jobs/7937\nThe client could then follow\
    \ up to determine the status by submitting a request to\nthe URL provided in the\
    \ Location header:\nHTTP/1.1 200 OK\n\n```\n{\n  \"jobId\": \"7937\",\n  \"importStatus\"\
    : \"InProgress\",\n  \"percentComplete\": \"25\",\n  \"suggestedNextPollTimestamp\"\
    : \"2018-10-02T11:00:00.00Z\",\n  \"estimatedCompletionTimestamp\": \"2018-10-02T14:00:00.00Z\"\
    \n}\n```\n\nThis is called a fire-and-follow-up pattern. If the client doesn't\
    \ need to monitor the job status, it can ignore the URL and move on to other tasks.\
    \ This is known as the fire-and-forget pattern.\n\n# Long-Running Transaction\
    \ Support in REST\n\nThere may be times when a transaction requires more than\
    \ one API operation to complete. During days of SOAP, the WS-Transaction specification\
    \ was provided to manage transactions across one or more requests. This often\
    \ required a transaction manager that was costly in terms of both licensing and\
    \ integration effort. To avoid this requirement with REST-based APIs, the builder\
    \ design pattern can be applied to support similar semantics.\nFor example, imagine\
    \ an API that is meant to support reserving seats for a music or sporting event.\
    \ Perhaps the API must require payment within a specific time frame before the\
    \ seats are placed back into the pool of available seats. A Seats resource may\
    \ be used for searching for favorite group of seats together in a premium area:\n\
    \n```\nGET /seats?section=premium&numberOfSeats=4\n```\n\nPerhaps a group of four\
    \ seats is available. Yet, we cannot use the Seats resource to reserve the seats,\
    \ as it would require four separate API calls that are not able to be wrapped\
    \ in a transaction:\n\n```\nPUT /seats/seat1 to reserve seat #1\nPUT /seats/seat2\
    \ to reserve seat #2\n```"
  merge: -1
