- pgno: 42
  md: '# CHAPTER 1 THE PRINCIPLES OF API DESIGN


    API design: modularization, encapsulation, loose coupling, and high cohesion.
    While these may be subjects familiar to most developers, they are fundamental
    to API design and need review before approaching any API design process.


    # Modularization


    Modules are the smallest atomic unit within a software program. They are composed
    of one or more source files that contain classes, methods, or functions. Modules
    have a local, public API to expose the functionality and business capabilities
    that they offer to other modules within the same codebase. Modules are sometimes
    referred to as components or code libraries.


    Most programming languages support modules through the use of namespaces or packages
    that group code. Grouping related code into the same namespace encourages high
    cohesion. Internal details of a module are protected through access modifiers
    provided by the programming language. For example, the Java programming language
    has keywords such as public, package, and private that help to encourage loose
    coupling through limited exposure of a module.


    As and more modules are combined, a software system is created. A system combines
    modules into a larger module in more complex solutions, as shown in Figure 1.1.


    Applying the same concepts of modularization to Web-based API design helps to
    reveal the boundaries and responsibilities of every API. This ensures clear responsibilities
    across complementary APIs that focus on externalizing digital capabilities while
    hiding the internal implementation details. Consuming developers benefit by understanding
    the API quickly and effectively.


    # Encapsulation


    Encapsulation seeks to hide the internal details of a component. Scope modifiers
    are used to limit access to a module''s code. A module exposes a set of public
    methods or functions while hiding the internal details of the module. Internal
    changes may


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_42_0.png)


    Figure 1.1 Modules combine into ever-larger units, resulting in a software system.'
  merge: -1
