- pgno: 254
  md: '# Options for Offering Helper Libraries


    There are three options for offering helper libraries:


    +   * **Provider supported**: Provider-supported helper libraries are built and
    maintained by the API provider. The provider owns them, manages them, and keeps
    them in sync as API operations are added or enhanced through manual coding or
    code generation.

    * **Community contributed**: Instead of the vendor offering the helper library,
    the community contributes the SDK. This may be the case for all programming languages
    or for currently unsupported programming languages. Vendors may choose to allow
    the community-contributed helper libraries to thrive on their own, with the authors
    to make them better, or eventually offer to take over maintenance. Be aware that
    community-contributed SDKs have a tendency to lose the interest of contributors
    or available maintainers over time and may be abandoned. Communication with community
    supporters is critical, as many developers may assume that they are vendor-backed
    and complain if they are longer maintained.

    * **Consumer generated**: With the growth of API definition formats such as Swagger,
    RAML, Blueprint, and others, it is becoming easier for consumers to generate their
    own client library from any of these formats. Consumer-generated helper libraries
    give consumers the most flexibility, as they may opt to create a lightweight wrapper
    around the HTTP layer or perhaps generate a robust library with objects/structures
    that mimic API resources.


    API teams must determine how they plan to provide helper libraries, which programming
    languages they plan to support, and how community- or consumer-generated helper
    libraries may impact their developer support program.


    # Versioning Helper Libraries


    Helper libraries will have their own version numbering scheme, which may confuse
    developers. Versioning is common when helper libraries make changes to how they
    surface the API as objects.

    For example, version 1 of a helper library may return a hash of name/value pairs
    containing resource properties, eventually choosing to abandon this approach in
    favor of returning objects. The API may still be version 1, but the helper library
    may be on version 2.1.5 for Ruby, and the Python module may be on version 1.8.5.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Including SDK language and version number in the User-Agent header for all
    requests can help. However, the most important factor is to ensure that everything
    is logged on the client side and server side.


    Support emails will become more confusing when trying to determine the language,
    helper library version, and API version being used. Add community-contributed
    helper libraries into the process, and more confusion will occur. This confusion
    can exist even for the most experienced developer.


    The addition of a request identifier or correlation identifier is a common solution
    to this problem. These identifiers help correlate client requests with server-side
    logs as developers correspond with API support team. Application performance management
    (APM) tools may be useful for diagnosing issues as well.


    # Helper Library Documentation and Testing


    Developers integrating an API will not want to move between API documentation
    and an undocumented helper library while trying to figure out how to code their
    idea. To overcome this poor developer experience, thorough helper library documentation
    is required for every programming language. In addition, example code in the developer
    portal should include examples for each supported programming language.


    For release, API teams need to factor in sufficient time to keep helper library
    documentation updates across all supported programming languages. Automated tests
    for each helper library must also be maintained to ensure that libraries are in
    sync with the latest API operation enhancements as they are released.


    # Offering CLIs for APIs


    While most APIs target developers who will integrate it into a larger application,
    it is important not to overlook command-line interfaces (CLIs) as another developer
    use case. It is uncommon to encounter CLIs that wrap an API, much like helper
    libraries offer language-specific wrappers around a Web-based API.


    Unlike helper libraries, CLIs offer a human-friendly method of interacting with
    remote systems without requiring coding skills. The CLI is an API consumer and
    an automation tool. It may be used for many purposes, including the following:


    +   - Providing quick, one-off scripting for automation engineers

    - Extracting data locally for proofs of concept (POCs)

    - Automating infrastructure using tooling such as Kubernetes, Heroku, Amazon Web
    Services (AWS), Google Cloud (gcloud)'
