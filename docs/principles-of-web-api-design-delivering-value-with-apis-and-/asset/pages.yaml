    - What is the problem or triggering situation that demands the outcome, as described
    by the customer or stakeholder?

    - Does the identified digital capability help to produce the desired outcome?
    If not, is there a better way to word the digital capability or one better suited
    to the problem?


    # Overcoming Job Story Challenges


    When teams begin to construct job stories, they may encounter three issues: the
    job stories become too detailed, or they may need additional user context. All
    of these issues may be resolved using the suggestions that follow.


    # Challenge 1: Job Stories Are Too Detailed


    Job stories should contain enough content to enable deconstruction of the job
    story into independent tasks (more on this in Chapter 4). However, job stories
    may become littered with all kinds of details that will be important in the near
    future. This is a common occurrence when job story authors are concerned about
    losing'
