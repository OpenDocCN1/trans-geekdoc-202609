  md: '# Pearson Addison-Wesley Signature Series


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_4_0.png)


    Visit inform.com/awss/vernon for a complete list of available publications.


    The Pearson Addison-Wesley Signature Series provides readers with practical and
    authoritative information on the latest trends in modern technology for computer
    professionals. The series is based on one simple premise: great books come from
    great authors.


    Vaughn Vernon is a champion of simplifying software architecture and development,
    with an emphasis on reactive methods. He has a unique ability to teach and lead
    with Domain-Driven Design using lightweight tools to unveil unimaginined value.
    He helps organizations achieve competitive advantages by enduring tools such as
    architecture, patterns, and approaches, and through partnerships between business
    stakeholders and software developers.


    Vaughn''s Signature Series guides readers towards advances in software development
    maturity and greater success with business-centric practices. The series emphasizes
    organic refinement with a variety of approaches—reactive, object, and functional
    architecture and programming;domain modeling; right-sized services; patterns;
    and APIs—covers best uses of the associated underlying technologies.


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_4_1.png)'
