- pgno: 307
  md: '# Chapter 15


    # Protecting APIs


    > Organizations must apply an integrated approach to API security or else leave
    the door open to further threats.


    — D. Keith Casey


    API design doesn''t stop at HTTP methods, paths, resources, and media types. Protecting
    APIs from malicious attackers is an essential part of API design. If left unprotected,
    an API will become an open door that can do irreparable damage to an organization
    and its customers. An API protection strategy involves the implementation of the
    right components, selection of an API gateway solution, and integrating an identity
    and access management to it all together.


    This chapter outlines some foundational principles and provides guidance on common
    practices along with antipat to avoid when approaching an API protection strategy.
    Resources are provided for further reading and research on the journey.


    # The Potential for API Mischief


