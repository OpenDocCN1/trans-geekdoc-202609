  md: 'notification of new messages to one or more subscribers, like message broker
    topics. Examples of streaming servers include Apache Kafka,5 Apache Pulsar,6 and
    Amazon Kinesis.


    Unlike message brokers, subscribers may request messages at any point from the
    topic''s available message history. This allows for the replays of or simply picking
    up where processing previously left off. Unlike message brokers, streaming servers
    shift state management from the server to the client. The client is now responsible
    for tracking the last message seen. Error recovery is also pushed to the client,
    forcing the client to resume processing messages at the last known message.


    Support for this style of interaction is accomplished by shifting message management
    from a traditional queue or topic to an append-only log. These logs may store
    messages or limit the history of messages for specified retention period. A topic
    using a distributed log with two consumers is shown in Figure 9.6.


    ![](img/6a422bfe4f2691ab7de274bb6978b0eb_203_0.png)


    **Figure 9.6** A streaming topic comprising a distributed log of recorded messages,
    consumed by two separate consumers who have two separate offsets to reflect their
    current message.


