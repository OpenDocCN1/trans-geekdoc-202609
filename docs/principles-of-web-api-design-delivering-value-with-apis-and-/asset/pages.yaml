    Kay''s original vision for object-oriented programming, Web APIs are designed
    based. They request messages to a server and receive a response message as a result.
    Most Web APIs perform this message exchange synchronously by sending a request
    and waiting for the response.


    API design considers the conversational message exchange between systems to produce
