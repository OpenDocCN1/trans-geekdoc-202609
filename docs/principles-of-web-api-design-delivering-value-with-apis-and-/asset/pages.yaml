- pgno: 88
  md: '# Step 3: Review the Narrative and Identify Gaps


    Scheduled Time: 60–90 minutes


    Once all the events have been cleaned up and grouped in a general timeline, the
    group seeks to ensure that no events are missing. To do this, the group starts
    to walk from left to right to tell the full narrative. If events are missing or
    need clarification, they are changed immediately. It is at this step that a large
    surface area is beneficial to ensure sticky note may be moved around and for filling
    in gaps in the narrative.


    It is also at this step that all domain concepts need to be unified to establish
    a common vocabulary. This vocabulary will evolve into the ubiquitous language
    for every bounded context that will be identified in the next step of the ADDR
    process. Figure 4.4 demonstrates cards that may be attached to the EventStorming
    canvas to unify common vocabulary. If necessary, rewrite existing domain events
    to use the new vocabulary. It won''t take long for the group to start adopting
    the new terminology.


    Expect this step to take at least an hour as questions are raised and discussions
    emerge.


    # Step 4: Expand Domain Understanding


    Scheduled Time: 30–60 minutes


    Once the events have been ordered, additional sticky note colors are used to expand
    domain understanding. Figure 4.5 illustrates a portion of the Place Order job
    story for JSON''s Bookstore using these additional types of sticky notes.


    | Book | Cart |

    | --- | --- |

    | Offered by the online bookstore to shoppers. | Maintains a list of books under
    consideration for purchase. |

    | Synonyms: products, items | Cards have 0...n items, which reference the book
    and the quantity desired. |

    | | Note: A cart is not an order but is used to create an order at checkout. |


    **Figure 4.4** Two examples of cards used to capture vocabulary clarifications
    during a session. These cards will become part of the ubiquitous language for
    a bounded context identified in the next step of the process.'
