- pgno: 80
  md: '# CHAPTER 4 CAPTURE ACTIVITIES AND STEPS


    This quote from Alberto Brandolin resonates with many teams that are faced with
    building software in less familiar domains. While some developers can stay in
    the same business vertical for most or all of their career, most do not have that
    luxury. Developers are required to understand a new domain quickly, translate
    it into software, and repeat throughout their career. They must quickly become
    familiar with a domain that they are able to turn into working software that includes
    user interfaces, APIs, and data models.


    The ADDR process helps bridge this gap through a series of rapid design steps.
    Chapter 3, “Identify Digital Capacities,” detailed the first step of the API design
    process through the understanding of desired outcomes. The next step is the gathering
    of details from stakeholders, development teams, and business domain experts to
    better understand the concepts, processes, and workflows of the domain.


    This chapter addresses how to capture details and expected behavior using an activity-based
    structure (see Figure 4.1). It also introduces the EventStorming framework as
    a collaborative way to explore the domain. The result is a deeper understanding
    of the domain, alignment between all team members, and a foundation for defining
    and designing the APIs that will deliver the necessary digital capabilities.


    # Extending Job Stories into Activities and Steps


    Creating job stories helps identify the desired outcomes along with the digital
    capabilities necessary to produce the outcomes. This topic was covered previously
    in Chapter 3. The next step is to detail the digital capabilities as the activities
    and steps required to achieve these outcomes.


    An activity works toward a desired outcome. Activities may be performed by one
    participant or by a combination of multiple participants that collaborate together.
    A participant may be a person, an internal system, or a third-party system.


    Activity steps decompose activities into individual tasks that need to be performed
    to complete the activity. Once necessary activities are completed, the job story
    outcome will be met.


    There are two quick steps to capture these details: identify the activities for
    each job story, then decompose each activity into individual steps. The results
    are then used to identify API boundaries, which is detailed in Chapter 5, “Identifying
    API Boundaries.”'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# EXTENDING JOB STORIES INTO ACTIVITIES AND STEPS 47


    During this part of the process, all team members gain deeper understanding and
    alignment on the solution. If requirements are vague or uncertainty remains, the
    team may choose to proceed into a collaborative EventStorming session to explore
    the solution further. EventStorming is detailed later in this chapter.


    # Identify the Activities for Each Job Story


    Start by identifying any activities to be performed that produce the desired outcome
    for each job story. The goal is to find the bigger units of work that will contribute
    to the outcome.


    Examples of activities for the JSON''s Bookstore Place an Order job story 4, identified
    in Table 3.2 of Chapter 3, are shown in Table 4.1.


    Notice that the activities are high level and will require one or more steps to
    accomplish the activity. If individual activity steps are identified during this
    step, go ahead and note it. Then seek to determine the activity that it belongs
    to and capture as well.


    # Decompose Each Activity into Steps


    Activities are composed of steps, with each step captured at a level of granularity
    that ensures it is executed by one participant at a time. If an activity step
    requires two or more participants to execute it simultaneously, continue to decompose
    the activity into smaller, independent steps for each participant.


    Decomposing an activity into its individual steps requires a deeper understanding
    of how the API will solve real-world problems. This requires the insights of a
    domain expert or subject matter expert (SME). Include SMEs in the process of capturing
    activities and activities. If an SME is unavailable, spend some time interviewing
    for this research to ensure all questions have been addressed, leaving no room
    for making assumptions about the problem space. When available, the product manager
    should be responsible for the interview process.


    Table 4.1 Examples of Activity for JSON''s Bookstore Place an Order Job Story

    | Digital Capability | Activity | Participants | Description |

    | Place an Order | Browse for Books | Customer | Browse or search for books |

    | Place an Order | Shop for Books | Customer, Call Center | A customer adds books
    to a cart |

    | Place an Order | Create an Order | Customer, Call Center | A customer places
    the order using the contents of the shopping cart |'
