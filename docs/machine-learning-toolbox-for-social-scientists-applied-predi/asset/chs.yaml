  \n注意，在回归样条中，`df`（自由度）是基函数组件的数量。因此，对于三次样条，`df` = 6 定义了 3 个节点（四分位数 q:25; q:50; q:75）。由于\
  \ `df` = 8，我们有 5 个节点，因此对应于 20% 的分位数。\n\n拥有大量的节点对预测来说是好是坏？请参考 [`freakonometrics.hypotheses.org/47681`](https://freakonometrics.hypotheses.org/)\
  \ 关于节点数量的论证。以下是 Arthur Charpentier (2016) 的结论：\n\n> 所以，看起来在样条回归中包含许多非显著组件并不是一个主要问题。而减少自由度显然是一个糟糕的选择。\n\
