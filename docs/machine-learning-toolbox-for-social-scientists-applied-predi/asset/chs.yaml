  \n## 33.3 Ridge (`ℓ[2]`) 和 Glasso (`ℓ[1]`)\n\n精确矩阵的一个现代用途是用于图形建模（网络分析）。\n\n在多变量正态模型中，当控制了其他变量后，`X[i]`\
  \ 和 `X[j]` 是独立的，则 `p[ij]` = `p[ji]` = 0（精确矩阵中的元素）。在现实应用中，`P`（精确矩阵）通常是稀疏的。由于 `P`\
  \ 存在密切的关系，**精确矩阵的非零元素可以解释为图的边。**\n\n正则化帮助我们找到稀疏化的部分矩阵。我们从 `Ridge` 和 `rags2` 开始。它们的算法求解如下：\n\
  \n$\\ell(\\Omega;S) = \\ln|\\Omega| - \\text{tr}(S\\Omega) - \\lambda \\|\\Omega\\\
  |_{2}$\n\n其中 $\\lambda > 0$ 是岭参数，`T` 是已知的目标矩阵，$\\|\\Omega\\|_{2}$ 是范数。现在假设目标矩阵为零矩阵，因此\
