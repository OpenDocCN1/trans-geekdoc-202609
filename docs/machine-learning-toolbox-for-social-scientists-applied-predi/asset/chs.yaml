  \ = output[[1]]\n\nsum(MC_performance[, 2]) # lasso 找到真正稀疏性的次数\n```\n\n```r\n##\
  \ [1] 400\n```\n\n这是第一个属性：\n\n```r\nsum(MC_performance[, 2])\n```\n\n现在我们现在仿真中使用自适应权重：\n\
  \n```r\nmcsA <- function(mc, N, Beta) {\n  mcmat <- matrix(0, nrow = mc, ncol =\
