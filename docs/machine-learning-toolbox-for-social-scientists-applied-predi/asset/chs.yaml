  library(ROCR)\nlibrary(rpart)\nlibrary(randomForest)\n\ndf <- df[complete.cases(df),\
  \ ]\ndf$d <- as.factor(df$Sales)\n\nn <- 50\nB <- 1000\nAUC1 <- c()\nAUC2 <- c()\n\
  AUC3 <- c()\nAUC4 <- c()\n\nfor(i in 1:n){\n  set.seed(i)\n      ind <- sample(nrow(df),\
