  left( y\\_{1} - \\hat{f}\\left( x\\_{1} \\right) \\right)^{2} & \\left( y\\_{2}\
  \ - \\hat{f}\\left( x\\_{2} \\right) \\right)^{2} & {\\cdots\\\\,} & \\left( y\\\
  _{100} - \\hat{f}\\left( x\\_{100} \\right) \\right)^{2} \\\\ {\\vdots} & {\\vdots}\
  \ & {\\vdots} & {\\cdots\\\\,} & {\\vdots} \\\\ s\\_{500} & \\left( y\\_{1} - \\\
  hat{f}\\left( x\\_{1} \\right) \\right)^{2} & \\left( y\\_{2} - \\hat{f}\\left(\
  \ x\\_{2} \\right) \\right)^{2} & {\\cdots\\\\,} & \\left( y\\_{100} - \\hat{f}\\\
  left( x\\_{100} \\right) \\right)^{2} \\\\ \\end{matrix}$\n\n$\\\\frac{\\\\sum\\\
  left( y\\_{1} - \\hat{f}\\left( x\\_{1} \\right) \\right)^{2}}{500} + \\cdots +\
  \ \\frac{\\\\sum\\left( y\\_{100} - \\hat{f}\\left( x\\_{100} \\right) \\right)^{2}}{500}\
  \ = \\sum\\left( \\frac{\\\\sum\\left( y\\_{i} - \\hat{f}\\left( x\\_{1} \\right)\
  \ \\right)^{2}}{500} \\right)$\n\n现在，回到我们的问题：为什么样本内 MSPE 与 MSE 和 $\\sigma²$ 之和不同？让我们再次观察\
  \ MSPE，但这次从一个不同的角度来看。我们对某些数据点定义 MSPE（正如我们在上面的模拟中做过的那样），并将其重写如下：\n\n${\\text{M}\\\
  text{S}\\text{P}\\text{E}}\\_{out} = \\text{E}\\left\\\\lbrack \\frac{1}{n}\\underset{i\
  \ = 1}{\\overset{n}{\\Sigma}}\\left( {y\\_{i}^{\\prime} - \\hat{f}(x\\_{i})} \\\
  right)^{2} \\right\\\\rbrack,~~~~~~\\\\text{where}~~y\\_{i}^{\\prime} = f(x\\_{i})\
  \ + \\\\varepsilon\\_{i}^{\\prime}$\n\n这种类型的 MSPE 也称为**无条件**的 MSPE。括号内部是针对一组样本外数据点的“预测误差”。这里唯一的区别是将\
  \ $y[i]^{\\prime}$ 区分为样本外数据点。同样，我们为样本内数据点 $y[i]$ 定义 MSPE 为：\n\n${\\text{M}\\text{S}\\\
  text{P}\\text{E}}\\_{in} = \\text{E}\\left\\\\lbrack \\frac{1}{n}\\underset{i =\
  \ 1}{\\overset{n}{\\Sigma}}\\left( {y\\_{i} - \\hat{f}(x\\_{i})} \\right)^{2} \\\
  right\\\\rbrack,~~~~~~\\\\text{where}~~y\\_{i} = f(x\\_{i}) + \\\\varepsilon\\_{i}.$\n\
  \n注意 $\\varepsilon[i]^{\\prime}$ 和 $\\varepsilon[i]$ 是独立且同分布的。此外，$y[i]^{\\prime}$\
  \ 和 $y[i]$ 具有相同的分布。让我们更仔细地观察 $E[(y[i]^{\\prime} - \\hat{f}(x[i]))²]$。通过方差的定义，$E$\n\
  \n$\\\\begin{array}{rlr} {\\\\text{E}\\left\\\\lbrack {(y\\_{i}^{\\prime} - \\hat{f}(x\\\
  _{i}))}^{2} \\\\right\\\\rbrack} & {= {\\\\text{V}\\\\text{a}\\\\text{r}}\\left\\\
  \\lbrack {(y\\_{i}^{\\prime} - \\\\hat{f}(x\\_{i})} \\\\right\\\\rbrack + \\\\left(\
  \ {\\\\text{E}\\\\left\\\\lbrack {y\\_{i}^{\\prime} - \\\\hat{f}(x\\_{i})} \\\\\
