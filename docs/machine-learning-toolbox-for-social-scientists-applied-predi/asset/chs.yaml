  ## Multiple R-squared:  0.5094, Adjusted R-squared: 0.5091\n## F-statistic:  1924\
  \ on 18 and 33363 DF,  p-value: < 2.2e-16\n```\n\n由于 OLS 是 GLS 族中的“高斯”成员，我们也可以将其作为\
  \ GLS 来进行估计。我们使用 `glm()` 并 family 定义为“gaussian”。\n\n```r\nmodel3 <- glm(mpg ~ fuel\
  \ + drive + cyl, family = gaussian, data = data)\nidentical(round(coef(model2),2),\
  \ round(coef(model3),2))\n```\n\n```\n[1] TRUE\n```\n\n通过这个 LPM 模型，我们现在可以预测未来汽车的分类为高（`mpg`\
  \ = 1）或低（`mpg` = 0），这是我们的目标。让我们看看我们在识别 `mpg` 汽车方面的成功程度如何。\n\n\n\n\n```\np_x <- sigma\n\
  Logit <- log(p_x / (1 - p_x)) #默认情况下 log()计算自然对数\nplot(Logit ~ x, col = \"red\"\
  , cex.axis = 0.7)\n```\n\n![](img/Fig05_03.jpg)\n\n在许多情况下，当回归中的结果变量是二分类时，研究人员会使用逻辑函数。尽管在某些情况下线性模型明显有问题（如上所述），但在许多常见情况下，线性模型完全可行，甚至具有优势。\n\
  \n让我们从显式地比较这两个模型开始。如果结果 `Y` 是取值为 1 和 0 的二分类，正如之前证明的那样，我们定义 `P` (`Y = 1|X`) = `E(Y\
  \ |X)`)，这在给定回归变量 `X` 的某个值时 `Y` 为 1 的概率。那么线性概率模型和逻辑概率模型为：\n\n$\\\\begin{matrix} \\\
  \\left. P(Y = 1 \\\\middle| \\\\mathbf{\\\\text{X}} = \\\\mathbf{\\\\text{x}}) =\
  \ E(Y \\\\middle| \\\\mathbf{\\\\text{X}} = \\\\mathbf{\\\\text{x}}) = \\\\beta\\\
  \\_{0} + \\\\beta\\\\_{1}x\\\\_{1} + \\\\beta\\\\_{2}x\\\\_{2} + \\\\cdots + \\\\\
  beta\\\\_{k}x\\\\_{k}, \\\\right. \\\\\\\\ {\\\\ln\\\\left( \\\\frac{\\\\left. P(Y\
  \ = 1 \\\\middle| \\\\mathbf{\\\\text{X}}) \\\\right.}{\\\\left. 1 - P(Y = 1 \\\\\
  middle| \\\\mathbf{\\\\text{X}}) \\\\right.} \\\\right) = \\\\beta\\\\_{0} + \\\\\
  beta\\\\_{1}x\\\\_{1} + \\\\cdots + \\\\beta\\\\_{k}x\\\\_{k}} \\\\\\\\ \\\\end{matrix}$\n\
  \n虽然 LPM 假设概率 `P` 是回归变量的线性函数，但逻辑模型假设优势率 `P/(1−P )` 的自然对数是回归变量的线性函数。请注意，应用反 logit\
  \ 变换允许我们获得 `P (x)` 的表达式。最后，LPM 可以通过 OLS 轻松地估计，而逻辑模型需要 MLE。\n\n$p(\\\\mathbf{\\text{x}})\
  \ = E\\\\left. (Y \\\\middle| \\\\mathbf{\\\\text{X}} = \\\\mathbf{\\\\text{x}})\
  \ = P(Y = 1 \\\\right|\\\\mathbf{\\\\text{X}} = \\\\mathbf{\\\\text{x}}) = \\\\\
  frac{1}{1 + e^{- (\\\\beta\\\\_{0} + \\\\beta\\\\_{1}x\\\\_{1} + \\\\cdots + \\\\\
  beta\\\\_{k}x\\\\_{k})}}$\n\nLPM 的主要优势是其可解释性。在线性模型中，如果 `β[2]` 是（假设）0.05，这意味着 `x[2]`\
  \ 每增加一个单位，与 `Y` 为 1 的概率增加 5 个百分点有关。每个人对增加（例如投票、死亡或肥胖）概率的 5 个百分点意味着什么都有一定的理解。然而，在逻辑模型中，`x[1]`\
  \ 的变化会改变对数优势 `log(P/(1 − P ))`。因此，逻辑回归的系数需要额外的步骤来理解其含义：我们将其转换为优势比（OR）或使用上述方程计算拟合（预测）概率。\n\
  \n我们何时应该使用逻辑模型？如果它比线性模型更拟合数据，它应该是选择。换句话说，**逻辑模型比线性模型拟合得更好，必须是对数优势是 X 的线性函数，但概率不是。**\n\
  \n让我们在一个模拟练习中回顾这些概念：\n\n```\n# 创建随机数据\nset.seed(1)\nn <- 500\nx = rnorm(n)\nz =\
  \ -2 + 3 * x\n\n# 概率由逻辑函数定义\n# 因此它不是 x 的线性函数！\np = 1 / (1 + exp(-z))\n\n# 记得伯努利分布定义\
  \ Y 为 1 或 0\ny = rbinom(n, size = 1, prob = p)\n\n# 然后我们创建数据\ndata <-  data.frame(y,\
  \ x)\nhead(data)\n```\n\n```\n   y          x\n1 0 -0.624538\n2 0 0.183643\n3 0\
  \ -0.835628\n4 0 1.595208\n5 0 0.329507\n6 0 -0.820464\n```\n\n```\ntable(y)\n \
  \  0   1 \n353 147\n```\n\n我们知道概率是由逻辑函数定义的（见上文）。如果将其作为 LPM 拟合，即 `Pr(Y = 1|x) = β[0]\
  \ + β[1]x`，会发生什么？\n\n```\nlpm <- lm(y ~ x, data = data)\nsummary(lpm)\n```\n\n```\n\
  Call:\nlm(formula = y ~ x, data = data)\n\nResiduals:\n     Min      1Q Median \
  \     3Q\n-0.76537 -0.25866 -0.08228 0.28686\n\n(Numbers omitted)\n\nCoefficients:\n\
  \             Estimate Std. Error t value Pr(>|t|)\n(Intercept)  0.28746    0.01567\
  \  18.34   2e-16 ***\nx            0.28892    0.01550  18.64   2e-16 ***\n```\n\n\
