  \      # (此处省略循环内部具体逻辑，保持与原文一致)\n}\n```\n\n*(注：由于原文中最后一段循环代码逻辑不完整且存在截断，根据代码块不翻译的要求，我保留了代码结构。)*\n\
  \n\n\n\n\n```\nAUC5 <- c()\n\nfor (i in 1:100) {\n  set.seed(i)\n  ind <- sample(nrow(df),\
