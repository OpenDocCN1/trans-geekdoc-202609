  \ 828 48 501 ...\n$ RBI: int 29 38 72 78 42 ...\n$ Walks: int 14 39 76 37 30 ...\n\
  $ Years: int 1 14 3 11 2 13 ...\n$ Salary: num NA 475 480 500 91.5 750 70 100 75\
  \ 1100 ...\n```\n\n\n\n集成学习背后的概念基于“群体智慧”的理念。这一理论认为，由一个多样化且规模更大的个体群体所做的集体决策，通常比单一专家的决策更好。当使用单一稳健模型时，糟糕的预测器会在训练过程中被剔除。然而，每个糟糕的预测器在训练中可能仍有微小的贡献，而它们的组合可以是非常显著的。集成学习系统通过将这些糟糕的预测器保留在系统中而不是剔除它们，允许它们在训练过程中拥有“发言权”。这就是集成方法在机器学习中被视为稳健学习算法的主要原因。\n\
  \n### 13.1 Bagging\n\nBagging 的名称来源于树的**自助聚合**（**B**ootstrap **agg**regat**ing**）。其思想非常简单：我们训练许多棵树，每棵树使用一个独立的自助样本，然后将它们聚合为一棵树进行最终决策。它的工作过程包含几个步骤：\n\
  \n1. 选择树的数量 (`B`) 和树的深度 (`D`)，\n2. 创建一个循环执行 `B` 次，\n3. 在每次循环中，(1) 从原始数据生成一个自助样本；(2)\
  \ 在样本上估计一棵深度为 `D` 的树。\n\n让我们通过泰坦尼克数据集来看例子：\n\n```\nlibrary(PASWR)\nlibrary(rpart)\n\
  library(rpart.plot)\ndata(titanic3)\n\n# 这是为了给每棵树设置一组颜色\nclr = c(\"pink\",\"red\"\
  ,\"blue\",\"yellow\",\"darkgreen\",\n        \"orange\",\"brown\",\"purple\",\"\
  darkblue\")\n\nn = nrow(titanic3)\npar(mfrow=c(3,3))\n\nfor(i in 1:9){  # 这里 B =\
  \ 9\n  set.seed(i*2)\n  idx = sample(n, n, replace = TRUE) # 有放回的自助采样\n  tr <- titanic3[idx,]\n\
  \  cart =  rpart(survived~sex+age+pclass+sibsp+parch,\n                cp = 0, data\
  \ = tr, method = \"class\") # 未剪枝\n  prp(cart, type=1, extra=1, box.col=clr[i])\n\
  }\n```\n\n![](img/Fig13_01.jpg)\n\n我们将对这九棵树做什么呢？\n\n在回归树中，预测将是**结果预测值的平均值**。在分类树中，我们**采用多数投票**。\n\
  \n由于通过自助法对一组观测值取平均可以减少方差，因此预测准确性会提高更重要的是，与 `CART` 相比，结果对原始样本的敏感性较低。因此，它们展示了令人深刻的改进。\n\
  \n下面是一个遵循 bagging 步骤的算法。让我们从单树开始，看看如何通过 bagging 来改进它：\n\n```\nlibrary(ROCR)\n\n\
  #测试/训练\nset.seed(1)\nind <- sample(nrow(titanic3), nrow(titanic3) * 0.8)\ntrain\
  \ <- titanic3[ind, ]\ntest <- titanic3[-ind, ]\n\n# 单棵树\ncart <-  rpart(survived\
  \ ~ sex + age + pclass + sibsp + parch,\n                data = train, method =\
  \ \"class\") # 已剪枝\nphat1 <- predict(cart, test, type = \"prob\")\n\n#AUC\npred_rocr\
  \ <- prediction(phat1[,2], test$survived)\nauc_ROCR <- performance(pred_rocr, measure\
  \ = \"auc\")\nauc_ROCR@y.values[[1]]\n```\n```\n[1] 0.8352739\n\n现在我们应用 bagging：\n\
  \n```\nB = 100 # 树的数量\n\nphat2 <- matrix(0, B, nrow(test))\n\n# 循环\nfor(i in 1:B){\n\
  \  set.seed(i) # 使结果可复现\n  idx <- sample(nrow(train), nrow(train), replace = TRUE)\n\
  \  dt <- train[idx, ]\n\n  cart_B <- rpart(survived ~ sex + age + pclass + sibsp\
  \ + parch,\n                cp = 0, data = dt, method = \"class\") # 未剪枝\n  phat2[i,]\
  \ <- predict(cart_B, test, type = \"prob\")[, 2]\n}\ndim(phat2)\n```\n```\n[1] 100\
  \ 2\n\n你可以看到 `phat2` 是一个 100×2 的矩阵。每一列代表 `survived` = 1 的预测概率。我们有 100 棵树（`phat2`\
  \ 中的行），以及针对测试数据中每个观测值的 100 个预测概率。我们现在唯一的工作是对每列的 100 个预测概率取平均值。\n\n```\n# 取平均值\n\
  phat_f <- colMeans(phat2)\n\n#AUC\npred_rocr <- prediction(phat_f, test$survived)\n\
  auc_ROCR <- performance(pred_rocr, measure = \"auc\")\nauc_ROCR@y.values[[1]]\n\
  ```\n```\n[1] 0.876568\n\n因此，我们比单树有了轻微的改进。我们可以看到树的数量 (`B`) 如何累积地增加 AUC（在回归中减少 MSPE）。\n\
  \n```\nB = 300\n\nphat3 <- matrix(0, B, nrow(test))\nAUC <- c()\n\nfor (i in 1:B)\
  \ {\n  set.seed(i)\n  idx <- sample(nrow(train), nrow(train), replace = TRUE)\n\
  \  dt <- train[idx,]\n\n  fit <- rpart(survived ~ sex + age + pclass + sibsp + parch,\n\
  \                cp = 0, data = dt, method = \"class\")\n\n  phat3[i,] <- predict(fit,\
  \ test, type = \"prob\")[, 2]\n  phat_f <- colMeans(phat3)\n\n  #AUC\n  pred_rocr\
  \ <- prediction(phat_f, test$survived)\n  auc_ROCR <- performance(pred_rocr, measure\
  \ = \"auc\")\n  AUC[i] <- auc_ROCR@y.values[[1]]\n}\n\nplot(AUC, type = \"l\", col\
  \ = \"red\",\n     xlab = \"B - 树的数量\",\n     lwd = 2)\n```\n\n(images/Fig13_02.jpg)\
  \ 从图中可以看出，当使用足够大的 `B` 时，AUC（回归中为误差）是稳定的。bagging 的核心思想是通过自助来减少不确定性。bagging 对于高方差基学习器（如决策树或\
  \ kNN）效果非常好。如果学习器是稳定的，bagging 对性能的提升有限。\n\n### 13.2 随机森林\n\n**随机森林 = Bagging + 节点特征子采样**。我们之前已经做过第一部分。随机森林算法通过随机选择样本和特征产生许多单树。由于算法产生了具有足够变异性的（类似于森林的）单树，对它们取平均值比单树更平滑，更重要的是预测能力更强。随机森林回归树在许多特征相关的的情况下特别有效。分裂通常会忽略那些变量，因此在特征很多的情况下性能依然强大。\n\
  \n我们将使用 Breiman 和 Cutler 的 `randomForest()` (2004。以下是步骤和循环结构：\n\n1. 选择树的数量 (`ntree`)、子采样参数\
  \ (`mtry`) 以及树的深度 `maxnodes`，\n2. 创建循环 `ntree` 次，\n3. 在每次循环中，(1) 从原始数据生成一个自助样本；(2)\
  \ 在样本上估计一棵深度为 `maxnodes` 的树，\n4. 但是，对于树中的每次分裂（我们的第二个循环），随机选择 `mtry` 个原始变量并进行分裂。\n\
  \n因此，bagging 是随机森林的一个特例，此时 `mtry` 等于特征数量 (*P*)。\n\n我们如何选择 `mtry` 呢？在实践中，回归的默认值为\
  \ `mtry = P`，分类的 `mtry` = $\\sqrt{P}$。（参见 `?randomForest` 中的 `mtry`）。请注意，通过这个参数\
  \ (`mtry`)，我们可以使用 `randomForest()` 运行纯 bagging 模型，而不是 `rpart()`，只要我们设置 `mtry` =\
  \ *P*。\n\n\n\n\n由于每棵树都采用了自助重采样（bootstrap resampling）过程，随机森林对从袋外（OOB）集合计算出的测试误差提供了一种高效且合理的近似。在执行自助聚合（bootstrap\
  \ aggregating）时，会创建两个独立的集合。其中一个是自助样本，即通过放回抽样选为“袋内”（in-the-bag）的数据；OOB 集合则是采样过程中未被选中的所有数据。因此，不需要交叉验证或测试集即可获得预测误差的无偏估计。这种估计内部内部，因为每棵树都是使用原始数据的不同自助样本构建的。大约三分之一的样本（观测值）被排除在自助样本之外，不用于构建\
  \ `k^{th}` 棵树。通过这种方式，每个样本在大三分之一的树中获得了测试分类。在每次运行中，当某个类别在 OOB 中获得最多投票时，即选择该类别。在 OOB\
  \ 集合所有观测值中，所选类别与真实类别不一致的比例被称为 OOB 误差估计。这在许多测试中已被证明是无偏的。注意，森林的方差随着树数量的增加而减小。因此，通过选择大量的树可能会获得更准确的预测。\n\
  \n你可以将随机森林模型看作 CART 模型的稳健版本。在 `randomForest()` 中有一些可以调优的默认参数。然而，人们认为随机森林中的过拟合问题并不严重。\n\
  \n> Segal (2004) 证明了通过控制随机森林中生长的单个树的深度可以获得微小的性能提升。我们的经验是，使用完全生长的树很少带来巨大代价，并且可以减少一个调优参数。图\
  \ 15.8 显示了深度控制在简单回归示例中的有限影响（Hastie et al., 2009, p.596）。\n\n让我们从模拟开始来展示随机森林和 CART\
  \ 模型：\n\n```\nlibrary(randomForest)\n# 注意这实际上是 Bagging，因为我们只有一个变量\n\n# 我们的模拟数据\n\
  set.seed(1)\nn = 500\nx <- runif(n)\ny <- sin(12 * (x + .2)) / (x + .2) + rnorm(n)\
  \ / 2\n\n# 拟合模型\nfit.tree <- rpart(y ~ x) #CART\nfit.rf1 <- randomForest(y ~ x)\
  \ #No depth control\nfit.rf2 <- randomForest(y ~ x, maxnodes = 20) # Control it\n\
  \n# 绘制观测值和预测值\nz <- seq(min(x), max(x), length.out = 1000)\npar(mfrow = c(1, 1))\n\
  plot(x, y, col = \"gray\", ylim = c(-4, 4))\nlines(z,\n      predict(fit.rf1, data.frame(x\
  \ = z)),\n      col = \"green\",\n      lwd = 2)\nlines(z,\n      predict(fit.rf2,\
  \ data.frame(x = z)),\n      col = \"red\",\n      lwd = 2)\nlines(z,\n      predict(fit.tree,\
  \ data.frame(x = z)),\n      col = \"blue\",\n      lwd = 1.5)\nlegend(\"bottomright\"\
  ,\n  c(\"Random Forest: maxnodes=max\",\n    \"Random Forest: maxnodes=20\",\n \
  \   \"CART: single regression tree\"),\n  col = c(\"green\", \"red\", \"blue\"),\n\
  \  lty = c(1, 1, 1),\n  bty = \"n\"\n)\n```\n\n![](img/Fig13_03.jpg)\n\n随机森林模型无疑优于\
  \ CART，但哪一个更好呢？虽然在增加森林中树的数量（`ntree`）时随机森林模型不应该过拟合，但在实践中，`maxnodes` 和 `mtry` 被用作超参数。\n\
  \n让我们在案例中中使用 OOB MSE 来调优随机森林参数，看看是否有改进。\n\n```\nmaxnode <- c(10, 50, 100, 500)\n\
  for (i in 1:length(maxnode)) {\n  a <- randomForest(y ~ x, maxnodes = maxnode[i])\n\
  \  print(c(maxnode[i], a$mse[500]))\n}\n```\n\n```\n## [1] 10.0000000  0.3878058\n\
  ## [1] 50.0000000  0.335875\n## [1] 100.0000000   0.3592119\n## [1] 500.0000000\
  \   0.3905135\n```\n\n```\n# Increase ntree = 1500\nmaxnode <- c(10, 50, 100, 500)\n\
  for (i in 1:length(maxnode)) {\n  a <- randomForest(y ~ x, maxnodes = maxnode[i],\
  \ ntree = 2500)\n  print(c(maxnode[i], a$mse[500]))\n}\n```\n\n```\n## [1] 10.0000000\
  \  0.391755\n## [1] 50.0000000  0.3353198\n## [1] 100.0000000   0.3616621\n## [1]\
  \ 500.0000000   0.3900982\n```\n\n我们可以看到，即使在增加 `ntree` = 1500 时，`maxnodes` = 50\
  \ 的 OOB-MSE 更小。当然，我们可以使用更精细的 `maxnodes` 序列进行测试。同样，我们可以通过网格搜索选择参数 `mtry`。在袋模型中，我们设置\
  \ `mtry` = `P`。如果不设置，分类的默认值为 `p` 的平方根，回归的默认值为 `p/3`。如果我们需要，可以使用交叉验证调优这两个参数。调优随机森林模型以提高预测准确性的有效性在实践中仍然是一个待解决的问题。\n\
  \nBagging 和随机森林模型对于存在重要非线性和交互作用的问题通常效果良好。\n\n\n\n\n# Boosting（提升法）\n\nBoosting 被应用于许多领域，包括图像和语音识别、自然语言处理和推荐系统。它改进弱学习器性能并处理具有高维特征的复杂数据集的能力使其成为机器学习中的一种强大工具。\n\
  \n我们将从一个使用 `gbm` 包的简单应用开始，展示算法背后的思想。\n\n### 13.3.1 使用 `gbm` 进行序列集成\n\nBoosting 是另一种集成方法，它通过结合决策树来提高预测准确性。与\
  \ bagging（Bag）不同，boosting 是顺序生长树的，而不使用自助采样（bootstrap sampling）。相反，每棵树都是在原始数据集的修改版本——误差上拟合的。例如在回归树中，每棵树都针对上一个树模型的残差进行拟合，这使得每次迭代都能专注于改进之前的误差。虽然这与残差独立于协变量的传统计量经济学做法相比似乎有违背直觉，但这种被称为“从错误中学习”的过程已被证明可以提高预测性能。\n\
  \n然而，由于缺乏自助法，这个过程容易产生过拟合，因为它试图最小化样本内预测误差。因此，引入了一个超参数，通过交叉验证来调整学习过程并防止过拟合，以获得最佳预测模型。这个超参数也称为\
  \ `learning rate`（学习率）或 `step-size reduction`（步长减少），限制了误差的大小。\n\n该超参数（收缩参数，也称为 `learning\
  \ rate` 或 `step-size reduction`）限制了误差的大小。\n\n让我们通过一个受 Charpentier 应用 (2018b) 启发的简单示例来看整个过程：\n\
  \n```r\n# 首先我们模拟数据数据\nn <- 300\nset.seed(1)\nx <- sort(runif(n) * 2 * pi)\ny <-\
  \ sin(x) + rnorm(n) / 4\ndf <- data.frame(\"x\" = x, \"y\" = y)\nplot(df$x, df$y,\
  \ ylab = \"y\", xlab = \"x\", col = \"grey\")\n```\n\n![](img/Fig13_05.jpg)\n\n\
  我们将“提升”单棵回归树：\n\n**步骤 1**：使用样本内数据拟合模型\n\n```r\n# 使用 rpart() 构建回归树\nfit <- rpart(y\
  \ ~ x, data = df) # 第一次拟合：y~x\nyp <- predict(fit) # 使用样本内数据\n\n# 绘制单棵回归树\nplot(df$x,\
  \ df$y, ylab = \"y\", xlab = \"x\", col = \"grey\")\nlines(df$x, yp, type = \"s\"\
  , col = \"blue\", lwd = 3)\n```\n\n![](img/Fig13_06.jpg)\n\n现在，我们将有一个循环来“提升”模型。我们所说的提升是指通过对残差拟合树，来改进\
  \ `yhat`，即 $\\overset{\\hat{}}{f}\\left( x\\_{i} \\right)$ 在表现不佳的地方。\n\n**步骤 2**：找到“误差”并引入超参数\
  \ `h`。\n\n```r\nh <- 0.1 # 收缩参数\n\n# 计算由 h 调整后的预测误差\nyr <- df$y - h * yp\n\n# 将此调整后的预测误差\
  \ `yr` 添加到主数据框中，\n# 它将是我们之后预测的目标变量\ndf$yr <- yr\n\n# 将“第一次”预测存储在 YP 中\nYP <- h *\
  \ yp\n```\n\n注意，如果 `h` = 1，它将给我们通常的“残差”。因此，`h` 控制了我们想要减少“多少误差”。\n\n**步骤 3**：现在，我们将在多次重复的循环中预测“误差”。\n\
  \n```r\n# 重复 t 次（树）的 Boosting 循环\nfor (t in 1:100) {\n  fit <- rpart(yr ~ x, data\
  \ = df) # 这里是 yr~x。\n  # 我们尝试通过 x 来理解预测误差\n\n  yp <- predict(fit, newdata = df)\n\
  \n  # 这是添加到 YP 中的主预测值\n  YP <- cbind(YP, h * yp)\n\n  df$yr <- df$yr - h * yp #\
  \ 下一次迭代的误差\n  # 即下要预测的目标！\n}\n\nstr(YP)\n```\n\n```r\n## num [1:300, 1:101] 0.00966\
  \ 0.00966 0.00966 0.00966 0.00966 ...\n## - attr(*, \"dimnames\")=List of 2\n##\
  \   ..$ : chr [1:300] \"1\" \"2\" \"3\" \"4\" ...\n##   ..$ : chr [1:101] \"YP\"\
  \ \"\" \"\" \"\" ...\n```\n\n现在看 `YP`。我们有一个 300 乘 101 的矩阵。这是一个预测误差矩阵，第一列除外。又怎样？\n\
  \n```r\n# 绘制单棵树和不同 t 下提升树的函数\npl <- function(M) {\n  # Boosting\n  yhat <- apply(YP[,\
  \ 1:M], 1, sum) # 这是深度为 M 的预测 y\n  plot(df$x, df$y, ylab = \"\", xlab = \"\") #\
  \ 数据点\n  lines(df$x, yhat, type = \"s\", col = \"red\", lwd = 3) # 提升线\n\n  # 单棵树\n\
  \  fit <- rpart(y ~ x, data = df)\n  yp <- predict(fit)\n}\n\n# 运行每个\npl(5)\n```\n\
  \n![](img/Fig13_07.jpg)\n![](img/Fig13_08.jpg)\n![](img/Fig13_09.jpg)\n![](img/Fig13_10.jpg)\n\
  \n### 13.3.2 AdaBoost\n\n最流行的 Boosting 算法之一是 Freund 和 Schapire (1997) 的 `AdaBoost.M1`。我们考虑二分类问题，*y*\
  \ ∈ {-1, 1}。对于一组预测变量 *X*，B 棵树中第 *b* 树的分类器 ${\\overset{\\hat{}}{m}}\\left( x \\right)$\
  \ 产生取值 {-1, 1} 的预测。\n\n\n\n\n\n## 6. 权重更新策略\n\n如果观测值 `i` 被分类错误，则更新其权重；否则，使用 `w[i]`，其值为\
  \ `1/n`：\n\n`ω[i]←ω[i]*e^(*α[b])`\n\n让我们尝试一些数字：\n\n```r\n#假设误差 err = 0.2, n=100\n\
  n = 100\nerr = 0.2\nalpha <- 0.5 * log((1 - err) / err)\nalpha\n```\n\n```\n## [1]\
  \ 0.6931472\n```\n\n```r\nexp(alpha)\n```\n\n```\n## [1] 2\n```\n\n因此，第二棵树中分类分类的\
  \ `i` 的新权重（即 `b = 2` 的分类桩）将是：\n\n```r\n# 对于分类错误的观测值\nweight_miss <- (1 / n) * (exp(alpha))\n\
  weight_miss\n```\n\n```\n## [1] 0.02\n```\n\n```r\n# 对于分类正确的观测值\nweight_corr <-\
  \ (1 / n) * (exp(-alpha))\nweight_corr\n```\n\n```\n## [1] 0.005\n```\n\n这表明，随着分类误差的增加，每个分类错误观测值的权重会增加，并减少分类正确观测值的权重。\n\
  \n## 7. 迭代过程与归一化\n\n通过此程序，在从 `b` 到 `B` 的每次循环中，它使用每个 `b` 中更新的权重 `w[i]` 对数据应用 $\\\
  hat{m}_{b}(x)$：\n\n$\\text{e}\\text{r}\\text{r}_{b} = \\frac{\\sum\\limits_{i =\
  \ 1}^{n}w_{i}\\text{I}\\left( y_{i} \\neq \\hat{m}_{b}(x_{i}) \\right)}{\\sum\\\
