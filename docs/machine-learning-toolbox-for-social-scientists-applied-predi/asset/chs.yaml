  \ 1 或 0）的概率。我们估计的 OLS 产生了完全相同的结果，即 `Pr[Y=1|x]=beta[0]+beta[1]x`。由于 `Y` 只有两个结果（1\
  \ 和 0），它有一个特定的分布。首先，让我们回顾一下二项分布和伯努利分布的记忆。通常情况下，如果随机变量 `X` 服从参数为 `n \\in N` 和 `p\
  \ \\in [0, 1]` 的二项分布，我们写作 `X \\sim B(n, p)`。在 `n` 次试验中恰好 `k` 次成功的概率由概率质量函数给出：\n\n\
  $Pr(X = k) = \\binom{n}{k}p^{k}(1 - p)^{n - k}$ (5.3)\n\n对于 $k = 0, 1, ..., n$，其中\
  \ $\\binom{n}{k} = \\frac{n!}{k!(n - k)!}$\n\n公式 5.3 可以理解为：$k$ 次成功的概率为 $p^k$，$n-k$\
  \ 次失败的概率为 $(1-p)^{n-k}$。然而，$k$ 次成功可以发生在 $n$ 次试验中的任何位置，在 $n$ 次试验序列中分布 $k$ 次成功的方法有\
  \ $n!/k!(n!-k!)$ 种。假设一个偏硬币在投掷时出现正面的概率为 0.3。掷六次后获得四次正面的概率是多少？\n\n$Pr(four\\_heads)\
  \ = f(4) = Pr(X = 4) = \\binom{6}{4}0.3^{4}(1-0.3)^{6-4} = 0.05935$\n\n\n\n\n等式\
  \ 5.4 是伯努利分布的概率质量函数，它规定了两个可能结果中每个结果出现的概率。同样，这可以写成如下形式，这避免了编写单独的情况，并且对于某些类型的计算更加方便。这依赖于\
  \ `Y[i]` 只能取值 0 或 1 的事实。在每情况下，指数中的一个将为 1，这将结果变为 `p[i]` 或 `1−p[i]`，正如方程 5.4 所示。\n\
  \n$Pr(Y[i]=y|x[1, i],…,x[m, i]) = p[i]^{(y)}(1−p[i])^{(1−y)}$\n\n因此，这表明：\n\n$Pr(Y[i]=1|x[1,\
  \ i],…,x[m, i])=p[i]=E[Y[i]|X=x]$\n\n让我们有一个更复杂的模型：\n\n```r\nmodel2 <- lm(mpg ~ fuel\
  \ + drive + cyl, data = data)\nsummary(model2)\n```\n\n```\n## Call:\n## lm(formula\
  \ = mpg ~ fuel + drive + cyl, data = data)\n##\n## Residuals:\n##      Min     \
