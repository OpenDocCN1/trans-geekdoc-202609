  \ \\\\right\\\\rbrack + \\\\left( {\\\\text{E}\\\\left\\\\lbrack {y\\_{i} - \\\\\
  hat{f}(x\\_{i})} \\\\right\\\\rbrack \\\\right)^{2}} \\\\ & {= {\\\\text{V}\\\\\
  text{a}\\\\text{r}}\\left\\\\lbrack y\\_{i} \\\\right\\\\rbrack + {\\\\text{V}\\\
