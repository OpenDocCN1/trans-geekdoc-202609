  \ -0.56059319\n```\n\n```r\n# 检查一下\nround(mean(z), 4)\n```\n\n```r\n## [1] 0\n```\n\
  \n我们可以写一个更好的 `z_score`：\n\n```r\nz_score <- function(x) {\n  z <- (x - mean(x))\
  \ / sd(x)\n  z\n}\n\nset.seed(1)\nx <- rnorm(10, 3, 30)\nz <- z_score(x)\nz\n```\n\
  \n```r\n## [1] 1\n```\n\n创建一个打印阶乘的函数：\n\n```r\nfact <- function(a) {\n  b <- 1\n\
