  \ -21.74567  8.513300 19.26393\n```\n\n## 24.3 滚动和扩展窗口\n\n七天的窗口不足以做出可靠的判断。处理此问题的方法之一是使用滚动或扩展窗口。以下示例展示了不同滞后的\
  \ 1 天预测。\n\n\n\n\n$\\begin{array}{rlr} & {y_{t + 1} = y_{t} + z_{t + 1}} & \\\\\\\
  \\ & {y_{t + 2} = y_{t + 1} + z_{t + 2} = y_{t} + z_{t + 1} + z_{t + 2}} & \\\\\\\
  \\ \\end{array}$\n\n```r\nset.seed(321)\ny <- rnorm(10)\nz <- diff(y)     # first\
  \ differences\nback <- cumsum(c(y[1], z))\ncbind(y, back)\n```\n\n```r\n##     \
  \           y       back\n##  [1,]  1.7049032  1.7049032\n##  [2,] -0.7120386 -0.7120386\n\
  ##  [3,] -0.2779849 -0.2779849\n##  [4,] -0.1196490 -0.1196490\n##  [5,] -0.1239606\
  \ -0.1239606\n##  [6,]  0.2681838  0.2681838\n##  [7,]  0.7268415  0.7268415\n##\
  \  [8,]  0.2331354  0.2331354\n##  [9,]  0.3391139  0.3391139\n## [10,] -0.5519147\
  \ -0.5519147\n```\n\n由于我们的算法预测的是观测值的变化，因此简单的求和即可完成反向变换。例如，作为一个起点，我们的算法预测了第 156-157\
  \ 天 `Y` 的变化（窗口大小为 150 加上最佳滞后窗口，长度为 6）。当我们将此预测的变化加到第 156 天的实际 `Y` 时，就会得到第 157 天的反向变换预测值。\n\
  \n```r\ny <- df$cases\n\n# 第一次预测是在 ws (150) + l[best] (6) + 1，即 157\n# 第一个实际 Y 应该早一天开始\n\
  # 移除直到 ws+l[bst] 的所有 Y\n\ny_a_day_before <- y[-c(1:(ws + l[bst] - 1))]\n\n# 这将预测的变化加到一天前的观测值上\n\
  back_forecast <- head(y_a_day_before,-1) + all_fh[[bst]]\n\n# 测试集中的实际 Y 从 ws (150)\
  \ + l[best] (6) + 1 开始，即 157\nytest <- y[-c(1:(ws + l[bst]))]\n\nplot(\n  ytest,\n\
  \  type = \"l\",\n  col = \"blue\",\n  ylab = \"实际 Y (蓝色) vs 预测值 (红色)\",\n  xlab\
  \ = \"天\",\n  main = \"反向变换预测\"\n)\nlines(back_forecast, type = \"l\", col = \"\
  red\")\n```\n\n![](img/Fig24_04.jpg)\n\n似乎对于大多数日子，我们的算法仅仅是通过使用前一一天的值来预测第二天。如果我们将算法改为提前\
  \ 7 天预测，情况就会有所不同。这也是预测模型预测能力较差时的一个常见问题。再次，这并不是由于我们的算法问题，而是正如我们之前强调的那样，用不完美的测试数据预测流行曲线几乎是一项不可能完成的任务。\n\
  \n在实践中，我们有几种方法可以改进上述脚本。例如，我们可以将（滚动或扩展）窗口大小视为一个超参数。我们还可以对随机森林算法进行显式训练。我们可以通过在脚本中添加其他预测算法（如提升法\
  \ boosting）来实现集成预测。此外，我们可以开发一个基础预测，作为基准来观察我们的算法相对于该基准改进了多少。最后，我们可以对数据进行变换以稳定所有变量的方差。\n\
  \n## Note\n\n1. 网站： [`data.ontario.ca/en/dataset?groups=2019-novel-coronavirus#byPHU`](https://data.ontario.ca/)。\n\
  \n# 25 循环神经网络\n\nDOI: [10.1201/9781003381501-32](https://doi.org/10.1201/9781003381501-32)\n\
  \n本章介绍了循环神经网络 (RNNs)，这是一类强大的人工神经网络，专为处理序列数据设计，适用于时间序列分析。我们探索了它们的独特架构，使其能够捕捉并建模时间模式，并展示了从复杂时间序列数据生成准确预测的有效性。\n\
  \nRNN 是一种人工神经网络，特别适用于处理序列数据，如时间序列和语音。它们被称为“循环”的，是因为它们对序列中的每个元素执行相同的任务，且输出依赖于之前的计算。\n\
  \n使用神经网络处理序列数据的想法可以追溯到 1980 年代，但直到 1990 年代 RNN 才开始广泛使用。这一时期的一个关键进展是使用了长短期记忆（LSTM）单元，它是一种“记忆”单元类型，可以存储长时间的信息，并帮助防止训练\
  \ RNN 时出现的梯度消失问题。\n\nRNN 使用一系列“神经元”来处理输入数据。每个神经元接收来自其他神经元和输入数据的输入，使用激活函数进行处理，并将输出作为其他神经元的输入或网络的最终输出。因此，给定时间点的神经元输出被用作下一个时间点的神经元的输入，允许网络将之前时间步的信息整合到当前计算中。RNN\
  \ 的处理过程所示：\n\n![](img/Fig25_01.jpg)\n\n\n\n张量（Tensors）简单来说就是多维数组，向量和矩阵向任意维度的推广。例如，向量是\
  \ 1D 张量，矩阵用于 2D 张量，而数组（支持任意数量的维度）用于多维对象。Keras 可以在 CPU 上运行，但最高的 Keras 实现使用了 NVIDIA\
  \ GPU 以及正确配置的 `CUDA` 和 `cuDNN` 库。对于基于 CPU 的 Keras 安装（这也是本章使用的方法），我们建议在安装 `keras`\
  \ 包后采取以下步骤。\n\n```\n# Sys.unsetenv(\"RETICULATE_PYTHON\")\n# remotes::install_github(\"\
  rstudio/reticulate\")\n# reticulate::install_miniconda()\n# keras::install_keras\
  \ ()\n```\n\n在 R 中使用 Keras 进行人工神经网络项目的最佳来源是 Chollet 和 Allaire 编写的《Deep Learning\
  \ with R》（2018）。在本节中，我们将使用 `keras` 包（在 CPU 上）处理两个主要的时间序列应用：RNN 和 LSTM。\n\n让我们设置\
  \ COVID-19 数据并对每个变量进行标准化处理。\n\n```\nlibrary(tsibble)\nlibrary(fpp3)\n\nload(\"~/Dropbox/ToolShed_draft/toronto2.rds\"\
  )\ntoronto2 <- data\ndf <- toronto2 %>%\n  mutate(\n    dcases = difference(cases),\n\
  \    dmob = difference(mob),\n    ddelay = difference(delay),\n    dmale = difference(male),\n\
  \    dtemp = difference(temp),\n    dhum = difference(hum)\n  )\n\ndft <- df[, -c(2:5,\
  \ 7, 8)] #移除水平\ndft <- dft[-1, c(3:7, 2)] # 重新排列列\nsdtf <- scale(dft) #\nhead(sdtf)\n\
  ```\n\n```\n##        dcases        dmob     ddelay       dmale      dtemp     \
  \   age\n## 2  0.04202890 -0.21389272 -7.6496254  2.16845790  2.4818892  0.5144024\n\
  ## 3  0.10622289  0.30023017  1.8050246 -2.58211378 -0.4756078  1.6374603\n## 4\
  \ -0.11845609  0.45271551  2.9516317 -3.56924556  0.3182466  1.1383235\n## 5 -0.02216510\
  \  0.05796098 -1.2461163  1.24302186 -0.6779629  0.9600603\n## 6  0.07412590 -0.41612714\
  \ -2.1128735  0.62606450 -0.3697605 -0.6086555\n## 7 -0.08635909  0.47965067 -0.7048789\
  \  0.00910714 -0.5347577  0.6703827\n```\n\n在 Keras 中开发 ANN 模型有四个阶段：\n\n*   准备训练集的输入张量和目标张量。\n\
  *   定义模型网络层。\n*   选择学习参数：损失函数、优化器以及某些指标。\n*   最后将模型拟合到训练集。\n\n## 2. 输入张量\n\n我们将定义一个包含时间序列数据的\
