  ```\n\n```\n## [1] 0.252354\n```\n\n# 蒙提霍尔问题 (Monty Hall problem) - 趣味示例\n\n蒙提霍尔问题是一个有趣的智力题，源于一个电视节目，以蒙提·霍尔命名。规则如下：\n\
  \n有三扇门，其中一扇后面是汽车，另外两扇后面是山羊。你选择一扇门，之后，知道汽车在哪门的主持人会从剩下的两扇门中打开一扇有山羊的门，并问你：“你愿意改变选择到另一扇门吗？”\n\
  \n改变选择会增加赢得汽车的概率吗？让我们通过计算机模拟来证明这一点。\n\n### 36.6 模拟证明\n\n首先，我们决定模拟的次数：\n\n```\nn\
  \ <- 100000\n```\n\n然后，我们创建空容器来存储每个游戏的结果：\n\n```\noutcomes <- c(123, 132, 213, 231,\
  \ 312, 321) # 所有可能的组合\ncar <- rep(0, n)\ngoat1 <- rep(0, n)\ngoat2 <- rep(0, n)\n\
  choice <- rep(0, n)\nmonty <- rep(0, n)\nwinner <- rep(0, n)\n```\n\n最后，我们循环进行多次游戏：\n\
  \n```\nfor (i in 1:n) {\n  # 随机抽取一个门组合\n  doors <- sample(outcomes, 1) # 随机决定哪扇门有车\n\
  \  car[i] <- substring(doors, 1, 1) # 第一个数字是汽车的位置\n  as.numeric(car[i]) # 转换为数字以便\n\
  \  goat1[i] <- substring(doors, 2, 2) # 第二个数字\n  as.numeric(goat1[i]) # 转换为数字以便\
  \ 第一只山羊\n  goat2[i] <- substring(doors, 3, 3) # 第三个数字\n  as.numeric(goat2[i]) #\
  \ 转换为数字以便 第二只山羊\n\n  # 玩家随机选择一扇门\n  choice[i] <- sample(1:3, 1)\n\n  # 现在主持人打开一扇有山羊的门\n\
  \  if (choice[i] == car[i])\n  {\n    monty[i] = sample(c(goat1[i], goat2[i]), 1)\
  \ # 随机打开两只山羊之一\n  }\n  else if (choice[i] == goat1[i])\n  {\n    monty[i] = goat2[i]\n\
  \  }\n  else\n  {\n    monty[i] = goat1[i]\n  }\n\n  # 1 代表坚持最初选择的人\n  # 2 代表改变最初选择的人\n\
  \  if (choice[i] == car[i]) {\n    winner[i] = 1\n  } else {\n    winner[i] = 2\n\
  \  }\n}\n```\n\n以及，结果如下：\n\n```\nhist(\n  winner,\n  breaks = 2,\n  main = \"谁获胜的概率更高？\"\
  ,\n  ylim = c(0, 70000),\n  labels = c(\"留守\", \"切换\"),\n  col = c(\"aliceblue\"\
  , \"pink\"),\n  cex.axis = 0.75,\n  cex.lab = 0.75,\n  cex.main = 0.85\n)\n```\n\
  \n\n\n\n\n优化算法是一种通过迭代比较各种解决方案，直到找到最优或满意的解决方案的程序。优化算法帮助我们根据模型的内部参数，将一组预测变量 (`X`)\
  \ 映射到目标值(`Y`)，并最小化或最大化目标函数 `F` (`x`)。有三种广泛使用的优化算法：`零阶算法`、一阶优化算法和二阶优化算法。零阶算法（或无导数算法）仅使用某些位置的准则值。当梯度和海森矩阵（Hessian）信息难以获取时（例如没有给出显函数形式），这种方法非常流行。一阶优化算法利用其相对于参数的梯度值来最小化或最大化损失函数\
  \ `F` (`x`)。最广泛使用的一阶优化算法是`梯度下降`。一阶导数显示了函数在特定点处是减少的还是增加的。\n\n在本附录中，我们将回顾算法优化中的一些重要概念。\n\
  \n## A.1 暴力优化\n\n让我们来看一个简化的最优退休计划示例，并用零阶算法来求解。\n\n假设有两组工人，他们计划在 65 岁退休。他们都考虑在退休后的余生中每年花费\
  \ 40,000 美元。平均而言，两组的人预计退休后还能活 20 年，但存在某些不确定性。第一组 (A) 的人具有以下风险状况：85% 的概率活 20 年，15%\
  \ 的概率活 30 年。第二组 (B) 的人风险状况相同：99% 的概率活 20 年，1% 的概率活 30 年。假设在每组中，它们的效用（目标）函数为 `U`\
  \ = `C`⁰.*⁵。\n\n每组人员愿意为 4 万的终身年金支付最高费（一次性付款）是多少？\n\n如果没有养老金计划，每组人员的效用如下：\n\n```\n\
  # 对于 A 组的人\nU_A = 0.85*sqrt(40000*20) + 0.15*sqrt(10*0)\nU_A\n```\n\n```\n## [1]\
  \ 760.2631\n```\n\n```\n# 对于 B 组的人\nU_B = 0.99*sqrt(40000*20) + 0.01*sqrt(10*0)\n\
  U_B\n```\n\n```\n## [1] 885.4829\n```\n\n例如，他们不会支付 200,000 美元来覆盖退休费用，因为这会让他们的处境比目前（没有养老金计划）更糟糕。\n\
  \n```\n# 对于 A 组的人\nU_A = 0.85*sqrt(40000*20 - 200000) + 0.15*sqrt(40000*10 - 200000)\n\
