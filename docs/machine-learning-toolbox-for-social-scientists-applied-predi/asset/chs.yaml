  \n```r\ndim(b)\n# [1] 6 2\n```\n\n```r\nstr(b)\n# 'data.frame':    6 obs. of  2\
  \ variables:\n#$gender: chr \"male\" \"female\" \"female\" \"female\" \"female\"\
  \ \"male\"\n#$numbers: factor:1 2 3 4 5 6\n```\n\n为什么输出中显示 `levels`？这是因为默认情况下，字符向量在\
