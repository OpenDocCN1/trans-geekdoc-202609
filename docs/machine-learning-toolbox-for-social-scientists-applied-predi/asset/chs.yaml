  \ PC 来降低维度（前 4 个 PC 在平均水平以上，解释了超过 80% 的变异——见上图）：\n\n```\nreduced <- pc[, 1:4]\n\
  dim(reduced)\n```\n\n```\n[1] 27 4\n```\n\n```\nhead(reduced)\n```\n\n`T` 的每一列连续继承了来自\
  \ `X` 的可能的方差，而 `V` 中的每个系数向量被限制为单位向量。在 `T = XV` 中，`V` 是一个 $p \\times p$ 的权重矩阵，其列为\
  \ $X^\\top X$ 的特征向量。`V` 的列乘以对应特征值的平方根（即通过方差缩放的特征向量），在 PCA 和因子分析中被称为载荷（loadings）。\n\
  \n注意，如果我们对协方差矩阵进行奇异值分解：\n\n$$\\begin{array}{rlr} {\\mathbf{X}^{T}\\mathbf{X}} &\
  \ {= \\mathbf{V}\\Sigma^{\\top}\\mathbf{U}^{\\top}\\mathbf{U}\\Sigma\\mathbf{V}^{\\\
  top}} & \\\\ \\\\ & {= \\mathbf{V}\\Sigma^{\\top}\\Sigma\\mathbf{V}^{\\top}} & \\\
  \\ \\\\ & {= \\mathbf{V}{\\hat{\\Sigma}}^{2}\\mathbf{V}^{\\top}} & \\\\ \\\\ \\\
  end{array}$$\n\n其中 $\\hat{\\Sigma}$ 是带有 `X` 的奇异值的平方对角矩阵，并删除了多余的零以满足 $\\hat{\\Sigma}²\
  \ = \\Sigma^\\top$。\n\n## 31 因子分析\n\n在本节的最后一个章节中，我们研究因子分析（Factor Analysis, FA），这是一种试图揭示解释变量之间关系的潜在变量或因子的统计技术。该方法对于简化复杂数据集和提供相互关联结构的见解具有极价值，使其成为心理学、经济学和社会科学等领域的本质工具。\n\
  \n如下所示，因子模型可以表示为多元回归，其中每个 $X[i]$（$i=1, \\dots, p$）都是 $m$ 个不可观测公共因子 $f[i]$ 的函数：\n\
  \n$$\\begin{matrix} {X_{1} = \\mu_{1} + \\beta_{11}f_{1} + \\beta_{12}f_{2} + \\\
  cdots + \\beta_{1m}f_{m} + \\epsilon_{1}} \\\\ {X_{2} = \\mu_{2} + \\beta_{21}f_{1}\
  \ + \\beta_{22}f_{2} + \\cdots + \\beta_{2m}f_{m} + \\epsilon_{2}} \\\\ {\\vdots}\
  \ \\\\ {X_{p} = \\mu_{p} + \\beta_{p1}f_{1} + \\beta_{p2}f_{2} + \\cdots + \\beta_{pm}f_{m}\
  \ + \\epsilon_{p}} \\end{matrix}$$\n\n\n\n\n其中 `E (*X[i]*) = μ[i]`，`ϵ[i]` 被称为**特定因子**。系数\
  \ `β[ij],` 是因子**载荷**。我们可以用矩阵符号表示所有这些项。\n\n`X = μ + Lf + ϵ` (31.1)\n\n其中\n\n$\\mathbf{L}\
  \ = \\begin{pmatrix} \\beta\\_{11} & \\beta\\_{12} & {\\\\ldots} & \\beta\\_{1m}\
  \ \\\\ \\beta\\_{21} & \\beta\\_{22} & {\\\\ldots} & \\beta\\_{2m} \\\\ {\\\\vdots}\
  \ & {\\\\vdots} & & {\\\\vdots} \\\\ \\beta\\_{p1} & \\beta\\_{p2} & {\\\\ldots}\
  \ & \\beta\\_{pm} \\\\ \\\\end{pmatrix}$\n\n存在多个假设：\n\n*   `E (*ϵ[i]*) = 0` 和 `var\
  \ (*ϵ[i]) = ψ[i]`，这被称为“特定方差”。\n\n*   `E (*f[i]*) = 0` 且 `var (*f[i]) = 1`。\n\n*\
  \   `cov (*f[i], f[j]*) = 0`（当 *i* ≠ *j* 时）。\n\n*   `cov (*ϵ[i], ϵ[j]*) = 0`（当 *i*\
  \ ≠ *j* 时）。\n\n*   `cov (*ϵ[i], f[j]*) = 0`。\n\n给定这些假设，`X[i]` 的方差可以表示为：\n\n${var}\\\
  left( X\\_{i} \\right) = \\sigma\\_{i}^{2} = \\underset{j = 1}{\\overset{m}{\\Sigma}}\\\
  beta\\_{ij}^{2} + \\psi\\_{i}$\n\n`X[i]` 的方差有两个来源：${\\sum}\\_{j = 1}^{m}\\beta\\\
  _{ij}^{2}$，它被称为变量 *i* 的**共同性性**，以及**特定方差** `ψ[i]`。\n\n此外，\n\n*   ${cov}\\left( X\\\
  _{i},X\\_{j} \\right) = \\sigma\\_{ij} = {\\\\sum}\\_{k = 1}^{m}\\beta\\_{ik}\\\
  beta\\_{jk},$\n\n*   `cov (*X[i], f[j]*) = β[ij]`\n\n我们 **X** 的协方差矩阵的因子模型可以表示为：\n\
  \nvar-cov(**X**) = Σ = LL′ + Ψ\n\n它是与另一个变量的共享方差 `LL′`（公有方差或**共同性**）与每个变量固有的独特方差\
  \ `Ψ`（（**特定方差**）之和。\n\n我们需要查看 `LL′`，其中 `L` 是一个 *p* *×* *m* 的载荷矩阵。通常情况下，我们希望 *m*\
  \ ≪ *p*。\n\n`LL′` 的第 *i* 个对角线元素（载荷平方之和）被称为第 *i* 个共同性。共同性值代表了由公共因子解释的变异百分比。共同性的大小和或特定方差的大小可评估拟合优度。\n\
  \n要用 PCA 估计因子载荷，我们首先计算数据的主成分，然后利用标准化数据相关矩阵的特征向量计算因子载荷。当使用 PCA 时，估计的因子载荷矩阵 `L*,`\
  \ 给出：\n\n${}\\\\operatorname{}\\\\hat{\\mathbf{L}} = \\left\\\\lbrack \\begin{array}{lll}\
  \ {\\\\sqrt{{\\hat{\\lambda}}\\_{1}}{\\hat{\\mathbf{v}}}\\_{1}} & {\\\\sqrt{{\\\
  hat{\\lambda}}\\_{2}}{\\hat{\\mathbf{v}}}\\_{2}} & {\\\\ldots\\\\sqrt{{\\hat{\\\
  lambda}}\\_{m}}{\\hat{\\mathbf{v}}}\\_{m}} \\\\ \\\\end{array} \\right\\rbrack$\
  \ (31.2)\n\n其中\n\n${\\hat{\\beta}}\\_{ij} = {\\\\hat{\\mathbf{v}}}\\_{ij}\\sqrt{{\\\
  hat{\\lambda}}\\_{j}}$\n\n其中 *i* 是原始变量的索引，*j* 是主成分的索引，特征向量 `(i, j*)` 是相关矩阵第 *j*\
  \ 个特征向量的第 *i* 个分量，特征值 `(j*)` 是相关矩阵的第 *j* 个特征值。\n\n这种方法试图寻找使总共同性估计值接近观测方差总和的载荷值。忽略了协方差。记住，共同性是变量方差被因子解释的部分。因此，共同性越大，因子模型在解释变量方面就越成功。\n\
  \n让我们来看一个例子。数据集名为 `bfi`，来自 `psych` 包。该数据包含 2800 名受试者的来自国际人格项目池的 25 个自评人格项目、性别、教育水平和年龄。人格项目分为五类：宜人性（A）、尽责性（C）、外倾（E）、神经质（N）和开放性（O）。每个项目都在六点量表上进行回答：从一（不准确）到六（非常准确）。\n\
  \n```\nlibrary(psych)\ndata(\"bfi\")\nstr(bfi)\n```\n\n\n\n\n```\n## 调用：\n## factanal(x\
  \ = df, factors = 5)\n\n## 独性性:\n##    A1    A2    A3    A4    A5    C1    C2  \
  \  C3    C4    C5    E1    E2    E3\n## 0.830 0.576 0.466 0.691 0.512 0.660 0.569\
  \ 0.677 0.510 0.557 0.634 0.454 0.558\n##    E4    E5    N1    N2    N3    N4  \
  \  N5    O1    O2    O3    O4    O5\n## 0.468 0.592 0.271 0.337 0.478 0.507 0.664\
  \ 0.675 0.744 0.518 0.752 0.726\n\n## 载荷：\n##    Factor1 Factor2 Factor3 Factor4\
  \ Factor5\n## A1  0.104                  -0.393\n## A2          0.191   0.144  \
  \ 0.601\n## A3          0.280   0.110   0.662\n## A4          0.181   0.234   0.454\
  \  -0.109\n## A5 -0.124   0.351           0.580\n## C1                  0.533  \
  \         0.221\n## C2                  0.624   0.127   0.140\n## C3           \
  \       0.554   0.122\n## C4  0.218          -0.653\n## C5  0.272  -0.190  -0.573\n\
  ## E1         -0.587          -0.120\n## E2  0.233  -0.674  -0.106  -0.151\n## E3\
  \          0.490           0.315   0.313\n## E4 -0.121   0.613           0.363\n\
  ## E5          0.491   0.310   0.120   0.234\n## N1  0.816                  -0.214\n\
  ## N2  0.787                  -0.202\n## N3  0.714\n## N4  0.562  -0.367  -0.192\n\
  ## N5  0.518  -0.187           0.106  -0.137\n## O1          0.182   0.103     \
