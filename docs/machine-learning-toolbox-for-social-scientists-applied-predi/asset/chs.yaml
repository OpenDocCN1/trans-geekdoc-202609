  \ = \"Seasonal & first differenced\", y = \"\")\n```\n\n![](img/Fig21_04.jpg)\n\n\
  我们可以通过以下公式计算时间序列中的趋势强度 (`T`) 和季节性强度 (`S`)，`y[t] = T[t] + S[t] + R[t]`：\n\n$\\begin{array}{r}\
  \ {F_{Trend} = \\max\\left( 0,1 - \\frac{{Var}\\left( R_{t} \\right)}{{Var}\\left(\
  \ T_{t} + R_{t} \\right)} \\right),} \\\\\\\\ {F_{Seasonality} = \\max\\left( 0,1\
  \ - \\frac{{Var}\\left( R_{t} \\right)}{{Var}\\left( S_{t} + R_{t} \\right)} \\\
  right),} \\\\\\\\ \\\\end{array}$\n\n其中 `R[t]` 是残差部分：\n\n```\nt <- toronto %>% features(cases,\
  \ feat_stl)\nt(t[1:2])\n```\n\n```\n##      [,1]\n## trend_strength         0.9843102\n\
  ## seasonal_strength_week 0.5142436\n```\n\n相对于 `F[Trend]`，该数据中的季节性并不够稳健。因此，我们的决定是采用带\
  \ Box–Cox 变换的简单一阶差分。然而，我们将观察该变换是否提供了任何益处并查看最终的预测性能。\n\n## 21.5 ARIMA 建模\n\n在他的文章《预测\
  \ COVID-19》中：\n\n> (. . . ) 对于 COVID-19 大流行，很容易看出为什么预测其影响是困难的。虽然我们对人与人传播的机制有很好的了解，但我们获得的数据非常有限且具有误导性。由于检测能力有限，目前的确诊病例数字被认为严重低估了。未被诊断的\
  \ COVID-19 病例几乎多于已确诊病例。此外，低估程度在不同国家之间差异巨大。在像韩国这样检测大量的国家，确诊病例数将接近实际病例数，而在检测远少的美国则不然。因此，我们无法简单地利用现有数据对疫情的传播进行建模。\n\
  \n> 第二个问题是，COVID-19 的预测会影响我们试图预测的对象，因为政府正在做出反应，有些比有些做得好。除非模型能够整合减缓传播传播的各种措施，否则使用可用数据的简单模型将具有误导性。\n\
  \n> 总之，对可用数据拟合简单模型是没有意义的、误导的且危险的。\n\n根据我们选择的数据，我们并不打算引发另一场关于预测 COVID-19 的辩论。目前 COVID-19\
  \ 预测中心（The COVID-19 Forecast Hub）中已有数百种不同的预测模型可以实时使用。我们将从自动算法 `ARIMA()` 开始，它允许设置季节参数：\n\
  \n`ARIMA(p,d,q)×(P,D,Q)S`\n\n第一项是 ARIMA 的非季节部分，`p` = AR 阶，`d` = 非季节差分阶，`q` = MA\
  \ 阶。第二项是模型的季节部分，`P` = 季节性 AR 阶，`D` = 季节性差分阶，`Q` = 季节性 MA 阶，`S` = 季节模式，定义了模式再次重复所需的时间周期。\n\
  \n在我们的案例中，低值往往出现在某些特定的日子，星期日。因此，我们可能认为 `S = 7` 是数据中周期性季节行为的跨度。我们可以考虑季节一阶自回归模型 `AR(1)`，它将使用\
  \ `X[t][-7]` 来预测 `X[t]`。同样，季节二阶自回归模型将使用 `X[t][-7]` 和 `X[t][-14]` 来预测 `X[t]`。季节一阶\
  \ `MA(1)` 模型将使用 `ϵ[t][-7]` 作为预测因子。季节二阶 `MA(2)` 模型将使用 `ϵ[t][-7]` 和 `ϵ[t][-14]`。\n\
  \n让我们先对数据进行一阶差分和变换：\n\n```\ntoronto <- toronto %>%\n  mutate(boxcases = box_cox(cases,\
  \ lambda = lmbd))\n\ntoronto %>%\n  gg_tsdisplay(difference(boxcases), plot_type='partial')\n\
  ```\n\n![](img/Fig21_05.jpg)\n\n我们观察 ACF 和 PACF 中的峰值和衰减：ACF 在季节峰值 7、14 和 21 处观察到指数衰减，而\
  \ PACF 在 7 和 14 处的两个峰值表明存在季节性 `AR(2)`。由于 PACF 在第 1 和第 2 天有两个峰值，我们还将添加非季节性的 `AR(2)`。以下是我们的初始模型：\n\
  \n`ARIMA(2,1,0)(2,1,0)[7]` 和 `ARIMA(0,1,2)(0,1,3)[7]`\n\n```\ncovfit <- toronto\
  \ %>%\n  model(\n    AR2 = ARIMA(boxcases ~ pdq(2, 1, 0) + PDQ(3, 1, 0)),\n    MA3\
  \ = ARIMA(boxcases ~ pdq(0, 1, 2) + PDQ(0, 1, 3)),\n    auto = ARIMA(boxcases, stepwise\
  \ = FALSE, approx = FALSE)\n  )\n\nt(cbind(\n  \"AR2\" = covfit$AR2,\n  \"MA3\"\
  \ = covfit$MA3,\n  \"auto\" = covfit$auto\n))\n```\n\n```\n##      [,1]\n## AR2\
  \  ARIMA(2,1,0)(3,1,0)[7]\n## MA3  ARIMA(0,1,2)(0,1,3)[7]\n## auto ARIMA(2,1,1)(2,0,0)[7]\n\
  ```\n\n```\nglance(covfit) %>% arrange(AICc) %>% dplyr::select(.model:BIC)\n```\n\
  \n```\n## # A tibble: 3 x 6\n##   .model sigma2 log_lik   AICc   BIC\n##   <char>\
  \   <dbl>   <dbl> <dbl> <dbl>\n## 1 MA3     0.468   -277.2  566.58  567.9\n## 2\
  \ AR2     0.534   -285.1  582.3  583.1\n## 3 auto    0.525   -289.0  590.4  612.2\n\
  ```\n\n`glance(covfit)` 提供了每个模型的指标。`AICc`（修正后的赤池信息准则）在小样本量下通常更优。。在这种情况下，`MA3` 具有最低的\
  \ `AICc`。\n\n\n\n\n\n# 一个寓言：21 x 4 [1D]\n\n## 关键点：.model [3]\n\n```\n   .model Day\
