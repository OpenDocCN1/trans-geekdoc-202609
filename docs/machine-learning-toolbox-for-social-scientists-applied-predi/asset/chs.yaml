  \ = c(0.05, 0.5, 1, 2, 3, 4)\n  )\n)\ntuning$best.model\n```\n\n```text\n## ## Call:\n\
  ## best.tune(METHOD = svm, train.x = IncomeLevel ~ ., data = dft,\n   ranges = list(cost\
