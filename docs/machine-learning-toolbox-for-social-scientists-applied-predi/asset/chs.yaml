  \ of minimal depth and its mean\")\n```\n\n![](img/Fig14_04.jpg)\n\n# 14.4 Boosting\
  \ 应用\n\n我们需要使用 `gbm()` 来调优 Boosting 应用。调优参数分为两组：Boosting 参数和树参数。\n\n- **Boosting\
  \ 参数：** 迭代次数（`n.trees` = 100）和学习率（`shrinkage` = 0.1）。\n- **树参数：** 每棵树的最大深度（`interaction.depth`\
  \ = 1）以及树的终端节点中最小观测数（`n.minobsinnode` = 10）。\n\n`gbm` 算法内部提供了三种调优选项来选择最佳迭代次数：`OOB`、`test`\
  \ 和 `cv.fold`。`test` 使用单个留出测试集来选择最优迭代次数。它由 `train.fraction` 控制，该参数通过 `train.fraction`\
  \ [a214] `nrow(data)` 创建测试集。这不是交叉验证，但可以与外部运行的多个循环结合使用。\n\nk 折交叉验证则由 `cv.fold` 控制，可用于寻找最佳迭代次数。例如，如果\
  \ `cv.folds`=5，则 `gbm` 会拟合五个 `gbm` 模型来计算交叉验证误差。使用最佳（平均迭代次数），它将使用所有数据拟合第六个也是最终的 gbm\
  \ 模型。该最终模型中报告的 `cv.error` 将决定最佳迭代次数。\n\n最后，有一个参数 `bag.fraction`，它是从训练集中随机选择的观测值比例，用于提议扩展过程中的下一棵树。这在模型拟合中引入了随机性，从而减少了过拟合的可能性。每次迭代中误差的“改进”（预测误差）由\
  \ `oobag.improve` 报告。\n\n下面我们展示了这三种识别最佳迭代次数的方法：\n\n```r\nlibrary(ISLR)\nlibrary(gbm)\n\
  \ndata(Hitters)\ndf <- Hitters[complete.cases(Hitters$Salary), ]\ndf$Salary <- log(df$Salary)\n\
  \nmodel_cv <- gbm(Salary~., distribution =\"gaussian\", n.trees=1000,\n        \
  \    interaction.depth = 3, shrinkage = 0.01, data = df,\n            bag.fraction\
  \ = 0.5,\n            cv.folds = 5)\nbest <- which.min(model_cv$cv.error)\nsqrt(model_cv$cv.error[best])\n\
  ```\n\n```\n# [1] 0.4659767\n```\n\n```r\n# 或者可以通过这种获得\ngbm.perf(model_cv, method=\"\
  cv\")\n```\n\n![](img/Fig14_05.jpg)\n\n```\n# [1] 758\n```\n\n以下方法可以与运行多次的外部循环结合，例如：\n\
  \n```r\nmodel_test <- gbm(Salary~., distribution =\"gaussian\", n.trees=1000,\n\
  \            interaction.depth = 3, shrinkage = 0.01, data = df,\n            bag.fraction\
  \ = 0.5,\n            train.fraction = 0.8)\ngbm.perf(model_test, method=\"test\"\
  )\n```\n\n![](img/Fig14_06.jpg)\n\n```\n# [1] 899\n```\n\n```r\nwhich.min(model_test$valid.error)\n\
  ```\n\n```\n# [1] 899\n```\n\n```r\nmin(model_test$valid.error)\n```\n\n```\n# [1]\
  \ 0.304656\n```\n\n`OOB` 选项不建议用于模型选择（参见 `gbm` 包的指南）。然而，`bag.fraction` 可用于减少过拟合，它是从训练集中随机选择以提议扩展中下一棵树的比例。这在模型拟合中引入了随机性，从而减少过拟合。我们还可以覆盖所有内部过程并应用自己的网格搜索。下面我们展示了几个示例。我们还需要注意\
  \ `gbm` 函数使用了并行处理迭代。\n\n### 14.4.1 回归\n\n```r\nlibrary(ISLR)\ndata(Hitters)\ndf\
  \ <- Hitters[complete.cases(Hitters$Salary), ]\ndf$Salary <- log(df$Salary)\n\n\
  # 训练/测试拆分\nset.seed(1)\nind <- sample(nrow(df), nrow(df), replace = TRUE)\ntrain\
  \ <- df[ind, ]\ntest <- df[-ind, ]\n```\n\n这让你了解了如何使用 `h` 进行 Boosting 调优：\n\n```r\n\
  library(gbm)\n\nh <- seq(0.01, 0.8, 0.01)\n\ntest_mse <- c()\n\n# D = 1 和 B = 1000\n\
  for(i in 1:length(h)){\n    boos <- gbm(Salary~., distribution = \"gaussian\", n.trees\
  \ = 1000,\n            interaction.depth = 1, shrinkage = h[i], data = train)\n\
  \    prboos <- predict(boos, test, n.trees = 100)\n    test_mse[i] <- mean((test$Salary\
  \ - prboos) ^ 2)\n}\nplot(h, test_mse, type = \"l\", col = \"blue\", main = \"MSE\
  \ - Prediction\")\n```\n\n![](img/Fig14_07.jpg)\n\n```r\nh[which.min(test_mse)]\n\
  ```\n\n```\n# [1] 0.08\n```\n\n```r\nmin(test_mse)\n```\n\n```\n# [1] 0.18126\n\
  ```\n\n这里完整的但限制的网格搜索如下：\n\n```r\nlibrary(gbm)\n\nh <- seq(0.01, 0.3, 0.01)\nB <-\
  \ c(100, 300, 500, 750, 900)\nD <- 1:2\ngrid <- as.matrix(expand.grid(D, B, h))\n\
  \nmse <- c()\nsdmse <- c()\n\nfor(i in 1:nrow(grid)){\n  test_mse <- c()\n  for\
  \ (j in 1:20) {\n    try({\n      set.seed(j)\n      ind <- sample(nrow(df), nrow(df),\
  \ replace = TRUE)\n      train <- df[ind, ]\n      test <- df[-ind, ]\n      boos\
  \ <- gbm(Salary~., distribution =\"gaussian\", n.trees = 1000,\n              interaction.depth\
  \ = grid[i,1], shrinkage = grid[i,3], data = train)\n      prboos <- predict(boos,\
  \ test, n.trees = grid[i,2])\n      test_mse[j] <- mean((test$Salary - prboos) ^\
  \ 2)\n      },\n    silent = TRUE)\n  }\n  mse[i] <- mean(test_mse)\n  sdmse[i]\
  \ <- sd(test_mse)\n}\n\nmin(mse)\n```\n\n```\n# [1] 0.2108654\n```\n\n```r\ngrid[as.numeric(which.min(mse)),\
  \ ]\n```\n\n```\n#  Var1  Var2  Var3\n# 2e+00 9e+02 1e-02\n```\n\n### 14.4.2 并行处理的随机搜索\n\
  \n现在，我们将应用 Bergstra 和 Bengio (2012) 在“超参数优化的随机搜索”中提出的随机网格搜索。这篇论文表明，随机选择的试验比网格上的试验更有效。随机搜索是网格搜索的一种细微变。它不是搜索整个网格，而是评估网格上随机选择的部分。\n\
  \n为了描述随机搜索的性能，作者使用了期望的解析形式。找到目标的预期概率是 1.0 减去实验中 `T` 次试验每次错过目标的概率。如果目标相对于单位立方体的体积为\
  \ $(\\nu/V=0.01)$ 且有 `T` 次试验，那么找到目标的概率为：\n\n$1 - \\left( 1 - \\frac{v}{V} \\right)^{T}\
  \ = 1 - 0.99^{T}.$\n\n我们还使用 `doParallel` 和 `foreach()` 应用并行多核处理来加速网格搜索。\n\n\n\n\n\
  \n```r\nlibrary(gbm)\nlibrary(doParallel)\nlibrary(foreach)\n\nh <- seq(0.001, 0.25,\
  \ 0.001)\nB <- seq(100, 800, 20)\nD <- 1:4\ngrid <- as.matrix(expand.grid(D, B,\
  \ h))\n\n# 随机网格搜索\nconf_lev <- 0.95\nnum_max <- 5 # 我们通过数字定义\nn <- log(1-conf_lev)/log(1-num_max/nrow(grid))\n\
  set.seed(123)\nind <- sample(nrow(grid), nrow(grid)*(n/nrow(grid)), replace = FALSE)\n\
  comb <- grid[ind, ]\n\n# 多核循环设置\ntrials <- 1:nrow(comb)\nnumCores <- detectCores()\n\
  registerDoParallel(numCores)\n\n# 使用并行进程进行自助法\nlst <- foreach(k=trials, .combine=c,\
  \ .errorhandling = 'remove') %dopar% {\n  test_mse <- c()\n  for (j in 1:10) {\n\
  \    try({\n      set.seed(j)\n      ind <- sample(nrow(df), nrow(df), replace =\
  \ TRUE)\n      train <- df[ind, ]\n      test <- df[-ind, ]\n      boos <- gbm(Salary~.,\
  \ distribution =\"gaussian\", n.trees=1000,\n             interaction.depth =comb[k,1],\
  \ shrinkage = comb[k,3], data = train)\n      prboos <- predict(boos, test, n.trees\
  \ = comb[k,2])\n      test_mse[j] <- mean((test$Salary - prboos)²)\n      },\n \
  \   silent = TRUE)\n  }\nlist(c(k, mean(test_mse), sd(test_mse)))\n}\n\nstopImplicitCluster()\n\
  \nunlst  <- do.call(rbind, lst)\nresult <- cbind(comb[unlst[,1],], unlst)\nsorted\
  \  <- result[order(result[,5]), -4]\ncolnames(sorted) <- c(\"D\", \"B\", \"h\",\
  \ \"MSPE\", \"sd\")\nhead(sorted)\n```\n\n```text\n##      D   B     h      MSPE\
  \         sd\n## [1,] 2 360 0.024 0.2057671 0.05657079\n## [2,] 2 300 0.024 0.2060013\
  \ 0.05807494\n## [3,] 2 340 0.022 0.2061847 0.05827857\n## [4,] 2 340 0.023 0.2061895\
  \ 0.05823719\n## [5,] 2 320 0.023 0.2062056 0.05874694\n## [6,] 2 360 0.021 0.2062124\
  \ 0.05785775\n\n```\n\n你可以根据计算机的性能将 `for (j in 1:10)` 增加到 `for (j in 1:50)`。\n\n\
  ### 14.4.3 Boosting 与其他方法\n\n出于好奇，我们将 OLS（普通最小二乘法）加入这场竞赛。以下是一个可能的脚本：\n\n```r\nlibrary(ISLR)\n\
  library(randomForest)\nlibrary(rpart)\n\ndf <- Hitters[complete.cases(Hitters$Salary),\
  \ ]\ndf$Salary <- log(df$Salary)\n\n# 容器\nmse_cart <- c(0)\nmse_bag <- c(0)\nmse_rf\
  \ <- c(0)\nmse_boost <- c(0)\nmse_ols <- c(0)\n\nfor(i in 1:200){\n  set.seed(i)\n\
  \      ind <- sample(nrow(df), nrow(df), replace = TRUE)\n      train <- df[ind,\
  \ ]\n      test <- df[-ind, ]\n\n      OLS <- lm(Salary~., data = train)\n     \
  \ pols <- predict(OLS, test)\n\n      cart <- rpart(Salary~., data = train)\n  \
  \    pcart <- predict(cart, test)\n\n      bags <- randomForest(Salary ~., mtry\
  \ = 19, data = train)\n      pbag <- predict(bags, test)\n\n      rf <- randomForest(Salary\
  \ ~., data = train)\n      prf <- predict(rf, test)\n\n      boost <- gbm(Salary~.,\
  \ distribution =\"gaussian\", n.trees = 1000,\n                 data = train) #\
  \ 无网格搜索\n      pboost <- predict(boost, test, n.trees = 100)\n\n      mse_ols[i]\
  \ <- mean((test$Salary - pols)²)\n      mse_cart[i] <- mean((test$Salary - pcart)²)\n\
  \      mse_bag[i] <- mean((test$Salary - pbag)²)\n      mse_rf[i] <- mean((test$Salary\
  \ - prf)²)\n      mse_boost[i] <- mean((test$Salary - pboost)²)\n}\n\n# 自抽法结果\n\n\
  a <- matrix(c(mean(mse_cart),\n              mean(mse_bag),\n              mean(mse_rf),\n\
  \              mean(mse_boost),\n              mean(mse_ols)), 5, 1)\nrow.names(a)\
  \ <- c(\"mse_cart\", \"mse_bag\", \"mse_rf\", \"mse_boost\", \"mse_ols\")\na\n```\n\
  \n```text\n##                [,1]\n## mse_cart  0.3172687\n## mse_bag   0.220504\n\
  ## mse_rf    0.205702\n## mse_boost 0.245486\n## mse_ols   0.458240\n```\n\n```r\n\
  b <- matrix(c(sqrt(var(mse_cart)),\n              sqrt(var(mse_bag)),\n        \
  \      sqrt(var(mse_rf)),\n              sqrt(var(mse_boost)),\n              sqrt(var(mse_ols))),\
  \ 5, 1)\nrow.names(b) <- c(\"mse_cart\", \"mse_bag\", \"mse_rf\", \"mse_boost\"\
  , \"mse_ols\")\nb\n```\n\n```text\n##                 [,1]\n## mse_cart  0.0730876\n\
  ## mse_bag   0.062768\n## mse_rf    0.0597619\n## mse_boost 0.0592344\n## mse_ols\
  \   0.0690756\n```\n\n随机森林和 boosting 的性能相似。然而算法中没有对 boosting 进行调优。在之前的全网格搜索中，boosting\
  \ 是更好的选择。\n\n### 14.4.4 分类\n\n一个包含 400 家不同商店座椅销量的模拟数据集。我们将预测销量，如果销量大于 8，则二元变量为 1。更多细节请参见\
