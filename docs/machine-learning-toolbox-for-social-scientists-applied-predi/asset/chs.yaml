  来预测 `x[0]`，成为一个有偏的估计器会自动使其成为一个糟糕的预测器吗？为了回答这些问题，我们需要再次查看 MSE。由于我们的任务是预测，我们（通常）将其更名为**均方预测误差**（MSPE）。\n\
  \nMSPE = E[`x[0] − f̂`²] = E[`f + ε[0] − f̂`²] (3.3)\n\n类似于最佳估计器，具有最小 MSPE 的预测器将是我们备选预测器中的选择。让我们总结一下关于\
  \ MSPE 的重要事实：\n\n1. `x[0]` 是我们想要预测的，`f̂` 是预测器，可以是 `E(\\overline{X})`、`E(X)`、`E(\\\
  tilde{X})` 或其他预测器。\n2. `x[0] = μ[x] + ε[0]`，其中 `f = μ[x]`。因此，`E(x[0]) = f` 使得 `E(ε[0])\
  \ = 0`。\n3. `E(f) = f`。换句话说，常数的期望等于常数：`E(μ[x]) = μ[x]`。\n4. `Var(x[0]) = E([x[0]−E(x[0])²]\
  \ = E([x[0]−f]²) = E([μ[x]+ε[0]−μ[x]]²]) = E[ε[0]²] = σ²。通过 MSE 评估所有备选无偏 估计器的性能，实际上是在比较它们的方差并选取最小的一个。更具体地说，\n\
  \n$\\begin{matrix} {{\\\\textbf{MSE}\\\\left( \\hat{\\\\theta} \\\\right)} = \\\\\
  text{E}\\\\left\\\\lbrack \\\\left( \\\\hat{\\\\theta} - \\theta \\\\right)^{2}\
  \ \\\\right\\\\rbrack = \\\\text{E}\\\\left\\\\{ \\\\left( \\\\hat{\\\\theta} -\
  \ \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) + \\\\text{E}\\\\left( \\\\\
  hat{\\\\theta} \\\\right) - \\\\theta \\\\right)^{2} \\\\right\\\\}} \\\\\\\\ {=\
  \ \\\\text{E}\\\\left\\\\{ \\\\left( \\\\left\\\\lbrack \\\\hat{\\\\theta} - \\\\\
  text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) \\\\right\\\\rbrack + \\\\left\\\\\
  lbrack \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) - \\\\theta \\\\right\\\
  \\rbrack \\\\right)^{2} \\\\right\\\\}} \\\\\\\\ \\\\end{matrix}$ (3.1)\n\n$\\begin{matrix}\
  \ \\\\operatorname{} \\\\\\\\ \\\\end{matrix}{}\\\\begin{matrix} \\\\operatorname{}\
  \ \\\\\\\\ \\\\end{matrix}\\\\begin{matrix} {{\\\\\\textbf{MSE}\\\\left( \\hat{\\\
  \\theta} \\\\right)} = \\\\text{E}\\\\left\\\\lbrack \\\\left( \\\\hat{\\\\theta}\
  \ - E\\\\left( \\\\theta \\\\right) \\\\right.^{2} \\\\right\\\\rbrack + \\\\text{E}\\\
  \\left\\\\{ \\\\left\\\\lbrack \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right)\
  \ - \\\\theta\\\\rbrack^{2} \\\\right\\\\} \\\\right.} \\\\\\\\ {+ 2\\\\text{E}\\\
  \\left\\\\{ \\\\left\\\\lbrack \\\\hat{\\\\theta} - \\\\text{E}\\\\left( \\\\hat{\\\
  \\theta} \\\\right) \\\\right\\\\rbrack\\\\left\\\\lbrack \\\\text{E}\\\\left( \\\
  \\hat{\\\\theta} \\\\right) - \\\\theta \\\\right\\\\rbrack \\\\right\\\\}} \\\\\
  end \\\\end{matrix}{}{}\\\\begin{matrix} \\\\operatorname{} \\\\end \\\\end{matrix}$\
