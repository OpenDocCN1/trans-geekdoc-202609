  mean(MAUC2)\n```\n\n```r\n## [1] 0.8965776\n```\n\n我们可以通过 AUC 比较 kNN 和 LPM（以及 Logistic）（不是上面提供的那个），但\
  \ `k` 并不稳定。尽管我们可以采用 `k` 的平均值或众数，但我们可以通过改变循环顺序并在训练中使用自助法代替十折交叉验证来解决这个问题，这也会增加循环次数，从而增加运行时间。\n\
  \n\n\n\n\n在跳转到这个可能的解决方案之前，我们需要思考一下目前已经做了什么。我们训练了 `kNN`。也就是说，我们得到了超参数的值。我们应该使用调优后的\
  \ `kNN` 在最初预留的测试数据上对其进行测试。然而，正确的方法是使用多个循环，而不是像我们在这里只用了一个循环，并计算测试 `AUC` 进行比较，这与我们之前在\
  \ LPM 和 Logistic 中做的做法类似。我们在这里不会这样做，因为运行时间会非常长，顺便说一句，这说明了拥有快速“机器”以及高效算法的重要性。\n\n\
  调整我们的 `kNN` 应用的一个更稳定但时间更长的建议是使用自助法（bootstrapping method）。它运行多个循环，并取相同“k”的 `AUC`\
  \ 平均值。下面的示例每个“k”限制在运行 20 次。注意，自助法（参见第 37.5 节）是一个有放回抽样的过程（样本中的所有值被选中的概率相等，包括多次选中，因此某个值可能会重复）。\n\
  \n```\n#### Test/Train split - 如前所示！########\n# 然而，这里只执行了一次。\n# 应该在循环中执行多次\n\n\n\
  \nset.seed(123)\nsh <- sample(nrow(df), nrow(df), replace = FALSE)\nh <- 10\n\n\
  ind_test <- sh[1:(nrow(df)/h)]\nind_train <- sh[-ind_test]\n\n# 留出 10% 作为测试集\ntrdf\
  \ <- df[ind_train, ]\ntsdf <- df[ind_test, ]\n\n########## Bootstrapping ############\n\
  # 注意我们使用 `by=2` 来缩短运行时间\n# 如果有更快的机器，可以设置为 1。\n\nk <- seq(from = 3, to = 50, by =\
  \ 2)\nm <- 20 # 自助循环次数（可以更高，比如 50）\n\nMAUC <- c()\nk_opt <- c()\n\nfor(i in 1:length(k)){\n\
  \   AUC <- c()\n   for(l in 1:m){\n     # 这里是自助调优的核心\n     set.seed(l)\n     bind\
  \ <- sample(nrow(trdf), nrow(trdf), replace = TRUE)\n     uind <- unique(bind)\n\
  \     df_train <- df[uind, ]\n     df_val <- df[-uind, ]\n\n     model <- knn3(IncomeLevel\
  \ ~., data = df_train, k = k[i])\n     phat <- predict(model, df_val, type = \"\
  prob\")\n\n     #AUC\n     pred_rocr <- prediction(phat[,2], df_val$IncomeLevel)\n\
