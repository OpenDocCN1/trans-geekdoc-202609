  \      : num  42 65 59 55 38 78 71 67 76 76 ...\n##  $ Education  : num  17 10 12\
  \ 14 13 16 15 10 10 17 ...\n##  $ Urban      : Factor w/ 2 levels \"No\",\"Yes\"\
  : 2 2 2 2 2 1 2 2 1 1 ...\n##  $ US         : Factor w/ 2 levels \"No\",\"Yes\"\
  : 2 2 2 2 1 2 1 2 1 2 ...\n```\n\n```r\n# 将 SALES 转换为因子变量\ndf$Sales <- as.factor(ifelse(Carseats$Sales\
  \ <= 8, 0, 1))\ndff <- df[, -1]\n\n# 缩放和虚拟编码\ndff[,sapply(dff, is.numeric)] <- scale((dff[,\
  \ sapply(dff, is.numeric)]))\nddf <- model.matrix(~.-1, data= dff, contrasts.arg\
  \ =\n                       lapply(dff[, sapply(dff, is.factor)],\n            \
