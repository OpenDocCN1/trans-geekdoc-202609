  ```\n\n## A.2 基于导数的方法\n\n基于导数的方法之一是**牛顿-拉夫逊**（Newton-Raphson）方法。如果我们假设函数是可微且只有一个最小值（或最大值），就可以开发一种算法。首先，让我们看看牛顿-拉夫逊方法。这是微积分课程中一个著名的扩展。它用于寻找\
  \ `f`(*x*) = 0 的根。为了理解它，让我们看看图中所示的函数 *y* = *f*(*x*)：\n\n![](img/App01_01.jpg)\n\n\
  它在 *x* = *x[r]* 处有一个零点，这是未知的。为了找到它，我们从 *x[0]* 作为 `X[r]` 的初始估计开始。在点 (`x[0]`, f* (*x*[0]))\
  \ 处的切线与 x 轴的交点为 *x*[1]*。该线的斜率可以定义为\n\n$\\frac{y - f\\left( x_{0} \\right)}{x - x_{0}}\
  \ = f^{\\\\prime}\\left( x_{0} \\right)$\n\n因此，\n\n*y* − *f*(*x*[0]) = *f*^′(*x*[0])(*x*−*x*[0])\n\
  \n在切线与 x 轴的交点，*y* = 0 且 *x* = *x*[1]*。因此通过求解方程得到 *x*[1]*，我们：\n\n$x_{1} = x_{0} -\
  \ \\frac{f\\left( x_{0} \\right)}{f^{\\\\prime}\\left( x_{0} \\right)}$\n\n以及第二次近似：\n\
  \n$x_{2} = x_{1} - \\frac{f\\left( x_{1} \\right)}{f^{\\\\prime}\\left( x_{1} \\\
  right)}$\n\n通过多次迭代，我们可以找到解决方案。这里是示例：\n\n\n\n\n\n```\nnewton <- function(f, x0, tol\
  \ = 1e-5, n = 1000) {\n  require(numDeriv) # 用于计算 f'(x) 的包\n\n  for (i in 1:n) {\n\
  \    dx <- genD(func = f, x = x0)$D[1] # 一阶导数 f'(x0)\n    x1 <- x0 - (f(x0) / dx)\
  \ # 计算下一个值 x1\n    if (abs(x1 - x0) < tol) {\n      res <- paste(\"Root approximation\
  \ is \", x1, \" in \", i, \" iterations\")\n      return(res)\n    }\n    # 如果 Newton-Raphson\
  \ 方法尚未收敛，将 x1 设为 x0 并继续\n    x0 <- x1\n  }\n  print('Too many iterations in method')\n\
  }\n\nfunc2 <- function(x) {\n  x¹⁵ - 2\n}\nnewton(func2, 1)\n```\n\n```\n## [1]\
  \ \"Root approximation is  1.04729412282063  in  5  iterations\"\n```\n\n```\n#检查一下\n\
  paste(\"Calculator result: \", 2^(1/15))\n```\n\n```\n## [1] \"Calculator result:\
  \  1.04729412282063\"\n```\n\n牛顿法通常用于解决两个不同但相关的问题：\n\n1. 找到 `x` 使得 `f(x) = 0`（尝试用这种方法解决我们的保险问题）\n\
  2. 找到 `x` 使得 `g′(x) = 0`，或者找到使 `g(x)` 最小或最大的 `x`。\n\n当我们定义 `f(x) = g′(x)` 时，这两个问题之间的关系显而易见。因此，对于第二个问题，Newton–Raphson\
  \ 方法变为：\n\n$x_{n + 1} = x_{n} - \\frac{g^{\\prime}\\left( x_{n} \\right)}{g^{\\\
  prime\\prime}\\left( x_{n} \\right)}$\n\n这两个问题之间的联系在后文中定义。\n\n假设我们感兴趣确定随机变量 `X`\
  \ ~ `N(μ, σ)` 的参数\n\n$\\log(\\mathcal{L}(\\mu,\\sigma)) = - \\frac{n}{2}\\log\\\
  left( 2\\pi\\sigma^{2} \\right) - \\frac{1}{2\\sigma^{2}}\\underset{i = 1}{\\overset{n}{\\\
  Sigma}}\\left( x_{i} - \\mu \\right)^{2}$\n\n我们之前在 第 2 章 中见过它。但这次我们将使用 `dnorm()`，它可以计算正态变量的概率密度函数（pdf）。首先获取数据和对数似然：\n\
  \n```r\n# 创建一个正态变量样本\nset.seed(2019)\nX <- rnorm(100, 0, 1)\n\n# 该函数的对数似然。\n# 记得似然函数是\
  \ prod(dnorm())\nnormalLL <- function(prmt){\n  sum(dnorm(X, mean = prmt[1], sd\
  \ = prmt[2], log = TRUE))\n}\n\n# 尝试几个参数\nnormalLL(prmt = c(1,1.5))\n```\n\n```\n\
  ## [1] -176.078\n```\n\n```r\nnormalLL(prmt = c(2,1))\n```\n\n```\n## [1] -347.4119\n\
  ```\n\n```r\nnormalLL(prmt = c(mean(X),sd))\n```\n\n```\n## [1] -131.4619\n```\n\
  \n如你所示，最后一个是最好的。我们可以验证这一点，因为我们创建 `X` 时均值大约为 0，标准差为 1。现在我们将使用 Newton–Raphson 方法来计算最小化负对数似然的参数。\n\
  \n首先，让我们构建一个函数，分别在数值估计参数空间中均值和标准差任意点的函数斜率（一阶导数）。不要忘记对数似然是均值和标准差的函数。\n\n```r\n# 对均值的一阶偏导（数值）\n\
