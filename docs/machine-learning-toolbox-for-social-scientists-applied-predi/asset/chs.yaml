  firstSD <- function(p1, p2, change = 0.0001){\n  prmt <- c(p1, p2)\n  high <- normalLL(prmt\
  \ + change)\n  low <- normalLL(prmt - change)\n  slope <- (high-low)/2\n  return(slope)\n\
  }\n```\n*(此处根据原文提供的代码片段进行翻译)*\n\n让我们现在在 Newton–Raphson 方法中使用它们。\n\n与第一个类似，我们也可以开发一个计算二阶导数的函数。然而，与其使用我们自己的函数，不如使用\
  \ `numDeriv` 包中的 `grad()` 和 `hessian()`。\n\n\n\n\n$\\\\begin{matrix} {\\\\text{β}^{(t)}\
  \ = \\\\begin{bmatrix} \\\\beta\\_{0}^{(t)} \\\\\\\\ \\\\beta\\_{1}^{(t)} \\\\\\\
  \\ \\\\end{bmatrix}} \\\\\\\\ {\\\\text{u}^{(t)} = \\\\begin{bmatrix} u\\_{0}^{(t)}\
  \ \\\\\\\\ u\\_{1}^{(t)} \\\\\\\\ \\\\end{bmatrix} = \\\\begin{bmatrix} \\\\frac{\\\
  \\partial\\\\ell\\\\left( {\\\\beta^{(t)} \\\\mid y;x} \\\\right)}{\\partial\\\\\
  beta\\_{0}} \\\\\\\\ \\\\frac{\\\\partial\\\\ell\\\\left( {\\\\beta^{(t)} \\\\mid\
  \ y;x} \\\\right)}{\\partial\\\\beta\\_{1}} \\\\\\\\ \\\\end{bmatrix} = \\\\begin{bmatrix}\
  \ {\\\\sum\\\\limits\\\\_{i = 1}^{n}\\\\left( {y\\_{i} - p\\_{i}^{(t)}} \\\\right)}\
  \ \\\\\\\\ {\\\\sum\\\\limits\\\\_{i = 1}^{n}x\\_{i}\\\\left( {y\\_{i} - p\\_{i}^{(t)}}\
  \ \\\\right)} \\\\\\\\ \\\\end{bmatrix}} \\\\\\\\ \\\\end{matrix}$\n\n其中，\n\n$p\\\
  _{i}^{(t)} = \\\\frac{\\exp\\\\left( \\\\beta\\_{0}^{(t)} + x\\_{1}\\\\beta\\_{1}^{(t)}\
  \ \\\\right)}{1 + \\\\exp\\\\left( \\\\beta\\_{0}^{(t)} + x\\_{1}\\\\beta\\_{1}^{(t)}\
  \ \\\\right)}$\n\n$H^{(t)}$ 可以被视为 $u(\\cdot)$ 的雅可比矩阵，\n\n$\\\\text{H}^{(t)} = \\\
  \\left\\\\lbrack \\\\begin{array}{ll} \\\\frac{\\\\partial u\\_{0}^{(t)}}{\\partial\\\
  \\beta\\_{0}} & \\\\frac{\\\\partial u\\_{0}^{(t)}}{\\partial\\\\beta\\_{1}} \\\\\
  \\\\ \\\\frac{\\\\partial u\\_{1}^{(t)}}{\\partial\\\\beta\\_{0}} & \\\\frac{\\\\\
  partial u\\_{1}^{(t)}}{\\partial\\\\beta\\_{1}} \\\\\\\\ \\\\end{array} \\\\right\\\
  \\rbrack$\n\n让我们模拟数据并使用上述的顿–Raphson 方法进行求解。\n\n```r\nrm(list=ls())\n\n# 模拟数据\nset.seed(1)\n\
  n <- 500\nX = rnorm(n) # 这是我们的变量 x\nz = -2 + 3 * X\n\n# 概率由逻辑函数定义\np = 1 / (1 +\
