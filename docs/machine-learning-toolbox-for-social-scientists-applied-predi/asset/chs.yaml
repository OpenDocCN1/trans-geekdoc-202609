  \ +\n  labs(title = \"Box-Cox 变换\")\n```\n(images/Fig21_02)\n\n## 21.4 平稳性\n\n平稳性是时间序列分析中的一个关键属性。我们使用许多检验来检查序列是否平稳，例如\
  \ Dickey-Fuller (ADF) 和 KPSS 。\n\n让我们首先测试数据的水平平稳性。\n\n```r\nlevel <- toronto %>%\n\
  \  features(cases)\n```\n(images/Fig21_03)\n\n接下来，我们测试一阶差分数据的平稳性。\n\n```r\nfdiff\
