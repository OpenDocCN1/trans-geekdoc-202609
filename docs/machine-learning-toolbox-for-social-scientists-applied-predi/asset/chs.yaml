  ```r\nlibrary(ROCR)\n\nAUC <- c()\nt = 100\n\nfor (i in 1:t) {\n  set.seed(i)\n\
  \  shuffle <- sample(nrow(data), nrow(data), replace = FALSE)\n  k <- 5\n  testind\
  \ <- shuffle[1:(nrow(data) / k)]\n  trainind <- shuffle[-testind]\n  trdf <- data[trainind,]\
  \ #80% 的数据\n  tsdf <- data[testind,] # 留出 20%的数据\n\n  #逻辑回归\n  model2 <- glm(Y ~\
  \ ., data = trdf, family = \"binomial\")\n  # 注意 \"response\"。它预测 phat。另一个选项是 \"\
  class\"\n  # 它通过 0.5 预测 yhat\n  phat <- predict(model2, tsdf, type = \"response\"\
  )\n  phat[phat < 0] <- 0\n  phat[phat > 1] <- 1\n\n  # ROC & AUC (来自 ROCR)\n  phat_df\
  \ <- data.frame(phat, \"Y\" = tsdf$Y)\n  pred_rocr <- prediction(phat_df[, 1], phat_df[,\
  \ 2])\n\n  auc_ROCR <- performance(pred_rocr, measure = \"auc\")\n  AUC[i] <- auc_ROCR@y.values[[1]]\n\
  }\n\nplot(AUC, col = \"grey\")\nabline(a = mean(AUC), b = 0, col = \"red\")\n```\n\
  \n![](img/Fig11_04.jpg)\n\n```r\nmean(AUC)\n```\n\n```r\n## [1] 0.908179\n```\n\n\
  ```r\nsqrt(var(AUC))\n```\n\n```r\n## [1] 0.003593404\n```\n\nLPM 和 Logistic 方法都是线性分类器。我们可以手动添加多项式和交互项来捕捉数据中可能的非线性，但这将是一项无法完成的工作，因为特征数量将指数级增长。这引出了我们的非参数分类器：kNN。\n\
  \n## 11.3 kNN\n\n我们将通过选择 `k` 来训练 kNN，并使用 AUC 作为选择 `k` 的性能标准。\n\n### 11.3.1 kNN 十折交叉验证\n\
  \n我们将通过选择 `k` 来训练 kNN，并使用 AUC 作为选择 `k` 的性能标准。R 中有几个包用于 kNN 应用：来自 `class` 包的 `knn()`\
  \ 和 `caret` 包中的 `knn3()`。我们将使用 `caret` 包中的 `knn3()`。由于 kNN 使用距离，我们应该对数值变量进行缩放，使它们的幅度处于相同的尺度上。\n\
  \n```r\nrm(list = ls())\n\ndata <- read.csv(\"adult_train.csv\", header = FALSE)\n\
  varNames <- c(\"Age\", \"WorkClass\", \"fnlwgt\", \"Education\", \"EducationNum\"\
  , \"MaritalStatus\", \"Race\", \"Sex\", \"CapitalGain\", \"CapitalLoss\", \"HoursPerWeek\"\
  , \"NativeCountry\")\nnames(data) <- varNames\n# 丢单个观测值\nind <- which(df$NativeCountry==\"\
  Netherlands\")\ndf <- data[-ind, ]\n\n# 缩放数值变量\nfor(i in 1:ncol(df)) if(is.integer(df[,i]))\
  \ df[,i] <- scale(df[,i])\n\n# 将字符变量转换为因子\ndf[sapply(df, is.character)] <- lapply(sapply(df,\
  \ \"character\"), factor)\nstr(df)\n```\n\n```r\n## 'data.frame': 32560 obs.\n##$\
  \ Age: num [1:32560] 0.0307 0.8371 -0.0427 0.057 ... (scaled:center, scaled:scale)\n\
  ##$ WorkClass: Factor w/ 9 levels \"?\",\"Private\",\"State-gov\",\"Local-gov\"\
  ,\"Self-emp\",\"Never-worked\",\"Other-gov\",\"Foreign\"\n##$ fnlwgt: num [1:32560]\
  \ -1.064 -0.009 0.245 0.426 ... (scaled:center, scaled:scale)\n##$ Education: Factor\
  \ w/ 16 levels \"10th\",\"11th\",\"12th\",\"13th\",\"14th\",\"15th\",\"5th\",\"\
  6th\",\"7th\",\"8th\",\"9th\",\"HS-grad\",\"Assoc deg\",\"B-grad\",\"Masters\",\"\
  Prof-drop\"\n##$ EducationNum: num [1:32560] 1.13 -0.42 -1.13 ... (scaled:center,\
  \ scaled:scale)\n##$ MaritalStatus: Factor w/ 7 levels \"Divorced\",\"Married-spouse\"\
  ,\"Married-civil\",\"Separated\",\"Never married\",\"Widowed\",\"Husbands\"\n##$\
  \ Race: Factor w/ 5 levels \"Amer-Indian\",\"Asian\",\"Black\",\"Other\",\"White\"\
  \n##$ Sex: Factor w/ 2 levels \"Female\",\"Male\"\n##$ CapitalGain: num [1:32560]\
