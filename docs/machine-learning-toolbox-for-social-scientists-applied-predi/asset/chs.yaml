  \ $x$ 和 $d = \\frac{|ax_{1,0} + bx_{2,0} + c|}{\\sqrt{a^{2} + b^{2}}}$。查看维基百科上的多个证明：[`en.wikipedia.org/wiki/Distance`](https://en.wikipedia.org/wiki/Distance)\
  \ 从点到线。\n3. 参见 *统计学习方法* (Elements of Statistical Learning)，Hastie et al. (2009,\
  \ p. 133)。\n\n## 16 神经网络\n\nDOI: [10.1201/9781003381501-21](https://doi.org/10.1201/9781003381501-21)\n\
  \n神经网络（ANN）是一种受大脑结构和启发的机器学习模型。它们由被称为人工神经元或节点的相互连接单元组成，并组织成层。神经网络的概念可以追溯到 40 年代，当时\
  \ Warren McCulloch 和 Walter Pitts (1943) 提出了作为简单阈值逻辑单元的神经元模型。在 50 年代和 60 年代，研究人员开始开发更复杂的神经元模型，并探索神经网络用于模式识别和机器翻译等任务。然而，由于当时计算能力的限制，这些早期努力很大程度上没有成功。\n\
  \n直到 80 年代和 90 年代，得益于计算机技术的进步以及更大、更多样的数据集的可用，神经网络的发展取得了显著进展。1986 年，Geoffrey Hinton\
  \ 和他的团队开发了反传播算法，该算法通过允许更高效、更准确地训练神经网络彻底改变了该领域。从那时起，ANN 被广泛的任务，包括图像和语音识别、自然语言处理，甚至下象棋和围棋等游戏。它们还被应用于金融、医疗和交通等多个领域。今天，ANN\
  \ 是机器学习领域的一个重要工具，并且仍然是一个活跃的研发领域。\n\n多年来，神经网络领域取得了许多影响力的工作。以下是神经网络历史上一些重要且具有影响力的工作示例：\n\
  \n*   **感知器**由 Frank Rosenblatt (1958) 提出：这篇论文引入了感知器的概念，它是一种可以训练以识别数据中模式的 ANN。感知器成为机器学习领域的一个基石概念，是开发更先进\
  \ ANN 的关键催化剂。\n*   **反传播**由 Rumelhart, Hinton 和 Williams (1986) 发表：这篇论文引入了反传播算法，这是一种训练\
  \ ANN 的方法，允许它们随时间进行学习和适应。反传播算法今天仍被广泛使用，它是 ANN 在许多应用中成功的关键因素。\n*   **LeNet-5**由 Yann\
  \ LeCun 等 (1998) 发表：这篇论文描述了 LeNet-5 的开发，一种用于识别手写数字的 ANN。LeNet-5 是 ANN 在图像识别领域的首次成功应用之一，为该领域的后续进展奠定了基础。\n\
  *   **深度学习**由 Yann LeCun, Yoshua Bengio 和 Geoffrey Hinton (2015) 发表：这篇论文对深度学习领域进行了全面的回顾，深度学习是一种使用许多相互连接神经元层来处理数据的\
  \ ANN 类型。它对深度学习的发展产生了重大影响，并推动了该领域的许多最新进展。\n\n\n\n\n\n# 16.1 神经网络 - 核心思想\n\n支持向量机和神经网络都采用了某种的数据变换，将它们移动到高维空间。核函数对\
  \ SVM 所起的作用，正是隐藏层对神经网络所起的作用。\n\n让我们从一个单输入（协变量）的预测模型开始。最简单的模型可以是线性模型：\n\n$y \\approx\
  \ \\alpha + \\beta x$\n\n由于这个模型可能相当局限性，我们可以通过多项式回归获得更灵活的模型：\n\n$y \\approx \\alpha\
  \ + \\beta_{1}x + \\beta_{2}x^{2} + \\beta_{3}x^{3} + \\cdots = \\alpha + \\sum_{m\
  \ = 1}^{M}\\beta_{m}x^{m}$\n\n多项式回归基于固定组件（或基）：$x, x², x³, \\dots, x^M$。\n\n人工神经网络将这些固定组件替换为可调整的组件或基：$f(\\\
  alpha[1] + \\delta[1]x)$, $f(\\alpha[2] + \\delta[2]x), \\dots, f(\\alpha[M] + \\\
  delta[M]x)$。我们可以将第一个简单的 ANN 视为线性组合的非线性函数：\n\n$y \\approx \\alpha + \\beta_{1}f\\\
  left( \\alpha_{1} + \\delta_{1}x \\right) + \\beta_{2}f\\left( \\alpha_{2} + \\\
  delta_{2}x \\right) + \\beta_{3}f\\left( \\alpha_{3} + \\delta_{3}x \\right) + \\\
  cdots = \\alpha + \\sum_{m = 1}^{M}\\beta_{m}f\\left( \\alpha_{m} + \\delta_{m}x\
  \ \\right)$\n\n其中 $f(\\cdot)$ 是**激活**函数—— 一个固定的非线性函数。激活函数的常见示例有：\n\n- **logistic**（或\
  \ sigmoid）函数：$f(x) = \\frac{1}{1 + e^{- x}}$\n- **双曲正切**函数：$f(x) = \\tanh(x) = \\\
  frac{e^{x} - e^{- x}}{e^{x} + e^{- x}}$\n- 修正线性单元 (**ReLU**)：$f(x) = \\max(0, x)$\n\
  \n激活函数的完整列表可以在 Wikipedia 上找到。\n\n让我们考虑一个真实的（模拟）样本：\n\n```r\nn <- 200\nset.seed(1)\n\
  x <- sort(runif(n))\ny <- sin(12*(x + 0.2))/(x + 0.2) + rnorm(n)/2\ndf <- data.frame(y,\
  \ x)\nplot(x, y, main=\"Simulated data\",  col= \"grey\")\n```\n\n![](img/Fig16_01.jpg)\n\
  \n我们可以拟合一个 $M = 3$ 的多项式回归：\n\n```r\nols <- lm(y ~ x + I(x²) + I(x³))\nplot(x, y,\
  \ main=\"Polynomial: M = 3\",  col= \"grey\")\nlines(x, predict(ols), col=\"blue\"\
  , lwd = 3)\n```\n\n![](img/Fig16_02.jpg)\n\n现在，我们可以将该线视为固定组件的加权和：$\\alpha[1]+\\\
  beta[1]x+\\beta[2]x²+\\beta[3]x³$。\n\n```r\n# Parts\nfirst <- ols$coefficients[2]*x\n\
  second <- ols$coefficients[3]*x²\nthird <- ols$coefficients[4]*x³\nyhat <- ols$coefficients[1]\
  \ + first + second + third\n\n# Plots\npar(mfrow=c(1,4), oma = c(0,0,2,0))\nplot(x,\
  \ first, ylab = \"y\", col = \"pink\", main = \"x\")\nplot(x, second, ylab = \"\
  y\", col = \"orange\", main = expression(x²))\nplot(x, third, ylab = \"y\", col\
  \ = \"green\", main = expression(x³))\nplot(x, y, ylab=\"y\", col = \"grey\",\n\
  \     main = expression(y == alpha + beta[1]*x + beta[2]*x² + beta[3]*x³))\nlines(x,\
  \ yhat, col = \"red\", lwd = 3)\nmtext(\"Fixed Components\",\n      outer=TRUE,\
  \ cex = 1.5, col=\"olivedrab\")\n```\n\n![](img/Fig16_03.jpg)\n\n人工神经网络将多项式回归中的固定组件替换为更灵活的组件\
  \ $f(\\alpha[1] + \\delta[1]x)$, $f(\\alpha[2] + \\delta[2]x), \\dots, f(\\alpha[M]\
  \ + \\delta[M]x)$。它们可以通过可调的内部参数进行调整。它们可以表达多种形状，而不仅仅是一个（固定的）形状。因此，可调整组件能够用更组件（较小的\
  \ $M$）捕捉复杂的模型。\n\n让我们将多项式回归中的这些固定组件 $x, x², x³$ 替换为 $f(\\alpha[1] + \\delta[1]x)$,\
  \ $f(\\alpha[2] + \\delta[2]x)$, $f(\\alpha[3] + \\delta[3]x)$。\n\n以下代码演示了具有任意参数的简单\
  \ ANN 相比三次回归模型捕捉底层信号的能力。它定义了带有 sigmoid 激活函数的 `ann` 函数，包含三个节点、三个任意参数 `a`、`b` 以及一个截距\
  \ `int`。对于每个节点，代码使用 `a` 和 `b` 计算加权输入 `z`，然后应用 sigmoid 函数得到 `sig`。输出乘以 `beta`。最终输出\
  \ `yhat` 是截距和所有节点加权输出的和。\n\n```r\na = c(1.5, 9, 3)\nb = c(-20,-14,-8)\nbeta = c(15,25,-40)\n\
  ann <- function(a, b, int) {\n  #1st sigmoid\n  a1 = a[1]\n  b1 = b[1]\n  z1 = a1\
  \ + b1 * x\n  sig1 = 1 / (1 + exp(-z1))\n\n  #2nd sigmoid\n  a2 = a[2]\n  b2 = b[2]\n\
  \  z2 = a2 + b2 * x\n  sig2 = 1 / (1 + exp(-z2))\n\n  #3rd sigmoid\n  a3 = a[3]\n\
  \  b3 = b[3]\n  z3 = a3 + b3 * x\n  sig3 = 1 / (1 + exp(-z3))\n\n  yhat = int +\
  \ beta[1] * sig1 + beta[2] * sig2 + beta[3] * sig3\n  return(yhat)\n}\nyhat <- ann(a,\
  \ b, int)\n\nplot(x, y, main = \"ANN: 3\", ylim = c(-5, 15))\nlines(x, yhat, col\
  \ = \"red\", lwd = 3)\n```\n\n![](img/Fig16_04.jpg)\n\n结果图展示了 ANN 相比回归模型拟合数据的能力。下一节“反向传播”将向如何获取简单\
  \ ANN 的正确参数。现在我们使用 `neuralnet` 获取。\n\n```r\nlibrary(neuralnet)\nset.seed(2)\nnn\
  \ <- neuralnet(y ~ x, data = df, hidden = 3, threshold = 0.05)\nyhat <- compute(nn,\
  \ data.frame(x))$net.result\nplot(x, y, main=\"Neural Networks: 3\")\nlines(x, yhat,\
  \ col=\"red\", lwd = 3)\n```\n\n![](img/Fig16_05.jpg)\n\n为什么神经网络在前面的例子中表现比多项式回归更好？同样可调整组件能够捕捉复杂的模型。让我们深入研究。这里是权重结构：\n\
  \n$y \\approx \\sum_{m = 1}^{3}\\beta_{m}f\\left( \\alpha_{m} + \\delta_{m}x \\\
  right) = \\alpha + \\beta_{1}f\\left( \\alpha_{1} + \\delta_{1}x \\right) + \\beta_{2}f\\\
  left( \\alpha_{2} + \\delta_{2}x \\right) + \\beta_{3}f\\left( \\alpha_{3} + \\\
  delta_{3}x \\right)$\n\n```r\nnn$weights\n```\n\n```r\n[[1]]\n[[1]][[1]]\n     \
  \      [,1]      [,2]      [,3]\n[1,]   1.26253   6.59977  2.504890\n[2,] -18.95937\
  \ -12.24665 -5.700564\n\n[[1]][[2]]\n            [,1]\n[1,]   2.407654\n[2,]  13.032092\n\
  [3,]  19.923742\n[4,] -32.173264\n```\n\n```r\nplot(nn, rep = \"best\")\n```\n\n\
  ![](img/Fig16_06.jpg)\n\n我们使用了 sigmoid (logistic) 激活函数\n\n$\\begin{aligned} \\text{节点~1:}~~~f(x)\
  \ = \\frac{1}{1 + e^{- x}} = \\frac{1}{1 + e^{- (1.26253 - 18.95937x)}}} & \\\\\
  \ \\text{节点~2:}~~~f(x) = \\frac{1}{1 + e^{- x}} = \\frac{1}{1 + e^{- (6.599773 -\
  \ 12.24665x)}}} & \\\\ \\text{节点~3:}~~~f(x) = \\frac{1}{1 + e^{- x}} = \\frac{1}{1\
  \ + e^{- (2.504890 - 5.700564x)}}} & \\end{aligned}$\n\n我们可以通过使用我们的数据 $x$ 计算每个激活函数的值：\n\
  \n```r\nX <- cbind(1, x)\n\n# 1st 节点\nn1 <- nn$weights[[1]][[1]][,1]\nf1 <- nn$act.fct(X%*%n1)\n\
  \n# 2nd 节点\nn2 <- nn$weights[[1]][[1]][,2]\nf2 <- nn$act.fct(X%*%n2)\n\n# 3rd 节点\n\
  n3 <- nn$weights[[1]][[1]][,3]\nf3 <- nn$act.fct(X%*%n3)\n\npar(mfrow=c(1,3), oma\
  \ = c(0,0,2,0))\nplot(x, f1, col = \"pink\", main = expression(f(alpha[1] + beta[1]*x)))\n\
  plot(x, f2, col = \"orange\", main = expression(f(alpha[2] + beta[2]*x)))\nplot(x,\
  \ f3, col = \"green\", main = expression(f(alpha[3] + beta[3]*x)))\n```\n\n![](img/Fig16_07.jpg)\n\
  \n现在我们将从这些节点到“汇点”：\n\n$\\begin{matrix} \\frac{1}{1 + e^{- (1.26253 - 18.95937x)}}}\
  \ \\times 13.032092 \\\\ \\frac{1}{1 + e^{- (6.599773 - 12.24665x)}}} \\times 19.923742\
  \ \\\\ \\frac{1}{1 + e^{- (2.504890 - 5.700564x)}}} \\times - 32.173264 \\end{matrix}$\n\
  \n最后，我们将这些加上一个“偏置”，即截距：\n\n\n\n\n\n$\\\\begin{matrix} {2.407654 +} \\\\\\\\ {\\\\\
  frac{1}{1 + e^{- (1.26253 - 18.95937x)}} \\\\times 13.032092 +} \\\\\\\\ {\\\\frac{1}{1\
  \ + e^{- (6.599773 - 12.24665x)}} \\\\times 19.923742 +} \\\\\\\\ {\\\\frac{1}{1\
  \ + e^{- (2.504890 - 5.700564x)}} \\\\times - 32.173264} \\\\\\\\ \\\\end{matrix}$\n\
  \n以下是结果：\n\n```r\n# 从节点到汇点 (Y)\nf12 <- f1*nn$weights[[1]][[2]][2]\nf22 <- f2*nn$weights[[1]][[2]][3]\n\
  f23 <- f3*nn$weights[[1]][[2]][4]\n\n## 结果\nyhat <- nn$weights[[1]][[2]][1] + f12\
  \ + f22 + f23\nplot(x, y, main=\"ANN: M = 3\")\nlines(x, yhat, col=\"red\", lwd\
  \ = 3)\n```\n\n![](img/Fig16_08.jpg)\n\n### 16.2 反向传播\n\n1986 年，Rumelhart 等人发现了一种使用反向传播算法训练神经网络的方法。今天，我们将其称为使用反向模式自动微分的梯度下降。反向传播是一种通过调整网络的权重和偏置来最小化代价函数，从而训练神经网络的算法。假设我们有如下所示简单的神经网络：\n\
  \n![](img/Fig16_09.jpg)\n\n第一层是源层（包含 `X`）。第二层被称为隐藏层，有三个“神经元”，每个神经元都有一个激活函数（`A`）。最后一层是“汇点”或输出层。首先，让我们定义一个损失函数\
  \ MSPE：\n\n$\\\\text{MSPE} = \\frac{1}{n}\\\\underset{i = 1}{\\\\overset{n}{\\\\\
  Sigma}}\\\\left( y\\_{i} - ŷ \\\\right)^{2}$\n\n我们想要解决：\n\n$\\\\omega^{\\\\star}\
  \ = {argmin}\\\\left\\\\{ \\\\frac{1}{n}\\\\underset{i = 1}{\\\\overset{n}{\\\\\
  Sigma}}\\\\left( y\\_{i} - ŷ \\\\right)^{2} \\\\right\\}$\n\n为了误差相对于权重 `w` 或偏置 `b`\
  \ 的梯度，我们使用链式法则：\n\n$\\\\frac{\\partial\\\\text{MSPE}}{\\partial w} = \\frac{\\partial\\\
  \\text{MSPE}}{\\partial ŷ}\\\\frac{\\partial ŷ}{\\\\partial z}\\\\frac{\\partial\
  \ z}{\\partial w}$\n\n记住，\n\n$ŷ = f\\\\left( x \\\\right) = \\\\frac{1}{1 + e^{-\
  \ z}} = \\\\frac{1}{1 + e^{- (\\\\alpha + wx)}},$\n\n其中 `w` 是网络中的权重或偏置。通过对网络中的每个权重和偏置重复此过程，我们可以计算误差梯度并用它来调整权重和偏置，以最小化神经网络的误差。这可以通过梯度下降来实现（参见附录\
  \ 1），梯度下降是一种优化可微目标函数的迭代方法，通常是通过最小化它来实现。\n\n然而，对于多层 ANN，我们使用随机梯度下降 (SGD)，这是一种更快的方法，它通过在当前位置函数梯度的反方向上迈小步来迭代地最小化损失函数。梯度是使用随机选择的数据集而不是整个数据集计算的，这就是被称为“随机”的原因。SGD\
  \ 的主要优势之一是它可以高效地实现，并能够很好地处理大型数据集。\n\n梯度下降将在第 38 章中详细解释。我们在这里使用一个非常简单的梯度下降算法来解决我们的\
  \ ANN 问题作为示例：\n\n```r\nn <- 200\nset.seed(1)\nx <- sort(runif(n))\nY <- sin(12*(x\
  \ + 0.2))/(x + 0.2) + rnorm(n)/2\ndf <- data.frame(Y, x)\nplot(x, Y, main=\"Simulated\
  \ data\", col=\"grey\")\n#starting points\nset.seed(234)\nalpha <- runif(1, 0, 1)\n\
  beta1 <- runif(1, 0, 1)\nbeta2 <- runif(1, 0, 1)\nbeta3 <- runif(1, 0, 1)\n#gradient\n\
  converged <- F\niterations <- 0\nwhile (converged == F) {\n  # Gradients\n  z1 <-\
  \ a1 + b1*x\n  z2 <- a2 + b2*x\n  z3 <- a3 + b3*x\n  sig1 <- 1/(1 + exp(-z1))\n\
  \  sig2 <- 1/(1 + exp(-z2))\n  sig3 <- 1/(1 + exp(-z3))\n\n  yhat <- alpha + beta1\
  \ * sig1 + beta2 * sig2 + beta3 * sig3\n\n  MSE_new <- sum((Y - yhat) ^ 2) / n\n\
  \  MSE <- c(MSE, MSE_new)\n  d <- tail(abs(diff(MSE)), 1)\n\n  if (round(d, 12)\
  \ == 0) converged <- T\n  iterations <- iterations + 1\n  if (iterations > 2000000)\
  \ converged <- T\n  # ... (更新逻辑根据源码结构继续)\n}\n```\n*（注：提供的源文本有严重的代码碎片/与注释交织。我已经清理了逻辑以遵循标准的\
  \ R 结构，同时保留了文中使用的变量）。*\n\n## 16.3 神经网络 - 多输入\n\n对于一组协变量 `X` = (1, `x[1]`, `x[2]`,\
  \ `. . .`, `x[k]`），我们有\n\n$\\\\begin{array}{rcrc} y &\\\\approx \\\\alpha + \\\\\
  underset{m = 1}{\\overset{M}{\\\\Sigma}}\\\\beta\\_{m}f\\\\left( \\\\alpha\\\\_{m}\
  \ + \\\\textbf{X}\\\\delta\\_{m} \\\\right) & & \\\\qquad \\\\\\\\ & {= \\\\alpha\
  \ + \\\\beta\\\\_{1}f\\\\left( \\\\alpha\\\\_{1} + \\\\delta\\\\_{11}x\\\\_{1i}\
  \ + \\\\delta\\\\_{12}x\\\\_{2i}\\\\cdots + \\\\delta\\\\_{1k}x\\\\_{ki} \\\\right)\
  \ + \\\\ldots\\\\qquad} & & \\\\qquad \\\\\\\\ & {+ \\\\beta\\\\_{M}f\\\\left( \\\
  \\alpha\\\\_{M} + \\\\delta\\\\_{M1}x\\\\_{1i} + \\\\delta\\\\_{M2}x\\\\_{2i}\\\\\
  cdots + \\\\delta\\\\_{Mk}x\\\\_{ki} \\\\right)\\\\qquad} & & \\\\qquad \\\\\\\\\
  \ \\\\end{array}$\n\n通过添加线性组合的非线性函数（当 `M >` 1 时），我们已经看到可以捕获非线性。有了多个特征，我们现在可以捕获交互作用，从而获得更灵活的模型。这可以在下面的图中蓝色和橙色的箭头所示：\n\
  \n让我们使用 Mincer 方程和来自 `AER` 包的数据集（SPS 1985 - 源自美国人口普查局 1985 年 5 月当前人口调查的横截面数据）进行应用。\n\
  \n\n\n\n在我们开始之前，有几个重要的预处理步骤需要完成。首先，当数据未经过缩放时，`ANN` 的效率很低。原因是反向传播。由于 `ANN` 使用 `gradient\
  \ descent`，特征之间的不同尺度会导致不同的步长。在将数据输入模型之前对其进行缩放，可以使 `gradient descent` 中的步骤对所有特征以相同的速率更新。其次，应该通过虚拟变量编码（dummy-coding）将指示预测变量包含在输入矩阵中最后，需要构建模型公式以初始化算法。让我们来看看下面所有的预处理步骤：\n\
  \n![](img/Fig16_11.jpg)\n\n```\nlibrary(AER)\ndata(\"CPS1985\")\n\ndf <- CPS1985\n\
  \n# Scaling and Dummy coding\ndf[,sapply(df, is.numeric)] <- scale((df[, sapply(df,\
  \ is.numeric)]))\nddf <- model.matrix(~.-1, data= df, contrasts.arg =\n        \
  \               lapply(df[,sapply(df, is.factor)],\n                           \
  \   contrasts, contrasts = FALSE))\n\nddf <- as.data.frame(ddf)\n\n# formula to\
  \ pass on ANN and lm()\nw.ind <- which(colnames(ddf)==\"wage\")\nfrmnn <- as.formula(paste(\"\
  wage~\", paste(colnames(ddf[-w.ind]), collapse='+')))\nfrmln <- as.formula(paste(\"\
  wage~\", \"I(experience²)\", \"+\",\n                          paste(colnames(ddf[-w.ind]),\
  \ collapse = \"+\")))\n\n# Bootstrapping loops instead of CV\nmse.test <- matrix(0,\
  \ 10, 5)\nfor(i in 1:10){\n\n  set.seed(i+1)\n  trainid <- unique(sample(nrow(ddf),\
  \ nrow(ddf), replace = TRUE))\n  train <- ddf[trainid,]\n  test <- ddf[-trainid,]\n\
  \n  # Models\n  fit.lm <- lm(frmln, data = train)\n  fit.nn <- neuralnet(frmnn,\
  \ data = train, hidden = 1, threshold = 0.05,\n                      linear.output\
  \ = FALSE)\n  fit.nn2 <- neuralnet(frmnn, data = train, hidden = 2, threshold =\
  \ 0.05)\n  fit.nn3 <- neuralnet(frmnn, data = train, hidden = 3, threshold = 0.05)\n\
  \  fit.nn4 <- neuralnet(frmnn, data = train, hidden = 3, threshold = 0.05,\n   \
  \                    act.fct = \"tanh\", linear.output = FALSE)\n\n  # Prediction\
  \ errors\n  mse.test[i,1] <- mean((test$wage - predict(fit.lm, test))²)\n  mse.test[i,2]\
  \ <- mean((test$wage - predict(fit.nn, test))²)\n  mse.test[i,3] <- mean((test$wage\
  \ - predict(fit.nn2, test))²)\n  mse.test[i,4] <- mean((test$wage - predict(fit.nn3,\
  \ test))²)\n  mse.test[i,5] <- mean((test$wage - predict(fit.nn4, test))²)\n}\n\n\
  colMeans(mse.test)\n```\n\n```\n## [1] 0.7296417 0.8919442 0.9038211 1.0403616 0.8926576\n\
  ```\n\n单凭这项实验表明，`linear` Mincer 方程（带有 `I(expreince²)`）比 `ANN` 好得多的预测器。随着 `ANN` 复杂度随神经元的增加而提高，`ANN`\
  \ 过拟合的概率也会增加，这在我们的实验中正是如此。通常，线性回归对于变量之间存在强线性关系的简单、低维数据集可能是一个很好的选择，而 `ANNs` 可能更适用于变量之间存在非线性关系的复杂、高维数据集。\n\
  \n在用 `ANNs` 进行预测任务时，过拟合可能是一个关注的问题。当模型过于复杂且相对于训练数据量，具有过多参数时，就会发生过拟合，导致拟合的是训练数据中的噪声而非底层模式。结果是模型在训练数据上表现良好，但在新的、未见过的数据上表现很差。缓解\
  \ `ANNs` 过拟合的一种方法是使用正则化等技术，它对模型施加约束以防止其变得过于复杂。另一种方法是使用早停等技术，它涉及在模型开始过拟合训练数据时中断训练过程。\n\
  \n### 16.4 深度学习\n\n简单来说，`DNN` 或深度学习是具有两个或多个隐藏层的 `ANN`。通过激活函数的组合可以获得更大的灵活性：\n\n$y\
  \ \\\\approx \\\\alpha + \\underset{m = 1}{\\\\overset{M}{\\\\Sigma}}\\\\beta\\\\\
  _{m}f\\\\left( \\\\alpha\\\\_{m}^{(1)} + \\underset{\\text{it~replaces~}\\\\textbf{X}}{\\\
  underset{︸}{\\underset{p = 1}{\\overset{P}{\\\\Sigma}}f\\\\left( \\\\alpha\\\\_{p}^{(2)}\
  \ + \\textbf{X}\\\\delta\\\\_{p}^{(2)} \\\\right)}}\\\\delta\\\\_{m}^{(1)} \\\\\
  right)$\n\n在进行应用之前，我们应该注意 R 和 Python 中提供 `ANN` 实现的可用包数量。例如，`CRAN` 托管了 80 多个与神经网络建模相关的包。上所示，我们刚刚看到了这些。\n\
  \n```\nlibrary(AER)\ndata(\"CPS1985\")\n\ndf <- CPS1985\n\n# Scaling and Dummy coding\n\
  df[,sapply(df, is.numeric)] <- scale((df[, sapply(df, is.numeric)]))\nddf <- model.matrix(~.-1,\
  \ data= df, contrasts.arg =\n                       lapply(df[,sapply(df, is.factor)],\n\
  \                              contrasts, contrasts = FALSE))\n\nddf <- as.data.frame(ddf)\n\
  \n# formula to pass on ANN and lm()\nw.ind <- which(colnames(ddf)==\"wage\")\nfrmnn\
  \ <- as.formula(paste(\"wage~\", paste(colnames(ddf[-w.ind]), collapse='+')))\n\
  frmln <- as.formula(paste(\"wage~\", \"I(experience²)\", \"+\",\n              \
  \            paste(colnames(ddf[-w.ind]), collapse = \"+\")))\n\n# Bootstrapping\
  \ loops instead of CV\nmse.test <- matrix(0, 10, 5)\nfor(i in 1:10){\n\n  set.seed(i+1)\n\
  \  trainid <- unique(sample(nrow(ddf), nrow(ddf), replace = TRUE))\n  train <- ddf[trainid,]\n\
  \  test <- ddf[-trainid,]\n\n  # Models\n  fit.lm <- lm(frmln, data = train)\n \
  \ fit.nn <- neuralnet(frmnn, data = train, hidden = 1, threshold = 0.05,\n     \
  \                 linear.output = FALSE)\n  fit.nn2 <- neuralnet(frmnn, data = train,\
  \ hidden = 2, threshold = 0.05)\n  fit.nn3 <- neuralnet(frmnn, data = train, hidden\
  \ = 3, threshold = 0.05)\n  fit.nn4 <- neuralnet(frmnn, data = train, hidden = 3,\
  \ threshold = 0.05,\n                       act.fct = \"tanh\", linear.output =\
  \ FALSE)\n\n  # Prediction errors\n  mse.test[i,1] <- mean((test$wage - predict(fit.lm,\
  \ test))²)\n  mse.test[i,2] <- mean((test$wage - predict(fit.nn, test))²)\n  mse.test[i,3]\
  \ <- mean((test$wage - predict(fit.nn2, test))²)\n  mse.test[i,4] <- mean((test$wage\
  \ - predict(fit.nn3, test))²)\n  mse.test[i,5] <- mean((test$wage - predict(fit.nn4,\
  \ test))²)\n}\n\ncolMeans(mse.test)\n```\n\n```\n## [1] 0.7296417 0.8919442 0.9038211\
  \ 1.0403616 0.8926576\n```\n\n\n\n\n\n```\n## 'data.frame':    400 obs. of  11 variables:\n\
  ##  $ Sales      : num  9.5 11.22 10.06 7.4 4.15 ...\n##  $ CompPrice  : num  138\
