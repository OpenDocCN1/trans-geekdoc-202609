  ```\n\n在所有衡量指标中，模型“auto”（使用 Hyndman–Khandakar 算法的 ARIMA）都优于其他模型。\n\n\n\n\n我们可能不需要这种网格搜索，因为用于自动\
  \ ARIMA 建模的 `Hyndman–Khandakar algorithm` 能够非常有效地为我们完成工作（除每个模型的 `Ljung–Box test`\
  \ 除外）。我们需要注意，`Hyndman–Khandakar algorithm` 通过选择最小的 `AICc` 来选取用于预测的最优 `ARIMA` 模型。在实践中，我们可以应用带有交叉验证的类似网格搜索，来选择样本外预测误差最小的最佳模型，而无需检查其是否通过了\
  \ `Ljung–Box test`。以下是一个简单的示例：\n\n```\n#In-sample grid-search\np <- 0:3\nq <- 0:3\n\
  P <- 0:3\nQ <- 0:2\n\ncomb <- as.matrix(expand.grid(p, q, P, Q))\n\n# We remove\
  \ the unstable grids\ncomb <- as.data.frame(comb[-1,])\nind <- which(comb$Var1 ==\
  \ 0 & comb$Var2 == 0, arr.ind = TRUE)\ncomb <- comb[-ind, ]\nrow.names(comb) <-\
  \ NULL\ncolnames(comb) <- c(\"p\", \"q\", \"P\", \"Q\")\n\ntrain <- toronto %>%\n\
  \  filter_index( ~ \"2020-11-14\")\n\nRMSE <- c()\n\nfor (k in 1:nrow(comb)) {\n\
  \  tryCatch({\n    amk <- train %>%\n      model(ARIMA(boxcases ~ 0 + pdq(comb[k,\
  \ 1], 1, comb[k, 2])\n                  + PDQ(comb[k, 3], 1, comb[k, 4]))) %>%\n\
  \      forecast(h = 7) %>%\n      accuracy(toronto)\n    RMSE[k] <- amk$RMSE\n \
  \ }, error = function(e) {\n  })\n}\n\ncbind(comb[which.min(RMSE), ], \"RMSE\" =\
  \ min(RMSE, na.rm = TRUE))\n```\n\n```\n##    p q P Q      RMSE\n## 12 0 3 0 0 0.7937723\n\
  ```\n\n```\ng <- which.min(RMSE)\ntoronto %>%\n  model(ARIMA(boxcases ~ 0 + pdq(comb[g,\
  \ 1], 1, comb[g, 2])\n              + PDQ(comb[g, 3], 1, comb[g, 4]))) %>%\n  forecast(h\
  \ = 7) %>%\n  autoplot(toronto, level = NULL)\n```\n\n![](img/Fig22_01.jpg)\n\n\
  我们不会对 `ARIMA` 应用 h 步前滚动窗口交叉验证，这可以在 Hyndman (2021) 的文章《time series cross-validation\
  \ using `fable`》中找到。\n\n## Note\n\n\n\n1. 网站： [`robjhyndman.com/hyndsight/tscv-fable/`](https://robjhyndman.com/)\n\
  \n# 23 时间序列嵌入\n\nDOI: [10.1201/9781003381501-30](https://doi.org/10.1201/9781003381501-30)\n\
  \n通常情况下，预测模型使用直接预测、递归预测或两者的结合（Taieb and Hyndman, 2012）。这两种方法的区别与预测准确性和预测方差的讨论有关。\n\
  \n在时间序列分析背景下，直接预测在生成多步前预测方面起着至关重要的作用。为了实现这一点，我们需要重构数据，以便为每个时间步创建预测。本章将深入探讨嵌入技术，关注如何重新组织数据以同时估计多个模型。\n\
  \n在探索嵌入技术之前，必须先建立递归和直接预测的基础。递归预测需要参数模型，且当模型是非线性时会面临预测误差。直接预测可以通过非参数算法实现，但随着预测期的延长，其方差可能会增大。\n\
  \n多期递归预测使用单一时间序列模型，例如 `AR(1)`。通过估计模型的迭代，可以计算任何 `h` 期的预测。让我们从一个简单的 `AR(1)` 开始观察递归预测：\n\
  \n$x[t+1] = \\alpha[0] + \\phi[1]x[t]$\n\n如果我们使用这个 `AR(1)` 进行三期预测：\n\n$\\begin{aligned}\
  \ {\\hat{x}_{t + 1} = \\hat{\\alpha}_{0} + \\hat{\\phi}_{1}x_{t},} &\\\\ {\\hat{x}_{t\
  \ + 2} = \\hat{\\alpha}_{0} + \\hat{\\phi}_{1}\\hat{x}_{t + 1},} &\\\\ {\\hat{x}_{t\
  \ + 3} = \\hat{\\alpha}_{0} + \\hat{\\phi}_{1}\\hat{x}_{t + 2}} & \\\\ \\\\ \\end{aligned}$\n\
  \n通过迭代替换：\n\n$\\begin{aligned} {\\hat{x}_{t + 1} = \\hat{\\alpha}_{0} + \\hat{\\\
  phi}_{1}x_{t}}~~~~第一期 &\\\\ {{\\hat{x}_{t + 2} = \\hat{\\alpha}_{0} + \\hat{\\alpha}_{1}\
  \ + \\hat{\\phi}_{1}^{2}x_{t}}~~~~第二期 &\\\\ {{\\hat{x}_{t + 3} = \\hat{\\alpha}_{0}\
  \ + \\hat{\\alpha}_{1} + \\hat{\\alpha}_{1}^{2} + \\hat{\\phi}_{1}^{3}x_{t}}~~~~第三期\
  \ & \\\\ \\\\ \\end{aligned}$\n\n当然，我们可以将其推广到 `h` 期：\n\n$\\hat{x}_{t + h} = \\hat{\\\
  alpha}_{0} + \\sum_{i=1}^{h} \\hat{\\phi}_{1}^{i}x_{t}$\n\n由于系数 $(\\hat{\\alpha}_0,\
  \ \\hat{\\phi}_1)$ 是相同的，因此我们只需要一个模型。或者，我们可以应用直接预测，为每个预测期估计一个单独的模型。这里是 `AR(1)` 的示例：\n\
  \n$\\begin{aligned} x_{t + 1} = \\alpha_{0} + \\alpha_{1}x_{t}, &\\\\ x_{t + 2}\
  \ = \\beta_{0} + \\beta_{1}x_{t}, &\\\\ x_{t + 3} = \\omega_{0} + \\omega_{1}x_{t}.\
  \ & \\end{aligned}$\n\n\n\n\n\n```markdown\n# A tibble: 1 x 6\n##   .model     \
  \                               sigma2     log_lik   AIC  AICc   BIC\n##   <chr>\
  \                                     <list>       <dbl> <dbl> <dbl> <dbl>\n## 1\
  \ \"VAR(vars(diffcases, diffmob), ic = \\\"bi~ <dbl[...]>   -854. 1755. 1760. 1841.\n\
  ```\n\n```r\nfit %>% report()\n```\n\n```r\n## Series: diffcases, diffmob\n## Model:\
  \ VAR(5)\n##\n## Coefficients for diffcases:\n##       lag(diffcases,1)  lag(diffmob,1)\
  \  lag(diffcases,2)  lag(diffmob,2)\n##                -0.4074       -105.6524 \
  \          -0.0703         11.0374\n## s.e.            0.0639         28.3643  \
  \          0.0695         29.9761\n##       lag(diffcases,3)  lag(diffmob,3)  lag(diffcases,4)\
  \  lag(diffmob,4)\n##                 0.0528         10.8093           -0.0123 \
  \        -4.8989\n## s.e.            0.0701         31.8601            0.0713  \
  \       30.0019\n##       lag(diffcases,5)  lag(diffmob,5)\n##                 0.0227\
  \          6.1099\n## s.e.            0.0640         29.2678\n##\n## Coefficients\
