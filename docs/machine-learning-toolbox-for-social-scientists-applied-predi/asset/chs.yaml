  \n我们预测了未来 7 天的数值，但还没有实际的观测值。因此，我们无法从准确性的角度来比较这些模型。我们可以通过使用包含截至 2020-11-14 所有数据的训练集，来查看这些模型的预测准确性。当我们预测数据中剩余的七天时，就可以计算预测精度。\n\
  \n```\ntrain <- toronto %>%\n  filter_index( ~ \"2020-11-14\")\n\nfit <- train %>%\n\
  \  model(\n    AR2 = ARIMA(boxcases ~ pdq(2, 1, 0) + PDQ(3, 1, 0)),\n    MA3 = ARIMA(boxcases\
  \ ~ pdq(0, 1, 2) + PDQ(0, 1, 3)),\n    auto = ARIMA(boxcases, stepwise = FALSE,\
  \ approx = FALSE)\n  ) %>%\n  mutate(mixed = (auto + AR2 + MA3) / 3)\n```\n\n虽然混合几个不同的\
  \ ARIMA 模型并没有意义，但除了 ARIMA 建模之外，我们还可以混合多种不同时间序列模型的集成预测。在 Stackoverflow 的这个帖子中可以找到很很好的讨论。\n\
  \n现在，来看准确性衡量指标：\n\n```\nfc <- fit %>% forecast(h = 7)\nfc %>%\n  autoplot(toronto,\
  \ level = NULL)\n```\n\n![](img/Fig21_09.jpg)\n\n```\naccuracy(fc, toronto)\n```\n\
  \n```\n   A tibble: 4 x 10\n   .model .type    ME  RMSE   MAE   MPE  MAPE  MASE\
