  \ Adaptive Lasso 的两个属性：\n- 真正的稀疏性\n- `ℓ2` 误差\n\n## Lasso\n\n我们首先有一个函数 `mcs()`，它执行上述步骤的仿真：\n\
  \n```r\nmcs <- function(mc, N, Beta) {\n  mcmat <- matrix(0, nrow = mc, ncol = 3)\n\
  \  beta_lasso_mat <- matrix(0, nr = mc, nc = length(Beta))\n\n  for (i in 1:mc)\
  \ {\n    set.seed(i)\n    data <- dgp(N, Beta)\n    y <- data[[1]]\n    X <- data[[2]]\n\
  \n    set.seed(i)\n    lasso <- glmnet(x = X, y = y, family = \"gaussian\")\n  \
  \  beta_hat <- lasso$beta    # beta_hat 是一个矩阵\n    y_hat = predict(lasso, newx =\
  \ X)\n\n    SSE <- c()\n    for (j in 1:ncol(y_hat)) {\n      SSE_each <- sum((y_hat[,\
  \ j] - y[, 1]) ^ (2))\n      SSE <- c(SSE, SSE_each)\n    }\n\n    nz <- colSums(beta_hat\
  \ != 0)\n    BIC <- log(SSE) + (log(N) / N) * nz\n    beta_lasso <- beta_hat[, which(BIC\
  \ == min(BIC))]\n    nonz_beta = length(Beta[Beta == 0])\n    nonz_beta_hat = length(beta_lasso[beta_lasso\
  \ == 0])\n\n    mcmat[i, 1] <- sqrt(sum((beta_lasso - Beta) ^ 2))\n    mcmat[i,\
  \ 2] <- ifelse(nonz_beta != nonz_beta_hat, 0, 1)\n    mcmat[i, 3] <- sum(beta_lasso\
  \ != 0)\n    beta_lasso_mat[i, ] <- beta_lasso\n  }\n  return(list(mcmat, beta_lasso_mat))\n\
  }\n```\n\n我们准备好进行仿真：\n\n```r\nmc <- 500\nN <- 1000\nBeta <- matrix(c(1, 1, 0, 0),\
