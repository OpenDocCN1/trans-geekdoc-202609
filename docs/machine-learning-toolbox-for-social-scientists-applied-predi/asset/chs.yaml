  \ 2] <- ifelse(nonz_beta != nonz_beta_hat, 0, 1)\n    mcmat[i, 3] <- sum(beta_lasso\
  \ != 0)\n    beta_lasso_mat[i, ] <- beta_lasso\n  }\n  return(list(mcmat, beta_lasso_mat))\n\
  }\n```\n\n以下是 adaptive lasso 的结果：\n\n```r\nmc <- 500\nN <- 1000\nBeta <- matrix(c(1,\
  \ 1, 0, 0), nc = 1)\noutput <- mcsA(mc, N, Beta) # 查看函数\n\nMC_betas = output[[2]]\n\
  MC_performance = output[[1]]\n\nsum(MC_performance[, 2]) # lasso 找到真正稀疏性的次数\n```\n\
  \n```r\n## [1] 492\n```\n\n\n\n\n时间序列预测与其他机器学习任务之间的一个关键区别是数据中存在时间依赖性。在时间序列数据中，特定时间点的值通常受到其之前值的影响，这意味着数据点呈现的顺序是非常重要的。这使得时间序列预测变得更具挑战性，因为模型必须考虑过去值与未来值之间的关系才能做出准确的预测。\n\
  \n关于使用 R 进行预测的最易获取且全面的来源之一是 Rob J. Hyndman 和 George Athanasopoulos 编写的《Fore-casting:\
  \ Principles and Practice》（[`otexts.com/fpp3/`](https://otexts.com/fpp3/)）（2021）。该书现在有了第三版，使用了\
  \ `tsibble` 和 `fable` 包，而不是 `forecast` 包。这与 tidyverse 包集合的集成了更好的集成。从 FPP2 迁移到 FPP3\
  \ 意味着从 `forecast` 迁移到 `fable`。主要的区别在于 `fable` 是为 `tsibble` 对象设计的，而 `forecast` 是为\
  \ `ts` 对象设计的。Wang 等人有一篇论文（2020），它是详细学习 `tsibble` 的极佳来源。\n\n在本节中，我们将使用 `tsibble`\
  \ 和 `fable` 包以及 `fpp3` 包，涵盖五个主要主题：ARIMA 模型应用、ARIMA 的网格搜索、时间序列嵌入、随机森林预测以及人工神经网络应用（RNN\
  \ 和 LSTM）。时间序列分析和预测是一个非常深入且复杂的主题，超出了本书详细介绍的范围。FPP3 是免费的，即使对于没有没有时间序列预测背景的人来说也非常容易。因此，本节假设某些主要概念（如平稳性、时间序列分解和指数平滑）已经通过进一步阅读\
  \ FPP3 被理解。\n\n# 21 ARIMA 模型\n\nDOI: [10.1201/9781003381501-28](https://doi.org/10.1201/9781003381501-28)\n\
  \nARIMA（自回归积分移动平均）是时间序列预测的主要统计模型。它是一种线性参数模型，可用于分析和预测显示出时间依赖（如季节性和自相关性）的数据。该模型由三个部分组成：\n\
  \n*   自回归 (AR) 部分：对数据中当前值与过去值之间的依赖关系建模。\n*   积分 (I) 部分：指应用于时间序列数据的差分阶数。差分阶数是为了使数据变得平稳而进行差分的次数。平稳性意味着均值、方差和协方差随时间保持不变。\n\
  \n*   移动平均 (MA) 部分：对当前值与过去预测误差之间的依赖关系建模。ARIMA 模型的 MA 部分用于捕捉数据中 AR 部分未捕捉的短期波动。例如，如果时间序列数据表现出随机噪声或突然峰值，MA\
  \ 部分可以帮助平滑这些波动并提高预测准确性。\n\nARIMA 模型可以写为 `ARIMA(p, d, q)`，其中 `p` 是自回归部分的阶数，`d` 是差分阶数，`q`\
  \ 是移动平均部分的阶数。`p`、`d` 和 `q` 的值根据时间序列数据的特征选择，以实现最大的预测准确性。要使用 ARIMA 模型，必须先预处理时间序列数据以消除任何趋势和季节性，并确保数据是平稳的。然后对预处理后的数据进行拟合，并根据拟合模型生成预测。\n\
  \nARIMA 模型的数学基础基于自回归 (AR)过程和移动平均 (MA)过程。自回归过程是一种随机过程，其中时间序列的当前值依赖于序列过去值的线性组合。自回归过程可以用数学形式表示为：\n\
  \n$$\\left. X_{t} = c + \\underset{i = 1}{\\overset{p}{\\Sigma}}(\\mathit{\\phi}_{i}X_{t\
  \ - i} \\right) + \\epsilon_{t},$$\n\n其中 `X[t]` 是时间序列在时间 `t` 处的值，`c` 是常数，`ϕ[i]`\
  \ 是滞后 `i` 的自回归系数，而 `ϵ[t]` 是白噪声（均值为零且方差恒定的随机变量序列）。\n\n移动平均过程是一种随机过程，其中时间序列的当前值依赖于过去误差或残差（实际值与预测值之间的差）的线性组合。移动平均过程可以用数学形式表示为：\n\
  \n$$\\left. X_{t} = c + \\underset{i = 1}{\\overset{q}{\\Sigma}}(\\theta_{i}\\epsilon_{t\
  \ - i} \\right) + \\epsilon_{t},$$\n\n其中 `θ[i]` 是滞后 `i` 的移动平均系数，`ϵ[t]` 再次是白噪声。\n\
  \nARIMA 模型是自回归和移动平均过程的结合，可以用数学形式表示为：\n\n$$\\left. X_{t} = c + \\underset{i = 1}{\\\
  overset{p}{\\Sigma}}(\\mathit{\\phi}_{i}X_{t - i} \\right) + \\epsilon_{t}$$\n\n\
  通过反复替换，可以将任何 AR(p) 模型表示为 MA(∞) 模型。以下是 AR(1) 的示例：\n\n$$\\begin{array}{rl} X_{t} &=\
  \ c + \\phi_{1}X_{t-1} + \\theta_{1}\\epsilon_{t-1} + \\epsilon_{t} \\\\ &= c +\
  \ \\phi_{1}(c + \\phi_{1}X_{t-2} + \\theta_{1}\\epsilon_{t-2} + \\epsilon_{t-1})\
  \ + \\theta_{1}\\epsilon_{t-1} + \\epsilon_{t} \\\\ &= (c+\\phi_{1}c) + \\phi_{1}²X_{t-2}\
  \ + (\\phi_{1}\\theta_{1}+\\theta_{1})\\epsilon_{t-1} + \\phi_{1}\\theta_{1}\\epsilon_{t-2}\
  \ + \\epsilon_{t} \\end{array}$$\n\nARIMA 模型的参数（`c`、`ϕ[i]`、`θ[i]`）使用极大似然估计 (MLE)\
  \ 进行估计，这涉及找到使给定数据的似然最大的参数值。一旦模型拟合数据，就可以进行点预测（特定时间点的预测）或区间预测（带有值范围的预测）。\n\n选择 *p*\
  \ 和 *q* 的一些常用方法包括 ARIMA(*p, d, q*)：\n\n*   自相关函数 (ACF) 图：显示时间序列数据与其滞后版本之间的相关性。在滞后\
  \ *p* 处出现高正相关表明 *p* 可能是 ARIMA(*p, d, q*) 中 *p* 的一个良好值。\n*   部分自相关函数 (PACF) 图：在考虑了所有较低阶相关性后，显示时间序列数据与其滞后版本之间的相关性。在滞后\
  \ *q* 处出现高正相关表明了它是 ARIMA(*p, d, q*) 中 *q* 的值。\n*   有几种统计指标可用于比较不同 ARIMA 模型的拟合优度，例如赤池信息准则\
  \ (AIC) 和贝叶斯信息准则 (BIC)。这些指标可用于选择值最低的模型，该模型通常被认为是最好的模型。\n\n\n\n\nHyndman–Khandakar\
  \ 算法 (Hyndman and Khandakar, 2008a) 结合了用于 ARIMA 模型建模（及估计）的多个步骤：单位根检验、`AICc` 最小化以及通过极大似然然估计（MLE）来获取\
  \ ARIMA 模型。`fable` 包中的 `ARIMA()` 函数参数为 ARIMA 建模提供了许多变体。针对一组（非季节性）时间序列数据的 ARIMA 建模过程在\
  \ FPP3 中定义如下：\n\n1. 绘制数据图以识别任何离群值。\n2. 如果数据显示的波动随序列水平的增加而减少，则对数据进行变换（Box–Cox 变换）以稳定方差。\n\
  3. 检查数据是否非平稳。如果不是平稳的，使其平稳。\n4. 根据 ACF/PACF 的指示，从 `ARIMA(p, d, 0)` 或 `ARIMA(0, d,\
  \ q)` 开始。\n5. 尝试你选择的模型，并使用 `AICc` 寻找更好的模型。\n\n然而，在第 5 步之后，所选模型的残差应该是白噪声。否则，必须对模型进行修改。一旦残差看起来像白噪声，ARIMA\
  \ 模型就可以用于预测了。\n\n我们将通过多伦多 2020 年 3 月 1 日至 11 月 21 日期间 266 天的 COVID-19 流行曲线来展示这些步骤。流行曲线（或流行曲线）是与相关的病例发病时间的视觉化展示。数据包含第一波和第二波的第一部分。数据源自安大略数据目录（Ontario\
  \ Data Catalogue）。\n\n## 21.2 TS 图\n\n我们首先加载数据并将其转换为 `tsibble`。\n\n```r\nlibrary(tsibble)\n\
