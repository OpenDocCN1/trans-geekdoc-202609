  \ beta hat？为了回答这个问题，我们需要找到 `lambda`。我们需要让 `λ[n] → ∞` 以便将真正的零系数收缩为零。这要求 `λ[n]` 足够大。但这会给非零系数引入渐近偏差。\n\
  \n在实践中，通过 `BIC`（贝叶斯信息准则）选择 `λ[n]` 在固定 `p` 的设置下可以获得一致的模型选择。也就是说，令 `A = {j : β[0*,j]\
  \ ≠ 0}` 为活动集或相关变量，\n\n$$\\$\\\\left. P\\\\left( {\\\\overset{\\\\hat{}}{A}}\\_{\\\
  lambda\\\\text{BIC}} = A\\\\mathcal{} \\right)\\\\rightarrow 1 \\\\right.$$\n\n\
  因此，令 `SSE[λ]` 为给定 `λ` 值的平方误差项和，`nz[λ]` 为非零系数的个数。可以证明：\n\n$$BIC_{\\\\lambda} = \\\
  \\log\\\\left( SSE_{\\lambda} \\right) + \\\\frac{\\\\left. \\log(n \\right)}{n}nz_{\\\
  lambda}$$\n\n```r\n# 为 61 个 lambda (s) 中的每一个预测 yhat\ny_hat = predict(lasso, newx\
  \ = X)\ndim(y_hat)\n```\n\n```r\n## [1] 100  60\n```\n\n```r\n# 为每个 lambda (s) 计算\
  \ SSE\nSSE <- c()\nfor (i in 1:ncol(y_hat)) {\n  SSE_each <- sum((y_hat[, i] - y[,\
  \ 1]) ^ (2))\n  SSE <- c(SSE, SSE_each)\n}\n\n# BIC\nnz <- colSums(beta_hat != 0)\
  \ # 每个 lambda 的非零系数个数\nBIC <- log(SSE) + (log(N) / N) * nz # BIC\nBIC\n```\n\n```r\n\
