  \ 0.01055 0.0146 ...\n##   ..$ x_2: num [1:22500] 0 0 0 0 0 0 0 0 ...\n##   ..$\
  \ p: num [1:22500] 0.703 0.711 0.719 0.727 0.734 ...\n\n## 8.2 线性分类器（再次）\n\n线性分类器（如\
  \ `LPM` 和 `Logistic`）是指通过特征的线性组合形成“超平面”的分类器。超平面代表分类器选择的边界，用于区分不同类别标签的数据点。让我们从 LPM\
  \ 开始：\n\n$Pr(Y=1|X[1]=x[1],X[2]=x[2]) = \\beta[0] + \\beta[1]x[1] + \\beta[2]x[2]$\
  \ (8.1)\n\n\n\n\n```\n## Call:\n## lm(formula = y10 ~ x_1 + I(x_1²) + x_2, data\
  \ = train)\n## Residuals:\n##      Min       1Q   Median       3Q      Max\n## -1.14744\
  \ -0.28816  0.03999  0.28431  1.06759\n\n## Coefficients:\n##             Estimate\
  \ Std. Error t value Pr(>|t|)\n## (Intercept)  0.09328    0.06571   1.419   0.1562\n\
  ## x_1          4.81884    0.55310   8.712  < 2e-16 ***\n## I(x_1²)    -2.75520\
  \    1.40760  -1.957   0.0507 .\n## x_2         -1.18864    0.17252  -6.890 1.14e-11\
  \ ***\n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\
  ## Residual standard error: 0.3891 on 796 degrees of freedom\n## Multiple R-squared:\
  \  0.3956, Adjusted R-squared:  0.3933\n## F-statistic: 173.7 on 3 and 796 DF, \
  \ p-value: < 2.2e-16\n```\n\n```r\ntr <- 0.5\ns <- model2$coefficients\na = tr /\
  \ s[3]\nb = s[1] / s[3]\nd = s[2] / s[3]\ne = s[4] / s[3]\nx22 = a - b - d * train$x_1\
  \ - e * (train$x_1 ^ 2)\nplot(train$x_1, train$x_2, col = train$y10 + 1, cex = 0.72)\n\
  lines(train$x_1[order(x22)], x22[order(x22)], lwd = 2.8)\n```\n\n![](img/Fig08_05.jpg)\n\
  \n多项式的系数几乎不显著，且在量级上非常微不足道道。事实上，分类效果似乎比之前的更差。\n\n逻辑回归会给我们提供更好的直线吗？我们不需要估计它，但可以获得逻辑回归的决策边界。记住，\n\
  \n$P(Y\\left. = 1 \\\\middle| x \\right.) = \\frac{\\exp\\left( w_{0} + \\sum\\\
  limits\\_{i}w_{i}x_{i} \\right)}{1 + \\exp\\left( w_{0} + \\sum\\limits\\_{i}w_{i}x_{i}\
  \ \\right)}$\n\n并且，\n\n$P(Y = 0\\left| x) = 1 - P(Y = 1 \\right|x) = \\frac{1}{1\
  \ + \\exp\\left( w_{0} + \\sum\\limits\\_{i}w_{i}x_{i} \\right)}$\n\n如果我们取成功与失败的比例，即\
  \ $P/1-P$，\n\n$\\frac{P}{1 - P} = \\exp\\left( w_{0} + \\underset{i}{\\Sigma}w_{i}x_{i}\
  \ \\right)$\n\n如果这个比例大于 1，我们认为 $Y = 1$ 的概率高于 $Y = 0$ 的概率。这只有在 $P > 0.5$ 时才会发生。因此，将观测值分类为\
  \ $Y = 1$ 的条件是：\n\n$\\frac{P}{1 - P} = \\exp\\left( w_{0} + \\underset{i}{\\Sigma}w_{i}x_{i}\
  \ \\right) > 1$\n\n如果我们对两边取对数，\n\n$w_{0} + \\underset{i}{\\Sigma}w_{i}X_{i} > 0$\n\
  \n从这里开始，我们案例中的超平面函数变为：\n\n$\\hat{\\beta}[0]+\\hat{\\beta}[1]x[1]+\\hat{\\beta}[2]x[2]=0\\\
  Rightarrowx[2]=-\\hat{\\beta}[0]/\\hat{\\beta}[2]-\\hat{\\beta}[1]/\\hat{\\beta}[2]x[1]$。\n\
  \n我们看到决策边界再次是线性。因此，LPM 和逻辑回归被称为**线性分类器**，它们**仅当手头的问题是线性可分的时才有效**。\n\n是否可能存在非线性边界条件，以便我们对预测概率获得更好的分类结果？\n\
  \n## 8.3 k-最近邻\n\nk-最近邻 (kNN) 是一种用于分类（或回归）的非参数方法，通过 $k$ 个最近邻来估计 $p(x)$。在 `kNN` 中，输出是类别。![](img/Fig08_06.jpg)\
  \ 假设我们需要要分类红点。当 $k=1$ 时，距离红点最近的观测值将预测红点的所属类别。正如我们，矩阵显示了所有点之间的距离，它是对称的。\n\n\n\n这些被称为与\
  \ 1-NN 相关的沃罗诺伊单元（Voronoi cells），它们是一组边边为相邻点之间连线垂直平分线的多边形。因此，决策边界是同一类别的相邻沃罗诺伊单元融合的结果。在上面的示例中，它是每种颜色并集的边界。追踪每个相邻沃罗诺伊区域的边界可以通过额外的几个步骤完成。\n\
  \n为了在应用中查看所有内容，我们将使用来自 `Caret` 包的 `knn3()`。我们不会训练模型，而只是观察类别之间的分离将是非线性的，并且对于不同的 `k`\
  \ 有所不同。\n\n```\nlibrary(tidyverse)\nlibrary(caret)\nlibrary(dslabs)\n\n#With k =\
  \ 50\nmodel1 <- knn3(y ~ ., data = mnist_27$train, k = 2)\n\nx_1 <- mnist_27$true_p$x_1\n\
  x_2 <- mnist_27$true_p$x_2\ndf <- data.frame(x_1, x_2) #这是全部数据，22500 个观测值。\n\np_hat\
  \ <- predict(model1, df, type = \"prob\") #预测每个箱桶的概率\np_7 <- p_hat[,2] #选择 7 的 p_hat\n\
  \ndf <- data.frame(x_1, x_2, p_7)\n\nmy_colors <- c(\"black\", \"red\")\n\np1 <-\
  \ ggplot() +\n  geom_point(data = mnist_27$train, aes(x = x_1, y = x_2, colour =\
  \ factor(y)),\n             shape = 21, size = 1, stroke = 1) +\n  stat_contour(data\
  \ = df, aes(x = x_1, y = x_2, z = p_7), breaks=c(0.5), color=\"blue\") +\n  scale_color_manual(values\
  \ = my_colors)\nplot(p1)\n```\n\n![](img/Fig08_11.jpg)\n\n```\n#With k = 400\nmodel2\
  \ <- knn3(y ~ ., data = mnist_27$train, k = 400)\n\np_hat <- predict(model2, df,\
  \ type = \"prob\") #预测每个箱桶的概率\np_7 <- p_hat[,2] #选择 7 的 p_hat\n\ndf <- data.frame(x_1,\
  \ x_2, p_7)\n\np1 <- ggplot() +\n  geom_point(data = mnist_27$train, aes(x = x_1,\
  \ y = x_2, colour = factor(y)),\n             shape = 21, size = 1, stroke = 1)\
  \ +\n  stat_contour(data = df, aes(x = x_1, y = x_2, z = p_7), breaks=c(0.5), color=\"\
  blue\") +\n  scale_color_manual(values = my_colors)\nplot(p1)\n```\n\n![](img/Fig08_12.jpg)\n\
  \n`k` = 2 的显示出过拟合迹象，另一个 `k` = 400 的则表示过度平滑或欠拟合。我们需要调整 `k` 以在预测准确性方面达到最佳。\n\n###\
  \ 8.4 使用 Caret 进行 kNN\n\n不同的作者开发了许多不同的学习算法，且通常具有不同的参数结构。`caret`（Classification And\
  \ Regression Training）包试图整合这些差异并提供一致性。它目前包含了 237 （并不断增长）不同的方法，这些方法在 caret 包手册中进行了摘要（Kuhn\
  \ and Becker, 2019）。在这里，我们将使用 `mnist 27` 来说明如何使用 `caret` 进行 kNN。目前，我们将使用 caret 的\
  \ `train()` 函数来寻找 kNN 的最优 `k`，这本质上是下一节将看到的交叉验证版本。\n\n### 8.4.1 `mnist_27`\n\n由于我们的数据集\
  \ `mnist 27` 已经分为训练集和测试集，因此不需要再次划分。这里是起点：\n\n```\nlibrary(caret)\n\n#Training/Model\
  \ building\nmodel_knn <- train(y ~ ., method = \"knn\", data = mnist_27$train)\n\
  model_knn\n```\n\n```\n## k-Nearest Neighbors\n## 800 samples\n## 预测器\n## 2 类别:\
  \ '2', '7'\n## 无预处理\n## 重采样: Bootstrapped (25 次)\n## 样本大小: 800, 800, 800, 800, 800,\
  \ 800,\n## 重采样的调优结果:\n##   k  Accuracy   Kappa\n##   5  0.807598  0.613518\n## \
  \  7  0.8157975  0.630049\n##   9  0.8205824  0.639602\n## 使用最大值选择最优模型。\n## 模型最终使用的值为\
  \ k = 9。\n```\n\n默认情况下，通过取观测值的 25% 进行自助采样来执行交叉验证。此外，默认尝试 `k` = 5, 7, 9。我们可以扩展它：\n\
  \n```\n#Training/Model building with own grid\nset.seed(2008)\nmodel_knn <- train(\n\
  \  y ~ .,\n  method = \"knn\",\n  data = mnist_27$train,\n  tuneGrid = data.frame(k\
  \ = seq(9, 71))\n)\nggplot(model_knn, highlight = TRUE)\n```\n\n![](img/Fig08_13.jpg)\n\
  \n```\nmodel_knn$bestTune\n```\n\n```\n## k\n## 27\n```\n\n```\nmodel_knn$finalModel\n\
  ```\n\n```\n## 27-nearest model\n## 训练集分布:\n##   2   7\n##   379 421\n```\n\n我们可以将其调优改为交叉验证：\n\
  \n```\n#Training/Model building with 10-k cross-validation\ncv <- trainControl(method\
