  \ *β*[*AL*[,j]* = 0，那么 *β̂*[*OLS*,j] 可能接近于零，导致一个非常小的 `w[j]`。因此，真正的零系数会受到很大的惩罚。计算自适应\
  \ lasso 中的权重需要两步走程序。\n\n自适应 lasso (AL) 中的权重提供了关于变量的先验“智能”，使得在普通 Lasso 平等地惩罚所有参数时，自适应\
