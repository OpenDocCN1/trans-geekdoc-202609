  \  Median :4.000   Median :2.000\n##  Mean   :0.000   Mean   :3.938   Mean   :2.125\n\
  ##  3rd Qu.:0.000   3rd Qu.:4.000   3rd Qu.:4.000\n##  Max.   :1.000   Max.   :4.000\
  \   Max.   :4.000\n```\n\n```\nplot(mtcars[,c(1, 4)])\n```\n\n### 2.1.2 时间序列\n\n\
  时间序列数据也具有单一维度，即时间。与横截面数据不同，时间序列数据的观测顺序至关重要；打乱顺序会破坏任何时间模式。时间序列数据用于分析随时间的变化并预测未来值。\n\
  \n```\nhead(airquality)\n```\n\n```\n##   Ozone Solar.R Wind Day\n## 1   141   \
  \  190.0   7.4   1\n## 2    36     118.0   8.0   2\n## 3    49     149.0  12.6 \
  \  3\n## 4   188     313.0  11.5   4\n## 5     NA      NA  14.3   5\n## 6    28\
  \      NA  14.9   6\n```\n\n```\nstr(airquality)\n```\n\n```\n## 'data.frame': \
  \   153 obs. of  6 variables:\n##  $ Ozone: int  41 36 49 188 NA 28 ...\n##  $ Solar.R:\
  \ int  190 118 149 313 NA NA ...\n##  $ Wind: num   7.4 8.0 12.6 11.5 14.3 14.9\
  \ ...\n##  $ Day: int  1 2 3 4 5 6 ...\n##  $ Temp: int  67 72 74 62 65 59 ...\n\
  ##  $ Month: int  5 5 5 5 5 5 ...\n```\n\n```\nsummary(airquality)\n```\n\n```\n\
  ##      Ozone           Solar.R           Wind             Temp\n##  Min.   :14.00\
  \   Min.   :18.000   Min.   :1.700   Min.   :56.00\n##  1st Qu.:36.00   1st Qu.:115.800\
  \   1st Qu.:7.400   1st Qu.:72.00\n##  Median :31.50   Median :205.0   Median :9.700\
  \   Median :79.00\n##  Mean   :42.13   Mean   :185.9   Mean   :9.958   Mean   :77.88\n\
  ##  3rd Qu.:63.25   3rd Qu.:258.8   3rd Qu.:11.500   3rd Qu.:85.00\n##  Max.   :168.00\
  \   Max.   :334.0   Max.   :20.700   Max.   :97.00\n##  NA's   :37       NA's  \
  \ :7\n```\n\n```\nairquality$date <- airquality$Month*10+airquality$Day\nplot(airquality$date,\
  \ airquality$Ozone)\n```\n\n\n以上是对时间序列数据的简单介绍。在本书的第七部分，我们将探索处理时间序列数据的高级技术，包括建模趋势、季节性和周期行为的方法。\n\
  \n在 R 中处理时间序列数据时，通常需要处理日期和时间信息的包或函数。此用途的一个流行包是 `lubridate`，它提供了许多处理日期、时间和持续时间的工具。通过利用如\
  \ `lubridate` 等包，我们可以有效地管理分析中的时间相关数据，并对数据的底层时间模式获得深入见解。\n\n以下是一些示例：\n\n```\nlibrary(lubridate)\n\
  # 获取当前系统日期\nSys.Date()\n```\n\n```\n## [1] \"2023-04-27\"\n```\n\n```\n# 获取当前系统时间\n\
  Sys.time()\n```\n\n```\n## [1] \"2023-04-27 07:49:37\"\n```\n\n```\n#lubridate\n\
  now()\n```\n\n```\n## [1] \"2023-04-27 07:49:37\"\n```\n\n``````\ndates <- c(\"\
  2022-07-11\", \"2012-04-19\", \"2017-03-08\")\n\n# 从日期中提取年份\nyear(dates)\n```\n\n\
  ```\n## [1] 2022 2012 2017\n```\n\n```\n# 从日期中提取月份\nmonth(dates)\n```\n\n```\n##\
  \ [1] 7 4 3\n```\n\n```\n# 从日期中提取日期\nmday(dates)\n```\n\n```\n## [1] 11 19 8\n```\n\
  \n\n\n\n```\n## firm year sector    emp    wage capital   output\n## 1     1 1977\
