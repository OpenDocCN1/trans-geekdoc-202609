  knn\",\n  data = mnist_27$train,\n  tuneGrid = data.frame(k = seq(9, 71,2)),\n \
  \ trControl = cv\n)\nggplot(model_knn, highlight = TRUE)\n```\n\n![](img/Fig08_14.jpg)\n\
  \n```\nmodel_knn$bestTune\n```\n\n```\n## k\n## 29\n```\n\n```\n\n似乎 `k` = 27（带有\
  \ CV 的 k = 29）给了我们性能最好的模型。可以看到它们在测试集上的预测：\n\n```\ncaret::confusionMatrix(predict(model_knn,\
