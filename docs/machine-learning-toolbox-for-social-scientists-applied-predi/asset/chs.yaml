  \ `test`（测试集）数据集混淆。这一点经常让从业人员感到困惑。那么，`test set` 是什么呢？\n\n### 9.2 随机划分数据\n\n我们现在已经通过最优的\
  \ `λ` 调优了 `Model1`。这是多个备选模型之一（在实践中有超过 300 种预测模型，且数量在不断增加）。此外，我们遵循的上述步骤对于其适用性提供了有限的答案。\n\
  \n注意，`validation` 术语有时与我们从样本中留出的 `test`（测试集）数据集混淆。这一点经常让从业人员感到困惑。那么，`test set` 是什么呢？\n\
  \n我们已经知道如何使用 `sample()` 对一组观测值进行采样。我们可以再次使用该函数将数据分成 k-fold 部分。这里有一个只有两个部分的示例：\n\n\
  \n\n\n\n```r\n# 我们使用 DGM 创建一个包含 X 和 Y 的简单数据集\nset.seed(2)\nn <- 10000\nx <- rnorm(n,\
  \ 3, 6)\ny <- 2 + 13*x + rnorm(n, 0, 1)\ndata <- data.frame(y, x)\n\n# 我们需要对它进行打乱\n\
  random <- sample(n, n, replace = FALSE)\ndata <- data[random, ]\n\n# 现在数据的顺序是完全随机的，\n\
  # 我们可以根据意愿将其分为许多切片\nk <- 2 # 2 折（切片-部分）\nnslice <- floor(n/k) # 每折/切片中的观测数量\n\n\
  # 由于我们只有两个切片数据\n# 我们可以将一个切片称为“验证集”，另一个称为“训练集”\ntrain <- data[1:nslice, ]\nstr(train)\n\
  ```\n\n```r\n## 'data.frame':    5000 obs. of  2 variables:\n##  $ y: num  -92.7\
  \ 52.35 -114 133.6 7.39 ...\n##  $ x: num  -7.344 3.868 -9.006 9.978 0.468 ...\n\
  ```\n\n```r\nval <- data[(nslice+1):n,]\nstr(val)\n```\n\n```r\n## 'data.frame':\
  \    5000 obs. of  2 variables:\n##  $ y: num  -49.1 -53.7 -25 -46.2 135.2 ...\n\
  ##  $ x: num  -3.9 -4.22 -1.99 -3.67 10.37 ...\n```\n\n我们如何使用这种方法来调优模型？让我们使用之前见过的通过\
  \ `loess()` 应用的核回归。我们的验证集和训练集已经准备就绪。我们将使用训练集在每个模型中使用不同的 `span` 值来训练模型。然后，我们将通过查看模型结果相对于我们验证集的\
  \ RMSPE 来验证每个模型。RMSPE 最低的将是胜者。这就是计划。让我们使用 `span` = 0.02, 0.1 和 1 的集合。\n\n```r\n\
  # 使用训练集通过度 = 2（局部二次）进行估计\nloe0 <- loess(y ~ x,\n              degree = 2,\n    \
  \          span = 0.02,\n              data = train)\nloe1 <- loess(y ~ x,\n   \
  \           degree = 2,\n              span = 0.1,\n              data = train)\n\
  loe2 <- loess(y ~ x,\n              degree = 2,\n              span = 1,\n     \
  \         data = train)\n\n# 使用验证集进行预测\nfit0 <- predict(loe0, val$x)\nfit1 <- predict(loe1,\
  \ val$x)\nfit2 <- predict(loe2, val$x)\n```\n\n我们还必须创建我们的性能指标 RMSPE；\n\n```r\nrmspe0\
  \ <- sqrt(mean((val$y-fit0)²))\nrmspe1 <- sqrt(mean((val$y-fit1)²))\nrmspe2 <- sqrt(mean((val$y-fit2)²))\n\
  \nc(paste(\"With span = 0.02\", \"rmspe is \", rmspe0),\npaste(\"With span = 0.1\"\
  , \"rmspe is \", rmspe1),\npaste(\"With span = 1\", \"rmspe is \", rmspe2))\n```\n\
  \n```r\n## [1] \"With span = 0.02 rmspe is  1.01967570649964\"\n## [2] \"With span\
  \ = 0.1 rmspe is  1.00901093799357\"\n## [3] \"With span = 1 rmspe is  1.0056119864882\"\
  \n```\n\n我们的这个算法存在几个问题。首先，我们只对 `span` 使用了三个任意值。例如，如果我们使用 0.11，我们不知道它的 RMSPE 是否会更好。其次，我们只通过手动比较来查看\
  \ RMSPE 之间的差异。如果我们测试了一组大量的 `span` 值，这将会变得很困难。第三，我们只使用了一组验证集和训练集。如果我们多次这样做，可能会得到不同的结果和不同的模型排名。我们该如何解决这些问题呢？\n\
  \n让我们先解决最后一个问题，关于使用多一组训练和验证集的问题：\n\n## 9.3 k 折交叉验证\n\n我们可以从下面关于 k 折交叉验证的图开始。它展示了五折交叉验证。它将数据分为\
  \ k 份，然后在 k-1 份上训练数据，并在剩下的 1 份上验证。虽然这种交叉验证是最常见的，但还有几种不同的交叉验证方法，例如留一法 (LOOCV)、留一组法和时间序列交叉验证方法，我们稍后会看到。\n\
  \n![](img/Fig09_02.jpg)\n\n这张图说明了 5-k CV。我们需要创建一个执行十次切片的循环。如果我们通过十折交叉验证重复相同的 `loess()`\
  \ 示例，我们将为每个 `span` 值获得十个 RMSPE。为了评估哪一个最低，我们取这些 RMSPE 的平均值。\n\n```r\n# 模拟我们的数据\n\
  n = 10000\nset.seed(1)\nx <- sort(runif(n))*2*pi\ny <- sin(x) + rnorm(n)/4\n\ndata\
  \ <- data.frame(y, x)\n\n# 通过索引打乱观测顺序\nmysample <- sample(n, n, replace = FALSE)\n\
  \nk <- 10 # 十折 CV\nnvalidate <- round(n / k)\n\nRMSPE <- c() # 我们需要一个存储 RMSPE 的容器\n\
  \n# 循环\nfor (i in 1:k) {\n  if (i < k) {\n    ind_val <- mysample[((i - 1) * nvalidate\
  \ + 1):(i * nvalidate)]\n  } else{\n    ind_val <- mysample[((i - 1) * nvalidate\
  \ + 1):n]\n  }\n\n  cat(\"K-fold loop: \", i, \"\\r\") # 计数器，实践中不需要\n\n  data_val\
  \ <- data[ind_val, ]\n  data_train <- data[-ind_val, ]\n\n  model <- loess(\n  \
  \  y ~ x,\n    control = loess.control(surface = \"direct\"),\n    degree = 2,\n\
  \    span = 0.1,\n    data = data_train\n  )\n\n  fit <- predict(model, data_val$x)\n\
  \  RMSPE[i] <- sqrt(mean((data_val$y - fit) ^ 2))\n}\n```\n\n```r\n## K-fold loop:\
  \  1 K-fold loop:  2 K-fold loop:  3 K-fold loop:  4 K-fold loop:\n            \
  \     5 K-fold loop:  6 K-fold loop:  7 K-fold loop:  8 K-fold loop:\n         \
  \        9 K-fold loop:  10\n```\n\n```r\nRMSPE\n```\n\n```r\n## [1] 0.2427814 0.2469909\
  \ 0.238773 0.2472059 0.248908 0.251057 0.255314\n## [8] 0.2517241 0.252153 0.242968\n\
  ```\n\n```r\nmean(RMSPE)\n```\n\n```r\n## [1] 0.247793\n```\n\n注意 `loess.control()`\
  \ 用于训练集之外的 `x` 的调整。我们如何使用这种 k 折交叉验证来选择范围内的最佳 `span` 呢？\n\n## 9.4 交叉验证网格搜索\n\n超参数优化的传统方法是网格搜索或参数扫描，它只是对学习算法的超参数子集进行穷举搜索。这是\
  \ Wikipedia 对网格搜索的定义。\n\n虽然我们没有进行网格搜索，但上示例已经完成了主要过程。我们需要添加的是超参数网格和搜索循环。在每个超参数中，我们需要知道该子集的最大值最小值。例如，`loess()`\
  \ 中的 `span` 设置了范围，范围在 0 到 1 之间。这控制了平滑程度。因此，`span` 值越大，拟合曲线越平滑。\n\n此外，`loess()` 中的\
  \ `degree` 参数定义为使用的多项式次数，通常为 1 或 2（允许 0，见注意）。对于每个学习算法，调优参数的数量及其范围是不同的。因此，在运行任何网格搜索之前，我们需要了解它们的函数和范围。\n\
  \n```r\n# 使用缩小尺寸相同的数据\nn = 1000\nset.seed(1)\nx <- sort(runif(n) * 2 * pi)\ny <-\
  \ sin(x) + rnorm(n) / 4\ndata <- data.frame(y, x)\n\n# 设置 CV\nind <- sample(n, n,\
  \ replace = FALSE)\nk <- 10 # 十折 CV\nnval <- round(n / k)\n\n# 网格\ngrid <- expand.grid(seq(from\
  \ = 0.01, to = 1, by = 0.02), c(1, 2))\nhead(grid)\n```\n\n```r\n##   Var1 Var2\n\
  ## 1 0.01    1\n## 2 0.03    1\n## 3 0.05    1\n## 4 0.07    1\n## 5 0.09    1\n\
  ## 6 0.11    1\n```\n\n```r\n# 循环\nOPT <- c()\n\nfor (i in 1:k) {\n  if (i < k)\
  \ {\n    ind_val <- ind[((i - 1) * nval + 1):(i * nval)]\n  } else{\n    ind_val\
  \ <- ind[((i - 1) * nval + 1):n]\n  }\n\n  data_val <- data[ind_val, ]\n  data_train\
  \ <- data[-ind_val, ]\n\n  # 我们需要一个向量来存储网格每行的 RMSPE\n  RMSPE <- c()\n\n  # 我们需要另一个循环运行网格中的每一行\n\
  \  for (s in 1:nrow(grid)) {\n    model <- loess(\n      y ~ x,\n      control =\
  \ loess.control(surface = \"direct\"),\n      degree = grid[s, 2],\n      span =\
  \ grid[s, 1],\n      data = data_train\n    )\n\n    fit <- predict(model, data_val$x)\n\
  \    RMSPE[s] <- sqrt(mean((data_val$y - fit) ^ 2))\n  }\n  OPT[i] <- which(RMSPE\
  \ == min(RMSPE), arr.ind = TRUE)\n}\nopgrid <- grid[OPT, ]\ncolnames(opgrid) <-\
  \ c(\"span\", \"degree\")\nrownames(opgrid) <- c(1:10)\nopgrid\n```\n\n```r\n##\
  \    span degree\n## 1  0.09      2\n## 2  0.63      2\n## 3  0.23      2\n## 4\
  \  0.03      2\n## 5  0.33      2\n## 6  0.59      2\n## 7  0.75      2\n## 8  0.57\
  \      2\n## 9  0.25      1\n## 10 0.21      1\n```\n\n\n\n\n这些结果很不错，但我们该如何选择一组值，即最优\
  \ `span` 和 `degree` 的坐标呢？大多数折叠都认为我们应该使用 `degree = 2`，但哪个 `span` 值是最优的呢？如果超参数是一个离散值，我们可以使用众数规则取众数，即集合中出现次数最高的数字。\n\
  \n这对于 `degree` 可能是合适的，但对于 `span` 则不适用。我们可以使用十个最优 `span` 值的平均值，每个值都是从每个折叠计算出来的。这也是一个问题，因为所选\
  \ `span` 的范围从 0.09 到 0.75，而我们只有十个 `span` 值。一种解决方案是多次运行相同的算法，这样我们就可以为所选 `spans` 提供更好的平均基础。\n\
  \n然而，在多次运行相同的算法之前，记住，我们使用了整个样本来调优超参数。最初，我们说应该避免这种类型的应用。因此，我们需要创建一个测试集，并用于报告调优后模型的准确率。以下是该过程的插图：\n\
  \n![](img/Fig09_03.jpg)\n\n让我们开始吧：\n\n```r\n# Using the same data\nn = 1000\nset.seed(1)\n\
  x <- sort(runif(n) * 2 * pi)\ny <- sin(x) + rnorm(n) / 4\ndata <- data.frame(y,\
  \ x)\n\n# Grid\ngrid <- expand.grid(seq(from = 0.01, to = 1, by = 0.02), c(1, 2))\n\
  \n# Train - Test Split\nset.seed(321)\nsh_ind <- sample(nrow(data), 0.20 * nrow(data),\
  \ replace = FALSE)\ntestset <- data[sh_ind,] #20% of data set a side\ntrainset <-\
  \ data[-sh_ind, ]\n\n# k-CV, which is the same as before\nset.seed(3)\nind <- sample(nrow(trainset),\
  \ nrow(trainset), replace = FALSE)\nk = 10\nnval <- round(nrow(trainset)  / k)\n\
  \n# CV loop\nOPT <- c()\n\nfor (i in 1:k) {\n  if (i < k) {\n    ind_val <- ind[((i\
  \ - 1) * nval + 1):(i * nval)]\n  } else{\n    ind_val <- ind[((i - 1) * nval +\
  \ 1):length(ind)]\n  }\n\n  data_val <- trainset[ind_val, ]\n  data_train <- trainset[-ind_val,\
  \ ]\n\n  RMSPE <- c()\n\n  for (s in 1:nrow(grid)) {\n    model <- loess(\n    \
  \  y ~ x,\n      control = loess.control(surface = \"direct\"),\n      degree =\
  \ grid[s, 2],\n      span = grid[s, 1],\n      data = data_train\n    )\n\n    fit\
  \ <- predict(model, data_val$x)\n    RMSPE[s] <- sqrt(mean((data_val$y - fit) ^\
  \ 2))\n  }\n  OPT[i] <- which.min(RMSPE)\n}\n\n# Hyperparameters\nopgrid <- grid[OPT,\
  \ ]\ncolnames(opgrid) <- c(\"span\", \"degree\")\nrownames(opgrid) <- c(1:10)\n\
  opt_degree <- raster::modal(opgrid[, 2])\nopt_degree\n```\n\n```\n## [1] 2\n```\n\
  \n```r\nopt_span <- mean(opgrid[, 1])\nopt_span\n```\n\n```\n## [1] 0.358\n```\n\
  \n```r\n# Using the test set for final evaluation ******\nmodel <- loess(\n  y ~\
  \ x,\n  control = loess.control(surface = \"direct\"),\n  degree = opt_degree,\n\
  \  span = opt_span,\n  data = trainset\n)\n\nfit <- predict(model, testset$x)\n\
  RMSPE_test <- sqrt(mean((testset$y - fit) ^ 2))\nRMSPE_test\n```\n\n```\n## [1]\
  \ 0.2598607\n```\n\n我们构建的是一个通过试错来`学习`的算法。然而，我们还需要最后一步来完成这个过程：不再只做 90% 的训练划分，我们需要多次这样做，并使用平均\
  \ `RMSPE test` 以及与之相关的不确定性（其变化）作为我们的最终指标。\n\n```r\n# Using the same data\nn = 1000\n\
  set.seed(1)\nx <- sort(runif(n) * 2 * pi)\ny <- sin(x) + rnorm(n) / 4\ndata <- data.frame(y,\
  \ x)\n\n# Grid\ngrid <- expand.grid(seq(from = 0.01, to = 1, by = 0.02), c(1, 2))\n\
  \nt = 100 # number of times we loop\nRMSPE_test <- c() # container for 100 RMSPE's\n\
  \nfor (l in 1:t) {\n\n  # Training-test split\n  set.seed(10 + l)\n  sh_ind <- sample(nrow(data),\
  \ 0.20 * nrow(data), replace = FALSE)\n  testset <- data[sh_ind, ] #20% of data\
  \ set a side\n  trainset <- data[-sh_ind,]\n\n  # k-CV, which is the same as before\n\
  \  set.seed(100+l)\n  ind <- sample(nrow(trainset), nrow(trainset), replace = FALSE)\n\
  \  k = 10\n  nval <- round(nrow(trainset)  / k)\n\n  # CV loop\n  OPT <- c()\n\n\
  \  for (i in 1:k) {\n    if (i < k) {\n      ind_val <- ind[((i - 1) * nval + 1):(i\
  \ * nval)]\n    } else{\n      ind_val <- ind[((i - 1) * nval + 1):length(ind)]\n\
  \    }\n\n    data_val <- trainset[ind_val, ]\n    data_train <- trainset[-ind_val,\
  \ ]\n\n    RMSPE <- c()\n\n    for (s in 1:nrow(grid)) {\n      model <- loess(\n\
  \        y ~ x,\n        control = loess.control(surface = \"direct\"),\n      \
  \  degree = grid[s, 2],\n        span = grid[s, 1],\n        data = data_train\n\
  \      )\n\n      fit <- predict(model, data_val$x)\n      RMSPE[s] <- sqrt(mean((data_val$y\
  \ - fit) ^ 2))\n    }\n    OPT[i] <- which.min(RMSPE)\n  }\n\n  # Hyperparameters\n\
  \  opgrid <- grid[OPT, ]\n  colnames(opgrid) <- c(\"span\", \"degree\")\n  rownames(opgrid)\
  \ <- c(1:10)\n  opt_degree <- raster::modal(opgrid[, 2])\n  opt_span <- mean(opgrid[,\
  \ 1])\n\n  # Using the test set for final evaluation\n  model <- loess(\n    y ~\
  \ x,\n    control = loess.control(surface = \"direct\"),\n    degree = opt_degree,\n\
  \    span = opt_span,\n    data = trainset\n  )\n  fit <- predict(model, testset$x)\n\
  \  RMSPE_test[l] <- sqrt(mean((testset$y - fit) ^ 2))\n}\n```\n\n现在我们可以看到平均 RMSPE\
  \ 及其方差：\n\n```r\nplot(RMSPE_test, col = \"red\")\nabline(a = mean(RMSPE_test),\n\
  \       b = 0,\n       col = \"green\",\n       lwd = 3)\n```\n\n![](img/Fig09_04.jpg)\n\
  \n```r\nmean(RMSPE_test)\n```\n\n```\n## [1] 0.2595155\n```\n\n```r\nvar(RMSPE_test)\n\
  ```\n\n```\n## [1] 0.000154271\n```\n\n### 9.5 Bootstrap Search\n\n与交叉验证类似，自助法是另一种强大的重采样方法，通过从原始数据中随机有回采样创建多个数据集（也称为自助样本）。由于是有回采样，自助样本可能包含多个相同的原始案例，也可能排除其他原始案例。虽然自助的主要用途是获取估计的标准误差，但我们可以将这些省略的原始案例放入一个样本中形成留出集，称为袋外观测（OOB）。平均而言，训练集和\
  \ OOB 之间的划分大约为 65%–35%。这是一个简单的应用：\n\n```r\nx_train <- unique(sample(1000, 1000,\
  \ replace = TRUE))\nlength(x_train)/1000 # % of observation in training set\n```\n\
  \n```\n## [1] 0.619\n```\n\n```r\n1 - length(x_train)/1000 # % of observations in\
  \ OOB\n```\n\n```\n## [1] 0.381\n```\n\n在后续章节中，我们将有很多自助网格搜索应用。让我们用相同的示例进行第一次应用。\n\
  \n```r\n# Using the same data\nn = 1000\nset.seed(1)\nx <- sort(runif(n) * 2 * pi)\n\
  y <- sin(x) + rnorm(n) / 4\ndata <- data.frame(y, x)\n\n# Grid\ngrid <- expand.grid(seq(from\
  \ = 0.01, to = 1, by = 0.02), c(1, 2))\n\nt = 100 # number of times we loop\nRMSPE_test\
  \ <- c() # container for 100 RMSPE's\n\nfor (l in 1:t) {\n\n  # Training-test split\n\
  \  set.seed(10 + l)\n  sh_ind <- sample(nrow(data), 0.20 * nrow(data), replace =\
  \ FALSE)\n  testset <- data[sh_ind, ] #20% of data set a side\n  trainset <- data[-sh_ind,]\n\
  \n  # OOB loops\n  OPT <- c()\n\n  for (i in 1:10) {\n    ind <- unique(sample(nrow(trainset),\
  \ nrow(trainset), replace = TRUE))\n    data_val <- trainset[-ind, ] # OOB\n   \
  \ data_train <- trainset[ind, ]\n\n    RMSPE <- c()\n\n    for (s in 1:nrow(grid))\
  \ {\n      model <- loess(\n        y ~ x,\n        control = loess.control(surface\
  \ = \"direct\"),\n        degree = grid[s, 2],\n        span = grid[s, 1],\n   \
  \     data = data_train\n      )\n\n      fit <- predict(model, data_val$x)\n  \
  \    RMSPE[s] <- sqrt(mean((data_val$y - fit) ^ 2))\n    }\n    OPT[i] <- which.min(RMSPE)\n\
  \  }\n\n  # Hyperparameters\n  opgrid <- grid[OPT, ]\n  colnames(opgrid) <- c(\"\
  span\", \"degree\")\n  rownames(opgrid) <- c(1:10)\n  opt_degree <- raster::modal(opgrid[,\
  \ 2])\n  opt_span <- mean(opgrid[, 1])\n\n  # Using the test set for final evaluation\n\
  \  model <- loess(\n    y ~ x,\n    control = loess.control(surface = \"direct\"\
  ),\n    degree = opt_degree,\n    span = opt_span,\n    data = trainset\n  )\n \
  \ fit <- predict(model, testset$x)\n  RMSPE_test[l] <- sqrt(mean((testset$y - fit)\
  \ ^ 2))\n}\n```\n\n\n\n\n\n```r\nplot(RMSPE_test, col = \"red\")\nabline(a = mean(RMSPE_test),\n\
  \       b = 0,\n       col = \"green\",\n       lwd = 3)\n```\n\n![](img/Fig09_05.jpg)\n\
  \n```r\nmean(RMSPE_test)\n```\n\n```\n## [1] 0.259672\n```\n\n```\nvar(RMSPE_test)\n\
  ```\n\n```\n## [1] 0.0001514393\n```\n\n最后，我们可以改变循环的顺序：\n\n```r\n# 使用相同的数据\nn =\
  \ 1000\nset.seed(1)\nx <- sort(runif(n) * 2 * pi)\ny <- sin(x) + rnorm(n) / 4\n\
  data <- data.frame(y, x)\n\n# 网格\ngrid <- expand.grid(seq(from = 0.01, to = 1, by\
  \ = 0.02), c(1, 2))\n\nt = 100 # 循环的次数\nRMSPE_test <- c() # 用于存储 100 个 RMSPE 的容器\n\
  \nfor (l in 1:t) {\n  # 训练集-测试集划分\n  set.seed(10 + l)\n  sh_ind <- sample(nrow(data),\
  \ 0.20 * nrow(data), replace = FALSE)\n  testset <- data[sh_ind,] # 留出 20%的数据\n\
  \  trainset <- data[-sh_ind, ]\n\n  OPT <- c()\n\n  # 网格循环\n  for (s in 1:nrow(grid))\
  \ {\n    RMSPE <- c()\n\n    # OOB（袋外数据）循环\n    for (i in 1:10) {\n      set.seed(i\
  \ + 100)\n      ind <-\n        unique(sample(nrow(trainset), nrow(trainset), replace\
  \ = TRUE))\n      data_val <- trainset[-ind,] # OOB\n      data_train <- trainset[ind,]\n\
  \n      model <- loess(\n        y ~ x,\n        control = loess.control(surface\
  \ = \"direct\"),\n        degree = grid[s, 2],\n        span = grid[s, 1],\n   \
  \     data = data_train\n      )\n\n      fit <- predict(model, data_val$x)\n  \
  \    RMSPE[i] <- sqrt(mean((data_val$y - fit) ^ 2))\n    }\n    OPT[s] <- mean(RMSPE)\n\
  \  }\n\n  # 测试 RMSPE\n  opgrid <- grid[which.min(OPT),]\n  model <- loess(\n   \
  \ y ~ x,\n    control = loess.control(surface = \"direct\"),\n    degree = opgrid[,\
  \ 2],\n    span = opgrid[, 1],\n    data = trainset\n  )\n  fit <- predict(model,\
  \ testset$x)\n  RMSPE_test[l] <- sqrt(mean((testset$y - fit) ^ 2))\n}\n```\n\n现在我们可以看到平均\
  \ RMSPE 及其方差：\n\n```r\nplot(RMSPE_test, col = \"red\")\nabline(a = mean(RMSPE_test),\n\
  \       b = 0,\n       col = \"green\",\n       lwd = 3)\n```\n\n![](img/Fig09_06.jpg)\n\
  \n```r\nmean(RMSPE_test)\n```\n\n```\n## [1] 0.2593541\n```\n\n```\nvar(RMSPE_test)\n\
  ```\n\n```\n## [1] 0.0001504046\n```\n\n结果相似，但代码更整洁。当数据是时间序列时会发生什么？\n\n### 9.6 当数据是时间序列时\n\
  \n虽然我们有一个关于时间序列数据预测的专门章节（第 9.7 节](#C_013_c9.xhtml#h9_7)），但我们将通过比较网格搜索中时间序列与横截面数据的本质区别来完成本章。\n\
  \n我们将使用 R 中预加载的 `EuStockMarkets` 数据集。数据包含了欧洲主要股票指数的每日收盘价：德国 DAX (Ibis)、瑞士 SMI、法国\
  \ CAC 和英国 FTSE。数据是按工作时间进行采样的，即忽略了周末和节假日。我们将关注 FTSE。以下是数据及其图表：\n\n```r\n# 数据\ndata\
  \ <- as.data.frame(EuStockMarkets)\nday_index <- seq(1, nrow(data), by = 1)\ndata\
  \ <- cbind(data, day_index)\nhead(data)\n```\n\n```r\n##       DAX    SMI    CAC\
  \   FTSE day_index\n## 1 1628.75 1678.1 1772.8 2443.6         1\n## 2 1613.63 1688.5\
  \ 1750.5 2460.2         2\n## 3 1606.51 1678.6 1718.0 2448.2         3\n## 4 1621.04\
  \ 1684.1 1708.1 2470.4         4\n## 5 1618.16 1686.6 1723.1 2484.7         5\n\
  ## 6 1610.61 1671.6 1714.3 2466.8         6\n```\n\n```r\nplot(\n  data$day_index,\n\
  \  data$FTSE,\n  col = \"orange\",\n  cex.main = 0.80,\n  cex.axis = 0.75,\n  type\
  \ = \"l\"\n)\n```\n\n![](img/Fig09_07.jpg)\n\n我们可以使用平滑方法在存在噪声数据的情况下检测趋势，特别是在趋势形状未知的情况下。分解法可以显示数据的组成部分：趋势、季节性波动和噪声，噪声是在移除趋势（和季节性）后剩余的、是*可预测的*残差部分。这里是使用加法分解对\
  \ FTSE 的插图：\n\n```r\ntsd <- EuStockMarkets\nsd <- decompose(tsd[, 4])\nplot(sd,\
  \ col = \"red\")\n```\n\n![](img/Fig09_08.jpg)\n\n将趋势从噪声中分离将使我们能够预测未来的值。学习了如何建模算法后，我们也可以训练\
  \ `loess()` 来提取趋势。下面展示了几条平滑线以视觉化差异：\n\n```r\nplot(\n  data$day_index,\n  data$FTSE,\n\
  \  type = \"l\",\n  col = \"red\",\n  cex.main = 0.80,\n  cex.axis = 0.75,\n  lwd\
  \ = 2\n)\nlines(data$day_index,\n      predict(lm(FTSE ~ day_index, data = data)),\
  \ lwd = 2, col = \"green\")\nlines(data$day_index,\n      predict(loess(FTSE ~ day_index,\
  \ data = data, span = 0.5)), lwd = 2, col = \"blue\")\nlines(data$day_index,\n \
  \     predict(loess(FTSE ~ day_index, data = data, span = 0.3)), lwd = 2, col =\
  \ \"black\")\nlines(data$day_index,\n      predict(loess(FTSE ~ day_index, data\
  \ = data, span = 0.9)), lwd = 2, col = \"yellow\")\n```\n\n![](img/Fig09_09.jpg)\n\
  \n在噪声数据中可以使用平滑方法来检测趋势，特别是在趋势形状未知的情况下。分解法可以显示数据的组成部分：趋势、季节性波动和噪声，噪声是在移除趋势（和季节性）后剩余的、是*可预测的*残差部分。这里是使用加法分解对\
  \ FTSE 的插图：\n\n将趋势从噪声中分离将使我们能够预测未来的值。学习了如何建模算法后，我们也可以训练 `loess()` 来提取趋势。下面展示了几条平滑线以视觉化差异：\n\
  \n![](img/Fig09_10.jpg)\n\n线性趋势似乎是不合适的，因为它欠拟合。像 `loess()` 这样的平滑方法会是更好的选择。验证时间数据的一种方法是在交叉验证时保持时间顺序，这样每个折叠的训练数据都在测试数据之前。这种验证方法被称为`h\
  \ 步交叉验证`（还有一种方法被称为`滑动窗口交叉验证`）。下面我们可以看到这种交叉验证的插图：\n\n![](img/Fig09_11.jpg)\n\n我们在不打乱数据的情况下来划分数据：\n\
  \n```r\nspan <- seq(from = 0.05, to = 1, by = 0.05)\n\n# h 步滚动交叉验证\nh <- 10\nopt\
  \ <- c()\n\n# 交叉验证循环\nnvalid <- round(nrow(data) / h)\n\n# 这出了十个切割点\ncut <- c(1)\n\
  for (j in 1:h) {\n  cut <- c(cut, nvalid * j)\n}\n\nfor (i in 1:h) {\n  if (i <\
  \ h) {\n    train <- data[(cut[1]:cut[i + 1]]\n  } else {\n    train <- data[cut[1]:cut[i]]\n\
  \  }\n  if (i + 2 < h)\n    valid <- data[(cut[i + 1]:cut[i + 2]]\n\n  RMSPE <-\
  \ c(rep(0), length(span)) # 存储 RMSPE 的矩阵\n\n  for (s in 1:length(span)) {\n    model\
  \ <-\n      loess(\n        FTSE ~ day_index,\n        control = loess.control(surface\
  \ = \"direct\"),\n        degree = 2,\n        span = span[s],\n        data = train\n\
  \      )\n    fit <- predict(model, valid$day_index)\n    RMSPE[s] <- sqrt(mean((valid$FTSE\
  \ - fit) ^ 2))\n  }\n  opt[i] <- which(RMSPE == min(RMSPE), arr.ind = TRUE)\n}\n\
  \n# 超参数\nopt_span <- mean(span[opt])\nopt_span\n```\n\n```\n## [1] 0.43\n```\n\n\
  ```r\nplot(\n  data$day_index,\n  data$FTSE,\n  type = \"l\",\n  col = \"gray\"\
  ,\n  cex.main = 0.80,\n  cex.axis = 0.75\n)\nlines(data$day_index,\n      predict(loess(\n\
  \        data$FTSE ~ data$day_index,\n        degree = 2, span = opt_span\n    \
  \  )),\n      lwd = 2,\n      col = \"red\")\n```\n\n\n\n\n在本节结束之前，请注意，随着样本量的增加，学习算法完成所需的时间会变长，对于截面数据尤其如此。这就是为什么会有其他交叉验证方法，它们只使用从原始样本中随机选择的子样本来加速验证和测试过程。你可以想象一下，如果数据集有一到两百万个观测值，传统的交叉验证会有多慢。\n\
  \n有一些方法可以加速训练过程。一种方法是增加我们网格中的 `delta`（增量），并识别出 `RMSPE` 变为最低的超参数范围。然后我们针对该特定范围使用更精细的增量来重塑网格。\n\
  \n另一种方法被称为随机网格搜索。在这种方法中，我们不是穷举所有超参数的组合组合，而是随机选择它们。这种方法可以在 James Bergstra 和 Yoshua\
  \ Bengio (2012) 的《用于超参数优化的随机搜索》一书中找到。\n\n为了加速网格搜索，我们还可以使用并行处理，使得每个循环都能分配到高性能计算机的独立核心上。我们将在书的后面介绍使用这些选项的几个应用。两种方法都包含在第\
  \ 14 章中。\n\n最后，我们没有在算法中使用函数。我们应该为算法中的每个主要过程创建函数，并将它们编译成一个简洁的“源”脚本。\n\n## 10 分类调优\n\
  \nDOI: [10.1201/9781003381501-13](https://doi.org/10.1201/9781003381501-13)\n\n\
  当我们训练分类模型时将使用哪些指标？例如，在 kNN 中，我们的超参数是 `k`，每个箱中的观测值数量。在我们应用 `mnist_27` 和 `Adult` 数据集中，`k`\
  \ 是通过名为 `accuracy` 的指标确定的。它是什么？如果 `k` 的选择取决于调优时使用的指标，我们是否可以通过使用不同的指标来提高预测性能？此外，准确率是从混淆矩阵计算出来的。然而，对于标记预测概率的一系列判别阈值，混淆矩阵会有不同。这些都是分类问题中的重要问题。我们将在本章回答这些问题。\n\
  \n### 10.1 混淆矩阵\n\n通常，无论是为了训练还是其他，衡量分类模型的性能都是一个重要问题，在拟合或训练模型之前必须有良好的理解。\n\n为了评估模型的拟合情况，我们可以查看其预测准确率。在分类问题中，这需要从预测值\
  \ `p(x)` 预测 `Y` 为 0 或 1，例如：\n\n$Ŷ = \\\\left\\\\{ \\\\begin{array}{ll} {1,} & {\\\
  \\hat{p}\\\\left( x\\\\_{1},\\\\ldots,x\\\\_{k} \\\\right) > \\\\frac{1}{2}} \\\\\
  \ {0,} & {\\\\hat{p}\\\\left( x\\\\_{1},\\\\ldots,x\\\\_{k} \\\\right) < \\\\frac{1}{2}}\
  \ \\\\ \\\\end{array} \\\\right.$\n\n从 $\\overset{\\\\hat{}}{p}\\left( x \\right)$\
  \ 到 `Ŷ` 的转换，整体预测准确率可以用矩阵总结：\n\n$\\\\begin{matrix} \\\\text{~Predicted~vs.~Reality}\
  \ & {Y = 1} & {Y = 0} \\\\\\\\ {Ŷ = 1} & \\\\text{~TP~}\\_{} & \\\\text{~FP~}\\\
  _{} \\\\\\\\ {Ŷ = 0} & \\\\text{~FN~}\\_{} & \\\\text{~TN~}\\_{} \\\\\\\\ \\\\end{matrix}$\n\
  \n其中，`TP`、`FP`、`FN` 和 `TN` 分别是真阳性、假阳性、假阴性和真阴性。此表也被称为 `Confusion Table` 或混淆矩阵。`confusion`（混淆）非常直观，因为很容易看出系统是如何混淆两个类别的。\n\
  \n从这个表中可以计算很多指标。让我们使用 Wikipedia 给出的例子：\n\n$\\\\begin{matrix} \\\\text{~Predicted~vs.~Reality}\
  \ & {Y = Cat} & {Y = Dog} \\\\\\\\ {Ŷ = Cat} & \\\\text{~5~}\\_{} & \\\\text{~2~}\\\
  _{} \\\\\\\\ {Ŷ = Dog} & \\\\text{~3~}\\_{} & \\\\text{~3~}\\_{} \\\\\\\\ \\\\end{matrix}$\n\
  \n根据这个混淆矩阵，算法预测了五只猫和三只狗。在分类问题中，这需要从预测值 `p(x)` 预测 `Y` 为 0 或 1。准确率是从混淆矩阵计算出来的。然而，对于标记预测概率的一系列判别阈值，混淆矩阵会有不同。\n\
  \n当数据集不平衡时，`(TP + TN)/n` 不可靠。\n\n### 10.2 性能衡量\n\n训练时应该使用哪些指标？通常，无论是为了训练还是其他，衡量分类模型的性能都是一个重要问题，在拟合或训练模型之前必须有良好的理解。以下是使用相同表格的各种指标总结：![](img/Fig10_01.jpg)\n\
  \n* `Accuracy`: 相对于观测值的正确数量。\n* `Balanced accuracy`: 当类别平衡差于 60%–40% 时，`(TP* + TN*/2`。\n\
  * `Precision`: 正确预测正性的比例。即预测为患癌症的患者中实际患癌症的比例，`TP/(TP + FP)`。\n* `Sensitivity`: 正确预测正性的比例。即实际患癌症被算法正确预测为患癌症的比例，`TP/(TP+FN)`。这也称为\
  \ `True Positive Rate` 或 `Recall`。\n* `Specificity`: 正确预测负性的比例。即未患癌症的患者被模型预测为非癌症的比例，这一指标也称为\
  \ True Positive Rate = `TN/(TN + FP)`。\n\n以下是总结：\n\n$\\\\begin{matrix} \\\\text{~Predicted~vs.~Reality}\
  \ & {Y = Cat} & {Y = Dog} \\\\\\\\ {Ŷ = Cat} & \\\\text{TPR~or~Sensitivity~}\\_{}\
  \ & \\\\text{FNR~or~Fall-out~}\\_{} \\\\\\\\ {Ŷ = Dog} & \\\\text{FNR~or~Miss~Rate~}\\\
  _{} & \\\\text{TNR~or~Specificity~}\\_{} \\\\\\\\ \\\\end{matrix}$\n\n`Kappa` 在大多数情况下也会被计算。这是一个有趣的指标，因为它将预测的实际性能与执行随机预测的结果进行比较。例如，假设你的模型预测\
  \ `Y` 的准确率为 95%。如果随机选择也能正确预测 70% 的 `Y`，那么你的预测能力会有有多大呢？让我们用一个例子：\n\n$\\\\begin{matrix}\
  \ \\\\text{~Predicted~vs.~Reality} & {Y = Cat} & {Y = Dog} \\\\\\\\ {Ŷ = Cat} &\
  \ \\\\text{~22~}\\_{} & \\\\text{~9~}\\_{} \\\\\\\\ {Ŷ = Dog} & \\\\text{~7~}\\\
  _{} & \\\\text{~13~}\\_{} \\\\\\\\ \\\\end{matrix}$\n\n\n\n在这种例中，准确率是 (22 + 13)/51\
  \ = 0.69。但其中有多少归功于模型性能呢？换句话说，猫和狗的分布也可以提供线索，从而达到某种水平的预测准确率。对于 TP 单元格，这可以通过观测准确率 (OA)\
  \ 和期望准确率 (EA) 之间的差计算出来：\n\n$(OA - EA)[TP]=Pr(\\hat{Y}=\\text{Cat})Pr(Y=\\text{Cat}|\\\
  hat{Y}=\\text{Cat})$\n\n如果我们使用联合概率和边缘概率定义，可以写为：\n\n$OA - EA = \\frac{m_{ij}}{n}\
  \ - \\frac{m_{i}m_{j}}{n^{2}}$\n\n这里是 **Kappa** 的计算：\n\n总数 `n` = 51，\n\nOA - EA\
  \ for TP = 22/51 - 31/51² = 0.0857\n\nOA - EA for TN = 13/51 - 20/51² = 0.0934\n\
  \n我们通过 1 - EA = 1 - 31/51² + 20/51² = 0.51 来归一化，如果预测是 100% 成功的。\n\n因此，**Kappa**:\
  \ (0.0857 + 0.0934)/(1 - 0.51) = 0.3655\n\n最后，**Youden J 统计量**也称为 **Informedness**（信息量），是一个捕捉预测性能的单一统计量：$J\
  \ = TPR + TNR$，范围在 0 到 1 之间，分别表示无效和完美预测。该指标与**受试者工作特征 (ROC)** 曲线相关，这是下一节的主题。\n\n\
  ## ROC 曲线\n\n我们的输出变量是分类的 (`Y` = 1 或 0）。大多数分类算法计算成功 (`Y` = 1）的概率。如果概率大于固定阈值（判定阈值），则假设预测成功\
  \ (`Y` = 1)；否则，假设预测失败。作为结果，混淆表中观测值与预测值的比较取决于阈值。模型作为阈值函数的预测准确率可以通过曲线下面积 (AUC) 来总结。受试者工作特征\
  \ (ROC) 曲线是一张图表，说明了二分类器真阳性率 (TPR) 和假阳性率 (FPR) 之间的权衡。模型的成功随着 TPR 的增加而不增加 FPR。ROC\
  \ 曲线在二战期间首次用于信号检测。可视化如下：\n\n![](img/Fig10.jpg)\n\n让我们从一个例子开始，我们有 100 个人，50 个 `y`1\
  \ 和 50 个 `y`0，这是平衡的。如果我们使用 0% 的判定阈值将所有人归为类别 1，或使用 100% 的阈值将所有人归为类别 2，那么：\n\n$\\\
  hat{Y} = \\left\\{\\begin{array}{ll} 1, & \\hat{p}(x_{1},\\ldots,x_{k}) > 0\\% \\\
  \\ 0, & \\hat{p}(x_{1},\\ldots,x_{k}) \\leq 0\\% \\end{array}\\right.$\n\n以及，\n\n\
  $\\hat{Y} = \\left\\{\\begin{array}{ll} 1, & \\hat{p}(x_{1},\\ldots,x_{k}) > 100\\\
  % \\\\ 0, & \\hat{p}(x_{1},\\ldots,x_{k}) \\leq 100\\% \\end{array}\\right.$\n\n\
  这会导致以下混淆表：\n\n$\\begin{matrix} \\text{预测 vs. 真实} & Y = 1 & Y = 0 \\\\ \\hat{Y} =\
  \ 1 & 50 & 0 \\\\ \\hat{Y} = 0 & 0 & 50 \\end{matrix}$\n\n$\\begin{matrix} \\text{预测\
  \ vs. 真实} & Y = 1 & Y = 0 \\\\ \\hat{Y} = 1 & 0 & 0 \\\\ \\hat{Y} = 0 & 50 & 50\
  \ \\end{matrix}$\n\n在第一情况下，TPR = 1 且 FPR = 1；在第二情况下，TPR = 0 且 FPR = 0。因此，当我们计算从\
  \ 0% 到 100% 不同阈值的所有可能的混淆表时，将相同数量的 (TPR, FPR) 点，每个点对应一个阈值。**ROC 曲线是连接这些点的曲线**。\n\n\
  让我们使用 *波士顿房价数据集* 的例子来说明 ROC：\n\n```r\nlibrary(MASS)\ndata(Boston)\n\n# 创建我们的二分类输出\n\
  data <- Boston[, -1]\ndata$dummy <- ifelse(Boston$medv > 25, 1, 0)\n\n# 使用逻辑回归\n\
  model <- glm(dummy ~ ., data = data, family = \"binomial\")\nsummary(model)\n```\n\
  \n```\n## Call:\n  glm(formula = dummy ~ ., family = \"binomial\", data = data)\n\
  \n## Deviance Residuals:\n     Min  1st Qu.   Median     Mean  3rd Qu.     Max.\n\
  -3.3498  -0.2806  0.0932  0.0006  3.3781\n\n## Coefficients:\n             Estimate\
  \  Std. Error z value Pr(|z|)\n(Intercept)  5.312511   4.876070   1.090 0.2759\n\
  crim        -0.011101   0.045322  -0.245 0.8063\nzn           0.010917   0.010834\
  \   1.008 0.3136\nindus       -0.110452   0.058740  -1.880 0.0600\nchas        \
  \ 0.966337   0.808997   1.194 0.2327\n```\n\n\n\n\n```r\n# We need to have containers\
  \ for the pairs of TPR and FPR\nTPR <- c()\nFPR <- c()\n\n# Now the loop\nfor (i\
  \ in 1:length(phat)) {\n  yHat <- model$fitted.values > phat[i]\n  conf_table <-\
  \ table(yHat, data$dummy)\n  ct <- as.matrix(conf_table)\n  if(sum(dim(ct))>3){\
  \ # here we ignore the thresholds 0 and 1\n    TPR[i] <- ct[2,2]/(ct[2,2]+ct[1,2])\n\
  \    FPR[i] <- ct[2,1]/(ct[1,1]+ct[2,1])\n  }\n}\nplot(FPR, TPR, col= \"blue\",\
  \ type = \"l\", main = \"ROC\", lwd = 3)\nabline(a = 0, b = 1, col=\"red\")\n```\n\
  \n![](img/Fig10_03.jpg)\n\n我们在在这条曲线上观察到几点。首先，TPF 和 FPR 之间存在权衡。大约在 TPR 达到 70% 后，通过增加\
  \ FPR 可以提高 TPF，这意味着如果我们更关注可能的最低 FPR，我们就可以将判别率固定在该点。\n\n其次，我们可以识别出使 TPR 和 FPR 之间距离最大的最佳判别阈值。换句话说，我们可以确定\
  \ TPR 的边际收益等于 FPR 边际成本的阈值。这可以通过 `Youden J Statistics`（`J = TPR + TNR - 1`）来实现，它可以识别出最佳判别阈值。注意\
  \ `TNR = 1 - FPR`。因此 `J = TPR - FPR`。\n\n```r\n# Youden's J Statistics\nJ <- TPR\
  \ - FPR\n# The best discriminating threshold\nphat[which.max(J)]\n```\n\n```r\n\
  ##       231\n## 0.1786863\n```\n\n```r\n# TPR and FPR at this threshold\nTPR[which.max(J)]\n\
  ```\n\n```r\n## [1] 0.9354839\n```\n\n```r\nFPR[which.max(J)]\n```\n\n```r\n## [1]\
  \ 0.1361257\n```\n\n```r\nJ[which.max(J)]\n```\n\n```r\n## [1] 0.7993582\n```\n\n\
  这个简单的示例表明，通过以下方式可以最佳（样本内）拟合：\n\n$Ŷ = \\\\left\\\\{ \\begin{array}{ll} {1,} & {\\\
  \\hat{p}\\\\left( x\\_{1},\\\\ldots,x\\_{k} \\\\right) > 17.86863\\\\%} \\\\\\\\\
  \ {0,} & {\\\\hat{p}\\\\left( x\\_{1},\\\\ldots,x\\_{k} \\\\right) \\leq 17.86863\\\
  \\%} \\\\\\\\ \\\\end{array} \\\\right.$\n\n### 10.4 AUC - 曲线下面积\n\n最后，我们通过 ROC\
  \ 曲线下的面积来衡量预测准确性。面积为 1 代表完美；面积为 0.5 代表预测毫无价值。这是因为 0.5 的面积意味着其性能并不比随机概率。\n\n![](img/Fig10_04.jpg)\n\
  \n例如，医疗程序诊断测试准确性的一种接受粗略指南是：\n\n0.90–1.00 = 优秀 (A)\n\n0.80–0.90 = 好 (B)\n\n0.70–0.80\
  \ = 中等 (C)\n\n0.60–0.70 = 差 (D)\n\n0.50–0.60 = 不及 (F)\n\n由于该公式及其推导超出了本章的范围，我们将使用\
  \ `ROCR` 包来计算它。\n\n```r\nlibrary(ROCR)\n\ndata$dummy <- c(ifelse(Boston$medv > 25,\
  \ 1, 0))\nmodel <- glm(dummy ~ ., data = data, family = \"binomial\")\nphat <- model$fitted.values\n\
  \nphat_df <- data.frame(phat, \"Y\" = data$dummy)\npred_rocr <- prediction(phat_df[,1],\
  \ phat_df[,2])\nperf <- performance(pred_rocr,\"tpr\",\"fpr\")\n\nplot(perf, colorize=TRUE)\n\
  abline(a = 0, b = 1)\n```\n\n![](img/Fig10_05.jpg)\n\n```r\nauc_ROCR <- performance(pred_rocr,\
  \ measure = \"auc\")\nAUC <- auc_ROCR@y.values[[1]]\nAUC\n```\n\n```r\n## [1] 0.9600363\n\
  ```\n\n这条 ROC 曲线与我们之前开发的曲线相同。当我们训练模型时，每次运行（不同的训练和测试集）都会得到不同的 AUC。训练集和验证集之间 AUC 的差异会导致不确定性。因此，用于比较替代模型的\
  \ AUC 渐近性质已成为讨论的话题。\n\n另一个重要的点是，虽然 AUC 代表曲线下的整个面积，但我们感兴趣的是特定的 TPR 或 FPR 位置。因此，对于任何给定的两个竞争算法，虽然一个预测算法的整体\
  \ AUC 更高，但另一个在特定位置可能有更好的 AUC。这个问题可以在以下摘自“与类别分类评估方法相关的错误实践”的图中看到。\n\n\n\n\n\n```r\n\
