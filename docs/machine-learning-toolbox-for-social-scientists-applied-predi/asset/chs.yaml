  \ 0.6238\n```\n\n\n\n\n第二种方法是依赖 `glmnet` 的内部训练过程 `cv.glmnet`，它是执行交叉验证的主要函数，并带有绘图和预测等多种辅助方法。以下脚本的部分与《R\
  \ 语言统计学习导论》（Gareth et al., 2022, 第 254 页）中的算法相同。这种方法对 `λ` 使用了特定的网格。我们还运行了 100 次相同的网格搜索以查看相关的不确定性。\n\
  \n```\n# With a defined grid on lambda\nbestlam <- c()\nmse <- c()\ngrid = 10 ^\
  \ seq(10, -2, length = 100)\n\nfor(i in 1:100){\n  set.seed(i)\n  train <- sample(1:nrow(X),\
  \ nrow(X) * 0.5) # 50% split\n  test <- c(-train)\n  ytest <- y[test]\n\n  #finding\
  \ lambda\n  cv.out <- cv.glmnet(X[train,], y[train], alpha = 0)\n  bestlam[i] <-\
  \ cv.out$lambda.min\n\n  #Predicting with that lambda\n  ridge.mod <- glmnet(X[train,],\
  \ y[train], alpha = 0,\n                      lambda = grid, thresh = 1e-12)\n \
  \ yhat <- predict(ridge.mod, s = bestlam[i], newx = X[test,])\n  mse[i] <- mean((yhat\
  \ - ytest)²)\n}\n\nmean(bestlam)\n```\n\n```\n## [1] 290.227\n```\n\n```\nmean(mse)\n\
