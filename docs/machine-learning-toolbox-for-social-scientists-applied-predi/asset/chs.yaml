  \n### 2.4.3 在 R 中估计 MLE\n\n（此处省略了原文中大量重复的公式描述，仅保留核心逻辑翻译）\n\n\n\n推断统计学中有两个世界：总体和样本。统计推断利用从同一总体中随机抽取的样本数据，对未知的总体参数提出命题。例如，如果我们想估计\
  \ `X` 的总体均值 `μ[X]`，我们使用 $\\overline{x} = n^{- 1}\\Sigma x_{i}$ 作为样本的估计量。选择 `n^−``x[i]`\
  \ 作为 `μ[X]` 的估计量似乎是常识，但为什么呢？选择一个“良好”估计量的标准是什么？这个问题的答案是计量经济学和因果分析的核心课题。为了进行适当的统计推断，所选的估计量必须是总体参数的最佳（B）线性（L）无偏（U）估计量（E）。\n\
  \n高斯-马尔可夫定理指出，只要满足对 PRF（`Y[i] = β[0] + β[1]x[i] + ε[i]`）的某些假设，样本回归函数（`Y[i] = β̂[0]\
  \ ⅅ+ β̂[1]x[i] ⅅ+ ϵ̂[i]`）中的 `β̂[0]` 和 `β̂[1]` 是 `β[0]` 和 `β[1]` 的 BLU 估计量。无偏性性质要求估计量的期望值等于所估计参数的真实值。在回归情况下，\n\
  \n$\\begin{array}{l} {E\\left\\lbrack {\\\\hat{\\beta}}\\_{0} \\right\\rbrack =\
  \ \\beta_{0}} \\\\ {E\\left\\lbrack {\\\\hat{\\beta}}\\_{1} \\right\\rbrack = \\\
  beta_{1}} \\\\ \\\\\\end{array}$\n\n采样分布的概念用于从随机样本推广感兴趣的总体。研究总体时，从该总体的每个成员获取数据通常是不现实或可能的。相反，我们提取随机样本，并使用该样本的数据估计总体参数。\n\
  \n假设我们想估计当地人口的平均年龄。你从总体中随机抽取 200 个人的样本，计算平均年龄为 23 岁。但如果你继续采样 1000 次（1000 个样本，每个样本\
  \ 200 人），每个样本都会给出一个不同的估计值。哪一个应该用于推广（总体）？一个都不是。我们知道，从 1000 个样本计算出的所有平均年龄的平均值将是最正确的总体平均值，但前提是估计量是无偏的。对于简单平均值，证明是简单的。让我们为\
  \ `μx` 创建自己的采样分布。我们将从 `X` `˜` `N` (5*,* 1) 中抽取 1000 个样本。每个样本将有 200 个 `x`。因此，我们将计算\
  \ 1000 个 $\\overline{x}$。目标是查看\n\n$E\\left( \\overline{x} \\right) = \\mu_{x}$\n\
  \n进行这种模拟有多种方法。\n\n```r\n# 总体 (100 万个 x)\npop_x <- rnorm(1000000, mean = 5, sd =\
  \ 1)\n\n# 随机采样\nn <- 200 # 每个样本中 x 的数量\nmcn <- 1000 # 样本数量\nsamp <- matrix(0, nrow\
  \ = n, ncol = mcn) # 一个容器：200 x 1000 的矩阵\nfor(i in 1:mcn){\n  samp[,i] <- sample(pop_x,\
  \ n, replace = TRUE)\n}\n\nxbar <- colMeans(samp) # 计算列均值\nmxbar <- mean(xbar) #\
  \ xbars 的平均值\nround(mxbar, 2)\n# [1] 5\nhist(xbar, breaks=20)\n![](img/Fig02_11.jpg)\n\
  \n这是 $\\overline{x}$ 的采样分布，$\\overline{x}$ 是 `μ[x]` 的无偏估计量。但这足够吗？我们可能有另一个估计量 $\\\
  overset{\\sim}{x} = (x_{1} + x_{2})/2$，它也可以是无偏估计量。\n\n```r\nxtilde <- apply(samp,\
  \ 2, function(x) (head(x,1)+ tail(x,1))/2)\nmtilde <- mean(xtilde) # xbars 的平均值\n\
  round(mtilde, 2)\n# [1] 5.03\nhist(xtilde, breaks=20)\n```\n\n现在，如果我们对无偏估计量满意，如何在所有其他无偏估计量中选择一个？如何定义最佳估计量？答案很简单：选择方差最小的。\n\
  \n```r\nvar(xbar)\n# [1] 0.00472\nvar(xtilde)\n# [1] 0.47128\n```\n\n为什么我们需要最小方差？记住，更大的方差意味着\
  \ `β̂[0]` 和 `β̂[1]` 的差异更大。由于我们在实践中只有一个样本，高采样方差会导致结果偏离总体 $\\overline{x}$，这由置信区间捕捉。首先注意，创建一个方差很小的\
  \ `β[1]` 估计量很容易，但不是无偏的。例如，`θ̂[BAD] = 5`。由于 `θ̂[BAD]` 是常数，\n\n$\\begin{array}{r}\
  \ {{\\text{V}}\\text{a}}\\left\\lbrack {\\hat{\\theta}}\\_{BAD} \\right\\rbrack\
  \ = 0}\\end{array}$\n\n由于 `E[θ̂[BAD]]=5`，我们可以说 `θ̂[BAD]` 即使具有最小方差，它也不是一个良好的估计量。因此，无偏性和最小方差有两个条件：我们寻找无偏估计量中方差最小的估计量。\n\
  \n### 遗漏变量 (OVB)\n\n在回归分析中，包含必要的变量来正确设定回归模型是重要的。当由于必要变量导致模型设定错误时，得到的样本回归函数（SRF）将是真实生成模型（DGM）的偏估计。这种现象被称为遗漏变量（OVB）。\n\
  \n虽然 OVB 的解决方案看起来很简单——在 DGM 中包含所有必要变量来正确设定 SRF——但识别所有必要变量通常很困难，因为我们可能不知道真实的 DGM。此外，我们需要控制混杂变量，这些变量与结果\
  \ `y[i]` 和解释变量 `x[i]` 相关。当我们从模型中省略混杂变量时，解释变量对结果的影响可能是误导且有偏的。\n\nOVB 的经典案例是冰淇淋销量与犯罪率之间的正相关。如果我们从分析中省略混杂变量天气，冰淇淋销量对犯罪率的估计将是正且显著的。这个例子说明了识别和控制混杂变量以获得回归模型变量之间准确估计的重要性。\n\
  \n我们正在寻找在控制了 `y[i]` 的所有其他原因后，`x[i]` 对 `y[i]` 的隔离影响。让我们用维恩图来说明。\n\n```r\nlibrary(broom)\n\
  library(faux)\nlibrary(eul) # 用于 维恩图\nlibrary(tidyverse)\n\n# 相关变量和 PRF\nset.seed(1234)\n\
  df <- rnorm_multi(n = 100,\n                  mu = c(10, 9, 9),\n              \
  \    sd = c(2, 1.7, 1.3),\n                  r = c(0.5, 0.4, 0.8),\n           \
  \       varnames = c(\"Y\", \"X1\", \"X2\"),\n                  empirical = FALSE)\n\
  ```\n\n这是我们的模拟数据和 SRF：\n\n```r\nhead(df, 6)\n```\n\n```\n##           Y        X1\
  \        X2\n## 1 12.510529 10.266830 10.180426\n## 2  9.058085  8.682856  9.391148\n\
  ## 3  8.223374  7.284975  7.968759\n## 4 13.509343 12.554053 12.030183\n## 5  8.419466\
  \  8.878325  9.273916\n## 6  9.337398  7.832841  8.773532\n```\n\n```r\ncor(df)\n\
  ```\n\n```\n##            Y        X1        X2\n## Y  1.0000000 0.4739343 0.3878172\n\
  ## X1 0.4739343 1.0000000 0.8107924\n## X2 0.3878172 0.8107924 1.000000\n```\n\n\
  ```r\nlm(Y ~., data = df) # 真实模型\n```\n\n```\n##\n## Call:\nlm(formula = Y ~ .,\
  \ data = df)\n##\n## Coefficients:\n## (Intercept)           X1           X2\n \
  \    5.15034      0.54801      0.01717\n```\n\n这张维恩图反映了在 SRF 中省略 `X[2]` 时 `X[1]`\
  \ 的影响 **B**。其大小也反映了方差的分解。因此，**B**/(**A** + **D**) 是 *y* 由 *X[1]* 解释的百分比：\n\n\n\n\
  \n\n\n因此，当我们省略 `X[2]` 时，`X[1]` 的影响是 `D` + `G` 的面积，而真实影响是 `D`。当然，如果 `X[1]` 和 `X[2]`\
  \ 是独立的，那么省略 `X[2]` 就没有问题。这等同于说，如果我们有独立的回归变量，对每个变量进行单独回归得到的结果将与将它们结合在一起时得到的结果相同。然而，当遗漏变量与回归变量（`X`）相关时，误差项的条件期望将不为零，即\
  \ `E(ε|x) *≠= 0`。在 Andrew Heiss 的文章可以找到用维恩图演示回归极极示例。\n\n这里有一个来自 Stock and Watson\
  \ (2015, p. 196) 的一个更具现实意义的例子：假设我们想理解测试成绩与班级人数之间的关系。如果在不考虑可能存在的混杂因素的情况下运行回归，我们可能会遇到上面描述的问题。这是因为学区内英语学习者的百分比可能与测试成绩和班级人数都相关。因此，“真实”模型应该像方程\
  \ 2.15 所示：\n\n`Test Score = β[0] + β[1]STR + β[2]PctEL + ε[i], (2.15)`\n\n其中 `STR`\
  \ 和 `PctEL` 是相关的，即 `ρ[STR], PctEL *≠= 0`。我们可以在 2.15 中省略 `PctEL` 并将其估计为：\n\n`Test\
  \ Score = β̂[0] + β̂[1]STR + v[i]. (2.16)`\n\n从直觉上来说，误差是回归中的残差，因为它们收集了所有未在回归中被显式建模但随机影响结果的“其他”因素。它们被认为与模型中的所有回归变量都是相互独立的。当作为遗漏变量的\
  \ `PctEL` 合并到残差（`v[i]`）中时，`β̂[1]` 将无法反映 `STR`（生师比/人数）变化对测试成绩的真实影响。我们可以形式化地看到这种遗漏的结果：\n\
  \n```\n{\\hat{\\beta}}_{1} = \\frac{{\\text{C}\\text{o}\\text{v}}\\left( STR_{\\\
  mathit{i}},Test~Score_{\\mathit{i}} \\right)}{{\\text{V}\\text{a}\\text{r}}\\left(\
  \ STR_{\\mathit{i}} \\right)} = \\frac{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x}\
  \ \\right)\\left( y_{i} - ȳ \\right)}{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x}\
  \ \\right)^{2}} = \\frac{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x} \\right)y_{i}}{\\\
  sum\\limits\\_{i}}\\left( x_{i} - \\overline{x} \\right)x_{i}}\n```\n\n我们可以将 `y[i]`\
  \ 代入最后一项并简化：\n\n```\n{\\hat{\\beta}}_{1} = \\frac{\\sum\\limits\\_{i}}\\left( x_{i}\
  \ - \\overline{x} \\right)\\left( \\beta_{0} + \\beta_{1}x_{i} + \\beta_{2}z_{i}\
  \ + \\epsilon_{i} \\right)}{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x} \\\
  right)x_{i}} = \\beta_{1} + \\beta_{2}\\frac{\\sum\\limits\\_{i}}\\left( x_{i} -\
  \ \\overline{x} \\right)z_{i}}{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x}\
  \ \\right)x_{i}} + \\frac{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x} \\right)\\\
  epsilon_{i}}{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x} \\right)x_{i}}\n\
  ```\n\n当作为遗漏变量的 `PctEL` 加入残差（`v[i]`）中时，`β̂[1]` 将不会反映 `STR` 变化对测试成绩的真实影响。我们可以形式化地看到这种遗漏的结果如下：\n\
  \n由于变量遗漏，$\\beta_{2}\\frac{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x} \\\
  right)z_{i}}{\\sum\\limits\\_{i}}\\left( x_{i} - \\overline{x} \\right)x_{i}}$ 项导致了偏误。这里\
  \ `z` 是 `PctEL`，`x` 是 `STR`。\n\n（注：原文提供的公式块和后续文本似乎存在重复或断裂，翻译时已根据逻辑进行了对齐处理，保持了核心数学含义不变。）\n\
  \n\n\n\n如果我们要添加非线性项，将选择哪些变量以及选择多大程度的多项式项？此外，如果预测变量之间存在交互作用，回归变量对响应变量的影响将根据其他预测变量的值而改变。因此，在寻找模型时，我们需要假设“真实”的总体模型（DGM）是什么。\n\
  \n模型将如何被`fit`（拟合）？尽管我们已经见过两种最常用的技术 `OLS` 和 `MLE`，但文献中还有其他技术。\n\n解决这三个问题是定义变量间关系的基本步骤，且在因果分析和预测分析中可能有所不同。\n\
  \n### 2.7 因果模型 vs. 预测模型\n\n对数据进行模型建模的目的通常是为了实现两个目标之一：解释响应变量与解释变量之间的因果关系，或者预测结果变量。\n\
  \n如果目标是解释响应变量与解释变量之间的因果关系，我们寻求一个能够洞察解释变量的变化如何影响响应变量的模型。如果目标是预测结果变量，我们寻求一个能够根据预测变量的值准确预测响应变量的值的模型。\n\
  \n需要注意的是，根据分析的目标和背景，模型可以同时用于解释和预测目的。在实践中，模型的选择取决于分析的具体目标和可用数据。\n\n### 2.7.1 因果模型\n\
  \n如果模型的目标是解释响应变量与一个或多个解释变量之间的因果关系，我们寻找的是一个`小且可解释`（small and interpretable）但仍然能良好拟合数据的模型。\n\
  \n假设我们想根据汽车的属性（`weight`、`year`、`hp` 等）来解释燃料效率（mpg - 每英里里程）。如果我们试图理解燃料效率是如何由汽车属性决定的，我们可能想要`不那么复杂且可解释`（less\
  \ complex and interpretable）的模型。请注意，参数模型（特别是任何规模的线性模型）是最具有解释性的模型。如果我们的目标是根据给定属性预测汽车是否会被分类为高效，我们可能会放弃解释性，使用可能具有更好预测准确性的复杂方法。我们稍后将看到许多权衡的例子。\n\
  \n为了寻找小且可解释的模型，我们使用`推断`（inferential）技术，并对模型中的误差项提出额外的假设：\n\n```\nϵ ∼ N(0,*σ²)\n\
  ```\n\n该假设认为误差服从具有共同方差的正态分布。此外，该假设还认为误差项的期望值为零。换句话说，模型必须正确指定，不能有遗漏变量。\n\n理解因果关系的一个非常重要的问题是区分两个用于描述变量间关系的术语：`causation`（因果关系）和\
  \ `correlation`（相关性），两者都`explain`（解释）Y 和 X 之间的关系。相关性通常也被称为关联。一个很好的例子是特定地区冰淇淋销量与犯罪率之间的经验关系。研究表明（(Pearl\
  \ and Mackenzie, 2018)），这两个指标之间的相关性是强且正相关的。仅仅因为这两个变量相关并不意味着一个导致另一个（随着人们吃更多冰淇淋，他们犯了更多罪吗？）。可能存在第三个变量同时解释两者！而且已知，炎热的天气就是导致冰淇淋销量和犯罪率同时上升的第三缺失因素。你可以在\
  \ Spurious Correlations 网站看到更多荒谬的例子（[`tylervigen.com/spurious-correlations`](http://tylervigen.com/spurious-correlations)）。\n\
  \n因果关系区别于相关性，因为它反映了一个变量直接影响另一个变量的关系。因果关系不是变量之间可能由第三个隐藏变量引起的关联，而是意味着变量之间存在直接联系。\n\
  \n### 2.7.2 预测模型\n\n（注：原文此处存在格式断层，从 \"Causation is distinct from...\" 之后直接接了 \"\
  ### 2.7.1 Predictive Models\"，根据逻辑推断此处应翻译正文内容）\n\n因果关系区别于相关性，因为反映反映了一个变量直接影响另一个变量的关系。与其说是变量之间可能由第三个隐藏变量引起的关联，因果关系意味着变量之间存在直接联系。\n\
  \n（由于原文文本混乱，此处已按要求翻译翻译）\n\n\n\n我们将在接下来的章节中详细回答这个问题，但现在，让我们先进行第一个仿真练习。\n\n### 2.8\
  \ 仿真\n\n仿真是观察统计学论点是否真实的工具。在仿真中，我们知道 `DGP`，因为我们通过选定的模型和一组参数来定义它。R 最大的优势之一就是它能够以简单的设计执行仿真。我们将在第\
  \ 37 章中看到更多关于仿真的例子。\n\n我们将从一个数据生成模型（DGM）中生成一组 `Y` 的观测样本：\n\n```R\nset.seed(1)\n\
  X <- seq(from = 0, to = 20, by = 0.1)\ndgm <- 500 + 20*X - 90*sin(X)           \
  \        #这是我们的 DGM\n\ny = dgm + rnorm(length(X), mean = 10, sd = 100) #这是我们的 DGP\n\
  data = data.frame(y, X)\n\nplot(X, y, col='deepskyblue4',\n     xlab='X', main='Observed\
  \ data & DGM')\nlines(X, dgm, col='firebrick1', lwd=2)\n```\n\n![](img/Fig02_18.jpg)\n\
  \n这是我们仿真数据的散图。仿真数据点是蓝点，红线是 DGM 或系统部分。现在我们有了数据（`X` 和 `Y`），而且我们也知道产生这些观测值的底层数据生成过程（DGP）。让我们假设我们不知道\
  \ `DGP`。我们的任务是根据已有的数据估计 DGM。我们将使用三种替代模型来估计真实的 DGM。\n\n```R\n# 线性模型\nmodel1 <- lm(y\
  \ ~ X)\nplot(X, y, col='deepskyblue4', xlab='X', main='Linear')\nlines(X, model1$fitted.values,\
  \ col = \"blue\", lwd=2)\n```\n\n![](img/Fig02_19.jpg)\n\n```R\n# 多项式模型（有更简单的方法！）\n\
  model2 <- lm(y ~ X + I(X²) + I(X³) + I(X⁴) +  I(X⁵) + I(X⁶) + I(X⁷)\n          \
  \   + I(X⁸)+ I(X⁹) + I(X¹⁰) + I(X¹¹) + I(X¹²) + I(X¹³)\n             + I(X¹⁴)+ I(X¹⁵)\
  \ + I(X¹⁶) + I(X¹⁷) + I(X¹⁸), data=data)\nplot(X, y, col=\n'deepskyblue4',xlab='X',main='Polynomial')\n\
  lines(X,fitted(model2),col='darkgreen',lwd=2)\n```\n\n![](img/Fig02_20.jpg)\n\n\
  ```R\n# 非参数\nmodel3 <- smooth.spline(X, y, df=200)\nplot(X, y, col='deepskyblue4',\
  \ xlab='X', main='Spline')\nlines(model3, col='orange', lwd=2)\n```\n\n![](img/Fig02_21.jpg)\n\
  \n从图中可以看出，非参数模型（我们稍后会看到它是什么）应该具有最小的 RMSPE。\n\n```R\n# 创建一个 RMSPE 函数\nrmse = function(actual,\
  \ predicted) {\n  sqrt(mean((actual - predicted) ^ 2))\n}\n\n# 使用“已见”数据通过 3 个模型的预测值\n\
  predicted1 <- fitted(model1)\npredicted2 <- fitted(model2)\npredicted3 <- predict(model3,\
  \ X)\n\n# 注意所有模型的实际 y 都是相同的\nrmse1_s <- rmse(predicted1, y)\nrmse2_s <- rmse(predicted2,\
  \ y)\nrmse3_s <- rmse(predicted3$y, y)\nseen <- c(\"RMSPE for model1 (linear)\"\
  \ = rmse1_s,\n          \"RMSPE for model2 (polynomial)\" = rmse2_s,\n         \
  \ \"RMSPE for model3 (nonparametric)\" = rmse3_s)\nseen\n```\nRMSPE for model1 (linear)\
  \    RMSPE for model2 (polynomial)\n                        119.4640           \
  \              88.8796\nRMSPE for model3 (nonparametric)\n                     \
  \    67.7245\n\n现在我们将来自同一 DGP 的另一个之前未见过的样本对它们进行测试：\n\n```R\n# 因为 DGM 是相同的，唯一的区别是随机误差\n\
  set.seed(2)\ny2 = dgm + rnorm(length(X), mean = 10, sd = 100)\nplot(X, y2, col='deepskyblue4',\n\
  \     xlab='X',\n     main = 'The \"Unseen\" Sample')\n```\n\n![](img/Fig02_22.jpg)\n\
  \n```R\n# 因为 DGM 是相同的，X 也是相同的\nrmse1_us <- rmse(predicted1, y2)\nrmse2_us <- rmse(predicted2,\
  \ y2)\nrmse3_us <- rmse(predicted3$y, y2)\nunseen <- c(\"RMSPE for model1 (linear)\"\
  \ = rmse1_us,\n            \"RMSPE for model2 (polynomial)\" = rmse2_us,\n     \
  \       \"RMSPE for model3 (nonparametric)\" = rmse3_us)\n```\n让我们它们整合在一起：\n\n```R\n\
  table <- matrix(NA, 2, 3)\nrow.names(table) <- c(\"Seen-data\", \"Unseen-data\"\
  )\ncolnames(table) <- c(\"Linear\", \"Polynomial\", \"Spline\")\ntable[1,1] <- seen[1]\n\
  table[1,2] <- seen[2]\ntable[1,3] <- seen[3]\ntable[2,1] <- unseen[1]\ntable[2,2]\
  \ <- unseen[2]\ntable[2,3] <- unseen[3]\ntable\n```\n               Linear Polynomial\
  \   Spline\nSeen-data   119.4640   88.8796  67.7245\nUnseen-data 123.4378  109.9681\
  \ 122.3018\n\n最后一个由 Spline 估计的模型在使用已见数据时具有最小的 RMSPE。当我们使用已见数据时它拟合非常好，但在预测未见数据中的结果却并不理想。仅使用已见数据的更好拟合模型预测效果更差。这就是过拟合，我们将在下一章讨论。\n\
  \n## 预测的形式化观察\n\nDOI: [10.1201/978103381501-3](https://doi.org/10.1201/978103381501-3)\n\
  \n学习的过程可以总结为以下几个步骤：\n\n1. 学习者拥有一个样本。这是一个任意的随机对象集合，每个对象都有特征（`X`）和标签/结果（`y`）。我们将该序列称为训练集：`S\
  \ = ((X[1], y[1]) . . (X[m], y[m]))`。\n2. 我们要求学习者产生一个预测规则（预测器或分类器），以便我们预测新的观测值。\n\
  3. 我们假设训练数据集 `S`是由数据生成模型（DGM）或标记函数 `f(x)` 生成的。实际上，学习者去发现它。\n4. 学习者通过 `S` 得到一个预测规则\
  \ `f̂(x)`，该规则与 `f(x)` 不同。因此，我们通过损失函数来衡量学习系统的性能：`LS, f`，它是定义 `f̂(x)` 和 `f(x)` 之间差异的某种规则（或函数）。这也称为泛化误差或风险。\n\
  5. 算法的目标是找到一个与未知 `f(x)` 差异最小的 `f̂(x)`。这里的关键是由于学习者不知道 `f(x)`，它无法量化这种差距。\n6. 现在的问题变成了什么样的条件会导致糟糕\
  \ ERM（经验风险最小化）？\n\n如果我们使用训练数据（样本内点）来最小化经验风险，过程可能会导致 `LS, f = 0`。这个问题被称为过拟合。\n\n\n\
  \n\n我们可以使用 `estimator`（估计器）作为 `predictor`（预测器）吗？一个“好的”估计器也能成为“好的”预测器吗？在上一章中我们进行了一些模拟，显示最好的估计器可能是糟糕的预测器。为什么？在本节中，我们将尝试深入探讨这些问题以找到答案。\n\
  \n起点将是定义这两个不同但相似的过程。\n\n# 3 偏差-方差权衡\n\nDOI: [10.1201/9781003381501-4](https://doi.org/10.1201/9781003381501-4)\n\
  \n本节讨论的材料背后的概念可以总结为：如果一个模型与特定数据集拟合得太密，它对其他数据集的适应性就会较差。在这种情况下，“模型”是我们的预测工具而“数据集”是我们的样本。如果我们构建一个能以高精度预测样本数据的模型，它将对该数据过于特定，对其他样本的适应性较差。在构建预测模型时，特异性和适应性之间的最佳平衡点在哪里？这被称为偏差-方差权衡的“甜点区”。\n\
  \n### 3.1 估计器与 MSE\n\n任务是 `estimate an unknown population parameter`（例如 `θ`），它可能是\
  \ `X` 的简单均值 `μ[x]`，或者是未知 DGM 更复杂的斜率系数 `β`。我们从总体中抽取一个随机样本，并将 `θ̂` 作为 `θ` 的估计器。\n\n\
  我们需要在许多可能的估计器中选择最好的估计器来估计 `θ`。例如，如果我们想估计 `μ[x]`，可以使用：\n\n$\\overline{X} = \\frac{1}{n}\\\
  underset{i = 1}{\\\\overset{n}{\\Sigma}}x\\_{i}$\n\n或者，\n\n*X̂* = 0.5*x*[1] + 0.5*x*[*n*]\
  \  \n\n因此，我们需要定义什么是使得一个估计器在其他估计器中是“最好的”。采样分布（通过重复采样获得的所有可能 `estimates` 的概率分布）将帮助我们制定一些原则。第一个也是最重要的标准应该是：从重复样本中获得的所有估计值的期望均值应该等于\
  \ `μ[x]`。任何满足此条件的估计器都被称为 `unbiased`（无偏）估计器。\n\n然而，如果 `x` 是独立同分布分布的（i.i.d），可以证明这两个估计器\
  \ $\\overline{X}$ 和 `X̂` 都是无偏的。也就是说，$\\text{E}(\\overline{X}) = \\text{E}(\\hat{X})\
  \ = \\mu\\_{x}$。虽然获得代数证明很容易，但模拟练习可以帮助我们将其可视化。事实上，我们可以添加第三个估计器 $\\overset{\\sim}{X}\
  \ = x\\_{3}$，它也是无偏的。\n\n```\n# Population\npopulationX <- c(0, 3, 12)\n\n# 用于存储重复样本的容器\n\
  samples <- matrix(0, 2000, 3)\ncolnames(samples) <- c(\"FirstX\", \"SecondX\", \"\
  ThirdX\")\n\n# 从总体中抽取随机样本\nset.seed(123)\nfor (i in 1:nrow(samples)) {\n  samples[i,\
  \ ] <- sample(populationX, 3, replace = TRUE)\n}\nhead(samples)\n```\n\n```\n##\
  \      FirstX SecondX ThirdX\n## [1,]     12      12     12\n## [2,]      3    \
  \  12      3\n## [3,]      3       3     12\n## [4,]      0       3      3\n## [5,]\
  \      0       3     12\n## [6,]      0      12     12\n```\n\n在这次模拟中，总体只有三个值（0,\
  \ 3 和 12），但我们的样本可以多次抽取相同的数字。每一行显示了从总体中抽取的 2000 个随机样本的前几个样本。每列显示了观测值（或随机抽取值）`x[1]`、`x[2]`、`x[3]`\
  \ 的顺序。这个例子可能因为总体的大小而显得很奇怪，但为了简单起见，它在我们的实验中运行良好。我们知道总体 `μ[x]` 是 5，它是总体中三个值（0, 3,\
  \ 12）的均值。知道这一点，我们可以测试以下几点：\n\n1.  `X` 是 i.i.d 的吗？相同的分布要求 `E`(`x[1]`) = `E`(`x[2]`)\
  \ = `E`(`x[3]`) 且 `Var`(`x[1]`) = `Var`(`x[2]`) = `Var`(`x[3]`)。而独立分布要求 `Corr`(`x[i],\
  \ x[j]`) = 0，其中 `i` *≠=\\= `j`。\n\n2.  从重复样本中获得的所有估计值的期望均值应该等于 `μ[x]`。任何满足此条件的估计器都被称为\
  \ `unbiased`（无偏）估计器。\n\n然而，如果 `x` 是独立同分布（i.i.d），可以证明这两个估计器 $\\overline{X}$ 和 `X̂`\
  \ 都是无偏的。也就是说，$\\text{E}(\\overline{X}) = \\text{E}(\\hat{X}) = \\mu\\_{x}$。虽然获得代数证明很容易，但模拟练习可以帮助我们将其可视化。事实上，我们可以添加第三个估计器\
  \ $\\overset{\\sim}{X} = x\\_{3}$，它也是无偏的。\n\n```\n# Population\npopulationX <- c(0,\
  \ 3, 12)\n\n# 用于存储重复样本的容器\nsamples <- matrix(0, 2000, 3)\ncolnames(samples) <- c(\"\
  FirstX\", \"SecondX\", \"ThirdX\")\n\n# 从总体中抽取随机样本\nset.seed(123)\nfor (i in 1:nrow(samples))\
  \ {\n  samples[i, ] <- sample(populationX, 3, replace = TRUE)\n}\nhead(samples)\n\
  ```\n\n```\n##      FirstX SecondX ThirdX\n## [1,]     12      12     12\n## [2,]\
  \      3      12      3\n## [3,]      3       3     12\n## [4,]      0       3 \
  \     3\n## [5,]      0       3     12\n## [6,]      0      12     12\n```\n\n在这次模拟中，总体只有三个值（0,\
  \ 3 和 12），但我们的样本可以多次抽取相同的数字。每一行显示了从总体中抽取的 2000 个随机样本的前几个样本。每列显示了观测值（或随机抽取值）`x[1]`、`x[2]`、`x[3]`\
  \ 的顺序。这个例子可能因为总体的大小而显得很奇怪，但为了简单起见，它在我们的实验中运行良好。我们知道总体 `μ[x]` 是 5，它是总体中三个值（0, 3,\
  \ 12）的均值。知道这一点，我们可以测试以下几点：\n\n1.  `X` 是 i.i.d 的吗？相同的分布要求 `E`(`x[1]`) = `E`(`x[2]`)\
  \ = `E`(`x[3]`) 且 `Var`(`x[1]`) = `Var`(`x[2]`) = `Var`(`x[3]`)。而独立分布要求 `Corr`(`x[i],\
  \ x[j]`) = 0，其中 `i` *≠=\\= `j`。\n\n2.  从重复样本中获得的所有估计值的期望均值应该等于 `μ[x]`。任何满足此条件的估计器都被称为\
  \ `unbiased`（无偏）估计器。\n\n\n\n2. （线性）估计器的要求是`无偏性`。\n\n3. 如果一个`无偏` 估计器在所有其他`无偏` 估计器中具有`最小方差`，则被称为该总体参数的**最佳线性无偏估计量**（BLUE）。\n\
  \n当我们使用均方误差（MSE）来评估每个估计器的性能时，也会观察到这些步骤。对于未知的总体参数 `θ`，估计器 `θ̂` 相对于 `θ` 的 MSE 定义为：\n\
  \nMSE(`θ̂`) = E[`θ̂ − θ`²] = E[`θ̂ − E(θ̂)`²\n\n由于我们只选择无偏估计器，E(`θ̂`) = θ，因此该表达式变为\
  \ Var(`θ̂`)。因此，通过 MSE 评估所有备选`无偏` 估计器的性能，实际上是在比较它们的方差并选取最小的一个。更具体地说，\n\n$\\begin{matrix}\
  \ {{\\\\textbf{MSE}\\\\left( \\hat{\\\\theta} \\right)} = \\\\text{E}\\\\left\\\\\
  lbrack \\\\left( \\hat{\\\\theta} - \\theta \\right)^{2} \\right\\\\rbrack = \\\\\
  text{E}\\\\left\\\\{ \\\\left( \\\\hat{\\\\theta} - \\\\text{E}\\\\left( \\\\hat{\\\
  \\theta} \\\\right) + \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) - \\\\\
  theta \\\\right)^{2} \\\\right\\\\}} \\\\\\\\ {= \\\\text{E}\\\\left\\\\{ \\\\left(\
  \ \\\\left\\\\lbrack \\\\hat{\\\\theta} - \\\\text{E}\\\\left( \\\\hat{\\\\theta}\
  \ \\\\right) \\\\right\\\\rbrack + \\\\left\\\\lbrack \\\\text{E}\\\\left( \\\\\
  hat{\\\\theta} \\\\right) - \\\\theta \\\\right\\\\rbrack \\\\right)^{2} \\\\right\\\
  \\}} \\\\\\\\ \\\\end{matrix}$ (3.1)\n\n$\\begin{matrix} \\\\operatorname{} \\\\\
  \\\\ \\\\end{matrix}{}\\\\begin{matrix} \\\\operatorname{} \\\\\\\\ \\\\end{matrix}\\\
  \\begin{matrix} {{\\\\textbf{MSE}\\\\left( \\hat{\\\\theta} \\right)} = \\\\text{E}\\\
  \\left\\\\lbrack \\\\left( \\\\hat{\\\\theta} - E\\\\left( \\\\theta \\\\right)\
  \ \\\\right.^{2} \\\\right\\\\rbrack + \\\\text{E}\\\\left\\\\{ \\\\left\\\\lbrack\
  \ \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) - \\\\theta\\\\rbrack^{2} \\\
  \\right\\\\} \\\\right.} \\\\\\\\ {+ 2\\\\text{E}\\\\left\\\\{ \\\\left\\\\lbrack\
  \ \\\\hat{\\\\theta} - \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) \\\\right\\\
  \\rbrack\\\\left\\\\lbrack \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) -\
  \ \\\\theta \\\\right\\\\rbrack \\\\right\\\\}} \\\\\\\\ \\\\end{matrix}{}{}\\\\\
  begin{matrix} \\\\operatorname{} \\\\\\\\ \\\\end{matrix}$ (3.2)\n\n方程 3.2 中的第一项是方差。第二项在期望值之外，因为\
  \ `[E(θ̂) - θ]` 不是随机变量，它代表了偏置。最后一项为 0。这是因为 `[E(θ̂) - θ]` 不是随机变量，因此它再次位于期望之外：\n\n\
  2[E(`θ̂`)−θ]E{[`θ̂−E(`θ̂)`],\n\n且由于 `E(`θ̂`)−E(`θ̂`)=0`，最后一项为 0。因此，\n\nMSE(`θ̂`)\
  \ = Var(`θ̂`) + [`bias(`θ̂`)]`²\n\n因为我们只选择无偏估计器，E(`θ̂`) = θ，该表达式变为 Var(`θ̂`)。在我们的情况下，估计器可以是\
  \ `θ̂ = \\overline{X}`，而我们试图估计的是 `θ = \\mu[x]`。\n\n### 3.2 预测 - MSPE\n\n让我们遵循相同的例子。我们现在的任务不同了。我们想要**预测**未观测到的\
  \ `X` 的值，而不是估计 `μ[x]`。因此，我们需要一个**预测器**，而不是一个**估计器**。什么是一个良好的预测器？无偏性是其中之一吗？如果我们使用有偏的估计器，例如\n\
  \n$X^{\\*} = \\frac{1}{n - 4}\\underset{i = 1}{\\overset{n}{\\Sigma}}x\\_{i}$\n\n\
  来预测 `x[0]`，成为一个有偏的估计器会自动使其成为一个糟糕的预测器吗？为了回答这些问题，我们需要再次查看 MSE。由于我们的任务是预测，我们（通常）将其更名为**均方预测误差**（MSPE）。\n\
  \nMSPE = E[`x[0] − f̂`²] = E[`f + ε[0] − f̂`²] (3.3)\n\n类似于最佳估计器，具有最小 MSPE 的预测器将是我们备选预测器中的选择。让我们总结一下关于\
  \ MSPE 的重要事实：\n\n1. `x[0]` 是我们想要预测的，`f̂` 是预测器，可以是 `E(\\overline{X})`、`E(X)`、`E(\\\
  tilde{X})` 或其他预测器。\n2. `x[0] = μ[x] + ε[0]`，其中 `f = μ[x]`。因此，`E(x[0]) = f`，使得 `E(ε[0])\
  \ = 0`。\n3. `E(f) = f`。换句话说，常数的期望等于常数：`E(μ[x]) = μ[x]`。\n4. `Var(x[0]) = E([x[0]−E(x[0])²]\
  \ = E([x[0]−f]²) = E([μ[x]+ε[0]−μ[x]]²]) = E[ε[0]²] = σ²。通过 MSE 评估所有备选无偏估计器的性能，实际上是在比较它们的方差并选取最小的一个。更具体地说，\n\
  \n$\\begin{matrix} {{\\\\textbf{MSE}\\\\left( \\hat{\\\\theta} \\right)} = \\\\\
  text{E}\\\\left\\\\lbrack \\\\left( \\\\hat{\\\\theta} - \\theta \\\\right)^{2}\
  \ \\\\right\\\\rbrack = \\\\text{E}\\\\left\\\\{ \\\\left( \\\\hat{\\\\theta} -\
  \ \\\\text{E}\\\\left( \\\\hat{\\\\theta} \\\\right) + \\\\text{E}\\\\left( \\\\\
  hat{\\\\theta} \\\\right) - \\\\theta \\\\right)^{2} \\\\right\\\\}} \\\\\\\\ {=\
  \ \\\\text{E}\\\\left\\\\{ \\\\left( \\\\left\\\\lbrack \\\\hat{\\\\theta} - \\\\\
