  \ [1] \"Calculator result:  1.04729412282063\"\n```\n\n牛顿法通常用于解决两个不同但相关的问题：\n\n\
  1. 找到 `x` 使得 `f(x) = 0`（尝试用这种方法解决我们的保险问题）\n2. 找到 `x` 使得 `g′(x) = 0`，或者找到使 `g(x)`\
  \ 最小或最大的 `x`。\n\n当我们定义 `f(x) = g′(x)` 时，这两个问题之间的关系显而易见。因此，对于第二个问题，Newton–Raphson\
  \ 方法变为：\n\n$x_{n + 1} = x_{n} - \\frac{g^{\\prime}\\left( x_{n} \\right)}{g^{\\\
  prime\\prime}\\left( x_{n} \\right)}$\n\n这两个问题之间的联系在后文中定义。\n\n假设我们感兴趣确定随机变量 `X`\
  \ ~ `N(μ, σ)` 的参数\n\n$\\log(\\mathcal{L}(\\mu,\\sigma)) = - \\frac{n}{2}\\log\\\
  left( 2\\pi\\sigma^{2} \\right) - \\frac{1}{2\\sigma^{2}}\\underset{i = 1}{\\overset{n}{\\\
  Sigma}}\\left( x_{i} - \\mu \\right)^{2}$\n\n我们之前在 第 2 章 中见过它。但这次我们将使用 `dnorm()`，它可以计算正态变量的概率密度函数（pdf）。首先获取数据和对数似然：\n\
  \n```r\n# 创建一个正态变量样本\nset.seed(2019)\nX <- rnorm(100, 0, 1)\n\n# 该函数的对数似然。\n# 记得似然函数是\
  \ prod(dnorm())\nnormalLL <- function(prmt){\n  sum(dnorm(X, mean = prmt[1], sd\
  \ = prmt[2], log = TRUE))\n}\n\n# 尝试几个参数\nnormalLL(prmt = c(1,1.5))\n```\n\n```\n\
  ## [1] -176.078\n```\n\n```r\nnormalLL(prmt = c(2,1))\n```\n\n```\n## [1] -347.4119\n\
  ```\n\n```r\nnormalLL(prmt = c(mean(X),sd))\n```\n\n```\n## [1] -131.4619\n```\n\
  \n如你所示，最后一个是最好的。我们可以验证这一点，因为我们创建 `X` 时均值大约为 0，标准差为 1。现在我们将使用 Newton–Raphson 方法来计算最小化负对数似然的参数。\n\
  \n首先，让我们构建一个函数，分别在数值估计参数空间中均值和标准差任意点的函数斜率（一阶导数）。不要忘记对数似然是均值和标准差的函数。\n\n```r\n# 对均值的一阶偏导（数值）\n\
  firstM <- function(p1, p2, change = 0.0001){\n  prmt <- c(p1, p2)\n  high <- normalLL(prmt\
  \ + change)\n  low <- normalLL(prmt - change)\n  slope <- (high-low)/2\n  return(slope)\n\
