  \n```\n\n现在是在无特定网格的相同应用：\n\n```\nbestlam <- c()\nmse <- c()\n\n# Without a pre-defined\
  \ grid on lambda\nfor(i in 1:100){\n  set.seed(i)\n  train <- sample(1:nrow(X),\
  \ nrow(X) * 0.5) # arbitrary split\n  test <- c(-train)\n  ytest <- y[test]\n\n\
  \  cv.out <- cv.glmnet(X[train,], y[train], alpha = 0)\n  yhat <- predict(cv.out,\
  \ s = \"lambda.min\", newx = X[test,])\n  mse[i] <- mean((yhat - ytest) ^ 2)\n}\n\
  \nmean(mse)\n```\n\n```\n## [1] 127481.6\n```\n\n```\nplot(mse, col = \"pink\")\n\
  ```\n\n![](img/Fig17_04.jpg)\n\n岭回归（Ridge regression）增加了一个惩罚项，该项是模型中特征平方的和。这导致惩罚项是连续且可微的，使得岭回归容易使用梯度下降法进行优化。当我们拥有大量特征但仍想在模型中保留所有特征时，岭回归非常有用。在最小二乘估计具有高方差的情况下，岭回归效果最好。\n\
  \n另一方面，Lasso（最小绝对收缩和选择算）增加了一个惩罚项，该项是模型中系数绝对值的和。这导致惩罚项是不可微的，使得使用梯度下降法进行优化更加困难。然而，Lasso\
  \ 的优势在于可以将某些特征的系数精确地设置为零，从而有效地从模型中消除这些特征。当我们拥有大量特征并想要选择一个重要特征子集时，这非常有用。\n\n### 注意\n\
  \n- 网站：[`glmnet.stanford.edu/`](https://glmnet.stanford.edu/)\n- Lasso DOI：[10.1201/97810038124](https://doi.org/10.1201/97810038124)\n\
  \n岭回归中的惩罚 `λ∑²` 将所有系数向零压缩，但不会将任何一个系数设置为零。这在变量较多时可能会给模型解释带来问题。Lasso 的关键优势之一可以将某些特征的系数精确设置为零，从而有效地从模型中消除它们。通过消除模型中不必要或冗的特征，Lasso\
  \ 可以提高模型的可解释性和简单性。当你有大量特征并想要识别预测目标变量最重要的特征时，这特别有用。\n\nLasso 是岭回归的近期替代方案，它最小化以下量：$\\\
  sum_{i=1}^n(y_i - \\beta_0)² + \\lambda\\sum_{j=1}^p|\\beta_j|$。Lasso 也会将系数估计向零压缩，但调优参数\
  \ `λ` 会强制某些系数估计为零。这种属性被称为“稀疏性”，因为它产生了一个具有少量非零系数的模型。在某些情况下，Lasso 可以通过识别一小部分最重要的特征来准确预测目标变量。\n\
  \n现在我们将 Lasso 应用于相同的数据 `Hitters`。我们将再次按照《统计学习》（Gareth et al., 2022）中的方法比较岭回归和 Lasso。\n\
  \n```\nlibrary(glmnet)\nlibrary(ISLR)\nremove(list = ls())\n\ndata(Hitters)\ndf\
  \ <- Hitters[complete.cases(Hitters$Salary), ]\nX  <- model.matrix(Salary ~ ., df)[,-1]\n\
  y <- df$Salary\n\n# Without a specific grid on lambda\nset.seed(1)\ntrain <- sample(1:nrow(X),\
  \ nrow(X) * 0.5\n\ntest <- c(-train)\nytest <- y[test]\n\n# Ridge\nset.seed(1)\n\
  ridge.out <- cv.glmnet(X[train,], y[train], alpha = 0)\nyhatR <- predict(ridge.out,\
  \ s = \"lambda.min\", newx = X[test,])\nmse_r <- mean((yhatR - ytest)²)\n\n# Lasso\n\
  set.seed(1)\nlasso.out <- cv.glmnet(X[train,], y[train], alpha = 1)\nyhatL <- predict(lasso.out,\
  \ s = \"lambda.min\", newx = X[test,])\nmse_l <- mean((yhatL - ytest) ^ 2)\n\nmse_r\n\
  ```\n\n```\n## [1] 139863.2\n```\n\n```\nmse_l\n```\n\n```\n## [1] 143668.8\n```\n\
  \n现在我们将定义自己的网格搜索：\n\n```\n# With a specific grid on lambda + lm()\ngrid = 10 ^ seq(10,\
  \ -2, length = 100)\n\nset.seed(1)\ntrain <- sample(1:nrow(X), nrow(X)*0.5\ntest\
  \ <- c(-train)\nytest <- y[test]\n\n#Ridge\nridge.mod <- glmnet(X[train,], y[train],\
  \ alpha = 0,\n                    lambda = grid, thresh = 1e-12)\nset.seed(1)\n\
  cv.outR <- cv.glmnet(X[train,], y[train], alpha = 0)\nbestlamR <- cv.outR$lambda.min\n\
  yhatR <- predict(ridge.mod, s = bestlamR, newx = X[test,])\nmse_R <- mean((yhatR\
  \ - ytest) ^ 2)\n\n# Lasso\nlasso.mod <- glmnet(X[train,], y[train], alpha = 1,\n\
  \                    lambda = grid, thresh = 1e-12)\nset.seed(1)\ncv.outL <- cv.glmnet(X[train,],\
  \ y[train], alpha = 1)\nbestlamL <- cv.outL$lambda.min\nyhatL <- predict(lasso.mod,\
  \ s = bestlamL, newx = X[test,])\nmse_L <- mean((yhatL - ytest) ^ 2)\n\nmse_R\n\
  ```\n\n```\n## [1] 139856.6\n```\n\n```\nmse_L\n```\n\n```\n## [1] 143572.1\n```\n\
