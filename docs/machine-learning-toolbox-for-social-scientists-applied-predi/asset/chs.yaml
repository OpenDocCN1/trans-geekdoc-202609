  \ 3)\n```\n![](img/Fig17.jpg)\n\n使用最后一个训练集的 `λ` 调优模型是什么？\n\n```\nlambda <- grid[which(MMSPE)]\n\
  coeff <- predict(model, s = lambda, type = \"coefficients\", new = xtrain)\n```\n\
