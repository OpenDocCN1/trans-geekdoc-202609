  \   n = 1070\n```\n\n\n\n\n使用平滑方法的主要原因是降噪，这使得数据中的模式和趋势更加明显，便于分析，从而提高基于数据预测的准确性。你可以将平滑看作减少数据中噪声影响的过程。\n\
  \n我们可以通过以下模型定义 `Y[i]`：\n\n`Y[i] = f(x[i]) + ε[i] `\n\n我们并不希望（也无法）预测 `Y[i]`，因为我们不知道随机部分\
  \ `ε[i]`，即“噪声”。如果我们能很好地预测 `f(x)`，它将给出关于 `Y[i]` 的良好近似。非参数估计有助于恢复 `f(x)`。通常情况下，平滑的目的有两个：通过平滑建立预测模型，以及学习嵌入数据中（`Y`）中的趋势形状。\n\
  \n来自 `MASS` 包的 `mcycle` 数据集包含 `n` = 133 对时间点（单位为 ms - 毫秒）和观测到的头部加速度（单位为 g - 重力加速度），这些数据记录于一次模拟摩托车事故。我们将使用几种平滑方法来探索时间与加速度之间的关系。首先，让我们可视化时间（`X`）与加速度（`Y`）之间的关系，看看是否可以假设\
  \ `f(x[i])` 是时间的线性函数：\n\n```\nlibrary(tidyverse)\nlibrary(MASS)\ndata(mcycle)\n\
  head(mcycle)\n```\n\n```\n##   times accel\n## 1   2.4   0.0\n## 2   2.6  -1.3\n\
  ## 3   3.2  -2.7\n## 4   3.6   0.0\n## 5   4.0  -2.7\n## 6   6.2  -2.7\n```\n\n\
  ```\nplot(mcycle$times, mcycle$accel,\n      cex.axis = 0.75, cex.main = 0.8)\n\n\
  # 线性回归\nlines(mcycle$times,  predict(lm(accel ~ times, mcycle)), lwd = 2, col =\
  \ \"red\")\n```\n\n![](img/Fig07_01.jpg)\n\n这条线似乎并没有很好地描述趋势。\n\n## 7.1 使用分箱 (Bins)\n\
  \n正如我们之前看到的，核心思想是将数据点分到等大小的分箱中，其中假设 `f(x)` 的值为常数。这个假设可能是合理的，因为如果我们考虑 `f(x)` 在小的时间窗口内几乎是常数。在确定窗口大小（例如\
  \ 10ms）后，我们找到这些 10ms 窗口内有多少观测值（`Y[i]`）。我们可以计算以 `x[i]` 为中心、满足以下条件的 10ms 窗口内的观测数量：\n\
  \n$\\left( x - \\frac{10}{2} < x_{i} < x + \\frac{10}{2} \\right)$\n\n当我们对每个观测值\
  \ `x[i]` 应用此类条件时，我们就创建了一个移动的 10ms 窗口。请注意，该窗口是通过向 `x[i]` 加上 10ms 的半部分得到前半部分，并从 `x[i]`\
  \ 减去它得到后半部分。当我们识别出每个窗口中的所有观测值时，我们通过该窗口内 `Y[i]` 值的平均值来估计 `f(x)`。如果我们定义 `A[0]` 为每个窗口中的索引集，`N[0]`\
  \ 为每个窗口中的观测值数量，对于我们的数据，计算 `f(x)` 可以表示为：\n\n$\\overset{\\\\hat{}}{f}{}\\operatorname{}\\\
  left( x_{0} \\right) = \\frac{1}{N_{0}}\\underset{i \\in A_{0}}{\\Sigma}Y\\_{i}$\
  \ (7.1)\n\n以下是其在我们数据中的应用：\n\n```\n# 使用 ksmooth() 注意 \"box\"\nfit1 <- with(mcycle,\
  \ ksmooth(times, accel, kernel = \"box\", bandwidth = 7))\nfit2 <- with(mcycle,\
  \ ksmooth(times, accel, kernel = \"box\", bandwidth = 10))\nfit3 <- with(mcycle,\
  \ ksmooth(times, accel, kernel = \"box\", bandwidth = 21))\n\nplot(mcycle$times,\
  \ mcycle$accel,\n     xlab = \"Time (ms)\", ylab = \"Acceleration (g)\")\nlines(mcycle$times,\
  \  fit1$y, lwd = 2, col = \"blue\")\nlines(mcycle$times,  fit2$y, lwd = 2, col =\
  \ \"red\")\nlines(mcycle$times,  fit3$y, lwd = 2, col = \"green\")\n```\n\n![](img/Fig07_02.jpg)\n\
  \n你可以看到，即使使用较短的带宽，这些线条也非常波动曲。\n\n## 7.2 核平滑 (Kernel Smoothing)\n\n我们可以通过取加权平均来解决这个问题，赋予中心点比远端点更大的权重。\n\
  \n```\n# 使用 ksmooth() 注意 \"box\"\nfit1 <- with(mcycle, ksmooth(times, accel, kernel\
  \ = \"normal\", bandwidth = 7))\nfit2 <- with(mcycle, ksmooth(times, accel, kernel\
  \ = \"normal\", bandwidth = 10))\nfit3 <- with(mcycle, ksmooth(times, accel, kernel\
  \ = \"normal\", bandwidth = 21))\n\nplot(mcycle$times, mcycle$accel,\n     xlab\
  \ = \"Time (ms)\", ylab = \"Acceleration (g)\")\nlines(mcycle$times,  fit1$y, lwd\
  \ = 2, col = \"blue\")\nlines(mcycle$times,  fit2$y, lwd = 2, col = \"red\")\nlines(mcycle$times,\
  \  fit3$y, lwd = 2, col = \"green\")\n```\n\n![](img/Fig07_03.jpg)\n\n现在，它们看起来更平滑了。R\
  \ 中有几种实现分箱平滑的方法。一个例子是上文的 `ksmooth`。然而，`ksmooth()` 方法的局限性在于我们需要小的窗口来使常数假设成立。`loess()`\
  \ 则允许我们考虑更大的窗口大小。\n\n\n\n\n```\n## spc_tbl_ [574 x 6] (S3: spec_tbl_df/tbl_df/tbl/data.frame)\n\
  ##  $ date    : Date[1:574], format: \"1967-07-01\" \"1967-08-01\" ...\n##  $ pce\
  \     : num [1:574] 507 510 516 512 517 ...\n##  $ pop     : num [1:574] 198712\
  \ 198911 199113 199311 199498 ...\n##  $ psavert : num [1:574] 12.6 12.6 11.9 12.9\
  \ 12.8 11.8 11.7 12.3 11.7 12.3 ...\n##  $ uempmed : num [1:574] 4.5 4.7 4.6 4.9\
  \ 4.7 4.8 5.1 4.5 4.1 4.6 ...\n##  $ unemploy: num [1:574] 2944 2945 2958 3143 3066\
  \ ...\n```\n\n```r\neconomics$index <- 1:nrow(economics)\nfit1 <-\n  loess(uempmed\
  \ ~ index, data = economics, span = 0.25) # 25% smoothing span\nRRSS_1 <- sqrt(mean((fit1$residuals)\
  \ ^ 2))\nRRSS_1\n```\n\n```\n## [1] 1.192171\n```\n\n```r\nplot(economics$index,\n\
  \     economics$uempmed,\n     cex.axis = 0.75,\n     cex.main = 0.8,\n     xlab\
  \ = \"Time index - months\",\n     ylab = \"Unemployment duration - weeks\",\n \
  \    col = \"grey\")\nlines(economics$index,  fit1$fitted, lwd = 1, col = \"red\"\
  )\n```\n\n![](img/Fig07_07.jpg)\n\n```r\n# Now more predictors\nfit2 <- loess(uempmed\
  \ ~ pce + psavert + pop + index,\n              data = economics, span = 2)\n\n\
  RRSS_2 <- sqrt(mean((fit2$residuals) ^ 2))\nRRSS_2\n```\n\n```\n## [1] 58.61336\n\
  ```\n\n## 8 非参数分类器 - kNN\n\nDOI: [10.1201/9781003381501-10](https://doi.org/10.1201/9781003381501-10)\n\
  \n我们将通过一个非参数分类器来完成“非参数估计”这一章节，并将其性能与参数化分类器（LPM 和 Logistic）进行比较。\n\n### 8.1 `mnist`\
  \ 数据集\n\n如今识别手写字母和数字已经不是难了。例如，在加拿大邮政，电脑可以读取邮政编码，机器人可以根据每个邮政编码对邮件进行分类。这种应用主要通过机器学习算法实现。为了理解其实现原理，让我们使用真实数据集\
  \ Mnist。以下是维基百科对该数据集的描述：\n\n> MNIST 数据库（修改后的美国标准技术研究院数据库）是一个大型手写数字数据库，通常用于训练各种图像处理系统。MNIST\
  \ 数据库包含 60,000 张训练图像和 10,000 张测试图像。训练集的一半和测试集的一半来自 NIST 的训练数据集，而训练集的另一半和测试集的另一半则来自\
  \ NIST 的测试数据集。已有许多科学论文尝试实现最低错误率；其中一篇使用卷积神经网络的论文在 MNIST 数据库上实现了 0.23% 的错误率。\n\n![](img/Fig08_01.jpg)\n\
  \n这些图像被转换为 28 × 28 = 784 个像素，对于每个像素，都有 0（白）到 255（黑）之间的亮度度量。因此，对于每张数字图像，我们有一个 0 到\
  \ 9 之间的指示变量 `Y`，以及 784 个识别数字图像每个像素的变量。让我们下载数据：([http://yann.lec.com/db/mnist/])。\n\
  \n```r\n# 加载数据\nlibrary(tidyverse)\nlibrary(dslabs)\n# 将数据下载到你的目录。数据很大！\nmnist <-\
  \ read_mnist()\n# 保存\nsave(mnist, file = \"mnist.Rdata\")\nload(\"mnist.Rdata\"\
  )\nstr(mnist)\n```\n\n```\n## List of 2\n##  $ train:List of 2\n##   ..$ images:\
  \ int [1:60000, 1:784] 0 0 0 0 0 0 0 ...\n##   ..$ labels: int [1:60000] 5 0 4 1\
  \ 9 ...\n##  $ test :List of 2\n##   ..$ images: int [1:10000, 1:784] 0 0 0 0 0\
  \ 0 0 ...\n##   ..$ labels: int [1:10000] 7 2 1 0 4 1 4 9 ...\n\n```\n\n数据以列表形式给出并已分为训练集和测试集。训练集有\
  \ 60,000 张图像，测试集有 10,000 张图像。对于训练集，我们有两个嵌套列表：`images` 包含了 60,000 张图像的所有 784 个特征，这是一个\
  \ 60,000 × 784 的矩阵；而 `labels` 包含了每个图像的标签（0 到 9）。可以从这张图中理解：\n\n![](img/Fig08_02.jpg)\n\
  \n每张图像都有 28 × 28 = 784 个像素。对于每个图像，像素特征对应 0 到 9 之间的真实数字。这种方法被称为“扁平化”，用于将多维图像转换为一维数组（向量）。现在，我们将使用\
  \ `dslabs` 包提供的较小版本数据，它是 1000 张图像的随机样本（只有 2 和 7）， 800 张在训练集，200 张在测试集，有两个特征：左上角\
  \ `x_1` 和右下角 `x_2` 的像素比例。\n\n```r\ndata(\"mnist_27\")\nstr(mnist_27)\n```\n\n```\n\
