  ```\n\n我们可能想将岭回归与简单的最小二乘法（OLS）：\n\n```\nMSPE <- c()\n\nfor (j in 1:100) {\n  set.seed(j)\n\
  \  ind <- unique(sample(nrow(df), nrow(df), replace = TRUE))\n  train <- df[ind,]\n\
  \  test <- df[-ind, ]\n\n  model <- lm(Salary ~ ., data = train)\n  yhat <- predict(model,\
  \ newdata = test)\n  MSPE[j] <- mean((yhat - test$Salary)²)\n}\nmean(MSPE)\n```\n\
