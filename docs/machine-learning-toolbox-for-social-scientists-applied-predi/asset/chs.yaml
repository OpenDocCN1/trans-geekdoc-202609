  \n# 第 9 部分 网络分析\n\nDOI: [10.1201/9781003381501-40](https://doi.org/10.1201/9781003381501-40)\n\
  \n在第 9 节中，我们将研究网络分析，侧重于表示和理解对象之间关系的结构。图形建模是一种通过由节点和边组成的图来可视化网络结构的有效方法，边表达了节点之间的条件（不）依赖性。\n\
  \n网络分析的核心概念是，任何两个节点之间缺失的边代表了相关变量之间的某种形式的独立性。网络分析的复杂性源于这种独立性可能是边缘的，也可能取决于某些或所有其他变量。因此，定义图形模型需要针对每个特定情况识别合适的图类型。\n\
  \n\n\n\n通常情况下，图模型可以使用有向边和无向边进行设计。有向图的特征是带有节点之间依赖方向的箭头，而无向图则由没有方向的边组成。图建模领域非常广泛，全面的探索超出了本书的涵盖范围。\n\
  \n尽管如此，我们将重点研究精度矩阵，该矩阵已被证明可以通过正则化有效地捕捉网络连接。因此，本节的核心主题围绕着稀疏标准化精度矩阵的估计展开，其结果可以用无向图来表示。\n\
  \n# 32 基础\n\nDOI: [10.1201/9781003381501-41](https://doi.org/10.1201/9781003381501-41)\n\
  \n在本章中，我们将开始探索网络分析，这是一个理解网络中各种实体之间关系和相互作用的强大框架。我们首先通过核心概念建立基础，例如协方差、相关性、部分相关性和精度矩阵。这些基础元素为提供了必要的背景和理解，以便在从社会网络研究到复杂系统建模等不同领域中有效利用网络分析。\n\
  \n## 32.1 协方差\n\n我们从数据矩阵开始，它指的是数字数组：\n\n$\\mathbf{X} = \\begin{pmatrix} x_{11} &\
  \ x_{12} & {\\cdots} & x_{1p} \\\\ x_{21} & x_{22} & {\\cdots} & x_{2p} \\\\ x_{31}\
  \ & x_{32} & {\\cdots} & x_{3p} \\\\ {\\vdots} & {\\vdots} & \\ddots & {\\vdots}\
  \ \\\\ x_{n1} & x_{n2} & {\\cdots} & x_{np} \\\\ \\end{pmatrix}$\n\n例如：\n\n```r\n\
  set.seed(5)\nx <- rnorm(30, sd=runif(30, 2, 50))\nX <- matrix(x, 10)\nX\n```\n\n\
  ```r\n##              [,1]       [,2]       [,3]\n##  [1,]   -1.613670  -4.436764\
  \  42.563842\n##  [2,]  -20.840548  36.237338 -36.942481\n##  [3,] -100.484392 \
  \ 25.903897 -24.294407\n##  [4,]    3.769073 -18.950442 -22.616651\n##  [5,]   -1.821506\
  \ -12.454626  -1.243431\n##  [6,]   32.103933   3.693050  38.807102\n##  [7,]  \
  \ 25.752668  22.861071 -18.452368\n##  [8,]   59.864792  98.848864  -3.607105\n\
  ##  [9,]   33.862342  34.853324  16.704375\n## [10,]    5.980194  62.755408 -21.841795\n\
  ```\n\n我们首先定义协方差矩阵\n\n$\\mathbf{S} = \\begin{pmatrix} s_{1}^{2} & s_{12} & s_{13}\
  \ & {\\cdots} & s_{1p} \\\\ s_{21} & s_{2}^{2} & s_{23} & {\\cdots} & s_{2p} \\\\\
  \ s_{31} & s_{32} & s_{3}^{2} & {\\cdots} & s_{3p} \\\\ {\\vdots} & {\\vdots} &\
  \ \\ddots & {\\vdots} \\\\ s_{p1} & s_{p2} & s_{p3} & {\\cdots} & s_{p}^{2} \\end{pmatrix}$\n\
  \n其中 $s_{j}^{2} = \\frac{1}{n}\\sum_{i=1}^{n}(x_{ij} - \\overline{x}_{j})^{2}$ 是第\
  \ $j$ 个变量的方差，$s_{jk} = \\frac{1}{n}\\sum_{i=1}^{n}(x_{ij} - \\overline{x}_{j})(x_{ik}\
  \ - \\overline{x}_{k})$ 是第 $j$ 个和第 $k$ 个变量之间的协方差；$\\overline{x}_{j} = \\frac{1}{n}\\\
  sum_{i=1}^{n}x_{ji}$ 是第 $j$ 个变量的均值。\n\n我们可以通过以下方式计算协方差矩阵 $\\mathbf{S} = \\frac{1}{n}\\\
  mathbf{X}_{c}'\\mathbf{X}_{c}$，其中 $\\mathbf{X}_{c}$ 是中心化矩阵：\n\n$\\mathbf{X}_{c}\
  \ = \\begin{pmatrix} x_{11} - \\overline{x}_{1} & x_{12} - \\overline{x}_{2} & {\\\
  cdots} & x_{1p} - \\overline{x}_{p} \\\\ x_{21} - \\overline{x}_{1} & x_{22} - \\\
  overline{x}_{2} & {\\cdots} & x_{2p} - \\overline{x}_{p} \\\\ x_{31} - \\overline{x}_{1}\
  \ & x_{32} - \\overline{x}_{2} & {\\cdots} & x_{3p} - \\overline{x}_{p} \\\\ {\\\
  vdots} & {\\vdots} & \\ddots & {\\vdots} \\\\ x_{n1} - \\overline{x}_{1} & x_{n2}\
  \ - \\overline{x}_{2} & {\\cdots} & x_{np} - \\overline{x}_{p} \\end{pmatrix}$\n\
  \n```r\n# 更直接的方法\nn <- nrow(X)\nm <- matrix(colMeans(X), n)\nXc <- X-m\n```\n\n\
  ```r\n##               [,1]        [,2]        [,3]\n##  [1,]   -5.270958  -29.367876\
  \  45.656130\n##  [2,]  -24.497836  11.306222 -33.850119\n##  [3,] -104.141680 \
  \  0.972784 -21.202114\n##  [4,]    0.111784 -43.881533 -19.524322\n##  [5,]   -5.478791\
  \ -37.385738   1.848877\n##  [6,]   28.446644 -21.238060  41.899391\n##  [7,]  \
  \ 22.095379  -2.070047 -15.360043\n##  [8,]   56.207503  73.917751 -0.514815\n##\
  \  [9,]   30.205053   9.922212  19.796643\n## [10,]    2.322905  37.824296 -18.749506\n\
  ```\n\n```r\n# 或者\nC <- diag(n) - matrix(1/n, n)\nXC <- C*%Xc\n```\n\n```r\n## \
  \              [,1]        [,2]        [,3]\n##  [1,]   -5.270958  -29.367876  45.656130\n\
  ##  [2,]  -24.497836  11.306222 -33.850119\n##  [3,] -104.141680   0.972784 -21.202114\n\
  ##  [4,]    0.111784 -43.881533 -19.524322\n##  [5,]   -5.478791 -37.385738   1.848877\n\
  ##  [6,]   28.446644 -21.238060  41.899391\n##  [7,]   22.095379  -2.070047 -15.360043\n\
  ##  [8,]   56.207503  73.917751 -0.514815\n##  [9,]   30.205053   9.922212  19.796643\n\
  ## [10,]    2.322905  37.824296 -18.749506\n```\n\n```r\n# 也可以使用 `scale`\nXc <-\
  \ scale(X, center=TRUE, scale=FALSE)\n```\n\n以及协方差矩阵：\n\n```r\n# 协方差矩阵\nS <- t(Xc)\
  \ %*% Xc / (n-1)\n```\n\n```r\n##           [,1]      [,2]      [,3]\n##  [1,] \
  \ 1875.3209  429.8712  462.4775\n##  [2,]  429.8712 1306.9817 -262.8231\n##  [3,]\
  \  462.4775 -262.8231  755.5193\n```\n\n```r\n# 检查\ncov(X)\n```\n\n```r\n##    \
  \       [,1]      [,2]      [,3]\n##  [1,]  1875.3209  429.8712  462.4775\n##  [2,]\
  \  429.8712 1306.9817 -262.8231\n##  [3,]  462.4775 -262.8231  755.5193\n```\n\n\
  ## 32.2 相关性\n\n虽然协方差是一个必要步骤，但我们可以捕捉变量之间关系的大小和方向：\n\n$\\mathbf{R} = \\begin{pmatrix}\
  \ 1 & r_{12} & r_{13} & {\\cdots} & r_{1p} \\\\ r_{21} & 1 & r_{23} & {\\cdots}\
  \ & r_{2p} \\\\ r_{31} & r_{32} & 1 & {\\cdots} & r_{3p} \\\\ {\\vdots} & {\\vdots}\
  \ & {\\vdots} & \\ddots & {\\vdots} \\\\ r_{p1} & r_{p2} & r_{p3} & {\\cdots} &\
  \ 1 \\end{pmatrix}$\n\n其中\n\n$r_{jk} = \\frac{s_{jk}}{s_{j}s_{k}} = \\frac{\\sum_{i=1}^{n}(x_{ij}\
  \ - \\overline{x}_{j})(x_{ik} - \\overline{x}_{k})}{\\sqrt{\\sum_{i=1}^{n}(x_{ij}\
  \ - \\overline{x}_{j})^{2}}\\sqrt{\\sum_{i=1}^{n}(x_{ik} - \\overline{x}_{k})^{2}}}$\n\
  \n是变量 $X[j]$ 和 $X[k]$ 之间的 Pearson 相关系数\n\n我们可以计算相关性矩阵\n\n$\\mathbf{R} = \\frac{1}{n}\\\
  mathbf{X}_{s}'\\mathbf{X}_{s}$\n\n其中：\n\n*   $\\mathbf{C} = \\mathbf{I}[n] - n^{-(n-1)}\\\
  mathbf{1}[n]\\mathbf{1}[n]'$ 表示中心化矩阵，\n\n*   $\\mathbf{D} = \\text{diag}(s[1]*,\
  \ \\dots, s[p])$ 表示对角缩放矩阵。\n\n注意标准化矩阵 $X[s]$ 的形式为\n\n\n\n\n\n$X_{s} = \\begin{pmatrix}\
  \ \\left. \\left( x_{11} - \\overline{x}_{1} \\right)\\slash s_{1} \\right. & \\\
  left. \\left( x_{12} - \\overline{x}_{2} \\right)\\slash s_{2} \\right. & {\\cdots\\\
  ,} & \\left. \\left( x_{1p} - \\overline{x}_{p} \\right)\\slash s_{p} \\right. \\\
  \\ \\left. \\left( x_{21} - \\overline{x}_{1} \\right)\\slash s_{1} \\right. & \\\
  left. \\left( x_{22} - \\overline{x}_{2} \\right)\\slash s_{2} \\right. & {\\cdots\\\
  ,} & \\left. \\left( x_{2p} - \\overline{x}_{p} \\right)\\slash s_{p} \\right. \\\
  \\ \\left. \\left( x_{31} - \\overline{x}_{1} \\right)\\slash s_{1} \\right. & \\\
  left. \\left( x_{32} - \\overline{x}_{2} \\right)\\slash s_{2} \\right. & {\\cdots\\\
  ,} & \\left. \\left( x_{3p} - \\overline{x}_{p} \\right)\\slash s_{p} \\right. \\\
  \\ {\\vdots} & {\\vdots} & \\ddots & {\\vdots} \\\\ \\left. \\left( x_{n1} - \\\
  overline{x}_{1} \\right)\\slash s_{1} \\right. & \\left. \\left( x_{n2} - \\overline{x}_{2}\
  \ \\right)\\slash s_{2} \\right. & {\\cdots\\,} & \\left. \\left( x_{np} - \\overline{x}_{p}\
  \ \\right)\\slash s_{p} \\right. \\\\ \\end{pmatrix}$\n\n### 如何实现？\n\n```r\n# 更直接\n\
  n <- nrow(X)\nsdx <- 1/matrix(1, n, 1)%*%apply(X, 2, sd)\nm <- matrix(1, n, 1)%*%colMeans(X)\n\
  Xs <- (X-m)*sdx\nXs\n```\n\n```r\n##               [,1]        [,2]        [,3]\n\
  ##  [1,] -0.121717156 -0.81233989  1.66102560\n##  [2,] -0.565704894  0.31273963\
  \ -1.23151117\n##  [3,] -2.404843294  0.02690804 -0.77135887\n##  [4,]  0.002581324\
  \ -1.21380031 -0.71032005\n##  [5,] -0.126516525 -1.03412063  0.0672369\n##  [6,]\
  \  0.656890910 -0.58746247  1.52435083\n##  [7,]  0.510227259 -0.05725905 -0.55881729\n\
  ##  [8,]  1.297945627  2.04462654 -0.01872963\n##  [9,]  0.697496131  0.27445664\
  \  0.72022674\n##  [10,]  0.053640619  1.04625151 -0.682129\n```\n\n```r\n# 或者\n\
  C <- diag(n) - matrix(1/n, n, n)\nD <- diag(apply(X, 2, sd))\nXs <- C*% solve(D)\n\
  ```\n\n```r\n##               [,1]        [,2]        [,3]\n##  [1,] -0.121717156\
  \ -0.81233989  1.66102560\n##  [2,] -0.565704894  0.31273963 -1.23151117\n##  [3,]\
  \ -2.404843294  0.02690804 -0.77135887\n##  [4,]  0.002581324 -1.21380031 -0.71032005\n\
  ##  [5,] -0.126516525 -1.03412063  0.0672369\n##  [6,]  0.656890910 -0.58746247\
  \  1.52435083\n##  [7,]  0.510227259 -0.05725905 -0.55881729\n##  [8,]  1.297945627\
  \  2.04462654 -0.01872963\n##  [9,]  0.697496131  0.27445664  0.72022674\n##  [10,]\
  \  0.053640619  1.04625151 -0.682129\n```\n\n```r\n# 或者\nXs <- scale(X, center=TRUE,\
  \ scale=TRUE)\n\n# 最后，相关系数矩阵\nR <- t(Xs)*% Xs / (n-1)\n```\n\n```r\n##         \
  \  [,1]        [,2]        [,3]\n##  [1,] 1.0000000  0.2745780  0.3885349\n##  [2,]\
  \ 0.2745780  1.0000000 -0.2644881\n##  [3,] 0.3885349 -0.2644881  1.000000\n```\n\
  \n```r\n# 检查一下\ncor(X)\n```\n\n```r\n##           [,1]        [,2]        [,3]\n\
  ##  [1,] 1.0000000  0.2745780  0.3885349\n##  [2,] 0.2745780  1.0000000 -0.2644881\n\
  ##  [3,] 0.3885349 -0.2644881  1.000000\n```\n\n上述相关系数被称为“零阶”或 Pearson 相关系数。它们仅反映两两之间的相关性，而不控制其他变量。\n\
  \n### 精度矩阵 \n\n协方差矩阵的逆矩阵（如果存在）被称为浓度矩阵，也称为**精度矩阵**（precision matrix）。\n\n考虑一个 $2\
  \ \\times 2$ 的协方差矩阵：\n\n$\\begin{bmatrix} \\sigma^{2}(x) & \\rho\\sigma(x)\\sigma(y)\
  \ \\\\ \\rho\\sigma(x)\\sigma(y) & \\sigma^{2}(y) \\end{bmatrix}$\n\n及其逆矩阵：\n\n\
  $\\frac{1}{\\sigma^{2}(x)\\sigma^{2}(y) - \\rho^{2}\\sigma^{2}(x)\\sigma^{2}(y)}\\\
  begin{bmatrix} \\sigma^{2}(y) & -\\rho\\sigma(x)\\sigma(y) \\\\ -\\rho\\sigma(x)\\\
  sigma(y) & \\sigma^{2}(x) \\end{bmatrix}$\n\n如果我们将精度矩阵称为 $D$，则相关系数为：\n\n$- \\frac{d_{ij}}{\\\
  sqrt{d_{ii}}\\sqrt{d_{jj}}}$\n\n或者，\n\n$\\frac{-\\rho\\sigma(x)\\sigma(y)}{\\sigma_{x}^{2}\\\
  sigma_{y}^{2}(1 - \\rho^{2})} = -\\rho$\n\n这是针对 $2\\times2$ 方差-协方差矩阵的。当有更多列时，相关系数反映的是偏相关。这是一个例子：\n\
  \n```r\npm <- solve(S) # 精度矩阵\n```\n\n```r\n##               [,1]          [,2]\
  \          [,3]\n##  [1,]  0.000762131 -0.000372673 -0.005198624\n##  [2,] -0.000372673\
  \  0.011036440  0.005770819\n##  [3,] -0.005198624  0.005770819  0.018907\n```\n\
  \n```r\n# 偏相关\npm[1,2]/(sqrt(pm[1,1])*sqrt(pm[2,2]))\n```\n\n```r\n# 或者\nsolve(S)\n\
  ```\n\n```r\n##            [,1]        [,2]        [,3]\n##  [1,] -0.121717156 -0.81233989\
  \  1.66102560\n##  [2,] -0.565704894  0.31273963 -1.23151117\n##  [3,] -2.404843294\
  \  0.02690804 -0.77135887\n##  [4,]  0.002581324 -1.21380031 -0.71032005\n##  [5,]\
  \ -0.126516525 -1.03412063  0.0672369\n##  [6,]  0.656890910 -0.58746247  1.52435083\n\
  ##  [7,]  0.510227259 -0.05725905 -0.55881729\n##  [8,]  1.297945627  2.04462654\
  \ -0.01872963\n##  [9,]  0.697496131  0.27445664  0.72022674\n##  [10,]  0.053640619\
  \  1.04625151 -0.682129\n```\n\n```r\n# 偏相关\npp::pcor(X)\n```\n\n\n\n\n\n由于高维数据集可用性的日益增加，图模型已成为在图结构上发现条件依赖关系的强大工具。在最后一章中，我们将深入研究正则化协方差矩阵，这是一种改进协方差矩阵估计的强大技术，特别是在处理高维数据时。通过引入正则化，我们可以增强协方差矩阵估计的稳定泛化性，使其更适用于金融、信号处理和机器学习等领域的应用。\n\
  \n识别网络中的关系面临两个主要挑战：首先，边（关系）可能通过皮尔逊（Pearson）或斯皮尔曼（Spearman）相关性识别，因为由于混杂因素，它们往往会导致虚假关联。其次，虽然偏相关应用可能会解决这个问题，但在高维数据情况下传统的精度估计器没有良好的定义。\n\
  \n为什么当 `X` 中的 `n < p` 时，协方差矩阵 `S` 是奇异的？考虑样本数据的 `n` *×* `p` 矩阵 `X`。由于我们知道 `X` 的秩最多为\
  \ `min(n, p)`。因此，在\n\n$$\\mathbf{S} = \\frac{1}{n}\\mathbf{X}_{c}^{\\prime}\\mathbf{X}_{c},$$\n\
  \nrank(`X`[c]*) 将是 `n`。显然，`S` 的秩不会大于 `X`[c]* 的秩。由于 `S` 是 `p` *×* `p` 且其秩为 `n`，`S`\
  \ 将是奇异的。也就是说，如果 `n < p` 则 rank(`X`) *< p*，在这种情况下 rank(`S`) *< p*。\n\n这为应用带来了几种新颖的精度估计器。通常，这些新颖估计器通过带有所谓惩罚项的对数似然极大化来克服欠采样问题。惩罚抑制了精度矩阵估计元素中出现大值。这降低了过拟合风险，同时也产生了一个定义良好的惩罚精度矩阵估计器。\n\
  \n为了解决这个问题，正如我们之前在第 6 部分看到的，惩罚估计器在似然函数中添加了惩罚（`Ridge` 中的 `\\ell`[`2]` 和 `lasso` 中的\
  \ `\\ell`[`1]`），使得 `S` 的特征值以特定方式收缩，以对抗 `p \\geq n`。图 lasso (`gLasso`) 是图岭（graphical\
  \ ridge）的 `\\ell`[`1]` 等价物。`\\ell`[`1]` 惩罚的一个优秀特性是自动产生稀疏性，从而选择底层图中的边。`Ridge` 中的\
  \ `\\ell`[`2]` 惩罚依赖于额外的步骤，在估计具有收缩相关性的正则化精度矩阵后选择边。\n\n在本章中，我们将看到基于高斯图模型的岭和 lasso\
  \ 应用在 `n < p` 的情况下提供稀疏精度矩阵。\n\n## 33.1 多元高斯分布\n\n在理解 `\\ell`[`1]` 或 `\\ell`[`2]`\
  \ 正则化之前，我们需要了解多元高斯分布、其参数化和极大似然估计（MLE）解。\n\n随机向量 `X` `∊` `R^p` 的多元高斯分布通常用参数 `μ` 和\
  \ `Σ` 表示，其中 `μ` 是一个 `p` *×* 1 向量，而 `Σ` 是一个 `p` *×* `p` 的非奇异对称协方差矩阵。因此，密度函数具有以下形式：\n\
  \n$$f(x \\mid \\mu,\\Sigma) = \\frac{1}{\\left. {(2\\pi)}^{p \\slash 2} \\middle|\
  \ \\Sigma|^{1 \\slash 2} \\right.}\\exp\\left\\{ {-frac{1}{2}(x - \\mu)^{T}\\Sigma^{-\
  \ 1}(x - \\mu)} \\right\\},$$\n\n其中 `|Σ|` 是协方差矩阵的行列式。似然函数为：\n\n$$\\mathcal{L}(\\\
  mu,\\Sigma) = (2\\pi)^{-\\frac{np}{2}}\\prod_{i = 1}^{n}\\det(\\Sigma)^{-\\frac{1}{2}}\\\
  exp\\left( - \\frac{1}{2}(x_{i} - \\mu)^{T}\\Sigma^{- 1}(x_{i} - \\mu) \\right)$$\n\
  \n由于估计值 `\\bar{x}` 不依赖于 `Σ`，我们可以直接在似然函数用它替换 `μ`，\n\n$$\\mathcal{L}(\\bar{x},\\Sigma)\
  \ \\propto \\det(\\Sigma)^{-\\frac{n}{2}}\\exp\\left( - \\frac{1}{2}\\prod_{i =\
  \ 1}^{n}(x_{i} - \\bar{x})^{T}\\Sigma^{- 1}(x_{i} - \\bar{x}) \\right)$$\n\n我们寻求使数据似然最大化的\
  \ `Σ` 值（在实践中，使用对数更容易）。利用迹的循环循环性，\n\n$$\\begin{array}{rl} \\mathcal{L}(\\bar{x},\\\
  Sigma) & \\propto \\det(\\Sigma)^{-\\frac{n}{2}}\\exp\\left( - \\frac{1}{2}\\prod_{i\
  \ = 1}^{n}(x_{i} - \\bar{x})^{T}\\Sigma^{- 1}(x_{i} - \\bar{x}) \\right) \\\\ &=\
  \ \\det(\\Sigma)^{-\\frac{n}{2}}\\exp\\left( - \\frac{1}{2}\\sum_{i = 1}^{n}(x_{i}\
  \ - \\bar{x})(x_{i} - \\bar{x})^{T}\\Sigma^{- 1} \\right) \\\\ &= \\det(\\Sigma)^{-\\\
  frac{n}{2}}\\exp\\left( - \\frac{1}{2}\\sum_{i = 1}^{n}(x_{i} - \\bar{x})(x_{i}\
  \ - \\bar{x})^{T}\\Sigma^{- 1} \\right) \\\\ &= \\det(\\Sigma)^{-\\frac{n}{2}}\\\
  exp\\left( - \\frac{1}{2}\\text{tr}(S\\Sigma^{- 1}) \\right) \\end{array}$$\n\n\
  其中\n\n$$S = \\sum_{i = 1}^{n}(x_{i} - \\bar{x})(x_{i} - \\bar{x})^{T} \\in \\mathbf{R}^{p\
  \ \\times p}$$\n\n最后，我们利用迹的技巧将似然重写为对数形式：\n\n$$\\ln\\mathcal{L}(\\mu,\\Sigma) = \\\
  text{const} - \\frac{n}{2}\\ln\\det(\\Sigma) - \\frac{1}{2}\\text{tr}\\left[\\Sigma^{-\
  \ 1}\\sum_{i = 1}^{n}(x_{i} - \\mu)(x_{i} - \\mu)^{T}\\right]$$\n\n或者，对于均值为 0 且协方差为\
  \ `Σ` 的多元正态模型，在这种情况下似然函数由给出\n\n$$\\ell(\\Omega;S)=\\ln|\\Omega|-\\text{tr}(S\\Omega)$$\n\
  \n其中 `Ω = Σ^{-1}` 是所谓的精度矩阵（有时也称为浓度矩阵），我们想要估计它，我们将其记为 `P`。事实上，人们自然地尝试使用 `S` 的逆来进行此。\n\
  \n为了直观地观察整个代数过程，让我们从通用正态密度开始\n\n$$\\frac{1}{\\sqrt{2\\pi}}\\frac{1}{\\sigma}\\exp\\\
  left( - \\frac{1}{2}\\left(\\frac{x - \\mu}{\\sigma}\\right)^{2} \\right)$$\n\n\
  对数似然为\n\n$$\\mathcal{L}(\\mu,\\sigma) = \\text{A constant} - \\frac{n}{2}\\log(\\\
  sigma^{2}) - \\frac{1}{2}\\sum_{i = 1}^{n}\\left(\\frac{x_{i} - \\mu}{\\sigma}\\\
  right)^{2}$$\n\n对其进行极大化等同于最小化\n\n$$\\mathcal{L}(\\mu,\\sigma) = n\\log(\\sigma^{2})\
  \ + \\sum_{i = 1}^{n}\\left(\\frac{x_{i} - \\mu}{\\sigma}\\right)^{2}$$\n\n我们可以查看通用多元正态（MVN）密度\n\
  \n$$\\left. (\\sqrt{2\\pi})^{- d} \\middle| \\Sigma|^{-1 \\slash 2} \\right.}\\\
  exp\\left\\{ {-frac{1}{2}(x - \\mu)^{T}\\Sigma^{- 1}(x - \\mu)} \\right\\}$$\n\n\
