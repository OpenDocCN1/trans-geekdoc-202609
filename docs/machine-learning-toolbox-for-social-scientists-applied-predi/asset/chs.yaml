  \\left. \\\\underset{b = 1}{\\\\overset{B}{\\\\Sigma}}\\alpha\\_{b}{\\hat{m}}\\\
  _{b}(x \\right) \\right),$\n\n这是一个定义如下的符号函数：\n\n${sign}\\\\left( x \\\\right): :=\
  \ \\\\left\\\\{ \\\\begin{array}{ll} {- 1} & {\\\\text{~if~}x < 0} \\\\\\\\ 0 &\
  \ {\\\\text{~if~}x = 0} \\\\\\\\ 1 & {\\\\text{~if~}x > 0} \\\\\\\\ \\\\end{array}\
  \ \\\\right.$\n\n这是一个简单的模拟，展示了 `£[b]*` 如何使每棵树（${\\\\overset{\\\\hat{}}{m}}\\_{b}\\\
  left( x \\right)$）重要性产生差异：\n\n```\nn = 1000\nset.seed(1)\nerr <- sample(seq(0, 1,\
  \ 0.01), n, replace = TRUE)\nalpha = 0.5 * log((1 - err) / err)\nind = order(err)\n\
  plot(\n  err[ind],\n  alpha[ind],\n  xlab = \"error (err)\",\n  ylab = \"alpha\"\
  ,\n  type = \"o\",\n  col = \"red\",\n  lwd = 2\n)\n```\n\n![](img/Fig13_13.jpg)\n\
  \n我们可以看到，当没有分类错误（`err` = 0）时，“alpha”将是一个很大的正数。当分类器非常弱且预测结果仅相当于随机猜测时（`err` = 0.5），分类器的重要性为\
  \ 0。如果所有观测值都被错误分类（`err` = 1），我们的 `alpha` 值将是一个负整数。\n\n`AdaBoost.M1` 被称为“离散分类器”，因为它直接计算离散类别标签\
  \ `ŷ`[`i*]`，而不是预测概率 `p̂`[`i*]`[`i*]`。\n\n我们会选择什么种类型的分类器 `m̂`[`b*]`(`*x*`)？通常选择一个像“桩”（一个具有两个终端节点的分类树，即只有一次划分）的“弱分类器”就足够了。`m̂`[`b*]`(`*x*`)\
  \ 选择一个变量来形成一个产生最低 Gini 指数的桩。\n\n这里有一个使用 `myocarde` 数据的简单示例，展示我们如何使用 AdaBoost 算法来增强一个简单的弱学习器（桩）：\n\
  \n```\nlibrary(rpart)\n\n# Data\nmyocarde <- read_delim(\"myocarde.csv\", delim\
  \ = \";\" ,\n                       escape_double = FALSE, trim_ws = TRUE,\n   \
  \                    show_col_types = FALSE)\n\nmyocarde <- data.frame(myocarde)\n\
  y <- (myocarde[ , \"PRONO\"] == \"SURVIE\") * 2 - 1\nx <- myocarde[ , 1:7]\ndf <-\
  \ data.frame(x, y)\n\n# 设置\nrnd = 100 # 轮数\nm = nrow(x)\nwhts <- rep(1 / m, m) #\
  \ 初始权重\nst <- list() # 保存所有桩的容器\nalpha <- vector(mode = \"numeric\", rnd)\ny_hat\
  \ <- vector(mode = \"numeric\", m)\n\nset.seed(123)\nfor(i in 1:rnd) {\n  st[[i]]\
  \ <- rpart(y ~ ., data = df, weights = whts, maxdepth = 1, method = \"class\")\n\
  \  y_hat <- predict(st[[i]], x, type = \"class\")\n  e <- sum(y_hat != y) * whts\n\
  \  # alpha\n  alpha[i] <- 0.5 * log((1 - e) / e)\n  # 更新权重\n  whts <- whts * exp(-alpha[i]\
  \ * y_hat)\n  # 归一化权重\n  whts <- whts / sum(whts)\n}\n\n# 使用每个桩进行最终预测\nfor (i in\
  \ 1:rnd) {\n  pred = predict(st[[i]], df, type = \"class\")\n  y_hat = y_hat + alpha[i]\
  \ * pred\n}\n# 看看 y_hat 是什么\ny_hat\n```\n[1] 3.132649 -4.135666 -2.290437 7.547707\
