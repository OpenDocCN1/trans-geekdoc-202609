  \n如你所示，估计的逻辑回归系数与我们的 DGM 系数（2, 3）一致。\n\n$\\log\\left( \\frac{\\hat{p}(x)}{1 - \\\
  hat{p}(x)} \\right) = - 1.8253 + 2.7809x$\n\n### 5.2.1 估计逻辑回归\n\n由于 Logit 是线性函数：\n\
  \n$\\operatorname{Logit}_{i} = \\log\\left( \\frac{p\\left( \\mathbf{x}_{i} \\right)}{\\\
  left. 1 - p\\left( \\mathbf{x}_{i} \\right)} \\right)} \\right) = \\beta_{0} + \\\
  beta_{1}x_{i1} + \\cdots + \\beta_{p - 1}x_{i(p - 1)}$ (5.8)\n\n似乎我们可以通过普通的 OLS\
  \ 来估计它。但我们只观察到 `Y = 1` 或 `Y = 0`，而不是 `p(x)`。为了估计 `β` 参数，我们应用极大似然估计法。首先，给定观测数据写出似然函数\
  \ `L(β)`，这在技术上是一个由 `n` 个单独密度函数乘积组成的联合概率密度函数：\n\n$L(\\mathbf{\\beta}) = \\underset{i\
  \ = 1}{\\overset{n}{\\Pi}}P\\left( Y_{i} = y_{i} \\middle| \\mathbf{X}_{i} = \\\
  mathbf{x}_{i} \\right)$\n\n\n\n\n$\\\\begin{array}{ccl} {\\\\ell\\\\left( \\\\beta\\\
  _{0},\\\\beta \\\\right)} & = & {\\\\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}y\\\
  _{i}\\\\log p{\\\\left( x\\_{i} \\\\right) + \\\\left( 1 - y\\_{i} \\\\right)\\\\\
  log\\\\left( 1 - p\\\\left( x\\_{i} \\\\right) \\\\right)}} \\\\\\\\ & = & {\\\\\
  underset{i = 1}{\\\\overset{n}{\\\\Sigma}}\\\\log\\\\left( 1 - p\\\\left( x\\_{i}\
  \ \\\\right) \\\\right) + \\\\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}y\\_{i}\\\
  \\log\\\\frac{p\\\\left( x\\_{i} \\\\right)}{1 - p\\\\left( x\\_{i} \\\\right)}}\
  \ \\\\\\\\ & = & {\\\\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}\\\\log\\\\left(\
  \ 1 - p\\\\left( x\\_{i} \\\\right) \\\\right) + \\\\underset{i = 1}{\\\\overset{n}{\\\
  \\Sigma}}y\\_{i}\\\\left( \\\\beta\\_{0} + {\\\\beta x}\\_{i} \\\\right)} \\\\\\\
  \\ & = & {\\\\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}\\\\log 1/{\\\\left( 1 +\
  \ e^{z\\_{i}} \\\\right) + \\\\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}y\\_{i}\\\
  \\left( z\\_{i} \\\\right)}} \\\\\\\\ & = & {\\\\underset{i = 1}{\\\\overset{n}{\\\
  \\Sigma}} - \\\\log{\\\\left( 1 + e^{z\\_{i}} \\\\right) + \\\\underset{i = 1}{\\\
  \\overset{n}{\\\\Sigma}}y\\_{i}{\\\\left( z\\_{i} \\\\right),}}} \\\\\\\\ \\\\end{array}{}\\\
  \\operatorname{}$ (5.9)\n\n其中 `z`[`i`] = `β`[`0]` + `β`[`1]``x`[`1i`]` + ⋯。\n\n\
  有了对数似然函数，我们只需要选择使之最大化的 `β` 值即可。通常，为了找到这些值，我们需要对对数似然关于参数（`β`）求导，将导数置于零并求解。\n\n$\\\
  \\begin{array}{rlr} \\\\frac{\\\\partial\\\\ell}{\\partial\\\\beta\\_{j}} & {= -\
  \ \\\\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}\\\\frac{1}{1 + e^{\\beta\\_{0}\
  \ + x\\_{i}\\\\beta}}e^{\\beta\\_{0} + x\\_{i}\\\\beta}x\\_{ij} + \\\\underset{i\
  \ = 1}{\\\\overset{n}{\\\\Sigma}}y\\_{i}x\\_{ij}} & \\\\\\\\ {= \\\\underset{i =\
  \ 1}{\\\\overset{n}{\\\\Sigma}}\\\\left( y\\_{i} - p\\\\left( x\\_{i};\\\\beta\\\
  _{0},\\\\beta \\\\right) \\\\right)x\\_{ij}} & \\\\\\\\ \\\\end{array}$\n\n遗憾的是，最大值没有闭式解。然而，我们可以通过算法（数值）优化方法（见附录）找到\
  \ `β` 的最佳值。\n\n### 5.2.2 代代价函数\n\n代价函数代表估计和预测中的优化目标。在线性回归中，它是误差平方的简单和，即\n\n`SSE`  = ∑(`ŷ`[`i`] − `y`[`i`])²\
  \ (5.10) \n\n如果我们在`Logistic Regression`（逻辑回归）中使用类似的代价函数，我们将得到一个具有许多局部最小点的非凸函数，使得定位全局最小值变得困难。在逻辑回归中，正如我们刚刚看到的，对数似然函数变成了代价函数。在机器学习文献中，符号略有不同：\n\
  \n${}J = \\\\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}y\\_{i}\\\\log p\\\\left(\
  \ x\\_{i} \\\\right) + \\\\left( 1 - y\\_{i} \\\\right)\\\\log(1 - p\\\\left( x\\\
  _{i} \\\\right)),$ (5.11)\n\n其中对于每个观测值，\n\n$p\\\\left( \\\\mathbf{\\text{x}}\\_{\\\
  mathbf{\\text{i}}} \\\\right) = \\frac{e^{\\\\beta\\_{0} + \\\\beta x\\_{i}}}{1\
  \ + e^{\\\\beta\\_{0} + \\\\beta x\\_{i}}}$\n\n由于在实践中最大化一个函数更为常见，因此在对数似然函数前面加上负号来取反。对于分类问题，方程\
  \ 5.11 也称为“对损失”（log loss）、“交叉熵”（cross-entropy）和“负对数似然”（negative log-likelihood），通用。\n\
  \n现在有了代价函数，我们只需要选择最小化它的 `β` 值。由于多维解析解的困难，我们使用梯度下降和其他其他类型的算法优化方法。\n\n当 `y[i]` ∈ {+1,\
  \ −1} 时，相同的代价函数可以写为：\n\n$g\\\\_{i}(\\mathbf{\\text{w}}) = \\\\left\\\\{ \\\\begin{array}{ll}\
  \ {- \\\\log\\\\left( p\\\\left( {\\\\mathbf{\\text{x}}\\_{i}}^{T}\\\\mathbf{\\\
  text{w}} \\\\right) \\\\right)\\\\quad} & {\\\\text{~if~}y\\\\_{i} = + 1} \\\\\\\
  \\ {- \\\\log\\\\left( 1 - p\\\\left( {\\\\mathbf{\\text{x}}\\_{i}}^{T}\\\\mathbf{\\\
  text{w}} \\\\right) \\\\right)\\\\quad} & {\\\\text{~if~}y\\\\_{i} = - 1} \\\\\\\
  \\ \\\\end{array} \\\\right.$\n\n然后我们可以通过对这些对数误差（Log Error）代价取平均来形成逻辑回归的 `Softmax`\
  \ 代价：\n\n$g(\\mathbf{\\text{w}}) = \\\\frac{1}{n}\\\\underset{i = 1}{\\\\overset{n}{\\\
  \\Sigma}}g\\\\_{i}(\\mathbf{\\text{w}}).$\n\n通常通过以下等方式重写对数误差来不同的表示 Softmax 代价。注意当\
  \ `z` = **x**^T **w** 时：\n\n$1 - p(z) = 1 - \\\\frac{1}{1 + e^{- z}} = \\\\frac{1\
  \ + e^{- z}}{1 + e^{- z}}$\n\n因此，点代价可以写成：\n\n$g\\\\_{i}(\\mathbf{\\text{w}}) = \\\
  \\leftleft{ \\\\begin{array}{ll} {- \\\\log\\\\left( p\\\\left( {\\\\mathbf{\\text{x}}\\\
  _{i}}^{T}\\\\mathbf{\\text{w}} \\\\right) \\\\right)\\\\quad} & {\\\\text{~if~}y\\\
  \\_{i} = + 1} \\\\\\\\ {- \\\\log\\\\left( 1 - p\\\\left( {\\\\mathbf{\\text{x}}\\\
  _{i}}^{T}\\\\mathbf{\\text{w}} \\\\right) \\\\right)\\\\quad} & {\\\\text{~if~}y\\\
  \\_{i} = - 1} \\\\\\\\ \\\\end{array} \\\\right.$\n\n现在我们有了代价函数，只需要选择最小化它的 `β` 值。由于多维解析解的困难，我们使用梯度下降和其他类型的算法优化方法。\n\
  \n当 `y[i]` ∈ {+1, −1} 时，相同的代价函数可以写为：\n\n$g\\\\_{i}(\\mathbf{\\text{w}}) = \\\\leftleft{\
  \ \\\\begin{array}{ll} {- \\\\log\\\\left( p\\\\left( {\\\\mathbf{\\text{x}}\\_{i}}^{T}\\\
  \\mathbf{\\text{w}} \\\\right) \\\\right)\\\\quad} & {\\\\text{~if~}y\\\\_{i} =\
  \ + 1} \\\\\\\\ {- \\\\log\\\\left( 1 - p\\\\left( {\\\\mathbf{\\text{x}}\\_{i}}^{T}\\\
  \\mathbf{\\text{w}} \\\\right) \\\\right)\\\\quad} & {\\\\text{~if~}y\\\\_{i} =\
  \ - 1} \\\\\\\\ \\\\end{array} \\\\right.$\n\n我们可以通过对这些对数误差代价取平均来形成逻辑回归的 `Softmax`\
  \ 代价：\n\n$g(\\mathbf{\\text{w}}) = \\\\frac{1}{n}\\\\underset{i = 1}{\\\\overset{n}{\\\
  \\Sigma}}g\\\\_{i}(\\mathbf{\\text{w}}).$\n\n通常通过以下等方式重写对数误差来表示 Softmax 代价。注意当 `z`\
  \ = **x**^T **w** 时：\n\n$1 - p(z) = 1 - \\\\frac{1}{1 + e^{- z}} = \\\\frac{1 +\
  \ e^{- z}}{1 + e^{- z}} = \\\\frac{e^{- z}}{1 + e^{- z}} = p(z)$\n\n因此，点代价可以写为：\n\
  \n$g\\\\_{i}(\\mathbf{\\text{w}}) = \\\\leftleft{ \\\\begin{array}{ll} {- \\\\log\\\
  \\left( p\\\\left( {\\\\mathbf{\\text{x}}\\_{i}}^{T}\\\\mathbf{\\text{w}} \\\\right)\
  \ \\\\right)\\\\quad} & {\\\\text{~if~}y\\\\_{i} = + 1} \\\\\\\\ {- \\\\log\\\\\
  left( 1 - p\\\\left( {\\\\mathbf{\\text{x}}\\_{i}}^{T}\\\\mathbf{\\text{w}} \\\\\
  right) \\\\right)\\\\quad} & {\\\\text{~if~}y\\\\_{i} = - 1} \\\\\\\\ \\\\end{array}\
  \ \\\\right.$\n\n\n\n\n$\\begin{matrix} \\text{~预测~vs.~真实} & {Y = 1} & {Y = 0} \\\
  \\ {\\\\overset{\\\\hat{}}{Y} = 1} & \\text{~TP~}\\_{} & \\text{~FP~}\\_{} \\\\\
  \ {\\\\overset{\\\\hat{}}{Y} = 0} & \\text{~FN~}\\_{} & \\text{~TN~}\\_{} \\\\ \\\
  \\end{matrix}$\n\n其中，`TP`、`FP`、`FN`、`TN` 分别代表“真正”、“假正”、“假负”、“真负”。此表也被称为混淆矩阵（Confusion\
  \ Table）。从此表中可以计算许多指标来衡量我们分类器的准确性。我们稍后将在第 10 章中详细讨论这个主题。\n\n## Note\n\n1. 直观上看，当\
  \ `n` = 1 时，获得一次正面（`k` = 1）的概率 `P(head)` = `p^k*(1 - p)^(1-*k*)` = `p`，或者 `P(tail)`\
  \ = `p^k*(1 − p)^(1-*k*)` = 1 − `p`。\n\n# 6 非参数估计 - 基础\n\nDOI: [10.1201/9781003381501-8](https://doi.org/10.1201/9781003381501-8)\n\
  \n我们在前几章节中看到的模型是参数化的，这意味着在进行估计之前，必须对由参数控制的回归函数 `m` 假设某种结构。因此，如果 `m` 的设定是正确的，参数化模型的结果就是最好的。避免这种假设是非参数方法最大的优势，因为非参数方法不需要任何难以满足的预设回归函数。\n\
  \n在谈论回归函数 `m` 的非参数估计器之前，我们应该先看一眼 `X` 的简单非参数密度估计。我们的目标是从样本中估计 `f(x)`，且不假设 `f` 的任何特定形式。\n\
  \n## 6.1 密度估计\n\n我们将只研究单变量核密度估计（KDEs）。假设一个包含 `n` 个观测值的样本 `y[1]`, ..., `y[n]` 是从参数分布\
  \ `f(y, θ)` 中抽取的。如果数据是独立同分布（i.i.d.），则联合密度函数为：\n\n${f(y;\\theta) = \\underset{i =\
  \ 1}{\\overset{n}{\\Pi}}f\\left( y_{i};\\theta \\right)$ (6.1)\n\n为了进行估计，我们找到使该密度函数（似然）或其对数变换最大的参数：\n\
  \n${}\\ell(y;\\theta) = \\log f(y;\\theta) = \\underset{i = 1}{\\overset{n}{\\Sigma}}\\\
  log f\\left( y_{i};\\theta \\right)$ (6.2)\n\n我们应用极大似然估计（MLE）方法来恢复 `θ`。这被称为参数估计，如果我们的预设密度模型是不正确的（即\
  \ `f` 设定不当），我们将得到一个对 `θ` 的偏估计量。为了避免这个问题，我们可以使用非参数估计，它不需要对数据的分布做出假设。\n\n密度估计的起点是直方图。我们通过选择箱（bins）的数量和第一个区间的起始值来定义区间。这里，我们使用\
  \ 0 作为起始值，并设置 10 个箱：\n\n```r\n# 从 1 到 100 的随机整数\nset.seed(123)\ndata <- sample(1:100,\
  \ 100, replace = TRUE)\nstem(data)\n```\n\n```text\n##\n##   小数点右侧有 1 位数字 |\n##\n\
  ##   0 | 4677799\n##   1 | 2334456\n##   2 | 1233555567\n##   3 | 001122445688\n\
  ##   4 | 01122337\n##   5 | 0012337\n##   6 | 00347799\n##   7 | 122246689\n## \
  \  8 | 11236699\n##   9 | 00112233456679\n```\n\n```r\nfoo <- hist(\n  data,\n \
  \ nclass = 10,\n  col = \"lightblue\",\n  cex.main = 0.80,\n  cex.axis = 0.75\n\
  )\n```\n\n![](img/Fig06_01.jpg)\n\n```r\nfoo$counts\n```\n\n```text\n##  [1]  8\
  \  13 13  9  7 10 11 14\n```\n\n```r\nfoo$density\n```\n\n```text\n##  [1] 0.008\
  \ 0.008 0.013 0.013 0.009 0.007 0.007 0.010 0.011 0.014\n```\n\n```r\nsum(foo$density)\n\
  ```\n\n```text\n##  1\n```\n\n这些密度的和并不是 1。纵轴频率显示了每个箱的观测值数量。从上面可以看出，最高的柱条有 14 个观测值，因此该柱条占的相对频率为\
  \ 14/100=0.14。总频率应该是 1。\n\n我们可以有一个公式来计算每个点的密度：\n\n$\\overset{\\hat{f}}{(y) = \\\
  frac{1}{n} \\times \\frac{\\text{区间内的观测值数量}}{\\text{区间宽度}}$ (6.3)\n\n这里是 `binwidth\
  \ = 4` 情况下相同数据的 pdf：\n\n```r\n# 将 pdf 和 X 放在同一张图上\nfoo <- hist(\n  data,\n  nclass\
  \ = 25,\n  cex.main = 0.80,\n  cex.axis = 0.75,\n  xlim = c(0,2),\n  main = NULL\n\
  )\nlines(foo$points, col = \"blue\", lwd = 2) #Naive![](img/Fig06_02.jpg)\n\n箱的数量定义了直方图的平滑度。我们可以得到非参数估计的如下表达式：\n\
  \n$f(x)\\cong\\frac{k}{nh}\\begin{array}{ll} h & \\text{箱宽} \\\\ n & \\text{点总数}\
  \ \\\\ k & \\text{h 范围内的观测值}\\end{array}$ (6.4)\n\n注意在实际密度估计中，可以采用两种基本方法：(1) 固定\
  \ `h`（宽度）并确定每个箱内的 `k`，这被称为核密度估计（KDE）；或 (2) 在每个箱内固定 `k` 并从数据确定 `h`。这引出了 k 最近邻（kNN）方法，我们将在后续章节中介绍。\n\
  \n全局密度可以通过移动窗口（区间）获得，也称为朴估计（Naive Parzen windows）。朴估计对箱的位置不敏感，但它不是平滑的：\n\n$\\overset{\\\
  hat{f}}{(y) = \\frac{1}{nh}\\underset{i = 1}{\\overset{n}}I\\left( y - \\frac{h}{2}\
  \ < y + \\frac{h}{2} \\right),$ (6.5)\n\n其中 `I(.)` 是指示函数，如果表达式成立则为 1（否则为 0）。因此，它统计了给定窗口内的观测值数量。箱宽（`h`）通过在\
  \ `y` 上加减 `h/2` 来定义箱范围。我们可以重新排列 6.5：\n\n$\\hat{f}(y) = \\frac{1}{2nh}\\underset{i\
  \ = 1}{\\overset{n}}I\\left( y - h < y_{i} < h \\right).$\n\n如果通过减去 `y` 并除以 `h`\
  \ 来重写不等式：\n\n$\\hat{f}(y) = \\frac{1}{2nh}\\underset{i = 1}{\\overset{n}}I\\left(\
  \ - 1 < \\frac{y - y_{i}}{h} < 1 \\right),$\n\n可以更紧凑地写作：\n\n$\\overset{\\hat{f}}{(y)\
  \ = \\frac{1}{2nh}\\underset{i = 1}{\\overset{n}}w\\left( \\frac{y - y_{i}}{h} \\\
  right)\\quad\\text{where}\\quad w(x) = \\left\\{ \\begin{array}{ll} 1 & \\text{if}|x|\
  \ < 1.} \\\\ 0 & \\text{otherwise}\\end{array} \\right.$ (6.6)\n\n考虑样本 $\\{X[i]\\\
  }_{i=1}^{10}$，即 4, 5, 5, 6, 12, 14, 15, 15, 16, 17。箱宽 `h` = 4。33 的密度 $\\hat{f}(3)$\
  \ 是多少？注意数据中没有 3。\n\n$\\begin{array}{rlr} {\\hat{f}(3)} & {= \\frac{1}{2 \\times\
  \ 10 \\times 4}\\left\\{ w\\left( \\frac{3 - 4}{4} \\right) + w\\left( \\frac{3\
  \ - 5}{4} \\right) + \\cdots + w\\left( \\frac{3 - 17}{4} \\right) \\right\\}} &\\\
  \\ & {= \\frac{1}{80}\\left\\{ 1 + 1 + 1 + 1 + 0 + \\cdots + 0 \\right\\}} &\\\\\
  \ & {= \\frac{1}{20}} &\\\\ \\end{array}$\n\n\n\n\n\n用核密度估计器将 6.6 中的 `w` 替换为核函数\
  \ `K`：\n\n$\\\\overset{\\\\hat{}}{f}{}\\\\operatorname{}(y) = \\\\frac{1}{2nh}\\\
  \\underset{i = 1}{\\\\overset{n}{\\\\Sigma}}K\\\\left( \\frac{y - y\\_{i}}{h} \\\
  \\right),$ (6.7)\n\n以下是核函数的示例，`K`(`x`):\n\n$\\\\begin{array}{l} \\\\begin{array}{l}\
  \ {\\\\text{Rectangular}{\\left( \\text{uniform} \\\\right):K{\\left( x \\\\right)\
  \ = \\\\begin{cases} \\\\frac{1}{2} & \\\\left| x \\\\middle| < 1 \\\\right. \\\\\
  \\\\ 0 & \\\\text{otherwise} \\\\ \\\\end{cases}}}} \\\\\\\\ {\\\\text{Epanechinikov:}K{\\\
  left( x \\\\right) = \\\\left\\\\{ \\\\begin{array}{ll} {\\\\frac{3}{4}\\\\left(\
  \ 1 - \\\\frac{1}{5}x^{2} \\\\right)/\\\\sqrt{5}} & \\\\left| x \\\\middle| < \\\
  \\sqrt{5} \\\\right. \\\\\\\\ 0 & \\\\text{otherwise} \\\\\\\\end{array} \\\\right\\\
  \\}}} \\\\\\\\ \\\\end{array} \\\\\\\\ {\\\\text{Gaussian:}K{\\left( x \\\\right)\
  \ = \\\\frac{1}{\\\\sqrt{2\\\\pi}}e^{( - 1/2)x^{2}}}} \\\\\\\\ \\\\end{array}$\n\
  \n尽管核密度估计依赖于核函数 `K` 的选择，但它对 `h` 非常敏感，而不是对 `K`。\n\n在 R 中，标准的 KDE 通过 `density()` 获取，它使用\
  \ `Silverman rule-of-thumb` 来选择最优带宽 `h`，以及 `Gaussian kernel`。这里有一个使用我们人工数据的示例：\n\
  \n```\nX <- readRDS(\"fes73.rds\")\nX <- X / mean(X)\nhist(\n  X[X < 3.5],\n  nclass\
  \ = 130,\n  probability = TRUE,\n  col = \"white\",\n  cex.axis = 0.75,\n  cex.main\
  \ = 0.8,\n  main = NULL\n)\nlines(density(X, adjust = 1 / 4), col = \"red\") # bandwidth/4\n\
  lines(density(X, adjust = 1), col = \"blue\")\nlines(density(X, adjust = 4), col\
  \ = \"green\") # bandwidth x 4\nlines(density(X, kernel = \"rectangular\", adjust\
  \ = 1 / 4),\n      col = \"black\") # bandwidth x 4\n```\n\n![](img/Fig06_03.jpg)\n\
  \n```\n#Here is the details of the last one\ndensity(X, adjust = 4)\n```\n\n```\n\
  ##\n## Call:\n##  density.default(x = X, adjust = 4)\n##\n## Data: X (6968 obs.);\
  \ Bandwidth ’bw' = 0.3423\n##\n##        x                y\n##  Min.   :-0.954\
  \   Min.   :0.0000000\n##  1st Qu.: 2.352   1st Qu.:0.0000576\n##  Median : 5.657\
  \   Median :0.0005510\n##  Mean   : 5.657   Mean   :0.0755509\n##  3rd Qu.: 8.963\
  \   3rd Qu.:0.0269050\n##  Max.   :12.269   Max.   :0.6282958\n```\n\n带宽 `h` 越大，概率密度函数（pdf）越平滑。哪一个更好呢？有多种带宽选择方法可以确定最佳拟合\
  \ `h`，这些超出了本章的范围。\n\n我们为什么要用 KDE 来估计 pdf？注意，当你通过 `str()` 探索我们的密度对象时，你会发现 `y` 将为你提供数据中每个\
  \ `X` 值的密度 pdf 值。当然，pdf 是一个函数：pdf 的值是 `Y`，输入值是 `X`。因此，给定 `X` 上的一个新数据点，我们可能想要找到结果。\n\
  \n```\npoo <- density(X, adjust = 1 / 4)\n\ndens <- approxfun(poo)\n\nplot(poo,\
  \ col = \"blue\")\nx_new <- c(0.5, 1.5, 2)\npoints(x_new, dens(x_new), col = \"\
  black\")\n```\n\n![](img/Fig06_04.jpg)\n\n这是使用 `approxfun` 函数对 `X` 进行 `Y` 的回归。\n\
  \n## 6.2 核回归\n\n从理论上讲，非参数估计很容易扩展到多个维度。例如，假设我们感兴趣使用几个预测变量来预测 `Y`。我们不知道模型可能采取什么函数形式。在实践中，我们需要许多样本。随着维度的增加，KDE\
  \ 迅速需要更多样本。\n\nKDE 中箱平滑方法的局限性是，为了使“近似常数”假设成立，我们需要较小的窗口。结果我们只有少数点可以平均。局部估计回归平滑（`loess`）允许我们考虑更大的窗口尺寸，这在局部领域内拟合多个回归的非参数方法。\n\
  \n它被称为局部回归，因为它不是假设函数在窗口内近似常数，而是在 *x*[0] 的“邻域”处拟合局部回归。从 *x*[0] 的距离由 `span` 设置控制，它决定了平滑数据时移动（滑动）窗口的宽度。参数\
  \ `span` 代表被认为是邻域的数据比例。通常 `span` 应该在 0 和 1 之间。当它大于 1 时，回归将过度平滑。此外，回归中的权重与 1 - (距离/最大距离)³\
  \ 正比，这被称为 Tukey 三权重。与高斯核不同，Tukey 三权重 覆盖了更多靠近中心点点。\n\n回归的一个重要特例是简单回归，其中只有一个预测变量：\n\
  \n$\\begin{array}{rl} m\\left( x \\right) = & \\frac{\\int yf\\left( x \\right)dy}{f\\\
  left( x \\right)} \\end{array}$ (6.9)\n\n这表明回归可以通过 `Y` 和 `X` 的联合密度计算出来。因此，可以使用 `density()`\
  \ 函数来估计 `Y` 的条件均值。\n\n\n\n\n\n```\n# 模拟我们的数据\nn = 300\nset.seed(1)\nx <- sort(runif(n)\
  \ * 2 * pi)\ny <- sin(x) + rnorm(n) / 4\n# 估计\nloe0 <- loess(y ~ x, degree = 0,\
  \ span = 0.5) # Nadaraya-Watson\nloe1 <- loess(y ~ x, degree = 1, span = 0.5) #\
  \ 局部线性\nloe2 <- loess(y ~ x, degree = 2, span = 0.5) # 局部二次\n\n# 为了绘图，我们首先在网格上计算拟合值\n\
  t <- seq(min(x), max(x), length.out = 100)\nfit0 <- predict(loe0, t)\nfit1 <- predict(loe1,\
  \ t)\nfit2 <- predict(loe2, t)\nplot(x,\n     y,\n     col = \"gray\",\n     cex.main\
  \ = 0.80,\n     cex.axis = 0.75)\nlines(t, fit0, col = \"green\", lwd = 3)\nlines(t,\
  \ fit1, col = \"red\")\nlines(t, fit2, col = \"blue\")\n```\n\n![](img/Fig06_05.jpg)\n\
  \n以及它对带宽的敏感性：\n\n```\nfit0 <-\n  predict(loess(y ~ x, degree = 2, span = 0.05))\
  \ # 最小，5%*300 = 14 个观测\nfit1 <- predict(loess(y ~ x, degree = 2, span = 0.75)) #\
  \ 默认\nfit2 <- predict(loess(y ~ x, degree = 2, span = 2))\n\nplot(x,\n     y,\n\
  \     col = \"gray\",\n     cex.main = 0.80,\n     cex.axis = 0.75)\nlines(x, fit0,\
  \ lwd = 2, col = \"green\")\nlines(x, fit1, lwd = 2, col = \"red\")\nlines(x, fit2,\
  \ lwd = 2, col = \"blue\")\n```\n\n![](img/Fig06_06.jpg)\n\n我们选择的带宽将由预测精度决定。这个主题与`交叉验证`有关，我们将在后面的章节中详细介绍。\n\
  \n## 6.3 回归样条 (Regression Splines)\n\n在模型中，非线性可以通过通过在多个区间内估计线性回归来捕捉，这被称为`分段线性模型`。\n\
  \n$\\begin{matrix} {y = \\alpha_{1} + \\beta_{1}x + \\varepsilon_{1}} & \\text{if}\
  \ & {x \\in \\left[z_{0};z_{1}\\right]}} \\\\ {y = \\alpha_{2} + \\beta_{2}x + \\\
  varepsilon_{2}} & \\text{if} & {x \\in \\left[z_{1};z_{2}\\right]}} \\\\ \\cdots\
  \ & & {y = \\alpha_{k} + \\beta_{k}x + \\varepsilon_{k}} & \\text{if} & {x \\in\
  \ \\left[z_{k - 1};z_{k}\\right]}} \\end{matrix}$ (6.10)\n\n该函数在节点处不会有平滑过渡，这引出了`样条`（spline），它是一种在节点处具有平滑过渡的`分段回归模型`。首先，让我们通过一个例子来看看分段回归是如何工作的。为了展示短期和长期利率之间的非线性证据，Pfann\
  \ 等人 (1996) 估计了以下线性模型：$y=\\beta[0] + \\beta[1]x + \\beta2 + \\epsilon$ (6.11)，在方程\
  \ 6.12 中，`kappa` 表示 `Y` 与 `x` 之间关系变化的`节点`（knot）。下标 `+` 表示当该项非正时为零。\n\n```\ndata\
  \ <- read.table(\"irates.dat\", header = TRUE)\ny <- data$GS\nx <- data$TBMS\nxk\
  \ <- (x - 10.8) * (x > 10.8)\nsummary(lm(y ~ x + xk))\n```\n\n```\n## Call:\n##\
  \ lm(formula = y ~ x + xk)\n##\n## Residuals:\n##     Min      1Q  Median      3Q\
  \     Max\n## -2.3978 -0.8537 -0.1889  0.8841  3.2169\n##\n## Coefficients:\n##\
  \             Estimate Std. Error t value Pr(>|t|)\n## (Intercept)  1.77900    0.10181\
  \   17.47  < 2e-16 ***\n## x            0.92489    0.01915   48.29  < 2e-16 ***\n\
  ## xk          -0.42910    0.08958   -4.79  2.06e-06 ***\n## ---\n## Signif. codes:\
  \  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n##\n## Residual standard error:\
  \ 1.107 on 657 degrees of freedom\n## Multiple R-squared:   0.83,  Adjusted R-squared:\
  \  0.8295\n## F-statistic:  1604 on 657 DF,  p-value: < 2.2e-16\n```\n\n```\nreorder\
  \ <- order(x) # 避免线条重叠\nplot(\n  x[reorder],\n  fitted(y ~ x + xk))[reorder],\n\
  \  type = \"l\",\n  col = \"red\",\n  cex.main = 0.80,\n  cex.axis = 0.75,\n  xlab\
  \ = \"TBMS\",\n  ylab = \"GS\"\n)\npoints(x, y, col = \"grey\")\nabline(v = 10.8,\
  \ lty = 2, col = \"darkgreen\")\n``` (07)\n\n当模型扩展到 `q` 个节点时，它变成了分段回归：$y = \\beta_{0}\
  \ + \\beta_{1}x + \\sum_{j = 1}^{q}\\beta_{j}(x - \\kappa_{j})_{+} + \\varepsilon$\
  \ (6.12)\n\n```\n#5 个节点\nk <- c(2.8, 4.8, 6.8, 8.8, 10.8)\nXk <- x - matrix(k, length(x),\
  \ byrow = TRUE)\nXk <- Xk * (Xk > 0)\n\nreorder <- order(x) # 避免线条重叠\nplot(\n  x,\n\
  \  y,\n  col = \"gray\",\n  ylim = c(2.5, 14.5),\n  cex.main = 0.80,\n  cex.axis\
  \ = 0.75,\n  xlab = \"TBMS\",\n  ylab = \"GS\"\n)\nlines(x[reorder], fitted(y ~\
  \ x + Xk))[reorder], lwd = 2, col = \"red\")\nabline(v = k, lty = 2, col = \"darkgreen\"\
  )\n```\n\nimages/Fig06_08)\n\n分段线性模型在节点处是不平滑的。为了获得平滑估计，我们将线性基函数替换为样条基函数，后者定义为 `b(x,\
  \ kappa)`。因此，回归样条定义为：$y = \\sum_{j = 0}^{r}\\beta_{j}b_{j}(x,\\kappa) + \\varepsilon$\
  \ (6.13) 一旦节点固定，它变成了参数回归。例如，以下样条模型 $y = \\beta_{0} + \\beta_{1}x + \\cdots + \\\
  beta_{p}x^{p} + \\sum_{j = 1}^{q}\\beta_{j}(x - \\kappa_{j})^{p} + \\varepsilon,$\
  \ 可以估计为三次样条：$\\hat{m}(x) = \\begin{array}{rl} 2 + x^{2} + x^{3} & \\text{if} & {x\
  \ < 0.4} \\\\ 2 + x^{2} + x^{3} + (x - 0.4)^{3} & \\text{if} & {0.4 \\leq x < 0.8}\
  \ \\\\ 2 + x^{2} + x^{3} + (x - 0.8)^{3} & \\text{if} & {x \\geq 0.8} \\end{array}.$。简单来说，样条是一种`分段多项式函数`。现在，问题是我们应该如何选择基函数和节点？样条估计对节点数量及其位置敏感。节点可以具有经济解释，例如特定日期或数据中的结构变化，因此需要某些信息。选择节点有两种常用方法：具有相同观测数的`分位数`；等宽的`等距`区间。如果节点数量太小，潜在偏差可能会很大，因此倾向于选择较大的数量。让我们使用相同的数据应用回归样条。这里是等距节点的示例：\n\
  \n```\nlibrary(splines)\n\n# 等距节点\nnknots <- 5\nk = seq(min(x), max(x), length.out\
  \ = nknots + 2)[2:(nknots + 1)]\nmodel1 <- lm(y ~ bs(x, degree = 3, knots = k))\
  \ # check bs\nsummary(model1)\n```\n\n```\n## Call:\n## lm(formula = y ~ bs(x, degree\
  \ = 3, knots = k))\n##\n## Residuals:\n##     Min      1Q  Median      3Q     Max\n\
  ## -2.5190 -0.8537 -0.1889  0.8841  3.2169\n##\n## Coefficients:\n##           \
  \                    Estimate Std. Error t value Pr(>|t|)\n## (Intercept)      \
  \               3.1855    0.3160   10.082  < 2e-16 ***\n## bs(x, degree = 3, knots\
  \ = k)1   0.4081     0.5722   0.713  0.47596\n## bs(x, degree = 3, knots = k)2 \
  \  0.9630     0.3163   3.045  0.00242 **\n## bs(x, degree = 3, knots = k)3   4.2239\
  \     0.4311   9.798  < 2e-16 ***\n## bs(x, degree = 3, knots = k)4   6.2233   \
  \  0.3869   16.084  < 2e-16 ***\n## bs(x, degree = 3, knots = k)5   9.9021     0.6620\
  \   14.957  < 2e-16 ***\n## bs(x, degree = 3, knots = k)6   9.8107     0.8370  \
  \ 11.722  < 2e-16 ***\n## bs(x, degree = 3, knots = k)7  10.8604     0.9400   11.553\
  \  < 2e-16 ***\n## bs(x, degree = 3, knots = k)8   10.6991     1.0866   9.847  <\
  \ 2e-16 ***\n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1\
  \ ' ' 1\n##\n## Residual standard error: 1.086 on 651 degrees of freedom\n## Multiple\
  \ R-squared:   0.8378,Adjusted R-squared:  0.8358\n## F-statistic:  420.3 on 8 and\
  \ 651 DF,  p-value: < 2.2e-16\n```\n\n\n\n\n\n```\nu <- seq(min(x), max(x), length.out\
  \ = 100)\npred <- predict(model1, newdata = list(x = u), se = TRUE)\n\nreorder <-\
  \ order(u) # to avoid messy lines\nplot(\n  x,\n  y,\n  col = \"gray\",\n  ylim\
  \ = c(2.5, 14.5),\n  cex.main = 0.80,\n  cex.axis = 0.75\n)\nlines(u, pred$fit,\
  \ lwd = 2, col = \"red\")\nlines(u[reorder], pred$fit[reorder] + 1.96 * pred$se,\
  \ lty = \"dashed\")\nlines(u[reorder], pred$fit[reorder] - 1.96 * pred$se, lty =\
  \ \"dashed\")\nabline(v = k, lty = 2, col = \"darkgreen\")\n```\n\n![](img/Fig06_09.jpg)\n\
  \n此外，这是一个分位数节点（quantile knots）的示例：\n\n```\nmodel2 <- lm(y ~ bs(x, degree = 3, df\
  \ = 8))\n\nu <- seq(min(x), max(x), length.out = 100)\npred <- predict(model2, newdata\
