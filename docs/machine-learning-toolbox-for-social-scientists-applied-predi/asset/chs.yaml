  ```\n\n\n\n\n通常情况下，每种预测方法都有多个`tuning`参数或所谓的`hyperparameters`。超参数的值必须在学习过程开始之前设置，因为这些调优参数是模型外部的，其值无法从数据中估计出来。\n\
  \n因此，我们通常需要进行网格搜索来确定这些参数的最优组合，以最小化预测误差。例如，`kNN` 中的 `k`、`神经网络`中的隐藏层数，甚至`线性回归`中的多项式次数，都需要在学习过程开始之前进行调优。相比之下，参数（参数模型中）是模型的内部特征，对于任何给定的超参数，其值都可以从数据中估计。例如，`Lasso`\
  \ 中压缩变量数量的惩罚参数 `λ`（我们将在第 9.6 节中看到）是一个超参数，必须在估计之前设置。一旦设置，`Lasso`的系数将通过该过程估计出来。\n\n\
  我们从`k-fold cross validation`过程开始，执行交叉验证网格搜索以识别调优参数的最优组合。我们将通过简单的应用学习如何设置网格搜索，以评估许多不同的超参数组合。本章涵盖了现代机器学习应用和许多学习算法的核心概念。\n\
  \n### 9.1 训练集、验证集和测试集\n\n在学习如何随机将数据划分为子集之前，我们需要知道这些集合的作用以及如何正确定义它们。本节的灵感来自 Jason\
  \ Brownlee 的文章《*测试集和验证集有什么区别？*》(2017)。该文章澄清了验证集和测试集之间的区别，这在实践中可能会令人困惑。\n\n每个机器学习模型都需要训练，这是一个调优超参数并选择特征（变量）以获得最佳预测性能的过程。因此，这个过程需要两个不同的数据集：`training`数据集和`validation`验证数据集。这种划分背后的直觉非常简单：预测是一个样本外问题。如果我们使用用于拟合模型的相同样本来评估模型的预测准确性，就会面临著名的过拟合问题。由于我们通常没有其他可用的未知数据集，因此对数据进行划分，并从原始数据集中留出一部分。我们实际上假装留下的那部分对我们来说是“不可见”的。现在的问题是我们是如何进行这种划分的。是\
  \ 50-50 吗？通用方法是带有网格搜索的`k-fold cross validation`。以下是主要步骤：\n\n1. 假设 `Model1` 需要为 `λ`\
  \ 选取一个值，也许它是模型中的多项式次数。\n2. 我们建立一个网格，一组顺序数字，即 `λ` 的可能值集合。\n3. 我们将数据分成 `k` 个随机部分，假设是十个等比例的部分。\n\
  4. 我们留出一部分并使用剩下的九部分。这九部分的组合就是我们的`training set`。留出的那部分是我们的`validation set`。\n5. 我们使用\
  \ `λ` 可能值集合中的每个值来拟合模型。例如，如果我们有 100 个 `λ` 的值，我们就对训练集拟合模型 100 次，每次对应一个 `λ` 的可能值。\n\
  6. 我们通过它们在验证集（即留出的部分）上的预测准确性来评估 100 个模型中的每一个。我们选择一个预测准确性最高的 `λ`。\n7. 我们重复这个过程十次（如果是十折交叉验证），每次使用数据的不同部分作为验证集。所以，注意，每次我们的训练集和验证集都是不同的。最后，我们总共将得到十个最佳的\
  \ `λ`。\n8. 我们选取 `λ` 的平均值或众数作为最优超参数，以调优我们的预测模型达到最佳性能。\n\n注意，`validation` 术语有时与我们从样本中留出的\
  \ `test`（测试集）数据集混淆。这一点经常让从业人员感到困惑。那么，`test set` 是什么呢？\n\n我们现在已经通过最优的 `λ` 调优了 `Model1`。这是多个备选模型之一（在实践中有超过\
  \ 300 种预测模型，且数量在不断增加）。此外，我们遵循的上述步骤对于其适用性提供了有限的答案。\n\n我们现在已经通过最优的 `λ` 调优了 `Model1`。这是多个备选模型之一（在实践中有超过\
