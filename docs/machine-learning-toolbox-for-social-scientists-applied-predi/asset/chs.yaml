  \n```r\nfirst <- function(a) {\n  b <- a ^ 2\n  return(b)\n}\n\nfirst(1675)\n```\n\
  \n```r\n## [1] 2805625\n```\n\n让我们写一个寻找 z-score（标准化）的函数。这是减去样本平均值并除以样本标准差。\n\n$\\\
  frac{x - \\overline{x}}{s}$\n\n```r\nz_score <- function(x) {\n  m <- mean(x)\n\
  \  std <- sd(x)\n  z <- (x - m) / std\n  z\n}\n\nset.seed(1)\nx <- rnorm(10, 3,\
  \ 30)\nz <- z_score(x)\nz\n```\n\n```r\n##  [1] -0.97190653  0.06589991 -1.23987805\
