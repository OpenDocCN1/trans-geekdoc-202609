  \ `[E(θ̂) - θ]` 不是随机变量，因此它再次位于期望之外：\n\n2[E(`θ̂`)−θ]E{[`θ̂−E(`θ̂)`],\n\n且由于 `E(`θ̂`)−E(`θ̂`)=0`，最后一项为\
  \ 0。因此，\n\nMSE(`θ̂`) = Var(`θ̂`) + [`bias(`θ̂`)]`²\n\n因为我们只选择无偏估计器，E(`θ̂`) = θ，该表达式变为\
  \ Var(`θ̂`)。在我们的情况下，估计器可以是 `θ̂ = \\overline{X}`，而我们试图估计的是 `θ = \\mu[x]`。\n\n###\
