  ```\n\n```\nlength(unique(EmplUK$firm))\n```\n\n```\n## [1] 140\n```\n\n```\ntable(EmplUK$year)\n\
  ```\n\n```\n##\n## 1976 1977 1978 1979 1980 1981 1982 1983 1984\n##   80  138  140\
  \  140  140  140  140   78   35\n```\n\n正如从 `EmplUK` 数据集中所示，我们有 140 个唯一的对象（公司），每个对象在\
  \ 1977 年到 1983 年之间接受了观测。然而，并不是所有公司每年的都有数据，这导致了所谓的“非平衡面板”（unbalanced panel）数据集，这种现象发生在不同实体或时间段的观测数量不相等时。\n\
  \n## 2.2 图表\n\n通常，适当的可视化可以揭示数据的特征，有助于进一步分析。我们将在本书中使用四种数据可视化方法：\n\n*   **直方图 (Histograms)**\n\
  *   **柱状图 (Barplots)**\n*   **箱线图 (Boxplots)**\n*   **散点图 (Scatterplots)**\n\n我们可以使用\
  \ `ggplot` 包提供的 `mpg` 数据。首先，通过查看前几个数据点和一些统计量对数据有一个初步了解。\n\n```\nlibrary(ggplot2)\n\
  head(mpg, 5)\n```\n\n```\n## # A tibble: 5 x 11\n##   manufacturer model  displ\
  \  year   cyl drv cty   hwy fl\n##   <chr>      <chr> <dbl> <int> <chr> <chr> <int>\
  \ <int> <chr>\n## 1 audi a4      1.8  1999     4 auto(l5)   f        18    29\n\
  ## 2 audi a4      1.8  1999     4 manual(m5) f        21    29\n## 3 audi a4   \
