  _{i})} \\\\right\\\\rbrack + \\\\left( {\\\\text{E}\\\\left\\\\lbrack {y\\_{i}}\
  \ \\\\right\\\\rbrack - \\\\text{E}\\\\left\\\\lbrack {\\\\hat{f}(x\\_{i})} \\\\\
  right\\\\rbrack \\\\right)^{2}} & \\\\end{array}$\n\n注意 $\\varepsilon[i]^{\\prime}$\
