  \ 仅接受矩阵输入。\n\n```r\nyhat <- predict(tr_model,\n                as.matrix(test[,\
  \ -which(names(test) == \"Sale_Price\")]))\nrmse_test <-\n  sqrt(mean((test[, which(names(test)\
  \ == \"Sale_Price\")] - yhat) ^ 2))\nrmse_test\n```\n\n```\n## [1] 23\n```\n\n注意训练和测试\
  \ RMSE 之间的巨大差异。这说明我们的网格并不理想。我们应该包含正则化参数并运行完整的网格搜索。\n\n\n\n\n相对于单棵树，我们可以看到不确定性显著减少，准确性有所提高。当我们使用\
  \ `rpart()` 对“未剪枝”的单棵树进行袋装（bagging）时，结果与通过随机森林得到的结果非常相似。在我们的案例中，使用剪枝树进行袋装可以提高准确性。\n\
  \n这在回归树中也是如此，其中我们将对 `yhat` 取平均值并计算 RMSPE（均方根百分误差）及其标准差，而不是 AUC。\n\n## 14.2 回归\n\n\
  考虑我们在前面的章节中用于预测棒球员薪水的数据：\n\n```r\nlibrary(ISLR)\n\nremove(list = ls())\n\ndata(Hitters)\n\
  df <- Hitters[complete.cases(Hitters$Salary), ]\n```\n\n让我们只使用带袋装的单棵树：\n\n```r\n\
  library(rpart)\n\n# Data\ndf$logsal <- log(df$Salary)\ndf <- df[, -19]\n\nn = 100\n\
  B = 500\nRMSPEp <- c()\nRMSPEup <- c()\n\nfor (i in 1:n) {\n  set.seed(i+i*8)\n\
  \  ind <- sample(nrow(df), nrow(df), replace = TRUE)\n  train <- df[ind, ]\n  test\
  \ <- df[-ind, ]\n\n  yhatp <- matrix(0, B, nrow(test))\n  yhatup <- matrix(0, B,\
  \ nrow(test))\n\n  for (j in 1:B) {\n    set.seed(j+j*2)\n    ind <- sample(nrow(train),\
  \ nrow(train), replace = TRUE)\n    tr <- train[ind, ]\n\n    modelp <- rpart(logsal\
  \ ~ ., data = tr, method = \"anova\") # Pruned\n    modelup <- rpart(logsal ~ .,\
  \ data = tr,\n                    control = rpart.control(minsplit = 2, minbucket\
  \ = 1\n                                            ,cp = 0),\n                 \
  \   method = \"anova\") # unpruned\n    yhatp[j,] <- predict(modelp, test)\n   \
  \ yhatup[j,] <- predict(modelup, test)\n  }\n  # Averaging for B Trees\n  yhatpr\
  \ <- apply(yhatp, 2, mean)\n  yhatupr <- apply(yhatup, 2, mean)\n\n  RMSPEp[i] <-\
  \ sqrt(mean((test$logsal - yhatpr)²))\n  RMSPEup[i] <- sqrt(mean((test$logsal -\
  \ yhatupr)²))\n}\n\nmodel <- c(\"Pruned\", \"Unpruned\")\nRMSPEs <- c(mean(RMSPEp),\
  \ mean(RMSPEup))\nsd <- c(sqrt(var(RMSPEp)), sqrt(var(RMSPEup)))\ndata.frame(model,\
  \ RMSPEs, sd)\n```\n\n```text\n##      model    RMSPEs         sd\n## 1   Pruned\
  \ 0.5019840 0.05817388\n## 2 Unpruned 0.4808079 0.06223845\n```\n\n无论是否进行剪枝，结果都非常相似。让我们把这些整合在一起，用随机森林来完成：\n\
  \n```r\nlibrary(randomForest)\nlibrary(rpart)\n\n# Data\nremove(list = ls())\ndata(Hitters)\n\
  df <- Hitters[complete.cases(Hitters$Salary), ]\ndf$logsal <- log(df$Salary)\ndf\
  \ <- df[, -19]\n\nn <- 100\nB <- 500\nRMSPE1 <- c()\nRMSPE2 <- c()\nRMSPE3 <- c()\n\
  \nfor (i in 1:n) {\n  set.seed(i+i*8)\n  ind <- sample(nrow(df), nrow(df), replace\
  \ = TRUE)\n  train <- df[ind, ]\n  test <- df[-ind, ]\n\n  p = ncol(train)-1\n\n\
  \  model1 <- rpart(logsal~., data =train) # Single Tree\n  model2 <- randomForest(logsal~.,\
  \ ntree = B, mtry = p, data = train) #Bagged\n  model3 <- randomForest(logsal~.,\
  \ ntree = B, localImp = TRUE, data = train) # RF\n\n  yhat1 <- predict(model1, test)\n\
  \  yhat2 <- predict(model2, test)\n  yhat3 <- predict(model3, test)\n\n  RMSPE1[i]\
  \ <- sqrt(mean((test$logsal - yhat1)²))\n  RMSPE2[i] <- sqrt(mean((test$logsal -\
  \ yhat2)²))\n  RMSPE3[i] <- sqrt(mean((test$logsal - yhat3)²))\n}\n\nmodel <- c(\"\
  Single-Tree\", \"Bagging\", \"RF\")\nRMSPEs <- c(mean(RMSPE1), mean(RMSPE2), mean(RMSPE3))\n\
  sd <- c(sqrt(var(RMSPE1)), sqrt(var(RMSPE2)), sqrt(var(RMSPE3)))\ndata.frame(model,\
  \ RMSPEs, sd)\n```\n\n```text\n##         model    RMSPEs         sd\n## 1 Single-Tree\
  \ 0.5739631 0.05360920\n## 2     Bagging 0.4807763 0.06119187\n## 3          RF\
  \ 0.4631194 0.06045187\n```\n\n随机森林具有最低的 RMSPE。\n\n## 14.3 解释\n\n虽然机器学习的任务是实现最佳预测能力，但识别主要的预测变量可能是另一个目标。正如我们之前讨论过的，在预测准确性和可解释性之间存在权衡。\n\
  \n预测模型的可解释性是一个活跃的研究领域。两本关于该主题的优秀书籍提供了关于可解释性和解释方法的详尽信息：*Interpretable Machine Learning*（Christoph\
  \ Molnar 著）和 *Explanatory Analysis*（Biecek 和 Burzykowski 著）。预测模型的探索分为两大类。第一类是实例级解释，或称基于示例的方法，它们提供了对单个观测值预测进行解释的方法。例如，对于特定的主体（人、公司、患者），我们可能想知道不同特征对预测的贡献。主要思想是理解预测变量对结果的边际影响。这一层面有两个重要的方法：Shapley\
  \ 加性解释 (`SHAP`) 和局部模型无关解释 (`LIME`)。我们在这里将不会解释和应用它们。这两种方法在引用的两本书中都可以找到。\n\n第二类解释方法关注数据集级解释，它们有助于理解机器学习模型在整个数据集上的平均行为。在这里，我们将关注重要性度量。它们提供了一种模型无关的方法来评估解释变量对性能的影响。\n\
  \n评估变量 `x` 重要性有多种方法。一种主要方法是置换变量重要性，它通过随机重洗 `x` 数据来消除该变量的影响。该方法获取原始 `x` 数据，置换其值，获得“新”数据，并在这些数据上计算沿变量\
  \ `x` 分划分的加权下降，并在所有树上取平均值。如果一个变量是模型中重要的预测变量，在其置换后，平均下降下降 (`MDA`) 会增加。它依赖于不同的原理，并使用袋外误差估计。森林中的每棵树都有自己的袋外样本，在其上测量预测准确性。计算\
  \ `MDA` 时，对袋外样本中的变量值进行随机洗乱，并测量洗乱后预测准确性的下降。对所有变量和树重复此过程。对平均后的 `MDA` 进行排序。如果一个变量没有显著的预测能力，洗乱可能不会导致准确性的大幅下降。研究表明，在无限样本的情况下，构建包含无关变量的树不会改变相关变量重要性。\n\
  \n\n\n另一种重要性衡量标准是平均纯度下降（Mean Decrease Impurity, MDI）。它不是基于排列的，而是基于在构建随机森林的决策树过程中，特定特征导致的纯度下降。在\
  \ `Random Forest` 模型中，使用特征的随机子集和训练数据集的随机子集构建多棵决策树。每棵决策树都是通过递归二分叉过程构建的，通过最大化纯度下降来确定特定节点的最佳分裂点。纯度是衡量决策树中节点样本分类良好程度的指标。常见的纯度指标包括\
  \ `Gini` 纯度和熵（entropy`）。纯度下降通过比较父节点的纯度与子节点的加权平均纯度来计算。对于每个特征，在该特征被使用的每个分裂处计算其纯度下降。然后将随机森林中所有树对于该特征的纯度下降相加。最后，将纯度下降的总和通过所有特征纯度下降的总和进行归一化，从而计算每个特征的\
  \ `MDI` 值。\n\n`MDI` 值代表了特征对随机森林中所有树纯度下降的平均贡献。特征的 `MDI` 值越高，表明该特征对于做出准确预测越重要；而值较低则表示该特征不重要。\n\
  \n相比之下，基于排列的特征重要性（例如平均准确率下降 Mean Decrease in Accuracy, `MDA`）通过随机排列特征的值并评估模型准确率的变化来衡量特征对模型性能的影响。这种方法通过评估特征信息被移除或破坏时性能的下降程度来估计特征的重要性。\n\
  \n对于数值结果（回归问题），有两种类似的衡量标准。均方误差百分比增加（`%IncMSE`）通过洗乱袋外样本（out-of-bag samples）的值计算，类似于\
  \ `MDA`。节点纯度增加（`IncNodePurity`）根据每次选择变量进行分裂时平方误差和的减少来计算，类似于 `MDI`。以下是我们随机森林应用（`model3`）的变量重要性指标：\n\
  \n```R\nlibrary(randomForest)\nvarImpPlot(model3)\n```\n\n![](img/Fig14_01.jpg)\n\
  \n此外，部分依赖图提供了变量对类别概率（分类）或响应（回归）边际效应的图形表示。其背后的直觉非常简单：改变预测变量的值，观察预测结果会发生多大的变化（在我们的示例中是工资）。\n\
  \n```R\npartialPlot(model3, test, CRuns, xlab=\"CRuns\",\n                main=\"\
  Effects of CRuns\",\n                col = \"red\", lwd = 3)\n```\n\n![](img/Fig14_02.jpg)\n\
  \n部分依赖图（PDPs）是一种图形工具，用于可视化机器学习模型中单个特征与预测结果之间的关系，同时平均化掉所有其他特征的影响。对于所选特征的每个唯一值，算法会固定该值并保持所有其他特征值不变。然后，`Random\
  \ Forest` 模型使用带有固定特征值的修改数据集来获取每个实例的预测值。我们计算所有实例在固定特征值下的平均预测值。这代表了结果对所选特征值的部分依赖。我们对所选特征的所有唯一值执行这些步骤，获得每个特征值的部分依赖值。以\
  \ x 轴为所选特征值、y 轴为相应部分依赖值的图表即为部分依赖图。生成的部分依赖图说明了所选特征与模型预测之间的关系，同时考虑了其他特征的平均影响。该图有助于识别关系的方向（正或负）和强度，以及特征的任何非线性模式。请记住，部分依赖图对于理解单个特征的影响最为有用，如果存在强交互作用，它们可能无法捕捉模型的全部复杂性。我们可以使用几个库来改进基于排列的重要性展示：`randomForestExplainer`。\n\
  \n```R\nlibrary(randomForestExplainer)\nimportance_frame <- measure_importance(model3)\n\
  ```\n\n```text\n             variable min_depth mse_increase nodepurity_increase\n\
  Assists       4.385264        2353 0.01742811            3.90269\nAtBat        \
  \ 2.880632        2691 0.08230653            9.89764\nCBat         2.378316    \
  \    2598 0.21809195           38.31756\nHits          2.254316        2711 0.22196375\
  \           34.69134\nmRun          3.444948        2556 0.04653853            6.53341\n\
  BI            2.826000        2752 0.10374402           19.54136\nCRuns        \
  \ 2.076316        2731 0.24152971           35.08936\nWalks         3.090316   \
  \     2579 0.08426750           18.04552\nDivision      7.025920         691 0.00090343\
