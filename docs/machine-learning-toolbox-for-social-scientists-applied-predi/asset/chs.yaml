  \n在讨论 CART 的优缺点之前，让我们先看一个回归树。\n\n### 12.5 回归树\n\n当结果变量不是定性的时，可以采用相同的划分程序。对于分类问题，拆分准则通常是\
  \ Gini 指数或对数似然函数。当我们有数值型结果变量时，可以使用 ANOVA 方法来决定哪个变量提供了最佳拆分：\n\n`SS[T] - (SS[L] +\
  \ SS[R])`,\n\n其中\n\n`SS[T] = \\sum(y[i] - \\bar{y})²`，\n\n它是节点 (T)、右侧 (R) 和左侧 (L)\
  \ 划分的平方和。\n\n与我们的 delta 方法类似，如果 `SS[T] - (SS[L] + SS[R])` 为正且显著，我们就对该节点（该变量）进行划分。拆分后，该节点的拟合值是该节点\
  \ `y` 的平均值。\n\n如果 `y` 是简单的数值向量，`anova` 方法是默认方法。然而，当 `y[i] \\in (0, 1)` 时，\n\n$$\\\
  left. SS_{T} = \\sum\\left( y_{i} - \\bar{y} \\right)^{2} = \\sum\\underset{i}{\\\
  overset{2}{y}} - n\\bar{y}^{2} = \\sum y_{i} - n\\bar{y}^{2} = n\\bar{y} - n\\bar{y}^{2}\
  \ = np(1 - p) \\right)$$\n\n因此，我们可以证明当 `y[i] \\in (0, 1)` 时，在回归树中使用 `SS[T]` 或 Gini\
  \ 的相对增益是相同的。\n\n编写一个与我们之前的算法类似的简单循环并不难，但它是多余的。我们将在示例中使用 `rpart`：\n\n```\n# simulated\
  \ data\nset.seed(1)\nx <- runif(100,-2, 2)\ny <- 1 + 1 * x + 4 * I(x ^ 2) - 4 *\
  \ I(x ^ 3) + rnorm(100, 0, 6)\ndt <- data.frame(\"y\" = y, \"x\" = x)\nplot(x, y,\
  \ col = \"gray\")\n```\n\n![](img/Fig12_16.jpg)\n\n```\n# Tree\nfit1 <- rpart(y\
  \ ~ x, minsplit = 83, dt) # we want to have 1 split\nfancyRpartPlot(fit1)\n```\n\
  \n![](img/Fig12_17.jpg)\n\n当我们在 `x = -0.65` 处划分时，`rpart` 为左侧和右划分分别计算两个常数 $\\hat{f}\\\
  left( x_{i} \\right)$：\n\n### 左划分和右划分的平均值\n\n```\nmean(y[x <= -0.65])\n```\n[1]\
  \ 15.3681\n\n```\nmean(y[x > -0.65])\n```\n[1] 92.0521\n\n在这里，我们在图中可以看到它们：\n\n```\n\
  z <- seq(min(x), max(x), length.out = 1000)\nplot(x, y, col = \"gray\")\nlines(z,\
  \ predict(fit1, data.frame(x = z)), col = \"blue\", lwd = 3)\nabline(v = -0.65,\
  \ col = \"red\")\n```\n![](img/Fig12_18.jpg)\n\n如果减小 `minsplit`，\n\n```\n# Tree\n\
  fit2 <- rpart(y ~ x, minsplit = 6, dt)\nfancyRpartPlot(fit2)\n```\n![](img/Fig12_19.jpg)\n\
  \n# 在图上\nplot(x, y, col = \"gray\")\nlines(z, predict(fit2, data.frame(x = z)),\
