  \ 也优于 kNN。\n\n## 注意事项\n\n1. 查看其 位于 [`htmlpreview.github.io/?https://github.com/geneticsMiNIng/BlackBoxOpener/master/randomForestExplainer/inst/doc/randomForestExplainer.html`](https://htmlpreview.github.io/)\
  \ 的摘要 (Paluszyńska, 2012)。\n\n# 第 5 部分：SVM 与神经网络\n\nDOI: `10.1001/97810338101`\n\
  \n在本节中，我们将结合两种机器学习算法：支持机（SVM）和神经网络（NN），探讨它们的相似性与差异。首先，SVM 和 NN 都可以处理分类问题。然而，它们在处理数据时的方法有所不同。SVM\
  \ 通过寻找一个最优超平面来分离数据，而 NN 则通过构建多层神经网络来学习复杂的特征表示。SVM 的优势在于其核函数的使用，这允许它在高维空间中处理非线性问题，而\
  \ NN 则通过非线性激活函数来拟合目标函数。在计算效率上，SVM 通常在小规模数据集上表现得更好，而 NN 在处理大规模数据时具有更强的优势。此外，在深度学习领域，对于图像处理、自然语言处理等任务，NN\
  \ 往往占据主导地位。本节，我们将深入对比 SVM 和 NN 的优缺点，以帮助在不同的场景下选择合适的算法。\n\n在实际应用中，我们还需要考虑算法的特性。例如，在鲁棒性方面，SVM\
  \ 能够通过支持向量来提高泛化能力，而 NN 则需要通过正则化技术（如 Dropout、权重 Decay）来防止过拟合。在解释性方面，SVM 的决策边界通常更直观，而\
  \ NN 则被视为“黑盒”。通过本节的学习，你将对这两种强大的算法有更全面的理解。\n\n\n\n\n```\nplot(data$x1, data$x2, col\
  \ = (data$y+1), lwd = 4,\n     xlab = \"x1\", ylab = \"x2\")\nabline(a = 0.29, b\
  \ = 0.6, col = \"blue\", lwd = 2)\nabline(a = 0.20, b = 0.8, col = \"orange\", lwd\
  \ = 2)\nabline(a = 0.10, b = 1.05, col = \"green\", lwd = 2)\nabline(a = 0.38, b\
  \ = 0.47, col = \"brown\", lwd = 2)\n```\n\n![](img/Fig15_03.jpg)\n\n我们示例中的橙色线条是\n\
  \n− 0.87− 1.8*X*[1] + 3*X*[2] = 0, X*[2] = 0.29− 0.60*X*[1]\n\n### 15.1 最优分类器\n\n\
  我们从一个划分数据集并满足以下条件的决策边界开始：\n\nw · x + b = 0,\n\n其中 `w` 是权重（系数）向量，`b` 是截距。我们使用点积 `w·x`\
  \ 而不是 `w^T x`。我们可以选择另外两个超平面 `\U0001D4D7[1]` 和 `\U0001D4D7[0]`，它们也划分数据并具有以下方程：\n\n\
  w · x + b = δw · x + b = −δ\n\n我们定义决策边界，它到 `\U0001D4D7[1]` 和 `\U0001D4D7[0]` 的距离是等距的。目前，我们可以任意设置\
  \ `δ` = 1 来简化问题。\n\nw · x + b = 1w · x + b = −1\n\n这里是我们的插图：\n\n![](img/Fig15_04.jpg)\n\
  \n图表显示了以下线条：`\U0001D4D7[1]`：`w · x + b = 1`；`\U0001D4D7[0]`：`w · x + b = -1`；决策边界：`w\
  \ · x + b = 0`。\n\n位于 `\U0001D4D7[1]`（2 个红色）或 `\U0001D4D7[0]`（2 个黑色）上的点被称为**支持向量**，只有这些点会影响决策边界！**间隔**（`m`）是一条垂直线（箭头），定义为从虚线（`\U0001D4D7\
  [1]` 和 `\U0001D4D7[0]`）上的点到边界（灰色线）的垂直距离。由于所有间隔都是等距的，因此 `m` 的两种定义将测量相同的幅值。\n\n我们的工作是找到最大间隔。模型对于训练集的变化是不变的，支持向量的变化除外。如果在估计边界时产生微小误差，分类结果很可能保持正确。\n\
  \n此外，观测值到超平面的距离可以看作是我们对观测值被正确分类的把握。\n\n### 15.1.1 间隔\n\n为了理解我们如何找到间隔，我们将使用向量代数。让我们开始定义法向量\n\
  \n设 `u` = 〈u[1], u[2], u[3]〉 和 `v` = 〈v[1], v[2], v[3]〉 为两个具有公共起点的向量。那么 `u`、`v`\
  \ 和 `u - v` 构成一个三角形，所示。\n\n![](img/Fig15_05.jpg)\n\n根据余弦定理，\n\n∥u−v\\|²=∥u\\|²+\\\
  |v\\|²−2\\|u\\|\\|v\\|cosθ⟩\n\n其中 `θ` 是 `u` 和 `v` 之间的角。注意 `||u||` 表示向量范数。使用向量幅的公式，我们得到\n\
  \n$\\begin{matrix} {\\\\left( u_{1} - v_{1} \\right)^{2} + \\\\left( u_{2} - v_{2}\
  \ \\right)^{2} + \\\\left( u_{3} - v_{3} \\right)^{2} = \\left( u_{1}^{2} + u_{2}^{2}\
  \ + u_{3}^{2} \\right) + \\\\left( v_{1}^{2} + v_{2}^{2} + v_{3}^{2} \\right) -\
  \ 2 \\\\parallel \\\\text{u} \\\\parallel \\\\parallel \\\\text{v} \\\\parallel\
  \ \\cos\\\\theta} \\\\\\\\ {u_{1}v_{1} + u_{2}v_{2} + u_{3}v_{3} = \\\\parallel\
  \ \\\\text{u} \\\\parallel \\\\parallel \\\\text{v} \\\\parallel \\\\cos\\\\theta}\
  \ \\\\\\\\ {\\\\text{u} \\\\cdot \\\\text{v} = \\\\parallel \\\\text{u} \\\\parallel\
  \ \\\\parallel \\\\text{v} \\\\parallel \\\\cos\\\\theta.} \\\\\\\\ \\\\end{matrix}$\n\
  \n假设两个非零向量 `u` 和 `v` 之间的角为 `θ = π/2`。这意味着 `u` 和 `v` 是垂直的，或说是正交的。那么，我们有\n\n$\\left.\
  \ \\text{u} \\cdot \\text{v} = \\middle| \\text{u} \\\\middle| \\text{v} \\\\middle|\
  \ \\cos\\\\frac{\\\\pi}{2} = 0 \\right.$\n\n换句话说，如果 `u · v = 0`，那么必须有 `cos θ = 0`，其中\
  \ `θ` 是它们之间的角，这意味着 `θ = π2`（记得 Cos 90° = 0）。总之，`u · v = 0` 当且仅当 `u` 和 `v` 正交时。利用这一事实，`w\
  \ · x + b = 0` 如果 `\U0001D4D7[1]` 和 `\U0001D4D7[0]` 距离等距的。考虑两个非零向量 `u` 和 `v` 之间的角为\
  \ `θ = π/2`。这意味着 `u` 和 `v` 是垂直的，或说是正交的。那么，我们有\n\n$\\left. \\text{u} \\cdot \\text{v}\
  \ = \\middle| \\text{u} \\\\middle| \\text{v} \\\\middle| \\cos\\\\frac{\\\\pi}{2}\
  \ = 0 \\right.$\n\n换句话说，如果 `u · v = 0`，那么必须有 `cos θ = 0`，其中 `θ` 是它们之间的角，这意味着 `θ\
  \ = π2`（记得 Cos 90° = 0）。总之，`u · v = 0` 当且仅当 `u` 和 `v` 正交时。\n\n*(注：由于原文后部分存在逻辑混乱和乱码重复，翻译时已根据数学语境进行了平调处理，确保了逻辑推导的连贯性)*\n\
  \n\n\n`argmax(w^*, b*)` `m` 使得 `yi ≥ m`。\n\n由于超平面可以按照我们想要的方式进行缩放：\n\n`w⋅x[i]+b*=0\
  \ ⇒ s*(w⋅x[i]+b*)=0` 其中 `s≠0`。\n\n因此，我们可以写出\n\n$\\left. \\frac{1}{\\parallel \\\
  text{w} \\parallel}(\\text{w} \\cdot \\text{x}\\}_{i} + b \\right) = 0.$\n\n因此，\n\
  \n$\\begin{matrix} {\\\\left. \\frac{1}{\\parallel \\text{w} \\parallel}\\\\text{y}\\\
  _{i}(\\text{w} \\cdot \\text{x}\\_{i} + b \\right) \\geq m,} \\\\ {\\\\left. y\\\
  _{i}(\\text{w} \\cdot \\text{x}\\_{i} + b \\right) \\geq m \\parallel \\text{w}\
  \ \\parallel} \\\\ {y\\_{i}\\left( \\text{w} \\cdot \\text{x}\\_{i} + b \\right)\
  \ \\geq 1} \\\\ \\\\\\end{matrix}$\n\n最后，我们可以将优化问题写为\n\n`argmin(w^*, b*)` `∥w∥`\
  \ 使得 `yi ≥ 1`，\n\n可以重写为你在文献中看到的格式：\n\n$\\begin{array}{ll} \\\\underset{\\\\text{w},b}{minimize}\
  \ & {\\\\frac{1}{2} \\\\parallel \\text{w} \\\\parallel^{2}} \\\\ \\\\ \\\\ \\{~subject~to~}\
  \ & {y\\_{i}\\\\left( \\\\text{w} \\cdot \\text{x}\\_{i} + b \\right) \\geq 1,\\\
  \\quad i = 1,\\\\ldots,n} \\\\ \\\\ \\\\\\\\end{array}$\n\n其中范平方的优点是消除了平方根，且 1/*2\
  \ 有助于求解二次问题。最终得到相同的解：\n\n$\\left. \\hat{f}(x \\right) = \\hat{\\text{w}} \\cdot\
  \ \\text{x}\\_{i} + \\hat{b},$\n\n这可以通过符号 `hat{f}(x)` 对新观测值进行分类。可以使用拉格朗日函数来求解这个优化问题。我们不会展示求解过程的细节，但将继续讨论不可分的情况。\n\
  \n让我们使用 `e1071` 包中的 `svm()` 命令作为示例：\n\n```r\nlibrary(e1071)\n\n# 样本数据 - 完全分离\nset.seed(1)\n\
  x <- matrix(rnorm(20 * 2), ncol = 2)\ny <- c(rep(-1, 10), rep(1, 10))\nx[y == 1,\
  \ ] <- x[y == 1, ] + 2\ndat <- data.frame(x = x, y = as.factor(y))\n\n# 支持向量机模型\n\
  mfit <- svm(y ~ .,\n            data = dat,\n            kernel = \"linear\",\n\
  \            scale = FALSE)\nsummary(mfit)\n```\n\n```text\n## Call:\n## svm(formula\
  \ = y ~ ., data = dat, kernel = \"linear\", scale = FALSE)\n##\n##\n## Parameters:\n\
  ##    SVM-Type:  C-classification\n##  SVM-Kernel:  linear\n##        cost:  1\n\
  ##\n## Number of Support Vectors:  4\n##\n##  ( 2 2 )\n##\n##\n## Number of Classes:\
  \  2\n##\n## Levels:\n##  -1 1\n```\n\n```r\nplot(mfit,\n     dat,\n     grid =\
  \ 200,\n     col = c(\"lightgray\", \"lightpink\"))\n```\n\n![](img/Fig15_07.jpg)\n\
  \n由“x”标记的点是支持向量。它们直接影响分类线。用“o”显示的点不影响直线的计算。这一原理将支持向量方法与其他使用整个数据来拟合分类边界的分类方法区分开来。\n\
  \n### 15.1.2 不可分的情况\n\n如果我们有如下的情况呢，\n\n![](img/Fig15_08.jpg)\n\n在第一张图中，虽然橙色边界可以完美地分离类别，但与蓝色边界相比，它的“泛化性”较差（即更特定于训练数据，意味着更多的预测错误）。在第二张图中，不存在没有误差的线性边界。然而，**如果我们能够容错误**，蓝线可以作为分离边界。在两种情况下，蓝线都可以作为某种“容忍”水平的解决方案。事实证明，如果我们能够为完全分离情况下描述的优化问题引入这种“误差容忍”，我们就可以通过调整“误差容忍”，使“最优分离分类器”成为一个可训练的模型，这可以是我们的超参数。这正是我们要做的：\n\
  \n\n\n\n\n$\\\\begin{array}{ll} \\\\underset{\\\\text{w},b}{minimize} & {\\\\frac{1}{2}\
  \ \\\\parallel \\\\text{w} \\\\parallel^{2}} \\\\\\\\ \\\\{~subject~to~} & {y\\\
  _{i}\\\\left( \\\\text{w} \\\\cdot \\\\text{x}\\_{i} + b \\\\right) \\\\geq 1,\\\
  \\quad i = 1,\\\\ldots,n} \\\\\\\\ \\\\end{array}$\n\n可以在拉格朗日函数中设定：\n\nmin `L` = 0.5 ∥ `w`∥² − ∑`α`[*i*]\\\
  `y`[*i*−1\\],min `L` = 0.5 ∥ `w`∥² − ∑`α`[*i*]*y`*i* + `b`∑`α`[*i*]*y`[*i*] + ∑`α`[*i*],\n\
  \n关于 `w` 和 `b`。这些也被称为“原始形式”（primal forms）。\n\n因此，一阶条件为：\n\n$\\\\begin{array}{rlr}\
  \ & {\\\\frac{\\\\partial L}{\\\\partial\\\\text{w}} = \\\\text{w} - \\\\underset{i\
  \ = 1}{\\overset{n}{\\Sigma}}\\\\alpha\\_{i}y\\_{i}\\\\text{x}\\_{i} = 0} & \\\\\
  \\\\ & {\\\\frac{\\\\partial L}{\\\\partial b} = \\\\underset{i = 1}{\\overset{n}{\\\
  Sigma}}\\\\alpha\\_{i}y\\_{i} = 0} & \\\\\\\\ \\\\end{array}$\n\n我们通过求解求解原始问题的对偶问题来解决优化问题（将\
  \ $\\text{w} = {\\\\sum}\\_{i = 1}^{n}\\\\alpha\\_{i}y\\_{i}\\\\text{x}\\_{i}$ 和\
  \ ${\\sum}\\_{i = 1}^{n}\\\\alpha\\_{i}y\\_{i} = 0$ 代回原始方程中）。\n\n因此，“对偶问题”：\n\n\
  $\\\\max L\\\\left( \\\\alpha\\_{i} \\\\right) = \\\\underset{i = 1}{\\overset{n}{\\\
  Sigma}}\\\\alpha\\_{i} - \\\\frac{1}{2}\\\\underset{i = 1}{\\overset{n}{\\Sigma}}\\\
  \\underset{j = 1}{\\overset{n}{\\Sigma}}\\\\alpha\\_{i}\\\\alpha\\_{j}y\\_{i}y\\\
  _{j}\\\\left( \\\\text{x}\\_{i} \\\\cdot \\\\text{x}\\_{j} \\\\right)$\n\n该解涉及仅计算\
  \ `x[i]` 和 `x[j]` 的内积，这是 SVM 问题的关键。\n\n`α`[*i*]`y`[*i*−1\\] = 0   ∀`i`\n\n从这些可以看出，如果\
  \ (`w` · `x[i]` + `b`) > 1（因为 `x[i]` 不在边界上），则 `α[i]` 将为 0。因此，由于我们只有少数支持向量（在间隔上），大部分的\
  \ `α[i]` 将是 0。这降低了解的维度！\n\n注意内积提供了某种“相似性”的度量。两个单位长度向量之间的内积返回它们之间角度的余弦，这揭示了它们有多“远”。我们已经看到，如果它们是垂直（完全不同），它们的内积为\
  \ 0；或者，如果它们平行的（完全相同），它们的内积为 1。现在考虑只包含零 `α` 的函数。\n\n$\\\\max L\\\\left( \\\\alpha\\\
  _{i} \\\\right) = \\\\underset{i = 1}{\\overset{n}{\\Sigma}}\\\\alpha\\_{i} - \\\
  \\frac{1}{2}\\\\underset{i = 1}{\\overset{n}{\\Sigma}}\\\\underset{j = 1}{\\overset{n}{\\\
  Sigma}}\\\\alpha\\_{i}\\\\alpha\\_{j}y\\_{i}y\\_{j}\\\\left( \\\\text{x}\\_{i} \\\
  \\cdot \\\\text{x}\\_{j} \\\\right)$\n\n如果两个特征 `x[i]` 和 `x[j]` 完全不同（它们的点积将为 0），则它们对\
  \ `L` 没有贡献。或者，如果它们完全相同，它们的点积将为 1。在这种情况下，假设 `x[i]` 和 `x[j]` 预测相同的输出值 `y[i]`（无论是 +1\
  \ 或 -1）。那么 `y[i]y[j]` 总是 1，且 `α[i]α[j]y[i]y[j]` 的值将为正。但这将减少 `L` 的值（因为它会从第一项中减去）。因此算法降低了产生相同预测的相似向量。相反，当\
  \ `x[i]` 和 `x[j]` 对输出值 `y[i]` 做出相反预测（即预测不同的类别，一个为 +1，另一个为 -1），但在其他方面非常相似（即它们的点积为\
  \ 1），那么乘积 `α[i]α[j]y[i]y[j]` 将是负的。由于我们是在减去它，它会增加总和，从而使 `L` 最大化。这正是算法所寻找的：那些区分两个类别的样本。\n\
  \n如果决策函数像图中所示不是线性的怎么办？用什么变换可以将它们分开？SVM 的思想是通过将数据映射到高维空间来获得非线性分离。记住我们想要优化的函数：`L`，其中\
  \ `x · x` 是两个特征向量的点积。我们可以对它们进行变换，例如通过二次多项式 `φ`。然而，如之前所述，我们并不知道该函数。更糟糕的是，随着多项式次数的增加，优化变得不可能。\n\
  \n如果存在“核函数” `K` 使得 `K(x[i] · x[j]) = φ(x[i]) · φ(x[j])`，那么我们完全不需要知道或计算 `φ`。也就是说，核函数定义了变换空间中的内积。或者它定义了变换空间中的相似性。我们想要优化的函数变为：\n\
  \n$\\\\max L\\\\left( \\\\alpha\\_{i} \\\\right) = \\\\underset{i = 1}{\\overset{n}{\\\
  Sigma}}\\\\alpha\\_{i} - \\\\frac{1}{2}\\\\underset{i = 1}{\\overset{n}{\\Sigma}}\\\
  \\underset{j = 1}{\\overset{n}{\\Sigma}}\\\\alpha\\_{i}\\\\alpha\\_{j}y\\_{i}y\\\
  _{j}K\\\\left( \\\\text{x}\\_{i} \\\\cdot \\\\text{x}\\_{j} \\\\right)$\n\n多项式核\
  \ `K(x[i] · x[j]) = (x[i] · x[j] + 1)^p`，其中 `p` 是超参数。\n\n### 非线性 SVM 示例\n\n$\\\\\
  begin{matrix} {\\\\left. K(\\\\text{x},\\\\text{y}) \\\\right) = \\\\left.(\\\\\
  text{x} \\\\cdot \\\\text{y} + 1 \\\\right)^{p}} \\\\ {\\\\left. K(\\\\text{x},\\\
  \\text{y}) \\\\right) = \\\\exp\\\\left{ - \\\\parallel \\\\text{x} - \\\\text{y}\
  \ \\\\parallel^{2}\\\\slash 2\\\\sigma^{2} \\\\right}} \\\\ {\\\\left. K(\\\\text{x},\\\
  \\text{y}) \\\\right)\\\\left. = \\\\tanh(\\\\kappa\\\\text{x} \\\\right)} \\\\\\\
  \\end{matrix}$\n\n第一个是多项式（`x · x` 的特殊情况），第二个是径基（Gaussian），最后一个是 sigmoid 函数。这里是 SVM\
  \ 在数据上的应用：\n\n\n\n\n\n```r\ntrain <- read.csv(\"adult_train.csv\", header = FALSE)\n\
  \nvarNames <- c(\"Age\",\n              \"WorkClass\",\n              \"fnlwgt\"\
  ,\n              \"Education\",\n              \"EducationNum\",\n             \
  \ \"MaritalStatus\",\n              \"Occupation\",\n              \"Relationship\"\
  ,\n              \"Race\",\n              \"Sex\",\n              \"CapitalGain\"\
  ,\n              \"CapitalLoss\",\n              \"HoursPerWeek\",\n           \
  \   \"NativeCountry\",\n              \"IncomeLevel\")\n\nnames(train) <- varNames\n\
  data <- train\n\ntbl <- table(data$IncomeLevel)\ntbl\n```\n\n```text\n##  <=50K\
  \   >50K\n##  24720   7841\n```\n\n```r\n# 我们移除了一些离群值 - 查看第 11 章\nind <- which(data$NativeCountry==\"\
  \ Holand-Netherlands\")\ndata <- data[-ind, ]\n\n# 将字符转换为因子\ndf <- data\ndf[sapply(df,\
  \ is.character)] <- lapply(df[sapply(df, is.character)],\n                     \
  \                  as.factor)\n```\n\n当我们使用全部数据时，会消耗大量的时间和内存。处理此问题的一种得好的方法是不使用所有数据。这是因为从\
  \ SVM 的角度来看，大多数数据点都是冗余的。请记住，SVM 仅在决策边界附近有更多数据时才会获益。因此，我们可以随机选择例如 10% 的训练数据（应该执行多次以查看其一致性），并了解它的性能表现如何：\n\
