  \n\n\n\n```\n##      bias² var(yhat) MSE var(eps) 样本 MSPE Cov(yi, yhat) 真实 MSPE\n\
  ## ols1 4.9959    0.9467  5.9427  49.1493        53.2219        1.8944   55.0920\n\
  ## ols2 0.0006    1.4224  1.4230  49.1493        47.7574        2.8463   50.5723\n\
  ## ols3 0.0010    2.9011  2.9021  49.1493        46.2783        5.8052   52.0514\n\
  ## ols4 0.0098   10.2528 10.2626  49.1493        38.9179       20.5158   59.4119\n\
  ##      TrueMSPE-Cov\n## ols1      53.1976\n## ols2      47.7260\n## ols3      46.2462\n\
  ## ols4      38.8961\n```\n\n让我们停顿一下，来看这张表格：\n\n1.  我们知道在这次模拟中，“**真实**”模型是 `ols2`。然而，在实践中，我们无法知道真实模型，并且只有一个样本。\n\
  \n2.  如果我们使用样本内 MSPE 来选择模型，我们会选择 `ols4`，因为它具有 MSPE 最小。\n\n3.  `ols4` 不仅是所有模型中最糟糕的**预测器**，它还是所有**无偏**估计器\
  \ `ols1`、`ols2` 和 `ols3` 中最糟糕的**估计器**，因为它的 MSE 最高。\n\n4.  如果我们的任务是寻找最佳预测器，我们不能使用样本内\
  \ MSPE，因为它会把 `ols4` 视为最佳预测器。\n\n顺便说明一下：当我们从样本外预测准确性的角度比较模型时，我们通常使用根 MSPE (RMSPE)，它给出了原始单位的预测误差。\n\
  \n当我们用一个样本计算经验样本内 MSPE 时，我们可以通过 Mallows `C[P]` 统计量来评估其样本外性能，这只是将 `σ²` 的可行估计量替换到过拟合惩罚中。也就是说，对于由\
  \ OLS 拟合的 `p+1` 个系数的线性模型，\n\n$C_{p} = \\frac{1}{n}\\underset{i = 1}{\\overset{n}{\\\
  Sigma}}\\left( {y_{i} - \\hat{f}(x_{i})} \\right)^{2} + \\frac{2{\\hat{\\sigma}}^{2}}{n}(p\
  \ + 1),$\n\n这成为了样本外误差良好的指标。也就是说，`C[p]` 值越小意味着模型越精确。在比较模型时，我们真正关心样本外 MSPE 的差异：\n\n\
  $\\Delta C_{p} = {\\text{M}\\text{S}\\text{E}}_{1} - {\\text{M}\\text{S}\\text{E}}_{2}\
  \ + \\frac{2}{n}{\\hat{\\sigma}}^{2}}\\left( p_{1} - p_{2} \\right),$\n\n其中我们使用来自模型的\
  \ `σ̂²`。\n\n我们如何找到最佳预测器？除了 `C[p]`，我们还可以使用**赤池信息准则 (AIC)**，它具有“样本内性能加惩罚”的形式。每当我们有似然函数时，就可以使用\
  \ `C[p]`。我们稍后会看到 AIC 和 BIC（贝叶斯信息准则）。通过这些标准，我们可以通过对训练（样本内）误差进行调整来间接估计测试（样本外）误差，以考虑过拟合。\n\
  \n另一方面，我们可以直接估计测试（样本外）误差并选择使其最小的模型。我们可以通过交叉验证方法来实现。因此，交叉验证为过拟合提供了**事验**惩罚，是机器学习应用中选择模型的主要工具，因为它们几乎没有假设。\n\
  \n# 部分 非参数估计\n\nDOI: [10.1201/978100381501-6](https://doi.org/10.1201/978100381501-6)\n\
  \n根据 Breiman 的观点，存在两种“文化”：\n\n**数据建模文化**：这种文化假设数据是由特定的随机模型生成的（计量经济学）。Leo Breiman\
  \ (2001) 表达了他的担忧：\n\n> *例如，在《美国统计协会杂志》(JASA) 上，几乎每篇文章都包含如下形式的陈述：假设数据是由以下模型生成的……我对目前在应用中使用数据模型感到非常困扰，并得出了定量结论。*\n\
  \n> *…………假设数据是由来自模型的独立抽取生成的*\n\n$y = b_{0} + \\underset{1}{\\overset{n}{\\Sigma}}b_{m}x_{m}\
  \ + \\epsilon$\n\n*其中系数是待估计的。误差项是 N(0,* * σ² * 是待估计的。鉴于数据是这样生成的，可以推导出假设检验、置信区间、残差和和渐近性。这在数学上使得该模型具有吸引力。学者和其他人使用该理论来推导模型\
  \ (R) 的系数显著性，很少考虑手头的数据是否是由线性模型生成的。成百上千的文章发表了关于某事的或其他证明，因为系数在 5% 水平上是显著的。*\n\n> *…………坚持数据模型，统计学中的多变量分析被限制在分类和逻辑回归中。*\n\
  \n**算法文化**：这种文化假设数据是由特定的随机模型生成的（计量经济学）。Breiman 认为对数据模型的关注：\n\n*   导致了无关的科学；\n* \
  \  阻碍了统计学家利用更合适的模型；\n*   阻止了统计学家处理新问题。\n\n非参数计量经济学桥接了这两者：**机器学习：计量经济学的扩展。**\n\n\
  # 5 参数估计\n\nDOI: [10.1201/978100381501-6](https://doi.org/10.1201/978100381501-6)\n\
  \n到目前我们只考虑了数值响应的模型。如果响应是类别的怎么办？在这种情况下可以使用线性模型吗？可以。为了理解这一点，让我们看看最小二乘 (OLS) 回归，它实际上是更通用的广义线性模型\
  \ (GLM) 的特例。因此，通常情况下 GLM 通过链接函数将响应的均值与预测器的线性组合联系起来。\n\n1.  我们知道在这次模拟中，“**真实**”模型是\
  \ `ols2`。然而，在实践中，我们无法知道真实模型，并且只有一个样本。\n\n2.  如果我们使用样本内 MSPE 来选择模型，我们会选择 `ols4`，因为它具有\
  \ MSPE 最小。\n\n3.  `ols4` 不仅是所有模型中最糟糕的**预测器**，它还是所有**无偏**估计器 `ols1`、`ols2` 和 `ols3`\
  \ 中最糟糕的**估计器**，因为它的 MSE 最高。\n\n4.  如果我们的任务是寻找最佳预测器，我们不能使用样本内 MSPE，因为它会把 `ols4` 视为最佳预测器。\n\
  \n顺便说明一下：当我们从样本外预测准确性的角度比较模型时，我们通常使用根 MSPE (RMSPE)，它给出了原始单位的预测误差。\n\n当我们用一个样本计算经验样本内\
  \ MSPE 时，我们可以通过 Mallows `C[P]` 统计量来评估其样本外性能，这只是将 `σ²` 的可行估计量替换到过拟合惩罚中。也就是说，对于由 OLS\
  \ 拟合的 `p+1` 个系数的线性模型，\n\n$C_{p} = \\frac{1}{n}\\underset{i = 1}{\\overset{n}{\\\
  Sigma}}\\left( {y_{i} - \\hat{f}(x_{i})} \\right)^{2} + \\frac{2{\\hat{\\sigma}}^{2}}{n}(p\
  \ + 1),$\n\n这成为了样本外误差良好的指标。也就是说，`C[p]` 值越小意味着模型越精确。在比较模型时，我们真正关心样本外 MSPE 的差异：\n\n\
  $\\Delta C_{p} = {\\text{M}\\text{S}\\text{E}}_{1} - {\\text{M}\\text{S}\\text{E}}_{2}\
  \ + \\frac{2}{n}{\\hat{\\sigma}}^{2}}\\left( p_{1} - p_{2} \\right),$\n\n其中我们使用来自模型的\
  \ `σ̂²`。\n\n我们如何找到最佳预测器？除了 `C[p]`，我们还可以使用**赤池信息准则 (AIC)**，它具有“样本内性能加惩罚”的形式。每当我们有似然函数时，就可以使用\
  \ `C[p]`。我们稍后会看到 AIC 和 BIC（贝叶斯信息准则）。通过这些标准，我们可以通过对训练（样本内）误差进行调整来间接估计测试（样本外）误差，以考虑过拟合。因此，交叉验证为过拟合提供了**事验**惩罚，是机器学习应用中选择模型的主要工具，因为它们几乎没有假设。\n\
  \n\n\n\n\n```\n# 二进制结果 mpg = 如果 hwy > mean(hwy) 则为 1，否则为 0\ndata$mpg <- ifelse(data$hwy\
  \ > mean(data$hwy), 1, 0)\ntable(data$mpg)\n``````\n##\n##     0     1\n## 17280\
  \ 16102\n```\n\n我们将建立一个模型，根据每个汽车的属性来预测其 `mpg`（即 `mpg` = 1）。如果你检查数据，会发现许多变量是字符型（character\
  \ variables）。虽然大多数函数（如 `lm()`）接受字符变量（并将其转换为因子 factor），但检查每个变量并将其转换为适当的数据类型是一个良好的做法。\n\
