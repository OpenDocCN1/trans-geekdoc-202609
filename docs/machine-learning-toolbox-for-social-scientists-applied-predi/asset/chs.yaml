  \n### 13.3.3 XGBoost\n\n极端梯度提升（XGBoost）是梯度提升框架中最高效的版本，因为它能够在单机上实现并行计算。它可以用于回归和分类。XGBoost\
  \ 有几个独特优势：它的速度“比 gbm 快 10 倍”。\n\n我们从回归示例开始，将分类示例留到增强应用的第 14 章](#C_019_c14.xhtml)。我们将使用\
  \ Ames 房屋数据来看销售价格的最佳“预测因子”。\n\n```\nlibrary(xgboost)\nlibrary(mltools)\nlibrary(data.table)\n\
  library(modeldata) # 也可以通过 tidymodels 加载\ndata(ames)\ndim(ames)\n```\n```\n[1] 2930\
  \   74\n```\n\n由于 `xgboost` 算法接受矩阵作为输入数据，因此所有分类变量都必须进行独热编码，这会导致即使数据规模较小也会创建一个巨大的矩阵。这就是为什么使用内存高效的矩阵类型（稀疏矩阵等）可以加快处理过程。在这里我们忽略这一点，目前使用普通矩阵。\n\
  \n```\names_new <- one_hot(as.data.table(ames))\ndf <- as.data.frame(ames_new)\n\
  \nind <- sample(nrow(df), nrow(df), replace = TRUE)\ntrain <- df[ind,]\ntest <-\
  \ df[-ind,]\n\nX <- as.matrix(train[,-which(names(train) == \"Sale_Price\")])\n\
  Y <- train$Sale_Price\n```\n\n现在我们准备好寻找最优调优参数了。调优策略之一是观察训练误差和交叉验证误差之间是否存在显著差异。我们首先从树的数量和学习率开始。如果差异仍然存在，我们就引入正则化参数。三个正则化参数分别是`gamma`、`lambda`\
  \ 和 `alpha`。最后两个与我们在第 8 部分看到的正则化相似。\n\n这是我们第一次没有进行网格搜索的运行。我们将使用回归树。对于树模型，默认的提升器是\
  \ `gbtree`。对于线性模型，应将其设置为 `gblinear`。XGBoost 的参数数量及其组合非常详尽。请参阅此处：`https://xgboost.readthedocs.io/en/latest/parameter.html#global-configuration`。我们选择的参数组合只是一个示例。\n\
  \n\n\n\n\n```r\nparams = list(\n  eta = 0.1, # Step size in boosting (default is\
  \ 0.3)\n  max_depth = 3, # maximum depth of the tree (default is 6)\n  min_child_weight\
  \ = 3, # minimum number of instances in each node\n  subsample = 0.8, # Subsample\
  \ ratio of the training instances\n  colsample_bytree = 1.0 # the fraction of columns\
  \ to be subsampled\n)\n\nset.seed(123)\nboost <- xgb.cv(\n  data = X,\n  label =\
  \ Y,\n  nrounds = 3000, # the max number of iterations\n  nthread = 4, # the number\
  \ of CPU cores\n  objective = \"reg:squarederror\", # regression tree\n  early_stopping_rounds\
  \ = 50, # Stop if doesn't improve after 50 rounds\n  nfold = 10, # 10-fold-CV\n\
  \  params = params,\n  verbose = 0 #silent\n)\n```\n\n让我们看看 RMSE 和最佳迭代次数：\n\n```r\n\
  best_it <- boost$best_iteration\nbest_it\n```\n\n```\n## [1] 1781\n```\n\n```\n\
  min(boost$evaluation_log$test_rmse_mean)\n```\n\n```\n## [1] 16807.16\n```\n\n```r\n\
  # 一个可能的网格搜索为：\n# param_grid <- expand.grid(\n#   eta = 0.01,\n#   max_depth = 3,\n\
  #   min_child_weight = 3,\n#   subsample = 0.5,\n#   colsample_bytree = 0.5,\n#\
  \   gamma = c(0, 1, 10, 100, 1000),\n#   lambda = seq(0, 0.01, 0.1, 1, 100, 1000),\n\
  #   alpha = c(0, 0.01, 0.1, 1, 100, 1000)\n#   )\n\n# 在循环中通过 `xgb.cv` 执行网格后\n# 我们保存了多个\
  \ `test_rmse_mean` 和 `best_iteration`\n# 并找到使 rmse 最小的参数\n```\n\n现在确定调优参数后，我们构建最佳模型：\n\
  \n```r\ntr_model <- xgboost(\n  params = params,\n  data = X,\n  label = Y,\n  nrounds\
  \ = best_it,\n  objective = \"reg:squarederror\",\n  verbose = 0\n)\n```\n\n我们可以使用不纯度（增益）指标获取最终模型中影响最大的前十大特征：\n\
  \n```r\nlibrary(vip)\nvip(tr_model,\n    aesthetics = list(color = \"green\", fill\
  \ = \"orange\"))\n```\n\n```\n## [11:23:02] WARNING: src/learner.cc:553:\n##   如果你正在加载由旧版本\
  \ XGBoost 生成的序列化模型（如 Python 中的 pickle，R 中的 RDS），\n##   请先通过调用该版本的 `Booster.save_model`\
  \ 导出模型，\n##   然后在当前版本中加载它。详见：\n##\n##     https://xgboost.readthedocs.io/en/latest/tutorials/saving_model.html\n\
