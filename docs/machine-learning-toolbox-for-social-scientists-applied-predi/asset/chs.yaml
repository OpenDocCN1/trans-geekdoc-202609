  ##   quality6        7       78      160       51\n##   quality7        1      \
  \  0       11       18\n```\n\n这仅仅是一个例子，结果并不能反映训练良好的模型。\n\n带有适当训练的高级 DNN 应用需要更长的时间和更强大的机器。我们可以对不同的隐藏层和神经元数量进行网格搜索。然而，大型数据集和更复杂的\
  \ DNN 需要更好的应用程序，例如 `Keras`，它可以使用具有能力的操作系统的 GPU，从而大大提高训练效率。到目前为止，我们使用了 `neuralnet`\
  \ 包。R 中还有几个包也能实现和训练 ANN。最适合我们需求的包将取决于我们的具体要求和偏好。对于一个构建和训练 ANN 的强大且灵活的包，`neuralnet`\
  \ 或 `deepnet` 可能是很好的选择。当我们只需要一个简单易于使用的包来训练前馈网络并进行预测时，`nnet` 可能是另一个很好的选择。如果我们想要一个可以处理包括\
  \ ANN 在内的广泛机器学习任务的通用包，`caret` 将是一个很好的选择。\n\nDNN 是具有许多层的神经网络，由于需要优化的参数数量巨大，它们很难训练。相反，卷积神经网络\
  \ (CNN) 专门为处理具有网格结构的数据（如图像）而设计。CNN 的一个关键方面是它们使用卷积层，该层对输入数据应用一组过滤器，并产生一组转换后的特征图。\n\
  \n这些过滤器能够检测输入数据中的特定特征（如边缘、角或纹理），并能够在输入数据中共享这些特征。这意味着 CNN 中的参数数量通常远于 DNN，这使得模型更容易训练且不易过拟合。总而言之，CNN\
  \ 非常适用于图像分类、目标检测和语音识别等任务。我们在这里不会介绍 CNN 的细节。\n\n最后，在深度神经网络中，“丢弃”（dropout）和“正则化”是防止过拟合的技术。丢弃是一种正则化技术，在训练期间随机丢弃或移除网络中比例的神经元。这具有降低模型复杂性的效果，因为它不能依赖任何单一神经元或神经元组来做出预测。正则化是一个泛义术语，指任何防止机器学习模型过拟合的方法。有许多类型的正则化技术，它们向激活函数的参数添加了惩罚项。\n\
  \n我们将在第 7 部分 - 时间序列中回到 ANN。\n\n\n\n\n\n# 第 6 部分 惩罚回归\n\nDOI: [10.1201/9781003381501-22](https://doi.org/10.1201/9781003381501-22)\n\
  \n与普通回归模型不同，惩罚回归在其损失函数中添加了惩罚项，其中最小化残差平方和 (`RSS`）受到对回归系数惩罚的限制。因此，惩罚回归方法保留了模型中的所有变量，但通过将回归系数向零收缩来实现正则化。当收缩程度足够大时，这些方法还可以通过将某些系数收缩为零用于变量选择。\n\
  \n在简单的回归或分类问题中，我们无法以拟合模型最小化样本外预测误差的方式训练参数模型。我们可以（并且已经）通过添加或删除预测变量及其交互项和多项式来`手动`地拟合参数模型。正如我们在前面的章节中看到的，例如通过在回归中丢弃变量，可以以微小的偏差增加为代价来减少方差。\n\
  \n在拟合预测模型时，回归中使用的某些变量可能与响应变量没有很好的关联。保留这些“无关”变量通常会导致结果模型产生不必要的复杂。正则化或惩罚是一种替代且自动的拟合程序，它指的是移除无关变量或收缩其参数幅度的过程，这可以通过防止过拟合来获得更好的预测准确性和模型可解释性。\n\
  \n参数模型可以使用几种类型的正则化技术。每种技术都向目标函数添加了一种不同类型的惩罚项，并可以根据数据特征和所需的模型属性用于不同的情况。`Ridge` 和\
  \ `Lasso` 两种方法是两种广知的基准技术，可以降低模型复杂度并防止由简单线性回归引起的过拟合。\n\n惩罚的一般原理可以表示为\n\n${\\\\hat{m}}\\\
  _{\\lambda}\\\\left( x \\\\right) = {argmin}\\\\left\\\\{ {\\\\underset{i = 1}{\\\
  overset{n}{\\Sigma}}\\\\underset{\\text{loss~function~}}{\\underset{︸}{\\mathcal{}\\\
  \\left( \\\\left. y\\\\_{i},m(\\\\text{x} \\\\right) \\\\right)}} + \\underset{\\\
  text{penalization~}}{\\underset{︸}{\\\\lambda \\\\parallel m \\\\parallel_{\\ell_{_{q}}}}}\
  \ \\\\right\\\\}$\n\n其中 `L` 可以是条件均值、分位数、期望分，`m` 可以是线性、logit、样条、基于树的模型、神经网络。惩罚项 `l[q]`\
  \ 可以是 lasso (`l[1]`) 或 ridge (`l[2]`)。而 `λ` 调节过拟合程度，可以通过交叉验证或其他方法来确定。它为拥有更灵活的模型付出了代价：\n\
  \n*   `λ` → 0: 它对数据进行插值，低偏差，高方差\n*   `λ` → ∞: 线性模型高偏差，低方差\n\n统计学习有两个基本目标：实现高预测准确率和识别相关的预测变量。第二个目标——变量选择，在底层模型存在真实稀疏性时尤为重要。从本质上说，惩罚性参数模型不是良好的预测工具。但是，特别是当\
  \ `p > N` 且真实模型是稀疏的时，它们提供了重要的模型选择工具。本节将从正则化回归中的两个主要模型 `Ridge` 和 `Lasso` 开始，并阐述使用\
  \ `Adaptive Lasso` 进行稀疏统计建模的想法。\n\n尽管关于这个主题有很多来源，但也许最基础的是 Hastie 等人的著作《Statistical\
  \ Learning with Sparsity》（2015）。\n\n在本节中，我们将看到三种惩罚回归方法：`Ridge`、`Lasso` 和 `Adaptive\
  \ Lasso`。最后一章将介绍利用稀疏性进行模型选择。\n\n# 17 Ridge (岭回归)\n\nDOI: [10.1201/9781003381501-23](https://doi.org/10.1201/9781003381501-23)\n\
  \n最小二乘拟合程序是估计 `β[0]`、`β[1]`、`. . . `, `β[p]`，使得残差平方和最小化：\n\n${\\\\text{R}\\\\text{S}\\\
  \\text{S}} = \\\\underset{i = 1}{\\overset{n}{\\Sigma}}\\\\left( y\\\\_{i} - \\\\\
  beta\\\\_{0} - \\\\underset{j = 1}{\\overset{p}{\\Sigma}}\\\\beta\\\\_{j}x\\\\_{ij}\
  \ \\\\right)^{2}$\n\n`Ridge` 回归与最小二乘法非常相似，只是系数是通过最小化一个略有不同的量来估计的。\n\n$\\\\underset{i\
  \ = 1}{\\overset{n}{\\Sigma}}\\\\left( y\\\\_{i} - \\\\beta\\\\_{0} - \\\\underset{j\
  \ = 1}{\\overset{p}{\\Sigma}}\\\\beta\\\\_{j}x\\\\_{ij} \\\\right)^{2} + \\\\lambda\\\
  \\underset{j = 1}{\\overset{p}{\\Sigma}}\\\\beta\\\\_{j}^{2} = {\\\\text{R}\\\\\
  text{S}\\\\text{S}} + \\\\lambda\\\\underset{j = 1}{\\overset{p}{\\Sigma}}\\\\beta\\\
  \\_{j}^{2},$\n\n其中 `λ` 是可以通过交叉验证和网格搜索调整的超参数。最后一项 `λ∑[*j]β[*j]²` 是一个约束，也被称为收缩惩罚。这种惩罚是\
  \ `l[2]`。与普通最小二乘 (`OLS`) 一样，该代价函数试图最小化 `RSS`，同时也惩罚系数的大小。具体而言，\n\n${\\underset{i\
  \ = 1}{\\overset{n}{\\Sigma}}\\\\left( y\\\\_{i} - \\\\beta\\\\_{0} - \\\\underset{j\
  \ = 1}{\\overset{p}{\\Sigma}}\\\\beta\\\\_{j}x\\\\_{ij} \\right)^{2} + \\\\lambda\\\
  \\underset{j = 1}{\\overset{p}{\\Sigma}}\\\\beta\\\\_{j}^{2}$\n\n解为：\n\n$\\hat{\\\
  beta}_{\\lambda} = (X^T X + \\lambda I)^{-1} X^T y$\n\n其中：\n\n*   `λ` → 0: 它产生 `OLS`\
  \ 估计\n*   `λ` → ∞: 系数趋于零\n\n超参数 `λ` 控制惩罚的相对影响。由于惩罚会收缩相关变量的系数（在 `Ridge` 中）或选择一个并丢其他的（在\
  \ `Lasso` 中），变量应该是标准化的，这由 `glmnet` 完成。注意，惩罚应用于系数，而不是截距项。\n\n我们将此应用于相同的数据 `Hitters`：\n\
  \n```\nlibrary(ISLR)\n\nremove(list = ls())\n\ndata(Hitters)\n\ndf <- Hitters[complete.cases(Hitters$Salary),\
  \ ]\n```\n\n我们将使用 `glmnet` 包来拟合 `ridge` 回归。`glmnet` 中的通用函数定义为 $\\underset{\\beta_{0},\\\
  \\beta}{\\min}\\frac{1}{N}\\underset{i = 1}{\\overset{N}{\\Sigma}}w_{i}l\\\\left(\
  \ y_{i},\\\\beta_{0} + \\beta^{T}x_{i} \\\\right) + \\\\lambda\\\\left\\\\lbrack\
  \ \\\\left. (1 - \\\\alpha \\\\right) \\\\parallel \\\\beta \\\\parallel_{2}^{2}\\\
  \\slash 2 + \\\\alpha \\\\parallel \\\\beta \\\\parallel_{1} \\\\right\\\\rbrack,~}$\
  \ 其中 `l` (`y[i]`, `η[i]`) 是观测值 *i* 的负对数似然贡献，`α` 是弹性网络惩罚。当 `α` = 1 时（默认值），惩罚项变为 `l[1]`，结果模型为\
  \ `lasso` 回归。当 `α` = 0 时（此处原文应为 0），结果模型为 `ridge` 回归（某些作者使用 Tikhonov–Phillips 正则化术语）。\n\
  \n\n\n\n\n(. . . ) 特对于创建 `x` 特别有用；它不仅生成了与 19 个预测变量对应的矩阵，还自动将任何定性变量转换为哑变量。后者属性非常重要，因为\
  \ `glmnet()` 只能接收数值型的定量输入。\n\n这里有一个岭回归（ridge regression）的示例：\n\n```\nlibrary(glmnet)\n\
  grid = 10 ^ seq(10,-2, length = 100)\nmodel <- glmnet(X, y, alpha = 0, lambda =\
  \ grid)\n```\n\n虽然我们定义了 `grid`，但并没有通过交叉验证显式地网格搜索。此外，我们不需要手动选择网格。默认情况下，`glmnet()`\
  \ 函数会对自动选择的 `λ` 值范围执行岭回归。该范围从 `λ` 处于上限时的仅包含截距的空模型，一直到 `λ` 处于下限时的最小二乘法拟合。\n\n上面的应用是为了展示我们也可以选择在值值网格上实现该函数。此外，`glmnet()`\
  \ 函数会对变量进行标准化，使其处于相同的尺度上。要关闭此默认设置，我们使用参数 `standardize=FALSE`。\n\n这里的方法（岭回归和 lasso）是参数模型。与非参数方法不同，每个模型都由一组参数（或者在我们的用例中是系数）定义。因此，当我们进行网格搜索时，每个超参数（`λ`）的值都与由一组系数定义的模型相关联。为了查看系数，我们需要应用另一个函数\
  \ `coef()`。记住，我们有 100 个 `λ`。因此，`coef()` 生成了一个 20 × 100 的矩阵，包含 20 行（每个预测变量占一行，外加截距）和\
  \ 100 列（每个 `λ` 值占列）。\n\n```\ndim(coef(model))\n```\n\n```\n## [1]  20 100\n```\n\
  \n```\nmodel$lambda[c(20, 80)]\n```\n\n```\n## [1] 4.977024e+07 2.656088e+00\n```\n\
  \n```\ncoef(model)[, c(20, 80)]\n```\n\n```\n## 20 x 2 sparse Matrix of class \"\
  dgCMatrix\"\n##                       s19          s79\n## (Intercept)  5.358880e+02\
  \  156.6073700\n## AtBat        1.093664e-05   -1.7526436\n## Hits         3.967221e-05\
  \    6.1739859\n## HmRun        1.598556e-04    1.3285278\n## Runs         6.708833e-05\
  \   -0.7689372\n## RBI          7.086606e-05   -0.1297830\n## Walks        8.340541e-05\
  \    5.5357165\n## Years        3.410894e-04   -9.2923000\n## CAtBat       9.390097e-07\
  \   -0.0792321\n## CHits        3.455823e-06    0.2132942\n## CHmRun       2.606160e-05\
  \    0.6557328\n## CRuns        6.933126e-06    0.8349167\n## CRBI         7.155123e-06\
  \    0.4090719\n## CWalks       7.570013e-06   -0.6623253\n## LeagueN     -1.164983e-04\
  \   62.0427219\n## DivisionW   -1.568625e-03 -121.5286522\n## PutOuts      4.380543e-06\
  \    0.2809457\n## Assists      7.154972e-07    0.3124435\n## Errors      -3.336588e-06\
  \   -3.6852362\n## NewLeagueN  -2.312257e-05  -27.9849755\n```\n\n正如我们所看到的，当使用较大的\
  \ `λ` 值时，系数估计值要小得多。我们通常像以前一样使用 `predict()` 函数。但在这里，我们也可以用它来估计新 `λ` 值的岭回归系数。因此，如果我们不想依赖\
  \ `glmnet()` 提供的内部网格搜索，我们可以通过 `predict()` 进行我们自己的网格搜索。这是一个 `λ` = 50 的示例，该值并不在网格中。\n\
  \n```\npredict(model, s = 50, type = \"coefficients\")\n```\n\n```\n## 20 x 1 sparse\
  \ Matrix of class \"dgCMatrix\"\n##                        s1\n## (Intercept)  4.876610e+01\n\
  ## AtBat       -3.580999e-01\n## Hits         1.969359e+00\n## HmRun       -1.278248e+00\n\
  ## Runs         1.145892e+00\n## RBI          8.038292e-01\n## Walks        2.716186e+00\n\
  ## Years       -6.218319e+00\n## CAtBat       5.447837e-03\n## CHits        1.064895e-01\n\
  ## CHmRun       6.244860e-01\n## CRuns        2.214985e-01\n## CRBI         2.186914e-01\n\
  ## CWalks      -1.500245e-01\n## LeagueN      4.592589e+01\n## DivisionW   -1.182011e-02\n\
  ## PutOuts      2.502322e-01\n## Assists      1.215665e-01\n## Errors      -3.278600e+00\n\
  ## NewLeagueN   -9.496680e+00\n```\n\n有两种方法可以训练岭回归（以及 Lasso）：\n\n*   使用我们自己的算法；\n\
  *   或者依赖 `glmnet` 的内部交叉验证。\n\n这里是我们自己的岭回归算法示例：\n\n```\ngrid =10^seq(10, -2, length\
  \ = 100)\n\nMSPE <- c()\nMMSPE <- c()\n\nfor(i in 1:length(grid)){\n  for(j in 1:100){\n\
  \    set.seed(j)\n    ind <- unique(sample(nrow(df), nrow(df), replace = TRUE))\n\
  \    train <- df[ind,]\n    xtrain <- model.matrix(train[,-1])\n    ytrain <- df[ind,\
  \ \"Salary\"]\n\n    test <- df[-ind, ]\n    xtest <- model.matrix(test[,-1])\n\
  \    ytest <- df[-ind, \"Salary\"]\n\n    model <- glmnet(xtrain, ytrain, alpha\
  \ = 0, lambda = grid[i])\n    yhat <- predict(model, s = grid[i], new = xtest)\n\
  \    MSPE[j] <- mean((yhat - ytest)²)\n  }\n  MMSPE[i] <- mean(MSPE)\n}\nmin(MMSPE)\n\
  ```\n\n```\n## [1] 119058.3\n```\n\n```\ngrid[which(MMSPE)]\n```\n\n```\n## [1]\
