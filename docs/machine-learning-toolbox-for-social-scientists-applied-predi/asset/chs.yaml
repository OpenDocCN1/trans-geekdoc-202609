  # R 中的 36 种仿真\n\nDOI: [10.1201/9781003381501-46](https://doi.org/10.1201/9781003381501-46)\n\
  \n在本实验中，我们将学习如何模拟数据并在若干示例中演示它们的用法。具体来说，我们将涵盖以下主题：\n\n1. R 中的采样：`sample()`。\n2. 使用概率分布生成随机数。\n\
  3. 用于统计推断的仿真。\n4. 使用数据生成模型 (DGM) 创建数据。\n5. 自助法 (Bootstrapping)。\n6. 仿真的威力——一个有趣的示例。\n\
  \n我们为什么要模拟数据？为什么不使用真实数据呢？因为使用真实数据时，我们不知道正确答案。假设我们使用真实数据并应用某种方法来提取信息，我们如何知道应用的方法是正确的？现在假设我们通过模拟模型来创建人工数据。由于我们知道正确答案，就可以检查我们的方法是否能提取出我们想要的信息。如果我们的方法是正确的，那么就可以将其应用于真实数据。\n\
  \n## 36.1 R 中的采样：`sample()`\n\n让我们通过 `sample()` 函数来进行简单的采样实验。\n\n```\nsample(\"\
  H\", \"T\"), size = 8, replace = TRUE) # 公平硬币\n[1] \"H\" \"H\" \"H\" \"T\" \"T\"\
  \ \"H\" \"T\"\n```\n\n```\nsample(1:6, size = 2, replace = TRUE, prob = c(3, 3,\
  \ 3, 4, 4, 4)) # [1] 2 4\n```\n\n```\nsample(\"H\", \"T\"), size = 8, replace =\
  \ TRUE) # 公平硬币\n[1] \"T\" \"H\" \"H\" \"H\" \"T\" \"T\" \"T\"\n```\n\n```\nsample(1:6,\
  \ size = 2, replace = TRUE, prob = c(3, 3, 3, 4, 4, 4)) # [1] 3 5\n```\n\n结果是不同的。如果我们使用\
  \ `set.seed()`，那么每次都能得到相同的结果。让我们试一下：\n\n```\nset.seed(123)\nsample(\"H\", \"T\"\
  ), size = 8, replace = TRUE) # 公平硬币\n[1] \"H\" \"H\" \"H\" \"T\" \"H\" \"T\" \"\
  T\"\n```\n\n```\nsample(1:6, size = 2, replace = TRUE, prob = c(3, 3, 3, 4, 4, 4))\
  \ # [1] 3 5\n```\n\n```\nset.seed(123)\nsample(\"H\", \"T\"), size = 8, replace\
  \ = TRUE) # 公平硬币\n[1] \"H\" \"H\" \"H\" \"T\" \"H\" \"T\" \"T\"\n```\n\n```\nsample(1:6,\
  \ size = 2, replace = TRUE, prob = c(3, 3, 3, 4, 4, 4)) # [1] 3 5\n```\n\n我们使用 `replace=TRUE`\
  \ 来覆盖默认的不放回抽样。这意味着同一个元素可以被多次选取。而 `prob=` 用于以不同的概率进行采样。`set.seed()` 函数允许你生成一组可重复的随机数。让我们看看差异：\n\
  \n```\nx <- 1:12\n# 随机排列\nset.seed(123)\nsample(x)\n[1] 3 12 10 2 6 11 5 4 9 8 7\n\
  ```\n\n```\nset.seed(123)\nsample(x, replace = TRUE)\n[1] 3 12 10 2 6 11 5 4 9 8\
  \ 7\n```\n\n```\n# 打乱数字并替换\nx <- 1:10\n# sample() 的惊喜\nsample(x > 3) # 长度为 2\n[1]\
  \ 8 6 9 4 7 10 5\n```\n\n```\nsample(x > 9) # 长度为 10！这行不通\n[1] 3 8 2 7 9 1 6 10\
  \ 4 5\n```\n\n```r\n这是一个例子：让我们生成 501 次硬币抛掷。在真实模型中，这应该是一半时间正面，一半时间反面。\n\n```\nset.seed(123)\n\
  coins <- sample(c(\"Heads\", \"Tails\"), 501, replace = TRUE)\n```\n\n现在让我们获取这些数据并进行标准分析！正面的比例为：\n\
  \n```r\nmean(coins == 'Heads')\n[1] 0.5209581\n```\n\n```r\nbarplot(\n  prop.table(table(coins)),\n\
  \  col = c(\"lightskyblue\", \"mistyrose\"),\n  cex.axis = 0.8,\n  cex.names = 0.8\n\
  )\n```\n![](img/Fig36_01.jpg)\n\n结论是什么？我们得出真实模型的生成率为 0.493014。虽然非常接近 0.50，但并不精确。这整个过程有效吗？如果在\
  \ 501 次抛掷中总是偏正面怎么办？我们稍后回答这个问题。\n\n```\nsample(letters, 10, replace = TRUE)\n```\n\
  \n## 36.2 使用概率分布生成随机数\n\n以下是 R 中常见的概率分布。更多细节请搜索。\n\n```\nbeta(shape1, shape2)\n\
  binom(size, prob)\nchisq(df)\nexp(rate)\ngamma(shape, scale)\nlogis(location, scale)\n\
  norm(mean, sd)\npois(lambda)\nt(df)\nunif(min, max)\n```\n\n- `dnorm(x)` 返回 `x`\
  \ 概率分布的 y 轴密度。\n- `pnorm(q)` 返回累积密度 (CDF) 或概率曲线上 `x` 值左侧的面积。\n- `qnorm(p)` 返回分位数，例如\
  \ `x` 的标准化值。\n- `rnorm(n)` 返回大小为 `n` 的随机仿真值。\n\n```\nrnorm(6) # 6 个标准值\n[1] -0.2645952\
  \ -0.9472983 0.7395213 0.8967787 -0.346009 -1.782057\n```\n\n```r\nrnorm(10, mean\
  \ = 50, sd = 19) # 设置参数\n[1] 58.83389 12.93042 40.19385 59.29253 67.13847 62.16690\
  \ 68.07297 38.61666\n```\n\n```\nrunif(n = 10, min = 0, max = 1) # 均匀分布\n[1] 0.9641527\
  \ 0.0814666 0.85436475 0.80223822 0.3851736 0.3275974 0.2049387 0.5693826\n```\n\
  \n```r\npois(lambda = 15) # 松松分布\n[1] 12 15 14 16 13 15 17 14 15 18 12 16 14 15\
  \ 15\n```\n\n```r\nbinom(n = 400, p = 0.488) # 二项分布\n[1] 195 201 198 202 197 200\
  \ 199 203 196 198\n```\n\n## 36.3 用于统计推断的仿真\n\n让我们预测 400 次出生中女孩的数量，假设女孩出生的概率为 48.8%。\n\
  \n```r\nset.seed(123)\ngirls <- rbinom(1, 400, 0.488)\n[1] 201\n```\n\n```\ngirls/400\n\
  [1] 0.5025\n```\n\n现在为了获得仿真的分布，多次进行仿真。\n\n```r\nn.sims <- 1000\ngirls <- rep(NA,\
  \ n.sims) # 创建用于存储仿真的向量\nfor (i in 1:n.sims) {\n  girls[i] <- rbinom(1, 400, 0.488)\n\
  }\n```\n\n我们可以使用直方图来可视化这些仿真的分布吗吗？\n\n```r\nhist(girls, col = \"slategray3\", cex.axis\
  \ = 0.75)\n```\n![](img/Fig36_03.jpg)\n\n```r\nmean(girls)/400\n[1] 0.48727\n```\n\
  \n这被称为*抽样分布*。我们可以用循环来实现同样的功能吗？\n\n```r\nn.sims <- 1000\ngirls <- rep(NA, n.sims)\
  \ # 创建用于存储仿真的向量\nfor (i in 1:n.sims) {\n  girls[i] <- rbinom(1, 400, 0.488)\n}\n\
  hist(girls, col = \"lavender\", cex.axis = 0.75)\n```\n![](img/Fig36_04.jpg)\n\n\
  让我们对硬币抛掷应用类似的仿真。\n\n```r\nn.sims <- 1000\nheads <- rep(NA, n.sims) # 创建用于存储仿真的向量\n\
  for (i in 1:n.sims) {\n  heads[i] <- mean(rbinom(n = 501, size = 1, p = 0.5))\n\
  }\nhist(heads, col = \"aliceblue\", cex.axis = 0.75)\n```\n![](img/Fig36_05.jpg)\n\
  \n```r\nmean(heads)\n```\n\n\n\n\n\n## [1] 0.4997705\n\n这是同一种模拟的另一种方法：\n\n```r\n\
  n.heads <- replicate(1000, mean(rbinom(\n  n = 501, size = 1, p = 0.5\n)))\nhist(n.heads,\
  \ col = \"lightpink\", cex.axis = 0.75)\n```\n\n![](img/Fig36_06.jpg)\n\n```r\n\
  mean(n.heads)\n```\n\n## [1] 0.4987265\n\n均值的 95% 置信区间是多少？\n\n```r\nsd <- sd(n.heads)\n\
  CI95 <- c(-2 * sd + mean(n.heads), 2 * sd + mean(n.heads))\nCI95\n```\n\n## [1]\
  \ 0.4538446 0.5436085\n\n如果我们使用“错误”的均值估计量，例如 `sum(heads)/300`，会发生什么？\n\n```r\nn.sims\
  \ <- 1000\nn.heads <- rep(NA, n.sims) # 创建向量存储模拟结果\nfor (i in 1:n.sims) {\n  n.heads[i]\
  \ <- sum(rbinom(n = 501, size = 1, p = 0.5)) / 300\n}\nmean(n.heads)\n```\n\n##\
  \ [1] 0.83496\n\n因为我们正在进行模拟，识别出这个错误估计量的结果是错误的变得非常简单。\n\n## 36.4 使用数据生成模型 (DGM) 创建数据\n\
  \n统计学的任务之一是获取关于总体的信息。在大多数情况下，总体是未知的，研究人员唯一知道的是从总体中抽取的有限观测子集。统计分析的主要目标是通过分析样本来获取关于总体的信息。由于对总体特征的了解非常少，因此人们必须对这一未知总体的行为建立一些假设。例如，对于回归分析，我们可以说明整个总体回归函数\
  \ (PRF) 是 `X` 不同取值的线性函数。与 PRF 相关的一个重要问题是回归方程中的误差项 `u[i]`。对于随机变量 `X, Y` 的一对实现值 `x[i],\
  \ y[i]`，我们可以写下等式：\n\n$y[i] = E(Y|X=x[i]) + u[i] = \\alpha + \\beta x[i] + u[i]$\n\
  \n以及\n\n$E(u|X=x[i]) = 0$\n\n这一结果意味着对于 `X = x[i]`，所有 `Y` 值相对于条件期望 `E(Y|X = x[i])`\
  \ 的偏差被平均消除了。回归中存在误差项的原因有几个：(1) 误差项考虑了模型之外的变量；(2) 我们对模型的正确性没有足够的把握；以及(3) 我们不知道变量是否存在测量误差。在回归分析中，PRF\
  \ 是 `y[i]` 的数据生成模型，这对我们来说是未知的。由于它是未知的，我们必须尝试从样本中学习，因为那是我们唯一的可用数据。如果我们假设存在一个特定的 PRF\
  \ 生成数据，那么给定 $\\alpha$ 和 $\\beta$ 的任意估计量（即 $\\hat{\\alpha}$ 和 $\\hat{\\beta}$），我们就可以通过样本回归函数\
  \ (SRF) 从样本中估计它们：$\\hat{y}[i] = \\hat{\\alpha} + \\hat{\\beta} x[i]$。\n\nPRF 与 SRF\
  \ 之间的关系是 $y[i] = \\hat{y}[i] + \\hat{u}_i$，其中 $\\hat{u}_i$ 表示残差。有了数据生成过程 (DGP)，就可以创建新数据。利用\
  \ $\\alpha$、$\\beta$ 和外生变量向量 `X`（固定），可以使用大小为 `n` 的样本来获得带有随机变量 `u` 的 `Y` 值。这产生了一个大小为\
  \ `N` 的完整总体。注意，人为生成的数据集可以被视为现实数据的一个例子，研究人员将面临此类模型所代表的估计问题。特别注意，获得的数据集关键取决于特定的误差项集合。\n\
  \n一旦生成了人工数据，DGM 现在变得已知，整个总体是可以访问的。也就是说，我们可以在该总体的不同样本上测试许多模型，以查看它们的推断属性是否符合 DGM。下面是几个例子。这里是我们的\
  \ DGM：$Y[i] = \\beta[1] + \\beta[2]X[2] + \\beta[3]X[3] + \\beta[4]X[4] + \\beta[5]X[5]$，其系数向量\
  \ $\\beta = (12,-0.7, 34,-0.17, 5.4)$。此外，`x[2]` 是取值为 0 和 1 的二元变量，`x[5]` 和 `x[3]`\
  \ 高相关，相关系数 $\\rho =0.65$。当我们加上独立同分布 (i.i.d) 从 $N(0, 1)$ 的误差项 `u` 时，我们可以得到包含 10,000\
  \ 个观测值的整个总体。DGM 加上误差项被称为 DGP。\n\n```r\nlibrary(MASS)\nN <- 10000\nx_2 <- sample(c(0,\
  \ 1), N, replace = TRUE) # 虚拟变量\n\n# mvrnorm() 创建相关变量的矩阵\nX_corr <-\n  mvrnorm(\n\
  \    N,\n    mu = c(0, 0),\n    Sigma = matrix(c(1, 0.65, 0.65, 1), ncol = 2),\n\
  \    empirical = TRUE\n  )\n\n# 检查它们的相关性\ncor(X_corr)\n```\n\n```\n      [,1] [,2]\n\
  [1,] 1.00 0.65\n[2,] 0.65 1.00\n```\n\n```r\n# 每列都是我们的变量之一\nx_3 <- X_corr[, 1]\n\
  x_5 <- X_corr[, 2]\n\n# 交互项\nx_23 <- x_2 * x_3\n\n# 现在是 DGM\nbeta <- c(12,-0.7,\
  \ 34,-0.17, 5.4)\ndgm <-\n  beta[1] + beta[2] * x_2 + beta[3] * x_3 + beta[4] *\
  \ x_23 + beta[5] * x_5\n\n# 我们的 Yi\ny <- dgm + rnorm(N, 0, 1)\npop <- data.frame(y,\
  \ x_2, x_3, x_23, x_5)\nstr(pop)\n```\n\n```\n## 'data.frame':    10000 obs. of\
  \  5 variables:\n  $ y   : num  -37.09 8.41 12.84 44.55 31.87 ...\n  $ x_2 : num\
  \  0 0 1 1 0 1 1 1 0 0 ...\n  $ x_3 : num  -1.3163 -0.1002 0.0558 0.7737 0.6297\
  \ ...\n  $ x_23: num  0 0 1 1 0 1 1 1 0 0 ...\n  $ x_5 : num  0.627 1.528 -0.889\
  \ -0.722 0.281 ...\n```\n\n生成了人工数据后，DGM 现在已知，整个总体是可以访问的。也就是说，我们可以在该总体的不同样本上测试许多模型，以查看它们的推断属性是否符合\
  \ DGM。下面将是几个例子。这里是我们的 DGM：$Y[i] = \\beta[1] + \\beta[2]X[2] + \\beta[3]X[3] + \\\
  beta[4]X[4] + \\beta[5]X[5]$，其系数向量 $\\beta = (12,-0.7, 34,-0.17, 5.4)$。此外，`x[2]`\
  \ 是取值为 0 和 1 的二元变量，`x[5]` 和 `x[3]` 高相关，相关系数 $\\rho =0.65$。当我们加上独立同分布 (i.i.d) 从 $N(0,\
  \ 1)$ 的误差项 `u` 时，我们可以得到包含 10,000 个观测值的整个总体。DGM 加上误差项被称为 DGP。\n\n```r\nlibrary(MASS)\n\
  N <- 10000\nx_2 <- sample(c(0, 1), N, replace = TRUE) # 虚拟变量\n\n# mvrnorm() 创建相关变量的矩阵\n\
  X_corr <-\n  mvrnorm(\n    N,\n    mu = c(0, 0),\n    Sigma = matrix(c(1, 0.65,\
  \ 0.65, 1), ncol = 2),\n    empirical = TRUE\n  )\n\n# 检查它们的相关性\ncor(X_corr)\n```\n\
  \n```\n      [,1] [,2]\n[1,] 1.00 0.65\n[2,] 0.65 1.00\n```\n\n```r\n# 每列都是我们的变量之一\n\
  x_3 <- X_corr[, 1]\nx_5 <- X_corr[, 2]\n\n# 交互项\nx_23 <- x_2 * x_3\n\n# 现在是 DGM\n\
  beta <- c(12,-0.7, 34,-0.17, 5.4)\ndgm <-\n  beta[1] + beta[2] * x_2 + beta[3] *\
  \ x_3 + beta[4] * x_23 + beta[5] * x_5\n\n# 我们的 Yi\ny <- dgm + rnorm(N, 0, 1)\n\
  pop <- data.frame(y, x_2, x_3, x_23, x_5)\nstr(pop)\n```\n\n```\n## 'data.frame':\
  \    10000 obs. of  5 variables:\n  $ y   : num  -37.09 8.41 12.84 44.55 31.87 ...\n\
  \  $ x_2 : num  0 0 1 1 0 1 1 1 0 0 ...\n  $ x_3 : num  -1.3163 -0.1002 0.0558 0.7737\
  \ 0.6297 ...\n  $ x_23: num  0 0 1 1 0 1 1 1 0 0 ...\n  $ x_5 : num  0.627 1.528\
  \ -0.889 -0.722 0.281 ...\n```\n\n```r\n# 这是一个新技巧，可以学习制作更好的表格 install.packages(\"\
  stargazer\")\nlibrary(stargazer)\nstargazer(\n  pop,\n  type = \"text\",\n  title\
  \ = \"Descriptive Statistics\",\n  digits = 1,\n  out = \"table1.text\"\n)\n```\n\
  \n```\n##\n## Descriptive Statistics\n## ============\n## Statistic   N    Mean\
