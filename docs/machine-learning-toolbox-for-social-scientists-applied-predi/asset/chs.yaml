  \\text{v}}\\left\\\\lbrack {y\\_{i}^{\\prime},\\\\hat{f}(x\\_{i})} \\\\right\\\\\
  rbrack + \\\\left( {\\\\text{E}\\\\left\\\\lbrack {y\\_{i}^{\\prime}} \\\\right\\\
  \\rbrack - \\\\text{E}\\\\left\\\\lbrack {\\\\hat{f}(x\\_{i})} \\\\right\\\\rbrack\
  \ \\\\right)^{2}} & \\\\end{array}$\n\n同样地，\n\n$\\\\begin{array}{rlr} {\\\\text{E}\\\
  left\\\\lbrack {(y\\_{i} - \\\\hat{f}(x\\_{i}))}^{2} \\\\right\\\\rbrack} & {= {\\\
