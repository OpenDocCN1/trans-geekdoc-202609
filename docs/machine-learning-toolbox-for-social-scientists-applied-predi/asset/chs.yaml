  \                1e-04         -0.2931            -1e-04         -0.2664\n## s.e.\
  \             1e-04          0.0641             1e-04          0.0603\n##      \
  \ lag(diffcases,5)  lag(diffmob,5)\n##                  3e-04         -0.4059\n\
  ## s.e.             1e-04          0.0588\n##\n## Residual covariance matrix:\n\
  ##           diffcases diffmob\n## diffcases  811.6771 -0.1648\n## diffmob     -0.1648\
  \  0.0033\n##\n## log likelihood = -853.64\n## AIC = 1755.28    AICc = 1760.38 \
  \ BIC = 1840.73\n```\n\n```r\nfit %>%\n  forecast(h = 14) %>%\n  autoplot(trdf[-c(1:200),\
  \ ])\n```\n\n![](img/Fig23_01.jpg)\n\n我们本应该对两个序列都进行 Box-Cox 变换，但我们在上面忽略了它。\n\n###\
  \ 23.2 直接预测的嵌入（Embedding for Direct Forecast）\n\n对于直接预测，我们需要重新排列数据，以便能够为 7 天中的每一天估计\
  \ 7 个预测模型。我们将使用 `embed()` 函数来展示针对 AR(3) 重新排列数据的含义：\n\n```r\nY <- 1:10\nY <- embed(Y,\
  \ 3)\ncolnames(Y) = c(\"Y(t)\", \"Y(t-1)\", \"Y(t-2)\")\nY\n```\n\n```r\n##    \
  \  Y(t) Y(t-1) Y(t-2)\n## [1,]    3      2      1\n## [2,]    4      3      2\n\
  ## [3,]    5      4      3\n## [4,]    6      5      4\n## [5,]    7      6    \
  \  5\n## [6,]    8      7      6\n## [7,]    9      8      7\n## [8,]   10     \
  \ 9      8\n```\n\n现在，关键点是每行之间没有时间依赖关系，因此在重构数据后打乱这些数据是允许的。让我们来看看这些模拟数据的一个 AR(1)\
  \ 示例：\n\n```r\n# 平稳数据 rho < 1 但 = 0.85\nn <- 10000\nrho <- 0.85\n\ny <- c(0, n)\n\
  set.seed(345)\neps <- rnorm(n, 0, 1)\n\nfor (j in 1:(n - 1)) {\n  y[j + 1] <- y[j]\
  \ * rho + eps[j]\n}\n\nylagged <- y[2:n]\n\npar(mfrow = c(1, 2))\nplot(ylagged,\n\
  \     y[1:(n - 1)],\n     col = \"lightpink\",\n     ylab = \"y\")\nplot(y[1:500],\n\
  \     type = \"l\",\n     col = \"red\",\n     ylab = \"y\",\n     xlab = \"t\"\
  )\n```\n\n![](img/Fig23_02.jpg)\n\n我们将使用嵌入后进行 AR(1) 估计：\n\n```r\nhead(y)\n```\n\n\
  ```r\n## [1] 0.000000 -0.784908 -0.946683 -0.966143 -1.111816\n```\n\n```r\ny_em\
  \ <- embed(y, 2)\ncolnames(y_em) <- c(\"yt\", \"yt_1\")\nhead(y_em)\n```\n\n```r\n\
  ##              yt       yt_1\n## [1,] -0.784908  0.000000\n## [2,] -0.946683 -0.784908\n\
  ## [3,] -0.966143 -0.946683\n## [4,] -1.111816 -0.966143\n## [5,] -1.012575 -1.111816\n\
  ## [6,] -1.494208 -1.012575\n```\n\n使用 OLS 估计 AR(1)：\n\n```r\ny_em <- as.data.frame(y_em)\n\
  ar1 <- lm(yt ~ yt_1 - 1, y_em)\n```\n\n```r\n## Call:\n## lm(formula = yt ~ yt_1\
  \ - 1, data = y_em)\n## Coefficients:\n##   yt_1\n```\n\n现在，让我们打乱 `y_em`：\n\n```r\n\
  # Shuffle\nind <- sample(nrow(y_em), nrow(y_em), replace = FALSE)\ny_em_sh <- y_em[ind,\
  \ ]\n\nar1 <- lm(yt ~ yt_1 - 1, y_em_sh)\n```\n\n```r\n## Call:\n## lm(formula =\
  \ yt ~ yt_1 - 1, data = y_em_sh)\n## Coefficients:\n##   yt_1\n```\n\n这种应用表明给定重排列数据的模型（AR）是正确指定的。这很重要，因为我们可以在时间序列数据上使用机器学习应用，如我们在下一章中看到的随机森林。这种重新排列也可以适用于多元集合：\n\
  \n```r\ntsdf <- matrix(c(1:10, 21:30), nrow = 10)\ncolnames(tsdf) <- c(\"Y\", \"\
  X\")\nfirst <- embed(tsdf, 3)\ncolnames(first) <- c(\"y(t)\", \"x(t)\", \"y(t-1)\"\
  , \"x(t-1)\", \"y(t-2)\", \"x(t-2)\")\nhead(first)\n```\n\n```r\n##      y(t) x(t)\
  \ y(t-1) x(t-1) y(t-2) x(t-2)\n## [1,]    3     11      2     21      1      20\n\
  ## [2,]    4     12      3     22      2      21\n## [3,]    5     13      4   \
  \  23      3      22\n## [4,]    6     14      5     24      4      23\n## [5,]\
  \    7     15      6     25      5      24\n## [6,]    8     16      7     26  \
  \    6      25\n```\n\n现在，我们需要针对三个跨度（horizon）拥有三个模型。以下是这些模型：\n\n$$\n\\begin{aligned}\n\
  \\hat{y}_{t + 1} = \\hat{\\alpha}_{0} + \\hat{\\alpha}_{1}y_{t} + \\hat{\\alpha}_{2}y_{t-1}\
  \ + \\hat{\\alpha}_{3}x_{t} + \\hat{\\alpha}_{4}x_{t-1} + \\hat{\\alpha}_{5}x_{t-2}\
  \ \\\\\n\\hat{y}_{t + 2} = \\hat{\\beta}_{0} + \\hat{\\beta}_{1}y_{t} + \\hat{\\\
  beta}_{2}y_{t-1} + \\hat{\\beta}_{3}x_{t} + \\hat{\\beta}_{4}x_{t-1} + \\hat{\\\
  beta}_{5}x_{t-2} \\\\\n\\hat{y}_{t + 3} = \\hat{\\omega}_{0} + \\hat{\\omega}_{1}y_{t}\
  \ + \\hat{\\omega}_{2}y_{t-1} + \\hat{\\omega}_{3}x_{t} + \\hat{\\omega}_{4}x_{t-1}\
  \ + \\hat{\\omega}_{5}x_{t-2}\n\\end{aligned}\n$$\n\n这些每个模型都需要不同的数据重新排列。以下是每个模型所需的排列：\n\
  \n```r\n##      y(t) x(t) y(t-1) x(t-1) y(t-2) x(t-2)\n## [1,]    3     11     \
  \ 2     21      1      20\n## [2,]    4     12      3     22      2      21\n##\
  \ [3,]    5     13      4     23      3      22\n## [4,]    6     14      5    \
  \ 24      4      23\n## [5,]    7     15      6     25      5      24\n## [6,] \
  \   8     16      7     26      6      25\n```\n\n我们已经为第一个模型重新排列了数据。如果我们删除 `y(t)`\
  \ 的第一行以及剩余集合的最后行，就可以得到第二个模型的数据：\n\n```r\ncbind(first[-1,1], first[-nrow(first),-1])\n\
  ```\n\n```r\n##      [,1] [,2] [,3] [,4] [,5] [,6]\n## [1,]    4     23      2 \
  \    22      1      21\n## [2,]    5     24      3     23      2      22\n## [3,]\
  \    6     25      4     24      3      23\n## [4,]    7     26      5     25  \
  \    4      24\n## [5,]    8     27      6     26      5      25\n## [6,]    9 \
  \    28      7     27      6      26\n```\n\n我们将使用我们的 COVID-19 数据和简单线性回归作为直接预测的示例：\n\
  \n```r\n# 准备数据\ndf <- data.frame(dcases = trdf$diffcases, dmob = trdf$diffmob)\n\
  df <- df[complete.cases(df),]\nrownames(df) <- NULL\ndf <- as.matrix(df)\nhead(df)\n\
  ```\n\n\n\n\n现在我们需要确定两个参数：窗口大小（window size），即每行包含多少个滞后项（lags）；以及我们要预测多少天。下一节将使用更高级的函数来重新排列数据，并应用随机森林进行直接预测。现在，让我们使用\
  \ 3 天窗口和 3 天的预测视野：\n\n```\nh = 3\nw = 3\nfh <- c() # 存储预测结果\n\n# 从第一个开始\ndt <- embed(df,\
  \ w)\ny <- dt[, 1]\nX <- dt[, -1]\n\nfor (i in 1:h) {\n  fit <- lm(y ~ X)\n  l <-\
  \ length(fit$fitted.values)\n  fh[i] <- fit$fitted.values[l]\n  y <- y[-1]\n  X\
  \ <- X[-nrow(X), ]\n}\n\nfh\n```\n\n```\n## [1]  10.288416 -11.587090   0.302522\n\
  ```\n\n```\nplot(1:266, trdf$diffcases, col = \"red\", type = \"l\")\nlines(267:269,\
  \ fh, col = \"blue\")\n```\n\n![](img/Fig23_03.jpg)\n\n我们上面还没有使用训练集和测试集。如果我们应用适当的划分，甚至可以将窗口大小设置为我们的超参数，以最小化预测误差：\n\
  \n```\n# 我们将最后 7 天设为测试集\ntrain <- df[1:258,]\ntest <- df[-c(1:258),]\n\nh = 7\n\
