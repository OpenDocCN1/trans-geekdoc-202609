  \ `Errors` 和 `Assists` 表现。\n\n```\n# Hitters data\nlibrary(ISLR)\nstr(Hitters)\n\
  ```\n'data.frame': 322 obs. of 20 variables:\n$ AtBat: int 293 344 1624 5628 396\
  \ 4408 214 509 341 ...\n$ Hits: int 66 835 457 1575 101 1333 ...\n$ HmRun: int 1\
