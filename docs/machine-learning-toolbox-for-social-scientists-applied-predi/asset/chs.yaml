  \n# 19 自适应 Lasso (Adaptive Lasso)\n\nDOI: [10.1201/9781003381501-25](https://doi.org/10.1201/9781003381501-25)\n\
  \n自适应 lasso 是回归分析中一种用于正则化和变量选择的方法，它由 Zou (2006) 在《自适应 Lasso 及其先知性质》一文中提出。在本文中，作者建议在目标函数中使用加权\
  \ `ℓ[1]` 惩罚项，并选择权重以适应数据的相关性结构。他证明了与使用简单 `ℓ[1]` 惩罚的标准 lasso 方法相比，该方法可以产生更稳定的模型，且系数为零的个数更少。\n\
  \n自引入以来，自适应 lasso 已广泛应用于统计建模和机器学习的各种应用中。它已被应用于基因组数据特征选择、高维回归以及广义线性模型模型选择等问题。在预测变量存在相关性且需要选择较小的重要变量子集纳入模型中的情况下，自适应\
  \ lasso 很有用。研究表明，自适应 lasso 是一个先知有效估计器（在变量选择上具有一致性，在系数估计上具有渐近正态性），而普通 lasso 则不是。\n\
  \n考虑线性回归模型：\n\n*y*[*i*] = *x*[*i*]^′*β* + *ϵ*[*i*], 　*i* = 1, …, *n*　　　*β* 是 (*p* × 1)\n\
  \n自适应 Lasso 通过最小化以下函数估计 *β*：\n\n$L(\\beta) = \\underset{i = 1}{\\overset{n}{\\Sigma}}\\\
  left( y_{i} - x_{i}^{\\prime}\\beta \\right)^{2} + \\lambda_{n}\\underset{j = 1}{\\\
  overset{p}{\\Sigma}}\\frac{1}{w_{j}}\\left| \\beta_{j} \\right|$\n\n其中通常 *w*[*j*] = (|*β̂*[*OLS*[*j*]]|)^(*γ*)\
  \ 或 *w*[*j*] = (|*β̂*[*Ridge*[*j*]]|)^(*γ*)，其中 *γ* 是用于调整自适应权重向量的正常数，建议的可能值为 0.5、1\
  \ 和 2。\n\n自适应 lasso (AL) 中的权重提供了关于变量的先验“智能”，使得在普通 Lasso 平等地惩罚所有参数时，自适应 Lasso 更有可能对非零系数的惩罚小于零系数。这是因为权重可以从一致的最小二法估计量获得。如果\
  \ *β*[*AL*[,j]* = 0，那么 *β̂*[*OLS*,j] 可能接近于零，导致一个非常小的 `w[j]`。因此，真正的零系数会受到很大的惩罚。计算自适应\
  \ lasso 中的权重需要两步走程序。\n\n以下是一个我们使用岭回归权重（ridge weight）的示例：\n\n```\nlibrary(ISLR)\n\
  library(glmnet)\n\nremove(ls())\n\ndata(Hitters)\ndf <- Hitters[complete.cases(Hitters$Salary),]\n\
  X <- model.matrix(df)[,-1]\ny <- df$Salary\n\n# gamma = 1 的岭权重\ng = 1\nset.seed(1)\n\
  modelr <- cv.glmnet(X, y, alpha = 0)\ncoefr <- as.matrix(coef(modelr, s = modelr$lambda.min))\n\
  w.r <- 1/(abs(coefr[-1,]))^g\n\n## Adaptive Lasso\nset.seed(1)\nalasso <- cv.glmnet(X,\
  \ y, alpha=1, penalty.factor = w.r)\n\n## Lasso\nset.seed(1)\nlasso <- cv.glmnet(X,\
  \ y, alpha=1)\n\n# 稀疏性\ncbind(LASSO = coef(lasso, s=\"lambda.1se\"),\n     ALASSO\
  \ = coef(alasso, s=\"lambda.1se\"))\n```\n\n```\n## 20 x 2 稀疏矩阵类 \"dgMatrix\"\n\
  \                     s1          s1\n(Intercept) 127.95694754   -7.109481\nAtBat\
  \         .\nHits          1.42342566    2.054867\nHmRun         .\nRuns       \
  \   .\nRBI           .\nWalks         1.5821411    3.573120\nYears            31.57334\n\
  ```\n\n在自适应 lasso (AL) 中的权重提供了关于变量的先验“智能”，使得在普通 Lasso 平等地惩罚所有参数时，自适应 Lasso 更有可能对非零系数的惩罚小于零系数。这是因为权重可以从一致的最小二法估计量获得。如果\
  \ *β*[*AL*[,j]* = 0，那么 *β̂*[*OLS*,j] 可能接近于零，导致一个非常小的 `w[j]`。因此，真正的零系数会受到很大的惩罚。计算自适应\
  \ lasso 中的权重需要两步走程序。\n\n这里是一个我们使用岭回归权重的示例：\n\n```\nlibrary(ISLR)\nlibrary(glmnet)\n\
  \nremove(ls())\n\ndata(Hitters)\ndf <- Hitters[complete.cases(Hitters$Salary),]\n\
  X <- model.matrix(df)[,-1]\ny <- df$Salary\n\n# gamma = 1 的岭权重\ng = 1\nset.seed(1)\n\
  modelr <- cv.glmnet(X, y, alpha = 0)\ncoefr <- as.matrix(coef(modelr, s = modelr$lambda.min))\n\
  w.r <- 1/(abs(coefr[-1,]))^g\n\n## Adaptive Lasso\nset.seed(1)\nalasso <- cv.glmnet(X,\
  \ y, alpha=1, penalty.factor = w.r)\n\n## Lasso\nset.seed(1)\nlasso <- cv.glmnet(X,\
  \ y, alpha=1)\n\n# 稀疏性\ncbind(LASSO = coef(lasso, s=\"lambda.1se\"),\n     ALASSO\
  \ = coef(alasso, s=\"lambda.1se\"))\n```\n\n```\n## 20 x 2 稀疏矩阵类 \"dgMatrix\"\n\
  \                     s1          s1\n(Intercept) 127.95694754   -7.109481\nAtBat\
