  \ \\left( y\\_{1} - \\hat{f}\\left( x\\_{1} \\right) \\right)^{2} & \\left( y\\\
  _{2} - \\hat{f}\\left( x\\_{2} \\right) \\right)^{2} & {\\cdots\\\\,} & \\left(\
