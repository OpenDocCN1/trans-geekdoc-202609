  \ 500 个 $\\hat{\\beta_{3}}$。其平均值为 37.47。如果我们对一个设定正确的模型进行相同的模拟，你会发现 500 个 $\\hat{\\\
  beta_{3}}$ 的平均值是 34，这是我们 DGM 中正确的“真实”系数。\n\n```r\nn.sims <- 500\nn <- 500 #样本量\n\
  beta_3 <- c(NA, n.sims)\nfor (i in 1:n.sims) {\n  sample <- pop[sample(nrow(pop),\
  \ n, replace = FALSE),]\n  model_good <- lm(y ~ x_2 + x_3 + x_23 + x_5, data = sample)\n\
  \  beta_3[i] <- model_good$coefficients[\"x_3\"]\n}\nsummary(beta_3)\n```\n\n```r\n\
  ##   33.81   33.96   34.02   34.01   34.06```\n\n## 36.5 Bootstrapping (自助法)\n\n\
  自助法是一种有放回的重复抽样过程（样本中的每个值被选中的概率相等），重复成百或上千次，就可以估计底层分布均值的精确/准确的不确定性（置信区间），而不是直接计算标准误。通常，自助法遵循以下基本步骤：\n\
  \n- 多次对给定集合进行采样\n- 计算特定的统计量\n- 找到该分布的标准差\n\n在下面的自助示例中，我们想要获得均值的标准误。我们将结合 `sample`\
  \ 函数使用 `lapply()` 和 `sapply()`。请参见 [`stats.ucla.edu/r/introduction-to-bootstrap`](https://stats.ucla.edu/r/introduction-to-bootstrap)\n\
  \n```r\n# 从均值为 5、标准差为 3 的正态分布中创建 100 个观测值\nset.seed(123)\ndata <- rnorm(100, 5,\
  \ 3)\n```\n\n```r\n# 获取 20 个自助样本并存储在列表中\nresamples <- lapply(1:20, function(i)\n\
  \  sample(data, 100, replace = TRUE))\n```\n\n这是另一种实现相同的方法：\n\n```r\nresamples_2\
  \ <- matrix(NA, nrow = 100, ncol = 20)\nfor (i in 1:20) {\n  resamples_2[, i] <-\
  \ sample(data, 100, replace = TRUE)\n}\n```\n\n```r\n# 显示第一个自助样本\nresamples_2[,\
  \ 1]\n```\n\n\n\n\n\n```\n## [1]  8.76144476  3.11628177  4.02220524 10.36073941\
