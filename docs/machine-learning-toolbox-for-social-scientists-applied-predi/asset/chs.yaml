  \n### outer()\n\n`outer()` 两个向量和一个函数（该函数本身接受两个参数），通过为两个向量元素的每种组合调用该函数来构建一个 `matrix`。\n\
  \n```r\nx <- c(0, 1, 2)\ny <- c(0, 1, 2, 3, 4)\n\nm <- outer (y,     # 第一维度：列 (y)\n\
  \            x,     # 第二维度：行 (x)\n            function (x, y)\n              x +\
  \ 2 * y)\n\nm\n```\n\n```r\n##      [,1] [,2] [,3]\n## [1,]    0    2    4\n## [2,]\
