    # # Computational Catalysis and Machine Learning Applications to Water Treatment
    Technologies


    ¹Duo Wang, ²Ao Xie, ¹Shengcun Ma, ¹Wei Tong, ²Shiqiang Zou, ¹Anubhav Jain*


