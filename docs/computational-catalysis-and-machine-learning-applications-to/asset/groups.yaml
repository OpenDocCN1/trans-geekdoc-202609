    # 计算催化和机器学习在水处理技术中的应用


    ¹Duo Wang, ²Ao Xie, ¹Shengcun Ma, ¹Wei Tong, ²Shiqiang Zou, ¹Anubhav Jain*


    ¹ 劳伦斯伯克利国家实验室，储能与分布式资源部门，加州伯克利，94720 美国


    ² 奥本大学，土木与环境工程系，阿拉巴马州奥本，36849 美国


    * 通讯作者：ajain@lbl.gov


    ## 1. 摘要


    电催化可以为水处理提供新途径。例如，电还原是一种新兴的用于处理水中受关注含氧阴离子的技术。然而，识别高性能、成本效益高的催化剂仍然是规模化部署的主要障碍。本文讨论了计算建模和机器学习如何加速新型催化剂材料的搜索。文章描述了传统计算化学工作流程（其基本形式已应用至少二十年）如何通过新开发的、基于数百万个示例训练的机器学习力场在广度和深度上得到扩展。文章还讨论了理论和机器学习流程如何有效地与实验合成和表征平台集成，以快速识别和验证新的催化剂化学体系。


    ## 2. 电催化在水净化中的引言与机遇


    确保全球获得清洁用水是21世纪的重大挑战，需要新的水处理工艺。随着太阳能和风能等分布式可再生电源的迅速部署，有机会开发同样电气化、模块化和分布式的新型经济高效水处理工艺。


    电气化水净化利用电能作为热力学驱动力，高效地从水中分离和转化受关注物质[1]。与传统物理化学水处理相比，电气化技术需要最少的化学药剂投入和后处理管理，从而降低运营成本和二次污染[2]。


    电气化净化方法可以利用非法拉第和法拉第机制。基于非法拉第机制（*即*，无电荷转移）的工艺，如电吸附和电迁移，包括电渗析（ED）、电去离子（EDI）和电容去离子（CDI）等技术。这些工艺利用电场分离受关注物质，广泛应用于海水淡化和生产高品质水[3]。非法拉第水处理技术通常在较低的系统电压（<
    1.2 V）[4]下运行，从而实现具有竞争力的能耗（低至0.1 kWh m<sup>-3</sup>水）[5]。


    相比之下，以法拉第（*即*，电荷转移）机制为中心的电气化水处理工艺，如电还原和电氧化，通过氧化还原反应在将受关注物质转化为危害较小、更有价值或可分离形态方面发挥着关键作用。这些工艺包括电解、电镀、电絮凝和电气浮，它们在有机污染物降解、重金属沉淀和悬浮颗粒去除中至关重要[1]。已有公司推出模块化紧凑型电絮凝系统，为工业废水处理提供经济高效的解决方案，以去除浊度、金属、油类、细菌等[6]。与非法拉第处理工艺相比，法拉第技术在更宽的电压范围（最高4.0
    V）[7]内运行，导致能量输入显著高于热力学预测值，有时比非法拉第工艺高出两个数量级[8]。


    ![](img/014ef96b5af82ce5366758d3f37bbd9a_3_0.png)


    图1：实现电催化水处理面临的挑战，包括材料（本文重点）、电极和反应器设计。所用缩略词：WE（工作电极）、RE（参比电极）和CE（对电极）。


    ## 3. 催化剂的理论筛选：当前实践与局限


    理论筛选技术在催化剂设计中的应用已发展了数十年，从析氢/析氧反应、硝酸盐还原到甲烷/乙醇生成等多个类别不断扩展[12-15]。这些广泛应用凸显了计算技术（通常基于密度泛函理论，即DFT计算）在虚拟催化剂识别方面的能力[16]。


    DFT计算在原子尺度上模拟反应；所得计算反应参数（*例如*，热力学驱动力、活化能）可通过微观动力学建模技术映射到宏观催化剂性能。建模的总体目标是快速模拟哪些材料（*即*，化学组成、表面结构）能够促进所需的表面反应，同时避免任何非预期的副反应。在模拟中表现优异的材料将被优先用于实验研究。


    要进行计算催化设计，第一步是确定所需电催化过程的相关表面反应序列。接下来，计算催化剂设计的基本步骤在**图2**中概述。首先，针对目标表面和反应物种计算吸附能和反应势垒（**图2a**）。一般来说，根据萨巴捷原理，反应物在催化剂表面的吸附能既不应太弱也不应太强；最高催化活性往往出现在吸附能接近零时[15,
    17]，这反映在所谓的“火山型曲线”中，该曲线显示催化活性随吸附强度的变化呈现出明显的峰值。这种平衡直接影响反应路径步骤的活化能[18]，可通过DFT计算中的爬坡弹性带（NEB）方法精确计算（**图2b**）。


    其他因素如pH、施加电位和表面覆盖度也会显著影响催化效率[18]。这些效应可以纳入DFT计算，并作为微观动力学建模[19]技术的输入，利用微观信息得出宏观反应速率（**图2d**）。在将微观参数与宏观性能的关联绘制出来后，最有前景的催化剂组成和表面


    ![](img/014ef96b5af82ce5366758d3f37bbd9a_6_0.png)


    图2：计算催化的典型工作流程。(a) 必须评估的单一材料表面上的潜在吸附位点；(b) 活化能建模；(c) 建立比例关系以降低高通量筛选中的计算复杂度；(d)
    硝酸盐去除的活性火山型曲线（图引自文献[14]）；以及(e) 从数据库进行筛选的工作流程（图引自文献[14]）。版权所有 2022 AIP Publishing。


    ## 4. 机器学习扩展能力的机遇


    机器学习正在迅速改变包括计算催化在内的许多研究领域。如今，基于历史计算数据库训练的机器学习模型计算吸附能的速度比同等密度泛函理论过程快3个数量级，同时保持合理的精度[21]。因此，机器学习模型的存在创造了许多新的机会，以扩大计算筛选在催化剂识别中的范围。事实上，这种转变已经开始[22]，并且许多可能性的要素正在实践中得到应用[14]。


    ![](img/014ef96b5af82ce5366758d3f37bbd9a_7_0.png)


    图3：机器学习势函数的发展可以改进计算筛选工作流程的3个领域示意图。


    当今最先进的机器学习势通常采用图神经网络的形式[23]，其中所提出材料的原子表示为节点，相邻原子通过边连接。通过神经网络的连续层，原子通过其边相互作用以更新其属性。例如，与氧原子相邻的原子可能接收到与钯原子相邻的原子不同的更新。随着通过更多层施加更多更新，原子与其邻居之间的更长程相互作用被捕获。在该过程结束时，对构型的总能量进行预测。


    '
