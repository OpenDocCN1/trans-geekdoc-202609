    \ Goldsmith，电催化在水污染物修复中的作用，ACS Catalysis 10 (2020) 3365–3371。https://doi.org/10.1021/acscatal.9b04167。\n\
    - [12] J. Greeley, M. Mavrikakis，基于第一性原理设计的合金催化剂，Nat Mater 3 (2004) 810-5。[https://doi.org/10.1038/nmat1223](https://doi.org/10.1038/nmat1223)。\n\
    - *[13] J. Greeley，理论多相催化：比例关系与计算催化剂设计，Annu Rev Chem Biomol Eng 7 (2016) 605-35。[https://doi.org/10.1146/annurev-chembioeng-080615-034413](https://doi.org/10.1146/annurev-chembioeng-080615-034413)。\n\
    \  **该工作综述了表面与催化 DFT 研究中所使用的比例关系。该综述涵盖了从纯金属到金属氧化物表面的各种结构，涉及多个类别的分子。**\n- *[14]\
    \ R. Tran, D. Wang, R. Kingsbury, A. Palizhati, K.A. Persson, A. Jain, Z.W. Ulissi，利用机器学习筛选用于水净化的双金属电催化剂，J\
    \ Chem Phys 157 (2022) 074102。[https://doi.org/10.1063/5.0092948](https://doi.org/10.1063/5.0092948)。\n\
    \  **作者将机器学习与基于计算的筛选策略相结合，成功从 59,390 种双金属电催化剂中识别出 20 种用于 NO₃⁻ 转化的经济高效材料。**\n-\
    \ *[15] J.X. Liu, D. Richards, N. Singh, B.R. Goldsmith，过渡金属上电催化硝酸盐还原的活性与选择性趋势，ACS\
    \ Catalysis 9 (2019) 7052-7064。[https://doi.org/10.1021/acscatal.9b02179](https://doi.org/10.1021/acscatal.9b02179)。\n\
    \  **该工作系统展示了利用 DFT 计算建立能量比例关系和 BEP 关系的综合研究，旨在对催化剂材料进行高通量预测，并进行了进一步的实验验证。**\n"
