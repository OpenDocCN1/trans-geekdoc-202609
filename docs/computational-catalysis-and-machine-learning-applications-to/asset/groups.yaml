    # Computational Catalysis and Machine Learning Applications to Water Treatment
    Technologies


    ¹Duo Wang, ²Ao Xie, ¹Shengcun Ma, ¹Wei Tong, ²Shiqiang Zou, ¹Anubhav Jain*


    ¹ Energy Storage and Distributed Resources Division, Lawrence Berkeley National
    Laboratory, Berkeley, California, 94720 USA


    ² Department of Civil and Environmental Engineering, Auburn University, Auburn,
    Alabama, 36849 USA


    * Corresponding author: ajain@lbl.gov


    ## 1. Abstract


    Electrocatalysis can offer new routes to water treatment. For example, electroreductive
    reduction is an emerging technology for treating oxyanions of concern in water.
    However, identification of highly performant, cost-effective catalysts remains
    a major barrier to deployment at scale. This article discusses how computational
    modeling and machine learning can accelerate the search for new catalyst materials.
    It describes how traditional computational chemistry workflows, now deployed in
    their basic form for at least two decades, can be expanded in breadth and depth
    through newly developed machine-learned force fields that have been trained on
    millions of examples. It also discusses how the theory and machine learning pipeline
    can effectively integrate with experimental synthesis and characterization platforms
    to rapidly identify and validate new catalyst chemistries.


    ## 2. Introduction and opportunities for electrocatalysis in water purification


    Ensuring global access to clean water represents a major challenge for the 21st
    century that requires new water treatment processes. With the rapidly increasing
    deployment of distributed renewable electricity sources such as solar and wind
    power, an opportunity exists to develop new cost-effective water treatment processes
    that are similarly electrified, modular, and distributed.


    Electrified water purification harnesses electricity as the thermodynamic driving
    force to efficiently separate and transform substances of concern from water[1].
    Compared to traditional physicochemical water treatment, electrified technologies
    demand minimal chemical inputs and post-treatment management, thereby reducing
    operational costs and secondary pollution[2].


    Electrified purification methods can utilize both non-Faradaic and Faradaic mechanisms.
    Processes based on non-Faradaic mechanisms (*i.e.*, without charge transfer),
    such as electrosorption and electromigration, include techniques such as electrodialysis
    (ED), electrodeionization (EDI), and capacitive deionization (CDI). These processes
    leverage electric fields to separate substances of concern and find widespread
    application in desalination and producing high-quality water[3]. Non-Faradaic
    water treatment technologies typically operate at lower system voltages (< 1.2
    V)[4], resulting in competitive energy consumption (as low as 0.1 kWh m<sup>-3</sup>
    water)[5].


    In contrast, electrified water treatment processes centered on Faradaic (*i.e.*,
    charge transfer) mechanisms, such as electroreduction and electrooxidation, play
    a crucial role in transforming substances of concern into less harmful, more valuable,
    or separable forms through redox reactions. These processes include electrolysis,
    electroplating, electrocoagulation, and electroflotation, which are pivotal in
    the degradation of organic pollutants, precipitation of heavy metals, and removal
    of suspended particles[1]. Companies have introduced modular and compact electrocoagulation
    systems that offer cost-effective industrial wastewater treatment to remove turbidity,
    metals, oils, bacteria, etc.[6]. Compared to non-Faradaic treatment processes,
    Faradaic technologies operate within a broader voltage range (up to 4.0 V)[7],
    resulting in a significantly higher energy input than what is predicted by thermodynamics,
    sometimes reaching up to two orders of magnitude higher than non-Faradaic processes[8].


    ![](img/014ef96b5af82ce5366758d3f37bbd9a_3_0.png)


    Figure 1: Challenges in realizing electrocatalytic water treatment, including
    materials (the focus of this article), electrodes, and reactor design. Acronyms
    used are WE (working electrode), RE (reference electrode), and CE (counter electrode).


    ## 3. Theoretical screening of catalysts: current practice and limitations


    The application of theoretical screening techniques in catalyst design has evolved
    over multiple decades, expanding across various categories from hydrogen/oxygen
    evolution reactions, nitrate reduction, to methane/ethanol generation[12-15].
    These broad applications highlight the capability of computational techniques
    (typically based on density functional theory, or DFT, calculations) in virtual
    catalyst identification[16].


    DFT calculations model reactions at the atomic scale; the resulting calculated
    reaction parameters (*e.g.*, thermodynamic driving force, activation energy) can
    be mapped to macroscopic catalyst performance through microkinetic modeling techniques.
    The overall aim of the modeling is to rapidly simulate which materials (*i.e.*,
    chemical compositions, surface structures) facilitate the desired surface reactions
    while avoiding any unintended side reactions. Materials with promising performance
    in the simulations are prioritized for experimental investigation.


    To perform computational catalysis design, the first step is to determine the
    relevant sequence of surface reactions for a desired electrocatalytic process.
    Following this, the basic steps of computational catalyst design are outlined
    in **Figure 2**. First, adsorption energies and reaction barriers are calculated
    for the targeted surface and reaction species (**Figure 2a**). In general, according
    to the Sabatier principle, the adsorption energies of reactants on the catalyst
    surface should neither be too weak nor too strong; the highest catalytic activity
    tends to occur at adsorption energies close to zero[15, 17] as reflected in so-called
    "volcano plots" that show clear peaks in catalytic activity as a function of adsorption
    strength. This balance directly influences the activation energies[18] of reaction
    pathway steps, which can be precisely calculated using the nudged elastic band
    (NEB) method within DFT calculations (**Figure 2b**).


    Other factors such as pH, applied potential, and surface coverage can significantly
    impact catalytic efficiency[18]. Such effects can be incorporated into the DFT
    calculations and used as inputs for microkinetic modeling[19] techniques that
    use the microscopic information to yield macroscopic reaction rates (**Figure
    2d**). With the connection between microscopic parameters and macroscopic performance
    mapped out, the most promising catalyst compositions and surface


    ![](img/014ef96b5af82ce5366758d3f37bbd9a_6_0.png)


    Figure 2: Typical workflow for computational catalysis. (a) Potential adsorption
    sites on a single materials surface that must be evaluated; (b) activation energy
    modeling; (c) development of scaling relationships to reduce the complexity of
    calculations in high-throughput screening; (d) the volcano plot of activity for
    nitrate removal (figure is obtained from Ref. [14]); and (e) the screening workflow
    from databases (figure is obtained from Ref. [14]). Copyright 2022 AIP Publishing.


    ## 4. Opportunities for machine learning to expand capabilities


    Machine learning is rapidly transforming many research areas including computational
    catalysis. Today, machine learning models trained on historical databases of computations
    can calculate adsorption energies 3 orders of magnitude faster than the equivalent
    density functional theory procedure while retaining reasonable accuracy[21]. The
    existence of ML models therefore creates many new opportunities to expand the
    scope of computational screening in catalyst identification. Indeed, this transformation
    is already underway[22] and elements of what is possible are being employed in
    practice[14].


    ![](img/014ef96b5af82ce5366758d3f37bbd9a_7_0.png)


    Figure 3: Illustration of 3 areas in which the development of machine learning
    potentials can improve computational screening workflows.


    Today''s state-of-the-art machine-learned potentials typically take the form of
    graph neural networks[23], in which atoms of the proposed material are represented
    as nodes and neighboring atoms are connected by edges. Through successive layers
    of a neural network, atoms interact with one another through their edges to update
    their properties. For example, an atom neighboring an oxygen atom may receive
    a different update than an atom neighboring a palladium atom. As more updates
    are applied via additional layers, longer range interactions between atoms and
    their neighbors are captured. At the end of the process, a prediction is made
    regarding the total energy of the configuration.

