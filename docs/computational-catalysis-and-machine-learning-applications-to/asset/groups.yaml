  md: "\nDeveloping accurate and transferable machine learning potentials requires\
    \ large training data sets from which the neural networks can learn patterns.\
    \ The largest such data sets today originate from the Open Catalyst Project (OCP)\
    \ (https://opencatalystproject.org). The latest version as of this writing, OC22[24],\
    \ consists of >62,000 DFT relaxation trajectories made up of nearly 10 million\
    \ single point calculations that can be used for training. This massive investment\
    \ of both computer time and researcher labor has enabled the ability to train\
    \ machine learned potentials with MAEs as low as 0.18 eV as compared to DFT[21].\
    \ This makes them sufficient as a \"drop-in\" replacement for DFT for many practical\
    \ screening purposes. However, as outlined in **Figure 3**, many other opportunities\
    \ exist[25] for applying these machine-learned models.\n\nA first opportunity\
    \ is to automatically map the reaction pathways for a desired overall reaction.\
    \ Currently, a proposed reaction pathway (*i.e.*, the sequence of intermediates\
    \ that are formed as various oxidation and reduction reactions occur on a surface)\
    \ must be mapped in advance to define the calculations that need to be performed.\
    \ Establishing a reaction pathway can require a mix of expert knowledge, comprehensive\
    \ characterization, and calculated tests of hypotheses. Furthermore, such pathways\
    \ may change depending on environment and applied conditions (pH, voltage). Moving\
    \ forward, machine learning could be applied to automatically enumerate possible\
    \ reaction pathways and automatically determine thermodynamically favorable pathways\
    \ via chemical reaction networks[26] or other techniques. Using ML to enumerate\
    \ and rank possibilities would reduce the need for upfront chemical intuition\
    \ to solve a catalysis problem. However, a major limitation to this vision today\
    \ is determining the activation energies of the reactions; data points on activation\
    \ energies are limited to a few thousand at best. It is possible that more universal\
    \ ML models, trained further out of equilibrium and near transition state structures\
    \ using expanded data sets, will help remove this limitation in the future.\n\n\
    A second opportunity for applying ML is to increase accuracy in traditional workflows.\
    \ As described previously, standard computational screening workflows often skip\
    \ explicit DFT calculations in favor of simplifications such as scaling relationships\
    \ to model adsorption energies and BEP relationships to model reaction kinetics.\
    \ Unlike DFT calculations, these simplifications enforce rigid relationships between\
    \ simple descriptors and more complex properties, making it difficult to identify\
    \ the subset of materials that do not follow the usual trends. Indeed, materials\
    \ whose behavior is not adequately described by fitted descriptor relationships\
    \ may often be the most interesting for catalysis. Machine learning models may\
    \ make it possible to remove the use of scaling relationships altogether, replacing\
    \ them with ML predictions that better model the complex behavior of catalyst\
    \ materials.\n\nA third opportunity is to extend the complexity and depth of what\
    \ is calculated. Typically, many aspects of catalytic materials that are possible\
    \ to calculate are nevertheless skipped due to computational cost and researcher\
    \ time. This includes calculating Wulff shapes and dominant surfaces (including\
    \ the effect of high index surfaces), calculating performance as a function of\
    \ surface coverage, and calculating side reactions with other species. Machine\
    \ learning potentials offer the opportunity to calculate such behavior on a more\
    \ regular basis and for more candidates.\n\nNevertheless, despite the promise\
    \ afforded by deep learning and neural networks in computational chemistry, challenges\
    \ remain. Universal ML models still struggle with nonuniform errors (depending\
    \ on adsorbate and surface chemistry) as well as difficulty generalizing out of\
