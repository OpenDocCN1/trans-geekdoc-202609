  mdcn: "\n开发准确且可迁移的机器学习势函数需要大规模的训练数据集，以便神经网络从中学习模式。目前最大的此类数据集来自开放催化剂项目（OCP）（https://opencatalystproject.org）。截至撰写本文时的最新版本\
    \ OC22[24]，包含超过 62,000 条 DFT 弛豫轨迹，由近 1,000 万次单点计算组成，可用于训练。如此巨大的计算时间和研究人员投入，使得训练出的机器学习势函数与\
    \ DFT[21] 相比，平均绝对误差（MAE）可低至 0.18 eV。这使其足以在许多实际筛选场景中作为 DFT 的“直接替代”方案。然而，如**图 3**\
    \ 所概述，应用这些机器学习模型还存在许多其他机会[25]。\n\n第一个机会是自动映射目标总反应的反应路径。目前，拟议的反应路径（*即*，在表面发生各种氧化和还原反应时形成的中间体序列）必须预先映射，以确定需要执行的计算。建立反应路径可能需要结合专家知识、全面表征以及对假设的计算检验。此外，此类路径可能随环境和施加条件（pH、电压）的变化而改变。展望未来，机器学习可用于自动枚举可能的反应路径，并通过化学反应网络[26]或其他技术自动确定热力学上有利的路径。利用机器学习枚举各种可能性并排序，将减少解决催化问题时对前期化学直觉的需求。然而，目前这一愿景的主要限制在于确定反应的活化能；活化能的数据点最多只有数千个。未来，利用扩展数据集在更远离平衡态和更接近过渡态结构处训练的更具通用性的机器学习模型，可能有助于消除这一限制。\n\
    \n应用机器学习的第二个机会是提高传统工作流程的准确性。如前所述，标准的计算筛选工作流程通常跳过显式的 DFT 计算，转而采用简化方法，例如用比例关系模拟吸附能，用\
    \ BEP 关系模拟反应动力学。与 DFT 计算不同，这些简化方法在简单描述符与更复杂的性质之间强加了刚性关系，使得识别不遵循通常趋势的那部分材料变得困难。事实上，行为无法被拟合的描述符关系充分描述的材料，往往可能正是对催化而言最有趣的材料。机器学习模型可能使完全摒弃比例关系成为可能，取而代之的是能更好地模拟催化剂材料复杂行为的机器学习预测。\n\
    \n第三个机会是扩展所计算内容的复杂度和深度。通常，催化材料许多本可计算的方面仍因计算成本和研究人员时间而被跳过。这包括计算 Wulff 形貌和主导表面（包括高指数表面的影响）、计算性能随表面覆盖度的变化，以及计算与其他物种的副反应。机器学习势函数为更常规地计算此类行为以及为更多候选材料进行计算提供了机会。\n\
    \n然而，尽管深度学习和神经网络在计算化学中展现了广阔前景，挑战依然存在。通用机器学习模型仍然难以应对非均匀误差（取决于吸附质和表面化学），并且在分布外泛化方面存在困难[27]。改进模型可能需要更多的训练数据以及对模型架构的潜在调整。此外，模型解释对最先进的模型而言仍是一个挑战。尽管目前已经能进行有限的解释[28]，但当今的机器学习模型在很大程度上仍是“黑箱”。提升模型的可解释性可能有助于\n\
    \n- [5] L. Gurreri, A. Tamburini, A. Cipollina, G. Micale，用于环境保护和资源回收的电渗析废水处理应用：进展与前景的系统综述，Membranes\
