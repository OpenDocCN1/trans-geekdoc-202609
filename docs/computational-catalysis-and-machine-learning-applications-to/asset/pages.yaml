- pgno: 4
  md: 'capability of computational techniques (typically based on density functional
    theory, or DFT, calculations) in virtual catalyst identification[16].


    DFT calculations model reactions at the atomic scale; the resulting calculated
    reaction parameters (*e.g.*, thermodynamic driving force, activation energy) can
    be mapped to macroscopic catalyst performance through microkinetic modeling techniques.
    The overall aim of the modeling is to rapidly simulate which materials (*i.e.*,
    chemical compositions, surface structures) facilitate the desired surface reactions
    while avoiding any unintended side reactions. Materials with promising performance
    in the simulations are prioritized for experimental investigation.


    To perform computational catalysis design, the first step is to determine the
    relevant sequence of surface reactions for a desired electrocatalytic process.
    Following this, the basic steps of computational catalyst design are outlined
    in **Figure 2**. First, adsorption energies and reaction barriers are calculated
    for the targeted surface and reaction species (**Figure 2a**). In general, according
    to the Sabatier principle, the adsorption energies of reactants on the catalyst
    surface should neither be too weak nor too strong; the highest catalytic activity
    tends to occur at adsorption energies close to zero[15, 17] as reflected in so-called
    "volcano plots" that show clear peaks in catalytic activity as a function of adsorption
    strength. This balance directly influences the activation energies[18] of reaction
    pathway steps, which can be precisely calculated using the nudged elastic band
    (NEB) method within DFT calculations (**Figure 2b**).


    Other factors such as pH, applied potential, and surface coverage can significantly
    impact catalytic efficiency[18]. Such effects can be incorporated into the DFT
    calculations and used as inputs for microkinetic modeling[19] techniques that
    use the microscopic information to yield macroscopic reaction rates (**Figure
    2d**). With the connection between microscopic parameters and macroscopic performance
    mapped out, the most promising catalyst compositions and surface'
