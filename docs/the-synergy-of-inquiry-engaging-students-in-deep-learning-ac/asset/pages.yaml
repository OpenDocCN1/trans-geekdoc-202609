- pgno: 59
  md: 'In many inner-city schools and some rural areas, significant numbers of students
    have needs that are not fulfilled. In these situations, school practices need
    to be modified to fulfill student needs. Doing remedial and low level work is
    not the answer to this situation. If a school is not as successful as it would
    like to be, a change in the way students are engaged needs to occur. Human brains
    are designed to learn and do so efficiently. We need to utilize inquiry teaching,
    analogous interrelationship role-plays, project-based learning, internships, and
    other ways that will engage students in learning that stimulates their basal centers,
    the pleasure centers of their brains. These approaches are addressed in more detail
    in Chapter 5.


    # ## Conclusion


    Although the preceding examples of inquiry teaching in various disciplines may
    sound intriguing, perhaps even exciting, some of you may be getting a little nervous
    about the approach. Does it seem to reverse the order in which you do things?
    Does it modify the role you currently play in your classroom? Is there evidence
    from research studies that demonstrates that students learn more deeply in inquiry-teaching
    classrooms? Throughout this book you will hear from classroom teachers and principals
    about their experiences with inquiry teaching. Practical experience was combined
    with evidence from research because both are important.


    Take a moment to briefly address this issue of effectiveness now. “Decades of
    research illustrate the benefits of inquiry-based and cooperative learning to
    help students develop the knowledge and skills necessary to be successful in a
    rapidly-changing world” (Barron and Darling-Hammond et al. 2008, 2). A good place
    to start looking at the literature about inquiry teaching is in another, more
    comprehensive book edited by Linda Darling-Hammond et al. (2008) reviewing the
    research on inquiry teaching. Furthermore, the bonus chapter on the Digital Resource
    CD will further enrich the understanding that you have begun in this chapter by
    comparing the inquiry teaching process with what we know from current neurobiology
    about the processes by which the human brain learns. As this understanding of
    brain structures and function related to cognition and emotion matches this inquiry-learning
    format of engaging learners, it makes for a compelling argument for educators
    to fully embrace inquiry teaching. It is not just a better way for students to
    excel on Common Core exams, but it is a likely way to eliminate the achievement
    gap, and to have students succeed in their careers.


    We are all aware of how difficult it is to do controlled research studies in real
    school situations. It is virtually impossible to create comparable groups of classes
    of students, and then to have the same teacher using two distinct pedagogical
    approaches for each of these classes is also most difficult to accomplish. Although
    we have evidence from educational research to defend the effectiveness of inquiry
    teaching, these studies are muddied by the nature of social science research.
    When I speak with teachers around the country about inquiry teaching, I can now
    explain to them how the brain learns in neurological terms'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'and show how this correlates with inquiry teaching techniques. Now you can
    also do this, but equally importantly, you can understand what needs to happen
    in the brains of your students during each phase of the inquiry teaching learning
    cycle and adjust your practice accordingly. For additional information on brain
    research, please refer to the Bonus Chapter on the Digital Resource CD.


    # Think and Reflect


    +   1. Inquiry lessons require students to work in small groups, engaging in an
    exploration where they uncover the concept you want them to own. In what ways,
    if any, would this student-led model differ from the way you currently plan lessons?
    Who can you plan with or get help from as you plan effective explorations?


    +   2. During each of the three parts of the inquiry teaching learning cycle,
    the teacher plays different roles. Thinking about your classroom, perhaps even
    a particular lesson, briefly describe the role you would be playing during each
    of the three stages if you used the inquiry teaching approach.


    +   3. Just how important is it for you to ask for a student’s “thinking so far”
    rather than asking for the answer, and how might it change the whole tone and
    dynamic of the classroom?


    +   4. How does the “figuring out how to figure out” aspect of inquiry teaching
    have students naturally prepared for the skills required as part of the Common
    Core State Standards?


    +   5. If indeed a concept—a complex idea—cannot be taught, but rather can only
    be constructed by the learner, then our understanding of neuronal networks (and
    how they are built, modified, and expanded in the frontal cortex) must inform
    what you need to do as a teacher. What are two to three elements of inquiry teaching
    discussed earlier in this chapter that match your new understanding of how the
    human brain learns?


    +   6. If students in a didactic classroom are being told answers and they are
    memorizing procedures, which areas of the brain are being used? Do these areas
    construct concepts that can be used in solving real world problems?'
