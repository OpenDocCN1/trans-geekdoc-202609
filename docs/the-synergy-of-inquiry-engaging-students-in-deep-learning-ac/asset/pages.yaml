- pgno: 227
  md: 'Every one of these actions is organic to the steps of exploration, clarification,
    and real-world application of the inquiry teaching learning cycle. Every one of
    these actions empowers the individual students, teachers, school leaders, parents
    and community members in their roles in maintaining effective, dynamic, self-correcting,
    active, productive, creative places of learning. Effective inquiry engenders creativity
    and diversity of perspectives, and empowerment and collaboration are the norm.


    # Voices of Experience


    Rather than theoretically trying to explain this complex matrix of interactive
    factors that leads to the vitality, endurance, and academic and social success
    of certain school cultures where both students and teachers succeed and thrive,
    I have asked the principals of two such schools to describe their experiences
    where these cultures were collaboratively created and continue to prosper.


    Although one school is a high school in a large urban city and the other is an
    elementary school in the rural end of a small town, the cultures created are remarkably
    similar. We all have much to learn from each of these journeys into inquiry teaching
    and the journeys of teachers and students as they collaboratively built their
    constantly adaptive and supportive school communities.


    We first hear from Eric Nadelstern, the founding principal of the original International
    High School in New York City, a public school that has demonstrated remarkable
    success with English language learners that Jackie Ancess and Linda Darling-Hammond
    (1994) have documented. The school continues with this success almost 30 years
    later. This is the school where Jonathan Katz, one of the math teachers you heard
    from in Chapter 2, honed his teaching skills. It is also a high school that created
    its own interdisciplinary teaching teams and units, when almost no one was doing
    this at the secondary level. I think you will be astounded by how inquiry learning
    permeated and shaped every aspect of practice at the school. I had the pleasure
    of watching Eric and his teachers evolve over the first four years of the school’s
    genesis.


    Then, we hear from Margaret (Margie) Riddle, a principal at Robert K. Finn Ryan
    Road Elementary School in Florence, Massachusetts that has a full economic spectrum
    of students. When Margie became principal, the school did not rank well on standardized
    test scores and many parents considered sending their students to other elementary
    schools in the district under a school choice provision. She describes the evolution
    of the school community as teachers moved to inquiry teaching in various subject
    areas and as they, along with the students, became empowered through inquiry.
    It is now a school where teachers want to teach, parents want their students to
    attend, and where students succeed. This is the school where Andrea Egitto, a
    teacher whom you heard from in chapters 2 and 3, now teaches. Even though Margie
    retired in 2013, the school culture still continues since teachers and students
    created it and continue to own it.'
  merge: -1
  img_proc: true
- pgno: 228
  md: "Go on a journey with these exceptional educators, leaders, and students as\
    \ they create their effective learning communities. They can help you understand\
    \ how the synergy of inquiry transforms schools in a way that I cannot even pretend\
    \ to do.\n\n# Inquiry Learning at the International High School at LaGuardia Community\
    \ College\n\n# Principal Eric Nadelstern’s Reflections\n\nI opened the International\
    \ High School at LaGuardia Community College in September 1985 with a staff of\
    \ 14, half of whom were teachers, and 59 recently arrived immigrant students.\
    \ Within four years, 435 students were enrolled and taught by a faculty of 30\
    \ teachers. In 2014, there are 16 International High Schools in New York City\
    \ and two in California, all public schools, serving thousands of English Language\
    \ Learners (ELLs). The inquiry learning methodologies that my teachers and I developed\
    \ together are still in practice in these schools, and considered the leading\
    \ edge of ELL instruction nearly 30 years after they were first implemented.\n\
    \nThe following mission and statement of educational philosophy is from the school’s\
    \ website (http://ihsnyc.org/about/mission/):\n\n> > The mission of The International\
    \ High School is to enable each of our students to develop the linguistic, cognitive,\
    \ and cultural skills necessary for success in high school, college, and beyond.\
    \ We are committed to the following educational principles.\n\n+   1. Limited\
    \ English proficient students require the ability to understand, speak, read and\
    \ write English with near-native fluency to realize their full potential within\
    \ an English-speaking society.\n+   \n+   2. In an increasingly interdependent\
    \ world, fluency in a language other than English must be viewed as a resource\
    \ for the student, the school, and the society.\n+   \n+   3. Language skills\
    \ are most effectively learned in context and emerge most naturally in purposeful,\
    \ language-rich interdisciplinary study."
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   4. The most successful educational programs are those that emphasize high
    expectations coupled with effective support systems.

    +   5. Individuals learn best from each other in heterogeneous, collaborative
    groupings.

    +   6. Career oriented internships facilitate language acquisition as well as
    contribute a significant service to the community.

    +   7. The most effective instruction takes place when teachers actively participate
    in the school decision-making process, including instructional program design,
    curriculum development and materials selection.


    At first, the most unusual thing about International High School at LaGuardia
    Community College was that students had to fail a test of English language proficiency
    to be eligible for admission. True, it was on a college campus, but by this time,
    so were several other schools. We thought that if eight 40-minute periods each
    day was good, then nine 35-minute periods would be even better, and proceeded
    to shave five minutes off each class so that students could enroll in an additional
    ninth period class. Everything would change, however, when we implemented “student-for-a-day.”


    # Student for a Day


    About a decade after our school began, Theodore Sizer and Nancy Sizer (1999) wrote
    a book entitled, Students are Watching. The implication of that title and the
    book is that students may not be listening, but they are watching and emulating
    the behavior of the adults around them. Like so many others, I had first connected
    to Theodore Sizer (1984) after reading his book, Horace’s Compromise, which pointed
    to the failures of large traditional high schools; then followed his work with
    an organization he founded called the Coalition of Essential Schools, which was
    founded to promote whole school reform; and, eventually, had International join
    the coalition. One of Theodore and Nancy’s most important insights was that you
    never knew a school until you had seen it from the viewpoint of a student.


    Capitalizing on that insight, I offered every teacher the opportunity to be freed
    up from their daily classes and responsibilities to spend the day with a student.
    Their classes would be covered. To stack the deck a bit, we identified the 10
    percent of students who were not as successful as we wanted them to be, and asked
    participating teachers to select a student partner from among these disengaged
    students. At the very least, this would mean that our disaffected kids got to
    spend an entire day with a faculty member who got to know them. If that student
    had gym, then the teacher needed to bring his or her sneakers. Participants were'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'required to meet the youngsters at point of school arrival, go to all of their
    classes with them, including lunch, and remain with students until they departed
    for home at day’s end.


    Within a three-month period, every teacher on staff volunteered to participate.
    At the end of that period, we piled into a room to debrief. Teachers’ comments
    were, “the most interesting thing that happens in this school occurs in between
    periods,” and “you can’t do anything meaningful in a 35-minute period because
    no sooner do you take your books out, then it’s time to copy the homework assignment
    and pack up for the next class.”


    From this experience, we put together a faculty committee to study International’s
    schedule. The result was that we went from 35-minute periods to 70-minute ones,
    students would take four classes each day, and teachers would teach only three.
    True to Sizer’s philosophy, we were able to reduce student load for each teacher
    by 40 percent without incurring any additional costs. As importantly, 70-minute
    classes lent themselves better to the activity-based, project-driven collaborative
    learning that the school had committed to in its mission and statement of educational
    philosophy.


    # Form Defines Function


    In the early days of the International High School, we had ordered trapezoidal
    tables and chairs to replace the one-arm torture chairs still prevalent in most
    schools and colleges. We reasoned that placing two trapezoidal tables together
    would seat up to six comfortably, with ample room for students’ books. We also
    hoped that it would facilitate the kind of small group collaborative learning
    that the school aspired to. However, even the best-laid plans can be effectively
    defeated by precedent and tradition, which along with incrementalism, are the
    true enemies of real school reform.


    When the furniture arrived, I waited until everyone had gone home in the late
    afternoon and set up each of our five classrooms with four pairs of tables facing
    each other, and six chairs around each pair. I also moved teachers’ desks to a
    sixth room, which was to become a faculty workroom. By the close of first period
    the next day, my teachers had figured out how to align trapezoidal tables into
    rows facing front, and some even moved their desk back into their classrooms.


    Once again, I waited for everyone to leave the next evening, and returned the
    classrooms to the organizational schema I had originally put them in. Sure enough,
    teachers placed the desks and chairs into rows once again the following day. This
    daily and nightly exchange went on for three weeks until I wore teachers down,'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'and they stopped moving the furniture around. They were, to be sure, still
    teaching from the front of the room. However, now half the class had their backs
    toward them, which at the very least forced teachers to begin moving around the
    room. It would take years until we learned together how to do collaborative learning
    well.


    # The Motion Program


    The major catalyst in moving us toward a school model based on collaborative inquiry
    learning began without fanfare, or even notice. Felicita Santiago, a math teacher,
    came into my office late one August to discuss the work she had done with Uri
    Triessman that summer at the University of California at Berkeley. She was so
    excited about what she had just learned about facilitating math learning through
    group work, that the sounds and laughter emanating from my office attracted David
    Hirschy, the school’s physics teacher, who entered, sat down, and listened. At
    one point, he said that the work Felicita was describing is the mathematics of
    motion, the underlying concept in Newtonian physics. I suggested that if they
    wanted to do a joint class together, I would support it (Jablon 1989b).


    In the days to come and in typical International High School fashion, David and
    Felicita recruited Kathie Rugger, an English teacher, to teach Poetry in Motion,
    as well as the physical education teacher, Alan Krull, who had just launched Project
    Adventure, an indoor version of Outward Bound. Together, this team of teachers
    created the Motion Program, the first full-day, integrated, interdisciplinary
    community of learners that would later come to define the International approach
    (Jablon 1989b).


    The Motion Program ran the following trimester with just one class as a pilot
    project. Faculty members planned together and were often in each other’s classes.
    Felicita and David team taught a double 70-minute period combined physics and
    math class. Small teams of four or five students worked on projects together over
    several days of work as teachers circulated from table to table supporting students
    and extending their thinking. It was the first time I experienced the exhilaration
    of multiple voices engaged in meaningful work with one another. It was not noisy
    but purposeful.


    At the end of the first trimester, 100 percent of students passed, not just one
    class, but all of their classes. We tried it with another class for the next trimester
    with the same results. In contrast at the time, 66 percent of all students enrolled
    in New York City high schools failed one or more subjects; 45 percent failed two
    or more; and a full 33 percent failed three or more subjects each semester. By
    any measure that 100 percent of students enrolled in the Motion Program pilot
    passed all of their courses was an extraordinary outcome.'
