    issue that keeps arising in the school, or a novel that is so engaging to students
    that it becomes the pivotal point for the unit.


    Figure 5.5 presents groupings of possible starting points for an ITSLU. Undoubtedly,
    you will be able to expand this list because of your understanding of your students’
