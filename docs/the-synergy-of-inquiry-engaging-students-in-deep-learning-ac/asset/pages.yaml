  img_proc: true
- pgno: 189
  md: 'abilities, which was four times greater than their peers in control classes.
    The Process Skills and Science, Society and, Technology (PSST) test of process
    skills in science and abilities in understanding Science, Technology and Society
    (STS) relationships revealed that 41 percent of the BONGO group increased their
    science reasoning skills and STS awareness over the course of one term as compared
    to nine percent within the control group (Jablon 1989).


    How was this possible? What were the components and activities that changed the
    behavior of a vast majority of these adolescents within a three-month period of
    time? We need to go back and revisit the section in Chapter 1 about what really
    matters to teenagers and the congruence of that with Maslow’s hierarchy of human
    needs. Most students who are disengaged from school have the same needs as typical
    teenagers, but some of those needs are poorly met. If the deficiencies are not
    met, students cannot focus while in school. However, it is possible to simultaneously
    meet these needs and engage students in quality inquiry teaching and learning.
    It is a matrix of components that make this possible. Many teachers have used
    one or more of these components in their teaching but it is the synergy of the
    matrix that allows these students a successful engagement with school. Before
    looking at the whole matrix, let us build it one component at a time. The components
    are (1) interdisciplinary units, (2) project-based learning, (3) meaningful themes,
    (4) issues of social conscience, and (5) final public projects.


    # Interdisciplinary Units


    > > “Life decisions are interdisciplinary, but schools teach separate subjects.”

    > > —Dodd 1984


    A review of the literature demonstrates a call for interdisciplinary education
    to support the Common Core even though most school practitioners have not embraced
    it (Heitin 2013; Mazzara 2014). Teachers as well as students suffer from the narrow
    organization of education. Creating only a narrow focus on specialized content
    actually diminishes comprehension of the content itself. There are aspects of
    a subject that are unnoticed or invisible until we view them from a distance or
    from a perspective of another subject. Significant knowledge is naturally interdisciplinary
    (Ortega y Gasset 1957).


    As noted in the previous chapter, those schools employing effective middle school
    practices with early adolescents have teachers on teams who are meeting almost
    daily to sustain interdisciplinary units throughout the year. Likewise, effective
    elementary teachers rarely teach their subjects separately but use science or
    social studies activities as the topics for their nonfiction or fiction texts
    to teach language arts skills or use appropriate math skills during their science
    activities. Once elementary teachers in'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'their self-contained classrooms begin inquiry teaching—having students manipulate
    materials and design explorations—interdisciplinary teaching is almost unavoidable.
    The interdisciplinary daily or weeklong units just evolve naturally, almost by
    themselves. Andrea Egitto’s narrative in Chapter 3 illuminates this natural evolution.


    The most effective interdisciplinary connections at the middle and high school
    level are not just between traditionally connected disciplines—science and math
    or social studies and language arts. Rather, successful units have had students
    experiencing the connections between language arts, science, physical education,
    eastern social studies, and pottery. Others connect mathematics, drawing, social
    studies, music, history, and computer aided design. Usually two teachers start
    with their two disciplines, but once a real world project becomes a component
    they add other disciplines by necessity.


    Middle schools were designed to facilitate this practice. It easily occurs in
    middle schools where there are *real* teams, where all the subject area teachers
    are dedicated to interdisciplinary projects and are given *common planning time*
    during the school day to plan, revise, and administrate these units. Early adolescent
    needs are met and early teenage angst is greatly reduced. Students are both academically
    and socially more adept and mature.


    By having subjects integrated, students can focus their learning. Being bombarded
    with six or seven disconnected classes per day, students cannot think deeply about
    any of them. When they have subject matter that is connected, they can focus their
    thinking and learning in school, on their homework, and in the community.


    Success in one subject area or skill in an interdisciplinary setting can give
    students a *portal of entry* into one with which they are not as comfortable.
    Interdisciplinary activities afford students the opportunity to use strength in
    one of the multiple intelligences, to draw on the personal appeal of a particular
    subject, or to use a skill well-suited to the activities. This is particularly
    true when teachers use the powerful tool of analogous interrelationship role plays.
    These activities naturally lend themselves more to the human interaction subjects
    of language arts and social studies. However, by combining these with math and
    science, students can meet their affective needs as they work on the multidisciplinary
    project. Math and science are included in the human relationship aspect of school,
    and science and math are not experienced as the cold non-emotional subjects that
    make them much less accessible to many students. Likewise, the reverse is true
    for some students who are regularly more comfortable with the more objective and
    logical math and science explorations. Connecting science and math with the literature
    or social science issues gives students a safer *portal of entry* into exploring
    the human interactions embedded in these subject areas.'
