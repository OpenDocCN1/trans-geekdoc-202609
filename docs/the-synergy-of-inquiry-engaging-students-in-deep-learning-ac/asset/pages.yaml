    # A Starting Point and Planning Template for ITSLU


    If you want to plan an interdisciplinary unit, find someone to collaborate with
    you. As an elementary teacher in a self-contained classroom, designing an interdisciplinary
    unit will be different than what you regularly do. So, find someone to work with—another
    teacher at your grade level, another teacher with an interest in the inquiry approach,
    a paraprofessional, or a community member with particular expertise. This colleague
    will be someone with whom you can bounce ideas around and who can assist you in
    implementing the unit.


    If you are a middle or high school teacher, find a teacher from another discipline
    who is interested in collaborating with you. Together you can search online for
    examples of ITSLU units where you will get a feel for how teachers are integrating
    subjects and creating engaging projects for students. In these examples, you will
    see how teachers match their state standards and use an inquiry-teaching approach.
    Notice how some teachers use community members as resources. Each time teachers
    sit down to plan a new unit, they are inspired by a different element that then
    becomes the starting point. Although it needs to meet subject matter standards,
    which aspect of the subject matter you will choose is dependent upon many other
    factors. Sometimes a teacher team begins with an idea for a theme, but other times
    it is an idea for a service-learning project. It can be an avocational or vocational
    skill that one of the teachers possesses that prompts'
