- pgno: 36
  md: '# Observations About Using Physical Materials in Practice


    The use of manipulatives is the norm in effective science and mathematics classrooms.
    However, many teachers think of physical historical materials such as small industrial
    tools or machines, uniforms or weapons, and such that can be borrowed from or
    viewed at museums as the only manipulatives that can be used in history classrooms.
    These are valuable materials. However, much of the time spent on a role play where
    students get to experience what previous generations in various circumstances
    had to endure is also a manipulation of materials—their own bodies and minds.
    We see an example of this with the bags of cotton students experienced in Mike’s
    class. This is followed by another manipulation of materials—interpretation of
    primary source documents. A textual analysis of writings related to John Brown’s
    raid written by contemporaries has students deeply analyze issues of point of
    view and writing for an audience. The following role play allows students to create
    their own point of view and defend it while solidifying the concept and enriching
    students’ common core skills.


    The inquiry-process steps used in Mike’s history lesson closely follow the Common
    Core Reading Standards for Literacy in History/Social Studies for grades six to
    eight. Figure 1.3 presents these standards.


    # Figure 1.3 Common Core Reading Standards for History/Social Studies, Grades
    6–8


    +   1. CCSS.ELA-Literacy.RH.6–8.1: Cite specific textual evidence to support analysis
    of primary and secondary sources.

    +   2. CCSS.ELA-Literacy.RH.6–8.2: Determine the central ideas or information
    of a primary or secondary source; provide an accurate summary of the source distinct
    from prior knowledge or opinions.

    +   3. CCSS.ELA-Literacy.RH.6–8.6: Identify aspects of a text that reveal an author’s
    point of view or purpose (for example, loaded language, inclusion or avoidance
    of particular facts).

    +   4. CCSS.ELA-Literacy.RH.6–8.8: Distinguish among fact, opinion, and reasoned
    judgment in a text.

    +   5. CCSS.ELA-Literacy.RH.6–8.9: Analyze the relationship between a primary
    and secondary source on the same topic.


    (CCSSO 2010)


    These strategies prepare students for any Common Core-based testing and develop
    the skills necessary for effective citizenry. The role-playing aspects that lead
    to preadolescents’ emotional reactions to past historical events deeply engage
    their personal sense of fairness and justice and transform “dead” history into
    a vibrant living experience.'
