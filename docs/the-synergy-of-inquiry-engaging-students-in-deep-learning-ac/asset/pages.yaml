- pgno: 203
  md: 'three periods of a seven-class day where students studied rigorous subject
    matter in three state-mandated subjects. Students who completed whole class dependent
    projects with public presentations—many with social advocacy themes—were enrolled
    for one semester. However, since the mix of subjects changed each semester, many
    students re-enrolled during a subsequent year for a semester when the classes
    they needed were available as they realized their need for the *positive alternative
    peer group* they had previously experienced.


    Students in Steve’s semester were enrolled in a Biology I, physical education,
    and English III class as part of BONGO. During the term, they read Orwell’s *1984*
    (1949), Huxley’s *Brave New World* (2004), and More’s *Utopia* (2005). Students
    also studied a bit about American government structures and engaged in physical
    education where small bicycling experiences twice a week led to an understanding
    of bicycle safety and to each student completing a 35-mile bike trip by the end
    of the term. Simultaneously, students were engaging in *doing* biology by designing
    and completing daily lab investigations related to genetics, cellular mechanisms,
    and ecological relationships. Genetic engineering, and its related ethical issues,
    became a lens through which students studied various biological concepts and connected
    these to the novels they were reading. Students also employed many of these biological
    concepts to make sense of the physiological demands on their bodies during bicycling.


    For the first two-thirds of the term, small cooperative teams completed many small
    interdisciplinary projects and daily *analogous interrelationship role plays*
    that used and demonstrated mastery of science, English, and social studies knowledge
    and skills. These role plays always involved adolescent characters interacting
    with other teens, their parents, teachers or other significant adults in their
    lives. The personal relationships in the role plays were analogous to the larger
    relationships being studied in an academic perspective in history or literature.
    Students had an opportunity to simultaneously confront and discuss the adolescent
    issues that made their lives so unpredictable and themselves so needy while studying
    important concepts in academics.


    During the final six weeks, students began to synthesize some of the larger concepts
    they had identified as being *vital driving questions* that they themselves were
    wrestling with during the term and that they found of great significance. As adolescents,
    they identified what was the most important social conscience issue they encountered
    as the term progressed so that they could then engage their peers, parents, and
    others who would see the play they were about to write together as a whole class.
    Like the little projects all term long, the final project they created was group
    dependent for success. As a class, they outlined, wrote, revised, and produced
    a two-act play that synthesized complex ethical, scientific, and legal issues
    into a compelling drama that spanned four decades in present and hypothetical
    future history. The first act of the play written by students in 1983 took place
    in a hypothetical 1983 United States where a constitutional convention had been
    called to change the constitution so that a law could be passed that allowed the
    government to override the rights of individuals found in the Bill of Rights.
    A court scene'
