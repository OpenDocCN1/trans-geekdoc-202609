- pgno: 49
  md: '# Thinking Space


    # How Learning Occurs in the Brain


    Before we look more closely at how learning physically occurs in the brain, take
    a piece of paper and write down, or draw a diagram, of how you currently understand
    how learning occurs in the brain.


    +   - How does someone memorize something?

    +   - How does someone figure out how to balance an equation?

    +   - How does someone figure out how to uncover the theme of a story?


    Speak about examples that are of interest to you.


    +   - What physically takes place in the brain for each of these instances?

    +   - What do you do in your classroom that supports the physical changing (learning)
    that needs to occur?


    Take your time to write down your understanding of this connection. As you will
    soon see, you are actually activating your current neuronal networks related to
    the brain and teaching so that learning from reading this section can be profitable.
    Please do not go on until you have done this.


    Now that you have written down your understandings, compare your current understanding
    with what we know from neurobiologists as you read the sections that follow.


    become knowledgeable about brain physiology and how learning physically occurs.
    This way, they can evaluate their practice to see how well it supports what actually
    needs to happen in the brain if deep understanding is to occur.


    # How the Brain Learns


    The brain learns so that it can make decisions that lead to actions that will
    allow the individual to survive. Our brain has a hard time attending to things
    that do not lead to decisions that lead to taking an action that we perceive as
    important. There are millions of people around the world who still learn every
    minute of the day in order to get food, clothing, and shelter, and their survival
    depends on it. Those of us who live in developed countries and have our basic
    needs met, still need to understand how our brain continues to follow this physiological
    procedure. Understanding that process is necessary, we can best figure out how
    to have students learn what is useful for them in order to be prosperous and happy
    within the current society.


    Learning means taking in sensory information, integrating that information and
    changing it into symbols and language, and then creating ideas, generalizations,
    concepts, decisions, and plans.


    There is one main area of the brain—the cerebral cortex—that is involved in learning.
    Some parts of this process are done in the front-facing area of the brain and
    other parts of this process are done in the back-facing area. In order for these
    processes to work and for us to learn, we need to build rich communication networks
    between these two areas. Sitting right underneath these two structures are the
    areas of the brain that evolved much earlier. These structures are related to
    the emotions of fear and happiness. They still have a major impact'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'on the quality of learning that occurs in these newer areas of the brain. These
    areas have a greater effect on the cognition areas than the cognition areas have
    on these emotion areas. Figure 1.5 shows the parts of the brain when it is in
    a passive and an active state of engagement in learning the same topic.


    # **Figure 1.5** Images of parts of the Brain Engaged in Learning


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_50_0.png)


    When the brain learns, it literally changes parts of itself. New nerve cells and
    networks are built. Knowledge is simply the way that these nerves and nerve networks
    are connected and how often they are used for taking actions. Learning is physically
    rewiring a place in the brain and how it is connected to other pieces of the brain.
    Because of modern imaging techniques, we can see these networks built. We can
    also see which ones are lit up when we are involved with certain kinds of learning
    and thinking, and we can use this knowledge to better engage students in learning.
    Figure 1.6 illustrates the parts of the brain that are involved in learning.


    # **Figure 1.6** Parts of the Brain Involved in Learning


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_50_1.png)'
