- pgno: 119
  md: 'as our school is located in an older house, we lack the typical science lab
    facilities and most experiments require some creative materials use.


    As I learned more about inquiry teaching at Lesley, it was clear that this would
    be my style of teaching. The four elements, among many, that stand out as most
    important in my classroom are the:


    +   - depth of the discovery (exploration) stage in the learning cycle

    +   - value of group structures

    +   - complexity of planning inquiry-style lessons

    +   - authenticity that inquiry-based projects provide


    To explore these four themes in greater depth, I will describe one unit, built
    around a lesson series called “Mystery Powders” that I first encountered at Lesley,
    with some quick references to other projects when applicable.


    # Mystery Powders Unit


    The Mystery Powders Unit is a five to six week project at the introduction to
    our study of chemistry. Students often enter seventh grade with minimal understanding
    of the nature of matter, and so this unit builds their conceptual understanding
    upon an extensive hands-on project testing various properties of different substances.
    The conceit is that each group is a crime scene investigation (CSI) research division
    tasked with analyzing samples from a crime scene where the suspect has left traces
    of a white powder. Groups are given samples of five different powders (common
    items like sugar and corn starch) and directed to develop and perform tests upon
    each of the powders and then analyze their results so as to differentiate the
    “mystery powder” (some unknown combination of one or more of the sample powders)
    using just their test data. Typical tests involve heating powders with votive
    candles, dissolving them in water, creating reactions with them with an acid (vinegar),
    or using an indicator (iodine solution).


    In my experience, this experiment is the perfect culmination to a challenging
    year for seventh graders. Entering with little experience in collaborative investigation
    skills, by March most students have built up the necessary skill set to work independently
    and in groups, keeping organized materials and detailed notes. By this time, students
    have also internalized the feelings of success and empowerment that they have
    enjoyed from earlier inquiry lessons, and they are excited to take on a more advanced,
    long-term experiment of their own devising. In addition, this unit combines students’
    pre-existing interest in crime investigation with the concrete exploration of
    materials that my students require given their relatively lack of prior experiences.'
