- pgno: 105
  md: '# Looking into Inquiry Teachers’ Classrooms


    As with any new endeavor, it takes time to transition. Although there are great
    benefits to inquiry teaching, it does take careful and thoughtful planning. There
    is an upfront investment in detailed planning. You cannot sit down and write a
    whole year’s worth of inquiry teaching plans. You do what you can with what you
    have and slowly build up a repertoire to the point that it is all inquiry all
    the time. This planning can be done piecemeal if necessary. However, you will
    find that the energy needed to invest in this will come once you have completed
    a whole unit with your students. You will be so pleased with the progress your
    students make that you will have the energy and momentum to continue planning.
    Of course, if you can collaborate with a colleague to create inquiry-teaching
    plans, you will have twice as many plans in the same amount of time. In addition,
    your collegial interactions and feedback will create a synergy, and even more
    momentum.


    Figure 2.10 shows an example page from a rubric that can help you determine where
    you are in your development as an inquiry teacher. The rubric specifies four areas
    (and related topics) in inquiry lesson and unit planning: setting objectives,
    assessing the learning, planning lesson activities, and introducing and overviewing
    a unit. It defines four criteria for performance: unsatisfactory, developing skills,
    proficient, and distinguished. The Rubric for Assessing Student Performance can
    be found on the Digital Resource CD.


    Figure 2.10 Sample Page from a Rubric for Assessing Student Performance


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_105_0.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Remember, you are not on this journey to inquiry teaching alone. There were
    many trailblazers and pioneers before you, and there are currently many teachers
    who embrace an inquiry teaching approach and utilize it on a daily basis in their
    classrooms. There are also many who are just stepping into inquiry teaching for
    the first time, and there are many inquiry teachers, be they novices, competent,
    or expert.


    # Think and Reflect


    +   1. How does the length of the inquiry teaching lesson plans in the appendices
    compare to the lesson plans used at your school? Is there something inherent in
    implementing inquiry teaching that requires the level of details in these plans?
    Why are almost all the lessons multiple days in length?

    +   2. What are the differences between “facilitating questions” and “assessment
    questions” in inquiry plans? Why should plans have these questions written out
    ahead of time in detail for each part of the lesson so that you can “cruise” your
    classroom with them “ready in your pocket”? Can you identify some questions you
    have used in a recent lesson that are examples of each of these?

    +   3. Why is it necessary if you want to accurately assess whether a student
    truly has deep understanding of a concept or thinking skill, that you must design
    a unique, authentic application for them to solve accompanied by a detailed rubric?'
