- pgno: 110
  md: 'expertise, sending the twin messages that I value their knowledge and experience,
    and that what we will be learning is relevant to them and connects with what they
    already know. Only when I feel we have reached the limitations of their pre-existing
    knowledge, do I then bring in new terminology or information with any sort of
    direct instruction, like a lecture.


    For example, before reading Studs Terkel''s *Working*, I ask my students to reflect
    in writing or discussion upon jobs that they have held—the challenges, what they
    were proud of, what they hated, and how it affected their identity. Before beginning
    our unit on news and journalism, my students role play reporting on a breaking
    news story, informed only by the scenario description and their own ideas of how
    various parties (reporters, editors, advertisers) influence a situation. Before
    examining the courtroom scenes in *To Kill a Mockingbird*, I always poll my kids
    for what they already know about courtroom procedure from their own lives and
    exposure to other media, and then, as we read further, have them then test their
    expectations against what actually happens when Atticus and Mr. Gilmer face off
    before Judge Taylor in Maycomb.


    # Let Students Have as Much Choice and Ownership as Possible


    Now that the national standards call for schools to teach students *skills* over
    particular texts, facts, or products, it is easier than ever to afford students
    the chance to engage in a way that suits their learning styles and preferences,
    as well as their background knowledge.


    I frequently engage student groups in literature circles, where students select
    their own texts (either from our class library or of their own choosing entirely).
    Sometimes the basis for this choice is convergence with a theme we are studying,
    or sometimes we are practicing a certain skill (e.g., close reading and textual
    analysis, or learning and applying vocabulary) where nearly any choice of text
    will suffice. For some students, this is a chance to read about topics they have
    always been interested in but have never found the time to investigate. For others,
    it might be the first engagement with the whole idea of reading a book they have
    chosen, for pleasure. Nearly always, students have opportunities to engage in
    discussion with their peers. In this way, they reinforce the universality of what
    we study and enrich all of our knowledge by drawing in more sources than I ever
    could have found on my own.


    This is a kind of differentiated instruction, which has long been best practice
    for working with heterogeneous groups (as all classes inevitably are). I also
    differentiate by assessment method, as students will often be able to demonstrate
    knowledge and mastery of skills better through some types of assessments than
    through others. On'
