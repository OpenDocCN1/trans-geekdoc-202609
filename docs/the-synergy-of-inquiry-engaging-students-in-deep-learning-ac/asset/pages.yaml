  md: 'events from a novel, I usually have them split up these tasks and then *clue
    in* their classmates. Individual students within a group will often choose different
    short stories or articles on the same theme, and then jigsaw back together to
    teach one another about what they read. The next day, a quiz will hold all students
    in the group responsible for knowing ideas from all of the stories. Sometimes
    I collect only one quiz from an entire group, and students do not know whose quiz
    will be used to grade all of them; therefore, it is in their best interests to
    divide up work and help everyone else out. Any one of them could end up being
    *the important one* for their grade. After quizzes, if one of my students performs
    poorly, it is the team’s job to help them correct their errors. We do peer editing
    of writing, particularly on simple, well-defined issues like comma usage, integration
    of quotations, or transition sentences.


    Whenever a student gets stuck on an issue of knowledge or comprehension, they
    know that their first job is to ask a group mate. If the whole group is stumped,
    they need to ask members of another group, and/or look online. This has several
    benefits:


    +   1. It reinforces the idea that, in a community of learners, we are all responsible
    for one another’s education. And it does not take up precious teacher time and
    resources.

    +   2. It engages multiple students in the responsibility for one’s own learning,
    either as seeker or provider of knowledge.

    +   3. Finally, it helps students develop the vital tasks of self-advocacy and
    independence—when out in the real world, they will not always be dependent upon
    a singular authority figure for answers.


    As they work, I help facilitate and advise them about the *process*, rather than
    filling in the answers that stump them, except as an ultimate last resort, or
    if students are barking so far up the wrong tree that I feel they need a nudge
    back.


    The most exciting parts of group work, however, go beyond the knowledge and comprehension
    levels. Because so much of the work that we do in my classroom is project based,
    students are frequently working in groups on a long-term task, such as providing
    an annotated analysis guide to a novel, creating a print or video advertising
    campaign, or writing and producing a modern retelling and staging of a Shakespeare
    play. Here it is even more vital for students to have defined roles (e.g., notetaker,
    discussion leader, and video editor). Sometimes I assign them these roles, but
    usually I give them the choice based on their interests and abilities. Sometimes
    I even have students define for themselves what the different roles will be, checking
    in to ensure the roles require equal or equitable amounts of work, or to remind
    them of questions they have not yet asked. One of the most successful lessons
    in my toolbox is asking students to create a study guide for the complex texts
    we'
