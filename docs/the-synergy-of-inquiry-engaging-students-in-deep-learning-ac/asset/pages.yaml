    # Bill Cummiskey''s Reflection


    I met Paul Jablon during the second semester of my masters program at Lesley University.
    In fact, that term Paul taught all three of my courses, including the science
    methods course that focused heavily on inquiry teaching in science classrooms.
    At the time that I started my masters, I had been teaching for three years at
    a small, very successful charter school in Massachusetts. As a charter school,
    we are quite a bit smaller than many typical middle schools, with a total of around
    330 students in grades K–8. I have the particular pleasure to loop with my students
    for grades seven and eight, so that I can coordinate my standards over two years
    and build upon concepts over multiple units and branches of science. Our classes
    typically run in the 70–75 minute range (we have an extended school day). Approximately
    20–25 students are in each class; occasionally, eighth-grade classes are split
    into two groups of 10 or 12 students, which is fantastic for inquiry projects,
    but unusual. The school used small student-to-teacher ratios and high standards
    of excellence to push students well beyond the low achievements common in the
    district schools. Few of the teachers at my school, however, were applying project-
    or inquiry-based models. Even science classes tended to use clear, direct instruction,
    and guided practice activities throughout grades five to eight. Beyond this, our
    school is located in a lower income city with a high percentage of English language
    learners. Finally,'
