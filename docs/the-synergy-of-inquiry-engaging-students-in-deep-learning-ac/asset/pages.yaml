  md: '# First-Year Mathematics Teacher’s Reflection


    *I asked a first-year mathematics teacher, an exceptional student teacher who
    had successfully used inquiry teaching in her placement, to speak about her experiences
    in her first three months in a traditional high school mathematics department.
    She requested that she and her school not be identified. Despite some disheartening
    experiences, she is committed to sustaining an inquiry approach with her students.
    That is her way of doing her students justice.*


    As a first-year teacher in a relatively traditional mathematics department, I
    really struggled to find a way to bring inquiry into the classroom. I was scared
    to do things too differently and worried that I might be in a district that would
    not allow me to do the things that seemed to me to be best practice.


    My first week, we had school for two days, and then it was the weekend. As I was
    talking to the other teachers I was told that most do not jump into the curriculum
    but instead set up the classroom routines. It seemed like a perfect time to bring
    problem solving and inquiry into my classroom, to get students used to the way
    we would do inquiry. I gave them some toothpick problems. The toothpicks would
    be arranged in a particular formation, and given a certain number of restraints,
    students had to rearrange them into a different formation. My students struggled.
    Some were really frustrated when I refused to tell them. I had them working in
    groups right away, which I think shocked some of them. Given that it was the first
    and second day, I used this as a way to build community and to see which groups
    worked well and which groups did not. Most of my students are upper classmen and
    know each other, so they quickly began to work together. It was great for me to
    see students engaged right away. In surveys, a lot of them had told me they disliked
    math but here they were problem solving and seeing patterns. The groups that worked
    together tended to solve the puzzles faster, and others wanted to not know the
    answer so that they could keep working. It was definitely encouraging.


    Once the second week began, I struggled to bring in a lot of inquiry-based learning.
    I would try, but the pace of the curriculum was fast and I felt like there was
    no time. However, I also felt like I was not doing my students justice. I started
    small. We were starting off with quadratics in my Algebra II class. We began with
    just a conjecture board about what they knew, which really threw me. I was under
    the impression that they knew a lot about quadratics, and what became clear was
    that they were really unsure. During the next class, I gave a few students a tennis
    ball, and asked them to play catch. I think my students thought I was crazy. I
    asked them what they noticed. My class started talking about the shape of the
    ball’s path and we used that as a jumping off point. I was able to refer back
    to this simple demonstration as a way to keep students on the same page.'
