  img_proc: true
- pgno: 27
  md: '# The Teaching and Learning Cycle


    *The Inquiry Teaching and Learning Cycle* (see Figure 1.1) is a modification of
    *The Learning Cycle*, a teaching procedure Robert Karplus and Herb Thier (1967)
    invented as they were working on elementary curricula at University of California
    Berkeley. However, over the years it has been demonstrated that this approach
    is how students of all ages best learn. Karplus and Thier saw that learning is
    about the academic discipline—how the knowledge is created in that discipline—and
    doing and learning that discipline knowledge needs to be embedded in an approach
    in which students naturally learn. Their response was chosen to nurture the learner’s
    natural curiosity and joy of learning. They saw that memorizing and repeating
    does not represent a discipline and that a subject is the quest for knowledge,
    not just the knowledge itself. They field tested their approach with thousands
    of students and found that if learners explored a phenomenon and noticed how as
    adults we thoughtfully responded to their thinking, students then constructed
    ideas, skills, and attitudes about the subject area that lasted a lifetime. Students
    who used the learning cycle were superior in both cognitive and motivational behavior
    (Kyle and Bonstetter 1992).


    The learning cycle is based on Piagetian theory (1963; 1969) and also operationalizes
    David Ausubel’s theory of meaningful learning (1963). We now understand that the
    learning cycle also fits into Vygotsky’s social constructivist theory (1978).
    Likewise, current brain neurobiology research and learning theory supports the
    learning cycle (Zull 2002).


    It is 55 years since the invention of the learning cycle, and although I have
    made some important modifications, the basis of the learning cycle is still at
    the heart of inquiry teaching and learning. A colleague of Karplus and Thier,
    John Renner (1971, 163) explains that “True learning comes from the search for
    the answer and not the answer—this is the essence of inquiry.”


    # Deep Academic Understandings and Skills


    Only after students have created a rich set of concepts and spent reasonable time
    building skills are they then exposed to what the larger academic community knows.
    Once students have negotiated their ideas by engaging in small group explorations,
    they have established a place in their brains that interconnects many of the factors
    involved in the concept. With the teacher’s leadership, they can first compare
    and contrast their ideas with other groups and come to some class consensus. Only
    then do they have real questions about the concept that they want answered and
    have enough of the landscape created so that they can make sense of what the larger
    academic community understands. Students can distill meaning from reading, media,
    or even lecture. These sources of understanding become meaningful enterprises.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Deep Academic Understandings and Skills in Practice: *Eleventh-Grade Chemistry
    Lesson*


    Erin, the eleventh-grade chemistry teacher, has each student individually manipulating
    large needleless syringes. Students have been directed to manipulate the syringes
    and keep track of what happens. She asks each student in their four-person research
    team to clearly state to the others what they did and how the syringe reacted.
    If the others did not do this, or see a different reaction, then each student
    has to do it until they come to consensus in the group.


    When all students in the group have responded, they return to the first student
    who spoke and try to reach consensus on why the particular actions produced the
    result they observed. In the midst of the group discussions Erin, after cruising
    the room, stops the groups and says that in a few minutes the reporter in each
    group needs to report on the data and insights that they have gathered thus far.
    As the reporters begin to report their results, the teacher writes down each observation
    word for word. When the reporter mentions something about “the plunger in the
    tube,” Erin interrupts and asks, “What is the plunger?” A discussion ensues that
    leads to the need for a drawing and labeling of parts of the syringe. Erin gets
    class-wide agreement upon generic names for each part so that they each use the
    same vocabulary in their scientific community. One of the large concepts she is
    building is an aspect of the nature of science. The ability of the community to
    monitor itself by running replicable controlled experiments and to use a universal
    language is one aspect of this nature of science.


    During this time, Erin is also slowly letting the class create operational definitions
    for words they are using in their reporting of their explorations so that they
    can see that in science there are no facts, just the best understandings that
    can be supported by evidence from carefully constructed experiences. Each time
    the class uncovers some new insights, there is greater conceptual understanding
    and the definitions expand, or are modified. In this way, another aspect of the
    nature of science is modeled.


    However, she also focuses the class on the content—concept objective—during the
    two or three days of the lesson. Erin can soon question the reporters about how
    they know there is “stuff” inside the syringe. After all, students keep saying
    there is “air” in the tube, so Erin asks anyone for evidence that there is “stuff”
    in the tube. Soon someone notes that when you cover the “tip” tightly with your
    finger and push down on the plunger that was originally partially up the tube,
    there is something in the tube that pushes back. Within five minutes a combination
    of students have come up with this statement: “When you cover the tip tightly
    with your finger and push in the plunger, then the space in the tube (the volume)
    gets smaller and the gas in the tube gets compressed and the pressure increases
    and ‘pushes back.’”'
