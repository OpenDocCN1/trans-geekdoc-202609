- pgno: 24
  md: '# Small-Group Learning


    For millennia, humans have learned how to solve problems and better themselves
    by working in family units, tribes, and more recently in engineering teams, poetry
    collaboratives, and other small groups where thinking and ideas are shared, tested,
    and applied. Students not only have an opportunity to have a lot of time to verbally
    work through their thinking but are also more likely to verbally try out their
    newly-created ideas in a small group rather than in front of the whole class.
    This group negotiation of ideas allows students to compare their thinking with
    others in the group, and it also allows the teacher to go from group to group
    to carefully listen in and see where students are currently as they move towards
    mastery of the concepts and skills.


    # Small-Group Learning in Practice: Fourth-Grade Science Lesson on Heat


    # Part One


    In a fourth-grade class, the teacher, Debbie, had begun the study of heat a couple
    of weeks earlier by asking students what they knew about heat. Most of their observations
    about heat were correct interpretations about how the natural world works. For
    example, they observed that the flame on the stove makes both the pot and the
    water in it hotter. However, one student said that “clothes have heat” and many
    of the students agreed with this idea. They demonstrated “evidence” by pointing
    out that if you put on clothes when you are cold in the winter, that you get warmer.
    One student also pointed out that her mom said, “Put on your warm clothes.”


    Based on students’ observations, Debbie modified the plans she previously created
    for her students. These plans included explorations for letting students uncover
    how heat is transferred from one place to another, how certain materials—insulators—keep
    heat from moving easily, and how a thermometer measures the average amount of
    heat in a given spot. She now included some explorations where students could
    figure out if “winter clothes” contained heat or simply kept “the heat from humans”
    from moving outside the body.


    Each day, students looked forward to the teaching, saying it was time for science
    research teams. Students, seated in their groups of four, would clear their desks
    and the “getter” from each group would assemble the materials to either continue
    their exploration from their previous science team time or to wait for a new challenge
    to build upon their ever-increasing knowledge and skills.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Part Two


    Debbie gave students hot and cold objects and thermometers to use in their small
    science research teams. They designed experiments that answered the question of
    what would happen when these objects are put various distances from one another.
    Some groups just put the items touching one another. Other groups put them at
    various distances from one another, keeping track of how far apart they were,
    asking the teacher for a ruler. Others did not use a ruler and just said touching,
    near, and far. Some kept track of the time and others just said “after a while.”
    Students argued their point of view for how the experiment should be designed
    until the group came to a compromise. Everyone kept notes in their “science journals”
    in bound notebooks since initial notes about the thinking and data are never altered.
    It was important for them, together with the teacher, to see the evolution of
    their thinking so these notes were “sacred.” Groups then carried out their experiments.


    A week or two into the study of heat, the teacher had students in each small science
    research team bring out some winter clothes. Students used the same experimental
    designs that they had formulated in other explorations to determine for themselves
    whether the clothes “had heat” or just “insulated heat produced by the human body.”
    Most groups quickly designed experiments that gathered evidence that the clothes
    were no warmer than the room that they were in, but they did function as good
    heat insulators. All of them had been working on “controlling variables” as they
    designed their experiments, with Debbie nudging them in that direction with well
    planned questions. As always, groups reported their results, and the “scientific
    knowledge of the class”—what they knew—was altered by the whole class community
    of scientists. It would take a while for all students in the class to be completely
    clear in this understanding. However, having students working closely and intensely
    with one another allowed both the teacher and the other students in their group
    to move students’ understandings along much more deeply and quickly. All of the
    students soon owned the concepts and skills.'
