- pgno: 13
  md: 'implementing them in any classroom. It will *actively engage* teachers in this
    process. This clearly-delineated inquiry teaching model also brings constructivist
    approaches into the *pragmatic realm* and differentiates inquiry teaching from
    discovery learning.


    +   2. **Lack of expectations for complex thinking:** Standardized testing during
    the past 30 years has not required higher level, complex thinking from students.
    Memorization and shallow understanding associated with direct instruction were
    sufficient. However, now the expectations of the Common Core and other new standards
    for subject areas (for example, the Next Generation Science Standards), require
    more complex levels of understanding and application. Inquiry teaching is an effective
    vehicle to enable students to meet the expectations of the new standards and new
    assessments.


    +   3. **Lack of coordinated implementation plans:** Inquiry teaching is usually
    introduced one subject at a time rather than as an effective, organic way to approach
    teaching and learning for all the subject areas. Once teachers see it as the organizing
    umbrella, the context in which the rest of these effective practices reside, they
    then not only embrace it completely, but also become staunch advocates for its
    use by their peers. That synergistic approach is a focus of this resource.


    +   4. **Lack of instructional time:** Traditional approaches to teaching have
    treated each of these strategies as separate strategies, possibly adding one or
    two approaches into a lesson. With implementation of the Common Core, this narrow
    goal of learning is no longer applicable in instruction or assessment. Whether
    in language arts, mathematics, science, or social studies, an inquiry approach
    to teaching will not only be the most effective but also the most time-efficient
    way to engage students in achieving the standards.


    Once you, your students, and perhaps even their parents get caught within this
    synergy web, you will find it hard to believe that you ever approached teaching
    and learning any other way. It will certainly transform your students, your teaching,
    and perhaps even your whole school community.


    # ## How Will This Book Help Teachers?


    *The Synergy of Inquiry* demonstrates, with concrete examples, the efficacy of
    inquiry teaching. Not only are there examples and templates for each subject area
    at various grade levels, but there are also examples of how implementing these
    techniques in all the curriculum areas in the school will create a synergy of
    thinking skills and an approach to problem solving that is universal. Embedded
    throughout the book are the voices and helping hands of many teachers who, through
    the example of their own effective practices, will guide you through the process
    of moving towards inquiry teaching. This resource is designed so that teachers
    reading this book will feel they are co-planning and co-teaching with these other
    practitioners.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'The book consists of six chapters. Each chapter features examples of inquiry-teaching
    practices in various subject areas as well as supportive research which provides
    the rationale for this approach. A Digital Resource CD offers additional examples
    of unit and lesson plans, some of which extend examples described in the book.


    +   - **Chapter 1: Defining and Describing Inquiry Teaching.** This chapter defines
    the key features of inquiry teaching—student exploration, small group learning,
    deep academic understandings and skills, problem solving, access to physical materials,
    relevance to student experience, and authentic assessment. Examples of inquiry
    teaching in practice and observations about the instructional practice offer opportunities
    for you to reflect on your own practice. Knowing how the brain works is a crucial
    understanding for teachers; it enables them to effectively engage their students
    in learning through inquiry teaching. This idea is briefly visited here, but is
    explained in much greater detail in the bonus chapter on the Digital Resource
    CD.

    +   - **Chapter 2: Planning for Inquiry Teaching.** Building on the rationales,
    premises, and concepts presented in the preceding chapter, this chapter contains
    protocols and templates of inquiry-teaching unit plans and lessons. Four teachers
    describe their practices and offer insights into their thinking about the lessons.

    +   - **Chapter 3: Reflecting with Inquiry Teachers.** I invited nine exceptional
    teachers to share their thoughts about inquiry teaching. In their reflections,
    they reveal their joys, struggles, insights, fears, hopes, and dreams.

    +   - **Chapter 4: Managing the Inquiry-Based Classroom.** Students learn to self-manage
    in an inquiry classroom. This chapter offers a collection of strategies that create
    classroom environments where students can try out ideas, learn how to interact
    in group situations, and develop relationships. Additionally, the chapter provides
    guidelines for assessing group projects and designing the physical space in the
    classroom.

    +   - **Chapter 5: Serving Disengaged and Disenfranchised Students.** Lessening
    the achievement gap in schools means addressing the needs of students who are
    not especially interested in typical classroom activities and those who have unique
    needs in language learning and behavioral development. Scenarios of student activities
    reveal the potential and possibilities for engaging students in activities that
    serve their emotional and intellectual needs.

    +   - **Chapter 6: Transforming the School Through the Synergy of Inquiry.** Inquiry
    teaching produces a school culture in which teachers are at the center of curriculum
    planning. In this context, teachers, students, and leaders have choices to use
    their abilities to innovate, create, and grow. This chapter includes experiences
    of a high school principal and an elementary school principal to illustrate how
    the inquiry approach can transform teaching and learning in a school.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Helpful Features


    This book has several features to add to its accessibility for readers:


    +   - Sidebars provide resources that augment content in the text.

    +   - “Thinking Space” is a feature that invites readers to reflect on their practice
    or to respond to selected content in the chapter.

    +   - Templates for unit and lesson plans, rubrics for assessing student work,
    and rubrics for evaluating inquiry teaching lessons and unit plans provide support
    for both novice and veteran inquiry teachers.

    +   - Figures illustrate important concepts.

    +   - Charts extend concepts described in the text.


    I am not naïve about the challenges facing teachers and schools who want to implement
    effective inquiry teaching and learning. For some, the implementation will not
    be a simple procedural change in their classrooms. It will not simply be doing
    a little more of one thing and less of another. This will be a cultural change,
    a shift in cultural practice. It is a change in thinking about how learning occurs
    in humans, what is most important to learn, and then finally how we implement
    a process by which students can uncover deep understandings before they are ever
    told about the rest of the world’s insights into these concepts. For example,
    the goal in an inquiry classroom in science is “understanding how to figure out
    how the natural world works.” While engaging in this well-planned environment
    of understanding, students will also obtain understandings of how the natural
    world actually does work. In addition, students will also acquire the skills and
    insights into balancing these scientific understandings with social norms, design
    principles, and economic realities to figure out how to approach solving local,
    national, and international environmental issues. This journey to the “synergy
    of inquiry” is identical (or parallel) in grades 1 to 12.


    Learning to do inquiry teaching well is a journey. It is a journey I am still
    on after many decades, yet I began to reap the benefits of implementing it in
    my classroom almost immediately. It wasn’t a journey that I took alone. As with
    any journey, it will be helpful to collaborate with others when navigating through
    it.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Defining and Describing Inquiry Teaching


    This chapter provides an overview of the components of inquiry teaching and describes
    classroom practices using these components. In this context, it is important to
    note that this approach does not ask you to abandon practices that work; the goal
    is to incorporate them into the inquiry teaching framework. Consequently, you
    can easily continue to use them.


    You may find that you need to modify the size of the group with which you use
    a particular activity. Perhaps you will want to rearrange the sequence of activities
    in the learning process. For example, if you use Understanding by Design (Wiggins
    and McTighe 2005) as a planning format, you will discover that the model fits
    into inquiry teaching. Similarly, if you have your students working in cooperative
    groups, doing Socratic Seminars, or using a KWL (Ogle 1986) approach, you will
    see that these are compatible with inquiry teaching. Likewise, if writing partners,
    reader response, or arts infusion are elements of your practice, then inquiry
    teaching provides the perfect context for continuing these activities. Teachers
    who employ all the dimensions of inquiry teaching find that they have to alter
    very little, if any, of their day-to-day practices to address the relevant standards.


    # The Elements of Inquiry Teaching


    Inquiry teaching is a method of facilitating learning where teachers provide situations
    in which students can successfully seek answers without being given answers. In
    the process of negotiating ideas amongst their peers with minimal assistance from
    teachers, students uncover concepts while simultaneously acquiring rational thinking
    skills.


    Three over-arching goals or learning objectives provide a framework for the main
    features of an inquiry approach and should relate to:


    +   1. Concepts—the relationship between ideas

    +   2. Thinking skills—within and between disciplines

    +   3. Habits of mind—thinking behaviors'
  merge: -1
  img_proc: true
