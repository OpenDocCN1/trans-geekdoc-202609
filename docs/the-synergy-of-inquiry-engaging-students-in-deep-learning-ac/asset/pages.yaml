- pgno: 275
  md: '# The Synergy

    of Inquiry


    Engaging Students in Deep Learning Across the Content Areas


    > Geared to current practitioners, this how-to handbook depicts an umbrella that
    encourages professional educators to keep what works. Theory, lesson plans, and
    classroom management strategies combine to support teachers as they implement
    a research-based approach with proven results.


    —Brian Bates, M.A.

    Teacher, Moreno Valley School District

    Moreno Valley, California


    Learning how to seek out answers to questions without the help of the teacher
    is important to students'' academic success. With this resource, teachers will
    learn to help their students understand how to find the answers they need in an
    effective way. Regardless of the standard—language arts, mathematics, science,
    or social studies—an inquiry approach to teaching is not only effective, but is
    an efficient way to engage students to help them achieve the standards. This valuable
    and timely resource provides a synergistic set of practices that create a proven
    way for students to develop deep conceptual understandings, complex thinking skills,
    and enduring practices.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_275_0.png)


    Paul Jablon, Ph.D., taught in the New York City public schools for 19 years where
    he and his colleagues created classrooms, programs, and schools that utilized
    inquiry teaching and interdisciplinary, project-based learning to engage those
    students previously disengaged from school. As a faculty member at Brooklyn College,
    the University of Massachusetts, and Lesley University, he had the opportunity
    to work for over two decades with both preservice and practicing teachers. Leading
    systemic-change projects in urban and suburban school districts, he has collaborated
    with thousands of teachers to understand how inquiry teaching is best implemented
    with a diverse set of students from kindergarten through college.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_275_1.png)'
