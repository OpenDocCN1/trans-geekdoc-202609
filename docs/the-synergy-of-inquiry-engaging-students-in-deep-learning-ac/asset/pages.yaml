  img_proc: true
- pgno: 204
  md: 'takes place where a couple refuses to obey the law that would affect their
    unborn baby. The second act occurs in 2020 where students devised a culture based
    on the extension of the idea of the government making decisions for individuals.
    The baby of the original couple, now a young man who has been hidden away in the
    mountains, emerges into this new culture with the ethics of pre-1983 Americans.
    This play was toured to surrounding schools and also presented in a local college
    theater (Jablon and Born 1988).


    During the 13 years that Terry and I facilitated the BONGO Program, we were astounded
    by what our previously disengaged students accomplished. It was beyond my wildest
    dreams about what teaching and learning could be. We got to watch one class reinvent
    existentialism over a two-day period. Students created photographs and sculptures
    that were displayed in college galleries. They won the educational award from
    the National Hunger Project for a play they wrote and toured about world hunger
    and the politics involved. Four times, they won first prize for the young adults’
    playwriting contest from the Dramatist Guild in New York City. Groups of two or
    three BONGO students have taught over 50 classes, with adults only as observers,
    in other public schools before they presented their original plays the next day.


    Every day, Terry and I could not wait for the last three periods of the school
    day when 35–50 students would have boundless energy, enthusiasm, curiosity, and
    creativity as they wrestled with the complexities of literature from Greek drama
    to current plays such as “The Zoo Story” (Albee 1958); or of scientific theories
    from Mendel’s pea plants to Heisenberg’s Uncertainty Principle. Concurrently,
    students were delving into every era of history, art, music, and theater, while
    fine tuning their bodies by running or bicycling greater and greater distances.
    Every afternoon or evening, they stayed endlessly arguing ideas, socializing,
    writing and drawing, and building and rehearsing until we “finally threw them
    out and sent them home.” We would have liked to have spent more afternoons and
    evenings working with our students, but we did have families and other lives.
    It was so alluring. As I sit here and write about it I close my eyes, and I am
    back there and as a teacher it makes me whole.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_204_0.png)


    # Thinking Space


    +   - What insights into working with disengaged students have you gained from
    learning about the BONGO Program?

    +   - What is the potential for realizing such a program (or something similar)
    in your school? Throughout the district?

    +   - What kind of reception do you think such a program would receive in your
    school’s community?

    +   - What attributes would school leaders and faculty need to possess to become
    engaged in such a program?'
