  md: "> So let it be hard. Try not to get discouraged or to take your failures too\
    \ personally. It’s not only you that is having trouble understanding mathematical\
    \ reality; it’s all of us. Don’t worry that you have no experience or that you’re\
    \ not “qualified.” What makes a mathematician is not technical skill or encyclopedic\
    \ knowledge, but insatiable curiosity and a desire for simple beauty. Just be\
    \ yourself and go where you want to go. Instead of being tentative and fearing\
    \ failure or confusion, try to embrace the awe and mystery of it all and joyfully\
    \ make a mess. Yes, your ideas won’t work. Yes, your intuition will be flawed.\
    \ Again, welcome to the club. I have a dozen bad ideas a day and so does every\
    \ mathematician.\n> \n> —Lockhart (2012, 10)\n\n# Challenges I Have Faced: David\
    \ Nurenberg Reflects\n\nEver since I have adopted inquiry teaching, project-based\
    \ instruction, and democratic classroom practices, my job has become much more\
    \ challenging. It is also more rewarding, as I see my students more engaged, and\
    \ thinking on more complex levels, which is why I persevere. A traditional classroom\
    \ is definitely easier to map out and manage—you have a plan, and you stick to\
    \ it. You are in control, you have set the rules, you know the parameters, and\
    \ you enforce them. In an inquiry classroom, you have to make all sorts of contingencies\
    \ and remain flexible because you are never entirely sure where kids might decide\
    \ to take an activity or a conversation. I cannot just sit at my desk and grade\
    \ as students engage in a writing activity. I have to always be up and about,\
    \ listening in on their groups, offering feedback or posing questions. Students\
    \ may decide to try and set norms that I do not agree with, and then it is a matter\
    \ of discussion and negotiation that can swallow up half or even an entire class.\
    \ Every week I make plans, and every day I have to revise them.\n\nCooperative\
    \ work, by its very nature, is messy. I try and be upfront with the kids in advance—I\
    \ tell them that there will be conflict between them, there will be struggles\
    \ and frustrations because you have four or five different people with different\
    \ ideas all trying to work together. Someone inevitably tries to freeload, gets\
    \ bossy, or says sharp words. It is very tempting to try and swoop in as the authority\
    \ figure to try to resolve a group conflict; they very often want me to do so.\
    \ However, unless a student’s safety (physical or emotional) is being threatened,\
    \ I almost always turn it back to them, and that is hard. I care deeply about\
    \ my students, and when"
