- pgno: 120
  md: '# Discovery Stage


    The discovery (exploration) stage of this project is often very taxing and time
    consuming, as students from different backgrounds engage with the project at very
    different levels. At one point, I had a focused and engaged group of students
    testing cornstarch with an iodine indicator. When asked to observe the most significant
    change in the powder once the indicator was applied, students listed observation
    after observation, well over 30, without ever mentioning the fact that the white
    powder mixed with brown liquid turned a deep, vibrant purple color! These experiences,
    while frustrating in the moment, underscore the importance of allowing students
    the time to experience and manipulate materials before they are ready to develop
    any meaningful understanding of the underlying scientific processes involved.
    I have found this to be universally true, from analyzing patterns in geological
    data (such as mapping earthquakes to locate tectonic plates) to observing microscopic
    organisms in pond water. Our students come with so many half-formed or misconceived
    ideas about the world that without ample time to explore and build their own set
    of experiences, disillusioning them of their misconceptions becomes almost impossible.


    # Small Groups


    To make this exploration of materials feasible, small groups with clearly delineated
    and rotating roles are necessary. There is no way I could control, let alone teach,
    a class of 25 preteens fooling around with chemicals and fire without these structures
    in place. Beyond classroom management—a valuable achievement in its own right—group
    roles serve two major functions in my classroom. In essence, the heterogeneous
    small group is a teacher multiplier, allowing me to check in quickly with multiple
    groups, while knowing that the strongest students, academically or behaviorally,
    will focus their groups’ investigation in my absence. This allows me to quickly
    touch base, get a sense of where each group is and how they are progressing, and
    drop a few guiding questions before moving on. Starters can then run with my suggestions,
    and I do not need to facilitate every step of the process.


    Small groups also naturally allow for modification. This year, in particular,
    we are struggling with a great disparity between the highest achieving students
    and those with the greatest struggles. While tracking is a common solution to
    this problem, that often limits the lower achieving students while depriving the
    accelerated learners of valuable chances to hone their explanatory skills and
    develop their ability to back up their claims with strong, supporting evidence
    that their peers can engage with. Rarely have I had a bored student complain that
    their group is holding them back. Rather, advanced students appreciate the challenge
    of working as a team to reach a goal while understanding the fact that they have
    not mastered the concepts themselves, but rather reached a further benchmark in
    the'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'ongoing process of discovery. In fact, students that struggle most with heterogeneous
    groups and push to move at a faster pace are almost always those with the greatest
    social-emotional needs, and who have the most to learn about their own deficits
    and the importance of collaboration in a team. These students often benefit the
    most and soon learn that, while they are advanced in certain areas, they have
    a lot to gain from the other members of their group. In the Mystery Powders Unit,
    this often manifests in surprising ways. For instance, the most capable scientists
    in the group typically take charge early on, helping to develop potential tests
    and hypothesizing on the identify of the different powders. At the end of the
    unit, however, as we work to summarize our data into investigation reports, which
    we call scientific papers, students with writing and organizational skills often
    stand out. Every year, I find that students who struggle most with the vocabulary
    acquisition and complex concepts always bring some prior experience that is invaluable
    to the project. For example, students who have worked with a parent on fixing
    machines often know ways to use tools or develop methodological protocols that
    are well beyond the skill set of their more academic peers.


    # Inquiry Planning Process


    The natural modification of working in small groups dovetails nicely with the
    process of planning an inquiry-based curriculum. As new standards, particularly
    the Next Generation Science Standards (Achieve 2013) have made explicit, there
    are a myriad of components to incorporate into each lesson—science thinking skills,
    to habits of mind, to crosscutting concepts, and core ideas. Consequently, I often
    feel overwhelmed when beginning the planning process for a year or even a unit.
    Inquiry-based teaching has lightened the stress level dramatically. I have seen
    in countless ways how important skills and ideas naturally spiral throughout the
    various branches of science. This has meant, for me, that I can be okay when only
    half of my students internalize the concept of precision in measurement and the
    nature of significant digits, because these ideas will crop up again when we apply
    them in later units on technology or biology. Each inquiry lesson is so dense
    with relevant standards and potential learning moments that my job becomes less
    *what can I get them to learn,* and more *how can I focus their attention on the
    central ideas* while letting some students develop only peripheral understandings
    that we circle back to in a later unit.


    This realization has led me to add new fields to my unit-planning document. I
    use the backwards-planning template from *Understanding by Design* (Wiggins and
    McTighe 2005), but have found that the initial box for lesson goals and standards
    is too general. Instead, I differentiate core standards and ideas from those that
    I am spiraling from previous units, as well as others that I am introducing for
    the first time. For example, our eighth-grade science course begins with a six-week
    long investigation of modern industrial agriculture. We utilize our community'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'garden plot, local partners, and do a book study of Michael Pollan’s *The Omnivore’s
    Dilemma: A Natural History of Four Meals* (2006) to get students to think of their
    personal health and nutrition as inextricably linked to global, environmental
    issues, and the health of a number of ecosystems. Within this unit, our primary
    concern is to develop an understanding of ecology and the natural cycles that
    produce and recycle food energy and organic material. Simultaneously, however,
    students are reviewing the concepts developed in our mystery powder chemistry
    unit as we track various types of elements and compounds through a food web. Also,
    students are being introduced to new topics such as evolution (for example, the
    evolution of teosinte into modern feed corn) or human anatomy. This allows me
    to not only push students to engage with the relevant science at multiple levels,
    but gives real impetus for students to create their own experiments to continue
    their learning on topics they were exposed to in our readings or on field trips.
    This year, students applied their learning from our garden trips to create experiments
    to explore connections between snails, basil plants, and other model organisms
    and human anatomy. This led into a month-long investigation of human body systems
    and connected directly to our study of heredity, reproduction and evolution in
    the spring.


    # Authenticity in School Work


    Finally, as shown directly above, inquiry-style teaching and learning lends an
    authenticity to school that is very often lacking. When I co-taught with our seventh-grade
    ELA teacher, we often discussed the need for student work to be meaningful and
    authentic. Rather than writing book reports, this teacher assigned students to
    draft book reviews that mirrored reviews from websites and newspapers. He argued
    that when these students graduate and want to write in the future, they will never
    have to, or want to, write a book report that summarizes a text. Instead, real
    people *review* books they read, offering analysis and argument alongside any
    necessary summary. In my experience, students recognize and appreciate this type
    of work. They find it valuable and empowering to participate in the types of work
    the professionals in our disciplines are doing. As I previously mentioned, rather
    than doing lab reports, we write scientific papers modeled off of the format most
    professional journals require. I bring in my wife’s lab notebook and reference
    her publications (she is a microbiologist) to show students that *real scientists
    and engineers* write these papers about their findings, and so, since we are engaging
    in the same sort of exploration, we share our findings in a similar fashion.


    Beyond authentic work, inquiry fosters authenticity in student questions and interest.
    Students find their own ways to connect our work to their personal lives and even
    to relevant topics across the curriculum. At the start of eighth grade, we produce
    a list of science themes that we have uncovered as nearly universal throughout
    our investigations over the past year. Without much prompting,'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'students are able to create a list that closely matches the Next Generation
    Science Standards list of crosscutting concepts.


    # Transformation in Teaching and Learning


    Lastly, with months of meaningful and rewarding work behind them, students typically
    understand when time constraints require that some lessons be faster, more condensed
    versions of the inquiry investigations we would normally use. When teachers plan
    strategically so that topics covered quickly are fairly straightforward and manageable,
    students will trust that they are being prepared for future investigations where
    greater understanding will be uncovered. Even in brief *teach the topic* lessons,
    mini-inquiry activities can activate students to uncover the core ideas or most
    important concepts, while hinting at the complexity that awaits in a more in-depth
    exploration. Overall, I have found that the inquiry-teaching lessons have transformed
    my experience of teaching and learning even further, making discipline much easier
    and student learning more successful.


    # Mike Farmer’s Reflections


    When I first started teaching a little over 10 years ago, I had visions in my
    mind of Robin Williams in *Dead Poets Society*, “seize the day boys, seize the
    day!” That was all I needed to do, to inspire, to help students break the mold
    of traditional “boring” education. With very strong content knowledge, well-prepared
    class materials, and a large degree of confidence developed during my preceding
    years in the business sector, I began to address my audience. I was not a lackluster
    performer. In fact, my evaluators were impressed with my oratory and ability to
    *edutain*. Despite these endorsements, I did not end up winning, or being nominated
    for, any awards. Well not by my real audience, students.


    Over the next couple of years, I realized that the social studies classes I was
    teaching needed activities to engage students. After all, do I like sitting in
    a chair for 40 minutes listening to somebody? In fact, fresh from my newly acquired
    Master of Education experience, I decided that group work was the way to go. I
    continued to dispense knowledge and have students discuss aspects of it in their
    groups; I even added the occasional role play, drama, webquest, creative assignment,
    primary-source interpretation, game, poetry reading, and sing-along to pep up
    the whole experience. Oh yes, I was working very hard and my students were having
    a good time, that is until I began to lecture again. Then, after five or ten minutes,
    you could just see them slump in their chairs.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'It slowly began to dawn on me, lecturing was hard work and nobody seemed to
    be enjoying it, neither me, nor my students. However, I did find myself enjoying
    the conversations and behaviors that they engaged in when they were working together.
    I enjoyed creating those experiences for them. As a result, lecturing began to
    occupy an increasingly small percentage of my total class time. It was also around
    this time that I began to experiment with essential questions in a meaningful
    way.


    I began to blend technology and group work together in meaningful mini assignments;
    it worked. I gradually expanded the mini assignments in scope by adding an essential
    question as the driving force for the activity. My seventh and eighth graders
    started having difficulties. It was too difficult for any one student in general
    to deal with the combined tasks of comprehending the nature of the assignment
    (challenge or exploration), researching relevant information, processing information,
    taking a perspective, crafting a series of outcomes, and creating a final deliverable.
    Although I experimented with breaking these assignments into small chunks, the
    most success I had, and continue to have, is from ensuring that students have
    the ability to learn from each other and with each other, and only sometimes,
    alone.


    As I reflect on the aforementioned and the way my classes operate today, several
    rules of thumb have emerged that I believe work, at least with my student populations:


    +   1. Clarify what the task is and be very clear about your expectations. Help
    students discover what they may need to know. Allow them almost complete freedom
    in determining how to get it.

    +   2. Use technology that works. The five-year-old computer with a fuzzy Internet
    connection is a bad idea.

    +   3. Encourage flexible grouping structures where sometimes students will work
    with others, and other times will work alone. This does require a great deal of
    finesse to ensure that students stay on task while you are not being the teacher
    who constantly hovers around.

    +   4. Do not step in too early; let students sort it out by themselves or with
    their peers first.

    +   5. At the end of each activity (mine tend to last from one to two weeks) be
    prepared to orchestrate a discussion with the whole class about lessons learned.
    Highlight the practices they should or should not be focused on going forward.

    +   6. Stay the course. Students are just not used to figuring things out for
    themselves. As soon as things get tough they will ask you for answers. You'
  merge: -1
  img_proc: true
