- pgno: 116
  md: 'minimum, I try to encourage students to reflect upon how a certain classroom
    structure—a Socratic discussion, for example, versus a guided conversation with
    a speakers’ list—enables certain kinds of learning, and obstructs other types.
    At one point, Benjamin Bloom (1956) felt that this sort of evaluation, of examining
    *how we learn how we learn*, was the most advanced and challenging cognitive task
    we could ask of ourselves.


    This can all easily be linked back to content area. When reading *1984*, *One
    Flew over the Cuckoo’s Nest*, *The Giver*, or other novels about authority and
    social control, students can examine our own classroom’s physical space, and develop
    projects to transform, even reclaim it, to produce different effects (this was
    actually the brainchild of a student teacher I once had). The more I experience
    the power of inquiry, the more I realize that I cannot put up roadblocks or off-limit
    areas as to what can be questioned. If I am helping to shape the next generation
    of informed citizens and consumers, then, in the end, I *want* them to question
    authority and basic social structures in meaningful and productive ways.


    # ## Andrea Egitto’s Reflection


    *Andrea shares how experience in an inner-city public school inspired her to use
    inquiry teaching throughout her 15-year career. This experience provides the context
    for her first-grade history lesson presented in Chapter 2.*


    I began during my first year of teaching using an inquiry approach mostly in science
    with fourth-grade students in the Brownsville section of Brooklyn. It was a challenging
    class of students who came from an area of high crime, drug dealing, and a lot
    of instability in their homes.


    The inquiry all started with two gerbils that began as class pets. We had one
    tank with one male and one female gerbil. I soon realized that I could engage
    these students if the lessons focused on these gerbils. Students quickly became
    enthralled in the life cycle of the gerbils when in the first month they had their
    first litter of seven offspring.


    Although these students were in fourth grade, many were reading way below grade
    level. Having them work with district-provided reading materials was a painful
    experience for both them and me. However, when I purchased books from a pet store
    about gerbils, written probably at an eighth-grade level, many of them'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'would work diligently and persist until they found their answers. Almost everyone
    was happy to work on their writing skills if they could write about the gerbils.
    We wrote observations, letters to pet stores and parents.


    I soon realized that for them to all be regularly engaged in explorations that
    would lead to understandings and skills in science, math, and language arts, they
    needed to be working in small groups of four. The prolific gerbils obliged, and
    we soon had enough gerbils for seven tanks with two gerbils in each so that each
    group had their own pair. This was still a tough class to teach, but things that
    they would previously resist doing in language arts and math, they would now work
    on, if they first could explore with the gerbils.


    The natural progression of my teaching led me to be trained in the workshop model
    for language arts. By having hundreds of fiction and nonfiction trade books in
    my classroom at students’ independent reading levels, my students could choose
    the books they wanted to read. They worked with reading partners to analyze and
    discuss what they were reading. In writer’s workshop, students chose their topics
    and learned to critique one another’s work, like great writers do. They shared
    their work with the class and their partners to get feedback, and then revised
    and edited their work before they published it for the world to see.


    Many years later, I attended some problem solving, inquiry teaching math workshops
    for three summers. These caught my interest right away because we used the data
    from swinging pendulums and many other hands-on activities as a way to figure
    out a solution without the instructor telling us. We also did a lot with geometry
    and explorations with shapes and figures that led us, as adults, to many mathematical
    understandings we did not get as students during our own school years.


    However, if the school I have been teaching in for the past 10 years had not had
    the NSF nationally validated math curriculum that was already inquiry based, I
    could not have devised all the explorations that students can do so they own the
    math concept or skill even if they forget the algorithm. They know how and when
    to use their understandings because, “you always know something about the problem
    you are trying to solve.”


    In NSF nationally validated math curriculum, there are inquiry lessons and the
    materials to go with them. Kids are so excited when they uncover that, “every
    time I do it this way, it seems to work out. This might be the solution.” In first
    grade, we want them to memorize number combinations to ten, but then they explore
    larger numbers on their own, first using materials, trying number combinations.
    They discover that 36 plus 4 is like 6 plus 4, and 6 plus 4 equals 10, so that
    36 plus'
