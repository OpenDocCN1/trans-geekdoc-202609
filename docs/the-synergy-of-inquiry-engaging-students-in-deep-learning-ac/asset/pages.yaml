  md: 'effective self-management, group dynamics, effective communication, thriving
    within diverse cultures, and building a supportive and nurturing community.


    Teachers can build this supportive culture in their own classrooms. Students acquire
    these social-interactive skills and self-management skills much more quickly,
    and with deeper understanding, when the whole-school community works on them throughout
    the students’ tenure at the school. Fortunately, there are schools at all levels
    and in urban, rural, and suburban areas, and individuals from these schools, who
    have been incredibly successful creating lessons and structures that have resulted
    in such a classroom and school culture. These individuals have either put together
    whole curricula, or pieces of it that the rest of us can use to have our students
    supporting one another in school. By engaging in these curricular activities,
    your students can simultaneously acquire insights and skills that are also needed
    for positive interpersonal relationships in their families, communities, and in
    the workplace. The student can become an empowered individual in all social situations.


    This chapter presents the underlying rationales and formats for how this would
    be best implemented in one teacher’s classroom, on a middle school team, or in
    a whole school. Together with inquiry teaching, a supportive classroom environment
    makes schools incredibly powerful places for learning and really closes the achievement
    gap.


    # David Nurenberg’s Reflection on Classroom Management


    I have been teaching English and social studies with inquiry-based methods for
    over half of my 14-year career. Every year I challenge myself to do it more and
    more, because every year I see how well students respond and to what heights they
    can push themselves using these models.


    As a teenager, I was the rare student who could learn just fine by taking notes
    from a teacher who lectured for 50 minutes straight. Even then, what had I learned?
    I could rattle off the dates and outcomes of battles in World War I, conjugate
    Spanish verbs, and tell you all about Newton’s laws, but the classes that actually
    got me *thinking* were those that also involved *doing*—analyzing something as
    I was building it, designing and conducting experiments, or discussing and debating
    ideas with fellow students. Here was where I actually had to think critically
    and create new knowledge—the very skills that the Common Core State Standards
    are now asking of students (2010). At best, traditional, teacher-centric classroom
    models risk preparing students only with skills in memorization and regurgitation.
    Far more often, it just disengages the vast majority of kids who are not intrinsically
    motivated and do not see the relevance of the classroom to their *daily lives*.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'For me, inquiry-based methods have slain the proverbial two birds with one
    stone: how to engage reluctant learners and how to help all students develop and
    hone their higher-order thinking faculties. I have worked with students for years
    in co-creative classroom environments that demand and reward student independence
    and interdependence. Students in my classroom work cooperatively, as a class and
    in small groups; it is rare that all of us are pursuing the same task in the same
    fashion all at once. Within their groups, students have tasks for which they are
    individually accountable—differentiated by interest and ability level. At every
    turn, I attempt to give my students as much opportunity as I can to direct the
    course of what they learn, and to actively learn from and teach one another, with
    the teacher serving as guide or facilitator.


    From the beginning, I emphasize with students that we are a community—this is
    not a classroom of 27 students and 1 teacher, but of 28 students and 28 teachers.
    While I hold a role of authority in the classroom, I am not the sole repository
    of knowledge. Rather, I try to reinforce how it is our job to teach one another,
    and we cannot do that unless we have a climate of mutual respect and openness.
    I am very explicit with these values. During the first few weeks of class, we
    practice routines such as “how to have a class discussion.” We mutually negotiate
    rules—I have a few non-negotiables, like *no put-downs*, but I have almost never
    had to be the one to articulate them, as the kids come up with them on their own.
    We also mutually design how to transition between activities, how to pass out
    new materials, and so on. We do the same process for setting up norms for group
    work, norms for when a substitute teacher is present, and then revisit these norms
    on occasion as they need clarification or revision.


    Activities like our daily check-in (when we go around the room and students give
    a 10-word or less summary of how they are feeling) or “Don’t Drop the Ball” (where
    students have to collectively create a sentence in round-robin style) help the
    kids get to know one another, and practice how to work independently. Although
    they seem non-content related, they in fact demand of the kids that they develop
    and use skills in listening to one another, working together towards a common
    goal, and so on. “Don’t Drop the Ball,” for example, helps students practice listening,
    paying attention, anticipating, and cooperative goals (the group cannot succeed
    unless all members pull their weight). As the year goes on and the groups bond
    more, I vary the type of the games to be less about *get to know you* and more
    about *how to self-evaluate meaningfully*, and eventually, *how to say goodbye*.


    Group games like these, and especially the conflict-resolution activities and
    simulations we engage in a few weeks later, develop students’ skills in being
    able to work together in meaningful ways, and to productively address the inevitable'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'conflicts that come up. Students often find them fun because they do not feel
    like schoolwork, even though they are some of the most important schoolwork we
    ever engage in. I always tell my kids that I hated group work in high school,
    and it was only years later that I realized this was because no one ever taught
    me how to do it; teachers just plunked us in groups and told us to work. Would
    just plunking someone in the cockpit of a jet airplane and telling them to fly
    result in a successful experience?


    Although these activities might at first seem to threaten precious time in content-area
    learning, I have found that activities like this eventually enable successful
    cooperative and inquiry-based work. Besides, it is seldom an *either/or*, as these
    activities can often be paired with relevant content. I have had my students practice
    “I” statements and address root causes of conflict, applying them both to scenarios
    from their own school and to the feud between the Montagues and the Capulets in
    *Romeo and Juliet*. When practicing empathy and perspective-taking to analyze
    our own personal conflicts, we are then explicit in talking about how these are
    the same skills that let us analyze whatever character or theme we are looking
    at in the novel or short story we are reading. The humanities are not the only
    disciplines with easy cross-applicability between skills for cooperative work
    and skills for learning content. The hypothesis you develop and defend in a science
    class, the pattern you attempt to construct through inferential logic in math
    class, all such draw upon that ability to look at data (behavior), search out
    root causes, and arrive at an explanation or solution that works for a given problem.
    A teacher who can help students find those links can, simultaneously, help students
    develop the skills to work together effectively in their immediate lives, cover
    required content, and, most importantly, help students develop links between what
    school asks of them and what will help them in their everyday experiences. Common
    Core has helped this process immensely by asking schools to no longer privilege
    students learning specific names, dates, and formulas as a goal in themselves,
    but to limit that kind of declarative knowledge to its applicability in helping
    students develop a core set of skills.


    # Making the Classroom a Nicer Place


    I spent most of my school career hiding behind the student sitting in the seat
    in front of me. Luckily I was small in stature, so it was not too difficult a
    task. I constantly felt like I was a contestant on a game show where I needed
    an answer at all times. At any moment, the teacher might call on me for the answer
    that I might or might not have. It was embarrassing for me to be wrong or worse
    yet, not have an answer.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'In an inquiry-teaching classroom, both the teacher and the other students are
    interested in responses to “What is your. Before a student needs to engage in
    a whole class discussion, he or she has tried out a way of thinking about the
    issue. If I had been in this situation as a student, I would not have been tense
    all the time and hiding behind someone so as not to be noticed. Even back then,
    I would have been able to tell the teacher and the rest of the students in the
    class how I was approaching a problem or what my best thinking was so far, but
    nobody ever asked. In an inquiry-teaching classroom, that sense of tension is
    released. Students can safely try out their thinking and assist each other in
    understanding the steps needed to find the answer.


    Secondly, inquiry teaching, when done effectively, is much more engaging to students
    than transmission. We all know that most discipline and management problems arise
    when students are bored and see no utility in a lesson. In inquiry teaching, and
    its extensions to project-based learning, interdisciplinary thematic units, and
    service learning, *management through engagement* exists. The way you have designed
    the curriculum itself is inherently interesting and students want to be there
    every day. With a practiced and skilled inquiry teacher, they not only learn to
    read well, but they begin to want to, and even, love to read. Likewise, it is
    the same for all of the other subject areas. They become learners. They leave
    most lessons with more questions they want to answer than they came in with. They
    can become explorers, designers, and creators, a very different ethos than exists
    in most schools. Now that is another kind of management all together.


    # Acquiring Social Interpersonal Habits of Mind (SIHM)


    In my work with new teachers, their concerns about discipline and classroom management
    usually emerge early in conversations. At some point during our first meeting,
    I usually make this statement:


    > > If you are like most of us, you will be teaching for the next 25 or 30 years.
    You have a choice during that time of being a police officer or teaching your
    students how to self-manage. When I began teaching, I had problems with disruptive
    student behavior, so I became the police officer and enforced my rules. It was
    anything but fun, not particularly effective, was terribly time consuming, took
    time away from teaching and learning, and did not do anything to teach students
    to be participatory citizens, or to monitor their own behavior. Students were
    also not nice to one another and much less supportive of one another once I wasn’t
    on their case. So if you would also like to teach students how to self-manage,
    you need to supply them with learning experiences through which they will acquire
    the skills, insights, and understanding by practicing them in a real setting.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Teachers are not alone in their concern about interpersonal interactions. Surveys
    show that business leaders have similar concerns about worker interaction (Weissberg
    and Cascarino 2013). On surveys, they report that graduates often lack writing
    and math skills, but their number one concern is a lack of ability to work effectively
    as a member of a team. It does not matter whether it is an engineering team, a
    design team, a team at a fast food restaurant, or a middle-school team of teachers.
    Actually many schools, though not intentionally designed this way, appear to be
    structured to teach students to compete and *not* assist one another in learning.


    In our work with teachers on facilitating conflict resolution activities with
    their students, we find that invariably they mention how their own interpersonal
    relationships with their significant others improve if they practice and utilize
    the conflict resolution skills themselves. The most candid often point out that
    the faculty and administration in their school could use some work on these skills
    as well.


    I have come to view these abilities as Social Interpersonal Habits of Mind (SIHM).
    In other words, these are skills and insights about group and interpersonal interaction
    that need to become part of the fabric of thinking of all individuals and can
    be utilized every day of their lives, in all settings.


    # Defining Group Roles


    In earlier chapters, I made the case that students create their understandings
    and negotiate their ideas when they can have a voice in a small group of four
    while they engage in an exploration. Such group learning will not be successful
    unless students, whether in first or twelfth grade, learn *how* to work with one
    another successfully. To do so, they need structured, explicit experiences with
    the elements that contribute to effective cooperative interaction. When you overtly
    teach them how to effectively cooperate, cooperative learning occurs. Students
    are doing two things simultaneously: (1) learning academic content concepts and
    thinking skills, and (2) learning the skills necessary to be effective group members.


    I keep mentioning groups of four—what is so special about four? Why not create
    groups of five or three? With more than four students in a group, someone will
    not be heard and will be left out. Many teachers have found that larger groups
    create discipline problems, as students’ attention waivers. In addition, many
    times a pair of students is all that can focus and communicate on a given exploration,
    so you do not need to move chairs if they are already sitting in groups of four.
    It is so easy to pair students up without wasting time. The two pairs at a table
    will overhear each other’s discussion, which is a good thing, since it allows
    for a richer discussion. However, just having them seated appropriately will not
    teach them what effective group members do. Therefore, it is necessary to assign
    students a role in their group. This role changes daily, so they get to practice
    the thinking and interpersonal skills needed to accomplish each role.'
  merge: -1
  img_proc: true
- pgno: 152
