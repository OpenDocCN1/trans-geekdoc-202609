- pgno: 216
  md: '+   - Once these revisions are completed, or if students do not yet have writing
    partners, the teacher responds at length in writing to the daily work or final
    written published report. These responses suggest areas that need clarification
    or expansion, rethinking, or reorganization. This is usually done with non-leading,
    but carefully considered questions. However, some direct instruction can also
    occur in these writings.

    +   - A current grade is given. Students then have an opportunity to edit their
    work, both for academic understanding and clarity of communication as well as
    in order to raise their grade.

    +   - This process is repeated as many times as necessary until the student is
    satisfied with his or her grade (understanding and written communication ability).
    If students have never engaged in this process, at the beginning of the school
    year there are usually many extensive revisions, and exchange of papers between
    students and the teacher. However, as the year progresses, students begin to acquire
    both the academic reasoning abilities and the writing structures and strategies
    to clearly communicate their reasoning for each new conceptual understanding that
    they encounter.


    # Apprenticeship in Language Learning


    The apprenticeship of the *novice* subject area student to the *master* subject
    area teacher is missing in much of inquiry teaching. When the teacher is responding
    both orally and in writing to students’ reasoning about how they are uncovering
    a concept, the teacher is simultaneously teaching concepts and thinking skills
    and writing and reading strategies within the context of an academic discipline.
    Although students initially work in teams to share insights and negotiate meaning,
    the final translation of the individual student’s understandings of the conceptual
    understanding needs to be negotiated between the teacher and student through a
    *written Socratic dialogue* (Critical Thinking Community 2014). This process is
    a true apprenticeship: students create and communicate meaning as they synthesize
    their personal explorations with what is known by the larger academic community.


    This apprenticeship related to academic thinking needs to continue when asking
    students to read materials once they are immersed in their investigations as noted
    in step five (academic language) and step six (translating) of the process. First,
    they need to be assigned a variety of materials to use in their search for understanding—nonfiction
    trade books, magazines and journals, newspapers, Internet resources, and subject
    area textbooks. The teacher needs to actively model strategies that are used to
    extract meaning from various types of text. This approach involves these steps:


    +   - The teacher and students silently read a passage in class from a particular
    type of media.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '+   - The teacher then reads the piece aloud, narrating his or her meaning-making
    strategies, as he or she moves from sentence to sentence or paragraph to paragraph.


    This procedure allows students to see the thinking process that occurs, and how
    strategies such as activating prior knowledge, previewing, and predicting, are
    used in extracting meaning and connecting it to schema that you already have in
    your brain. If teachers have not done this before, there are extensive examples
    of this and other modeling strategies in Allan and Miller''s *Literacy and Learning
    in the Content Areas* (2005), including specific examples in each subject area.


    In this approach, where we are encouraging students to be thinking about their
    thinking, we are speaking about *metacognitive awareness*. We are asking them
    to create schema and strategies for learning and supplying them with tools and
    the opportunity to practice these in a written language form within the context
    of doing and learning an academic discipline. We need to be explicit with them
    about what the literacy strategy is and does (*declarative knowledge*), when and
    why to use the strategy (*conditional knowledge*), and how to use the strategy
    (*procedural knowledge*). There is no disconnect between the understanding that
    evolves from actual academic explorations and the writing and related reading
    that follows in communicating the synthesis of these understandings. The process
    is continuous.


    If we follow this process, we will have students whose reading comprehension level
    will be *interpretive* and *applied* readers, rather than *literal* readers (Herber
    1978). *Applied* readers can synthesize text information with background knowledge
    to extend existing schema knowledge. These students will not only do well on standardized
    tests, but they will truly be academically literate. Focus on being an effective
    inquiry teacher where students are exploring academic concepts most days. Be sure
    to respond to their ideas in class, respond extensively to their writings, and
    expect them to revise their writings and thinking. Be explicit about modeling
    reading and writing strategies as they apprentice to you as you all engage in
    doing and learning together.


    # Success in School for Second Language Learners


    Second language learners'' development of social, instructional, and academic
    language, a complex and long-term process, is the foundation for their success
    in school. Students'' access to instructional tasks requiring complex thinking
    is enhanced when linguistic complexity and instructional support match their levels
    of language proficiency. The Inquiry Teaching Learning Cycle, with its effective
    access to higher levels of thinking and unique applications for formative assessment
    while allowing for individualization of linguistic complexity, is a most effective
    route to success for our second language learners.'
