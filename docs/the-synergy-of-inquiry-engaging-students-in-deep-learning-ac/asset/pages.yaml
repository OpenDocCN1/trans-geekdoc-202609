    and organize data<br>• Question |

    | • Classify<br>• Measure | Compare and contrast | • Compare and contrast<br>•
    Question | • Classify<br>• Measure<br>• Test |

    | Classify | Categorize | • Label<br>• Classify | • Define<br>• Record<br>• Analyze
    |

    | Use space/time relationships | • Follow chronology<br>• Use timelines | Use
    time, events, life cycles, dates, sequence | • Use relationships<br>• Compare<br>•
    Revise |'
