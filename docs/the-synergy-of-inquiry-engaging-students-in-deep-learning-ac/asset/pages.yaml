- pgno: 219
  md: '10. When at the application stage of the inquiry learning cycle, teachers can
    design unique application assessments at the appropriate level of English proficiency
    for the second language learner.


    11. If teachers are doing ITSLUs, common language will be used in multiple subject
    areas and be reinforced with less new academic vocabulary being introduced on
    a daily basis. This cross-disciplinary approach provides for vocabulary and syntax
    depth rather than breadth. Furthermore, since ITSLU themes and social dilemmas
    are universal, the materials will be engaging to students no matter what their
    culture. However, this will allow the student to express and clarify their culture’s
    differences in dealing with a certain type of interpersonal or political interaction.


    Zwiep and Straits (2013) report the findings from a four-year project that blended
    inquiry taught academics and English language development involving over 2,000
    urban K–5 students. Their findings are consistent with the preceding description
    of how inquiry teaching supports second language learners. The authors note


    > Teachers stated that after participating in the program they were more focused
    on how they structured their lessons (questioning strategies, concept sequence)
    and less on the EL label of the student. Many teachers described a new awareness
    of how limited English proficiency does and does not impede student learning.
    Teachers grew to understand that their students can have a deep knowledge of the
    academic subject but be limited in their ability to express that thinking by their
    language proficiency, and even though EL students need language scaffolds and
    supports, the rigor of the content should be maintained.


    (Zwiep and Straits 2013, 1329)'
