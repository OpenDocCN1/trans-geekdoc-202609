- pgno: 95
  md: 'Most of the time, one of the students will bring up how when they did surface
    area of the outside of similar rectangular prisms the outside surfaces had one
    centimeter grids drawn on them. By asking how this might help them measure what
    is inside, students will say what they need are little boxes to put inside, that
    way there will not be spaces between them if they put them in neatly one atop
    another.


    Earlier Carolina used one clear plastic open-topped box so that students could
    see that when filled with beans, there are spaces between them, but when using
    the one centimeter cubes that she has, they can fill the space without gaps.


    She gives each group a set of cubes to fill their boxes to see which box holds
    the most. However, she does not give them enough to fill every box, so they need
    to figure out a way to extrapolate beyond the level that they are at in the unfilled
    boxes. They soon realize that once they have a filled the first layer, they can
    see how many layers there are in the box by stacking just one cube atop another
    and multiply the number of layers by how many cubes are in each layer. Figure
    2.9 shows the boxes students used to figure out the problem.


    # Figure 2.9 Manipulatives Used by Students to Develop the Concept of Volume


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_95_0.png)'
