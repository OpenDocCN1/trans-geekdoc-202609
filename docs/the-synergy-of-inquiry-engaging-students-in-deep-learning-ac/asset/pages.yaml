    # Access to Physical Materials


    Having students manipulating materials is a must do in effective inquiry teaching.
    Think back to your child or adolescent development class during your teacher-preparation
    program. Understanding students’ brain development is crucial in being successful
    with their learning. You might remember that Jean Piaget was one of the pioneers
    and most important individuals in understanding this development. However, it
    was a while into my own teaching career before I truly understood the importance
    of having students manipulate materials. Piaget and Inhelder (1969) did not say
    it is a good idea for students at the preoperational or concrete-operational stages
    to manipulate materials so that they can learn. They said students have to manipulate
    materials in order for them to learn anything of consequence. Sure, they can memorize
    facts for a few hours to pass a quiz. However, in this era of Common Core and
    21st century skills, the findings of Piaget (1963), Bruner (1973, 1996), and all
    the developmental psychologists since (Elkin 1976; Flick 1995) can no longer be
    ignored. The notion that students have to manipulate materials was one of the
    most sobering realizations that I ever had to face as a classroom teacher. Once
    students had materials in their hands that they were using in a meaningful way
    a majority of the week, not only did they learn more deeply, but also their behavior
    and attitude about putting effort into learning changed for the better.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/1ab167431007ad5d5eacf64bb7a71ad1_34_0.png)


    # Thinking Space


    # Teacher Talk


    # Common Core State Standards (CCSS) and My Planning


    Reflect on your recent experiences with implementation of your state language
    arts standards and the move to implementation of the Common Core State Standards.


    +   - To what extent are you familiar with or implementing the CCSS? What is (or
    has been) your reaction and that of your colleagues to the Common Core?

    +   - In what ways do you think the Common Core will impact your planning and
    instructional practice?

    +   - What type of support is being provided to enable your successful transition
    to new standards?

    +   - Do you already use inquiry-teaching strategies? If so, which of your current
    strategies are consistent with the expectations of the Common Core?


    # Access to Physical Materials in Practices: *Eighth-Grade History Lesson*


    It is one thing to memorize when, where, and what occurred during John Brown’s
    raid just before the Civil War. It is another thing to realize that historical
    accounts of what and why it happened are all about point of view of the author
    of the text. Whether you are studying this in the sixth or tenth grade will also
    determine the level of complexity of the historical ethics that students are expected
    to comprehend. The teacher, Mike, involved in this lesson is not only having students
    “doing history,” but he is also responding to the Common Core expectations for
    reading complex nonfiction texts.


    However, Mike has been practicing effective inquiry teaching long before publication
    of the Common Core State Standards and has been addressing the same expectations
    as part of the inquiry plans. So instead of telling the story of John Brown’s
    Raid when the class reached that era in history, Mike created as much of a hands-on
    exploration as is possible in history. As a result, the previously disengaged
    students became completely engaged.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Prior to this lesson, with the permission of his principal and the parent’s
    advisory committee, Mike had students out in the school yard pulling 100 pound
    “bags of cotton” for 50 yards on a 90 degree day while doing squat thrusts every
    20 feet to simulate what it was like to be a slave and pick cotton. Students did
    this for 15 minutes and then discussed what it would be like to do this for 10
    to 12 hours a day, six days a week, starting when they were eight or nine years
    old and doing it for the rest of their lives.


    Next, students worked in their small groups. Each of the groups had a copy of
    one of five original accounts of the raid from October of 1859. Using the ideas
    they unpacked from the text of the primary source document they were assigned,
    students were challenged to create a one-minute newscast that they videotaped
    using a mobile device. At the beginning of the next class, these newscasts were
    played back to the whole class through an LCD projector. Students began to respectfully
    critique each other’s accounts, saying that the others had misinformation or were
    looking at the situation in a really biased way.


    Mike had gone to the Library of Congress and the U.S. National Archives website
    and found five documents, each with a different perspective. One was from a northern
    abolitionist-leaning newspaper. Another was from a local West Virginia newspaper.
    Yet another was from an inflammatory writer in a South Carolina paper. The other
    two were more middle-of-the-road writers, but each took at least one point of
    view on one of the many complex ethical issues involved. After this back and forth
    in class, students went home and were asked to imagine they were a teenager living
    in 1859. Each of them was assigned a different situation.


    Some of them were white, some African-American; some from the South, some from
    New England; some rich and some poor; some free and some slaves. They were to
    write down how they would feel about this “civil disobedience.” The next day,
    Mike paired each of them, and one by one they had three minutes to role-play a
    discussion they might have if they had met and chatted. The teacher had various
    hats, scarves, and tools as props that each student could use. Out of the discussion
    of “right and wrong,” “fair and unfair,” and “legal or not legal,” grew most of
    the issues that Americans were facing before the Civil War, how those led to the
    war, and how it even might have been possible to avoid it. The majority concrete-operational
    students were able to do complex formal thinking because of their “concrete” manipulation
    of primary source documents and through role-playing of “real teenagers.”'
