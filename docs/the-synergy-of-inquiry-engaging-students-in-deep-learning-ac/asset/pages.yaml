  md: '# Acknowledgments


    So many of the ideas about effective learning and teaching in this book came from
    a lifetime of experience working with others. If you are familiar with any of
    the people listed below, you will be able to hear their voices ring out loudly
    at various places in the text. However, before I get to the litany of colleagues,
    I must credit above all others Terry Born with whom I co-planned and team-taught
    in the same classroom for over a decade. We co-directed and produced student-written
    plays, literary magazines, oral history books, and community newspapers. Countless
    numbers of effective practices that appear in these pages, I learned from carefully
    observing her interact with our students. She really is a virtual co-author. Then
    there is the rest of my amazing support network.


    I first learned how to “figure out how to figure out” from my older brother Ken,
    while learning perseverance and resilience from my parents Rudy and Edna Jablon.
    My first role model for what a truly dedicated teacher is, who worked with the
    whole student, was one of my own teachers, Brother Walter Doyle. Professor Fred
    Geis, my first doctoral advisor at NYU, supplied my first clinical and theoretical
    understandings of inquiry teaching. Arthur Greenberg and CeCe Cullen, principals
    at the original Middle College H.S. in Queens, NY, supported Terry and me and
    the rest of the faculty in trying new and somewhat radical ideas that led to success
    with our students. Burt Rosenberg had the perspicacity to create the distributed
    counseling model at the high school that I describe in Chapter 3. In similar fashion,
    I was deeply supported by Dean Madeleine Grumet at Brooklyn College, CUNY and
    Dean Bill Dandridge at Lesley University where I was given the opportunity to
    create innovative courses and programs with inquiry at their core for K–12 teachers.'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'Without the brilliant insights and collaboration of Arthur Camins, in his role
    as district curriculum supervisor and co-director on many of our NSF funded grants,
    my education about implementing inquiry teaching in whole school districts would
    be much more limited. Likewise, Diane Varano, Andrea Egitto, and Karen Buonomo,
    my cofounders and collaborators of the Children’s Science Materials Workshop,
    along with Dolly Lau, Ingrid Thomas-Clark and the other facilitators, inspired
    me to pursue successful inquiry professional development.


    Cecily Selby, chairperson of my dissertation committee, supported a rather radical
    10-year study that few others understood. Janice Koch, Pamela Abder, and Meta
    Van Sickle, three science education professors and colleagues from across the
    country, pushed me to deeper understanding of inquiry teaching. Without the incredible
    energy, commitment, and feedback from all of my students of the last four decades,
    especially those in the BONGO Program, I would not have been able to make inquiry
    teaching the success it has been in our classrooms.


    Sara Johnson and her team at Shell Education, especially my gifted editor, Joan
    Irwin, have made this a much more accessible publication. First drafts of each
    chapter were read by a volunteer group of teachers and principals who provided
    thought-provoking feedback. I am grateful to all of them, but especially Bill
    Cummiskey and Carolina Vila who were consistently vigilant with their insights
    and edits.


    My three best friends, Stuart Siegelman, Rick Rippetoe, and Harold Greenspan have
    supplied the emotional and intellectual assistance when needed through these past
    44 years of teaching. Finally, I need to thank Scott and Nicole, my two teenage
    children, for their love and support over the past three years as I worked too
    many of their days and nights on this manuscript. They make my life such a joy.'
