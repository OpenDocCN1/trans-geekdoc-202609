  img_proc: true
- pgno: 127
  md: 'My personal challenge as a teacher is to permit room for wonder. In teaching
    a unit on the play *Inherit the Wind* (Lawrence and Lee 2003), a retelling of
    the Scopes monkey trial in 1920s Tennessee, my culminating activity has involved
    students formulating, and then exploring, a question about which they are still
    wondering after they complete the play. *Inherit the Wind* is rich in areas where
    student curiosity can be triggered, from questions of law and First Amendment
    rights, to religion in the American South, the theory of evolution, the role of
    media in the early 20th century, and the differences between the play and the
    actual trial. I teach at an Orthodox Jewish day school, where a number of students
    dig far deeper than I require because they want to get to the bottom of how Judaism
    reconciles Genesis and evolution. For those students genuinely interested in such
    questions, they are off and running. Here is what I find does not work: When I
    present students with a long and varied list of possible questions about which
    they might be wondering, then suddenly the assignment mutates from one truly driven
    by inquiry to one where they are simply selecting a choice from a teacher-approved
    list. I can see the difference in their motivation, or lack of, as they either
    enthusiastically or dutifully track down leads.


    Clearly, I can benefit from the collaborative thinking of other teachers as I
    seek to fine tune assignments like mine for *Inherit the Wind*. That is why I
    am so pleased that my school has finally recognized the problem of “learned helplessness.”


    # Nora Burnett’s Reflections


    Inclusion plays a significant role in any successful heterogeneous classroom.
    It has been my experience that choice and group work are two key strategies to
    use when working with students who have different levels of ability and/or motivation
    regarding the specific content of a course (in my case, English language arts).


    Choice has several benefits:


    +   - It allows students to take ownership of their learning.

    +   - It enables them to express their learning in a manner which is meaningful
    to them.

    +   - It provides flexibility in the way in which we, as teachers, assess student
    learning.


    I am by no means saying that teachers should completely turn over their classrooms
    to their students, but by incorporating some choice, students with'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'varying degrees of motivation or skill are more likely to become engaged in
    their learning. In addition, I often get a better picture of students’ abilities
    when I provide choices in how they demonstrate their knowledge.


    Similarly, I have found that group work is an excellent way to respond to, and
    support, different student abilities and learning preferences. In groups, students
    learn from another teacher—a peer. Students have a great knack for rewording concepts
    that a teacher has introduced. When students reword, it not only demonstrates
    their own knowledge, but it also reframes the idea so that


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_128_0.png)


    # Thinking Space


    Thinking about Maslow’s hierarchy of needs, consider whose opinions students value
    more, that of their peers or teachers.


    +   - Ask yourself how an authentic audience relates to Maslow’s hierarchy.


    someone else, who may have missed it before, can grasp it. Group work also allows
    a safe environment for different kinds of students. It gives students a platform
    to try out ideas and gain confidence prior to whole-group discussion.


    # Pause, Think, and Reflect


    It is important to note that working within a group is a skill that needs to be
    practiced. Being able to work together so that everybody plays some role is so
    crucial, yet people often take it for granted. Though students can find it frustrating,
    it is a skill that must be taught and supported. Prior to the lessons shared below,
    the classes discussed group work, focusing on questions such as: What are the
    different roles within a group? What does respectful listening look like? Is everyone
    using everybody’s names in the group? Why are we doing the group work? What do
    you, students, expect from the group? What are your expectations for each other?


    I have two examples of how I have used choice, group work, and other tools, to
    help with inclusion—one from my ninth-grade English class and the other from my
    eleventh-grade British Literature class.


    # Ninth-Grade English: Short Story Pre-Teaching


    My ninth-grade class recently started a unit on short stories. One of my goals
    was for students to learn about indirect and direct characterization. The indirect
    characterization would require students to make inferences, a skill that I have
    found particularly challenging for ninth graders, especially when it comes to
    recognizing'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'when they have made inferences. Technology is one tool I use all the time,
    and for this lesson, I drew on one of the seemingly infinite ideas available online
    from other teachers (Kratter 2014). I adapted a *prezi* lesson using Pixar Short
    Films as a means of teaching short story elements. After explaining specific terms,
    we watched a Pixar Short Film (Pixar 2012) and applied those literary terms. Because
    there is often no dialogue in the Pixar Short Films, they are particularly useful
    for teaching about inferring character traits and other story elements. Furthermore,
    the work did not involve reading text, and so students who were less confident
    in their reading abilities were not intimidated. Their homework that night was
    to identify the elements in a Pixar Short Film that we had not watched in class.
    That is where choice came in. I posted nine links to various films and students
    could watch and reflect on any of them for their homework. The next day, students
    came in discussing the videos. I grouped them by the video they watched. They
    went over what they thought about characterization. Students were engaged and
    made insightful judgments when it came to direct and indirect characterization.
    They had successfully applied the terms to their own video. What is more, their
    motivation was apparent as I listened to them sell their video to students in
    the class, encouraging others to watch the video they had selected. Once we began
    reading a short story, they all had confidence in their ability to identify indirect
    and direct characterization, and furthermore to recognize when they were making
    inferences about characterization within the text. This lesson supported inclusion
    by utilizing choice, technology, and small group work which led to all ninth graders
    not only being engaged, but learning and using elements of short stories.


    # Eleventh-Grade British Literature: *Frankenstein* Mock Trial


    An example of how I use choice as a final assessment is drawn from my *Frankenstein*
    unit in eleventh grade. For this unit, I used multiple assessments: an exam, a
    writing assignment, and a project. The project portion was a mock trial. Students
    were randomly assigned roles (lawyer or witness) on the prosecution or defense
    team, but they had the option of switching roles with a willing peer. Once the
    teams were finalized, students began working as a unit with a shared goal. Each
    team had roughly four lawyers and four witnesses. The teams had to either defend
    or prosecute Frankenstein, who is charged with criminal negligent manslaughter
    for having created and then promptly abandoning a creature who went on to murder
    several innocent people. I provided students with computers, and they created
    a Google Doc for their own team. This allowed individual students to not only
    work specifically with their witness/lawyer, but also to work collaboratively
    as a unit. Students wrote their questions in the Google Doc, and everyone on the
    team could view and edit them. This was great because members of the team aided
    students who were not as confident or capable. Students became engaged, bouncing
    ideas off one another until all were satisfied not only with their own'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'questions and answers, but with that of their entire team. While I monitored
    the groups, the case was entirely in their hands, their line of questions completely
    up to them. Additionally, I removed myself from the jury and acted solely as judge.
    I did this for two reasons. One, their grade was not based on who “won” the trial
    but on how they presented their case. By acting as the judge, it allowed me to
    focus more on their questions, use of the text, and so on. I had a rubric that
    I completed as each student participated in his or her portion of the trial. The
    jury (about nine people) was made up of the principal, the head of the English
    department, two aides (for moral support for some specific students within the
    class), and students who had taken my class the previous year and thus were familiar
    with the proceedings. The jury composition created an authentic audience for students.
    Having an audience other than me increases engagement for students and helps them
    to take it more seriously since it seems more real. The mock trial was a hit and
    students of all abilities were motivated, competitive, and showed what they knew
    about their text and the law system, in an interesting and engaging manner.


    # Final Thoughts


    Choice is not always easy to work into a lesson or unit. In my classroom, choice
    sometimes takes the form of options, both for students and me. I never have a
    single final assessment because that rarely gives a clear picture of what students
    know and what they can do with such knowledge. A heterogeneous class is comprised
    of students with different skills and interests. I have found that students engage
    more when they have some control over what they are doing. In the short story
    unit, they chose their movie, utilized technology, and interacted in small groups.
    I heard students talk who never participate during large group discussion. As
    with the mock trial, they too had an authentic audience comprised of their peers.
    They were not discussing the video to impress me; they were showing each other
    what they had learned and why the others should see that film. During the mock
    trial, students who really struggled with the text demonstrated their understanding
    of the novel when they worked with their team and then took the stand.


    # Heidi O''Donnell''s Reflections


    *Up until this point, teachers’ descriptions have focused on short-term guided
    inquiry experiences. In the section that follows, Heidi O’Donnell describes a
    long-term “open” inquiry experience she has perfected over the past seven years.*


    Inquiry science has been a focal point of teaching for me since I started seven
    years ago. It is ever evolving in my classroom as I have taught a number of grades'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'and subjects. This year, I am splitting two sections of seventh-grade science
    and two sections of eleventh-grade college prep chemistry, whereas last year I
    had three sections of seventh-grade science and one section of eighth-grade science.
    The process has been stop and start in many ways.


    Although the year-to-year development of inquiry-science projects has been interrupted
    for me, there is one large overarching project that I have been able to facilitate
    every year for the past seven years with my seventh graders. It is called “Little
    Jars of Crud,” or LJOC. I believe I have been able to improve this project a little
    bit every year, and after seven years, I am really impressed with the student
    learning, output, and understanding of the scientific process that results from
    completing this project. I hesitate to say “complete” because I hope students
    continue their learning with this project after it ends, and I believe it allows
    them to explore further on their own, as they desire.


    LJOC is the project associated with the middle school unit on the classification
    of life. Students learn how and why life is classified as well as the characteristics
    of the kingdoms and phyla and what is necessary for an organism to survive. They
    become familiarized with the science skill of classification themselves and try
    to identify species. As students are reading the textbook and doing activities,
    the overarching project is introduced. Sometimes I even start it right on the
    first day of school. In pairs, students put grass and water in a baby food jar
    and a few days later look at a sample of the water under the microscope. It is
    *teeming* with life! This is the *hook* that grabs their attention. They immediately
    want to know about the creatures. I refuse to tell them, and actually do not tell
    them even months later. They must come to the understanding themselves as we begin
    going through the characteristics of the different kingdoms. Long story short,
    between all the groups in the class, they will inevitably see a species from all
    five kingdoms (if you count both bacteria types as one kingdom)! This is fantastic
    for me as a teacher and them as students. After the hook, we do a brief review
    of the scientific method, and students are asked what questions they have about
    the LJOC. This leads to the creation of investigable questions. Students then
    pick a topic they’d like to research, such as “What is the effect of different
    types of soap on the life in the jar?” They create a controlled experiment to
    answer the question, make up the necessary jars, observe them over the course
    of a month, then analyze their data and write a lab report. When the data is synthesized,
    we take a class period to do a round table discussion to share the results. In
    this way, all students can hear what was researched (everyone has a different
    topic) and decide the answer to the questions of “What is the effect of ________
    on the life in the jar?” Obviously there is a lot more detail involved in how
    all of those steps are done, but the way I run it, it is all student-driven.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'The result of this two-month overarching inquiry project is that students come
    away with a deep and self-sufficient understanding of how to use a microscope,
    create a controlled experiment, understand the characteristics of the different
    kingdoms, and the diversity of life in general, know what conditions are good
    (and not so good) for certain types of life, and understand how to identify different
    organisms. An inquiry science project is the necessary tool to bring together
    all of the facts or book knowledge they are learning and make it real. I do my
    best throughout the experiment to make many connections to the community and each
    of their projects, so students realize there are real world implications of what
    they are doing. Two examples of possible extensions of this project would be to
    look at water quality in their towns or to compare well water to water piped in
    from a reservoir.


    I think the takeaway message for me is that inquiry science is essential to learning,
    and if taught correctly, is the most effective way of teaching. Another takeaway
    message is that the more time a teacher has to create and refine these inquiry
    projects, the more students can gain from them. Creating meaningful inquiry lessons
    takes a lot of time and creativity, and it can be hard to come up with something
    from scratch, so teachers should use their resources, as well as be given time
    to do so. It is not necessary to reinvent the wheel, but a teacher may have to
    sand it down a little to fit correctly into his or her own classroom. Teacher
    collaboration, the Internet, and professional networks such as NSTA are excellent
    sources for ideas and sharing.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_132_0.png)


    # Thinking Space


    +   - What does Ogawa’s quote say to us about teaching and learning mathematics?

    +   - Is this how you have thought about mathematics?

    +   - How secure do you feel about teaching mathematics?

    +   - Can your students come to have a positive, even awe-inspiring emotion about
    mathematics?

    +   - Can inquiry-based instruction be a catalyst to helping students appreciate
    mathematics?

    +   - Do you think inquiry teaching can be a solution to effective mathematics
    instruction at all levels?'
