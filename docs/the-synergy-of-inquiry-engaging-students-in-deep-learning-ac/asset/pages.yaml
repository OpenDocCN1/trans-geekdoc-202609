  img_proc: true
- pgno: 81
  md: 'than it occurred when I observed it in her classroom, because I was so amazed
    by her planning of the inquiry teaching lesson and then the facilitation of it
    by a first-year teacher. However, by the time she taught the last class of the
    day it truly was masterful.


    Let us take a minute here and go back to Maria’s planning stage. Once she created
    and planned this sequence of exploration and concept clarification, she realized
    that three thinking skills were most prominent during the exploration:


    +   - **Observation**—close and thoughtful scrutiny of materials

    +   - **Inference**—based on evidence from careful observations

    +   - **Model making**—using careful data collection and inference making


    Likewise, she realized she could push students to realize that they were using
    two particular habits of mind. She could then encourage them to continue to use
    these habits of mind in their daily lives and give them examples of where they
    could be used as they were watching television during the past week. These were:


    +   - Be curious. Be careful and accurate in observations.

    +   - Know that often different explanations can be given for the same evidence,
    and it is not always possible to tell which one is correct.


    Given the focus for subject area teachers to work on literacy skills, she also
    included an essay-writing assignment later in the lesson. She did not originally
    have an art subject area objective listed, but when she reflected on the lesson
    after she taught it, she modified her plan so that the next year she taught the
    lesson she could focus on building the skills of her artistically talented students,
    and could encourage all of her students to be as detailed and accurate as possible
    in their renderings. The objectives for the other subject areas were:


    +   - Recognize not only careful and accurate drawings but also the true artistic
    abilities of gifted students.

    +   - Have students create a well-reasoned and clearly-written three paragraph
    persuasive essay to defend their conclusions about how cell division occurs based
    on their research teams evidence.


    # Step 6: Create a Rubric that Defines Specific Levels of Student Achievement


    Once Maria created the objectives and plan for the exploration and concept clarification
    stages, I challenged her to create a rubric for her own use in assessing where
    each student was on their continuum to mastery. After a few back and forth iterations
    between us, she created a three-level rubric. Figure 2.7 shows the rubric for
    three levels of student performance—novice, competent, and expert.'
