  img_proc: true
- pgno: 31
  md: '# Problem Solving


    “What is your thinking so far?” not “What is the answer?” are concepts central
    to the inquiry teaching and learning process. As noted earlier, concepts cannot
    be taught; they need to be learned, that is, constructed by the student. Creating
    deep understanding requires that students actively engage in figuring out—problem
    solving. Asking students to focus on what they understand so far, rather than
    asking them for the right answer, introduces them to metacognitive learning. They
    begin to take ownership and responsibility for being competent, successful learners.
    They realize that persistence on their part is rewarded, even if they have not
    totally mastered a concept. Their peers and teacher are always there to support
    and assist them through their journey with their thinking.


    # **Problem Solving in Practice:** *Second-Grade Thinking in Action*


    Migdalia spent most of first grade hiding quietly behind the student sitting in
    the row in front of her. Her first-grade teacher constantly asked students in
    the class for the right answer to questions that she posed in each of the subjects.
    Migdalia was rarely sure of her answers, so she hardly ever raised her hand. The
    few times she did, she usually did not have the right answer, so she raised her
    hand less and less so as to not embarrass herself in front of the whole class.


    However, this year in second grade, Migdalia’s teacher, Diane, has always asked
    students for their thinking so far. Since students work on their explorations
    in small groups of four, Migdalia gets to try out her thinking as she manipulates
    materials in front of only a few people. The others in her group try out their
    ideas too, and they then try to come to the best thinking they can. Whoever is
    the designated reporter for the day then reports out to the rest of the class
    the group’s thinking. Now when Diane asks for volunteers during whole class discussion,
    Migdalia regularly raises her hand because the teacher is not interested in hearing
    her right answer, just her best thinking. Little by little, as the term goes on,
    the other students also start listening closely to each other’s best thinking
    and begin to seriously negotiate ideas. The teacher does have the eventual goal
    of the “right” answer, the concept or skill we want each of the students to own,
    but realizes that this is the most effective way to reach that objective.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Observations About Problem Solving in Practice


    The whole classroom takes on a supportive atmosphere where everyone becomes interested
    in “figuring out how to figure stuff out.” This leads to students feeling safe
    in acquiring high-level thinking skills and deep conceptual understanding.


