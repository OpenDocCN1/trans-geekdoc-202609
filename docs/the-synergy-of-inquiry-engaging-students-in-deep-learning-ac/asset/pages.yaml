- pgno: 72
  md: "# Step 3: Identify the Main Concepts to Be Learned in the Lesson\n\n# What\
    \ We Were Thinking\n\nMaria had already done all of the yearlong and unit planning\
    \ when we began planning the mitosis lesson. This lesson logically fit into the\
    \ unit on nutrition and exercise mentioned earlier as here is where students begin\
    \ to need both microscopic, and even molecular understandings of genetics to answer\
    \ their questions about how growth and repair occurs. At this point in the unit,\
    \ students realize that they need to understand how organisms grow at the cellular\
    \ level. Similarly, they realize this study would help them understand how their\
    \ skin heals from a cut.\n\nUnderstanding what Maria did with students before\
    \ this lesson will allow one to see how students can build on the prior knowledge\
    \ they had created in previous inquiry learning cycles earlier in the term.\n\n\
    Students’ engagement with topics of social importance provided them with opportunities\
    \ to create questions and begin to form concepts to prepare them for the study\
    \ of mitosis. A summary of these activities follows:\n\n+   1. **Garbage Unit:**\
    \ During the garbage unit, students grew plants by germinating kidney bean seeds\
    \ in plastic baggies filled with a moist paper towel. They designed all sorts\
    \ of experiments to test their self-created questions about the need for light,\
    \ lights of different colors, particular temperatures, certain gases, and the\
    \ effects of each of these on root length, leaf size and color, and many other\
    \ factors.\n+   \n+   2. **River Unit:** During the river unit, students looked\
    \ at river and pond water first with a hand lens and then with a microscope. They\
    \ observed both single-celled and multicellular animals and plants. Many of the\
    \ animals were darting around the water, so it was difficult to see them clearly.\
    \ When students looked at the plant cells of algae in the water, they saw some\
    \ of the structures in the cells but did not go beyond identifying the nucleus\
    \ and the green chloroplasts. They also viewed their own cheek cells stained with\
    \ a nuclear stain.\n+   \n+   3. **Heredity Unit:** During the whole term, students\
    \ had watched gerbils reproduce in tanks in their classroom. The offspring of\
    \ a male with a white female was a mixed litter. Some were brown, some white but\
    \ others were black or golden. This was true with other breeding pairs where the\
    \ offspring were not always the same as their parents. The class had an ongoing\
    \ discussion of how this might be happening and were seeing if they could predict\
    \ with accuracy what the fur color of the next litter would be given the history\
    \ of the fur color of the grandparents and great-grandparents. Students had also\
    \ extracted DNA from a banana, and used the mouth to uncover what it was and how\
    \ it worked. So the concept of heredity was purposefully unclear at this point,\
    \ but it was one of great interest to them."
