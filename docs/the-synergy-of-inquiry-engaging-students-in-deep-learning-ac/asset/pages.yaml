- pgno: 101
  md: '# # Protocol for Transforming Lessons to Inquiry Teaching


    As noted in Chapter 1, many activities teachers have traditionally used serve
    as confirmation for students after they have been *told about* some conceptual
    understanding, historical event, writing or reading skill, or strategy for problem
    solving. We have come to understand that students need to *construct* knowledge
    if they are to have any deep understanding and retention of concepts, or insight
    into the nature of inquiry in an academic area. They need to first explore the
    phenomenon through some type of inquiry exploration that allows them to negotiate
    ideas with their teammates, construct naïve conceptions of the phenomenon, and
    especially, identify and relate the factors relevant to the phenomenon. Then they
    are ready to hear what the larger academic community knows about the phenomenon
    under study. While doing this, students also acquire thinking skills and problem-solving
    skills that empower them as learners for a lifetime.


    However, many times teachers have used lessons that have some useful elements
    and wish they would not have to abandon these lessons completely. These educators
    would like to *transform* these confirmation experiences into inquiry explorations.
    Unfortunately, making the change is not that simple, and the exploration portion
    is only one part of the process.


    Educators need to take the whole didactic package of lecture and confirmation
    experience and transform it into an inquiry teaching and learning experience;
    where explorations that are focused on concepts, thinking skills, and habits of
    mind are commingled with negotiation, construction, and introduction of models
    that describe the phenomenon. These explorations by small groups of students,
    in which they create understandings and negotiate ideas, must come first. In science
    and mathematics, these almost always involve manipulating physical materials or
    model making. In social studies, role-playing, comparing primary source documents,
    or interviewing real people are typical activities. Role-playing, comparing various
    types of literature, and writing in various modalities for specific purposes are
    familiar activities in language arts classes.


    Although inquiry teaching is an iterative process where when you get to a later
    step you often go back and modify the first step, teachers have found the progression
    of steps in this protocol to be useful.


    Think back to the process Maria followed in developing and implementing the lessons
    on mitosis. The following description expands on the steps in that process.


    +   1. **Identify five to ten big ideas for the whole course.**

    +      - What is the big concept that I expect students to have mastered to some
    degree during this inquiry teaching experience?

    +   2. **Identify the sequence of topics, concepts, skills, and social issues
    for the year.**'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   - Does this lesson answer some aspect of the essential, or better yet,
    driving question for the unit? Is it clear to students in the transition from
    the last lesson what question needs to be answered next?


    # 3. Identify the main concepts to be learned in the lesson.


    +   - Is this concept one expected either from national or state standards for
    the grade level of my students? What is it?

    +   - What are the specific aspects of this big concept that students will learn
    during this particular lesson? What are the factors involved in this particular
    aspect of the concept?


    # 4. Identify the initial idea for an exploration where students can uncover the
    whole concept, or at least part of the concept, without the teacher or media doing
    any telling about the concept.


    +   - Can students witness a physical manifestation of the phenomenon, or perform
    an initial exploration from which they can design an investigation or identify
    factors involved in the phenomenon?


    This is the key step in transforming didactic, transmission lessons to inquiry
    teaching lessons where students uncover the concept through an exploration, just
    as academics throughout history did.


    +   - How much do students get to manipulate materials during this initial exploration
    phase?

    +   - How much needs to be done as drawing visual models?

    +   - Can students use primary sources?

    +   - How much can be done with role plays or simulations?

    +   - Does this exploration have the appropriate factors involved in a way that
    students can intuit the relationship between factors in the concept and possibly
    even create a generalization from their experience?


    Once you as the teacher identify the factors involved in the phenomenon, look
    at the exploration that you have created and see if students can:


    +   - design all or part of the investigation needed to find out the answer to
    the question.

    +   - identify the factors involved in the phenomenon, concept, or skill so they
    can partially design the approach to finding an answer.

    +   - hypothesize possible relationships between factors.

    +   - begin to understand how particular approaches to problem solving work in
    particular situations, and can begin to see how they might be used in analogous
    situations.'
