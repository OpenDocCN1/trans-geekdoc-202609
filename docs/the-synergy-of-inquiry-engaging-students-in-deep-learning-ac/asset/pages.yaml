  md: 'In implementing this step, you need to consider how to structure the class
    and determine what students will do with the information they collect.


    +   - Do I want students to go from solo thinking, then to groups of four negotiating,
    and finally to whole class reporting and sense making?


    +   - What will students do with data that they collect, and how will this feed
    back into redesign or concept formation?


    # 5. Given the exploration, identify the most applicable thinking skills and habits
    of mind.


    +   - What thinking skill is best cultivated by students while engaging in this
    exploration? (You may only know this after you start creating the exploration
    in greater detail.)


    +   - How can I build in a habit of mind by when and how I position this in the
    term?


    +   - What concepts and skills are students expected to already have from previous
    lessons in order to accomplish and make meaning from this exploration? Be sure
    that they have ownership of these before you do this lesson. Many times teachers
    find that there are some preliminary lessons with their requisite explorations
    that uncover these foundational concepts or skills that need to occur first. Pause
    with creating this lesson and create those preliminary lessons first, if necessary.


    # 6. Create a rubric that clearly defines student levels of *novice*, *competent*,
    and *expert* on skills and concepts.


    # 7. Create a set of assessment questions to use while monitoring groups and when
    clarifying concepts for the whole class.


    +   - What will the teacher be doing during the manipulation of materials and
    student designing of the exploration to:


    +     i. see what students understand at various points using formative assessments?


    +     ii. understand where the class overall has come, so as to best plan for
    the next day?


    # 8. Create a series of authentic applications for unique situations.


    +   - If students cannot apply the concept or skill to a real life unrelated issue,
    then they truly do not own it yet.'
