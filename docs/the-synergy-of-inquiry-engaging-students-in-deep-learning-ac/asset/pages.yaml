- pgno: 39
  md: 'students are engaged in daily explorations that include manipulation of physical
    materials, games, and creation of products that are reliant on their physical
    and thinking skills and are all carefully facilitated by the teacher, then students
    will stay truly engaged and learning will be successful. However, whenever possible
    even the activities with these elementary school students should include applications
    to their home and community life so that students begin to effectively apply their
    newly acquired skills and conceptual understandings to decision making in their
    daily lives.


    In addition, almost every skill and concept taught at the preschool and elementary
    level in every content area is something that can immediately be applied in students’
    daily lives. Mathematical concepts can easily be applied in cooking, baking, building
    with wood, sewing, sports statistics, and calculations used in daily purchases.
    All of the science concepts and investigation and decision-making skills can immediately
    be used in their daily lives. They are all concepts that can actually be viewed
    and measured with even the simplest lenses and scales. The language arts skills
    can be taught using situations from students’ lives, literature that relates to
    and expands their lives, and by creating writing that is published in books, blogs,
    and newsletters and performed in plays and songs.


    In early childhood social studies, much of the curriculum is actually studying
    the culture and local history of where the students live. In upper elementary
    social studies and in all of the middle and high school content areas, some of
    the topics studied do not immediately appear relevant to students’ lives, and
    especially to their inherent psychological needs. The study of ancient Persia
    or Japan does not appear immediately relevant. Greek or Medieval literature seems
    written in awkward language with dated characters. Calculating centrifugal force
    seems unimportant to almost every sixteen year old. Likewise, uncountable numbers
    of students have asked when will they ever need to use a quadratic equation.


    Yet each of these topics, if embedded in the right explorations, contextualized
    in challenging local projects with the appropriate large conceptual objectives
    and effective themes, can be made engaging and deeply relevant to the learner’s
    life. It is important to investigate what is relevant to early and later adolescents.
    Perhaps a better way to ask the question is “what matters to teenagers?” Before
    you read on, please take one or two minutes to write down your top two answers
    to this question. If possible, discuss these ideas with your colleagues or students’
    parents.


    # Relevance and Meeting the Hierarchy of Needs


    Over the years, I have done this exercise with thousands of teachers and parents.
    In virtually every case, the consensus has been the same. I have also done it
    with hundreds of teenagers, and they have also come to the same conclusions. Everyone
    pretty much agrees that they care most about being *accepted by a group of their
    peers* who matter to them. Secondly, they care that they can *demonstrate their
    competence* in things important to their'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'peers and important members of the community. This is different from the former
    need in that in the latter, they are *respected* for who they are and what they
    can accomplish.


    If a teacher can meet these needs while engaging students in learning, then it
    is a natural, organic process. It is what students want to do, not something that
    they must be forced to do. They will do it even if it is not required. Let us
    use the humanistic psychologists’ explanation of human needs, which is supported
    by our current understanding of brain neurobiology, to put this in a better conceptual
    perspective. In the 1950s and 60s, Abraham Maslow (1968) and his colleagues studied
    individuals who were recognized as the most mentally healthy individuals they
    knew. From this study, the researchers deduced a hierarchical set of human needs.
    Until one need is reasonably met, the others are not of consequence to the person.
    After testing this with thousands of individuals around the world, researchers
    have come to realize that this sequence of needs is *genetically programmed* into
    all humans. This matches well with our knowledge of neurobiology where the amygdala,
    the most ancient part of our evolutionary brain, is surrounded by the frontal
    cortex and other reasoning parts of the brain.


    Figure 1.4 illustrates the hierarchy of needs (Maslow 1968). You can see that
    the survival and more emotional aspects of the hierarchy are the foundation and
    therefore, always override the more rational aspects up the triangle.


    # Figure 1.4 Maslow''s Hierarchy of Needs


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_40_0.png)


    Once people have met their physiological needs—food, clothing, and shelter—then
    they have to focus on their safety needs. Homeless students keep slipping back
    into this category and cannot readily focus on anything happening in school. Safety
    needs include the ability to regularly predict what will happen in your life—not
    just your physical safety, but also your psychological well-being. This is why
    students who come from unstable homes often have a difficult time focusing on
    academics. It is why divorces that upset family routines and create constant uncertainty
    can send students into a tailspin. But among teenagers who have these needs met,
    the focus is on two aspects of adolescence—belonging and esteem. These next two
    levels of *belonging* (acceptance in a'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'group) and *esteem* (respect for competence) are where *teens must be generatively*.
    We keep asking them to be at the top level, self-actualization, where you can
    function once the other levels are sufficiently fulfilled, but of course adolescents
    do not have these levels filled. Nevertheless, schools generally ask them to do
    things because they will need it in the future, and not to worry about what their
    friends think. Yet, these are all things that are difficult for teenagers, and
    virtually impossible for others, to do.


    If we can run our classrooms in a way that meets these needs while students are
    engaged in explorations that uncover concepts and provide practice for their thinking
    skills, then students will want to be there. They will put more effort into learning
    than most teachers have had the opportunity to experience.


    # Inquiry Teaching in Practice


    Thirteen years into my teaching career, I turned to Terry Born, a co-teacher,
    and pointed at our classroom and said, “Look at *that*. I never imagined it could
    be this self-sustaining. They are so intellectually and socially engaged. It is
    beyond anything I could imagine.” Students had engaged in two role plays about
    an underlying theme in a piece of literature that they were reading, and they
    were working in small groups to create some two-minute theater pieces that would
    demonstrate their current insights and understandings of the relationship between
    the science and social science concepts of *evolution and revolution*. What was
    so amazing was the complete self-motivation of each group as they first intellectually
    argued with one another about the intricacies of these complex concepts, and then
    worked equally hard to dramatically convey their intended meaning. The previous
    term, a number of these students were not attending their didactic transmission
    style classes. It boggled my mind.


    # Making Inquiry Teaching Happen


    So what do you need to do in order to make this happen? Find large themes that
    matter both in personal relationships and in the academic subjects. “The right
    of the individual versus the right of society” not only is at the center of teens’
    lives, it also appears in most social studies, language arts, and science and
    engineering lessons. Similarly “power over versus power with” is something teens
    are facing every day of their lives. This concept shows up in not only the subjects
    mentioned so far, but also in various aspects of statistics and algebra. How you
    plan units that are built upon these themes is clearly explained in later chapters
    in this book.


    A quick example might be an activity following up students’ role-playing of teens
    in 1859 and the John Brown’s raid situation. The teacher might create the following
    *analogous interrelationship role play* about modern times that looks at doing
    something “illegal,” but for the “greater good.” The teacher has students play
    a group of teens who have decided to use songs from each of their MP3 players
    to create a “Fight Carcinoma”'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'CD that they will sell for 10 dollars to raise money for cancer research. Although
    this is pirating copyrighted music, students may say they paid for the download,
    and the benefit from the sales outweighs the legal issues. Some of their parents
    and friends may disagree. Because this dilemma could be one encountered in their
    daily lives and mirrors the dilemma from a long ago situation (John Brown’s Harpers
    Ferry raid), the teens can now more easily focus on this complex moral dilemma.


    # Concepts, Skills, and Habits of Mind in Practice


    Concepts, thinking skills, and habits of mind provide a framework for and are
    integral to the elements of inquiry teaching. As students participate in inquiry-based
    activities, they are practicing and learning about relationships between ideas,
    refining their thinking skills within and across disciplines, and developing habits
    of mind that enable them to become independent learners.


    Many times I hear teachers worrying about how they will be able to teach the complex
    higher-order thinking, reading, and writing skills the Common Core State Standards
    require and also manage to teach content. Likewise, with the New Generation Science
    Standards (NGSS) (Achieve Inc. 2013) teachers are concerned about how there will
    be sufficient time to teach all the science content in addition to engineering
    and nature of science skills. Teachers express similar concerns about the mathematics
    Common Core standards; they wonder about the complexity of the approach to problem
    solving and how there will be time for students to practice their algorithms.


    In each subject area scenario that follows, teachers using an effective inquiry
    approach demonstrate that all along we have been combining process and content
    since it is the way that inquiry learning naturally unfolds. Lessons and units
    have complex conceptual relationship understandings, higher-order thinking and
    decision-making skills, and habits of mind as their learning objectives. These
    skills are all acquired at the same time during the phases of the inquiry teaching
    and learning cycle—exploration and clarification—and are then authentically assessed
    during the application phases. Bill Cummiskey, who teaches middle-school science
    to inner-city, mostly bilingual students, says that in implementing inquiry teaching,
    all three objectives evolve out of the same explorations, but need to be addressed
    separately during the lessons. Bill observes, “In my lesson plans, I sometimes
    format each of these differently so that I can track which concept, skill, and
    habit of mind I am emphasizing and which is which within the lesson plan. I will
    put parts of the lesson that focus on **concepts** in bold, *skills* in italics
    and underline habits of mind.”


    # Concepts in Practice


    “A concept is a specific idea abstracted from particular instances” (Marek and
    Cavello 1997, 10). About 10 over-arching concepts should be identified in yearly
    planning for'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'a content area. Each unit should focus on specific large conceptual relationships.
    Each lesson focuses on one of these unit concepts. A concept is related to the
    process of generalization. Concepts are abstracted from experience—creating them
    is a process. Since concepts are learned, it is misleading to speak about *teaching*
    concepts. As noted earlier, the teacher’s responsibility is to design explorations
    where students can construct, with guidance and other assistance, their own concepts.
    This is what students carry away from a facilitated exploration and clarification.
    Students from PreK to fourth grade are generally preoperational and understand
    concrete concepts. For example, fourth graders studying heat understand that when
    the thermometer registers an increase it is showing that an area is hotter. However,
    a formal abstract thinker could utilize the kinetic molecular model and understand
    that the molecules are moving faster. The concrete operational learners could
    also learn this model after creating some concrete examples through explorations,
    but they do not understand it is only a model.


    # Thinking Skills in Practice


    “Figuring out how to figure out,” is my description of acquiring higher-order
    thinking skills.


    The Educational Policies Commission, established in 1961, defined “thinking ability”
    in terms of certain rational powers of the mind: “They are recalling, comparing,
    inferring, generalizing, deducing, classifying, analyzing, imagining, synthesizing
    and evaluating” (5). The commission saw these as natural innate abilities that
    must be developed through facilitated explorations.


    Since then, we have created disciplined-based thinking skills objectives in both
    our national and state standards. They are distinct for each discipline. However,
    if we look a bit more closely, we see there is also an incredible commonality
    among these disciplinary thinking skills. We will investigate these commonalities
    within the differences in detail in Chapter 2 where we look at synergy across
    the school day. Until the advent of the CCSS, the assessment of these thinking
    skills had taken a back seat to the content. Now they have finally reached equal
    footing during standardized testing.


    Some people question whether young students reason. They do reason, but they reason
    differently than young adolescents, who in turn reason differently than adults.
    For example, when we look at the thinking skills that exist within “doing science,”
    we see that preoperational students, (usually up until third grade) have the ability
    to operationalize only the *basic* “science process skills,” but these are absolutely
    foundational to the integrated-process skills that then become available to students
    as they physiologically evolve into concrete operational learners. This will be
    addressed later in the book.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Science Process Skills


    The following are thinking skills needed to do and understand science.


    The basic processes (pre-operational thinkers and beyond):


    +   - Observing

    +   - Using space/time relationships

    +   - Classifying

    +   - Using numbers

    +   - Measuring

    +   - Communicating

    +   - Predicting

    +   - Inferring

    +   - Estimating


    The integrated processes (concrete operational and formal thinkers):


    +   - Formulating hypotheses

    +   - Defining operationally

    +   - Identifying and controlling variables

    +   - Interpreting data

    +   - Graphing

    +   - Modeling


    # Habits of Mind in Practice


    When I was first introduced to the concept of *habits of mind* I had a hard time
    differentiating them from thinking skills. They seemed to overlap so much. One
    day I was working with a wonderful colleague of mine, Arthur Camins, who at the
    time was a science coordinator in the Bedford-Stuyvesant area of Brooklyn, NY.
    We were struggling with how we were going to have our elementary teachers grasp
    this important idea if we could not clearly differentiate the two ourselves. That
    night he telephoned me and said, “You can have a thinking and reasoning skill
    and can apply it appropriately when asked to do so in school. However, if you
    do not regularly use it in your daily decision making, then you have not acquired
    the habit of mind.” That seems to have not only made it clear to me but to all
    teachers we were working with. If you use the most important decision-making and
    thinking skills, even when you are not required to, then they become part of the
    fabric of your thinking.


    Some principals and teachers have decided that developing habits of mind is so
    important for students’ academic success, that they have made them a central part
    of the mission for their schools. Debbie Meier’s Central Park East Secondary School
    in New York City is probably the one most cited, but in the past decade I have
    encountered many other successful schools in New York City, Minneapolis, Atlanta,
    Buffalo, Oakland and in smaller towns in Mississippi, New Jersey, Maine, and Massachusetts.
    All these schools specify habits of mind at their core.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Meier and the K–8 teachers at Mission Hill School in Boston focus on five habits
    of mind they think are seminal to their students’ success:


    +   1. **Evidence:** How do we know what is true or false? What evidence counts?
    How sure can we be? What makes it credible to us?

    +   2. **Viewpoint:** How else might this look if we stepped into other shoes?
    What would it look like if we were looking at it from a different direction? What
    would it look like if we had a different history or expectations?

    +   3. **Connections/Cause and Effect:** Is there a pattern? Have we seen something
    like this before? What are the possible consequences?

    +   4. **Conjecture:** Could it have been otherwise? Supposing that...? What if...?

    +   5. **Relevance:** Does it matter? Who cares?


    There are many other versions of habits of mind, some which are subject-area specific.
    For example, some in science follow:


    # Experimental evidence might have more than one interpretation.


    +   1. Be open-minded, willing to change your mind in the face of reliable evidence,
    and respect another’s point of view.

    +   2. Look at a matter from many sides before drawing a conclusion. Do not jump
    to conclusions or decide on the basis of one observation; deliberate and examine
    until you are as sure as you can be.

    +   3. Know that hypotheses are valuable, even if they turn out not to be true,
    if they lead to fruitful investigations.

    +   4. Offer reasons for findings and consider reasons suggested by others.

    +   5. Know that different explanations can often be given for the same evidence,
    and it is not always possible to tell which one is correct.

    +   6. Know why curiosity, openness, and skepticism are so highly regarded in
    science and how these are incorporated into the way science is carried out; exhibit
    these traits in our lives and value them in others.


    # Gather accurate and testable evidence.


    +   1. Go to reliable sources for evidence. Challenge sources to make sure they
    are reliable.

    +   2. Avoid being superstitious; realize that nothing happens without cause.

    +   3. Be curious. Be careful and accurate in observations.

    +   4. Keep records of investigations and observations; do not change the records
    later.

    +   5. Know why it is important in science to keep honest, clear, and accurate
    records.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'You might be saying to yourself that many of these fit other academic disciplines
    as well, or that they are just traits of logical common sense people. That is
    the point. These attributes need to become part of the fabric of thinking of all
    of our students—just part of who they are as they travel through life.


    If you are thinking that this is too multifaceted and you are getting worried
    that you cannot fit all of this into your lessons, remember that all of the concepts,
    thinking skills, and habits of mind exist naturally, and organically in a well-planned
    inquiry lesson. Once you approach planning and facilitating lessons in this fashion,
    you will soon become a master at having your students succeed in each of these
    arenas. Not only will they be successful, but they will also enjoy themselves
    immensely while doing it.


    # An Example of Three Objectives Accomplished Simultaneously


    In planning the second day of the John Brown lesson, Mike planned to have a concept,
    thinking skill, and habit of mind objective incorporated when students were engaged
    in the inquiry lesson. These objectives were accomplished simultaneously while
    students explored and clarified their understanding of John Brown''s raid. They
    are listed here as they were all listed in the objectives part of Mike''s plan.
    In addition, he wrote facilitating and assessment questions throughout the plan
    for each objective.


    **Concept**: Although John Brown''s raid of 1859 was an illegal action according
    to both South Carolina and U.S. law, some saw it as an act of civil disobedience
    while others viewed it as almost treasonous.


    **Thinking Skill**: Students interpret data to recognize how evidence of historical
    events can be manipulated to present a point of view.


    **Habit of Mind**: Students develop perspective by considering how else the events
    might look if we stepped into other shoes. They learn about and understand viewpoint.


    # Apply Knowledge to New Situations


    Before we can say that students have acquired deep understanding or mastery of
    skills, it is necessary for them to demonstrate their *ability to apply* any learning
    related to objectives for explorations and clarifications to unique new situations.
    Once again, in inquiry teaching and learning, this assessment is built right into
    what the teacher and students are already doing. Everything that you have ever
    learned about effective formative assessment that occurs on a daily basis and
    informs lessons for the next day is organic to inquiry teaching. Likewise, if
    you have been working on authentic assessment where students are required to apply
    their newly acquired understandings or skills to real life situations, you are
    going to be very comfortable with inquiry teaching. Authentic assessment is one
    of the key components of inquiry teaching.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'You probably saw pieces of this application of concepts and skills in lesson
    examples presented earlier in this chapter. For example, as follow-up to the John
    Brown’s raid lessons, the teacher created analogous situations by having students
    assume the roles of 1859 teenagers debating one another and the roles of current
    day teenagers dealing with the ethics of downloaded music. Likewise, after dealing
    with syringes, students then went home and applied their understanding of the
    gas laws to inflating their bicycle tires. During a poetry unit, students might
    be asked to compare brief poems by Robert Frost with those of E.E. Cummings (or
    perhaps poems of their own choosing) using the elements of poetry that they had
    identified as a class, and then make this into a published literary critique for
    the class’s poetry website.


    Likewise, students who have uncovered the concept of pi in a seventh-grade mathematics
    class by conducting an exploration solely by using a ruler, some string, and a
    number of different size disks, could then try to apply this understanding. They
    might be given the task of working for a flashlight manufacturer and be given
    the challenge of ordering the appropriate amount of metal sheeting to make 12
    tubes that have a diameter of two inches and a length of seven inches without
    having any measurement tools. The assessment is just part of the learning—an integral
    part of the lesson. For those students who still did not own the concept and can
    not “abstractly” calculate it, they could use some construction paper to actually
    build the tubes and again see the ratio relationship between the diameter and
    the circumference from the physical model. Such activity would be seamless learning
    and assessment.


    # Achieving Success with Inquiry Teaching—The Brain and Learning


    Earlier in this chapter, we discussed the essential features of the inquiry process.
    Now, we compare this process with information from current findings in neurobiology
    about the processes through which the human brain learns. If this understanding
    of brain structures and function related to cognition and emotion matches the
    inquiry-learning format of engaging learners, it can make a compelling argument
    for educators fully embracing inquiry teaching. It is not just a better way for
    students to excel in assessments, but it is also a likely way to eliminate the
    achievement gap and to have students succeed in their careers. Understanding how
    the brain works is one aspect enabling you to achieve even greater success with
    inquiry teaching.


    Marcie Sidlowski, a language arts teacher at Hamilton-Wenham Regional Middle School
    in Hamilton, Massachusetts shared these thoughts about inquiry teaching after
    she studied how the brain learns:


    > > Our capacity for knowledge is a ubiquitous hunger that drives the human experience.
    Our brains are designed to literally modify, reshape, and adapt to new knowledge
    as our personal perceptions'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'sharpen with experience. Our version of reality, our life story, and the things
    we feel all shape our brain’s definitions of knowledge. A thing learned or partially
    learned has created a new neural pathway in one direction, but the addition of
    further experience in that vein may rework the pathway entirely to new possibilities.
    The human brain literally learns from experience, retiring no longer relevant
    knowledge to the depths of our long-term memory bank. If this is true, then it
    is of the utmost importance that my students have ample opportunity to experience
    their learning, rather than solely relying on ‘downloading’ of information.


    My interactions with the best of teachers have revealed a constant internal tension
    between their desire for some explicit detailed directions about practice in their
    classrooms and the parallel need to be allowed to create their own lessons and
    not be given prescriptions. As most teachers move into attempting to plan and
    facilitate inquiry teaching lessons and units, they are initially grateful for
    specific planning templates and for step-by-step procedures. They constantly refer
    back to exemplars as they plan. However, they are soon saying that this is too
    scripted, and having to follow the same sequence of steps for students to learn
    does not allow for enough variety and creativity. That is, until they actually
    try the inquiry approach in their classroom; then they see that the possibilities
    for creativity are expanded while still being assured of students being successful
    learners.


    Those of us who have been using this inquiry-teaching format find that it leads
    to the most creative, unique, and varied teaching that we have ever done, despite
    the same cycle of engagement. The process is as invigorating and engaging for
    us as it is for our students. Even as we become more skilled and comfortable with
    the format and institute variations, we see that the format still exists within
    the generalized construct described earlier in this chapter. That constancy exists
    because the process is based on what we know about how the human brain learns.
    Since the 1990s, huge leaps have been made in brain research and cognitive neuroscience.
    Unfortunately, prior to that time, educators had been mostly left to interpret
    the neuroscience on their own. In 2002, James Zull, a research biochemist and
    university educator, related neuroscience research findings directly to the experience
    of students. Much of what we present is based on his notion that “the art of teaching
    is the art of changing the brain” (Zull 2002, 5). By knowing the overall structure
    of the brain, we can see how it produces learning naturally. We can see what conditions,
    what environments, and what practices make for effective learning. There is no
    better definition of inquiry teaching than how Zull defines teaching as, “creating
    conditions that lead to change in a learner’s brain” (5). If we take a few moments
    to understand the interaction of the emotion structures with the cognitive structures
    in the brain, it will assist us in understanding reasoning, memory, and motivation.


    In the 1950s and 1960s, when we just did not know enough neuroscience about how
    the brain learned, we could only evaluate the effectiveness of an instructional
    approach on how well it appeared to work for various teachers and students. However,
    today educators can'
