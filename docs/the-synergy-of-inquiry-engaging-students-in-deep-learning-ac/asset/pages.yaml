- pgno: 235
  md: '# Math Class


    The first lesson was in a math class in which the teacher had taught the formulas
    for calculating the areas of a circle, rectangle, and triangle. The project assignment
    was to work in small groups to determine the most efficient shape. That struck
    me as an odd, but interestingly open-ended, question.


    The group I sat with had brought in pennies from home and proceeded to see how
    many pennies they could fit in a circle, rectangle, and triangle of the same area.
    Sure enough, the triangle was able to hold more pennies. That served to remind
    me of something I once read about why the ancient Egyptians built pyramids. However,
    that is only where the learning for these students began. One of them noticed
    that in the circle, each successive concentric circle had six more pennies than
    the last. The group decided to find out why.


    They took up a collection of quarters, carefully noting how much they needed to
    return to each contributor. Once again, each successive concentric circle had
    six more quarters than the previous one. Now students got really excited. They
    went down to the school cafeteria and came back with 6-inch paper plates. Again,
    each new concentric circle had six more paper plates than the previous one. Students
    now knew they were on to something.


    They ran up to the teacher to explain their findings and ask why it occurred this
    way. The teacher, recertified in mathematics, confessed that he did not know.
    But he suggested that they go down the hall to check with the physics teacher,
    who was more of a mathematician.


    The physics teacher listened to students’ findings and smiled. He said that each
    concentric circle was not exactly 6 units larger, but 6.28318530718 or 2pi, with
    pi being approximately 3.14. These students had inadvertently discovered pi, and
    once having done so, would likely never forget. I know I have not.


    # Independent Science Project


    The next instance of most memorable examples of inquiry learning was an independent
    science project. One student had determined to study the difference in vision
    between carnivores and herbivores. In order to do so, she had talked her way behind
    the exhibits in the small mammals’ wing of the American Museum of Natural History
    in New York City. There she was permitted to make plaster of Paris masks of the
    skulls of a deer and a leopard.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'The student later took these masks into a dark room at school where she had
    rigged portable lighting, shone the light through the mask, and measured the arc
    of light emanating onto the wall from the eye sockets of each mask. These data
    revealed that carnivores see a narrower angle right in front of them to better
    focus on their prey. Herbivores, however, have a much wider angle of vision, enhancing
    their peripheral vision, and enabling them to see attackers approaching from the
    sides. This work went far beyond anything I remember having studied in science
    class during my own high school experience. In fact, this young woman understood
    the scientific method far better than I did at that stage of my education.


    # Combined Science and Math


    The final memorable example of inquiry learning took place in a combined science
    and math double period class. The collaborating teachers were working with the
    Salvadori Institute at the City College of New York, to engage students in a bridge
    project. Working in small groups, students identified an existing suspension bridge
    to both study and build a scale model. Their studies would involve learning everything
    they could about the history, physics, and mathematics of the bridge they had
    selected; and then, build a replica to scale.


    The unit took several weeks. Students were so engaged that they came early before
    the start of the school day, stayed for hours after school, and came in on weekends
    of their own volition to work on these bridges. The work spilled out of the time
    and space allotted and began infringing on other classes and places in the school.
    You can imagine my delight as principal at coming across unattended students using
    box cutters and power tools in the hall.


    However, it was well worth these "inconveniences" when students presented their
    completed projects. For the first time, I had witnessed every student in a heterogeneous
    class present an outstanding bridge model, and as importantly, they could speak
    eloquently and authoritatively on the history, physics, and math of their respective
    bridge. It certainly left a vivid impression with me all these years later.


    # Conclusion


    I left the International High School at LaGuardia Community College in 2001 after
    17 years as principal. In my subsequent positions with the Department of Education
    in New York City, (superintendent, chief academic officer, chief schools officer,
    and deputy chancellor), I was well-served by what I had learned from teachers
    and students at this school. More importantly, the knowledge I had gained about
    how students and their teachers learn best significantly influenced the policy'
