  img_proc: true
- pgno: 26
  md: '# Observations About Small Group Learning in Practice


    Within these small groups, each student had space and time to explain their ideas
    about what they were investigating, how they should design the investigation,
    and how they could best interpret the results. These groups were heterogeneously
    grouped so that there were students with varying levels of academic readiness
    in each group. Many decades of research demonstrate that if teachers work correctly
    with these groups, each of the individuals will achieve as highly as if they were
    in homogeneous groups, including the most advanced students. However, the at-level
    students will work slightly better, and students previously lagging will more
    quickly approach on-level achievement than if they were homogeneously grouped
    (Slavin 1996; Rohrbeck et al. 2003; Johnson and Johnson 2009).


    Learning can be a social activity. Lev Vygotsky’s work (1978), and more recently,
    neuroscience brain-based research (Zull 2002) all confirm that deep understanding
    and acquisition of applicable thinking skills are most successfully acquired through
    verbal interaction of students while they are engaged in physically manipulating
    materials in order to solve a problem. After the teacher launches the exploration,
    students work as a team in small groups to create understandings. They verbally
    negotiate ideas, facilitated by the teacher’s questions only when necessary. Teachers
    create many of these questions during their lesson planning, so they are “right
    in their hip pocket” when they are needed as they cruise the room listening to
    the student conversations.


    Since learning takes place in this verbal interaction, students live most of their
    lives in classrooms in these small groups. The groups are changed up every four
    to six weeks. As we will see later in this book, students need to be taught the
    skills to work cooperatively, effectively, and positively to support one another
    in these groups. The activities that teach these skills must become part of the
    classroom curriculum.


    The teacher roams the room as the groups are engaged and makes observations about
    student performance. From the group dialogue, the teacher can assess various students’
    initial understandings and can differentiate instructional interventions with
    individuals or duos based upon how students are explaining their thinking. Since
    the other students in the class are truly engaged in the exploration, there is
    time to focus on individuals in the small groups. Likewise, if there are particular
    individuals who already own the concept or skill early into the lesson, the teacher
    has already planned an enriched version of the skill or concept using the same
    investigation for these individuals.'
