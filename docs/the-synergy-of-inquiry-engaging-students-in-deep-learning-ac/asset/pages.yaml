- pgno: 74
  md: '# What We Were Thinking


    This listing of concept objectives was a solid beginning; however, this process
    was not quite over even though we thought it was. Because this planning process
    is iterative, you soon discover that as you create the concrete exploration in
    which students will engage, you will uncover additional concepts that are embedded
    in the topic—concepts that you did not identify at first.


    We also realized that we could not write the thinking skill objectives until we
    created the exploration from which students were going to deduce their ideas.
    Typically, since most explorations have multiple thinking skills involved, teachers
    select the one that is used the most, is the most obvious, or has not been practiced
    a lot during the term. The same holds true for the habit of mind objective. Maria
    had to figure out how to identify these objectives.


    She also quickly realized that growth and repair was the big idea that connected
    the three concept objectives. She would have to remember to focus on it if students
    did not figure out the big idea on their own. By this time in the term, it was
    becoming a habit for her students to figure out “what we are studying is just
    an example of the big idea.”


    # Step 4: Identify the Initial Idea for Unaided Student Exploration


    Students, without assistance from Maria, had to uncover the concept that when
    cells divide, they duplicate the genetic material from the primary cell. Furthermore,
    they had to realize that this happens in a sequence of steps. They had to arrive
    at this understanding by observing something.


    # What We Were Thinking


    We found ourselves wondering how students could uncover the concept without the
    teacher providing specific guidance. Maria suggested that we have them look at
    onion root tips. These are prepared slides that students can easily view on their
    school microscopes and see the cells undergoing the various stages of cell division
    since growth rapidly occurs in the tips of roots. It was also a good idea since
    they had germinated bean plants in plastic bags earlier in the term and had actually
    observed the roots and the rest of the plant growing for a number of weeks in
    the clear bag.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'If we could get students to somehow look at the various stages of cell division,
    they might be able to figure out what was occurring. We then backtracked and realized
    that we needed to get students to focus on what was happening in the root tips,
    so we conducted a role play ourselves where I played the teacher and Maria played
    students. (I usually do this in my own head when I am planning, so this was even
    better to do it with someone else.)


    # Role-Play Conversation


    **Teacher:** I want you to remember when we were germinating the kidney bean seeds
    in the plastic bags before we planted some of them in the soil. When you were
    observing the roots, what did you see happening?


    **Student 1:** They were growing.


    **Student 2:** And they were white and squiggly.


    **Teacher:** How did you know they were growing?


    **Student 1:** I measured mine with a ruler, and they were getting longer.


    **Student 2:** I measured the width of mine, and they got a little fatter, too.


    **Teacher:** So where on the root was it growing?


    **Student 1:** At the tip, because it was getting longer.


    **Student 2:** But couldn’t it also be growing all through it and still get longer?


    **Student 3:** If it was getting fatter everywhere, it must be growing all along
    it, no?


    **Teacher:** (Writing some of these ideas down on chart paper) So we have some
    ideas and some questions.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Now I want you to all think a little on your own for a bit. You should write
    something down, maybe even draw a picture. If you could see inside the tip of
    the root, look with a microscope, and watch it for two days, what do you think
    you would see happening?


    Following our conversation, Maria and I wrote down what we thought the student
    answers would be. Maria’s answers were similar to some of mine about needing more
    cells as the plant grew. We thought some students might say each cell “cloned”
    to be another exact same cell. We wondered about their thoughts on the roots moving
    in a direction, and if they thought the cells moved. Then I realized that we needed
    to stop using our previous knowledge. We realized that another explanation for
    roots getting bigger was that cells might just get bigger. This makes total sense
    and is a good model for growth at the cellular level. Therefore, we needed students
    to see if there was evidence for cells just getting bigger or cells dividing into
    two cells. We then added a new concept to our list of objectives:


    +   - Cells need to replicate, rather than simply getting bigger, when growth
    occurs in organisms.


    # The Idea for Student Exploration


    Maria suddenly realized what needed to be done: the process crystalized for her.
    She became excited as she saw in her mind how students could figure it all out
    for themselves. When she was in school, students looked at onion roots, but the
    teacher had told them everything before with all the scientific names. Maria and
    her classmates just memorized everything. Now, she saw that students could do
    a real exploration first and figure out the ideas themselves, so she just wrote
    her plan down step by step.


    It was so wonderful to watch her face as she wrote down her plan, just as I would
    see it unfold in her classroom two and three days later. She really did not tell
    students any of the concepts. Students figured them all out by themselves. She
    just cruised the classroom and facilitated with questions when they were in small
    groups, and helped clarify concepts when they were working as the whole class.
    It was masterful. Here is how she did it.


    If you carefully follow Maria’s thinking in planning the lesson, you can gain
    the insights to create an inquiry teaching plan for any subject area. Travel with
    her on this journey and see how she taught a science topic that is usually uninteresting
    and not well understood by most students. By the end of the lesson, virtually
    every student in her class had engendered fairly deep understanding because they
    created the idea themselves.'
