- pgno: 80
  md: '# Student Observations of Stages of Mitosis


    When students returned the next day, they discussed their thoughts in small research
    teams of four for about 10 minutes. When they reported their ideas back to the
    class and used their drawings to defend their thinking, it only took about another
    10 minutes of negotiations for the larger scientific community—the class—to come
    to consensus. They agreed that the steps were as follows:


    +   1. The center part (the nucleus) transformed from a solid mass into a swirl
    of strands.

    +   2. These strands then lined up in pairs across the center and two sets became
    apparent.

    +   3. Then the sides of the cell pushed in next to the strands and the strands
    were pulled to each side of the cell and the walls kept pushing in until there
    were two new cells.


    Students figured that each new cell now had the same “nuclear stuff” as the original
    cell. Some kept insisting that it cloned itself (this actually was a rather conceptually
    accurate description).


    Since the class concluded at this point, Maria assigned students two tasks for
    homework:


    +   1. Read the section in their text on mitosis, and compare their findings and
    understandings with those of the larger worldwide scientific community. What was
    the same between their findings and what the scientific community now accepted?
    They also needed to note what was different and why the rest of the world knew
    something they did not, if that was the case.

    +   2. Write a report of their findings using the format that all scientists in
    the world use to have their evidence accepted as valid. Although somewhat similar
    to a traditional lab report, this report was unique: students designed some of
    the procedure, they evolved all of the theories, and in the conclusions, they
    compared their findings to what the larger worldwide community knows.


    In their published reports, students demonstrated some deep understandings across
    the class population. They now had the universal names for each of the stages
    (prophase, anaphase, and so on) of their drawings that they got from their readings
    and the Internet animated simulations. More importantly, most students also appeared
    to own the concept objectives.


    # Step 5: Identify the Applicable Thinking Skills and Habits of Mind Objectives


    This scenario that played out in her classroom is what Maria had pictured in her
    mind when she planned the lesson. I probably have made it appear much smoother'
