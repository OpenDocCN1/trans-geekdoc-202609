- pgno: 19
  md: '# Authentic Assessment Applications


    It is necessary for students to demonstrate their ability to apply any learning
    related to these concepts and thinking skill objectives to *unique, new situations*
    before we can say that they have deep understanding or mastery of skills.


    Figure 1.1 describes how these seven features come together in a three-phase cycle:
    exploration, clarification, and application. The cycle begins with initial engagement
    through exploration, followed by concept or skill clarification, and moves to
    concept or skill application.


    Figure 1.1 The Inquiry Teaching and Learning Cycle


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_19_0.png)


    In the sections that follow, each element of inquiry teaching is elaborated on
    and classroom examples are provided in various subject areas and grade levels.
    The remaining chapters provide details about how to operationalize these ideas
    in your classroom and why each one is such an important component in helping students
    become masterful learners. Additional examples can be found on the Digital Resource
    CD.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Student Exploration


    Inquiry teaching and learning begins with a student exploration. This may sound
    counterintuitive to those using transmission approaches to teaching, but this
    is the key component of inquiry teaching. The teacher designs an exploration where
    students, working in small teams, actually get to experience the concept that
    is the object of the lesson. As you will see in the examples that follow, students
    are given a challenge where they can intuit the concept from having experienced
    it, or they can design a solution or approach to a problem that builds on the
    last set of skills or understandings that they have just mastered. It is important
    that the exploration be carefully designed such that the desired concept or skill
    is the main focus and can surely be figured out by the group working together
    as they interact and create their best understandings.


    # Student Exploration in Practice: *Eighth-Grade Poetry Lesson*


    > > “I picked this poem because I love the way the poet seems to paint with words.
    Where it says ‘patent leather streets,’ you can just see the streetlights glistening
    off of the rain-soaked streets without saying all of that. What a great comparison!”


    The teacher, Sara, added two items the student noted—“Paints with words” and “Good
    comparisons”—to the list on chart paper. Sara then asked who wanted to go next.
    Many students were now eager to share their ideas knowing that these would be
    respectfully accepted and questioned only for clarification by the teacher or
    other students.


    A student read another brief poem. It seemed that with each subsequent reading,
    students were taking more and more care to read them for meaning, or with emotion,
    or in this case, playing with the rhythm a bit.


    > > “I picked this one for two reasons. It was one of the few poems that rhymes,
    and it almost has a rhythm to it like a song. It is far from rap, but it is the
    closest thing here to it.”


    Sara added these two additional elements—“Rhyme” and “Rhythm”—to the chart labeled
    “Elements that Make Poetry Interesting.”


    At the beginning of the period, Sara had placed 16 different poems in piles with
    five copies of each around the perimeter of the room. She then asked the 32 eighth
    graders in the class to walk around quietly and read each one and then pick the
    one that they liked the best. After making their choices, students returned to
    their seats and wrote down which aspects of the poem made them select it,'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'whenever possible referencing particular words or lines. Once they all had
    selected a poem, they first explained their choices to their small feedback groups
    of four where they practiced their reasoning. Next, they reported to the whole
    class. Other students spoke about “words in a row beginning with the same letters,”
    “emotions I felt from reading it, like love,” or “how the words were positioned
    all over the page—but for a reason. It made you think, and say them differently.”
    Everybody had their reasons and when ones were repeated, the teacher placed additional
    check marks on the chart next to those.


    As the period was about to end, Sara asked students to copy down all of the reasons.
    For homework, they were to see if they could fit them into categories. The next
    day, students came back with suggestions of categories like “sounds of words,”
    “cool comparisons,” “musicality and rhythms,” and “intense emotions.”


    Soon students had uncovered almost all of the elements of poetry. They had negotiated
    these ideas first in their small groups and then created knowledge as a whole
    class. Not all of the students owned every idea yet. However, since they participated
    in creating the concepts, many of them at least partially owned them. Later in
    the week, the teacher introduced the academic vocabulary, such as alliteration,
    that went with each of these concepts. If the teacher had started with the vocabulary,
    then students would think the vocabulary, not a deep understanding of the concept,
    was most important. This would have created the wrong focus.


    Sara understood that this was just their initial exploration together into the
    world of poetry, and this would need to be followed by a spiral of further explorations
    for deeper understanding of each aspect. So began a discussion about why they
    had not all picked the same poem. This led to a discussion of why some students
    thought poetry was “dumb,” and why did the person not just write out what they
    wanted to say in a paragraph. Sara referred to one poem and said the poet said
    that when he could not express his emotions by speaking, he would write them down
    in a poem and give it to the person. Some of the students spoke about how they
    thought some of these poems weren’t so great. That led some other students to
    ask them if they could write better poems. “I’m only a teenager. What do you expect
    of me?” was a common answer.


    Sara said they would be reading much better poems than these in the coming weeks
    and that the class would also be publishing an online book of their own poetry
    with drawings and photographs. Just as the class was about to end, Sara said,
    “By the way, all these were poems that I wrote when I was a teenager. I’m sure
    you will all do much better.”'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Observations About Student Exploration in Practice


    Many times teachers equate student explorations or investigations with doing science.
    What you see on the previous page is a teacher who has carefully created and facilitated
    an *exploration* lesson in language arts. After clearly delineating the concept,
    skill, and habit of mind objectives, the teacher took much thought to design and
    facilitate an exploration that would allow students to uncover the concepts while
    practicing their thinking skills. By uncovering conceptual relationships, students
    then truly and deeply understand these relationships and can use their thinking
    skills to apply them, simultaneously acquiring a deeper skill level.


    Everything we have learned about learning over the past four decades demonstrates
    that these conceptual understandings and skills cannot be transmitted through
    telling—didactic teaching. Whether you look at the studies by Piagetian developmental
    psychologists (Bruner 1960, 1973, and 1996; Elkin 1976; Flick 1995; Fischer 2008)
    or the current brain-based researchers (Bransford et al. 1999; Zull 2002), each
    of the multitudes of studies demonstrates that students need to create understanding
    and acquire skills by engaging in designing and carrying out explorations within
    and between disciplines. This must be done before students can be exposed to what
    the larger academic community already knows so that they can then compare their
    understandings with those in academia. During this phase of inquiry teaching and
    learning, students are creating relationships between many of the factors involved
    in a given phenomenon, conceptual relationship, or problem-solving approach to
    a specific situation. Many times, students’ understandings and skill sets are
    naïve, but they have painted a *landscape* with gaps. This landscape is an area
    in their brain that is wrestling with understanding the phenomenon. These gaps
    are the questions they now have that can be answered by what members of the larger
    academic community have themselves uncovered.


    In the above example, students in a class will not necessarily uncover every element
    of successful poetry. They will need to be exposed to these additional elements.
    They still need to look at how great poets have utilized various devices, alone
    and in tandem, and be able to recognize why these poets were or were not successful.
    They need to create poetry themselves and practice using a number of these poetic
    devices. They need to practice giving friendly critiques with positive suggestions
    for improvement of their classmates’ poems. All of these are follow-up explorations
    in a sequence or *spiral* of lessons.


    # The Teacher’s Job in Inquiry Teaching


    > “Every time you answer a student’s question you stop them from learning.”


    > “The hardest part for a teacher in inquiry teaching and learning is to stop
    talking.”


    I introduce many of my workshops with the first of these two statements and repeat
    the second many times throughout the workshop as teachers work on their plans
    for'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'student explorations. Once teachers try their plans in their own classrooms,
    they are the ones using the second quote.


    Both of these are counterintuitive given almost everything we have experienced
    ourselves in formal schooling. Is it not the teacher’s job to answer questions,
    distribute knowledge, and therefore, speak?


    Students need to uncover concepts for themselves by engaging in well-crafted explorations
    that enable them to deeply understand concepts and apply them to multiple situations.
    Teachers need to stop answering questions as this actually inhibits students from
    creating deep conceptual understanding.


    Likewise, when students are engaged in well-designed explorations, they need to
    be allowed to *struggle* to figure out their own understandings. Since they are
    in small groups, they can support one another. The teacher needs to be “cruising”
    the room from group to group, carefully listening to see if and when intervention
    may be required. However, teachers need to restrain themselves from engaging prematurely.
    Figuring out takes time, and wrong roads need to be taken and abandoned. Allow
    students to think on their own; let them struggle. If the exploration is designed
    appropriately, it will only be occasionally that a teacher will need to “drop
    a not too leading, but well thought out question” into a group that has moved
    too far astray for too long. If you just wait, most of the time, students will
    go down the road you were about to lead them on to. Except, now they do the figuring
    out and they own the knowledge in a much deeper way.


    # Thinking Space


    # Teacher Talk


    Think about the amount of time you spend talking to your students during the course
    of a single class or throughout the day.


    +   - What are the purposes of your talk?

    +   - To what extent do you find yourself repeating student questions or answers?

    +   - To what extent do you use talk to encourage students to think on their own
    or to share ideas with their peers?

    +   - How difficult do you think it will be for you to change the pattern of teacher
    and student talk in your classes?'
