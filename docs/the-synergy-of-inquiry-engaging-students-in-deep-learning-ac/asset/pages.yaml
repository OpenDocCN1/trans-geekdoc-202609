- pgno: 10
  md: '# Introduction


    American teachers are once again reacting to a new set of expectations for teaching
    and learning—the Common Core State Standards (CCSS). For decades, various state
    and national standards, along with a yearly influx of innovative educational approaches,
    have been touted to improve learning for students from grades PreK to 12. These
    offerings represent a spectrum of curriculum-related matters: higher-orders to
    the new approaches. I have worked with teachers and schools covering grades PreK-12
    whose practices allow them to see all of these new ideas as natural components
    of the way they already teach. Using effective inquiry-based teaching methodologies,
    these educators find that either they have been already implementing these suggested
    approaches or that these seamlessly fit into the structure of inquiry-based teaching.
    These teachers engage their students in carefully thought-out explorations where
    students work in small groups to uncover and develop the relevant conceptual understandings.
    Teachers guide students and scaffold instruction to support an active inductive
    learning process.


    It certainly was a cultural change for me as a classroom teacher, trying to begin
    my lessons with students engaged in meaning-making explorations by manipulating
    materials. I looked at what I did during the week with my students: 80 percent
    of what occurred was just talking, reading, and writing. A majority of that was
    my talking and asking students to repeat my thinking. At first, it was daunting
    for me to realize that I needed to reverse the percentages. Students needed to
    be manipulating materials 70–80 percent of the time, and to be doing the vast
    majority of the talking and figuring out. The transformation did not happen overnight.
    It was a process. I had to revise so much of what I previously did. I had to find
    resources from people who were already teaching this way. But once I began to
    create lessons and units of study, and I saw how the whole nature of my classroom
    changed and how students were so much more successful and happy about themselves,
    I could not approach learning and teaching any other way. I have written this
    book to try to make your journey easier, shorter, and to lend support from a distance.'
