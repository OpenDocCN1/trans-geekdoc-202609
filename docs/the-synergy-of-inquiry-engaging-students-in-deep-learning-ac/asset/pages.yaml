  md: '# Guidelines for Creating Inquiry Teaching Lesson Plans


    This template provides reference points to consider as you develop inquiry teaching
    lesson plans. The Guidelines for Creating Inquiry Teaching Lesson Plans can also
    be found on the Digital Resource CD.


    Title: ________________________


    Subject/Course: ________________________  Topic: ________________________


    Designer(s): ________________________  Grade: ________________________


    # Brief Description of Group to be Taught


    *Include grade or age, number of students, ability levels, description of students
    on IEP''s or English language learners.*


    # Relationship of this Lesson to the Unit


    *Be specific about where this transitions from and to.*


    # Objectives


    # Content Standard(s)


    *Indicate which standards will be addressed; for example, CCSS, NGSS, State Standards,
    District Standards.*


    # Essential or Driving Question(s)


    *Which aspect will this plan help answer?*


    *Which big idea from the year is most addressed in this lesson?*'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Guidelines for Creating Inquiry Teaching Lesson Plans (cont.)


    # Understanding(s) [Large concepts]


    Define what students will understand. Identify one new concept per day and never
    more than two.


    # Students will know... [Sub-concepts]


    List in a declarative sentence one or two relational understandings for each day
    of the lesson. Note which day of the lesson they relate to.


    # Students will be able to... [Thinking Skills]


    List one thinking skill that you will focus on and assess during each day of the
    activity.


    # Students will start to regularly... [Habit of Mind]


    List one habit of mind that you will focus on and assess during each day of the
    activity.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Assessing Mastery of Objectives


    # Authentic Performance Task 1


    *At least one of these performance tasks should be a real-world application that
    is unique and not the same situation in which the student exploration occurred.*


    # Authentic Performance Task 2


    *Try to have at least one of these performance tasks be a hands-on manipulatives
    task.*


    # Key Criteria


    *These should match the concept and thinking skill objectives above, or in the
    rubric below. Be as specific as possible so that you are clear what is expected.*


    # Other Evidence


    *This can include assessment questions used by the teacher when students are in
    small groups, carefully read and responded to homework assignments that scaffold
    concepts or skills as the lesson progresses, reports or presentations, blog entries,
    tests and quizzes and other ways that students demonstrate mastery of the objectives.*'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Detailed Learning Plan


    Session Length ______ How many hours over how many days?


    # Materials Needed


    List all the materials students (per group of four) will use in their explorations.
    Be specific about quantity and type of materials so that you or another teacher
    can gather the appropriate materials.


    | Time | Procedure | Objective |

    |------|-----------|-----------|

    | 5 min | **Introduction**


    Include an activator, for example, something that relates this to their own lives
    or a question previously created by students. This will not explain any of the
    concepts, but it sets the context for the challenge—the exploration. |  |

    | Varies from 30–60 min | **Small Group Work Exploration**


    Divide the class into groups of four students.


    Start with students exploring some documents, artifacts, hands-on science or math
    investigations, or role-playing. Provide some mechanism in the beginning of the
    exploration to uncover students’ prior knowledge and naïve conceptions.


    - Have getters retrieve materials. Ask the individual participants to make a prediction
    or explanation near the beginning about the exploration. Students need to share
    with others in their group their predictions and explanations. They then test
    their predictions and explanations with others in their small group. They try
    to see if the group can come to consensus.

    - Sometimes teachers will stop all the groups while they are still engaged in
    their exploration if they see that most groups are missing a main idea that some
    other groups are approaching. They would have groups report out their thinking
    so far and lead a quick discussion before sending the groups back to finish their
    explorations. | Concept, skill, or habit of mind |'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Detailed Learning Plan (cont.)


    | Time | Procedure | Objective |

    |---|---|---|

    | Varies from 30–60 min | **Concept Clarification**


    - When the teacher thinks that each group has had extensive time to create the
    concept or strategy or to hone the thinking skill, they call the class together
    as a whole. Reporters share each group''s ideas, and the teacher leads a large
    class discussion that moves the participants to concept clarification.

    - After this, students can search for what experts know about the concept and
    compare it to their naive conceptions. In order to accomplish this, they can listen
    to the teacher telling, read texts, or even do a web quest.

    - Step-by-Step: For each of the preceding actions, be sure to note what students
    will be doing and creating, and what the teacher will be doing to facilitate this.
    Do this in great detail.

    - Be sure that you have modifications for students with special needs, both in
    this facilitation of learning of concepts and skills, and in the assessments.


    Be sure to include some synthesis homework that follows from what students did
    in class and leads to the starting of the next class. | Identify expected misconceptions
    and have these up front in your mind.


    Write down how you will approach them. |

    |  | **Application**


    An *application* of the concept and skill that you expect them to own follows
    in a new context or in other words, the Learning Cycle.


    Exploration ↔ Concept Clarification ↔ Application


    End with a summative assessment rubric for the concepts, habits of mind, and skills.
    |  |'
  merge: -1
  img_proc: true
