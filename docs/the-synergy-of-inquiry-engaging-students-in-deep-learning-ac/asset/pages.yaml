- pgno: 199
  md: 'students to acquire, whether in social studies, science, technology, or in
    the relationships of characters in novels, are universal relationships between
    individuals and groups, individuals and other individuals, or between groups and
    groups. They are in many ways based on the same psychological and sociological
    foundations as the relationships these students are having with their peers and
    their parents, the two primary areas of concern to adolescents.


    Once these needs are met, students will not only engage in the study of the analogous
    societal relationships, but will delve into the deepest esoteric questions that
    are posed. In addition, they will acquire conflict resolution skills and coping
    mechanisms that they can utilize in their everyday interpersonal relationships.
    The personalization of the subject matter by having students investigate these
    analogous interrelationships between their own personal interrelationships and
    those that exist at a societal level is a central element of the most successful
    of these programs (Jablon 1989). My partner in team teaching for 13 years, Terry
    Born, taught me this technique of role plays and together we enriched it to become
    Analogous Interrelationship Role Plays as described here.


    # Example of an Analogous Interrelationship Role Play


    Three students assume the roles of the following characters:


    +   - Fifteen-year-old high school student who must work long hours to add to
    her family''s income because a parent has recently died

    +   - Student’s teacher who is upset by the drop in quality of the student’s work
    in her class

    +   - Student’s parent who is caught between wanting the best for the student
    and the rest of the family’s welfare


    This role play has allowed classes of students studying about the cutting of the
    rainforests to understand the complex relationship between the poor native inhabitants
    cutting the rainforests (the student), the government of the third world country
    who is encumbered with a large international debt (the parent), and the environmentalists
    trying to help both the native and the future world ecological situation (the
    teacher). Students not only had a unique insight into world economics but into
    their own personal relationships and therefore identified positively with their
    academic classes.


    If the psychological needs of students are met as they are engaged in activities
    with the other students in the societal class, then a positive alternative peer
    group is created that students can go to as an alternative to their negative neighborhood
    peer groups where they normally turn in their search for fulfillment.


    This method of personalizing subject matter in a single subject classroom has
    limitations even though the societal format facilitates the ease with which it
    can be integrated. Teachers become frustrated with the amount of single subject
    academic'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'concepts that cannot be addressed because certain of the issues are better
    developed in the arenas of other subject areas. If subject areas—science and language
    arts, science and social studies, math and social studies, or all four—are integrated
    and taught in a truly interdisciplinary manner, then the personalization mechanism
    supports completely the areas being studied.


    # Final Public Projects


    A final public project, the culminating experience, for students working on an
    interdisciplinary unit is intended to provide the opportunity to address an issue
    of their interest that draws from their academic experience. It provides students
    with the opportunity to apply, integrate, and synthesize knowledge and experience
    obtained during their academic course of study to a question or problem of public
    relevance.


    Final public projects can take various forms depending on the issues students
    have investigated, for example, presentations to community governing boards, public
    service announcements, or brochures to assist community agencies or prompt civic
    participation in community initiatives such as curbside recycling. Students can
    assess school lunch programs and make proposals to school and community agencies
    to help improve them. They can create community gardens or help elementary teachers
    engage their students in reading and science projects. (Even elementary students
    themselves can create informational signage for trails through local conservation
    areas.) Students can monitor local ecosystems in conjunction with local environmental
    protection agencies. They can research town histories, make scale models of the
    town over decades or centuries, make videos of historical events and show them
    on public access television channels, and engage senior citizens in writing their
    own oral histories. They can build and finance local playgrounds, skate parks,
    vest-pocket parks. This is just a brief description of the myriad of projects
    represented in these teacher-designed units.


    Do an online search for examples of teacher-designed interdisciplinary units.
    You will find an infinite number of public projects that allow adolescent students
    to demonstrate their *competence* to their peers and adults in their community
    in a manner that is of consequence to them. Meeting this Maslow *esteem* need,
    while studying academics, allows those previously disengaged from school to prosper,
    and those regularly engaged to fly.


    Most teachers after first doing project-based learning where the projects deal
    with real issues soon move to public presentation of projects. They do so because
    meeting the needs of students to demonstrate their competence in a public forum
    exponentially increases the motivational power of the projects. Those who then
    listen to their students, further move into what is now commonly known as *service
    learning*, where their students use the skills they learn in their classes to
    do a project that solves a community need, while'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'simultaneously learning additional skills from the community members with whom
    they interact while planning and completing the project.


    # Resources for Service Learning


    National Youth Leadership Council: http://www.nylc.org


    George Lucas Educational Foundation: http://www.edutopia.org/ (search under “service
    learning”)


    KIDS Consortium: http://www.kidsconsortium.org/


    Center for National and Community Service: http://www.cns.gov


    National Service Learning Clearinghouse: http://www.servicelearning.org


    National Service Learning Partnership: http://www.service-learningpartnership.org


    Whatever the project you choose for your students, design it such that it is group
    dependent. This helps create a positive peer group that organically becomes dependent
    upon one another’s input and output. Students talk about it as creating a family
    who assist each member with issues relating to school and themselves. When students
    wrote and produced plays, the whole class chose and created the message and dramatic
    plots. Once the complete plot was agreed upon, the class was broken into groups
    who were assigned to write the dialogue for each act and scene. Every group was
    dependent upon every other group to not only complete their scene but to work
    out the continuous compatibility of dialogue. Once the play was written, students
    either acted in the play, or designed and built sets, costumes, or lighting elements.
    Everyone helped with publicity and selling tickets. If one person did not do their
    part, then the whole project faltered. Students felt they were needed and wanted
    at school by their peers.'
