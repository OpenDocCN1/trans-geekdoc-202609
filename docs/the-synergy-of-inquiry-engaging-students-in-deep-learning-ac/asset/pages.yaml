- pgno: 210
  md: 'Developing an ITSLU takes some thought and planning. Figure 5.6 presents a
    12-step template for developing an interdisciplinary thematic service learning
    unit. This template can be found on the Digital Resource CD.


    # **Figure 5.6** Template for Planning an Interdisciplinary Thematic Service Learning
    Unit (ITSLU)


    +   1. **Introduction, Overview, and Rationale**—Make clear how inquiry teaching
    and learning is occurring in each of the disciplines but especially in the small
    products and project as well as the service learning component.


    +   2. **Main Concepts, Skills, and Habits of Mind**—Specify how each of these
    will be addressed for each discipline in the unit. Include some rubrics that assess
    at least two small products on various aspects and one rubric that assesses the
    final project. It is more likely that you will do most of your assessment of academic
    skills on the small projects leading up to the bigger service learning project.
    Additional assessment may be necessary based on your particular situation.


    +   3. **State Standards**—Identify the standards applicable to the disciplines
    selected for the unit. Use the standards as benchmarks for assessing development
    of concepts and acquisition of skills.


    +   4. **Engaging Activity**—Plan what you will have students do physically and
    mentally to hook them on addressing the driving question and engage in the service-learning
    component.


    +   5. **Theme and Essential/Driving Question**—Explain how your theme is effective
    based on the components of an effective theme (see Figure 5.1). Show the connection
    of the theme to your essential question and how it is transformed into a driving
    question that intrigues students sufficiently that they care enough to search
    for the answer.


    +   6. **Timelines: Day-by-Day and Week-by-Week**—Prepare timelines for each discipline
    and across disciplines. Chart the timelines in a way that one can see when disciplinary
    classes are meeting alone and when they are meeting combined with each other.
    If you are doing more than 15 days of activities, then describe these 15 days
    in detail and the rest in a week-by-week summary.


    +   7. **Small Projects**—These projects serve a scaffolding function to teach
    skills and concepts. Define the progression of small projects that lead up to
    or are parallel with the service learning project that they support.


    +   8. **Service Learning Component**—Describe this component in detail, including
    information about any community participants, including parents with insights
    and skills, who will interact with students and support their learning and accomplishment
    of their project. Be sure that students are dependent upon one another in order
    to complete the project.


    +   9. **Study Skills, Research Skills, and Habits of Mind**—Define those that
    will be most emphasized (learned and practiced) in the unit. Explain why you selected
    these and where they will be practiced.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '10. **Media, Technology, and the Arts**—Identify and describe the media (books,
    videos, music, websites, historical documents, and so on) that students will read,
    watch and listen to. Additionally, and even more importantly, define what books
    they will publish, what videos or podcasts they will produce and air on public
    venues, and what plays or songs they will write and perform. Be sure to enumerate
    what technologies they will use to produce these or study natural phenomena and
    how they will acquire the necessary skills.


    11. **Concept Map**—Design a detailed concept map (with connecting phrases) that
    shows the relationship between various components of the unit.


    12. **Practical Realities**—Address the *nitty-gritty factors* that will affect
    the success of your unit. For example:


    +   - sources of funds for materials, transportation, or field trips

    +   - how to obtain administration buy-in

    +   - when planning time will occur

    +   - managing time—define aspects of the unit that extend beyond normal school
    hours

    +   - student supervision—define how students will be supervised during after-school
    hours; specify permissions required and how they will be obtained


    **Other than using inquiry teaching in your classroom, working with at least one
    other teacher on an ITSLU will be one of the best decisions you make during your
    teaching career.**


    # Second Language Learners and Inquiry Teaching


    Many times, second language learners are disenfranchised in our general education
    classrooms. However, the way that learning takes place for everyone in an inquiry
    teaching class benefits second language learners. The nature of the inquiry approach
    assists these students in more quickly learning the new language while simultaneously
    making the academic content accessible in a way that is not possible in a traditional
    didactic, transmission classroom.


    In 2014, I attended a WIDA (World-class Instructional Design and Assessment) workshop
    on *English Language Development Teaching Skills* that focused on knowledge and
    skills classroom teachers need to acquire when they have second language learners
    in their classes. By the time the all-day session had finished, I was astonished
    to hear that the prescribed practices to help second language learners thrive,
    were almost a perfect description of the inquiry teaching classroom. We, teachers,
    needed to learn the linguistic complexity levels that these students could be
    at, and accordingly, what modifications we needed to make in our written and oral
    materials for them. However, the rest of the classroom dynamics presented in the
    workshop were the same as those described throughout this book.


    Not long after the WIDA meeting, I was reading a number of articles and methods
    books that describe best practices for addressing the CCSS English'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Language Arts/Literacy. As mentioned in earlier chapters, many of the practices
    these Common Core methods writings were suggesting matched what inquiry teaching
    educators already were doing in all of the subject area classrooms. Given this
    context, let us first review how language acquisition occurs in a native speaker’s
    language in an inquiry-teaching classroom before we see its application in a second
    language situation. This schema that applies to Common Core language skills is
    useful to understand in and of itself but will later serve as an advanced organizer
    for how it can work with second language learners.


    # Language Acquisition within the Inquiry-Teaching Classroom


    The inquiry-teaching classroom provides a perfect opportunity for students to
    practice *relational meaning* in language since they are simultaneously doing,
    and translating this doing, into both oral and written language. The syntax, grammar,
    paragraph writing, and reading comprehension skills and strategies will naturally
    grow out of students’ small group explorations as they are negotiating their ideas
    with peers and eventually writing the reports about what they learned in these
    explorations. This process needs to be mediated by having the teacher consistently
    respond to extensive student writing and the idea creation that underlies the
    writing, thereby supplying scaffolding throughout the whole process. Seven steps
    in the process, described in the following section, reflect key features of the
    Inquiry Teaching Learning Cycle.


    # Step 1: Exploration—Students, working in a small team of four or less, are engaged
    in manipulating various materials.


    +   - Students write the question that they are exploring.

    +   - After *messing about* with the materials and discussing ideas with team
    members, students revise the question to more clearly and concisely state the
    point of the investigation.

    +   - Students work with others on their research team (cooperative group) to
    create initial procedures that the team will follow.

    +   - Each member of the team writes and revises his or her own procedures and
    findings.

    +   - Each team member also writes about the affective part of the team’s exploration
    that day. A student writes about what he or she was feeling during this investigation,
    as researchers in academia have traditionally done in their journals in addition
    to recording their ideas. The teacher needs to be checking that students can differentiate
    between evidence, inferences, emotions, and opinions. The student subsequently
    identifies these elements and writes about them in appropriate places.


    # Step 2: Meaning Negotiation—Students discuss findings and relationships between
    various parts of the problem that they are investigating with other members of
    the exploration group.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '+   - Students first record their ideas for procedures to use in the exploration
    and then work with team members to create a group procedure.

    +   - Students articulate these ideas verbally, modifying their understanding,
    syntactical structures, and sometimes the vocabulary as a result of verbal interaction
    with team members.

    +   - The teacher cruises the room, checking levels of understanding in groups
    and facilitates the direction of each group through fairly open and not-too-leading
    questions.

    +   - The teacher also asks individual students to verbalize their understandings
    and then asks them to write down these ideas in their notebooks, paying particular
    attention to see if students include important syntactical structures in their
    writing. For example, "if-then" phrases occur in everyday speech and writing but
    take on a special significance in academic thinking and communication.

    +   - Team members create naïve conceptual understandings about the topic under
    investigation, enrich their thinking skills, and may be influenced by habits of
    mind of other team members.

    +   - During this process, students are practicing clearly communicating their
    ideas, utilizing language structures that they hear from team members, and organizing
    their exploration by creating a sequenced oral, and then written, description.
    This non-threatening small group modeling of language, and the subsequent chance
    to rehearse this language, is especially important for second language learners
    (Krashen 1982).

    +   - While moving from group to group, teachers assess student understandings
    and skills and their abilities to communicate those skills both verbally, and
    in rough form in their notebooks. This is also formative assessment for conceptual
    learning, and prompts appropriate and differentiated language and conceptual instruction
    for the next day.

    +   - Teachers urge all students to write their understandings so far in a fairly
    shorthand, but syntactically accurate, manner.


    # Step 3: Concept Clarification—The teacher facilitates a more logical and richer
    creation of meaning.


    +   - *Reporters* from student research teams report back to the larger class
    community. This early process of *meaning making from our results so far* allows
    students on a team to begin organizing and synthesizing ideas, data, and inferences,
    and making preliminary conclusions based on evidence from explorations in progress
    with this activity students begin in their practice of learning and utilizing
    *strategies* for organizing ideas into a logical argument.

    +   - Students from other teams are critical friends, seeking evidence for claims
    and procedural descriptions for explanations that contradict their own.'
  merge: -1
