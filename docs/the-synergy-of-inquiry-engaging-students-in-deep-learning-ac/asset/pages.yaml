  img_proc: true
- pgno: 135
  md: '# Jonathan Katz’s Reflections


    *Jonathan has been an incredibly effective inquiry mathematics teacher for decades
    at a number of public high schools in New York City while working with a great
    number of diverse students. He also allows us to hear from some math teachers
    from across the city with whom he works as a math coach.*


    What is mathematics and why do we teach it? Many people have thought about this
    question, and the answers vary based on people’s beliefs and perceptions about
    mathematics. Is mathematics fascinating, creative, and beautiful as some people
    profess, or is it a discipline we have to bear and get through as many people
    have felt? Is it a creative discipline, or is it a rigid set of rules and procedures?
    Look at this description of mathematics and see how you feel about it. In the
    excerpt, a professor is talking to a 10 year-old boy about prime numbers.


    > That’s right, a desert. No matter how far you go, you don’t find any. Just sand
    as far as the eye can see. The sun shines down mercilessly, your throat is parched,
    your eyes glaze over. Then you think you see one, a prime number at last, and
    you go running toward it—only to find it’s just a mirage, nothing but hot wind.
    Still, you refuse to give up, staggering on step by step, determined to continue
    the search...until you see it at last. The oasis of another prime number, a place
    of rest and cool, clear water (Ogawa 2009, 64).


    In my first few years of teaching, I would have been classified as a conventional
    didactic teacher. I worked hard and had some success, but I always felt that I
    was fooling everybody. I was good at getting students to do well on standardized
    tests, but what were they really learning? As the years went on, I incorporated
    new ideas into my teaching. I knew that I loved mathematics, and I wanted my students
    to have the same emotion. I tried to bring problem solving, art, and architecture
    into my classroom, but I did it on a limited basis. I was viewed as a very successful
    teacher, but I still feared that I was a fake: good at getting students to do
    well on tests but feeling that student understanding was all superficial. I would
    not have used the terms *procedural fluency* and *conceptual understanding*, rather
    I felt I taught students ways to do mathematics, tricks of the trade, without
    real procedural fluency or deep conceptual understanding.


    In my eighteenth year of teaching, I began to work in a school that had a progressive
    philosophy towards education. In my early days at this school, I struggled with
    and questioned the school’s philosophical beliefs. I did not understand how one
    would teach in this type of school. I had essentially seen teaching as the transmission
    of'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'knowledge. That was the way I was taught, and I never saw anyone do it differently.
    I wondered to myself, “What do they think teaching means?” Meanwhile, I was amazed
    at what I saw all around me. Students seemed to like to learn at this school,
    and the level of student engagement was very high. Over time I began to incorporate
    a new type of instruction into my classroom—inquiry-based instruction. I began
    to see my students’ interest in mathematics grow as they were asked to discover
    mathematical concepts, apply their understandings in meaningful projects, and
    view mathematics as a creative experience. While students still struggled with
    understanding mathematical ideas, they began to appreciate the wonder, power,
    and beauty of mathematics.


    In the past 10 years, I have had the opportunity to work with many effective math
    teachers in grades 6 through 12 as a mathematics coach. My understanding of teaching
    and learning has grown immensely through this work. I have sat in hundreds of
    classrooms where inquiry-based mathematics was the central approach used by teachers.
    I observed the ways mathematics was presented and how students attempted to make
    sense of, and understand, mathematical ideas and problems. In the following sections,
    you will get to hear from some of these teachers and students on how inquiry instruction
    can change the way mathematics is thought about.


    # Inquiry-Based Mathematics Instruction


    Many students regard mathematics as a collection of procedures that allows one
    to answer questions in a short space of time (Schoenfeld 1988). Meanwhile, inquiry
    is a mode of teaching and learning that “rests on conceptual innovation” (Schwab
    1962, 5). Students participating in a community of inquiry, discuss and solve
    new and unfamiliar problems (Kwon 2005). Problems are used to help develop mathematical
    understanding of concepts and procedures rather than viewed as applications of
    already learned procedures (Koehler and Grouws 1992; Hiebert 1999). A teacher’s
    job is to “encourage conjecturing and arguing and to make the environment safe
    for students to express their thinking” (Koehler and Grouws 1992, 122). Inquiry
    proceeds through uncertainty and struggle leading to knowledge that is hard to
    come by (Schwab 1962).


    Two ideas central to inquiry-based mathematics instruction are *patterns* and
    *problem solving*. Mathematics has been defined as the “science of patterns” and
    the central role of a mathematics student is that of a pattern hunter. How can
    I make sense of the information presented to me? What observations can I make
    from the patterns? What conjectures can I make based on the observed patterns?
    Can I prove if this conjecture holds true for all cases? When a student understands
    the centrality of patterns as an underlying structure of mathematics, he or she
    has a greater chance of developing mathematical understanding.'
