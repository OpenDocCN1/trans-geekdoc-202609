- pgno: 188
  md: 'trance-like state was more from disbelief of what we were watching. These New
    York City Public School students had taken responsibility for it all. They had
    done it all. What a difference from just six years ago when we were both dissatisfied
    with the success (or lack of) we were having with some of the students in our
    science and English classes. We approached the principal and asked if we could
    have one of our English and science classes back to back during seventh and eighth
    period. Little did we know that it would take us on a journey that was well beyond
    anything we could have imagined or expected.


    # Impact of the BONGO Program


    That was six years into a three-period-a-day program that Terry and I co-taught
    and directed for 13 years and that in some form or another has been continued
    by teachers around the country. A ten-year quantitative and qualitative research
    study of the program uncovered some fairly amazing results. Despite the almost
    universal agreement among students in the program that the coursework was the
    most challenging they ever encountered in school, a ten-year study of the program
    demonstrated a remarkable success with a set of previously disengaged students.
    This structure accounted for some fairly compelling results with a population
    of urban African-American, Latino, and white students who almost all had a history
    of at-risk behavior. The results showed:


    +   - Ninety-two percent did not cut classes during the time they were in the
    BONGO Program. Seventy-seven percent of those students had a history of cutting
    classes before they were in the program, which dropped to zero cuts while in BONGO.

    +   - Attendance also increased, both for students who were mostly truant, and
    for students who attended school fairly regularly, but had significant absences.
    Sixty-five percent of students experienced increased attendance, 31 percent showing
    a massive increase. For any of these students to have above 95 percent attendance
    was unbelievable for their parents, their other teachers, and themselves. The
    number of students who showed either perfect or 95 percent attendance doubled
    (perfect attendance went from 3 to 5 percent; 95 percent attendance went from
    21 to 45 percent). While students were in BONGO, 50 percent had 95 percent attendance
    or better.

    +   - Eighty-nine percent of the BONGO students either increased or remained constant
    in their academic performance with 51 percent showing a major increase. Thirty-six
    percent failed science before BONGO, but passed during the program. Fifty-four
    percent had an increase in their science grades.

    +   - The most startling finding was that 32 percent of students went from passing
    no courses, or one or two courses, to passing *all* of their subjects, including
    those classes outside of the three BONGO periods.


    The Watson-Glaser critical thinking test administered to BONGO students demonstrated
    that 60 percent of those students significantly raised their critical thinking'
