- pgno: 83
  md: '# The Utility of Rubrics for Teachers: They Keep You Honest


    The most effective teachers I have observed and spoken with have all expressed
    their deeply held understanding that they teach students, not subject areas. They
    also understand that they need to have a deep mastery of whatever subject area
    they are teaching so that they know how to create appropriate explorations that
    allow students to own the understandings and skills in that subject. Teachers
    are so invested in each individual student that sometimes it becomes difficult
    on a daily basis to separate out the personalities of students from their current
    mastery of a concept or skill.


    By creating rubrics for each lesson with very rich entries in each cell, teachers
    can remind themselves of the difference between a student who is competent and
    has truly mastered a concept or skill and a novice student who, despite being
    a wonderful kid, is still working toward mastery. Likewise, it allows teachers
    to look with some objectivity at the somewhat difficult child and realize that
    he or she has mastered the material despite possibly having the teacher at wits
    end.


    Rubrics keep teachers focused on what level of mastery every student should be
    aiming for. Some students enter the class having mastered some or all of a concept
    or skill that is the focus of the lesson. These students need to be enriched with
    a higher or tangential investigation using the same exploration that the rest
    of the students are doing that day. The teacher has planned this extension ahead
    of time and created the expert category in the rubric. This assures parents that
    although their child is in a heterogeneous group, the teacher is differentiating
    appropriately for each level of mastery. In the mitosis lesson, Maria had questions
    ready for her expert students about spindle fibers and cell size that could be
    answered with the same materials but were not required understandings of all students.


    Another issue that can arise is that once teachers hear the expert-level students
    speaking about their insights, it becomes too easy to unintentionally expect the
    rest of the students to get to this level. This is true despite the original appropriate
    objective the teacher wrote in her or his plan. By having the competent and expert
    categories next to one another in the rubric, the teacher does not frustrate students
    who are not yet ready for expert understandings. It also allows the teacher to
    create appropriate assessments for the competent objectives expectations, and
    not to think of themselves as ineffective because their students have not all
    mastered the expert level.


    Just as with all the other parts of a plan, the cells in rubrics get richer and
    more useful as they are revised because teachers are paying close attention to
    student dialogue. Each time teachers better understand the intricacies that differentiate
    the categories of mastery from one another, they are then able to add to the important
    details in the cells.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'As you will notice in the objectives and rubric for the lesson, students are
    expected to understand that the cell must duplicate its genetic material, which
    tells the new cell what to do if it is going to operate properly. It is an extension
    of the concept clarification. It allows the teacher to bring in ongoing challenges
    about heredity and the gerbils, and the banana DNA activity. Students begin to
    understand the introductory ideas about genetic material in the nucleus that controls
    the whole cell and passes on the organism’s evolutionary history from generation
    to generation.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_84_0.png)


    # Thinking Space


    Reflect on your experiences in developing and using rubrics.


    +   - To what extent do you use rubrics in your classes? Do you develop your own
    rubrics, or do you rely on templates from online resources?

    +   - How have you involved your students in the development of rubrics? How have
    these activities affected your students’ engagement in self-awareness and self-management
    of their learning?


    # What We Were Thinking


    Once she created her rubric, I prompted Maria to create various kinds of formative
    and summative assessments to implement throughout her lesson plan. The formative
    assessment feedback would allow her to know what to do on the second or third
    day of the lesson, and the summative assessments would check to see if her students
    could apply understandings and skills to new and unique situations once she thought
    the majority, if not all, of her students had mastered them. By doing this, she
    would complete the inquiry teaching learning cycle before proceeding to the next
    topic and exploration.


    # Step 7: Create a Set of Assessment Questions to Guide Observations of Students
    in Exploration and Clarification Activities


    In inquiry teaching, there is not a separation between instruction and assessment.
    They occur simultaneously and should happen seamlessly in such a way that students
    and teachers can hardly recognize any difference. The role of formative assessment
    is to inform teachers (and in some cases, students) where various students are
    on the continuum of mastery so that it is clear what needs to occur with each
    student in the next class.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Create Formative Assessments


    The exploration stage is such a natural place for assessment to occur. As the
    teacher is cruising the room, it is possible to listen in on the small-group conversations.
    If your rubrics are clear, it is possible to differentiate where each student
    is in his or hers are not graded, but instead they are used as a diagnostic for
    understanding where each student is in her or his thinking.


    # What We Were Thinking


    As we know, the most successful teachers reflect on their work on a daily basis.
    One of the most vital times is at the end of the day when the teacher sits down
    with the lesson plan and makes modifications based on paying careful attention
    to how well each student mastered the objectives. This is the perfect time to
    modify both the assessment and facilitation questions while the interaction with
    students is fresh in your mind. Every year, the questions become richer and more
    effective.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Student Writing and Teacher’s Responses


    Students in Maria’s class wrote down all the original data they collected and
    ideas they or their small research teams negotiated in their notebooks so that
    they would have an immutable record of the evolution of their ideas. However,
    each evening students began to create parts of their final published report of
    their explorations and findings. Maria assisted them by scaffolding the process,
    while simultaneously getting feedback about theirs, prompting students to consider
    another perspective or to reorganize their ideas in a more logical progression.
    It is vital that the teacher assist students in translating their oral language
    ideas into symbolic language. She also gave written responses to the final reports
    that students published. Unlike their notebooks, these pieces were published on
    sheets of paper and handed in. Maria also supplied feedback question prompts so
    that students could revise their, while the second was a hypothetical problem-solving
    application also involving a written response. The two application tasks are as
    follows:


    +   1. If a plant cell in anaphase and telophase at the end of a mitotic sequence
    has genetic material made up of eight chromosomes, how many chromosomes will a
    non-dividing cell from the same plant have? Explain why you think this is the
    case using what you know about mitosis.

    +   2. Look at each of the prepared microscope slides labeled *A*, *B*, and *C*.
    They are all pieces from a certain part of the same plant. One is from the middle
    of the stem, another is from the topmost part of the stem, and the other is from
    an older big leaf. Which one is most likely from the top most point of the stem?
    Explain your thinking that led you to your answer. Include some drawings.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Two of the slides had very few or no cells in mitotic division; the third slide
    of the tip of the stem had a number of cells in various stages of mitosis expected
    at a place of continual growth and cell replication.


    # Additional Assessment Evidence


    In addition to these two application situations, Maria also had numerous other
    pieces of evidence from each student that she could use to assess their progress:


    +   - General notes for monitoring student progress on mitosis from her observations
    of students while they were working in their small research groups

    +   - Written responses that she received from each student for homework where
    they were asked to sequence their drawings and provide an explanation for their
    choice of sequence

    +   - Published exploration reports that she collected after the concept clarification
    stage; this was ongoing feedback because written feedback had been provided and
    students kept revising their thinking and communication of that thinking


    # What We Were Thinking


    Students will still need to take quizzes and multiple-choice tests throughout
    their educational careers, so it benefits us to have them practice taking these
    forms of assessment. This is true even though the tests and quizzes do not challenge
    their level of understanding as much, nor demonstrate as clearly to us what they
    have and have not as yet mastered. These quizzes and multiple-choice tests should
    be a much smaller part of a teacher’s assessment repertoire than is currently
    the norm. They should be used mainly to allow students to understand how to master
    this format of testing.


    # What We Were Thinking


    As students worked in their small groups of four, the teacher roamed the room
    and listened in on students negotiating their ideas or making plans for doing
    something. In that context, the best course of action for the teacher was to be
    quiet and not interfere, even if the group was headed a bit off course at first.
    Remember, learning is not the shortest distance between two points.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Students need some time to think on ideas and to struggle and figure out. However,
    at a certain point they can become too frustrated if they are heading completely
    in a nonproductive direction. Therefore, teachers should restrain themselves,
    but then when they need to facilitate, teachers should have some questions ready
    in their pockets.


    # ## Step 9: Create Facilitating Questions


    Maria realized how important it was to make up good questions ahead of time after
    her previous attempts at inquiry lessons. What she meant by “good” questions were
    questions that would have students think about the issue without leading them
    or giving away the answer. Here are some questions she had ready if students were
    really lost after struggling for a while.


    +   - When a root grows in the ground, where do you think it is most likely that
    new cells will need to grow? Why?

    +   - When a cell is about to divide into two new cells, what do you think it
    might look like?

    +   - If a cell is going to pass all of its traits and information onto the new
    cell being formed, what part of the cell do you think needs to give this to the
    new cell?

    +   - If the original cell needs to also have a copy of this information, what
    will the dividing cell look like?


    If you have read through this whole section without making an initial attempt
    to begin creating an inquiry teaching lesson for your own subject area, you may
    want to go back and write some initial thoughts for each step in the protocol.
    Some of you may want to read on and see how some teachers in other subject areas
    or grade levels created inquiry teaching plans before you, perhaps together with
    a colleague or two, create your own plan.


    # ## The Planning Process for First-Grade Social Studies


    Any subject area, grade, or developmental level is appropriate for inquiry teaching.
    Andrea Egitto, a first-grade teacher in Northampton, Massachusetts, used inquiry
    teaching to combine the concept of community with the local history of the Florence
    section of Northampton where her school is located. During the period before the
    Civil War, a group of citizens in Florence were so outraged by the laws of the
    United States that allowed slavery, a lack of women’s rights, and other inequities
    that they formed a separate community, the Northampton Association of Education
    and Industry (NAEI). In addition to engaging in many other progressive activities,
    this group became an active and important part of the Underground Railroad.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'The lesson that Andrea shares with us is one of the first she ever did using
    primary sources with her first graders. The complete lesson, “Utopia: One Great
    Family,” can be found on the Digital Resource CD. Previously, Andrea had planned
    inquiry teaching in other subject areas but not history. (See Andrea’s reflection
    about becoming an inquiry teacher in Chapter 3.)


    # Andrea’s Social Studies Lesson


    To begin the lesson, Andrea reads a picture book about the Underground Railroad.
    She asks students what they think it was like being a runaway slave going through
    Florence. She extends this idea to the bigger, yet more personal idea of what
    can be done if something is unfair. Students begin their exploration by creating
    a circle word map with the word “community” in the middle. This activity leads
    students to the idea of a community banding together.


    Together, Andrea and students read parts of photocopies of the original constitution
    from the NAEI. They also have other primary sources—maps of the town with stops
    of the railroad on it, a newspaper article from the local paper in 1867 written
    by the treasurer of the NAEI, and photographs of the buildings associated with
    the group. After viewing these resources, students add new ideas to their circle
    word map. They finish by working in small groups to write one sentence about each
    of two words that Andrea assigned them from the circle word map. In classes Andrea
    previously taught, there were even some students who were living in or next to
    houses that were on the Underground Railroad map! Subsequently, students were
    able to travel along the *African Heritage Trail* in Florence led by tour guides
    from the local historical society.


    Andrea explains how she became excited about using primary documents for the first
    time and how they fit so well into her inquiry-teaching format.


    # What Andrea Was Thinking


    Andrea had always used literature as a way to bring history to life for her students.
    Researching and creating this primary-source-based lesson had forever altered
    how she thought about and planned her history lessons. Using these primary sources
    can really bring to life a period in history like nothing else. Giving her students
    a chance to view old photographs, and even be able to see the different type of
    handwriting in a letter, can open their eyes to a whole world. It was even interesting
    for them to see how the newspaper looked so different than it does today. They
    compared the copies Andrea got from the microfilm to the newspaper today—wow,
    what a difference! Students actually began their exploration by doing history,
    by being historians using primary sources. They uncovered the concepts at a first-grade
    level and then communicated them.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'When Andrea first looked at the Library of Congress website, she was a bit
    skeptical about using primary sources with first graders. How could she use materials
    with them that they could not read or even understand? After planning her lesson
    and community project, she felt much more confident about teaching with primary
    sources, even to the youngest students. Primary sources could give them a window
    into history in a way that literature alone could not; photos, maps, letters,
    articles and, most of all, walking to the actual historic site in their own neighborhood
    was an awesome gift. She was so excited! Of course all of this led to deep understanding
    at a first-grade level of some complex social studies concepts and provided great
    motivation for Common Core sentence-writing skills.


    # Using Nationally Validated Curricula Materials in Science and Mathematics


    Nationally validated curricula materials that have been created through field-tested
    and researched National Science Foundation (NSF) funded projects provide valuable
    resources for science and mathematics teachers who wish to move toward inquiry
    teaching. These curricula have taken decades to develop and should be considered
    by any district or school looking to move to inquiry teaching. They have been
    field tested with thousands of students including gifted, special education, and
    language learners in urban, rural, and suburban areas. These materials provide
    a carefully devised package of the whole-inquiry learning experience. Any school
    or district looking to move toward inquiry teaching should visit these websites
    for an up to date list of the materials available


    +   - http://www.nsf.gov/pubs/2002/nsf02084/chap1_4.htm

    +   - http://www.nsresources.org/topic.cfm?topic=IM&allh=true


    In mathematics, some of these curricula have been utilized in urban schools and
    districts and, when teachers were provided appropriate professional development,
    students have experienced enviable success. You will hear from a number of teachers
    who have utilized some of these curricula.


    Although some of the middle- and high-school curricula do have some form of student
    book, the elementary FOSS and STC science curricula do not have textbooks. That
    is intentional. Each has suggested lists of science nonfiction trade books that
    are more appropriate for elementary grades and fit seamlessly with language arts
    lessons being taught in the same classroom. If you are looking for a way to increase
    engagement, differentiate instruction, and incorporate more informational text
    and student writing into your curriculum then Teaching with Text Sets (Cappiello
    and Thulin-Dawes 2012) is your answer. This must-have resource walks you through
    the steps to create and use multi-genre, multimodal text sets for content area
    (including science and math) and language arts study.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'However, some practitioners will find that even these nationally validated
    curricular activities can be opened up for more inquiry to allow for richer student
    experiences. Others, because of internal school politics, need to transform laboratory
    experiences already utilized in their schools. In either case, the suggestions
    in the section later in this chapter attempt to create a protocol that teachers
    could use to transform each of these materials into a richer inquiry experience.


    # The Planning Process for Sixth-Grade Mathematics


    Carolina Vila, a mathematics teacher from Andrews Middle School in Medford, Massachusetts,
    has modified a NSF nationally validated lesson from the Connected Math Program
    (CMP). She has embedded her lesson in a year of units based on social issues that
    matter to her students. Creating units around social issues allows students to
    engage in deeply creating academic understandings. (This topic is explored in
    detail in Chapter 5.)


    The following are Carolina’s units for the year for sixth- and seventh-grade mathematics
    based on the Common Core State Standards (NGA and CCSSO 2010b). For a full description
    of Carolina’s plans, “Sixth Grade Math Year Overview and Unit Introduction,” refer
    to the Digital Resource CD.


    # Unit 1: The Number System: Is Global Warming in Medford Real?


    For this unit, students can delve into the controversial topic of global warming.
    This topic allows for opportunities in which students can use negative and positive
    numbers, decimals, fractions, percent, and so on.


    # Unit 2: Expressions and Equations: How Did Carlos Slim Helu Become the Richest
    Man on Earth?


    Here, students can use expressions and equations to create an excel sheet (or
    some other program) that quickly keeps track of a business’s orders, expenses,
    profits, and so on. They can create their own “businesses” in their small groups.'
