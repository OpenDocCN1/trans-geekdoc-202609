  img_proc: true
- pgno: 113
  md: 'read, dividing up responsibility for plot, character analysis, finding and
    explicating metaphors, and more. Instead of just diving into the Internet cheat
    sites when faced with a challenging text, they now have to collectively create
    their own, and in doing so, not only help one another decode and discuss the book,
    but also figure out what makes for an effective and valuable study guide in the
    first place.


    # Reward Questions and Privilege Them over Answers


    Higher-order thinking questions—those that call upon application, analysis, synthesis,
    and evaluation—do not have simple, fill in the correct bubble kind of answers.
    Much of the work I do with my students involves helping them to understand how
    to ask questions like these, and I give them a great deal of practice in creating
    them. Whenever we start a new unit, I always poll students for what sort of questions
    they have about the topic at hand, and keep up that polling process as we go.
    Most class discussions begin with student-generated prompts, and particularly
    provocative or discussion-generating questions get rewarded on my whiteboard’s
    Hall of Fame section. By the time we get ready for our summative assessments,
    it is students who should be asking the questions.


    This is the core of inquiry. At minimum, I want students to draft, debate, develop,
    and employ their own approaches to problems, such as how to create an effective
    advertising campaign or how to make Shakespeare relevant to their own lives. At
    best, I want them to come up with these core questions on their own.


    # Let Students Make and See the Value of Mistakes


    Traditional classrooms privilege final products and punish error. Small wonder
    so many students either disengage due to low self-concept, or cheat and plagiarize.
    “We don’t get a grade for honesty,” an honor student I caught cheating once told
    me. “A college that sees me get a ‘C+’ is not going to care that I got it through
    hard work. They want to see the ‘A.’” After hearing this argument, in various
    forms, for years, I finally decided I had to change the way I handled and rewarded
    mistakes.


    Mistakes are often the genesis of our best learning, and school should be the
    place where students still have a safety net and second chances. Although I tend
    to grade very precisely, I also do so with the expectation that students can and
    will come to me to discuss the strengths and weaknesses of their products and
    seek to rewrite and revise. I always take the better of the two grades, so they
    have nothing to lose in making the attempt. When student groups try to collectively
    create a product, they often stumble, and sometimes outright fail. I always give
    groups the opportunity to self-evaluate at the point of summative assessment,
    and then reapproach and resubmit their product, at no penalty. Learning is a process,
    and'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'it often involves setbacks. The group that makes a comeback has shown me more
    concrete evidence of *learning* than the group that earned an “A” at the outset.


    Within reason, it is almost never too late for a student to make a comeback in
    my class so long as he or she shows genuine effort to make the attempt. Students
    are never guaranteed “A” grades. By that same token, a student has to try rather
    hard to earn a “D” or an “F” by consistently refusing to grab the multiple lifelines
    I throw their way. More than one student, and parent, has told me this is the
    single best aspect of my classroom, and they bemoan the rarity of it. I can see
    why it is rare—it nearly doubles my grading load! At the same time, I do not feel
    as if I am actually engaged in *teaching* if I do not do this.


    # Get the Community Involved as Much as Possible in the Classroom and Vice Versa


    When students see a disconnect between their life outside and inside school, their
    engagement plummets. The more students can use their out of school lives as grist
    for their in school assignments, the more it all starts to come together for them.
    When we practice persuasive writing and argumentation, I ask my students to identify
    real people they want to try and persuade (their parents, their boyfriend or girlfriend,
    the school principal, the president), and then address their argument to those
    individuals. We write letters to the editor of the local newspaper, or policy
    advice to local elected representatives—and then we send them off! One of my students’
    perennial favorite activities involves sending compliment and complaint letters
    to local or national businesses. Quite frequently, the companies write back with
    gift cards and free samples. This process makes the question of what makes for
    an effective, persuasive argument for a given audience come alive.


    Involving the community as an audience, or even as *assessors*, of student work,
    has also proved highly successful as a student motivator. I always invite parents,
    other class’s teachers and students, administrators and community members to our
    project fairs. It allows my students to know that their work will have an authentic
    audience beyond just me, and it strengthens ties and lines of communications with
    other stakeholders in the community. That community contains experts in a variety
    of fields. Involving a professional as co-teacher and co-evaluator has become
    a hallmark of my projects ever since I saw an Edutopia video where a math teacher
    enlisted the volunteer services of a local architect in helping her students use
    geometry to design hypothetical new school buildings. Now, when my students do
    their advertising project wherein each group designs and executes an advertising
    campaign for a product they choose or invent, a parent in the community who works
    as an ad executive accompanies us for several days, helping students define their
    questions and establish the final product rubrics, and then, in the end, serves
    as one of the'
