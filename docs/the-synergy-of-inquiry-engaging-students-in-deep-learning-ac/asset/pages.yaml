- pgno: 159
  md: '# Procedure:


    +   1. Each player is told to find an object that has a special value for her
    or him.

    +   2. Discussion follows during which each student tells how the object exemplifies
    her or his value.

    +   3. Give examples: a rock represents friendship because of its solidity or
    the moon is caring due to lighting the Earth at night.

    +   4. Encourage free expression. Participate yourself.


    # Two Truths and a Lie


    Students provide three statements, two that are true and one that is not. It works
    best if the two truths are unbelievable and the fib is unbelievable. All three
    are presented in a row. Then each statement is presented and students in the class
    raise their hands if they think the statement is the lie. After all three statements
    are voted on, the person says which one is not true. Hold off discussion until
    after everyone in the class has gone. Somewhere about a quarter of the way through,
    the teacher should participate.


    # Jigsaw Problem Solving


    Each teammate has part of the answer; teammates must put their information together
    in order to solve the problem.


    For additional activities, refer to Appendix G on the Digital Resource CD where
    you will find a collection of 28 activities including those described in this
    section.


    When students in a group are at the *forming* stage, for example, and individuals
    are simultaneously looking for inclusion, it makes sense to do some of the less
    physically close group-building activities, such as “Lineups” or “Metaphors” so
    that they still need to accomplish a specific task, but not in a physically close
    situation. Likewise, students could do “Two Truths and a Lie” or “Jigsaw Problem
    Solving” during this stage to get to know some things about their classmates outside
    of school. Initial classes should also start with some preliminary explorations
    about conflict, building up to conflict resolution skills, so that the conflicts
    that are likely to arise during the *storming* stage can be resolved in a positive
    manner. For descriptions of group building activities, refer to the Digital Resource
    CD where you find examples of structures for teaching as well as group building.


    Paul Burden (2006) speaks about various models of discipline and differentiates
    them by the level of teacher control, noting models that represent low levels
    of teacher control to high levels of teacher control. In inquiry teaching of academic
    concepts and skills where students are in a situation where they need to uncover
    concepts and practice skills, there is a great deal of teacher control. The control
    is in the extensive planning of powerful and appropriate explorations that the
    teacher creates. The control is in the guiding questions'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'the teacher uses while moving about the room. Indeed, the student does exercise
    greater control than in a didactic, transmission classroom, but it is still shared
    control with the teacher. It is collaboration.


    Many teachers do not attempt inquiry teaching or try to teach students to self-manage
    because they fear loss of control. Rather, if teachers plan well and give students
    the necessary support, students will be happy to share positive, group-supportive
    control with the teacher. It appears to be an enigma; by giving up certain types
    of control, you gain so much more. It is no longer them against you but rather
    we''re all in it together. Yes, as the adult in the room, you have ultimate responsibility
    for students’ mental and physical safety and the behavior of individuals supports
    learning, but teaching is so much more effective when the whole group has created,
    and is supporting, the strategies to achieve learning.


    # Group Building Games


    It is not surprising when students have not created a set of behaviors for sharing
    objects, ideas, and space if no adult has facilitated some process for them to
    do so. Although students engage in aspects of group process during the content
    exploration activities, they do not necessarily acquire facility with those processes
    in that context. Therefore, teachers find it useful to engage students in a set
    of physical, kinesthetic activities outside of these explorations that foster
    a group-building ethic. However, engaging students in group-building activities
    will not lead them anywhere unless each activity is followed by a discussion facilitated
    by the teacher where students make sense of the activity. The teacher is responsible
    for directing the discussion of how features of the activity demonstrate particular
    parts of the process necessary for effective team building.


    Although there are some activities that students can do sitting at their desks,
    a majority of them require students to get up and move around the room and physically
    interact with other students. These kinesthetic experiences are the most successful
    for group building (Griss 1998; Jensen 2000). We suggest that you start students
    with activities that require less contact and then move to more contact as the
    term progresses. For example, the first days of the class you might engage students
    in “Lineup” activities which are virtually contact free, then move to “Mirrors,”
    and follow this later in the term with the “Human Knot” which has a great deal
    of contact, although it does not require a lot of personal trust. Eventually,
    when the group has come together somewhat it is possible to try out other trust
    activities such as “Bridges” or “Finger Lifts.”


    Group-building activities are designed so that they can only be accomplished if
    the group works together as a team; this includes students in the class who have
    physical or mental disabilities. Of course, some of the activities will need to
    be modified so that all students can participate—including students who have physical
    disabilities. Most of the activities can be done with students ranging in age
    from Pre-kindergarten to high-school'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'age. However, teachers must know their students and judge which activities
    might be inappropriate for their group at a given time.


    Just as students need to build trust and understanding amongst themselves, if
    you have never engaged in facilitating these activities yourself, you need to
    trust both your students and your own abilities and do these activities on at
    least a weekly basis. If it is the beginning of the school year, you might want
    to do them more often. Virtually everyone who has engaged his or her students
    in these activities on a regular basis has thought the investment of time more
    than valuable and brought students through a metamorphosis.


    # Facilitating Group Building Games


    # Introducing the Activity


    Sometimes you need to connect the game to something that you have done before,
    for example, an incident that occurred in class or an ongoing set of skills that
    you and the class are working on. At other times, you may just want to start the
    activity cold. In either case, be sure to give clear, concise instructions about
    what you expect students to do during the game. Have a number of students paraphrase
    the instructions back to you to be sure most students understand. Before you begin
    the activity, plan how you will efficiently break students into appropriate groups.


    # Facilitating the Activity


    Be certain to walk from group to group, making sure that each group is engaged
    appropriately. Try to interfere as little as possible. Make quick decisions about
    those who opt not to participate. Will they assist you in some way? Try to let
    activities go to fruition, but stop them if necessary.


    # Debriefing


    This is the most important part of the activity, and it usually takes up the most
    time. This is the time when learning takes place.


    These suggestions will help you facilitate the debriefing discussion. Try to:


    +   - have your questions ready so that you get to the point (or points) you wish
    to make about the activity;

    +   - allow extended responses from students;

    +   - have them respond to one another’s responses;

    +   - ask them for thes and to connect their ideas to actual things that happened
    during the activity; and'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   - have them be as specific and operational as possible in their answers.


    Answers such as “we had to cooperate” are not helpful. Ask students what they
    actually had to do to cooperate or what it looked like when they were cooperating.


    Questions such as the following will help move the discussion:


    +   - What did it take to be successful at this game?

    +   - What do you mean when you say your group was a success?

    +   - What did people do that made it harder to succeed?

    +   - What strategies did you use in this game that you did not have to use in
    the game we did just before this one?

    +   - How were you feeling when this game was going on?


    All responses should be accepted and not evaluated other than asking if anyone
    has another way of looking at it. Having facilitating questions in your pocket,
    ready to use, is as necessary here as in an exploration where you want students
    to come to a certain realization. You should at least be able to get to the neighborhood
    if not the exact address!


    # Add New Aspects or Redo the Original Activity


    In order to address additional issues or to just practice cooperation or communication
    skills at a future date, you can add new dimensions (rules) to an activity, or
    just redo the activity with a new focus in the debriefing section.


    # Creating Class-Wide Strategies and Structures for Social Interaction


    The whole process of getting student buy-in to the classroom being a mutually
    supportive community needs to begin on the first day of class. Although many teachers
    will frontload the use of group-building games to begin to create community in
    their classroom, this will not be effective unless students are also quickly engaged
    in classroom meetings. As we read in David Nurenberg’s description of his classroom
    at the beginning of this chapter, during classroom meetings, students will be
    engaged in exploring what structures and strategies they would like to see in
    place in the classroom in order for them to feel respected so that the classroom
    is a place where they can learn.


    # Classroom Meetings


    One of the first class meetings should focus on what strategies and structures
    students would like to see in place when whole-class discussions occur. The teacher
    first asks students to individually write down at least five things they think
    make whole-class'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'discussions pleasant and fruitful for them. They can also write down things
    that they do not like to see occur during these discussions. Next, students are
    asked to see if they can come to consensus in their small groups about how they
    would like to see whole-class discussions occur. After a reasonable amount of
    time, the teacher calls the whole class together so that each group can put forth
    one idea at a time and see if the rest of the class can come to agreement about
    each idea. These ideas usually include features such as the following:


    +   - listening when someone else is speaking

    +   - not interrupting someone else when he or she is speaking

    +   - expecting people to look at the person who is speaking

    +   - not making derogatory remarks about what someone has said

    +   - expecting everybody to participate, although not necessarily in every discussion


    Usually there are long discussions and negotiations about whether students need
    to raise their hand in order to speak or whether this action takes away from the
    flow of discussion. This consideration usually occurs in middle and high school
    classrooms, although some elementary classrooms have dealt with this issue as
    well. If hand-raising does not occur, then many times strategies such as “the
    person who just finished speaking will call on the next speaker” are suggested.


    Once the class has come to its best consensus on a list of strategies and structures
    that it can agree to, the teacher posts the list. In lower-grade classes, many
    times students all sign this post, so it is clear that they understand their responsibilities.
    In upper-grade classes, students verbally agree to abide by the list. No matter
    what the list, within a couple of weeks, students will encounter situations that
    arise where the ideas on the list do not make for the best student interaction.
    At this point, either the teacher or students in the class can ask for a class
    meeting to be called to negotiate modifications. Once there is buy-in by students,
    and academic activities are engaging, the teacher no longer needs to be the police
    officer, and students will begin to self-manage one another. This process is the
    basis for a democratic classroom. It sets up an experiential structure that leads
    students to become effective participatory citizens in their local, state, and
    national communities.


    Of course all of these devised approaches need to be in compliance with whole-school
    regulations, unless exceptions are negotiated in advance with the principal. You
    may already have noticed that I have avoided the use of the word *rules*. It is
    a word that comes with a world of connotations and baggage, and some students
    who think something is a good strategy, may defy the idea just because it is a
    rule. There generally needs to be some bottom line, unacceptable behaviors that
    have an immediate consequence. Someone who physically or emotionally hurts someone
    needs to remove themselves from the group immediately and the teacher needs to
    set up either mediation or guidance situations to'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'occur that same day. Most other examples of students not abiding by a strategy
    or structure are organically dealt with by the group as a whole, under the facilitation
    of the teacher.


    # The Role of Classroom Meetings and Relationships in Dealing with Disruptive
    Behavior in the Classroom


    When teachers ask me what can be done about disruptive behavior of students in
    the classroom, I say that I cannot answer that question until they let me know
    whether the class had created structures or norms of behavior that everyone has
    agreed to earlier. Similarly, I want to know if the teacher has met with each
    student to determine what his or her expectations are for the class. If these
    relationships are established, then when two students are disrupting the class,
    the teacher has strategies to resolve the situation. Consider the following scenario:


    > > The teacher simply asks each student, “**What are you doing?**”

    > >

    > > The student starts to explain the situation, but the teacher reiterates much
    to the surprise of the student, “**What are you doing?**”

    > >

    > > The student finally answers something like, “I am arguing with the other student
    about the pen.” The teacher then says, “Will this **get you what you want** from
    this class?”

    > >

    > > The answer is usually, “No.”

    > >

    > > The teacher continues, “Then what plan can you make for now so that you get
    what you want from this class?”


    None of this proven effective interaction can occur if these relationships were
    not created earlier. We realize this still has not solved the issue of the ownership
    of the pen, but the class is no longer disrupted, and the two students are back
    on task. At the end of class the teacher might be of some assistance with the
    pen issue.


    This method is a very simplified modification of William Glasser’s (2011) Choice
    Theory and Reality Therapy, applied to classrooms. It is sometimes called *Responsibility
    Training* and has been used successfully in many schools across the country. Just
    as in inquiry teaching, it is built upon students figuring out plans, designing
    norms for the classroom, and negotiating modifications of these in classroom meetings.
    A former New York City high school student of mine who participated in the BONGO
    program, a successful program for at-risk urban adolescents, which will be discussed
    in Chapter 5, addressed this issue of responsibility and its effects on teenagers.
    Just after his graduation, Ron Zirin pointed out the following when he was being
    interviewed about his experience'
  merge: -1
  img_proc: true
- pgno: 165
  md: '> > at the school. “In the other schools I was at, they expected you to learn
    responsibility through discipline, and for me and many other teenagers we would
    just naturally try to defy the rules. Here at Middle College High School, and
    in BONGO in particular, it is just the opposite. You learn discipline through
    responsibility” (Jablon and Born 1989).


    # Conflict Resolution Skills


    Conflicts will always occur. Consequently, conflict-resolution activities need
    to be added to the mix once student engagement is evident and some group building
    games have occurred. The question is, can we resolve them in a positive way for
    everyone involved, and in some cases, even de-escalate situations before they
    become full-blown conflicts? There are wonderful books and manuals filled with
    conflict resolution activities for every grade level.


    In elementary schools, the grade-level teacher usually runs these activities throughout
    the year. In middle schools, and even nowadays in some high schools, the optimal
    place for these activities to occur is in advisory class. However, if there is
    no advisory class, then subject-area teachers need to do these tasks in their
    classrooms. If you are not familiar with the concept of advisories, it is described
    later in this chapter.


    Many times teachers who feel pressured will say they do not have time to spare
    to do these activities with students. When I ask them how much time they spend
    on discipline issues or having to reteach lessons because students are not really
    attending, they say that it is substantial. Doing this is an investment, letting
    students acquire self-management and conflict resolution skills that pay off for
    the rest of the year. These skills also pay off for the rest of students’ lives.


    Through these activities, students come to understand some important concepts
    about conflict resolution skills that pay off for the rest of the year. These
    skills also pay off for the rest of students’ lives.


    They learn:


    +   - how conflicts escalate;

    +   - how to de-escalate conflicts;

    +   - how to be active listeners;

    +   - how to use “I” statements instead of “you” statements; and

    +   - how to avoid conflicts associated with in-school and out-of-school cultural
    differences.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'You do not need to devise these activities. There are comprehensive whole-year
    programs that are specifically written and field tested for elementary, middle
    or high schools. Be sure that these manuals are all written by teachers and field
    tested in urban, suburban, and rural areas.


    These conflict resolution activities need to be done before any *anti-bullying*
    programs are instituted. They set the groundwork for such programs. In addition
    to teachers using these strategies with their students in their academic classrooms,
    many schools utilize homerooms, advisories, and other structures within their
    schools to accomplish the facilitation of these skills.


    Many grade-level teams in elementary schools, interdisciplinary teams in middle
    school, and subject-area departments find it helpful to have teachers and administrators
    themselves engage in the middle or high school level of these conflict resolution
    activities. If they are to be an effective educator team, not only does this help
    them better facilitate the activities with their students, but it gives their
    own teacher teams the ability to effectively get through the confrontations of
    differences that occur in the storming stage of their team’s evolution. Most teams,
    even in middle schools that are based around teams of teachers, are *faux teams*
    because those team teachers are not willing, or are not encouraged by the administration,
    to work together and struggle to overcome their differences until they can come
    to some group norms for their educational goals and methodologies. Think back
    to David Nurenberg’s loss of a $15,000 grant to teach an after-school interdisciplinary,
    inquiry-based class described in Chapter 3. Teams of teachers that have gone through
    this process are the teams that parents beg to have their students be assigned
    to.


    # Whole Curricula or Programs for Building a Positive Community in your Classroom
    or School


    If you work at the elementary level, you might consider using a research- and
    evidence-based approach to elementary education that leads to greater teacher
    effectiveness, higher student achievement, and improved school climate that goes
    well beyond the conflict resolution manuals listed above. This is an approach
    that I have seen fit seamlessly with good inquiry teaching classrooms and schools.
    Social and emotional learning programs focus on teaching students how to manage
    emotions, their behaviors, and interactions with others. Some do so through direct
    lessons, but others focus on teacher language and modeling expectations, describing
    themselves as an approach to learning rather than a program. A controlled study
    at the University of Virginia showed higher language arts and mathematics scores
    on standardized tests in classrooms of teachers who faithfully utilized one of
    these programs.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'One of my favorites on how to create a positive middle or high school community
    in your classroom is *Making Learning Real* by Carol Miller Lieber (2009). This
    book addresses every issue a teacher can have about reaching and engaging *all*
    learners. If you want to know about personalized learning for yourself and your
    students, resilience and positive life changes, culturally responsive teaching,
    and social efficacy, here is the go-to manual.


    Later in this book you will also hear about schools that utilized programs of
    adventure learning using both low and high ropes courses.


    # Building Relationships


    Joe Dolan, a colleague and also a principal in Cambridge, Massachusetts, emphasizes
    the idea that both teaching and discipline are about relationships. He says that
    a teacher’s greatest asset is a positive relationship with each student. To build
    on that idea, I will add that the relationship between all of the students in
    the class is equally important. That is why we do “Two Truths and a Lie” or “The
    Name Game” so that not only the teacher, but every student, can know the name
    and something about every other student in the class. Refer to the Digital Resource
    CD for descriptions of “Two Truths and a Lie” and “Name Game.”


    In an inquiry-teaching class, the importance of the teacher communicating to students
    that much of the knowledge to be learned will come from themselves and other students
    cannot be overlooked. How the teacher facilitates the *concept clarification phase*
    of the inquiry teaching learning cycle provides the model for students to emulate.
    For example, when a student makes a statement, the teacher should *not* repeat
    the statement. On the contrary, a really effective whole-class discussion during
    an inquiry lesson occurs when a student from one group gives his or her understanding
    and a student from another group then responds to the statement. A third student
    can then question one or both on the interpretations from each of these previous
    students. Yet again, another student can ask for clarification of an idea. The
    best would be for another student to try to synthesize some of these ideas into
    a more generalized idea. None of this can occur if students are not listening
    to one another and are responding only to what the teacher repeats. Therefore,
    the teacher should not repeat the idea because students then see the idea either
    as coming from the teacher, or being validated by the teacher.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '> As an undergraduate in my teacher preparation program, I was actually taught
    to repeat student answers because everyone in the class might not have heard what
    the student said. (I hope that is no longer the case, although I expect that some
    of you may have had a similar experience.) However, in an inquiry classroom we
    really need to be aware of the importance of creating an ongoing interactive dynamic
    among students and having them negotiate ideas. We do not want to get in the way
    of this process by repeating their answers.


    If we really want to build positive relationships between students who are usually
    not friends, while also increasing academic understandings, then there is no better
    way than to have students out of the school on field trips that are mostly related
    to academics. If at least one of these can be an overnight experience, positive
    relationships increase exponentially.


    The more assignments you create that require the use of other intelligences as
    outlined by Howard Gardner (2006), the more opportunities you will provide to
    include those students who are not strong in logical-mathematical or written linguistic
    areas. Since almost all school-based assignments call for these two areas, students
    who excel in other areas see themselves as stupid. Oral poetry, music video production,
    drawing, or dramatic and dance performance given as mandatory assignments, not
    always as alternative assignments, honor their skills and understandings and their
    peers realize how they need the help of these previously *dumb* classmates. When
    we give these assignments, we create strong relationships with some previously
    unreachable students.


    # Distributed Counseling


    For over a decade, I have worked with a group called the *Institute for Student
    Achievement*. This is a group of former principals and teachers who have retired
    from very effective small inner-city high schools throughout the country. Using
    only a few full-time staff to coordinate the summer institutes and on-site weekly
    mentoring, the group has helped launch over a hundred effective small high schools
    in cities such as New York, Atlanta, Buffalo, Detroit, Newark (NJ), and Union
    City (NJ) to name a few. In addition to strong inquiry-based curriculum and high
    collaboration between the faculty, staff, and administration in the design and
    daily operations of the school, they have created a distributed counseling model
    that all the schools try to completely infuse into who they are and what they
    do.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'In this model, everyone in the school sees themselves as a counselor to students.
    They are not trained counselors and are not giving advice to students. However,
    all teachers listen to students and their issues and reflect back to the student
    what the student has said in a way that the student can clearly see the situation
    in which they are engaged. The teacher can then help the student see various responses
    and their possible consequences. When teachers see issues arising that they think
    are beyond their abilities to deal with, they can refer students to two or three
    well-trained counselors whom students admire and trust. It is up to the student
    if she or he wants to continue talking to the guidance counselor. Students almost
    always do, but it is not over then. The counselor reports any progress back to
    the teacher what he or she can without losing confidentiality and credibility
    with the student. Of course the teacher keeps up the original relationship with
    the student.


    These relationships and conversations many times come about because teachers are
    engaged in inquiry teaching that has led to project-based learning, which many
    times has a public presentation product. Once students are making something real
    while working *with* the teacher, then real person-to-person conversations occur
    naturally. Other times, it is because the teacher is the advisory teacher. Before
    the concept of *advisories* became a nationally accepted part of effective middle
    school practice, my colleagues at the original Middle College High School in New
    York City had created a very similar concept that they called *house*.


    At our school, *house* met for 20 to 30 minutes every day (it changed over the
    years). It consisted of about 12 to 15 students and an adult. Most of the adults
    were teachers, but the principal, assistant principal, the counselors, family
    workers, and some exceptional paraprofessionals also had a house in order to keep
    the student to adult ratio down. Ninth to twelfth graders were in the house, and
    houses stayed together for four years. If four seniors graduated, they were replaced
    the next September by four new freshmen. That way every student not only had an
    adult advocate, but they also had a dozen or so other students who were connected
    to him or her. They also knew each other''s stories and looked out for one another.
    Juniors and seniors would try to stop ninth and tenth graders from messing up
    like they had. Sometimes conflict resolution activities or some group building
    games were organized in September for new student inclusion, but many times it
    was just checking in with one another to see if people could help with issues.
    The "house teacher" met with the parents each term for four years and knew much
    about the family life of the student. This created a positive working relationship
    with the family.


    Many times, the student had a closer relationship with another subject-area teacher
    than with the house teacher. That was fine because there was an intentional network
    that ran like a web where, if something was going on with a student, everyone
    on staff soon knew with whom to speak. This web included not only the adult advocates
    who had a relationship with the student in question, but also other students who
    had a relationship with the student and were included to became another kind of
    help and advocate.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Once you have a school with 500 or less students, this structure is really
    possible. During the 13 years I worked at the school, two different principals
    served and each of them knew not only the name of every student but usually knew
    some personal information about them as well. Needless to say, they spent more
    time out and about in the school than in their offices. The counseling was truly
    distributed.


    Unfortunately, not all schools are set up this way. If this is the case in your
    school, your classroom-community building activities become even more important.


    # Building Cooperative Group Structures


    It seems that whenever I ask teachers about the cooperative-group structures they
    employ when their students are working in small groups, they usually mention Think-Pair-Share,
    but they have a hard time identifying other effective interactions. Over the years,
    teachers have created a variety of group structures that fit the needs of particular
    lessons. Teachers, especially those using inquiry teaching, should take advantage
    of all that are available.


    # Sample Cooperative Learning Structures


    # Circle the Sages


    Students who know about something stand to become sages. Teammates each gather
    around a different sage to learn. Students return to teams to compare notes.


    # Find My Rule (Property)


    The teacher places items in a frame (e.g., two boxes, Venn diagram, or on a line).
    Students induce the rule for each, that is, what is the property in common, or
    the rule that makes them similar: Two Box Induction, Crack my Venn, or What’s
    my Line?'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Fish Bowl


    Have three or four students engage in a discussion, debate, role play, or other
    interactive activity. The rest of the students in class form a circle around them.
    The observers in the outer circle cannot say anything until the inner group is
    finished, as determined by the teacher. The outer circle can then ask questions
    of those in the inner circle or of one another.


    As always, the teacher should have a pocketful of facilitating questions at hand
    to move the discussion in an appropriate direction if students seem to be having
    difficulty with the process.


    # Formations


    Students stand together as a class and form shapes. For example, base groups choose
    an animal for a mascot (an eagle) and re-create the image of it. One person becomes
    the body, two others become wings, and so on.


    Taken to a higher level, have students become a statue depicting their impression
    of child abuse, racism, and so on.


    # Gallery Walk


    Students in their small groups are asked the same question, challenge, or situation.
    They write their answers by drawing on chart paper with markers.


    After a period of time decided by the teacher, students post the chart paper in
    different spaces on all four walls in the classroom.


    All the groups then get to amble about the gallery, stopping at each chart and
    reading the ideas or seeing the drawings.


    As a variation, as individuals or groups find something inspiring, they can use
    a different color marker and add their extensions to the original idea. They can
    also ask thoughtful questions.


    # Inside Outside Circle


    Students stand in concentric circles, with the inside circle facing out and the
    outside circle facing in. They make a quarter turn to the right and then march
    or rotate past each other. The teacher defines how many people they must pass
    before they stop. When they stop, they turn and face the person they are paired
    with, and respond to teacher instructions (e.g., Share an answer, express your
    opinion, or come up with an explanation).'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Jigsaw Reading


    Each teammate has part of the handout to read. Student 1 must read and teach section
    A to Students 2 and 3. Student 2 must teach B, and Student 3 must teach section
    C. All students with section A, plan lessons. Sections B and C do the same; then
    they return to the original group of one, two, and three and begin to teach.


    For more information on Sample Cooperative Learning Structures, refer to the Digital
    Resource CD.


    If you are not familiar with many of these structures and other aspects of facilitating
    lessons in small groups, I would recommend that you research cooperative learning.
    I have been using The Cooperative Classroom by Lynda Baloche (1998) with teachers
    in staff development sessions and my classes. Because Baloche’s work has been
    so useful to me, it is likely that some of this chapter reflects some of her ideas
    about creating an effective community of learners in the classroom. She also has
    much more detailed descriptions of cooperative group structures and details about
    the kinds of lessons that they are best suited for. Every time you begin to question
    whether the changes she suggests for your classroom are worth the trouble, she
    will reference studies that demonstrate their efficacy.


    # A Grade So Far


    If we follow on the structure of the spiraled inquiry teaching learning cycle
    where concepts and skills spiral through subsequent lessons, we can see that this
    structure enables all students to master a competent level of concept understanding
    or skill acquisition with the help of their peers and the teacher. However, whether
    this total mastery will occur within a day, or even three days, is not always
    guaranteed. Therefore, when students hand in their reports, videos, or authentic
    assessments, if they are not given a grade so far, they will usually not continue
    to try and master what they have not fully accomplished.


    Students should always receive comments and questions back on their assignments
    that allow them to redo the work and master the material. Of course there is a
    great deal of conversation among teachers about how to tweak the redo procedures
    so that it does not encourage students to be lazy on their first attempts. If
    inquiry teaching is to succeed, whatever an inquiry teacher finally decides as
    the procedure, teachers need to have a grade so far policy accompanied by some
    level of response to the original student work. Similar to the practice of asking
    students to explain their thinking rather than just answers, this procedure lowers
    the incredible tension that accompanies testing and assessment.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Grading in Cooperative Groups


    Fairness in grading in cooperative groups can be a contentious issue with two
    aspects: (1) the effectiveness of cooperative learning groups and (2) the assessment
    of individuals in those groups. As a participant in an education seminar focusing
    on upper elementary school through college inquiry teaching, it soon became clear
    to me that many members had questions about these two matters. Even more concerned
    about grading in cooperative groups are parents of students in them. How grading
    can both encourage students to do their best work and at the same time have them
    see that it is in their own interest to assist others who do not quite understand
    a concept, becomes the elephant in the room during conversations with parents,
    students, administrators, and other educators.


    As I began to explain various aspects of this complex interaction, the evolution
    of my own thought and understanding of this teaching framework over the past 35
    years began to clearly unfold. It was sometime in the early or mid-1970s when
    we first began to hear how the Russian schools had structured their classrooms
    such that students were placed in small groups that would be graded as a team
    that I began to utilize a similar methodology with my students. In addition to
    the positive results that the Russians were achieving, it was my own experiences
    with student peer coaching, running student sports teams, and my own personal
    work as a member of a science-research team that prompted me to reformat the structure
    of my classroom.


    At this point in my teaching career, I had already realized that students constructed
    their own knowledge. They had preconceptions about most natural and human phenomena
    in the universe and my job was to allow them to prove this preconception right
    or wrong. My job was to facilitate their understanding when they wandered from
    a logical experimental or aesthetic design. Until I had allowed them to design,
    and to modify and redesign their own explorations, confronting their accurate
    or inaccurate preconceptions, they would not be interested in how the larger community
    had uncovered how nature or human systems operate. They needed to hear these academic
    stories contextualized within their own questions, discoveries, failures, and
    ideas. Since I would have students uncovering major concepts while building their
    problem-solving skills rather than memorizing a body of knowledge, I realized
    I needed some way of more closely mirroring what happened in real academic-research
    teams. Similarly, I had coached sports teams and had been in charge of peer tutoring
    and therefore realized the power of students supporting one another in a common
    endeavor.


    Given this background, rather than tiptoeing around the idea, I jumped right in
    and spent the next 13 years trying to perfect the system. The system is still
    not perfect, but it accomplishes many of my goals. During these years, both students
    and I kept daily journals of how the class was going relative to our lives. They
    gave me their journals privately for my responses, whereas mine was open for anyone
    to read and comment on (a practice I highly recommend even if you do not do cooperative-learning
    groups). This'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'provided me with feedback about how these groups were operating and how individuals
    were, or were not dealing with the problems and successes that ensued.


    Since then, I have been teaching full time in the school of education at a university.
    Johnson and Johnson (1999) and others have written their books, and the term *cooperative
    learning* is on the lips of most of those involved in education. Robert Slavin
    (1995) has collated data from over 20 years of research about the effectiveness
    of cooperative learning for the brightest, slowest, and average learners in classes
    throughout the country. As I run classes for undergraduate or graduate students
    or professional staff development workshops for educators that include a section
    on cooperative learning for inquiry learning, I encounter a set of questions that
    people do not seem to be able to find satisfactory answers for in the literature.
    At first I was surprised, but I soon came to realize that it had been my own years
    in the classroom, and discussing the results with other teachers I respected,
    that had uncovered most of the responses I give to such cogent questions. These
    questions include the following:


    +   - If you give one grade, how do you prevent one student from doing all the
    work on a report while the others coast?

    +   - If you give individual grades, do you defeat the idea of team building?

    +   - How often do you change students in groups?

    +   - How can you keep track of the progress of each student in each group if
    they are collaborating on their work?

    +   - Is this method really effective in providing students with the skills they
    need to contribute to a team in the work place?


    Some of the answers are straightforward and concise, while others are more dependent
    upon the underlying objectives of the teacher who is employing this technique
    and lead to other, more introspective, questions to be answered. For example,
    the issue of how to effectively and fairly grade students in a cooperative group
    motivated me to create a system that helps define a reasonably powerful answer:
    use three or four forms of evaluation.


    # Evaluating a Single Group-Prepared Report


    At times, students in a group would submit one extensive report of their findings
    and the inferences they drew from their findings. These reports usually turned
    out to be five or six handwritten pages at the secondary level, including a detailed
    procedure they used, along with conclusions that could be drawn from evidence
    they presented. Likewise, they critiqued the limits of their procedures. Students
    collaborated on this report over the two or three days it took to do the investigation.
    Sometimes they divided up the tasks of an exploration, or they all worked on it
    at the same time if it seemed quick and straightforward. They realized that they
    all needed one another’s phone numbers or'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'e-mail addresses, and sometimes they stayed after school or went to one another’s
    houses to meet and work on the report. Along with the report, students needed
    to evaluate themselves and one another on a sheet of paper about the level of
    their contribution to this work. This one report was handed-in and one grade for
    the group was given with some minor modifications based on the self-evaluations
    (read by all students in a group).


    # Determining Who Contributed to a Group Written Report


    With this single method of evaluation, I was not at all sure that each student
    had worked on the report and had acquired the concepts and skills expected. Many
    times, some hard-working student would do most of the report to be sure that she
    or he would receive a good grade. That student had almost always tried to divide
    up the work but found one or more students in the group did not come through with
    a level of understanding anywhere near theirs. When they groused about this enough
    at home, parents would come visit me at school about this unfairness.


    In an attempt to get the more aware students on a given topic to begin enlisting
    the less interested or knowledgeable students during the exploration, I implemented
    the following. I informed students that there would be a group written report,
    and they would not know whether I would collect the report or give a quiz on the
    report to one student in the group the day it was handed in. Occasionally, I would
    give a two-question quiz based on the report that I held in my hand. For this
    quiz, I could call on any one person from the group whose answers would represent
    the grade for the group. This approach encouraged the team members who had more
    understanding and motivation to be sure they tutored those less enthusiastic.
    Since they soon discovered that tutoring after the fact was more difficult than
    getting the student to participate in the actual doing of the exploration, they
    began to devise ways of motivating these less enthusiastic members. Many other
    times, I would collect reports or other final projects written by each student
    in the group. However, as they were working on the exploration, they would not
    know whether the final “published” document would be a group or individual document.
    The reports or final projects would have some parts in common, but since each
    student needed to do the final synthesis, analysis, or creative expression, there
    would always be great differentiation.


    Students and parents generally saw this as fair. Much of the time they were being
    evaluated on their understanding. Since most parents needed to work on a team
    at their jobs, they understood when I explained to them that I was giving their
    sons and daughters group leadership skills that would serve them well throughout
    the rest of their lives. Even though there were singular team reports, the other
    parts of the repertoire, used in slightly greater proportion, orchestrated a balance
    between fairness to individuals and team building.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Determining Group Membership


    The questions of who to assign to groups and when to change groups require a more
    complex and multi-dimensional answer. I usually began the term by arbitrarily
    assigning students to teams, literally having them count off, so they would end
    up in random groups. Since I had no basis to make any judgments on, I thought
    this a good method of getting students who did not regularly interact to get to
    know one another. I found it best to let these groups run for about a month to
    six weeks before rearranging the groupings. This timing allowed for students to
    not only encounter difficulties in getting certain group members to accept particular
    duties, but it also gave them time to attempt to work out these difficulties utilizing
    the conflict resolution and group-building skills that they had acquired. Through
    journal writing and seeing other students’ responses as well as through regular
    social student interaction, various groups shared strategies that they employed.


    The next regrouping depended on my objectives. Sometimes I wanted stronger students
    paired with weaker students in order to give assistance to those who needed it
    and to raise the esteem levels and comprehension levels of the stronger students
    that come with having to explain concepts. Other times, I wanted to place students
    who were not contributing their part in their original groups with students who
    I knew were socially attracted to as a motivation for them to be proficient. Later
    in the term I sometimes changed the groups so that all the most motivated people
    were in the same groups and those who were still trying to “coast” were together.
    It is amazing the effect that having four students who have been dependent on
    the work of others placed together in the same group for success can have on some
    constituents of that group. Other times, I divided groups such that there would
    be four “quiet” students together. Many times, leaders emerged from this mixture.
    Even later in the term, I let them select their own groups. It was most interesting
    to note, both from my own observations, and from their journal entries, that by
    this time in the semester they had learned not to always select their social friends.
    Rather, they began to use criteria they had developed during the beginning of
    the term regarding the attributes needed in members of a good team, to select
    their new teams. During a 15-week term, I would change groups at least three times,
    sometimes as many as five times.


    Lastly, what is most important is the flexibility this structure gives you as
    the teacher. You are constantly doing formative evaluations of groups and individuals
    as you circulate the room. You hear team members trying to articulate conceptual
    frameworks and investigative strategies. You are there to ask the appropriate
    questions that will guide them to procedures that will lead to greater understanding.
    You are on the scene to hear of differing data, interpretations, or strategies
    between groups so that you know when to stop them mid-exploration and have them
    compare results. The discrepancy in results at this juncture will allow them to
    see the need to control a variable or evaluate an approach or procedure before
    continuing.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'The picture painted is of a constructivist, student-centered inquiry classroom
    with the teacher assuming the role of facilitator. A deep and clear understanding
    of complex concepts can be built during subsequent discussions since the teacher
    has been integrally involved in students’ dialogues during their investigations
    of the preliminary aspects of the phenomena governing these concepts. Thus informed,
    the teacher has the necessary insight into areas of difficulty.


    My own experiences demonstrated a radical improvement in all areas of student
    behavior, motivation, and achievement. Concept and skill achievement levels of
    both stronger and weaker students increased, matching what Slavin (1995) had found
    in his 20-year meta-analysis of cooperative learning data. Likewise, their abilities
    to cope with teamwork situations rose to high levels as demonstrated by students
    who enrolled in subsequent courses who became facilitators of their collaborative
    teams and had them in successful operation within the first few days. These techniques
    changed my life as a teacher, prompted some of my students to join real research
    teams, and improved the lives of many of my students.


    # Designing Your Classroom’s Physical Environment


    In biology, architecture and engineering design, *form best supports function*.
    Including a little aesthetic beauty does not hurt either. Now that you have conceptualized
    inquiry teaching, the next step should be to design a learning environment that
    best supports this mode of learning. In a later chapter we will even challenge
    the concept of where, in a physical sense, learning best takes place. However,
    for this chapter, and given that tomorrow most of us will be assigned a classroom
    in which to teach, let us address the simpler issue of what should be in our classroom
    and how it should be arranged.


    During inquiry-based teaching, students are conducting explorations in their small
    groups 60–70 percent of the time. The rest of the time, they are in some whole-class
    discussion about their small group results, watching media, or listening to their
    teacher tell them about something from the greater academic community that expands
    their explorations. Therefore, since form follows function, the classroom should
    be set up first for small group activity, with the ability to transform it quickly
    into a placement where the whole class can easily see and hear each other during
    whole class activities.


    Another important feature of inquiry teaching is that the students are at the
    center of the learning endeavor. The room should visually symbolize this. Once
    there is a “front” of the room with its teacher’s desk, it becomes a visual symbol
    of the teacher as the focus of learning, the fount of knowledge to be distributed.
    We all know that in our traditional rows-of-desks classrooms, the kids who wanted
    to learn and felt comfortable participating sat at the front of the room, and
    the farther back you sat, the more you could get away from being called on for
    answers.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Over the years, I changed the seating arrangements multiple times in my own
    classrooms throughout my evolution to inquiry teaching. I have also visited hundreds
    of other classrooms and have seen many seating configurations. What I present
    below is the arrangement that seems to best meet all the criteria, and yet works
    handily on a day-to-day basis. It works well at all grade levels.


    # Figure 4.3 Classroom Design to Support Students Working in Groups


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_178_0.png)


    The teacher begins at the middle teaching table, but he or she is soon cruising
    the room moving from group to group. Getting from one group to another is a matter
    of moving only several feet. All four walls have places to record on chart paper.
    There is no front of the room. If there is a quick whole-class discussion called
    by the teacher in the midst of the exploration phase, students stay seated as
    they are in this set-up. However, if there is to be an extensive whole class discussion,
    as there is in the concept clarification phase, then half of the students move
    their chairs a few feet as demonstrated in Figure 4.4. This chair-moving process
    after the first few times takes about one minute. The chairs are moved so that
    every student can hear and see each other easily.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# **Figure 4.4** Inquiry Teaching Room Rearranged for Whole-Class Instruction


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_179_0.png)


    Every wall of the classroom has storage shelves and cabinets for physical materials
    used during the exploration phase. These could be props for role plays, historical
    items for handling during social studies, science materials, or math manipulatives.
    Usually a file cabinet and a supply cabinet for teacher use are provided, but
    there is no need for a space-consuming desk. Projects should be displayed around
    the room. If the classroom is large enough, rugs and other furnishings can be
    added. The less the space can feel like a traditional classroom and the more like
    an exploration palace or workspace, the more likely students will be deeply invested
    in their work.


    # Middle School is Not the Name on the Outside of the Building


    Middle School is an educational concept. It is a set of practices that make learning
    comfortable for early adolescents. Many schools across the country have the name
    *middle school* on the outside of the building and the grade spans are either
    fifth to eighth or sixth to eighth. However, many of these are not *middle schools*
    and instead are still junior high schools. Throughout the 1960s and 1970s, a group
    of early adolescent educators realized that the junior high schools in our nation
    were the weakest link in our educational systems. These schools where students
    were encountering a developmental level imbued with great anxiety had structures
    that exacerbated the situation for these students. Therefore, both their cognitive
    and emotional development suffered.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'A number of educators began to seek out and examine junior high schools with
    unusually high success and began to meet and write about the promising practices
    that worked for these early adolescents. William Alexander, Donald Eichhorn, and
    John Lounsbury to name a few, created this concept of a *middle school* that was
    designed differently than either elementary or high school and had a unique approach
    to both the social and cognitive development of these tweens.


    I mention the middle school practices at this point in this book, and particularly
    in this chapter, because many of these promising practices are similar to management
    practices that are espoused in this chapter. Others are similar to practices found
    in the next chapter that experienced inquiry teachers begin to use as they expand
    their repertoire so that inquiry teaching is even more engaging for a broader
    spectrum of students.


    The next time that you read about a middle school that is not being effective,
    the first question that should cross your mind is, “Is it even a true *middle
    school*?” Just because there are teachers from different disciplines assigned
    to a “team,” does not mean it is a middle school. It may well be a *faux team*—one
    that does not do interdisciplinary thematic units or run advisories for lack of
    preparation to engage in these practices or any of the other practices that follow.


    Look at this list of characteristics of effective middle school practice. As one
    reads through the list, it is easy to see how inquiry teaching and learning can
    easily fit at the core of all these structures. In the next chapter, you will
    read about how many teachers or schools at the elementary or high school level
    who were using an inquiry teaching approach adopted a number of these middle school
    practices. True middle school teams who are defined by these practices often find
    that using an inquiry teaching and learning approach provides a missing piece
    that brings even more power to their team.


    The characteristics of effective middle school practice are shown in Figure 4.5.
    They are organized in three categories: *Structure, Curriculum, and Teacher Support.*


    # Figure 4.5 Characteristics of an Effective Middle School


    # Structure


    +   - Small communities for learning within the larger school building

    +   - Classroom learning communities where individuals and groups of students
    are self-monitoring in a constructive social environment that supports one another''s
    construction of knowledge

    +   - Exploratory classes during the school week where students work with an adult
    and other students on topics that the individual student chooses to study in depth

    +   - Families re-engage in the education of young adolescents with active participation
    on the team

    +   - School transition programs that assist students transitioning into middle
    school or transitioning into high school'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Curriculum


    +   - Exploring interdisciplinary, integrated, and thematic approaches to curriculum
    design that include multicultural perspectives and an active, student-centered
    approach to learning

    +   - Connecting school curriculum to community needs and activities

    +   - Accommodating diversity—learning the skills necessary for working with students
    with a wide range of special needs and refining techniques for inclusionary practices

    +   - Integrating technology across the curriculum

    +   - Improving academic performance by fostering health and fitness

    +   - Providing a rigorous, core academic program with success experiences for
    all learners—eliminating tracking, having skilled teachers teach heterogeneous
    groupings and promoting cooperative learning


    # Teacher Support


    +   - Empowering teachers and administrators to make decisions about the experiences
    of middle-grade students

    +   - Organizing the school into interdisciplinary academic teams of teachers
    and multi-age students with shared decision making by a close-knit school community

    +   - Staffing with teachers who are expert at teaching young adolescents

    +   - Investigating unique roles for teachers at the middle-school level, such
    as team participating and teaching, building advisor/advisee programs, and facilitating
    community-based participation

    +   - Providing teachers with common planning time in order to work almost daily
    together on making these powerful interdisciplinary thematic units


    My colleague, Peter Cook, has been a staff developer for NELMS (the New England
    League of Middle Schools), a principal of a highly-functioning middle school for
    many years, and an international ambassador for middle school practices in countries
    as far as Australia and Macedonia. I think he sums up the spirit of it when he
    says, “You know you have really become a middle school teacher when you find yourself
    and a group of parents cooking pasta for 200-300 students and adults for some
    evening presentation that students on your team have created, are hosting, and
    carrying out throughout the evening.”


    # You Really Need to Believe


    When I began teaching, I taught at a school with many disciplinary issues. It
    was common to encounter disruptive behavior in the hallways and in most classrooms.
    I learned a very negative set of coping skills where I needed to get control.
    It was certainly them against me, and from this experience I became afraid to
    trust my students. Over the next five years, as I began inquiry, project-based
    teaching, and working with students in their outside communities, I transitioned
    from being the dictator and started to again trust teens. As we succeeded together,
    I began to have relationships with individuals whom I soon implicitly trusted.
    I think they began to trust me also. But it was not until I transferred to another
    school with the same type of kids but some very different teachers who, together
    with students, had created a very different culture that I started to change my
    viewpoint. Here I came to finally believe in and trust students not only as individuals,'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'but as a set of individuals that would evolve into a group that I could implicitly
    trust to help one another and work for all of our goals.


    Along the phases of your class’s evolution, many times it will feel like the class
    is really stuck. However, you need to visualize the steps students still need
    to take, and how those will look and sound when they happen. It is like an Olympic
    gymnast visualizing his or her perfect routine before performing. As you persevere
    and assist your students with all of these social skill-building activities and
    you observe where they are in their evolution as a class, you will see that they
    have already begun to self-manage. Some of them will understand the process better
    and be able to do it better than others. Those students can assist you with moving
    the rest of the class through the steps to enable everyone to participate and
    become self-managed learners. At this stage, the inquiry process becomes self-sustaining.


    It is no longer your singular responsibility to figure out solutions for the situation
    that the class is presenting you and to be the only one enacting it. Rather, together
    you and the students have created some common goals. You have supplied students
    with tools—social skills and group management skills—for successful learning.
    You know the evolution of groups and the evolution of the needs of individuals
    in the groups. You can predict a lot—to a degree. At this point, you and your
    students are both trying to make the process work, and both of you are well-prepared.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_182_0.png)


    # Thinking Space


    Think back to David Nurenberg’s reflections on classroom management in the inquiry
    classroom (pages 146–148).


    +   - Which aspects of David’s experience are similar to yours?

    +   - What do you do to build trust with your students, teacher colleagues, and
    administrators?


    Educators frequently hear about creating a safe environment in school.


    +   - What factors enter into creating a safe environment for learning in your
    school?

    +   - What does the term “control” suggest in terms of the school environment?


    The author suggests “you really need to believe.”


    +   - What was your initial reaction to this statement?

    +   - How would you have reacted if the author had made this statement in Chapter
    1?

    +   - In what ways have your ideas about inquiry teaching and student self-management
    evolved as you read to this point in *The Synergy of Inquiry*?


    Of course all of this is contextualized in classroom routines, routines that you
    have suggested and that your students have modified to work better for all involved.
    Routines (predictability) calm the amygdala, the center of emotions that control
    our brains. They'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'calm students, and they calm you—most of these routines have been used before,
    and you know that they work.


    You have used the same inquiry teaching and learning process for your students
    to learn their social interaction understandings (concepts) and the skills to
    implement them to make their groups functional and joyful. Most importantly, the
    concepts and skills become self-sustaining. These skills become part of the fabric
    of their thinking—true complex interactive neuronal pathways in their cortex that
    are Social Interpersonal Habits of Mind that they own for the rest of their lives.


    Students start to become truly empowered. They begin to be metacognitive about
    their learning. They understand how to manage their own behavior and help others
    in managing theirs. They begin to see how others can manipulate them and how,
    as a group, they do not need to be just observers when injustice occurs before
    them. They practice all of these skills constantly as they build the community
    of their classrooms and their schools. They begin to utilize some of these same
    skills in their family interactions. Some of them will be able to use them as
    they transition into adulthood to create positive change in their communities.
    I believe Paulo Freire (1970, 1994) and the other proponents of critical pedagogy
    would approve.


    # Think and Reflect


    +   1. Why is it so important that students in an inquiry teaching classroom be
    taught strategies to successfully work in cooperative groups? Since it takes an
    investment of time to run conflict resolution activities and group building games
    and to then give students a say in strategies that will make the classroom run
    smoothly through classroom meetings, is it really worth the investment? Can it
    be accomplished incrementally? Can you enlist the assistance of other teachers?

    +   2. Are you ready to arrange your classroom so that students are sitting in
    groups of four to engage in explorations on a daily basis? Will it be easy to
    have students stay in these groups for about six weeks? What needs to occur for
    this to be successful?

    +   3. If you teach at a middle school, how does your team compare to the effective
    middle school practices? If your team is on the “faux team” end of the continuum,
    who on your team might take this inquiry journey with you? If you are on a highly
    functioning team, how might inquiry teaching ramp up student engagement and learning
    even more?'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# # Chapter 5


    # # Serving Disengaged and Disenfranchised Students


    The best thing about practice that engages students who were previously disengaged
    from school is that it also turns out to be a better way to deepen the engagement
    of those who already appeared to be doing fine. Students start to become truly
    empowered. Inquiry practices have significant positive results for students with
    special needs, English language learners, or students whose emotional, safety,
    and academic needs are not met in their homes or communities. Wider application
    of these practices could significantly narrow the achievement gap.


    Several of my colleagues who specialize in having teachers work successfully with
    special needs students responded positively to the chapters of this book. Individually,
    each of them commented that if the inquiry approach were used in schools, it is
    likely that many students who are currently identified as having special needs
    would be served with far fewer additional services.


    Likewise, those who specialize in effective practices for English language learners
    note how this is the context in which academic second language can best be acquired.
    A growing body of research suggests that English language development and inquiry
    academic instruction do not need to be distinct forms of instruction. Students
    do not need to wait until they learn English in order to engage in higher order
    thinking and complex content (Stoddart et al. 2002; Zwiep and Straits 2013). When
    using an inquiry teaching approach, a learning environment is provided where collaboration
    and peer-to-peer talk is a natural way for students to make meaning (Stoddart
    et al. 2002; Lee et al. 2006).


    For those of us in urban and rural areas working with adolescents who are already
    disengaged from school, cutting classes, and being truant for significant amounts
    of time, inquiry teaching in the form previously described was not enough by itself
    to reengage them in academics. However, it is a number of extensions of this inquiry
    teaching approach that have been effective in returning many of these teens to
    school settings and graduation. Project-based learning (PBL) is a natural extension
    of inquiry teaching, a step many experienced inquiry teachers have taken. Subsequently,
    students developed public presentation of their ideas, which in turn led to projects
    that assisted their communities directly. In each context, students used skills
    they were learning in school and during the projects themselves.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'In the rest of this chapter, you will hear descriptions of successful practices
    and programs, and be taken through the process of planning using templates and
    exemplars from other teachers. Likewise, it will become clear how inquiry teaching
    addresses the needs of both students with special needs and second language learners.
    It is an exciting and exhilarating journey, so let us get started.


    # The BONGO Program


    Terry Born, a teacher who used inquiry teaching in her English classroom, and
    I were colleagues at Middle College High School, a public high school in New York
    City designed for students who were previously disengaged from school. Many had
    dropped out of other high schools or were regularly truant in their junior high
    schools. The school had much academic and social success with these students.
    However, both Terry and I noticed a set of students who were not being completely
    successful in our inquiry-based subject area classes, yet responded especially
    well when we utilized personalized role plays. In 1977, we asked our principal
    if we could have back-to-back English and science classes with the same students
    the last two periods of the day. We would offer two required classes for graduation,
    students would write and produce a play based on what they studied, and it would
    be team-taught. Over the next 13 years, this theater workshop class evolved into
    the BONGO Program that added a third period, with three subjects completely integrated,
    with final public projects that in addition to plays also included oral history
    books, community newspapers, and photography literary magazines. As you will hear,
    the BONGO Program, not an acronym, rather just a name that started as the Bongo
    Theater Traveling Herd, became one of the most successful programs for those urban
    adolescents labeled *at-risk* within traditional school settings.


    # Scenario of Engaging the Previously Disengaged


    Everyone seemed to be rushing in a different direction at the same time. Ronald
    pushed past two Latina teens, one as skinny as the other was round. Both wore
    a sparkling light blue leotard that covered them from head to toe. Ronald was
    carrying what appeared to be some sort of municipal symbol made out of wood the
    size of a hubcap. He stopped in front of what appeared to be a large judge’s bench
    and removed a hammer and bunch of nails from his tool belt and began to nail the
    emblem to the center of the front panel.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '“Oh snap. This is still wet,” Ronald yelled to no one in particular as he attempted
    to wipe the tacky varnish off his left hand onto his pants.


    “Let’s crank it up people,” he commanded, loud enough for everyone in the auditorium
    to hear. “There are already people waiting and we need to let them into the house.”


    He had to laugh as he thought to himself what his friends from the Queensbridge
    housing projects where he lived would say if they saw him now. His mother would
    not believe that he was nailing this on, no less that he had supervised the building
    of this whole stage set. For years she barely got him to take out the garbage.
    But lately everyone, including him, was astonished by his behavior.


    Just then Madeleine, a diminutive dark-skinned Dominican girl, walked by donning
    a black robe.


    “Hey, Judge Maddy, be careful what you touch or you are going to be permanently
    sitting behind this bench,” Ronald commented.


    Madeleine responded, “Judge Maddy’, that’s cute Ronald, but what are you talking
    about?”


    As Ronald walked away he responded, “We needed to re-varnish parts of this bench
    and it is not quite dry, if your robe rests too long against it, it will be glued
    to the wood.”


    Madeleine raised her eyebrows and shook her head. “It’s not bad enough that someone
    wrote more legal mumbo-jumbo lines into my part than Perry Mason ever said in
    his life, but now I have to worry about what I touch. Freaking great.”


    “Oh my God!” Madeleine exclaimed from her perch on the stool behind the bench.
    “Is this Steve?” “I can’t believe it, Steve, I’ve never seen you in anything that
    wasn’t black and that didn’t have cut off sleeves. Where’s your tattoo now?”


    All heads turned to look at the stage where a white teenager was straightening
    a gray suit coat.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '> “You are a riot Madeleine, aren’t you and your friends usually standing on
    the other side of that bench? No, no let’s not go there. Sorry. Just a joke. We
    don’t have time for this stuff. Have you seen Paul? I need him to tie this necktie
    for me. I also need to be sure I am saying the ‘multiple alleles’ line right.”


    A boy with shoulder length blonde hair turned and said,


    > “Steve, it is pronounced ‘ah-leel-s.’”


    > “Are you sure, Sean?”


    > “Look Steve, I wrote the lines. Didn’t you listen to anything Paul taught us?”


    Steve turned with an astounded look on his face.


    > “Are you really questioning how much of this play I wrote? I’ve worked on this
    play more…”


    Just then Ronald walked over to the two of them and said,


    > “OK ladies, enough. We have a show to do. Everyone get backstage for the ritual.
    Michael, please turn on the house lights and kill the work lights. Kathy, open
    the doors and take tickets.”


    Mr. C, Ronald’s American history teacher, expressed to Ronald his happy amazement
    that he not only was in class every day, but that he was handing in all his assignments
    and engaging in debates about issues of government. For years Mr. C had been on
    Ronald’s case about using his abilities.


    Ronald noticed his history teacher in the audience. He thought, “I wonder if he
    knows that I have been in school past six o’clock writing and building almost
    every day for the last month. It’s even hard for me to believe.”


    I sat almost in a trance in the audience with Terry Born, an English teacher who
