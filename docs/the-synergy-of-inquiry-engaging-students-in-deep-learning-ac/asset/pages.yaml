- pgno: 62
  md: '# Planning for Inquiry Teaching


    This chapter builds on information from Chapter 1 about the relationship between
    inquiry teaching and how the brain learns. It also serves to illustrate the implementation
    of inquiry teaching and the learning cycle. It contains protocols and templates
    of inquiry teaching unit plans and lessons that are consistent with what we know
    about how the brain learns and the nature of child development. You will meet
    four teachers who share their experiences developing inquiry teaching lessons
    and unit plans. These individuals represent a range of teaching experiences from
    novice, to mid-level, to expert.


    +   - Maria is a teacher with whom I worked for a very brief time when I was teaching
    at a university in the 1990s. Maria, a first-year biology teacher, and I co-planned
    a unit on mitosis. The 24 students in the class were a diverse group—some were
    on Individualized Education Programs (IEPs) and some were English language learners.

    +   - Andrea, a first-grade teacher, plans a unit on the history of a local community
    using primary documents. Andrea’s 22 students are also a diverse group—one student
    is a non-English speaker and 7 students are on IEPs for autism, language learning
    issues, and some developmental delays.

    +   - Carolina is a sixth-grade mathematics teacher whose lessons link mathematics
    to social issues of interest to her students. On average, her classes of 20 or
    so students have about two second language learners and 5 or 6 students on IEPs
    including a broad variety of physical, learning, and emotional issues.

    +   - Katie is an eleventh-grade language arts teacher whose series of five lessons
    explore the relationship between gothic literature and The Raven by Edgar Allen
    Poe. Katie’s students are from a middle-class suburb of Boston; on average 3 to
    4 students have IEPs and usually not more than 1 student is an English language
    learner.


    This chapter includes teachers’ observations about the inquiry planning process,
    along with examples of instructional activities for the three phases of the inquiry
    teaching learning cycle—exploration, clarification, and application. Additional
    resources that extend the lessons in this chapter can be found on the Digital
    Resource CD. By using the resources in this chapter and the lesson expansions
    on the Digital Resource CD, teachers'
