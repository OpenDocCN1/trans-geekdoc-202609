- pgno: 153
  md: '# What Does the Starter Do?


    The students begin by thinking that starter means boss. They soon realize that
    it is not that easy. Since they are responsible for keeping all members of the
    group on task, they need to be clear what the task is and then come up with ways
    to approach and communicate with the students who are not on task. As the teacher
    is cruising the room, when she or he notices a student off task for a period of
    time, they quietly and discreetly urge the starter to address the issue. Sometimes
    there are students who do not respond to these nudges. The group works on strategies,
    with the assistance of the teacher (and sometimes other groups), to come up with
    strategies to get disengaged students on task. This is an invaluable skill to
    master and will be utilized throughout students’ lives.


    # What Does the Getter Do?


    The getter needs to physically get up and bring back all materials used in the
    activity of the day. Getters need to make checklists of materials and utilize
    them to be sure they have acquired everything needed by the group. They also can
    get up and ask the teacher questions once the activity has started. Here again
    students get to practice articulating what the group already understands, and
    subsequently clearly articulate what the group is not yet clear about. Each role
    gives students insights, through practice, with some of the actions and thinking
    that it takes for a group to be successful.


    # What Does the Recorder Do?


    When I ask most teachers what they think the recorder does, almost always the
    answer is that they write down the group’s ideas, data, or best understandings
    up to that point. For many this has been their past experience with a recorder
    in a group. When I ask what might be the problem with that, the group of teachers
    thinks for a bit (wait time), then there are usually a few answers such as the
    “recorder cannot participate much in the conversation” or “they may be the kind
    of person who does not take good notes.” As they think through what happens on
    a day-to-day basis during explorations in an inquiry-teaching classroom, the limitations
    of one person possessing the written history of the group’s thoughts becomes apparent.
    During the exploration stage, each student in a group needs to record the data
    or ideas. Each of them will need to analyze it and be ready for continuing the
    exploration the next day. If only one student, the recorder, has this information,
    then the rest cannot use it for homework, or worse yet, if today’s recorder is
    absent the next day, the group cannot continue its exploration.


    Specifically, the recorder’s job is to be sure to remind everyone in the group
    to write down their ideas or data. If the teacher, as she or he is cruising the
    room, sees that one or more students are forgetting to record their ideas, then
    the teacher quietly says to the recorder, “Hey, what’s happening with Mike or
    Carmen?” Many times students in the group most involved with negotiating ideas
    forget to write them down. Since the roles are changed every day, each student
    in the group gets to practice this responsibility until little by little it becomes
    the fabric of thinking for everybody in the group.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# What Does the Reporter Do?


    The role of reporter supports those initially unsure of their ideas. Every teacher
    knows those students who do not have a solid belief in their own ideas. When there
    is a whole class discussion, they rarely, if ever, participate with their thoughts
    about the topic. When they do say something, it is at such a low volume that virtually
    no one can hear them. However, when this same student is engaging in an exploration
    in their small groups during inquiry teaching and learning, they are usually more
    inclined to say a few of their ideas to the other three students. When the teacher
    warns the groups that in a few minutes the reporters will need to report their
    group''s findings to the rest of the class—and if this low-belief student is the
    reporter for the day—certain events may transpire. The other students review the
    ideas with the reporter, thus increasing her or his belief in the ideas. This
    person realizes that some of the group''s ideas were from him or her and that
    the group has validated those ideas. This reporter usually speaks the ideas loudly
    and with confidence. As the term goes on, the student''s belief in his or her
    own ideas increases greatly. The whole mechanism of inquiry teaching and learning
    supports students’ growth and belief in their thinking.


    # What Is the Impact of Group Roles on Student Behavior?


    In the elementary classrooms, these roles are often kept constant throughout the
    year. However, if all teachers in the school are using inquiry teaching, by second
    or third grade, students will have taken on all of these group skills, and they
    will only need to look at the chart to see whose turn it is to get materials or
    report out on a given day. Everybody else naturally does the rest.


    For middle and high school students, if nobody has done these roles before, then
    usually by November or December students have all taken on these responsibilities
    many times, and they only need to look at the chart to see whose turn it is to
    get materials or report out on a given day. Students stay in the same groups for
    about six weeks or so, evolving as an effective group. They sit at the same place
    each day and this place has a number. The chart with the roles posted in the classroom
    has the numbers moved each day so that the roles revolve throughout the group.


    Utilizing these group roles is just the beginning of teaching students how to
    be effective working members of a team: constant practice throughout the grades
    enables them to develop habits of mind that support cooperative learning. **It
    takes a concerted effort by a teacher, a middle school team, or faculty so that
    students can self-manage and have a safe and secure environment in which to try
    out their ideas.** Let us now investigate how effective groups must evolve so
    that we can see what experiences we must provide our students at each stage of
    the evolution.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Building Effective Groups


    Over the past 50 years, sociologists have investigated the developmental stages
    of effective team building in varied settings from engineering or medical teams,
    to a team of students in an inquiry-teaching classroom. Building on these insights,
    we can supply our students with the appropriate supports to help them through
    each stage. I describe three aspects of group evolution:


    +   1. Stages in the life cycle of a group

    +   2. Capabilities of the group at various stages

    +   3. Interpersonal needs in groups


    It may be helpful to understand each aspect so you and your colleagues can provide
    students with the skills they will need as they confront each subsequent stage.
    Once teachers understand these processes, it becomes easy to assess where each
    class is and provide them the assistance they need to advance to more effective
    self-management.


    # Stages in the Life Cycle of a Group


    The whole class, and to a degree the smaller four-person groups in a classroom,
    typically move through five stages in the life cycle of a group (Tuckman and Jensen
    1977). They are:


    Stage 1: Forming—students look to the teacher for assurance, structure, and authority.


    Stage 2: Storming—as students become comfortable, they question the authority
    of the teacher and enter into some interpersonal conflict.


    Stage 3: Norming—students look to create greater order and some agreement on norms,
    and how perspectives should be shared.


    Stage 4: Performing—together students effectively accomplish academic tasks, investigate
    how else they might solve problems, and move toward higher levels of thinking
    and problem solving.


    Stage 5: Adjourning—as their tenure as a group nears an end, students need to
    transition to being a group of individuals. To do so effectively, they should
    have the opportunity to reflect on what they have learned from working in this
    group and what they appreciate about having worked together.


    # Capabilities of the Group at Various Stages


    As effective groups move through these various stages, they begin to build certain
    capabilities (Gibb and Gibb 1978). As a teacher, it will be helpful to be aware
    of these and assist groups in strengthening them. Likewise, congratulating them
    on building these'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'skills as their groups mature will strengthen their understanding of their
    capabilities and allow them to more easily transition to the next stage. These
    capabilities are:


    # Reciprocal Trust


    Each member of the group finds some level of personal adequacy and group membership.


    +   - **Feedback:** The group builds an effective communication and decision-making
    system.

    +   - **Formation of Goals:** The group establishes goals that satisfy the needs
    of everyone in the group.

    +   - **Interdependence:** The group has matured to a point where it is possible
    to concern themselves with issues of freedom, control, and interdependence.


    # Interpersonal Needs in Groups


    Individuals in groups express three basic interpersonal needs (Schutz 1966). Until
    these are taken care of, academic learning may seem unimportant. In effectively
    evolving groups, students become more powerful and influential, and they tend
    to become more curious and effective learners. The three basic needs are:


    +   1. **Inclusion:** For students to succeed in the classroom, they must feel
    they *fit in* and are a part of their classroom. Students need to have a safe
    haven, where they feel that their opinions and ideas can be shared, without fear
    of negative consequences.

    +   2. **Control:** After a student is socially accepted, the next step is how
    much control and influence he or she can have in the class. This happens with
    both fellow students and the teacher.

    +   3. **Affection:** Students must show affection toward their fellow classmates
    for groups to be successful. It is inevitable that conflicts in groups will arise;
    at these times, sensitivity and flexibility are essential.


    As you are looking to assist the whole group with their needs during each life
    cycle transition, it is helpful to be aware of the individual student''s needs
    as he or she moves through this evolution. Figure 4.2 illustrates the relationship
    between the needs of the group and those of the individual. Paul Kelly, a K-5
    public school teacher in Salem, Massachusetts, created this diagram to help himself
    and his colleagues better understand the interaction between the stages and abilities
    of the group and the needs of the individual students in the group.'
  merge: -1
  img_proc: true
