- pgno: 205
  md: '# Interdisciplinary Thematic Service Learning Units (ITSLU)


    Terry and I did not start at the points illustrated in the foregoing scenarios.
    Like with most interdisciplinary project-based classes, we began just trying to
    connect two subjects and having students create a final product. Likewise, most
    ITSLUs start with teachers connecting two subjects whether as an individual in
    an elementary classroom or with a colleague in another discipline working with
    adolescents. Their initial efforts are simple and manageable; as their skills
    and confidence build, they add more components to make the units more effective
    for their students. In the beginning, without many of these components as part
    of the unit, much of the energy to keep the unit progressing needs to come from
    the teacher(s). However, once a critical mass of the components is added, students
    become so engaged that an equal or greater amount of the energy emanates from
    students. This is why teachers who create *interdisciplinary thematic service
    learning units* (ITSLU) simply cannot revert back to less self-perpetuating ways
    of working together with their students. Previously disengaged students are less
    likely to leave school and teachers are less likely to burn out. The well planned
    and executed ITSLU results in both students and teachers becoming reinvigorated.


    # Components of an Effective ITSLU


    The components that contribute to the effectiveness of a ITSLU appear in Figure
    5.4. The components are organized in three categories: (1) Curriculum, (2) Structure,
    and (3) Teacher Support. This checklist will be useful as you begin to create
    your interdisciplinary thematic service learning units. No ITSLU has all the components,
    but the more there are, the more effective and self-sustaining the unit becomes.


    Figure 5.4 Checklist of Components for Effective ITSLU


    | Component Category | Components |

    |---|---|

    | Curriculum | Specifies themes that:

    • Matter to students

    • Contain multiple subjects

    • Include interesting topics

    • Have real-world relevance

    Defines a driving question

    Defines relevant standards for:

    • Concepts

    • Skills

    Includes traditional core subject areas |'
  merge: -1
  img_proc: true
