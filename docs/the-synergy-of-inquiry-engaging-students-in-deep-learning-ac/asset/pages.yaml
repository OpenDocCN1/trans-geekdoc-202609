- pgno: 56
  md: '# Thinking Space


    # Questioning Practices


    Take a critical look at the questions you have prepared for lesson plans, assignments,
    and assessments.


    +   - At what level of higher order thinking are you challenging your students
    on a daily basis?

    +   - What percentage of the questions you ask fall into each of the categories
    shown in Figure 1.8?

    +   - What percentage of questions on assignments fall into each of the categories
    in Figure 1.8?

    +   - What about your questions on assessments and examinations?


    If possible, record your class to gain insight into your questioning practices.


    +   - What kind of questions you are using?

    +   - What kind of thinking are you expecting?

    +   - Are you helping your students learn how to frame effective questions?


    Questions are the linchpin tool that teachers use to move students through the
    dimensions of inquiry teaching. Therefore, it is vital that teachers be aware
    that they are using appropriate questions for the phase of the inquiry cycle that
    they are planning for and that such questions match the needs of the particular
    part of the cortex involved. As you read Chapter 2 and begin to plan inquiry units,
    you may find it useful to refer back to Figure 1.8. In the interim, you might
    want to use it to evaluate your current practice utilizing questions.


    # Correlation of Thinking Skills Across Subject Areas


    This book establishes the concept that inquiry teaching is an integrating framework
    under which fits all the best practices of our profession. When these practices
    are put together in a process that mimics how our brain operates, the combination
    is synergistic, being much greater than the sum of the individual practices. However,
    there is another synergy that occurs when the inquiry teaching approach is used
    in each of the subject areas, either by the same teacher in a self-contained elementary
    classroom, or by a set of subject area teachers in a school where specialists
    teach subjects.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'This synergy is explained by a similarity in thinking skills across the subject
    areas. If students use similar skills as they are engaged in figuring out ideas
    in each of the subject areas, this reinforcement throughout the school day will
    cause the neural networks associated with them to become hardwired.


    The processes for creating knowledge differ across subjects; for example, what
    makes something acceptable knowledge in science is different than what makes something
    acceptable knowledge in literature as demonstrated earlier in this chapter. Nonetheless,
    there are similarities in the knowledge creating processes. All subjects require
    evidence, though where the evidence comes from and how it is validated may be
    somewhat different. In each area, the difference between observation and inference
    is vital, but what makes for fruitful inference and when it is advisable to use
    it is different in each individual academic area. However, the thinking skills
    are analogous and need to be reinforced in each area, so they become a habit of
    mind. The differences also need to become part of the neuronal connections, as
    students need to know when to use the distinctions in their daily lives. This
    rationale also presents yet another reason for carefully planned and facilitated
    interdisciplinary studies as part of each student’s school week. We will address
    this more extensively in later chapters in this book. Figure 1.9 shows correlations
    between thinking skills in science, social studies, English, and mathematics.


    # Figure 1.9 Thinking Skills Common to Selected Subject Areas


    | Science | Social Studies | English | Mathematics |

