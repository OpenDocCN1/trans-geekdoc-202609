- pgno: 215
  md: 'When students have created this *mental landscape* of the concept, moderated
    by various syntactical structures that communicate fairly accurate (but not necessarily
    totally expansive) relationships, they are prepared to have a meaningful reading
    experience.


    # **Step 6: Translating**—Students attempt to take oral descriptions and translate
    them into symbolic (written) language (words and numbers and their relationships).


    +   - While engaging in the investigation, homework requires students to organize
    and synthesize ideas in a written form from the day’s classroom investigation,
    rather than read a text and answer questions. This approach will provide daily
    scaffolding for thinking and writing in the final report about the concepts and
    skills acquired from the exploration.

    +   - If the exploration is mainly finished, students will take the cumulative
    and scaffolded work of the last few days and shape it into a rich and well-written
    document with the particular format the teacher has requested.

    +   - This time is appropriate for students to read trade books or various texts,
    to wisely use the Internet in a supervised and scaffolded fashion, or to speak
    to outside experts who might suggest sources to increase their understanding of
    the phenomenon being studied. Students can use these understandings from the academic
    community to help them uncover the inconsistencies in their own explorations and
    include these in their conclusions. Teaching students the strategy of comparing
    their way of expressing an idea with how professionals are expressing similar
    ideas, gives them the tools for seeing the structures for clear communication
    and entry into academic language and thought. Again, the process is that students
    first have a chance to have an informed naïve conception so that written work
    can now have deeper meaning as they attempt to read and translate its meaning
    based on the landscape they have already created in their brains.

    +   - Each student then publishes his or her understandings, comparing his or
    her ideas and the process of getting there with what the *academic* experts have
    written about the concepts. Students submit their final work to the teacher.


    # **Step 7: Mentoring until Competency**—The teacher responds in writing to students’
    published writings and has them make revisions until the student clearly can explain
    conceptual relationships in a written symbolic form.


    +   - If the teacher has modeled writing partners (Calkins 1994), students first
    critique (as critical friends) each other’s written work for academic accuracy
    and literary clarity.

    +   - Students then rewrite their reports or daily work based on the feedback
    from their rotating writing partners.'
