  md: '# An Example of a Common Core Mathematics Requirement Demonstrating Deeper
    Thinking


    We have seen how the steps of the inquiry teaching learning cycle correlate with
    the Common Core literacy standards in Figure 1.2, and likewise, how well the steps
    of the cycle of Mike’s inquiry teaching history lesson correlate with the history
    part of the standards (see Figure 1.3).


    The Common Core Standards for Mathematical Practice almost seem to have been written
    with the inquiry teaching and learning cycle in mind. These standards follow:


    +   - **MP 1:** Make sense of problems and persevere in solving them.

    +   - **MP 2:** Reason abstractly and quantitatively.

    +   - **MP 3:** Construct viable arguments and critique the reasoning of others.

    +   - **MP 4:** Model with mathematics.

    +   - **MP 5:** Use appropriate tools strategically.

    +   - **MP 6:** Attend to precision.

    +   - **MP 7:** Look for and make use of structure.

    +   - **MP 8:** Look for and express regularity in repeated reasoning.


    **CCSS.Math.Practice.MP 3: Construct viable arguments and critique the reasoning
    of others** illustrates the nature of deeper thinking that is integral to inquiry
    teaching and learning.


    Mathematically proficient students understand and use stated assumptions, definitions,
    and previously established results in constructing arguments. They make conjectures
    and build a logical progression of statements to explore the truth of their conjectures.
    They are able to analyze situations by breaking them into cases, and can recognize
    and use counter examples. They justify their conclusions, communicate them to
    others, and respond to the arguments of others. They reason inductively about
    data, making plausible arguments that take into account the context from which
    the data arose. Mathematically proficient students are also able to compare the
    effectiveness of two plausible arguments, distinguish correct logic or reasoning
    from that which is flawed, and—if there is a flaw in an argument—explain what
    it is. Elementary students can construct arguments using concrete referents such
    as objects, drawings, diagrams, and actions. Such arguments can make sense and
    be correct, even though they are not generalized or made formal until later grades.
    Later, students learn to determine domains to which an argument applies. Students
    at all grades can'
