- pgno: 70
  md: '# What We Were Thinking


    Although the sequence that Maria and her colleagues decided upon was logical,
    I pointed out to them that these topics needed to be embedded in the science,
    technology, and societal issues that mattered to students. Such positioning was
    essential if they expected to deeply engage their students in uncovering and inventing
    concepts. Consequently, Maria created units that not only followed the sequence
    shown in Figure 2.2, but that were also built around topics that dealt with societal
    issues that affected students’ daily lives.


    # Societal Issues of Consequence to Students


    Maria identified several topics of interest to students; three of those unit topics
    are as follows:


    +   1. Garbage and recycling was the focus of the first unit.

    +   2. The second unit was built around a local issue about a river. The town
    was trying to decide whether or not to tear down a long-standing dam on a river
    in order to allow migration of fish back up the river. The other side of the issue
    was whether or not this would allow sea lamprey into the “town beach” part of
    the river and whether it would cause extensive erosion.

    +   3. The third unit was a nutrition and exercise unit that focused on the school
    cafeteria and the activities done in the physical education classes.


    The rest of the units also focused on issues that mattered to students and additionally
    exemplified the concepts in the preplanned sequence of topics.


    # What We Were Thinking


    Each unit was about a different relevant topic, but each unit embodied one or
    more of the big ideas. These big ideas overlapped over multiple units. The unit
    that focused on the cafeteria and nutrition had its basis in growth and repair,
    homeostasis, and the transfer of energy. The unit investigating solid waste and
    garbage in the students’ school and homes also focused on the big ideas of transfer
    of energy and growth and repair, but also began to include issues of adaptation.
    These big ideas and synthesizing structures kept being revisited using various
    societal issues and the explorations inherent to them. The units were designed
    to address all national, state, and district standards by the end of the year.'
