  img_proc: true
- pgno: 137
  md: 'Reuben Hersh, in his discussion of mathematical philosophy states, “It is the
    questions that drive mathematics. Solving problems and making up new ones are
    the essence of mathematical life” (1997, 18). George Polya (1945) wrote in the
    preface to the first edition of *How to Solve It*:


    > > Thus, a teacher of mathematics has a great opportunity.

    > > If he fills his allotted time with drilling his students in routine operations
    he kills their interest, hampers their intellectual development, and misuses his
    opportunity. But if he challenges the curiosity of his students by setting them
    problems proportionate to their knowledge, and helps them to solve their problems
    with stimulating questions, he may give them a taste for, and some means of, independent
    thinking.


    (Boaler 2008, 26)


    Both Polya and Hersh are describing an essential aspect of inquiry. Students are
    presented an interesting problem, which is challenging yet approachable; it is
    open ended in that it contains different roads to reach a solution or conclusion;
    and it will lead to other questions and problems for a student to try to solve.
    John McCrann, a geometry teacher in New York City agrees with Polya and Hersh.
    He writes,


    > > “Too often, K–12 mathematics is presented as a static set of answers void
    of the questions that lead humans to develop those answers. Inquiry mathematics
    reconstitutes the mathematical process, prompting students to ask and understand
    the questions and the answers in problematic situations involving quantitative
    and logical reasoning.”


    Many students of mathematics, both past and present, have come to perceive mathematics
    as uninteresting and irrelevant. It lacks coherence because the different content
    areas of mathematics have been “chopped up into small pieces which focus on the
    mastery of algorithmic procedures and isolated skills.”


    (Schoenfeld 1988, 163)


    Can pure mathematics be interesting in itself? Can the beautiful patterns and
    relationships that make up mathematics engage a student’s mind? Can these patterns
    help students see the connectedness of mathematical ideas and procedures? A large
    goal of inquiry instruction is to help students appreciate the magnificence'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'of mathematics while also helping them understand how mathematics can help
    to explain the world they live in.


    Inquiry-based mathematics teachers think about how to create meaningful experiences
    for their students so that their interest in mathematics grows and their experience
    is joyful. They try to create experiences that reflect how humans learn.


    Raul Gracia, a Bronx ELL math teacher of over 15 years states, “Inquiry respects
    students’ innate ability to think, recognize patterns, make predictions, and make
    errors without fear and without judgment because that is exactly how humans learn.”


    Eric Marintsch, a math teacher in Germany stresses that learning takes time and
    that inquiry instruction respects the process of learning. He writes,


    > Allowing students time with inquiry lessons means that students are given an
    opportunity to unearth misconceptions and are provided the opportunity to make
    a discovery and actually explore mathematics. When this happens, student creativity
    is encouraged and classroom discussions blossom. The authentic experience students
    have during inquiry instruction leads to a deep and lasting understanding.


    What is the role of a teacher in an inquiry classroom? Do I have my students sit
    passively as I present mathematical procedures and algorithms and they practice
    what I showed them, or do I create experiences for my students so that they can
    construct new knowledge within a community of learners?


    Laura Mourino, a NYC teacher of over 10 years, describes how she thinks about
    the inquiry experiences she creates for her math students and her role in the
    classroom.


    > My students are given the opportunity to guide their instruction by persisting
    on a task/activity until they discover patterns that can be generalized beyond
    the given task. I see teachers’ fundamental role in inquiry math instruction as
    not a modeler, but rather, coming up with that key activity/question/task that
    will not only engage students in “finding the solution” but also challenge the
    student to think deeply about what they are doing, why they are doing it and how
    they can use what they are doing in the future.'
