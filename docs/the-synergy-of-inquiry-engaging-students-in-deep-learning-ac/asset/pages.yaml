- pgno: 29
  md: 'Erin recorded the students’ statement; as discussion continued, the statement
    was modified to make it clearer, more accurate, and acceptable to all in the class.
    She also used different colored markers to show the changes.


    This method allowed the class to literally see knowledge being negotiated and
    created.


    The teacher labeled the statement the “Marion and Dennis Law” after the two students
    who came up with most of the insights based on evidence. For homework, the teacher
    gave students a challenge to apply this concept to inflating their bicycle tires.
    The next day they discussed how they tried to apply their understandings to this
    new situation. The teacher decided that most of them owned enough of the concept
    that they were ready to compare their understanding of this phenomenon to what
    the larger scientific community knows. The teacher assigned them some pages in
    their chemistry textbook to read where they would find that the Marion and Dennis
    Law was first put forth in the 19th century and is called Boyle’s Law. The next
    night students looked on the Internet at an animated simulation of the molecular
    interactions of these factors.


    Later in the week, students tried to calculate the numerical relationship between
    the pressure and volume using measurement tools. With some prompting by the teacher,
    they uncovered the need for a constant in the equation they were formulating but
    there is no way that students could uncover the need for taking into account the
    amount of moles of molecules. Since they had created the landscape in their brains
    and had questions that they could not answer themselves through exploration, students
    realized that they needed help from outside resources. The teacher explained what
    professional scientists understand and how they came to understand it.


    # Observations about Deep Academic Understandings and Skills in Practice


    I hope that it is becoming apparent that inquiry teaching and having students
    do inquiry in a discipline are related, but different. Inquiry is the process
    by which humans learn things, that is, create knowledge. What defines knowledge
    as acceptable in one discipline is somewhat different from what makes knowledge
    accepted in other disciplines. In science, for example, knowledge about a particular
    phenomenon is accepted by the scientific community if evidence in carefully controlled
    experiments can be replicated with the same results. As soon as there is one place
    or time that the idea does not work somewhere in nature, then the idea is modified.
    In history, there also needs to'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'be evidence that something occurred in the human community, but that evidence
    is a human being’s interpretation of what they saw and heard. Why an event occurred
    is even a further interpretation of the event and the events surrounding it. There
    can be different interpretations by different people of the same evidence about
    an event. In science, the evidence and models need to match the natural world
    and can be universally tested. The social science of history is much more dependent
    on the predisposition of those writing about the event. That is what we mean by
    the *epistemology of a discipline*.


    Inquiry teaching is a method of facilitating learning where a teacher designs
    an exploration in which students engage in some modified form of inquiry within
    or between disciplines in order to uncover some understanding. In the course of
    the inquiry, students’ rational thinking skills are enriched. The teacher identifies
    a specific understanding or skill for students to own. The teacher engineers the
    exploration to lead students to uncover that understanding. Students are actively
    figuring stuff out, but it is not an open inquiry that is completely under the
    control of the student. There is a place for open inquiry in schools; however,
    it is a small percentage of what constitutes inquiry teaching (see Heidi O’Donnell’s
    reflection in Chapter 3). In inquiry teaching, students also actively compare
    their understandings to what the larger academic community knows and then apply
    their enriched understanding to unique applications to see if it is a deep, usable
    understanding.


    # Vocabulary Comes at the End of the Week


    Notice that in the chemistry class, Erin began with students using common, generic
    names for things. Only after students *uncover the concepts* and have some ownership
    of them, does she *drop* some academic names during discussions. Erin uses “cylinder”
    instead of “tube” and “piston” in place of “plunger.” Students ask why they cannot
    continue to use the original terms. She reminds them how it was necessary for
    the class to come up with a common vocabulary so that they could communicate between
    research teams within the class and to accurately compare experimental results.
    Students begin to see that if they want to know what the rest of the academic
    community outside their classroom knows about this topic, then they need to use
    the same vocabulary the rest of the scientific community has agreed upon.


    Sometimes students will use the scientific vocabulary because the term is also
    a “common generic” word with a similar meaning. In this case, they have been using
    “pressure” as they created a deep conceptual understanding. Now they can read
    texts, written or audio and video media, with which to compare their understandings.
    Since they own many concepts and have now connected them with academic vocabulary,
    they can read for meaning. Many decades of experience and research (Beck et al.
    1987; Bravo and Cervetti 2008; Jablon 2011) have demonstrated that if teachers
    use academic vocabulary before students create conceptual understandings, students
    focus on the vocabulary and not the conceptual relationships or the skills in
    using them. Simply stated, vocabulary instruction *comes at the end of the week*
    after students have some ownership of the concepts and skills.'
