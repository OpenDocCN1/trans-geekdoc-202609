- pgno: 142
  md: 'I see what to me seems like an easy solution, I want to propose or even unilaterally
    enforce it. I have to fight against my, and their, inclinations, and instead help
    them talk it out and work to their own resolution that they can own. It is not
    always perfect, and that in itself is a lesson. As they struggle, they grow from
    it, and by year’s end, they have grown leaps and bounds in their ability to self-regulate
    and manage conflicts productively—sometimes to even welcome those conflicts as
    learning experiences.


    Along the way, though, this methodology can be a tough sell, to students and especially
    to their parents. I have learned to do a lot of prepping with parents in order
    to let them know the educative and maturational value of what I am planning to
    do, and to reassure them that, yes, I do intervene in intergroup conflicts unilaterally
    in extreme situations. I once had a parent actually pull her child from a class
    of mine out of fears her daughter would find her own grade jeopardized by other
    students’ poor performance in groups. I have learned, in my high-powered school,
    where parents and students are extremely grade-conscious, to make sure that every
    student has plenty of assessments where he or she, and only he or she, is responsible
    for his or her grade. I try and remind parents and students alike that learning
    how to manage cooperative work is a vital skill in any modern professional job,
    and that if students do not learn those skills here, in a safe environment, they
    will be at a disadvantage later on.


    Although it is becoming more and more recognized for the set of best practices
    that it is, inquiry teaching, and those who seek to engage in it, still faces
    additional institutional hurdles and pushback. For all its good intentions, the
    outcomes-based movement in education has encouraged (or reinforced existing) conformity
    within schools and departments. If you are doing something different from your
    colleagues, that in and of itself can bring questions or even criticism. All teachers
    face something of a dance between innovating and adhering to required standards
    (as mandated by the state, your school, your department chair, or your instructional
    team). What I do in the classroom sometimes does not look like an English class—the
    kids are not all reading the same novel at the same time; they are not always
    writing traditional literary essays. I draw on a great deal of material from other
    disciplines, from history to psychology to math, and sometimes this raises eyebrows.
    My best defense here lies in the products my students create. If we still get
    to “Rome,” does it matter what road we take? Frankly, I think we get a little
    beyond Rome because of how we operate.


    Cooperative work is not just for students! My most successful lessons and structures
    have come when I have been able to coordinate and cooperate with my colleagues;
    I have been able to learn so much from the input of my fellow teachers,'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'and, at our best, we all share, duplicate, and modify from one another freely
    in the same cooperative atmosphere that we try to instill in an inquiry classroom.
    By that same token, my most frustrating experiences have come when this system
    breaks down, when colleagues get defensive or suspicious. More than once, I have
    been told not to engage in certain practices and projects simply because they
    hedge in on someone else’s territory. A particularly unfortunate example of this
    came when several colleagues and I had successfully obtained a $15,000 grant to
    teach an after-school interdisciplinary, inquiry-based class, ran it successfully
    past the administration and even the union, only to have one influential teacher
    condemn it because he feared it could draw students away from another course offering.
    I argued, to no avail, that our programming should be based on student needs,
    and that if students found that one class served them better than another, then
    that was the class we should offer. No luck. Fearful of engendering this teacher’s
    ire, my cooperating colleagues jumped ship, and no one was willing to teach the
    course any longer. We had to return the grant, students were disappointed, and
    the course never even got a chance to prove its mettle. Know the politics of your
    school, and do what you can to navigate them well.


    Ironically, teachers in low social-economic, high-needs schools may have more
    freedom to teach with non-traditional methods than teachers in more well-provided,
    higher socio-economic environments—when students are failing to graduate or earn
    high scores on state tests, school administrations are often more willing to allow
    teachers the freedom to do whatever it takes to produce results. In wealthy suburban
    schools, where students’ test scores and college admissions will likely remain
    high regardless of the approach teachers use, it is easier for tradition or politics
    to dictate what pedagogies are permitted. The kind of data you will need to defend
    your pedagogy in a school like this will be samples of student work, through the
    kinds of assessments that reveal higher order thinking is going on, as well as
    as much feedback from students and parents as you can collect.


    I have learned that, ultimately, how much you are able to incorporate inquiry
    structures into your classroom will depend not only upon you and your students’
    comfort level but also the comfort level of your colleagues and community. You
    will need to develop your ability to manage those relationships, to build social
    and professional capital, and either to forge relationships and compromise, or,
    at times, to simply shrug and accept that you will always have critics. Remember
    that your primary duty is to your students, and let that guide you through your
    development as an educator.'
