- pgno: 64
  md: '# Figure 2.1 Graph Display of Implementation Dip


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_64_0.png)


    *Source: Schle chty 1993*


    Students will soon realize that they are being asked to figure things out, to
    provide evidence, and to work hard with their peers at their thinking. Often,
    they lack the skills to accomplish all of this. They may also lack the skills
    to apply the new concepts and skills that they are obtaining to unique real-world
    situations. It is a process of acclimation. They may moan and groan after a few
    weeks and say things like, “just tell us the answer.” However, those pioneer teachers
    who persevere will soon find the whole class slowly climbing out of the gulch.


    Persevering through this period of adjustment may be one of the most difficult
    things the teacher does in his or her career. It is natural to want to go back
    to the old way of teaching that one has already mastered, but keep in mind that
    inquiry teaching helps students develop deep understanding.


    # Starting the Planning Process


    To help illustrate the inquiry learning process, a model lesson on mitosis is
    included here. I co-planned the lesson with Maria, a novice teacher, and we tested
    it in her classroom to ensure that it really does work with students.


    Think about where you may have encountered the topic of mitosis. Most of us have
    been in classes where we were lectured at about this topic, and were told to go
    home and memorize the names of the stages that matched a set of diagrams in the
    text. If you were lucky, maybe you used a microscope for a few minutes to look
    at a cell that you could not see too clearly anyway. You probably did not do much
    figuring out, did not gain deep understanding, and what you did gain likely does
    not much remain in your long-term'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'memory. Therefore, I do not expect many of you to be knowledgeable beforehand
    about the topic, but it will be something that you will now have a better understanding
    of as we progress through the planning, even though you do not get to physically
    manipulate some of the materials. To compensate for the lack of access to actual
    materials, I include a number of photomicrographs (pictures taken with a microscope)
    to help us visualize what students will be doing. Subsequently, we will go through
    the inquiry planning process for other subject areas and grade levels where you
    might feel more comfortable. However, in all situations, planning for inquiry
    teaching is a similar process.


    Much of this planning process will not be new to you. It will be similar to how
    you plan now if you are using *Understanding by Design* (Wiggins and McTighe 2005),
    *Dimensions of Learning* (Marzano and Pickering 1997), *Dougherty* (2012) with
    her focus on assignments, *Authentic Instruction* (Newmann, Secada, and Wehlage
    1995), or any other powerful planning approach. Nonetheless, you will see that
    in a number of places, the process of planning inquiry teaching differs from all
    of these.


    # Suggestions for Reading the Description of the Planning Session for Mitosis


    As you read about Maria’s and my co-planning, imagine you are a colleague who
    is sitting in and listening to our conversations. In this way, you can acquaint
    yourself with the process in which we engaged as we created an effective inquiry
    teaching plan.


    The planning scenario describes the nine steps of the protocol for transforming
    good teaching plans into inquiry teaching plans.


    # Planning Process for the Mitosis Unit


    As Maria and I developed the mitosis unit plan and lessons, we spent a lot of
    time talking about what students would be doing, how she would keep them engaged,
    and how she would stay aware of their growth in understanding the concepts. The
    protocol we developed has nine steps:


    +   - **Step 1:** Identify five to ten big ideas for the whole course.

    +   - **Step 2:** Identify the sequence of topics, concepts, skills, and social
    issues for the year.

    +   - **Step 3:** Identify the main concepts to be learned in the lesson.

    +   - **Step 4:** Identify the initial idea for the unaided student exploration.

    +   - **Step 5:** Identify the applicable thinking skills and habits of mind.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '+   - **Step 6:** Create a rubric that defines specific levels of student performance—novice,
    competent, or expert.

    +   - **Step 7:** Create a set of formative assessment questions to guide observations
    of students in the exploration and clarification phases.

    +   - **Step 8:** Create a series of authentic applications to unique situations.

    +   - **Step 9:** Create facilitating questions.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_66_0.png)


    # Thinking Space


    Reflect on your own unit planning strategies.


    +   - In what ways are they similar to the nine-step protocol Maria used for planning
    the mitosis unit?

    +   - Which of the steps are familiar to you? How have you used these procedures
    in the classes you teach?

    +   - What kinds of questions do you anticipate from colleagues who are just beginning
    to work with inquiry teaching lessons?


    # Step 1: Identify Five to Ten Big Ideas for the Whole Course


    # What We Were Thinking


    In the few weeks prior to when Maria and I planned the lesson on mitosis, we had
    engaged in some discussions about the big ideas that would hold all of the yearlong
    biology concepts together. We knew that, just as short-term memory can only hold
    seven or less ideas at one time and effectively use them to make new understandings,
    students need ten or fewer big ideas around which to integrate all of the concepts
    they will learn during the year. These big ideas are not topics, but rather overarching
    concepts where everything else studied becomes just another example of one of
    these big ideas. The sequence of the course is not organized around these, but
    some of these are embedded in every unit in the course.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'As the term goes on, these big ideas emerge from multiple explorations that
    students have engaged in, and during the concept clarification section of the
    lessons, the teacher explicitly points these out as central to the discipline.
    Eventually, all of these ideas are addressed and the teacher keeps referring back
    to them so that all the neuronal connections of new ideas created by students
    are strengthened. Because these are the key organizing structures of the concepts
    in the course, students will also begin to say, “Oh look, this is just another
    example of… (one of the big ideas).”


    After much discussion among a number of science teacher colleagues, Maria had
    identified five big ideas that she thought were rich enough, important enough,
    and that would allow everything studied during the year to fall under one or more
    of them. After some discussion, we expanded some, condensed others, and clearly
    stated each of them in language that students in her class could, and would, use.
    I have done this with many scientists and teachers over the years, and each time,
    a consensus is reached that closely approximates what Maria and her colleagues
    had created with just a little nudging from me. There is no right answer to what
    the big ideas are for a course, they just need to match the criteria in italics
    in the first paragraph in this section.


    Maria identified the following five big ideas for the unit:


    +   1. **Homeostasis:** The ability or tendency of an organism or cell to maintain
    internal equilibrium by adjusting its physiological processes (internal balance).

    +   2. **Growth and Repair:** Organisms go through a genetically predetermined
    growth process throughout development. The same genetic material in each cell
    also repairs and replaces dead or injured cells.

    +   3. **Ecosystems:** Populations of various organisms and non-living elements
    in particular geographic areas are interdependent upon one another, and the system
    maintains equilibrium when external factors change the balance (external balance).

    +   4. **Evolution and Adaptation:** The change in the genetic composition of
    a population during successive generations, as a result of natural selection acting
    on'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'the genetic variation among individuals, and resulting in the development of
    new species.


    5. **Transfer of Energy:** All organisms need food as a source of molecules that
    provide chemical energy and building materials. All organisms, including plants
    and animals, have mechanisms for storing molecules from food for later use. Plants
    produce their own food.


    After some quick discussion in which Maria and I noted some other big ideas involved
    in the lesson, we realized that Growth and Repair was the big idea that was most
    represented in the concept of mitosis.


    # Step 2: Identify the Sequence of Topics, Concepts, Skills, and Social Issues
    for the Year


    # What We Were Thinking


    Long before we sat down to figure out how Maria was going to teach this concept
    without telling students any of the steps of mitosis or even why they were needed,
    she had created a spiraling sequence of units for the course and topics within
    each of the units. This was an iterative process that she modified as the year
    went along, and she realized better sequences as students engaged in meaning making
    experiences.


    # Sequence of Topics


    Maria had decided that most biology textbooks were written backwards, that is,
    the order of the topics should be reversed and placed in the order that human
    beings over the centuries learned how living things worked. Humans needed to survive,
    and to do so, they needed to do two main things: (1) predict how other animals
    interacted with one another, and (2) figure out how to heal their own bodies if
    they got hurt or sick. All of this was done at the macro level for centuries,
    even millennia, before the advent of the hand lens or microscope. Once, humans
    could not solve a problem without looking inside of organisms—they cut them open
    to see how they worked. When they could not see how they worked with the naked
    eye, lenses and microscopes were invented to see how the smaller internal parts
    worked. Only in the last hundred years or so did we begin'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'to hypothesize what was going on at the molecular level. Only over the last
    30 years have we been able to see what is going on at the molecular level.


    The progression of topics needs to make sense to students and should not be in
    a random order. A good order of topics will make transitions fluid and will cut
    down on the need for constant new engagement, since one topic will raise questions
    that the next will answer.


    Maria created a sequence of topics for the school year. Figure 2.2 shows this
    sequence starting with ecological issues, then some health issues, which led to
    a need to understand growth and repair, and homeostasis. This led students to
    look at the cellular level for answers. As they moved into asexual and sexual
    reproduction and a deeper understanding of health and nutrition, they began to
    need understandings that could only be answered at the molecular level.


    # Figure 2.2 Sequence for Topics in the Biology Course for the Year


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_69_0.png)'
  merge: -1
