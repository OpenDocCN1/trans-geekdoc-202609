- pgno: 52
  md: '# What does this iterative process in the brain mean for instruction?


    +   - A didactic information-delivery approach to teaching tends to focus on some
    of the back cortex functions.

    +   - A solely open discovery approach, proposing and testing ideas without teacher
    intervention, focuses unsuccessfully on the front cortex functions.

    +   - Inquiry teaching, where the teacher sets up the learning environment and
    explorations and facilitates students in their own figuring out, allows for a
    balanced integration and interaction between these physical entities in the brain.


    If we teach to the test for memorization and other lower level thinking, much
    of what students know will exist in the back integrative cortex and will not be
    usable for real problem solving, and our students will not develop critical thinking
    skills. They will not own deep conceptual understanding, cannot apply any of their
    knowledge well, and it will not likely stay in long-term memory (Bransford, Brown,
    and Cocking 1999).


    Our experiences are from the past, but the concepts that we create are for actions
    we intend to take in the future. They are plans. We need to transform experiences
    from *outside* the brain to knowing *inside* the brain. However, we must do more
    than just organize the data in our back temporal cortex. We need to actively make
    decisions and create ideas and concepts in the prefrontal cortex. We move the
    power from external others to ourselves. That action transforms the learner from
    just a receiver to an active producer of knowledge (Howard 2002).


    Many people think of the physical brain and learning about it as a cold, analytical
    look at learning devoid of many of the more human aspects of our species. It is
    rather the opposite. It is the interaction of the cognition structures with the
    emotion structures, the amygdala and the basal structures, of the brain that helps
    us understand reasoning, motivation, and memory without which learning is not
    possible. It is why as teachers we need to understand the interplay between these
    fear and pleasure emotional structures, and the cortical cognitive structures,
    in order to improve our classroom practice.


    Completing the Thinking Space activity before you read the next section will enable
    you to get more meaning out of what you read because you will actively create
    that neuronal landscape in your brain. Do not hesitate to go back and review some
    of the ideas in the previous pages if you need to do so in order to make richer
    classroom connections. Better yet, you can access a whole *bonus chapter* that
    looks in much greater detail at how the brain learns and how that can affect your
    classroom practice on the Digital Resource CD. When you are applying these ideas
    to something that matters to you and your teaching, your basal pleasure center
    will allow you to think clearly. Once the ideas are integrated together during
    your figuring out process, you will also remember more of the individual ideas
    and names associated with them.'
