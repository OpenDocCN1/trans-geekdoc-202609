- pgno: 192
  md: 'John Goodlad, after studying schools throughout the United States, noted the
    passivity of students in our schools.


    > > They rarely planned or initiated anything, read or wrote anything of some
    length, or created their own products. And they scarcely ever speculated on meanings,
    discussed interpretations, or engaged in projects calling for collaborative effort.

    > >

    > > (Goodlad 1984, 468)


    Simultaneously, the Control Theory work of William Glasser (Glasser 1986; Gough
    1987) supported the group project orientation of cooperative learning that was
    emerging.


    Since 1993, the Buck Institute at the University of Wisconsin has taken a lead
    role in assisting teachers and school systems in creating meaningful and effective
    standards-based, problem-based learning (PBL) units (Markham 1997; Hallerman,
    Larmer, and Mergendoller 2011). Larmer (2014, 1) sees PBL as a broad category,
    which, as long as there is an extended project at the heart of it, could take
    several forms to be a combination of the following:


    +   - Designing and/or creating a tangible product, performance, or event

    +   - Solving a real-world problem (may be simulated or fully authentic)

    +   - Investigating a topic or issue to develop an answer to an open-ended question


    As in the 1930s, evidence for the success of PBL is beginning to amass during
    the current standards-based environment (Ravitz 2009; Strobel and van Barneveld
    2009; Walker and Leary 2009; Vega 2012a; Ravitz, Hixson, English, and Mergendoller
    2012). Studies that compare and contrast learning outcomes for students taught
    via project-based learning versus traditional instruction show that PBL (when
    implemented effectively):


    +   - increases long-term retention of content;

    +   - helps students perform as well as or better than traditional learners in
    high-stakes standardized tests; and

    +   - improves problem-solving and collaboration skills, and improves students’
    attitudes towards learning (Strobel and van Barneveld 2009; Walker and Leary 2009).


    As we will see in Chapter 6, PBL can also provide an effective model for whole-school
    reform (National Clearinghouse for Comprehensive School Reform 2004; Newmann and
    Wehlage 1995). These inquiry-based teaching methods engage students in creating,
    questioning, and revising knowledge while developing their skills in critical'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'thinking, collaboration, communication, reasoning, synthesis, and resilience
    (Barron and Darling-Hammond et al. 2008).


    # Meaningful Themes


    In candid conversations with teachers about what prompted them to enter the profession,
    I frequently observe that they share a common concern: to have students acquire
    some central core understandings about life that will enable them to lead happy,
    fruitful, and productive lives. These understandings tend to be some big, universal
    ideas. If teachers are working with adolescents, these ideas tend to be at the
    core of the complex issues that we all deal with as adults. They also are the
    ideas that are at the core of teenagers’ dealings with one another, with their
    parents, and with other adults in authority. Thinking back to Maslow and what
    adolescents care about, these are ideas that will help them deal with the complexity
    of life from their perspective. Teachers will mention such ideas as, “many times
    you cannot control what happens to you, but you can control how you react to it.”


    Yet these same teachers note that they rarely get to teach about these ever so
    important insights into dealing productively in our complex human societies. Occasionally
    language arts and social studies teachers can touch upon them, but they never
    really get to visit the issues in any depth. When students get to explore one
    of these understandings from multiple disciplinary perspectives and then use this
    understanding in creating something that has an impact on their community, the
    theme becomes a powerful component of school success.


    This view of what constitutes a theme is different than what you find in educational
    books and in discussions with some teachers. In many cases, teachers are urged
    to integrate their lessons around a topic. Take for example ancient Egypt, the
    fishing industry in New England, recycling plastics, or small family-owned farms.
    It is surely possible to create interdisciplinary units around these, but these
    are topics—not effective themes—in the way that we are addressing them here. Teachers
    find that using topics as the integrating issue limits what they can do in each
    of the subject areas in addition to not allowing the opportunity to engage students
    in these large generalizable life lesson ideas. Many very effective units will
    have these and other topics as part of the unit, but they are not the theme. A
    theme is a complex universal idea with certain qualities that allows for a meaningful
    integration of the various disciplines.


    Over three decades of working with teachers on creating effective interdisciplinary
    thematic units, my colleagues and I have added to an initial set of criteria first
    compiled by Martinello and Cook (2000) and created components for an effective
    theme. Figure 5.1 presents guiding questions to evaluate a theme. Using these
    criteria, countless teachers have created very effective themes for the units
    they have developed. Such units have engaged many previously disengaged students
    in their schools.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# **Figure 5.1 Criteria for a Meaningful Theme**


    **A meaningful theme should pass the test of these questions:**


    +   1. Is the big idea true over space and time?

    +   2. Does it broaden students’ understanding of the world or what it means to
    be human?

    +   3. Does it demonstrate patterns that make understanding the natural and human
    world less complex and more predictable?

    +   4. Is the big idea interdisciplinary?

    +   5. Does it relate to students’ genuine interests?

    +   6. Does it support student inquiry?

    +   7. Can it be seen from many points of view?


    With elementary school age students, the use of themes is less important than
    at the middle and secondary levels. Some elementary teachers use very general
    themes such as *change* or *patterns* as an integrating concept throughout the
    year for all the subject areas while using topics, such as seasons or the American
    Revolution as integrating points for their small interdisciplinary units.


    However, once students reach early adolescence in middle school and continue to
    high school, meaningful themes become powerful tools to engage students, to help
    integrate subject area topics, and to give students insights that will assist
    them throughout their lives. These themes allow students to recognize some of
    the underpinnings of the difficulties they are confronting in trying to form relationships
    with peers and negotiating new power relationships with their parents. Visit http://www.lesley.edu/middle-school/service-learning/examples/
    for examples of interdisciplinary units based on meaningful themes at the middle
    school levels. Since novice teachers created many of these units, not all of the
    themes are as effective as others. However, teachers who created these units considered
    the themes to be important for their students’ lives.


    Figure 5.2 provides an example of a theme that I (and many other teachers) consider
    to be effective. Think about how the theme “power over versus power with” reflects
    the criteria in Figure 5.1.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Figure 5.2 Example of an Effective Meaningful Theme


    # **Theme: Power Over versus Power With**


    This theme emerges in many teachers’ units as effective and meaningful. The theme’s
    dilemma is something that human society and individuals have wrestled with throughout
    recorded history. Does one gain the most power through cooperation with those
    you wish to lead or through force? This theme has wide applicability across the
    curriculum:


    +   - **History:** This perspective applies no matter what event is being studied.
    For example, power over Stalin and power with Martin Luther King.


    +   - **Language arts:** The theme enters into the conflicts that arise between
    characters in novels and poems. *Animal Farm* by George Orwell (1933; 1992) embodies
    this conflict.


    +   - **Science:** Much of the debate about modern society is whether our current
    dilemmas stem from humans trying to have power over nature versus understanding
    how the natural ecosystem operates and trying to operate within the system so
    that we gain the best outcomes for humans.


    +   - **Mathematics:** Those who understand how to manipulate statistics, graphs,
    and algebraic relationships can use that understanding to have *power over* or
    *power with* people who have less understanding. It is so easy to mislead folks
    by citing the average (mean) of a set of statistics, when a clearer and more meaningful
    perspective of a particular situation might be understood by citing the mode.


    +   - **The Arts:** The theme can be used to coerce or inform so that others can
    have the power of their own interpretation. This can be seen in the difference
    between propaganda posters and Picasso’s painting *Guernica* which leaves the
    interpretation of war up to the viewer.


    +   - **Physical education:** Certainly effective physical education team interactions
    and health issues related to dieting, exercise, preventive medicine, and the allure
    of drugs is all about understanding the tension between *power over* and *power
    with*.


    In each instance, using the theme *power with versus power over* provides a lens
    to view the concept that the world does not create simplistic solutions. Rather,
    it allows students to wrestle with the complex matrix of issues that are relevant
    and integral to solving problems. They are called upon to use their synthesizing
    and analytical skills to examine the multiple perspectives available and the consequences
    of each. The theme not only lends itself to interdisciplinary, inquiry teaching
    lessons and project-based learning, but it quickly becomes apparent to teenage
    students that many of their daily interactions with peers, parents, teachers,
    and employers are focused on power. This analogous interrelationship between what
    they are studying in school and their daily human interactions for which they
    are seeking insight so that they can feel empowered, allows their emotional selves
    to be completely engaged in academic studies. Thus, this theme meets each of the
    criteria for an effective theme as defined in Figure 5.1.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Evaluating Themes for Effectiveness


    It is time for you to try and evaluate a theme on your own. Use the criteria in
    Figure 5.1 and see how these themes might work to engage and enrich adolescents.
    The themes are:


    +   1. The right of the individual versus the right of society

    +   2. Hitler and nationalism

    +   3. School gardens and sustainability

    +   4. Doing the right thing when no one is looking


    Now that you have had an opportunity to think about and record your thoughts about
    these four themes, compare your observations with the criteria in Figure 5.3.


    # **Figure 5.3** Analysis of the Features of Four Possible Themes


    # Theme 1: The right of the individual versus the rights of society


    Much of teenage daily conflict in structured social situations such as their family
    and school revolves around “their right to be themselves and do what they want
    to do” and the responsibilities imposed on them as part of one of these groups.
    The theme also exists to a degree within peer groups. It certainly is at the core
    of most social studies issues, interaction of characters in literature, and of
    the uses of science and technology in society. It is timeless, universal, and
    lends itself to endless inquiry and interpretations.


    # Theme 2: Hitler and nationalism


    The larger issue of nationalism, or identification with a group, or inclusive
    and exclusive organizations and governments are more universal themes. However,
    tying the theme solely to Hitler makes it less powerful, less interdisciplinary,
    and less applicable in teenagers’ lives. The social studies teacher and even the
    language arts teacher may be focusing on life during the 1930s and 1940s in Europe;
    however, that focus would be a topic within the larger theme of nationalism. Tweaking
    this topic is necessary to make it best fit teenage interpersonal relationships.
    The theme of *The Power of Groups: Inclusionary or Exclusionary* would include
    this topic, making it more universal and especially appealing to students in schools
    where they are dealing with this situation on a daily basis.


    # Theme 3: School gardens and sustainability


    As with the previous example, sustainability by itself can be further limited
    and situated in a human context and it could become a theme eventually meeting
    all the components of an effective theme. However, connecting it to the school
    garden limits it too much. Similarly, a school (and community) garden can be a
    wonderful project in an interdisciplinary thematic service learning unit (TSLU).
    (This type of unit is described later in this chapter.)


    # Theme 4: Doing the right thing when no one is looking


    This is one of the universal issues confronting all humankind throughout history
    and engages adolescent students in ethical dilemmas very quickly. It fits many
    disciplines and quickly leads to higher order thinking. It can involve a wide
    range of issues from shoplifting and cheating on exams to political corruption
    in the local town.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Issues of Social Conscience


    Cecelia Cullen was the principal of Middle College High School for a good part
    of the time that Terry and I ran the BONGO Program there. Because of her ability
    to allow teachers to create programs in her school that met the needs of students,
    we were able to continually tweak what we were doing and try new components in
    order to respond to student insights into what worked for them. In an interview
    with her about what she thought contributed to the success of BONGO that appeared
    in a documentary about the program (Jablon and Born 1989), she noted, “One of
    the strongest parts of the program is that it deals with social issues. These
    appeal to teenagers’ wishes and needs to create a perfect world and to contribute
    to making that world a reality.”


    In the BONGO Program, a majority of the time students wrote and toured original
    plays that were dramatic manifestations of the *theme* that they wanted the audience
    to wrestle with. Other times they created and published a community newspaper
    or a combined photography literary magazine through which they could express their
    understandings that evolved during the academic aspects of the interdisciplinary
    program. Adolescents, especially those who are disenfranchised from school, cannot
    resist becoming enthralled with issues relating to fairness, especially the distinction
    between equal and equitable.


    > > If we allow students to role play selected real life situations between these
    individuals or groups that are analogous to interrelationships in social studies,
    science, or literature situations, then students not only *experience* this larger
    complex relationship but simultaneously *understand* related emotional needs.

    > >

    > > (Jablon 2010, 3)


    # Analogous Interrelationship Role Plays


    For the past 40 years I have observed adolescents in a wide range of classes.
    For some of these classes I was the teacher, but since 1990 I have been fortunate
    enough to have the opportunity to be an outside observer of a cross section of
    classes in various disciplines, in both urban and suburban locations, and in small
    non-traditional schools and large fairly traditional schools. In each of these
    classrooms there were at least three or four students who were completely disengaged
    from any learning activities no matter how much the inquiry learning and interdisciplinary
    format was used. If we multiply these students by the number of classes in the
    school, this number becomes substantial. In many urban schools this number was
    much higher.


    During the 21 years—1970–1990 and 2001–2002—that I taught adolescents, together
    with my colleagues and our students, we created an approach to truly engage these
    disengaged students in learning, and in becoming full participants in our community'
