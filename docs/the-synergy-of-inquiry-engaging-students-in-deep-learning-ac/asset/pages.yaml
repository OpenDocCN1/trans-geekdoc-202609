- pgno: 108
  md: '# Reflecting With Inquiry Teachers


    In this chapter, you will meet 10 exceptional teachers with whom I have had the
    privilege of working. You will hear them describe their experiences with inquiry
    teaching—the joys, struggles, insights, fears, hopes, and dreams. I met some of
    these teachers while I taught at Middle College High School.


    As part of a program I codirected at this high school, students wrote original
    plays based on subjects they studied, and at times during the year, toured them
    to other public schools. After 13 years of working with my colleagues at becoming
    an effective inquiry-and project-based teacher, I forgot the differences between
    classes at our school and those at most of the other schools in New York City.
    However, whenever we toured students’ plays, I would spend days in various classrooms
    at other schools and was reminded of the difference in level of engagement, understandings,
    creativity, and energy between those classes and ours. Since then I have taught
    at three universities where I have had the opportunity to visit countless numbers
    of classrooms and work with teachers throughout the country. Whenever I enter
    a classroom where teachers are moving towards inquiry teaching, I detect a certain
    atmosphere—that level of intellectual and emotional engagement and elation stemming
    from figuring out and negotiating ideas.


    # The Voices of Inquiry Teachers


    We first hear from David Nurenberg who for 14 years has been an English teacher
    in Concord, Massachusetts. His use of inquiry teaching has evolved during this
    period and, as you can see from his description of his classroom, he has thought
    deeply about his practice. After he reviews what inquiry teaching looks like,
    he reflects on the challenges he has faced using inquiry.


    +   - **Andrea Egitto**, who started as a fourth-grade teacher in an inner-city
    public school in the Brownsville section of Brooklyn, New York, explains how she
    was inspired to use inquiry teaching throughout her 15-year career. Currently,
    Andrea uses inquiry teaching in her first-grade classroom in Northampton, Massachusetts.'
