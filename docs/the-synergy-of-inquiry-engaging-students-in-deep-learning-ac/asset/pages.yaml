- pgno: 238
  md: '# Professional Development in Mathematics Teaching


    One of the most pressing problems we needed to address immediately concerned our
    poor scores on the previous year’s state tests, the MCAS (Massachusetts Comprehensive
    Assessment System). I arrived at my new post from teaching fifth grade in another
    district school where my own students had performed well, and I expected that
    students at Ryan Road School could certainly match them. In particular, I knew
    that the mathematics program the district uses was especially aligned with the
    state curriculum frameworks. However, it also is a challenging inquiry-teaching
    program that is difficult to teach well, and I suspected that its implementation
    at the school was not thorough. I began meeting with teachers for half-day curriculum
    work, starting with math. At the testing grades (third, fourth, and fifth) we
    spent time analyzing our test results, looking carefully at the test questions,
    and talking together about how we might expect our students to be able to tackle
    them. I noticed teachers saying, “These questions look just like the problems
    in *Investigations*. We should be using it better to prepare students for these
    tests.”


    In this way, their own analysis led teachers to a new commitment to teaching the
    math program using the inquiry approach it embraces. In order to rise to the task,
    teachers asked me to provide professional development in effectively using an
    inquiry approach to mathematics. Interestingly, while this request arose from
    their own collaboration around what might improve test scores, it eventually led
    to much improved teaching of mathematics across the grades as well as to resulting
    improved test scores. I responded to their request by offering advanced training
    in the *Investigations* program through TERC (https://www.terc.edu/display/HOME/Home)
    and also in inquiry mathematics through *Summermath for Teachers* at Mt. Holyoke
    College. These graduate seminars are particularly focused on inquiry mathematics.


    At the same time, the district agreed to implement an unusual elementary math-coaching
    program that supported inquiry among teachers at our school. In this coaching
    model, each district elementary school identified three math coaches who remained
    full-time classroom teachers. They were able to coach their colleagues for an
    additional dedicated stipend. As they began their new roles, the coaches told
    their teacher colleagues, “We are doing this not because we have the answers,
    but because we want to work on professional questions together with you.” This
    cultivation of an inquiry approach to professional development—in which colleagues
    share professional questions with each other in a safe environment—was at the
    heart of the community we were developing together.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'A teacher who had previously been in a DMI (developing main ideas) seminar
    I had taught, reflected this change when she remarked to me one day, “It’s all
    because of YOU. We used to be able to sit around teachers’ rooms and talk about
    our grandchildren and recipes. NOW all we talk about is math!” Although she expressed
    this as an apparent complaint, she said it with a grin, acknowledging that she
    enjoyed the change in her professional environment.


    Teachers at Ryan Road School have commented similarly, “We love talking about
    math at lunch!” The climate of inquiry was not only taking hold at the school,
    it was also proving to be professionally rewarding for teachers as it encouraged
    them to delve deeply into improving their practice.


    # Inquiry Teaching in Science


    In those years, we found our attention turning to other subject areas as well.
    One day, a first-grade teacher stopped me in the hall with a question about science.
    According to the district STC science curriculum, she told me, her students were
    supposed to study trees. The lesson in the written curriculum actually suggested,
    “Show the children pictures of leaves in a book to help them learn to identify
    trees.”


    She explained, “I think the kids would learn more about trees if we went outside,
    but I don’t know how to manage that.”


    “I completely agree,” I replied, “and I know who can help us.” I resolved to connect
    our teachers to the skillful educators from the Hitchcock Center for the Environment
    in Amherst, Massachusetts. Our PTO (Parent Teacher Organization) agreed to fund
    visits for each class from Hitchcock educators. I encouraged teachers to think
    of the visits as a way for them to learn how to do what the visiting naturalist
    was demonstrating, rather than as a one time visit from an expert. As a result,
    Ted Watt of Hitchcock began as our mentor to understanding the world of nature
    and implementing inquiry science—a relationship that continues today.


    These visits were so successful and welcomed by teachers that they were eager
    to more deeply commit to inquiry nature studies. Luckily, a perfect opportunity
    presented itself in the form of a new endowment grant offered by our local Northampton
    Education Foundation. Led by Andrea Egitto, a committed and knowledgeable primary
    grade teacher, we wrote and were awarded the first large grant which provided
    three years of grade level specific training by Ted Watt. The grant enabled us
    to transform relevant portions of our science program to experiential inquiry
    field study science in natural areas within walking distance of the school. These
    included a nearby conservation area with varied habitats from forest to rock outcroppings
    to vernal pools.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Every teacher committed to this work. Additionally, the paraprofessionals who
    supervise students during recess came to me asking, “We want to learn from Mr.
    Ted, too.” Together we wrote a small grant that enabled them to have a series
    of after-school workshops to learn inquiry science. They produced a handy recess
    guide offering questions that adults could ask students at recess to encourage
    their conjectures and experiments such as figuring out what determines the course
    of the rivers that are created by melting snow. The adults encouraged the students
    to experiment by building tiny dams with found objects like sticks, stones, and
    leaves to divert the playground rivers. We also began our annual “Last Surviving
    Snowbank Contest.” This involved recess observations and conjectures from each
    class about which of the plowed snow banks around the playground would melt last
    (and why) with the prize being an extra recess. Thus inquiry and problem-solving
    were encouraged—even at recess, and our students were invited to ask questions
    and collaborate throughout the day. It was our hope that our students would continue
    these investigations at home in their neighborhoods. Their sharing at classroom
    morning meetings indicated that this happened.


    # Writing Workshop Approach


    Another academic area that our teachers felt needed improvement was writing. As
    they shared their concerns and questions with me, I realized that they had had
    limited training in the workshop approach to writing, which can be based on inquiry.
    We began to consider ways to put in place our own writing workshop approach. I
    wrote a small grant through which I was able to offer teachers training under
    Lynn Bowmaster’s leadership of writing workshops in third-, fourth-, and fifth-grade
    classrooms. We set up the grant to allow each class a series of sessions with
    Lynn and with the teacher participating along with students in order to experience
    being a writer, and to learn how to manage a writing workshop. In participating
    with their students, teachers were able to puzzle over their own questions:


    +   - What does it mean to be a writer?

    +   - Why is choice so important in writing?

    +   - What inspires writers?

    +   - How does the audience provide feedback to the writer?

    +   - How can a writing workshop reach each student and inspire individual creativity?


    We found our staff room and faculty meetings were becoming lively with conversations
    about math, science, and writing that revolved around our professional questions
    and led to improved classroom practice in all subject areas.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Collaborations with Students


    I also began to notice that, as principal, I had lots of opportunities to encourage
    a culture of inquiry and collaborative problem-solving among our students. For
    instance, if the weather was iffy, I would go out in the hallway and invite a
    passing student to be my “weather consultant,” to tell me whether we should have
    outside or inside recess. We would grab our coats or an umbrella and head outdoors
    to make the decision. One time, a deliveryman was coming up the walk, and we asked
    him what he thought. “Oh, they should definitely go out,” he declared, and we
    agreed. The idea that anyone could participate in the inquiry was reinforced:
    These occasions also taught our students that people all around are interested
    in the problems we approach at school and that we can all contribute ideas to
    solutions.


    When it was time to change the notice on the marquee in front of the school, I
    would invite several students to help me. We would gather up the box of letters,
    the padlock key, and the old broomstick to hold open the sign. As we walked out,
    I would ask students, “What do you think people need to know about our school?
    What’s coming up that would interest them? How should we tell about it on the
    marquee?” Some of the best ideas I heard came from students. More importantly,
    however, small steps like those encouraged students to realize that we solve problems
    all day, and that their ideas contribute to solutions that they can see and that
    other people notice and appreciate.


    One day during spring, a fifth grader suggested, “You know, Mrs. Riddle, I think
    we should have a Walk and Bike to School Week.”


    “Great idea,” I said. “Let’s do it the first week after vacation, and let’s put
    it on the marquee right now so we all can look forward to it.” That began a yearly
    tradition in which we encouraged everyone in the school to walk and bike to school
    for the last week in April. We always remembered that this was Javier’s idea,
    even after he had moved on to middle and high school.


    The school community’s dedicated commitment to the Responsive Classroom approach
    fostered collaboration and inquiry in the social and emotional realm also. This
    approach encourages a school to develop a culture of collaboration. It acknowledges
    that adherence to the principles of Responsive Classroom will not make problems
    disappear, but, rather, will offer an effective way to approach them collaboratively.


    There were times when inviting a student who was experiencing difficulty to engage
    in inquiry with me helped solve a complex situation. For instance, hurt feelings
    sometimes led to apparent misbehavior in the cafeteria, which resulted in several
    students being sent to the office during lunch. I learned that one of'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'them was an excellent observer of other students, and that he often had unusual
    insight into their feelings even though he was not always able to control his
    own behavior. After letting him cool off, I would ask him, “Help me understand
    what was happening in the cafeteria today. I think there were some hurt feelings
    in there.” In response to that invitation, he would give me an accurate and deeply
    insightful description of the many players involved and their various feelings.
    Often, together, we would figure out a way to invite those involved to solve their
    own problem through explanations and sincere and specific apologies. I often used
    this approach with other students and found that turning the student with a problem
    into the problem-solver and inviting collaboration could diffuse situations that
    had appeared to be beyond saving.


    # A Collaborative School Community


    The spirit of inquiry in a school must include all staff members and families,
    not just teachers and students. One winter day, our custodian mentioned to me
    that teachers were continually opening classroom windows to modulate the indoor
    temperature and piling materials on top of the unvent heaters, causing them to
    malfunction. I asked him to show me exactly how the heating system worked, and
    he explained so effectively, that I next asked him to do a short workshop for
    teachers since he was the one who understood the system best. I learned that our
    custodian himself is a very good teacher. Later, I found occasions for him to
    mentor students who appreciated the specialized knowledge he could share and which
    also interested them.


    When I went outdoors during recess times, I noticed that the paraprofessionals
    on duty had thoughtful insight into the students’ activities and feelings. When
    I observed some puzzling interactions on the playground, rather than immediately
    intervening myself, I learned to ask a staff member on duty, “What have you noticed
    about those students over there? Is everything going okay with them?” Almost always,
    they had been watching a situation develop and knew exactly whether or not we
    needed to intervene. Asking their advice indicated to them that I appreciated
    their knowledge and expertise and that they did not need me to be the boss. After
    a few years staff members on duty regularly identified problems and shared effective
    ideas with each other and with me, which helped make things run much more smoothly—on
    the playground and in the cafeteria and also at arrival and dismissal. Although
    I made sure to be out and about all around the school, I was rarely needed to
    intervene. An inquiry approach is effective in students’ learning because it encourages
    students to be thoughtful independent learners, to show initiative, and to be
    persistent. Clearly the same thing is true of adult staff members in a school.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Playground Safety Rules


    It was the paraprofessionals themselves who identified a serious playground problem
    in recent years. “Students know the rules,” their spokesperson said, “but they
    don’t follow them. I think we made them so long ago that they don’t own them.
    In Responsive Classroom, the students are supposed to make the rules.” This concern
    led me to form a Recess Safety Rules Convention. Each class (K–5) sent one delegate
    to the convention with a list of the safety rules that the class had agreed needed
    to be followed at recess. Out of some 70 plus rules, the delegates were tasked
    with creating a much shorter list of rules *that we can all remember*. Among the
    delegates, I partnered an older student with a younger one, and they set to work
    identifying the most important of the rules. After just two meetings, they were
    able to agree upon a short set of Recess Safety Rules, which each delegate proudly
    presented to his or her own class. Rule following on the playground subsequently
    improved.


    Some of the students’ decisions interested me a great deal. For instance, the
    delegates insisted on ‘No swearing or name calling.’ I asked them, “Can you help
    me understand how that is a *safety* rule?” They explained that when people use
    bad language it makes others mad, and they might start to fight. Swearing and
    bad language had been a persistent problem on the playground that the adults had
    not been successful in solving in spite of repeated interventions. Because we
    had invited students to consider safety rules, the students had addressed it themselves.


    # School-Wide Celebrations


    An aspect of developing our supportive community involved regular school-wide
    celebrations. We found a way for them to also be inquiry based. Our first was
    a celebration of Martin Luther King’s birthday that occurred a few weeks after
    I began as principal. Teachers were invited to work with their classes to present
    something to the whole school that acknowledged the importance of Dr. King’s life
    and legacy. This invitation offered students and teachers the chance to consider
    what they knew about Dr. King and to decide together, collaboratively, how they
    might present their ideas to the rest of the school. Over the years, the presentations
    included songs, poetry, a mural, original dramatic presentations, and personal
    stories, including one by a student whose father, as a baby, was comforted on
    an airplane by Dr. King.


    Other celebrations during the year, including for Memorial Day and the start of
    each of the four seasons, were put together in the same collaborative spirit of
    learning through inquiry. For instance, when we gathered all together outdoors
    on the first day of fall, the autumnal equinox, each class presented through actions,
    dress, dance, poetry, art or song, their idea of the meaning of equality. In order
    to'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'decide how to present their idea, the class had to ask themselves: What does
    *equal* mean? What does it have to do with the first day of fall? How can we show
    everyone in our school what we think equal means? The various representations
    (including one year when they occurred just as a rainstorm burst forth and drenched
    us all) were creative, mathematically conceptual, and reflective of the scientific
    concept of the equinox.


    This approach resulted also in outreach to our wider school community as we invited
    families to help us celebrate Hispanic Heritage Month in October with an annual
    fiesta and Cambodian New Year in April with traditional foods, games and dance.
    We asked our families to *help us understand your culture* as we learned the dances,
    shared recipes and cooked food for the celebrations, and learned about their history
    and customs.


    # Success for Teachers and Students


    Over the years, the spirit of inquiry became the way we operated at the school.
    Adults learned that approaching learning and problem solving with elementary students
    through collaboration and inquiry makes for deeper and more lasting learning.
    It also encourages students to become independent learners who continue their
    explorations outside of class and school—on the playground and in their families
    and neighborhoods. Just as important, it makes for content students and a happy
    school.


    Finally, it is widely agreed upon that the quality of a child’s teacher is a significant
    factor in the depth of learning for that student. Certainly it must be the goal
    of every principal to both attract and retain the very best staff members for
    the school. In order to do that, one must work toward a school climate that is
    intensely professionally satisfying to the adults who work there. In the words
    of a superintendent for whom I once worked, “You want your school district to
    work the best for the best teachers.”


    I thought about those wise words every time I put together a hiring committee
    for a new staff member. I knew I wanted the candidates to be introduced to our
    teachers and think to themselves, “I would love to work with these people.” I
    was thrilled when exactly that happened. We were able to attract highly skilled
    and experienced teachers, including ones who were willing to leave another secure
    position. “I want colleagues with whom I can discuss the ideas that matter about
    teaching,” remarked one who chose to make such a move. Not only did they come,
    but they also chose to stay. The stance of inquiry works best for students, but
    it'
