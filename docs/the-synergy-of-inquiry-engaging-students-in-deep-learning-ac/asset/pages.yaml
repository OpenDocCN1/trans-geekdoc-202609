  img_proc: true
- pgno: 202
  md: '# A Previously Disengaged Student Engages in a Final Public Project: A Slice
    of School Life


    For Steve, even inquiry-based subject classes were not enough. He tried different
    science, English, history, physical education, and math classes a number of times
    and each time he walked away—sometimes literally, sometimes just mentally. Now,
    here he was rehearsing dialogue for a play he had helped write that focused on
    gene pools and ecosystems. He had to laugh to himself. Last night he tried on
    the gray suit that his mom had bought him to go to his uncle’s funeral to see
    if it still fit him. It had been a little tight, but it would work when he walked
    on stage as the defense attorney defending the young couple that was challenging
    the theoretical new law requiring amniocentesis for all pregnancies. The class
    had argued for weeks about the ethics of the law they devised, and ironically,
    he was in the center of this debate. This was the same Steve, who only seven months
    before, the police had picked up on suspicion of assaulting another teen and putting
    him in the hospital. The friends who were with him that night had not considered
    the ethics of anything. They knew they had each other and thought surely they
    were right.


    All that seemed so far away now. He still saw them regularly when he was in his
    neighborhood, but only Manny, Raphael, and Nadine were also part of this life
    at this school. This was not the first public high school that they had attended.
    Actually, he had not attended the other one all that much, easily getting lost
    amongst the other 4,000 students. It was not that his teachers were not dedicated.
    He could not articulate what he needed, but he knew it was not enough, so he cut
    out, just walked away. The city was big enough to swallow him up and keep him
    somewhat occupied. Until this past September, he had not really attended school
    for over six months.


    # Thinking Back on the BONGO Program


    Steve and his peers are actual students that Terry and I taught at Middle College
    High School, a New York City public school, where we taught for over 19 years.
    This *slice of school life* described from a student perspective is a narrative
    derived from actual interviews with these students done as part of the 10-year
    research study. Steve’s journey to success is similar to the pedagogical evolution
    that I underwent as my colleagues and I created structures that were effective
    in reengaging at-risk, urban students in learning. The BONGO Program in which
    Steve was enrolled was the result of a long journey where each of the components
    was uncovered through a mixture of learning from other teachers, studying at university,
    and mostly by listening to students. The program was'
