- pgno: 233
  md: '+   - Research paper

    +   - Original scientific experiment

    +   - Application of a math concept

    +   - Work of art

    +   - Native language work

    +   - Resumé

    +   - Mastery statement of what they had learned in high school including college
    and career plans.


    In order to meet graduation requirements, each student was required to successfully
    defend this portfolio before a panel of teachers, parents, students, and outside
    experts. As one young teacher astutely observed, portfolio assessment is as much
    an assessment of teachers as students.


    # Alignment of Adult and Student Learning and Assessment


    School supervision is adult education. The principal’s class is his or her faculty.
    As a principal, I believe the way adults learn needs to parallel the way you would
    like to see them work with students, and usually does. If the principal stands
    at the front of the auditorium once a month for a faculty meeting, and spends
    the time pontificating about administrivia rather than facilitating adult learning,
    then do not expect anything different the next day than a teacher lecturing in
    front of every classroom.


    Intent on doing it differently myself, I knew that if I wished to see students
    deeply engaged in inquiry-based activities and projects, then I needed to organize
    teachers similarly. Early on in my tenure as principal, I realized that the core
    of such engagement could be to involve the faculty in shared governance. Since
    our school was on a college campus, and college faculty members are more involved
    in governance matters than teachers in K-12, it was an obvious connection to make.
    Our shared governance began by forming a faculty personnel committee charged with
    hiring new teachers. After hiring the staff for the first year of the school,
    teachers took over and hired their future colleagues thereafter.


    Having hired their colleagues, I did not find it difficult to convince my faculty
    to form peer support groups so that teachers who had been at the school longer
    could mentor their newest colleagues. Soon peer support gave way to peer review,
    and we developed a formal way for teachers to evaluate one another by portfolio,
    thus paralleling the way teachers were evaluating students for graduation. Having'
