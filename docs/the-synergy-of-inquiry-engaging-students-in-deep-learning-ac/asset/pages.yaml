  md: '# Figure 2.7 Rubric for Assessing Student Use of Thinking Skills, Habits of
    Mind, and Concept Understanding


    |  | Novice | Competent | Expert |

    |---|---|---|---|

    | Process Skill | Makes quick observations and draws without great detail. Places
    drawings in a sequence without careful thought to what is occurring in each sequence.
    | Uses careful observations, makes detailed drawings, and infers a sequence (model)
    based on explanations of what they think is occurring with the nuclear material.
    | In addition to skills in the competent category, is able to provide a different
    explanation of why the same or a different sequence can be explained using the
    same evidence. |

    | Habit of Mind | Fails to see that the inferential explanation that they hold
    to support their sequence of stages is only one possible explanation of the same
    evidence. | Realizes that more than one inferential explanation can be given for
    the same sequence and that another sequence might be explained by another interpretation
    of the same evidence. | In addition to understanding various interpretations for
    the same evidence, also understands that this is a major component of the nature
    of science and the scientific enterprise. |

    | Concept #1 | Recognizes that the nucleus looks different in various cells near
    one another, but does not have an explanation for the various layouts. | Recognizes
    when cells replicate, nuclear material appears in strands that differ from non-replicating
    cells. This predictable, sequential process is called mitosis. | Not only can
    sequence the stages, but can clearly explain what is occurring at each stage including
    an understanding of spindle fibers, the concept of two pairs of chromosomes relative
    to genes, and so on. |

    | Concept #2 | Cannot explain if the genetic material in the two cells after mitosis
    is identical. | Can explain that genetic material in the nucleus is replicated
    and is included in both daughter cells. | Can infer that if the new cell needs
    to create (by mitotic division) other cells, then the material must be identical.
    |

    | Concept #3 | When asked for another theory besides cells dividing that could
    explain growth, cannot come up with another explanation. | Can explain that cells
    need to replicate, rather than simply getting bigger, when growth occurs in organisms.
    | Can think of structural physics-based reasons why the bigger cell theory would
    literally not hold water. |'
