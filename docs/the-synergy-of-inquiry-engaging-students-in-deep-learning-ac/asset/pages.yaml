    Focuses on particular habits of mind; for example, using conjecture or viewpoint,
    and so on

    Identifies range of resources—books, videos, websites, historical documents, and
    so on

    Provides challenging, but doable, tasks |


    | Component Category | Components |

    |---|---|

    | Structure | Establishes a clear overview and rationale, including:

