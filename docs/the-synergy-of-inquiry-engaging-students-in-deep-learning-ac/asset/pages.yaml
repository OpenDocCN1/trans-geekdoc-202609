- pgno: 93
  md: '# What Carolina Was Thinking


    Unit four easily leant itself to being a hands-on inquiry unit where students
    uncovered mathematical solutions and a given concept during their small group
    explorations. Whether it was in 2-D or 3-D, manipulatives could be used each step
    of the way. Students filled in shapes with squares to prove their areas, as well
    as filled in figures with blocks to prove their volumes. Working under the essential
    question of “Can we trust our own eyes?” students also began to develop better
    estimation skills as they moved through the unit. However, the importance of exact
    measurement was tied in through explorations into the worlds of medicine, sports,
    machines, and so on. Since this unit was heavy with formulas, it was essential
    that students worked to uncover the formulas instead of the formulas being given
    to them.


    This particular lesson aimed to have students uncover the best way to figure out
    how much a rectangular prism could hold (the volume). Traditionally, teachers
    told students that *V=lwh* (volume = length x width x height) was the formula
    and students would input the right numbers to arrive at the answer. This way of
    teaching volume, however, leads to only a few students fully understanding why
    the formula looks the way it does; no less being able to apply it to unique situations
    at the appropriate time. By having students arrive at the formula on their own,
    they reach a deeper understanding of why the formula is what it is. It also empowers
    them to be able to create other formulas later in the unit. Lastly, the lesson
    called for students to apply their own formulas, instead of one found in a math
    book.


    In previous lessons, students have looked at measuring the surface area of boxes
    and have made boxes with one-centimeter grids on the outside. Carolina now wants
    them to move their understandings from two-dimensional measurement to three-dimensional
    measurement: volume. Students in each small group begin with building some three-dimensional
    boxes (rectangular prisms) by cutting and taping together some two dimensional
    “nets.” Figure 2.8 presents drawings of nets.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Figure 2.8 Drawings of Nets


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_94_0.png)


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_94_1.png)


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_94_2.png)


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_94_3.png)


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_94_4.png)


    Carolina asks each student to write down which of the boxes that they made in
    their group holds the most stuff. They then discuss the responses in their groups,
    explaining why they think their answer is correct and seeing if they can convince
    the others as to why theirs about how to decide which holds the most, such as
    fill it with beans or pennies and count the number it takes to fill them. These
    are all reasonable responses, but she asks students about the space between the
    beans and how will they measure that.'
