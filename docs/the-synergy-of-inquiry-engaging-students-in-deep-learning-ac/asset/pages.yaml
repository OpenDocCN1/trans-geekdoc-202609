- pgno: 96
  md: 'As a result of this activity, students have created the three-dimensional concept
    of *volume*. Notice that once they have created the concept, and explored it and
    applied it to the other boxes, Carolina can then give them the vocabulary for
    the idea. Likewise, the class creates the formula V=lwh by themselves and are
    not given it as an algorithm. They each own it and the concept attached to it
    in their long-term memory.


    # What Carolina Was Thinking


    If you look closely at Carolina’s plan you will also see some nice authentic performance
    assessments where students needed to apply their newly created concept of volume
    to some unique, real-world situations. She went right to the heart of the application
    part of the inquiry teaching learning cycle.


    Even better, was an example of an extension using the same materials for students
    who became experts by acquiring the concept long before the other students in
    their group. They were given a challenge to optimize the volume using the least
    amount of cardboard (surface area). It was done as a real-life situation where
    they worked for a company that wanted to save money (and the environment) by using
    the least amount of materials. This focus really extended their understanding
    of the relationship between two-dimensional surface area and three-dimensional
    volume using trial and error to make an optimal relationship between the two.


    Parents never need to worry about their children being in a heterogeneous group
    in Carolina’s class, as students of varying abilities assist one another in figuring
    out and understanding. Students who are ahead of the curve are also challenged
    to go where their abilities lead. This differentiation is possible because they
    are figuring out using concrete materials in small groups.


    # Carolina’s Reflection on Inquiry Teaching


    Inquiry-based teaching was not my first approach. When I began my first teaching
    job in 2007, I was given a traditional math textbook. Although it was colorful
    and had a few interesting activities, most of it was written in the, “I do, you
    copy, then you do 35 times,” format. If I found it boring, how bored my students
    must have been!


    Slowly but surely, I began incorporating more inquiry-type lessons into the curriculum.
    I wanted to make things more interesting, more relevant, and more fun. I now try
    to create explorations to pique student interest. These explorations are ever
    changing because I continually reflect on and adapt my teaching. I always ask
    myself, “Is this the best way to engage my students?”'
  merge: -1
  img_proc: true
- pgno: 97
  md: "I love project-based, interdisciplinary learning. My ultimate goal as an educator\
    \ is to facilitate experiences that span multiple aspects of life and involve\
    \ meaningful, long-term objectives. As teachers, we want our students to be complex\
    \ thinkers who, instead of compartmentalizing their knowledge, can make connections\
    \ across the curriculum, to their own lives, and to the world at large.\n\nWe\
    \ also want our students to maturely express their opinions and debate their ideas\
    \ with their peers. To this end, I facilitate cooperative group work. Developing\
    \ a classroom of sharers and negotiators has been challenging yet invigorating.\
    \ I continue to hone all of these facets of my teaching skill set in my seventh\
    \ year as an educator.\n\nIt is not easy. There are days that do not go as planned,\
    \ and I am left feeling disappointed and discouraged. There are days when carefully\
    \ thought out lessons fail to ignite the expected interest of my students. There\
    \ are days that leave me deflated and near tears. On these days, I say to myself\
    \ what I will now say to you: Please, do not give up. Your students need you.\
    \ They need an energetic, caring, and thoughtful role model. You can always make\
    \ tomorrow better than today. They are lucky to have you and, although they may\
    \ have a funny way of showing it, they appreciate you.\n\nFortunately, I have\
    \ seen signs that I am having success. I have heard students groan when the bell\
    \ rings and class is over because they have to wait another day before continuing\
    \ our lesson. I have heard students say, “This is fun!” while solving proportions\
    \ because I created an experience in which they want to find the answers. I have\
    \ even had students who previously found little satisfaction in their math classes\
    \ tell me that math is now their favorite class.\n\n# The Planning Process for\
    \ Eleventh-Grade Language Arts\n\nKatie Houle, a high school English teacher in\
    \ Chelmsford, Massachusetts, developed five lessons for a unit on gothic literature\
    \ and Edgar Allan Poe’s poem The Raven. She identified two essential questions\
    \ for the lessons:\n\n+   1. Why do gothic literature and scary stories resonate\
    \ with us as readers?\n+   \n+   How exactly do writers make their stories scary?\
    \ For example, what key devices do writers of gothic literature use to convey\
    \ an eerie feeling to their readers?\n+   \n+   2. Can we trust the narrator of\
    \ every story? Why or why not?\n\nBrief descriptions of Katie’s lessons follow.\
    \ For a full description of Katie’s unit, “Gothic Literature and ‘The Raven’:\
    \ An Example of a Five Lesson Inquiry Teaching Unit,” refer"
  merge: -1
  img_proc: true
- pgno: 98
  md: 'to the Digital Resource CD. In each subsequent lesson, the concepts that students
    have created in previous lessons *spiral* throughout the unit. I use *spiral*
    here in the way first described by Jerome Bruner (1960) where students begin by
    creating developmentally appropriate concepts by manipulating materials and then,
    through further explorations, create and apply iconic and symbolic understandings.
    Implicit in this design is that those students who have not yet fully mastered
    particular concepts from previous lessons can revisit them in the new explorations.


    Since the language used in gothic literature can seem stilted to students in the
    21st century, Katie clearly delineates her genre objectives, but also looks at
    her larger literature and writing objectives.


    She then approaches the understandings she wishes students to uncover by having
    them first analyze something that is in their current lives and is universally
    intriguing to most adolescents—scary movies.


    Each student works alone, and then in a small group, to uncover what makes for
    a good scary movie. Through their discussion, students figure out the elements
    that writers, directors, and cinematographers use to create a scary movie. The
    reporters from each group share their insights with the whole class and Katie
    facilitates a lively discussion leading to a categorized set of qualities. She
    gives the class what the larger academic community considers the qualities inherent
    in gothic literature, which students then compare and contrast for homework.


    The next four lessons have students exploring the life of Edgar Allen Poe and
    how it might have moved him to write this type of story. They then dissect his
    poem *The Raven*, utilizing the elements of fear and horror that they created
    during their first lesson and expanding upon each of the concepts. They delve
    further into other poetic devices such as onomatopoeia and alliteration that can
    also be used to create tone.


    Finally, they are given an authentic assessment in which they are challenged to
    write a modern day poem using much of the tone and form of gothic literature,
    and *The Raven* in particular. They need to illustrate it and present a dramatic
    reading to the class.


    # What Katie Was Thinking


    This assignment was designed to accommodate a variety of learning styles while
    fostering the linguistic intelligence of students. The homework assignments leading
    up to the final product were designed to facilitate the learning of more concrete
    sequential learners who benefit from guidelines and requirements. From these assignments,
    students understand the format and expectations for the piece, which appeal to
    the straightforward and controlled learning styles of many students.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'The creative nature of the piece, however, appealed to those more open-ended
    learners. This assignment allowed them to choose their own characters, setting,
    and conflict, while utilizing language of their choosing. In this respect, the
    assignment benefitted those more intuitive and abstract learners, providing them
    with a less rigid method for expressing their understandings of *The Raven*.


    This piece was also designed to appeal to artistic students, who could create
    an in-depth, visual representation of their poem. Katie felt it was important
    to include this activity, as art is a pivotal method for expressing the meaning
    of written language, and yet is often overlooked in the English classroom. Furthermore,
    *The Raven* is largely about feeling and what you see as a reader, so it is an
    obvious opportunity to incorporate the skills of creative students.


    Lastly, the presentation aspect of this activity engaged those students who enjoy
    public speaking and commanding the attention of a room. It offered them a brief
    spotlight to entertain and engage their classmates.


    Remember that all students need to draw just as all students need to write, even
    those who are not “good at drawing.” As a result, each student experiences both
    relative success and relative struggle in various activities. Activities of this
    nature are consistent with the notion of multiple intelligences (Gardner 2006).


    # Employing Technology to Enhance Inquiry Teaching


    As we have seen in the preceding lesson examples, working with concrete materials
    is an important part of the exploration phase of the inquiry teaching and learning
    cycle. Modern technology has exponentially enhanced the possibilities of exploration
    and concept clarification for inquiry teaching lessons. However, technology should
    not take the place of students manipulating actual concrete materials, participating
    in role plays, interviewing community members, or working in the natural or social
    environment of the community. For example, once students have designed and carried
    out experiments in science using real materials to uncover the relationship between
    factors of a concept, students can go online and view animations or time-lapse
    photography of microscopic or molecular reactions or interactions. Students can
    research online primary sources for history explorations. They can interact with
    students in other countries around the world through websites that connect schools
    for all sorts of explorations in social studies. Once students in their small
    groups have uncovered a number of strategies to find a solution to a new math
    problem and students realize an elegant solution just as class ends, individual
    students who are still not clear in their understanding can now go to online resources'
  merge: -1
  img_proc: true
- pgno: 100
  md: "such as Khan Academy (Khan 2012; http://www.khanacademy.org/) to have it clearly\
    \ reviewed again.\n\nTechnology offers a range of possibilities for students to\
    \ communicate their understandings to a larger community audience. They can create\
    \ videos, musical recordings, photographic exhibitions, graphic illustrations,\
    \ and published printed books. The power of these technologies will be expanded\
    \ upon as we discuss project-based learning and service learning in Chapter 5.\n\
    \nMike Farmer uses technology within the context of inquiry teaching in his classroom\
    \ in Sheffield, Massachusetts where he teaches seventh- and eighth-grade social\
    \ studies and tenth-grade economics. Having become tired of lecturing (just as\
    \ his students did), Mike began to incorporate larger amounts of technology into\
    \ his students’ classroom activities—mostly Internet research, PowerPoint creation,\
    \ MS Word, online games and the occasional Skype conversations with students in\
    \ Egypt. Mike comments about his use of technology below.\n\n# Mike’s Reflection\
    \ on His Use of Technology\n\n> I begun to experience the dual reality that using\
    \ technology complicated matters as students commenced, progressed through, and\
    \ finished activities all at different times; while they also received the benefits\
    \ of being able to slow down, speed up, repeat, correct, and so on, at their own\
    \ pace. In short, technology provided a very effective form of individually tailored\
    \ education.\n> \n> It was really from this point on that I decided it was important\
    \ to completely change how students were learning in my classroom. Heidi Hayes-Jacobs\
    \ (2011), Khan (2012), Prensky (2001), Shaw (2009), and the US Government (Office\
    \ Technology 2010), to name a few, were all suggesting that massive amounts of\
    \ technology needed to be incorporated into school curricula in order for the\
    \ “digital natives” (Prensky 2001, 1) to be effective learners in American schools.\
    \ Obviously, it is necessary to use technology that works. A dated computer with\
    \ spotty Internet is a bad idea."
  merge: -1
