- pgno: 224
  md: '# Transforming the School Through the Synergy of Inquiry


    When more than one teacher in a school uses the inquiry approach, the effectiveness
    of instruction across all teachers’ classrooms increases. When more than one subject
    is taught using an inquiry teaching approach, cross-disciplinary thinking skills
    become ubiquitous for both students and faculty. When all subject areas use inquiry-based
    teaching processes, the positive effects are evident on the development of the
    following:


    +   - Higher order thinking skills required by the CCSS

    +   - Habits of mind that students carry throughout the rest of their lives

    +   - Problem solving strategies that cross disciplines, leading to greater student
    creativity

    +   - Student self-management that creates a safe and supportive school environment


    The added value supplied as more teachers employ the inquiry approach brings a
    synergistic effect that goes beyond what each individual contributes. As in any
    synergistic relationship, the interaction or cooperation of two or more people
    produces a combined effect greater than the sum of its separate effects. A culture
    is built in the school where teachers see students as competent to solve problems,
    clarify concepts, and develop deep understanding. Students feel empowered as they
    acquire strategies to address real world problems using their synthesizing and
    analyzing skills to effectively apply their deep conceptual understandings.


    In this culture, teachers are placed at the center of curriculum planning. They
    have greater leeway to plan and implement well-constructed interdisciplinary and
    project-based units. Students immediately apply their newly acquired problem solving
    skills and conceptual understandings as they confront issues in their own real
    communities. Parents are more integrally engaged in schools because of real life
    community service learning applications where they can be assets to learning in
    ways previously inaccessible and under used. The culture infiltrates every aspect
    of school life. Ineffective didactic practices that previously dominated school
    culture, begin to be evaluated when they no longer support the cognitive and social
    growth of students or faculty.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Inquiry teaching is at the core of effective early childhood, elementary, and
    middle school practice, and is endemic to the hundreds of *critical small high
    schools* being created throughout our cities and towns. These schools, with a
    gestalt of inquiry teaching culture, have been demonstrated to work more effectively
    in urban areas to close the achievement gap than alternative models (Ancess 2000,
    2003; Ancess and Darling-Hammond 2000).


    Inquiry teaching creates a culture where students, teachers, and leaders have
    choices. These new models have begun to lead how effective educational leaders
    are looking at the future of schools.


    # The Culture and Curriculum of an Inquiry-Based School


    An inquiry-based school is characterized by a culture and curriculum of creativity,
    empowerment, and collaboration.


    # Creativity


    An inquiry teaching approach engenders a school culture where failure is expected
    and is viewed as simply a step on the way to success. In a school imbued in inquiry,
    students figure out concepts, negotiate ideas, and practice skills. They are encouraged
    to use classic ideas and practices that they have uncovered to solve problems.
    Then, they are expected to be risk-takers and create new, untried approaches and
    out-of-the-box ideas. They utilize multiple ways to communicate their understandings
    by:


    +   - Writing fictional stories, allegories, plays, poems, movie story lines,
    and scripts

    +   - Writing nonfiction evidence-supported letters to the editor and op-ed pieces
    for local papers and online blogs

    +   - Writing scientific reports and explanations of math solutions and strategies

    +   - Producing videos for school and community broadcast and creating lyrics
    and melodies for songs that they perform and record

    +   - Painting, drawing, sculpting, and creating ceramic pieces


    They make carefully planned presentations to their town or city’s elected officials.
    They create physical historical models of their local areas for various time periods
    over the past centuries and display these at town halls, banks, and other public
    spaces. They write oral histories combined with careful primary document research
    that presents multiple points of view and publish these in books, on blogs, and
    in video format. They begin to jog and bicycle as a regular part of their daily
    lives. They learn and utilize the power of metaphor, building on the power of
    universal themes, but applying these in'
