- pgno: 9
  md: 'support ready if needed, but to allow the students to start with no assistance.
    He came back the next day and said only a couple of students needed any probing
    to get them to the final answer. He did not distribute the guiding worksheet,
    (although he did use some of the questions verbally with a few students) and the
    students were able to figure it out. Now I know that this does not always happen
    the first time, but imagine how much we have not allowed our students to learn
    on their own. We have deemed the work too hard so we give them the answers. We
    do not allow them to become problem solvers and they do not have control over
    their own learning.


    Inquiry and letting students explore their own thoughts allows students to believe
    that they have the answers and shifts the ownership of learning to them. Students
    are more apt to remember this information if they have created their own learning,
    yet classrooms still mostly depend on direct instruction and memorization to deliver
    content.


    Constructivism, differentiation, and high rigor are typical topics for education
    courses. But what does that look like in a classroom filled with students with
    a variety of abilities, experiences, and motivations? It is hard to imagine how
    these teaching ideals transpire reality in a classroom with so many variables.
    There is a gap in the education of teachers in how to effectively use these strategies
    to help student gain the knowledge through more effective means. The gap is not
    what needs to be done but rather how to do it and The Synergy of Inquiry attacks
    this gap. Paul Jablon has written this book to not only define inquiry, but to
    also give practical strategies on how to implement this in a classroom the next
    day. Furthermore, Jablon acknowledges the struggles that educators have with classroom
    management, the challenges of a classroom with a variety of students, including
    those that may be unmotivated in the subject, and the struggle of creating systemic
    change within a school. Jablon uses real teachers’ accounts to help one see that
    while this strategy may be difficult at first, it can produce great change and
    great gains in the educational growth of students.


    —Michelle Nye, Ed.D.

    High School Assistant Principal

    Tustin Unified School District'
