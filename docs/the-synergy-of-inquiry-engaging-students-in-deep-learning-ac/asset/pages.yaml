- pgno: 221
  md: 'During the unique application phase, the application can be modified for specific
    individuals. There is also continuous feedback from the teacher for the work of
    every student so that students can revise and master. All of the preceding conditions
    are necessary for everyone’s learning but are vital for students with special
    needs.


    Organizing curriculum and instruction around big ideas and interdisciplinary themes
    can facilitate the achievement of students with learning disabilities. Big ideas
    are important concepts or principles that help students to organize, connect,
    and apply component facts and ideas (Salend 1998).


    The research literature provides substantial documentation about the use and benefits
    of inquiry teaching with students with special needs (Mastropieri and Scruggs
    1993; Winzer 1993; Scruggs and Mastropieri 1994; Dalton et al. 1997; Goldman et
    al. 1998; Miller and Mercer 1998; Therrien et al. 2011; Villanueva et al. 2012).
    Scruggs et al. (1993) found inquiry-based instruction had a more positive effect
    on students’ vocabulary, factual recall, and application test questions scores
    than text-based approaches. They found that inquiry-oriented approaches helped
    facilitate students’ acquisition of content knowledge. The researchers also noted
    that when taught through inquiry-oriented approaches, students learned and remembered
    more and also enjoyed learning more.


    This does not mean that inquiry teaching solves all the issues that students with
    special needs display and that additional strategies do not need to be employed.
    Rather, evidence demonstrates that the structure of inquiry teaching does supply
    some of the strategies that counteract certain learning disabilities but also
    supplies the context in which other additional strategies are easily or best employed.
    Gore (2010) speaks about employing the appropriate *keys to the locks on the doors*
    to success for students with special needs. For example, a student with input
    locks, such as discrimination or sequencing problems, might be given a concept
    map as an advanced organizer (direct instruction) just before the concept clarification
    stage. Similarly, a student with information processing or retention locks, such
    as metacognition or memory problems, would be assisted by the constant overt request
    for many students’ thinking, including their own, but the teacher would provide
    much more review than normal. Students in small groups could also assist students
    who have a difficult time focusing on relevant ideas and ignoring irrelevant ideas
    as they get ready to synthesize ideas before the “reporter” reports out to the
    whole class.


    Lecture, embedded at the appropriate time, has its place in inquiry teaching.
    Likewise, direct instruction, explicit feedback, review and repetition are most
    effective for students with special needs when used appropriately within the context
    of inquiry teaching.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "# Effects of Inquiry Teaching for Disenfranchised Students\n\nAs noted throughout\
    \ this chapter, an inquiry teaching approach will consistently raise the number\
    \ and diversity of students who are engaged in learning in your school. Extending\
    \ inquiry teaching to include project-based, interdisciplinary learning that occurs\
    \ in the community, as well as in the school building, will diversify those succeeding\
    \ at learning even more, such that many of the achievement gaps begin to disappear.\n\
    \nIn Chapter 6, we will have an opportunity to look at the full extent of the\
    \ *synergy* of inquiry. Up until this point, we have spoken about how the effectiveness\
    \ multiplies as each discipline and teacher that a student encounters in the school\
    \ utilizes an inquiry teaching approach. Likewise, when the social context of\
    \ learning is one where students are empowered by being taught how to support\
    \ one another’s learning through an inquiry approach, the effectiveness multiplies\
    \ further. In the next chapter we will hear from an elementary and a high school\
    \ principal where the *synergistic power of inquiry* allowed the success of their\
    \ schools to grow and prosper exponentially over many years. Students and teachers\
    \ were, and are, truly empowered and in control of their own learning and destinies.\n\
    \n# Think and Reflect\n\n+   1. Why do final publicly-presented projects need\
    \ to be group dependent and dependent on the input and output of every student\
    \ throughout the whole term, in order for the class to succeed and the students\
    \ to prosper? What are the difficulties you foresee in this process? What are\
    \ the consequences of failing to include everyone?\n+   \n+   2. Why do you think\
    \ that schools that begin to use effective inquiry teaching eventually move to\
    \ some interdisciplinary inquiry teaching? How might this change the setup of\
    \ your school or team?\n+   \n+   3. Why are meaningful themes such powerful tools\
    \ for engaging middle and high school, and even upper level elementary students,\
    \ in deep investment in learning? Can you think of a powerful theme you would\
    \ like to use with your students?\n+   \n+   4. What aspects of inquiry teaching\
    \ make it so effective for students with special needs and English language learners?"
  merge: -1
  img_proc: true
