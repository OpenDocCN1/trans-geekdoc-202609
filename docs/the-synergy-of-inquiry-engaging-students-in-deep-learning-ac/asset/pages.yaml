- pgno: 134
  md: 'I have had the most success with incorporating inquiry in my geometry classes.
    The class is proof based, and with that as the cornerstone, it lends itself to
    asking the question “why?” all the time. I think at this point, midway through
    term two, my students are a little sick of hearing me ask the question. Recently,
    I did an activity with two of my three geometry sections to explore what we need
    to know in order to ensure two triangles are congruent. Doing inquiry can be a
    struggle. A lot of my students try to wait for me to give the answer, and some
    ask constantly “Am I right?” or “Is this how you do it?” I gave all students cut
    fettuccine with specific lengths and specific angles along with some uncut pieces
    that they could break or cut to fit what they needed. We walked through discussing
    and modeling how knowing that one side is congruent is not enough to determine
    that two triangles are congruent. We did the same with one angle. I then asked
    them to think about the next step, thinking about our goal being that we want
    to measure the fewest amount of things and still be able to know the two triangles
    are congruent. This left a lot of my students waiting for me to tell them what
    to do next. I asked the question “What is the next fewest amount of things that
    we could measure?” Luckily, one student said “two sides.”


    The rest of the activity sort of floundered. This class was small with about 16
    students, and they really just wanted me to tell them what to do. I spent most
    of the class just walking around asking questions and trying really hard not to
    answer theirs. By the end of the class, I could tell my students were really not
    sure of anything at all. They wrote down what I told them, but they could not
    really say why we were writing anything down. I needed to restructure the activity
    but I was not giving up.


    I tutor after school in the library, usually math, but sometimes I will help out
    with other subjects. I was working with a student on her physics homework, and
    she turned to me and said, “I wish she (the teacher) would just tell us what to
    do like they do in math class. That is why math is easy for me; we just follow
    steps and use formulas. In physics she does not tell us how to do the problem,
    we have to figure it out ourselves.” I think this was the one most disheartening
    remarks I have heard so far. Probably worse than the million “I hate math” proclamations,
    is the notion that students do not realize that thinking is required in math class.'
