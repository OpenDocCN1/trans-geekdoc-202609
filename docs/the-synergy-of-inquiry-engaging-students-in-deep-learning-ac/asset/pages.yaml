- pgno: 126
  md: '# Jack Fidler’s Reflections


    At a recent eighth-grade faculty meeting, I was struck by the high percentage
    of teachers who felt that their students demonstrated a state of *learned helplessness*.
    Teacher after teacher recounted stories where students were challenged to figure
    out something on their own, and said some variation of, “You are the teacher;
    are you not supposed to tell us?”


    I have tried, sometimes successfully, sometimes not, to instill openness to curiosity
    in my students. That recent faculty meeting made it clear to me that it is particularly
    challenging to accomplish this, when in class after class, teachers spoon-feed
    students the answers. I am pleased that at my school we are beginning to recognize
    that there are certain habits of mind we should cultivate in our students, habits
    of mind that lead to successful inquiry-based learning. Something only becomes
    habituated if it is practiced with regularity, so what happens in other classrooms
    can help or hinder my success.


    Even without a culture of inquiry learning at our school, I have seen the spark
    in students’ eyes when they ask a question they are genuinely interested in the
    answer to. I have made it a part of my practice to teach students how to question
    the texts that they read. They find this difficult because they are not used to
    being guided to formulate questions while reading.


    Still, it does happen. By the time my seventh graders get to Chapter 7 of *Animal
    Farm* (Orwell 1992), there is always one or two who are confounded by the idea
    of anyone confessing to a crime they did not commit. “Why would any animal confess
    to treason when they have watched Napoleon’s dogs tear apart someone else who
    confessed?” From this question, the student is ready, because interested, to explore
    the show trials in Stalin’s Russia, and eventually stage scenes for the class
    that suggest answers they may have found.


    ![](img/1ab167431007ad5d5eacf64bb7a71ad1_126_0.png)


    # Thinking Space


    Think of a time when you have worked in a group.


    +   - What were the positives and the negatives?

    +   - What actions of individuals or the group contributed to the positives? To
    the negatives?

    +   - What skills might be useful in order to work successfully as a team?

    +   - How have your personal experiences contributed to your planning for students’
    working in groups?'
