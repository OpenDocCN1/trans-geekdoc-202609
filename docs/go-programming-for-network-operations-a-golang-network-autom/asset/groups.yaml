    \ 服务 (SRV 记录)\n  - 7.7 文本 (TXT 记录)\n- 第 8 章：正则表达式模式匹配\n  - 8.1 简单匹配\n  - 8.2 匹配组\n\
    \  - 8.3 命名捕获组\n  - 8.4 模板扩展\n  - 8.5 多行定界符分割\n- 第 9 章：外部命令\n  - 9.1 合并标准输出/标准错误\n\
