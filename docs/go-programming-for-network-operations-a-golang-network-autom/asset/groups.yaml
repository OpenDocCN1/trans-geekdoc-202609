    \tfor _, line := range lines {\n\t\t_, _ = writer.WriteString(line + \"\\n\")\n\
    \t}\n\n\twriter.Flush()\n\n\tfile.Close()\n}\n```\n\n## 2.2 章：CSV\n\n逗号分隔值（CSV）是一种常用于导入、导出和存储数据的格式。它也常用于在不兼容的格式之间移动表格数据。\n\
    \n`csv` 包支持 RFC 4180 中描述的标准格式。每个 CSV 文件包含零行或多行，每行包含一个或多个字段，且遵循以下识别出的约束：\n\n- 空行将被忽略。\n\
