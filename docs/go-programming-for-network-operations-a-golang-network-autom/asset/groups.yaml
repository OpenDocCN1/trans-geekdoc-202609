    \  name TWO\nvlan 3\n    name THREE\n```\n\n### 第 3.3 节：模板继承\n\n模板继承用于处理嵌套模板，通过构建包含子模板的基本骨架来实现。这使得能够跨多个基本模板重用子模板。想象一下多种类型的路由器模板，它们都共享相同的公共子\
    \ BGP 或 NTP 模板。\n\n在这个示例中，使用模板继承来组装一个由基本配置数据和多个代表路由器 BGP 和 NTP 配置的子组件组成的路由器配置。数据源将设置在下面的\
