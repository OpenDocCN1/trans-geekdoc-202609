    \t}\n\n\twriter.Flush()\n\n\tfile.Close()\n}\n```\n\nThe resulting file viewed\
    \ in spreadsheet form below.\n\n| HOST | IP ADDR | LOCATION |\n| :--- | :--- |\
    \ :--- |\n| RTR1 | 1.1.1.1 | Seattle, WA |\n| RTR2 | 2.2.2.2 | Nevada, NV |\n\n\
    The same file viewed in plain text from a text editor below.\n\n```text\nHOST,IP\
    \ ADDR,LOCATION\nRTR1,1.1.1.1,\"Seattle, WA\"\nRTR2,2.2.2.2,\"Nevada, NV\"\n```\n\
    \n## Chapter 2.3: YAML\n\nYAML Ain't Markup Language (YAML) is a popular format\
    \ that is commonly used to read and write configuration files. It can also be\
    \ leveraged to translate data and support compatibility.\n\nYAML has a human-friendly\
    \ layout and supports an easy to follow syntax. In general, a colon is used for\
    \ key-value pairs, an indent for nesting, and a hyphen for list members.\n\nThe\
    \ `yaml.v2` package is compatible with most of YAML 1.1 and 1.2. It is often used\
    \ as the go-to package to parse and generate YAML formatted data quickly and reliably.\n\
    \nThis subchapter will cover the following topics:\n\n- Reading YAML files\n-\
    \ Writing YAML files\n\n### Chapter 2.3.1: Reading YAML\n\nThe `yaml.v2` package\
    \ supports an `Unmarshal()` function that decodes data into values from a byte\
    \ slice. If the decoded values are assigned to struct fields, the field names\
    \ must be exported and therefore have an upper case first letter; custom keys\
    \ are defined by using \"yaml\" struct field tags.\n\nIn this simple example,\
    \ the `yaml.Unmarshal()` function is used to decode the data from the YAML file\
    \ below into a struct.\n\n```yaml\nhost: localhost\nports:\n - 80\n - 443\n```\n\
    \nFirst, a struct is defined with the first letter in upper case and \"yaml\"\
    \ field tags to identify the keys. Then, the file is read using the `ioutil.ReadFile()`\
    \ function which returns a byte slice that is used to decode the data into a struct\
    \ instance with the `yaml.Unmarshal()` function. Finally, the struct instance\
    \ member values are printed to demonstrate the decoded YAML file.\n\n```go\npackage\
    \ main\n\nimport (\n\t\"fmt\"\n\t\"gopkg.in/yaml.v2\"\n\t\"io/ioutil\"\n)\n\n\
    type Config struct {\n\tHost  string `yaml:\"host\"`\n\tPorts []int  `yaml:\"\
    ports\"`\n}\n\nfunc main() {\n\tdata, _ := ioutil.ReadFile(\"file.yaml\")\n\t\
    conf := Config{}\n\t_ = yaml.Unmarshal(data, &conf)\n\tfmt.Printf(\"%s:%d\\n\"\
    , conf.Host, conf.Ports)\n}\n```\n\nThe output below displays each value formatted\
    \ on either side of a colon.\n\n```text\nlocalhost:[80,443]\n```\n\n### Chapter\
    \ 2.3.2: Writing YAML\n\nThe `yaml.v2` package supports a `Marshal()` function\
    \ that is used to serialize values into YAML format. While structs are typically\
    \ used to support the values, maps and pointers are accepted as well. Struct fields\
    \ are only serialized if they are exported and therefore have an upper case first\
    \ letter. Custom keys are defined by using \"yaml\" struct field tags.\n\nIn this\
    \ example, the `yaml.Marshal()` function is used to serialize data from a struct\
    \ and write it to a file in YAML format. First, a struct is defined with uppercase\
    \ first letters and \"yaml\" field tags to identify the keys in the file. Next,\
    \ the struct is initialized with values and serialized using the `yaml.Marshal()`\
    \ function. Finally, the serialized YAML formatted byte slice is received and\
    \ written to a file using the `ioutil.WriteFile()` function.\n\n```go\npackage\
    \ main\n\nimport (\n\t\"gopkg.in/yaml.v2\"\n\t\"io/ioutil\"\n)\n\ntype Config\
    \ struct {\n\tHost  string `yaml:\"host\"`\n\tPorts []int  `yaml:\"ports\"`\n\
    }\n\nfunc main() {\n\tconf := Config{\n\t\tHost:  \"localhost\",\n\t\tPorts: []int{80,\
    \ 443},\n\t}\n\n\tdata, _ := yaml.Marshal(&conf)\n}\n```\n"
  mdcn: "\n\n## 2.1.2 章：编写纯文本\n\n`bufio` 包提供了一个高效的缓冲写入器（Writer），可用于将数据写入文件。缓冲写入器会累积字节，直到达到阈值，然后完成写入操作以最小化资源消耗。本示例将通过逐步讲解，演示如何将字符串切片逐行写入纯文本文件。\n\
