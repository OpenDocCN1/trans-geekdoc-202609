    # ## Chapter 6: IP Address Manipulation


    IP address manipulation is used to efficiently parse and process IP addresses
    and their respective network masks. The net package provides methods for working
    with IP addresses and CIDR notation that conform to RFC 4632 and RFC 4291. This
    chapter will cover common tasks associated with manipulating IP addresses, such
    as listing all IPs within a network, determining whether an IP is contained within
    a network, and converting masks between CIDR and dot-decimal notation.


    This chapter will cover the following topics:


    +   - Determining whether a network contains an IP

    - Listing all IPs within a network

    - Converting between network mask formats'
