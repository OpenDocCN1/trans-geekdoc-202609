    RTR1,1.1.1.1,\"Seattle, WA\"\nRTR2,2.2.2.2,\"Nevada, NV\"\n```\n\nIn this example,\
    \ the file is opened in read-only mode using the `os.Open()` function, which returns\
    \ an instance of `os.File`. Next, the `os.File` object is handed off as a parameter\
    \ to the `csv.NewReader()` function which returns a buffered `csv.Reader` object.\
