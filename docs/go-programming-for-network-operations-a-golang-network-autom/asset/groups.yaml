    \ object. Next, a function is defined as a value that is used later to increment\
    \ in the loop statement. This function accepts a `net.IP` byte-slice parameter\
    \ that initializes the starting value of the loop and ultimately increments the\
    \ respective octet value.\n\nNext, a final loop is defined that iterates through\
    \ the network IPs. First, the `net.IP` value is initialized by using the `net.IP.Mask()`\
    \ method to retrieve the starting network address. Then, the `net.IPNet.Contains()`\
    \ method is put in place as the terminating condition to end the loop. Finally,\
    \ the increment function is used to walk through the respective network.\n\n```go\n\
    package main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tnetw :=\
    \ \"1.1.1.1/30\"\n\tip, ipnet, _ := net.ParseCIDR(netw)\n\n\tinc := func(ip net.IP)\
    \ {\n\t\tfor i := len(ip) - 1; i >= 0; i-- {\n\t\t\tip[i]++\n\t\t\tif ip[i] >=\
    \ 1 {\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t}\n\n\tipmask := ip.Mask(ipnet.Mask)\n\
    \n\tfor ip := ipmask; ipnet.Contains(ip); inc(ip) {\n\t\tfmt.Println(ip)\n\t}\n\
    }\n```\n\nThe output below lists all IP addresses within the CIDR network, including\
    \ the network and broadcast addresses.\n\n```\n1.1.1.0\n1.1.1.1\n1.1.1.2\n1.1.1.3\n\
    ```\n\n### Chapter 6.3: Mask Conversion\n\nThis example will convert an IPv4 mask\
    \ from slash notation to dot-decimal notation, then from dot-decimal back to IPv4\
    \ slash notation.\n\nTo start, the `net.ParseCIDR()` function is used on the CIDR\
    \ address in string format to return a `net.IP` and `net.IPNet` object. Then,\
    \ to convert the mask, the `net.IPNet.Mask` byte-slice is assigned to a variable\
    \ and then each index is formatted into the dot-decimal mask string and printed.\n\
    \nNext, to convert the mask back to slash notation, the dot-decimal mask is fed\
    \ into the `net.ParseIP()` function to return a `net.IP` object. The `net.IP`\
    \ object is implemented on the `net.IP.To4()` method to convert the IP back to\
    \ a 4-byte representation. This `net.IP` object is enclosed in the `net.IPMask()`\
    \ function to return a `net.IPMask` object. Finally, the `net.IPMask.Size()` method\
    \ is used to return the mask length, or the number of leading ones in the mask.\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\t\
    netw := \"1.1.1.1/27\"\n\tipv4IP, ipv4Net, _ := net.ParseCIDR(netw)\n\n\tm :=\
    \ ipv4Net.Mask\n\n\tdotmask := fmt.Sprintf(\"%d.%d.%d.%d\", m[0], m[1], m[2],\
    \ m[3])\n\n\tfmt.Printf(\"Dot-decimal notation: %s %s\\n\", ipv4IP, dotmask)\n\
    \n\tcidrMask := net.IPMask(\n\t\tnet.ParseIP(dotmask).To4())\n\n\tlength, _ :=\
    \ cidrMask.Size()\n\n\tslash := fmt.Sprintf(\"%s/%d\", ipv4IP, length)\n\n\tfmt.Println(\"\
    \\nCIDR notation: \", slash)\n}\n```\n\nThe output below displays the IP with\
    \ the dot-decimal mask followed by the CIDR mask representation.\n\n```\nDot-decimal\
    \ notation: 1.1.1.1 255.255.255.224\nCIDR notation: 1.1.1.1/27\n```\n\n## Chapter\
    \ 7: DNS Record Lookup\n\nDNS record lookup is enabled by domain name resolution.\
    \ The net package includes methods to look up the more common DNS records. This\
    \ chapter covers those methods and how to use them to look up records that include\
    \ forward, reverse, CNAME, MX, NS, SRV, and TXT.\n\nThis chapter will cover the\
    \ following DNS record lookups:\n\n- Forward (A)\n- Reverse (PTR)\n- Canonical\
    \ Name (CNAME)\n- Mail Exchanger (MX)\n- Name Servers (NS)\n- Service (SRV)\n\
    - Text (TXT)\n\n### Chapter 7.1: Forward (A)\n\nThe `net.LookupIP()` function\
    \ accepts a string and returns a slice of `net.IP` objects that represent that\
    \ host's IPv4 and/or IPv6 addresses.\n\n```go\npackage main\n\nimport (\n\t\"\
    fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tips, _ := net.LookupIP(\"google.com\"\
    )\n\n\tfor _, ip := range ips {\n\t\tfmt.Println(ip.String())\n\t}\n}\n```\n\n\
    The output below lists the A records for google.com that were returned in both\
    \ IPv4 and IPv6 formats.\n\n```\n172.217.1.238\n2607:f8b0:4000:80e::200e\n```\n\
    \n### Chapter 7.2: Reverse (PTR)\n\nThe `net.LookupAddr()` function performs a\
    \ reverse lookup for the address and returns a list of names that map to the address.\
    \ Be aware that the host C library resolver will only return one result. To bypass\
    \ the host resolver, a custom resolver must be used.\n\n```go\npackage main\n\n\
    import (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tnames, _ := net.LookupAddr(\"\
    8.8.8.8\")\n\n\tfor _, name := range names {\n\t\tfmt.Println(name)\n\t}\n}\n\
    ```\n\nThe single reverse record that was returned for the address is shown below,\
    \ including the trailing period symbol at the end.\n\n```\ngoogle-public-dns-a.google.com.\n\
    ```\n\n### Chapter 7.3: Canonical Name (CNAME)\n\nThe `net.LookupCNAME()` function\
    \ accepts a hostname as a string and returns a single canonical name for the provided\
    \ host.\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main()\
    \ {\n\tcname, _ := net.LookupCNAME(\n\t\t\"research.swtch.com\")\n\n\tfmt.Println(cname)\n\
    }\n```\n\nThe CNAME record that was returned for the research.swtch.com domain\
    \ is shown below, including the trailing period symbol at the end.\n\n```\nghs.google.com.\n\
    ```\n\n### Chapter 7.4: Mail Exchanger (MX)\n\nThe `net.LookupMX()` function accepts\
    \ a domain name as a string and returns a slice of MX structs sorted by preference.\
    \ An MX struct is made up of a Host as a string and Pref as a uint16.\n\n```go\n\
    package main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tmxs, _ :=\
    \ net.LookupMX(\"google.com\")\n\n\tfor _, mx := range mxs {\n\t\tfmt.Println(mx.Host,\
    \ mx.Pref)\n\t}\n}\n```\n\nThe output lists each MX record for the domain followed\
    \ by each respective preference.\n\n```\naspmx.l.google.com. 10\nalt1.aspmx.l.google.com.\
    \ 20\nalt2.aspmx.l.google.com. 30\nalt3.aspmx.l.google.com. 40\nalt4.aspmx.l.google.com.\
    \ 50\n```\n\n### Chapter 7.5: Name Servers (NS)\n\nThe `net.LookupNS()` function\
    \ accepts a domain name as a string and returns DNS NS records as a slice of NS\
    \ structs. An NS struct is made up of a Host as a string.\n\n```go\npackage main\n\
    \nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tnss, _ := net.LookupNS(\"\
    gmail.com\")\n\n\tfor _, ns := range nss {\n\t\tfmt.Println(ns.Host)\n\t}\n}\n\
    ```\n\nThe NS records that support the domain are shown below, including the trailing\
    \ period symbol at the end.\n\n```\nns1.google.com.\nns4.google.com.\nns3.google.com.\n\
    ns2.google.com.\n```\n"
  mdcn: "\n## 第 6 章：IP 地址操作\n\nIP 地址操作用于高效地解析和处理 IP 地址及其各自的网络掩码。net 包提供了用于处理符合 RFC\
    \ 4632 和 RFC 4291 标准的 IP 地址和 CIDR 表示法的方法。本章将介绍与 IP 地址操作相关的常见任务，例如列出网络内的所有 IP、判断\
    \ IP 是否包含在某个网络中，以及将掩码在 CIDR 表示法和点分十进制表示法之间进行转换。\n\n本章将涵盖以下主题：\n\n- 判断网络是否包含某个\
    \ IP\n- 列出网络内的所有 IP\n- 在不同网络掩码格式之间进行转换\n\n### 第 6.1 章：网络包含 IP\n\n本示例将定义一个包含两个\
    \ IP 地址的 CIDR 网络和切片，其中一个 IP 在 CIDR 网络内，另一个在外部。它将遍历切片中的每个 IP，以确定其是否包含在该网络中。\n\n\
    该示例首先使用 `net.ParseCIDR()` 函数对字符串格式的 CIDR 网络地址进行处理，以返回一个 `net.IPNet` 对象。接着，使用 `net.ParseIP()`\
    \ 函数从字符串地址返回一个 `net.IP` 对象。最后，将 `net.IP` 对象用作 CIDR 网络上 `net.IPNet.Contains()`\
    \ 方法的参数，以获取并打印结果。\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\
    \nfunc main() {\n\tnetw := \"1.1.1.0/24\"\n\tips := []string{\"1.1.1.1\", \"2.2.2.2\"\
    }\n\n\tfor _, ip := range ips {\n\t\t_, cidrnet, _ := net.ParseCIDR(netw)\n\n\t\
    \taddr := net.ParseIP(ip)\n\n\t\tresult := cidrnet.Contains(addr)\n\n\t\tfmt.Printf(\"\
    %s contains %s: %t\\n\",\n\t\t\tcidrnet, addr, result)\n\t}\n}\n```\n\n下方输出显示了\
    \ IP 是否包含在 CIDR 网络中。\n\n```\n1.1.1.0/24 contains 1.1.1.1: true\n1.1.1.0/24 contains\
    \ 2.2.2.2: false\n```\n\n### 第 6.2 章：列出网络 IP\n\n本示例演示了如何列出网络内的所有 IP 地址，包括网络地址和广播地址。首先，使用\
    \ `net.ParseCIDR()` 函数处理字符串格式的 CIDR 地址，以返回 `net.IP` 和 `net.IPNet` 对象。接下来，定义一个函数作为值，稍后将在循环语句中用于自增。该函数接受一个\
    \ `net.IP` 字节切片参数，用于初始化循环的起始值，并最终增加相应的八位组值。\n\n接下来，定义一个最终的循环来遍历网络 IP。首先，使用 `net.IP.Mask()`\
    \ 方法获取起始网络地址，以此初始化 `net.IP` 值。然后，将 `net.IPNet.Contains()` 方法设置为终止条件以结束循环。最后，使用自增函数来遍历相应的网络。\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\t\
    netw := \"1.1.1.1/30\"\n\tip, ipnet, _ := net.ParseCIDR(netw)\n\n\tinc := func(ip\
    \ net.IP) {\n\t\tfor i := len(ip) - 1; i >= 0; i-- {\n\t\t\tip[i]++\n\t\t\tif\
    \ ip[i] >= 1 {\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t}\n\n\tipmask := ip.Mask(ipnet.Mask)\n\
    \n\tfor ip := ipmask; ipnet.Contains(ip); inc(ip) {\n\t\tfmt.Println(ip)\n\t}\n\
    }\n```\n\n下方输出列出了 CIDR 网络内的所有 IP 地址，包括网络地址和广播地址。\n\n```\n1.1.1.0\n1.1.1.1\n1.1.1.2\n\
    1.1.1.3\n```\n\n### 第 6.3 章：掩码转换\n\n本示例将把 IPv4 掩码从斜杠表示法转换为点分十进制表示法，然后再从点分十进制表示法转回\
    \ IPv4 斜杠表示法。\n\n首先，使用 `net.ParseCIDR()` 函数处理字符串格式的 CIDR 地址，以返回 `net.IP` 和 `net.IPNet`\
    \ 对象。然后，为了转换掩码，将 `net.IPNet.Mask` 字节切片赋值给一个变量，并将每个索引格式化为点分十进制掩码字符串并打印。\n\n接下来，为了将掩码转回斜杠表示法，将点分十进制掩码传入\
    \ `net.ParseIP()` 函数，以返回一个 `net.IP` 对象。在 `net.IP` 对象上调用 `net.IP.To4()` 方法，将 IP\
    \ 转换回 4 字节表示。该 `net.IP` 对象被包裹在 `net.IPMask()` 函数中，以返回一个 `net.IPMask` 对象。最后，使用\
    \ `net.IPMask.Size()` 方法返回掩码长度，即掩码中前导 1 的数量。\n\n```go\npackage main\n\nimport\
    \ (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tnetw := \"1.1.1.1/27\"\n\tipv4IP,\
    \ ipv4Net, _ := net.ParseCIDR(netw)\n\n\tm := ipv4Net.Mask\n\n\tdotmask := fmt.Sprintf(\"\
    %d.%d.%d.%d\", m[0], m[1], m[2], m[3])\n\n\tfmt.Printf(\"Dot-decimal notation:\
    \ %s %s\\n\", ipv4IP, dotmask)\n\n\tcidrMask := net.IPMask(\n\t\tnet.ParseIP(dotmask).To4())\n\
    \n\tlength, _ := cidrMask.Size()\n\n\tslash := fmt.Sprintf(\"%s/%d\", ipv4IP,\
    \ length)\n\n\tfmt.Println(\"\\nCIDR notation: \", slash)\n}\n```\n\n下方输出显示了带有\
    \ 点分十进制 掩码的 IP，随后是 CIDR 掩码表示法。\n\n```\nDot-decimal notation: 1.1.1.1 255.255.255.224\n\
    CIDR notation: 1.1.1.1/27\n```\n\n## 第 7 章：DNS 记录查询\n\nDNS 记录查询通过域名解析实现。net 包包含用于查询更常见的\
    \ DNS 记录的方法。本章介绍了这些方法以及如何用来查询包括正向、反向、CNAME、MX、NS、SRV 和 TXT 在内的记录。\n\n本章将涵盖以下 DNS\
    \ 记录查询：\n\n- 正向 (A)\n- 反向 (PTR)\n- 规范名称 (CNAME)\n- 邮件交换器 (MX)\n- 名称服务器 (NS)\n\
    - 服务 (SRV)\n- 文本 (TXT)\n\n### 第 7.1 章：正向 (A)\n\n`net.LookupIP()` 函数接受一个字符串，并返回一个包含表示该主机的\
    \ IPv4 和/或 IPv6 地址的 `net.IP` 对象切片。\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\
    \n\t\"net\"\n)\n\nfunc main() {\n\tips, _ := net.LookupIP(\"google.com\")\n\n\t\
    for _, ip := range ips {\n\t\tfmt.Println(ip.String())\n\t}\n}\n```\n\n下方输出列出了以\
    \ IPv4 和 IPv6 格式返回的 google.com 的 A 记录。\n\n```\n172.217.1.238\n2607:f8b0:4000:80e::200e\n\
    ```\n\n### 第 7.2 章：反向 (PTR)\n\n`net.LookupAddr()` 函数执行地址的反向查询，并返回映射到该地址的名称列表。请注意，宿主机的\
    \ C 库解析器只会返回一个结果。为了绕过主机解析器，必须使用自定义解析器。\n\n```go\npackage main\n\nimport (\n\t\"\
    fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tnames, _ := net.LookupAddr(\"8.8.8.8\"\
    )\n\n\tfor _, name := range names {\n\t\tfmt.Println(name)\n\t}\n}\n```\n\n下方显示了针对该地址返回的单个反向记录，包括末尾的句点符号。\n\
    \n```\ngoogle-public-dns-a.google.com.\n```\n\n### 第 7.3 章：规范名称 (CNAME)\n\n`net.LookupCNAME()`\
    \ 函数接受主机名作为字符串，并返回所提供主机的单个规范名称。\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\
    \t\"net\"\n)\n\nfunc main() {\n\tcname, _ := net.LookupCNAME(\n\t\t\"research.swtch.com\"\
    )\n\n\tfmt.Println(cname)\n}\n```\n\n下方显示了针对 research.swtch.com 域名返回的 CNAME 记录，包括末尾的句点符号。\n\
    \n```\nghs.google.com.\n```\n\n### 第 7.4 章：邮件交换器 (MX)\n\n`net.LookupMX()` 函数接受域名作为字符串，并返回按优先级排序的\
    \ MX 结构体切片。MX 结构体由 Host（字符串）和 Pref（uint16）组成。\n\n```go\npackage main\n\nimport\
    \ (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tmxs, _ := net.LookupMX(\"google.com\"\
    )\n\n\tfor _, mx := range mxs {\n\t\tfmt.Println(mx.Host, mx.Pref)\n\t}\n}\n```\n\
    \n输出列出了该域名的每个 MX 记录，随后是各自的优先级。\n\n```\naspmx.l.google.com. 10\nalt1.aspmx.l.google.com.\
    \ 20\nalt2.aspmx.l.google.com. 30\nalt3.aspmx.l.google.com. 40\nalt4.aspmx.l.google.com.\
    \ 50\n```\n\n### 第 7.5 章：名称服务器 (NS)\n\n`net.LookupNS()` 函数接受域名作为字符串，并以 NS 结构体切片的形式返回\
    \ DNS NS 记录。NS 结构体由 Host（字符串）组成。\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\
    \n\t\"net\"\n)\n\nfunc main() {\n\tnss, _ := net.LookupNS(\"gmail.com\")\n\n\t\
    for _, ns := range nss {\n\t\tfmt.Println(ns.Host)\n\t}\n}\n```\n\n下方显示了支持该域名的\
    \ NS 记录，包括末尾的句点符号。\n\n```\nns1.google.com.\nns4.google.com.\nns3.google.com.\n\
    ns2.google.com.\n```\n\n"
