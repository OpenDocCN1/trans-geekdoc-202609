    \t\tfmt.Println(i.IsDir(), path)\n\t\treturn nil\n\t}\n\n\t_ = filepath.Walk(\"\
    \", scan)\n}\n```\n\n下方的输出是故意按字典顺序列出的。这种排序是 filepath.Walk() 函数的固有特性。\n\n```\n\
    false main.go\ntrue dir1\nfalse dir1/file1.txt\nfalse dir1/file2.txt\n```\n\n\
    # 第 2 章：读写文件类型\n\n读写不同的文件类型是许多程序中的关键要素。本章将讲解读取和写大多数环境中常见文件类型的示例；这些包括纯文本、CSV、YAML、JSON\
    \ 和 XML。\n\n几个示例将利用缓冲区来优化读取或写入操作，并最小化昂贵的系统调用。缓冲区将用于存储数据，直到达到一定大小后才进行写入，并在读取时通过单次操作检索更多数据。\n\
    \n本章将涵盖以下主题：\n\n- 纯文本\n- CSV\n- YAML\n- JSON\n- XML\n\n## 2.1 章：纯文本\n\n读写纯文本通常是逐行或逐词进行的。以下子章节中的示例将演示如何使用原生缓冲区逐行读写文本。\n\
    \n在处理大文件时，利用缓冲区会很有帮助，因为它在将数据提交给 IO 之前会存储数据直到达到一定大小；这减少了昂贵的系统调用次数以及其他相关机制的开销。\n\
    \n本子章节将涵盖以下主题：\n\n- 读取纯文本文件\n- 写入纯文本文件\n\n### 2.1.1 章：读取纯文本\n\nbufio 包的 Scanner\
    \ 是一个方便的接口，用于从文件中逐行或逐词读取文本。原生缓冲区通过单次操作检索更多数据来优化读取操作。此示例演示了如何从下面的纯文本文件中逐行读取文本。\n\
    \n```\nRTR1 1.1.1.1\nRTR2 2.2.2.2\nRTR3 3.3.3.3\n```\n\n首先，使用 os.Open() 函数以只读模式打开上述纯文本文件，然后返回一个指向\
    \ os.File 类型值的指针。接下来，调用 bufio.NewScanner() 函数，以 os.File 对象作为参数，返回一个用于调用 bufio.Scanner.Split()\
    \ 方法的 bufio.Scanner 对象。\n\n由于目标是读取每一行文本，bufio.ScanLines 被用作 bufio.Scanner.Split()\
    \ 方法的输入，然后使用 bufio.Scanner.Scan() 方法将扫描器推进到每一新行。每当推进到新的一行时，每次迭代都会通过 bufio.Scanner.Text()\
    \ 方法访问，然后追加到切片中并在最后打印。最后，在 os.File 对象上调用 os.File.Close() 方法以关闭文件，然后一个循环遍历并打印切片中的每个值。\n\
    \n```\npackage main\n\nimport (\n    \"bufio\"\n    \"fmt\"\n    \"os\"\n)\n\n\
    func main() {\n    file, _ := os.Open(\"./file.txt\")\n\n    scanner := bufio.NewScanner(file)\n\
    \n    scanner.Split(bufio.ScanLines)\n\n    var lines []string\n\n    for scanner.Scan()\
    \ {\n        lines = append(lines, scanner.Text())\n    }\n\n    file.Close()\n\
    \n    for _, line := range lines {\n        fmt.Println(line)\n    }\n}\n```\n\
    \n输出将逐行显示，正如从文件中读取的那样。\n\n```\nRTR1 1.1.1.1\nRTR2 2.2.2.2\nRTR3 3.3.3.3\n```\n\
    \n"
