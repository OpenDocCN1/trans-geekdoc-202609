    \ 包的字符串和基数整数动词格式化而成。此外，请注意 os.FileInfo.ModTime() 方法返回一个 time.Time 对象，这非常适合进一步的解析和格式化。\n\
    \n```\nFile name: main.go\nSize in bytes: 0\nLast modified: 2018-10-20 10:51:12.305\
    \ -0500 EDT\nIs a directory: false\nPermission bits: -rwxr--r--\nPermission 3-digit\
    \ octal: 744\nPermission 4-digit octal: 0744\n```\n\n## 1.4 章：列出目录内容\n\n使用 ioutil\
    \ 包中的任一 I/O 实用函数可以实现列出特定目录内的目录内容。通过在 ioutil.ReadDir() 函数中指定目录名称，它方便地返回一个 os.FileInfo\
    \ 对象列表，如前一节所示。\n\n在此示例中，使用句点符号来表示当前工作目录，作为 ioutil.ReadDir() 函数的输入。然后，对一个返回 os.FileInfo\
    \ 对象列表的切片进行循环。最后，循环遍历并利用每个 os.FileInfo.Name() 和 os.FileInfo.ModTime() 方法打印名称和最后修改时间戳。\n\
    \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"io/ioutil\"\n)\n\nfunc main()\
