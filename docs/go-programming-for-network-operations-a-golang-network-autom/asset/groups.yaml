    # Chapter 2.4: JSON


    JavaScript Object Notation (JSON) is a data interchange format typically used
    between web front-end and back-end servers and mobile applications. Most modern
    network appliances support a REST interface that exchanges JSON encoded data.


    The json package supports reading and writing the JSON format as defined in RFC
    7159. There are a few specific Go rules that must be followed:


    +   - Exported struct fields must start with capital letter.

    - JSON objects only support strings as keys.

    - Function, channel, and complex types will not be encoded.

    - Cyclic data structures are not supported.

    - Pointers are dereferenced before being encoded.


    This subchapter will cover the following topics:


    +   - Reading JSON files

    - Writing JSON files'
