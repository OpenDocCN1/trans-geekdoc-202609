    ```\n\n## 第 3 章：文本模板\n\n文本模板常用于网络运维中，生成大量遵循标准模板的配置。它们能够实现一致的准确性，并允许版本控制。\n\n模板包通过解析文本并评估动态元素来处理模板。本章将探讨常见的模板操作，然后介绍一个基本模板，再深入讲解模板继承。\n\
    \n本章将涵盖以下主题：\n\n- 定义模板元素\n- 创建基本模板\n- 实现模板继承\n\n### 第 3.1 节：模板元素\n\n模板的基本构建块是其元素。元素由双花括号包围的参数和操作组成。参数包括值和操作，而操作由语句组成，例如\
    \ if-else、range 或 with。\n\n| 元素 | 描述 |\n| :--- | :--- |\n| `{{.}}` | 根元素 |\n|\
    \ `{{.Var}}` | 变量 |\n| `{{- .Var -}}` | 移除两侧的空白 |\n| `{{ $version := \"0.1\" }}\
    \ {{ $version }}` | 内部变量赋值 |\n| `{{/* comment here */}}` | 注释 |\n| `Name: {{if\
    \ .Name }} {{ .Name }} {{ else }} anonymous {{end}} .` | If-else 条件判断 |\n| `{{with\
    \ .Var}} {{end}}` | With 语句 |\n| `{{range .Array}} {{end}}` | 遍历切片、映射或通道 |\n|\
