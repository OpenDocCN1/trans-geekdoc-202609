  md: "\n## Chapter 7.6: Service (SRV)\n\nThe net.LookupSRV() function accepts a service,\
    \ protocol, and domain name as a string. It returns a canonical name as a string\
    \ along with a slice of SRV structs. An SRV struct supports a Target as a string\
    \ and Port, Priority, and Weight as uint16's. The net.LookupSRV() function attempts\
    \ to resolve an SRV query of the service, protocol, and domain name, sorted by\
    \ priority and randomized by weight within a priority.\n\n```go\npackage main\n\
    \nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\tcname, srvs, _ := net.LookupSRV(\n\
    \t\t\"xmpp-server\", \"tcp\", \"google.com\")\n\n\tfmt.Printf(\"\\ncname: %s \\\
    n\\n\", cname)\n\n\tfor _, srv := range srvs {\n\t\tfmt.Printf(\"%v:%v:%v:%d:%d\\\
    n\",\n\t\t\tsrv.Target, srv.Port,\n\t\t\tsrv.Priority, srv.Weight)\n\t}\n}\n```\n\
    \nThe output below demonstrates the CNAME return, followed by the respective SRV\
    \ record target, port, priority, and weight separated by a colon.\n\n```\ncname:\
    \ _xmpp-server._tcp.google.com.\n\nxmpp-server.l.google.com.:5269:5:0\nalt2.xmpp-server.l.google.com:5269:20:0\n\
    alt1.xmpp-server.l.google.com:5269:20:0\nalt3.xmpp-server.l.google.com:5269:20:0\n\
    alt4.xmpp-server.l.google.com:5269:20:0\n```\n\n## Chapter 7.7: Text (TXT)\n\n\
    The net.LookupTXT() function accepts a domain name as a string and returns a list\
    \ of DNS TXT records as a slice of strings.\n\n```go\npackage main\n\nimport (\n\
    \t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\ttxts, _ := net.LookupTXT(\"gmail.com\"\
    )\n\n\tfor _, txt := range txts {\n\t\tfmt.Println(txt)\n\t}\n}\n```\n\nThe single\
    \ TXT record for gmail.com is shown below.\n\n```\nv=spf1 redirect=_spf.google.com\n\
    ```\n\n## Chapter 8: Regex Pattern Matching\n\nRegular expression pattern matching\
    \ is used to match a sequence of characters that are defined by a search pattern.\
    \ The regexp package leverages the fast and thread-safe RE2 regular expression\
    \ engine. While it does not support backtracking, it does guarantee linear time\
    \ execution. This chapter covers simple matching, match groups, named matches,\
    \ template expansion, and multi-line split.\n\nThis chapter will cover the following\
    \ regex pattern topics:\n\n- Simple matching\n- Match groups\n- Named capture\
    \ groups\n- Template expansion\n- Multi-line delimited split\n\n## Chapter 8.1:\
    \ Simple Matching\n\nSimple pattern matching covers the basic concept of returning\
    \ a result from processing a regular expression pattern against a data set. In\
    \ this example, the data set is first identified and then the regexp.MustCompile()\
    \ function is used to define the pattern. The pattern leverages the \\w+ syntax\
    \ to match one or more word characters on either side of the dot. Then, using\
    \ the dataset as input, the regexp.Regexp.FindString() method is called on the\
    \ pattern to return the result. If multiple string matches were needed from the\
    \ pattern, the regexp.Regexp.FindAllString() method would have been used and a\
    \ slice returned.\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n\
    )\n\nfunc main() {\n\tdata := `# host.domain.tld #`\n\tpattern := regexp.MustCompile(`\\\
    w+\\.\\w+\\.\\w+`)\n\tresult := pattern.FindString(data)\n\n\tfmt.Println(result)\n\
    }\n```\n\nThe simple match using the \\w+.\\w+.\\w+ pattern against the data set\
    \ is shown below.\n\n```\nhost.domain.tld\n```\n\n## Chapter 8.2: Match Groups\n\
    \nUsing parentheses in the search pattern identifies individual match groups.\
    \ Subpatterns are placed within parentheses to identify each individual matched\
    \ group across the data set. In this example, match groups are demonstrated by\
    \ matching each of the three sections of a domain name into their own group.\n\
    \nTo start, the data set is identified and then the regexp.MustCompile() function\
    \ is used to define the pattern. The pattern uses the \\w+ syntax to match one\
    \ or more word characters on either side of the dot. Then, using the dataset as\
    \ input, the regexp.Regexp.FindAllStringSubmatch() method is called to return\
    \ a two-dimensional slice, where the first slice value is the entire set of matches\
    \ and each consecutive value is the respective matched group. A -1 is used as\
    \ an input to the regexp.Regexp.FindAllStringSubmatch() method which signifies\
    \ unlimited matches; otherwise, a positive number could have been set to limit\
    \ the result.\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"regexp\"\n\
    )\n\nfunc main() {\n    data := `# host.domain.tld #`\n\n    pattern := regexp.MustCompile(\n\
    \        `\\(\\\\w+).(\\\\w+).(\\\\w+)`)\n\n    groups := pattern.FindAllStringSubmatch(\n\
    \        data, -1)\n\n    fmt.Printf(\"\\n%q\\n\", groups)\n    fmt.Printf(\"\
    groups[0][0]: %s\\n\", groups[0][0])\n    fmt.Printf(\"groups[0][1]: %s\\n\",\
    \ groups[0][1])\n    fmt.Printf(\"groups[0][2]: %s\\n\", groups[0][2])\n    fmt.Printf(\"\
    groups[0][3]: %s\\n\", groups[0][3])\n}\n```\n\nThe output below first demonstrates\
    \ the entire match, followed by each individual group.\n\n```\n[[\"host.domain.tld\"\
    \ \"host\" \"domain\" \"tld\"]]\ngroups[0][0]: host.domain.tld\ngroups[0][1]:\
    \ host\ngroups[0][2]: domain\ngroups[0][3]: tld\n```\n\n## Chapter 8.3: Named\
    \ Capture Groups\n\nWhen a regular expression becomes complicated, it is helpful\
    \ to document and reference the purpose of each capture group by name. Since group\
    \ names and positions are fixed, they can be referenced using the regexp.Regexp.SubexpNames()\
    \ method. The group index within the slice matches the corresponding index in\
    \ the slice that is returned by the regexp.Regexp.FindStringSubmatch() method,\
    \ which is then used to build a map as demonstrated in the example below.\n\n\
    This example first identifies the data set and then uses the regexp.MustCompile()\
    \ function to define the pattern. The pattern uses the \\w+ syntax to match one\
    \ or more word characters on either side of the dot. Since named capture groups\
    \ are used, each pattern is defined with the (?P<name>re) syntax, where name is\
    \ the capture group name. Then, using the dataset as input, the regexp.Regexp.FindStringSubmatch()\
    \ method is called to return a slice, where the first slice value is the leftmost\
    \ match. Next, a map is created to hold the result and then the slice that is\
    \ returned from the regexp.Regexp.SubexpNames() method is looped over, which returns\
    \ each name of the parenthesized subexpressions. As each name is iterated over,\
    \ the subexpression name is checked to ensure it is not empty. If the name is\
    \ valid, the map entry is created using the name as the key and the corresponding\
    \ submatch index value as the value, before finally printing the new map.\n\n\
    ```go\npackage main\n\nimport (\n  \"fmt\"\n  \"regexp\"\n)\n\nfunc main() {\n\
    \  dat := `# host.domain.tld #`\n  pat := regexp.MustCompile(\n\t`(?P<third>\\\
    w+).(?P<sec>\\w+).(?P<first>\\w+)`)\n\n  mch := pat.FindStringSubmatch(dat)\n\n\
    \  res := make(map[string]string)\n\n  for i, name := range pat.SubexpNames()\
    \ {\n\tif i != 0 && name != \"\" {\n\t\t\tres[name] = mch[i]\n\t}\n  }\n\n  ff\
    \ := fmt.Printf\n  ff(\"\\n%\\n\", res)\n  ff(\"res[\\\"first\\\"]: %s\\n\", res[\"\
    first\"])\n  ff(\"res[\\\"sec\\\"]: %s\\n\", res[\"sec\"])\n  ff(\"res[\\\"third\\\
    \"]: %s\\n\", res[\"third\"])\n}\n```\n\nThe output below first demonstrates the\
    \ entire match, followed by each value that is referenced by the named match key\
    \ in the result map.\n\n```\nmap[\"third\":\"host\" \"sec\":\"domain\" \"first\"\
    :\"tld\"]\nresult[\"first\"]: tld\nresult[\"sec\"]: domain\nresult[\"third\"]:\
    \ host\n```\n\n## Chapter 8.4: Template Expansion\n\nTemplate expansion captures\
    \ regular expression pattern matches and expands them into a string template.\
    \ This example demonstrates template expansion by using the regexp.Regexp.ExpandString()\
    \ method to take a group of matches from the regular expression and expand them\
    \ into the template.\n\nTo begin the example, the data set is identified as the\
    \ source and then the regexp.MustCompile() function is used to define the pattern.\
    \ The pattern uses the \\w+ syntax to match one or more word characters on either\
    \ side of the dot. Next, the string template is defined. It takes the named match\
    \ as a variable by prefixing it with a dollar sign. Then, each matched line is\
    \ looped over and returned from the regexp.Regexp.FindAllStringSubmatchIndex()\
    \ method. Each match is then expanded into the template by using the regexp.Regexp.ExpandString()\
    \ method to produce the output.\n\n```go\npackage main\n\nimport (\n    \"fmt\"\
    \n    \"regexp\"\n)\n\nfunc main() {\n    src := `\nhost1.domain.tld some text\n\
    host2.domain.tld more text\n`\n\n    re := regexp.MustCompile(\n        `(?m)(?P<thir>\\\
    w+).(?P<sec>\\w+).(?P<fir>\\w+)\\s(?P<text>.*?)$`)\n\n    tpl := \"$thir.$sec.$fir.\\\
    tIN\\tTXT\\t\\\"$text\\\"\\n\"\n```\n"
  mdcn: "\n## 第 7.6 章：SRV 记录\n\n`net.LookupSRV()` 函数接受服务、协议和域名作为字符串输入。它返回一个规范名称字符串以及一个\
    \ SRV 结构体切片。SRV 结构体支持将 Target（目标）作为字符串，以及将 Port（端口）、Priority（优先级）和 Weight（权重）作为\
    \ uint16 类型。`net.LookupSRV()` 函数尝试解析该服务、协议和域名的 SRV 查询，并按优先级排序，在同一优先级内按权重进行随机化。\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\t\
    cname, srvs, _ := net.LookupSRV(\n\t\t\"xmpp-server\", \"tcp\", \"google.com\"\
    )\n\n\tfmt.Printf(\"\\ncname: %s \\n\\n\", cname)\n\n\tfor _, srv := range srvs\
    \ {\n\t\tfmt.Printf(\"%v:%v:%v:%d:%d\\n\",\n\t\t\tsrv.Target, srv.Port,\n\t\t\t\
    srv.Priority, srv.Weight)\n\t}\n}\n```\n\n下方的输出展示了 CNAME 的返回结果，随后是相应的 SRV 记录的目标、端口、优先级和权重，它们之间由冒号分隔。\n\
    \n```\ncname: _xmpp-server._tcp.google.com.\n\nxmpp-server.l.google.com.:5269:5:0\n\
    alt2.xmpp-server.l.google.com:5269:20:0\nalt1.xmpp-server.l.google.com:5269:20:0\n\
    alt3.xmpp-server.l.google.com:5269:20:0\nalt4.xmpp-server.l.google.com:5269:20:0\n\
    ```\n\n## 第 7.7 章：TXT 记录\n\n`net.LookupTXT()` 函数接受一个域名作为字符串，并返回一个包含 DNS TXT 记录列表的字符串切片。\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\t\
    txts, _ := net.LookupTXT(\"gmail.com\")\n\n\tfor _, txt := range txts {\n\t\t\
    fmt.Println(txt)\n\t}\n}\n```\n\n下面展示了 gmail.com 的单条 TXT 记录。\n\n```\nv=spf1 redirect=_spf.google.com\n\
    ```\n\n## 第 8 章：正则表达式模式匹配\n\n正则表达式模式匹配用于匹配由搜索模式定义的一系列字符。`regexp` 包利用了快速且线程安全的\
    \ RE2 正则表达式引擎。虽然它不支持回溯，但它保证了线性时间的执行效率。本章涵盖了简单匹配、匹配组、命名匹配、模板展开以及多行分割。\n\n本章将涵盖以下正则表达式模式主题：\n\
    \n- 简单匹配\n- 匹配组\n- 命名捕获组\n- 模板展开\n- 多行分隔符分割\n\n## 第 8.1 章：简单匹配\n\n简单模式匹配涵盖了对数据集应用正则表达式模式并返回结果的基本概念。在此示例中，首先识别数据集，然后使用\
    \ `regexp.MustCompile()` 函数定义模式。该模式利用 `\\w+` 语法来匹配点号两侧的一个或多个单词字符。然后，使用数据集作为输入，在模式上调用\
    \ `regexp.Regexp.FindString()` 方法以返回结果。如果需要从模式中获得多个字符串匹配，则应使用 `regexp.Regexp.FindAllString()`\
    \ 方法，该方法将返回一个切片。\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"regexp\"\n\
    )\n\nfunc main() {\n\tdata := `# host.domain.tld #`\n\tpattern := regexp.MustCompile(`\\\
    w+\\.\\w+\\.\\w+`)\n\tresult := pattern.FindString(data)\n\n\tfmt.Println(result)\n\
    }\n```\n\n下方展示了使用 `\\w+.\\w+.\\w+` 模式对数据集进行简单匹配的结果。\n\n```\nhost.domain.tld\n\
    ```\n\n## 第 8.2 章：匹配组\n\n在搜索模式中使用括号可以识别各个匹配组。子模式放置在括号内，以识别数据集中的每个独立匹配组。在此示例中，通过匹配域名的每一部分到其独立的组中来演示匹配组。\n\
    \n首先，识别数据集，然后使用 `regexp.MustCompile()` 函数定义模式。该模式使用 `\\w+` 语法来匹配点号两侧的一个或多个单词字符。然后，使用数据集作为输入，调用\
    \ `regexp.Regexp.FindAllStringSubmatch()` 方法以返回一个二维切片，其中第一个切片值是整个匹配集合，而随后的每个值分别是相应的匹配组。向\
    \ `regexp.Regexp.FindAllStringSubmatch()` 方法传入 -1 表示不限制匹配数量；否则，可以设置一个正数来限制结果。\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"regexp\"\n)\n\nfunc main()\
    \ {\n    data := `# host.domain.tld #`\n\n    pattern := regexp.MustCompile(\n\
    \        `\\(\\\\w+).(\\\\w+).(\\\\w+)`)\n\n    groups := pattern.FindAllStringSubmatch(\n\
    \        data, -1)\n\n    fmt.Printf(\"\\n%q\\n\", groups)\n    fmt.Printf(\"\
    groups[0][0]: %s\\n\", groups[0][0])\n    fmt.Printf(\"groups[0][1]: %s\\n\",\
    \ groups[0][1])\n    fmt.Printf(\"groups[0][2]: %s\\n\", groups[0][2])\n    fmt.Printf(\"\
    groups[0][3]: %s\\n\", groups[0][3])\n}\n```\n\n下方的输出首先展示了整个匹配，随后展示了各个独立组。\n\n\
    ```\n[[\"host.domain.tld\" \"host\" \"domain\" \"tld\"]]\ngroups[0][0]: host.domain.tld\n\
    groups[0][1]: host\ngroups[0][2]: domain\ngroups[0][3]: tld\n```\n\n## 第 8.3 章：命名捕获组\n\
    \n当正则表达式变得复杂时，通过名称记录和引用每个捕获组的用途是非常有帮助的。由于组名和位置是固定的，可以使用 `regexp.Regexp.SubexpNames()`\
    \ 方法引用它们。切片中的组索引与 `regexp.Regexp.FindStringSubmatch()` 方法返回的切片中的相应索引匹配，然后用于构建映射，如下面的示例所示。\n\
    \n此示例首先识别数据集，然后使用 `regexp.MustCompile()` 函数定义模式。该模式使用 `\\w+` 语法来匹配点号两侧的一个或多个单词字符。由于使用了命名捕获组，每个模式都用\
    \ `(?P<name>re)` 语法定义，其中 name 是捕获组名称。然后，使用数据集作为输入，调用 `regexp.Regexp.FindStringSubmatch()`\
    \ 方法以返回一个切片，其中第一个切片值是最左侧的匹配。接下来，创建一个映射来保存结果，然后遍历由 `regexp.Regexp.SubexpNames()`\
    \ 方法返回的切片，该方法返回每个括号子表达式的名称。在遍历每个名称时，检查子表达式名称以确保其不为空。如果名称有效，则使用该名称作为键，对应的子匹配索引值作为值来创建映射条目，最后打印出新的映射。\n\
    \n```go\npackage main\n\nimport (\n  \"fmt\"\n  \"regexp\"\n)\n\nfunc main() {\n\
    \  dat := `# host.domain.tld #`\n  pat := regexp.MustCompile(\n\t`(?P<third>\\\
    w+).(?P<sec>\\w+).(?P<first>\\w+)`)\n\n  mch := pat.FindStringSubmatch(dat)\n\n\
    \  res := make(map[string]string)\n\n  for i, name := range pat.SubexpNames()\
