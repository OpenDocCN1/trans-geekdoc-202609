    # ## Chapter 6.1: Network Contains IP


    This example will define a CIDR network and slice with two IP addresses, one inside
    the CIDR network and one outside. It will loop through each IP in the slice to
    determine whether it is contained within the network.


    The example starts by using the net.ParseCIDR() function on a CIDR network address
    in string format to return a net.IPNet object. Next, it uses the net.ParseIP()
    function to return a net.IP object from the string address. Finally, the net.IP
    object is used as a parameter in the net.IPNet.Contains() method on the CIDR network
    to retrieve and print the result.


    ```

    ```go

    package main


    import (

    "fmt"

    "net"

    )


    func main() {

    netw := "1.1.1.0/24"

    ips := []string{"1.1.1.1", "2.2.2.2"}


    for _, ip := range ips {

    _, cidrnet, _ := net.ParseCIDR(netw)


    addr := net.ParseIP(ip)


    result := cidrnet.Contains(addr)


    fmt.Printf("%s contains %s: %t \"\n",

    cidrnet, addr, result)

    }

    }

    ```

    ```'
