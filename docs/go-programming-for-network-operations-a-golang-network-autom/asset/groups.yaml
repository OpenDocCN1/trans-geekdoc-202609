    基本模板由数据源和单个模板组成。模板继承（将在下一节中涵盖）用于组装嵌套模板。\n\n在这个示例中，使用了三个文件：一个 CSV 数据文件、一个模板文件和一个\
    \ Go 文件。下面的 CSV 数据文件表示一个 VLAN 列表，每行一个，第一列是数字，第二列是名称。模板文件将表示配置每个 VLAN 的格式。它将遍历数据文件的每一行，并按照各自的布局格式化来自这两列的数据。Go\
    \ 文件将用于将 CSV 文件和模板文件合并，然后生成输出。\n\nCSV 数据文件：\n\n```csv\n1,ONE\n2,TWO\n3,THREE\n\
    ```\n\n既然上面已经定义了 CSV 数据文件，模板文件用于定位数据。下面定义的模板文件使用 range 元素封装了中间两行。它遍历代表 CSV 数据文件中行的根元素切片结构体。在循环内，普通文本后面跟着一个用于应用结构体成员的变量。请注意下面模板文件中用于修剪名称后空格的破折号元素。\n\
