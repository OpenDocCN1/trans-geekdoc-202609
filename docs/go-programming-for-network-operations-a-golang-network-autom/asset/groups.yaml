    # # Introduction


    Go is the most exciting new mainstream programming language to appear in recent
    decades. Like modern network operations, Go has taken aim at 21st century infrastructures,
    particularly in the cloud. This book illustrates how to apply Go programming to
    network operations. The topics cover common use cases through examples that are
    designed to act as a guide and serve as a reference.


    The reader is assumed to have already gained a fundamental understanding of Go
    programming; however, the examples are explained for additional clarification.
    The focus is on using Go for network operations, not on the language itself. This
    book''s approach is practical; readers are encouraged to experiment with the examples
    and piece together their own programs to gain hands-on experience.


    The examples in this book are designed for e-book format. They are short and concise,
    while maintaining enough content to run and illustrate the point. While error
    handling is omitted for brevity, it is always recommended to include it, along
    with other best practices, when developing production code.


    # # Why Go for Network Operations?


    The Go programming language is a modern language released in 2009 by an internal
    team at Google. As an engineered language (rather than something that evolved
    over time), Go comes with several key advantages. It uses a'
  - '[PAGE 5]


    clean and easy-to-understand syntax that avoids the complexity of other

    languages, such as C++. It is statically typed, yet efficient by supporting short

    variable declaration, interfaces, and structural typing.


    Another key advantage is built-in concurrency at the core of the language.

    The Go concurrency model is simple and effective by leveraging goroutines

    and channels, rather than less efficient threads. Concurrency is native to the

    language and scales efficiently as the number of CPU cores increase.


    Go is lightweight and fast. It is directly compiled to binary rather than

    depending on an interpreter. This unlocks the performance of running directly

    on the underlying hardware, while reducing the overhead through its inherent

    garbage collection. Compilation is fast; therefore, it is practical to use in

    situations where interpreted languages are normally used. It conveniently

    compiles to a single binary file and can cross-compile for several operating

    systems and architectures, including MacOS, Linux, Windows, and BSD.


    The rise in popularity and adoption in Go clearly demonstrates its benefit in

    the real world of IT. The next-generation features that are engineered into the

    language from the beginning can increase confidence when relying on it for

    production use. As networks continue to evolve and companies look more at

    programmability and automation to address new challenges, network

    operations must remain agile using a modern set of tools.'
