    \ file and directory topics:\n\n- Opening and closing\n- Adding and removing\n\
    - Getting information\n- Listing directory contents\n- Walking a file and directory\
    \ tree\n\n## Chapter 1.1: Open/Close\n\nThere are two main options for opening\
