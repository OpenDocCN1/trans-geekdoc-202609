    # ## Chapter 1: File and Directory Basics


    Files and directories are a fundamental feature of most operating systems. The
    ability to manipulate and interpret them is an essential skill. This chapter focuses
    on several examples that demonstrate basic file and directory operations.


    First, this section looks at the fundamentals of opening and closing, and adding
    and removing files. Then, it covers getting attributes of files, such as size,
    permissions, ownership and modification date. Finally, the last two sections demonstrate
    listing files and directories, both in the same directory and recursively.


    This chapter will cover the following file and directory topics:


    +   - Opening and closing

    - Adding and removing

    - Getting information

    - Listing directory contents

    - Walking a file and directory tree'
  - "[PAGE 7]\n\n# ## Chapter 1.1: Open/Close\n\nThere are two main options for opening\
    \ files, the os.Open() function, that simply accepts a filename and provides a\
    \ ready-only file, and a more enhanced option, the os.OpenFile() function, which\
    \ enables more control by implementing the flags depicted in the table below.\
    \ These flags can be combined by separating them with the logical OR pipe operator.\n\
    \n| Flag | Description |\n|---|---|\n| O_RDONLY | Open the file read-only. |\n\
    | O_WRONLY | Open the file write-only. |\n| O_RDWR | Open the file read-write.\
    \ |\n| O_APPEND | Append data to the file when writing. |\n| O_CREATE | Create\
    \ a new file if none exists. |\n| O_EXCL | Used with O_CREATE. The file must not\
    \ exist. |\n| O_SYNC | Open for Synchronous I/O. |\n| O_TRUNC | If possible, truncate\
    \ the file when opened. |\n\nThe example below demonstrates the more enhanced\
    \ option by using the os.OpenFile() function to return a pointer to a value of\
    \ type os.File. The flag combination creates a write-only file if none exists,\
    \ otherwise, it appends to the file. The os.File.Write() method is then called\
    \ on the os.File object to append a byte slice to the file. Finally, the os.File.Close()\
    \ method is called on the os.File object to render the I/O unusable.\n\n```\n\
    ```\npackage main\n\nimport \"os\"\n\nfunc main() {\n    file,_ := os.OpenFile(\"\
    file.txt\",\n    os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0644)\n```\n```"
