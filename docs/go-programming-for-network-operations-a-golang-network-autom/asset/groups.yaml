    # Chapter 2.2: CSV


    Comma Separated Values (CSV) is a format often used to import, export, and store
    data. It is also commonly used to move tabular data between incompatible formats.


    The csv package supports the standard format described in RFC 4180. Each CSV file
    contains zero or more rows with one or more fields per row that adhere to the
    constraints identified below.


    +   - Blank lines are ignored.

    - White space is considered part of a field.

    - Each row is separated by a newline character.

    - Carriage returns before newline characters are removed.

    - Newlines, spaces, and commas may be included in a quoted field.

    - Quotes in quoted fields are not included unless they are quoted themselves.


    This subchapter will cover the following topics:


    +   - Reading CSV files

