    \        fmt.Println(file.Name(), file.ModTime())\n    }\n}\n```\n\n请注意，下方的输出是故意按文件名排序的。这是\
    \ ioutil.ReadDir() 函数的固有特性。\n\n```\nfile1.txt 2018-10-20 14:21:11.1 -0500 EDT\n\
    file2.txt 2018-10-20 14:22:22.1 -0500 EDT\n```\n\n## 1.5 章：遍历文件树\n\n从指定的起始点递归地遍历文件树，可用于在目录结构中查找和收集数据或修改特定文件。来自\
    \ filepath 包的 filepath.Walk() 函数启用了此功能。它接受一个根目录和一个用于处理文件和目录的函数；符号链接不会被跟踪。\n\n\
    为了演示文件树遍历，下面的示例首先通过设置一个函数作为值开始。然后，它使用 os.FileInfo 对象调用 os.FileInfo.IsDir() 方法来确定该条目是否为目录，并打印结果以及相应的路径。最后，该函数与根目录一起作为参数设置到\
    \ filepath.Walk() 函数中。在执行过程中，初始扫描函数会被 filepath.Walk() 函数访问的每个文件或目录调用。\n\n```\n\
    package main\n\nimport (\n\t\"fmt\"\n\t\"os\"\n\t\"path/filepath\"\n)\n\nfunc\
