  mdcn: "\n\n# 第 8.5 章：多行分隔符拆分\n\n多行分隔符拆分对于提取由特定模式分隔的文本行非常有用，例如配置文件中的各个部分。它可以用于实现清单管理、审计或配置管理。多行\
    \ `m` 标志使得 `^` 和 `$` 正则表达式语法能够额外匹配每一行的开头和结尾。\n\n本示例将定义好的配置拆分为一个二维切片，其中由 `!` 字符分隔的每个配置部分都由其自己的切片表示。随后，配置中的每一行将作为各自配置部分切片中的一个字符串表示。\n\
    \n首先，定义配置，然后使用 `regexp.MustCompile()` 函数中的模式作为参数，返回一个 `regexp.Regexp` 对象。接着，对该对象调用\
    \ `regexp.Regex.Split()` 方法，使用配置和 `-1` 来处理无限次匹配。该方法将配置拆分为一个单一切片，其中每个值是模式匹配之间剩余的内容。\n\
    \n在初始化二维切片后，迭代遍历从拆分配置中返回的值。最后，在循环内，使用 `strings.TrimSuffix()` 函数修剪末尾的换行符，然后按换行符分割每个字符串，返回并追加一个新切片，其中包含由分割每一行产生的值。\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"regexp\"\n    \"strings\"\
    \n)\n\nfunc main() {\n    config := `int Vlan1\n        desc v1\n! int Vlan2\n\
    \    desc v2\n`\n    a := regexp.MustCompile(\"(?m)\\n^!\\$\\n\")\n    m := a.Split(config,\
    \ -1)\n\n    arr := [][]string{}\n\n    for _, s := range m {\n        s := strings.TrimSuffix(s,\
    \ \"\\n\")\n        m := strings.Split(s, \"\\n\")\n\n        arr = append(arr,\
    \ m)\n    }\n\n    fmt.Printf(\"%q\\n\", arr)\n}\n```\n\n输出使用双引号和括号来展示结果。\n\n\
    ```\n[[\"int Vlan1\\n    desc v1\"] [\"int Vlan2\\n    desc v2\"]]\n```\n\n# 第\
    \ 9 章：外部命令\n\n执行外部命令利用了 `exec` 包来封装 `os.StartProcess` 函数，这使得重新映射终端的 `stdout` 和\
    \ `stderr` 管道变得更加容易。虽然 `exec.Command()` 函数用于外部命令时很直接，但必须小心处理终端重定向。\n\n本章通过示例展示如何合并\
    \ `stderr` 和 `stdout`，以及如何将两者分开。能够原生处理重定向选择有助于提高代码的简洁性和可读性。\n\n本章将涵盖以下外部命令主题：\n\
    \n-   合并 Stdout/Stderr\n-   分离 Stdout/Stderr\n\n## 第 9.1 章：合并 Stdout/Stderr\n\n\
    `exec` 包支持在命令执行后合并终端的标准输出和标准错误。这种合并的输出可以简化输出处理并节省几个步骤。\n\n将设置一个场景来演示，创建两个文件；一个是可写的，另一个则移除了写权限。使用\
    \ `cat` 命令，我们将读取每个文件，并期望看到来自可读文件（`r.txt`）的标准输出和来自不可读文件（`w.txt`）的标准错误。\n\n```\n\
    $ touch r.txt w.txt\n$ echo hi from r.txt > r.txt\n$ chmod a-r w.txt\n```\n\n\
    首先，命令和参数作为单独的字符串参数输入到 `exec.Command()` 函数中，该函数返回一个 `exec.Cmd` 对象。接着，调用 `exec.Cmd.CombinedOutput()`\
    \ 方法来执行命令并返回合并的标准输出和错误。最后，打印返回的字节切片。\n\n```go\npackage main\n\nimport (\n    \"\
    fmt\"\n    \"os/exec\"\n)\n\nfunc main() {\n    cmd := exec.Command(\"cat\", \"\
    r.txt\", \"w.txt\")\n    data, _ := cmd.CombinedOutput()\n\n    fmt.Printf(\"\
    %s\", data)\n}\n```\n\n请注意，输出首先显示来自可读文件（`r.txt`）的标准输出文本，然后是来自不可读文件（`w.txt`）的错误文本。\n\
