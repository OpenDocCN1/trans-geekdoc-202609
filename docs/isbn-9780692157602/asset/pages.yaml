    self-driving cars are pampered, there''s no need to deal with detecting anomalies
    automatically and having to deal with them immediately and directly.


    Here''s how procrastination comes to play.


    Suppose the human owner becomes aware that some aspect of their AI self-driving
    car has gone aﬁoul. Maybe an occupant riding in it called the owner to complain.
    Maybe the AI detected that something was amiss and texted the owner to indicate
    that the self-driving car is having a problem. What will the human owner do?


    You might assume that the human owner will promptly make sure that the AI self-driving
    car gets repaired. This would happen in the utopian world. In the real-world,
    we''re betting that the human owner is possibly going to procrastinate. If there
    are say ten cameras on the AI self-driving car, and it''s been designed to be
    able to operate with just nine, though not as good as it could with ten cameras,
    the human owner might decide to keep the AI self-driving car going and not take
    it in for repair.


    Is this safe? Maybe yes, maybe not. Will the next occupant that gets into that
    AI self-driving car even know that it is only operating with nine cameras? Possibly
    not. Should we ensure that the AI of the self- driving car warns any passengers
    about any anomalies? The owner of the self-driving car might not like that idea,
    and be worried that as a ride sharing rental that they''ll lose money if the AI
    starts to blab about what is wrong with the self-driving car.


    There aren''t any regulations that force the AI to reveal what''s going on. The
    owner likewise is not under any direct law to do so, though you could construe
    various aspects about safety and the public that'
