  md: '# CHAPTER 5

    NTSB REPORT AND

    TESLA CAR CRASH


    Based on the June 7, 2018 release of the preliminary NTSB report about the fatal
    car crash of a Tesla on March 23, 2018, I provide in today’s column an initial
    forensic analysis of the incident.


    Keep in mind that the just released NTSB report (about three days ago as of the
    writing of this) is very slim on details at this juncture of the investigation
    and so there really isn’t much in terms of facts and evidence that would allow
    for a thorough analysis. Nonetheless, it is instructive to be able to try and
    piece together the clues released to-date and see if useful insights can be gleaned.


    Faithful readers of my online columns will recall that I had done a similar forensic
    analysis of the Uber self-driving car incident that occurred in Arizona, and that
    later on, upon release of the initial report by the NTSB, it turns out that my
    predictions of what likely occurred were quite prescient. Indeed, there didn’t
    seem to be any other published news item about the incident at the time that had
    so aptly predicted what might have taken place.


    # Learning From the “Past”


    At the Cybernetic AI Self-Driving Car Institute, we are developing AI systems
    for self-driving cars. As a result, we are keenly interested in what happens in
    incidents involving self-driving cars, along with'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'wanting to provide insights for auto makers and other tech firms that are in
    the midst of developing and maintaining such AI systems.


    As per the famous quote of philosopher George Santayana: “Those who cannot remember
    the past are condemned to repeat it.” With the rapid advances taking place with
    AI self-driving cars, and with the use of our public roadways as part of a grand
    experiment to see whether self-driving cars are viable, it is especially crucial
    that we all look at every morsel of what is taking place and try to as rapidly
    as possible consider what action is most appropriate to ensure the safety of us
    all. Our collective desire as a society to have AI self-driving cars needs to
    be balanced by our collective desire to be reasonably safe on our public roadways
    too.


    For some of you, you might say that the risks of any self-driving car endangerment
    are simply the presumed calculated risk of the person that has opted to drive
    such a car. This thought is narrow thinking and does not include the proper larger
    scope. The human driver is certainly taking a risk, but so too would any occupants
    in the car that are accompanying the car with the human driver – suppose the driver
    has children in the car, are those children able to also calculate the risks involved?
    The self-driving car could ram into and injure or kill humans that are in other
    nearby cars – did they get a chance to assess and take on the risks of that self-driving
    car? Pedestrians could be injured or killed – did they have a say in accepting
    the risks of the self-driving car?


    I mention this because at some of my presentations around the country there are
    at times self-driving car pundits that stand-up and say that it should be each
    person’s own choice as to whether or not they want to drive a self-driving car,
    and that the government and anyone else should stay out of it. If the driver of
    a self-driving car was able to drive the car in a manner that was completely isolated
    from all of the rest of us, I likely would agree that it could be an informed
    personal decision to make.


    We must though keep in mind that driving on our public roadways is a societal
    interaction and therefore would seemingly be a societal decision. It is for this
    reason that driving by humans is deemed a'
  merge: -1
  img_proc: true
- pgno: 92
  md: '“privilege” and not a “right” per se. The Department of Motor Vehicles (DMV)
    in most states lays out what a human driver must do and not do, in order to retain
    the privilege to drive a car on our public roadways. There isn’t an irrevocable
    right to drive on our public roadways. It’s a revocable privilege.


    # ### Context of the Tesla Incident


    Here’s some key aspects about the Tesla incident, based on using the NTSB preliminary
    report, which noted this:


    +   * Accident Location: Mountain View , CA

    * Accident Date: 4/23/2018

    * Accident ID: HWY18FH011

    * Date Adopted: 6/7/2018

    * NTSB Number: HWY18FH011 Preliminary


    On a relatively sunny and dry day in California on Friday, March 23, 2018, in
    the morning around 9:30 a.m. PDT a Tesla Model X P100D 2017 was being driven southbound
    on the multi-lane US Highway 101 (US-101) in Mountain View and was nearing the
    interchange with the State Highway 85 (SH-85). This is a typical California type
    of interchange that involves various paths to get onto each of the two intersecting
    major highways. Drivers can choose to go from the US-101 onto the SH-85, and drivers
    that are on the SH-85 can choose to go onto the US-101. Both of these highways
    are very commonly driven and typically popular with traffic, especially on a Friday
    morning.


    Notice that I’ve mentioned some important aspects already. Was the incident occurring
    on a rainy day? No. It was sunny and the roads were dry. This is important because
    we might otherwise need to consider the weather as a factor in what occurred.
    I think it is relatively sound to assume that weather was not a factor since the
    roads were dry and it was sunny. Was it nighttime or daytime when the incident
    occurred? It was daytime, and nearing mid-morning, and so it would have been relatively
    well lit.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'I mention this because if it were say nighttime, we’d need to consider the
    impact of darkness and how it could have diminished the capability of the cameras
    used for the self-driving car.


    Were the roads involved somewhat obscure or more commonly used? Answer, they were
    commonly used. This did not occur in some back-country location. These were modern
    day highways. They are well paved and well maintained. They are multi-lane in
    shape and not single lanes. Traffic is relatively abundant on these highways.
    If it was the same time on a Sunday, I’d bet that there would have been a lot
    less traffic. Friday morning is around the time that many drivers are going to
    work and so it would have been a generally busy highway, along with generally
    busy in terms of cars trying to use the interchange to get to where they needed
    to go.


    You might wonder why I am laboring to mention these nuances. I hope that you’ll
    see the “magic” behind doing a forensic analysis. It is crucial to consider each
    piece of evidence and try to use it for putting together the puzzle. This involves
    considering what we do know, what we can use as leverage to speculate about, and
    also what we know to not be the case – for example, we know it was not snowing.
    This then rules out that somehow snow might have been a factor in the incident.
    Now, since it essentially never snows in Mountain View, I suppose you might say
    its kind of ridiculous that I point out it wasn’t snowing, but it is as important
    to point out what we can about any factors that might come to play. Not everyone
    knows that it doesn’t snow in Mountain View and it could be that some reading
    this would wonder whether say snow or rain or other conditions came to play.


    The Tesla at the time of the incident was in the High Occupancy Vehicle (HOV)
    lane, which was the second lane from the left of the median that divides the southbound
    and northbound lanes. Normally it is permitted to travel in the HOV lane when
    you have multiple occupants, while in this case there was a solo driver, but since
    the Tesla is an electric car it qualifies to go in the HOV. The human driver was
    a 38-year-old male and sadly he died as a result of the crash. There isn’t any
    detail yet in the NTSB preliminary report about the driver, but for this herein
    analysis let’s assume that he was versed in driving the Tesla,'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'and that he had likely gone this way before, and that he was familiar with
    the nature of the Tesla driving controls. We don’t know that any of this is the
    case, so please keep in mind that it is for the moment an assumption.


    The NTSB indicates they have examined “performance data downloaded from the vehicle.”
    What we don’t yet know is what this actually means. Did the Tesla have an Event
    Data Recorder (EDR)? This EDR is a so-called black box that is akin to the black
    box that are used in airplanes and helpful when determining why an airplane crashed.
    Or, did the NTSB have to get various memory dumps from other processors in the
    Tesla, and if so, which ones and what ones weren’t available perhaps due to being
    destroyed or damaged? Has the NTSB gotten access to data that would have been
    transmitted potentially to the Tesla cloud that allows for OTA (Over The Air)
    updates? We don’t yet know the depth and extent of the data that the NTSB has
    collected or intends to collect.


    # The Crash Itself


    The NTSB report indicates that the Tesla was going at about 71 miles per hour
    when it struck the tail-end of a concrete median that had a “crash attenuator”
    as an additional barrier at its leading edge. You’ve probably seen these attenuators
    before and yet didn’t know they had a name. It is a special kind of barrier that
    is setup to help try and “soften” the blow of a car that crashes into the finger-point
    of a concrete median. Years ago, traffic studies showed that when cars hit directly
    a concrete median at the edge point, it pretty much is like slicing bread with
    a knife. Thus, the thought was to put something at the edge that would dampen
    the blow. In some cases, you’ll see those bright yellow barrels that are filled
    with sand or sometimes water. The attenuator used in this instance is specially
    built for the purpose of sitting at the edge and taking the blow of a car, along
    with trying to warn a car to not hit it, doing so by having yellow and black markings
    to visibly suggest don’t hit it.


    What’s an interesting added twist is that the NTSB report says that the attenuator
    had been previously damaged. It would be helpful if the NTSB could say more about
    this. Was the attenuator so damaged that'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'it could no longer perform as intended? Suppose it was damaged to the extent
    that it could no longer soften the blow of a crash, or maybe could only do so
    to the degree of say 50%? This is important to know as part of whether or not
    the crash might have led to survivability or not. Also, was the painted or marked
    aspect of the attenuator still visible and fully presented, or was it damaged
    such that the attenuator was no longer sufficiently able to suggest the don''t
    hit me indication?


    This could be crucial for both human drivers as to whether they could discern
    that it was a crash-warning attenuator, and in this case perhaps even more so
    crucial since the question is whether the Tesla cameras and vision processing
    could discern it.


    I mention this aspect since by-and-large humans are generally able to visually
    figure out when they see an attenuator that is indeed an attenuator, and humans
    have the “common sense” that it is there to safe lives and that if you are driving
    toward it you are likely making a big mistake because it is there when behind
    it is something fierce like a concrete median. Did the camera of the Tesla capture
    images of the attenuator? Did the AI system examine the images and detect that
    within the image was an attenuator? We don''t yet know, since the NTSB report
    doesn''t say anything about this.


    It is possible that the Tesla AI system has used machine learning to try and determine
    what attenuators look like. This can be done via the use of artificial neural
    networks that are trained on thousands and thousands of images of attenuators.
    Generally, one would like to assume that the Tesla AI has been trained sufficiently
    to recognize an attenuator, but suppose that this one was damaged in such a way
    that it no longer well-matched the training images? It is conceivable that the
    AI system did not thusly categorize the attenuator as an attenuator, and might
    have classified it as some unknown object, if it detected it at all.


    Something else about that damaged attenuator is worth mentioning. According to
    the NTSB report, the attenuator was damaged on March 12, 2018 by a crash involving
    a Toyota Prius 2010. The attenuator, which the NTSB report says was an SCI smart
    cushion attenuator system, one might ask why it had not been repaired as yet?
    The Tesla'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'incident happened on March 23, 2018. That’s about 11 days or nearly two weeks
    since it was first damaged on March 12, 2018. Was it scheduled to be repaired
    or replaced? Again, we don’t know that it would have made a difference, but it
    would be something that the NTSB will hopefully report on.


    The NTSB report does not indicate what kind of sensors were used on this particular
    Tesla Model X. It would be crucial for the NTSB to indicate what sensors were
    used, and also whether it was known as to whether or not the sensors were in working
    order at the time leading up to the crash. We don’t yet know.


    I am going to guess that it might have had these sensors (please don’t hold me
    to this, it is just an educated guess based on what normally would be included):


    +   - Rearward Looking Side Cameras: 100 meters (about 328 feet)

    - Wide Forward Camera: 60 meters (about 197 feet)

    - Main Forward Camera: 150 meters (about 492 feet)

    - Narrow Forward Camera: 250 meters (about 820 feet)

    - Rear View Camera: 50 meters (about 164 feet)

    - Ultrasonic: 8 meters (about 26 feet)

    - Forward Looking Side Camera: 80 meters (about 262 feet)

    - Radar: 160 meters (about 524 feet)


    I’ve also indicated the typical ranges of the considered maximum detection for
    each of those devices. This is important to know since the analysis of a crash
    involves determining how many feet or meters away could the AI system have potentially
    detected something. In the case of the Uber incident in Arizona, I had used the
    reported speed of the car to then try to ascertain how far in-advance of the crash
    could the AI have potentially detected the object in the roadway (it was a pedestrian
    walking a bicycle). Knowing the type of sensors and their detection ranges is
    vital to such an analysis.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# # The Counterclockwise Spin


    Per the NTSB report for the Mountain View incident, the report says that the Tesla
    struck the attenuator while going 71 mile per hour, and then the impact “rotated
    the Tesla counterclockwise” and ultimately “caused a separation of the front portion
    of the vehicle.” I think we can all agree that hitting something like the attenuator
    at a speed of 71 miles per hour is going to exert a tremendous amount of force
    and it certainly seems to have been the case since it caused the front of the
    Tesla to become separated. It was a hard hit. I don''t think anyone can dispute
    that.


    What’s interesting is the notion that the Tesla spun counterclockwise. I''ve not
    yet seen anyone comment about this aspect. I''ll speculate about it. If the Tesla
    had hit the attenuator fully head-on, we would need to study the physics of the
    result, but it generally might not have led to a spin of the Tesla. More than
    likely, the Tesla probably hit at a front-edge of the car, such as toward the
    left side of the front edge or to the right of the front edge. This would be more
    likely to generate a spinning action after the impact. Since the Tesla apparently
    spun counterclockwise, we''ll assume for the moment that it hit at the left side
    edge of the front of the Tesla, which then jammed the left side against the attenuator,
    and the right side of the Tesla continued forward which caused it to pivot from
    the leftside, making it go counterclockwise. This is all speculation and we''ll
    need to see what the NTSB has to say about it.


    I''ll explain in a moment why I think this counterclockwise spinning is a useful
    clue.


    # ## Aftermath of the Crash


    After having crashed and spun, the Tesla was involved in subsequent collisions
    involving two other cars that were presumably driving southbound and got inadvertently
    caught up in the incident. I''ll assume for now that those additional crashes
    had nothing to do with the initial crash per se, and were just part of the aftermath.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'I am saddened that those subsequent crashes occurred, and it also serves as
    a reminder about my earlier remarks that incidents involving self-driving cars
    aren''t necessarily confined to impacting just the driver but can also include
    other innocents that get caught up in the cascading impacts. According to the
    NTSB report, one of those other drivers suffered minor injuries, and the other
    was uninjured. I''d say that''s nearly a miracle. No matter what led to the initial
    crash, any aftermath can often be horrific.


    The NTSB report further mentions that the 400-volt lithium-ion high-voltage battery
    in the Tesla caught fire as it was breached during the incident, and a post-crash
    fire ensued (these can be intense fires; the fire department arrived and was able
    to put out the fire). It is uplifting to note that the NTSB report essentially
    suggests that bystanders got out of their cars and came to the rescue of the driver
    in the Tesla, bravely removing him from the vehicle, in spite of the dangers of
    the fire. The NTSB report indicates that the Tesla driver was transported to a
    hospital but died there from his injuries. In any case, I applaud those brave
    souls that rescued him from the crash.


    # ## Layout of the Crash Scene


    The NTSB preliminary report does not depict a layout of the crash scene. I''ve
    used Google Maps to try and see if I can figure out what the crash scene was like.
    This is admittedly speculation. The final NTSB report should officially describe
    the crash scene and will be usually based on photos taken at the time and physical
    evidence at the crash scene, as per the investigative team that inspected the
    location.


    Based on what I can discern, it appears that the crash occurred at the split of
