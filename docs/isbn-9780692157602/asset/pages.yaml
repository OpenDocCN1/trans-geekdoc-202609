  md: '# CHAPTER 4


    # PROCRASTINATION

    AND

    SELF-DRIVING CARS


    Procrastination. Procrastinator. As the old joke goes, when someone asks you what
    the word procrastination means, you are supposed to say “I’ll get back to you
    about that.”


    I’m sure we’ve all felt like a procrastinator at one time or another. Often considered
    a negative aspect of human behavior, some liken procrastination with being lazy,
    careless, and otherwise less desirable than being prompt and proactive.


    We might though be somewhat making a false generalization about procrastination.
    Does being a procrastinator always have to be bad? It is said that prolific and
    ingenious inventor and artist Leonardo da Vinci was known for dragging out the
    works he owed his patrons and often taking nearly forever to get done what he
    had been obligated to produce. Charles Darwin had acknowledged that he often put
    off things that he was supposed to do or wanted to do. Few realize that he took
    years to write his acclaimed “On the Origin of Species” and was at times using
    his time to instead study barnacles. If these greats had bouts with procrastination,
    can it really be that bad a thing?


    If you find yourself falling into the procrastination trap and don’t want to be
    a procrastinator, you can always call upon Saint Expedite. For those of you have
    been to New Orleans, or have certain religious interests, you likely know that
    Saint Expedite is considered'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'the patron for those that want to avert being a procrastinator, and you can
    ask for his assistance in finding rapid solutions to nagging problems. I suppose
    too, there are some that say you just need to kick yourself in the you-know-where,
    but anyway it can be hard to stop the urge to procrastinate however you try to
    prevent it.


    Psychologically, it is theorized that people often procrastinate because they
    fear the act of doing something that might fail. As such, in order to avoid failure,
    they postpone it. Presumably, by not trying, you convince yourself that you are
    better off. You might even use trivial items to help yourself be a procrastinator.
    Should I go to the dentist, or maybe instead I need to wash my socks and clean
    the latrine? One might think that dealing with the health of your teeth would
    be a high priority in comparison to those other tasks. It’s amazing how we can
    allow seemingly low-priority items to aid us in avoiding dealing with meatier
    issues or topics.


    For some people, they are an occasional procrastinator. Perhaps most of the time
    they get things done on a timely basis. A particular situation might cause them
    to go into a procrastination mode. A personal example is that the other day my
    car dashboard lit up with an indicator that my low-beam left headlight bulb was
    burnt out. I probably should have taken my car right away to have the lamp replaced.
    Instead, I sheepishly admit that for several weeks I drove at night with the high-beams
    on, rather than the low beams, so that I’d have both headlamps working. I truly
    meant to go over to have the headlight replaced, but seemed to let other matters
    take higher priority.


    Sometimes a procrastination can have potentially dangerous consequences. You could
    say that my example about driving around with my high-beams on, rather than using
    my low beams, made my driving circumstances a bit less safe. Not much less, I’d
    argue, but certainly a little bit. On the other hand, shortly after I had the
    left headlight replaced, a few days later my left rear brake light suddenly went
    out. It was a Murphy’s Law kind of curse because had it gone out just a few days
    earlier, I could have had it replaced at the same time as the headlight. But,
    no, it had to wait and then force me to make a second trip to the car repair shop.
