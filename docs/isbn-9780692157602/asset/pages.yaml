  md: 'will be unlikely to rise to the same pinnacle.


    Even if we could get the housing to be the same, what about the contents?


    Indeed, there is belief that the human brain is more than just a bucket of neurons
    and connections. There is perhaps some kind of pre-wiring and pre-setup that makes
    this collection of Lego’s into something special that can ultimately showcase
    intelligence. If that’s the case, we need to somehow get our artificial version
    to become more like that. Or, we can hope that perhaps there is more than one
    way to skin a cat, meaning that maybe we can achieve intelligence but do so via
    some other means than the approach that we are aware of today (the wetware brain).


    Are we though maybe trapped already in our ways?


    For the artificial neural networks of today, we need to present them with sometimes
    millions of data instances to get them to pattern onto something. Want to be able
    to find cats in photos, first run millions of cat photos into the neural network
    for training purposes. You might then get a good “cat” image detector. But, it
    is possible that with just a few pixel changes, you could present to the trained
    neural network an image that does contain a cat, and for which a human would detect
    it, but for which the neural network might not.


    Neural networks as we know them so far are brittle. They also require an immense
    amount of training data samples. They are very narrow in their focus.


    Does a small child need to look at millions of cat images to figure out what a
    cat looks like? Don’t think so. How does a small child know what a cat looks like,
    if they haven’t seen millions or even thousands of cats to pattern after? Somehow,
    the small child accomplishes such a feat. No one knows how.


    There has been a long time assumption that the human brain when a baby is first
    born contains nothing much in it. It is pretty much devoid of what we consider
    knowledge. Then, as the baby encounters'
