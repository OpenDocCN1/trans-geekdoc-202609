    # AI Self-Driving Cars Reboot


    What does this have to do with AI self-driving cars?


    At the Cybernetic AI Self-Driving Car Institute, we are pursuing both the conventional
    approach towards developing AI self-driving cars, and we are simultaneously pursuing
    the “outlier” notion that the only way we might really get to a true AI self-driving
    car is by a more radical approach to doing so.


    Let’s suppose that all the auto makers and tech firms that are trying to create
    AI to achieve true Level 5 self-driving cars are not quite able to achieve it.
    We all keep pushing the existing approaches of machine learning as we know it
    today, we keep putting in faster and faster processors, and yet we don’t get to
    the true Level 5. A true Level 5 is a self-driving car that can do whatever driving
    that a human can do, and not need any human intervention.


    Maybe we get to a Level 5 self-driving car that’s pretty good, and seems to cover
    most of what a human driver can do, but not really all that a human driver can
    do. All of us reach a point of not getting any further. We end-up with self-driving
    cars that can handle say 95% of the driving task, and there’s still that 5% leftover.
    Upon realizing that we can’t get that last 5%, we all agree that AI self-driving
    cars need to be separated into their own lanes and be treated like a theme park
    ride, or take other protective measures.


    As an overall framework, an AI self-driving car involves these major aspects:


    +   *   Sensor Data Collection

    *   Sensor Fusion

    *   Virtual World Model

    *   AI Action Plan Updating

    *   Car Controls Commands'
