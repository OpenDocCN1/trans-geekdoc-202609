    # The Case of Tesla’s Marketing and Advertising


    Recently, a letter was submitted to the Federal Trade Commission by a consumer
    watchdog group that asserts that Tesla is doing essentially what I’ve described
    about the scooter rentals. Tesla is accused of deceptive and misleading statements
    and actions, all of which are contributing to Tesla drivers potentially becoming
    endangered, and now there are some actual cases involving Tesla related driving
    deaths that are claimed to support this notion.


    It has been pointed out that the web site touting the Tesla Autopilot indicates
    that the Tesla car says this rather prominently “Full Self- Driving Hardware on
    All Cars,” and that there is video that begins with this emboldened message shown
    on the screen (shown in all caps on the video): “THE PERSON IN THE DRIVER’S SEAT
    IS ONLY THERE FOR LEGAL REASONS. HE IS NOT DOING ANYTHING. THE CAR IS DRIVING
    ITSELF.”


    What impression do you get from those aspects?


    Do you believe that the self-driving car can drive the car without human intervention?
    For those of you that are AI developers and know about AI self-driving cars, you’d
    for sure be saying that of course you know that the Autopilot doesn’t truly drive
    the car without any human intervention. But, what about the average consumer?
    What impression would they get?'
