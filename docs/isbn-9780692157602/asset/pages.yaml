  md: '# CHAPTER 12

    REVERSE ENGINEERING

    AND SELF-DRIVING CARS


    At an annual auto show there was a Tesla Model 3 chassis shown on the convention
    floor, being displayed by a company other than Tesla. Notice that I said it was
    just the chassis, and not the entire car. You might be wondering why would somebody
    be showing off a Tesla Model 3 chassis? Did they lose the rest of the car? Or,
    did they somehow surgically remove the chassis from the rest of the car? It might
    seem odd that they weren’t showing the entire car.


    Answer: Reverse engineering.


    It is a well-known secret in the auto industry that the auto makers are desirous
    of knowing every tiny detail about their competitor’s cars. To find out the details
    usually involves taking apart an entire car, piece by piece, bolt by bolt. Some
    of the auto makers have their own inside teams that will buy a competitor’s car
    and take it apart. Other auto makers will pay an outside company to do the same.
    There are companies that specialize in doing reverse engineering on cars. They
    delight in buying the latest model of any car, and meticulously taking it apart
    like so many Lego blocks.


    More than being a delight, these reverse engineering firms can make some good
    bucks by their efforts. They will sell to other auto makers what they find out
    about their competitor’s cars. You get a full documented list of every item that
    went into the car, along with useful added aspects like how much each component
    likely costs. Furthermore, they can estimate how much it cost to assemble the
    parts'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'and give another auto maker insight into what kind of assembly effort their
    competition is using.


    An auto maker will even at times pay to get the same insights about their own
    cars! I know it seems odd, since you would assume that an auto maker would already
    know how they assemble their own cars and what it costs, but it can be very handy
    to see the estimates made by the third party. The third party might be high or
    low, or otherwise not so exacting. It is also handy to know what they are telling
    your competitors. Plus, you can then have them do a comparison for you to the
    parts and costs associated with your competitors versus your cars.


    The company at the auto show was touting the aspect that they had taken apart
    the Tesla Model 3 and could tell you whatever you wanted to know about the car.
    They can tell you the weight of each part. They can tell you the size of each
    part. They can tell you the cost. They can tell you how capable the part is. They
    can tell you where the part was made as in the U.S or overseas. In many cases
    they can even tell you what the composition of the part is, such as percentages
    of metal versus other elements.


    To give you a sense of the magnitude of this cataloging of a car, a rule-of-thumb
    is that a typical everyday car might have 50,000 or more parts, and it might require
    something like 200,000 distinct manufacturing steps. Just imagine that if you
    were designing a new car, it would be handy to learn from the other cars on the
    marketplace. Maybe try to use the carburetors that are found on a Brand X Model
    Y and the mufflers that are on a Brand Z Model Q. If you are an auto maker, you
    might also discover that you are overpaying for your own carburetor and realize
    that to reduce costs and ultimately reduce the price that you charge for your
    car that you ought to switch.


    There''s an added twist to this reverse engineering effort. In theory, if you
    are careful as you take apart a car, you can also scan the parts into a CAD system
    and essentially reverse engineering the entire design of the car. With today''s
    powerful CAD systems, you can then view the car from any angle and dive into and
    zoom in and out of the whole design of the car.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Some really sophisticated CAD systems will allow you to pump the design into
    a simulator program. This could allow you to potentially act as though the car
    exists and see how it runs. In a video game kind of way, you can possibly “drive”
    the car and see how it handles. You can simulate what the gas mileage will be
    like and examine other facets of the car.


    What does all of this have to do with AI self-driving cars?


    At the Cybernetic AI Self-Driving Car Institute, we are developing AI systems
    for self-driving cars. You might find of keen interest that the same industry
    wide pursuit of reverse engineering of conventional cars is now underway for AI
    self-driving cars too.


    Let’s consider first the physical elements of an AI self-driving car.


    There are five key stages to the processing aspects of an AI self-driving car:


    +   - Sensor data collection and interpretation

    - Sensor fusion

    - Virtual world model updating

    - AI action plan updating

    - Car commands controls issuance


    The most prominent physical aspects of an AI self-driving car are the sensors.
    There are a multitude of sensors on an AI self-driving car, including radar sensors,
    sonic sensors, cameras, LIDAR, IMU’s, and other sensors.


    Each auto maker and tech firm is keenly interested in knowing which sensors the
    other companies are using in their AI self-driving cars. It’s a somewhat free-for-all
    right now in that there is no dominant supplier per se. Indeed, the various companies
    that make sensors suitable for AI self-driving cars are in a fierce fight over
    trying to gain traction for their sensors.


    This makes a lot of sense when you realize that today there are 200 million conventional
    cars in the United States alone – so assume'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'that those will ultimately become obsolete and be replaced with an equal number
    or greater of AI self-driving cars. You’d want your sensors to be the first-choice
    for those hundreds of millions of new cars. Plus, you would guess that anyone
    that grabs the United States market will be very likely to become the global supplier
    too. Big markets, big bucks to be had.


    Not only is it useful to know which sensors are being used, but it is also valuable
    to know where they are placed within the AI self-driving car. The design of a
    self-driving car is still being figured out. How can you best embed these sensors
    in the car? You want the sensors to be free of obstruction. You also want them
    to be less vulnerable to the elements. At the same time, they have to look stylishly
    placed.


    The early versions of LIDAR were large and looked like some strange beanie cap
    on the top of the car. It stood out. Some thought it looked cool, but most thought
    it looked kind of dorky. The LIDAR devices are getting smaller in size, better
    in performance, and coming down in cost. This allows for placing it in a manner
    that it does not seem so visually awkward. It still though needs to be able to
    freely emit the light beams and so it cannot be buried inside some other aspect
    of the car.


    So, knowing what sensors your competitor is using and how they are placing them
    into or onto the body of the self-driving car is important insider information.
    If your competitor does a better job than you, it might cause consumers or businesses
    to want to buy their AI self-driving car rather than your AI self-driving car.
    It might seem shallow to AI developers to think that someone will choose an AI
    self-driving car by how it looks, versus by what it does in terms of the AI capabilities,
    but I assure you that the average buyer is going to be focused more on looks than
    what the self-driving car AI can actually achieve, all else being seemingly equal.


    In addition to the sensors, you would also want to know what kinds of microprocessors
    are being used. Once again, there is a battle royale going on in this realm. Imagine
    that an AI self-driving car might end-up with dozens upon dozens of microprocessors,
    maybe in the'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'hundreds. Multiply that number by the 200 million cars in the United States
    in terms of ultimately replacing those cars with AI self-driving cars. It’s going
    to be a huge bonanza for the chip makers.


    Indeed, there are chip makers that are now producing and striving to further advance
    specialized chips for AI self-driving cars. They hope to get into the early AI
    self-driving cars and become the de facto standard. It’s like the early days of
    Beta versus VHS. Which will prevail? If you can get rooted into the marketplace,
