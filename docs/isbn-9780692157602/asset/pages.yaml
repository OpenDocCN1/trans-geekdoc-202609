  img_proc: true
- pgno: 119
  md: 'In terms of sensor data collection, this appears to be a principally physical
    kind of perception task. It might be likened to the human sensory capabilities.
    There is though mental processing involved when we humans see things with our
    eyes and hear sounds with our ears. Thus, mental processing comes to play even
    in something that otherwise seems like a straightforward peripheral device kind
    of way. Does a baby come with a brain that has already been pre-wired to best
    make use of the peripheral devices and also integrate this into the rest of the
    mental processing of thinking?


    For most of the AI self-driving cars to-date, the sensory devices don''t do much
    beyond collecting raw data and at times doing some minimal activities such as
    compression or transformations. When sensor fusion happens, the data collected
    from the myriad of sensors needs to be compared to each other and used to create
    some kind of unified indication about what is going on in the world external to
    the self-driving car. This is then fed into a virtual world model that is keeping
    track of where the self-driving car is, where it is trying to go, and other facets.
    The AI action plans are then updated or devised, and ultimately the AI instructs
    the self-driving car to take some form of action.


    If you take a teenager and try to teach them to drive, do they require thousands
    upon thousands of driving journeys to figure out how to drive a car? Nope. They
    can often readily mentally grasp the nature of the driving task, and it becomes
    more of an effort to coordinate their body to the driving task and less so the
    mental aspects of the driving task.


