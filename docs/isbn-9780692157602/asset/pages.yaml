  md: '# # GUIDE TO USING THE CHAPTERS


    For each of the chapters, I provide next some various ways to use the chapter
    material. You can assign the tasks as individual homework assignments, or the
    tasks can be used with team projects for the class. You can easily layout a series
    of assignments, such as indicating that the students are to do item “a” below
    for say Chapter 1, then “b” for the next chapter of the book, and so on.


    a) What is the main point of the chapter and describe in your own words the significance
    of the topic,


    b) Identify at least two aspects in the chapter that you agree with, and support
    your concurrence by providing at least one other outside researched item as support;
    make sure to explain your basis for disagreeing with the aspects,


    c) Identify at least two aspects in the chapter that you disagree with, and support
    your disagreement by providing at least one other outside researched item as support;
    make sure to explain your basis for disagreeing with the aspects,


    d) Find an aspect that was not covered in the chapter, doing so by conducting
    outside research, and then explain how that aspect ties into the chapter and what
    significance it brings to the topic,


    e) Interview a specialist in industry about the topic of the chapter, collect
    from them their thoughts and opinions, and readdress the chapter by citing your
    source and how they compared and contrasted to the material,


    f) Interview a relevant academic professor or researcher in a college or university
    about the topic of the chapter, collect from them their thoughts and opinions,
    and readdress the chapter by citing your source and how they compared and contrasted
    to the material,


    g) Try to update a chapter by finding out the latest on the topic, and ascertain
    whether the issue or topic has now been solved or whether it is still being addressed,
    explain what you come up with.


    The above are all ways in which you can get the students of your class'
