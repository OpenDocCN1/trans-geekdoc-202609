- pgno: 44
  md: 'It is contended that most people would think that the Tesla Autopilot is a
    true Level 5 self-driving car, which is the level at which an AI self-driving
    car is driven by the AI and there is no human assistance needed. Indeed, many
    auto makers and tech firms that are aiming toward Level 5 self-driving cars are
    making them so that there aren’t any driver controls in them at all, at least
    none for humans to use. The notion is that the AI is the driver of the car. There
    is no human driving.


    Tesla’s Autopilot is currently considered somewhere around a Level 2 or Level
    3. It absolutely requires that a human driver be present, and that the human driver
    be ready to take over control of the car. It is not in that sense a true self-driving
    car (i.e., it is not a Level 5). And yet, some would say that the manner in which
    Tesla is marketing and promoting the car would tend to mislead consumers into
    believing that it is a true self-driving car.


    Another common complaint about Tesla’s approach is that they have “cleverly” named
    their AI system to be called Autopilot. What impression do you have of the word
    “autopilot” in general?


    For most people, they tend to think of an airplane autopilot, of which, they assume
    that it means that an airplane can be flown without the need for a human pilot
    to intervene. We’ve all seen TV shows and movies wherein the human pilot turns
    on the autopilot, and then reads the newspaper or maybe even falls asleep. That’s
    the general notion that people seem to have about the word autopilot. Does then
    the naming of the Tesla Autopilot also contribute to deceiving people into believing
    that the AI of the Tesla at this stage of capability is more capable than it really
    is?


    Meanwhile, the deadly Tesla driving incidents of May 2016 and March 2018 have
    been assessed so far as occurring as a result of the human driver failing to do
    their part in terms of driving the car, and for which it is then been stated by
    the NTSB in the May 2016 case that the human driver had a “pattern of use of the
    Autopilot system indicated an over-reliance on the automation and a lack of understanding
    of the system limitations.”'
