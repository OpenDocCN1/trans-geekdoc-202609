- pgno: 61
  md: 'the driving task. This eliminates all of the above human frailties and issues
    of design and development related to getting the human and the automation to work
    together in a coordinated and blissful manner.


    There’s also the aspect that having AI that can fully drive a car without human
    intervention is a much more challenging technical aspect, since you presumably
    need to make the AI so good that it can drive like humans can. When you have a
    self-driving car that has a co-shared responsibility, you can always lean on the
    human to make up the slack for whatever you could not get the AI to be able to
    do. Some see this as a half-baked technical solution.


    For those auto makers and tech firms in the middle ground, above the low-tech
    conventional car and not yet at the true Level 5, it’s going to be ugly times
    for all.


    Those that naively think that they can just push technology out the door and expect
    humans to play along, well, perhaps the scooter wars are a good lesson. You can
    make seemingly wonderful technology, but those darned humans are not going to
    abide by what you want them to do. Is this then an excuse for you? I don’t think
    so. I assert that making a better mousetrap means more than just the technology
    itself, and that you have to take into account the nature of humans, else in the
    end it’s going to be a deathtrap. AI self-driving cars are a serious innovation
    and I hope it’s not going to get undermined, perhaps inadvertently in the rush
    to get it onto our streets and yet in the end produce untoward results that will
    kill the golden goose for all of us, society included.'
