  md: "- **Mental distractions**  \nWhen you are solely driving a car, you might have\
    \ some mental distractions like you are thinking about what you are going to wear\
    \ to that party tonight. But, you still have at the forefront the driving task.\
    \ When you have the AI doing the driving, you tend to allow mental distractions\
    \ to takeover more of your mental processing. It’s a natural tendency.\n\n- **Physical\
    \ mispositioning for task**  \nMost of the time, if you are solely driving a car,\
    \ you have your foot on the gas or the brake, you have your hands on the wheel,\
    \ all of this is continuous. When you are sharing the driving with the AI, you\
    \ are likely to take your feet off the peddles, and your hands off the wheel.\
    \ Even if you are timed and need to periodically put your hands on the wheel,\
    \ this is not the same as continuously having your hands on the wheel.\n\n- **Confused\
    \ about Theory of Mind re: AI**  \nThis is one aspect that not many are considering,\
    \ namely, the human driver needs to have a theory of mind about the AI driving\
    \ capability. This is akin to if I had a novice teenage driver at the wheel of\
    \ my car. I would generally know what the teenage driver can handle and not handle.\
    \ Right now, few of the human drivers have a sufficient understanding of the theory\
    \ of mind about what the AI can and cannot do.\n\n- **False assumptions about\
    \ safety**  \nThe human driver tends to believe that if an accident hasn’t yet\
    \ happened while the AI is driving, it probably implies there won’t be an accident.\
    \ The longer that the AI drives and seems to be accident free, the more this false\
    \ assumption about safety increases."
  merge: -1
