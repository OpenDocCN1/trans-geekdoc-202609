- pgno: 10
  md: '# # INTRODUCTION


    This is a book that provides the newest innovations and the latest Artificial
    Intelligence (AI) advances about the emerging nature of AI-based autonomous self-driving
    driverless cars. Via recent advances in Artificial Intelligence (AI) and Machine
    Learning (ML), we are nearing the day when vehicles can control themselves and
    will not require and nor rely upon human intervention to perform their driving
    tasks (or, that *allow* for human intervention, but only *require* human intervention
    in very limited ways).


    Similar to my other related books, which I describe in a moment and list the chapters
    in the Appendix A of this book, I am particularly focused on those advances that
    pertain to self-driving cars. The phrase "autonomous vehicles" is often used to
    refer to any kind of vehicle, whether it is ground-based or in the air or sea,
    and whether it is a cargo hauling trailer truck or a conventional passenger car.
    Though the aspects described in this book are certainly applicable to all kinds
    of autonomous vehicles, I am focused more so here on cars.


    Indeed, I am especially known for my role in aiding the advancement of self-driving
    cars, serving currently as the Executive Director of the Cybernetic Self-Driving
    Cars Institute.. In addition to writing software, designing and developing systems
    and software for self-driving cars, I also speak and write quite a bit about the
    topic. This book is a collection of some of my more advanced essays. For those
    of you that might have seen my essays posted elsewhere, I have updated them and
    integrated them into this book as one handy cohesive package.


    You might be interested in companion books that I have written that provide additional
    key innovations and fundamentals about self-driving cars. Those books are entitled
    "*Introduction to Driverless Self-Driving Cars,*" "*Advances in AI and Autonomous
    Vehicles: Cybernetic Self-Driving Cars,*" "*Self-Driving Cars: "The Mother of
    All AI Projects,"* "*Innovation and Thought Leadership on Self-Driving Driverless
    Cars,*" "*New Advances in AI Autonomous Driverless Self-Driving Cars,*" and "*Autonomous
    Vehicle Driverless Self-Driving Cars and'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Artificial Intelligence” and “Transformative Artificial Intelligence Driverless
    Self-Driving Cars,” and “Disruptive Artificial Intelligence and Driverless Self-Driving
    Cars” and “State-of-the-Art AI Driverless Self-Driving Cars” (they are all available
    via Amazon). See Appendix A of this herein book to see a listing of the chapters
    covered in those three books.


    For the introduction here to this book, I am going to borrow my introduction from
    those companion books, since it does a good job of laying out the landscape of
    self-driving cars and my overall viewpoints on the topic. The remainder of the
    book is all new material that does not appear in the companion books.


    # INTRODUCTION TO SELF-DRIVING CARS


    This is a book about self-driving cars. Someday in the future, we''ll all have
    self-driving cars and this book will perhaps seem antiquated, but right now, we
    are at the forefront of the self-driving car wave. Daily news bombards us with
    flashes of new announcements by one car maker or another and leaves the impression
    that within the next few weeks or maybe months that the self-driving car will
    be here. A casual non-technical reader would assume from these news flashes that
    in fact we must be on the cusp of a true self-driving car.


    Here''s a real news flash: We are still quite a distance from having a true self-driving
    car. It is years to go before we get there.


    Why is that? Because a true self-driving car is akin to a moonshot. In the same
    manner that getting us to the moon was an incredible feat, likewise can it be
    said for achieving a true self-driving car. Anybody that suggests or even rashly
    states that the true self-driving car is nearly here should be viewed with great
    skepticism. Indeed, you''ll see that I often tend to use the word “hogwash” or
    “crock” when I assess much of the decidedly fake news about self-driving cars.
    Those of us on the inside know that what is often reported to the outside is malarkey.
    Few of the insiders are willing to say so. I have no such hesitation.


    Indeed, I''ve been writing a popular blog post about self-driving cars and hitting
    hard on those that try to wave their hands and pretend that we are on the imminent
    verge of true self-driving cars. For many years, I''ve been known as the AI Insider.
    Besides writing about AI, I also develop AI software. I do what I describe. It
    also gives me insights into what others that are doing AI are really doing versus
    what it is said they are doing.


    Many faithful readers had asked me to pull together my insightful short essays
    and put them into another book, which you are now holding in your hands.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'For those of you that have been reading my essays over the years, this collection
    not only puts them together into one handy package, I also updated the essays
    and added new material. For those of you that are new to the topic of self-driving
    cars and AI, I hope you find these essays approachable and informative. I also
    tend to have a writing style with a bit of a voice, and so you’ll see that I am
    times have a wry sense of humor and also like to poke at conformity.


    As a former professor and founder of an AI research lab, I for many years wrote
    in the formal language of academic writing. I published in referred journals and
    served as an editor for several AI journals. This writing here is not of the nature,
    and I have adopted a different and more informal style for these essays. That
    being said, I also do mention from time-to-time more rigorous material on AI and
    encourage you all to dig into those deeper and more formal materials if so interested.


    I am also an AI practitioner. This means that I write AI software for a living.
    Currently, I head-up the Cybernetics Self-Driving Car Institute, where we are
    developing AI software for self-driving cars. I am excited to also report that
    my son, also a software engineer, heads-up our Cybernetics Self-Driving Car Lab.
    What I have helped to start, and for which he is an integral part, ultimately
    he will carry long into the future after I have retired. My daughter, a marketing
    whiz, also is integral to our efforts as head of our Marketing group. She too
    will carry forward the legacy now being formulated.


    For those of you that are reading this book and have a penchant for writing code,
    you might consider taking a look at the open source code available for self-driving
    cars. This is a handy place to start learning how to develop AI for self-driving
    cars. There are also many new educational courses spring forth.


    There is a growing body of those wanting to learn about and develop self-driving
    cars, and a growing body of colleges, labs, and other avenues by which you can
    learn about self-driving cars.


    This book will provide a foundation of aspects that I think will get you ready
    for those kinds of more advanced training opportunities. If you’ve already taken
    those classes, you’ll likely find these essays especially interesting as they
    offer a perspective that I am betting few other instructors or faculty offered
    to you. These are challenging essays that ask you to think beyond the conventional
    about self-driving cars.


    # THE MOTHER OF ALL AI PROJECTS


    In June 2017, Apple CEO Tim Cook came out and finally admitted that Apple has
    been working on a self-driving car. As you’ll see in my essays, Apple was enmeshed
    in secrecy about their self-driving car efforts. We have'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'only been able to read the tea leaves and guess at what Apple has been up to.
    The notion of an iCar has been floating for quite a while, and self-driving engineers
    and researchers have been signing tight-lipped Non-Disclosure Agreements (NDA''s)
    to work on projects at Apple that were as shrouded in mystery as any military
    invasion plans might be.


    Tim Cook said something that many others in the Artificial Intelligence (AI) field
    have been saying, namely, the creation of a self-driving car has got to be the
    mother of all AI projects. In other words, it is in fact a tremendous moonshot
    for AI. If a self-driving car can be crafted and the AI works as we hope, it means
    that we have made incredible strides with AI and that therefore it opens many
    other worlds of potential breakthrough accomplishments that AI can solve.


    Is this hyperbole? Am I just trying to make AI seem like a miracle worker and
    so provide self-agrandizing statements for those of us writing the AI software
    for self-driving cars? No, it is not hyperbole. Developing a true self-driving
    car is really, really, really hard to do. Let me take a moment to explain why.
    As a side note, I realize that the Apple CEO is known for at times uttering hyperbole,
    and he had previously said for example that the year 2012 was “the mother of all
    years,” and he had said that the release of iOS 10 was “the mother of all releases”
    – all of which does suggest he likes to use the handy “mother of” expression.
    But, I assure you, in terms of true self-driving cars, he has hit the nail on
    the head. For sure.


    When you think about a moonshot and how we got to the moon, there are some identifiable
    characteristics and those same aspects can be applied to creating a true self-driving
    car. You''ll notice that I keep putting the word “true” in front of the self-driving
    car expression. I do so because as per my essay about the various levels of self-driving
    cars, there are some self-driving cars that are only somewhat of a self-driving
    car. The somewhat versions are ones that require a human driver to be ready to
    intervene. In my view, that''s not a true self-driving car. A true self-driving
    car is one that requires no human driver intervention at all. It is a car that
    can entirely undertake via automation the driving task without any human driver
    needed. This is the essence of what is known as a Level 5 self-driving car. We
    are currently at the Level 2 and Level 3 mark, and not yet at Level 5.


    Getting to the moon involved aspects such as having big stretch goals, incremental
    progress, experimentation, innovation, and so on. Let''s review how this applied
    to the moonshot of the bygone era, and how it applies to the self-driving car
    moonshot of today.


    # ### Big Stretch Goal


    Trying to take a human and deliver the human to the moon, and bring them back,
    safely, was an extremely large stretch goal at the time. No one'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'knew whether it could be done. The technology wasn’t available yet. The cost
    was huge. The determination would need to be fierce. Etc. To reach a Level 5 self-driving
    car is going to be the same. It is a big stretch goal. We can readily get to the
    Level 3, and we are able to see the Level 4 just up ahead, but a Level 5 is still
    an unknown as to if it is doable. It should eventually be doable and in the same
    way that we thought we’d eventually get to the moon, but when it will occur is
    a different story.


    # Incremental Progress


    Getting to the moon did not happen overnight in one fell swoop. It took years
    and years of incremental progress to get there. Likewise for self-driving cars.
    Google has famously been striving to get to the Level 5, and pretty much been
    willing to forgo dealing with the intervening levels, but most of the other self-driving
    car makers are doing the incremental route. Let’s get a good Level 2 and a somewhat
    Level 3 going. Then, let’s improve the Level 3 and get a somewhat Level 4 going.
    Then, let’s improve the Level 4 and finally arrive at a Level 5. This seems to
    be the prevalent way that we are going to achieve the true self-driving car.


    # Experimentation


    You likely know that there were various experiments involved in perfecting the
    approach and technology to get to the moon. As per making incremental progress,
    we first tried to see if we could get a rocket to go into space and safetly return,
    then put a monkey in there, then with a human, then we went all the way to the
    moon but didn’t land, and finally we arrived at the mission that actually landed
    on the moon. Self-driving cars are the same way. We are doing simulations of self-driving
    cars. We do testing of self-driving cars on private land under controlled situations.
    We do testing of self-driving cars on public roadways, often having to meet regulatory
    requirements including for example having an engineer or equivalent in the car
    to take over the controls if needed. And so on. Experiments big and small are
    needed to figure out what works and what doesn’t.


    # Innovation


    There are already some advances in AI that are allowing us to progress toward
    self-driving cars. We are going to need even more advances. Innovation in all
    aspects of technology are going to be required to achieve a true self-driving
    car. By no means do we already have everything in-hand that we need to get there.
    Expect new inventions and new approaches, new algorithms, etc.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Setbacks


    Most of the pundits are avoiding talking about potential setbacks in the progress
    toward self-driving cars. Getting to the moon involved many setbacks, some of
    which you never have heard of and were buried at the time so as to not dampen
    enthusiasm and funding for getting to the moon. A recurring theme in many of my
    included essays is that there are going to be setbacks as we try to arrive at
    a true self-driving car. Take a deep breath and be ready. I just hope the setbacks
    don’t completely stop progress. I am sure that it will cause progress to alter
    in a manner that we’ve not yet seen in the self-driving car field. I liken the
    self-driving car of today to the excitement everyone had for Uber when it first
    got going. Today, we have a different view of Uber and with each passing day there
    are more regulations to the ride sharing business and more concerns raised. The
    darling child only stays a darling until finally that child acts up. It will happen
    the same with self-driving cars.


    # SELF-DRIVING CARS CHALLENGES


    But what exactly makes things so hard to have a true self-driving car, you might
    be asking. You have seen cruise control for years and years. You’ve lately seen
    cars that can do parallel parking. You’ve seen YouTube videos of Tesla drivers
    that put their hands out the window as their car zooms along the highway, and
    seen to therefore be in a self-driving car. Aren’t we just needing to put a few
    more sensors onto a car and then we’ll have in-hand a true self-driving car? No.


    Consider for a moment the nature of the driving task. We don’t just let anyone
    at any age drive a car. Worldwide, most countries won’t license a driver until
    the age of 18, though many do allow a learner’s permit at the age of 15 or 16.
    Some suggest that a younger age would be physically too small to reach the controls
    of the car. Though this might be the case, we could easily adjust the controls
    to allow for younger aged and thus smaller stature. It’s not their physical size
    that matters. It’s their cognitive development that matters.


    To drive a car, you need to be able to reason about the car, what the car can
    and cannot do. You need to know how to operate the car. You need to know about
    how other cars on the road drive. You need to know what is allowed in driving
    such as speed limits and driving within marked lanes. You need to be able to react
    to situations and be able to avoid getting into'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'accidents. You need to ascertain when to hit your brakes, when to steer clear
    of a pedestrian, and how to keep from ramming that motorcyclist that just cut
    you off.


    Many of us had taken courses on driving. We studied about driving and took driver
    training. We had to take a test and pass it to be able to drive. The point being
    that though most adults take the driving task for granted, and we often "mindlessly"
    drive our cars, there is a significant amount of cognitive effort that goes into
    driving a car. After a while, it becomes second nature. You don''t especially
    think about how you drive, you just do it. But, if you watch a novice driver,
    say a teenager learning to drive, you suddenly realize that there is a lot more
    complexity to it than we seem to realize.


    Furthermore, driving is a very serious task. I recall when my daughter and son
    first learned to drive. They are both very conscientious people. They wanted to
    make sure that whatever they did, they did well, and that they did not harm anyone.
    Every day, when you get into a car, it is probably around 4,000 pounds of hefty
    metal and plastics (about two tons), and it is a lethal weapon. Think about it.
    You drive down the street in an object that weighs two tons and with the engine
    it can accelerate and ram into anything you want to hit. The damage a car can
    inflict is very scary. Both my children were surprised that they were being given
    the right to maneuver this monster of a beast that could cause tremendous harm
    entirely by merely letting go of the steering wheel for a moment or taking your
    eyes off the road.


    In fact, in the United States alone there are about 30,000 deaths per year by
    auto accidents, which is around 100 per day. Given that there are about 263 million
    cars in the United States, I am actually more amazed that the number of fatalities
    is not a lot higher. During my morning commute, I look at all the thousands of
    cars on the freeway around me, and I think that if all of them decided to go zombie
    and drive in a crazy manic way, there would be many people dead. Somehow, incredibly,
    each day, most people drive relatively safely. To me, that''s a miracle right
    there. Getting millions and millions of people to be safe and sane when behind
    the wheel of a two ton mobile object, it''s a feat that we as a society should
    admire with pride.


    So, hopefully you are in agreement that the driving task requires a great deal
    of cognition. You don''t need to be especially smart to drive a car, and we''ve
    done quite a bit to make car driving viable for even the average dolt. There isn''t
    an IQ test that you need to take to drive a car. If you can read and write, and
    pass a test, you pretty much can legally drive a car. There are of course some
    that drive a car and are not legally permitted to do so, plus there are private
    areas such as farms where drivers are young, but for public roadways in the United
    States, you can be generally of average intelligence (or less) and be able to
    legally drive.


    This though makes it seem like the cognitive effort must not be much. If the cognitive
    effort was truly hard, wouldn''t we only have Einstein''s that'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'could drive a car? We have made sure to keep the driving task as simple as
    we can, by making the controls easy and relatively standardized, and by having
    roads that are relatively standardized, and so on. It is as though Disneyland
    has put their Autopia into the real-world, by us all as a society agreeing that
    roads will be a certain way, and we''ll all abide by the various rules of driving.


    A modest cognitive task by a human is still something that stymies AI. You certainly
    know that AI has been able to beat chess players and be good at other kinds of
    games. This type of narrow cognition is not what car driving is about. Car driving
    is much wider. It requires knowledge about the world, which a chess playing AI
    system does not need to know. The cognitive aspects of driving are on the one
    hand seemingly simple, but at the same time require layer upon layer of knowledge
    about cars, people, roads, rules, and a myriad of other “common sense” aspects.
    We don''t have any AI systems today that have that same kind of breadth and depth
    of awareness and knowledge.


    As revealed in my essays, the self-driving car of today is using trickery to do
    particular tasks. It is all very narrow in operation. Plus, it currently assumes
    that a human driver is ready to intervene. It is like a child that we have taught
    to stack blocks, but we are needed to be right there in case the child stacks
    them too high and they begin to fall over. AI of today is brittle, it is narrow,
    and it does not approach the cognitive abilities of humans. This is why the true
    self-driving car is somewhere out in the future.


    Another aspect to the driving task is that it is not solely a mind exercise. You
    do need to use your senses to drive. You use your eyes a vision sensors to see
    the road ahead. You vision capability is like a streaming video, which your brain
    needs to continually analyze as you drive. Where is the road? Is there a pedestrian
    in the way? Is there another car ahead of you? Your senses are relying a flood
    of info to your brain. Self-driving cars are trying to do the same, by using cameras,
    radar, ultrasound, and lasers. This is an attempt at mimicking how humans have
    senses and sensory apparatus.


    Thus, the driving task is mental and physical. You use your senses, you use your
    arms and legs to manipulate the controls of the car, and you use your brain to
    assess the sensory info and direct your limbs to act upon the controls of the
    car. This all happens instantly. If you''ve ever perhaps gotten something in your
    eye and only had one eye available to drive with, you suddenly realize how dependent
    upon vision you are. If you have a broken foot with a cast, you suddenly realize
    how hard it is to control the brake pedal and the accelerator. If you''ve taken
    medication and your brain is maybe sluggish, you suddenly realize how much mental
    strain is required to drive a car.


    An AI system that plays chess only needs to be focused on playing chess. The physical
    aspects aren''t important because usually a human moves the'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'chess pieces or the chessboard is shown on an electronic display. Using AI
    for a more life-and-death task such as analyzing MRI images of patients, this
    again does not require physical capabilities and instead is done by examining
    images of bits.


    Driving a car is a true life-and-death task. It is a use of AI that can easily
    and at any moment produce death. For those colleagues of mine that are developing
    this AI, as am I, we need to keep in mind the somber aspects of this. We are producing
    software that will have in its virtual hands the lives of the occupants of the
    car, and the lives of those in other nearby cars, and the lives of nearby pedestrians,
    etc. Chess is not usually a life-or-death matter.


    Driving is all around us. Cars are everywhere. Most of today''s AI applications
    involve only a small number of people. Or, they are behind the scenes and we as
    humans have other recourse if the AI messes up. AI that is driving a car at 80
    miles per hour on a highway had better not mess up. The consequences are grave.
    Multiply this by the number of cars, if we could put magically self-driving into
    every car in the USA, we''d have AI running in the 263 million cars. That''s a
    lot of AI spread around. This is AI on a massive scale that we are not doing today
    and that offers both promise and potential peril.


    There are some that want AI for self-driving cars because they envision a world
    without any car accidents. They envision a world in which there is no car congestion
    and all cars cooperate with each other. These are wonderful utopian visions.


    They are also very misleading. The adoption of self-driving cars is going to be
    incremental and not overnight. We cannot economically just junk all existing cars.
    Nor are we going to be able to affordably retrofit existing cars. It is more likely
    that self-driving cars will be built into new cars and that over many years of
    gradual replacement of existing cars that we''ll see the mix of self-driving cars
    become substantial in the real-world.


    In these essays, I have tried to offer technological insights without being overly
    technical in my description, and also blended the business, societal, and economic
    aspects too. Technologists need to consider the non-technological impacts of what
    they do. Non-technologists should be aware of what is being developed.


    We all need to work together to collectively be prepared for the enormous disruption
    and transformative aspects of true self-driving cars. We all need to be involved
    in this mother of all AI projects.


    # WHAT THIS BOOK PROVIDES


    What does this book provide to you? It introduces many of the key'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'elements about self-driving cars and does so with an AI based perspective.
    I weave together technical and non-technical aspects, readily going from being
    concerned about the cognitive capabilities of the driving task and how the technology
    is embodying this into self-driving cars, and in the next breath I discuss the
    societal and economic aspects.


    They are all intertwined because that''s the way reality is. You cannot separate
    out the technology per se, and instead must consider it within the milieu of what
    is being invented and innovated, and do so with a mindset towards the contemporary
    mores and culture that shape what we are doing and what we hope to do.


    # WHY THIS BOOK


    I wrote this book to try and bring to the public view many aspects about self-driving
    cars that nobody seems to be discussing.


    For business leaders that are either involved in making self-driving cars or that
    are going to leverage self-driving cars, I hope that this book will enlighten
    you as to the risks involved and ways in which you should be strategizing about
    how to deal with those risks.


    For entrepreneurs, startups and other businesses that want to enter into the self-driving
    car market that is emerging, I hope this book sparks your interest in doing so,
    and provides some sense of what might be prudent to pursue.


    For researchers that study self-driving cars, I hope this book spurs your interest
    in the risks and safety issues of self-driving cars, and also nudges you toward
    conducting research on those aspects.


    For students in computer science or related disciplines, I hope this book will
    provide you with interesting and new ideas and material, for which you might conduct
    research or provide some career direction insights for you.


    For AI companies and high-tech companies pursuing self-driving cars, this book
    will hopefully broaden your view beyond just the mere coding and development needed
    to make self-driving cars.


    For all readers, I hope that you will find the material in this book to be stimulating.
    Some of it will be repetitive of things you already know. But I am pretty sure
    that you''ll also find various eureka moments whereby you''ll discover a new technique
    or approach that you had not earlier thought of. I am also betting that there
    will be material that forces you to rethink some of your current practices.


    I am not saying you will suddenly have an epiphany and change what you'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'are doing. I do think though that you will reconsider or perhaps revisit what
    you are doing.


    For anyone choosing to use this book for teaching purposes, please take a look
    at my suggestions for doing so, as described in the Appendix. I have found the
    material handy in courses that I have taught, and likewise other faculty have
    told me that they have found the material handy, in some cases as extended readings
    and in other instances as a core part of their course (depending on the nature
    of the class).


    In my writing for this book, I have tried carefully to blend both the practitioner
    and the academic styles of writing. It is not as dense as is typical academic
    journal writing, but at the same time offers depth by going into the nuances and
    trade-offs of various practices.


    The word “deep” is in vogue today, meaning getting deeply into a subject or topic,
    and so is the word “unpack” which means to tease out the underlying aspects of
    a subject or topic. I have sought to offer material that addresses an issue or
    topic by going relatively deeply into it and make sure that it is well unpacked.


    Finally, in any book about AI, it is difficult to use our everyday words without
    having some of them be misinterpreted. Specifically, it is easy to anthropomorphize
    AI. When I say that an AI system “knows” something, I do not want you to construe
    that the AI system has sentience and “knows” in the same way that humans do. They
    aren’t that way, as yet. I have tried to use quotes around such words from time-to-time
    to emphasize that the words I am using should not be misinterpreted to ascribe
    true human intelligence to the AI systems that we know of today. If I used quotes
    around all such words, the book would be very difficult to read, and so I am doing
    so judiciously. Please keep that in mind as you read the material, thanks.'
