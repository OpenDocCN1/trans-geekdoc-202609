  md: '# # CHAPTER 3

    ## CHANGING LANES AND SELF-DRIVING CARS


    Hey buddy, pick a lane and stick with it. I can’t believe that driver just cut
    into my lane. I need to quickly move into the lane next to me. There’s a car blocking
    my lane up ahead. There aren’t enough lanes here for the number of cars. These
    lanes are poorly marked and cars are veering toward each other. Which lane am
    I supposed to be in. The emergency lane is nowhere to be seen. Drivers are illegally
    going into and out of the HOV lane.


    You’ve likely thought about or spoken aloud those preceeding remarks about roadway
    lanes. We live in a world of lanes. On the open highways, maybe there are a couple
    of lanes going in each direction. On some freeways, there are at times five lanes
    going in each direction. On a mountain road, you usually have one lane in each
    direction, and on occasion it narrows to just one lane with the need to be extra
    cautious for any cars coming in the opposite direction.


    Lanes can be marked in a variety of ways. Sometimes there are bots dots that when
    you go across them it causes your tires and car to rumble, warning you that you
    just crossed a lane. There are some lanes that are marked with flat paint, and
    so there’s no “feeling” about crossing a lane and it’s all based on visual sight.
    There might not be any markings at all, and it’s just a gut feel as to where the
    lanes are supposed to be. In addition, there can be special occasions when a lane
    is marked by orange cones, creating a temporary lane such as after a'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'car crash and the police are trying to redirect traffic.


    Until the day arrives that we have flying cars, we all need to be cognizant of
    roadway lanes. It’s kind of amazing when you think about it that people are all
    willing to most of the time obey the lanes. Each morning, during my lengthy commute
    on the freeway, I watch and marvel that the drivers generally agree to stay in
    their lanes. They don’t have to per se. You could straddle two lanes, and there’s
    nothing immediate that would stop you from doing so. There isn’t a freeway laser
    that would zap your car, and no big hammer that would bang on your car to get
    it to move over. Nope, we just all voluntarily abide by the lanes.


    We do so partially because of the law. As a driver, you don’t want to get a ticket
    and so you obey the lanes. Also, you pretty much know that there will be fellow-driver
    vigilante justice extracted if you are straddling lanes excessively. Other cars
    will honk at you, and at times maybe aim at you to force you in a chicken-game
    like way to get into a lane. I’m not suggesting that drivers aren’t straddling
    lanes from time-to-time, and likewise they often make really bad decisions about
    lane changes, but I am just saying that most of the time it’s kind of a miracle
    that all these people driving all these multi-ton deadly machines -- and for which
    at any moment they could do whatever they want, we don’t have utter chaos. We’re
    pretty much all well behaved most of the time.


    Thanks goes to all you drivers for a general consensus on sanity when driving.


    For teenage drivers that are learning to drive, they often find that changing
    lanes is one of the scariest aspects of driving a car. Should I go now, or should
    I wait? Can I make the lane change or will I cut-off another car? Is that car
    going to allow me into that lane? Should I speed-up? Should I slow down? I remember
    when I was first learning to drive a car, and we had five high school students
    in my driver ed class, and for which (scarily) we always all drove in one car
    with the driving instructor. Each student would get about ten minutes of driving
    time per instructional trip.


    One of the students would make a lane change that took maybe'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'four minutes long and did an inch at a time to get into another lane. It was
    agonizingly slow. Dangerously slow. In contrast, we had one student driver that
    made a lane change the instant the instructor said to do so, and at times we nearly
    got into a car crash because of the rapid movement (it was as though the car dove
    into the other lane). The moment the instructor started to utter the words "start
    to think about a lane change," the student took this to mean "get over into the
    next lane, darn it, as fast as possible, and don''t delay since we''ll all die
    if you do." We all held are breaths every time that student got behind the wheel.


    Of course, changing lanes is a dangerous act. Think about what can go wrong. You
    can start the lane change, and perhaps not realize there is a car directly abreast
