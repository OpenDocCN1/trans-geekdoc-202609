- pgno: 40
  md: '# CHAPTER 2

    RESPONSIBILITY AND

    SELF-DRIVING CARS


    How do you get people to behave responsibly? That’s a refrain right now being
    asked and pondered regarding the scooter wars underway in cities such as San Francisco
    and Santa Monica.


    In case you’ve not yet been indoctrinated into the scooter wars, allow me a moment
    to bring you into the fold.


    Companies are springing up like wildflowers that are providing motorized scooter
    rentals and are using a modern-day approach to do so. Rather than the prospective
    customer having to go to a storefront to rent a scooter, they instead look for
    one on a mobile app that shows a GPS map with scooter locations, akin to the Uber
    mobile app that shows ridesharing car locations, and simply go over to the nearest
    scooter, rent it with a credit card, it unlocks, and you are good to go. There
    is an electronic lock on the scooter and whoever last rented it is pretty much
    allowed to leave it wherever they want to do so (it locks after the renter is
    done with the scooter). No need to take the scooter back to the rental office.
    No need to pick it up from a rental office.


    Imagine that you are somewhere in Santa Monica and you want to get across town.
    You could potentially walk it, but that’s old fashioned, it might take a long
    time, and you’d likely not have much fun along the way. You could use a ridesharing
    service, but why do so when it’s a nice day out and the distance is just a mile
    or two, plus the cost might'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'be relatively high for such a short distance. It would be nifty if somehow
    there was a motorized scooter, in good shape, waiting for you, and close to where
    you are now standing. Voila, just use the modern-day scooter rental. Bird is probably
    the most well-known such scooter rental right now and it seems to be the darling
    of the venture capital crowd.


    It all seems like a win-win. Good for the customer, good for the rental firm.
    But I''ve mentioned earlier here that there is a scooter war going on. What could
    be wrong with the scooter rental equation? Answer, people are doing things they
    should not be doing. Human behavior, it''s a thing.


    First, the human "driving" the scooter is supposed to obey the rules of the road.
    You must not ride on sidewalks (unless there are allowed exceptions, which are
    few). You can''t run red lights. You must stop at stop signs. You must obey the
    usual traffic laws. Guess what, many of the scooter renters are not abiding by
    the traffic laws. Shocking? Not really.


    Second, there are often local helmet laws that require the use of a helmet when
    riding a motorized scooter. Bird will actually provide you with a free helmet
    if you sign-up with them (they mail you the helmet). Guess what, many of the scooter
    renters are not wearing helmets. Shocking? Not really.


    Third, scooter "drivers" have been commonly seen cutting off cars, cutting off
    bicyclists, cutting off pedestrians. They have been known to zip through crowds
    at outdoor malls and also try to weave in and out of sidewalks teeming with people.
    Dangerous for all. Completely wrong to do. Shocking? Not really.


    These scooters can typically go around 15 miles per hour, which is plenty fast
    when using it near people and onto sidewalks and other areas containing pedestrians.
    There has been an uptick in injuries for scooter riders, including cuts, abrasions,
    and head injuries. For the mere price of about one dollar to unlock the scooter,
    and then at a cost of about 15 cents per minute, you can have the joy and adventure
    of your life. You get to work faster. You think you are a race car driver.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Meanwhile, those that abuse the scooter capability are apt to make life difficult
    and dangerous for everyone else.


    There are even concerns about where the scooters are being placed while not in
    use. Some renters just put the scooter wherever they darned well please. Sometimes
    they place it in front of a store, blocking the entrance and exit of the store.
    Sometimes they place it in a driveway, blocking vehicles from readily going into
    and out of the driveway. It''s like discarding trash and not having to worry about
    putting the trash into a proper receptacle. You reach your desired destination,
    step off the scooter, indicate you are done renting it via your mobile app, and
    walk away from the scooter. Why should you care that it now possibly is in the
    way of others? Shocking? Not really.


    The scooter rental firms like Bird have tended to defend their business model
    by indicating that they do all sorts of things to prevent people from misusing
    the scooters. When you sign-up for the scooter rental, it tells you to not do
    the things I''ve just mentioned that people are doing in droves. On the screen,
    it tells you to obey the traffic laws. It tells you to not use the scooter in
    ways that can endanger people. It tells you that you need to wear a helmet if
    the local laws say you do (and some, like Bird, can provide you one, though you
    need to remember to take it with you). Blah, blah, blah.


