    There are maybe 300,000 of these in the United States alone. You see them every
    day. You notice them, but you don’t notice them. They save lives, but are generally
    unheralded for what they do. Sometimes you curse them. Sometimes you thank them.
    Can you guess what I am referring to?


    Answer: Traffic lights.


    Yes, as human drivers you are surrounded by traffic lights. Most major intersections
    have them. You watch for that green light so that you can zoom through the intersection.
    When you see the yellow light, you need to judge whether to hit the brakes before
    the light turns red, or maybe hit the accelerator to try and make it before the
    light turns red. It’s a game.


    It’s actually a deadly game. There are an estimated 700 deaths per year due to
    red-light running crashes. That’s sad and preventable. Equally horrific, there
    are an estimated 126,000 injuries due to red-light running. That’s sad and preventable.
    The next time you see some nut rush through a red light, I hope you’ll realize
    the crazy danger involved and perhaps adjust your own driving to no longer try
    to rush through a traffic signal.


    When you think about it for a moment, you’ll realize that traffic signals are
    kind of a scary mechanism since they don’t do anything to actually physically
    stop anyone from driving crazily. It is all a voluntary'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'system. It is our collective belief in the traffic signal that makes it real.
    The traffic signal does not toss down a huge net to stop cars that disobey the
    light. It does not spring forth spikes from the roadway to stop cars that are
    going to potentially ram into another car. Instead, it is just some lights that
    we as humans have generally agreed to abide by.


    Imagine though the chaos without the traffic signals. We would either all be having
    continual near misses, or the intersections would need to have stop signs or some
    other control mechanism, which would likely stall traffic and make our driving
    times longer. You could put traffic officers at intersections, which is the way
    things used to be, prior to the advent of traffic signals. A traffic officer would
    stand in the intersection and direct traffic. At one point, New York City had
    something like 6,000 traffic officers to direct traffic. The traffic signal put
    a lot of those traffic officers out of the job of directing traffic, though they
    were still needed for various other traffic related duties.


    When traffic signals first began, they were often a signboard that said the word
    Go and the word Stop. The Go signboard would pop-up, and after a bit would be
    pushed down. The Stop word would pop-up and then after a bit be pushed down. Human
    operators at first stood nearby and controlled these signboards. Eventually, it
    was quasi-automated. Traffic signals were at first only with two lights, one that
    said Go and one that said Stop, or had the red light and the green light similarly.
    Ultimately it became clear that human drivers would not judge things well when
    there were only two modes, and thus a third light was born, a yellow light, which
    helped to reduce the frequency of intersection crashes. The yellow light became
    a handy warning to drivers that the red light would be coming soon.


    Since the red light is perhaps the most important of the three lights (I don''t
    want to get into a debate about that here, but I think you generally agree that
    the red light is quite important!), it is normally placed at the top of the three
    lights that are on a traffic signal. Next is the yellow light, at the middle,
    and logically in sequence of what then comes next, namely the green light at the
    bottom. Not all countries do things this way. But, it is pretty common and makes
    sense that you would want them at least to have the traffic signal in a Red-Yellow-'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Green or a Green-Yellow-Red sequence. A Yellow-Red-Green or a Yellow-Green-Red
    would seem counterintuitive and likely confusing, even if we all agreed to it.


    How long does each color light get lit? I realize that if you''ve ever sat at
    traffic signal for what seemed like an inordinately long time, you might claim
    that the red light seems to be at times glowing for an hour or more. Well, the
    reality is that many traffic signals are established with pre-timed intervals
    but usually for a duration of just some set number of seconds (not hours). The
    green goes for X number of seconds, the yellow goes for Y number of seconds, and
    the red goes for Z number of seconds. This is the easiest way to “program” a traffic
    signal. What should the values of X, Y, and Z be?


    For yellow lights, there is a rule-of-thumb that many use. The rule-of-thumb is
    that the yellow light should be set for 1 second for each 10 miles per hour of
    the posted speed nearby. Thus, if the posted speed is 40 miles per hour, the yellow
    light should last for 4 seconds. It doesn''t have to be set for that interval
    of time, and some locations use something like 3 seconds to maybe 6 seconds for
    all of their yellow lights (rather than having to figure out per each intersection
    what the nearby posted speed is).


    The setting of the time for the green light and for the red light is trickier.
    If you arbitrarily pick a number of seconds, it could be that it hampers traffic.
    A street leading into the intersection that has a lot of traffic should presumably
    have a longer green light, so as to allow more traffic to get through the intersection.
    Sometimes you get to a traffic signal that is “dumb” and it seems to allow the
    same amount of time for both the red light and the green light in each direction,
    but this bottles up the roads leading in that have a lot of traffic, while it
    infuriates those drivers too when the light is green for the mildly traveled road
    that has no traffic streaming through the intersection.


    Traffic engineers will sometimes study traffic patterns and then advise that a
    traffic signal should be setup in somewhat savvier timings. This can help with
    the flow of traffic through the intersection. The problem here page though is
    that for most “dumb” traffic signals they can only set one value for X, one value
    for Y, and one value for Z. This'
