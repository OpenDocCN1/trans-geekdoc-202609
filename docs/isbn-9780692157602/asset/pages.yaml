  img_proc: true
- pgno: 85
  md: 'might turn this into a crime. For the moment, the use of AI for self-driving
    cars is so new that we have yet to figure out what twists and turns will happen,
    and nor do we yet know what kinds of regulations and new laws might be required.


    The overall point is that we need to anticipate the dangers of potential “procrastination”
    based on human foibles and how it might adversely impact AI self-driving cars
    and their safety on our roadways.


    Our focus is for the moment aimed at the technical side of things. The AI needs
    to be able to detect that something is amiss. When this occurs, the AI has to
    be sophisticated enough to know how to try and overcome the aspect that went afoul,
    if it can, and be aware of any new limitations that arise (maybe the self-driving
    car can only go 5 miles per hour and no faster, or maybe it can make right turns
    but not any left turns, etc.). And, it has to be aware of whom to contact about
    the matter.


    There are some that say this is “easily” solved because once the AI self-driving
    car detects that something is amiss, it can just route itself to the nearest repair
    shop. Problem solved.


    Well, not quite. Maybe the AI self-driving car is unfit to be able to get to the
    nearest repair shop. Maybe it is fit to do so, but perhaps it’s Okay for it to
    instead continue on its journey and later on go to the repair shop. Maybe it cannot
    detect itself that itself is in trouble. As such, the AI should allow for the
    human occupants to possibly tell it that something is amiss (“we see smoke coming
    out of the engine compartment”), and possibly even communicate via V2V (vehicle-to-vehicle
    communications) and be told by another AI self-driving car that something is wrong
    (self-driving car X12345 transmits a warning to self-driving car Y87654 that there
    is smoke coming from the engine compartment).


    The second part of the procrastination aspect related to AI self-driving cars
    involves using procrastination as a driving strategy.


    I know that you might be somewhat surprised or shocked at this idea of using procrastination
    purposefully. Remember though that I'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'earlier stated that procrastination can occur by happenstance, or it can be
    used as a directed strategy.


    Suppose I''m driving on the freeway. My exit is up ahead. I do the right thing
    and long before the exit make my way over to the rightmost lane. I sit there in
    the slow lane, maybe a mile ahead of my exit. I''m going bumper-to-bumper but
    it''s Okay because at least I know I am securely in my needed exit lane. Do humans
    really drive this way? Some do, many do not. What''s actually more likely is that
    I''ll "procrastinate" and put off getting into the slow lane until the last moment,
    just in time to make that exit.


    This is more efficient driving, from the perspective of most drivers (I realize
    that you traffic researchers out there would argue that this is lousy driving
    and worsens traffic, and it is unsafe driving, but anyway that''s a different
    debate for another day).


    We are building "procrastination" into the AI of self-driving cars. Rather than
    being the goody two shoes kind of driver, our view is that if self-driving cars
    are supposed to be able ultimately drive as good as a human, they should be adopting
    human driving techniques. The utopians out there are going to go ape, since they
    believe that all AI self-driving cars will be perfectly civil and obey all laws
