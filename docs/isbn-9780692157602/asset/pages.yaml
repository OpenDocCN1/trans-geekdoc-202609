- pgno: 204
  md: 'That’s the Not Singularity. Maybe we can refer to it as waiting for Godot.


    Let’s now consider whether we can reach AGI. I believe in my heart we can, but
    admittedly there’s not much right now that seems to argue for it. As mentioned
    before, the AI of today is only so qualified. If you put more processors into
    it, will that spark it to intelligence? If you have massive amounts of computer
    memory, will that do it? Even if we go quantum computing, is that really the spark
    or just the same kind of algorithms and computations that we are using today to
    do our narrow AI. It might make narrow AI really good, but will it bump us up
    to AGI?


    There’s the Not AGI.


    I’ll refer to it as the false hope. We might have a false hope that we can dramatically
    shift today’s AI into becoming AGI. For those of you that believe the Big Bang
    Singularity, it’s a relief to believe in the Not AGI, if you also believe that
    there’s a sad face outcome after reaching singularity. Much of this anguish has
    been expressed in other ways, and perhaps the famous book and movie about Frankenstein
    covers some of this ground.


    What does all of this have to do with AI self-driving cars?


    At the Cybernetic AI Self-Driving Car Institute, we are developing AI for self-driving
    cars. We assert that there won’t be true AI self-driving cars until we all master
    at least common sense reasoning for AI, and perhaps also only if we also reach
    AGI.


    I know those are fighting words. Allow me to explain.


    There are various levels of self-driving cars. At the level 5, it is considered
    a true self-driving car, one that is driven by the AI and that no human driver
    is needed. The AI can drive the car as a human can and does not require human
    assistance. Self-driving cars at less than a level 5 require a human driver. This
    means that the human and the AI co-share the driving task. This though has inherent
    problems and can'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'create potential and deadly results.


    Some believe that the path to a Level 5 self-driving car is by first achieving
    a Level 4, or maybe even a Level 3 and jumping up to a Level 5. Others believe
    that you can skip the lower levels and aim to directly reach a Level 5. In whichever
    way we get there, the question is whether or not with the AI we know today that
    we can reach a true Level 5 self-driving car.


    You might have heard on the news that we seem to already have true Level 5 self-driving
    cars. I assert that’s a debatable claim. If you have a so-called Level 5 AI self-driving
    car that needs to be geo-fenced and that requires to already have detailed mapping
    of its surroundings, and if when it encounters an “abnormal” driving situation
    it must revert to only stopping the car and pulling to the side of the road, well,
    I don’t know about you but that’s not the Level 5 that I’m aiming for as a true
    Level 5 self-driving car.


    Some say you don’t need common sense reasoning to be able to drive a car. I’m
    not so sure that’s a valid claim. Some say that the driving task is a very narrow
    task, like say playing chess or playing the game Go. I’m not so sure that’s a
    valid claim. It seems to me that if we are wanting to have a self-driving car
    that can be driven like a human driver, it requires that the AI be able to exhibit
    the same kind of intelligent behavior that a human driver does.


    It is my postulation that we need more AI than we have today, and it is a kind
    of AI approaching the AGI that is needed, in order to fulfill a goal of having
    a true Level 5 self-driving car. Without those kinds of advances, I’d say we’ll
    be mired in a “5-ish” level self-driving car, but for which we would all reasonably
    agree is not a true Level 5. This doesn’t mean that the 5-ish level self-driving
    car won’t be useful, it certainly can be. We can get a lot of mileage out of it
    (sorry about the pun!), it just won’t be the same as a human driven car.


    Now, if you are the sad face outcome person, you might say that we should be satisfied
    if we can get to the 5-ish level self-driving car, because maybe if we push to
    AGI in order to get to a true Level 5 self-driving car, we end-up with the AGI
    that bursts into ASI and all of'
