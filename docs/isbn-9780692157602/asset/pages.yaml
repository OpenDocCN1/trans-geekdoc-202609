- pgno: 203
  md: 'Will there be any substantial time between the achieving of AGI and the reaching
    of ASI? It could be that the intelligence explosion takes maybe weeks or months,
    maybe even years. It might sneak up on us. Or, it might slowly occur, and we know
    it is happening, and maybe we don''t mind since the ASI looks pretty good along
    the way. Are we lulling ourselves into then getting smacked when the actual singularity
    happens? You pick the outcome, smiley face or sad face.


    There are some that suggest the AGI achievement will instantaneously produce the
    intelligence explosion and we''ll have ASI in some nanoseconds or picoseconds.
    Bam, we got AGI but then we got ASI, all in the blink of an eye. If you are the
    sad face outcome person, this is a bad thing and the crossing of the bridge on
    AGI was not where we should have gone. If you are the smiley face outcome person,
    this is a good thing and we didn''t need to wait around to achieve ASI. Singularity
    happened and we didn''t even see how it occurred, it just did.


    That''s the Big Bang Singularity.


    You could argue that there won''t ever be a singularity. Instead, we''ll reach
    AGI and that''s it. There is no more there. The AGI will be like us. Maybe it
    can make more of us, and we can make more of it. But, we can''t get the AGI to
    become ASI, and nor can the AGI get itself to become ASI. We''ve reached the pinnacle
    of intelligence, regardless of human based or computer based in form and capability.
    I know this seems kind of disappointing, since we are always wanting to reach
    to the stars and find new conquests. But, hey, if you are the sad face outcome
    person then you are relieved to think that the AGI is it. No worries about the
    possibly nefarious singularity.


    I''m not sure we''ll be able to put together a proof that singularity cannot ever
    occur. In that sense, there will still be an urging and ongoing conquest ahead.
    I envision teams of AGI and humans, working arm in arm, trying in vain to find
    the vaunted ASI. It could go on forever.'
