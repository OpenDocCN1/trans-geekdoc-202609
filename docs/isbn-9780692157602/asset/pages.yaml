    That being said, it is important to emphasize that the auto makers and tech firms
    need to make sure they are sufficiently protecting their AI self-driving car systems
    from these kinds of reverse engineering efforts. Besides protecting the Intellectual
    Property (IP), it also needs to be done to try and prevent hackers from doing
    nefarious things. Having hackers that can break into and figure out how the AI
    systems are working is something nobody wants to have happen. To-date, the AI
    self-driving car field has been less careful about the security aspects than they
    should be. The focus has been on making an AI self-driving car. That''s good,
    but not good enough in the sense that having an AI self-driving car vulnerable
    to security breaches is a very bad thing.


    You might be wondering whether this reverse engineering of cars is even legal.
    Can you really take apart a competitor''s car? Generally, yes, once you''ve bought
    the car, there''s nothing that legally stops you from physically taking it apart
    per se. If you try to copy their car parts or car design, you might then find
    yourself in violation of their IP. If'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'you merely are studying it, that''s something hard to outlaw.


    In the case of reverse engineering the software, that’s something that does tend
    to run afoul of the law. You might know or remember the Digital Millenium Copyright
    Act (DCMA) that was passed by the United States Congress in 1998. The DMCA was
    pretty much a push by the entertainment industry that was worried about protecting
    unauthorized copying and dissemination of their copyrighted works. Firms put in
    place Technical Protection Mechanisms (TPM''s) to prevent hackers or others from
    doing reverse engineering. Circumvention of a TPM is considered a form of reverse
    engineering. This is considered generally illegal throughout the United States
    and has been adopted by much of the rest of the world as being considered illegal
    too.


    There are narrow exceptions for law enforcement purposes, or for national security
    purposes, and for selective computer security research purposes, but otherwise
    it''s against the law to circumvent a TPM in order to reverse engineer software.
    There have been attempts to make the case that bypassing TPM''s for certain kinds
    of systems should be purposely allowed, doing so for the good of society. Suppose
    an AI self-driving car has some hidden bugs, or vulnerabilities, or other malfunctions
    – wouldn’t you and society benefit by allowing “experts” to delve into the software
    and figure out how it works and identify those perhaps death-producing problems?


    If you are thinking about doing a teardown of your own AI self-driving car, I’d
    advise against it. The odds are that you’ll end-up with thousands of parts and
    have no idea what they do and why they are there. Also, if you are thinking you
    might put Humpty Dumpty back together again, I assure you that the odds of putting
    back together a torn apart car is most likely futile. It’s not just a Rubik’s
    cube that you need to move the positions back into their proper places. In any
    case, we’re definitely already seeing some amount of reverse engineering of AI
    self-driving cars and it will continue and gain momentum as self-driving cars
    become more prevalent.'
