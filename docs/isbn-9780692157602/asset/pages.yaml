    You might also discover during your reverse engineering that your competitor has
    made “mistakes” or at least gotten themselves into some bad spots. Suppose your
    competitor put the microprocessors in an area of the self-driving car that is
    subject to heat. This could suggest that after their self-driving cars are on
    the roads for a few weeks or months that those chips will start to burn out. The
    competitor might not realize it now and only discover this month from now. Should
    you tell them? Well, normally you wouldn’t want to give advice to your competitors
    that makes them better off.


    This does though bring up an ethics question. If during your reverse engineering
    of a competitors AI self-driving car that you find something untoward that could
    lead to the harm of humans, should you inform the competitor? You might say that
    you have no such obligation. It’s up to your competitor to find out and deal with
    it when'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'it occurs. But, if you don’t warn them and it harms human occupants or others,
    are you in a sense culpable? Maybe it would be good to let the competitor know.
    Or, if you prefer, inform the marketplace and it will cast your competitor in
    a bad light, which presumably would be good for you.


    There is a next level of detail in terms of reverse engineering an AI self-driving
    car. We focused so far on the physical aspects that are relatively easy to discern.
    You can take apart a car and readily identify the sensors and the chips, etc.
    What you cannot so readily reverse engineer is the software.


    Each auto maker and tech firm making AI self-driving cars is eager to know what
    the software is and does in their competitors self-driving car. Sure, some of
    it might be open source, but most of it is more likely to be proprietary. Indeed,
    the auto makers and tech firms are protecting their software as though it is gold
    that belongs in Fort Knox. Who can blame them? The arms race is on. Everyone is
    trying to figure out how to make the AI be as truly AI as possible.


    The AI software is going to ultimately be what makes or breaks a true AI self-driving
    car. For a level 5 self-driving car, which is the level that involves the AI fully
    driving the car and there is no human driver needed, we are all trying to get
    to that nirvana. It’s not going to be easy. There have been millions upon millions
    of dollars spent on software engineers and others trying to develop this AI code.
    Firms would want to protect it from prying eyes.


    Once the AI code is loaded into the self-driving car, it’s possible to try and
    reverse engineer it. I know that some of you are saying that this doesn’t seem
    possible to do, since the code is presumably compiled or otherwise being interpreted
    and the auto maker or tech firm certainly didn’t load the source code into the
    on-board computers. You are right that the source code would not be on-board.
    But, you are wrong if you think that the running software cannot be reverse engineered.


    There are plenty of available reverse engineering software tools in the marketplace.
    If you can get to the memory of the chips, you have'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'a shot at reverse engineering the code. Especially if some of it is open source.
    I say this because you can already know what the target of the open source is,
    and thus those portions of the running code can be more readily discerned. This
    then gets you into the right spots to look for the proprietary stuff.


    The artificial neural networks and the machine learning portions are even easier
    to figure out, usually. If you know the key models used for neural networks, you
    can somewhat readily find those patterns in the memory and drives of the on-board
    systems. You can then reverse engineer it back into the overall models with the
    number of neurons, the weights, and all the rest.


    What would make this even more doable would be if you were an AI developer already
    developing such systems. You would already be aware of the nature of the coding
    needed for these kinds of systems. If you took an everyday Python or C++ coder
    they would be highly unlikely to be able to figure this out. It requires software
    engineers with more detailed and machine-based experience and skills. This narrows
