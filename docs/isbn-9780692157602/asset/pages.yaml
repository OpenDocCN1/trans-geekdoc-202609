  md: 'being driven by the human and which by the AI – if we couldn''t discern which
    was which, in a small way the AI has passed a type of Turing Test.


    Today''s AI self-driving cars are programmed to drive a car like a teenage novice
    driver. This is not going to get us to the vaunted Level 5, which is a true AI
    self-driving car. Using the technique of purposeful “procrastination” is one of
