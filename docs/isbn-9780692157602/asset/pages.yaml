- pgno: 60
  md: '+   Lulled into overreliance


    The human driver begins to become over reliant on the AI driving the car. You’ve
    likely seen the videos of those idiots that put their head out out the window
    of the car and speak to the video camera about how great it is that the AI is
    driving the car. All it would take is for that car to get into a predicament and
    that head-out-the-window driver would likely get injured or killed (or, lose their
    head).


    +   Insufficient reaction time


    This is one of the most insidious aspects about a co-shared responsibility. Imagine
    a teenage driver that was about to ram into a brick wall and suddenly looked at
    you, the adult sitting in the passenger seat, and told you to take the wheel.
    Too little, too late. This is what is going to keep happening with today’s AI
    self-driving cars.


    +   Disjointed from the driving task


    Inevitably, the human driver is going to feel disjointed from the driving task.
    Even if you put all sorts of facial monitoring and eye monitoring, it’s an instictive
    kind of aspect that you are no longer solely responsible and so you feel less
    committed to the driving task. This is human nature.


    +   Unanticipated instantaneous engagement


    This idea that the human driver will need to become instantlyaneously engaged
    in the driving task, when meanwhile they’ve been only partially engaged, and that
    it will most likely occur in an unanticipated moment, this is another one of those
    seemingly impractical notions.


    +   Other


    You might already be aware that Google’s Waymo has been keen to develop an AI
    self-driving car and has tended towards achieving a Level 5. Why? One reason likely
    is that it removes the co-sharing of'
  merge: -1
