- pgno: 45
  md: 'Furthermore, each time that there has been a Tesla incident involving an activated
    Autopilot, the Tesla company has right away pointed the finger at the human driver.
    The human driver was not paying attention, they say. The use of the Autopilot
    requires an active human driver, they say, and emphasize that the Tesla owner''s
    manual states this, along with an on-screen message. According to the NHTSA though,
    “it’s not enough to put it in an owners'' manual and hope that drivers will read
    it and follow it.”


    Tesla claims that the human drivers do know that they are key to the driving task,
    as based on surveys that Tesla has conducted. Thus, when an accident occurs such
    as the March 2018 incident, they pointed out that: “The driver had received several
    visual and one audible hands-on warning earlier in the drive and the driver''s
    hands were not detected on the wheel for six seconds prior to the collision.”
    In other words, it is being implied that the human driver should have known —
    and was in a sense warned to be in-the-know, and yet the human driver failed to
    do so, and thus presumably the human driver is then responsible for the incident
