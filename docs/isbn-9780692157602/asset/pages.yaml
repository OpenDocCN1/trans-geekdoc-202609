    do. There are many driving situations wherein "procrastination" (the good kind)
    is actually handy to consider as part of the driving repertoire. Shouldn''t be
    used all the time. Shouldn''t be used indiscriminately. Should be used in the
    right situation, at the right time, in the right way.


    Some want us to achieve AI self-driving cars that can pass a variation of the
    Turing Test. This means that AI self-driving cars would be able to drive a car
    in the same manner that a human does. If we were standing outside and watching
