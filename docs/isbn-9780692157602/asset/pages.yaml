    # ## Is It Just Scale Or Something More


    There are proponents of the artificial neural network approach that say we just
    haven’t hit scale as yet. We have some seemingly large-scale neural networks involving
    thousands upon thousands of artificial neurons. But, the human brain is estimated
    to have 100 billion neurons, and an estimated 100 trillion connections.


    No man-made artificial neural network yet approaches that magnitude. The question
    many are asking is whether if we can actually create an artificial neural network
    of that same size, will we suddenly have ourselves a functioning mind?


    In essence, if you have two things that are about the same size, one a biological
    embodiment and the other some kind of machine or automation embodiment, will the
    machine version then be as capable as the biological version?


    We don’t know, but we do know that the way in which we are simulating neurons
    in an artificial neural network is not the same as the biological implementation
    in an actual brain, and so already we have the aspect of a difference between
    the two. Presumably, the artificial one being inherently inferior just by the
    “mechanics” of things alone, and so right away one might doubt the efficacy of
    by sheer size of counts of neurons and connections alone that this simulated approach'
