- pgno: 210
  md: '# APPENDIX A

    # TEACHING WITH THIS MATERIAL


    The material in this book can be readily used either as a supplemental to other
    content for a class, or it can also be used as a core set of textbook material
    for a specialized class. Classes where this material is most likely used include
    any classes at the college or university level that want to augment the class
    by offering thought provoking and educational essays about AI and self-driving
    cars.


    In particular, here are some aspects for class use:


    +   * **Computer Science.** Studying AI, autonomous vehicles, etc.

    * **Business.** Exploring technology and its adoption for business.

    * **Sociology.** Sociological views on the adoption and advancement of technology.


    Specialized classes at the undergraduate and graduate level can also make use
    of this material.


    For each chapter, consider whether you think the chapter provides material relevant
    to your course topic. There is plenty of opportunity to get the students thinking
    about the topic and force them to decide whether they agree or disagree with the
    points offered and positions taken. I would also encourage you to have the students
    do additional research beyond the chapter material presented (I provide next some
    suggested assignments they can do).'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# # RESEARCH ASSIGNMENTS ON THESE TOPICS


    Your students can find background material on these topics, doing so in various
    business and technical publications. I list below the top ranked AI related journals.
    For business publications, I would suggest the usual culprits such as the Harvard
    Business Review, Forbes, Fortune, WSJ, and the like.


    Here are some suggestions of homework or projects that you could assign to students:


    +   a) *Assignment for foundational AI research topic:* Research and prepare a
    paper and a presentation on a specific aspect of Deep AI, Machine Learning, ANN,
    etc. The paper should cite at least 3 reputable sources. Compare and contrast
    to what has been stated in this book.


    b) *Assignment for the Self-Driving Car topic:* Research and prepare a paper and
    Self-Driving Cars. Cite at least 3 reputable sources and analyze the characterizations.
    Compare and contrast to what has been stated in this book.


    c) *Assignment for a Business topic:* Research and prepare a paper and a presentation
    on businesses and advanced technology. What is hot, and what is not? Cite at least
    3 reputable sources. Compare and contrast to the depictions in this book.


    d) *Assignment to do a Startup:* Have the students prepare a paper about how they
    might startup a business in this realm. They must submit a sound Business Plan
    for the startup. They could also be asked to present their Business Plan and so
    should also have a presentation deck to coincide with it.


    You can certainly adjust the aforementioned assignments to fit to your particular
    needs and the class structure. You’ll notice that I ask for 3 reputable cited
    sources for the paper writing based assignments. I usually steer students toward
    “reputable” publications, since otherwise they will cite some oddball source that
    has no credentials other than that they happened to write something and post it
    onto the Internet. You can define “reputable” in whatever way you prefer, for
    example some faculty think Wikipedia is not reputable while others believe it
    is reputable and allow students to cite it.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The reason that I usually ask for at least 3 citations is that if the student
    only does one or two citations they usually settle on whatever they happened to
    find the fastest. By requiring three citations, it usually seems to force them
    to look around, explore, and end-up probably finding five or more, and then whittling
    it down to 3 that they will actually use.


    I have not specified the length of their papers, and leave that to you to tell
    the students what you prefer. For each of those assignments, you could end-up
    with a short one to two pager, or you could do a dissertation length paper. Base
    the length on whatever best fits for your class, and the credit amount of the
    assignment within the context of the other grading metrics you''ll be using for
    the class.


    I mention in the assignments that they are to do a paper and prepare a presentation.
    I usually try to get students to present their work. This is a good practice for
    what they will do in the business world. Most of the time, they will be required
    to prepare an analysis and present it. If you don''t have the class time or inclination
    to have the students present, then you can of course cut out the aspect of them
    putting together a presentation.


    If you want to point students toward highly ranked journals in AI, here''s a list
    of the top journals as reported by *various citation counts sources* (this list
    changes year to year):


    +   - Communications of the ACM

    - Artificial Intelligence

    - Cognitive Science

    - IEEE Transactions on Pattern Analysis and Machine Intelligence

    - Foundations and Trends in Machine Learning

    - Journal of Memory and Language

    - Cognitive Psychology

    - Neural Networks

    - IEEE Transactions on Neural Networks and Learning Systems

    - IEEE Intelligent Systems

    - Knowledge-based Systems'
