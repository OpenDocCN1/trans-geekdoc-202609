- pgno: 112
  md: '# CHAPTER 6

    START OVER AI

    AND SELF-DRIVING CARS


    When my daughter was quite young, we would go over to a nearby playground and
    she would gleefully enjoy going on the swings and the slides. One day, it had
    been raining, and so we went over to the playground but everything seemed too
    wet to play on. She noticed though that there was a little stream of water making
    its way across the playground, being driven by the leftover rain water on the
    grass that was draining along the now-made stream and flowing out to the street.


    She decided to pick a particular spot along the small stream, and began to make
    a tiny bridge made from twigs that were on the ground. This seemed like a quite
    inventive way to turn our otherwise rained-out visit to the playground into something
    fun to do. I watched in fascination as she tried to hook together twigs and make
    them into an arch over the inches-wide stream of rain water. At her young age,
    this seemed like quite a mental feat in that she had to discern how to intertwine
    the twigs, how to try and arch them over the water, and do so without having the
    structure fall into the stream itself.


    Well, it turns out that the structure became top heavy and collapsed into the
    stream. Away went most of the twigs. I thought she might get upset or at least
    stand-up and walk away in disgust. Instead, she pondered the result of her efforts.
    For about a solid minute, she looked at the stream, she looked at the twigs, she
    looked around the playground, and was lost in deep thought. I had no idea what
    she might'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'be thinking. Suddenly snapping into action, she went over and collected some
    scattered tree branches that had fallen during the storm, and also got other of
    nature''s leftovers such as fallen leaves. She then began to build anew a bridge
    across that stream. This version was going to likely last a thousand years.


    It was exciting to see that she had the tenacity to continue her quest. She did
    not give up. She reviewed what had occurred and carefully analyzed the situation.
    She re-examined the resources available to her. She re-planned what to do next.
    She carried out her plan. For a small child, these are wonderful signs of thoughtfulness
    and mindfulness. As you can imagine, I was elated to think that this was a precursor
    to what she would become as an adult. Indeed, this is how she turned out!


    # Anchors Can Weigh Us Down


    Why did I tell this story? Sometimes, we need to start over. It could be a system
    that you are coding at work and it has reached a point that there seems to be
    a dead end. Or, maybe you have a home project that has gotten bent out of shape.
    You could try to continue with what you started, but at times this can be worse
    than just starting over. When you build upon something already started, you often
    need to bend over backwards to make the new stuff fit. You become anchored to
    what was already done. If the already done aspects are not very good, you can
    become trapped and mired in what was there before.


    It''s the curse of the legacy.


    Whether it is just because it exists, or sometimes due to tradition, or for whatever
    reason, the past can cause our future to become pinched. Meanwhile, someone else
    comes along and sees a new future, and so they jump past the old ways. Some would
    say that Uber did this in the taxi business. The taxi business was mired in the
    old ways, you had to call to get a taxi, the taxi was often dirty and ugly, the
    driver was difficult to deal with, etc. Uber opted to skip past the conventional
    taxi and use a new form of taxi, everyday people driving in their everyday cars,
    and which you could contact via an app on your smartphone. It'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'was a jump that many at the time thought was crazy. They weren’t the only ones
    to see a different future, and so I want to make clear they alone did not have
    this vision, but nonetheless they were able to carry it out in a substantial way.


    Let’s revisit this whole notion about starting over and recast it into the field
    of Artificial Intelligence (AI).


    In an earlier era of the AI field, there was a great deal of fanfare and mania
    about so-called expert systems, sometimes also referred to as knowledge-based
    systems or rules-based systems. There was an entire sub-industry that sprang up
    to provide automated tools for knowledge acquisition, for knowledge encoding,
    and so on. The hope at the time was that this was the breakthrough towards building
    true AI systems that could exhibit intelligence and intelligent behavior.


    Though there was a lot accomplished during that era, it eventually became more
    apparent that it was not going to get us to the true sense of AI. Some of you
    might recall my writings and speeches from that era that said as such, and for
    which I cautioned that we shouldn’t be jumping the gun on what expert systems
    would ultimately gain us. For some people, they now say that we went from the
    AI spring to the AI winter, wherein after a let-down of expert systems there was
    a sense that we were still a long ways from true AI.


    During the expert systems heyday, there was also some action in the machine learning
    realm. The use of artificial neural networks was just beginning to come out of
    the research labs. Most of the neural networks were being built as prototypes.
    They were relatively small in size. Just a handful of layers. The number of neurons
    would number maybe in the hundreds at most. The mathematical properties were still
    being developed and explored. Tools to build neural networks tended to be clumsy
    and awkward to use. It was pretty much an arcane part of the AI field.


    The grand convergence of lower cost processors, higher performance processing,
    ready access to large data sets, and other factors then prompted artificial neural
    networks to regain attention. And, indeed, it has become the darling of the AI
    field. Seemingly'
