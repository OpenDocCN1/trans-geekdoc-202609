    # The Freezing Robot Problem


    The kind of freeze we are referring to is commonly called the Freezing Robot Problem
    (FRP).


    Imagine that an AI self-driving car is driving down the street. Up ahead is a
    street sign that kind of looks like a stop sign. It is bent and mauled. You’ve
    maybe seen these before — it looks like some hooligan decided to hang on the stop
    sign and bend it into a pretzel. Now, it could be that it isn’t really a stop
    sign at all, and it just is some kind of art piece that resembles a stop sign.
    Or, maybe it is indeed a legally valid stop sign and that in spite of the now
    bent out-of-shape structure it is really truly a stop which must be obeyed.


    In this murky aspect of trying to ascertain if the stop sign is true or not, it
    is possible to encounter the Freezing Robot Problem. Here’s how.


    Let’s assume that the self-driving car is approaching the sign and has ten seconds
    until it reaches where the sign is posted. We now have a time limit – a decision
    needs to be made within no later than 10 seconds. If the decision occurs at 15
    seconds, it’s too late and the self-driving car would likely have already driven
    past the sign, having merely continued forward since there was no other command
    from the AI otherwise. If it really is a stop sign, the self-driving car has then
    broken the law, and possibly endangered other cars and pedestrians.


    Some AI self-driving car pundits claim that a self-driving car will never break
    the law, for which I say hogwash.


