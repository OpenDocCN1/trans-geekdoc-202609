- pgno: 196
  md: '# CHAPTER 13


    # SINGULARITY AI

    AND SELF-DRIVING CARS


    AI of today is considered narrow, brittle, and not at all near to what any of
    us might reasonably agree is a true sense of intelligence. Today''s AI is exciting
    and helping to advance the role and capabilities of computers, but do not mistake
    this advancement with becoming sentient. Being able to beat top chess masters
    or Go players with today''s computing capabilities is not a sign of true overall
    computer-based intelligence. With faster processors and machine learning and lots
    of data, we still don''t have our finger on what it means to achieve agency. In
    a sense, we are still on the path of computational empowerment– and the grand
    question is whether somehow someway someday that with maybe a startling breakthrough
    we might tip over into true intelligence. It''s the essential tipping point.


    Are you the person that''s is going to have some flash of insight that gets us
    across the chasm between contemporary narrow AI and over into AGI (Artificial
    General Intelligence)?


    I hope so! I''m pulling for you to be the one. AGI is the nirvana that most AI
    researchers are aiming to reach. AGI would be a system that can exhibit the kind
    of intelligence that you see even in a young child, combining aspects of common
    sense reasoning with overall reasoning and with whatever else we want to ascribe
    to intelligent behavior. I would say that those of us slaving away at AI for all
    so many years are hoping that others will come along and jump on our shoulders
    and get us to the next step in AI evolution.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'There are some that believe you’d be better off forgetting what has already
    been done in AI, and start with a blank sheet. Maybe the ways we’ve devised so
    far are really a dead-end. You might try mightily to get to the next step, and
    it won’t ever happen because you are mired in what was done in the past. Thus,
    some say that you should shove aside the AI of today and think anew. I say if
    that will get us to AGI, go for it. Seems a bit over-the-top and I would think
    that even if what has been done today, even if the wrong path, we could learn
    from it and go toward another direction, but anyway, if it’s too much of an anchor
    than I am with you to drop it cold.


    Suppose we get to AGI, then what happens?


    Some would say that we would have true AI. We would presumably have robots that
    actually can do the intelligent things that people do. It’s an open debate whether
    robots could physically do what humans do at that juncture. In other words, maybe
    we aren’t yet able to perfect the physical mechanisms of robots and so we have
    otherwise been able to imbue them with mental intelligence but not yet physically
    built them to be like humans. Some believe that there is a tie between us humans
    in terms of our bodies and our mental processes, such that a robot won’t be able
    to be as intelligent as a human unless it has a “body” akin to a human body. Others
    eschew this connection and say that you can have any kind of robot you want, having
    no body per se or some other kind of “body” and that it just won’t matter – the
    intelligence is a different beast altogether.


    So, let’s say for the moment we do reach AGI, and it maybe it is in a robot or
    maybe not, since we aren’t sure whether the body aspects matter for reaching AGI.
    Does anything come after AGI, or is AGI the final end-point of artificial intelligence?


    # Artificial Superintelligence, a Step Beyond AGI


    Well, some would say that there might be a step beyond AGI, namely ASI (Artificial
    Superintelligence). ASI would be the exceeding of human intelligence. AGI arrives
    at what we consider everyday intelligence, while ASI takes us beyond Einstein
    and beyond any kind'
