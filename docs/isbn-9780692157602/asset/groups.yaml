    In this analysis, I’ve opted to not get mired into the ongoing debate about who
    is responsible for the acts of a self-driving car in these kinds of incidents.
    As Tesla has made very clear, their view is that the human driver is ultimately
    responsible for the driving of the Tesla cars: “Autopilot is intended for use
    only with a fully attentive driver,” furthermore it “does not prevent all accidents
    – such a standard would be impossible – but it makes them much less likely to
    occur.”


    I’ve written and spoken many times about the issue of the notion that self-driving
    cars and their human drivers are co-sharing responsibility. It’s something as
    a society we need to carefully consider.


    For those of you that are interested in these kinds of self-driving car crash
    analyses, I’ll be updating my analysis once there is more reporting by the NTSB
    about this incident. The end result will hopefully make us all aware of the potential
    limitations of self-driving cars and allow us all as a society to make further
    informed decisions about what we expect of them. This also should aid auto makers
    and tech firms in determining what kind of safety aspects they should be including
    in their AI systems and how to try and make self-driving cars as safe as feasible.'
