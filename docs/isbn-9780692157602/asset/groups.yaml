    特斯拉声称，根据特斯拉进行的调查，人类驾驶员知道他们在驾驶任务中的关键作用。因此，当如2018年3月那样的事故发生时，他们指出：“在之前的行驶过程中，驾驶员收到了多次视觉警告和一次听觉脱离警告，且在碰撞发生前的六秒内，未检测到驾驶员的手放在方向盘上。”
