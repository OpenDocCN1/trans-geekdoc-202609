    info will be analyzed and fed to the traffic signals so that the traffic signals
    can adjust their timing. This could greatly reduce gridlock.


    Your AI self-driving car might also get connected to these traffic analytics.
    Perhaps your AI self-driving car realizes that the traffic for the next six blocks
    is slowed due to the traffic signals at the intersections straight ahead. It might
    be able to predict that if the self-driving car makes a right turn up ahead and
    then goes onto another street, the self-driving car can avoid the bottlenecks
    up ahead. The AI could either opt to take the alternative route, or speak to the
    human occupant and ask permission first whether the alternative path is OK with
    them.


    ## V2I and V2V Communications


    There will be the advent of V2I (vehicle to infrastructure) for AI self-driving
    cars. This means that AI self-driving cars will be able to electronically communicate
    with the street infrastructure, including the traffic signals, and with bridges
    (which can indicate how crowded they are), and tolls, etc. All of that will aid
    in navigating traffic signals. There is also going to be V2V (vehicle to vehicle
    communications), involving self-driving cars electronically communicating with
    other self-driving cars. This will be handy akin to my earlier example of cars
    around you that are coming to a stop at an intersection – not only would the AI
    self-driving car presumably directly detect this, but the other self-driving cars
    might be sharing with your AI self-driving car that they have detected that the
    intersection up ahead has a broken traffic signal so they are all coming to a
    stop.


    ## Risks and Ethical Questions


    Smart traffic signals might have some unintended consequences. Suppose a hacker
    was able to connect to a traffic signal and force it to show whatever red/yellow/green
    the hacker wanted to display. Suppose the traffic signals are all interconnected
    so as to allow for timed activity across the entire city, but then the hacker
    can opt to control all of those at once. There is also the privacy aspects that
    maybe a traffic signal is observing traffic and capturing license plates or other
    info about the cars passing through the intersection – would this be a good thing
    or a bad thing? It might help when trying to find criminals, but it might be used
    for nefarious violations of privacy.


