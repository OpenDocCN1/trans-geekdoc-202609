    cannot be designing AI self-driving cars for only the day in which we have exclusively
    AI self-driving cars, since we are putting AI self-driving cars on our streets
    today. The streets today and for the foreseeable future will have human driven
    cars. That’s a fact.


    This brings up another aspect about AI self-driving cars that is worthy of important
    consideration about nighttime driving. There are predictions that we will likely
    be using AI self-driving cars on a round-the-clock basis. And, it makes sense
    to do so. You have a car that will go wherever you want it to, with a built-in
    driver that doesn’t need to rest. If you own an AI self-driving car, you are likely
    to turn it into a revenue generating ridesharing vehicle. Most AI self-driving
    cars will probably be driving around on a 24x7 basis.


    How does this tie into nighttime driving? It means that as AI self-driving cars
    become more popular and prevalent, there will be more and more of them on our
    roadways at nighttime. This means a higher likelihood of getting entangled with
    a drunken human driver or a drowsy human driver. It would seem a reasonable bet
    that the first rash of AI self-driving car accidents will most likely arise at
    nighttime, once AI self-driving cars become prevalent.


    What might hopefully aid in offsetting the encounters with human drunk drivers
    will be that those humans that were going to drive drunk will instead use a ride
    sharing service, of which, maybe there will be an abundance due to the prevalence
    of AI self-driving cars. This does though bring up the aspect that some ask me
    about at conferences, namely, how will an AI self-driving car handle a drunken
    occupant?


    If you have a human driver for say Uber or Lyft, the human driver sometimes will
    talk with the human drunken passenger or even physically aid them to get into
    and out of the vehicle. The AI is not going to be able to do the same, for now.
    I’ve mentioned that most AI self-driving cars will be outfitted with cameras pointing
    into the car, and audio capabilities, such that the human owner of the AI self-driving
    car can at least see and talk with the human occupants.


    There are more twists and turns about nighttime driving for AI self-driving cars.
    Imagine that it is nighttime and there are heavy rains coming down. When you combine
    the weather with the nighttime aspects, it can be a potent danger for any driver,
    human or AI.


    Another twist is roadwork. Generally, most of the roadwork that we have done on
    our infrastructure is done at nighttime, which is done to reduce the adverse impact
    to daytime traffic. For the AI to contend with roadwork can be difficult, and
    especially so at nighttime. Trying to figure out that the street is coned off
    and you can’t make a right turn up ahead, it’s not easy to do at nighttime.


    As they say, do not go gentle into that good night, but instead rage, rage against
    the dying of the light. We need to have AI systems for self-driving cars that
    realize there is a difference between daylight driving and nighttime driving.
    Treating daylight as the same as nighttime, or assuming that nighttime driving
    is equivalent to daytime, it’s a dangerous trap that could cause a grave and overbearing
    darkness to descend upon the future of AI self-driving cars.


