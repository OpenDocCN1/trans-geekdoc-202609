  - '[PAGE 47]


    made by an auto maker or tech firm about what the AI self-driving car can do.
    On the right, we''ll stack what the AI self-driving car can actually do. Right
    now, some would say that Tesla has too much on the left, and so the equation is
    unbalanced in comparison to what is on the right side of the equation.


    Presumably, any such auto maker or tech firm needs to reach a balanced equation,
    and to do so will either need to subtract something from the left to bring it
    down to the actual capabilities indicated on the right side of the equation, or,
    they will need to increase the capabilities on the right side to match the inflated
    expectations on the left side. By far, changing the left side is faster to achieve
    than changing the right side.


    # ## Responsibility and AI Self-Driving Cars


    Let’s revisit the scooter wars. Who is responsible for the proper use of the motorized
    scooters that are being rented? You might say that it is the human “driver” that
    has rented the scooter, they are the responsible party. This seems to make sense.
    They rented it, they should use it properly. There are those though that say the
    scooter rental firm is responsible, they are the responsible party. This seems
    to make sense. They provided the scooter for rental, and so they should be ensuring
    that however it is used that it is used in a proper manner.


    This can be likened to AI self-driving cars.


    Who is responsible for an AI self-driving car and its actions?


    You might say that the human driver is the responsible party. Or, you might say
    that the auto maker is the responsible party. We might also consider that it could
    be the AI system that’s responsible, or maybe the AI maker, or perhaps an insurance
    firm that is insuring the self-driving car, or maybe the human occupants (even
    if not driving the vehicle).


    Take a look at Figure 1.'
  - '[PAGE 48]


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_48_0.png)


    # Elliot Framework: AI Self-Driving Car Responsible Parties


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_48_1.png)


    Copyright © 2018 The 2nd BFIJN Cyberspace Self-Driving Car Biennial.'
  - '[PAGE 49]


    Is it only one of those parties that holds the sole and entire responsibility?


    Maybe. You might contend it is solely and completely the human driver that is
    to be held responsible for the action of the AI self-driving car. Or, maybe you
    take the position that it is solely and completely the auto maker. The odds are
    that we''ll likely consider it to be some kind of shared responsibility. It might
    be a combination of the auto maker and the AI makers that are held responsible.
    Or, maybe a combination of the auto maker, the AI maker, and the human driver.


    See Figure 2.


    In the case of the AI self-driving car, we need to consider the level of the self-driving
    car.'
  - '[PAGE 50]


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_50_0.png)


    41'
  - '[PAGE 51]


    At the Level 5, the true self-driving car, we presumably can say that it is not
    the responsibility of the human driver since presumably there will not be a human
    driver and not even a provision to have a human driver in the self-driving car
    (all humans will be more occupants, not drivers).


    See Figure 3.'
  - '[PAGE 52]


    # **Figure 3**

    Eliot Framework: Responsibility and AI Self-Driving Cars


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_52_0.png)'
  - '[PAGE 53]


    When we''re in the levels less than 5, it’s pretty much the standard definition
    that the human driver is responsible for the actions of the self-driving car.
    But, there''s definite wiggle room since the AI could have done something untoward,
    and thus it raises the question of whether even a human driver that was attentive
    and ready to take action, whether or not the human can still be held responsible.


    I''ve analyzed this in my exploration of the human back-up drivers that are currently
    being used in self-driving cars that are being tested on our public roadways.
    Suppose you put a human driver into a self-driving car, you tell them they are
    ultimately responsible for the actions of the car, but then when an accident is
    about to happen the AI hands-over the car controls to the human with only a split-second
    left to go. Can the human be reasonably expected to really take any action? Is
    it “fair and reasonable” to still say that it was the human driver at fault?


    # ## Co-Shared Responsibility


    When I was in college, I moved into a house with three other roommates, having
    come from my own apartment that had just me in it. I at first thought it would
    be a blast and we''d have nonstop fun, kind of our own version of Animal House.
    What I discovered pretty quickly was that the food I left in the refrigerator
    would mysteriously disappear (this never happened in my own apartment!). We had
    one bathroom for all of us, and invariably it was turned into a pig sty, and nobody
    took responsibility for how it got that way (just by osmosis, I guess).


    Things got so bad that we had a toilet paper roll “battle” that consisted of no
    one wanting to go to the trouble to put a new toilet roll into the bathroom (it
    would have meant having the foresight to buy a roll and have it ready, and actually
    take the old one off and put the new one on). As the toilet paper roll neared
    the end of its available tissues, we all began taking less and less, in hopes
    that someone else would get stuck with the roll being essentially empty and then
    forced into changing the paper roll. We''d end-up with one ply left. Then, one
    half of that (a household member used just half for the needed purpose). Then,
    half of that half (it''s amazing and surprising how much'
  - '[PAGE 54]


    a quarter of a ply can do for you). And so on. It’s funny to think about it now,
    but we were actually serious about it at the time.


    The point to the story is that when in a shared responsibility situation, you
    need to have some pretty clear-cut rules about how the responsibility is to be
    shared. If you don’t have ground rules, it can be chaos, since the joint responsibility
    is muddled.


    Take a look at Figure 4.'
  - '[PAGE 55]


    # Figure 4


    # Eliot Framework: AI Self-Driving Car Responsible Parties


    Human Driver


    Sole responsibility for driving


    Conventional car


    AI System


    Sole responsibility for driving


    True Level 4 car


    Human Driver + AI System


    Co-drivers shared responsibility for driving'
  - '[PAGE 56]


    For a conventional car, I think we can pretty much agree that the human driver
    is the responsible party. Of course, there are exceptions, such as if the wheels
    fall off the car because the auto maker made them defective, etc.


    With less-than-Level 5 self-driving car, we''re going to have a co-shared responsibility.
    Now, I''m not necessarily talking about legal responsibility for the moment and
    would like to just take a look at the more practical technical aspects about this
    co-sharing arrangement.


    Here''s where the rub is. When you put the AI system and the human driver into
    a co-shared responsibility situation, they each need to “know” what the other
    is supposed to do. This also needs to be achieved in some practical manner. I
    say this because many of the AI developers and the auto makers and tech firms
    are not treating this in a truly practical way.


    Let''s consider some of the key ways in which the responsibility can get muddled
    and focus on the human driver aspects thereof: (See Fig. 5.)'
  - '[PAGE 57]


    # Eliot Framework: AI Self-Driving Car Responsible Parties


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_57_0.png)


    +   - Unclear on task sharing responsibilities

    - Lack of situational awareness

    - Incrementally growing complacency

    - Dulled alertness

    - Manual distractions

    - Physical mispositioning for task

    - Confused about Theory of Mind re: AI

    - False assumptions about safety

    - Lulled into overreliance

    - Insufficient reaction time

    - Disjoined from the driving task

    - Unanticipated instantaneous engagement

    - Other


    # Figure 5

    Human Driver – Modified Responsibility beliefs.'
  - '[PAGE 58]


    +   - Unclear on task sharing responsibilities


    First of all, the human driver needs to be completely and utterly clear about
    the task sharing duties. Who does what, and when, and why, and how. This is not
    easy to ensure. Humans, as we''ve seen with the scooters, will tend to ignore
    warnings and cautions, and do what they think they want to do. Same goes for AI
    self-driving cars.


    +   - Lack of situational awareness


    The human driver tends to drift away from the situational awareness that normally
    occurs when they are fully responsible for the driving task. It is easy to begin
    to believe that the situation is being handled, and so you don''t need to stay
    on the edge of your seat. The problem is that when the human driver is needed,
    it often involves a split-second decision and action, all of which depend on having
    an immediate situational awareness.


    +   - Incrementally growing complacency


    Humans tend to get complacent. If the AI seems to be driving, and the more that
    it happens, the more complacent you become. You aren''t thinking about those instantaneous
    situations like a tire blowing out or a truck that is mistakenly parked in the
    middle of the road. Most of our daily driving is relatively routine. The AI generally
    handles routine driving. Therefore, humans become complacent.


    +   - Dulled alertness


    Humans alertness gets dulled. You really can''t expect someone to be watching
    out continuously when they are under the belief that the AI is generally able
    to drive the car. When you are solely driving the car, you know that you need
    to be alert. When "someone else" (something else) is driving the car, you let
    your guard down.'
