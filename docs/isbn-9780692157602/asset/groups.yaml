    \ a lane and it’s all based on visual sight. There might not be any markings at\
    \ all, and it’s just a gut feel as to where the lanes are supposed to be. In addition,\
    \ there can be special occasions when a lane is marked by orange cones, creating\
    \ a temporary lane such as after a car crash and the police are trying to redirect\
    \ traffic.\n\nUntil the day arrives that we have flying cars, we all need to be\
