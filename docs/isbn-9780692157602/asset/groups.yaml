    Court ruled that online retailers will now be required to collect sales taxes
    in states for which those online firms have no actual physical presence, assuming
    that the respective state wants those retailers to collect such taxes (duh, yes,
    most states if not all will – it’s “free” revenue for the state!). Brick-and-mortar
    firms cheered feverishly and popped champagne when they heard the ruling. Online
    retailers cursed out loud and were dreading this possible decision.


    Here’s the skinny.


    At the start of the 1990’s, the Supreme Court had ruled in the Quill Corporation
    versus North Dakota case that online retailers could not be forced to pay sales
    taxes in states for which they did not have a substantial connection in. Pretty
    much if the online retailer had no physical offices or warehouses in a state,
    it was nearly impossible for the state to try and hit them with sales taxes.


    For online retailers, this was a godsend.


    First, it meant that their goods could be sold without having to include the added
    cost of sales tax in the state for which an item was ordered by a customer. Physical
    stores were maddened at this decision

