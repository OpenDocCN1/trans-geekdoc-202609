    are brain dead. At least call the self-driving car a Frankenstein, which though
    considered a monster, it did have something of a brain.


    ### Zombie-cars usage taxes?


    Yes, there will likely be usage taxes imposed onto zombie-cars. Well, another
    way to phrase things is that there are going to be “self-driving car” usage taxes,
    which if OK with you is how I will refer to it henceforth herein. Just don’t like
    the connotations about those zombies.


    Let’s consider what will happen once AI self-driving cars become prevalent. Most
    are predicting that self-driving cars will be working non-stop. You have a built-in
    chauffeur that never sleeps and is always available to drive the car. When you
    are at work, no sense in having your AI self-driving car sitting out in the parking
    lot. Put it to use! Especially if you can make money by doing so. The odds are
    that most people that own a self-driving car are going to turn it into a ridesharing
    revenue source. Running it essentially 24x7, you can recoup the costs of the self-driving
    car (hopefully) and maybe make a profit besides.


    Where is your non-stop AI self-driving car going to go? If you live in city Y,
    you’ll most likely want to keep your self-driving car relatively close in case
    you need it, so you’ll rideshare it for people in city Y that need to get a lift.
    Suppose that there are hundreds, maybe thousands of these AI self-driving cars,
    all cruising around your city. It would be akin to an Uber driver that is cruising
    around, waiting for a request for a pick-up.


    You probably won’t have the self-driving car be parked, and instead keep it moving.
    You’ll likely even be using some kind of Big Data analytics system that will help
    predict where your self-driving car should be. If it’s nearing 2 a.m. and the
    bars are closing, seems like that’s the part of town where your ridesharing AI
    self-driving car ought to be.


    Anyway, imagine these self-driving cars crisscrossing city Y. Seems like it will
    impact the roads there in city Y. Today, during late hours, those roads are hardly
    used. In the future, there might be roads that are getting non-stop usage. Non-stop
    usage of the roads means they’ll wear out more. Roads that wear out more need
    greater amount of upkeep and repairs. Greater upkeep and repairs costs money.
    Where will the money come from for those rising costs? Answer: AI self-driving
    cars.


    You can expect that local cities, the states, and the federal government will
    allow wake-up and realize that the popularity of AI self-driving cars has caused
    a tremendous strain on the roadway infrastructure. If the cause of the problem
    is due to AI self-driving cars, perhaps make that cause also be the solution.
    Impose a usage fee on AI self-driving cars. The money raised would presumably
    go towards the infrastructure that supports those roving beasts.


    Of course, there are some governmental entities that might opt to use the money
    for some other purpose entirely. They might decide that spending the money on
    homelessness or other local societal aspects is preferred over spending it on
    infrastructure. The infrastructure angle is usually the way to get society to
    buy into the usage fee, since it suggests a tit-for-tat. If the AI self-driving
    cars caused added costs for infrastructure, they should pay for it. That would
    seem fair to most, though maybe not necessarily to the owners of the AI self-driving
    cars. On the other hand, once a government finds a spigot that pours out money,
    they’ll likely spend it as they wish.


    This brings up an important point that ties back to the online retailers and the
    sales taxes by state. Remember that it was viewed as a crucial breathing space
    for online retailers to grow and prosper by not having had a sales tax burden
    to meet. Would the imposition of a usage fee possibly curb or disrupt the advent
    of AI self-driving cars? If so, do we want to cause an innovation that appears
    to have great societal payoffs get “harmed” by having to deal with usage fees?
