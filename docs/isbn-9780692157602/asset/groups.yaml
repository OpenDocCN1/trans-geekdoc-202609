    potentially lead to the AI “freezing up” and not performing some needed action
    on a timely basis.


    There is another possible kind of freeze that could happen with the AI system
    that is a little bit different than for humans. With most humans, if the human
    gets frozen, you can usually snap them out of it. I suppose there are circumstances
    wherein a human goes into a coma, and in that case you might say they have a more
    definitive and long lasting freeze. Anyway, I’m sure you’ve had your PC freeze
    up on you and it won’t do anything at all.


    ## Blue Screen of Death Scary for a Self-Driving Car


    Imagine that an AI self-driving car system gets itself into a frozen state akin
    to having the Windows blue screen of death. That’s an especially scary proposition
    for a self-driving car. At least with the other types of Robot Freezing there
    is a chance that the AI quickly overcomes the freeze, but in the case of a more
    catastrophic freeze, the question arises as to how soon the AI system can do a
    reboot or otherwise overcome the freezing.


    Furthermore, even if the AI can do some kind of reboot of itself, pretend that
    the AI self-driving car has been barreling along on the freeway at 70 miles per
    hour. If the AI system goes “unconscious” for even a few seconds, it can have
    devastating consequences. This is why the more careful auto makers and tech firms
    are building into their AI systems a lot of redundancy and resiliency. The act
    of driving a car is something that has life or death consequences. The AI system
    needs to be able to work in real-time and deal with whatever bad things might
    come at it, which also includes the notion that within itself it gets somehow
    mired or frozen.


    The other aspect to consider is that if the Robot Freezing Problem does occur,
    what provision does the AI have to proceed once it gets out of the frozen mode.
    It’s like when your PC crashes on you and when you bring it up after doing a reboot,
    Word shows you a recovered document that you were working on. The AI of the self-driving
    car has to know what the latest status was before the freeze, and rapidly figure
    out what has happened since then. This kind of catch-up needs to happen in real-time
    and while at the same time presumably still be properly controlling the car.


    One approach involves having a core part of the AI system that is supposedly always
    on and nearly impossible to have go under. No matter how badly the rest of the
    AI gets, the core part is intended to still be in action. This could allow the
    self-driving car to then be slowed down and moved over to the side of the road,
    or take some other emergency action to try and safely get the self-driving car
    out of any driving situation that could lead to dire results.


    Currently, the efforts involving the AI core are often not extensively tested
    by the auto maker or tech firm. Right now, the goal is to get the AI self-driving
    car to perform as a driver of the car. Keep the car in the lanes. Make sure to
    stop at stop signs. And so on. They pretty much assume that when the AI core is
    invoked, it will work properly to put the self-driving car into a safer place.
    It often is not tried in a wide variety of circumstances and just assumed that
    no matter where the car is when it is invoked, it will work as intended. Until
    we get more AI self-driving cars on the roadways, and have circumstances of the
    AI core getting invoked, we might not know how well these AI cores will really
    function when needed.


    Some key principles for good AI self-driving car systems is that they must be
    continually aware of time. They must be watching the clock and determining whether
    anything that is running has gone amok or has perhaps overlooked its allotted
    time or otherwise is not dancing to the needs of the overall operation and safety
    of the self-driving car. The clock must get top priority. This though also means
    that the clock watching cannot itself become a problem. Sometimes you can have
    a racing condition wherein all that happens in a real-time system is getting clock
    interrupts and as a result actions get delayed or confused.


    There are going to be situations of a no-win nature that the AI system must deal
    with. There’s the famous trolley problem, consisting of having to decide between
    whether the self-driving car should run into a tree to avoid hitting a child in
    the street, but hitting the tree might kill the occupants of the car. If the self-driving
    car does not swerve to hit the tree, it might kill the child standing in the street.
    The AI components involved in trying to make this kind of ethical decision could
    take too much time and by default run into the child, or might get into a tussle
    with each other internally and jam the whole AI system from functioning. This
    can’t be allowed to happen. Presumably. Hopefully.


    One other aspect that needs to be considered is the human driver in a self-driving
    car that’s less than a level 5. A level 5 self-driving car does not have a human
    driver and takes on the driving task, while for self-driving cars at less than
    a level 5 the self-driving car essentially co-shares the driving with the human,
    though it is considered that the human driver is ultimately responsible for the
    self-driving car. Suppose the AI encounters the Robot Freezing Problem – will
    the human driver even know that it has happened? Will the AI have sufficient core
    capability to alert the human driver? Will the human driver have enough time available
    to take over the controls of the self-driving car?


    Imagine that you are out camping with a good friend of yours. You are both hiking
    together in the woods. All of a sudden, your friend freezes up. You don’t know
    why. You can see that he’s frozen. But, you don’t know why and you don’t know
    how long he will stay in that frozen state. You start looking around, suspecting
    that maybe a bear is nearby and your friend has seen it. There could though be
    lots of other reasons why your friend is frozen. As the human driver in an AI
    self-driving car, you could be in the same circumstance. You don’t know why the
    AI has frozen, and you don’t know how long it will last. This is ultimately going
    to happen and we don’t yet know what the end result will be.


    Once we have a large volume of self-driving cars on the roadways, ones that are
    at the less than level 5, we’re likely to encounter situations that get the AI
    into the Robot Freeze Problem. Let’s aim to be ready for it, beforehand.


