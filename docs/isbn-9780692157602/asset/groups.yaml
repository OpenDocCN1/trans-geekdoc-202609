    ## 逆时针旋转


    根据美国国家运输安全委员会（NTSB）关于山景城事件的报告，该报告指出特斯拉以每小时71英里的速度撞击了减速缓冲器，随后碰撞“使特斯拉发生逆时针旋转”，并最终“导致车辆前部分离”。我认为我们都同意，以每小时71英里的速度撞击减速缓冲器等物体会产生巨大的冲击力，显然事实也确实如此，因为撞击导致了特斯拉前部的分离。这是一次猛烈的撞击。我想没有人会对这一点提出异议。


    有趣的是特斯拉发生逆时针旋转这一概念。我尚未看到有人对此方面发表评论。我将对此进行推测。如果特斯拉是完全正面撞击减速缓冲器，我们需要研究结果的物理学原理，但这通常可能不会导致特斯拉旋转。更有可能的是，特斯拉是在车辆的前缘某处撞击了缓冲器，例如车头前缘的左侧或右侧。这种撞击在碰撞后更容易产生旋转效果。既然特斯拉显然是逆时针旋转的，我们暂时假设它撞击了特斯拉车头的左侧边缘，这使得左侧卡在了减速缓冲器上，而特斯拉的右侧继续向前，导致车辆以左侧为支点旋转，从而呈逆时针方向转动。这完全是推测，我们需要看看
    NTSB 对此有什么说法。


    我稍后会将解释为什么我认为这种逆时针旋转是一个有用的线索。


    ### 事故 aftermath（后果）


    在发生碰撞并旋转后，特斯拉卷入了一起后续碰撞，涉及另外两辆据称正在向南行驶的车辆，它们无意中被卷入事件。我暂且假设这些额外的碰撞与初始事故本身没有直接关系，只是事故
    aftermath 的一部分。


    我为这些后续碰撞的发生感到难过，这也提醒了我之前的观点：涉及自动驾驶汽车的事故并不一定仅限于影响驾驶员，还可能包括那些被级联碰撞波及的无辜路人。根据 NTSB
    报告，其中一名其他驾驶员受轻伤，另一名未受伤。我认为这几乎是个奇迹。无论导致初始事故的原因是什么，随后的后果往往都可能是可怕的。


    NTSB 报告还提到，特斯拉中的 400 伏锂离子电池高压电池在事故中被损坏后起火，并引发了事故后火灾（这类火灾可能非常猛烈；消防部门赶到并成功扑灭了火）。令人欣慰的是，NTSB
    报告实际上暗示围观者下车来救援特斯拉内的驾驶员，尽管火灾危险重重，他们仍勇敢地将他从车辆中救出。NTSB 报告表明，特斯拉驾驶员被送往医院，但随后因伤势过重在那里去世。无论如何，我钦佩那些勇敢救援他的人。


    ### 事故现场布局


    NTSB 初步报告没有展示事故现场的布局图。我使用谷歌地图试图弄清事故现场的样子。这无疑是推测。最终的 NTSB 报告应该会正式描述事故现场，通常基于调查团队在现场拍摄的照片和物证。


    根据我能判断的情况，事故似乎发生在美国 101 号公路（US-101）继续前行车道与驶向 85 号州道（SH-85）的左侧出口匝道分叉处。两个车道之间似乎有一个三角形形状的“分流区域”（gore
    area）。我确定你以前见过这种情况。你有两条并排行驶的车道，在前方某处它们分开。在分叉处，一条车道直行，另一条车道转弯。在分叉处之间是一个分隔两条车道的三角形区域。在这种情况下，该分流区域有一道混凝土中央隔离带，且混凝土隔离带的前缘装有减速缓冲器。


    据推测，在分叉前一段时间内，有两条 HOV（高容量车道）通向该分叉点。一条 HOV 车道供继续行驶在 US-101 上的车辆使用，另一条供希望左转驶出 US-101
    前往 SH-85 的车辆使用。我不确定事故是否确切发生在此处。如我所说，我只是看了谷歌地图，并根据 NTSB 目前提供的有限细节进行了猜测。


    见图 1。


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_100_0.png)


    ### 事故时间


    关于事故的关键方面包含在 NTSB 目前报告的时间细节中。


    根据 NTSB，在事故发生前 18 分 55 秒，自动辅助驾驶（Autopilot）已启动。显然，此后它一直保持启动状态。这一点很重要，因为如果自动辅助驾驶未启动，我们可能根本不会讨论这些内容；通常这只会被视为一起传统事故，因为特斯拉将像普通日常车辆一样运行。此外，如果自动辅助驾驶是在事故发生前几秒才突然启动的，我们可能会认为自动辅助驾驶没有足够的时间启动，因此它并不是事故的主要参与者。在这种情况下，似乎自动辅助驾驶一直开启，在事故发生前已运行了相当长的时间，且在事故发生时仍处于开启状态。


    请看图 2。


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_102_0.png)


    **事故前 8 秒**


    | 事故前秒数 | t-8 | t-7 | t-6 | t-5 | t-4 | t-3 | t-2 | t-1 | t | t+1 | t+2 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
    :--- |

    | **自动辅助驾驶状态** | 自动辅助驾驶已启动 | 修正（Nudge）已启动 | 修正已启动 | 修正已启动 | 修正已启动 | 修正已启动 | 修正已启动
    | 修正已启动 | 修正已启动 | 修正已启动 | 自动辅助驾驶已启动 |

    | **前车（若检测到）** | 跟随前车 | 跟随前车 | 前车 | 横向 | 横向 | 横向 | 跟随 | 横向 | 无 | 检测到车辆 | 无 |

    | **转向** | 跟随 | 跟随 | 跟随 | 跟随 | 跟随 | 跟随 | 跟随 | 横向 | 跟随 | 左转 | 左转 |

    | **速度** | 75kph | 75kph | 75kph | 75kph | 75kph | 75kph | 75kph | 75kph | 75kph
    | 75kph | 75kph |

    | **手是否扶方向盘** | | | | | 手未扶方向盘 | 手未扶方向盘 | 手未扶方向盘 | 手未扶方向盘 | 手未扶方向盘 | 手未扶方向盘 |
    手未扶方向盘 |

    | **制动** | 未制动 | 未制动 | 未制动 | 未制动 | 未制动 | 未制动 | 未制动 | 未制动 | 未制动 | 未制动 | 未制动 |

    | **规避行动** | 无规避行动 | 无规避行动 | 无规避行动 | 无规避行动 | 无规避行动 | 无规避行动 | 无规避行动 | 无规避行动 | 无规避行动
    | 无规避行动 | 无规避行动 |


    据报道，特斯拉在事故发生前 8 秒正在跟随前车（甚至可能更早就在跟随，但我们尚不清楚），而在事故发生前 4 秒时，它不再跟随前车。对于不熟悉自动驾驶汽车的人来说，它们通常采用一种“排笛手”（pied
    piper）式的驾驶方法。它们发现前方有车，然后试图匹配那辆车的节奏。如果前车加速，自动驾驶汽车也会加速，但仅限于某个最大值，例如限速或通过车内人类驾驶员设定的巡航控制速度。如果前车减速，自动驾驶汽车往往会随之减速。


    正如我多次说过，这种“排笛手”方法极其简单。这是青少年新手驾驶员在初学驾驶时所做的，但他们很快会意识到这种方法有很多缺点。如果这种方法没有通过更复杂的驾驶技术进行增强，它的实用性是有限的。顺便提一下，请记住今天的特斯拉车型被认为处于
    2 级或 3 级，但尚未达到真正的 5 级，而 5 级是指 AI 可以完全驾驶汽车而无需任何人类干预的自动驾驶汽车。在低于 5 级的水平上，无论“自动驾驶汽车”能做什么或被暗示能做什么，人类驾驶员仍被视为车辆的驾驶员。


    一旦前车不再位于特斯拉前方，据报道特斯拉随后加速了，因为它在跟随前车时速度为每小时 62 英里，而在假设前方空间无障碍的情况下，它在事故发生时将速度提高到了每小时
    71 英里。这在逻辑上是“说得通的”，因为如果系统认为没有前方车辆会阻碍行驶，它会旨在达到允许的最大速度。NTSB 表示，驾驶员将巡航控制设定为最高 75
    英里/小时，因此特斯拉可能正试图加速到该指定速度。作为附带说明，NTSB 指出该地点的限速仅为每小时 65 英里。


    NTSB 初步报告中特别引人深思的是，据称特斯拉在事故发生前 7 秒处于左转状态。这意味着这种左转状态一直持续到事故发生时。


