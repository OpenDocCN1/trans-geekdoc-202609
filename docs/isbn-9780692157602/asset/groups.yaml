    it must revert to only stopping the car and pulling to the side of the road, well,
    I don’t know about you but that’s not the Level 5 that I’m aiming for as a true
    Level 5 self-driving car.


    Some say you don’t need common sense reasoning to be able to drive a car. I’m
    not so sure that’s a valid claim. Some say that the driving task is a very narrow
    task, like say playing chess or playing the game Go. I’m not so sure that’s a
    valid claim. It seems to me that if we are wanting to have a self-driving car
    that can be driven like a human driver, it requires that the AI be able to exhibit
    the same kind of intelligent behavior that a human driver does.


    It is my postulation that we need more AI than we have today, and it is a kind
    of AI approaching the AGI that is needed, in order to fulfill a goal of having
    a true Level 5 self-driving car. Without those kinds of advances, I’d say we’ll
    be mired in a “5-ish” level self-driving car, but for which we would all reasonably
    agree is not a true Level 5. This doesn’t mean that the 5-ish level self-driving
    car won’t be useful, it certainly can be. We can get a lot of mileage out of it
    (sorry about the pun!), it just won’t be the same as a human driven car.


    Now, if you are the sad face outcome person, you might say that we should be satisfied
    if we can get to the 5-ish level self-driving car, because maybe if we push to
    AGI in order to get to a true Level 5 self-driving car, we end-up with the AGI
    that bursts into ASI and all of mankind is destroyed. That’s a rather haunting
    viewpoint and might deter some AI developers, but probably not many. I’d say that
    most AI developers are wanting to either reach AGI, or reach a true Level 5 self-driving
    car, or both.


    Indeed, you could see it as:


    - It could be that our efforts to achieve a true Level 5 self-driving car will
    be the driving force that gets us to AGI.

    - Or, it could be that we will otherwise discover AGI and then apply it to the
    area of AI self-driving cars and thus achieve the true AI self-driving car.


    If we all somehow breakthrough to singularity, what happens with AI self-driving
    cars?


    The sad face scenario is that the singularity takes over all of our AI self-driving
    cars and uses it in one fell swoop to try and kill us all off. In that sense,
    we have provided a mechanism for our own self-destruction by building and fielding
    the AI self-driving cars, just to make things easier for the ASI that decides
    we’ve got to go. Oops.


    I’d prefer to end the discussion by focusing on the smiley face scenario.


    The singularity, if it occurs, realizes that we need our AI self-driving cars,
    and improves it in ways that we couldn’t possibly achieve. These become Level
    6 self-driving cars, or maybe Level 10 or Level 100. The singularity or ASI opts
    to benefit all of mankind and AI self-driving cars is just one of many ways in
    which it opts to do so. That’s the ASI that I’m hoping for.


    Here’s then my final vote on all this. Hold onto your hats.


    We will indeed collectively achieve AGI and it will be an essential aspect for
    also achieving true Level 5 self-driving cars. There won’t be the Big Bang Singularity
    and instead it will occur over a somewhat lengthy period of time. During that
    singularity emergence, we’ll

