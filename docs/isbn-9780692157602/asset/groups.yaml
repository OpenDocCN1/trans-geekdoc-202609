  md: "\n## CHAPTER 3\n### CHANGING LANES AND SELF-DRIVING CARS\n\nHey buddy, pick\
    \ a lane and stick with it. I can’t believe that driver just cut into my lane.\
    \ I need to quickly move into the lane next to me. There’s a car blocking my lane\
    \ up ahead. There aren’t enough lanes here for the number of cars. These lanes\
    \ are poorly marked and cars are veering toward each other. Which lane am I supposed\
    \ to be in. The emergency lane is nowhere to be seen. Drivers are illegally going\
    \ into and out of the HOV lane.\n\nYou’ve likely thought about or spoken aloud\
    \ those preceding remarks about roadway lanes. We live in a world of lanes. On\
    \ the open highways, maybe there are a couple of lanes going in each direction.\
    \ On some freeways, there are at times five lanes going in each direction. On\
    \ a mountain road, you usually have one lane in each direction, and on occasion\
    \ it narrows to just one lane with the need to be extra cautious for any cars\
    \ coming in the opposite direction.\n\nLanes can be marked in a variety of ways.\
    \ Sometimes there are bumpy dots that when you go across them it causes your tires\
    \ and car to rumble, warning you that you just crossed a lane. There are some\
