    to likely require a significant amount of open public debate.


    You might wonder how the owners of AI self-driving cars could possibly complain
    about a usage fee, since if indeed their vehicles are impacting the roadways it
    seems befitting that they pay for it, somehow. Their counter-argument would be
    that the AI self-driving car is providing other societal good. For example, by
    providing a ready mode of transportation, these cruising non-stop self-driving
    cars are offering a form of “public transportation” and that perhaps a municipality
    is able to cut-back on their costs for busses and other forms of mass transit.
    It would be unfair to hit the AI self-driving cars with usage fees and neglect
    the fact that these vehicles are already doing so much for the city or locale.


    The debate about the appropriateness of a usage fee is going to likely bounce
    back-and-forth. Meanwhile, let’s consider how usage fees would even be ascertained.
    The usage fee should presumably be based on one or more usage factors.


    Here’s some of the most likely usage factors:


    +   - Per occupant

    - Per delivery

    - Per miles driven

    - Per time driven

    - Per trip


    One means would be to require the AI self-driving car to self-report the number
    of occupants in the car, for any trip that takes place. There could be a usage
    fee charged per occupant. The owner of the AI self-driving car would need to decide
    whether to pass along the cost to the occupants, or absorb the usage fee otherwise
    into the cost of doing business. This approach though seems perhaps intrusive
    in that it requires counting people. Furthermore, if you have one person that
    goes one hundred miles, while there are five people that go two miles, it doesn’t
    seem sensible that if the cost is a fixed fee per occupant that the shorter trip
    has the higher usage fee.


    There’s another drawback of using occupants as a factor, namely that if the AI
    self-driving car is used to delivery pizza, and there’s not'
  - '[PAGE 166]


    a human occupant needed, the AI self-driving car would travel around the city
    without having to pay any usage fee. Thus, another factor would be to impose a
    per delivery fee. This would be eagerly done by many cities that want to catch
    revenue for the Amazon deliveries, and for the food GrubHub deliveries, and the
    like.


    We can combine these factors. Perhaps there is one level of a usage fee for the
    occupant''s model, and a different level of a usage fee for the delivery model.


    Another approach says that rather than caring about what the AI self-driving car
    is doing, charge a usage fee for the number of miles driven. This would be handy
    too since the occupant or delivery models assume that the self-driving car is
    being used for a particular purpose. If the AI self-driving car is cruising around,
    and there''s no occupants and no delivery underway, perhaps because it is staying
    in motion to most likely be near to wherever it is needed when so needed, the
    miles driven approach would make sure that the usage fee applies.


    You can argue that the miles driven metric has its own advantage and disadvantages,
    and so you could possibly end-up suggesting that maybe the better approach is
    based on time. Time takes distance out of the equation. If the AI self-driving
    car is on the roadways, and moving at one mile per hour for five hours, maybe
    that''s more important than if it was being driven for 80 miles per hour for thirty
    minutes. You could also try to argue in favor of using the number of trips as
    the usage metric, but that''s squishy since who''s to say exactly what constitutes
    a trip.


    We can mix-and-match these metrics. We can also add various conditions. Maybe
    the usage fee is based on the metric of time during the morning hours, and then
    it shifts into the metric of the number of miles driven, doing so for the afternoons
    and evenings. You might at first complain that having varied limitations and metrics
    is going to be onerous to calculate, but that''s kind of the same argument used
    in the early days of the online retailers. With today''s vastly superior computing
    power, I don''t think you can make much of a case about things being labor intensive
    to calculate.'
  - '[PAGE 167]


    Notice that I mentioned that the AI self-driving car would self-report its usage.
    How would it do this? It could keep track of the miles driven, or the time underway,
    or the number of occupants, and so on. This tracking could then be communicated
    to a municipality via the OTA (Over The Air) updating capability that AI self-driving
    cars are going to have. It would seem relatively straightforward that the AI self-driving
    car would be required to report its numbers say each day, or each week, and the
    government would then receive those numbers and charge the usage fee.


    You could even consider using blockchain to have the AI self-driving cars record
    their usage, and then have the government tap into the blockchain to impose the
    usage fees.


    I''m sure there will be cheaters. There are bound to be AI self-driving car owners
    that will try and find a means to avoid the usage fees. Since the numbers are
    presumably self-reported by the AI self-driving car, there could be a method to
    hack your AI self-driving car so it under-reports the numbers. It is likely the
    government would need to try and audit the AI self-driving cars and determine
    if there is anything funny going on about the reporting aspects.


    The government could also potentially use other means to try and verify the self-reported
    numbers. With the advent of V2I (vehicle to infrastructure) communications, the
    roadway infrastructure is going to be able to track our cars in ways not as feasible
    today. It is conceivable that the infrastructure will know exactly where your
    self-driving car has been the entire day and can calculate the usage fee without
    even asking your AI self-driving car for the numbers.


    All this potential collecting of data about the AI self-driving car raises potential
    privacy issues. We''ll have to see how that plays out in the usage fee debates.


    One final point to consider. We had the tension between the brick-and-mortar stores
    and the online retailers. The emergence of AI self-driving cars as ridesharing
    vehicles is certainly going to create tension with human-based ridesharing services.
    This includes taxis and shuttles, but also includes those everyday folks that
    are trying to make'
  - '[PAGE 168]


    some money by being a rideshare driver. What will happen to them? Maybe the usage
    fee of AI self-driving cars will help save them, since it might make the costs
    of using an AI self-driving car higher than choosing the human-driven approach.


    Or, maybe to be “fair” we’ll have usage fees on any ridesharing service, regardless
    of AI based or human-based. As you can see, there are lots of public related considerations
    that go into all of this. The revenue though of Zombie-cars is just going to be
    so tempting that no one will be able to overlook it. You can bet that there will
    be many start and stop attempts to come up with usage fees on those Zombies. The
    zombie apocalypse will need to pay for itself.'
