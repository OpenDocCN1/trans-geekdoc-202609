    # CHAPTER 1


    ## ELIOT FRAMEWORK FOR AI SELF-DRIVING CARS


    This chapter is a core foundational aspect for understanding AI self-driving cars
    and I have used this same chapter in several of my other books to introduce the
    reader to essential elements of this field. Once you''ve read this chapter, you''ll
    be prepared to read the rest of the material since the foundational essence of
    the components of autonomous AI driverless self-driving cars will have been established
    for you.


    When I give presentations about self-driving cars and teach classes on the topic,
    I have found it helpful to provide a framework around which the various key elements
    of self-driving cars can be understood and organized (see diagram at the end of
    this chapter). The framework needs to be simple enough to convey the overarching
    elements, but at the same time not so simple that it belies the true complexity
    of self-driving cars. As such, I am going to describe the framework here and try
    to offer in a thousand words (or more!) what the framework diagram itself intends
    to portray.


    The core elements on the diagram are numbered for ease of reference. The numbering
    does not suggest any kind of prioritization of the elements. Each element is crucial.
    Each element has a purpose, and otherwise would not be included in the framework.
    For some self-driving cars, a particular element might be more important or somehow
    distinguished in comparison to other self-driving cars.


    You could even use the framework to rate a particular self-driving car, doing
    so by gauging how well it performs in each of the elements of the framework. I
    will describe each of the elements, one at a time. After doing so, I''ll discuss
    aspects that illustrate how the elements interact and perform during the overall
    effort of a self-driving car.


    At the Cybernetic Self-Driving Car Institute, we use the framework to keep track
    of what we are working on, and how we are developing software that fills in what
    is needed to achieve Level 5 self-driving cars.


    ## D-01: Sensor Capture


    Let''s start with the one element that often gets the most attention in the press
    about self-driving cars, namely, the sensory devices for a self-driving car.


    On the framework, the box labeled as D-01 indicates "Sensor Capture" and refers
    to the processes of the self-driving car that involve collecting data from the
    myriad of sensors that are used for a self-driving car. The types of devices typically
    involved are listed, such as the use of mono cameras, stereo cameras, LIDAR devices,
    radar systems, ultrasonic devices, GPS, IMU, and so on.


    These devices are tasked with obtaining data about the status of the self-driving
    car and the world around it. Some of the devices are continually providing updates,
    while others of the devices await an indication by the self-driving car that the
    device is supposed to collect data. The data might be first transformed in some
    fashion by the device itself, or it might instead be fed directly into the sensor
    capture as raw data. At that point, it might be up to the sensor capture processes
    to do transformations on the data. This all varies depending upon the nature of
    the devices being used and how the devices were designed and developed.


    ## D-02: Sensor Fusion


    Imagine that your eyeballs receive visual images, your nose receives odors, your
    ears receive sounds, and in essence each of your distinct sensory devices is getting
    some form of input. The input befits the nature of the device. Likewise, for a
    self-driving car, the cameras provide visual images, the radar returns radar reflections,
    and so on.


    Each device provides the data as befits what the device does.


    At some point, using the analogy to humans, you need to merge together what your
    eyes see, what your nose smells, what your ears hear, and piece it all together
    into a larger sense of what the world is all about and what is happening around
    you. Sensor fusion is the action of taking the singular aspects from each of the
    devices and putting them together into a larger puzzle.


    Sensor fusion is a tough task. There are some devices that might not be working
    at the time of the sensor capture. Or, there might be some devices that are unable
    to report well what they have detected. Again, using a human analogy, suppose
    you are in a dark room and so your eyes cannot see much. At that point, you might
    need to rely more so on your ears and what you hear. The same is true for a self-driving
    car. If the cameras are obscured due to snow and sleet, it might be that the radar
    can provide a greater indication of what the external conditions consist of.


    In the case of a self-driving car, there can be a plethora of such sensory devices.
    Each is reporting what it can. Each might have its difficulties. Each might have
    its limitations, such as how far ahead it can detect an object. All of these limitations
    need to be considered during the sensor fusion task.


    ## D-03: Virtual World Model


    For humans, we presumably keep in our minds a model of the world around us when
    we are driving a car. In your mind, you know that the car is going at say 60 miles
    per hour and that you are on a freeway. You have a model in your mind that your
    car is surrounded by other cars, and that there are lanes to the freeway. Your
    model is not only based on what you can see, hear, etc., but also what you know
    about the nature of the world. You know that at any moment that car ahead of you
    can smash on its brakes, or the car behind you can ram into your car, or that
    the truck in the next lane might swerve into your lane.


    The AI of the self-driving car needs to have a virtual world model, which it then
    keeps updated with whatever it is receiving from the sensor fusion, which received
    its input from the sensor capture and the sensory devices.


    ## D-04: System Action Plan


    By having a virtual world model, the AI of the self-driving car is able to keep
    track of where the car is and what is happening around the car. In addition, the
    AI needs to determine what to do next. Should the self-driving car hit its brakes?
    Should the self-driving car stay in its lane or swerve into the lane to the left?
    Should the self-driving car accelerate or slow down?


    A system action plan needs to be prepared by the AI of the self-driving car. The
