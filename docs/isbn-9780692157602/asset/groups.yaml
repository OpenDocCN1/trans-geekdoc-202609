    In that sense, lane changes involve head-fakes. A head-fake in this context is
    when you begin to move your car toward a lane change, and though you haven''t
    made a full commitment to it, you are "signaling" that you are making a lane change
    (this can occur either while using the turn signal or not using the turn signal).
    So, we have the potential of a head-fake to showcase an upcoming lane change,
    and we have the use of an actual turn signal.


    We have these combinations:


    +   - Head-fake (no): Turn signal (yes)

    - Head-fake (no): Turn signal (no)

    - Head-fake (yes): Turn signal (yes)

    - Head-fake (yes): Turn signal (no)


    An activator might not do a head-fake and do just the turn signal. Here, though,
    there are times that the activator turns on the turn signal but then chooses to
    not make the lane change. Or, they turn on the turn signal, leave it on, and don''t
    realize they are telegraphing to the rest of the traffic that a lane change is
    coming. This can be irritating to other drivers, since they are all waiting to
    witness the lane change and it doesn''t arise. I''m sure you''ve seen drivers
    that leave on their turn signal and drive mindlessly with it on – you ask yourself,
    how can they not know their turn signal is on, are they not watching the road
    and paying attention to their own car?


    There''s the instance of the no head-fake and no turn signal, and yet the driver
    makes the lane change anyway. No notice. No trying to be civil. They just suddenly
    and at times inexplicably make a lane change. This unexpected move can be especially
    dangerous since none of the nearby drivers have been forwarded about the movement.


    There''s the use of both the head-fake and the turn signal, which often is handy
    since it reinforces each other as a means to suggest that the person is really
    truly going to make a lane change. And then there''s the head-fake but no turn
    signal indication. In this case, the head-fake is considered a stronger suggestion
    that a lane change is coming, more so than the turn signal. It would be nice though
    to also have the turn'
