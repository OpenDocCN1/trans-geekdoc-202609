    as though they had properly signaled to make a lane change.


    In that sense, lane changes involve head-fakes. A head-fake in this context is
    when you begin to move your car toward a lane change, and though you haven''t
    made a full commitment to it, you are "signaling" that you are making a lane change
    (this can occur either while using the turn signal or not using the turn signal).
    So, we have the potential of a head-fake to showcase an upcoming lane change,
    and we have the use of an actual turn signal.


    We have these combinations:


    - Head-fake (no): Turn signal (yes)

    - Head-fake (no): Turn signal (no)

    - Head-fake (yes): Turn signal (yes)

    - Head-fake (yes): Turn signal (no)


    An activator might not do a head-fake and do just the turn signal. Here, though,
    there are times that the activator turns on the turn signal but then chooses to
    not make the lane change. Or, they turn on the turn signal, leave it on, and don''t
    realize they are telegraphing to the rest of the traffic that a lane change is
    coming. This can be irritating to other drivers, since they are all waiting to
    witness the lane change and it doesn''t arise. I''m sure you''ve seen drivers
    that leave on their turn signal and drive mindlessly with it on – you ask yourself,
    how can they not know their turn signal is on, are they not watching the road
    and paying attention to their own car?


    There''s the instance of the no head-fake and no turn signal, and yet the driver
    makes the lane change anyway. No notice. No trying to be civil. They just suddenly
    and at times inexplicably make a lane change. This unexpected move can be especially
    dangerous since none of the nearby drivers have been forwarded about the movement.


    There''s the use of both the head-fake and the turn signal, which often is handy
    since it reinforces each other as a means to suggest that the person is really
    truly going to make a lane change. And then there''s the head-fake but no turn
    signal indication. In this case, the head-fake is considered a stronger suggestion
    that a lane change is coming, more so than the turn signal. It would be nice though
    to also have the turn signal as a reinforce that the person is not just maybe
    weaving and not actually intending to make a lane change.


    ## What does all of this have to do with AI self-driving cars?


    At the Cybernetic AI Self-Driving Car Institute, we are developing AI software
    for self-driving cars and one of the areas that is rapidly being advanced involves
    lane changes.


    For most of the self-driving cars of today, if you ever watch them make a lane
    change, you might laugh at what you see. Generally, they make a lane change like
    a timid teenage novice driver would do. The AI of today will only make the lane
    change if it seems absolutely abundantly the case that the lane change can be
    made with a great deal of safety.


    As such, the AI often starts toward doing a lane change a lot sooner than most
    human drivers would. Also, the AI self-driving car tends to often disrupt traffic
    flow when making a lane change, which is not by design but by the aspect that
    imagine if you had a teenage driver making a lane change on a busy freeway. The
    other drivers would all pretty quickly size up that driver and either give them
    wide berth, or try to take advantage of them. This is like playing a game of poker
    and a rube sits down to play. Everyone else that knows how to play poker will
    try every trick under the sun on that rube.


    I realize that some of you are going to say that there’s no need for an AI self-driving
    car to worry about driving around humans because we are going to have all cars
    on the road become AI self-driving cars. Wake-up! It’s going to be a long, long,
    long time before that happens. There are about 200 million conventional cars in
    the United States alone. We are going to have self-driving cars mixing with human
    driven cars for a very long time.


    Recall that I mentioned that making lane changes is not just the act of making
    calculations. It is also involves the psychology of the other drivers. For human
    drivers, right now they can easily guess the “psychology” of the AI self-driving
    cars – just assume that the AI will pretty much do whatever is the most conservative
    and novice act of changing lanes, and that’s it. Having to figure out other humans
    is more complex, though seasoned drivers have already assessed how to do so. Seasoned
    drivers look at not only the behavior exhibited by the car and the car driver,
    but also often include looking to see what the driver looks like, what the car
    looks like, whether the car is in good shape or bad shape, etc.


    The AI of today’s AI self-driving cars doesn’t consider any of those other aspects.
    Instead, the AI simplistically detects that there’s another object that is moving
    at such-and-such speed, and otherwise doesn’t really care as to the nature of
    the car, nor the nature of the driver of that car, or any other such facets. It’s
    all calculations based.


    Some interesting new approaches to the mathematics of this include incorporating
    what are called buffer zones. Imagine that the AI self-driving car has a cone
    around it, which is a buffer zone. Other cars have likewise buffer zones around
    them. This virtual buffer zone is a “pretend” in that we are pretending that the
    car is actually larger than it is. You might think of this as a geo-fence placed
    around the car. The buffer zone can be wide, like say we decide that there’s a
    pretend area around a car that’s 4 feet wide, all around the car. Or, the buffer
    zone might be tight, such as perhaps a foot in size.


    When trying to make a lane change, we’ll mathematically consider that the objects
    (the cars) are the sizes of their buffer zones. One key principle is that we don’t
    want to have buffer zones come in contact with each other. If the buffer zones
    come in contact, it presumably implies a collision is going to occur. Now, the
    question arises as to how risky we are going to go. If the buffer zone is four
    feet, I presumably have some allowable slippage that I can make the lane change
    and get say within three feet of the other car, and not actually hit the other
    car, even though I’ve punched into their buffer zone.


    Mathematically, we’d like to have the AI be able to “prove” that collision avoidance
    will be preserved.


    So, we take the buffer zone of the activator, and the buffer zone of the responder,
    we make assumptions about their speeds and likely actions in the near future of
    when the lane change will happen, and run through the calculations to see whether
    the lane change can be made with a guarantee of no collision.


    This is easy to do in the lab or via a simulator. In the real-world, this needs
    to be done in real-time. The question arises as to whether or not the calculations
    can be done quickly enough to then make the decision for the lane change and then
    do the lane change. If the calculations take say 3 seconds too long, the opportunity
    for the lane change evaporates. Furthermore, the whole set of calculations now
    is worthless since the circumstances have changed and a new set needs to be executed.


    As much as possible, it is best to pre-compute this. You can have on-board the
    AI system lots of pre-computations done for varying circumstances, and thus instead
    of having to calculate at the moment, you look up in tables to see what those
    tables indicate. This is similar to chess playing. You can either have a chess
    playing program that has to calculate all the various permutations and options
    of play, or you can have pre-stored templates that once the chessboard is in a
    certain configuration, you just look it up and know what the next move should
    be. We can do somewhat of the same with the AI self-driving car and lane changes.


    Not entirely though. And so we are more than likely to have to at times make the
    raw calculations. And, if so, they need to be done in real-time to match the time
    constraints of the situation. One recent approach by researchers at MIT involves
    calculating a logistics function involving the buffer zones and the direction,
    speed, etc., and then combining with a Laplace-Gauss distribution (the “Bell Curve”)
    to do an on-the-fly estimation of the chances of making the lane change and doing
    so with collision avoidance.


    Efforts to solve this problem need to contend with the severe time constraints
    and doing the calculation in real-time, along with considering how much information
    is available and how reliable is that information.

