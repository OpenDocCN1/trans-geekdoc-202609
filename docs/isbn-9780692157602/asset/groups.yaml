    the self-driving car that are happening in parallel and simultaneously. The sensors
    are capturing data, meanwhile the sensor fusion is taking place, meanwhile the
    virtual model is being updated, meanwhile the system action plan is being formulated
    and reformulated, meanwhile the controls are being activated.


    This is the same as a human being that is driving a car. They are eyeballing the
    road, meanwhile they are fusing in their mind the sights, sounds, etc., meanwhile
    their mind is updating their model of the world around them, meanwhile they are
    formulating an action plan of what to do, and meanwhile they are pushing their
    foot onto the pedals and steering the car. In the normal course of driving a car,
    you are doing all of these at once. I mention this so that when you look at the
    diagram, you will think of the boxes as processes that are all happening at the
    same time, and not as though only one happens and then the next.


    They are shown diagrammatically in a simplistic manner to help comprehend what
    is taking place. You though should also realize that they are working in parallel
    and simultaneous with each other. This is a tough aspect in that the inter-element
    communications involve latency and other aspects that must be taken into account.
    There can be delays in one element updating and then sharing its latest status
    with other elements.


    ## D-06: Automobile & CAN


    Contemporary cars use various automotive electronics and a Controller Area Network
    (CAN) to serve as the components that underlie the driving aspects of a car. There
    are Electronic Control Units (ECUs) which control subsystems of the car, such
    as the engine, the brakes, the doors, the windows, and so on.


    The elements D-01, D-02, D-03, D-04, D-05 are layered on top of the D-06, and
    must be aware of the nature of what the D-06 is able to do and not do.


    ## D-07: In-Car Commands


    Humans are going to be occupants in self-driving cars. In a Level 5 self-driving
    car, there must be some form of communication that takes place between the humans
    and the self-driving car. For example, I go into a self-driving car and tell it
    that I want to be driven over to Disneyland, and along the way I want to stop
    at In-and-Out Burger. The self-driving car now parses what I''ve said and tries
    to then establish a means to carry out my wishes.


    In-car commands can happen at any time during a driving journey. Though my example
    was about an in-car command when I first got into my self-driving car, it could
    be that while the self-driving car is carrying out the journey that I change my
    mind. Perhaps after getting stuck in traffic, I tell the self-driving car to forget
    about getting the burgers and just head straight over to the theme park. The self-driving
    car needs to be alert to in-car commands throughout the journey.


    ## D-08: V2X Communications


    We will ultimately have self-driving cars communicating with each other, doing
    so via V2V (Vehicle-to-Vehicle) communications. We will also have self-driving
    cars that communicate with the roadways and other aspects of the transportation
    infrastructure, doing so via V2I (Vehicle-to-Infrastructure).


    The variety of ways in which a self-driving car will be communicating with other
    cars and infrastructure is being called V2X, whereby the letter X means whatever
    else we identify as something that a car should or would want to communicate with.
    The V2X communications will be taking place simultaneous with everything else
    on the diagram, and those other elements will need to incorporate whatever it
    gleans from those V2X communications.


    ## D-09: Deep Learning


    The use of Deep Learning permeates all other aspects of the self-driving car.
    The AI of the self-driving car will be using deep learning to do a better job
    at the systems action plan, and at the controls activation, and at the sensor
    fusion, and so on.


    Currently, the use of artificial neural networks is the most prevalent form of
    deep learning. Based on large swaths of data, the neural networks attempt to “learn”
    from the data and therefore direct the efforts of the self-driving car accordingly.


    ## D-10: Tactical AI


    Tactical AI is the element of dealing with the moment-to-moment driving of the
    self-driving car. Is the self-driving car staying in its lane of the freeway?
    Is the car responding appropriately to the controls commands? Are the sensory
    devices working?


    For human drivers, the tactical equivalent can be seen when you watch a novice
    driver such as a teenager that is first driving. They are focused on the mechanics
    of the driving task, keeping their eye on the road while also trying to properly
    control the car.


    ## D-11: Strategic AI


    The Strategic AI aspects of a self-driving car are dealing with the larger picture
    of what the self-driving car is trying to do. If I had asked that the self-driving
    car take me to Disneyland, there is an overall journey map that needs to be kept
    and maintained.


    There is an interaction between the Strategic AI and the Tactical AI. The Strategic
    AI is wanting to keep on the mission of the driving, while the Tactical AI is
    focused on the particulars underway in the driving effort. If the Tactical AI
    seems to wander away from the overarching mission, the Strategic AI wants to see
    why and get things back on track. If the Tactical AI realizes that there is something
    amiss on the self-driving car, it needs to alert the Strategic AI accordingly
    and have an adjustment to the overarching mission that is underway.


    ## D-12: Self-Aware AI


    Very few of the self-driving cars being developed are including a Self-Aware AI
    element, which we at the Cybernetic Self-Driving Car Institute believe is crucial
    to Level 5 self-driving cars.


    The Self-Aware AI element is intended to watch over itself, in the sense that
    the AI is making sure that the AI is working as intended. Suppose you had a human
    driving a car, and they were starting to drive erratically. Hopefully, their own
    self-awareness would make them realize they themselves are driving poorly, such
    as perhaps starting to fall asleep after having been driving for hours on end.
    If you had a passenger in the car, they might be able to alert the driver if the
    driver is starting to do something amiss. This is exactly what the Self-Aware
    AI element tries to do, it becomes the overseer of the AI, and tries to detect
    when the AI has become faulty or confused, and then find ways to overcome the
    issue.


    ## D-13: Economic


    The economic aspects of a self-driving car are not per se a technology aspect
    of a self-driving car, but the economics do indeed impact the nature of a self-driving
    car. For example, the cost of outfitting a self-driving car with every kind of
    possible sensory device is prohibitive, and so choices need to be made about which
    devices are used. And, for those sensory devices chosen, whether they would have
    a full set of features or a more limited set of features.


    We are going to have self-driving cars that are at the low-end of a consumer cost
    point, and others at the high-end of a consumer cost point. You cannot expect
    that the self-driving car at the low-end is going to be as robust as the one at
    the high-end. I realize that many of the self-driving car pundits are acting as
    though all self-driving cars will be the same, but they won''t be. Just like anything
    else, we are going to have self-driving cars that have a range of capabilities.
    Some will be better than others. Some will be safer than others. This is the way
    of the real-world, and so we need to be thinking about the economics aspects when
    considering the nature of self-driving cars.


    ## D-14: Societal


    This component encompasses the societal aspects of AI which also impacts the technology
    of self-driving cars. For example, the famous Trolley Problem involves what choices
    should a self-driving car make when faced with life-and-death matters. If the
    self-driving car is about to either hit a child standing in the roadway, or instead
    ram into a tree at the side of the road and possibly kill the humans in the self-driving
    car, which choice should be made?


    We need to keep in mind the societal aspects will underlie the AI of the self-driving
    car. Whether we are aware of it explicitly or not, the AI will have embedded into
    it various societal assumptions.

