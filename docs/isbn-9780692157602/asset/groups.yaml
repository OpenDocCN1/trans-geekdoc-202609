    ### ACKNOWLEDGMENTS


    I have been the beneficiary of advice and counsel by many friends, colleagues,
    family, investors, and many others. I want to thank everyone that has aided me
    throughout my career. I write from the heart and the head, having experienced
    first-hand what it means to have others around you that support you during the
    good times and the tough times.


    To Warren Bennis, one of my doctoral advisors and ultimately a colleague, I offer
