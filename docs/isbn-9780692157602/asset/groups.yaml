    How do you get people to behave responsibly? That’s a refrain right now being
    asked and pondered regarding the scooter wars underway in cities such as San Francisco
    and Santa Monica.


    In case you’ve not yet been indoctrinated into the scooter wars, allow me a moment
    to bring you into the fold.


    Companies are springing up like wildflowers that are providing motorized scooter
    rentals and are using a modern-day approach to do so. Rather than the prospective
    customer having to go to a storefront to rent a scooter, they instead look for
    one on a mobile app that shows a GPS map with scooter locations, akin to the Uber
    mobile app that shows ridesharing car locations, and simply go over to the nearest
    scooter, rent it with a credit card, it unlocks, and you are good to go. There
    is an electronic lock on the scooter and whoever last rented it is pretty much
    allowed to leave it wherever they want to do so (it locks after the renter is
    done with the scooter). No need to take the scooter back to the rental office.
    No need to pick it up from a rental office.


    Imagine that you are somewhere in Santa Monica and you want to get across town.
    You could potentially walk it, but that’s old fashioned, it might take a long
    time, and you’d likely not have much fun along the way. You could use a ridesharing
    service, but why do so when it’s a nice day out and the distance is just a mile
    or two, plus the cost might'
