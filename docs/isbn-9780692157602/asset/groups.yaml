    ## D-15: Innovation


    I included the notion of innovation into the framework because we can anticipate
    that whatever a self-driving car consists of, it will continue to be innovated
    over time. The self-driving cars coming out in the next several years will undoubtedly
    be different and less innovative than the versions that come out in ten years
    hence, and so on.


    ### Framework Overall


    For those of you that want to learn about self-driving cars, you can potentially
    pick a particular element and become specialized in that aspect. Some engineers
    are focusing on the sensory devices. Some engineers focus on the controls activation.
    And so on. There are specialties in each of the elements.


    Researchers are likewise specializing in various aspects. For example, there are
    researchers that are using Deep Learning to see how best it can be used for sensor
    fusion. There are other researchers that are using Deep Learning to derive good
    System Action Plans. Some are studying how to develop AI for the Strategic aspects
    of the driving task, while others are focused on the Tactical aspects.


    A well-prepared all-around software developer that is involved in self-driving
    cars should be familiar with all of the elements, at least to the degree that
    they know what each element does. This is important since whatever piece of the
    pie that the software developer works on, they need to be knowledgeable about
    what the other elements are doing.


