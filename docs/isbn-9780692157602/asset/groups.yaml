    # CHAPTER 11


    # TRAFFIC LIGHTS


    # AND SELF-DRIVING CARS


    There are maybe 300,000 of these in the United States alone. You see them every
    day. You notice them, but you don’t notice them. They save lives, but are generally
    unheralded for what they do. Sometimes you curse them. Sometimes you thank them.
    Can you guess what I am referring to?


    Answer: Traffic lights.


    Yes, as human drivers you are surrounded by traffic lights. Most major intersections
    have them. You watch for that green light so that you can zoom through the intersection.
    When you see the yellow light, you need to judge whether to hit the brakes before
    the light turns red, or maybe hit the accelerator to try and make it before the
    light turns red. It’s a game.


    It’s actually a deadly game. There are an estimated 700 deaths per year due to
    red-light running crashes. That’s sad and preventable. Equally horrific, there
    are an estimated 126,000 injuries due to red-light running. That’s sad and preventable.
    The next time you see some nut rush through a red light, I hope you’ll realize
    the crazy danger involved and perhaps adjust your own driving to no longer try
    to rush through a traffic signal.


    When you think about it for a moment, you’ll realize that traffic signals are
    kind of a scary mechanism since they don’t do anything to actually physically
    stop anyone from driving crazily. It is all a voluntary'
