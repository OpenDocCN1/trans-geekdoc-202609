    ## AI 自动驾驶汽车的夜间驾驶能力


    夜间骑行者同样常常行为疯狂，要么自行车上没有任何灯光，要么即使装了灯，他们也突然认为一个微小的自行车灯能产生像汽车大灯那样明亮的光束。


    这与 AI 自动驾驶汽车有什么关系？


    在控制论 AI 自动驾驶汽车研究所，我们正在为自动驾驶汽车开发 AI，并特别关注夜间驾驶能力。


    有些汽车制造商和技术公司在开发自动驾驶汽车时，认为夜间驾驶不过就是日间驾驶的翻版。换句话说，他们的 AI 系统在日间驾驶和夜间驾驶之间并不做任何特殊区分。在他们看来，如果
    AI 能处理日间驾驶，那么它就能处理夜间驾驶。他们说，驾驶就是驾驶。


    我们礼貌地不同意这种略显粗糙的过度简化观点。我们的观点是，夜间驾驶需要额外的能力。话虽如此，有些人将这些增加的夜间能力视为所谓的“边缘”问题，他们会承认是的，这涉及一些专业领域，但这只是边缘事项。边缘问题是指并非处于问题核心的部分。边缘情况被认为是在你解决主要问题后才会去处理的事项，否则它并不是需要解决的核心所在。我们摒弃了这种观念，而是断言，一个好的日间驾驶
    AI 并不必然是一个好的夜间驾驶 AI。 此外，我们甚至会争辩说，在其他条件相同且 AI 未针对夜间驾驶进行适当调整（即“微调”）的情况下，一个好的日间驾驶
    AI 很可能不是一个好的夜间驾驶 AI。


    在本次讨论中，让我们首先明确，我们需要寻找真正的 AI 自动驾驶汽车，这些汽车被定义为 5 级（Level 5）。5 级自动驾驶汽车是可以完全由 AI 驾驶而无需任何人类干预的汽车。自动驾驶汽车由
    AI 驾驶。AI 可以像人类一样驾驶汽车。对于低于 5 级的自动驾驶汽车，这些汽车依赖于车内有人类驾驶员。事实上，在这些低于 5 级的自动驾驶汽车中，人类驾驶员最终被视为汽车的真正驾驶者。从某种意义上说，你可以说在这些低于
    5 级的自动驾驶汽车中，驾驶任务责任是共同分担的。


    对于低于 5 级的自动驾驶汽车，关于夜间驾驶相关的问题，它就像一颗定时炸弹。


    如果自动驾驶汽车的 AI 在驾驶汽车时遇到困难，且这种情况发生在夜间，那么如果 AI 突然将控制权交还给车内的人类驾驶员，人类驾驶员可能会措手不及。而且，由于黑暗，人类驾驶员的视野可能受限，因此在采取纠正措施甚至意识到是什么导致
    AI 将“球”踢给人类驾驶员方面会受到阻碍。可能是夜间导致 AI 系统感到困惑，从而将控制权交还给了人类驾驶员，也可能原因与夜间本身毫无关系，但人类驾驶员现在必须应对这一问题，同时还要处理夜间的各个方面。


    对于 5 级自动驾驶汽车，理论上假设 AI 将能够处理驾驶的夜间方面。让我们探讨 AI 可能受到夜间驾驶任务影响的方式，以及 AI 应如何增强或使其能够处理夜间要求。


    首先，也许最明显的方面是可见度的损害。自动驾驶汽车上的摄像头可能无法捕捉到清晰的图像，视频的光线也不如白天充足。自动驾驶汽车的大灯变得尤为关键。如果大灯状态不佳或因灰尘或污垢而被遮挡，可能会对图像处理产生更严重的负面影响。自动驾驶汽车后部的摄像头没有任何直接照明（如大灯），因此它们捕捉到的图像显然会严重退化。


    AI 自动驾驶汽车应进行检查，确保大灯似乎工作正常，以便尽可能捕捉合适的图像，这可以在行程开始时通过测试来验证。然后，AI 可以警告某人（例如人类乘客），并可能允许人类乘客清理大灯，甚至可能决定不开始行程。顺便提一下，多年前我去租车，在白天将租来的车开出停车场，然后当晚打开大灯时——震惊地发现大灯烧毁了。如果我在白天检查过，我可能会换另一辆车，或者只在白天使用该车，或者采取其他行动。下次租车时请记住这一点！


    夜间图像的图像处理与日间图像的图像处理不同。光线充足的图像更容易处理。带有深色阴影和其他变暗部分的图像更难处理。这通常涉及进行各种图像处理清理工作。这也可能会改变物体检测相关的概率。一个物体在白天可能拥有
    100% 的概率被识别为路边轮椅，但在夜间，它被识别为轮椅的概率可能只有 60%。


    通常还会有更多的光线反射和失真。路灯和汽车大灯可能会反射到前方汽车上，可能是反射在汽车像镜子一样的镀铬保险杠上，从而使其他物体变得更亮或过亮。反射光实际上可能导致日光爆发效应（sunburst
    effect），使物体识别变得更加困难。再次强调，图像处理软件必须对此类影响做好准备。


    对于机器学习和人工神经网络的使用，如果这些神经网络是使用白天拍摄的物体图像进行训练的，那么这些物体可能不再被神经网络检测到。重要的是，神经网络的训练应包括在较暗条件下看到的物体。有些人喜欢将日间图像和夜间图像训练结合在一起，作为一种“综合盛宴”，而另一些人则认为，如果一个实例训练于日间图像，另一个实例训练于夜间图像，神经网络的效果会更好。


    视觉上变得更加棘手的一个方面是路标的检测和解读。在白天，通常相对容易发现路标，如停车标志或警告标志。在夜间，发现路标可能困难得多。黑暗可能使其隐蔽，或者大灯的亮度可能产生日光爆发效应。如前所述，如果使用机器学习方法训练路标检测，必须注意其是否能处理夜间版本。


    许多自动驾驶汽车在 AI 驾驶汽车时使用各种相对简单的道路跟随技术。例如，检查道路标记并用于确定车道边界。一些道路使用平面油漆标记车道，而另一些道路使用反光
    Botts’ 点。在尝试确定车道标记位置时，夜间驾驶可能很棘手。 此外，道路标记也容易具有误导性，让人误以为标记是正确的，而实际上它们可能是之前标记的残留，这些标记后来已被更改。负责处理此问题的
    AI 系统部分需要为夜间驾驶做好准备。


    到目前为止，我主要关注夜间驾驶的感官方面。请考虑，在驾驶任务中，AI 自动驾驶汽车涉及五个关键阶段：


    - 传感器数据收集与解读

    - 传感器融合

    - 虚拟世界模型更新

    - AI 行动计划准备

    - 汽车控制命令发布


    在传感器融合过程中，传感器结果以各种方式进行比较和组合。如果摄像头没有获得良好的图像，通常 AI 系统会被设计为降低这些传感器的权重。因此，如果摄像头表明路边似乎没有行人（也许图像太暗，无法轻易检测站在阴影中的人形），但雷达检测到那里可能有东西，传感器融合必须确定该怎么办。它应该依赖雷达并声称那里有行人吗？在白天，传感器融合通常会选择等待，直到摄像头也达成一致


