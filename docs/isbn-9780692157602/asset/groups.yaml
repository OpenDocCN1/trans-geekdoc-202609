    areas such as farms where drivers are young, but for public roadways in the United
    States, you can be generally of average intelligence (or less) and be able to
    legally drive.


    This though makes it seem like the cognitive effort must not be much. If the cognitive
    effort was truly hard, wouldn''t we only have Einstein''s that'
