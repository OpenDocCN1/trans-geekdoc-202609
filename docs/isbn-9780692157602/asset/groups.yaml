    ## 关于作者


    兰斯·B·艾略特博士（Dr. Lance B. Eliot, MBA, PhD）是 Techbruum, Inc. 的首席执行官，同时也是赛博神经系统自动驾驶汽车研究所的执行主任。他拥有二十多年的行业经验，曾在一市值数十亿美元的公司担任高管，并是一家主要高管服务公司的合伙人。他也是一位连续创业者，创立、运营并出售了多家高科技相关企业。他曾是热门广播节目
    *Technotrends* 的主持人，该节目也可通过美国航空公司的机上音频节目收听。他是十二本书的作者或合著者，并撰写了四百多篇文章，曾在 CNN 露面，并经常在行业会议上发言。


    曾任南加州大学（USC）教授，他创立并领导了一个关于商业人工智能的创新型研究实验室。被称为“人工智能内部专家”，他关于人工智能进展和趋势的文章被广泛阅读和引用。他之前也曾受聘于加州大学洛杉矶分校（UCLA），并担任其他主要大学的客座教授。他当选信息管理协会（SIM）的国际理事，这是一个拥有全球
    3,000 多名高科技高管的著名协会。


    他参与了广泛的社区服务，包括担任国会科学与技术委员会副主席的高级科学顾问。他曾任橙县科学与工程大赛（OCSEF）董事会成员，并担任过大奖评委会主席，同时也担任过英特尔国际科学与工程大赛（ISEF）的评委。他曾任计算机协会（ACM）分会的副主席，这是一个著名的计算机科学家协会。艾略特博士曾担任南加州大学马克·史蒂文斯创新中心（USC
    Mark Stevens Center for Innovation）初创企业路演竞赛的“鲨鱼坦克”评委，并曾在硅谷和硅滩的多个孵化器和加速器担任导师。他曾在南加州大学的多个董事会和委员会任职，包括曾任南加州大学马歇尔校友会（MAA）董事会成员。


    艾略特博士拥有南加州大学博士学位、MBA 学位和计算机科学学士学位，并获得了 CDP, CCP, CSP, CDE 和 CISA 认证。他在南加州出生并长大，曾在国际旅行和居住，喜欢水肺潜水、冲浪和帆船。


