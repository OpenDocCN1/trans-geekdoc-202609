    ## CHAPTER 4: PROCRASTINATION AND SELF-DRIVING CARS


    Procrastination. Procrastinator. As the old joke goes, when someone asks you what
    the word procrastination means, you are supposed to say “I’ll get back to you
    about that.”


    I’m sure we’ve all felt like a procrastinator at one time or another. Often considered
    a negative aspect of human behavior, some liken procrastination with being lazy,
    careless, and otherwise less desirable than being prompt and proactive.


    We might though be somewhat making a false generalization about procrastination.
    Does being a procrastinator always have to be bad? It is said that prolific and
    ingenious inventor and artist Leonardo da Vinci was known for dragging out the
    works he owed his patrons and often taking nearly forever to get done what he
    had been obligated to produce. Charles Darwin had acknowledged that he often put
    off things that he was supposed to do or wanted to do. Few realize that he took
    years to write his acclaimed “On the Origin of Species” and was at times using
    his time to instead study barnacles. If these greats had bouts with procrastination,
    can it really be that bad a thing?


    If you find yourself falling into the procrastination trap and don’t want to be
    a procrastinator, you can always call upon Saint Expedite. For those of you have
    been to New Orleans, or have certain religious interests, you likely know that
    Saint Expedite is considered the patron for those that want to avert being a procrastinator,
    and you can ask for his assistance in finding rapid solutions to nagging problems.
    I suppose too, there are some that say you just need to kick yourself in the you-know-where,
    but anyway it can be hard to stop the urge to procrastinate however you try to
    prevent it.


    Psychologically, it is theorized that people often procrastinate because they
    fear the act of doing something that might fail. As such, in order to avoid failure,
    they postpone it. Presumably, by not trying, you convince yourself that you are
    better off. You might even use trivial items to help yourself be a procrastinator.
    Should I go to the dentist, or maybe instead I need to wash my socks and clean
    the latrine? One might think that dealing with the health of your teeth would
    be a high priority in comparison to those other tasks. It’s amazing how we can
    allow seemingly low-priority items to aid us in avoiding dealing with meatier
    issues or topics.


    For some people, they are an occasional procrastinator. Perhaps most of the time
    they get things done on a timely basis. A particular situation might cause them
    to go into a procrastination mode. A personal example is that the other day my
    car dashboard lit up with an indicator that my low-beam left headlight bulb was
    burnt out. I probably should have taken my car right away to have the lamp replaced.
    Instead, I sheepishly admit that for several weeks I drove at night with the high-beams
    on, rather than the low beams, so that I’d have both headlamps working. I truly
    meant to go over to have the headlight replaced, but seemed to let other matters
    take higher priority.


    Sometimes a procrastination can have potentially dangerous consequences. You could
    say that my example about driving around with my high-beams on, rather than using
    my low beams, made my driving circumstances a bit less safe. Not much less, I’d
    argue, but certainly a little bit. On the other hand, shortly after I had the
    left headlight replaced, a few days later my left rear brake light suddenly went
    out. It was a Murphy’s Law kind of curse because had it gone out just a few days
    earlier, I could have had it replaced at the same time as the headlight. But,
    no, it had to wait and then force me to make a second trip to the car repair shop.
    In theory, I could have driven for many days or weeks with the left rear brake
    light out, but this for sure would have reduced the safety factor of my driving.


    There are the perennial or serial procrastinators. These are the types that just
    seem to shove everything off into the future. No reason to get something done
    today, if you can hand it off to the future, they believe. They might overly have
    this belief and relish it. Others find themselves gradually getting immersed into
    this approach, happening almost without them consciously realizing they are doing
    so. It can be a deathly kind of spiral. You beat yourself up for having procrastinated.
    It happens again. You beat yourself up again. You then become convinced that you
    are a “failure” and destined to procrastinate. Nothing is going to get you out
    of that spiral, other than some kind of direct intervention.


    There’s a well-known theory that somewhat covers this, called Temporal Motivation
    Theory (TMT). You might find of interest a core formula often used to express
    TMT:


    ```

    Motivation = (Expectancy x Value) / (1 + Impulsiveness x Delay)

    ```


    Your “Motivation” is the amount of desire that you have to achieve a particular
    outcome. If your motivation score is low, you are more likely to procrastinate.
    If your motivation score is high, such as if you realize that your brake light
    being out is putting you in grave danger, you are more likely to take action about
    it. We can calculate your motivation for a given circumstance.


    The “Expectancy” is the probability of achieving success on the matter at hand.
    The “Value” is the reward that you personally will gain by achieving the desired
    outcome. By multiplying the Expectancy by the Value, the formula is saying that
    if one of those variable is low it is going to bring down the combination of them,
    while if they are both high it will make their combination higher. I think that
    my expectancy of fixing my brake light is quite high (just need to get the car
    over to the repair shop), and the value of increasing my safety while driving
    my car is high.


    The "Impulsiveness" is the person''s sensitivity to delay. Some people are very
    impulsive and need to do things right away. Other people are more prone to taking
    their time or at least considering that they are willing to take time and don''t
    need to immediately handle the matter. There''s the "Delay" which is considered
    the time to realize the needed achievement.


    Anyway, it''s kind of an interesting formula because it tries to mathematically
    express something that we all seem to know is happening, but don''t have at hand
    a tangible way to calculate why we do what we do. Using the formula, you can become
    more reflective when faced with a situation that you are possibly going to procrastinate
    on. You can ask yourself, why is your motivation so low, and whether it is due
    to the expectancy, the value, the impulsiveness, or the delay, or possibly some
    combination of those several factors.


    People often make excuses for why they procrastinate. When I refer to these aspects
    as excuses, I should clarify that maybe they are valid. We often react to the
    word "excuse" and think it is a made-up aspect or an attempt to deflect blame.
    Sometimes an excuse is quite valid. It doesn''t have to be a cover story or a
    deflection.


    Here''s some of the traditional excuses or coping responses:


    - Avoidance of the matter

    - Denial about the matter

    - Trivialization of the matter

    - Distraction about the matter

    - Mocking of the matter

    - Blaming about the matter


    This quick introduction to the topic of procrastination then brings us to a major
    final point before I move onto using this foundation for other purposes herein.
    I claim that procrastination can occur perchance, but it can also be a manifest
    strategy.


    In the case of my left headlight, I was well aware that I was "procrastinating"
    about taking in the car to have the headlight replaced. I won''t try to convince
    you that I was so busy that I couldn''t

