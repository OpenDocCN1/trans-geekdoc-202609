    Artificial Intelligence” and “Transformative Artificial Intelligence Driverless
    Self-Driving Cars,” and “Disruptive Artificial Intelligence and Driverless Self-Driving
    Cars” and “State-of-the-Art AI Driverless Self-Driving Cars” (they are all available
    via Amazon). See Appendix A of this herein book to see a listing of the chapters
    covered in those three books.


    For the introduction here to this book, I am going to borrow my introduction from
    those companion books, since it does a good job of laying out the landscape of
    self-driving cars and my overall viewpoints on the topic. The remainder of the
    book is all new material that does not appear in the companion books.


    # INTRODUCTION TO SELF-DRIVING CARS


    This is a book about self-driving cars. Someday in the future, we''ll all have
    self-driving cars and this book will perhaps seem antiquated, but right now, we
    are at the forefront of the self-driving car wave. Daily news bombards us with
    flashes of new announcements by one car maker or another and leaves the impression
    that within the next few weeks or maybe months that the self-driving car will
    be here. A casual non-technical reader would assume from these news flashes that
    in fact we must be on the cusp of a true self-driving car.


    Here''s a real news flash: We are still quite a distance from having a true self-driving
    car. It is years to go before we get there.


    Why is that? Because a true self-driving car is akin to a moonshot. In the same
    manner that getting us to the moon was an incredible feat, likewise can it be
    said for achieving a true self-driving car. Anybody that suggests or even rashly
    states that the true self-driving car is nearly here should be viewed with great
    skepticism. Indeed, you''ll see that I often tend to use the word “hogwash” or
    “crock” when I assess much of the decidedly fake news about self-driving cars.
    Those of us on the inside know that what is often reported to the outside is malarkey.
    Few of the insiders are willing to say so. I have no such hesitation.


    Indeed, I''ve been writing a popular blog post about self-driving cars and hitting
    hard on those that try to wave their hands and pretend that we are on the imminent
    verge of true self-driving cars. For many years, I''ve been known as the AI Insider.
    Besides writing about AI, I also develop AI software. I do what I describe. It
    also gives me insights into what others that are doing AI are really doing versus
    what it is said they are doing.


    Many faithful readers had asked me to pull together my insightful short essays
    and put them into another book, which you are now holding in your hands.'
