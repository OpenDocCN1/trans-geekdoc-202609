    仿佛他们打好了正确的转向灯以进行变道。


    从这个意义上说，变道涉及一种“假动作”。在此语境下，“假动作”是指你开始将车辆向变道方向移动，虽然你尚未完全做出变道决定，但你在“示意”自己即将变道（无论是否使用了转向灯都可能发生这种情况）。因此，我们有一种通过假动作展示即将变道的可能性，同时也存在使用实际转向灯的情况。


    我们有以下组合：


    - 无假动作：使用转向灯

    - 无假动作：不使用转向灯

    - 有假动作：使用转向灯

    - 有假动作：不使用转向灯


    发起者可能不做假动作，仅使用转向灯。然而，有时发起者会打开转向灯，但随后选择不进行变道。或者，他们打开转向灯后一直不关，没有意识到自己正在向其他交通参与者透露即将变道的信息。这可能会让其他驾驶员感到烦躁，因为他们都在等待见证这次变道，但变道并未发生。我相信你见过那些开着转向灯却漫不经心驾驶的司机——你会不禁自问，他们怎么能不知道自己的转向灯开着呢？难道他们不看路面、不关注自己的车吗？


    还有一种情况是无假动作且无转向灯，但驾驶员依然进行了变道。没有任何预警。没有试图表现得礼貌。他们只是突然地、有时甚至是莫名其妙地进行了变道。这种出乎意料的举动特别危险，因为附近的驾驶员并未事先得知这一动向。


    还有一种情况是同时使用假动作和转向灯，这通常很有用，因为两者相互强化，表明该车辆确实真心实意地要变道。当然，还有假动作但未使用转向灯指示的情况。在这种情况下，假动作被视为变道即将发生的更强信号，比转向灯更甚。不过，如果同时也有转向灯作为强化信号，表明该车辆并非只是在随意摇摆，而是真正打算变道，那就更好了。


    ## 所有这一切与 AI 自动驾驶汽车有什么关系？


    在 Cybernetic AI 自动驾驶汽车研究所，我们正在开发自动驾驶汽车的 AI 软件，其中一个快速发展的领域涉及变道。


    对于当今大多数自动驾驶汽车来说，如果你曾观看它们进行变道，你可能会对你看到的情景发笑。通常，它们变道的方式就像一个胆怯的新手 teenage 司机那样。目前的
    AI 只有在变道似乎绝对且充分安全的情况下才会执行变道。


    因此，与大多数人类驾驶员相比，AI 往往会更早开始准备变道。此外，AI 自动驾驶汽车在变道时往往倾向于扰乱交通流，这不是设计初衷，而是考虑到如果你想象一个
    teenage 司机在繁忙的高速公路上变道的情况。其他驾驶员会很快评估这位司机，要么给他们让出很大空间，要么试图利用他们。这就像打扑克牌时，一个外行坐下参与游戏。其他懂得如何打扑克的人都会想尽一切办法对付那个外行。


    我知道你们中的一些人会说，AI 自动驾驶汽车没有必要担心周围的人类驾驶员，因为最终路上的所有车辆都会变成 AI 自动驾驶汽车。醒醒吧！在那之前还需要非常、非常、非常长的时间。仅在美国就有大约
    2 亿辆传统汽车。在很长一段时间内，我们将看到自动驾驶汽车与人类驾驶的汽车混合行驶。


    回想一下，我提到过变道不仅仅是计算动作。它还涉及其他驾驶员的心理。对于人类驾驶员来说，目前他们可以很容易地猜测 AI 自动驾驶汽车的“心理”——只需假设 AI
    基本上会做出最保守、最新手般的变道行为，仅此而已。然而，要判断其他人类驾驶员要复杂得多，尽管经验丰富的驾驶员已经评估出了如何应对。经验丰富的驾驶员不仅观察车辆和驾驶员表现出的行为，还经常观察驾驶员的样貌、车辆的外观、车辆是处于良好状态还是糟糕状态等。


    当今自动驾驶汽车的 AI 并不考虑这些其他方面。相反，AI 简单地检测到另一个物体以某种速度移动，而并不真正关心该车辆的性质、该车辆的驾驶员的性质或任何其他此类方面。一切都是基于计算的。


    一些关于此数学方法的有趣新途径包括引入所谓的缓冲区。想象一下，AI 自动驾驶汽车周围有一个锥形区域，即缓冲区。其他车辆同样在周围有缓冲区。这个虚拟缓冲区是一种“假装”，即假装车辆实际上比其真实尺寸更大。你可以将其视为放置在车辆周围的地理围栏。缓冲区可以很宽，例如，我们决定车辆周围有一个假装区域，宽度为
    4 英尺，环绕车辆四周。或者，缓冲区可能很紧，例如尺寸仅为 1 英尺。


    在尝试变道时，我们会在数学上认为物体（车辆）的大小等于其缓冲区的大小。一个关键原则是我们不希望缓冲区相互接触。如果缓冲区接触，那很可能意味着即将发生碰撞。这就引出了一个问题：我们愿意承担多大的风险？如果缓冲区是
    4 英尺宽，我假设我有一定的允许滑动空间，我可以执行变道，并进入与其他车辆仅 3 英尺的距离内，而不会实际撞击到其他车辆，即使我侵入了它们的缓冲区。


    从数学上讲，我们希望 AI 能够“证明”碰撞避免将被保持。


    因此，我们取发起者的缓冲区和响应者的缓冲区，对它们的速度以及在变道发生时的近期可能行为做出假设，然后进行计算，看看是否可以在保证不碰撞的情况下执行变道。


    在实验室或模拟器中执行这一点很容易。在现实世界中，这需要实时完成。这就引出了一个问题：计算是否能足够快，以便做出变道决定并执行变道？如果计算花费了比如多 3
    秒钟，变道的机会就消失了。此外，由于情况已经改变，整套计算现在变得毫无价值，需要执行新的一整套计算。


    尽可能预先计算这一点。你可以在 AI 系统上板载许多针对各种情况的预先计算，因此不必在当下进行计算，而是查阅表格以查看这些表格指示的内容。这类似于国际象棋。你可以拥有一个必须计算所有各种可能性和走法排列的国际象棋程序，或者你可以拥有预存的模板，一旦棋盘处于特定配置，你只需查找并知道下一步应该走什么。我们可以对
    AI 自动驾驶汽车和变道做类似的事情。


    但不完全是这样。因此，我们很可能有时仍需要进行原始计算。如果是这样，这些计算必须在实时下进行，以匹配情况的时间约束。麻省理工学院研究人员最近的一项方法涉及计算一个涉及缓冲区和方向、速度等的物流函数，然后与拉普拉斯-高斯分布（“钟形曲线”）结合，以实时估算执行变道并在避免碰撞的情况下完成的可能性。


    解决此问题的努力需要应对严格的时间约束、实时计算，以及考虑可用信息的多少及其可靠性。


