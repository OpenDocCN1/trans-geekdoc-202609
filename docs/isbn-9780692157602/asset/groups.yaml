    开发 AI 自动驾驶汽车的传统方法是拿一张白纸，试图把它变成能开车的东西。没有像人脑似乎一开始就具备的那种内在能力作为基础，我们可能是在以错误的方式处理这个问题。我们可能需要首先解决先天性问题，一旦做到了这一点，叠加上去以驱动汽车可能相对容易，并能让我们达到
