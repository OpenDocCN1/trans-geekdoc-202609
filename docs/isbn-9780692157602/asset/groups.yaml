    It is contended that most people would think that the Tesla Autopilot is a true
    Level 5 self-driving car, which is the level at which an AI self-driving car is
    driven by the AI and there is no human assistance needed. Indeed, many auto makers
    and tech firms that are aiming toward Level 5 self-driving cars are making them
    so that there aren’t any driver controls in them at all, at least none for humans
    to use. The notion is that the AI is the driver of the car. There is no human
    driving.


    Tesla’s Autopilot is currently considered somewhere around a Level 2 or Level
    3. It absolutely requires that a human driver be present, and that the human driver
    be ready to take over control of the car. It is not in that sense a true self-driving
    car (i.e., it is not a Level 5). And yet, some would say that the manner in which
    Tesla is marketing and promoting the car would tend to mislead consumers into
    believing that it is a true self-driving car.


    Another common complaint about Tesla’s approach is that they have “cleverly” named
    their AI system to be called Autopilot. What impression do you have of the word
    “autopilot” in general?


    For most people, they tend to think of an airplane autopilot, of which, they assume
    that it means that an airplane can be flown without the need for a human pilot
    to intervene. We’ve all seen TV shows and movies wherein the human pilot turns
    on the autopilot, and then reads the newspaper or maybe even falls asleep. That’s
    the general notion that people seem to have about the word autopilot. Does then
    the naming of the Tesla Autopilot also contribute to deceiving people into believing
    that the AI of the Tesla at this stage of capability is more capable than it really
    is?


    Meanwhile, the deadly Tesla driving incidents of May 2016 and March 2018 have
    been assessed so far as occurring as a result of the human driver failing to do
    their part in terms of driving the car, and for which it is then been stated by
    the NTSB in the May 2016 case that the human driver had a “pattern of use of the
    Autopilot system indicated an over-reliance on the automation and a lack of understanding
    of the system limitations.”


    Furthermore, each time that there has been a Tesla incident involving an activated
    Autopilot, the Tesla company has right away pointed the finger at the human driver.
    The human driver was not paying attention, they say. The use of the Autopilot
    requires an active human driver, they say, and emphasize that the Tesla owner''s
    manual states this, along with an on-screen message. According to the NHTSA though,
    “it’s not enough to put it in an owners'' manual and hope that drivers will read
    it and follow it.”


    Tesla claims that the human drivers do know that they are key to the driving task,
    as based on surveys that Tesla has conducted. Thus, when an accident occurs such
    as the March 2018 incident, they pointed out that: “The driver had received several
    visual and one audible hands-on warning earlier in the drive and the driver''s
    hands were not detected on the wheel for six seconds prior to the collision.”
    In other words, it is being implied that the human driver should have known —
    and was in a sense warned to be in-the-know, and yet the human driver failed to
    do so, and thus presumably the human driver is then responsible for the incident
    and not the auto maker.


    Some accuse Tesla of wanting to have their cake and eat it too, in that on the
    one hand it wants to promote its Autopilot as the greatest thing since sliced
    bread, and yet at the same time try to retreat from any such implication when
    it comes time to own up when an accident occurs. There are some that suggest it
    is like in the movie Casablanca, wherein the French Captain Louis Renault pretends
    to look the other way and tells the police to round-up the usual suspects, when
    he really knows who done it.


    Tesla points out that they intentionally have the steering wheel touch sensor
    in order to act as a continual reminder to the human driver to remain attentive
    to the driving task. Some experts have said they should have done more, such as
    using eye movement detection and face monitoring to be able to be assured that
    the driver is actually watching the road ahead. It was recently revealed in an
    account in the Wall Street Journal that Tesla had considered adding such equipment
    but decided not to do so, which may come back to bite them.


    Will the Federal Trade Commission opt to investigate the claim against Tesla of
    having deceptive and misleading advertising and marketing practices?


    No one knows.


    If they do open an investigation, it would certainly seem to cast a shadow over
    Tesla and its Autopilot. Tesla already seems to be facing a number of other issues
    and this might be another weight on the camel''s back. Or, it could be seen as
    something minor and more of the usual kind of bravado that many of the tech firms
    seem to exhibit. Also, there are some that feel any regulation that looks over
    the shoulder of self-driving car makers is going to stunt the growth and pace
    of advance for AI self-driving cars, and so there is resistance toward taking
    action against these makers.


    Even if an official investigation is launched, it could be that Tesla might try
    to settle the matter rather than having to duke it out and have the public become
    concerned or confused as to what the fuss is all about. Some suggest that Tesla
    could readily change the name of the Autopilot and try to re-brand it, selecting
    a name that would perhaps have less of a connotation baggage associated with it.
    They could also increase the manner in which they warn human drivers about the
    capabilities of the car. All of this could be done to appease the regulator and
    yet not cause a dent particularly in the allure of Tesla.


    I''ve already warned that for all of the AI self-driving car makers and tech firms,
