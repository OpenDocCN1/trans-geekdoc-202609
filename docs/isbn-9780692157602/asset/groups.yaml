  - '[PAGE 103]


    The Tesla was reportedly following a lead car, doing so at 8 seconds before the
    crash (and might have been doing so even longer, but we don’t yet know), and at
    4 seconds before the crash it was no longer following a lead car. For those of
    you not familiar with self-driving cars, they often use a pied piper approach
    to driving. They spot a car ahead, and then try to match to the pace of that car.
    If the car ahead speeds-up, the self-driving car will speed-up, but only to some
    maximum such as the speed limit or perhaps what has been set on the cruise control
    via the human driver in the self-driving car. If the car ahead slows down, the
    self-driving car tends to slow down.


    As I’ve said many times before, this pied piper approach is extremely simplistic.
    It’s what a teenage novice driver does when they are first learning to drive,
    but they quickly realize there are many downsides to this approach. If the approach
    is not augmented by more sophisticated driving techniques, it’s something that
    has only limited utility. By the way, keep in mind that the Tesla models of today
    are considered at a Level 2 or Level 3, but are not yet at a true Level 5, which
    is a self-driving car for which the AI can entirely drive the car without any
    human intervention. At the levels less than 5, the human driver is considered
    the driver of the car, in spite of whatever else the “self-driving car” can do
    or is suggested or implied that it can do.


    Once the lead car was no longer ahead of the Tesla, the Tesla then reportedly
    increased speed, since it was going at 62 miles per hour while following the lead
    car, and then with a presumed clear space ahead it opted to increase speed to
    71 miles per hour at the time of the crash. This “makes sense” in that the system
    will aim to go to the maximum allowed speed if it believes that there is no car
    ahead of it that would impede doing so. The NTSB says that the driver had set
    the cruise control to a maximum of 75 miles per hour, and so the Tesla was likely
    trying to accelerate to that stated speed. As a side note, the NTSB points out
    that the speed limit in that location is only 65 miles per hour.


    What’s especially intriguing in the NTSB preliminary report is that supposedly
    the Tesla was left steering, doing so at 7 seconds before the crash. The implication
    is that this continued until the actual crash.'
