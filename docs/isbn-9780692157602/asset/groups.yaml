    # # The Counterclockwise Spin


    Per the NTSB report for the Mountain View incident, the report says that the Tesla
    struck the attenuator while going 71 mile per hour, and then the impact “rotated
    the Tesla counterclockwise” and ultimately “caused a separation of the front portion
    of the vehicle.” I think we can all agree that hitting something like the attenuator
    at a speed of 71 miles per hour is going to exert a tremendous amount of force
    and it certainly seems to have been the case since it caused the front of the
    Tesla to become separated. It was a hard hit. I don''t think anyone can dispute
    that.


    What’s interesting is the notion that the Tesla spun counterclockwise. I''ve not
    yet seen anyone comment about this aspect. I''ll speculate about it. If the Tesla
    had hit the attenuator fully head-on, we would need to study the physics of the
    result, but it generally might not have led to a spin of the Tesla. More than
    likely, the Tesla probably hit at a front-edge of the car, such as toward the
    left side of the front edge or to the right of the front edge. This would be more
    likely to generate a spinning action after the impact. Since the Tesla apparently
    spun counterclockwise, we''ll assume for the moment that it hit at the left side
    edge of the front of the Tesla, which then jammed the left side against the attenuator,
    and the right side of the Tesla continued forward which caused it to pivot from
    the leftside, making it go counterclockwise. This is all speculation and we''ll
    need to see what the NTSB has to say about it.


    I''ll explain in a moment why I think this counterclockwise spinning is a useful
    clue.


    # ## Aftermath of the Crash


    After having crashed and spun, the Tesla was involved in subsequent collisions
    involving two other cars that were presumably driving southbound and got inadvertently
    caught up in the incident. I''ll assume for now that those additional crashes
    had nothing to do with the initial crash per se, and were just part of the aftermath.'
  - '[PAGE 98]


    I am saddened that those subsequent crashes occurred, and it also serves as a
    reminder about my earlier remarks that incidents involving self-driving cars aren''t
    necessarily confined to impacting just the driver but can also include other innocents
    that get caught up in the cascading impacts. According to the NTSB report, one
    of those other drivers suffered minor injuries, and the other was uninjured. I''d
    say that''s nearly a miracle. No matter what led to the initial crash, any aftermath
    can often be horrific.


    The NTSB report further mentions that the 400-volt lithium-ion high-voltage battery
    in the Tesla caught fire as it was breached during the incident, and a post-crash
    fire ensued (these can be intense fires; the fire department arrived and was able
    to put out the fire). It is uplifting to note that the NTSB report essentially
    suggests that bystanders got out of their cars and came to the rescue of the driver
    in the Tesla, bravely removing him from the vehicle, in spite of the dangers of
    the fire. The NTSB report indicates that the Tesla driver was transported to a
    hospital but died there from his injuries. In any case, I applaud those brave
    souls that rescued him from the crash.


    # ## Layout of the Crash Scene


    The NTSB preliminary report does not depict a layout of the crash scene. I''ve
    used Google Maps to try and see if I can figure out what the crash scene was like.
    This is admittedly speculation. The final NTSB report should officially describe
    the crash scene and will be usually based on photos taken at the time and physical
    evidence at the crash scene, as per the investigative team that inspected the
    location.


    Based on what I can discern, it appears that the crash occurred at the split of
    the US-101 continuing forward and an exit ramp to get onto the SH-85 as a left-side
    offshoot. There appears to be a triangular shaped “gore area” that divides the
    two. I’m sure you’ve seen this kind of thing before. You have two lanes that are
    running next to each other, and at some point up ahead they split from each other.
    At that splitting or fork, one lane goes straight ahead, while the other veers
    off. In-between the split is a triangular area that divides the two splitting
    lanes. In this case, there was a concrete median in that gore area and it had
    the attenuator at the front-edge of the concrete median.'
  - '[PAGE 99]


    It appears that there was for a while two HOV lanes leading up to the split. One
    HOV lane was for those continuing on US-101, and the other was for those cars
    wanting to veer off to the left as part of the exit from the US-101 leading to
    the SH-85. I don’t know that this is exactly where the incident occurred. As I
    say, I’ve just looked at Google Maps and tried to guess based on what the NTSB
    slim details so far suggest.


    See Figure 1.'
  - '[PAGE 100]


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_100_0.png)'
  - '[PAGE 101]


    # Timing of the Crash


    The vital aspects about the crash are contained in the timing aspects reported
    so far by the NTSB.


    According to the NTSB, at 18 minutes 55 seconds before the crash, the Autopilot
    was engaged. It apparently remained engaged the entire time thereafter. This is
    important because if the Autopilot was not engaged then we likely wouldn''t be
    discussing any of this, it would generally have been a traditional crash since
    the Tesla would have been operating like any everyday car. Also, if the Autopilot
    had suddenly been engaged just seconds before the crash, we might be of a mind
    to say that the Autopilot had insufficient time to get started and so it was not
    especially a participant in the crash. In this case, it seems like the Autopilot
    had been on, it had been on for quite some time before the crash, and it was still
    on at the time of the crash.


    Take a look at Figure 2.'
