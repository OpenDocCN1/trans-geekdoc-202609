    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_199_0.png)'
  - '[PAGE 200]


    There is AI as we know it today, and which ultimately hopefully we''ll get to
    AGI, though maybe it requires us taking some kind of alternative path that we
    don''t even know about today. It could be that AGI is the end all. There might
    not be anything beyond AGI. Maybe we''d all be happy to have computers that have
    the same mental capabilities as us. But, it could also be that there''s something
    beyond us, and the AGI might become ASI.


    How would the AGI become ASI?


    If humans got today''s AI to become AGI, maybe we can push on AGI and get it to
    evolve into ASI. Or, maybe we aren''t smart enough to do that. Maybe the AGI will
    somehow be smart enough, even though it presumably is only just as smart as us.
    On the other hand, maybe the AGI when running on computers all around the globe
    all the time can figure things out that us humans cannot.


    And so there are some that believe the AGI will encounter an intelligence explosion,
    as it were, and fuel upon itself to become ASI. There will be a kind of runaway
    reaction of self-improvement by the AGI. Think of this like a nuclear reactor
    that goes "critical" and there is an incredible mental chain reaction. Some would
    say that this could happen and be entirely out of human hands. We presumably don''t
    start it, other than we were the ones that got us to the AGI stage, and we nor
    can''t stop it once it gets underway. There aren''t any nuclear rods to pull out
    to slow down or stop the reactive matter.


    I know that there are plenty of science fiction movies that depict this kind of
    thing. In some plots, the humans are unable to prevent or stop this from happening.
    In other cases, they manage to pull the plug just in time, or maybe take hammers
    and bats to the computers to disrupt them during the chain reaction. Or, a clever
    human happens to have a USB stick containing a computer virus that they manage
    to plug into their home PC and it infects the ASI everywhere, halting it in its
    tracks. By the way, so that you can sleep at night, rest assured I keep such a
    USB stick next to my bed at night, just in case.


    Well, maybe.'
  - '[PAGE 201]


    # # ASI Emerges to Singularity


    Anyway, this act of ASI emerging is often referred to as singularity.


    Will we reach a point of singularity? It’s hard to say. It would seem like we
    need to first get to AGI. For those of you that are overly ambitious, you might
    say that you are going to skip AGI and go directly to ASI and get us to singularity.
    Good luck on that.


    Let’s assume that singularity happens, then what? Is there something that comes
    after ASI? So far, it seems like most predictions are that either ASI opts to
    enslave all humans and/or kills off mankind, or, ASI embraces humans and helps
    save mankind and extends mankind. It seems like most people are thinking that
    the singularity will perceive us humans as nothing more than bugs or cockroaches,
    and so a vote today would probably produce the doomsday or “sad face” scenario
    as considered most likely. If its Ok with you, I’ll side with the glass is half-full
    group, and I’ll vote that the singularity likes us and has intelligence that can
    see the better side of things, so this is the “smiley face” or uplifting scenario.


    With man’s inhumanity to man, I realize it maybe seems hard to believe that the
    singularity will consider us worthy. But, hey, maybe it will give the singularity
    something fun and challenging to do – it will seek to shape up mankind, and do
    so without actually enslaving us. That’s a pretty good mental problem to try and
    solve, you must admit. Wouldn’t a superintelligence want and maybe even need tough
    problems to solve?


    Take a look next at Figure 2.'
