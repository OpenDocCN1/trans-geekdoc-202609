    # ABOUT THE AUTHOR


    Dr. Lance B. Eliot, MBA, PhD is the CEO of Techbruum, Inc. and Executive Director
    of the Cybernetic Self-Driving Car Institute, and has over twenty years of industry
    experience including serving as a corporate officer in a billion dollar firm and
    is a partner in a major executive services firm. He is also a serial entrepreneur
    having founded, ran, and sold several high-tech related businesses. He previously
    hosted the popular radio show *Technotrends* that was also available on American
    Airlines flights via their in-flight audio program. Author or co-author of a dozen
    books and over 400 articles, he has made appearances on CNN, and has been a frequent
    speaker at industry conferences.


    A former professor at the University of Southern California (USC), he founded
    and led an innovative research lab on Artificial Intelligence in Business. Known
    as the “AI Insider” his writings on AI advances and trends has been widely read
    and cited. He also previously served on the faculty of the University of California
    Los Angeles (UCLA), and was a visiting professor at other major universities.
    He was elected to the International Board of the Society for Information Management
    (SIM), a prestigious association of over 3,000 high-tech executives worldwide.


    He has performed extensive community service, including serving as Senior Science
    Adviser to the Vice Chair of the Congressional Committee on Science & Technology.
    He has served on the Board of the OC Science & Engineering Fair (OCSEF), where
    he is also has been a Grand Sweepstakes judge, and likewise served as a judge
    for the Intel International SEF (ISEF). He served as the Vice Chair of the Association
    for Computing Machinery (ACM) Chapter, a prestigious association of computer scientists.
    Dr. Eliot has been a shark tank judge for the USC Mark Stevens Center for Innovation
    on start-up pitch competitions, and served as a mentor for several incubators
    and accelerators in Silicon Valley and Silicon Beach. He served on several Boards
    and Committees at USC, including having served on the Marshall Alumni Association
    (MAA) Board in Southern California.


    Dr. Eliot holds a PhD from USC, MBA, and Bachelor''s in Computer Science, and
    earned the CDP, CCP, CSP, CDE, and CISA certifications. Born and raised in Southern
    California, and having traveled and lived internationally, he enjoys scuba diving,
    surfing, and sailing.'
