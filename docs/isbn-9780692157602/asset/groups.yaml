    \ these multi-ton deadly machines -- and for which at any moment they could do\
    \ whatever they want, we don’t have utter chaos. We’re pretty much all well behaved\
    \ most of the time.\n\nThanks goes to all you drivers for a general consensus\
    \ on sanity when driving.\n\nFor teenage drivers that are learning to drive, they\
    \ often find that changing lanes is one of the scariest aspects of driving a car.\
    \ Should I go now, or should I wait? Can I make the lane change or will I cut-off\
    \ another car? Is that car going to allow me into that lane? Should I speed-up?\
    \ Should I slow down? I remember when I was first learning to drive a car, and\
    \ we had five high school students in my driver ed class, and for which (scarily)\
    \ we always all drove in one car with the driving instructor. Each student would\
    \ get about ten minutes of driving time per instructional trip.\n\nOne of the\
    \ students would make a lane change that took maybe\n\n- **Mental distractions**\
    \  \n  When you are solely driving a car, you might have some mental distractions\
    \ like you are thinking about what you are going to wear to that party tonight.\
    \ But, you still have at the forefront the driving task. When you have the AI\
    \ doing the driving, you tend to allow mental distractions to takeover more of\
    \ your mental processing. It’s a natural tendency.\n\n- **Physical mispositioning\
    \ for task**  \n  Most of the time, if you are solely driving a car, you have\
    \ your foot on the gas or the brake, you have your hands on the wheel, all of\
    \ this is continuous. When you are sharing the driving with the AI, you are likely\
    \ to take your feet off the peddles, and your hands off the wheel. Even if you\
    \ are timed and need to periodically put your hands on the wheel, this is not\
    \ the same as continuously having your hands on the wheel.\n\n- **Confused about\
    \ Theory of Mind re: AI**  \n  This is one aspect that not many are considering,\
    \ namely, the human driver needs to have a theory of mind about the AI driving\
    \ capability. This is akin to if I had a novice teenage driver at the wheel of\
    \ my car. I would generally know what the teenage driver can handle and not handle.\
    \ Right now, few of the human drivers have a sufficient understanding of the theory\
    \ of mind about what the AI can and cannot do.\n\n- **False assumptions about\
    \ safety**  \n  The human driver tends to believe that if an accident hasn’t yet\
    \ happened while the AI is driving, it probably implies there won’t be an accident.\
    \ The longer that the AI drives and seems to be accident free, the more this false\
    \ assumption about safety increases.\n\n- **Lulled into overreliance**  \n  The\
    \ human driver begins to become over reliant on the AI driving the car. You’ve\
    \ likely seen the videos of those idiots that put their head out the window of\
    \ the car and speak to the video camera about how great it is that the AI is driving\
    \ the car. All it would take is for that car to get into a predicament and that\
    \ head-out-the-window driver would likely get injured or killed (or, lose their\
    \ head).\n\n- **Insufficient reaction time**  \n  This is one of the most insidious\
    \ aspects about a co-shared responsibility. Imagine a teenage driver that was\
    \ about to ram into a brick wall and suddenly looked at you, the adult sitting\
    \ in the passenger seat, and told you to take the wheel. Too little, too late.\
    \ This is what is going to keep happening with today’s AI self-driving cars.\n\
    \n- **Disjointed from the driving task**  \n  Inevitably, the human driver is\
    \ going to feel disjointed from the driving task. Even if you put all sorts of\
    \ facial monitoring and eye monitoring, it’s an instinctive kind of aspect that\
    \ you are no longer solely responsible and so you feel less committed to the driving\
    \ task. This is human nature.\n\n- **Unanticipated instantaneous engagement**\
    \  \n  This idea that the human driver will need to become instantlyaneously engaged\
    \ in the driving task, when meanwhile they’ve been only partially engaged, and\
    \ that it will most likely occur in an unanticipated moment, this is another one\
    \ of those seemingly impractical notions.\n\n- **Other**  \n  You might already\
    \ be aware that Google’s Waymo has been keen to develop an AI self-driving car\
    \ and has tended towards achieving a Level 5. Why? One reason likely is that it\
    \ removes the co-sharing of the driving task. This eliminates all of the above\
    \ human frailties and issues of design and development related to getting the\
    \ human and the automation to work together in a coordinated and blissful manner.\n\
    \nThere’s also the aspect that having AI that can fully drive a car without human\
    \ intervention is a much more challenging technical aspect, since you presumably\
    \ need to make the AI so good that it can drive like humans can. When you have\
    \ a self-driving car that has a co-shared responsibility, you can always lean\
    \ on the human to make up the slack for whatever you could not get the AI to be\
    \ able to do. Some see this as a half-baked technical solution.\n\nFor those auto\
    \ makers and tech firms in the middle ground, above the low-tech conventional\
    \ car and not yet at the true Level 5, it’s going to be ugly times for all.\n\n\
    Those that naively think that they can just push technology out the door and expect\
    \ humans to play along, well, perhaps the scooter wars are a good lesson. You\
    \ can make seemingly wonderful technology, but those darned humans are not going\
    \ to abide by what you want them to do. Is this then an excuse for you? I don’t\
    \ think so. I assert that making a better mousetrap means more than just the technology\
    \ itself, and that you have to take into account the nature of humans, else in\
    \ the end it’s going to be a deathtrap. AI self-driving cars are a serious innovation\
    \ and I hope it’s not going to get undermined, perhaps inadvertently in the rush\
    \ to get it onto our streets and yet in the end produce untoward results that\
    \ will kill the golden goose for all of us, society included.\n"
  mdcn: "\n\n## 第 3 章\n### 变道与自动驾驶汽车\n\n嘿，伙计，选一条车道并坚持使用。真不敢相信刚才那个司机竟然插入了我的车道。我需要快速变到旁边的车道。前方有一辆车挡住了我的车道。这里的车道数量不足以容纳这么多车。这些车道标记得很差，车辆正在相互靠近。我到底应该在哪条车道上？应急车道根本看不见。司机们非法地进出高负载车道（HOV\
    \ 车道）。\n\n你可能已经想过或大声说过前面这些关于道路车道的评论。我们生活在一个充满车道的世界里。在开放式公路上，也许每个方向只有两三条车道。在某些高速公路上，有时每个方向有五车道。在山区道路上，通常每个方向只有一条车道，偶尔会窄到只剩一条车道，需要格外小心对向车辆。\n\
    \n车道的标记方式多种多样。有时路面会有凹凸的点状标记，当你越过它们时，轮胎和车身会震动，提醒你刚刚跨过了车道。有些车道是用平面油漆标记的，因此跨车道时没有“感觉”，完全依靠视觉。可能完全没有任何标记，车道的所在位置只能凭直觉。此外，在某些特殊情况下，车道可能由橙色锥形桶标记，形成临时车道，例如在车祸后，警方试图重新引导交通。\n\
    \n在拥有飞行汽车的那一天到来之前，我们需要意识到道路车道的重要性。仔细想想，人们大多数时候都愿意遵守车道规则，这其实挺神奇的。每天早上，在我漫长的高速公路通勤途中，我观察并惊叹于司机们通常都同意待在各自的车道内。他们并非必须如此。你可以骑跨两条车道，并没有任何即时因素会阻止你这样做。没有高速公路激光会电击你的车，也没有大锤子会敲打你的车让你让开。不，我们只是自愿遵守车道规则。\n\
    \n我们这样做部分是因为法律。作为司机，你不希望被开罚单，所以遵守车道规则。此外，你很清楚，如果你过度骑跨车道，其他司机会对你进行“正义执行”。其他车会按喇叭，有时甚至会对准你，以类似“胆小鬼游戏”的方式强迫你变道。我并不是说司机从不骑跨车道，同样，他们经常对变道做出非常糟糕的决定，但我只是想说的是，大多数时候，所有这些驾驶数吨重致命机器的人能在任何时候做任何想做的事而没有陷入完全混乱，这简直是个奇迹。我们大多数时候都很守规矩。\n\
    \n感谢所有司机在驾驶时保持理智的共识。\n\n对于正在学车的青少年司机来说，他们常常发现变道是开车最令人恐惧的方面之一。我现在该走，还是该等等？我能完成变道，还是会切断其他车的路线？那辆车会让我进入那条车道吗？我该加速吗？我该减速吗？我记得我最初学开车的时候，我的驾驶教育班里有五名高中生，我们（令人担忧地）总是和驾驶教练一起在同一辆车里。每次教学行程中，每个学生大约只有十分钟的驾驶时间。\n\
    \n其中一个学生进行了一次变道，可能耗时\n\n- **精神分心**  \n  当你独自开车时，可能会有些精神分心的情况，比如你在想今晚去参加派对穿什么。但你仍然将驾驶任务放在首位。当由人工智能开车时，你往往会让精神分心占据更多的心理处理能力。这是一种自然的倾向。\n\
    \n- **任务姿势不当**  \n  大多数时候，如果你独自开车，你的脚踩在油门或刹车上，手握着方向盘，这一切都是连续的。当你在与人工智能共享驾驶任务时，你很可能会把脚从踏板上移开，把手从方向盘上移开。即使你需要计时并定期把手放回方向盘，这也与持续握着方向盘不同。\n\
    \n- **对人工智能的心智理论感到困惑**  \n  这是一个鲜有人考虑到的方面，即人类司机需要对人工智能的驾驶能力拥有“心智理论”。这类似于如果我让一个新手青少年司机坐在我车的主驾驶位上。我通常知道这个青少年司机能处理什么，不能处理什么。目前，很少有对人工智能能做什么和不能做什么有足够理解的心智理论。\n\
    \n- **关于安全性的错误假设**  \n  人类司机往往认为，如果人工智能驾驶时还没有发生事故，那就意味着可能不会发生事故。人工智能驾驶得越久且似乎无事故，这种关于安全性的错误假设就越强烈。\n\
    \n- **陷入过度依赖**  \n  人类司机开始过度依赖人工智能开车。你很可能见过那些把脑袋伸出车窗外对着摄像机讲述人工智能开车多棒的视频，那些人是傻瓜。只要那辆车陷入困境，那个把脑袋伸出窗外的司机很可能会受伤或死亡（或者，失去他的脑袋）。\n\
    \n- **反应时间不足**  \n  这是共享责任中最阴险的方面之一。想象一个青少年司机即将撞上一堵砖墙，突然转向坐在副驾驶座上的你（成年人），告诉你接管方向盘。为时已晚，行动太迟。这就是当今人工智能自动驾驶汽车将不断发生的情况。\n\
    \n- **与驾驶任务脱节**  \n  不可避免地，人类司机会感到与驾驶任务脱节。即使你使用各种面部监测和眼部监测，这是一种本能的方面，因为你不再独自负责，所以你对驾驶任务的投入感降低。这是人的本性。\n\
    \n- **无法预料的即时投入**  \n  认为人类司机需要瞬间完全投入驾驶任务，而之前他们只是部分投入，并且这很可能发生在无法预料的时刻，这是另一个看似不切实际的概念。\n\
    \n- **其他**  \n  你可能已经知道，谷歌的 Waymo 一直热衷于开发人工智能自动驾驶汽车，并倾向于实现 5 级自动驾驶。为什么？一个可能的原因是，它消除了驾驶任务的共享。这消除了上述所有人类弱点以及与让人类与自动化协调和谐工作相关的设计开发问题。\n\
    \n还有一个方面是，能够完全无人驾驶而无需人工干预的人工智能，在技术上更具挑战性，因为假设你需要让人工智能足够好，能够像人类一样驾驶。当你有一个共享责任的自动驾驶汽车时，你总是可以依靠人类来弥补人工智能无法做到的地方。有些人认为这是一个半成品技术方案。\n\
    \n对于处于中间地带的汽车制造商和科技公司来说，高于低技术的传统汽车但尚未达到真正的 5 级，这将是一个艰难的时刻。\n\n那些天真地认为他们可以把技术推出大门并期望人类配合的人，嗯，滑板车战争或许是一个很好的教训。你可以制造看似美妙的技术，但那些该死的人类不会遵守你希望他们做的事情。这算是你的借口吗？我不这么认为。我断言，制造更好的捕鼠器不仅仅意味着技术本身，你必须考虑到人类的特性，否则最终它将是一个死亡陷阱。人工智能自动驾驶汽车是一项严肃的创新，我希望它不会因此被破坏，也许在急于将其推向街头时无意中产生了不良后果，这将扼杀我们所有人（包括社会）的金鹅。\n\
    \n"
