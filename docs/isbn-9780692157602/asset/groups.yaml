    # # CHAPTER 7

    ## FREEZING ROBOT PROBLEM AND SELF-DRIVING CARS


    There were two human chess masters playing a chess game the other day. It was
    a timed game. Each had no more than five minutes to make their move on the chessboard.
    After making a move, the player making the move would press down on the top of
    a small clock-timer on the table to signal that they had made their move. You’ve
    probably seen this in various chess tournaments.


    At the start of the chess game, they were each slapping the timer as fast as they
    could get their hands on top of it. The initial moves in a chess game are often
    lightning fast since the opening maneuvers are all pretty much well studied and
    practiced. This also tends to happen towards the end game portion of a chess match
    too, wherein usually there are so few pieces left that the moves are relatively
    obvious and so the players are quick to make their moves.


    Mid-game of a chess match the moves tend to slow down. This is due to being in
    muddied territory. The chess players opt to study very carefully each move and
    must contend with the combinatorial explosion involved. By this, I mean that if
    the player moves a piece to a particular square on the chessboard, they try to
    think ahead as to the counter move by their opponent, and then their counter move
    to the counter move, and so on. In chess it is referred to as levels of ply. You'
  - '[PAGE 125]


    can try to think ahead one ply, which is not very hard to do, or try to think
    ahead a multitude of ply, which can be very mentally taxing.


    In this particular chess match that I was watching, the chess players were in
    deep concentration at the mid-game. Sometimes, the player would reach out as though
    ready to make a move, and then returned their arm and hand back to their lap or
    side. Sometimes, the player would put their fingers onto the chess piece, and
    act as though their fingers were glued to the piece. The player would look to
    the piece and the surrounding chess squares, and then finally after what seemed
    like a long time of focus, would then move their piece, and then gently slap the
    clock-timer. It was obvious that the two players were evenly matched and each
    was playing at their top form. A battle royale, as it were.


    I was transfixed by their play and was watching the chessboard and them at the
    same time. They would at times lean forward, lean back, brush their hands through
    their hair, put their hands on the top of their heads as though they would explode,
    and so on. And then the unthinkable happened. One of the players was seemingly
    concentrating deeply and apparently lost track of the time (even though there
    was a timer within inches of their reach). Believe it or not, the time ran out
    on the player. The player, upon realizing what had just happened, appeared to
    be crestfallen. He had lost. He tried to argue that it was not a fair loss since
    he had not actually lost by having been checked or pinned by a checkmate, and
    nor had he conceded the game to the other player.


    The rules were the rules, and he was politely informed that he had lost the chess
    match. He continued to protest. Do you think he was right that it was “unfair”
    that he lost the match simply due to running out his clock? Some attendees felt
    disappointed and wanted to see the two titan players really go at each other and
    they thought that a mere lack of moving in time seemed untoward to them as a reason
    to have the match end. Others pointed out that he knew it was timed, and yet he
    opted to let the time lapse. It was his own fault. Shame on him. No excuses. In
    fact, if the timer is not really going to be observed as part of the rules, then
    why even have a timer there at all. Just tell the players they can take as much
    time as they please. It could become a multi-'
  - '[PAGE 126]


    hours game, or maybe multi-days, multi-weeks, or even multi-decades game.


    However you feel about the chess game and timer, one thing is seemingly clear,
    the chess player froze-up. He had a human freezing problem. This is when you seemingly
    fail to do something that was otherwise expected to occur, and you “freeze” in
    place. Maybe you’ve seen baseball players that freeze-up and fail to swing the
    bat at a pitch. Or, maybe you’ve had a moment when you were out hiking and saw
    a bear, and you froze in position, not sure what to do. It is somewhat common
    for humans to occasionally freeze when they are expected to take some action or
    be in motion.


    Freezing up can have adverse consequences. We’ve just seen that the chess player
    lost the game due to freezing. A baseball player might have taken a strike ball
    that otherwise could have been hit out of the ballpark. That bear that you saw
    might come charging at you and had you been nimbler you might have gotten away
    from its claws. There are some occasions whereby freezing might be good, such
    as again with the bear and suppose by freezing the bear considered you not a threat
    or even failed to notice you. But, overall, I think it’s fair to say that most
    of the time a freeze is probably not a good course of action.


    People can freeze due to fright. The sight of a bear might be enough to cause
