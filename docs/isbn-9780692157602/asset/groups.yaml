    What was causing the Tesla to steer left? We aren’t sure that it was the human
    driver, since the NTSB says that there weren’t any hands on the steering wheel
    at 6 seconds to go, and nor until the crash. We also don’t know how much left
    steering was involved – was it a radical left or just a mild torque to the left?
    We really need to see what the NTSB final report says about this.


    Per the NTSB, there was no pre-crash braking by the Tesla. This implies that neither
    the human driver hit the brakes, and nor did the Autopilot system. Per the NTSB,
    there was no evasive steering. This implies that neither the human driver tried
    to steer clear of the crash, and nor did the Autopilot system.


    This then is the conundrum.


    We have a car going about 70 miles per hour that plowed into the gore area and
    unabatedly slammed into the attenuator that was at the end of the concrete median
    and did so without any apparent indication by the behavior of the car that it
    was about to happen.


    The human driver did not try to stop the car. The human driver did not try to
    avoid the attenuator by swerving the car. Any of these options were presumably
    available in that we can assume reasonably that the brakes were operational and
    that the steering wheel was operational, as far as we know.


    The Autopilot system did not try to stop the car. The Autopilot system did not
    try to avoid the attenuator by swerving the car. Any of these options were presumably
    available in that we can assume reasonably that the brakes were operational and
    that the steering was operational and that the Autopilot system had an ability
    to command those controls, as far as we know.


    Before I launch into speculation about how this occurred, let’s add some other
    elements to the situation. The speed of 62 miles per hour is about the same as
    going 91 feet per second. The speed of 71 miles per hour is about the same as
    going 104 feet per second. The usual rule-of-thumb for proper driving practices
    is to maintain a distance of about 1 car length for every 10 miles per hour of
    speed. Most human drivers don’t do this, and they often are very unsafe in terms
    of the distance they maintain from a car ahead of them. In any case, most self-driving
    car systems try to maintain the proper recommended distance.


    The Tesla Model X is approximately 16 feet in length. So, going at about 60 miles
    per hour, it presumably was trying to maintain a distance of about $(60 \text{
    mph} / 10) \times 16 = 96$ feet, or 6 car lengths. In the timeline, this would
    mean that the Tesla was about one second behind the lead car.


    Where did the lead car go? Did it opt to get out of the HOV lane and maybe went
    into the lane to the right? In which case, this implies that in one second of
    time, from 5 seconds out to the 4 seconds out, it changed lanes and got into the
    next lane over. Or, did it maybe switch into the exit ramp lane to the left? We
    don’t know.


    Or, did the Tesla move to the left from the 7 seconds out to the 4 seconds out,
    using up 3 seconds, moving so much so that it was no longer directly in the HOV
    lane that it had been using to follow the lead car? Thus, the lead car never made
    any lane change, and it was instead the Tesla that essentially did so, and therefore
    it no longer detected the lead car that was in the prior HOV lane that the Tesla
    had been presumably squarely in.


    It could be that the Tesla was shifting to the left and ended up not yet being
    fully in the exit ramp lane, and nor any longer fully in the ongoing HOV lane.
    It was in-between. Suppose it had not yet fully ended up in the exit ramp to the
    left, and then struck the attenuator at the left side of the front of the Tesla.
    This fits with the aspect earlier that the Tesla then did a counterclockwise spin
    (I told you that I’d bring this back into the analysis).


    Have you ever been in your car on a highway and couldn’t decide whether to take
    an exit or continue forward, and you began to straddle both options, which ultimately
    would mean that you’d ram into whatever was sitting between the two options? I’m
    guessing you’ve done this before. And, sweated like mad afterwards that you cut
    things so close as to making the decision of which path to take.


    In this case, one scenario is that the Tesla was following a lead car, and for
    which this seemed perfectly normal and common, and then with just a few seconds
    before impact with the attenuator, and for reasons yet unknown, the Tesla began
    to shift to the left, as though it was going to get out of the existing HOV lane
    and into the exit ramp lane but did so without sufficient urgency.


    Did the Autopilot intend to actively switch lanes?


    Or, did it somehow lose itself in terms of the markings on the roadway and it
    was unsure of where the lane really was?


    Why didn’t the human driver take over the controls and do something? One explanation
    is that with only about 3 seconds left to go, which is the point at which the
    Tesla was apparently no longer following the lead car, the human driver might
    not have had sufficient time to realize what was happening. Up until then, perhaps
    the human driver was watching the car ahead and assumed that as long as the car
