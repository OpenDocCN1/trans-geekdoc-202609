    the pool of potential reverse engineers, but doesn''t drop it to zero by any means.


    That being said, it is important to emphasize that the auto makers and tech firms
    need to make sure they are sufficiently protecting their AI self-driving car systems
    from these kinds of reverse engineering efforts. Besides protecting the Intellectual
    Property (IP), it also needs to be done to try and prevent hackers from doing
    nefarious things. Having hackers that can break into and figure out how the AI
