    AI 自动驾驶汽车是非常糟糕的事情而言，还远远不够。


    你可能会想知道这种对汽车的逆向工程是否合法。你真的可以拆解竞争对手的汽车吗？一般来说，是的，一旦你买了这辆车，没有什么法律阻止你将其物理拆解本身。如果你试图复制他们的汽车零件或汽车设计，那么你可能发现自己违反了他们的知识产权。如果你只是在研究它，那是很难禁止的。


    在软件逆向工程方面，这确实往往触犯法律。你可能知道或记得 1998 年由美国国会通过的《数字千年版权法》（DMCA）。DMCA 基本上是娱乐业推动的一项举措，他们担心保护对其版权作品未经授权的复制和传播。公司设置了技术保护机制（TPM）以防止黑客或其他人进行逆向工程。规避
    TPM 被视为一种形式的逆向工程。这通常被认为在整个美国是非法的，并且世界其他地区的大部分地区也认为这是非法的。


    有狭窄的例外情况，适用于执法目的、国家安全目的以及选择性计算机安全研究目的，但除此之外，为了逆向工程软件而规避 TPM 是违法的。一直有尝试提出论点，认为绕过某些类型系统的
    TPM 应当被允许，为了社会的利益。假设一辆 AI 自动驾驶汽车有一些隐藏的 bug、漏洞或其他故障——你是否以及社会是否会从允许“专家”深入软件并弄清楚其工作原理并识别出那些可能致人死亡的问题中受益？


    如果你正在考虑拆解你自己的一辆 AI 自动驾驶汽车，我建议不要这样做。你很可能最终得到成千上万的零件，并且不知道它们的作用以及为什么在那里。另外，如果你认为你可以像
    Humpty Dumpty 那样重新组装起来，我可以向你保证，重新组装一辆被拆解的汽车的可能性极有可能是徒劳的。这不仅仅是一个你需要将位置移回适当位置的魔方。无论如何，我们肯定已经看到了一些对
    AI 自动驾驶汽车的逆向工程，随着自动驾驶汽车变得更加普遍，这将持续并势头增强。

