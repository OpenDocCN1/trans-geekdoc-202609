    # CHAPTER 5

    NTSB REPORT AND

    TESLA CAR CRASH


    Based on the June 7, 2018 release of the preliminary NTSB report about the fatal
    car crash of a Tesla on March 23, 2018, I provide in today’s column an initial
    forensic analysis of the incident.


    Keep in mind that the just released NTSB report (about three days ago as of the
    writing of this) is very slim on details at this juncture of the investigation
    and so there really isn’t much in terms of facts and evidence that would allow
    for a thorough analysis. Nonetheless, it is instructive to be able to try and
    piece together the clues released to-date and see if useful insights can be gleaned.


    Faithful readers of my online columns will recall that I had done a similar forensic
    analysis of the Uber self-driving car incident that occurred in Arizona, and that
    later on, upon release of the initial report by the NTSB, it turns out that my
    predictions of what likely occurred were quite prescient. Indeed, there didn’t
    seem to be any other published news item about the incident at the time that had
    so aptly predicted what might have taken place.


    # Learning From the “Past”


    At the Cybernetic AI Self-Driving Car Institute, we are developing AI systems
    for self-driving cars. As a result, we are keenly interested in what happens in
    incidents involving self-driving cars, along with'
  - '[PAGE 91]


    wanting to provide insights for auto makers and other tech firms that are in the
    midst of developing and maintaining such AI systems.


    As per the famous quote of philosopher George Santayana: “Those who cannot remember
    the past are condemned to repeat it.” With the rapid advances taking place with
    AI self-driving cars, and with the use of our public roadways as part of a grand
    experiment to see whether self-driving cars are viable, it is especially crucial
    that we all look at every morsel of what is taking place and try to as rapidly
    as possible consider what action is most appropriate to ensure the safety of us
    all. Our collective desire as a society to have AI self-driving cars needs to
    be balanced by our collective desire to be reasonably safe on our public roadways
    too.


    For some of you, you might say that the risks of any self-driving car endangerment
    are simply the presumed calculated risk of the person that has opted to drive
    such a car. This thought is narrow thinking and does not include the proper larger
    scope. The human driver is certainly taking a risk, but so too would any occupants
    in the car that are accompanying the car with the human driver – suppose the driver
    has children in the car, are those children able to also calculate the risks involved?
    The self-driving car could ram into and injure or kill humans that are in other
    nearby cars – did they get a chance to assess and take on the risks of that self-driving
    car? Pedestrians could be injured or killed – did they have a say in accepting
    the risks of the self-driving car?


    I mention this because at some of my presentations around the country there are
    at times self-driving car pundits that stand-up and say that it should be each
    person’s own choice as to whether or not they want to drive a self-driving car,
    and that the government and anyone else should stay out of it. If the driver of
    a self-driving car was able to drive the car in a manner that was completely isolated
    from all of the rest of us, I likely would agree that it could be an informed
    personal decision to make.


    We must though keep in mind that driving on our public roadways is a societal
    interaction and therefore would seemingly be a societal decision. It is for this
    reason that driving by humans is deemed a'
  - '[PAGE 92]


    “privilege” and not a “right” per se. The Department of Motor Vehicles (DMV) in
    most states lays out what a human driver must do and not do, in order to retain
    the privilege to drive a car on our public roadways. There isn’t an irrevocable
    right to drive on our public roadways. It’s a revocable privilege.


    # ### Context of the Tesla Incident


    Here’s some key aspects about the Tesla incident, based on using the NTSB preliminary
    report, which noted this:


    +   * Accident Location: Mountain View , CA

    * Accident Date: 4/23/2018

    * Accident ID: HWY18FH011

    * Date Adopted: 6/7/2018

    * NTSB Number: HWY18FH011 Preliminary


    On a relatively sunny and dry day in California on Friday, March 23, 2018, in
    the morning around 9:30 a.m. PDT a Tesla Model X P100D 2017 was being driven southbound
    on the multi-lane US Highway 101 (US-101) in Mountain View and was nearing the
    interchange with the State Highway 85 (SH-85). This is a typical California type
    of interchange that involves various paths to get onto each of the two intersecting
    major highways. Drivers can choose to go from the US-101 onto the SH-85, and drivers
    that are on the SH-85 can choose to go onto the US-101. Both of these highways
    are very commonly driven and typically popular with traffic, especially on a Friday
    morning.


    Notice that I’ve mentioned some important aspects already. Was the incident occurring
    on a rainy day? No. It was sunny and the roads were dry. This is important because
    we might otherwise need to consider the weather as a factor in what occurred.
    I think it is relatively sound to assume that weather was not a factor since the
    roads were dry and it was sunny. Was it nighttime or daytime when the incident
    occurred? It was daytime, and nearing mid-morning, and so it would have been relatively
    well lit.'
