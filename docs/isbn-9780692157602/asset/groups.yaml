  - '[PAGE 66]


    four minutes long and did an inch at a time to get into another lane. It was agonizingly
    slow. Dangerously slow. In contrast, we had one student driver that made a lane
    change the instant the instructor said to do so, and at times we nearly got into
    a car crash because of the rapid movement (it was as though the car dove into
    the other lane). The moment the instructor started to utter the words "start to
    think about a lane change," the student took this to mean "get over into the next
    lane, darn it, as fast as possible, and don''t delay since we''ll all die if you
    do." We all held are breaths every time that student got behind the wheel.


    Of course, changing lanes is a dangerous act. Think about what can go wrong. You
    can start the lane change, and perhaps not realize there is a car directly abreast
    of you, and then hit that car. Or, maybe that car realizes you are mistakenly
    getting into their lane and so they hit you, or they veer and hit another car
    as "caused" by your having started your lane change. Let''s assume you are good
    enough that you don''t start the lane change when there''s a car next to you,
    but once you engage in the move a car "suddenly" appears in that lane. Once again,
    the chances of getting hit, or hitting the other car, or starting a cascading
    accident that will possibly injure or even kill other people is all heightened.


    There are some key factors involved in the lane change act. One of those factors
    is speed. Making lane changes at a low speed is more likely to have less adverse
    consequences. If you hit another car and you are both going 5 miles per hour,
    it''s not a good thing, but hitting another car while going 70 miles per hour
    is certainly apt to have more dire consequences. The faster speeds tend to mean
    less reaction time, and so less chance of avoiding a collision. The faster speeds
    tend to mean greater damage to the cars and greater chances of injury to the human
    occupants. Faster speeds tend to mean that the incident will turn into a domino
    and lead to a multitude of crashes.


    Believe it or not, I know one driver that genuinely believes that higher speeds
    are better (safer) for making lane changes. His logic is that the length of time
    involved in actually undertaking the lane change is reduced. At 70 miles per hour,
    he says it is a blink of the eye when you make a lane change. It''s like being
    the Flash and it happens so'
  - '[PAGE 67]


    quickly that essentially nothing can go wrong. At slower speeds, he believes it
    is worse since you take too long to make a lane change. This longer time frame
    increases the opportunity for a car collision. All I can say is, wow, what a way
    of thinking. I’m just glad that he and I are rarely on the roadways at the same
    time.


    This does bring up the useful facet that we have both your speed as a factor and
    also time as a factor. You need to know what your speed is, assuming you want
    to make a reasonably well executed lane change. You need to know how much time
    it will take to make your lane change. You need to estimate how much time there
    will be for a gap to exist in the other lane, such that you can get into that
    gap. You need to calculate whether you need to speed-up or slow down to make it
    into that gap. The gap is both a physical gap in terms of physical space where
    your car can fit and that no other car occupies, and it is a time gap in that
    it needs to happen at a point in time during which there isn’t another car there.


    It’s physics!


    You might be tempted to think that changing lanes is merely a series of algorithmic
    like calculations that we humans are making. I would suggest that’s over simplifying
    the beauty, art, and craft of lane changing.


    You need to be part psychologist too. Will that other driver in the lane next
    to me be willing to let me in? There’s a momentary gap in space and time right
    now, but in the next few seconds it could disappear. The other car might suddenly
    accelerate and end-up in the spot that I think I want to occupy. Your lane change
    is actually a forecast about the future. You are trying to predict what the roadway
    situation will be in a few seconds from now. This involves making educated guesses.
    You can’t usually know for a certainty what the future is going to hold.


    Yes, there are situations involving easy lane change actions. If I’m on the open
    highway, and there’s not any cars around me for miles, I can change lanes to my
    heart’s content. When I was first learning to drive, me and one of my best buddies
    would sometimes take long'
  - '[PAGE 68]


    drives just to get better at driving, and we''d do a series of lane changes over
    and over. We''d be on the open highway, and make a lane change. No reason to do
    so per se. Then make another lane change, and another, and so on. It was for the
    sake of practice. Anyone watching the car would have thought we were drunk or
    crazy, since there didn''t seem to be any rhyme or reason for the multitude of
    lane changes.


    For ease of discussing lane changes, let''s refer to the driver that is initiating
    the lane change as the *activator*. The car that is in the other lane that might
    be impacted by the activator will be referred to as the *responder*. I''ll take
    the core elements first, namely assume we have one activator and one responder.
    That being said, this can readily become more complex by adding multiple responders.
    Or, we could have multiple activators (several cars all wanting to make lane changes
    at the same time and place). The most reduced and simplest instance would be one
    activator and zero responders (that''s akin to my example above about me and my
    buddy making lane changes when no other cars were anywhere near us).


    Consider first the speeds involved.


    I''ll use this notation: **Activator: Responder**.


    We''ll also keep things simple by pretending that the speeds are either high or
    low.


    We then have this:


    +   - High: High

    - Low: Low

    - High: Low

