    Per the NTSB report for the Mountain View incident, the report says that the Tesla
    struck the attenuator while going 71 miles per hour, and then the impact “rotated
    the Tesla counterclockwise” and ultimately “caused a separation of the front portion
    of the vehicle.” I think we can all agree that hitting something like the attenuator
    at a speed of 71 miles per hour is going to exert a tremendous amount of force,
    and it certainly seems to have been the case since it caused the front of the
    Tesla to become separated. It was a hard hit. I don''t think anyone can dispute
    that.


    What’s interesting is the notion that the Tesla spun counterclockwise. I''ve not
    yet seen anyone comment about this aspect. I''ll speculate about it. If the Tesla
    had hit the attenuator fully head-on, we would need to study the physics of the
    result, but it generally might not have led to a spin of the Tesla. More than
    likely, the Tesla probably hit at a front edge of the car, such as toward the
    left side of the front edge or to the right of the front edge. This would be more
    likely to generate a spinning action after the impact. Since the Tesla apparently
    spun counterclockwise, we''ll assume for the moment that it hit at the left side
    edge of the front of the Tesla, which then jammed the left side against the attenuator,
    and the right side of the Tesla continued forward, causing it to pivot from the
    left side, making it go counterclockwise. This is all speculation, and we''ll
    need to see what the NTSB has to say about it.


    I''ll explain in a moment why I think this counterclockwise spinning is a useful
    clue.


    ### Aftermath of the Crash


    After having crashed and spun, the Tesla was involved in subsequent collisions
    involving two other cars that were presumably driving southbound and got inadvertently
    caught up in the incident. I''ll assume for now that those additional crashes
    had nothing to do with the initial crash per se, and were just part of the aftermath.


    I am saddened that those subsequent crashes occurred, and it also serves as a
    reminder of my earlier remarks that incidents involving self-driving cars aren''t
    necessarily confined to impacting just the driver but can also include other innocents
    that get caught up in the cascading impacts. According to the NTSB report, one
    of those other drivers suffered minor injuries, and the other was uninjured. I''d
    say that''s nearly a miracle. No matter what led to the initial crash, any aftermath
    can often be horrific.


    The NTSB report further mentions that the 400-volt lithium-ion high-voltage battery
    in the Tesla caught fire as it was breached during the incident, and a post-crash
    fire ensued (these can be intense fires; the fire department arrived and was able
    to put out the fire). It is uplifting to note that the NTSB report essentially
    suggests that bystanders got out of their cars and came to the rescue of the driver
    in the Tesla, bravely removing him from the vehicle, in spite of the dangers of
    the fire. The NTSB report indicates that the Tesla driver was transported to a
    hospital but died there from his injuries. In any case, I applaud those brave
    souls that rescued him from the crash.


    ### Layout of the Crash Scene


    The NTSB preliminary report does not depict a layout of the crash scene. I''ve
    used Google Maps to try and see if I can figure out what the crash scene was like.
    This is admittedly speculation. The final NTSB report should officially describe
    the crash scene and will usually be based on photos taken at the time and physical
    evidence at the crash scene, as per the investigative team that inspected the
    location.


    Based on what I can discern, it appears that the crash occurred at the split of
    US-101 continuing forward and an exit ramp to get onto SH-85 as a left-side offshoot.
    There appears to be a triangular shaped “gore area” that divides the two. I’m
    sure you’ve seen this kind of thing before. You have two lanes that are running
    next to each other, and at some point up ahead they split from each other. At
    that splitting or fork, one lane goes straight ahead, while the other veers off.
    In-between the split is a triangular area that divides the two splitting lanes.
    In this case, there was a concrete median in that gore area, and it had the attenuator
    at the front edge of the concrete median.


    It appears that there were, for a while, two HOV lanes leading up to the split.
    One HOV lane was for those continuing on US-101, and the other was for those cars
    wanting to veer off to the left as part of the exit from US-101 leading to SH-85.
    I don’t know that this is exactly where the incident occurred. As I say, I’ve
    just looked at Google Maps and tried to guess based on what the NTSB slim details
    so far suggest.


    See Figure 1.


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_100_0.png)


    ### Timing of the Crash


    The vital aspects about the crash are contained in the timing aspects reported
    so far by the NTSB.


    According to the NTSB, at 18 minutes and 55 seconds before the crash, the Autopilot
    was engaged. It apparently remained engaged the entire time thereafter. This is
    important because if the Autopilot was not engaged, then we likely wouldn''t be
    discussing any of this; it would generally have been a traditional crash since
    the Tesla would have been operating like any everyday car. Also, if the Autopilot
    had suddenly been engaged just seconds before the crash, we might be of a mind
    to say that the Autopilot had insufficient time to get started and so it was not
    especially a participant in the crash. In this case, it seems like the Autopilot
    had been on, it had been on for quite some time before the crash, and it was still
    on at the time of the crash.


    Take a look at Figure 2.


    ![](img/6057ab6cd8e6bf12386fe992fd0d3dec_102_0.png)


    **8 Seconds Prior To The Crash**


    | Seconds Prior To Crash | t-8 | t-7 | t-6 | t-5 | t-4 | t-3 | t-2 | t-1 | t |
    t+1 | t+2 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
    :--- |

    | **Autopilot status** | Autopilot engaged | Nudge engaged | Nudge engaged | Nudge
    engaged | Nudge engaged | Nudge engaged | Nudge engaged | Nudge engaged | Nudge
    engaged | Nudge engaged | Autopilot engaged |

    | **Lead Car (if Detection)** | Following lead car | Following lead car | Lead
    car | Lateral | Lateral | Lateral | Follow | Lateral | None | Detect car | None
    |

    | **Steering** | Follow | Follow | Follow | Follow | Follow | Follow | Follow
    | Lateral | Follow | Left steer | Left steer |

    | **Speed** | 75kph | 75kph | 75kph | 75kph | 75kph | 75kph | 75kph | 75kph |
    75kph | 75kph | 75kph |

    | **Hands on Steering** | | | | | No hands on steering | No hands on steering
    | No hands on steering | No hands on steering | No hands on steering | No hands
    on steering | No hands on steering |

    | **Braking** | No braking | No braking | No braking | No braking | No braking
    | No braking | No braking | No braking | No braking | No braking | No braking
    |

    | **Evasive Action** | No evasive action | No evasive action | No evasive action
    | No evasive action | No evasive action | No evasive action | No evasive action
    | No evasive action | No evasive action | No evasive action | No evasive action
    |


    The Tesla was reportedly following a lead car, doing so at 8 seconds before the
    crash (and might have been doing so even longer, but we don’t yet know), and at
    4 seconds before the crash it was no longer following a lead car. For those of
    you not familiar with self-driving cars, they often use a pied piper approach
    to driving. They spot a car ahead, and then try to match the pace of that car.
    If the car ahead speeds up, the self-driving car will speed up, but only to some
    maximum such as the speed limit or perhaps what has been set on the cruise control
    via the human driver in the self-driving car. If the car ahead slows down, the
    self-driving car tends to slow down.


    As I’ve said many times before, this pied piper approach is extremely simplistic.
    It’s what a teenage novice driver does when they are first learning to drive,
    but they quickly realize there are many downsides to this approach. If the approach
    is not augmented by more sophisticated driving techniques, it’s something that
    has only limited utility. By the way, keep in mind that the Tesla models of today
    are considered at a Level 2 or Level 3, but are not yet at a true Level 5, which
    is a self-driving car for which the AI can entirely drive the car without any
    human intervention. At the levels less than 5, the human driver is considered
    the driver of the car, in spite of whatever else the “self-driving car” can do
    or is suggested or implied that it can do.


    Once the lead car was no longer ahead of the Tesla, the Tesla then reportedly
    increased speed, since it was going at 62 miles per hour while following the lead
    car, and then with a presumed clear space ahead it opted to increase speed to
    71 miles per hour at the time of the crash. This “makes sense” in that the system
    will aim to go to the maximum allowed speed if it believes that there is no car
    ahead of it that would impede doing so. The NTSB says that the driver had set
    the cruise control to a maximum of 75 miles per hour, and so the Tesla was likely
    trying to accelerate to that stated speed. As a side note, the NTSB points out
    that the speed limit in that location is only 65 miles per hour.


    What’s especially intriguing in the NTSB preliminary report is that supposedly
    the Tesla was left steering, doing so at 7 seconds before the crash. The implication
    is that this continued until the actual crash.

