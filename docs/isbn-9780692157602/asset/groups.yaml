    使用金丝雀作为探测器。就飞行（此处指呼吸作用）而言，金丝雀拥有额外的气囊，能够在吸气和呼气时都吸入空气。这种大量的空气采样以及在有毒气体存在时金丝雀健康状况可能迅速恶化的特性，使这些鸟几乎成为执行这项任务的理想选择。它们重量轻，体积相对较小，很容易携带进入矿井。它们不需要太多照料，成本相对低廉，并且在矿井的半黑暗中也能被清晰地看到。你几乎一眼就能看出金丝雀是死是活。


    如今，我们常常使用“笼中金丝雀”这一比喻，来暗示在任何我们可能处于潜在危险情况时，拥有预警机制至关重要。这并不意味着你字面上必须使用金丝雀，而是暗示应该部署某种机制充当探测器。探测器有望防止灾难发生，或者至少在某件不利之事即将发生时发出预警。


    在计算机领域，你可能已经听说过所谓的金丝雀分析（canary analysis）。这是一种用于降低将某事物从测试环境转移到实时生产环境时相关风险的技术。我们都有过更新代码并将其推送到生产环境，结果发现哎呀，存在测试期间未捕获的
    bug，或者新代码给生产环境引入了其他冲突或问题的经历。从理论上讲，测试本应事先捕获这些 bug，并确定新代码是否与生产环境兼容。但世界并不完美，因此，尽管可能进行了非常详尽的测试和准备，更新一旦投入使用，仍然可能出现问题的可能性依然存在。


    金丝雀分析的标准做法是选择将部分生产用户（例如说 1% 的用户）隔离出来，让他们接收经过变更的生产系统，这构成了金丝雀部分，同时保留一个具有相同配置的基线，而现有的生产实例则保持原样。然后，你将新基线与金丝雀进行比较，收集并对比各种性能指标。如果金丝雀看起来一切正常，你就可以继续进行完整的生产环境部署。这有点像经典的
    A/B 测试。


    我意识到你可能会争论这是否真正类似于“煤矿中的金丝雀”这一概念。在这里，这只金丝雀本身并不会真正“死亡”。在这种情况下，金丝雀预计会在对比性能基准时揭示问题或其他方面。我知道你可能会抱怨金丝雀的比喻仅松散适用，但嘿，它是该事项的生动意象，借用金丝雀故事作为任何早期检测机制的底层概念也挺方便的。


    计算机领域存在各种自动化的金丝雀分析系统。其中最著名且普及的也许是谷歌和 Netflix 推出的 Kayenta 项目。Kayenta 是一个开源的自动化金丝雀分析系统。其概念在于能够以被认为“高速度”的方式发布软件变更——这意味着当你希望相对连续地将内容推送到生产环境时。这是敏捷的系统开发方式。


    在过去，我们会将大量变更捆绑在一起，尝试采用“大爆炸”（big-bang）方式一次性部署到生产环境。如今，更多的是即时进行，并尽快将新变更投入生产。然而，这也引入了大量不良代码进入生产环境的潜在风险，鉴于测试和发布的压力，以及不确定它将如何与生产系统中的众多其他元素实际相互作用。当我说“不良代码”时，并不一定意味着代码本身有
    bug 或问题，而是代码可能引入了与生产系统其他现有方面的新冲突。因此，使用自动化的金丝雀分析来尝试检测和防止非预期的问题在生产环境中浮现，其价值就在于此。


    这场关于金丝雀的讨论与 AI 自动驾驶汽车有什么关系？


    在控制论 AI 自动驾驶汽车研究所（Cybernetic AI Self-Driving Car Institute），我们利用金丝雀的概念，但对其在技术和
    AI 中的应用采用了略微不同的角度。


    AI 自动驾驶汽车正变得越来越复杂的机械装置。车辆上运行着一系列处理器和大量的 AI 软件。对于 5 级（Level 5）自动驾驶汽车，这是指自动驾驶汽车应能够自行驾驶且不需要任何人类干预的级别，人类乘客完全依赖
    AI 来驾驶汽车。对于低于 5 级的级别，尽管需要人类驾驶员，并且人类驾驶员据称对自动驾驶汽车的行为负责，但人类驾驶员仍然相当依赖 AI。如果 AI 出现故障，它可能在最糟糕的时刻将车辆控制权移交给人类，而人类驾驶员可能无法及时采取纠正措施。


    每次你乘坐自动驾驶汽车时，都需要问自己一个问题——你信任那辆自动驾驶汽车的 AI 吗？


    目前，大多数民意调查显示，人们已经对 AI 自动驾驶汽车的可靠性持怀疑态度。一旦自动驾驶汽车普及，人们将每天把自己的生命交给车上板载的 AI。你可能会假设
    AI 通常能够驾驶自动驾驶汽车，但那些罕见的情况呢？比如在山路上，夜晚，路面因雨而湿滑，一只鹿突然出现在自动驾驶汽车面前？AI 能处理驾驶的一般方面，并不一定保证它能处理更冷僻的使用场景。


    许多为自动驾驶汽车开发的现有 AI 系统倾向于专注于在问题出现时捕获它们。这很重要，但它也可能使自动驾驶汽车陷入危险或不幸的境地。你最好尝试提前发现是否有异常或可能出现异常的情况。


    对于飞机来说，进行飞行前检查（preflight check）是标准做法。在飞行前检查期间，会对飞机外部进行检查，以确保其看起来适航。还会进行内部检查。控制装置会被检查。机翼会被检查。等等。如果飞机一直在运营，且仅仅是准备继续其已开始的旅程，这种检查有时会以某种粗略的方式进行。在其他情况下，飞行前检查非常深入。这可能是由于飞机最近未在使用，或者是由于飞机飞行时间较长，需要定期查找更细微的裂纹和磨损线索。航空公司将各种级别的检查分为从
    A 级到 D 级。


    我们的方法是进行我们认为的自动化“金丝雀”预检查，针对 AI 自动驾驶汽车。这是一个额外的系统层，试图分析和演练 AI 自动驾驶汽车，以确保其尽可能准备好使用。类似于航空公司的飞行前检查，金丝雀可以进行全长且深入的分析和较浅的部分分析。更完整的版本需要更长的时间。想要使用自动驾驶汽车的人类所有者可以选择进行何种程度的预检查。我们将这个增加的功能称为
    PFCC（Pre-Flight Canary Check，飞行前金丝雀检查）。


    这本质上是一种自我诊断，试图验证和核实 AI 系统和自动驾驶汽车看起来是否已准备好出行。我说“看起来”，因为预检查只能做到这么多。类似于飞机，无论进行何种预检查或飞行前检查，一旦开始行进，仍有可能会出现干扰旅程的事情。有些方面可能通过预检查发现，而另一些方面可能在旅程的后期出现，任何预检查都无法检测到。


    让我们考虑 AI 自动驾驶汽车行动的主要阶段，以及预检查是如何进行的。这些核心阶段包括：


    - 传感器数据收集与分析

    - 传感器融合

    - 虚拟世界模型更新

    - AI 行动计划更新

    - 汽车控制指令发布


    首先，PFCC 尝试测试每个感官设备，检测它们是否处于正常工作状态。一些感官设备有内置的自我检查功能，PFCC 会调用这些功能，然后确定结果。其他感官设备可能没有任何现成的设施，因此
    PFCC 需要具备专门的

