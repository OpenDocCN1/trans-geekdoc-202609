    the auto makers and tech firms are protecting their software as though it is gold
    that belongs in Fort Knox. Who can blame them? The arms race is on. Everyone is
    trying to figure out how to make the AI be as truly AI as possible.


    The AI software is going to ultimately be what makes or breaks a true AI self-driving
