    DuWayne Peterson, Mike Brown, Jim Thornton, Abhi Beniwal, Al Biland, John Nomura,
    Eliot Weinman, John Desmond, and many others for their unwavering support during
    my career.


    And most of all thanks as always to Lauren and Michael, for their ongoing support
    and for having seen me writing and heard much of this material during the many
    months involved in writing it. To their patience and willingness to listen.


    ### INTRODUCTION


    This is a book that provides the newest innovations and the latest Artificial
    Intelligence (AI) advances about the emerging nature of AI-based autonomous self-driving
    driverless cars. Via recent advances in Artificial Intelligence (AI) and Machine
    Learning (ML), we are nearing the day when vehicles can control themselves and
    will not require and nor rely upon human intervention to perform their driving
    tasks (or, that *allow* for human intervention, but only *require* human intervention
    in very limited ways).


    Similar to my other related books, which I describe in a moment and list the chapters
    in the Appendix A of this book, I am particularly focused on those advances that
    pertain to self-driving cars. The phrase "autonomous vehicles" is often used to
    refer to any kind of vehicle, whether it is ground-based or in the air or sea,
    and whether it is a cargo hauling trailer truck or a conventional passenger car.
    Though the aspects described in this book are certainly applicable to all kinds
    of autonomous vehicles, I am focused more so here on cars.


    Indeed, I am especially known for my role in aiding the advancement of self-driving
    cars, serving currently as the Executive Director of the Cybernetic Self-Driving
    Cars Institute. In addition to writing software, designing and developing systems
    and software for self-driving cars, I also speak and write quite a bit about the
    topic. This book is a collection of some of my more advanced essays. For those
    of you that might have seen my essays posted elsewhere, I have updated them and
    integrated them into this book as one handy cohesive package.


    You might be interested in companion books that I have written that provide additional
    key innovations and fundamentals about self-driving cars. Those books are entitled
    "*Introduction to Driverless Self-Driving Cars,*" "*Advances in AI and Autonomous
    Vehicles: Cybernetic Self-Driving Cars,*" "*Self-Driving Cars: "The Mother of
    All AI Projects,"* "*Innovation and Thought Leadership on Self-Driving Driverless
    Cars,*" "*New Advances in AI Autonomous Driverless Self-Driving Cars,*" and "*Autonomous
    Vehicle Driverless Self-Driving Cars and Artificial Intelligence*" and "*Transformative
    Artificial Intelligence Driverless Self-Driving Cars,*" and "*Disruptive Artificial
    Intelligence and Driverless Self-Driving Cars*" and "*State-of-the-Art AI Driverless
    Self-Driving Cars*" (they are all available via Amazon). See Appendix A of this
    herein book to see a listing of the chapters covered in those three books.


    For the introduction here to this book, I am going to borrow my introduction from
    those companion books, since it does a good job of laying out the landscape of
    self-driving cars and my overall viewpoints on the topic. The remainder of the
    book is all new material that does not appear in the companion books.


    #### INTRODUCTION TO SELF-DRIVING CARS


    This is a book about self-driving cars. Someday in the future, we''ll all have
    self-driving cars and this book will perhaps seem antiquated, but right now, we
    are at the forefront of the self-driving car wave. Daily news bombards us with
    flashes of new announcements by one car maker or another and leaves the impression
    that within the next few weeks or maybe months that the self-driving car will
    be here. A casual non-technical reader would assume from these news flashes that
    in fact we must be on the cusp of a true self-driving car.


    Here''s a real news flash: We are still quite a distance from having a true self-driving
    car. It is years to go before we get there.


    Why is that? Because a true self-driving car is akin to a moonshot. In the same
    manner that getting us to the moon was an incredible feat, likewise can it be
    said for achieving a true self-driving car. Anybody that suggests or even rashly
    states that the true self-driving car is nearly here should be viewed with great
    skepticism. Indeed, you''ll see that I often tend to use the word “hogwash” or
    “crock” when I assess much of the decidedly fake news about self-driving cars.
    Those of us on the inside know that what is often reported to the outside is malarkey.
    Few of the insiders are willing to say so. I have no such hesitation.


    Indeed, I''ve been writing a popular blog post about self-driving cars and hitting
    hard on those that try to wave their hands and pretend that we are on the imminent
    verge of true self-driving cars. For many years, I''ve been known as the AI Insider.
    Besides writing about AI, I also develop AI software. I do what I describe. It
    also gives me insights into what others that are doing AI are really doing versus
    what it is said they are doing.


    Many faithful readers had asked me to pull together my insightful short essays
    and put them into another book, which you are now holding in your hands.

