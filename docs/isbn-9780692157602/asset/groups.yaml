    # CHAPTER 9


    # NIGHTTIME DRIVING

    AND SELF-DRIVING CARS


    Are you a nighttime driver? Some people like to drive at night and enjoy pretending
    they are in their Batmobile and seeking to fight crime. There are some people
    that reluctantly drive at night -- they drive at night because they need to get
    home from work or carry out other errands, but otherwise believe that nighttime
    driving has inherent hazards. There are those that entirely avoid driving at night
    because they either have difficulty driving at night, or they know that the stats
    about night driving are scary, or because they believe that vampires come out
    at night.


    Speaking of stats, according to various governmental reports, it is said that
    there is about 60% less traffic at night but 40% of all fatal car accidents happen
    at nighttime, furthermore the fatality rate for car occupants is about three times
    higher at night then during daytime, and the fatal crash rate for 16-year-old
    drivers is twice what it is at night versus during the day (a good reason to keep
    your teenager from driving at night!).


    What makes nighttime driving so terrible?


    One aspect is the impact on visibility. Human drivers depend almost entirely on
    their vision to undertake the driving task. Without sufficient lighting being
    available, vision can be impaired. I’m sure you’ve driven on country roads that
    had no street lighting, and likely suddenly realized how much light is added to
    the streets when there are street lamps available. Even when there are street
    lights, the type'
  - '[PAGE 149]


    of lighting varies, the number of street lights in a given stretch of road varies,
    and there can be roadway obstructions that block the lighting too. You''ve got
    shadows, you''ve got patches of area that have no direct street lighting, you''ve
    got sometimes other bright lights from billboards that maybe add light but can
    create dancing light and alter colors of lighting, and so on.


    I suppose if it was only the lighting that made a difference, perhaps we could
    all accommodate it as a nighttime issue. But, as you know, there is also driver
    behavior that comes to play. Drunk driving is much more likely at nighttime than
    daytime. This means that a driver is likely not able to properly navigate the
    roads and can either get into an accident or cause someone else to get into an
    accident. There are also drowsy drivers at nighttime. These drivers are maybe
    worn out from a long day''s work, or maybe they need to get up at 3 a.m. to drive
    to work in the early morning darkness. Being drowsy causes them to be less aware
    of the traffic, more likely to swerve or take adverse actions, and be more prone
    to either getting into an accident or causing one.


    I''ll punch things up with even more factors about nighttime driving. Since there
    tends to be less overall traffic at night, it also tends to allow drivers to go
    faster and perhaps cut corners more so. In addition, I know some drivers that
    believe they are less likely to get a traffic ticket at nighttime, apparently
    they believe they are less likely to be caught under the cloak of darkness, so
    they tell me that they aren''t as worried about being full legal in their driving
