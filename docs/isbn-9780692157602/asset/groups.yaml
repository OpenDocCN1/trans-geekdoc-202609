    The coal miner looked furtively at the cage holding a canary. There was a chance
    that in this new part of the mine, there could be seeping carbon monoxide gas.
    Carbon monoxide is colorless and odorless, and other miners had died by being
    caught unawares that they were breathing it in. By having the canary, it was hoped
    that the canary would signal first that there was poisonous gas, and possibly
    (sadly) even die, but at least the workers in the mine would be able to scuttle
    out and stay alive and the canary would have saved human lives.


    You probably are aware that canaries have been used in mines, as depicted on TV
    shows and movies that showcase mining as it used to be. Starting around 1911,
    it was John Scott Haldane, considered the father of oxygen therapy, whom proposed
    that canaries be used as an early detector of poisonous gases for miners. Miners
    would often enjoy the sounds of the canary whistling and otherwise be comforted
    knowing that the canary was there to help the miners to stay alive. Around the
    1980''s and 1990''s, canaries were gradually no longer used and instead automated
    methods of gas detection were incorporated into mining.


    If you are wondering why use canaries rather than say mice, it was Haldane''s
