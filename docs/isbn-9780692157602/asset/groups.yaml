    radar, but there really are issues. This is bad. Of course, as stated earlier,
    the canary cannot guarantee that it will find all anomalies. In any case, during
    a journey, the AI system is intended to be keeping a log of anomalies discovered
    during the journey, and this is later on used by the PFCC to try and determine
    whether there were any issues that arose during the journey that might have been
