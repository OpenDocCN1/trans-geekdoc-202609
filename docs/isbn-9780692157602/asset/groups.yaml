    about the issues associated with nighttime driving.


    If the AI of the self-driving car has difficulties driving the car, and it occurs
    at nighttime, there is a danger that if the AI suddenly hands control back to
    the human driver that''s in the car, the human driver might be caught unawares.
    And, the human driver might have limited visibility due to the darkness, and therefore
    be impeded in terms of taking corrective action or even being aware of what has
    caused the AI to toss the football to the human driver. It could be that the nighttime
    has caused the AI system to become perplexed and so it has handed control back
    to the human driver, or it could be something not having to do at all with it
    being nighttime, but for which the human driver is now having to contend with
    the matter and simultaneously deal with the nighttime aspects too.


    For a Level 5 self-driving car, in theory it is assumed that the AI will be able
    to handle the nighttime aspects of driving. Let''s explore ways in which the AI
    can be impacted by the nighttime driving task, and also how the AI should be enhanced
    or made to handle the nighttime requirements.


    First, perhaps the most obvious aspect is the detriment to visibility. The cameras
    on the self-driving car will likely not be able to catch as sharp of images and
    the video will also be less illuminated than were it daytime. The headlights of
    the self-driving car become particularly vital. If the headlights are in poor
    shape or occluded due to dust or dirt, it could have an even worsened impact on
    the image processing. The cameras at the rear of the self-driving car are without
    any direct lighting such as headlights, and so those are obviously severely degraded
    in terms of the images captured.


    The AI self-driving car should be checking to make sure that the headlights seem
    to be working sufficiently to capture apt images, as best possible, which can
    be tested beforehand in terms of doing testing at the start of a journey. The
    AI can then alert someone, such as a human occupant, and might allow the human
    occupant to possibly clean-off the headlights or maybe even decide not to start
    the journey. As a side note, years ago I went to rent a car, drove the rental
    car off the lot during daytime, and then when it reached nighttime I turned on
    the headlights – found out to my shock and surprise that the headlamps were burnt
    out. If I had checked during the daytime, I likely would have switched to another
    car, or only used the car during daylight, or taken some other action. Keep this
    in mind the next time you rent a car!


    The image processing of nighttime images is different than the image processing
    for daytime images. Images that are well lit can be more readily processed. Images
    that have dark shadows and other darkened portions is harder to process. This
    often involves doing various image processing clean-up. It can also change the
    probabilities associated with object detection. An object that during daytime
    had say a 100% probability of being a wheelchair at the curb might at nighttime
    have a 60% chance of being a wheelchair.


    There is also typically much more light reflections and distortions. Street light
    and the headlights can bounce off the car ahead of you, perhaps doing so off the
    chrome bumper that acts like a kind of mirror, and thus other objects either become
    more well-lit or become overly lit. The bouncing light can actually cause a sunburst
    effect and make the object recognition harder. Again, the image processing software
    has to be ready for this impact.


    For machine learning and the use of artificial neural networks, if those neural
    networks were trained with pictures of those objects during the daytime, it could
    be that those objects are no longer detected by the neural network. It''s important
    the training of the neural network include objects as seen in darker conditions.
    Some prefer to do both daytime image and nighttime image training together, as
    a smorgasbord, while others believe that the neural network will be better off
    if one instance is trained to daytime images and the other to nighttime images.


    One aspect that visually can become more problematic is the detection and interpretation
    of street signs. During daylight, it is usually relatively easy to spot a street
    sign, such as a stop sign or a caution sign. At nighttime, it can be much harder
    to spot the street sign. The darkness might obscure it, or the brightness of the
    headlights might create a sunburst effect. As mentioned, if a machine learning
    approach was used to train on street sign detection, it is important to be mindful
    of whether it can handle nighttime versions.


    Many self-driving cars use various relatively simple road-following techniques
    when the AI is driving the car. For example, the roadway markings are examined
    and used to decide where the boundaries of a lane are. Some roads use flat paint
    to mark the lanes, while some use reflective Botts’ dots. Nighttime driving can
    be tricky in trying to figure out where the lane markings are. It can also be
    easy to be fooled by the road markings in terms of falsely believing that they
    are correct when in fact they might be something left over from prior markings
    that have since been changed. The AI system portions dealing with this need to
    be prepared for nighttime driving.


    So far, I’ve focused mainly on the sensory aspects of nighttime driving. Consider
    that there are five key stages involved in AI self-driving cars during the driving
    task:


    - Sensors Data collection and interpretation

    - Sensor Fusion

    - Virtual World Model updating

    - AI Action Plan preparation

    - Car Controls Command issuance


    During sensor fusion, the sensor results are compared and combined in various
    ways. If the cameras are not getting good images, it is usually the case that
    the AI system is devised to give less weight to those sensors. Thus, if the camera
    is suggesting that there doesn’t seem to be a pedestrian at the side of the road
    (perhaps the image is so darkened that there is no ready way to detect a figure
    standing in the shadows), but the radar is detecting that something might be there,
    the sensor fusion has to determine what to do. Should it rely upon the radar and
    claim that there is a pedestrian there? During daylight, often times the sensor
    fusion opts to wait until the cameras are able to agree

