    journey it had already started. In other cases, the preflight check is quite in-depth.
    This can be due to the plane not having been in use lately, or it can be due to
    the plane having lots of flying time and periodically you look for subtler cracks
    and clues of wear. The airlines refer to various levels of checks, ranging from
    level A to level D.


    Our approach is to undertake what we consider an automated “canary” pre-check
    of the AI self-driving car. It is an added layer of a system that tries to analyze
    and exercise the AI self-driving car to ensure as best possible that the AI self-driving
    car is ready for use. Similar to an airline preflight check, the canary can do
    a full-length and deep analysis, or it can do a lighter partial analysis. The
    fuller version takes longer to do. The human owner that wants to use the self-driving
    car can choose which magnitude of pre-check to undertake. We call this added feature
    PFCC (Pre-Flight Canary Check).


    This is essentially a self-diagnostic to try and validate and verify that the
    AI system and the self-driving car are seemingly ready for travel. I say seemingly
    because there is only so much that can be pre-checked. Similar to an airplane,
    in spite of whatever pre-check or pre-flight is undertaken, there is still the
    chance that once underway that something will emerge that disrupts the journey.
    There are aspects that might have been able to be found via the pre-check, while
    there are other aspects that might arise at a later time, during the journey,
    and no pre-check would have detected.


    Let’s consider the major stages of an AI self-driving car’s actions and how the
    pre-check takes place. There are these core stages:


    +   * Sensor Data Collection & Analysis

    * Sensor Fusion

    * Virtual World Model Updating

    * AI Action Plans Updating

    * Car Control Commands Issuance


