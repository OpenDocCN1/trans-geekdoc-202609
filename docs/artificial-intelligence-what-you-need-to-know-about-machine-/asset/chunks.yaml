    # 第 10 章：推荐系统


    ## 概述


    推荐系统被所有主要科技公司使用，尤其是那些以内容为主的公司。你可以确信 YouTube、Facebook、Netflix 等公司都在其产品中积极采用它们。它们的设计初衷是：你使用这些服务越多，它们就能向你推荐更多你可能想看的内容。这增加了用户在其网站或服务上花费的平均时间，因为消费者会看到一个接一个吸引人的视频。这也省去了消费者执行搜索以寻找所需内容的麻烦。如今我们当中有谁登录
    YouTube 从不碰搜索栏？许多人将 YouTube 会话限制为仅观看推荐板块上的视频，或观看下方板块弹出的另一个视频。只要你登录了账户，这些视频就会根据你的兴趣量身定制。即使你没有登录，YouTube
    也越来越多地利用你的 IP 地址和其他浏览器代理详细信息，根据你之前的观看习惯来定制主页。


    推荐系统正在被积极研究，因为它们在无需改变任何事物的情况下就能为公司增加价值。所有内容早已存在——这些系统充当了内容盈利能力的“力量倍增器”。为了让公司“了解”用户是谁以及他们的兴趣可能是什么，它们使用过滤算法，结合全系统范围的用户画像技术来比较用户。


    ## 过滤算法


    ### 协同过滤


    这些算法中最常见的称为协同过滤。通过两个在线音乐流媒体服务 Last.fm 和 Pandora 可以窥见它们的差异。Last.fm 生成的播放列表或“电台”使用协同过滤来找出品味相似的其他用户手动添加到其资料库中的内容。Last.fm
    的新用户最初只会拥有他们搜索或主动收听的内容。在收听喜爱的音乐几天甚至几小时后，用户会在其资料库中收到随机插入的音乐。这是协同过滤技术查找收听相同艺术家的其他用户，并发现他们还喜欢什么其他音乐的结果。如果一切按计划进行，新用户会对推荐的音乐感到满意并继续收听。


    ### 基于内容的过滤


    另一种类型称为基于内容的过滤。另一方面，Pandora 采用基于内容的过滤方法。它们从其专利的“音乐基因组计划”数据库中收集歌曲属性，以寻找属性重叠的其他歌曲和艺术家。该数据库为每首歌曲存储了令人难以置信的
    400 种不同属性。用户通过创建播放列表，可以进一步筛选这堆不同但相似的音乐。他们只需“不喜欢”一首歌，算法就会在歌曲选择过程中弱化该歌曲的属性。用户标记“不喜欢”越多，系统推荐他们想听的音乐就越准确。同样，如果用户“喜欢”一首歌，算法就会寻找具有相同被喜欢属性的音乐。在
    Pandora 看来，所有音乐都可以归结为这 400 个属性。


    ## 隐私与伦理担忧


    鉴于当前在线信息过载，公司开发这些系统也就不足为奇了。理论上，推荐系统是双赢的解决方案。客户无需筛选海量数据，也无需遭受信息过载之苦。服务提供商则能获得更多利润。


    推荐系统的主要争议点在于它们可能泄露用户信息。过去对数据进行匿名化的努力遭到了安全和隐私倡导者的大量批评。Netflix 实际上曾被一小群人起诉，他们发现
    Netflix Prize 竞赛中使用的匿名数据可以与免费在线资源交叉引用，从而揭露他们的身份。Netflix 随后花费一笔未透露的金额达成和解。


    该领域的其他担忧集中在歧视和协同过滤数据可能被滥用上。如果这些数据未被匿名化，就可以关联到个人用户账户，意味着公司掌握了你喜欢事物的私密知识。这反过来又助长了阴暗的定向营销计划。


    ## 未来方向


    这些系统的未来指向明确：不断提高的个性化水平。目前，推荐系统局限于内容领域。用户喜欢内容，可以被推荐内容，从而更想使用该服务。然而，如果这些系统能推广到不专注于内容的领域会怎样？例如，这项技术结合物联网，可以为消费者创造终极的个性化环境。


    推荐系统可以连接到用户的智能冰箱，并利用所有智能冰箱所有者跨越的庞大食物偏好网络。智能冰箱应用随后可以根据多个属性向用户推荐热门食品。其中一些应用甚至可以自动为他们下单。Pandora
    对歌曲使用 400 个属性；类似的系统也可以为食品开发。你大概已经能想象出其中一些属性了。碳水化合物含量、糖含量、生酮友好、糖尿病食品等都可以为健康的定制饮食做出贡献。

