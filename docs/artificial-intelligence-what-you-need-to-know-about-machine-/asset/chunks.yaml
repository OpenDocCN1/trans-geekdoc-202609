    a graphics editing program. They are used to mesh two different colors together
    in varying degrees of intensity. A mathematical gradient sort of does the same
    thing, but they measure how much outputs change depending on slightly modifying
    inputs. A gradient can be calculated as a sort of slope. In machine learning,
    the higher the slope, the faster an ANN can learn. And if the gradient slope is
    zero, then the ANN doesn’t learn. The simplest analogy to understand mathematical
    gradients is a blind hiker going up a mountain or hill. His objective is to reach
    the summit with the lowest number of steps. The peak is relatively flat with a
    small slope, but the base of the mountain has a large slope. At first, the hiker
    can take longer strides up the mountainside to minimize the number of steps, but
