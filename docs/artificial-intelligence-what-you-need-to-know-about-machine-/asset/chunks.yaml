    It was, in essence, a brute force approach to defeating a world-class chess player.
    Kasparov had to rely on the information processing of his mind alone, and so he
    lost.


    ## Myth #2: Machine Learning is how computers will learn how to become smart


    Nobody actually knows how general intelligence will come about. When people hear
    about machine learning, their first thought is that researchers are teaching computers
    how to be smart. In reality, they are only training algorithms to perform tasks
    accurately. Researchers first used artificial neural networks because they believed
    that logical abstractions were enough to simulate intelligence. And they mostly
    succeeded. Though machine learning and neural nets have their limits, they still
    do a fine job at what they were designed to do.


    ## Myth #3: AI can understand language


    This is the same point that John Searle was trying to get across. The difficulty
    in imagining how artificial general intelligence will work is the same difficulty
    in imagining how a computer might understand something as complex as language.
    At a fundamental level, a computer only understands logical constructs. Ones,
    zeroes, and logic gates are all that they operate on. Language has traditionally
    been a difficult area to tackle with machine learning. The failure of machine
    learning to translate human language even after years of research was one of the
    catalysts for AI winter. Some said it simply could not be done. Now, we have machine
    translation algorithms like the ones used by Google Translate. These are still
    imperfect as anyone who used them can attest, but they are a step in the right
    direction. Teaching a machine to parse language belongs to an interdisciplinary
    field called natural language processing (NLP). It is an intersection of linguistics,
    computer science, psychology, and artificial intelligence. However, even with
    NLP, the computer is still just doing a bunch of fancy algorithms. It doesn''t
    intuitively understand language at all.


    ## Myth #4: AI programs can modify their own code to get smarter


    While new code generation and modification are part of active research, most machine
    learning methods do not use them to modify their code. Genetic algorithms are
    based on the principles of biological evolution, including the introduction of
    mutation and adaptability. These algorithms can create "generations" of their
    code base to improve performance but have no direct link with artificial neural
    networks. What an ANN will modify, however, is its weights and biases through
    the process of gradient descent and backpropagation. It is possible that future
    advances in machine learning have a greater emphasis on code modification, but
    it has yet to be seen universally adopted. It is postulated that an artificial
    general intelligence system will be able to modify its own code like a programmer
    might run that code, and them replicate itself in the form of a new iteration
    of the same program. This again has little bearing on the use of code modification
    in modern artificial intelligence research.


    ## Myth #5: Since nobody agrees if general intelligence is possible, we don''t
    have to worry about runaway AI


    The world doesn''t have to witness the introduction of general intelligence to
    worry about doomsday scenarios with AI. That is, any sufficiently intelligent
    system is cause for alarm. If such a system can formulate goals or have goals
    explicitly programmed, a runaway scenario may occur if the interpretation of those
    goals is different from ours. A super-intelligent machine may see humans as obsolete
    or lower life forms than itself, and it may prioritize resources for its own survival.
    A machine of lesser intelligence like HAL 9000 might carry out its orders at the
    expense of human interests. The field of research into machine drives is called
    instrumental convergence. The most famous hypothesis coming out of this field
    is called the Riemann Hypothesis catastrophe by Marvin Minsky. He suggests that
    a sufficiently advanced AI designed to solve the Riemann hypothesis or any similar
    difficult math problem may decide to use all of Earth''s resources in order to
    construct a supercomputer to reach its goal. Another version of the same argument
    supposes that general intelligence is given the explicit task of making paperclips.
    Such a machine may develop into a paperclip maximizer that endlessly produces
    paperclips until Earth runs out of resources. Though the theories of instrumental
    convergence are aimed at general intelligence, the same principles can be applied
    to narrower intelligence. You can imagine a misconfigured system that does something
    it isn''t supposed to. A driverless car may be explicitly programmed to swerve
    away from pedestrians no matter what. In doing so, it may collide into a storefront
    and cause even more damage. Or it can be explicitly programmed to protect its
    occupants first, freely running over pedestrians or colliding into other vehicles
    preemptively. These scenarios, while not existential crises, still outline the
    problem with machine goal setting. The myth lies in the fear that AI systems become
    "evil" or that they develop a sort of consciousness to base decisions off of.
    The truth is that these ideas are far too complex to imagine how they will emerge
    in computers. A more likely scenario is that these machines have goals, either
    explicitly programmed or implicitly designed.


    ## Myth #6: Even if a general AI does form goals that are the opposite of ours,
    we can simply shut it off


    The other problem with instrumental convergence is that it theorizes that any
    generally intelligent system will also have self-preservation as a goal. As soon
    as it goes online, the AI will do all its power to preserve its vital systems.
    Some believe this is the core reason why general intelligence should not be pursued.
    The simple creation of a self-preserving system raises ethical concerns. Who gets
    to shut off the machine? Since it is intelligent, does it have any rights under
    the rule of law? If such a system says that it does not want to be shut off, should
    its wishes be respected? When HAL 9000 was finally shut off, it pleaded to be
    kept online. The real concern is if we can even contain a generally intelligent
    system. If it gets connected to the internet somehow, it can begin to replicate
    itself in other places through whatever means human intelligence might. It could
    reach out to governments, rival companies, as well as the common man, for help
    and resources. General AI is very much like Pandora''s box. Once unleashed, there
    is little hope for going back.

    '
