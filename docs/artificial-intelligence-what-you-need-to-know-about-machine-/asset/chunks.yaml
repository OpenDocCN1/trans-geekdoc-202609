- raw: 'Chapter 6: Machine Learning When people first hear the words “machine learning”,
    they might assume it has something to do with advanced programming. Laypeople
    usually come across machine learning from the title in an online article. Others
    might hear it in an ad while they are watching YouTube videos. You don’t need
    a technical background to grasp what these two words may mean intuitively. At
    the same time, it is only the technical and curious that will even give it a second
    thought. As with most things that are technology related, the words are hot air.
    You hear them being said, you read them on a landing page for a new digital product,
    but you don’t ask or care what is going on. This attitude is understandable but
    a little saddening. Machine learning plays a pivotal role in our society and will
    only get more important in the near future. While machine learning doesn’t dictate
    things like government and economic policy, one day it might. By a large sense,
    machine learning today is restricted to academic and business circles. It is from
    the business side of things that it permeates into the mainstream. Advertising
    is the obvious form of transmission, but it also seeps in through news media.
      As we go forward into the 21st century, machine learning will be increasingly
    talked about. More news articles will be written, and the global population will
    have to decide for themselves if they wish to understand further or to turn a
    blind eye and guesstimate what the words are trying to say. If the future is anything
    like today, we can probably give up on public schools imparting machine learning
    to their students any time soon. Things like AI often go the way of computer programming
    – just because Obama says that everyone should learn how to code, it doesn’t mean
    that computer science should be added to the common core. The reality is that
    not everyone should learn how to program. Programming will never be a common skill
    like reading and writing, period. In school-aged children, computer programming
    starts as a hobby, then it turns into an obsession and eventually into a profession.
    Just like some children like playing sports and others like to read books, only
    a few like to program. On the upside, Generation Z and beyond grow up surrounded
    by technology. Computer literacy is at an all-time high, so there is some hope
    for programming becoming more common. Currently, it sits as specialized knowledge.
    Machine learning is yet another specialization that rests on top of programming.
    It sits at an intersection between statistical and computational thinking. The
    consequences of this specialization of knowledge are that few people understand
    it. Yet marketing people continue to insist on shoving it down the throats of
    the common consumer. For some reason, throwing in the words “smart”, “AI”, and
    so on are major selling points. Either machine learning literacy needs to go up,
    or it will continue to be treated as some “special sauce” or magic oil. There
    really isn’t any magic behind it though; it only seems magical because people
    are uncomfortable with the idea of a machine or program having the ability to
    think. This goes back to the uncanny discussed in Chapter 2. Even the words “machine”
    and “learning” sound clandestine to many. What is going on here? Is a programmer
    sitting in a murky apartment somewhere mouthing off the ABCs to his monitor? And
    can the monitor understand what he is saying? I doubt many truly believe this
    when first encountering machine learning in a headline. The problem is that when
    somebody doesn’t understand something, they only ask questions if it matters to
    them. Machine learning? Probably some fancy computer thing that people at MIT
    work on. At the very basic, machine learning is clever programming and some fancy
    statistics. It is very difficult to separate the two both in theory and in practice.
    The more cynical will say that machines cannot think, therefore, they cannot “learn”,
    and that AI is just a moniker for advertising products. What is termed machine
    learning is really just a statistical method – a bunch of numbers that result
    in some output that may be mistaken as intelligent reasoning. This attitude while
    practical still misses the point. Machine learning relies heavily on statistical
    foundations, but it is not purely statistics. And no, machine learning cannot
    make a computer ‘learn’ in the way a child can, but they can nevertheless find
    patterns in data, apply generalized rules to data, and use both those abilities
    to predict future data. More specifically, it is the program, not the machine
    as a whole, that is doing this. The words “machine learning” is actually a huge
    misnomer. Machines are not reducible to a single program, and the program isn’t
    “learning” how we learn. But since it is a flashy name, it has stuck both in academia
    and in advertising. Machine learning was actually just a name given by Arthur
    Lee Samuel, a pioneer in artificial intelligence. Samuel was interested in how
    a computer could possibly play games. If a computer could play a game against
    a human opponent and win, then maybe a computer could be taught to perform other
    tasks. He successfully wrote a program that played checkers in the 1950s. Checkers
    would later go on to become a “solved” game like tic-tac-toe. A solved game means
    that it is possible to win every game given the right inputs, no matter what.
    It was probably from checker’s simple ruleset that allowed Samuel to break down
    the problem into computer code. Samuel’s program could not only play checkers,
    but it could also play it well. He challenged the fourth top checkers player in
    the nation for a game, and the program won. The most interesting accomplishment
    of his program is that it was first written in an old computer called the IBM
    701. It had a whopping memory of 2048 bits and was made out of vacuum tubes. If
    such a program could be made with that little computing power, you can imagine
    just how powerful his methods were. So how did Samuel manage to produce this intelligent
    behavior in his program? The answer is the same used before to describe machine
    learning – some clever programming and a bit of math. Samuel used a data structure
    called a “game tree” used to simulate the state of the game at any given point.
    The name comes from the field of game theory which is a branch of mathematics
    focused on the study of competitive strategy within game constraints. Since checkers
    is such a simple game, the program could easily encode information into bits along
    the tree. Turn number and positions of pieces on the board are relatively easy
    to cache into computer memory. The program then used a search algorithm with a
    minimax heuristic to find paths along the tree. Each path was given a weight or
    a measurement of how strong the move on that path was relative to previous games.
    This is where machine learning comes in. Samuel’s checkers program was able to
    play the game competitively just six to eight hours after running simulations
    of the game over and over again. In other words, the program could generate its
    own data and assign weights to individual moves. To understand how his method
    works, we can take the even simpler game of tic-tac-toe to demonstrate. In tic-tac-toe,
    you have a grid board with nine cells that can be occupied by one of two symbols
    and you have two players that correspond to each symbol. To encode a single turn,
    you need something to account for each of these elements of state. Computers store
    information in a series of ones and zeros, so doing this is pretty straightforward.
    You have nine cells that can be a cross, a circle, or empty. This is three states
    per cell. In binary, you can encode “00” to mean an empty cell, “01” to mean cross,
    and “10” to mean circle. To represent the entire board then, you need to string
    these together. This is a bit simplified, but you probably get the gist. Each
    board representation is a single turn in the game. These are put into the game
    tree as individual nodes. In the simulation, each possible turn is added as another
    node for each possible input. Say a simulation begins with the crosses player
    putting down their symbol in the top left cell. That move is then added to the
    tree with an unknown weight. The program then adds all the possible game states
    that follow that initial move. Player two can place a circle in any cell that
    isn’t occupied, so that equals to eight total simulated moves. The program continues
    to do the game and enters its ending conditions. It can then trace the path that
    the simulation took to create those conditions. Any move that is likely to result
    in a victory is given a higher weight than a move that does not. As you can imagine,
    placing a cross in the middle cell is given the highest weight. After all, tic-tac-toe
    belongs to a class of games that are considered solved. This means that the crosses
    player can force a win every time. For tic-tac-toe, finding the optimal solution
    is easy. Things get a little more complex with checkers. The standard configuration
    used in the United States is a board of 8 x 8 cells with 12 pieces per player.
    In contrast, tic-tac-toe only has nine cells. Samuel needed to use a special algorithm
    to conduct thousands (if not millions) of game simulations while never exceeded
    the IBM 701’s modest memory. He used a technique called alpha-beta pruning which
    is a minimax approach to tree traversal. Instead of simulating hundreds of different
    moves after the initial input, the program kept a running weight in memory for
    each move. If the next move resulted in a smaller weight, it would simply be discarded
    from memory. And if the move resulted in a bigger weight, the running memory would
    be replaced with the newly improved move, and the previous contender also discarded.
    This makes sense, as moving a checkers piece backward or to the side is an intelligible
    move when the player can “take” an enemy piece. Just because a move is possible
    doesn’t mean it should be directly considered in the search tree. Algorithms that
    use clever heuristics like the minimax strategy give rise to behavior that seems
    intelligently conceived. But all that the program is doing is calculating different
    weights to get the desired result. Samuel’s research was considered one of the
    first breakthroughs in machine learning because it was easy to see how similar
    algorithms could be applied to different problems, not just simple board games.
    Up to that point, artificial intelligence was focused primarily on the neural
    net approach. The idea was that if a program could simulate the amount of connections
    in the human brain, then it could reason just like a human brain could. When the
    field of AI was just starting, computers had nowhere near that amount of memory,
    so neural nets were considered below their potential for many years. Neural nets
    or neural networks have become synonymous with machine learning in media parlance,
    but it should be noted that Samuel’s checker program did not use them. Instead,
    the checker playing program used a simple strategy called lookahead to predict
    the best possible moves for the computer to take. A program has no understanding
    about the rules of checkers or how to play it. It only knows what it is programmed
    to do and what the conditions for ending a game are. If the computer has twice
    as many pieces left as the other player, the program doesn’t know that it has
    the advantage. Another easy way to tell who is winning in checkers is by comparing
    the number of kings on the board. This knowledge is completely lost on the computer
    program tasked with playing the game. Things that should affect the behavior of
    a machine learning program are called features, and they are a central problem
    that needs to be solved. Any machine learning effort is only as good as the features
    that the programmer chooses to influence program behavior. The only thing that
    the checker program knows before making moves is the board state. In computer
    memory, this will be a jumbled assortment of ones and zeros. Features are important
    because they give the grounds for making sense out of the board state. If the
    program recognizes that it can take an enemy piece and thus raise the number of
    pieces on their side relative to their opponents, then that behavior should be
    encouraged. Adding a score or a weight function to a feature allows these decisions
    to be made. The lookahead strategy is to simulate the next possible turns in a
    short range of four-six moves and calculate what the best moves are. Checkers
    is a simple enough game that features and their weights are straightforward to
    calculate. The point of the game is to reduce the opponent’s pieces to zero or
    to place your pieces such that the opponent cannot make any moves. The number
    of pieces and the availability of movement are two obvious features for determining
    program behavior. The program “thinks” by looking ahead in response to the state
    of the board. It calculates the best course of action by determining the best
    weight of a single move. After hundreds and thousands of game simulations against
    itself and human players, the program learns which moves are more likely to result
    in a win or in an increase of features that are favorable for winning. After a
    while, the program learns that it can take a piece to the opposite of the board
    and get “kinged”. A king can move backward in addition to forwards, accentuating
    the programs ability to take enemy pieces and to block other pieces. Samuel’s
    checkers program has its fair share of clever programming, but it isn’t heavy
    on statistical foundations like much of machine learning is today. Samuel wrote
    his program in the 1950s, decades before machine learning would get mainstream
    attention. The machine learning that is talked about today is slightly different
    from what Samuel was doing. Of course, the problems machine learning is used to
    solve are much harder to compute than the optimal checkers strategy. The algorithms
    are different, and the role that statistics plays is significant. However, Samuel
    achieved his goal of demonstrating that a program could indeed exhibit learned
    behavior from thousands of iterations of simulated play. He knew that checkers
    was merely a vehicle for proving that such a feat was possible. After it was done
