- raw: 'Chapter 7: Neural Networks If humans are intelligent because of their brains,
    and if brains work by creating neural connections called synapses, wouldn’t it
    make sense to simulate these networks of connections in order to simulate intelligence
    in machines? Or at the very least, that is what early AI researchers thought.
    The sheer volume of connections in the human brain is what we owe our intelligence
    to. The average human brain has around one hundred billion neurons or ten to the
    eleventh power. These neurons can then connect to up to 7,000 other neurons –
    meaning the total number of connections is an order of millions of billions of
    connections. That is bananas. The beginnings of artificial neural networks (ANN)
    directly coincided with the study of real neural networks. In 1943, a neurophysiologist
    named Warren McCulloch teamed up with mathematician Walter Pitts to describe how
    neurons in the brain might work. They co-authored a paper in which they created
    a simple ANN out of electrical circuits. The ANN they designed used artificial
    or logical neurons called the McCulloch-Pitts neuron. Inside the brain, a neuron
    works by receiving inputs, processing the information, and then transmitting it
    to other neurons. A neuron cell is made out of a nucleus that forms the cell body.
    From the cell body, structures called dendrites branch out like the arms of an
    octopus. Attached to the cell body is a long chain-like structure called the axon
    that is used to connect to other neurons. This point of connection is called the
    synapse and also looks like tendrils or branches used for connecting. The dendrite
    structure receives information and the cell body or soma processes it. The output
    then gets fired through the axon and into the synapse where the next neuron receives
    it. This is, of course, a simplified version of the true story, but it is enough
    for understanding artificial neurons and ANNs. The McCulloch-Pitts neuron is,
    of course, purely logical. It doesn’t make sense to talk about parts of a neuron
    as if they existed in real life. But it does make sense to talk about the parts
    according to their logical function. These artificial neurons are made up of two
    parts simply called f and g. First is g , it acts as the dendrite and receives
    some input, performs some processing, and passes it on to f. The processing can
    be a chain of Boolean operations that are said to be either excitatory or inhibitory
    decisions. A decision that is inhibitory has a greater effect on the neuron firing
    or not. For example, if the neuron is deciding whether to eat at a restaurant,
    an inhibitory decision would be something like “Am I hungry?” Obviously, if you
    aren’t hungry, you won’t make the trip. Less important decisions in the process
    may be “Do I crave fast food?”, “Do I feel like going out?”, “Does my car have
    enough gas?” and so on. These other excitatory inputs will not make the final
    decision on their own, but together they might. Next, g takes these inputs and
    aggregates them using a function. For the f to fire, the aggregate score of the
    inputs needs to surpass a certain value called the threshold parameter. More specifically,
    an artificial neuron is a mathematical function. It has a number of inputs and
    an output. In the case of McCulloch-Pitts neurons, both inputs and outputs are
    expected to be Boolean values (true or false). It is also known as a linear threshold
    gate. The structure of the artificial neuron allows it to simulate logic gates.
    To simulate a logical AND operation, the neuron takes on a threshold parameter
    of three given three inputs. In other words, the neuron only fires if all three
    inputs are true. A logical OR operation takes three inputs, and the threshold
    parameter is one. Note that the logic gate can be a little more complex when adding
    inhibitory inputs. For example, a neuron with two inputs can form AND logic, but
    if one of those inputs are inhibitory, then the neuron won’t fire. It will fire,
    however, if the inhibitory input is set to false. The NOR and NOT logical gates
    can easily be derived from the previous examples. If you are familiar with if-else
    logic in computer programming, you can probably tell that this scheme is essentially
    simulating long chains of if-else logic. However, the mathematical neuron model
    can “learn” the outcomes of decisions without needing to calculate each if-else
    statement. The logic is reduced to a simple function that outputs either true
    or false. This is also called linear decision boundaries. The artificial neuron
    splits inputs into two broad categories: positive or negative, fire or don’t fire.
    In an AND neuron with two inputs, this means that the only positive class happens
    when both inputs are true. Say that the neuron is deciding whether to go to bed.
    The first input can be “Is it past 11 pm yet?” and the second input is “Is tomorrow
    a workday?”. If both of these are true, then the neuron fire signifying it is
    time for bed. Conceptually speaking, the neuron has just learned what bedtime
    is – though 11 pm may be a little late for most people. The McCulloch-Pitts neuron
    is an extremely simplified version of a neuron abstracted into logic. Other types
    of artificial neurons also exist. And just like neurons connect to others to form
    synapses, the same can be said for artificial neurons. That is, every ANN will
    use some version of a neuron as their most irreducible unit. Using the same McCulloch-Pitts
    neuron, we can imagine what a neural network may look like. Artificial neurons
    are organized into different layers that feed their outputs into other neurons.
    We already saw how one simple neuron AND gate can learn when it is time for bed.
    Imagine what kind of behavior hundreds or thousands of these neurons can achieve.
    Since McCulloch-Pitts neurons use Boolean logic only, the things that they can
    compute is a little simplified compared to what other artificial neurons can use.
    While they can only pass true or false values to the next neuron, others may pass
    weighted values. Though the principles remain the same, neurons only fire if a
    certain threshold value is passed. Since an ANN can have multiple inputs going
    into multiple neurons at the same time, these inputs are said to propagate or
    cascade down the network. Instead of returning a true or false value, more sophisticated
    artificial neurons may trigger program behavior like steering an autonomous vehicle
    a few degrees to the left in order to avoid a pothole. The story of how ANNs derive
    weighted outputs from neuron connections is a little more complicated. Two methods
    at the heart of many ANNs are called backpropagation and gradient descent. The
    algorithms that make machine learning and neural networks viable come from the
    branch of applied mathematics called optimization. Mathematical optimization focuses
    on the selection of the best element from a list of alternatives and the criterion
    necessary for making that selection. When you train an ANN using supervised learning,
    you need to use something called a cost function that calculates the error rate
    between what the ANN predicted and what the correct answer is. The cost function
    is really the aggregation of individual loss functions, which calculate the error
    rate for single training examples. This relates to an algorithm called gradient
    descent which is used during the training phase of an ANN. The algorithm’s purpose
    is to find the values of parameters that reduce the cost function used by the
