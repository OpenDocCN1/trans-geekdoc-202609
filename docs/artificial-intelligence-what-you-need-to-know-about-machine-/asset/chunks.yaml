    doesn’t generate any data of its own. Reinforcement learning changes all of that.
    While still technically a type of machine learning, reinforcement learning goes
    a step further by adding a “software agent” that can learn from data derived from
    the learned environment as well as generating its own feedback. A software agent
    is simply a robot or autonomous program that is designed to mimic the properties
    of agency in human and animal actors. This software agent acts as the main source
    of intelligence in the program. Instead of being fed a correct set of outputs
    through classified data, the agent learns through the simulation of reward and
    punishment. Because of this, reinforcement learning is considered a third paradigm
    in the machine learning sphere following supervised learning and unsupervised
    learning. As such, there are no data sets for training the agent. Instead, they
    are said to learn from environments and their own feedback systems. You can imagine
    one possible software agent being a computer program tasked with finding its way
