    ## 简介


    当人们第一次听到“机器学习”这个词时，可能会认为它与高级编程有关。外行通常从网络文章的标题中接触到机器学习。其他人可能是在看 YouTube 视频时从广告中听到的。你不需要技术背景就能直观地理解这两个词的含义。同时，只有技术人员和好奇的人才会再多想一想。正如大多数与技术相关的事物一样，这些词往往只是空谈。你听人们说起，在新数字产品的着陆页上读到它们，但你不询问也不关心到底发生了什么。这种态度可以理解，但略显遗憾。机器学习在我们的社会中扮演着关键角色，并在不久的将来变得愈发重要。虽然机器学习目前不决定政府和经济政策等事务，但有一天它可能会。从广义上讲，当今的机器学习主要局限于学术界和商业圈。正是从商业侧面，它渗透进了主流视野。广告是显而易见的传播形式，但它也通过新闻媒体渗透进来。


    随着我们步入 21 世纪，机器学习将被越来越多地提及。会有更多的新闻报道撰写而出，全球人口将不得不自行决定：是希望进一步理解，还是视而不见、凭猜测揣摩这些词想表达的意思。如果未来与今天相似，我们大概可以放弃指望公立学校在短期内向学生传授机器学习知识。AI
    等事物往往遵循计算机编程的老路——仅仅因为奥巴马说每个人都应该学习编程，并不意味着计算机科学应该被加入通用核心课程。现实是，并非每个人都应该学习编程。编程永远不会像读写那样成为一项通用技能，句号。在学龄儿童中，计算机编程始于爱好，继而变成痴迷，最终成为职业。正如有些孩子喜欢运动，有些喜欢读书，只有少数孩子喜欢编程。好消息是，Z
    世代及之后的一代在技术包围中长大。计算机素养处于历史最高水平，因此编程变得更普及仍有一线希望。目前，它仍属于专业知识范畴。机器学习则是建立在编程之上的另一个专业领域。它处于统计学与计算学的交叉点，以棋盘状态为依据。它通过确定单步棋的最佳权重来计算最佳行动方案。在与自己及人类玩家进行成百上千次的游戏模拟后，程序学会了哪些走法更有可能导致胜利，或增加有利于获胜的特征。过了一段时间，程序学会了可以将棋子走到棋盘对端并获得“升王”资格。王可以在向前走的基础上增加向后走的能力，增强了程序吃掉敌方棋子和阻挡其他棋子的能力。塞缪尔的跳棋程序有其巧妙的编程之处，但与当今许多机器学习不同，它并不重统计基础。塞缪尔在
    20 世纪 50 年代编写了他的程序，这比机器学习获得主流关注早了几十年。今天所谈论的机器学习与塞缪尔当年的做法略有不同。当然，机器学习用于解决的问题比最优跳棋策略难计算得多。算法不同，统计学扮演的角色也很重要。然而，塞缪尔实现了他的目标，证明程序确实能通过数千次模拟对弈表现出习得行为。他知道跳棋只是证明这种壮举可行的载体。跳棋实现后，研究人员便寻求将机器学习应用于其他问题。


    机器学习仍缺乏一个恰当的定义。塞缪尔使用该术语的方式不利于将其推广到其他学习方案中。这一问题由 Tom M. Mitchell 解决，他指出机器学习程序是指“……关于某类任务
    T 和性能度量 P，如果通过经验 E，其在 T 中任务的性能（由 P 衡量）得到了改进，则称该程序从经验 E 中学习。”这个宽泛的定义涵盖了大多数机器学习技术，无论它们使用神经网络、前瞻搜索还是其他算法来实现从重复经验中学习的目标。经验可以是从模拟到输入算法的一条数据，不一而足。性能度量仅仅是正确性的度量，而任务类
    T 仅仅是 AI 的某种狭窄应用，比如识别图像是否包含裸露内容。随着持续输入裸露图像的经验，度量 P 应当提高。程序员的任务是设置 P 的参数。他们必须决定什么样的准确率是可以接受的，以及容忍假阳性和假阴性的程度。


    ## 现实应用：内容审核


    互联网内容审核是 Facebook、Twitter 和 Tumblr 等社交媒体网站面临的一个巨大问题。这些公司可能会结合人工和机器审核来标记裸露和其他图形材料。这项工作对人类来说在心理上是一种折磨，但需要人工介入来过滤算法结果，因为算法可能存在一定程度的假阳性。这些算法并不完美。互联网上有一张
    2000 年代流行的“脏灯”图片。图中有一盏被称为“性感”灯的灯，因为它看起来非常像穿比基尼的女性私处。大多数人以为那只是一盏长得滑稽的灯，直到原作者发布了完整图片。令网友惊恐的是，那盏性感灯实际上是一张穿比基尼女性照片的裁剪图。如果这种伎俩都能欺骗人类的大脑，想象一下，机器仅通过学习其他图片来识别裸露内容有多难。


    ## 现代技术与深度学习


    如今存在用于机器学习的算法、数学模型和技术数不胜数。每种都有自己的一套应用，用于教会程序学习。早期算法侧重于像塞缪尔跳棋程序那样的经验，而较新的算法则侧重于数据驱动方法。海量的数据、处理能力和廉价存储使得大规模数据分析成为可能。一系列被称为“深度学习”的技术处于当今前沿。你将在第
    8 章了解更多关于深度学习的内容。数据驱动方法在近年来引发了用户隐私辩论。我们知道 Facebook 等公司利用我们的数据运行机器学习系统。这些系统的合法性受到公众和政府的共同质疑。2018
    年初，Facebook 被曝无意中将部分用户数据共享给了一家名为剑桥分析的分析公司。该公司随后利用这些数据发起有针对性的广告活动，摇摆选民倾向特朗普。丑闻巨大，导致
    Facebook 股价蒸发约 1000 亿美元。你可以确信，剑桥分析使用了机器学习技术来收集数据、将用户分类为可能投票给共和党的人并创建人格画像。剑桥分析随后还夸耀称，他们的努力造就了特朗普在
    2016 年总统大选中的获胜优势。


    ## 机器学习与统计学习


    机器学习与统计推断（有时称为“统计学习”）之间的界限并不总是清晰的。你不必是统计专家就能实现机器学习算法，但通常需要良好的计算机科学掌握程度。统计学习是一门数学学科，而机器学习源于计算机科学。统计建模使用一系列数学检验和函数来寻找两个或多个变量之间的关系，以预测未来结果。机器学习通过算法做大致相同的事情。这两个概念有时会重叠，但它们仍然不同。纯统计技术通常做出机器学习算法不做的假设。例如，线性回归一开始就假设因变量和自变量之间存在线性关系。说机器学习只是统计学是不公平的。随着深度学习的引入，这种区别变得更大了。一些深度学习网络的规模之大，不可能仅靠纯统计学基础的简单多元回归来复现。


    ## 核心机器学习任务


    ### 分类


    机器学习中的一项常见任务是创建一个图像分类器，以区分图像中的内容。例如，标记裸露图像就是一种分类器。程序根据程序员定义的特征是否存在来决定是否标记图像。如果图像看起来相当露骨，就会被标记。涉及图像时，这些特征将是图像上的单个像素和像素簇。如果某物具有乳头的特征，程序很可能会标记它。如果肉色过多，也会发生同样的情况，你大概能想象得到。数据分类不限于图像。银行使用分类器判断交易是合法还是欺诈。Netflix
    等公司使用它们对用户进行分类，以实现定制化产品推送。这位用户喜欢动作片？也许我该多推荐些这类影片。医学研究人员使用分类器判断肿瘤是良性还是恶性，可能避免患者接受不必要的手术。


    ### 监督学习与无监督学习


    机器学习任务可分为两类：监督学习和无监督学习。在监督学习中，程序员或研究人员使用已分类的数据来辅助学习过程。如果他们在设计裸露过滤器，会使用成千上万甚至数百万张打过标签的图片，告诉程序这是裸露还是非裸露。程序随后基于这些无数输入创建自己的分类器。主要目标是创建一个足够好的分类器，能将裸露过滤泛化到任意图像。程序可以
    24/7 全天候运行，取代低薪工人实时辨别这些图像。问题在于人类对什么是性露骨、什么不是有直观理解。不幸的是，裸体男性和裸体女性的含义截然不同。这些社会习俗很难教给计算机，更别说手动编程进分类器了。监督分类器的优劣取决于给它的数据。为获得更高准确率，它需要大量赤裸裸露、暗示性裸露的例子，以及大量标记为安全的假阳性案例。性感灯虽具暗示性，但可能不算裸露。人类可以即时做判断，但机器不能。人工审核员一眼就能识别色情材料。大多数机器学习实例使用监督学习。


    另一方面，无监督学习不使用预分类数据。无监督学习算法不衡量期望性能，而是用于探索数据集的结构并寻找关系。一种方法是聚类。聚类将相似特征归入同类。例如，如果植物学家试图对未知植物物种分类，他们可以测量植物特征来确定物种。他们可能对植物进行数百上千次观察，记录花瓣数、花瓣长度、高度、颜色、每平方英寸花朵数等。这些特征中的每一个都由聚类算法处理以寻找模式。程序可能输出一张图，显示由不同因素决定的物种的整齐细分。也许物种一的花瓣比物种二和三长得不成比例。也许物种二的平均花瓣长度较短。如果研究人员选择了好的因素，物种将在图中形成明显的聚类。最广泛使用的聚类算法称为
    `K-means clustering`。顾名思义，它基于单个特征的均值创建 k 个聚类。这些聚类随后在称为 Voronoi 单元的空间边界中分离，具有清晰的独特性。


    ## 五大基本问题


    所有机器学习可归纳为五个不同问题：回归、分类、聚类、协同过滤和强化学习。任何时候我们想通过机器学习教计算机完成某种人类智能任务，通常都会涉及这些问题中的一个或多个。有些任务极其复杂，需要不止一个问题的答案。


    ### 回归


    回归源自统计学领域。它们用于基于过去结果预测未来结果。注意，统计学中的回归方法与机器学习中的回归不同。统计回归是一种特定技术，而机器学习中的回归是一个广义问题。机器学习中回归的目标仅仅是预测连续变量的未来值。在统计学中，连续变量可以有无限不同的值，而离散变量只能有一些值。因为美国只有五十二个州，所以它们是离散变量。连续变量的一个例子是股票价格。为了预测其值，机器学习算法需要从之前的输入及其相应输出中学习。机器学习中表示回归的另一个常用术语是“曲线拟合”，另一个源自统计学的概念。曲线拟合本质上是形成一个数学函数（或曲线），试图拟合一系列数据点。如果数据点拟合得足够好，该数学函数可能通过泛化预测曲线上的未来数据点。


    ### 分类与聚类


    分类和聚类是非常相似的概念。两者都要求机器学习系标记数据点的差异，使它们与其他数据点具有可比性的不同或相似。这些数据点代表现实生活中的事物。在自动驾驶中，机器学习可用于分类行人、停车标志、其他汽车等。更简明地说，分类是预测离散变量的过程。给定一张手写电话号码的图片，机器学习系统必须学会哪些数字属于哪个像素集合。系统预先知道这些只能是
    0 到 9 之间的数值。对其他图像进行分类，如区分金毛寻回犬和炸鸡，也属于此类。另一方面，聚类完全是关于将数据分组。这些数据在性质上可以是连续的，也可以是离散的。你已经看过不同植物物种的例子。聚类很大程度上依赖于程序员感兴趣的因素数量。假设你有一张高中同学聚会的高分辨率照片，包含数百张不同的面孔。你想对数据聚类，使每张脸成为一个独立的组。每个组将由独特的、可绘制的像素组成。给定一堆歌词片段，机器学习系统可能将它们聚类为不同流派和原唱艺术家。


    ### 协同过滤


    协同过滤类似于回归，但其目标不是预测未来值，而是填补数据空白。它与推荐系统和算法的研究密切相关。你可以想象 YouTube 和 Netflix 等大型内容服务大量使用协同过滤向用户推荐内容。协同过滤从与你品味相似的合作者或用户代理那里获取数据，并尝试将他们喜欢的内容与你可能喜欢的内容进行泛化。更广泛地说，协同过滤用于预测传感器和金融数据等其他系统中的缺失数据。


    ### 强化学习


    最后，强化学习用于教会机器如何从环境中学习。与其他类型的机器学习不同，强化学习不需要大型数据集即可开始。数据仍扮演关键角色，但它是实时聚合而非随时间积累。无人驾驶汽车例如直接从环境中学习。如果发生事故，系统会为下次遇到类似情况调整参数。Arthur
    Lee Samuel 的跳棋程序可被视为一种强化学习。近期进展催生了 Google 的 `AlphaGo Zero` 等程序，它在原始 AlphaGo 基础上泛化，无需任何数据集输入即可学习围棋。`AlphaGo
    Zero` 仅在几天内就超越了其训练有素的对手。


    ## 结论


    正如你所想象的，机器学习在我们的现代生活中有多种应用。从人脸识别到股市预测和无人驾驶汽车，机器学习应用数学原理和计算机算法来模拟真实智能。机器学习解决的常见问题涉及回归、分类、聚类、协同过滤和强化学习的某种类型。你可能会争辩说还有其他几种，但这些是最常见的。每当你在标题或产品描述中听到机器学习，它很可能是在解决这些问题中的一个或多个。


