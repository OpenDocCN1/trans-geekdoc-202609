    # Chapter 6: Machine Learning


    ## Introduction


    When people first hear the words "machine learning", they might assume it has
    something to do with advanced programming. Laypeople usually come across machine
    learning from the title in an online article. Others might hear it in an ad while
    they are watching YouTube videos. You don''t need a technical background to grasp
    what these two words may mean intuitively. At the same time, it is only the technical
    and curious that will even give it a second thought. As with most things that
    are technology related, the words are hot air. You hear them being said, you read
    them on a landing page for a new digital product, but you don''t ask or care what
    is going on. This attitude is understandable but a little saddening. Machine learning
    plays a pivotal role in our society and will only get more important in the near
    future. While machine learning doesn''t dictate things like government and economic
    policy, one day it might. By a large sense, machine learning today is restricted
    to academic and business circles. It is from the business side of things that
    it permeates into the mainstream. Advertising is the obvious form of transmission,
    but it also seeps in through news media.


    As we go forward into the 21st century, machine learning will be increasingly
    talked about. More news articles will be written, and the global population will
    have to decide for themselves if they wish to understand further or to turn a
    blind eye and guesstimate what the words are trying to say. If the future is anything
    like today, we can probably give up on public schools imparting machine learning
    to their students any time soon. Things like AI often go the way of computer programming
    – just because Obama says that everyone should learn how to code, it doesn''t
    mean that computer science should be added to the common core. The reality is
    that not everyone should learn how to program. Programming will never be a common
    skill like reading and writing, period. In school-aged children, computer programming
    starts as a hobby, then it turns into an obsession and eventually into a profession.
    Just like some children like playing sports and others like to read books, only
    a few like to program. On the upside, Generation Z and beyond grow up surrounded
    by technology. Computer literacy is at an all-time high, so there is some hope
    for programming becoming more common. Currently, it sits as specialized knowledge.
    Machine learning is yet another specialization that rests on top of programming.
    It sits at an intersection between statistical and computational to the state
    of the board. It calculates the best course of action by determining the best
    weight of a single move. After hundreds and thousands of game simulations against
    itself and human players, the program learns which moves are more likely to result
    in a win or in an increase of features that are favorable for winning. After a
    while, the program learns that it can take a piece to the opposite of the board
    and get "kinged". A king can move backward in addition to forwards, accentuating
    the programs ability to take enemy pieces and to block other pieces. Samuel''s
    checkers program has its fair share of clever programming, but it isn''t heavy
    on statistical foundations like much of machine learning is today. Samuel wrote
    his program in the 1950s, decades before machine learning would get mainstream
    attention. The machine learning that is talked about today is slightly different
    from what Samuel was doing. Of course, the problems machine learning is used to
    solve are much harder to compute than the optimal checkers strategy. The algorithms
    are different, and the role that statistics plays is significant. However, Samuel
    achieved his goal of demonstrating that a program could indeed exhibit learned
    behavior from thousands of iterations of simulated play. He knew that checkers
    was merely a vehicle for proving that such a feat was possible. After it was done
    for checkers, researchers sought to apply machine learning to other problems.


    Machine learning still lacked a proper definition. The way that Samuel used the
    term didn''t lend itself to a generalized application to other learning schemes.
    This was solved by Tom M. Mitchell who said that machine learning program is one
    that "... is said to learn from experience, E with respect to some class of tasks
    T and performance measure P if its performance at tasks in T, as measured by P,
    improves with experience E." This broad definition covers the gamut of most machine
    learning techniques, whether they use neural networks, lookahead, or other algorithms
    to achieve the goal of learning from repeated experiences. An experience can be
    anything from a simulation to a piece of data that is fed through an algorithm.
    The performance measure is simply a measure of correctness, and the class of tasks
    T is simply some narrow application of AI like recognizing if an image contains
    nudity. Measure P should improve with continued experience of being fed images
    of nudity. The programmer is tasked with setting up the parameters for P. They
    have to decide what level of accuracy is acceptable and to what extent false-positives
    and false-negatives are tolerated.


    ## Real-World Application: Content Moderation


    Internet content moderation is a huge problem for social media websites like Facebook,
    Twitter, and Tumblr. These companies may use a combination of human and machine
    moderation to flag nudity and other graphic material. The work is psychologically
    taxing on the human, but a human eye is needed to filter the results of the algorithms
    that may have a certain degree of false-positive. These algorithms are not perfect.
    There is a popular image on the internet from the 2000s about a "dirty lamp".
    The image contains what has been termed a "sexy" lamp because how similar it looks
    to a woman''s nether region in a bikini. Most people thought it was still just
    a funny looking lamp until the original author published the full image. To the
    internet''s horror, the sexy lamp was actually a cropped image of a woman in a
    bikini. Now if such a trick can trick the human mind, imagine how difficult it
    is for machines to classify nudity simply by learning from other pictures.


    ## Modern Techniques and Deep Learning


    The number of algorithms, mathematical models, and techniques that exist for machine
    learning today is myriad. Each has their own set of applications for teaching
    programs to learn. Early algorithms focused on experiences like Samuel''s checkers
    program and newer algorithms focus on the data-driven approach. The sheer amount
    of data, processing power and cheap storage allow for the mass analysis of data.
    A family of techniques called "deep learning" is at the forefront today. You will
    learn more about deep leaning in Chapter 8. The data-driven approach has sparked
    a user privacy debate in recent years. We know that companies like Facebook use
    our data for running machine learning systems. The legitimacy of some of these
    systems has been questioned both by the general public and governments. In early
    2018, Facebook was revealed to have inadvertently shared some of its user data
    with an analytics company called Cambridge Analytica. This company then used the
    data to wage a targeted advertising campaign to sway undecided voters in favor
    of Donald Trump. The scandal was huge, costing Facebook Some $100 billion in stocks.
    You can be sure that Cambridge Analytica used machine learning techniques to harvest
    the data, classify users as likely to vote Republican and create a personality
    profile. Cambridge Analytica would go on to brag that their efforts are what led
    to Trump''s winning margin in the 2016 presidential election.


    ## Machine Learning vs Statistical Learning


    The line between machine learning and statistical inference or what is sometimes
    termed "statistical learning" is not always clear. You don''t have to be an expert
    in statistics to implement machine learning algorithms, but you generally need
    a good grasp of computer science. Statistical learning is a mathematical discipline,
    and machine learning stems from computer science. Statistical modeling uses a
    series of mathematical tests and functions to find relationships between two more
    variables to predict future outcomes. Machine learning does more or less the same
    but through algorithms. Both concepts tend to overlap at times, but they are still
    different. Purely statistical techniques usually make assumptions that machine
    learning algorithms do not. For example, a linear regression assumes that there
    is a linear relationship between the dependent and independent variable, to begin
    with. It isn''t fair to say that machine learning is just statistics. The distinction
    was made even greater with the introduction of deep learning. The sheer scale
    of some deep learning networks would be impossible to reproduce from simple multiple
    regressions that are pure statistics based.


    ## Core Machine Learning Tasks


    ### Classification


    A common task in machine learning is to create an image classifier that can distinguish
    what is in an image. Flagging an image for nudity, for example, is a type of classifier.
    The program decides if an image should be flagged based on the presence of features
    that the programmer has defined. If the image looks reasonably explicit, then
    it is flagged. When it comes to images, these features will be individual pixels
    on the image and clusters of images. If something has the characteristics of a
    nipple, then the program will probably flag it. The same thing happens if there
    is too much fleshy color as you can probably imagine. Classifying data is not
    limited to images though. Banks use classifiers to determine whether transactions
    are legit or fraudulent. Companies like Netflix use them to classify their users
    for tailored product delivery. Does this user like action movies? Maybe I should
    show them more of that. Medical researchers use classifiers to determine if a
    tumor is benign or malignant, possibly saving the patient from needless surgeries.


    ### Supervised vs Unsupervised Learning


    Machine learning tasks can be broken down into two different classes: supervised
    learning and unsupervised learning. In supervised learning, the programmer or
    researcher uses data that has already been classified to aid the process of learning.
    If they are designing a nudity filter, they will use thousands or millions of
    tagged images that tell the program that this thing is nudity or not. The program
    then creates its own classifier based on these countless inputs. The main goal
    is to create a good enough classifier that can generalize nudity filtering to
    any image. Instead of having someone working for little pay to discern these images
    in real time, a program that runs 24/7 can do it instead. The problem is that
    humans have an intuitive grasp of what is sexually explicit and what isn''t. Unfortunately,
    a bare-chested man has vastly different connotations than a bare-chested woman.
    These types of social conventions are difficult to teach a computer, let alone
    to manually program into a classifier. A supervised classier is only as good as
    the data it is given. For better accuracy, it needs plentiful examples of blatant
    nudity, suggestive nudity, and tons of false-positives that are labeled as safe.
    A sexy lamp while suggestive is probably not the same as nudity. Humans can be
    making judgment calls on the fly but a machine cannot. A human moderator knows
    pornographic material when they see it. Most instances of machine learning use
    supervised learning.


    Unsupervised learning, on the other hand, doesn''t use pre-classified data. Instead
    of measuring desired performance, unsupervised learning algorithms are used to
    explore the structure of a data set and find relationships. One way to do this
    is through clustering. Clustering lumps similar features together into likeness
    classes. For example, if a botanist is trying to classify an unknown species of
    a plant, they can take measurements of the characteristics of the plant to determine
    their species. They make take hundreds or thousands of observations of plants
    and record the number of petals, petal length, height, color, number of flowers
    per square inch, and so on. Each of these features is then processed by clustering
    algorithms to find any patterns. The program may output a graph of neat subdivisions
    of species determined by the different factors. Maybe species one has disproportionately
    longer petals than species two and three. Maybe species two has shorter petal
    lengths on average. If the researcher chose good factors, then the species will
    make up obvious clusters in the graph. The most widely used clustering algorithm
    is called `K-means clustering`. As the name implies, it creates k clusters based
    on the means of individual features. The clusters are then separated in spatial
    boundaries called Voronoi cells with clear distinctiveness.


    ## Five Fundamental Problems


    All of the machine learning can be boiled down into five different problems: regression,
    classification, clustering, collaborative filtering, and reinforcement learning.
    Anytime we want to teach a computer to do some task of human intelligence through
    machine learning it will generally involve any one of these problems. Some tasks
    are extremely complex and require answers to more than one of these problems.


    ### Regression


    Regressions come from the statistics world. They are used to predict future outcomes
    based on previous ones. Note that regression methods in statistics are different
    from regressions in machine learning. Statistical regression is a specific technique,
    whereas regression in machine learning is a generalized problem. The goal of regression
    in machine learning is simply to predict the future value of a continuous variable.
    In statistics, a continuous variable is a variable that can have infinitely different
    values, whereas a discrete variable can only have some values. Since there are
    only fifty-two states in the US, they are a discrete variable. An example of a
    continuous variable would be stock market prices. To predict their values, a machine
    learning algorithm needs to learn from previous inputs and their respective outputs.
    Another term that is commonly used to denote regressions in machine learning is
    "curve fitting", another concept borrowed from statistics. Curve fitting is essentially
    forming a mathematical function (or curve) that tries to fit a series of data
    points. If the data points fit well enough, then the mathematical function may
    be able to predict future data points along the curve through generalization.


    ### Classification and Clustering


    Classification and clustering are very similar concepts. Both require the machine
    learning system to denote differences in data points such that they are comparably
    different or similar to other data points. These data points go on to represent
    real life things. In the case of autonomous driving, machine learning may be used
    to classify pedestrians, stop-signs, other cars, and so on. More succinctly, classification
    is the process of predicting a discrete variable. Given an image with a handwritten
    phone number, a machine learning system must learn which numbers belong to which
    collection of pixels. The system knows beforehand that these can only be numeric
    values between zero and nine. Classifying other images like differentiating between
    golden retrievers and breaded fried chicken also falls into this category. Clustering,
    on the other hand, is all about grouping data together. These can be either continuous
    or discrete in nature. You already saw the example with the different species
    of plants. Clustering relies heavily on the number of factors that the programmer
    is interested in. Say you have an image taken at a high school reunion party.
    This is a high-resolution image with some hundred different faces. You want to
    cluster the data such that each face is its own group. Each group will be made
    up of distinct, plottable pixels. Given a mishmash of lyrics snippets, a machine
    learning system may cluster them into different genres and original artists.


    ### Collaborative Filtering


    Collaborative filtering is similar to regression, but instead of predicting future
    values, its goal is to fill in gaps in data. It strongly relates to research in
    recommender systems and algorithms. You can imagine some big content type services
    like YouTube and Netflix make extensive use of collaborative filtering to recommend
    things to users. Collaborative filtering takes data from collaborators or user
    agents who have similar tastes to yourself and attempts to generalize content
    they like with content that you might like. More generally, collaborative filtering
    is used to predict missing data in other systems like sensor and financial data.


    ### Reinforcement Learning


    Finally, reinforcement learning is used to teach a machine how to learn from the
    environment. Unlike the other types of machine learning, reinforcement learning
    doesn''t require large datasets to get started. Data still plays a pivotal role,
    but it is aggregated in real-time rather than over time. Driverless, for example,
    directly learn from their environments. If there is an accident, the system adjusts
    its parameters for the next time when a similar situation comes along. Arthur
    Lee Samuel''s checkers program would be considered a type of reinforcement learning.
    Recent advances have led to the creation of programs like Google''s `AlphaGo Zero`,
    which took the original AlphaGo program but generalized it to learn how to play
    Go without any dataset input whatsoever. `AlphaGo Zero` would go on to surpass
    the capabilities of its trained counterpart in just a matter of days.


    ## Conclusion


    As you can probably imagine, machine learning has several different applications
    in our modern lives. From facial recognition to stock market prediction and driverless
    cars, machine learning applies both principles of math and computer algorithms
    to simulate real intelligence. The common problems being solved by machine learning
    involve some type of regression, classification, clustering, collaborative filtering,
    and reinforcement learning. You could argue that there are a few more than these,
    but they are the most common ones. Anytime you hear machine learning in a headline
    or product description, it is probably about solving one or more of these problems.

