    # Chapter 9: Deep Learning


    ## History and Resurgence


    If neural networks approach the way that humans think, deep learning takes the
    idea a step further. Neural networks and artificial neurons have a long history
    dating as far back as 1950. But when they were first introduced, computing power
    was limited, and ANN was looked at like research toys rather than hardcore business-facing
    algorithms. When computing power improved, ANN received renewed interest from
    AI researchers as well as large internet companies. We are just now emerging out
    of the AI research winter that persisted into the 1980s and 90s. Part of this
    is due to computing power, and the other part is due to the introduction of the
    web and the massive amounts of data it generates. Today, deep learning is at the
    forefront of AI research and continues to make progress, helping the field thaw
    from the cold.


    ## Limitations and Hardware Advances


    Two things limit an artificial neural network. First is the computing power necessary
    to simulate layers of artificial neurons, and the second is a combination of available
    data and feature selection. Even the most powerful ANN clusters today are still
    orders of magnitude behind the raw computing power of the brain, for example.
    The introduction of powerful graphics processing units (GPU) for machine learning
    purposes greatly increased available computing power across the board. GPUs are
    inherently faster than CPUs because they tend to prioritize smaller, more efficient
    cores compared to the CPU’s powerful but bulky ones. They also allow for multi-threading
    of computational tasks and can more easily perform floating point arithmetic (decimal
    numbers) than CPUs. Though GPUs were intended for rendering 3D graphics at hundreds
    of frames per second, they have been adopted by the AI community for processing
    large deep learning projects.


    ## What Is Deep Learning?


    So what exactly is deep learning? As the name implies, it relates to creating
    additional layers of depth that traditional ANNs do not. The argument goes that
    if the brain is made up of layers and layers of neurons, how is it that flimsy
    ANNs with singular layers are capable of simulating intelligence? These are sometimes
    called “shallow” neural networks to differentiate from those with multiple layers.
    Now that GPUs are extremely fast and getting better every year, deep learning
    doesn’t require entire datacenters or neural net clusters to train models. Returning
    to the human brain motif, deep learning takes after the tendency for complex ideas
    to fire deep in the folds of the brain, rather than at superficial levels. Recognizing
    edges of pictures and tiny details fires neurons closer to the surface of the
    brain, while recognizing larger constructs like a person’s face fires deeper.
    More layers equal better, more intelligent systems. Information passes from the
    input neurons to additional hidden layers that also pass those inputs into each
    other. The more of these hidden layers, the better the results of machine learning.
    This is why deep learning is capable of tackling problems in artificial intelligence
    that shallow learning has traditionally lagged behind in. This includes computer
    vision, voice recognition, and language processing.


    ## The Power of Non-Linear Feature Processing


    The true power from deep learning comes from its non-linear processing of features.
    Traditional machine learning techniques mostly use linear models and suffer from
    the feature engineering phase. With deep learning, features don’t need to be picked
    out by a field expert. Instead, many different features are picked per model,
    contributing to the overall complexity of the neural net. A traditional classification
    of something may have used two or three features, but the deep learning equivalent
    is to use as many as the data affords.


    For example, to detect whether an object on the road should be considered a vehicle
    obstacle, a shallow machine learning system can use the shape of the object and
    its speed as factors. Such a system may perform well in the short run, successfully
    identifying different makes and models of cars whether in motion or parked. However,
    the system may encounter some unspecified behavior like a large carnival float
    moving relatively slowly around many pedestrians. Using shape and speed alone
    would not be enough to classify it. In contrast, a deep learning system may use
    several different factors in addition to shape and speed. As baseline inputs,
    shape and speed get passed to the deeper layers where they may also compare proximity
    to a road, the presence of pedestrians, orientation, distance from the camera,
    and so on. These additional factors will take longer to train the model and be
    more computationally expensive, but it will be better at identifying vehicles
    in the long run.


    ## Scalability and Big Data


    Consequently, the scope of traditional machine learning has its limits. There
    is a point where introducing more labeled data doesn’t result in better performance
    of the system. With deep learning, though, adding more data directly leads to
    better performance. It is mainly an issue of scale. One can scale well to a large
    number of inputs but the other cannot. It is no wonder that data-obese companies
    like Facebook and Google use it. Their main value as a company comes from the
    data that they acquire. Deep learning allows them to exploit it, gain insights,
    and ultimately profit from it. The reason why deep learning algorithms scale so
    well is that they are more conducive to analog-like data that span many features.
    Data like images, audio recordings, unlabeled text, and video footage are very
    different to work with than neat tabular data. These types of data are particularly
    good at forming hierarchical representations of features. Since the features don’t
    need to be chosen beforehand, deep learning algorithms can learn to form classes
    of features on their own. Higher-level learned features will be defined in terms
    of the lower-level learned features.


    Returning to the vehicle identification example, a low-level feature may be some
    small defining aspect of the car like the rear windshield. A higher-level feature
    is a collection of these, like bumper size, indicator light positions, and license
    plate area, used to identify different makes. A car with a higher windshield and
    blocky appearance may be an SUV class, whereas something that is close to the
    ground may be a sedan class.


    ## Deep Learning Architectures: Convolutional Neural Networks


    Deep learning neural networks work a bit differently from regular ANNs. One class
    of these networks are called convolutional neural nets (CNN) and are used primarily
    for image recognition. Like other neural networks, they are designed after biological
    processes in the brain. Animals use their visual cortex to perceive light through
    individual cortical neurons. Each of these neurons corresponds to receptive fields
    that overlap in the retina. CNNs work in a similar fashion. They consist of an
    input and output layer plus additional hidden layers in between. The hidden layers
    use something called convolution to process their inputs. Put simply – convolution
    is using two distinct functions to create a third function that expresses how
    the first one affects the second. Convolution is used to group pixels together
    from the beginning so that the net already has an idea of how the big picture
    fits together. It is easier to form a hierarchical structure of features as well.
    These networks first recognize small edges of the image as the smallest possible
    feature. Each layer progressively adds another edge or midsection to the hierarchical
    data representation until the whole image is learned.


    ## Drawbacks and Industry Adoption


    Despite their increased accuracy, deep neural networks suffer from a number of
    drawbacks. Just because deep learning is state of the art, it doesn’t mean it
    should be generalized to every conceivable machine learning problem. For many
    tasks, shallow neural networks are the preferred option. However, large companies
    like Facebook regularly employ deep learning because they have the requirement,
    data, and computational resources to perform it. Facebook recently said that it
    uses some billion digital images to teach its deep learning systems. Smaller players
    in the AI scene do not have the processing power to work on that scale. But then
    again, Facebook is one of the biggest companies out there.


    Google demoed how powerful some of its systems are a few years ago. Their system
    purportedly consisted of one billion connections. It was trained using YouTube
    data and could accurately recognize cats in videos, yellow flowers, and other
    images. It is interesting to note that none of these features were selected or
    programmed outright. Their neural networks identified them through the hierarchical
    data representation. Furthermore, it could recognize between 22,000 different
    categories of images with some 17% accuracy. That level of accuracy is quite astounding
    once you consider the number of categories and how the system learned without
    any human first labeling the data. This accuracy could be increased to 50% if
    the number of categories was lowered to 1,000.


    Today, if some artificial intelligence system is at the bleeding edge, it is probably
    using deep learning. Virtually all of the big Silicon Valley tech companies are
    using it. When you use Google Translate on some arbitrary string, you are using
    a deep learning system. Every time you fire up your Amazon Echo to speak with
    Alexa, you are using deep learning. Google uses it to tailor your search experience
    to fit your personal interests. Over time, it has developed a database of knowledge
    dubbed the “Knowledge Graph” that contains some 570 million different entities
    and 70 billion facts. It is used along with Google Search to more accurately represent
    the data that a user may be looking for through their queries. For example, if
    you look up the name of a past US president, Knowledge Graph accumulates the relevant
    data and displays it in the sidebar. These small snippets of relevant data are
    gathered from sources across the web like Wikipedia and the CIA Factbook. Google
    says the information provided through the Knowledge Graph is capable of answering
    one-third of its 100 billion monthly user queries. And if you are ever lucky enough
    to ride in a driverless car – yep, it’s also thanks to deep learning technology.

