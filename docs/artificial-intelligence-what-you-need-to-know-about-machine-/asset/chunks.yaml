    # 第 4 章：行业专家警示我们关注 AI 的五大理由


    如今，人工智能已成为主导该领域的高科技公司的代名词。AI 最初是一门学术学科，但此后已将触角深深延伸至商业领域。许多 AI 研究人员彻底放弃了学术界，蜂拥而至
    Alphabet（Google）、Amazon、Facebook、Microsoft、OpenAI 等公司。这些公司都在以各种方式致力于机器学习算法的研究，毫无疑问处于
    AI 研究的最前沿。拥有 AI、数学和计算机科学高级学位的人才，宁愿加入这些公司的工程团队，也不愿留在学术界。既然他们身处最前沿，倾听其领导者的观点就显得尤为重要。


    一些人对 AI 问题保持沉默，另一些人如 Amazon 的贝索斯则表示，他们并不太担心潜在的 AI 威胁。而像埃隆·马斯克、比尔·盖茨和物理学家史蒂芬·霍金这样的远见者，都曾公开表达过对
    AI 潜在危险的看法。2015 年 1 月，霍金、马斯克及其他多位 AI 专家签署了一封关于人工智能研究的公开信，呼吁加强对其潜在社会影响的审视。这份长达十二页的文件标题为《稳健且有益的人工智能研究优先事项：一封公开信》。它呼吁开展新的
    AI 立法研究、伦理研究、隐私保护以及其他多项关注点的研究。


    正如信中所述，AI 的潜在威胁涉及多个维度。好消息是，我们目前所处的 AI 早期阶段仍具可塑性。只要在 AI 研究和政策的非工程方面投入适当的时间和关怀，未来就掌握在我们手中。AI
    威胁的担忧并不完全属于纯粹的生存危机。站出来高呼超级智能扩散将带来毁灭性后果很容易，但谈论伦理和隐私担忧等问题则远没有那么吸睛。对经济的潜在影响同样重大。


    这些警示本身并非全是厄运与悲观。事实上，它们是邀请公众和政府官员开始深入思考这个即将到来的新世界——在这个世界里，AI 的进步将彻底改变我们所知的生活。虽然其中不乏危言耸听的成分，但这有助于引起人们的关注。毕竟，如今的新闻周期更迭极快，头条新闻几乎瞬间就被点击诱饵和娱乐八卦淹没。我们的行业领袖主动就此事发声，意味着他们试图引起普通民众和政策制定者的注意。


    已故的史蒂芬·霍金在去世前，确保世界知晓他对 AI 的焦虑。在一个人工通用智能被称为“人类最后一项发明”的时代，这些担忧绝非空洞无据的博眼球言论。它们是在还有时间把事情做对的前提下，发出的预防性呼吁。没人能确定通用人工智能还要多久才能实现，但我们确实知道
    AI 正在变得更强。即使通用 AI 永不出现，我们也有许多理由担忧弱人工智能的进步。如果存在介于弱 AI 和强 AI 之间的中间地带会怎样？未来的系统在不具备完全自我意识的情况下，泛化解决问题的能力变得更强，这是可以想象的。无论哪种情况，以下担忧只是当今行业领袖所表达的冰山一角。


    请记住：发表这些言论的人是我们社会中最聪明、最具前瞻性的个体之一。不仅如此，他们一直密切关注计算机科学和 AI 研究的进展。对许多人来说，了解这些是他们的本职工作。他们的许多担忧并非新鲜事，但他们确实将
    AI 灾难场景推向了主流视野。


    ## 1. 公司应对其 AI 技术进行自我监管


    在最近的一次采访中，现任 Google CEO 桑达尔·皮查伊表示，对 AI 的恐惧“完全合理”。皮查伊保持乐观态度，称主要科技公司在部署 AI 系统时，必须制定道德准则和其他安全措施。这距离
    Google 因向五角大楼出售 AI 技术引发高调员工抗议仅过去几个月。该交易随后被取消。人们希望主要科技公司能建立机制，将其技术潜在的负面影响降至最低——尽管仅凭公司承诺去做可能还远远不够。


    皮查伊相信这些公司能够自我监管。这与 2018 年 6 月发布的 Google AI 原则一致。在线文件中列出的几点包括：AI 技术应造福社会，并经过广泛测试。文件还列明了
    Google 不会用其 AI 技术做的事。这包括不将 AI 用于监控、武器，或任何违反国际法的用途。


    桑达尔·皮查伊自 2015 年起担任 Google CEO，此后公司经历了诸多争议。这包括前述的五角大楼 AI 交易，以及为中国市场开发的带有审查内容的搜索引擎“蜻蜓”项目。有趣的是，公司曾在行为准则前言中包含“不作恶”这一座右铭。它后来被移至结语，但仍写道：“请记住……不要作恶，如果你看到认为不对劲的事——请大声疾呼！”


    ## 2. 武器化 AI 可能引发全球军备竞赛


    特斯拉汽车创始人兼 OpenAI 发起人埃隆·马斯克公开反对 AI 武器化。人工智能不仅有潜力制造毁灭性武器，还可能触发各国之间的全球军备竞赛，各方试图让最聪明的系统相互对抗。马斯克认为，AI
    被用作武器是不可避免的，但不应该如此。他与其他行业领袖签署了另一份请愿书，致联合国《特定常规武器公约》，呼吁禁止具有 AI 能力的自主武器。此类武器的彻底研制应像其他非常规战争武器一样受到监管。


    马斯克亲自表示，他认为 AI 武器的威胁比核武器大得多。一旦致命 AI 武器被开发出来，它们就有可能落入压迫性国家或恐怖分子手中。这被比作打开了潘多拉魔盒。


    ## 3. 人工智能可能不符合我们的目标


    物理学家史蒂芬·霍金从不畏惧表达他对人工超级智能生存威胁的看法。他和许多前人一样，认为一旦 AI 系统比其创造者更聪明，它可能会决定其目标与人类不同。正如霍金所言，这可能“预示着人类种族的终结”。霍金恳请业内人士不要盲目加速
    AI 研究步伐，而是谨慎前行，确保在每一步都采取了充分的安全措施。如果不这样做，就无法保证 AI 系统会遵循我们的生活方式。


    同时，霍金也认识到这种 AI 为人类造福的巨大潜力。对他来说，如果超级智能真从通用智能中涌现，那将是成败攸关的时刻。理想场景是这种实体决定与我们共事。实现这一目标的唯一途径是引入保障措施，并为最坏的情况做好准备。


    ## 4. 我们不知道如何控制人工智能


    如果事态发展到最坏地步，诞生了一台人工通用智能机器，毫无疑问它将开始修改自己的代码以变得更聪明。毕竟，如果智力相当的人类能创造它，为什么它不能自我修改？史蒂芬·霍金和比尔·盖茨都理解，一旦超级智能出现，其带来的威胁将是灾难性的。


    比尔·盖茨在 Reddit 问答中写道，他赞同霍金和马斯克言论背后的那种警世思维。盖茨说道：“我不理解为什么人们不担心。”不过，他接着补充说，他坚信科技公司在处理通用智能时会极其谨慎，人工通用智能系统失控的可能性不大。他继续表示，人类将驾驭通用智能的力量，而不是被其毁灭。


    其他人，如史蒂芬·霍金，则没那么乐观。霍金认为，超级智能系统不可能长期被遏制。也就是说——我们根本不知道如何控制那级别的智能。这可以理解为：人类将无法遏制超级智能；也可以理解为：人类目前不知道超级智能将源于何种系统，因此也不知如何遏制它们。但如果知道了，通过精心设计，系统是有可能被遏制的。


    埃隆·马斯克最近将超级智能 AI 称为“不朽的独裁者”。很难想象这样的系统会拥有何种力量，尤其是如果没有保障措施限制该系统访问金融网络、武器系统和电网时。


    ## 5. 人工智能将加剧不平等


    史蒂芬·霍金曾指出，科技的当前趋势正在驱动“日益加剧的不平等”。这意味着，在财富和技术投资高度集中的地方存在的同时，也存在贫困、缺乏教育和经济流动性的地方。无论
    AI 是通用智能、弱智能，还是介于两者之间，其进步只会加速这种分化。如果缺乏针对 AI 产品监管和职场自动化使用的政策，这一点尤其真实。


    包括埃隆·马斯克在内的许多人假设，智能进化的下一次飞跃不会来自纯机器，而是来自计算机、AI 和人类的共生。这引发了关于财富集中伦理和通过商业产品增强智能的无尽伦理追问。当这项技术首次问世时，富人将获得即时接入，而贫困人口将呈指数级落后。


    埃隆·马斯克已经认为，拥有智能手机的任何人都是赛博格。智能手机通过与网络的直接连接，开辟了提升个人智力的诸多途径。未来，这些设备直接整合进人体是可想象的。但谁有资格被增强，谁没有？如今智能手机渗透率很高，甚至在发展中国家也是如此，但那是因为智能手机价格近年大幅下降。没有任何迹象表明增强技术也会如此。


    '
