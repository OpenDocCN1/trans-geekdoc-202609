- raw: 'Chapter 13: Why AI is the New Business Degree Once upon a time, the most popular
    college degree was a business degree. If a student didn’t know what field of study
    they wanted to go in but still wanted a decent job, the business degree was the
    way to go. Now, there is an overabundance of students going for their MBAs but
    not enough going after degrees in artificial intelligence. While the business
    world is facing a saturation of business knowledge, artificial intelligence is
    facing a shortage of AI know how. There has never been a time in history where
    getting a computer science degree focused on AI methods has been more lucrative.
    Many top tier schools are now offering new degrees that focus on AI and the gamut
    of robotics rather than the general computing knowledge taught in traditional
    computer science programs. This means that there is market demand, as well as
    plenty of candidates interested in the degrees. It is no wonder why AI is quickly
    changing the face of business in multiple sectors. Technology related jobs are
    increasingly asking that their candidates have a solid grasp of machine learning
    methods along with their other expected duties. Virtually every major AI player
    has already open sourced some of its machine learning libraries so that everyone
    from startups to large corporations has access to create AI programs with little
    upfront costs. Google released TensorFlow in 2015, and it has since become one
    of the most popular repos on GitHub, the definite open source authority today.
    Another open source library called PyTorch is used extensively at Facebook and
    Uber. While smaller players in the AI space benefit from hiring PhDs in the field,
    they already have many of the core infrastructures for creating neural networks
    provided by these free tools. The availability of these tools is further coupled
    with easy access to computational resources provided by cloud providers like Amazon
    Web Services and Microsoft Azure. A company no longer has to invest in a high-cost
    machine learning cluster of GPUs when they can simply rent as much processing
    power they need from the cloud. While these services are more expensive in the
    long run, they still make it easier for a company than building machine learning
    infrastructure outright. AI tools allow a business to engage in machine learning
    that before may not have found a use for it. A relatively new trend is to use
    automated chatbot software on their customer-facing web pages for quick and easy
    information retrieval. A customer can ask for rates, available products, and other
    information by simply typing a few text commands. While chatbots are a bit behind
    in terms of realizing their full potential, many consumers are becoming more familiar
    with them. Some companies even hire human agents to fill the chatbot role until
    the technology exists to allow chatbots to perform these duties on their own.
    Another common application of AI technology is to predict customer behavior. The
    focus on analytics is at an all-time high for all types of companies, not just
    retail. Coupled with social media marketing and e-commerce, analytics drives better
    customer decisions for the company over the long run. There has also been a rise
    in purely “AI” focused companies that market a single product or line of products
    that have AI functionality. One of these is called Grammarly, an online service
    that uses AI methods to streamline the writing process. It provides editing for
    simple mistakes, writing pitfalls, and suggesting things the user can say to sound
    more professional. It is essentially a writing tutor that the user can take with
    them wherever they go. Yet another company called Stick-Fix uses AI to recommend
    clothing options to its customers based on a series of preferences. A user designates
    their price range, enters their measurements, and chooses a style they are going
    for, and the service sends them a box of outfits to try on. Large companies may
    use AI to automate their systems. This is especially true in manufacturing and
    human labor-intensive jobs – though many of these jobs will take years before
    being fully automated. The recycling plant example given earlier in this point
    remains to be solved on a massive scale. Most automation systems first begin by
    aiding line workers rather than replacing them outright. While low-skilled workers
    are at high risk of losing their jobs to automation, the shift will not occur
    overnight. The most likely scenario is that when robotics is first introduced
    into new industries, they will work alongside human employees. This is already
    true in the car manufacturing business. In 2018, Tesla Motors was highly scrutinized
    by business leaders in their attempts to automate large portions of their Model
    3 production. The result was an overestimation of automation capabilities and
    an underestimation of human worker capabilities. The company undershot how many
    Model 3s they could output per month using their heavily automated plant. This
    move was criticized by industry veterans, some of them calling it a “rookie mistake”.
    The state of modern robotics is still behind the power of the mind and especially
    human dexterity. Mimicking the same micro-muscular movements used for manipulating
    tools in the human hand is a non-trivial problem to solve with robots. It will
    likely take decades before a machine matches the human level dexterity of a line
    worker with years of experience in their craft.   However, it isn’t just line
    workers who are in danger of losing their jobs. Advances in AI, especially in
    speech recognition and language processing, threatens to displace the huge call
    center industry with automated systems – though that is also likely to be decades
    in development. Retail is seeing a transformation with automated systems on top
    of the already high online sales numbers. Fewer people are going out to shop.
    At least in places like Japan, retail facing robots are actively being invested
    in. Even those who enjoy a comfy white-collar job have reasons to up their education
    and technical skills. Automated systems for payroll, accounting, and balancing
    the books are under active development. In the future, even programmers will not
    be safe from the AI deluge. Systems are being trained to perform the most mundane
    programming tasks that are often handed to lower-skilled coders. This includes
    software testing and looking for bugs – though, with all things under threat of
    automation, these systems will likely be deployed to work side by side with the
    programmer rather than replacing them altogether. Driverless technology is also
    on the rise. Even as you read this, you can be sure that several companies across
    the world currently have autonomous driving systems on the road somewhere, gathering
    ever more data to strengthen their algorithms. What will likely happen with driverless
    technology is that the ability will come first and policy second. Just because
    driverless cars are proven safe, it doesn’t mean that they will automatically
    be introduced. There are far too many gray areas to see the mass adoption of these
    technologies soon. In 2018, the first-ever driverless car fatality was recorded
    in Tempe, Arizona, by a car owned by Uber. You can be sure that more such fatalities
    will follow until the technology is perfected and here lies the difficulty in
    policymaking. There has never been a time in history when machine ethics have
