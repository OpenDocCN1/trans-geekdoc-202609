    \ bring about world peace and even end poverty. Is there any truth to this? Answer:\
    \ It really depends on whom you ask, as nobody understands what AI will look like\
    \ in 30 or 50 years down the line. Artificial general intelligence that converges\
    \ with humanities goals will be able to perform many tasks better than we do.\
    \ It can then work on these problems without needing to eat or sleep, bringing\
    \ about advances at an exponential rate. Such systems could probably solve the\
    \ most pressing problems today, like climate change and food logistics. Some believe\
    \ they will bring about a new age of abundance where people are not required to\
    \ work anymore. The wealth created by this intelligence will fuel a universal\
    \ basic income. Those are the most optimistic projections. A more level head explanation\
    \ may be a world where general AI is limited to select corporations and governments,\
