    # Chapter 4: Five Reasons Why Industry Experts are Warning Us about AI


    These days, artificial intelligence is synonymous with the high-tech companies
    that dominate the field. AI first started as an academic discipline, but it has
    since sunken its tendrils into the business sector. Many AI researchers have abandoned
    academia altogether and flocked to companies like Alphabet (Google), Amazon, Facebook,
    Microsoft, OpenAI, and so on. These companies are all working on machine learning
    algorithms in various ways and are without a doubt at the forefront of AI research.
    Those with advanced degrees in AI, math, and computer science rather join the
    engineering teams of these companies than stay in academia. And since they are
    at the bleeding edge, it is worth listening to what their leaders have to say.


    Some have been quiet on the AI issue, and others like Amazon’s Bezos have said
    that they aren’t worried too much about potential AI threats. Other visionaries
    like Elon Musk, Bill Gates, and physicist Stephen Hawking have all voiced their
    opinions on the potential dangers of AI. In January 2015, Hawking, Musk, and several
    other AI experts signed an open letter on artificial intelligence research, calling
    for increased scrutiny on the potential effects on society. The twelve-page document
    is entitled “Research Priorities for Robust and Beneficial Artificial Intelligence:
    An Open Letter”. It calls for research on new AI legislation, ethics research,
    privacy, and several other concerns.


    As described in the letter, the potential threats of AI fall into multiple dimensions.
    The good news is that the early stages of AI that we find ourselves in are malleable.
    The future is ours to create, given that the proper time and care go into the
    non-engineering aspects of AI research and policy. The concerns of AI threats
    do not belong to purely existential danger either. It is easy to stand up and
    blow the horn on the impending doom of superintelligence proliferation, but it
    is much less sexy to talk about things like ethics and privacy concerns. The possible
    impacts on the economy are also significant.


    These warnings in themselves are not all doom and gloom. They are in fact invitations
    both for the public and government officials to start thinking hard about this
    coming new world where advances in AI revolutionize life as we know it. While
    there is a fair bit of fear mongering in these regards, it serves the purpose
    of getting people’s attention. After all, today’s news cycles are so swift that
    headlines are practically buried under mountains of click bait and celebrity news.
    That our leaders of industry are actively voicing their opinions on this matter
    means that they are trying to get the attention of the common people and of those
    who work in policy.


    Stephen Hawking, who recently passed away, made sure that the world knew of his
    AI anxieties before kicking the bucket. In an age where artificial general intelligence
    is called “mankind’s final invention”, these concerns are not just empty baseless
    attention seeking statements. They are preemptive appeals for doing things right,
    while there is still time for things to go right. Nobody knows for sure how far
    down the line artificial general intelligence is, but we do know that AI is getting
    better. Even if general AI doesn’t happen, there are plenty of reasons why we
    should be concerned with the advancement of narrow AI. And what if there is some
    middle ground between narrow and the general? It is conceivable that future systems
    become more robust at generalizing problem-solving ability without becoming fully
    aware. Whatever the case, these following concerns are but a few voiced by industry
    leaders today.


    Remember: the people making these statements are some of the most intelligent,
    forward-thinking individuals in our societies. Not only that but they have all
    been closely following the progress of computer science and AI research. For many
    of them, it is their job to know. Many of their concerns are not new, but they
    certainly have brought AI disaster scenarios into the mainstream.


    ## 1. Companies should self-regulate their AI technology


    In a recent interview, current Google CEO Sundar Pichai said that fears of AI
    are “very legitimate.” Pichai maintained an optimistic attitude, saying that major
    tech companies are required to set ethical guidelines and other safety measures
    when deploying AI systems. This comes only months after a high-profile employee
    protest at Google over the selling of artificial intelligence technology to the
    Pentagon. The deal has since been called off. The hope is that major tech companies
    can put systems in place that minimize the potential negative impact of their
    technologies – though just because a company says they are going to do so is probably
    not enough.


    Pichai believes that these companies will be able to self-regulate. This is consistent
    with the Google AI principles that were published in June of 2018. A few of the
    points outlined in the online document are that AI technology should be socially
    beneficial and extensively tested. Also included in the document are the things
    that Google will not do with its AI technology. This includes not pursuing the
    use of AI towards surveillance, weapons, or anything that violates international
    law.


    Sundar Pichai has been CEO of Google since 2015, and the company has seen many
    controversies since then. This includes the aforementioned Pentagon AI deal and
    a search engine with censored content called Dragonfly being in development for
    the Chinese market. It is interesting to note that the company used to include
    the motto “Don’t be evil” in their code of conduct preface. It has since been
    moved into the closing remark, but it still reads “And remember… don’t be evil,
    and if you see something that you think isn’t right – speak up!”


    ## 2. Weaponized AI may start a global arms race


    Elon Musk, the founder of Tesla Motors and the OpenAI initiative, has openly been
    against the weaponization of AI. Artificial Intelligence not only has the potential
    to create devastating weapons but also trigger a global arms race between nations,
    each trying to pin the smartest systems against the other. Musk believes that
    it is inevitable that AI will be used as a weapon but that it shouldn’t be. He,
    along with other industry leaders, signed yet another petition, this one aimed
    at the UN Convention on Conventional Weapons calling for the banning of autonomous
    weapons with AI capabilities. The outright creation of these weapons should be
    regulated like any other unconventional weapon of war.


    Musk said it himself that he believes the threat of AI weapons to be much worse
    than that of nukes. As soon as lethal AI weapons are developed, they already have
    the potential to fall to the hands of oppressive states or terrorists. It has
    been compared to the opening of Pandora’s box.


    ## 3. Artificial intelligence may not align with our goals


    Physicist Stephen Hawking was not afraid to voice his opinions on the existential
    threat of artificial superintelligence. He, like many others before him, believed
    that once an AI system became smarter than its creators, it may decide that its
    goals are different from that of mankind. This could, as Hawking said, “spell
    the end of the human race.” Instead of blindly accelerating the pace of AI research,
    Hawking implored those in the industry to move forward carefully, ensuring that
    adequate safety measures were put into place at every step of the process. If
    they don’t do this, then there is no guarantee that the AI system would comply
    with our way of life.


    At the same time, Hawking recognized the potential for such an AI to do enormous
    good for the human race. For him, it is a make it or break it scenario should
    superintelligence ever emerge from general intelligence. The ideal scenario would
    be where such an entity decides to work alongside us. The only way to achieve
    that goal is to introduce safeguards and prepare for the worst-case scenarios.


    ## 4. We don’t know how to control artificial intelligence


    Should push come to shove and an artificial general intelligence machine is created,
    there is little doubt that the machine will begin modifying its own code to become
    even smarter. After all, if beings of equal intelligence like humans created it,
    why couldn’t it alter itself? Stephen Hawking and Bill Gates understand that the
    threat from superintelligence is catastrophic, should superintelligence ever emerge.


    Bill Gates wrote in a Reddit AMA that he aligned himself with the same alarmist
    thinking behind the rhetoric of Hawking and Musk. As Gates put it, “I don’t understand
    how people aren’t concerned.” Though, he did go on to add that he firmly believes
    that technology companies will be extremely careful when working with general
    intelligence and that it is unlikely an artificially general intelligent system
    is out of our control. He goes on to say that humanity will harness the power
    of general intelligence instead of being destroyed by it.


    Others, like Stephen Hawking, aren’t so sure. Hawking believed that a super intelligent
    system would not be capable of being contained for long. That is to say – we simply
    don’t know how to control that level of intelligence. This can either be interpreted
    to say that humans will not be able to contain superintelligence or that humans
    do not currently know what type of systems superintelligence will stem from, and
    hence, how to contain them. But if they did know, it is plausible that with careful
    engineering the system could be contained.


    Elon Musk recently referred to superintelligent AI as an “immortal dictator.”
    It is difficult to imagine what kind of power such a system will have, especially
    if there are no safeguards on how that system can access financial networks, weapons
    systems, and the power grid.


    ## 5. Artificial intelligence will increase inequality


    Stephen Hawking was the one who observed that the current trend in technology
    was one that drives “ever-increasing inequality.” Meaning that while there are
    highly concentrated places of wealth and technology investment, there are also
    places that are destitute, lacking in education and economic mobility. The advancement
    of AI, whether generally intelligent, narrowly intelligent, or somewhere in between
    will only accelerate the division. This is especially true if there aren’t any
    policies in place for the regulation of AI products and the use of automation
    in the workplace.


    It has been hypothesized by many, including Elon Musk, that the next leap in intelligence
    evolution will not come from pure machines but from a symbiosis between computers,
    AI, and humans. This raises an endless stream of questions about the ethics of
    wealth concentration and intelligence boosting through commercial products. When
    this tech is first devised, it will be the rich who gets immediate access, with
    poorer populations falling exponentially behind.


    Elon Musk already believes that anyone with a smartphone is a cyborg. The smartphone
    opens so many avenues of increasing one’s intelligence through a direct connection
    with the Web. In the future, it is conceivable that these devices will be directly
    integrated into the human being. But who gets to be augmented and who doesn’t?
    Today smartphone penetration is high even in developing countries, but that’s
    because the price of smartphones has fallen drastically in recent years. Nothing
    says that the same will happen with augmentation technology.

