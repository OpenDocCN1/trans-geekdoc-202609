    # Chapter 14: AI FAQ


    ## Question: Does machine learning have limits?


    ### Answer:

    Machine learning certainly has its limits. Even when advanced techniques like
    deep learning are used, these systems are limited by their data and feature selection.
    Deep learning is a little ahead of that curve because features can be selected
    automatically. However, machine learning can only be applied to the five general
    problems discussed in Chapter 6. If a problem lies outside of that problem space,
    then current machine learning will never be adequate for answering it. Simply
    throwing more data will be useless if machine learning doesn''t align with the
    problem. Fortunately, or unfortunately, we haven''t had machine learning robot
    legislators anytime soon.


    ## Question: How will AI be used in the military?


    ### Answer:

    The US Pentagon has increasingly shown interest in the term "algorithmic warfare".
    That is the application of machine learning methods to the battlefield. It will
    most likely be used for target selection and prediction of enemy movements. Autonomous
    systems with "kill decision" capabilities will no doubt be developed from these
    general applications – though as previously mentioned, there is a huge backlash
    against the militarization of AI by the research community. These weapons may
    or may not gain unconventional status by the international community somewhere
    down the line. Even if they do, major powers will still pursue their creation.


    Another possible application of AI will be towards cyberwarfare, the infiltration
    of nations through subterfuge, and the targeting of autonomous weapon systems
    of enemy states. AI algorithms will only add potency to cyberattacks by state
    actors, with AI systems possibly taking over enemy drones and uncrewed gun platforms.


    Finally, there is the looming threat of facial recognition used to identify targets.
    It would not be out of the ordinary to suppose drone attacks in the future will
    be targeted at domestic actors. The drone strike in Yemen first sent shockwaves
    through the international community because it affirmed its right to strike at
    targets over foreign soil. We have yet to see such a strike inside the country.


    ## Question: Should I be worried about losing my job?


    ### Answer:

    The short answer is no. Unless you belong to a certain market vertical where automation
    has already phased out many jobs, you are probably safe for the next ten years
    or so. If you are in a profession that is actively an area of AI research like
    the driving industry, you are still protected by the buffer zone called regulation.
    If you take your job seriously and you belong to these industries, it will be
    worth staying up-to-date with current technological advances and especially regulations.


    The first introduction of automation technologies always aids the worker before
    phasing them out completely. Truck drivers already benefit from cruise control,
    for example. Driverless trucks may still need operators on board to oversee functionality
    and extreme edge cases the computer cannot resolve. What happens if a crazy person
    jumps in front of the truck to mess with it? They are more likely to do this if
    the truck is completely uncrewed. The same goes for potential hacking scenarios.
    Thankfully for you, driverless cars are a regulatory nightmare and probably won''t
    see a mass adoption for a few decades.


    ## Question: I''ve heard that AI can drastically change the world, bring about
    world peace and even end poverty. Is there any truth to this?


    ### Answer:

    It really depends on whom you ask, as nobody understands what AI will look like
    in 30 or 50 years down the line. Artificial general intelligence that converges
    with humanities goals will be able to perform many tasks better than we do. It
    can then work on these problems without needing to eat or sleep, bringing about
    advances at an exponential rate. Such systems could probably solve the most pressing
    problems today, like climate change and food logistics. Some believe they will
    bring about a new age of abundance where people are not required to work anymore.
    The wealth created by this intelligence will fuel a universal basic income. Those
    are the most optimistic projections.


    A more level-headed explanation may be a world where general AI is limited to
    select corporations and governments, further contributing to wealth inequality.
    Still, another practical explanation is that general AI is a fad idea that will
    never see reality.


    ## Question: How worried should I be about AI in general?


    ### Answer:

    For the average person, there is little to worry about. Most applications of machine
    learning are completely benign. There are some privacy and ethical concerns, but
    then again, most people will not be affected by them. Even if the military adopts
    these weapon systems, there is an asymptotic risk that they will be used against
    you. Which is to say, virtually zero.


    Losing a job may be a concern, in which case you have a long head start to think
    about what other industry you can switch into. Remember for every terrible application
    of the technology there is a good potential benefit to humankind. Imagine a world
    where graphics content is removed from family websites like Facebook. Imagine
    a world where driving is as safe as flying a plane, where young drivers are not
    at an increased risk for fatalities. Imagine a world where market inefficiencies
    are smoothed out, leading to an increase in the economy. Imagine a world where
    cancer is no longer a major killer due to early detection and advanced drug discovery.
    Imagine a world where the elderly live longer and are cared for with the dignity
    and respect that they deserve, no longer having to worry about abusive caretakers
    or the embarrassment of loss of autonomy.


    ## Question: If general AI is discovered and it does go bad, what can humans do?


    ### Answer:

    Like with most intractable scenarios, prevention is the cure. Trust that companies
    are doing the right thing to ensure that their systems do not run off course.
    In the future, AI legislation will be a common topic of debate. If you are not
    currently a voter, you may reconsider when the fate of humanity is at stake.


    There is a striking hypothesis about the creation of general AI that posits that
    the sooner it is discovered, the less of an existential threat it will be for
    humanity. This is because the longer it takes, the better technology and systems
    it will have at its disposal. Imagine if nanotechnology 3D printing machines are
    in active use when the general AI comes online. If it were to go rogue, it could
    very quickly begin transforming the face of the Earth into a massive computer.


    # Conclusion


    Thank you for making it through to the end of *Artificial Intelligence: What You
    Need to Know About Machine Learning, Robotics, Deep Learning, Recommender Systems,
    The Internet of Things, Neural Networks, Reinforcement Learning, and Our Future*.
    It should have given you a better understanding of AI. The hope is that you can
    understand internet headlines that talk about AI without feeling completely clueless.
    The knowledge contained in this book should have been enough for that end, and
    to encourage making your own conclusions.


    The field of AI is vast and ever-changing. Many methods of AI like genetic algorithms,
    statistical inference, and stochastic processes were not covered in this book,
    but there are countless resources out there that do. Additionally, you can find
    a complete history of AI on the Wikipedia page with current developments as well.


    If you wish to pursue artificial intelligence as a course of study or even as
    a career, be prepared for lots of math and computer programming. Finally, if you
    found this book useful in any way, a review on Amazon is always appreciated!

    '
