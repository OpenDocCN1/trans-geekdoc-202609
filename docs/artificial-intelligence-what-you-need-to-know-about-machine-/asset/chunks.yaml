    of the neural network goes down. Another concept called the learning rate is a
    measure of how quickly a gradient descent should go down. A higher learning rate
    means that the descent may offshoot the local minimum by a lot, and a lower learning
    rate means that the descent will eventually reach the local minimum, but it will
    come at the cost of time and performance. Note that arriving at the best local
    minimum is synonymous with the system achieving the best accuracy. A higher learning
    rate, then, can lead to inaccurate results. A good approach is to try to find
    a rate somewhere in the middle between fast and slow. Backpropagation is simply
    finding the error rate, loss function or cost function through gradient descent
    and applying it to the weights of artificial neurons in the network. In simpler
    terms, backpropagation is a mechanism that takes an error rate and modifies the
    program to learn from it. When a handwriting recognizing program classifies a
