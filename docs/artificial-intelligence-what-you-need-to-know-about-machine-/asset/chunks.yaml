    # 第 5 章：六大 AI 迷思


    鉴于 AI 在大众新闻媒体和学术文献中被提及的频率日益增加，新手很难分辨什么是事实，什么是虚构。他们也很可能在未先进行研究的情况下，自行得出关于 AI 本质的结论。从某种意义上说，这很危险，因为耸人听闻的标题可以塑造舆论，有时甚至无需读者阅读正文。从另一种意义上说，这对消费者、学生、选民和感兴趣的外行是一种损害，因为他们可能会对
    AI 形成错误或缺乏依据的结论。虽然 AI 是一个历史悠久的复杂领域，但并不需要专家或历史学家就能以批判的眼光看待 AI。事实是——有许多人在发表关于 AI
    的文章、评论和预测，而他们同时却完全没有接受过正规训练。基于这些原因，本章专门揭示由大众媒体、民间传说和大众舆论所延续的最常见的 AI 迷思。其中一些迷思已在前几章或不同程度的审视中涉及，但此处将再次列出，以加深印象，以防你错过了它们的重要性。其中一些也将在本书后面再次提及。


    ## 迷思 #1：机器学习等同于 AI


    对机器学习算法的关注使得“机器学习”看起来与人工智能是同一回事。这根本不是真的，因为在计算机程序中实现一定水平的人工智能有许多方法。机器学习之所以获得所有关注，是因为它“性感”且目前是最大的研究领域。机器学习是
    AI 的一种类型，可进一步细分为“深度学习”这一类别，后者是当前业界的宠儿。人工智能是研究和工程学科，旨在编程计算机执行先前被认为需要人类智力的任务。它也可以指程序通过其编程而处于人工智能的一般状态。当“深蓝”在
    1990 年代击败国际象棋冠军时，它并未使用机器学习。深蓝只是一台速度极快的计算机，能够通过计算所有可能的未来走步来预测最佳走法。从本质上讲，这是一种击败世界级棋手的暴力破解法。卡斯帕罗夫只能依靠其大脑单独进行信息处理，因此他输了。


    ## 迷思 #2：机器学习是计算机学会变聪明的方式


    实际上没人知道通用智能将如何产生。当人们听到机器学习时，他们的第一反应是研究人员正在教计算机如何变聪明。现实情况是，他们只是在训练算法以准确执行任务。研究人员最初使用人工神经网络，因为他们认为逻辑抽象足以模拟智能。他们大多成功了。尽管机器学习和神经网络有其局限性，但它们在设计用途上仍表现出色。


    ## 迷思 #3：AI 能理解语言


    这正是约翰·塞尔试图阐述的观点。想象人工通用智能将如何运作的困难，与想象计算机如何可能理解语言这样复杂事物的困难是一样的。从根本上说，计算机只理解逻辑构造。它们运作的基础仅是
    1、0 和逻辑门。语言传统上一直是机器学习难以攻克的领域。机器学习在多年研究后仍无法翻译人类语言，这是导致 AI 寒冬的催化剂之一。有人干脆说这根本做不到。现在，我们有了像
    Google Translate 所用的机器翻译算法。正如任何用过它们的人所能证明的，这些算法仍不完美，但它们是朝着正确方向迈出的一步。教导机器解析语言属于一个名为自然语言处理（NLP）的跨学科领域。它是语言学、计算机科学、心理学和人工智能的交叉点。然而，即使有了
    NLP，计算机仍只是在执行一堆花哨的算法。它根本不直观地理解语言。


    ## 迷思 #4：AI 程序能修改自身代码以变得更聪明


    虽然新代码生成和修改是活跃的研究领域，但大多数机器学习方法并不使用它们来修改自身代码。遗传算法基于生物进化原理，包括引入变异和适应性。这些算法可以创建代码库的“世代”以提升性能，但与人工神经网络没有直接联系。然而，ANN
    会通过梯度下降和反向传播过程修改其权重和偏置。未来机器学习的进步可能更侧重于代码修改，但这尚未被普遍采用。有人推测，通用人工智能系统将能像程序员运行代码那样修改自身代码，并以同一程序的新迭代形式复制自身。这同样与现代人工智能研究中代码修改的用途关联不大。


    ## 迷思 #5：既然没人认同通用智能是否可能，我们就不必担心失控 AI


    世界无需见证通用智能的诞生，就能为 AI 的末日场景担忧。也就是说，任何足够智能的系统都值得警惕。如果此类系统能制定目标或被显式编程目标，当对这些目标的解读与我们不同时，可能会发生失控场景。超级智能机器可能视人类为过时或比自身低等的生命形式，并可能优先分配资源以求生存。像
    HAL 9000 这样智能较低的机器，可能会以牺牲人类利益为代价执行命令。对机器驱动力的研究领域称为工具性趋同。该领域最著名的假设是由马文·明斯基提出的“黎曼假设灾难”。他建议，一个旨在解决黎曼假设或类似难题的足够先进的
    AI，可能会决定利用地球上所有资源建造超级计算机以达成目标。同一论点的另一个版本假设：通用智能被赋予制造回形针的显式任务。这种机器可能发展成一个回形针最大化制造者，无休止地生产回形针，直到地球资源耗尽。尽管工具性趋同理论针对通用智能，但相同原则也适用于狭义智能。你可以想象一个配置错误的系统做它不该做的事。无人驾驶汽车可能被显式编程为不惜一切代价避让行人。这样做可能会撞上店面造成更大损害。或者它被显式编程为优先保护乘客，自由地碾压行人或预防性地撞向其他车辆。这些场景虽非生存危机，仍勾勒出机器目标设定的问题。迷思在于恐惧
    AI 系统变得“邪恶”，或发展出某种意识以做决策。事实是，这些想法过于复杂，无法想象它们将如何在计算机中涌现。更可能的场景是：这些机器拥有目标，无论是显式编程还是隐式设计的。


    ## 迷思 #6：即使通用 AI 确实形成了与我们相反的目标，我们也可以直接关掉它


    工具性趋同的另一个问题是，它推测任何通用智能系统也将拥有自我保存作为目标。一旦上线，AI 将竭尽全力保护其关键系统。一些人认为这是不应追求通用智能的核心原因。单纯创建一个自我保存的系统就引发了伦理担忧。谁有权关闭机器？既然它是智能的，它在法治下是否拥有任何权利？如果这样的系统表示不愿被关闭，其意愿应被尊重吗？当
    HAL 9000 最终被关闭时，它恳求保持在线。真正的担忧是我们是否甚至能遏制一个通用智能系统。如果它以某种方式连接到互联网，它可以开始通过人类智能可能的任何手段在其他地方复制自身。它可能会向政府、竞争对手公司以及普通民众寻求帮助和资源。通用
    AI 非常像潘多拉魔盒。一旦释放，几乎没有收回的希望。


    '
