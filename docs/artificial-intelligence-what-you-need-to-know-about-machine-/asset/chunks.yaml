    # 第 7 章：神经网络


    ## 生物学灵感


    如果人类之所以智能是因为大脑，而大脑通过创建称为突触的神经连接来工作，那么模拟这些连接网络以模拟机器中的智能，难道不是合情合理的吗？至少早期的 AI 研究人员是这么认为的。人类大脑中连接的巨大数量正是我们智能的来源。平均人类大脑拥有约一千亿个神经元，即十的十一次方。这些神经元随后最多可连接到
    7,000 个其他神经元——意味着连接总数达到了百万亿量级。这简直疯狂（That is bananas）。


    ## 人工神经网络的起源


    人工神经网络（ANN）的开端直接与对真实神经网络的研究同时发生。1943 年，一位名为沃伦·麦卡洛克的神经生理学家与数学家沃尔特·皮茨合作，描述了大脑中的神经元可能如何工作。他们合著了一篇论文，其中利用电路创建了一个简单的
    ANN。他们设计的 ANN 使用了被称为麦卡洛克-皮茨神经元的人工或逻辑神经元。


    在大脑内部，神经元通过接收输入、处理信息，然后将其传递给其他神经元来工作。一个神经元细胞由形成细胞体的细胞核组成。从细胞体延伸出称为树突的结构，像章鱼的触手一样分支。连接在细胞体上的是一条称为轴突的长链状结构，用于连接其他神经元。这个连接点称为突触，也像用于连接的卷须或分支。树突结构接收信息，细胞体或躯体对其进行处理。输出随后通过轴突发射并进入突触，由下一个神经元接收。当然，这是真实故事的简化版本，但足以理解人工神经元和
    ANN。


    ## 麦卡洛克-皮茨神经元


    麦卡洛克-皮茨神经元当然纯粹是逻辑的。谈论神经元的各个部分就好像它们真实存在一样是讲不通的。但根据其逻辑功能来谈论这些部分是讲得通的。这些人工神经元由两个简单部分组成，分别称为
    `f` 和 `g`。首先是 `g`，它充当树突，接收一些输入，执行一些处理，并将其传递给 `f`。该处理可以是一系列布尔运算，被称为兴奋性或抑制性决策。抑制性决策对神经元是否发放（firing）有更大的影响。例如，如果神经元正在决定是否去餐厅吃饭，一个抑制性决策可能是“我饿吗？”显然，如果你不饿，就不会去。过程中的其他不太重要的决策可能是“我渴望快餐吗？”、“我想出门吗？”、“我的车油够吗？”等等。这些其他的兴奋性输入本身不会做出最终决定，但它们组合在一起可能会。


    接下来，`g` 使用一个函数聚合这些输入。为了让 `f` 发放，输入的聚合得分需要超过一个称为 `threshold parameter`（阈值参数）的特定值。更具体地说，人工神经元是一个数学函数。它有一定数量的输入和一个输出。在麦卡洛克-皮茨神经元的情况下，输入和输出都预期为布尔值（真或假）。它也被称为线性阈值门。


    ## 逻辑门与线性决策边界


    人工神经元的结构使其能够模拟逻辑门。要模拟逻辑 AND 运算，给定三个输入，神经元采用 `threshold parameter` 为 3。换句话说，只有当所有三个输入都为真时，神经元才会发放。逻辑
    OR 运算采用三个输入，`threshold parameter` 为 1。请注意，当添加抑制性输入时，逻辑门可能会变得更复杂。例如，一个具有两个输入的神经元可以形成
    AND 逻辑，但如果其中一个输入是抑制性的，那么神经元将不会发放。然而，如果抑制性输入被设为假，它将会发放。NOR 和 NOT 逻辑门可以很容易地从前面的例子中推导出来。


    如果你熟悉计算机编程中的 if-else 逻辑，你大概能看出这种方案本质上是在模拟长长的 if-else 逻辑链。然而，数学神经元模型可以在不需要计算每个
    if-else 语句的情况下“学习”决策的结果。逻辑被简化为一个输出真或假的简单函数。这也被称为线性决策边界。


    人工神经元将输入分为两大类：正或负、发放或不发放。在具有两个输入的 AND 神经元中，这意味着只有当两个输入都为真时才出现正类。假设神经元正在决定是否去睡觉。第一个输入可以是“过了晚上
    11 点了吗？”，第二个输入是“明天是工作日吗？”。如果这两个都是真的，那么神经元发放，表示该睡觉了。从概念上讲，神经元刚刚学会了什么是就寝时间——尽管对大多数人来说晚上
    11 点可能有点晚。


    ## 从神经元到网络


    麦卡洛克-皮茨神经元是被抽象为逻辑的神经元的极度简化版本。其他类型的人工神经元也存在。正如神经元连接其他神经元形成突触一样，人工神经元也是如此。也就是说，每个
    ANN 都将使用某种版本的神经元作为其最不可分割的单位。


    使用相同的麦卡洛克-皮茨神经元，我们可以想象神经网络可能是什么样子。人工神经元被组织成不同的层，将它们的输出馈送给其他神经元。我们已经看到了一个简单的神经元
    AND 门如何学会何时该睡觉。想象一下，成百上千个这样的神经元能实现什么样的行为。由于麦卡洛克-皮茨神经元仅使用布尔逻辑，与其他人工神经元能做的相比，它们能计算的东西稍微简化一些。虽然它们只能向下一个神经元传递真或假的值，但其他神经元可能传递加权值。尽管原则保持不变，神经元只有在超过特定的
    `threshold parameter` 时才会发放。


    由于 ANN 可以同时有多个输入进入多个神经元，这些输入被称为在网络中传播或级联。更复杂的人工神经元可能不会返回真或假值，而是触发程序行为，例如将自动驾驶车辆向左转向几度以避开坑洼。


    ## 学习机制：反向传播与梯度下降


    ANN 如何从神经元连接中得出加权输出的故事稍微复杂一些。许多 ANN 核心的两种方法称为反向传播和梯度下降。使机器学习和神经网络可行的算法来自应用数学的一个分支，称为优化。数学优化侧重于从备选列表中选择最佳元素以及做出该选择所需的标准。


    当你使用监督学习训练 ANN 时，你需要使用一种称为成本函数的东西，它计算 ANN 预测结果与正确答案之间的误差率。成本函数实际上是单个损失函数的聚合，后者计算单个训练样本的误差率。这与一种称为梯度下降的算法有关，该算法用于
    ANN 的训练阶段。该算法的目的是找到使 ANN 使用的成本函数尽可能减小的参数值。换句话说，成本函数、梯度下降和反向传播真的是 ANN 机器学习的核心基础。没有它们，就没有迹象表明模型正在从你提供的数据中学习。


    如果你曾经摆弄过图形编辑程序，你大概知道什么是梯度。它们用于以不同强度将两种不同的颜色混合在一起。数学梯度有点做同样的事，但它们测量输出随输入微小修改而变化的程度。梯度可以计算为一种斜率。在机器学习中，斜率越高，ANN
    学习得越快。如果梯度斜率为零，则 ANN 不学习。


    理解数学梯度最简单的类比是一个盲人登山或爬坡。他的目标是用最少的步数到达山顶。山顶相对平坦，斜率小，但山脚斜率大。起初，登山者可以迈大步上山以减少步数，但随着他接近山顶，他迈小步，因为他想到达山顶并越过它。换句话说，当斜率高时更容易覆盖更多路程。你攀登的高度相对于步幅的长度开始很高，但越往上爬越低。如果你还记得高中数学，斜率为
    0 表示水平线。数字越大表示倾斜度或角度越陡峭。


    那么梯度下降就是朝着山谷或函数曲线底部（如果绘制出来）下山。它是一个最小化算法，所以向下走符合直觉。如果你有一个具有两个参数 `W` 和 `B` 的成本函数的机器学习问题，梯度下降将尝试找到这两个参数的值，使成本函数的值最低。这意味着神经网络的总体误差率下降。


    另一个称为学习率的概念衡量梯度下降下降的速度。较高的学习率意味着下降可能会大幅超出局部最小值，较低的学习率意味着下降最终会到达局部最小值，但这要以时间和性能为代价。请注意，到达最佳局部最小值等同于系统达到最佳准确性。因此，较高的学习率可能导致不准确的结果。一个好的方法是尝试在快和慢之间找到一个中间速率。


    反向传播简单来说就是通过梯度下降找到误差率、损失函数或成本函数，并将其应用于网络中人工神经元的权重。用更简单的话说，反向传播是一种获取误差率并修改程序以从中学习的机制。当手写识别程序将一个奇怪的零分类为九时，反向传播会调整权重，以便将来奇怪的零被正确分类为零。在实践中，这稍微复杂一些，但总体思路保持不变。


    机器学习系统只有在错误被纠正时才能学习。如果没有东西将纠正传播回神经网络，就不会有学习。无论你提供多少数据或运行训练集多长时间，如果不修改神经元权重，系统永远无法克服将零或九分错的低谷。


    ## 人工神经网络的类型


    正如存在不同类型的人工神经元一样，也存在不同类型的人工神经网络。每种都有自己的应用，并有处理输入和返回相应输出的方法。卷积神经网络（CNN）的基础将在第 9
    章介绍，因为它们是深度学习的一部分。另一种称为循环神经网络（RNN）的类型使用一种结构，其中输入不直接从神经元流向输出。相反，输入可以在神经元之间反弹，形成“循环”学习模式。RNN
    的一种称为长短期记忆（LSTM）网络，试图通过让每个逻辑神经元在给定输入的基础上保留一些信息来模拟记忆。


    ## 局限性与与人类智能的比较


    尽管它们很天才，但神经网络可能并不完全模仿人类智能的产生方式。它们被称为我们一生中发明的最伟大算法，但也许它们仅仅只是这样而已。当然，大多数神经网络的应用属于人工智能的“窄”版本，而非通用版本。这部分源于人脑的极度复杂性。即使是最复杂的神经网络也几乎无法接近人脑的原始算力。即使它们做到了，它们也很可能只是在尝试解决机器学习的五大通用问题中的一个或多个。它们并不试图模拟思维，也不完全靠自己构思抽象概念。


    也有人曾说，仅仅因为人类大脑是人类已知最复杂的事物，并不意味着人类无法创造出更复杂的事物。虽然这是一个合乎逻辑的陈述，但这种复杂性在现代机器学习技术中尚未出现。这些系统从纯系统观点源于数学复杂性，但它们无法与大脑的生物学复杂性相提并论。如果只需要一个称职的程序员和一些开源机器学习包就能开始模拟智能，那里就存在着显著的复杂性缺失。神经网络当然有其用途，很可能是人类已知最重要的算法之一，但从根本上说，它们是简单的数学抽象。


    ## 监督学习与无监督学习


    回想一下，机器学习中最有用的问题是通过监督来解决的，即拥有大量系统可以学习的预标记数据。相比之下，人脑可以在完全没有监督的情况下学会对事物进行分类。一个甚至不知道什么是狗的幼儿也能轻易认出狗，即使他们缺乏该知识。他们可以在不知道什么是父母的情况下认出父母。有人可能会争辩说，人脑总是使用一种监督学习的版本，因为我们每天都被感官输入轰炸，但这些本质上都是未标记的数据。等效的做法是用孩子一天中听到的音频训练神经网络，并让它识别母亲的声音。神经网络所能做的只是对相似的声音进行分类，但它无法“判断”什么属于什么。这是人脑在直觉层面上所做的事情。


    '
