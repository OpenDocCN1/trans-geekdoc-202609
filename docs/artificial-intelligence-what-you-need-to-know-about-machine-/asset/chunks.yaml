    # Chapter 7: Neural Networks


    ## The Biological Inspiration


    If humans are intelligent because of their brains, and if brains work by creating
    neural connections called synapses, wouldn’t it make sense to simulate these networks
    of connections in order to simulate intelligence in machines? Or at the very least,
    that is what early AI researchers thought. The sheer volume of connections in
    the human brain is what we owe our intelligence to. The average human brain has
    around one hundred billion neurons or ten to the eleventh power. These neurons
    can then connect to up to 7,000 other neurons – meaning the total number of connections
    is an order of millions of billions of connections. That is bananas.


    ## The Origins of Artificial Neural Networks


    The beginnings of artificial neural networks (ANN) directly coincided with the
    study of real neural networks. In 1943, a neurophysiologist named Warren McCulloch
    teamed up with mathematician Walter Pitts to describe how neurons in the brain
    might work. They co-authored a paper in which they created a simple ANN out of
    electrical circuits. The ANN they designed used artificial or logical neurons
    called the McCulloch-Pitts neuron.


    Inside the brain, a neuron works by receiving inputs, processing the information,
    and then transmitting it to other neurons. A neuron cell is made out of a nucleus
    that forms the cell body. From the cell body, structures called dendrites branch
    out like the arms of an octopus. Attached to the cell body is a long chain-like
    structure called the axon that is used to connect to other neurons. This point
    of connection is called the synapse and also looks like tendrils or branches used
    for connecting. The dendrite structure receives information and the cell body
    or soma processes it. The output then gets fired through the axon and into the
    synapse where the next neuron receives it. This is, of course, a simplified version
    of the true story, but it is enough for understanding artificial neurons and ANNs.


    ## The McCulloch-Pitts Neuron


    The McCulloch-Pitts neuron is, of course, purely logical. It doesn’t make sense
    to talk about parts of a neuron as if they existed in real life. But it does make
    sense to talk about the parts according to their logical function. These artificial
    neurons are made up of two parts simply called `f` and `g`. First is `g`, it acts
    as the dendrite and receives some input, performs some processing, and passes
    it on to `f`. The processing can be a chain of Boolean operations that are said
    to be either excitatory or inhibitory decisions. A decision that is inhibitory
    has a greater effect on the neuron firing or not. For example, if the neuron is
    deciding whether to eat at a restaurant, an inhibitory decision would be something
    like “Am I hungry?” Obviously, if you aren’t hungry, you won’t make the trip.
    Less important decisions in the process may be “Do I crave fast food?”, “Do I
    feel like going out?”, “Does my car have enough gas?” and so on. These other excitatory
    inputs will not make the final decision on their own, but together they might.


    Next, `g` takes these inputs and aggregates them using a function. For `f` to
    fire, the aggregate score of the inputs needs to surpass a certain value called
    the `threshold parameter`. More specifically, an artificial neuron is a mathematical
    function. It has a number of inputs and an output. In the case of McCulloch-Pitts
    neurons, both inputs and outputs are expected to be Boolean values (true or false).
    It is also known as a linear threshold gate.


    ## Logic Gates and Linear Decision Boundaries


    The structure of the artificial neuron allows it to simulate logic gates. To simulate
    a logical AND operation, the neuron takes on a `threshold parameter` of three
    given three inputs. In other words, the neuron only fires if all three inputs
    are true. A logical OR operation takes three inputs, and the `threshold parameter`
    is one. Note that the logic gate can be a little more complex when adding inhibitory
    inputs. For example, a neuron with two inputs can form AND logic, but if one of
    those inputs are inhibitory, then the neuron won’t fire. It will fire, however,
    if the inhibitory input is set to false. The NOR and NOT logical gates can easily
    be derived from the previous examples.


    If you are familiar with if-else logic in computer programming, you can probably
    tell that this scheme is essentially simulating long chains of if-else logic.
    However, the mathematical neuron model can “learn” the outcomes of decisions without
    needing to calculate each if-else statement. The logic is reduced to a simple
    function that outputs either true or false. This is also called linear decision
    boundaries.


    The artificial neuron splits inputs into two broad categories: positive or negative,
    fire or don’t fire. In an AND neuron with two inputs, this means that the only
    positive class happens when both inputs are true. Say that the neuron is deciding
    whether to go to bed. The first input can be “Is it past 11 pm yet?” and the second
    input is “Is tomorrow a workday?”. If both of these are true, then the neuron
    fire signifying it is time for bed. Conceptually speaking, the neuron has just
    learned what bedtime is – though 11 pm may be a little late for most people.


    ## From Neurons to Networks


    The McCulloch-Pitts neuron is an extremely simplified version of a neuron abstracted
    into logic. Other types of artificial neurons also exist. And just like neurons
    connect to others to form synapses, the same can be said for artificial neurons.
    That is, every ANN will use some version of a neuron as their most irreducible
    unit.


    Using the same McCulloch-Pitts neuron, we can imagine what a neural network may
    look like. Artificial neurons are organized into different layers that feed their
    outputs into other neurons. We already saw how one simple neuron AND gate can
    learn when it is time for bed. Imagine what kind of behavior hundreds or thousands
    of these neurons can achieve. Since McCulloch-Pitts neurons use Boolean logic
    only, the things that they can compute is a little simplified compared to what
    other artificial neurons can use. While they can only pass true or false values
    to the next neuron, others may pass weighted values. Though the principles remain
    the same, neurons only fire if a certain `threshold parameter` is passed.


    Since an ANN can have multiple inputs going into multiple neurons at the same
    time, these inputs are said to propagate or cascade down the network. Instead
    of returning a true or false value, more sophisticated artificial neurons may
    trigger program behavior like steering an autonomous vehicle a few degrees to
    the left in order to avoid a pothole.


    ## Learning Mechanisms: Backpropagation and Gradient Descent


    The story of how ANNs derive weighted outputs from neuron connections is a little
    more complicated. Two methods at the heart of many ANNs are called backpropagation
    and gradient descent. The algorithms that make machine learning and neural networks
    viable come from the branch of applied mathematics called optimization. Mathematical
    optimization focuses on the selection of the best element from a list of alternatives
    and the criterion necessary for making that selection.


    When you train an ANN using supervised learning, you need to use something called
    a cost function that calculates the error rate between what the ANN predicted
    and what the correct answer is. The cost function is really the aggregation of
    individual loss functions, which calculate the error rate for single training
    examples. This relates to an algorithm called gradient descent which is used during
    the training phase of an ANN. The algorithm’s purpose is to find the values of
    parameters that reduce the cost function used by the ANN as much as possible.
    In other words, cost functions, gradient descent, and backpropagation are really
    the bread and butter of ANN machine learning. Without them, there is no indication
    that the model is learning from the data you supply it with.


    You probably know what a gradient is if you have ever messed around with a graphics
    editing program. They are used to mesh two different colors together in varying
    degrees of intensity. A mathematical gradient sort of does the same thing, but
    they measure how much outputs change depending on slightly modifying inputs. A
    gradient can be calculated as a sort of slope. In machine learning, the higher
    the slope, the faster an ANN can learn. And if the gradient slope is zero, then
    the ANN doesn’t learn.


    The simplest analogy to understand mathematical gradients is a blind hiker going
    up a mountain or hill. His objective is to reach the summit with the lowest number
    of steps. The peak is relatively flat with a small slope, but the base of the
    mountain has a large slope. At first, the hiker can take longer strides up the
    mountainside to minimize the number of steps, but as he approaches the top, he
    takes smaller strides because he wants to arrive at the summit and go past it.
    In order words, it is easier to cover more ground when the slope is high. The
    amount of height you climb relative to the length of your strides is high, but
    it goes lower the higher you climb. If you may recall high school math, a slope
    of 0 indicates a horizontal line. A higher number indicates a steeper degree or
    angle of tilt.


    A gradient descent then is going down the mountain towards a valley or the bottom
    of the function curve (if it was plotted). It is a minimization algorithm, so
    this makes intuitive sense to go down. If you have a machine learning problem
    with a cost function having two parameters `W` and `B`, gradient descent will
    try to find the values of those two parameters that result in the lowest value
    for the cost function. This means that the overall error rate of the neural network
    goes down.


    Another concept called the learning rate is a measure of how quickly a gradient
    descent should go down. A higher learning rate means that the descent may offshoot
    the local minimum by a lot, and a lower learning rate means that the descent will
    eventually reach the local minimum, but it will come at the cost of time and performance.
    Note that arriving at the best local minimum is synonymous with the system achieving
    the best accuracy. A higher learning rate, then, can lead to inaccurate results.
    A good approach is to try to find a rate somewhere in the middle between fast
    and slow.


    Backpropagation is simply finding the error rate, loss function or cost function
    through gradient descent and applying it to the weights of artificial neurons
    in the network. In simpler terms, backpropagation is a mechanism that takes an
    error rate and modifies the program to learn from it. When a handwriting recognizing
    program classifies a weird looking zero as a nine, backpropagation adjusts the
    weights so that in the future, weird looking zeros are classified correctly as
    zeros. In practice, this is a little more complicated, but the general idea remains
    the same.


    A machine learning system can only learn if mistakes are corrected. Without something
    to propagate corrections into the neural net, there would be no learning. No matter
    how many data you supply or for how long you run your training sets, the system
    would never get over the zero or nine slumps without modifying neuron weights.


    ## Types of Artificial Neural Networks


    Just as there are different types of artificial neurons, there are different types
    of artificial neural networks. Each has their own applications and methods for
    handling inputs and returning their respective outputs. The basics of convolutional
    neural networks (CNN) will be covered in Chapter 9 as they are part of deep learning.
    Another type called recurrent neural networks (RNN) use a structure where inputs
    don’t go directly from neuron to output. Instead, inputs can bounce around neurons
    to form a “recurring” learning pattern. One type of RNN called long short-term
    memory (LSTM) networks try to simulate memories with each logical neuron holding
    on to some piece of information along with the given input.


    ## Limitations and Comparison to Human Intelligence


    Though genius as they are, neural networks probably don’t mimic exactly how intelligence
    comes around in humans. They have been called the greatest algorithms invented
    in our lifetime, but perhaps they are just that and nothing more. Certainly, most
    applications of neural networks belong to the “narrow” version of artificial intelligence
    rather than the general. This in part stems from the sheer complexity of the human
    brain. Even the most complex neural networks hardly approach the raw computing
    power of the human brain. And even if they did, they are likely trying to solve
    one or more of the five general problems of machine learning. They are not trying
    to simulate thought, nor are they formulating abstract ideas all on their own.


    It has also been said that just because the human mind is the most complex thing
    known to man, it doesn’t mean that man cannot create things that are even more
    complex. While this is a logical statement, such complexity has yet to be seen
    in modern machine learning techniques. These systems stem from mathematical complexity
    in a purely systemic view, but they do not compare to the biological complexity
    of the mind. If all it takes is one competent programmer and some open source
    machine learning package to start simulating intelligence, there is a marked absence
    of complexity there. Neural networks certainly have their uses and may very well
    be some of the most important algorithms known to man, but they are, at the very
    core, simple mathematical abstractions.


    ## Supervised vs. Unsupervised Learning


    Recall that the most useful problems in machine learning are solved by supervision,
    having vast quantities of pre-tagged data the system can learn from. The human
    brain, in contrast, can learn to categorize things without any supervision what
    so ever. A young child even not knowing what a dog is can readily identify a dog
    even if they lack that knowledge. They can identify their parents without knowing
    what a parent is. Someone can argue that the human brain always uses a version
    of supervised learning because we get bombarded by sensory inputs daily, but this
    is all essentially untagged data. The equivalent would be to train a neural network
    on audio a child hears over the course of the day and ask it to identify the mother’s
    voice. All the neural network can do is categorize similar sounds, but it cannot
    “tell” what belongs to what. This is something the human brain does at an intuitive
    level.

