    # Chapter 3: The Birth and Death of AI


    ## Early Mathematical Foundations


    Artificial intelligence research coincided with the founding of the computer science
    field. Back then, people were less concerned with creating machines capable of
    human thought and more with creating uses for their early computing machines.
    The mathematical foundations for computer science and by extension artificial
    intelligence have been around for centuries. Boolean algebra was developed by
    George Boole in 1854. It uses the same binary concepts that computers use today
    to represent data, ones and zeroes, true and false. Boolean algebra was still
    preceded by one of the earliest computers called the Difference Engine, the work
    of English mathematician Charles Babbage in 1822. He would go on to design a general-purpose
    computing machine called the analytic engine, a contraption that if built would
    have the equivalent of 1 kilobyte of memory. The subsequent advances in the 19th
    and 20th century on formal logic and mathematics by thinkers like Boole, Russel,
    Whitehead, and Church would create the bedrock for AI programs.


    ## Alan Turing and the Foundations of Computer Science


    Alan Turing is credited with being the father of modern computer science owing
    to his contributions in the field. His most significant contribution was his paper
    *On Computable Numbers, with an application to the Entscheidungsproblem*, which
    some consider having laid the foundation for modern software programs. The paper
    described a theoretical machine that could solve any problem as long as it was
    encoded into paper tape instructions. The so-called Turing machines were analogous
    to computers, and the tape instructions were the programs. He also postulated
    that any Universal Machine could accurately simulate any Turing machine. In other
    words, a computer could run within a computer. This property would become known
    as Turing-completeness, and decades later, people would design digital computers
    that can run inside of the popular Minecraft video game.


    ### The Turing Test


    His contributions to artificial intelligence were contained in another paper titled
    *Computing Machinery and Intelligence*. In it, he postulated a computer powerful
    enough to simulate intelligence. He also devised the now famous "Turing Test"
    to quantify if a computer should be considered intelligent or not. In the test,
    a human is communicating through textual messages with an unknown person who is
    actually a software program. If the software program can respond to the human
    operator''s messages, such that the human operator believes the program to be
    another human, then the program passes the test. This test was originally developed
    by Turing in 1950, decades before artificial intelligence would go mainstream.
    Most people will recognize that the software program in question is a type of
    chatbot, something that has seen a recent resurgence in marketing circles. For
    Turing, all a machine had to do was pass this test to be considered capable of
    thought. The test has no bearing on other measures, like the ability to have self-awareness
    or feel emotions. In other words, a program could pass this test yet still not
    be considered an artificial general intelligence by today''s standards. The criteria
    for intelligence have shifted beyond possessing human-like qualities enough to
    fool a human operator. Now artificial general intelligence concerns a type of
    intelligence that is indistinguishable from a human.


    ### Church-Turing Thesis


    Alan Turing along with Alonzo Church also formulated their Church-Turing thesis,
    a hypothesis that says that any math function a human can perform on natural numbers
    must also be computable by a Turing machine with the correct algorithm. Not only
    that but that the reverse is also true. Any mathematical problem that a human
    can solve must also be solvable by a Turing machine. Generalizing this hypothesis
    essentially means that a computer can think of any abstract mathematical thought
    that a human can, given the right algorithms. It forms a basis for saying that
    computers are just as smart as humans already if solely based off logical computation.
    The difficulty lies in assessing whether all of human intelligence can be reduced
    into logical computation. If so, it is credible that a computer equipped with
    the same algorithms that a human has can reproduce any feat of human intelligence.
    There is a reason to believe that this is not the case though, as the human brain
    processes information differently than a traditional computer. And if you were
    to ask a philosopher like Rene Descartes if the theory held true, he would say
    that Church-Turing conjecture mistakes the human soul for the faculties of the
    brain. That is, that the brain and its functions are purely there for show. It
    is the soul or the mind that controls the brain and every other notion of the
    physical body. Intelligence directly permeates from the mind, a substance that
    is distinct from the body. In that case, it is unlikely that all of the human
    thought is reducible to logical. In other words, a computer that seems to understand
    the language. Next, suppose that the computer has convincingly passed the Turing
    test and fooled a human operator into believing that the computer is also human.
    Here, Searle poses the question of whether the machine truly understands Chinese
    or if it is merely simulating the ability to understand Chinese. To simulate understanding,
    all a machine would have to do is perform the correct algorithms to produce the
    correct output. For it to truly understand Chinese, though, would mean that it
    can process language like we do. This is a distinction between artificial general
    intelligence on the understanding side and narrow intelligence on the simulating
    side. Searle then says to imagine an English-only-speaking person locked inside
    a room with the same algorithms that the original Chinese machine had, but with
    instructions in English. Then the English-speaking person is giving a script of
    Chinese characters through the slit on the door and asked to perform the same
    duties that the Chinese machine does. They look over the English instructions
    for processing the Chinese characters and eventually find the correct output and
    return it under the slit. The person locked in the room can perform these calculations
    because all they need to do is recognize the different symbols, look them up,
    and derive the output. The locked person does not understand a word of Chinese,
    yet using the same algorithms that the machine had, they successfully simulated
    the ability to understand Chinese. The Chinese room says that a computer cannot
    be generally intelligent because all it does is manipulate symbols according to
    a set of instructions. Though it should be noted that the Chinese room only applies
    to digital computers, it does not exclude the possibility of artificial general
    intelligence in other substrates. The argument was originally described in a paper
    called "Minds, Brains, and Programs" published in *Behavioral and Brain Sciences*
    in 1980. AI winter had long been in effect up to that point, and the paper only
    helped to further AI pessimism at the time. However, this is puzzling, as most
    AI researchers in that era were not focused on artificial general intelligence.
    They were focused on applying narrow AI to interesting problems that had many
    useful applications. This is again a failure to differentiate between narrow and
    general AI. Searle''s attack did more damage than it really should have, as it
    has no bearing whatsoever on the creation of narrow AI programs. Even today, the
    amount of research being applied to narrow AI far outweighs the amount of research
    going towards general intelligence. There have since been numerous replies to
    the Chinese Room argument, many of which are just as convincing as the original.

