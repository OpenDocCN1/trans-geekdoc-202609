    viewed the body as a purely mechanical vessel that was driven by the mind, an
    immaterial substance distinct from even the brain. The 18th century also saw the
    creation of the infamous Turk, an automaton whose inventor claimed to be able
    to play chess on its own. It was later revealed to be a hoax, operated by a human,
    but it was nevertheless intriguing. To think that even in the 18th century, people
    were going about creating systems to play chess against human players! This was
    long before IBM’s Deep Blue beat the world chess champion Garry Kasparov in 1996
    and long before AlphaGoZero defeated the Go champion. Amazon’s crowd intelligence
    platform Mechanical Turk is fittingly named after the automaton. Interest with
    mechanical behavior in the 19th century was embodied in the work of E.T.A Hoffman,
    a writer known for creating a feeling of unease in his stories. More specifically,
    the psychologist Sigmund Freud used the term Unheimlich or “uncanny” to describe
    the feeling he felt from reading Hoffman’s writing. The story that is given the
    most attention is Der Sandman or The Sandman in English. It’s a story of a mysterious
    figure from folklore named the Sandman that steals the eyeballs of young children
    to feed his own offspring. A character in the story named Olympia is introduced
    as the daughter of a professor but later revealed to be an automaton – a doll
    of his own creation. Olympia is striking because she is virtually indistinguishable
    from a young woman in the story, so much so that the protagonist falls in love
    with her and proposes marriage. However, just as he is about to propose, he comes
    across the professor fighting over the doll’s lifeless body with his collaborator,
    arguing over who designed the eyelids and who made the clockwork mechanisms that
    power her. The protagonist sees Olympia’s glass eyeballs strewn on the floor and
    goes mad. The automaton is essentially a mannequin with all the likeness of a
    real person – a cruel experiment carried out by the professor and his collaborator.
    The same concept of uncanniness led roboticist Masahiro Mori to coin the term
    “uncanny valley” to describe the emotional response people have to lifelike robots.
    In general, the more photorealistic a robot is, the more uneasy people feel. It’s
    a strange feeling, like seeing a real caricature of life right in front of you,
    the distinction between real and artificial completely blurred. However, the viewer
    nevertheless understands that the thing they see before them is fake. The robotic
    figure then exudes a cold, impersonal atmosphere that makes the hairs of the back
    stand up. The uncanny valley refers to a graphical chart with human likeness on
    the x-axis and familiarity on the y-axis. As human likeness of a robot increases,
    familiarity drops indicated by a distinct downward curve. At the lowest point
    of the curve are totally realistic depictions of people that are lifeless like
    corpses and zombies. These things elicit an uncanny effect because they are familiar,
    but we know that they are unliving. There is a strangeness associated with that
    loss of consciousness that is inadvertently reproduced in a robot that looks like
    a human, but that is also not living. Give this realistic robot a voice and some
    semblance of intelligence, and you get a creepy aberration of the real thing.
    Though normally applied to robots, it is easy to see how the uncanny valley can
    apply to pure artificial intelligence or depictions of it. HAL 9000 is a computer,
    yet it creates a feeling of uncanniness when its logical response to an illogical
    situation results in a feeling of dread. If you saw the movie in theaters when
    it first came out, you could have heard a loud gasp ring out from the audience
    when they realized that HAL was reading the lips of the crew members talking about
    disconnecting it. The imperfection of artificial intelligence and the breakdown
    or malfunction of such systems was characterized in Herman Melville’s Bartleby
    the Scrivener . Bartleby, a Wall Street clerk, has a sudden mental breakdown in
    the middle of his work, merely proclaiming, “I would prefer not to” when asked
    to perform a task. The character repeats this signature phrase over and over again
    to the point that it becomes a robotic drawl. The character exhibits other robotic
    qualities as well, like staring off into space at a brick wall, as if waiting
    for input.   Another popular work that was published around the same time was
    Marry Shelley’s Frankenstein in 1818. The original subtitle of the book was “Or
    The Modern Day Prometheus”, but this has been dropped in most recent publications
    of the book. In this timeless classic, Shelley explores the ethics of creating
    artificial beings, how they may act, and what humans can expect. The story takes
    on a humanitarian perspective, as Frankenstein’s monster develops feelings of
    alienation after realizing that he is of a different kind. After his creator rejects
    to create a female version of himself, the creature murders his fiancée, making
    things even. The creature laments that as a living being with sentience, he has
    the right to happiness, a right that his creator has deprived him off. It is interesting
    to note that even in this early interpretation of AI, Frankenstein is wary of
    the two artificial beings breeding and creating an unstoppable race that subjugates
    humanity under their evil. However, besides the killing of the fiancée as revenge,
    the creature is never patently evil. It is only because the creature has a menacing
    appearance that he is branded as such. The fears of the two creatures breeding
    are consistent with the fear of an intelligence explosion, as any sufficiently
    intelligent artificial being could create clones of itself if it so wished. It
    is the mechanical and computational aspects of artificial intelligence that scares
    people. It is hard to say whether modern doomsday scenarios rooted in AI come
    from this fear or if they stem from the recent advances in machine learning. Whatever
    the case, it’s nothing too new. Humanity is still continuing its never-ending
    quest to create artificial minds as it always has been since the very beginning.
    But even with all the computing power available in the world, we still do not
    know how these artificial minds will come about. '
