    # Artificial Intelligence: What You Need to Know About Machine Learning, Robotics,
    Deep Learning, Recommender Systems, Internet of Things, Neural Networks, Reinforcement
    Learning, and Our Future


    ![Cover](image8.jpg)


    © Copyright 2019 All Rights Reserved. No part of this book may be reproduced in
    any form without permission in writing from the author. Reviewers may quote brief
    passages in reviews.


    **Disclaimer:** No part of this publication may be reproduced or transmitted in
    any form or by any means, mechanical or electronic, including photocopying or
    recording, or by any information storage and retrieval system, or transmitted
    by email without permission in writing from the publisher. While all attempts
    have been made to verify the information provided in this publication, neither
    the author nor the publisher assumes any responsibility for errors, omissions
    or contrary interpretations of the subject matter herein. This book is for entertainment
    purposes only. The views expressed are those of the author alone, and should not
    be taken as expert instruction or commands. The reader is responsible for his
    or her own actions. Adherence to all applicable laws and regulations, including
    international, federal, state and local laws governing professional licensing,
    business practices, advertising and all other aspects of doing business in the
    US, Canada, UK or any other jurisdiction is the sole responsibility of the purchaser
    or reader. Neither the author nor the publisher assumes any responsibility or
    liability whatsoever on the behalf of the purchaser or reader of these materials.
    Any perceived slight of any individual or organization is purely unintentional.


    ## Table of Contents


    - [Introduction](#part0004.xhtml)

    - [Chapter 1: Artificial Intelligence, the Big Picture](#part0005.xhtml)

    - [Chapter 2: Artificial Beings, a Brief History of the Human Psyche](#part0006.xhtml)

    - [Chapter 3: The Birth and Death of AI](#part0007.xhtml)

    - [Chapter 4: Five Reasons Why Industry Experts are Warning Us about AI](#part0008.xhtml)

    - [Chapter 5: Top Six AI Myths](#part0009.xhtml)

    - [Chapter 6: Machine Learning](#part0010.xhtml)

    - [Chapter 7: Neural Networks](#part0011.xhtml)

    - [Chapter 8: Reinforcement Learning](#part0012.xhtml)

    - [Chapter 9: Deep Learning](#part0013.xhtml)

    - [Chapter 10: Recommender Systems](#part0014.xhtml)

    - [Chapter 11: Robotics](#part0015.xhtml)

    - [Chapter 12: The Internet of Things](#part0016.xhtml)

    - [Chapter 13: Why AI is the New Business Degree](#part0017.xhtml)

    - [Chapter 14: AI FAQ](#part0018.xhtml)

    - [Conclusion](#part0019.xhtml)


    ## Introduction


    We live in an interesting time with technological advances happening every day
    behind the scenes in universities and technology companies all across the globe.
    This book is designed to teach you the absolute basics of artificial intelligence
    (AI) and how it is used today. It has been written assuming that the reader has
    zero experience in the field of AI, computer science, or math. As such, many of
    the concepts are easy to follow and understand. We welcome you on your exciting
    journey to learn the ins and outs of artificial intelligence.


    **Chapter 1** will provide a basic overview of what artificial intelligence is,
    the different types and how machines can be said to "think".


    **Chapter 2** is a short introduction to artificial beings in works of fiction
    and antiquity. It demonstrates how humans were thinking about artificial intelligence
    long before the first computers.


    **Chapter 3** goes a step further by giving a general history of computer science
    and AI.


    **Chapter 4** introduces you to some of the things that industry leaders have
    been saying about AI. You will learn what the experts are warning us about AI
    research.


    **Chapter 5** answers some of the top myths concerning AI. Too often, people take
    these myths at face value because they think it is too complicated to understand,
    but that simply shouldn''t be the case.


    **Chapter 6** introduces machine learning, its methods, and what it is being used
    for.


    **Chapter 7** discusses the use of artificial neural networks, one of the principal
    building blocks for machine learning.


    **Chapter 8** introduces the concept of reinforcement learning.


    **Chapter 9** talks about deep learning, the industry standard for machine learning.


    **Chapter 10** explains the recommender systems used by companies like Netflix.


    **Chapter 11** introduces robotics and how it relates to AI.


    **Chapter 12** is all about the coming of the internet of things and why it is
    important to AI research.


    **Chapter 13** introduces the idea that AI is the new business degree.


    To wrap up, **Chapter 14** offers brief FAQs that are most commonly asked about
    AI.

    '
