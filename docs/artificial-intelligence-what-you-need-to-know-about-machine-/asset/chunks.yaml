    light through individual cortical neurons. Each of these neurons corresponds to
    receptive fields that overlap in the retina. CNNs work in a similar fashion. They
    consist of an input and output layer plus additional hidden layers in between.
    The hidden layers use something called convolution to process their inputs. Put
    simply – convolution is using two distinct functions to create a third function
    that expresses how the first one affects the second. Convolution is used to group
    pixels together from the beginning so that the net already has an idea of how
    the big picture fits together. It is easier to form a hierarchical structure of
