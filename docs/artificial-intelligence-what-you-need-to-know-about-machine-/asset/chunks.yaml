    # Chapter 5: Top Six AI Myths


    Given the increasing frequency of AI being talked about in popular news media
    as well as in academic sources, it is difficult for a novice to separate what
    is fact and fiction. They are also likely to form their own conclusions about
    the nature of AI without first doing their research. This is in one sense dangerous
    because sensationalist headlines can morph public opinion, sometimes without a
    person having even read the article. It is in another sense doing a disservice
    to the consumer, the student, the voter, and the interested layperson because
    they may form faulty or misinformed conclusions about AI. While AI is a complex
    field with a rich history, it doesn''t take an expert or a historian to approach
    AI with a critical eye. The truth is – there are many people making publications
    on AI, commenting and forming predictions, who at the same time have zero formal
    training in it. For these reasons, this chapter is dedicated to the most common
    AI myths perpetuated by mass media, folklore, and popular opinion. Some of these
    myths have already been covered in previous chapters or in various degrees of
    scrutiny, but they will be laid out here to bring the message home in case you
    missed their importance. Some of them will also be touched upon later in the book.


    ## Myth #1: Machine learning is the same thing as AI


    The focus on machine learning algorithms make it seem like "machine learning"
    is the same thing as artificial intelligence. This is simply not true, as there
    are many methods to achieve some level of artificial intelligence in computer
    programs. Machine learning gets all the attention because it is "sexy" and currently
    the biggest area of research. Machine learning is a type of AI that can further
    be broken down into the category of "deep learning", the current industry favorite.
    Artificial intelligence is the study and engineering discipline of programming
    computers to perform tasks previously thought required human intelligence. It
    can also refer to the general state of a program being artificially intelligent
    through its programming. When Deep Blue defeated the chess champion in the 1990s,
