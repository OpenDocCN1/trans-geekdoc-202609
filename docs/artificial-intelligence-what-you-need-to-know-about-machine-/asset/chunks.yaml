    # 第 2 章：人造生物，人类心理简史


    ## 古代与神话


    信不信由你，人工智能的历史可追溯至古代，远在计算机发明之前。关于人造主体的最早记载可追溯至希腊神话，例如巨大的青铜自动机塔洛斯的故事，它的任务是保护克里特岛免受入侵者侵害。塔洛斯被女巫美狄亚击败，后者拔出了固住一种液体或生命之血（可能是燃料）的青铜钉。另一个神话讲述了雕塑家皮格马利翁的故事，他雕刻了一尊美女雕像，却亲眼目睹它复活。这些故事或许是有记载历史中最早提及“机器人”这一套路的地方。从那时起，创造这些人造生物便成为人类反复着迷的主题。在希腊和阿拉伯文学中均能观察到它们的身影。


    ## 中世纪炼金术与神秘主义


    中世纪时，瑞士炼金术师帕拉塞尔苏斯声称仅凭他的精液、磁力和炼金术就创造出了一个小人或人造生物。布拉格的犹太拉比马哈拉尔与一个传说相关，传说他创造了一个粘土魔像（戈勒姆）以保卫犹太人免受迫害。或许正是这种对人造物的着迷，促使修补匠们创造出精巧的机械雕塑或能就位移动的自动机。虽然当时人们没有算力来模拟智能，但他们仍能利用机械结构来模拟运动。更复杂的自动机，如伊斯梅尔·贾扎里设计的那些，摆脱了纯机械结构，改用水力驱动。他的一些作品包括一个孔雀喷泉，可作为洗手台使用。一个隐秘的隔间甚至会随着孔雀的动作送出一块肥皂。


    ## 自动机时代：文艺复兴至 18 世纪


    中世纪结束后，自动机延续到了随后的几个世纪。哲学家勒内·笛卡尔的一些心智理论源于他对巴黎圣日耳曼昂莱自动机花园的一次参观。笛卡尔观察到，如果自动机能靠水流驱动而运动，那么人类也能靠作为实体的心智的存在而被驱动。这的另一个说法是灵魂，或后来所谓的“机器中的幽灵”。他将身体视为纯粹的机械容器，由心智驱动，心智是一种非物质实体，甚至区别于大脑。


    18 世纪还见证了臭名昭著的“土耳其人”的诞生，这是一个自动机，其发明者声称它能自行下棋。后来揭露这是一个骗局，由人操控，但它依然引人入胜。想想看，甚至在
    18 世纪，人们就已经致力于创造系统与人类玩家下棋了！这远早于 IBM 的“深蓝”于 1996 年击败世界象棋冠军加里·卡斯帕罗夫，也远早于 AlphaGo
    Zero 击败围棋冠军。亚马逊的众包智能平台“Mechanical Turk”（机械土耳其人）以该自动机命名，名副其实。


    ## 19 世纪文学中的诡异感


    19 世纪对机械行为的兴趣体现在 E.T.A. 霍夫曼的作品中，这位作家以在故事中营造不安感著称。更具体地说，心理学家西格蒙德·弗洛伊德用 *Unheimlich*（德语）或“uncanny”（诡异）一词来形容他阅读霍夫曼作品时的感受。最受关注的故事是《Der
    Sandman》，英文名为 *The Sandman*（《沙人》）。这是一个关于民间传说中神秘人物“沙人”的故事，他偷走幼童的眼球喂养自己的后代。故事中的角色奥林匹亚被介绍为一位教授的女儿，但后来被揭露是一个自动机——教授亲手创造的洋娃娃。奥林匹亚令人震惊，因为她在故事中与真实的年轻女子几乎无法区分，以至于主角爱上了她并求婚。然而，就在他准备求婚时，他撞见教授正在与合作者争夺洋娃娃无生命的躯体，争论谁设计了眼睑，谁制造了驱动她的发条机关。主角看到奥林匹亚的玻璃眼球散落在地板上，发疯了。这个自动机本质上是一个拥有真人所有外貌的模特——一场由教授及其合作者实施的残酷实验。


    同样的诡异感概念促使机器人专家森政弘创造了“恐怖谷”一词，用以描述人们对逼真机器人的情感反应。一般来说，机器人越逼真（照片级真实），人们感到越不安。这是一种奇怪的感觉，仿佛看到一个真实的生活漫画就在眼前，真实与人造的界限完全模糊。然而，观看者依然明白眼前的东西是假的。机器人形象随即散发出一种冷漠、非人性化的气氛，让人汗毛倒竖。恐怖谷指的是一张图表，横轴为拟人度，纵轴为亲和度。随着机器人拟人度增加，亲和度下降，呈现一条明显的向下曲线。曲线最低点是完全逼真却如尸体、僵尸般无生气的人的描绘。这些事物引发诡异效应，因为它们看似熟悉，但我们知道它们没有生命。那种与失去意识相关的怪异感，在一个长得像人却也没活着的机器人身上被无意中复现了。给这个逼真的机器人赋予声音和某种智能外表，你就会得到一个真实事物的怪诞变体。虽然通常应用于机器人，但不难看出恐怖谷如何适用于纯人工智能或其描绘。HAL
    9000 是一台计算机，但当它对非逻辑情境做出逻辑回应并引发恐惧感时，它制造了一种诡异感。如果你在电影首映时在影院观看，当观众意识到 HAL 在读唇语，偷听船员讨论断开它的连接时，你会听到全场倒吸一口冷气的声音。


    ## 《弗兰肯斯坦》：伦理与被造物


    人工智能的不完美及此类系统的崩溃或故障，在赫尔曼·梅尔维尔的《抄写员巴特比》中得到了体现。巴特比，一名华尔街职员，在工作中突然精神崩溃，被要求执行任务时仅宣称：“我宁愿不做”。该角色反复重复这句标志性台词，以至于变成了一种机械的呓语。该角色还表现出其他机械特质，比如盯着砖墙发呆，仿佛在等待输入。


    同期出版的另一部流行作品是玛丽·雪莱 1818 年的《弗兰肯斯坦》。该书原副标题为“或现代普罗米修斯”，但在大多数新版本中已被省略。在这部不朽经典中，雪莱探讨了创造人造生物的伦理、它们可能如何行动，以及人类能期待什么。故事采取了人道主义视角，因为弗兰肯斯坦的怪物在意识到自己与众不同时，产生了异化感。创造者拒绝为他创造一个雌性版本后，怪物杀害了他的未婚妻，以此扯平。怪物悲叹道，作为一个有知觉的生物，他有权获得幸福，而这一权利被创造者剥夺了。有趣的是，即使在对
    AI 的这种早期诠释中，弗兰肯斯坦也担心这两个人造生物繁衍，创造出一个不可阻挡的种族，在邪恶统治下奴役人类。然而，除了为报复而杀害未婚妻，怪物从未表现出明显的邪恶。只是因为怪物长相狰狞，才被贴上了邪恶的标签。对两个生物繁衍的恐惧与对智能爆炸的恐惧一致，因为任何足够聪明的人造生物如果愿意，都能创造自己的克隆体。正是人工智能的机械和计算层面让人们感到恐惧。很难说植根于
    AI 的现代末日场景源于这种恐惧，还是源于机器学习的最新进展。无论哪种情况，这都不算太新鲜。人类仍在继续其永无止境的创造人造心智的探索，正如自始至终所做的那样。但即使拥有世界上所有的算力，我们仍然不知道这些人造心智将如何诞生。

    '
