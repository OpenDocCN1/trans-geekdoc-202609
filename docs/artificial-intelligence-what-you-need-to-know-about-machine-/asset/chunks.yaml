- raw: 'Chapter 10: Recommender Systems Recommender systems are used by all the major
    tech companies, especially those that are content leaning. You can be sure that
    YouTube, Facebook, Netflix, and others actively employ them into their products.
    They are designed such that the more you use these services, the more they can
    recommend you things that you may want to watch. This increases the average time
    spent on their site or service because the consumer is shown appealing video after
    appealing video. It also saves the consumer from performing a search to find what
    they are looking for. Who among us today logs in to YouTube and never touches
    the search bar? Many people can limit their YouTube session to simply watching
    videos on their recommended section, or another video that pops up in the sections
    underneath. As long as you are logged into your account, these videos are tailored
    to meet your interests. Even if you aren’t logged in, YouTube increasingly uses
    your IP address and other browser agent details to tailor the homepage based on
    your previous viewing habits. Recommender systems are actively being researched
    because they add value to the company without needing to change anything. All
    the content is already there – these systems act as a force multiplier on the
    profitability of that content. For a company to “know” who their users are and
    what their interests may be, they use filtering algorithms that compare users
    along system-wide user profiling techniques. The most common of these algorithms
    is called collaborative filtering. Another type is called content-based filtering.
    They achieve similar goals but differ in how they are implemented. The differences
    can be gleaned from two online music streaming services, Last.fm and Pandora.
    The playlists or “stations” generated by Last.fm use collaborative filtering to
    find out what other users with similar music taste are manually adding to their
    libraries. A brand-new user to Last.fm will only have content that they search
    for or actively listen to. After a few days or even hours of listening to their
    favorite music, the user will receive randomly inserted music into their libraries.
    This is the result of the collaborative filtering technique looking up other users
    who listened to the same artists and finding out what other music they enjoyed
    as well. If it all goes according to plan, the new user will be satisfied with
