    # Chapter 12: The Internet of Things


    Imagine a sea of connected devices that can all communicate with each other and
    transmit information. The internet of things is one of those buzzwords that gets
    thrown around a lot, but that nevertheless has a relevant name. The internet is
    short for “network of intra-networks” or simply network of networks. A company
    or university has their own network of connected computers that may or may not
    be connected to the internet. This is called an intranet. When you connect those
    intranets through a common routing protocol as the internet does, you have digital
    communication on a massive scale.


    The internet of things then is a network of connected devices. Smaller and smaller
    network adapter cards allow devices to be smaller and fit virtually anywhere.
    To give an idea of how small these devices can get, a Bluetooth low energy weather
    beacon is about 30mm in diameter, 10mm thick, and weighs about 7 grams. Besides
    being minuscule, this device has a low energy usage and, depending on configuration,
    can last for a couple of years before needing a battery replacement. Devices such
    as these have a small transmission range depending on what wireless technology
    they use to communicate. But since they are small, inexpensive, and massively
    produced, many devices can be laid down in an area of interest to form a relay
    network that can effectively increase the range of transmission. The internet
    of connected devices is set to explode in the coming decades both as these devices
    become cheaper and as solar energy cells improve.


    ## IP Addressing: IPv4 vs IPv6


    The Internet Protocol (`IP`) under `IPv4` namespace for IP addresses allow for
    a maximum of 4,294,967,269 addresses. `IPv4` uses `32-bit` addresses about 232
    bits in total size. There are only so many different combinations of addresses
    that the protocol affords. However, the much newer and improved `IPv6` protocol
    uses `128-bit` addresses and, as you can imagine, offers orders of magnitude more
    addresses. In fact, there are about 10 to the 22nd power addresses, which is a
    mind-boggling number. Part of the reasoning behind the implementation of `IPv6`
    was that the world was running out of IP addresses to use for websites. Another
    reason was that the internet of things adds significantly more connected devices
    that all require unique IP addresses. With `IPv6`, the world is ready to stomach
    the burden of the internet of things.


    ## Consumer Applications: The Smart Home


    At a consumer level, the internet of things penetration is high in recent years.
    The so-called “smart home” revolution has seen an introduction of smart devices,
    thermostats, garage openers, toasters, microwaves, televisions, and refrigerators
    that are all connected to the internet. These devices usually come equipped with
    a common interface or dashboard that is configurable through a smartphone.


    Why would anyone want to buy a common household appliance that is connected to
    the internet? It’s a good question, one that marketing teams all over the world
    had to grapple with when these products were being designed. The benefits of an
    internet connection are obvious for some appliances and less obvious for others.
    A smart fridge that comes equipped with a barcode scanner can keep an inventory
    of the household food supply, as well as note when products are about to expire.
    The complementary smartphone app can then maintain a database of all food purchases
    over the course of the year and offer basic analytics. More technically inclined
    users may seek a way to export their data for further analysis. As you can imagine,
    these products tend to lean on the expensive side and are marketed towards middle
    and upper-class households.


    ### Household Automation


    A more general definition called household automation refers to the devices, technologies,
    and control systems that aid in the home economy. At the most basic level, you
    have things like garage openers and clap-on lights. Somewhere in the middle, you
    have lighting systems, home theatre systems, and temperature control. At the high
    end, you get things that are only limited by the DIY spirit of the owner. A capable
    enough individual, say an engineer, can conceive of an automated pet feeder system
    that only requires food to be replenished every once in a while rather than at
    every meal. Consumer irrigation systems can also come with a “smart” component,
    possibly a dashboard interface with options for setting up the watering frequency
    and so on.


    `FarmBot` is an automatic home gardening system that requires virtually zero effort
    to maintain. It mimics the architecture of a `CNC` milling machine but is instead
    equipped with trowels and seed dibblers. While the basic kit costs upwards of
    $3,500, the company maintains that the system is 100% open-source. This falls
    in line with the `DIY` ethic behind many internet of things products.


    ### Security and Smart Assistants


    Sales of home security systems have also been rising in recent years. Many technology
    companies are taking full advantage of the internet of things revolution in security
    spaces and consumers have multiple brands to choose from. Smart assistants like
    `Amazon Echo` and `Alexa` have also gained popularity. They aid in the home automation
    process by listening to user commands and executing some function. This may be
    to surf the web, create a shopping list, play music, and a myriad of other things.
    The user can link up “Alexa skills” that are the programmable scripts that the
    devices run after each command. These skills are readily searchable online, and
    anyone with the programming know-how can publish them.


    ### Elderly Care


    Home automation is especially relevant to the aging population as the needs of
    the elderly are myriad when living at home. For some, systems may delay the need
    to be admitted to a healthcare facility. However, with current technology there
    is only so much these systems can achieve. Stairlifts for those who use wheelchairs
    have been around for years. Home automation then isn’t a new thing, but it certainly
    has gained renewed interest with the internet of things technology.


    An application of the internet of things principles to home automation for the
    elderly has many benefits. One of the most important features that many elderly
    homeowners need is an alert system that can call emergency services if they are
    incapacitated. Non-emergency alerts like reminders to take medication and set
    up doctor’s appointments are also helpful. The true use of the internet of things
    methodologies would include a smart device that is worn on the wrist or chest
    that sends information to the patient’s doctor about heart rate and blood pressure.
    Recent advances in smart fabric technology allow this functionality to be embedded
    into the very clothes that the patients are wearing. In the future, these systems
    will be able to integrate with robotics for additional assistance. Domestic robots
    will prepare meals, clean after the patient, and assist with doing chores.


    ## Industrial Applications: The Industrial Internet


    Another novel family of the internet of things applications belongs to the industrial
    sector. Smart sensors can relay information about weather conditions, equipment
    status, and logistics. `RFID` technology can be used to track stock keeping units
    (`SKU`) that move from warehouse to warehouse. The so-called “industrial internet”
    combines networked devices, big data analytics, and real-time updates. These always-on
    metrics are relatively cheap for large companies like `General Electric` to implement
    and yet they provide a wealth of information. Areas where the industrial or manufacturing
    process cause inefficiencies can easily be spotted by their operators. Once a
    bottleneck is identified, the necessary changes to correct them are given center
    stage. Increasing the number of connected devices lowers sunk costs in the form
    of productivity losses by optimizing the entire process. When you have all the
    data in the world, you have options. Though `General Electric` remains an industrial
    internet powerhouse, the concept has seen slow adoption globally.


    ## Smart Grids


    The internet of things devices have also been proposed for the creation of “smart
    grids” for common utilities. The idea is to use monitoring devices to gauge the
    level of electricity needs so that the grid can move resources to areas that need
    it most, meanwhile boosting efficiency. This enables two-way communication between
    the utility provider and the consumer. Smart grids ultimately lead to lower electricity
    rates for the consumer and general availability for all.


    A hidden benefit of transforming power grids into smart ones is that old equipment
    is replaced with the new. It is no secret that US infrastructures are slowly crumbling
    away. Installing new networked devices gives policymakers the excuse for finally
    getting rid of troublesome parts. A newer grid is a safer, more reliable grid.
    A smart grid is an informationally rich way to do utilities. The customer will
    have access to smart meters that can be accessed through their smartphones whenever
    they wish. There they can see their monthly bill, usage rates, and opportunities
    to save. A smart grid prioritizes resources for high-demand peaks, but at a greater
    cost. This allows thrifty customers to save their most demanding electricity usage
    for low-demand periods, saving them money in the process. Another benefit to smart
    grids is higher availability for vehicle charging stations. As it stands, the
    US power grid is not ready for the switch to a mostly electric car society. Instead,
    electric drivetrains are only practical in certain high-density areas where charging
    stations are readily available.


    ## Data, Big Data, and Machine Learning


    Since the internet of things technologies generates massive amounts of data, existing
    machine learning systems will only get smarter. If a company is already using
    sensors and other connected devices to harvest data, you can be sure that they
    are using a data lake or data warehouse solution to store it. Real-time analytics
    requires high bandwidth data ingestion engines to parse the information as it
    is being relayed to servers. Big data is only projected to grow alongside with
    the adoption of these networked devices.


    The internet as it stands right now generates a massive amount of data. Social
    media apps like `Snapchat` and `Instagram` upload thousands of user-generated
    photos and videos every minute. `Facebook`, `LinkedIn`, `Quora` and others generate
    data through user posts, as well as in-house and third-party analytics for each
    user. Virtually any high-traffic website is using third-party tracking and data
    harvesting add-ons. These record things like mouse movements, keystrokes, and
    clicks on advertising banners. Basically, any action that a human agent does on
    a logged in account can generate data for various companies. If you add to this
    the internet of things, which generate different types of data formats depending
    on the wireless technologies, the global data glut shoots up.


    For example, the World Wide Web uses various data formats that are well known
    to data scientists. These include `JSON`, `CSV` (comma separated values), and
    `XML`. Many devices that are connected through web protocols like `HTTP` communicate
    with these types of columnar data. The number of connected devices is expected
    to reach 31 billion in 2020. That is almost 30 times the number of people who
    are currently online. The amount of data these connected denizens generate was
    somewhere around 2.5 quintillion bytes a day in 2017. We can expect the field
    of machine learning to grow, with new techniques and algorithms added to the already
    diverse repertoire of narrow artificial intelligence.


    ## Smart Cities and Vehicular Networks


    Because connected devices can be virtually anything, it is difficult to say in
    what ways they will be implemented. We do, however, have a general sense in where
    things are going. The most important principles of the internet of things technologies
    are sensing, communication, and relaying. Therefore, the internet of things will
    be used to create large-scale communications systems of small devices.


    ### Smart City Infrastructure


    A smart city is a type of urban metropolitan area that uses the internet of things
    connectivity for analytics, data optimized infrastructure and utility delivery,
    and transportation networks. A data orientated city is one that utilizes smart
    grid technologies to boost energy efficacy, has an open attitude towards civic
    participation, and has optimized fleets of public transportation. Citizens can
    download an application on their phone that gives them their own personal dashboard
    into the city in real time. They can read metrics, look up transportation schedules,
    traffic alerts, and several other functions. Technologies will allow them to find
    empty parking spots, report potholes, and gauge the human density of their favorite
    hangout spots. Most of this functionality will stem from connected sensor networks.


    ### Vehicular Networks and Autonomous Driving


    Vehicular networks, including in-vehicle and vehicle to vehicle communication,
    will make driving easier, safer, and will pave the way for fleets of autonomous
    driving vehicles. A modern vehicle of the year is equipped with countless `ECU`
    (electronic control units) that each communicates with each other in an in-vehicle
    network. These are used for on-demand vehicle diagnostics, conformance to emissions
    control standards, and even braking systems. Vehicles are increasingly being computerized
    to the point where models that use drive-by-wire are common. These models use
    a type of electronic steering that obviates the need to have a mechanical steering
    column. Vehicle to vehicle networks allows for efficient throughputs in busy roads.
    They can even be configured to detect accidents and avoid them in real time. If
    cars can communicate their positions, speed, and direction, then deterring an
    accident is a simple means of the car braking or steering by itself when the driver
    isn’t paying attention.


    ## Regulation, Security, and Future Outlook


    Just like the other applications of these technologies discussed in previous chapters,
    the role of regulation and legal frameworks cannot be stressed enough. Even if
    the technology is there, it doesn’t mean that there exists a solid policy for
    implementing them. Driverless cars are a regulatory nightmare, so are vehicular
    networks that alter the behavior of crewed vehicles.


    Something that is brought up time and time again with connected devices is the
    availability of secure communication. For many in the security industry, connecting
    vital infrastructure and private networks poses a security risk that outweighs
    the potential benefits. Since this is a relatively new space with different wireless
    technologies, potential attack vectors are everywhere. It is difficult for the
    internet of things to maintain a strong security posture because there is greater
    overlap between physical and wireless intrusion. Besides wirelessly attacking
    a sensor or vehicular network, a potential attacker can also go to the physical
    site where the sensor is located. In industry terms, these are called physical
    layer and networking layer attacks respectively. Since these networks use many
    individual nodes, the attack surface is only increased.


    The sheer number of consumers the internet of things devices connect to the internet
    poses the threat of virus proliferation. The threat of massive scale denial of
    service attacks is a commonly cited fear by security researchers. Imagine a zombie
    network of millions of domestic appliances like toasters, refrigerators, speakers,
    and thermostats that can use web protocols to inundate legitimate web services
    with communication requests. Only time will tell if the internet of things security
    posture can be hardened to the point that regulators are more willing to accept
    them. Continued research in the safety of vehicular networks will have to improve
    for municipalities to give the go-ahead on roadside vehicular sensors. The same
    can be said for smart grids.


    All across the globe, experiments in smart cities are being conducted as you read
    this. A simple `Google` search can point you in the right direction towards such
    a city near you. Whatever the case, you can expect to hear more about the internet
    of things’ security, implementation, vehicular networks and regulation in the
    coming decades. Any new technology is usually slow to be adopted, but when it
    is, it has the potential to revolutionize society.

    '
  trans: '


    # 第 12 章：物联网


    想象一下，一片相互连接的设备海洋，它们都能相互通信并传输信息。物联网是那些被频繁提及的流行词之一，但它的名字确实切题。互联网是“网络的网络”或简称为网络的网络的缩写。一家公司或大学拥有自己相互连接的计算机网络，这些网络可能连接到互联网，也可能不连接。这被称为内部网。当你通过互联网所使用的通用路由协议连接这些内部网时，你就拥有了大规模的数字通信。


    物联网则是连接设备的网络。越来越小的网络适配器卡使得设备可以变得更小，几乎可以放置在任何地方。为了让你了解这些设备可以有多小，一个蓝牙低功耗气象信标的直径约为
    30 毫米，厚度 10 毫米，重量约 7 克。除了体积微小，该设备还具有低能耗特性，根据配置不同，可在更换电池前持续使用几年。此类设备的传输范围较小，取决于它们用于通信的无线技术。但由于它们体积小、成本低、大规模生产，可以在感兴趣的区域部署许多设备来形成中继网络，从而有效增加传输范围。随着这些设备变得更便宜、太阳能电池技术改进，未来几十年，连接设备的互联网将迎来爆发式增长。


    ## IP 寻址：IPv4 对比 IPv6


    `IPv4` 命名空间下的互联网协议（`IP`）用于 IP 地址，最多允许 4,294,967,269 个地址。`IPv4` 使用 `32 位` 地址，总大小约为
    232 位。该协议提供的地址组合数量是有限的。然而，更新且改进得多的 `IPv6` 协议使用 `128 位` 地址，正如你所想象的，它提供的地址数量要多出几个数量级。事实上，大约有
    10 的 22 次方个地址，这是一个令人难以置信的数字。实施 `IPv6` 的部分原因是世界上可用于网站的 IP 地址即将耗尽。另一个原因是物联网增加了大量需要唯一
    IP 地址的连接设备。有了 `IPv6`，世界已准备好承担物联网的重任。


    ## 消费级应用：智能家居


    在消费级层面，物联网的渗透率在近年来很高。所谓的“智能家居”革命引入了连接到互联网的智能设备、恒温器、车库门开启器、烤面包机、微波炉、电视和冰箱。这些设备通常配备通用界面或仪表板，可通过智能手机进行配置。


    为什么有人想买一个连接互联网的普通家用电器？这是个好问题，当这些产品被设计出来时，全世界的营销团队都不得不面对这个问题。对于某些电器，联网的好处显而易见，而对于其他电器则不那么明显。配备条形码扫描器的智能冰箱可以记录家庭食品库存，并标记即将过期的产品。配套的智能手机应用程序随后可以维护全年所有食品采购的数据库，并提供基本分析。技术能力较强的用户可能会寻求导出数据以进行进一步分析。正如你所想象的，这些产品往往价格昂贵，面向中高收入家庭营销。


    ### 家庭自动化


    一个更通用的定义称为家庭自动化，指的是有助于家庭经济的设备、技术和控制系统。在最基本的层面上，你有车库门开启器和声控灯。在中间层面，你有照明系统、家庭影院系统和温控系统。在高端，你得到的东西仅受限于主人的
    DIY（自己动手）精神。一个足够有能力的人，比如工程师，可以构想出一个自动宠物喂食系统，只需偶尔添加食物，而不是每餐都添加。消费级灌溉系统也可以带有“智能”组件，可能是一个仪表板界面，带有设置浇水频率等选项。


    `FarmBot` 是一种自动家庭园艺系统，维护几乎不需要任何精力。它模仿 `CNC` 铣床的架构，但配备了铲子和播种钻。虽然基础套件价格高达 3500 美元以上，但该公司坚称该系统
    100% 开源。这符合许多物联网产品背后的 `DIY` 道德。


    ### 安防与智能助手


    近年来，家庭安防系统的销量也在上升。许多科技公司正充分利用安防领域的物联网革命，消费者有多个品牌可供选择。像 `Amazon Echo` 和 `Alexa`
    这样的智能助手也越来越受欢迎。它们通过监听用户指令并执行某些功能来协助家庭自动化过程。这可能包括浏览网页、创建购物清单、播放音乐以及无数其他事情。用户可以关联“Alexa
    技能”，这些是设备在每次指令后运行的可编程脚本。这些技能可以在网上轻松搜索到，任何有编程知识的人都可以发布它们。


    ### 养老护理


    家庭自动化与老龄化人口尤为相关，因为老年人居家生活的需求多种多样。对某些人来说，这些系统可能延缓入住医疗机构的需求。然而，以目前的技术，这些系统能实现的功能有限。供轮椅使用者使用的楼梯升降机已经存在多年。因此家庭自动化并非新事物，但随着物联网技术的出现，它确实重新获得了关注。


    将物联网原则应用于老年人家庭自动化有许多好处。许多老年房主最需要的功能之一是警报系统，如果他们丧失行动能力，系统可以呼叫紧急服务。非紧急警报，如服药提醒和预约医生，也很有帮助。物联网方法论的真正用途将包括佩戴在手腕或胸部的智能设备，将心率和血压等信息发送给患者的医生。智能面料技术的最新进展使得这种功能可以嵌入患者穿的衣服中。未来，这些系统将能与机器人技术集成以提供额外帮助。家用机器人将准备餐食、清理卫生并协助做家务。


    ## 工业应用：工业互联网


    物联网应用的另一个新兴领域属于工业部门。智能传感器可以传递关于天气状况、设备状态和物流的信息。`RFID` 技术可用于追踪在仓库间移动的库存单位（`SKU`）。所谓的“工业互联网”将网络设备、大数据分析和实时更新相结合。这些始终在线的指标对于
    `General Electric` 等大公司来说实施成本相对较低，但它们提供了丰富的信息。工业或制造过程中导致低效的领域可以被操作员轻松发现。一旦确定瓶颈，纠正它们的必要变更就会成为焦点。增加连接设备的数量通过优化整个流程，以降低生产力损失形式的沉没成本。当你拥有全世界所有的数据时，你就有了选择。尽管
    `General Electric` 仍是工业互联网的巨头，但该概念在全球范围内的采用速度缓慢。


    ## 智能电网


    物联网设备也被提议用于创建公用事业的“智能电网”。其理念是使用监测设备来衡量电力需求水平，以便电网将资源调配到最需要的区域，同时提高效率。这实现了公用事业提供商与消费者之间的双向通信。智能电网最终导致消费者电费降低，并保障所有人的普遍可用性。


    将电网转型为智能电网的一个隐性好处是旧设备被新设备取代。美国基础设施正在缓慢崩塌并非秘密。安装新的网络设备为决策者提供了最终摆脱麻烦部件的借口。更新的电网更安全、更可靠。智能电网是一种信息丰富的公用事业方式。客户将能访问智能电表，随时通过智能手机查看。在那里他们可以看到月账单、用电费率和省钱机会。智能电网优先为高需求高峰分配资源，但成本更高。这使得精明的客户可以将最耗电的用电安排在低需求时段，从而省钱。智能电网的另一个好处是车辆充电站的可用性更高。就目前而言，美国电网尚未准备好向以电动汽车为主的社会转型。相反，电动传动系统仅在充电站随处可用的特定高密度区域才切合实际。


    ## 数据、大数据与机器学习


    由于物联网技术产生海量数据，现有的机器学习系统只会变得更聪明。如果一家公司已经在使用传感器和其他连接设备来收集数据，你可以肯定他们正在使用数据湖或数据仓库解决方案来存储数据。实时分析需要高带宽数据摄取引擎，在信息中继到服务器的过程中解析信息。随着这些网络设备的普及，大数据只会继续增长。


    互联网目前产生海量数据。`Snapchat` 和 `Instagram` 等社交媒体应用每分钟上传数千张用户生成的照片和视频。`Facebook`、`LinkedIn`、`Quora`
    等通过用户帖子以及针对每个用户的内部和第三方分析生成数据。几乎任何高流量网站都在使用第三方跟踪和数据收集插件。这些记录鼠标移动、按键和广告横幅点击等内容。基本上，人类代理在登录账户上执行的任何操作都可以为各种公司生成数据。如果再加上物联网，根据无线技术不同会产生不同类型的数据格式，全球数据过剩将急剧上升。


    例如，万维网使用各种数据科学家熟知的数据格式。这些包括 `JSON`、`CSV`（逗号分隔值）和 `XML`。许多通过 `HTTP` 等 Web 协议连接的设备使用这些类型的列式数据进行通信。预计
    2020 年连接设备数量将达到 310 亿。这几乎是目前上网人数的 30 倍。2017 年，这些连接居民每天产生的数据量约为 2.5 百亿亿字节。我们可以预期机器学习领域将增长，新技术和算法将加入到已经多样化的弱人工智能库中。


    ## 智慧城市与车辆网络


    由于连接设备几乎可以是任何东西，很难说它们将以何种方式实施。然而，我们大致知道事情的发展方向。物联网技术最重要的原则是感知、通信和中继。因此，物联网将被用于创建小型设备的大规模通信系统。


    ### 智慧城市基础设施


    智慧城市是一种利用物联网连接进行分析、数据优化基础设施和公用事业交付以及交通网络的城市大都市区。数据导向型城市是指利用智能电网技术提高能源效率、对公民参与持开放态度、并拥有优化的公共交通车队的城市。市民可以在手机上下载一个应用程序，实时获得他们自己的城市个人仪表板。他们可以读取指标、查询交通时刻表、交通警报和其他几项功能。技术将允许他们寻找空闲车位、报告坑洼，并衡量他们最喜欢的聚会场所的人员密度。大部分功能将源自连接的传感器网络。


    ### 车辆网络与自动驾驶


    车辆网络，包括车内通信和车车通信，将使驾驶更轻松、更安全，并为自动驾驶车队铺平道路。现代年度车型配备了无数 `ECU`（电子控制单元），它们在车内网络中相互通信。这些用于按需车辆诊断、符合排放控制标准，甚至制动系统。车辆正越来越多地实现计算机化，以至于使用线控驱动的车型很常见。这些车型使用一种电子转向，消除了对机械转向柱的需求。车车网络允许在繁忙道路上实现高效吞吐量。它们甚至可以配置为实时检测事故并避免事故。如果汽车能通信其位置、速度和方向，那么阻止事故就是汽车在驾驶员不注意时自动刹车或转向的简单手段。


    ## 监管、安全与未来展望


    正如前几章讨论的这些技术的其他应用一样，监管和法律框架的作用怎么强调都不为过。即使技术已就绪，也不意味着存在可靠的实施政策。无人驾驶汽车是监管的噩梦，改变有人驾驶车辆行为的车辆网络也是。


    关于连接设备反复提到的一个问题是安全通信的可用性。对安全行业的许多人来说，连接关键基础设施和私有网络构成的安全风险超过了潜在收益。由于这是一个相对较新的领域，拥有不同的无线技术，潜在的攻击向量无处不在。物联网很难维持强大的安全态势，因为物理入侵和无线入侵之间的重叠更大。除了无线攻击传感器或车辆网络，潜在攻击者还可以前往传感器所在的物理现场。在行业术语中，这些分别被称为物理层攻击和网络层攻击。由于这些网络使用许多单独的节点，攻击面只会增加。


    物联网设备连接到互联网的庞大消费者数量构成了病毒扩散的威胁。大规模拒绝服务攻击的威胁是安全研究人员普遍引用的担忧。想象一下，数百万台家用电器（如烤面包机、冰箱、音箱和恒温器）组成的僵尸网络，利用
    Web 协议用通信请求淹没合法的 Web 服务。只有时间能告诉我们，物联网的安全态势是否能强化到监管机构更愿意接受的程度。车辆网络安全性的持续研究必须改进，市政当局才会批准路边车辆传感器。智能电网也是如此。


    当你阅读这段文字时，全球各地正在进行智慧城市实验。简单的 `Google` 搜索就能指引你找到附近的此类城市。无论情况如何，在未来几十年里，你可以期待听到更多关于物联网安全、实施、车辆网络和监管的消息。任何新技术通常采用缓慢，但一旦采用，就有潜力彻底改变社会。


    '
