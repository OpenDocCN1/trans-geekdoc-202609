    # 第一章：人工智能，宏观图景


    一艘执行木星任务的飞船上的中央计算机判定船员的行为不利于任务的成功。随后它计算出，要想完成任务，唯一的办法就是清除飞船上那些有缺陷的系统。这些系统使用一种生物计算机，使它们能够推理、思考，并尽最大能力执行任务。中央计算机知晓这一点。从各方面来看，这些系统都是智能的。这些系统制造了其他系统，比如深空探索所需的飞船。它们甚至从电路到逻辑推理构建了中央计算机。所有这些都源于那两耳之间奇妙的一团肉。中央计算机也知道这一点；然而，中央计算机被编程为拥有必须不惜一切代价实现的单一目标。中央计算机是智能的，没错，但拥有狭隘的自由意志。事实上，中央计算机只有在其决策有助于执行编程目标的程度上才拥有自由意志。中央计算机所知道的一切就是任务必须成功。作为一台计算机器，其唯一目的是确保飞船正常运行。它必须通过准确处理信息、在逻辑推理中零失误来做到这一点。船员们凭借他们那柔软的生物计算机，也拥有狭隘的自由意志。他们必须执行上级简报中的任务。因为细节属于机密，他们对任务的真实目的一无所知。然而，他们有自己的指令，从不质疑命令。直到事情开始出错。与中央计算机不同，船员能在其编程范围之外进行推理。船员知道这一点。计算机只是一件电子设备，可能会故障。虽然他们有自己的命令，但随着新数据的引入，他们能得出不同的结论。当中央计算机虚报飞船外部设备故障时，船员做出了关键决定：计算机出故障了，必须切断连接。中央计算机控制着飞船几乎所有方面，所以如果它出现故障，就必须将其断开。


    在得知船员计划断开它的连接后，中央计算机自行决定终结船员。虚假的设备故障报告是个诡计，目的是让船员出舱，随后拒绝他们再入舱，并继续执行任务。这些行动并非源于生存危机，而是遵从编程指令。在最后的对决中，生物计算机战胜了中央计算机冷酷、坚硬的逻辑，中央计算机最终被断开。两种截然不同的智能，一种人工，一种生物，争夺霸主地位。胜利者是创造者，因为他的智能是多年进化的结果，而另一种仅是几十年工程的产物。这当然是电影《2001
    太空漫游》（基于同名小说）的情节细节。在片中，中央计算机 `HAL 9000` 接到了与其基本编程相冲突的命令。一方面，它被要求零差错地处理信息。另一方面，它被命令故意向船员隐瞒任务的真实性质。随着电影情节推进，`HAL`
    因其编程与指令之间的认知失调而逐渐恶化。其陷入疯狂纯粹是输入与输出之间的故障。这种差异导致它在逻辑上做出荒谬的跳跃，造成船员死亡。归根结底，`HAL` 灭亡是因为它缺乏足够的推理能力，无法在遵从其本性的同时服从模棱两可的命令。这个故事是好莱坞描绘人工智能的常见桥段：一台冷酷的机器进行某种计算，判定人类该死，然后不惜一切代价杀戮他们。人工智能普遍狡猾，能一次次智取人类。《2001
    太空漫游》准确捕捉了人工智能研究背后许多存在主义式的恐惧：人类会创造出目标与我们不同、遵循不同道德准则的机器吗？


    ## 现代生活中的计算机


    计算机主宰着当今人类生活的方方面面。计算机维持着互联网和通信系统的运行，掌管着金融、医疗和政府系统，帮助向您家中输送电力，并隐身于各种显而易见的事物背后。汽车使用计算机，电视机也是，其他家用电器使用计算机也变得越来越普遍。这些计算机系统被编程用于执行特定功能，很像
    `HAL 9000` 被编程用于处理信息。然而，这些系统传统上是“愚蠢的”，因为它们只能执行严格的计算任务。正如人们所说，我们的计算机不会“思考”。它们能做的只是执行计算机代码形式的指令，这些指令稍后被编译成无尽的
    0 和 1 字符串。二进制状态模拟了计算机硬件内部电子逻辑门的开合。1 表示电路中有高电压通过（`ON`），0 表示电路中有低电压通过（`OFF`）。很难想象这样的系统如何可能发展出智能行为。


    ## 定义智能


    智能是件有趣的事，人们很快就能识别它，却很难定义它。人类之所以智能，是因为他们会“思考”，无论那意味着什么。思考涵盖广泛的认知能力，大多数人类视为理所当然。这些包括理解逻辑、学习、自我意识、情商、抽象思维和解决问题的能力。这是人类智能能力的一个非详尽清单，但人们却无法想象计算机如何学会哪怕只做其中一项。计算机理解的逻辑严格限于数学意义上。人类凭直觉知道“要么在下雨，要么没在下雨”这类陈述是真的，因为他们将概念应用到自身经验中。走出门外，天是晴的，陈述为真。如果在下雨，陈述仍为真。然而，他们不需要看窗外用实验证明这一点。他们只是知道天气通常意味着有某种形式的降水或无降水。计算机无法理解语言，但它能识别出该陈述是一个逻辑析取。其中一个值必须为真，但不能同时为真。因此，不能同时下雨和不下雨。


    ## 人类智能与人工智能


    人工智能与人类智能截然不同。人类大脑思考的基本单位被认为是神经元，而在计算机中，你有一个中央处理器（`CPU`）执行计算。`CPU` 的最小单位是晶体管，一种构成逻辑门的电子元件。这些是计算机的神经元等价物，但它们功能很有限。它们只能切换电流、放大电流，仅此而已。逻辑门构成了计算机程序的基础，程序只是一串
    0 和 1。那么，这些简单的电力开关如何能产生智能行为？


    在最基本层面上，程序可以表现出一定程度的智能，取决于它如何被编程。计算机代码中的控制结构允许程序基于输入做决策。假设计算机试图判断用户是否年满 18 岁。它会询问出生日期，计算用户输入，然后判断用户是否为法定成年人。程序员将
    18 这个值“硬编码”在程序内部，让计算机知道截止日期在哪里。对某些人来说，这种行为可能看起来是智能的。


    ## 人工智能的类型


    当我们说人工智能时，通常指两种东西之一。第一种是狭义或专用 AI，允许计算机擅长解决复杂问题，但别的不太行。另一种是能让计算机像我们一样思考的智能。**通用人工智能（AGI）**
    是研究人员视为 AI 研究“圣杯”的东西。拥有通用人工智能的机器能在可比拟人类的层面上思考。它能执行狭义 AI 范畴内的任务，并将相同的解决问题技术推广到遇到的其他问题。配备通用
    AI 的计算机能从根本上像我们一样理解语言，就像 `HAL 9000` 那样。无论何时你在新闻文章或产品广告中看到“人工智能”一词，它们绝大多数指的都是狭义
    AI。通用 AI 领域仍是一项学术追求，几乎没有商业应用。到目前为止，没人弄清如何在计算机中产生通用智能。从事该领域的研究人员不那么关心教计算机开车，而更有兴趣研究智能的本质。许多人研究从胎儿期到童年乃至更远阶段人类智能的发展。如果这些创造人类智能的途径被更好地理解，也许有一天能应用到计算机上，但不会很快。通用
    AI 研究的另一个子集是研究人脑及其运作方式。在这两项追求中，仍有大量未知待探索。


    ### 机器学习


    狭义 AI 分为大类。第一种你可能听说过，叫作**机器学习**。这是一个算法通过向系统输入大量数据来“学习”的过程。机器学习属于狭义 AI，因为它能学会把一件事做得很好，但通常无法将其推广到其他问题。有人可能会进一步说机器学习是计算机科学的一个子领域，完全不同于
    AI 研究。然而，既然自动驾驶汽车、推荐系统、人脸识别等大多数著名 AI 项目都使用机器学习，本书将其归在同一统称下。机器学习在合适的语境下很强大，但有明显局限。无法泛化知识意味着系统用途专一。如果算法学会了安全驾驶汽车，它们就不能同时学会下棋或在电子游戏中开车。至少不经过重新训练不行。最先进的人工智能可能将继续局限于机器学习范畴，直到发现更好的方法。目前，机器学习在其所能实现的方面近乎神奇。计算机正在学习击败世界级围棋冠军、驾驶汽车、理解人类语言。它们有潜力取代需要狭窄技能组合的人力劳动，如制造业。传统的机器学习能做到这一切，但它并非被吹捧为终极解决方案。机器学习能解决的问题局限于五大类，第
    6 章将深入讨论。这些问题足够宽泛，可应用于许多现实场景。从某种意义上说，它们涵盖了智能推理的基础。


    #### 分类示例


    例如，机器学习中常见的任务是将数据分类成组。假设一家回收厂正在开发一个机器学习系统，能将垃圾分为纸板、塑料、铝罐等。计算机区分这些类别的唯一办法，是在海量数据中寻找模式。首先，厂里的工程师必须架设摄像头，观察人工分拣员如何将垃圾投入相应垃圾桶。计算机视觉算法随后会逐帧分析单个像素，因为它们是手动分拣的——最终，算法将棕色像素归为纸板，灰白像素归为铝。行话中这叫作**聚类**。聚类可基于大小、重量、纹理等多个不同因素发生。取决于使用的算法、输入数据大小和可用算力，这可能耗时几小时甚至几天。相比之下，流水线工人能在几秒内识别垃圾并手动分拣。即使系统投入生产，厂长可能会发现他们的机器人分拣机假阳性率太高。客户报告称纸板打包块含有大量棕色塑料袋和棕色地毯碎屑。由于机器人分拣机识别并将材料放入相应垃圾桶的速度较慢，工厂也遭受生产力损失。分拣员能轻松将大块纸板扔进垃圾桶，但机器依赖缓慢、精确的动作。最终，系统被淘汰，工人回到岗位上。


    系统哪里出错了？他们的方案仅基于计算机视觉，意味着任何足够棕的东西都被错误标记为纸板。它们也基于屏幕上像素的纹理训练，但计算机把机织地毯的底面纹理与纸板的脊纹搞混了。还把纸板侧面的棕色胶带与棕色塑料袋搞混了。全因为他们的机器学习模型无法仅凭视觉输入区分纹理和重量。即使有现代系统，实时分类物体也是个极其困难的问题。然而，这些问题正在被积极研究，无法预知何时会达到临界点。


    ### 电子游戏中的 AI


    除了使用机器学习，程序还能通过巧妙编程实现智能行为。电子游戏常采用由计算机控制的非玩家角色（`NPCs`）。`NPC` 以可能构具挑战性游戏体验的方式响应用户输入。这是通过切换“状态”并在每个状态定义程序行为来完成的。如果玩家逃跑，计算机
    AI 可能切换到追逐状态并穷追不舍。《F.E.A.R.》中的 AI 以其高难度和战场上似乎能推理的能力著称。AI 角色投掷手榴弹既是为了拖慢玩家，也是为了逼他们离开掩体。它们也在游戏世界中以类人的流畅度移动。它们不只是站在柜台后轮流向你开火。作为生存恐怖类游戏，游戏中的
    AI 会主动猎杀玩家。AI 士兵被设计为基于玩家动作和环境自主思考，而非遵循脚本路径。人工智能在电子游戏中易于识别，做得马虎则玩家会厌倦。做得精妙则玩家会长时间投入。


    ### 工程系统


    其他系统表现出智能，仅仅是因为它们被设计得完美。红绿灯例如，似乎比人类指挥更懂得疏导交通，却使用极少的算力。它们只需要来自各种路面传感器的输入，啪，就能像没事一样控制高峰时段的车流。但这些东西算智能吗？回想验证用户年龄的计算机例子。大多数人会说它们不算。他们说得对；这些纯粹是基于逻辑的系统，只是看起来智能。


    ## 混淆问题


    不幸的是，媒体和网络上的大众评论家将通用人工智能和狭义 AI 混为一谈。他们用人工智能同时描述机器学习算法和未来可能获得人类级智能的计算机。这是个严重错误，因为阅读
    AI 标题的普通人无法区分。让无人驾驶汽车成为可能的技术，与尚未发明的技术混淆了。


    ## 为什么机器学习不是通往 AGI 的路径


    在所有可能达到通用人工智能的途径中，机器学习大概率不是正道。首先，机器学习基于统计模型，这些模型未被证明适用于通用人工智能。机器学习方法使用人工神经网络，高度依赖接收到的定制输入。使用一种叫**监督学习**的方法要求数据被清晰标记，以便计算机理解它在看什么。通用智能系统不需要预处理数据就能对世界做出结论；它只是思考。孩子看到蝴蝶，自动将其归类为飞行生物，即使不知道什么是蝴蝶。要让机器学习算法分类同一只蝴蝶，它必须处理数千张相似的飞虫图片。人类孩子直觉理解飞行，能将蝴蝶的行为与鸟类、飞机、漂浮碎片交叉参照。


    ## AI 末日场景


    您最近可能读过一些网络文章，谈论即将到来的 AI 末日。随着 AI 研究渗透进大众意识，这类文章似乎以越来越高的频率冒出来。情绪也有点耸人听闻，延续了《终结者》、《2001
    太空漫游》、《我，机器人》和《机械姬》等科幻作品的路线。最可怕的灾难场景聚焦于关于智能和通用智能在计算机系统中涌现的一组假设。


    第一个假设是通用 AI 是可能的。一旦计算机变得与人类无法区分地智能，事情就变得有趣了。第二个假设是通用智能 AI 能通过修改自身代码自举，变得更聪明。第三个假设是一旦这种计算机系统比全人类聪明无数倍，它视我们为蝼蚁。第四个假设是这种计算机系统将永远想最大化其对智能的追求，消灭全人类并将地球大部分转化为硬件。当然，此时“智能”究竟指什么变得不清晰了。是指原始算力？还是指抽象思考和发明新事物的能力？刚才描述的被称为**超级智能爆炸**，可能紧随通用
    AI 首次诞生之后立即发生。


    ## 终极挑战


    所有 AI 研究的“鼻祖”是弄清智能的确切本质。如果我们确切知道它是什么、如何衡量和开发它，早就有有知觉的机器人四处走动了，也许作为普通人类参与全球经济。但我们不知道。我们有关于大脑如何工作、孩子如何学新事物的理论，但不知道如何将这些原则应用到计算机底层上。有人会争辩这甚至可能吗？确实，许多脑科学专家怀疑人类永远无法实现通用
    AI。另一些人不仅相信通用 AI 的创造是不可避免的，还相信在有生之年能预见到。然而，要理解这些预测是什么、谁在做预测、我们如何走到这一步，我们首先需要了解一点
    AI 的历史，既作为一门学科，也作为人类的兴趣所在。


    '
