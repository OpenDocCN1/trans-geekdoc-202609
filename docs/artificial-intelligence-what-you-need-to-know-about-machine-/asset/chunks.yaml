- raw: 'Chapter 9: Deep Learning If neural networks approach the way that human’s
    think, deep learning takes the idea a step further. Neural networks and artificial
    neurons have a long history dating as far back as 1950. But when they were first
    introduced, computing power was limited, and ANN was looked at like research toys
    rather than hardcore business facing algorithms. When computing power improved,
    ANN received renewed interest from AI researchers as well as large internet companies.
    We are just now emerging out of the AI research winter that persisted into the
    1980s and 90s. Part of this is due to computing power, and the other part is due
    to the introduction of the web and the massive amounts of data it generates. Today,
    deep learning is at the forefront of AI research and continues to make progress,
    helping the field thaw from the cold. Two things limit an artificial neural network.
    First is the computing power necessary to simulate layers of artificial neurons,
    and the second is a combination of available data and feature selection. Even
    the most powerful ANN clusters today are still orders of magnitude behind the
    raw computing power of the brain, for example. The introduction of powerful graphics
    processing units (GPU) for machine learning purposes greatly increase available
    computing power across the board. GPUs are inherently faster than CPUs because
    they tend to prioritize smaller, more efficient cores compared to the CPU’s powerful
    but bulky ones. They also allow for multi-threading of computational tasks and
    can easier perform floating point arithmetic (decimal numbers) than CPU’s. Though
    GPU’s were intended for rendering 3D graphics at hundreds of frames per second,
    they have been adopted by the AI community for processing large deep learning
    projects. So what exactly is deep learning? As the name applies, it relates to
    creating additional layers of depth that traditional ANNs do. The argument goes
    that if the brain is made up of layers and layers of neurons, how is it that flimsy
    ANNs with singular layers are capable of simulating intelligence? These are sometimes
    called “shallow” neural networks to differentiate from those with multiple layers.
    Now that GPUs are extremely fast and getting better every year, deep learning
    doesn’t require entire datacenters or neural net clusters to train models. Returning
    to the human brain motif, deep learning takes after the tendency for complex ideas
    to fire deep in the folds of the brain, rather than at superficial levels. Recognizing
    edges of pictures and tiny details fires neurons closer to the surface of the
    brain, while recognizing larger constructs like a person’s face fires deeper.
    More layers equal better, more intelligent systems. Information passes from the
    input neurons to additional hidden layers that also pass those inputs into each
    other. The more of these hidden layers, the better the results of machine learning.
    This is why deep learning is capable of tackling problems in artificial intelligence
    that shallow learning has traditionally lacked behind in. This includes computer
    vision, voice recognition, and language processing.   The true power from deep
    learning comes from its non-linear processing of features. Traditional machine
    learning techniques mostly use linear models and suffer from the feature engineering
    phase. With deep learning, features don’t need to be picked out by a field expert.
    Instead, many different features are picked per model, contributed to the overall
    complexity of the neural net. A traditional classification of something may have
    used two or three features, but the deep learning equivalent is to use as many
    as the data affords. For example, to detect whether an object on the road should
    be considered a vehicle obstacle, a shallow machine learning system can use the
    shape of the object and its speed as factors. Such a system may perform well in
    the short run, successfully identifying different makes and models of cars whether
    in motion or parked. However, the system may encounter some unspecified behavior
    like a large carnival float moving relatively slowly around many pedestrians.
    Using shape and speed alone would not be enough to classify it. In contrast, a
    deep learning system may use several different factors in addition to shape and
