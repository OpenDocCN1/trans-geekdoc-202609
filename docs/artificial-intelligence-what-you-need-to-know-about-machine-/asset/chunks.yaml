- raw: 'Chapter 11: Robotics Robotics is an interdisciplinary field that combines
    elements of engineering, science, physics, computer science, and electronics,
    just to name a few. Robotics concerns the design, implementation, programming,
    and maintenance of robots. A robot can be any physical system that is designed
    to perform an action or series of actions with varying degrees of autonomy. Robotics
    has a long history and has probably been in the human psyche ever since the first
    Greek stories of automatons were being told – though today’s robots are a little
    different from the ones you learned about in Chapter 2. Modern technology allows
    robots to be smarter, more lifelike, friendlier, and overall more useful than
    ever before. Many believe that humanity is headed for a new industrial revolution
    that will be spearheaded by the mass adoption of these systems in virtually every
    economic sector. Besides the obvious sort of industrial robots that you find in
    car manufacturing plants and refineries, there are also robotic systems being
    developed for retail, hospitality, transportation, telecommunication, medicine,
    and food services. Robotics and artificial intelligence often get lumped together,
    but they are both distinct things. While some aspects of robotics lend themselves
    to use artificial intelligence techniques, the field as a whole is not preoccupied
    with simulating intelligence. Robotics can also be divided into several subfields
    that specialize in certain applications of robotic principles. On the industrial
    side of things, robots are used to handle tasks that are easy to delegate to a
    machine. Some of these tasks require high precision or repetitive motions that
    would be too difficult for a human to sustain for long periods of time. Others
    are designed for high throughputs like food packaging and labeling. These systems
    vary in how many behaviors they are capable of performing, their physical properties,
    and how they are programmed. Industrial robots come in different varieties, but
    one of the most common configurations is the “arm” type. These have similar designs
    but perform different tasks. They also have different degrees of freedom that
    allow them to move differently. Kinematics is very important for these types of
    robots because the mathematical equations determine how the joints on the arms
    move. Interest in humanoid robots severely lacks with industrial robots regarding
    market penetration and usefulness. While research in androids or human-like robotic
    systems remains high, the role of the humanoid robot remains a techno-curiosity
    more than a commercially viable business – though one day it is conceivable that
    they will be bought and sold as housekeepers like the robots in The Jetsons .
    There already exist housekeeping aid robots like the Roomba that has been available
    since 2002. The Roomba is manufactured by a robotics company fittingly named iRobot.
    Rodney Brooks, a professor in robotics at MIT, co-founded the company in 1990
    with fellow classmates. Since then, Brooks has gone on to start another company
    called Rethink Robotics in 2009, most known for its creation of the Sawyer and
    Baxter collaborative robots. Baxter is fundamentally an industrial robot with
    industrial capabilities but with a bit of imagination. Unlike most industrial
    robots that usually resemble a mechanical arm, Baxter has two main limbs and an
    animated LCD face. It was designed to perform mundane tasks on an assembly line.
      Baxter is a humanitarian take on the industrial robot. Instead of performing
    tasks rapidly and mechanically, Baxter uses sensors to become “aware” of its surroundings.
    The LCD screen will display a face according to the robot’s state. It can also
    respond to changes in its environment like ceasing operation if it drops a tool
    or piece and is unable to recover it. One of the most intriguing facets of the
    robot is that workers can programme it in the facility. Where other industrial
    robots require an engineer to be configured through control systems, Baxter is
    programmable by “hand”. An unskilled worker can move the robot’s hands to perform
    a certain task, and the computer will try its best to reproduce the movements.
    This makes Baxter accessible to everyone on the production line, not just educated
    technicians. Baxter has been lauded as being safer than traditional industrial
    systems that do not pay attention to other factors outside of their immediate
    programming. Despite this, the company went out of business in October 2018 due
    to low sales. Many old guard manufacturing companies saw these systems as experimental
    and the technology probably not there yet. The robots Sawyer and Baxter are still
    used in research today. Some universities use them to teach students in robotics
    courses. More recently, researchers hooked up electrodes between Baxter and a
    human operator to directly transmit brain signals. Sometime in the future, the
    interaction between human and robot may resemble something that is as intuitive
    as simply thinking. Most industrial robots do not require to sense things or be
    particularly smart. They perform a set task and are usually left alone. In contrast,
    humanoid robot research focuses on the ability of the robot to perceive the world
    around them and to interact with it. To be able to move a robot requires some
    propulsion system, like a series of actuators or electric motors. Another option
    is to use hydraulics or pneumatic systems. All robots need an energy source, either
    a battery or a direct connection to the current through a wall socket. To be able
    to see, a robot can be equipped with cameras, LIDAR, and various sensors. Computer
    vision is coupled with the cameras, and the sensors directly send environmental
    data like speed, position, balance, and so forth to the robot’s control system.
    If machine learning is just a combination of statistics and programming, robots
    are a combination of a great many other things. In both cases, neither approach
    a general intelligence like the Star Wars droid 3-CPO. If that is the case, what
    is the current state of the art in robotics? Robotics research is split into many
    areas of focus, with some people working on sensors, robot dexterity, human-robot
    interaction, autonomous motion, and so on. Humanoid robots are projected to disrupt
    areas of retail, hospitality, and food service. The chances are that you have
    already seen the automated menu systems for McDonald’s and other fast food restaurants
    online. These systems are definitely being worked on, but may not see the implementation
    for various reasons. Some startups are even working on burger making systems that
    can perform virtually all of the duties of the average burger flipper at a fraction
    of the cost. The role of the humanoid robot in customer service is more obvious
    in places like Japan where robotics has entered the mainstream. Of all the industrialized
    nations today, Japan has the highest robot density by a large margin. Most of
    these robots are used in the automotive industry, but a number of them take on
    customer service roles. They can be found in select department stores greeting
    customers and in airports acting as luggage carriers. With an ever-contracting
    population and less unskilled workers willing to do these jobs, it makes sense
    that Japan has a high adoption rate. For many Japanese citizens, service robots
    serve to increase the quality of life and are a normal part of their daily lives.
      However, there is still a long way to go for the average consumer in other countries
    to warm up to these robotic and automated systems. Some would even say that the
    need simply isn’t there. In 2017, Japanese deaths outnumbered births by 1,000
    to one. The population dropped by a massive 264,000 people in one year alone.
    Other industrialized nations with rising unemployment rates and a stable population
    perhaps don’t need as many robots. There are also other concerns besides just
    population and unemployment for why service robots are yet to be seen abroad.
    Overcoming the uncanny valley effect is no easy feat, especially with older generations.
    In Japan, people are used to them, so the effect holds less weight – though the
    same cannot be said for older generations in other countries. Young people today
    are more comfortable using self-checkout lines and automated systems, but the
    older generation overwhelmingly subscribes to the importance of face-to-face interaction
    with their community. A big argument for service robot adoption in Japan is their
    large aging population. End of life care is synonymous with assisted living, loss
    of personal autonomy, and embarrassing mishaps. These are areas that service robots
    can directly address. For one, an older patient is less likely to feel embarrassed
    if a robot is cleaning after their bathroom accidents. If there is a strong human-robotic
    interaction, the patient may feel that the robot is a part of themselves like
    we think our phones are. The result is a net gain in personal autonomy, all things
    considered. With a shortage of geriatrics and personal care professionals plus
    a global aging population not just in Japan, service robots are projected to rise.
    Less and less people are signing up for these important ends of life careers.
    The pay for these jobs is low when compared to other medical professions that
    require a similar amount of training. If nobody else wants to take care of the
    elderly, who will? Not every family is willing or able to care for aging parents.
    Additionally, the risk of malpractice and abuse in assisted living institutions
    is high. Taking care of the elderly is not an easy job by any means. Combine this
    with a meager wage, and you have the basis for unfair treatment. Every aging person
    deserves to be treated with dignity and respect. Whether service robots can render
    this kind of treatment is up for debate. And it is a debate that will doubtlessly
    unfold within the current century. Would older generations be keen on using a
    service robot for their daily needs? To some, a robot may seem intimidating or
    impersonal. After all, robots are not intelligent the way that we are. They may
    be able to handle basic conversational skills and respond to our commands, but
    that is a far cry from genuine intelligence. There is also the question of whether
    these systems should have a human-like appearance or to remain obviously robot
    looking. Humanoid robots are more likely to create an uncanny valley effect, but
    it is not exclusive to human-like design. Any robot that acts sufficiently “alive”
    can elicit the effect. Research into the area of the ameliorating, the uncanny
    valley falls under human-robot interaction. We know from this research that certain
    robotic behaviors elicit certain human emotions like fear and uncertainty. For
    example, when a robotic agent gets too close or invades somebody’s personal space,
    there is a fear response. If a robot is just lounging around with no purpose,
    the human perceives it as daunting and even useless. Interacting with these systems
    can result in unanticipated behavior in the human. Humans are likely to ascribe
    personality traits to a robot even when these aren’t explicitly programmed. This
    factor of unpredictableness has lead researchers and designers to add emotive
    cues to their robots.   Where service robots suffer from the uncanny valley effect,
    utility robots do not. Virtually every major military across the globe is investing
    in robots to aid in the battlefield and in operations. A US-based company, Boston
    Dynamics, is working on robotic systems known for their mobility. The company
    made headlines with its design of a quadruped robot named BigDog for the Defense
    Advanced Research Projects Agency (DARPA). The robot has obvious military applications
    as a pack mule carrying ammunition and supplies for soldiers on patrol. The project
    was eventually scrapped because the system was deemed too loud to be used in live
    combat operations. These sorts of systems are mostly considered prototypes though.
    Other robots used by the US military include the Foster-Miller TALON family of
    remotely operated vehicles. They resemble little tanks or planet rovers with fully
    tracked movement. They are capable of using small arms fire to heavy machine guns
    completely remotely. Though TALON saw some deployment in Iraq and Afghanistan,
    its current use remains limited. Other fully weaponized systems are readily used
    like the General Atomics MQ-1 Predator drone and the MQ-9 Reaper. These belong
    to a class of aircraft called UAVs or uncrewed aerial vehicles. Predator and Reaper
    drones can either be controlled by an operator on the ground, or they can fly
    autonomously with the direction of onboard computers. These systems have faced
    increased scrutiny with high profile killings involving civilians and questionable
    rules of engagement. In 2011, under the Obama Administration, a 16-year-old American
    citizen of Yemeni descent was killed in a drone strike while eating at a restaurant
    in Yemen. It is unclear why the boy was targeted, but his father was a suspected
    al-Qaeda leader and was later killed in a similar strike. The legitimacy of so-called
    “killer-robots” comes into question now and then when a new system is announced.
    At the heart of the debate is whether a nation should possess the kind of power
    to kill remotely without trial and in the case of 16-year-old in a country that
    is not at war. Commentators are quick to point out that a machine with killing
    power is capable of being hacked. They appeal to the “Skynet” scenario where autonomous
    weapons gain sentience and begin to exterminate humans. Such scenarios are mostly
    far-fetched science fiction and are not helpful in the debate. While we know that
    some of these systems are vulnerable to getting hacked, we have yet to see a hacked
    autonomous system cause loss of life and limb. If there ever is a case where one
    does, it may cause enough trouble that governments are forced to ban them. Still,
    others question whether robots going to war is even a good idea. If state-of-the-art
    machine learning algorithms can barely drive autonomous cares with a certain degree
    of safety, how can we expect a robot to accurate wage war? War has several more
    dimensions of complexity than driving down the street does. Deploying actual robo-soldiers
    seems like an unlikely use of military spending with current technology – though
    you can rest assured that major governments are researching them. A “killer robot”
    is a blanket term that is also unhelpful. Should a Predator drone be considered
    a robot any more than a tank with an autonomous turret is? Sentry guns have been
    in development for several years now and are regularly deployed into the battlefield.
    The most common of these are called close-in weapon systems (CIWS) and are used
    to protect battleships from missile and aircraft attacks. A CIWS is basically
    a large caliber cannon with a high rate of fire that is capable of shooting down
    missiles at 4,000 rounds per minute or higher. Unlike your grandfather’s anti-aircraft
    systems that may have required manual sighting, CIWS use radar guiding on a rotating
    mechanical platform to lock on targets autonomously. Not only that, but once “live”,
    the weapon system can engage without manual input after locking on. Any missile
    or aircraft that is detected by the radar system is automatically fired upon.
    In the case of the Phalanx CIWS used by the US Navy, a single 20mm Vulcan gatling
    cannon is used with computer-like accuracy. The problem of targeting is reduced
    to a simple algorithm. It doesn’t require machine learning or any other fancy
    artificial intelligence techniques. If the radar picks up an object that is approaching
    the ship, it needs first to make sure that its course is directed towards the
    ship. If the approach of the object is directly heading towards the ship, then
    the system must decide to fire. If the object is in between the minimum and maximum
    velocity range, then the cannon fires. But if the object is too slow or too fast,
    the system does nothing. Both the minimum and maximum velocity range can be programmed
    by the operator. CWIS, like the Phalanx, are considered autonomous weapons, yet
    they use very simple tech that has been around since the Gulf War. However, by
    today’s standards, this is still a “dumb” cannon. The imperfect nature of the
    weapon has been demonstrated in a few disastrous training exercises. In one instance,
    the system successfully shot down a dummy drone target, but fuel and debris from
    the explosion damaged the ship and crew members. In another instance, the dummy
    drone was shot down, but the system reengaged it as it was in free fall, inadvertently
    sending rounds in the direction of an opposite ship and injuring crew members.
    This behavior should be expected from its simple rules of operation. A more sophisticated
    weapon system could probably have avoided these incidents. But as a last resort
    missile defense system, the Phalanx does a relatively good job against isolated
    missile strikes. Other autonomous, radar-guided systems are common throughout
    the world. Again, these don’t need complicated machine learning schemes to identify
    targets and engage them. Israel’s iron-dome system of missile defense is hailed
    by some commentators as the most advanced missile defense system in the world.
    These systems demonstrate some degree of intelligence, but really all they are
    doing is calculating velocities. All things considered, the future of robotics
    is bright. Demand for robot systems will likely rise with uneven proportion to
    robotics professionals, creating well-paying jobs for those who are interested.
    There will be a glut of these jobs and a shortage of robotics designers and engineers.
    At the same time, lower-skilled jobs like robot technician and repairmen may emerge.
    Robotics will infiltrate other areas of tech like the cloud computing space and
    the internet of things. Robots connected to the cloud will lead to the creation
    of a cloud robotics marketplace were bidders can remotely program robots to perform
    certain tasks. Just like Alexa skills, these specific robot programs can be bought
    and sold in an open marketplace. Not only this, but robotics is taking on increasingly
    more important roles in business structure. A new executive position called chief
    robotics officer (CRO) will emerge for bleeding-edge organizations that make heavy
    use of robotic systems. There are split views about just how far the field or
    robotics can go when it comes to automating human tasks. Whether or not the introduction
    of these technologies leads to technical unemployment and whether they should
    be regulated is up for debate. '
