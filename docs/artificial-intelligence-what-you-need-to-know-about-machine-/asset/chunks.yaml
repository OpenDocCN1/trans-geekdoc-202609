    # 第 13 章：为什么 AI 是新的商业学位


    ## 从商科学位到 AI 学位的转变


    曾几何时，最热门的大学学位是商科学位。如果学生不知道想学什么专业，但仍想找一份像样的工作，商科学位是首选。如今，攻读 MBA 的学生过多，而攻读人工智能学位的学生却不足。商业世界面临商业知识的饱和，而人工智能领域却面临
    AI 专业知识的短缺。历史上从未有时刻像现在这样，获得专注于 AI 方法的计算机科学学位如此有利可图。许多顶尖名校现在提供专注于 AI 和全系列机器人技术的新学位，而非传统计算机科学课程中教授的通用计算知识。这意味着存在市场需求，也有大量有意向的候选人。难怪
    AI 正在迅速改变多个领域的商业面貌。


    ## 开源 AI 工具与云基础设施


    与技术相关的工作越来越要求候选人在完成其他预期职责的同时，对机器学习方法有扎实的掌握。几乎每一家主要的 AI 企业都已将其部分机器学习库开源，使从初创公司到大型企业的所有人都能以极低的前期成本创建
    AI 程序。Google 于 2015 年发布了 `TensorFlow`，此后它已成为 `GitHub` 上最受欢迎的代码库之一，而 GitHub 是当今公认的开源权威。另一个名为
    `PyTorch` 的开源库在 `Facebook` 和 `Uber` 得到广泛使用。虽然 AI 领域的小玩家受益于雇佣该领域的博士，但他们已经拥有了这些免费工具提供的创建神经网络的许多核心基础设施。这些工具的可用性进一步结合了云服务商（如
    `Amazon Web Services` 和 `Microsoft Azure`）提供的易于获取的计算资源。公司无需再投资高成本的机器学习 `GPU` 集群，只需从云端按需租用所需的处理能力即可。虽然从长远来看这些服务更昂贵，但它们仍比直接构建机器学习基础设施更容易让公司上手。


    ## 商业中的 AI 应用


    ### 聊天机器人与客户服务


    AI 工具让企业能够从事机器学习，而此前它们可能找不到用武之地。一个相对较新的趋势是在面向客户的网页上使用自动化聊天机器人软件，以实现快速简便的信息检索。客户只需输入几条文本指令，即可询问价格、可用产品和其他信息。虽然聊天机器人在发挥其全部潜力方面还有些滞后，但许多消费者正变得越来越熟悉它们。一些公司甚至雇佣人工客服来暂时充当聊天机器人的角色，直到技术成熟到足以让聊天机器人自行履行这些职责。


    ### 预测分析


    AI 技术的另一个常见应用是预测客户行为。各类公司（不仅仅是零售业）对分析的关注度处于历史最高水平。结合社交媒体营销和电子商务，分析从长远来看能为公司带来更好的客户决策。


    ### AI 优先公司


    也出现了专注于“AI”的纯粹公司，它们推销具有 AI 功能的单一产品或产品线。其中之一是 `Grammarly`，这是一项使用 AI 方法简化写作流程的在线服务。它提供简单错误的编辑、写作陷阱的提示，并建议用户如何表达才能听起来更专业。它本质上是一个用户随身携带的写作导师。另一家名为
    `Stick-Fix` 的公司利用 AI 根据一系列偏好向客户推荐服装选项。用户指定价格范围、输入尺寸、选择想要的风格，服务就会寄送一箱套装供试穿。


    ## 自动化与劳动力


    ### 制造业与机器人技术


    大公司可能利用 AI 实现系统自动化。这在制造业和劳动密集型工作中尤为明显——尽管这些工作中的许多还需要数年才能实现全面自动化。前文提到的回收厂示例在大规模应用上仍待解决。大多数自动化系统最初是辅助流水线工人，而非直接取代他们。虽然低技能工人面临因自动化而失业的高风险，但这种转变不会一夜之间发生。最可能的情况是，当机器人技术首次引入新行业时，它们将与人类员工并肩工作。这在汽车制造业中已是事实。


    ### 特斯拉案例研究


    2018 年，`Tesla Motors`（特斯拉汽车公司）因试图自动化 `Model 3`（Model 3 车型）生产的大部分环节，而受到商业领袖的严厉审视。结果是高估了自动化能力，低估了人类工人的能力。该公司利用高度自动化的工厂，未能达到预期的
    `Model 3` 月产量。此举受到业内资深人士的批评，有人称之为“新手错误”。现代机器人技术的水平仍落后于人脑的力量，尤其是人类的灵巧度。用机器人模仿人类手部操作工具时使用的相同微肌肉运动，是一个非同小可的难题。机器想要达到拥有多年经验的流水线工人那种人类级别的灵巧度，可能还需要几十年。


    ### 呼叫中心、零售业与白领工作


    然而，面临失业危险的不仅仅是流水线工人。AI 的进步，特别是在语音识别和语言处理方面，威胁要用自动化系统取代庞大的呼叫中心行业——尽管这也可能需要数十年才能发展成熟。零售业正在经历变革，自动化系统叠加在已经很高的在线销售数字之上。去实体店购物的人变少了。至少在日本等地，面向零售的机器人正在积极获得投资。即使那些享受舒适白领工作的人，也有理由提升他们的教育和技术技能。用于薪资发放、会计和账目平衡的自动化系统正在积极开发中。


    ### 对编程的影响


    未来，即使是程序员也无法幸免于 AI 的冲击。系统正在被训练执行最琐碎的编程任务，这些任务通常交给技能较低的程序员。这包括软件测试和查找 Bug——不过，与所有面临自动化威胁的事物一样，这些系统很可能会被部署在程序员身边协同工作，而不是完全取代他们。


    ## 无人驾驶技术与伦理


    无人驾驶技术也在兴起。即使在你阅读这段文字时，你也可以确信，全球目前有几家公司的自动驾驶系统正在道路上行驶，收集越来越多的数据以强化其算法。无人驾驶技术的发展很可能是能力先行，政策滞后。仅仅因为无人驾驶汽车被证明是安全的，并不意味着它们会自动被引入。存在太多灰色地带，短期内难以实现这些技术的大规模采用。2018
    年，亚利桑那州坦佩市发生了首起由 `Uber` 所有的无人驾驶汽车导致的致命事故。你可以确信，在技术完善之前，还会发生更多此类死亡事故，这正是政策制定的难点所在。历史上从未有时刻像现在这样，机器伦理被用来决定法律。即使无人驾驶汽车每年导致几百人死亡（这很可能会发生），立法者和保险公司也必须决定，这比每年导致几千人死亡是否更可取。利益相关者进行这场伦理对话，以及普通公民了解政策和当前进展，变得愈发必要。阻碍无人驾驶汽车走向主流的主要障碍将是法律，而非技术能力。


    ## AI 就业市场


    行业目前渴求精通顶级 AI 库的人才。薪酬最高的职位寻找博士和硕士毕业生，但其中很大一部分职位寻找的是任何称职的程序员。这种需求跨越了纯软件工程以外的其他行业。具备机器学习技术知识的机械工程师和电子工程师在未来几年将极受欢迎。加上对
    `internet of things`（物联网）的浅显知识，你就将成为一名极具竞争力的候选人。


    '
