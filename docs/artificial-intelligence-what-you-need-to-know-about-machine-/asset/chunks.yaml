- raw: 'Chapter 3: The Birth and Death of AI Artificial intelligence research coincided
    with the founding of the computer science field. Back then, people were less concerned
    with creating machines capable of human thought and more with creating uses for
    their early computing machines. The mathematical foundations for computer science
    and by extension artificial intelligence have been around for centuries. Boolean
    algebra was developed by George Boole in 1854. It uses the same binary concepts
    that computers use today to represent data, ones and zeroes, true and false. Boolean
    algebra was still preceded by one of the earliest computers called the Difference
    Engine, the work of English mathematician Charles Babbage in 1822. He would go
    on to design a general-purpose computing machine called the analytic engine, a
    contraption that if built would have the equivalent of 1 kilobyte of memory. The
    subsequent advances in the 19th and 20th century on formal logic and mathematics
    by thinkers like Boole, Russel, Whitehead, and Church would create the bedrock
    for AI programs. Alan Turing is credited with being the father of modern computer
    science owing to his contributions in the field. His most significant contribution
    was his paper On Computable Numbers, with an application to the Entscheidungsproblem
    , which some consider having laid the foundation for modern software programs.
    The paper described a theoretical machine that could solve any problem as long
    as it was encoded into paper tape instructions. The so-called Turing machines
    were analogous to computers, and the tape instructions were the programs. He also
    postulated that any Universal Machine could accurately simulate any Turing machine.
    In other words, a computer could run within a computer. This property would become
    known as Turing-completeness, and decades later, people would design digital computers
    that can run inside of the popular Minecraft video game. His contributions to
    artificial intelligence were contained in another paper titled Computing Machinery
    and Intelligence . In it, he postulated a computer powerful enough to simulate
    intelligence. He also devised the now famous “Turing Test” to quantify if a computer
    should be considered intelligent or not. In the test, a human is communicating
    through textual messages with an unknown person who is actually a software program.
    If the software program can respond to the human operator’s messages, such that
    the human operator believes the program to be another human, then the program
    passes the test. This test was originally developed by Turing in 1950, decades
    before artificial intelligence would go mainstream. Most people will recognize
    that the software program in question is a type of chatbot, something that has
    seen a recent resurgence in marketing circles. For Turing, all a machine had to
    do was pass this test to be considered capable of thought. The test has no bearing
    on other measures, like the ability to have self-awareness or feel emotions. In
    other words, a program could pass this test yet still not be considered an artificial
    general intelligence by today’s standards. The criteria for intelligence have
    shifted beyond possessing human-like qualities enough to fool a human operator.
    Now artificial general intelligence concerns a type of intelligence that is indistinguishable
    from a human. Alan Turing along with Alonzo Church also formulated their Church-Turing
    thesis, a hypothesis that says that any math function a human can perform on natural
    numbers must also be computable by a Turing machine with the correct algorithm.
    Not only that but that the reverse is also true. Any mathematical problem that
    a human can solve must also be solvable by a Turing machine. Generalizing this
    hypothesis essentially means that a computer can think of any abstract mathematical
    thought that a human can, given the right algorithms. It forms a basis for saying
    that computers are just as smart as humans already if solely based off logical
    computation. The difficulty lies in assessing whether all of human intelligence
    can be reduced into logical computation. If so, it is credible that a computer
    equipped with the same algorithms that a human has can reproduce any feat of human
    intelligence. There is a reason to believe that this is not the case though, as
    the human brain processes information differently than a traditional computer.
    And if you were to ask a philosopher like Rene Descartes if the theory held true,
    he would say that Church-Turing conjecture mistakes the human soul for the faculties
    of the brain. That is, that the brain and its functions are purely there for show.
    It is the soul or the mind that controls the brain and every other notion of the
    physical body. Intelligence directly permeates from the mind, a substance that
    is distinct from the body. In that case, it is unlikely that all of the human
    thought is reducible to logical thinking imparted on by the brain. Descartes would
    further say that a physical or theoretical machine could not possibly possess
    the substance of a mind. The Church-Turing thesis is simply a hypothesis that
    may be true. It has never been formally proven. It does, however, an excellent
    job of outlining a central area of contention in artificial intelligence research.
    Right around the same time that Alan Turing was making headlines for being a homosexual,
    early AI researchers were developing the first artificial neural networks. Today,
    machine learning algorithms use these artificial neural networks to learn from
    training data. The idea was simple: if we could simulate the information processing
    capabilities of the brain, then we could probably create artificially intelligent
    machines that used the same fundamental principles. But this approach too suffered
    from the questions that the Church-Turing thesis could not answer. Are all human
    thoughts reducible to mathematical functions? These early AI researches like Marvin
    Minsky and John McCarthy knew that the capabilities of computers at the time paled
    in comparison to the computational capabilities of the human brain. They must
    have known intuitively that the work they were doing with artificial neural networks
    was early stage, experimental stuff whose true potential could only be unleashed
    with the computing power of the future. Even so, they managed to do great things
    with their early AI methods. John McCarthy was actually the first person to coin
    the term “artificial intelligence”, and he along with Minsky, Allen Newell, and
    Herbert S. Simon are considered the fathers of the field. He would also organize
    the Dartmouth Summer Research Project on Artificial Intelligence in 1956, a meeting
    that is considered by many as a defining moment in the history of AI. At first,
    AI research was new and exciting. There was high optimism by these early proponents
    of AI about what was possible through neural networks. However, that optimism
    could only go so far before somebody started talking about the limits of their
    methods. Minsky has already demonstrated that neural networks could self-replicate,
    learn, and grow in many respects to how the human brain did. However, in 1969,
    Minsky and Seymour Papert published Perceptrons: An Introduction to Computation
    Geometry. In it, the authors discuss the limitations of the artificial neurons
    called Perceptrons designed by Frank Rosenblatt in a series of mathematical proofs.
    Perceptrons and derivates were extensively used in AI research during that time.
    Rosenblatt himself envisioned that the neural networks created with perceptrons
    could one day “see” images, play chess, and even reproduce with each other. But
    as Minsky and Papert pointed out in their paper, these neural networks couldn’t
    simulate some logical predicates like the XOR logical gate, which led to the belief
    that they were not suitable for AI. Following the publication of Perceptrons,
    the AI field as a whole suffered from criticism, AI pessimism, and the floundering
    of many AI research projects. The 1970s saw what was called an AI Winter, a period
    marked by reduced interest and academic funding in artificial intelligence. It
    was as if machine learning had run its course. Both government and business sector
    attitudes towards AI fell. Machines could not accurately translate human language,
    nor could they understand human speech. Researchers underestimated the difficulty
    of solving these problems by and large. Even today, natural language processing
    is an active point of research. A different type of AI called “symbolic artificial
    intelligence” or sometimes termed “good old fashioned AI” developed alongside
    with machine learning. It was based on the belief that programs should manipulate
    symbols to achieve intelligence much as humans do. This type of research cumulated
    in the creation and use of “Expert systems” – machines designed to give expert
    testimony in various fields. They supposedly could mimic the reasoning of someone
    who had mastered their field over years of practice and knowledge gathering. They
    operated on simple, symbolic rulesets that simulated the flow of if-else statements.
    As such, many didn’t consider them to be true artificial intelligence systems.
    But they nevertheless saw some success in diagnosing medical patients better than
    their doctors and played a role in certain business applications as well, such
    as configuring other computer systems and even for scheduling airline gates. However,
    these systems would eventually be phased out towards the end of AI winter. For
    whatever reason, nobody seemed to need machines that were essentially long chains
    of if-else logic. The problems they solved were outsourced to other, non-AI solutions.
    AI winter had a lasting effect on AI research. For many, it was as if AI went
    from solid research to a fad. Some would say that AI winter is still alive and
    kicking despite the many breakthroughs in machine learning. Despite the forward
    momentum AI has generated since 2010, some believe that another bout of AI winter
    (or really just the same one as before) is going to rear its ugly head in the
    future. The current machine learning schemes will also reach a limit, and the
    interest in AI will fall yet again. This sentiment of AI pessimism has a long
    history, perhaps just as old as the field itself. Many have attacked the notion
    that machines can be intelligent to devastating effect. John McCarthy believed
    that all machines could have beliefs, even simple machines like thermostats. And
    having these beliefs seemed to be a defining characteristic among machines with
    problem-solving abilities. But to say that even a thermostat has beliefs was quite
    a stretch. A stretch that his critics used to ridicule in the field. Philosopher
    John Searle famously made the argument that a machine could never become conscious,
    have a mind, or indeed understand things the way that we do. His argument, called
    the Chinese Room thought experiment, directly attacks the notion that the mind
    is a pure information processing system, the kind that the Church-Turing thesis
    requires. The thought experiment is relatively simple. Imagine that a computer
    exists which takes inputs in the Chinese language and outputs other Chinese characters
    in response. In other words, a computer that seems to understand the language.
    Next, suppose that the computer has convincingly passed the Turing test and fooled
    a human operator into believing that the computer is also human. Here, Searle
    poses the question of whether the machine truly understands Chinese or if it is
    merely simulating the ability to understand Chinese. To simulate understanding,
    all a machine would have to do is perform the correct algorithms to produce the
    correct output. For it to truly understand Chinese, though, would mean that it
    can process language like we do. This is a distinction between artificial general
    intelligence on the understanding side and narrow intelligence on the simulating
    side. Searle then says to imagine an English-only-speaking person locked inside
    a room with the same algorithms that the original Chinese machine had, but with
    instructions in English. Then the English-speaking person is giving a script of
    Chinese characters through the slit on the door and asked to perform the same
    duties that the Chinese machine does. They look over the English instructions
    for processing the Chinese characters and eventually find the correct output and
    return it under the slit. The person locked in the room can perform these calculations
    because all they need to do is recognize the different symbols, look them up,
    and derive the output. The locked person does not understand a word of Chinese,
    yet using the same algorithms that the machine had, they successfully simulated
    the ability to understand Chinese. The Chinese room says that a computer cannot
    be generally intelligent because all it does is manipulate symbols according to
    a set of instructions. Though it should be noted that the Chinese room only applies
    to digital computers, it does not exclude the possibility of artificial general
    intelligence in other substrates. The argument was originally described in a paper
    called “Minds, Brains, and Programs” published in Behavioral and Brain Sciences
    in 1980. AI winter had long been in effect up to that point, and the paper only
    helped to further AI pessimism at the time. However, this is puzzling, as most
    AI researchers in that era were not focused on artificial general intelligence.
    They were focused on applying narrow AI to interesting problems that had many
    useful applications. This is again a failure to differentiate between narrow and
    general AI. Searle’s attack did more damage than it really should have, as it
    has no bearing whatsoever on the creation of narrow AI programs. Even today, the
    amount of research being applied to narrow AI far outweighs the amount of research
    going towards general intelligence. There have since been numerous replies to
    the Chinese Room argument, many of which are just as convincing as the original. '
