    # Chapter 8: Reinforcement Learning


    Traditional machine learning schemes of supervised and unsupervised learning are
    usually pretty static – meaning that they follow set principles of data aggregation,
    neural network design, and then training. No matter what type of machine learning
    techniques are used, the system ingests the data and learns from it. The data
    can change over time, but the system doesn’t generate any data of its own.


    ## The Paradigm Shift: Reinforcement Learning


    Reinforcement learning changes all of that. While still technically a type of
    machine learning, reinforcement learning goes a step further by adding a “software
    agent” that can learn from data derived from the learned environment as well as
    generating its own feedback. A software agent is simply a robot or autonomous
    program that is designed to mimic the properties of agency in human and animal
    actors. This software agent acts as the main source of intelligence in the program.
    Instead of being fed a correct set of outputs through classified data, the agent
    learns through the simulation of reward and punishment. Because of this, reinforcement
    learning is considered a third paradigm in the machine learning sphere following
    supervised learning and unsupervised learning. As such, there are no data sets
    for training the agent. Instead, they are said to learn from environments and
    their own feedback systems.


    ## Software Agents in Action: The Maze Example


    You can imagine one possible software agent being a computer program tasked with
    finding its way out of a maze. Confronted with the same problem, a computer science
    student might use a pathfinding algorithm to find the exit, but a software agent
    operates based off little fundamental principles. It doesn’t quite know what a
    maze is, but it may be programmed to seek reward and avoid punishment. A possible
    reward in a maze, for example, is moving to a previously undiscovered cell and
    a possible punishment is going over the same cells. These reward-punishment systems
    allow the agent to eventually navigate its way to the exit of the maze – though
    the agent still doesn’t understand moving from one cell to another unless it is
    explicitly programmed.


    ## Finite State Machines (FSM)


    One possible form that these software agents are designed is through finite state
    machines (FSM). Rewards and punishments are then based on individual states that
    the machine encounters. For a maze solving program, a possible negative state
    is getting stuck in a dead end. The program will learn that it is to avoid them
    in the future like a child remembers not to touch the stove burners.


    ## Randomness and Stochastic Processes


    To begin the process of changing states, the program often needs a randomness
    function or stochastic process that simulates decision making in an unknown environment.
    There are very little scenarios a human can encounter where they have a completely
    blank slate. If we encounter a maze, we intuitively think about ways to traverse
    it. If we get put in a new and frightening environment, we consolidate knowledge
    from previous situations that may help us out. Think about those escape room puzzles
    you can solve with a group of friends. Once you are in there, presumably locked
    out, you have to find your way out by solving the clues that you are given. But
    no matter what you do in that situation, you generally have a purpose for doing
    it. Very seldom do we say that humans do things randomly. This aspect of randomness
    is a central problem in reinforcement learning because intelligence is supposed
    to be modeled after purpose, not the roll of a dice.


    ## Interdisciplinary Nature


    Unlike traditional machine learning, reinforcement learning is more akin to the
    study of decision-making. It borrows concepts from several disciplines including
    computer science, economics, neuropsychology, and mathematics.


    ## Psychological Foundations: Positive and Negative Reinforcement


    You may have heard of “positive reinforcement” if you have ever taken a psychology
    class. Notice that positive and negative reinforcement sound similar to reinforcement
    learning. That’s because they directly influence the field of reinforcement learning.
    Why does an animal or human do something – anything at all? Well, one possible
    motivator is the experience of pleasure or personal gain. On the flipside, avoiding
    negative outcomes strengthens behavior just as well, if not better.


    ## Optimization and Efficiency


    Reinforcement learning takes these concepts a bit further because it seeks to
    find optimal decisions to solutions. A software agent can visit each cell in a
    maze and still find the exit but doing so is tedious and inefficient. A better
    solution is to avoid dead ends (negative outcomes or punishment) so that the agent
    doesn’t keep stepping in cells it has already visited.


    ## Towards General Intelligence


    Because of these reasons, reinforcement learning belongs to a subset in artificial
    intelligence research that seeks simpler, general principles. If the nature of
    intelligence is simply smart decision-making, then a sufficient breakthrough in
    reinforcement learning might lead to the creation of the first general intelligence
    systems that reach or surpass human intellect. Whether reinforcement learning
    is suitable for that end is debatable, but it clearly differs from the other types
    of machine learning.


    ## Limitations


    Reinforcement learning is limited because the power of neural networks and their
    algorithms are also limited.

    '
