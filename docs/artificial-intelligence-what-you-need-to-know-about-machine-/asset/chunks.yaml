    # 第 9 章：深度学习


    ## 历史与复兴


    如果神经网络模拟了人类的思维方式，那么深度学习则将这一理念推进了一步。神经网络和人工神经元拥有悠久的历史，最早可追溯至 1950 年。但当它们最初被提出时，算力有限，人工神经网络（ANN）被视为研究玩具，而非硬核的面向业务的算法。随着算力的提升，ANN
    重新引起了 AI 研究人员以及大型互联网公司的兴趣。我们刚刚走出了持续到 1980 年代和 90 年代的 AI 研究寒冬。部分原因在于算力的提升，另一部分则归功于万维网的出现及其产生的海量数据。如今，深度学习处于
    AI 研究的最前沿，并持续取得进展，帮助该领域从寒冷中解冻。


    ## 局限性与硬件进步


    两个因素限制了人工神经网络的发展。首先是模拟人工神经元层所需的算力，其次是可用数据与特征选择的结合。例如，即使是当今最强大的 ANN 集群，其原始算力仍比人脑落后数个数量级。为机器学习引入强大的图形处理单元（GPU）极大地提升了整体可用算力。GPU
    天生比 CPU 快，因为它们倾向于优先使用更小、更高效的核心，而 CPU 的核心虽然强大但笨重。它们还允许计算任务的多线程处理，并且比 CPU 更容易执行浮点运算（小数）。尽管
    GPU 最初旨在以每秒数百帧的速度渲染 3D 图形，但它们已被 AI 社区采用，用于处理大型深度学习项目。


    ## 什么是深度学习？


    那么，究竟什么是深度学习？顾名思义，它涉及创建传统 ANN 所不具备的额外深度层。论点在于：如果大脑由层层叠叠的神经元组成，那么只有单层的脆弱 ANN 如何能模拟智能？这些有时被称为“浅层”神经网络，以区别于具有多层的网络。现在
    GPU 速度极快且每年都在变得更好，深度学习不再需要整个数据中心或神经网络集群来训练模型。回到人脑的主题，深度学习模仿了复杂观念倾向于在大脑深处的褶皱中激发神经元，而非在表层。识别图片的边缘和微小细节会激发靠近大脑表面的神经元，而识别人脸等更大的构造则会激发更深层的神经元。层数越多，系统就越智能、越强大。信息从输入神经元传递到额外的隐藏层，这些隐藏层再将输入相互传递。隐藏层越多，机器学习的效果越好。这就是为什么深度学习能够解决浅层学习传统上滞后于的
    AI 问题，包括计算机视觉、语音识别和语言处理。


    ## 非线性特征处理的力量


    深度学习的真正力量源于其对特征的非线性处理。传统机器学习技术大多使用线性模型，并在特征工程阶段遭遇困境。使用深度学习时，特征无需由领域专家挑选。相反，每个模型会选取许多不同的特征，共同构建神经网络的整体复杂度。传统分类可能只使用两三个特征，但深度学习的做法是利用数据允许的尽可能多的特征。


    例如，要检测道路上的物体是否应被视为车辆障碍物，浅层机器学习系统可以使用物体的形状及其速度作为因素。这种系统在短期内可能表现良好，成功识别静止或行驶中的不同品牌和型号的汽车。然而，系统可能会遇到一些未指定的行为，比如一个巨大的花车在众多行人周围相对缓慢地移动。仅凭形状和速度不足以对其进行分类。相比之下，深度学习系统除形状和速度外，还可能使用其他多个因素。作为基础输入，形状和速度被传递到更深的层，在那里它们还可能与道路的邻近度、行人的存在、朝向、距离相机的距离等进行比较。这些额外因素会增加模型训练时间和计算开销，但从长远来看，它能更好地识别车辆。


    ## 可扩展性与大数据


    因此，传统机器学习的范围有其极限。存在一个临界点，引入更多标记数据不再能带来系统性能的提升。然而，对于深度学习而言，增加数据直接带来更好的性能。这主要是规模问题。前者能很好地扩展到大量输入，而后者不能。难怪
    Facebook 和 Google 等“数据肥胖”公司会使用它。它们作为公司的核心价值来自于获取的数据。深度学习使它们能够利用这些数据、获得洞见并最终从中获利。深度学习算法扩展性极好的原因在于，它们更适合处理跨越许多特征的类比数据。图像、音频记录、未标记文本和视频素材这类数据与整齐的表格数据截然不同。这些类型的数据特别擅长形成特征的分层表示。由于特征无需预先选定，深度学习算法可以自行学习形成特征类别。高层学习特征将用低层学习特征来定义。


    回到车辆识别的例子，低层特征可能是汽车的某个微小定义特征，如后挡风玻璃。高层特征是这些特征的集合，如保险杠尺寸、指示灯位置和车牌区域，用于识别不同品牌。挡风玻璃较高且外观方正的车可能是
    SUV 类别，而贴近地面的可能是轿车类别。


    ## 深度学习架构：卷积神经网络


    深度学习神经网络的工作方式与常规 ANN 略有不同。这类网络中的一类称为卷积神经网络（CNN），主要用于图像识别。与其他神经网络一样，它们的设计灵感源于大脑中的生物学过程。动物利用视觉皮层通过单个皮层神经元感知光线。这些神经元中的每一个都对应视网膜上重叠的感受野。CNN
    的工作方式类似。它们由输入层和输出层以及中间的额外隐藏层组成。隐藏层使用一种称为卷积的方法来处理输入。简单来说，卷积是利用两个不同的函数创建第三个函数，以表达第一个函数如何影响第二个函数。卷积从一开始就将像素分组，使网络已经对整体图像如何拼合有一个概念。它也更容易形成特征的分层结构。这些网络首先将图像的微小边缘识别为最小的可能特征。每一层逐步向分层数据表示添加另一条边缘或中间部分，直到学习完整个图像。


    ## 缺点与行业采用


    尽管准确率提高了，深度神经网络仍存在许多缺点。深度学习处于最先进水平，并不意味着它应该推广到所有可想象的机器学习问题。对于许多任务，浅层神经网络是首选。然而，Facebook
    等大公司经常采用深度学习，因为它们拥有需求、数据和计算资源来实施它。Facebook 近期表示，它利用数十亿张数字图像来训练其深度学习系统。AI 领域的小玩家没有足够的算力在这个规模上工作。但话说回来，Facebook
    是最大的公司之一。


    Google 几年前演示了其某些系统的强大能力。据称其系统包含十亿个连接。它使用 YouTube 数据进行训练，能准确识别视频中的猫、黄花和其他图像。有趣的是，这些特征没有任何被显式选择或编程。它们的神经网络通过分层数据表示自行识别出了这些特征。此外，它能以约
    17% 的准确率识别 22,000 个不同的图像类别。考虑到类别数量以及系统在没有任何人工预先标记数据的情况下学习，这种准确率相当惊人。如果将类别数量降低到
    1,000 个，准确率可提高到 50%。


    如今，如果某个 AI 系统处于前沿阵地，它很可能正在使用深度学习。几乎所有硅谷大型科技公司都在使用它。当你对任意字符串使用 Google Translate
    时，你就在使用深度学习系统。每次你唤醒 Amazon Echo 与 Alexa 对话时，你都在使用深度学习。Google 用它来定制你的搜索体验以符合你的个人兴趣。随着时间的推移，它建立了一个名为“知识图谱”的知识数据库，包含约
    5.7 亿个不同实体和 700 亿个事实。它与 Google Search 结合使用，通过用户查询更准确地呈现用户可能寻找的数据。例如，如果你查询一位前美国总统的名字，知识图谱会汇总相关数据并在侧边栏显示。这些相关数据的小片段收集自整个网络的来源，如维基百科和
    CIA 世界概况。Google 称，通过知识图谱提供的信息能够回答其每月 1000 亿用户查询中的三分之一。如果你有幸乘坐无人驾驶汽车——没错，这也要归功于深度学习技术。


