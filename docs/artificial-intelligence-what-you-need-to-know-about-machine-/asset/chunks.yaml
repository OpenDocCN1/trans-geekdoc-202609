    # 第 14 章：AI 常见问题解答


    ## 问题：机器学习有局限性吗？


    ### 回答：

    机器学习当然有其局限性。即使使用深度学习等先进技术，这些系统仍受限于其数据和特征选择。深度学习在这方面稍微领先一些，因为特征可以自动选择。然而，机器学习只能应用于第
    6 章讨论的五大类通用问题。如果问题超出了该问题空间，那么当前的机器学习将永远无法胜任解答它。如果机器学习与问题不匹配，单纯投入更多数据将毫无用处。幸运的是，也可以说不幸的是，我们短期内不会出现机器学习机器人立法者。


    ## 问题：AI 将如何在军事上应用？


    ### 回答：

    美国五角大楼对“算法战”这一术语表现出了越来越浓厚的兴趣。这就是将机器学习方法应用于战场。它最可能用于目标选择和敌军动向预测。具有“杀伤决策”能力的自主系统无疑将从这些通用应用中发展而来——尽管如前所述，研究界对
    AI 军事化存在强烈反弹。这些武器将来可能会也可能不会被国际社会赋予非传统武器地位。即使它们获得了这种地位，大国仍将继续追求其研发。


    AI 的另一个潜在应用将是网络战，通过诡计渗透国家，以及瞄准敌国的自主武器系统。AI 算法只会增加国家行为体网络攻击的效力，AI 系统甚至可能接管敌方无人机和无人炮台。


    最后，还有利用面部识别锁定目标的迫在眉睫的威胁。推测未来的无人机袭击将针对国内目标，这并不罕见。也门的无人机袭击首次震惊了国际社会，因为它确立了在外国领土上打击目标的权利。我们尚未见到此类袭击发生在本国境内。


    ## 问题：我应该担心失业吗？


    ### 回答：

    简短的回答是：不必担心。除非你属于自动化已淘汰大量工作的特定市场垂直领域，否则你在未来十年左右可能是安全的。如果你从事的职业正是 AI 研究的活跃领域，如驾驶行业，你仍受到被称为“监管”的缓冲地带保护。如果你认真对待工作且身处这些行业，及时了解当前技术进展，尤其是法规，将大有裨益。


    自动化技术的首次引入总是在完全淘汰工人之前先辅助工人。例如，卡车司机已从定速巡航中受益。无人驾驶卡车可能仍需要车上配备操作员，以监督功能和处理计算机无法解决的极端边缘情况。如果一个疯子跳到卡车前面捣乱怎么办？如果卡车完全无人驾驶，他们更有可能这么做。潜在的黑客攻击场景也是如此。谢天谢地，对你来说，无人驾驶汽车是监管噩梦，可能在未来几十年内都不会大规模普及。


    ## 问题：我听说 AI 可以彻底改变世界，带来世界和平甚至消除贫穷。这是真的吗？


    ### 回答：

    这真的取决于你问谁，因为没人知道 30 年或 50 年后 AI 会变成什么样。与人类目标趋同的通用人工智能将能比我们更好地执行许多任务。它随后可以在无需进食或睡眠的情况下解决这些问题，以指数级速度带来进步。此类系统很可能解决当今最紧迫的问题，如气候变化和粮食物流。一些人认为它们将带来一个丰裕的新时代，人们不再需要工作。该智慧创造的财富将支撑全民基本收入。这些是最乐观的预测。


    一个更冷静的解释可能是：通用 AI 仅掌握在少数公司和政府手中，进一步加剧财富不平等。还有一种务实的解释是：通用 AI 只是一个一时的流行概念，永远不会变为现实。


    ## 问题：我总体上应该对 AI 担心到什么程度？


    ### 回答：

    对普通人来说，几乎没什么好担心的。大多数机器学习应用完全无害。虽然存在一些隐私和伦理担忧，但大多数人不会受其影响。即使军方采用这些武器系统，它们被用来对付你的风险也是渐近式的（趋近于零）。也就是说，几乎为零。


    失业可能是个担忧，但在这种情况下，你有充足的提前量去考虑可以转行到哪个行业。请记住，每一种技术的可怕应用背后，都有一种造福人类的潜在益处。想象一个世界，像
    Facebook 这样的家庭网站上移除了图形内容。想象一个世界，开车像坐飞机一样安全，年轻司机不再面临更高的死亡风险。想象一个世界，市场低效被消除，从而促进经济增长。想象一个世界，由于早期检测和先进药物发现，癌症不再是主要杀手。想象一个世界，老年人寿命更长，得到尊严和尊重的照料，不再担心虐待护理者或丧失自主权的尴尬。


    ## 问题：如果发现了通用 AI 且它真的变坏了，人类能做什么？


    ### 回答：

    像大多数棘手场景一样，预防就是治疗。相信公司正在做正确的事，以确保其系统不跑偏。未来，AI 立法将成为常见辩论话题。如果你目前不是选民，当人类命运悬于一线时，你可能会重新考虑。


    关于通用 AI 创造有一个惊人的假设：越早发现它，对人类的生存威胁就越小。因为拖得越久，它能利用的技术和系统就越好。想象一下，当通用 AI 上线时，纳米技术
    3D 打印机正在活跃使用。如果它变得失控，它可能会非常迅速地开始将地球表面转变为一台巨大的计算机。


    # 结语


    感谢你读完《人工智能：你需要了解的机器学习、机器人技术、深度学习、推荐系统、物联网、神经网络、强化学习及我们的未来》。本书应让你对 AI 有了更好的理解。希望你能看懂谈论
    AI 的网络标题，而不再感到完全无从下手。本书包含的知识足以达到这一目的，并鼓励你得出自己的结论。


    AI 领域广阔且不断变化。许多 AI 方法如遗传算法、统计推断和随机过程未在本书中涵盖，但外面有无数资源涉及这些内容。此外，你也可以在维基百科页面上找到包含当前发展的
    AI 完整历史。


    如果你希望将人工智能作为学习课程甚至职业追求，请做好大量数学和计算机编程的准备。最后，如果你觉得这本书有任何用处，在亚马逊上留个好评将不胜感激！

