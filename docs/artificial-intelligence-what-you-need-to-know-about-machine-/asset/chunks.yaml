    not have the processing power to work on that scale. But then again, Facebook
    is one of the biggest companies out there. Google demoed how powerful some of
    its systems are a few years ago. Their system purportedly consisted of one billion
    connections. It was trained using YouTube data and could accurately recognize
    cats in the videos, yellow flowers, and other images. It is interesting to note
    that none of these features were selected or programmed outright. Their neural
    networks identified them through the hierarchical data representation. Furthermore,
    it could recognize between 22,000 different categories of images with some 17%
    accuracy. That level of accuracy is quite astounding once you consider the number
    of categories and how the system learned without any human first labeling the
    data. This accuracy could be increased to 50% if the number of categories was
    lowered to 1,000. Today, if some artificial intelligence system is at the bleeding
    edge, it is probably using deep learning. Virtually all of the big Silicon Valley
    tech companies are using it. When you use Google Translate on some arbitrary string,
    you are using a deep learning system. Every time you fire up your Amazon Echo
    to speak with Alexa, you are using deep learning. Google uses it to tailor your
