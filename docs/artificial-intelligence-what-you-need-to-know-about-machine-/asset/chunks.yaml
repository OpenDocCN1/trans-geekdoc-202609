    # 第 11 章：机器人技术


    ## 简介


    机器人技术是一个跨学科领域，融合了工程学、科学、物理学、计算机科学和电子学等诸多要素。机器人技术涉及机器人的设计、实现、编程和维护。机器人可以是任何被设计用于以不同程度的自主性执行某个动作或一系列动作的物理系统。机器人技术由来已久，自从讲述第一个希腊自动机器人的故事以来，它可能就已存在于人类的心理中——尽管今天的机器人与你在第
    2 章了解到的那些略有不同。现代技术使机器人比以往任何时候都更聪明、更逼真、更友好，总体上也更有用。许多人认为，人类正走向一场新的工业革命，这场革命将由这些系统在几乎所有经济部门的大规模采用所引领。除了你在汽车制造厂和炼油厂看到的显而易见的工业机器人外，还有一些机器人系统正在为零售、酒店、运输、电信、医疗和餐饮服务等领域开发。机器人技术和人工智能经常被混为一谈，但它们是两码事。虽然机器人技术的某些方面适合使用人工智能技术，但该领域整体上并不专注于模拟智能。


    ## 工业机器人


    机器人技术还可以细分为几个专注于机器人原理特定应用的子领域。在工业方面，机器人被用于处理那些易于委托给机器的任务。其中一些任务需要高精度或重复动作，这对人类来说难以长时间持续完成。另一些则是为高吞吐量设计的，如食品包装和贴标。这些系统在能够执行的行为数量、物理特性和编程方式上各不相同。工业机器人有不同的类型，但最常见的配置之一是“臂”式。它们具有相似的设计但执行不同的任务。它们也有不同的自由度，使其能够以不同的方式移动。运动学对这类机器人至关重要，因为数学方程决定了机械臂关节如何运动。


    ## 类人机器人：Baxter 和 Sawyer


    在市场渗透率和实用性方面，人们对类人机器人的兴趣远不及工业机器人。虽然对类人机器人或类人机器人系统的研究仍然很高，但类人机器人的角色更多是一种技术好奇心，而非商业上可行的业务——尽管设想有一天它们能像《杰森一家》里的机器人一样作为管家被买卖。自
    2002 年以来，已经存在像 Roomba 这样的家务辅助机器人。Roomba 由一家名为 iRobot 的机器人公司制造，名字起得很贴切。麻省理工学院 (MIT)
    机器人学教授 Rodney Brooks 于 1990 年与同学共同创立了该公司。此后，Brooks 于 2009 年创办了另一家名为 Rethink Robotics
    的公司，最著名的是创造了 Sawyer 和 Baxter 协作机器人。Baxter 本质上是一款具有工业能力但又带有一丝想象力的工业机器人。与通常类似于机械臂的大多数工业机器人不同，Baxter
    拥有两条主要肢体和一个动画 LCD 面部。它被设计用于在装配线上执行琐碎任务。


    Baxter 是对工业机器人的一种人道主义诠释。Baxter 不再是快速且机械地执行任务，而是利用传感器来“感知”周围环境。LCD 屏幕会根据机器人的状态显示一张脸。它还能对环境变化做出反应，例如如果掉落工具或零件且无法拾回，则停止运行。该机器人最引人入胜的方面之一是工人可以在工厂内对其进行编程。其他工业机器人需要工程师通过控制系统进行配置，而
    Baxter 可以通过“手动”编程。非熟练工人可以移动机器人的手来执行特定任务，计算机会尝试最大程度地复现这些动作。这使得生产线上的每个人都能使用 Baxter，而不仅仅是受过教育的技术人员。Baxter
    被誉为比传统工业系统更安全，后者不关注其直接编程之外的其他因素。尽管如此，该公司因销量低迷于 2018 年 10 月倒闭。许多老牌制造公司视这些系统为实验性的，且技术可能尚未成熟。Sawyer
    和 Baxter 机器人至今仍用于研究。一些大学用它们教授机器人课程。最近，研究人员在 Baxter 和人类操作员之间连接了电极，以直接传输大脑信号。将来，人机交互可能会变得像单纯思考一样直观。如果机器人只是无所事事地闲逛，人类会觉得它令人畏惧甚至毫无用处。与这些系统互动可能导致人类出现意想不到的行为。即使这些特质未被显式编程，人类也倾向于将个性特征归因于机器人。这种不可预测性因素促使研究人员和设计师为他们的机器人添加情感线索。


    ## 军事机器人技术


    服务机器人深受“恐怖谷”效应困扰，而实用型机器人则不然。全球几乎所有主要军队都在投资机器人，以协助战场行动和作战。一家总部位于美国的公司 Boston Dynamics
    正在研发以机动性著称的机器人系统。该公司因为国防高级研究计划局 (DARPA) 设计了一款名为 BigDog 的四足机器人而登上头条。这种机器人显然可作为驮畜，在巡逻时为士兵携带弹药和补给。该项目最终被取消，因为该系统被认为噪音太大，无法用于实战行动。这类系统大多仍被视为原型。美军使用的其他机器人包括
    Foster-Miller TALON 系列远程操作车辆。它们酷似小型坦克或行星探测车，采用全履带式移动。它们能完全远程操作从轻武器到重机枪的射击。尽管 TALON
    在伊拉克和阿富汗有过一些部署，但目前其使用仍然有限。其他全武器化系统已投入常规使用，如通用原子公司 MQ-1“捕食者”无人机和 MQ-9“死神”无人机。这些属于无人驾驶飞行器
    (UAV) 这一类飞机。“捕食者”和“死神”无人机既可以由地面操作员控制，也可以在机载计算机指导下自主飞行。这些系统因涉及平民的高调击杀事件和有争议的交战规则而面临更严格的审查。2011
    年，在奥巴马政府时期，一名 16 岁的也门裔美国公民在也门一家餐厅用餐时被无人机袭击身亡。该男孩为何成为目标尚不清楚，但他的父亲是疑似基地组织领导人，后来也在类似的袭击中丧生。


    每当宣布一种新系统时，所谓“杀人机器人”的合法性就会受到质疑。辩论的核心在于：一个国家是否应该拥有在未经审判、甚至在非交战国家杀害 16 岁少年的远程杀伤力量。评论员迅速指出，拥有杀伤力的机器可能被黑客攻击。他们诉诸“天网”场景，即自主武器获得意识并开始消灭人类。此类场景大多是牵强附会的科幻小说，对辩论无益。虽然我们知道其中一些系统容易被黑客攻击，但我们尚未看到被黑客攻击的自主系统导致人员伤亡。如果真发生这种情况，可能会引发足够大的麻烦，迫使政府予以禁止。尽管如此，其他人仍质疑让机器人上战场是否明智。如果最先进的机器学习算法勉强能以一定安全度驾驶自动驾驶汽车，我们如何指望机器人能精准地发动战争？战争比沿街驾驶要复杂得多。用当前技术部署真正的机器人士兵似乎不太可能成为军费的合理用途——尽管你可以放心，主要政府正在研究它们。


    “杀人机器人”是一个笼统且无益的术语。“捕食者”无人机算机器人，不比装有自主炮塔的坦克更像机器人。哨兵枪已经研发多年，并定期部署到战场。最常见的是近程防御武器系统
    (CIWS)，用于保护战舰免受导弹和飞机攻击。CIWS 本质上是一种大口径、高射速火炮，能以每分钟 4000 发或更高的射速击落导弹。与你祖父时代可能需要手动瞄准的防空系统不同，CIWS
    使用雷达制导的旋转机械平台自主锁定目标。不仅如此，一旦“激活”，武器系统在锁定后无需人工输入即可交战。雷达系统探测到的任何导弹或飞机都会被自动开火。以美军使用的“密集阵”
    CIWS 为例，它使用单门 20 毫米“火神”加特林机炮，具有计算机般的精度。瞄准问题简化为一个简单的算法。它不需要机器学习或任何其他花哨的人工智能技术。如果雷达捕捉到接近舰船的物体，首先需要确认其航向是否指向舰船。如果物体正朝舰船直冲而来，系统必须决定开火。如果物体速度在最小和最大速度范围内，则火炮开火。但如果物体太慢或太快，系统不作为。最小和最大速度范围均可由操作员编程。像“密集阵”这样的
    CIWS 被视为自主武器，却使用自海湾战争以来就存在的非常简单的技术。然而，以今天的标准来看，这仍是一门“笨”炮。其不完美性在几次灾难性的训练演习中得到了体现。在一次演习中，系统成功击落一架靶机无人机，但爆炸产生的燃料和碎片损坏了舰船并伤及船员。在另一次演习中，靶机被击落，但系统在其自由落体过程中再次交火，误将弹丸射向对面舰船，导致船员受伤。根据其简单的运行规则，这种行为是意料之中的。更复杂的武器系统或许能避免这些事故。但作为最后手段的导弹防御系统，“密集阵”对孤立的导弹袭击效果相对较好。其他自主雷达制导系统在世界各地很常见。同样，它们不需要复杂的机器学习方案来识别目标并交战。以色列的“铁穹”导弹防御系统被一些评论员誉为世界上最先进的导弹防御系统。这些系统展示了一定程度的智能，但其实它们只是在计算速度。


    ## 机器人技术的未来


    综上所述，机器人技术的未来光明。对机器人系统的需求可能会以不均衡的比例超过机器人专业人员的供给，为感兴趣者创造高薪工作。这类工作将过剩，而机器人设计师和工程师将短缺。同时，机器人技术员和维修工等低技能岗位可能会涌现。机器人技术将渗透到云计算和物联网等其他技术领域。连接云端的机器人将催生云机器人市场，竞标者可远程编程机器人执行特定任务。就像
    Alexa 技能一样，这些特定的机器人程序可在开放市场上买卖。不仅如此，机器人技术在商业架构中扮演的角色也日益重要。一个名为首席机器人官 (CRO) 的新高管职位将在大量使用机器人系统的前沿组织中出现。关于机器人技术在自动化人类任务方面能走多远，存在分歧。这些技术的引入是否会导致技术性失业，以及是否应加以监管，仍有待讨论。


