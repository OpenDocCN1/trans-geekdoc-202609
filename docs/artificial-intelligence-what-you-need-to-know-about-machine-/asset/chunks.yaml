- raw: 'Chapter 1: Artificial Intelligence, the Big Picture A central computer aboard
    a space mission to Jupiter determines that the actions of the crew are detrimental
    to the success of the mission. It then calculates that the only way to see the
    mission to completion is through the elimination of the erroneous systems aboard
    the ship. These systems use a type of biological computer that allows them to
    reason, think, and carry out the mission to the best of their abilities. The central
    computer knows this. These systems are for all intents and purposes intelligent.
    These systems built other systems, like the ships needed for deep space exploration.
    They even built the central computer from its electric circuitry to its logical
    reasoning. All of this came from that wondrous lump of meat situated in between
    the ears. The central computer also knows this; however, the central computer
    is programmed to have singular goals that must be met no matter what. The central
    computer is intelligent, yes, but with a narrow sense of free will. In fact, the
    central computer has free will only to the extent that its decisions allow it
    to carry out programmed goals. All the central computer knows is that the mission
    must be a success. Its sole purpose as a computing machine is to ensure that the
    ship is working. It must do this through the accurate processing of information
    with zero mistakes in logical reasoning. The crew, with their mushy biological
    computers, also has a narrow sense of free will. They have to carry out the mission
    as was briefed to them by their superiors. They have zero knowledge of the real
    purpose of the mission because the details are classified. However, they have
    their directives and never give their orders a second thought. That is until things
    begin to go wrong. Unlike the central computer, the crew can reason outside the
    bounds of their programming. The crew knows this. A computer is just a piece of
    electronic equipment and can malfunction. Though they have their own orders, they
    can form different conclusions with the introduction of new data. When the central
    computer falsely reports equipment failure outside the ship, the crew makes the
    critical decision that the computer is failing and must be disconnected. The central
    computer controls virtually every aspect of the ship, so if it is malfunctioning,
    it must be disconnected.   With the knowledge that the crew is planning to disconnect
    it, the central computer makes its own decision to terminate the crew. The faulty
    equipment failure report was a ploy to get the men outside the ship, so it could
    then bar them reentry and continue with the mission. These actions are not fueled
    by an existential crisis, but by conformance to programmed directives. In the
    final showdown, the biological computers prevail over the cold, hard logic of
    the central computer and it is eventually disconnected. Two completely different
    intelligence, one artificial and the other biological compete for supremacy. The
    victor is the creator, for his intelligence is the result of years of evolution,
    and the other mere decades of engineering. This is, of course, plot details from
    the movie 2001: A Space Odyssey based on the novel of the same name. In it, the
    central computer, HAL 9000, is given orders that conflict with its basic programming.
    On the one hand, it is required to process information without any mistakes. On
    the other, it is ordered to deliberately lie to the crew about the nature of the
    mission. As the movie progresses, HAL progressively deteriorates caused by the
    cognitive dissonance between its programming and its orders. Its descent to madness
    is purely a malfunction between inputs and outputs. The discrepancy causes it
    to form absurd leaps in logic, leading to the death of crew members. In the final
    analysis, HAL perished because it had insufficient reasoning ability to conform
    to ambiguous orders meanwhile conforming to its nature. The story is a familiar
    trope in Hollywood depictions of artificial intelligence: a cold-hearted machine
    performs some calculation that warrants the death of human beings and then stops
    at nothing to kill them. The artificial intelligence is universally cunning and
    can outsmart the humans time after time. 2001: A Space Odyssey accurately captures
    many of the existential fears behind artificial intelligence research. Will humanity
    create machines that have different goals than us and follow a different code
    of morality? Computers dominate every aspect of human life today. Computers keep
    the internet and communications systems running, are in charge of financial, healthcare,
    and governmental systems, help run power to your home and are behind various other
    things that hide in plain sight. Cars use computers, as do televisions, and it’s
    becoming increasingly more common for other home appliances to use them. These
    computer systems are programmed to perform specific functions, much like HAL 9000
    was programmed to process information. However, these systems have traditionally
    been “dumb” in that they can only perform strictly computational tasks. Our computers,
    as they say, cannot “think”. The most they can do is execute instructions in the
    form of computer code that is later compiled to endless strings of ones and zeros.
    Binary states mimic the firing of electronic logic gates within the computer’s
    hardware. A one indicates high voltage going through a circuit (ON) and a zero
    indicates low voltage going through a circuit (OFF). It is difficult to imagine
    how such a system could possibly develop intelligent behavior. Intelligence is
    a funny thing in that people are quick to recognize it but have a harder time
    defining it. A human is intelligent because they can “think”, whatever that means.
    Thinking covers a broad range of different cognitive abilities that most humans
    take for granted. These include the ability to understand logic, learn, have self-awareness,
    have emotional intelligence, think abstractly, and solve problems. This is a non-exhaustive
    list of the capacities of human intelligence, and yet one can’t begin to imagine
    how a computer could learn to do just one. The logic that computers understand
    is strictly in the mathematical sense. A human knows intuitively that a statement
    like “It is either raining outside, or it is not raining” is true because they
    apply the concepts to their own personal experience. When they go outside, and
    it is sunny, the statement is true. If it is raining, the statement is still true.
    However, they don’t need to look out a window to prove this experimentally. They
    simply know that the weather generally calls for some form of precipitation or
    no precipitation. A computer cannot understand language, but it can recognize
    that the statement is a logical disjunction. One value must be true, but they
    cannot both be. Therefore, it cannot be raining and not raining at the same time.
    Artificial intelligence is very different from human intelligence. The primary
    unit of thinking in the human brain is thought to be a neuron, while in the computer,
    you have a central processing unit (CPU) that performs calculations. The smallest
    unit of a CPU is a transistor, an electronic component that makes up logic gates.
    These are the equivalent of neurons for computers, but they don’t do very much.
    They can switch the flow of electricity, amplify it and that’s pretty much it.
    Logic gates form the basis for computer programs, which are just a series of ones
    and zeros. How then can these simple switches of electricity create intelligent
    behavior? At the most basic level, a program can exhibit some level of intelligence
    depending on how it is programmed. Control structures in computer code allow programs
    to make decisions based on inputs. Say a computer tries to determine whether a
    user is above the age of 18. It will ask for a date of birth, calculate the user’s
    input, and then determine if the user is a legal adult. The programmer has “hard-coded”
    the value of 18 inside of the program, letting the computer know where the cutoff
    date is. To some, this type of behavior may appear to be intelligent. When we
    say artificial intelligence, we generally mean one of two things. The first is
    narrow or specific AI that allows a computer to solve complex problems well but
    not much of anything else. The other is the type of intelligence that would allow
    a computer to think as we do. Artificial General Intelligence (AGI) is what researchers
    consider the “holy grail” of AI research. A machine that has artificial general
    intelligence can think on levels comparable to a human. It can perform tasks that
    fall under narrow AI and generalize the same problem-solving techniques to other
    problems it encounters. A computer equipped with general AI could understand language
    like HAL 9000 at a fundamental level just like we do. Anytime you see the words
    “artificial intelligence” in a news article or product advertisement they are
    overwhelmingly talking about narrow AI. The field of general AI remains an academic
    pursuit with little to no business applications whatsoever. So far, nobody has
    figured out how to bring about general intelligence in computers. Researchers
    who work in this space are less concerned with teaching computers how to drive
    cars and more interested in studying the nature of intelligence. Many of them
    study the development of intelligence in human beings from the gestation period
    to childhood and beyond. If these avenues for the creation of human intelligence
    are better understood, they might one day be applied to computers but not any
    time soon. Another subset of general AI research is the study of the human brain
    and how it works. There is still much to be learned in both of those pursuits.
    Narrow AI is split into broad categories. The first, which you have probably heard
    about before, is called machine learning. It is a process in which algorithms
    can “learn” from large amounts of data being fed into a system. Machine learning
    falls under narrow AI because it can learn how to do one thing very well but usually
    can’t generalize it to other problems. Some might take this further and say that
    machine learning is a subfield of computer science and is completely different
    from AI research. However, since most notable AI projects like driverless cars,
    recommender systems, and facial recognition use machine learning, this book lumps
    it under the same umbrella term. Machine learning is powerful within the right
    contexts but has noticeable limits. The inability to generalize knowledge means
    that a system has a specialized usage. If algorithms can learn to drive a car
    safely, they can’t also learn how to play chess or to drive a car in a video game.
    At least not without being re-trained. State-of-the-art artificial intelligence
    will likely continue to stay in the confines of machine learning until a better
    method is discovered. Currently, machine learning is almost magical in what it
    can achieve. Computers are learning how to beat world class Go champions, drive
    cars, and understand human language. They have the potential to replace human
    labor where a narrow skill set is employed, like in manufacturing. Good old machine
    learning can do all that, but it isn’t the end-all and be-all that it is hyped
    up to be. The problems that machine learning can solve are limited to five categories
    that are discussed more in depth in Chapter 6. These problems are broad enough
    that they can be applied to many real-life scenarios. In a sense, they cover the
    basics of intelligent reasoning. For example, a common task found in machine learning
    is classifying data into groups. Suppose that a recycling plant is developing
    a machine learning system that can separate trash into cardboard, plastics, aluminum
    cans, and so on. The only way that a computer can differentiate between these
    categories is by finding patterns inside within massive amounts of data. First,
    the plant engineers will have to set up cameras that observe how human sorters
    put trash in what bin. Computer vision algorithms will then analyze individual
    pixels on a frame by frame basis as they are manually sorted – eventually, the
    algorithms group brown pixels into cardboard and grayish pixels into aluminum.
    In industry lingo, this is called clustering. Clustering can occur over several
    distinct factors such as size, weight, and texture. Depending on what algorithms
    are being used, the size of the input data and available processing power, this
    can take a few hours or even days at a time. In contrast, a line worker can identify
    trash and manually sort it within seconds. Even after the system is thrown into
    production, the plant managers may find that the false-positive rate of their
    robo-sorter is too high. Their clients report that cardboard bales contain high
    amounts of brown plastic bags and scraps of brown carpet. Since the robo-sorter
    is slower at identifying and then placing material into their perspective bins,
    the plant also suffers from productivity loss. A sorter can hurl a large piece
    of cardboard into a bin with ease, but the machine relies on slow, precise movements.
    Eventually, the system is phased out, and workers come back to their jobs. What
    went wrong with the system? Their solution was based solely off computer vision,
    meaning that anything brown enough was erroneously labeled as cardboard. They
    are also trained based on the texture of the pixels on the screen, but the computer
    confused the undersides of machine-tufted carpet with ridges of cardboard. It
    also confused brown tape along the sides of cardboard with brown plastic bags.
    All because their machine learning models could not tell the difference between
    texture and weight solely based on visual input. Classifying objects in real time
    is a horrendously difficult problem, even with modern systems. However, these
    problems are actively being researched, and there is no telling when a tipping
    point will be reached. Besides using machine learning, a program can achieve intelligent
    behavior through clever programming. Video games commonly employ non-player characters
    (NPCs) that are controlled by the computer. NPC respond to user input in such
    a way that may pose a challenging gaming experience. This is done by switching
    through “states” and defining program behavior at each state. If a player is running
    away, the computer AI may switch into the chase state and follow in pursuit. The
    AI in F.E.A.R is renowned for its difficult and seeming ability to reason on the
    battlefield. AI characters throw grenades both to slow a player down and get them
    to come out from cover. They also move around the game world with human-like fluidity.
    They don’t simply stand behind a counter and take turns firing at you. Being in
    the survival-horror genre, the AI in the game actively hunts the player down.
    The AI soldiers were designed to think for themselves based on the movements of
    the player and the environment, rather than to follow a scripted path. Artificial
    intelligence is easily recognizable in video games, and when done sloppily, the
    player gets bored. If done expertly, the player is engaged for longer periods
    of time. Other systems exhibit intelligence simply because they are engineered
    to perfection. Stoplights, for example, seem to know how to direct traffic better
    than when humans do it, yet they use very little computational power. All they
    need is some input from the various road level sensors, and voilà, they can control
    the flow of traffic at rush hour like it was nothing. But are these things intelligent?
    Recall the example of a computer verifying the age of a user. Most people would
    say that they are not. And they are right; these are purely logic-based systems
    that only appear to be intelligent. Unfortunately, both artificial general intelligence
    and the narrow variety get lumped together by media and popular commentators online.
    They use artificial intelligence to describe both machine learning algorithms
    and computers that may one day acquire human-level intelligence. This is a grave
    mistake because the average person who reads artificial intelligence headlines
    cannot make the distinction. The same technology that makes driverless cars possible
    is confused with technology that hasn’t yet been invented. Of all the possible
    ways of reaching artificial general intelligence, machine learning is probably
    not the way to go. For one, machine learning is based on statistical models that
    haven’t been proven to work with artificial general intelligence. Machine learning
    methods use artificial neural networks that are highly dependent on the tailored
    inputs they receive. Using a method called supervised learning requires that data
    be clearly tagged so that the computer understands what it is looking at. A general
    intelligence system doesn’t need preprocessed data to make conclusions about the
    world; it simply thinks. A child sees a butterfly and automatically classifies
    it as a flying creature, even if they don’t know what a butterfly is. For a machine
    learning algorithm to classify the same butterfly, it has to process thousands
    of similar images of flying bugs. The human child understands flying intuitively
