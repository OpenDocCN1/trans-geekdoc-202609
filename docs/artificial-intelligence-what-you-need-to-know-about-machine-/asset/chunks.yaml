    # Chapter 10: Recommender Systems


    ## Overview


    Recommender systems are used by all the major tech companies, especially those
    that are content leaning. You can be sure that YouTube, Facebook, Netflix, and
    others actively employ them into their products. They are designed such that the
    more you use these services, the more they can recommend you things that you may
    want to watch. This increases the average time spent on their site or service
    because the consumer is shown appealing video after appealing video. It also saves
    the consumer from performing a search to find what they are looking for. Who among
    us today logs in to YouTube and never touches the search bar? Many people can
    limit their YouTube session to simply watching videos on their recommended section,
    or another video that pops up in the sections underneath. As long as you are logged
    into your account, these videos are tailored to meet your interests. Even if you
    aren’t logged in, YouTube increasingly uses your IP address and other browser
    agent details to tailor the homepage based on your previous viewing habits.


    Recommender systems are actively being researched because they add value to the
    company without needing to change anything. All the content is already there –
    these systems act as a force multiplier on the profitability of that content.
    For a company to “know” who their users are and what their interests may be, they
    use filtering algorithms that compare users along system-wide user profiling techniques.


    ## Filtering Algorithms


    ### Collaborative Filtering


    The most common of these algorithms is called collaborative filtering. The differences
    can be gleaned from two online music streaming services, Last.fm and Pandora.
    The playlists or “stations” generated by Last.fm use collaborative filtering to
    find out what other users with similar music taste are manually adding to their
    libraries. A brand-new user to Last.fm will only have content that they search
    for or actively listen to. After a few days or even hours of listening to their
    favorite music, the user will receive randomly inserted music into their libraries.
    This is the result of the collaborative filtering technique looking up other users
    who listened to the same artists and finding out what other music they enjoyed
    as well. If it all goes according to plan, the new user will be satisfied with
    the recommended music and keep listening to it.


    ### Content-Based Filtering


    Another type is called content-based filtering. On the other hand, Pandora uses
    a content-filtering approach. They gather song attributes from their patented
    Music Genome Project database to find other songs and artists that overlap in
    their attributes. The database stores a mind-boggling 400 different attributes
    per song. This hodgepodge of different but similar music can then be refined by
    the user making a playlist. They simply “dislike” a song and the algorithm will
    deemphasize the songs attributes from the song selection process. The more a user
    dislikes, the more accurately the system can recommend the music they want to
    listen to. Likewise, if the user “likes” a song, then the algorithm looks for
    music with the same attributes that were liked. In Pandora’s view, all music can
    be boiled down to these 400 attributes.


    ## Privacy and Ethical Concerns


    With the current information glut online, it is no wonder that companies developed
    these systems. In theory, recommender systems are a win-win solution. The customer
    doesn’t have to sift through endless amounts of data nor do they have to suffer
    from information overload. The service provider, in turn, gets more profit.


    The main area of contention with recommender systems is that they might leak user
    information. Efforts to anonymize data in the past have met their fair share of
    criticisms by security and privacy advocates. Netflix was actually sued by a small
    group of individuals who learned that their anonymized data used in the Netflix
    Prize competition could be cross-referenced with free online resources to reveal
    their identities. Netflix went on to settle for an undisclosed amount.


    Other concerns in this space center around discrimination and possible misuse
    of collaborative filtering data. If this data isn’t anonymized, it can be linked
    to individual user accounts, meaning the company has private knowledge of the
    things you like. This, in turn, can fuel shady targeted marketing schemes.


    ## Future Directions


    The future of these systems points in a clear direction: every increasing level
    of personalization. Currently, recommender systems are isolated into the content
    world. Users like content, they can be recommended content and thus will want
    to use the service more. However, what if these systems could be generalized to
    areas that don’t focus on content? This technology combined with the internet
    of things, for example, could create the ultimate personalization climate for
    consumers.


    Recommender systems could connect to the user’s smart fridge and tap into a vast
    network of food preferences across all smart fridge owners. The smart fridge app
    could then recommend the user popular food items based on several attributes.
    Some of these apps could automatically place an order for them as well. Pandora
    uses 400 of these attributed to songs; a similar system could be developed for
    food. You can probably already imagine some of these attributes. Carbohydrate
    content, sugar content, keto friendly, diabetic food, and several others could
    contribute to healthy customized diets.

    '
