    # 第 3 章：AI 的诞生与消亡


    ## 早期数学基础


    人工智能研究与计算机科学领域的建立同步发生。当时，人们不太关心创造能够进行人类思维的机器，而更关心为其早期的计算机器寻找用途。计算机科学以及延伸出的人工智能的数学基础已存在几个世纪。布尔代数由乔治·布尔于
    1854 年开发。它使用与现代计算机表示数据相同的二进制概念：1 和 0、真与假。布尔代数甚至早于最早的计算机之一——差分机，后者是英国数学家查尔斯·巴贝奇于
    1822 年的成果。他随后设计了一种名为分析机的通用计算机器，如果建成，其存储量将相当于 1 千字节。19 世纪和 20 世纪，布尔、罗素、怀特海德和丘奇等思想家在形式逻辑和数学方面的后续进展，为
    AI 程序奠定了基石。


    ## 艾伦·图灵与计算机科学基础


    艾伦·图灵因其在该领域的贡献，被誉为现代计算机科学之父。他最重要的贡献是论文*《论可计算数及其在判定问题上的应用》*，一些人认为这为现代软件程序奠定了基础。该论文描述了一种理论机器，只要问题被编码为纸带指令，它就能解决任何问题。所谓的图灵机类比于计算机，而纸带指令则是程序。他还假设任何通用机器都能精确模拟任何图灵机。换句话说，计算机可以在计算机内部运行。这一特性被称为图灵完备性，几十年后，人们设计出了能在流行电子游戏《我的世界》中运行的数字计算机。


    ### 图灵测试


    他对人工智能的贡献包含在另一篇题为*《计算机器与智能》*的论文中。在文中，他假设了一种足够强大、能够模拟智能的计算机。他还设计了现在著名的“图灵测试”，以量化一台计算机是否应被视为智能。在测试中，一个人通过文本消息与一个未知的人交流，而这个未知的人实际上是一个软件程序。如果该软件程序能对人类操作员的消息做出回应，使得人类操作员认为该程序是另一个人类，则该程序通过测试。该测试最初由图灵于
    1950 年开发，比人工智能走向主流早了几十年。大多数人会意识到，相关的软件程序是一种聊天机器人，这在营销界最近又重新兴起。对图灵而言，一台机器只需通过此测试，即可被视为具备思维能力。该测试与其他衡量标准无关，如拥有自我意识或感受情绪的能力。换句话说，一个程序可能通过此测试，但按今天的标准仍不被视为通用人工智能。智能的标准已超越了具备足以欺骗人类操作员的人类特质。现在，通用人工智能关注的是一种与人类无法区分的智能类型。


    ### 丘奇-图灵论题


    艾伦·图灵与阿隆佐·丘奇共同提出了丘奇-图灵论题，这是一个假设：人类能在自然数上执行的任何数学函数，只要算法正确，也必须能由图灵机计算。不仅如此，反之亦然。人类能解决的任何数学问题，也必须能由图灵机解决。广义上推广这一假设，本质上意味着：给定正确的算法，计算机能思考人类能思考的任何抽象数学思想。如果仅基于逻辑计算，这构成了“计算机和人类一样聪明”这一说法的基础。困难在于评估人类所有的智力是否都能还原为逻辑计算。如果是这样，那么一台配备了人类所拥有的相同算法的计算机，就能复现人类智力的任何壮举。但有理由相信情况并非如此，因为人脑处理信息的方式不同于传统计算机。如果你问像勒内·笛卡尔这样的哲学家该理论是否成立，他会说丘奇-图灵猜想将人类灵魂误认为是大脑的机能。也就是说，大脑及其机能纯粹只是摆设。是灵魂或心智控制着大脑和物理身体的所有其他概念。智能直接渗透自心智，一种区别于身体的实体。在这种情况下，所有人类思想都不太可能还原为逻辑。换句话说，一台似乎理解语言的计算机。接下来，假设该计算机令人信服地通过了图灵测试，欺骗了人类操作员，使其相信该计算机也是人类。在这里，塞尔提出了一个问题：该机器是真正理解中文，还是仅仅在模拟理解中文的能力？要模拟理解，机器只需执行正确的算法以产生正确的输出。但要真正理解中文，意味着它能像我们一样处理语言。这是理解层面的通用人工智能与模拟层面的弱人工智能之间的区别。塞尔接着说：想象一个只说英语的人被锁在一个房间里，拥有与原始中文机器相同的算法，但说明书是英文的。然后，只说英语的人通过门缝收到一份中文字符脚本，并被要求执行中文机器相同的任务。他们查阅处理中文字符的英文说明，最终找到正确的输出并将其从门缝递回。被锁在房间里的人能执行这些计算，因为他们只需识别不同的符号，查阅它们，并推导出输出。被锁的人不懂一句中文，却利用机器拥有的相同算法，成功模拟了理解中文的能力。中文房间论证指出，计算机不可能具备通用智能，因为它所做的一切只是根据一组指令操纵符号。不过应当注意，中文房间论证仅适用于数字计算机，并不排除其他底层基础上存在通用人工智能的可能性。该论证最初发表于
    1980 年《行为与脑科学》期刊上的论文“心灵、大脑与程序”中。当时 AI 寒冬已持续许久，该论文只会进一步加剧当时的 AI 悲观情绪。然而，这令人费解，因为那个时代的大多数
    AI 研究者并不专注于通用人工智能。他们专注于将弱人工智能应用于许多有用的有趣问题。这再次是未能区分弱人工智能和通用人工智能的失败。塞尔的攻击造成的伤害比实际应有的更大，因为它对弱人工智能程序的创建毫无影响。即使在今天，应用于弱人工智能的研究量远超用于通用智能的研究量。此后针对中文房间论证出现了许多回应，其中许多与原论证一样令人信服。


