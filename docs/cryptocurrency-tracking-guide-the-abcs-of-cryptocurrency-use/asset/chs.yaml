  2019 年开始一直使用 MetaMask 钱包。


  这是你通过拥有钱包来存放代币以参与加密世界的第二步。你也可以通过连接银行信用卡或借记卡使用 MetaMask 购买任何加密货币。还有很多其他钱包，但我觉得一个就足够了。记住不要向任何人分享你的
  `private keys`（私钥）。给一点建议：大多数 DeFi 钱包无法控制你的代币，也没有权限修复你的钱包，请小心不要丢失你的 `private key`。


