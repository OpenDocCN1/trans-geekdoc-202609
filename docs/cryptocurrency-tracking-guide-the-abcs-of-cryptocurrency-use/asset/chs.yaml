  ## 引言


  如果在 2009 年`Bitcoin`诞生之初就入场并一直 `HODL`，你会成为一名百万翁；但如果你在 2017 年初其达到历史最高点（ATH）时`FOMOed`
  进入，你会被惨赔并亏光所有的钱。这就是为什么在跳入任何加密货币项目之前，`DYOR` 非常重要。好消息是，你还有第二次机会，因为我们正处于 `Bitcoin`
  和 `Ethereum` 的熊市。


  ## 背景介绍


  那是 2013 年，我在电视上看到一个大学生举着一个写有“Bitcoin”的牌子。我对此非常好奇，但仅此而已，之后我再也没有想过它。现在你可能认为我买入或持有过几个
  `Bitcoins`，但答案是否。






  ## 地址 (ADDRESS)

  地址与家庭地址或电子邮件地址非常相似。从互联网 1.0 诞生起，我们就开始使用电子邮件地址在网上发送和接收信息数据，但现在我们正在接触加密宇宙地址，用于发送和接收加密货币。这些地址由字母和数字组成，并且对于每个区块链及其原生货币或代币具有特定性。


  大多数区块链地址都是公开的，可以在区块链浏览器器上看到，以确认任何地址的进出交易。这些公开地址的例外是基于隐私的区块链，如 `Grin` 和 `Monero`。对于人类来说，读取、记忆和处理区块链地址中长长的随机字母字符串是不可能的，但请放心，计算机处理这些内容没有问题。


  尽管地址是公开的，但它们是唯一且匿名的，地址所有者的真实身份永远不会被揭露。虽然对于大多数处理加密货币的人来说如此，但大型代币项目和交易所的创始人及联合创始人的真实身份实际上已经公开。一个例子是以太坊的创始人
  `Vitalik Buterin`，他的公开地址对于所有在 `Ethereum Blockchain` 网络工作的人都是为人知的。


  ## 空投 (Airdrop)

  空投是指类似于从飞机上空投的物资或宣传传单的术语。这种策略也被加密宇宙中的新型加密货币项目用于其原生货币或代币。它通过电子形式形式分发给项目的早期采用者，以创造知名度和热度，从而为大众带来更多需求。你只需要拥有一个合规钱包，能够在预定的发布时间和日期接收空投即可。你需要为任何空投进行注册。


  ## 山寨币 (Altcoin)

  山寨币或替代代币（Alternative coin）是所有在 `Bitcoin` 之后出现的其他货币的名称。这些货币源于它们自己的区块链软件代码，通俗地说，它们是比特币的软分叉或硬分叉，即原始代码的副本。`Bitcoin
  Cash`、`Litecoin` 和 `Raven coin` 是从原始比特币代码分叉出来的山寨币示例。其他货币如 `Ethereum` 有它们自己的代码或区块链，这些区块链的创建是为了解决比特币无法解决的某些问题或故障。


  `Ethereum Blockchain` 的一个主要改进是引入了智能合约和智能属性。山寨币的诞生是为了解决其他货币面临的问题，例如扩展性，以满足处理交易的速度需求并减少此类交易收取的费用。由于迷因文化的流行，一些货币的产生仅仅是为了嘲讽比特币。催生这种迷因文化的特定山寨币是
  `Dogecoin`。


  ## ASIC (专用集成电路)

  缩写或首字母词代表 `Application-Specific Integrated Circuits`（专用集成电路）。这些特定的集成电路设计在硅片上，仅用于执行一个特殊任务，即挖掘和验证某些代码。在
  `Bitcoin` 的情况下，`asic` 根据工作量证明协议处理 `SHA-256`，以挖掘和验证每笔交易。


  ## ASIC 矿机 (ASIC MINER)

  `asic miner` 是将所有特定的集成电路与电源等其他硬件连接在一起，形成一种特殊的计算机，它只执行一项任务，即利用工作量证明协议挖掘加密货币。这些 `asic
  miners` 连接到互联网，在开启时与普通家用电脑相比往往产生巨大的噪音。由于它们运行工作量证明协议，它们往往消耗大量的电力。


  ## 历史最高 (ATH)

  缩写或首字母词 `All Time High`（历史最高）指的是加密货币达到过的最高点。这通常发生在新项目进入市场时。


  ## 历史最低 (ATL)

  缩写或首字母词 `All Time Low`（历史最低）指的是加密货币根据价格跌出的最低点。这通常发生在市场崩溃期间。


  ## 冲入 (Apeing)

  Apeing 指人们发现一个新项目并在没有彻底研究的情况下进行投资。这通常发生在加密货币领域。


  ## API (应用程序接口)

  缩写或首字母词代表 `Application Programming Interface`（应用程序编程接口）。这些软件接口集相互交互。


  ## 自动做市商 (AMM)

  缩写或首字母词代表 `Automated Market Maker`（自动做市商）。通俗地说，它是一个自主运行的软件。例如是 2018 年推出的 `Uniswap`。


  ## 比特币 (Bitcoin)

  `Bitcoin` 是由 `Satoshi Nakamoto` 在 2009 年在加密宇宙的第一种货币。这种货币原生于区块链并奖励给矿工。它是金融系统的技术颠覆者。预计世界上有
  2100 万个 `Bitcoins`，预计 2140 年将是 `Bitcoin` 被挖完的一年。尽管 `Bitcoin` 已经十年历史，但这项创新技术仍处于起步阶段。加密宇宙中的许多人将其视为类似于贵金属的价值存储。


  ## 比特币 (Bitcoin Cash)

  `Bitcoin Cash` 是一种山寨币，是 2017 年由开发者 (`DEVs`) 和加密货币矿工对 `Bitcoin` 代码的硬分叉。`BCH` 分叉是为了解决
  `Bitcoin` 代码缺乏的区块速度和扩展性问题。`BCH` 的代码将区块大小从 `1MB` 增加到 `8MB`，并在 2021 年最近升级到 `32MB`，以适应不断增长的交易速度和处理时间。






  **BCH**: 比特币（Bitcoin Cash）的缩写。它也可以被视为在中心化（CEFI`）或去中心化（DEFI`）交易所上的加密货币代码符号。


  **Bitcoiner（比特币持有者）**: 指对在投资组合中持有比特币非常有信心并看涨的个人。


  **BTC**: 比特币（Bitcoin）的缩写。它也可以被视为在中心化（CEFI`）或去中心化（DEFI`）交易所上的加密货币代码符号。


  **Bits（比特）**: 计算机中使用的基本单位；也指比特币的子单位。1 个比特币由 100 万个 `Bits` 组成。


  **Bag（包）**: 就像任何用于携带物品的包。这是一个加密货币世界的俚语，指在投资组合中持有大量特定加密货币的人。


  **Bag Holder（套牢者）**: 直接指无论市场波动如何，在投资组合中持有大量特定加密货币的投资者或个人。


  **Blockchain（区块链）**: 区块链是由中本聪（Satoshi Nakamoto）向世界介绍的一种开放软件代码技术，比特币运行在其之上。通俗地说，没有区块链就没有比特币、山寨币、NFT
  和 DeFi。它通过节点（即计算机）的共同工作进行加密安全保护，以在数字账本中记录所有交易。


  这个数字账本被复制并共享在遍布全球的计算机网络中，任何人都可以进行验证。尽管它对验证开放，但其代码受到密码学的保护且具有不可篡改性。一旦一个区块通过计算机挖掘过程完成完成或被找到，它们就会被链在一起，因此有了“区块链”一词。每种区块链技术都根据其加密代码而不同。


  **Block（区块）**: 区块是使用加密技术创建数字交易的软件代码，这些交易在节点和计算机网络中进行复制和共享。这些记录的交易存储在不可篡改的数字账本中。


  在比特币的情况下，区块是由计算机和 ASIC 矿机通过的，利用了被称为工作量证明（`P.O.W`）的过程。一些山寨币遵循与比特币相同的方法，利用工作量证明来挖掘区块，并在区块完成或在其原生区块链中被找到后获得其原生币的奖励。这些确认的区块被链在一起，因此有了“区块链”一词。


  **Block Reward（区块奖励）**: 顾名思义，就是对区块的奖励。矿工因发现区块而获得的奖励。发现区块是指计算机哈希处理或通过密码学产生一个与该特定文件唯一的代码。每个被哈希的代码都永远不会相同且具有不可篡改性，这使得数据防篡改。每个区块奖励都是其原生区块链的货币。


  **Bitcoin Whitepaper（比特币白皮书）**: 这是由中本聪在 2008 年发明、设计并编写的原始计划和协议。比特币白皮书为解决在处理电子支付时基于信任的模型产生的问题提供了答案。


  **Bear（熊）**: 这个词通常在股市中指资产价格价值的展望。它也被加密货币投资者采用，用以信号他们认为加密市场价格正向下移动或正接近熊市。


  **Bear Market（熊市）**: 熊市是指一个每种币都在失去价值的糟糕市场。当投资者由于不确定性而恐慌抛售时，会引发金融市场下跌，并将价格推至历史低点，形成更低的高点更低的低点。牛市则完全相反。


  **BTD**: 缩写代表 `Buy` the `Dip`（抄底）。这是典型的旧金融系统术语。


  **Bullish（看涨）**: 这是对市场的乐观观点。


  **Bull Market（牛市）**: 预计价格将上涨的市场。


  **CeFi**: 缩写代表中心化金融（Centralized Finance）。这是像银行之类的典型的旧金融系统。


  **Cloud mining（云矿）**: 这与云存储或向云端上传和从云端下载的概念相同。这些是具有可用计算硬件或服务器的远程数据中心，可用于挖掘加密货币。


  **Cardano（卡达达）**: 由查尔·霍斯金森（Charles Hoskinson）创立的山寨币项目，以第一位程序员女性数学家埃达·洛芙拉斯（Ada Lovelace）命名。它利用权益证明的共识协议。





  ### Crypto.com

  这是增长最快的加密货币项目之一，同时也是一个交易所或中心化金融（CeFi）。其原生币被称为 `Cro` 或 `Cronos`，在 `Cronos` 区块链上进行交易。[https://crypto.com/us/app]


  ### 加密货币

  这是一种加密互联网货币。第一种加密货币是`Bitcoin`，随后是以太坊以及其他山寨币。有些人称之为互联网货币或存在于区块链上的电子货币。它是一个点对点（P2P）去中心化系统，利用区块链技术发送和接收支付，无需银行来信任和验证交易。因此，没有政府、银行或第三方对其进行维护或控制，这就是为什么它是去中心化的原因。


  任何人都可以与陌生人进行交易而无需担心信任问题。区块链技术编写的软件是不可篡改且防篡改的，`Satoshi Nakamoto` 发明的这种技术经受了时间的考验，已经运行了十多年。警告！！！要警惕涌入加密世界的许多山寨币，因为它们是骗局和“地毯”（rug
  pull）。务必 `DYOR`（你自己的研究），并投入你亏得起的资金。


  ### 加密学

  源自希腊单词 `Krypto''s`，意为“隐藏”。它是一种利用代码加密和解密来保护信息的科学技术。这种技术允许发送者和接收者匿名且安全地通信。


  ### 加密世界

  被视为互联网的新前沿和演进。它被称为 `Cryptocosmo’s` 或 `Web-3`。它是两个单词的组合：`Crypto` 和 `Verse`。`Crypto`
  指加密，利用加密和解密代码保护信息的科学技术。`Verse` 指宇宙，以区块链技术和分布式账本技术创新的新宇宙世界形式存在，正在演变为 `Defi`、`NFT’s`
  以及人类大脑可以想象的更多方式。


  ### D


  #### DAO

  该缩写词代表去中心化自治组织。区块链技术不仅改变了我们看待钱的方式，也改变了我们控制钱的方式。“为了人民，由人民建设”这句话体现了 `DAO` 系统所能实现的。这是一个运行在区块链技术平台上的完全自主和自动化系统，不会被少数人腐败或操纵。


  自 2016 年由一些 `DEVs` 利用 `Ethereum` 区块链创立以来，它经历了第一次“火的考验”并付出了代价。`DAO` 的理念在加密世界的许多新山寨币项目中仍然存在且充满生命力。截至本文时，它仍处于婴儿阶段，随着我们的不断前进，它只会变得更好。


  #### Dapps

  该缩写词代表去中心化应用程序。正如你知道 App 如何在任何计算机系统或手机上运行一样，`Dapps` 也是如此，它们运行在去中心化的区块链技术上。你在加密世界中看到的例子包括
  `Defi` 交易所，如 `Uniswap Dex`、`Pancake Swap Dex`、`VVS Dex` 等。


  #### DaaS

  该缩写词代表去中心化金融即服务。


  #### DCA

  该缩写词代表平均成本法。这意味着你需要设定一个金额，并每天、每周或每月存到你喜欢的币或代币中，而无需担心市场的波动。如果你不在乎法币账户的短期价值，而只关注从长期来看积累更多具有加密货币价值的币或代币，那么这种投资方法就是有效的。


  #### DeFi

  该缩写词代表去中心化金融。`Satoshi Nakamoto` 向世界引入了 `Bitcoin` 和区块链技术，让我们了解到在两个个人之间进行转账时，不再需要中间人。这是一个金融的新世界，我们不再需要银行来为我们持有资金并收取收取费费用。


  任何构建在区块链技术上的金融服务，在工作量证明（`POW`）情况下奖励矿工，或在权益证明（`POS`）情况下奖励质押者并保持协议安全，都是去中心化金融。你会发现加密世界里有一句说法，我引用道：“不是你的密钥就不是你的加密货币”。只有你自己掌握你的钱，而不是银行。


  #### 去中心化

  意味着不再有中央控制或机构，如银行、机构董事会或政府。加密货币运行的区块链技术独立于任何中央控制之外。网络中的每台计算机或节点都拥有分布式账本，所有记录的交易都由所有人验证。如果一个节点离线或几台电脑掉电，网络系统不会停止；它因为去中心化而继续运行。


  #### Dogecoin

  一种诞生于迷因文化的山寨币，旨在嘲笑比特币及其区块链技术。它是一只柴犬的照片，源于一个玩笑，但最终变成了迷因文化及其在社交媒体上追随潮流。[https://dogecoin.com/]


  #### Dox

  `dox`、`doxing` 或 `doxed` 一词源于 `doc` 或 documents（文件）。它在 20 世纪 90 年代为人知，被黑客用来揭露真实身份。它以同样的方式被加密世界采用，但是出于善意，作为对社区的保证，确保其加密币或代币项目不会被“地毯”。揭项目背后人员真实身份使其更加合法，并为投资者的投资提供了坚实的保障。


  #### DYOR

  该缩写词代表“你自己的研究”。你必须进行尽职调查，并从网上所有不同的来源验证你即将投资的加密货币不会是“地毯”。有时即使在做了所有研究后也很难做出决定，也许你的直觉也会有帮助。只要小心，并永远记住只投入你愿意亏掉的钱，不要贪婪。


  #### Dip（回调）

  采用自股市图表，视为价格图表上的低谷。这意味着你的加密货币价值经历了下降，这通常是由投资者抛售引发其他人的恐慌性抛售造成的。始终留有额外资金在你喜欢的项目或加密货币上“抄底”。也不要贪婪，因为有时你买了回调，回调却持续下跌。预测市场时机永远不是好事。


  #### 分布式账本

  在加密世界中，这是由网络中的全节点保护的记录交易。这些记录的交易是不可篡改的电子数据，被称为账本，并分布在形成区块链的整个网络中。


  #### DLT

  该缩写词代表分布式账本技术。在加密世界中，这是由网络中的全节点保护的记录交易。这些不可篡改的记录电子数据被称为账本，并分布在形成区块链的整个网络中。


  ### E






  ## 以太坊

  一种由 Vitalik Buterin 在 2013 年发布白皮书的山寨币，并与其联合创始人之一 Joe Lubin 一于 2015 年推出。它与比特币的相似之处在于都利用了区块链技术，但在代码共识协议上有很大不同。比特币的区块链设计仅用于比特币作为一种价值存储的加密货币。


  另一方面，以太坊被认为是可编程的区块链，开发者和程序员可以利用智能合约在其之上构建任何 defi 应用协议。以太坊是一个旨在扩展不仅是加密货币、智能属性的视野，更是将各种中心化应用转换为去中心化应用的区块链。


  以太坊区块链用其原生货币 `Eth` 奖励矿工，由于其智能合约的应用，用户还可以创建、发布和货币化任何 defi Dapps，他们可以在那里将其代币换为 `Eth`，反之亦然。自诞生以来，它的增长非常快，加密世界的大多数代币主要存在以太坊网络上。这些代币被称为
  `ERC20` 代币，与任何使用 `Ethereum Wallet` 的人兼容。[`ethereum.org/en/`](https://ethereum.org/en/)


  ## ERC20

  这是一种利用以太坊区块链网络上的智能合约通过去中心化应用协议创建的代币。它代表以太坊请求，即任何利用以太坊区块链智能合约开发的新项目在其新代币中遵循的规则和指南。


  所有符合 `ERC20` 标准的代币都受 `Ethereum Wallets` 支持。`ERC20` 代币的示例包括 Basic Attention Token
  `BAT`、Maker `MKR`、Crypto.com CRO`、`HOGE` 等。


  ## EVM

  缩写代表以太坊虚拟机（Ethereum Virtual Machine）。所有连接到以太坊网络的节点都运行以太坊虚拟机。它们基本上是图灵完备的运行时，支持所有利用智能合约软件代码构建在以太坊区块链上的
  `Dapps`。


  ## 交易所

  交易所可以是 CEFI 中心化应用也可以是 DEFI 去中心化应用，你可以在那里交易、出售或购买任何加密货币。某些交易所有其网站的移动应用程序版本，使得个人使用比特币、山寨币或法币购买更加方便。一些交易所示例包括
  Coinbase、FTX、Crypto.com、Binance 等。


  ## F

  ## 翻转 (Flippening)

  指一种新加密货币在市值上超过旧加密货币，自 2017 年以来，投资者分析师广泛作为比特币和以太坊之间的投机性俚语。截至本文，比特币交易价格为 21k，而以太坊交易价格为
  1.6k。投机者赌注一旦 `Eth2.0` 运行，翻转将会发生。


  ## 全节点

  全节点是连接到互联网且内存足够的计算机，可以支持并运行区块链软件的完整副本。完整副本意味着它由区块头和区块组成。它们通过执行共识规则验证整个网络中的每笔交易，并在将其链在一起之前验证每个区块。


  ## 金融科技 (FinTech)

  缩写代表金融科技。随着金融领域新兴技术的快速变化和增长，适应更新高效方法的需求也随之发展。为了帮助满足日益增长的需求，旧金融机构的适应非常缓慢且不情愿，例如加密货币。这里是少数进入加密世界以帮助消费者需求的新金融科技公司：Crypto.com、Coinbase、Robinhood……等等。


  ## FOMO

  缩写代表错失恐惧症（Fear Of Missing Out）。它通常发生在投资者或任何在 YouTube、新闻、博客文章或朋友口中看到文章的人身上，在他们没有花时间去
  `DYOR`（做好自己的研究）的情况下，他们开始产生压倒性的情绪并直接冲入。贪婪也是这些情绪的主要贡献因素，是灾难的绝佳配。


  ## FOMO 购买

  这也被称为恐慌性购买，由于贪婪的压倒性情绪且对这些情绪没有任何控制。这种 FOMO 购买经常发生在可能进入市场的新投资者身上。






  ## H


  ### HODL

  该缩写或术语代表“Hold On to Dear Life”（紧握生命），或者是单词 HOLD 的拼写。这个拼写背后的故事来自一个名为 GameKyuubi 的加密投资者在
  2013 年 12 月 18 日发布在 Bitcoin talk 论坛上。他表示，由于他当时醉了且投资水平糟糕，他决定只持有他的比特币而不卖出，这就是为什么他的帖子中出现了该词的拼写错误。


  ### Hopium

  它是 Hope（希望）和 Opium（鸦片）两个词的结合。加密投资者经常在 Reddit、Telegram `etc.` 等社交媒体平台上使用 Hopium，以表达对未来巨大的希望和无法控制的乐观情绪。通俗来说，这指的是某沉浸在希望的快感中。


  ## I:


  ### ICO

  该缩写或术语代表首次代币发行（Initial Coin Offering）。该术语模仿自股票市场的首次公开募股 `IPO`。在加密世界中，它是新项目通过发行其代币或代币来筹集资金，为公司提供启动资金。这些代币可以代表持有新项目的股票或股份。


  ### Immutable（不可变）

  在加密世界中，这意味着代码一旦部署就无法被更改。分布式账本上的所有交易都在区块链上经过验证、确认和加密，并且是不可更改的。这就是为什么区块链技术被认为是解决信任代码的演进。


  ### Imperman Loss（无常损失）

  这是一种暂时的永久损失，通常指的是 DeFi 和流动性提供者。以 DeFi Uniswap 协议为例，任何人都可以交换和交易硬币或代币。为了实现这一点，存在 AMM
  流动性池使得这些交换和交易成为，从而改变了池中每种硬币的比例。


  变化可以增加也可以减少，导致硬币总量变化，同时也导致你提供的 `LP` 总量发生变化。如果与投入金额相比有所减少，意味着当你提取 `LP` 时就经历了无常损失；但如果你将其留在
  `LP` 中，则没有无常损失。


  ## J:


  ### Jager

  这是币安 BNB 币的最小单位，与比特币的最小单位非常相似，后者被称为 Satoshi 或 Sats。


  ## K:


  ### KYC

  该缩写或术语代表 `K` now `Y` `our `C` `lient（了解你的客户）。这是一种验证过程，用于识别发送或接收加密货币的钱包是否为真实人类及其诚实所有者。它主要适用于大多数中心化交易所，帮助投资者免受诈骗，并保护交易所因不遵守所在地政府的规定而被关闭。


  在加密世界中，它与项目创始人和联合创始人的身份信息（doxing）相结合进行，作为一种验证过程来确认他们是项目背后的真实人类。对于任何业务以及不断发展的加密世界来说，这是一个非常重要的过程，因为这些新资产平台几乎没有监管。它是投资者和整个加密世界的一个巨大保障。


  ## L:


  ### Light Node（轻节点）

  轻节点运行所需的内存较少，且不存储区块链的完整副本。轻节点可以在手机等设备上运行，通常依赖于全节点运行。


  ### Litecoin（莱币）

  Litecoin 是山寨币，原始比特币代码的分叉。由 MIT 毕业生、前 Google 工程师 Charlie Lee 于 2011 年开发。莱币的发行总量为
  8400 万枚，其挖矿区块的速度被认为比比特币更快。莱币进入加密世界时，被视为与比特币金标准相比的银标准币。


  ## M:


  ### Market Cap（市值）

  市值（Market Capitalization）或 `MCAP` 是市场中流通代币总量乘以其价值。这是比较哪个山寨币项目比其他项目更有曝光度和价值的极佳方法。


  ### Meme Coins（迷因币）

  这些是作为玩笑进入加密世界、基于 Meme 文化和运动的山寨币。迷因币中最流行的之一是狗狗币（Dogecoin），埃隆·马斯克本人曾在社交媒体上推过它。这些迷因币大多有一张柴犬犬、猫或任何在社交媒体上吸引了大量粉丝的动物图片。


  ### Mempool（内存池）

  该缩写代表 Memory pool（内存池）。这是所有未确认交易的所在地，这些交易尚未被矿工加入区块。如果交易在内存池中长时间未被确认，意味着矿工由于设置的手续较低未接受它们。


  ### Merkel Root（梅克尔根节点）

  这是区块内所有交易的哈希值。


  ### Message（消息）

  这是计算过程的输入，例如哈希函数。


  ### Message Digest（消息摘要）

  这是计算过程的输出，例如哈希函数的输出。


  ### Miners（矿工）

  这些是挖掘区块的全节点或独立计算机。这些独立计算机验证交易，并因验证区块而获得奖励，然后区块被添加到区块链中。


  ### Mining（挖矿）

  它是 `POW` 或工作量证明挖矿过程，通过哈希计算利用个人计算力来验证交易并将区块添加到区块链中。


  ### Mining Difficulty（挖矿难度）

  这是衡量在工作量证明系统内，任何独立计算机挖掘区块的困难程度。


  ### Minning Rig（矿机）

  这可以是一个用于挖掘加密货币的普通游戏电脑。矿机专门设计用于放置多个显卡，这些足够挖掘比特币以及所有依赖工作量证明共识的山寨币。


  ### Mooning（暴涨）

  这是许多加密货币投资者在社交媒体平台上的号，表示特定山寨币或迷因币的价格快速上涨。它与“飞向月球”有关，意味着这种硬币将直冲月球。


  ### Multisig（多重签名）

  这是两个词 `Multi` 和 `Sig` 的结合。`Multi` 源于原意为“多个”，而 `sig` 源于“签名”。它在加密世界中意味着多重签名。这被用作安全措施，需要多个签名才能访问钱包内的资金。它向社区确保资金不会由一个人控制。


  ## N:


  ### NaaS

  该缩写或术语代表节点即服务（Node as a Service）。


  ### NFT

  该缩写或术语代表非同质化令牌（Non Fungible Token）。这些是位于区块链上的非常独特的加密令牌，用于将数字艺术品和更多现实实体或或代币化。由于其加密唯一性，每个
  `NFT` 代码都是不相同的，用于证明区块链上数字资产的所有权。


  非同质化代币改变了世界在销售、购买和持有艺术品、房地产以及任何有价值的实体资产领域的业务方式。所有这些现实实体资产将通过区块链上安全的且不可更改的智能合约来表示，作为真实的数字证书。


  ### Node（节点）

  节点也可以称为主节点、全节点或轻节点。节点是连接到加密世界并帮助保护区块链的计算机。该计算机连接到互联网，并有足够的内存支持并运行区块链软件代码的完整副本。完整副本意味着它由区块头和区块交易组成。


  ## P:






  ## P2P

  该缩写代表点对点（Peer to Peer），即通过共享和通信连接的个人之间的连接。这种互联能力是在去中心化架构内实现的。


  ## 恐慌抛售 (Panic Sell)

  当加密货币由于恐惧、不确定和怀疑（即 `FUD`）的消息而卖出他们的代币时。加密世界充满了 `FUDster`（也称为 `FUD 传播者`）。他们通过制造恐慌来操纵代币价格，从而导致弱势和缺乏信息的持有者出现恐慌抛售。


  ## Polygon

  这是一个第 2 层项目，连接到以太坊的第 1 层区块链 `PoW`（即将转变为 `PoS` 共识）。由于以太坊系统的拥堵和运行缓慢，Polygon 的移动是为了解决这一问题，并提供比以太坊昂贵费用更廉的交易费用。它的原生代币被称为
  `Matic`。[`polygon.technology/`](https://polygon.technology/)


  ## PoS

  该缩写代表权益证明（Proof of Stake）。与 `PoW` 共识相比，这是一种更环保的区块处理方法。它通过利用参与者加密货币的质押，并根据选定的验证者或节点通过交易费奖励来回报质押行为。


  ## PoW

  该缩写代表工作证明（Proof of Work）。矿工利用个人计算力或通过 `ASIC` 矿场消耗大量的电量，在寻找区块的过程中相互竞争。通过这种共识证明，工作证明向世界展示了它的行之有效，并且它是不可篡改且安全的。


  ## 私钥 (Private Key)

  这是钱包密钥对中的私有部分，证明你是加密货币的合法所有者。它还用于允许你访问区块链以转移或花费加密货币资产。你不能让任何人访问你的 `private key`，否则你将丢失所有硬币。


  ## 公钥 (Public Key)

  这是钱包密钥对中的公共部分，用于创建接收传入加密货币的地址。当有人向你支付或空投某些代币时，你可以提供一个地址接收任何入入交易。


  ## 推高崩盘 (Pump and Dump)

  加密货币投资者通过对特定的山寨币项目进行大规模炒作来推高项目，这导致人们产生 `FOMO`（恐恐惧症），从而推高代币的价值和价格。让新投资者觉得他们找到了开启新
  `LAMBO` 的钥匙。然后他们开始卖出并抛售他们的代币，导致投资者之间出现大规模恐慌抛售并引发崩盘。新且毫无防备的投资者只剩下了一堆毫无价值的币。


  ## R

  ## Radix DLT

  该缩写代表 Radix 数字账本技术。`Radix DLT` 是一种 `PoS` 共识协议。`Radix` 协议是一种底层协议，类似于以太坊、`Cardano`、`Solana`、`Cosmos`、`Polkadot`
  和 `XRP` 等一些底层 `PoS` 共识协议。`Radix DLT` 声称解决了困扰包括以太坊在内的大多数底层 `PoS` 协议的问题。其创始人 Vitalik
  Buterin 提到其为去中心化、安全性和扩展性的三难题因素问题。[`www.radixdlt.com/`](https://www.radixdlt.com/)


  ## Ravencoin

  这是一种山寨币，也是比特币的硬叉。它通过其矿工继续使用工作证明共识。`Ravencoin` 项目不允许使用 `ASIC` 来挖掘其区块，与比特币不同，这意味着任何拥有足够电脑的人都可以挖掘
  `Ravencoin`。[`ravencoin.org/`](https://ravencoin.org/)


  ## S

  ## Satoshi

  这是比特币的最小单位。


  ## 软叉 (Soft Fork)

  软叉是对原始区块链源代码进行的更改，这些更改是微小的且彼此仍然保持兼容性。这通常是为了帮助改进区块链的某些功能，并在不大幅改变区块链结构的情况下添加新的修改。此类软叉的一个例子是比特币的
  `Segwit` 升级。


  ## 柴犬币 (Shiba Inu Token)

  M 因币项目中市值最大的项目之一，为了杀死狗狗币而引入。[`shibatoken.com/`](https://shibatoken.com/)


  ## Solidity

  这是以太坊用于在其区块链上编写智能合约的编程语言。


  ## 稳定币 (Stable Coins)

  稳定币顾名其名：一种价值稳定的币。这些币与美元等法币或其他加密货币的价值挂钩。


  ## 质押 (Staking)

  这是权益证明（即 `PoS` 共识）的一种奖励方式，奖励特定山寨币项目内所有质押加密货币以支持区块链并帮助维护其安全性的参与者。这类似于奖励 `PoW` 共识系统上的矿工。


  ## 硬手 (Strong Hands)

  在加密世界也被称为 `Diamond hands`（钻石手），是指 `HODL` 加密货币投资者。他们长期投资，不担心市场的波动，特别是当 `FUDsters`
  操纵币价导致恐慌抛售者离场时。


  ## T

  ## 交易者 (Trader)

  加密世界中的交易者是指交易加密货币的人。


  ## Tx

  该缩写代表交易（Transaction）。当你传输加密货币时，会形成一笔交易并永久记录在区块链上。这些交易是分层的，并在通过工作证明或权益证明的过程经过验证和确认后记录形成一个区块。


  ## 代币 (Token)

  代币或加密货币代币没有自己的区块链，除非它是构建并迁移到独立运行的。一旦它迁移到自己的区块链，它就变成了该区块链的原生币，那时它不再是代币而是币。很困惑，对吧，我打赌你是这样了，让我举个例子。比特币是币而不是代币，因为它是自己区块链的原生币。


  以太坊的币被称为 `Ether` (`Eth`)，它是以太坊区块链的原生币，但也有其他项目利用智能合约构建以太坊区块链之上。这些项目使用 `ERC-20` 代币，这意味着它们与
  `Ether` 币兼容或绑定。此类代币的示例包括 `Chainlink` (`Link`)、`Basic attention token` (`BAT`)、`USDT`
  (`Tether`) 等。


  ## 图灵完备的 Turing Complete

  这意味着计算机系统能够解决复杂的算法语言，只要它有足够的时间内存、必要的指令和可用资源。


  ## U

  ## 未确认交易 (Unconfirmed Transaction)

  未确认交易是指任何在队列中或 `mempool`（即内存池）中等待确认的交易。一旦交易被节点确认和验证，它将被添加到区块链中。这通常发生在某些如以太坊的区块链上，因为其费用昂贵。所以如果你发送一笔卖出或购买特定代币的交易，你需要足够的燃料费（gas
  fees）来让你的交易通过，否则它会在队列中等一会儿。


  ## V

  ## 波动性 (Volatility)

  在加密世界中，波动性是指所有加密货币价值和价格从最高点（ATH）到最低点（ATL）以及反之的快速移动和剧烈变化。加密货币对于日内交易者和新手来说非常有波动性，特别是当你没有进行自己的调查（DYOR）。


  ## W






  ## 加密货币术语表


  **WAGMI**: 这个缩写代表 `We Are Gonna Make It`（我们将会成功的）。加密货币世界的投资者总是在追逐下一个让他们瞬间暴富的代币或代币。现实中，他们往往会惨赔（rekt），损失的资金比想象的要多，并继续使用这些词来缓解他们对加密货币市场的恐惧、不确定性和怀疑（FUD）。这就是为什么在进入加密世界之前，`DYOR`（进行自己的研究）并学习非常重要。


  **Wallet（钱包）**: 就像你用来携带身份证和法币的普通钱包一样，这是一个电子钱包。它是存储用于访问加密货币的公钥和私钥的电子钱包。钱包可以是热钱包（连接到互联网）或冷钱包（未连接互联网）。你也可以将它们写在纸上并储放在安全的地方。


  **Whales（巨鲸）**: 这个名字被用来持有大量比特币或山寨币的个人或投资者群体。他们在加密货币市场中的任何操作都会导致币价的巨大变化。他们被加密货币市场波动性的操纵者。


  ## Y


  **YOLO**: 这个缩写代表 `You Only Live Once`（人生只活一次）。这是社交媒体上许多人的口号，也已进入加密货币世界。当它意味着抓住当下、享受每一分钟时，它是积极的；但如果被用来为你加密货币投资中的情绪化决策寻找合理理由，它就是坏的。


  也许仅仅因为直觉就对一个新项目 `YOLO`（梭一把）会带给你财富也可能不幸，但如果是好运，那一切都是值得的。不要为你自己的决定埋怪别人。这就是为什么在对任何加密货币进行
  `FOMO`（恐恐错过）和 `YOLO` 之前，`DYOR` 非常重要。


  ## Z


  **Zero Confirmation Txn（零确认交易）**: 这等同于未确认交易。


  ## 结论


  现在你已经通过学习一些缩写迈出了第一步，你已经走到了这里，也许你只是因为好奇直接跳到了末尾，答案在这里。我将指导你如何打开一个电子钱包（也称为热钱包）。点击此链接
