    # 加密货币术语表


    **WAGMI**: 这个缩写代表 `We Are Gonna Make It`（我们将会成功的）。加密货币世界的投资者总是在追逐下一个让他们瞬间暴富的代币或代币。现实中，他们往往会惨赔（rekt），损失的资金比想象的要多，并继续使用这些词来缓解他们对加密货币市场的恐惧、不确定性和怀疑（FUD）。这就是为什么在进入加密世界之前，`DYOR`（进行自己的研究）并学习非常重要。


    **Wallet（钱包）**: 就像你用来携带身份证和法币的普通钱包一样，这是一个电子钱包。它是存储用于访问加密货币的公钥和私钥的电子钱包。钱包可以是热钱包（连接到互联网）或冷钱包（未连接互联网）。你也可以将它们写在纸上并储放在安全的地方。


    **Whales（巨鲸）**: 这个名字被用来持有大量比特币或山寨币的个人或投资者群体。他们在加密货币市场中的任何操作都会导致币价的巨大变化。他们被加密货币市场波动性的操纵者。


    ## Y


    **YOLO**: 这个缩写代表 `You Only Live Once`（人生只活一次）。这是社交媒体上许多人的口号，也已进入加密货币世界。当它意味着抓住当下、享受每一分钟时，它是积极的；但如果被用来为你加密货币投资中的情绪化决策寻找合理理由，它就是坏的。


    也许仅仅因为直觉就对一个新项目 `YOLO`（梭一把）会带给你财富也可能不幸，但如果是好运，那一切都是值得的。不要为你自己的决定埋怪别人。这就是为什么在对任何加密货币进行
    `FOMO`（恐恐错过）和 `YOLO` 之前，`DYOR` 非常重要。


    ## Z


    **Zero Confirmation Txn（零确认交易）**: 这等同于未确认交易。


    ## 结论


    现在你已经通过学习一些缩写迈出了第一步，你已经走到了这里，也许你只是因为好奇直接跳到了末尾，答案在这里。我将指导你如何打开一个电子钱包（也称为热钱包）。点击此链接
    `[`metamask.io/`](https://www.google.com/url?q=https://metamask.io/&sa=D&source=editors&ust=1661372152492966&usg=AOvVaw1ztzhYUYUCk81bhbusLUzC)`
    这将带你进入 MetaMask 钱包网站。你可以下载钱包并将其添加到浏览器。Metamask 有大量的 YouTube 视频会教并引导你。我分享这个是因为我从
    2019 年开始一直使用 MetaMask 钱包。


    这是你通过拥有钱包来存放代币以参与加密世界的第二步。你也可以通过连接银行信用卡或借记卡使用 MetaMask 购买任何加密货币。还有很多其他钱包，但我觉得一个就足够了。记住不要向任何人分享你的
    `private keys`（私钥）。给一点建议：大多数 DeFi 钱包无法控制你的代币，也没有权限修复你的钱包，请小心不要丢失你的 `private key`。


    这本书是一本活书，随着加密世界的演变，我将继续添加新词汇。与互联网早期相比，我们还处于加密世界的非常早期。你花时间学习它，我感到非常兴奋。你是加密世界真正的先驱，所以请关注我在下一书中将揭示的
    10 个代币供你投资。如果你喜欢这本书，请留下评价。


