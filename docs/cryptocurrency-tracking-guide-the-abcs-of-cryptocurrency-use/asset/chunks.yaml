  trans: '


    ### Crypto.com

    这是增长最快的加密货币项目之一，同时也是一个交易所或中心化金融（CeFi）。其原生币被称为 `Cro` 或 `Cronos`，在 `Cronos` 区块链上进行交易。[https://crypto.com/us/app]


    ### 加密货币

    这是一种加密互联网货币。第一种加密货币是`Bitcoin`，随后是以太坊以及其他山寨币。有些人称之为互联网货币或存在于区块链上的电子货币。它是一个点对点（P2P）去中心化系统，利用区块链技术发送和接收支付，无需银行来信任和验证交易。因此，没有政府、银行或第三方对其进行维护或控制，这就是为什么它是去中心化的原因。


    任何人都可以与陌生人进行交易而无需担心信任问题。区块链技术编写的软件是不可篡改且防篡改的，`Satoshi Nakamoto` 发明的这种技术经受了时间的考验，已经运行了十多年。警告！！！要警惕涌入加密世界的许多山寨币，因为它们是骗局和“地毯”（rug
    pull）。务必 `DYOR`（你自己的研究），并投入你亏得起的资金。


    ### 加密学

    源自希腊单词 `Krypto''s`，意为“隐藏”。它是一种利用代码加密和解密来保护信息的科学技术。这种技术允许发送者和接收者匿名且安全地通信。


    ### 加密世界

    被视为互联网的新前沿和演进。它被称为 `Cryptocosmo’s` 或 `Web-3`。它是两个单词的组合：`Crypto` 和 `Verse`。`Crypto`
    指加密，利用加密和解密代码保护信息的科学技术。`Verse` 指宇宙，以区块链技术和分布式账本技术创新的新宇宙世界形式存在，正在演变为 `Defi`、`NFT’s`
    以及人类大脑可以想象的更多方式。


    ### D


    #### DAO

    该缩写词代表去中心化自治组织。区块链技术不仅改变了我们看待钱的方式，也改变了我们控制钱的方式。“为了人民，由人民建设”这句话体现了 `DAO` 系统所能实现的。这是一个运行在区块链技术平台上的完全自主和自动化系统，不会被少数人腐败或操纵。


    自 2016 年由一些 `DEVs` 利用 `Ethereum` 区块链创立以来，它经历了第一次“火的考验”并付出了代价。`DAO` 的理念在加密世界的许多新山寨币项目中仍然存在且充满生命力。截至本文时，它仍处于婴儿阶段，随着我们的不断前进，它只会变得更好。


    #### Dapps

    该缩写词代表去中心化应用程序。正如你知道 App 如何在任何计算机系统或手机上运行一样，`Dapps` 也是如此，它们运行在去中心化的区块链技术上。你在加密世界中看到的例子包括
    `Defi` 交易所，如 `Uniswap Dex`、`Pancake Swap Dex`、`VVS Dex` 等。


    #### DaaS

    该缩写词代表去中心化金融即服务。


    #### DCA

    该缩写词代表平均成本法。这意味着你需要设定一个金额，并每天、每周或每月存到你喜欢的币或代币中，而无需担心市场的波动。如果你不在乎法币账户的短期价值，而只关注从长期来看积累更多具有加密货币价值的币或代币，那么这种投资方法就是有效的。


    #### DeFi

    该缩写词代表去中心化金融。`Satoshi Nakamoto` 向世界引入了 `Bitcoin` 和区块链技术，让我们了解到在两个个人之间进行转账时，不再需要中间人。这是一个金融的新世界，我们不再需要银行来为我们持有资金并收取收取费费用。


    任何构建在区块链技术上的金融服务，在工作量证明（`POW`）情况下奖励矿工，或在权益证明（`POS`）情况下奖励质押者并保持协议安全，都是去中心化金融。你会发现加密世界里有一句说法，我引用道：“不是你的密钥就不是你的加密货币”。只有你自己掌握你的钱，而不是银行。


    #### 去中心化

    意味着不再有中央控制或机构，如银行、机构董事会或政府。加密货币运行的区块链技术独立于任何中央控制之外。网络中的每台计算机或节点都拥有分布式账本，所有记录的交易都由所有人验证。如果一个节点离线或几台电脑掉电，网络系统不会停止；它因为去中心化而继续运行。


    #### Dogecoin

    一种诞生于迷因文化的山寨币，旨在嘲笑比特币及其区块链技术。它是一只柴犬的照片，源于一个玩笑，但最终变成了迷因文化及其在社交媒体上追随潮流。[https://dogecoin.com/]


    #### Dox

    `dox`、`doxing` 或 `doxed` 一词源于 `doc` 或 documents（文件）。它在 20 世纪 90 年代为人知，被黑客用来揭露真实身份。它以同样的方式被加密世界采用，但是出于善意，作为对社区的保证，确保其加密币或代币项目不会被“地毯”。揭项目背后人员真实身份使其更加合法，并为投资者的投资提供了坚实的保障。


    #### DYOR

    该缩写词代表“你自己的研究”。你必须进行尽职调查，并从网上所有不同的来源验证你即将投资的加密货币不会是“地毯”。有时即使在做了所有研究后也很难做出决定，也许你的直觉也会有帮助。只要小心，并永远记住只投入你愿意亏掉的钱，不要贪婪。


    #### Dip（回调）

    采用自股市图表，视为价格图表上的低谷。这意味着你的加密货币价值经历了下降，这通常是由投资者抛售引发其他人的恐慌性抛售造成的。始终留有额外资金在你喜欢的项目或加密货币上“抄底”。也不要贪婪，因为有时你买了回调，回调却持续下跌。预测市场时机永远不是好事。


    #### 分布式账本

    在加密世界中，这是由网络中的全节点保护的记录交易。这些记录的交易是不可篡改的电子数据，被称为账本，并分布在形成区块链的整个网络中。


    #### DLT

    该缩写词代表分布式账本技术。在加密世界中，这是由网络中的全节点保护的记录交易。这些不可篡改的记录电子数据被称为账本，并分布在形成区块链的整个网络中。


