    # 以太坊

    一种由 Vitalik Buterin 在 2013 年发布白皮书的山寨币，并与其联合创始人之一 Joe Lubin 一于 2015 年推出。它与比特币的相似之处在于都利用了区块链技术，但在代码共识协议上有很大不同。比特币的区块链设计仅用于比特币作为一种价值存储的加密货币。


    另一方面，以太坊被认为是可编程的区块链，开发者和程序员可以利用智能合约在其之上构建任何 defi 应用协议。以太坊是一个旨在扩展不仅是加密货币、智能属性的视野，更是将各种中心化应用转换为去中心化应用的区块链。


    以太坊区块链用其原生货币 `Eth` 奖励矿工，由于其智能合约的应用，用户还可以创建、发布和货币化任何 defi Dapps，他们可以在那里将其代币换为 `Eth`，反之亦然。自诞生以来，它的增长非常快，加密世界的大多数代币主要存在以太坊网络上。这些代币被称为
    `ERC20` 代币，与任何使用 `Ethereum Wallet` 的人兼容。[`ethereum.org/en/`](https://ethereum.org/en/)


    # ERC20

    这是一种利用以太坊区块链网络上的智能合约通过去中心化应用协议创建的代币。它代表以太坊请求，即任何利用以太坊区块链智能合约开发的新项目在其新代币中遵循的规则和指南。


    所有符合 `ERC20` 标准的代币都受 `Ethereum Wallets` 支持。`ERC20` 代币的示例包括 Basic Attention Token
    `BAT`、Maker `MKR`、Crypto.com CRO`、`HOGE` 等。


    # EVM

    缩写代表以太坊虚拟机（Ethereum Virtual Machine）。所有连接到以太坊网络的节点都运行以太坊虚拟机。它们基本上是图灵完备的运行时，支持所有利用智能合约软件代码构建在以太坊区块链上的
    `Dapps`。


    # 交易所

    交易所可以是 CEFI 中心化应用也可以是 DEFI 去中心化应用，你可以在那里交易、出售或购买任何加密货币。某些交易所有其网站的移动应用程序版本，使得个人使用比特币、山寨币或法币购买更加方便。一些交易所示例包括
    Coinbase、FTX、Crypto.com、Binance 等。


    # F

    ## 翻转 (Flippening)

    指一种新加密货币在市值上超过旧加密货币，自 2017 年以来，投资者分析师广泛作为比特币和以太坊之间的投机性俚语。截至本文，比特币交易价格为 21k，而以太坊交易价格为
    1.6k。投机者赌注一旦 `Eth2.0` 运行，翻转将会发生。


    ## 全节点

    全节点是连接到互联网且内存足够的计算机，可以支持并运行区块链软件的完整副本。完整副本意味着它由区块头和区块组成。它们通过执行共识规则验证整个网络中的每笔交易，并在将其链在一起之前验证每个区块。


    ## 金融科技 (FinTech)

    缩写代表金融科技。随着金融领域新兴技术的快速变化和增长，适应更新高效方法的需求也随之发展。为了帮助满足日益增长的需求，旧金融机构的适应非常缓慢且不情愿，例如加密货币。这里是少数进入加密世界以帮助消费者需求的新金融科技公司：Crypto.com、Coinbase、Robinhood……等等。


    ## FOMO

    缩写代表错失恐惧症（Fear Of Missing Out）。它通常发生在投资者或任何在 YouTube、新闻、博客文章或朋友口中看到文章的人身上，在他们没有花时间去
    `DYOR`（做好自己的研究）的情况下，他们开始产生压倒性的情绪并直接冲入。贪婪也是这些情绪的主要贡献因素，是灾难的绝佳配。


    ## FOMO 购买

    这也被称为恐慌性购买，由于贪婪的压倒性情绪且对这些情绪没有任何控制。这种 FOMO 购买经常发生在可能进入市场的新投资者身上。


    '
