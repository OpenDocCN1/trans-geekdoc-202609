- raw: "BCH:  The abbreviation or acronym for Bitcoin Cash. This can also be recognized\
    \ as its cryptocurrency ticker symbol on Centralized (CEFI) or Decentralized (DEFI)\
    \ exchanges. \n\nBitcoiner:  Refers to an individual or person that is very confident\
    \ and bullish on holding bitcoin in their portfolio. \n\nBTC:  The abbreviation\
    \ or acronym for Bitcoin. This can also be recognized as its cryptocurrency ticker\
    \ symbol on Centralized (CEFI) or Decentralized (DEFI) exchanges. \n\nBits:  They\
    \ are basic units used in computing; they are also used in reference to the subunits\
    \ of a bitcoin. One bitcoin consists of 1 million Bits. \n\nBag:  Just like any\
    \ regular bag that is used to carry things. It is a cryptoverse slang referring\
    \ to someone or person carrying a large amount of certain cryptocurrencies in\
    \ their portfolio. \n\nBag Holder:  A bag holder directly refers to an investor\
    \ or person that holds a large amount of a specific cryptocurrency in their portfolio\
    \ regardless of the market volatility. \n\nBlockchain:  A blockchain is the innovative\
    \ technology of open software code introduced to the world by Satoshi Nakamoto\
    \ that Bitcoin runs on. In layman’s terms without blockchain there is no Bitcoin,\
    \ Altcoin, NFT’s and Defi. It is cryptographically secured by nodes aka computers\
    \ working together to record all transactions in a digital ledger. \n\nThis digital\
    \ ledger is copied and shared across the whole network of computers all throughout\
    \ different parts of the world that anyone can verify. Even though it's open to\
    \ verification the code is secured by cryptography and it is immutable. Once a\
    \ block is completed or found through the process of computer mining they are\
    \ chained together hence the word blockchain. Every blockchain technology is different\
    \ based on its cryptographic code. \n\nBlock:  A block is the software code that\
    \ uses cryptography to create digital transactions which are copied and shared\
    \ across a network of nodes and computers. These recorded transactions are held\
    \ in a digital ledger which are immutable. \n\nIn the case of Bitcoin the blocks\
    \ are formed by the computers and asics mining, utilizing the process called proof\
    \ of work (P.O.W). Some altcoins follow the same method as bitcoin utilizing proof\
    \ of work to mine for the blocks and get rewarded once the block is completed\
    \ or found in its own blockchain native coin. These confirmed blocks are chained\
    \ together hence the word blockchain. \n\nBlock Reward:  It is as straightforward\
    \ as it is said to be a reward for a block. Rewards received by the miners for\
    \ finding a block. Finding a block is when a computer hashes or cryptographically\
    \ produces a code that is unique to that particular file. Every code hashed will\
    \ never be the same and it's immutable which makes the data tamper proof. Every\
    \ block reward is coins native to their own blockchain. \n\nBitcoin Whitepaper:\
    \  It is the original plan and protocol invented, designed and written by Satoshi\
    \ Nakamoto in 2008. The bitcoin whitepaper gave the world the answer in addressing\
    \ the problems in the trust based model when processing electronic payments. \n\
    \nBear:  This word usually refers to the stock market in regards to the outlook\
    \ of the prices of assets and their values. It is also adopted by cryptocurrency\
    \ investors to signal the belief that the crypto market prices are moving in a\
    \ downward direction or approaching a bearish market. \n\nBear Market:  A Bear\
    \ Market refers to a bad market where every coin is losing its values. When investors\
    \ panic sell due to uncertainty it trickers a decline in the financial market\
    \ and moves the prices to all time low making lower highs and lower lows. A Bull\
    \ market is the total opposite of a Bear market. \n\nBTD:  The abbreviation or\
    \ acronym stands for  B uy  T he  D ip. You will hear these three letter words\
    \ used a lot by crypto investors, especially the day traders. Buying the dip helps\
    \ bring down your average when you bought in high and also adds more to your bag.\
    \ \n\nBull/Bullish:  This is an optimistic view towards the value of the market\
    \ as in stocks and also in the cryptoverse. A metaphorical usage of the term to\
    \ describe how a Bull will attack by thrusting its horns upwards. As the graph\
    \ moves upwards it is said that the cryptocurrency is in a Bull market which means\
    \ profits are being made. I feel very bullish about the Cryptoverse. \n\nBull\
    \ Market:  A Bull market is the sign of a good market where market prices are\
    \ moving up or trending in the upwards direction. In cryptocurrency a Bull market\
    \ means the value of your coins are moving up which means you are making money\
    \ or gaining profits. A Bull market is always the total opposite of a Bear market.\
    \ \n\nC:\n\nCardano:  An Altcoin Blockchain project named after a 15th century\
    \ Italian polymath Gerlamo Cardano. Founded by Charles Hoskinson a former Ethereum\
    \ cofounder in 2015 which operates on its own Blockchain and incorporates smart\
    \ contracts in its code. It utilizes a consensus protocol of proof of stake which\
    \ is considered greener than proof of work. Its native cryptocurrency is called\
    \ ADA named after a female mathematician Ada Lovelace who was considered the first\
    \ computer programmer of the 19th century.  [](https://www.google.com/url?q=https://cardano.org/&sa=D&source=editors&ust=1661372152437587&usg=AOvVaw0eAN6YsTBziQN8R09YLDrr)\
    \   [https://cardano.org/](https://www.google.com/url?q=https://cardano.org/&sa=D&source=editors&ust=1661372152437861&usg=AOvVaw3j528-sDWXdEpXCQOxgPAX)\
    \ \n\nCeFi:  The abbreviation or acronym stands for  Ce ntralized  Fi nance. This\
    \ is your typical old traditional financial system like the Banks. The adoption\
    \ of Bitcoin and Altcoin brought about the involvement of some major players in\
    \ the cryptoverse to deal with swapping, trading and exchanges of cryptocurrencies.\
    \ One example of such centralized finance is Coinbase and Crypto.com. Layman’s\
    \ terms this is banking for cryptocurrencies. \n\nCloud mining:  This is the same\
    \ concept as storage in the cloud or upload to and download from the cloud. These\
    \ are remote data centers with available computing hardware or servers that can\
    \ be utilized to mine cryptocurrency. So anyone can log in from anywhere in the\
    \ world to this platform for a certain amount of fees and can mine any type of\
    \ cryptocurrencies using the cloud. \n\nCold Storage:  This is considered the\
    \ safest way to store your cryptocurrency wallet from online hackers. You can\
    \ either have your cryptocurrency stored in a Hard wallet by downloading it into\
    \ a USB thumb drive or write it down on paper also called a paper wallet. Remember\
    \ to keep it safe, secure and know where you kept it. \n\nCold Wallet:  A cryptocurrency\
    \ wallet that is cold which means it is not connected to the internet. This is\
    \ typical offline cold storage. \n\nCoin:  A coin or cryptocurrency-coin is the\
    \ native coin of its own blockchain. Do not confuse a coin with a token. Most\
    \ importantly it really does not matter how you use it, you will not get punished\
    \ but for the sake of learning and understanding you have to know the difference\
    \ between the two. So a coin has its own blockchain and a token does not have\
    \ one. \n\nCPU Mining:  This stands for Central Processing Unit or CPU mining.\
    \ This was the first way Satoshi Nakamoto mined the first 50 Bitcoin on the Bitcoin\
    \ Blockchain. The process by which the Central Processing Unit hashes out algorithmic\
    \ coded transactions within its computational power creates a lot of heat which\
    \ becomes unsuitable for CPU mining as the difficulty increases. It evolved to\
    \ GPU and ASIC mining as they are faster and are able to withstand the heat from\
    \ the mining process. One example of an altcoin cryptocurrency that uses CPU for\
    \ mining is MONERO. "
