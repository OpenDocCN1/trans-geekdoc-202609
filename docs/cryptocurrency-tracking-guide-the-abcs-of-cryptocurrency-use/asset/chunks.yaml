    # P2P

    This acronym stands for Peer to Peer or from one person to another person interconnected
    by sharing and communicating. This interconnect ability is done within the decentralized
    architecture.


    # Panic Sell

    When cryptocurrency investors sell their coins due to news of Fear, Uncertainty
    and Doubt aka `FUD`. The cryptoverse is full of `FuDster` also known as the `FUD
    messenger`. They maneuver to cause panic in order to manipulate the price of the
    coin which in turn creates panic sell of weak and uninformed hands.


    # Polygon

    This is a layer 2 project that is connected to Ethereum''s layer 1 blockchain
    `PoW` soon to be `PoS` consensus. Due to the congested and slowness of Ethereum’s
    system, Polygon moved to solve this issue and provide cheaper transaction fees
    as compared to the expensive fees charged by Ethereum. Its native token is called
    `Matic`. [https://polygon.technology/](https://polygon.technology/)


    # PoS

    The acronym stands for Proof of Stake. It is a greener processing block method
    in comparison to `PoW` consensus. By utilizing the staking of participants'' cryptocurrencies
    and rewarding them for staking in terms of transaction fee rewards based on selected
    validators or nodes.


    # PoW

    The acronym stands for Proof of Work. The miners utilize individual computing
    power or via `ASIC`’s mining farms burning through a tremendous amount of electricity
    competing with each other in finding a block. Through this consensus proof of
    work has shown the world that it works and it is immutably safe and secure.


    # Private Key

    This is the private part of the wallets key pair that proves you are the rightful
    owner of the cryptocurrencies. This is also used to allow you access to the blockchain
    in order to transfer or spend the cryptocurrency assets. You cannot allow anyone
    access to your `private key` or you will lose all your coins.


    # Public Key

    This is the public part of the wallets key pair that is used to create an address
    to receive incoming cryptocurrencies. This is when you are able to provide an
    address for any incoming transactions if someone is either paying you or airdropping
    some coins.


    # Pump and Dump

    When cryptocurrency investors pump a project up through manipulation of a great
    hype within specific altcoin projects which causes people to `FOMO` in which in
    turn Moons the coins value and price. Making new investors feel like they have
    found the keys to their new `LAMBO`. Then they start selling and dumping their
    coins causing a massive panic sell amongst the investors causing a dump. The new
    and unsuspecting investors are left with bags of coins that are worthless.


    # R

    ## Radix DLT

    This acronym stands for the Radix Digital Ledger Technology. `Radix DLT` is a
    `PoS` consensus protocol. `Radix` protocol is a layer one protocol like that of
    Ethereum, `Cardano`, `Solana`, `Cosmos`, `Polkadot` and `XRP` to name a few layer
    one `PoS` consensus protocol. `Radix DLT` claims to have solved the problems that
    have plagued the majority of layer one `PoS` protocols including Ethereum. Vitalik
    Buterin its founder mentioned it as the trilemma factor problems of Decentralization,
    Security and Scalability. [https://www.radixdlt.com/](https://www.radixdlt.com/)


    ## Ravencoin

    This is an altcoin and a hard fork of Bitcoin. It continues to use Proof of Work
    consensus through its miners. The `Ravencoin` project does not allow the use of
    `ASIC`’s to mine its blocks unlike Bitcoin which means anyone with a decent computer
    can mine `Ravencoin`. [https://ravencoin.org/](https://ravencoin.org/)


    # S

    ## Satoshi

    This is the smallest unit of Bitcoin.


    ## Soft Fork

    A soft fork is the changes made to the original blockchain source code that are
    minor and are still compatible with each other. This is usually done to help improve
    certain functionalities to the blockchain and add new modifications without major
    changes to the blockchain structure. One example of such a soft fork is the Bitcoin
    `Segwit` upgrade.


    ## Shiba Inu Token

    One of the biggest market cap in Meme Coin projects that was introduced to kill
    Dogecoin. [https://shibatoken.com/](https://shibatoken.com/)


    ## Solidity

    This is a programming language used by Ethereum to write smart contracts on its
    blockchain.


    ## Stable Coins

    Stable coins means exactly what it is: a coin that is stable in its value. These
    coins are pegged to the value of fiat money like the US dollar or other cryptocurrencies.


    ## Staking

    This is a way for proof of stake aka `PoS` consensus to reward all participants
    within a specific altcoin project that stake their cryptocurrencies to support
    the blockchain and help maintain its security. It is similar to rewarding miners
    on a `PoW` consensus system.


    ## Strong Hands

    Also known in the cryptoverse as `Diamond hands` are the cryptocurrency investors
    that are `HODLers`. They invest long term and do not worry about the volatility
    of the market especially when the `FUDsters` manipulate the price of the coin
    causing panic sellers to exit their position.


    # T

    ## Trader

    A trader in the cryptoverse is someone that trades cryptocurrency.


    ## Tx

    The abbreviation or acronym stands for Transaction. When you transfer cryptocurrencies
    a transaction is formed and permanently recorded on the blockchain. These transactions
    are layered and recorded forming a block after it is verified and confirmed either
    through the process of proof of work or proof of stake.


    ## Token

    A token or a cryptocurrency-token does not have its own blockchain unless it is
    built and migrated to live on its own. Once it migrates to its own blockchain
    it becomes native coin of such blockchain then it is no longer a token but a coin.
    Confusing, yes I bet you are so let me give you an example. Bitcoin is a coin
    not a token because it is the native coin to its own blockchain.


    Ethereum''s coin is called `Ether` (`Eth`) and it is native to the Ethereum Blockchain
    but there are other projects built utilizing smart contracts on top of the Ethereum
    blockchain. This project uses what is called the `ERC-20` token which means they
    are compatible or tied to the `Ether` coin. Examples of such tokens are `Chainlink`
    (`Link`), `Basic attention token` (`BAT`), `USDT` (`Tether`) and much more.


    ## Turing Complete It means that a computer system that is capable of solving
    complex algorithmic computational languages as long as it has time with powerful
    memory, the necessary instructions and available resources to do it.


    # U

    ## Unconfirmed Transaction

    An unconfirmed transaction is any transaction that is waiting in line or `mempool`
    aka memory pool to be confirmed. Once the transaction is confirmed and validated
    by the nodes then it will be added to the blockchain. This usually happens to
    some of the blockchains like the Ethereum network because of the expensive fees.
    So if you send a transaction like selling or buying a certain token you will need
    to fork up enough gas fees to get your transactions through or it will just sit
    in line for a while.


    # V

    ## Volatility

    In the cryptoverse, volatility is the rapid movements and aggressive changes in
    the values and prices of all cryptocurrencies from the ATH to ATL and vice versa.
    Cryptocurrency is well known to day traders and Noops to be very volatile especially
    if you do not DYOR.


    # W

    '
  trans: '


    # P2P

    该缩写代表点对点（Peer to Peer），即通过共享和通信连接的个人之间的连接。这种互联能力是在去中心化架构内实现的。


    # 恐慌抛售 (Panic Sell)

    当加密货币由于恐惧、不确定和怀疑（即 `FUD`）的消息而卖出他们的代币时。加密世界充满了 `FUDster`（也称为 `FUD 传播者`）。他们通过制造恐慌来操纵代币价格，从而导致弱势和缺乏信息的持有者出现恐慌抛售。


    # Polygon

    这是一个第 2 层项目，连接到以太坊的第 1 层区块链 `PoW`（即将转变为 `PoS` 共识）。由于以太坊系统的拥堵和运行缓慢，Polygon 的移动是为了解决这一问题，并提供比以太坊昂贵费用更廉的交易费用。它的原生代币被称为
    `Matic`。[`polygon.technology/`](https://polygon.technology/)


    # PoS

    该缩写代表权益证明（Proof of Stake）。与 `PoW` 共识相比，这是一种更环保的区块处理方法。它通过利用参与者加密货币的质押，并根据选定的验证者或节点通过交易费奖励来回报质押行为。


    # PoW

    该缩写代表工作证明（Proof of Work）。矿工利用个人计算力或通过 `ASIC` 矿场消耗大量的电量，在寻找区块的过程中相互竞争。通过这种共识证明，工作证明向世界展示了它的行之有效，并且它是不可篡改且安全的。


    # 私钥 (Private Key)

    这是钱包密钥对中的私有部分，证明你是加密货币的合法所有者。它还用于允许你访问区块链以转移或花费加密货币资产。你不能让任何人访问你的 `private key`，否则你将丢失所有硬币。


    # 公钥 (Public Key)

    这是钱包密钥对中的公共部分，用于创建接收传入加密货币的地址。当有人向你支付或空投某些代币时，你可以提供一个地址接收任何入入交易。


    # 推高崩盘 (Pump and Dump)

    加密货币投资者通过对特定的山寨币项目进行大规模炒作来推高项目，这导致人们产生 `FOMO`（恐恐惧症），从而推高代币的价值和价格。让新投资者觉得他们找到了开启新
    `LAMBO` 的钥匙。然后他们开始卖出并抛售他们的代币，导致投资者之间出现大规模恐慌抛售并引发崩盘。新且毫无防备的投资者只剩下了一堆毫无价值的币。


    # R

    ## Radix DLT

    该缩写代表 Radix 数字账本技术。`Radix DLT` 是一种 `PoS` 共识协议。`Radix` 协议是一种底层协议，类似于以太坊、`Cardano`、`Solana`、`Cosmos`、`Polkadot`
    和 `XRP` 等一些底层 `PoS` 共识协议。`Radix DLT` 声称解决了困扰包括以太坊在内的大多数底层 `PoS` 协议的问题。其创始人 Vitalik
    Buterin 提到其为去中心化、安全性和扩展性的三难题因素问题。[`www.radixdlt.com/`](https://www.radixdlt.com/)


    ## Ravencoin

    这是一种山寨币，也是比特币的硬叉。它通过其矿工继续使用工作证明共识。`Ravencoin` 项目不允许使用 `ASIC` 来挖掘其区块，与比特币不同，这意味着任何拥有足够电脑的人都可以挖掘
    `Ravencoin`。[`ravencoin.org/`](https://ravencoin.org/)


    # S

    ## Satoshi

    这是比特币的最小单位。


    ## 软叉 (Soft Fork)

    软叉是对原始区块链源代码进行的更改，这些更改是微小的且彼此仍然保持兼容性。这通常是为了帮助改进区块链的某些功能，并在不大幅改变区块链结构的情况下添加新的修改。此类软叉的一个例子是比特币的
    `Segwit` 升级。


    ## 柴犬币 (Shiba Inu Token)

    M 因币项目中市值最大的项目之一，为了杀死狗狗币而引入。[`shibatoken.com/`](https://shibatoken.com/)


    ## Solidity

    这是以太坊用于在其区块链上编写智能合约的编程语言。


    ## 稳定币 (Stable Coins)

    稳定币顾名其名：一种价值稳定的币。这些币与美元等法币或其他加密货币的价值挂钩。


    ## 质押 (Staking)

    这是权益证明（即 `PoS` 共识）的一种奖励方式，奖励特定山寨币项目内所有质押加密货币以支持区块链并帮助维护其安全性的参与者。这类似于奖励 `PoW` 共识系统上的矿工。


    ## 硬手 (Strong Hands)

    在加密世界也被称为 `Diamond hands`（钻石手），是指 `HODL` 加密货币投资者。他们长期投资，不担心市场的波动，特别是当 `FUDsters`
    操纵币价导致恐慌抛售者离场时。


    # T

    ## 交易者 (Trader)

    加密世界中的交易者是指交易加密货币的人。


    ## Tx

    该缩写代表交易（Transaction）。当你传输加密货币时，会形成一笔交易并永久记录在区块链上。这些交易是分层的，并在通过工作证明或权益证明的过程经过验证和确认后记录形成一个区块。


    ## 代币 (Token)

    代币或加密货币代币没有自己的区块链，除非它是构建并迁移到独立运行的。一旦它迁移到自己的区块链，它就变成了该区块链的原生币，那时它不再是代币而是币。很困惑，对吧，我打赌你是这样了，让我举个例子。比特币是币而不是代币，因为它是自己区块链的原生币。


    以太坊的币被称为 `Ether` (`Eth`)，它是以太坊区块链的原生币，但也有其他项目利用智能合约构建以太坊区块链之上。这些项目使用 `ERC-20`
    代币，这意味着它们与 `Ether` 币兼容或绑定。此类代币的示例包括 `Chainlink` (`Link`)、`Basic attention token`
    (`BAT`)、`USDT` (`Tether`) 等。


    ## 图灵完备的 Turing Complete

    这意味着计算机系统能够解决复杂的算法语言，只要它有足够的时间内存、必要的指令和可用资源。


    # U

    ## 未确认交易 (Unconfirmed Transaction)

    未确认交易是指任何在队列中或 `mempool`（即内存池）中等待确认的交易。一旦交易被节点确认和验证，它将被添加到区块链中。这通常发生在某些如以太坊的区块链上，因为其费用昂贵。所以如果你发送一笔卖出或购买特定代币的交易，你需要足够的燃料费（gas
    fees）来让你的交易通过，否则它会在队列中等一会儿。


    # V

    ## 波动性 (Volatility)

    在加密世界中，波动性是指所有加密货币价值和价格从最高点（ATH）到最低点（ATL）以及反之的快速移动和剧烈变化。加密货币对于日内交易者和新手来说非常有波动性，特别是当你没有进行自己的调查（DYOR）。


    # W


