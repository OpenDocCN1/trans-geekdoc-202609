    ### Crypto.com

    This is one of the fastest growing altcoin projects that is also an exchange or
    CeFi. Its native coin is called `Cro` or `Cronos` which transact on its `Cronos`
    blockchain. [https://crypto.com/us/app]


    ### Cryptocurrency

    It is an encrypted internet money. The first cryptographic-currency is `Bitcoin`
    followed by Ethereum and the rest of other Altcoins. Some people call it internet
    money or electronic money which lives on the blockchain. It is a peer to peer
    (P2P) decentralized system that utilizes blockchain technology to send and receive
    payments without the need for a bank to trust and verify the transaction. So no
    government, bank or third party maintains or controls it hence why it''s decentralized.


    Any person can transact with an unknown person without worrying about trust. The
    software coded in the blockchain technology is immutable and tamper proof which
    `Satoshi Nakamoto` invented has withstood the test of time and has been running
    for more than a decade now. Warning!!! Be wary of many altcoins that are flooding
    the cryptoverse because they are scams and rug pull. Always `DYOR` do your own
    research and invest money you can afford to lose.


    ### Cryptography

    Originated from the Greek word `Krypto''s` meaning hidden. It is the science technique
    used to secure information utilizing code encryption and decryption. This technique
    allows for the sender and recipient to communicate anonymously and securely.


    ### Cryptoverse

    Considered the new frontier and the evolution of the internet. It is also known
    as the `Cryptocosmo’s` or `Web-3`. It is the combination of two words which is
    `Crypto` and `Verse`. `Crypto` refers to cryptography, the science technique used
    to secure information utilizing encrypted and decrypted codes. `Verse` refers
    to the Universe in the form of a new cosmic world of Blockchain Technology and
    Distributed Ledger Technology innovations that is evolving into `Defi`, `NFT’s`
    and many more ways the human mind can imagine.


    ### D


    #### DAO

    The abbreviation or acronym stands for Decentralized Autonomous Organization.
    Blockchain Technology not only revolutionized the way we look at money but it
    also revolutionized the way we control it. The saying “ By the people for the
    people” holds truth to what a `DAO` system can do. A fully autonomous and automated
    system that operates on the blockchain technology platform which cannot be corrupted
    or manipulated by a few.


    Since its inception in 2016 by some `DEVs` utilizing the `Ethereum` blockchain
    it went through its first trial by fire and it burned. The idea of a `DAO` is
    still well and alive through the cryptoverse in a lot of the new altcoin projects.
    It is still in its infancy stage as of this writing and it will only get better
    as we move forward.


    #### Dapps

    The abbreviation or acronym stands for Decentralized Applications. Just as you
    know how Apps run on any computer system or smartphone it is also the same as
    `Dapps` except they run on decentralized blockchain technology. Some of the examples
    you can see in the cryptoverse are `Defi` exchanges like `Uniswap Dex`, `Pancake
    Swap Dex`, `VVS Dex` and more.


    #### DaaS

    The abbreviation or acronym stands for Decentralized Finance as a Service.


    #### DCA

    The abbreviation or acronym stands for Dollar Cost Averaging. This means that
    you have to set a dollar amount and deposit it to your favorite coin or token
    daily, weekly or monthly without worrying about the ups and down of the market.
    This method of investing works if you do not care about the short term value of
    your fiat account but only focus on accumulating more of the coin or token in
    cryptocurrency value for the long term.


    #### DeFi

    The abbreviation or acronym stands for Decentralized Finance. `Satoshi Nakamoto`
    introduced `Bitcoin` and Blockchain technology to the world where we learned that
    we no longer need a middleman in the case of money transfer between two individuals.
    This is the new world of finance where we no longer need a bank to hold our money
    and charges us a fee for holding it.


    Any financial services built on blockchain technology that rewards its miners
    in the case of proof of work (`POW`) or stakeholders in the case of proof of stake
    (`POS`) and keeping the protocol secure is a Decentralized Finance. You will learn
    that there is a saying in the cryptoverse and I quote “ Not your Keys not your
    cryptos”. You alone are in charge of your money, not the bank.


    #### Decentralized

    It means no more central control or authority like Banks, Board of directors of
    an institution or Government. Blockchain technology which cryptocurrency runs
    on is autonomous from any central control. Every computer or nodes in the network
    owns the distributed ledger and all recorded transactions are verified by all.
    The network system will not stop if one node is offline or a few computers lose
    power; it will continue to operate because of its decentralization.


    #### Dogecoin

    An Altcoin born out of the meme culture to make fun of Bitcoin and its blockchain
    technology. It is a picture of a Shiba Inu Dog that was created out of a joke
    but eventually became the fad for the meme culture and its following on social
    media. [https://dogecoin.com/]


    #### Dox

    The word `dox`, `doxing` or `doxed` derived its originality from the word `doc`
    or documents. As it was known in the 1990’s and used by hackers to reveal one''s
    true identity. It has been adopted in the cryptoverse in the same manner but in
    a good faith as an assurance to the community that its crypto coin or token project
    will not be rug pulled. By revealing the true identities of the people behind
    the projects makes it more legit and it gives the investors a solid guarantee
    to their investments.


    #### DYOR

    The abbreviation or acronym stands for Do Your Own Research. You will have to
    do your due diligence and verify from all different sources online that the cryptocurrency
    that you are about to invest in will not be a rug pull. Sometimes it''s even hard
    to make a decision after all the research you have done so maybe your gut feeling
    would also help. Just be careful and always remember to spend only the money you
    are willing to lose and don''t be greedy.


    #### Dip

    Adopted from the stock market charts and seen as a valley on the price charts.
    This means that the value in price of your cryptocurrency experienced a decline
    and it''s usually caused by investors selling their positions followed by a mass
    panic sell by others. Always have extra money available to buy the dip on your
    favorite project or cryptocurrency. Don’t be greedy either because sometimes you
    buy the dip and the dip keeps dipping. Timing the market is never a good thing
    to do.


    #### Distributed Ledger

    In the cryptoverse this is the recorded transactions secured by full nodes in
    the network system. These recorded transactions are immutable electronic data
    which are called ledgers and are distributed throughout the whole network of nodes
    forming a blockchain.


    #### DLT

    The abbreviation or acronym stands for Distributed Ledger Technology. In the cryptoverse
    this is the recorded transactions secured by full nodes in the network system.
    These immutable recorded transactions of electronic data are called ledgers and
    are distributed throughout the whole network of nodes forming a blockchain.


