    # Ethereum

    An Altcoin introduced by Vitalik Buterin with its whitepaper in 2013 and launched
    in 2015 with one of its cofounder Joe Lubin. It shares similarities as Bitcoin
    which is the utilization of Blockchain Technology but is very much different in
    its code consensus protocols. Bitcoins blockchain was designed only for bitcoin
    as a storage of value cryptocurrency.


    Ethereum on the other hand is considered the programmable blockchain where developers
    and programmers can build on top of it any defi application protocol utilizing
    smart contracts. Ethereum is a Blockchain designed with the purpose to expand
    the views of not only cryptocurrencies, smart properties but the transformation
    of all sorts of centralized applications into decentralized applications.


    The Ethereum Blockchain rewards its miners with `Eth`, its native coin and because
    of its smart contract applications users can also create, publish and monetize
    any defi Dapps where they can exchange their tokens for `Eth` coins and vice versa.
    Since its inception it has grown so fast that the majority of the tokens in the
    cryptoverse mainly reside on the Ethereum network. These tokens are called `ERC20`
    tokens which are compatible with anyone that uses an `Ethereum Wallet`. [https://ethereum.org/en/](https://ethereum.org/en/)


    # ERC20

    It is a token that is created by a Decentralized Application protocol utilizing
    smart contracts on the Ethereum blockchain network. It stands for Ethereum Request
    for Comment of rules and guidelines to be followed by any new project that is
    developed utilizing smart contracts on the Ethereum blockchain for their new tokens.


    All `ERC20` compliant tokens are supported by `Ethereum Wallets`. Examples of
    the `ERC20` tokens are Basic Attention Token `BAT`, Maker `MKR`, `Crypto.com CRO`,
    `HOGE` and many more.


    # EVM

    The abbreviation or acronym stands for Ethereum Virtual Machine. All nodes that
    are connected to the Ethereum network run the Ethereum Virtual Machine. They are
    basically Turing complete runtime environments which support all `Dapps` built
    on the Ethereum Blockchain utilizing the smart contract software code.


    # Exchange

    An exchange is either a CEFI centralized application or DEFI decentralized application
    where you can trade, sell or buy any cryptocurrency. Some exchanges have mobile
    application versions of their websites which makes it more convenient for any
    individual to buy using bitcoin, altcoin or fiat money. Examples of some exchanges
    are Coinbase, FTX, Crypto.com, Binance and more.


    # F

    ## Flippening

    This refers to a new cryptocurrency overtaking the old cryptocurrency by price
    market value and is widely used by investor analysts as a speculative colloquial
    since 2017 between Bitcoin and Ethereum. As of this writing Bitcoin is trading
    at 21k while Ethereum is trading at 1.6k. Speculative investors are betting the
    flippening will happen once `Eth2.0` is up and running.


    ## Full Node

    A full node is a computer connected to the internet with enough memory that can
    support and run a complete copy of the blockchain software code. The complete
    copy meaning it consists of the Block Header and Block transactions. They verify
    every transaction throughout the network by enforcing the consensus rules and
    also validate each block before they chain it together.


    ## FinTech

    The abbreviation and acronym stands for Financial Technology. As the rapid changes
    and growth of emerging technology in finances evolved so as the need for adapting
    newer efficient ways. To help serve the rising needs of consumers, old financial
    institutions are very slow and reluctant to adapt as in the example of Cryptocurrency.
    Here are just a few new FinTech companies that made the move into the cryptoverse
    to help with consumer demands. Crypto.com, Coinbase, Robinhood.. and more.


    ## FOMO

    The abbreviation and acronym stands for Fear Of Missing Out. It usually happens
    to investors or anyone that comes across an article on YouTube, news, a blog post
    or word of mouth from a friend without taking the time to `DYOR` they start to
    have overwhelming emotions and jump right in. Greed is also a major contribution
    to these emotions and is a great recipe for disaster.


    ## FOMO Buying

    This is also called panic buying due to the overwhelming emotions of greed and
    without any control over such emotions. This FOMO buying happens a lot to new
    investors that might have come into a particular cryptocurrency late but now want
    to get more in their bags. It also creates the opposite when the price of their
    cryptocurrency and bags start to dip, they will panic sell and they will lose
    money.


    # G

    ## Gas

    The Ethereum blockchain charges a transaction fee, these fees are called gas and
    are measured in `Gwei`.


    ## Gwei

    This is the smallest denomination of `Ether`. This blend of words stands for `G`-giga
    and `Wei`-Wei Dai the founder of `B-money` and predecessor to Bitcoin who brought
    about the concept of modern cryptocurrencies.


    ## Genesis Block

    This is the first block of any blockchain platform. It is also the zero block
    or block zero which refers to zero blocks preceding it. First genesis block belongs
    to the Bitcoin blockchain, in which Satoshi Nakamoto wrote a message in the Bitcoin
    genesis block: “ The Time 03/Jan/2009 Chancellor on brink of second bailout for
    banks”.


    ## GPU Mining

    The abbreviation or acronym stands for Graphics Processing Unit or simply just
    a graphics card used for mining. GPU mining is mainly used to mine the majority
    of Altcoins and because its process hashes is much faster than CPU mining. Certain
    cryptocurrency algorithm code allows both GPU and CPU mining which can be profitable
    for the miners. The difficulty of mining Bitcoin is so high a GPU miner cannot
    compete with an ASIC miner.


    Gaming Pc’s are perfect computers for mining if you are interested in learning
    how to mine because it comes with one GPU that can do the job. You can also build
    a dedicated mining machine with three or more GPUs for optimum mining results.
    Keep in mind that Cryptocurrency mining is not cheap and it will cost you a lot
    of money not only for the components to build a miner you have to take into consideration
    the amount of electricity it will cost to run it. `DYOR` before you start.


    # H

    ## Halving

    This is the process by which mining rewards are cut in half. An example would
    be the miners getting rewarded hundred coins for finding a block and then the
    halving happens after four years now the miners will only receive fifty coins.
    This is written in the source code of the Blockchain and it is immutable. As the
    difficulty of finding a block rises the less and less the rewards are given to
    the miners. This is also one way to control the supply of cryptocurrency entering
    the cryptoverse.


    ## Hard Fork

    When the legacy protocol source code gives birth to a new one by way of implementing
    new changes to the code which are incompatible to the original consensus rules.
    It can be related to the results of a disagreement on how they can move the project
    forward within the DEVs and miners of any cryptocurrency. Some examples are Bitcoin
    Cash and Ravencoin; they are both hard fork of Bitcoin.


    Ethereum Classic is the hard fork example of the Ethereum Blockchain. Without
    getting too in depth in the technical aspects of the subject it''s important to
    know that a Hard Fork happens when new and permanent changes are made to the old
    blockchain source code which are incompatible to the original consensus rules.


    ## Hash

    In layman''s terms it is a computational mathematical process of taking an input
    message and turning it into a fixed output message.

    '
