  trans: '


    **BCH**: 比特币（Bitcoin Cash）的缩写。它也可以被视为在中心化（CEFI`）或去中心化（DEFI`）交易所上的加密货币代码符号。


    **Bitcoiner（比特币持有者）**: 指对在投资组合中持有比特币非常有信心并看涨的个人。


    **BTC**: 比特币（Bitcoin）的缩写。它也可以被视为在中心化（CEFI`）或去中心化（DEFI`）交易所上的加密货币代码符号。


    **Bits（比特）**: 计算机中使用的基本单位；也指比特币的子单位。1 个比特币由 100 万个 `Bits` 组成。


    **Bag（包）**: 就像任何用于携带物品的包。这是一个加密货币世界的俚语，指在投资组合中持有大量特定加密货币的人。


    **Bag Holder（套牢者）**: 直接指无论市场波动如何，在投资组合中持有大量特定加密货币的投资者或个人。


    **Blockchain（区块链）**: 区块链是由中本聪（Satoshi Nakamoto）向世界介绍的一种开放软件代码技术，比特币运行在其之上。通俗地说，没有区块链就没有比特币、山寨币、NFT
    和 DeFi。它通过节点（即计算机）的共同工作进行加密安全保护，以在数字账本中记录所有交易。


    这个数字账本被复制并共享在遍布全球的计算机网络中，任何人都可以进行验证。尽管它对验证开放，但其代码受到密码学的保护且具有不可篡改性。一旦一个区块通过计算机挖掘过程完成完成或被找到，它们就会被链在一起，因此有了“区块链”一词。每种区块链技术都根据其加密代码而不同。


    **Block（区块）**: 区块是使用加密技术创建数字交易的软件代码，这些交易在节点和计算机网络中进行复制和共享。这些记录的交易存储在不可篡改的数字账本中。


    在比特币的情况下，区块是由计算机和 ASIC 矿机通过的，利用了被称为工作量证明（`P.O.W`）的过程。一些山寨币遵循与比特币相同的方法，利用工作量证明来挖掘区块，并在区块完成或在其原生区块链中被找到后获得其原生币的奖励。这些确认的区块被链在一起，因此有了“区块链”一词。


    **Block Reward（区块奖励）**: 顾名思义，就是对区块的奖励。矿工因发现区块而获得的奖励。发现区块是指计算机哈希处理或通过密码学产生一个与该特定文件唯一的代码。每个被哈希的代码都永远不会相同且具有不可篡改性，这使得数据防篡改。每个区块奖励都是其原生区块链的货币。


    **Bitcoin Whitepaper（比特币白皮书）**: 这是由中本聪在 2008 年发明、设计并编写的原始计划和协议。比特币白皮书为解决在处理电子支付时基于信任的模型产生的问题提供了答案。


    **Bear（熊）**: 这个词通常在股市中指资产价格价值的展望。它也被加密货币投资者采用，用以信号他们认为加密市场价格正向下移动或正接近熊市。


    **Bear Market（熊市）**: 熊市是指一个每种币都在失去价值的糟糕市场。当投资者由于不确定性而恐慌抛售时，会引发金融市场下跌，并将价格推至历史低点，形成更低的高点更低的低点。牛市则完全相反。


    **BTD**: 缩写代表 `Buy` the `Dip`（抄底）。这是典型的旧金融系统术语。


    **Bullish（看涨）**: 这是对市场的乐观观点。


    **Bull Market（牛市）**: 预计价格将上涨的市场。


    **CeFi**: 缩写代表中心化金融（Centralized Finance）。这是像银行之类的典型的旧金融系统。


    **Cloud mining（云矿）**: 这与云存储或向云端上传和从云端下载的概念相同。这些是具有可用计算硬件或服务器的远程数据中心，可用于挖掘加密货币。


    **Cardano（卡达达）**: 由查尔·霍斯金森（Charles Hoskinson）创立的山寨币项目，以第一位程序员女性数学家埃达·洛芙拉斯（Ada
    Lovelace）命名。它利用权益证明的共识协议。

    '
