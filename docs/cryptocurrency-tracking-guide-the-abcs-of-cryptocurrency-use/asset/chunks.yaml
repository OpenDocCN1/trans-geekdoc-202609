    # Cryptocurrency Glossary


    **WAGMI**: This abbreviation or acronym stands for `We Are Gonna Make It`. Investors
    in the cryptoverse are always chasing that next coin or token that will make them
    rich instantaneously. In reality they get rekt and lose more money than they bargained
    for and will continue to use these words to defuse their Fear Uncertainty and
    Doubts about the crypto market. That is why it is very important to `DYOR` and
    learn before you dive in the cryptoverse.


    **Wallet**: Just like a regular wallet you use to carry your id cards and fiat
    money, this is an electronic wallet. It is an electronic wallet that holds your
    public and private keys used to access your cryptocurrencies. The wallet can be
    a hot storage meaning you are connected to the internet and cold wallet meaning
    you are not connected to the internet. You can also have it written down on a
    piece of paper and store it somewhere safe.


    **Whales**: This name given to an individual or a group of investors that holds
    a great amount of cryptocurrencies in Bitcoin or Altcoins. Any movement they make
    in the cryptocurrency markets creates a massive change to the coin''s price. They
    are viewed as manipulators of the cryptocurrency market''s volatility.


    ## Y


    **YOLO**: The abbreviation or acronym stands for `You Only Live Once`. This is
    a catchphrase used by many in social media and it has also made its way into the
    cryptoverse. It can be used for good when it relates to seizing the day and enjoying
    every minute of the moment but it can also be bad if used to rationalize your
    emotional decisions with cryptocurrency investing.


    Maybe that you `YOLO` in a new project just because your gut tells you so can
    bring you both fortune and misfortune but maybe good fortune then it''s all worth
    it. Just don’t blame anyone else for your own decisions. That''s why it''s very
    important to `DYOR` before you `FOMO` and `YOLO` in any cryptocurrency.


    ## Z


    **Zero Confirmation Txn**: This is the same as an unconfirmed transaction.


    ## Conclusion


    Now that you have taken the first step by learning some acronyms, you have made
    it this far or maybe you just skipped to the end because you are curious, here
    it is. I will guide you on how to open an electronic wallet also known as a hot
    wallet. Click on this link `[https://metamask.io/](https://www.google.com/url?q=https://metamask.io/&sa=D&source=editors&ust=1661372152492966&usg=AOvVaw1ztzhYUYUCk81bhbusLUzC)`
    This will take you to the metamask wallet website. You can download the wallet
    and add it to your browser. Metamask has a tremendous amount of YouTube videos
    that will teach and guide you. I am sharing this because I have been using a metamask
    wallet since 2019.


    This is the second step for you to get involved with the Cryptoverse by having
    a wallet to keep your coins. You can also use your metamask to purchase any cryptocurrency
    by connecting it to your bank credit card or debit card. There are many other
    wallets but I think one is good enough. Keep in mind not to share your `private
    keys` with anyone. A word of advice, most DeFi wallets do not have control over
    your coins or access to fix your wallet so be careful not to lose your `private
    key`.


    This book is a living book and I will continue to add new words as the Cryptoverse
    evolves. We are very early in the Cryptoverse compared to the early days of the
    internet. I am excited that you have taken the time to learn about it. You are
    a true pioneer of the Cryptoverse, so stay tuned for the next 10 coins I will
    reveal in the next book for you to invest in. Leave a Review if you enjoyed this.


