    ## H


    ### HODL

    该缩写或术语代表“Hold On to Dear Life”（紧握生命），或者是单词 HOLD 的拼写。这个拼写背后的故事来自一个名为 GameKyuubi
    的加密投资者在 2013 年 12 月 18 日发布在 Bitcoin talk 论坛上。他表示，由于他当时醉了且投资水平糟糕，他决定只持有他的比特币而不卖出，这就是为什么他的帖子中出现了该词的拼写错误。


    ### Hopium

    它是 Hope（希望）和 Opium（鸦片）两个词的结合。加密投资者经常在 Reddit、Telegram `etc.` 等社交媒体平台上使用 Hopium，以表达对未来巨大的希望和无法控制的乐观情绪。通俗来说，这指的是某沉浸在希望的快感中。


    ## I:


    ### ICO

    该缩写或术语代表首次代币发行（Initial Coin Offering）。该术语模仿自股票市场的首次公开募股 `IPO`。在加密世界中，它是新项目通过发行其代币或代币来筹集资金，为公司提供启动资金。这些代币可以代表持有新项目的股票或股份。


    ### Immutable（不可变）

    在加密世界中，这意味着代码一旦部署就无法被更改。分布式账本上的所有交易都在区块链上经过验证、确认和加密，并且是不可更改的。这就是为什么区块链技术被认为是解决信任代码的演进。


    ### Imperman Loss（无常损失）

    这是一种暂时的永久损失，通常指的是 DeFi 和流动性提供者。以 DeFi Uniswap 协议为例，任何人都可以交换和交易硬币或代币。为了实现这一点，存在
    AMM 流动性池使得这些交换和交易成为，从而改变了池中每种硬币的比例。


    变化可以增加也可以减少，导致硬币总量变化，同时也导致你提供的 `LP` 总量发生变化。如果与投入金额相比有所减少，意味着当你提取 `LP` 时就经历了无常损失；但如果你将其留在
    `LP` 中，则没有无常损失。


    ## J:


    ### Jager

    这是币安 BNB 币的最小单位，与比特币的最小单位非常相似，后者被称为 Satoshi 或 Sats。


    ## K:


    ### KYC

    该缩写或术语代表 `K` now `Y` `our `C` `lient（了解你的客户）。这是一种验证过程，用于识别发送或接收加密货币的钱包是否为真实人类及其诚实所有者。它主要适用于大多数中心化交易所，帮助投资者免受诈骗，并保护交易所因不遵守所在地政府的规定而被关闭。


    在加密世界中，它与项目创始人和联合创始人的身份信息（doxing）相结合进行，作为一种验证过程来确认他们是项目背后的真实人类。对于任何业务以及不断发展的加密世界来说，这是一个非常重要的过程，因为这些新资产平台几乎没有监管。它是投资者和整个加密世界的一个巨大保障。


    ## L:


    ### Light Node（轻节点）

    轻节点运行所需的内存较少，且不存储区块链的完整副本。轻节点可以在手机等设备上运行，通常依赖于全节点运行。


    ### Litecoin（莱币）

    Litecoin 是山寨币，原始比特币代码的分叉。由 MIT 毕业生、前 Google 工程师 Charlie Lee 于 2011 年开发。莱币的发行总量为
    8400 万枚，其挖矿区块的速度被认为比比特币更快。莱币进入加密世界时，被视为与比特币金标准相比的银标准币。


    ## M:


    ### Market Cap（市值）

    市值（Market Capitalization）或 `MCAP` 是市场中流通代币总量乘以其价值。这是比较哪个山寨币项目比其他项目更有曝光度和价值的极佳方法。


    ### Meme Coins（迷因币）

    这些是作为玩笑进入加密世界、基于 Meme 文化和运动的山寨币。迷因币中最流行的之一是狗狗币（Dogecoin），埃隆·马斯克本人曾在社交媒体上推过它。这些迷因币大多有一张柴犬犬、猫或任何在社交媒体上吸引了大量粉丝的动物图片。


    ### Mempool（内存池）

    该缩写代表 Memory pool（内存池）。这是所有未确认交易的所在地，这些交易尚未被矿工加入区块。如果交易在内存池中长时间未被确认，意味着矿工由于设置的手续较低未接受它们。


    ### Merkel Root（梅克尔根节点）

    这是区块内所有交易的哈希值。


    ### Message（消息）

    这是计算过程的输入，例如哈希函数。


    ### Message Digest（消息摘要）

    这是计算过程的输出，例如哈希函数的输出。


    ### Miners（矿工）

    这些是挖掘区块的全节点或独立计算机。这些独立计算机验证交易，并因验证区块而获得奖励，然后区块被添加到区块链中。


    ### Mining（挖矿）

    它是 `POW` 或工作量证明挖矿过程，通过哈希计算利用个人计算力来验证交易并将区块添加到区块链中。


    ### Mining Difficulty（挖矿难度）

    这是衡量在工作量证明系统内，任何独立计算机挖掘区块的困难程度。


    ### Minning Rig（矿机）

    这可以是一个用于挖掘加密货币的普通游戏电脑。矿机专门设计用于放置多个显卡，这些足够挖掘比特币以及所有依赖工作量证明共识的山寨币。


    ### Mooning（暴涨）

    这是许多加密货币投资者在社交媒体平台上的号，表示特定山寨币或迷因币的价格快速上涨。它与“飞向月球”有关，意味着这种硬币将直冲月球。


    ### Multisig（多重签名）

    这是两个词 `Multi` 和 `Sig` 的结合。`Multi` 源于原意为“多个”，而 `sig` 源于“签名”。它在加密世界中意味着多重签名。这被用作安全措施，需要多个签名才能访问钱包内的资金。它向社区确保资金不会由一个人控制。


    ## N:


    ### NaaS

    该缩写或术语代表节点即服务（Node as a Service）。


    ### NFT

    该缩写或术语代表非同质化令牌（Non Fungible Token）。这些是位于区块链上的非常独特的加密令牌，用于将数字艺术品和更多现实实体或或代币化。由于其加密唯一性，每个
    `NFT` 代码都是不相同的，用于证明区块链上数字资产的所有权。


    非同质化代币改变了世界在销售、购买和持有艺术品、房地产以及任何有价值的实体资产领域的业务方式。所有这些现实实体资产将通过区块链上安全的且不可更改的智能合约来表示，作为真实的数字证书。


    ### Node（节点）

    节点也可以称为主节点、全节点或轻节点。节点是连接到加密世界并帮助保护区块链的计算机。该计算机连接到互联网，并有足够的内存支持并运行区块链软件代码的完整副本。完整副本意味着它由区块头和区块交易组成。


