- raw: "ADDRESS:  An address is very similar to having a home address or email address.\
    \ Since the inception of the internet 1.0 we started using email addresses to\
    \ send and receive informational data online but now we are being introduced to\
    \ cryptoverse addresses to send and receive cryptocurrencies. These addresses\
    \ consist of alphanumeric characters and they are very specific to each blockchain\
    \ and its native coins or tokens. \n\nThe majority of blockchain addresses are\
    \ public and can be seen on the blockchain explorer confirming the transactions\
    \ going in and out of any address. An exception to these public addresses are\
    \ the privacy-based blockchains like Grin and Monero. It is impossible for any\
    \ human to read, memorize and process the long random strings of alphanumeric\
    \ lines of a blockchain address but rest assured that a computer has no problems\
    \ processing it. \n\n Addresses are unique and anonymous even though they are\
    \ public, the owners of the addresses' real identification is never revealed.\
    \ Although this case is true for the majority of people dealing with cryptocurrency,\
    \ the real identity of founders and cofounders of major token projects and exchanges\
    \ are actually revealed. One example is the founder of Ethereum Vitalik Buterin\
    \ where his public address is known by all who work on the Ethereum Blockchain\
    \ network. \n\nAirdrop:  An airdrop is the term given to things like supplies\
    \ or propaganda leaflets being dropped from the sky by a plane. The strategy is\
    \ also used in the cryptoverse by a new cryptocurrency project for its native\
    \ coins or tokens. It is electronically distributed to early adopters of the project\
    \ to create visibility and buzz which in turn provide more demand by the mass.\
    \ All you need to have is a compliant wallet which is capable of receiving the\
    \ airdrop on the scheduled released time and date. You need to register for any\
    \ airdrop. \n\nAltcoin:  Altcoin or Alternative coin is the name given to all\
    \ other coins that came after Bitcoin. These coins are native to their own blockchain\
    \ software code and they were soft fork or hard fork of Bitcoin in layman's terms\
    \ they are copies of the original. Bitcoin Cash, Litecoin and Raven coin to name\
    \ a few altcoins that were forked from the original bitcoin code. Other coins\
    \ like Ethereum have their own code or blockchains which were created to solve\
    \ some of the problems or issues that Bitcoin cannot solve. \n\nOne major improvement\
    \ by the Ethereum Blockchain is the introduction of smart contracts and smart\
    \ properties. Altcoins were born out of necessity to solve the problems other\
    \ coins have like scalability to handle the need for speed to process a transaction\
    \ and lessen the fees charged for such transactions. The popularity of meme culture,\
    \ some coins were also produced just to poke fun against Bitcoin. One particular\
    \ altcoin that gave birth to this meme culture is Dogecoin. \n\nASIC:  The abbreviation\
    \ or acronym stands for Application-Specific Integrated Circuits. These specific\
    \ integrated circuits are designed on silicon chips to perform only one special\
    \ task and that is to mine and validate certain codes. In the case of Bitcoin\
    \ the  asic  processes SHA-256 with regards to proof of work protocols to mine\
    \ and validate every transaction. \n\nASIC MINER:  An asic miner is when all the\
    \ specific integrated circuits are connected together with other hardware like\
    \ power supply to make a special computer that does only one task and that is\
    \ to mine for cryptocurrencies utilizing the proof of work protocols. These asic\
    \ miners are connected to the internet and tend to make a lot of noise in comparison\
    \ to a regular home computer when turned on. Because they run the proof of work\
    \ protocols they tend to consume a tremendous amount of electricity energy. \n\
    \nATH:  The abbreviation or acronym All Time High refers to how high a cryptocurrency’s\
    \ value peaked according to its price and market capitalization. This usually\
    \ happens when people FOMO into a new project speculating it will rocket to the\
    \ moon and make them filthy rich. It's no longer a secret that a cryptocurrency\
    \ will hit All Time High once it is listed to any of the top 5 exchanges in the\
    \ cryptoverse. \n\nATL:  The abbreviation or acronym All Time Low refers to how\
    \ low a cryptocurrency’s value dips according to its price and market capitalization.\
    \ This usually happens when there is a panic sell amongst the investors and when\
    \ certain influences of the news media, wall street's tend to leak into the cryptoverse.\
    \ It is always safe to buy and hold rather than panic and sell at a loss. \n\n\
    Apeing:  This happens when people find a new project or cyprotcurreny that is\
    \ about to launch or it's only days or weeks old and they FOMO in by buying as\
    \ much as they can. They usually buy in without taking the time to do a thorough\
    \ research or background check on the particular cryptocurrency project. It is\
    \ the fastest way to get rekted and lose money in the cryptoverse. This is not\
    \ investing, it's called  gambling . \n\nAPI:  The abbreviation or acronym stands\
    \ for  A pplication  P rogramming  I nterface. This set of protocols are software\
    \ applications programming interfaces. These application's protocols interact\
    \ in a specific manner on how to use the data and what actions it needs to execute.\
    \ \n\nAMM:  The abbreviation or acronym stands for  A utomated  M arket  M aker\
    \ in Layman’s terms it is a software code utilized by an exchange protocol that\
    \ operates autonomously on a decentralized exchange (DEX). An example of such\
    \ Automated Market Maker is the Uniswap exchange launched in 2018. \n\nB:\n\n\
    Bitcoin:  Bitcoin is the first coin in the Cryptoverse created by Satoshi Nakamoto\
    \ in 2009. This coin is the first cryptocurrency native to the Bitcoin blockchain\
    \ and is rewarded to the miners for verifying the cryptography code by solving\
    \ a block. This open computer software code was developed by Satoshi Nakamoto\
    \ to solve the problem of trust between peer to peer exchanges of money electronically.\
    \ Bitcoin is a new technologically positive disruptor not only for the financial\
    \ system but the tech world as a whole. \n\nThere are an estimated 21 million\
    \ Bitcoins in the whole world and the year 2140 is predicted to be the year the\
    \ last Bitcoin will be mined. Even though Bitcoin is a decade old this innovative\
    \ tech is still in its infancy stage which puts you in a great position to learn,\
    \ invest and create great wealth for you and your family. As of the publication\
    \ of this book Bitcoin as many in the cryptoverse sees it as a great storage of\
    \ value in comparison to precious metals like gold. Its value derives from its\
    \ scarcity, supply and demand.  [](https://www.google.com/url?q=https://bitcoin.org/en/&sa=D&source=editors&ust=1661372152428651&usg=AOvVaw1AoR9-9KPc_NX_P4heGI_i)\
    \   [https://bitcoin.org/en/](https://www.google.com/url?q=https://bitcoin.org/en/&sa=D&source=editors&ust=1661372152429124&usg=AOvVaw0wSxFSt-X4eQyuceXo1O6M)\
    \ \n\nBitcoin Cash:  An Altcoin and hard fork of the Bitcoin original code created\
    \ in 2017 by some Developers (DEVs) and cryptocurrency miners. Bitcoin Cash was\
    \ forked to solve the problems of block speed and scalability that Bitcoin original\
    \ code lacks. BCH’s code increased the block sizes from 1MB to 8MB which was recently\
    \ upgraded to 32MB in 2021 to adapt to an ever-increasing transaction speed and\
    \ processing time. \n\nThis is one example of an Altcoin that was forked to address\
    \ some of the problems that the original Bitcoin code Satoshi Nakamoto created.\
    \ There are many other Altcoins that you will come across of similar stories as\
    \ you dive deep into the cryptoverse.  [](https://www.google.com/url?q=https://bitcoincash.org/&sa=D&source=editors&ust=1661372152430559&usg=AOvVaw2qpCQiiVfqf84MgjRI4XXb)\
    \   [https://bitcoincash.org/](https://www.google.com/url?q=https://bitcoincash.org/&sa=D&source=editors&ust=1661372152430961&usg=AOvVaw0IcyYfSJWuijrzpyEeMQpN) "
  fmt: '

    # ADDRESS

    An address is very similar to having a home address or email address. Since the
    inception of the internet 1.0 we started using email addresses to send and receive
    informational data online but now we are being introduced to cryptoverse addresses
    to send and receive cryptocurrencies. These addresses consist of alphanumeric
    characters and they are very specific to each blockchain and its native coins
    or tokens.


    The majority of blockchain addresses are public and can be seen on the blockchain
    explorer confirming the transactions going in and out of any address. An exception
    to these public addresses are the privacy-based blockchains like `Grin` and `Monero`.
    It is impossible for any human to read, memorize and process the long random strings
    of alphanumeric lines of a blockchain address but rest assured that a computer
    has no problems processing it.


    Addresses are unique and anonymous even though they are public, the owners of
    the addresses'' real identification is never revealed. Although this case is true
    for the majority of people dealing with cryptocurrency, the real identity of founders
    and cofounders of major token projects and exchanges are actually revealed. One
    example is the founder of Ethereum `Vitalik Buterin` where his public address
    is known by all who work on the `Ethereum Blockchain` network.


    # Airdrop

    An airdrop is the term given to things like supplies or propaganda leaflets being
    dropped from the sky by a plane. The strategy is also used in the cryptoverse
    by a new cryptocurrency project for its native coins or tokens. It is electronically
    distributed to early adopters of the project to create visibility and buzz which
    in turn provide more demand by the mass. All you need to have is a compliant wallet
    which is capable of receiving the airdrop on the scheduled released time and date.
    You need to register for any airdrop.


    # Altcoin

    Altcoin or Alternative coin is the name given to all other coins that came after
    `Bitcoin`. These coins are native to their own blockchain software code and they
    were soft fork or hard fork of Bitcoin in layman''s terms they are copies of the
    original. `Bitcoin Cash`, `Litecoin` and `Raven coin` to name a few altcoins that
    were forked from the original bitcoin code. Other coins like `Ethereum` have their
    own code or blockchains which were created to solve some of the problems or issues
    that Bitcoin cannot solve.


    One major improvement by the `Ethereum Blockchain` is the introduction of smart
    contracts and smart properties. Altcoins were born out of necessity to solve the
    problems other coins have like scalability to handle the need for speed to process
    a transaction and lessen the fees charged for such transactions. The popularity
    of meme culture, some coins were also produced just to poke fun against Bitcoin.
    One particular altcoin that gave birth to this meme culture is `Dogecoin`.


    # ASIC

    The abbreviation or acronym stands for `Application-Specific Integrated Circuits`.
    These specific integrated circuits are designed on silicon chips to perform only
    one special task and that is to mine and validate certain codes. In the case of
    `Bitcoin` the `asic` processes `SHA-256` with regards to proof of work protocols
    to mine and validate every transaction.


    # ASIC MINER

    An `asic miner` is when all the specific integrated circuits are connected together
    with other hardware like power supply to make a special computer that does only
    one task and that is to mine for cryptocurrencies utilizing the proof of work
    protocols. These `asic miners` are connected to the internet and tend to make
    a lot of noise in comparison to a regular home computer when turned on. Because
    they run the proof of work protocols they tend to consume a tremendous amount
    of electricity energy.


    # ATH

    The abbreviation or acronym `All Time High` refers to how high a cryptocurrency
    peaked. This usually happens to a new project hitting the market.


    # ATL

    The abbreviation or acronym `All Time Low` refers to how low a cryptocurrency
    dips according to its price. This usually happens during a market crash.


    # Apeing

    Apeing is when people find a new project and invest without thorough research.
    This usually happens in crypto.


    # API

    The abbreviation or acronym stands for `Application Programming Interface`. These
    sets of software interfaces interact.


    # AMM

    The abbreviation or acronym stands for `Automated Market Maker`. In layman’s terms
    it is a software that operates autonomously. An example of such is `Uniswap` launched
    in 2018.


    # Bitcoin

    `Bitcoin` is the first coin in the cryptoverse created by `Satoshi Nakamoto` in
    2009. This coin is native to the blockchain and is rewarded to the miners. This
    is a technological disruptor for the financial system. There are an estimated
    21 million `Bitcoins` in the world and the year 2140 is predicted to be the year
    `Bitcoin` will be mined. Even though `Bitcoin` is a decade old this innovative
    tech is still in its infancy. Many in the cryptoverse see it as a storage of value
    in comparison to precious metals.


    # Bitcoin Cash

    `Bitcoin Cash` is an Altcoin and hard fork of the `Bitcoin` original code created
    in 2017 by some Developers (`DEVs`) and cryptocurrency miners. `BCH` was forked
    to solve the problems of block speed and scalability that `Bitcoin` code lacks.
    `BCH`’s code increased the block sizes from `1MB` to `8MB` which was recently
    upgraded to `32MB` in 2021 to adapt to an ever-increasing transaction speed and
    processing time.

    '
  trans: '


    # 地址 (ADDRESS)

    地址与家庭地址或电子邮件地址非常相似。从互联网 1.0 诞生起，我们就开始使用电子邮件地址在网上发送和接收信息数据，但现在我们正在接触加密宇宙地址，用于发送和接收加密货币。这些地址由字母和数字组成，并且对于每个区块链及其原生货币或代币具有特定性。


    大多数区块链地址都是公开的，可以在区块链浏览器器上看到，以确认任何地址的进出交易。这些公开地址的例外是基于隐私的区块链，如 `Grin` 和 `Monero`。对于人类来说，读取、记忆和处理区块链地址中长长的随机字母字符串是不可能的，但请放心，计算机处理这些内容没有问题。


    尽管地址是公开的，但它们是唯一且匿名的，地址所有者的真实身份永远不会被揭露。虽然对于大多数处理加密货币的人来说如此，但大型代币项目和交易所的创始人及联合创始人的真实身份实际上已经公开。一个例子是以太坊的创始人
    `Vitalik Buterin`，他的公开地址对于所有在 `Ethereum Blockchain` 网络工作的人都是为人知的。


    # 空投 (Airdrop)

    空投是指类似于从飞机上空投的物资或宣传传单的术语。这种策略也被加密宇宙中的新型加密货币项目用于其原生货币或代币。它通过电子形式形式分发给项目的早期采用者，以创造知名度和热度，从而为大众带来更多需求。你只需要拥有一个合规钱包，能够在预定的发布时间和日期接收空投即可。你需要为任何空投进行注册。


    # 山寨币 (Altcoin)

    山寨币或替代代币（Alternative coin）是所有在 `Bitcoin` 之后出现的其他货币的名称。这些货币源于它们自己的区块链软件代码，通俗地说，它们是比特币的软分叉或硬分叉，即原始代码的副本。`Bitcoin
    Cash`、`Litecoin` 和 `Raven coin` 是从原始比特币代码分叉出来的山寨币示例。其他货币如 `Ethereum` 有它们自己的代码或区块链，这些区块链的创建是为了解决比特币无法解决的某些问题或故障。


    `Ethereum Blockchain` 的一个主要改进是引入了智能合约和智能属性。山寨币的诞生是为了解决其他货币面临的问题，例如扩展性，以满足处理交易的速度需求并减少此类交易收取的费用。由于迷因文化的流行，一些货币的产生仅仅是为了嘲讽比特币。催生这种迷因文化的特定山寨币是
    `Dogecoin`。


    # ASIC (专用集成电路)

    缩写或首字母词代表 `Application-Specific Integrated Circuits`（专用集成电路）。这些特定的集成电路设计在硅片上，仅用于执行一个特殊任务，即挖掘和验证某些代码。在
    `Bitcoin` 的情况下，`asic` 根据工作量证明协议处理 `SHA-256`，以挖掘和验证每笔交易。


    # ASIC 矿机 (ASIC MINER)

    `asic miner` 是将所有特定的集成电路与电源等其他硬件连接在一起，形成一种特殊的计算机，它只执行一项任务，即利用工作量证明协议挖掘加密货币。这些
    `asic miners` 连接到互联网，在开启时与普通家用电脑相比往往产生巨大的噪音。由于它们运行工作量证明协议，它们往往消耗大量的电力。


    # 历史最高 (ATH)

    缩写或首字母词 `All Time High`（历史最高）指的是加密货币达到过的最高点。这通常发生在新项目进入市场时。


    # 历史最低 (ATL)

    缩写或首字母词 `All Time Low`（历史最低）指的是加密货币根据价格跌出的最低点。这通常发生在市场崩溃期间。


    # 冲入 (Apeing)

    Apeing 指人们发现一个新项目并在没有彻底研究的情况下进行投资。这通常发生在加密货币领域。


    # API (应用程序接口)

    缩写或首字母词代表 `Application Programming Interface`（应用程序编程接口）。这些软件接口集相互交互。


    # 自动做市商 (AMM)

    缩写或首字母词代表 `Automated Market Maker`（自动做市商）。通俗地说，它是一个自主运行的软件。例如是 2018 年推出的 `Uniswap`。


    # 比特币 (Bitcoin)

    `Bitcoin` 是由 `Satoshi Nakamoto` 在 2009 年在加密宇宙的第一种货币。这种货币原生于区块链并奖励给矿工。它是金融系统的技术颠覆者。预计世界上有
    2100 万个 `Bitcoins`，预计 2140 年将是 `Bitcoin` 被挖完的一年。尽管 `Bitcoin` 已经十年历史，但这项创新技术仍处于起步阶段。加密宇宙中的许多人将其视为类似于贵金属的价值存储。


    # 比特币 (Bitcoin Cash)

    `Bitcoin Cash` 是一种山寨币，是 2017 年由开发者 (`DEVs`) 和加密货币矿工对 `Bitcoin` 代码的硬分叉。`BCH` 分叉是为了解决
    `Bitcoin` 代码缺乏的区块速度和扩展性问题。`BCH` 的代码将区块大小从 `1MB` 增加到 `8MB`，并在 2021 年最近升级到 `32MB`，以适应不断增长的交易速度和处理时间。


    '
