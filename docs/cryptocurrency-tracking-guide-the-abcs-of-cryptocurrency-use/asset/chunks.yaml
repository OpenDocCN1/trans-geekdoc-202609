    \ project is offering its coins or tokens to raise funds to help kick start capital\
    \ for the company. The coins can be a representation of holding a stock or stake\
    \ in the new project. \n\nImmutable:  In the cryptoverse this means once the code\
    \ is deployed it cannot be changed. All transactions on the distributed ledger\
    \ are verified, confirmed and secured on the blockchain and they are unchangeable.\
    \ This is why blockchain technology proves to be the evolution in solving the\
    \ trust code. \n\nImpermanent Loss:  This is a temporary permanent loss usually\
    \ refers to Defi and Liquidity Pool providers. Take for example the Defi Uniswap\
    \ protocol where anyone can exchange and swap coins or tokens. In order for this\
    \ to happen there is AMM Liquidity Pools that makes these swaps and exchanges\
    \ possible which in turn changes the ratios of each coin in the pools. \n\nThe\
    \ changes can go up or go down causing the total amount of coins to change which\
    \ also changes the total amount of your provided LP to change. If it goes down\
    \ in comparison to the entry amount that means you have experienced impermanent\
    \ loss if you withdraw your LP but if you kept it in the LP there is no impermanent\
    \ loss. \n\nJ:\n\nJager:  This is the smallest denomination given to the Binance\
    \ BNB Coin which is very similar to the smallest denomination for Bitcoin which\
    \ is called the Satoshi’s or Sats. \n\nK:\n\nKYC:  This abbreviation or acronym\
    \ stands for  K now  Y our  C lient. It is the verification process used to identify\
    \ if this is a real human and truthful owner of the crypto wallet that is sending\
    \ or receiving the cryptocurrency. Mainly applies to most Central Exchanges which\
    \ helps the investors from being scammed and also protects the exchanges from\
    \ getting shut down for not following its host governments regulations. \n\nIn\
    \ the cryptoverse it goes hand in hand with doxing the project founders and cofounders\
    \ as a verification process to validate they are the true humans behind the project.\
    \ This is a very important process for any business and also in the cryptoverse\
    \ as it grows because of little to no regulations governing these new asset platforms.\
    \ A great assurance for the investors and the cryptoverse as a whole. \n\nL:\n\
    \nLight Node:  A light node requires less memory to work and does not store the\
    \ complete copy of the blockchain. Light Nodes can be run on devices like smartphones\
    \ and are usually dependent on the full node to run. \n\nLitecoin:  Litecoin is\
    \ an altcoin and fork of the original bitcoin code. Developed by Charlie Lee an\
    \ MIT grad and former Google engineer in 2011. Litecoin has a maximum amount of\
    \ 84 million coins in circulation and its mining block is considered to be faster\
    \ than that of Bitcoin. Litecoin as it came into the cryptoverse was the silver\
    \ standard coin in comparison to Bitcoin as the gold standard. \n\nM:\n\nMarket\
    \ Cap:  A Market Cap or Market Capitalization or MCAP is the total number of circulating\
    \ coin supply in the market multiplied by its valued price. This is a great way\
    \ to compare which altcoin project has more exposure and value than others. \n\
    \nMeme Coins:  These are altcoins that came about the Cryptoverse as a joke and\
    \ was based on the Meme culture and movement. One of the most popular of the meme\
    \ coins was Dogecoin which Elon Musk himself tweets about on social media. The\
    \ majority of these meme coins will have a picture of a Shiba dog, cats or any\
    \ sort of animal that summons a great following on social media. \n\nMempool:\
    \  This acronym stands for Memory pool. This is where all the unconfirmed transactions\
    \ are located and have not been added to the block by the miners. If the transactions\
    \ remain unconfirmed in the mempool for a long time that means the miners did\
    \ not accept it due to low fees setup. \n\nMerkel Root:  This is the hash of all\
    \ the transactions within the block. \n\nMessage:  This is the input of the computational\
    \ process as in the hash function. \n\nMessage Digest:  This is the output of\
    \ the computational process as in the output of the hash function \n\nMiners:\
    \  These are the full nodes or individual computers that mine the blocks. These\
    \ individual computers verify the transactions and are rewarded for their block\
    \ verification which is then added to the blockchain. \n\nMining:  It is the POW\
    \ or Proof of Work mining process that utilizes the individual computing power\
    \ through hashing which verifies transactions and adds blocks to the blockchain.\
    \ \n\nMining Difficulty:  This is the measurement of how difficult it is for any\
    \ individual computer to mine a block within the Proof of Work system. \n\nMinning\
    \ Rig:  This can be a regular gamers computer used to mine cryptocurrency. Mining\
    \ rigs are specifically designed to hold more than one graphics card that are\
    \ powerful enough to mine blocks for Bitcoins and all other altcoins that rely\
    \ on Proof of Work consensus. \n\nMooning:  This is the call by many cryptocurrency\
    \ investors on social media platforms indicating a rapid price increase in a specific\
    \ altcoin or meme coin project. It is also related to saying “ To the Moon” which\
    \ means this coin will be flying straight to the moon. \n\nMultisig:  This is\
    \ a combination of two words, Multi and Sig. Multi comes from the original word\
    \ multiple meaning many and sig comes from the word signature. It means multiple\
    \ signatures in the cryptoverse. This is used as a security measure which needs\
    \ multiple signatures in order to access the funds within the wallet. It assures\
    \ the community that the funds are safe from having only one person controlling\
    \ all of it. \n\nN:\n\nNaaS:  The abbreviation or acronym stands for Node as a\
    \ Service. \n\nNFT:  The abbreviation or acronym stands for Non Fungible Token.\
    \ These are very unique cryptographic tokens coded on the blockchain which are\
    \ used to tokenize digital art work and many more real world tangible properties\
    \ or assets. Due to its cryptographic uniqueness each NFT code is never identical\
    \ to one another which is used to prove ownership for a digital asset on the blockchain.\
    \ \n\nNon Fungible Tokens is a game changer for the way the world does business\
    \ in the field of selling, buying and holding assets like art work, real estate\
    \ properties and anything tangible properties that have value. All of this real\
    \ world tangible assets will be represented by a secured digital and immutable\
    \ smart contract on the blockchain as an authentic digital certificate. \n\nNode:\
    \  Nodes can also be called a Master Node, Full Node or a Light Node. A node is\
    \ a computer that is connected to the cryptoverse and helps secure the blockchain.\
    \ This computer is connected to the internet with enough memory to support and\
    \ run a complete copy of the blockchain software code. \n\nThe complete copy meaning\
    \ it consists of the Block Header and Block transactions. They verify every transaction\
    \ throughout the network by enforcing the consensus rules and also validate each\
    \ block before they chain it together. \n\nP:"
