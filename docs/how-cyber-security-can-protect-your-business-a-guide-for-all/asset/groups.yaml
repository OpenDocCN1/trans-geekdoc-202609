    room was full of seasoned audit professionals, he delivered his lecture in simple
    language that you did not have to be an information security professional to understand.
    At the end, he spoke about his new book *How Cyber Security Can Protect Your Business
    – A guide for all stakeholders* and how he wanted to demystify cyber.


    When he approached me to review the book and write a foreword, little did he know
    that I was an apostle of the title, and actually owns the cybergrc.uk domain to
    promote cyber security good practice. Nearly every day, I sit down with CEOs,
    CISOs, CROs and IT directors to discuss their business’ cyber security audit requirements,
    assess their operational resilience by testing the effectiveness and adequacy
    of their administrative and technical controls, and make recommendations for improvements
    where opportunities are found.


    This book is cleverly written to appeal to all audiences irrespective of their
    background. It dissects cyber security, covering everything that professional,
    non-professional or organisation needs to operate a safe cyber environment. It
    recognises the importance of having a C-level sponsor in an organisation to promote
    cyber security investment, and makes clear that operating in a safe environment
    is everybody’s business, not just IT professionals’. The clarity around cyber
    governance, risk management and compliance cannot be overemphasised. Each chapter
    discusses the components of the cyber audit review lifecycle, highlighting the
    risk control matrix approach to assessing risks, testing controls and signalling
