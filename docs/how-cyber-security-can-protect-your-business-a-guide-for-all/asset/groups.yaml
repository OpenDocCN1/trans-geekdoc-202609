  md: "\n# 1: Introduction to cyber security GRC\n\nand type of risk being addressed\
    \ – risks important at local/departmental levels may be minute when compared to\
    \ those of the organisation as a whole. Also, in large, complex organisations\
    \ these activities may be replicated across the different constituent entities.\
    \ In these cases there can therefore be duplications of activities and gaps in\
    \ coverage. Enterprise governance, risk and compliance (EGRC) seeks to provide\
    \ a consistent, integrated approach to GRC across the organisation to reduce these\
    \ duplications and potential duplications. It also provides a framework of policies,\
    \ tools, processes and information reporting to simplify the activity and provide\
    \ consistency.\n\n# The three lines of defence model\n\nTo provide governance\
    \ of the risk management process itself, many organisations use the three lines\
    \ of defence model³ to explain their approach to managing risk. This model helps\
    \ to assign specific risk management roles and responsibilities/duties, and to\
    \ define the boundaries between them. The model is illustrated in Table 1.\n\n\
    # Table 1: Summary of the Three Lines of Defence Model\n\n| Line | Usually | Typical\
    \ activities |\n| --- | --- | --- |\n| First line – operational control | Business\
    \ functions | • Embedded risk management.<br>• Direct contact with risks. |\n\
    | Second line – risk control and compliance oversight | Risk functions (e.g. CISO)\
    \ | • Highlight control failures/unexpected events.<br>- Remediate to address\
    \ process/control deficiencies.<br>- Provide frameworks and support implementation\
    \ of relevant policies and procedures.<br>- Help build/monitor first line.<br>-\
    \ Develop processes and controls to manage risks and issues.<br>- Review and update\
    \ registers and responses to risks.<br>- Operate self-certification processes.\
    \ |\n| Third line – independent assurance | Audit and the board | • Provide independent\
    \ review and reporting of the organisation’s response to risk. |\n\n# 1: Introduction\
    \ to cyber security GRC \n\nThe model can be applied to organisations of any size\
    \ or complexity – the aim is to provide a risk management framework that is effective\
    \ (fit for purpose), efficient (limited impact on normal operations) and economic\
    \ (costs not excessive given the level of risk or compliance). The boundaries\
    \ between the lines may also vary. If this model is used, it is important that\
    \ the three lines are defined within the organisation, including how the different\
    \ lines should interact, including the sharing of findings and information about\
    \ risks/incidents. A risk is something that could happen; an issue is something\
    \ that has happened.\n\nWithin the context of cyber, the three lines could be\
    \ considered as follows:\n\n1. Operational management, Managed Security Services\
    \ Provider (MSSP), Third party suppliers and service providers.\n2. CISO and other\
    \ compliance/review functions (this part may be incorporated into non-cyber activities,\
    \ e.g. data compliance).\n3. Qualified IT auditors\n\nFor cyber health and safety,\
    \ staff should be considered the first line. For example, while operational management\
    \ may ensure that anti-malware is installed and updated, the end user may still\
    \ compromise security by clicking a link or visiting inappropriate site. All users\
    \ need to be educated on cyber risks and made aware of the consequences both to\
    \ individuals and to the organisation as a whole. This awareness could have benefits.\n\
    \nAnother concern is that the model can be seen as siloed. To work effectively,\
    \ the defence lines need to be integrated to reduce the risk of blame when a breach\
    \ occurs.\n\n# What is the relevance of GRC to cyber?\n\nWe live in a digital\
    \ world – we use IT to communicate with friends and family, purchase goods and\
    \ services, and do banking. Cyber security could be defined as measures to prevent\
    \ or detect attempts of theft or damage to your data and IT assets. Cyber is not\
    \ very different from any other risk impacting business. It can affect an organisation’s\
    \ reputation, compliance (including data privacy) and financial well-being. Cyber\
    \ is not just an IT issue – it impacts the whole way you do business and administration.\
    \ We need to ensure that cyber-based security activities are in line with all\
    \ other GRC activities and are subject to similar governance and control. Indeed,\
    \ for cyber it could be argued that GRC is even more important.\n\nIf we consider\
    \ this from a criminal’s perspective, we may create a user story as follows:\n\
    \nAs a criminal I want to access and change your data so that I can meet my own\
    \ agenda by damaging your reputation and/or financial reward. To achieve this,\
    \ I will target organisations that have little or no overall control of cyber:\n\
    \n- Employ badly trained users who are gullible to threats;\n- Have risk management\
    \ processes that are not working (e.g. don’t update security tools such as anti-malware,\
    \ no effective password management, etc.); and\n- Fail to comply with laws/regulations/best-practice\
    \ cyber hygiene.\n\nYour job as a director, manager or cyber security specialist\
    \ is to stop them. One way to do this is to ensure that your organisation has\
    \ effective GRC. We will explore how to achieve this in the following chapters.\n\
    \nIt is also important to remember that the impact of a cyber incident can go\
    \ well beyond the immediate costs. We have seen cyber companies across the globe\
    \ go into receivership following a cyber attack, particularly where there has\
    \ been a breach of personal data. This can be due to loss of customers and/or\
    \ massive regulatory fines.\n\nWe will now consider how good GRC can help reduce\
    \ these risks.\n\n# CHAPTER 2: CYBER SECURITY GOVERNANCE\n\n> “Boards are pivotal\
    \ in improving the cyber security of their organisations.\"\n\nNCSC Cyber Security\
    \ Toolkit for Boards\n\n# Introduction and overview\n\nGood control requires good\
    \ corporate governance from the top (directors and executive management). Top\
    \ management should ensure that the organisation is well structured and managed\
    \ with strong policies and a strong ethos. Governance forms the foundation on\
    \ which other controls and risk mitigations can be built. For example, controls\
    \ will only be effective if there is the culture to ensure that they are adhered\
    \ to and that anyone breaking these rules will be held to account and treated\
    \ accordingly. Ultimately, those who hold governance accountability will be held\
    \ responsible for all failures regardless of where they occur.\n\nThese corporate\
    \ governance, ‘entity-level controls’ are pervasive throughout the organisation,\
    \ including information and cyber activities. They set the culture and tone for\
    \ the organisation to operate. They should not, however, interfere with day-to-day\
    \ operations, except where such activities could put the organisation at financial,\
    \ legal/fiscal or reputational risk. The aim of good governance is shown in Figure\
    \ 1.\n\n![](img/eecdf4180ea2c887a7ae4a6600f1fca_21_0.png)\n\n# 2: Cyber security\
    \ governance\n\nEven small organisations are at increased risk from cyber criminals\
    \ as they can often be used as a weak starting point to target other organisations\
    \ in the same supply chain. A key part of cyber criminals' approach is to ‘case\
    \ the joint’ or investigate their targets – this will include reading press releases\
    \ about the awards of new contracts and the details of these customers and suppliers.\
    \ Therefore, all directors owe a duty of care, not only to their own organisation's\
    \ stakeholders but also to those of key business partners.\n\nDirectors and senior\
    \ staff may be targeted in the same way, as cyber criminals search social media,\
    \ etc. to gather information they can use when impersonating them via email or\
    \ another form of contact. Directors must be made aware of the need to manage\
    \ their personal social media presence securely.\n\nVery few directors are cyber\
    \ security specialists. But all directors need to have a basic understanding and\
    \ awareness of cyber security based on jargon-free principles. To help with this,\
    \ we could express governance as a user story from the Director's perspective:\n\
    \nAs a director I want assurance, in concise, understandable language, that we\
    \ have:\n\n- Adequate management of cyber risks and threats\n- Been made aware\
    \ of significant attacks and near misses, and advised of actions to prevent occurrence\n\
    - Been made aware of security arrangements for our significant third parties including\
    \ any significant attacks\n- Used our investment in cyber security effectively\
    \ and efficiently\n\nSo that we reduce the impact and likelihood of loss of reputation,\
    \ large fines, and other consequences of data breaches and loss of ability to\
    \ do cyber business through cyber risk.\n"
  mdcn: "\n\n# 1: 网络安全 GRC 简介\n\n以及所处理的风险类型——在局部/部门层面认为重要的风险，与整个组织相比可能可能是微不足道的。此外，在大型复杂的组织中，这些活动可能会在不同的组成实体之间重复。在这种情况下，可能会出现活动重复和覆盖范围的缺失。企业级治理、风险管理与合规（EGRC）旨在为整个组织提供一种一致的、集成的\
    \ GRC 方法，以减少这些重复和潜在的重复。它还提供了一个由政策、工具、流程和信息报告的框架，以简化活动并提供一致性。\n\n# 三道防线模型\n\n为了对风险管理过程本身进行治理，许多组织使用三道防线模型³来解释他们的风险管理方法。该模型有助于分配特定的风险管理角色职责/义务，并定义它们之间的边界。该模型如图\
    \ 1 所示。\n\n# 表 1：三道防线模型总结\n\n| 防线 | 通常情况下 | 典型活动 |\n| --- | --- | --- |\n| 第一防线——运营控制\
    \ | 业务职能 | • 嵌入式风险管理。<br>• 与风险直接接触。 |\n| 第二防线——风险控制与合规监督 | 风险职能（如 CISO） | • 突出显示控制失败/意外事件。<br>-\
    \ 补救以解决流程/控制缺陷。<br>- 提供框架并支持相关政策和程序的实施。<br>- 帮助建立/监控第一道防线。<br>- 开发用于管理风险和问题的流程和控制措施。<br>-\
    \ 审查并更新风险清单以及对风险的响应。<br>- 运行自证流程。 |\n| 第三道防线——独立保证 | 审计和董事会 | | 对对组织应对风险的措施提供独立审查和报告。\
    \ |\n\n# 1: 网络安全 GRC 简介 \n\n该模型适用于任何规模或复杂性的组织——其目标是提供一个有效的（符合用途）、高效的（对正常运营影响有限）且经济的（考虑到风险或合规水平，成本不过高）的风险管理框架。防线之间的边界也可能不同。如果使用此模型，在组织内部定义这三道防线非常重要，包括不同防线之间如何互动，包括风险/事件的发现和信息的共享。风险是可能发生的事情；问题是已经发生的事情。\n\
    \n在网络安全的背景下，这三道防线可以被视为：\n\n1. 运营管理、托管安全服务提供商 (MSSP)、第三方供应商和服务提供商。\n2. CISO 和其他合规/审查职能（这部分可能融入非网络活动，例如数据合规）。\n\
    3. 合格的 IT 审计师\n\n对于网络健康安全，员工应被视为第一道防线。例如，虽然运营管理可能确保安装并更新反恶意软件，但终端用户仍可能通过点击链接或访问不适当网站而损害安全性。所有用户都需要接受网络风险的教育，并意识到对个人和整个组织带来的后果。这种意识可能会产生益处。\n\
    \n另一个问题是该模型可能被认为是孤立的。为了有效工作，防线需要整合，以减少发生泄露发生时的指责风险。\n\n# GRC 对网络安全的意义是什么？\n\n\
    我们生活在数字世界中——我们使用 IT 与朋友家人交流、购买商品和服务办理银行业务。网络安全可以定义为防止或检测对你的数据和 IT 资产进行盗取或破坏尝试的措施。网络与任何其他影响业务的风险没有太大。它会影响组织的声誉、合规性（包括数据隐私）和财务状况。网络不仅仅是一个\
    \ IT 问题——它影响了你开展业务和管理的所有方式。我们需要确保基于网络的安全活动与所有其他 GRC 活动一致，并受到类似的治理和控制。事实上，对于网络来说，可以认为\
    \ GRC 甚至更加重要。\n\n如果我们从犯罪分的角度来看这个问题，我们可以创建一个如下的用户故事：\n\n作为一名犯罪分子，我想访问并更改你的数据，以便我通过破坏你的声誉和/或获得财务回报来实现自己的目标。为了实现这一目标，我将针对对网络缺乏或没有整体控制的组织：\n\
    \n- 雇佣受训不当且对威胁产生轻信的用户；\n- 风险管理流程未正常运行（例如：不更新反恶意软件等安全工具、没有有效的密码管理等）；以及\n- 未能遵守法律/法规/最佳实践的网络卫生标准。\n\
    \n作为董事、经理或网络安全专家，你的工作是阻止他们。做到这一点的方法是是确保组织拥有有效的 GRC。我们将在接下来的章节中探索如何实现这一点。\n\n记住这一点也很重要，网络事件的影响可能远超直接成本。我们看到全球范围内网络公司在遭受攻击后进入了破产程序，特别是在发生个人数据泄漏的情况下。这可能是由于客户流失和/或巨额监管罚款造成的。\n\
    \n我们现在考虑良好的 GRC 如何帮助减少这些风险。\n\n# 第 2 章：网络安全治理\n\n> “董事会在改进其组织网络安全方面至关重要。”\n\n\
    NCSC 董事会网络安全工具包\n\n# 引言与概述\n\n良好的控制需要高层（董事和执行管理）良好的企业治理。高层管理应确保组织结构良好，并用强大的政策和理念进行管理。治理是构建其他控制和风险缓解的基础。例如，只有在确保人们遵守规则并对违规者追究责任的情况下，控制才是有效的。最终，无论发生在哪里，承担治理责任的人将承担责任。\n\
    \n这些企业治理，“实体级控制”渗透在组织，包括信息和网络活动。它们设定了组织的运营基调。然而，它们不应干扰日常运营，除非此类活动可能组织面临财务、法律/财政或声誉风险。良好治理的目标如图\
    \ 1 所示。\n\n![](img/ecdf4180ea2c887a7ae4a660f1fca_21_0.png)\n\n# 2: 网络安全治理\n\n\
    即使是小型组织也面临日益增加的网络犯罪风险，因为它们通常可以被用作针对同一供应链中其他组织的薄弱起点。网络犯罪分子方法的关键部分是“踩点”或调查其目标——这包括阅读有关新合同获奖的新稿以及这些客户和供应商的详情。因此，所有董事不仅对自己组织的利益相关者负有关怀责任，对关键业务伙伴的利益相关者也是如此。\n\
    \n董事和高级人员可能被针对，因为网络犯罪分子会在社交媒体等平台上收集信息，以便通过电子邮件或其他形式的接触冒充他们。董事必须意识到安全管理其个人社交媒体呈现的必要性。\n\
    \n极少数董事是网络安全专家。但所有董事都需要根据无术语的原则对网络安全有基本的理解和意识。为了帮助这一点，我们可以从董事的角度将治理表达为用户故事：\n\n\
    作为一名董事，我想以简洁、易懂的语言获得保证，确保我们：\n\n- 对网络风险和威胁进行了充分管理\n- 获知重大攻击和近乎发生的事件，并就防止发生的行动获得建议\n\
    - 获知我们主要第三方的安全安排，包括任何重大攻击\n- 有效且高效地利用我们在网络安全投资\n\n以便我们减少数据泄露和失去网络业务能力带来的声誉损失、巨额罚款和其他后果的影响和概率。\n\
    \n"
