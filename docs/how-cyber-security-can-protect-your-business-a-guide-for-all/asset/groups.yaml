    # 2: Cyber security governance


    Even small organisations are at increased risk from cyber criminals as they can
    often be used as a weak starting point to target other organisations in the same
    supply chain. A key part of cyber criminals'' approach is to ‘case the joint’
    or investigate their targets – this will include reading press releases about
    the awards of new contracts and the details of these customers and suppliers.
    Therefore, all directors owe a duty of care, not only to their own organisation''s
    stakeholders but also to those of key business partners.


    Directors and senior staff may be targeted in the same way, as cyber criminals
    search social media, etc. to gather information they can use when impersonating
    them via email or another form of contact. Directors must be made aware of the
