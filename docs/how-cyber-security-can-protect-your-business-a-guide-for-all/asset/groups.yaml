    The model can be applied to organisations of any size or complexity – the aim
    is to provide a risk management framework that is effective (fit for purpose),
    efficient (limited impact on normal, legitimate operations) and economic (costs
    not excessive given the level of risk or compliance needs). The boundaries between
    the lines may also vary. If this model is used, it is important that the three
    lines have been defined within the organisation, including how the different lines
    should interact, including in the sharing of findings and information about risks/incidents
    and issues. A risk is something that could happen; an issue is something that
    has happened.


    Within the context of cyber, the three lines could be considered as follows:


    +   1. Operational management, SEC OPS functions Managed Security Services Provider
    (MSSP), Third party suppliers and service providers.

    2. CISO and other compliance/review functions (in this part may be incorporated
    into non-cyber activities, e.g. data compliance).

    3. Qualified IT auditors/ISO audits.


    For cyber (as health and safety), staff should be considered the first line of
    defence. For example, while operational management may ensure that anti-malware
    is installed and updated, the end user may still compromise security by clicking
    a phishing link or visiting an inappropriate site. All users need to be educated
    on cyber risks and made aware of the risks and consequences both to them as individuals
    and to the organisation as a whole. This awareness could have benefits for their
    personal lives as well.


