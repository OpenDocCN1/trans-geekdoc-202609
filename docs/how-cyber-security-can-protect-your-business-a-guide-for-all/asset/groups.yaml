    # CHAPTER 2: CYBER SECURITY GOVERNANCE


    > “Boards are pivotal in improving the cyber security of their organisations."


    NCSC Cyber Security Toolkit for Boards


    # Introduction and overview


    Good control requires good corporate governance from the top (directors and executive
    management). Top management should ensure that the organisation is well structured
    and managed with strong policies and a strong ethos. Governance forms the foundation
    on which other controls and risk mitigations can be built. For example, controls
    will only be effective if there is the culture to ensure that they are adhered
    to and that anyone breaking these rules will be held to account and treated accordingly.
    Ultimately, those who hold governance accountability will be held responsible
    for all failures regardless of where they occur.


    These corporate governance, ‘entity-level controls’ are pervasive throughout the
    organisation, including information and cyber activities. They set the culture
    and tone for the organisation to operate. They should not, however, interfere
    with day-to-day operations, except where such activities could put the organisation
    at financial, legal/fiscal or reputational risk. The aim of good governance is
    shown in Figure 1.'
