    \ SIEM 信息），也应联系帮助台。\n\n## 网络攻击后的恢复工作\n\n一旦识别出潜在攻击，应启动网络安全事件计划。这应包括：\n\n### 评估影响\n\
    \n- 确保记录并安全保存攻击进展的证据。这对于分析事件以防止再次发生至关重要，并可能用于任何网络保险索赔。\n- 调查攻击的性质、范围、来源、规模、位置以及受影响的基础设施。\n\
    - 确认攻击期间可能有哪些信息被泄露或更改。\n- 通知所有负责解决问题的人员，并考虑还需要通知谁（监管机构、供应商、客户和保险公司）。\n- 理解对组织的潜在影响，并确保每个问题都上报到适当的管理层级。\n\
    \n### 抑制问题\n\n- 采取适当措施，例如：\n    - 移除并清理所有受感染的硬件；\n    - 通过备份恢复服务（如果安全）；\n    -\
    \ 停止/移除攻击者使用的访问；\n    - 将所有软件补丁至最新版本；以及\n    - 修改受影响用户的密码。\n- 检查日志以识别可能已经受到攻击的其他潜在目标。\n\
    - 运行反病毒软件。\n- 检查安全软件是否存在未经授权的更改。\n- 确保与媒体等的通信仅通过预先的渠道进行。\n- 根据需要向用户、监管机构和执法部门发布警告（例如，如果发生个人数据泄露，需在\
    \ 72 小时内通知 ICO）。\n\n### 事件后处理\n\n- 根据吸取的教训回顾并更新事件计划。\n- 考虑需要加强哪些控制和缓解措施。\n\n##\
    \ 总结\n\n规划并能够快速、高效地执行计划应该减少攻击的影响，并确保实现完全恢复。\n\n## 第 6 章：网络合规\n\n合规（Compliance）——\
    \ 名词\n\n> “遵守愿望、需求、建议或方案的行为或过程……”\n\n《韦伯-韦斯特词典》\n\n## 概述与介绍\n\n在网络安全背景下，我们寻求遵守组织的政策、程序和流程，以及法律法规。合规不应是年度性的“勾选任务”，而应是一个确保控制措施持续有效运行、并将罚款和声誉损失的风险降至最低的机会。它提供了保证，确保组织正在重视网络安全，并采取了设计、实施且有效运行的控制措施。网络\
    \ GRC（治理、风险与合规）不是一个完成后后被遗忘的一次性项目。它需要嵌入到组织的日常运营中——良好的合规框架可以提供这种保证，并识别任何持续改进的领域，即使在需求、控制或其涵盖的系统发生变化时也是如此。\n\
    \n合规还向董事会、保险公司和监管机构保证，确保了适当的治理且网络控制措施正在有效工作。在决定了需要遵守的内容后，需要一种方法来确保能够根据要求获取并提供合规证明。由于无论需求如何，负责或对合规负责的可能是同一批人，因此需要一种能够减少重复并确保没有合规漏洞的方法。比有一系列审查员/测试人员反复询问相同的问题，没有什么更让人感到沮丧或分散日常工作精力的事了。因此，合规需要一种协调的方法来实现：\n\
    \n1. 识别任何重大变更；\n2. 确保控制措施仍得到实施；\n3. 确保控制措施有效运行；以及\n4. 提供证据。\n\n在本章中，我们将考虑合规性并提供一个框架。\n\
    \n## 6: 网络合规\n\n### 表 3：网络安全要求\n\n| 您是否……？ | 适用性（是/否） | 要求 |\n| :--- | :--- |\
    \ :--- |\n| 拥有 IT 安全策略？ | | 遵循策略规定 |\n| 拥有 ISO 27001 认证（或希望与标准对齐）？ | | ISO 27001\
    \ |\n| 持有并处理居民个人数据？ | | GDPR |\n| 提供关键基础设施？ | | 《网络和信息系统》(NIS) 法例 |\n| 处理卡片信息？\
    \ | | PCI DSS |\n| 在美国证券交易所上市？ | | SOX |\n| 从第三方获取 IT 相关服务？ | | 第三方合规 – 供应商 |\n\
    | 向其他组织提供 IT 相关服务？ | | 第三方合规 – 供应商 |\n| 拥有网络保险保单？ | | 网络保险保单条款 |\n| 拥有网络安全认证（例如\
    \ Cyber Essentials）？ | | 符合计划要求 |\n\n这些内容旨在仅供参考，因为每个组织都需要评估自己的合规要求。另请注意，这是一个非常动态的领域，因此要求和运营地点正在发生变化。没有单一的要求。\n\
    \n### IT（或信息）安全策略\n\n所有组织都应该有一份 IT 安全策略，以明确其对用户、供应商和其他利益相关者的要求，并设定约定的网络安全参数。这些要求通常会与\
    \ ISO 27001 等国际标准对齐。这种对齐可以在比较不同组织时提供帮助（例如在收购一家公司后，审查两个实体的策略对齐情况）。使用 ISO 27001\
    \ 引用对此非常有帮助。策略应定期进行回顾、更新和传。它还可能得到其他标准（如 IT 使用规范）的支持。\n\n策略应明确识别哪些是强制性（“必须”），哪些是首选要求（“应该”）。它可能指示需要特别关注的地方，例如处理“最高机密”（即受限访问——例如与潜在的并购有关）或个人数据的系统。\n\
    \n策略内容可能有所不同，但通常会包括以下方面的网络安全要求：\n\n- 合规要求；\n- 系统开发与变更；\n- 访问与授权；\n- 网络安全；\n- 第三方；\n\
    - 反病毒；\n- IT 与安全运营；\n- 业务连续性；以及\n- 无线安全。\n\n将前述标题下的每条策略陈述映射到引言中规定的其他合规要求也是有用的。这有助于简化流程，并有助于确认策略的完整性和覆盖范围。\n\
    \n某些策略还包含建议的控制措施。在检查合规性时，需要确保符合实际策略语句，任何描述的控制措施仅具说明性，而非特定的合规要求。如果完全满足要求且方法定义清晰，这就足够了。\n\
    \n"
