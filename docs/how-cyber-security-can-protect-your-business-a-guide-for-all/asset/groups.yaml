    # 1: Introduction to cyber security GRC


    +   - Fail to comply with laws/regulations/best-practice cyber hygiene.


    Your job as a director, manager or cyber security specialist is to stop them.
    One way to do this is to ensure that your organisation has effective cyber GRC.
    We will explore how to achieve this in the following chapters.


    It is also important to remember that the impact of a cyber incident can go well
    beyond the immediate costs. We have seen cyber companies across the globe go into
    receivership following a cyber attack, particularly where there has been a breach
    of personal data. This can be due to loss of reputation/customers and/or potentially
    massive regulatory fines.


    We will now consider how good GRC can help reduce these risks.'
