    ## CHAPTER 4: CYBER RISKS AND CONTROLS


    ## Introduction and overview


    The process described in the previous chapter can be used to manage any risk management
    process, including cyber. Where cyber differs is in the specific nature of the
    risks faced by organisations and the controls used to mitigate them. Cyber risks
    can be categorised, like other IT security risks, using CIA.


    - Confidentiality – relates to organisations’ duty of care, and legal responsibility
    (under the GDPR or other relevant data privacy legislation); they must act as
    the guardian of the personal and sensitive data they hold on behalf of customers,
    employees, suppliers. Organisations also have a means to classify data based on
    its importance to the business, e.g. information relating to major tenders for
    new work, or future acquisitions may be regarded as ‘most confidential’. Both
    personal and highly confidential data/related information have value to cyber
    crooks, terrorists and even nation-state cyber criminals.


    - Integrity – for example, by changing your data and/or the way it is processed,
    cyber criminals can fraudulently extract money and cause embarrassment (e.g. inserting
    inappropriate comments into communications, diverting the mail, etc.).


    - Availability – for example, by locking access to data and systems and/or destroying
    data backups, crooks can exert money (via ransomware). This can lead to loss of
    reputation and customers, and additional expense (even if the ransom is not paid).


    Organisations should seek to reduce the likelihood that these risks will occur,
    and their potential business impact if a significant issue arises (including large
    fines and loss of reputation). There are several frameworks that organisations
    can use to identify and assess these risks and propose specific controls. One
    of the most common is the NIST Cybersecurity Framework, which includes five key
    functions for cyber activities:


    - 1. Identify – know what cyber resources you have and the risks they face.

    - 2. Protect – develop, implement and maintain protective safeguards against these
    risks.

    - 3. Detect – be aware of any unusual or suspicious activity or potential breaches.

    - 4. Respond – be able to take appropriate action if a suspected breach occurs.

    - 5. Recover – be able to restore activities and provide additional defences for
    future attacks.


    We can use these five functions to review the different risks and controls we
    would expect to see. There are many tools and applications available to help with
    each of these control areas.


    ## Identifying cyber risks and controls


    Before we can assess protection, we need to understand:


    - What assets and information do we have that are at risk?

    - What are the cyber risks we face?

    - What are the recent changes to specific threats we face?


    The assets and information held should be obvious, but often they are not. We
    live in an age where IT can almost be bought using petty cash, devices on your
    network may not be owned by your organisation, and asset registers are not updated
    to reflect changes made, or devices lost or retired. Some cyber risks and controls
    may be specific to types of device or system (particularly operating systems).
    Take, for example, the WannaCry attacks on an outdated Microsoft® operating system
    (XP)⁴.


    > ⁴ www.theguardian.com/technology/2017/may/12/nhs-ransomware-cyber-attack-what-is-wanacrypt-20.


    Without knowing what technology you have, appropriate controls cannot be developed.
    Ideally all organisations should have a configuration management database (CMDB).
    This is a standard requirement for ITIL®, the internationally accepted framework
    for IT service management (ITSM). As a minimum, organisations should know:


    - What cyber security they have;

    - How it is identified and where it is;

    - The configuration, including the latest patches and anti-malware software;

    - How this relates to other assets; and

    - What data is held and its sensitivity (level of confidentiality and personal
    data).


    Tools are available to automatically identify changes to configuration. The board
    should seek evidence that the asset register/CMDB is up to date and has been reviewed.


    This can be used as a basis for forming the risk assessment, and may be a requirement
    for any cyber insurance cover. It may not be cost effective to cover all risks
    – but they should at least be considered and reviewed. The risk assessment should
    also consider the internal and external threats faced both now and in the near
    future (for example, following the ‘go live’ of current projects). The process
    for risk assessment was described in the previous chapter. There should be controls
    to ensure that the risk assessment has been carried out and is regularly reviewed.
    This will usually be an annual review and approval.


    The threat landscape faced will vary by organisation, its profile and activities.
    For example, for an oil company there could be increased threats as a result of:


    - Large contracts tendered for particularly the risk from nation states or large
    organisations;

    - Increased environmental awareness; and

    - Media awareness.


    These are in addition to the common vulnerabilities found in software, operating
    systems and hardware.


    There is a significant amount of information available in the public domain to
    make organisations aware of these changing challenges. Many organisations also
    use a cyber threat monitoring service to keep up to date. These services often
    have access to additional threat identification resources and can filter threats
    to assess their likelihood and impact for your specific organisation.


    ## Third-party service providers


    Where organisations outsource some or all of their IT or other information-based
    functions, they are still accountable, and legally responsible for, the CIA of
    information. For cyber-related services, security needs needs to be considered
    at every stage of the third-party lifecycle:


    - Supplier selection

    - Agreement of contracts

    - Duration of contract

    - End of service


    Cyber criminals may see suppliers as an easy entry into your organisation’s defences,
    hence the need for vigilance throughout the lifecycle. During the supplier selection
    process, it is important to ensure that the shortlisted companies can provide
    a secure and well-managed service, in line with your security expectations. Decisions
    should not be made on cost alone. Your organisation should provide its IT security
    policy and other security requirements to ensure that the shortlisted suppliers
    are aware of what is expected and confirm that this can be achieved. There should
    also be some consideration of the provider’s ability and willingness to inform
    your organisation if they suffer a breach.


    During the agreement process, you should obtain evidence that the service can
    be delivered securely — for example independent (tested) reviews of the supplier’s
    services (e.g. SOC Type 2) and written confirmation of the security requirements.
    Without these, the supplier may seek additional payment or service variation after
    the contract has been signed. As part of the agreement, the supplier should be
    required to:


    - 1. Commit to ongoing compliance for any security requirements.

    - 2. Confirm the monitoring, audit and management reports to be provided, including
    their frequency, for security management;

    - 3. Confirm that your organisation has a right to access, physically and the
    service, by penetration testing or other tools;

    - 4. Agree the arrangements for updating the above requirements; and

    - 5. Agree arrangements for securely closing the contract and removing all access
    to sensitive data.


    During the contract, your organisation should ensure that all the promised reports,
    including audits, are provided and are reviewed. In addition, the right to audit
    the supplier should be exercised, if available. This helps build the relationship
    with the supplier and ensures that the service is being provided securely. There
    are several tools available to help with the assessment of third-party services.


    The end of the contract should also be considered so that your organisation can
    be assured of safe and effective service delivery during the transition and that
    all data has been handed over or destroyed by the service provider.

