    # What is the relevance of GRC to cyber?


    We live in a digital cyber-based world – we use IT to communicate with friends
    and family, purchase goods and services, and do our banking, to name just a few
    activities. Cyber security could be defined as:


    +   Measures to prevent or detect electronic attempts of theft or damage to your
    data and IT assets.


    Cyber is not very different from any other risk impacting a business. It can affect
    an organisation’s reputation, compliance (including data privacy and specific
    cyber compliance) and financial well-being. Cyber is not just an IT issue – it
    impacts the whole way that you do business and organisational administration.


    Cyber is not exempt from GRC. We need to ensure that cyber-based security activities
    are in line with all other GRC activities of the organisation and are subject
    to similar governance and control. Indeed, the threats and risks specific to cyber,
    it could be argued that GRC is even more important.


    If we consider this from the cyber criminal’s perspective, we may create a user
    story as follows:


    > As a ne’er-do-well, I want to access and change your data and information/deny
    you access to your systems and data so that I can meet my own evil agenda by damaging
    your reputation and/or ext a ransom or other financial reward. To achieve this,
    I will target organisations that have little or no overall control of cyber. They:


    +   - Employ badly trained users who are gullible to threats;

    - Have risk management processes that are not working (don’t update security tools
    such as anti-malware, no effective password management, etc.); and'
