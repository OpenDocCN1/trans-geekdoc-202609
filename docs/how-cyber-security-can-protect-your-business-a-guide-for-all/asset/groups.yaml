    ## 2: Cyber security governance


    Acceptance criteria


    To achieve this, I will need the Chief Information Security Officer (CISO) to
    provide regular, concise and easy-to-understand reports of:


    - 1. The threat landscape relevant to our business;

    - 2. Whether we have an organisational culture that is aware of these threats
    and acts appropriately;

    - 3. Progress we are making to reduce the risk (e.g. anti-malware deployment,
    attack management, user awareness, phishing programme, recent audit results);

    - 4. Attacks/breaches and how we have responded;

    - 5. Latest reviews of IT security policies and other security communications.


    This approach helps to explain the requirements and provides focus for both boards
    of directors and those who report to them.


    In the event of a breach or incident, any investigating regulators, such as the
    Information Commissioner''s Office (ICO) in the UK and the SEC if the company
    is US listed, will want to examine the cyber governance in place. They may consider:


    - The overall GRC framework;

    - Culture and awareness;

    - Threat and risk awareness;

    - Cyber risk management;

    - Preparation for response to attack.


    They will look for evidence of these activities, including board reports, meeting
    minutes and follow-up actions.


    ### Culture and awareness


    All staff need awareness of cyber security and how it impacts their role and duties.
    It should not be just an issue for cyber security specialists, but instead form
    part of the organisation’s overall hygiene – much like the health and safety,
    for example. Anyone who uses IT (and most will) is a key risk – but also a control
    to prevent cyber attacks. However, this ‘human firewall’ will only be effective
    if users are made aware of their cyber security responsibilities, given the tools
    to operate safely and securely (e.g. installed anti-malware), and motivated to
    act appropriately, including a willingness to prevent cyber risks and/or attacks
    immediately and effectively. Organisations ensure that it is easier for staff
    to perform the right behaviours than the wrong ones. Motivation also includes
    ensuring that these correct behaviours are recognised, and giving positive feedback.
    Failure to provide a response, for example after the reporting of an attempted
    phishing email, may lead to the individual not reporting future incidents.


    Good cultural change also relies on directors leading by example. It is inappropriate
    for directors to be a special case and excluded from the controls applied to everyone
    else, such as being allowed to use their own unsecured devices. When directors
    encounter a problem with a policy or procedure, this is the same for all users
    in the organisation – the emphasis should be on finding a better way to achieve
    the objective rather than allowing an exception or waiver for directors (who may
    be at higher risk of a cyber attack).


    The message needs to be re-reinforced at every opportunity – cyber security is
    not just for the annual security campaign. Better security will benefit all users
    – not only in their work but also personally as they will be more aware of scams
    such as approaches from bogus banks or broadband service providers.


    The board should receive regular reports on any campaigns and the level of user
    awareness of cyber risks and threats. This helps give an indication of the cyber
    security health of the organisation. Cyber ratings are publicly available indicators,
    like credit ratings but based on cyber hygiene indicators, that can also indicate
    an organisation’s resilience, and can be tracked over time.


    ### Threat and risk awareness


    The board needs to ensure that there are effective and efficient processes in
    place to understand the cyber threats faced by their organization, based upon:


    - The type of operation and any imminent changes;

    - The extent of digital and cyber activity;

    - Geographies they operate in;

    - Previous cyber issues;

    - Awareness of general and specific threats and vulnerabilities; and

    - Vulnerabilities due to technologies used (e.g. reliance on outdated technology
    that cannot be patched for known weaknesses.


    There are several publicly available and private service providers that provide
    regular updates on the specific threat landscape. Where there is cyber insurance
    in place, the insurer may also provide cyber intelligence reporting. The board
    should receive regular reports summarising the information provided and be informed
    of the effectiveness, cost and efficiency of the services provided.


    ### Risk management


    Directors need to ensure that there are processes and procedures for risk management
    and that these are operating effectively. This should include regular reporting
    of any known control weaknesses, the remediation actions taken and progress in
    resolving any high-risk areas. Where risks cannot be mitigated or controlled,
    it may be necessary to implement cyber insurance. The board may be required to
    provide evidence of this review as part of the cyber insurance cover for their
    organisation. Cyber risks are usually not covered by traditional policies for
    the organisation’s liability/professional indemnity. Specific policies for cyber
    pride provide additional cover for responding to incidents or data breaches.


    Risk management processes and specific cyber risks will be considered in subsequent
    chapters.


    ### Responding to cyber incidents


    The board needs to ensure that there is an effective plan in place to deal with
    a cyber attack, and that it has been tested, communicated and rehearsed. This
    may include, for example, the use of outside support agencies as ransomware negotiators,
    and identifying processes and procedures for escalation to the board and regulators.
    The plan should include communication arrangements to third parties and the media,
    detailing the communication chains and the training key staff should receive in
    media management. The plan should be reviewed and approved annually by the board,
    with additional reviews following a major cyber incident.


    ### Cyber SOX


    The Sarbanes-Oxley Act is legislation specific to companies registered on the
    US Stock Exchange (similar legislation exists in Japan for Japanese companies).
    It was introduced following financial reporting scandals to provide reassurance
    to markets and investors that financial reporting could be relied upon to make
    investment decisions. Organisations are required to implement controls to ensure
    the accuracy and completeness of financial reports, both of which are reviewed
    independently by the auditors as part of their annual review processes. From 2018,
    additional requirements were introduced for cyber. These require quarterly reporting
    to enable investors to make decisions based on the organisation’s cyber risk management
    and its response to any recent attacks. There is also emphasis on ensuring that
    those involved in responding to an incident do not use their ‘insider knowledge’
    to personally benefit via their share dealings.


    ### Summary: key cyber security questions for directors to ask


    Cyber security specialists may need to provide guidance on the questions that
    directors should be asking. Good cyber managers should be able to answer the following
    questions immediately.


    Culture and awareness


    - How aware are staff of the risks we face and the controls they need to operate?

    - What is the process for reviewing, updating and approving IT and cyber security
    policies?

    - How are the cyber security policies, procedures and controls publicised and
    enforced?

    - What can the board do to improve the cyber awareness culture? (E.g. reward good
    cyber behaviour, be seen to lead by example.)


    Threat/risk awareness and assessment


    - How have we identified the cyber threats relevant to our organisation?

    - How and when is this process reviewed?

    - How do we gather intelligence to monitor the changing threat landscape?

    - How is the board informed of these threats and risks?

    - What can the board do to improve awareness of risks and threats?


    Response to cyber incidents


    - What plans are in place to respond to a cyber incident or data breach?

    - Is there an effective media management process including training?

    - When were these most recently reviewed and tested?

