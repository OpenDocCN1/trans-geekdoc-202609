    # 5: Responding to an attack


    +   - Monitored, with the output analysed; and

    - Maintained to ensure it is updated for any configuration or requirement changes.


    # IT service helpdesk


    IT helpdesk employees should be trained and aware of potential attacks – for example,
    where there is a sudden increase in calls about:


    +   - Messages demanding ransom for the release of files;

    - PCs, etc. running slower than usual, even after following the normal processes
    to improve speed;

    - Being unable to access accounts or documents;

    - Strange emails (one organisation detected an attack because an email claiming
    to be from the finance department was too polite!);

    - Redirected Internet searches going to unusual addresses, e.g. ending in numbers
    rather than .com; and

    - Unexpected account activity (e.g. users seeing that their account was accessed
    while they were on holiday).


    Helpdesks should also be contacted where the SOC suspects an attack (e.g. based
    on SIEM information).


    # Recovery following a cyber attack


    Once a potential attack has been identified, the cyber incident plan should be
    initiated. This should include:


    # Assessing the impact


    +   - Ensuring that evidence of the progress of the attack is recorded and held
    securely. This will be important for the analysis of the incident to prevent it
    reoccurring, and may be required for any cyber insurance claim.'
