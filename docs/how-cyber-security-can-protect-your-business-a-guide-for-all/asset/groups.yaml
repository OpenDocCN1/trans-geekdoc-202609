    # 前言


    在曼彻斯特举行的一场 ISACA®会议上，我听了 Chris 的一场关于信息安全审计的演讲。很明显，凭借近四十年的经验，他对该领域已精如指掌。尽管房间里坐满了经验丰富的审计专业人士，但他用简洁的语言进行演讲，你不需要成为信息安全专业人士也能听懂。最后，他提到了他的新书*网络安全如何保护您的业务——面向所有利益相关者的指南*，以及他想要消除网络技术的神秘感。


    当他找我审阅这本书并撰写前言时，他并不知道我是这个书标题的忠实信徒，而且实际上还拥有 cybergrc.uk 域名以推广网络安全的良好实践。几乎每天，我都会与
    CEO、CISO、CRO 和 IT 总监坐在一起，讨论他们的业务网络安全审计需求，通过测试管理和技术控制的有效性和充分性来评估他们的运营韧性，并在发现机会时提出改进建议。


    这本书写得非常巧妙，能够吸引任何背景的读者。它深入剖析了网络安全，涵盖了专业人士、非专业人士或组织运营安全网络环境所需的所有内容。它认识到在组织中拥有 C
    级赞助者以促进网络安全投资的重要性，并明确指出在安全环境中运行是每个人的事务，而是 IT 专业人员的事务。网络治理、风险管理和合规方面的清晰性无论怎么强调也不不过。每一章都讨论了网络审计评审周期的组成部分，强调了风险控制矩阵方法在评估风险、测试控制方面的应用，并为利益相关者提供了提供保证路径。


    这本书对于想要开启网络安全审计和咨询职业的人来说是一本理想的指南，对于经验丰富的审计师来说是一个实用的参考来源，作者总结了他数十年的经验，为那些希望起步或从他即将谢幕的地方取得进步的人创造了一个“软着陆”。


    顺致网络问候，


    Yinka Akingbehin


    # 前言


    “网络”（Cyber）是一个我们一直在使用的词。但它意味着什么？对于我们这些董事和总经理来说意味着什么？对于 IT 安全经理和审计师来说又意味着什么？


    “网络”被认为源自较老的术语“控制论”（cybernetics）——基于电子/机械控制系统以及人造世界与人类世界相互作用程度。控制论源于希腊单词“kubernan”——意为操舵或控制。Kubern
    源于希腊单词“kubernetetes”——意为操舵手。因此，我们可以将网络视为人类与计算机之间的控制平衡。现在通常被理解为涵盖大多数与计算机/IT/物联网（IoT）相关的内容。


    这种“控制”方面往往被忽视。导致这一现象的原因之一是业务方面的技术性迟钝——他们听到了这些词，但在提到利润或亏损/成本降低等概念之前会走神，然后倾向于只关注这些。IT
    专业人士则对位、字节和令人兴奋的技术事物感兴趣。网络令人兴奋的方面之一是业务和技术管理这两个世界开始融合。部分是因为对依赖网络所面临威胁的意识日益增强，部分是为了应对监管机构、媒体和其他机构日益增加的压力。这两个部落需要的是一个中间人。


    这关乎平衡：我们如何继续安全、自信地享受我们的……


    根据《傻学者指南：SAP GRC》，治理、风险管理和合规（GRC）的目标是：


    - 开发 IT/网络安全策略

    - 实施合规流程和工具

    - 设计并实施用于网络合规的董事会报告

    - 设计、测试并实施网络 SOX 控制框架。


    然而，GRC 不仅仅于此。它不仅关乎确保满足合规，还关乎确保可能影响组织未来生存和盈利能力的重大风险已得到解决。这越来越多地包含了网络活动。之前的定义部分解释了为什么
    IT 经理将它们视为阻碍者而非促进者。GRC 应被视为一个促进整个组织良好安全的机会。


    本书的目的是为网络 GRC 提供一个有效的框架。像所有框架一样，它需要根据每个组织以满足其自身的风险偏好进行调整。书中解释了什么是 GRC，它如何应用于网络以及实施它需要什么。它的目标是引导经理和高管，而不诉诸“网络术语”；对于网络专家，它提供了一种用非术语、基于业务的语言解释网络问题的方法。


    作者欢迎对是否实现了这一目标的任何反馈。


    作者已根据1988年《版权、设计与专利法》主张其作者权利，要求标识为本书的作者。


    2019年由 IT Governance Publishing 在英国首次出版。


    ISBN 978-1-78778-196-2


    # 作者简介


    Chris 是一名合格会计师、注册信息系统审计师和认证 ScrumMaster，拥有超过 35 年提供 IT 安全咨询和审计/风险管理服务的经验。他在毕德工作过
    16 年，管理了多项信息安全审计和风险任务，包括项目风险和业务控制评审。他曾担任英国信息风险培训负责人，并在海外（包括印度和欧洲大部分地区）举办培训课程。Chris
    工作涉及广泛的行业领域，包括石油、公共部门和旅游。这些任务包括网络、GRC 实施和审计以及基于网络的项目实施。


    在过去的12 年里，他担任独立顾问，专注于大型 ERP 实施中的财务、萨班斯-奥克斯法案（SOX）和运营控制。


    Chris 是敏捷审计和治理问题的国际演讲师和培训师，并为 IT Governance Publishing 编写了四本其他著作：《敏捷治理与审计》（2014）、《尽职调查中的
