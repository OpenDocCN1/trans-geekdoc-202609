- pgno: 62
  md: '# 6: Cyber compliance


    Controls are designed, implemented and operated by the organisation where the
    risk would impact the accuracy of financial reporting. Organisations listed in
    the US should ensure compliance and the controls are subject to annual audit by
    external auditors. Failure to comply or be audited can result in civil and criminal
    actions, including against directors.


    # Third-party compliance


    The responsibility for operating cyber controls can be partly delegated to a service
    provider, but still needs to be controlled. Accountability, including the need
    for legal compliance, cannot be delegated. A customer organisation therefore still
    needs to ensure compliance. The compliance requirements should be detailed in
    the initial contract – otherwise additional costs or risks may be incurred. Compliance
    should include:


    +   1. Ensuring key performance and management indicators for security services
    and processes are received and reviewed on a regular basis;


    +   2. Updating the provider on any changes impacting the service;


    +   3. Notifying the customer promptly of any changes to controls at the provider,
    or any known breaches or incidents; and


    +   4. Ensuring independent auditors’ reports are received and reviewed for relevance
    and the right to audit is exercised if required.


    Where the organisation is a service provider, the converse of the above will apply.


    # Cyber insurance policy clauses


    Organisations should review their level of cover and need for cyber insurance.
    These policies can reduce the impact and cost of an attack, including third-party
    claims. This allows for the use of technical and other support. However, like
    all insurance policies, they may include exclusion clauses. It is therefore'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 6: Cyber compliance


    important for organisations to ensure compliance with these requirements in order
    not to lose cover. In addition to the normal information required for any type
    of policy, organisations may be required to provide details of data types and
    volumes; employment of IT, information and cyber security specialists; existing
    security arrangements; and history of any cyber incidents.


    The policies can be highly tailored, and exclusions and conditions can vary significantly
    between providers. To ensure compliance, the insured organisation needs to:


    +   1. Ensure that the information provided on the application is up to date and
    still accurate;


    +   2. Ensure correct claim processes, including timing of notification and by
    whom, are adhered to; and


    +   3. Obtain prior consent from the insurer before incurring costs as a result
    of the incident and ensure that the professionals selected meet the criteria of
    the insurer.


    # Summary


    To be cyber compliant, organisations need effective and up-to-date IT security
    policies and related procedures. These should be implemented and communicated
    so that compliance can be monitored and reviewed to identify areas of potential
    weakness and attack. In addition, there may be specific compliance requirements,
    based on the sector of operations and range of activities.'
  merge: -1
