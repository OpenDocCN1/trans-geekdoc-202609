- pgno: 47
  md: '# 4: Cyber risks and controls


    Controls should be in place to ensure that the preceding are being met, and to
    report instances where anti-malware has not been loaded (installed and operating),
    scans are not being performed, or definitions are not being updated.


    # Security by design


    The best time to incorporate security into a system or infrastructure is during
    a major change or development. Adding security layer later is expensive and may
    cause unnecessary disruption to the service provided. Cyber services are usually
    rapidly implemented and there is a risk that security may be overlooked. This
    can incur additional costs, not only from trying to add security later but also
    from the loss of business and reputation if insecure software is implemented.
    Security by design reduces this risk and covers:


    +   * Handling data securely;


    +   * Hardening applications and system settings (e.g. standard secure building
    of Unix systems); and


    +   * Configuring third-party applications.


    Data should be handled securely. For example, particular care should be taken
    to ensure that data used during development is not based on actual current data
    files. The system developed should also consider:


    +   * How and where data is to be stored and the period it is to be retained;


    +   * The flow of data through the system and how it will be protected during
    transit (e.g. use of encryption – with appropriate controls);


    +   * The ability to securely correct corrupted data; and


    +   * Password requirements configured according to risk (e.g. length and complexity
    of passwords, frequency of change, inactivity time allowed before user is locked
    out).'
  merge: -1
  img_proc: true
