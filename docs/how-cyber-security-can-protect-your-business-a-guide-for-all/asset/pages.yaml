  md: '# 6: Cyber compliance


    d) Minimising the impact of cyber security incidents – response and recovery planning,
    lessons learned.


    # Payment Card Industry Data Security Standard


    The Payment Card Industry Data Security Standard (PCI DSS) is a set of security
    requirements for the secure processing of card details, and applies to any organisation
    that accepts, processes, transmits or stores card details. Compliance levels are
    determined by individual payment brands or acquiring banks, based on individual
    payment brands. Compliance is based on specified controls and on a three-step
    process:


    +   1. Assessing – knowing cardholder data is held, listing payment card processing
    IT assets and business processes, and assessing for vulnerabilities. Assessments
    are performed by Qualified Security Assessors – individuals who work for companies
    qualified by the PCI Security Standards Council to perform these assessments.


    +   2. Remedating these vulnerabilities and ensuring cardholder data is only stored
    if absolutely necessary.


    +   3. Reporting – submitting required reports to the appropriate acquiring bank/card
    brand.


    # Sarbanes-Oxley Act


    The US Sarbanes-Oxley Act was introduced in 2002 in response to a loss of faith
    in financial reporting for US registered companies (e.g. Enron).¹⁰ For cyber compliance
    there are two elements:


    +   1. Cyber security reporting of risk management and incidents throughout the
    year.


    +   2. General IT controls that include cyber elements – e.g. access controls,
    incident management.


    > 10 https://corporatefinanceinstitute.com/resources/knowledge/other/enron-scandal/.'
