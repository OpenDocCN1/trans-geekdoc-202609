  md: '# CHAPTER 4: CYBER RISKS AND CONTROLS


    # Introduction and overview


    The process described in the previous chapter can be used to manage any risk management
    process, including cyber. Where cyber differs is in the specific nature of the
    risks faced by organisations and the controls used to mitigate them. Cyber risks
    can be categorised, like other IT security risks, using CIA.


    Confidentiality – relates to organisations’ duty of care, and legal responsibility
    (under the GDPR or other relevant data privacy legislation); they must act as
    the guardian of the personal and sensitive data they hold on behalf of customers,
    employees, suppliers, Organisations also have a means to classify data based on
    its importance to the business, e.g. information relating to major tenders for
    new work, or future acquisitions may be regarded as ‘most confidential’. Both
    personal and highly confidential data/related information have value to cyber
    crooks, terrorists and even nation-state cyber criminals.


    Integrity – for example, by changing your data and/or the way it is processed,
    cyber criminals can fraudulently extract money and cause embarrassment (e.g. inserting
    inappropriate comments into communications, diverting the mail, etc.).


    Availability – for example, by locking access to data and systems and/or destroying
    data backups, crooks can exert money (via ransomware). This can lead to loss of
    reputation and customers, and additional expense (even if the ransom is not paid).


    Organisations should seek to reduce the likelihood that these risks will occur,
    and their potential business impact if a significant issue arises (including large
    fines and loss of reputation). There are several frameworks that organisations
    can use to identify and assess these risks and propose specific controls. One
