    so the requirements and the locations of operation are changing over time. Even
    where there is no obligation to comply, the principles of these requirements may
    be applied to provide greater assurance to organisations that have sound cyber
    security defences. Next is a brief summary of each requirement, its applicability
    and key features.


    # IT (or information) security policy


    All organisations should have an IT security policy to identify their requirements
    to users, vendors and other interested stakeholders, and to set the agreed parameters
    for cyber security. Often these will be aligned with international standards such
    as ISO 27001. Such alignment can assist when comparing for different organisations
    (e.g. following the acquisition of a'
