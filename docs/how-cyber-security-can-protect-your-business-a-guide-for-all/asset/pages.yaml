- pgno: 60
  md: '# 6: Cyber compliance


    # Network and Information Systems (NIS) requirements


    The EU’s Directive on security of network and information systems (NIS Directive),
    adopted in 2016, and enacted in UK law as The Network and Information Systems
    Regulations (NIS Regulations) in May 2018,⁹ seeks to ensure that security, including
    cyber security, for infrastructure of national importance and criticality is resilient
    to any attacks. There are three parts:


    +   1. National capabilities – EU member states must have national cyber security
    capabilities (in the UK, the National Centre for Cyber Security (NCSC)).


    +   2. Cross-border collaboration – encourages cross-border collaboration and
    information sharing to reduce the risk of attack and improve responsiveness.


    +   3. National supervision of critical sectors – covers areas such as energy,
    transport, water, health and the finance sector.


    There are no specific compliance requirements, but the sharing of information
    can provide a useful source of checks to be included in compliance. Within the
    UK, the NCSC has set specific objectives and principles with mandatory security
    outcomes for those organisations providing critical services:


    +   a. Managing security risk – governance, risk management, asset management
    and supply chain.


    +   b. Protecting against cyber attack – policies and process, identity and access
    control, data security, system security, resilience of networks and systems, staff
    awareness and training.


    +   c. Detecting cyber security events – security monitoring, anomaly detection.


    > ⁹www.itgovernancepublishing.co.uk/product/network-and-information-systems-nis-regulations-a-pocket-guide-for-operators-of-essential-services.'
