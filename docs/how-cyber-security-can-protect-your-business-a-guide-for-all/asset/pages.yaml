  md: '# 4: Cyber risks and controls


    # Access management


    Poor access management is probably the main risk that is exploited by cyber criminals.
    This is because it is easy to exploit and it may be difficult to spot where the
    access appears to be authorised. Access management systems need to be designed,
    implemented and operated to:


    +   - Confirm the identity of all users, including new users;

    - Ensure users have least privilege – only enough rights to perform their legitimate
    duties, e.g. to ensure privileged system accounts are only used as authorised
    and intended.


    The processes for access management can be broadly covered as:


    +   - Policy authorisation and implementation;

    - Identity management;

    - Management of privileged users;

    - Access design and implementation; and

    - Operation/monitoring.


    An authorised policy should define who has access to what, how access is granted
    or revoked, what actions need to be recorded, and the process for reviewing and
    updating access rights. Guidance on policy is available in Clause 9 of ISO 27002.


    Anyone accessing your systems and data must be properly and immediately identified
    to ensure they are who they say they are and then given only their appropriate
    level of access. The most common way to do this is using a predefined and approved
    password. Users need to be educated on how to select a password that is not easy
    to guess; this can be enforced by configuration checks when passwords are created
    (e.g. ensuring a password includes a mix of upper- and lower-case letters, numbers
    and special characters, and is not a dictionary-defined word). Where passwords
    do not provide enough security, multi-factor authentication (based on a code sent
    to a hardware or'
