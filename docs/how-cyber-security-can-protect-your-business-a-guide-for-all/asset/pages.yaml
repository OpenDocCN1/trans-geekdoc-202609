- pgno: 24
  md: '# 2: Cyber security governance


    # Culture and awareness


    All staff need awareness of cyber security and how it impacts their role and duties.
    It should not be just an issue for cyber security specialists, but instead form
    part of the organisation’s overall hygiene – much like the health and safety,
    for example. Anyone who uses IT (and most will) is a key risk – but also a control
    to prevent cyber attacks. However, this ‘human firewall’ will only be effective
    if users are made aware of their cyber security responsibilities, given the tools
    to operate safely and securely (e.g. installed anti-malware), and motivated to
    act appropriately, including a willingness to prevent cyber risks and/or attacks
    immediately and effectively. Organisations ensure that it is easier for staff
    to perform the right behaviours than the wrong ones. Motivation also includes
    ensuring that these correct behaviours are recognised, and giving positive feedback.
    Failure to provide a response, for example after the reporting of an attempted
    phishing email, may lead to the individual not reporting future incidents.


    Good cultural change also relies on directors leading by example. It is inappropriate
    for directors to be a special case and excluded from the controls applied to everyone
    else, such as being allowed to use their own unsecured devices. When directors
    encounter a problem with a policy or procedure, this is the same for all users
    in the organisation – the emphasis should be on finding a better way to achieve
    the objective rather than allowing an exception or waiver for directors (who may
    be at higher risk of a cyber attack).


    The message needs to be re-reinforced at every opportunity – cyber security is
    not just for the annual security campaign. Better security will benefit all users
    – not only in their work but also personally as they will be more aware of scams
    such as approaches from bogus banks or broadband service providers.


    The board should receive regular reports on any campaigns and the level of user
    awareness of cyber risks and threats. This helps give an indication of the cyber
    security health of the organisation. Cyber ratings are publicly available indicators,
    like credit ratings but based on cyber hygiene indicators, that can also'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 2: Cyber security governance


    indicate an organisation’s resilience, and can be tracked over time.


    # Threat and risk awareness


    The board needs to ensure that there are effective and efficient processes in
    place to understand the cyber threats faced by their organisation, based upon:


    +   * The type of operation and any imminent changes;

    * The extent of digital and cyber activity;

    * Geographies they operate in;

    * Previous cyber issues;

    * Awareness of general and specific threats and vulnerabilities; and

    * Vulnerabilities due to technologies used (e.g. reliance on outdated technology
    that can

    * not be patched for known weaknesses.


    There are several publicly available and private service providers that provide
    regular updates on the specific threat landscape. Where there is cyber insurance
    in place, the insurer may also provide cyber intelligence reporting. The board
    should receive regular reports summarising the information provided and be informed
    of the effectiveness, cost and efficiency of the services provided.


    # Risk management


    Directors need to ensure that there are processes and procedures for risk management
    and that these are operating effectively. This should include regular reporting
