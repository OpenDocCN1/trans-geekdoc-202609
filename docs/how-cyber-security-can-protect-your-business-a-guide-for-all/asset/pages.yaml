- pgno: 57
  md: '# 6: Cyber compliance


    company, reviewing the alignment of the policies for the two entities). The use
    of ISO 27001 referencing can greatly assist with this process. The policy should
    be reviewed, updated and communicated on a regular basis. It may also be supported
    by other Standards such as acceptable use of IT.


    The policy should clearly identify those requirements that are mandatory (‘must’)
    and those that are preferred (‘should’). It may indicate where special attention
    needs to be applied, e.g. for systems processing ‘Most Confidential’ (i.e. restricted
    access – for example, relating to potential mergers and acquisitions), or personal
    data.


    Policy content may vary but generally will include cyber security requirements
    for:


    +   * Compliance requirements;

    * System development and change;

    * Access and authorisation;

    * Network security;

    * Third parties;

    * Anti-malware;

    * IT and security operations;

    * Business continuity; and

    * Wireless security.


    It is also useful to map each of the policy statements under the preceding headings
    to the other compliance requirements as identified in the introduction. This eases
    the complaints process and helps confirm the policy’s completeness and breadth
    of coverage.


    Some policies also include suggested controls. In checking compliance needs to
    ensure compliance with the actual policy statement, any described controls should
    be illustrative only and not a specific compliance requirement. If the requirement
    is fully met, and the approach clearly defined, this should be sufficient.'
