  md: '# CHAPTER 6: CYBER COMPLIANCE


    Compliance – noun


    > “the act or process of complying to a desire, demand, proposal, or regimen [...]”


    Merriam-Webster Dictionary


    # Overview and introduction


    In the context of cyber we are seeking to comply with our organisation’s policies,
    procedures and processes as well as with legislation. Compliance should not be
    an annual tick-box exercise, but an opportunity to ensure that controls continue
    to operate effectively and that the risks of financial penalties and loss of reputation
    are minim. It provides assurance that the organisation is taking cyber seriously
    and has controls in place that are designed, implemented and operating effectively.
    Cyber GRC is not a one-off project, to be completed and then forgotten about.
    It needs to be embedded as the organisation’s usual operations – a good compliance
    framework can provide this assurance and identify any areas for continuing improvement,
    even where there have been changes to requirements, controls or the systems they
    cover. A good compliance framework should have processes, people and tools that
    enable a consistent approach over time even where there are other changes.


    Compliance also provides assurance to the board, insurers and regulators that
    proper governance is in place and that cyber controls are working effectively.
    Having decided what needs to be complied with, a methodology is required to ensure
    that evidence of compliance can be obtained and provided as required. As it may
    be the same people responsible or accountable for compliance, regardless of requirement,
    an approach is needed that can reduce duplication and ensure there are no compliance
    gaps. There is nothing more frustrating or'
