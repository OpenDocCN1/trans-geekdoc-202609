    information security audit and risk assignments, including reviews of project
    risks and business controls. He was head of information risk training in the UK
    and ran training courses overseas, including India and throughout mainland Europe.
    Chris has worked in a wide range of industry sectors, including oil and gas, public
    sector, and travel. These assignments included cyber, GRC implementation and audit,
