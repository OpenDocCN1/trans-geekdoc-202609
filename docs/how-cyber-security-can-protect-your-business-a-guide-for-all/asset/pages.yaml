- pgno: 34
  md: '# 3: Cyber security risk management


    # Designing and implementing controls


    # Objective


    Where there are control gaps or inadequacies, new controls will need to be implanted.
    They should be designed in a way that will mitigate the risk and be easy to operate,
    ideally automatically operated within the process with minimum impact on its operation.


    Often it may not be possible to implement controls immediately, so temporary compensating
    controls may be required to provide mitigation during this build phase. Accepting
    the risk by having a ‘waver’ (or exception) alone is rarely adequate.


    # Testing of controls


    Where new controls have been designed and implemented, the following testing should
    be performed:


    +   1. Test design – does the control fully mitigate the risk?


    +   2. Walk-through – has the control been implemented? Is it working as intended?


    +   3. Is evidence retained?


    +   4. Which controls are key?


    +   5. Has all relevant documentation been updated?


    +   6. Are test scripts written in a way that they can be used by others and will
    generate similar results?


    # Summary


    In this chapter we considered the techniques to identify, assess, build, design,
    test and monitor controls. In the next chapter we will consider some of the risks
    and controls specific to cyber.'
