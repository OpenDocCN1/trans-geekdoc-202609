    is a risk of over-control, or having controls in place that do not meet a very
    high risk or that duplicate another control. In addition to not being cost effective,
    these could restrict your organisation’s ability to make beneficial changes to
    the way it operates or to enter new markets.


    Two models/analogies are often used to describe approaches to cyber protection:


    +   1. The fortress/castle

    2. The airport


    Consider a castle or fortress and how it is defended: thick walls with small windows,
    and a moat and drawbridge. Every inside is protected to the same level and has
    the same level of access throughout the fort. The threat is seen as mainly external.


    Now consider an airport. Those visiting the airport for a short time (e.g. aircraft
    enthusiasts, taxi drivers) will be subject to minimal security as they are seen
    as low risk. Passengers flying will be subject to identity and other security
    checks, appropriate to the risk of their destination (e.g. lower for domestic
    flights). Staff and crew will have even more controls, including verification
    of their identity and appropriate access to their roles, up to flight deck access
    for flying crew only. Specific access within the complex is based on the need
    and level of security.


    Traditional IT access was based on the fortress model, whereby the same controls
