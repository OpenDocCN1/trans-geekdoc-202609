    Prayer often attributed to Sir Francis Drake


    # Introduction and overview


    We all take risks every day. Life is a risky business. But without risk there
    is no progress. The same applies to organisations in the cyber world: there are
    risks of hacking, fraud, state interference and identity theft. But these have
    to be matched against risks of not doing business via cyber (e.g. failure to win
    new customers or reduce costs). The risks are so great so are the potential rewards:
    competitive advantage, reduction in costs, increased awareness of your products
    and services via social media, to name but a few. These risks can be managed in
    the same way you manage the daily risk of driving – by controls (ensuring your
    car is trustworthy and that you wear a seat belt, and having it serviced by a
    qualified technician), by following the rules that you cannot prevent (speed limits)
    and by insuring against the unknown risks that you cannot prevent. Every organisation
    needs to have a process for managing cyber risks.


    The process and terminology will vary between organisations, but the basic steps
    are likely to be as in Figure 2. Wherever possible, they should also be followed
    for cyber. They will help ensure that risks are stated in a format and style that
    business managers and executives can relate to.'
  merge: -1
