- pgno: 13
  md: '# CHAPTER 1: INTRODUCTION TO CYBER SECURITY GRC


    # Background to GRC


    Governance. Risk. Compliance (or ‘Control’). Simple words – but they encompass
    so much. They cover the steps taken by organisations to ensure they act ethically,
    legally and with integrity, and can effectively and efficiently handle risks (or
    other uncertainties) in achieving their business goals or other objectives.


    GRC was first defined by Scott Mitchell, OCEG, in 2007 as:


    +   the integrated collection of capabilities that enable an organization to reliably
    achieve objectives, address uncertainty and with integrity.²


    Governance is the ability to ensure the organisation achieves its goals and objectives.
    It includes policies and processes led by senior management and the board to provide
    overall control of their activities. Ultimately, they are accountable for the
    financial health and legal compliance of the organisation – sometimes at risk
    of criminal proceedings. Governance also includes providing the ethics and tone
    of the organisation, as well as the structures and policies within which it operates.


    Risk management is the ability to confidently act in a world of uncertainty: the
    process by which the organisation identifies, assesses and reviews the risks it
    faces in performing its operations. It also considers controls for these risks
    and ensures that adequate mitigations are in place (i.e. controls, insurance or
    risk acceptance).


    Compliance, the ability to act with ethical integrity, is the adherence to applicable
    laws and regulations, as well as to the company’s own policies and procedures.


    > ² www.oceg.org/about/what-is-grc/.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 1: Introduction to cyber security GRC


    The basic principles of GRC apply to all organisations regardless of size. However,
    the processes, people, information and technology used to achieve good GRC vary
    considerably between organisations depending mainly on their size and areas of
    activity. For example, whereas a large organisation will face complex governance
    issues (need for experienced and knowledgeable board members, risk management
    and compliance issues), and their compliance requirements will include financial
    regulations and anti-money laundering, a small corner café is likely to be owned
    and governed by a small number of people but needs to comply with food hygiene
    and other relevant regulations.


    GRC can be seen as an overhead – some might say GRC is an additional activity
    that does not directly add to the success or financial health of the organisation.
    Where GRC activity is not focused or co-ordinated, there can be redundant activities
    that neither provide business benefit nor strengthen the organisation’s governance,
    risk management or compliance. The aim is to simplify and manage the GRC process
    in such a way that it enables the organisation to fulfil its objectives, for example
    by providing the capability to enter new markets where the risk profile or compliance
    requirements are different to the rest of the organisation. This may involve embedding
    the risk management and compliance processes in normal business activities while
    automatically producing the key performance indicators (KPIs) and other reporting
    required by the main stakeholders for their governance activities. The main consideration
    is to provide a robust approach to handling the challenges of uncertainty and
    the risk of loss of reputation or customers, and even in some cases the risk of
    prison! Another benefit can be when mergers and acquisitions take place, the target
    company can more easily be integrated into the acquiring organisation’s GRC framework.


    GRC activities are often spread across organisations, including board secretariat,
    internal audit, compliance teams and risk teams in legal, finance, IT and HR,
    as well as within normal business operations. This can lead to conflicting activities
    across the different silos. There can also be inconsistencies in the level'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 1: Introduction to cyber security GRC


    and type of risk being addressed – risks important at local/departmental levels
    may be minute when compared to those of the organisation as a whole. Also, in
    large, complex organisations these activities may be replicated across the different
    constituent entities. In these cases there can therefore duplications of activities
    and gaps in coverage. Enterprise governance, risk and compliance (EGRC) seeks
    to provide a consistent, integrated approach to GRC across the organisation to
    reduce these duplications and potential duplications. It also provides a framework
    of policies, tools, processes and information reporting to simplify the activity
    and provide consistency.


    # The three lines of defence model


    To provide governance of the risk management process itself, many organisations
    use the three lines of defence model³ to explain their approach to managing risk.
    This model helps to assign specific risk management roles and responsibilities/duties,
    and to define the boundaries between them. The model is illustrated in Table 1.


    # Table 1: Summary of the Three Lines of Defence Model


    | Line | Usually | Typical activities |

    | --- | --- | --- |

    | First line – operational control | Business functions | • Embedded risk management.<br>•
    Direct contact with risks.|


    > ³ IIA Position Paper “The Three Lines of Defense in Effective Risk Management
    and Control”, OECG.'
