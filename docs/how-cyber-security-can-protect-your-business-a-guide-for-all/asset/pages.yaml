- pgno: 44
  md: '# 4: Cyber risks and controls


    # Firewalls


    A firewall acts as a barrier between the networks you trust and those you do not.
    It provides access control to only trusted networks and filters traffic; some
    firewalls also provide automatic blocking. They can be software or hardware based
    on a mixture of the two. Effective firewalls:


    +   * Are installed consistently;

    * Are governed by rules appropriate for the level of risk;

    * Have rulesets regularly updated and monitored; and

    * Are configured to these rules.


    Firewalls may be considered too restrictive where they restrict access for trusted
    traffic. The danger is changing the rules to be too open (e.g. by allowing an
    ''any-to-any'' rule). Organisations need to consider risk appetite and provide
    a balance between network accessibility and security.


    # Security patching


    When software suppliers or hardware vendors become aware of bugs within their
    products, they will issue a patch. This may include solutions for security vulnerabilities
    or weaknesses. If the software company knows of these vulnerabilities, it is highly
    likely that cyber criminals will also know and seek to exploit them (e.g. bypassing
    access controls to get high-level access privileges). Therefore, it is important
    to apply patches quickly. Some organisations have a policy of waiting a few weeks
    to see if issues arise with the patch (patches are sometimes issued to fix bugs
    in earlier patches). A better approach is to assess the change based on the information
    provided and then perform testing of the patch, or a phased rollout to ensure
    that it does not impact other software in use. For example, some application software
    may be based on an earlier version of the operating system and may not work effectively
    following the update. Where possible, patch updates should be rolled out automatically.
    Some patches are ‘Patch Tuesday’ normally on the second Tuesday'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 4: Cyber risks and controls


    of each month) or may be emergency patches in response to a sudden threat change.


    The effectiveness of patching will depend on having already identified what assets
    need to be patched. Patching should be a priority and not delayed unless it causes
    real problems. Patching should be issued and applied centrally within the organisation,
    and not able to be overridden by user preferences. Where patches cannot be applied,
    compensating controls should be identified, e.g. the application software causing
    the conflict could be isolated and replaced.


    # Vulnerability management


    There are several vulnerability management (VM) tools available. Vulnerability
    management was described by Park Foreman as the “cyclical practice of identifying,
    classifying, prioritizing, remediating, and mitigating”6 software vulnerabilities.
    Vulnerability management tools scan, assess and eliminate known vulnerabilities.
    Each vulnerability management provider will use publicly available or subscribed
    sources of vulnerabilities and their own sources. Tools may help identify where,
    for example, patches have not been applied, and help assess the risk/propose compensating
    controls. There may also be useful KPIs and other graphical information to summarise
    the results and impacts for governance compliance reporting.


