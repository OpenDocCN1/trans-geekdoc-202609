- pgno: 22
  md: '# 2: Cyber security governance


    Even small organisations are at increased risk from cyber criminals as they can
    often be used as a weak starting point to target other organisations in the same
    supply chain. A key part of cyber criminals'' approach is to ‘case the joint’
    or investigate their targets – this will include reading press releases about
    the awards of new contracts and the details of these customers and suppliers.
    Therefore, all directors owe a duty of care, not only to their own organisation''s
    stakeholders but also to those of key business partners.


    Directors and senior staff may be targeted in the same way, as cyber criminals
    search social media, etc. to gather information they can use when impersonating
    them via email or another form of contact. Directors must be made aware of the
    need to manage their personal social media presence securely.


    Very few directors are cyber security specialists. But all directors need to have
    a basic understanding and awareness of cyber security based on jargon-free principles.
    To help with this, we could express governance as a user story from the Director''s
    perspective:


    As a director I want assurance, in concise, understandable language, that we have:


    - Adequate management of cyber risks and threats

    - Been made aware of significant attacks and near misses, and advised of actions
    to prevent occurrence

    - Been made aware of security arrangements for our significant third parties including
    any significant attacks

    - Used our investment in cyber security effectively and efficiently


    So that we reduce the impact and likelihood of loss of reputation, large fines,
    and other consequences of data breaches and loss of ability to do cyber business
    through cyber risk.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 2: Cyber security governance


    Acceptance criteria


    To achieve this, I will need the Chief Information Security Officer (CISO) to
    provide regular, concise and easy-to-understand reports of:


    +   1. The threat landscape relevant to our business;

    2. Whether we have an organisational culture that is aware of these threats and
    acts appropriately;\n3. Progress we are making to reduce the risk (e.g. anti-malware
    deployment, attack management, user awareness, phishing programme, recent audit
    results);

    4. Attacks/breaches and how we have responded;

    5. Latest reviews of IT security policies and other security communications.


    This approach helps to explain the requirements and provides focus for both boards
    of directors and those who report to them.


    In the event of a breach or incident, any investigating regulators, such as the
    Information Commissioner''s Office (ICO) in the UK and the SEC if the company
    is US listed, will want to examine the cyber governance in place. They may consider:


    +   * The overall GRC framework;

    * Culture and awareness;

    * Threat and risk awareness;

    * Cyber risk management;

    * Preparation for response to attack.


    They will look for evidence of these activities, including board reports, meeting
    minutes and follow-up actions.'
