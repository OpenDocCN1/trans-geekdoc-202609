  md: '# PREFACE


    ‘Cyber’ is a word we use all the time. But what does it mean? What are the implications
    for us as directors and general managers? Or as IT security managers and auditors?


    ‘Cyber’ is thought to derive from the older term ‘cybernetics’ – based on electronic/mechanical
    control systems and the degree to which man-made and human worlds interact. Cybernetics
    is derived from the Greek word ‘kubernan’ – to steer or control. Kubern is derived
    from the Greek word ‘kubernetetes’ – or steersman. So, we can think of cyber as
    the balance of control between humans and computers. It is now usually understood
    to cover most computer/IT/Internet of Things (IoT) related.


    This ‘control’ aspect is often overlooked. One of the reasons for this has been
    technical deafness on the part of business – they hear the words but zone out
    until the concepts of profit or loss/cost reduction are mentioned, and then tend
    to focus just on those. IT professionals have been more interested in bits and
    bytes and exciting techie stuff. One of the exciting aspects of cyber is that
    these two worlds of business and technology management have started to merge.
    Partly because of a growing awareness of the threats facing cyber reliance, and
    partly as a response to increased pressure from regulators, the media and other
    agencies. What both tribes need is a go-between.


    It’s about balance: how do we continue to safely and confidently enjoy the benefits
    of our modern life – instant communication, and the ability to order goods and
    services whenever and wherever we want, having checked bank balances and socially
    networked all of our friends to brag about our purchases.


    The aim of governance, risk and compliance (GRC), according to SAP GRC for Dummies,
    is to:'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Preface


    Efficiently put policies and controls in place to address all compliance obligations
    while at the same time gathering information that helps proactively run the business.¹


    However, GRC is more than that. It is not just about ensuring compliance obligations
    are met, but also about providing assurance that significant risks that could
    impact the future viability and profitability of the organisation have been addressed.
    Increasingly this includes the reliance on information and cyber activity.


    The preceding definition does partly explain why IT security professionals are
    sometimes opposed to GRC. It is seen as an overhead that does not provide business
    benefit and get in the way of what they are trying to achieve. The irony is that
    this is exactly how project managers, IT service providers, and other information/IT
    managers see them as blockers rather than enablers. GRC should be seen as an opportunity
    to promote good cyber governance throughout an organisation in order to provide
    an effective foundation for cyber security.


    The purpose of this book is to provide an effective and efficient framework for
    cyber GRC. Like all frameworks, it will need to be adapted for each organisation
    to meet their own risk appetite and synchronise with their GRC policies, processes
    and tools. The book explains what is meant by GRC, how it applies to cyber and
    what is required to implement effective cyber GRC. Its aim is to guide managers
    and executives without resorting to ‘cyber-babble’; any feedback on whether it
    achieves this is welcome. The book will be of interest to non-cyber specialists,
    including non-executive directors, who may be required to review cyber arrangements.
    For cyber specialists, it provides an approach for explaining cyber issues in
    non-jargonistic, business-based language.


    > ¹ Denise Vu Broaday and Holly A Roland, SAP GRC for Dummies!, Dummies, 2008.'
  merge: -1
  img_proc: true
