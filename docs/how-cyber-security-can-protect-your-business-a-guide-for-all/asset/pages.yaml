    mine cryptrencies;


    +   * Spyware – covertly watches what is being done and then reports this activity
    without you knowing (can include smart TVs and other IoT devices).


    Cyber criminals and others are constantly seeking to install malware to plant
    the above on your systems. It is not a question of if there has been an attempt
    to hack and install malware. It is a question of when – and were you able to stop
    them.


    There are several anti-malware (AM) products available: software that runs in
    the background (but can also be used to scan files received via email or on media)
    to scan for known profiles of common malware such as computer viruses. Anti-malware
    scans, detects and quarantines malware to prevent it becoming embedded in your
    computers and doing damage. It looks for known fingerprints of malware in expected
    locations on your computers and enables scans of all files (including email attachments)
    as required.


    Effective anti-malware is:


    +   * Implemented consistently;


    +   * Updated regularly with the latest malware definitions; and


    +   * Used – both in a passive and active mode.'
  merge: -1
