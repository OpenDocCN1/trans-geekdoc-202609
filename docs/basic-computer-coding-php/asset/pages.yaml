  md: '# Basic Computer Coding: PHP


    # AddModule


    You must uncomment this line for the static module version of Apache.


    AddModule mod_php4.c


    # 1.2.3 PHP.INI File Configuration


    The PHP configuration file, php.ini, is the final and most immediate way to affect
    PHP''s functionality. The php.ini file is read each time PHP is initialized.in
    other words, whenever httpd is restarted for the module version or with each script
    execution for CGI version. If your change isn''t showing up, remember to stop
    and restart httpd. If it still isn''t showing up, use phpinfo() to check the path
    to php.


    The configuration file is well commented and thorough. Keys are case sensitive,
    keyword values are not; whitespace, and lines beginning with semicolons are ignored.
    Booleans can be represented by 1/0, Yes/No, On/Off, or True/False. The default
    values in php.ini-dist result in a reasonable PHP installation that can be tweaked
    later.


    Here we are explaining the important settings in php.ini which you may need for
    your PHP Parser.


    # short_open_tag = Off


    Short open tags look like this: <?? ?>. This option must be set to On if you want
    to use XML functions.


    # safe_mode = Off


    If this is set to On, you probably compiled PHP with the --enable-safe-mode flag.
    Safe mode is most relevant to CGI use. See the explanation in the section “CGI
    compile-time options”, earlier in this chapter.


    # safe_mode_exec_dir = [DIR]


    This option is relevant only if safe mode is on; it can also be set with the --exec-dir
    flag during the Unix build process. PHP in safe mode only executes external binaries
    out of this directory.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The default is /usr/local/bin. This has nothing to do with serving up a normal
    PHP/HTML Web page.


    # safe_mode_allowed_env_vars = [PHP_]


    This option sets which variables users can change in safe mode. The default is
    only those variables prepended with "PHP". If this directive is empty, most variables
    are alterable.


    # safe_mode_protected_env_vars = [LD_LIBRARY_PATH]


    This option sets which environment variables can''t change in safe mode, even
    if safe_mode_allowed_env_vars is set permissively


    # disable_functions = [function1, function2...]


    A welcome addition to PHP4 configuration and one perpetuated in PHP5 is the ability
    to disable selected functions for security reasons. Previously, this necessitated
    hand-editing the C code from which PHP was made. Filesystem, system, and network
    functions should probably the first to go because allowing the capability to write
    files and alter the system over HTTP is never such a safe idea.


    # max_execution_time = 30


    The function set_time_limit()won work in safe mode, so this is the main way to
    make a script time out in safe mode. In Windows, you have to abort based on maximum
    memory consumed rather than time. You can also use the Apache timeout setting
    to if you use Apache, but that will apply to non-PHP files on the site.


    # error_reporting = E_ALL & ~E_NOTICE


    The default value is E_ALL & ~E_NOTICE, all except notices. Development servers
    should be set to at least the default; only production servers should even consider
    a lesser value'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# error_prepend_string = ["""]


    With its backend, error_append_string, this setting allows you to make error messages
    a different color than other text, or what have you.


    # warn_plus_overloading = Off


    This setting issues a warning if the + operator is used with strings, as in a
    form value.


    # variables_order = EPGCS


    This configuration setting supersedes gpc_order. Both are now deprecated along
    with register_globals. It sets the order of the different variables: Environment,
    GET, POST, COOKIE, and SERVER (aka Built-in).You can change this order in left-to-right
    order, with the rightmost one winning the hand every time. This means if you left
    the default setting and happened to use the same name for an environment variable,
    a POST variable, and a COOKIE variable, the COOKIE variable would own that name
    at the end of the process. In real life, this does not happen much.


    # register_globals = Off


    This setting allows you to decide whether you wish to register EPGCS as global.
    This is now deprecated, and as of PHP4.2, this flag is set to Off by default.
    Use superglobal arrays instead. The major code listings in this book use superglobal
    arrays.


    # gpc_order = GPC


    This setting has been GPC Deprecated.


    # magic_quotes_gpc = On


    This setting escapes in incoming GET/POST/COOKIE data. If you use a lot of forms
    which possibly submit to themselves or other forms and display form values, you
    may need to set this directive to On or prepare to use addslashes() on string-type
    data.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# magic_quotes_runtime = Off


    This setting escapes quotes in incoming database and text strings.


    If this setting is Off, you will need to use stripslashes() when outputting any
    type of string data from a SQL database. If magic_quotes_sybase is set to On,
    this must be Off.


    # magic_quotes_sybase = Off


    This setting escapes single quotes in incoming database and text strings with
    Sybase-style single quotes rather than backslashes. If magic_quotes_runtime is
    set to On, this must be Off.


    # Remember


    SQL adds slashes to single quotes and apostrophes when storing strings does not
    strip them off when returning


    # auto-prepend-file = [path/to/file]


    If a path is specified here, PHP must automatically include() it at the beginning
    of every PHP file. Include path restrictions do apply.


    # auto-append-file = [path/to/file]


    If a path is specified here, PHP automatically include() it at the end of every
    PHP file,unless you escape by using the exit() function. Include path restrictions
    do apply.


    # include_path = [DIR]


    If you set this value, you will only be allowed to include or require files from
    these directories. The include directory is generally under your document root;
    this is mandatory if you.re running in safe mode. Set this to . in order to include
    files from the same directory your script is in. Multiple directories are separated
    by colons: :/usr/local/apache/htdocs:/usr/local/lib.'
