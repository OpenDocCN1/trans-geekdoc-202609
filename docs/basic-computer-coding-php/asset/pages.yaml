- pgno: 12
  md: '# Preface


    PHP is a general purpose, server-side scripting language run a web server that''s
    designed to make dynamic pages and applications. PHP (Hypertext Pre-Processor)
    is a server-side web programming language that is widely used for web development.
    However, there are many languages which are used for web development or web programming.
    Among all of them PHP is the most popular web scripting language. So, let us find
    out why PHP is widely used for web development. PHP language has its roots in
    C and C++. PHP syntax is most similar to C and C++ language syntax. So, programmers
    find it easy to learn and manipulate.


    # Organization of the Book


    This book is systematically divided into seven chapters. This book is designed
    for PHP programmers who are completely unaware of PHP concepts but they have basic
    understanding of computer programming. Including basic through advanced functionality,
    this book explains how to develop dynamic Web applications, such as guest books,
    chat rooms, and shopping carts.


    Chapter 1 covers essential background on the PHP language. It describes the nature
    and history of PHP, which platforms it runs on, and how to configure it. This
    chapter ends by showing you PHP in action, with a quick walkthrough of several
    PHP programs that illustrate common tasks, such as processing form data, interacting
    with a database, and creating graphics.


    Chapter 2 shows you the data types, the PHP operators, the flowcontrol statements.
    PHP allow eight different types of data types. All of them are discussed in this
    chapter.


    Chapter 3 discusses the functions in PHP and explains the CPU usage information.
    Functions are useful because they contribute to rapid, reliable, error-reducing
    coding, and increase flexibility by tidying up complicated code sequences. A focus
    on serialization is given.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Chapter 4 focuses on PHP string functions and use of parsing in PHP. A PHP
    string is a sequence of characters i.e. used to store and manipulate text. String
    is one of the data types supported by PHP. The string variables can contain alphanumeric
    characters.


    Chapter 5 talks about creating an array, adding and removing elements from an
    array, and looping over the contents of an array. Because arrays are very common
    and useful, there are many built-in functions that work with them in PHP.


    Chapter 6 is intended to focus on PHP objects and classes. The basic building
    blocks of object-oriented programming are classes and objects. Understanding object
    and class is very important before we can dive into object-oriented programming
    approach.


    Chapter 7 focuses on understanding the HTTP basics. The HTTP daemon in the destination
    server machine receives the request and sends back the requested file or files
    associated with the request. Therefore, all of the components that make up a site
    are interdependent on one another.'
  merge: -1
  img_proc: true
