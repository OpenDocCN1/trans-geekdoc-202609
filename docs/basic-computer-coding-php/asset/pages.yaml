  md: '$subjects = array("physics", "chem", "math", "bio", "cs", "drama", "classics");


    We can remove the "math", "bio", and "cs" elements by telling array_slice() to
    start at position 2 and remove 3 elements:


    ```

    $removed = array_slice($subjects, 2, 3);

    // removed = array("math", "bio", "cs")

    // subjects = array("physics", "chem", "drama", "classics");

    ```


    If you omit the length, array_slice() removes to the end of the array:


    ```

    $removed = array_slice($subjects, 2);

    // removed = array("math", "bio", "cs", "drama", "classics");

    // subjects = array("physics", "chem");

    ```


    If you simply want to delete elements from the source array and you do not care
    about retaining their values, you do not need to store the results of array_slice():


    ```

    $array_slice($subjects, 2);

    // subjects = array("physics", "chem");

    ```


    To insert elements where others were removed, use the fourth argument:


    ```

    $new = array("law", "business", "IS");

    array_slice($subjects, 4, 3, $new);

    // subjects = array("physics", "chem", "math", "bio", "law", "business", "IS");

    ```


    The size of the replacement array does not have to be the same as the number of
    elements you delete. The array grows or shrinks as needed:


    ```

    $new = array("law", "business", "IS");

    array_slice($subjects, 3, 4, $new);

    // subjects = array("physics", "chem", "math", "law", "business", "IS");

    ```


    To insert new elements into the array while pushing existing elements to the right,
    delete zero elements:


    ```

    $subjects = array("physics", "chem", "math");

    $new = array("law", "business");

    array_slice($subjects, 2, 0, $new);

    // subjects = array("physics", "chem", "law", "business", "math");

    ```


    Although the examples so far have used an indexed array, array_slice() also works
