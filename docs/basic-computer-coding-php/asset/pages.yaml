    $reversedNumbers = range(5, 2); // $reversedNumbers = array(5, 4, 3, 2);

    ```


    Only the first letter of a string argument is used to build the range:

    range("aaa", "zzz"); // same as range(''a'',''z'')


    # Getting the Size of an Array


    The count() and sizeof() functions are identical in use and effect.

    They return the number of elements in the array. There is no stylistic preference
    about which function you use. Here''s an example:


    ```

    $family = array("Fred", "Wilma", "Pebbles"); // $size is 3

    $size = count($family);

    ```


    This function counts only values that are actually set:

    $confusion = array(10 => "ten", 11 => "eleven", 12 => "twelve"); // $size is 3

    $size = count($confusion);


    # Padding an Array


    To create an array with values initialized to the same content, use array_pad().
    The first argument to array_pad() is the array, the second argument is the minimum
    number of elements you want the array to have, and the third argument is the value
    to give any elements that are created. The array_pad() function returns a new
    padded array, leaving its argument (source) array alone.


    Here''s array_pad() in action:


    ```

    $scores = array(5, 10);

    $padded = array_pad($scores, 5, 0); // $padded is now array(5, 10, 0, 0, 0)

    $padded = array_pad($scores, -5, 0); // $padded is now array(0, 0, 0, 5, 10);

    ```


    Notice how the new values are appended to the end of the array. If you want the
    new values added to the start of the array, use a negative argument:


    If you pad an associative array, existing keys will be preserved. New elements
    will have numeric keys starting at 0.'
