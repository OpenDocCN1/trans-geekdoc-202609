- pgno: 166
  md: '# SUMMARY


    +   - Array functions allow you to interact with and manipulate arrays in various
    ways. Arrays are essential for storing, managing, and operating on sets of variables.


    +   - An array is a data structure that stores one or more similar type of values
    in a single value.


    +   - Numeric arrays can store numbers, strings and any object but their index
    will be represented by numbers. By default array index starts from zero.


    +   - PHP arrays have an internal order to their elements that is independent
    of the keys and values, and there are functions that you can use to traverse the
    arrays based on this internal order.


    +   - The associative arrays are very similar to arrays but they are different
    in terms of their index. Associative array will have their index as string so
    that you can establish a strong association between key and values.


    +   - Storing a value in an array will create the array if it did not already
    exist, but trying to retrieve a value from an array that has not been defined
    would not create the array.


    +   - A multi-dimensional array each element in the main array can also be an
    array. And each element in the sub-array can be an array, and so on. Values in
    the multi-dimensional array are accessed using multiple index.'
