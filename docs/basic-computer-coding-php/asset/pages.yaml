  md: '# PHP Function


    The swap function swaps the numbers between the $a and $b variables. The original
    variables are not affected.


    Variable is a storage location identified by a memory address) paired with an
    associated symbolic name (identifier), which contains some known or unknown quantity
    of information referred to as a value.


    $a = 4;


    $b = 7;


    At the beginning, these two variables are initiated.


    swap($a, $b);


    We call the swap() function. The function takes $a and $b variables as parameters.


    $temp = $a;


    $a = $b;


    $b = $temp;


    Inside the swap() function, we change the values. Note that the $a and $b variables
    are defined locally. They are valid only inside the swap() function.


    $ php swap1.php


    outside swap function:


    $a is 4


    $b is 7


    inside swap function:


    $a is 7


