- pgno: 187
  md: "# Basic Computer Coding: PHP\n\n```\n&object(person)(1) {\n  [\"name\"]=>\n\
    \    string(6) \"Barney\"\n}\n```\n\n$fred is a copy of the object that the constructor\
    \ stored in $people[0], while $barney is an alias for the object that the constructor\
    \ stored in $people[1]. When we change the properties of $fred, we’re not changing\
    \ the object that is in $people[0]. However, when we change the properties of\
    \ $barney, we are changing the object in $people[1]. To prevent copying on assignment,\
    \ assign by reference: $obj=$& new Class;\n\nThis code makes $obj alias for the\
    \ new object, which was $this in the constructor. If the constructor stores a\
    \ reference to $this, it keeps a reference to $obj.\n\nThe documentation for a\
    \ class should say whether you need to use &= with its constructor. In most cases,\
    \ this isn’t necessary."
