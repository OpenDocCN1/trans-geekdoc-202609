- pgno: 221
  md: "# Basic Computer Coding: PHP\n\n```\n$msg = \"You have visited this page \"\
    . $_SESSION['counter'];\n$msg .= \"in this session.\";\n?>\n```\n\n```\n<html>\n\
    \n<head>\n  <title>Setting up a PHP session</title>\n</head>\n\n<body>\n  <?php\
    \ echo ($msg); ?>\n</body>\n</html>\n```\n\nIt will produce the following result\
    \ –nYou have visited this page 1in this session.\n\n# Destroying a PHP Session\n\
    \nA PHP session can be destroyed by session_destroy() function. This function\
    \ does not need any argument and a single call can destroy all the session variables.\
    \ If you want to destroy a single session variable then you can use unset() function\
    \ to unset a session variable. Here is the example to unset a single variable\
    \ –\n\n```\n<?php\nunset($_SESSION['counter']);\n?>\n```\n\nHere is the call which\
    \ will destroy all the session variables –\n\n```\n<?php\n  session_destroy();\n\
    ?>\n```"
