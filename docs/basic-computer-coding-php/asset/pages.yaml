    While at Tufts enjoyed his first experience as an inventor, securing a patent
    for a device for land surveying, which he called the profile tracer. It looked
    something like a lawnmower with two bicycle wheels and a pendulum, and as was
    pushed over land, integrating and recording horizontal and vertical measurements.
    Vannevar thought it would be commercially successful, but it never caught on.
    The young man learned many things from this failure–become a real engineer he
    needed to learn more than math and physics. He needed to learn how to effectively
    deal with people.


    The same difficulties faced Bush during the WWI, when he was working for US Navy,
    to which he proposed his idea for a device, that would use magnetic fields to
    detect submarines. His device proved to be successful in testing, but Navy officials,
    did not deploy the device correctly and it proved useless in combat. Bush again
    learned that a successful engineer also had to be a politician.


    In 1919, Bush left Tufts and went to MIT’s electrical engineering department as
    a professor of electrical power transmission. Starting from 1925, Bush began construction
    of mechanical devices for performing integration. First was the Product Intergraph,
    next was the Differential Analyzer, an analog computer that could solve differential
    equations with many as 18 independent variables. It actually used large gears
    and other mechanical parts to solve equations. In 1931, he completed the first
    differential analyzer (see the lower photo). At the same time, Bush and team at
    MIT develop the “network analyzer”, a system for setting up miniature versions
    of large and important electrical networks. Later Bush constructed an improved
    Differential Analyzer, built by electronic tubes, which was used intensively during
    the WWII.


    Bush and his Differential Analyzer


