- pgno: 222
  md: "# Turning on Auto Session\n\nYou don't need to call start_session() function\
    \ to start a session when a user visits your site if you can set `session.auto_start`variable\
    \ 1 in `php.ini`.\n\n# Sessions without cookies\n\nThere may be a case when a\
    \ user does not allow to store cookies on their machine. So there is another method\
    \ to send session ID to the browser.\n\nAlternatively, you can use the constant\
    \ SID which is defined if the session started. If the client did not send an appropriate\
    \ session cookie, if it has the form session_name=session_id. Otherwise, it expands\
    \ to an empty string. Thus, you can embed it unconditionally into URLs.\n\nThe\
    \ following example demonstrates how to register a variable, and how to click\
    \ correctly to another page using SID.\n\n```\n<?php\nsession_start();\n\nif (isset($_SESSION['counter']))\
    \ {\n    $_SESSION['counter'] = 1;\n} else {\n    $_SESSION['counter']++;\n}\n\
    \n$msg = \"You have visited this page \". $_SESSION['counter'];\n$msg .= \"in\
    \ this session.\";\n\necho ( $msg );\n?>\n```\n\n<p>To continue click following\
    \ link <br /></p>"
  merge: -1
  img_proc: true
