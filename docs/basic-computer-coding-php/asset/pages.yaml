    # Vannevar Bush


    Vannevar Bush born on March 11, 1890, in Everett, Massachusetts, in a family of


    the Universalist minister—the Reverend Richard Perry Bush of Provincetown, MA,
    and Emma Linwood (Paine) Bush had two sisters. As a child, he was sickly and occasionally
    bedridden for long periods of time. Still, he was self-confident and sometimes
    times got into fights with other boys. He once said, "all of my recent ancestors
    [before my father] were sea captains, and they have a way of running things without
    any doubt. So it may have partly that, and partly my association with my grandfather,
    who was a whaling skipper. That left me with some inclination to run show once
    I was in it.


    Bush did well in the primary school, where he showed an aptitude for math and
    to tinker. His later father became a pastor at Chelsea, MA, where Vannevar attended
    the high school. At the same time he had a versatile workshop in his home. After
    graduation, he went off to Tufts College to study engineering. Half of his expenses
    were paid by a scholarship, to pay the other half, he worked as a tutor and aid
    in the math department. Vannevar studied earnestly and earned a masters degree
    in the time it easily takes to earn a bachelors degree. In 1913 he graduated the
    college as M. S. and went to work for General Electric, testing electrical equipment.
    1914-1915 Bush went to teach mathematics at Jackson College.


    In 1915 he entered the Massachusetts Institute of Technology (MIT) electrical
    engineering program. Spurred by the need for financial security to marry, Bush
    finished his thesis in less than a year. On 5th of September, 1916, he married
    to Phoebe Davis, a Chelsea girl, whom he had known since Tufts. The family had
    two sons: Richard Davis Bush and John Hathaway Bush. At the end of the same 1916
    he had a Doctor if Engineering'
