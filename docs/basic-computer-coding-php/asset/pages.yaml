- pgno: 21
  md: '# Basic Computer Coding: PHP


    # 1.1.5 The History of PHP


    PHP is an “HTML-embedded scripting language” primarily used for dynamic Web applications.
    The first part of this definition means that PHP code can be interspersed with
    HTML, making it simple to generate dynamic pieces of Web pages on the fly. As
    a scripting language, PHP code requires the presence of the PHP processor. PHP
    code is normally run in plain-text scripts that will only run on PHP-enabled computers
    (conversely programming languages can create standalone binary executable files,
    a.k.a. programs). PHP takes most of its syntax from C, Java, and Perl. It is an
    open source technology and runs on most operating systems and with most Web servers.
    PHP was written in the C programming language by Rasmus Lerdorf in 1994 for monitoring
    his online resume and related personal information. For this reason, PHP originally
    stood for “Personal Home Page”. Lerdorf combined PHP with his own Form PHP/FI
    (generally referred to as PHP 2.0) on June 8, 1995. Two programmers, Zeev Suraki
    and Andi Gutmans, rebuilt PHP’s core, releasing the updated result as PHP/FI 2
    in 1997. The acronym was formally changed to PHP: HyperText Preprocessor at this
    time. (This is an example of a recursive acronym: the acronym itself is in its
    own definition.) In 1998, PHP 3 was released, which was the first widely used
    version. PHP 4 was released in May 2000, with a new core, known as the Zend Engine
    1.0. PHP 4 featured improved speed and reliability over PHP 3. PHP 4 added references,
    the Boolean type, COM support on Windows, output buffering, many new array functions,
    expanded object-oriented programming, inclusion of the PCRE library,


    Interpreter is a computer program that directly executes, performs, instructions
    written in a programming or scripting language, without requiring them to have
    been compiled into a machine program.'
  merge: -1
  img_proc: true
