- pgno: 39
  md: '# Basic Computer Coding: PHP


    # ROLE MODEL


    # Rasmus Lerdorf


    Rasmus Lerdorf (born 22 November 1968) is a Danish-Canadian programmer. He created
    the PHP scripting language, authoring the first two versions of the language and
    participated in the development of later versions led by a group of developers
    including Jim Winstead (who later created blo.gs). Stig Bakken, Shane Caraveo,
    Andi Gutmans, and Zeev Suraski. He continues to contribute to the project.


    # Early Life and Education


    Lerdorf was born in Disko Island on Greenland and moved to Denmark in 1980, and
    moved to King City, Ontario in 1983. He graduated from King City Secondary School
    in 1988, and in 1993 he graduated from the University of Waterloo with a Bachelor
    of Applied Science in Systems Design Engineering. He contributed to the Apache
    HTTP Server and added the LIMIT clause to the mSQL DBMS. A variant of this LIMIT
    clause had already been around for a decade in mainframe relational database management
    systems (like Oracle Rdb running on VAX/VMS, formerly from Digital Equipment Corporation),
    but apparently it had not yet been picked by the emerging PC-based databases.
    It was later adapted by several other SQL-compatible DBMS. He released the first
    version of PHP in 1995.


    # Career


