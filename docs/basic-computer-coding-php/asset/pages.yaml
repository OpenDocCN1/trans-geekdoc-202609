  md: "# 6.3.5 References\n\nWhen you assign an object to another variable, you create\
    \ a copy:\n$fred = new Person;\n$copy = $fred;\n$fred->name(\"Fred\");\n\nprint\
    \ $copy->name(); // does not print \"Fred\"\nYou now have two Person objects,\
    \ $fred and $copy, with independent property values. This is also the case when\
    \ you assign the results of a call to a constructor, as shown here:\n\n$fred =\
    \ new Person;\nThe object created by the Person constructor is copied, and the\
    \ copy is stored in $fred. This means that $this in the constructor and $fred\
    \ actually refer to two different objects. If the constructor creates an alias\
    \ to $this through a reference, it won't create an alias to $fred. For example:\n\
    \n```\n$people = array();\nclass Person {\n    function Person () {\n        global\
    \ $people;\n        $people[] = &$this;\n    }\n}\n$fred = new Person;\n$fred->name\
    \ = \"Fred\";\n$barney = &new Person;\n$barney->name = \"Barney\";\nvar_dump($people);\n\
    array(2) {\n    [0]=>object(person)(0) {\n}\n    [1]=>\n```"
  merge: -1
