  md: '# INTRODUCTION


    Object-oriented programming (OOP) is way of organizing your code to be more efficient,
    and it takes advantage of some really nice features in modern versions of PHP.
    One of the basic concepts of OOP is, not surprising, an object. Directly related
    to working with objects is understanding PHP classes.


    The fundamental idea behind an object-oriented language is to enclose a bundle
    of variables and functions into a single unit and keep both variables and functions
    safe from outside interference and misuse. Such a unit is called object which
    acts on data. The mechanism that binds together data and functions are called
    encapsulation. This feature makes it easy to reuse code in various projects. The
    functions declared in an object provides the way to access the data. The functions
    of an object are called access to variables called properties.


    The following picture shows the components of an object.


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_171_0.png)


    # 6.1 PHP OBJECTS AND CLASSES


    The basic building blocks of object-oriented programming are classes and objects.
    Understanding object and class and the differences between object and class is
    very important before we can dive into object-oriented programming approach.'
