    # 7.2.2 Sessions


    An alternative way to make data accessible across the various pages of an entire
    website is to use a PHP Session.


    A session creates a file in a temporary directory on the server where registered
    session variables and their values are stored. This data will be available to
    all pages on the site during that visit.


    The location of the temporary file is determined by a setting in the php.ini file
    called session.save_path. Before using any session variable you have setup this
    path.


    When a session is started following happen –


    +   - PHP first creates a unique identifier for particular session which is such
    as 3c70fj34c3jij973hjkop2fc937e3443.

    - A cookie named PHPSESSID is automatically sent to the user''s computer to store
    unique session identification string.

    - A file is automatically created on the server in the designated temporary directory
    and bears the name of the unique identifier prefixed by sess__ie_3c70fj34c3jij973hjkop2fc937e3443.


    When a PHP script wants to retrieve the value from a session variable, PHP automatically
    gets the unique session identifier string from the PHPSESSID cookie and then looks
    in its temporary directory for the'
