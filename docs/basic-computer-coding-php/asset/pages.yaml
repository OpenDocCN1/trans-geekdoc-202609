    \ statement works with two other keywords: case and break. The case keyword is\
    \ used to test a label against a value from the round brackets. If the label equals\
    \ the value, the statement following the case is executed. The break keyword is\
    \ used to jump out of the switch statement. There is an optional default statement.\
    \ If none of the labels equals the value, the default statement is executed.\n\
    \nA switch statement is a type of selection control mechanism used to allow the\
