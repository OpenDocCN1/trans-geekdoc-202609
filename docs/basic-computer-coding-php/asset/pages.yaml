- pgno: 41
  md: '# SUMMARY


    +   PHP Stands for “Hypertext Preprocessor.” (It is a recursive acronym, if you
    can understand what that means.) PHP is an HTML-embedded Web scripting language.
    This means PHP code can be inserted into the HTML of a Web page.


    +   PHP is an “HTML-embedded scripting language” primarily used for dynamic Web
    applications. The first part of this definition means that PHP code can be interspersed
    with HTML, making it simple to generate dynamic pieces of Web pages on the fly.


    +   The Windows server installation of PHP running IIS is much simpler than on
    Unix, since it involves a precompiled binary rather than a source build.


    +   Apache uses httpd.conf file for global settings, and the .htaccess file for
    per-directory access settings. Older versions of Apache split up httpd.conf into
    three files (access.conf, httpd.conf, and srm.conf), and some users still prefer
    this arrangement.


    +   The PHP configuration file, php.ini, is the final and most immediate way to
    affect PHP''s functionality. The php.ini file is read each time PHP is initialized.in
    other words, whenever httpd is restarted for the module version or with each script
    execution for the CGI version. If your change isn''t showing up, remember to stop
    and restart httpd. If it still isn''t showing up, use phpinfo() to check the path
    to php.ini.'
  merge: -1
  img_proc: true
