    # 3.1.8 Passing arguments by value and by reference


    PHP supports two ways of passing arguments to functions. The default way is passing
    arguments by value. When we pass arguments by value, the function works only with
    the copies of the values. This may lead to performance overheads when we work
    with large amounts of data.


    When we pass values by reference, the function receives a reference to the actual
    value. The original values are affected when modified. This way of passing values
    is more time and space efficient. On the other hand, it is more error prone.


