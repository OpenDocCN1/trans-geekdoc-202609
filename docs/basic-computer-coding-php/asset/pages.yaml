  md: 'and more. Maintenance releases of PHP 4 are still available, primarily for
    security updates.


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_22_0.png)


    PHP 5 was released in July 2004, with the updated Zend Engine 2.0. Among many
    new features in PHP 5 are:


    +   * improved object-oriented programming

    * embedded SQLite

    * support for new MySQL features (see the image at right)

    * exception handling using a try..catch structure

    * integrated SOAP support (see the image at right)

    * the Filter library (in PHP 5.1)

    * better XML tools

    * iterators


    and much, much more.


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_22_1.png)'
  merge: -1
