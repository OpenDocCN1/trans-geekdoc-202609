- pgno: 154
  md: '# PHP Arrays


    as integers. Thus, $array[3] and $array[''3''] reference the same element, but
    $array[''03''] references a different element. Negative numbers are valid keys,
    but they do not specify positions from the end of the array as they do in Perl.


    Constant is a value that cannot be altered by the program during normal execution,
    i.e., the value is constant.


    You do not have to quote single-word strings. For instance, $age[''fred''] is
    the same as $age[fred]. However, it is considered good PHP style to always use
    quotes, because quiteless keys are indistinguishable from constants. When you
    use a constant as an unquoted index, PHP uses the value of the constant as the
    index and emits a warning:


    ```

    define(''index'', 5); // retrieves $array[5], not $array[''index'']

    echo $array[''index''];

    ```


    You must use quotes if you are using interpolation to build the array index:

    $age["Clone{$number}"]


    Although sometimes optional, you should quote the key if you are interpolating
    an array lookup to ensure that you get the value you expect:


    ```

    // these are wrong

    print "Hello, {$person[''name'']}";

    print "Hello, {$person["name"]}";

    ```


    # 5.2.4 Storing Data in Arrays


    Storing a value in an array will create the array if it did not already exist,
    but trying to retrieve a value from an array that has not been defined would not
    create the array. For example:


    ```

    // $addresses not defined before this point // prints nothing

    echo $addresses[0]; // prints nothing

    echo $addresses; // prints nothing

    ```'
