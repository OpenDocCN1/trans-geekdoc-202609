- pgno: 216
  md: 'Here is the detail of all the arguments –


    +   - **Name** – This sets the name of the cookie and is stored in an environment
    variable called HTTP_COOKIE_VARS. This variable is used while accessing cookies.


    +   - **Value** – This sets the value of the named variable and is the content
    that you actually want to store.


    +   - **Expiry** – This specify a future time in seconds since 00:00:00 GMT on
    1st Jan 1970. After this parameter is not set, then cookie will become inaccessible.
    If automatically expire when the Web Browser is


    +   - **Path** – This specifies the directories for which the cookie is valid.
    A single forward slash character permits the cookie to be valid for all directories.


    +   - **Domain** – This can be used to specify the domain name in very large domains
    and must contain at least two periods to be valid. All cookies are only valid
    for the host and domain which created them.


    +   - **Security** – This can be set to 1 to specify that the cookie should only
    be set by secure transmission using HTTPS otherwise set to 0 which mean cookie
    can be sent by regular HTTP.


    Following example will create two cookies **name** and **age** these cookies will
    be expired after one hour.


    ```

    <?php

    setcookie("name", "John Watkin", time()+3600, "/", "", 0);

    setcookie("age", "36", time()+3600, "/", "", 0);\?>

    ```


