- pgno: 15
  md: '# Basic Computer Coding: PHP


    # INTRODUCTION


    PHP is a simple yet powerful language designed for creating HTML content. This
    chapter covers essential background on the PHP language. It describes the nature
    and history of PHP which platforms it runs on, and how to configure it. This chapter
    ends by showing you PHP in action, with a quick walkthrough of several PHP programs
    that illustrate common tasks, such as processing form data, interacting with a
    database, and creating graphics.


    # 1.1 PHP (HYPERTEXT PREPROCESSOR)


    PHP Stands for “Hypertext Preprocessor.” (It is a recursive acronym, if you can
    understand what that means.) PHP is an HTML-embedded Web scripting language. This
    means PHP code can be inserted into the HTML of a Web page. When a PHP page is
    accessed, the PHP code is read or “parsed” by the server page resides on. The
    output from the PHP functions on the pages are typically returned as HTML code,
    which can be read by the browser. The PHP code is transformed into HTML before
    the page is loaded, users cannot view the PHP code on a page. This PHP pages secure
    enough to access databases and other secure information.


    A lot of the syntax of PHP is borrowed from other languages such as C, Java and
    Perl. However, PHP has a number of unique features and specific functions as well.
    The goal of the language is to allow Web developers to write dynamically generated
    pages quickly and easily. PHP is also easy for creating database-driven Web sites.
    If you would like to learn more about PHP, the official site is PHP.net.


    The PHP Hypertext Preprocessor (PHP) is a programming language that allows web
    developers to create dynamic content that interacts with databases. PHP is basically
    used for developing web based software applications.


    PHP is a script language and interpreter that is freely available and used primarily
    on Linux Web servers. PHP, originally derived from Personal Home Page Tools, now
    stands for PHP: Hypertext Preprocessor, which the PHP FAQ describes as a “recursive
    acronym.”'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Introduction to PHP


    PHP executes on the server, while a comparable alternative, JavaScript, executes
    on the client.

    PHP is an alternative to Microsoft’s Active Server Page (ASP) technology. As with
    ASP, the PHP script is embedded within a Web page along with its HTML. Before
    the page is sent to a user who has requested it, the Web server calls PHP to interpret
    and perform the operations called for in the PHP script.


    An HTML page that includes a PHP script is typically given a file name suffix
    of "php", "php7", or "htmlhtm”. Like ASP, PHP can be thought of as “dynamic HTML
    pages,” based on the results of interpreting the script.


    # DID YOU KNOW?


    PHP was developed by Rasmus Ldorf in 1995, and later it has been developed as
    open source. The PHP Group now manages the implementation of PHP.


    PHP is an open-source language, used primarily for dynamic web content and server-side
    applications. PHP is often pointed to as the main competitor with the following:


    +   - Microsoft’s C# — Visual Basic.NET — ASP family

    - Sun’s Java — JSP

    - Macromedia’s ColdFusion

    - CGI — Perl


    PHP has many open-source libraries included with the core, and many more are readily
    available. Extensions exist to help interface with a number of systems, including
    IRC, a number of compression formats, and Windows API. Other extensions exist
    to let PHP generate file formats on-the-fly, such as a popular extension that
    allows it to create Adobe Flash® movies.


    Interface is a shared boundary across two or more separate components of a computer
    system exchange information.


    Since version 3, PHP has integrated object oriented features. Version 5 built
    substantially on this limited functionality, and the language'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Basic Computer Coding: PHP


    now has robust object oriented capabilities, including interfaces, exceptions,
    destructions, and abstracts.


    PHP reached wide-spread popularity with version 4, released in 2000. In 2004,
    version 5 debuted, and it is now considered one of the top languages used for
    server-side scripting.


    No doubt much of its popularity is due to its relative ease to learn, and its
    notorious looseness. Arrays and variables in PHP are able to hold any type of
    object, variables need not be declared, and the syntax is remarkably simple.


    Unlike many languages, such as C# or Perl, which have primarily a following of
    more general programmers, many PHP programmers know no other language. This occasionally
    causes it to be dismissed as a lesser language, but its growing popularity and
    the many robust and efficient sites built using it as a structure to dispel this
    myth.


    PHP has occasionally been criticized for what are viewed by some security flaws,
    in comparison to languages such as ASP. A lack of easily understandable error
    messages, a sometimes overly robust configuration file, and an obviously incomplete
    set of builtin functions are also pointed to areas which could use marked improvement.


    Development continues solace, however, and with each successive build, the language
    appears to address more and more of the concerns raised by its open-source community.


    # 1.1.1 What Does PHP Do?


    PHP can be used in three primary ways:


    +   - Server-side scripting

    - Command-line scripting

    - Client-side GUI applications


    # Server-Side Scripting


    PHP was originally designed to create dynamic web content, and is still best suited
    for that task. To generate HTML, you need the PHP parser and a web server through
    which to send the coded'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Introduction to PHP


    documents. PHP has also become popular for generating XML documents, graphics,
    Flash animations, PDF files, and so much more.


    # Command-Line Scripting


    PHP can run scripts from the command line, much like Perl, awk, or the Unix shell.
    You might use the command-line scripts for system administration tasks, such as
    backup and log parsing; even some CRON job type scripts can be done this way (nonvisual
    PHP tasks).


    # Client-Side GUI Applications


    Using PHP-GTK, you can write full-blown, cross-platform GUI applications in PHP.
    However, we concentrate on the first item: using PHP to develop dynamic web content.
    PHP runs on all major operating systems, from Unix variants including Linux, FreeBSD,
    Ubuntu, Debian, and Solaris to Windows and Mac OS X. It can be used with all leading
    web servers, including Apache, Microsoft IIS, and the Netscape/iPlanet servers.
    The language itself is extremely flexible.


    You are not limited to outputting HTML or other text files—any document format
    can be generated. PHP has built-in support for generating PDF files, GIF, JPEG,
    and PNG images, and Flash movies.


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_18_0.png)


    One of PHP’s most significant features is its wide-ranging support for databases.
    PHP supports all major databases (including MySQL, PostgreSQL, Oracle, Sybase,
    MS-SQL, DB2, and ODBC-compliant ones), and even the more recent NoSQL-'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Basic Computer Coding: PHP


    style databases like SQLite and MongoDB are also supported. With PHP, creating
    web pages with dynamic content from a database is remarkably simple.


    Finally, PHP provides a library of PHP code to perform common tasks, such as database
    abstraction, error handling, and so on, with the PHP Extension and Application
    Repository (PEAR). PEAR is a framework and distribution system for reusable PHP
    components. You can find out more about it here.


    # 1.1.2 Common Uses of PHP


    +   - PHP performs system functions, i.e. from files on a system it can create,
    open, read, write, and close them.


    +   - PHP can handle forms, i.e. gather data from files, save data to a file,
    through email you can send data, return data to the user.


    +   - You add, delete, modify elements within your database through PHP.


    +   - Access cookies variables and set cookies.


    +   - Using PHP, you can restrict users to access some pages of your website.


    +   - It can encrypt data.


    # 1.1.3 Characteristics of PHP


    Five important characteristics make PHP’s practical nature possible –


    +   - Simplicity


    +   - Efficiency


    +   - Security


    +   - Flexibility


    +   - Familiarity


    # 1.1.4 “Hello World” Script in PHP


    To get a feel for PHP, first start with simple PHP scripts. Since “Hello, World!”
    is an essential example, first we will create a friendly little “Hello, World!”
    script.'
  merge: -1
  img_proc: true
- pgno: 20
  md: "As mentioned earlier, PHP is embedded in HTML. That means in amongst your normal\
    \ HTML (or XHTML if you’re cutting-edge) you’ll have PHP statements like this\
    \ –\n\n```\n<head>\n  <title>Hello World</title>\n</head>\n<body>\n  <?php echo\
    \ \"Hello, World!\";?>\n</body>\n</html>\n```\n\nIt will produce following result\
    \ –nHello, World!\n\nIf you examine the HTML output of the above example, you’ll\
    \ notice that the PHP code is not present in the file sent from the server to\
    \ your Web browser. All of the PHP present in the Web page is processed and stripped\
    \ from the page; the only thing returned to the client from the Web server is\
    \ pure HTML output.\n\nAll PHP code must be included inside one of the three special\
    \ markup tags Ate are recognised by the PHP Parser.\n<?php PHP code goes here\
