    <?php\n$target_dir = \"uploads/\";\n$target_file = $target_dir . basename(\\$_FILES[\"\
    fileToUpload\"][\"name\"]);\n$uploadOk = 1;\n$imageFileType = strtolower(pathinfo($target_file,PATHINFO_EXTENSION));\n\
    // Check if image file is an actual image or fake image\nif(isset(\\$_POST[\"\
