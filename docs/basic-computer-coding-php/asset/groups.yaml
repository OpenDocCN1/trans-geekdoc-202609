    # 5.2 ARRAYS\n\nAn array is a data structure that stores one or more type of values\
    \ in a single value.\n\n### 5.2.1 Numeric Array\n\nThese arrays can store numbers,\
    \ strings and any object but their index will be represented by numbers. By default\
    \ array index starts from zero.\n\n#### Example\n\nFollowing is the example how\
    \ to create and access numeric arrays. We have used array() function to create.\
    \ This function is explained in reference.\n\n```php\n<html>\n<body>\n<?php\n\
    /* First method to create array. */\n$numbers = array(1, 2, 3, 4, 5);\n\nforeach($numbers\
    \ as $value) {\n    echo \"Value is $value<br>\";\n}\n\n/* Second method to create\
    \ array. */\n$numbers[0] = \"one\";\n$numbers[1] = \"two\";\n$numbers[2] = \"\
    three\";\n$numbers[3] = \"four\";\n$numbers[4] = \"five\";\n\nforeach($numbers\
    \ as $value) {\n    echo \"Value is $value<br>\";\n}\n?>\n</body>\n</html>\n```\n\
    \nThis will produce the following result:\nValue is 1\nValue is 2\nValue is 3\n\
    Value is four\nValue is five\n\n### 5.2.2 Indexed Versus Associative Arrays\n\n\
    There are two kinds of arrays in PHP: indexed and associative. The keys of indexed\
    \ arrays are integers, beginning at 0. Indexed arrays are used when you identify\
    \ things by their position. Associative arrays have strings as keys and behave\
    \ more like tables. The first column is the key, which is used to access the value.\n\
    \nPHP internally stores all arrays as associative; the only difference between\
    \ indexed and associative arrays is what the keys happen to be. Associative arrays\
    \ are very similar to numeric arrays in functionality but they are different in\
    \ terms of their index. Associative array will have their index so that you can\
    \ establish a strong association between key and values.\n\nTo store the salaries\
    \ in an array, a numerically indexed array would not be the best choice. Instead,\
    \ we could use the employees as names in our associative array.\n\n```php\n<html>\n\
    <body>\n<?php\n/* First method to associate array. */\n$salaries = array(\"hammad\"\
    \ => 2000, \"qadir\" => 1000, \"zara\" => 500);\n\necho \"Salary of mohammad is\
    \ \" . $salaries['hammad'] . \"<br>\";\necho \"Salary of qadir is \" . $salaries['qadir']\
    \ . \"<br>\";\necho \"Salary of zara is \" . $salaries['zara'] . \"<br>\";\n\n\
    /* Second method to create array. */\n$salaries['hammad'] = \"high\";\n$salaries['qadir']\
    \ = \"medium\";\n$salaries['zara'] = \"low\";\n\necho \"Salary of mohammad is\
    \ \" . $salaries['hammad'] . \"<br>\";\necho \"Salary of qadir is \" . $salaries['qadir']\
    \ . \"<br>\";\necho \"Salary of zara is \" . $salaries['zara'] . \"<br>\";\n?>\n\
    </body>\n</html>\n```\n\n### 5.2.3 Identifying Elements of an Array\n\nBefore\
    \ we look at creating an array, let us look at the structure of an existing array.\
    \ You can access specific values from an existing array using the array variable’s\
    \ name, followed by the element’s key, or index, within square brackets:\n\n```php\n\
    $age['fred']\n$shows[2]\n```\n\nAs integers. Thus, $array[3] and $array['3'] reference\
    \ the same element, but $array['03'] references a different element. Negative\
    \ numbers are valid keys, but they do not specify positions from the end of the\
    \ array as they do in Perl.\n\nConstant is a value that cannot be altered by the\
    \ program during normal execution, i.e., the value is constant.\n\nYou do not\
    \ have to quote single-word strings. For instance, $age['fred'] is the same as\
    \ $age[fred]. However, it is considered good PHP style to always use quotes, because\
    \ quoted keys are indistinguishable from constants. When you use a constant as\
    \ an unquoted index, PHP uses the value of the constant as the index and emits\
    \ a warning:\n\n```php\ndefine('index', 5); // retrieves $array[5], not $array['index']\n\
    echo $array['index'];\n```\n\nYou must use quotes if you are using interpolation\
    \ to build the array index:\n$age[\"Clone{$number}\"]\n\nAlthough sometimes optional,\
    \ you should quote the key if you are interpolating an array lookup to ensure\
    \ that you get the value you expect:\n\n```php\n// these are wrong\nprint \"Hello,\
    \ {$person['name']}\";\nprint \"Hello, {$person[\"name\"]}\";\n```\n\n# 5.2.4\
    \ Storing Data in Arrays\n\nStoring a value in an array will create the array\
    \ if it did not already exist, but trying to retrieve a value from an array that\
    \ has not been defined would not create the array. For example:\n\n```php\n//\
    \ $addresses not defined before this point // prints nothing\necho $addresses[0];\
    \ // prints nothing\necho $addresses; // prints nothing\n```\n"
