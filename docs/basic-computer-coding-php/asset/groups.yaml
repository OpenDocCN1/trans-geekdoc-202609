  mdcn: "\n\n属性（property）返回子类上的属性值，而引用方法则会在子类上调用方法。\n\n要访问被重写的方法，请使用 `parent::method()`\
    \ 符号：\n\n```\nparent::birthday(); // 调用父类的\nbirthday( ) 方法\n```\n\n一个常见的错误是在调用被重写的方法时，硬编码了父类的名称：\n\
    \n```\nCreature::birthday( ); 当 当 Creature\n是父类时\n```\n\n这是一个错误，因为它将父类名称的知识分散到了整个派生类中。使用\
    \ `parent::` 可以将父类的相关知识集中在 `extends` 子句中。\n\n从句（Clause）由一个主语和一个谓语组成，是表达一个完整思想的最小语法单位。\n\
    \n## 6.3.4 构造函数\n\n在实例化对象时，你可以在类名后提供一个参数列表：\n\n`$person = new Person('Fred', 35)`\n\
    \n这些参数被传递给类的构造函数，构造函数是一个初始化类属性的特殊函数。\n\n构造函数是一个与其定义的类名同相同的函数。以下是 Person 类的构造函数：\n\
    \n```php\nclass Person {\n    function Person ($name, $age) {\n        $this->name\
    \ = $name;\n        $this->age = $age;\n    }\n}\n```\n\n## 基础计算机编程：PHP\n\nPHP\
    \ 不提供自动的构造函数链；也就是说，如果你实例化派生类的对象，只有派生类中的构造函数会被自动调用。要调用父类的构造函数，派生类中的构造函数必须显式地调用。在这个示例中，Employee\
    \ 类的构造函数调用了 Person\n\n```php\nclass Person {\n    var $name, $address, $age;\n\
    ```\n\n## 记住\n\n不要忘记，在类中，变量被称为“属性”（properties），函数被称为“方法”（methods）。\n\n```php\n\
    function Person($name, $address, $age) {\n    $this->name = $name;\n    $this->address\
    \ = $address;\n    $this->age = $age;\n}\n```\n\n```php\nvar $position, $salary;\n\
    \nfunction Employee($name, $address, $age, $position, $salary) {\n    $this->Person($name,\
    \ $address, $age);\n    $this->position = $position;\n    $this->salary = $salary;\n\
    }\n```\n\n## 6.3.5 引用\n\n当你将一个对象赋值另一个变量时，你创建了一个副本：\n`$fred = new Person;`\n`$copy\
    \ = $fred;`\n`$fred->name(\"Fred\");`\n\n`print $copy->name(); // 不打印 \"Fred\"\
    `\n\n你现在有两个 Person 对象，$fred 和 $copy，它们具有独立的属性值。当你将构造函数的调用结果赋值时情况也是如此，如下所示：\n\n\
    `$fred = new Person;`\n\n由 Person 构造函数创建的对象被复制了，副本存储在 $fred 中。这意味着构造函数中的 `$this`\
    \ 和 $fred 实际上引用的是两个不同的对象。如果构造函数通过引用创建了 $this 的别名，它将不会为 $fred 创建别名。例如：\n\n```php\n\
    $people = array();\nclass Person {\n    function Person () {\n        global $people;\n\
    \        $people[] = &$this;\n    }\n}\n$fred = new Person;\n$fred->name = \"\
    Fred\";\n$barney = &new Person;\n$barney->name = \"Barney\";\nvar_dump($people);\n\
    array(2) {\n    [0]=>object(person)(0) {\n}\n    [1]=>\n```\n\n## 基础计算机编程：PHP\n\
    \n```php\n&object(person)(1) {\n  [\"name\"]=>\n    string(6) \"Barney\"\n}\n\
    ```\n\n$fred 是构造函数存储在 $people[0] 中对象的副本，而 $barney 是构造函数存储在 $people[1] 中对象的别名。当我们更改\
    \ $fred 的属性时，我们并没有更改 $people[0] 中的对象。然而，当我们更改 $barney 的属性时，我们正在更改 $people[1] 中的对象。要防止赋值时产生复制，请通过引用赋值：`$obj=$&\
    \ new Class;`\n\n这行代码使 $obj 成为新对象的别名，而该对象在构造函数中是 $this。如果构造函数存储了对 $this 的引用，它就会保留对\
    \ $obj 的引用。\n\n类的文档应该说明你是否需要对其构造函数使用 `&=`。在大多数情况下，这是必要的。\n\n## 案例研究\n\n## Cube\
    \ Evolution\n\nCube Evolution 是一家总部位于英国的软件公司，生产定制软件和网页设计。其产品之一是一个 Web 内容管理系统（CMS），允许个人和公司轻松地维护自己的网站。\n\
    \n然而，按照最初的设计，CMS 软件并不安全。任何购买系统的客户都可以轻松看到源代码并获取任何编程语言，导致公司面临软件被盗的风险。客户还可以对代码进行修改，可能导致产品故障。这可能导致公司的支持部门被修改程序的用户的电话淹没。\n\
    \nSourceGuardian 为 Cube Evolution 提供了一个解决方案，保护其 CMS 软件免受盗窃和篡改，同时。\n\n## 基础计算机编程：PHP\n\
