  mdcn: "\n\n# 第 7 章\n\n# 网络技术\n\n> “技术本身并无所谓。重要的是你对人有信任，相信他们本质上是善良且聪明的，如果你给他们工具，他们会用它们创造惊不起的事情。”\n\
    \n——史夫·乔布斯\n\n# 学习目标\n\n学习本章后，你将能够：\n\n- *理解 HTTP 基础知识*\n- *解释状态的维持*\n\n# 计算机基础编程：PHP\n\
    \n# 绪言\n\nPHP 被设计为一种 Web 脚本语言，虽然可以在纯命令行和 GUI 脚本中使用它，但 Web 占据了 PHP 用法的绝大部分。网络技术是一个通用术语，指的是许多语言和多媒体包，它们与其他结合使用以产生像本网站这样的动态网站。每种单独的技术本身都相当局限，并且往往需要同时使用至少一种其他技术。因此，我们可以得出结论：构成网站的所有组件之间都是相互依赖的。\n\
    \n# 7.1 HTTP 基础知识\n\nHTTP（超文本传输协议）是用于在万网网上传输文件（文本、图形图像、声音、视频和其他多媒体文件）的一系列规则。当\
    \ Web 用户打开浏览器时，用户就在间接地使用 HTTP。HTTP 是一种运行在 TCP/IP 协议族（互联网的基础协议）之上的应用协议。\n\n![](img/f8aa82c4ef45031ca4eadc2bb946c87a_195_0.png)\n\
    \n你知道不知道，“超文本”一词是由泰德·内尔森在1965 年的 Xanadu 项目中提出的，该项目反过来灵感源于范内瓦·布什在20 世纪30 年代对基于微胶片的信息检索与管理“memex”系统的设想，这出现在他1945年的的文章《当我们思考》。\n\
    \nHTTP 概念包括（名称中的超文本部分）：文件可以包含其他文件的引用，选择这些文件将触发额外的传输请求。任何 Web 服务器除了它可以提供的 Web 页面文件外，还包含一个\
    \ HTTP 守护进程，该程序旨在等待 HTTP 请求并在请求到达时处理它们。你的 Web 浏览器是一个 HTTP 客户端，向服务器机器发送请求。当浏览器用户通过“打开”\
    \ Web 文件（输入统一资源定位符或 URL）或点击超链接输入文件请求时，浏览器会构建一个 HTTP 请求并发送到 URL 指定的网协议地址（IP 地址）。目标服务器机器中的\
    \ HTTP 守护进程接收请求并返回与请求相关的单个或多个文件。\n\n## 7.1.1 文件上传\n\n使用 PHP 可以很容易将文件上传到服务器。\n\
    然而，简单往往伴随着危险，因此在允许文件上传时务必小心！\n\n## 配置 \"php.ini\" 文件\n\n首先，确保 PHP 已配置为允许文件上传。\n\
    在你的 \"php.ini\" 文件中，搜索 `file_uploads` 指令，并设置为 `On`：\n\n```\nfile_uploads = On\n\
    ```\n\n## 创建 HTML 表单\n\n接下来，创建一个 HTML 表单，允许用户选择他们想要上传的图像文件：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<form action=\"upload.php\" method=\"post\" enctype=\"\
    multipart/form-data\">\n  Select image to upload:\n  <input type=\"file\" name=\"\
    fileToUpload\" id=\"fileToUpload\">\n  <input type=\"submit\" value=\"Upload Image\"\
    \ name=\"submit\">\n</form>\n</body>\n</html>\n```\n\n# 计算机基础编程：PHP\n\n上述 HTML\
    \ 表单需要遵循的一些规则：\n- 确保表单使用了 `method=\"post\"`\n- 表单还需要以下属性：`enctype=\"multipart/form-data\"\
    `。它指定了提交表单时使用的内容类型\n\n如果没有上述要求，文件上传将无法工作。\n其他需要注意的事项：\n- `<input>` 标签的 `type=\"\
    file\"` 属性将输入框显示为文件选择控件，输入控件旁边有一个“浏览”按钮。\n\n上面的表单将数据发送到名为 \"upload.php\" 的文件，该文件将被创建。\n\
    \n# 创建上传文件的 PHP 脚本\n\n```\n\"upload.php\" 文件包含上传文件的代码：\n<?php\n$target_dir = \"\
    uploads/\";\n$target_file = $target_dir . basename($_FILES[\"fileToUpload\"][\"\
    name\"]);\n$uploadOk = 1;\n$imageFileType = strtolower(pathinfo($target_file,PATHINFO_EXTENSION));\n\
    // 检查图像文件是真实的图像还是伪图像\nif(isset($_POST[\"submit\"])) {\n    $check = getimagesize($_FILES[\"\
    fileToUpload\"][\"tmp_name\"]);\n    if($check !== false) {\n        echo \"File\
    \ is an image - \" . $check[\"mime\"] . \".\";\n        $uploadOk = 1;\n    }\
    \ else {\n        echo \"File is not an image.\";\n        $uploadOk = 0;\n  \
    \  }\n}\n```\n\nPHP 脚本解释：\n\n- `$target_dir = \"uploads/\"` - 指定文件将放置的目录\n- `$targetFile`\
    \ 指定要上传的文件的路径\n- `$uploadOk=1` 尚未未使用（稍后将使用）\n- `$imageFileType` 存储文件的扩展名（小写）\n\
    - 接下来，检查图像文件是真实的图像还是伪图像\n\n# 计算机基础编程：PHP\n\n# 检查文件是否存在\n\n我们现在可以添加一些限制。\n首先，我们检查文件是否已存在于“uploads”文件夹中。如果存在，则显示错误信息，并设置\
    \ `$uploadOk` 为 0。\n\n```\n// 检查文件是否存在\nif (file_exists($target_file)) {\n   \
    \ echo \"Sorry, file already exists.\";\n    $uploadOk = 0;\n}\n```\n\n# 大小\n\n\
    我们要检查文件的大小。如果超过 5MB，则显示错误信息，并设置 `$uploadOk` 为 0。\n\n```php\n// 大小\nif ($_FILES[\"\
    fileToUpload\"][\"size\"] > 5000000) {\n    echo \"Sorry, your file is too large.\"\
    ;\n    $uploadOk = 0;\n}\n```\n\n# 类型\n\n我们需要检查文件格式。如果不是 JPG、PNG、JPEG 或 GIF，则显示错误信息，并设置\
    \ `$uploadOk` 为 0。\n\n```php\n// 限制\nif($imageFileType != \"jpg\" && $imageFileType\
    \ != \"png\" && $imageFileType != \"jpeg\" && $imageFileType != \"gif\") {\n \
    \   echo \"Sorry, only JPG, PNG & GIF files allowed.\";\n    $uploadOk = 0;\n\
    }\n```\n\n# 完整的上传脚本\n\n\"upload.php\" 文件现在所示：\n\n```php\n<?php\n$target_dir =\
    \ \"uploads/\";\n$target_file = $target_dir . basename($_FILES[\"fileToUpload\"\
    ][\"name\"]);\n$uploadOk = 1;\n$imageFileType = strtolower(pathinfo($target_file,PATHINFO_EXTENSION));\n\
    // 检查图像文件是真实的图像还是伪图像\nif(isset($_POST[\"submit\"])) {\n    $check = getimagesize($_FILES[\"\
    fileToUpload\"][\"tmp_name\"]);\n    if($check !== false) {\n        echo \"File\
    \ is an image - \" . $check[\"mime\"] . \".\";\n        $uploadOk = 1;\n    }\
    \ else {\n        echo \"File is not an image.\";\n        $uploadOk = 0;\n  \
    \  }\n}\n\n// 检查文件是否存在\nif (file_exists($target_file)) {\n    echo \"Sorry, file\
    \ already exists.\";\n    $uploadOk = 0;\n}\n\n// 大小限制\nif ($_FILES[\"fileToUpload\"\
    ][\"size\"] > 5000000) {\n    echo \"Sorry, your file is too large.\";\n    $uploadOk\
    \ = 0;\n}\n\n// 格式限制\nif($imageFileType != \"jpg\" && $imageFileType != \"png\"\
    \ && $imageFileType != \"jpeg\" && $imageFileType != \"gif\") {\n    echo \"Sorry,\
    \ only JPG, PNG & GIF files allowed.\";\n    $uploadOk = 0;\n}\n\n// 如果 $uploadOk\
    \ 被错误置为 0\nif ($uploadOk == 0) {\n    echo \"Sorry, your file was not uploaded.\"\
    ;\n}\nelse // 如果一切正常，尝试上传文件\n    if (move_uploaded_file($_FILES[\"fileToUpload\"\
    ][\"tmp_name\"], $target_file)) {\n        echo \"The file \" . basename($_FILES[\"\
    fileToUpload\"][\"name\"]).\" has been uploaded.\";\n    } else {\n        echo\
    \ \"Sorry, there was an error uploading your file.\";\n    }\n}\n?>\n```\n\n#\
    \ 计算机基础编程：PHP\n\n# 7.1.2 表单验证\n\nJavaScript 是一种高级解释型编程语言，之前介绍过使用 JavaScript 和\
    \ jQuery 进行表单验证，但这次我们将向你展示如何使用 PHP 验证表单。\n\n首先，必须在 HTML 中创建一个表单，设置 action 为 \"\
    #\"，method 为 \"POST\" 以及一些字段，当用户点击提交按钮时，所有数据开始在 URL 中传输，但它们是隐藏的，因为我们设置了 method=\"\
    POST\"。\n\n现在，当页面刷新时，PHP 代码运行，从 URL 获取所有值并存入 PHP 变量，并对它们应用 `preg_match( )` 函数。\n\
    \n# validation.php 中的 PHP 代码段\n\n```php\n<?php\n// 初始化变量为空。\n$nameError = \"\"\
    \n$emailError = \"\"\n$genderError = \"\"\n$websiteError = \"\"\n// 提交表单后，下面的函数将\n\
    执行.\n```\n\n"
