    # Basic Computer Coding: PHP


    There are no artificial limits on string length - within the bounds of available
    memory, you ought to be able to make arbitrarily long strings.


    Strings that are delimited by double quotes (as in “this") are preprocessed in
    the following two ways by PHP –


    +   - Certain character sequences beginning with backslash (\) are replaced with
    special characters

    - Variable names (starting with \$) are replaced with string representations of
    their values.


    The escape-sequence replacements are =

    - \n is replaced by the newline character

    - \r is replaced by the carriage-return character

    - \t is replaced by the tab character

    - \$ is replaced by the dollar sign itself ($)

    - " is replaced by a single double-quote (")

    - \\ is replaced by a single backslash (\)


    +   A string literal can be specified in four different ways:

    - Single quoted

    - Double quoted

    - Heredoc syntax

    - Nowdoc syntax (since PHP 5.3.0)


    # 4.1.1 Single Quoted


    The simplest way to specify a string is to enclose it in single quotes (the character
    ''). To specify it with a backslash (\). To specify a literal backslash, double
    it (\\). All other instances of backslash will be treated as a literal backslash:
    this means that the other escape sequences you might be used, such as \ or \n,
    will be output literally as specified rather than having any special meaning.


    Unlike the double-quoted and heredoc syntaxes, variables and escape sequences
    for special characters will not be expanded when they occur in single strings.


