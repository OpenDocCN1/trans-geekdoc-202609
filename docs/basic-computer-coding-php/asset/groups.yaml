    # Basic Computer Coding: PHP


    # INTRODUCTION


    PHP was designed as a web-scripting language and, although it is possible to use
    it in purely command-line and GUI scripts, the Web accounts for the vast majority
    of PHP uses. Web technologies is a general term referring to the many languages
    and multimedia packages that are used in conjunction with one other, to produce
    dynamic web sites such as this one. Each separate technology is fairly limited
    on its own, and tends to require the dual use of at least one other technology.
    Therefore, we can conclude that all of the components that make up a site are
    interdependent on one another.


    # 7.1 HTTP Basics


    HTTP (Hypertext Transfer Protocol) is the set of rules for transferring files
    (text, graphic images, sound, video, and other multimedia files) on the World
    Wide Web. As soon as a Web user opens their Web browser, the user is indirectly
    making use of HTTP. HTTP is an application protocol that runs on top of the TCP/IP
    suite of protocols (the foundation protocols for the Internet).


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_195_0.png)


    DID YOU KNOW The term hypertext was coined by Ted Nelson in 1965 in the Xanadu
    Project, which was turn inspired by Vannevar Bush''s 1930s vision of the microfilm-based
    information retrieval and management “memex” system described in his 1945 essay
    “As We Think”.


    HTTP concepts include (as the Hypertext part of names) the idea that files can
    contain references to other files whose selection will elicit additional transfer
    requests. Any Web server machine contains, in addition to the Web page files it
    can serve, an HTTP daemon, a program that is designed to wait for HTTP requests
    and handle them when they arrive. Your Web browser is an HTTP client, sending
    requests to server machines. When the browser'
  - "[PAGE 196]\n\nuser enters file requests by either \"opening\" a Web file (typing\
    \ in a Uniform Resource Locator or URL) or clicking on a hyperlink, the browser\
    \ builds an HTTP request and sends it to the Internet Protocol address (IP address)\
    \ indicated by the URL. The HTTP daemon in the destination server machine receives\
    \ the request and sends back the requested file or files associated with the request.\n\
    \n# ## 7.1.1 File Upload\n\nWith PHP, it is easy to upload files to the server.\n\
    However, ease comes danger, so always be careful when allowing file uploads!\n\
    \n# ## Configure The \"php.ini\" File\n\nFirst, ensure that PHP is configured\
    \ to allow file uploads.\nIn your \"php.ini\" file, search for the file_uploads\
    \ directive, and set it to On:\n\n```\nfile_uploads = On\n```\n\n# ## Create The\
    \ HTML Form\n\nNext, create an HTML form that allow users to choose the image\
    \ file they want to upload:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"\
    upload.php\" method=\"post\" enctype=\"multipart/form-data\">\n  Select image\
    \ to upload:\n  <input type=\"file\" name=\"fileToUpload\" id=\"fileToUpload\"\
    >\n  <input type=\"submit\" value=\"Upload Image\" name=\"submit\">\n</form>\n\
    </body>\n</html>\n```"
  - "[PAGE 197]\n\n# Basic Computer Coding: PHP\n\nSome rules to follow for the HTML\
    \ form above:\nMake sure that the form uses method=\"post\"\nThe form also needs\
    \ the following attribute: enctype=\"multipart/form-data\". It specifies content-type\
    \ to use when submitting the form\n\nWithout the requirements above, the file\
    \ upload will not work.\nOther things to notice:\nThe type=\"file\" attribute\
    \ of the <input> tag shows the input field as a file-select control, with a \"\
