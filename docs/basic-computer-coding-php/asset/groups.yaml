  - '[PAGE 161]


    # Basic Computer Coding: PHP


    The array_slice() function returns a new array consisting of a consecutive series
    of values from the original array. The offset parameter identifies the initial
    element to copy (0 represents the first element in the array), and the length
    parameter identifies the number of values to copy. The new array has consecutive
    numeric keys starting at 0. For example:


    ```

    $people = array("Tom", "Dick", "Harriet", "Brenda", "Jo");

    $middle = array_slice($people, 2, 2); // $subset is array("Harriet", "Brenda")

    ```


    It is generally only meaningful to use array_slice() on indexed arrays (i.e.,
    those with consecutive integer indices starting at 0):


    ```

    // this use of array_slice() makes no sense

    $person = array("name" => "Fred", "age" => 35, "wife" => "Betty");

    $subset = array_slice($person, 1, 2); // $subset is array(0 => 35, 1 => "Betty")

    ```


    Combine array_slice() with list() to extract only values to variables:


    ```

    $order = array("Tom", "Dick", "Harriet", "Brenda", "Jo");

    list($second, $third) = array_slice($order, 1, 2);

    // $second is "Dick", $third is "Harriet"

    ```


    # Splitting an Array into Chunks


    To divide an array into smaller, evenly sized arrays, use the array_chunk() function:


    Boolean value is one with two choices: true or false, yes or no, 1 or 0:


    $chunks = array_chunk(array, size [, preserve_keys]);

    The function returns an array of the smaller arrays. The third argument, serve_keys,
    is a Boolean value that determines whether the elements of the new arrays have
    the same keys as in the original (useful for associative arrays) or new numeric
    keys starting from 0 (useful for indexed arrays). The default is to assign new
    keys, as shown here:'
  - "[PAGE 162]\n\n```\n$nums = range(1, 7);\n$rows = array_chunk($nums, 3);\nprint_r($rows);\n\
    \nArray (\n    [0] => Array (\n        [0] => 1\n        [1] => 2\n        [2]\
    \ => 3\n    )\n    [1] => Array (\n        [0] => 4\n        [1] => 5\n      \
    \  [2] => 6\n    )\n    [2] => Array (\n        [0] => 7\n    )\n)\n```\n\n# Keys\
    \ and array_keys() function\n\nThe array_keys() function returns an array consisting\
    \ of only the keys in the array in internal order:\n\n$arrayOfKeys = array_keys(array);\n\
    \nHere's an example:\n\n$person = array('name' => 'Fred', 'age' => 35, 'wife'\
    \ => 'Wilma');\n$keys = array_keys($person); // $keys is array(\"name\", \"age\"\
    , \"wife\")\n\nPHP also provides a (generally less useful) function to retrieve\
    \ an array of just the values in an array, array_values():\n\n$arrayOfValues =\
    \ array_values(array);\n\nWith array_keys(), the values are returned in the array's\
    \ internal order:\n\n$values = array_values($person); // $values is array(\"Fred\"\
    , 35, \"Wilma\")\n\n# Checking Whether an Element Exists\n\nTo see if an element\
    \ exists in the array, use the array_key_exists() function:\n\n```\nif (array_key_exists(key,\
    \ array)) { ... }\n```"
  - "[PAGE 163]\n\n# Basic Computer Coding: PHP\n\nThe function returns a Boolean\
    \ value that indicates whether the first argument is a valid key in the array\
    \ given as the second argument.\nIt is not sufficient to simply say:\n\n```\n\
    if ($person['name']) { ... }\n// this can be misleading\n```\n\nEven if there\
    \ is an element in the array with the key name, its corresponding value might\
