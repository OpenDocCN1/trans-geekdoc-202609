  mdcn: "\n\n## 基础计算机编程：PHP\n\n`array_slice()` 函数返回一个新数组，该数组由原数组中连续的值组成。`offset`（偏移）参数指定要复制的起始元素（0\
    \ 表示数组中的第一个元素），`length`（长度）参数指定要复制的值的数量。新数组具有从 0 开始的连续数字键。例如：\n\n```php\n$people\
    \ = array(\"Tom\", \"Dick\", \"Harriet\", \"Brenda\", \"Jo\");\n$middle = array_slice($people,\
    \ 2, 2); // $subset 为 array(\"Harriet\", \"Brenda\")\n```\n\n通常情况下，只在索引数组（即从 0\
    \ 开始具有连续整数索引的数组）上使用 `array_slice()` 才有意义：\n\n```php\n// 这种 array_slice() 的用法没有意义\n\
    $person = array(\"name\" => \"Fred\", \"age\" => 35, \"wife\" => \"Betty\");\n\
    $subset = array_slice($person, 1, 2); // $subset 为 array(0 => 35, 1 => \"Betty\"\
    )\n```\n\n将 `array_slice()` 与 `list()` 结合使用可以仅提取值到变量中：\n\n```php\n$order = array(\"\
    Tom\", \"Dick\", \"Harriet\", \"Brenda\", \"Jo\");\nlist($second, $third) = array_slice($order,\
    \ 1, 2);\n// $second 为 \"Dick\", $third 为 \"Harriet\"\n```\n\n## 将数组拆分为块\n\n要将数组拆分为更小的、大小均匀的数组，请使用\
    \ `array_chunk()` 函数：\n\n布尔值具有两种选择：true 或 false、yes 或 no、1 或 0：\n\n```php\n$chunks\
    \ = array_chunk(array, size [, preserve_keys]);\n```\n\n该函数返回一个包含多个较小数组的数组。第三个参数\
    \ `preserve_keys`（保留键）是一个布尔值，决定新数组的元素是具有与原数组相同的键（对关联数组有用），还是具有从 0 开始的新数字键（对索引数组有用）。默认值是分配新键，如下所示：\n\
    \n```php\n$nums = range(1, 7);\n$rows = array_chunk($nums, 3);\nprint_r($rows);\n\
    \nArray (\n    [0] => Array (\n        [0] => 1\n        [1] => 2\n        [2]\
    \ => 3\n    )\n    [1] => Array (\n        [0] => 4\n        [1] => 5\n      \
    \  [2] => 6\n    )\n    [2] => Array (\n        [0] => 7\n    )\n)\n```\n\n##\
    \ 键与 array_keys() 函数\n\n`array_keys()` 函数返回一个由数组内部内部顺序的键组成的数组：\n\n```php\n$arrayOfKeys\
    \ = array_keys(array);\n```\n\n这是一个示例：\n\n```php\n$person = array('name' => 'Fred',\
    \ 'age' => 35, 'wife' => 'Wilma');\n$keys = array_keys($person); // $keys 为 array(\"\
    name\", \"age\", \"wife\")\n```\n\nPHP 还提供了一个（通常用较小的）函数来获取数组中仅值的数组，`array_values()`：\n\
    \n```php\n$arrayOfValues = array_values(array);\n```\n\n使用 `array_keys()` 时，值按数组的内部顺序返回：\n\
    \n```php\n$values = array_values($person); // $values 为 array(\"Fred\", 35, \"\
    Wilma\")\n```\n\n## 检查元素是否存在\n\n要检查数组中是否存在某个元素，请使用 `array_key_exists()` 函数：\n\n\
    ```php\nif (array_key_exists(key, array)) { ... }\n```\n\n该函数返回一个布尔值，指示第一个参数是否为第二个参数所给数组中的有效键。\n\
    简单说以下内容是不够的：\n\n```php\nif ($person['name']) { ... }\n// 这可能会产生误导\n```\n\n即使数组中有一个键名为\
    \ name 的元素，其对应的值也可能是假的（例如 0、NULL 或空字符串）。相反，请按如下所示使用 `array_key_exists()`：\n\n\
    值是某个可被程序操作的实体的表示。\n\n```php\n$person['age'] = 0; // 未出生\n\nif ($person['age'])\
    \ {\n    echo \"true!\\n\";\n}\n\nif (array_key_exists('age', $person)) {\n  \
    \  echo \"exists!\\n\";\n}\n```\n\n许多人使用 `isset()` 函数来代之，如果元素存在且不为 NULL，则返回 true：\n\
    \n```php\n$sa = array(0, NULL, '');\nfunction tf($v) {\n    return $v ? 'T' :\
    \ 'F';\n}\n\nfor ($i=0; $i < 3; $i++) {\n    printf(\"%d: %s %s\\n\", $i, isset($sa[$i]),\
    \ tf(array_key_exists($i, $sa)));\n}\n\n输出:\n0: T T\n1: F T\n2: T T\n```\n\n##\
    \ 在数组中删除和插入元素\n\n`array_slice()` 函数可以删除或插入数组中的元素，并可选从删除的元素创建另一个数组：\n\n```php\n\
    $removed = array_slice($array, start [, length [, replacement ]));\n```\n\n我们将使用这个数组来观察\
    \ `array_slice()`：\n\n```php\n$subjects = array(\"physics\", \"chem\", \"math\"\
    , \"bio\", \"cs\", \"drama\", \"classics\");\n```\n\n我们可以通过 `array_slice()` 移除\
    \ \"math\", \"bio\", \"cs\"：\n\n```php\n$removed = array_slice($subjects, 2, 3);\n\
    // $removed 为 array(\"bio\", \"cs\", \"drama\")\n```\n\n如果我们省略长度参数，`array_slice()`\
    \ 将从起始位置到结束的所有元素：\n\n```php\n$removed = array_slice($subjects, 2);\n// $removed\
    \ 为 array(\"math\", \"cs\", \"drama\", \"classics\")\n```\n\n如果我们使用替换参数，可以替换被移除的元素：\n\
    \n```php\n$removed = array_slice($subjects, 2, 2, array(\"history\", \"art\"));\n\
    // $removed 为 array(\"history\", \"art\", \"cs\", \"drama\", \"classics\")\n```\n\
    \n## 计算机编程：PHP（继续）\n\n根据提供的片段，重构结尾的逻辑：\n\n```php\n$capitals = array(\n    'USA'\
    \ => \"Washington\",\n    'Great Britain' => 'London',\n    'New Zealand' => 'Wellington',\n\
    \    'Australia' => 'Canberra',\n    'Italy' => \"Rome\",\n    'Canada' => \"\
    Ottawa\"\n);\n\n$removed = array_slice($capitals, 2, 2);\n// $removed 为 array('Wellington',\
    \ 'Canberra')\n```\n\n## 总结\n\n- Array函数允许你对数组进行操作。数组对于存储、管理和操作变量至关重要。\n- 数组是存储一个或多个类型值的结构。\n\
    - 索引数组可以存储数字、字符串和任何对象，但它们的索引由数字表示。默认索引从0开始。\n- PHP数组的元素的内部顺序与键和值无关，你可以根据此顺序遍历数组。\n\
    - 关联数组与数组非常相似，不同在于索引。关联数组将具有字符串以便在键和值之间建立强关联。\n- 在数组中存储值会在不存在时创建数组，但从未定义的数组中检索值则不会创建数组。\n\
    - 多维数组主数组中的每个元素可以是数组。子数组中的每个元素可以是数组，以此此类推。多维数组的值通过多个索引进行访问。\n\n---\n\n- 下哪种类型的变量是命名的索引集合？\n\
    \  - 字符串\n  - 数组\n  - 对象\n  - 资源\n- 下哪种数组表示包含一个或多个数组？\n  - 索引数组\n  - 关联数组\n  -\
    \ 多维数组\n  - 以上均不是\n- 下哪种类型的变量是字符序列，如“PHP支持字符串操作”？\n  - 字符串\n  - 数组\n  - 对象\n \
    \ - 资源\n- 下哪种函数返回数组中值的和？\n  - array_sum()\n  - array_splice()\n  - array_udiff()\n\
    \  - array_udiff_assoc()\n- 关于确定任何非布尔值的“真假”，下列哪项是正确的？\n  - 如果值是数组，如果它不包含其他值，则为假的，否则为真的。对于对象，包含值意味着拥有被赋值了值的成员变量。\n\
    \n"
