    $arrayOfValues = array_values(array);\n```\n\nWith array_keys(), the values are\
    \ returned in the array's internal order:\n\n```php\n$values = array_values($person);\
    \ // $values is array(\"Fred\", 35, \"Wilma\")\n```\n\n## Checking Whether an\
    \ Element Exists\n\nTo see if an element exists in the array, use the array_key_exists()\
    \ function:\n\n```php\nif (array_key_exists(key, array)) { ... }\n```\n\nThe function\
    \ returns a Boolean value that indicates whether the first argument is a valid\
