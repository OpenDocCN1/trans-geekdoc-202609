    \ a function scope.\n\nscope1.php\n\n```php\n<?php\n$value = 1;\n\nfunction simple()\
    \ {\n    var_dump($value);\n}\n\nsimple();\n?>\n```\n\nA variable defined outside\
    \ a function body cannot be referenced within a function.\n\n```bash\n$ php scope1.php\n\
    PHP Notice: Undefined variable: value in /home/janbodnar/prog/php/functions/scope1.php\
    \ on line 7\nNULL\n```\n\nThe $value variable is NULL in the simple() function.\n\
    \nscope2.php\n\n```php\n<?php\n$value = 4;\n\nfunction simple() {\n    $value\
    \ = 3;\n    echo $value, \"\\n\";\n}\n\nsimple();\necho $value, \"\\n\";\n\n?>\n\
    ```\n\nIn this example, we have two variables with the same name. They do not\
    \ collide because they exist in different scopes.\n\n```bash\n$ php scope2.php\n\
    3\n4\n```\n\nThe value is 3 inside the function and 4 outside the function. In\
    \ the next example, we will modify a value inside the function.\n\n```php\nscope3.php\n\
    <?php\n$value = 1;\n\nfunction simple() {\n    global $value;\n    $value = 2;\n\
    }\n\necho $value, \"\\n\";\nsimple();\necho $value, \"\\n\";\n\n?>\n```\n\nWe\
    \ use the global keyword to reference a variable defined outside the body of the\
    \ function.\n\n```bash\n$ php scope3.php\n1\n2\n```\n\nThe $value was successfully\
    \ modified inside the simple () function.\nIn this part of the PHP tutorial, we\
    \ covered PHP functions.\n"
  mdcn: "\n\n# non_static.php\n\n静态变量（Static Variable）是被“静态”分配的变量，这意味着它的生命周期（或“范围”）是整个程序运行期间。\n\
    \n```php\n<?php\n\nfunction nonstatic() {\n\n  $value = 0;\n  $value += 1;\n\n\
    \  return $value;\n}\n\nnonstatic();\nnonstatic();\nnonstatic();\nnonstatic();\n\
    \necho nonstatic(), \"\\n\";\n\n?>\n```\n\n在上面的示例中，我们有一个普通的非静态变量。每次调用函数时，我们都会增加该变量的值。我们调用了\
    \ 5 次函数。然而，非静态变量在每次调用函数时都会初始化。在调用 5 次函数后，$value 的值等于 2。\n静态变量只在函数第一次被调用时初始化一次。此后它们会保留自己的值。\n\
    \n# static.php\n\n```php\n<?php\n\nfunction staticfun() {\nstatic $value = 0;\n\
    $value += 1;\nreturn $value;\n}\n\nstaticfun();\nstaticfun();\nstaticfun();\n\
    staticfun();\n\necho staticfun(), \"\\n\";\n\n?>\n```\n\n在连续调用 5 次后，$value 的值等于\
    \ 5。\n\n```\n$ php nonstatic.php\n2\n$ php static.php\n6\n```\n\n# 3.1.7 PHP 匿名函数\n\
    \n匿名函数没有名字。\nanonymous.php\n\n```php\n<?php\n$var = function() {\necho \"This\
    \ is anonymous function\\n\";\n};\n\n$var();\n```\n\n## PHP 函数\n\n我们将一个函数体赋值给一个变量。只能通过这个变量来调用函数。\n\
    \n```php\n$var = function () {\necho \"This is anonymous function\\n\";\n};\n\
    ```\n\n注意闭合括号后面的分号。这是必须的，因为该结构是一个赋值语句。\n\n```bash\n$ php anonymous.php\n\nThis\
    \ is anonymous function\n```\n\n这是示例的输出结果。\n\n# 记忆\n\n函数名必须以字母或下划线开头，不能以数字开头，后面可以跟跟更多的字母、数字或下划线。函数名不区分大小写。\n\
    \n# 3.1.8 值传递和引用传递\n\nPHP 支持两种向函数传递参数的方式。默认方式是按值传递。当我们按值传递参数时，函数仅与值的副本进行操作。在处理大量数据时，这可能会导致性能开销。\n\
    \n当我们按引用传递值时，函数接收的是实际值的引用。修改时，原始值会受到影响。这种传递值的方式在时间和空间上效率更高。另一方面，它更容易出错。\n\n我们应该使用哪种参数传递？这取决于情况。假设我们有一组数据，员工的工资。如果我们想计算某些数据的统计信息，不需要修改它们，那么就按值传递。如果我们处理大量数据且计算速度至关重要，就按引用传递。如果我们想修改数据，例如对工资进行某些削减或增加，我们可能会使用引用传递。\n\
    以下两个示例涵盖了这两个概念。\n\n![](img/f8aa82c4ef45031ca4eadc2bb946c87a_89_0.png)\n\n1993年，伊利诺伊大学厄巴纳夏槟分校的国家超级计算机应用中心（NCSA）发布了\
    \ NCSA Mosaic，这是第一个流行的图形化 浏览器，它在推动新生世界 Web 的增长方面发挥了重要作用。\n\n```php\nswap1.php\n\
    <?php\nfunction swap($a, $b) {\n    $temp = $a;\n    $a = $b;\n    $b = $temp;\n\
    \    echo \"inside swap function:\\n\";\n    echo \"\\$a is $a \\n\";\n    echo\
    \ \"\\$b is $b \\n\";\n\n    $a = 4;\n    $b = 7;\n\n    echo \"outside swap function:\\\
    n\";\n    echo \"\\$a is $a \\n\";\n    echo \"\\$b is $b \\n\";\n\n    swap($a,\
    \ $b);\n\n    echo \"outside swap function:\\n\";\n    echo \"\\$a is $a \\n\"\
    ;\n    echo \"\\$b is $b \\n\";\n}\n?>\n```\n\n## PHP 函数\n\nswap 函数交换 $a 和 $b\
    \ 之间的数字。变量是一个存储位置内存地址，配对有一个关联的符号名称（标识符），它包含一个被称为“值”的已知或未知数量。在开始时，这两个变量被初始化。我们调用\
    \ swap() 函数。该函数接收 $a 和 $b 作为参数。\n\n$a = 4;\n$b = 7;\n\n在 swap() 函数内部，我们更改了值。注意，$a$\
    \ 和 $b 变量是局部定义的。它们只在 swap() 函数内部有效。\n\n```bash\n$ php swap1.php\n\noutside swap\
    \ function:\n$a is 4\n$b is 7\ninside swap function:\n$a is 7\n$b is 4\noutside\
    \ swap function:\n$a is 4\n$b is 7\n```\n\n输出显示原始变量没有受到影响。接下来的代码通过引用将值传递给函数。原始变量在\
    \ swap() 函数内部发生了变化。\n\n```php\nswap2.php\n<?php\nfunction swap(&$a, &$b) {\n \
    \   $temp = $a;\n    $a = $b;\n    $b = $temp;\n    echo \"Inside swap function:\\\
    n\";\n    echo \"\\$a is $a \\n\";\n    echo \"\\$b is $b \\n\";\n\n    $a = 4;\n\
    \    $b = 7;\n\n    echo \"outside swap function:\\n\";\n    echo \"\\$a is $a\
    \ \\n\";\n    echo \"\\$b is $b \\n\";\n\n    swap(&$a, &$b);\n\n    echo \"outside\
    \ swap function:\\n\";\n    echo \"\\$a is $a \\n\";\n    echo \"\\$b is $b \\\
    n\";\n}\n?>\n```\n\n该示例与上一个几乎完全相同，除了取地址符号 &。\n\n```bash\n$ php swap2.php\n\noutside\
    \ swap function:\n$a is 4\n$b is 7\ninside swap function:\n$a is 7\n$b is 4\n\
    outside swap function:\n$a is 4\n$b is 7\n```\n\n在这里我们看到 swap() 函数确实改变了变量的值。\n\
    \n# 3.1.9 PHP 递归\n\n递归在数学和计算机科学中是一种定义函数的方法，其中被定义的函数被应用于自身的定义域内。换句话说，递归函数通过调用自己来完成工作。递归是迭代的替代方案。递归是函数式语言中的主要方法。\n\
    \n非负整数的阶乘表示为 n!，是所有小于 n 的正整数的乘积。\n\n一个典型的例子是计算阶乘。\n\n```php\nrecursion.php\n<?php\n\
    function factorial($n) {\n    if ($n==0) {\n        return 1;\n    } else {\n\
    \        return $n * factorial($n - 1);\n    }\n}\necho factorial(4), \"\\n\"\
    ;\necho factorial(10), \"\\n\";\n\n?>\n```\n\n在这个代码示例中，我们计算数字的阶乘。在 factorial 函数体内部，我们通过参数调用自身。\n\
    \n```bash\n$ recursion.php\n24\n3628800\n```\n\n这些是结果。\n\n![](img/f8aa82c4ef45031ca4eadc2bb946c87a_93.png)\n\
    \n那么定义函数的语法是什么样的？这里有一个简单的示例：\n\n```php\n<?php\nfunction addNumbers($num1, $num2)\
    \ {\n    $result = $num1 + $num2;\n    return $result;\n}\n\n# 3.1.10 PHP 全局和局部变量\n\
    \n接下来我们将讨论变量的作用域。作用域是变量可以引用的范围。当我们处理函数时，有两个基本作用域：全局作用域和局部作用域。局部作用域也被称为函数作用域。\n\
    \nscope1.php\n\n```php\n<?php\n$value = 1;\n\nfunction simple() {\n    var_dump($value);\n\
    }\n\nsimple();\n?>\n```\n\n在函数体外部定义的变量在函数内部无法被引用。\n\n```bash\n$ php scope1.php\n\
    PHP Notice: Undefined variable: value in /home/janbodnar/prog/php/functions/scope1.php\
    \ on line 7\nNULL\n```\n\n$value 变量在 simple() 函数中为 NULL。\n\nscope2.php\n\n```php\n\
    <?php\n$value = 4;\n\nfunction simple() {\n    $value = 3;\n    echo $value, \"\
    \\n\";\n}\n\nsimple();\necho $value, \"\\n\";\n\n在这个示例中，我们有两个同名的变量。它们由于存在于不同的作用域而不会冲突。\n\
    \n```bash\n$ php scope2.php\n3\n4\n```\n\n值在函数内部是 3，在函数外部是 4。在下一个示例中，我们将修改函数内部的一个值。\n\
    \nscope3.php\n\n```php\n<?php\n$value = 1;\n\nfunction simple() {\n    global\
    \ $value;\n    $value = 2;\n}\n\necho $value, \"\\n\";\nsimple();\necho $value,\
    \ \"\\n\";\n\n?>\n```\n\n我们使用 global 关键字来引用函数体外部定义的变量。\n\n```bash\n$ php scope3.php\n\
    1\n2\n```\n\n$value 在 simple() 函数内部被成功修改了。\n在 PHP 教程的这一部分，我们涵盖了 PHP 函数。\n\n"
