    */\n```\n\n这消耗了大约 1.4 秒的 CPU 时间，几乎所有都是用户时间，因为没有系统调用。\n\n系统时间是 CPU 代替程序内核执行系统调用花费的时间。以下是该示例：\n\
    \n```php\n$start = microtime(true);\n// 持续调用 microtime 大约3秒\nwhile(microtime(true)\
    \ - $start < 3) {\n\n}\n```\n\n```php\n$data = getrusage();\necho \"User time:\
