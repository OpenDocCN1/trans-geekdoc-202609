    If you simply want to delete elements from the source array and you do not care
    about retaining their values, you do not need to store the results of array_slice():


    ```

    $array_slice($subjects, 2);

    // subjects = array("physics", "chem");

    ```


    To insert elements where others were removed, use the fourth argument:


    ```

    $new = array("law", "business", "IS");

    array_slice($subjects, 4, 3, $new);

    // subjects = array("physics", "chem", "math", "bio", "law", "business", "IS");

    ```


    The size of the replacement array does not have to be the same as the number of
    elements you delete. The array grows or shrinks as needed:


    ```

    $new = array("law", "business", "IS");

    array_slice($subjects, 3, 4, $new);

