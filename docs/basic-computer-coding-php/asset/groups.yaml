    +   - Finally, they may just assume the string is using a specific encoding, usually
    UTF-8 in. This is the case of most functions in the intl extension and the PCRE
    extension (in the last case, only when the u modifier is used). Although this
    is due to their special purpose, the function utf8_decode() assumes a UTF-8 encoding
