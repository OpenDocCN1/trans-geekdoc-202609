    # 索引 219


    # 前言


    PHP 是一种运行在 Web 服务器上的通用服务器端脚本语言，旨在创建动态页面和应用程序。PHP（超文本预处理器）是一种广泛用于 Web 开发的服务器端 编程语言。然而，有许多语言用于
    Web 开发或编程。在所有这些语言中，PHP是最流行的 Web 脚本语言。因此，让我们发现为什么 PHP 被广泛用于 Web 开发。PHP 语言根源于 C
    和 C++。PHP 的语法与 C 和 C++ 语言语法最相似。因此，程序员发现它易于学习和操作。


    # 本书结构


    本书系统地分为七章。本书专为完全不了解 PHP 概念但对计算机编程有基础理解的 PHP 程序员设计。本书涵盖了从基础到高级的功能，解释了如何开发动态 Web
    应用程序，例如访客簿、聊天室和购物车。


    第 1 章涵盖了 PHP 语言的基本背景。它描述了 PHP 的性质和历史、它运行的平台以及如何配置它。本章通过向你展示 PHP 的运行结束，快速浏览几个说明常见任务的
    PHP 程序，例如处理表单数据、与数据库交互以及创建图形。


    第 2 章向你介绍了数据类型、PHP 运算符和流程控制语句。PHP 允许八种不同的数据类型。本章将讨论所有这些类型。


    第 3 章讨论了 PHP 中的函数并解释了 CPU 使用信息。函数是非常有的，因为它们有助于快速、可靠、减少错误的代码编写，并通过整理复杂的代码序列增加灵活性。书中重点关注了序列化。


    第 4 章侧重于 PHP 字符串函数和 PHP 中解析的使用。PHP 字符串是字符序列，即用于存储和处理文本。字符串是 PHP 支持的数据类型之一。字符串变量可以包含字母和数字字符。


    第 5 章讲解了创建数组、从数组中添加和删除元素以及遍历数组内容。因为数组非常常见且有用，PHP 中有许多与它们协作的内置函数。


    第 6 章旨在重点关注 PHP 对象和类。面向对象编程的基本构建块是类和对象。在我们深入面向对象编程方法之前，理解对象和类非常重要。


    第 7 章侧重于理解 HTTP 基础。目标服务器机器上的 HTTP 守护进程接收请求并返回与请求相关的一个或多个文件。因此，组成网站的所有组件都是相互依赖的。


    # 第 1 章


    # PHP 简介


    > “用于构建 Web 应用程序的主要语言——无论是 Perl、Python、PHP 还是任何其他语言——它们都是开源语言。因此，Web 的基础设施是开源的……我们所所知的
    Web 完全依赖于开源。”


    —Mitch Kapor


    ## 学习目标


    在学习本章后，你将能够：


    - 理解 PHP（超文本预处理器）

    - 学习 PHP 安装


    # 基础计算机编程：PHP


    # 简介


    PHP 是一种简单而强大的语言，旨在创建 HTML 内容。本章涵盖了 PHP 语言的基本背景。它描述了 PHP 的性质和历史、它运行的平台以及如何配置它。本章通过向你展示
    PHP 的运行结束，快速浏览几个说明常见任务的 PHP 程序，例如处理表单数据、与数据库交互以及创建图形。


    ## 1.1 PHP（超文本预处理器）


    PHP 全称“Hypertext Pre-processor”（超文本预处理器）。（这是一个递归缩写，如果你能理解那是什么的话。）PHP 是一种嵌入 HTML
    的 Web 脚本语言。这意味着 PHP 代码可以插入到 Web 页面的 HTML 中。当访问 PHP 页面时，页面所在的服务器会读取或“解析”PHP 代码。页面上
    PHP 函数的输出通常以 HTML 代码的形式返回，由浏览器读取。PHP 代码在页面加载之前会被转换为 HTML，用户无法在页面上查看 PHP 代码。这些
    PHP 页面足够安全可以访问数据库和其他安全信息。


    PHP 的许多语法借用自 C 和 Java 等语言。PHP 广泛用于 Web 开发和创建动态内容。


