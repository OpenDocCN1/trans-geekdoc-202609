    \ 语法：<<<。在此运算符之后，提供一个标识符，然后是一个换行符。字符串本身之后，再次使用相同的标识符来结束引号。\n\n结束标识符必须从行的列开始。此外，标识符必须遵循与\
    \ PHP 中任何其他标签相同的命名规则：它只能包含字母、数字和下划线，并且必须以非数字或下划线开头。\n\n非常重要的一，包含结束标识符的行不能包含分号（;）之外的任何字符。这意味着标识符不能缩进，且分号之前之后不能有任何空格或制表符。同样重要的是，必须意识到结束标识符之前的第一个字符必须是本地操作系统定义的换行符。在包括\
