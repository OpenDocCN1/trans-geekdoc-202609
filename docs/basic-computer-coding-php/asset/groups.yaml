    Most PHP values can also be converted to strings for permanent storage. This method
    is called serialization, and is performed by the `serialize()` function. If the
    PHP engine was built with WDDX support, PHP values can also be serialized as well-formed
    XML text.


    ## 4.2.5 String Conversion to Numbers


    When a string is evaluated in a numeric context, the resulting value and type
    are determined as follows.


    Numerical value is a quantitative value assigned to a letter of the alphabet.
    If the string does not contain any of the characters '','', ''e'', or ''E'' and
    the numeric value fits into integer type limits (defined by `PHP_INT_MAX`), the
    string will be evaluated as an integer. In all other cases it will be evaluated
    as a afloat.


    The value is given by the initialial portion of the string. If the string starts
    with valid numeric data, this will be the value 0 (zero). Otherwise, valid numeric
    data is an optional sign, followed by one or more digits (optionally containing
    a decimal point), followed by an optional exponent. The exponent is ''e'' or ''E''
    followed by one or more digits.


    ```php

    $foo = 1 + "10.5"; // $foo is float

    (11.5)


    $foo = 1 + "-1.3e3"; // $foo is float

    (-1299)


    $foo = 1 + "bob-1.3e3"; // $foo is integer

    (1)

    ```


    ```php

    foo = 1 + "bob3"; // $foo is integer (1)

    foo = 1 + "10 Small Pigs"; // $foo is integer (11)

    foo = 4 + "10.2 Little Piggies"; // $foo is float (14.2)

    foo = "10.0 pigs" + 1; // $foo is float (11)

    foo = "10.0 pigs" + 1.0; // $foo is float (11)

    ?>

    ```


    For more information on this conversion, see the Unix manual page for `strtod(3)`.


    To test any of the examples, cut and paste the examples and insert the following
    line to see what''s going on:


    ```php

    echo "$foo=$foo; type is " . gettype($foo) . "<br/>\n";

    ?>

    ```


    Do not expect to get the code of one character by converting it to integer, in
    C. Use the `ord()` and `chr()` functions to convert between ASCII codes and characters.


    ## 4.2.6 Details of the String Type


    The string in PHP is implemented as an array of bytes and an integer indicating
    the length of the buffer. It has no information about how those bytes translate
    to characters, leaving task to the programmer. There are no limitations on the
    values the string can be composed of; in particular, bytes with value 0 ("NULL
    bytes") are allowed anywhere in the string (however, a few functions, said in
    this manual not to be "binary safe", may hand off the strings to libraries that
    ignore data after a NUL byte).


    This nature of the string type explains why there is no separate “byte" type in
    PHP – strings take this role. Functions that return no textual data – for instance,
    arbitrary data read from a network socket – will still return strings.


    Given that PHP does not dictate a specific encoding for strings, one might wonder
    how string literals are encoded. For instance, is the string "ä" equivalent to
    "\xE1" (ISO-8859-1), "\xC3\xA1" (UTF-8, C form), "\xC6\xCC\x81" (UTF-8, D form)
    or any other possible representation? The answer is that string will be encoded
    in whatever fashion it is encoded in the script file. Thus, if the script is written
    in ISO-8859-1, the string will be encoded in ISO-8859-1 and so on. However, this
    does not apply if Zend Multibyte is enabled; in that case, the script may be written
    in an arbitrary encoding (which is explicitly declared or detected) and then converted
    to a certain internal encoding, which is then the encoding that will be used for
    the string literals. Note that there are some constraints on the encoding of the
    script (or on the internal encoding, should Zend Multibyte be enabled) – this
    always means that the encoding should be a compatible superset of ASCII, such
    as UTF-8 or ISO-8859-1. Note, however, that state-dependent encodings where the
    same byte values can be used in initial and non-initial shift states may be problematic.


    Of course, in order to be useful, functions that operate on text may have to make
    some assumptions about how the string is encoded. Unfortunately, there is much
    variation on this matter throughout PHP’s functions:


    - Some functions assume that the string is encoded in (any) single-byte encoding,
    but they do not need to interpret those bytes as specific characters. This is
    case of, for instance, `substr()`, `strpos()`, `strlen()` and `strcmp()`. Another
    way to think of these functions is that they operate on memory buffers, i.e.,
    they work with bytes and offsets.


    - Other functions are passed the encoding of the string, possibly they also assume
    a default if no such information is given. This is the case of `htmlentities()`
    and the majority of the functions in the `mbstring extension`.


    - Others use the current locale (see `setlocale()`), but operate byte-by-byte.
    This is the case of `strcasecmp()`, `strtoupper()` and `ucfirst()`. This means
    they can be used with.

