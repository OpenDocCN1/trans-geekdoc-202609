    The array_keys() function returns an array consisting of only the keys in the\
    \ array in internal order:\n\n```php\n$arrayOfKeys = array_keys(array);\n```\n\
    \nHere's an example:\n\n```php\n$person = array('name' => 'Fred', 'age' => 35,\
