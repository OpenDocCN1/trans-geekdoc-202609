    # 引言


    PHP 支持标量和复合数据类型。在本章中，我们将讨论一种复合类型：数组。数组是一组组织成键值对的数据值。你可以通俗地理解数组，就像一个蛋盒一样。蛋盒的每个隔层都可以放入鸡蛋，而且像蛋盒一样，你可以在里面放入任何东西（如石头、四叶草或螺丝钉），因此数组并不限于一种数据类型。它可以包含字符串、整数、布尔值等。此外，数组还可以包含其他数组。本章将介绍创建数组、从数组中删除元素以及遍历数组的内容。由于数组非常常见且有用，许多内置函数可以在
    PHP 中处理它们。例如，如果你想发送多个地址，数组允许这种选择。配置是根据性质、数量和特征进行的排列。


