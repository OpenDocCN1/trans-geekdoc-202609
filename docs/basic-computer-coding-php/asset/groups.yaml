    # 5.2.6 Extracting Multiple Values


    To copy all of an array''s values into variables, use the list() construct


    ```

    list($variable, ...) = $array;

    ```


    The array''s values are copied into the listed variables in the array''s internal
    order. By default the order in which they were inserted. Here''s an example:


    ```

    $person = array(''Fred'', 35, ''Betty'');

    list($name, $age, $wife) = $person;

    // name is "Fred", $age is 35, $wife is "Betty"

    ```


    If you have more values in the array than in the list(), extra values are ignored:


    ```

    $person = array(''Fred'', 35, ''Betty'');

    list($name, $age) = $person; // name is "Fred", $age is 35

    ```


