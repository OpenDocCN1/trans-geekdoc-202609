    ## Basic Computer Coding: PHP


    ## ROLE MODEL


    ## Rasmus Lerdorf


    Rasmus Lerdorf (born 22 November 1968) is a Danish-Canadian programmer. He created
    the PHP scripting language, authoring the first two versions of the language and
    participated in the development of later versions led by a group of developers
    including Jim Winstead (who later created blo.gs), Stig Bakken, Shane Caraveo,
    Andi Gutmans, and Zeev Suraski. He continues to contribute to the project.


    ### Early Life and Education


    Lerdorf was born in Disko Island on Greenland and moved to Denmark in 1980, and
    moved to King City, Ontario in 1983. He graduated from King City Secondary School
    in 1988, and in 1993 he graduated from the University of Waterloo with a Bachelor
    of Applied Science in Systems Design Engineering. He contributed to the Apache
    HTTP Server and added the LIMIT clause to the mSQL DBMS. A variant of this LIMIT
    clause had already been around for a decade in mainframe relational database management
    systems (like Oracle Rdb running on VAX/VMS, formerly from Digital Equipment Corporation),
    but apparently it had not yet been picked by the emerging PC-based databases.
    It was later adapted by several other SQL-compatible DBMS. He released the first
    version of PHP in 1995.


    ### Career


    From September 2002 to November 2009 Lerdorf was employed by Yahoo! Inc. as an
    Infrastructure Architecture Engineer. In 2010, he joined WePay in order to develop
    their application programming interface. Throughout 2011 he was a roving consultant
    for startups. On 22 February 2012 he announced on Twitter that he had joined Etsy.
    In July, 2013 Rasmus joined Jelastic as a senior advisor to help them with the
    creation of new technology.


    ### Introduction to PHP


    Lerdorf is a frequent speaker at Open Source conferences around the world. During
    his keynote presentation at OSCMS 2007, he presented a security vulnerability
    in each of the projects represented at the conference that year.


    Lerdorf also made an appearance at the WeAreDevelopers Conference 2017, making
    a speech on the history of PHP and the new PHP 7 release in 2017.


    ### Awards


    In 2003, Lerdorf was named in the MIT Technology Review TR100 as one of the top
    100 innovators in the world under the age of 35.


    ## SUMMARY


    - PHP Stands for “Hypertext Preprocessor.” (It is a recursive acronym, if you
    can understand what that means.) PHP is an HTML-embedded Web scripting language.
    This means PHP code can be inserted into the HTML of a Web page.


