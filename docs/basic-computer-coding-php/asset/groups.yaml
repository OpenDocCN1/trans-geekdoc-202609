    # 6.1.1 PHP 对象 vs. 类\n\n在现实世界中，对象有自己的特征和行为。我们可以将具有相同特征和行为的相似对象归为一类。因此我们可以说类是对象的蓝图。看下面的图片：\n\
    \n![](img/f8aa82c4ef45031ca4eadc2bb946c87a_172_0.png)\n\n从同一个 Car（汽车）类中，我们创建了三个独立的对象，分别为：Mercedes、Bmw\
    \ 和 Audi。\n\n尽管所有对象都是从同一个类创建的并因此拥有类的方法和属性，但仍然是不同的。这不仅是因为它们有不同的名称，还因为它们的属性可能被赋予了不同的值。例如，在上面的图中，它们在颜色属性上不同——Mercedes\
    \ 是绿色的，Bmw 是蓝色的，而 Audi 是橙色的。\n\n> 注意 getter 和 setter 的名称与关联的属性名称匹配。\n\n# 6.1.2\
    \ 定义类和对象\n\n在创建任何新对象之前，你需要一个对象的类或蓝图。在 PHP 中定义新类非常简单。在 PHP 中定义新类，你使用 `class` 关键字，如下所示：\n\
    \n# 基础编程：PHP\n\n```php<?php\nclass BankAccount{\n}\n```\n\n我们定义了一个名为 BankAccount\
