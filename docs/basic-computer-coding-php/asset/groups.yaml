    # 编辑部


    Aleksandar Mratinković 出于 1988 年 5 月 5 日，于塞尔维亚的 Arandjelovac。他毕业于经济高级中学（2007年）、贝尔格莱德旅游学院（2013年），并拥有心理学硕士学位（诺维萨德大学哲学学院）。他一直从事心理学的不同领域（发展心理学、临床心理学、教育心理学和工业心理学），并发表了多项科学著作。


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_4_0.png)


    Dan Piestun（博士）目前是以色列的一位学生企业家，致力于农业与生物医学的交叉领域，曾任国家农业研究院（INIA）的总裁兼首席执行官。Dan 是一位广泛发表的科学家，在职业生涯中获得了许多荣誉，包括两次获得耶路撒冷大学颁发的的
    Amit Gold Meir 奖，他的专业领域包括细胞生物学、植物动物遗传学和生物信息学。Dan 对应用科学和技术解决方案的热情并没有阻止他追求与农民、家庭和自然的深层联系。他的兴趣爱好包括当养蜂者和船员。


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_4_1.png)


    Felecia Killings 是 LiyahMore Publishing 的创始人兼首席执行官，这是一家为基督教作者提供技术和教育服务的出版公司。她在该公司担任高级编辑、作家、高级写作教练、内容营销专家、公司季度杂志主编、一个国际虚拟网络的执行官兼主持人，以及公司作者在线学校的执行主任。她曾任一名高中英语教师和职业发展教授。她拥有教育学硕士学位以及英语和非洲研究学士学位。


    Sandra El Hajj 博士毕业于美国佛罗里达州的诺瓦东南东大学，获得健康科学博士学位，是一位专门从事预防和全球健康的健康专业人士。她在贝贝鲁特最著名的大学之一以及美国佛罗里达州的两所大学接受了了
    12 年的教育，Sandra 博士确保在工作中融入跨学科和跨文化的方法。她长年的学习帮助她建立了自己的微型知识世界，将医疗领域与医学研究、统计学、食品技术、环境与职业健康、预防健康以及最值得的最后一个全球健康学位联系在一起。直到今天，她是中东地区首位也是唯一专门全球健康的医生。


    Hazem Shawky Fouda 是农业科学博士，于 2008 年毕业于亚历山大大学农学院，目前在棉花仲与与测试组织（CATGO）工作。


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_4_2.png)


    Fozia Parveen 在牛津大学获得水利工程博士。在此之前，她在巴基斯坦国立科技技术大学（NUST）获得环境科学硕士，在法提玛·金纳大学（FWJU）获得环境科学学士。


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_5_0.png)


    Igor Kronic 2003-2007 年就读于经济学院。2007 年毕业后，他进入贝尔格莱德旅游学院学习并获得学士学位。他是议会的一名学生代表。随后，他进入诺维萨德大学学习，并在
    2013 年成功答辩了硕士论文。之后，他进入一家跨国公司担任副总监。目前，他是旅游领域的学术顾问和作家。


    ![](img/f8aa82c4ef45031ca4eadc2bb946c87a_5_1.png)


