  md: "\n# Introduction to PHP\n\ndocuments. PHP has also become popular for generating\
    \ XML documents, graphics, Flash animations, PDF files, and so much more.\n\n\
    # Command-Line Scripting\n\nPHP can run scripts from the command line, much like\
    \ Perl, awk, or the Unix shell. You might use the command-line scripts for system\
    \ administration tasks, such as backup and log parsing; even some CRON job type\
    \ scripts can be done this way (nonvisual PHP tasks).\n\n# Client-Side GUI Applications\n\
    \nUsing PHP-GTK, you can write full-blown, cross-platform GUI applications in\
    \ PHP. However, we concentrate on the first item: using PHP to develop dynamic\
    \ web content. PHP runs on all major operating systems, from Unix variants including\
    \ Linux, FreeBSD, Ubuntu, Debian, and Solaris to Windows and Mac OS X. It can\
    \ be used with all leading web servers, including Apache, Microsoft IIS, and the\
    \ Netscape/iPlanet servers. The language itself is extremely flexible.\n\nYou\
    \ are not limited to outputting HTML or other text files—any document format can\
    \ be generated. PHP has built-in support for generating PDF files, GIF, JPEG,\
    \ and PNG images, and Flash movies.\n\n![](img/f8aa82c4ef45031ca4eadc2bb946c87a_18_0.png)\n\
    \nOne of PHP’s most significant features is its wide-ranging support for databases.\
    \ PHP supports all major databases (including MySQL, PostgreSQL, Oracle, Sybase,\
    \ MS-SQL, DB2, and ODBC-compliant ones), and even the more recent NoSQL-style\
    \ databases like SQLite and MongoDB are also supported. With PHP, creating web\
    \ pages with dynamic content from a database is remarkably simple.\n\nFinally,\
    \ PHP provides a library of PHP code to perform common tasks, such as database\
    \ abstraction, error handling, and so on, with the PHP Extension and Application\
    \ Repository (PEAR). PEAR is a framework and distribution system for reusable\
    \ PHP components. You can find out more about it here.\n\n# 1.1.2 Common Uses\
    \ of PHP\n\n- PHP performs system functions, i.e. from files on a system it can\
    \ create, open, read, write, and close them.\n- PHP can handle forms, i.e. gather\
    \ data from files, save data to a file, through email you can send data, return\
    \ data to the user.\n- You add, delete, modify elements within your database through\
    \ PHP.\n- Access cookies variables and set cookies.\n- Using PHP, you can restrict\
    \ users to access some pages of your website.\n- It can encrypt data.\n\n# 1.1.3\
    \ Characteristics of PHP\n\nFive important characteristics make PHP’s practical\
    \ nature possible –\n\n- Simplicity\n- Efficiency\n- Security\n- Flexibility\n\
    - Familiarity\n\n# 1.1.4 “Hello World” Script in PHP\n\nTo get a feel for PHP,\
    \ first start with simple PHP scripts. Since “Hello, World!” is an essential example,\
    \ first we will create a friendly little “Hello, World!” script.\n\nAs mentioned\
    \ earlier, PHP is embedded in HTML. That means in amongst your normal HTML (or\
    \ XHTML if you’re cutting-edge) you’ll have PHP statements like this –\n\n```html\n\
    <head>\n  <title>Hello World</title>\n</head>\n<body>\n  <?php echo \"Hello, World!\"\
    ;?>\n</body>\n</html>\n```\n\nIt will produce following result – Hello, World!\n\
    \nIf you examine the HTML output of the above example, you’ll notice that the\
    \ PHP code is not present in the file sent from the server to your Web browser.\
    \ All of the PHP present in the Web page is processed and stripped from the page;\
    \ the only thing returned to the client from the Web server is pure HTML output.\n\
    \nAll PHP code must be included inside one of the three special markup tags that\
    \ are recognised by the PHP Parser.\n\n```php\n<?php PHP code goes here ?>\n\n\
    <?php PHP code goes here ?>\n```\n\n```html\n<script language=\"php\"> PHP code\
    \ goes here </script>\n```\n\nA most common tag is <?php...?> and we will also\
    \ use the same tag in your tutorial.\n\nFrom the next chapter we will start with\
    \ PHP Environment Setup on your machine and then we will dig out almost all concepts\
    \ related to PHP to make you comfortable with the PHP language.\n\n# 1.1.5 The\
    \ History of PHP\n\nPHP is an “HTML-embedded scripting language” primarily used\
    \ for dynamic Web applications. The first part of this definition means that PHP\
    \ code can be interspersed with HTML, making it simple to generate dynamic pieces\
    \ of Web pages on the fly. As a scripting language, PHP code requires the presence\
    \ of the PHP processor. PHP code is normally run in plain-text scripts that will\
    \ only run on PHP-enabled computers (conversely programming languages can create\
    \ standalone binary executable files, a.k.a. programs). PHP takes most of its\
    \ syntax from C, Java, and Perl. It is an open source technology and runs on most\
    \ operating systems and with most Web servers. PHP was written in the C programming\
    \ language by Rasmus Lerdorf in 1994 for monitoring his online resume and related\
    \ personal information. For this reason, PHP originally stood for “Personal Home\
    \ Page”. Lerdorf combined PHP with his own Form PHP/FI (generally referred to\
    \ as PHP 2.0) on June 8, 1995. Two programmers, Zeev Suraki and Andi Gutmans,\
    \ rebuilt PHP’s core, releasing the updated result as PHP/FI 2 in 1997. The acronym\
    \ was formally changed to PHP: HyperText Preprocessor at this time. (This is an\
    \ acronym.)\n\nPHP 4 was released in May 2000, with Zend Engine 1.0. Among many\
    \ new features in PHP 4 are object-oriented programming, inclusion of PCRE, Interpreter\
    \ is a computer program that executes instructions compiled into machine, actually\
    \ performs the work. PHP 5 was released in July 2004, with improved speed and\
    \ reliability. Among many new features in PHP 5 are:\n\n- improved object-oriented\
    \ programming\n- integrated SQLite\n- exception handling\n- SOAP support\n- better\
    \ XML tools\n- iterators\n\nPHP 6 has been in development since October 2006.\
    \ The most significant change will be native support for Unicode. Unpopular, deprecated\
    \ features such as Magic Quotes, register_globals, safe_mode will disappear in\
    \ PHP 6. Although PHP is still primarily used for server-side generation of Web\
    \ pages, it can also be used to perform command-line scripting or to create graphical\
    \ applications with the help of GTK+. (94c87a_22.png) \n\nSoftware is a generic\
    \ that refers to a collection of data or computer instructions that tell the computer\
    \ how to work, in contrast to the physical hardware from which the system is built,\
    \ actually performs the work.\n"
  mdcn: "\n\n# PHP 简介\n\nPHP 也已成为生成 XML 文档、图形、Flash 动画、PDF 文件等内容的流行语言。\n\n# 命令行脚本\n\
    \nPHP 可以从命令行运行脚本，就像 Perl、awk 或 Unix shell 一样。你可能使用命令行脚本执行系统管理任务，例如备份和日志解析；甚至某些\
    \ CRON 任务脚本也可以通过这种方式完成（非视觉化 PHP 任务）。\n\n# 客户端 GUI 应用程序\n\n使用 PHP-GTK，你可以在 PHP\
    \ 中编写完整的跨平台 GUI 应用程序。然而，我们专注于第一项：使用 PHP 开发动态网页内容。PHP 运行在所有主流操作系统上，从包括 Linux、FreeBSD、Ubuntu、Debian\
    \ 和 Solaris 在内的 Unix 变体到 Windows 和 Mac OS X。它可以配合所有领先的 Web 服务器，包括 Apache、Microsoft\
    \ IIS 和 Netscape/iPlanet 服务器。该语言本身非常灵活。\n\n你不限于输出 HTML 或文本文件——可以生成任何文档格式。PHP 支持生成\
    \ PDF 文件、GIF、JPEG 和 PNG 图像以及 Flash 电影。\n\n![](img/f8aa82c4ef45031ca4eadc2bb946c87a_18_0.png)\n\
    \nPHP 最显著的特征之一是对数据库的广泛支持。PHP 支持所有主流数据库（包括 MySQL、PostgreSQL、Oracle、Sybase、MS-SQL、DB2\
    \ 以及符合 ODBC 的数据库），甚至支持更新的 NoSQL 风格数据库，如 SQLite 和 MongoDB。通过 PHP，从数据库创建动态内容的网页非常简单。\n\
    \n最后，PHP 提供了一个 PHP 代码库来执行常用任务，如数据库抽象、错误处理等，使用了 PHP 扩展和应用程序库（PEAR）。PEAR 是一个用于复用\
    \ PHP 组件的框架和分发系统。你可以在此处了解更多信息。\n\n# 1.1.2 PHP 的常见用途\n\n- PHP 执行系统功能，即对系统上的文件进行创建、打开、读取、写入和关闭。\n\
    - PHP 可以处理表单，即从文件中收集数据、将数据保存到文件中、通过电子邮件发送数据、向用户返回数据。\n- 你可以通过 PHP 在数据库中添加、删除、修改元素。\n\
    - 访问 cookie 变量并设置 cookie。\n- 使用 PHP，你可以限制用户访问你网站的某些页面。\n- 它可以加密数据。\n\n# 1.1.3\
    \ PHP 的特性\n\n五个重要的特性使得 PHP 的实用性成为可能——\n\n- 简单性\n- 效率性\n- 安全性\n- 灵活性\n- 熟悉性\n\n\
    # 1.1.4 PHP 中的“Hello World”脚本\n\n为了感受 PHP，首先从简单的 PHP 脚本开始。由于“Hello, World!” 是一个必不可少的示例，我们首先将创建一个友善的小型“Hello,\
    \ World!”脚本。\n\n如前所述，PHP 嵌入在 HTML 中。这意味着在你普通的 HTML（或者如果你追求前沿则使用 XHTML）中，你会有像这样的\
    \ PHP 语句——\n\n```html\n<head>\n  <title>Hello World</title>\n</head>\n<body>\n\
    \  <?php echo \"Hello, World!\";?>\n</body>\n</html>\n```\n\n它将产生以下结果—— Hello,\
    \ World!\n\n如果你检查上述示例的 HTML 输出，你会发现从服务器发送到 Web 浏览器的输出是纯 HTML。解释器是执行编译成机器指令的计算机程序，实际上执行工作。所有\
    \ PHP 代码必须包含在页面中最常见的特殊标记中：\n\n```php\n<?php echo \"Hello, World!\"; ?>\n\n```\n\
    \n<?php echo \"Hello, World!\"; ?>\n```\n\n```html\n<script language=\"php\">\n\
    <?php echo \"Hello, World!\"; ?>\n</script>\n```\n\n在你的教程中，从下一章我们将开始配置 PHP 环境，然后我们将挖掘所有与\
    \ PHP 相关的概念。\n\n# 1.1.5 PHP 的历史\n\nPHP 是一种“嵌入 HTML 的脚本语言”，主要用于动态应用程序。该定义的第一部分意味着\
    \ PHP 代码可以与 HTML 穿插，从而轻松生成动态网页。作为一种脚本语言，PHP 代码需要 PHP 处理器的存在。PHP 代码通常以文本脚本的形式运行。它是一种开源技术，运行在大多数操作系统和大多数\
    \ Web 服务器上。PHP 由 Rasmus Lerdorf 在 1994 年用 C 语言编写的，用于监控他的在线简历和个人信息。因此，PHP 最初代表“Home\
    \ Page”（个人首页）。1995 年 6 月 8 日，Lerdorf 将 PHP 与了自己的 Form 结合（泛称为 PHP/FI）。两个程序员 Zeev\
    \ Suraki 和 Andi Gutmans 重建了 PHP 核心，并在 1997 年发布了更新后的 PHP/FI 2。此时，该缩写正式更改为 PHP:HyperText\
    \ Preprocessor（超文本预处理器）。（这是一个缩写。）\n\nPHP 4 于 2000 年 5 月发布，带有 Zend Engine 1.0。PHP\
    \ 4 的许多新特性包括面向对象编程、包含 PCRE。所有返回到页面的输出是纯 HTML。PHP 5 于 2004 年 7 月发布，提高了速度和可靠性。PHP\
    \ 5 的许多新特性包括：\n\n- 改进面向对象编程\n- 集成 SQLite\n- 异常处理\n- SOAP 支持\n- 更好的 XML 工具\n- 迭代器\n\
    \nPHP 6 自 2006 年 10 月开始开发。最重的变化将是对 Unicode 的原生支持。不受欢迎且过时的特性（如 Magic Quotes、register_globals、safe_mode）将在\
    \ PHP 6 中消失。尽管 PHP 主要仍用于服务器端生成网页，但也可以用于执行命令行脚本或在 GTK+ 的帮助下创建图形应用程序。（94c87a_22.png）\n\
    \n软件是一个泛指，指的是一组数据或计算机指令，用于指示计算机如何工作，与构建系统的物理硬件相反，硬件实际上执行工作。\n\n"
