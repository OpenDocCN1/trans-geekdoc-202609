    # Basic Computer Coding: PHP


    Given that PHP does not dictate a specific encoding for strings, one might wonder
    how string literals are encoded. For instance, is the string "ä" equivalent to
    "\xE1" (ISO-8859-1), "\xC3\xA1" (UTF-8, C form), "\xC6\xCC\x81" (UTF-8, D form)
    or any other possible representation? The answer is that string will be encoded
    in whatever fashion it is encoded in the script file. Thus, if the script is written
    in ISO-8859-1, the string will be encoded in ISO-8859-1 and so on. However, this
    does not apply if Zend Multibyte is enabled; in that case, the script may be written
    in an arbitrary encoding (which is explicitly declared or detected) and then converted
    to a certain internal encoding, which is then the encoding that will be used for
    the string literals. Note that there are some constraints on the encoding of the
    script (or on the internal encoding, should Zend Multibyte be enabled) – this
    always means that the encoding should be a compatible superset of ASCII, such
    as UTF-8 or ISO-8859-1. Note, however, that state-dependent encodings where the
    same byte values can be used in initial and non-initial shift states may be problematic.


    Of course, in order to be useful, functions that operate on text may have to make
    some assumptions about how the string is encoded. Unfortunately, there is much
    variation on this matter throughout PHP’s functions:


    +   Some functions assume that the string is encoded in (any) single-byte encoding,
    but they do not need to interpret those bytes as specific characters. This is
    case of, for instance, substr(), strpos(), strlen() and strcmp(). Another way
    to think of these functions is that operate on memory buffers, i.e., they work
    with bytes and offsets.


    +   Other functions are passed the encoding of the string, possibly they also
    assume a default if no such information is given. This is the case of htmlentities()
    and the majority of the functions in the mbstringextension.


    +   Others use the current locale (see setlocale()), but operate byte-by-byte.
    This is the case of strcasecmp(),strtoupper() and ucfirst(). This means they can
    be used only with single-byte encodings, as long as the encoding is matched by
    the locale. For instance strtoupper("ä") may return "Ä" if the locale is correctly
    set and á is encoded with a single'
