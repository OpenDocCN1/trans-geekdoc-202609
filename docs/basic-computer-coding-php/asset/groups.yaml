    using the echo or print functions, or when a variable is compared to a string.
    The strings on Types and Type Juggling will make the following clearer.


    A boolean TRUE value is converted to the string "1". Boolean FALSE is converted
    to " (the empty string). This allows conversion back and forth between boolean
    and string values.


    An integer or float is converted to a string representing the number textually
    (including the exponent for floats). Floating point numbers can be converted using
    exponential notation (4.1E+6).


    The decimal point character is defined in the script''s locale (category LC_NUMERIC).


    Arrays are always converted to the string "Array"; because of this, echo and print
    cannot show themselves the contents of an array. To view a single element, use
    a construction such as echo `$arr[''foo'']`.


    In order to convert objects to string method __toString must be used.


    Resources are always converted to strings with the structure "Resource #1", where
    1 is the resource number assigned to the resource by PHP at runtime. While the
    exact structure of this string should not be relied on and is subject to change,
    it will always be unique for a given resource within the lifetime of a script
    being executed (ie a Web request or CLI process) and not be reused. To get a resource''s
    type, use the `get_resource_type()` function.


    NULL is always converted to an empty string. As stated above, directly converting
    an array, object, or resource to a string does not provide any useful information
    about the value beyond its type. The functions `print_r()` and `var_`


