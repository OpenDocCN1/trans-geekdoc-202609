    这是 while 循环的通用形式：\n\nwhile (expression):\n    statement\n\n当表达式（expression）求值为真时，while\
    \ 循环会执行该语句（statement）。该语句可以是以分号结尾的简单语句，也可以是包含在大括号中的复合复合语句。\n\n```\nwhilst.php\n\
    <?php\n\n$i = 0;\n\nwhile ($i < 5) {\n    echo \"PHP language\\n\";\n    $i++;\n\
    }\n?>\n```\n\n在代码示例中，我们反复向控制台打印字符串 \"PHP language\"。\nwhile 循环包含三个部分：初始化、测试和更新。语句的每次执行被称为一个周期（cycle）。\n\
    \n$i = 0;\n\n我们初始化变量 $i。它在我们的脚本中被用作计数器。\n\n```\nwhile ($i < 5) {\n...\n}\n```\n\
    \n方括号内的表达式是第二阶段，即测试。while 循环会执行体内的语句，直到表达式求值为假。\n\n$i++;\n\nwhile 循环的最后一个阶段是更新；计数器递增。注意，处理\
    \ while 循环不当会导致死循环。\n\n$ php whilst.php\nPHP language\nPHP language\nPHP language\n\
    PHP language\nPHP language\n\n程序向控制台打印了五次消息。do while 循环是 while 循环的一个版本。区别在于，该版本保证至少运行一次。\n\
    \n```\ndowhile.php\n<?php\n$count = 0;\ndo {\n    echo \"$count\\n\";\n} while\
    \ ($count != 0) {\n\n}\n?>\n```\n\n首先执行迭代，然后评估真值表达式。\nwhile 循环通常与 list() 和 each()\
    \ 函数配合使用。\n\n```php\nseasons.php\n<?php\n\n$seasons = [\"Spring\", \"Summer\"\
    , \"Autumn\", \"Winter\"];\n\nwhile (list($idx , $val) = each($seasons)) {\n \
    \   echo \"$val\\n\";\n}\n\n?>\n```\n\n我们在 $seasons 数组中有四个季节。我们遍历了所有的值并将它们打印到控制台。`each()`\
    \ 函数从数组中返回当前的键值对，并移动数组指针。当函数到达数组末尾时，它返回 false 循环终止。`each()` 函数返回一个数组。赋值左侧也必须是一个数组。我们使用\
    \ `list()` 函数从两个变量创建一个数组。\n\n```\nphp seasons.php\nSpring\nSummer\nAutumn\nWinter\n\
    ```\n\n这是 seasons.php 脚本的输出。\n\n## 2.3.4 PHP for 关键字\n\nfor 循环的作用与 while 循环相同。不同的是它将初始化、测试和更新这三个阶段放在了同一个位置，即圆括号之间。它主要用于进入循环前已知迭代次数的情况。\n\
    \n让我们来看一个 for 循环的示例。\n\n```\nforloop.php\n<?php\n$days = [ \"Monday\", \"Tuesday\"\
    , \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\" ];\n\n$len\
    \ = count($days);\n\nfor ($i = 0; $i < $len; $i++) {\n    echo $days[$i], \"\\\
    n\";\n}\n?>\n```\n\n我们有一个包含一周期的数组。我们想要打印该数组中的所有日期。\n\n$len = count($days);\n\n\
    或者我们可以通过程序计算数组中的项数。\n\n```for\nfor ($i = 0; $i < $len; $i++) {\n    echo $days[$i],\
    \ \"\\n\";\n}\n```\n\n## 基础计算机编程：PHP\n\n这里我们有了 for 循环结构。三个阶段由分号隔开。首先初始化计数器 $i。初始化部分只发生一次。接下来进行测试。如果测试结果为真，则执行语句。最后，计数器递增。这是一个周期。for\
    \ 循环一直迭代直到测试表达式为假。\n\n$ forloop.php\nMonday\nTuesday\nWednesday\nThursday\nFriday\n\
    Saturday\nSunday\n这是 forloop.php 的输出。\n\n## 2.3.5 PHP foreach\n\nforeach 简化了数组的遍历。它没有显式的计数器。它遍历数组元素。\n\
    \n```php\nforeach.php\n<?php\n$seasons = [\"Spring\", \"Summer\", \"Autumn\",\
    \ \"Winter\"];\n\nforeach ($seasons as $val) {\n    echo \"$val\\n\";\n}\n\n?>\n\
    ```\n\nforeach 循环允许遍历数组元素。在处理数组时，它比 while 循环更方便。\n\n```php\n<?php\n$fruits = [\"\
    apple\", \"banana\", \"cherry\"];\n\nforeach ($fruits as $fruit) {\n    echo $fruit\\\
    n\";\n}\n\n?>\n```\n\nforeach 循环也可以用于获取数组元素的键和值。\n\n```php\n<?php\n$seasons =\
    \ [\"Spring\", \"Summer\", \"Autumn\", \"Winter\"];\n\nforeach ($seasons as $key\
    \ => $val) {\n    echo \"$key => $val\\n\";\n}\n\n?>\n```\n\n## 2.3.6 PHP Break,\
    \ Continue 语句\n\nbreak 语句用于跳出循环。continue 语句用于跳过周期的剩余部分。\n\n```php\ntestbreak.php\n\
    <?php\n\nwhile (true) {\n    $val = rand(1, 30);\n    echo $val, \" \";\n    if\
    \ ($val == 22) {\n        break;\n    }\n}\n\necho \"\\n\";\n\n?>\n```\n\n$ php\
    \ testbreak.php\n6 13 5 21 9 22\n这是脚本的输出。\n\n在下面的示例中，我们打印不能被 2 除除的数字。\n\n```php\n\
    testcontinue.php\n<?php\n$num = 0;\n\nwhile ($num < 1000) {\n    $num++;\n   \
    \ if ($num % 2 == 0) {\n        continue;\n    }\n    echo \"$num \";\n}\necho\
    \ \"\\n\";\n\n?>\n```\n\n$ php testcontinue.php\n1 3 5 7 9 ...\n"
