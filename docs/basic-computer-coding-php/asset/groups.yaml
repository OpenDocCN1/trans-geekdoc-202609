    # Web 技术


    成功推销了一种名为 S 型管的设备。这由查尔斯·史密斯发明的气体整流器（专利由 Amrad 购买），大大提高了收音机的效率，消除了对收音电池的需求。布什从这项事业中赚了大量资金。该公司在
    1925 年更名为雷神公司（Raytheon），成为一家大型电子公司和国防承包商，至今作为美国主要的国防承包商和工业集团存在。


    布什还致力于开发能够根据罗斯福要求的自动化人类机器。他概述了持续支持研究的重要性。他呼吁建立国家科学基金会，该机构“应该制定并促进科学研究和科学教育的国家政策，支持非营利组织的基础研究，通过奖学金和研究员计划培养美国青年的科学人才，并通过合同或其他方式支持军事事务的长期研究”。正是这一提议引发了导致1950年国家科学基金会成立的一系列事件。


    在接后的几十年里，布什被任命为美国许多关键机构的董事主席：1946年——陆军和海军部联合开发委员会主席；1947年——国家军事机构发展委员会主席；1947年——AT&T
    董事；1957年——麻理工学院公司主席，从1957年至1962年他担任大型制药巨头默克公司（Merck & Co.）主席等。范尼瓦尔·布什于1974年6月28日在马萨诸塞州贝尔蒙特在中风后死于肺炎去世。


