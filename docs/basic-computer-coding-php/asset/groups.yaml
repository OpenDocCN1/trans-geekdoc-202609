    PHP is a general purpose, server-side scripting language run a web server that''s
    designed to make dynamic pages and applications. PHP (Hypertext Pre-Processor)
    is a server-side web programming language that is widely used for web development.
    However, there are many languages which are used for web development or web programming.
    But among all of them PHP is the most popular web scripting language. So, let
    us find out why PHP is widely used for web development. PHP language has its roots
    in C and C++. syntax is most similar to C and C++ language syntax. So, programmers
    find it easy to learn and manipulate.


    This book is systematically divided into seven chapters. This book is designed
    for PHP programmers who are completely unaware of PHP concepts but they have basic
    understanding on computer programming. Including basic through advanced functionality,
    this book explains how to develop dynamic Web applications, such as guest books,
    chat rooms, and shopping carts.


