  md: "\n## Basic Computer Coding: PHP\n\nThe array_slice() function returns a new\
    \ array consisting of a consecutive series of values from the original array.\
    \ The offset parameter identifies the initial element to copy (0 represents the\
    \ first element in the array), and the length parameter identifies the number\
    \ of values to copy. The new array has consecutive numeric keys starting at 0.\
    \ For example:\n\n```\n$people = array(\"Tom\", \"Dick\", \"Harriet\", \"Brenda\"\
    , \"Jo\");\n$middle = array_slice($people, 2, 2); // $subset is array(\"Harriet\"\
    , \"Brenda\")\n```\n\nIt is generally only meaningful to use array_slice() on\
    \ indexed arrays (i.e., those with consecutive integer indices starting at 0):\n\
    \n```php\n// this use of array_slice() makes no sense\n$person = array(\"name\"\
    \ => \"Fred\", \"age\" => 35, \"wife\" => \"Betty\");\n$subset = array_slice($person,\
    \ 1, 2); // $subset is array(0 => 35, 1 => \"Betty\")\n```\n\nCombine array_slice()\
    \ with list() to extract only values to variables:\n\n```php\n$order = array(\"\
    Tom\", \"Dick\", \"Harriet\", \"Brenda\", \"Jo\");\nlist($second, $third) = array_slice($order,\
    \ 1, 2);\n// $second is \"Dick\", $third is \"Harriet\"\n```\n\n## Splitting an\
