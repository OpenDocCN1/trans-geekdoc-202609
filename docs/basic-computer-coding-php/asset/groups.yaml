    ```\n\n注意，我们使用 `var_dump()` 函数来查看银行账户的内容。\n\n# 6.1.3 属性\n\n在面向对象的术语中，对象的特征被称为属性。例如，银行账户有账号和总余额。所以让我们把这些属性添加到\
    \ BankAccount 类中：\n\n```php\n<?php\nclass BankAccount{\nprivate $accountNumber;\n\
    private $totalBalance;\n```\n\n你看到我们在属性前面使用了 `private` 关键字。这被称为属性可见性。每个属性可以有三种可见性级别之一，即\
    \ `private`、`protected` 和 `public`。\n\n- private: 类私有属性只能由类内部的方法访问。稍后将介绍类的方法。\n\
    - protected: 受保护属性与私有属性相似，但受保护属性可以被子类访问。你稍后将学习子类和继承。\n\n- public: 公有属性不仅可以被类内部访问，还可以被类外部的代码访问。\n\
