  - '[PAGE 26]


    Install the php.ini file. Edit this file to get configuration directives -

    cd ..//php-5.x

    cp php.ini-dist /usr/local/lib/php.ini


    Tell your Apache server where you want to serve files from, and what extension(s)
    you want to identify PHP files .php is the standard, but you can use .html, .phtml,
    or whatever you want.


    +   - Go to your HTTP configuration files (/usr/local/apache/conf or whatever
    your path is)

    - Open httpd.conf with a text editor.

    - Search for the word DocumentRoot (which should appear twice), and change both
    paths to the directory you want to serve files out of (in our case, /home/httpd).
    We recommend a home directory rather than the default /usr/local/apache/htdocs
    because it is more secure, but it doesn''t have to be in a home directory. You
    will keep all your PHP files in this directory.


    Add at least one PHP extension directive, as shown in the first line of code that
    follows. In the second line, we.ve also added a second handler to have all HTML
    files parsed as PHP.

    AddType application/x-httpd-php .php

    AddType application/x-httpd-php .html


    Restart your server. Every time you change your HTTP configuration or php.ini
    files, you must stop and start your server again.

    cd ../bin/apachectl


    Set the document directory permissions to world-executable. The actual PHP files
    in the directory need only be world-readable (644). If necessary, replace /home/httpd
    with your document root below -

    chmod 755 /home/httpd/html/php'
