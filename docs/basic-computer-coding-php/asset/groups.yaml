    # 4.2.3 String Access and Modification\n\nCharacters within strings may be accessed\
    \ and modified by specifying the zero-based offset of the desired character after\
    \ the string using square brackets, as in $str[4]. Think of a string as an array\
    \ of characters for this purpose. The functions substr() and substr_replace()\
    \ can be used when you want to extract or replace more than 1 character.\n\nInteger\
    \ is a whole number (not a fraction) that can have decimal places. Therefore the\
