    大多数 PHP 值也可以被转换为字符串以进行持久化存储。这种方法称为序列化，通过 `serialize()` 函数执行。如果 PHP 引擎在编译时启用了 WDDX
    支持，PHP 值也可以被序列化为格式良好的 XML 文本。


    ## 4.2.5 字符串转换为数字


    当字符串在数值上下文中被求值时，结果的值和类型如下所示确定。


    数值是分配给字母表中某个字母的定量值。如果字符串不包含任何字符 `,`、`e` 或 `E`，且该数值值在整数类型限制范围内（由 `PHP_INT_MAX`
    定义），则该字符串将被求值为整数。在所有其他情况下，它将被求值为浮点数。


    该值由字符串的初始部分给出。如果字符串以有效的数值数据开头，则该值为 0（零）。否则，有效的数值数据是一个可选的符号，后跟一个或多个数字（可选包含小数点），紧跟一个可选的指数。指数为
    ''e'' 或 ''E''，后跟一个或多个数字。


    ```php

    $foo = 1 + "10.5"; // $foo is float

    (11.5)


    $foo = 1 + "-1.3e3"; // $foo is float

    (-1299)


    $foo = 1 + "bob-1.3e3"; // $foo is integer

    (1)

    ```


    ```php

    foo = 1 + "bob3"; // $foo is integer (1)

    foo = 1 + "10 Small Pigs"; // $foo is integer (11)

    foo = 4 + "10.2 Little Piggies"; // $foo is float (14.2)

    foo = "10.0 pigs" + 1; // $foo is float (11)

    foo = "10.0 pigs" + 1.0; // $foo is float (11)

    ?>

    ```


    有关此转换的更多信息，请参阅 Unix 手册页 `strtod(3)`。


    要测试任何示例，请剪切粘贴示例并插入以下行以查看运行情况：


    ```php

    echo "$foo=$foo; type is " . gettype($foo) . "<br/>\n";

    ?>

    ```


    在 C 语言中，不要期望通过将字符转换为整数来获取该字符的代码。请使用 `ord()` 和 `chr()` 函数在 ASCII 码和字符之间进行转换。


    ## 4.2.6 字符串类型的细节


    PHP 中的字符串被实现为字节数组和一个指示缓冲区长度的整数。它没有关于这些字节如何转换为字符的信息，这把任务留给了程序员。字符串可以由任何值组成，没有任何限制；特别是，值为
    0 的字节（"NULL 字节"）允许出现在字符串的任何位置（然而，本手册中提到某些函数认为不是“二进制安全的”，它们可能会将字符串传递给忽略 NUL 字节之后数据的库）。


    字符串类型的这种性质解释了为什么 PHP 中没有单独的“字节”（byte）类型——字符串承担了这一角色。不返回任何文本数据的函数（例如，从网络套接字读取的任意数据）仍然会返回字符串。


    鉴于 PHP 没有为字符串规定特定的编码，人们可能会好奇字符串字面量是如何编码的。例如，字符串 "ä" 是否等于 "\xE1" (ISO-8859-1)、"\xC3\xA1"
    (UTF-8, C形式)、"\xC6\xCC\x81" (UTF-8, D形式) 或其他可能的表示？答案是，字符串将以其在脚本文件中编码的方式编码。因此，如果脚本是用
    ISO-8859-1 编写的，字符串将以 ISO-8859-1 编码，依此类推。然而，如果启用了 Zend Multibyte（多字节支持），则不适用；在这种情况下，脚本可以用任意编码（显式声明或检测到）编写，然后转换为特定的内部编码，该内部编码将用于用于字符串字面量。注意，脚本的编码（或如果启用了
    Zend Multibyte 则对内部编码）存在一些限制——这始终意味着编码应该是 ASCII 的兼容超集，例如 UTF-8 或 ISO-8859-1。然而请注意，依赖状态的编码（相同的字节值在初始状态和非初始状态下含义不同）可能会出现问题。


    当然，为了实用，处理文本的函数可能对字符串的编码方式做出某些假设。遗憾的是，在 PHP 函数中，这个问题上存在很大差异：


    - 某些函数假设字符串是以（任何）单字节编码的，但它们不需要解释这些字节为特定字符。这适用于 `substr()`、`strpos()`、`strlen()`
    和 `strcmp()` 等函数。这些函数的另一种思考方式是它们在内存缓冲区上操作，即它们与字节和偏移量工作。


    - 其他函数被传递字符串的编码，可能可能在没有提供此类信息时也假定一个默认值。这适用于 `htmlentities()` 和 `mbstring` 扩展中的大多数函数。


    - 另一些函数使用当前的 locale（参见 `setlocale()`），但按字节操作。这适用于 `strcasecmp()`、`strtoupper()`
    和 `ucfirst()`。这意味着它们可以用于。


