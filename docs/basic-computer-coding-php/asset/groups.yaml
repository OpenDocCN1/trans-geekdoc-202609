    \ it as arguments. For example:\n\n```php\n$numbers = range(2, 5); // $numbers\
    \ = array(2, 3, 4, 5);\n$letters = range('a', 'z'); // $letters holds the alphabet\n\
    $reversedNumbers = range(5, 2); // $reversedNumbers = array(5, 4, 3, 2);\n```\n\
    \nOnly the first letter of a string argument is used to build the range:\nrange(\"\
    aaa\", \"zzz\"); // same as range('a','z')\n\n# Getting the Size of an Array\n\
    \nThe count() and sizeof() functions are identical in use and effect.\nThey return\
    \ the number of elements in the array. There is no stylistic preference about\
    \ which function you use. Here's an example:\n\n```php\n$family = array(\"Fred\"\
    , \"Wilma\", \"Pebbles\"); // $size is 3\n$size = count($family);\n```\n\nThis\
    \ function counts only values that are actually set:\n$confusion = array(10 =>\
    \ \"ten\", 11 => \"eleven\", 12 => \"twelve\"); // $size is 3\n$size = count($confusion);\n\
    \n# Padding an Array\n\nTo create an array with values initialized to the same\
    \ content, use array_pad(). The first argument to array_pad() is the array, the\
    \ second argument is the minimum number of elements you want the array to have,\
    \ and the third argument is the value to give any elements that are created. The\
    \ array_pad() function returns a new padded array, leaving its argument (source)\
    \ array alone.\n\nHere's array_pad() in action:\n\n```php\n$scores = array(5,\
    \ 10);\n$padded = array_pad($scores, 5, 0); // $padded is now array(5, 10, 0,\
    \ 0, 0)\n$padded = array_pad($scores, -5, 0); // $padded is now array(0, 0, 0,\
    \ 5, 10);\n```\n\nNotice how the new values are appended to the end of the array.\
    \ If you want the new values added to the start of the array, use a negative argument:\n\
    \nIf you pad an associative array, existing keys will be preserved. New elements\
    \ will have numeric keys starting at 0.\n\n# 5.2.5 PHP Arrays\n\nA multi-dimensional\
    \ array each element in the main array can also be an array. And each element\
