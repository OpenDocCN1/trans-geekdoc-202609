    \ a string\n$str = 'This is still a test.';\n$last = $str[strlen($str)-1];\n```\n\
    \n```php\n// Modify the last character of a string\n$str = 'Look at the sea';\n\
    $str[strlen($str)-1] = 'e';\n```\n\nAs of PHP 5.4 string offsets have either to\
    \ be integers or integer-like strings, otherwise a warning will be thrown. Previously\
    \ an offset like \"foo\" was silently cast to 0.\n\n# Example #12. Differences\
    \ between PHP 5.3 and PHP 5.4\n\n```php\n<?php\n$str = 'abc';\n```\n\n```php\n\
    var_dump($str['1.0']);\nvar_dump(isset($str['1.0']));\n```\n\n```php\nvar_dump($str['x']);\n\
    ```\n\n```php\nvar_dump(isset($str['x']));\nvar_dump(isset($str['1.0']));\nvar_dump(isset($str['1.0']));\n\
    ?>\n```\n\nOutput of the above example in PHP 5.3:\nstring(1) \"b\"\nbool(true)\n\
    string(1) \"b\"\nbool(true)\nstring(1) \"a\"\nbool(true)\nstring(1) \"b\"\nbool(true)\n\
    \nOutput of the above example in PHP 5.4:\nstring(1) \"b\"\nbool(true)\nWarning:\
    \ Illegal string offset '1.0' in /tmp/t.php on line 7\nstring(1) \"b\"\nbool(false)\n\
    Warning: Illegal string offset 'x' in /tmp/t.php on line 9\nstring(1) \"a\"\n\
    bool(false)\n\n# 4.2.4 Converting to String\n\nA value can be converted to a string\
    \ using the (string) cast or the strval() function. String conversion is automatically\
    \ done in the scope of an expression where a string is needed. This happens when\
    \ using the echo or print functions, or when a variable is compared to a string.\
    \ The strings on Types and Type Juggling will make the following clearer.\n\n\
    A boolean TRUE value is converted to the string \"1\". Boolean FALSE is converted\
    \ to \"\" (the empty string). This allows conversion back and forth between boolean\
    \ and string values.\n\nAn integer or float is converted to a string representing\
    \ the number textually (including the exponent for floats). Floating point numbers\
    \ can be converted using exponential notation (4.1E+6).\n\nThe decimal point character\
    \ is defined in the script's locale (category LC_NUMERIC).\n\nArrays are always\
    \ converted to the string \"Array\"; because of this, echo and print cannot show\
    \ the contents of an array. To view a single element, use a construction such\
    \ as echo `$arr['foo']`.\n\nIn order to convert objects to string method __toString\
    \ must be used.\n\nResources are always converted to strings with the structure\
    \ \"Resource #1\", where 1 is the resource number assigned to the resource by\
    \ PHP at runtime. While the exact structure of this string should not be relied\
    \ on and is subject to change, it will always be unique for a given resource within\
    \ the lifetime of a script being executed (ie a Web request or CLI process) and\
    \ not be reused. To get a resource's type, use the `get_resource_type()` function.\n\
    \nNULL is always converted to an empty string. As stated above, directly converting\
    \ an array, object, or resource to a string does not provide any useful information\
    \ about the value beyond its type. The functions `print_r()` and `var_`\n\n![](img/f8aa82c4ef45031ca4eadc2bb946c87a_130_0.png)\n\
    \nOn July 14, 2004, PHP 5 included new features powered by the new Zend Engine\
    \ II. PHP 5 included new features such as improved support for object-oriented\
    \ programming, the PHP Data Objects (PDO) extension (which defines a lightweight\
    \ and consistent interface for accessing databases), and numerous performance\
    \ enhancements.\n"
