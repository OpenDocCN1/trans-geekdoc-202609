    ## 7.2 MAINTAINING STATE


    HTTP is a stateless protocol, which means that once a web server completes a client''s
    request for a web page, the connection between the two goes away. In other words,
    there is no way for a server to recognize that a sequence of requests all originate
    from the same client.


    State is useful, though. You can''t build a shopping-cart application, for example,
    if you can''t keep track of a sequence of requests from a single user. You need
    to know when a user puts an item in their cart, when he adds items, when he removes
    them, and what''s in the cart when he decides to check out.


    To get around the Web''s lack of state, programmers have come up with many tricks
    to keep track of state information between requests (also known as session tracking).
    One such technique is to use hidden form fields to pass around information. PHP
    treats hidden form fields just like normal form fields, so the values are available
    in the $_GET and $_POST arrays. Using hidden form fields, you can pass around
    the entire contents of a shopping cart. However, a more common technique is to
    assign each user a unique identifier and pass the ID around using a single hidden
    form field. While hidden form fields work in all browsers, they work only for
    a sequence of dynamically generated forms, so they aren’t as useful as some other
    techniques.


    Another technique is URL rewriting, where every local URL on which the user might
    click is dynamically modified to include extra information. This extra information
    is often specified as a parameter in the URL. For example, if you assign every
    user a unique ID, you might include that ID in all.


    # Remember


    URL is a reference to a web resource that specifies its location on a computer
    network and a mechanism for retrieving it.


    If you make sure to dynamically modify all local links to include a user ID, you
    can now keep track of individual users in your application. URL rewriting works
    for all dynamically generated documents, not just forms, but actually performing
    the rewriting can be tedious.


    The third and most widespread technique for maintaining state is to use cookies.
    A cookie is a bit of information that the server can give to a client. On every
    subsequent request the client will give that information back to the server, identifying
    itself. Cookies are useful for retaining information through repeated visits by
    a browser, but they’re not without their own problems. The main problem is that
    most browsers allow users to disable cookies. So any application that uses cookies
    for state maintenance needs to use another technique as a fallback mechanism.
    We’ll discuss cookies in more detail shortly.


    The best way to maintain state with PHP is to use the built-in session-tracking
    system. This system lets you create persistent variables that are accessible from
    different pages of your application, as well as in different visits to the site
    by the same user. Behind the scenes, PHP’s session-tracking mechanism uses cookies
    (or URLs) to elegantly solve most problems that require state, taking care of
    all the details for you.


    ### 7.2.1 Cookies


    Cookies are text files stored on the client computer and are kept of use tracking
    purpose. PHP transparently supports HTTP cookies.


    There are three steps involved in identifying returning users –


    - Server script sends a set of cookies to the browser. For example, name, age,
    or identification number etc.

    - Browser stores this information on local machine for future use.

    - When next time browser sends any request to web server it sends those cookies
    information to the server and uses that information to identify the user.


    # The Anatomy of a Cookie


    Cookies are usually set in an HTTP header (although JavaScript can also set a
    cookie directly on a browser). A PHP script that sets a cookie might send headers
    that look like this –


    HTTP is an application protocol for distributed, collaborative, and hypermedia
    information systems.


    ```http

    HTTP/1.1 200 OK

    Date: Fri, 04 Feb 2000 21:03:38 GMT

    Server: Apache/1.3.9 (UNIX) PHP/4.0b3

    Set-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT; path=/; domain=tutorialspoint.com

    Connection: close

    Content-Type: text/html

    ```


    As you can see, the Set-Cookie header contains a name value pair, a GMT date,
    a path and a domain. The name and value will be URL encoded. The expires field
    is an instruction to the browser to “forget” the cookie after the given time and
    date.


    If the browser is configured to store cookies, it will then keep this information
    until the expiry date. If the user posts at any page that matches the path and
    domain of the cookie, it will resend the cookie to the server. The browser’s headers
    might look something like this:


    ```http

    HTTP/1.1 200 OK

    Date: Fri, 04 Feb 2000 21:03:38 GMT

    Server: Apache/1.3.9 (UNIX) PHP/4.0b3

    Set-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT; path=/; domain=tutorialspoint.com

    Connection: close

    Content-Type: text/html

    ```


    # Setting Cookies with PHP


    PHP provided setcookie() function to set a cookie. This function requires six
    arguments and should be called before:


    - **Name**: This sets the name of the cookie and is stored in an environment variable
    called $_COOKIE.

    - **Value**: This sets the value of the named variable and is the content you
    actually want to store.

    - **Expiry**: This specify a future time in seconds since 00:00:00 GMT on 1st
    Jan 1970. After this parameter is not set, then cookie will automatically expire.

    - **Path**: This specifies the directories for which the cookie is valid. A single
    forward slash character permits the cookie to be valid for all directories.

    - **Domain**: This can be used to specify the domain name and must contain at
    least two periods to be valid. All cookies are only valid for the host and domain
    which created them.

    - **Security**: This can be set to 1 to specify that the cookie should only be
    set by secure transmission using HTTPS; otherwise set to 0 which means cookie
    can be sent by regular HTTP.


    Following example will create two cookies **name** and **age**, these cookies
    will be expired after one hour.


    ```php

    <?php

    setcookie("name", "John Doe", time()+3600, "/", "", 0);

    setcookie("age", "36", time()+3600, "/", "", 0);

    ?>

    ```


