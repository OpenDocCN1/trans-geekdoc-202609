  mdcn: "\n\n# 基础计算机编码：PHP\n\n```php\n$addresses[0] = \"spam@cyberpromo.net\";\necho\
    \ $addresses;    // 输出 \"Array\"\n```\n\n在程序中使用简单的赋值来初始化数组可能会导致如下代码：\n\n```php\n\
    $addresses[0] = \"spam@cyberpromo.net\";\n$addresses[1] = \"abuse@example.com\"\
    ;\n$addresses[2] = \"root@example.com\";\n```\n\n这是一个索引数组，具有从 0 开始的整数索引。以下是一个关联数组：\n\
    \n```php\n$price['gasket'] = 15.29;\n$price['wheel'] = 75.25;\n$price['tire']\
    \ = 50.00;\n```\n\n初始化数组的一种简单方法是使用 `array()` 结构，它构建一个索引数组，并且索引值（从 0 开始）会被自动创建：\n\
    \n```php\n$addresses = array(\"spam@cyberpromo.net\", \"abuse@example.com\", \"\
    root@example.com\");\n```\n\n使用 `array()` 创建关联数组时，使用 `=>` 符号将索引（键）与值分开：\n\n```php\n\
    $price = array(\n  'gasket' => 15.29,\n  'wheel' => 75.25,\n  'tire' => 50.00\n\
    );\n```\n\n> 空格符和对齐的使用。我们可以将代码挤在一起，但那样读起来就不那么容易（这等同于之前的代码），也不由（键，值）对组成，使得每个可能的项易于添加或删除值：\n\
    \n关联数组是一种由（键，值）对集合的数据类型，集合中的每个对都是同时存在的。\n\n```php\n$price = array('gasket' =>\
    \ 15.29, 'wheel' => 75.25, 'tire' => 50.00);\n```\n\n你也可以使用更短的替代语法来指定数组：\n\n```php\n\
    $days = ['gasket' => 15.29, 'wheel' => 75.25, 'tire' => 50.0];\n```\n\n# PHP 数组\n\
    \n要构造一个空数组，向 `array()` 传递零参数：\n```php\n$addresses = array();\n```\n\n你可以使用 `=>`\
    \ 指定一个初始键，然后跟上值列表。\n值将从该键开始插入数组，随后的值具有顺序的键：\n\n```php\n$days = array(1 => \"Mon\"\
    , \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\", \"Sun\");\n// 2 是 Tue, 3 是 Wed，以此此类推。\n\
    ```\n\n如果初始索引是非数字字符串，随后的索引将是从 0 开始的整数。因此，以下代码可能是错误的：\n\n```php\n$whoops = array('Fri'\
    \ => \"Black\", \"Brown\", \"Green\");\n```\n\n```php\n// 等同于\n$whoops = array('Fri'\
    \ => \"Black\", 0 => \"Brown\", 1 => \"Green\");\n```\n\n# 向数组末尾添加值\n\n要向现有索引数组的末尾插入更多值，请使用\
    \ `[]` 语法：\n\n```php\n$family = array(\"Fred\", \"Wilma\");\n$family[] = \"Pebbles\"\
    ; // $family[2] 是 \"Pebbles\"\n```\n\n此结构假设数组的索引是数字，并将元素分配到下一个可用的数字索引（从 0 开始）。在没有适当键的情况下向关联数组追加元素几乎总是程序员的错误，PHP\
    \ 将为新元素分配数字索引而不会发出警告：\n\n```php\n$person = array('name' => \"Fred\");\n$person[]\
    \ = \"Wilma\"; // 现在 $person[0] 是 \"Wilma\"\n```\n\n# 分配范围内的值\n\n`range()` 函数创建一个包含你传递给它的两个值之间的连续整数或字符值的数组。例如：\n\
    \n```php\n$numbers = range(2, 5);\n$letters = range('a', 'z');\n$reversedNumbers\
    \ = range(5, 2);\n```\n\n`range` 的第一个字符串参数用于构建：\n```\nrange(\"aaa\", \"zzz\");\n\
    ```\n\n# 获取数组的大小\n\n`count()` 和 `sizeof()` 函数在用法和效果上是相同的。它们返回数组中元素的数量。这里有一个示例：\n\
    \n```php\n$family = array(\"Fred\", \"Wilma\", \"Pebbles\"); // $size 为 3\n$size\
    \ = count($family);\n```\n\n此函数仅计算实际设置的值：\n```php\n$confusion = array(10 => \"\
    ten\", 11 => \"eleven\", 12 => \"twelve\"); // $size 为 3\n$size = count($confusion);\n\
    ```\n\n# 填充数组\n\n要创建一个具有相同值的数组，使用 `array_pad()`。`array_pad()` 的第一个参数是数组，第二个参数是你希望数组拥有的元素数量，第三个参数是提供任何元素的值。`array_pad()`\
    \ 返回一个新的填充后的数组，保留其源数组的内容。这里是用法示例：\n\n```php\n$scores = array(5, 10);\n$padded\
    \ = array_pad($scores, 5, 0); // $padded 现在是 (5, 10, 0, 0, 0)\n$padded = array_pad($scores,\
    \ -2, 0); // $padded 现在是 (0, 0, 5, 10)\n```\n\n注意新值是如何追加到数组末尾的。如果你想将新值添加到数组开头，请使用负参数：\n\
    \n如果你填充关联数组，现有的键将被保留。新元素将具有从 0 开始的数字键。\n\n# 5.2 PHP 数组\n\n多维数组中的每个元素也可以是数组。子数组中的每个元素可以是数组，以此此类推。多维数组中的值可以使用多个索引访问。\n\
