    # Basic Computer Coding: PHP


    # INTRODUCTION


    A string is series of characters, where a character is the same as a byte. This
    means that PHP only supports a 256-character set, and hence does not offer native
    Unicode support.


    A string is a data type used in programming, such as an integer and floating point
    unit, but is used to represent text rather than numbers. It is comprised of a
    set of characters that can also contain spaces and numbers. For example, the word
    “hamburger” and the phrase “I ate 3 hamburgers” are both strings. Even “12345”
    could be considered a string, if specified correctly. Typically, programmers must
    enclose strings in quotation marks for the data to be recognized as a string and
    not a number or variable name.


    For example, in the comparison:


    ```

    if (Option1 == Option2) then ...

    ```


    Option1 and Option2 may be variables containing integers, strings, or other data.
    If the values are the same, the test returns a value of true, otherwise the result
    is false. In the comparison:


    ```

    if (“Option1” = “Option2”) then ...

    ```


    Option1 and Option2 are being treated as strings. Therefore the test is comparing
    the words “Option1” and “Option2,” which would return false. The length of a string
    is often determined by using a null character.


    # 4.1 BASIC PHP STRING FUNCTIONS


    A PHP string is a sequence of characters i.used to store and manipulate text.
    A string is a collection of characters. String is one of the data types supported
    by PHP. The string variables can contain alphanumeric characters. Strings are
    created when:


    +   - You declare variable and assign string characters to

    - You can directly use them with echo statement.

    - String is language construct, it helps capture words.

    - Learning how strings work in PHP and how to manipulate them will make you very
    effective and productive developer.'
