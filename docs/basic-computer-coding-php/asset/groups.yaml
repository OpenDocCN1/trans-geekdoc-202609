    ## 7.2 维护状态


    HTTP 是一个无状态协议，这意味着一旦 Web 服务器完成客户端对 Web 页面的请求，两者之间的连接就会消失。换句话说，服务器没有办法识别一系列请求是否源自同一个客户端。


    尽管如此，状态是非常用的。例如，如果你无法跟踪来自单个用户的系列请求，你就无法构建购物车应用程序。你需要知道用户何时将物品放入购物车、何时添加物品、何时移除物品，以及当他决定结账时购物车里装了什么。


    为了解决 Web 缺乏状态的问题，程序员们想出了许多技巧来在请求之间跟踪状态信息（也称为会话跟踪，session tracking）。其中一种技术是使用隐藏表单字段来传递信息。PHP
    处理隐藏表单字段的方式与普通表单字段相同，因此这些值可以在 `$_GET` 和 `$_POST` 数组中获取到。通过使用隐藏表单字段，你可以传递整个购物车的内容。然而，更常用的技术是为每个用户分配一个唯一标识符，并使用单个隐藏表单字段传递该
    ID。虽然隐藏表单字段在所有浏览器中都有效，但它们只对动态生成的表单序列有效，因此没有某些其他技术那么有用。


    另一种技术是 URL 重写，用户可能点击的每个本地 URL 都会被动态修改以包含额外信息。这些额外信息通常指定为 URL 中的参数。例如，如果你为每个用户分配一个唯一
    ID，你可以将该 ID 包含在所有 中。


    # 记住


    URL 是对 Web 资源的引用，指定了其在计算机网络上的位置以及检索它的机制。


    如果你确保动态修改所有本地链接以包含用户 ID，你现在就可以在应用程序中跟踪单个用户。URL 重写适用于所有动态生成的文档，而不只是表单，但实际执行重写可能会非常繁琐。


    维护状态的第三种最广泛的技术是使用 Cookie。Cookie 是服务器可以提供给客户端的一段信息。在随后的每个请求中，客户端都会将该信息返回给服务器，以识别自己的身份。Cookie
    对于通过浏览器反复访问来保留信息非常有用，但它们并非没有问题。主要问题是大多数浏览器允许用户禁用 Cookie。因此，任何使用 Cookie 维护状态的应用程序都需要使用另一种技术作为回退机制。我们很快会详细讨论
    Cookie。


    使用 PHP 维护状态的最佳方法是使用内置的会话跟踪系统。该系统允许你创建持久化变量，这些变量可以在应用程序的不同页面中、以及同一用户对网站的多次访问中访问。在后台，PHP
    的会话跟踪机制使用 Cookie（或 URL）优雅地解决了大多数需要状态的问题，并为你处理了所有的细节。


    ### 7.2.1 Cookie


    Cookie 是存储在客户端计算机上的文本文件，用于跟踪使用情况。PHP 透明地支持 HTTP Cookie。


    识别返回用户涉及三个步骤：


    - 服务器脚本向浏览器发送一组 Cookie。例如，名称、年龄或识别号等。

    - 浏览器将这些信息存储在本地机器上以供以后使用。

    - 当下次浏览器向 Web 服务器发送任何请求时，会将这些 Cookie 信息发送给服务器，并使用这些信息来识别用户。


    # Cookie 的构造


    Cookie 通常设置在 HTTP 头部中（尽管 JavaScript 也可以直接在浏览器上设置 Cookie）。设置 Cookie 的 PHP 脚本可能会发送如下所示头部——


    HTTP 是一种用于分布式、协作和超媒体信息系统的应用程序协议。


    ```http

    HTTP/1.1 200 OK

    Date: Fri, 04 Feb 2000 21:03:38 GMT

    Server: Apache/1.3.9 (UNIX) PHP/4.0b3

    Set-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT; path=/; domain=tutorialspoint.com

    Connection: close

    Content-Type: text/html

    ```


    如所示，`Set-Cookie` 头部包含一个键值对、一个 GMT 日期、一个路径和一个域名。名称和值将经过 URL 编码。`expires` 字段是告诉浏览器在指定的日期时间后“忘记”该
    Cookie 的指令。


    如果浏览器配置为存储 Cookie，它将保留这些信息直到到期日。如果用户在任何匹配 Cookie 路径和域名的页面上提交数据，它将把 Cookie 重送给服务器。浏览器的头部可能看起来像：


