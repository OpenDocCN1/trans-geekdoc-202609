    The arithmetic operators require numeric values. And non-numeric values are converted
    automatically to numeric values. The following are the list of arithmetic operators:


    +   - Addition (+) returns the sum of two operands

    - Subtraction (-) returns the difference between two operands

    - Multiplication (*) return the product of two operands

    - Division (/) returns the quotient of two operands. The result of division of
    two integers may produce an integer (4/2 = 2) or a floating-point number (3/2
    = 1.5)

    - Modulus (%) returns the remainder of the division of the first operand by the
    second operand. Both operands are integers.


    The following example demonstrates PHP arithmetic operators:\<?php


    ```

    $x = 20;

    $y = 10;


    // add, subtract, and multiplication operators demo

