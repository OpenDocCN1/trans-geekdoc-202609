    \nLet's see an example:\n\n```php\n// sleep for 3 seconds (non-busy)\nsleep(3);\n\
    ```\n\n```php\n$data = getrusage();\necho \"User time: \".\n($data['ru_utime.tv_sec']\
    \ +\n$data['ru_utime.tv_use'] / 1000000);\necho \"System time: \".\n($data['ru_stime.tv_sec']\
    \ +\n$data['ru_stime.tv_use'] / 1000000);\n```\n\n```php\n/* prints\nUser time:\
    \ 0.011552\nSystem time: 0\n*/\n```\n\nEven though the script took about 3 seconds\
    \ to run, the CPU usage was very low. Because during the sleep operation, the\
    \ script actually does not consume CPU resources. There are many other tasks that\
    \ may take real time, but may not use CPU time, like waiting for disk operations.\
    \ So as you see, the CPU usage and the actual length of the runtime are not always\
    \ the same.\n\nHere is another example:\n```php\n// loop 10 million times (busy)\n\
    for(i=0;$i<10000000;$i++) {\n}\n```\n\n```php\n$data = getrusage();\necho \"User\
    \ time: \".\n($data['ru_utime.tv_sec'] +\n$data['ru_utime.tv_use'] / 1000000);\n\
    echo \"System time: \".\n($data['ru_stime.tv_sec'] +\n$data['ru_stime.tv_use']\
    \ / 1000000);\n```\n\n```php\n/* prints\nUser time: 1.4245992\nSystem time: 0.004204\n\
    */\n```\n\nThat took about 1.4 seconds of CPU time, almost all of which was user\
    \ time, since there were no system calls.\n\nSystem Time is the amount of time\
    \ the CPU spends performing system calls for the kernel on the program's behalf.\
    \ Here is an example of that:\n\n```php\n$start = microtime(true);\n// keep calling\
    \ microtime for about 3 seconds\nwhile(microtime(true) - $start < 3) {\n\n}\n\
    ```\n\n```php\n$data = getrusage();\necho \"User time: \" . \n($data['ru_utime.tv_sec']\
    \ + $data['ru_utime.tv_use'] / 1000000);\necho \"System time: \" . \n($data['ru_stime.tv_sec']\
    \ + $data['ru_stime.tv_use'] / 1000000);\n```\n\n```php\n/* prints\nUser time:\
    \ 1.08817\nSystem time: 1.67535\n*/\n```\n\nNow we quite a bit of system time\
    \ usage. This is because the script calls the microtime() function many times,\
    \ which performs request through the operating system to fetch the time. Also\
    \ you may notice the numbers do not quite add up to 3 seconds. This is because\
    \ there were probably other processes on the server as well, and the script was\
    \ not using 100% CPU for the whole\n\n## 3.3 SERIALIZATION\n\nHave you ever needed\
    \ to store a complex variable in a database or a text file? You do not have to\
    \ come up with a fancy solution to convert your arrays or objects into formatted\
    \ strings, as PHP already has functions for this purpose. There are two popular\
    \ methods of serializing. Here is an example that uses serialize() and unserialize():\n\
    \n```php\n// a complex array\n$myvar = array(\n  'hello',\n  42,\n  array('two'),\n\
    \  'apple'\n);\n\n// convert to a string\n$string = serialize($myvar);\n\necho\
    \ $string;\n/* prints\na:4:{i:0;s:5:\"hello\";i:1;i:42;i:2;a:1:{i:0;s:3:\"two\"\
    ;i:3;s:5:\"apple\";}}\n*/\n```\n\n```php\n// you can reproduce the original variable\n\
    $newvar = unserialize($string);\n\nprint_r($newvar);\n/* prints\nArray (\n   \
    \ [0] => hello\n    [1] => 42\n    [2] => Array (\n        [0] => 1\n        [1]\
    \ => two\n    )\n    [3] => apple\n)\n*/\n```\n\nThis was the native PHP method.\
    \ However, since JSON has become so popular in recent years, they decided to add\
    \ support for it in PHP 5.2. Now you can use the json_encode() and json_decode()\
    \ functions as well:\n\n```php\n// a complex array\n$myvar = array(\n  'hello',\n\
    \  42,\n  array('two'),\n  'apple'\n);\n\n// convert to a string\n$string = json_encode($myvar);\n\
    \necho $string;\n// prints [\"hello\",42:[\"two\"],\"apple\"]\n```\n\n```php\n\
    // you can reproduce the original variable\n$newvar = json_decode($string);\n\n\
    print_r($newvar);\n/* prints\nArray (\n    [0] => hello\n    [1] => 42\n    [2]\
    \ => Array (\n        [0] => 1\n        [1] => two\n    )\n    [3] => apple\n\
    )\n*/\n```\n\nJavaScript often abbreviated as JS, is a high-level, interpreted\
    \ programming language. It is more compact, and best of all, compatible with javascript\
    \ and many other languages. However, for complex objects, some information may\
    \ be lost.\n\n## ROLE MODEL: Andi Gutmans\n\nAndi Gutmans is an Israeli programmer\
