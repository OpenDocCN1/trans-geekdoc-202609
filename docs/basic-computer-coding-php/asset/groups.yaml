    native Unicode support.


    +   - A string is a data type used in programming, such as an integer and floating
    point unit, but is used to represent text rather than numbers. It is comprised
    of a set of characters that can also contain spaces and numbers.


    +   - A PHP string is a sequence of characters i.e. used to store and manipulate
    text. A string is a collection of characters. String is one of the data types
    supported by PHP. The string variables can contain alphanumeric characters.


    +   - The simplest way to specify a string is to enclose it in single quotes (the
    character ''). To specify a literal quote, escape it with a backslash (\). To
    specify a literal quote, double it (\").


    +   - The closing identifier must begin in the first column of the line. Also,
    the identifier must follow the same naming rules as any other label in PHP; it
    must contain only alphanumeric characters and underscores, and must start with
    a non-digit character or underscore.


    +   - Heredoc text behaves just like a double-quoted string, without the double
    quotes. This means that quotes in a heredoc do not need to be escaped, but the
    escape codes listed above can still be used.


    +   - Nowdocs are to single-quoted strings that heredocs are to double-quoted
    strings. A nowdoc is specified similarly to a heredoc, but no parsing is done
    inside a nowdoc. The construct is ideal for embedding PHP code or large blocks
    of text without the need for escaping.


    +   - Characters within strings may be accessed and modified by specifying the
    zero-based offset of the desired character after the string using array brackets,
    as in $str[42].


    +   - A boolean TRUE value is converted to the string “1”. Boolean FALSE is converted
    to “” (the empty string). This allows conversion back and forth between boolean
    and string values.'
