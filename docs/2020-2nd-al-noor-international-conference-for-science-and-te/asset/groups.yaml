    ## 3. 图像后处理


    在对图像分割后，我们需要通过一个名为“处理”的过程来为下一步配置数据。在所提的系统和该过程中，图像分割被转换为画布，以便从图像“1”中提取特征。


    灰度 $(L_j) = ((0.3 * R) + (0.59 * G) + (0.1 * B))$


    其中 R 代表红色，G 代表绿色，B 代表蓝色。


    图 2：目标斑点的图像分割


    ## C. 卷积神经网络算法


    卷积神经网络 (CNN) 是深度学习中最流行的方法之一，其中包含许多训练好的层。据观察，它非常有效，并在计算机视觉应用中用得最广泛。CNN 可以应用于处理图像输入的复杂函数，通过将其转换为输出类别进行分类。在这种方法中，有以下几个步骤：


    从受影响区域提取出表征受感染区域的不同特征。在这一步中，在将图像转换为灰度级后，从图中提取重要特征。最重要的特征是在对纹理进行特征的工作中提取的。我们使用了多种计算出的特征：标准差、偏度、熵、方差和均方根
    (RMS)。此外，还使用了灰度共生矩阵 (GLCM) 方法来提取其他其他重要特征。GLCM 纹理检测两个相邻像素之间的连接，并称为参考像素和相邻像素。所提取的特征是——


    ## 1. 图像预处理


    数据集中的图像被调整大小为 128 x 128 分辨率。因此，训练方式可以加快，模型测试可以真实地调整输入或目标变量来加速训练过程，同时保持图像的完整性不丢失。


    ![](img/c4cc9cbb83268831a893f2525307be8f_2_1.png)


    - 土豆叶片

