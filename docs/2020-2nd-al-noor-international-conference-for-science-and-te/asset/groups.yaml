    ## V. 结论


    对农业和生产危害最大的是。这激励我们使用基于计算机设施和技术的强大系统。该系统通过两种方法识别并检测叶片疾病：SVM 和卷积神经网络 (CNN)。从我们的
    CNN 在性能和准确率方面的比较结果来看，获得了 98.02% 的得分。在国际知名且重要的植物类别上准确率尚不足，包括番茄、土豆和辣椒。不同的学习率和优化器可以作为系统的一部分使用。


