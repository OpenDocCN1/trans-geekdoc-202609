    - 土豆早疫病

    - 辣椒叶霉病


    图 3：CNN 模型架构


    ## 2. 输入层


    输入层包含输入特征和像素值。


    ## 3. 卷积层


    CNN 在层中使用卷积核卷积将整个对象转换为我们优化的特征图，创建不同的特征图。在我们的研究中，我们使用了 4 个卷积层。每层都是 2D 的。我们使用了 10
    个高度和宽度均为 3 且带有 ''same'' 填充字符的过滤器。填充被添加到输入边缘。像素以相同的方式设置，使得输出尺寸与输入尺寸相同。在第二个卷积层中，我们有
    20 个高度和宽度均为 3 带有 ''same'' 填充字符的过滤器。第三层卷积层有 64 个高度和宽度均为 3 带有 ''same'' 填充字符的过滤器，在第四层卷积层中有
    30 个高度和宽度均为 3 带有 ''same'' 填充字符的过滤器，如图 3 所示。


    ## 4. 池化


    池化层紧随卷积层之后，用于减少特征图和网络参数。池化层在解释上也是不变的，类似于卷积层，因为它们的计算考虑了相邻像素。广泛使用的方法是平均池化和最大池化。在我们的研究中，我们使用最大池化
    (max-pooling)。


    卷积网络对输入应用非线性变换，以便稍后对特征进行分类。在 CNN 中我们使用线性整流单元 (ReLU)。整流单元通常用作非线性变换。这种层执行一种带有阈值的简单操作，任何小于
    0 的值被设置为 0。


