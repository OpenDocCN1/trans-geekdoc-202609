    mustafatayajar@gmail.com


    **摘要** 本文介绍了一种利用深度学习技术进行分类和检测的叶片疾病的系统。所提系统包含两种分类方法以及它们之间的比较：支持向量机（SVM）算法和多阶段分级分类。特别是，使用了特定类型的叶片，如番茄、辣椒，这些是世界上（尤其是伊拉克境内）常见的植物种类。第二种方法使用了卷积神经网络（CNN）进行分类。在这些方法中，使用了18个数据集，包括不同类型的植物，这些植物被分为三类叶片。比较结果显示，SVM算法在准确性方面更好，因此在植物叶片疾病的检测和分类中更有效、更准确。


    **关键词** 植物叶片疾病、K类聚类、SVM深度学习、CNN算法、修正线性单元（ReLU）。


    # I. 引言


    农业是文明的基石。目前的重点是提高生产率，而没有考虑到其导致的环境退化而产生的环境影响。植物疾病是能够显著影响农业发展过程中作物质量和数量许多重要因素。


    疾病包括真菌、细菌、病毒和霉菌。农民通常通过肉眼观察叶片来进行疾病识别和诊断 [1], [12]。然而，这种方法既耗时又昂贵，且不准确。其他人使用图像处理和深度学习方法，工作速度快且准确。叶片图像上植物症状的摄影照片用于植物疾病的检测以及研究、教学和分析
    [3]-[4]。利用计算机图像处理和深度学习进行植物叶片疾病检测 [5]-[6]；


    我们可以研究叶片图像，并根据颜色、纹理和其他特征从表示点获取斑点特征。通过关注受区域变化影响的区域 [7], [8]。研究人员证明图像识别技术和深度学习是有效的方法
    [9]。在过去的几年技术发展中，该领域的专家找到了用于此任务的最佳方法 [11], [12]。在植物系统的田野里，每年生长着大量的叶片。在这项工作中，我们提出了一个使用两种机器学习方法进行分类的系统。第一是支持向量机（SVM）方法
    [15]，它在分类过程之前包含几个步骤；第二种，我们使用了深度学习，即卷积神经网络（CNN）方法 [16]。我们将针对取自全球数据集（植物品种，Plant
    Variety，包含许多叶片）的相同数据，解释这些方法在准确性上的比较。我们的工作限制在世界范围内闻名的不同类型的植物上。


    本文的结构如下：第二部分反映了引言中完成的工作。第三部分阐明了实现预期结果步骤中使用方法和方法，第四部分涵盖了对建议方法的分析。第五部分提供了结论和未来的展望。


    # II. 相关工作


    本节描述了之前使用图像处理和深度学习检测植物疾病方面的工作。TM 等人 [17] 设计了一个系统，通过测量名为 LeNet 的卷积神经网络设计的细微差异来识别和分类叶片中的不同模式。这项工作的主要目标是发现一种在最小化计算资源的同时利用该方法检测番茄叶片疾病的解决方案。


    神经网络使用自动特征提取来将输入图像分为若干类项目。该系统的整体方法是通过考虑神经网络的变量来进行学习。Francis 和 C. Derry [18] 使用
    CNN 模型创建了一种深层学习方法。该系统由几个卷积层组成，随后是池化层。此外，全连接层以及 Sigmoid 函数也用于检测叶片是否患病。该方法使用一个包含
    500 张图像的数据集对番茄的健康和健康叶片进行了分类。准确率达到了 87%。Palma Rajan 等人在 [19] 中使用了一种通用方法。他们使用 CNN
    提取特征，使用人工神经网络（ANN）提取出的值来检测健康症状，ANN CNN 的性能准确率高出 80%。Sassivam, G.,


    # III. 所提技术


    在本节中，我们介绍一个识别植物叶片疾病的计算机系统。所提系统包含几个步骤，如图1 所示，显示了所提系统的主要结构。


    ![](img/c4cc9cbb83268831a893f2525307be8f_1_0.png)


    图 1 植物叶片疾病检测与分类的通用图


    植物叶片检测和分类系统将通过以下步骤解释。两种算法中的图像与数据相同。因此，算法之前的第一步是图像获取，将在下一节中进行说明。


    # A. 获取（数据集）


    植物叶片图像已从网站 (www.plantvillage.org) 的 (Plant Village) 库获取。收集的数据集包含 20636 张属于 15
    不同类的图像，如表 1 所示。该数据集包含了主要类型叶片的所有图像，这些是世界上最著名的植物之一，在伊拉克也是如此。（注：原文此段存在大量重复内容，此处已去重翻译）。


    # B. 支持向量机 (SVM)


    在该算法中，所提系统被分为几个步骤：1. 图像处理。预处理步骤用于使图像适用于后续处理。在此步骤中，我们将颜色空间从 RGB 转换为 LAB 空间。因为 L*a*b
    是三维空间，它只能在三维空间内被正确检测。为了区分背景和受影响区域，采用了图像分割。对于图像分割，使用了两种主要方法：基于聚类基于颜色。所提系统将使用 K-means
    聚类的聚类结果，根据一组属性识别对象。通过减少实体与相关组之间的距离平方来有效地分类。图 2 展示了我们对番茄感染叶片进行分割的示例。


    # C. 卷积神经网络 (CNN)


    在此部分，我们详细介绍了卷积神经网络（CNN）架构。CNN 能够自动从图像中学习特征，这比手动提取特征更有效。


