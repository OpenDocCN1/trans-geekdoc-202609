    # 4. Pooling


    A pooling layer follows a convolutional layer and can be used to deprecate the
    features map and parameters of network. Pooling layers are also invariant in interpretation,
    similar to convolutional layers, because their calculations take account neighbouring
    pixels. The widely used approaches are averaging pooling and max pooling. In our
    research, we use max-pooling.


    A non-linear transformation is applied to the input by the convolutional network,
    which is to classify the features within以后. In CNN we use Rectified units (ReLU).
    Rectified units are commonly used as non-linear transformation. This kind of layer
    executes a simple operation with a threshold where any value smaller than zero
    is set to zero.


