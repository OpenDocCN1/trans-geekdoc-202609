    # B. Support vector machine (SVM)


    In this algorithm, the proposed system is divided into several steps:

    1. Image-processing


    The pre-processing steps are used to give the image to make it suitable for further
    processing. At this step, we convert the colour space from RGB to the LAB space.
    Because the model L*a*b* is a three-dimensional space it can only be properly
    detected in three-dimensional space. To convert the LAB color space to distinguish
    the affected areas by the leaf of the plant and segment them with the next step,
    which is the segmentation images.


    # 2. Segmentation


    To distinguish the background and the affected area, the image segmentation is
    employed. For image segmentation, two primary methods are used: cluster-based
    and colour-based. The proposed system will use results from clustering using K-means
    clustering algorithm to identify objects on a set of attributes to K number of
    classes. Classification is performed by effectively reducing the sum of squares
    of distances between entities and the correlating group or colour research. In
    our research, the number of values of clusters has been chosen. In Fig. 2, an
    example from our work illustrates the segmentation of images of tomato infected
    leaf with the target-spot disease.'
