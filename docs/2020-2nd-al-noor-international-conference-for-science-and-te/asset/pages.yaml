    **Abstract** This paper presents a system used to classify and detect leaf diseases
    using deep learning techniques. The proposed system consists of two methods for
    classification and a comparison between them: Support Vector Machine (SVM) algorithm
    and several stages of staged classification. In particular, specific types of
    leaves are used, such as tomatoes, peppers, which are the common types of plants
    in the world and in Iraq particular. The second method used the Convolutional
    Neural network (CNN) for classification. In these methods, 18 datasets were used,
    including different types of plants that were classified into three classes of
    leaves. The result of the comparison shows that the SVM algorithm is better in
    terms of accuracy and thus more effective and accurate in the detection and classification
    of plant leaf diseases.


    **Keywords** Plant leaf disease, K-clustering, SVM deep learning, CNN algorithm,
    Rectified linear unit (ReLU).


    # I. INTRODUCTION


    Agriculture is most of all civilizations. The focus on improving productivity
    without taking considering the environmental effects that have appeared in the
    degeneration of environment. Plant diseases are many important factors that can
    significantly affect the quality and quantity of crops in the development of agriculture.


    The diseases include fungi, bacteria, viruses, and molds. Farmers typically recognize
    naked-eyed leaves for disease recognition and diagnosis [1],[12]. Nevertheless,
    this approach can be time-consuming, expensive, and inaccurate. Others using image
    processing and deep learning methods methods works quickly and accurately. Photographic
    photos of plant symptoms on leaf image are used for the detection of plant disease
    and for study, teaching, and analysis, [3]-[4]. Using computer image processing
    and deep learning for detection of plant leaf diseases [5]-[6];


    We can investigate the image of a leaf and obtain the spot features from a point
    of representation considering colour, texture, and other features. By focussing
    on the region affected by the variation in the area [7],[8]. Researchers demonstrate
    image recognition techniques and deep learning are effective methods [9]. Over
    few years, in the development of technologies, and experts in this field found
    an optimal method to be used for it [11],[12]. There are lot of leaves that are
    each growing year in fields of plant system. In this work, we propose a system


    that classifies using two methods of machine learning. The first is Support Vector
    Machine (SVM) method [15], which consists of several steps before the classification
    process, and for the second, we used deep learning, which is the Convolutional
    Neural Network (CNN) method [16]. We will explain the comparison between the methods
    in accuracy on the same data that was taken from a global data set, which is Plant
    Variety) includes a number of leaves. We will limit our work to different types
    of plants for their fame in the world.


    The paper is structured as follows: Section II reflects the work that has been
    done in the introduction. Section III clarifies the approach and the method used
    in the steps to achieve the desired results, and analysis of the suggested methods
    are covered by Section IV. Section V provides the conclusion and the scope for
    future.


    # II. RELATED WORK


    This section describes the previous work of detecting plant disease using image
    processing and deep learning. TM et al. [17], designed a system to identify and
    classify different patterns in leaves by measuring a slight difference in the
    convolutional neural network design called LeNet. The main objective of this work
    was to discover a solution to the detection of tomato leaf disease using the method
    while minimizing computational resources.


    Neural networks use an automated extraction of features to differentiate the input
    image into several classes of items. This system has an overall approach of learning
    by considering the variables of the neural network. Francis, and C. Derry, [18],
    they created a deep learning method using the CNN model. This system consists
    of several convolutional layers followed by pooling layer. Also, the fully connected
    layers and also the sigmoid function used for detecting the leaf of disease or
    not. This method classified the leaf, and healthy leaves of tomato using a dataset
    with 500 images. The accuracy reached 87%. Palma Rajan, et al. used a general
    method in [19]. They used the CNN to extract features, values were extracted by
    an artificial neural network (ANN) was used to detect symptoms that were healthy
    and the performance of the ANN CNN was 80% better accuracy. Sassivam, G.,'
