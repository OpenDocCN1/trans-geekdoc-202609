    # I. INTRODUCTION


    With the rapid development of information and communication technology, the power
    system has achieved automated management, and many distributed management and
    control system brings which a great benefit for the real-time monitoring and of
    operation of unit in the power system.


    As an important subset of the power system, power generation system is responsible
    for managing and controlling electrical power generation equipment, such as the
    generators. With the rapid development, the economic demand of varies increasing
    every year. In order to meet the demand for electricity generation to increase
    the number of generator units. However, the more number of generator units, the
    more complex the coordination between equipment will be. Therefore, the frequency
    of fault and the number of components will increase correspondingly. If there
    is a fault, it will cause severe consequences, for example, the unit will be out
    for a long time, and personal safety will be threatened. These time-consuming
    maintenance, and the cost of maintenance and rest of the unit also affects the
    economic benefits of power generation. Therefore, it very important to improve
    the reliable and safe operation power generation equipment.


    As the main power equipment, and safe reliable operation of the generators is
    closely related to the.


    In this paper, we focus on the fault prediction of generators in power system,
    and introduce deep learning methods. Our method includes two: the first is a Partial
    Least Squares (PLS)-based pre-process module which is used to reduce the dimension,
    the second is a deep linear regression model which is dedicated to the extracted
    data to predict the fault behavior of generators. The PLS method not only reduce
    the dimensions and explain the variables, but also retain the information in the
    original knowledge system and eliminate the noise interference. The knowledge
    of de linear regression is that it can well fit the distribution relation in the
    original system, get the global optimal, and learn the mapping relationship with
    generalization performance. reducing dimension and complexity can improve the
    efficiency of data processing and shorten the processing time of the model, while
    the prediction error can be reduced by the deep linear regression model, which
    results have a good quality alignment. The combination of two can fulfill the
    requirements of real-time and accuracy, and has a practical value for equipment
    diagnosis.


