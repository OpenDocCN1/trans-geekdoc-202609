    最常见的故障是发动机轴承温度高和发动机轴承水平振动。因此，我们将发动机轴承的温度和振动作为参数，通过偏最小二乘法（PLS）对包含22个不同特征的维度进行降维，提取能够携带数据大部分信息的主成分，并预测因变量。该过程如图1所示。


    提取输入数据的深度特征并改进网络模型的拟合。分类全连接网络的最后一层输出维度为1，分别为发动机轴承的水平振动和轴向振动。


    对于第一个案例，我们的数据为 $X = (x1,...,xn)$，其中 $n$ 是降维后特征参数的数量。映射函数为 $Y = (y1,y2)$，其中 $Y$
    是深度学习监督的地面标签，$y1$ 是水平振动，$y2$ 是轴向振动。我们的模型可以看作一个学习回归模型，其拟合输入数据和真值的映射函数为：


    $$\hat{Y}(X) = \omega_1x_1 + \omega_2x_2 + ... + \omega_nx_n + b$$ (2)


    其中 $[\omega_1,...,\omega_n]$ 是模型学习到的参数，$b$ 是偏置。$\hat{Y} = (\hat{y}_1,\hat{y}_2)$
    是预测值。我们定义输出如下：其中损失为预测输出与真值 $Y$ 之间的平方。通过使用随机梯度下降（SGD）算法优化此损失，使我们的模型能够学习输入与输出之间的数据分布关系。


    $$Prediction Error = \frac{1}{m} \sum_{i=1}^{m}(\hat{Y}_i - Y_i)^2$$ (3)


    在测试阶段，我们的深度线性回归模型直接输出测试数据的预测结果。为了评估回归性能，我们定义预测误差指标为：其中 $m$ 是样本数量。我们用此来评估我们方法的性能，并与其他方法进行比较。


    ## 深度线性回归模型


    基于从上述 PLS 处理中提取的原理，我们设计了深度线性回归模型来学习原始知识系统中的数据分布并泛化目标行为。如图1第二部分所示，我们的深度回归模型由8层全连接网络组成。前7层逐渐增加后减少，通过扩展和压缩过程可以提取。


    ## 表 II. 我们的方法与其他方法的测试预测误差对比


    | | 我们的方法 (PLS-DLR) | PCA+DLR | PLS+SVM | PCA+SVM |

