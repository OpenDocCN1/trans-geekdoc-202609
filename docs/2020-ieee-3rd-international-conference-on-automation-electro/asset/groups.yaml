    ## IV. 结果


    我们在几个章节中展示结果，包括 PL 降维结果、深度线性回归模型的预测误差，以及我们的方法与其他方法的比较。首先，我们移除发动机轴承温度、水平振动和轴向振动数据，然后对表I进行
    PLS 分析，以从贡献率角度获得影响发电机的剩余特征。将这些特征参数作为自变量，正常状态设为0，并根据成分的累积贡献率确定主成分，通常只需满足大多数自变量输入（如75%和80%）的预期。数据分析表明，前6个成分的贡献率可以达到发动机的78.2173%和因变量的82.3538%。第7个成分的贡献率与最小值值相比差异不大。因此，可以选择前6个自变量作为主成分。

    2) 降维误差测试预测。我们的深度线性回归模型以数据降维后的前6个主成分作为输入，并预测我们选择的发动机轴承温度、水平振动和轴向振动。


    ## V. 结论


    在本文中，引入了深度学习算法来处理发电机的故障，并评估了故障预测应用中误差数据的可行性。我们的方法包含两个部分：第一部分用于降维的深度最小二乘模块，第二部分用于压缩运行数据并预测电机故障行为的深度回归模型。结果显示，我们的方法在压缩和扩展数据的同时保留了原始知识系统的信息并消除了噪声干扰。深度回归模型可以获得全局最优，并学习具有良好泛化性能的映射。通过降低维度复杂度可以提高模型的准确性。


