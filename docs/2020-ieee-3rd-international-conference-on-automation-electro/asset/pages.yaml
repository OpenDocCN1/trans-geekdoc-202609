- pgno: 3
  md: '# V. CONCLUSION


    In this paper, we introduce the deep learning algorithm to handle the fault of
    power generators, and evaluate the feasibility and generator of error data in
    fault prediction application. Our method includes two parts: the first is a Deep
    Least Squares module used to reduce the dimension, and the second is a deep regression
    model which is decompress the operating data and predicting the fault behavior
    of generators. The results show that our method reduces and expands the data but
    also retain the information in the original knowledge system and eliminate the
    noise interference. The deep regression model can get the global optimum, and
    learn the mapping with good generalization performance. By reducing dimension
    and complexity can improve the accuracy and processing time of the model, while
    the generalization error rate can be further reduced by the deep regression model,
    which has a high learning ability, and accuracy. Experimental results demonstrate
    that our method can meet the requirements of real-accuracy, and has a certain
    practical value for equipment fault prediction.


