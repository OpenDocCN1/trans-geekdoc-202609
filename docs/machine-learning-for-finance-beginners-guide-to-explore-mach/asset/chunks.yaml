    前三个步骤通常需要重复，因为你很可能在第一次尝试时无法为你的项目构建最优模型。因此，你将构建多个模型，然后选择在测试数据集（即未见过的数据）上表现最好的那一个。


    此外，建模过程中的测试步骤并不总是执行的，因为在某些情况下，数据科学项目的目标是根因分析（基本上是解释）而不是预测。例如，你的项目目标可能是确定某些物种走向灭绝的原因（解释），而不是预测哪种物种最有可能灭绝（预测）。


    机器学习中另一个常用的技巧是链式调用（chaining）。链式调用的原理是：当多个模型链联在一起时，一个模型的输出将作为另一个模型的输入，以此此类推。在将不同的模型链联在一起时，每个模型都需要独立于其他模型进行训练，只有在它们得到结果后才将它们组合到一起。在机器学习的术语中，这种技术被称为集成学习（ensemble
    learning）。


    # 特征工程与模型选择


    在特征工程中，你基本上为数据模型创建可行的预测因子。这是建模过程中的第一步也是最关键的步骤之一，因为模型将通过组合这些特征来给出预测，而预测的准确性取决于预测因子的优劣。在这一步，建议咨询机器学习专家，因为初学者很难创建出良好的预测因子。


    在教科书的练习中，提供的数据集已经包含了一些特征作为变量；但在实践中，你必须自己从不同的数据集中寻找特征。你甚至会发现，这些特征通常分散在几个不同的数据集之间。例如，在我们其中一个数据科学项目中，我们必须采购总共
    20 个数据集，之后我们才获得了所需的原始数据。这是一个非常详细的话题，仅触及特征工程的表面将没有任何帮助。因此，建议你咨询机器学习专家或专门的人员。

