  trans: '


    最简单的方法是线性回归，其数学方程的形式为 `Y = m * X + b`。多个数据对 `(X, Y)` 可以通过计算直线的位置和斜率来训练一个`线性回归模型`，以减少数据点与直线之间的总距离。换句话说，计算“斜率
    (m)”和“y 截距 (b)”是为了找到一条对数据观测值提供最高近似值的直线。数据关系可以使用“线性预测函数”进行建模，根据这些数据估算未识别的模型变量，这些系统被称为线性模型。传统上，如果解释变量或预测变量的值已知，则将响应的条件均值作为这些值的亲和函数。在线性模型中，条件媒介和其他措施的使用非常罕见。与任何其他形式的“回归分析”类似，“线性回归”在响应的“条件概率分布”上运行良好，而不是通过多变量分析获得的变量联合概率分布。


    线性回归是研究最彻底、应用最广泛的回归分析形式。这是因为与与其参数非线性相关的模型相比，线性依赖于其未识别参数的模型更容易处理。换句话说，通过线性分布可以很容易确定结果预测变量的统计特征。线性回归有很多实用的应用：


    *   如果目标是生成预测和估计或减少误差，可以使用线性回归算法将预测模型与已识别的数据集和解释变量连接。一旦模型开发完成，就可以适当的模型轻松预测新的无响应输入数据。

    *   线性回归分析可以专门用于量化预测变量与响应之间的关系，评估某些解释变量是否与响应缺乏线性关系。它还可以用于识别跨越响应值包含数据冗余的预测变量子集。


    大多数线性回归模型的实现是通过使用最小二乘法完成的。然而，该模型也可以通过显著减少另一种标准中的拟合不足（例如最小绝对偏差回归），或通过使用“如岭回归中那样的对最小平方进行惩罚的版本来完成拟合（`minimize
    (L2 标准惩罚)` 和 lasso 回归（L1 标准惩罚））”。相比之下，可以使用最小二乘法来拟合非线性的机器学习模型。因此，尽管“最小二乘”和“线性模型”术语密切相关，但它们并不是一回事。


    多元线性回归通常是数据科学和大多数统计任务中最常用的回归技术。与线性回归技术一样，多元线性回归中也会有一个输出变量 `Y`。然而，现在的区别在于我们将有许多
    `X` 值或独立变量，用于为 `Y` 生成预测。


    例如，一个用于预测华盛顿特特区住房成本的模型将由多元线性回归技术驱动。华盛顿特特区的住房成本是模型的 `Y` 或因变量。该模型的 `X` 或独立变量包括诸如离公共交通的远近、培训学区、平方米和单间等数据点，这些因素将最终决定房屋的市场价格。


    该模型的数学方程可以写如下：


    ```

    Housing_price = β0 + β1 sq_foot + β2 dist_transport + β3 num_rooms

    ```


    我们在最后两种回归技术中的模型开发出了一条直线。这条直线是 `X` 和 `Y` 之间连接的结果，它是线性的，且 `X` 对 `Y` 的影响不随 `X` 的值而变化。在项式回归的情况下，我们的模型显示出曲线。


    如果我们尝试使用线性回归拟合具有非线性特征的图表，将无法产生最佳拟合。例如，在下面的图中，左侧的图是一个显示上升趋势的散点图，但带有曲线。在这种情况下，直线不起作用。相反，我们使用项式回归生成一条与我们数据中的曲线相对应的曲线，如底图中右侧的图所示。项式回归的方程将与线性回归相同，只是一个或多个
    `X` 变量将与多项式表达式相关。


    ```

    Y = mX2 + b

    ```


    ![](img/18.1.jpg)


    **图 18.1**


    数据研究人员另一个重要的回归技术是支持向量回归，它最常用于案例分类。这里的概念是在空间中发现一条线，将数据点划分为不同的类别。它也用于回归分析。它是一种与概率无关的二分类技术形式。


    岭回归广泛用于分析多共线性数据集。根据数据集的特征，正确使用因加加模型回归可以减少标准误差并显著提高模型准确性。如果你的数据包含高度相关的独立变量，岭回归可能会很有用。如果你可以使用另一个独立变量预测一个独立变量，你的模型将具有高多共线性风险。例如，如果你使用测量人身高体重的变量，模型中的这些变量可能会产生多共线性。


    多共线性可能会影响模型生成的预测准确性。考虑模型中使用的预测变量类型，以避免由你使用的数据类型以及数据收集方法引起的多共线性。另一个原因可能是选择了种类较少的独立变量，或者选择了有限数量的独立变量，导致了非常相似的数据点。


    多共线性也由模型类型引起。注意，模型中的变量比数据点多。如果你选择使用线性模型（这会加剧模型的多共线性），你可以尝试实现岭回归。岭回归通过允许模型中存在轻微偏差来使预测更准确。这种技术也称为“正则化”。


    提高模型准确性的另一种技术是对独立变量进行标准化。此此最简单的方法是通过将某些独立变量的值置为空来降低复杂度。这种方法不仅是让这些独立变量变为零，而是实现一种奖励接近零的值的结构。这将减少系数，从而减少模型的复杂度，但模型将保留其所有的独立变量。这将赋予模型更多的偏差，以换取更准确的预测。


    另一种缩减技术被称为 LASSO（最小绝对收缩和选择算子）回归。作为一种高度互补的回归，lasso 回归促进使用更、更精炼的模型来生成预测。在 lasso
    回归中，模型降低接近零的系数值。散点图上的数据（例如数据的平均值或中位数）被降低到更紧凑的水平。当与岭回归模型相比，模型存在多共线性时，我们使用它。


    '
