- raw: 'NLP models provide unlimited advantages. The models provide the capability
    to improve the efficiency and accuracy of a document, along with the opportunity
    to create a readable text summary. Moreover, this approach is the main driving
    force behind personal assistants like Alexa and Siri, through which users can
    perform multiple tasks with ease. NLP provides long-term benefits to companies
    as they can communicate with their clients effectively and solve queries in real
    time through chatbots.


    Conferring to industry figures, about 21% of the accessible data is in a structured
    form. Data is created as we express, as we tweet, as we send messages to WhatsApp,
    and other activities. Most of this data is in a word-based form, which is extremely
    unstructured in nature. NLP helps in extracting valuable data from such a format
    of data.


    Few noteworthy examples include social media tweets and posts, user-to-user messages,
    articles, blogs, news, product or service reports, and patient information in
    the health-care field. Others include chatbots and other voice-driven bots.


    # [Data handling in NLP](#toc.xhtml#s52a)


    NLP systems are designed to understand conversations of different styles and languages.
    Data that is generated from declarations or conversations are a part of unstructured
    data. As compared to structured data, machine learning models find it difficult
    to comprehend unstructured data because there are no predefined relationships
    and labels. NLP is a field of AI that enables automated machines to learn, understand,
    and derive accurate meaning from human languages. This is only possible if the
    models are trained with labeled data so that they can easily comprehend multiple
    languages with a high accuracy rate.


    # [NLP applications](#toc.xhtml#s53a)


    NLP is one of the hottest subjects in the world of computer science. Companies
    in finance, supply chain, marketing, and logistics domain are pouring lots of
    capital into this area of science. All are seeking to understand NLP and its implications
    for a career around it. Every company out there seems to want to somehow incorporate
    it into their company.


    # [Talent recruitment](#toc.xhtml#s54a)


    Human resource departments in various companies use NLP models to review resumes
    and conduct candidate interviews. In the search and selection process of talent
    recruitment, interviewers are able to identify the skills and abilities of potential
    hires and also review the latest trends in the job market.


    # [Voice assistants](#toc.xhtml#s55a)


    NLP tools such as Siri and Alexa work with AI models to respond to vocal prompts.
    Particularly, NLP models can do anything from finding a specific shop to scheduling
    an appointment for a given date. Voice assistants learn through structured data
    and need a lot of training data to develop an understanding of each language.


    # [Health care](#toc.xhtml#s56a)


    Health-care and medical departments have had great breakthroughs thanks to the
    artificial intelligence and machine learning technologies. With the help of NLP
    tools, doctors and health specialists can explore more health conditions.


    # [Survey analysis](#toc.xhtml#s57a)


    Surveys are an effective way to measure the success of an organization. Companies
    are running a variety of surveys to get inputs from consumers on different items.
    NLP can be very helpful in identifying the weaknesses and encouraging businesses
    to develop their goods.


    # [Grammar checkers](#toc.xhtml#s58a)


    This is one amongst the most widely used applications of linguistic communication
    processing. Grammar checking tools like Grammarly provide plenty of features that
    help people write better content. NLP will change any ordinary piece of text into
    beautiful literature. If you would like to jot down an email to your boss, or
    if you’re writing a report, there’s no denying the fact that you simply need these
    helpful friends.


    # [Email filtering](#toc.xhtml#s59a)


    I am sure you have already noticed that every email you get gets classified into
    spam and inbox. Isn’t it amazing?


    Emails are sorted using a NLP technique. Yes, as you may have guessed, text Classification
    is the method of classifying a piece of text into predefined groups.


    Another excellent example of text sorting is the grouping of news stories into
    separate groups.


    # [Social media monitoring](#toc.xhtml#s60a)


    Today, NLP is being used by businesses to evaluate social media content and to
    know what consumers think of their goods. Companies often use social media analysis
    to consider the challenges and difficulties that their consumers face when purchasing
    their goods. Not only businesses but also governments use it to detect possible
    threats to the security of the country.


    # [Online search autocomplete and autocorrect](#toc.xhtml#s61a)


    NLP is something everybody uses every day, but they never pay any attention to
    it. Autocomplete and autocorrect both allow us to find reliable answers very quickly,
    and they are a perfect example of how NLP impacts millions of people around the
    world, including you and me. Several other businesses have since begun using this
    feature on their websites, such as Facebook.


    # [Conclusion](#toc.xhtml#s62a)


    In this chapter, we discussed NLP as a vital tool for converting or translating
    large amount of information into data that humans can comprehend. We also discussed
    NLP application in recruitment, voice assistance, health care, survey analysis,
    grammar check, email filtering, social media monitoring, and online search.


    In the next chapter, we will be learning computer vision.


    # [CHAPTER 5](#toc.xhtml#c05)


    # [Computer Vision](#toc.xhtml#c05)


    # [Introduction](#toc.xhtml#s63a)


    Computer vision is one of the most modern fields of study in data science. It
    has also been part of our lives. We all use a range of features that have machine
    vision strategies working on the backend. For example, we use it for face unlock
    on our smartphones.


    Computer vision is a division of artificial intelligence that aims to emulate
    the strong capabilities of human vision. Computer vision operates through visual
    recognition strategies such as image processing, optical character recognition,
    image captioning, object tracking, image segmentation, and object identification.


    # [Structure](#toc.xhtml#s64a)


    In this chapter, we will cover the following topics:


    *   Computer vision application.


    *   Neural networks in computer vision.


    *   Overview of computer vision.


    *   Image recognition.


    *   Biometric recognition.


    *   Software vulnerabilities.


    # [Objective](#toc.xhtml#s65a)


    After studying this chapter, you should be able to do the following:


    *   Understand the application of computer vision.


    *   Understand the architecture of convolutional neural networks (CNNS) used for
    computer vision.


    # [Computer vision application](#toc.xhtml#s66a)


    We already know that human vision sense is incredibly advanced. As soon as you
    open your eyes, you see every detail and object around you within a fraction of
    a second. We can instantly detect and identify objects in our field of view unconsciously
    without any hesitation or previous thought.


    We are also able to name every object that is around us, as well as perceive the
    depth of these objects with great accuracy, and we can perfectly distinguish objects’
    contours and detect and identify various objects in the background. Our eyes take
    in some raw voxels of various color data, and our brain transforms this data into
    some relevant and meaningful information. So, color information will be perceived
    as different lines, shapes, curves, etc., which may indicate what we are looking
    at, like objects, people, building, etc.'
