    # [Technology and finance](#toc.xhtml#s128a)


    Finance has always been a field at the forefront of technology. That’s because
    that’s where the edge is—that’s where the money is.


    If you are going to allocate technology to industries with high degrees of ROI,
    finance would be the right place, because the business of money is at the position
    of fulcrum when it comes to monetizing information.


    Of course, I’m not talking about material nonpublic information or anything like
    that. I''’ talking about performing market analysis, identifying data relationships,
    exploiting correlations, and using technology to build a better mousetrap. Because
    a little edge can turn into a lot of money when the business of finance is involved.


    This is why technologies that we will see in the future of finance are already
    here. Many of them are accelerating the pace and ease of transactions, reducing
    costs, and increasing access.


    Overall, the main takeaway for the future of finance is that any new innovations
    are likely to be adopted more rapidly by finance than by almost any other industry.
    Because something that works is likely to generate big financial returns. Further,
    even though the trends of the next decade and beyond have already been set in
    motion for the future of finance, there are likely to be new innovations that
    pop up. And finance is likely to take up the mantle quickly.


    It was a lesson that banks had to learn this cycle.


    FinTech is the digital barbarian at the gates, threatening to erode margin, and
    the banks and traditional financial services firms are finally onboard and pushing
    innovation forward. This is why many of the big banks started technology accelerators
    and incubators several years ago. After all, FinTech solutions pose a threat to
    traditional financial services. And if FinTech was going to eat financial services’
    lunch, then financial services might as well be pushing FinTech forward. As the
    saying goes, if you aren’t at the table, you’re on the menu.


    This means that the future of finance is likely to continue to involve traditional
    financial services firms using their accelerators and incubators to foster innovation.
    And it means that there is no going back. The future of finance is FinTech in
    all of its permutations, and it is driven by three critical levers.


    # [Automation](#toc.xhtml#s129a)


    Yes, the robots are coming for low-skill, low-income, and low-education jobs.
    But they are coming for other jobs too. I learned several years ago that they
    are coming for mine. And if you work in finance, they may be coming for your job
    too.


