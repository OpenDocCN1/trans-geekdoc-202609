- raw: 'One of the troubles with FinTech is that the app needs to function in a way
    that verifies the identity of the operator. Otherwise, how can people trust in
    the veracity of the service they are operating if they cannot be sure they are
    exchanging money with legitimate individuals who have solid credit backgrounds?
    This principle is called “know your customer (KYC).” The problem with the KYC
    approach is that it takes a lot of effort to correctly determine a person’s identity
    electronically.


    Here are some tips for simplifying the overwhelming task of getting to know your
    customers:


    *   **Don’t ask for all the information at once:** This is time-consuming, and
    people will be suspicious of your service if you go for it all at once. The best
    way to collect customer information is to start with the bare minimum and then
    allowing them to complete the first transaction. After trust in your service has
    been established, you are free to get the rest of the necessary information.


    *   **Make it easy:** Of course, you could ask your customers to scan and upload
    copies of their identity documents, but that is a huge hassle for them. Partnering
    with other identity servicing companies to gather this information reduces the
    burden on your customers. Using the information they have provided, these services
    will attempt to match photos from their database. In the event that this fails
    to work out, you can always ask the customer for a scan.


    *   **Give them reasons:** People are naturally skeptical about offering up personal
    information, especially when it seems hard to understand what their gender could
    possibly have to do with their finances. This is why it is best to always explain
    why you are asking for certain information. These exchanges have to be based on
    trust, and the best practice for establishing trust is transparency.


    *   **But don’t make it too easy:** Even Venmo has come under fire for their security
    failures. These technologies have to be simple to interact with, but not so simple
    that they can be easily hacked. Customers have to feel safe using your app, which
    is why simple features such a security pins are essential. This is where FinTech
    user experience differs from that of other applications. Unlike photo-sharing
    apps, messaging, etc., there is an element of security in the design that must
    be present, which is not required for other platforms.


    # [Innovative technologies](#toc.xhtml#s134a)


    While the whole world was focused on the Internet, mobiles, social media, and
    the rise of FinTech, new innovations have shaken up the entire banking industry
    one more time. While in 1970 to 1990 there was a big debate whether computers
    and the Internet shall make manual workers obsolete, now there is a larger debate
    whether robots will make Internet workers and manual workers obsolete? Debates
    are endless and they shall continue, but let us study the best breed of new technologies
    such as AI, machine learning, Blockchain, and big data in this chapter.


    # [AI/robotics including chatbot](#toc.xhtml#s135a)


    Let us now focus on the use of new innovations such as AI/robotics and chatbot
    in banking. Many times, banks struggle to identify a genuine customer because
    of the huge amount of data at their disposal. In such cases, AI is very useful.
    For example, previously robots could answer questions such as “What is my current
    balance in the account?” “When will the check book be delivered to me?” “What
    is the status of my fund transfer request?” However, new-age robots are becoming
    more analytical, and can now answer questions like “What is the 360° view of all
    my family accounts?” “How is my investment pattern?” “Where should I invest now?”


    # [Cognitive computing](#toc.xhtml#s136a)


    Cognitive computing systems are designed to solve problems the way humans do.
    So how is this different from AI? In cognitive computing, the system provides
    information to help the expert decide, whereas, in AI, the system guides the expert
    on the best course of action to be taken.


    # [Blockchain in the banking industry](#toc.xhtml#s137a)


    Nowadays, we hear a lot about the Blockchain concept using cryptography technology.
    What is Blockchain? In simple words, it can be explained as data entry done in
    multiple databases at the same time. For example, when a seller raises an invoice
    on a buyer, that invoice data can be stored in the database of the buyer, seller,
    buyer’s bank, seller''s bank, and any related government agencies, and all of
    this can be done in milliseconds. Moreover, this transaction is safe, transparent,
    and can be encrypted, so that no third party can intercept it. In banking, this
    can be very well used for various trade finance transactions, especially when
    there are multiple parties involved at the same time, and it brings in more trust
    and transparency among the multiple stakeholders.


    # [What is Blockchain?](#toc.xhtml#s138a)


    Blockchain is a new technology where a digitized, decentralized, public ledger
    of all transactions is maintained using cryptography. Each node (a computer connected
    to the network) gets a copy of the blockchain, which is downloaded automatically.


    Too difficult to absorb? Ok, let’s make our life simpler and consider a case study
    of a typical international buying-selling (called trade finance) transaction involving
    multiple parties or stakeholders:


    *   Seller (exporter, call him/her X).


    *   Buyer (importer, call him/her Y).


    *   Seller’s bank.


    *   Buyer’s bank.


    *   Central bank of exporter’s country (e.g., Reserve Bank or Federal Bank).


    *   Central bank of importer’s country (e.g., Reserve Bank or Federal Bank).


    *   SWIFT (Society for Worldwide Interbank Financial Telecommunication), which
    records every international banking transaction.


    Assuming an invoice has been raised by X on Y of US$100,000. Assume that a copy
    of the invoice should be available with different parties. Can you imagine online
    entry of US$100,000 in the books or computerized systems of seven different stakeholders
    from different countries at the same time by a computerized system? Can a standard
    computerized program and infrastructure pull this off? Absolutely not. Even if
    we use Internet-based e-commerce, this may not be easily possible. But the Blockchain
    technology makes it possible.


    And the advantages are huge:


    *   Extremely safe.


    *   Transparent.


    *   Trustworthy.


    *   Very easy record maintenance.


    *   Low cost of maintenance.


    *   No intermediaries necessary in the whole operation as parties directly communicate
    with each other.


    In fact, recently there was a huge banking fraud in India by a famous diamond
    exporter, Nirav Modi, and many finance experts feel that the fraud could have
    been avoided simply if Blockchain had been used. Many leading institutions and
    banks have started experimenting with Blockchain in their operation. For example,
    Australia’s stock exchange will replace its registry, settlement, and clearing
    system with Blockchain technology to cut costs for customers.


    Cryptography was used in Bitcoin when the new virtual currency was created. Bitcoin
    has got good as well as a bad name in the international market, but people are
    amazed by the Blockchain technology used in Bitcoin. Therefore, the world may
    see huge investments in Blockchain technology in near future, if not in Bitcoin.


    # [First blockchain user in the world: Australian Securities Exchange](#toc.xhtml#s139a)


    To give some different industry examples of Blockchain, Australian Securities
    Exchange (called ASX) has become the first major stock exchange to announce the
    adoption of Blockchain technology for its stock settlement activity. ASX will
    use cryptography to record shareholdings and manage the clearing and settlement
    of equity transactions. This will enable huge savings to the cost of operations,
    bring more transparency, and reduce the need for intermediaries.


    # [Internet of things (IoT) in banking](#toc.xhtml#s140a)'
