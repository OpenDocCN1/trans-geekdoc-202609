    # [Naive Bayes](#toc.xhtml#s23a)


    Naive Bayes is based on Bayes’ rule. This classification approach assumes that
    different predictors are independent of each other, and that one feature has no
    relation at all with any other features present.


    You may call a fruit an orange, for example, because of its orange color, round
    shape, and the texture of its skin. But this doesn’t mean that the color, shape,
    and texture rely on each other to prove that the fruit being observed is an orange.


    This model is exceptionally helpful if you have huge data sets to deal with. In
    fact, it has been proven to be the most efficient method when it comes to data
    classification.


    # [Bayesian classification](#toc.xhtml#s24a)


    Bayesian classification depends on the concept of conditional probability. Given
    that one condition is true, what is the probability that a second condition is
    also true? Think about this in the context of weather forecast. If you know that
    skies are overcast today, what is the probability of rain? If you know the skies
    are clear today, what is the probability of rain? It shouldn’t be too hard to
    understand why the probability in the first case will be much higher than that
    in the second case.'
