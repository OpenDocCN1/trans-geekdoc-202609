  trans: '


    第一次听到“FinTech”（金融科技）这个词，是在 2016 年 5 月我在阿梅利亚岛参加的亚特兰大联邦储备银行金融市场会议上。在我参加过的九次年度会议上，大约有
    150 位世界顶尖经济学家受邀加入地区联储银行行长、政府监管机构、学者，通常还有联邦储备委员会主席，共同讨论当天最热门的经济、货币政策和财政政策问题。


    在这场盛大会议的背景下，我与一位相识多年的联储记者翘掉了几场会议，去享受 5 月初佛罗里达的美好天气。我的朋友和另一位专攻金融科技的记者在一起。当时，我还没有听说过
    FinTech。于是我天真地问：“那是什么？”记者告诉我，FinTech“就像比特币之类的东西”。我知道比特币是一种数字货币，于是就结束了。


    我并没有太在意这段对话，直到几个月后，当我试图为“Prestige Economics”招聘一名销售人员时。我很难找到候选人。高素质的人才正大量离开这个领域，我并不知道为什么。最后，一位高级销售人员告诉我，因为金融科技，所有人都在退出金融市场研究。本质上，机器人正在颠覆研究业务。在得知
    FinTech 正在颠覆自己的业务后，我决定通过麻省理工学院的 FinTech 课程来尽可能多了解它。简而言之，机器人已经向我袭来，而我竟然还不知道。


    # FinTech：金融领域的机器人末日


    FinTech 是金融科技的流行术语，它代表了一系列旨在颠覆（并抢夺）传统金融机构市场份额的业务。金融科技公司通常为此前属于银行领域的交易降低成本、降低复杂性或提高易用性。


    FinTech 正影响着金融服务，而且这种意识正在不断传播。资产管理长期一直由计算机、统计分析和编程主导。而 FinTech 正在颠覆资产管理，通常是通过被动交易策略实现的。其中一些策略由于其自动化（即机器人化）的特性被称为机器人投顾（robo-advising）。结果是什么？资产经理正在失去工作，资产管理的颠覆潜力非常高。


    在电影《华尔街》中，戈登·格雷柯（Gordon Gekko）问巴德·福克斯（Bud Fox）：“有没有想过为什么基金经理无法赢过标普 500 指数？”好吧，随着交易型基金（ETFs）的出现，基金经理和零售可以直接购买标普指数（以及其他指数），这正是他们所做的。其中许多
    ETF 具有很高的流动性。


    FinTech 对金融建议的影响所示：


    ![](img/9.1.jpg)


    **图 9.1**


    被动资产管理技术和机器人投顾的执行通常比主动资产管理更简单、成本也更低。这些策略的实施成本远低于主动资产管理策略，因为它们不再需要人工资产经理。此外，当计算机程序承担了所有的策略工作、分析、规划，以及所有证券的买卖时，就会产生规模效应。被动资产管理也被金融和交易领域采用，因为这些领域在历史上一直拥抱技术，许多公司多年来一直使用箱模型、算法和技术交易策略。


    FinTech 的影响所示：


    ![](img/9.2.jpg)


    **图 9.2**


    被动资产管理技术和机器人投顾的执行通常比主动资产管理更简单、成本也更低。这些策略的实施成本远低于主动资产管理策略，因为它们不再需要人工资产经理。此外，当计算机程序承担了所有的策略工作、分析、规划，以及所有证券的买卖时，就会产生规模效应。被动资产管理也被金融和交易领域采用，因为这些领域在历史上一直拥抱技术，许多公司多年来一直使用箱模型、算法和技术交易策略。


    # FinTech 的影响


    根据普华道（PwC）的全球报告，FinTech 最强大的武器是服务的去中间化。以前，即使将信用评分从一个账户转移到另一个账户也需要支付中间费。但现在，虚拟钱包应用允许更高效的交易。


    那么，银行和金融机构的未来是什么？现有的产品和服务会发生什么？现在很清楚，随着 FinTech 和虚拟货币的出现，银行和服务的颠覆迫在即睫。研究表明，到 2020
    年，可能有高达 28%的企业面临风险，而它们都是银行和支付业务。


