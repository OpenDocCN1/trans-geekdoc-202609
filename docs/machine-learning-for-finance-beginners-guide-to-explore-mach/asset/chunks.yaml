  trans: '

    在金融领域的许多落后和发展中地区，支付领域的金融科技正极大地地帮助着人类。移动技术和金融科技创造了这种新的连接经济，或者说一种共享经济体系，它让经济系统变得更有组织。在金融科技的帮助下，你可以通过点对贷款和众筹直接加入资金持有者和需要现金的个人。这使得人们能够以一种低廉但惊人直观且透明的方式投资资金。


    金融科技看起来确实正从字面上席卷整个金融产品行业。它正在重塑公司与客户相互互动的方式。传统银行模式已经遵循同一套系统四十多年，其方法没有做太大——大量的纸质文件已被
    `Excel` 表格所取代。经纪公司 `Hybridan` 董事威廉·林恩（William Lynne）认为该系统在很大程度上已经过时，但由于商业企业及其系统的全球性，交易变得非常困难。


    金融科技现在正寻求解决许多传统系统无法解决的问题，并开始进行改进。在传统系统中，完成交易的流程仍然保持不变。过去需要几天甚至可能几周时间才能确认和验证一笔大交易，而现在的金融科技策略最有效只需要几分钟。金融科技似乎对传统业务模式构成了风险。在未来几年，俄罗斯的中小企业银行和客户银行预计将在金融科技的帮助下受到严重影响。


    此前涉及许多巨头的财富和资产管理企业现在正因资产配置的自动化和替代性数字化经纪服务的创新而面临灭绝。随着越来越多的人使用在线产品或移动应用程序自力完成此类任务，此类金融科技产品的客户群每天都在变大。`PwC`
    的研究发现，74% 的保险公司预计在未来五年内其服务将受到金融科技的干扰，而 51% 的资产和财富管理经理表示，由于今天用户友好的财富管理 App 和在线服务，他们的产品可能会受到干扰。


    得益于金融科技，整个过程现在是自主的，任何人都可以无问题地通过安全加密方法确认资料。但我们还看到了在客户如何投资和购买保险方面金融科技投资的发展。现有系统正在被重造。根据
    `Denovo` 的数据，过去四年保险领域的金融科技投资已超过 34 亿美元。


    据说，金融科技是通过演变而非革命来发展的。目前的公司和业务模型不会一夜之间改变——即使是像 `Apple` 或 `Google` 这样被认为是业务模式潮流者的组织也不例外。金融科技的机会和影响是巨大的，交易技术中通常会有少数赢家和一些输家。对于每天都在开发新市场的新兴世代来说，某些群体和初创公司在系统某些阶段失败的可能性非常大。任何令人惊讶的增长，无论是技术上的还是财务上的（在本例中两者都有！），都会创造不可避免的陷阱，而且有些机构注定会失败。其中一个组织就是
    `Monetise`，它起初表现非常出色，赢得了大量赞誉；但到 2015 年底，他们的股价下跌了约 90%！


    在光谱的另一端是 `PwC`。他们非常安静，所以你再在市场内听到很多关于他们的消息了，但他们做得很好。他们是一个利用金融科技控制风险、洗钱或验证客户身份的盈利机构。到
    2015 年，他们的市场份额增长了 60%。有些机构从金融科技中获益最多。开发移动支付系统的 `Mi-Pay` 创建了卓越的反欺诈软件并经营良好。此外，还有
    `Vipera PwC`，它已经超过了自身的预设和预期。


    金融科技的另一个阶段是高效数据算法的出现。整个系统的自动化使得买更容易寻找定制化产品并做出更可靠的决策。此外，众筹趋势以及贷款和股权转移的改进使得个人投资者能够发现以前无法触及的机会，像一种业务属性一样。

    '
