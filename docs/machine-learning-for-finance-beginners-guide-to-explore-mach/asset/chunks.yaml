  trans: "\n强化学习涉及通过算法在定义的奖励基础上对观测系统进行探索、犯错并不断尝试来构建一个模型。这种方法与组织在制定支持创新的政策时所做的非常相似，甚至如此，因为强化学习寻求的是长期奖励的最大化。尽管它需要大量数据才能发挥作用，但强化学习已用于开发许多极其成功的游戏类人工智能（AI），而且它解决的是与其它机器学习方法不同类型的问题。\n\
    \n强化学习涉及学习用于提供反馈的数据，这些数据将决定模型如何适应当前状况以实现目标。系统本身能够根据所提供的反馈评估模型性能，然后进行必要的调整。例如，这一概念被恰当地应用于自动驾驶汽车（AI）以及国际象棋大师级算法中。\n\
    \n如上所述，强化学习发生在交互式环境中。换句话说，学习者完全没有被告知他们应该预期什么，而是根据其行为的后果自行发现，这种概念被称为目标导向学习。在本节中，我们将涵盖的强化学习主要组件列如下：\n\
    \n*   强化学习的基础。\n*   强化学习算法。\n*   强化学习环境。\n*   各种强化学习平台。\n*   强化学习的应用。\n\n## 强化学习的基础\n\
    \n假设我们想训练一条狗去接抛在空中的物体。这条狗并不一定理解这里涉及的所有概念和理论。实现这一点的最好方法是将物体抛到空中，每当狗接住它时，就准备好奖励它。如果狗失败了，就没有奖励。狗最终会分析在它获得奖励之前发生了哪些动作。奖励将激励狗重复相同的动作以获得越来越多的奖励。\n\
    \n同样，在强化学习环境中，你可能可以教模型做什么，但基于积极奖励，模型将倾向于重复某些动作。智能体或模型对积极奖励更敏感，并会忘记导致负面奖励的动作。有时，我们面临延迟奖励或只有在任务完成后才给予奖励的情况。在每一步可能会有奖励或奖励，仅仅为了确认是否存在错误。\n\
    \n假设你要教机器人如何在不撞到山的情况下导航：\n\n![](img/8.1.jpg)\n**图 8.1**\n\n一条规则是当机器人撞到山并被卡住时扣除\
    \ 10 分。这样，机器人就会理解为每当它撞山时就有负面奖励，因此不会再次撞山：\n\n![](img/8.2.jpg)\n**图 8.2**\n\n另一条规则是机器人每次向正确方向导航时给它奖励\
    \ 20 分。当然，机器人必须通过保持在正确路径上尝试奖励最大化：\n\n![](img/8.3.jpg)\n**图 8.3**\n\n模型（或机器人）可以应用强化学习的两个基本概念来平滑导航并获得更多奖励。强化学习模型可以决定探索不同的可能性以获得更多奖励。在这种情况下，智能体表现不佳的可能性更高，因为它可能会利用错误的警告。另一种方法是利用已知的动作。\n\
    \n## 智能体 (Agent)\n\n智能体基本上是一个能够做出决策的软件程序。智能体与环境交互：\n\n*   **智能体-环境接口：** 智能体处于状态\
    \ `t`，采取动作 `At`，移动到状态 `At+1`，接收奖励 `R`。\n*   **模型：** 这代表环境。这里的学习可以是基于模型的，也可以是无模型的。对于基于模型的学习，智能体使用以前的信息。另一方面，对于无模型的学习，智能体完全依赖于试错。\n\
    *   **策略函数：** 策略基本上是控制智能体如何行为的。智能体的行为性质取决于它所处的策略类型。各种路径代表不同的策略。有些路径可能很短，而另一些很长。路径被称为策略，因为它们是实现目标的指导。\n\
    *   **价值函数：** 每个状态都有一个价值函数。该函数指示智能体处于特定状态有多有利。该函数取决于策略，并表示为 `v(s)`。价值函数代表智能体从初始状态开始的总预期奖励。价值函数的类型如下：\n\
    \    *   **最优价值函数：** 与其他价值函数相比，为所有状态提供了最高值。因此，最优策略拥有最优价值函数。\n    *   **平稳策略：**\
    \ 这种策略涉及完全取决于智能体访问的状态的状态。\n    *   **确定性平稳策略：** 这是一种根据其当前状态确定性地选择智能体动作的策略。\n\n\
    ## 控制学习算法\n\n下面讨论了各种强化学习算法：\n\n*   **最优准则：** 学习智能体在进入环境的最初阶段将会犯错。因此，如果为了实现最优目标，它应该获得折扣奖励。这里的策略集应该是智能体本身期望最小的策略。有三个策略完全参与了最优性的获取：最优策略、确定性平稳策略和平稳策略。\n\
    *   **暴力破解法：** 这种强化学习算法包括以下过程：\n    *   对于任何可能的策略，都有累积回报。\n    *   选择预期回报最高的策略。\n\
    \n这种算法存在各种问题。策略的数量可能极大，因此难以操纵。另一个可能的问题是处理回报多变的策略时存在困难。\n"
