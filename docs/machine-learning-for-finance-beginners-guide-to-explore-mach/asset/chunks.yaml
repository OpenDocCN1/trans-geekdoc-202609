    **答.** 量子计算机使用量子比特（qubits）而不是比特（bits）来存储内存，这使其能够超越传统计算机的潜力。量子计算机利用量子力学现象，这些计算机能够执行经典计算机无法完成的模拟。量子计算机大约在二十年前出现，一些专家认为我们距离量子计算机上线只有几年之遥。如果我们把人工智能视为一种知道思考、行为和学习的程序，那么量子计算就是驱动这些核心动机的大脑。正因如此，科学界的一些人士认为，真正的危险不是人工智能，而是量子计算机。


    ### 19. 什么是图灵测试？


    **答.** 图灵测试是由英国计算机科学家艾兰·图灵（Alan Turing）在 1950 年提出的一个概念。尽管图灵测试有不同的形式，而且对于什么应该或不应该被认为是真正的图灵测试还存在争议，但这种测试可以被认为回答了机器是否能够回答问题的问题，但它使用了多种衡量标准来确定情感反应，包括瞳孔放大反应。沃伊-坎夫测试（Voight-Kampff
    test）的存在意味着未来某一个时刻，人类将难以区分人工智能智能体与人类，因此需要更先进的测试来做出区分。


    # 结论


    到此时，你应该能够应用各种用于监督学习、无监督学习和强化学习的机器学习算法了。当你想要探索其他关于机器学习的问题时，这些知识将是有益的。尽管如此，给你提供更多建议也是重要的，特别是关于如何处理机器学习方面的问题。


    # 如何处理机器学习问题


    在第一次接触机器学习问题时，必须非常有条理。努力尝试回答以下问题：


    *   对于我的工作模型（例如欺诈预测模型），我衡量什么以及如何衡量？

    *   我是否有知识来评估特定的算法？

    *   如果我成功了，我的模型最终的影响（业务上或学术上）是什么？


    # 人机交互（Humans in the loop）


    为你模型中的每一个人类参与者识别并恰当地分配分配角色。


    从原型转向生产。


    使用 `scikit-learn` 库的功能构建原型，并投入生产团队，他们应该使用 `Python`、`R`、`Go`、`Scala`、`C#`、`C++`
    和 `C` 等编程语言。


    # 测试生产系统


    在将产品发布到市场之前，确保你进行了适当的测试，以确定你的产品是否运行正常。在这一阶段，你可以识别出各种故障甚至是改进点。


    # 下一步


    此本书对机器学习提供了如此完美的说明，以至于在读完之后，你会预期自己成为一名机器学习专家。然而，如果你需要更多信息，请随时咨询关于那些你可能尚不清楚的概念的其他文献。一些优秀的书籍可能包括
    Friedman 等人著的*The Elements of Statistical Learning*，以及 Stephen Marsland 著的 **Machine
    Learning: An Algorithmic Perspective*。


    # 机器学习包


    目前市场上有很多机器学习包，旨在增强你对各种算法的理解。一些常用的包包括 `scikit-learn`（交互性最强且显然最受欢迎）、`statsmodels`
    包、`vowpal wabbit` (vw)，最后是 `mllib`（构建在 `Spark` 之上的 `Scala` 库）。


    使用推荐系统和其他类型的机器学习来识别优中优者。我希望你现在对机器学习深信不疑。


    继续挖掘这个新领域并永远不要放弃；还有更多精彩在等待。机器学习是一个活跃的研究课题，特别是神经网络。如今，机器学习被应用于每一个领域，如营销、医疗保健系统、银行系统、股市和游戏应用等。本书的目标是提供对机器学习主要分支的基础理解，以及神经网络背后的哲学。


    # 我们以后将走向何方？


    我们已经建立了机器学习是多么出色，以及它现在能做什么。更令人惊的是它在未来能够做什么。是的，由于许多原因，未来看起来非常光明。当然，有很多预测（很可能是由机器学习生成的）了关于我们可以期待的内容，但很有可能，当下一次演变完成后，我们可能会感到非常惊讶，站在旁边喃喃自语：“我真不知道机器还能做到那些！”


    但对未来的预测是什么呢？我们现在知道哪些事是可以让我们心地保持关注的呢？


    *   量子计算：目前，机器学习主要用于解决问题。它们以惊人的速度处理和分类数据。在未来，量子计算机将能够很好地处理高维向量。它们将通过使用混合训练方法来实现。通过利用监督和无监督算法的混合，向量的数量将大幅增加，从而产生令人印象深刻的速度。

    *   改进的无监督算法：它们自主发现数据中隐藏模式的能力以及其自学习技术，使得无监督学习在未来可以被更充分地利用。未来的机器将构建得更加智能，且大部分是无监督的。

    *   协作学习：机器将具有更强的能力协作使用其他计算实体。这将允许它们产生比现在更好的结果。

    *   更深层的个性化：在未来，机器将更多地了解你。虽然我们可能认为这非常讨厌且侵犯了我们的隐私，但今天使用的无效尝试将得到大大增强。那些令人沮丧的不准确的推荐将成为过去，最终将结束我们对整个过程的沮丧。


