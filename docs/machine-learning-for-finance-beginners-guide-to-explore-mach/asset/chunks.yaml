  trans: '

    系统本身也将提高自动学习和模式识别的能力，能够更好地识别出你想要看到的内容。这将使它们能够发现离群值、趋势变化以及其他有趣的数据。而在今天，这些必须由人类来发现。


    ### 狂野可视化

    图表和图形已经存在很长时间了。这是有原因的：它们擅长以易于理解的方式传达含义。


    但同样地，它们被开发是为了理解比我们现在处理的少得多的数据。观察数据的新方法——特别是与数据交互的方式——正在开发中。目前，我们正看到这一趋势的第一波浪，设计师们正在尝试不同的技术，其中一些有效，另一些无效。如信息图、交互式网页以及一些较新的智能工具，都是尝试观察数据新方法的示例。


    我们预见这一趋势将会加速。随着该领域变得越来越流行，并对全球经济变得至关重要，投入在该问题上的脑力和时间将导致在观察和理解数据的新方法上取得突破。


    ### 自服务智能

    使用分析的能力将不再是一项专门技能，我们已经在数据发现工具中看到了这种趋势。对于未来的高管来说，将其作为每日和每小时工作流的一部分将成为一种常见且日常的事。我们已经通过
    IBM 的 Watson 看到了这种演变，它在知识行业中将尤为普及。


    这有点违背直觉：使用的数据量每天都在增长，但工具却变得更简单了？是的，如此。


    例如，那种为了要一个关键的 KPI 而必须等 IT 部门花费很长时间（甚至是好几天）来挖掘出报告的时代已经过去了。自服务智能将细节控制权交给了客户。


    数据可以实时查看以进行实时分析和即时可操作的视角，为员工提供战略优势。


    随着数据量的增加，它正迫使人们对当前的智能工具进行完全重新评估。那些带有长长工具栏和复杂菜单系统的复杂用户界面已不再适用——它们是为一个数据量少得的世界构建的。


    这就带来了我们需要的新类型接口：`Sisense`、`Zoho Reports`、`Microsoft BI`、`Tableau Desktop`、`Tibco
    Spotfire`、`Alteryx Analytics` 和 `Salesforce Einstein Analytics`。


    ### 与数据的自然直观交互

    商业智能是企业软件最后的堡垒之一，仅仅是因为它的复杂性。如果你发现屏幕的一半被菜单占据，而路人完全不知道你在看什么，你就知道你正在使用商业智能软件。


    触摸、语音和手势等自然接口抽象了复杂性。功能越符合直觉，用户的生产力就越高，因为他们不需要学习如何使用它。当你真的可以口头提问“我应该关注哪个人口统计数据来增加销售额？”时，你不需要培训或专家帮助就能找到价值信息。


    Apple 通过训练人们使用触摸并创造出直观（且现在已被全球接受）的触摸手势，为世界做了巨大的贡献。Apple 的 `Siri` 非常重要，因为它在训练人们使用语音。微软的
    `Kinect` 非常重要，因为它在训练人们使用肢体手势。所有这些输入模式的结合创造了一个交互环境，让你玩转你的数据——探索它并与之交互。


    你将用眼睛思考，顺着直觉找到你正在寻找的数据，即使你不确定该问什么问题。


    数据将变得有趣。


    ### 协作

    几年前，你无法逃避“协作”这个流行词。这个想法是，通过让人们共同工作，释放他们来汇聚创意和智力资源，当然，希望这能导致想法和良好决策的协同效应爆发。


    协作在某种意义上，是在大数据在真正变得庞大之前，处理大量数据（即大数据）的一种方法。它本质上是众包式的报告挖掘。遗憾的是，需要评估的数据量实在太大了，即使是大量的人也无法高效地查看。


    新类型的接口（如上所述）将缓解这一问题。但协作有一个核心价值，不会因为不再是“新时尚”而消失。如果在正确的时间出现在正确的地方，两个头脑总比一个好。


    当工具允许人们使用直观界面不仅可以探索数据并从中发现数据，还能让多个人同时进行这些操作时，结果将是神奇的。想象一下，以有趣的方式查看数据、探索它，并与全球各地的同事实时分享你看到的内容：引发对话。让人们在同一项任务上工作，同时给他们独立探索的自由，这让你兼得其利。


    但什么时候呢？


    大多数变化将在未来三到五年内发生。其中一些已经在发生。但所有迹象都指向它们的一种不可避免性——它们处于两个推动我们社会向新型信息消费模式转变的趋势的交汇点，这种模式与我们现在的完全不同。


    # 结构化与非结构化数据


