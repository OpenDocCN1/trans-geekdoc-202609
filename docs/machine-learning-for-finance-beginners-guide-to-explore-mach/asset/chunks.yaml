- raw: 'Let’s discuss the Internet of things (IoT) for banking. But first, what is
    the Internet of things? In layman’s terms, it’s a machine-to-machine or device-to-device
    connectivity (e.g., connected cars, connected homes, connected malls, etc.). In
    other words, all the computers, whether they are at home or in the mall or in
    the bank or say vehicle, shall talk to each other and help the customer. For instance,
    a homemaker will not have to worry whether, in the current week, he or she has
    sufficient groceries at home. In fact, home computers will detect any shortage
    and inform the mall for the supply of that grocery while connecting with the bank
    to pay on the customer’s behalf. Everything is truly automated. And here, banks
    will play a major role. Not only can they arrange for payment, but also based
    on the ready data, they can give targeted offers, advice, and rewards to their
    customers.


    # [Bank of America: Big data projects](#toc.xhtml#s141a)


    So, Bank of America is using big data projects in various areas, e.g., improving
    customer retention, improving time and accuracy of financial forecasting, etc.


    # [Voice biometrics](#toc.xhtml#s142a)


    Voice biometrics is playing a major role in the life of people as well as banks.


    ![](images/9.3.jpg)


    **Figure 9.3**


    Nuance Corporation developed a voice biometrics application for BBVA Bancomer
    recently, to strengthen their pension system by improving the process of Proof
    of Life verification. This means a pensioner can identify him or herself with
    just a simple phone call, and once the computer recognizes the voice, it will
    be considered as evidence that the pensioner is alive. How cool is that for our
    grand-pops and grannies, isn’t it?


    # [Digital bank](#toc.xhtml#s143a)


    By now, we have seen many innovations in banking such as desktop/mobile Internet,
    FinTech, social media in banking, AI, robotics, machine learning, Blockchain,
    and big data. However, is it enough for banks to concentrate only on these fancy
    names? Is that what makes a bank fully digital? Absolutely not. the CIO of a bank
    has a huge task of enabling the entire digital landscape at the front end as well
    as backend. A typical midsize bank in the US may have anywhere between five hundred
    to nine hundred different IT applications, and the amount of interactivity with
    the changing technology landscape is a mammoth task for IT operations. In the
    next segment, we shall take a glimpse at the illustrative areas that may impact
    our digital world.


    # [AI as a strategy at the top level](#toc.xhtml#s144a)


    Worldwide, executives are increasingly looking to AI to create new sources of
    business value and revenue streams, or opportunities to save costs. This applies
    especially to top AI adopters, those who have invested in AI initiatives and have
    achieved impressive results. This is a small group of firms, but they are doubling
    their AI investments.


    Banking as a sector has competitors not only amongst its peers but also from FinTech,
    mobile industry, and tech industry. With the way technology is evolving so rapidly,
    we are not really sure which competitor will be added to the list and when.


    Banks can save from automation by retiring old technology and investing in innovations.
    For any bank to survive and grow, the most important criterion is increasing the
    bottom line. Apart from gaining market share, banks also look at cutting costs
    especially for tasks that are mundane and repetitive. Squandering human resources
    on such tasks just adds to the costs of running the business. If we can compare
    the banking industry to investment banking and asset management companies, they
    are currently in a similar predicament of generating alpha and reducing costs.
    It’s a bitter truth for banks that the quaint banking days are over. AI-based
    technology is not a fad that will pass, and banks can choose to ignore or look
    the other way for a few years more, only to realize that they are fading away
    or they should have opened up their doors sooner to AI.


    Visionary leaders from the banking and financial services industry can foresee
    the future and steer their institutions in that direction. The exponential growth
    of AI has not gone unnoticed. These leaders already know that, in a few years,
    AI will be an integrated part of their systems. However, to succeed, the AI strategy
    should be a top-down approach, although for deciding the best use cases, it should
    have a bottom-up approach. This can happen when the workforce remains assured
    that AI is being adopted as an enabler and not to replace the human workforce.
    This communication is equally important to get the organization as a whole to
    work towards making the AI journey worthwhile.


    But how many are ready to take the leap? Are the CEOs who are already way ahead
    in adapting AI reaping benefits from it? These are the most important questions
    at the moment.


    Like any business decision, AI should have a board-level strategy. It calls for
    the strategy from top-level leadership. AI is not one of the technologies banks
    usually adopt, wherein there is no executive-level involvement. If executed well,
    it can result in cost savings for the banking industry. As per the Autonomous
    report on AI, by 2030, traditional financial institutions can save 22% in costs.
    The report states that banks can save $490 billion by adopting AI in the front
    office.


    With pressure, building upon executives to reduce costs and increase revenue by
    investing in AI makes a strong case for it. It requires executive-level strategy,
    and in absence of that, all AI investment will fall flat on its face.


    Why we need executive-level indulgence in AI is because of the following factors.


    # [Cost of investing in AI](#toc.xhtml#s145a)


    Undoubtedly, financial institutions will reap the benefits of AI, but the cost
    of investing in AI is very high and there are no two ways about it. If costs are
    huge, the stake is high. Half-baked execution will not only dent the bank’s image,
    it will also cost a fortune. AI journey should not be undertaken like injecting
    a suite in the current IT system. Just infusing AI without a strategy will not
    yield the desired results.


    # [Crucial leadership involvement](#toc.xhtml#s146a)


    According to the recent PwC US supplement to the 21st Annual Global CEO Survey
    2018, US CEOs’ fears over the past five years of losing a technological edge have
    risen sharper than other types of threats. The fear is rational considering the
    leap technological innovations make every day. Banks cannot afford to lag here.
    However, if fear is rational, then rational solutions can help overcome this impediment.
    This clearly calls for a more proactive role from CEOs rather than just assigning
    AI journeys to the CIO or CDOs. It is very important to chart out the AI journey
    rather than just joining the bandwagon. The journey for each bank or financial
    institution will be different. There is no fit-for-all solution in the AI journey.
    And such enterprise-specific roadmaps are what will actually make the journey
    profitable for the bank.


    So, how do banks adopt AI? Some banks have set up an in-house AI division. Singapore-based
    OCBC Bank (Overseas Chinese Banking Corporation Limited) set up an in-house AI
    division in early 2018, while some are collaborating with AI companies who develop
    products for banks.


    # [Inorganic growth](#toc.xhtml#s147a)'
