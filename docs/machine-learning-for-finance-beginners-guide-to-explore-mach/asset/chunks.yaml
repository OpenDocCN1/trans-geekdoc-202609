    *   How is machine learning used today.


    # [Objective](#toc.xhtml#s3a)


    After studying this chapter, you should be able to do the following:


    *   Understand the process of how machines are taught, and the relation between
    machine learning, AI, deep learning, data mining, and statistics.


    *   Understand the application of machine learning in the finance domain.


    # [How machines are taught](#toc.xhtml#s4a)


    The entire process can be considered complex. There are also different approaches
    applied. However, for the sake of translating the basics and to give an overview
    of what happens during the process, here are the three basic parts of machine
    learning:


    1.  **Data input:** The information or data sets to be used are fed to the machine.
    These data can come in the form of SQL databases, text files, spreadsheets, or
    anything similar.


    2.  **Data abstraction:** At this stage, the data is labeled and represented as
    required. It is then analyzed using the algorithm chosen for the process. This
    is where the basic learning process happens.


    3.  **Generalization:** Once the learning is completed, the machine starts to
    develop its own insights. From these insights, it comes up with an output. Not
    all machine learning processes require an output, though. In some cases, the goal
    is only to cluster the data together.


    Note that, in this process, the goal is always to create a better version of the
    machine. After the process ends, it is expected that the machine becomes smarter
    regardless of whether there is an output or not.


    # [Factors contributing to the success of machine learning](#toc.xhtml#s5a)


    Although the computers used in the process are definitely more advanced than the
    regular ones, of course, there is still a margin of error to be considered. Because
    of this, there is a need to zero in on what could increase the chances of success.


    These factors come to mind when it comes to ensuring success in machine learning:


    *   How well the generalization goes


    *   How well the machine can apply what it learned to practical use


    When these two areas are done well, expect that the results will show a success.
    These are also the key elements in ensuring that a future course of action can
    be predicted and planned for.


    # [Machine learning and artificial intelligence](#toc.xhtml#s6a)


    Machine learning and AI and are closely related, but it is highly inappropriate
    to interchange the two terms. These are different concepts.


    Artificial intelligence is a more general term that covers a number of applications.
    It involves the ability of machines to mimic the behavior of humans. This also
    includes the ability of machines to make intelligent decisions on their own.


    Machine learning falls under artificial intelligence as it also gives the machine
    the ability to think. But where artificial intelligence covers all concepts involving
    machines acting and thinking the same way as humans do, machine learning focuses
    on a machine’s ability to learn on its own. As mentioned in the earlier definition
    of the term, this ability comes without the need for specific programming.


    # [Machine learning and deep learning](#toc.xhtml#s7a)


    Just like artificial intelligence, deep learning is yet another concept that is
    closely related to machine learning but is still essentially a different application
    altogether.


    Deep learning, in essence, involves the creation of artificial neural networks.
    These networks use algorithms to learn and make decisions on their own.


    # [Machine learning and statistics](#toc.xhtml#s8a)


    Statistics, as you probably know, deal with data coming from either an entire
    population or from samples drawn from that population. From there, you can carry
    out analyses and draw inferences.


    Statistical techniques are used in a number of applications like conditional probability,
    regression, standard deviation, variance, and a lot more.


    So how do statistics fit into machine learning?


    Although machine learning is part of computer science and statistics is part of
    mathematics, they work hand in hand in delivering results for artificial intelligence.


    One example is the way your emails are segregated in your inbox. Let’s say you
    want to determine which emails are important and which ones should be recognized
    as spam. In this case, a machine learning algorithm called Naive Bayes will observe
    past spam emails to come up with a way to identify new emails coming in as spam.


    Naive Bayes uses a form of statistical technique that is the basis for conditional
    probability. This technique will be discussed in a later chapter.


    # [Machine learning and data mining](#toc.xhtml#s9a)


    Again, it’s the use of data in both machine learning and data mining that makes
    people think that these two concepts are the same or are closely related.


    Basically, data mining is a term that describes the process of searching through
    data for specific information. Machine learning, on the other hand, is only concerned
    with one thing – completing the task it was asked to do using the algorithms applied.


    # [What’s the difference?](#toc.xhtml#s10a)


    If someone is teaching you how to play the guitar, that’s a process that describes
    machine learning. If someone asks you to look for the best guitar performances
    ever, then that’s data mining.


    # [Machine learning in finance](#toc.xhtml#s11a)


    In finance, machine learning can do something amazing, even though there is no
    enchantment behind it (well, perhaps only a tad). In any case, the accomplishment
    of a machine learning undertaking depends on the structure of the foundation,
    gathering appropriate data sets, and applying the correct calculations.


    Machine learning is making noteworthy advances in the finance-related administration
    industry. We should perceive any reason why budgetary organizations should keep
    in mind the advantage of machine learning, what arrangements they can actualize
    with machine learning and artificial intelligence, and how precisely they can
    apply this innovation. Most finance-related administration organizations are as
    yet not prepared to identify the genuine incentive of this innovation for the
    following reasons:'
