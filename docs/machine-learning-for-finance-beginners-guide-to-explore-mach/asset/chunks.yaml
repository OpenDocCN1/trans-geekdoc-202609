- raw: 'A classic example of this type of problem is predicting the 3D structures
    of complex molecules such as proteins. There are trillions of possible protein
    molecules, but only a handful have any practical applications. Being able to determine
    the likely shape of a molecule from its component parts means it’s much easier
    to identify which molecules are likely to be useful and which are not.


    What’s amazing about machine learning models, and deep neural network models in
    particular, is that they can be trained to predict almost any outcome imaginable
    to a degree that equals or exceeds the best human decision-makers if good-quality
    information (training data) is available. Want to predict the outcome of baseball
    or soccer games? Then feed the training algorithm with data about historic games
    and a well-designed model will beat the best human pundits. Want a tool that decides
    which stocks to buy? Then better to trust a machine learning model than a stockbroker.
    Want to optimize the layout of a factory or supermarket? Then there are neural
    network algorithms that can do that better than any human could.


    All of the different ways of building models that we’ve discussed so far have
    assumed that there is a database containing data about the environment, which
    includes details about the thing you want to infer (predict). Let’s summarize
    the tasks we’ve considered so far:


    *   When building the decision tree model to predict heart disease, patients’
    medical records were flagged to indicate which one developed heart disease.


    *   When creating the scorecard and neural network models for credit scoring,
    each loan application was matched to data about loan repayment.


    *   When talking about using a deep neural network to identify images, each image
    in the training data was tagged to indicate if the image was of a cat, cake, or
    potato.


    For all of these tasks, the training data was labeled to indicate what the outcome
    was in each case. This type of machine learning, using labeled training data,
    is called supervised learning.


    Most real-world AI-based applications, such as target marketing, voice recognition,
    and employee vetting, are examples of supervised learning. However, there are
    times when there isn’t any labeled data for the training algorithm to use. In
    these situations, a different set of techniques, referred to as unsupervised learning,
    can be applied.


    The most common type of unsupervised learning in use today is clustering. Clustering
    algorithms are based on the principle of minimizing the distance between cases
    in the training data. This doesn’t necessarily mean physical distance, but how
    similar cases are in terms of specific data items. The distance between two people
    aged twenty-three and twenty-five is less than that between people aged seventeen
    and seventy-six. If we are talking about smoking, then two smokers have a distance
    of zero, whereas a smoker and a non-smoker don’t, and so on.


    With clustering, a model isn’t produced at the end of the process, which means
    it can’t be used to generate predictions about how individual cases are going
    to behave. There is just an identifier to say which cluster an observation belongs
    to. For example, you are in cluster 9 while I’ve been assigned to cluster 4.


    Customer profiling to group similar people together is one of the best-known applications
    of clustering, but clustering approaches are also being applied successfully to
    many other tasks such as document clustering. In fields such as law and academic
    research, there is a requirement to regularly trawl through the ever-growing pile
    of published literature to find information relating to certain cases or types
    of research. In medicine, for example, almost a million academic papers are published
    each year. Documents are grouped (clustered) together on the basis of how similar
    they are in terms of subject matter, writing style, word count, and a host of
    other features.


    Document clustering can also be applied to tweets, news feeds, blog posts, and
    other rapidly changing media in real time. Pictures and videos can also be categorized
    in a similar way. News organizations use these approaches to automatically flag
    new posts about specific topics as they appear. They can then include them in
    their own media publications almost immediately. Social media companies and governments
    use similar methods (as well as predictive models) to identify illegal or undesirable
    content.


    Supervised learning works well when there is a large amount of labeled data. If
    there are no labels available, then unsupervised learning, such as clustering,
    can sometimes prove useful, albeit in a somewhat different context. There are,
    however, situations where there may be no data initially, but the learning process
    is able to assess its performance on a case-by-case basis as it goes. The model
    is adjusted each time, on the basis of some measure of success or reward that
    is calculated each time a task is attempted. This type of machine learning is
    called reinforcement learning.


    Data scientists often talk about three distinct types of machine learning: supervised,
    unsupervised, and reinforcement learning. However, reinforcement learning shares
    many features with supervised learning. In particular, it delivers a model typically
    based on some form of neural network. The key difference is that it generates
    training data as it goes, rather than using pre-existing training data to derive
    the final model.


    A great example of the difference between supervised and reinforcement learning
    is how model training occurs to create a chess-playing program. A supervised approach
    would take thousands of game moves (or sequence of moves) from previously played
    games as observation data, with the labeled output data providing an indication
    of whether the move was a good one or not. The scores produced by the model are
    used to indicate which piece to move and to where. The algorithm then finds the
    model weights that result in the overall best set of moves, measured against the
    moves contained in the development sample.


    With reinforcement learning, no data is provided initially—none at all! The model
    scores still indicate which move to make just like the supervised approach. However,
    initially, these will be more or less random, given that there isn’t any training
    data. Each time a move is made, the status of the board (the new state of being)
    is reevaluated. The algorithm then adjusts the weights in the model on the basis
    of how successful its move was deemed to be.


    Evaluating the success of a move in chess is complex and will often incorporate
    probable future states of being, as well as the current one. However, for the
    purposes of this example, a simple success criterion is the difference in the
    value of each player’s pieces remaining on the board after a move has been made.
    If your move results in the taking of a high-value piece, but not losing one yourself,
    then that’s a strong success. Making a move and then having one of your pieces
    taken is a failure, yielding a low measure of success. The ultimate success or
    failure is losing one’s king—checkmate. In this way, by assessing each move and
    adjusting the model weights accordingly, the program learns by itself without
    needing to be supplied with any prior information.'
