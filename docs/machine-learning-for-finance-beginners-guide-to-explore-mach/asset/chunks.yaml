    *   `Cost`: The infrastructure and the maintenance cost of the system that can
    process the selected trait should be minimal.


    Fingerprint and iris are the commonly used biometric traits in most of the biometric
    systems. This is mainly because of its user convenience (high for fingerprint-based
    systems) and accuracy (high for iris-based systems). `Aadhaar` (`Aam Aadmi ka
    Adhikar`) recognized as the world’s largest universal civil ID program and biometric
    database is currently used by the Government of India to provide social services
    to the citizens. Both fingerprint and iris biometric traits are taken during `Aadhaar`
    enrolment:


    | Features and ML techniques | Modality | Features | ML techniques |

    | :--- | :--- | :--- | :--- |

    | Face | Distance between eyes, `DCT`, `Fourier transform`, Ratio of the distance
    between eyes and nose, Principal components | `PCA`, `LDA`, `Kernel PCA`, `Kernel
    LDA`, `SVM`, `Deep neural network` |

    | Iris | `DCT`, `Fourier transform`, `Wavelet transform`, `Principal components`,
    `Texture features` | `PCA`, `LDA` |

    | Fingerprint | `Delta`, `Core points`, `Ridge ending`, `Island`, `Bifurcation`,
    `Minutiae`, `FFT` | Artificial neural networks |

    | Palm vein | `LBP`, `Minutiae`, `Bifurcation`, `endpoints` | `SVM`, `Deep learning`
    |

    | Palm print | `Shape`, `Texture` | `PCA`, `LDA` |

    | Palm vein | `LBP`, `Minutiae`, `Bifurcation`, `endpoints` | `SVM`, `Deep learning`
    |

    | Voice | `Linear prediction (LPC)`, `Cepstral coefficient (CC)`, `MFCC` | `Gaussian
    mixture models`, `HMM`, `ANN`, `SVM` |


    **Table 5.1**


    Machine learning has played a major role in improving the performance of biometric
    systems.


    ## Software vulnerabilities](#toc.xhtml#s78a)


    Vulnerability refers to a flaw in a system that can leave it open to attacks.
    A software vulnerability is a flaw in a software that can cause the software to
    crash or produce invalid output or to behave in unintended way. Some of the common
    software vulnerabilities are:


    *   `Buffer overflows`.

    *   `Numeric over and underflows`.

    *   `Errors in type conversion`.

    *   `Operator misuse`.

    *   `Bugs in pointer arithmetic`.

    *   `Evaluation order logic errors`.

    *   `Structure padding errors`.

    *   `Procedure errors`.

    *   `Errors in macros and preprocessors`.

    *   `String and meta-character vulnerabilities`.

    *   `Privilege problems`.

    *   `File permission issues`.

    *   `Race conditions`.

    *   `Errors in processes, IPC, and threads`.

    *   `Environments and signaling issues`.

    *   `SQL injection vulnerability`.

    *   `Cross-site scripting (XSS) vulnerability`.

    *   `Vulnerabilities in file inclusion and access`.

    *   `Vulnerabilities in shell invocation, configuration`.

    *   `Access control and authorization flaws`.


    Software vulnerability detection is the process of confirming whether a software
    system contains flaws that could be leveraged by an attacker to compromise the
    security of the software system or that of the platform. Code injection attacks
    allow an attacker to execute code within the privileges of the vulnerable program.
    The machine learning approaches for vulnerability detection methods can be classified
    as follows:


    *   `Anomaly detection methods`: These use features such as `API` usage patterns,
    missing checks, lack of input validation, and lack of access controls. Machine
    learning techniques such as `KNN` have been used for classification.

    *   `Pattern recognition methods`: These identify vulnerable lines of code along
    with keywords (specific to programming languages) using machine learning algorithms.
    The features include system calls and `API` calls invoked by an application, syntax
    trees, etc. Machine learning techniques such as `logistic regression`, `multilayer
    perceptron (MLP)`, `random forests`, `neural networks`, `BLSTM`, etc., have been
    used.


    Computer vision plays a huge role in bridging the gap between human and machine.
    With the groundbreaking technological advancements today, this will be a very
    helpful tool in automating verification, especially in the finance sector. In
    this chapter, we discussed the technical architecture of `CNNs` used in computer
    vision. We also had a walkthrough of the application of computer vision in image
    recognition, biometric recognition, and software vulnerabilities.


