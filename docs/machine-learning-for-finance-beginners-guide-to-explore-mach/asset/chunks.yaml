    在开发任何程序（或任何系统）时，总有一套需要遵循的顺序，以确保高效捕获数据并正确解释数据，这正是本章的核心内容。我们还概述了建模流程，该流程包括特征工程、模型选择、模型训练、模型验证以及在数据数据上模型测试。


    在下一章中，我们将学习强化学习如何与金融市场相关联。


    # 第 8 章：面向金融市场的强化学习


    ## 引言

    强化学习是一个有趣且动态的领域。强化学习是一种以目标为导向的学习过程，专注于与环境的交互。强化学习被认为是人工智能的希望。这可以理解，因为强化学习所承载的承诺是巨大的。


    强化学习正在迅速流行，为各种应用创建了广泛的学习算法。因此，熟悉强化学习技术也是非常重要的。


    ## 结构

    在本章中，我们将涵盖以下主题：


    * 机器学习中的问题类型。

    * 识别关键预测因子（数据削减）。

    * 从经验中学习（强化学习）。

    * 强化学习算法。

    * 强化学习的类型。

    * 强化学习在现实中的应用。


    ## 目标

    学习本章后，你应该能够做到以下点：


    * 理解可以使用机器学习的业务问题。

    * 理解数据削减技术。

    * 理解强化学习的概念、类型和应用。


    ## 机器学习中的问题类型

    在海量数据中寻找模式的机器学习算法用于构建智能系统和人工智能应用。作为人工智能的一个子领域，在过去的几十年里已经开发了数百种机器学习算法，每种算法都可直接或间接地生成新的业务知识。挑战的一部分之一是确定哪种算法或算法族适用于你的业务任务。


    通常来说，你可以做五件件事：


    * 使用 `unsupervised learning` 寻找模式。

    * 通过数据削减技术识别关键预测因子。

    * 识别不规则或异常情况。

    * 通过 `supervised learning` 从示例中学习。

    * 通过 `reinforcement learning` 从经验中学习。


    例如，考虑信用卡欺诈检测。由于欺诈模式会随时间变化，使用机器学习算法自动检测新出现的模式可以增强银行防御客户的能力，并比人工手动监控所有交易更快地做出响应。


    你可以将过去的交易数据想象成一个具有数百万行的表格，其中每一行（观测值）代表一次交易。列可能包含交易的日期、时间、纬度和经度、金额、商户，甚至可能包括购买了什么。还有另一列提供了关于欺诈问题的答案，告诉我们交易是合法的还是欺诈的。这一列的存在是因为银行有足够的时间与持卡人核实疑交易的有效性。`unsupervised
    approach` 可能会将交易分为两类，看你是否可以将合法交易与欺诈交易分开。在 `supervised` 或 `semi-supervised` 方法中，算法会寻找合法和欺诈交易之间的相似性和差异，因为它知道（至少在某种程度上）哪种是哪种。


    ## 识别关键预测因子（数据削减）

    有时，你需要处理的数据太庞杂且难以应付。想象之前提到的同一个信用卡交易数据集，但不仅有关于交易金额、位置和特征的信息，还有几百个其他变量。你应该使用哪些变量来确定交易是合法的还是欺诈的？


    如果你使用所有的预测因子，存在风险。首先，模型构建过程可能是计算密集型的，这意味着构建模型所需的时间或处理能力可能超过了你拥有的。其次，通过构建一个包含过多预测因子的模型，你面临对噪声而非信号进行建模的风险，这种结果被称为
    `overfitting`（过拟合）。过拟合模型在你用于训练的数据上具有极强的预测能力，但在未见过的新数据上表现可能不佳。


    数据削减（也称为降维）的常用方法包括 `principal component analysis` (`PCA`）、`linear discriminant
    analysis` (`LDA`）和自动编码器类型的神经网络。尽管它们不是显式自适应的、反应性的或主动的（因此更准确地归类为统计模型而非机器学习模型），但将它们应用于商业问题通常需要大量的处理能力。它们通常在发送数据通过无监督或监督机器学习算法之前应用，因此有时会被包含在机器学习书中。


    当你使用正确的特征并减少它们的数量以只使用预测因子时，计算性能和生成的机器学习模型的准确性都会得到提高。降低维度可以增加你模型的最终威力。


    ## 从经验中学习（强化学习）

    强化学习（`RL`）是一种无监督学习，它为不同的选择定义了潜在奖励，而不是为每个观测值贴上定义特征标签。`supervised learning` 基于已知信息构建模型，而
    `reinforcement learning` 通过动态地探索环境来发现它。强化学习可以用于确定智能体与环境交互的最佳方式。


    例如，你可能想要找到从建筑物内某个位置到最近火出口的最优路径。如果你将每个户外位置与高奖励相关，出口附近的区域与小奖励相关，建筑深处的区域与零奖励相关，强化学习可以识别出产生最高奖励的最优路径。


    *Dowling and Cahill (2004)* 声称，强化学习可能是解决工业环境问题最有益且应用广泛的技术。以下示例：


    * RL 可以通过观察行为学习客户偏好，这可以为营销部门提供关键信息。*Halperin (2017)* 展示了如何使用该方法为新产品和力设计营销策略，并制定适用于竞争环境的定价策略。


    * 当概念以逻辑方式呈现时，学生学得更好。*West 等 (2019)* 使用强化学习为课程寻找优的学习路径，这可以提高高等教育和培训成果，同时提高学生的满意度。


    * 提高声源质量，特别是在环境中，对于助听器制造非常重要。*Koizumi 等 (2017)* 使用强化学习探索这一问题，将奖励定义为感知质量的增加。


    * 像败血症等挑战性医学状况需要医生快速识别治疗策略。*Raghu 等 (2018)* 使用强化学习（辅以其他几种监督和无监督方法）来识别临床医生如何使用模型来显著改善死亡率。


    '
