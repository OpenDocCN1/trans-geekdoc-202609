    证券领域的投机被称为日内交易。更具体地说，它指的是在同一个交易日内买卖金融工具。严格来说，它是一次一天内的交易事件。这意味着当市场收盘时，所有头寸都已关闭。日内交易者通过寻找具有有利条件的股票，来确定入场和出场位置。这些条件可以产生各种短期收益，这些收益累积起来就能变成巨额利润。


    如果市场中存在能够识别市场有利模式的人，我们甚至可以训练机器以相同的方式进行操作。这就是使用机器学习进行日内交易的目的。但首先，我们需要识别出日内交易者用于信号市场入场条件的策略。该技术分为两个过程：第一是高层模式描述，第二是机器学习。


    在第一个过程中，会识别输入语义，这可能在数百个预先定义的策略中发生。这是通过使用健壮且高度可扩展的模式匹配来完成的，例如 `Apache Flink`。一旦激活了数据插件（data
    cartridge），我们就可以遍历历史数据，找到过去数据插件激活的案例，以及十分钟或二十分钟后的结果价格。我们可以使用机器学习为算法生成训练示例，对之前的入场创建概率分布。


    # 结论


    在本章中，我们讨论了机器学习在金融领域的应用。我们还介绍了银行和金融机构如何利用 `Credit Scoring Models` 通过算法分析客户的信用分。我们还讨论了机器学习在网络安全、算法交易和机器人投顾中的应用。


    在下一章中，我们将学习如何避免欺诈。


    # 第 12 章


    ## eKYC 与反欺诈政策


    ### 引言


    技术创新驱动文明进入了一个独特的腐败时代。信用卡被盗刷和身份盗窃的新闻已成为常态。


    欺诈识别是 AI 行动在实现可靠和卓越结果方面取得巨大推动的领域之一。它是整个银行业中 AI 程序表现异常出的主要领域之一。欺诈识别已经取得了很远进步，并预计在未来几年内将进一步进展。


    ## 结构


    在本章中，我们将涵盖以下主题：


    * 大数据分析：当今真正的流行术语。

    * 犯罪分子如何获取网上银行信息。

    * 信息可能被盗窃的常见方式。

    * 安全措施。


    ## 目标


    学习本章后，你应该能够做到以下点：


    * 理解信息被盗窃的不同方式。

    * 理解阻止此类欺诈的不同安全措施。


    ## 大数据分析：当今真正的流行术语


    此前在 IT 领域，我们已经见过数据仓库和商业智能的大型项目。让我们来看看金融行业中使用的一项重要创新——大数据，它现在正在分析太字节（`1 gigabyte
    = 0.000909495 tebibytes`）的结构化和非结构化数据，包括文本、数字、数字算法、视频和语音。根据 `ingrammicroadvisor.com`，大数据可用于银行的各个领域，如欺诈检测、合规、监管要求、客户细分、个性化营销和风险管理。


    ## 犯罪分子如何获取网上银行信息


    数字罪犯和恶意的骗子正不断努力设计更好的方法来窃取客户秘密信息。遗憾的是，这种攻击不仅限于互联网。而且最近发现信用卡/支票卡信息被盗窃，这些策略正越来越多在物理世界中实施。


    世界最大的银行之一 `Swift` 最近承认，它在 2016 年曾是网络犯罪的目标，当时欺诈者入侵了连接一万万家银行的通信系统，并通过反转银行与 `Swift`
    网络之间的链接，从其中一家银行盗取了现金。


    ## 信息被盗窃的常见方式


    在本节中，我们将学习犯罪分子或黑客窃取数据的最常见方式。


    ### 零售店或餐厅


    骗子们制定了干扰零售场所读卡器的方法。看起来像真卡的恶意智能卡被嵌入到机器中以进行分期付款。但机器基本上会检测到发生了错误，而零售商对刚刚造成的损害一无所知。随后当使用真卡在同一台机器上进行合法的分期付款时，该卡的详情就会被记录。


    然后，骗子回到商店，将假卡再次插入机器以进行另一次看起来很诚实的分期付款。在此期间嵌入的所有卡片详情目前会被移动到恶意卡片中，骗子可以通过设备提取这些卡片信息。


    ### 在线门户网站


    最好的网络购物入口强制使用安全策略以确保客户的关注点。不安全的入口容易受到程序员的攻击，并且不费吹之力就能将信息泄露给骗子。已经出现过主要的在线网关被破解、卡片详情被盗取和滥用的案例。


    从客户的角度来看，了解 `SSL` 和安全声明是明智的。此外，机器上引入最好的互联网安全程序同样可以识别虚假页面和入口。


    ### 被黑的邮箱账户


    许多人通过电子邮件获取并支付 `Visa` 账单。因此，如果一个程序员发现了如何访问邮箱账户的方法，他就会带来巨大的不便。最好使用不同的设备进行电子邮件安全，如双重身份验证、强密码等。`Gmail`
    和 `Yahoo` 等邮件管理员提供了不同的方法来检查你的账户是否被破解。


    ### 自动取款机


    从 `ATM` 盗取卡片信息被称为“侧录”（skimming）。这可以通过读卡设备和记录人员输入 PIN 时的小型摄像头轻松完成。骗子还利用复制卡片磁部分的设备。尽管如此，可以采取措施避免此类攻击，包括在输入
    PIN 时确保没有人看到你的手，并监控可疑机器。


    ### 扒手和盗偷


    卡片的物理丢失是这种情况下最大的危险。及时向相关银行和执法部门报告卡丢失是明智的。另一项重要的预防措施是监控卡片账单和操作，查看任何异常迹象。


    ### 员工记录


    你的雇主拥有你的个人信息，犯罪分子可以访问。为了防止这种不当行为，请询问你的老板是如何存储你的信息的。警惕那些你意想不到的事情。


    ### 诈骗电话


    犯罪分子给你打电话，自称是你 `Visa` 组织的代表，要求你确认一些个人信息。然后犯罪分子会联系你的 `MasterCard` 组织并冒充你的身份…… 这种情况下，请直接挂断电话！


    ### 社交媒体


