    Intrusion is something a lot of organizations and firms undergo. This is basically
    actions that can compromise the integrity of a confidential source. The defensive
    measures employed to ensure this doesn’t happen include user information authentication.
    Data mining can help in improving this intrusion detection by adding a high level
    of focus to anomaly detection. This way, data analysts can easily distinguish
    intrusive activity from more common and frequent everyday activity. Data mining
    can be used to extract data that is specifically relevant to the problem. Data
    visualization makes it a lot easier to understand the data for decision-making.


    # Lie detection


    Lie detection can be difficult and apprehending criminals might be the easy part,
    but getting them to say the truth can be a lot more difficult. Law enforcement
    can use data mining and visualization techniques for investigating crimes and
    tracking communication between suspected terrorists or people. This includes the
    use of text mining and seeking out meaningful patterns in data, which usually
    come in unstructured text. For example, data samples that have been used in past
    investigations can be compared and a model lie detector can be developed. The
    data thus collected can be sorted according to the requirement of the case.


    Data mining and visualization can be used for all of the above and possibly so
    much more. The bottom line is that they are important tools in today’s world and
    are necessary for businesses and corporations to thrive the best way they can.
    Data mining can also be used to achieve data visualization as the case may be.
    The best part is, it gives rise to a lot of possibilities in the nearest future.


    # Conclusion


    Data mining is necessary for improving an existing system. Also known as data
    or knowledge discovery, it can be used for analyzing data from every aspect. This
    data can be used in reducing costs, increasing revenues, and running a business
    or an organization.


    Data mining is one of the tools widely used in analyzing data from different angles
    and dimensions while categorizing it and establishing relationships among the
    different types of data.


    Data visualization is also a very crucial tool. It isn’t just a representation
    of data in graphical formats, but it is incredibly powerful and the use of this
    tool can affect an organization both negatively and positively. When data visualization
    is not used effectively, it can affect decision-making and obscure whatever information
    you are trying to communicate. When used right, it can help you achieve more effective
    and powerful communication and aid great decision-making.


    Data mining and visualization are both different ways of collecting and identifying
    data, and if used properly, they can make an organization grow.


    In the next chapter, we will discuss the advantages and disadvantages of machine
    learning.


