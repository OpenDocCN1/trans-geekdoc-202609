- raw: 'Some of the URL-based features include the number of digits in the URL, total
    length of URL, number of sub-domains in URL, misspelled domain names, TLD used,
    and so on. Some of the domain-based features include the presence of domain name
    or its IP address in well-known blacklisted services, age of the domain, category
    of the domain, availability of the registrant name, and so on. Some of the page-based
    features include global and country PageRank, position in the list of Alexa top
    1 million sites, estimated number of visits for the domain on a daily, weekly,
    or monthly basis, average page views per visit, average visit duration, web traffic
    shape per country, number of references from social networks, presence of similar
    websites, and so on. Some content-based features include page titles, meta-tags,
    hidden text, text in the body, images, videos, and so on.


    Thus, the common features that are used for phishing page detection include its
    URL, PageRank, SSL certificate, Google indexing, domain, and features based on
    the web page source code. However, these features have limitations. Web pages
    that are hosted on free web hosting services would never include some of the relevant
    features possessed by a legitimate web page such as PageRank, age of the domain,
    SSL certificate, and Google indexing. On the other hand, it is possible for a
    hacker to promote his phishing page by utilizing Black Hat SEO techniques such
    as keyword stuffing to get higher indices for the phishing page. Further, incoming
    traffic to the website can be increased with the help of third-party tools such
    as the web clicker application, which generates thousands of page views within
    minutes.


    Phishing page detection is a supervised classification problem. We need labeled
    data that has samples of phishing pages and legitimate pages in the training phase.
    The training data set that we use is a very important component in building a
    successful detection mechanism. So, we have to use training samples whose classes
    are precisely known. Phish Tank is a well-known public data set of phishing websites.
    Site reputation services can be used for collecting legitimate sites. Machine
    learning techniques such as SVM decision tree and Naive Bayes have been used for
    phishing page detection.


    # [Malware detection](#toc.xhtml#s36a)


    Malware (malicious software) is any software intentionally designed to cause damage
    to computer systems and networks. Malware can be divided into the following classes:


    *   **Virus:** It is a type of malware that is loaded and launched without the
    permission of the user and reproduces itself as well as infects other software.


    *   **Worm:** This type of malware is very similar to a virus, but unlike a virus,
    it can spread over the network and replicate to other machines on its own.


    *   **Adware:** This type of malware displays advertisements on the computer.


    *   **Spyware:** This type of malware performs espionage.


    *   **Rootkit:** This type of malware enables the attacker to access the user’s
    system and network with root access.


    *   **Backdoor:** This type of malware provides an additional secret entry point
    to the system for the attacker.


    *   **Keylogger:** This type of malware logs all the keys pressed by the user
    and captures all sensitive data including passwords, credit card numbers, and
    so on.


    Existing malware detection mechanisms are classified as static, dynamic, or hybrid
    (combination of static and dynamic). The static analysis uses features of the
    source code of the software such as signatures, API calls, function calls, and
    permissions for detecting its malicious nature without executing the software.
    On the other hand, dynamic analysis is conducted on the software while it is being
    executed ideally in a virtual environment. Malware can easily bypass static detection
    mechanisms using encrypted or obfuscated source code or bypass the permissions.
    Most of the existing malware detection mechanisms use machine learning algorithms
    where permissions, API calls, system calls, system call frequencies, densities,
    co-occurrence matric, and Markov chain state transition probability matrix are
    used as features. The static analysis includes various techniques:


    *   String extraction for the examination of the output.


    *   Scanning with anti-malware scanners.


    *   Disassembling, i.e., reversing the machine code to assembly language and interfering
    with the software logic and intentions.


    In dynamic analysis, the behavior of the software is monitored while it is executed
    in a virtual environment (sandbox), and the properties and intentions of the software
    are inferred from that data.


    Machine learning techniques can be applied in both malware detection and classification
    of malware into families. Signature-based malware detectors can perform well with
    known signatures. However, they may not detect polymorphic malware that has the
    ability to change signatures, as well as new malware with different signatures.
    In malware classification, unknown malware types are clustered into several groups
    on the basis of certain features identified by the machine learning algorithm.


    Behavior-based malware detection in android systems based on crowdsourcing collects
    the system calls from the users and sends it to a centralized server for analysis.
    The server will preprocess the data by creating the system call vector for each
    interaction of the users within their applications.


    Statistical mining technique is another approach for detecting malware applications
    in smartphones. In this case, features such as CPU usage, memory usage, network
    traffic, and battery usage are collected every five s and then stored in a database.


    First, a data set with permissions in well-known goodware and malware applications
    are created. Then, feature selection algorithms are used to select relevant features
    from this data set. Then, the k-means clustering algorithm is used to distinguish
    the malware from the goodware applications. Finally, it classifies the malware
    in the cluster using machine learning algorithms such as J48, random forest, into
    various types such as Trojan and data stealer.


    Hidden Markov model (HMM) can also be employed for malware detection. This method
    is based on the observation that every smartphone application involves a series
    of interactions between the user and the device. Thus, the system call is correlated
    with user operations and can be used to detect malicious activities. It uses process
    state (set of system calls invoked by the application) transitions and user operational
    patterns. The application is classified as malware if the likelihood is less than
    a threshold.


    HMM can also be built with system call sequence as observations and the keypress
    sequence as hidden states. The keypress and the system call sequence generated
    by the application are collected, and the hidden keypress sequence is obtained
    using the Viterbi algorithm.


    Maline is a tool used to detect android malware applications using system call
    dependencies. A feature data set is built from several malware and goodware applications.
    It then uses a machine learning algorithm to determine whether the given application
    is malware depending on these features. One limitation of this approach is that
    it needs a large training data set.


    # [DoS and DDoS attack detection](#toc.xhtml#s37a)


    A denial-of-service (DoS) or distributed denial-of-service (DDoS) attack is a
    malicious attempt to disrupt the normal traffic of a targeted server, service,
    or network by overwhelming the target or the infrastructure with a flood of the
    Internet traffic. A DoS attack exploits a victim machine or network by exhausting
    its bandwidth, memory, and processing capacity. A DoS attack targets the victim
    by generating numerous malicious packets to prevent legitimate users from using
    different services. A DDoS attack is a DoS attack involving more than one computer
    to target a victim in a coordinated manner.'
