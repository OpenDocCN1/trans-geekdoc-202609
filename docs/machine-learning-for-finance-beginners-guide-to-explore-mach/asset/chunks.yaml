    为了解决这个问题，并从原始像素及其数值中学习更复杂的图像特征，使用了 `CNNs`。此外，开始学习计算机图像的一个很好的起点是编程语言 `Python`，它能为你提供这段旅程所需的一切。


    # 计算机视觉中的神经网络


    # 激活函数


    让我们学习一些核心概念，如 `ReLU` 激活函数、数据预处理、权重初始化以及 `CNN` 架构中的 `CNN` 简介。


    `ReLU` 是 `CNNs` 中应用广泛激活函数。如果输入为负，它返回 0。它在计算上非常高效，因为只需要简单的剪裁。根据经验，它被认为比 `sigmoid`
    或 `tanh` 更快。


    # 数据预处理


    所有图像都被转换为相似大小的正方形形状。每张图像的平均值可以从每个像素中推断出来。


    # 权重初始化


    权重可以调整为均值为 0、标准差为 `0.1` 到 `1e-5` 的 `Gaussian` 分布。这适用于浅层网络，例如具有五个隐藏层的网络。在深度神经网络的情况下，小的权重会导致输出值很小，随着你接近末端，值会变得低得多。结果是梯度也变得非常稀薄，最终导致梯度消失。


    # CNN 简介


    第一层将尝试区分边缘并为边缘检测创建模板。随后的层可能会尝试将它们合并为更简单的形式，最后合并成各种物体位置和比例的模型。最后层对齐所有模式的输入图像，最终预测就像所有模板的加权和。因此，深层
    `CNNs` 能够模拟复杂的变化和行为，提供非常精确的预测。一个 `CNN` 包含三层：卷积层、池化层和全连接层。


    # 卷积层


    它们是 `CNN` 架构中使用的主要结构块。


    # 池化层


    它们用于填充卷积层以保持图像大小不变。因此，池化层用于降低图像的幅值。它们通过过滤器在每一层中工作。


    # 全连接层


    网络通常使用全连接层，在这些层中，每个像素被视为独立的神经元，就像普通的神经网络一样。全连接层的神经元数量等于要预测组的数量。


    # 计算机视觉概述


