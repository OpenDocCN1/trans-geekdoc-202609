    - When the assumption of independence is true, the Naive Bayes classifier works
    very well compared to the other models. Much less training data is needed.

    - It performs better when the input variables are categorical rather than numerical.
    In the case of numerical variables, we need to have an assumption that there is
    a normal distribution.

    - For a categorical variable with a category that hasn’t been observed in the
    data set, the model assigns a zero probability, making it unable to generate a
    prediction. This is called zero frequency. The smoothing technique can be used
    to solve this problem. Laplace estimation can be employed to solve it.

    - Naive Bayes classifier is referred to as a bad estimator, i.e., its outputs
    are not considered reliable.

    - The Naive Bayes classifier also assumes the predictors are independent. In a
    real-life situation, it’s nearly impossible for us to get independent predictors.


    # Applications of the Naive Bayes algorithm


    When used for text classification, the Naive Bayes algorithm gives a high accuracy
    compared to the other types of models. It is also used in spam filtering to identify
    spam emails and sentiment analysis (for example, in social media to determine
    positive as well as negative customer comments).


    # Recommendation systems


    The Naive Bayes classifier together with collaborative filtering can be used to
    build a recommendation system that uses data mining and machine learning techniques
    for filtering any unseen data. It can also generate a prediction on whether a
    user will like or reject a resource.


    # Normal distribution


    Normal distribution is also known as Gaussian distribution. This distribution
    is based on the probability of real-valued events that occur from different problem
    domains. A continuous random variable that has a normal distribution is known
    as normal or normally distributed (for example, the heights of people, test scores,
    and marks of students).


    Normal distribution is defined by using two main parameters that mean (`mu`) and
    variance (`sigma^2`). Standard deviation is the average deviation from the mean
    and is denoted by `sigma` as well. Visual representation of normal distribution
    can be seen in the graph below:


    ![](images/2.1.jpg)


    **Figure 2.1**


    In this graph, we can see that Gaussian distribution or normal distribution can
    be identified from the distinctive bell-shaped curve. This can be represented
    in the form of a mathematical formula as shown below:


    ![](images/eq.jpg)


    Normal distribution is currently the most used probability distribution. It is
    used in various fields including marketing, psychology, finance, and economics.
    Because of its fine symmetry properties, normal distribution provides the probability
    of a variable being a given distance below the mean of distribution equal to the
    probability of it being the same distance above the mean. Owing to its reach of
    implementation and interpretation, normal distribution is widely used in the finance
    industry.


    Some of the machine learning algorithms are based on distance and gradient descent
    measures such as k-means and k-nearest neighbor (KNN). These algorithms are quite
    sensitive to the scale of the provided numeric values, and for an algorithm to
    provide an exact solution, rescaling of the distribution is necessary. Rescaling
    usually mutates a range of values and can also affect variance. To perform rescaling,
    we can use statistical standardization (z-score normalization) and min-max transformation
    (normalization) techniques as well.


    Python and R programming languages provide built-in functions for distribution
    transformation. Standardization can also be achieved by using the `scale` function
    (`try help scale`) in the R programming language. To perform the same operation
    in Python, we can consider the `scikit-learn` module preprocessing approach.


    In machine learning, independent variables are also known as features. These are
    the input for a process that is being analyzed, whereas the dependent variables
    are the output of the process.


    # Automatic cluster detection in data mining


    To find meaningful patterns in data, the data mining techniques described in this
    book are used. But sometimes there are no patterns or models to be found. Other
    times, the problem is not a shortage of patterns but an excess. The data can contain
    such complex structures that even the best techniques of data mining cannot coax
    out meaningful patterns. When mining such a database to answer some specific questions,
    competing explanations tend to cancel out each other. Too many competing signals
    add up to noise, as with radio reception.

