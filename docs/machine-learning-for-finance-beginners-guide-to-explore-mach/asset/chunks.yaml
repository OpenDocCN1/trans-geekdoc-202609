    ## About the Author


    **Saurav Singla** is a Senior Data Scientist, a Machine Learning Expert, a Technical
    Writer, a Data Science Course Creator, a Mentor, Speaker, and a Podcaster.


    He has fifteen years of comprehensive experience in statistical modeling, machine
    learning, natural language processing, deep learning, and data analytics.


    He has worked in senior roles for JBSA, Valiance, Siemens, and Harvey Norman.


    He has demonstrated success in developing and seamlessly executing plans in complex
    organizational structures. He has also been recognized for maximizing performance
    by implementing appropriate project management tools through analysis of details
    to ensure quality control and understanding of emerging technology.


    Outside work, Saurav volunteers his spare time for helping, coaching, and mentoring
    young people in taking up careers in the data science domain.


    He has created two courses on Udemy, with over twenty thousand students enrolled
    in it. He regularly authors articles on data science.


    ## About the Reviewer


    **Pedro Lewis Blesa Crucefix** has spent years researching new sources of information,
    data science techniques, and opportunities offered by AI in organizations across
    all industries. Pedro graduated in business, majoring in Strategy from the University
    of Catalonia, and holds a master’s degree in Business Analytics from the University
    of Westminster. He has worked with companies such as Ladbrokes, Disney, and The
    Automobile Association. His most recent experience includes identifying opportunities
    in data extracted from connected cars.


    ## Acknowledgement


    There are a few people I want to thank for the continued and ongoing support they
    have given me during the writing of this book. First and foremost, I would like
    to thank my parents, my wife, and two sons, Aarav and Parth, for putting up with
    me while I was spending many weekends and evenings on writing—I could have never
    completed this book without their support.


    This book wouldn’t have happened if I hadn’t had the support from my publisher,
    BPB Publications. I would like to thank them for giving me this opportunity to
    write my first book for them.


    ## Preface


    The field of mechanical autonomy has significantly progressed with new wide-ranging
    and innovative accomplishments. One is the ascent of huge amount of information,
    which offers a greater chance to incorporate programming ability with mechanical
    frameworks. Another is the use of advanced sensors and associated gadgets to screen
    environmental factors like temperature, pneumatic force and light; the sky is
    the limit. These achievements have helped develop advanced robots for use in assembling,
    health care, security, etc.


    Robots are generally used to perform straightforward and redundant tasks such
    as in vehicle production and in businesses involving hazardous situations. Several
    parts of mechanical technology include human-made consciousness; robots might
    be furnished with what might be compared to human faculties (e.g., vision, touch,
    and the capacity to detect temperature). Some are even fit for basic straightforward
    leadership. Research in mechanical autonomy has led to the design of robots with
    a level of independence that will allow versatility and basic leadership in an
    unstructured domain. The present mechanical robots don’t look like humans; a robot
    with human-like appearance is called an android.


    At present, we are habituated to the Internet in numerous ways in our everyday
    life. For example, to explore an obscure place, we use `Google Maps`. We use social
    media to express our musings or sentiments. Or, to know the latest news, we access
    online websites. If we attempt to comprehend the impact of science in our life,
    we will see that really, these are all applications of AI and machine learning.
    Of late, there has been increased interest in machine learning, and more and more
    people are realizing the extent of new applications empowered by the ML approach.
    It fabricates a guide to make contact with the gadget and make the gadget reasonable
    to react to our reactions.


    ## What this covers


    *Over the nineteen chapters in this book, you will learn the following:*


    **Chapter 1** discusses the process of how machines are taught, and the relation
    between machine learning, AI, deep learning, data mining, and statistics. It then
    focuses on the application of machine learning in the finance domain.


    **Chapter 2** discusses `Naive Bayes`, `normal distribution`, and automatic cluster
    detection with `Gaussian process` in depth. It then focuses on the application
    of machine learning in the cybersecurity domain.


    **Chapter 3** discusses the difference between structured and unstructured data
    and how advanced ML tools have helped businesses make quicker decisions. It then
    focuses on how ML tools are helping business put data in order so that it can
    be processed properly and in a more orderly manner.


    **Chapter 4** gives a tour of `NLP`, and it reviews the advantages and applications
    of `NLP`.


    **Chapter 5** is a key chapter as it discusses, in depth, computer vision and
    its applications. It then reviews the neural network architecture of computer
    vision. It then also discusses the application of computer vision in image recognition,
    biometric recognition, and software vulnerabilities.

