  trans: '


    **答。** 机器学习指的是机器通过算法帮助来学习和适应的能力，这些算法允许机器在没有显式编程的情况下做出预测并产生行为。大多数人认为机器学习是人工智能的一个子集，因为它代表了机器或人工智能智能体可以赋予的一种智力能力。


    在这方面，机器学习可能与分析型人工智能关系最密切，因为它涉及认知能力，而不具备某些人工智能智能体所赋予的类人的情感和社会智能特质。理解机器学习至关重要，因为它允许人们研究人工智能，并感知人工智能智能体如何随着时间的推移进行学习并改变其性能。


    ## 11. 什么是深度学习？


    **答。** 深度学习是机器学习的一个领域，它指的是一种分层算法，这些算法允许机器检测信息并以复杂的方式对其进行处理。深度学习模型基于所谓的人工神经网络，这种计算机系统的创建灵感来源于人脑的功能。人脑也以分层或重叠的方式处理信息，这使得设计成模仿大脑的网络具有人类大脑的一些基本特征。


    ## 12. 人工智能已经存在多久了？


    **答。** 能够以类人方式或其他独立方式思考的人工有机体或机器的概念已经存在了数千年。古希腊人描述过一种名为塔洛斯（Talos）的自动机器，它是由神赫菲斯托创造的，能够独立行动并攻击人类。也许这就是危险人工智能智能体想法的起源。作为一个研究领域，人工智能被认为可以追溯到
    20 世纪 50 年代。计算机在 20 世纪 40 年代变得突出且重要，而人工神经元的首次提到追溯到 1943 年。


    人工智能的研究始于 1956 年在新罕布尔州达特茅学院举行的一次研讨会。这次研讨会涉及能够参与游戏和学习的计算机演示。在这一早期，人工智能的研究很大程度上得到了美国国防部等政府机构的资助，尽管随后资金大幅减少，直到在
    20 世纪 70 年代和 80 年代才重新恢复。这种复苏与计算机技术在现代生活中应用的日益增加有关。


    ## 13. 为什么人们对人工智能的进展如此担忧？


    **答。** 关于为什么人工智能的进展是许多人恐惧的源头，有很多论点。这种担忧本质上源于一种恐惧：如果人类被地球上最智能、最强大的智能体所取代，那么我们自身的生存可能会受到威胁。事实上，作为人类，我们将自己的一些动机、思维过程和行为投射到运行着人工智能的机器上。


    简而言之，我们假设人工智能智能体的行为将与人类的行为一样。人类可能喜欢想象自己的行为对世界是有益的，但人类经常从事一些不仅对其他物种有害，对我们自己物种以及世界本身也有害的行为。长期以来，人们倾向于赋予人类创造的技术以人类的特质，对人工智能的至少部分担忧就源于此。


    ## 14. 对人工智能的担忧是合理的吗？


    **答。** 毫无疑问，我们每天理解人工智能是多么奇迹的能力每天可以（并且将会）不断增长。当我们理解人类大脑是如何运作的（包括神经网络）时，我们不断被这种想法所吸引：我们设计的智能体能够比人类思考得得多，而且可能更具逻辑性，即使我们以各种方式限制了这些智能体。人工智能智能体能够在象棋和围棋等游戏中击败人类，而且它们似乎在人类知道自己在做什么或为什么要这样做之前，就能预测人类的思想和行为。对
    AI 的担忧是合理的吗？绝对合理！


    ## 15. 使用人工智能的机器有一天会统治世界吗？


    **答。** 许多科幻作家、剧作家和电影导演都对这一想法进行过推测，即人工智能有一天会对人类构成某种威胁。即使当古希腊人想象由赫菲斯托斯制造的自动机器时，他们也认为这些自动机器代表了对人类的某种威胁。也许将环境感知为充满了需要被或至少在某些方面受到限制的威胁是人类的本性。


    坦率地说，很难说人工智能智能体有一天是否会统治世界。如果你看过《黑客帝国》，那么你可能认为人工智能智能体已经统治了世界，而你目前正在经历一种机器引发的幻觉。无论你相信什么，现实是人工智能已经是我们生活的一部分。也许一个人工智能接管的世界与我们现在居住的世界并不相似（不，我不是指《黑客帝国》那种方式）。


    ## 16. 所谓的“奇点”到底是指什么？


    **答。** 奇点（Singularity）是描述涉及人工智能机器的假设性未来事件的术语。奇点本质是指人工智能智能体的智能超过全人类集体智能的未来点。这代表了一个不可逆转的事件，将永远改变人类文明和地球生活的进程。


    围绕奇点的许多恐惧与这样一个现实有关：许多人对计算机、机器和人工智能持怀疑态度。许多人赋予机器、计算机和人工智能人类的特质。他们认为，一个基本上是某些人所谓的“全知”的智能体可能会认为人类是对生命、宇宙或机器本身的一种威胁，因此会对人类采取行动。运行在对奇点发生的恐惧中的根深蒂固的想法是：人工智能智能体将得出某种形式的必然结论。


    ## 17. 机器学习为什么非常重要？


    **答。** 机器学习（以及更复杂的深度学习分层过程）涉及机器根据其与环境的交互对其自身的结构或程序进行更改。这种学习在人工智能程序中很重要，因为某些类型的任务可能需要程序通过学习才能有效地完成任务，即使在已经编程的情况下。


    例如，想一下如果人类不能从过去的行动中学习，那么他们完成挑战性游戏或谜题的能力会有多糟糕。赋予人工智能智能体学习的能力本质上改进了程序的功能。学习还涉及理解环境中事物之间的相关性，人工智能智能体以
    `.dat` 文件或其他数据形式存储这些信息。这些数据可以被人类访问以进行数据挖掘。


    ## 18. 量子计算机与人工智能之间有什么关系？


