  trans: '


    您的在线简介可能包含流氓窃取您的身份信息所需的所有数据。通过删除个人数据来防止这种情况。对于未在您的网络社交页面上显示的资金记录安全查询，请提供回复。


    # 安全措施


    信用卡/借记卡很有用，但也充满危险，因为诈骗者想出了了一些创意策略来提取个人数据。鼓励您保持警惕，并采取适当措施维持这种状态。


    # 关于卡片安全的建议


    *   尽快在卡片背面签名。

    *   尽量不要让任何其他人使用您的卡片、`NAB ID` 或验证设备。

    *   随时留意卡片的位置，防止其受意外损坏或丢失，并注意家居安全。

    *   注意网络上的卡片欺诈和安全问题。你不希望身份被盗用。

    *   在 ATM 机处牢记您的卡片和收据。如果卡片丢失或被盗，请及时通知供应商。

    *   卡片过期后，将其斜着从中间切断（包括卡片上嵌入的微芯片、磁条和安全代码）。

    *   如果认为出现异常，尽量不要使用 ATM 机。


    # 网上银行安全提示


    *   对安全兴趣点保密，不要将它们记录并与卡片存放在一起。

    *   如果可能，请保留您的详细信息。银行绝不会在网上要求安全详情，因此请忽略任何看似来自银行并要求您输入兴趣点的消息。

    *   尽量不要让任何人有机会看到您输入密钥或 `PIN`。

    *   万一您丢失或忘记了密码或 `PIN`，或者被他人使用，请立即通知银行。

    *   避开易于识别的数字或字母组合，或与您身份有效识别的组合，例如您的生日、电话、邮政编码等。

    *   频繁更改您的 `PIN` 和密码。联系供应商查看他们提供哪些安全亮点。


    # 结论


    金融部门是最脆弱的，或者我们应该说它是欺诈的热点目标，仅仅是因为钱。应该使用电子系统了解客户（`eKYC`）并妥善采取安全措施以避免欺诈。


    在下一章中，我们将学习数据挖掘、数据可视化及其用途。


    # 第 13 章


    # 数据挖掘与数据可视化的用途


    # 引言


    数据来自各种领域，如追踪设备和信用卡，由于人们认为这些有用，数据一直在被收集。挑战在于从所有这些数据中定位有用的信息。这是一项艰巨的任务，而数据挖掘正派上用场。


    为了让数据挖掘具有价值且高效，让人类参与数据发现过程是非常重要的。数据挖掘中视觉发现的概念是描述原始可视化数据。人类随后将理解、得出假设并与证据互动。


    # 结构


    在本章中，我们将涵盖：

    *   数据挖掘

    *   数据可视化

    *   未来的医疗保健

    *   教育

    *   客户关系管理

    *   刑事调查

    *   反欺诈检测

    *   客户细分

    *   入侵检测


    # 目标


    学习本章后，您应该能够：

    *   理解数据挖掘和可视化的概念

    *   理解数据挖掘和可视化的应用


    # 数据可视化


    数据可视化是一种使用图表和图形等视觉要素来展示数据背后的事实并得出有意义见解的方法。


    # 数据挖掘


    数据挖掘是企业用于将原始数据转换为可用信息的方法。通过使用算法搜索大量数据，公司可以更深入了解客户，从而创建成功的营销活动、增加收入并降低成本。


    # 未来的医疗保健


    数据挖掘和可视化在医疗系统中显示出巨大的潜力。医疗系统使用多维数据库、软件计算和机器学习来预测患者人数。


    # 教育


    数据挖掘和可视化可用于教育环境中通过学习行为和推进科学知识来预测学生的未来。


    # 客户关系管理


    客户关系管理是获取和留客户的好方法。通过数据挖掘和可视化技术，收集的数据可用于分析，使企业能够轻松识别问题并针对重点领域找到解决方案。


    # 刑事调查


    犯罪学是对某些犯罪特征的研究。海量的犯罪数据集可以显示某些领域之间的关系，基于文本的犯罪可以转换为文字处理文件。


    # 反欺诈检测


    欺诈是一种涉及数十亿美元的犯罪。虽然传统的欺诈检测方法在某些情况下有效，但它们耗费时间且相对复杂。数据挖掘和可视化可以通过将信息转换为具有洞察的数据来提供有意义的模式。任何在犯罪检测中有效的信息都被视为知识。需要注意的是，欺诈检测系统应该保护所有用户的信息。数据挖掘和可视化有助于收集样本记录，然后将其分类为欺诈或非欺诈。例如，数据挖掘旨在定位数据源（如网络采集）。


    # 客户细分


    客户细分是业务中非常重要的一部分，不应被忽视。传统市场研究的使用有助于细分客户，但数据挖掘的使用要深入得多，并通过提高市场有效性提供帮助。数据挖掘可以将客户对齐到更独特的细分市场中，同时根据他们的评论量身定制。在业务中，市场涉及获取和留住客户，这应该以最有效的方式进行。通过数据挖掘和可视化，您可以轻松确定客户的脆弱性，企业可以为他们提供特殊功能以增强他们的满意度，并保持他们的参与和兴趣。


    # 入侵检测


