  trans: '


    银行进入 AI 领域的另一种途径是投资 AI 初创公司。如今，在瞬息变化的技术格局中，银行正呈现出收购金融科技初创公司的日益增长趋势。2017 年，摩根大通（JPMorgan
    Chase）收购了 `WePay`，这是一家专注于小企业的美国支付公司，旨在为其四百万小微企业客户提供 `WePay` 的支付技术。2016 年，美国金融服务公司
    `Ally Financial` 收购了数字财富管理公司 `Trade King`。2018 年，加拿大的 TD 银行购买了其第一家技术公司，即一家基于 AI
    的初创公司 `Layer 6`。该银行的主要目标为客户提供个性化服务。


    银行必须与其它提供个性化客户体验以及金融服务的行业竞争。客户期望银行能够预判他们的需求和偏好。随着银行在数字化转型转型程中前进，银行将拥有大量的数字数据。AI
    可以将孤立的客户互动转化为无缝的客户体验链。


    银行业面临着来自金融科技、电子商务、科技巨头和电信公司的竞争，其愿意探索并实施 AI 的背后有两个底层动机：一是降低服务客户的成本，二是通过个性化提升客户体验。


    银行可以通过合作伙伴关系、收购或内部开发来采用 AI。没有一种策略可以适用于所有的金融机构。


    ## 不同 AI 技术的开发状态


    请看下图：


    ![](img/9.4.jpg)


    **图 9.4：** 2017 年银行业 AI 投资理解（来源：Celent）


    上图中的“计划”意味着银行在未来十二个月内有一项获得资金支持的实施项目。根据最近的一些趋势，我们可以观察到，银行在投资和采用 AI 方面还没有清晰的路线图。对于想要开启这段旅程的新手银行来说，监督学习可以作为第一块垫石。它是最常见的机器学习类型。银行也可以探索协作方法。


    一种方法是银行研究 AI 采纳成熟用例。每家银行都必须根据自己的业务战略启动旅程。银行在技术门槛上处于什么位置？银行是否已经具备数据分析能力？如果没有，这些是开启
    AI 之旅至关重要的基石。


    这里展示了“必做”用例实施者相对于低实施者的平均收益：


    ![](img/9.5.jpg)


    **图 9.5：** （来源：Capgemini）


    Capgemini 最近的一项调查明确显示，“易于摘取”的方法为银行（尤其是销售和客户获取方面）带来了收益。


    银行需要根据自己的资源和业务计划规划自己的路径、节奏和终点。如果一家银行想要启动内部 AI，它将需要愿景、人才招聘、技术孵化，以及从开发到部署的大量时间。另一个选项是寻求
    AI 初创公司的外部帮助，这些公司理解银行的文化和需求，并据此开发必要的 AI 模型。银行也在投资 AI 初创公司，这使得初创公司成为银行的一部分，从而在共享敏感银行数据的同时降低与第三方供应商相关的风险。此外，这为银行带来了创新文化。而对于
    AI 初创公司而言，他们现在会将银行视为其组织的一部分，而不是一个客户。


    因此，底线是银行需要看到 AI 的成本效益。对于无法在客户留存、削减成本或客户导入方面获得收益，他们对巨资投入 AI 持怀疑态度。银行确实需要意识到，无论他们是否采用，AI
    都是未来的技术，所有的竞争对手都在采用它。当我们说竞争对手时，我们指的是在实验和采用 AI 方面远领先的金融科技公司。AI 成为银行业务的一种只是时间问题。


    高层银行需要对各种 AI 技术——机器学习、预测性分析、自然语言处理（NLP）、机器人流程自动化和智能虚拟助手——有了解，以及这些技术可以应用于从客户服务到风险管理的银行流程。银行需要理解应用
    AI；在应用解决方案中使用这些技术需要强大的数据分析基础。


    ## 风险管理


    由于对安全和性能的高要求，处理金融任务往往变得困难。首先，在金融领域实施 AI 时，数据科学家和机器学习工程师必须进行深入的研究和评估。金融信息系统拥有海量数据，系统能够处理大量交易而不任何延迟。为金融领域设计的算法高度可靠，并经过测试在任何情况下都能交付
    100% 的结果。此外，它们还可以管理结构化和非结构化数据，并快速识别可能的失败原因。


    ## 欺诈检测与预防


    AI 和机器学习模型具有检测欺诈活动并实时停止意外操作。。，银行和金融机构已将 AI 模型应用到他们的系统和数据库中。欺诈检测系统能够分析客户的位置、行为和信用历史。


    洗钱等欺诈活动也可以通过 AI 模型来避免。机器的设计旨在终结所谓的洗钱计划，并保护金融和政府机构免受任何意外损失。


    ## 提高金融规则和设计的真实性


    机器学习对金融行业有重大影响。机器学习的优势包括交易、贷款承保和投资组合管理欺诈检测。根据《承保的未来》报告，机器学习促进了数据评估，以评估和发现细微差别和异常。这有助于提高原则和单位的准确性。


    ## 交易


    AI 和机器学习模型基于统计学的概念和理论。全球股票市场的交易正在大幅扩大，交易员正利用 AI 工具获得快速且最佳预测和建议。智能交易系统能够监控结构化和非结构化数据库。在结构化数据库中，我们可以获得来自表格或其他数据库的数据，而在非结构化类别中，数据来自社交媒体或新闻等来源。


    交易算法基于 AI 模型并根据市场状况进行预测和计算。机器学习算法在过去的数据和交易历史上进行训练，使其能够提供准确的洞察和预测。此外，这项技术大大改进了验证过程，帮助交易员毫无烦恼地获取有关交易的信息。


    在银行领域，AI 驱动了智能机器人，为客户提供实时答案和解决方案。语音控制助手现在已经引入，具有自教育功能，并且每天变得越来越聪明。有不同的 AI 应用和工具提供个性化的财务建议，并支持个人解决任何财务问题。这些智能工具还可以跟踪收入、经常性支出并计算消费习惯。另一方面，AI
    融工具也可用于获取优化计划并获得财务支持。


