    与传统的卷积前馈网络一样，你的 `CNN` 将使用随机梯度下降进行训练，并在稠密层中使用 dropout 策略以防止过拟合。因此，你将针对感染阶段进一步对
    `CNN` 进行调优，初步结果将表明，该神经网络的性能远优于经典的机器学习方法，例如贝叶斯分类技术或向量机。


    此外，百度和谷歌的一些最新工作表明，`CNNs` 具有极高的准确率，在某些任务上，它们甚至优于人类。看起来 `CNNs` 确实可以对即将到来的某些未来技术产生巨大影响。


    # 图像识别 (#toc.xhtml#s76a)


    机器学习模型应用之一是对数据进行排序和分类。这种模型甚至可以用于图像分类。搜索引擎使用此类算法来识别照片，社交媒体网站现在在照片被标记之前，就会使用人脸识别来识别照片中的人物。它们通过从其他照片组成的数据中学习。如果你的社交媒体账户可以识别新照片中的你的脸，那是因为利用你账户中所有其他照片的数据创建模型。


    图像识别技术需要深度学习模型。这些模型是用人工神经网络创建的，将在本书的后部分详细讨论。深度学习是机器学习中最复杂的一种类型，数据通过多个隐藏层节点进行过滤。它们之所以被称为隐藏层，是因为模型是无人参与的，这意味着模型识别的特征不是由数据科学家预先选择的。通常，特征是模型自行识别的模式。神经网络中识别的函数可能非常复杂；任务越复杂，模型的层数就越多。图像排序模型可能只有两或三层，而自动驾驶汽车则在一到两百层隐藏层之间。


    得益于计算能力的可用性提高，近年来我们在这一领域取得了长足进步。想象一下将成千上万个数据点通过数百个堆叠节点同时运行所需的计算能力。随着计算机的改进和处理海量数据成本的降低，深度学习和人工神经网络在过去十年中变得更具可行性。无疑，随着云出现，数据科学家可以在不使用物理存储空间的情况下访问海量数据。`ImageNet`
    是一个网站，对对图像分类和神经网络的数据科学家来说是一个极佳的资源。它是一个公开访问的用于机器学习的图像数据库。其理念是，通过将其公开，世界各地的数据科学家可以合作改进机器学习技术。


    `ImageNet` 数据库拥有约 1400 万张照片，包含 21,000 可能的类别组。这为数据科学家提供了巨大的机会，可以访问并分类照片，以学习和实验神经网络。


    每年，`ImageNet` 都会为全球数据科学家举办竞赛，创建新的图像分类模型。竞争逐年变得日益激烈。现在他们开始转向分类视频而非图像，这意味着复杂性和所需的处理能力将继续指数级增长。通过使用数据库中的数百万张照片，`ImageNet`
    竞赛近年来在图像识别领域取得了突破性进展。


    现代照片分类模型需要运行非常特定的方法。即使两张图像被归为同一类，它们看起来也可能完全不同。你如何建立一个能够区分它们的模型呢？看下面的图片：


    ![](img/5.1.jpg)


    图 5.1 这是两张不同的树的照片


    # 生物特征识别 (#toc.xhtml#s77a)


    随着当今技术渗透到现代生活的每一个角落，保护个人数据已变得至关重要。生物识别技术通过对生理或行为数据应用统计分析，将我们的身体作为一种天然的识别系统。现在我们正处于生物识别领域的技术革命时代，广泛的研究和产品开发正在进行，以充分利用这一令人兴奋技术的全部优势。


    生物识别涉及测量生理或行为信息以验证个人身份，因此它是准确且可靠的。


    任何生物识别系统都涉及两个不同阶段：入历（注册）和验证（身份认证）。如果建立了正向匹配，用户将获得对系统或服务的权限或访问权。在个人识别的情况下，需要根据查询的生物识别模板对整个数据库进行搜索。个人识别系统的一个很好的范例是自动指纹识别系统
    (`AFIS`)，它被许多执法机构用于识别和跟踪已知犯罪分子。

