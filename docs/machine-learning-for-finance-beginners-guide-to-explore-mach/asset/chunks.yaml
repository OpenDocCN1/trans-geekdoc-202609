    在本章中，我们讨论了 NLP 作为将大量信息转换为人类可以理解的数据的重要工具。我们还讨论了 NLP 在招聘、语音助手、医疗、调查分析、语法检查、邮件过滤、社交媒体监控和在线搜索中的应用。


    在下一章，我们将学习计算机视觉。


    # 第 5 章：计算机视觉


    ## 引言


    我们已经知道人类的视觉是极其先进的。当你睁开眼睛时，在几分之一秒内就能看到周围的每个细节和物体。我们可以立即检测并识别视野范围内的物体，无需任何犹豫或预设。


    我们还能命名周围的每一个物体，并非常准确地感知这些物体的深度，我们可以完美地区分物体轮廓并检测和识别背景中的各种物体。我们的眼睛接收各种颜色数据的原始体素，我们的大脑将这些数据转换为相关且有意义的信息。因此，颜色信息将被感知为不同的线条、形状、曲线等，这些可能指示我们正在看什么，例如物体、人、建筑等。

