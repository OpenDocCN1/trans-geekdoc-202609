  trans: '


    聚类提供了一种学习复杂数据结构的方法，将竞争信号的嘈杂干扰分解为各个部分或组成部分。当人类试图给复杂问题赋予意义时，我们自然或习惯倾向是将主题分解成小块，每个小块都可以用更简单的方法解释。如果有人要求描述森林中树木的颜色，那么冬季、春天、夏天和秋天的答案可能会不同。人们可能对林地植物有足够的了解，从而预测出形成遵循相似颜色规则的树聚类的最佳因素是与森林相关的数百个变量：季节、叶片等，而不是高度和年龄。在建立适当的聚类后，通常可以在每个聚类中识别出简单的模式。“落叶树在冬天没有叶子，所以树木往往呈棕色，”或“落叶树的叶子在秋季会变色，通常变为橙色、红色和黄色。”在很多情况下，非常嘈的数据集仅仅由若干表现更好的聚类组成。


    问题是，这些聚类是如何被发现的？这就是自动聚类检测策略大显用场的地方——帮助看到森林而不至于迷失在林中。


    k-means 使用的几何思想提出了更通用的相似性、关系和距离测量问题。这些距离测量对数据表示的变化非常敏感，因此下一个讨论的主题是聚类数据规划，特别关注了缩放和加权。k-means
    并不是用于自动聚类检测最广泛的算法。


    # 寻找简单岛屿


    数据挖掘技术被分为直接的或无向的，而自动聚类检测被定义为一种用于发现无向数据的工具。这在技术上是成立的，因为自动聚类检测算法本身仅仅是发现数据中出现的结构，而不考虑任何独特的目标变量。大多数数据挖掘任务始于一个预分类的训练集，该训练集用于创建一个能够对以前未见过的数据进行评分或分类的模型。聚类算法寻找由相关记录组成的记录组——即聚类。这些相似性是由算法发现的。由运行研究的人员来决定相似的文档对业务是否有意义，还是某些神秘且可能不重要的东西。然而，聚类可能是更广泛背景下的一个专注的实践。为业务目的而开发的聚类在营销中通常被称为“细分”（segments），聚类是客户细分的一种常用方法。自动聚类检测是一种数据挖掘技术，很少孤立使用，因为聚类发现并不总是为了其本身。当观察到聚类时，必须利用其他方法来决定聚类代表什么。当聚类成功时，结果可能是戏剧性的。聚类检测的一个著名的早期应用导致了我们目前对恒星演化的理解。


    # 月光，亮星


    20 世纪初，天文学家试图解释恒星亮度（光度）与其温度之间的关系，绘制了如下所示的散点图。两个天文学家，来自丹麦的 `Enjar Hertzsprung`
    和来自美国的 `Norris Russell`，在大同一时间考虑这样做。他们都观察到星星在生成的散点图中落入三个聚类。这一发现导致了进一步的研究，并让我们理解到在恒星生命周期非常不同的阶段，这三个聚类反映了恒星。下面的图像说明了每个聚类内部亮度与温度之间的关系：


    ![](img/2.2.jpg)


    图 2.2


    每个聚类内部亮度与温度的关系是类似的，但聚类之间的关系是不同的，因为热和光是由根本不同的过程产生的。通过将氢转化为氦，80% 的恒星在其寿命的大部分时间内处于主序上。氢在几十年后会被耗尽。然后恒星开始融合氦，或者融合停止，取决于它的质量。在后的情况下，恒星的核心坍缩，产生红巨星。现在这颗恒星是白矮星。搜索术语
    `Hertzsprung-Russell Diagram` 会返回数千页关注此类聚类的天文学研究报告。即使在今天，基于 HR 图的聚类仍用于寻找棕矮星（质量不足以引发核聚变的天体）以及考虑恒星演化的主序前阶段。


    # 赫兹斯普鲁格-塞尔部队


    如果目标是为他们量体衣服，我们需要更多的测量数据！20 世纪 90 年代，美军进行了一项关于如何重新设计女军服的研究。军队的目标是减少库存中不同制服尺寸（按身高）的数量，同时为每位士兵提供合身的制服。正如任何买过女装的人所知道的，已经有许多分类结构（包括尺寸、特殊尺寸、大号码、童装、小号码等）。这些系统中没有一个是根据美军的需求开发的。康奈尔大学的研究人员
    `Susan Ashdown` 和 `Beatrix Paal` 回到了基础；他们根据军中女性的真实形状设计了一套新尺寸。


    上面的地图提供了人们形状的粗略图。下面的图是另一个例子，展示了青少年如何将他们的身高和体重映射为线上的点。注意男孩和女孩是如何混合的：


    ![](img/2.3.jpg)


    图 2.3


    '
