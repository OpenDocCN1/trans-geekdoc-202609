    \ have artificial intelligence software that records purchases, product views,\
    \ or other behavior and makes predictions and suggestions on the basis of that\
    \ data. In this way, artificially intelligent agents may display some aspects\
    \ of human behavior while still being (at least, at present) stand-ins for humans:\
    \ completing essentially human tasks rapidly and reliably. In short, the agents\
    \ of today are clearly programs that are distinct from human beings.\n\n4.  **Are\
