    一些基于 URL 的特征包括 URL 中的数字个数、URL 总长度、URL 中的子域名数量、拼写错误的域名、使用的顶级域（TLD）等。一些基于域名的特征包括域名或其
    IP 地址是否出现在已知的黑名单服务中、域名年龄、域名类别、注册人名称的可用性等。一些基于页面的特征包括全局和国家 PageRank、在 Alexa 前 100
    万个网站列表中的排名、该域名每天、每周或每月的估计访问量、每次访问的平均页面浏览、平均访问时长、各国的网络流量形状、来自社交网络的引用数量、相似网站的存在等。一些基于内容的特征包括页面标题、元数据标签（meta-tags）、隐藏文本、正文文本、图像、视频等。


    因此，用于钓鱼页面检测的常用特征包括其 URL、PageRank、SSL 证书、Google 索引、域名以及基于网页源代码的特征。然而，这些特征具有局限性。托管在免费网络托管服务上的网页永远不会包含合法网页具备的某些相关特征，如
    PageRank、域名年龄、SSL 证书和 Google 索引。另一方面，黑客可能利用黑帽 SEO 技术（如关键词堆砌）来推广其钓鱼页面，以使钓鱼页面获得更高的索引。此外，通过第三方工具（如网络点击器应用程序）可以增加网站的入流量，在几分钟内产生数千次页面浏览。


    钓鱼页面检测是一个监督分类问题。在训练阶段，我们需要包含钓鱼页面样本和合法页面样本的标记数据。我们使用的训练数据集是构建成功检测机制的重要组成部分。因此，我们必须使用类别精确已知的训练样本。Phish
    Tank 是一个著名的钓鱼网站公共数据集。网站信誉服务可用于收集合法网站。机器学习技术如 `SVM`、`decision tree` 和 `Naive Bayes`
    已用于钓鱼页面检测。


    # 恶意软件检测


    恶意软件（malicious software）是指任何故意设计用于对计算机系统和网络造成损害的软件。恶意软件可以下几类：


    - `Virus`：在未经用户许可的情况下加载并运行的恶意软件，它可以自我复制并感染其他软件。

    - `Worm`：这种恶意软件与病毒非常相似但与病毒不同的是它可以在网络上传播并自动复制到其他机器上。

    - `Adware`：这种恶意软件在计算机上显示广告。

    - `Spyware`：这种恶意软件执行间谍活动。

    - `Rootkit`：这种恶意软件允许攻击者以 root 权限访问用户的系统和网络。

    - `Backdoor`：这种恶意软件为攻击者为系统提供了一个额外的秘密入口。

    - `Keylogger`：这种恶意软件记录用户按的所有按键，并捕获包括密码、信用卡号在内的所有敏感数据。


    现有的恶意软件检测机制分为静态、动态或混合（静态和动态的结合）。静态分析利用软件源代码的特征，如 `signatures`、`API calls`、`function
    calls` 和 `permissions`，在不执行软件的情况下检测其恶意本质。另一方面，动态分析是在软件执行时（理想情况下在虚拟环境中）进行的。恶意软件可以使用加密或混淆的源代码轻易绕过静态检测机制，或绕过权限。大多数现有的恶意软件检测机制使用机器学习算法，其中
    `permissions`、`API calls`、`system calls`、`system call frequencies`、`densities`、`co-occurrence
    matric` 和 `Markov chain state transition probability matrix` 被用作特征。静态分析包括多种技术：


    - 用于检查输出的 `String extraction`。

    - 使用 `anti-malware scanners` 进行扫描。

    - 反汇编（`assembling`），即将机器码反转为汇编语言。

