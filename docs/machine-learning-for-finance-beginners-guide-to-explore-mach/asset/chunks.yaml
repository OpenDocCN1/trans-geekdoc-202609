    在本章中，我们将涵盖以下主题：


    *   欺诈检测。

    *   成本削减。

    *   客户服务。

    *   风险管理。

    *   网上银行。


    # 目标


    学习完本章后，你应该能够做到：


    *   理解人工智能在银行业务中的应用。


    # 欺诈检测


    对于许多金融机构，尤其是银行来说，如果想要赢得客户的忠诚和信任，安全一直是他们必须解决的首要关注问题之一。人们对黑客攻击和欺诈一直存在恐惧，这可能导致金融机构遭受毁灭性打击。在人工智能的帮助下，银行管理层可以降低身份身份事件、欺诈尝试和其他盗窃尝试的发生率。人工智能通过对不同趋势的洞察进行准确解释，可以减少欺诈尝试。它是监督学习和无监督机器学习的结合体，这种组合可以判断交易是否具有欺诈倾向。


    随着越来越多的金融机构向数字化转型，支付欺诈正处于快速增长。这类攻击具有数字足迹，这使得它们变得隐形。通过人工智能，银行可以安装一个安全层来保护自己免受任何欺诈尝试。人工智能会监控任何趋势的偏离，即使欺诈是在大规模范围内进行的，也能迅速检测到。这让银行在对抗欺诈尝试和保障储蓄方面处于优势地位。通常情况下，银行使用预测性分析。


    # 成本削减


    降低运营成本是人工智能在银行业务中的另一个优势。在这里，大量时间被花费在识别、数字化和入职文档模板上。在数字化化的帮助下，银行可以减少完成这些繁琐任务所需的时间。如果你作为一名银行家能够将分支机构的数字化过程自动化，就可以大幅减少员工在相同流程上花费的时间。通过这种方式，你可以缩短周期并将员工重新分配到其他重要项目中。


    # 客户服务


    客户服务领域是另一个可以通过人工智能工具改进的领域。客户体验影响着全球几乎每一家业务，包括银行业。它影响了人们通常感知特定机构的方式。对于银行来说，人们即使在银行因假期关闭时也希望能够获取自己的资金。他们更倾向于提供快速交易服务的银行。以这样人为例：某人正在和家人度假，现金用完了，必须取出
    1000 美元。他去 ATM 机，结果由于某种未知原因卡片被吞了。此时是午夜，银行没有员工在岗。这就是人工智能驱动的聊天机器在引导客户和解决其问题方面发挥重要作用的地方。聊天机器人不需要，也不受任何时区的限制，因此它们可以随时随地为客户提供帮助。


    现在几乎每个在线业务都有聊天机器人，所以你可能会怀疑你正在交互的是简单的聊天机器人还是人工智能驱动的聊天机器人。这两类聊天机器人之间存在巨大差异。大多数企业部署在其网站上的简单聊天机器人是静态的。在向其输入后端数据之前，它不会通过自己的经验进行学习。然而，人工智能驱动的聊天机器人可以通过客户的互动进行学习，这有助于改进它们，并而提升客户体验。聊天机器人的一个绝佳例子是美国银行的虚拟财务助手
    `Erica`。你可以要求她向你发送信用分的推送通知，并帮助你在线支付账单或进行在线金融交易。


    # 风险管理


    在保障金融交易方面，信用卡带来了问题。人们总是担心会发生欺诈或恶意交易。减轻这种风险的最佳方法是对潜在客户进行彻底分析，以确保身份验证的是正确的人。人工智能可以帮助你对客户进行实时识别，从而帮助银行业节省原本会浪费在欺诈行为上的数百万美元。你还可以部署人脸识别扫描、虹膜扫描和语音识别等多种技术。


    # 网上银行


    这是另一个人工智能可以帮助你的领域。人工智能彻底改变了客户体验和银行的概念。移动银行的一个重要特征是其无处不在。


    人工智能对银行业的影响是深远的，而且尚未被充分探索。由于机器学习，银行正在经历许多创新。未来几年这些可能会取得进一步进展。


    # 总结


    在本章中，我们讨论了人工智能在银行业中的应用。下一章将介绍机器学习算法。


    # 第 18 章


    # 常见机器学习算法


    # 引言


    机器学习是一种让计算机自己学习的过程。现在，你可能会想，我们到底为什么要要求机器人自己学习呢？是的，这有很多好处。机器学习的应用非常广泛，它们得益于世界各地传感器产生的大量数据、低成本的存储以及最低的计算成本！


    # 结构


    在本章中，我们将涵盖以下主题：


    *   回归。

    *   k 均聚类。

    *   k 最近邻算法 (`KNN`)。

    *   主成分分析 (`PCA`) 算法。

    *   多项式拟合和最小二乘法。

    *   强制线性回归算法。

    *   支持向量机 (`SVM`) 算法。

    *   条件随机场 (`CRFs`) 算法。

    *   决策树算法。


    # 目标


    学习完本章后，你应该能够做到：


    *   理解传统的监督学习和无监督机器学习算法的概念。


    # 回归


    回归技术属于监督学习范畴。它们根据一组先验信息预测或描述给定的数值，例如根据类似特征之前的成本信息预测物业成本。回归技术从简单（线性回归）到复杂（正则线性回归、多项式回归、决策树、随机森林回归和神经网络等）不等。


