- raw: 'The biological characteristics used for identification or authentication should
    be quantifiable or measurable, as only quantifiable characteristics can be compared
    to obtain a Boolean result (match or non-match). The different components in a
    generic biometric system are sensors or data acquisition modules, preprocessing
    and enhancement module, feature extraction module, matching module, and the decision-making
    module. Capturing the user’s biometric trait for authentication is performed by
    the data acquisition module, and most of the time the captured data will be in
    the form of an image. The quality of the acquired biometric data needs to be improved
    for better matching performance in the preprocessing stage. The salient features
    are then extracted from the enhanced biometric data in the feature extraction
    stage. The resulting feature template is stored in the database, and it is used
    for future comparison with query biometric templates in the matching stage. The
    final decision of the comparison is taken by the decision module based on the
    match score obtained.


    Biometric-based authentication or person identification is currently used in various
    applications, and its main advantages include the following:


    *   Biometric systems are based on who a person is or what a person does, not
    on what a person knows (password, PIN) or what a person has (token, smart card).


    *   Biometric systems use a physiological or behavioral characteristic for authentication.
    It is unique and accurate as the duplication of a person’s biological characteristic
    is rather difficult.


    *   Stealing of the biometric data and its re-usage is difficult. Users are relieved
    from the need to remember passwords, and forgery can be minimized as biometric
    features cannot be shared.


    There are some important characteristics of biometric traits that need to be analyzed
    before fixing the appropriate biometric trait to be used in a given application.
    The different characteristics of a biometric trait that need to be taken under
    consideration are as follows:


    *   **Universality:** The selected trait should be possessed by almost all individuals.


    *   **Inter-intra-class performance:** There should be sufficient distinctive
    features between the inter-class templates (templates of two different individuals).
    Intra-class templates (templates of the same individual) should only possess a
    minimum amount of distinctiveness.


    *   **Collectability:** It should be easy to collect the biometric template of
    the selected trait from users.


    *   **Acceptability:** The target population should be willing to reveal the selected
    biometric template to the biometric system, and the user interface of the system
    should be as simple as possible.


    *   **Cost:** The infrastructure and the maintenance cost of the system that can
    process the selected trait should be minimal.


    Fingerprint and iris are the commonly used biometric traits in most of the biometric
    systems. This is mainly because of its user convenience (high for fingerprint-based
    systems) and accuracy (high for iris-based systems). Aadhaar (Aam Aadmi ka Adhikar)
    recognized as the world’s largest universal civil ID program and biometric database
    is currently used by the Government of India to provide social services to the
    citizens. Both fingerprint and iris biometric traits are taken during Aadhaar
    enrolment:


    | **Features and ML techniques** |


    | **Modality** || **Features** || **ML techniques** |


    | Face || Distance between eyes, DCT, Fourier transform, Ratio of the distance
    between eyes and nose, Principal components || PCA, LDA, Kernel PCA, Kernel LDA,
    SVM, Deep neural network |


    | Iris || DCT, Fourier transform, Wavelet transform, Principal components, Texture
    features || PCA, LDA |


    | Fingerprint || Delta, Core points, Ridge ending, Island, Bifurcation, Minutiae,
    FFT || Artificial neural networks, Support vector machine, Genetic algorithms,
    Bayesian training, Probabilistic models |


    | Finger vein || LBP, Minutiae, Bifurcation and endpoints, Pixel information ||
    SVM, Deep learning |


    | Palm print || Shape, Texture, Palm lines, PCA, LDA coefficients, DCT || Naive
    Bayes, KNN, HMM |


    | Palm vein || LBP, Minutiae, Bifurcation and endpoints, Pixel information ||
    SVM, Deep learning |


    | Voice || Linear prediction coefficient (LPC), Cepstral coefficient (CC), MFCC
    features || Gaussian mixture models, HMM, ANN, SVM deep learning |


    **Table 5.1**


    Machine learning has played a major role in improving the performance of biometric
    systems. One-to-one or one-to-many matching tasks can be done automatically and
    seamlessly in biometric systems with machine-learning-based algorithms.


    # [Software vulnerabilities](#toc.xhtml#s78a)


    Vulnerability refers to a flaw in a system that can leave it open to attacks.
    A software vulnerability is a flaw in a software system that can cause the software
    or system to crash or produce invalid output or to behave in an unintended way.
    Some of the common software vulnerabilities are as follows:


    *   Buffer overflows.


    *   Numeric over and underflows.


    *   Errors in type conversion.


    *   Operator misuse.


    *   Bugs in pointer arithmetic.


    *   Evaluation order logic errors.


    *   Structure padding errors.


    *   Procedure errors.


    *   Errors in macros and preprocessors.


    *   String and meta-character vulnerabilities.


    *   Privilege problems.


    *   File permission issues.


    *   Race conditions.


    *   Errors in processes, IPC, and threads.


    *   Environments and signaling issues.


    *   SQL injection vulnerability.


    *   Cross-site scripting (XSS) vulnerability.


    *   Vulnerabilities in file inclusion and access.


    *   Vulnerabilities in shell invocation, configuration.


    *   Access control and authorization flaws.


    Software vulnerability detection is the process of confirming whether a software
    system contains flaws that could be leveraged by an attacker to compromise the
    security of the software system or that of the platform on which the software
    system runs. Code injection attacks allow an attacker to execute a (malicious)
    code within the privileges of the vulnerable program. Identifying the vulnerabilities
    and fixing them are very important measures to evaluate and improve the security
    of the software systems and the platforms on which they are running.


    The machine learning approaches for vulnerability detection methods can be classified
    as follows:


    *   Anomaly detection methods.


    *   Pattern recognition methods.


    Anomaly detection methods use features such as API usage patterns, missing checks,
    lack of input validation, and lack of access controls. Machine learning techniques
    such as KNN have been used for classification. Pattern recognition methods identify
    vulnerable lines of code along with keywords (specific to programming languages)
    using machine learning algorithms. The features include system calls and API calls
    invoked by an application, syntax trees, etc. Machine learning techniques such
    as logistic regression, multilayer perceptron (MLP), random forests, neural networks,
    BLSTM, etc., have been used for the classification of software vulnerabilities.


    # [Conclusion](#toc.xhtml#s79a)


    Computer vision plays a huge role in bridging the gap between human and machine.
    With the groundbreaking technological advancements today, this will be a very
    helpful tool in automating verification, especially in the finance sector (for
    example, bank accounts). In this chapter, we discussed the technical architecture
    of CNNs used in computer vision. We also had a walkthrough of the application
    of computer vision in image recognition, biometric recognition, and software vulnerabilities.


