- raw: "A common problem in statistics is testing a hypothesis and identifying the\
    \ probability distribution that the data follows. This allows the statistician\
    \ to predict the parameters for an unknown data set. Hypothesis testing is one\
    \ of the many concepts of statistics that are used in machine learning. Another\
    \ concept of statistics that is used in machine learning is predicting the value\
    \ of a function using its sample values. The solutions to such problems are instances\
    \ of machine learning since the problems in question use historical (past) data\
    \ to predict future events. Statistics is a crucial part of machine learning.\n\
    \n# [Brain modeling](#toc.xhtml#s224a)\n\nNeural networks are closely related\
    \ to machine learning algorithms. Scientists have suggested that nonlinear elements\
    \ with weighted inputs can be used to create a neural network. Extensive studies\
    \ are being conducted to assess these elements.\n\n# [Adaptive control theory](#toc.xhtml#s225a)\n\
    \nAdaptive control theory deals with methods that help the system adapt to changes\
    \ and continue to perform optimally. The idea is that a system should anticipate\
    \ the changes and modify itself accordingly.\n\n# [Psychological modeling](#toc.xhtml#s226a)\n\
    \nFor years, psychologists have tried to understand human learning. EPAM (Electronic\
    \ Pilot Activity and Alertness Monitor) network is a method that’s commonly used\
    \ to understand human learning. This network is used to store and retrieve words\
    \ from a database when the machine is provided with a function. In recent times,\
    \ research in psychology has been influenced by AI. Another aspect of psychology,\
    \ called reinforcement learning, has been extensively studied in recent times,\
    \ and this concept is also used in machine learning.\n\n# [AI](#toc.xhtml#s227a)\n\
    \nAs mentioned earlier, a large part of machine learning is concerned with the\
    \ subject of AI. Studies in AI have focused on the use of analogies for learning\
    \ purposes and on how past experiences can help anticipate and accommodate future\
    \ events. In recent years, studies have focused on devising rules for systems\
    \ that use the concepts of inductive logic programming and decision tree methods.\n\
    \n# [Evolutionary models](#toc.xhtml#s228a)\n\nA common theory in evolution is\
    \ that animals prefer to learn how to better adapt to their surroundings to enhance\
    \ their performance. For example, early humans started to use the bow and arrow\
    \ to protect themselves from predators that were faster and stronger than them.\
    \ As far as machines are concerned, the concepts of learning and evolution can\
    \ be synonymous with each other. Therefore, models used to explain evolution can\
    \ also be used to devise machine learning techniques. The most prominent technique\
    \ that has been developed using evolutionary models is the genetic algorithm.\n\
    \n# [Conclusion](#toc.xhtml#s229a)\n\nIn this chapter, we discussed the advantages\
    \ and disadvantages of machine learning in order to get a clear picture of the\
    \ phenomenon as a whole.\n\nIn the next chapter, we will learn about the applications\
    \ of machine learning.\n\n# [CHAPTER 15](#toc.xhtml#c15)\n\n# [Applications of\
    \ Machine Learning in Other Industries](#toc.xhtml#c15)\n\n# [Introduction](#toc.xhtml#s230a)\n\
    \nWe are in the center of an uprising trend of machine learning applications.\
    \ Machine learning is applied in self-driving cars, personalized banking, customer\
    \ support queries, recommendation engines, LinkedIn recommendations, and the list\
    \ keeps going on.\n\n# [Structure](#toc.xhtml#s231a)\n\nIn this chapter, we will\
    \ cover the following topics:\n\n*   General applications of machine learning.\n\
    \n# [Objective](#toc.xhtml#s232a)\n\nAfter studying this chapter, you should be\
    \ able to do the following:\n\n*   Understand in detail about general applications\
    \ of machine learning.\n\n# [General applications of machine learning](#toc.xhtml#s233a)\n\
    \n*   **Financial analysis:** Machine learning is used to perform financial analysis\
    \ for companies that have large volumes of accurate and quantitative historical\
    \ data. As it is already being used for algorithmic training, portfolio management,\
    \ fraud detection, and loan underwriting, future applications of machine learning\
    \ might include chatbots for customer service, sentiment analysis, and security\
    \ purposes. Machine learning models learn with experience and use data to make\
    \ future financial predictions in a better way.\n\n*   **Predictive maintenance:**\
    \ Corrective and preventive maintenance is a major part of manufacturing industries.\
    \ Although this process is complex and expensive when conducted with conventional\
    \ approaches, machine learning has now made it easier to discover meaningful insights\
    \ and hidden patterns in factory data. Because this process helps in reducing\
    \ risks associated with unexpected failures, companies can also reduce unnecessary\
    \ expenses by implementing machine learning models. What’s more, artificial intelligence\
    \ and machine learning algorithms work in collaboration to analyze historical\
    \ data and ensure workflow visualization.\n\n*   **Fraud detection:** Machine\
    \ learning models are best suited for detecting spam and fraud. Spam filters are\
    \ now designed by using the latest artificial intelligence and machine learning\
    \ algorithms that include neural network rules for detecting phishing messages\
    \ and spam.\n\n    Major search engines such as Google and Bing work perfectly\
    \ because the system is programmed to learn the ranking of pages and eliminate\
    \ spam in real time. They are powered by effective machine learning algorithms.\
    \ Also, there is a specific number of spam filtering approaches that are used\
    \ by email clients to make sure that these spam filters are regularly updated.\n\
    \n    To perform such activities, a rule-based spam filtering approach is considered\
    \ along with multi-layer perceptron and decision tree induction. Furthermore,\
    \ system security programs that are designed using artificial intelligence and\
    \ machine learning algorithms understand the coding pattern and stop fraudulent\
    \ activities before they can cause any problems. It is predicted that online credit\
    \ card fraud will reach a worth of $32 billion in 2020. So, this is a serious\
    \ issue that must be solved quickly.\n\n    Fraud detection is one of the major\
    \ applications of machine learning that helps make online transactions safer.\
    \ The number of transactions from credit cards, debit cards, UPI, numerous wallets,\
    \ and smartphones has been increasing with time and has also been a major target\
    \ for online criminals. To make online transactions smooth and safe, the machine\
    \ learning model thoroughly investigates the processes and searches for suspicious\
    \ patterns. This approach in machine learning is also known as the classification\
    \ problem and is handled in real time.\n\n*   **Image recognition:** Image recognition,\
    \ also known as computer vision, involves machine learning, data mining, and database\
    \ knowledge for discovery. Having the ability to produce symbolic and numeric\
    \ information from high-dimensional data and images, the approach is widely used\
    \ in various industries such as automobiles and health care. Moreover, image recognition\
    \ helps in detecting criminals or suspected persons in real time.\n\n*   **Dynamic\
    \ pricing:** Setting a fixed price for a service or a product is considered a\
    \ traditional means of trading. Nowadays, pricing strategies are based on objectives\
    \ and targets for which different kinds of promotions and discounts are given.\
    \ Services such as air tickets or cab fares are dynamically priced depending upon\
    \ various external scenarios such as traffic or the number of passengers.\n\n\
    \    Artificial intelligence is now able to track buying trends and provide pricing\
    \ solutions for determining competitive product prices. Further, machine learning\
    \ algorithms are implemented to predict accurate service rates depending upon\
    \ load and user demands."
