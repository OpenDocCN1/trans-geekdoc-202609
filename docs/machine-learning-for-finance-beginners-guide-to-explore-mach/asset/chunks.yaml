    [Chapter 6](#c06.xhtml) gives an in-depth discussion on neural networks, and how
    they work, and their different types and benefits. It then reviews gradient boosting
    machines and gradient descent.


    [Chapter 7](#c07.xhtml) describes some of the different types of sequence modeling
    techniques, and reviews the ML modeling procedure, which involves feature engineering
    and selecting a model, model training, validating the model, and testing the model
    on new data.


    [Chapter 8](#c08.xhtml) discusses which ML algorithm is suitable for your business
    problem. It then shows what a data reduction technique is. It also reviews the
    concept, types, and application of reinforcement learning.


    [Chapter 9](#c09.xhtml) describes why finance is at the forefront of technology.
    It further discusses how machine learning can benefit the finance industry. It
    also reviews some use cases and the impact of ML on the finance industry.


    [Chapter 10](#c10.xhtml) describes the impact of technology on FinTech companies.
    It then describes the key challenges faced by FinTech companies.


    [Chapter 11](#c11.xhtml) reviews ML use cases in the banking sector. It also discusses
    the application of machine learning in cybersecurity, credit scoring, algorithmic
    trading, and robo-advising.


    [Chapter 12](#c12.xhtml) describes the different ways information can be stolen.
    It then discusses the different security measures to stop this fraud.


    [Chapter 13](#c13.xhtml) discusses data mining and data visualization, and their
    real applications.


    [Chapter 14](#c14.xhtml) discusses the advantages and disadvantages of machine
    learning.


    [Chapter 15](#c15.xhtml) discusses in depth the application of machine learning.


    [Chapter 16](#c16.xhtml) reviews the impact of machine learning not only on the
    financial sector but also on our lives, economy, and humanity as a whole.


    [Chapter 17](#c17.xhtml) discusses the applications of AI in banking.


    [Chapter 18](#c18.xhtml) discusses in depth traditional algorithms such as regression,
    k-means clustering, k-nearest neighbor, principal component analysis algorithm,
    polynomial fitting and least squares algorithm, forced linear regression algorithm,
    support vector machine algorithm, conditional random fields algorithm, and decision
    tree algorithm.


    [Chapter 19](#c19.xhtml) lists some frequently asked questions about machine learning.


