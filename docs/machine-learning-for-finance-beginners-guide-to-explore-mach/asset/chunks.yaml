    Experian is one of the, if not *the*, biggest credit reference agency in the world.
    They store an amazing amount of data about every individual in their records.
    They can convey any financial institution about your purchases, court cases, and
    other relevant information that could help banks figure out how your finances
    stand.


    Knowing how much data their system goes through for every loan and mortgage application
    being processed, it isn’t surprising to learn that they have machine learning
    helping them out. Basically, machine learning sorts through all that data and
    tells them whether a certain individual is a risky bet, or whether a loan application
    is worth approving.


    American Express is another financial giant that takes advantage of machine learning.
    With over 110 million active AmEx cards, how do they manage to keep track of fraudulent
    activity?


    You guessed it — through machine learning. By using the right data sets and algorithms,
    AmEx has the ability to notice discrepancies in spending habits among card users.
    This allows them to detect potential fraud in real-time.


