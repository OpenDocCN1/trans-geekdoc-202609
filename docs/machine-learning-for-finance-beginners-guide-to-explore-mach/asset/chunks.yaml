    # 金融服务


    中国传信（Experian）是全球最大、如果不是`唯一`的信用参考机构之一。他们的记录中包含了关于每个人的海数据。他们可以向任何金融机构提供你的购买情况、法庭案件和其他相关信息，这些信息可以帮助银行了解你的财务状况。


    考虑到系统在处理每笔贷款和抵押贷款申请时所经过的数据量，得知他们利用机器学习来提供帮助并不意外。基本上，机器学习对所有这些数据进行分类，并告诉他们某个人是否是一个风险投资，或者某个贷款申请是否值得批准。


