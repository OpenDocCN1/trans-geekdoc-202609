    ## 11. What is deep learning?


    **Ans.** Within machine learning is the realm of deep learning, which refers to
    the layered type of algorithms that allow machines to detect information and process
    it in complex ways. Deep learning models are based on what is known as artificial
    neural networks, computer systems whose creation was inspired by the functionality
    of the human brain. The human brain also processes information in a layered or
    overlapping fashion, which allows networks designed to resemble them to have some
    basic characteristics of human brains.


    ## 12. How long has artificial intelligence been around?


    **Ans.** The concept of artificial organisms or machines capable of thinking in
    human-like ways or otherwise independently has been around for thousands of years.
    Ancient Greeks described an automaton called Talos that had been created by the
    god Hephaestus and that was able to behave independently and attack human beings.
