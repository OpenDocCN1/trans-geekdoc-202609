  trans: '


    侵入是许多组织和公司都会经历的现象。这基本上是指可能损害机密来源完整性的行为。为了确保这种情况不会发生，所采用的防御措施包括用户信息身份验证。数据挖掘可以通过对异常检测增加高水平的关注来改进这种入侵检测。通过这种方式，数据分析师可以轻松地将入侵活动与更常见、频繁的日常活动区分开来。数据挖掘可以用于提取与问题特别相关的数据。数据可视化使决策数据理解变得容易得多。


    # 谎言检测


    谎言检测可能很困难，抓捕罪犯可能是容易的部分，但让他们说出实话可能要困难得多。执法部门可以使用数据挖掘和可视化技术来调查犯罪，并追踪疑似恐怖分子或人员之间的通信。这包括使用文本挖掘并在数据中寻找有意义的模式，这些通常以非结构化文本的形式出现。例如，可以将过去调查中使用的数据样本进行比较，并开发出模型谎言检测器。由此收集的数据可以根据案件的要求进行排序。


    数据挖掘和可视化可用于上述所有内容，可能还有更多。底线逻辑是，它们是当今世界中的重要工具，对于企业和公司以最佳方式蓬勃发展来说是必不可少的。视情况，数据挖掘也可以用于数据可视化。最好的部分是，它在不久的未来将带来许多可能性。


    # 结论


    数据挖掘对于改进现有系统是必要的。它也被称为数据或知识发现，可用于从各个方面分析数据。这些数据可以用于降低成本、增加收入以及运营业务或组织。


    数据挖掘是用于从不同角度和维度分析数据，同时对其进行分类并建立不同类型数据之间关系的工具之一。


    数据可视化也是一个非常关键的工具。它不仅仅是数据的图形化格式表示，它而且非常强大，这种工具的使用会对组织产生负面或正面的影响。当数据可视化使用不当时，它会影响决策并模糊你试图传达的任何信息。当使用正确时，它可以帮助你实现更有效、更有力的通信，并辅助做出极佳决策。


    数据挖掘和可视化都是收集和识别数据的不同方式，如果使用得当，它们可以使组织成长。


    在下一章中，我们将讨论机器学习的优点和缺点。


    # 第 14 章：机器学习的优点与缺点


    ## 引言


    机器学习是一种非常强大的工具，具有彻底改变事物运作方式的能力。机器学习可以用于克服挑战，并通过做出预测和允许他们做出明智选择来支持业务。每个硬币都有两面；每个面都有其独特的属性和特征。是时候揭示机器学习的这两个面了。


    ## 结构


    在本章中，我们将涵盖以下主题：


    * 优点。

    * 缺点。


    ## 目标


    学习本章后，你应该能够完成以下操作：


    * 理解机器学习的优点和缺点。


    ## 优点


    由于任务的巨大数量和规模，在某些情况下人类无法成功；在这些情况下，机器的优势是显而易见的。


    ## 识别模式


    当工程师向机器输入数据集时，它将学习如何识别模式并就此产生结果。由于机器学习与数据科学（处理大量数据并挖掘底层变量之间关系的过程）之间存在密切联系，通过机器学习，人们可以从海量数据中推导出重要的见解。


    ## 提高效率


    人类在设计某些机器时，可能没有完全理解它们在不同情况下的功能。通过机器学习和人工智能，机器将适应环境的变化并提高其效率。


    ## 完成特定任务


    程序员通常会开发一个存在错误空间的程序；他或她可能会忘记应该包含的几个步骤或细节。拥有可以自学的人工智能机器不会面临这些挑战。


    ## 帮助机器适应变化的环境


    随着技术的不断变化以及为了交流这些技术进步的新语言的发展，几乎不可能将所有现有程序转换为这些新语法。从编码阶段重新设计每个程序以适应环境适得其反。在这种情况下，使用机器学习是非常高效的，让机器可以自行升级并适应技术气候。


    ## 帮助机器处理大数据


    机器学习带来了同时在不确定条件下处理多个维度和种类数据的能力。具有人工智能的机器能够自学并在动态环境中运行，强调了资源的有效利用。


    机器学习已帮助开发了在小型更大环境中提供持续质量改进的工具。


    ## 缺点


    获取训练机器所需的数据是困难的。工程师必须知道想用什么算法来训练它，只有这样才能识别出需要使用的数据集。如果工程师没有做出正确决定，会对获得的结果产生重大影响：


    * 很难准确解释结果以确定机器学习算法的有效性。

    * 工程师在选择训练机器之前必须对不同的算法进行实验。

    * 超过机器学习的技术正在研究中；因此，机器不断学习并转型新技术至关重要。


    ## 机器学习涉及的概念


    机器学习使用了多个概念，每个概念都能帮助程序员开发出一种可以在机器学习使用的新方法，而所有这些概念共同构成了机器学习学科。


