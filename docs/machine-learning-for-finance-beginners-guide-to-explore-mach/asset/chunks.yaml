    请记住，机器人投顾并非完全脱离了人性。许多机器人投顾实际上只是在线理财公司，它们利用自动化技术和程序算法来消除财富管理的繁琐过程，并使其整体成为一个更廉价的选择。然而，某些机器人投顾实际上提供接入专属的人类财务顾问师服务，他们可以为你提供一个生动的倾听者来讨论想法，并帮助你全面管理财富。


    还有针对不同用途的机器人投顾，例如针对周末投资者以及花费大量时间积极投资或参与股市的人群的服务。每种机器人投顾都有不同的功能、不同的账户起投金额要求以及不同的交易佣金。


    在选择机器人投顾时，并非所有人都有相同的细分市场定位或相同的需求。


    # 利用外部机器学习安排


    机器学习架构师可以通过关注你的特定信息和业务领域来执行该框架。专家需要从各种来源提取信息，将其转换为适合该特定框架的形式，获取结果并对发现进行可视化处理。


    目前不存在一种全能的机器学习算法。数据研究人员在将算法应用于不同领域的各种业务案例之前，需要对其进行更改和微调。


    # 机器学习的应用


    在高效聊天机器人、移动银行应用程序和搜索引擎出现之前，机器学习已经在金融领域找到了应用。鉴于海量数据、对历史数据准确性的要求以及金融世界的量化性质，没有其他行业比金融业更适合人工智能。现在你可以在金融领域发现比以往任何时候更多的机器学习实例。这一趋势由于计算能力的提高以及像
    Google 的 `TensorFlow` 这样更易的机器学习工具而得到加强。


    机器学习已经到来，并在现代社会和许多金融领域发挥着至关重要的作用。它被用于贷款审批、资产管理和风险评估，但很少精通技术的人清楚机器学习切入人们财务生活的准确方式。


    # 当前的金融应用


    以下是当今世界中使用的一些示例。请记住，某些应用使用了多种人工智能技术或方法，而不是机器学习。


    # 投资组合管理


    “机器人投顾”（Robo-advisor）是一个几年前还没听过的术语，但现在已在金融界广泛使用。然而，这个词具有误导性，因为完全没有机器人参与。相反，机器人投顾（例如
    `Betterment` 或 `Wealthfront`）是基于机器学习的算法，旨在设计用户的财务投资组合，包括他们的目标和风险承受能力。例如，用户输入目标，如在
    65 岁时退休并拥有 3,000,000 美元的储蓄。他们还输入了自己的年龄、当前财务状况和收入。顾问（更准确地称为配置者）随后将投资分配到不同的资产类别和金融工具中，以实现用户的目标。顾问系统随后根据用户目标的变化和市场的实际变化进行校准，使其最符合用户的目标。对于那些不需要实体顾问就能对投资感到舒适的人来说，它们已产生了巨大的兴趣。


    # 算法交易


    算法交易可以追溯到 20 世纪 70 年代，也被称为自动化交易。它每天处理数百万次的交易。因此，使用了 `HFT`（高频交易）术语，它是算法交易的一部分。大多数金融机构和对冲基金不披露它们使用的
    AI 方法。但人们认为深度学习和机器学习在交易中发挥着日益重要的作用。在交易中使用机器学习存在一些局限性。


    # 欺诈检测


    系统可以通过机器学习检测异常行为或独特活动。该系统面临的最大挑战是防止误报以及标记风险的情况。安全泄露可能发生在无数种方式，因此真实的学习系统将在未来五到十年内成为必要。


    # 保险或信贷


    在保险或信贷领域，市场上有很大程度上担心机器将取代许多现有的承保职位。这对于大型组织来说尤其是一个问题。机器学习算法可以在数百万消费者数据（如职业、年龄和婚姻状况）中进行训练。它还用于保险结果和金融贷款，以检查某人是否违约、未能付款、未能及时获得贷款或发生过车祸。可以使用算法对底层趋势进行评估并进行持续分析，以检查是否有越来越多的人发生事故。或者在过去十年中，特定人口统计特征下的违约数量是否增加？这些问题的答案对组织大有益处。然而，这目前限于有资源聘用数据科学家且拥有海量数据（过去和现在）来训练算法的大型公司。


    # 机器学习与加密货币


    近年来，由人工智能和机器学习支持的交易引起了巨大的兴趣。有一种假设，加密货币市场中的低效性可以用来创造巨额利润。由先进机器学习算法支持的正常交易策略能力远强于标准基准。一些并不复杂但实际上很简单的算法可以帮助预测加密货币市场的短期演变。


    机器学习技术在股市预测方面的成功表明，这些方法也可以有效地用于预测加密货币价格。但将机器学习算法应用于加密货币市场，主要限于使用 `Bayesian neural
    network`、`random forests`、`long and short-term memory neural networks` 以及其他算法分析比特币价格。这些研究在某种程度上预测了比特币价格波动，并得出使用基于神经网络的算法可以获得最佳结果。深度学习的增强在预测十二种不同加密货币的一年价格方面，优于买入持有策略的表现。还有其他使用机器学习预测比特币以外加密货币价格的尝试，但它们来自非学术来源，并且没有对结果进行任何比较。

