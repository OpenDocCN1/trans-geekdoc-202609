    真测量（True measures）是从有意义的零点开始测量的间隔变量。这一特性非常重要，因为这意味着变量的两个值之间的比例很大。美国使用的华氏度温度计和世界其他地区使用的摄氏度量表都具有这一属性。在任何一个体系中，说
    30 ° 的天比 15 ° 的天暖两倍是没有意义的。同样，12 码的连衣裙尺寸不是 6 码的两倍大，石膏的硬度也不是滑石的两倍，但在硬度量表上，它们分别是
    2 和 1。但是，说一个 50 岁的人年龄是 25 岁的人的两倍，或者一个 10 磅的糖袋是 5 磅的两倍则是完全合理的。


    真测量的例子包括年龄、重量、长度、客户时长和时长。间隔变量和真测量的几何距离量是有良好定义的。将这些转换为间隔变量以便使用分类变量和排序是非常关重要的。遗憾的是，在这些转换中可能会应用错误的细节。如果将
    1 到 28 的随机数分配给冰淇淋口味，将意味着第 5 号和第 6 号口味几乎相关，而第 1 号和第 28 号则相遥远。


    # KNN 算法


    KNN 算法是今天数据科学家使用的最简单的机器学习算法之一。它最早于 20 世纪 70 年代初开发用于统计预测和模式识别，可以应用于回归和分类问题，尽管它最常用于分类模型。


    ## KNN 是如何工作的？


    在进行预测时，KNN 必须访问所有可用训练数据。这意味着不需要学习，因为所有数据必须存储在内存中并始终保持可访问。如果你正在处理大型数据集，你可能想要考虑复杂的数据结构，例如
    k-d 树，以最大化存储效率和计算速度。


    对于每个新数据点，KNN 会在所有训练数据中搜索 k 个最近的条目（最近邻）。`k` 是算法考虑的邻居数量：对于 `k = 1`，只考虑最近的值；对于 `k
    = 3`，将考虑最近的三个值；对于 `k = infinity`，将考虑整个数据集，依此类推。


    一旦确定了 `k` 个最近的数据点（k 最近邻），就会对它们的属性和值进行评估。函数将考虑所有这些属性并为新数据点计算一个输出值。对于回归，预测值可能是最近邻的加权平均值；对于分类，它可能是出现频率最高的类别。


    必须考虑新数据点与其邻居之间的距离或分离程度。例如，如果两个正方形邻居比三个草莓邻居更近，那么新输入点点的预测类别可能是正方形。当然，这取决于你如何在数据集中定义距离（目前，你可以将距离视为误差的衡量标准）。


    在深入研究距离概念并讨论不同的可用指标之前，让我们先可视化一下为止讨论的内容。在下面的图中，你会发现一个包含两类数据的训练数据集：正方形和菱形。定义这些点的两个变量是：`Loan$`
    和 `Age`。这些被称为预测变量。


    使用该数据集，可以使用 KNN 算法来预测新数据点的类别：这个圆是正方形还是菱形？在这个特定的例子中，我为我的 KNN 算法选择了 `k = 4`。现在，我必须为新数据点（即圆）选择四个最近的邻居。


    如你所见，最近的邻居中有两个菱形和两个正方形。我们应该给圆分配哪个类别？这将取决于你的算法如何定义距离参数。例如，如果你考虑绝对距离（即点在图上距离训练数据有多远），那么你的算法将预测为“菱形”，因为两个菱形更近。然而，如果
    `age` 是你研究中更重要的因素，你可能会选择给它一个更大的权重因子 `w`。因此，你的距离更偏向于最小化年龄差异，并将预测为“正方形”（因为正方形在年龄上与圆更近）。距离是任何
    KNN 算法的关键参数，因此必须根据你的研究需求仔细选择和调优。


    在为你的算法指定距离指标时，必须记住几点。首先，你必须选择最相关的预测变量（上一个例子中的 `age` 和 `loan`）。由于预测变量之间尺度的差异，通常做法是将它们归一化为
    0 到 1 之间的值。例如，在上面的示例中，你的 `Loan$` 范围在 `$60,000` 到 `$250,000` 之间，而 `Age` 范围在 20
    到 52 之间；这些尺度上的差异必须纳入你的算法处理训练数据之间距离的方式。


    如果你想对选定的预测变量分配更大的重要因子，你可以在归一化数据后使用权重因子 `w`。例如，现在你的数据范围将从 0 到 1。权重因子越大，预测变量对最终输出的影响就越大。选择产生最大精度的预测变量和权重因子被称为参数调优。这种方法没有对错，它取决于许多因素，最好的方法仍然是尝试。


    尽管这个过程最初看起来很困惑甚至随机，但通过经验，你将能够轻松地调优出适合你的数据和要求的算法——这只需要练习。

    '
