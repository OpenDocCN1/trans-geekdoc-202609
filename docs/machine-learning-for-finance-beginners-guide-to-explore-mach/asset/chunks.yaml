- raw: 'The simplest method is linear regression, which has a mathematical equation
    of the form Y = m \* X + b. Multiple data pairs (X, Y) can train a linear" regression
    model by calculating the position and slope of a line in order to reduce the total
    distance between the data points and the line. In other words, calculating the"
    slope (m) "and" y-intercept (b) "has been used for a line that provides the highest
    approximation for data observations. The data relationships can be modeled using"
    linear predictive functions ", estimating unidentified model variables at based
    on the data these systems are called linear models. Traditionally, if the values
    of the explanatory variables or predictors are known, the conditional mean of
    the response would be used as the affinity function of those values. Use of conditional
    media and other measures in linear models is very rare. Similar to any other form
    of "regression analysis " the "linear regression" works okay on the "conditional
    probability distribution" of the responses instead of the joint probability distribution
    of the variables obtained with the multivariate analysis.


    The most thoroughly researched form of regression analysis with wide applicability
    is linear regression. This is because models that rely linearly on their unidentified
    parameters are easy to work with compared to the models that are nonlinearly related
    to their parameters. In other words, the statistical characteristics of the resulting
    predictors can be easily determined with a linear distribution. There are many
    useful applications of linear regression:


    *   If the goal is to generate forecasts and predictions or to reduce errors,
    the predictive model can be linked to an identified data set and explanatory variables
    using a linear regression algorithm. Once the model is developed, new unresponsive
    input data can be easily predicted by the appropriate model.


    *   Linear regression analysis can be used to specifically quantify the relationship
    between the predictors and the response, to assess whether certain explanatory
    variables lack any linear relationship to the response. It can also be used to
    identify predictor subsets that contain data redundancy across response values.


    The adaptation of most linear regression models is accomplished using the least
    squares approach. However, this model can also be fitted by significantly reducing
    the lack-of-fit in another standard (like the least absolute deviation regression),
    or by using a "punished version of the smallest square as done in the ridge regression.
    minimize (L2 standard penalty) and lasso regression (L1 standard penalty) ". In
    contrast, it is possible to use the least squares approach to fit machine learning
    models that are not linear. Therefore, although the terms “least squares” and
    “linear model” are closely related, they are not the same.


    Multiple linear regression is generally the most common type of regression technique
    used in data science and most statistical tasks. As with the linear regression
    technique, there will be an output variable Y in multiple linear regression. However,
    the difference now is that we will have numerous values of X or independent variables
    that generate predictions for Y.


    For example, a model developed to predict housing costs in Washington, DC, will
    be driven by multiple linear regression techniques. The cost of housing in Washington,
    DC, is Y or dependent variable for the model. X or the independent variables for
    this model include data points such as proximity to public transport, training
    district, square meters, and single rooms, which will ultimately determine the
    market price of the homes.


    The mathematical equation for this model can be written as follows:


    *Housing\_price = β0 + β1 sq\_foot + β2 dist\_transport + β3 num\_rooms*


    Our models developed a straight line in the last two types of regression techniques.
    This straight line is the result of the connection between X and Y, which is linear,
    and the influence X has on Y does not change with the values of X. In the case
    of polynomial regression, our model shows a curve.


    If we try to fit a graph with nonlinear features using linear regression, it would
    not yield the best fit. For example, in the image below, the graph on the left
    is a scatter plot showing an upward trend, but with a curve. A straight line does
    not work in this situation. Instead, we generate a line with a curve corresponding
    to the curve in our data with polynomial regression, like the graph on the right
    in the figure below. The equation of polynomial regression will appear same as
    that for linear regression, except that one or more of the X variables will be
    associated with a polynomial expression.


    *Y = mX2 + b*


    ![](images/18.1.jpg)


    **Figure 18.1**


    Another important regression technique for data researchers is support vector
    regression, which is most commonly used in case classification. The concept here
    is to discover a line in space that divides data points into different categories.
    It is also used for regression analysis. It is a form of binary classification
    technique that is not associated with probability.


    Ridge regression is widely used for analyzing multicollinear data sets. Depending
    on the characteristics of the data set, the correct use of cause addictive models
    regression can reduce standard errors and significantly improve model accuracy.
    Ridge regression can be useful if your data contains highly correlated independent
    variables. If you can predict an independent variable using another independent
    variable, your model will have a high risk of multicollinearity. For example,
    if you use variables that measure a person’s height and weight, these variables
    in the model probably create multicollinearity.


    Multicollinearity can potentially affect the accuracy of the predictions generated
    by the model. Consider the type of predictor variables used in the model to avoid
    multicollinearity that can be caused by the type of data you are using, as well
    as the data collection method. Another reason could be the selection of a small
    variety of independent variables, or the selection of limited number of independent
    variables, resulting in very similar data points.


    Multicollinearity can also be caused by the type of model. Note that there are
    more variables than data points in the model. If you have chosen to use a linear
    model, which worsens the multicollinearity of the model, you can try to implement
    cam regression. Ridge regression can make the predictions more accurate by allowing
    a touch of bias in the model. This technique is also known as “regularization.”


    Another technique to improve the accuracy of the model is to standardize the independent
    variables. The simplest way to do this is to reduce complexity by changing the
    values of certain independent variables to null. The approach is not just to change
    these independent variables to zero, but to implement a structure that rewards
    values closer to zero. This will decrease the coefficients, which will also decrease
    the complexity of the model, but the model will retain all its independent variables.
    This will give the model more bias, which is a tradeoff for greater accuracy of
    predictions.


    Another reduction technique is called a LASSO (least absolute crimp and selection
    operator) regression. A highly complementary cam regression, lasso regression
    promotes the use of simpler and leaner models to generate predictions. In lasso
    regression, the model lowers the value of coefficients close to zero. Data on
    our scatter plot, such as the average or median values of the data, is reduced
    to a more compact level. We use this when the model experiences high multicollinearity
    as compared to the ridge regression model.'
