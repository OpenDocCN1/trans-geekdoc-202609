  trans: "\n\n*   **垃圾邮件：** 邮件客户端使用垃圾邮件过滤方法来避免虚假邮件或恶意软件。由于此类邮件一旦打开可能会对系统造成巨大损害，垃圾邮件发送者会利用恶意软件进行网络钓鱼，以获取高度敏感信息，如银行卡详情或密码。机器学习和人工智能算法（如决策树归纳和多层感知器）有助于避免网络犯罪，并提供实时保护。\n\
    \n*   **视频监控：** 视频监控系统是监控特定位置的最佳方式。虽然一个人无法管理多个安全摄像头，但视频监控系统的设计中引入了机器学习和人工智能技术，这些技术能够训练计算机高效地完成这一工作。\n\
    \n    由人工智能驱动的视频监控系统具有在犯罪发生前检测并报告犯罪的能力，因为系统可以追踪异常行为，例如某人在特定地点长时间站立不动，或经常在特定地点午睡。\n\
    \n    每个报告的事件都由后端的机器学习模型处理，以便生成即时响应，阻止任何类型的犯罪活动或意外事故。\n\n*   **虚拟个人助手：** 随着技术的最新进展，智能手机和数字设备现在配备了虚拟个人助手，帮助用户在通过文本或语音请求时寻找有用信息。使用机器学习模型设计的虚拟个人助手的主要应用包括语音识别、语音转文本、文本转语音以及自然语言处理（NLP）。`Siri`、`Alexa`、`Google\
    \ Assistant` 和 `Cortana` 是帮助用户执行日常活动的一些热门虚拟个人助手。\n\n# 结论\n\n在本章中，我们回顾了机器学习不仅用于金融领域，还应用于其他领域。\n\
    \n下一章将完全介绍深度学习的影响。\n\n# 第 16 章\n\n## 人工智能中的伦理考虑\n\n### 引言\n\n深度学习系统因其检测欺诈、优化语言、进行研究、创作艺术以及翻译不同语言的能力而变得流行。这些系统是智能的，并且出于各种良好的理由改变着人类的生活。这些系统变得越来越强大，让我们周围的世界变得更加高效和丰富。`Facebook`、`Microsoft`、`Alphabet`、`Amazon`\
    \ 等科技巨头以及 `Elon Musk` 等个人引发了讨论，认为现在是探索人工智能无限应用的正确时机。但作为一种新兴技术，讨论伦理和风险管理是至关重要的。\n\
    \n人们对人工智能将统治世界而人类像奴隶一样生活的恐惧日益激增。在目前，这似乎是一个遥不可及的观点，但没有人能否认未来的可能性。威尔·史密斯的电影《机械机器人》就是一个清晰的例子，展示了一个可以胜过人类并控制世界的超级智能。电影展示了\
    \ `AI` 系统如何变得自主并控制电网和其他人造系统。可以看到机器巡逻该地区并杀死人类。专家们担心这种机器的崛起。最大的担忧是，如果 `AI` 学会了自我编程会发生什么。\n\
    \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   失业。\n*   不平等。\n*   人性。\n*   虚假信息。\n*   人工智能与邪恶分子。\n\
    *   种族主义机器人。\n*   反对人类的人工智能。\n\n### 目标\n\n学习本章后，你应该能够做到以下：：\n\n*   理解人工智能对人类的影响。\n\
    \n### 失业\n\n深度学习人工智能的首要伦理影响是失业。目前的劳动力层级关注的是自动化。世界在自动化工作方面正变得越来越熟练。人们几乎没有空间承担复杂的角色，从曾经主导工业前世界的体力劳动，转变为全球化社会中专注于行政工作的高认知劳动。看看卡车领域。美国卡车行业有数百万员工，`Elon\
    \ Musk` 承诺推出自动驾驶卡车。如果你让道路上挤满自动驾驶卡车，那些员工会发生什么？失业是镜子的一面。积极的一面是事故风险降低，这使得自动驾驶卡车成为一种伦理选择。对于美国和英国等发达国家的大多数劳动力，也可以想象出类似的场景。\n\
    \n这确实是最紧迫的担忧。人工智能在这方面带来了复杂的情绪。日益明确的是，人工智能并不是工作的杀手。相反，所使用的术语是“类别杀手”（category killer）。某些类别的工作最终会被人工智能消灭。例如，计算机系统在织布机领域取代了人类，导致就业从一个类别向另一个类别的转变。当人工智能系统落入普通人手中时也会发生同样的事情。研究表明，当人工智能接管世界时，类别流是避免的。目标性极强的部门是需要全天运行的客户服务和专业服务。公司可以将人力投入到更多的认知任务中。\n\
    \n这一新举动加剧了对不同行业劳动力流的担忧。人工智能正在加速不同业务流程的数字化转型。随着不同的公司期待适应并实施若干人工智能策略，现在是时候考虑是否与员工进行诚实对话是重要的了。最新的研究表明，将人工智能系统与人类合作的公司在提高产率方面显示出广阔的前景。他们的表现比完全用人工智能系统取代人类的公司好得多。另一方面，员工欢迎这些决定。他们觉得与机器作为同事一起工作更舒适，而不是将它们视为竞争对手和潜在的替代者。\n\
    \n### 不平等\n\n第二个伦理担忧是，当机器开始赚钱而人类坐在家里休息时，财富分配将发生什么。大多数服务和商品公司依赖于小时工作。通过使用人工智能，公司可以减少对人力劳动的依赖。这意味着收入将进入少数人的口袋。结果是拥有人工智能驱动公司的个人将继续获得大量财富。社会财富差距将继续扩大。创业创始人将获得巨额利润。`Silicon\
    \ Valley` 现在的员工比过去少。\n\n### 人性\n\n"
