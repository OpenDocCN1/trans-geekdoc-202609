    In addition, some of the most recent works done by Baidu and Google indicate that
    CNNs are have great accuracies, and at some tasks, they are even better than humans.
    It really seems that CNNs can be of great influence on some of the futuristic
    technology that is just around the corner.


    # [Image recognition](#toc.xhtml#s76a)


    One of the applications of machine learning models is sorting and classifying
    data. This model can even be used for the classification of images. Search engines
    use this kind of algorithm to identify photos, and social media sites now use
    facial recognition to identify a person in a photo before the photo is even tagged.
    They do this by learning from data composed from other photos. If your social
    media account can recognize your face in a new photo, it’s because it created
    models with data from all the other photos in your account.


    Image recognition techniques require in-depth learning models. These models are
    created with an artificial neural network, which will be discussed in more detail
    later in this book. Deep learning is the most complex type of machine learning
    where data is filtered through several hidden layers of nodes. They are called
    hidden layers because the models are unattended, which means that the features
    identified by the model are not preselected by the data scientist. Usually, the
    features are patterns that the model identifies on its own. Functions identified
    in neural networks can be quite complicated; the more complex the task, the more
    layers the model will have. Image sorting models may have only two or three layers,
    while self-driving cars have between one and two hundred hidden layers.


    We have made great strides in this area in recent years thanks to the increased
    availability of computing power. Imagine the computing power needed to run thousands
    of data points through hundreds of stacked nodes at once. Deep learning and artificial
    neural networks have become more feasible over the past decade with the improvement
    of computers and the reduction of costs for processing large amounts of data.
    Certainly, with the advent of the cloud, data scientists have access to enormous
    amounts of data without using physical storage space. **ImageNet** is a website
    that is a great resource for data scientists interested in photo classification
    and neural networks. It is a database of images that is publicly accessible for
    use in machine learning. The idea is that, by making it publicly available, data
    scientists from around the world can collaborate to improve machine learning techniques.


    The ImageNet database has approximately 14 million photos, with over 21,000 possible
    class groups. This offers a world of opportunities for data scientists to access
    and classify photos for learning and experimenting with neural networks.


    Every year, ImageNet hosts a competition for data scientists worldwide to create
    new image classification models. The competition gets tougher every year. Now
    they are starting to move to classify videos rather than images, which means that
    the complexity and required processing power will continue to grow exponentially.
    Using the millions of photos in the database, the ImageNet competition has made
    groundbreaking advances in image recognition in recent years.


    Modern photo classification models require methods that can work very specifically.
    Even if two images have to be placed in the same category, they can look very
    different. How do you make a model that can distinguish them? Take a look at the
    following image:


    ![](images/5.1.jpg)


    **Figure 5.1**


    These are two different photos of trees. Ideally, if you were to create a neural
    network model that classified images of trees, you would want your model to categorize
    both as photos of trees. A person can recognize that these are both photos of
    trees, but the characteristics of the photo would make it very difficult to classify
    them with a machine learning model.


    The fewer differences the variables have, the easier it will be to classify them.
    If all your photos of trees looked like the image on the left, with the tree in
    full view with all its features, the model would be easier to make. Unfortunately,
    this would lead to overfitting, and when the model is presented with photos like
    the one on the right, your model may not classify it correctly. We want our model
    to be able to classify our data even if they are not that easy to classify.


    Incredibly, ImageNet has been able to create models that classify data with many
    variables and very similar data. Recently, they have created image recognition
    that can even identify and categorize photos with different dog breeds. Imagine
    all the variables and similarities that the model would need to recognize in order
    to properly see the difference between dog breeds.


    The challenge of identifying similarities between classes is known as intra-class
    variability. If we have an image of a tree stump and a photo of a tree outlined
    in a field, we are dealing with variability within the class. This problem is
    how variables within the same class can differ, making it more difficult for our
    model to predict which category they will fall into. Most importantly, a lot of
    data is needed over time to improve the model and make it accurate.


    To have an accurate model despite high levels of variability within the class,
    we will have to use additional techniques with our neural network models to find
    patterns between images. One method involves the use of CNNs. Instead of just
    having one model or algorithm, data is fed through several models stacked on top
    of each other. The neural networks convert image features into numerical values
    to sort them.


    # [Biometric recognition](#toc.xhtml#s77a)


    As today’s technology has sneaked into every nook and corner of modern living,
    the protection of personal data has become more crucial. Biometric technology
    uses our body as a natural identification system through the application of statistical
    analysis to physiological or behavioral data. Now we are in the age of a technological
    revolution in the field of biometrics with a wide range of research and product
    developments taking place to utilize the complete benefits of this exciting technology
    in its entirety.


    Biometrics deals with measuring the physiological or behavioral information to
    verify an individual’s identity, and hence it is accurate and reliable.


    The two different phases involved in any biometric system are enrollment (registration)
    and verification (authentication). If a positive match is established, the user
    will be provided with the privileges or access to the system or service. In the
    case of personal identification, the entire database needs to be searched against
    the query biometric template. A good example of a personal identification system
    is an automated fingerprint identification service (AFIS), which is used by many
    law enforcement agencies to identify and track known criminals.'
