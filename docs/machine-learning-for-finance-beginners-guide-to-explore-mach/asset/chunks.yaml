- raw: 'True measures are variables of intervals that measure from a meaningful zero
    point. This trait is important because it means the ratio of the variable’s two
    values is large. The temperature scale of Fahrenheit used in the US and the scale
    of Celsius used in the rest of the world have this property. It doesn’t make sense
    in either system to say a 30 ° day is twice as warm as a 15 ° day. Similarly,
    a size 12 dress isn’t twice as big as a size 6, and gypsum isn’t twice as hard
    as talc, but on the hardness scale, they are 2 and 1. But it makes complete sense
    to say a fifty50-year-old is twice as old as a twenty-five-year-old, or a ten-pound
    sugar bag is twice as heavy as a five-pound one.


    Examples of true measurements are age, weight, length, customer tenure, and duration.
    Geometric distance metrics for interval variables and true measurements are well
    defined. It is important to transform these into interval variables in order to
    use categorical variables and rankings. Unfortunately, it may apply false details
    to those transformations. If random numbers 1 through 28 are assigned to ice cream
    flavors, it will mean that flavors 5 and 6 are nearly related while 1 and 28 are
    far apart.


    # [KNN algorithm](#toc.xhtml#s265a)


    The KNN algorithm is one of the simplest machine learning algorithms used by today’s
    data scientists. It was first developed for statistical prediction and pattern
    recognition in the early 1970s and can be applied to both regression and classification
    problems, although it is most commonly applied to classification models.


    # [How does KNN work?](#toc.xhtml#s266a)


    When making predictions, KNN must access the entire set of training data available.
    This means no learning is required as all data must be stored in memory and remain
    always accessible. If you are dealing with large data sets, you may want to consider
    complex data structures, such as k-d trees, to maximize storage efficiency and
    computational speeds.


    For each new data point, KNN searches through all the training data for the k
    closest entries (nearest neighbors). k is the number of neighbors considered by
    the algorithm: for k = 1 only the closest value will be considered, for k = 3
    the three closest values will be considered, for k = infinity the entire data
    set will be considered, etc.


    Once the k closest data points are identified (k-nearest neighbors), their properties
    and values are assessed. A function will consider all of these properties and
    compute an output value for the new data point. For regressions, the predicted
    value might be the weighted average of the nearest neighbors, and for classification,
    it may be the most frequent class.


    Distances or degree of separation between the new data point and its neighbors
    must also be considered. For instance, if two squares neighbors are closer than
    three strawberry neighbors, the predicted class of the new entry point may be
    squares. Of course, this depends on how you define distances in your data set
    (for now, you can think of distance as a measure of error).


    Before diving into the concept of distance and discuss the different metrics available,
    let’s visualize what was discussed this far. In the following figure, you will
    find a training data set for two classes of data: squares and diamonds. The two
    variables that define these points are: Loan$ and Age. These are called the predictors.


    Using this data set, a KNN algorithm can be used to predict a class of new data
    points: is the circle a square or a diamond? In this particular example, I have
    chosen k = 4 for my KNN algorithm. Now, I must select the four nearest neighbors
    to the new data point, i.e., the circle.


    As you can see, two of the closest neighbors are diamonds and two are squares.
    What class should we assign to the circle? This will depend on how your algorithm
    defines the distance parameter. For instance, if you consider absolute distance
    (i.e., how far the point is on the graph from the training data), then your algorithm
    will predict “diamond” because the two diamonds are closer. However, if age is
    a more important factor in your study, you may choose to give it a greater weighting
    factor w. Hence, your distance is more biased towards minimizing the difference
    in age and will predict “squares” (because the squares are closer in age to the
    circle). Distance is a key parameter for any KNN algorithm, and hence, it must
    be chosen and tuned carefully on the basis of needs of your study.


    When specifying distance metrics for your algorithm, a few things must be kept
    in mind. First, you must select the most relevant predictors (i.e., age and loan
    in the previous example). Due to differences in the scale between predictors,
    it is common practice to normalize them to values between 0 and 1. For instance,
    in the example above, you would have Loan$ in the range of $60,000 to $250,000
    and Age ranging between 20 and 52; these discrepancies in scale must be factored
    into how your algorithm will deal with the distances between training data.


    If you want to assign a greater factor of importance to a chosen predictor, you
    can use a weight factor w after normalizing the data. For example, now your data
    will range from 0 to 1\*w. The greater the weight factor, the greater impact a
    predictor will have on determining the final output. Choosing the predictors and
    weight factors that give maximum accuracy is called parameter tuning. There is
    no right or wrong way to do this; it depends on many factors, and the best way
    remains trial and error.


    Although this process may appear confusing and even random at first, with experience
    you will learn to tune parameters quickly and effortlessly to an algorithm that
    works for your data and your requirements—it just takes practice.


    Once you have selected and weighted the predictors, you must now choose how the
    distance parameter is calculated. The most common approach is using Euclidian
    distance (if you do not have prior experience in machine learning, I highly recommend
    you use this technique). It is a very effective and straightforward technique,
    regularly used throughout the industry. The mathematical formula to compute the
    Euclidian distance is shown on the following page.


    There are other distance measures that can be implemented into KNN. Owing to the
    broad range of subjects covered in this book, I will only briefly mention these
    other metrics. Of course, there are more distance metrics that can be implemented;
    you can even create a bespoke distance function yourself to suit your predictors
    perfectly. Like many aspects of machine learning algorithms, a lot comes down
    to parameter tuning:


    *   **Hamming distance:** Useful when dealing with binary vectors (i.e., classes).


    *   **Manhattan distance:** Use the sum of the absolute difference between data
    vectors to calculate distance.


    *   **Minkowsky distance:** A combination of Manhattan and Euclidian distances.


    With regards to the optimum value for k, again, there is no right answer. Parameter
    tuning and experimenting are required to identify what works best for your training
    data and your individual needs. However, do keep in mind that large values of
    k will have longer computational times. The specific impact of this depends on
    the complexity of your algorithm, the size of the data set, and computational
    power available.


    Another key concern when dealing with the KNN algorithm is scale, particularly
    relating to the size of your training data. Remember that, in order to make a
    prediction, the algorithm must access each entry in the training data and search
    for k with the most similar values (the nearest neighbors). If your training data
    consists of hundreds of thousands of entries, analyzing each point means significant
    challenges in computational time and storage space.'
