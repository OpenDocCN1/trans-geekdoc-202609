    第 6 章 深入讨论了神经网络及其工作原理、它们的不同类型和优势。随后回顾了梯度提升机和梯度下降。


    第 7 章 描述了序列建模技术的不同类型，并回顾了机器学习（ML）建模流程，该流程包括特征工程、模型选择、模型训练、模型验证以及在新数据上进行测试。


    第 8 章 讨论了哪种机器学习算法适用于你的业务问题。随后介绍了什么是数据降维技术。它还回顾了强化学习的概念、类型和应用。


    第 9 章 描述了为什么金融业处于技术的最前沿。进一步讨论了机器学习如何为金融业带来收益。还回顾了一些一些用例以及机器学习对金融业的影响。


    第 10 章 描述了技术对金融科技（FinTech）公司的影响。随后描述了金融科技公司面临的主要挑战。


    第 11 章 回顾了银行业中的机器学习用例。还讨论了机器学习在网络安全、信用评分、算法交易和机器人投顾中的应用。


    第 12 章 描述了信息被盗窃的不同方式。随后讨论了阻止此类欺诈的不同安全措施。


    第 13 章 讨论了数据挖掘和数据可视化及其在实际应用。


    第 14 章 讨论了机器学习的优缺点。


    第 15 章 深入讨论了机器学习的应用。


    第 16 章 回顾了机器学习不仅对金融领域，还对我们的生活、经济以及整个人类的影响。


    第 17 章 讨论了人工智能在银业的应用。


    第 18 章 深入讨论了传统算法，如回归、k-means 聚类、k-最近邻、主成分分析算法、多项式拟合和最小二乘算法、强制线性回归算法、支持向量机算法、条件随机场算法和决策树算法。


    第 19 章 列出了一些关于机器学习的常见问题。


