    Prevent this by erasing personal data. Offer responses to the security inquiries
    of monetary records that don’t show up on your online networking pages.


    # [Security measures](#toc.xhtml#s194a)


    Credit/check cards are helpful yet perilous as con artists have thought of a few
    creative strategies to extract personal data. You are encouraged to stay careful
    and take proper measures to stay that way.


    # [Some tips on card security](#toc.xhtml#s195a)


    *   Quickly sign the back of your card.


    *   Try not to let any other person use your card, NAB ID, or verification gadget.


    *   Continuously know where your card is, keep it safe from misfortune or loss,
    and watch out for home security.


    *   Be aware of card misrepresentation and security on the web. You don’t need
    your character stolen.


    *   Bear in mind your card and receipt at the ATM. Tell your supplier promptly
    if your card is lost or stolen.


    *   Upon expiry, cut your card askew, down the middle (counting any implanted
    microchip on the card, attractive strip and security code).


    *   Try not to use an ATM in the event that you believe something’s wrong


    # [Security tips for Internet banking](#toc.xhtml#s196a)


    *   Keep security points of interest secret, and don’t record them and store them
    with your cards.


    *   Retain your details on the off chance that you can. Banks ought to never request
    security details online, so disregard any messages indicating to be from a bank
    requesting that you enter your points of interest.


    *   Try not to give anybody a chance to see you entering your secret key or PIN.


    *   Tell your bank instantly on the off chance that you lose or overlook a secret
    word or PIN or on the off chance that another person uses it.


    *   Evade simple-to-figure combinations of numbers or letters or ones effectively
    identifiable with you, i.e., your birthday, portable, postcode, etc.


    *   Frequently change your PIN and passwords. Contact your supplier to see what
    security highlights they offer.


    # [Conclusion](#toc.xhtml#s197a)


    The financial sector is the most vulnerable, or should we say a hot target for
    fraud, simply because of money. Using an electronic system to get to know your
    client (eKYC) and security measures should be properly put in place to avoid fraud.


    In the next chapter, we will learn about data mining and data visualization and
    their uses.


    # [CHAPTER 13](#toc.xhtml#c13)


    # [Uses of Data Mining and Data Visualization](#toc.xhtml#c13)


    # [Introduction](#toc.xhtml#s198a)


    Data comes from a variety of fields such as tracking devices and credit cards,
    which are being gathered since people feel it is useful. The challenge is to locate
    useful information buried in all this data. This is a daunting task, and this
    is where data mining comes into play.


    In order to make data mining valuable and efficient, it is important to involve
    humans in the data discovery procedure. The concept of visual discovery in data
    mining is to depict raw visualization data. Humans will then obtain understanding,
    draw assumptions, and engage with the evidence.


    # [Structure](#toc.xhtml#s199a)


    In this chapter, we will cover the following topics:


    *   Data visualization.


    *   Data mining.


    *   Future health care.


    *   Education.


    *   Customer relationship management.


    *   Criminal investigation.


    *   Fraud detection.


    *   Customer segmentation.


    *   Intrusion detection.


    *   Lie detection.


    # [Objective](#toc.xhtml#s200a)


    After studying this chapter, you should be able to do the following:


    *   Understand the concept of data mining and data visualization.


    *   Understand the real applications of data mining and data visualization.


    # [Data visualization](#toc.xhtml#s201a)


    Data visualization is a method in which visual essentials such as charts and graphs
    are used to draw meaningful insights from the data. It is meant to show the facts
    behind the data and to further allow the user to see the structure of the data.


    # [Data mining](#toc.xhtml#s202a)


    Data mining is a method used by businesses to translate raw data into usable information.
    By using algorithms to search for trends in vast batches of data, companies may
    understand more about their clients in order to create more successful marketing
    campaigns, improve revenue, and cut costs.


    There are several other uses of data mining and visualization, and they are as
    follows:


    # [Future health care](#toc.xhtml#s203a)


    Data mining and visualization have shown great potential in health systems. Health-care
    systems use data and analytics in identifying the best practices to be used to
    improve health care while looking for cost reduction options. Researches make
    use of data mining and visualization for approaching multidimensional databases,
    software computing, and machine learning. It can be used to predict the number
    of patients in different categories.


    # [Education](#toc.xhtml#s204a)


    Data mining and visualization can be used in the educational environment. It can
    be used in predicting a student’s future through study behavior and the effects
    of educational support. It can also be used in advancing scientific knowledge
    centered on learning. Institutions can make use of data mining and visualization
    to make accurate decisions while predicting students’ futures.


    # [Customer relationship management](#toc.xhtml#s205a)


    Customer relationship management is a good way of getting and keeping customers.
    It can be used to predict customer strategies and maintain a good relationship
    with them. With data mining and visualization techniques, collected data can be
    used for analysis, so instead of businesses getting confused about the focus points
    in customer retention, they can easily identify the problem and find a solution.


    # [Criminal investigation](#toc.xhtml#s206a)


    Criminology is a study of certain crime characteristics. The high volume of crime
    data sets can show the relationships between certain fields, and text-based crimes
    can be converted into word processing files.


    # [Fraud detection](#toc.xhtml#s207a)


    Fraud is a crime that has taken over billions of dollars. Although traditional
    methods of fraud detection are effective in some cases, they take a lot of time
    and are relatively complex. Data mining and visualization can provide a meaningful
    pattern by transforming information into insightful data. Any information that
    is valid in crime detection is considered as knowledge. It is important to note
    that fraud detection systems should be able to protect the information of all
    its users. Data mining and visualization aid in the collection of sample records,
    which are then classified as either fraudulent or non-fraudulent. Data mining,
    for example, is built to locate sources of data such as web scraping from different
    sources.


    # [Customer segmentation](#toc.xhtml#s208a)


    Customer segmentation, a very important part of business, should not be overlooked.
    The use of traditional market research can help in segmenting customers, but the
    use of data mining goes a lot deeper and helps by increasing the market effectiveness.
    Data mining can align the customers into a more distinct segment while tailoring
    to their needs according to their reviews. In business, the market has to do with
    getting and retaining customers, and this should be done in the most efficient
    way possible. With data mining and visualization, you can easily determine a customer’s
    vulnerability and a business can offer them special features to enhance their
    satisfaction and keep them engaged and interested.


