    `random forests`, `long and short-term memory neural networks`, and some other
    algorithms. These studies anticipated Bitcoin price fluctuations to some extent
    and concluded that the best results could be obtained by using algorithms based
    on neural networks. The deep learning enhancement was able to beat the performance
    of buy-and-hold strategies in predicting the prices of twelve different cryptocurrencies
    over a one-year period. There were other attempts to use machine learning to predict
    the prices of cryptocurrencies other than Bitcoin, but they came from non-academic
    sources and did not yield any comparisons for the results.

