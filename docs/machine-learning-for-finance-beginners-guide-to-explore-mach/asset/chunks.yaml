    and they continue to improve themselves. They are getting better at modeling human
    relationships and conversations. In 2015, an artificial-intelligence-driven bot
    Eugene Goostman was awarded the Turing challenge. This milestone is just the start
    of the era where humans will be in frequent interaction with machines as if they
    are real humans. Project Debater is one example. This interaction is going to
    happen on a large scale in the fields of sales and customer service. While humans
    may be limited in kindness and attention, artificial-intelligence-driven bots
    are not, and they can build and cement relationships that can ultimately benefit
    a business.


    Many of us may not be aware of this, but machines already surround us. If we take
    a critical look around us, we will realize that different machines are interacting
    with us. Perhaps today you have seen a clickbait headline that led you to a business
    landing page, or you might have reached a video game page. These ads and headlines
    are optimized by artificial-intelligence-driven bots that monitor your search
    habits and come up with the topic you mostly search for. This, along with other
    methods, is used to get people addicted to video games and other entertainment.


    Many people see artificial intelligence as a transformative technology. The question
    is whether such systems will be able to transform society fully. Will it be able
    to mow our lawns? Will it help us raise our kids? Will they fight our wars for
    us? Will it write our articles and let us relax and watch TV? Will it create political
    advertisements? All these questions are worth a debate.


    # [Disinformation](#toc.xhtml#s241a)


    Artificial intelligence systems are being used to create fake videos, images,
    and conversations to misguide people on important social and political debates.
    We cannot believe what we see online. The scenario is nothing less than a disaster
    if you cannot tell whether the image you see on the Internet is real or artificial-intelligence-generated.
    Artificial-intelligence-driven bots were blamed for the havoc that happened during
    the 2016 US presidential elections. Bots spread and fanned certain political propaganda
    on a wider scale. Automated social media accounts aided in the creation and spread
    of misinformation on the Internet in an attempt to manipulate voters from different
    strata of society. The activities fueled partisan disagreement in society and
    almost polarized it by deepening the gulf between two groups in the society. What
    makes artificial-intelligence-driven bots better than humans is their ability
    to work day and night tirelessly without a break. They are very fast and can generate
    a huge amount of content in a small time frame. Once the news is shared and retweeted
    by others, it starts to go viral. These bots are very effective at spreading false
    news or altered facts. They can amplify messages and put certain thoughts in the
    heads of people. Now criminals and different state actors are using fake imagery
    to interfere with the operations of the government. All it takes now are a couple
    of malicious actors who take on the job of spreading false claims to alter the
    opinion of the general public.


    Going forward, corporations and governments will have to think about how they
    are going to reign amid political damage by these artificial intelligence systems.
    The only thing that can save governments and corporations is the way they respond
    to fake news and fake content. They should take artificial-intelligence -backed
    fake content as seriously as they take cybersecurity threats.


    # [Artificial intelligence and crime](#toc.xhtml#s242a)


    Do we want bad guys to get their hands on artificial intelligence technology?
    While artificial intelligence has the potential to do a lot of good to us, we
    must keep in mind that artificial intelligence can be dangerous in the hands of
    malicious users. As technology gets more powerful, it can inflict severe damage
    if it falls into the hands of the wrong people. They can use it to steal big cash
    and launch unprecedented attacks on government machinery. They can use it to launch
    a malicious hacking attack on big organizations and compromise their data. What
    happened during the 2016 elections left most people in awe. The latest technology
    targets the vulnerability in a computer network. As the technology evolves, it
    will become more resilient and tough and will sustain any attempt made on making
    these systems weaker. This is terrifying. Just imagine a scenario in which an
    artificial intelligence system operates in hiding and is invincible as per current
    security standards. It can do whatever its operator wants. Thus, there is the
    need for the construction and management of a resilient and advanced digital infrastructure.
    Detection of these malicious attacks is destined to get tougher; therefore, there
    is a need to patch the security vulnerabilities along with the evolution of artificial
    intelligence systems.


    # [Racist robots](#toc.xhtml#s243a)


    Artificial intelligence is capable of processing at high speed and accuracy that
    are beyond the scope of humans, but it cannot always be trusted to stay fair and
    neutral. Google is one of the leaders in terms of artificial intelligence, as
    you can see in its Google Photos service that categorizes different photos of
    different people and places them in separate folders for ease of use. It also
    collects photos of the same person to create collages. Artificial intelligence
    in Google Photos is generally used to identify different people and scenes as
    well.


    But it would be wrong if the software that is designed to predict future criminals
    is biased against black people. The problem is that humans program artificial
    intelligence systems, so whatever humans tell them to do, they will act upon it.
    If humans tell them that black people are most likely to commit crimes in the
    future, the artificial intelligence system will label them as such. However, if
    the technology is used in the right manner, it can bring a positive change in
    the world.


    # [Artificial intelligence vs. humans](#toc.xhtml#s244a)


    It is not just the enemies that you should be worried about. The biggest concern
    that irks lots of people including Tesla CEO Elon Musk is, what if an artificial
    intelligence system turns against us? This doesn’t mean it would turn evil in
    the way a human does. It means an advanced artificial intelligence system that
    can fulfill all of your wishes but has terrible consequences in the end. A machine
    has no feelings; therefore, it cannot show malice against anyone. Which means
    it could also a lack of understanding of the context in which the wish was made.
    Just imagine an artificial intelligence system that is tasked with eliminating
    cancer from the world. So it creates a formula to eliminate cancer and ends up
    killing all the people on the planet, because there is a little bit of cancer
    in every human being. So, this kind of misunderstanding can be devastating for
    humans across the world. While neuroscientists are working on unlocking the hidden
    secrets of the conscious experience, we need to understand the basic mechanisms
    of aversion and reward.


    # [Conclusion](#toc.xhtml#s245a)


    In this chapter, we discussed the impact of machine learning not only on the financial
    sector but also on our lives, economy, and humanity as a whole.


    The next chapter will take you through the application of artificial intelligence
    in the banking sector.


    # [CHAPTER 17](#toc.xhtml#c17)


    # [Artificial Intelligence in Banking](#toc.xhtml#c17)


    # [Introduction](#toc.xhtml#s246a)


    Banks can use artificial intelligence to improve customer experience by enabling
    smooth and continuous interactions. However, artificial intelligence in banking
    is not limited to retail banking only. It can flex its muscles in investment banking
    and other financial services as well.


