    # 第 2 章


    # 朴素贝叶斯、正态分布与自动聚类


    ## 引言


    对机器学习看似不可阻挡的兴趣源于数据挖掘和贝叶斯分析应用更广泛的变量。导致这种流行的根本因素是不断增加的数据量和多样性、更廉价且更有效的计算处理，以及廉价的数据存储。为了了解机器学习在我们日常生活中有多重要，只需指出我们先进生活方式中的哪些部分没有受到它的影响即可。人类生活的方方面都受到旨在扩展人类能力和提高效率的智能机器的影响。人工智能和机器学习是“第四次工业革命”的核心，这可能会对人类的思想产生怀疑。


    所有这些因素意味着，模型可以分析更大、更复杂的数据，并在短时间内交付高度准确的结果，并且在更大的规模上快速自动地生成。企业可以通过构建符合其业务需求所需的机器学习模型，轻松地识别潜在的增长机会或避免未知的危险。数据流经每家公司的脉络。数据驱动的策略日益成为优胜者之间的区别特征。机器学习提供了解锁业务和客户数据重要性的魔法，从而产生可操作的措施和决策，使公司的业务和市场份额飞速增长。


    机器学习近年来表明，许多曾被认为只有人类活动的活动可以自动化，例如图像识别、文字处理和游戏。在 2014 年，机器学习和人工智能专家认为，机器至少需要十年才能在围棋游戏中击败世界上最大的玩家。但他们错了；Google
    的 DeepMind 表明，机器可以学习考虑哪些移动，即使是在像围棋这样复杂的游戏中。在游戏领域，机器已经经历了多次创新，例如 OpenAI 团队的 Dota
    Bot。机器学习在我们的日常生活中具有巨大的经济和社会影响。全工作活动和整个工业格局都可能实现自动化，劳动力市场将永远改变。


    机器现在可以使用先前的计算和底层算法进行自主学习和训练，产生高质量、易于复制的决策和结果。机器学习已经存在了很久，但近期机器学习算法的进展使得机器能够高效地处理和分析大量数据。这是通过使用高速高频自动化，将先进复杂的数学计算应用于机器来实现的。如今复杂的计算机可以快速评估海量数据并交付更快、更准确的结果。使用机器学习算法的企业提高了灵活性，可以根据其业务需求定制训练数据集并相应地训练机器。通过这些自定义的机器学习算法，公司可以识别潜在的危害和增长机会。通过与人工智能和认知技术相结合，机器学习算法被用于开发在处理大量数据（或大数据）方面非常有效且高效的计算机，并产生高度准确的结果。


    随着这一研究领域的不断扩展，已经产生了成百上万种机器学习算法。以下是一些按机器学习类型分类的常用算法：


    为了唤起你的记忆，引导式学习（guided learning）由数据科学家驱动，他们使用预定义的训练数据集教算法得出何种结论。引导学习需要关于算法所有可能输出的数据，以及已经标记了预期或正确结果的训练数据集。


    让我们详细查看用于开发机器学习模型的两个最著名的引导学习算法。


    # 结构


    在本章中，我们将涵盖以下主题：


    *   朴素贝叶斯

    *   正态分布

    *   数据挖掘中的自动聚类检测

    *   高斯模型

    *   机器学习在网络安全中的应用


    # 目标


    学习本章后，你应该能够做到以下：


    *   理解朴素贝叶斯、正态分布和自动聚类检测的技术方面。

    *   理解机器学习在网络安全领域的应用。


    # 朴素贝叶斯


    朴素贝叶斯基于贝叶斯法则。这种分类方法假设不同的预测变量之间是相互独立的，并且一个特征与存在的任何其他特征没有任何关系。


    例如，你可以称一个水果为橙子，是因为它的橙色颜色、圆的形状和皮的纹理。但这并不意味着颜色、形状和纹理相互依赖以证明所观察到的水果是橙子。


    如果你有海量数据集需要处理，这个模型将非常有帮助。事实上，在数据分类方面，它已被证明是最有效的方法。


    # 贝叶斯分类


    贝叶斯分类取决于条件概率的概念。在给定一个条件成立的情况下，第二个条件也为真的概率是多少？在天气预报的背景下考虑这个问题。如果你知道今天是阴云天气，下雨的概率是多少？如果你知道今天是晴天，下雨的概率是多少？理解为什么第一种情况的概率会比第二种高得多并不太难。


