    \ the basis of those changes.\n\n2. **What is an agent in the context of artificial\
    \ intelligence?**\n\n   **Ans.** The machine or program that is displaying the\
    \ intelligence capabilities is referred to as the agent. The agent is essentially\
    \ the actor that is engaged in cognition or learning in a way that is described\
    \ as artificially intelligent. The term “agent” basically allows scientists and\
    \ theorists to have a convenient way of describing artificially intelligent machines\
    \ both in a real, practical sense and theoretically.\n"
  trans: "\n\n一种有效的解决方案是使用数据的随机子集。这意味着，如果你的训练数据有 100,000 条目，你仅使用随机选择的 1,000 个点来构建\
    \ `KNN` 算法。这通常是处理大型数据集的一种良好折宜方法。你可以大幅缩短计算时间并保持良好的准确率，特别是当训练数据中存在大量重复时。为了选择合适的随机子集大小，我倾向于运行多次试验并将结果与整个数据集进行比较。你会发现，随着子集大小的减小，预测准确性也会随之下降。根据对计算时间和准确率的需求，选择一个最小阈值差异（例如\
    \ 95%），然后选择符合该差异的最小子集大小。务必对多个条目运行此测试以避免任何离群值。\n\n# 为 KNN 准备训练数据\n\n在运行任何机器学习算法之前准备和过滤训练数据可以大幅提高预测能力、准确性和效率。在实现\
    \ `KNN` 时，你应该始终执行以下操作：\n\n- **缩放预测变量：** 始终尝试归一化你的预测变量，使其落在 0 到 1 之间。\n- **移除缺失数据：**\
    \ 如果数据点缺失（即值为 0），它会对距离计算造成严重破坏。所有全零数据都应从训练数据中删除。\n- **减少条目数量：** 正如所解释，`KNN` 必须访问并检查训练数据集中的所有条目。如果其中包含\
    \ 100,000 个点，将需要很高的计算能力。通过使用随机子集（例如，随机选择的 1,000 个点），你可以大幅减少计算需求，通常对准确率的影响微乎其微。\n\
    \n# 结语\n\n`KNN` 算法是一种简单的机器学习算法，能够提供极具竞争力的结果。该模型需要访问所有训练数据集，因为它不执行学习过程。它是机器学习算法初学者或希望快速构建预测模型的人的完美选择。尽管具有内在的简单性，但有许多变体和参数可以进行调整，以最大化预测准确性和计算速度。请记住，没有单一的最有效设置；与大多数机器学习算法一样，你将需要使用最适合你训练数据的试错法对所有参数进行实验和调优。\n\
    \n# 主成分分析 (PCA) 算法\n\n它是机器学习中最简单的算法之一。这帮助你识别可以预测的最小数据元素，并尽可能地减少细节。它被用于目标检测、计算机视觉和文件编码等各个领域。关键组件的估计限于对初始数据的特征值、特征向量和协方差矩阵值的计算，或数据矩阵的奇异分解。\n\
    \n通过 `PCA`，我们可以交流不同的信号、可以说是组合在一起的简化模型。例如，防止信息缺失绝对是不可行的，尽管 `PCA` 方法会帮助我们缓解这一点。这是一种衡量有序元素的方法。\n\
    \n# 多项式拟合与最小二乘算法\n\n最小二乘法是一种用于解决不同问题的统计技术。它侧重于减少与其他函数理想变量的变化的平方。它可以用于求解超定方程结构（当迭代次数达到不确定性数量时），在普通意义上（非超定）的变分方程系统中寻找答案，以及计算特定函数的得分点。使用此算法拟合基础曲线/回归。\n\
    \n# 强制线性回归算法\n\n最小二乘法可能会误淆过冲、虚假区域等。约束对于减少我们引入数据收集的线条变化至关重要。最佳答案是适应线性回归公式，这意味着权重没有被错误定义。模型可以是\
    \ `LASSO` 或岭回归，或者两者都是（`弹性回归`）。使用这种方法适应回归轴上的约束，而不进行覆盖。\n\n# 支持向量机 (SVM) 算法\n\n\
    `SVM` 是一种线性模型（例如逻辑/线性回归）。区别在于它具有损失特征并侧重边缘。使用优化技术（例如 `L-SGD` 或 `BFGS`），你可以最小化损失函数。`SVMs`\
    \ 的一个方面在数据集上运行良好。分类算法（甚至是回归器）可以配备 `SVM`。\n\n# 条件随机场 (CRFs) 算法\n\n该算法用于表示类似于 `RNN`\
    \ 的序列，并可以与 `RNN` 结合使用。也可以用于图像分割和其他组织预测活动。`CRF` 算法为序列中的每个部分（例如句子），使得相邻项影响序列中标记的项而不是单个标签。将\
    \ `CRF` 算法用于图像、文本、时间序列数据和 DNA 等序列。\n\n# 决策树算法\n\n机器学习中最流行的算法之一，用于分析中的统计建模和数据处理。布局反映了划分和叶节点。目标函数属性依赖于决策树的分支。目标函数的结果在叶节点中计算，残差节点包含了案例变化的属性。\n\
    \n在需要分类新案例时，你必须向下移动到叶节点以提供正确的含义。目标是构建一个以多个输入变量为中心并预测输出变量值的模型。\n\n# 结论\n\n在本章，我们讨论了传统算法：回归、k-means\
    \ 聚类、k 最近邻、`PCA` 算法、多项式拟合与最小二乘算法、强制线性回归算法、`SVM` 算法、`CRF` 算法和决策树算法。\n\n下一章涵盖常见问题。\n\
    \n# 第 19 章\n\n# 常见问题\n\n1. **什么是人工智能？**\n\n   **答。** 人工智能可以用多种方式定义，但定义人工智能的问题比看起来要复杂，因为随着机器能够做（以及正在做）的天花板不断提高，我们对人工智能的理解发生了变化。\n\
    \n   例如，某些人从机器学习的角度考虑人工智能。这种人工智能的定义将关注从环境中接收外部线索、对环境进行建模并根据这些变化对其核心结构或行为进行更改的能力。\n\
    \n2. **在人工智能背景下什么是代理 (agent)？**\n\n   **答。** 展示智能能力的机器或程序被称为代理。代理本质上是以被称为人工智能的方式进行认知或学习的执行者。“代理”一词基本上让科学家和理论学家能够从现实、实际意义和理论上有一种方便的方法来描述人工智能机器。\n\
    \n"
