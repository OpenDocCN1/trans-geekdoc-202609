    The detection of a DoS attack is mainly carried out in one of the following two
    ways of intrusion detection:


    - Signature-based intrusion detection.

    - Anomaly-based intrusion detection.


    Signature-based intrusion detection works by comparing the network with known
    network attack patterns stored in the database. Although this method has fewer
    false positive alarms, it may not detect zero-day attacks. Anomaly-based intrusion
    detection uses the statistics of network traffic such as packet header information,
    packet size, and packet rates to detect various intrusions in the network. Although
    anomaly-based intrusion detection mechanisms do not require databases of anomalies
    to compare (resulting in lesser memory requirement and maintenance), it has difficulty
    in detecting malicious traffic that is similar to normal traffic, such as low-rate
    DDoS attacks, and has no guarantee of detecting unknown attacks.


    Some of the features used by machine learning models are entropy, number of data
    bytes transferred from source to destination, number of connections to a host,
    source, and destination IP addresses, byte rate, packet rate, TCP flag ratio,
    SYN packet statistics and flow statistics, SYN flag presence, classification fields
    and protocol fields, TCP SYN occurrence, destination port entropy, entropy of
    source port, UDP protocol occurrence and packer volume, and so on. Machine learning
    techniques such as `SVM`, `KNN`, `Naive Bayes`, and `k-means` have been used for
    DoS/DDoS detection.


    ## Anomaly detection


    Anomalies may not correspond to cyberattacks all the time but can be new behavior.
    Anomalies or abnormal or unexpected behavior can be detected and categorized as
    discussed below.


    In `k-means` clustering, the objects are grouped into `k` disjoint clusters on
    the basis of the feature vector of the objects to be grouped. A network data mining
    (NDM) approach along with the `k-means` clustering algorithm can be used to separate
    time intervals with normal anomalous traffic in a training data set.


    In `k-medoids`, each cluster is represented by the most appropriate center object
    (medoid) in the cluster, rather than by the centroid that may not belong to the
    cluster. `k-medoids` can be used to detect network anomalies that contain unknown
    intrusions, and is found to have more accuracy than the `k-means` algorithm.


    The new mean of the cluster is computed on the basis of weight measures. `EM`-based
    anomaly detection mechanisms are found to outperform both `k-mean` and `k-medoids`-based
    methods.


    Unsupervised and supervised learning algorithms can be combined to form hybrid
    approaches for anomaly detection. In this manner, the efficiency and accuracy
    of anomaly detection can be improved. A combination of `k-means` and `ID3` decision
    tree is known for the classification of anomalous and normal activities in computer
    address resolution protocol (`ARP`) traffic.


    Some machine learning approaches for intrusion detection also use artificial neural
    networks and support vector machines. A hybrid approach by combining the entropy
    of network features and `SVM` can overcome the drawbacks of individual approaches,
    resulting in anomaly detection with high accuracy.


    Thus, different machine-learning -based anomaly detection approaches exist. A
    model is built on the basis of normal and abnormal behavior of the system. Different
    approaches can be adopted depending on the type of anomaly. When the model for
    the system is available, it is tested with the observed traffic. If the deviation
    is found to be more/less than a predefined threshold, then the traffic is identified
    as anomalous.


    ## Conclusion


    In this chapter, we discussed the technical algorithmic aspects of `Naive Bayes`,
    normal distribution, and automatic cluster detection with the `Gaussian process`.
    We also discussed machine learning techniques that can be applied to a variety
    of cybersecurity problems such as spam detection, phishing page detection, malware
    detection, and anomaly detection.


    In the next chapter, we will be discussing how to structure the data.


    # CHAPTER 3


    ## Machine Learning for Data Structuring


    ### Introduction


    Text mining is one of the most complex technologies in the machine learning field.
    This is because text mining involves unstructured data. There are no well-defined
    observations and variables. Therefore, in order to perform some sort of analytics,
    you must first transform this unstructured data set into a structured data set,
    and then continue using the usual modeling framework. What is the difference between
    structured and unstructured data? What will be the future of big data and data
    science? You will find the answers to these questions in this chapter, so let’s
    get started.


    ### Structure


    In this chapter, we will cover the following topics:


    - Data structuring

    - Future of big data

    - Structured and unstructured data


    ### Objective


    After studying this chapter, you should be able to do the following:


    - Understand the difference between structured and unstructured data.

    - Understand the future of big data.


    ### Data structuring


    There are many different forms of data, but at its highest level, data is mainly
    categorized in three ways:


    - **Structured:** This type of data is incredibly organized. It is found in databases,
    `CSV` files (as values separated by commas), or other repositories. The data format
    ensures it is right for computation and inquiries, using `SQL`, or other structured
    languages.


    - **Semi-structured:** This type of data doesn’t follow the way data models are
    structured when associated with data tables like relational databases, but does
    have markers and tags that keep the semantic elements apart and enforce hierarchy
    in the data fields and records.


    - **Unstructured:** This type of data has no real structure, such as natural language
    text or audio streams.


    Clearly, the most useful data is structured data because it is ready for immediate
    manipulation. As a rule, only around 20% of the total data is represented by structured
    data, while the remaining 80% is a combination of unstructured and semi-structured
    data.


    Beware, though; most of what we call unstructured data does have some kind of
    structure. Take an article for publishing on the Internet, for example. While
    it is classified as unstructured, it does have a structure of sorts by way of
    tags and metadata for the article content. It is classified as unstructured because
    the content itself has no real structure that is usable straightaway.


    ### The future of big data


    We are in the midst of a seismic shift in the data science world. This realization
    is beginning to manifest itself in the marketplace, with the newer analytics tools
    focusing more on deriving insight from data than running reports and dashboards.
    Which is, of course, the correct way to look at this problem or any problem—focus
    on the end goal. Don’t focus on the “how”; keep your eye on the prize.


    However, the tools available today are primarily old-school business intelligence
    tools that are being retrofitted as fast as possible to try to ride this wave.
    Whether or not they will actually succeed or a new generation of tools will need
    to emerge is still an open question.


    With that in mind, here are five developmental directions to watch:


    - **Your data will tell you what is interesting:** Current business intelligence
    does exactly the opposite; you tell your tool what you’re interested in. The coming
    generation will tell you what’s interesting. Generating these types of insights
    will become much easier in the coming years, and personalization will have a lot
    to do with this. Think about how revolutionary `Pandora` was for music when you
    first tried it—it actually learns what you find interesting! This is the direction
    analytics is heading in.

