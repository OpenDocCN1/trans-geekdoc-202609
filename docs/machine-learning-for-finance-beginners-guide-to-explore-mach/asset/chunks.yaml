- raw: 'The first time I heard the word FinTech, I was at the Atlanta Federal Reserve
    Bank’s Financial Markets Conference on Amelia Island in May 2016. At this annual
    meeting, which I have attended nine times, about 150 of the world’s top economists
    are invited to join regional Fed bank presidents, government regulators, academics,
    and often the chairman of the Federal Reserve to discuss the hottest economic,
    monetary policy, and fiscal policy issues of the day.


    Against a backdrop of this prestigious conference, a Fed reporter, whom I have
    known for years, and I skipped out of some sessions to enjoy the beautiful early
    May Florida weather. My friend was with another reporter whose specialty was FinTech.
    At the time, I had not yet heard of FinTech. So I asked naively, “What’s that?”
    The reporter told me FinTech was “like Bitcoin and stuff like that.” I knew Bitcoin
    was a digital currency, so that was that.


    I didn’t think too much of this conversation until several months later when I
    tried to hire a salesperson for Prestige Economics. I had difficulty finding candidates.
    Highly qualified people were exiting the space in droves, and I didn’t know why.
    Finally, one senior salesperson told me that everyone was getting out of financial
    market research because of FinTech. Essentially, robots were disrupting the research
    business. After being told that FinTech was disrupting my own business, I decided
    to learn as much as possible about it by taking a FinTech course at MIT. In short,
    the robots had been coming for me, and I hadn’t even known it.


    # [FinTech: Robocalypse comes to finance](#toc.xhtml#s131a)


    FinTech is a buzzword for financial technology, which represents a host of businesses
    that are designed to disrupt (and eat the lunch of) traditional financial institutions.
    FinTech companies generally reduce costs, reduce complexity, or increase ease
    of use for transactions that had previously been the domain of banks.


    FinTech is affecting financial services, and awareness has been spreading. Asset
    management has long been dominated by computers, statistical analyses, and programming.
    And FinTech has been disrupting asset management, often with passive trading strategies.
    Some of these strategies are known as robo-advising, owing to their automated
    (i.e., robot-like) nature. And the result? Asset managers are losing their jobs,
    and the disruption potential for asset management is very high.


    In the movie “Wall Street,” Gordon Gekko asks Bud Fox, “Ever wonder why fund managers
    can’t beat the S&P 500?” Well, with the advent of exchange-traded funds (ETFs),
    fund managers and retail investors can just buy the S&P (and other indices), which
    is what they have done. A number of these ETFs are very liquid.


    The impact of FinTech on financial advice is as shown below:


    ![](images/9.1.jpg)


    **Figure 9.1**


    Passive asset management techniques and robo-advising are often easier and cheaper
    to administer than active asset management. These strategies can be implemented
    at significantly lower costs than active asset management strategies because they
    no longer require human asset managers. Plus, there is an economy of scale when
    computer programs do all the strategy work, analysis, and planning, as well as
    all of the buying and selling of securities. And passive asset management has
    also been adopted by finance and trading because these fields have historically
    embraced technology, with many firms using a black box model, algorithms, and
    technical trading strategies for many years.


    The number of ETFs is as shown below:


    ![](images/9.2.jpg)


    **Figure 9.2**


    Expensive items (like market research) would also no longer be part of the budget
    since decisions are made by computers. After all, trading programs do not read
    words. But they really like lines—especially lines above (or below) which the
    price of a traded security has consistently stayed for a long time.


    Technical trading has become more important, so analysts have been trying to add
    value by knowing what lines and supports matter most for the computers in different
    markets. This is why there has been a significant uptick in the number of financial
    professionals pursuing the Chartered Market Technician®, or CMT®, program. I completed
    the CMT® in 2016, and it focuses exclusively on these kinds of technical trading
    dynamics. Essentially, you are looking for computers in the market. I incorporated
    these technical trading dynamics into my forecasting long ago, which is why I
    have long expected that these kinds of trading dynamics will become increasingly
    important as passive asset management and robo-advising continue to grow.


    # [The impact of FinTech](#toc.xhtml#s132a)


    According to the PwC global report, FinTech’s most powerful weapon is the disintermediation
    of the system. Cutting-edge innovations and strategies in FinTech demolish the
    need for a middleman. Until now, in a conventional system, banks and financial
    services did the tough work of managing your money and assets. All the transactions
    used to occur via banks and monetary institutions. However, FinTech lets in customers
    to deal with the money themselves, peer to peer. There’s no needs to pay expenses
    and provider fees to an intermediary entity like banks. Clients can directly have
    interaction with any business and service, and pay them in advance through the
    latest FinTech like Bitcoin or similar cryptocurrencies.


    So, what is the future of banks and financial institutions? What will happen to
    the existing financial products and services? It is now clear that, with the emergence
    of FinTech and virtual currencies, disruption in customer banking and fee sectors
    is imminent. Insurance and asset management sectors are also on the list of endangered
    species. Studies show that up to 28% of businesses may be at risk by 2020, and
    they all are banking and payment offerings. In the PwC survey, a senior executive
    at a global banking organization said, “We thought we knew our customers, but
    FinTech’s really known our customers.”


    Customer banking and capital markets are going to be affected by FinTech the most.
    The emergence of transparent online platforms enables people and organizations
    to lend and borrow cash at once from each other. Innovative ideas on lending strategies
    and credit risk modeling algorithms deliver the customers powerful alternative
    credit models and risk calculation strategies. FinTech’s made the complete technique
    more customer-centric, and due to the fact, there are no intermediaries and the
    operating fee is very low.


    In the latest years, FinTech has created many online and mobile apps for payment
    methods. Formerly, even transferring credit score from one account to another
    required paying the middleman. However, now, virtual wallet apps and secure payment
    techniques have allowed alternative ways for transactions. Increasing the usage
    of virtual and digital money via smartphones is speeding up the entire technique.
    Additionally, we see that Internet penetration is rising globally, and people
    are buying products online more often. Their trust in FinTech is on the rise.
    Within the UK and many parts of the EU, there are shops that be given nothing
    but bitcoins for currency.


    FinTech has significantly modified the fee infrastructure. As actual-time payments
    are very famous these days, digital wallets are becoming more beneficial than
    conventional credit cards. Cryptocurrencies like bitcoins are more convenient
    than credit cards, and there are not part of the banks. On top of that, the underlying
    Blockchain generation can track the movement of money and assets more effectively
    and reliably than the conventional method, which takes days to verify. In a volatile
    market where your cash is not safe, Blockchain allows you the safe keeping of
    your cash and offers you overall transparency, free of feasible fraud or hacking.'
