- raw: 'The first three steps are usually repeated because you most likely will not
    build an optimal model for your project on the first try. As such, you will be
    building several models and then select the one that performs the best on the
    testing data set (which is unseen data).


    In addition, the testing step of the modeling process is not always performed
    because, in some cases, the goal of the data science project is root cause analysis
    (basically explanation) instead of predictions. For example, the goal of your
    project might be to determine the reason why some species are going extinct (explanation)
    instead of predicting which species is most likely to go extent (a prediction).


    Another trick commonly used in machine learning is chaining. The way chaining
    works is that, when several models are chained, the output of one model is used
    as input by another model and so on. When chaining different models together,
    each of them needs to be trained independently of the others, and only their results
    are combined together. In machine learning terms, this technique is known as ensemble
    learning.


    # [Feature engineering and selecting a model](#toc.xhtml#s106a)


    In feature engineering, you basically create feasible predictors for the data
    model. This is the very first and also one of the most crucial steps in the modeling
    process because the model will be able to give predictions by combining these
    features, and the accuracy of the predictions depends on how good the predictors
    are. In this step, it is advised to consult machine learning experts as it is
    very difficult for beginners to create good predictors.


    In textbook exercises, the data sets provided already include some features as
    variables; however, in practice, you will have to find the features all by yourself
    from different data sets. You may even find that these features are usually scattered
    between several different data sets. For example, in one of our data science projects,
    we had to procure a total of twenty data sets, after which we finally got the
    raw data we needed. This is a very detailed topic, and only touching the surface
    of feature engineering would not be helpful. Hence, it is recommended that you
    consult a machine learning expert or a dedicated machine learning book to learn
    about feature engineering. Once the features have been created, we need to choose
    the respective model to use with it.


    # [Training the model](#toc.xhtml#s107a)


    After we have created the right predictors and have selected the appropriate modeling
    technique for the project, we can now proceed to train the model on a training
    data set. A training data set is a data sample that you select for the model to
    learn to perform actions from. Popular modeling techniques are available to be
    implemented in almost any programming language that you may choose, including
    Python. These techniques essentially allow you to train your model by using a
    simple set of lines of codes. Advanced data science techniques require the scientist
    to be capable of using heavy mathematical calculations and then implement modern
    data science techniques to use with these calculations.


    Once we have trained the model, the next thing to do is check whether it works
    as we intended it to.


    # [Validating the model](#toc.xhtml#s108a)


    In the field of data science, you will come across a lot of different modeling
    techniques, and the question here is, which modeling technique is best suited
    for your project? Well, there is no specific answer to this, but every good model
    has the same two features:


    *   Splendid predictive power.


    *   Generalizes fairly well to data that is new to it.


    To create such a model, we need error measure in addition to a modeling technique.
    Usually, this error measure is paired with a validation strategy to properly validate
    the model.


    By now, we already know that the most common uses of machine learning in data
    science are regression and classification. As such, the popular error measures
    for both of these cases are mean squared error and classification error rate,
    respectively. In the classification error rate, we receive an error report that
    indicates how your model performed on the test data, i.e., how many observations
    have been mislabeled (lower percentage is better). The mean squared error tells
    us the average percentage of the model’s predictions error. However, it has one
    drawback. Faulty predictions can be in two directions, and squaring the error
    cannot cancel out the wrong prediction in one direction with another wrong prediction
    in the other direction. For instance, a model’s prediction overestimates the next
    month’s turnover by a value of 5,000. This wrong prediction cannot be canceled
    out by the model’s prediction underestimating the next month’s turnover by the
    same value of 5,000. Further, squaring the errors has one more problem, and that
    is large errors become even larger, although small errors can shrink (if they
    are less than one) or remain at the same level.


    There are several validations techniques available, but the most common techniques
    are as follows:


    *   **Dividing your data into a training set with X% of the observations and keeping
    the rest as a holdout dataset:** This technique is the most popular.


    *   **k-folds cross-validation:** This validation technique divides the original
    data set into a defined number of parts. The model then uses each part as a testing
    data set, while the rest of the parts are used as a training data set. The advantage
    of this technique is that you put the entire data in the data set to good use.


    *   **Leave one out:** This validation technique is strikingly similar to the
    k-folds cross-validation technique, but with a slight change, that only a single
    observation is left out of the training data set, which is later used as test
    data. This technique is commonly used with data sets that are small in size and
    are more feasible in laboratory experiments than for analyzing big data.


    We will now discuss regularization in machine learning. Regularization involves
    analyzing the number of variables that are used to construct the model and inducing
    a penalty for each extra variable that is used. There are two types of regularization
    techniques in machine learning: L1 regularization and L2 regularization. These
    regulate the structure of the machine learning model. In L1 regularization, the
    model we get is one with as few predictors as possible. The reason for such a
    model is that it improves robustness. After all, when we have simple solutions,
    they are applicable to a larger number of situations as compared to complex solutions.
    In L2 regularization, the main point of concern is coefficient and predictors,
    and the regulators keep the level of variance between these two elements to a
    minimum. This is because if the variance between these two overlaps, then we cannot
    clearly understand each of the predictor’s impact. By keeping the level of this
    overlapping variance to a minimum, we are essentially increasing the clarity.
    In other words, the main function of regularization is to keep the model from
    overfitting (due to the use of too many features).


    Validations are very important in the machine learning process because these determine
    whether our model can work with real-life problems or not. In other words, validation
    determines the worth of your model, as a model that cannot solve problems or perform
    tasks it is built to is not worth anything.


    # [Predicting new observations](#toc.xhtml#s109a)


    If we have performed the first three steps of the machine learning process successfully,
    then we will end up with a model that can generalize well to new data. Model scoring
    is defined as using a machine learning model on unseen data.


    Model scoring is done in two steps:


    1.  Preparing a data set with features that are defined by the model.


    2.  Using the model on this prepared data set.


