- raw: '*   **Value function approaches:** This kind of algorithm tries to get the
    maximum returns by maintaining a set of estimated returns for some particular
    policies, either current policy or optimal policy. A policy that achieves maximum
    returns from the initial state may be deemed best for application.


    *   **Direct policy search:** Another possible way of determining the best policy
    involves searching directly from a set of policy space. The two methods used here
    are gradient-based and gradient-free methods. The gradient-based search involves
    mapping from finite-dimensional parameters to specifics where the policy space
    is located.


    # [Applications of reinforcement learning](#toc.xhtml#s120a)


    Among the vast areas of application for reinforcement learning, some are still
    under investigation and yet some are already implemented:


    *   Large-scale empirical evaluation.


    *   Predictive state representation.


    *   Lifelong learning.


    *   Dopamine-based learning in the brain.


    *   Part of the model for human skill learning.


    # [Reinforcement learning algorithms](#toc.xhtml#s121a)


    There are three techniques for the implementation of a reinforcement learning
    algorithm:


    *   **Value-based:** Here, the agent is anticipating a long-term return of the
    prevailing states under the policy, and so you ought to maximize the value function.


    *   **Policy-based:** Under this reinforcement learning scheme, you endeavor to
    find a policy such that the action executed in each state leads to maximal reward
    in the future. The policy-based method is further classified into deterministic,
    where the policy produces the same action for any state, and stochastic, where
    every action has a definite probability determined by the stochastic policy. The
    stochastic policy is *n{a\\s) = P\\A, = a\\S, =S\].*


    *   **Model-based:** In this case, you are expected to generate a virtual model
    for every environment, where the agent learns how to perform in that very environment.


    # [Types of reinforcement learning](#toc.xhtml#s122a)


    Two types of widely used reinforcement learning are as follows:


    *   **Positive:** This is an event triggered by specific behavior. It positively
    influences the action taken by the agent. This happens by enhancing the frequency
    and strength of the behavior. This method helps you capitalize on performance
    and sustain change for a longer period. Even so, you have to be careful as over-reinforcement
    may cause state over-optimization and impinge on the results.


    *   **Negative:** It involves strengthening behavior prompted by a negative condition
    that should have been dodged or stopped. Although it helps define the least-stand
    performance, this method set the minimum behavior, which is a drawback.


    # [Applications of reinforcement learning in real life](#toc.xhtml#s123a)


    *   Data processing and machine learning.


    *   Planning of business strategy.


    *   Robotics for industrial computerization.


    *   Aircraft and robot motion management.


    *   Creation of customized training systems for students.


    # [Conclusion](#toc.xhtml#s124a)


    With the technological advancements in the financial market, learning about the
    system as a whole will always be a constant process. We discussed the concept,
    types, and applications of reinforcement learning. Reinforcement learning is a
    machine learning method with three algorithms: (1) value-based, (2) policy-based,
    and (3) model-based. The two types of reinforcement learning are (1) positive
    and (2) negative. Reinforcement learning should not be used for problem-solving
    when you have less amount of data. A major drawback of reinforcement learning
    is that the learning speed may be affected by algorithms parameters. We discussed
    a business problem wherein machine learning was applied, gave an overview of data
    reduction techniques.


