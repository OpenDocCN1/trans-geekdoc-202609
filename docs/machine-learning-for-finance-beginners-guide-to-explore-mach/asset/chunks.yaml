    # 银行业中的 AI


    在涉及尖端技术进步时，科技巨头往往占据了大部分焦点。但金融部门（包括那些保守的传统银行）对 AI 表现出日益增长的兴趣，并出现了采用迹象。银行或金融行业对几乎所有消费者和企业都有深远影响，对国家经济产生直接影响，因此对于每家企业而言，寻求洞察并紧金融科技与
    AI 的融合趋势至关重要。银行业正投入资金基于 AI 的解决方案，以解决多个传统的银行业问题，例如为数百万客户提供优质客户服务、反欺诈、移动技术和数据安全等。


    ## 以下是银行业中一些流行的基于 AI 的趋势：


    20 世纪 60 年代，为了协调全美旅行社的预订工作，旅游业开创了大规模基于计算机的航空订位系统。现在，大多数旅游公司都在从用户那里收集数据，通过合适的 AI
    工具，他们能够根据过去的搜索记录为客户提供相关的未来旅行计划。使用 AI 定价工具可以根据市场需求、天气和其他决定因素自主调整机票价格，这有助于航空公司优化其业务。


    当潜在的旅行者浏览、购物、预订、飞行甚至更改旅行计划时，公司会收集这些数据，并通过 AI 驱动的解决方案进行分析，以获取可操作的洞察并根据客户需求定制服务。旅游业的竞争非常激烈，精明的旅行者总是在比较并寻找机票、酒店、巴士、火车和租车的价格，以实现物有所值。AI
    在通过个性化服务和高效的旅行体验改变旅行体验方面具有巨大潜力。


    ## 结论


    金融处于技术的前沿，我们已经讨论了原因。我们还讨论了为什么在金融领域应该采用机器学习。我们还详细介绍了机器学习对金融行业的影响。对于任职于金融业的机构来说，跟上竞争对手并在技术方面提升地位已变得越来越至关重要。


    在下一章中，我们将学习机器学习对金融科技（FinTech）的影响。


    # 第 10 章


    # 机器学习对金融科技的影响


    ## 引言


    尽管显而易见，传统保守的金融机构并非机器学习增长的前沿，但“金融科技机器学习”现在已成为热门词汇。它为金融分析、客户服务和数据管理交付了新的运营标准。


    ## 结构


    在本章中，我们将涵盖以下主题：


    * 金融科技公司概述。

    * 技术的影响。

    * 挑战。


    ## 目标


    学习本章后，你应该能够做到以下几：


    * 理解技术对金融科技公司的影响。

    * 理解金融科技公司面临的挑战。


    ## 金融科技公司概述


    金融科技（或 FinTech）由利用技术来确保金融服务交付效率的企业组成。这些公司通常是初创公司，颠覆了现有金融系统，并挑战不依赖技术的既有金融机构。


    ## 技术的影响


    金融处于技术的前沿，我们已经讨论了原因。我们还讨论了为什么在金融领域应该采用机器学习。我们还详细介绍了机器学习对金融行业的影响。对于任职于金融业的机构来说，跟上竞争对手并在技术方面提升地位已变得越来越至关重要。


    在下一章中，我们将学习机器学习对金融科技的影响。


    ## 挑战


    除了传统对手之外，金融科技公司还面临来自金融监管的挑战。数据安全是另一个担忧。黑客攻击以及保护敏感企业财务和消费者数据的必要性是每家金融科技初创公司必须面对的问题。即使是微小的数据泄露也会对金融科技公司的声誉造成灾难性的影响。


    另一个持续的挑战是在线金融领域日益增加的勒索攻击。此外，许多金融科技公司在营销方面面临挑战，因为规模较大的竞争对手在广告上花费更多资金。事实上，即使是成熟的金融机构也因为其在线客户服务面临着安全挑战。


