- raw: 'Unlike conventional clothing size structures, Ashdown and Paal did not come
    up with an organized set of graduated sizes where all sizes expand together. Rather,
    they have come up with sizes that suit various types of bodies. Each type of body
    corresponds to a cluster of records in a body measurement database. One cluster
    may consist of short-legged, small-waisted, big-busted women with long torsos,
    medium bodies, wide shoulders, and thin necks, while other clusters capture other
    measurement constellations. The database comprised over hundred measurements for
    each of almost three thousand women. The technique used for clustering was the
    k-means algorithm, defined in the next section. It took only a few of the more
    than hundred measurements to classify the clusters. A further advantage of the
    clustering method was discovering this reduced number of variables.


    # [Gaussian model](#toc.xhtml#s32a)


    As mentioned, the k-means method has some drawbacks:


    *   It doesn’t do well with cluster overlaps.


    *   The outliers quickly drag the clusters off center.


    *   Each record is either within or outside of a given cluster.


    Models of Gaussian mixture are a probabilistic version of k-means. The name derives
    from Gaussian distribution, distribution of probabilities frequently presumed
    for problems of large dimensions. The Gaussian distribution generalizes to variable
    with the normal distribution. As before, k seeds were selected to start with the
    algorithm. However, this time the seeds are considered the source of Gaussian
    distributions. The algorithm goes by iterating over two steps, called the step
    of estimation and the step of maximization. The estimation stage calculates the
    liability for each data point kept by each Gaussian. Take a look at the following
    image:


    ![](images/2.4.jpg)


    **Figure 2.4**


    Every Gaussian has a strong responsibility for points close to their mean and
    a weak responsibility for distant points. In the next step, the roles will be
    used as weights. A new centroid for each cluster is determined in the maximization
    stage, taking into account the newly calculated responsibilities. The centroid
    for a given Gaussian, as shown in *[Figure 2.5](#c02.xhtml#fig2_5)*, is determined
    by averaging all the points weighted for that Gaussian by the answerability:


    ![](images/2.5.jpg)


    **Figure 2.5**


    These steps are repeated until the Gaussians do not move anymore. The Gaussians
    themselves can both change form and travel. Every Gaussian is constrained, however,
    so if it shows a very high responsibility for points close to its average, it
    means a sharp drop in responsibilities. If the Gaussian encompasses a broader
    spectrum of values, then it has smaller obligations for points nearby. Given that
    the distribution must always be integrated into one, Gaussians are always getting
    weaker as they grow larger. The reason this is called a mixture model is that
    the likelihood is the sum of a mixture of many distributions at each data point.
    Every point at the end of the process is bound to the different clusters with
    higher or lower probability. This is often called soft clustering since a single
    cluster does not classify points uniquely. One indication of this approach is
    that certain points in more than one cluster can have a high probability. Other
    points may only have very low odds of being in any cluster. Each point can be
    assigned to the cluster where it has the highest probability, making this soft
    clustering a hard clustering.


    Automatic cluster detection technique is the undirected data mining tool, which
    can be used to learn about complex database structures. By splitting complex data
    sets into simpler clusters, it is possible to use automated clustering to boost
    the efficiency of more focused techniques.


    Automatic clustering can be applied to almost any form of data by choosing different
    distance measurements. Clusters can be found just as easily in news story collections
    or insurance reports, as in astronomical or financial details. Clustering algorithms
    can rely on some form of similarity metric to determine whether two records are
    near or distant. A geometric representation of distance is sometimes used, but
    there are other possibilities, some of which are more acceptable when non-numeric
    data in the records is to be clustered. One of the most common automatic cluster
    detection algorithms is the k-means.


    The k-means algorithm is an iterative approach to remote-based identification
    of k clusters. Gaussian mixture models are a variation on the concept of k-means
    that allows clusters to overlap. Divisive clustering creates a tree of clusters
    by splitting an initial large cluster in succession. The agglomerative clustering
    begins with several small clusters, and combines them progressively until there
    is just one cluster remaining. Divisive and agglomerative approaches allow the
    data miner to use external parameters to assess which cluster tree level is most
    useful for a specific application.


    # [Application of machine learning in cybersecurity](#toc.xhtml#s33a)


    Machine learning techniques can be applied to a variety of cybersecurity problems:


    *   Spam mail and phishing page detection.


    *   Malware detection and identification.


    *   DoS and DDoS attack detection.


    *   Anomaly detection.


    *   Biometric recognition.


    *   User identification and authentication.


    *   Detection of identity theft.


    *   Social media analytics.


    *   Detection of information leakage.


    *   Detection of advanced persistent threats.


    *   Detection of hidden channels.


    *   Detection of software vulnerabilities.


    In the following sections, we will briefly discuss some of these cybersecurity
    problems and solution approaches with machine learning techniques.


    # [Spam detection](#toc.xhtml#s34a)


    Spam is the electronic equivalent of the junk mail that arrives in our mailbox.
    Spam may be defined as an unsolicited commercial email or any unsolicited bulk
    email. Spam mails are not only just annoying but can be dangerous. The content
    of spam can be an advertisement of goods and services, pornographic material,
    financial advertisements, information on illegal copies of software, fraudulent
    advertisements, fraudulent messages to solicit money, links to malware, phishing
    websites, etc. Spam may also be used for launching denial-of-service (DoS) attacks.


    Spam filtering can be performed on the basis of the textual content of email messages.
    This can be seen as a special case of text categorization, with the categories
    being spam and non-spam. Text classification techniques such as TF-IDF, Naive
    Bayes, SVM, n-gram, boosting, etc., can be applied for spam filtering. Some of
    the limitations of these techniques are the requirement of a large amount of training
    data, processing power, etc.


    Other machine learning techniques involve converting emails into feature vectors,
    where features include token of the email, size, presence of attachment, IP, and
    the number of recipients. We can use machine learning techniques such as CVM,
    decision trees, neural networks, and so on.


    # [Phishing page detection](#toc.xhtml#s35a)


    With phishing, people are psychologically influenced and the contents of the malicious
    website are made believable, thereby making users enter personal details such
    as username, password, bank account number, credit card details, and so on. Generally,
    this is achieved by spoofing the websites of reputed organizations, so that the
    user never doubts an illegitimate activity prior to entering their personal information.
    These days, phishing sites are not only used for sniffing user credentials, but
    also for spreading malware such as cookie stealers, keyloggers, etc. Such malware
    can steal cookies from the system or capture user keystrokes.


    The different kinds of features used in existing machine-learning-based detection
    algorithms can be grouped as follows:


    *   URL-based features.


    *   Domain-based features.


    *   Page-based features.


    *   Content-based features.'
