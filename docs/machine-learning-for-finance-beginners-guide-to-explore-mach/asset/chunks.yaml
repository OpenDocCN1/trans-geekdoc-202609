- raw: 'In this chapter, we will cover the following topics:


    *   Fraud detection.


    *   Cost cutting.


    *   Customer service.


    *   Risk management.


    *   Internet banking.


    # [Objective](#toc.xhtml#s248a)


    After studying this chapter, you should be able to do the following:


    *   Understand the applications of artificial intelligence in banking.


    # [Fraud detection](#toc.xhtml#s249a)


    For many financial institutions, especially banks, security is always one of the
    top concerns that they must address if they have to win the loyalty and confidence
    of their customers. There has been a constant fear of hacks and frauds, which
    can lead a financial institution to devastation. With the help of artificial intelligence,
    bank management can cut down the rates of false identity incidents, fraud attempts,
    and other stealing attempts. Artificial intelligence can reduce fraud attempts
    by making accurate interpretations of insights into different trends. It is a
    blend of supervised and unsupervised machine learning, and this combination can
    determine if a transaction has fraudulent tendencies or not.


    As more financial institutions move toward digital advancements, payment fraud
    is rising at a sharp pace. These kinds of attacks have a digital footprint, which
    makes them invisible. With artificial intelligence, banks can install a security
    layer to protect itself against any fraudulent attempt. Artificial intelligence
    keeps an eye on any kind of trend swerving and detects a fraud swiftly even if
    it is being conducted at a massive scale. This gives banks an advantage in battling
    out fraud attempts and securing the reserves. Generally, banks use predictive
    analytics.


    # [Cost cutting](#toc.xhtml#s250a)


    Reduction in operational costs is another advantage of artificial intelligence
    in the banking sector. Here a large amount of time is spent on identifying, digitizing,
    and onboarding document templates. With the help of the digitization process,
    banks can reduce the amount of time spent on completing these tedious tasks. If
    as a banker you automate the process of digitization in the branches, you can
    slash the time that your employees would have spent on the same process. This
    way you can reduce the cycle time and redirect employees to other important projects.


    # [Customer service](#toc.xhtml#s251a)


    The customer service sector is another sector that can be improved with the help
    of artificial intelligence tools. Customer experience affects almost every business
    around the world, including the banking sector. It leaves an impact on the way
    people would normally perceive a particular organization. Where banks are concerned,
    people want access to their money even if the bank is closed for holidays. They
    prefer banks that offer them swift transactions. Take the example of a person
    who has to withdraw $1000 because he is on vacation with his family and he has
    run out of hard cash. He goes to the ATM and gets his card captured for some unknown
    reason. It is midnight and there is no employee available at the bank. This is
    where artificial-intelligence-powered chatbots play an important role in guiding
    the customer and solving his problem. Chatbots don’t sleep and they are not bound
    by any time zone, so they can help customers irrespective of time and place.


    Nowadays almost every online business has a chatbot, so you may wonder whether
    the one you are interacting with is a simple chatbot or an artificial-intelligence-powered
    chatbot. There is a big difference between the two types of chatbots. A simple
    chatbot that most businesses have deployed on their websites is static. It doesn’t
    learn through its own experience until you feed it with data from the backend.
    However, an artificial-intelligence-powered chatbot can learn through customer
    interactions, which helps improve them and, in turn, improves customer experience.
    A brilliant example of chatbots is Erica, the virtual financial assistant at the
    Bank of America. You can request her to send you push notifications of your credit
    scores and also help you in paying bills or conducting financial transactions
    online.


    # [Risk management](#toc.xhtml#s252a)


    Credit cards pose a problem when it comes to securing financial transactions.
    There is always a fear of a fraudulent or malafide transaction. The best way to
    mitigate this risk is by conducting a thorough analysis of the potential customer
    so that the right person is authenticated. Artificial intelligence can help you
    do real-time identification of the client and thus help the banking sector save
    millions of dollars that are otherwise wasted on fraudulent practices. You can
    also deploy several technologies like facial recognition scans, iris scans, and
    voice recognition.


    # [Internet banking](#toc.xhtml#s253a)


    This is another sector in which artificial intelligence can help you. Artificial
    intelligence has revolutionized the concept of customer experience and banking.
    One of the most important features of mobile banking is its all-time presence
    across the world.


    The impact of artificial intelligence on the banking sector runs deep, and it
    is yet to be explored fully. The banking sector is witnessing many innovations,
    thanks to machine learning and artificial intelligence. In the coming years, these
    are likely to make further progress.


    # [Conclusion](#toc.xhtml#s254a)


    In this chapter, we discussed the applications of artificial intelligence in the
    banking sector. The next chapter explains some traditional machine learning algorithms.


    # [CHAPTER 18](#toc.xhtml#c18)


    # [Common Machine Learning Algorithms](#toc.xhtml#c18)


    # [Introduction](#toc.xhtml#s255a)


    Machine learning is a process that teaches computers to learn on their own. Now,
    maybe you’re wondering, why on earth would we expect robots to learn on their
    own? Yeah, it’s got a lot of perks. Applications of machine learning are numerous,
    and they are powered by solid fundamentals—lots of data emitted by sensors across
    the world, with low-cost storage and lowest ever computing costs!


    # [Structure](#toc.xhtml#s256a)


    In this chapter, we will cover the following topics:


    *   Regression.


    *   k-means clustering.


    *   k-nearest neighbor (KNN).


    *   Principal component analysis (PCA) algorithm.


    *   Polynomial fitting and least-squares algorithm.


    *   Forced linear regression algorithm.


    *   Support vector machine (SVM) algorithm.


    *   Conditional random fields (CRFs) algorithm.


    *   Decision tree algorithm.


    # [Objective](#toc.xhtml#s257a)


    After studying this chapter, you should be able to do the following:


    *   Understand the concepts of traditional supervised and unsupervised machine
    learning algorithms.


    # [Regression](#toc.xhtml#s258a)


    Regression techniques fall under the supervised machine learning category. They
    help predict or describe a given numerical value based on the set of previous
    information, such as anticipating the cost of a property based on previous cost
    information for similar characteristics. Regression techniques range from simple
    (such as linear regression) to complex (such as regular linear regression, polynomial
    regression, decision trees, random forest regression, and neural networks, among
    others).'
