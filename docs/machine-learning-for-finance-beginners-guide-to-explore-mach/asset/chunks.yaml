- raw: 'Light GBM utilizes tree-based learning algorithms. It is highly efficient
    and exhibits faster training speed than other models. It also uses an impressively
    low amount of memory while delivering better accuracy. It is supported by GPU
    and parallel learning, and can easily handle huge amounts of data.


    Light GBM was developed using Microsoft’s Distributed Machine Learning Toolkit
    Project. It’s perfect for classification and ranking tasks, among others.


    # [XGBoost](#toc.xhtml#s93a)


    XGBoost is yet another gradient boosting algorithm that dictates a win or a loss
    in Kaggle competitions. It has amazing predictive powers, giving it the advantage
    in terms of accuracy. This is because it includes both the tree learning algorithm
    and a linear model. This makes it ten times faster than any other gradient boosting
    technique.


    How is XGBoost applied? It can actually be used across a number of applications
    including classification, ranking, and regression.


    This algorithm is also known as a regularized boosting technique. It’s perfect
    for reducing overfit modeling. It also works great for different languages like
    C++, Java, Julia, Python, R, and Scala.


    # [CatBoost](#toc.xhtml#s94a)


    CatBoost is fairly new in the game and was developed by Yandex. It is an open-sourced
    algorithm and can be easily integrated into different deep learning frameworks
    like Core ML from Apple and Tensor Flow from Google.


    Where other machine learning models require extensive data training, it’s a different
    story for CatBoost. It is still pretty robust, though, and can be used across
    many different data formats.


    One huge advantage of CatBoost is that it can help you focus on fine-tuning your
    entire model instead of wasting time trying to fix small errors. This is because
    CatBoost automatically runs through the variable while discounting type conversion
    errors.


    # [Gradient descent](#toc.xhtml#s95a)


    Gradient descent occurs when there are one or more inputs; it is possible to optimize
    the values of the coefficients by reducing the error of the model on the training
    data iteratively. This is done by starting with random values for every coefficient.
    For every pair of input and output values, the sum of the squared errors is calculated.
    By reducing the error, a learning rate is used as a scale factor, and the coefficients
    are updated. The process is performed repeatedly until a minimum sum squared error
    is obtained, or no further improvement is possible.


    When performing gradient descent, it is essential to choose a learning rate (alpha)
    parameter that ascertains the size of the improvement step to be applied to every
    iteration of the procedure. Gradient descent is often implemented using a linear
    regression model, and it is relatively straightforward to understand. In practice,
    it is used when a large-scale data set contains a massive number of rows or columns
    that may not fit into memory.


    # [Conclusion](#toc.xhtml#s96a)


    User experience will be widely improved with the development and implementation
    of advanced neural networks. In this chapter, we discussed how they work, their
    different types, and their benefits. We also had a walkthrough of different types
    of gradient boosting algorithms, and discussed the advantages of gradient descent
    in neural networks.


    In the next chapter, we will try to understand sequence modeling.


    # [CHAPTER 7](#toc.xhtml#c07)


    # [Sequence Modeling](#toc.xhtml#c07)


    # [Introduction](#toc.xhtml#s97a)


    The ability to predict what will come following in a series is interesting. Interestingly,
    human brains are very good at it, but that’s not the case for computers. In the
    face of a shadowy plot in a movie, the human brain begins to yield effects. But
    how do you train robots to do something similar?


    Thanks to deep learning, we can do a lot more now than we might have done a few
    years before. The ability to work with sequence details, such as song lyrics,
    sentence translation, DNA sequence analysis, speech recognition—all this is now
    possible owing to sequence modeling.


    # [Structure](#toc.xhtml#s98a)


    In this chapter, we will cover the following topics:


    *   Word embedding.


    *   Feed-forwarding neural network algorithm.


    *   Convolutional neural network algorithm.


    *   Recurrent neural network (RNN) algorithm.


    *   Conditional random field (CRF) algorithm.


    *   Modeling procedure.


    # [Objective](#toc.xhtml#s99a)


    *   Understand the different types of sequence modeling techniques.


    *   Understand the modeling procedure.


    # [Word embedding](#toc.xhtml#s100a)


    Word embedding help one generalize well when dealing with word representations.
    Suppose you are performing a named entity recognition task and only have rare
    observations in the training set. In such a scenario, you can either take pre-trained
    word embeddings or build your own embeddings. These embeddings may provide functionality
    for all the words in the vocabulary. They have numerous NLP applications such
    as named entity recognition, machine translation, and sentiment analysis.


    # [Feed-forward neural network algorithm](#toc.xhtml#s101a)


    Essentially, these are the classifiers for multi-level logistic regression. Nonlinearities
    (tanh, sigmoid, SoftMax + ReLU, and SELU) activation function work in different
    level of numerical scales. These are often referred to as multilayer perceptrons.
    FFNNs may be used as autoencoders for the description of “learning without an
    instructor.” FFNNs can be used as autoencoders to train a classifier or to retrieve
    functions.


    # [Convolutional neural network algorithm](#toc.xhtml#s102a)


    With the advent of CNNs, practically all advanced successes in the field of machine
    learning have been realized. They are used for the recognition of pictures, identification
    of artifacts, and also segmentation of images. Invented in the early 1990s by
    Jan Lekun, CNNs possess convolutional layers that act as extractors of hierarchical
    objects. You may use them for text work (and also for graphics work).


    # [Recurrent neural networks (RNN) algorithm](#toc.xhtml#s103a)


    RNNs create sequences by repetitively adding the same range of weights to the
    aggregator state at time t and data at time t. Only RNNs are seldom used today.
    However, in most series modeling issues, its analogs such as GRU and LSTM are
    among the most up-to-date. LSTM is used in pure RNNs instead of just a thin base.
    RNNs are used for text classification, time series forecasting, computer translation,
    and computational linguistics.


    # [Conditional random field (CRF) algorithm](#toc.xhtml#s104a)


    These algorithms are intended to represent an RNN-like series and can be used
    in combination with an RNN. These could also be used, for instance, in image segmentation
    and other organized prediction activities. CRF models each part in the series
    (say, a sentence), such that the neighbors influence the item mark in the series
    and not the individual labels. CRFs are used for sequences (image, text, time-series
    data, and DNA).


    CRFs are a type of discriminative classifier, and they model the decision boundary
    between diverse groups. Owing to their ability to classify sequential data, CRFs
    are mostly applied in NLP. One of the applications is parts-of-speech (POS) tagging.


    Section of sentence speech are based on previous words, and they take benefit
    of this through features, we can use CRFs to learn how to differentiate which
    sentence terms refer to which POS. An alternative related application is named
    entity recognition (NER) or extracting nouns from sentences. CRFs can be used
    to forecast any sequence in which numerous variables rely on each other. Some
    applications include visual and gene estimates.


    # [Modeling procedure](#toc.xhtml#s105a)


    The process of modeling comprises four steps:


    1.  Feature engineering and selecting a model.


    2.  Training the model.


    3.  Validating the model.


    4.  Testing the model on new data.'
