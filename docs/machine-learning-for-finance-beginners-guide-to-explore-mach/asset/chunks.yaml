  trans: '


    `LASSO` 和 `cam regression` 方法的混合体被称为“弹性网络回归”（elastic net regression）。其主要目标是进一步提高
    `LASSO 回归` 技术生成的预测准确性。弹性网络回归会奖励较小的系数值。这三种设计在 `R` 和 `Python` 的 `glmnet` 软件套中均可用。


    如果数据不足或可用数据分布不均，贝叶斯回归模型非常有用。这些回归模型是基于概率分布而非数据点开发的，这意味着生成的图将呈现为气泡曲线，其中常见值位于曲线中心，代表方差。贝叶斯回归中的因变量
    `Y` 不是数值，而是一个概率。我们不是在预测一个具体的数值，而是尝试估计某个事件发生的概率。这被视为频率派统计，基于 `贝叶斯定理`。频率派统计假设某个事件是否会发生以及未来再次发生的概率。


    条件概率是频率派统计中不可或缺的一部分。它指的是结果之间相互依赖的事件。事件也可以是条件性的，这意味着上一个事件可以改变下一个事件的概率。假设你有一盒 `M&M’s`
    巧克力，你想知道从袋里取出不同颜色的 `M&M’s` 的概率。如果你有一组三个黄色和三个蓝色的 `M&M’s`，你第一次抽到了蓝色的，那么下次抽到蓝色 `M&M`
    的概率将低于第一次。这是条件概率的经典例子。相反，独立事件是抛硬币，这意味着上一次抛币的结果不会改变下一次抛币的概率。


    # 线性回归


    当你需要根据连续数据得一组实际数值时，就会应用线性回归。基本上，它涉及到绘制一条直线，其中考虑因变量和自变量之间的相关性。


    在线性回归中，使用方程 `Y = a*X + b`，其中 `Y` 是因变量，`a` 是斜率，`X` 是自变量，`b` 是截距。


    为了让这个概念更容易理解，这里有一个例子。被要求在不知道这些人实际体重的情况下对他们按体重排序。然而，你知道他们的身高，也能肉眼看到每个人的体型。利用这些参数，你可以想出一种可能产生准确或接近准确结果排序方法。


    线性回归有两种类型：简单和多元。简单线性回归只涉及一个自变量，而多元线性回归涉及两个或多个自变量。


    # 逻辑回归


    尽管存在回归算法，但这与此完全没有关系。逻辑回归实际上是以自变量为基础来处理二值值（是或否、真或假、0 或 1）。它使用 `logit` 函数来衡量某个事件的概率。因为它涉及概率，所以预计输出应该在
    0 到 1 之间的任何地方。


    如果你的朋友给你一个谜题，你只能预想两种输出：要么你解决了它，要么你没解决。现在，如果给你若干个不同的谜题来查看你擅长哪些领域；这就是逻辑回归可以应用的地方。


    假设给你的谜题之一是通常留给学龄儿童的谜语。那么你可能有 80% 的概率解开。如果给给你一个只有专家才能解决的晦涩谜题呢？那么逻辑回归可能会告诉你，你解决它的概率只有
    20%。基本上，得出这些数字涉及选择参数，其目的是观察被用作样本的值，而不是查看平方误差和。


    逻辑回归还帮助回答我们在数据科学中常用的常用示例问题：患者每多重一磅，以及每天多抽一包烟，患肺疾病（是与否）的概率如何变化？热量摄入、脂肪摄入、体重和年龄对中风（是与否）的概率有影响吗？正如我们所看到的，这些问题具有程度的复杂性，逻辑回归可以提供解决方案。在业务中，它是组织解决有关趋势和业务模式复杂问题的有力工具。


    通过分析下面的图来探索逻辑回归应用的另一个示例。我们看到所有数据点的值要么为 0（失败），要么 1（通过）。我们还可以观察到逻辑拟合是 S 型曲线，它将概率模型为学习时间的函数。通过分析该图，我们可以得出，大多数学习少于四小时的学生没有通过考试。然而，对于学习了四小时的学生，模型预测通过的概率将在
    70% 左右。正如我们在图中看到的，S 曲线是逻辑回归估计不同事件概率的副作用。这是逻辑回归为我们提供的相关信息的示例：


    ![](img/18.2.jpg)


    **图 18.2** 逻辑回归：与学习小时的关系（来源：Cerebro MLA）


    理解逻辑回归的一个关键点与概率有关。必须理解它们位于 0 到 1 之间，与线性回归相反，我们得到的值并不提供直接的预测。相反，通过观察 `X = 4`，模型告诉我们可以期待
    70% 的通过率。


    与逻辑回归相比，线性回归处理数据效果良好，通过感知预测变量的值可以很好地预测结果。一些数据科学家对线性回归和逻辑回归的概念及其应用感到困惑。理解这些差异对于为客户和组织提供支持至关重要。


    # k-means 聚类


    最广泛使用的聚类算法之一是 k-means 算法。名称中的 `k` 指算法根据数据点之间的接近性寻找固定数量的类。这里列出的版本由 `J. B. MacQueen`
    于 1967 年发表。该技术使用二维图进行演示以便说明。注意该算法在操作中通常管理远于两个独立变量。


    # k-means 算法的三步


    k-means 算法的第一步随机选择 k 个数据点作为种子（包含一个元素的簇）。MacQueen 的算法简单地取前 `k` 个记录。在记录具有显著顺序的情况下，选择间隔较大的记录或随机收集的记录可能更好。此示例将类数设置为
    3。最后一步是将每个记录分配给最近的种子。做到这一点的方法是找到类与类之间的边界，如几何所示。两个类之间的边界是到每个类距离相等点。


    ![](img/18.3.jpg)


    **图 18.3**


