  trans: '


    此外，对于贝叶斯分类器，我们需要能够对分类后每个组中预期包含多少项目提供一个大致的概括。在天气案例中，我们可能已经知道平均每天 10% 的时间是雨天，90%
    的是晴天（假设我们住在亚利桑那州）。这些被称为**先验概率**。这种方法通常用于构建垃圾邮件过滤器等工具——如果电子邮件中出现了“Viagra”这个词，那么它很有可能是垃圾邮件。通常，系统管理员会知道入站邮件有多大比例可能是垃圾邮件（先验概率）。我们对先验概率提供的估计越准确，分类器（通常而言）的表现就越好。


    在下例示例中，我们观察了四封邮件，并将它们分类为垃圾邮件或非垃圾邮件（正常）。此外，我们确定了每封邮件中是否出现了“Viagra”一词，并根据这些数据构建了训练集。


    贝叶斯定理是该方法的基石，可以帮助我们计算如果邮件包含“Viagra”一词，那么它是垃圾邮件的概率。


    因此，`P = (1 × 0.25/0.50) = 0.50 或 50%`。


    正如之前计算的，如果邮件包含“Viagra”一词，它是垃圾邮件的概率为 50%。虽然这个结果并不有趣，因为很容易手动计算，但你可以尝试通过在示例开端的数据框中添加更多项，对更大的数据集进行测试。


    # 朴素贝叶斯算法的优点、缺点和参数


    以下列表解释了详细信息：


    - `MultinomialNB` 和 `GaussianNB` 都使用 `alpha` 参数来控制模型的复杂度。在这种情况下，算法会将所有特征的许多正值数据点加到
    `alpha` 值上。这最终会对统计数据产生一种平滑效果，且较大的 `alpha` 值会产生更强的平滑效果，从而降低模型的复杂度。

    - `GaussianNB` 最适用于高维数据集，而另外两种类型专门用于小规模数据集。

    - 实际上，朴素贝叶斯分类器的优点大多与线性回归模型相似。它们具有快速的训练和预测模式，且复杂度较低，因此非常容易理解。事实上，朴素贝叶斯分类器为非常大的数据集形成了一个重要的基准模型，而这些数据集可能不适用于大多数线性模型。

    - 它是测试数据集进行分类预测的一种快速、简单的方法。它也可以应用于多分类问题的预测。

    - 当独立性假设成立时，朴素贝叶斯分类器与其他模型相比工作得非常好。所需的训练数据要少得多。

    - 当输入变量是类别而非数值型时，它的表现更好。在数值变量的情况下，我们需要假设存在正态分布。

    - 对于数据集中未观察到某个类别的类别变量，模型会分配零概率，导致无法生成预测。这被称为**零频率**。可以使用平滑技术来解决这个问题。可以采用拉普拉斯估计来解决它。

    - 朴素贝叶斯分类器被认为是一种糟糕的估计器，即它的输出不被认为是可靠的。

    - 朴素贝叶斯分类器还假设预测变量是相互独立的。在现实生活中，我们几乎不可能获得独立的预测变量。


    # 朴素贝叶斯算法的应用


    当用于文本分类时，朴素贝叶斯算法与其他类型的模型相比具有高准确率。它还被用于垃圾邮件过滤以识别垃圾邮件以及情感分析（例如，在社交媒体上判断正面和负面的客户评论）。


    # 推荐系统


    贝叶斯分类器结合协同过滤可以用于构建推荐系统，该系统利用数据挖掘和机器学习技术来过滤任何未见的数据。它还可以预测用户会喜欢还是拒绝某项资源。


    # 正态分布


    正态分布也被称为高斯分布。这种分布基于来自不同问题领域的真实实值事件的概率。具有正态分布的连续随机变量被称为正态的或服正态分布的（例如，人的身高、考试分数和学生的成绩）。


    正态分布通过两个主要参数定义：均值（`mu`）和方差（`sigma²`）。标准差是离均值的平均偏差，也用 `sigma` 表示。正态分布的可视化表示可见下图：


    ![](img/2.1.jpg)


    **图 2.1**


    在图中，我们可以从从独特的钟形曲线中识别出高斯分布或正态分布。这可以用数学公式的形式表示，如下所示：


    ![](img/eq.jpg)


    正态分布是目前最广泛使用的概率分布。它被应用于营销、心理学、金融和经济学等多个领域。由于其优良的对称性，正态分布提供了变量在分布均值下方给定距离的概率等于其在均值上方相同距离的概率。鉴于其在实现和解释上的广泛性，正态分布在金融行业被广泛使用。


    某些机器学习算法基于距离和梯度下降度量，如 k-means 和 k-最近邻 (KNN)。这些算法对提供的数值尺度非常敏感，为了让算法提供精确解，对分布进行重缩放是必要的。重缩放通常会改变值的范围并可能影响方差。为了执行重缩放，我们还可以使用统计标准化（z-score
    归一化）和最小最大变换（标准化）技术。


    Python 和 R 编程语言提供了分布转换的内置函数。标准化也可以通过 R 语言中的 `scale` 函数实现`try help scale`）。在 Python
    中执行相同的操作，可以考虑 `scikit-learn` 模块的预处理方法。


    在机器学习中，独立变量被称为特征。这些是所分析过程的输入，而因变量是过程的输出。


    # 数据挖掘中的自动聚类检测


    为了在数据中发现有意义的模式，使用了书中描述的数据挖掘技术。但有时找不到模式或模型。其他时候，问题不是模式太少，而是模式太多。数据可能包含如此复杂的结构，以至于最好的数据挖掘技术也无法提取有意义的模式。当挖掘此类数据库以回答特定问题时，竞争性的解释往往相互抵消。


