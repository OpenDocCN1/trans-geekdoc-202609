  trans: '

    DoS 攻击的检测主要通过以下两种入侵检测方式之一进行：


    - 基于特征的入侵检测。

    - 基于异常的入侵检测。


    基于特征的入侵检测通过将网络与数据库中存储的已知网络攻击模式进行比较来工作。虽然这种方法的误报率较低，但它可能无法检测零日攻击。基于异常的入侵检测利用网络流量的统计数据（如数据包头信息、数据包大小和包速率）来检测网络中的各种入侵。虽然基于异常的检测机制不需要异常数据库进行比较（从而减少了内存需求和维护工作），但它检测与正常流量相似的恶意流量（例如低速率
    DDoS 攻击）存在困难，且无法保证检测未知攻击。


    机器学习模型使用的一些特征包括熵、从源到地传输的数据字节数、到主机的连接数、源 IP 和目的 IP 地址、字节率、包速率、TCP 标志比例、SYN 数据包统计和流统计、SYN
    标志是否存在、分类字段和协议字段、TCP SYN 出现次数、目的端口熵、源端口熵、UDP 协议出现情况以及分数据包量等。机器学习技术如 `SVM`、`KNN`、`Naive
    Bayes` 和 `k-means` 已用于 DoS/DDoS 检测。


    ## 异常检测


    异常并不总是对应于网络攻击，也可能是新行为。正如译文所示，可以检测并对异常、异常或意外行为进行分类。


    在 `k-means` 聚类中，根据待聚类对象的特征向量将对象分组为 `k` 个不相交的簇。网络数据挖掘 (NDM) 方法结合 `k-means` 聚类算法可用于从训练数据集中分离出具有正常异常流量的时间段。


    在 `k-medoids` 中，每个簇由类内最合适的中心对象（中点，medoid）表示，而不是可能不属于该类的质心。`k-medoids` 可用于检测包含未知入侵的网络异常，并且被发现其准确性高于
    `k-means` 算法。


    簇的新平均是基于权重度量计算的。发现基于 `EM` 的异常检测机制优于基于 `k-mean` 和 `k-medoids` 的方法。


    无监督学习和监督学习算法可以结合形成用于异常检测的混合方法。通过这种方式，可以提高异常检测的效率和准确性。`k-means` 和 `ID3` 决策树的组合用于计算机地址解析协议
    (`ARP`) 流量中异常和正常活动的分类。


    一些用于入侵检测的机器学习方法还使用了人工神经网络和支持向量机。通过结合网络特征熵和 `SVM` 的混合方法可以克服单一方法的缺点，实现高准确率的异常检测。


    因此，存在不同的基于机器学习的异常检测方法。模型基于系统的正常和异常行为构建的。可以根据异常的类型采用不同的方法。当系统模型可用时，将使用观测流量对其进行测试。如果发现偏差大于或少于预定义的阈值，则该流量被识别为异常。


    ## 结论


    在本章中，我们讨论了 `Naive Bayes`、正态分布以及使用 `Gaussian process` 进行自动聚类检测的技术算法方面。我们还讨论了可以应用于各种网络安全领域问题（如垃圾邮件检测、钓鱼网站检测、恶意软件检测和异常检测）的机器学习技术。


    在下一章中，我们将讨论如何构建数据结构。


    # 第三章


    ## 数据结构化的机器学习


    ### 引言


    文本挖掘是机器学习领域最复杂的领域之一。这是因为文本挖掘涉及非结构化数据。它没有定义良好的观测值和变量。因此，为了进行某些分析，你必须首先将此非结构化数据集转换为结构化数据集，然后继续使用通常建模框架。结构化数据和非结构化数据的区别是什么？大数据和数据科学的未来是什么？你将在本章中找到这些问题的答案，让我们开始吧。


    ### 结构


    在本章中，我们将涵盖以下主题：


    - 数据结构化

    - 大数据的未来

    - 结构化数据和非结构化数据


    ### 目标


    学习本章后，你应该能够完成以下操作：


    - 理解结构化数据和非结构化数据之间的区别。

    - 理解大数据的未来。


    ### 数据结构化


    数据有很多形式，但在最高层面，数据主要分为三类：


    - **结构化：** 这种数据非常有组织。它存在于数据库、`CSV` 文件（用逗号分隔的值）或其他仓库中。数据格式确保了它可以用于 `SQL` 或其他结构化语言进行计算和查询。


    - **半结构化：** 这种数据在与关系型数据库等数据表关联时并不遵循数据模型的结构化方式，但具有标记和标签，可以将语义元素分开，并强制数据字段和记录的层次结构。


    - **非结构化：** 这种数据没有真实的结构，例如自然语言文本或音频流。


    显然，最有用的是结构化数据，因为它可以被立即处理。按照规律，数据约 20% 由结构化数据表示，而剩下的 80% 是非结构化和半结构化数据的组合。


    但要注意，我们所谓的非结构化数据大部分具有某种结构。例如，互联网上发表的文章。虽然它被归类为非结构化，但通过标签和元数据具有某种结构。它被归类为非结构化是因为内容本身没有可以直接使用的结构。


    ### 大数据的未来


    我们正处于数据科学世界地震式变化的中间。这种意识开始在市场上体现，新的分析工具更多地关注从数据中获取见解，而不是运行报告和仪表板。这正是解决此类问题或任何问题的正确方法——关注目标。不要关注“如何”，盯着奖。


    然而，目前这些工具主要是旧式的商业智能工具，正尽可能地进行改造以应对这股浪潮。它们是否会真正成功，还是需要出现新一代工具，仍然是一个未解决的问题。


    鉴于此，以下是值得关注的五个发展方向：


    - **数据将告诉你什么是有趣：** 目前的商业智能恰恰相反，你告诉工具你对什么感兴趣。未来一代将告诉你什么是有趣。在未来几年中，生成这类见解将变得越来越容易，个性化将在其中起很大作用。回想当你第一次尝试
    `Pandora` 时它对音乐有多么革命性——它真的在学习你感兴趣的内容！这就是分析的发展方向。


