    \ or you may have a customer service number that uses artificial intelligence\
    \ to direct users where they want to go. As most businesses are using artificial\
    \ intelligence of some kind in their endeavors, it is certainly in your best interest\
    \ to put some thought into it.\n\n10.  **What is machine learning?**"
  fmt: '

    ### 3. Would artificially intelligent agents really be just intelligent humans?


    **Ans.** Early concepts of artificially intelligent agents usually visualized
    these agents as automatons or robots that resembled humans and essentially completed
    tasks that human beings would complete, whether in a rote and simplistic fashion
    or in a complex, intelligent way. Even the ancient Greeks imagined automatons
    as being able to engage in locomotion, attack other people, and essentially do
    the things that humans do. The only difference was that they were not actual humans.
    They were artificial.


    Artificial intelligence today recognizes that the forms that artificial intelligence
    displays can take vary greatly. Most artificial intelligence agents today are
    computer programs that record data or stimuli from the environment and interpret
    it. For example, many businesses have artificial intelligence software that records
    purchases, product views, or other behavior and makes predictions and suggestions
    on the basis of that data. In this way, artificially intelligent agents may display
    some aspects of human behavior while still being (at least, at present) stand-ins
    for humans: completing essentially human tasks rapidly and reliably. In short,
    the agents of today are clearly programs that are distinct from human beings.


    ### 4. Are there different types of artificial intelligence?


    **Ans.** There are different types of artificial intelligence. This includes subsets
    or extrapolations of artificial intelligence like machine learning or deep learning.
    But the term usually refers to approaches to artificial intelligence in terms
    of how the agents operate. The main classification system divides artificial intelligence
    into (1) analytical artificial intelligence, (2) human-like artificial intelligence,
    and (3) humanized artificial intelligence.


    Understanding different types of intelligence is key to knowing the difference
    between these three types of artificial intelligence. Analytical artificial intelligence
    is thought of purely in terms of cognition. Cognition represents the range of
    skills like processing information, language production, and learning that are
    thought of as representing higher order thinking. This is the type of thinking
    that human beings and some higher animals are capable of.


    Human-like artificial intelligence adds emotional intelligence to cognitive intelligence
    in its range of abilities.


    Humanized intelligence is perhaps the most human of the three types of artificial
    intelligence. Humanized artificial intelligence includes cognitive intelligence,
    emotional intelligence, and social intelligence. Emotional and social intelligence
    represent more nuanced forms of intelligence. These are the types of bits of intelligence
    that robots, for example, would need to exhibit in order to not be detected immediately
    as being robots.


    ### 5. Why is artificial intelligence receiving so much attention lately?


    **Ans.** Artificial intelligence is receiving so much attention lately because,
    as artificial intelligence breaks new barriers in what it is able to accomplish,
    many have begun to theorize that artificial intelligence represents a so-called
    existential threat.


    The fear is that artificial intelligence may attempt to destroy the human race.
    As most businesses are using artificial intelligence of some kind in their endeavors,
    it is certainly in your best interest to put some thought into it.


    ### 6. What is the connection between artificial intelligence and robotics?


    **Ans.** Although many people often think of artificial intelligence as a quality
    associated with robots, most agents at present are computer programs that complete
    specified tasks. Some of these programs merely receive data from their environment
    and learn from it, which is referred to as machine learning.


    ### 7. What are neural networks?


    **Ans.** Artificial neural networks are designed to resemble, at least in part,
    the human nervous system which contains millions of connections in the forms of
    neurons, synapses, and innervated tissue. These networks allow to perceive their
    environment, operate in their environment, interact with other objects, form language,
    and learn.


    Scientists studied human neural networks in order to create these agents. Although
    the full capabilities of this technology have yet to be realized, it is likely
    that, should artificial intelligence achieve singularity, neural networks would
    be a key (if not the critical) component of their operation.


    ### 8. What role can artificial intelligence play in business and finance?


    **Ans.** Artificial intelligence already plays a big role in business and finance,
    even if the average person in the US or other Western countries does not realize
    it. Companies use artificial intelligence on their business websites or other
    customer interfaces to improve their functioning.


    Artificial intelligence programs can make purchasing suggestions to consumers,
    interpret consumer phone calls to direct them to the proper individual to handle
    their issue, or make suggestions on music and video websites or social media on
    the basis of previous activity. In other words, artificially intelligent agents
    can record and analyze consumer behavior in ways that may not be cost-effective
    for businesses to do otherwise.


    ### 9. Do I need to integrate artificial intelligence into my business?


    **Ans.** There certainly is no law stating that you are required to integrate
    artificial intelligence into your business. The machines have not taken over yet,
    so this future event is still a long way away. However, it may be a poor business
    decision not to think of ways that you can integrate artificial intelligence into
    your business. It may surprise you to learn how simple this may be. You may choose
    to have a chatbot on your website, or you may have a customer service number that
    uses artificial intelligence to direct users where they want to go.


    ### 10. What is machine learning?

    '
  trans: '


    ### 3. 人工智能代理真的只是智能人类吗？


    **答。** 早期人工智能代理的概念通常将这些代理设想为类似于人类的自动机或机器人，它们本质上完成人类会完成的任务，无论是以机械简单的方式，还是以复杂的智能方式。甚至古希腊人也想象自动机能够移动、攻击他人，并本质上做人类所做的事情。唯一的区别在于它们不是真实的人，它们是人造的。


    今天的人工智能承认，人工智能所展现的形式可以大异。如今大多数的人工智能代理都是记录环境数据或刺激并对其解释的计算机程序。例如，许多企业拥有人工智能软件，可以记录购买情况、产品查看或其他行为，并根据这些数据做出预测和建议。通过这种方式，人工智能代理可能表现出人类行为的某些方面，同时（至少目前）仍然是人类的替代品：快速且可靠地完成本质人类的任务。简而言之，今天的代理显然是区别于人类的程序。


    ### 4. 人工智能有不同的类型吗？


    **答。** 人工智能有不同的类型。这包括人工智能的子集或推演，如机器学习或深度学习。但该术语通常是指代理运行方式的人工智能方法。主要的分类系统将人工智能分为：(1)
    分析型人工智能，(2) 类人人工智能和 (3) 人性化人工智能。


    理解不同类型的智能是了解这三种人工智能之间区别的关键。分析型人工智能纯粹从认知角度被考虑。认知代表了一系列技能，如信息处理、语言产生和学习，这些被认为代表了高阶思维。这种思维是人类和一些高等动物所具备的类型。


    类人人工智能在其能力范围内为认知智能增加了情感智能。


    人性化人工智能也许是这三种人工智能中最具人味的一类。人性化人工智能包含了认知智能、情感智能和社会智能。情感智能和社交智能代表了更微妙的智能形式。例如，机器人为了不被立即识别为机器人，就需要表现出这些类型的智能位点（bits）。


    ### 5. 为什么人工智能最近受到如此关注？


    **答。** 人工智能最近受到如此关注，是因为随着人工智能在能够完成的任务上不断突破新障碍，许多人开始理论化地人工智能代表了所谓的生存威胁。


    这种担心在于人工智能可能会试图消灭人类。由于大多数企业在努力过程中使用某种的人工智能，对这件事进行思考显然符合你的最佳利益。


    ### 6. 人工智能与机器人学之间有什么联系？


    **答。** 尽管很多人经常将人工智能认为是与与机器人相关的特质，但目前大多数代理都是完成指定任务的计算机程序。其中一些程序仅仅是从其环境中接收数据并从中学习，这被称为机器学习。


    ### 7. 什么是神经网络？


    **答。** 人工神经网络被设计成至少在部分类似于人类神经系统，该系统包含了以神经元、突触和神经组织形式存在的数百万连接。这些网络允许感知其环境、在环境中运行、与其他物体交互、形成语言并学习。


    科学家研究人类神经网络是为了创建这些代理。虽然这项技术的全部能力尚待实现，但很有可能，如果人工智能实现了奇点，神经网络将成为其运行的关键（如果不是核心）组件。


    ### 8. 人工智能在商业和金融领域可以扮演什么角色？


    **答。** 人工智能已经在商业和金融领域发挥着巨大的作用，即使美国或其他西方国家的普通人并没有意识到这一点。公司在其业务网站或其他客户界面上使用人工智能来改进其功能。


    人工智能程序可以向消费者提供购买建议，解释消费者电话以引导他们找到正确的人员来处理问题，或者根据之前的活动在音乐和视频网站或社交媒体上提供建议。换句话之，人工智能代理可以记录和分析消费者行为，而这些方式对企业来说可能是不具成本效益的。


    ### 9. 我需要将人工智能整合到我的业务中吗？


    **答。** 确实没有法律规定你必须将人工智能整合到你的业务中。机器还没有接管，所以这个未来事件还有很长的路。然而，如果不考虑将人工智能整合到你的业务中的方法，可能是一个糟糕的商业决策。你可能会对这有多么简单感到惊讶。你可能选择在网站上设置一个聊天机器人，或者你可以拥有一个使用人工智能的客户服务电话，引导用户去他们想去的地方。


    ### 10. 什么是机器学习？


    '
