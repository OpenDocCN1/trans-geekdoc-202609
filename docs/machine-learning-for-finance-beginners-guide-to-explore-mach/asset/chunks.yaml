- raw: "*   **Email spam:** Spam filtering methods are used by email clients to avoid\
    \ fake emails or malware. As such emails can greatly damage a system if opened,\
    \ malware software is used for phishing purposes by spammers to obtain highly\
    \ sensitive information such as bank card details or passwords. Machine learning\
    \ and artificial intelligence algorithms, such as decision tree induction and\
    \ multi-layer perceptron, help in avoiding cybercrime and provide real-time protection\
    \ as well.\n\n*   **Video surveillance:** Video surveillance systems are the best\
    \ way to monitor a specific location. While multiple security cameras cannot be\
    \ managed by a single person, video surveillance systems are designed with machine\
    \ learning and artificial intelligence technologies that train computers to do\
    \ this efficiently.\n\n    Video surveillance systems that are powered by artificial\
    \ intelligence have the ability to detect and report a crime even before it happens\
    \ because the system can track unusual behavior such as someone standing motionless\
    \ for a long period of time or napping regularly on a specific location.\n\n \
    \   Each reported event is handled by a machine learning model at the backend\
    \ so that immediate responses can be generated to stop any kind of criminal activity\
    \ or mishap.\n\n*   **Virtual personal assistants:** With the latest advancements\
    \ in technology, smartphones and digital devices now feature virtual personal\
    \ assistants that help users find useful information when requested via text or\
    \ voice. Major applications of virtual personal assistants designed using machine\
    \ learning models are speech recognition, speech-to-text conversion, text-to-speech\
    \ conversion, and NLP. Siri, Alexa, Google Assistant, and Cortana are few of the\
    \ most popular virtual personal assistants that help users perform routine activities\
    \ every day.\n\n# [Conclusion](#toc.xhtml#s234a)\n\nIn this chapter, we reviewed\
    \ that machine learning is not only used in the financial sector, but it is being\
    \ applied in other sectors as well.\n\nThe next chapter is all about the implications\
    \ of deep learning.\n\n# [CHAPTER 16](#toc.xhtml#c16)\n\n# [Ethical Considerations\
    \ in Artificial Intelligence](#toc.xhtml#c16)\n\n# [Introduction](#toc.xhtml#s235a)\n\
    \nDeep learning systems are getting popular owing to their ability to detect fraud,\
    \ optimize linguistics, conduct research, compose art, and translate in different\
    \ languages. These systems are intelligent and are transforming the lives of humans\
    \ for all good reasons. These systems are getting more capable and making the\
    \ world around us highly efficient and richer. Tech giants such as Facebook, Microsoft,\
    \ Alphabet, Amazon, and some individuals like Elon Musk are firing up the debate\
    \ that now is the right time to explore the boundless applications of artificial\
    \ intelligence. But as it is an emerging technology, it is imperative to talk\
    \ about ethics and risk management.\n\nThere has been a surge in fears that artificial\
    \ intelligence is going to rule over the world while humans will live like slaves.\
    \ This may seem to be a far-fetched opinion at the moment, but no one can deny\
    \ the possibility in the future. Will Smith's movie “I Robot” is a clear example\
    \ of a super-intelligent machine that can outsmart humans and take control of\
    \ the world. The movie shows how an AI system can become autonomous and take control\
    \ of the power grid and other man-made systems. Robots are seen policing the area\
    \ and killing humans. Experts fear this kind of rise of the machines. The biggest\
    \ concern is what happens if AI learns to program itself.\n\n# [Structure](#toc.xhtml#s236a)\n\
    \nIn this chapter, we will cover the following topics:\n\n*   Loss of jobs.\n\n\
    *   Inequality.\n\n*   Humanity.\n\n*   Disinformation.\n\n*   Artificial intelligence\
    \ and evil people.\n\n*   Racist robots.\n\n*   Artificial intelligence against\
    \ humans.\n\n# [Objective](#toc.xhtml#s237a)\n\nAfter studying this chapter, you\
    \ should be able to do the following:\n\n*   Understand the impact of artificial\
    \ intelligence on humans.\n\n# [Loss of jobs](#toc.xhtml#s238a)\n\nThe first ethical\
    \ implication of deep-learning artificial intelligence is loss of jobs. The hierarchy\
    \ of labor at the moment is concerned with automation. The world is getting more\
    \ proficient in automating jobs. There is little room for people to take up complex\
    \ roles, shifting from physical work that once dominated the pre-industrial world\
    \ to highly cognitive labor that focuses on administrative work in a globalized\
    \ society. Take a look at the field of trucking. There are millions of employees\
    \ in the trucking industry in the US, and Elon Musk has promised to roll out self-driving\
    \ trucks. What happens to those employees if you flood the roads with self-driving\
    \ trucks? Loss of jobs is one side of the mirror. The positive side is that there\
    \ will be a lower risk of accidents, which makes self-driving trucks an ethical\
    \ choice. A similar kind of scenario can be imagined for a majority of the workforce\
    \ in developed countries like the US and the UK.\n\nThis indeed is the most immediate\
    \ concern. Artificial intelligence brings mixed sentiments in this regard. It\
    \ is getting increasingly clear that artificial intelligence is not a job killer.\
    \ Instead, the term that is used is a category killer. There are certain categories\
    \ of jobs that artificial intelligence will ultimately wipe out. For example,\
    \ computer systems have replaced humans in the field of weaving of looms, leading\
    \ to shifts in employment from one category to another. The same thing can happen\
    \ when artificial intelligence systems land in the hands of common men. Research\
    \ shows that category loss is inevitable when artificial intelligence will take\
    \ over the world. The highly targeted sectors are customer service, which needs\
    \ to run round the clock, and professional services. Companies will be free to\
    \ put their human resources to more cognitive tasks.\n\nThis new move is fanning\
    \ concerns about the displacement of labor in different industries. Artificial\
    \ intelligence is speeding up digital transformation in different business processes.\
    \ As different companies look forward to adapting and then implement several artificial\
    \ intelligence strategies, it is time to think about whether it is important to\
    \ engage in an honest conversation with employees. The latest research shows that\
    \ companies that are teaming up artificial intelligence systems with humans show\
    \ promising results in terms of better yield. They are doing far better than companies\
    \ that have fully replaced humans with artificial intelligence systems. On the\
    \ other hand, employees are welcoming these decisions. They are feeling more comfortable\
    \ working with machines as their coworkers instead of seeing them as their competitors\
    \ and potential replacements.\n\n# [Inequality](#toc.xhtml#s239a)\n\nThe second\
    \ ethical concern is what will happen to the distribution of wealth when machines\
    \ start earning while humans sit back and relax in their homes. A majority of\
    \ services and goods companies depend on hourly work. By using artificial intelligence,\
    \ a company can reduce its reliance on human workforce. It means that the revenues\
    \ will go into the pockets of a few men. As a result, individuals who own artificial-intelligence-driven\
    \ companies will keep making large amounts of money. The wealth gap in society\
    \ will continue to increase. Startup founders will bag big profits. Silicon Valley\
    \ has now fewer employees than it had in the past.\n\n# [Humanity](#toc.xhtml#s240a)"
