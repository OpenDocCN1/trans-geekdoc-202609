- raw: 'Another route for banks to enter in the AI domain is to invest in AI startups.
    There is now a growing trend amongst banks to acquire FinTech startups to keep
    up in the ever-changing landscape of technology. In 2017, JPMorgan Chase acquired
    WePay, a US-based small-business-focused payments company to provide its four
    million small business clients with WePay’s payments technology. In 2016, Ally
    Financial, a US financial services company, acquired Trade King, a digital wealth
    management company. In early 2018, Canada-based TD bank bought its first technology
    firm, an AI-based startup, Layer 6. The main focus of the bank was to provide
    customers with personalized services.


    Banks have to compete with other industries that are providing personalized customer
    experiences as well as financial services. Customers expect the bank to anticipate
    their needs and preferences. As banks move forward in the digital bank journey,
    there will be a vast amount of digital data available with banks. AI can transform
    isolated customer interactions into a seamless thread of customer experience.


    The banking industry, which is facing competition from FinTech, eCommerce companies,
    tech giants, and telecom companies, is willing to explore and implement AI with
    two underlying motives: one is reducing the cost of serving customers, and second
    is improving customer experience through personalization.


    Banks can adopt AI either in partnerships, acquisitions, or in-house development.
    There is no one strategy that fits all financial institutions.


    # [Development status of different AI technologies](#toc.xhtml#s148a)


    Take a look at the following image:


    ![](images/9.4.jpg)


    **Figure 9.4:** Understanding the Investment into AI in Banking, 2017 (Source:
    Celent)


    “Planning” in the above chart implies that a bank has a funded project for implementation
    within the next twelve months. As per some of the recent trends, what we can observe
    is that banks do not have a clear roadmap when it comes to investing and adopting
    AI. Supervised machine learning can be the first stepping stone for novice banks
    who want to embark on the journey. It is the most common type of machine learning.
    Banks can also explore collaborative methods.


    One way is for banks to look at established use cases for AI adoption. Each bank
    has to initiate its own journey based on its business strategy. Where is the bank
    standing on its technology threshold? Does the bank already have data analytics
    in place? If not, those are essential stepping stones to start the AI journey.


    The average gain of implementers of “must do” use cases over low implementers
    is shown here:


    ![](images/9.5.jpg)


    **Figure 9.5:** (Source: Capgemini)


    A recent survey by Capgemini clearly shows that the “low hanging fruit” approach
    is showing gains for banks especially in sales and customer acquisition.


    Banks need to chart their own path, pace, and destination on the basis of their
    resources and business plans. If a bank wants to start an in-house AI, then it
    will need vision, hire skill sets, technology incubation, and significant time
    from development to deployment. Another option is external help from AI startups
    who understand the bank’s culture and needs and can accordingly look at developing
    the necessary AI model. Banks are also investing in AI startups, and this makes
    the startups part of bank’s enterprise, thereby reducing the risk associated with
    third-party vendors while sharing sensitive bank data. Also, it brings in a culture
    of innovation in banks. And for the AI startup, on their part, they will now consider
    the bank as a part of their organization rather than viewing it as a client.


    So, the bottom line is that banks need to see the cost benefit of AI. They are
    skeptical about investing huge amounts in AI without reaping benefits either in
    customer retention, cost-cutting, or customer onboarding. Banks do need to realize
    that, whether they want to adopt or not, AI is the technology of the future and
    all its competitors are adopting it. And when we say competitors, we are talking
    about FinTech companies who are way ahead in experimenting and adopting AI. It
    is just a matter of time when AI becomes a way of banking.


    Banks at the top level need to have an understanding of various AI technologies—machine
    learning, predictive analytics, NLP, robotic process automation, and smart virtual
    assistants—and where these can be applied in bank processes, ranging from customer
    service to risk management. Banks need to understand applied AI; using these technologies
    in applied solutions will need a strong foundation of data analytics.


    # [Risk management](#toc.xhtml#s149a)


    It often becomes difficult to handle financial tasks owing to high security and
    performance requirements. To begin with, while implementing AI in the financial
    sector, data scientists and machine learning engineers have to perform in-depth
    research and evaluation. Financial information systems have enormous amounts of
    data, and the system should be capable of handling tons of transactions without
    any delay. Algorithms designed for the financial sector are highly reliable and
    are tested to deliver 100% results in any scenario. Moreover, they can also manage
    both structured and unstructured data, along with quick identification of potential
    failure causes.


    # [Fraud detection and prevention](#toc.xhtml#s150a)


    AI and machine learning models have the capability to detect fraudulent activities
    and stop unwanted operations in real time. In recent years, banks and financial
    institutions have implemented AI models into their systems and databases. Fraud
    detection systems have the capability to analyze the client’s location, behavior,
    and credit history in real time.


    Other fraudulent activities like money laundering can also be avoided through
    AI models. Machines are designed to put an end to alleged money laundering schemes
    and protect financial and government institutions from any kind of unwanted loss.


    # [Improving the truth of financial rules and designs](#toc.xhtml#s151a)


    Machine learning has a substantial effect on the finance industry. Some of the
    advantages of machine learning include trading, loan underwriting, and portfolio
    management fraud detection. According to the report “The Future of Underwriting,”
    machine learning facilitates data evaluation for assessing and discovering nuances
    and anomalies. This assists in improving the accuracy of principles and units.


    # [Trading](#toc.xhtml#s152a)


    AI and machine learning models are based on the concepts and theories of statistics.
    Trading is greatly expanding in the stock markets all over the world, and traders
    are getting fast and the best predictions and recommendations using AI tools.
    Intelligent trading systems have the capability to monitor structured and unstructured
    databases. In a structured database, we can have data from spreadsheets or other
    databases, whereas, in the unstructured category, the data is taken from sources
    like social media or news.


    Trading algorithms are based on AI models and make predictions and calculations
    depending on the market conditions. Machine learning algorithms are trained on
    past data and trade history, which allows them to deliver accurate insights and
    predictions. Moreover, the technology has greatly improved the validation process,
    which has helped traders get information regarding the trade without any hassle.


    In the banking sector, AI powers smart chatbots that provide real-time answers
    and solutions to customers. Voice control assistants have now been introduced
    that have self-education features and are getting smarter each day. There are
    different AI apps and tools that offer personalized financial advice and support
    individuals in any financial problem. These intelligent tools can track income,
    recurring expenses, and calculate spending habits as well. On the other hand,
    AI finance tools can also be used to obtain an optimized plan and get financial
    support.'
