    Tech giants tend to hog most of the limelight when it comes to cutting-edge technological
    advancements. But the financial sector, including the stodgy banking incumbents,
    are showing increasing interest and signs of adoption of AI. The banking or finance
    industry has a profound impact on virtually all consumers and businesses with
    a direct effect on the country’s economy, so seeking insights and keeping up to
    date with the convergence of financial technology and AI is critical for every
    business. The banking industry is putting its money on AI-based solutions to address
    several traditional banking problems such as providing quality customer service
    to their millions of customers, fraud prevention, mobile technology, and data
    security, among others.


    **Here are some popular AI-based trends in banking:**


    In the 1960s, in an effort to coordinate the bookings made by travel agents across
    the US, the travel industry pioneered large-scale computer-based airline booking
    systems. Most travel companies are now collecting data from users, and with the
    right AI tools, they are able to provide customers with relevant future travel
    programs based on their past searches. The use of AI pricing tools that can autonomously
    adjust flight prices depending on the market demand, weather, and other determining
    factors is helping airlines optimize their business.


    When prospective travelers browse, shop, book, fly, or even change their travel
    plans, companies collect this data, which is analyzed by AI-powered solutions,
    to gather actionable insights and tailor their services to the customer’s needs.
    The competition in the travel industry is fierce, with the savvy travelers always
    comparing and looking for prices of flights, hotels, buses, trains, and car rentals
    to get the best out of their buck. AI has immense potential to alter the travel
    experience with personalized services and efficient travel experience.


    # [Conclusion](#toc.xhtml#s154a)


    Finance is at the forefront of technology, and we discussed why. We also discussed
    why machine learning should be adopted in finance. We also had a walkthrough of
    machine learning impact on the finance industry. For establishments employed in
    the finance industry, it has become more and more critical to keep up with the
    opposition and improve their standing in terms of technology.


    In the next chapter, we will learn the impact of machine learning on FinTech.


    # [CHAPTER 10](#toc.xhtml#c10)


    # [Impact of Machine Learning on FinTech](#toc.xhtml#c10)


    # [Introduction](#toc.xhtml#s155a)


    Although it is clear that the traditionally conservative financial organization
    was not at the forefront of the growth in machine learning, FinTech machine learning
    is now a popular word. It delivers a new standard of operation for financial analysis,
    customer care, and data management.


    # [Structure](#toc.xhtml#s156a)


    In this chapter, we will cover the following topics:


    *   Overview of FinTech companies.


    *   Impact of technology.


    *   Challenges.


    # [Objective](#toc.xhtml#s157a)


    After studying this chapter, you should be able to do the following:


    *   Understand the impact of technology on FinTech companies.


    *   Understand the challenges faced by FinTech companies.


    # [Overview of FinTech companies](#toc.xhtml#s158a)


    Financial technology, or FinTech, comprises businesses that use technology to
    ensure efficiency in financial services delivery. The companies are usually startups
    that disrupt existing financial systems and challenge established financial institutions
    that do not rely on technology.


    FinTech solutions can fall under any of the five areas: banking or insurance sector,
    business processes support, targeted customer segment, business-to-business interaction,
    or market position solutions.


    There is an increase in global investment in this type of industry since 2008.
    In fact, in 2014, it reached at least $12 billion from $930 million in 2008. The
    rapid growth over the years showed a 40% increase in the workforce in London in
    the financial and technology services. Popular FinTech companies include Nutmeg,
    Funding Circle, and TransferWise.


    In the US, various FinTech startups include Betterment, Affirm, Fundera, Behalf,
    Lending Club, IEX, Plaid, Money.net, Robinhood, Prosper, Square, SoFi, Wealthfront,
    and Stripe. In 2014, European FinTech firms received $1.5 billion in investments.
    London-based FinTech companies received $539 million, while the FinTech companies
    in Amsterdam received $306 million. FinTech companies in Stockholm received $266
    million in investment.


    In the Asia-Pacific, Sydney became the new FinTech hub in April 2015. Stockspot
    and Tyro Payments are strong players in the city, and being a new hub can accelerate
    the growth of FinTech. In Hong Kong, an innovation lab fosters disruption in financial
    services through technology. In the Philippines, VMoney is growing.


    The Financial Data Science Association organized its first event to include members
    from the fields of NLP, machine learning, and AI. The organization hopes to create
    a research community around investment statistics and computer science.


    In October 2014, the Wharton School of University of Pennsylvania founded Wharton
    FinTech to connect thought leaders, academics, investors, and innovators for the
    purpose of reinventing global financial services. The University of New South
    Wales and the University of Hong Kong Law School published a research paper about
    the evolution and regulation of FinTech.


    Forbes magazine came up with a list of leading FinTech disruptors for its Global
    Fintech 50 for Forbes 2016. The UK Treasury commissioned a report in February
    2016 comparing the leading FinTech hubs. California ranked first for its talent
    and capital, while the UK first ranked for government policy. New York City got
    first ranking for demand.


    # [Impact of technology](#toc.xhtml#s159a)


    FinTech increases customer satisfaction. In December 2015, its customer satisfaction
    was higher by 8% compared to banking. Established financial advisory companies
    like Fidelity Investments collaborated with FutureAdvisor, a FinTech startup,
    to allow new technology within a custodian. Celebrities like Jared Leto, Snoop
    Dog, and Nas invested in Robinhood, a FinTech startup.


    Finance is highly vulnerable to the disruption caused by software. Financial services
    do not have concrete products. They have information. Although regulations shield
    finance, for now, FinTech startups are beginning to shake up the global banks.
    Established financial institutions weathered the dot-com crisis. On the other
    hand, regulations in areas of money transfer and the Bank Secrecy Act pose an
    ongoing threat to FinTech startups.


    # [Challenges](#toc.xhtml#s160a)


    Aside from traditional competitors, FinTech firms face challenges from financial
    regulators. Data security is another concern. The threat of hacking and the necessity
    to protect sensitive corporate financial and consumer data are problems each FinTech
    startup must face. Even a small breach of data can have a disastrous effect on
    the reputation of a FinTech company.


    Another consistent challenge is the increased extortion attacks of the online
    financial sector. Further, many FinTech companies face challenges in marketing
    because larger competitors spend more money on advertising. In fact, even established
    financial institutions face security challenges because of their online customer
    services.


    # [Conclusion](#toc.xhtml#s161a)


    Financial analysis is a huge topic in accounting, and when done with the aid of
    machine learning, it will greatly help in coming up with a more concise profile
    and data to help the current manpower.


    In the next chapter, we will try to understand machine learning in finance.


    # [CHAPTER 11](#toc.xhtml#c11)


    # [Machine Learning in Finance](#toc.xhtml#c11)


