- raw: 'Intrusion is something a lot of organizations and firms undergo. This is basically
    actions that can compromise the integrity of a confidential source. The defensive
    measures employed to ensure this doesn’t happen include user information authentication.
    Data mining can help in improving this intrusion detection by adding a high level
    of focus to anomaly detection. This way, data analysts can easily distinguish
    intrusive activity from more common and frequent everyday activity. Data mining
    can be used to extract data that is specifically relevant to the problem. Data
    visualization makes it a lot easier to understand the data for decision-making.


    # [Lie detection](#toc.xhtml#s210a)


    Lie detection can be difficult and apprehending criminals might be the easy part,
    but getting them to say the truth can be a lot more difficult. Law enforcement
    can use data mining and visualization techniques for investigating crimes and
    tracking communication between suspected terrorists or people. This includes the
    use of text mining and seeking out meaningful patterns in data, which usually
    come in unstructured text. For example, data samples that have been used in past
    investigations can be compared and a model lie detector can be developed. The
    data thus collected can be sorted according to the requirement of the case.


    Data mining and visualization can be used for all of the above and possibly so
    much more. The bottom line is that they are important tools in today’s world and
    are necessary for businesses and corporations to thrive the best way they can.
    Data mining can also be used to achieve data visualization as the case may be.
    The best part is, it gives rise to a lot of possibilities in the nearest future.


    # [Conclusion](#toc.xhtml#s211a)


    Data mining is necessary for improving an existing system. Also known as data
    or knowledge discovery, it can be used for analyzing data from every aspect. This
    data can be used in reducing costs, increasing revenues, and running a business
    or an organization.


    Data mining is one of the tools widely used in analyzing data from different angles
    and dimensions while categorizing it and establishing relationships among the
    different types of data.


    Data visualization is also a very crucial tool. It isn’t just a representation
    of data in graphical formats, but it is incredibly powerful and the use of this
    tool can affect an organization both negatively and positively. When data visualization
    is not used effectively, it can affect decision-making and obscure whatever information
    you are trying to communicate. When used right, it can help you achieve more effective
    and powerful communication and aid great decision-making.


    Data mining and visualization are both different ways of collecting and identifying
    data, and if used properly, they can make an organization grow.


    In the next chapter, we will discuss the advantages and disadvantages of machine
    learning.


    # [CHAPTER 14](#toc.xhtml#c14)


    # [Advantages and Disadvantages of Machine Learning](#toc.xhtml#c14)


    # [Introduction](#toc.xhtml#s212a)


    Machine learning is a very strong instrument that has the ability to revolutionize
    the way things work. Machine learning can be used to overcome challenges and support
    businesses by making projections and allowing them to make wise choices. Each
    coin has two faces; each face has its individual property and characteristics.
    It’s time to reveal both faces of machine learning.


    # [Structure](#toc.xhtml#s213a)


    In this chapter, we will cover the following topics:


    *   Advantages.


    *   Disadvantages.


    # [Objective](#toc.xhtml#s214a)


    After studying this chapter, you should be able to do the following:


    *   Understand the advantages and disadvantages of machine learning.


    # [Advantages](#toc.xhtml#s215a)


    Owing to the sheer volume and magnitude of the tasks, there are some instances
    where an engineer or developer cannot succeed, no matter how hard they try; in
    those cases, the advantages of machines over humans are clearly stark.


    # [Identifies patterns](#toc.xhtml#s216a)


    When an engineer feeds a training data set to a machine with AI, the machine will
    then learn how to identify patterns within the data and produce results for any
    other similar inputs that the engineer provides. This is efficiency far beyond
    that of a normal analyst. Because of the strong connection between machine learning
    and data science (which is the process of crunching large volumes of data and
    unearthing relationships between the underlying variables), through machine learning,
    one can derive important insights from large volumes of data.


    # [Improves efficiency](#toc.xhtml#s217a)


    Humans might have designed certain machines without a complete appreciation for
    their capabilities, since they may be unaware of the different situations in which
    a computer or machine will work. Through machine learning and AI, a machine will
    learn to adapt to environmental changes and improve its own efficiency, regardless
    of its surroundings.


    # [Completes specific tasks](#toc.xhtml#s218a)


    A programmer will usually develop a machine to complete certain tasks, most of
    which involve an elaborate and arduous program where there is scope for the programmer
    to make errors of omission. He or she might forget about a few steps or details
    that they should have included in the program. A machine with AI that can learn
    on its own would not face these challenges, as it would learn the tasks and processes
    on its own.


    # [Helps machines adapt to the changing environment](#toc.xhtml#s219a)


    With ever-changing technology and the development of new programming languages
    to communicate these technological advancements, it is nearly impossible to convert
    all existing programs and systems into these new syntaxes. Redesigning every program
    from its coding stage to adapt to technological advancements is counterproductive.
    At such times, it is highly efficient to use machine learning so that the machines
    can upgrade and adapt to the changing technological climate all on their own.


    # [Helps machines handle large data sets](#toc.xhtml#s220a)


    Machine learning brings with it the capability to handle multiple dimensions and
    varieties of data simultaneously and in uncertain conditions. A machine with AI
    has the ability to learn on its own and can function in dynamic environments,
    emphasizing the efficient use of resources.


    Machine learning has helped develop tools that provide continuous quality improvements
    in small and larger process environments.


    # [Disadvantages](#toc.xhtml#s221a)


    It is difficult to acquire the data necessary to train a machine. The engineer
    must know what algorithm he or she wants to use to train it, and only then can
    he or she identify the data set they will need to use to do so. There can be a
    significant impact on the results obtained if the engineer does not make the right
    decision:


    *   It’s difficult to interpret the results accurately to determine the effectiveness
    of the machine-learning algorithm.


    *   The engineer must experiment with different algorithms before he or she chooses
    to train the machine.


    *   Technology that surpasses machine learning is being researched; therefore,
    it is important for machines to constantly learn and transform to adapt to new
    technology.


    # [Concepts involved in machine learning](#toc.xhtml#s222a)


    Machine learning uses multiple concepts, and each of these concepts helps a programmer
    develop a new method that can be used in machine learning, and all these concepts
    together form the machine learning discipline.


