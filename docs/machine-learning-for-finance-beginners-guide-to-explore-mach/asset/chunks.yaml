- raw: 'Recalling a high school geometry lesson makes this less complicated than it
    sounds: given any two points A and B, all points that are almost equidistant from
    points A and B fall along a line (which is called the perpetual bisector) that
    is perpendicular to the one that connects A and B and all points between them.
    The dashed lines link the initial seeds in the figure above; the resulting cluster
    boundaries shown with solid lines are at right angles to the dashed lines. Using
    these lines as guides, it is clear which records are closest to the seeds.


    These boundaries would be planes in three dimensions, and they would be N-dimensional
    hyperplanes *N – 1*. Fortunately, such conditions are managed easily by computer
    algorithms. Finding the actual boundaries among the clusters is useful for geometrically
    displaying the operation. However, in practice, the algorithm normally calculates
    the distance between each record and each seed, and chooses the minimum distance
    for this step.


    Consider, for example, the record with the box drawn around it. Based on the initial
    seeds, this record is assigned to seed number 2 because it is likely closer to
    that seed than to one of the other two. Every point has been allocated at this
    point to exactly one of the three clusters based around the original seed. The
    third step is to measure the cluster centroids; these now do a better job of characterizing
    the clusters than the initial seeds. Finding the centroids is simply about taking
    the average value of each dimension for all the cluster records. The new centroids
    are stamped with a cross in *[Figure 18.4](#c18.xhtml#fig18_4)*. The arrows display
    the movement of the seeds from their original location to the cluster of new centroids
    produced from those seeds.


    ![](images/18.4.jpg)


    **Figure 18.4**


    The centroids become the seeds for the algorithm’s next iteration. Step 2 is repeated,
    and each point with the closest centroid is again allocated to the cluster. The
    figure below shows the new boundaries of clusters formed, as before, by drawing
    equidistant lines between each pair of centroids.


    ![](images/18.5.jpg)


    **Figure 18.5**


    Note that cluster number 1 has now been allocated to the point with the box around
    it that was originally assigned to cluster number 2. The process of assigning
    cluster points, and then recalculating centroids, continues until the boundaries
    of the cluster stop shifting. In practice, after a few tens of iterations, the
    k-means algorithm typically finds a set of stable clusters.


    # [What does k mean?](#toc.xhtml#s263a)


    Clusters define the structure that underlies the data. There is no one proper
    definition of the structure, however. For example, someone who isn’t from New
    York City may think the entire city is downtown. Someone from Brooklyn or Queens
    may apply this nomenclature to Manhattan. It could just be areas within Manhattan
    south of 23rd Street. And even there, in the southern tip of the island, downtown
    could still be reserved only for the taller buildings. Clustering poses a similar
    problem; data structures occur on several different levels.


    k-means definitions and allied algorithms gloss over k’s variety. But since there
    is no a priori justification to choose a specific value in certain situations,
    there really is an outermost loop to these algorithms that exists in the course
    of analysis rather than in the computer program. This outer loop consists of automatic
    cluster detection using one k value, evaluating the results, and then retrying
    with another k value, or perhaps modifying the data. These tests can be automated,
    but it is often important to evaluate the clusters on a more subjective basis
    to assess their utility for a given application. As shown in *[Figure 18.6](#c18.xhtml#fig18_6)*,
    different k values can lead to equally valid clusters of very different types.
    The figure shows the clustering of a deck of K = 2 and K = 4 playing cards. Is
    one better than the next? It depends on the use the clusters are put to:


    ![](images/18.6.jpg)


    **Figure 18.6**


    For the first time, k-means clustering is performed on a given data set. Most
    data points fall into one massive central cluster, and the rest form a number
    of smaller clusters outside. This is mostly because most records describe natural
    variations in the data, but the clustering algorithm has enough outliers to cause
    confusion. This form of clustering can be useful for applications such as detection
    of fraud or fabrication defects. In other cases, removing outliers from the data
    can be desirable; more often, massaging the data values is the solution.


    # [Distance and similarity](#toc.xhtml#s264a)


    If records are mapped to space points in a database, identification of automatic
    clusters is really very simple—a little geometry, some vector means, and voilà!
    Of course, the issue is that the systems encountered in marketing, distribution,
    and customer service are not about space points. They are about sales, phone calls,
    airplane journeys, car registration, and a thousand other items that have no apparent
    relation to the dots in a cluster diagram. This kind of clustering records involves
    some notion of natural association; that is, records in a cluster are equal or
    related to each other than records in another cluster. Since abstract concepts
    are hard to express to a machine, this vague definition of connection needs to
    be converted into a kind of numerical measure of the degree of similarity. The
    most popular but by no means the only approach is to convert all fields into numeric
    values so that the records can be viewed as space points. In the geometric sense,
    then, if two points are identical, they represent similar records in the database.
    This method has two key problems: (1) many variable forms, including all categorical
    variables and many numerical variables like rankings, do not have the correct
    behavior to be handled properly as components of a position vector, and (2) the
    contribution dimension is of equal significance in geometry, but in databases,
    a minor change in one field can be much more significant than a big change in
    another. A few alternative similarity measures are introduced in the following
    section.


    Similarity measures and geometric distance of variable type work well as similarity
    measures for well-behaved numeric variables. A numeric variable is one whose value
    in our geometric model indicates its location along the corresponding axis. Not
    all of the variables fall into that group. Variables fall into four classes to
    this end, listed here in increasing order of suitability for the geometric model.


    *   Differential variables.


    *   Ranks.


    *   Intervals.


    *   Right measures.


    Categorical variables define only one of many unordered categories to which one
    element belongs. For example, an ice cream may be labeled pistachio and another
    butter pecan, but it is not possible to tell that one is larger than the other
    or to determine which one is closer to black cherry. Mathematically, X > Y can
    be assumed, but not if X > Y or X < Y. Ranks put things in order, but don’t assume
    that one thing is any bigger than another. The valedictorian has higher grades
    than the salutatorian, but by what margin, we don’t know. If X, Y, and Z are ranked
    A, B, and C, we know that X > Y > Z, but X – Y or Y – Z cannot be specified. Intervals
    measure the interval from one measurement to another. If it is 56 °F in San Francisco
    and 78 °F in San Jose, then at one end of the bay it is 22 °F colder than at the
    other.'
