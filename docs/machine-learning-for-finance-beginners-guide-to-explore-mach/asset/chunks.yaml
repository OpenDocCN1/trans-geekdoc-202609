  trans: '

    与结构化数据相比，世界上确实存在更多的非结构化数据。由于非结构化数据变得可用需要更多工作，它们往往吸引了关注并花费更多时间。因此，机器或程序能够处理和分析非结构化数据的承诺对于任何预测分析模型来说都是一个巨大的卖点。你必须记住永远不要低估非结构化数据及其对你分析的威力。在构建预测分析模型时，分析结构化数据总是比分析非结构化数据更高效，因为后者的处理成本更高。数据的选择、其与分析的相关性、清洗以及后续转换通常是漫长且枯燥的任务。只有在数据经过所有这些过程后，它才具有在预测分析模型中的价值。


    使用结构化数据获取结果通常比非结构化数据更容易，因为你永远不需要担心清洗过程存在延迟。文档标记和文本分析是处理非结构化文本文档的两种方法，对数据进行分组、总结并链接其内容。这有助于用户发现数据中的任何隐藏模式。同样重要的是，大多数搜索引擎平台通常提供工具来索引数据并使其变得可搜索。


    非结构化数据并不经常缺乏结构，只是需要花更多精力来理解这种结构。任何数字文件中的每个文本都有与其相关的某种结构，这些结构通常出现在元数据中。这适用于其他形式的结构化数据。对数据的结构组件进行彻底分析可能是值得的。这将使你能够估计对非结构化数据进行的任何分析的潜在价值。当分析提供了数据的一点见解时，你应该尝试确定为分析那部分非结构化数据需要分配的资源。


    其理念是，你总可以在所收集的数据中找到某些规律。你需要对数据进行大量的挖掘以更好地理解它。两个人之间的一系列邮件中的内容可能会偏离邮件的原始主题，尽管主题行保持不变。有时，主题行甚至可能完全说不通。


    区分这两种数据类型的界限并不总是清晰的，因为非结构化数据的某些方面具有结构化数据的特征。在大多数情况下，这种结构是否反映了数据的内容尚不清楚。就此而言，结构化数据也可以包含一些非结构化数据。例如，在网络表单中，用户可能需要通过从选择选题中选择答案来提供反馈，并提供一个评论框以文本形式提供反馈。这个评论框包含非结构化数据，因为信息是自由形式的。这些情况通常被认为是结构化和非结构化数据的混合。


    在数据定义领域总会有一些例外，因为这两类数据的定义可能是模糊的。总有办法可以区分这些数据。


    # 结论


    在本章中，我们讨论了结构化数据与非结构化数据之间的。目前的目前的工具帮助企业做出更快的决策。我们还讨论了机器学习工具如何帮助企业整理数据，以便能够以正确且更有序的方式进行处理。在下一章中，我们将讨论解析。


    # 第 4 章


    ## 使用 NLP 解析数据


    ## 引言


    自然语言处理（NLP）的发展基于人工智能的理论和模型。NLP 是机器学习模型理解人类语言的能力，是人工智能的重要部分。这种方法帮助公司和企业用不同的语言与世界各地的人进行交流。人类语言并不总是精确的，我们每个人都有独特的语言结构。翻译过程取决于几个主要因素，如地区方言、变量和社交背景。


    此外，NLP 是计算机以有用且智能的方式理解、分析并从人类语言中推导出准确含义的方法。机器学习和人工智能模型被设计用于执行多项任务，如翻译、关系提取、自动摘要、主题分割和情感分析。NLP
    是分析文本的有效方法，允许机器理解人类实际上是如何说话的。这种方法通常用于机器翻译、文本挖掘和自动问答。


    解析意味着通过 NLP 按照语法法则从文本数据中提取信息和含义。换句话说，解析是拆解句子以澄清句子的每个方面。


    ## 结构


    在本章中我们将涵盖以下主题：


    * NLP 的用途。

    * NLP 的主要优势。

    * NLP 中的数据处理。

    * NLP 应用。


    ## 目标


    学习本章后，你应该能够做到以下：


    * 理解 NLP 的用途和优势。

    * 理解 NLP 的应用。


    ## NLP 的用途


    自然语言处理（NLP）算法用于多种用途。基本上，它们帮助开发人员开发理解人类语言的软件。由于其复杂性，NLP 很难正确地实现和学习。随着时间的推移，数据科学家和机器学习工程师正努力改进这一过程并带来更好的周转率。


    NLP 算法用于总结文本块。为了完成这一操作，在机器学习模型中实现了一个摘要器，用于提取有用的观点并忽略任何无关信息。此外，NLP 模型通过 `AutoTag`
    从内容中准确生成关键词标签，这是发现内容中简述主题的一项技术。此外，情感分析方法以积极的方式识别给定文本中字符串的情感。


    目前的 NLP 方法依赖于深度学习概念。深度学习是人工智能的一种，它检查并利用数据中的模式来提高程序的理解能力。早期的 NLP 模型基于规则的方法，仅具有在文本中搜索短语并生成简单回答的能力。今天，人工智能和机器学习极大定制了
    NLP 模型的工作方式并交付卓越的结果。NLP 模型工具有 `Genism`、`Intel NLP Architect` 和 `NLTK`。


    Python 编程语言自带库，可以帮助开发人员创建高级机器学习和人工智能模型。这些库包括 `SciPy`、`NumPy` 和 `Pandas`。数据科学家正在进行研究以改进搜索结果，使用户可以通过问题查询数据集并获得实时的翻译。机器学习模型有能力理解人类语言的关键元素及其句子结构。


    ## NLP 的主要优势

