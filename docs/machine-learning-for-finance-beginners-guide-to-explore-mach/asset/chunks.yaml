  trans: '


    人工智能驱动的机器人可以随着每一次经验学习得更快，并不断改进自己。它们在模拟人类关系和对话方面正变得越来越出色。2015 年，一个人工智能驱动的机器人 `Eugene
    Goostman` 荣得了图灵挑战。这一里程碑仅仅是一个时代的开始，在这个时代，人类将与机器频繁互动，就像对待真人一样。“辩论者”（Project Debater）就是一个例子。这种互动将在销售和客户服务领域大规模发生。虽然人类在善意和注意力方面可能受到局限，但人工智能驱动的机器人并非如此，它们可以建立并巩固最终造福业务的关系。


    我们中的许多人可能没有意识到，但机器已经环绕在我们周围。如果我们批判性地观察周围，会发现不同的机器正在与我们互动。也许你今天看到一个标题党的标题，它引引你进入一个业务落地页，或者你可能到达了一个视频游戏页面。这些广告和标题是由人工智能驱动的机器人优化的，它们监控你的搜索习惯，并提出你最搜索的话题。这以及其他方法被用来让人们沉迷于视频游戏和其他娱乐。


    许多人将人工智能视为一种变革性技术。问题是，这样的系统是否能够完全改变社会。它能修剪我们的草坪吗？它能帮我们养育孩子吗？它们会为我们战斗战争吗？它会写我们的文章并让我们休息看电视吗？它会创建政治广告吗？所有这些问题都值得讨论。


    # 虚假信息


    人工智能系统正被用于创建虚假视频、图像和对话，以在重要的社会政治辩论中误导人们。我们不能相信在网上看到的东西。如果你无法判断互联网上看到的图像是真实的还是人工智能生成的，这种局面无异于一场灾难。人工智能驱动的机器人被指责在
    2016 年美国大选期间发生了混乱。在更广泛的范围内传播并助长了某些政治宣传。自动化社交媒体账户协助互联网上虚假信息的创建和传播，试图操纵来自社会不同阶层的选民。这些活动加剧了社会中的派系分歧，并通过加深社会两个群体之间的鸿沟几乎使其两极分化。让人工智能驱动的机器人比人类更好的地方在于，它们可以日日夜夜、不疲倦地工作。它们非常快，可以在短时间内生成大量内容。一旦新闻被他人分享和转发，它就会开始病毒式传播。这些机器人在传播虚假新闻或歪曲事实方面非常有效。它们可以放大信息并将某些思想植入人们脑中。现在，犯罪分子和不同的国家行为者正在使用虚假图像来干扰政府运作。现在只需要几个恶意行为者承担传播虚假主张的任务来改变公众的观点。


    未来，公司和政府必须考虑如何从这些人工智能系统造成的政治损害中恢复。唯一能拯救政府和公司的是他们应对虚假新闻和虚假内容的方式。他们应该对待人工智能支持的虚假内容，就像像对待网络安全威胁一样严肃。


    # 人工智能与犯罪


    我们希望坏人得到人工智能技术吗？虽然人工智能有潜力为我们带来很多好处，但我们必须记住，在恶意用户手中，人工智能可能是危险的。随着技术变得越来越强大，如果它落入错误的人手中，可能会造成严重的损害。他们可以使用它来窃取大量现金，并对政府机构发动前所未有的攻击。他们可以使用它对大型组织发动恶意黑客攻击并危及其数据。2016
    年选举期间发生的事情让大多数人感到惊叹。最新的技术针对计算机网络中的漏洞。随着技术的演进，它将变得更有弹性、更坚韧，并能够抵抗任何削弱这些系统的尝试。这是可怕的。想象这样一个场景：一个人工智能系统在隐藏状态运行，根据目前的安全标准它是无敌的。它可以执行操作者想要的任何事情。因此，有必要构建和管理一个有弹性且先进的数字基础设施。检测这些恶意攻击注定会越来越困难；因此，需要在人工智能系统演进的同时修复安全漏洞。


    # 种族主义机器人


    人工智能能够超越人类范围的速度和准确性进行处理，但不能总是信任它能保持公平和中立。Google 是人工智能领域的领导者之一，从它的 `Google Photos`
    服务中可以看出，它可以将不同人的不同照片分类并放在单独文件夹中以便使用。它还会收集同一个人的照片来创建拼图。`Google Photos` 中的人工智能通常也用于识别不同的人和场景。


    但如果设计用于预测未来犯罪犯的软件对黑人有偏见，那是错误的。问题在于，人类编写人工智能系统，所以无论人类告诉他们做什么，他们都会执行。如果人类告诉他们，黑人未来最有可能犯罪，人工智能系统会将他们标记为此类。然而，如果以正确的方式使用这项技术，它可以为给世界带来积极的改变。


    # 人工智能 vs 人类


    你应该担心的不仅仅是敌人。包括特斯拉 CEO `Elon Musk` 在内的许多人所困扰的最大担忧是，万如果一个人工智能系统反抗我们怎么办？这并不意味着它会像人类那样变邪恶。这意味着一个先进的人工智能系统可以满足你所有的愿望，但最终会产生可怕的后果。机器没有感情；因此它不会对任何人表现出恶意。这意味着它可能对产生愿望的背景缺乏理解。想象一个被赋予从世界上消除癌症任务的人工智能系统。它创建一个消除癌症的公式，结果杀死了地球上所有的人，因为每个人身上都有一点癌症。


