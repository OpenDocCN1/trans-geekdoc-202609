- raw: 'The networks in the above figures have a single neuron in the final layer
    that generates a single credit score. Another big strength of neural networks
    is that they can be structured to have more than one output. This is important
    for tasks where there can be thousands of options to choose from, each requiring
    a separate output.


    Returning to our object recognition task, let’s think about how a neural network
    might be structured to identify objects in a picture. As before, we need to gather
    lots of environmental information for the training algorithm to use. In this case,
    let’s assume that the training data contains several thousand pictures of cats,
    cakes, and potatoes as follows:


    *   **Input data:** Each pixel in a picture is represented by four pieces of data—a
    red, blue, and yellow component to indicate the color of the pixel, plus a value
    to represent the intensity (brightness) of the pixel.


    *   **Category data:** Each image is labeled to indicate if it contains a picture
    of a cat, a cake, or a potato.


    The objective is to use the input data to predict the category of the object in
    the picture (cat, cake, or potato). A neural network model like this could have
    millions of inputs, one for each pixel element, thousands upon thousands of neurons
    spread across a dozen or more layers, and three outputs as illustrated below:


    ![](images/6.4.jpg)


    **Figure 6.4**


    In the figure above, each output represents the probability that the image is
    either a cat, cake, or potato. After training, when you present the network with
    a completely new image, the pixels representing the image are processed through
    the network. Then, you simply compare the three outputs and select the one that
    has the highest probability. If output 1 gives a 5% chance that the image is a
    cat, output 2 a 15% chance it’s a cake, and output 3 an 80% chance it’s a potato,
    then the conclusion is it’s a picture of a potato.


    If we want a more general system that can identify many more everyday objects,
    then the same principles apply. It’s just a case of having enough images to train
    a suitably structured network with.


    Other avenues of research associated with deep learning consider how the neurons
    in the network are connected. This makes it possible to incorporate a representation
    of time or event order. Text prediction (like you get on your phone) is one such
    example. The word order is a key factor in predicting what word comes next. Another
    approach is to create sparse networks (convoluted networks) that contain relatively
    few connections between the neurons in different layers. This can help reduce
    the computing power required for certain types of problems.


    One recent advancement in deep neural networks is general adversarial networks
    or GANs, where two neural networks compete with each other to generate new and
    original content.


    Let’s say that we want to produce a neural network that can create artificial
    pictures of people. They look just like real people, but the people don’t actually
    exist. Why would you want to do this? Maybe it’s just for a bit of fun, but maybe
    you want to use the pictures in advertising or on virtual catwalks so that you
    don’t need to get the permission of real people to use their images and so on.


    We start with two untrained neural network models. For argument’s sake, let’s
    call the first neural network the “Judge” and the second the “Student.”


    The Judge assesses the images it’s presented with, and decides if the images are
    of real people or something else. The Judge has a single output that represents
    the probability that the image is real. In principle, the Judge works just like
    any of the other models. If the model output is more than 50%, then we assume
    that image is real; otherwise we assume it’s artificial.


    Now, let’s think about the Student. The Student’s goal is to create realistic
    pictures of people. The Student is doing its job well if it can fool the Judge;
    i.e., it creates fake pictures that the Judge assigns a 50%+ probability of it
    being a real person.


    The Student model works back to front. With a normal object recognition system,
    the inputs to the model are a set of pixels and the output a set of probabilities.
    With the Student, however, the outputs from the model are a set of pixels and
    the inputs are a set of random numbers.


    First, we train the Judge using images that are labeled to indicate if they are
    of real people or something else. Once this initial training is complete, then
    the Judge is pretty good at identifying images of people.


    Returning to the Student, the model weights are initially chosen at random. The
    result? A set of meaningless images of random dots. These are presented to the
    Judge to assess, which has no problem identifying all the images as fake; i.e.,
    it assigns them very low probabilities of being real.


    The probabilities generated by the Judge are fed back to the Student, and the
    training algorithm adjusts the model weights so as to produce a better set of
    images next time round. The algorithm used to train the Judge is also rerun. However,
    this time, the training data also includes the images generated by the Student.


    This process is repeated many times, with each network continually learning from
    the outputs of the other. Eventually, a status quo is reached. The Student produces
    images of people that look real. As far as the Judge can tell, they are real,
    even though they are completely artificial.


    Creative opportunities for GANs are vast. Amazon, for example, is reported to
    be using GANs to design garments by using images of fashionable clothing to train
    it to produce new designs that have similar stylistic features but which are completely
    original. Likewise for music and other creative works.


    GANs show huge promise, but the potential for misuse is also extensive. In particular,
    it’s driving many of the “Deepfake” stories being reported in the press to create
    fake media recordings of politicians and other famous people.


    Why are neural network models so good at what they do? How do they manage to capture
    the nuances of complex problems leading to better judgments than the best human
    experts? One way to think about this is that learning to play a game like chess
    or Go is analogous to mapping an unknown landscape that the training algorithm
    explores as it goes. The model weights capture the features of the landscape and
    how one gets from one part of the landscape to another using different actions
    (game moves).


    In mapping the features of a game, the training algorithms find parts of the landscape
    that people haven’t explored before, as well as new (better or more efficient)
    routes for traveling between two points. In effect, they have discovered new styles
    of play that have never been seen by human players before.


    It has been argued that, in finding these new styles of play, neural networks
    have displayed non-human, i.e., alien, intelligence. However, another perspective
    is that it’s not a new way of thinking, but rather the training algorithms have
    found new features and patterns that humans have just not got around to thinking
    about yet. It doesn’t necessarily mean that the network is displaying a different
    type of thinking altogether, but instead, the training algorithm has found a new
    area of the landscape to explore that people have not yet reached.


    This principle of mapping and exploration also applies in other application domains,
    not just games. One example is supporting scientific discovery, particularly in
    areas of research where huge numbers of possibilities have to be explored to find
    useful solutions—the needle-in--haystack-type problems.'
