  trans: '

    *   企业对 `machine learning solutions` 及其关联激励有着不切实际的欲望和期望。

    *   机器学习的研发成本高昂。

    *   缺乏数据科学/机器学习专家是另一个重大的关注问题。

    *   精通理财的人士在更新信息方面不够敏捷。


    # 机器学习在金融领域的重要性


    尽管面临重困难，目前许多预算型机构已在使用这项创新技术。他们这样做有许多合理的理由：


    *   由于流程自动化降低了运营成本。

    *   由于更好的盈利能力和升级的客户体验增加了收入。

    *   更好的一致性和更强的安全性。


    目前有广泛的开源 `machine learning` 算法和应用/工具，与金融数据极其契合。此外，成熟的金融管理机构拥有大量的资金，可以投入到尖端的注册机设备中。由于海量的交易信息，`machine
    learning` 可以改进金融环境的许多环节。这就是为什么如此多的金融机构正在大力投资人工智能的研发。对于那些步步后者来说，忽视人工智能和机器学习的代价可能是昂贵的。


    # 机器人警告（Robo-warning）


    机器人理顾目前在金融领域需求巨大。目前，机器学习在警告领域有两个值得关注的用途。


    投资组合板（Portfolio board）是一种在线执行管理工具，它利用计算和洞察来分配、监督和优化客户的资产。客户输入他们目前的财务状况和目标，例如：在五十岁时省下一百万万美元。随后，机器人理顾会根据风险倾向和理想目标，将现有资产跨领域地分配到各个投资机会中。


    几家在线保险代理使用机器人理顾为特定客户推荐定制的保险计划。客户选择机器人理顾而非家附近的财务顾问，是因为其费用更低，而且提供定制化且合实际的建议。


    # 如何在金融领域利用机器学习


    尽管机器学习和人工智能有许多关注点，但即使是财力雄厚的公司也经常在从这项技术中提取真实收益方面遇到严峻困难。金融管理部门需要明智地使用 `machine learning`，因为他们并不清楚数据科学是如何运作的以及如何利用它。


    他们经常会遇到诸如缺乏业务 KPI 等困扰。这导致了荒谬的估计并耗尽了预算。建立一个合理的编程基础是不够的（尽管这是一个不错的开始）。要交付一个重要的 `machine
    learning` 进阶项目，需要清晰的愿景、强大且专业的能力以及信心。


    当你对这项技术如何实现你的业务目标有良好的理解时，继续进行计划审批。这是一项数据研究人员的工作。他们研究计划并帮助你制定合理的 KPI 并做出明智的评估。请注意，你需要目前收集的所有信息。否则，你将需要一名数据专家来收集和整理这些信息。


    根据特定的用例和业务情况，金融机构可以采取多种方式来实现机器学习。我们来看看这些吧？


    人工智能通过使用自然语言处理从原始数据中获取有意义的洞察而受到关注。


    通常，金融机构启动其人工智能项目是为了承认他们需要真实的数据构建。N-iX 的高级数据研究人员 `Max Nechepurenko` 提到：


    “目前不存在全机器学习算法。数据研究人员在将算法应用于不同的业务案例之前，需要对它们进行更改和调整。”


    # 利用外部机器学习方案


    无论你的公司是否选择将 `machine learning` 作为未来的任务，你都不需要开发新算法。大多数机器学习任务都关注特定领域的特殊需求。Google、微软、亚马逊和
    IBM 等科技巨头将机器学习编程作为服务工具出售。


    这些开箱即用的方案现在已准备好处理不同的任务。如果你的任务涵盖了类似的用例，你是否认为你的团队可以胜过这些巨头的计算结果？


    一个真实的模型是 Google 的推荐 AI 工具。该产品适用于不同的领域，建议检查它是否符合你的业务案例。


    一个机器学习 架构师可以通过专注于你的特定数据和业务领域来执行该框架。专家需要从各种来源提取数据，针对特定框架进行转换，获取结果并可视化发现。


    权衡是失去了对外部框架的控制权以及方案的灵活性有限。

