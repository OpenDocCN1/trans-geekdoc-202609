    # [Structure](#toc.xhtml#s112a)


    In this chapter, we will cover the following topics:


    *   Problem types in machine learning.


    *   Identifying key predictors (data reduction).


    *   Learning from experience (reinforcement learning).


    *   Reinforcement learning algorithms.


    *   Types of reinforcement learning.


    *   Applications of reinforcement learning in real life.


    # [Objective](#toc.xhtml#s113a)


    After studying this chapter, you should be able to do the following:


    *   Understand business problems wherein machine learning can be applied.


    *   Understand the data reduction techniques.


    *   Understand the concepts, types, and applications of reinforcement learning.


    # [Problem types in machine learning](#toc.xhtml#s114a)


    Machine learning algorithms that look for patterns in massive amounts of data
    are used to build intelligent systems and AI applications. As a subfield of AI,
    hundreds of machine learning algorithms have been developed over the past few
    decades, each of which can be used to directly or indirectly generate new business
    knowledge. Part of the challenge is to determine which algorithm, or family of
    algorithms, is appropriate for your business task.


    In general, there are five main things you can do:


    *   Find patterns with unsupervised learning.


    *   Identify key predictors through data reduction techniques.


    *   Identify irregularities or anomalies.


    *   Learn from examples with supervised learning.


    *   Learn from experience with reinforcement learning.


    For example, consider credit card fraud detection. Because fraud patterns change
    over time, using machine learning algorithms to automatically detect emerging
    patterns can enhance a bank’s capabilities to defend its customers and respond
    faster than if humans had to monitor all the transactions manually.


    You can conceptualize past transaction data as a spreadsheet with millions of
    rows, where each row (an observation) represents a transaction. The columns might
    contain information like the date, time, latitude and longitude of the transaction,
    the amount, the merchant, and perhaps even what was purchased. There is another
    column that gives us the answer to the question of fraud, telling us whether the
    transaction is legitimate or fraudulent. This column exists because the bank has
    had enough time to verify the validity of questionable transactions with the account
    holders. An unsupervised approach might cluster the transactions into two groups
    to see if you can separate the legitimate from the fraudulent. In a supervised
    or semi-supervised approach, the algorithm looks for the similarities and differences
    between legitimate and fraudulent transactions, because it knows (at least to
    some extent) which are which.


    # [Identifying key predictors (data reduction)](#toc.xhtml#s115a)


    Sometimes, the data you have to process is too unwieldy and overwhelming. Imagine
    the same credit card transaction data set considered earlier, but instead of just
    information about the transaction amount, location, and characteristics, there
    are also a few hundred other variables. Which variables should you use to determine
    whether a transaction is valid or fraudulent?


    If you use all the predictors, there are two risks. First, the model-building
    process may be computationally intensive, meaning that it may take more time or
    more processing power to build the model than you have available. Second, by building
    a model with too many predictors, you run the risk of modeling the noise instead
    of the signal, an outcome called overfitting. An overfit model has fantastic predictive
    power on the data you used to train it, but it won’t do as well on new data it
    hasn’t seen before.


    Common methods for data reduction (also called dimensionality reduction) include
    principal component analysis (PCA), linear discriminant analysis (LDA), and autoencoder-type
    neural networks. Although they are not expressly adaptive, reactive, or proactive
    (and thus are more appropriately classified as statistical models than machine
    learning models), applying them to commercial problems tends to require significant
    processing power. They are often applied before sending data through unsupervised
    or supervised machine learning algorithms, so are sometimes included in machine
    learning texts.


    Both computational performance and the accuracy of the resulting machine learning
    model are improved when you use the right features and reduce their number so
    that only the best predictors are used. Reducing dimensionality can increase the
    ultimate power of your model.


    # [Learning from experience (reinforcement learning)](#toc.xhtml#s116a)


    Reinforcement learning (RL) is a type of unsupervised learning that defines potential
    rewards for making different choices instead of labeling each observation with
    a defining characteristic. While supervised learning builds a model based on known
    information, reinforcement learning dynamically explores an environment to discover
    it. Reinforcement learning can be used to determine the best ways for an intelligent
    agent to interact with its environment.


    For example, you may want to find an optimal path from a location in a building
    to the nearest fire exit. If you associate each outdoor location with a high reward,
    areas near exits with a small reward, and areas deep within the building with
    zero reward, reinforcement learning can identify the optimal paths that generate
    the highest reward.


    *Dowling and Cahill (2004)* claim that R reinforcement learning L may be the most
    useful and applicable technique for solving problems in industrial environments.
    Here are some examples:


    *   RL can be used to learn customer preferences by observing behavior, which
    can provide information that is critical for marketing departments. *Halperin*
    (2017) demonstrated how the method can be used to design marketing strategies
    for new products and services, and devise pricing strategies that are tuned to
    the competitive environment.


    *   Students learn better when concepts are presented in logical ways. *West et
    al.* (2019) used reinforcement learning to find optimal learning paths for a curriculum,
    which could improve higher education and training outcomes while enhancing student
    satisfaction.


    *   Improving the quality of a sound source, especially in a noisy environment,
    is important for hearing aid manufacturing. *Koizumi et al.* (2017) explored this
    problem using reinforcement learning by defining reward as an increase in the
    perceived quality of the source.


    *   Challenging medical conditions like sepsis require doctors to quickly identify
    treatment policies. *Raghu et al.* (2018) used reinforcement learning (supplemented
    by several other supervised and supervised approaches) to identify how clinicians
    could use models to substantially improve mortality.'
