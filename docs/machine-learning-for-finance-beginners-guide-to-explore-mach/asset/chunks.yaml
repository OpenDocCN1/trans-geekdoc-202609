- raw: 'Programming machines for computer vision to replace human in various fields
    such as surveillance, immigration check, candidate screening etc. Therefore, many
    major companies are used deep learning techniques and CNNS for enhanced performance
    in facial recognition and object detection, which are part of the computer vision
    field. Some social network platforms also use this technique for automatic facial
    recognition, like Facebook.


    These techniques are also incorporated into self-driving cars that are the future.
    However, we already know the challenges in computer vision, and they might be
    very difficult to solve. Humans automatically see objects, contours, lines, and
    shapes, but computers, on the other hand, just see a great collection of matrices
    and numbers.


    To solve this problem, and to learn more complex image features from raw pixels
    and their values, CNNs are used. Moreover, a great place to start working on computer
    image is the programming language Python, providing you everything you will need
    on this journey.


    # [Neural networks in computer vision](#toc.xhtml#s67a)


    # [Activation function](#toc.xhtml#s68a)


    Let’s learn some essential concepts such as ReLU activation functions, data preprocessing,
    weight initialization, and introduction to CNNs in CNN architecture.


    ReLU is the most widely used activation function for CNNs. It returns 0 if the
    input is negative. It is computationally very effective as easy clipping is required.
    Empirically, it is found to be faster than sigmoid or tanh.


    # [Data preprocessing](#toc.xhtml#s69a)


    All images are transformed into similar sized square shapes. The mean value of
    each image can be deduced from each pixel.


    # [Weight initialization](#toc.xhtml#s70a)


    The weights can be adjusted to the Gaussian distribution of 0 mean and standard
    deviation (0.1 to 1e-5). This works for shallow networks, for example, networks
    with five hidden layers. In the case of deep neural networks, small weights make
    the outputs small, and as you step in towards the end, the values are much lower.
    As a result, the gradients also become thin, resulting in gradient-killing in
    the end.


    # [Introduction to CNN](#toc.xhtml#s71a)


    The first layer will attempt to distinguish edges and create templates for the
    detection of edges. Subsequent layers may then attempt to merge them into simpler
    forms and finally into models of various object positions and scales. The final
    layers align the input picture of all the patterns, and the final forecast is
    like a weighted sum of all the templates. So, deep CNNs are capable of modeling
    complex variations and behavior that offer very precise forecasts. A CNN contains
    three types of layers: convolution layer, pooling layer, and fully connected layer.


    # [Convolutional layers](#toc.xhtml#s72a)


    They are the main structural blocks used in CNN architecture.


    # [Pooling layers](#toc.xhtml#s73a)


    They are used to pad the convolution layer so that the image size remains the
    same. So, pooling layers are used to decrease the magnitude of the image. They
    work through each layer by means of filters.


    # [Fully connected layers](#toc.xhtml#s74a)


    Networks typically use fully connected layers in which each pixel is known to
    be a separate neuron, much like a normal neural network. A fully connected layer
    will include as many neurons as the number of groups to be forecast.


    # [Overview of computer vision](#toc.xhtml#s75a)


    Python is one of the most widely used programming languages, and it will be the
    perfect destination for CNNS and tasks for computer vision. CNNs are behind some
    great successes in the field of computer vision and image and speech recognition.
    We already know that CNNs use two fundamental structures: feature maps and filters,
    which are also called feature detectors.


    These fundamental structures can be presented in the form of certain groups containing
    various neurons that will enable us to build different networks. So, for instance,
    we can say that we have one image, and our main goal is to detect both vertical
    and horizontal edges. To achieve this, we have to create an individual convolutional
    filter.


    A convolutional filter is, in fact, a very small matrix that represents a certain
    feature that is relevant to us and that we want to find within the original image.
    The convolutional filter that is placed on top, in fact, tries to identify and
    detect various parts of that original image with some vertical lines. On the other
    hand, the convolutional filter that is placed at the bottom tries to detect and
    identify various parts of the image that contain some horizontal lines.


    The actual process of detection will work by taking the convolution of a certain
    filter with the original image. When we perform the convolution in Python, outputs
    of that convolution will locate various positions of different features within
    the original image, which will represent our features maps. To convert the feature
    map filters into some concrete models in a CNN, we will use a hierarchy scheme.


    In this scheme, a feed-forward neural network and all its layers containing neurons
    will represent both the feature map and the original image. In contrast, the convolutional
    filters represent a specific combination of different neural network relationships.
    These relationships are replicated throughout the complete input.


    You have to initialize every relationship in that group with identical weights,
    and you should always average the certain weight updates of that collection before
    applying them at the end of every iteration.


    To do more meaningful tasks, you can also create a feature map at some layer that
    will detect various objects or faces. For instance, if you have faces showing
    nose, mouth, and two eyes, you will, in fact, need the data from all of these
    three different feature maps that will be represented at the CNN layers.


    In other words, you can create filters that depend on the volume of data, and
    they still might traverse in various feature maps within a single layer. These
    kinds of relationships can also be captured if you are using a full-fledged neural
    network, which would do just that.


    When you are moving deeper into your convolutional network, you may need to sharpen
    the data contained within your feature map. This is mainly because when a feature
    is presented in a previous layer, it may result in the feature map containing
    a hotspot surrounded by a halo. Therefore, the feature map often may be weakly
    or not completely detected, so you might need to sharpen the data included in
    the layer.


    To achieve this, you will use a technique called max pooling. Using this technique,
    you will divide your feature map into disjoint squares or titles, and then, you
    will take an action that is a maximum of all neurons that are situated at each
    tile. Max pooling for the feature maps is great when it comes to the detection
    process that will be clearer by removing some irrelevant and uninformative halos.


    Max pooling also reduces the total number of parameters in a CNN. Max pooling
    is also used for combating some potential issues in overfitting. If you put all
    these concepts together, you are ready to start working on some more complex computer
    vision problems. For instance, let’s imagine that we have a blood smear from a
    patient, and our main goal is to detect the potential for malaria invasion, as
    well as to diagnose what stage of infection is present in that patient. The stage
    of infection may range from early to late stage.


    There is also the possibility that there is no infection present in the patient.
    You can create CNNs that will contain four layers; this would be followed by classic
    dense feed-forward networks that end in a three-way SoftMax, providing confidence
    in all of these three possible outcomes: early stage, late stage, and no infection
    at all.'
