    and in absence of that, all AI investment will fall flat on its face.


    Why we need executive-level indulgence in AI is because of the following factors.


    ## Cost of investing in AI


    Undoubtedly, financial institutions will reap the benefits of AI, but the cost
    of investing in AI is very high and there are no two ways about it. If costs are
    huge, the stake is high. Half-baked execution will not only dent the bank’s image,
    it will also cost a fortune. AI journey should not be undertaken like injecting
    a suite in the current IT system. Just infusing AI without a strategy will not
    yield the desired results.


    ## Crucial leadership involvement


    According to the recent PwC US supplement to the 21st Annual Global CEO Survey
    2018, US CEOs’ fears over the past five years of losing a technological edge have
    risen sharper than other types of threats. The fear is rational considering the
    leap technological innovations make every day. Banks cannot afford to lag here.
    However, if fear is rational, then rational solutions can help overcome this impediment.
    This clearly calls for a more proactive role from CEOs rather than just assigning
    AI journeys to the CIO or CDOs. It is very important to chart out the AI journey
    rather than just joining the bandwagon. The journey for each bank or financial
    institution will be different. There is no fit-for-all solution in the AI journey.
    And such enterprise-specific roadmaps are what will actually make the journey
    profitable for the bank.


    So, how do banks adopt AI? Some banks have set up an in-house AI division. Singapore-based
    OCBC Bank (Overseas Chinese Banking Corporation Limited) set up an in-house AI
    division in early 2018, while some are collaborating with AI companies who develop
    products for banks.


    ## Inorganic growth'
  trans: '

    让我们来讨论一下银行业的物联网（IoT）。首先，什么是物联网？用通俗的话说，它是机器与机器或设备与设备之间的连接（例如：联网汽车、联网家居、联网商场等）。换句话之，所有的电脑，无论是在家里、商场、银行还是车辆上，都应该相互通信并帮助客户。例如，家庭主妇将不再需要担心本周家里的杂货是否充足。事实上，家用电脑会检测到任何短缺，并通知商场供货，同时联系银行代表客户进行支付。一切都真正实现了自动化。在此过程中，银行将发挥重要作用。它们不仅可以安排支付，还可以根据现成数据，为客户提供针对性的优惠、建议和奖励。


    ## 美国银行：大数据项目


    因此，美国银行正在多个领域使用大数据项目，例如：提高客户留存率、提高财务预测的及时性和准确性等等。


    ## 语音生物识别


    语音生物识别在人们和银行的生活中发挥着重要作用。


    ![](img/9.3.jpg)


    **图 9.3**


    Nuance 公司最近为 BBVA Bancomer 开发了一项语音生物识别应用，旨在通过改进“身份存活验证”流程来加强其养老金体系。这意味着养老金人员只需通过简单的电话即可识别身份，一旦计算机识别出声音，即可作为该养老金人员还世的证明。这对我们的老爷爷老奶奶来说是多么酷，不是吗？


    ## 数字银行


    到目前，我们已经看到了银行业的许多创新，如桌面/移动互联网、金融科技、银行社交媒体、人工智能、机器人、机器学习、区块链和大数据。然而，银行仅关注这些华丽的名称就足够了吗？这就是让银行完全数字化的原因吗？绝对不是。银行首席信息官（CIO）承担着艰巨的任务，即实现前端和后端的整个数字化格局。美国典型的中型银行可能有五百到九百不同的
    IT 应用，与不断变化的技术格局的交互对于 IT 运营来说是一项艰巨的任务。在下一节中，我们将展望可能影响我们数字世界的说明领域。


    ## AI 作为顶层战略


    在全球，高管们日益寻求 AI 创建新的业务价值来源和收入流，或节省成本的机会。这特别适用于顶级的 AI 采用者，即那些已经投资 AI 计划并取得瞩目成效的企业。虽然这是一个少数群体，但他们正在加倍投资
    AI。


    银行业作为一个行业，其竞争对手不仅来自同行，还来自金融科技、移动行业和科技行业。随着技术演进如此迅速，我们真的不确定会有哪个竞争对手加入名单，以及在何时加入。


    银行可以通过淘汰旧技术和投资创新来节省成本。对于任何银行的生存和增长，最重要的标准是增加底线。除了获得市场份额外，银行还考虑削减成本，特别是针对那些单调和重复的任务。在这些任务上浪费人力只会增加业务运营成本。如果我们将银行业与投资银行和资产管理公司相比，它们目前面临着产生阿尔法（alpha）和降低成本的类似困境。对于银行来说，古老的银行时代已经结束，这是一个残酷的事实。基于
    AI 的技术不是会过去的时尚，银行可以选择忽视或视而不见几年，最后发现自己正在衰落，或者本应该更早地向 AI 敞开门。


    银行和金融服务行业的远见领导者可以预见未来并引导机构朝着这一方向发展。AI 的指数级增长不容忽视。这些领导者已经知道，几年后，AI 将成为其系统的组成部分。然而，要取得成功，AI
    战略应该采取自上而下的方法，尽管在决定最佳用例时，它应该采取自下而上的方法。当员工确信 AI 被用作赋能工具而非替代人力劳动力时，这种情况就会发生。这种沟通同样重要，以确保整个组织朝着使
    AI 之程变得值得的目标努力。


    有多少人准备好跨这一步呢？那些在适应 AI 方面已经领先的 CEO 们是否从中获益？这些是目前最重要的问题。


    与任何业务决策一样，AI 应该有一个董事会级别的战略。它要求顶层领导制定战略。AI 并不是银行通常采用的技术之一（这类技术通常没有执行层参与）。如果执行得当，它可以为银行业节省成本。根据关于
    AI 的 Autonomous 报告，到 2030 年，传统金融机构可以节省 22% 的成本。报告指出，银行通过在前端部门采用 AI 可以节省 4,900
    亿美元。


    在压力下，基于高管层通过投资 AI 来降低成本和增加收入，为它的合理性提供了强有力的论据。这需要执行层级的战略，在缺乏战略的情况下，所有的 AI 投资都将失败。


    我们为什么需要执行层对 AI 的投入，是因为以下因素。


    ## 投资 AI 的成本


    毫无疑问，金融机构将获得 AI 的收益，但投资 AI 的成本非常高，这是不容置疑的。如果成本巨大，风险就很高。半吊子的执行不仅会损害银行的形象，还会耗费巨资。AI
    之程不应像向现有的 IT 系统中注入一套插件那样进行。在没有战略的情况下注入 AI 将不会产生预期的结果。


    ## 关键领导层的参与


    根据普华永道（PwC）《第 21 年度全球 CEO 调查》的美国补充报告，美国 CEO 在过去五年对失去技术领先地位的恐惧增长快于其他类型的威胁。考虑到技术创每天的飞跃，这种恐惧是合理的。银行无法在这一方面落后。然而，如果恐惧是合理的，那么理性的解决方案就能帮助克服这一障碍。这显然要求
    CEO 采取更积极的角色，而不仅仅是将 AI 之程分配给 CIO 或首席数据官（CDO）。规划 AI 之程比比随大流重要得多。每家银行或金融机构的历程将是不同的。AI
    之程没有万能的解决方案。而这种企业特定的路线图才是真正让银行在旅程中盈利的关键。


    那么，银行是如何采用 AI 呢？有些银行已经建立了内部 AI 部门。位于新加坡的华侨银行（OCBC）在 2018 年初建立了内部 AI 部门，而另一些银行则与为银行开发产品的
    AI 公司合作。


    ## 无机增长

