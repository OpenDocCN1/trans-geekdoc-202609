- raw: 'An advantage of reinforcement learning is that there’s no limit to the set
    of moves that can be explored as the training algorithm progresses. With supervised
    learning, you are limited to the labeled examples in the training data. For a
    game like chess, even a huge amount of training data, from millions of games,
    will contain only a tiny proportion of all possible moves. This was demonstrated
    very effectively when Google’s DeepMind AI team used two reinforcement algorithms
    to play against each other. Not only did the resulting model outperform the best
    existing chess program at the time, but during the process, the algorithm discovered
    completely new strategies of play, previously unknown to human grandmasters.


    Reinforcement learning has potential, but it does have its weaknesses. One issue
    is that the training algorithm is bound by the speed of the trial-and-error process.
    If a reinforcement algorithm is being trained to make mortgage lending decisions,
    then the time between an action being taken and assessing how successful it was
    could be years. Consequently, the training process will take far too long to be
    of practical use. DeepMind’s chess-playing program needed to play 68 million games
    to become as good as it did. It could only do this by playing against another
    computer, allowing games to be played in a fraction of a second.


    OK, so being superhuman at chess is all well and good, but what are the real-world
    applications of reinforcement learning? I’ve done quite a lot of research, and
    my conclusion is that, although there are lots of interesting articles about how
    great reinforcement learning is, the number of practical solutions based on reinforcement
    learning in use today are pretty small compared to those based on supervised learning.


    One area where reinforcement learning is having an impact is the improvement in
    the efficiency of control systems in uncertain or chaotic environments. Complex
    systems such as power plants, heating systems, and server farms have lots of controls
    that are adjusted to manage different parts of the system. The relationship between
    the controls and system performance isn’t always obvious. It’s not a simple case
    of one control impacting just one parameter; everything is interconnected. Tweaking
    the water pressure in the cooling system to improve turbine performance has a
    negative impact on the efficiency of a transformer further down the line. Just
    like the chess problem, where there are almost infinite number of possible games
    that can be played, in a power plant, there are almost infinite number of combinations
    of control settings. Reinforcement learning finds better ways of setting the controls
    through trial and error, to optimize the overall efficiency of the system. This
    mirrors the way an experienced engineer uses their knowledge and intuition, learnt
    over many years of practice, as to what the system-wide effects of tweaking different
    controls are likely to be.


    Another area where reinforcement learning shows promise is robotics. It can be
    used to train robots to carry out complex manual tasks that could previously only
    be undertaken by a trained person. A robotic device is given the task of doing
    something like pulling pints, sorting parts, or stacking shelves. Through a process
    of trial and error, they can potentially learn to do this very effectively.


    # [Types of neural networks in AI](#toc.xhtml#s84a)


    As discussed before, the main components of a neural network are input layers,
    output layers, and hidden layers. Hidden layers are present between the input
    and output layers that define the relationships between the data and also help
    machine learning models to generate data insights and predictions in a better
    way. Neural networks are associated with deep learning because of the forward
    and backward propagation of data within the tiers.


    Here is a brief description of the major types of neural networks.


    # [Feed-forward neural networks](#toc.xhtml#s85a)


    The feed-forward neural networks are the base version of a neural network, and
    they have the responsibility to pass data through different input nodes. For the
    data to reach the output node, the process is repeated multiple times and it has
    the power to process large amounts of data without any interruption. Further,
    feed-forward neural networks are used in the development of major AI technologies
    such as computer vision and facial recognition. As compared to other types of
    neural networks, feed-forward neural networks are simple to operate and yield
    effective results.


    # [Recurrent neural networks](#toc.xhtml#s86a)


    Recurrent neural networks have the capability to save the output from processing
    nodes and return the results back to the model. Since they are complex in comparison
    to feed-forward networks, data scientists and machine learning engineers use this
    type of neural network to solve complex problems. Each node in the recurrent neural
    network model is considered as a memory cell and is responsible for completing
    the implementation and continuity of operations.


    The process of data handling includes the reuse of outputs, and in case the network
    is unable to deliver correct inputs, the system starts to learn on its own and
    continues to provide accurate predictions during the backpropagation.


    # [Convolutional neural networks (CNNs)](#toc.xhtml#s87a)


    CNNs use different perceptrons and have more than one layer connected with each
    other. Further, these layers are responsible for creating future maps on information
    related to data so that it could be further broken down for non-linear processing.
    CNNs are mostly used for the development of advanced AI applications such as text
    digitization, facial recognition, and NLP.


    Deconvolutional networks work completely opposite of CNNs. They are supposed to
    find lost signals or features that are ranked as unimportant by a CNN.


    # [Modular neural networks](#toc.xhtml#s88a)


    Modular neural networks have multiple neural networks that work separately from
    each other. Moreover, the networks do not communicate in any case and never interfere
    in the activities of other neural networks.


    # [Benefits of using artificial neural networks](#toc.xhtml#s89a)


    Artificial neural networks are best suited to store information through the entire
    network and have parallel processing abilities as well. This makes it easier for
    artificial neural networks to perform multiple tasks simultaneously without compromising
    on performance and efficiency. Moreover, they have the ability to model complex
    relationships and learn from nonlinear data sets by defining relationships between
    the input and output data. Artificial neural networks do not have any restrictions
    for input variables, and they can be distributed in different patterns as well.


    Artificial neural networks are widely implemented in the development of various
    AI and machine learning models. Popular neural network applications are language
    generation, translation, and NLP systems. Chatbots, stock market prediction, route
    planning, and optimizing systems are also developed using neural networks.


    # [Gradient boosting algorithms](#toc.xhtml#s90a)


    Gradient boosting relies on one premise—a weak learner can improve. As Michael
    Kearns said in his “Hypothesis Boosting Problem,” it is the pursuit of turning
    a poor hypothesis into a very good one.


    Gradient boosting algorithms come in different forms.


    # [GBM](#toc.xhtml#s91a)


    GBM is used when there is a huge amount of data to deal with. Boosting produces
    a number of learning algorithms made up of predictions from different base estimators.
    These, in turn, will trigger improvements on a single estimator. It puts together
    a mix of weak to average predictors in an effort to create a strong predictor.


    # [Light GBM](#toc.xhtml#s92a)'
