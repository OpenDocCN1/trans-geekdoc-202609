    \n*   **Unstructured:** This type of data has no real structure, such as natural\
    \ language text or audio streams.\n\nClearly, the most useful data is structured\
    \ data because it is ready for immediate manipulation. As a rule, only around\
    \ 20% of the total data is represented by structured data, while the remaining\
