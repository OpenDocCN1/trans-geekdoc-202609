    \ expenses by implementing machine learning models. What’s more, artificial intelligence\
    \ and machine learning algorithms work in collaboration to analyze historical\
    \ data and ensure workflow visualization.\n* **Fraud detection:** Machine learning\
    \ models are best suited for detecting spam and fraud. Spam filters are now designed\
    \ by using the latest artificial intelligence and machine learning algorithms\
    \ that include neural network rules for detecting phishing messages and spam.\n\
    \n  Major search engines such as Google and Bing work perfectly because the system\
    \ is programmed to learn the ranking of pages and eliminate spam in real time.\
    \ They are powered by effective machine learning algorithms. Also, there is a\
    \ specific number of spam filtering approaches that are used by email clients\
    \ to make sure that these spam filters are regularly updated.\n\n  To perform\
    \ such activities, a rule-based spam filtering approach is considered along with\
    \ multi-layer perceptron and decision tree induction. Furthermore, system security\
    \ programs that are designed using artificial intelligence and machine learning\
    \ algorithms understand the coding pattern and stop fraudulent activities before\
    \ they can cause any problems. It is predicted that online credit card fraud will\
    \ reach a worth of $32 billion in 2020. So, this is a serious issue that must\
    \ be solved quickly.\n\n  Fraud detection is one of the major applications of\
    \ machine learning that helps make online transactions safer. The number of transactions\
    \ from credit cards, debit cards, UPI, numerous wallets, and smartphones has been\
    \ increasing with time and has also been a major target for online criminals.\
    \ To make online transactions smooth and safe, the machine learning model thoroughly\
    \ investigates the processes and searches for suspicious patterns. This approach\
    \ in machine learning is also known as the classification problem and is handled\
    \ in real time.\n\n* **Image recognition:** Image recognition, also known as computer\
    \ vision, involves machine learning, data mining, and database knowledge for discovery.\
    \ Having the ability to produce symbolic and numeric information from high-dimensional\
    \ data and images, the approach is widely used in various industries such as automobiles\
    \ and health care. Moreover, image recognition helps in detecting criminals or\
    \ suspected persons in real time.\n* **Dynamic pricing:** Setting a fixed price\
    \ for a service or a product is considered a traditional means of trading. Nowadays,\
    \ pricing strategies are based on objectives and targets for which different kinds\
    \ of promotions and discounts are given. Services such as air tickets or cab fares\
    \ are dynamically priced depending upon various external scenarios such as traffic\
    \ or the number of passengers.\n\n  Artificial intelligence is now able to track\
    \ buying trends and provide pricing solutions for determining competitive product\
    \ prices. Further, machine learning algorithms are implemented to predict accurate\
    \ service rates depending upon load and user demands.\n"
  trans: "\n\n统计学中的一个常见问题是假设检验以及识别数据遵循的概率分布。这使得统计学家能够为未知的数据集预测参数。假设检验是机器学习中许多统计学概念之一。机器学习中使用的另一个统计学概念是根据样本值预测函数值。此类问题的解决方案都是机器学习的实例，因为这些问题使用历史（过去）数据来预测未来事件。统计学是机器学习中一个至关重要的部分。\n\
    \n# 大脑建模\n神经网络与机器学习算法密切相关。科学家们建议，可以使用带有加权输入的非线性元素来创建神经网络。目前正在进行广泛的研究以评估这些元素。\n\
    \n# 自适应控制理论\n自适应控制理论处理帮助系统适应变化并继续保持最佳性能的方法。其核心思想是系统应该预见变化并据此进行修改。\n\n# 心理建模\n\
    多年来，心理学家一直试图理解人类的学习。EPAM（电子试点活动与警觉监测器）网络是一种常用于理解人类学习的方法。当机器提供一个函数时，该网络用于从数据库中存储和检索词汇。近期，心理学研究受到了人工智能的影响。心理学的另一个方面——强化学习，在近期得到了广泛研究，这一概念也被应用于机器学习。\n\
    \n# 人工智能\n如前所述，机器学习很大程度上涉及人工智能（AI）主题。人工智能的研究侧重于利用类比进行学习，以及过去的经验如何帮助预测和适应未来事件。近年来，研究侧重于为使用归纳逻辑编程和决策树方法的系统设计制定规则。\n\
    \n# 进化模型\n进化中的一个常见理论是，动物倾向于学习如何更好地适应环境以增强其性能。例如，早期人类开始使用弓箭来保护自己免受比他们更快、更强的捕食者的侵害。对于机器而言，学习和进化的概念可以相互等同。因此，用于解释进化的模型也可以用于设计机器学习技术。利用进化模型开发出的最著名的技术是遗传算法。\n\
    \n# 结论\n在本章中，我们讨论了机器学习的优缺点，以便对整个现象有一个清晰的认识。\n\n在下一章中，我们将学习机器学习的应用。\n\n# 第 15 章\n\
    # 机器学习在其他行业的应用\n\n## 引言\n我们正处于机器学习应用上升趋势的中心。机器学习已应用于自动驾驶汽车、个性化银行服务、客户支持查询、推荐引擎、LinkedIn\
    \ 推荐等，且列表仍在继续。\n\n## 结构\n在本章中，我们将涵盖以下主题：\n* 机器学习的通用应用。\n\n## 目标\n学习本章后，你应该能够做到以下点：\n\
    * 详细理解机器学习的通用应用。\n\n## 机器学习的通用应用\n* **财务分析：** 机器学习用于对拥有大量准确且定量历史数据的公司进行财务分析。由于它已被用于算法训练、投资组合管理、欺诈检测和贷款承保，未来的机器学习应用可能包括用于客户服务的机器人、情感分析和安全防护。机器学习模型通过经验学习，并使用数据以更好的方式对未来进行财务预测。\n\
    * **预测性维护：** 纠正和预防性维护是制造业的主要部分。虽然使用传统方法进行这一过程既复杂又昂贵，但机器学习现在更容易从工厂数据发现发现有见解和隐藏模式。由于这一过程有助于降低与意外故障相关的风险，公司还可以通过实施机器学习模型来减少不必要的支出。此外，人工智能和机器学习算法协作分析历史数据并确保工作流的可视化。\n\
    * **欺诈检测：** 机器学习模型最适合检测垃圾邮件和欺诈。垃圾邮件过滤器现在使用最新的人工智能和机器学习算法设计，其中包括用于检测钓鱼邮件和垃圾邮件的神经网络规则。\n\
    \n  谷歌和 Bing 等主流搜索引擎之所以完美运行，是因为系统被程序化为学习页面排名并实时消除垃圾邮件。它们由有效的机器学习算法驱动。此外，邮件客户端还使用了特定数量的垃圾过滤方法，以确保这些垃圾过滤器得到定期更新。\n\
    \n  为了执行此类活动，基于规则的垃圾邮件过滤方法与多层感知器和决策树归纳被共同考虑。此外，使用人工智能和机器学习算法设计的系统安全程序可以理解编码模式，并在欺诈活动引起任何问题之前将其拦截。据预测，2020\
    \ 年在线信用卡欺诈的金额将达到 320 亿美元。因此，这是一个必须快速解决的严重问题。\n\n  欺诈检测是机器学习的主要应用之一，有助于使在线交易更安全。来自信用卡、借记卡、UPI、众多钱包和智能手机的交易数量随着时间的推移而增加，也是在线犯罪分子的主要目标。为了使在线交易顺畅安全，机器学习模型会彻底调查过程并搜索可疑模式。机器学习中的这种方法也被称为分类问题，并进行实时处理。\n\
    \n* **图像识别：** 图像识别也称为计算机视觉，涉及机器学习、数据挖掘和用于发现的数据库知识。由于能够从高维数据和图像产生符号和数值信息，该方法被广泛应用于汽车和医疗保健等各个行业。此外，图像识别有助于实时检测犯罪或嫌疑人员。\n\
    * **动态定价：** 为服务或产品设定固定价格被认为是传统的交易手段。现在，定价策略基于目标和指标，并据此提供各种促销和折扣。机票或出租车费等服务根据交通或人数等各种外部情况进行动态定价。\n\
    \n  人工智能现在能够跟踪购买趋势，并为确定竞争性产品价格提供定价解决方案。此外，实施机器学习算法以根据负载和用户需求预测准确的服务费率。\n\n"
