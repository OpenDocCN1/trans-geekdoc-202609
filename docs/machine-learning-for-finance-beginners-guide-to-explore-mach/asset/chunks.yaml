    The systems themselves will also get better at automatic learning and pattern
    recognition, about what you want to see. This will enable them to spot outliers
    and changes in trends and other interesting data. Today, they must be spotted
    by a human being.


    ### Wild visualizations

    Charts and graphs have been around for a long time. And there’s a reason for that:
    they’re good at conveying meaning in an easy-to-grasp way.


    But again, they were developed as a way to understand much smaller amounts of
    data than we’re looking at now. New ways of looking at data—and especially interacting
    with it—are being developed. Right now, we’re seeing the first wave of this, where
    designers are trying out different techniques, and some work while some don’t.
    Things like infographics, interactive web pages, and some of the newer intelligence
    tools are examples of trying new techniques of looking at data.


    We expect to see this trend accelerate. And as the field becomes more popular
    and more vital to the world economy, the brains and time spent on this problem
    will lead to breakthroughs in new ways to look at and understand data.


    ### Self-service intelligence

    The ability to use analytics will no longer be a specialized skill, and we already
    see it happening in the case of data discovery tools. It will be a common and
    everyday thing for executives down the line when they use it as part of their
    daily and hourly workflow. We’ve seen how this is playing out through IBM’s Watson,
    and it will be especially pervasive in the knowledge industry.


    This is slightly counterintuitive; the amount of data being used is growing by
    the day, and yet the tools will be simpler? Yes, that’s right.


    For example, the days of calling for a vital KPI and having to wait ages, if not
    days, for the IT department to dig out the report are gone. Self-service intelligence
    places the details in the control of the customer.


    Data can be viewed on the fly for real-time analyses and instantly actionable
    perspectives, offering the staff a strategic edge.


    As the amount of data increases, it is forcing a complete reevaluation of the
    current intelligence tools. The complex user interfaces with miles of toolbars
    and byzantine menu systems are no longer adequate—they were built for a world
    with much less data.


    Which brings us to the new types of interfaces that are needed: `Sisense`, `Zoho
    Reports`, `Microsoft BI`, `Tableau Desktop`, `Tibco Spotfire`, `Alteryx Analytics`,
    and `Salesforce Einstein Analytics`.


    ### Natural and intuitive interaction with data

    Business intelligence is one of the last bastions of enterprise-y software simply
    because of its complexity. You know you’re using business intelligence software
    if half the screen is taken up by menus and a passerby would have no idea what
    you’re looking at.


    Natural interfaces such as touch, voice, and gestures abstract away the complexity.
    The more intuitive a functionality is, the more productive a user can be because
    they won’t have to learn how to use it. When you can literally ask the question
    “What demographic should I focus on to increase sales?” you can find valuable
    information without training or expert help.


    Apple did the world a great service by training people to use touch and coming
    up with intuitive—and, now, universally accepted—touch gestures. Apple’s `Siri`
    is important because it is training people to use voice. Microsoft’s `Kinect`
    is important because it’s training people to use body gestures. All of these modes
    of input combined create an interactive environment that lets you play with your
    data—explore it and interact with it.


    You will think with your eyes and follow your nose to the data you’re looking
    for, even if you’re not sure of the right question to ask.


    Data will be fun.


    ### Collaborative

    A few years ago, you couldn’t escape “collaboration” as a buzzword. The idea was
    that, by enabling people to work together, you freed them to pool their creative
    and mental resources, hopefully, of course, resulting in a synergistic explosion
    of ideas and good decisions.


    The collaboration was, in a sense, a way to deal with a lot of data—big data—before
    big data got really big. It was crowdsourced report hunting, basically. Unfortunately,
    the amount of data that needs to be evaluated is simply too big even for large
    numbers of people to efficiently looking at.


    The new types of interfaces (as explained above) will alleviate that problem.
    But there was a core value in collaboration that doesn’t go away just because
    it’s no longer “the new black.” Two heads are still better than one if they’re
    in the right place at the right time.


    When tools allow people to use intuitive interfaces to not only explore their
    data and discover from it, but also to allow more than one person to do this at
    the same time, the results will be nothing short of magical. Imagine being able
    to look at data in interesting ways, exploring it, and sharing what you’re looking
    at in real time with colleagues from around the world: igniting conversations.
    Enabling people to work on the same thing but giving them the freedom to explore
    independently gives you the best of both worlds.


    But when?


    Most of these changes will happen within the next three to five years. Some of
    them are happening already. But all signs point to a type of inevitability for
    them—they are at the intersection of two trends driving our society towards a
    new type of information consumption, one that’s very different from what we have
    today.


    # Structured and unstructured data

