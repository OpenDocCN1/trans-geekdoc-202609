- raw: 'The speculation in securities is called day trading. More specifically, it
    refers to buying and selling financial instruments on the same trading day. Strictly
    speaking, it is a trading event within one day. It means that all positions are
    closed when the market is closed for the day. The day traders look at identifying
    the entry and exit positions on the shares with favorable conditions. These conditions
    yield various small-term gains that can add up to large gains.


    If there are people on the market who can recognize favorable patterns in the
    market, we can even train a machine to perform in the same way. This is the purpose
    of using machine learning for day trading. But first, we need to identify the
    strategies that day traders use to signal market entry conditions. The technique
    is split into two processes: first is a high-level pattern description, and the
    second is machine learning.


    In the first process, input semantics are identified, which occurs for potentially
    hundreds of predefined strategies. This is done using robust and highly scalable
    pattern matches, such as Apache Flink. Once a data cartridge has been activated,
    we can go through the historical data and find the past cases where cartridges
    were activated and what the outcome price was after ten or twenty minutes. We
    can generate a training example for the algorithms using machine learning to create
    probability distribution over previous entries.


