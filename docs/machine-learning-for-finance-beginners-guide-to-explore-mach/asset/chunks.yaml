- raw: 'A hybrid of LASSO and cam regression methods is known as “elastic net regression.”
    The main aim is to further improve the accuracy of the predictions generated by
    the LASSO regression technique. Elastic net regression rewards smaller coefficient
    values. All three of these designs are available in the R and Python glmnet suite.


    Bayesian regression models are useful if there is insufficient data or if the
    available data is poorly distributed. These regression models are developed from
    probability distributions rather than data points, which means that the resulting
    graph will appear as a bubble curve representing the variance with the most common
    values in the center of the curve. The dependent variable Y in Bayesian regression
    is not valuation but a probability. Instead of predicting a value, we try to estimate
    the probability of an event. This is considered frequentist statistics, and are
    based on the Bayes theorem. Frequentist statistics assume whether an event will
    occur and the likelihood that it will recur in the future.


    Conditional opportunity is an integral part of frequentist statistics. It refers
    to the events on which the results are interdependent. Events can also be conditional,
    meaning the previous event can change the probability of the next event. Let’s
    say you have a box of M&M’s, and you want to know the likelihood of getting different
    colored M&M’s out of the bag. If you have a set of three yellow M&M’s and three
    blue M&M’s, and you get a blue M&M on your first draw, chances you will get a
    blue M&M on your next draw out of the box would be lower than the first draw.
    This is a classic example of conditional probability. On the other hand, an independent
    event is the flip of a coin, meaning that the preceding coin cover does not change
    the probability of the next coin cover. Therefore, a coin flip is not an example
    of conditional probability.


    # [Linear regression](#toc.xhtml#s259a)


    Linear regression is applied when you need to come up with an actual set of values
    based on continuous data. Basically, it involves drawing a clear line where a
    correlation between dependent and independent variables is considered.


    In linear regression, the equation Y = a\*X + b is used where Y is the dependent
    variable, a is the slope, X is the independent variable, and b is the intercept.


    To make this concept easier to understand, here’s an example. You were asked to
    arrange a group of people according to their weight without really knowing their
    actual weights. You do, however, know what their heights are, and you can also
    visibly see each person’s individual body build. Using these parameters, you can
    come up with a way to arrange the group that would probably yield accurate or
    near-accurate results.


    Linear regression has two types: simple and multiple. Simple linear regression
    only involves one independent variable, while multiple linear regression involves
    two or more independent variables.


    # [Logistic regression](#toc.xhtml#s260a)


    Although there is such a thing as a regression algorithm, this is not at all related
    to that. Logistic regression actually deals with binary values (yes or no, true
    or false, 0 or 1) using independent variables as a basis. It uses the logit function
    to measure the probability of a certain event. Because it involves probability,
    it is only expected that the output would lie anywhere between 0 and 1.


    If your friend gives you a puzzle, you can only expect two outputs: either you
    solve it or you don’t. Now, what if you are given a number of different puzzles
    to see which areas you’re good at; this is where logistic regression can be applied.


    Let’s say one of the puzzles given to you is a riddle commonly given to school-aged
    children. Then you would probably have an 80% chance of solving it. What if you
    were given a cryptic puzzle that only an expert can solve? Then logistic regression
    would probably tell you that you only have a 20% probability of solving it. Basically,
    coming up with these numbers involves choosing parameters that aim to observe
    the values being used as a sample instead of looking at the sum of squared errors.


    Logistic regression also helps answer the common questions we use in data science
    as examples: How does the probability of getting lung disease (yes vs. no) change
    for each additional pound a patient is overweight and for each pack of cigarettes
    consumed every day? Do calorie intake, fat intake, body weight, and age have effects
    on the probability of having a stroke (yes vs. no)? As we see, these questions
    have a certain level of complexity, and logistic regression can offer a solution.
    Applied in business, it is a powerful tool for organizations to solve complex
    questions about trends and business patterns.


    Let’s explore another example of application of logistic regression by analyzing
    the following plot. We see all data points have either the value 0 (fail) or 1
    (pass). We also can observe that the logistic fit is the S-curve, which models
    the probability of success as hours of study function. By analyzing the plot,
    we can conclude that most of the students who studied less than four hours failed
    the exam. However, for students who studied four hours, the model predicts that
    the probability of passing will be around 70%. As we see on the plot, the S-curve
    is a side effect of how the logistic regression estimates the probability of a
    different event. This is an example of the type of relevant information logistic
    regression can provide us with:


    ![](images/18.2.jpg)


    **Figure 18.2:** Logistic Regression: Tests passed related to hours studied (Source:
    Cerebro MLAI)


    A critical point to comprehend logistic regression is related to probability.
    It is crucial to understand that they are between 0 and 1, and, contrary to linear
    regression, the values we get from the model don’t offer us direct predictions
    for the values we are observing. Instead, by observing X = 4, the model shows
    us that we can expect around 70% of chances of passing in the test.


    Compared to logistic regression, linear regression works on the data well, and
    it can forecast the value of a result fairly well only by being aware of the value
    of the predictor variable. Some data scientists get confused about the differences
    between the concepts and applications of linear regression and logistic regression.
    Understanding these differences is crucial to offer customers and organizations
    support in their decision-making process.


    # [k-means clustering](#toc.xhtml#s261a)


    One of the most widely and extensively used clustering algorithms is the k-means
    algorithm. The “k” in its name relates to the fact that the algorithm looks for
    a fixed number of clusters that are identified in terms of data point proximity
    to one another. The version listed here was published first by *J. B. MacQueen*
    in 1967. The technique is demonstrated using two-dimensional diagrams for ease
    of clarification. Note the algorithm typically manages far more than two independent
    variables in operation. This implies that, instead of points corresponding to
    vectors with two elements (X1, X2), the points correspond to vectors with n elements
    (*X1, X2 … Xn*) In itself, the process is unchanged.


    # [Three steps of the k-means algorithm](#toc.xhtml#s262a)


    The k-means algorithm randomly selects k data points to be the seeds (a seed is
    an embryonic cluster with one element in it) in the first step. MacQueen’s algorithm
    simply takes records of the first k points. In cases where the records have some
    significant order, selecting widely spaced records or a random collection of records
    might be preferable. This example sets Cluster Number to 3. The latter step assigns
    each record to the nearest seed. One way to do that is to find the boundaries
    between the clusters, as geometrically shown below. The boundaries between the
    two clusters are the points from which each cluster is equidistant.


    ![](images/18.3.jpg)


    **Figure 18.3**'
