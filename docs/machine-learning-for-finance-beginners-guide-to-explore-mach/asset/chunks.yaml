- raw: "Reinforcement learning involves building a model by letting the algorithm\
    \ explore the system of observations on the basis of the defined rewards, make\
    \ mistakes, and try over and over again. The approach is very similar to what\
    \ organizations do when they set policies to support innovation, even more so\
    \ because reinforcement learning seeks to maximize rewards over the long term.\
    \ Although it requires large amount of data to be effective, reinforcement learning\
    \ has been used to develop many wildly successful game-playing Ais, and it addresses\
    \ a different type of the problem than the other machine learning approaches.\n\
    \nReinforcement learning involves learning the data used to give feedback that\
    \ will determine how the model adjusts to the prevailing conditions in order to\
    \ achieve the target. The system on its own is able to evaluate the model performance\
    \ on the basis of the feedback provided and then make necessary adjustments. For\
    \ instance, the concept is aptly applied in self-driving cars (AI) and also in\
    \ chess master algorithms.\n\nReinforcement learning as indicated above occurs\
    \ in an interactive environment. In other words, the learner is in no way taught\
    \ what to expect but finds out on their own according to the consequences of their\
    \ actions, a concept known as goal-oriented learning. The major reinforcement\
    \ learning components that we will cover in this section are listed below:\n\n\
    *   Fundamentals of reinforcement learning.\n\n*   Reinforcement learning algorithm.\n\
    \n*   Reinforcement learning environment.\n\n*   Various reinforcement learning\
    \ platforms.\n\n*   Applications of reinforcement learning.\n\n# [Fundamentals\
    \ of reinforcement learning](#toc.xhtml#s117a)\n\nAssume we want to train a dog\
    \ how to catch an object thrown into the air. The dog may not necessarily understand\
    \ all the concepts and theories involved here. The best way to accomplish this\
    \ is to throw the object in the air, and every time the dog catches it, be ready\
    \ to reward it. If the dog fails, then there is no reward. The dog will eventually\
    \ analyze what actions transpired until it was rewarded. The reward will motivate\
    \ the dog to repeat the same actions for more and more rewards.\n\nLikewise, in\
    \ the reinforcement learning environment, you may be able to teach the model what\
    \ to do, but based on positive rewards, the model will tend to repeat certain\
    \ actions. The agent or the model is more responsive to positive rewards and forgets\
    \ actions that led to negative rewards.\n\nSometimes, we have scenarios of delayed\
    \ rewards or rewards that are only given out when the task is done. There might\
    \ be rewards or no rewards at each step just to confirm if there are mistakes.\n\
    \nAssume you are to teach a robot on how to navigate without hitting a mountain:\n\
    \n![](images/8.1.jpg)\n\n**Figure 8.1**\n\nOne rule would be to take away 10 points\
    \ when the robot hits a mountain and gets stuck. This way, the robot will understand\
    \ that, whenever it hits a mountain, there is a negative reward and therefore\
    \ will not hit the mountain again:\n\n![](images/8.2.jpg)\n\n**Figure 8.2**\n\n\
    The other rule would be to give the robot 20 points each time it navigates in\
    \ the right direction. Of course, the robot must try to maximize the rewards by\
    \ remaining on the right path:\n\n![](images/8.3.jpg)\n\n**Figure 8.3**\n\nThe\
    \ model, or the robot, can apply two basic concepts of reinforcement learning\
    \ to navigate smoothly and get more rewards. The reinforcement learning model\
    \ can decide to explore different possibilities so as to get more rewards. And\
    \ in this case, there is a higher possibility that the agent will poorly perform\
    \ since it might utilize the wrong cautions. The other way is to exploit only\
    \ the previous actions that resulted in positive rewards. When the model follows\
    \ the path of exploiting only the known previous actions, there is a greater possibility\
    \ of it missing out on the best actions though it will receive rewards. And unfortunately,\
    \ it is impossible to perform both exploration and exploitation at the same time.\n\
    \n# [Agent](#toc.xhtml#s118a)\n\nAn agent basically is a software program that\
    \ is capable of making intelligent decisions and is a learner in reinforcement\
    \ learning. They make decisions and act according to the environment of interaction,\
    \ plus rewards that follow:\n\n*   **Agent–environment interface:** Being intelligent\
    \ software, the agent is able to perform a function at time, *t*, and then move\
    \ from state *At* to the next state labeled *At+1*. Again, according to the action,\
    \ the agent is given reward R.\n\n*   **Model:** This represents the agent’s learning\
    \ environment. The learning here can be either through model-based or model-free\
    \ learning. For model-based learning, the agent is free to exploit all the previously\
    \ learned information before making a decision. In model-free learning, on the\
    \ other hand, the agent entirely relies on trial and error to perform the required\
    \ action. For example, when you want to move to college from home, you either\
    \ use the foreknowledge of the routes to college or just try different routes\
    \ and finally choose the fastest method.\n\n*   **Policy function:** A policy\
    \ basically is what controls how the agent behaves in the environment. The behavioral\
    \ nature of the agent depends on the type of policy it is operating under. From\
    \ our previous example about getting to college from home, the various routes\
    \ represent the different possible policies. Some routes may be very short, while\
    \ others are long. The routes are called policies since they are the guidelines\
    \ towards achieving your ultimate goal. The symbol is always used to denote a\
    \ policy.\n\n    Most policies are always represented in a lookup table or as\
    \ a complex search process.\n\n*   **Value function:** There is always a value\
    \ function for each and every state of the agent. This function indicates how\
    \ profitable it is for the agent to be located in a particular state. The function\
    \ is dependent on the policy and is denoted by v(s). The value function represents\
    \ the total expected rewards received by the agent right from the initial state.\
    \ The various types of value functions are as follows: \n\n    *   **Optimal value\
    \ function:** Gives the highest value for all states when compared to the other\
    \ value functions. And thus, it is the optimal policy that has the optimal value\
    \ function.\n\n    *   **Stationary policy:** This kind of policy involves action-distribution\
    \ returns that are entirely dependent on the last two states visited by the agent.\n\
    \n    *   **Deterministic stationary policy:** This is a policy that can deterministically\
    \ select an action of the agent on the basis of its current state.\n\n# [Algorithms\
    \ for control learning](#toc.xhtml#s119a)\n\nVarious reinforcement learning algorithms\
    \ are discussed below:\n\n*   **Criterion for optimality:** A learning agent is\
    \ expected to make mistakes during its first moments of getting into the environment.\
    \ So, the agent is supposed to receive discounted rewards if it is to achieve\
    \ optimal goals. The policy set here should be one that expects a minimum return\
    \ from the agent itself. There are three policies that are totally involved in\
    \ obtaining optimality: optimal policy, deterministic stationary policy, and stationary\
    \ policy.\n\n*   **Brute force:** This reinforcement learning algorithm includes\
    \ the following processes:\n\n    *   For any possible policy there are sample\
    \ returns accrued to it.\n\n    *   The policy with the highest expected returns\
    \ is selected.\n\n    There are various issues with this algorithm. The number\
    \ of policies can be extremely large and therefore difficult to manipulate. Another\
    \ possible issue would be a difficulty in dealing with a policy of varied returns.\
    \ Imagine a policy with such a large variation on its returns. Getting the average\
    \ value of returns per policy may be tedious at times."
