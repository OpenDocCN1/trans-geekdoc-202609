- raw: "     **Ans.** Quantum computers store memory using qubits instead of bits,\
    \ which allows them to exceed the potential of traditional computers. Quantum\
    \ computers use quantum-mechanical phenomena, which allow these computers to perform\
    \ simulations that classical computers cannot. Quantum computers first appeared\
    \ about twenty years ago, and some experts believe that we are only a few years\
    \ away from quantum computers becoming online. If we see artificial intelligence\
    \ as being a program that knows how to think, behave, and learn, then quantum\
    \ computing is the brain that powers these essential motivations. For this reason,\
    \ some in the scientific community perceive that the real danger is not artificial\
    \ intelligence but quantum computers.\n\n19.  **What is the Turing test?**\n\n\
    \     **Ans.** Turing test was a concept created by British computer scientist\
    \ Alan Turing in 1950. Although there are different forms of the Turing test,\
    \ and even some disagreement about what should or should not be considered a true\
    \ Turning test, this type of test can be thought of as answering the question\
    \ of whether a machine is capable of thinking like a human being.\n\n     The\
    \ Turing test follows a basic format. There are three actors in an interrogation,\
    \ two of which are human and one is a computer. If a human being cannot tell the\
    \ computer from the other human being, then the computer has successfully begun\
    \ to think like a human being. In its basic form, this interrogation features\
    \ a human interrogator reading answers generated by a human being and by a computer.\
    \ In a way, a Turing test seeks to determine if a computer can mimic a human being\
    \ rather than if it has the intellectual capacity of human beings.\n\n20.  **What\
    \ is the Voight-Kampff test?**\n\n     **Ans.** The Voight-Kampff test is the\
    \ version of the Turing test explored in the movie “Blade Runner.” In this movie,\
    \ artificially intelligent beings were shown to become so advanced that they are\
    \ virtually indistinguishable from humans. This test, like the Turing test, involves\
    \ the response of the subject to questions, but several measures are used to determine\
    \ the emotional response, including pupillary dilation response. The existence\
    \ of the Voight-Kampff test implies a future point where human beings will have\
    \ difficulty being able to tell artificially intelligent agents from humans, therefore\
    \ requiring advanced tests to make the distinction.\n\n# [Conclusion](#toc.xhtml#s276a)\n\
    \nBy now you should be able to apply various machine learning algorithms for supervised\
    \ learning, unsupervised learning, and reinforcement learning. This knowledge\
    \ is beneficial when you want to explore other problems regarding machine learning.\
    \ Having said that, it is important to give you some more words of advice, especially\
    \ on how to approach a problem regarding machine learning.\n\n# [Approaching a\
    \ machine learning problem](#toc.xhtml#s277a)\n\nOne must be very orderly especially\
    \ when approaching a machine learning problem for the first time. Endeavor to\
    \ answer the following questions:\n\n*   What and how do I measure for my working\
    \ model (e.g., a fraud prediction model)?\n\n*   Do I have the knowledge to evaluate\
    \ a specific algorithm?\n\n*   What is the final implication (businesswise or\
    \ academically) of my model in case I am successful?\n\n# [Humans in the loop](#toc.xhtml#s278a)\n\
    \nIdentify and assign roles for each and every human participant in your model\
    \ appropriately.\n\nMove from prototype to production.\n\nBuild prototypes using\
    \ the library features of `scikit-learn`, and engage a production team who should\
    \ be working with programming languages such as Python, R, Go, Scala, C#, C++,\
    \ and C.\n\n# [Testing production systems](#toc.xhtml#s279a)\n\nBefore you release\
    \ your product into the market, make sure you carry out proper testing to ascertain\
    \ whether your product is working properly. It is in this phase that you can identify\
    \ various faults and even points of improvement.\n\n# [Next step](#toc.xhtml#s280a)\n\
    \nThis book provides such a perfect illustration of machine learning that, at\
    \ the end of it, you expect to be a machine learning expert. However, if you need\
    \ more information, feel free to consult other literature about those concepts\
    \ that may not be very clear to you. Some good books may include *The Elements\
    \ of Statistical Learning by Friedman et al.,* and *Machine Learning: An Algorithmic\
    \ Perspective by Stephen Marsland.*\n\n# [Machine learning packages](#toc.xhtml#s281a)\n\
    \nCurrently there are a number of machine learning packages in the market that\
    \ are meant to boost your understanding of various algorithms. Some of the most\
    \ common packages are `scikit-learn` (most interactive and obviously favorite),\
    \ `statsmodels` package, vowpal wabbit (vw), and finally `mllib` (a Scala library\
    \ built on Spark).\n\nUse recommender systems and other kinds of machine learning\
    \ systems to identify the best of the best. Also carry out probabilistic modeling,\
    \ probabilistic programming, and interfacing to increase your knowledge of machine\
    \ learning algorithms. Other highly recommended topics, though very complex, would\
    \ be neural networks, data scaling, and deep learning.\n\nIt is my hope that you\
    \ are now convinced about machine learning as the new niche for building new applications\
    \ and objects (project manipulation). Keep digging into this new area and never\
    \ give up; a lot more is yet to come.\n\nMachine learning is an active research\
    \ subject, in particular, artificial neural networks. Nowadays, machine learning\
    \ is used in every domain, such as marketing, health-care systems, banking systems,\
    \ stock market, and gaming applications, among others. This book’s objective is\
    \ to provide a basic understanding of the major branches of machine learning,\
    \ as well as the philosophy behind artificial neural networks.\n\n# [Where do\
    \ we go from here?](#toc.xhtml#s282a)\n\nWe have already established how wonderful\
    \ machine learning is and what it can do today. What’s even more amazing is what\
    \ it will be able to do in the future. Yes, the future looks very bright for so\
    \ many reasons. Of course, there are many predictions (probably created by machine\
    \ learning) of what we can expect, but chances are, when the next evolution has\
    \ passed, we’ll probably all be utterly surprised, standing on the sidelines muttering,\
    \ “I didn’t know machines could do that!”\n\nBut what are the predictions for\
    \ the future? What do we know now that we can confidently keep a watchful eye\
    \ out for?\n\n*   **Quantum computing:** Right now, machine learning is mostly\
    \ used for problem-solving. They manipulate and classify data at incredible speeds.\
    \ In the future, quantum computers will be better equipped to manipulate high-dimensional\
    \ vectors. They will accomplish this by using hybrid training methods. By utilizing\
    \ a blend of supervised and unsupervised algorithms, there will be a huge increase\
    \ in the number of vectors resulting in a highly impressive rate of speed.\n\n\
    *   **Improved unsupervised algorithms:** Their ability to discover hidden patterns\
    \ in data on its own and their self-learning techniques make it possible for unsupervised\
    \ learning to be utilized more fully in the future. Machines of the future will\
    \ be built smarter and mostly unsupervised.\n\n*   **Collaborative learning:**\
    \ Machines will have an enhanced ability to use other computational entities in\
    \ a collaborative manner. This will allow them to produce better results than\
    \ what is already being achieved now.\n\n*   **Deeper personalization:** In the\
    \ future, machines will know much more about you personally. While we may think\
    \ this is very annoying and an invasion of our privacy, the feeble attempts used\
    \ today will be greatly enhanced. Those frustratingly inaccurate recommendations\
    \ will be a thing of the past, ending our frustrations with the whole process\
    \ after all."
  fmt: "\n**Ans.** Quantum computers store memory using qubits instead of bits, which\
    \ allows them to exceed the potential of traditional computers. Quantum computers\
    \ use quantum-mechanical phenomena, which allow these computers to perform simulations\
    \ that classical computers cannot. Quantum computers first appeared about twenty\
    \ years ago, and some experts believe that we are only a few years away from quantum\
    \ computers becoming online. If we see artificial intelligence as being a program\
    \ that knows how to think, behave, and learn, then quantum computing is the brain\
    \ that powers these essential motivations. For this reason, some in the scientific\
    \ community perceive that the real danger is not artificial intelligence but quantum\
    \ computers.\n\n### 19. What is the Turing test?\n\n**Ans.** Turing test was a\
    \ concept created by British computer scientist Alan Turing in 1950. Although\
    \ there are different forms of the Turing test, and even some disagreement about\
    \ what should or should not be considered a true Turning test, this type of test\
    \ can be thought of as answering the question of whether a machine is capable\
    \ of of the subject to questions, but several measures are used to determine the\
    \ emotional response, including pupillary dilation response. The existence of\
    \ the Voight-Kampff test implies a future point where human beings will have difficulty\
    \ being able to tell artificially intelligent agents from humans, therefore requiring\
    \ advanced tests to make the distinction.\n\n# Conclusion\n\nBy now you should\
    \ be able to apply various machine learning algorithms for supervised learning,\
    \ unsupervised learning, and reinforcement learning. This knowledge is beneficial\
    \ when you want to explore other problems regarding machine learning. Having said\
    \ that, it is important to give you some more words of advice, especially on how\
    \ to approach a problem regarding machine learning.\n\n# Approaching a machine\
    \ learning problem\n\nOne must be very orderly especially when approaching a machine\
    \ learning problem for the first time. Endeavor to answer the following questions:\n\
    \n*   What and how do I measure for my working model (e.g., a fraud prediction\
    \ model)?\n*   Do I have the knowledge to evaluate a specific algorithm?\n*  \
    \ What is the final implication (businesswise or academically) of my model in\
    \ case I am successful?\n\n# Humans in the loop\n\nIdentify and assign roles for\
    \ each and every human participant in your model appropriately.\n\nMove from prototype\
    \ to production.\n\nBuild prototypes using the library features of `scikit-learn`,\
    \ and engage a production team who should be working with programming languages\
    \ such as `Python`, `R`, `Go`, `Scala`, `C#`, `C++`, and `C`.\n\n# Testing production\
    \ systems\n\nBefore you release your product into the market, make sure you carry\
    \ out proper testing to ascertain whether your product is working properly. It\
    \ is in this phase that you can identify various faults and even points of improvement.\n\
    \n# Next step\n\nThis book provides such a perfect illustration of machine learning\
    \ that, at the end of it, you expect to be a machine learning expert. However,\
    \ if you need more information, feel free to consult other literature about those\
    \ concepts that may not be very clear to you. Some good books may include *The\
    \ Elements of Statistical Learning by Friedman et al.*, and *Machine Learning:\
    \ An Algorithmic Perspective by Stephen Marsland.*\n\n# Machine learning packages\n\
    \nCurrently there are a number of machine learning packages in the market that\
    \ are meant to boost your understanding of various algorithms. Some of the most\
    \ common packages are `scikit-learn` (most interactive and obviously favorite),\
    \ `statsmodels` package, `vowpal wabbit` (vw), and finally `mllib` (a `Scala`\
    \ library built on `Spark`).\n\nUse recommender systems and other kinds of machine\
    \ learning to identify the best of the best. It is my hope that you are now convinced\
    \ about machine learning.\n\n Keep digging into this new area and never give up;\
    \ a lot more is yet to come. Machine learning is an active research subject, in\
    \ particular neural networks. Nowadays, machine learning is used in every domain,\
    \ such as marketing, health-care systems, banking systems, stock market, and gaming\
    \ applications, among others. This book’s objective is to provide a basic understanding\
    \ of the major branches of machine learning, as well as the philosophy behind\
    \ neural networks.\n\n# Where do we go from here?\n\nWe have already established\
    \ how wonderful machine learning is and what it can do today. What’s even more\
    \ amazing is what it will be able to do in the future. Yes, the future looks very\
    \ bright for many reasons. Of course, there are many predictions (probably created\
    \ by machine learning) of what we can expect, but chances are, when the next evolution\
    \ has passed, we’ll probably be utterly surprised, standing on the sidelines muttering,\
    \ “I didn’t know machines could do that!”\n\nBut what are the predictions for\
    \ the future? What do we know now that we can confidently keep a watchful eye\
    \ out for?\n\n*   Quantum computing: Right now, machine learning is mostly used\
    \ for problem-solving. They manipulate and classify data at incredible speeds.\
    \ In the future, quantum computers will be better equipped to manipulate high-dimensional\
    \ vectors. They will accomplish this by using hybrid training methods. By utilizing\
    \ a blend of supervised and unsupervised algorithms, there will be a huge increase\
    \ in the number of vectors resulting in a highly impressive rate of speed.\n*\
    \   Improved unsupervised algorithms: Their ability to discover hidden patterns\
    \ in data on its own and their self-learning techniques make it possible for unsupervised\
    \ learning to be utilized more fully in the future. Machines of the future will\
    \ be built smarter and mostly unsupervised.\n*   Collaborative learning: Machines\
    \ will have an enhanced ability to use other computational entities in a collaborative\
    \ manner. This will allow them to produce better results than what is already\
    \ being achieved now.\n*   Deeper personalization: In the future, machines will\
    \ know more about you personally. While we may think this is very annoying and\
    \ an invasion of our privacy, the feeble attempts used today will be greatly enhanced.\
    \ Those frustratingly inaccurate recommendations will be a thing of the past,\
    \ ending our frustrations with the whole process after all.\n"
