    \ of artificial intelligence like machine learning or deep learning. But the term\
    \ usually refers to approaches to artificial intelligence in terms of how the\
    \ agents operate. The main classification system divides artificial intelligence\
    \ into (1) analytical artificial intelligence, (2) human-like artificial intelligence,\
    \ and (3) humanized artificial intelligence.\n\n    Understanding different types\
    \ of intelligence is key to knowing the difference between these three types of\
    \ artificial intelligence. Analytical artificial intelligence is thought of purely\
    \ in terms of cognition. Cognition represents the range of skills like processing\
    \ information, language production, and learning that are thought of as representing\
    \ higher order thinking. This is the type of thinking that human beings and some\
    \ higher animals are capable of.\n\n    Human-like artificial intelligence adds\
    \ emotional intelligence to cognitive intelligence in its range of abilities.\n\
    \n    Humanized intelligence is perhaps the most human of the three types of artificial\
    \ intelligence. Humanized artificial intelligence includes cognitive intelligence,\
    \ emotional intelligence, and social intelligence. Emotional and social intelligence\
    \ represent more nuanced forms of intelligence. These are the types of bits of\
    \ intelligence that robots, for example, would need to exhibit in order to not\
    \ be detected immediately as being robots.\n\n5.  **Why is artificial intelligence\
    \ receiving so much attention lately?**\n\n    **Ans.** Artificial intelligence\
    \ is receiving so much attention lately because, as artificial intelligence breaks\
    \ new barriers in what it is able to accomplish, many have begun to theorize that\
    \ artificial intelligence represents a so-called existential threat to human beings.\
    \ An existential threat is essentially a factor that represents a danger to human\
    \ survival as a species.\n\n    Why is artificial intelligence believed to be\
    \ an existential threat? Artificial intelligence has been postulated to represent\
    \ an existential threat because of the understanding that artificially intelligent\
    \ agents that are fully aware (in science-fiction terminology) or that have achieved\
    \ singularity in scientific terms will be able to exceed collective human intelligence.\
    \ An artificially intelligent agent would, therefore, be more intelligent than\
    \ all human beings in history put together. An undercurrent of this fear is the\
    \ supposition that such an intelligent agent may attempt to destroy the human\
    \ race, although that is at this stage an assumption.\n\n6.  **What is the connection\
    \ between artificial intelligence and robotics?**\n\n    **Ans.** Although many\
    \ people often think of artificial intelligence as a quality associated with robots,\
    \ most agents of artificial intelligence at present are computer programs that\
    \ complete specified tasks. Some of these programs merely receive data from their\
    \ environment and accomplish specified tasks, while others are able to make changes\
    \ to their structures in response to information that has been gained or learned,\
    \ which is referred to as machine learning in the context of artificial intelligence.\n\
    \n7.  **What are artificial neural networks?**\n\n    **Ans.** Artificial neural\
    \ networks are a type of network that some artificially intelligent agents are\
    \ created with. Artificial neural networks are designed to resemble, at least\
    \ in part, the neural networks of human beings. The human central nervous system\
    \ contains millions of connections in the forms of neurons, synapses, and innervated\
    \ tissue. These human neural networks allow human beings to perceive their environment,\
    \ operate in their environment, interact with other objects in their environment,\
    \ form language, and learn.\n\n    Scientists studied human neural networks in\
