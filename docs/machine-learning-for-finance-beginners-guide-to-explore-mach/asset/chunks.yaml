    to artificial neurons dates back to 1943.


    Research on artificial intelligence began with a workshop that was held in 1956
    at Dartmouth College in New Hampshire. This workshop involved demonstrations by
    computers that were able to engage in games and learning. At this early stage,
    artificial intelligence research was largely funded by government agencies like
    the US Department of Defense, although funding subsequently fell off dramatically
    and was not revived into the 1970s and 80s. This revival was associated with increasing
    applications of computer technology in modern life.


    ## 13. Why is there so much worry regarding advancements in artificial intelligence?


    **Ans.** There are many arguments about why advancements in artificial intelligence
    are the source of so much fear among a large group of people. This worry essentially
    stems from fears that, if human beings are supplanted as the most intelligent,
    powerful agents on planet Earth, then our own existence may be threatened. In
    fact, as human beings, we project some of our own motivations, thought processes,
    and behavior onto machines operating with artificial intelligence.


    In short, we presume that artificial intelligence agents would behave the same
    way that human beings would behave. Human beings may like to imagine that they
    behave in a way that is beneficial to the world, but human beings often engage
    in behaviors that are harmful not only to other species but to our own species,
    as well as the world itself. There has long been a tendency to imbue technology
    that humans create with human qualities, and at least some of the concern regarding
    artificial intelligence stems from this.


    ## 14. Are concerns about artificial intelligence warranted?


    **Ans.** There is no question that every day our capacity to understand just how
    miraculous artificial intelligence is, can (and will) grow. As we understand how
    the human mind works (including neural networks), we are continually fascinated
    by the idea that agents of our design are able to think much faster and potentially
    more logically than human beings, even when we constrain the agents in various
    ways. Artificially intelligent agents are able to beat human beings at games like
    chess and Go, and they are able to seemingly predict human thoughts and behaviors
    even before human beings know what they are doing or why. Are concerns about AI
    warranted? Absolutely!


    ## 15. Will machines using artificial intelligence one day take over the world?


    **Ans.** Many science fiction writers, screenwriters, and movie directors have
    speculated on this idea, that artificial intelligence will one day pose some sort
    of threat to humanity. Even when the ancient Greeks imagined the automatons fashioned
    by Hephaestus, they perceived these automatons to be representing some sort of
    threat to human beings. Perhaps it is human nature to perceive the environment
    as filled with threats that need to be destroyed or at least curtailed in some
    ways.


    To be honest, it is difficult to say whether artificially intelligent agents will
    one day take over the world. If you have watched “The Matrix,” then perhaps you
    believe that artificially intelligent agents have already taken over the world
    and that you are currently experiencing a machine-induced delusion. Whatever you
    believe, the reality is that artificial intelligence is already a part of our
    lives. Perhaps a world in which artificial intelligence takes over is not too
    different from the sort of world in which we live now (and, no, I do not mean
    that in a Matrix type of way).


    ## 16. What is all this singularity business about?


    **Ans.** Singularity is the term used to describe a hypothetical future event
    that involves artificially intelligent machines. Singularity essentially refers
    to the future point at which the intelligence of AI agents would exceed the collective
    intelligence of the human race. This represents an irreversible event that would
    permanently change the course of human civilization and life on Earth.


    Much of the fear around singularity has to do with the reality that many regard
    computers, machines, and artificial intelligence with suspicion. Many imbue machines,
    computers, and artificial intelligence with human qualities. They perceive that
    an agent that is basically, what some may call, omniscient may decide that human
    beings represent a threat to life, the universe, or to the machines themselves
    and would, therefore, take actions against human beings. The strain running deep
    within the fears of singularity occurring is the idea that artificially intelligent
    agents would reach some form of inevitable conclusion.


    ## 17. Why is it important for machines to learn?


    **Ans.** Machine learning (and more complex deep learning layered processes) involves
    machines making changes to their structure or programming on the basis of interactions
    that the machines have with their environment. This type of learning is important
    in artificial intelligence programs because some types of tasks may require learning
    for the program to be able to complete the task effectively, even with its programming.


    For example, think about how poorly a human being may complete a challenging game
    or puzzle if they were unable to learn from their past actions. Imbuing artificially
    intelligent agents with the ability to learn essentially improves the functioning
    of the program. Learning also involves understanding the correlations between
    things in the environment, information that the artificially intelligent agent
    stores in the form of `.dat` files or other data. This data can be accessed by
    people for the purposes of data mining.


