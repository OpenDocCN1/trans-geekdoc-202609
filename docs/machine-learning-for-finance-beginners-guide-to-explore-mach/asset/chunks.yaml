    One of the troubles with FinTech is that the app needs to function in a way that
    verifies the identity of the operator. Otherwise, how can people trust in the
    veracity of the service they are operating if they cannot be sure they are exchanging
    money with legitimate individuals who have solid credit backgrounds? This principle
    is called “know your customer (KYC).” The problem with the KYC approach is that
    it takes a lot of effort to correctly determine a person’s identity electronically.


    Here are some tips for simplifying the overwhelming task of getting to know your
    customers:


    - **Don’t ask for all the information at once:** This is time-consuming, and people
    will be suspicious of your service if you go for it all at once. The best way
    to collect customer information is to start with the bare minimum and then allowing
    them to complete the first transaction. After trust in your service has been established,
    you are free to get the rest of the necessary information.

    - **Make it easy:** Of course, you could ask your customers to scan and upload
    copies of their identity documents, but that is a huge hassle for them. Partnering
    with other identity servicing companies to gather this information reduces the
    burden on your customers. Using the information they have provided, these services
    will attempt to match photos from their database. In the event that this fails
    to work out, you can always ask the customer for a scan.

    - **Give them reasons:** People are naturally skeptical about offering up personal
    information, especially when it seems hard to understand what their gender could
    possibly have to do with their finances. This is why it is best to always explain
    why you are asking for certain information. These exchanges have to be based on
    trust, and the best practice for establishing trust is transparency.

    - **But don’t make it too easy:** Even Venmo has come under fire for their security
    failures. These technologies have to be simple to interact with, but not so simple
    that they can be easily hacked. Customers have to feel safe using your app, which
    is why simple features such as security pins are essential. This is where FinTech
    user experience differs from that of other applications. Unlike photo-sharing
    apps, messaging, etc., there is an element of security in the design that must
    be present, which is not required for other platforms.


    # Innovative technologies


    While the whole world was focused on the Internet, mobiles, social media, and
    the rise of FinTech, new innovations have shaken up the entire banking industry
    one more time. While in 1970 to 1990 there was a big debate whether computers
    and the Internet shall make manual workers obsolete, now there is a larger debate
    whether robots will make Internet workers and manual workers obsolete? Debates
    are endless and they shall continue, but let us study the best breed of new technologies
    such as AI, machine learning, Blockchain, and big data in this chapter.


    # AI/robotics including chatbot


    Let us now focus on the use of new innovations such as AI/robotics and chatbot
    in banking. Many times, banks struggle to identify a genuine customer because
    of the huge amount of data at their disposal. In such cases, AI is very useful.
    For example, previously robots could answer questions such as “What is my current
    balance in the account?” “When will the check book be delivered to me?” “What
    is the status of my fund transfer request?” However, new-age robots are becoming
    more analytical, and can now answer questions like “What is my current balance
    in the account?” “When will the check book be delivered to me?” “What is the status
    of my fund transfer request?”


    # Cognitive computing


