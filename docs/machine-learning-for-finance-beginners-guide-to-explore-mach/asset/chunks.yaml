- raw: 'Neural networks enable AI to solve complex problems. Since these networks
    are designed similar to the human brain and nervous system, data scientists and
    machine learning engineers can develop high performing AI systems that work similar
    to a human brain. Neural networks, deep learning, and AI represent powerful and
    exciting machine-learning-based techniques that are best suited for solving real-world
    problems. Although no computer could ever achieve the level of human intelligence,
    AI models based on decision-making, inference, and reasoning can deliver great
    outcomes and accurate predictions.


    Billions of neurons with trillions of have connections between them—that’s what
    drives our intelligence and our ability to learn and adapt when we encounter something
    new.


    Back in the 1950s, scientists first developed the concept of an artificial neuron
    that simulated, very simplistically, the behavior of biological neurons. Later,
    the idea of linking several artificial neurons together, to create a neural network,
    was proposed as a way to represent complex problems. However, it has only been
    in the last few years that the necessary computing capabilities have become readily
    available to allow their full potential to be realized. Today, advanced neural
    network models are at the cutting edge of AI and machine learning research.


    To show how a neural network works, let’s start with the basic building block
    of a neural network: the neuron.


    # [Structure](#toc.xhtml#s81a)


    In this chapter we will cover the following topics:


    *   Working of neural networks.


    *   Types of neural networks in AI.


    *   Benefits of using artificial neural networks.


    *   Gradient-boosting algorithms.


    *   Gradient descent.


    # [Objective](#toc.xhtml#s82a)


    After studying this chapter, you should be able to do the following:


    *   Understand the concept of neural network, GBM, and gradient descent.


    *   Understand how neural networks work, their different types, and their benefits.


    # [Working of neural networks](#toc.xhtml#s83a)


    Similar to a human brain, neural networks have the capability to make decisions
    and give predictions that are best suited for the given data set. They interpret
    sensory data by using machine learning perceptions and clustering of raw input.
    Further, the patterns recognized by neural networks are contained in vectors and
    are usually numerical. Input data for neural networks can include real-world data
    such as text files, images, audio, video, or graphical files. Each type of data
    is translated into a format that is suitable for the neural networks so that relevant
    operations could be done without any hassle.


    Moreover, neural networks are based on classification and clustering models, which
    make it easier for machine learning models to achieve better data insights. Neural
    networks help manage unlabeled data by reviewing the similarities within the inputs.
    After the review is done, the model classifies the data and gives a labeled data
    set to train on. For example, if we want to develop a network that identifies
    cats, the initial training should include a series of pictures of cats from each
    angle. As each input is given with a matching identification, such as “animals”
    or “not animals,” the model can differentiate and deliver accurate predictions
    without any hassle.


    To determine and define rules, the decision of each node is sent to the next tier;
    thus the rules depend upon the inputs from the previous tier. Neural networks
    are based on genetic algorithms, gradient-based training, Bayesian methods, and
    fuzzy logic theorems. Refer to the following image:


    ![](images/6.1.jpg)


    **Figure 6.1**


    The working of a neuron can be explained as follows:


    1.  Application data provides the inputs to the neuron. This is just like in scorecard
    and decision tree models.


    2.  Each input is multiplied by a weight.


    3.  The resulting values are added together to get an initial score.


    4.  The initial score is transformed to lie within a certain range, often between
    0 and 1. This is so that when several neurons are combined to produce a neural
    network, all the neurons produce values in the same range.


    5.  The transformed version of the initial score is the output produced by the
    neuron; i.e. the credit score.


    An artificial neuron isn’t mysterious or complex. It isn’t really much different
    from the scorecard model. The main difference is that the neuron score lies in
    a fixed range. To produce a neural network, several neurons are connected together,
    as shown below:


    ![](images/6.2.jpg)


    **Figure 6.2**


    The credit score (Output 5) from the network is calculated as follows:


    1.  The application data is supplied separately to each of the four neurons in
    the first layer.


    2.  Each neuron has its own weights. The weights, when combined with the application
    data, create scores (Score1, Score2, etc.).


    3.  The scores are transformed to produce four outputs.


    4.  The four outputs provide the inputs to the single neuron in the second layer
    (Neuron 5).


    5.  Neuron 5 combines the inputs with a further set of weights to create Score5.


    6.  Score5 is transformed to create the final credit score.


    The collection of weights in the network represents the patterns identified by
    the training algorithm. If you want a biological analogy, the weights can be thought
    of as a memory that can be recalled whenever you want to make another credit scoring
    decision.


    How does the training algorithm determine what the weights should be? Many different
    algorithms can be used to find the weights in a neural network, but they all tend
    to adopt the following principles:


    1.  Assign each weight a random or zero value.


    2.  Calculate the scores generated by the network for all cases in the training
    data.


    3.  Assess the model’s accuracy, e.g., for the credit scoring model, how well
    it assigns high scores to good-paying customers and low scores to defaulters.


    4.  Adjust the weights to improve the model’s accuracy. For the credit scoring
    example, good payers get higher scores and bad payers get lower scores.


    5.  Repeat steps 1 to 4 until no further significant improvement in model accuracy
    is observed.


    Complex math occurs in step 4. This process of adjusting the weights is called
    training. A simple training approach is to randomly try different values and see
    what works best. However, this is very inefficient. Even the most powerful computer
    could run for years and still not find a good model using this approach. In practice,
    neural network training algorithms are cleverer than this. They adopt different
    weight adjustment strategies based on the model’s performance between each iteration
    of the algorithm. The algorithm terminates when further adjustments deliver no
    significant improvement in model accuracy.


    One reason neural networks are popular is that they are often better than scorecards
    and decision trees at spotting subtle patterns in the training data. Their main
    drawback is that their outputs are not intuitive. You may know what all the weights
    are and understand how the final score is calculated. For example, if I asked
    you which of the inputs in the image above contribute most to the final score,
    then that’s far less obvious than with the scorecard model. This can be a problem
    if there is a business or legal requirement to explain how the model score was
    arrived at.


    Deep learning is the latest evolution of neural networks. The network shown earlier
    has two layers of neurons, but there is no reason why there can’t be more layers,
    as illustrated below:


    ![](images/6.3.jpg)


    **Figure 6.3**


    The two models take exactly the same input data and deliver the same type of output.
    However, the network in *[Figure 6.3](#c06.xhtml#fig6_3)* has two extra layers
    of neurons. What you tend to find is that as more layers are added, the ability
    of the network to identify complex patterns increases. The more layers, the deeper
    is the network.'
