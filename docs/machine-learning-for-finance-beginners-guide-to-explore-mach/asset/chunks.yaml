  trans: '


    与传统的服装尺码结构不同，Ashdown 和 Paal 并没有设计一套所有尺寸同步扩展的组织化梯度尺码。相反，他们设计了适用于各种体型的尺寸。每种体型都对应人体测量数据库中的一组记录。一个簇可能由短腿、小腰、大胸部且长躯干、中等身材、宽肩和细脖的女性组成，而其他簇则捕捉了其他的测量特征组合。该数据库包含了近
    3000 名女性中每个人的百多项测量数据。用于聚类的技术是 `k-means` 算法（将在下一节定义）。仅需百多项测量中的几项即可对簇进行分类。聚类方法的进一步优势是发现了这种变量减少的方法。


    # 高斯模型


    如前所述，`k-means` 方法存在一些缺点：


    * 它在处理簇重叠方面表现不佳。

    * 离群值会迅速将簇拉离中心。

    * 每个记录要么在给定的簇内，要么在境外。


    高斯混合模型是 `k-means` 的概率版本。该名称源于高斯分布，即在处理高维问题时经常假设的概率分布。高斯分布推广到具有正态分布的变量。与之前一样，选择了
    `k` 个种子来启动算法。然而，这次种子被视为高斯分布的源。该算法通过迭代两个步骤进行，称为估计步骤和极大化步骤。估计阶段计算每个高斯分布对每个数据点的责任度。请看下图：


    ![](img/2.5.jpg

    ```


    **图 2.5**


    重复这些步骤，直到高斯分布不再移动为止。高斯分布本身既可以改变形状，也可以移动。然而，每个高斯分布都受到限制，因此如果它对靠近均值的点显示出极高的责任，意味着责任度的剧降。如果高斯分布涵盖了更广泛的值范围，那么它对附近点的责任就较小。由于分布必须始终整合为一个整体，高斯分布随着其的增大总是变得越来越弱。之所以被称为混合模型，是因为在每个数据点上，似然是许多分布混合的和。过程结束时，每个点都以高或低概率绑定到不同的簇中。这通常被称为软聚类，因为单个簇不会对点进行唯一分类。这种方法的一个迹象是，位于多个簇中的某些点可能具有高概率。其他点在任何簇中的概率可能都非常低。每个点都可以分配到其概率最高的簇中，使得这种软聚类变为硬聚类。


    自动聚类检测技术是一种无向数据挖掘工具，可用于学习复杂的数据库结构。通过将复杂的数据集分为更简单的簇，可以使用自动聚类来提高更有针对性的技术的效率。


    通过选择不同的距离测量方法，自动聚类可以应用于几乎任何形式的数据。在新闻故事集或保险报告中发现簇与在天文或财务细节中一样容易。聚类算法可以依赖某种形式的相似性指标来确定两个记录是近还是远。有时使用距离的几何表示，但也有其他可能性，当聚类记录中的非数值数据时，某些可能性更易接受。最常见的自动聚类检测算法之一是
    `k-means`。


    `k-means` 算法是一种基于远程识别 `k` 个簇的迭代方法。高斯混合模型是 `k-means` 概念的变体，允许簇发生重叠。分裂聚类通过连续分裂一个初始大簇来创建簇树。凝聚聚类从几个小簇开始，逐渐合并它们，直到只剩下一个簇。分裂法和凝聚法方法允许数据挖掘人员使用外部参数来评估哪种簇树层级对特定应用最有用。


    # 机器学习在网络安全中的应用


    机器学习技术可以应用于各种网络安全问题：


    * 垃圾邮件和钓鱼攻击检测。

    * 恶意软件检测与识别。

    * DoS 和 DDoS 攻击检测。

    * 异常检测。

    * 生物识别。

    * 用户身份识别与验证。

    * 身份盗窃。

    * 社交媒体分析。

    * 信息泄露。

    * 高级持续性威胁。

    * 隐藏通道。

    * 软件漏洞。


    在接下来的章节中，我们将简单讨论这些网络安全问题以及使用机器学习技术的解决方案。


    # 垃圾邮件检测


    垃圾邮件是进入我们邮箱的垃圾邮件的电子等物。垃圾邮件可以定义为未经请求的商业邮件或任何未经请求的批量邮件。垃圾邮件不仅烦人，而且可能是危险的。垃圾邮件的内容可以是商品的广告、色情材料、财务广告、非法拷贝软件的信息、索要资金的欺诈信息、恶意软件链接、钓鱼网站等。垃圾邮件还可能发起拒绝服务
    (`DoS`) 攻击。


    基于电子邮件的文本内容进行垃圾邮件过滤。这被视为文本分类的一个特例，类别为垃圾邮件和非垃圾邮件。`TF-IDF`、`Naive Bayes`、`SVM`、`n-gram`、`boosting`
    等文本分类技术可以用于垃圾过滤。这些技术的一些局限性包括需要大量的训练数据、处理能力等。


    其他机器学习技术涉及将电子邮件转换为特征向量，其中特征包括邮件的标记、大小、是否存在附件、`IP` 以及收件人数量。我们可以使用机器学习技术如 `CVM`、决策树、`neural
    networks` 等。


    # 钓鱼页面检测


    在钓鱼攻击中，人们受到心理影响，恶意网站的内容变得可信，从而诱使用户输入个人详细信息，如用户名、密码、银行账户、信用卡详情等。通常情况下，这是通过伪造声誉良好的网站来实现的，使用户在输入个人信息之前从不怀疑是非活动。如今，钓鱼网站不仅用于嗅探用户凭据，还用于传播
    Cookie 窃取器、键盘记录器等恶意软件。此类恶意软件可以从系统中窃取 Cookie 或捕获用户的击键。


    现有基于机器学习的检测算法使用的不同类型特征可以分类如下：


    * 基于 URL 的特征。

    * 基于域名的特征。

    * 基于页面的特征。

    * 基于内容的特征。


    '
