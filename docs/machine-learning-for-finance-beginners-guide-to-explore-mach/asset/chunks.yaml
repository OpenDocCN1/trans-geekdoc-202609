  trans: '

    神经网络使得 AI 能够解决复杂问题。这些网络的设计类似于人类大脑和神经系统，数据科学家和机器学习工程师可以开发出与人类大脑相似的高性能 AI 系统。神经网络、深度学习和人工智能代表了强大且令人兴奋的机器学习技术，最适合解决现实世界的问题。虽然没有计算机能达到人类智能的水平，但基于决策、推理和逻辑的
    AI 模型可以带来巨大的成果和准确的预测。


    数十亿神经元和数万亿连接之间相互联系——这驱动了我们的智能，以及我们在遇到新事物时学习和适应的能力。


    20 世纪 50 代，科学家首次开发了人工神经元的概念，非常简单地模拟了生物神经元的行为。后来，人们提出了将多个人工神经元连接起来创建神经网络的想法，将其作为表示复杂问题的方法。然而直到最近几年，必要的计算能力才变得易于获得，从而使其全部潜力得以释放。如今，先进的神经网络模型正处于
    AI 和机器学习研究的最前沿。


    为了展示神经网络的工作原理，让我们从神经网络的基础构建块开始：神经元。


    # 结构


    在本章中，我们将涵盖以下主题：


    * 神经网络的工作原理。

    * AI 中神经网络的类型。

    * 使用人工神经网络的优势。

    * 梯度提升算法。

    * 梯度下降。


    # 目标


    学习本章后，你应该能够完成以下操作：


    * 理解神经网络、`GBM` 和 `gradient descent` 的概念。

    * 理解神经网络的工作原理、不同类型及其益处。


    # 神经网络的工作原理


    与人类大脑类似，神经网络具有做出决策和提供预测的能力，最适用于特定的数据集。它们通过机器学习感知和原始输入的聚类来解释感官数据。此外，神经网络识别的模式包含在
    `vectors` 中，且通常是数值型的。神经网络的输入数据可以包括现实世界的数据，如文本文件、图像、音频、视频或图形文件。每种类型的数据都会转换为适合神经网络的格式，以便毫无困难地进行相关操作。


    此外，神经网络基于分类和聚类模型，这使得机器学习模型更容易获得更好的数据洞察。神经网络通过审查输入内部的相似性帮助管理未标记数据。审查完成后，模型对数据进行分类并提供带标记的数据集进行训练。例如，如果我们想开发一个识别猫的网络，初始训练应该包含一系列从每个角度拍摄猫的照片。当每个输入都被赋予匹配的标识（例如“动物”或“非动物”）时，模型就可以区分并毫无困难地提供准确的预测。


    为了确定和定义规则，每个节点的决策会被发送到下一层；因此，规则取决于上一层的输入。神经网络基于 `genetic algorithms`、`gradient-based
    training`、`Bayesian methods` 和 `fuzzy logic theorems`。请参考以下图像：


    ![](img/6.1.jpg)


    **图 6.1**


    神经元的工作原理可以解释如下：


    1. 输入乘以 `weight`。

    2. 将结果相加。

    3. 将和传通过激活函数。

    4. 然后将输出发送到下一个神经元。

