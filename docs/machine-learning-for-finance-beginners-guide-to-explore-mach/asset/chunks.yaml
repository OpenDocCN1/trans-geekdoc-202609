- raw: 'Clustering provides a way to learn about the complex data structure, breaking
    up the cacophony of competing signals into its parts or components. When humans
    try to give meaning to complex questions, our natural or common tendency is to
    break the subject into small pieces, each of which can be explained more simply.
    If someone were asked to describe the color of trees in a forest, the answer would
    probably be different for winter, spring, summer, and fall. People may know enough
    about woodland flora to predict that the best factors to use to form clusters
    of trees that follow similar coloring rules are the hundreds of variables associated
    with a forest: season, foliage, etc., rather than height and age. Simple patterns
    can often be identified within each cluster after the proper clusters have been
    established. “Deciduous trees don’t have leaves in winter, so the trees tend to
    be brown,” or “Deciduous trees leaves change color in fall, usually to oranges,
    reds, and yellows.” In many situations, a very noisy data set simply consists
    of a number of better-behaved clusters.


    The question is, how can these find themselves? This is where automatic cluster
    detection strategies come in — to help see the forest without being lost in the
    woods.


    The geometric ideas used in k-means raise the more general question of similarity,
    relation, and distance measurements. These distance measurements are very sensitive
    to variations in the representation of data, so the next subject discussed is
    clustering data planning, with particular attention being paid to scaling and
    weighting. k-means is not the most widely used algorithm for automatic cluster
    detection.


    # [Searching for simplicity islands](#toc.xhtml#s30a)


    Data mining techniques are classified as direct or undirected, and automatic cluster
    detection is defined as a tool for the discovery of undirected data. That is valid
    in the technical sense since the automated cluster detection algorithms themselves
    simply find a structure that occurs in the data without regard to any unique target
    variable. Most data mining tasks begin with a pre-classified training set that
    is used to create a model that can score or classify previously unseen data. Clustering
    algorithms look for groups of records—clusters—composed of related records. These
    similarities are discovered by algorithms. It is up to the people who run the
    study to decide whether similar documents are of interest to the business, or
    something mysterious and maybe unimportant. However, clustering may be a focused
    practice in a wider context. Clusters developed for a business purpose are generally
    called segments in marketing, and clustering is a common method of customer segmentation.
    Automatic cluster detection is a technique of data mining that is rarely used
    in isolation, because cluster discovery is not always an end in itself. When clusters
    are observed, other approaches must be utilized to decide what the clusters represent.
    The results can be dramatic when clustering is successful. One famous early application
    of cluster detection led to our current understanding of stellar evolution.


    # [Light of the moon, bright star](#toc.xhtml#s31a)


    Astronomers attempting to explain the relationship between the luminosity (brightness)
    of stars and their temperatures in the early twentieth century rendered scatter
    plots like the one shown below. Two different astronomers, Denmark-based *Enjar
    Hertzsprung* and US-based *Norris Russell*, thought about doing this at around
    the same time. They both observed the stars dropping into three clusters in the
    resulting scatter map. This discovery led to further study and an understanding
    that, in very different phases of the stellar life cycle, these three clusters
    reflect stars. The following image illustrates the relationship between luminosity
    and temperature within each cluster:


    ![](images/2.2.jpg)


    **Figure 2.2**


    The relationship between luminosity and temperature within each cluster is similar,
    but the relationship between the clusters is different since the heat and light
    are produced by fundamentally different processes. By converting hydrogen to helium
    by nuclear fusion, 80% of stars that fall on the main sequence produce energy.
    This is how the majority of all stars spend their productive lives. The hydrogen
    is used up after several billions of years. The star then either starts to fuse
    helium, or the fusion ceases, depending on its mass. In the latter case, the star’s
    core collapses, producing extreme heat in the process. At the same time, the outer
    gaseous layer extends away from the core, forming a red giant. The outer layer
    of gasses is gradually stripped away, and the remaining core begins to cool off.
    Now the star is a white dwarf.


    A Google search for the term “Hertzsprung-Russell Diagram” returns thousands of
    pages of links to current astronomical research focused on this sort of cluster
    detection. Even today, HR-based clusters are used to search brown dwarfs (strong
    objects lacking sufficient mass to induce nuclear fusion) and to consider the
    pre-main sequence of stellar evolution.


    A diagram of *Fitting the Troops The Hertzsprung-Russell* is a liable introductory
    example of clustering because it is simple to identify the clusters visually with
    only two variables (and, interestingly, it is a good example of the value of good
    visualizations of data). Also, in three dimensions, it is not too difficult to
    pick out clusters from a scatter plot cube by eye. If all of the problems had
    too few dimensions, automatic cluster detection algorithms would not be necessary.
    As the number of dimensions (independent variables) increases, cluster visualization
    becomes progressively difficult. Even our understanding of how close objects are
    to each other breaks down easily with more dimensions. To claim that there are
    many dimensions to a problem is an invitation to explore it geometrically.


    Both the items that must be calculated separately in order to define something
    are one-dimensional. In other words, if there are N variables, imagine a space
    where each variable’s value represents a distance in an N-dimensional space along
    the corresponding axis. For each of the N variables, a single record containing
    a value can be viewed as the vector that defines a particular point in that space.
    That is easily plotted because there are two dimensions. One such example was
    the HR diagram. The figure below is another example of how a group of adolescents
    maps their height and weight as points on a line. Note how boys and girls mix:


    ![](images/2.3.jpg)


    **Figure 2.3**


    The above map provides a rough picture of the shapes of the people. But if the
    objective is to suit them for clothing, we need a few more measurements! In the
    1990s, the US military conducted a study on how to redesign female soldiers’ uniforms.
    The army’s aim was to reduce the number of different uniform sizes (in terms of
    height) that must be kept in stock, while also supplying well-fitting uniforms
    to each soldier. As anyone who has ever shopped for women’s apparel knows, there
    is already a multitude of classification structures (including measurements, odd
    measurements, plus sizes, junior, petite, etc.). None of these systems have been
    developed with US military’s needs in mind. Researchers at Cornell University,
    *Susan Ashdown* and *Beatrix Paal*, went back to basics; they designed a new set
    of sizes based on the real shapes of women in the military.'
