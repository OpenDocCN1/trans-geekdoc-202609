  - 问题 398. 一家公司想要托管一个面向网站，但要确保即使网站攻破，攻击者也无法访问。最佳配置是哪个？
- - '####'
  - 解释 398. 正确答案：B。将 Web 服务器放置在 DMZ 中，其前面放置防火墙，并在 DMZ 和内部网络之间放置另一个防火墙。这种方法可以即使网站被攻破，攻击者才能到达内部网络。
