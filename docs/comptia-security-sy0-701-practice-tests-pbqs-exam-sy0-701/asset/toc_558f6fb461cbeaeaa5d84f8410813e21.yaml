- - '####'
  - 问题 276. 一家制药公司正在研发一种新药物配方，该配方有望彻底改变某种疾病的治疗方法。研发团队拥有关于药物试验的成分、程序和结果的详尽文档。应该如何对这些文档进行分类，以确保只有公司内部正确的人员才能访问？
- - '####'
  - 解释 276. 正确答案：C. 机密。这种药物配方及其文档代表了该制药公司的价值知识产权。为了防止盗窃、企业间谍活动或意外泄露，应将其分类为机密，以确保有限且受控的访问。
- - '####'
  - 问题 277. 一家软件开发公司维护着一个共享代码库。公司希望确保只有开发者可以对代码进行更改，但测试人员应该查看代码而不进行修改。应该实施哪种方法？
- - '####'
  - 解释 277. 正确答案：C. 实现基于角色的访问控制 (RBAC)。RBAC 根据组织内的角色分配权限。给开发者分配修改，而测试人员分配仅读取的角色。
- - '####'
  - 问题 278. 一家软件开发公司刚刚扩大了团队，希望确保在发生灾难时，他们可以在一天内恢复。然而，他们的灾难恢复有限。哪种灾难恢复类型符合公司的需求？
- - '####'
  - 解释 278. 正确答案：C. 每日备份的温备 (Warm site)。对于软件开发公司在一天内恢复的需求，具有每日备份是理想的。相比冷备份有助于更快的恢复。
- - '####'
  - 问题 279. 一家金融机构希望确保如果攻击者获得了网络某部分的未经访问，将无法移动到其他部分。哪种方法可以实现目标？
- - '####'
  - 解释 279. 正确答案：B. 实现网络隔离。网络隔离将网络划分为多个段或子网。每个段独立运行并拥有自己的控制。这意味着如果攻击者攻破了一个段，将无法访问其他段。
- - '####'
