  \ 证券代币发行 (STO)\n\n3. 证券代币发行 (STO) 和首次代币发行 (ICO) 有什么区别？\n\na. STO 涉及发行实用代币，而 ICO\
  \ 涉及证券代币。\n\nb. STO 是符合证券法的受监管发行，而 ICO 往往缺乏监管合规性。\n\nc. STO 专为合格投资者保留，而 ICO 面向所有人开放。\n\
  \nd. STO 不受投资者保护法约束，而 ICO 则受约束。\n\n4. 哪项区块链功能确保了用户在交易过程中的隐私？\n\na. 匿名性\n\nb. 身份验证\n\
  \nc. 匿名性\n\nd. 中心化控制\n\n5. 以下哪种加密货币专注于促进快速、低成本的跨境支付？\n\na. 以太坊 (ETH)\n\nb. 比特币现金\
