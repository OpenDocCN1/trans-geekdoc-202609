  \n![](img/Discord.png)\n\n# 第 3 章\n\n比特币\n\n## 简介\n\n在过去几十年里，几乎没有一种现象能像比特币一样吸引如此多的关注。它已从一个加密学实验演变为一种全球性的数字货币。此外，它颠覆了我们感知和使用货币的方式。\n\
  \n比特币是一种去中心化且透明的数字货币形式。它没有任何实体形式，其存在于数字世界中。由于比特币是一种去中心化货币，它不受任何中央权力机构的控制。它由区块链技术驱动，基于去中心化、密码学和不可篡改账本的概念。值得注意的是，比特币旨在增强金融交易中的信任。\n\
  \n在本章中，我们将探讨比特币的多面性、其起源、核心原则和技术复杂性。本章将阐明这种数字货币如何走向更广泛的接受，并融入主流金融话题。\n\n## 结构\n\n\
  本章包含以下主题：\n\n• 比特币\n\n• 共识机制\n\n• 区块链中的加密私钥\n\n• 支付至脚本地址\n\n• 多重签名地址\n\n• 个性地址\n\
  \n• 比特币钱包\n\n• 交易脚本\n\n• 比特币挖矿\n\n• 区块结构\n\n• 比特币中继网络\n\n• 区块链分叉\n\n• 比特币测试网\n\n\
  • 比特币取证基础\n\n## 目标\n\n本章旨在为读者提供对比特币的全面理解。它将定义并阐述“币王”迅猛崛起背后的基本原理。它还将评估比特币在全球金融领域的更广泛影响。本章将重点介绍新兴趋势、创新应用，以及比特币在塑造各行业金融交易方面的颠覆性潜力。因此，读者将了解比特币的未来前景，并掌握这种数字货币的所有细节。\n\
  \n# 比特币\n\n\n\n\n\n# 比特币概述\n\n比特币是一种数字货币，可用于在线买卖商品，无需银行或金融机构参与。与传统货币不同，比特币没有实体形式，仅存在于数字领域。它只能在电脑屏幕或智能手机上查看。比特币运行在区块链上，这是一种记录所有比特币交易的独特数据库。每当人们使用比特币进行买卖时，交易都会被记录在区块链上。这确保了没有人能欺诈系统或制造伪造比特币。\n\
  \n人们可以从交易所购买比特币，或将其作为提供商品或服务的报酬收到。一旦你获得一些比特币，就可以像使用其他货币一样，用它们在线购买商品。\n\n比特币是一种于\
  \ 2009 年由化名中本聪的匿名个人或团体创建的数字货币。它运行在一个名为区块链的去中心化网络上，区块链是一个记录所有交易的公共账本。换句话说，比特币是一种利用区块链技术运行的数字货币，为在线买卖商品提供了一种安全且去中心化的方式。\n\
  \n使用比特币，人们无需银行等中介机构即可发送和接收数字货币。这是因为比特币是一个去中心化的支付系统。比特币网络上的交易由网络参与者验证并记录在区块链上。比特币的独特之处之一在于其总量永远只有\
  \ 2100 万枚，这使其成为一种稀缺商品。其价值由市场需求决定，波动性极高。\n\n比特币的一个实际用例是国际交易。美国的人可以使用比特币向日本的人汇款，而无需银行或货币兑换。交易在区块链上处理，收款方将收到等值的日元。比特币交易安全且去中心化，使其比传统国际转账更快、成本更低。\n\
  \n## 比特币基础\n\n比特币具有若干基本特征，使其区别于传统货币，包括：\n\n* **去中心化**：比特币运行在去中心化网络上，意味着它不受银行或政府等中央权威机构控制。相反，交易由网络参与者验证并记录在区块链上。这使比特币成为一个无需信任的系统。这意味着用户无需将信任寄托在第三方或中介机构上来验证和执行交易。比特币的去中心化特性使其可用于传统金融系统不存在或不可靠的地区。例如，生活在政府不稳定或金融体系薄弱国家的人们，可能会发现比特币是一种更稳定、更可靠的财富存储和转移方式。\n\
  * **供应有限**：比特币的总供应量上限为 2100 万枚，这使其成为一种稀缺商品。这有助于防止通货膨胀并赋予其价值。这也意味着比特币不受传统货币所面临的操纵影响，传统货币可能受通胀政策或供应波动的影响。\n\
  * **安全性**：比特币网络上的交易通过加密学进行保护，使其难以被黑客攻击或伪造。网络使用公私钥系统，确保只有特定比特币地址的所有者才能访问和花费其比特币。这使其成为一种存储和转移价值的安全系统。\n\
  * **匿名性**：比特币交易是假名的，意味着它们不与交易发起人的真实身份绑定。然而，交易仍记录在公共区块链上，这使得资金流向可被追踪。在需要透明度的情况下，例如审计目的或追踪供应链中的资金流向，这可能是有益的。\n\
  * **透明性**：区块链是一个记录每笔比特币交易的公共账本。这使网络透明化并有助于防止欺诈。任何人都可以查看区块链并验证交易的有效性，这有助于增加对网络的信任。\n\
  * **不可逆性**：一旦比特币交易在区块链上得到确认，就无法撤销。这有助于防止欺诈交易和退款，后者在传统支付系统中很常见。然而，这也意味着用户必须小心确保将比特币发送到正确的地址，因为一旦交易被确认，就无法撤销。\n\
  \n这些特性使比特币成为一种有趣且独特的货币，在许多现实场景中都有应用。例如，比特币可用于国际交易，因为它不需要银行或货币兑换等中心化中介。它也可用于微支付，例如支付在线内容费用或在社交媒体平台上打赏创作者。此外，比特币可用于筹款，因为它允许人们以安全透明的方式向事业和慈善机构捐款。\n\
  \n比特币在现实世界中有各种实际用途，例如：\n\n* **国际支付**：比特币允许人们直接进行跨境支付，无需银行等中介机构参与。这比传统支付方式更快、成本更低，传统方式处理时间长且可能费用高昂。\n\
  * **投资**：比特币被用作一种投资选择，因为其价值随时间大幅增长。然而，其价值波动性极高，意味着投资它可能有风险。\n* **汇款**：比特币可用于向其他国家的亲朋好友汇款，特别是在传统金融系统不可靠或不可用的地区。\n\
  * **电子商务**：一些在线商家接受比特币作为支付选项，允许顾客使用比特币购买商品和服务。\n\n## 比特币历史\n\n中本聪 2008 年的白皮书揭示了将成为加密货币市场支柱的区块链系统。区块链是一个交易数字账本，它被复制并分布在计算机系统网络中以保护信息。尽管币的最大存在数量规定为\
  \ 2100 万枚，但专家认为要等到 2140 年才会达到上限。\n\n中本聪于 2009 年推出比特币后，挖掘了约 110 万枚比特币，并于 2010 年消失。他将控制权移交给加文·安德烈森（前身为加文·贝尔），后者着手使平台去中心化。这意味着没有中央权威、服务器、存储或管理员。所有参与方均为点对点，区块链分发给所有人。网络仅用于使交易合法化和确认。比特币价格因这些举措带来的新不确定性而下跌。\n\
  \n\n\n\n\n# 比特币\n\n比特币的历史充满波动，波士顿大学 Questrom 商学院教员 Mark T. Williams 曾表示，比特币的波动性是黄金的\
  \ 7 倍、标普 500 指数的 8 倍、美元的 18 倍。比特币极端波动的部分原因来自 Gartner 炒作周期，这是新技术和创新技术常见的生命周期。其五个阶段包括：技术萌芽期、期望膨胀期、低谷期、稳步爬升期，最后是生产成熟期。许多人因比特币一夜暴富又倾家荡产，导致\
  \ 8 位诺贝尔经济学奖得主称比特币为泡沫，很像 17 世纪常被引用的荷兰郁金香狂热。然而，比特币支持者指出，尽管比特币已崩盘 5 次，但每次都回升至之前的价格，而其他泡沫从未恢复价值。\n\
  \n经济实力也是比特币定价的巨大因素。在被称为 2022 年加密寒冬的时期，随着美联储开始激进加息以抑制通胀，比特币价格急剧下跌。投资者的风险偏好几乎消失殆尽，流动性成为交易所面临的主要问题。比特币价值从\
  \ 2021 年 11 月的高点 68,990 美元下跌了 60% 以上，市场悲观情绪依然挥之不去。\n\n尽管存在争议和波动，但越来越多的机构、国家和平台开始接受这种数字货币，比特币支持者寄希望于它成为全球储备货币。按\
  \ GDP 计算的前 10 大经济体中有 7 个认定比特币合法，包括美国。9 个国家全面禁止比特币，包括埃及和巴基斯坦。另外 42 个国家隐性禁止比特币，包括沙特阿拉伯和台湾。\n\
  \n一些国家因全球金融压力已开始积极进行比特币交易。萨尔瓦多于 2021 年采用比特币作为法定货币以解决深层经济困境。不幸的是，由于该国仍难以履行债务义务，且公众采用情况平平，比特币价格随之暴跌。俄罗斯入侵伊始，乌克兰发布了两个加密钱包地址以筹集资金，首日吸引了\
  \ 1,020 万美元以上。比特币也因其对气候变化的影响而引发争议。挖掘比特币需要大量电力，占全球温室气体排放量的 0.10%。剑桥大学发布剑桥比特币电力消耗指数\
  \ (CEBCI)，提供与比特币相关的温室气体排放估算，目前计算为 4,835 万吨二氧化碳当量。\n\n### 比特币交易\n\n当你使用比特币付款时，了解其工作原理很重要。\n\
  \n比特币交易就像发送电子邮件。交易详情经过数字签名以确保安全，然后发送到整个比特币用户网络进行验证。这些信息是公开的，可在称为区块链的数字账本上找到。区块链就像是所有比特币交易的记录，并由比特币网络不断更新。\n\
  \n当你向某人发送比特币时，了解你发送的比特币来源很重要。这就是为什么每笔比特币交易的历史都记录在区块链上。不存在实体比特币，你也没有像银行那样的账户。相反，所有交易都记录在区块链上。\n\
  \n假设 Mark 想给 Jessica 发送 1 个比特币。他使用私钥对一条消息进行签名，该消息包含他之前收到的比特币信息、他想发送的金额以及接收地址。这条消息广播到网络，所有人都能看到交易详情。请参阅图\
  \ 3.1：\n\n![](img/Figure_3.1.jpg)\n\n当 Mark 向 Jessica 发送比特币时，他过去可能从多个人那里收到过比特币。要发送\
  \ 1 个比特币，他可能需要用到之前收到的两笔不同金额。该交易将有两个输出：1 个比特币发送到 Jessica 的地址，0.2 个比特币作为找零返回给 Mark。找零是通过从\
  \ Mark 之前收到的总额中减去他想发送的金额来计算的。\n\n虽然这看起来可能很复杂，但使用比特币并不需要了解交易的所有细节。你的比特币钱包会处理后台工作，让你专注于轻松地发送和接收比特币。\n\
  \n比特币交易费差异很大，从几美分到 100 美元不等。费用取决于同时想使用比特币网络的人数（供需关系）以及你的交易大小。交易越大，输入越多，费用越高。一些钱包允许你自行设置费用，以避免支付过高。如果你不着急，可以设置较低费用并等待网络不那么拥堵。如果你想让交易快速处理，可以支付较高费用。\n\
  \n## 比特币概念\n\n比特币是一种运行在去中心化平台上的数字货币。它的创建旨在提供一种点对点的电子现金系统，允许用户在无需银行或金融机构等中介的情况下转移资金。比特币依靠几个关键概念来有效运行。在本节中，我们将讨论比特币中最重要的五个概念：密钥、地址、钱包、比特币交易和\
  \ UTXO。\n\n### 密钥\n\n密钥是一长串字符，允许比特币用户访问其资金。密钥分为两种形式：公钥和私钥。公钥是一个公开的地址，用于接收比特币交易；私钥则保密保存，用于授权传出交易。私钥与公钥在数学上相关联，因此当用户发送比特币时，必须使用其私钥对交易进行签名，以证明他们是所发送比特币的合法所有者。\n\
  \n### 地址\n\n地址是用于接收比特币交易的唯一标识符。每个地址都是字母和数字的组合，源自用户的公钥。一旦地址收到比特币，它就成为区块链的一部分，区块链是记录所有比特币交易的公共账本。地址可随时生成和丢弃，为用户提供更高程度的匿名性和隐私。\n\
  \n### 钱包\n\n钱包是一种用于存储比特币的软件应用程序。钱包由两部分组成：公钥和私钥。公钥用于接收比特币，私钥用于授权传出交易。钱包可存储在电脑、手机，甚至像\
  \ USB 闪存盘这样的硬件设备上。它们通常受密码或 PIN 码保护，以防止未经授权的访问。\n\n### 比特币交易\n\n比特币交易是一条使用密码学进行数字签名并发送到整个比特币网络进行验证的消息。交易包含发送的比特币数量、接收方地址和发送方地址等信息。交易经由一组称为矿工的用户验证后添加到区块链。矿工使用强大的计算机解决复杂的数学问题并验证交易。一旦交易被验证，它就会被添加到区块链，交易即告完成。\n\
  \n### 未花费交易输出\n\n\n\n\n\n## 未花费交易输出 (UTXO)\n\n未花费交易输出 (UTXO) 是比特币生态系统中的一个关键概念。当用户接收比特币时，它以\
  \ UTXO 的形式存储。当该用户发送比特币时，必须花费一个或多个 UTXO 来完成交易。UTXO 用于防止双重支付，即有人试图将同一笔比特币花费两次的情况。一旦\
  \ UTXO 被花费，它就永远不能再被使用。\n\n总之，比特币依靠几个关键概念来有效运行。密钥、地址、钱包、比特币交易和 UTXO 都是比特币生态系统的关键组成部分。对于任何想要使用比特币的人来说，无论是用于投资还是日常交易，理解这些概念都是必不可少的。虽然其中一些概念可能看起来很复杂，但它们对于维护比特币网络的安全性和完整性至关重要。\n\
  \n## 交易验证\n\n交易验证是比特币网络的一个关键方面。它通过防止欺诈交易和双重支付，确保了系统的安全性和完整性。在本文中，我们将探讨比特币中交易验证的过程。\n\
  \n比特币交易是使用密码学进行数字签名并发送到整个比特币网络进行验证的消息。交易信息是公开的，可以在称为区块链的数字账本上找到。每一笔比特币交易的历史都可以追溯到比特币首次生产或挖矿的时刻。区块链是由节点网络维护的分布式账本，每个节点都验证交易。当一笔比特币交易发起时，它会被广播到网络并被一个节点接收。该节点随后通过检查交易是否格式正确且签名有效、输入是否有效以及发送者是否有足够资金完成交易来验证该交易。然后该节点将交易中继给网络中的其他节点。\n\
  \n一旦交易被中继到网络，它就会被包含在一个区块中。区块是一组捆绑在一起并添加到区块链中的交易。每个区块都包含一个称为哈希的唯一数字签名，用于标识该区块并将其链接到链中的前一个区块。\n\
  \n为了验证一个区块，网络中的节点必须解决一个复杂的数学难题。这个过程称为挖矿，由称为矿工的专用计算机执行。第一个解开难题并将区块添加到区块链的矿工将获得新铸造的比特币和交易费作为奖励。\n\
  \n一旦区块被添加到区块链中，它所包含的交易就被视为已验证和确认。在不使整条链失效的情况下，实际上不可能更改区块的内容，这将需要网络大多数的算力。这使得区块链具有高度的安全性和抗篡改性。总之，比特币中的交易验证涉及一个复杂的过程，该过程利用密码学、分布式计算和共识机制来确保系统的安全性和完整性。通过防止欺诈交易和双重支付，验证过程确保比特币能够作为一种可靠且受信任的数字货币运行。\n\
  \n为了解释比特币交易的验证，让我们使用一个涉及两个人（爱丽丝和鲍勃）的假设场景。图 3.2 是该过程的可视化表示：\n\n![](img/Figure_3.2.jpg)\n\
  \n爱丽丝想给鲍勃发送一枚比特币，因此她发起了一笔交易。这笔交易必须经过网络的验证和确认，以确保爱丽丝拥有她想要发送的比特币，并且她没有试图进行双重支付。\n\n\
  首先，爱丽丝创建了一笔包含详细信息的交易，包括她的私钥、鲍勃的公钥（称为比特币地址）、发送的比特币数量和交易费。然后该交易被广播到比特币网络，节点在将其添加到区块链之前对其进行验证。网络上的每个节点在将交易添加到区块之前都会检查其有效性。为此，节点将通过检查区块链的交易历史来确认爱丽丝拥有她试图发送的比特币。该历史包括比特币网络中发生过的所有交易，从第一笔交易到最近的一笔。\n\
  \n此外，节点会检查该比特币是否已在另一笔交易中被花费。如果已被花费，则爱丽丝无法对其进行双重支付，该交易无效。\n\n一旦交易被验证为有效，节点将其添加到一个新区块中，然后该区块被添加到现有的区块链中。此时，交易被确认，比特币从爱丽丝的地址发送到鲍勃的地址。\n\
  \n这个过程称为共识机制，它确保比特币网络上的所有交易都是有效的，并且没有人可以操纵系统。\n\n### 共识机制\n\n在区块链的语境下，共识是指分布式节点网络就交易的有效性和区块链的状态达成一致的机制。它确保所有参与者对共享账本有一致的视图。在参与者之间信任有限的去中心化环境中，达成共识至关重要。\n\
  \n共识机制的工作原理如下：\n\n- **交易传播：**\n  - 用户通过将比特币从一个地址发送到另一个地址，在比特币网络上发起交易。\n  - 这些交易被广播到网络上的所有节点。\n\
  \n- **交易验证：**\n  - 节点通过检查发送者是否有足够资金以及交易是否遵循比特币协议规则来验证交易的有效性。\n\n- **内存池：**\n  -\
  \ 有效交易被收集在一个称为内存池的池中。\n\n- **开始挖矿：**\n  - 矿工（网络中的专用节点）竞争创建一个新的交易区块。\n  - 他们从内存池中选择交易以包含在区块中。\n\
  \n- **工作量证明 (PoW) 难题：**\n  - 矿工必须找到一个特定值（`nonce`），当该值与区块数据进行哈希运算时，产生的哈希值满足特定标准。\n\
  \  - 这些标准涉及哈希值必须低于特定目标，该目标会定期调整以保持平均 10 分钟的出块时间。\n\n- **挖矿难度：**\n  - PoW 难题的难度大约每两周调整一次，以确保平均每\
  \ 10 分钟挖出一个新区块。\n  - 此调整基于网络的总计算能力。如果矿工集体解决区块的速度太快，难度会增加；如果太慢，则会降低。\n\n- **寻找随机数：**\n\
  \  - 矿工遍历可能的 `nonce` 值，反复对区块数据进行哈希运算，直到找到符合标准的哈希值。\n\n- **区块传播：**\n  - 一旦矿工成功解决\
  \ PoW 难题，他们会将新区块广播到整个网络。\n\n- **共识确认：**\n  - 网络中的其他节点通过检查矿工产生的哈希值是否满足要求标准来验证 PoW\
  \ 的有效性。\n  - 如果有效，节点接受新区块，其中的交易被视为已确认。\n\n- **区块奖励：**\n  - 成功挖出区块的矿工将获得固定数量的新创建比特币（区块奖励）以及所含交易的交易费作为奖励。\n\
  \n- **持续进行：**\n  - 该过程随下一个区块继续，创建一个通过 PoW 链接的区块链（区块链）。\n  - 这种去中心化和竞争性的过程确保了比特币区块链的安全性和不可变性。矿工投入计算能力和能源来竞争添加新区块的机会，使得篡改过去的交易在经济上和计算上都不可行。\n\
  \n### 比特币密钥\n\n\n\n\n\n# 比特币密钥与密码学\n\n比特币是世界上第一种也是最广泛使用的加密货币，它彻底改变了人们对货币和金融的看法。比特币运行在一个去中心化网络上，这意味着它不依赖任何中央权威机构来处理交易。为确保交易安全，比特币使用了一套公钥和私钥密码学系统。比特币密钥是比特币网络安全的关键组成部分。公钥密码学用于接收资金，而私钥密码学用于花费资金。这两个密钥（或数字）在\
  \ `secp256k1` 椭圆曲线上具有数学关联。私钥是在曲线上随机生成的一个数字，而对应的公钥是该曲线上一个相关的点。一个有趣的事实是，地址是公钥经过哈希运算后生成的更短版本。请看图\
  \ 3.3：\n\n![](img/Figure_3.3.jpg)\n\n这条神奇曲线的真正意义在于它创造了**陷门功能**，这意味着一旦我们在曲线上生成了第一个点——私钥，对应的第二个点——公钥，很容易就能找到，但反向推导却在数学上是不可能的。如果用户拥有私钥，那么用户就永远拥有公钥；但如果其他用户拥有公钥，他们在数学上无法反向推导出私钥。\n\
  \n比特币用户必须妥善保管私钥，以防止未经授权访问其资金。让我们在更深层次上剖析这些概念，以详细了解它们。\n\n你可以把公钥密码学想象成一把锁，但它有两把钥匙而不是一把。图\
  \ 3.4 说明了这一过程：\n\n![](img/Figure_3.4.jpg)\n\n在比特币中，公钥是一个可用于接收资金的地址，而私钥是用于花费这些资金的代码。公钥是一串任何人都可见的字母数字字符，而私钥是只有比特币钱包所有者知道的秘密代码。\n\
  \n公钥密码学，也称为非对称密码学，是一种使用两个不同密钥加密消息的方法：公钥和私钥。公钥用于加密消息，而私钥用于解密。在比特币的语境下，公钥用于接收资金，而私钥用于花费资金。要向某人发送比特币，发送方需要知道接收方的公钥。发送方随后创建一笔包含接收方公钥和发送金额的交易。该交易随后被广播到网络中，由其他用户验证并添加到区块链上。\n\
  \n私钥密码学，也称为对称密码学，是一种使用相同密钥进行加密和解密的方法。在比特币的语境下，私钥用于对交易进行签名，以证明钱包所有者有权花费资金。当比特币用户创建钱包时，会生成一对公钥和私钥。私钥安全地存储在用户的设备上，而公钥则与其他用户共享以接收资金。私钥必须保密，因为任何知道私钥的人都可以花费相关钱包中的资金。\n\
  \n比特币密钥对于比特币网络的安全至关重要。如果用户的私钥泄露，其资金可能被他人窃取。因此，比特币用户必须妥善保管私钥，切勿与任何人分享。过去曾发生过许多用户丢失私钥导致比特币资金损失的案例。\n\
  \n## 区块链中的私钥安全保护\n\n私钥是区块链安全的关键组成部分，作为数字签名用于验证所有权并允许控制资产。保护私键安全至关重要，以防止未经授权的访问和潜在损失。以下是关键考量、最佳实践和增强安全措施：\n\
  \n### 私钥安全的重要性\n\n- 私钥赋予区块链上数字资产的控制权和所有权。\n- 未经授权访问私钥可能导致盗窃、资金损失或交易被篡改。\n- 区块链交易不可逆，这凸显了加强安全的必要性。\n\
  \n### 私钥安全的最佳实践\n\n- **离线存储**：私钥在不使用时应保持离线状态，以减少暴露于网络威胁的风险。\n- **加密保护**：使用强加密方法保护私钥免遭未经授权的访问。\n\
  - **安全备份**：创建加密备份并存储在多个安全位置，以防丢失。\n- **避免使用公共网络**：避免在公共网络上访问私钥，以最大限度减少遭受潜在攻击的风险。\n\
  - **定期审计**：定期审查和更新安全措施，以应对不断演变的威胁。\n\n### 安全威胁\n\n- **网络钓鱼**：诱骗用户泄露私钥或敏感信息的恶意行为。\n\
  - **恶意软件**：旨在破坏安全并获取未经授权访问权限的病毒或恶意软件。\n- **暴力破解攻击**：通过系统尝试不同组合反复猜测私钥的攻击。\n- **社会工程学**：通过欺骗手段操纵个人泄露私钥信息。\n\
  \n### 使用硬件钱包增强安全性\n\n- **隔离性**：硬件钱包将私钥离线保存，与联网设备隔离，最大限度减少暴露于网络威胁的风险。\n- **安全元件**：硬件钱包通常包含防篡改的安全芯片，提供额外的保护层。\n\
  - **物理认证**：某些硬件钱包要求物理确认，增加了一层额外的安全性。\n- **交易验证**：硬件钱包允许用户直接在设备上验证和批准交易。\n\n### 用于长期存储的冷钱包\n\
  \n- **定义**：冷钱包是指将私钥完全离线保存，与互联网断开连接。\n- **长期存储**：适合长期持有资产，降低网络威胁风险。\n- **纸钱包**：一种冷钱包形式，将私钥打印或书写在纸上并妥善保管。\n\
  \n私钥的安全性是保护区块链资产的基础。\n\n## 椭圆曲线密码学\n\n椭圆曲线密码学（ECC）是一种基于密钥的数据加密技术。ECC 专注于公钥和私钥对，用于\
  \ Web 流量的解密和加密。\n\n以下是 ECC 工作原理的分步详解，并附有图示说明每一步：\n\n1. **生成曲线**：ECC 的第一步是生成一条椭圆曲线。该曲线是一个二维平面，由满足特定数学方程的点组成。曲线方程为\
  \ `y² = x³ + ax + b`，其中 `a` 和 `b` 是定义曲线形状的常数。图 3.5 展示了一条椭圆曲线示例：\n\n   ![](img/Figure_3.5.jpg)\n\
  \n2. **选择基点**：接下来，在曲线上选择一个基点。该点用作涉及该曲线所有计算的起始点。基点是随机选择的，但必须具备一组特定属性，使其适合用于 ECC。基点的一个属性是：当它与一个标量相乘时，必须能生成曲线上的所有其他点。\n\
  \n3. **生成私钥**：私钥是一个随机生成并由所有者保密的数字。私钥用于对基点执行数学运算以生成公钥。\n\n\n\n\n\n## 4. 生成公钥\n\n\
  要生成公钥，需将私钥与曲线上的基点相乘。此次乘法的结果是曲线上的一个新点，即为公钥。随后，公钥会与任何需要向私钥所有者发送消息的人共享。\n\n## 5. 加密消息\n\
  \n要使用 ECC 加密消息，发送方首先必须获取接收方的公钥。然后发送方生成一个称为临时密钥的随机数，用于对公钥执行计算。该计算的结果是曲线上的一个新点，即为共享密钥。随后，共享密钥被用于通过对称加密算法加密消息。\n\
  \n## 6. 解密消息\n\n要解密消息，接收方使用其私钥对共享密钥执行与发送方相同的计算。这会还原出原始公钥，进而用于解密消息。\n\n总的来说，椭圆曲线密码学提供了一种通过互联网安全传输消息的方式。通过使用一种在一个方向上难以计算、但在相反方向上易于计算的数学函数，ECC\
  \ 确保只有预期的接收者才能解密使用其公钥加密的消息。\n\nECC 是一种公钥密码学，它利用椭圆曲线来保障数字通信安全。由于其安全性、高效性和可扩展性，近年来越来越受欢迎。ECC\
  \ 的基本思想是利用数学函数生成一对密钥，一公一私。公钥可以自由共享，而私钥必须保密。使用公钥加密的消息只能用相应的私钥解密，从而确保通信的机密性。\n\nECC\
  \ 的主要优势之一是它提供比其他公钥密码系统（如 `RSA`）更高级别的安全性。这是因为 ECC 密钥通常比 `RSA` 密钥短，却能提供同等或更好的安全性。这使得\
  \ ECC 特别适合资源受限的环境，如移动设备或嵌入式系统。为保持高性能和安全性，采用 ECC 是明智之举。网站越来越多地利用 ECC 来增强客户数据的在线安全性并优化移动端体验。随着更多站点采用\
  \ ECC 进行数据保护，对这类密码学简明指南的需求也日益增长。\n\n用于 ECC 的椭圆曲线是有限域上的一条平面曲线，由满足方程 `y² = x³ + ax\
  \ + b` 的点组成。在该椭圆曲线密码学示例中，曲线上的任意点关于 x 轴反射均不会改变曲线。此外，非垂直线将在三个或更少的位置与曲线相交。\n\n公钥密码学是一种利用特殊数学问题的方法，这些问题在一个方向上易解，在相反方向上难解。例如，`RSA`\
  \ 加密通过将素数相乘得到一个大数，这很容易做到。但仅凭这个大数很难推断出使用了哪些素数。\n\n然而，为保持 `RSA` 的安全性，需要非常长的密钥。这使得过程变慢，且意味着密钥尺寸至关重要。ECC\
  \ 是一种不同的方法，具有优势：它能以更小的密钥达到与 `RSA` 同等的安全级别。这对加密算力较弱的移动设备尤其有用。ECC 使用的数学问题比 `RSA` 的更容易求解，因此更短的密钥仍能提供强安全性。总之，与\
  \ `RSA` 相比，ECC 是一种更快、更节能的加密方法，能以更小的密钥提供高安全性。\n\n尽管 ECC 存在一些潜在漏洞，攻击者可利用这些漏洞破坏其对私钥的安全性。两种常见的攻击类型是侧信道攻击和扭曲安全攻击。侧信道攻击包括差分功耗攻击、故障分析、简单功耗攻击和简单时序攻击。这些攻击通常导致信息泄露，但可采取简单的对策来防范。\n\
  \n扭曲安全攻击（如无效曲线攻击和小子群攻击）可能导致受害者的私钥暴露。不过，通过仔细的参数验证和曲线选择可缓解这些攻击。尽管存在这些漏洞，ECC 在无线安全方面的优势使其总体上成为更安全的选择。\n\
  \nECC 是加密货币中数字签名最常用的实现技术之一。`Bitcoin` 和 `Ethereum` 均在签名交易时专门应用椭圆曲线数字签名算法（`ECDSA`）。然而，ECC\
  \ 不仅用于加密货币。由于其密钥长度较短且效率高，它将成为大多数 Web 应用程序采用的加密标准。\n\n椭圆曲线密码学（ECC）的部分应用如下：\n\n- ECC\
  \ 用于各种安全应用。\n- Diffie-Hellman 协议便是此类应用之一，它实现了双方之间的密钥共享，双方需就曲线、域大小和数学类型达成一致。\n- `ECDSA`\
  \ 是一种流行的数字签名算法，用于 `Bitcoin` 和 `Ethereum` 等加密货币。它采用域逆乘法、算术乘法、逆函数和模运算来签名交易。\n- ECC\
  \ 不仅限于加密货币，因其高效和密钥尺寸小，还用于许多在线应用中对电子邮件、数据和软件进行单向加密。\n- ECC 还用于区块链技术，如 `Ethereum 2.0`，它使用带有\
  \ `BLS` 签名的椭圆曲线密钥对，以验证特定 Eth2 验证者对特定交易的验证。\n\n## Bitcoin 地址\n\n`Bitcoin` 是一种数字货币，无需银行等中央机构参与即可实现安全、去中心化的交易。取而代之的是，交易记录在一个称为区块链的公共账本上，由全球节点网络维护。\n\
  \n`Bitcoin` 地址是一个独特的标签，用于发送和接收 `Bitcoin`。它是字母数字字符的组合，通常以数字 `1` 或 `3` 开头，代表 `Bitcoin`\
  \ 网络上的特定目的地。每个 `Bitcoin` 地址都关联一个私钥，用于证明 `Bitcoin` 的所有权并签署与该地址相关的交易。\n\n公钥密码学用于创建\
  \ `Bitcoin` 地址。这种加密方式使用一对密钥：公钥和私钥。公钥用于创建 `Bitcoin` 地址，而私钥用于证明 `Bitcoin` 所有权并签署交易。要创建\
  \ `Bitcoin` 地址，用户首先使用 `Bitcoin` 钱包生成一对公私钥。然后，使用加密算法对公钥进行哈希运算以生成 `Bitcoin` 地址。结果是一个唯一的字符串，标识用户在\
  \ `Bitcoin` 网络上的位置。\n\n当有人想向特定地址发送 `Bitcoin` 时，他们会向网络广播一笔包含接收方地址和发送 `Bitcoin` 数量的交易。网络上的节点验证该交易，若满足特定要求，则将其添加到区块链中。\n\
  \n要花费与特定地址关联的 `Bitcoin`，地址所有者必须使用其私钥对交易进行签名。此操作证明了 `Bitcoin` 的所有权，并允许交易被添加到区块链。一旦网络节点确认交易，`Bitcoin`\
  \ 即转移至接收方地址。\n\n\n\n\n\n# 比特币地址与 Base58 编码\n\n必须注意的是，比特币地址可用于多笔交易，且与某地址关联的比特币金额可拆分为较小金额进行交易。这意味着比特币地址可以重复使用，但通常建议每笔交易使用新地址，以提高隐私性和安全性。\n\
  \n比特币是一项新颖且令人振奋的技术，但也相对模糊难懂，因此使公众意见两极分化。其作为全球货币的潜力让一些人兴奋不已，却让另一些人感到恐惧。比特币地址长度为 26-35\
  \ 个字符，由字母和数字组成，且以 `1`、`3` 或 `bc1` 开头。\n\n目前，有三种比特币地址格式正在使用：\n\n*   **P2PKH**（地址以数字\
  \ `1` 开头）\n*   **P2SH**（地址以数字 `3` 开头）\n*   **Bech32**（地址以 `bc1` 开头）\n\n总之，比特币地址是去中心化比特币网络上用于发送和接收比特币的唯一标识符。它使用公私钥加密生成，并与私钥关联，该私钥用于证明比特币的所有权并为与该地址相关的交易签名。比特币地址可以重复使用，但建议每笔交易使用新地址以增强隐私性和安全性。\n\
  \n## Base58\n\nBase58 是一种在加密货币领域和其他数字应用中广泛使用的数制系统。它是 Base64 系统的一种变体，通过移除某些字符来减少混淆，防止数据传输时出错。\n\
  \nBase58 用于编码比特币网络中的重要数据，包括比特币地址、公钥和私钥以及其他数据。该系统包含数字 `1` 到 `9` 以及字母 `A` 到 `H`、`J`\
  \ 到 `N` 和 `P` 到 `Z`。字母 `I`、`O` 和 `Q` 不包含在 Base58 系统中，因为它们容易与数字 `1` 和 `0` 混淆。\n\n\
  与传统的二进制或十六进制编码相比，Base58 提供了更紧凑的数据表示。它也更具人类可读性，因为 Base58 使用的字符易于区分，且不包含 `I` 和 `O`\
  \ 等易混淆字符。这使其成为以清晰高效方式传输数据的首选编码系统。\n\n除了紧凑性和可读性外，Base58 系统通常结合校验和使用，以确保数据准确性。校验和是一种数学函数，根据传输的数据生成唯一值。该值随后包含在编码数据中，可用于验证数据在传输过程中未被损坏或篡改。\n\
  \n例如，假设 Alice 想向 Bob 发送一笔比特币付款。Alice 生成一个比特币地址并使用 Base58 系统对其编码。她还在编码数据中包含校验和以确保其准确性。Alice\
  \ 随后将编码数据发送给 Bob，Bob 使用 Base58 系统对其解码并验证校验和。如果校验和匹配，Bob 就知道数据在传输过程中未被损坏或篡改，便可继续进行交易。\n\
  \n总体而言，Base58 是一种以紧凑且人类可读格式传输数据的有用编码系统，常用于加密货币行业对比特币地址和其他重要数据进行编码。它提供了安全可靠交易所必需的数据安全性和准确性级别。\n\
  \n请参阅下图：\n\n![](img/Figure_3.6.jpg)\n\n### Base58 的效用\n\nBase58 是一种常用于编码和解码比特币地址和私钥的二进制到文本编码方案。该编码方案是\
  \ Base64 编码方案的一种修改版，后者用于以 ASCII 格式编码二进制数据。在 Base58 编码中，移除了字符 `0`、`O`、`I` 和 `l` 以避免它们之间的混淆，同时也移除了\
  \ `+` 和 `/` 字符以避免与 URL 编码混淆。\n\nBase58 编码在比特币生态系统中被广泛使用，因为它为比特币地址和私钥提供了紧凑且易读的表示。然而，仅使用\
  \ Base58 编码不提供任何错误检测或纠正机制。这意味着在比特币地址和私钥的传输或存储过程中可能会发生错误。\n\n为解决此问题，Base58 编码通常与校验和机制结合使用，以提供错误检测和纠正。这被称为\
  \ **Base58Check** 编码。\n\nBase58Check 编码涉及在 Base58 编码数据的末尾添加校验和。校验和使用哈希函数（如 `SHA-256`）计算，并追加到编码数据的末尾。生成的数据随后再次进行\
  \ Base58 编码，以产生最终的编码值。\n\n解码 Base58Check 编码值时，解码过程首先涉及解码 Base58 编码数据。生成的数据随后分为两部分：载荷和校验和。载荷是被编码的原始数据，校验和是追加到编码数据末尾的值。\n\
  \n随后使用计算原始校验和时所用的相同哈希函数重新计算校验和。如果重新计算的校验和与从 Base58Check 编码值解码出的校验和匹配，则认为载荷有效。如果校验和不匹配，则认为载荷无效。Base58Check\
  \ 编码提供了一种简单有效的方法来检测比特币地址和私钥中的错误。通过在编码过程中包含校验和，可以检测比特币地址和私钥在传输或存储过程中可能发生的错误。这有助于确保比特币生态系统的完整性，并为比特币用户提供一定级别的安全性。\n\
  \n总之，Base58Check 编码是一种常用于编码和解码比特币地址和私钥的二进制到文本编码方案。它将 Base58 编码与校验和机制相结合，提供错误检测和纠正，有助于确保比特币生态系统的完整性。Base58Check\
  \ 编码是比特币基础设施的重要组成部分，了解其工作原理对于任何参与比特币生态系统的人来说都是必不可少的。\n\n### 使用 Base58 进行编码\n\nBase58\
  \ 编码过程始于获取需编码的二进制数据并将其转换为 Base58 字符串。该过程包含以下步骤：\n\n1.  将二进制数据转换为大端序整数。这意味着二进制数据的最高有效字节被放置在整数的开头。\n\
  2.  将该整数除以 `58`（编码方案的基数）并记录余数。\n3.  用商重复步骤 2，直到商为零。\n4.  使用查找表将每个余数转换为 Base58 字符。查找表通常包含字符\
  \ `1` 到 `9`、`A` 到 `H`、`J` 到 `N`、`P` 到 `Z` 以及 `a` 到 `k`、`m` 到 `z`。\n5.  将 Base58\
  \ 字符连接在一起形成最终的编码字符串。\n\n图 3.7 说明了该过程：\n\n![](img/Figure_3.7.jpg)\n\n### Base58 解码过程\n\
  \nBase58 解码过程包含以下步骤：\n\n1.  将 Base58 编码字符串转换为大端序整数。这涉及使用查找表解码每个 Base58 字符，并将其乘以\
  \ `58` 的相应幂。\n2.  将大端序整数转换为字节数组，方法是取整数的每个 8 位块并按大端序顺序将其放入字节数组中。\n3.  通过计算字节数组的校验和来验证数据的完整性。这通常通过获取字节数组的\
  \ `SHA-256` 哈希值的前四个字节来完成。\n\n\n\n\n\n## 将计算出的校验和与 Base58 编码字符串中包含的校验和进行比较\n\n如果两个校验和匹配，则认为数据是有效的。\n\
  \n此过程可用图 3.8 表示：\n\n![](img/Figure_3.8.jpg)\n\n## 加密私钥\n\n私钥的保护在加密货币交易中至关重要，加密私钥（也称为\
  \ `BIP-38`）提供了一种确保此安全性的可靠方法。在本节中，我们将对加密私钥进行深入分析，重点介绍其定义、功能以及优缺点。\n\n作为加密货币交易的基石，私钥充当授予数字资产访问权限的秘密代码。私钥用于签署交易并验证资金所有权，因此其保护至关重要。保护私钥的方法之一是使用密码短语进行加密，这正是\
  \ `BIP-38` 的用武之地。`BIP-38` 是一种用于加密加密货币私钥的标准，由 Mike Caldwell 于 2013 年开发。\n\n`BIP-38`\
  \ 通过结合使用 `AES-256` 加密和 `ECDSA` 密钥对来工作。`AES-256` 是一种广泛用于保护数据的对称加密算法，而 `ECDSA` 是一种数字签名算法，用于验证比特币交易的真实性。要使用\
  \ `BIP-38` 加密私钥，首先会生成一个随机密码短语，然后使用该密码短语通过 `AES-256` 加密来加密私钥。随后，加密后的私钥会使用 Base58\
  \ 编码进行编码，从而生成 `BIP-38` 加密私钥。\n\n`BIP-38` 在保护私钥方面提供了多项优势。主要优势之一是它为私钥提供了额外的安全层。即使有人获得了加密私钥，如果没有密码短语也无法使用。其次，`BIP-38`\
  \ 允许用户将加密私钥离线存储，这一过程称为冷存储，被认为是存储数字资产最安全的方式之一。\n\n然而，`BIP-38` 也有一些缺点。例如，它的使用可能比较繁琐，因为用户必须记住密码短语，并且每次想要访问数字资产时都必须输入它。如果密码短语遗忘或丢失，加密私钥将无法解密，数字资产将永久丢失。此外，`BIP-38`\
  \ 增加了管理数字资产过程的复杂性，用户必须格外小心，确保其密码短语安全保管，不与任何人共享。\n\n总之，`BIP-38` 为保护加密货币交易中使用的私钥提供了一种可靠方法。它采用\
  \ `AES-256` 加密和 `ECDSA` 密钥对来加密私钥，为数字资产提供了额外的安全层。尽管存在一些缺点，但其优势使其成为寻求保护私钥的用户的热门选择。\n\
  \n## 支付至脚本地址\n\n在加密货币世界中，支付至脚本哈希（`P2SH`）地址是一种用于涉及复杂脚本交易的地址类型。`P2SH` 是一种机制，允许用户将比特币发送到脚本，而不是传统的比特币地址。让我们在以下段落中详细讨论这一点。\n\
  \n比特币交易是在一个称为区块链的公共账本上进行的，所有交易都被记录并公开可供查看。要进行交易，用户需要拥有一个比特币地址，这本质上是该用户钱包在区块链上的唯一标识符。比特币地址有多种类型，每种都有其自身的优缺点。\n\
  \n其中一种比特币地址是 `P2SH` 地址，这是一种更复杂的地址形式，允许用户将比特币发送到经过哈希处理的复杂脚本。这种地址在交易需要多重签名（也称为多签交易）或交易需要满足特定条件的情况下非常有用。\n\
  \n要理解 `P2SH` 地址的工作原理，我们首先必须了解什么是脚本。脚本是嵌入在比特币交易中的小程序，用于确定在何种条件下可以花费比特币。它们允许在区块链上进行更复杂的交易。要创建\
  \ `P2SH` 地址，首先使用 `SHA-256` 算法对脚本进行哈希处理，得到一个哈希值。然后使用 `Base58Check` 编码方法对该哈希值进行编码，从而创建\
  \ `P2SH` 地址。`P2SH` 地址用于存储脚本的哈希值，而不是脚本本身，这使其比实际脚本短得多。当有人想要从 `P2SH` 地址赎回比特币时，必须提供最初经过哈希处理的完整脚本以及相应的签名。然后对脚本进行求值，如果满足指定条件，比特币将被释放。\n\
  \n使用 `P2SH` 地址的主要优势是它们允许在区块链上进行更复杂的交易。例如，多签交易（需要两个或更多签名才能花费比特币）可以使用 `P2SH` 地址进行。这为交易增加了额外的安全层，因为所有相关方必须达成一致，交易才能完成。\n\
  \n`P2SH` 地址的另一个优势是它们有助于降低交易费用。这是因为 `P2SH` 交易在区块链上占用的空间比普通交易少。这意味着矿工可以在一个区块中包含更多\
  \ `P2SH` 交易，从而在保持区块链整体规模较小的同时赚取更多交易费用。\n\n`P2SH` 地址的一个类比是它们就像一个上锁的保险箱。`P2SH` 地址就像保险箱上的锁，而脚本就像打开保险箱所需的组合。只有拥有正确组合的人才能打开保险箱并访问其内容，就像只有拥有正确脚本的人才能访问存储在\
  \ `P2SH` 地址中的比特币一样。要创建 `P2SH` 地址，用户可以使用支持 `P2SH` 地址的比特币钱包，例如 `Electrum`、`Bitcoin\
  \ Core` 或 `Armory`。钱包将为用户生成一个 `P2SH` 地址，可用于接收他人发送的比特币。当用户想要花费比特币时，必须提供完整脚本和所需的签名来赎回比特币。\n\
  \n在比特币脚本系统中，脚本定义了花费与特定输出关联的比特币必须满足的条件。比特币的脚本语言经过精心设计，既简单又灵活，允许指定各种条件。以下是详细阐述及真实案例。\n\
  \n### 比特币脚本基础\n\n*   **脚本语言**：比特币使用一种基于栈的脚本语言，允许执行简单程序。脚本是交易输出的一部分，并决定了在何种条件下可以花费资金。\n\
  *   **解锁脚本（`ScriptSig`）**：当用户想要花费比特币时，必须提供一个称为解锁脚本或 `ScriptSig` 的脚本。该脚本应满足锁定脚本设定的条件。\n\
  *   **锁定脚本（`ScriptPubKey`）**：花费比特币的条件最初由锁定脚本或 `ScriptPubKey` 设定，它是输出脚本的一部分。花费交易必须满足该脚本中指定的条件。\n\
  \n### 脚本设定的条件\n\n#### 支付至公钥（`P2PK`）\n\n*   **锁定脚本（`ScriptPubKey`）**：`<publicKey>\
  \ OP_CHECKSIG`\n*   **解锁脚本（`ScriptSig`）**：`<signature>`\n*   **条件**：花费交易必须包含指定公钥的有效签名。\n\
  \n#### 支付至公钥哈希（`P2PKH`）\n\n*   **锁定脚本（`ScriptPubKey`）**：\n    ```\n    <hash160(publicKey)>\
  \ OP_EQUALVERIFY\n    OP_CHECKSIG\n    ```\n*   **解锁脚本（`ScriptSig`）**：`<signature>\
  \ <publicKey>`\n\n\n\n\n\n# 比特币脚本与多重签名地址\n\n## 脚本条件\n\n## 付款至公钥哈希 (P2PKH)\n\n**条件：**\
  \ 提供的公钥哈希值必须与锁定脚本中指定的值相同，且签名必须有效。\n\n### 多重签名\n\n**锁定脚本 (ScriptPubKey)：**\n```\n\
  <m> <publicKey1> <publicKey2> ... <publicKeyn> <n> OP_CHECKMULTISIG\n```\n\n**解锁脚本\
  \ (ScriptSig)：**\n```\n<signature1> <signature2> ... <signaturem>\n```\n\n**条件：**\
  \ 提供的 `n` 个签名中，至少有 `m` 个有效签名才能花费。\n\n**多重签名钱包的实际案例：**\n\n*   **用例：** 创建一个需要多方签名才能进行任何交易的钱包。\n\
  *   **锁定脚本 (ScriptPubKey)：**\n    ```\n    <2> <pubKeyA> <pubKeyB> <pubKeyC> <3>\
  \ OP_CHECKMULTISIG\n    ```\n*   **解锁脚本 (ScriptSig)：**\n    ```\n    <sigA> <sigB>\n\
  \    ```\n\n在此示例中，钱包中的资金被锁定为 2-of-3 多重签名条件。要花费比特币，三位私钥持有者（A、B 和 C）中至少有两位必须提供有效签名。\n\
  \n比特币的脚本系统允许各种条件和逻辑，支持除简单转账之外的更复杂花费条件。这种灵活性对于实现智能合约和复杂多重签名钱包等高级功能至关重要。\n\n## 多重签名地址\n\
  \n多重签名地址是一种特殊类型的比特币地址，访问资金需要多个私钥。多重签名地址是提高比特币交易安全性的重要工具，因为它们为防止未经授权的访问和盗窃提供了额外的保护层。\n\
  \n在本节中，我们将详细探讨多重签名地址，包括其工作原理、提供的优势以及实际应用示例。\n\n### 多重签名地址的工作原理\n\n从本质上讲，多重签名地址就是一个与多个公钥关联的比特币地址。要访问存储在该地址中的资金，必须提供多个私钥。解锁地址所需的密钥数量因具体实现而异，但通常在两到四个之间。\n\
  \n创建多重签名地址的过程相对简单。首先，参与交易的用户必须就解锁地址所需的密钥数量以及将与该地址关联的特定公钥达成一致。完成后，用户可以使用专用软件工具生成一个包含指定公钥的新多重签名地址。\n\
  \n当用户想要向多重签名地址发送比特币时，他们必须提供解锁该地址所需数量的私钥。例如，如果一个多重签名地址需要三个私钥才能访问资金，则必须提供所有三个密钥才能完成交易。此过程确保多方必须同意交易才能执行，从而大大降低了未经授权访问或盗窃的风险。\n\
  \n创建多重签名地址涉及一系列步骤，以及使用多个密钥对交易进行签名和验证的过程。步骤如下：\n\n*   **选择签名者并设置参数：**\n    *   决定总共可能的签名者\
  \ (`n`) 中需要多少个 (`m`) 来完成一笔交易。\n    *   获取参与多重签名设置的每个签名者的公钥。\n*   **创建锁定脚本 (ScriptPubKey)：**\n\
  \    *   构建一个包含所需签名数量 (`m`)、公钥和密钥总数 (`n`) 的锁定脚本。\n    *   锁定脚本通常如下所示：`<m> <publicKey1>\
  \ <publicKey2> ... <publicKeyn> <n> OP_CHECKMULTISIG`。\n*   **生成多重签名地址：**\n    *\
  \   对锁定脚本进行哈希运算以创建唯一地址。\n*   **签名和验证交易：**\n    *   **构建花费交易：**\n        *   从多重签名地址花费时，像往常一样创建交易，但在解锁脚本中包含特定条件。\n\
  \    *   **创建解锁脚本 (ScriptSig)：**\n        *   为每个签名者生成唯一签名。\n        *   解锁脚本通常如下所示：`<signature1>\
  \ <signature2> ... <signaturem>`。\n    *   **组合签名并执行交易：**\n        *   组合签名者提供的所需数量签名\
  \ (`m`)。\n        *   使用组合后的签名执行交易。\n    *   **验证交易：**\n        *   网络根据锁定脚本验证交易。\n\
  \        *   如果组合签名满足指定条件（`n` 个中的 `m` 个），则交易有效。\n\n此过程确保仅当预定数量的授权签名者提供其签名时，交易才会执行。它通过要求多方达成共识来花费资金，从而增强了安全性。\n\
  \n### 多重签名地址的优势\n\n使用多重签名地址为用户提供了几项重要优势。也许最明显的优势是它们为比特币交易提供了额外的安全层。通过要求多个私钥才能访问存储在某地址中的资金，多重签名地址使得攻击者通过黑客攻击或其他手段窃取比特币变得更加困难。\n\
  \n多重签名地址的另一个关键优势是它们提供了一种实现复杂交易工作流的机制。例如，多重签名地址可用于要求在执行大额比特币交易前获得多方批准。此功能对于需要以安全且负责任的方式管理大量比特币持仓的企业和其他组织特别有用。\n\
  \n多重签名地址还为比特币交易提供了更高的灵活性和控制力。通过允许多方参与交易，用户可以确保所有相关方都有发言权来决定交易如何执行。这有助于减少争议和误解，并确保所有相关方对结果满意。\n\
  \n### 多重签名地址的使用示例\n\n有许多不同场景可以使用多重签名地址来提高比特币交易的安全性和效率。以下是几个示例：\n\n#### 冷存储\n\n多重签名地址的一个常见用例是为大量比特币持仓提供安全的存储解决方案。通过创建一个需要多个私钥才能访问的多重签名地址，用户可以确保其比特币持仓免受盗窃或其他形式的未经授权访问。\n\
  \n例如，一家公司可能会创建一个需要三个私钥才能访问的多重签名地址。第一个密钥可能由公司 CEO 持有，第二个密钥由公司 CFO 持有，第三个密钥由受信任的第三方托管服务持有。通过要求所有三个密钥才能访问资金，公司可以确保没有单个人能在未经多方批准的情况下访问资金。\n\
  \n#### 托管服务\n\n多重签名地址也可用于促进双方之间的安全交易。例如，托管服务可能会创建一个需要买方。\n\n## 个性化地址\n\n\n\n\n\n\
  ## 虚荣地址\n\n虚荣地址是一种定制的比特币地址，通过用户选择的特定单词、短语或模式创建。术语“**虚荣**”指的是该地址是出于美观或品牌推广目的而非安全目的而创建的。虚荣地址的创建涉及一个反复试错的过程，直到找到所需的模式。在本节中，我们将详细讨论什么是虚荣地址、它是如何创建的以及它的特殊特征。\n\
  \n虚荣地址是一种比特币地址，经过定制以包含用户选择的特定单词或模式。例如，用户可能希望创建一个以其姓名、公司名称或喜爱的单词开头的地址。创建虚荣地址的过程涉及生成大量公钥和私钥对，直到找到一个符合所需标准的密钥对。\n\
  \n虚荣地址本质上并不比常规比特币地址更安全。但是，它们确实为用户提供了一种创建独特、易记地址的方法，可用于品牌推广目的。例如，企业可能会创建一个包含其公司名称或口号的虚荣地址，这有助于建立其品牌并使其地址更具辨识度。\n\
  \n虚荣地址的创建涉及生成多个公钥和私钥对。然后检查公钥的前几个字符，看它们是否与用户选择的特定模式匹配。如果公钥符合标准，则使用相应的私钥生成比特币地址。如果不符合所需模式，则使用新的密钥对重复该过程。模式的复杂性会影响创建虚荣地址所需的时间。像“**Bitcoin**”这样的简单模式可能只需几分钟即可生成，而像公司口号这样更复杂的模式可能需要数小时甚至数天。\n\
  \n虚荣地址具有独特的特征，使其区别于常规比特币地址。它们经过个性化定制以满足用户选择的特定标准，使其更易记忆和辨识。它们可用于品牌推广目的，允许企业创建包含其公司名称或口号的地址，从而建立品牌并使其地址更具辨识度。创建虚荣地址需要大量的反复试错。该过程可能耗时较长，并且可能需要相当大的计算能力，具体取决于所需模式的复杂性。然而，虚荣地址并不比常规比特币地址提供额外的安全性。\n\
  \n例如，假设 **Alice** 想要创建一个以单词“**crypto**”开头的虚荣地址。Alice 首先生成大量公钥和私钥对。然后她检查每个公钥的前几个字符，看是否与所需模式匹配。经过数小时的生成密钥对和检查所需模式后，Alice\
  \ 最终发现了一个以单词“**crypto**”开头的公钥。她使用相应的私钥生成可用于交易的比特币地址。\n\n生成虚荣地址涉及一个反复试错的过程，用户尝试在加密货币地址中找到特定的模式或字符。该过程计算密集，因为它需要生成大量加密密钥对并对其进行哈希运算，直到找到匹配项。所需模式越复杂或越长，所需的计算能力和时间就越多。\n\
  \n生成虚荣地址的潜在安全风险包括：\n\n- **资源密集性**：虚荣地址生成可能非常消耗资源，需要大量的计算能力。这可能导致高昂的电力成本或漫长的处理时间。\n\
  - **密钥安全性**：虚荣地址的安全性取决于加密密钥对的强度。如果密钥生成过程不安全，存在弱密钥的风险，这些弱密钥可能容易受到攻击。\n- **隐私顾虑**：虚荣地址是定制的，这使得它们可能被追溯到生成它们的用户。如果隐私是一个考量因素，用户在将特定模式与其身份关联时应保持谨慎。\n\
  - **软件风险**：使用不可靠或恶意的软件进行虚荣地址生成会带来安全风险。用户应依赖信誉良好的工具并遵循最佳实践以减轻这些风险。\n\n# 比特币钱包\n\n\
  比特币是一种在点对点网络上运行的去中心化数字货币。要使用比特币，用户必须拥有一个比特币钱包，这是一个存储访问和管理其比特币资金所需私钥的软件程序。比特币钱包有几种类型，每种都有其独特的功能和特征。桌面钱包、移动钱包、网页钱包和硬件钱包是最常见的比特币钱包类型。\n\
  \n桌面钱包是可以下载并安装在台式计算机上的软件程序。它们通常比网页钱包更安全，因为它们不易受到黑客攻击。`Electrum`、`Exodus` 和 `Bitcoin\
  \ Core` 是流行的桌面钱包。\n\n移动钱包专为智能手机和平板电脑设计。它们提供便利性和便携性，可通过扫描二维码在实体店进行支付。`Mycelium`、`Bread\
  \ wallet` 和 `Co-pay` 是流行的移动钱包。\n\n网页钱包是在线服务，允许用户将比特币资金存储在云端。它们通常比桌面或移动钱包不安全，因为它们容易受到黑客攻击。`Coinbase`、`Blockchain.info`\
  \ 和 `BitGo` 是流行的网页钱包。\n\n硬件钱包是设计用于存储访问和管理比特币资金所需私钥的物理设备。它们被认为是最安全的比特币钱包类型，因为它们不易受到黑客攻击。`Trezor`、`Ledger\
  \ Nano S` 和 `KeepKey` 是流行的硬件钱包。\n\n比特币钱包提供了几项旨在增强安全性、隐私性和可用性的功能。私钥用于签署交易并证明比特币资金的所有权。地址管理对于维护隐私和安全非常重要，因为它允许用户为每笔交易使用不同的地址。请参阅下图：\n\
  \n![](img/Figure_3.9.jpg)\n\n私钥长达 256 位，这使得它们不适合用于存储、交易和保护您的资金。这就是为什么它们受保护于比特币钱包中，钱包会在交易时自动激活它们，并与公钥配对使用。当您创建比特币钱包时，会自动生成一个种子或恢复短语，以便在您失去对私钥的访问权限时恢复资金。种子、助记词或恢复短语是由\
  \ 12 个或 24 个单词组成的序列，将用于生成您发送和接收比特币所需的任何比特币密钥。\n\n根据情况和需求，存在不同类型的比特币钱包。在决定选择适合用途的钱包时应非常小心，特别是由第三方控制的托管钱包。强烈建议您遵循以下指南，以避免昂贵的错误和资金丢失的风险：\n\
  \n- 除非您是高级用户并了解所涉及的风险，否则请勿使用纸钱包。\n- 大量比特币最好存储在多签钱包中。\n- 请记住为您的继承人或相应受益人设置恢复说明。\n\
  - 请勿使用不提供恢复数据的钱包。\n\n\n\n\n\n# 交易历史与比特币钱包最佳实践\n\n交易历史用于记录所有交易，包括发送和接收的金额、交易的日期和时间以及交易费用。加密技术用于保护私钥和交易数据免受未经授权的访问。使用比特币钱包需要一定的知识和对其工作原理的理解。以下是使用比特币钱包的一些最佳实践：\n\
  \n- **使用硬件钱包**：硬件钱包被认为是最安全的比特币钱包类型。如果您重视比特币安全，请考虑投资一款硬件钱包。\n- **使用强密码**：为您的比特币钱包创建密码时，请使用强且唯一、不易被猜测的密码。避免使用常见单词或短语，并使用字母、数字和符号的组合。\n\
  - **妥善保管私钥**：您的私钥是访问比特币资金最重要的信息。请将其存放在安全的地方，例如硬件钱包或安全的离线位置，以确保其安全。\n- **备份您的钱包**：定期备份您的钱包，以防数据丢失或被盗。将备份存储在安全的位置，例如硬件钱包或加密的\
  \ USB 驱动器中。\n- **保持软件更新**：保持您的比特币钱包软件为最新版本，以确保您拥有最新的安全补丁和错误修复。这将有助于防止黑客攻击，保障您的比特币资金安全。\n\
  \n## 比特币 HD 钱包\n\n比特币分层确定性（HD）钱包是一种使用单一种子生成无限数量私钥的钱包类型。这是通过使用先进的加密算法为每笔交易生成唯一私钥来实现的。HD\
  \ 钱包的主要优势在于它消除了多次备份的需求，并降低了因硬件故障或盗窃而导致比特币丢失的风险。\n\n比特币 HD 钱包中最常用的技术是比特币改进提案 32（`BIP32`），它提供了一套创建分层确定性钱包的指南。`BIP32`\
  \ 规定使用主密钥，即一个用于生成所有后续私钥的 256 位随机数。它还定义了一套从主密钥生成私钥的规则，包括使用 `HMAC-SHA512`，这是一种基于哈希的消息认证码，用于确保密钥的完整性。\n\
  \n比特币 HD 钱包中使用的另一项技术是 `BIP39`，它提供了一套创建助记词的指南，助记词可用于生成主密钥。助记词是一串随机生成且易于记忆的单词序列。这使得用户可以通过记录助记词并将其妥善保管来轻松备份钱包。\n\
  \n请参阅下表：\n\n| 钱包类型 | 描述 | 安全性 | 易用性 | 匿名性 |\n| --- | --- | --- | --- | --- |\n|\
  \ 硬件钱包 | 用于离线存储私钥的物理设备。 | 高 | 中等 | 高 |\n| 软件钱包（桌面端） | 安装在台式机或笔记本电脑上的软件。 | 取决于计算机安全性。\
  \ | 容易 | 中等 |\n| 软件钱包（移动端） | 移动设备上的钱包应用。 | 取决于设备安全性。 | 容易且便携 | 中等 |\n| 网页钱包 | 通过网页浏览器访问的钱包。\
  \ | 取决于平台安全性。 | 方便但安全性较低 | 低到中等 |\n| 纸钱包 | 打印或书写在纸上的私钥和公钥。 | 如果安全生成并妥善保管物理介质，则安全性高。\
  \ | 低（交易需手动输入） | 高 |\n| 脑钱包 | 基于用户记忆的密码短语生成密钥。 | 高（取决于密码短语强度） | 高 | 低 |\n| 多重签名钱包\
  \ | 需要多个私钥来授权一笔交易。 | 高（取决于密钥的数量和安全性） | 中等到高 | 取决于设置 |\n| 确定性钱包 | 使用种子生成一系列密钥对。 |\
  \ 高（前提是种子保持安全） | 中等 | 中等 |\n\n表 3.1：不同类型的钱包\n\n## 从种子创建 HD 钱包\n\n要从种子创建 HD 钱包，用户需要遵循一系列步骤，包括生成主密钥、生成助记词以及派生私钥和公钥。第一步是生成主密钥，这是一个用于生成所有后续私钥的\
  \ 256 位随机数。这可以通过实现 `BIP32` 标准的软件工具来完成。\n\n第二步是生成助记词，这是一串随机生成且易于记忆的单词序列。这也可以通过实现\
  \ `BIP39` 标准的软件工具来完成。用户应将助记词记录下来并存放在安全的地方，因为它可用于恢复主密钥和所有后续私钥。\n\n最后一步是从主密钥派生私钥和公钥。这可以通过实现\
  \ `BIP32` 标准的软件工具来完成。然后用户可以使用私钥对交易进行签名，使用公钥接收比特币。\n\n### 派生私有子密钥\n\n要在比特币钱包中生成私钥，首先需要生成种子。该种子是一个随机生成的\
  \ 256 位数字，作为生成主私钥的基础。然后使用主私钥生成一系列子私钥，这些子私钥用于对交易进行签名。\n\n在比特币钱包中生成私钥的过程包括以下步骤：\n\n\
  1. **生成种子**：使用安全随机数生成器创建一个 256 位随机数种子。种子对于生成主私钥至关重要。重要的是要确保所使用的随机数生成器是安全的，以消除可预测性并保持从中派生的私钥的安全性。\n\
  2. **生成主私钥**：要生成主私钥，将种子作为输入传入密钥派生函数。该函数根据种子生成一系列伪随机数。第一个伪随机数被选为主私钥。在比特币中，用于生成主私钥的密钥派生函数称为\
  \ `BIP32`，这是一种分层确定性钱包的标准。\n3. **生成子私钥**：第三步涉及从主私钥生成一系列子私钥。使用 HD 密钥派生来实现这一点。HD 密钥派生允许从单个主私钥生成大量私钥。\n\
  \n在比特币中，通过 HD 密钥派生生成一系列子私钥。每个子私钥都是通过将主私钥与唯一的索引号相结合来生成的。这将为每个索引号生成一个唯一的私钥，可用于对该特定索引的交易进行签名。\n\
  \n总之，要在比特币钱包中派生私钥，需使用安全随机数生成器生成一个 256 位种子。将种子作为输入传入密钥派生函数以生成主私钥，然后通过分层确定性密钥派生使用主私钥生成一系列子私钥。\n\
  \n### 派生公有子密钥\n\n为了在比特币钱包中派生公钥，我们需要从私钥开始。私钥是一个使用先进加密算法生成的 256 位数字。\n\n公钥是通过使用 `ECC`\
  \ 从私钥派生出来的。\n\n\n\n\n\n# ECC\n\nECC 是一种用于创建和验证数字签名的数学算法。它基于椭圆曲线的特性，椭圆曲线是光滑、连续的曲线，可用于在二维平面上生成点。该曲线由一组数学参数定义，包括一个素数、一个基点和一个系数。\n\
  \n## 从私钥推导公钥\n\n要在比特币钱包中从私钥推导公钥，我们需要遵循以下步骤：\n\n1. **生成一个随机数**：随机数是一个用于在椭圆曲线上生成唯一点的随机数字。在比特币中，随机数是使用确定性算法生成的，这意味着对于相同的私钥，每次都会生成相同的随机数。\n\
  \n2. **在椭圆曲线上生成一个点**：要在椭圆曲线上生成一个点，我们将私钥和随机数作为输入代入椭圆曲线方程。该方程定义为：\n\n```\ny² = x³\
  \ + ax + b\n```\n\n其中 `a` 和 `b` 是曲线的参数。我们代入 `a` 和 `b` 的值，以及随机数的 x 坐标和私钥，并求解 `y`。生成的点即为椭圆曲线上的一个点。\n\
  \n3. **将 X 坐标转换为公钥**：要将椭圆曲线上点的 x 坐标转换为公钥，我们需要执行一系列数学运算。首先，我们在 x 坐标前添加一个前缀，以指示 y\
  \ 坐标是偶数还是奇数。然后使用 `SHA-256` 算法对结果进行哈希。最后，对哈希值应用 `RIPEMD-160` 算法以生成公钥。\n\n## 交易脚本\n\
  \n交易脚本是一组指令或规则，用于确定在区块链网络上执行交易的条件。脚本定义了发送方和接收方的要求，以及执行交易的条件。这些脚本用特定于区块链网络的编程语言编写，并由网络上的节点执行。\n\
  \n在比特币中，交易脚本是用一种称为 **Script** 的脚本语言编写的。Script 是一种简单的基于栈的语言，允许为执行交易定义复杂的条件。Script\
  \ 用于定义花费交易输出的条件。交易的输出通过脚本锁定，该脚本包含必须满足的指令，以解锁输出并花费资金。\n\n脚本附加在交易的输出上，当新交易提交到网络时，网络上的节点会对其进行求值。节点在验证并将交易添加到区块链之前，会检查脚本条件是否已满足。\n\
  \n脚本语言是一种功能有限的编程语言，具有一组预定义的可对数据执行的操作。它的设计初衷是为了简单，以降低出错风险并维护区块链网络的安全性。脚本语言中可用的一些操作包括：\n\
  \n* **算术操作**：这些是基本的数学运算，如加法、减法、乘法和除法。\n* **比较操作**：这些是用于比较数据值的操作，如相等、大于、小于和不等。\n\
  * **逻辑操作**：这些是用于执行逻辑运算的操作，如与、或和非。\n* **条件操作**：这些是用于定义执行特定脚本条件的操作。\n\n交易脚本负责验证交易，并用于确保只有授权方才能花费资金。脚本可以指定各种条件，包括发送方和接收方的公钥、交易金额和执行时间。必须满足这些条件，交易才能成功执行。\n\
  \n在比特币中，交易脚本用于实现多种功能，如多重签名交易、时间锁定交易和多方交易。多重签名交易需要不止一个签名才能花费资金，而时间锁定交易要求在交易可执行之前必须经过特定时期。交易脚本还可用于实现智能合约，智能合约是自动执行的合约，可自动化合约协议的谈判和执行。智能合约使用交易脚本来定义执行合约的条件。\n\
  \n交易脚本的局限性之一是它仅限于一组预定义的操作。这意味着它无法执行复杂操作，例如从外部来源访问数据或与外部系统交互。然而，这种限制是有意为之，因为它有助于维护区块链网络的安全性和稳定性。\n\
  \n### 基于栈的架构\n\n比特币脚本语言中的基于栈的架构在区块链上执行交易的方式中起着基础性作用。以下是对基于栈特性的更详细探讨。\n\n#### 数据存储\n\
  \n比特币的脚本在一种称为栈的数据结构上运行。栈是一种后进先出（LIFO）的数据结构，数据元素只能从顶部添加或移除。\n\n#### 脚本执行\n\n* 在脚本执行期间，数据元素被压入栈，并使用栈顶元素执行操作。\n\
  * 脚本中的指令通过压入或弹出数据元素来操作栈，从而创建一个动态且不断演变的结构。\n\n#### 操作\n\n* 脚本操作包括算术、比较、逻辑和条件操作，每种操作都与栈交互。\n\
  * 例如，加法操作（`ADD`）会从栈中取出顶部的两个元素，将它们相加，并将结果压回栈中。\n\n#### 简洁性与安全性\n\n* 基于栈的方法简化了脚本语言，使其不易出错和产生漏洞。\n\
  * 有限的操作集确保了脚本简洁，减少了可能危及安全的复杂错误的可能性。\n\n### 与传统语言的比较\n\n* **无寄存器或内存**：与使用寄存器或内存进行数据存储和操作的传统编程语言不同，比特币的脚本完全依赖栈。这种极简主义方法符合比特币简洁和安全的目标。\n\
  * **脚本求值**：脚本求值涉及按顺序处理指令，根据正在执行的操作将数据压入栈或从栈中弹出。相比之下，传统语言可能会结合使用寄存器、内存和调用栈来执行。\n\
  * **安全重点**：基于栈的架构通过最小化脚本语言的复杂性来增强安全性。与内存访问或意外副作用相关的安全漏洞得以减少，从而增强了比特币脚本系统的稳健性。\n\
  * **交易验证**：在交易验证期间，节点通过在栈上执行操作来求值脚本。基于栈的模型确保只有满足指定条件的有效交易才能被添加到区块链中。\n\n理解基于栈的架构对开发者至关重要，因为它定义了脚本在比特币网络上如何被处理以及交易如何被验证。基于栈的方法的简洁性符合比特币的核心原则，强调在智能合约和交易脚本的执行中重视安全性和可靠性。\n\
  \n### 脚本地址\n\n\n\n\n\n# 比特币脚本地址\n\n比特币中使用的脚本语言称为**脚本**，它是一种简单的基于栈的语言，用于定义交易可以被花费的条件。脚本语言被设计为灵活且强大，可用于创建各种交易类型，包括多重签名交易、时间锁定交易等。\n\
  \n脚本地址是通过将公钥哈希与脚本相结合来创建的。公钥哈希是从公钥派生出的唯一标识符，用于识别交易的接收方。另一方面，脚本是一组必须满足的条件，以便花费发送到该地址的比特币。脚本地址可为各种不同目的创建，例如用于多重签名交易、时间锁定交易等。\n\
  \n## 付款至公钥哈希 (P2PKH)\n\n最常见的脚本地址类型之一是**付款至公钥哈希 (P2PKH)** 地址。这种类型的地址用于将比特币发送给拥有与特定哈希相关联的公钥的接收方。当有人向\
  \ P2PKH 地址发送比特币时，实际上是将比特币锁定在一个脚本中，该脚本要求接收方提供与其公钥匹配的签名才能花费它们。这确保了只有预期的接收方可以花费比特币，使其成为一种安全的发送和接收比特币的方式。\n\
  \n## 付款至脚本哈希 (P2SH)\n\n另一种脚本地址类型是**付款至脚本哈希 (P2SH)** 地址。P2SH 地址用于将比特币发送给脚本，而不是公钥哈希。在这种情况下，脚本通常是一个多重签名脚本，需要多个签名才能花费比特币。P2SH\
  \ 地址常用于托管服务等场景，其中多方必须同意才能释放资金。这种类型的脚本地址为交易增加了额外的安全性和信任层。\n\n## 高级用例\n\n脚本地址还可用于更复杂的交易类型，例如**时间锁定交易**。在时间锁定交易中，比特币被锁定在一个脚本中，要求经过一定时间后才能被花费。这种类型的交易可用于保险单或其他合同，这些合同要求经过一定时间后才能释放资金。时间锁定交易也可用于众筹等场景，仅当达到特定目标时才释放资金。\n\
  \n## 优势与缺点\n\n脚本地址的主要优势之一是其灵活性。它们可用于创建各种交易类型，这使其成为开发者和用户手中的强大工具。然而，它们也带来了一些潜在缺点。由于它们比传统地址更复杂，因此对于初学者来说可能更难使用。此外，它们的使用成本也可能更高，因为它们需要在区块链上占用更多空间来存储。\n\
  \n## 结论\n\n总之，脚本地址是比特币生态系统的重要组成部分。它们允许用户执行各种交易类型，并为开发者提供了灵活且强大的工具。虽然它们可能比传统地址更复杂且使用成本更高，但其优势使其成为比特币网络的宝贵补充。随着比特币的持续演进和主流采用，脚本地址将在数字金融的未来发挥越来越重要的作用。\n\
  \n# 比特币挖矿\n\n比特币挖矿是比特币生态系统的关键组成部分，它是创建新比特币并在区块链上确认交易的过程。挖矿是一个竞争性过程，涉及解决复杂的数学问题，是比特币网络安全性和稳定性的关键部分。在本节中，我们将深入探讨比特币挖矿的历史、工作原理、背后的困难与麻烦，以及挖矿难度的计算方式。\n\
  \n比特币挖矿是一个关键过程，涉及将新交易添加到区块链，区块链作为所有比特币交易的公共账本。矿工负责验证和确认交易并将其添加到区块链。作为对其工作的补偿，矿工会获得新生成的比特币。挖矿过程涉及解决复杂的数学问题，最先解决该问题的矿工将获得比特币作为奖励。\n\
  \n挖矿的重要性怎么强调都不为过，因为它是为比特币网络提供安全性和稳定性的关键组件。挖矿确保交易得到确认，并以可预测的速率创建新比特币，这有助于维护网络的完整性。没有挖矿，比特币网络将无法正常运行，交易将无法被处理和验证。\n\
  \n近年来，由于对加密货币需求的增加，比特币挖矿获得了极大的关注。比特币的流行使得挖矿变得更具竞争性和挑战性。它需要先进的设备和巨大的算力，获取这些资源可能既昂贵又耗时。尽管存在这些挑战，对于愿意投入所需资源的人来说，挖矿仍然是一项必不可少且有利可图的活动。\n\
  \n比特币挖矿起源于加密货币的早期，自诞生以来已发生显著演变。在早期，任何拥有电脑和互联网连接的人都可以挖掘比特币。然而，随着网络规模扩大和更多矿工加入，该过程变得更具挑战性，并需要专用硬件。\n\
  \n挖矿难度随着网络**算力**的波动而不断变化。**算力**是解决挖矿所需数学问题所需计算能力的度量。当算力增加时，挖矿难度也会增加，使得挖掘比特币更加困难。同样，当算力下降时，挖矿难度也会降低，使挖矿变得更容易。\n\
  \n挖矿难度是通过一个公式计算的，该公式考虑了当前算力和解决一个区块所需的时间。比特币网络旨在维持恒定的出块速率，大约每十分钟创建一个新区块。为了实现这一点，挖矿难度每\
  \ **2016 个区块** 自动调整一次，大约每两周一次。\n\n尽管挖矿有其益处，但该过程也存在一些困难和麻烦。挖矿所需的高能耗一直是一个重大担忧，一些估计表明比特币挖矿消耗的电力超过一些小国家。挖矿的环境影响也一直是批评的焦点，人们对挖矿过程的碳足迹表示担忧。\n\
  \n## 比特币挖矿历史\n\n比特币挖矿于 **2009 年** 首次引入，当时比特币网络被创建。当时，挖矿是一个相对简单的过程，可以使用个人电脑或笔记本电脑完成。然而，随着比特币网络的增长和更多人开始挖矿，挖矿难度显著增加。\n\
  \n在比特币挖矿的早期，矿工每个区块可获得高达 **50 枚比特币** 的奖励。然而，随着流通中比特币数量的增加，挖掘一个区块的奖励减少了。\n\n如今，矿工每挖掘一个区块可获得\
  \ **6.25 枚比特币** 的奖励。\n\n随着比特币网络的增长，挖矿的复杂性也随之增加。如今，挖矿需要专用的硬件和软件，这是一个高度竞争的过程，由位于电力廉价地区的大型挖矿运营主导。\n\
  \n## 比特币挖矿的工作原理\n\n\n\n\n\n# 比特币挖矿：流程、挑战与硬件演进\n\n## 挖矿流程\n\n比特币挖矿是一个涉及解决复杂数学问题的复杂过程。这些问题被设计为难以求解，且需要大量的计算能力来解决。矿工使用称为专用集成电路（ASIC）的专用硬件来解决这些问题。\n\
  \n挖矿流程的第一步是将交易收集到一个区块中。一旦组装好一个交易区块，矿工们就会竞争解决一个数学问题。该问题被设计为难以求解，要求矿工在找到正确答案之前进行大量尝试。\n\
  \n当一名矿工解决该问题时，他们会向网络广播其解决方案，其他矿工会检查以确保解决方案正确。一旦解决方案经过验证，解决该问题的矿工将获得比特币奖励。\n\n##\
  \ 比特币挖矿背后的困难与麻烦\n\n比特币挖矿是一个复杂且竞争激烈的过程，伴随着许多困难和麻烦。\n\n*   **电力成本**：矿工面临的最大挑战之一是电力成本。挖矿需要消耗大量能源，电费可能会吞噬矿工的利润。\n\
  *   **挖矿流程的复杂性**：矿工面临的另一个挑战是挖矿流程的复杂性。随着比特币网络的发展，挖矿难度显著增加，个人矿工现在几乎无法与大型挖矿运营商竞争。\n\
  *   **环境担忧**：除了这些挑战，比特币挖矿还引发环境担忧。挖矿需要消耗大量能源，而这些能源通常通过燃烧化石燃料产生。因此，挖矿常与高碳排放联系在一起。\n\
  \n## 环境影响与能源消耗\n\n### 能源消耗\n\n*   比特币挖矿涉及解决复杂的数学谜题以验证交易并将新区块添加到区块链。\n*   比特币采用的\
  \ PoW（工作量证明）共识机制要求矿工通过解决这些谜题进行竞争，这需要巨大的计算能力。\n*   比特币挖矿的能源消耗巨大，估算数值不一。它常被拿来与整个国家的能源消耗相比较。\n\
  \n### 碳足迹\n\n*   比特币挖矿的环境影响主要归因于发电相关的碳足迹。\n*   挖矿运营通常依赖化石燃料，导致温室气体排放。\n\n### 全球对比\n\
  \n*   比特币的年能源消耗已被比作一些小国家，引发了对其环境可持续性的担忧。\n\n### 可再生能源整合\n\n*   部分挖矿运营旨在通过使用太阳能或水电等可再生能源来减轻环境影响。\n\
  \n### 中国禁止比特币挖矿\n\n#### 政府打击\n\n*   中国曾是全球比特币挖矿行业的主导者，承载了相当大比例的挖矿运营。\n*   2021 年，中国政府以环境担忧和金融风险为由，实施了加密货币挖矿禁令。\n\
  \n#### 挖矿大迁徙\n\n*   该禁令导致挖矿运营大规模撤离中国，影响了全球挖矿活动的分布。\n\n#### 电费上调\n\n*   中国部分地区上调了加密货币挖矿的电价，进一步抑制了这些活动。\n\
  *   此举旨在缓解当地电网压力，并减少与挖矿相关的环境影响。\n\n#### 全球挖矿格局的转变\n\n*   禁令促使矿工迁往监管环境更友好、清洁能源获取更便利的其他国家。\n\
  *   这种转变促成了全球比特币挖矿格局的重新分布。\n\n### 对比特币环境认知的影响\n\n*   **可持续性辩论**：中国的举措助长了关于比特币及其\
  \ PoW 共识机制环境可持续性的持续辩论。\n*   **替代方案的呼声**：环境担忧加剧了对替代共识机制的呼吁，例如权益证明（PoS），后者被认为更节能。\n\
  *   **行业创新**：环境影响带来的挑战刺激了加密货币行业内的创新，以探索和实施更环保的技术和共识机制。\n\n## 比特币挖矿硬件的演进\n\n### CPU\
  \ 挖矿时代\n\n*   在比特币早期（约 2009 年），挖矿可使用个人电脑中常见的中央处理器（CPU）进行。\n*   随着挖矿算法复杂度的增加，CPU\
  \ 很快落后，变得低效且缓慢。\n\n### GPU 挖矿时代\n\n*   矿工转向图形处理单元（GPU），因其提供并行处理能力，显著提升了挖矿速度。\n*\
  \   因较 CPU 效率更高，GPU 挖矿成为常态。\n\n### FPGA 挖矿（现场可编程门阵列）\n\n*   矿工随后尝试使用 FPGA，它允许在编程和优化挖矿算法方面更具灵活性。\n\
  *   FPGA 比 GPU 更节能，但仍面临新兴技术的竞争。\n\n### 专用集成电路（ASIC）挖矿\n\n*   ASIC 的引入标志着挖矿格局的重大转变。\n\
  *   ASIC 是专为比特币挖矿定制设计的芯片。\n*   ASIC 的效率超越了之前的硬件，提供了前所未有的算力和能效。\n*   这一进步使其他挖矿硬件过时，将挖矿算力集中在拥有\
  \ ASIC 者手中。\n\n### ASIC 统治地位\n\n*   目前，ASIC 主导比特币挖矿行业。它们专为比特币挖矿中使用的 SHA-256 算法哈希运算而构建。\n\
  *   ASIC 在处理速度和能耗方面均极高效，但其生产和使用的中心化引发了对挖矿算力去中心化的担忧。\n\n### 硬件发展时间线\n\n*   **CPU\
  \ 时代（2009-2010）**：比特币挖矿始于 CPU，为网络奠定了基础。\n*   **GPU 时代（2010-2013）**：矿工采用 GPU，提供了更强的挖矿能力。\n\
  *   **FPGA 时代（2011-2013）**：FPGA 在 GPU 和 ASIC 之间提供了一个中间地带，效率更高。\n*   **ASIC 时代（2013-至今）**：ASIC\
  \ 彻底改变了比特币挖矿，凭借前所未有的速度和效率主导了格局。\n\n### 挖矿周期与减半事件\n\n*   比特币大约每四年经历一次减半事件，减少矿工成功挖出一个区块获得的奖励。\n\
  *   奖励起始为每区块 50 BTC，已减半数次，截至 2020 年最近一次减半，达到每区块 6.25 BTC。\n*   挖矿周期受挖矿硬件效率、电力成本和整体网络算率等因素影响。\n\
  \n### 市场动态\n\n*   比特币挖矿硬件市场充满活力，效率持续创新和改进。\n*   市场趋势受技术进步、监管发展及加密货币生态系统整体健康状况影响。\n\
  \n总之，比特币挖矿硬件的演进反映了行业对效率和速度的不懈追求。从早期的 CPU 挖矿到目前 ASIC 的统治地位，格局发生了重大变迁。持续的创新旨在解决中心化和能耗问题，以追求更可持续、更去中心化的挖矿生态系统。\n\
  \n# 区块结构\n\n在加密货币世界中，区块在区块链网络的运行中扮演关键角色。区块是一组打包在一起并添加到区块链的交易集合。区块的基本结构可通过图 3.10\
  \ 理解：\n\n![](img/Figure_3.10.jpg)\n\n\n\n\n\n# 区块要点\n\n关于区块的几点要点如下：\n\n* 区块指一次性发生的大量交易。\n\
  * 交易所通常将区块定义为超过 10,000 股的股票交易，或名义价值超过 200,000 美元的交易。\n* 区块交易有时在公开市场之外进行，以减轻对证券价格的影响。\n\
  * 为避免影响市场价格，大额区块订单可能会被拆分为较小的订单，并通过不同的经纪商执行，以掩盖真实规模。\n\n# 区块结构\n\n区块具有特定的结构，这对于维护网络的安全性和完整性非常重要。区块的结构可以分解为几个关键要素。\n\
  \n## 区块头\n\n第一个组件是**区块头**，它包含有关区块的信息，例如版本号、前一个区块哈希、时间戳和难度目标。区块头是一个始终包含在区块中的 80 字节部分。\n\
  \n## 交易计数器\n\n另一个要素是**交易计数器**，它决定了区块中的交易数量。\n\n## 交易列表\n\n随后是交易列表本身，其大小和复杂性可能因区块链网络而异。\n\
  \n## 默克尔树\n\n区块的另一个重要要素是**默克尔树**，这是一种用于验证区块中交易完整性的数学结构。默克尔树通过获取区块中的所有交易并单独对它们进行哈希运算来构建。然后将这些哈希值配对并再次哈希，重复该过程，直到只剩下一个哈希值。这个最终的哈希值称为**默克尔根**，它包含在区块头中。\n\
  \n## Nonce\n\n区块结构还包括一个 **nonce**，这是一个添加到区块头中的随机数，用于使区块哈希达到特定目的。该目标由网络的难度级别决定，难度级别会定期调整，以确保区块以恒定速率添加到区块链中。\n\
  \n所有这些组件组合成一个完整的区块，然后添加到区块链中。区块通过一个称为**挖矿**的过程添加到区块链中，该过程涉及解决复杂的数学问题以创建新区块。\n\n\
  区块结构对于维护区块链网络的安全性和完整性非常重要。通过将前一个区块的哈希值添加到区块头中，区块链以安全且防篡改的方式创建了一个相互关联的区块链。默克尔树确保区块中的交易有效且未被篡改。\n\
  \n因此，区块结构是区块链网络（包括比特币和其他加密货币）的基础部分。区块由几个关键要素组成，包括区块头、交易计数器、交易列表、默克尔树和 nonce。通过理解区块的结构，我们可以更好地评估整个区块链网络的安全性和完整性。\n\
  \n# 区块头详解\n\n区块头是一个关键组件，作为抵御欺诈或无效交易的第一道防线。以太坊区块的头部包含不同的元数据字段，如下所示：\n\n* **前一个区块的哈希**：每个区块头都提供关于前一个（父）区块的信息。此字段包含前一个区块的哈希值，该引用连接了所有区块。此字段的大小为\
  \ 32 字节。\n* **版本**：此字段存储版本号以显示软件升级。版本字段的大小为 4 字节。\n* **难度**：区块创建时的挖矿难度存储在此字段中。挖矿的概念将在后续文章中解释。其大小为\
  \ 4 字节。\n* **时间戳**：此字段包含区块创建的时间。此字段的大小为 4 字节。\n* **Nonce**：nonce 是在区块挖矿期间使用的值。此字段的大小也是\
  \ 4 字节。\n* **默克尔树根**：默克尔树是从区块的交易数据哈希获得的结构。该树的根存储在区块头的此字段下。默克尔树根字段的大小为 32 字节。\n\n\
  图 3.11 直观地展示了区块头：\n\n![](img/Figure_3.11.jpg)\n\n区块头是区块链的关键组件。它用于识别和验证特定区块的内容，并包含一系列信息，包括其大小、版本、时间戳和其他关键细节。区块头只是附加在交易区块上的一个元数据片段，包含各种字段，每个字段都有特定用途。这些字段包括区块版本号、前一个区块哈希、默克尔根哈希、时间戳、目标值和\
  \ nonce。\n\n**区块版本号**用于识别区块的格式。随着比特币协议随时间演进，引入了新版本的区块格式，每个版本都包含新字段和功能，以提高区块链的安全性和可靠性。**前一个区块哈希**作为其前一个区块的唯一标识符。此哈希值通过获取前一个区块头的\
  \ SHA-256 哈希生成，并用于将区块链中的每个区块链接到其前一个区块。\n\n**默克尔根哈希**用于验证区块的内容。它通过使用一种称为默克尔树的特殊算法，将区块中包含的所有交易哈希在一起生成。默克尔根哈希提供了一种快速有效的方法，来验证区块中的所有交易都是有效且未被篡改的。\n\
  \n**时间戳字段**用于记录区块创建的时间。此时间戳对于多种原因都很重要，包括帮助防止双重支付攻击，并提供一种跟踪区块链随时间演变的方式。**目标字段**用于调整比特币网络上挖掘新区块的难度。此字段每\
  \ 2016 个区块更新一次（大约每两周），用于维持恒定的区块创建速率。\n\n最后，**nonce 字段**由矿工用来尝试解决创建新区块所需的数学难题。此字段本质上是一个随机数，矿工可以更改它以尝试找到满足目标难度级别的哈希值。通过反复更改\
  \ nonce，矿工能够有效地通过暴力破解方式解决创建新区块所需的复杂数学问题。\n\n# 创世区块\n\n**创世区块**是加密货币（包括比特币）区块链中的第一个区块。它是整个区块链构建的基础。创世区块作为区块链的起点，所有后续区块都构建在其之上。\n\
  \n创世区块的独特之处在于它没有前一个区块可供引用。这意味着其区块头中的前一个区块哈希全为零，使其区别于区块链中的所有其他区块，如图 3.12 所示：\n\n\
  ![](img/Figure_3.12.jpg)\n\n创世区块的创建是加密货币历史上的一个重要里程碑。它代表了一种新型去中心化、点对点货币的诞生，该货币独立于任何中央权威运行。创世区块包含比特币网络上的第一笔交易，即给予区块创建者（称为中本聪）的\
  \ 50 个比特币奖励。\n\n创世区块的结构与区块链中所有其他区块相似。它包含一个区块头，其中包括版本号、时间戳、对前一个区块哈希的引用（创世区块的情况下全为零）、默克尔根哈希和\
  \ nonce。\n\n\n\n\nMerkle 根哈希是区块中所有交易的加密哈希值。该哈希值用于确保区块中的交易有效且未被篡改。Nonce（随机数）是一个 32\
  \ 位的值，用于挖矿过程以寻找区块头的有效哈希值。\n\n请参考图 3.13 了解创世区块的结构：\n\n![](img/Figure_3.13.jpg)\n\n\
  创世区块的创建是加密货币发展历程中的关键里程碑，因为它代表了一种新型去中心化点对点货币的诞生。创世区块作为比特币区块链的起点，所有后续区块均构建在其之上。其结构与区块链中所有其他区块相似，包含一个区块头，其中包含各种信息，包括\
  \ Merkle 根哈希和 nonce。\n\n### 区块链接\n\n区块链接是指在区块链网络中连接各个数据区块的过程。区块链中的每个区块都包含一组以安全且防篡改方式记录的交易或数据。这些区块随后按特定顺序链接在一起，形成区块链或区块链。区块链中的区块链接是通过加密哈希实现的。区块链网络中的每个区块都包含一个使用加密算法生成的唯一哈希值。该哈希值基于区块的内容，且对该区块唯一。哈希值还用于将当前区块链接到链中的前一个区块。\n\
  \n比特币核心节点和 API 是比特币网络的基本方面，对于用户理解至关重要。\n\n以下是区块顺序时间流的简单工作原理：\n\n- **创世区块**：\n  -\
  \ 区块链中的第一个区块称为创世区块。\n  - 它是整个区块链的基础，不引用前一个区块，因为它之前没有区块。\n  - 创世区块通常包含一个独特的 Coinbase\
  \ 交易，其中包含特殊消息或引用。\n\n- **后续区块**：\n  - 每个后续区块都链接到前一个区块，形成一条链。\n  - 区块通过称为挖矿的过程按顺序添加到区块链中。\n\
  \n- **区块结构**：\n  - **区块头**：\n    - 包含元数据，如区块版本、时间戳和区块中所有交易的 Merkle 根。\n    - 包含对前一个区块哈希的引用，在区块之间创建链接。\n\
  \    - 区块头使用 `SHA-256` 算法进行哈希运算。\n  - **交易**：\n    - 一个区块包含一个交易列表，包括奖励矿工的 Coinbase\
  \ 交易和转移价值的常规交易。\n  - **Merkle 树**：\n    - Merkle 树结构用于高效汇总和验证区块中的交易。\n    - 树的叶子节点代表单个交易，每个非叶子节点都是其子节点的哈希值。\n\
  \n- **挖矿过程**：\n  - 矿工竞争解决加密谜题，寻找一个特定的 nonce 值，使其与区块头结合后产生的哈希值低于特定目标。\n  - 首个解出谜题的矿工向网络广播解决方案，其他节点验证该解决方案的有效性。\n\
  \n- **区块验证**：\n  - 网络上的节点验证区块的交易，确保其遵守共识规则。\n  - 区块头的哈希值必须低于目标值，以满足 PoW 要求。\n\n\
  - **传播**：\n  - 一旦区块被挖出并验证，它会被广播给网络中的所有节点。\n  - 节点更新其本地区块链副本，追加新区块。\n\n- **共识机制**：\n\
  \  - 共识机制确保网络中的所有节点就区块的有效性和顺序达成一致。\n  - 在比特币中，PoW 机制保障网络安全并决定哪个矿工有权添加下一个区块。\n\n\
  - **持续循环**：\n  - 该过程针对每个后续区块重复进行，矿工竞争寻找下一个有效区块并将其追加到现有区块链。\n\n- **区块链增长**：\n  -\
  \ 随着更多区块被添加，区块链线性增长，创建了一个不可变且有序的交易账本。\n\n- **减半事件**：\n  - 定期的减半事件会减少矿工成功挖出一个区块所获得的奖励。\n\
  \  - 这些事件大约每四年发生一次，影响网络的经济激励和供应动态。\n\n理解区块顺序的时间流有助于深入了解区块链系统的安全性和去中心化本质，强调了挖矿、共识机制以及区块链账本持续增长的作用。\n\
  \n## 全节点类型\n\n比特币网络中有两种类型的全节点：修剪节点和非修剪节点。修剪节点仅存储部分区块链数据，这降低了存储需求，但限制了其独立验证交易的能力；非修剪节点存储整个区块链，允许它们独立验证交易和区块。\n\
  \n### 比特币核心应用程序编程接口\n\n比特币核心应用程序编程接口（API）是一组软件接口，允许开发者与比特币网络交互。该 API 提供对比特币核心软件各种功能的访问，包括交易创建、验证和广播。API\
  \ 可用于开发与比特币网络交互的应用程序，如钱包、交易所和其他区块链相关服务。\n\n比特币核心 API 的一些关键特性包括：\n\n- **JSON-RPC\
  \ 接口**：API 使用远程过程调用（RPC）接口，允许远程访问比特币核心软件。该接口使用 JSON 格式在比特币核心节点和其他应用程序之间通信数据。\n-\
  \ **安全性**：比特币核心 API 在设计时充分考虑了安全性。它提供强大的身份验证机制和加密，以确保应用程序与比特币网络之间的交互安全。\n- **可定制性**：API\
  \ 允许开发者自定义其与比特币网络的交互。例如，开发者可以自定义交易费用、设置自定义区块过滤器和自定义网络参数。\n\n理解比特币核心节点和 API 对于任何想要使用、开发或与比特币网络交互的人来说都至关重要。不同类型的全节点提供不同级别的验证和存储需求。比特币核心\
  \ API 是一个强大的工具，为开发者提供对比特币网络的访问，并具有 JSON-RPC 接口、强大的安全性和可定制性选项等特性。\n\n## 点对点网络\n\n\
  点对点（P2P）网络架构是比特币和区块链技术的基本组成部分。P2P 网络是一种分布式网络，允许节点或对等方直接相互通信，而无需中央服务器。这可以通过图 3.14\
  \ 表示：\n\n![](img/Figure_3.14.jpg)\n\n在 P2P 网络中，每个节点既充当客户端又充当服务器，这意味着所有节点地位平等，都可以发起和响应请求。图\
  \ 3.15 解释了节点的工作原理：\n\n![](img/Figure_3.15.jpg)\n\n比特币网络是一个去中心化的 P2P 网络，使用户无需受信任的中介或中央权威即可发送和接收交易。\n\
  \n在 P2P 网络中，每个节点既可以充当客户端也可以充当服务器，这意味着它可以发起或响应通信请求。这创建了一个节点网络，节点之间可以共享资源和信息，而无需依赖中央服务器。\n\
  \n以下是区块链和比特币中 P2P 网络架构的一些关键特征：\n\n\n\n\n# P2P 网络架构特性\n\n- **去中心化**：P2P 网络架构完全去中心化，意味着不存在单一的控制点或权威。网络上的每个节点地位平等，拥有相同的权限。\n\
  - **共识机制**：为确保交易以安全透明的方式被验证和记录，P2P 网络架构采用共识机制。在比特币中，共识机制是 `PoW`，要求节点竞争解决复杂的数学问题以验证交易。\n\
  - **弹性/韧性**：P2P 网络对攻击或故障具有弹性，因为不存在中心控制点或单点故障。这意味着即使部分节点离线或受到攻击，网络仍能继续运行。\n- **隐私与安全**：P2P\
  \ 网络架构通过加密节点间的通信，并使用公钥加密确保交易安全，可提供高水平的隐私和安全保障。\n- **可扩展性**：P2P 网络架构具有高度可扩展性，因为新节点可轻松加入网络并参与共识机制。这使网络能够增长并容纳大量参与者和交易。\n\
  \nP2P 网络架构实现了一个由节点网络维护的去中心化透明交易账本。当用户发起一笔交易时，它会被广播到网络，每个节点都会收到一份交易副本。随后，每个节点通过检查加密签名和其他细节来验证该交易。一旦某节点验证通过交易，便会将其广播给其对等节点，这一过程持续进行，直到网络上的每个节点都……\n\
  \n## 节点与角色\n\n在与区块链或比特币相关的 P2P 网络中，存在扮演不同角色的各类节点。这些节点是去中心化网络的基础构建模块，协同工作以维护系统的完整性与安全性。各类节点如下：\n\
  \n- **全节点**：全节点是区块链网络的骨干，负责验证交易并确保区块链保持最新状态。这些节点保存一份完整的区块链账本副本，使其能够独立验证交易和区块。\n\
  - **挖矿节点**：挖矿节点是参与将新交易添加到区块链过程的一种全节点。这些节点利用强大的算力资源与其他矿工竞争，解决复杂的数学难题并将新区块添加到区块链。\n\
  - **轻节点**：轻节点是全节点的简化版，仅存储区块链数据的一个小子集。这些节点依赖全节点来验证交易和区块，因此资源占用较少，但安全性也相对较低。\n- **超级节点**：超级节点是一种帮助促进网络中不同节点间通信的节点。这些节点充当枢纽，在其他节点间中继信息，提高网络的整体效率和速度。\n\
  \n除上述节点类型外，在与区块链或比特币相关的 P2P 网络中，节点还可扮演多种角色，包括：\n\n- **种子节点**：种子节点是一种超级节点，作为新节点加入网络时的初始联系点。这些节点维护网络中其他节点的列表，帮助新节点与现有节点建立连接。\n\
  - **主节点**：主节点是一种除基本交易验证外执行额外功能的全节点。这些节点通过提供额外的安全性和隐私层来保障网络安全，常用于去中心化金融（`DeFi`）等专业区块链应用中。\n\
  - **钱包节点**：钱包节点是一种存储私钥并允许用户发送和接收加密货币交易的轻节点。这些节点与全节点通信以验证交易并更新用户账户余额。\n\n总体而言，与区块链或比特币相关的\
  \ P2P 网络中涉及的不同类型节点和角色协同工作，共同创建了一个安全、透明且高效的去中心化系统。\n\n在点对点（P2P）区块链网络中，各类节点扮演不同角色，共同维护网络完整性与安全性。全节点作为骨干，独立验证交易并确保整个区块链的一致性。挖矿节点通过竞争性挖矿添加新区块，通过\
  \ `PoW` 共识为网络安全做贡献。轻节点作为全节点的简化版，依赖其资源密集型对应节点进行交易验证。超级节点充当高效通信枢纽，在节点间中继信息以提升整体网络速度。种子节点促进网络增长，作为新节点的初始联系点。主节点作为一种全节点，提供额外的安全性和隐私层，常用于\
  \ `DeFi` 等专业区块链应用。钱包节点存储私钥，允许用户收发加密货币，同时与全节点通信进行交易验证。这个错综复杂的节点网络协同确保了区块链生态系统的去中心化、高效性和用户可访问性。\n\
  \n请看下表：\n\n| 特性 | 全节点 | 挖矿节点 |\n| :--- | :--- | :--- |\n| 主要功能 | 验证并存储一份完整的区块链副本，确保其完整性。\
  \ | 验证交易并积极参与挖矿过程以创建新区块。 |\n| 区块创建 | 不参与区块创建过程。 | 积极参与挖矿以解决加密谜题，创建新区块。 |\n| 共识机制\
  \ | 通过验证和中继交易为共识做贡献。 | 通过解决 `PoW` 谜题、将新区块添加到区块链来为共识做贡献。 |\n| 奖励机制 | 通常，全节点不会因其活动获得直接奖励。\
  \ | 因成功挖出新区块而获得加密货币奖励（区块奖励和交易费）。 |\n| 资源强度 | 与挖矿节点相比，资源强度较低。 | 因挖矿活动所需的计算工作量大，资源强度较高。\
  \ |\n| 区块链存储 | 存储并维护完整的区块链账本。 | 存储区块链副本，但侧重于近期交易而非完整历史。 |\n| 参与挖矿 | 不主动参与挖矿过程。 |\
  \ 积极通过解决 `PoW` 谜题来验证并添加新区块到区块链。 |\n| 网络安全中的角色 | 通过验证和中继交易为整体安全做贡献。 | 通过挖矿过程和维护区块链完整性为安全做贡献。\
  \ |\n\n**表 3.2**：全节点与挖矿节点的区别\n\n## 基于激励的工程\n\n基于激励的工程是一种旨在设计和实现系统的方法，使参与者的利益朝着共同目标对齐。在区块链和比特币的背景下，这种方法用于激励网络参与者诚实行事，并为网络的安全性和功能性做出贡献。在点对点网络中，节点被激励参与网络并贡献其资源以维护网络完整性。就比特币而言，参与网络并执行验证交易和创建新区块所需计算工作的节点，将获得新铸造的比特币和交易费作为奖励。\n\
  \n\n\n\n基于激励的方法对比特币网络的安全性和可持续性至关重要。如果没有足够的激励，节点可能缺乏动力为网络贡献其资源，从而导致网络整体安全性和功能性的下降。\n\
  \n此外，基于激励的方法还有助于防止双重支付和 51% 攻击等恶意行为。在 51% 攻击中，恶意行为者获得网络大部分算力的控制权，并可操纵网络交易。然而，此类攻击成本高昂，需要大量的算力，使得大多数参与者在经济上无法承担。总而言之，这种方法通过将参与者的利益统一到共同目标，有助于确保网络的安全性和可持续性。\n\
  \n## 扩展比特币网络\n\n扩展比特币网络是指围绕核心比特币网络构建的各种服务、工具和技术的生态系统。这些包括钱包、交易所、矿池以及其他使用比特币网络作为底层基础设施的第三方应用程序。扩展比特币网络包含多个层级，每个层级都有其独特的参与者和服务集合。这些层级可以被可视化为一个栈，底层是比特币协议，其上依次为网络层、传输层，顶层为应用层。\n\
  \n栈的底部是比特币协议，它定义了交易如何被处理、验证并记录在区块链上的规则和程序。比特币协议由比特币网络的核心开发者维护，并不断演进以提升网络的安全性、可扩展性和功能性。\n\
  \n协议层之上是网络层，由构成比特币网络的节点组成。节点是运行比特币软件并相互通信以验证交易和传播区块的计算机。网络层还包括矿池，即协同工作以挖掘区块并赚取奖励的矿工群体。传输层位于网络层之上，负责在节点间传输数据。该层包括互联网，以及其他通信协议，如\
  \ `TCP/IP` 和 `UDP`。\n\n最后，栈的顶部是应用层，包含使用比特币网络的各种服务和应用程序。这些包括比特币钱包，允许用户存储和管理其比特币持仓；以及交易所，使用户能够用法币或其他加密货币买卖比特币。\n\
  \n使用比特币网络的其他应用和服务包括支付处理器、商户服务和区块链浏览器，它们提供关于交易状态和区块链状态的信息。扩展比特币网络是去中心化的，意味着没有单一实体控制它。相反，它由一组多样化的参与者和组织组成，共同促进其增长和发展。这种去中心化是比特币网络的关键特性之一，因为它使网络更能抵御攻击，并为用户提供更高的安全性。\n\
  \n## 比特币中继网络\n\n比特币中继网络是一个由计算机组成的网络，专门设计用于促进比特币网络中不同节点间的数据传输。它是一个点对点网络，有助于减少节点间传输数据所需的时间和资源，从而提高比特币网络的整体效率。\n\
  \n以下是关于比特币中继网络的一些重要知识点：\n\n*   **目的**：比特币中继网络的主要目的是提高比特币网络内交易传播的速度和效率。通过使用专用节点和协议，中继网络可以快速、安全地在网络的不同节点间中继交易和区块。\n\
  *   **节点类型**：参与比特币中继网络的节点有两种类型：常规节点和中继节点。常规节点只是参与标准比特币网络的节点，而中继节点是专门设计用于参与中继网络的专用节点。\n\
  *   **协议**：比特币中继网络使用一种称为 `FIBRE` 协议的专用协议。该协议旨在促进网络中不同节点间的高速数据传输，并针对低延迟和高吞吐量进行了优化。\n\
  *   **优势**：比特币中继网络的主要优势之一是它可以帮助减少交易确认所需的时间。通过提高交易传播的速度和效率，中继网络有助于降低比特币网络中双重支付和其他类型欺诈的风险。\n\
  *   **安全性**：比特币中继网络的设计旨在保证安全并抵御攻击。它使用多种安全措施来防范恶意节点和其他类型的攻击，包括加密、认证和信誉系统。\n\n总体而言，比特币中继网络在比特币网络的运行中发挥着重要作用。通过提高交易传播的速度和效率，它有助于确保比特币网络保持安全可靠。\n\
  \n## 网络发现\n\n网络发现是指在点对点网络（如比特币网络）中发现并连接到对等节点的过程。在比特币的语境下，网络发现是协议的重要组成部分，因为它允许节点相互发现和连接，使网络能够作为一个去中心化系统运行。比特币中的网络发现过程在节点加入网络时启动。节点向其已知的一组预定义种子节点发送消息，请求当前网络上活跃的其他节点列表。种子节点响应其所知的其他节点的\
  \ IP 地址列表，使新节点能够开始连接到它们。\n\n一旦节点连接到网络上的其他几个节点，它就可以开始与它们交换信息，例如交易和区块。节点还可以向其他节点请求关于网络的更多信息，例如当前的难度级别和最新的区块高度。\n\
  \n比特币网络发现面临的挑战之一是它需要能抵御攻击和恶意行为。例如，攻击者可能试图用虚假的 IP 地址或节点淹没网络，这会扰乱网络并阻止节点相互发现。为了解决这个问题，比特币使用多种技术来确保网络发现过程的可靠性和安全性。\n\
  \n其中一种技术是使用 DNS 种子，这些是由受信任方运行的 DNS 服务器，包含网络上活跃节点的 IP 地址列表。节点可以查询 DNS 种子以获取初始连接节点列表，这有助于引导网络发现过程。\n\
  \n比特币中用于确保可靠网络发现的另一种技术是对等节点封禁。节点可以封禁表现恶意或试图扰乱网络的其他节点，防止它们将来连接到该节点。\n\n# 全节点\n\n\n\
  \n# 全节点\n\n全节点是一种计算机程序，用于验证交易和区块，并维护整个区块链网络的副本。全节点通过强制执行共识规则并将交易和区块中继给网络中的其他节点，在比特币网络的去中心化架构中发挥着关键作用。要成为全节点，用户必须下载并运行\
  \ **Bitcoin Core** 软件，这是比特币协议的参考实现。用户下载并安装软件后，全节点将下载并验证整个区块链，其中记录了发生过的所有比特币交易。\n\
  \n通过运行全节点，用户可以独立验证自己交易的有效性以及网络上其他人的交易。这意味着他们无需信任任何第三方服务提供商或中介机构，这是比特币网络的核心原则之一。全节点还通过将交易和区块中继给网络中的其他节点，充当比特币网络的骨干。这样做有助于确保网络中的所有节点都能访问最新的交易和区块，从而帮助防止双重支付和其他类型的欺诈。\n\
  \n此外，全节点可以参与挖掘新区块的过程，这涉及解决复杂的数学问题以验证交易并将其添加到区块链中。然而，挖矿需要专用硬件和大量算力，因此对大多数个人用户来说并不切实际。全节点是比特币网络去中心化架构的关键组成部分。通过运行全节点，用户可以独立验证交易和区块的有效性，将交易和区块中继给网络中的其他节点，并参与挖掘新区块的过程。\n\
  \n## 交换库存\n\n交换库存特指节点从其他节点接收并愿意作为回报与它们共享的交易和区块列表。当节点收到对特定项目的请求时，它可以用其交换库存中的相应数据进行响应。\n\
  \n交换库存在维护比特币网络的完整性和效率方面发挥着重要作用。通过相互共享有关交易和区块的信息，节点可以验证数据的有效性，并确保所有节点对区块链拥有一致的视图。这有助于防止双重支付和其他恶意活动。此外，通过维护最新的交换库存，节点可以减少网络上不必要的数据传输。如果一个节点知道另一个节点已经拥有某笔特定交易或区块，它就不需要再次请求该数据，从而节省时间和带宽。\n\
  \n总体而言，交换库存是比特币点对点网络的关键组成部分，允许节点高效地共享信息并维护区块链的安全性和一致性。\n\n在比特币这样的点对点网络中，交换库存在提高网络效率和维护区块链完整性方面发挥着至关重要的作用。当节点维护交换库存时，它本质上保存了一份记录，列出了它从其他节点接收并愿意作为回报与它们共享的交易和区块。为提高效率，应考虑以下几点：\n\
  \n- **防止冗余数据传输**：交换库存有助于减少网络上不必要的数据传输。如果节点 A 知道节点 B 已经拥有特定的交易或区块，节点 A 就不需要再次请求该数据。这种优化通过防止信息的冗余传输，节省了时间和带宽。\n\
  - **一致的区块链视图**：通过共享有关交易和区块的信息，节点共同致力于维护区块链的一致视图。这确保所有节点都使用相同的数据集运行，防止区块链历史中的差异和不一致。\n\
  \n### 节点通信\n\n节点通过一种通常与 **Gossip 协议（流言协议）** 相关的过程，维护对彼此库存的共同理解。Gossip 协议是一种通信机制，节点通过它在网络中传播信息。让我们看看它是如何工作的：\n\
  \n- **节点请求**：当一个节点（假设为节点 A）需要关于特定区块或交易的信息时，它会向其连接的对等节点（包括节点 B）发送请求。\n- **节点 B 响应**：如果节点\
  \ B 的库存中有请求的数据，它会用该数据进行响应。此响应包含相关的区块或交易详情。\n- **库存通告**：此外，节点会定期向其对等节点通告其当前的库存。此通告包含它们拥有的区块和交易列表。\n\
  - **点对点通信**：节点相互通信，共享其库存并响应请求。这创建了一个动态且更新及时的网络，节点可以随着时间的推移了解彼此的库存。\n\n通过利用 Gossip\
  \ 协议，节点持续更新对网络状态的了解，从而对数据交换做出明智的决策并减少冗余。\n\n## 简化支付验证\n\n**简化支付验证（SPV）** 是比特币网络中的一种轻量级节点。与存储区块链完整副本的全节点不同，SPV\
  \ 节点仅存储验证与节点自身钱包相关的交易所需的区块链子集。\n\nSPV 节点无需下载整个区块链即可运行，这使其比全节点更高效、占用资源更少。相反，它依赖区块头和\
  \ **Merkle 树（默克尔树）** 来验证交易。Merkle 树提供了一种加密证明，证明特定交易包含在区块链的特定区块中。\n\nSPV 节点的显著特点包括：\n\
  \n- **轻量级**：SPV 节点属于轻量级节点，因为它们仅存储区块链的一个子集。\n- **快速同步**：SPV 节点能快速与网络同步，因为它们只下载区块头而不是整个区块链。\n\
  - **存储需求降低**：SPV 节点所需的存储空间比全节点少得多。\n- **有限信任模型**：SPV 节点信任全节点提供关于区块链的准确信息，因为它们自己不存储整个区块链。\n\
  - **隐私性提升**：由于 SPV 节点不存储整个区块链，它们无法访问所有交易数据，这可以提高隐私性。\n  - **移动端兼容性**：SPV 节点常用于移动钱包，因为它们不像全节点那样需要大量存储或处理能力。\n\
  \n### SPV 节点与隐私\n\nSPV 节点是比特币网络中的轻量级节点，不存储整个区块链。相反，它们仅下载并存储区块头，区块头包含每个区块中交易的摘要。SPV\
  \ 节点利用这些信息验证交易的真实性，而无需下载整个区块链。\n\n在隐私方面，SPV 节点提供了一定程度的匿名性，因为它们不会泄露用户的交易历史。然而，由于它们不下载整个区块链，因此依赖其他节点提供交易信息。这意味着用户的隐私强度仅取决于它们连接的节点的隐私强度。\n\
  \n\n\n\n\n# 比特币隐私担忧与取证分析\n\n## SPV 节点隐私担忧\n\nSPV 节点的一个潜在隐私担忧在于，它们依赖一种称为布隆过滤器的技术，从全节点请求交易信息。布隆过滤器是一种概率数据结构，允许\
  \ SPV 节点从全节点请求交易子集，而无需透露其具体感兴趣的交易。然而，它们并非完美无缺，存在风险：有决心的攻击者可能利用它们对 SPV 用户进行去匿名化。\n\
  \n另一个潜在的隐私担忧是 SPV 节点可能成为女巫攻击的目标，攻击者创建大量虚假节点来操纵提供给 SPV 节点的信息。这可能被用来关联用户的交易，从而损害其匿名性。\n\
  \n## 交易池\n\n交易池，也称为内存池，是一个未确认交易列表，这些交易已广播至比特币网络，但尚未被矿工打包进区块。\n\n可以将交易池想象为交易的“候诊室”。当你向某人发送比特币时，你的交易首先被广播到网络并加入内存池。随后，矿工从池中挑选交易，将其打包进他们挖掘的下一个区块。然而，并非所有交易都能装进单个区块，因此矿工倾向于优先处理手续费较高的交易。为了进一步解释这一点，我们可以打个比方：想象一家繁忙的餐厅，门口排着等待入座的顾客队伍。顾客到达后加入队列，当有空桌时，队首的顾客入座。然而，如果餐厅太忙且桌位不足，部分顾客可能需要等待更久。同样，交易被加入内存池，等待被打包进下一个区块。手续费较高的交易会被优先处理，就像预订了座位、优先入座的顾客一样。\n\
  \n交易池之所以重要，是因为它允许节点在交易被打包进区块前对其进行验证，确保其符合网络规则。它还有助于防止双重支付，确保一枚比特币不会被花费两次。此外，如果交易在一定时间内未被打包进区块，会从池中移除，这有助于防止网络遭受垃圾攻击。\n\
  \n## 区块链分叉\n\n区块链分叉是指因软件版本冲突导致区块链网络分裂为两条独立链的现象。这将导致两个拥有不同交易历史的独立区块链网络。\n\n当网络上部分节点运行不同版本的区块链软件，无法就哪些交易有效达成共识时，就会发生这种情况。例如，假设网络上有两个矿工：矿工\
  \ A 和矿工 B。他们都在致力于向区块链添加新区块，但运行着不同版本的软件。矿工 A 向区块链添加了一个新区块，但矿工 B 拒绝接受，因为该区块不符合其软件版本的要求。这导致区块链网络分裂，部分节点遵循矿工\
  \ A 的区块链版本，其余节点遵循矿工 B 的版本。\n\n这种分裂导致形成两条拥有不同交易历史的独立链。每条链现在都是一个独立的区块链网络，且将继续相互独立运行。这被称为区块链分叉。\n\
  \n区块链分叉主要分为两类：软分叉和硬分叉。软分叉是向后兼容的区块链变更，意味着未升级到新软件的节点仍可参与网络。而硬分叉则是不向后兼容的变更，意味着未升级到新软件的节点将无法参与网络。\n\
  \n## 比特币测试网\n\n比特币测试网是一个与主网并行运行的网络，专门为测试和实验目的而设计。它本质上是主网的一个副本，但有几个关键差异使其与众不同。\n\n\
  主要差异之一是测试网比特币没有价值，可从多种渠道（包括测试网水龙头）免费获取。这意味着开发者和用户可以在不使用真实比特币（这可能有风险且成本高昂）的情况下尝试比特币交易。另一个重要差异是测试网区块不会被添加到主比特币区块链。这意味着在测试网上创建的任何交易或区块都不会影响实际的比特币网络，也无法用于接收或花费真实比特币。\n\
  \n测试网还拥有不同的网络标识符和一套独立的 DNS 种子节点，这意味着它作为一个完全独立的网络，独立于主比特币网络运行。这确保了在测试网上进行的任何测试或实验都不会干扰主网。\n\
  \n例如，假设一位开发者想要测试一款新的比特币应用或功能。他们可以使用测试网运行模拟和实验，而无需冒真实比特币损失的风险。他们可以创建交易、挖掘区块，并在一个安全、受控的环境中测试应用功能。测试完成且应用准备好部署后，开发者可切换至主网使用真实比特币。\n\
  \n## 比特币取证基础\n\n比特币取证分析是检查比特币网络上交易的过程，旨在识别洗钱、欺诈等非法活动的模式或证据。该分析的一个方面涉及对比特币地址和钱包的检查。\n\
  \n比特币地址是代表区块链上比特币位置的唯一标识符。它由一串字母数字字符组成，可用于接收和发送比特币。而比特币钱包则是存储私钥的软件程序，这些私钥是访问特定地址中存储的比特币所必需的。\n\
  \n分析比特币地址的一种方法是检查其交易历史。通过查看该地址的输入和输出，可以追踪比特币流入和流出该地址的资金流向。该信息可用于识别可能表明非法活动的模式或异常。\n\
  \n例如，如果一个地址从多个来源接收大量比特币，随后突然将所有比特币发送至单个地址，这可能是洗钱的迹象。同样，如果一个地址接收来自已知欺诈来源的比特币，这可能是参与欺诈活动的证据。\n\
  \n比特币取证分析的另一个方面涉及检查比特币钱包。这可以通过分析与特定钱包相关的元数据来完成，例如创建日期、与该钱包关联的交易数量以及交易类型。这些信息可用于识别钱包所有者，并可能将其与其他地址或交易关联起来。\n\
  \n例如，如果某个钱包关联多个涉及非法活动的地址，则该钱包所有者也有可能参与了这些活动。\n\n## 地址聚类\n\n聚类是比特币和区块链取证中用于识别并归类由同一实体控制的地址的一种技术。该技术涉及分析区块链上的交易，以确定不同地址之间的资金流向。\n\
  \n\n\n\n\n当进行比特币交易时，通常涉及多个输入和输出。输入是资金支出方的地址，输出是资金接收方的地址。通过分析交易的输入和输出，可以识别行为模式，从而帮助确定哪些地址由同一实体控制。\n\
  \n例如，如果一笔交易涉及多个输入，且这些输入均由同一地址控制，则该地址的所有者很可能正在合并其资金。另一方面，如果一笔交易涉及多个输出，且这些输出均由同一地址控制，则该地址的所有者很可能正在向不同目的地发送资金。\n\
  \n一旦识别出地址簇，就可以进行进一步分析，以尝试确定这些地址所有者的现实身份。这可能涉及寻找线索，例如与交易关联的 IP 地址，或分析交易的时间和频率。\n\n\
  然而，重要的是要注意，仅凭聚类分析并不一定意味着这些地址都由同一人或实体控制。可能存在多个个人或实体出于不同目的使用同一地址，或者一个地址由多方共同控制的情况。\n\
  \n虽然在比特币和区块链取证中对地址进行聚类可以为资金流向和地址间的潜在关联提供有价值的见解，但它存在某些缺点和局限性：\n\n- 隐私担忧：聚类分析构成重大隐私风险，因为它可能揭示用户的财务活动和关联。个人可能希望保持其财务交易的私密性，而聚类分析会破坏这种隐私。\n\
  - 误报：聚类技术可能导致误报，即地址被错误地归为一组。当多个用户或实体出于合法且无关的目的使用同一地址进行交易时，就会发生这种情况，从而产生误导性的关联。\n\
  - 共享钱包和服务：聚类分析可能会错误地关联共享钱包、交易所或其他服务使用的地址。许多用户通过第三方服务与加密货币交互，这些服务所属的地址可能会被错误地关联起来。\n\
  - CoinJoin 和混币服务：隐私增强技术（如 CoinJoin 和混币服务）旨在有意模糊输入和输出地址之间的联系。聚类分析可能难以准确识别涉及此类隐私保护交易的地址。\n\
  \n## 结论\n\n本章旨在探讨并强调比特币对金融格局和技术创新的深远影响。近年来，比特币已超越传统金融领域。此外，尽管面临可扩展性问题、安全顾虑和监管不确定性等挑战，比特币仍在持续塑造金融、数字货币和去中心化的未来。在下一章中，您将了解以太坊，一种无许可区块链。\n\
  \n本章将探讨以太坊在区块链世界中的重要性。即将到来的章节将涵盖 `EVM`、`gas`、`以太坊钱包` 等主题。\n\n## 问答\n\n1.  什么是比特币？它与传统货币有何不同？\n\
  \n答：比特币是一种基于区块链技术的去中心化数字货币。它运行在点对点网络上，无需银行和其他金融机构等中介。比特币纯粹以数字形式存在，不受任何中央权力或政府控制。\n\
  \n2.  谁创造了比特币？为什么？\n\n答：比特币于 2009 年由化名为中本聪的个人或团体创建。中本聪的真实身份至今仍是个谜。其旨在为传统银行系统提供一种替代方案。\n\
  \n3.  创建新比特币的过程是什么？\n\n答：新比特币作为奖励发放给矿工，矿工贡献算力以验证网络上的交易。比特币挖矿意味着使用专用硬件解决复杂的数学问题，并将新交易添加到区块链中。\n\
  \n4.  什么是比特币中继网络？\n\n答：比特币中继网络是比特币生态系统中的一个额外层。它促进交易和区块在节点间的快速传播。它是一个由专用节点组成的网络，这些节点经过战略性部署，能比标准点对点网络更高效地中继交易数据。\n\
  \n5.  比特币取证分析的重要性是什么？\n\n答：比特币取证分析包含多种调查技术，用于解读网络上的交易数据。它协助网络安全公司和执法机构追踪非法活动，如欺诈和洗钱。\n\
  \n## 选择题\n\n1.  比特币的最大供应上限是多少？\n\na. 1000 万\n\nb. 2100 万\n\nc. 5000 万\n\nd. 无限\n\
  \n2.  哪个过程通过解决复杂的数学难题将新交易添加到区块链？\n\na. 哈希\n\nb. 质押\n\nc. 挖矿\n\nd. 铸造\n\n3.  哪种类型的节点存储完整的比特币区块链并独立验证交易？\n\
  \na. 挖矿节点\n\nb. 轻节点\n\nc. SPV 节点\n\nd. 全节点\n\n4.  比特币主网和测试网的主要区别是什么？\n\na. 测试网使用的区块链协议与主网不同。\n\
  \nb. 测试网比特币没有价值且可免费获取，而主网比特币具有货币价值。\n\nc. 测试网交易无法由矿工验证，主网则可以。\n\nd. 测试网的交易速度比主网快。\n\
  \n5.  哪个术语描述了导致软件新旧版本不兼容的区块链分叉？\n\na. 硬分叉\n\nb. 软分叉\n\nc. 合并分叉\n\nd. 临时分叉\n\n###\
