- raw: "Many organizations also maintain data that they no longer understand. Yet,\
    \ they are afraid to purge it, on the off chance it’s something vital that a business\
    \ critical process relies upon. Potential new data sources, both internal and\
    \ external, should also be examined during the exploratory analysis phase, as\
    \ these may enhance the predictive ability of any models which are developed. \
    \ \n\nOverall, a good deal of effort is required to explore the universe from\
    \ which data can be gathered and to decide what can potentially be used, and what\
    \ cannot.  \n\nOnce a data scientist has a good understanding of what data an\
    \ organization has and how it is structured, then they can move to Stage 3, and\
    \ think about creating the development sample that is going to be used in the\
    \ machine learning process.  \n\nA very naïve approach to building predictive\
    \ models for business is simply to throw every piece of information that an organization\
    \ has into the machine learning process. In practice, much data is out-of-date,\
    \ unstable or otherwise inappropriate. It should therefore be excluded from the\
    \ development sample in case it degrades the performance of the machine learning\
    \ process. \n\nSome typical reasons to exclude data from the machine learning\
    \ process are:  \n\n·          Out-of-date data. If the data is no longer relevant\
    \ to today’s world, then don’t consider it. Data about how people used their cell\
    \ phones in the time before smart phones existed is not going to be very useful\
    \ in telling you about smart phone usage today. \n\n·          Not representative\
    \ of the target population. The development sample should only contain cases that\
    \ mirror the population to which the model will be applied. If a revenue model\
    \ is being developed exclusively for online customers, then you should exclude\
    \ in-store transactions if spending patterns are different for these two channels.\
    \ Likewise, if you are developing a speech recognition system from sound samples,\
    \ all samples should be speech related. If you have examples of barking dogs or\
    \ traffic noise, then these need to be removed. \n\n·          Stability of data.\
    \ Will the data used in the machine learning process be available when the model\
    \ is applied? If a data item is not available at the point of implementation,\
    \ then it should be excluded. \n\n·          Legal and ethical reasons. Do you\
    \ want to use sensitive personal data such as race, gender and sexual orientation?\
    \ This type of data can be very predictive, but it may be illegal to use it. If\
    \ it is legal, then the use of such data may create reputational risk if it becomes\
    \ known that you treat certain groups differently than others. If a discount strategy\
    \ based on model scores results in you only offering discounts to straight men\
    \ – that’s probably going to be controversial. \n\n·          Deterministic cases.\
    \ If you have certain customers which you know with certainty how you are going\
    \ to treat them, then you don’t need a predictive model for this. Including them\
    \ in the development sample will only weaken the power of the model, as measured\
    \ on the remainder of the population[\\[32\\]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).\
    \ \n\n·          Inexplicability. A fundamental principle of machine learning\
    \ is that you should be very cautious about building models using data which you\
    \ don’t fully understand. This is particularly true for models that are subject\
    \ to industry regulation or are strategically important to an organization’s success.\
    \ If a data scientist presents you with a model using data that they can’t explain,\
    \ then that’s a risk that you should be concerned about.  \n\nIf an organization\
    \ has huge databases, then this may be problematic in terms of the computer resources\
    \ required to analyze them as part of the machine learning process. It is not\
    \ unusual for only a sample; say 1:10 or 1:100 cases to be selected for inclusion\
    \ in the development sample. “Big Data Purists” may argue that you should analyze\
    \ all available data because failing to do so may result in subtle patterns being\
    \ missed, and hence sub-optimal models being created. In one sense they are right\
    \ in that if you take a sample rather than using the full population the resulting\
    \ model will not be as accurate. However, it’s very much a case of diminishing\
    \ returns. For almost all practical business problems, the benefits of taking\
    \ more than a few tens of thousands of cases is marginal. If you sample in an\
    \ appropriate way[\\[33\\]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX), then you’ll get\
    \ 99% of the benefit from a model developed using 100,000 cases of one developed\
    \ using 10 million. To put it another way, just because you have huge amounts\
    \ of data does not necessarily mean that you need to invest in specialist hardware/software\
    \ to be able to apply machine learning – you just need to be smart in how you\
    \ do it and focus on the data that really matters. \n\nThe fourth stage of the\
    \ process is data preparation. This is required because the raw data may be badly\
    \ formatted, contain errors or not provide the best possible representation of\
    \ the data; i.e. a different representation will make it easier for the machine\
    \ learning process to find the important patterns in the data. There are four\
    \ main tasks that occur during data preparation: \n\n·          Creation of new\
    \ data. Age is more predictive than Date of Birth for most types of problem. Therefore,\
    \ age may need to be calculated if only Date of Birth is available. Likewise,\
    \ if you have data about credit card transactions, it’s best to create summary\
    \ variables representing average spend per transaction, number of transactions\
    \ last month, time since last transaction, and so on. \n\n·          Data cleaning.\
    \ Data may be missing or incorrect. A key purpose of data preparation is to identify\
    \ where this type of data exists, and to either remove it (an exclusion) or reformat\
    \ it; i.e. recode all incorrect data with a standard value. If dates of birth\
    \ used to calculate age are in the future or impossibly far in the past, you may\
    \ want to define a default value of say ‘-1’ for age, to represent these cases.\
    \ \n\n·          Consolidation. It’s good practice to represent similar data in\
    \ a similar way. If you have a data item called property type, where values of\
    \ “D”, “Det” and “Detached” all mean the same thing; i.e. “Detached house”, then\
    \ these should be consolidated into a single value which is used to represent\
    \ all cases of Detached. \n\n·          Conversion to numeric. Machine learning\
    \ algorithms like numeric data. “Yes”/”No”/”Maybe” would be converted in to 0/1/2\
    \ flags instead. For complex text or speech such as a twitter feed, then one approach\
    \ is to include flags to indicate if certain key words feature or not, or to generate\
    \ counts of the number of times certain words appears. \n\nOnce a suitable data\
    \ sample has been prepared then it’s time for data pre-processing and preliminary\
    \ variable selection (Stage 5 of Figure 9). With data pre-processing, one is putting\
    \ the data into a format that is going to be most amenable to the chosen machine\
    \ learning algorithm.  \n\nPre-processing usually involves two processes: standardization\
    \ and transformation. Standardization processes scale data so that everything\
    \ has similar values. If you have two data items such as gross annual income and\
    \ height in metres then one approach to standardization is to subtract the respective\
    \ average and then divide by the range of values (or some other measure[\\[34\\\
    ]](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)). In this way, both will be centered on\
    \ zero, and have broadly similar ranges.  \n\n# 11.Data Preprocessing With Machine\
    \ Learning "
