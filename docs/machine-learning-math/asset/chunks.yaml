    # Humanoid robots are projected to disrupt areas of retail, hospitality, and food
    service. The chances are that you have already seen the automated menu systems
    for McDonald’s and other fast food restaurants online. These systems are definitely
    being worked on, but may not see the implementation for various reasons. Some
    startups are even working on burger making systems that can perform virtually
    all of the duties of the average burger flipper at a fraction of the cost.


    The role of the humanoid robot in customer service is more obvious in places like
    Japan where robotics has entered the mainstream. Of all the industrialized nations
    today, Japan has the highest robot density by a large margin. Most of these robots
    are used in the automotive industry, but a number of them take on customer service
    roles. They can be found in select department stores greeting customers and in
    airports acting as luggage carriers. With an ever-contracting population and less
    unskilled workers willing to do these jobs, it makes sense that Japan has a high
    adoption rate. For many Japanese citizens, service robots serve to increase the
    quality of life and are a normal part of their daily lives.


    However, there is still a long way to go for the average consumer in other countries
    to warm up to these robotic and automated systems. Some would even say that the
    need simply isn’t there. In 2017, Japanese deaths outnumbered births by 1,000
    to one. The population dropped by a massive 264,000 people in one year alone.
    Other industrialized nations with rising unemployment rates and a stable population
    perhaps don’t need as many robots. There are also other concerns besides just
    population and unemployment for why service robots are yet to be seen abroad.


    ## The Uncanny Valley Effect

    Overcoming the uncanny valley effect is no easy feat, especially with older generations.
    In Japan, people are used to them, so the effect holds less weight – though the
    same cannot be said for older generations in other countries. Young people today
    are more comfortable using self-checkout lines and automated systems, but the
    older generation overwhelmingly subscribes to the importance of face-to-face interaction
    with their community.


    A big argument for service robot adoption in Japan is their large aging population.
    End of life care is synonymous with assisted living, loss of personal autonomy,
    and embarrassing mishaps. These are areas that service robots can directly address.
    For one, an older patient is less likely to feel embarrassed if a robot is cleaning
    after their bathroom accidents. If there is a strong human-robotic interaction,
    the patient may feel that the robot is a part of themselves like we think our
    phones are. The result is a net gain in personal autonomy, all things considered.


    ## Labor and Care Challenges

    With a shortage of geriatrics and personal care professionals plus a global aging
    population not just in Japan, service robots are projected to rise. Less and less
    people are signing up for these important ends of life careers. The pay for these
    jobs is low when compared to other medical professions that require a similar
    amount of training. If nobody else wants to take care of the elderly, who will?
    Not every family is willing or able to care for aging parents. Additionally, the
    risk of malpractice and abuse in assisted living institutions is high. Taking
    care of the elderly is not an easy job by any means. Combine this with a meager
    wage, and you have the basis for unfair treatment. Every aging person deserves
    to be treated with dignity and respect. Whether service robots can render this
    kind of treatment is up for debate. And it is a debate that will doubtlessly unfold
    within the current century.


    ## Human Perception and Interaction

    Would older generations be keen on using a service robot for their daily needs?
    To some, a robot may seem intimidating or impersonal. After all, robots are not
    intelligent the way that we are. They may be able to handle basic conversational
    skills and respond to our commands, but that is a far cry from genuine intelligence.
    There is also the question of whether these systems should have a human-like appearance
    or to remain obviously robot looking. Humanoid robots are more likely to create
    an uncanny valley effect, but it is not exclusive to human-like design. Any robot
    that acts sufficiently “alive” can elicit the effect.


    Research into the area of the ameliorating, the uncanny valley falls under human-robot
    interaction. We know from this research that certain robotic behaviors elicit
    certain human emotions like fear and uncertainty. For example, when a robotic
    agent gets too close or invades somebody’s personal space, there is a fear response.
    If a robot is just lounging around with no purpose, the human perceives it as
    daunting and even useless. Interacting with these systems can result in unanticipated
    behavior in the human. Humans are likely to ascribe personality traits to a robot
    even when these aren’t explicitly programmed. This factor of unpredictableness
    has lead researchers and designers to add emotive cues to their robots.


    ## Utility and Military Applications

    Where service robots suffer from the uncanny valley effect, utility robots do
    not. Virtually every major military across the globe is investing in robots to
    aid in the battlefield and in operations. A US-based company, `Boston Dynamics`,
    is working on robotic systems known for their mobility. The company made headlines
    with its design of a quadruped robot named `BigDog` for the Defense Advanced Research
    Projects Agency (`DARPA`). The robot has obvious military applications as a pack
    mule carrying ammunition and supplies for soldiers on patrol. The project was
    eventually scrapped because the system was deemed too loud to be used in live
    combat operations. These sorts of systems are mostly considered prototypes though.


    Other robots used by the US military include the `Foster-Miller TALON` family
    of remotely operated vehicles. They resemble little tanks or planet rovers with
    fully tracked movement. They are capable of using small arms fire to heavy machine
    guns completely remotely. Though `TALON` saw some deployment in Iraq and Afghanistan,
    its current use remains limited. Other fully weaponized systems are readily used
    like the `General Atomics MQ-1 Predator` drone and the `MQ-9 Reaper`. These belong
    to a class of aircraft called `UAVs` or uncrewed aerial vehicles. `Predator` and
    `Reaper` drones can either be controlled by an operator on the ground, or they
    can fly autonomously with the direction of onboard computers. These systems have
    faced increased scrutiny with high profile killings involving civilians and questionable
    rules of engagement. In 2011, under the Obama Administration, a 16-year-old American
    citizen of Yemeni descent was killed in a drone strike while eating at a restaurant
    in Yemen. It is unclear why the boy was targeted, but his father was a suspected
    al-Qaeda leader and was later killed in a similar strike.

    '
  trans: '


    # 人形机器人预计将颠覆零售、酒店和餐饮服务领域。你很可能已经在网上见过麦当劳及其他快餐店的自动菜单系统。这些系统确实正在开发中，但由于各种原因，可能还不会实施。一些初创公司甚至正在研发汉堡制作系统，它们能够以极低的成本执行普通翻汉堡员几乎所有的职责。


    在东京等机器人技术已进入主流的国家，人形机器人在客户服务中的作用更为显而易见。在当今所有工业化国家中，日本的机器人密度远超其他国家。这些机器人大部分用于汽车工业，但也有许多机器人承担了客户服务的角色。你可以在特定的百货商店看到它们迎接顾客，在机场看到它们充当搬运员。随着人口不断萎缩以及愿意从事这些工作的非熟练工人减少，日本拥有高采用率是合理的。对于许多日本公民来说，服务机器人有助于提高生活质量，是他们日常生活中常的一部分。


    然而，对于其他国家的普通消费者来说，接受这些机器人和自动化系统还有很长的路要走。有些人甚至认为这种需求根本就不存在。2017 年，日本的死亡人数比出生人数多出
    1000 人。仅一年内人口就大幅减少了 26.4 万。其他失业率上升且人口稳定的工业化国家可能不需要这么多机器人。除了人口和失业问题外，还有其他导致服务机器人尚未在海外普及的原因。


    ## 恐怖谷效应

    克服恐怖谷效应并非易事，尤其是对于老一代人来说。在 във，人们已经习惯了它们的存在，因此这种效应的影响较小——但其他国家的老一代人则并非如此。现在的年轻人更习惯于使用自助结账机和自动化系统，但老一代人压倒性地认为与社区面对面交流的重要性。


    在日本采用服务机器人的一个重要论点是其庞大的龄化人口。临终关怀等同于辅助生活、失去个人自主权以及尴尬的意外。这些都是服务机器人可以直接解决的领域。例如，如果是一个机器人在清理其浴室事故后的遗物，年长患者就不可能感到尴尬。如果存在强烈的人机交互，患者可能会觉得机器人是他们的一部分，就像我们认为手机一样。从各方面来看，结果是个人自主权的净增加。


    ## 劳动力与护理挑战

    由于老年医学和个人护理专业人员的短缺，加上全球范围内的人口老龄化（不仅是日本），预计机器人将会增加越来越多的人不再选择这些重要的临终职业。与需要相似培训的其他医学专业相比，这些工作的薪水很低。如果没有人照顾老年人，谁来做？并不是每个家庭都愿意或能够照顾年迈的父母。此外，辅助生活机构发生医疗疏忽和虐待的风险很高。照顾老年人绝不是一项轻松的工作。再加上微薄的工资，就构成了不公正对待的基础。每一位老年人就应该受到尊严和尊重。服务机器人是否能提供这种待遇尚待辩论。这场争论无疑将在本世纪内展开。


    ## 人类感知与交互

    老一代人会渴望使用服务机器人满足日常生活需求吗？对某些人来说，机器人可能看起来令人生畏或缺乏人情味。毕竟，机器人并不像我们这样拥有智能。它们可能处理基本的对话技巧并响应我们的指令，但这与真正的智能相比仍有很大差距。还有一个问题是，这些系统应该具有类人类的外观，还是保持明显的机器人外表。人形机器人更容易产生恐怖谷效应，但这种效应并非类设计所专利。任何表现得足够“生动”的机器人都能诱发这种效应。


    缓解恐怖谷效应的研究属于人机交互领域。我们通过这些研究知道，某些机器人行为会引发特定的人类情感，如恐惧和不确定性。例如，当机器人靠得太近或侵入他人的个人空间时，会产生恐惧反应。如果机器人只是无目的地在闲逛，人类会认为它令人令畏甚至毫无用。与这些系统交互可能会导致人类产生意料之外的行为。即使这些特征没有被明确编程，人类也可能赋予机器人人格特质。这种不可预测的因素促使研究人员和设计人员在机器人上添加情感信号。


    ## 实用性与军事应用

    服务机器人遭受恐怖谷效应的影响，而实用型机器人则没有。全球几乎每个主要军方都在投资机器人以协助战斗和行动。一家位于美国的公司 `Boston Dynamics`
    正在开发以移动性闻名的机器人系统。该公司因设计了一款名为 `BigDog` 的四足机器人给国防高级研究计划局（`DARPA`）而登上头条。该机器人具有明显的军事应用价值，可以充当骡子为巡逻士兵携带弹药和物资。该项目最终被取消，因为该系统被认为噪音太大，无法在实战行动中使用。不过，这类系统大多被视为原型。


    美国军使用的其他机器人还包括 `Foster-Miller TALON` 系列遥控无人器。它们看起来像小坦克或行星车，具有全履带移动能力。它们能够完全远程地使用小型武器和重型机枪。尽管
    `TALON` 在伊拉克和阿富汗经历过部署，但其目前的用途仍然有限。其他完全武装的系统被广泛使用，例如 `General Atomics MQ-1 Predator`无人机和
    `MQ-9 Reaper`。它们属于一类被称为 `UAVs`（无人机）的飞机。`Predator` 和 `Reaper` 无人机可以由地面操作员控制，也可以根据车载计算机的指示自主飞行。由于涉及平民的高知名死亡事件和争议性的交战规则，这些系统面临着日益严格的审查。2011
    年，在奥马政府时期，一名 16 岁的也门裔美国公民在也门一家餐厅用餐时被无人机击杀。目前还不清楚该男孩为何被定为目标，但他的父亲是涉嫌的基地组织领导人，随后在类似的袭击中丧生。


    '
