  fmt: '

    Any effective machine learning algorithm must have its inductive preference; otherwise,
    it will be confused by the hypothesis of "equivalent" in the training set in the
    hypothesis space and cannot produce definite learning results. It is conceivable
    that, if there were no preferences, our watermelon learning algorithm would generate
    a model that randomly selects the equivalent assumptions on the training set each
    time it makes prediction Learning models, which sometimes tell us it is good and
    sometimes bad do not make sense. 


    Inductive preferences correspond to the learning algorithm''s assumptions about
    what model is better. In practical problems, whether this assumption is true or
    not, that is, whether the algorithm''s inductive preference matches the problem
    itself most of the time, directly determines whether the algorithm can achieve
    good performance. 


    Due to its complex patterns dealing with deep learning, it is easy to "over-fit"
    if there are few data samples; such a complex model, such large data sample, cannot
    be solved without powerful computing equipment. It is accurate because humans
    have entered the "big data era"; data storage and computing devices have developed,
    making connectionism learning technology spring again. Interestingly, neural networks
    became popular in the mid-1980s. It is related to the increase of computing power
    and data access efficiency caused by the wide application of Intel X86 microprocessor
    and memory strip technology.


    Deep learning in this situation is very similar to the neural networks of that
    time. In the past two decades, the ability of human beings to collect, store,
    transmit, and process data has increased rapidly, and huge amounts of data have
    accumulated in every corner of human society. There is an urgent need for computer
    algorithms that can effectively analyze and utilize data. Machine learning has
    responded to this urgent need of the Great Age, so it is natural that the field
    has grown enormously and gained widespread attention. 


    Computer science has excelled in this decade exponentially due to a large number
    of researchers voluntarily dedicating their valuable time to academia. Apart from
    that, machine learning has also helped researchers to speed up their research
    process. Now, machine learning is almost in every nook and corner of the world
    with its infinite number of applications that are serving mankind. From facial
    recognition to autopilot cars to Internet marketing to bioinformatics that uses
    protein synthesis. A lot of fields are now actively involved in the development
    of artificial intelligence with all their strength. In coming years, it is believed
    that machine learning will expand its horizons in a way that no one ever imagined.


    Bioinformatics research involves the whole process from "life phenomena" to "law
    discovery", which necessarily includes data acquisition, data management, data
    analysis, simulation experiments, and so on. Data analysis is the arena for machine
    learning, where machine learning technologies are already thriving. Machine learning
    provides data analytics capabilities. Cloud computing provides data processing
    capabilities. Crowdsourcing provides data tagging capabilities. 


    ## Overfitting and Underfitting


    In the process of model evaluation and adjustment, we often encounter "overfitting"
    or "underfitting" situation. How to effectively identify the "overfitting" and
    "underfitting" phenomena and adjust the model is the key to improve the machine
    learning model. Especially in the actual project, it is the domain knowledge that
    the algorithm engineer should have to adopt many methods to reduce the risk of
    "overfitting" and "underfitting". 


    When trying to define these two, remember that if a model fits with the training
    samples well but gives a very bad percentage of accuracy, it is called overfitting.
    On the other hand, if the training sample did not fit well in the model and if
    was not accurate too in effect to the prediction, it is called underfitting.


    The cost is an index to measure the conformity between the model and the training
    sample. Simply put, the cost is for all the training samples, the model fit out
    of the true value of the training samples of the average error. And the cost function
    is the function relation between the cost and the model parameter. The process
    of model training is to find the appropriate model parameters to minimize the
    value of the cost function. The cost function is recorded as `j()`, representing
    the model parameters.


    The cost of the test data set, `Jtest()`, is the most intuitive indicator of the
    accuracy of the model. The smaller the `Jtest()` value means the smaller difference
    between the predicted value and the actual value of the model, and the better
    the prediction accuracy of the new data. Special attention is needed due to the
    fact that the test data set used to test the accuracy of the model must be "unheard
    of" data for the model. 


    ## Ways to Reduce the Risk of Overfitting


    1. **Start with the data and get more training data.**

    Using more training data is the most effective way to solve the overfitting problem
    because more samples can make the model learn effective features and reduce the
    impact of noise. Of course, it is usually difficult to add experimental data,
    but some rules can be adapted to expand training data. For example, in the problem
    of image classification, the data can be expanded by means of image translation,
    rotation, and so on.


    2. **Reduce model complexity.**

    The main factor of overfitting is that the model is too complex when the data
    is less. Reducing the model complexity properly can avoid too much sampling noise.
    For example, the network layer and the number of neurons are reduced in the neural
    network model, and the depth of the tree is reduced and the tree is pruned in
    the decision tree model.


    3. **Integrate learning method.**

    Ensemble learning is the integration of multiple models to reduce the overfitting
    risk of a single model, such as bagging method.


    ## Ways to Reduce Risk of Underfitting


    1. **Add new features.**

    When feature is not enough or the correlation between the existing feature and
    the sample label is not strong, the model is easy to be underfitted. By mining
    new features such as "context feature", "ID class feature" and "combination feature",
    better results can be obtained. In the deep learning trend, there are many models
    that can help to complete feature engineering, such as factorization machine,
    gradient lifting decision tree, deep-crossing, etc.


    2. **Increase model complexity.**

    The learning ability of the simple model is poor, and the model has a stronger
    fitting ability by increasing the complexity of the model. For example, the linear
    model adds higher order terms in the neural network model to increase the number
    of network layer or the number of neurons.


    3. **Reduce the regularization coefficient.**

    Regularization is used to prevent overfitting; but when the model appears underfitting,
    it is necessary to reduce the regularization coefficient. 


    ## Datasets and Examples


    It is generally accepted that machine learning is the main way to realize artificial
    intelligence, which is gradually realized by human beings based on machine learning
    and a huge amount of data, and deep learning is a branch of machine learning.
    If the three ranges are represented by concentric circles, then AI is the outermost
    circle and deep learning is the innermost circle. Artificial intelligence is the
    ability of machines to make decisions that humans can make in less than a second,
    and those machines can make decisions that one hundred thousand people can make
    in a second at the same time. 

