- raw: "The legitimacy of so-called “killer-robots” comes into question now and then\
    \ when a new system is announced. At the heart of the debate is whether a nation\
    \ should possess the kind of power to kill remotely without trial and in the case\
    \ of 16-year-old in a country that is not at war. Commentators are quick to point\
    \ out that a machine with killing power is capable of being hacked. They appeal\
    \ to the “Skynet” scenario where autonomous weapons gain sentience and begin to\
    \ exterminate humans. Such scenarios are mostly far-fetched science fiction and\
    \ are not helpful in the debate. While we know that some of these systems are\
    \ vulnerable to getting hacked, we have yet to see a hacked autonomous system\
    \ cause loss of life and limb. If there ever is a case where one does, it may\
    \ cause enough trouble that governments are forced to ban them. Still, others\
    \ question whether robots going to war is even a good idea. If state-of-the-art\
    \ machine learning algorithms can barely drive autonomous cares with a certain\
    \ degree of safety, how can we expect a robot to accurate wage war? War has several\
    \ more dimensions of complexity than driving down the street does. Deploying actual\
    \ robo-soldiers seems like an unlikely use of military spending with current technology\
    \ – though you can rest assured that major governments are researching them. \
    \ \n\nA “killer robot” is a blanket term that is also unhelpful. Should a Predator\
    \ drone be considered a robot any more than a tank with an autonomous turret is?\
    \ Sentry guns have been in development for several years now and are regularly\
    \ deployed into the battlefield. The most common of these are called close-in\
    \ weapon systems (CIWS) and are used to protect battleships from missile and aircraft\
    \ attacks. A CIWS is basically a large caliber cannon with a high rate of fire\
    \ that is capable of shooting down missiles at 4,000 rounds per minute or higher.\
    \ Unlike your grandfather’s anti-aircraft systems that may have required manual\
    \ sighting, CIWS use radar guiding on a rotating mechanical platform to lock on\
    \ targets autonomously. Not only that, but once “live”, the weapon system can\
    \ engage without manual input after locking on. Any missile or aircraft that is\
    \ detected by the radar system is automatically fired upon. In the case of the\
    \ Phalanx CIWS used by the US Navy, a single 20mm Vulcan gatling cannon is used\
    \ with computer-like accuracy. The problem of targeting is reduced to a simple\
    \ algorithm. It doesn’t require machine learning or any other fancy artificial\
    \ intelligence techniques. If the radar picks up an object that is approaching\
    \ the ship, it needs first to make sure that its course is directed towards the\
    \ ship. If the approach of the object is directly heading towards the ship, then\
    \ the system must decide to fire. If the object is in between the minimum and\
    \ maximum velocity range, then the cannon fires. But if the object is too slow\
    \ or too fast, the system does nothing. Both the minimum and maximum velocity\
    \ range can be programmed by the operator.  \n\nCWIS, like the Phalanx, are considered\
    \ autonomous weapons, yet they use very simple tech that has been around since\
    \ the Gulf War. However, by today’s standards, this is still a “dumb” cannon.\
    \ The imperfect nature of the weapon has been demonstrated in a few disastrous\
    \ training exercises. In one instance, the system successfully shot down a dummy\
    \ drone target, but fuel and debris from the explosion damaged the ship and crew\
    \ members. In another instance, the dummy drone was shot down, but the system\
    \ reengaged it as it was in free fall, inadvertently sending rounds in the direction\
    \ of an opposite ship and injuring crew members. This behavior should be expected\
    \ from its simple rules of operation. A more sophisticated weapon system could\
    \ probably have avoided these incidents. But as a last resort missile defense\
    \ system, the Phalanx does a relatively good job against isolated missile strikes.\
    \ Other autonomous, radar-guided systems are common throughout the world. Again,\
    \ these don’t need complicated machine learning schemes to identify targets and\
    \ engage them. Israel’s iron-dome system of missile defense is hailed by some\
    \ commentators as the most advanced missile defense system in the world. These\
    \ systems demonstrate some degree of intelligence, but really all they are doing\
    \ is calculating velocities.  \n\nAll things considered, the future of robotics\
    \ is bright. Demand for robot systems will likely rise with uneven proportion\
    \ to robotics professionals, creating well-paying jobs for those who are interested.\
    \ There will be a glut of these jobs and a shortage of robotics designers and\
    \ engineers. At the same time, lower-skilled jobs like robot technician and repairmen\
    \ may emerge. Robotics will infiltrate other areas of tech like the cloud computing\
    \ space and the internet of things. Robots connected to the cloud will lead to\
    \ the creation of a cloud robotics marketplace were bidders can remotely program\
    \ robots to perform certain tasks. Just like Alexa skills, these specific robot\
    \ programs can be bought and sold in an open marketplace. Not only this, but robotics\
    \ is taking on increasingly more important roles in business structure. A new\
    \ executive position called chief robotics officer (CRO) will emerge for bleeding-edge\
    \ organizations that make heavy use of robotic systems.  \n\nThere are split views\
    \ about just how far the field or robotics can go when it comes to automating\
    \ human tasks. Whether or not the introduction of these technologies leads to\
    \ technical unemployment and whether they should be regulated is up for debate. \
    \ \n\n# 6.Reinforcement Learning \n\nReinforcement learning involves where the\
    \ learning data is used to give feedback that will determine how the model adjusts\
    \ to the prevailing conditions in order to achieve the target. The system on its\
    \ own is able to evaluate the model performance based on feedback response provided\
    \ and then make necessary adjustments. For instance, the concept is perfectly\
    \ applied in self-driving cars (Artificial Intelligence) and also in chess master\
    \ algorithms. \n\nReinforcement learning as indicated above occurs in an interactive\
    \ environment. In other words, the learner is in no way taught what to expect\
    \ but finds out on their own according to the consequences of their actions, a\
    \ concept known as “goal-oriented learning”. In this chapter, we shall cover the\
    \ basics of RL and be ready to learn a lot. The major RL components that we will\
    \ cover in this section are listed below: \n\n·          Fundamentals of Reinforcement\
    \ Learning \n\n·          RL algorithm \n\n·          RL environment \n\n·         \
    \ Various RL platforms \n\n·          Applications of Reinforcement Learning \n\
    \nFundamentals of RL \n\nAssume we want to train a dog how to catch an object\
    \ thrown into the air. The dog may not necessarily understand all the concepts\
    \ and theories involved here. The best way to accomplish this is to throw the\
    \ object in the air and every time the dog catches it, be ready to reward it.\
    \ If the dog fails, then there is no reward. The dog will eventually analyze what\
    \ actions transpired until it was rewarded. The reward will motivate the dog to\
    \ repeat the same actions for more and more rewards. \n\nLikewise, in the RL environment,\
    \ you may be able to teach the model what to do but based on positive rewards,\
    \ the model will tend to repeat certain actions. The agent in this matter or a\
    \ model is more responsive to positive rewards and forget actions that led to\
    \ negative rewards. \n\nSometimes, we have scenarios of delayed rewards or may\
    \ be only given out when the task is done. There might be rewards or no rewards\
    \ at each step just to confirm if there are mistakes. \n\nAssume you are to teach\
    \ a robot on how to navigate through without hitting a mountain. \n\nOne rule\
    \ would be to take away 10 points when the robot hits a mountain and gets stuck.\
    \ Through this the robot will understand that whenever it hits a mountain, there\
    \ is a negative reward and therefore will not hit the mountain again. "
  fmt: "\nThe legitimacy of so-called “killer-robots” comes into question now and\
    \ then when a new system is announced. At the heart of the debate is whether a\
    \ nation should possess the kind of power to kill remotely without trial and in\
    \ the case of a 16-year-old in a country that is not at war. Commentators are\
    \ quick to point out that a machine with killing power is capable of being hacked.\
    \ They appeal to the “Skynet” scenario where autonomous weapons gain sentience\
    \ and begin to exterminate humans. Such scenarios are mostly far-fetched science\
    \ fiction and are not helpful in the debate. While we know that some of these\
    \ systems are vulnerable to getting hacked, we have yet to see a hacked autonomous\
    \ system cause loss of life and limb. If there ever is a case where one does,\
    \ it may cause enough trouble that governments are forced to ban them. Still,\
    \ others question whether robots going to war is even a good idea. If state-of-the-art\
    \ machine learning algorithms can barely drive autonomous cares with a certain\
    \ degree of safety, how can we expect a robot to accurate wage war? War has several\
    \ more dimensions of complexity than driving down the street does. Deploying actual\
    \ robo-soldiers seems like an unlikely use of military spending with current technology\
    \ – though you can rest assured that major governments are researching them. \n\
    \nA “killer robot” is a blanket term that is also unhelpful. Should a Predator\
    \ drone be considered a robot any more than a tank with an autonomous turret is?\
    \ Sentry guns have been in development for several years now and are regularly\
    \ deployed into the battlefield. The most common of these are called close-in\
    \ weapon systems (`CIWS`) and are used to protect battleships from missile and\
    \ aircraft attacks. A `CIWS` is basically a large caliber cannon with a high rate\
    \ of fire that is capable of shooting down missiles at 4,000 rounds per minute\
    \ or higher. Unlike your grandfather’s anti-aircraft systems that may have required\
    \ manual sighting, `CIWS` use radar guiding on a rotating mechanical platform\
    \ to lock on targets autonomously. Not only that, but once “live”, the weapon\
    \ system can engage without manual input after locking on. Any missile or aircraft\
    \ that is detected by the radar system is automatically fired upon. In the case\
    \ of the `Phalanx CIWS` used by the US Navy, a single 20mm Vulcan gatling cannon\
    \ is used with computer-like accuracy. The problem of targeting is reduced to\
    \ a simple algorithm. It doesn’t require machine learning or any other fancy artificial\
    \ intelligence techniques. If the radar picks up an object that is approaching\
    \ the ship, it needs first to make sure that its course is directed towards the\
    \ ship. If the approach of the object is directly heading towards the ship, then\
    \ the system must decide to fire. If the object is between the minimum and maximum\
    \ velocity range, then the cannon fires. But if the object is too slow or too\
    \ fast, the system does nothing. Both the minimum and maximum velocity range can\
    \ be programmed by the operator. \n\nCWIS, like the `Phalanx`, are considered\
    \ autonomous weapons, yet they use very simple tech that has been around since\
    \ the Gulf War. However, by today’s standards, this is still a “dumb” cannon.\
    \ The imperfect nature of the weapon has been demonstrated in a few disastrous\
    \ training exercises. In one instance, the system successfully shot down a dummy\
    \ drone target, but fuel and debris from the explosion damaged the ship and crew\
    \ members. In another instance, the dummy drone was shot down, but the system\
    \ reengaged it as it was in free fall, inadvertently sending rounds in the direction\
    \ of the. \n\n# 6. Reinforcement Learning\n\nReinforcement learning involves where\
    \ the learning data is used to give feedback that will determine how the model\
    \ adjusts. For instance, the concept is perfectly applied in self-driving cars\
    \ and also in chess. reinforcement learning as indicated above occurs in an interactive\
    \ environment. In other words, the learner is in no way taught what to expect\
    \ but finds out on its own according to the consequences of their actions, a concept\
    \ known as “goal-oriented learning”. In this chapter, we shall cover the basics\
    \ of RL. The major RL components that we will cover are:\n\n* Fundamentals of\
    \ Reinforcement Learning\n* RL algorithm\n* RL environment\n* Various RL platforms\n\
    * Applications of RL\n\n## Fundamentals of RL\n\nAssume we want to train a dog\
    \ how to catch an object thrown into the air. The dog may not necessarily understand\
    \ all the concepts and theories involved here. The best way to accomplish this\
    \ is to throw the object in the air and every time the dog catches it, be ready\
    \ to reward it. If the dog fails, then there is no reward. The dog will eventually\
    \ analyze what actions transpired until it was rewarded. The reward will motivate\
    \ the dog to repeat the same actions for more and more rewards. \n"
