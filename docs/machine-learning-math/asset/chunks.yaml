- raw: "Human beings have eradicated plant and animal species in order to create farmland\
    \ or as places of settlement. We recognize that there are problems in the way\
    \ that we interact with the environment and many AI theorists assume that artificial\
    \ intelligence would reach the same conclusion. Perhaps they would, but they might\
    \ have suggestions or even solutions that human beings have not thought of. Just\
    \ as human beings created new food sources for human beings to partake of over\
    \ a period of tens of thousands of years, artificial intelligence agents may come\
    \ up with new food sources or new ways of growing food that solves many problems\
    \ that human beings are faced with today. \n\nIn the film The Matrix, the machines\
    \ that rule the Earth eventually decide that human beings are a perfect source\
    \ of energy, and the machines keep human beings in a collective delusion in order\
    \ to pacify and sedate them. But this portrayal of machines implies that machines\
    \ would have the same sort of motivations that human beings would have. For example,\
    \ the relationship of human beings with other species on the planet is characterized\
    \ by a reduction of habitats and the number of competing species for the specific\
    \ intention of advancing human interest. A film like The Matrix assumes that machines\
    \ would interact with human beings and other species in this self-interested way.\
    \ \n\nIn reality, this perception that artificial intelligence would behave in\
    \ this somewhat maleficent human way – hunting human beings to extinction or turning\
    \ us into fodder – assumes that thinking machines would be motivated by the same\
    \ essential motivations that drive apex species in the animal kingdom. As much\
    \ as we as human beings may have a perception of our superiority and sanctity\
    \ as a species, human beings essentially behave in a very animalistic way. We\
    \ do it so successfully that we have gained a position of dominance over the other\
    \ species in our environment. \n\nFor example, a human family moves into a forested\
    \ area in which a bear resides. After several episodes in which the bear breaks\
    \ into the human residence, attracted by the smell of food or whatever else, the\
    \ family decides to have something done about the bear. Similarly, after deer\
    \ numbers explode in a rural area for a number of human-related reasons, the state\
    \ or county department of natural resources decides to start culling deer numbers\
    \ because of fears of accidents caused by deer, deer intrusion into human habitats,\
    \ et cetera. What underlies all of these interactions is the reality that human\
    \ interest is also believed to supersede the interests of other species. Instead\
    \ of the family moving to avoid the bear, they decide that the easiest thing to\
    \ do is to remove the bear. As human beings, our intentions are generally not\
    \ guided by a desire for equilibrium with our environments, but to advance our\
    \ interests in the environment to the greatest extent that we can. \n\nThough\
    \ we may design artificial intelligence with the goal of making it human-like\
    \ or humanized, we assume that fully conscious artificial intelligence – artificial\
    \ intelligence of exceeding its programming and acting independently of human\
    \ beings – would behave similarly to how we behave. Perhaps it would not. Perhaps\
    \ artificial intelligence would be able to achieve homeostasis with the global\
    \ environment that human beings are not able to achieve. \n\nThe purpose here\
    \ is not to advocate for artificial intelligence as being somehow better than\
    \ human beings, but to raise the philosophical question of what would be the motivations\
    \ of artificially intelligent life. When we assume that artificial intelligence\
    \ would have the same self-centered motivations that we as human beings have,\
    \ we assume that we are the ideal species on Earth and that any competitor of\
    \ ours would naturally resemble us in some way. This is not necessarily true.\
    \ \n\nAlthough artificial intelligence could (and likely will) develop the intellectual\
    \ capabilities that human beings possess, this does not mean that they would think\
    \ as we think and reach the same conclusions that we reach. When we as human beings\
    \ say that artificially intelligent machines could potentially eliminate the human\
    \ race what we are basically saying is that if we as human beings had the capabilities\
    \ that machines will have then we would wipe out human beings. \n\nExistentially-speaking,\
    \ there needs to be more discussion on what forms machine consciousness is likely\
    \ to take. Although artificial neural networks may be based on the neural connections\
    \ of human beings, assuming that artificial intelligence that is conscious would\
    \ naturally think and behave the way that a human being behaves is a massive leap\
    \ in reasoning. We do not know how machines are likely to think and we need to\
    \ explore this area. Recall the AI programs that had a conversation that no one\
    \ understood on social media. Human beings did not understand it. Why not? Because\
    \ we did not understand how they were using language and, also (and not less importantly),\
    \ we did not understand what motivations underlie the conversation. \n\n## Artificial\
    \ Intelligence and Machine Learning \n\nThe applications of artificial intelligence\
    \ are numerous and many of these are based on machine learning. Machine learning,\
    \ like deep learning, is one of the concepts that must be defined in order to\
    \ understand artificial intelligence and the direction that it has been taking\
    \ and is likely to take. Machine learning has been defined in different ways,\
    \ just as learning has. Machine learning can be summarized as the changes in machine\
    \ programming or data that occurs in order to improve machine performance. In\
    \ this fashion, machine learning is essentially tied to how machines store data\
    \ (including in .dat files and other extensions), and these tasks are closely\
    \ affiliated with concepts of artificial intelligence. \n\nArtificial intelligence,\
    \ especially in its human-inspired and humanized forms, is often conceptualized\
    \ in terms of tasks that machines complete that human beings would otherwise complete.\
    \ The idea of using machines to reason and learn in ways that humans are not able\
    \ to do (at least rapidly) is a more modern development. \n\nThinking about artificial\
    \ intelligence in terms of machine learning may help the reader to conceptualize\
    \ AI in a basic (and effective) way. The machine or agent is able to perceive\
