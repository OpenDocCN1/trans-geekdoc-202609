    # Data preprocessing


    The first thing that we are going to take a look at here to help us get started
    with some of the things that we can do with machine learning is data preprocessing.
    You need to make sure that any data you are working with is in the right format
    before they are able to work with machine learning at all. Converting data to
    the right format so that you can do some work with machine learning is going to
    be known as data preprocessing.


    Now, it is going to depend on the type of data you would like to work with, but
    there are going to be a few steps that need to happen in order to help you see
    the preprocessing work well. These steps are important to work with because they
    will ensure the data comes in the right form to be used. The steps that you should
    focus on for this part will include:


    * Getting the data set

    * Importing your libraries

    * Importing the dataset

    * Handling any of the missing values

    * Handling the categorical data

    * Dividing the data into different training sets and test sets

    * Scaling the data.


    Let’s take a closer look at each of these and how they can work together to prepare
    your data the proper way.


    ## Getting the data set


    Now, we need to take a bit of time to look over this set of data. When we do that,
    we start to notice that there is a lot of information about the age, gender, and
    the `BMI` of the patients at hand. This set of data is also going to come with
    an extra column that will show us whether or not the patients we are looking over
    are diabetic or not. You should also notice that the age and the `BMI` columns
    are going to be numerical, while the other two columns are going to be categorical
    in nature instead.


    Another distinction that we need to make here is going to be between the dependent
    variable and the independent variable. When we are looking these over, the variable
    whose value is predicted to come in as dependent and the variables that are used
    to make these predictions will become our independent variables. When we look
    at this kind of example, the `diabetic` column is going to be seen as the dependent
    variable because it will rely, at least a bit on the other columns there. Then
    we will notice that the other columns are going to be out independent options.


    ## Importing the libraries that you need


    Now that you have some of the data that you need to get started on this, you need
    to work on importing the library. Python automatically comes with some prebuilt
    libraries that are able to perform a variety of tasks. For the purpose of this
    book, we are going to use the `Scikit Learn` Library. To keep it simple, we are
    going to install three libraries that are the most essential for helping us do
    machine learning. These include `numpy`, `matplotlib.pyplot`, and `pandas`.


    First off is the `numpy` library. This is a good one to download because it can
    help you get some of those mathematical functions that are more complex done.
    Since machine learning does spend time in the mathematical field, it is worth
    your time to make sure that this particular library is in place.


    The next library that you will want to take a look at is going to be the `matplotlib.pyplot`
    library. This is another good one that can be used often because it helps with
    any of the charts that you will want to work with. Often, when you are looking
    through some of the data is needed to work with machine learning, it is helpful
    to have this library present. It at least lets you have a good idea of the data
    points and where they fall on the charts.


    And we need to take some time to download the `Pandas` library. This one is important
    as well, and you will find that it is really easy to use. Many times a programmer
    is going to be able to use it in order to import and view any of the sets of data
    that they want to use with machine learning.


    If you want to import these libraries, you will either need to come up with a
    new notebook for Python in Jupyter. To help us get started with this one, we need
    to use the codes below:


    ```python

    import numpy as np

    import matplotlib.pyplot as plt

    import pandas as pd

    ```


    ## Importing the dataset that you need


    Once you have been able to import the libraries, it is now time to look at the
    steps. The data set we need will be in Comma Separated Values, or `csv`. The pandas
    library will have inside it the `read_csv` function that is going to take us the
    path to the file and then load up the set of rows and columns. To help us get
    this happen, we use the code:


    ```python

    patient_data = pd.read_csv("D:/Datasets/patients.csv")

    ```


    If you are using the Jupyter notebook, this is even easier to do. You would just
    use the following script to see the data data:


    ```python

    patient_data.head()

    ```


    But, if you are working with Spyder, you would go over to Variable explorer and
    then double click on the `patient_data` variable. Once you click on it, you will
    be able to see all the details of this.


    ## Dividing the data


    When we reach this point in the process, the next step is to divide the set of
    data into a matrix of features and vector of dependent variables. The feature
    set is going to be able to hold all the variables that you have considered independent.


    For example, the feature matrix for `patients.csv` data set is going to include
    the information that you place for age, `BMI`, and gender. In addition, the size
    that you see with your feature matrix is going to be equal to the number of independent
    variables by the number of records. For this example, our matrix is going to end
    up being three by twelve. This is because we have three independent variables
    and twelve patients with records we are going to look at.


    To help us get started with this, we need to first go through and create the feature.
    You are able to provide it with any name that you would like, but the traditional
    method of doing this is going to be with the capital `X`. To help us have a better
    chance at reading the code, we will give it the name of `features`, and then use
    the script below:


    ```python

    features = patient_data.iloc[:,0:3].values

    ```


    With the script that we used above, the `iloc` function of your data frame is
    used to help select all the rows as well as the first three columns from the `patient_data`.
    This `iloc` function is going to take on two parameters: the first is the range
    of rows to select, and then the second part is going to be the range of columns
    you want the program to select.


    If you would like to create your own label vector from here, you would use the
    following script to get it done:


    ```python

    labels = patient_data.iloc[:3].values

    ```

