    First, we need to define a robot. They are machines, often programmable by a computer,
    that are able to carry out a series of complex actions without intervention. A
    robot can have its controls systems embedded or be controlled by an external device.
    In popular literature and film, many robots are designed to look like people,
    but in fact, they are usually designed to perform a task and that requirement
    determines how they appear.


    Robots have been with us for almost as long as computers. George Devol invented
    the first digitally operated and programmable one in 1954, called `Unimate`. In
    1961, General Motors bought it to use for lifting hot metal die castings. And
    like computers, robots have changed our society. Their strength, agility, and
    ability to continue to perfectly execute the same repetitive tasks have proved
    an enormous benefit. And while they did cause some serious disruption to the manufacturing
    industries, putting many people out of work, their ascension in our societies
    has provided far more employment opportunities than they have taken.


    Robots in current use can be broken down into several categories:


    ## Industrial Robots/Service Robots


    These robots are probably familiar. You have likely seen them on the television
    or streaming video of automated factories. They usually consist of an “arm” with
    one or more joints, which ends with a gripper or manipulating device. They first
    took hold in automobile factories. They are fixed in one location and are unable
    to move about. Industrial robots will be found in manufacturing and industrial
    locations. Service robots are basically the same in design as industrial robots
    but are found outside of manufacturing concerns.


    ## Educational Robots


    These are robots used as teacher aids or for educational purposes on their own.
    As early as the 1980s, robots were introduced in classrooms with the turtles,
    which were used in classrooms where students could train them using the `Lego`
    programming language. There are also robot kits available for purchase like the
    `Lego Mindstorm`.


    ## Modular Robots


    Modular robots are consisted of several independent units that work together.
    They can be identical or have one or more variation in design. Modular robots
    are able to attach together to form shapes that allow them to perform tasks. The
    programming of modular robotic systems is of course, more complex than a single
    robot, but ongoing research in many universities and corporate settings is proving
    that this design approach is superior to single large robots for many types of
    applications. When combined with `Swarm Intelligence` (see below), modular robots
    are proving quite adept at creative problem-solving.


    ## Collaborative Robots


    Collaborative robots are designed to work with human beings. They are mostly industrial
    robots that include safety features to ensure they do not harm anyone as they
    go about their assigned tasks. An excellent example of this kind of collaborative
    robot is `Baxter`. Introduced in 2012, `Baxter` is an industrial robot designed
    to be programmed to accomplish simple tasks but is able to sense when it comes
    into contact with a human being and stops moving.


    Of course, all the examples above do not require any artificial intelligence.
    When robots are coupled with machine learning, researchers use the term “Robotic
    Learning”. This field has a contemporary impact in at least four important areas:


    ### Vision


    `Machine Learning` has allowed robots to visually sense their environment and
    to make sense of what they are seeing. New items can be understood and classified
    without the need to program into the robot ahead of time what it is looking at.


    ### Grasping


    Coupled with vision, `Machine Learning` allows robots to manipulate items in their
    environment that they have never seen before. In the past, in an industrial environment,
