    their environment that they have never seen before.


    In 2019, there will be an estimated million robots in service. As more and more
    robots are combined with `Machine Learning`, this number is sure to explode.


    # 13. How AI Is Revolutionizing Industry


    Artificial intelligence is arguably the single factor that is most changing industry
    today and is likely to continue to do so in the future. Many think of AI in terms
    of commercially available products that they may use in their daily life. `Siri`
    and `Alexa`, in addition to smart home AI and other IoT devices that use AI, have
    become ubiquitous. But artificial intelligence is changing industry in ways that
    are invisible to many men and women.


    ## Agriculture


    Agriculture is an industry that often falls under the radar in developed nations
    because it generally represents such a small percentage of GDP. Even in countries
    where agricultural products are major exports, agriculture is often not being
    perceived as being significant as computer technology, aviation, heavy industry,
    or other industries that are more conspicuous. But agriculture is important, and
    AI has been changing this industry in dramatic ways.


    Three keys ways in which AI is changing agriculture include AI use in predictive
    analytics, crop and machinery monitoring, and agricultural robots. Agriculture
    robots powered by AI can actually farm the land in ways similar (if not superior)
    to human workers of the past. AI can also be involved in analyzing farm operation
    data, much as it is able to do in other businesses. Finally, AI can use drones
    and other agents (including computer programs) to monitor both crops and machinery
    in ways that would not been possible before.


    ## Education


    AI applications in education are very numerous. Although education is often thought
    of as an area that perhaps requires a human finesse or emotional intelligence,
    many educators have jumped on the AI bandwagon as they recognize how AI can aid
    them in their educator tasks. Ways that AI is changing education include distance
    learning, chatbots, school recruitment and outreach, computers using AI in the
    classroom or dorm room, shifting role of educators in schools based on AI assuming
    roles, feedback for both educators and students, artificial intelligence tutors
    for students, AI agents for grading, and tailoring of educational software to
    student needs.

