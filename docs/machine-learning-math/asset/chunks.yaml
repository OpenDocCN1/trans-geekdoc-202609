- raw: "This is one of the times when you are going to want to choose the random forest\
    \ rather than working with the decision trees, and knowing which time to use each\
    \ of these different learning algorithms. Some examples of when the programmer\
    \ would want to work with a random forest include: \n\n·          When you are\
    \ working on your own training sets, you will find that all of the objects that\
    \ are inside a set will be generated randomly, and it can be replaced if your\
    \ random tree thinks that this is necessary and better for your needs.  \n\n·         \
    \ If there are M input variable amounts, then m<M is going to be specified from\
    \ the beginning, and it will be held as a constant. The reason that this is so\
    \ important is that it means that each tree that you have is randomly picked from\
    \ their own variable using M.  \n\n·          The goal of each of your random\
    \ trees will be to find the split that is the best for the variable m.  \n\n·         \
    \ As the tree grows, all of these trees are going to keep getting as big as they\
    \ possibly can. Remember that these random trees are not going to prune themselves. \
    \ \n\n·          The forest that is created from a random tree can be great because\
    \ it is much better at predicting certain outcomes. It is able to do this for\
    \ you because it will take all prediction from each of the trees that you create,\
    \ and then will be able to select the average for regression or the consensus\
    \ that you get during the classification.  \n\nThese random forests are going\
    \ to be the tool that you want to use many times with the various parts of data\
    \ science, and this makes them very advantageous compared to the other options.\
    \ First, these algorithms are able to handle any kind of problem that you are\
    \ focusing on, both the regression and classification problems. Most of the other\
    \ learning algorithms that you will encounter in this guidebook are only able\
    \ to handle one type of problem rather than all of them.  \n\nAnother benefit\
    \ of these random forests is that they are going to help you handle large amounts\
    \ of data. If your business has a lot of different points that you want to go\
    \ through and organize, then the random forest is one of the algorithms that you\
    \ need to at least consider.  \n\nThere is a limitation that comes with using\
    \ random forests though, which is why you will not be able to use it with all\
    \ of the problems that you want to take on. For example, this can work with regression\
    \ problems like we talked about before, but they are not going to be able to make\
    \ any kind of prediction that goes past the range that you add to your training\
    \ data. You will be able to get some predictions, of course, but these predictions\
    \ will end up becoming limited. It will stop at the ranges that you provide, lowering\
    \ the amount of accuracy that is found there.  \n\nKNN Algorithm \n\nNext on the\
    \ list of learning algorithms that we are going to take a look at is the K-nearest\
    \ neighbors, or KNN, algorithm. This is one that is used a lot in supervised machine\
    \ learning, so it is worth our time to take a look at it here. When you work with\
    \ the KNN algorithm, you are going to use it to help take a lot of data and search\
    \ through it. The goal is to have k-most similar examples for any data instance\
    \ that you would like to work with. When you get this all organized in the proper\
    \ manner, this KNN algorithm will be able to take a look through that set of data,\
    \ and then it will summarize the results before using these to make the right\
    \ predictions that you need. \n\nA lot of businesses will use this kind of model\
    \ in order to help them become more competitive with the kind of learning that\
    \ they are able to do in the industry. This is going to work because there will\
    \ be a few elements in this model that will compete against each other. The elements\
    \ that end up winning in here are going to be the way that you are the most successful\
    \ and you get the prediction that will work the best for you.  \n\nCompared to\
    \ the other two learning algorithms that are out there, this one is going to be\
    \ a bit different. In fact, some programmers are going to see this as one of the\
    \ lazier learning processes because it is not able to really create any models\
    \ unless you go through and ask it to do a new prediction. This is a good thing\
    \ for some projects if you would like to keep the information in the models relevant\
    \ or have more say in what you are adding to the models, but in other situations,\
    \ it is not going to be all that helpful.  \n\nThere are a lot of benefits of\
    \ working with the KNN learning algorithm. For example, when you choose to use\
    \ this kind of algorithm, you can learn how to cut out the noise that sometimes\
    \ shows up inside the set of data. The reason that this works is that it is going\
    \ to work solely with the method of competition to help sort through all of the\
    \ data in the hopes of finding the stuff that is the most desirable. This algorithm\
    \ is useful because it can take in a lot of data, even larger amounts, at the\
    \ same time which can be useful in a lot of different situations.  \n\nHowever,\
    \ you are going to run into a few conditions to consider when it comes to this\
    \ algorithm. The biggest issue is that there are high amounts of costs computationally,\
    \ especially when you compare it to what some of the other learning algorithms\
    \ will do. This is because KNN is going to look through the points, all of them\
    \ before it sends you a prediction. This takes a lot of time and money overall,\
    \ and may not be the one that you want to use.  \n\nRegression Algorithms \n\n\
    Next on the list is the regression algorithm. You will be able to use this because\
    \ it is a type where you will investigate the relationship that is there between\
    \ the dependent variables and the predictor variables that you like to use. You\
    \ will find that this is the method a programmer will want to work with any time\
    \ they see there is a casual relationship between the forecasting that you do,\
    \ the time-series modeling, and all of the variables.  \n\nYou will want to work\
    \ with these regression algorithms any time that you want to take all of the different\
    \ points in your set of data and you want it to fit onto a line or a curve as\
    \ closely as possible. This helps you to really see if there are some factors\
    \ that are common between these data points so that you can learn about the data\
    \ and maybe make some predictions as well.  \n\nMany programmers and companies\
    \ are going to use this kind of regression algorithm in order to help them make\
    \ great predictions that then help the business to grow, along with their profits.\
    \ You will be able to use it in order to figure out a good estimation of the growth\
    \ in sales that the company is looking for, while still being able to base it\
    \ on how the conditions of the economy in the market are doing now and how they\
    \ will do in the future.  \n\nThe neat thing about these kinds of learning algorithms\
    \ is that you are able to place in any kind of information that seems to be pertinent\
    \ for your needs. You are able to add in some information about the economy, both\
    \ how it has acted in the present and in the past so that this learning algorithm\
    \ is able to figure out what may happen to your business in the future. The information\
    \ that you add to this needs to be up to date and easy to read through, or this\
    \ algorithm could run into some issues.  \n\nLet’s take a look at an example of\
    \ how this can work. If you go with the regression algorithm and find that your\
    \ company is growing near or at the same rate that other industries have been\
    \ doing in this kind of economy, then it is possible to take that new information\
    \ and use it to make some predictions about how your company will do in the future\
    \ based on whether the economy goes up or down or even stays the same.  \n\n#\
    \ 10.How To Build A Predictive Model "
