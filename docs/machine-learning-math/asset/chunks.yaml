    ### 数据


    机器人现在能够分析数据。


    ## 工业机器人与机器学习的示例


    将`Machine Learning`应用于机器人的一个例子是工业机器人。当然，上述所有示例都不需要任何人工智能。在过去，在工业环境中，`Machine Learning`允许机器人操纵环境中从未见过的物品。在过去，在工业环境中，`Machine
    Learning`允许机器人操纵环境中从未见过的物品。


    到 2019 年，预计将有数百万服务机器人。随着越来越多的机器人与`Machine Learning`结合，这个数字将会爆炸。


    # 13. 人工智能如何变革工业


    人工智能可能是目前最改变工业的单一因素，并可能在未来继续这样做。许多人将 AI 认为是他们在日常生活中使用的商用产品。除了`Siri`和`Alexa`，智能家居
    AI 和其他使用 AI 的物联网设备也已变得无处不在。但人工智能正在以许多人无法察觉的方式改变工业。


    ## 农业


    农业在发达国家通常是一个被忽视的行业，因为它占 GDP 的比例通常很小。即使在农产品是主要出口产品的国家，农业通常也不被认为比计算机技术、航空、重工业或其他更显眼的行业重要。但农业是重要的，AI
    一直在以戏剧性的改变这一行业。


    AI 改变农业的三大关键方式包括预测分析的应用、作物和机械监测以及农业机器人。由 AI 驱动的农业机器人实际上可以与过去人类类似甚至更优的方式耕种土地。AI
    还可以分析农场运营数据，就像它在其他业务中所做的那样。最后，AI 可以使用无人机和其他代理（包括计算机程序）以以前无法实现的方式监测作物和机械。


    ## 教育


    AI 在教育中的应用非常多。尽管教育通常被认为是一个可能需要人类技巧或情感智能的领域，但许多教育者已经加入了 AI 的行列，因为他们意识到 AI 如何帮助他们完成教育任务。AI
    改变教育的方式包括距离学习、聊天机器人、学校招募和推广、计算机在教室或宿舍中使用 AI、基于 AI 承担角色后教育者身份的变化、对教育者和学生的反馈、学生的
    AI 导师、AI 评分代理以及针对学生需求定制教育软件。

