    One of the biggest problems that you are going to see when you decide to work
    with the `KNN` algorithm is that the costs of computing the information are going
    to be pretty high, especially when you try to compare it to some of the algorithms
    that are there. This is because this kind of algorithm is meant to take a look
    at all of the data points that you have, each and every one before it sends out
    the prediction that you want. This sometimes provides more accurate predictions
    and information, but the computational costs may be too high for some people.


    # 3 Types of Artificial Intelligence and Machine Learning


    Artificial intelligence is occasionally divided into types based on the characteristics
    of artificial intelligence (and, indirectly, the intentions of the artificially
    intelligent software). This approach to artificial intelligence allows computer
    scientists to create AI programs along with a pattern of capabilities, while it
    also allows non-science people to understand how AI of certain type functions.
    The three main types of artificial intelligence in this common division are listed
    below:


    * Analytical artificial intelligence

    * Humanized artificial intelligence

    * Human-inspired artificial intelligence


    The first of these types is referred to as analytical artificial intelligence,
    and it includes the cognitive capabilities of artificial intelligence (as opposed
    to the task-driven types of AI). Research in analytical artificial intelligence
    would involve studying how artificially intelligence machines can create cognitive
    representations of the world and use these basic representations to engage in
    learning.


    Another type of artificial intelligence is the so-called humanized artificial
    intelligence, which incorporates types of intelligence outside of cognition. This
    would include social intelligence and emotional intelligence, meaning those aspects
    of intelligent action that are based on capabilities apart from relatively straightforward
    receiving information and processing it in various ways. Human beings are able
    to show sympathy and feel empathy for other human beings, which are aspects of
    emotional intelligence. A potential application of this in the context of artificial
    intelligence might include a computer program or a robot that recognizes when
    it needs to show sympathy. For example, a program may wish someone a happy birthday,
    express sorrow at the loss of a family member or other tragedy, or it may give
    some other sign (like a change in a robotic facial expression) that represents
    that the AI is aware that an event of import has occurred and a display of some
    kind is warranted or expected.


    Social intelligence involves the ways that humans use self-awareness and group
    awareness to interact effectively in the social environment. Self-awareness, in
    this case, does not necessarily mean the consciousness that some people associate
    with the implicit dangers of artificial intelligence, but it refers to having
    an understanding of oneself, including understanding how aspects of oneself may
    be singular or different from other people. Social intelligence in the context
    of artificial intelligence may include a machine’s ability to recognize a group
    dynamic and also to interact successfully with human beings in a social setting.


    Advances in humanized artificial intelligence capabilities have clear implications
    in business, finance, and medicine. One potential application that has already
    been attempted is the ability of artificial intelligence programs to engage in
    dialogue with human beings or create scripts for human beings to follow for interaction
    with other human beings. Some websites have AI that interacts with people that
    visit the website, while in the future robots would use this type of AI to be
    able to successfully interact with human beings without appearing “robotic”.


    Advancements in robotics are a clear use for humanized AI as well as a related
    type of artificial intelligence, the so-called human-inspired artificial intelligence.
    Human-inspired artificial intelligence is similar to humanized artificial intelligence,
    but with a focus on cognitive intelligence and emotional intelligence. A human-inspired
    artificial intelligence program or robot would be able to process information,
    learn, and respond appropriately, but this type would not be able to understand
    human relationships.


    ## Will Artificial Intelligence Resemble Human Intelligence?


    A discussion of humanized artificial intelligence leads naturally into the predictive
    question of whether artificial intelligence in the future will resemble human
    intelligence or simply “humanness.” If the universe is conceived as essentially
    good creation (or simply a thing that exists) and human beings are also conceived
    as being good, then there is no reason to believe that artificial intelligence
    poses an essential danger to humans.


    But if the universe is perceived as something equivocal, a creation that is neither
    good nor bad and which good or bad things interact with one another to the detriment
    of one or the other then artificial intelligence becomes something potentially
    dangerous. If we truly live in a “dog eat dog” world then the dangers of creating
    something more intelligent than we are are obvious. If human beings mistreat the
    creatures under their stewardship then how can we say we too will not be mistreated
    by machines?


    What this sort of questions accomplish is to imbue the artificial intelligence
    debate with a philosophical bend that is often ignored. Although the issue with
    artificial intelligence seems to be whether we human beings can trust machines
    enough to imbue them with powers greater than our own, it is really a question
    about human nature itself. The tacit assumption underlying AI fears is that artificial
    intelligence will eventually become like humans and that this eventuality is something
    frightening.


    Fictional portrayals of artificial intelligence will be explored in more detail
    later in the book, but it is important to mention them in passing here. In movies
    like `The Terminator`, artificially intelligent robots (and the artificially intelligent
    programs that direct them) are perceived as thinking in the way that human beings
    think. In other words, the idea that human beings are dangerous to the environment
    or to the universe itself and therefore should be eliminated is a human-type logic.
    This type of logic says: “This thing is bad, we should get rid of it.” But it
    is difficult for us to say just how conscious machines (thinking machines using
    artificial intelligence) would perceive human beings.


    A human being may remove all the weeds from a garden because it understands that
    the weeds are dangerous to flowers or crops, or a human being may hunt foxes and
    wolves because the danger that these animals pose to farm animals and livestock.
    This does not mean necessarily that an artificially intelligent machine would
    behave the same way. If a sugar cane plantation is run by an artificially intelligent
    program and the goal is to increase production, the AI program may reach the same
    conclusion that a human being would: this particular thing is dangerous to the
    plantation, it should be removed. But perhaps the program reaches the conclusion
    that the sugar plantation itself is unnecessary: that sugary products are not
    necessary at all and that we should move away from growing them. Or perhaps the
    machine would have an understanding of where to grow things that we as human beings
    do not have.

