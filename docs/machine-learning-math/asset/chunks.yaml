    ### Motion Control


    With the aid of `Machine Learning`, robots are able to navigate obstacles.


    ### Data


    Robots are now able to analyze data.


    ## Example of Industrial Robots and Machine Learning


    One example of applying `Machine Learning` to robots is industrial robots. In
    the past, in an industrial environment, `Machine Learning` allows robots to manipulate
    items in their environment that they have never seen before. In the past, in an
