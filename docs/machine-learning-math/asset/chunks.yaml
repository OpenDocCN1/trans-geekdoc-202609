    Inherent in the machine learning discussion is whether machines should be able
    to learn at all. Some suggest that the best way to use artificial intelligence
    is in a supervised fashion, where agents are programmed to complete tasks and
    do not experience the change to their components or learning. Allowing machines
    to engage in learning covers the reality that some tasks cannot be adequately
    programmed and require a machine to learn (think about an AI program playing chess,
    for example). Machine learning also allows human beings in the background to access
    information about relationships for the purposes of data mining.


    Related to machine learning is the concept of deep learning. Deep learning is
    a category of algorithms of machine learning that allows increasingly greater
    processing of raw input data to occur. Deep learning is referred to as deep because
    it involves layers of data representation that allows increasingly complex operations
    to be performed. The deep or layered aspect of deep learning is important as it
    represents a form of how human neural networks process information, by creating
    models that may be quite abstract. Deep learning will be discussed in greater
    detail later.


    # 4. Stacked Denoising Autoencoders


    In this chapter we are going to explore autoencoders, with a specific focus on
    stacked denoising autoencoders. We will mainly focus on the theory behind these
    networks and learn the important concepts and techniques. We will not dive in
    too deep when it comes to code, because this topic is somewhat more advanced and
    not entirely befitting an intermediary guide to machine learning. However, it
    is important that you study the theory and the principles of autoencoders so that
    you can later add another tool to your machine learning kit.


    Before we start exploring and discussing the stacked denoising autoencoders, we
    need to talk about autoencoders in general.


    ## Autoencoders


    They are another important piece of the deep learning puzzle. In many ways autoencoders
    are similar to the restricted Boltzmann machine. You can call them related because
    autoencoders train in the same fashion as `RBMs`. It is worth mentioning, however,
    that they are trained easier in some cases and they are often preferred when the
    Boltzmann machine isn’t performing well. But what is an autoencoder, exactly?


    It is a neural network with a 3-layer structure where the outputs are connected
    to the inputs. The purpose of an autoencoder is to learn the encoding (or representation)
    for a dimensionality reduction. This is achieved by ignoring any signal noise.
    However, this is only one side of the network. The other side is about reconstruction,
    where we take the reduced representation and build up the encoding to be nearly
    the same as the input we started with. In other words, the autoencoder compresses
    the data from the input layer, and then takes that compressed data to uncompress
    it so that it matches the original data. This is done so that dimensionality reduction
    is performed, and to ignore data noise.


    To give you an example, we can use a simple autoencoder to work on image recognition.
    We take the first encoding layer to encode basic image data such as the corners.
    Then the second encoding layer will process the output of the first layer and
    encode other features, such as the iris of an eye. Lastly, we have the third layer
    that can encode the rest of the eye until we have the entire image code to match
    whatever the image represents. In the final phase, the layers will then decode
    all of these representations back into the original data.


    Autoencoders fulfill the same purpose as `PCA`. But why bother to employ this
    technique if we already have a similar one? Simply put, it depends on the data
    you’re working with. There’s a downside to `PCA`. It is not so effective when
    it comes with high-dimensional data, however autoencoders perform extremely well.
    Autoencoders are simply more advanced techniques that apply noise reduction and
    stacking methods. This allows them to work with complex data at large scales,
    while also maintaining accuracy.


    Now that you know more about autoencoders, let’s study the structure or architecture
    to gain a better understanding of how they are implemented.


    ### Structure and Learning


    The architecture of an autoencoder is fairly basic. Like with most basic structures,
    the input data goes to the hidden layer, and from there to the output layer. One
    key difference compared to other neural networks is that the hidden layer contains
    the smallest number of nodes compared to the input and output layers.


    Another feature worth mentioning is that the output is set as the input. Why?
    Because after encoding the input in the hidden layer, we rely on the accuracy
    to reconstruct it. Here’s a simple example of the encoding:


    ```

    y = s(Wx + b)

    ```


    In this example, the encoding is done by mapping the `x` input to a new version
    of itself `y`. Just like in a previous example, `W` represents the weight value
    that is attached to `x` and `b` is a variable that can be adjusted. These variable
    adjustments can be extremely useful. Now let’s take a brief look at the learning
    process. When this type of network trains, it relies on a low error in order to
    be as accurate as possible.


    ### Stacked Denoising Autoencoders


    Autoencoders are useful and powerful on their own, however by stacking them we
    can boost the accuracy greatly. Stacked denoising autoencoders are extremely popular
    tools used in data science and machine learning, especially when working with
    natural language processing. These networks can also be applied on image, audio,
    or text data. This accuracy can be attained by directing the encoded representation
    from one layer to the next as the input of that layer.


    Stacked denoising autoencoders are used in a similar fashion as the restricted
    Boltzmann machines. Every single layer will be composed from a denoising autoencoder,
    and a sigmoid element. The autoencoder element is used in a pretraining process
    of the entire net.


    Take note that when working with stacked denoising autoencoders, we are using
    the training set error as the performance measure. This involves a process of
    layer to layer pretraining because we required the network parameters to be aligned
    before performing the optimization process. When we start with the fine tuning,
    we need test and validation data to train the network. This is done over epochs,
    but only a small number of them because we’ll have greater update phases. The
    purpose of this entire process is to obtain results that are as accurate as they
    can be.


    To summarize for now, we so far have two major advantages: learning feature representations
    for high dimensional datasets, and training without involving complex feature
    engineering. On top of these two benefits, there’s a third characteristic worth
    keeping in mind. If we properly construct a stacked autoencoder, we can obtain
    the hierarchic form of its input data. Then if we have consecutive layers of a
    stacked autoencoder, they can learn high level features progressively. There are
    no limits or rules that dictate the number or size of layers. It all depends on
    our scenario and what problem we need to solve. The only real approach to the
    process is exploring and experimenting with the parameters.


    High layers can learn complex structures and compositions, meaning that they can
    recognize human faces and patterns, handwritten characters, and other various
    objects. Stacked denoising autoencoders are great at learning extremely complex
    data as they can be infinitely stacked. Repeatedly stacking autoencoders can only
    improve the performance and capabilities of a deep network, with the only serious
    downside being the time and power it takes to compute everything.

    '
