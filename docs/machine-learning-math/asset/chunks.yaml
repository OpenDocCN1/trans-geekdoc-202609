    *   **Word bag model**: If a word appears more than once in a document, count
    the number of times it appears (frequency).


    The essential difference between the two is that the word bag increases the frequency
    dimension based on the word set: the word set only concerns with and without,
    and the word bag also concerns with several. When processing data, `CSV` is the
    most common format, with each line of the file recording a vector, with the last
    column marked. `TensorFlow` provides a very convenient way to read data sets from
    `CSV` files.


    # 2. Decision Trees


    The first algorithm we are going to take a look at with supervised machine learning
    is the decision trees. These are nice to work with because they are efficient
    data tools any time that you would like to look at the different scenarios that
    are provided, and then pick out the right options for these for your business.
    Once the decision tree is able to present you with a few options, you can see
    the outcomes and the possibilities that come with them. And all of this information
    can be used in order to help you make predictions that are the most accurate and
    helpful for your needs.


    It is also possible to use these decision trees for either continuous random variables,
    or when you want to work with categorical variables. However, most of the time,
    when you decide to work with these decision trees, you are working with classification
    problems.


    In order for a programmer to make a good decision tree, it is important to take
    all of the data and split it up into domains, and then you will split it up into
    a minimum of two sets, even though you will often get more, of similar data. These
    data sets are going to be sorted out with the help of their independent variables
    because it will make it easier to distinguish the different sets that you are
    working with as well.


    So, we have talked about these a bit here, but it is time to get a better idea
    of how this works. For this example, we are going to assume that there are 60
    people in the group. Out of these people in the group, there are going to be three
    independent variables to consider including their gender, which class they are
    in, and their heights.


    When we take a look at all of these people in the group, we know from the start
    that half of them, or 30 people, like to spend some of their time playing soccer.
    So, with this knowledge, we decide to work on a model that will help us to better
    figure out which of the students are soccer players and enjoy playing this sport,
    and which ones aren’t.


    To help us to figure this out, we need to work on a decision tree, one that is
    able to look at the people in the group and divide them up based on their similarities
    and more. We would use the three variables that we talked about before. If the
    decision tree works out the way we would like, or hope is that we are going to
    find a set of students that can end up homogenous when it is all said and done.


    Of course, there are some other algorithms that you are able to use to figure
    this one out. And some of them are going to work well with the decision tree to
    ensure that you can accurately split up the data that you have. This is to ensure
    that you are going to end up with two subsets at a minimum and that the outcomes
    of both of these subsets are going to end up homogenous. It is possible to have
    more of these, but since we are just trying to figure out whether we have a person
    in the group who likes to play soccer or not, right now we are just going to work
    on dividing the students up into two groups, whether they play soccer or not.

