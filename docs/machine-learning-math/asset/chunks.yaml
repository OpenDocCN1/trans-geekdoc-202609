    # Introduction


    In this chapter we are going to melt through the keyhole to the other side...
    We’ll cross the boundary from the sane and sensible world of the everyday into
    the twisted multi-dimensional realm of the data scientist; i.e. technical specialists
    with mathematics degrees and PhDs. On our journey we are going to:


    * Describe the process that a data scientist should follow when applying machine
    learning to develop predictive models that are going to be used to drive business
    benefits as part of an automated decision-making system.

    * Explain this process in a way that a normal person can understand. This is to
    help you keep tabs on what data scientists are doing. This in turn will ensure
    that you get what you have asked for, rather than what the data scientist thinks
    your organization needs.


    In my experience, when data scientists have been left to “just get on with it”
    and deliver results as a coup de grace at the end of the project, what tends to
    be delivered are sub-optimal solutions. In the worst case, they may fail to deliver
    anything useful at all.


    The vast majority of the data scientists I’ve worked with are very conscious of
    the need to involve their clients in the machine learning process and have worked
    hard to get business input to their projects. However, it’s sad to say that I
    have also seen more than one instance of deliberate attempts by data scientists
    to confuse normal people with tech speak or have avoided speaking to them all
    together. This is so they can get on with the important mathsy stuff without having
    to deal with those awful dumb wits who actually have to run the organization on
    a day-to-day basis.


    A simple rule is that if a data scientist can’t explain to you what they have
    done and why, then they have failed in their task. They also need to give the
    business a clear understanding of what the benefits of their work are. As a business
    user, I have no interest in the fact that a predictive model is 95% accurate and
    this is 10% more discriminatory than the process it’s going to replace. What I
    want to know is how much money it’s going to make me, how many lives it’s going
    to save, how many less staff I’ll need to employ, or whatever. It’s a poor data
    scientist that can’t express the benefits of their solution in terms of the benefit
    it will provide to their client’s bottom line.


    However, it works both ways and it’s not fair to lay everything on the data scientists.
    It’s not an unreasonable ask that business users make an effort to gain a basic
    understanding of how a data scientist goes about the machine learning process.
    As projects progress there should be two-way exchanges of information, and regular
    meetings where preliminary findings and results, problems and issues are presented
    and discussed in a non-technical business focused way. This then guides how the
    project is taken forward.


    With this in mind, I’m going to avoid going into the mathematics of various algorithms
    used for machine learning, such as those used to train neural networks or decide
    how the splits in decision trees are assigned. For those of you who are interested
    in the technical details, the most common algorithms used for machine learning
    are all pretty well documented (see appendix B for some recommended books and
    internet sites). Likewise, the implementation of these algorithms are available
    in commercial statistics packages that you can buy, or are freely available via
    open source software (e.g. `R` and `Python` code libraries). Therefore, you don’t
    need to know how to code up specific machine learning algorithms; you just need
    to know how to call the relevant function or procedure in your chosen software
    package.


    ## The machine learning process


    The first thing the data scientist needs to do is to quantify the business problem;
    i.e. to represent what the business is trying to achieve as a simple number or
    score. The sales director of a retail store may start a conversation with a data
    scientist with a statement such as:


    “We want a predictive model to identify our best customers.”


    So, the first question to ask is:


    “What do you mean by best?”


    To which the sales director responds:


    “Those customers that will make the biggest financial contribution to our business.”


    OK, that seems reasonable, but does “financial contribution” relate to gross sales
    or net profit? Are we talking about contribution per store visit, per click, or
    per unit time (week/month/year)? Are we looking at individual or household contribution
    when we talk about “customers”? and the list goes on. A data scientist needs to
    tease out a precise definition of what the business wants, and then express this
    in a way can be represented by the scores generated by the model that they build.


    In this example, it may be that after some discussion with the marketing director
    it is agreed that the model will be designed to predict total gross spend for
    individuals per quarter year. Quarterly gross spend is selected because this definition
    aligns with the organization''s reporting period, and total revenue (sum of spending)
    is the key performance indicator for the sales director.


    Individual rather than household spend is chosen because it is agreed that although
    household spend would theoretically be better, the organization’s customer databases
    are structured at an individual not household level. It would not be possible
    to deploy a model based on household spend within the bounds of the organization’s
    current IT infrastructure. Could the IT be upgraded to provide a household view?
    No, certainly not as part of this project because the business has not allocated
    any budget for IT changes this year.


    Given this information, the data scientist should determine that this is a regression
    type problem to predict the amount each individual customer will spend over a
    three month forecast horizon.


    In parallel to determining how to express the business objective quantitatively,
    a data scientist needs to undertake exploratory analysis to understand the organization’s
    data and IT assets, how they work and how they interact with each other. This
    includes:


    * What databases does the organization have?

    * What is the purpose of each database, and what business processes make use of
    them?

    * What do the databases contain? i.e. what data items and the format of those
    data items. For example, if it’s numeric or textual data.

    * How is each database updated and maintained? Most organizations have a mix of
    “real time” customer databases that are updated as soon as something changes,
    and batch databases which are updated less frequently; i.e. overnight or at month
    end.

    * What decision making systems are already in place? Will the model be implemented
    within an existing system, or will new functionality be required?

    * What data does the organization currently use for decision making purposes?
    Even if this data feeds an antiquated manual process, it is likely that this data
    will be extremely valuable for machine learning purposes.


    In a perfect world, organizations have comprehensive documentation (metadata)
    that provides an inventory of its data assets in terms of the types of data it
    holds, how that data is formatted and where it comes from. However, in practice
    this sort of information is often patchy, incorrect or out of date. A lot of useful
    information is held in the heads of business users, who use it on a regular basis
    as part of their day jobs. There may be a data item called `Customer demographics
    3` which contains letters `A`, `B....G`. What on earth does that mean? It’s not
    documented anywhere, but Claire in operations knows that it matches the income
    grades they use. `A` means an annual income of under $20,000, `B` $20-35,000,
    and so on.

    '
