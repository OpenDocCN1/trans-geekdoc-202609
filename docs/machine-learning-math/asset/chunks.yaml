  trans: '

    就此，我们将结束本章，因为堆叠去噪自动编码器的应用超出了本书的涵盖范围。例如，解决自然语言处理问题是一个更复杂的过程，应该留到你对机器学习应用和技术达到更高级的水平时再进行。目前，只要理解其背后的较为浅显的理论就足够了，这样你就能为未来的实现建立一个大致的概念。话如此，让我们进入下一章讨论半监督学习。


    # 5. 机器人学


    机器人学是一门跨学科领域，结合了工程、科学、物理、计算机科学和电子学等元素，这只是其中几个领域。机器人学涉及机器人的设计、实现、编程和维护。机器人可以是任何旨在执行动作或一系列动作（具有不同程度自主性）的物理系统。机器人学历史悠久，可能从古希腊关于自动人的故事出现以来，就一直存在于人类的心理中——尽管今天的机器人与你学过的那些有所不同。现代技术允许机器人比以前更智能、更栩如生、更友好并且比以往任何时候都更有用。许多人认为人类正走向一场新的工业革命，这场革命将由这些系统在几乎每个经济领域的广泛采用所引领。除了在汽车制造厂和炼油厂中看到的显性工业机器人外，还有为零售、酒店、交通、电信、医疗和食品服务开发的机器人系统。


    机器人学和人工智能经常被归为一谈，但它们是两个完全不同的东西。虽然机器人学的某些方面适合使用人工智能技术，但整个整个领域并不热迷于模拟智能。机器人学还可以分为几个子领域，专门从事机器人原理的某些应用。在工业领域，机器人被用于处理易于委托给机器的任务。其中一些任务需要高精度或重复动作，而这些动作对于人类来说持续执行太困难了。另一些任务是为高吞吐量设计的，如食品包装和贴标签。这些系统在能够执行的行为数量、物理属性以及编程方式上不相同。工业机器人有不同的品种，但最常见的配置之一是“机械臂”型。它们的设计相似，但执行的任务不同。它们还具有不同的自由度，允许它们以不同的方式移动。运动学对于这类机器人非常重要，因为数学方程决定了手臂关节如何移动。


    在市场渗透率和实用性方面，人形机器人的兴趣程度远低于工业机器人。虽然对类人或类人机器人系统的研究仍然保持高水平，但人形机器人的角色更多是一个技术奇闻，而不是一个商业上可行的业务——尽管可以想象，有一天它们将像《杰森一家》中的机器人一样作为家务机器人被买卖。目前已经存在家务辅助机器人，例如
    `Roomba`，它自 2002 年起就可用。`Roomba` 由一家名为 `iRobot` 的机器人公司制造。麻理工学院机器人学教授罗德尼·布鲁克斯（Rodney
    Brooks）于 1990 年与同学共同创立了该公司。从那时，布鲁克斯于 2009 年又创立了另一名为 `Rethink Robotics` 的公司，最著名的是它创造的
    `Sawyer` 和 `Baxter` 协作机器人。`Baxter` 从根本上是一个具有工业能力的工业机器人，但带有一些想象力。与大多数类似于机械臂的工业机器人不同，`Baxter`
    有两个主肢和一个动画液晶脸。它被设计用于执行装配线上的平凡任务。


    `Baxter` 是工业机器人的一种人道主义演绎。`Baxter` 不是快速机械地执行任务，而是利用传感器来“感知”周围环境。LCD 屏幕会根据机器人的状态显示脸部。它还可以响应环境的变化，例如在掉落工具或零件且无法找回时停止运行。该机器人最引人注目的方面之一是，工人可以在设施内对其进行编程。其他工业机器人需要工程师通过控制系统进行配置，而
    `Baxter` 可以通过“手动”编程。一个没有技能的工人可以移动机器人的手来执行特定任务，而计算机将尽力复制这些动作。这使得 `Baxter` 生产线上的每一个人都能使用，而不仅仅是受过教育的技术人员。`Baxter`
    被誉为比传统的工业系统更安全，因为后者不会关注其直接编程范围之外的其他因素。尽管如此，该公司由于销量低迷，已于 2018 年 10 月破产。许多老牌制造制造公司认为这些系统是实验性的，而且该技术可能尚未到位。`Sawyer`
    和 `Baxter` 机器人在今天仍被用于研究。一些大学用它们来教授机器人课程的学生。最近，研究人员在 `Baxter` 和人类操作员之间连接了电极，以直接传输脑信号。在未来的某个时刻，人与机器人之间的交互可能变得像仅仅思考那样直观。


    大多数工业机器人不需要感知事物或特别聪明。它们执行一组任务并通常被单独留在一旁。相比之下，人形机器人的研究侧重于机器人感知周围世界并与其交互的能力。移动机器人需要一些动力系统，例如一系列执行器或电动机。另一个选择是使用液压系统或气动系统。所有机器人都需要能量源，电池或通过墙壁插座直接连接电流。为了能够看见，机器人可以配备摄像头、`LIDAR`
    和各种传感器。计算机视觉与摄像头结合，传感器将速度、位置、平衡等环境数据直接发送到机器人的控制系统。如果机器学习只是统计学和编程的结合，那么机器人就是许多其他事物的结合。在这两种情况下，哪种方法都没有像《星球大战》中的机器人
    `3-CPO` 那样的通用智能。如果是这样的话，机器人领域的尖端水平如何？机器人研究被分为许多关注领域，一些人专注于传感器、机器人灵活性、人机交互、自主运动等。

    '
