    当你决定使用 `KNN` 算法时，会遇到的最大问题之一就是计算信息的成本会非常高，尤其是当你试图将其与现有某些算法进行比较时。这是因为这类算法旨在在发送你所需的预测结果之前，查看你拥有的每一个数据点，一个都不放过。这有时可以提供更准确的预测和信息，但对某些人来说，计算成本可能太高。


    # 人工智能与机器学习的三种类型


    人工智能有时根据人工智能的特征（间接地根据人工智能软件的意图）被分为几类。这种处理人工智能的方法允许计算机科学家创建具有特定能力模式的 AI 程序，同时也让非科学领域的人理解特定类型的人工智能运作。在这种常见的分类中，人工智能的三种主要类型列举如下：


    *   分析型人工智能

    *   拟人化人工智能

    *   受人类启发的人工智能


    其中第一类型被称为分析型人工智能，它包含了人工智能的认知能力（与任务驱动型 AI 相对）。分析型人工智能的研究涉及研究人工智能机器如何创建世界的认知表征，并利用这些基本表征进行学习。


    另一种类型智能是所谓的拟人化人工智能，它包含了认知之外的智能类型。这包括社交智能和情感智能，意味着那些基于相对于直接接收信息并以各种方式处理信息之外能力的智能行动方面。人类能够对他人表现出同情并产生共情，这些都是情感智能的表现。在人工智能背景下，拟人化人工智能的一个潜在应用可能包括一个能够识别何时需要表现同情心的计算机程序或机器人。例如，一个程序可能希望某人生日快乐，对家庭成员的去世或其他悲剧表示哀悼，或者它可能会给出其他信号（如机器人面部表情的变化），代表
    AI 意识到重大事件已经发生，并且需要或预期进行某种形式的展示。


    社交智能涉及人类利用自我意识和群体意识在社交环境中进行有效互动。在这种情况下，自我意识并不意味着某些人与人工智能的隐性危险所联系起来的那种意识（如自我觉醒），而是指的是对自我的理解，包括了解自身的某些方面可能是独有的或与他人不同的。人工智能背景下的社交智能可能包括机器识别群体动态的能力，以及在社交场合中与人类成功互动的能力。


    拟人化人工智能能力的进步在商业、金融和医学领域具有明确的影响。已经尝试过的一个潜在应用是人工智能程序与人类进行对话，或者为人类创建与他人互动时遵循的脚本。一些网站已经有了与访问网站的人互动的
    AI，而在未来，机器人将使用这种 AI，能够与人类成功互动，而不会显得“机械化”。


    机器人技术的进步也是拟人化 AI 以及另一种相关的人工智能——所谓的受人类启发的人工智能的明确用途。受人类启发的人工智能与拟人化人工智能相似，但侧重于认知智能和情感智能。受人类启发的人工智能程序或机器人能够处理信息、学习并做出相应反应，但这种类型无法理解人际关系。


    ## 人工智能会像人类智能吗？


    对拟人化人工智能的讨论自然地引出了预测性问题：未来的人工智能会像人类智能，还是仅仅具有“人性”。如果宇宙被构想为本质上是良好的创造（或仅仅是存在物），并且人类也被被认为是善良的，那么没有理由相信人工智能对人类构成了本质性的危险。


    但如果宇宙被视为某种模棱两可的东西，一个既不好也不坏的创造，好事和坏事相互作用导致其中一方受损，那么人工智能就变成了某种危险的东西。如果我们真的生活在一个“弱肉强食”的世界，那么创造比我们更聪明的事物的危险是显而易见的。如果人类虐待他们管理的生物，那么我们怎么能说自己不会被机器虐待呢？


    这类问题的作用是为人工智能的辩论注入了一种经常被忽略的哲学倾向。尽管人工智能的问题似乎是人类是否足够信任机器，并赋予它们比我们更大的力量，但它实际上是一个关于人性本身的问题。AI
    恐惧背后的隐含假设是人工智能最终变得像人类，而这种结果是令人恐惧的。


    虚构作品中的人工智能将在书中后面进行更详细的探讨，但在这里带提到它们是重要的。在《终结者》等电影中，人工智能机器人（以及引导它们的人智能程序）被认为是以人类的方式思考的。换句话说，人类对环境或宇宙本身是有危险的因此应该被消除的观点是一种人类式的逻辑。这种逻辑认为：“这个东西是坏的，我们应该除掉它。”


    '
