    # 9. What Is Supervised Machine Learning


    This guidebook has spent a bit of time going through some of the building blocks
    and other basics of machine learning and why it is such a great thing to learn
    how to work with. Now that we know a bit about that, it is time to work with some
    of the meat and potatoes that come with supervised machine learning, and how we
    are able to use this to get the results that we want out of some of these supervised
    learning algorithms.


    We are going to start out our look at learning algorithms with the ideas behind
    supervised learning. This kind of learning is going to happen when you pick out
    one of the learning algorithms that have the ability to learn what the right response
    is to any input of data that the user gives to the program or the computer. The
    neat thing here is that supervised learning is able to do this in a few different
    ways. It can choose to look at some targeted responses and examples that are given
    to it and then learns based on those examples, or you can choose to include some
    labels in strings or other values to ensure that the program can, over some time,
    learn the best way to behave.


    Supervised machine learning can be a simple process to look at, but let’s take
    a look at an example that you can really bring this home. Think back to an elementary
    classroom with a bunch of students and the teacher. The teacher decides that it
    is time to learn a new topic and to help their students, the teacher will show
    a bunch of examples about the situation.


    From this, the students are going to be able to learn how to memorize the examples
    that they are given because they know that these are going to give them the general
    rules about this specific topic. Then, at any time when the students see these
    kinds of examples or even something that is pretty similar, then they know how
    to respond. And if there is an example that isn’t the same or similar to what
    they learned about, then they know how to respond to those as well with this method.


    There are quite a few learning algorithms that you are able to use when it comes
    to supervised machine learning. We are going to focus on the four most common
    types that you are most likely to use when you want to start with supervised machine
    learning including:


    1. Random forests

    2. Decision trees

    3. KNN

    4. Regression algorithms


    ## The Decision Trees


    We now know a bit about how supervised machine learning is going to work. It is
    time to look at some specific examples of how these learning algorithms are going
    to work. And the first one we will look at is known as a decision tree learning
    algorithm.


    With this one, you will find a lot of efficiencies when it comes to data, especially
    if you are taking a look at a few different options and you want to figure out
    which method is going to be the right decision for your business or on your project.
    When there are a few options presented with the decision tree, you get the benefit
    of seeing the possibilities and the outcomes that each one is going to produce
    for you. This is often one of the most efficient and accurate ways to make sure
    that the decisions fit your needs.


    There are different times when you would want to work with a decision tree. You
    may find working with it for a continuous random variable or for some of the other
    categorical variables that are available. However, you will usually use this kind
    of learning algorithm in order to do classification problems.


    To help you make a good decision tree, you need to be able to split up whole domain
    sets so that you get two sets at least, often three or more, of similar data.
    These will then be sorted out, using their independent variables, because it is
    going to help you to distinguish out the different sets that you have in front
    of you.


    This brings up the question of how you will be able to make all of this work.
    Let’s say that we have a group of people, 60 of them. Each person in that group
    will have three independent variables that will include their gender, height,
    and class. When you take a look at this ground, you know from the beginning that
    30 of these students like to play soccer when they have some free time. You can
    work with the decision tree in order to figure out which people in that group
    like to play soccer and which don’t.


    To help you with this one, you can take the learning algorithm for a decision
    tree and look at that group of people before dividing them into some groups. You
    would need to use the variables of height, class, and gender to help with this.
    The hope with this is that when the whole thing is done, you can end up with a
    homogenous set of people.


    Of course, there are going to be a few others of the learning algorithms that
    you are able to use in order to do this, and they may work well with the decision
    tree to help you split up some of the data that you are working with. This is
    going to give you a minimum of two kinds of subsets that will produce outcomes
    that are pretty homogenous. Remember that it is possible to have more, but since
    we just want to know whether the group is going to be soccer players or not, then
    we just want to work with two groups.


    Decision trees are going to be a good option for programmers to choose because
    they make it really easy to split up all of your data, and then you can make some
    good decisions based from what shows in that data. It is a good way to help you
    make some great decisions for your business because you will be able to get all
    of your information out in front of you to make decisions, rather than just having
    to guess.


    ## Random Forests


    The next type of learning algorithm that you are able to work with is the random
    forest. There are a lot of times when the decision tree is going to work out well
    for you, but there are times when you may want to make this a bit different, and
    the random forest is going to be the right option for you.


    One time, when you would want to work with a random forest, is when you would
    like to work with some task that can take your data and explore it, like dealing
    with any of the values in the set of data that is missing or if you would like
    to be able to handle any of the outliers to that data set.

