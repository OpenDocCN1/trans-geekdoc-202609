    # Machine Learning Math:


    All You Need to Know Immediately About Math If You Want Spark In Deep Learning,
    Artificial Intelligent and Machine Learning.


    ## 1. Table of Contents


    1. Introduction

    2. Induction and Deduction

    3. Decision Trees

    4. Types of Artificial Intelligence and Machine Learning

    5. Stacked Denoising Autoencoders

    6. Robotics

    7. Reinforcement Learning

    8. Linear Algebra

    9. How Companies Use Big Data to Increase Sales

    10. What Is Supervised Machine Learning

    11. How To Build A Predictive Model

    12. Data Preprocessing With Machine Learning

    13. Machine Learning and Robotics

    14. How AI Is Revolutionizing Industry

    15. Conclusion


    # Introduction


    Machine learning is one such discipline that focuses on how to improve the performance
    of systems through computation, experience, and a little more experience. In computer
    systems, an experience usually exists in the form of data. Therefore, the main
    content of the machine learning algorithm is an algorithm for generating a model
    from data on computer. With the learning algorithm, we provide empirical data
    to it, and it can generate models based on that data; in the face of a new situation,
    the model will give us corresponding judgments. If computer science is the study
    of programs, machine learning is the study of algorithms.


    ## Dataset


    To do machine learning, you need data. Suppose we collect a collection of data
    on watermelons, such as (green in color; curled at the base; dull tapping), (dark
    in color; slightly curled at the base; dull tapping), (pale in color; stiff at
    the base; crisp tapping). Each pair of parentheses contains a record.


    This collection of records is called a `dataset`, where each record is a description
    of an event or object called an `instance` or `sample`. Something that reflects
    the behavior or nature of an event or object in some way such as color, root,
    and tap are called `attribute` or `feature`. Values on attributes such as green
    and black are called `attribute values`. The spaces where attributes are stretched
    are called `attribute space`, `sample space`, or `input space`. Since each point
    in space corresponds to a coordinate vector, we also refer to it as a `feature
    vector`.


    ## Hypothesis


    The process of learning a model from data is called learning or training and is
    accomplished by performing a learning algorithm. The data used in the training
    process is called `training data`, where each sample is called a `training sample`,
    and the set of training samples is called the `training set`. The learning model
    corresponds to an underlying law of data and is therefore called a `hypothesis`;
    the underlying law itself is called a "truth" or "ground-truth", and the learning
    process is designed to find or approximate the truth. The model is sometimes referred
    to as a `learner`, an instantiation of a learning algorithm on a given data and
    parameter space.


    If you want to learn a model that can help you decide if it is a good result,
    the sample data are not enough. To establish such a "prediction" model, we need
    to obtain the "result" information of the training sample, such as (color green;
    curling; ringing).


    ## Classification


    If we want to predict discrete values, such as "good melon" and "bad melon", this
    type of learning task is called "classification". If you want to predict a continuous
    value, such as watermelon maturity 0.95 or 0.37, this type of learning task is
    called `regression`. For a "binary classification" task involving only two classes,
    one is usually called a "positive class" and the other a "negative class"; when
    multiple classes are involved, it is called a "multi-class classification" task.


    ## Testing


    After learning the model, the process of using it to make predictions is called
    `testing`, and the predicted samples are called `sample testing`. For example,
    after learning, the test case can get its prediction mark.


    We can also "cluster" watermelons, which will be divided into several groups,
    each group called a "cluster"; these automatically formed clusters may correspond
    to some of the underlying concepts, such as "light-colored", "dark-colored", or
    even "local". This learning process can help us understand the inherent law of
    data and establish the basis for further analysis of data. It should be noted
    that the concepts of "light-colored melon" and "native melon" are unknown to us
    in cluster learning, and the training samples used in the learning process usually
    do not possess the labeled information.


    As said before, after a careful understanding of all the resources available in
    detail, you can interpret whether a model uses supervised learning or unsupervised
    learning by a little brainstorming. Classification and regression are the representatives
    of the former, while clustering is the representatives of the latter.


    Note that the goal of machine learning is to make the learned model work well
    with "new samples" and not just training samples; even for unsupervised learning
    tasks such as clustering, we also hope that the cluster partition can be applied
    to the samples, not in the training set. The reason why training samples can work
    well in the whole sample space is that it has generalizability. Generalizability
    is defined as the ability to use the mastered model in new samples. The beauty
    of machine learning is, even though training set being a small sample, it can
    reflect its characteristics quite well in the sample space. Thus, generalizability
    is an important concept that leads machine learning to a new trend with its simplicity
    in complexness. It is usually assumed that all samples in the sample space are
    subject to an unknown "distribution" `D`, and each sample we obtain is independently
    sampled from that distribution, i. e. independent and identically distributed
    (IID). In general, the more training samples we have, the more information we
    get about.


    # 1. Induction and Deduction


    Induction and deduction are two basic means of scientific reasoning. The "generalization"
    process from the special to the general, that is, from the concrete facts to the
    general law, and the latter is the "specialization" process from the general to
    the special, that is, to deduce the concrete situation from the basic principles.
    For example, in a mathematical axiom system, it is deductive to derive a theorem
    corresponding to it based on a set of axioms and inference rules, while "learning
    from examples" is an inductive process; hence it is also called `inductive learning`.


    Inductive learning can be divided into a narrow sense and a broad sense, which
    is roughly equivalent to learning from a sample, while a narrow sense requires
    learning concepts from training data, which is also called `concept learning`
    or "concept formation". It is very difficult to learn the concept with good generalization
    performance and clear semantic meaning. However, an understanding of concept learning
    helps to understand some of the basic ideas of machine learning. The most basic
    concept learning is Boolean concept learning, that is, learning the target concepts
    such as "yes" and "no", which can be expressed as 0/1 Boolean values.


    Learning is known for hypothesis amidst all discover and model analysis that goes
    on the background. The goal of the search is to find the fit hypothesis, that
    is, the correct one. Once the representation of a hypothesis is established, the
    size of the hypothetical space and its size are determined.


    There are many strategies for searching this assumption space such as top-down,
    general to special, or bottom-up. During the search process, you can continuously
    delete the hypothesis inconsistent with the positive example and/or the hypothesis
    consistent with the negative example. Eventually, we will get the same assumption
    as the training set that all the training samples are correctly judged, and this
    is what we learn.


    ## Inductive Preference

