- raw: "First, we need to define a robot. They are machines, often programmable by\
    \ a computer, that are able to carry out a series of complex actions without intervention.\
    \ A robot can have its controls systems embedded or be controlled by an external\
    \ device. In popular literature and film, many robots are designed to look like\
    \ people, but in fact, they are usually designed to perform a task and that requirement\
    \ determines how they appear. \n\nRobots have been with us for almost as long\
    \ as computers. George Devol invented the first digitally operated and programmable\
    \ one in 1954, called Unimate. In 1961, General Motors bought it to use for lifting\
    \ hot metal die castings. And like computers, robots have changed our society.\
    \ Their strength, agility, and ability to continue to perfectly execute the same\
    \ repetitive tasks have proved an enormous benefit. And while they did cause some\
    \ serious disruption to the manufacturing industries, putting many people out\
    \ of work, their ascension in our societies has provided far more employment opportunities\
    \ than they have taken. \n\nRobots in current use can be broken down into several\
    \ categories: \n\n## Industrial Robots/Service Robots \n\nThese robots are probably\
    \ familiar. You have likely seen them on the television or streaming video of\
    \ automated factories. They usually consist of an “arm” with one or more joints,\
    \ which ends with a gripper or manipulating device. They first took hold in automobile\
    \ factories. They are fixed in one location and are unable to move about. Industrial\
    \ robots will be found in manufacturing and industrial locations. Service robots\
    \ are basically the same in design as industrial robots but are found outside\
    \ of manufacturing concerns. \n\n## Educational Robots \n\nThese are robots used\
    \ as teacher aids or for educational purposes on their own. As early as the 1980s,\
    \ robots were introduced in classrooms with the turtles, which were used in classrooms\
    \ where students could train them using the Lego programming language. There are\
    \ also robot kits available for purchase like the Lego Mindstorm. \n\n## Modular\
    \ Robots \n\nModular robots are consisted of several independent units that work\
    \ together. They can be identical or have one or more variation in design. Modular\
    \ robots are able to attach together to form shapes that allow them to perform\
    \ tasks. The programming of modular robotic systems is of course, more complex\
    \ than a single robot, but ongoing research in many universities and corporate\
    \ settings is proving that this design approach is superior to single large robots\
    \ for many types of applications. When combined with Swarm Intelligence (see below),\
    \ modular robots are proving quite adept at creative problem-solving. \n\n## Collaborative\
    \ Robots \n\nCollaborative robots are designed to work with human beings. They\
    \ are mostly industrial robots that include safety features to ensure they do\
    \ not harm anyone as they go about their assigned tasks. An excellent example\
    \ of this kind of collaborative robot is Baxter. Introduced in 2012, Baxter is\
    \ an industrial robot designed to be programmed to accomplish simple tasks but\
    \ is able to sense when it comes into contact with a human being and stops moving.\
    \ \n\nOf course, all the examples above do not require any artificial intelligence.\
    \ When robots are coupled with machine learning, researchers use the term “Robotic\
    \ Learning”. This field has a contemporary impact in at least four important areas:\
    \ \n\nVision \n\nMachine Learning has allowed robots to visually sense their environment\
    \ and to make sense of what they are seeing. New items can be understood and classified\
    \ without the need to program into the robot ahead of time what it is looking\
    \ at. \n\nGrasping \n\nCoupled with vision, Machine Learning allows robots to\
    \ manipulate items in their environment that they have never seen before. In the\
    \ past, in an industrial factory, each time a robot was expected to interact with\
    \ a different-shaped object, it would have to be programmed to know how to manipulate\
    \ this new object before it could be put to work. With Machine Learning, the robot\
    \ comes equipped with the ability to navigate new item shapes and sizes automatically.\
    \ \n\nMotion Control \n\nWith the aid of Machine Learning, robots are able to\
    \ move about their environments and avoid obstacles in order to continue their\
    \ assigned tasks. \n\nData \n\nRobots are now able to understand patterns in data,\
    \ both physical and logistical, and act accordingly on those patterns. \n\n##\
    \ Example of Industrial Robots and Machine Learning  \n\nOne example of the benefit\
    \ of applying Machine Learning to robots is of an industrial robot which receives\
    \ boxes of frozen food along a conveyor. Because it is frozen, these boxes often\
    \ have frost, sometimes quite a lot of frost. This actually changes the shape\
    \ of the box randomly. Thus, a traditionally-trained robot with very little tolerance\
    \ for these shape changes would fail to grasp the boxes correctly. With Machine\
    \ Learning algorithms, the robot is now able to adapt to different shapes, random\
    \ as they are and in real time, and successfully grasp the boxes. \n\nAnother\
    \ industrial example includes a factory with over 90,000 different parts. It would\
    \ not be possible to teach a robot how to manipulate these many items. With Machine\
    \ Learning, the robot is able to be fed images of new parts it will be dealing\
    \ with and it can determine its own method to manipulate them. \n\nIn 2019, there\
    \ will be an estimated million robots in service on the planet. That’s up a million\
    \ from 2015. As more and more robots are combined with Machine Learning algorithms,\
    \ this number is sure to explode. \n\n# 13.How AI Is Revolutionizing Industry\
    \ \n\nArtificial intelligence is arguably the single factor that is most changing\
    \ industry today and is likely to continue to do so in the future. Many thinkML\
    \ of AI in terms of the commercially available products that they may use in their\
    \ daily life. Siri and Alexa, in addition to smart home AI and other IoT devices\
    \ that use AI, have become ubiquitous. They are everywhere. But artificial intelligence\
    \ is changing industry in ways that are invisible to many men and women. These\
    \ are things happening behind the scenes. \n\n## Agriculture \n\nAgriculture is\
    \ an industry that often falls under the radar in developed nations because it\
    \ generally represents such a small percentage of GDP. Even in countries where\
    \ agricultural products are major exports, agriculture is often not being perceived\
    \ as being as significant as computer technology, aviation, heavy industry, or\
    \ other industries that are more conspicuous. But agriculture is important, and\
    \ AI has been changing this industry in dramatic ways. \n\nThree keys ways in\
    \ which AI is changing agriculture include AI use in predictive analytics, crop\
    \ and machinery monitoring, and agricultural robots. Agriculture robots powered\
    \ by AI can actually farm the land in ways similar (if not superior) to human\
    \ workers of the past. AI can also be involved in analyzing farm operation data,\
    \ much as it is able to do in other businesses. This merely requires that AI is\
    \ provided with the data or linked to the machines that generate the data. Finally,\
    \ AI can use drones and other agents (including computer programs) to monitor\
    \ both crops and machinery in ways that would not have been possible before. \n\
    \n## Education \n\nAI applications in education are very numerous. Although education\
    \ is often thought of as an area that perhaps requires a human finesse or emotional\
    \ intelligence, many educators have jumped on the AI bandwagon as they recognize\
    \ how AI can aid them in their educator tasks. Ways that AI is changing education\
    \ include: distance learning, chatbots, school recruitment and outreach, computers\
    \ using AI in the classroom or dorm room, shifting role of educators in schools\
    \ based on AI assuming roles, feedback for both educators and students, artificial\
    \ intelligence tutors for students, AI agents for grading, tailoring of educational\
    \ software to student needs. "
