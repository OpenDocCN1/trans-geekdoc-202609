    utilities. AI of this type tracks user data to make tailored recommendations.


    AI can also be involved in preparing products for release using deep learning.
    For example, AI can be involved in video editing, including syncing audio and
    video, AI can be involved in various aspects of CGI, and AI can be involved in
    image analysis for entertainment purposes. As we have seen, machine learning can
    play a powerful role in language processing and translation, and this can be very
    relevant in the entertainment industry.


    ## Journalism


    Natural language processing capabilities of machines mean that artificial intelligence
    applications in journalism are potentially endless. Beyond functions like translation,
    transcription, and speech segmentation (part of transcription), AI can also be
    involved in generating original content, including full-length articles. Some
    YouTubers have experimented with having their dialogues written by AI, and although
    this is often undertaken as a joke, many times the AI generated content is indistinguishable
    from that written by a human being.


    Much of the AI advancement in journalism involves automation of routine tasks.
    In fact, automation is one of the key points that business can keep in mind when
    imaging how to integrate AI into their business. One way that AI can help to improve
    journalistic function by automation is by collecting data from multiple sources
    in order to create content. AI can do this in seconds, whereas it might take hours
    for a human to do the same thing. AI can also be involved in marketing journalistic
    content after it is created.


    ## Transportation


    It goes without saying that the greatest way that AI is revolutionizing transportation
    is with the invention of the self-driving car. Although self-driving automobiles
    have been in development since the 1970s, it has only been recently that advancements
    in image analysis, machine learning, and semantic segmentation have allowed self-driving
    to be a safe endeavor that human beings can expect to see in the near future.
    Indeed, navigation systems powered by AI are already in place both in automobiles
    and in aviation.


    The tasks that AI has in self-driving involves deep learning. AI in self-driving
    cars needs to be engaged in multiple complex algorithms at the same time, including
    recognizing signs in the environment, recognizing markers on the road, awareness
    of other vehicles and pedestrians, using location and weather data to guide actions,
    responding to input from a human driver, and physically moving the automobile.
    The fact that self-driving cars are being developed by companies like `Tesla`
    and others that can actually do this represents one of the great achievements
    of modern-day machine learning.


    ## Conclusion


    Thanks for making it through to the end, let’s hope it was informative and able
    to provide you with all of the tools you need to achieve your goals whatever they
    may be.


    The next step is to get started with using machine learning to achieve your goals.
    There are so many cool things that you are able to do when you bring machine learning
    into the mix that it is definitely worth your time to give it a try. While conventional
    programming can help you to get a good start and can make a lot of great programs
    along the way, there is nothing that compares to what you can do when you learn
    how to work on machine learning.


    This guidebook took some time to explore the different parts that come with machine
    learning. We discussed what this process was all about along with the building
    blocks that help you to get started and the ways that statistics make it easier
    to work with machine learning. Then we moved on to some of the different learning
    techniques that are found in machine learning, including supervised machine learning,
    unsupervised machine learning, and reinforcement learning. Understanding how to
    work with each of these and getting the right algorithm for your needs is so crucial
    to the success of your program.

