    Decision trees can be a great option for you to work with when it comes to supervised
    machine learning. This is because these decision trees will allow you to take
    the data and split them up. Then, with this data split up and ready to go, you
    can look it over and make some decisions. It is a great way to ensure that you
    are making the best decisions for your business and for yourself, because all
    of the information is going to be in front of you, sorted out and easy to read,
    rather than having to look at all of the conflicting information and make an educated
    guess in the process.


    ## Random forests


    There are a lot of situations where you are able to use the decision tree to make
    some of the decisions and to sort the data that you want. But there are also times
    when it just isn’t going to do the work the right way. If you are looking at your
    data and you know that the decision tree isn’t the right option for you, then
    you may find that the random forest is a bit better to work with.


    These random forests can be popular to use, and if you plan to do a lot of work
    in the field of data science, then you definitely will want to learn more about
    these and how you can use them in your needs. Since these algorithms are well-known
    in the industry and popular, you will find that many people use them to solve
    out various problems that come up. For example, if you would like to work on a
    task that will explore through all the data you have, such as dealing with some
    of the values that may have gone missing, or dealing with any of the information
    outliers that show up, these random forests are going to be there to help you
    get it all done.


    Now, you may find that as you work on machine learning, there will be some times
    when you will use them because they seem to be the perfect option for giving you
    great results, results that other algorithms are just not able to do. Some of
    the different advantages that you are able to get when it comes to these random
    forests will include:


    1. When you decide to create some of your own training sets and to work on these,
    you may find that all of the objects that are inside that set will be generated
    in a random manner. You will be able to replace this if your random tree works
    the right way, and can help you to sort through the information based on your
    needs.

    2. If there are `M` input variable amounts, then `m<M` is going to be specified
    from the beginning, and it will be held as a constant. The reason that this is
    so important because it means that each tree that you have is randomly picked
    from their own variable using `M`.

    3. The goal of each of your random trees will be to find the split that is the
    best for the variable `m`.

    4. As the tree grows, all of these trees are going to keep getting as big as they
    possibly can. Remember that these random trees are not going to prune themselves.

    5. The forest that is created from a random tree can be great because it is much
    better at predicting certain outcomes. It is able to do this for you because it
    will take all prediction from each of the trees that you create and then will
    be able to select the average for regression or the consensus that you get during
    classification.


    You may find that it is great to work with random forests any time that you are
    doing things in data science, and there are going to be quite a few advantages
    to working with a random forest rather than some of the other algorithms, even
    though it isn’t going to be perfect each time. just because the random variable
    can provide you with a lot of the results that you would like, you do have to
    know when it can be useful and when it should be avoided. With that said, there
    are some advantages to its use.


    First, these random forests are good to use because they can work with regression
    and classification problems that you have. Many other algorithms are not able
    to work with both of these. In addition, you may find that random forests are
    a good option to go with if you are handling large amounts of data because you
    can add in hundreds of data points and variables, and the random forest will still
    be able to handle this.


    One thing to consider when you are working with this is that while the random
    forest is able to handle a lot of regression problems, they will have some issues
    when it comes to making predictions. Random forests are not going to be limited
    in this because they are not able to go past any of the ranges that you provide
    to them so there may be times when your accuracy is not going to be as high as
    you would like.


    ## The KNN algorithm


    The third type of supervised machine learning algorithm that you are able to work
    with is known as the `KNN` algorithm. This one is also known as the `k-nearest
    neighbor''s` algorithm. When you decide to use this algorithm, it is going to
    be helpful to take all of your data, the data that you have for `k` most similar
    examples of any instance of data that you are working on. Once you see some success
    with this, the `KNN` algorithm will then be able to go through all of your data
    points and can provide you with a summary of all the results. Many companies and
    programmers are able to use this to help them look through the results and make
    some good predictions.


    Any time that you plan to work with this `KNN` algorithm model, you will be able
    to see it as a form of competitive learning. This is going to work well because
    the different elements will end up competing against one another. This may sound
    like a bad thing, but when the elements start to compete against one another,
    they become better at making predictions that are successful.


    As you can imagine, this one is going to work a bit different than the other algorithms
    that we have talked about in this guidebook so far. There are some programmers
    who don’t like to use it because they think that `KNN` is more of a lazy learning
    process. This is because while it can be effective at providing you with some
    results, it isn’t going to help you out by creating any models until you specifically
    ask it for a brand-new prediction. This can be good sometimes, but it will depend
    on the case. Some people want it to make new predictions automatically, and some
    like that they will have the most relevant information for the task at hand.


    There are different benefits that can come when you decide to work with this `KNN`
    algorithm. When you choose to go with this algorithm, you can cut through a lot
    of the noise that is found inside your specific set of data. This is because the
    `KNN` algorithm is going to rely more on a competitive method to sort through
    all of the data that you see. This algorithm is going to be great when you want
    to handle a lot of data, so it is definitely one that you should consider if your
    data is pretty large. At the same time, it works well if you need some help sorting
    through all of this data.


    Now, you could have someone go through and look at all this information, providing
    you with some estimations and predictions for you as well. But this is not that
    efficient with really large forms of data. Sure, it can be done, but it can take
    a long time, often so long that new data is coming in and the predictions you
    have will be too old to work with. It can also lead to more mistakes as someone
    could miss information or misread it as well. The `KNN` algorithm can solve this
    problem by taking out the human error and sorting through any amount of data that
    you would like.

