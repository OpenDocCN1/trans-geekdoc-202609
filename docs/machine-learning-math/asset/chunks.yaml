    On this note, we are going to end this chapter, because the application of stacked
    denoising autoencoders is beyond the scope of this book. Solving natural language
    processing problems, for instance, is a more complex process that should be left
    for when you reach a more advanced level of knowledge of machine learning applications
    and techniques. For now it should be enough to understand the somewhat light theory
    behind it so that you can form a rough idea for future implementations. With that
    being said, let’s move on to the next chapter and discuss semi-supervised learning.


    # 5. Robotics


    Robotics is an interdisciplinary field that combines elements of engineering,
    science, physics, computer science, and electronics, just to name a few. Robotics
    concerns the design, implementation, programming, and maintenance of robots. A
    robot can be any physical system that is designed to perform an action or series
    of actions with varying degrees of autonomy. Robotics has a long history and has
    probably been in the human psyche ever since the first Greek stories of automatons
    were being told – though today’s robots are a little different from the ones you
    learned about in Modern technology allows robots to be smarter, more lifelike,
    friendlier, and overall more useful than ever before. Many believe that humanity
    is headed for a new industrial revolution that will be spearheaded by the mass
    adoption of these systems in virtually every economic sector. Besides the obvious
    sort of industrial robots that you find in car manufacturing plants and refineries,
    there are also robotic systems being developed for retail, hospitality, transportation,
    telecommunication, medicine, and food services.


    Robotics and artificial intelligence often get lumped together, but they are both
    distinct things. While some aspects of robotics lend themselves to use artificial
    intelligence techniques, the field as a whole is not preoccupied with simulating
    intelligence. Robotics can also be divided into several subfields that specialize
    in certain applications of robotic principles. On the industrial side of things,
    robots are used to handle tasks that are easy to delegate to a machine. Some of
    these tasks require high precision or repetitive motions that would be too difficult
    for a human to sustain for long periods of time. Others are designed for high
    throughputs like food packaging and labeling. These systems vary in how many behaviors
    they are capable of performing, their physical properties, and how they are programmed.
    Industrial robots come in different varieties, but one of the most common configurations
    is the “arm” type. These have similar designs but perform different tasks. They
    also have different degrees of freedom that allow them to move differently. Kinematics
    is very important for these types of robots because the mathematical equations
    determine how the joints on the arms move.


    Interest in humanoid robots severely lacks with industrial robots regarding market
    penetration and usefulness. While research in androids or human-like robotic systems
    remains high, the role of the humanoid robot remains a techno-curiosity more than
    a commercially viable business – though one day it is conceivable that they will
    be bought and sold as housekeepers like the robots in The Jetsons. There already
    exist housekeeping aid robots like the `Roomba` that has been available since
    2002. The `Roomba` is manufactured by a robotics company fittingly named `iRobot`.
    Rodney Brooks, a professor in robotics at MIT, co-founded the company in 1990
    with fellow classmates. Since then, Brooks has gone on to start another company
    called `Rethink Robotics` in 2009, most known for its creation of the `Sawyer`
    and `Baxter` collaborative robots. `Baxter` is fundamentally an industrial robot
    with industrial capabilities but with a bit of imagination. Unlike most industrial
    robots that usually resemble a mechanical arm, `Baxter` has two main limbs and
    an animated LCD face. It was designed to perform mundane tasks on an assembly
    line.


    `Baxter` is a humanitarian take on the industrial robot. Instead of performing
    tasks rapidly and mechanically, `Baxter` uses sensors to become “aware” of its
    surroundings. The LCD screen will display a face according to the robot’s state.
    It can also respond to changes in its environment like ceasing operation if it
    drops a tool or piece and is unable to recover it. One of the most intriguing
    facets of the robot is that workers can programme it in the facility. Where other
    industrial robots require an engineer to be configured through control systems,
    `Baxter` is programmable by “hand”. An unskilled worker can move the robot’s hands
    to perform a certain task, and the computer will try its best to reproduce the
    movements. This makes `Baxter` accessible to everyone on the production line,
    not just educated technicians. `Baxter` has been lauded as being safer than traditional
    industrial systems that do not pay attention to other factors outside of their
    immediate programming. Despite this, the company went out of business in October
    2018 due to low sales. Many old guard manufacturing companies saw these systems
    as experimental and the technology probably not there yet. The robots `Sawyer`
    and `Baxter` are still used in research today. Some universities use them to teach
    students in robotics courses. More recently, researchers hooked up electrodes
    between `Baxter` and a human operator to directly transmit brain signals. Sometime
    in the future, the interaction between human and robot may resemble something
    that is as intuitive as simply thinking.


    Most industrial robots do not require to sense things or be particularly smart.
    They perform a set task and are usually left alone. In contrast, humanoid robot
    research focuses on the ability of the robot to perceive the world around them
    and to interact with it. To be able to move a robot requires some propulsion system,
    like a series of actuators or electric motors. Another option is to use hydraulics
    or pneumatic systems. All robots need an energy source, either a battery or a
    direct connection to the current through a wall socket. To be able to see, a robot
    can be equipped with cameras, `LIDAR`, and various sensors. Computer vision is
    coupled with the cameras, and the sensors directly send environmental data like
    speed, position, balance, and so forth to the robot’s control system. If machine
    learning is just a combination of statistics and programming, robots are a combination
    of a great many other things. In both cases, neither approach a general intelligence
    like the Star Wars droid `3-CPO`. If that is the case, what is the current state
    of the art in robotics? Robotics research is split into many areas of focus, with
    some people working on sensors, robot dexterity, human-robot interaction, autonomous
    motion, and so on.

