    \ missing, the easiest approach out be to find a way to remove the record that\
    \ is missing a value. However, this record could also have some crucial information\
    \ in it that we need to focus on, so you will sometimes want to keep it there. \
    \ \n\nAnother option that you can use to help deal with some of these missing\
    \ values is to add in some kind of value or character that will be able to replace\
    \ the value that is missing. Often we find that the best choice to replace that\
    \ value with is either the mean or the median of all the other values that are\
    \ found in that column. To help you handle the values that are missing when they\
    \ come up, you just need to use the imputer class that is found in the library\
    \ of sklearn.preprocceing. the script that you will need to make sure this happens\
    \ is below \n\nfrom sklearn.preprocessing import Imputer \n\nimputer = Imputer(missing\\\
    _values=”Nan”, strategy=”mean”, axis =0) \n\nimputer = imputer.fit(features\\\
    [:,1:2\\]) \n\nfeatures\\[:,1:2\\] = imputer.transform(features\\[:,1:2\\]) \n\
    \nWith the script that we wrote above, the first line is in charge of importing\
    \ the Imputer class from the right library. We then went on to create the object\
    \ of the Imputer class. This is going to take on three parameters including axis,\
    \ strategy, and missing\\_value. In terms of the missing\\_value parameter, we\
    \ are specifying that this is the value that we want to be replaced. In our data\
    \ set, the missing value is being shown by “nan”. The strategy parameter is going\
    \ to specify the type of strategy that we want to use in order to fill in this\
    \ missing value. You can also choose from most-frequent, median, and mean. And\
    \ then the axis parameter is going to denote which axis we want to impute here\
    \ \n\nHandling any of our categorical data \n\nRight now we know that the algorithms\
    \ that we may use with machine learning are going to be based on concepts that\
    \ are mathematical in many cases, and to work with these mathematics, we need\
    \ to be able to work with numbers. Because of this kind of issue, it is going\
    \ to become easier and more convenient for us to work in values that are categorical\
    \ and then work on moving them to be numerical. When we look at the example that\
    \ we are doing here, we see that there are two values that are seen as categorical\
    \ and those are the gender and diabetic options. How are we able to turn Male\
    \ and Female, and Yes and No into numerical values to make things easier? \n\n\
    The good news is that with the sklearn.preprocessing library, there is the LabelEncorder\
    \ class, the one that is going to take your categorical column and then give you\
    \ the right numerical output to make sense out of it. The script that you can\
    \ use for this one includes: \n\nfrom sklearn.preprocessing import LabelEncoder\
    \ \n\nlabelencorder\\_features = LabelEncoder)\\_ \n\nfeatures\\[:,2\\] =labelencoder\\\
    _features.fit\\_transform(features\\[:,2\\]) \n\nJust like what we did with the\
    \ Imputer class, the LabelEncorder class is going to have a fit\\_transform method,\
    \ which is just a combination of the transform and the fit methods. The class\
    \ is going to be able to take the categorical column that you have as the input\
    \ and then will return the right numeric values to help you out.  \n\nIn addition,\
    \ you can always take the labels vector and then convert it to a set of numeric\
    \ values as follows: \n\nlabels = labelencoder\\_features.fit\\_transform(labels)\
    \ \n\nYour training sets vs. your testing sets \n\nThe next thing that we need\
    \ to take a look at is the training sets and the test sets. These are going to\
    \ be two very important things when it comes to the work that you are doing in\
    \ machine learning, Being able to separate out the values that you have in a smart\
    \ manner for this to work is going to make the biggest difference overall.  \n\
    \nThis splitting up of the test and the training set is going to be done to make\
    \ sure that any algorithm that you use for machine learning doesn’t end up overfitting\
    \ and trying too hard, messing up the data that you get. When we talk about the\
    \ idea of overfitting, we are looking at the tendency that machine learning is\
    \ going to do well with the results it gives on the training data, but then it\
    \ ends up giving poor results when you get to the test data.  \n\nA good model\
    \ that you can rely on when you work in machine learning is one that is able to\
    \ give you some good results with both of these, with the training data and the\
    \ test data. With this, we are able to say that the model we picked as correctly\
    \ learned all of the underlying assumptions from our set of data, and then that\
    \ we are able to accurately use it to make the decisions that we need out of any\
    \ new set of data that we decide to use.  \n\nTo get a better idea of how this\
    \ is going to work, Let’s look at the script that we use below. This script is\
    \ going to help us divide up the data into the 75 percent train size, and the\
    \ rest is going to be the test size.  \n\nfrom sklearn.model\\_selection import\
    \ train\\_test\\_split \n\ntrain\\_features, test\\_features, train\\_labels,\
    \ test\\_labels = train\\_test\\_split (features, labels, test\\_size = 0.25,\
    \ random\\_state = 0) \n\nWhen you execute this script above, you are going to\
    \ see the train\\_features variable is going to contain the matrix of 9 features\
    \ (because this is the 75 percent of 12) while the train\\_labels is going to\
    \ contain the labels that correspond to this. However, with the test-features,\
    \ you are going to have the remaining three features and the test\\_label will\
    \ have the corresponding labels.  \n\nScaling the data we have \n\nNow we are\
    \ to the final thing that we need to look at when we get to this part of the process.\
    \ We need to look at the steps that are needed in order to scale any of the data\
    \ we have when we place it into our machine learning algorithm. It is important\
    \ to know all about scaling because there are going to be some sets of data that\
    \ will show up a big difference between the values that come with it.  \n\nFor\
    \ example, if we decided to add in a new column for the number of red blood cells\
    \ of patients in this, then it is likely that the numbers are going to be hundreds\
    \ of thousands (unless the patient is really sick), while it is not likely the\
    \ age column would even get to 100. Many of the models that you can use with machine\
    \ learning are going to use what is known as the Euclidean distance to help us\
    \ find the distance that occurs in the points of data you are looking at.  \n\n\
    The good news is that the sklearn.preprocessing library is going to contain the\
    \ class known as StandardScaler that you can use in order to implement the standardization\
    \ features. Like with other preprocessing classes, it will also contain the fit-transform\
    \ that we talked about before and it will take a data set that you provide it\
    \ as the input, and then output a scaled data set. The following script will make\
    \ this happen for you.  \n\nfrom sklearn.preprocessing import StandardScaler \n\
    \nfeature\\_scaler = StandardScaler() \n\ntrain\\_features = feature\\_scaler.fit\\\
    _transform(train\\_features) \n\ntest\\_features = feature\\_scaler.transform(test\\\
    _features) \n\none thing to note is that there isn’t really a need for you to\
    \ scale labels on any of your classification problems. For regression problems,\
    \ we will take a look at how to scale labels for a regression section.  \n\nAnd\
    \ that is all there is to it. You need to go through some of these steps along\
    \ the way to make sure that you are preprocessing the information, and that it\
    \ is ready to go with the work. Your algorithms are going to be more accurate\
    \ and will work out much better if you are able to add in these preprocessing\
    \ steps to the mix. They will ensure that you are able to get the best results\
    \ because the data is prepared in the manner that it should be.  \n\n# 12.Machine\
    \ Learning and Robotics  "
