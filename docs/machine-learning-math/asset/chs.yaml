  \n# 13. 人工智能如何变革工业\n\n人工智能可能是目前最改变工业的单一因素，并可能在未来继续这样做。许多人将 AI 认为是他们在日常生活中使用的商用产品。除了`Siri`和`Alexa`，智能家居\
  \ AI 和其他使用 AI 的物联网设备也已变得无处不在。但人工智能正在以许多人无法察觉的方式改变工业。\n\n## 农业\n\n农业在发达国家通常是一个被忽视的行业，因为它占\
  \ GDP 的比例通常很小。即使在农产品是主要出口产品的国家，农业通常也不被认为比计算机技术、航空、重工业或其他更显眼的行业重要。但农业是重要的，AI 一直在以戏剧性的改变这一行业。\n\
  \nAI 改变农业的三大关键方式包括预测分析的应用、作物和机械监测以及农业机器人。由 AI 驱动的农业机器人实际上可以与过去人类类似甚至更优的方式耕种土地。AI\
  \ 还可以分析农场运营数据，就像它在其他业务中所做的那样。最后，AI 可以使用无人机和其他代理（包括计算机程序）以以前无法实现的方式监测作物和机械。\n\n##\
  \ 教育\n\nAI 在教育中的应用非常多。尽管教育通常被认为是一个可能需要人类技巧或情感智能的领域，但许多教育者已经加入了 AI 的行列，因为他们意识到 AI\
  \ 如何帮助他们完成教育任务。AI 改变教育的方式包括距离学习、聊天机器人、学校招募和推广、计算机在教室或宿舍中使用 AI、基于 AI 承担角色后教育者身份的变化、对教育者和学生的反馈、学生的\
  \ AI 导师、AI 评分代理以及针对学生需求定制教育软件。\n\n\n\n事实是，由于人工智能可以使用你提供它的任何数据，因此 AI 在教育领域的可能性几乎是无尽的。例如，AI\
  \ 程序可以审查学生数据，并根据比老师更细致的数据理解，对学生需要改进的领域提出建议。AI 甚至可以根据学生在某些领域的表现来建议教学方法的改变。AI 在教育领域的应用确实没有限制。\n\
  \n## 娱乐\n\n机器学习和实验性 API 已经在娱乐业中占有一席之地。与其他业务领域一样，娱乐业利用 AI 的一个大领域是预测分析。在娱乐背景下，预测分析有许多含义，但它包括预测消费者行为以建议某些类型的产品，如电影、数字节目或电视节目。AI\
  \ 还可以利用基于网络或 App 的工具直接向客户营销产品。这种类型的 AI 会跟踪用户数据以提供定制化推荐。\n\nAI 还可以利用深度学习参与产品发布准备。例如，AI\
  \ 可以参与视频剪辑，包括音视频同步；AI 可以参与 CGI（计算机生成图像）的各个方面；AI 还可以用于娱乐目的的图像分析。正如我们所看到的，机器学习在语言处理和翻译方面可以发挥强大的作用，这在娱乐行业中非常相关。\n\
  \n## 新闻业\n\n机器的自然语言处理能力意味着新闻业中的人工智能应用具有无限的可能。除了翻译、转录和语音分段（转录的一部分）等功能外，AI 还可以参与生成原创内容，包括长篇文章。一些\
  \ YouTube 主主尝试过让 AI 编写他们的对话，尽管这通常是作为开玩笑进行的，但很多时候，AI 生成的内容与人类编写的内容是无法区分的。\n\n新闻业的大部分\
  \ AI 进展涉及常规任务的自动化。事实上，自动化是企业在构思如何将 AI 集成到其业务中时可以记住的关键点之一。AI 通过自动化帮助改进新闻功能的一种方式是从多个源头收集数据以创建内容。AI\
  \ 可以在几秒钟内完成这一工作，而人类完成相同工作可能需要几个小时。AI 还可以参与新闻内容创作后对其进行营销。\n\n## 交通\n\n不言而喻，AI 彻底改变交通领域的方式就是自动驾驶汽车的发明。尽管自动驾驶汽车自\
  \ 20 世纪 70 年代以来一直在开发，但直到最近图像分析、机器学习和语义分割的进步，才让自动驾驶成为一项人类有望在不久将来看到的安全尝试。事实上，由 AI\
  \ 驱动的导航系统已经应用于汽车和航空领域。\n\nAI 在自动驾驶中承担的任务涉及深度学习。自动驾驶汽车中的 AI 需要同时处理多个复杂的算法，包括识别环境中的标志、识别道路标记、对其他车辆和行人的感知、使用位置和天气数据引导行动、响应人类驾驶员的输入以及物理移动汽车。像\
  \ `Tesla` 等能够真正实现此点的公司正在开发自动驾驶汽车，这代表了现代机器学习的伟大成就之一。\n\n## 结论\n\n感谢你读到最后，希望这些内容对你有所启发，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\
  \n下一步是开始使用机器学习来达成你的目标。当你将机器学习引入其中时，你可以做很多酷酷的事情，这绝对值得你花时间尝试一下。虽然传统编程可以帮助你有一个良好的开始，并在此过程中编写许多出色的程序，但当你学习如何进行机器学习时，你所能取得的成就是无与比拟的。\n\
  \n本指南花费了一些时间来探索机器学习相关的不同部分。我们讨论了这一过程的本质，以及帮助你入门的基石，以及统计学如何让机器学习变得更容易。然后，我们转向了机器学习中发现的某些学习技术，包括监督学习、无监督学习和强化学习。理解如何处理这些每种技术并根据你的需求获得正确的算法对于程序的成功至关重要。\n"
