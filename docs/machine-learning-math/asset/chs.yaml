- "# 机器学习数学指南\n\n\n\n\n如果你想进入深度学习、人工智能和机器学习，这里是你立即需要的所有数学知识。\n\n\n\n# 引言\n\n机器学习是这样一种学科，它关注如何通过计算、经验以及更多的经验来提高系统的性能。在计算机系统中，经验通常以数据的形式存在。因此，机器学习算法的主要内容是一种从计算机中的数据中生成模型的算法。通过学习算法，我们向其提供经验数据，它可以根据这些数据生成模型；面对新情况时，模型将给我们给出相应的判断。如果说计算机科学是研究程序，那么机器学习就是研究算法。\n\
  \n### 数据集\n\n要进行机器学习，你需要数据。假设我们收集了一组西瓜的数据，例如：（绿色；基部卷曲；敲声沉闷），（深色；基部轻微卷曲；敲声沉闷），（浅色；基部坚硬；清脆）。每对括号包含一条记录。\n\
  \n这组记录被称为`dataset`，其中每条记录是对事件或对象的描述，被称为`instance`或`sample`。以某种方式反映事件或对象的行为或性质的（如颜色、根和敲声）被称为`attribute`或`feature`。绿色和黑色等属性的值被称为`attribute\
  \ values`。属性延伸的空间被称为`attribute space`、`sample space`或输入空间。由于空间中的每个点都对应一个坐标向量，我们也将其称为`feature\
  \ vector`。\n\n## 假设\n\n从数据中学习模型的过程被称为学习或训练，通过执行学习算法完成。训练过程中使用的数据称为`training data`，每个样本称为`training\
  \ sample`，训练样本集称为`training set`。学习模型对应于数据的底层规律，因此被称为`hypothesis`；规律本身被称为“真理”或“地面真值”（ground-truth），学习过程旨在寻找或近似真理。模型有时也被称为`learner`，它是学习算法在给定数据和参数空间上的实例化。\n\
  \n如果你想学习一个可以帮助你判断结果好良的模型，仅有样本数据是不够的。为了建立这样一个“预测”模型，我们需要获取训练样本的“结果”信息，例如（颜色绿色；卷曲；响声）。\n\
  \n## 分类\n\n如果我们想预测离散值，例如“好西瓜”和“坏西瓜”，这种类型的学习任务被称为“分类”。如果你想预测连续值，例如西瓜的成熟度 0.95 或 0.37，这种类型的学习任务被称为`regression`。对于仅涉及两个类的“二分类”任务，一个通常被称为“正类”，另一个被称为“负类”；当涉及多个类时，被称为“多分类”任务。\n\
  \n## 测试\n\n学习模型后，使用它进行预测的过程被称为`testing`，预测的样本被称为`sample testing`。例如，学习之后，测试用例可以获得其预测标记。\n\
  \n我们也可以对西瓜进行“聚类”，它们会被分成几组，每组被称为一个“簇”这些自动形成的簇可能对应某些底层概念，例如“浅色”、“深色”甚至“本地”。这种学习过程可以帮助我们理解数据的内在规律，并为进一步的数据分析建立基础。需要注意的是，在聚类学习中，“浅色西瓜”和“本地西瓜”的概念对是我们未知的，学习过程中使用的训练样本通常不具备标签信息。\n\
  \n如前所述，在详细理解所有可用资源后，你可以通过头脑风暴判断一个模型使用的是监督学习还是无监督学习。分类和回归是前者的代表，而聚类是后者的代表。\n\n注意，机器学习的目标是让学习到的模型在“新样本”上运行良好，而不仅仅是训练样本；即使对于聚类等无监督学习任务，我们也希望簇的划分可以应用于训练集之外的样本。训练样本能够在整个样本空间中良好工作是因为它具有泛化能力（Generalizability）。泛化能力被定义为将所掌握的模型应用于新样本的能力。机器学习的妙之处在于，尽管训练集只是一个小样本，但它可以在样本空间中很好地反映其特征。因此，泛化能力是一个重要概念，它引导机器学习走向在复杂中保持简单的新趋势。通常假设样本空间中的所有样本都遵循一个未知的“分布”`D`，我们获得的每个样本都是从该分布中独立采样的，即独立同分布（IID）。通常，训练样本越多，我们获得的信息就越多。\n\
  \n# 1. 归纳与演绎\n\n\n\n\n任何有效的机器学习算法都必须有其归纳偏好；否则，它将会在假设空间中训练集中“等价”假设的困扰，并无法产生确定的学习结果。可以想象，如果没有偏好，我们的西瓜学习算法在每次进行预测时都会随机选择训练集上的等价假设，从而生成学习模型，这种学习模型有时告诉我们它是好的，有时告诉我们它是坏的，这是不符合逻辑的。\n\
  \n归纳偏好对应于学习算法对哪种模型更好的更好的假设。在实际问题中，这种假设是否真实（即算法的归纳偏好在大多数情况下是否匹配问题本身），直接决定了算法能否获得良好的性能。\n\
  \n由于深度学习处理的模式复杂，如果数据样本较少，很容易发生“过拟合”；这种复杂的模型、如此庞量的数据样本，如果没有强大的计算设备是无法解决的。之所以是准确的，是因为人类已经进入了“大数据时代”；数据存储和计算设备的发展，使得连接主义学习技术再次春发生发。有趣的是，神经网络在\
  \ 20 世纪 80 年代中期流行，这与 Intel X86 微处理器和内存条技术的广泛应用所带来的计算能力提升和数据访问效率提高有关。\n\n这种情况下的深度学习与当时的神经网络非常相似。在过去的二十年里，人类收集、存储、传输和处理数据的能力迅速增长，海量数据积累在人类社会的每一个角落。迫切需要能够有效分析和利用数据的计算机算法。机器学习响应了这一大时代的迫切需求，因此该领域发生巨大增长并获得广泛关注是自然而然的。\n\
  \n由于研究人员自愿将他们宝贵的时间投入学术研究，计算机科学在过去十年中呈指数级地发展。除外，机器学习还帮助研究人员加速了他们的研究进程。现在，机器学习几乎遍布世界的角落，以其无限的应用为人类服务。从人脸识别到自动驾驶汽车，从互联网营销到使用蛋白质合成的生物信息学，许多领域现在都在全力投入人工智能的发展中。人们认为，在未来几年里，机器学习将以一种人们无法想象的方式扩展其认知边界。\n\
  \n生物信息学研究涉及从“生命现象”到“规律发现”的整个过程，这必然包括数据获取、数据管理、数据分析、模拟实验等。数据分析是机器学习的舞台，机器学习技术在该领域已经蓬勃发展。机器学习提供了数据分析能力；云计算提供了数据处理能力；众包提供了数据标注能力。\n\
  \n## 过拟合与欠拟合\n\n在模型评估和调整的过程中，我们经常遇到“过拟合”或“欠拟合”的情况。如何有效识别“过拟合”和“欠拟合”现象并调整模型是提高机器学习模型的关键。特别在实际项目中，算法工程师应该具备领域知识，以采用许多方法来降低“过拟合”和“欠拟合”的风险。\n\
  \n在尝试定义这两个概念时，记住如果一个模型与训练样本拟合良好但但准确率非常差，则被称为过拟合。相反，如果训练样本在模型中拟合得不好，且对预测的效果也不准确，则被称为欠拟合。\n\
  \n代价（Cost）是一个衡量模型与训练样本之间符合性的索引。简单来说，代价就是所有训练样本模型预测值与训练样本真实值之间的平均误差。而代价函数是代价与模型参数之间的函数关系。模型训练的过程就是寻找合适的模型参数以使代价函数的值最小。代价函数记录为\
  \ `j()`，表示模型参数。\n\n测试数据集的代价 `Jtest()` 是衡量模型准确性最直观的指标。`Jtest()` 值越小，意味着模型预测值与真实值之间的差异越小，模型准确性越好。由于测试数据集用于测试模型的准确性，需要特别注意。\n\
  \n## 过拟合\n\n在模型评估和调整的过程中，我们经常遇到“过拟合”或“欠拟合”的情况。如何有效识别“过拟合”和“欠拟合”现象并调整模型是提高机器学习模型的关键。特别在实际项目中，算法工程师应该具备领域知识，以采用许多方法来降低“过拟合”和“欠拟合”的风险。\n\
  \n在尝试定义这两个概念时，记住如果一个模型与训练样本拟合良好但但准确率非常差，则被称为过拟合。相反，如果训练样本在模型中拟合得不好，且对预测的效果也不准确，则被称为欠拟合。\n\
  \n代价（Cost）是一个衡量模型与训练样本之间符合性的索引。简单来说，代价就是所有训练样本模型预测值与训练样本真实值之间的平均误差。而代价函数是代价与模型参数之间的函数关系。模型训练的过程就是寻找合适的模型参数以使代价函数的值最小。代价函数记录为\
  \ `j()`，表示模型参数。\n\n测试数据集的代价 `Jtest()` 是衡量模型准确性最直观的指标。`Jtest()` 值越小，意味着模型预测值与真实值之间的差异越小，模型准确性越好。由于测试数据集用于测试模型的准确性，需要特别注意。\n\
  \n## 减少过拟合的方法\n\n1. **从数据入手获取更多训练数据**。使用更多训练数据是解决过拟合问题的有效方法，因为更多的样本可以让模型学习有效特征并减少噪声的影响。当然，增加实验数据通常很难，但可以使用一些规则，例如在图像分类问题中，可以通过平、旋转等手段扩展数据。\n\
  \n2. **降低模型复杂度**。过拟合的主要因素是数据较少时模型过于复杂。适当降低模型复杂度可以避免过多的噪声。例如，在神经网络中减少网络层和神经元的数量，在决策树模型中减少深度并剪枝。\n\
  \n3. **集成学习**。集成学习是通过整合多个模型来减少单一模型的过拟合风险，例如 bagging 方法。\n\n## 减少欠拟合的方法\n\n1. **添加新特征**。当特征不足或现有特征与样本标签之间的相关性不强时，模型容易出现欠拟合。通过挖掘新特征如“上下文特征”、“ID\
  \ 类特征”和“组合特征”，可以获得更好的结果。在深度学习趋势下，有很多模型可以帮助完成特征工程，如因子机、梯度提升树、深度交叉等。\n\n2. **增加模型复杂度**。简单模型的学习能力较差，通过增加模型复杂度，模型具有更强的拟合能力。例如，在神经网络中添加高阶项，增加网络层数或神经元数量。\n\
  \n3. **降低正则化系数**。正则化用于防止过拟合；但当模型出现欠拟合时，有必要降低正则化系数。\n\n\n\n通过带有概念标记（分类）的训练样本进行学习，以便对训练样本集之外的数据进行尽可能准确的标记（分类）。在这里在这里，所有的标签（分类）都是已知的。因此，训练样本的歧义较低。学习不带概念标记（分类）的训练样本，以发现训练样本集中的结构化知识。在这里，所有的标签（分类）都是未知的。因此，训练样本的歧义较高。聚类是典型的无监督学习。\n\
  \n### 准确率与召回率\n\n在信息检索和其他识别等处理过程中，有两个基本指标被认为是重要的。这些指标对于更好地理解主题至关重要。\n\n在关于准确率和召回率的问题中，有四种场景可以使用。其中第一种是真阳性（true\
  \ positive），意味着一个实例是完全正确的。第二种被称为假阳性（false positive），意味着它不是真的，但被机器预测为真了。第三种被称为真阴性（true\
  \ negative），意味着它绝对是错误的，且系统猜对了。最后一种被称为假阴性（false negative），即它不是错误的，但由于各种需要监控的原因，被机器预测为错误的。\n\
  \n### 数据集\n\n数据集和算法就像黄油和面包一样不可不可，在很多情况下，数据比算法更重要。书中的示例主要基于多年收集的开源数据集以及部分脱敏的测试数据。\n\
  \n*   **HTTP 数据集**：`CSIC 2010` HTTP 数据包含大量的 36,000 个标记的正常 Web 服务请求和 25,000 个 SQL\
  \ 注入、缓冲区溢出、信息泄露、文件包含、XSS 等攻击请求。它广泛用于 WAF 产品的功能评估。\n*   **Alexa 数据集**：Alexa 是一个发布世界排名的网站。Alexa\
  \ 由搜索引擎于 1996 年 4 月在美国创立，旨在让互联网用户共享虚拟世界资源并更多地参与互联网资源的组织。Alexa 每天从网上收集超过 1000 GB\
  \ 的信息，不仅提供了数十亿网站的链接，还对每一个网站进行排名。可以说，Alexa 目前拥有数量最多的 URL，是发布信息最详细的网站。Alexa 排名是衡量网站访问量最常引用的指标之一。Alexa\
  \ 排名基于用户在 IE 和 Firefox 等浏览器中下载并安装的 Alexa 工具栏来监控他们访问的网站，因此其排名数据并不一定具有权威性。但它提供了全面的排名、访问者排名、页面流量排名等评估指标信息；很难有更科学合理的评估参考了。Alexa\
  \ 提供 CSV 格式的世界前百万个网域名下载。\n*   **电影评论数据集**：电影评论数据集包含不同的电影相关数据，可用于各种分析和测试目的。由于其实现简单、指令容易，它在全球范围内被广泛。\n\
  \n## 文本数据提取\n\n在机器学习中，特征提取被视为一种人工工作。有些人称其为“特征工程”，这显示了它需要多少工作。在特征提取中，数字特征和文本特征提取是最常见的。数字特征可以直接作为特征使用，但对于多维特征，某个特征的取值范围非常大，可能导致其他特征对结果的影响被忽略。此时，我们需要对数字特征进行预处理。\n\
  \n文本数据提取特征比数字特征复杂得多。它们本质上是分词。不同的单词被用作一种新特征。\n\n*   **词集模型（Word set model）**：一组词，其中每个元素仅有一个词，即词集中的每个词都只有一个词。\n\
  *   **词袋模型（Word bag model）**：如果一个单词在文档中出现多次，则统计它出现的次数（频率）。\n\n两者之间的本质区别在于，词袋在词集的基础上增加了频率维度：词集只关注“有”或“无”，而词袋还关注“多少”。在处理数据时，`CSV`\
  \ 是最常见的格式，文件的每行记录一个向量，并在最后一列进行标记。`TensorFlow` 提供了一种非常方便的方法从 `CSV` 文件读取数据集。\n\n#\
  \ 2. 决策树\n\n我们将要查看的第一个监督机器学习算法是决策树。这些工具非常好用，因为每当你想要查看提供的不同场景时，它们都是高效的数据工具，然后为你的业务为这些场景选出正确的选项。一旦决策树能够为你提供几个选项，你就可以看到结果以及随之而来的可能性。所有这些信息都可以帮助你做出对你的需求最准确且最有帮助的预测。\n\
  \n这些决策树也可以用于连续随机变量，或者当你想处理分类变量时。然而，在大多数时候，当你决定使用这些决策树时，你处理的是分类问题。\n\n为了让程序员做出良好的决策树，将所有数据收集并拆分为不同的领域是关重要的，然后你将其分成至少两个集合，尽管你经常会获得更多类似的数据。这些数据集将在独立变量的帮助下进行排序，因为这有助于区分你正在处理的不同集合。\n\
  \n所以，我们在这里已经讨论了这些内容，但是时候更好地了解它是如何运作的。在这个例子中，我们假设组中有 60 个人。在组的这些人中，将有三个独立变量需要考虑，包括他们的性别、班级和身高。\n\
  \n\n\n\n在涉及监督机器学习时，决策树可以是你非常棒的选择。这是因为这些决策树允许你对数据进行拆分。然后，当这些数据被拆分并准备就绪后，你就可以对其进行审查并做出决策。这是确保你为自己的业务和个人做出最佳决策的一种极方法，因为所有信息都会呈现在你面前，经过分类且易于阅读，而不是在过程中不得不查看所有冲突的信息并进行经验性推测。\n\
  \n## 随机森林\n\n在很多情况下，你都可以使用决策树来做出某些决策并对你想要的数据进行排序。但有些时候，它无法以正确的方式工作。如果你正在查看数据并知道决策树不是你的正确选择，那么你可能会发现随机森林会更好用一些。\n\
  \n这些随机森林非常受欢迎，如果你计划在数据科学领域开展大量工作，那么你绝对想要了解更多关于这些内容以及你如何在需求中运用它们。由于这些算法在行业内非常知名且流行，你会发现许多人使用它们来解决各种出现的问题。例如，如果你想处理一项探索你所拥有所有数据的任务，例如处理某些缺失的值，或处理出现的任何离群信息，这些随机森林将帮助你完成所有工作。\n\
  \n现在，你可能会发现，随着你从事机器学习，会有某些你会使用它们，因为它们似乎是提供优秀结果的完美选择——那些其他算法无法实现的结果。使用这些随机森林可以获得的一些不同优势包括：\n\
  \n1. 当你决定创建一些自己的训练集并对其进行处理时，你可能会发现集合中的所有对象都将以随机方式生成。如果你的随机树工作方式正确，你可以对此进行替换，它可以帮助你根据需要筛选信息。\n\
  2. 如果有 `M` 个输入变量数量，那么 `m<M` 从开始就会被指定并作为常数保持。这之所以如此重要是因为这意味着你拥有的每棵树都是使用 `M` 从它们自己的变量中随机选取的。\n\
  3. 你的每棵随机树的目标都是为变量 `m` 找到最佳划分。\n4. 随着树的生长，所有树都将尽可能地变大。记住，这些随机树不会进行自我修剪。\n5. 从随机树创建的森林是非常棒的，因为它更擅长预测某些结果。它能够做到这一点是因为它将获取你创建的每棵树的所有预测结果，然后对于回归选择平均值，或者在分类期间获得共识。\n\
  \n你可能会发现，在进行数据科学任务的任何时候使用随机森林都是很棒的，与某些其他算法相比，使用随机森林会有很多优势，尽管它并不是每次都是完美的。仅仅因为随机变量可以为你提供很多你想要的结果，你必须知道它什么时候是有用的，什么时候应该被避免。尽管如此，使用它仍然具有一些优势。\n\
  \n首先，这些随机森林很好用，因为它们可以处理你面临的回归和分类问题。许多其他算法无法同时处理这两种类型。此外，如果你正在处理大量数据，你可能会发现随机森林是一个很好的选择，因为你可以添加成百个数据点和变量，而随机森林仍然能够处理这些。\n\
  \n在使用此工作时需要考虑的一点是，虽然随机森林能够处理许多回归问题，但在做出预测时会遇到一些问题。随机森林在这方面不会受到限制，因为它们无法超出为你提供的任何范围，因此有时你的准确性可能不会像你预期的那样高。\n\
  \n## KNN 算法\n\n你可以处理的第三类监督机器学习算法被称为 `KNN` 算法。它也被称为 `k-nearest neighbor's`（k-最近邻）算法。当你决定使用这种算法时，获取你所有的数据——即对于你正在处理的任何数据实例，`k`\
  \ 个最相似示例的数据——将很有帮助。一旦你通过这种方法获得了一定成功，`KNN` 算法就可以遍历你所有的数据点，并为你提供所有结果的摘要。许多公司和程序员能够利用此来帮助他们查看结果并做出良好的预测。\n\
  \n每当你计划使用这种算法时，你可能会发现许多公司和程序员能够利用此来帮助他们查看结果并做出一些不错的预测。\n\n\n\n\n当你决定使用 `KNN` 算法时，会遇到的最大问题之一就是计算信息的成本会非常高，尤其是当你试图将其与现有某些算法进行比较时。这是因为这类算法旨在在发送你所需的预测结果之前，查看你拥有的每一个数据点，一个都不放过。这有时可以提供更准确的预测和信息，但对某些人来说，计算成本可能太高。\n\
  \n# 人工智能与机器学习的三种类型\n\n人工智能有时根据人工智能的特征（间接地根据人工智能软件的意图）被分为几类。这种处理人工智能的方法允许计算机科学家创建具有特定能力模式的\
  \ AI 程序，同时也让非科学领域的人理解特定类型的人工智能运作。在这种常见的分类中，人工智能的三种主要类型列举如下：\n\n*   分析型人工智能\n*  \
  \ 拟人化人工智能\n*   受人类启发的人工智能\n\n其中第一类型被称为分析型人工智能，它包含了人工智能的认知能力（与任务驱动型 AI 相对）。分析型人工智能的研究涉及研究人工智能机器如何创建世界的认知表征，并利用这些基本表征进行学习。\n\
  \n另一种类型智能是所谓的拟人化人工智能，它包含了认知之外的智能类型。这包括社交智能和情感智能，意味着那些基于相对于直接接收信息并以各种方式处理信息之外能力的智能行动方面。人类能够对他人表现出同情并产生共情，这些都是情感智能的表现。在人工智能背景下，拟人化人工智能的一个潜在应用可能包括一个能够识别何时需要表现同情心的计算机程序或机器人。例如，一个程序可能希望某人生日快乐，对家庭成员的去世或其他悲剧表示哀悼，或者它可能会给出其他信号（如机器人面部表情的变化），代表\
  \ AI 意识到重大事件已经发生，并且需要或预期进行某种形式的展示。\n\n社交智能涉及人类利用自我意识和群体意识在社交环境中进行有效互动。在这种情况下，自我意识并不意味着某些人与人工智能的隐性危险所联系起来的那种意识（如自我觉醒），而是指的是对自我的理解，包括了解自身的某些方面可能是独有的或与他人不同的。人工智能背景下的社交智能可能包括机器识别群体动态的能力，以及在社交场合中与人类成功互动的能力。\n\
  \n拟人化人工智能能力的进步在商业、金融和医学领域具有明确的影响。已经尝试过的一个潜在应用是人工智能程序与人类进行对话，或者为人类创建与他人互动时遵循的脚本。一些网站已经有了与访问网站的人互动的\
  \ AI，而在未来，机器人将使用这种 AI，能够与人类成功互动，而不会显得“机械化”。\n\n机器人技术的进步也是拟人化 AI 以及另一种相关的人工智能——所谓的受人类启发的人工智能的明确用途。受人类启发的人工智能与拟人化人工智能相似，但侧重于认知智能和情感智能。受人类启发的人工智能程序或机器人能够处理信息、学习并做出相应反应，但这种类型无法理解人际关系。\n\
  \n## 人工智能会像人类智能吗？\n\n对拟人化人工智能的讨论自然地引出了预测性问题：未来的人工智能会像人类智能，还是仅仅具有“人性”。如果宇宙被构想为本质上是良好的创造（或仅仅是存在物），并且人类也被被认为是善良的，那么没有理由相信人工智能对人类构成了本质性的危险。\n\
  \n但如果宇宙被视为某种模棱两可的东西，一个既不好也不坏的创造，好事和坏事相互作用导致其中一方受损，那么人工智能就变成了某种危险的东西。如果我们真的生活在一个“弱肉强食”的世界，那么创造比我们更聪明的事物的危险是显而易见的。如果人类虐待他们管理的生物，那么我们怎么能说自己不会被机器虐待呢？\n\
  \n这类问题的作用是为人工智能的辩论注入了一种经常被忽略的哲学倾向。尽管人工智能的问题似乎是人类是否足够信任机器，并赋予它们比我们更大的力量，但它实际上是一个关于人性本身的问题。AI\
  \ 恐惧背后的隐含假设是人工智能最终变得像人类，而这种结果是令人恐惧的。\n\n虚构作品中的人工智能将在书中后面进行更详细的探讨，但在这里带提到它们是重要的。在《终结者》等电影中，人工智能机器人（以及引导它们的人智能程序）被认为是以人类的方式思考的。换句话说，人类对环境或宇宙本身是有危险的因此应该被消除的观点是一种人类式的逻辑。这种逻辑认为：“这个东西是坏的，我们应该除掉它。”\n\
  \n\n\n\n\n人类为了创造农田或作为定居点，消灭了许多动植物物种。我们意识到，人类与环境互动的方式存在问题，许多 AI 理论者假设人工智能也将得出同样的结论。也许它们会这么想，但它们可能会提供人类尚未想过的建议甚至解决方案。正如人类在数万年里为自己创造了可以食用的新食物一样，人工智能体可能会产生新的食物来源或新的生长方法，从而解决人类今天面临的许多问题。\n\
  \n在电影《黑客帝国》（*The Matrix*）中，统治地球的机器最终决定人类是完美的能量来源，并让人类处于集体幻觉中，以安抚和镇静他们。但这种对机器的描写暗示了机器将拥有与人类类似的动机。例如，人类与地球上其他物种的关系特征是：栖息地的减少，以及为了推进人类利益而增加竞争物种的数量。像《黑客帝国》这样的电影假设机器会以这种自私的方式与人类和其他物种互动。\n\
  \n在现实中，这种认为人工智能将以某种带有恶意的人类方式行为——猎杀人类灭绝或将我们变成饲料——的观点，假设了思维机器的动力将与驱动动物界顶级物种的本质动力相同。尽管我们人类可能对自己作为物种的优越性和神圣性有所认知，但人类的本质上行为是非常具动物性的。我们表现得如此成功，以至于在环境中的其他物种中获得了主导地位。\n\
  \n例如，一个人类家庭搬进了一个有熊居住的森林地区。在熊几次被食物气味或其他原因闯入人类住所后，这个家庭决定对这头只熊采取行动。同样，在由于某些与人类有关的原因，某农村地区的鹿群数量爆炸后，州或县的自然资源部门决定开始捕杀鹿，因为他们担心鹿引发的事故、鹿进入人类栖息地等。所有这些互动的背后是一个现实：人类利益被认为也高于其他物种的利益。这个家庭并没有搬家躲避熊，而是决定最简单的方法是消灭这只熊。作为人类，我们的意图通常不是受与环境平衡的渴望引导，而是为了在最大范围内推进我们在环境中的利益。\n\
  \n尽管我们设计人工智能的目标可能是使其类人或人性化，但我们假设具有完全意识的人工智能——即超越其程序并独立于人类运行的人工智能——其行为将与我们的行为相似。或许并非如此。也许人工智能能够实现人类无法实现的与全球环境的平衡。\n\
  \n这里的目的不是为了主张人工智能比人类更好，而是为了提出一个哲学问题：人工智能生命的动机将会是什么？当我们假设人工智能将拥有与我们人类相同的以自我为中心的动机时，我们是在假设我们是地球上最理想的物种，并且我们的任何竞争者自然会在某些方面与我们相似。这并不一定。\n\
  \n尽管人工智能可以（且很可能）发展出人类具备的智力，但这并不意味着它们会像我们这样思考，并得出与我们相同的结论。当我们人类说人工智能机器可能消灭人类物种时，我们基本上是在说，如果人类拥有机器将要拥的能力，我们就会消灭人类自己。\n\
  \n从存在主义的角度来说，需要对机器意识可能以什么形式存在进行更多讨论。尽管人工神经网络可能基于人类的神经连接，但假设具有意识的人工智能自然会以人类行为的方式思考和行为，这在推理上是一个巨大的跨越。我们不知道机器可能如何思考，我们需要探索这一领域。回想那些在社交媒体上进行过没有人听懂的对话的\
  \ AI 程序。\n\n## 人工智能与机器学习\n\n人工智能的应用非常多，其中许多是基于机器学习的。机器学习与深度学习一样，是理解人工智能及其过去和未来方向的概念之一。机器学习有许多定义，正如学习定义一样。机器学习可以总结为为了提高性能而对程序或数据进行的更改。通过这种方式，机器学习本质上与数据的存储（包括\
  \ `.dat` 文件和其他扩展名）相关联，而这些任务与人工智能的概念密切相关。\n\n\n\n\n\n机器学习讨论中固有的问题是，机器是否应该能够学习。一些人认为，使用人工智能的最佳方式是监督式的，即智能体被编程为完成任务，且不会经历其组件或学习的改变。允许机器参与学习涵盖了现实情况：某些任务无法通过编程得到充分解决，需要机器进行学习（例如，思考一个玩棋的\
  \ AI 程序）。机器学习还允许背景的人类获取有关关系的信息，以用于数据挖掘。\n\n与机器学习相关的概念是深度学习。深度学习是机器学习的一类算法，它允许对原始输入数据进行日益深入的处理。深度学习被称为“深度”，是因为它涉及多层数据表示，这些层允许执行日益复杂的操作。深度学习的深度或分层特性非常重要，因为它代表了人类神经网络处理信息的一种形式，通过创建可能非常抽象的模型。稍后我们将详细讨论深度学习。\n\
  \n# 4. 堆叠去噪自动编码器\n\n在本章中，我们将探索自动编码器，特别关注堆叠去噪自动编码器。我们将主要关注这些网络背后的理论，并学习重要的概念和技术。在代码方面，我们不会深入得太深，因为这个主题相对较高级，并不完全适合作为机器学习的中中级指南。然而，学习自动编码器的理论和原理是非常重要的，这样你以后就可以为你的机器学习工具箱添加另一个工具了。\n\
  \n在我们开始探索和讨论堆叠去噪自动编码器之前，我们需要先谈谈通用的自动编码器。\n\n## 自动编码器\n\n它们是深度学习拼图的另一个重要部分。在许多方面，自动编码器与受限玻尔兹曼机（restricted\
  \ Boltzmann machine）相似。你可以认为它们是相关的，因为自动编码器的训练方式与 `RBMs` 相同。但值得提到，在某些情况下它们的训练更容易，而且当玻尔兹曼机表现不佳时，通常更倾向于使用它们。但自动编码器到底是什么呢？\n\
  \n它具有 3 层结构的神经网络，其输出连接到输入。自动编码器的目的是为了降维学习编码（或表示）。这是通过忽略任何信号噪声来实现的。然而，这只是网络的侧。另一侧是重构，我们取还原后的表示并构建编码，使其与最初的输入几乎相同。换句话说，自动编码器压缩来自输入层的数据，然后对这些压缩数据进行解压缩，使其匹配原始数据。这样做是为了进行降维并忽略数据噪声。\n\
  \n为了给你一个例子，我们可以使用简单的自动编码器来处理图像识别。我们取第一个编码层来编码基础图像数据（如角）。然后，第二个编码层将处理第一层的输出并编码其他特征（例如眼睛的虹膜）。最后，我们有第三层，它可以编码眼睛的其余部分，直到我们拥有整个图像代码来匹配图像所代表的任何内容。在最后阶段，层将所有这些表示解码回原始数据。\n\
  \n自动编码器的作用与 `PCA` 相同。但既然我们已经有了类似的技术，为什么还要费力使用这种技术呢？简单来说，这取决于你正在处理的数据。`PCA` 有一个缺点：它在处理高维数据时并不十分有效，然而自动编码器的表现非常好。自动编码器仅仅是应用了降噪和堆叠方法的更先进的技术。这允许它们处理大规模的复杂数据，同时保持准确性。\n\
  \n现在你已经对自动编码器有了更多的了解，让我们学习其结构或架构，以更好地理解它们是如何实现的。\n\n### 结构与学习\n\n自动编码器的架构相当基础。与大多数大多数基础结构一样，输入数据进入隐藏层，然后从那里进入输出层。与其他神经网络相比的一个关键区别是，与输入和输出层相比，隐藏层包含最少节点。\n\
  \n另一个值得提到的特征是输出被设置为输入。为什么？因为在隐藏层中对输入进行编码后，我们依靠准确性来重构它。这里有一个编码的简单示例：\n\n```\ny =\
  \ s(Wx + b)\n```\n\n在这个示例中，编码通过将输入 `x` 映射到自身的新版本 `y` 来完成。与之前的示例一样，`W` 代表附加到 `x`\
  \ 的权重值，`b` 是一个可以调整的变量。这些变量调整可能非常有用。现在让我们简短地观察学习过程。当这种网络训练时，它依赖于低误差以尽可能保持准确。\n\n\
  ### 堆叠去噪自动编码器\n\n自动编码器本身既有用又强大，但通过堆叠它们，我们可以大幅提高准确性。堆叠去噪自动编码器是数据科学和机器学习中非常流行的工具，特别是在处理自然语言处理时。这些网络还可以应用于图像、音频或文本数据。通过将上一层的编码表示引导到下一层的输入，可以获得这种准确性。\n\
  \n堆叠去噪自动编码器的使用方式与受限玻尔兹曼机类似。每一层都由一个去噪自动编码器和一个 sigmoid 元素组成。自动编码器元素用于整个网络的预训练过程。\n\
  \n请注意，在处理堆叠去噪自动编码器时，我们使用训练集误差作为性能衡量。这涉及一个层到层的预训练过程，因为在执行优化过程之前，我们需要对网络参数。当我们开始微调时，我们需要测试和验证数据来训练网络。这是通过多个轮（epochs）完成的，但只需要少量，因为我们将会有更大的更新阶段。整个过程的目的是获得尽可能准确的结果。\n\
  \n目前总结一下，到目前为止有两个主要优势：为高维数据集学习特征表示，以及无需涉及复杂特征工程的训练。在这两个优点之上，还有第三个值得记住的特征。如果我们正确构建堆叠自动编码器，就可以获得其输入数据的层次形式。那么，如果我们有连续的堆叠自动编码器层，它们可以逐渐学习高级特征。层数或大小没有限制或规则规定规定。这完全取决于我们的场景以及我们需要解决的问题。该过程的唯一可行方法就是对参数进行探索和实验。\n\
  \n高层可以学习复杂的结构和组合，这意味着它们可以识别人脸和模式、手写字符和其他各种物体。堆叠去噪自动编码器非常擅长学习极其复杂的数据，因为它们可以无限堆叠。重复堆叠自动编码器只能提高深度网络的性能和能力，唯一的严重缺点是计算这一切所花费的时间和电力。\n\
  \n\n\n\n就此，我们将结束本章，因为堆叠去噪自动编码器的应用超出了本书的涵盖范围。例如，解决自然语言处理问题是一个更复杂的过程，应该留到你对机器学习应用和技术达到更高级的水平时再进行。目前，只要理解其背后的较为浅显的理论就足够了，这样你就能为未来的实现建立一个大致的概念。话如此，让我们进入下一章讨论半监督学习。\n\
  \n# 5. 机器人学\n\n机器人学是一门跨学科领域，结合了工程、科学、物理、计算机科学和电子学等元素，这只是其中几个领域。机器人学涉及机器人的设计、实现、编程和维护。机器人可以是任何旨在执行动作或一系列动作（具有不同程度自主性）的物理系统。机器人学历史悠久，可能从古希腊关于自动人的故事出现以来，就一直存在于人类的心理中——尽管今天的机器人与你学过的那些有所不同。现代技术允许机器人比以前更智能、更栩如生、更友好并且比以往任何时候都更有用。许多人认为人类正走向一场新的工业革命，这场革命将由这些系统在几乎每个经济领域的广泛采用所引领。除了在汽车制造厂和炼油厂中看到的显性工业机器人外，还有为零售、酒店、交通、电信、医疗和食品服务开发的机器人系统。\n\
  \n机器人学和人工智能经常被归为一谈，但它们是两个完全不同的东西。虽然机器人学的某些方面适合使用人工智能技术，但整个整个领域并不热迷于模拟智能。机器人学还可以分为几个子领域，专门从事机器人原理的某些应用。在工业领域，机器人被用于处理易于委托给机器的任务。其中一些任务需要高精度或重复动作，而这些动作对于人类来说持续执行太困难了。另一些任务是为高吞吐量设计的，如食品包装和贴标签。这些系统在能够执行的行为数量、物理属性以及编程方式上不相同。工业机器人有不同的品种，但最常见的配置之一是“机械臂”型。它们的设计相似，但执行的任务不同。它们还具有不同的自由度，允许它们以不同的方式移动。运动学对于这类机器人非常重要，因为数学方程决定了手臂关节如何移动。\n\
  \n在市场渗透率和实用性方面，人形机器人的兴趣程度远低于工业机器人。虽然对类人或类人机器人系统的研究仍然保持高水平，但人形机器人的角色更多是一个技术奇闻，而不是一个商业上可行的业务——尽管可以想象，有一天它们将像《杰森一家》中的机器人一样作为家务机器人被买卖。目前已经存在家务辅助机器人，例如\
  \ `Roomba`，它自 2002 年起就可用。`Roomba` 由一家名为 `iRobot` 的机器人公司制造。麻理工学院机器人学教授罗德尼·布鲁克斯（Rodney\
  \ Brooks）于 1990 年与同学共同创立了该公司。从那时，布鲁克斯于 2009 年又创立了另一名为 `Rethink Robotics` 的公司，最著名的是它创造的\
  \ `Sawyer` 和 `Baxter` 协作机器人。`Baxter` 从根本上是一个具有工业能力的工业机器人，但带有一些想象力。与大多数类似于机械臂的工业机器人不同，`Baxter`\
  \ 有两个主肢和一个动画液晶脸。它被设计用于执行装配线上的平凡任务。\n\n`Baxter` 是工业机器人的一种人道主义演绎。`Baxter` 不是快速机械地执行任务，而是利用传感器来“感知”周围环境。LCD\
  \ 屏幕会根据机器人的状态显示脸部。它还可以响应环境的变化，例如在掉落工具或零件且无法找回时停止运行。该机器人最引人注目的方面之一是，工人可以在设施内对其进行编程。其他工业机器人需要工程师通过控制系统进行配置，而\
  \ `Baxter` 可以通过“手动”编程。一个没有技能的工人可以移动机器人的手来执行特定任务，而计算机将尽力复制这些动作。这使得 `Baxter` 生产线上的每一个人都能使用，而不仅仅是受过教育的技术人员。`Baxter`\
  \ 被誉为比传统的工业系统更安全，因为后者不会关注其直接编程范围之外的其他因素。尽管如此，该公司由于销量低迷，已于 2018 年 10 月破产。许多老牌制造制造公司认为这些系统是实验性的，而且该技术可能尚未到位。`Sawyer`\
  \ 和 `Baxter` 机器人在今天仍被用于研究。一些大学用它们来教授机器人课程的学生。最近，研究人员在 `Baxter` 和人类操作员之间连接了电极，以直接传输脑信号。在未来的某个时刻，人与机器人之间的交互可能变得像仅仅思考那样直观。\n\
  \n大多数工业机器人不需要感知事物或特别聪明。它们执行一组任务并通常被单独留在一旁。相比之下，人形机器人的研究侧重于机器人感知周围世界并与其交互的能力。移动机器人需要一些动力系统，例如一系列执行器或电动机。另一个选择是使用液压系统或气动系统。所有机器人都需要能量源，电池或通过墙壁插座直接连接电流。为了能够看见，机器人可以配备摄像头、`LIDAR`\
  \ 和各种传感器。计算机视觉与摄像头结合，传感器将速度、位置、平衡等环境数据直接发送到机器人的控制系统。如果机器学习只是统计学和编程的结合，那么机器人就是许多其他事物的结合。在这两种情况下，哪种方法都没有像《星球大战》中的机器人\
  \ `3-CPO` 那样的通用智能。如果是这样的话，机器人领域的尖端水平如何？机器人研究被分为许多关注领域，一些人专注于传感器、机器人灵活性、人机交互、自主运动等。\n\
  \n\n\n\n# 人形机器人预计将颠覆零售、酒店和餐饮服务领域。你很可能已经在网上见过麦当劳及其他快餐店的自动菜单系统。这些系统确实正在开发中，但由于各种原因，可能还不会实施。一些初创公司甚至正在研发汉堡制作系统，它们能够以极低的成本执行普通翻汉堡员几乎所有的职责。\n\
  \n在东京等机器人技术已进入主流的国家，人形机器人在客户服务中的作用更为显而易见。在当今所有工业化国家中，日本的机器人密度远超其他国家。这些机器人大部分用于汽车工业，但也有许多机器人承担了客户服务的角色。你可以在特定的百货商店看到它们迎接顾客，在机场看到它们充当搬运员。随着人口不断萎缩以及愿意从事这些工作的非熟练工人减少，日本拥有高采用率是合理的。对于许多日本公民来说，服务机器人有助于提高生活质量，是他们日常生活中常的一部分。\n\
  \n然而，对于其他国家的普通消费者来说，接受这些机器人和自动化系统还有很长的路要走。有些人甚至认为这种需求根本就不存在。2017 年，日本的死亡人数比出生人数多出\
  \ 1000 人。仅一年内人口就大幅减少了 26.4 万。其他失业率上升且人口稳定的工业化国家可能不需要这么多机器人。除了人口和失业问题外，还有其他导致服务机器人尚未在海外普及的原因。\n\
  \n## 恐怖谷效应\n克服恐怖谷效应并非易事，尤其是对于老一代人来说。在 във，人们已经习惯了它们的存在，因此这种效应的影响较小——但其他国家的老一代人则并非如此。现在的年轻人更习惯于使用自助结账机和自动化系统，但老一代人压倒性地认为与社区面对面交流的重要性。\n\
  \n在日本采用服务机器人的一个重要论点是其庞大的龄化人口。临终关怀等同于辅助生活、失去个人自主权以及尴尬的意外。这些都是服务机器人可以直接解决的领域。例如，如果是一个机器人在清理其浴室事故后的遗物，年长患者就不可能感到尴尬。如果存在强烈的人机交互，患者可能会觉得机器人是他们的一部分，就像我们认为手机一样。从各方面来看，结果是个人自主权的净增加。\n\
  \n## 劳动力与护理挑战\n由于老年医学和个人护理专业人员的短缺，加上全球范围内的人口老龄化（不仅是日本），预计机器人将会增加越来越多的人不再选择这些重要的临终职业。与需要相似培训的其他医学专业相比，这些工作的薪水很低。如果没有人照顾老年人，谁来做？并不是每个家庭都愿意或能够照顾年迈的父母。此外，辅助生活机构发生医疗疏忽和虐待的风险很高。照顾老年人绝不是一项轻松的工作。再加上微薄的工资，就构成了不公正对待的基础。每一位老年人就应该受到尊严和尊重。服务机器人是否能提供这种待遇尚待辩论。这场争论无疑将在本世纪内展开。\n\
  \n## 人类感知与交互\n老一代人会渴望使用服务机器人满足日常生活需求吗？对某些人来说，机器人可能看起来令人生畏或缺乏人情味。毕竟，机器人并不像我们这样拥有智能。它们可能处理基本的对话技巧并响应我们的指令，但这与真正的智能相比仍有很大差距。还有一个问题是，这些系统应该具有类人类的外观，还是保持明显的机器人外表。人形机器人更容易产生恐怖谷效应，但这种效应并非类设计所专利。任何表现得足够“生动”的机器人都能诱发这种效应。\n\
  \n缓解恐怖谷效应的研究属于人机交互领域。我们通过这些研究知道，某些机器人行为会引发特定的人类情感，如恐惧和不确定性。例如，当机器人靠得太近或侵入他人的个人空间时，会产生恐惧反应。如果机器人只是无目的地在闲逛，人类会认为它令人令畏甚至毫无用。与这些系统交互可能会导致人类产生意料之外的行为。即使这些特征没有被明确编程，人类也可能赋予机器人人格特质。这种不可预测的因素促使研究人员和设计人员在机器人上添加情感信号。\n\
  \n## 实用性与军事应用\n服务机器人遭受恐怖谷效应的影响，而实用型机器人则没有。全球几乎每个主要军方都在投资机器人以协助战斗和行动。一家位于美国的公司 `Boston\
  \ Dynamics` 正在开发以移动性闻名的机器人系统。该公司因设计了一款名为 `BigDog` 的四足机器人给国防高级研究计划局（`DARPA`）而登上头条。该机器人具有明显的军事应用价值，可以充当骡子为巡逻士兵携带弹药和物资。该项目最终被取消，因为该系统被认为噪音太大，无法在实战行动中使用。不过，这类系统大多被视为原型。\n\
  \n美国军使用的其他机器人还包括 `Foster-Miller TALON` 系列遥控无人器。它们看起来像小坦克或行星车，具有全履带移动能力。它们能够完全远程地使用小型武器和重型机枪。尽管\
  \ `TALON` 在伊拉克和阿富汗经历过部署，但其目前的用途仍然有限。其他完全武装的系统被广泛使用，例如 `General Atomics MQ-1 Predator`无人机和\
  \ `MQ-9 Reaper`。它们属于一类被称为 `UAVs`（无人机）的飞机。`Predator` 和 `Reaper` 无人机可以由地面操作员控制，也可以根据车载计算机的指示自主飞行。由于涉及平民的高知名死亡事件和争议性的交战规则，这些系统面临着日益严格的审查。2011\
  \ 年，在奥马政府时期，一名 16 岁的也门裔美国公民在也门一家餐厅用餐时被无人机击杀。目前还不清楚该男孩为何被定为目标，但他的父亲是涉嫌的基地组织领导人，随后在类似的袭击中丧生。\n\
  \n\n\n\n\n所谓“杀手机器”的合法性，每当有新系统发布时就会引发质疑。辩论的核心在于，一个国家是否应该拥有在未经审判的情况下远程杀人的权力，并且是在一个非战国家杀死一名\
  \ 16 岁的少年。评论人士很快指出，具有杀能力的机器可能会被黑客攻击。他们诉诸“天空网”的情景，即自主武器获得意识并开始消灭人类。这类情景大多是遥不可及的科幻小说，对辩论没有帮助。虽然我们知道其中某些系统容易被黑客攻击，但我们还没有看到过被攻击的自主系统导致人员伤亡。如果真的发生了此类情况，可能会造成足够的麻烦，导致政府被迫禁止它们。尽管如此，还有人质疑机器人上战是否根本就是一个好主意。如果最先进的机器学习算法勉强能以某种程度的安全性驾驶自动汽车，我们又如何指望机器人能准确地作战呢？战争的复杂性比在街道上开车多出几个维度。以目前的技术，部署真正的机器人士兵似乎是军事开支的一种不太可能的用途——尽管你可以放心，主要政府正在研究这些技术。\n\
  \n“杀手机器”是一个笼统的术语，也没有帮助。捕食者级无人机应该被视为机器人，就像配备自动炮塔的坦克被视为机器人一样吗？哨兵枪已经开发了多年，并定期部署在战场上。其中最常见的被称为近防武器系统（`CIWS`），用于保护战舰免受导弹和飞机攻击。`CIWS`\
  \ 基本上是一门高射速的大口径火炮，能够以每分钟 4000 发或更高的速度击落导弹。与你祖父辈那种可能需要手动瞄准的防空系统不同，`CIWS` 使用旋转机械平台上的雷达引导来自主锁定目标。不仅如此，一旦“启动”，该武器系统在锁定目标后无需手动输入即可交战。雷达系统检测到的任何导弹或飞机都会自动遭到攻击。以美国海军使用的\
  \ `Phalanx CIWS` 为例，它使用一门 20 毫米沃尔尔干加特林机炮，具有计算机级的精度。目标选择问题被简化为一个简单的算法。它不需要机器学习或任何花哨的人工智能技术。如果雷达发现一个靠近船只的物体，它首先需要确认其航线是否指向船只。如果物体的移动直接朝向船只，系统必须决定开火。如果物体处于最小和最大速度范围之间，则火炮开火。但如果物体太慢或太快，系统则无作为。最小和最大速度范围都可以由操作员编程。\n\
  \nCWIS 像 `Phalanx` 一样被认为是自主武器，但它们使用的是自海湾战争以来一直存在的非常简单的技术。然而，按照今天的标准，这仍然是一门“笨”大炮。这种武器的不完善性已经在几次灾难性的训练演习中得到了证明。在一次案例中，系统成功击落了一个模拟无人机目标，但爆炸产生的燃料和碎片损坏了船只和船员。在另一个案例中，模拟无人机被击落，但系统在它处于自由落体状态时重新锁定，无意中将弹药射向了……\n\
  \n# 6. 强化学习\n\n强化学习涉及使用学习数据提供反馈，以决定模型如何调整。例如，这一概念被完美应用于自动驾驶汽车和象棋中。如上所述，强化学习发生在交互环境中。换句话说，学习者完全没有被教导预期什么，而是根据其行为的结果自己发现，这一概念被称为“目标导向学习”。在本章中，我们将涵盖强化学习（RL）的基础。我们将涵盖的主要强化学习组件有：\n\
  \n* 强化学习基础\n* RL 算法\n* RL 环境\n* 各种 RL 平台\n* RL 的应用\n\n## 强化学习基础\n\n假设我们想训练一只狗去接住抛到空中的物体。狗可能并不理解这里涉及的所有概念和理论。实现这一目标的最好方法是将物体抛向空中，每当狗接住它时，就准备好奖励它。如果狗失败了，就没有奖励。狗最终会分析发生了什么行为，直到它获得奖励。奖励将激励狗重复相同的行为，以获得更多的奖励。\n\
  \n\n\n\n另一个规则是当机器人每次向正确方向导航时给它 20 分。当然，机器人必须尝试通过留在正确路径上来使最大化。\n\n这里的模型或智能体（机器人）可以应用强化学习（RL）的两个基本概念来流畅导航并获得更多奖励。RL\
  \ 模型可以决定探索不同的可能性以获得更多奖励。在这种情况下，智能体表现良好的可能性较低，因为它可能会利用错误的阳离子。另一种方法是仅利用产生正向奖励的先前动作。当模型遵循仅利用已知先前动作的路径时，尽管它会获得奖励，但它有可能错过最佳动作。遗憾的是，无法同时进行探索（exploration）和利用（exploitation）。\n\
  \n## 智能体 (Agent)\n\n智能体本质上是一个能够做出智能决策的软件程序，是强化学习中的学习者。它们根据交互环境以及随后的奖励做出决策并采取行动。\n\
  \n## 智能体环境接口 (Agent Environment Interface)\n\n智能体作为智能软件，能够在时间 `t` 执行一个函数，然后从状态 `At`\
  \ 移动到标记为 `At+1` 的下一个状态。同样，根据动作，智能体获得奖励 `R`。\n\n## 模型 (Model)\n\n这代表智能体的学习环境。这里的学习可以通过基于模型的学习（model-based）或无模型的学习（model-free）来实现。对于基于模型的学习，智能体在做出决策之前可以利用所有以前学到的信息。另一方面，无模型的学习涉及智能体完全依赖试错法来执行所需的动作。例如，当你想要从家去大学时，你要么使用去大学路线的预知，要么只尝试不同的路线并最终选择最快的方法。\n\
  \n## 策略函数 (Policy Function)\n\n策略基本上是控制智能体在环境中如何行为。智能体的行为性质取决于它在什么类型的策略下运行根据我们之前关于从家去大学的例子，各种路线代表了不同的可能策略。某些路线可能非常短，而另一些则是远路。路线被称为策略，因为它们是实现最终目标的指南。符号\
  \ `ᴫ` 始终用于表示策略。\n\n大多数策略始终表示为查找表或复杂的搜索过程。\n\n## 值函数 (Value function)\n\n智能体的每一个状态都存在存在一个值函数。该函数给出了智能体位于特定状态有多大有利。该函数取决于策略，并记为\
  \ `v(s)`。值函数代表智能体从初始状态开始接收的总预期奖励。值函数的各种类型包括：\n\n- **最优值函数 (Optimal value function)**：与其他值函数相比，它为所有状态提供了最高值。因此，具有最优值函数的是最优策略。\n\
  - **平稳策略 (Stationary policy)**：这种策略涉及动作分布返回完全取决于智能体访问的最后两个状态。\n- **确定性平稳策略 (Deterministic\
  \ stationary policy)**：这是一种根据其当前状态确定地选择智能体动作的策略。\n\n## 控制学习算法 (Algorithms for control\
  \ learning)\n\n下文讨论了应用于强化学习的各种算法：\n\n### 优性准则 (Criterion for Optimality)\n\n学习智能体预计在进入环境的最初时刻会犯错。因此，如果要实现最优目标，智能体应该获得折扣奖励。这里的策略集应该是对智能体自身期望最小回报的。有两种完全涉及获得优性的策略，即最优策略、确定性平稳策略和平稳策略。\n\
  \n### 暴力法 (Brute Force)\n\n这种 RL 算法包括以下过程：\n\n1. 任何可能的策略都有其积累的样本回报\n2. 选择预期回报最高的策略。\n\
  \n该算法的问题包括：策略的数量可能极其巨大甚至无限，因此难以操作。另一个可能的问题是处理具有不同回报的策略有困难。想象一个回报波动巨大的策略。有时获取每个策略的回报平均值可能是枯燥的。\n\
  \n### 值函数方法 (Value Function Approaches)\n\n这类算法试图通过为某些特定策略（当前策略或最优策略）维护一组估计回报来尝试获得最大回报。从初始状态实现最大回报的策略可能被认为是最适合应用的。\n\
  \n### 直接策略搜索 (Direct Policy Search)\n\n确定最佳策略的另一种可能方法涉及直接从某些策略空间进行搜索。这里使用的两种方法是：基于梯度的方法和无梯度的方法。基于梯度的搜索涉及从有限维参数映射到策略所在区域。\n\
  \n## 强化学习的应用 (Applications of Reinforcement Learning)\n\n在 RL 广泛的应用领域中，某些仍在调查中，而另一些已经实现。这些领域包括：\n\
  \n- 大规模经验评估\n- 预测状态表示\n- 终身学习\n- 大脑中基于多巴胺的学习\n- 人类技能学习模型的一部分\n- 等\n\n\n线性代数是一个数学领域，世界科学家科学家确认它是深入理解机器学习的先决条件。尽管有各种符号和工具、困难的发现和理论，线性代数是一门广泛的学科，从该领域提取的螺丝螺母对于机器学习从业者来说是实用的。这就是为什么在坚实的线性代数概念基础上关注相关或正确的部分是可能的。从机器学习的角度来看，知道线性代数的确切意义至关重要。此外，知道线性代数是否是数据的数学，或者对统计学领域是否有重大影响，以及线性代数是如何包括计算机图形和傅里叶级数内的若干实用数学工具的原因。\n\
  \n作为数据的数学，线性代数是数学的一个分支，是向量和矩阵的数据语言。线性组合是线性代数的总体。它是对向量（数字列）和矩阵（数字数组）进行算术运算。作为向量映射和空间的研究，线性代数关于线性变换所需的平面和直线。\n\
  \n要开始这段旅程，你需要了解基础的推断统计和描述性统计。然而，一旦你涵盖了机器学习的基本概念，就需要更多的数学知识。在理解这些算法如何工作以及当它们做出任何底层假设和局限性时，需要更多的数学知识。\n\
  \n了解线性代数是重要的重要性至关重要，以下是四个例子：\n\n例子 1：\n\n\n\n\n想象一下当你试图观察一朵花的图像时的那种感知。嗯，这很容易，因为你可以认出叶子和花。然而，当你被要求计算机执行相同的工作并标记该逻辑时，这可能是一项极具挑战性的任务。由于人类大脑经过了数年的进化，你可以识别出花朵。但要拥有判断图像颜色是黑色还是红色的能力，我们对背景中发生的事情一无所知。执行这项任务是我们大脑唯一训练过的能力。\n\
  \n然而，让计算机从事类似的使命是一项困难的任务，这也是计算机科学和广义机器学习的一个动态研究特征。在识别图像属性之前，我们可能需要思考一个特定问题：机器是如何存储这种图像的？\n\
  \n准备单一的 0 和 1 是他们现在设计计算机的方式。因此，他们如何在一个具有颜色等各种属性的网络内部中存储这样的图像呢？这种存储的实现是通过包含像素强度的结构完成，即\
  \ `Matrix`（矩阵）。因此，这取决于他们如何处理这个矩阵来识别颜色和其他其他东西。在后端，任何人想在该阶段执行的任何操作都将使用矩阵和线性代数来完成。\n\
  \n### 示例 2\n\n你听过“XGBOOST”这个术语吗？数据科学领域的任何家庭都知道，数据科学竞赛的冠军经常使用算法。为了提供预测，它采用 `Matrix`\
  \ 形式来存储数值数据。这不仅提供了更精确的结果，`XGBOOST` 还能进行更快的数据处理。此外，除了 `XGBOOST`，许多其他算法也利用 `Matrices`\
  \ 进行数据处理和存储。\n\n### 示例 3\n\n作为目前最新的流行词，深度学习使用矩阵来存储输入，包括使用文本、语音或图像对这些问题提供顶级的答案。存储在矩阵中的还包括神经网络训练的权重。\n\
  \n### 示例 4\n\n处理文本是机器学习研究的另一个动态领域，术语-文档矩阵、词袋（words’ bag）等是他们经常使用的技术。同样，为了执行语言翻译、语言生成、语义分析等许多任务，所有这些方法都会存储文档中的单词计数，并在执行任务时以矩阵形式累积这些出现次数。\n\
  \n因此，让我们希望在某种程度上，你对机器学习及其与线性代数的联系有了一些了解。为了使用矩阵进行数据处理和存储，我们知道文本、图像或任何通用数据。现在是时候从顶层体验线性代数了。\n\
  \n## 线性代数问题的表示\n\n我们可能从一个简单的问题开始。假设 1 根球棒和 2 个球的价格为 100 个，等于 2 根球棒和 1 个球。我们现在需要找到球棒和球的价格。假设卢\
  \ `x` 是球的价格，卢 `y` 是球棒的价格。根据情况，任何值都可以是卢 `x` 和 `y` 值，即变量 `y` 和 `x`。在数学中解释这种形式，我们将如下：\n\
  \n(1)………………… `2x + y = 100`\n\n同样，后续条件可能类似于这样：\n\n(2)………………………. `X + 2y = 100`\n\
  \n现在，为了满足这两个方程，我们需要 `y` 和 `x` 的值来找到球和球棒的价格。线性方程组的解寻找 `x` 和 `y` 的值是线性代数的基础问题。大背景是数据在线性代数中以线性方程的形式表示。反，向量和矩阵形式是这些线性方程的表示。根据条件，方程和变量可能会有变化，但它们的形式是向量和矩阵表示。\n\
  \n## 可视化问题\n\n通常，将数据问题可视化非常有帮助，这样做将有助于像这种情况的情况。线性方程是平坦对象的表示。为了对直线有清晰的理解，从最简单的开始可能是一个好主意。满足给定方程的所有点的集合是对应于方程的直线。例如；\n\
  \n我们的方程 (1) 被点 (30, 40)、(50, 0) 和 (0, 100/3, 100/3) 满足。因此，这些线（点所在的线）应该落在我们方程对应的直线\
  \ (1) 上。同样，我们的方程 (2) 包含了其中的一些点：(100/3, 100/3)、(100, 0) 和 (0, 50)。\n\n目前，位于两条线上的点对于同时满足两个条件至关重要。根据直觉，连接点是我们在两条线上需要找到的。可以使用基础代数运算（如减法、加法和代入法）来解决问题。\n\
  \n(1)…………………………. `2x + y = 100`\n\n(2)……………………………..`X + 2y = 100`\n\n(1) 方程是：\n\n\
  `y = (100 – x)/2`\n\n在方程 (2) 中，y 值将是：\n\n(3)…………………………… `x + 2* (100 – x)/2 = 100`\n\
  \n## 复杂化问题\n\n有了三个变量，假设给了三个平面。尝试想象一下，你能看出它的物理表示吗？尝试想象两个变量，同时在任何比较中加入第三个。正如你所知的，它是直线的三维模拟，代表了它代表。事实上，平面的表示是线性方程的三个变量。更准确地说，延伸到无限的平面是一个平坦的几何对象。\n\
  \n这表明我们希望通过寻找三个变量线性方程的解，来发现这些平面在直线情况下的联系。如果你仔细观察，三个平面可以以哪些方式相交？看看这四种情况是否可能：\n\n\
  (4)…………………… `x + y + z = 1`\n\n(5)…………………… `2x + y = 1`\n\n(6)…………………… `5x + 3y\
  \ + 2z = 4`\n\n## 平面\n\n线性方程中的三个变量，其坐标满足方程，代表了所有点的集合。通过这样的方程，你能看出它的物理表示吗？（注：此处检测到冗余文本）\n\
  \n作为目前最新的流行词，深度学习使用矩阵来存储输入，包括使用文本、语音或图像对这些问题提供顶级的答案。存储在矩阵中的还包括神经网络训练的权重。\n\n处理文本是机器学习研究的另一个动态领域，术语-文档矩阵、词袋等是他们经常使用的技术。同样，为了执行语言翻译、语言生成、语义分析等许多任务，所有这些方法都会存储文档中的单词计数，并在执行任务时以矩阵形式累积这些出现次数。\n\
  \n因此，让我们希望在某种程度上，你对机器学习及其与线性代数的联系有了一些了解。为了使用矩阵进行数据处理和存储，我们知道文本、图像或任何通用数据。现在是时候从顶层体验线性代数了。\n\
  \n\n\n\n## 2. 三面相交于一点\n## 3. 线的上的面相交\n## 4. 与平面的相交\n\n大多数超级数学家和我们这样的普通人只能可视化 3 维物体，对于人类来说，可视化\
  \ 4 维（或 10000 维）是复杂且无法实现的。因此，数学家如何能够有效处理高比例的数据呢？他们脑子里有很多窍门，而数学家用来处理更大规模数据的一种策略就是矩阵。\n\
  \n现在，是时候进入重点了：矩阵。\n\n## 矩阵\n\n矩阵是为了便于操作和处理而将相同项目集合在一起写下的过程。在数据科学中，训练多个算法时，矩阵是他们用来积累信息的工具，例如人工神经网络如何存储权重。从技术上讲，对于数据科学而言，二维数字集合就是矩阵。\n\
  \n```\n123\n456\n789\n```\n\n通常，“I”代表行，“J”代表列。第 `I` 行索引第 `J` 列的元素。通过一些像 $A$ 乘以 $B$\
  \ 的字母之类的元素（`Ij`），我们指的是矩阵。\n\n在上面的矩阵中：\n\n`A12` = `2`\n\n沿着第一行到达第二列以得到结果。\n\n###\
  \ 矩阵相关词汇\n\n- **矩阵的阶 (Order of matrix)** – `row*column`，即如果一个矩阵有 3 行 4 列，则该矩阵的阶为\
  \ `3*4`。\n- **方阵 (Square matrix)** – 当列数等于行数时。\n- **对角矩阵 (Diagonal matrix)** – 对角矩阵的非对角线元素均同于\
  \ `0`。\n- **上三角矩阵 (Upper triangular matrix)** – 方阵中对角线下的元素均为 `0`。\n- **下三角矩阵 (Lower\
  \ triangular matrix)** – 方阵中对角线上的元素均为 `0`。\n- **标量矩阵 (Scalar matrix)** – 方阵中对角线元素均等于某个常数\
  \ `k`。\n- **单位矩阵 (Identity matrix)** – 方阵中所有非对角线元素均为 `0`，且所有对角线元素均为 `1`。\n- **列矩阵\
  \ (Column matrix)** – 有时是向量的表示形式，矩阵中只有一列。\n- **行矩阵 (Row matrix)** – 矩阵中只有一行。\n-\
  \ **迹 (Trace)** – 方阵所有对角线元素之和。\n\n# 8. 公司如何利用大数据增加销售\n\n公司以无数方式使用大数据来适应其业务模式，特别是在广告领域。这不仅让他们能够产生更好的报告，还能通过更好的广告提高销售额。\n\
  \n以下是如今公司如何使用大数据以及你如何利用它来提升销量的一些例子。\n\n### 预测客户可能想要购买的产品\n\n你曾多少次查看亚马逊的推荐，你是否曾想并惊讶地发现网站上正好有你正在寻找的东西？许多公司为此目的使用大数据。例如，亚马逊利用大数据来确定你未来具体想买什么类型的产品。\n\
  \n根据《创业者》（Entrepreneur），这家零售巨头——截至 2018 年底净值已达到 `$1 trillion`——向客户提供了决定推荐产品的因素的概述。在这种背景下，亚马逊引用了各种数据来找出客户想要什么。这些因素包括：\n\
  \n- 客户何时购买\n- 客户如何对他们的购买进行评分\n- 具有相同购买习惯的客户在购买什么\n\n涉及到大数据时，最后一个因素是最重要的。亚马逊可以根据购买习惯相似的客户准确判断你想要购买的产品类型。\n\
  \n同样，你也可以使用这类数据来为你的客户做出预测。无论你的业务模式是什么，你需要的都是数据！当你看到销售额增长时，你开始注意到趋势。例如，亚马逊发现买电视的人通常会买一台电视，于是该零售商开始销售电视，希望客户能一起购买（`https://www.entrepreneur.com/article/325923`）。\n\
  \n### 做出更好的商业决策\n\n你可以利用大数据在运营风险上抢先，并做出更好、更高效的决策。在更好的技术出现之前、人们通过互联网连接之前，欺诈问题非常罕见。但现在我们许多人以这种或其他方式连接在一起，业务有时只需几次点击就会受到损害。\n\
  \n运营风险在金融机构中特别得高。欺骗者不断试图开发系统来损害个人和企业。然而，随着大数据的演变，金融机构意识到他们可以使用这些信息防止欺骗者进入。\n\n例如，银行现在正使用大数据监控其“面对面”业务线中的交易，以消除各个层欺诈。他们分析关于谁发送/接收资金、他们参与此类行为的频率、发送了多少钱以及他们住在哪里的信息。\n\
  \n这种技术对任何业务都很有用，不仅仅是银行。随着数据的收集，趋势就会出现，任何偏离“现状”的情况都会触发关于该笔交易的数字记录。这使得公司更容易在欺诈发生时识别出来，并最大限度地降低其运营风险。\n\
  \n### 使用重要数据影响客户行为\n\n由于市场的复杂性，营销运营变得越来越复杂。此外，消费者也变得越来越复杂，他们的行为随时间而变化。仅通过传统的数据来预测消费者行为是非常困难的。大数据对于确定如何在客户访问你的页面时引导他们做出重要决定至关重要。企业使用这些数据来了解客户的行为，并引导他们完成销售或转化。\n\
  \n\n\n\n构建一个稳健的访客画像是良好客户关系管理的一个重要方面。客户是动态的。为了满足客户，你必须伴随他们；你必须了解他们是谁、喜欢什么、他们可能会做什么，以及与谁在一起、买什么或做什么。你需要知道他们在访问你的网站时正在做什么。客户期望更好、更具个性化的营销。毫无疑问，这是一项非常复杂的工作，而且可能枯燥并耗费大量时间。对于这项复杂的任务，你需要的不仅仅是一个漏斗构建器，以一种非常明显且完整的方式。你需要更稳健的东西，能够跟踪用户在网站上访问的页面以及访问的时间，以创建高转化的广告。你不想开始运行过多的广告并等待某些营销信息转化为线索。优化活动、管理着陆页、创建针对性的营销活动以及跟踪网站上的流量来源和事件，更好的方法需要的不仅仅是邮件活动构建器，不仅仅是创建页面。这个过程涉及到对大量数据的分析，通过大数据可以轻松解决。\n\
  \n作为一名创业者，你可以利用这些数据在客户需要的时候提供他们想要的东西。例如，如果你正在运营一个营销网站，客户正在访问你的网站阅读文章，大数据可以预测读者何时点击“X”关闭窗口。大数据也被用于数字营销，通过输入客户数据（访客）来增加邮件列表人数。\n\
