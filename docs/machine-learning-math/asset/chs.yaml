  \n# 9. 什么是监督机器学习\n\n本指南已经花了一些时间介绍了机器学习的一些构建模块和其他基础知识，以及为什么学习如何与其协作工作是一件很棒的事情。现在我们已经对其有了了解，是时候处理监督机器学习的一些核心内容了，以及我们如何利用这些内容从这些监督学习算法中获得我们想要的结果。\n\
