  \n（此处省略重复的定义部分，直接进入核心算法说明）\n\n决策树可以帮助你切分数据集并做出决策。它们通常用于分类问题。\n\n## 随机森林\n\n下一种你能够使用的学习算法是随机森林。在很多时候，决策树对你效果很好，但在某些时候你可能想让它有所不同，随机森林将是正确的选择。\n\
  \n\n\n\n这是你可能希望选择随机森林而不是决策树的时刻之一，并且需要了解在何时使用这些不同的学习算法。程序员可能想要使用随机森林的某些示例包括：\n\n\
  - 当你正在处理自己的训练集时，你会发现集合中的所有对象都是随机生成的，而且如果你的随机树认为这样做是必要的且对你的需求更好，那么就可以对它们进行替换。\n-\
  \ 如果有 `M` 个输入变量数量，那么从开始就会指定 `m<M`，并将其作为常数保持。这之所以非常重要，是因为这意味着你拥有的每棵树都是通过 `M` 从它们自己的变量中随机选出的。\n\
  - 你的每棵随机树的目标将是为变量 `m` 找到最佳拆分点。\n- 随着树的生长，所有的树都将尽可能地变大。记住，这些随机树是不会进行剪枝的。\n- 从随机树创建的森林可能是棒的，因为它在预测某些结果方面要好得多。它能够做到这一点，因为它将获取你创建的每棵树的所有预测结果，然后对于回归任务选择平均值，或者在分类期间获取共识。\n\
  \n这些随机森林将成为你在数据科学各个部分中多次使用的工具，这使得它们与其他选项相比非常有优势。首先，这些算法能够处理你所关注的任何类型的问题，无论是回归问题还是分类问题。你在本指南中遇到的大多数其他学习算法只能处理一种类型的问题，而不是所有问题。\n\
  \n这些随机森林的另一个优点是，它们将帮助你处理海量数据。如果你的业务有很多不同的点需要你处理和组织，那么随机森林是你至少需要考虑的算法之一。\n\n然而，使用随机森林也有一个局限性，这就是为什么你无法将它用于你想要承担的所有问题。例如，这种方法可以像我们之前讨论的那样与回归问题一起工作，但它们将无法做出任何超出你添加到训练数据中的范围的预测。当然，你可以得到一些预测，但这些预测最终将变得局限。它将在你提供的范围内停止，从而降低该区域的准确性。\n\
  \n## KNN 算法\n\n我们将查看的学习算法列表中的下一个是 K-近邻，或 `KNN` 算法。这在监督机器学习中被广泛使用，所以我们花时间在这里看它是的。当你使用\
  \ `KNN` 算法时，你将使用它来帮助处理大量数据并进行搜索。其目标是对于你想要处理的任何数据实例找到 `k` 个最相似的示例。当你妥的方式将这一切组织好后，这个\
  \ `KNN` 算法将能够查看该组数据，并在使用这些结果做出你所需的正确预测之前对结果进行总结。\n\n许多企业将使用这种模型来帮助他们在行业中通过他们所做的学习变得更具竞争力。这之所以行得通，是因为该模型中会有几个元素相互竞争。最终在其中获胜的元素将是让你最成功的方式，并让你获得对你工作最有效的预测。\n\
  \n与现有的其他两种学习算法相比，这种会稍微不同。事实上，一些程序员会将此视为一种比较“懒惰”的学习过程，因为除非你运行并要求它进行新的预测，否则它无法真正创建任何模型。但如果你希望保持模型中的信息具有相关性，或者对你添加到模型中的内容有更多话语权，这对某些项目来说是一件好事，但在其他情况下，它可能没那么帮助。\n\
  \n使用 `KNN` 学习算法有很多益处。例如，当你选择使用这种算法时，你可以学习如何过滤掉有时出现在数据集中的噪声。这种方法之所以有效，是因为它将完全通过竞争的方法来帮助筛选所有数据，以期找到最理想的内容。这种算法很有用，因为它可以同时接收大量数据，甚至更大量的数据，在许多不同情况下都很有用。\n\
  \n然而，当涉及到这种算法时，你需要考虑一些条件。最大的问题是计算成本很高，特别是当你将其与其他某些学习算法进行比较时。这是因为 `KNN` 在向你发送预测之前将查看所有的点。这在总体上花费了大量的时间和金，可能不是你想要使用的算法。\n\
  \n## 回归算法\n\n列表上的下一个是回归算法。你可以使用它，因为它是一种你可以在其中调查因变量与你喜欢的预测变量之间关系的类型。每当你发现你所做的预测、时间序列建模以及所有变量之间存在因果关系时，你就想要使用这些算法。\n\
  \n你会发现，当你想要尽可能地拟合一条直线或曲线时，这是可能的。这有助于你真正看到这些数据点之间是否存在某些共同因素，以便你可以学习数据并可能进行一些预测。\n\
  \n\n\n\n\n# 引言\n\n在这一章中，我们将透过钥匙孔窥向另一侧……我们将从日常理智且合理的世界跨越边界，进入数据科学家那扭曲的多维领域；即那些拥有数学学位和博士学位的的技术专家。在旅程中，我们将：\n\
  \n* 描述数据科学家在应用机器学习开发预测模型时应遵循的流程，这些模型将作为自动化决策系统的一部分，用以驱动业务收益。\n* 以一种普通人也能听懂的方式来解释这一过程。这有助于你随时掌握数据科学家在做什么。反过来，这也确保了你获得的是你所要求的，而不是数据科学家认为你的组织需要的东西。\n\
  \n根据我的经验，当数据科学家被放任“自己去忙”，并在项目结束时交付结果作为“致命一击”（coup de grace）时，交付的往往是次优解决方案。在最糟糕的情况下，他们可能无法交付任何有用的东西。\n\
  \n我合作过的大多数数据科学家非常清楚需要让客户参与到机器学习过程中，并为项目获取业务投入付出了努力。然而，遗憾的是，我也见过过不止一个案例，即数据科学家刻意用技术术语来迷惑普通人，或者完全避免与他们交流。这样做是为了让他们能够专注于重要的数学工作，而不必去应付那些每天必须负责运营组织的“愚蠢的笨蛋”。\n\
  \n一个简单的规则是：如果数据科学家无法向你解释他们做了什么以及为什么这么做，那么他们就没有完成任务。他们还需要让业务部门清楚地理解他们工作的收益是什么。作为一个业务用户，我对于一个预测模型的准确率为\
  \ 95%，且它比它要取代的流程判别性高出 10%并不感兴趣。我想知道的是它能为我赚多少钱，能救多少人的命，能让我减少多少员工，或者其他信息。如果一个数据科学家无法根据为客户底线提供的收益来表达其的价值，那就是一个糟糕的数据科学家。\n\
  \n然而，这是双向的，把所有责任都推在数据科学家身上是不公平的。要求业务用户努力理解数据科学家如何进行机器学习过程，这并不是过分的要求。随着项目的进展，应该进行双向的信息交换，并定期召开会议，以非技术性的、以业务为中心的方式展示并讨论初步发现、结果、问题和挑战。这将引导项目的推进。\n\
  \n考虑到这些，我将避免深入探讨用于机器学习的各种算法的数学原理，例如用于训练神经网络或决定决策树划分方式的算法。对于那些对技术细节感兴趣的读者，机器学习中最常用的算法都有非常详尽的文档（参见附录\
  \ B 中的推荐书籍和网站）。同样，这些算法的实现在现在你可以购买的商业统计软件包中，或者通过开源软件免费获得（例如 `R` 和 `Python` 代码库）。因此，你不需要知道如何编写特定的机器学习算法；你只需要知道如何在你所选的软件包中调用相关的函数或过程即可。\n\
  \n## 机器学习流程\n\n数据科学家需要做的第一件事是量化业务问题问题；即将业务试图实现的目标表示为一个简单的数字或分数。零售店的销售总监可能会这样开始与数据科学家的会话：\n\
  \n“我们需要一个预测模型来识别我们的优质客户。”\n\n所以，要问的第一个问题是：\n\n“你说的‘优质’是什么意思？”\n\n销售总监回答道：\n\n“对我们的业务做出财务贡献最大的客户。”\n\
  \n好的，这看起来很合理，但“财务贡献”是指总销售额还是净利润？我们讨论的是每次进店、每次点击，还是每个单位时间（周/月/年）的贡献？当我们谈论“客户”时，我们看的是个人还是家庭的贡献？问题以此类推。数据科学家需要梳理出业务所要求的精确定义，然后用可以用他们构建的模型所生成的分数来表示的方式表达出来。\n\
  \n在这个例子中，可能在与营销总监讨论后，达成共识将模型设计为预测个人每季度的总支出。选择季度总支出是因为这个定义与组织的报告周期相符，且总收入（支出总和）是销售总监的关键绩效指标。\n\
  \n选择个人支出而非家庭支出，是因为双方达成共识：尽管从理论上讲家庭支出更好，但组织的客户数据库是以个人而非家庭为级别构建的。在组织目前的 IT 基础设施限制范围内，无法部署基于家庭支出的模型。IT\
  \ 设施可以升级以提供家庭视图吗？不，绝对不能，不能作为该项目的一部分，因为业务部门今年没有为 IT 变动分配任何预算。\n\n基于这些信息，数据科学家应该确定这是一个回归类型的问题，用于预测每个个人客户在三个月预测期内的支出金额。\n\
  \n在确定如何量化表达业务目标的同时，数据科学家还需要进行探索性分析，以了解组织的数据和 IT 资产、它们是如何运作的以及它们是如何相互作用的。这包括：\n\n\
  * 组织拥有哪些数据库？\n* 每个数据库的目的是什么？哪些业务流程使用了它们？\n* 数据库中包含什么？即包含哪些数据项以及这些数据项的格式。例如，是数值数据还是文本数据。\n\
  * 每个数据库是如何更新和维护的？大多数组织拥有“实时”客户数据库（在发生变化时立即更新）和批处理数据库（更新频率较低；例如在夜间或月底）。\n* 已经部署了哪些决策系统？模型将实现在现有系统中，还是需要新功能？\n\
  * 组织目前使用哪些数据进行决策？即使这些数据用于一个过时的手动流程，这些数据对于机器学习目的也可能极具价值。\n\n在理想世界中，组织拥有完善的文档（元数据），提供数据资产的清单，包括数据类型、数据格式及其来源。然而，在实践中，这类信息往往是不完整的、错误的或过时的。许多有用信息存储在业务用户的脑中，他们作为日常工作的一部分经常使用它们。可能会有一个名为\
  \ `客户人口统计 3` 的数据项，包含字母 `A`、`B....G`。这到底意味着什么？哪里都没有记录，但运营部的 Claire 知道这与他们使用的收入等级匹配。`A`\
  \ 代表年收入低于 20,000 美元，`B` 代表 20,000-35,000 美元，以此类推。\n\n\n\n\n\n许多组织还保留着他们已不再理解的数据。然而，他们害怕删除这些数据，万一它们是某些关键业务流程所依赖的重要信息呢。在探索性分析阶段，还应该检查内部和外部的潜在新数据源，因为这些数据可能会增强任何开发模型的预测能力。\n\
  \n总而言之，需要投入大量精力来探索可以收集数据的“宇宙”，并决定哪些数据可能被使用，哪些又不能使用。\n\n一旦数据科学家对组织拥有的数据以及其结构有了良好的理解，他们就可以进入\
  \ `Stage 3`，考虑创建将用于机器学习过程的开发样本。\n\n为业务构建预测模型的一种非常天真的方法，仅仅是将组织拥有的每一条信息都直接丢进机器学习过程中。在实践中，许多数据是过时的、不稳定的或在其他方面是不合适的。因此，应该将这些数据从开发样本中排除，以防它们降低机器学习过程的性能。\n\
  \n从机器学习过程中排除某些数据的常见典型原因包括：\n\n-   **过时的数据。** 如果数据与当今的世界不再相关，那么就不要考虑它。关于智能手机出现之前人们如何使用手机手机的数据，对于告诉你今天智能手机的使用情况将没有太大帮助。\n\
  -   **不代表目标总体。** 开发样本应仅包含与模型将要应用的总体镜像的案例。如果一个收入模型是专门为在线客户开发的，而这两个渠道的消费模式不同，那么你应该排除门店交易记录。同样，如果你从声音样本中开发语音识别系统，那么所有样本都应该与语音有关。如果你有狗叫声或交通噪音的示例，那么这些需要被移除。\n\
  -   **数据的稳定性。** 机器学习过程中使用的数据在模型应用时是否可用？如果某个数据项在实施点上是不可用的，那么它应该被排除在外。\n-   **法律和伦理原因。**\
  \ 你是否想使用如种族、性别和性取向等敏感个人数据？这类数据可能极具预测性，但使用它们可能是非法的。如果它是合法的，但一旦你对待某些群体的方式与其他不同被为人知，那么使用此类数据可能会产生声誉风险。如果基于模型评分的折扣策略导致你只对异性恋男性提供折扣——那很可能会引起争议。\n\
  -   **确定性案例。** 如果你对某些客户非常确定地知道将如何对待他们，那么你就不需要为他们建立预测模型。将他们包含在开发样本中只会削弱模型在其余总体上衡量的效力。\n\
  -   **不可解释性。** 机器学习的一个基本原则是，在使用你不完全理解的数据构建模型时，应该非常谨慎。这对于受行业监管的模型或对组织的成功具有战略意义的模型来说，尤其尤为真实。如果数据科学家向你展示了一个使用他们无法解释的数据的模型，那么这就是你应该关注的风险。\n\
  \n如果一个组织拥有巨大的数据库，那么在作为机器学习过程的一部分来分析这些数据库时，计算机资源方面可能会出现问题。只选择样本（例如 `1:10` 或 `1:100`\
  \ 的案例）纳入开发样本的情况并不并不罕见。“大数据纯粹主义者”可能会认为，你应该分析所有可用数据，因为未能这样做可能会遗漏某些微妙的模式，从而创建出次优的模型。在某种意义上他们是正确的，因为如果你采用样本而不是使用整个总体，生成的模型准确性不会那么高。然而，这在很大程度上是一个收益递减的过程。对于几乎所有的实际业务问题，增加几万个案例带来的收益是微乎其微的。如果你以适当的方式进行采样，那么你从使用\
  \ `100,000` 个案例开发的模型中将获得使用 `1000 万` 个案例模型 `99%` 的收益。换句话说，仅仅因为你有海量数据并不意味着你需要投资专业的硬件/软件来应用机器学习——你只需要在执行上足够聪明，并专注于真正重要的数据。\n\
  \n该过程的第四阶段是数据准备。这是必要的，因为原始数据可能格式糟糕、包含错误，或者没有提供数据的最佳表示；即不同的表示将使机器学习过程更容易发现数据中的重要模式。在数据准备期间有四项主要任务：\n\
  \n-   **创建新数据。** 对于大多数类型的问题，`Age` 比 `Date of Birth` 更具预测性。因此，如果只有 `Date of Birth`，则可能需要计算\
  \ `age`。同样，如果你有信用卡交易数据，最好是创建汇总变量，代表每笔交易的平均支出、上个月的交易次数、距离上次交易的时间等。\n-   **数据清洗。**\
  \ 数据可能缺失或不正确。数据准备的一个关键目的是识别此类数据存在于何，并将其移除（排除）或对其进行重新格式化；即用标准值对所有数据进行重新编码。如果用于计算年龄的出生日期在未来或在过去遥遥的过去，你可能想为年龄定义一个例如\
  \ `-1` 的默认值来表示这些情况。\n-   **合并。** 以相似的方式表示相似的数据是一项良好的做法。如果你有一个名为 `property type`\
  \ 的数据项，其中 `D`、`Det` 和 `Detached` 的值都相同相同；即都是 `Detached`（独立屋），那么这些应该合并为一个单一值，用于代表所有\
  \ `Detached` 案例。\n-   **转换为数值。** 机器学习算法喜欢数值数据。`Yes`/`No`/`Maybe` 将被转换为 `0/1/2` 标记。对于复杂的文本或语音（如推特流），一种方法是包含标记以指示某些词是否出现，或者生成某些词出现次数的计数。\n\
  \n一旦准备好合适的数据样本，就该进行数据预处理和初步变量选择了（`Figure 9` 中的 `Stage 5`）。通过数据预处理，你是将数据转化为一种最有利于所选机器学习算法的格式。\n\
  \n预处理通常涉及两个过程：标准化和转换。标准化过程通过缩放数据使所有数据具有相似的值。如果你有两个数据项，如 `gross annual income` 和\
  \ `height in metres`，那么标准化的一种方法是减去各自的平均值，然后除以范围（或其他衡量标准）。这样，两者都将以零为中心，并具有大致相似的范围。\n\
  \n\n\n\n\n\n# 数据预处理\n\n在这里，我们将开始查看的第一项可以帮助我们开始学习机器学习相关内容就是数据预处理。在进行任何机器学习工作之前，你必须确保你正在处理的任何数据都处于正确的格式。将数据转换为正确的格式以便进行机器学习工作，就被称为数据预处理。\n\
  \n现在，这取决于你想要处理的数据类型，但为了帮助你看到预处理工作的良好运行，通常需要执行几个步骤。这些步骤对于后续工作来说至关重要，因为它们将确保数据以正确的形式被使用。在此部分你应该关注的步骤包括：\n\
  \n* 获取数据集\n* 导入你的库\n* 导入数据集\n* 处理任何缺失值\n* 处理分类数据\n* 将数据划分为不同的训练集和测试集\n* 缩放数据\n\n\
  让我们仔细查看这些中的每一个项，以及它们如何协同工作以正确地准备你的数据。\n\n## 获取数据集\n\n现在，我们需要花一点时间来看这组数据。当我们查看时，开始注意到其中有很多关于手头患者年龄、性别和\
  \ `BMI` 的信息。该数据集还包含一个额外列，显示我们观察的患者是否患有糖尿病。你应该注意到，年龄和 `BMI` 列将是数值型的，而另外两列在本质上是分类的。\n\
  \n在这里我们需要做的另一个区分是因变量和自变量之间的区别。当我们观察这些变量时，值被预测的变量作为因变量，而用于做出这些预测的变量将成为我们的自变量。当我们看这类例子时，`diabetic`\
  \ 列将被视为因变量，因为它至少在某种程度上依赖于其他列。我们会注意到其他列将是我们的自变量。\n\n## 导入你需要的库\n\n现在你已经有了一些开始此工作所需的数据，你需要着导入库。Python\
  \ 自动带了一些可以执行各种任务的预构建库。出于本书的考虑，我们将使用 `Scikit-Learn` 库。为了简单起见，我们将安装三个对帮助我们进行机器学习最重要的库。这些包括\
  \ `numpy`、`matplotlib.pyplot` 和 `pandas`。\n\n首先是 `numpy` 库。这是一个非常值得下载的库，它可以帮助你完成一些复杂的数学函数。由于机器学习确实花费大量时间在数学领域，值得花时间确保这个特定的库已就绪。\n\
  \n你想要查看的下一个库是 `matplotlib.pyplot` 库。这是另一个经常使用的优秀库，因为它有助于处理任何想要制作的图表。通常，当你查看用于机器学习所需的数据时，拥有这个库是有帮助的。它至少能让你对数据点以及它们在图表上的位置有一个良好的了解。\n\
  \n我们还需要花时间下载 `Pandas` 库。这个也很重要，你会发现它非常易用。很多时候，程序员能够使用它来导入和查看他们想要用于机器学习的任何数据集。\n\n\
  如果你想导入这些库，你需要在 Jupyter 中创建一个新的 Python 笔记本。为了帮助我们开始这项工作，我们需要使用下面的代码：\n\n```python\n\
  import numpy as np\nimport matplotlib.pyplot as plt\nimport pandas as pd\n```\n\n\
  ## 导入你需要的数据集\n\n一旦你成功导入了库，现在是查看步骤了。我们需要的数据集将是逗号分隔值，即 `csv` 格式。pandas 库内部包含 `read_csv`\
  \ 函数，它将接收文件路径并加载行和列集。为了帮助我们实现这一点，我们使用以下代码：\n\n```python\npatient_data = pd.read_csv(\"\
  D:/Datasets/patients.csv\")\n```\n\n如果你正在使用 Jupyter notebook，这样做会更简单。你只需要使用以下脚本来查看数据：\n\
  \n```python\npatient_data.head()\n```\n\n但是，如果你在用 Spyder，你需要进入变量资源器（Variable explorer），然后双击\
  \ `patient_data` 变量。一旦点击了它，你就能看到所有的细节。\n\n## 划分数据\n\n当我们到达流程的这一步时，下一步是将数据集划分为特征矩阵和因变量向量。特征集将包含所有你认为是独立的变量。\n\
  \n例如，`patients.csv` 数据集的特征矩阵将包含你为年龄、`BMI` 和性别放置的信息。此外，你在特征矩阵中看到的大小将等于自变量的数量乘以记录的数量。对于这个例子来说，我们的矩阵最终将是三乘十二。这是因为我们有三个自变量和十二位我们要观察的带有记录的患者。\n\
  \n为了帮助我们开始这项工作，我们首先需要遍历并创建特征。你可以为它提供任何喜欢的名称，但传统的做法方法是使用大写的 `X`。为了让我们有更好的机会阅读代码，我们将其命名为\
  \ `features`，然后使用下面的脚本：\n\n```python\nfeatures = patient_data.iloc[:,0:3].values\n\
  ```\n\n通过我们上面使用的脚本，数据框的 `iloc` 函数用于帮助从 `patient_data` 中选择所有行以及前三列。这个 `iloc` 函数将接受两个参数：第一个是选择选择的行范围，第二部分是你想让程序选择的列范围。\n\
  \n如果你想从这里创建自己的标签向量，你可以使用以下脚本来完成：\n\n```python\nlabels = patient_data.iloc[:3].values\n\
  ```\n\n\n\n\n\n如果你现在停止并查看标记为 `patient_data` 的对象，你会发现该患者的 `BMI` 列在索引 `4` 处缺少了一条记录。为了帮助我们能够处理值缺失的情况，最简单的方法是找到一种删除掉缺失值记录的方法。然而，这条记录也可能包含一些我们需要关注的关键信息，因此你有时可能希望将其保留在那里。\n\
  \n你可以使用的另一种帮助处理这些缺失值的选项，是添加某种类型的数值或字符，以替换缺失的值。通常我们发现，替换该值的最佳选择是该列中所有其他存在值的平均值或中位数。为了帮助你在缺失值出现时对其进行处理，你只需要使用\
  \ `sklearn.preprocessing` 库中找到 `Imputer` 类。你需要确保实现这一操作的脚本如下所示：\n\n```python\nfrom\
  \ sklearn.preprocessing import Imputer \n\nimputer = Imputer(missing_values=\"Nan\"\
  , strategy=\"mean\", axis =0) \n\nimputer = Imputer.fit(features[:,1:2]) \n\nfeatures[:,1:2]\
  \ = imputer.transform(features[:,1:2]) \n```\n\n在我们上面写的脚本中，第一行负责从正确的库中导入 `Imputer`\
  \ 类。接着我们创建了 `Imputer` 类的对象。它将接受三个参数，包括 `axis`、`strategy` 和 `missing_value`。在 `missing_value`\
  \ 参数方面，我们指定了我们想要替换的值。在我们的数据集中，缺失值由“nan”表示。`strategy` 参数将指定我们用于填充此缺失值时使用的策略类型。你也可以从\
  \ `most-frequent`（最频繁）、`median`（中位数）和 `mean`（平均值）中进行选择。然后 `axis` 参数将指示我们在这里对哪个轴进行插补。\n\
  \n## 处理我们的任何分类数据\n\n现在我们知道，我们在机器学习中可能使用的算法在很多情况下是基于数学概念的，为了处理这些数学问题，我们需要能够处理数字。正由于这类问题，对分类值进行工作然后将它们转换为数值对我们来说将变得更加方便。当我们查看这里正在进行的示例时，我们看到有两个被视为分类的值，即\
  \ `gender`（性别）和 `diabetic`（糖尿病）选项。我们如何将 `Male`（男性）、`Female`（女性）以及 `Yes`（是）和 `No`（否）转换为数值来让事情变得更容易呢？\n\
  \n好消息是，在 `sklearn.preprocessing` 库中，有一个 `LabelEncoder` 类，它将获取你的分类列并给你正确的数值输出，使其具有意义。你可以用于此的脚本包含：\n\
  \n```python\nfrom sklearn.preprocessing import LabelEncoder \n\nlabelencoder_features\
  \ = LabelEncoder() \n\nfeatures[:,2] = labelencoder_features.fit_transform(features[:,2])\
  \ \n```\n\n就像我们对 `Imputer` 类所做的那样，`LabelEncoder` 类将有一个 `fit_transform` 方法，它只是 `transform`\
  \ 和 `fit` 方法的组合。该类能够接受你拥有的分类列作为输入，然后返回正确的数值来帮助你。此外，你始终可以获取标签向量并如下方式将其转换为一组数值：\n\n\
  ```python\nlabels = labelencoder_features.fit_transform(labels) \n```\n\n## 你的训练集\
  \ vs. 你的测试集\n\n我们需要查看的下一步是训练集和测试集。在你进行机器学习工作时，这是两个非常重要的事情。能够以智能的方式分离你拥有的值，对这项工作整体将产生最大的影响。\n\
  \n这种测试集和训练集的划分是为了确保你任何用于机器学习的算法都不会出现过拟合并尝试过度用力，从而搞乱你获得的数据。当我们谈论过拟合这个概念时，我们看的是机器学习的一种倾向：它在训练数据上给出的结果良好，但在处理测试数据时最终给出了糟糕的结果。\n\
  \n在机器学习工作中，你可以信赖的良好模型是那种在训练数据和测试数据这两个方面都能给你提供良好结果的模型。通过此，我们可以说我们选择的模型正确地学习了从我们数据集中所有的底层假设，然后我们能够准确地使用它，在我们决定要使用的任何新数据集中做出我们所需的决策。\n\
  \n为了形象地了解这将如何运作，让我们看看下面使用的脚本。该脚本将帮助我们把数据分为 75%的训练集大小，其余部分作为测试集大小。\n\n```python\n\
  from sklearn.model_selection import train_test_split \n\ntrain_features, test_features,\
  \ train_labels, test_labels = train_test_split(features, labels, test_size = 0.25,\
  \ random_state = 0) \n```\n\n当你执行上面的脚本时，你会看到 `train_features` 变量将包含一个具有 9 个特征的矩阵（因为这是\
  \ 75%），而 `train_labels` 将包含标签。然而，对于 `test_features`，你将拥有剩余特征，而 `test_labels` 将拥有标签。\n\
  \n## 缩放我们拥有的数据\n\n现在我们到达了流程这一部分时，我们需要查看的最后一件事。我们需要查看在将任何数据放入机器学习算法时，为了缩放这些数据所需的步骤。了解关于缩放（Scaling）的所有知识是非常重要的，因为某些数据集的特征值之间将存在巨大的差异。\n\
  \n例如，如果我们决定在此处添加一个关于患者红细胞数量的新列，那么这些数字可能是几十万（除非患者非常严重），而年龄列可能甚至达不到 100。你在机器学习中使用的许多模型都会使用所谓的“欧几里得距离”来帮助我们找到你正在观察的数据点之间的距离。\n\
  \n好消息是，`sklearn.preprocessing` 库包含一个名为 `StandardScaler` 的类，你可以用它来实现标准化特征。与其他预处理类一样，它也包含我们之前提到的\
  \ `fit_transform`，它将接受你提供的数据集作为输入，然后输出缩放后的集合。以下脚本将为你完成这一操作。\n\n```python\nfrom sklearn.preprocessing\
  \ import StandardScaler \n\nfeature_scaler = StandardScaler() \n\ntrain_features\
  \ = feature_scaler.fit_transform(train_features) \n\ntest_features = feature_scaler.transform(test_features)\
  \ \n```\n\n需要注意的是，在你的任何分类问题中，你并不需要缩放标签。对于回归问题，我们将查看如何在回归部分缩放标签。\n\n\n\n\n首先，我们需要定义机器人。它们是机器，通常可以通过计算机进行编程，能够在没有人工干预的情况下执行一系列复杂动作。机器人的控制系统可以是嵌入式的，也可以由外部设备控制。在流行文学和电影中，许多机器人被设计成人类的形象，但事实上，它们通常是为了执行某项任务而设计的，而这种需求决定了它们的外观。\n\
  \n机器人与我们相处的时间几乎和计算机一样长了。乔治·德沃尔（George Devol）在 1954 年发明了第一台通过数字操作且可编程的机器人，称为`Unimate`。1961\
  \ 年，通用汽车购买了它，用于抬运热金属铸件。就像计算机一样，机器人也改变了我们的社会。它们力量、灵敏性以及持续完美执行相同重复任务的能力被证明是巨大的益处。尽管它们确实对制造业造成了一些严严重的动荡，导致许多人失业，但它们在人类社会中的崛起提供的就业机会远比它们夺取的要多得多。\n\
  \n目前使用的机器人可以分为几类：\n\n## 工业机器人/服务机器人\n\n这些机器人可能很熟悉了。你可能在电视或自动化工厂的流媒体视频中见过它们。它们通常由带有一个或多个关节的“手臂”组成，末端是一个抓取器或机械装置。它们最早在汽车工厂中流行起来。它们被固定在一个位置，无法移动。工业机器人出现在制造业和工业场所。服务机器人的设计与工业机器人基本相同，但出现在制造领域之外。\n\
  \n## 教育机器人\n\n这些机器人被用作教学工具或本身用于教育目的。早在在 20 世纪 80 年代，机器人就随着小龟（turtles）进入教室，学生在教室可以使用`Lego`编程语言对其进行训练。市场上也有供购买的机器人套件，如`Lego\
  \ Mindstorm`。\n\n## 模块化机器人\n\n模块化机器人由几个共同工作的独立单元组成。它们可以是相同的，也可以在设计上有一个或多个变化。模块化机器人可以连接在一起形成允许它们执行任务的形状。模块化机器人系统的编程无疑比单个机器人复杂得多，但许多大学和企业环境中的持续研究正在证明，这种设计方法对于许多应用类型优于单一大型机器人。当与`Swarm\
  \ Intelligence`（见下文）结合时，模块化机器人被证明能够非常擅长创造性的问题解决。\n\n## 协作机器人\n\n协作机器人设计用于与人类共同工作。它们大部分是工业机器人，包含了安全功能，以确保它们在执行指派任务时不会伤害任何人。这种协作机器人的绝佳例子是`Baxter`。`Baxter`于\
  \ 2012 年，是一种工业机器人，设计用于编程以完成简单任务，但它能够感知自己何时与人类发生接触并停止移动。\n\n当然，上述所有示例都不需要任何人工智能。当机器人与机器学习结合时，研究人员使用术语“机器人学习”（Robotic\
  \ Learning）。这一领域在至少四个重要领域具有当代影响：\n\n### 视觉\n\n`Machine Learning`让机器人能够从视觉上感知其周围的环境，并理解它们所看到的内容。无需预先向机器人程序设定它正在看什么，新物品就可以被理解和分类。\n\
