  md: '# Machine Learning for Social and Behavioral Research


    # 1.6.5 Holzinger-Swineford


    The Holzinger–Swineford (Holzinger & Swineford, 1939) dataset is a part of the
    lavaan package and is a classic dataset to illustrate the use of factor analysis
    and structural equation models. The dataset includes 301 observations. Our focus
    is on the nine cognitive scales (X1-X9), each of which was assessed on seventh-
    and eighth-grade children across two schools.


    # 1.6.6 PHE Exposure


    The data comes from the Maternal PKU Collaborative Study (Koch et al., 2003).
    The study started in 1984 with the monitoring the pregnancies of women with phenylketonuria
    (PKU), which is a genetic metabolic defect that disrupts the metabolism of phenylalanine
    (PHE) into tyrosine. These data are only used for a simple demonstration in Chapter
    3, which uses the variables full-scale IQ and PHE in milligrams per deciliter.
    For additional detail see Widiman and Grimm (2013).


    # 1.6.7 Professor Ratings


    The set includes 27,939 teaching evaluations on a total of 999 professors that
    were scraped from an online website conforming to the site requirements. The dataset
    has five variables/columns. The first variable is the unique id of each evaluation.
    The second variable is the unique id of the professors. The third variable is
    the numerical rating of a professor from 1 to 5 indicating *worst* to *best* in
    response to a question “How would you rate this professor as an instructor?” The
    fourth variable is a response to the question “How hard did you have to work for
    this class?” with a score of 1 indicating *least* hard and 5 indicating *hardest*.
    The last variable is the response to an open-ended question prompting individuals
    to write about their overall experience in the class.'
