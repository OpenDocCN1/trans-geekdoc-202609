- pgno: 7
  md: '# Series Editor’s Note


    As a fellow social and behavioral science researcher, we work in a massively multivariate
    world. Large-scale data collection is widespread. Finding structure and revealing
    relationships among the vast number of variables is a challenging goal to achieve.
    Adding the principles and techniques of machine learning to your toolbox will
    aid in overcoming the challenges; moreover, this book covers techniques that are
    applicable to univariate outcomes with multiple predictors (e.g., decision trees,
    regularized regression). Unlike books on machine learning that come from a computer
    science perspective, Jacobucci, Grimm, and Zhang bring a social and behavioral
    sciences perspective to machine learning techniques that are decidedly underutilized
    in our fields. This dream team of authors walks you through numerous real-world
    data examples from fields spanning clinical, cognitive, educational, health, and
    personality sciences.


    Given that theory is an analyst’s best friend, these authors emphasize the critical
    interplay between theory and data that is the hallmark of techniques such as structural
    equation modeling. The authors expand this theory—data interplay by adding and
    expanding the algorithms that can be utilized beyond the likelihood and Bayesian
    algorithms that we are quite accustomed to using. Quite importantly, they bring
    this traditional background to connect new ideas with traditional statistics principles
    and practices. In their chapters on multivariate machine learning algorithms,
    they cover various techniques such as factor analysis (and principal components
    analysis), structural equation modeling, mixed-effects modeling, and finite mixture
    modeling, as well as alternative data types (i.e., text analysis and social networks).


    One cool feature of this book is that the authors open each chapter with key terms
    and definitions to foreshadow the concepts that they cover and offer thoughtful
    readings at the end of each chapter as well as a computational time section at
    the end of the practice chapters. They rely on a broad selection of data examples
    throughout, spanning early-childhood learning, to Big personality traits, to drug
    use and the like. After explaining and then providing easy-to-follow examples,
    which you can emulate for your own methods and results sections, the authors provide
    coding examples (and all the R code is available on the companion website).'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Unlike most approaches to machine learning, Jacobucci, Grimm, and Zhang emphasize
    the critical need to correct for measurement error. When measurement error is
    not trivial (and it rarely is), it will wreak havoc on the validity of any findings.
    Error correction and techniques to ensure the validity of the findings are essential
    features of any advanced modeling technique. The authors offer best-practice advice
    and procedures for accomplishing these features for the various algorithms they
    cover.


    As mentioned in the preface, this work was inspired by the late Jack McArdle.
    Jack was a quintessential scientist and a kindhearted person. His seminal contributions
    to the literature as well as his generative sharing of his ideas have shaped the
    entire field of quantitative methodology. Jack is sorely missed but his influence
    remains tangible, such as the existence of this book.


    All the material is presented in an engaging and highly accessible manner. From
    graduate students to seasoned veterans, *Machine Learning for Social and Behavioral
    Research* will be a staple reference work for you to tackle the challenges of
    modeling data from this massively multivariate world. As always, enjoy!


    TODD D. LITTLE

    ubbock, Texas'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Preface


    Over the past 20 years, there has been an incredible change in the size, structure,
    and types of data collected in the social and behavioral sciences. Thus, social
    and behavioral researchers have increasingly been asking the question “What do
    I do with all of this data?” The goal of this book is to help answer that question.


    With advances in data collection, there has been a corresponding expansion in
    the understanding of the complexity underlying the relationships between variables.
    Nonlinear effects and interactions are now regularly posed as hypotheses, aided
    by larger sample sizes that afford adequate statistical power. Further, predicting
    an outcome with only a few covariates of interest, is now recognized as severely
    limiting. While this approach was common in the past, due to smaller dataset sizes
    and statistical limitations, computer-assisted data collection and new software
    have helped overcome such challenges.


    In the past, particularly in academic research, certain types of data were only
    analyzed with specific types of statistical models such as analysis of variance
    (ANOVA) and linear regression, which were closely aligned with the theoretical
    motivation underlying the study. However, the advent of novel data collection
    methods has resulted in new types of data (e.g., text, extracted from sources
    (e.g., brain imaging, social network), as well as larger collections of traditional
    survey data. As a result, there is incredible degree of flexibility in the choice
    of algorithms. This modern statistical applications, as researchers and practitioners
    have to contend with an additional dimension, specifically, “Which algorithm or
    algorithms should I apply?” and “How does this algorithm align with the theoretical
    motivations of my study?”


    It is our viewpoint that in social and behavioral research, to answer the question
    “What do I do with all of this data?”, one needs to know the latest advances in
    the algorithms and think deeply about the interplay of statistical algorithms,
    data, and theory.


    An important distinction between this book and most other books in the area of
    machine learning is our focus on theory. To address the interplay'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Preface


    **FIGURE1.** The complexity of modern data analysis necessitates a transition
    from primarily focusing on the interplay of data and theory, to now understanding
    how data, theory, and algorithms are integrated in practice.


    ![](img/5047f0f064e22688ceb5d0cdfaf3e964_10_0.png)


    of machine learning, data, and theory (see Figure 1), we start with detailing
    our perspective in Chapter 2 to address the question we often receive when teaching
    classes or workshops on machine learning, namely: “Can machine learning analyses
    be incorporated into my traditional confirmatory research?” The follow-up question
    is: “Given the exploratory nature of machine learning, how can we be sure our
    results are trustworthy?” We address this question specifically in Chapter 3 by
    providing details on a number of cross-validation strategies that help prevent
    overfitting.


    One glance at the table of contents from any of the recently published books on
    machine learning, data, statistical learning, data science, or artificial intelligence
    reveals a dizzying array of algorithms not detailed in statistical textbooks.
    This book is different in a number of ways. The first is our aforementioned focus
    on theory. While Chapter 1 provides an orientation to the book''s organization,
    the primary substance of our book begins with a focus on theory (Chapter 2)—how
    machine learning fits into research that has been traditionally done from a hypothesis-driven
    perspective. This is followed by a chapter (Chapter 3) on principles, specifically,
    how practitioners can apply machine learning algorithms to produce trustworthy
    results. These chapters set the stage for our discussion of algorithms for univariate
    outcomes (Chapters 4–6); however, in contrast to other books, we focus largely
    on regularization and tree-based methods. This allows us to discuss the integration
    of these algorithms with complex models that are commonly applied in social and
    behavioral research, namely, latent variable models. This enables us to provide
    additional detail on handling measurement error, an extremely important component
    of survey data, longitudinal data analysis, and the assessment of heterogeneity
    through the identification of subgroups. Measurement is the focus of Chapters
    7 and 8, followed by a discussion of mod-'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Preface


    eling longitudinal data (Chapter 9), and assessing heterogeneity (Chapter 10).
    Finally, we focus on the last two chapters on alternative data types, with an
    introduction to text analysis (Chapter 11), where we detail the processing of
    text data and implementing commonly applied algorithms, and social network data
    (Chapter 12), with an emphasis on network modeling.


    Chapters 1 through 6, 9, and 11 have been used as the primary source material
    for an advanced undergraduate and graduate course. Further, this book can be used
    as a supplement reading for courses on regression, multivariate, longitudinal
    data, and structural equation modeling, among others.


    Chapters 4 through 6 have considerable overlap with content found in other books
    oriented towards supervised learning, Chapter 7 and the subsequent chapters provide
    a more detailed/advanced account of machine learning methodologies.


    Chapters pair a breadth in coverage of methodologies and algorithms with a depth
    in focusing on fundamental topics, which are detailed at the beginning of each
    chapter in a "Key Terminology" section to prepare readers for the fundamental
    concepts of each chapter. Further, we end Chapters 3-12 with a "Computational
    Time and Resources" section that discusses how to put each into practice, denoting
    the R packages that can be used. Every application of machine learning detailed
    in this book was programmed in the R statistical environment. While the book does
    not detail R code, code for all analyses is provided on the book''s website. Readers
    can apply this to reproduce every example in the book.


    # Acknowledgments


    Each author of this book became interested in machine learning because of mentorship,
    collaboration, and friendship with John (Jack) J. McArdle, who passed away before
    this book was completed. Jack was one of the first psychological researchers who
    became interested in machine learning, writing a host of papers and an edited
    book on the topic dating back to the early 2010s. Jack gave the inspiration and
    motivation for each one of us to pursue research in machine learning, spurred
    by his novel application of machine learning to understanding attention in longitudinal
    studies and heterogeneity in longitudinal trajectories. Simply put, without Jack,
    this would never have been written.


    In addition, we would like to thank the helpful reviewers of the book who guided
    us in the development of the manuscript. These reviewers were initially anonymous,
    but they agreed to have their identities revealed now, and we would like to thank
    them for their insightful feedback: Sonya K. Sterba, Department of Psychology
    and Human Development, Vanderbilt University; Georgecoules, Mays Business School,
    Texas A&M University-'
