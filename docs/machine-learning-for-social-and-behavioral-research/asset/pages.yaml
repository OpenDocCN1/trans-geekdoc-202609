    +   * We discussed the analysis of text from a relatively simplistic point of
    view, mainly focusing on the individual words while negating the order in which
    they were used. The field of natural language processing has developed a number
    of more advanced approaches for modeling the sequence in which words are used,
    most commonly using various forms of neural networks (i.e., deep learning). We
    chose not to discuss this area of algorithmic development because many research
    applications in social and behavioral research do not have the amount of text
    necessary to take advantage of these more complex approaches. For readers interested
    in this, we recommend Chollet and Allaire (2017) for an introduction to deep learning
    with applications in R.


    # 11.9.2 Computational Time and Resources


    While the focus in this chapter was using R to process and analyze the data, Python
    has a richer set of tools for text data, as well as a larger array of researches.
    Most of the analyses conducted in this chapter can run in a matter of seconds.
    Computational time scales with the complexity of the analysis, with LDA, STM,
    and SLDA analytics typically on the order of minutes or a few hours. The main
    factors in the amount of these analyses are the number of observations (documents)
    and the number of words in the DTM. Often it is common to remove both stop words
    and infrequently used words (e.g., less than 10 times across all documents) to
    reduce the dimensionality of the DTM for the express purpose of reducing computational
    time. Scraping data can result in much larger datasets, thus potentially increasing
    the amount of time it takes to analyze. As with many of the previous chapters,
    it is recommended to try and parallelize as many of the computations as possible,
    either through built in'
