    data.


    ![](img/5047f0f064e22688ceb5d0cdfaf3e964_337_0.png)


    For the teaching comments, we conducted a 5-fold CV for the number of topics ranging
    from 2 to 9. The total perplexity with 2 to 9 topics is given in Figure 11.23.
    Overall, with the increase of the number of topics, the'
