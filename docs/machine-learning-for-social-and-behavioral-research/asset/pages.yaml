  md: '# Machine Learning and Measurement


    This is further demonstrated in Figure 7.2.


    **FIGURE 7.2.** Simulation results across different values of reliability for
    data simulated according to nonlinear relationships.


    ![](img/5047f0f064e22688ceb5d0cdfaf3e964_195_0.png)


    Here, there is little variation across each of the ensemble methods within each
    reliability condition. The interesting point to make is about the performance
    of the ensembles relative to linear regression values. When reliability is high,
    the ensemble methods can better capture the nonlinear effects, while linear regression
    displays poor fit. However, when reliability is lower, the noise-to-signal ratio
    is large enough that linear regression demonstrates comparable, not superior,
    values of $R^2$, despite the mismatch between the expected functional relationship
    (linear) and the simulated relationship between variables. Again, we can attribute
    this to the idea of shrinkage or regularization, with the simplicity of linear
    regression being a positive attribute when there is a large degree of noise in
    the data.


    Our point in this example is two-fold: 1) to highlight that using machine learning
    algorithms does not negate the necessity of quality measurement, and 2) in performing
    model comparison, our results are *conditional* not only on what variables are
    included in the model, but the quality of variables as well. Just because we use
    more powerful methods does not negate the term "garbage in, garbage out." In the
    following chapters we will discuss'
