    # 9.7.2 Computational Time and Resources


    The use of both regularization and trees can be computationally expensive. The
    main factor that drives how long the programs take to run is how long the initial
    base model takes to run. If the initial base mixed-effects model takes minutes
    to run, the addition of regularization and trees will likely lead to run-times
    in the hours. Particularly for tree models, the computational time can be long,
    with the main factor being the number of covariates and the number of unique values
    to each covariate. For an initial run of tree models it is recommended to include
    just a few covariates, preferably variables that have a few unique response options
    (e.g., binary variables). This will provide a reference for how long the full
    analysis could take. Additionally, for continuous covariates, it is recommended
    to round to the nearest whole number as this can significantly cut down on the
    number of unique splits that the algorithm tests.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 10 Searching for Groups


    Researchers are often interested in assessing heterogeneity with respect to a
    model of interest. For instance, one extension of finite mixture models is growth
    mixture models, where the estimation of latent classes is performed with respect
    to parameters in a latent growth curve model. Finite mixture models have been
    extended in this way to a number of additional models (discussed below). A related
    approach assesses the presence of groups with respect to a model of interest is
    structural equation model (SEM) (Freimer et al., 2013). In this, groups are derived
    through the use of decision trees and with respect to any type of SEM. Whereas
    mixture models estimate latent classes, SEM trees extract groups based on values
    of covariate variables. For this chapter, we discuss the use of both mixture models
    and SEM trees, as we see these two algorithms as the most relevant methods for
    identifying heterogeneity in social and behavioral research. We accomplish this
    through highlighting their similarities and distinctions, concluding with a discussion
    of when either algorithm may be appropriate.


    # 10.1 Key Terminology


    +   - Mixture model. A probabilistic model that identifies population heterogeneity
    through the use of latent classes.

    - Structural equation model trees. An algorithm that pairs decision trees with
    structural equation models to identify subgroups among covariates of interest.

    - Cluster analysis. An algorithm that identifies deterministic clusters of individuals
    in the sample of interest.

    - Trees. The use of decision trees as a method for splitting the sample into distinct
    subgroups. See Chapter 5 for an overview of decision trees with a single outcome
    variable.'
