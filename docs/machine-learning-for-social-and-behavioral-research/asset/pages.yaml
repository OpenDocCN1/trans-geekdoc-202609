    #  7.4 Assessing Measurement Error


    To demonstrate the concept of assessing measurement error we use the GRit data.
    From this initial sample, we created two separate datasets: a sample of 1,000
    training cases and a separate test set of 1,000 observations.


    #  7.4.1 Indexes of Reliability


    We provide a brief overview of indexes of reliability. For a more detailed coverage,
    see McNish (2018). As displayed in Equation 7.2, the definition of reliability
    is intuitive. In practice, however we do not have access to T, therefore we must
    estimate reliability solely with X. In psychological research, Cronbach''s alpha
    (Cronbach, 1951) is by far the most common for calculating reliability based on
    a single administration.³Cronbach''s alpha can be defined as


    ```

    $$\alpha = \frac{k}{k-1} \left(1 - \frac{\sum s_i^2}{s_X^2}\right)$

    ```


    where k is the number of items, $s_i^2$ is the variance of each item $i$, and
    $s_X^2$ is the sum of all variances and covariances for all the items. In line
    with Equation 7.2, we can characterize Cronbach''s alpha as the proportion of
    variance in a scale attributable to a common source. In Calculating Cronbach''s
    alpha for the 12 Grit items, we got a value of 0.84 (95% CI = 0.82, 0.85). This
    represents a good reliability estimate,⁴ it is worth delving into the assumptions
    and limitations regarding Cronbach''s alpha. Two of the most important limitations
    of Cronbach''s alpha are the assumption of tau equivalence and unidimensionality
    (among others, see McNish, 2018). This essentially means that there is only a
    single latent variable that underlies the scale, and each item is equally representative
    of that single latent variable. In practice these assumptions are unlikely to
    hold. To provide alternatives to Cronbach''s alpha, we first need to provide background
    on the use of factor analysis.


    ³Compared to methods that are based on assessing X at two different times

    We do not report a more specific characterization of this value as we view cutoffs
    as arbitrary regarding reliability and we do not advocate for the use of Cronbach''s
    alpha with this data.'
