    \nIn the social and behavioral sciences, one of the most important topics of statistical\
    \ analysis is that identifying and understanding interactions in regression models.\
    \ Formally, we follow Darlington and Hayes (2017) in defining an interaction as\
    \ a change in one regressor's relationship with Y when another regressor changes.\
    \ This can alternatively be called moderation, where we attempt to identify variables\
    \ that moderate the effect of another X on Y. In contrast to model or simple effects,\
    \ where the effect of X1 on Y remains constant across values of X2, interactions\
    \ note a change in the slope. These represent effects of particular importance\
    \ given the difficulty in identification and theoretical consequences.\n\nThe\
    \ identification of interactions is an extremely important topic in machine learning.\
    \ Methods such as decision trees and extensions (see Chapters 5 and 6) automatically\
    \ try to identify important interactions between the predictors and outcome. Other\
    \ methods, such as multivariate regression splines, have options for testing different\
    \ levels of interactions (e.g., no interactions, two-way, three-way). Linear regression\
    \ typically requires the manual specification of interactions. For large numbers\
    \ of variables, this can be extremely tedious. To overcome this limitation, a\
    \ number of different methods have been proposed for the identification of high-dimensional\
    \ interactions in linear regression. These can be seen as extensions of regularized\
    \ regression methods, which they not only perform variable selection of main effects,\
    \ but also selection of interactions as well (Bien, Taylor, & Shibsirani, 2013;\
    \ Choi, Li, & Zhu, Haris, Witten, & Simon, 2016).\n\nTo use regularization to\
    \ search for interactions, we first specify a regression model with all possible\
    \ interactions, following Bien et al. (2013),\n\n```\nY = \\beta_0 + \\sum \\\
    beta_i X_i + .5 \\sum_{j<k} \\theta_{jk} X_j X_k + \\epsilon \\quad (4.8)\n```\n\
    \nwhere the goal is to estimate the main effects, $\\beta_i$, and all two-way\
    \ interactions, $\\theta_{jk}$. $\theta_{jk}$ is a symmetric matrix of interactions,\
    \ with a diagonal of 0s. With a large number of predictors, it would be computationally\
    \ difficult and from an interpretation perspective to estimate all possible interactions."
