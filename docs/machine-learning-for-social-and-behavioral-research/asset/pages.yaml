- pgno: 211
  md: '# Machine Learning and Measurement


    (Friedman, Hastie & Tibshirani, 2007, 2010; Mazumder & Hastie, 2012). In contrast
    to SEM, the expected covariance $\Sigma$ matrix is used for estimation, in graphical
    models it is generally the precision matrix $\Theta$, and the inverse of the expected
    covariance matrix $\Sigma^{-1} = \Theta$. Assuming the observations follow a gaussian
    distribution indicates that all of the conditional distributions are gaussian
    (Hastie et al., 2009). Given this, the precision matrix then has the partial covariances
    between variables. Specifically, if the $ij$ component of $\Theta$ is zero, then
    the variables $i$ and $j$ are conditionally independent given all of the other
    variables, meaning the path (either undirected or directed) between variables
    in the model is also zero. Using this, a penalty on the $\Theta$ matrix can be
    introduced directly to a form of constraint on the model. In the graphical lasso,
    this penalty takes the form of


    ```

    $f(\Theta) = log(|\Theta||) - tr(C\Theta) - \lambda|\Theta||_1,$

    ```


    where $\lambda$ is the shrinkage parameter, similar to regression content, **C**
    is the empirical covariance matrix, $tr$ denotes the trace, and $|\Theta||_1$
    is the $L_1$ norm (Friedman et al., 2007).


    The Gaussian graphical model is a model for continuous variables. For categorical
    variables (or mixed), one can use Ising network models, which has been similarly
    shown to be equivalent to different forms of latent variable models, specifically
    item response theory (Marsmann et al., 2018). In other forms of regularization,
    one needs to use some criterion to choose a singular value of $\lambda$. One of
    the most applied criterion is the expected Bayesian information criterion (EBIC;
    Chen & Chen, 2008; Epskamp, Kramer, Waldorf, Schmittmann & Borsboom, 2012). Note
    however, there are similar drawbacks to the application of lasso penalty in SEM,
    specifically problems with consistency (Williams, Rhemtulla, Wysocki, & Rast,
    2019).


    We can see an application of graphical models in Figure 7.7, as we estimate the
    conditional relationships between all 12 Grit items. Using this, we can see a
    similarity to the results from factor analysis (see Table 7.3), where items that
    loaded on the same latent variable have stronger conditional relationships, and
    thus are plotted in closer proximity in the graphical model. A more explicit tie
    between frameworks can be seen in exploratory graph analysis (Golino & Epskamp,
    2017), where a graphical model is used to estimate the number of latent variables.


    In graphical models a number of statistics are commonly computed. These relate
    to centrality, or deriving local information for each node (variable) and the
    strength of its relationship to other nodes. Centrality, in particular, has almost
    a direct relationship to factor loading strength in'
