  md: '# Regularized Regression


    # 4.6 Bayesian Regression


    The use of Bayesian estimation is becoming increasingly popular in the social
    and behavioral sciences. As such, researchers often wonder whether the same types
    of methods that they have utilized in Frequentist estimation also exist in the
    Bayesian framework. A full description of Bayesian estimation is well beyond the
    scope of this book. Instead we present a simple applied example of how lasso regression
    can be applied in a similar manner using Bayesian estimation.


    In Bayesian estimation, results similar to ordinary least squares regression can
    be achieved by using a noninformative (diffuse) normal prior on the regression
    coefficients. Extending this to ridge and lasso regularization, the ridge has
    been shown to be equivalent to the use of a more restrictive normal distribution
    prior, while the lasso is equivalent to a Laplace distribution prior (Tibshirani,
    1996). The lasso estimate is the mode of the posterior while the ridge is the
    mean. To perform variable selection, it is generally preferable to use sparse
    extensions of these two methods. In contrast to the comparison of testing 100
    values of $\Lambda$ in ridge or lasso regression, in Bayesian regularization it
    is preferable to use a hierarchical representation of a sparse prior, which only
    requires running one model that implicitly selects an ideal degree of prior variance.
    Hierarchical Bayesian currently includes methods such as the Bayesian adaptive
    lasso, the spike and slab prior, and the horseshoe. We provide a brief application
    of the horseshoe prior. For more detail, see Van Erp, Oberki, and Mulder (2018).


    As a simple application with a subset of 150 observations from the ECLS-dataset,
    we applied the horseshoe prior with the rsnatarn package, using the specification
    of Piroönen and Vehtari (2016). This was assessed across four chains, with the
    posterior distributions displayed in Figure 4.11.

    In Figure 4.11, the only regression coefficients for math and knowledge have posterior
    distributions away from 0. These are the only two parameters that have median
    estimates away from 0 (rounded to the nearest decimal). Using 95% credible intervals
    (the Bayesian counterpart to confidence intervals) to select which parameters
    are nonzero induces more uncertainty into which estimates are nonzero, additional
    noise parameters that do not include 0. This allows for more subjectivity and
    theoretical input into which variables are *selected* in terms of performing variable
    selection, through placing different types of priors on each of the regression'
  merge: -1
  img_proc: true
- pgno: 120
  md: '![](img/5047f0f064e22688ceb5d0cdfaf3e964_120_0.png)


    coefficients. Bayesian regularization can also be used in scenarios where uncertainty
    exists as to whether a parameter should be included, allowing the user to fit
    a more complex model, placing priors on parameters that are not of interest, resulting
    in a more holistic modeling procedure that does not necessarily have to be performed
    in a series of several steps, removing or adding variables based on the previous
    model''s results.


    Although we get results similar to that of the lasso in Frequentist estimation,
    because we used a smaller subset of the data to speed the computational time (Bayesian
    estimation typically takes longer with increasing samples), it is necessary to
    remember that variable selection can depend heavily on the sample size. Larger
    sample sizes generally result in larger numbers of selected variables.


    One of the main benefits of the Bayesian framework is the flexibility it allows
    users to specify models that reflect not only their theoretical ideas, but also
    a combination of different aims. For instance, the different forms of regularization
    discussed earlier, such as the lasso, group lasso, and the lasso for interactions,
    can also be specified using Bayesian regularization. This requires manual specification,
    however, the principles described in applying Bayesian regularization to linear
    regression scale to more complex scenarios such as multilevel or structural equation
    modeling. Our main'
  merge: -1
