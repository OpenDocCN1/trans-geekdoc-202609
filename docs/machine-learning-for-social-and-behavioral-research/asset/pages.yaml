  md: 'Machine Learning for Social and Behavioral Research


    # 5.5.5 Variable Importance


    Similar to linear regression, high correlations among covariates presents problems
    for decision trees. In the tree building algorithm, at a given split two collinear
    variables may produce almost identical inments in fit, but only one can be chosen
    for a given split. This is analogous to the idea of making, but in the case of
    decision trees, it results in one of the variables either not being split at all,
    or lower in the tree. To quantify how influential a variable is in predicting
    the outcome variable, one can also calculate the variable importance metric for
    a given tree. These alternative splits can be used to calculate how much improvement
    in fit would have occurred for a given variable if the split was chosen. This
    allows us to quantify the importance of a variable even if it was not split on
    all. Although there are various ways to calculate this, which is not limited to
    decision trees, the part purity creates an overall measure of variable importance
    that is the sum of the fit improvement for all splits of which it was the primary
    variable (i.e., in this tree), plus the improvement in fit (adjusted for improvement
    above baseline) for all splits in which it was a surrogate (Tableau & Atkinson,
    1997).


    As an example, we used the ECLS-K dataset to create an additional tree. Using
    both general knowledge and math predictors of eighthgrade scale, we added a third
    variable, which we created by duplicating each observation''s math score and adding
    a small amount of noise. This simulated math score had a correlation of 0.95 with
    the original math score. We expected that this would result in only one of the
    math variables being selected in the tree, but that the variable importance should
    show roughly similar values for each math score. The resultant tree is displayed
    in Figure 5.22.


    As expected, one of the math scores was not used in the tree (the simulated math
    score). However, the variable importance metrics were: 39 for math, 33 for knowledge,
    and 28 for the simulated math score. Note that the variable importance metric
    is scaled to up to 100. Despite not showing up in Figure 5.22, the simulated math
    score receives an importance score that is nonzero. This metric should not be
    interpreted to too high of precision, as there are only so many splits in a tree,
    making it difficult to fully account for each variable''s importance. In general,
    only the relative ranking of variables should be interpreted with respect to importance
    metrics (Strobl, Malley, & Tutz, 2009). In the next chapter, we will build variable
    importance metrics that are more robust, as we are using hundreds, if not thousands,
    of trees to average each variable''s effect.'
  merge: -1
  img_proc: true
