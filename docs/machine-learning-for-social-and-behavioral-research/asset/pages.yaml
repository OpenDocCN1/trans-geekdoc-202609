  md: '# Machine Learning for Social and Behavioral Research


    Additionally, GAMs have been extended to include random-effects parameters (generalized
    additive mixed models; GAMMs; McKeown & Sneddon, 2014). Within the mgcv package,
    the gamm function allows researchers to specify random effects within the model.
    In addition to the MCGV package, the gamma package combines the mgcv package and
    the lme4 package for fitting mixed-effects models. In GAMMs, researchers can specify
    whether the smoothing functions can differ across clusters. This allows for a
    host of flexible specifications that can take into account additional features
    of the data. Readers are referred to Wood (2017) for additional detail on GAMs.


    # 9.7 Summary


    The combination of mixed-effects models with machine learning algorithms is a
    powerful combination for performing variable selection and potentially examining
    nonlinear and interactive associations while accounting for the dependency in
    data. However, further work is needed to determine how best to incorporate recursive
    partitioning and regularization into mixed-effects models. In recursive partitioning,
    longRP2 implements a multiple group approach, where glimmer treats nodes as a
    categorical variable (as factor in R), which only allows fixed-effects parameters
    to differ across nodes. These differences in specification will lead to different
    tree structures and different conclusions, we encourage researchers to use multiple
    approaches because it is likely that the approach that works best for a given
    research question is going to be dependent. In terms of regularization, there
    are approaches that focus on the fixed-effects parameters as discussed here, but
    also approaches that tend to the random-effects parameters in an attempt to determine
    which, if any, random slopes should be included in the model. A remaining challenge
    for all of these approaches is model selection. While a form of cross-validation
    (e.g., multiple f-fold cross-validation) is often implemented in the regression
    context, the combination of machine learning methods and mixed-effects models
    leads to a computational burden that makes cross-validation very time consuming.
    Thus, researchers often use a fit index (e.g., BIC, Δ–2LL) for model selection;
    however, the choice of fit index and the criterion remains frankly arbitrary (see
    Grimm, Jacobucci, Stegmann & Serang, 2022) and more research needs to be conducted
    in this realm.'
