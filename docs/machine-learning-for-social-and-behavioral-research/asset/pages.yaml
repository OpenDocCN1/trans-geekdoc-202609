  md: '# Searching for Groups


    # # 10.2 Finite Mixture Model


    Finite mixture models are parametric models that combine multiple probability
    density functions. Generally, the finite mixture model with $k=1$ to $K$ unobserved
    (latent) classes can be written as


    ```

    $f(y_i) = \sum_{k=1}^{K} \phi_k \cdot f(y_i | \theta_k) \quad (10.1)$

    ```


    where $f(y_i)$ is the probability density function for the data $y_i$, $\phi_k$
    is the proportion of the population in class $k$ ($0 \le \phi_k \le 1; \sum_{k=1}^{K}
    \phi_k = 1$), and $f(y_i | \theta_k)$ is the probability density function for
    class $k$ given model parameters of class $k$, $\theta_k$.


    To illustrate a mixture distribution, we generated two normal distributions that
    differ in their means and standard deviations. These distributions were multiplied
    by their proportion in the (made-up) population (0.9 and 0.1), and then summed.
    The mixture probability density distribution is represented by the gray line in
    Figure 10.1, and the two class probability distributions are represented by the
    black lines in Figure 10.1. In finite mixture modeling, the observed data would
    have a distribution following the gray line, and the goal would be to infer the
    presence of the two underlying distributions following the black lines. The estimated
    parameters in this example would include (i.e., four estimated parameters), as
    well as the mixing proportion. The mixing proportion is often estimated as an
    intercept with one class serving as the baseline category. Thus, five parameters
    would be estimated for a two-class model with an assumed normal distribution within
    each class. Once the model is estimated, the probability of each observation belonging
    to a certain class is then estimated based on the model''s parameters. These probabilities
    are referred to as *posterior probabilities*.


    A major area of flexibility in finite mixture modeling is the class-specific model
    level, and this leads to different named models. For example, when a factor model
    is specified within each class, the model is referred to as a *factor mixture
    model* (Lubke & Muthén, 2005), and when a growth model is specified within each
    class, the model (Muth & Sheidden, 1999). Moreover, constraints can be imposed
    or relaxed on the class-specific models'' parameters across classes, in certain
    programs, to test different model configurations. For example, in a factor mixture
    model, constraints can be imposed on the factor loadings and measurement intercepts,
    which would force class differences in the distributions of the common factor
    and unique factors. Another area of flexibility in finite mixture modeling'
  merge: -1
  img_proc: true
