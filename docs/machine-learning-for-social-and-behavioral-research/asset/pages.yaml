    # 5.4.3 Conditional Inference Trees


    Conditional inference (CTree; Hothorn, Hornik & Zeileis, 2006) are based on a
    general theory of permutation trees, by performing a hypothesis test at each node
    resulting in a p-value criterion to determine whether the tree should split or
    keep growing. Using a permutation test to calculate a p-value entails comparing
    a split on the original sample to that same split on randomly response values
    (e.g. swapping observation 1 and 2s). Once completed many times, a p-value for
    the conditional distribution of test statistics is calculated. This allows for
    unbiased variable selection as each p-value was calculated based on a partial
    hypothesis. This effect controls for the scale of covariate, overcoming the propensity
    for CART to select variables with larger numbers of response. As an additional
    feature that is different than CART, by using a p-value to test each split, it
    negates the use of pruning, and it attempts to control for false positives (splits
    on noise variables) during the tree construction process.


    This algorithm is implemented as the cTree() function in the partykit package
    (Hothorn & Zeileis, 2015). The default p-value criterion is 0.05 (expressed as
    0.95, although this can be manually altered or tested as a tuning parameter using
    the training function in the caret package (Kuhn, 2008). In practice, the trees
    created by CTree tend to be overly large, making interpretation difficult. Although
    one could change the p-value threshold to smoothing (e.g., 0.001), a new algorithm
    that attempts to control the size of the tree without missing important effects,
    particularly interactions. This algorithm, termed CTreePrune (Alvarez-Iglesias,
    Hinde, Ferguson & Newell, 2016), proceeds by first growing a large, saturated
    tree using CTree by setting a large (0.999) p-value criterion. Once a saturated
    tree is created, the algorithm proceeds'
