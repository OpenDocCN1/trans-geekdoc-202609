    that in mixture models it is less common to incorporate large numbers of variables,
    as the estimation of mixture models is already tricky. With our data, we got inadmissible
    results by including all 62 variables.


    As a result, we created factor scores for each of the personality scales and only
    used these as covariates. Mixture converged, and resulted in the effects displayed
    in Table 10.4.


