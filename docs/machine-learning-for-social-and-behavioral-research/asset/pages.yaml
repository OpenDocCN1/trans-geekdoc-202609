    # 8.6 Nonlinear Relationships and Latent Variables


    The methods that we have discussed in this chapter up until this point exist within
    the SEM framework. Thus the types of nonlinearity that are natural to specify
    are with respect to observed variables, including interactions and quadratic terms.
    We do not discuss these as they require manual creation to running the model,
    changing little about the actual model fitting procedure. We do note, however,
    with larger numbers of variables, the possible of interaction and quadratic effects
    increases quickly, which could require the use of regularization to reduce the
    dimensionality.


    To fully specify nonlinear relationships, a few methods (outside of fully nonlinear
    growth models as in Grimm et al., 2016) are available. One local SEM (Hildebrandt,
    Wilhelm, & Robbitsch, 2009) examines the nonlinear relationships between moderator
    variables and specific parameters within SEM. This is similar to moderated nonlinear
    factor analysis (Bauer, 2017), where individual parameters are tested with one
    or more moderated variables in an attempt to identify invariance violations. However,
    both of these methods apply more at the individual parameter level, and would
    be insufficient for larger SEM models. Modeling nonlinear relationships between
    latent variables using latent product terms has spurred the development of more
    complex models (Harring, Weiss, & Hsu, 2012). Two of the most popular approaches
    include product-indicator approaches (parametric approach; e.g., Kenny & Judd,
    1984) and structural equation mixture models (semiparametric; e.g., Bauer & Carran,
    2004). However, interaction and quadratic terms among latent variables present
    a number of problems,'
  merge: -1
  img_proc: true
- pgno: 234
  md: '216 Machine Learning for Social and Behavioral Research


    namely, nonnormal distributions of the latent predictors, as well as the approaches
    have been computationally expensive. A more recent approach that more seamlessly
    incorporate nonlinear relationships is Bayesian SEM.


    # ### 8.6.1 Bayesian SEM


    Bayesian SEM (Lee & Song, 2012), which has received limited use in the past due
    to a lack of easy-to-use software and long run-times, have become an increasingly
    popular approach for estimating general SEM models. For the purposes of including
    nonlinear terms among latent variables, Bayesian estimation can simplify the process
    of estimating a model, which has been facilitated by more easier-to-use software
    packages developed in the prior 10 years, such as Stan (Gelman, Lee, & Guo, 2015),
    and blavaan (Merkle & Rossel, 2015). Additionally, Bayesian estimation has demonstrated
    improvements in scaling to larger numbers of product terms (Brand, Cambria, &
    Kelava, 2018), while many of the traditional estimation methods are limited to
    1-5 interactions or quadratic terms.


    There are a number of commonalities across both Bayesian and frequentist SEM.
    In the presence of large sample sizes and diffuse (noninformative priors), the
    results across estimation frameworks are similar. Whereas Bayesian estimation
    allows for the use of informative priors, which can constrain the resulting posterior
    samples for each parameter estimate toward specific values, such as sparsity.
    This is similar to the use of regularization, where different types of regularization
    (shrinkage) priors can be used in both regression (e.g., Van Erp, Obers, Mulder,
    2019) and SEM (Jacobucci & Grimm, 2018) to produce sparse results, just as in
    frequentist types of regularization like the lasso. In contrast to testing a sequence
    of penalties as in regularization, Bayesian regularization makes use of hierarchical
    priors, or a prior necessitating the specification of only one model. An additional
    advantage of Bayesian estimation in SEM is that it is not reliant on covariance-based
    expectations, making more complex models, both in number of parameters and functional
    form of relationships, easier to specify and estimate. We demonstrate this below
    in extending our use of the MIMIC model using Big Five to predict latent


