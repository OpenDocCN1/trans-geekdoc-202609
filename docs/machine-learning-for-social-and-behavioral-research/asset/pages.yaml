    # 12.3 Network Visualization


    Visualizing a network is not only the first step but also a critical step of social
    network analysis. For a long time, network analysis research focused on how to
    represent a network. A large number of options are available to visualize a network—here
    we introduce the heat map and the network plot. Visualization makes the identification
    of the node relationships relatively easy.


    # 12.3.1 Heat Map


    A heat map can visualize any matrix of data, not only the network data. A heat
    map divides a plot area into small squares according to the number of rows and
    columns in the data matrix. Each square is colored according to the corresponding
    value in the matrix. For example, the heat map of the WeChat network is given
    in Figure 12.1. In this figure, the value 1 is'
