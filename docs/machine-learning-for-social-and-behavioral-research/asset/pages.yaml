    # 3.7 Imbalanced Outcomes


    With binary outcomes, it is common to have some degree of imbalance, and in some
    settings, particularly in clinical research, the level of imbalance (i.e., < 10%
    positive cases) can cause a host of problems. With imbalanced outcomes we will
    detail changes that can be made to k-fold CV, whether sampling-based methods improve
    our prediction, and alternative performance metrics are more attune to assessing
    specifically the positive cases.


    The first strategy developed that we will discuss for imbalanced outcomes is the
    stratified k-fold CV. For an example, we can think of attempting to predict which
    participants have a history of attempting suicide. Since this is typically a rare
    event, less than 10% of the sample is likely to have a “Yes” response. Given this,
    splitting the sample into 5 or 10 different partitions could lead to partitions
    with less than 10% just by chance. Stratification involves prearranging the distribution
    of the outcome in each partition of the data to ensure roughly equal distribution
    of the outcome. Results have been mixed in the assessment of the efficacy of stratified
    k-fold CV, with some research indicating positive effects in classification settings
    (Kohavi, 1995), as well as no improvements in the regression setting (Breiman
    & Spector, 1992).'
