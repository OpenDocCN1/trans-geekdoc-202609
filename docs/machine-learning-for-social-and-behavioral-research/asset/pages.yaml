    In some research scenarios there is little flexibility with regard to description.
    One example is the case of a single predictor—there are a limited number of options
    for modeling this single relationship. At the other extreme when the number of
    predictors is extremely large. For example, if the predictors represent a large
    battery of depression scales, with each scale including 10 to 30 items, there
    is likely to be a large number of small effects. If the sample size is large,
    a majority of these coefficients are likely to be significant and contribute to
    prediction. As an example, Mottus and Rozgonjuk (2019) found that increasing the
    number of personality items included to predict age out-of-sample predictive performance,
    such that 300 items predicted better than 120, which predicted better than 30,
    which improved upon just using Big Five domains. In an example as this, though
    each of the 300 individual relationships can be examined, and interpreted, one
    must take into account the effects of the other items that contribute to the prediction
    of Y, making description in a linear model less clear. On the other hand, summed
    scores could be created for each scale, thus simplifying the number of parameters
    in the linear model. However, just as in the above example, this always results
    in a decline in performance, making it unlikely that both prediction and explanation
    can be maximized with one method. This highlights that there is often flexibility
    not only with the algorithms that are tested, but also with the predictors included,
    and whether summaries of the predictors are used (e.g., summed scores), with each
    choice having consequences for both prediction and description.


    Otimes, the distinction between description and explanation is less than perfect.
    A statistical method that exemplifies this is structural equation models (SEMs).
    Discussed further in Chapters 7 through 10, SEMs involve the specification of
    regression equations between latent and observed variables, while often imposing
    a number of weak and strong constraints. The imposition of constraints implies
    causal relationships between variables (Bollen & Pearson, 2013). As a result,
    using SEMs favoring explanation over description given the requirements of imposing
    specific constraints into the model.


