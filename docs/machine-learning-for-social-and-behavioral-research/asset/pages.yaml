  img_proc: true
- pgno: 342
  md: '# 11.9 Summary


    Although there are probably more qualitative text than quantitative data, text
    data are relatively underutilized in social and behavioral research. In this chapter,
    we showed how one can extract and utilize information from text data. Through
    text analysis, one can gain insight into what otherwise might not be possible.
    For example, in the teaching evaluation, information on the gender of the professors
    was immediately available. However, we can still identify the gender of the professors
    based on the use of gender words such as he/she him in the comments of the students.
    Although it is simple, this example illustrates how to conduct basic text analysis—identify
    and extract important information such as individual words and quantify them such
    using frequency of the words.


    Preprocessing in text analysis is more critical than in quantitative data cleaning.
    Preprocessing should be viewed as an isolated process but should be an integral
    part of the text data analysis. Preprocessing typically involves a variety of
    steps such as extracting text from unstructured, removing sensitive and confidential
    information, handling special characters and abbreviations, spell checking and
    correction, removing stop words, and word stemming. Not all analyses need all
    the steps and some analyses might need additional preprocessing.


    Tokenization effectively break down the text to any unit for further analysis.
    Although it is most common to tokenize individual words, many other ways of tokenization
    are possible and can be used according to the purpose of the analysis. Tokenization
    is often combined and repeated with preprocessing to best process the data into
    a format that is ready to be analyzed.


    After tokenization, we typically express the text data in a documentmatrix. Such
    a matrix includes all the information we need to extract from the text. Each element
    in the matrix is a statistic regarding the frequency of a token as such. The matrix
    can be visualized or analyzed in a variety of ways. For example, we can visualize
    the word frequency through a bar plot or a word cloud. A network plot can be used
    to display the word associations. The process for the basic text analysis can
    be summarized in Figure 11.25.


    After data cleaning, different analysis methods can be applied. For example, sentiment
    analysis can be conducted to understand the sentiment of text. The sentiment information
    from the text can be further used in other analysis. For example, one can investigate
    what is related to the sentiment or how the sentiment is related to outcomes of
    interest. More complex data analysis such as topic modeling can also be conducted'
  merge: -1
  img_proc: true
