  md: '# Machine Learning for Social and Behavioral Research


    ters 11, where we provide an introduction to test analysis, and Chapter 12, where
    we provide details on a number of algorithms for modeling social network data.


    While there are various definitions of machine learning, we find most of them
    unsatisfactory; they refer mainly to concepts from computer science. First, we
    can define machine learning by the constituent characteristics of the algorithms.
    For example, we could define machine learning as a family of nonparametric algorithms,
    meaning that common probability distributions are not used. Thus, p-values, as
    used in variety of statistical frameworks (e.g., regression), should not be available
    in machine learning. However, this fails to hold for a number of algorithms, such
    as Gaussian processing, ridge regression, conditional inference decision trees,
    and recent algorithms that pair with structural equation models or multilevel
    models. Second, machine learning as a methodology can be defined by the increase
    in degree of complexity compared to traditional statistical models. This definition
    is difficult to quantify because many algorithms do not have parameters that estimate
    population level quantities. Furthermore, two methods fall under the umbrella
    of machine learning, ridge and lasso regression, go against most attempts to define
    machine learning in this way because they result in less complex models. Additionally,
    a number of algorithms, such as support vector machines and neural networks, can
    be specified as be similar to regression models. The most coherent definition
    of machine learning is a collection of algorithms that are adaptive, meaning the
    number of parameters, types of constraints, or other characteristics are not set
    a prior, but are developed during their implementation. Algorithmic flexibility
    is typically implemented by hyperparameters or tuning parameters, which are parameters
    that control various aspects of the algorithm. For instance, the hyperparameters
    in a random forest, which fits a sequence of decision trees, include the number
    of trees, tree depth, and the number of variables to test for each split. The
    drawback to this definition of machine learning is that it is seemingly all encompassing,
    leaving the generalized linear model as not being machine learning.


    # 1.1.1 Why Not Just It Statistics?


    The distinction we do make is between traditional inferential statistics and machine
    learning, with the former being the focus of most statistics courses, specifically
    with respect to analysis of variance and linear regression. Note that the main
    difference is parametric (traditional inferential statistics) versus nonparametric
    (machine learning), with parametric referring to the use of probability distributions
    (e.g., normal distribution for continuous outcomes). Instead of providing additional
    detail on this distinction, we note'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Introduction


    that the divide between traditional inferential statistics and machine learning
    has diminished recently and will likely continue to diminish in the future. Researchers
    now have access to increasingly varied types of data, thus requiring ever expanding
    statistical toolboxes. Solely using traditional inferential statistical models
    is now becoming increasingly limiting; however, the same can be said for machine
    learning, as there are a number of research scenarios in which traditional inferential
    statistical models are more appropriate.


    # 1.2 Why Do We Need Machine Learning?


    There have been reviews of machine learning and calls for its increased use in
    most area of social and behavioral research, such as clinical psychology (e.g.,
    Dwyer, Falkai, & Koutsouterlis, 2018), political science (e.g., Grimm, 2015),
    economics (Athey, 2018), and sociology (McFarland, Lewis, & Goldberg, 2016). The
    natural question is why? The easiest explanation is the increased availability
    of large datasets, which are facilitated by new collection methodologies, openly
    available dataset repositories, and distributed laboratories (see Moshontz et
    al., 2018). While data represents one piece of the pie, an equally important rationale
    for the use of machine learning is the increasing support for the idea that many
    associations in the social and behavioral sciences are more complex than the models
    previously considered. Complexity can mean many things, but researchers have discovered
    complexity in the number of variables (e.g., Kendlier, 2019), the nature of modeled
    associations (i.e., interactive and nonlinear effects; Van Doorn, Verhoef, & Bijmjolt,
    2007), heterogeneous (e.g., Ram & Grimm, 2009), or the existence of dynamic changes
    over time (e.g., Cole, Bendezu, Ram, & Chow, 2017). Each chapter in this book
    either lays the groundwork for assessing complex associations or directly addresses
    at least one of these regarding complexity.


    # 1.2.1 Machine Learning Thesis


    We believe that part of the motivation for machine learning lies in the thesis
    that psychological phenomena are extremely complex, possibly infinitely complex
    (Lin, Tegmark, & Rosnik, 2017; Jolly & Chang, 2019), requiring large numbers of
    variables, each likely producing small effects (Götz, Gosling, & Rentrow, 2021).
    Thus, the thinking is that complex algorithms must improve our modeling of data.
    This has undoubtedly been the case in a large number of published articles, there
    has concurrently with a surprising number of studies that have found equal'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Machine Learning for Social and Behavioral Research


    predictive performance for linear models relative to machine learning algorithms
    that search for nonlinear and interactive effects (see Christodoulou et al., 2019;
    Jacobucci et al., 2021). In contrast to the notion that these studies disprove
    our complexity thesis, we instead view these studies as informative for elucidating
    various limitations regarding study design. For example, the predictors and/or
    outcome may contain too much measurement error (Jacobucci & Grimm, 2020), to be
    represented as latent variables and not to assess unique entities (the idea behind
    constitutive versus; Kendall, 2017), have limitations regarding the number and
    predictors which were included, contain a sample size that was too small, among
    many others. Our point here is that this area of research is too new to jump to
    premature conclusions. Instead, of blaming the algorithm or the underlying thesis,
    we believe that more work is needed to understand how study design contributes
    to predictive performance. Despite supporting the complexity thesis above, it
    is simultaneously necessary to prevent the proffered of what could be termed a
    naive complexity — simply put, for example, studies that assess various environmental
    factors for understanding depression will likely not assess important genetic
    contributors. This can be referred to as integrative pluralism (Mitchell, 2009)
    and requires assessing the rules for combining various cases across multiple ontological
    levels.


    # 1.3 How Is This Book Different?


    The authors all have backgrounds in psychology and have worked with a wide variety
    of datasets coming from multiple areas of social and behavioral research. This
    means the following distinctions from most machine learning books:


    +   - A focus on datasets with more variables than sample size. Our research domains
    rarely see datasets of this form.

    - Greater focus on multivariate outcomes and specifically on imposing structure
    on the outcome variables. Each author is an expert in latent variable modeling
    and this expertise is infused into multiple book chapters.

    - Greater focus on dealing with measurement error which is incorporated into multiple
    chapters. Simply put, most of the data that we analyze have non-negligible measurement
    error which can have a large effect on our ability to accurately model associations
    in the data.'
  merge: -1
