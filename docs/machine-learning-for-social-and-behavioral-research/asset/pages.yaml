    whereas a logistic regression with factor scores is optimizing the regression
    weights to maximize prediction. If inference to the entirety of the model is of
    primary importance, the SEM framework may be most appropriate. However, this may
    come with some decrease in our ability to predict a single variable.


    # 8.2.3 Drawbacks


    In much of our discussion regarding machine learning we have made a distinction
    between an outcome and a set of predictors. In SEM, the distinction is between
    indicators of latent variables, predictors, and outcomes. In the model displayed
    in Figure 8.1, the set of demographic variables are predictors, where each of
    the two latent variables contains multiple indicators, and suicidal thoughts is
    the outcome. However, the distinction between indicators and outcomes is fuzzy
    (Burt; Levy, 2017). We illustrate this with an annotated depiction of our prior
    SEM, in Figure 8.2.


    In Figure 8.2 we can see a visual depiction of how regression paths from a latent
    variable to an observed outcome are equivalent to a factor loading, which is referred
    to as *interpretational confounding*. The important implication is that the outcome
    actually informs the composition of the latent variable, which can upwardly bias
    our assessment of prediction. More practically, the impairment latent variable
    is not only composed from aspects of the measurement model (indicators of the
    latent variable), but'
  merge: -1
  img_proc: true
- pgno: 222
  md: '204 Machine Learning for Social and Behavioral Research


    also a result of the outcome. This issue in separating indicators from outcomes
    in SEM has spurred a number of proposals, mostly focused on the use of two-step
    procedures: first creating factor scores and then inserting into the SEM, ensuring
    that the composition of the latent variable is only a result of the indicators
    (see Levy, 2017, for additional detail).


    # 8.3 Predicting Latent Variables


    Just as is common to headers that assess similar constructs in social and behavioral
    research, the same is often true for outcome of interest. For our goal is to try
    and predict a construct such as depression, it will often involve summarizing
    a participant’s responses to a number of distinct questions coming from the same
    scale. In contrast to the use of summed scores to create a single outcome, which
    makes an extremely restrictive assumption regarding each indicator variable (e.g.,
    McNeish & Wolf, 2020), in this section we discuss the use of SEM. To demonstrate
    this, we will continue with our use of the Grit data, as discussed in Chapter
    7. For this data, we will build off of exploratory factor analysis, using the
    two latent variable formulation as an outcome model.


    # 8.3.1 Multiple Indicator Multiple Cause (MIMIC) Models


    Staying within the SEM framework, we can directly add a number of predictors to
    the model, with directed paths from each predictor to each of the latent variables.
    In this model, the latent Grit factors are influenced by both the indicators (weighted
    by the factor loadings) and the covariates (weighted by the regressions). To better
    understand this, we would have to lay out expectations for each of the observed
    indicators of the Lat factors. However, in more simplistic terms, we can just
    think of the latent factors considering both the indicators and covariates in
    this model, each influencing the creation of the latent variables. In the literature,
    a distinction is often made between formative (just regressions) and reflective
    (just loadings) models, and combining these is called multiple indicators (factor
    loadings), multiple-causes (regression parameters directed to the latent variable)
    model (MIMIC model; Jöreskog & Goldberger, 1975). This is why the resultant factor
    loadings can change when including the predictors in the model—the inclusion of
    predictors can change the meaning of the latent factors. More specific to our
    purposes, our first model will assess the influence of each predictor and its
    linear regression weight directed to each latent factor. The model is displayed
    in Figure 8.3.'
