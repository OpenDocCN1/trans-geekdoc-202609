    “favorite” the corresponding elements are 1. For words that appear in other sentences
    but not in this one, the corresponding elements are 0. For the second sentence,
    the word “he” appears twice, the number 2 is used in the matrix.


    One can observe that in the matrix, many elements are zero. The whole matrix here
    is a 5 by 51 matrix. In total, there are 61 nonzero elements and 196 zero elements.
    Therefore, about 76% of the elements in the matrix are zero. This phenomenon is
    almost universally true for a DTM. In our example, the five sentences are quite
    short but they use many different words. This is especially true if the size of
    documents is big but the number of documents is large.


    A matrix with a significant amount of zeros is called a sparse matrix. For the
    contrast, if most of the elements are nonzero, it is a dense matrix. For a dense
    matrix, one has to store each element of it. But for a sparse matrix, we can usually
    store the information more efficiently by focusing on the nonzero elements. For
    example, one way is to use a triplet or coordinate (COO) form in which three vectors
    are used to represent the information in a matrix with two vectors storing the
    row and column numbers and the third vector storing the nonzero values. For the
    subset of DTM shown above, there are 20 nonzero values out of a total of 50 values.
    Using the triplet format, we have the following. Note that i is the row index,
    j is the column index, and v is its actual value in the original matrix.


    | i j v |

    | 1 3 1 |

    | 2 5 1 |

    | 3 2 1 |

    | 4 2 3 |

