    # 8.7 Summary


    This chapter covered the application of dimension reduction and accounting for
    measurement error with structural equation modeling. Building off of Chapter 7,
    where we discussed the use of measurement models, we integrated additional complexity
    into an SEM model, notably with explicit outcome variables that were both observed
    and latent variables. This detailing models where the outcome is a latent variable,
    the predictors are latent variables, and a model has. These complex forms of models
    can be easily fit in most software packages. Further we detailed how concepts
    from machine learning can be integrated into these complex forms of SEM, most
    notably regularization (Chapter 4). This requires the use of specialized R packages,
    but we expect regularization to be integrated into most general SEM packages in
    the near future.


    While pairing regularization with SEM may be new, we see that it is in line with
    theoretical testing realm. While SEM is not a purely predictive method, aspects
    of prediction are increasingly being integrated into SEM, partially motivated
    by increases in dataset size and the resulting enlargement of SEM models. Moving
    forward, expect SEM development to continue in this vein, particularly as it relates
