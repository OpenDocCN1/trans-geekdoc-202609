  md: '# Machine Learning with Mixed-Effects Models


    # 9.7.1 Further Reading


    +   - Increases in the collection of data using the experience sampling method
    (e.g., Larson & Csikszentmihalyi, 2014) or ecological momentary assessment (Shiffman,
    Stone, & Hufford, 2008), and more recently in passive smartphone data collection
    (Reves et al., 2019; Onnela & Rauch, 2016), have facilitated an increase in the
    application of machine learning to intensive data. Most notably, the outcome of
    interest is no longer a single variable, or a small number of variables as multivariate
    methods (e.g., SEM). Instead, the outcome can be assessed over a 1,000 times.
    Additionally, the sample size needs to be in the hundreds, as the number of assessments
    allows for modeling much smaller number of subjects (Molenar, 2004). The application
    of machine learning to this type of data could be a book unto itself. As a result,
    we do not discuss this form of modeling further, instead pointing readers to Epskamp
    et al. (2018) for an overview of dynamic network modeling.


    +   - Given that most longitudinal methods require the use of long data, applying
    k-fold CV would entitle assigning the hold partition based on random time points,
    while using responses from all respondents. Alternatively, multiple k-fold strategies
    take into account the nested structure of the data. Two additional forms of CV,
    stratified and grouped (see the documentation for the brms package; Bürkner, 2017).
    Stratified CV attempts to equally partition the number of time points per ID,
    whereas CV partitions the data by ID resulting in 20% (for 5-fold) of participants
    are placed in each partition. To partition by time as well, see, Buuteel, Mestdag,
    Tuerlinckx, and Ceulemans (2018) for a discussion.


    +   - While covering the application of regularization and decision trees with
    mixed-effects methods, we notably left out content regarding ensemble methods.
    This is mostly due to a lack of development in this area. However, there has been
    some recent research aimed at boosting and random forests for models with random
    effects. Notably, Miller, McArtor, and Lubke (2017) extend boosting for data that
    have a hierarchical structure, finding improved prediction and variable selection
    when incorporating grouping in the data. Similar extensions have been made for
    random forests (Hajjem et al., 2014).


    +   - For a more in-depth review on the use of mixed-effects models in social
    and behavioral research, we recommend the following resources depending on the
    type of data. For application in more tradi-'
