    # 6.5.2 Local Interpretation


    To visualize how an individual''s prediction of the outcome can change when aspects
    of a predictor change, one can examine the *individual conditional expectation*
    (ICE) plot (Goldstein, Kapner, Bleich, & Pitkin, 2015). In contrast to the partial
    dependence plot, which depicts the average relationship between a predictor and
    the outcome, ICE plots identify heterogeneous relationships by plotting the relationship
    between predictor and outcome for each observation. This involves replacing an
    individual''s value on $x$ with a grid of potential values while retaining the
    individual''s values on the other predictors, and generating predictions of the
    outcome based on the grid of $x$ values.


    An ICE plot was generated for the ECLS-K analysis for the reading variable and
    depicted in Figure 6.12. In this, we see little evidence for heterogeneity, most
    lines follow the general form of the aggregate (grey) line. However, based on
    our initial testing with simulated data, it seems as though this approach has
    difficulty picking up on heterogeneous effects, thus we use caution in their use.


    A second method for examining the relationship between variables at the individual
    level is to use *local interpretable model-agnostic explanations*'
