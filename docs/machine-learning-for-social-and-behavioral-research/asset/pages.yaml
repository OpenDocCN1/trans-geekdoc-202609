- pgno: 189
  md: '# # Machine Learning and Measurement


    In social and behavioral research, most variables of interest are measured with
    error. While this has a number of consequences, one primary result is that researchers
    often provide some dimension reduction or to create new, higher-level representations
    of the variables. In this chapter, we detail the scenarios where this may be the
    most appropriate strategy, and when dimension reduction may result in worse performance.
    We focus on factor analysis, and detail the use of exploratory factor analysis
    in this chapter, extending our discussion to confirmatory factor analysis in Chapter
    6. Measurement error can come in many forms, but it can have important consequences
    for prediction and inference. While this chapter focuses on the measurement of
    error in predictor variables, starting with a definition, discussing its impact
    the following chapter handles error in the outcome of interest. Further, the concepts
    and methods discussed will form the foundation for the following three chapters,
    we focus on methods that directly model error, structural equation modeling (Chapters
    8 and 10) and mixed-effects models (Chapter 9).


    # ## 7.1 Key Terminology


    +   * Latent variable. In a more restrictive sense, this is unique to factor analysis
    methods, and refers to a variable that is created, this is not observed in the
    dataset. In fields such as sociology and psychology, there is a long history of
    defining the philosophical and statistical foundations to a latent variable (see
    Borsboom, Mullenberg, & Van Heerden, 2003).

    * Weighting. The use of some method to assign a numeric value to generate a composite
    (i.e., in factor scores) or predictions (in regression). In the simplest case,
    one can use unit weighting, where the contribution of each variable to the creation
    of a composite score is equally weighted (i.e., sum score).'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Machine Learning for Social and Behavioral Research


    +   - Factor loading. The regression relationship from a latent variable to an
    observed variable. The magnitude of the loading indicates how representative the
    observed variable is of the latent variable.


    +   - Residual or unique variance. While the term residual is more often used
    in regression to denote the variance in Y not accounted for by the X''s, the *unique
    variance* refers to the variance in an observed variable not accounted for (or
    related to) the latent variable. This is often thought to comprise both error
    and specific variance.


    +   - Factor score. A score derived to represent a latent variable in SEM. Since
    there is no unique way to assign scores at the individual level for a latent variable,
    a number of methods have been developed to generate factor scores. These scores
    can be used in follow-up analyses.


    +   - Node. In variable network models, each node represents an observed variable,
    with the edges denoting the strength of partial correlation.


    +   - Item response. A methodology closely related to factor analysis (IRT) that
    focuses on the specification of latent variables. While the methods have a large
    degree of overlap, the primary distinctions that IRT is more often used to model
    categorical items and in the administration of scales for educational or psychological
    testing.


    +   - Precision matrix. The precision matrix is the inverse of the covariance
    matrix, with each entry denoting the partial correlation. This is used as the
    basis of variable network models.


    # 7.2 Defining Measurement Error


    The concept of measurement error can be defined in both broad and narrow contexts,
    and usually dictated by the type of errors usually encountered in that specific
    discipline. More generally, following classical test theory (see Kroc & Zumba,
    2020 for alternative formulations), we can define observed scores on a variable
    as a sum of both a true score and some degree of error,


    ```

    X = T + E, (7.1)

    ```


    where X is the *observed score*, T is the *true score*, and E is the *error score*
    with a mean of zero, meaning that X does not differ systematically from T1. A


    > ^1Number of more complex models for measurement error that do not make this
    assumption are available.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Machine Learning and Measurement


    second assumption is that covariance between E and T is zero, and this is termed
    nondifferential error. Differential error, or the cost that the degree of error
    is conditional upon one true value of T, is more commonly studied outside of psychometrics.


    This formulation is based on classical test theory, with T typically thought to
    represent an unobserved latent score. In a large part of social and behavioral
    research, the necessity of assessing measurement error is a result of the inability
    to measure constructs directly. For instance, neither depression is directly observable,
    thus they are considered latent variables. We infer some''s score on each of these
    latent variables through the use of multiple indicators (in the form of a scale),
    with each item created to directly assess the latent construct of interest (e.g.,
    the Beck Depression Inventory). To understand the degree of precision in $X^2$
    we to decompose the variances of each component of Equation 7.1 to get at the
    concept of reliability,


    ```

    $reliability = \frac{\sigma_T^2}{\sigma_X^2} = \frac{\sigma_T^2}{\sigma_T^2 +
    \sigma_\epsilon^2} = \rho_{X,T}^2 \quad (7.2)$

    ```


    From this, we can see that the closer the scores on X are to T, the higher the
    reliability coefficient, $\rho_{X,T}^2$. Conversely, we can discuss reliability
    in terms of variance, with X having higher reliability when the majority of its
    variance is due to T, not E.


    # 7.3 Impact of Measurement Error


    To understand the impact of measurement error, we focus on modeling the relationship
    between an outcome Y, and a set of error-prone predictors $X_j$.


    # 7.3.1 Attenuation


    In the simplest case of estimating the correlation between Y and X1, measurement
    error attenuates the association between $X_1$ and Y by the degree of error, or
    $1 - reliability$, of $X_1$. For example, if the true correlation $X_1$ and Y
    is 0.5, the variance of $X_1$ is 1, the expected regression coefficient between
    $X_1$ and Y would be $0.5 \times \sqrt{\rho_{X_1}^2}$. Attenuation of regression
    coefficients due to measurement error in predictors in linear regression modeling
    has been well understood by methodologists in the social and and


    > $^2$The idea of reliability in the social sciences is analogous to precision
    in physical sciences.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '174 Machine Learning for Social and Behavioral Research


    behavioral sciences since the beginning of the 20th century (see Carroll, Ruppert,
    Stefanski, & Crainiceanu, 2006; Fuller, 1987).


    # 7.3.2 Stability


    As mentioned in Chapter 5, one of the chief criticisms of decision trees is instability,
    namely, creating decision trees on slightly altered samples (bootstrap samples)
    can result in vastly differing tree structures. To better understand the influence
    of measurement error on the stability of the tree results, we created simple relationships
    between one or two predictors and a single outcome. This allows us to isolate
    the influence of specific factors. Of primary interest was an examination of predictor
    reliability and the strength of relationship between predictor and outcome. Correspondence
    between the machine learning algorithm and the data-generating process has been
    cited as a key influence of stability (Phillip et al., 2018).


    We expect that both the signal between predictor and outcome will influence the
    degree of stability. To examine this, we simulated data according to a one-split
    tree model, with a base model of a normally distributed predictor ($X_{Lat}$),
    and a deterministic prediction of the outcome ($Y$); if $X_{Lat} \geq 0.5$, then
    $Y = 1$; if $X_{Lat} < 0.5$, then $Y = -1$. Based on this relationship between
    $Y$ and $X_{Lat}$, we then followed a latent variable formulation for defining
    observed variables represent $X_{Lat}$. We, created a single manifest indicator,
    $X_{Obs}$.


    ```

    $X_{Obs} = \rho \times X_{Lat} + \sqrt{1 - \rho^2} \times e,$$

    ```


    where $e$ is a vector of normal (standard) distributed errors. The standard-ized
    version of $\rho$ can be the reliability index, where $\rho^2$ represents the
    reliability.


    To keep things relatively simple, we only varied the reliability index of $X_{Obs}$
    (values of 0.8 and 0.5) and sample size (300 and 2000). We would expect that as
    reliability decreases, the tree algorithm is more likely to use different splits
    resulting in reduced stability. Note that we only used the CART algorithm for
    the simulation. For stability, we used a conservative method to assess agreement
    in exact tree structure across a set of bootstrapped trees. This manifests itself
    as:


    ```

    $stability = 1 - \frac{\text{unique patterns}}{\text{Total trees}} (7.3)

    ```


    A unique pattern is defined as two trees having the same number of splits, using
    the same variables and cutoffs for each. The results, averaged across 100 replications
    are displayed in Table 7,1.'
