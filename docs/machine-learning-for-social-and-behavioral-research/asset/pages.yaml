- pgno: 21
  md: '# # Introduction


    # 1.1 Why the Term Machine Learning?


    In this book, we struggled in deciding what term to use: artificial intelligence,
    machine learning, data mining, statistical learning, data science, there are a
    number of additional terms that refer to more specific families of algorithms,
    each of which is in line with the perspective that this book takes: deep learning,
    natural language processing, generative modeling, and others. Many of the distinctions
    in terminology refer to the characteristics of the data that the algorithms are
    optimized for. For instance, natural language processing refers to the modeling
    of text, where the text can be extracted from speech, or the words used to answer
    an open-ended question. Although distinctions between the terms machine learning
    and data mining have been made, we see little benefit in trying to parse overarching
    labels. Instead, we use the term machine learning, as this has become the common
    term of use in social and behavioral research. To this end, we can better understand
    the perspective of this book by assessing the types of data we detail.


    The datasets detailed in this book are exclusively observational and include both
    cross-sectional and longitudinal data. While Chapter 2 highlights the role of
    theory and the practice of science involved when applying machine learning, Chapter
    3 moves directly into all of the steps and methods for producing truthfully results.
    Chapters 4 through 6 focus on the research scenario where there is a single question
    and several predictors. We view beyond this and detail methods that can model
    multivariate (multiple) data, such as factor analysis (Chapter 7), structural
    equation modeling (Chapter 8), and mixed-effects models (Chapter 9). Further,
    a theme in this book is the identification of heterogeneity, namely, imposing
    or searching for some form of group structure to the data. We discuss this in
    Chapter 10 in relation to mixture models and structural equation models. We move
    beyond these more traditional forms of data in both Chap'
