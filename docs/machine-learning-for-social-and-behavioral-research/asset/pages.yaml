  md: '# # 12

    Introduction to Social Network Analysis


    Although the history of social network analysis can be traced back to 1930s (Moreno,
    1934) when graphs were used to visualize social communities, it only became a
    popular interdisciplinary research topic in statistics, sociology, political science,
    and psychology in the past few decades (e.g., Che, Jin, & Zhang, 2020; Liu, Jin,
    & Zhang 2018; Saul & Filkov, 2007; Schaefer, Adams & Haas 2013). The popularity
    of social network analysis is attributed to its distinct features in data and
    analysis techniques that differ from traditional methods used in social and psychological
    research. The primary information of a social network is the interrelations (often
    called edges, connections, links, or paths) among a group of participants (often
    called nodes, vertices, entities, actors, or individuals) (Wassermann & Faust,
    1994). In this chapter we introduce basic techniques for social network analysis
    including network visualization, basic network analysis, and network modeling.
    In particular, we will demonstrate how to apply these techniques through the analysis
    of a set of real network data introduced in the following section.


    # ## 12.1 Key Terminology


    +   - Node. Also referred to as vertices, entities, actors, or individuals. This
    refers to the actual people in the network.

    - Edges. Also referred to as ties, connections, links, or paths. This refers to
    the inter-relationships between nodes.

    - Binary network. Most common type of network in social network analysis. This
    refers to edges either being present or not present in the network. For our data,
    people can be friends or not friends. In other types of networks, the edges can
    represent strength values, such as the commonly used partial correlation networks.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Introduction to Social Network Analysis


    +   - Sparse. It is common for social networks to be sparse, meaning most people
    are not related to others.


    +   - Network size. Number of nodes in a network.


    +   - Density. Total number of edges divided by the number of possible edges.


    The structural pattern of relationships of nodes is naturally the target of typical
    social network analysis. For instance, in a friendship network or a Facebook network,
    some people are closer to each other and thus form small friendship networks.
    The inherent patterns in dyadic ties are very informative and provide researchers
    opportunities to understand actors not only from their attributes but also from
    the social environment around them.


    Social network analysis has methodological advantages to other data analysis such
    as dyadic data analysis. In traditional dyadic analysis, only data with relations
    are collected. Social network data, however, consist of both dyads with social
    relations and dyads without social relations. Therefore they allow researchers
    to better understand dyadic relations. For example, sociologists and personality
    psychologists are often interested in the association between friendship and personalities
    (Asendorf & Wilpers, 1998; Youyou, Stillwell, & Schwartz, 2017).


    In the existing studies, only data with friendship relations are available and
    used in an analysis, as dyadic data without friendship are often not available.


    Therefore, any conclusion may only reflect the situation with the friendship relation.
    Social network analysis, in contrast, can better understand an individual''s behaviors
    through connections between entities/subjets in a bounded network (Otter & Rousseau,
    2002).


    Network analysis techniques have been applied in many disciplines. For example,
    in economic research, network techniques have been used to address the social,
    economic, and technological worlds are connected (Easley & Kleinberg, 2010). In
    epidemiology, network analysis is used to analyze the emergence of infectious
    diseases, such as the acute respiratory syndrome (Berger, Dros, Doert, Stuurmer,
    & Premier 2004). In political science, researchers have investigated how social
    networks influence individual political preferences (Lazer et al., 2010; Ryan,
    2011). In sociology, Dean, Bauer, and Prstein (2017) studied the factors leading
    to friendship dissolution within a social network. In education research, social
    network analysis has been used to detect and prevent bullying among students (Faris
    & Felmlee, 2011). In psychology, social network analysis'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'can inform behavioral interventions using the information from a network (Maya-Jariiego
    & Holgado, 2015).


    # 12.2 Data


    For the purpose of illustration, in this chapter, we will analyze a set of data
    collected by the Lab for Big Data Methodology at the University of Notre Dame.
    The data were collected from students in the Art and Design major in a four-year
    college in China. There were a total of 181 students in this major with six different
    study concentrations. The data collection was conducted in May 2017 after the
    approval of the Institutional Review Board (IRB) at the University of Notre Dame,
    when the students were at the end of their junior year. In this section, we will
    first introduce the information collected and then discuss data structures to
    store the network data.


    # 12.2.1 Data Collection


    During the data collection, each student was given a roster of all the 181 students
    and was asked to report whether he/she was a friend on WeChat with other students.
    WeChat is currently the most popular social network platform in China. Two students
