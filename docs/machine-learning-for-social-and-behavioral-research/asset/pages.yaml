    # 11.9.1 Further Reading


    +   - One popular text mining method that was not covered in this chapter is latent
    semantic analysis (LSA), also known as latent indexing; Dewehr, Deerwester, Dumais,
    Landauer, Furnas, and Harshman, 1990; Foltz, & Latham, 1998), a method that falls
    under the umbrella of topic modeling and is very similar to LDA. Essentially the
    difference between LSA and LDA can be boiled down to PCA versus LCA. Whereas PCA
    is a dimension reduction technique, mixture models such as LCA are generative
    models, meaning we are clustering words and topics by topic. Although very similar
    in practice, we see LDA applied to a greater extent and has spawned additional
    extensions which can be applicable to social and behavioral research. We do not
    dive further into this given space concerns, as well as the relative of comparison.

    - The most popular dictionary-based approach in psychological search is the Linguistic
    Inquiry and Word Count (LIWC); Pennebaker,'
