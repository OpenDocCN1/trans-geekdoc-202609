  md: '# Machine Learning for Social and Behavioral Research


    models run, can have a significant impact on analysis runtime. Particularly when
    using nested cross-validation, the runtimes can easily double. This has been mentioned
    as a key drawback of this approach, and in some situations minimal improvements
    in bias over k-fold are overshadowed by the increase in computational time (Wainer
    & Cawley, 2021). The easiest way to speed up this is to run this process in parallel,
    which caret makes relatively easy, as it defaults to using parallel processing
    as long as the user has set the R environment with a specific number of cores
    allocated (see the caret manual dedicated to this topic: https://topepo.github.io/caret/parallel-processing.html).
    While the caret package facilitates the use of k-fold, repeated k-fold, and bootstrap
    sampling, one has to write their own routine for nested CV. An example script
    is provided in the supplemental material. Finally, when the outcome of interest
    is not continuous, it is necessary to alter the default code or change the class
    of variable to invoke the use of loss function unique to the output type. There
    are many ways to do this, and many R packages will guess the outcome type based
    on the class assigned in R. By default, integer and numeric classes invoke regression,
    while nominal or factor variables default to classification. This is particularly
    important when assessing fit metrics with confusionMatrix, and can often require
    the specification of named levels to the factor variable. However, this behavior
    differs by package, and a more straightforward way (in most R packages) to change
    the loss function is to specify the family=, which is further discussed in Chapter
    4.'
