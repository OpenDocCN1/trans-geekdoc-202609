    # 5.2 Introduction


    Decision trees were first introduced in the 1960s by Morgan and Sonquist (1963).
    However, the use of the method did not capture the attention of the statistics
    community until 20 years later with the work of Breiman, Friedman, Olshen, and
    Stone (1984). First termed automatic interaction detection, the purpose of the
    algorithm was to efficiently identify interactions when the number of predictors
    was large. In large datasets, the sequential testing of a large number of models
    and possible combinations of variables quickly decreases the statistical properties
    of the models (i.e., false positives; Morgan, 2005).


    As there are a number of variants to decision tree algorithms, we refer to decision
    trees as the umbrella methodology, and refer to specific algorithms that fall
    under this decision trees terminology as such. For instance, the most popular
    variant of decision trees is classification and regression trees (CART, Breiman
    et al., 1984). Note that classification and regression trees is also commonly
    used to refer to decision trees, while CART refers to a specific algorithm.


    Decision trees'' popularity can be attributed to their easy-to-understand tree
    structure, that mimics the way that humans make decisions. We elaborate on this
    further below. To create a tree structure, the predictor space into all possible
    unique values. Across these unique values, the algorithm iteratively partitions
    the dataset to determine an improvement in model fit. This involves placing each
    observation into one of two groups, of which each member receives the same predicted
    response. The actual partitioning of the dataset functions differently based on
    the type of each predictor variable. For quantitative variables, each unique value
    is tested in order: For example, if predictor values range from 50 to 100, the
    process is as follows: Everyone with a predictor value equal to 50 versus everyone
    with a predictor value greater than 50, then everyone with a'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Decision Trees


    predictor value equal to 50–51 versus everyone with greater than 51, until every
    possible successive value is tested in this manner. Given $m$ unique sorted values,
    this involves testing $m-1$ unique splits. For nominal variables, as there is
    no ordering to the values, all possible groupings are tested. If there are $m$
    categories, this involves testing $2^{m-1}-1$ dichotomous splits. Particularly
    for predictors with large categories, this can quickly become computationally
    burdensome.


    Predictions derived from the tree structure are then compared to each observation''s
    actual response to error (model misfit). For continuous outcomes, this is generally
    mean squared error, for categorical it can be accuracy or two alternatives, such
    as entropy or the gini index. After every possible partition has been tested,
    and an error is calculated and assigned to this specific partitioning, the split
    that results in the largest reduction in error is chosen. Effectively, the algorithm
    has created two datasets: dataset A contains every observation that adheres to
    one side of the best splitting rule and dataset B contains all observations.


    At its core, decision trees are an analytical method for creating subgroups. This
    assumes that identifying heterogeneity (creating subgroups) with respect to the
    observations in the sample will explain some portion of the outcome.


