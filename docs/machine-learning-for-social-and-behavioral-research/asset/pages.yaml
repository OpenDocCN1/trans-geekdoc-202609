    # 5.5.3 Stability


    The principle of decision trees is that they are unstable (Breiman, 1996b). This
    instability occurs when small changes in the dataset produce large changes in
    the final model (Breiman, 1996b). Instability makes the choice of the final model
    more difficult, while also imparting doubt into the generalizability of the results,
    particularly in comparison to a method that produces more stable results. Much
    of the case for concern for the instability of decision trees can be attributed
    to their reliance on binary splits. Problems caused by binary classification is
    not unique to decision trees. For instance, in mental illness diagnosis, low reliability
    in rater'
