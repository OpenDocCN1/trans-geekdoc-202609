  md: '# The Principles of Machine Learning Research 27


    # 2.5.1 Model Size


    The question of assessing the degree of confirmation becomes more difficult in
    the case of complex models, such as SEMs, dynamical systems, and network models.
    Simply put, the simplicity of stating and testing hypotheses in traditional experimental
    designs does not translate to complex models. As the number of variables increases,
    and the models grow in size, it becomes increasingly difficult to specify hypotheses
    that account for every aspect of the model. Simply stating a one-line hypothesis
    and one-line alternative hypothesis no longer holds. With larger models comes
    more ways to wrong, thus rejecting a hypothesis. As a result, conformity comes
    to mean something else in these situations, taken as a straw man argument. Instead,
    by saying confirmatory really mean a minimum degree of specification—not exploratory.
    As models grow, this becomes more and more torture, until the word confir ceases
    to mean anything.


    This difficulty may be a contributing factor for why there is a dearth of complex
    models in social and behavioral publications. This leads to the specification
    of many simple relationships. For instance Lieberman and Cunningham (2009) found
    that a randomly issue of the Journal of Personality and Social Psychology had
    an average of 93 statistical tests performed per paper.


    An additional contributing factor is an explicit bias against complexity—thus
    there is a preference for parsimony. One hallmark of this viewpoint comes from
    Box (1976):


    > Since all models are wrong the scientist cannot obtain a "correct" one by excessive
    elaboration. On the contrary William of Ockham he seek an economical description
    of natural phenomena. Just as the ability to devise simple but evocative models
    is the signature of the greatest scientist so-elaboration and overparameterization
    is often the mark of mediocrity. (p. 792)


    Selecting the correct model is indeed extremely difficult and there are a number
    of competing factors that influence the model selection (see Chapter 3); however,
    this is in contrast to more recent emphasis on embracing complexity (e.g., Fried
    & Robinaugh, 2020). If you think of brain functioning as an infinitely complex
    set of interactions with Brodmann, 1994, the question becomes, how can we understand
    various subspecies without the use of extremely complex algorithms or models?
    The traditional ideal has been to test subcomponents of processes thought to be
    be extremely complex, as this more narrow evaluation should generalize to an integration'
