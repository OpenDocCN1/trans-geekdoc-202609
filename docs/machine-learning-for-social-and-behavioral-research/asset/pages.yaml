    # 8.5.2 Exploratory SEM


    In specifying a common factor model, it is common to use either a priori factor
    analysis model if all the factor loadings have a prior justification, or specify
    an exploratory factor analysis model if uncertainty is inherent in the factor
    structure. Often, the prespecified CFA model will fit poorly as the imposed factor
    structure is too simplistic to adequately a more flexible approach such as EFA.
    One major drawback of EFA is that it cannot be combined with other types of paths,
    such as regression or residual covariances, necessitating the use of this model
    for a prediction context. One method that overcomes this limitation, incorporating
    additional types of parameters while estimating an EFA model among specific variables,
    is exploratory SEM (ESEM, Aparparov & Muthen, 2009). When using latent variables
    to predict an outcome of interest, the use of ESEM has shown good performance
    in the presence of small factor loadings that aren''t specified in a CFA model,
    but captured by the EFA portion of the model (Mai, Zhang, & Wen, 2018). To determine
    if a more flexible specification of the latent variables underlying the personality
    variables can improve our prediction of Grit, we used ESEM while varying the number
    of latent variables extracted in the exploratory portion of the model. This model
    with five latent variables extracted from the personality variables is displayed
    in Figure 8.8.'
