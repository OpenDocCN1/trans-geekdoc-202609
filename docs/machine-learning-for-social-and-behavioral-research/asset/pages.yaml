  img_proc: true
- pgno: 66
  md: '# Machine Learning for Social and Behavioral Research


    What we do have some degree of control over modeling an outcome is *Bias* refers
    to whether our estimates and/or predictions are, on average (across many random
    draws from the population), equal to the true values in the population. *Variance*,
    on the other hand, refers to the variability or precision of these estimates (see
    Yarkoni & Westfall, 2017 for further discussion). Practically speaking, we want
    unbiased and low variance, however, both can be achieved in practice.


    One practical in which bias and variance function can be demonstrated with the
    use of linear regression. If the true function is linear, linear regression model
    will be unbiased. However, there are many types of relationships that do not follow
    a strictly linear function—in these cases linear regression will be biased as
    it is not flexible enough to model the underlying relationships. Given this, it
    would be necessary to test more complex models, such as polynomial regression.
    In polynomial regression, the amount of flexibility is controlled by the degree
    or order of the polynomial term, thus making it necessary to test multiple values
    to determine which is most appropriate for the data. This concept of varying a
    parameter that controls the behavior of an algorithm is referred to as a *tuning
    parameter* (also known as a hyperparameter).


    Tuning Parameters Tuning parameters refer to the “settings” of each algorithm
    that controls the behavior (flexibility) of each algorithm. As may be the easiest
    example, we can view polynomial regression as an overarching algorithm, with various
    options for controlling the degree of power. For instance, using all the way up
    to a 20th degree. The degree of model is referred to as the tuning parameter for
    this type of algorithm. Typically, these tuning parameters are placed in a vector
    and then either in sequence or in parallel to determine a model fit for each value,
    often assessed with cross validation (CV). With our prior discussion of model
    selection, this can select within one type of algorithm (e.g., degree of polynomial
    fits best), or across different types of algorithms (e.g., linear regression versus
    decision trees).


    We demonstrate this with the APE Exposure data, subsampling (50 observations)
    the original training set and fitting algorithms, one that is not flexible enough
    (linear regression), and one that is too flexible (polynomial regression with
    up to an eighth degree). We can assess variance by how much the parameter estimates
    vary across 100 subsamples, which indicates how the underlying functional form
    varies. This is displayed in Figure 3.7.'
