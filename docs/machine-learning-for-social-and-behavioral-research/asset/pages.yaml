    # # 4.4 Regularization


    There exist a multitude of reasons to perform variable selection in regression.
    As we discuss later in the chapter, one is a subset of variables that may have
    lower error when evaluated on a holdout (alternative) sample. Alternatively, we
    may have more predictors than we are willing to interpret, thus we use variable
    selection for a more parsimonious representation. At its extreme, in neuroscience
    or genetics research, we may have more predictors than we do observations. In
    this scenario we must perform some form of dimensionality reduction. Finally,
    our purpose for variable selection may be more practical. If we wish to develop
    a screening method to be used in contexts outside of research, time is often of
    the essence the smaller the number of variables to measure, the better.


    Given our desire to perform variable selection, we must choose among a myriad
    of methods available that were developed for this purpose. In the tradition in
    the social and behavioral science, some form of stepwise selection is often used.
    Built as a computationally simpler approach than best subsets, either backward
    elimination or forward selection only requires $p$ models run, where $p$ is the
    number of predictors. Best subsets on the other hand require $2^p$ number of models
    to find the “best” model. For 5'
