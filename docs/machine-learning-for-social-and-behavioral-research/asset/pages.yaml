- pgno: 37
  md: '# The Principles of Machine Learning Research


    degree of research foundation, some purely inductive research is unlikely. Instead,
    research combines some degree of theoretical backing and uncertainty. Our purpose
    in highlighting abduction is that a large portion of research is motivated by
    identifying conclusions that synthesize competing or previously disconnected findings
    or perceptions.


    In social and behavioral research, data are very rarely the main unit subjected
    to explanation; instead research tries to explain effects (van Rooij & Baggio,
    2021), phenomena (e.g., Haig, 2014), or more broadly, empirical relations. Thus,
    there are really two steps in this process. First, there is an identification
    of facts, effects, phenomena, or relations, which is followed by the explanatory
    phase. Using Brahmaier et al. (2017) as an example, the phenomena could be identified
    as: quadratic growth in well-being trajectories. Building on this, it is up to
    machine learning to discern multiple explanations for these well-being trajectories
    in the form of validated covariates. Assessing among these empirical relations
    to identify which are most pertinent allows researchers to derive more synonymous
    explanations for phenomena, by whittling away those factors that explain less
    in a conditional as opposed to unconditional success.


    A number of papers that attempt to place machine learning among scientific methods
    focus too much on the ultimate goal of aligning hypotheses with observations in
    an explanatory framework (Haig, 2019; Cabrera, 2020), to the detriment of understanding
    the aims of machine learning, which most often align with prediction or with the
    identification of what is termed observation or fact. To provide an example, we
    detail the application of machine learning to suicide research, which has seen
    a number of applications (see Burke, Ammerman, & Jacobucci, 2019) with varying
    degrees of predictive success (see Jacobucci, Littlefield, Milner, Kleiman, &
    Steinkel, 2021). While prediction is ultimately the main goal in research is to
    derive a better understanding of which the theoretically informed predictors are
    most important, and which these demonstrate nonlinear relationships (be Burke
    et al., 2019 for examples). As most theories of suicide are relatively simplistic
    (e.g., involving a handful of variables), establishing the relative importance
    of specific relationships and identifying their functional form can then be used
    to provide greater specificity to these theories. Further, while some research
    posits that there needs to be a causal-nomological connection between two variables
    in order to trust this relationship for prediction purposes (Cabr, 2020), in most
    research scenarios this is obviated by the process in which the variables were
    selected, as most only collect theoretically relevant variables.'
