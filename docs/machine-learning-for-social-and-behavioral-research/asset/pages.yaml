  md: '# # 11 Introduction to Text Mining


    Although we typically work with quantitative numerical data, qualitative text
    data can be even more common. The text data can come from many different sources.
    For example, in research using surveys or question-nnaires, free response items
    are frequently used to solicit feedback or response to open-ended questions such
    as ''What are you worried about?'' (Roher, Bummer, Schmücke, Goebel, & Wagner,
    2017). In diaries, a daily record may be kept by the respondent at a researcher''s
    request (Oppenheim, 1968). The record can include writing about the activities
    and feelings of a day. Text data can also come from the transcription of audio
    and video conversations from experiments (Bailey, 2008). Nowadays, social media
    sites provide even more information that can be used to address new and innovative
    questions. For example, Jashinsky et al. (2014) analyzed more than 1.6 million
    tweets to identify at-risk tweets to suicide risk factors in real time. Studies
    also showed that Facebook posts and likes can be used to predict personality (Marshall,
    Lehrhausen, & Ferenci, 2015; Wu, Kosinski, & Stillwell, 2011). Many statistical
    methods and techniques have been developed to analyze qualitative data. Although
    methods are available for text data analysis, researchers are less familiar with
    them. In this chapter, we will discuss several methods for dealing with text data.


    # ## 11.1 Key Terminology


    +   - Sentiment. Assessment the valence (positive/negative) of words used in a
    response or document.


    +   - Topic. Latent dimensions extracted from a document or response.


    +   - Dirichlet. A probability distribution used to model the relationship among
    latent topics in Dirichlet allocation (LDA).


    +   - Document. An observation''s text response. This can range from a single
    sentence to an entire book. Most applications in text mining'
  merge: -1
  img_proc: true
