    # Is the AUC Biased with Imbalanced Outcomes?


    Some have questioned the use of the AUC when outcomes are imbalanced (Lobo, Jiménez-Valverde,
    & Real, 2008; Saito & Rehsmeierier, 2015). Particularly, problems can occur when
    examining specific areas of the ROC plot. To demonstrate this, we simulated data
    according to different levels of class imbalance. We started with a relatively
    balanced dataset of 200 positive cases and 400 negative cases. The true cases
    were simulated to have uniform 0–1 probabilities of belonging to the positive
    case: 200 negative cases were simulated with zero probability of belonging to
    the positive class, with the additional 200 true negatives simulated to have uniform
    9–1 probabilities of belonging to the positive case. In this condition, the AUC
    was 0.64. In a second condition, we added 160 true negatives, all simulated to
    have uniform 0–1 probabilities. In this condition, the AUC was 0.84.


    To understand why we get higher AUC by adding cases, recall the underlying definition
    of the AUC: The probability that a randomly selected sample has a higher predicted
    probability than a randomly selected sample. Namely, in looking at the right panel
    of Figure 3.17, we can see that at higher thresholds (> .7), our sensitivity plummets,
    without much of an effect on the specificity. This occurs due to the structure
    of the simulated data, with 200 negative cases having extremely high predicted
    probabilities and the positive cases having few high predicted probabilities.'
