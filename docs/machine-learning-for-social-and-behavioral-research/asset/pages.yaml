- pgno: 85
  md: 'The Practices of Machine Learning


    # 3.7.1 Sampling


    A number of strategies have been developed to sample from either the positive
    or negative class, or both, to create new distributions that are more balanced.
    The simplest are random oversampling (ROS) and random undersampling (RUS). While
    ROS randomly samples from the minority case to produce an equal distribution of
    positive and negative cases, RUS randomly removes majority cases to produce an
    equal distribution. A more sophisticated approach that has a large degree of study
    is the synthetic oversampling technique (SMOTE; Chawla, Bowyer, Hall, & Kegelmeyer,
    2002). SMOTE is similar to ROS, but instead of duplicating positive cases, SMOTE
    creates artificial minority cases by using the k-nearest neighbors for a given
    case. Specifically, for a particular case i, the SMOTE algorithm finds k similar
    minority cases to and generates synthetic cases with predictor values that represent
    a blend of the k-nearest neighbors.


    Among the simple sampling strategies, ROS is preferred over RUS (e.g., Batista,
    Prati, & Mauro, 2004; Ba, Maki, & Mazurowski, 2018). Further, SMOTE has been generalized
    into a large number of variants, while additional strategies have also been developed
    to generate synthetic cases. A recent study of these strategies found that any
    form of oversampling performs better than no sampling, with the best performance
    attributed to more recent generalizations of SMOTE. The majority of the studies
    that have evaluated sampling methods have used benchmark datasets from computer
    science, making the generalizability of the findings to social and behavioral
    research questionable. Two recent papers focused on evaluating these strategies
    in simulated data that are in line with social and behavioral research (Goerbergh
    et al., 2022; Jacobucci & Li, 2022). While Goerbergh et al. (2022) found detrimental
    effects of sampling strategies with respect to calibration (defined below) and
    did not lead to better AUC values than no sampling. Jacobucci and Li (2022) found
    only slight benefits to the use of sampling strategies for both the AUC and AUPRC,
    and of the sampling strategies, ROS performed as well if not better across conditions
    than SMOTE. Note in Jacobucci and Li (2022) is that they also tested the random
    over sampling examples (ROS; Menardi & Torelli, 2014) which is implemented in
    the caret. package performs along with SMOTE. Notably, that ROS performs poorly
    in some conditions and is not a recommended approach.


    Based on the large number of studies that have evaluated the use of sampling in
    other domains, and the two recent papers that are more relevant to social and
    behavioral research, we recommend the use of ROS when dealing with imbalanced
    outcomes. The use of oversampling nullifies the'
