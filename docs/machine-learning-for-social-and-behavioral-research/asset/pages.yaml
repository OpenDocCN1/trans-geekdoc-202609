  md: '# Searching for Groups


    +   * Both mixture models and decision trees have been proposed as methods to
    identify violations of invariance in structural equation models. See Wang et al.
    (2021) for a recent applicaton of mixture models and Bollmann, Berger, and Tutz
    (2018) for an application of trees in response theory (IRT) models. IRT can be
    seen as an equivalent statistical framework for SEM, of which there are analogous
    integrations with machine learning algorithms, most notably rich literature on
    applying trees to detect measurement invariance violations (termed differential
    item). The main distinction lies in the software implementations, of which a number
    of packages in R that pair trees and IRT models are available (e.g., De Boeck
    & Patchev, 2012).


    +   * One common theme of this book was not present in this chapter is the idea
    of cross-validation. While cross-validation has been applied in mixtures (Grimm
    et al., 2017) and SEM trees (method = “cv” in the semtree package), the computational
    time is prohibitive in both methods. Similar to pairing regularization with SEM,
    the focus of selecting a final model has been on the use of information criteria
    that include penalties for model complexity as a mechanism to approximate holdout
    sample fit.


    # 10.4.2 Computational Time and Resources


    For mixture models, we highly recommend using Mplus as it is the most comprehensive
    set of tools available and is among the most efficient piece of software for latent
    variable models. With this, the amount of time it takes to run mixture models
    is typically a result of the base model size (in FMM) and the number of classes
    extracted. For the models in this chapter, most mixture models only took a few
    minutes to run. In contrast, SEM trees and SEM forests tend to take longer. The
    main factor in run is how long it takes to run the base SEM. Additionally, the
    number of covariates and tree depth dictates the number of models that are tested.
    Typical runtimes range from minutes to a couple of hours, whereas SEM forests
    tend to take on the order of multiple hours since it is repeating the process
    of running SEM trees 100 times (when number of trees is set to 100). SEM forests
    can be run in parallel in the semtree package, which can significantly cut down
    on the run-time.'
