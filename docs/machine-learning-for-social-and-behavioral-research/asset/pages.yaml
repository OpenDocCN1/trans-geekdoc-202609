  md: '# Machine Learning with Mixed-Effects Models


    maier (2020a) integrated the CART algorithm with Mplus to allow for more complex
    multilevel models within each node (e.g., multivariate outcomes).


    # Software


    The first software package was developed by Abdoleol et al. (2002), who utilized
    the macro language in SAS and the PROC MIXED (Singer, 1998) procedure. Their implementation
    was then developed into the R package LongRPart (Stewart & Abdoleol, 2012), which
    paired the classification and regression tree algorithm from rpart (Therneau &
    Atkinson, 2019) with the lme function from the nlme (Pinheiro et al., 2017) package.
    While this package is no longer available in R, Jacobucci, Abdoleol, Serang, and
    Stemann (2017) updated this package, and it is available as the LongPart2 package,
    which also allows for nonlinear mixed-effects models through the integration with
    nlme package (Pinheiro et al., 2017). The GLM tree algorithm is available in the
    glmtree package, and combines the conditional inference tree algorithm from the
    partykit package (Hothorn et al., 2006) with the lme4 (Bates, Mechler, Bolker,
    Walker, 2015) package for mixed-effects models. The RE-EM tree algorithm from
    Sema and Simonoff (2012) is available in the REEMTree package, which uses the
    CART algorithm; however, adjustments can be made to integrate the conditional
    inference tree algorithm (see http://people.stern.nyu.edu/simon/unbiasedREEM).
    Lastly the MplusTrees package (Serang et al., 2020) is available in R, which integrates
    rpart with Mplus; however, the Mplus software (Mühen, Muthén, 2017) is necessary
    to use the MplusTrees package.


    # 9.3.2 Algorithm


    In this chapter, we focus on the standard recursive partitioning algorithm (from
    rpart) and allow for a researcher-specified mixed-effects model within each node
    (as opposed to the indicator approach in RE-EM tree). Given a mixed-effects model
    and a set of predictor (partitioning) variables, the algorithm proceeds in the
    following steps:


    +   1. A stopping threshold $k$ is specified, where $k$ represents the minimum
    improvement in the -2LL to retain a partition data.


    +   2. The mixed-effects model is estimated using the full sample and the -2LL
    is retained. This is referred to as the root (-2LL).


    +   3. Set base(-2LL) to root (-2LL).'
  merge: -1
  img_proc: true
- pgno: 248
  md: "4. Given a numeric partitioning variable, $w_{li}$, the data are partitioned\
    \ based on each unique value $c$ of the variable ($w_{li} < c$ versus $w_{li}\
    \ \\geq c$).\n\n5. The mixed-effects model is estimated on each partition, the\
    \ two $-2LL$ are obtained, and referred to as $node_i(-2LL)$ and $node_j(-2LL)$.\n\
    \n6. The $-2LL$ for the partition $(node(-2LL))$ is calculated as $node(-2LL)\
    \ = node_i(-2LL) + node_j(-2LL)$.\n\n7. Steps 4, 5, and 6 are repeated for each\
    \ variable in the predictor set.\n\n8. If $(-2LL) - node(-2LL) < k$ for all partitions,\
    \ then the algorithm is stopped and the data are not further partitioned.\n\n\
    9. If $(-2LL) - node(-2LL) > k$ for some set of partitions, then the data are\
    \ partitioned based on the predictor variable and value that resulted in the greatest\
    \ improvement in $-2LL$ (e.g., $min(node(-2LL))$).\n\n10. Steps 3 through 9 are\
    \ repeated within each node with $base(-2LL)$ and $node_i(-2LL)$ for each child\
    \ node, respectively.\n\nThe stopping threshold $k$ can be set to a specific value\
    \ (e.g., 20) or based on the root $(-2LL)$. For example, $k=0.01 \times (-2LL)$,\
    \ such that the improvement in model fit must be greater than 1% of the $-2LL$\
    \ when the model is estimated on the full sample. At a minimum, $k$ should be\
    \ set equal to $\\lambda \\sigma(p)$, where $p$ is the difference in the number\
    \ of estimated parameters when partitioning the data.\n\n# 9.4 Regularization\
    \ with Mixed-Effects Models\n\nA second machine learning technique that has been\
    \ integrated into the mixed-effects modeling framework is regularization—primarily\
    \ used with the lasso penalty for variable selection. In regularized mixed-effects\
    \ models, fixed-effects parameters are often penalized to examine which effects\
    \ should be retained in the model; however, approaches have also penalized random-effects\
    \ parameters to determine which slopes should be random and which slopes should\
    \ be fixed (estimated without a random component). The parameters in regularized\
    \ mixed-effects models are found by minimizing the $-2LL$ with a penalty for the\
    \ size of model parameters. Then is, the $-2$ log-likelihood for the mixed-effects\
    \ model is\n\n```\n$$-2LL = n \\log(2\\pi\\sigma_0^2) + \\log(I + ZZ^T') + \\\
    frac{1}{\\sigma_0^2}(y_i - X\\beta)'(y_i - X\\beta) \\quad (9.5)$\n```"
