    # 3.3 Model Fit


    Central to every analysis is the question: “How well did we do?” or “How well
    does our model fit?” Both questions relate to the performance or fit of our analysis.
    With respect to the outcome, our analysis can either utilize a univariate (singular)
    or multivariate (multiple) outcome. Most analyses in machine learning are concerned
    with the case of modeling the relationship between multiple predictors and a univariate
    outcome. The first half of the book focuses on this case, while the second half
    focuses on the multivariate outcome case. This involves the use of one or many
    values or statistics. Different fit statistics or indices can be used when evaluating
    a model fit. In the case of a continuous outcome (regression), this is usually
    the mean squared error (MSE) or R-squared. When the outcome is categorical (classification),
    either taking the form of two or more finite values, we can use a statistic such
    as accuracy, or what percentage of cases we correctly assign the correct class
    or label. For categorical outcomes, there are a whole host of additional metrics.


    # 3.3.1 Regression


    To understand the concept of model fit, we will use linear regression with a continuous
    outcome as example. For such a model, we can calculate the mean squared error
    (MSE) as


    ```

    MSE = \frac{1}{n}\sum_{i=1}^{n}(y_i - f(x_i))^2, \quad (3.1)

    ```


    where $y_i$ is the outcome and $f(x_i)$ is the prediction of $f(x_i)$ for observation
    $i$. By taking the square root, we get the root mean squared error (RMSE). We
    can imagine the misfit (MSE) as small as if the predicted and actual outcome for
    observation $i$ are similar. As an extension, we can calculate the commonly used
    $R^2$, which gives us the proportion of variance explained in'
