    \ a popular model for topic modeling. The model reflects the mechanism of writing\
    \ a document as a comment on evaluating teaching. In writing a comment, one might\
    \ first think about the areas or aspects from which to evaluate a professor. For\
    \ example, a student might focus more on the organization of the lectures or the\
    \ difficulty of the tests. These can be viewed as two topics. The student would\
    \ write around the two topics by picking words related to the topics.\n\nWe discuss\
    \ in more detail the LDA process in terms of document generation. Suppose we want\
    \ to generate a collection of documents with a total of $K$ topics. Documents\
    \ within the collection can be viewed as independent of each other. For a given\
    \ document, it can consist of one or all of the $K$ topics with different probabilities.\
    \ $z_{mk}$ be the $k$th $(k=1,\\dots,K)$ topic in the $m$th $(m=1,\\dots,M)$ document.\
    \ $z_{mk}$ takes a value between 1 and $K$. The topics can be generated from a\
    \ multinomial distribution\n\n```\n$z_{mk} \\sim Multinomial(\\theta_m)$\n```\n\
    \nwith the probability $\theta_m = (\theta_{m1}, \theta_{m2}, \\dots, \theta_{mK})$\
    \ for the document $m$. Note that $\\sum_{k=1}^K \theta_{mk} = 1$. For example,\
    \ if there are two topics, $K=2$. For one document, the topic probabilities for\
    \ the two topics can be 0.5 and 0.5; for another document, the topic probabilities\
    \ could be 0.7 and 0.3. The topic probabilities can be viewed as proportions of\
    \ words used to describe the different topics.\n\nOnce a topic is decided upon,\
    \ one organizes words around it. For example, if it is about the difficulty of\
    \ the test, words such as \"easy\" and \"difficult\" might be more likely to be\
