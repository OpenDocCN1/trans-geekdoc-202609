  md: '# Introduction to Text Mining


    relevant to performance. The words can be selected through the joint work of students
    and teachers. Next, the words can be evaluated on whether they are positively
    and negatively related to teaching evaluations and then assigned a score. With
    a sentiment lexicon one can then look up the words in a text and calculate a score
    for the text based on the scores of the words.


    There are many existing sentiment lexicons that can be used for an initial quick
    sentiment analysis such as AFINN, nrc, bing, and suyhet. Depending on which lexicon
    is used, the sentiment scores can differ. Using the existing lexicons, one is
    also encouraged to adjust the lexicon accordingly, for example, adding or removing
    certain words and changing the associated sentiment. One can also combine several
    lexicons for sentiment analysis. The shifting of meanings of sentiment words because
    of modifiers or adversarial conjunctions in general should and be considered in
    sentiment analysis. Our example showed that the consideration of valence shifters
    did improve sentiment analysis.


    Although this section has focused on the positive and negative polarity of text,
    other types of emotion analysis can be conducted. Similarly, one can build a lexicon
    with different types of emotions. In fact, the nrc lexicon has different emotions,
    including anger, anticipation, disgust, fear, joy, sadness, surprise, and trust.
    For example, we selected 10 comments and obtained the emotions of them, as shown
    in Figure 11.22.


    Other types of sentiment analysis can be conducted. The feature/aspect-based sentiment
    analysis can provide finer information than the sentiment analysis discussed in
    this chapter (Eirinaki, Pisal, & Singh, 2012; Qu & Zhang, 2020). In feature-based
    analysis, instead of getting a sentiment score for the whole text, different features
    can be first identified and then sentiment analysis can be conducted for each
    feature. For example, in student comments, one part of comments might focus on
    the teaching style of a teacher but another part focus solely on the personality
