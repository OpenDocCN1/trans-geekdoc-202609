    # 2.3.1 Complexity


    Brandmaier et al. (2017) also highlight an additional question researchers utilizing
    machine learning must answer: What degree of complexity I wish to interpret? Despite
    this, it is common for researchers to seek simple results. This may be exemplified
    in the desire to identify a small number of large effects upon many interrelated
    variables. Not only is this unlikely to occur in practice, particularly in social
    and behavioral data where the variables are all related to one another to at least
    a small degree (e.g., the crud factor; Meeb, 1990), but forcing this structure
    upon the results comes at a price (detailed in Chapter 3). A second way that this
    manifests itself is in the desire to select a final model, treating the results
    as if they reflect the true model. Not only does this strategy negate the fact
    that other models evidence fit are only minutes worse, deserve these models largely
    in functional form (and thus their explanations as to the underlying relationships),
    but it also budgeons nuance in understanding the underlying relationships.


    We borrow the term explanatory pluralism (e.g., Kendler, 2005) to describe the
    common phenomenon of observing multiple algorithms exhibiting identical performance
    along with very little differentiation in the importance of predictor variables.
    In fact for this latter piece, it is a common experience to remove the most important
    predictor from the model and not see an evident change in predictor performance.
    We use the term explanatory pluralism to point out that there are multiple explanations
    for the functional form between predictors and an outcome, as well as which variables
    contribute to the prediction of the outcome. This is obviously not always the
    case, but is more common than not predictors come from interrelated constructs.
    Observing such results makes the study''s original questions and hypotheses exceedingly
    difficult.


    In contrast to most statistical texts that contain empirical examples that are,
