    2. This is in line with interpreting the latent means as estimated in Step 1.
    Class 1 had negative class means (Class 2 latent means were set to 0), thus Class
    1 is lower on both forms of Grit.


    # 10.3 Structural Equation Model Trees


    In Chapter 9 we discussed the pairing of mixed models and decision trees as a
    mechanism for identifying groups in longitudinal data. In this section we provide
    an overview of pairing decision trees with SEM in the form of SEM trees (Brandmaier
    et al., 2013) and forests (Brandmaier et al., 2016). These two methods are within
    the same family of other multivariate methods developed as an integration between
    psychometrics'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'and decision trees (Breiman et al., 1984), including the use of unconstrained
    covariance matrices as outcomes (Miller et al., 2016) and nonlinear mixed-effects
    models (Stegmann et al., 2018), among others. As SEM can be a general family of
    models, namely, including a number of models for longitudinal data, SEM trees
    can be used in similar ways to those methods described in Chapter 9. For the purpose
    of this chapter, we just focus on the use of SEM for cross-sectional data.


    An additional component of decision trees, outside of identifying nonlinear associations,
    is that observations are placed into terminal nodes, with each terminal node forming
    a subgroup. Given this, decision trees have also been used based on values of
    the predictors. Conceptualized as a form of exploratory multiple grouping method
    (Jacobucci et al., 2017), SEM trees provide a structural equation model as outcome
    with using decision trees to identify a grouping structure that improves the fit
    of the model. This grouping structure can be the result of one or more dichotomous
    splits on one predictor or predictors, multiple dichotomous splits form step functions
    between the predictors in the tree and the outcome criteria, which is the deviance
    in the case of SEM trees. The use of step functions allows decision trees and
    SEM trees to fit highly nonlinear structures. However, the use of single decision
    trees results in the drawbacks of less optimal prediction and instability of the
    structure. Just as decision trees have been generalized to random forests (Breiman,
    2001a), fitting hundreds or thousands of trees using a subset of predictors for
    each tree, the same has occurred for generalizing SEM to SEM forests. Although
    an interpretable tree structure is lost, the effects of predictors across the
    hundreds of trees can be condensed into variable importance metrics, allowing
    researchers to gauge the relative influence of each variable.


    # 10.3.1 Demonstration


    For demonstration purposes, we use the Grit dataset as was used in the illustration
    above. For the SEM trees above, our outcome model is the two-factor model for
    the 12 Grit items as before. This model, with parameter estimates, is depicted
    in the left panel of Figure 10.2.


    In contrast to directly incorporating covariates as predictors of each of the
    two latent variables, as in a MIMIC model, our covariates are used to derive subgroups
    that improve the fit of the model. This means that each of the covariates used
    in the SEM trees model will indirectly alter the parameter estimates in the sense
    that the derived subgroups will differ with respect to all, or a subset, of the
    parameter estimates.'
