- pgno: 224
  md: '# 8.3.2 Test Performance in SEM


    One difficulty using SEM, and not creating factor scores for latent variables,
    is that evaluating test performance can be more difficult. This is mainly due
    to the existence of latent variables, and the fact that these must be estimated
    in the test set. It is critically important to ensure that the latent variable
    that was estimated in the training set is equivalent to the latent variable specified
    in the test set. Ensuring equality of measurement is referred to as measurement
    invariance, and it has a long history in the field of psychometrics (Horn & McArdle,
    1992). This involves adding constraints to parameters in the model that forces
    estimates to be equal across datasets. Specifically, it involves estimating parameters
    freely in the training set, then constraining the parameters to these in the test
    set. This forces the formulation of each latent variable, through constraints
    on the factor loadings, regression, mean, and variance parameters, to be equivalent
    across datasets. Particularly for endogenous latent variables, variances represent
    residual variances, or the amount of variability not accounted for by the regression.
    This means that the residual variance can be freely estimated in the holdup sample,
    while all other parameters were estimated on the training stage.


    Just as in other forms of training a model on one dataset and testing it on a
    holdout, results in a worsening of fit. Most notably, if the fit of the model
    in the test set degrades to a large degree, it could signal that there were discrepancies
    in measurement. This is more common when datasets emanate from separate settings
    or groups of observations. In our case, the datasets come from the same sample,
    with the exact same characteristics. Instead, degradation in fit would identify
    overfitting in our training set. This can be evaluated by creating prediction
    in the test set (predicted probabilities in the case of a categorical outcome),
    after fixing all parameters to their training model values, only allowing the
    variance and covariance among latent variables to vary. Allowing the variance
    and covariance among latent variables will allow us to assess the prediction of
