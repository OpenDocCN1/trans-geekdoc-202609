- pgno: 266
  md: '+   Classes versus groups. In mixture models, the common terminology for the
    resulting probabilistic subgroups is classes, whereas in trees (SEM trees) it
    is groups.


    +   Invariance. The placement of equality constraints within a model to ensure
    that the same construct of interest is measured in the same way across time or
    groups.


    In psychology and other behavioral sciences, researches often use data to infer
    group membership. For example, a researcher might administer the Center for Epidemiological
    Studies Depression Scale (CES-D), and use participants'' responses to the items
    to distinguish two groups of participants, that is, participants with major depression
    and participants without major depression. Fundamentally, we are assessing the
    participants in our sample come from one population (homogeneity) or multiple
    distinct populations (heterogeneity). Often, this determination is based on whether
    each participant''s total score (sum of item responses) is greater than a recommended
    cutoff score (e.g., > 16). The recommended cutoff score may be examined using
    decision theory analysis and receiver characteristic (ROC) curves, examining how
    the total score provides a gold standard, such as a clinical evaluation. Once
    group membership is assigned, it can be used as an outcome or a predictor in subsequent
    analyses. This approach, while common, does not consider items are differentially
    associated with major depression and does not consider measurement error. Moreover,
    using a cutoff score to assign group membership is deterministic, and does not
    consider error in group assignment, which can affect the nature of associations
    with external variables (as an outcome or predictor variable). For these reasons,
    we examine the use of multiple statistical algorithms for assessing heterogeneity,
    taking a more algorithmic, and less theoretical, approach to identifying group
    membership.


    In social and behavioral research, two of the most common approaches for identifying
    heterogeneity are cluster analysis (Everitt, Landau, Leese, & Stahl, 2001) and
    finite mixture modeling (McLachlan & Peel, 2004). In both of these approaches,
    multivariate data can be analyzed; however, finite mixture modeling has greater
    flexibility for modeling different types of data distributions (e.g., binary,
    ordinal, categorical, counts, continuous) and group membership is probabilistic
    (each participant is assigned a probability of belonging to each class). We therefore
    focus on finite mixture modeling in this chapter. Additionally, many great resources
    are available on cluster analysis, including James et al. (2013) and Aldenderfer
    Blashfield (1984).'
  merge: -1
  img_proc: true
