  md: '# 3 The Practices of Machine Learning


    While Chapter 2 discussed the principles underlying machine learning, with a focus
    on the role of theory. Chapter 3 discusses the practices of machine learning,
    which takes tangible form in evaluating and programming the analysis and resultant
    statistics. This mainly concerns answering the question: How well did our model
    fit? To the stage, we first discuss the assessment of model fit. To set the stage,
    we discuss the concepts of bias and variance, and how these quantities play a
    part in evaluating whether model overfit the data. This is followed by a lengthy
    exposition on model fit with continuous (regression) and categorical (classification)
    outcomes. While there are relatively few options for fit assessment with continuous
    outcomes there are a host of metrics when the outcome is binary. We follow this
    with a discussion of best practices in using resampling to produce trustworthy
    assessments of fit, detailing multiple recommended forms of resampling, followed
    by a brief discussion on imbalanced outcomes.


    # 3.1 Key Terminology


    +   - Classification. This can refer to using models to place observations into
    separate groups (cluster) or the modeling of a categorical, most binary, outcome.


    +   - Regression. In the simplest case, this refers to the modeling of a continuous
    outcome, which in parametric models, involves using the Gaussian distribution.


    +   - Imbalance. This occurs when the outcome of interest has a smaller proportion
    of one class, which is also referred to as a skewed outcome. This most often occurs
    with clinical outcomes that have a low proportion of positive cases in the population,
    such as suicide attempts or cancer diagnosis.'
