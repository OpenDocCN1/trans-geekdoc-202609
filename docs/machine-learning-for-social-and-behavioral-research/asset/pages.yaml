  md: "# 6.4 Gradient Boosting\n\nSimilar to random forests, gradient boosting (also\
    \ known as gradient machines or gradient boosting trees) is a method that combines\
    \ the use of hundreds or thousands of individual decision trees in an attempt\
    \ to overcome the problems with a single decision tree. However, in contrast to\
    \ bagging and random forests, where each tree is created independently on a bootstrapped\
    \ sample, boosting creates a sequence of trees based on weighted forms of the\
    \ data. Developed originally for classification in the form of the AdaBoost algorithm\
    \ (Freund & Shapire, 1995; 1997); the idea behind the boosting algorithm has also\
    \ been extended to many other statistical problems (see Buhmann & Hothorn, 2007\
    \ for more details). Most notably, Friedman, Hastie, and Tibshirani (2000), as\
    \ well as Friedman (2001), developed highly adaptable algorithms that can be applied\
    \ to a list of different loss functions. This algorithm has also been extended\
    \ to multivariate outcomes (Miller, Lubke, McArtour, & Bergheman, 2016). The basic\
    \ idea of this algorithmic framework, originally termed gradient boosting machines\
    \ by Friedman (2001), now more frequently referred to as simply boosting, is to\
    \ fit an additive combination of weak learner (weak in the sense that its predictive\
    \ performance is usually substandard), most often a decision tree with few (potentially\
    \ one) partitions of the data, to the gradient (residuals) of the prior combination\
    \ of weak learners. More formally, the algorithm is described as\n\n# Algorithm\
    \ 2 Boosting Algorithm Overview\n\n+   1. Set tree depth, $D$ for each decision\
    \ tree\n2. Set learning rate or shrinkage parameter $\\Lambda$\n3. Set the number\
    \ of trees $B$\n4. Initialize the residuals $r_b$ with initial predictions $p_0$\
    \ of 0 for each $y$\n5. For $b=1, 2, ..., B$, repeat\n   (a) Fit a tree $t_b$\
    \ of depth $D$ to the current residuals of the response, $r_b$\n   (b) Create\
    \ new predictions $p_b$ for each case using $t_b$\n   (c) Update the residuals\
    \ using a shrunken version of the prediction, $r_b = r_b - \\Lambda p_b$\n\nThis\
    \ algorithm creates a sequence of trees by continually fitting trees to the current\
    \ vector of residuals. Shrinking the influence of each tree,"
  merge: -1
  img_proc: true
