    # 12.4 Network Statistics


    Information can be extracted from a network and stored as a network statistic.
    In this section, we introduce the widely used network statistics. The network
    statistics can be defined for a whole network, each node in the network, a dyad
    in the network, and so on.


    # 12.4.1 Network Statistics for a Whole Network


    The network size is the most basic statistic of a network, which is defined as
    the number of nodes in a network and, for the WeChat network, there are 165 students
    in the network and therefore, the network size is 165.


    The density of a network is the total number of edges divided by the total number
    of possible edges, calculated based on the type of networks. For the WeChat network,
    which is an undirected network. The total number of possible edges is 165+(165-1)/2
    = 1350. In the network, the total number of edges is 1722. Therefore, the density
    of the network is 1722/1350 =12.7%. The density measures the tendency for two
    nodes to be connected.


    The transitivity is defined as the proportion of closed triangles to the total
    number of open and closed triangles. For a triad of three nodes, if they are all
    connected, there are three edges, which form a closed triangle. However, if there
    are only two edges with one open side, it opens an open triangle. However, for
    example, for the WeChat network, the transitivity is 35.5%. Transitivity predicts
    the likelihood that Student A and Student B are friends if both A and B are friends
    with Student C. This implies that a friend of my friend is not necessarily my
    friend, but is far more likely to be my friend than another randomly chosen person.


    # 12.4.2 Network Statistics for Nodes


    Network statistics can be defined for each node, which can be used to use as a
    measure of the whole network. Such statistics are often developed around the concept
    of centrality to address the question of which are the most important nodes in
    a network.


    Degree is a centrality measure that simply counts how many neighbors a node has.
    For a directed network, in-degree and out-degree is the number of incoming edges
    and outgoing edges. For an undirected network, in-degree, is the same as out-degree.
    A node is impor'
