    # 3.4 Bias–Variance Trade-Off


    Every dataset has a finite amount of information that can be gleaned or

    extracted. The amount of information is related to many factors, most

    notably sample size (increasing the training set size was a large factor in

    improving the use of neural networks in areas such as object recognition;

    Goodfellow et al., 2016), as well as the number and quality of the predic-

    tors. The more information in a dataset, the more that can be extracted,

    in theory. This generally manifests as itself fitting more complex models.

    While taking complexity into account, it helps to break down fit into

    three fundamental quantities: bias, variance, and error. The variance of

    error is easiest seen in the case of one predictor and outcome, where two

    observations have identical X values (e.g., same score on a reading test), but

    different scores on Y (e.g., learning disability classification). This overlap

    leaves room for a prediction model to separate these cases, hence the

    rationale for calling the variance of error irreducible error.'
