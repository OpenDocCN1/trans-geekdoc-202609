    Ringle, & Mena, 2012) specific forms of PLS-SEM have been shown to be equivalent
    to the use of factor score regression (Yuan & Deng, 2021). Finally, a recent paper
    demonstrated how to use SEM to generate casework predictions, highlighting that
    it can be seen as an even less complex model for prediction than linear regression
    (de Rooij et al., 2022).


    The aim of this chapter is not to explain how SEM can be used in a purely predictive
    domain. Instead, we discuss a number of strategies for moving the pendulum with
    how SEM is typically applied, from from purely ex-'
