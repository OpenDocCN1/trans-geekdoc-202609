    # 1.6.1 Grit


    Grit (Duckworth, Peterson, Matthews, & Kelly, 2007) is defined as perseverance
    and passion for long-term goals, and we attempt to predict this construct with
    items that measure the Five Aspects of personality and demographic variables.
    The Grit data were downloaded from Open Psychometrics (https://openpsychometrics.org/rawdata/),
    and include responses from 4270 participants who completed the survey online.
    The Grit Scale is a 12-item survey that asks participants about the extent to
    which they have overcome obstacles and setbacks, and the focus they have to complete
    a task. It is a 1 to 5 response scale for items with scale points: 1 — Very like
    me, 2 — Mostly like me, 3 — Somewhat like me, 4 — Not like me, and 5 — Not like
    me at all. The Personal Item Pool (PIIP) Big-5 Personality Inventory contains
    50 items measuring each personality construct: Openness, Conscientiousness, Extroversion,
    Agreeableness, and Neuroticism (for more on the Big Five Raud & Perkins, 2002).
    These items were rated on a 5-point scale with the following scale points: 1 —
    Disagree, 3 — Neutral, 5 — Agree.


    # 1.6.2 National Survey on Drug Use and Health from 2014


    The National Survey on Drug Use and Health from 2014 (NSDUH; Substance Abuse and
    Mental Health Services Administration, 2015). This survey focused on assessing
    the use of illicit drugs, alcohol, and tobacco among U.S. citizens 12 years or
    older. For the purpose of our analysis we focus on questions that assess mental
    health issues. The dataset detailed in the chapters is pared down from the original
    dataset to include 39 predictor variables with the item of predicting suicidal
    ideation (12 months; SUICHTINK). Predictors included symptoms of depression and
    other mental health disorders, the impact of these symptoms on daily functioning,
    and four demographic variables (gender, ethnicity, relationship status, and age).
    The dataset can be freely down-'
