    # 12.2.2 Network Data Structure


    In regular data analysis, the data are often organized as a rectangular matrix
    with each column representing a variable and each row representing a participant
    or subject. For network data, they are often represented as an adjacency matrix
    or edge list matrix. The adjacency matrix, also called a sociatrix or connection
    matrix, represents the network data as an N × N matrix, with N being the total
    number of participants. Using the network lexicon, each participant is called
    a node or a vertex. For the WeChat network, there are a total of 165 nodes. The
    WeChat network can be represented by a 165 × 165 square matrix, with each row
    and column being student. For example, Table 12.2 shows the adjacency matrix of
    the first 100 students in the WeChat network data.


    For the WeChat network, no self-loop is allowed, which means that a student cannot
    be a friend of himself or herself. For the off-diagonal values, 1 indicates that
    two students are WeChat friends and 0 indicates they are not. In network analysis,
    the relationship is also called an edge. For the WeChat data, if Student A reports
    B as a WeChat friend, Student A should also be a WeChat friend of Student B. Therefore,
    the adjacency matrix is symmetric. Such a network is called an undirected network.
    However, if A views B as a friend but B does not view A as a friend, one would
    have a directed network. In this situation, the convention is that rows indicate
    the starting node or “source,” and columns indicate the ending node or the'
