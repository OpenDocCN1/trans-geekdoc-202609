    The Role of Data One motivation for the use of machine learning is that it is
    seen as a natural opposition to the traditional reductionist approach. Many areas
    of social and behavioral data have identified a host of potential risk factors,
    causal variables, mediators, etc. However, given that most of these factors are
    interrelated, it remains to be seen which of these factors were most important
    when studied in conjunction with others. Big data, and the use of machine learning,
    facilitated large-scale analyses that included well-validated independent variables,
    even when the independent variables correlated to a significant extent.


    # 2.4 Principle #2: Orienting Our Goals Relative to Prediction, Explanation, and
    Description


    What specifically are the goals of machine learning? At possibly the simplest,
    our goals could focus on (1) prediction, meaning we focus almost solely on Y,
    or (2) identifying relationships, with the goal of trying to shed light on how
    X associates with Y (see Figure 2.2; Breiman, 2001b). Breiman (2001b) uses these
    two goals to differentiate between algorithmic modeling and data modeling cultures
    in statistics, with the data modeling group focusing on extracting information
    about the relationship between X and Y, while the algorithmic modeling group focuses
    on the prediction of Y.


    > We can go beyond the distinction between prediction and extracting information
    as the goals of research. Shmueli (2010) differentiates causal explanation, empirical
    prediction, and descriptive modeling. Machine learning is often described in terms
    of giving favor to prediction rather than explanation (Breiman, 2001b; Shmueli,
    2010; Yorkoni & Westfall, 2017). Although using machine learning for causal inference
    (explanation) is a more recent area of inquiry, our application will favor the
