    can be calculated from assessing the variance of the mean estimates, in comparison
    to the residual variability that is not explained by the regression parameters.
    More formally, we represent this as


    > $$FS \sim N(\mu, \psi^2)$ \quad (8.3)$

    $$\mu = \beta_0 + \beta_1 X_1 \quad (8.4)$$

    $$R^2_{FS} = \frac{var(\mu)}{var(\mu) + \psi^2} \quad (8.5)$


