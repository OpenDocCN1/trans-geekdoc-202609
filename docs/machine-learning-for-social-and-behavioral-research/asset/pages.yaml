- pgno: 298
  md: '# 11.3 Basic Text Mining


    Text data can contain a lot of information. Before we conduct more complex analysis,
    we first show how we can mine some simple, but useful, information from text data.
    The teaching evaluation data do not include direct information about the gender
    of the professors. In practical data analysis, such information can be very useful.
    Although the gender of individual professors can be identified indirectly using
    the narrative comments because student often uses words that reflect the gender
    of a professor. For example, a comment from one student was given:


    > My favorite Professor by far. He is very helpful and willing to help out the
    best he can. He will not just give you answers however, but help guide you so
    that you can learn it on your own. I recommend taking him for whatever math courses
    you can. He requires a lot of work, but it pays off in the run!


    In the comment, the student used pronouns “he” four times and “him” once. This
    clearly indicates that the professor is male even though the direct sex information
    was not collected.


    As another example, see the comment below from another student on a different
    professor. In the comment, there are gender pronouns “she” (six times) and “her”
    (one time). Therefore, one can confidently assume that the professor is female.


    > She is one of the best voice teachers I have ever had. She may not be able to
    sing like she used to, but she sure how the voice works. And she knows that everyone
    is different so she doesn''t use the same methods with everyone. I love her!!!


    Certainly, if we use one comment to identify the gender of a professor, we can
    have a lot of uncertainty especially when gender pronouns were not used often.
    One the other hand, if multiple students used the same gender pronouns to describe
    a professor, the results are cross-validated and can be more accurate. We now
    discuss, in steps, how to mine the gender information of all the 999 professors
    while illustrating the typical steps of text mining.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Introduction to Text Mining


    # 11.3.1 Text Tokenization


    From the previous discussion, we know we can identify gender based on gender pronouns.
    However, the gender pronouns are embedded in the text. Therefore, the first step
    of the analysis is to identify and take out the gender pronouns. In text mining,
    one can break down a block of text into individual words, e.g., based on white
    space in the text. The process is called tokenization (e.g., Stavrianou, Andritos,
    & Nicoloyannis, 2007; Weiss, Indurkhya, Zhang, & Damerau, 2010). For example,
    for the sentence “She is one of the best voice teachers I have ever had”, after
    tokenization, we get the individual words as listed in Table 11.1. For this particular
    example, we also change all upper case letters to lowercase letters as “She” becomes
    “she.” In many situations, this is useful since one can simply ignore cases to
    treat the words as the same. In this example, the punctuation marks are also removed.


    # TABLE 11.1. Text Tokenization


    | Word |

    |---||

    | 1 | she |

    | 2 | is |

    | 3 | one |

    | 4 | of |

    | 5 | the |

    | 6 | best |

    | 7 | voice |

    | 8 | teachers |

    | 9 | i |

    | 10 | have |

    | 11 | ever |

    | 12 | had |


    # Select the Gender Words


    Since we are interested in identifying the gender of professors, only the words
    that reflect the gender information are useful. For example, for the words listed
    in Table 11.1, the word “she” provides relevant information for our analysis.
    Therefore, in this step, we would identify such words. After a quick review of
    part of the comments in the data, we found the gender words listed in Table 11.2.
    For example, “he,” “him,” and “his” are associated with the male professors while
    “she,” “her,” and “hers” are associated with the female professors. Note that,
    in writing, the contractions such as “he’s” and “she’s” are also used. Once the
    words are identified, we keep these words only in our data for further analysis.'
  merge: -1
  img_proc: true
