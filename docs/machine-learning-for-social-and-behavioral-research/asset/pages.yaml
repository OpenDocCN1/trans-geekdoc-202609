    # 4.4.3 Rationale for Regularization


    # Bet on Sparsity


    Underlying the use of the lasso, or sparser extensions, is this concept of a “bet
    on sparsity” (Hastie, Tibshirani, & Friedman, 2001). By this, there is an assumption
    that the underlying model is sparse, or that there are few prominent or meaningful
    effects (nonzero coefficients). In the case of regression, this means removing
    predictors outside of a handful will not appreciably reduce the model. The opposite
    of a sparse underlying model is that of a dense model, or where there are many
    effects, of which may be small, but most importantly are truly zero. In social
    and behavioral research, an “true” sparse model is unlikely to exist. Instead
    most variables in a dataset have small correlations among themselves (e.g., the
    “crud” factor; Meehl, 1990). As a result, the use of regularization in applied
    research will impart some degree of bias to the results. Although this seems an
    undesirable side effect, we explain two aspects that support this rationale.


    # Functional Sparsity


    The first and foremost is even though there may be a confluence of small effects
    in our dataset, their inclusion in our model makes interpretation quite difficult
    (e.g., parsimony), or we wish to screen variables to increase our efficiency in
    studies. In this case we care more about what could be functional sparsity, where
    we specifically aim to estimate a parsimonious model for these various reasons.
    In situations with larger sample sizes and a confluence of variables that contribute
    small effects, inference can be difficult due to this level of complexity in understanding
    what variables are important contributors. The idea behind functional sparsity
    is in contrast to dense sparsity, where the ratio between sample size and number
    of variables precludes an accurate estimate. Despite having a strong theoretical
    rationale for including variables in our model, we may have to use regularization
    to accurately estimate the model coefficients.


