- pgno: 183
  md: '# Ensembles


    data. The degree of complexity one can model in the data is contingent upon a
    number of factors, but given this, one can then compare the prediction performance
    after to assess which model fit. There are both informal and formal ways to accomplish
    this. Informally, one may examine the $R^2$ or AUC (or others) as assessed with
    some random forests, choosing the best fit. If the fit values are relatively close,
    or there is no clear winner, then it is best to choose the most parsimonious model
    among the best fitting.


    A formal way to assess the correspondence between results is to examine the correlation
    between the predictions with a global surrogate model (such as Molnar, 2019).
    First, use a less interpretable algorithm to predict an outcome, such as random
    forests. From these, create predictions for each observation. These predictions
    are then used in a second step, when a more interpretable algorithm (e.g., linear
    regression or decision trees) is used to predict the predictions from step one,
    using the same predictors. Then, the prediction performance can be used to determine
    how much is lost by using a simpler algorithm. In the ECLS-K, we used a linear
    regression to model the predictions from random forests, producing a model well,
    although a linear regression approximates the random forests model well, it is
    far from perfect, meaning that we are probably missing some degree of nonlinearity
    or interactions in the linear regression model. We will detail this approach using
    the ECLS-K data.


    Although measures of fit should only be reported either resampling or on a validation
    set, it sometimes be useful to assess fit on the original sample. For instance,
    if pairing random forests with a small sample size, it can be common to fit the
    data perfectly (i.e., AUC or $R^2$ of 1). When this occurs, it would probably
    be beneficial to consider a less flexible model, as the random forests model is
    overfitting to a degree that the conclusion and predictions will be unlikely to
    generalize. Again, in cases such as this, if random forests are too flexible for
    the size of the data, it will be common to see similar performance using both
    a linear model and random forests with the resampled metrics. In this case, although
    a linear model limits the amount that can be gleaned from the data, the dataset
    is not of sufficient size to allow for more complex conclusions regarding interactions
    and nonlinear relationships.


    # 6.8 Summary


    The use of ensembles marks the end of the transition from just assessing linear
    relationships in generalized linear models to automatically identifying interactions
    and nonlinear effects. Specifically, ensemble methods over-'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'come many of the problems with decision trees, often evidencing superior predictive
    performance than less complex algorithms. In our discussion of ensembles, we mainly
    focused on boosting and random forests, as these are two of the most commonly
    used algorithms. We also noted a number of drawbacks to ensembles, such as loss
    of interpretability. For social and behavioral research, it is important to keep
    in mind the quality of the data, as this can have a large impact on whether the
    use of ensembles adequately capture more complex relationships. We demonstrated
    that measurement error can have a larger impact on ensembles as opposed to linear
    regression. For these reasons, we almost always recommend pairing the use of ensembles
    with simpler methods, such as linear (logistic regression).


    # 6.8.1 Further Reading


    +   - For interpreting the results from ensembles and other "black box" algorithms,
    see the book by Molnar (2019). This further discusses the use and application
    of partial dependence plots, local interpretation, and other methods.


    +   - One additional algorithm that can be considered a form of ensemble is support
    vector machines (SVM; Cortes & Vapnik, 1995), as they perform L2 regularized model
    fitting in a high-dimensional representation of the predictors (Hastie et al.,
    2009). Interested readers should consult either Hastie et al. (2009) or James
    et al. (2013) for overviews.


    +   - Similarly to SVM, deep learning can be seen as a type of method, or perhaps
    more importantly, it is often used as a comparison technique to random forests
    and boosting in prediction applications. However, the most important advantages
    of deep learning are evidenced with alternative data types, such as images, video,
    text, and others. For a more technical overview, see Goodfellow et al. (2016).
    For a more accessible overview with a focus on R, see Chollet and Allaire (2018).


    +   - We highly recommend the caret package for implementing all of the methods
    discussed in this chapter. See Kuhn and Johnson (2013) for further detail on the
    use of this package and many of the implemented methods.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 6.8.2 Computational Time and Resources


    Relative to the algorithms discussed in Chapters 4 and 5, unsurprisingly, ensembles
    take much longer to fit. With a dataset containing 1,000 cases and a small number
    of predictors (e.g., 10), both random forests and boosting often take on the order
    of a few minutes. While random forests takes longer to fit a single sequence of
    trees relative to boosting, the number of tuning parameters is much smaller (only
    mry tested) compared to boosting, which means that fitting boosting models can
    often take longer. However, boosting is more amenable to parallelization, which
    is extremely important when fitting ensembles on large datasets. Finally, while
    the conditional approach to calculating variable importance better captures the
    variables contribution to prediction in the presence of correlated predictors,
    this often be infeasible to fit as the runtime is drastically greater than the
    marginal approach.


    Both the randomForest and gbm packages are by far the most commonly used for random
    forests and boosting, respectively, in R. Further, we detailed the alternative
    forms of each type of ensemble as implemented in the xgboost and partykit packages.
    Finally, we wish to note that in other chapters, a large number of add-on or alternative
    packages have been developed that extend the algorithms to alternative outcome
    types, algorithm variants, or to facilitate additional types of interpretation.
    Applying many of these packages is facilitated by the caret package, which we
    highly recommend for testing each algorithm.'
  merge: -1
