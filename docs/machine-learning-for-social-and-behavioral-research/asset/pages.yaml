- pgno: 375
  md: '# Introduction to Social Network Analysis


    # 12.7 Summary


    In this chapter, we introduced the basic methods for network analysis. Network
    data are different from the traditional data in that the nodes are naturally interrelated.
    Network visualization is a critical component, and should be the first step in
    network analysis. Although one can extract the information from a network and
    use it in a statistical model, many network modeling methods are available. For
    example, the exponential random graph models and latent space models are currently
    widely used.


    # 12.7.1 Further Reading


    +   - This chapter provides only a limited sample of the literature on social
    network analysis. For a more complete treatment of network analysis, one can consult
    the review paper by Snijders (2011) and books as Carrington, Scott, and Wasserman
    (2005); Scott (2017); Wasserman and Faust (1994). Many newly developed methods,
    such as network analysis with mediation Che et al. (2020); Liu et al. (2018) were
    not discussed in this chapter.

    - The analysis in this chapter has focused on a binary, undirected social network.
    However, the methods can be easily adapted for valued, directed networks. Furthermore,
    network analysis is not limited to social networks, but can be and extended to
    many other networks such as psychological networks (Fried et al., 2017) and biological
    networks (Barabási, Gulbache, & Loscalco, 2011).

    - The chapter only discussed cross-sectional networks. Longitudinal networks and
    associated analytical methods are available such as the temporal ERGM (Hanneke
    & Xing, 2007; Krivitsky & Handock, 2014), the stochastic actor-oriented models
    (Snijders, van Bunt, & Steglich, 2010), and the dynamic network analysis (Sewell
    & Chen, 2015)


    # 12.7.2 Computational Time and Resources


    Network analysis can typically be conducted using statnet, a suite of R packages
    for the management, exploration, statistical analysis, and visualization of network
    data (Krivitsky et al., 2022). It includes the ergm and latentnet packages used
    in this chapter. Depending on the estimation methods used by a particular model,
    an analysis can take a substantial amount of computational time. For example,
    for the latent space analysis took about 10 minutes, while the analysis in Table
    12.8 took'
  merge: -1
  img_proc: true
