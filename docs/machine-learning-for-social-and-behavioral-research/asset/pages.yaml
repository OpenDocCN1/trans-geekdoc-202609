  md: '# Regularized Regression


    error), gender would also have been chosen. Here we highlight one of the biggest
    issues with variable selection—it is inherently unstable on the basis of dichotomous
    decisions on whether variables are included or not. In the next section we discuss
    a method that was developed specifically to address this drawback in the use of
    the lasso for variable selection.


    # 4.5.2 Stability of Selection


    In any statistical model that performs some variable selection, the stability
    of the final model will always be somewhat in question. By stability, we refer
    to the influence of taking subsamples (or bootstrap samples) of the data and the
    resulting variability to variable selection. This means that the regression coefficients
    might be slightly different across each subsample. In contrast, variable selection
    methods select completely different variables across each subsample, inducing
    uncertainty about which best subset of variables is. Practically speaking, this
    is less of a concern with the current dataset and more of a problem of how this
    model might generalize to alternative samples.


    Stability is particularly a problem with stepwise regression methods (Flack &
    Chang, 1987; Austin & Tu, 2004; Austin, 2008). As an example, in the Holzinger-Swineford
    (1939) study, we split the sample in two ways. Of the 301 cases, both the first
    100 cases and second 100 cases were split into separate datasets. We ran backward
    elimination with both of these datasets, as well as on the full sample. In the
    first sample, variables x4 and x5 were chosen, while x3, x4, and x16 were chosen
    in the second sample, and x2 and x4 in the full sample. The only variable common
    across all three datasets was x4. As a result, we have some uncertainty regarding
    whether x2, x3, x5, and x16 are important variables to include in a subsequent
    analysis.


    The idea behind stability selection is to repeatedly split a sample to create
    a subsample, run an algorithm for variable selection on each subsample, and then
    choose the variables that are selected in a majority of subsamples (Meshausen
    and Buhmann, 2010). In the context of regularized regression, Meshausen and Buhmann
    (2010) argue that instead of just focusing on regularization paths, you can also
    look at the stability paths, which refer to the probability of each variable being
    selected when resampling the data. Variables are now chosen that exhibit a high
    probability of being selected after using multiple iterations of subsampling.


    Using the bfi3 dataset, with 24 predictors of the agreeableness score, we used
    the stab package (Hofner & Horthorn, 2017) to test the stability of lasso regression
    across 1,000 subsamples. On each of the selected'
