  md: '# Machine Learning for Social and Behavioral Research


    # 11.7.2 Sentiment Analysis with Valence Shifters


    The previous sentiment analysis was based on individual words or phrases. One
    first looks up the words in a chosen lexicon and then aggregates the scores for
    the words together. For example, if a word "helpful" in a lexicon such as being
    helpful appears in the text, a score of 1 is added to the sentiment score of the
    text. This method is simple, but preven effective in the preceding example. However,
    it ignores the difference in situations such as "isn''t helpful," "barely helpful,"
    and "extremely helpful." In such cases, although the word "helpful" is positive,
    the preceding word "isn''t" is called negator. A word like "isn''t" that modifies
    the sign of a word is called negative. The words "very" and "extremely," on the
    other hand, increase the positivity of the word "helpful." Such words are called
    amplifiers or intensifiers. The word "barely" does not flip the meaning of "helpful"
    but reduces its magnitude of positivity. Words like it are de-amplifier or attenuator.


    Another condition is a bit more complex as the comment here—Chemistry is actually
    interesting, and it''s frustrating," Simply looking at the individual words, "easy"
    is positive, and "frustrating" is negative. But, with the negator, "not easy"
    becomes negative. However, with the adversative conjunction "but" in the next
    sentence, the previous negative sentiment should not be considered as negative
    more.


    The above-mentioned types of words, including negator, amplifier, de-amplifier,
    and adversative conjunction, are collectively called valence shifters, which can
    alter or intensify the sentiment of words under evaluation. Valence shifters can
    be a serious problem. For example, for the teaching comments, about 20% of the
    time a negator appears with the sentiment word using the being lexicon (see Table
    11.11). Therefore, to capture the sentiment of a text, such valence shifters should
    be taken into consideration.


    # TABLE 11.11. The Co-occurrence Rate of Valence Shifters and the Sentiment Words
    using the being Lexicon


    | Valence shifter | Co-occurrence |

    |---|---|

    | negator | 0.194 |

    | amplifier | 0.297 |

    | de-amplifier | 0.048 |

    | adversative | 0.143 |


    One way to handle this is to assign a weight to the sentiment score according
    to the type of shifters. For example, for the sentiment of a word with a negator,
    a weight of -1 effectively reverses the'
