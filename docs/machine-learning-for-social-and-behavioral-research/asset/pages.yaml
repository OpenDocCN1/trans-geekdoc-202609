- pgno: 181
  md: 'Ensembles


    # 6.7 Important Notes


    # 6.7.1 Interactions


    Given the importance of interactions in social and behavioral science (Aiken,
    West, & Reno, 1991), identifying interactions with ensemble methods is of utmost
    importance. Although the complexity of these methods limits the interpretability
    of the main and interaction effects, previous research with boosting, in particular,
    has aimed at identifying which interactions are important (Elith, Leathwick, &
    Hastie, 2008). As discussed previously with random forests, the effect of variable
    in tree-based ensembles can be quantified through the use of relative importance
    plots. However, the values of compound main and interaction effects, preventing
    a deeper level of interpretation into each effect. In the context of boosting,
    previous research has focused on quantifying linear interactions between each
    predictor (Elith, Leathwick, & Hastie, 2008). In this study, the strength of each
    possible interaction in the boosting model is tested, producing an additional
    relative importance metric. Finally, important interactions can be visualized
    through the use of joint partial dependence plots (Friedman, 2001).


    In boosting, the tree depth (complexity) reflects the order of possible interaction
    in the data. In social and behavioral research, it may be doubtful to have interactions
    greater than a three-way interaction. However, given that there trees can include
    main effects as well as interactions, it may be worth testing up to a depth of
    five. Taken together, this means testing different tree depths, 1 (stump); just
    main effects; nonlinear effects), 2 (capture interactions), 3 (higher-order interactions),
    as well as 5 (higher-order interactions and other effects).


    # 6.7.2 Other Types of Ensembles


    Ensembles are a general procedure for combining functions of either the same type
    (e.g., boosting or random forests) or varying forms (e.g., lasso regression and
    random forests).


    Combining different forms of algorithms have become a popular approach, yielding
    superior performance in applications. One approach that has been applied in the
    context of clinical psychology (Bernecker, et al., 2019) is super learner (Van
    der Laan, Polley, & Hubbard, 2007). The general concept is to test various learners
    (algorithms such as trees and polynomial regression) because the true data generating
    process is unknown, weighting the contribution of each individual learning according
    to its effectiveness. As a simple illustration of how this form of ensemble'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'learning works, we selected three different algorithms to combine: lasso regression,
    decision trees, and random forests. Using each of these, we created a prediction.
    We then combined the three sets of predictions into a single dataset, appending
    the actual outcome. Our data are organized and the first few lines are displayed
    in Table 6.5. From here, we entered these into a linear regression (typically
    a different algorithm, particularly due to collinearity), predicting the actual
    outcome from the three sets of predictions. The regression weights from this regression
    analysis are then used as a way to determine the contribution of each individual
    learner to create a final set of predictions. In practice, it is necessary to
    estimate the weighting scheme using cross-validation (see Figure 1 in Van der
    Laan et al., 2007), however, the general strategy holds. This form of ensemble
    learning has been implemented in the SuperLearner package.


    # TABLE 6.5. Example Dataset That Combines Predictions from Three Learners.


    | Y | Y_{Lasso} | Y_{DT} | Y_{RF} |

    |---|---|---|--|

    | 1.2 | 1.0 | 0.8 | 1.5 |

    | -0.3 | -1.2 | -0.2 | 0.4 |

    | 1.1 | 2.1 | 1.0 | 1.3 |

    | 0.2 | -0.6 | 0.2 | 0.2 |


    To demonstrate the use of Super Learner, we used the ECLS-K dataset as above,
    with the elastic net algorithm, extreme gradient boosting (i.e., XGBoost), and
    random forests. The Super Learner algorithm can be applied in a number of ways.
    One is to just estimate each individual learner, then enter the predictions into
    a secondary algorithm to estimate the weights from each prediction. By default,
    the SuperLearner package uses non-negative least squares to estimate the weight
    for each learner as assessed using cross-validation. In our example, the risk
    (MSE) was estimated as 107.6 for extreme gradient boosting, 84.7 for random forests,
    and 79.1 for the elastic net. These predictions were combined with the coefficients
    of 0.05 for extreme gradient boosting, 0.19 for random forests, and 0.76 for the
    elastic net, manifesting a clear preference for a linear model. This combined
    model had an estimated risk of 79.3, approximately equivalent to the elastic net.
    Within the R package there are additional functions that combine the estimate
    of each learners contribution with nested cross-validation among other options.


    # 6.7.3 Algorithm Comparison More Broadly


    As discussed previously, it is highly recommended to test a sequence of algorithms,
    each indicating a different level of complexity within the'
