  md: '# 4 Regularized Regression


    This chapter is the first to focus on the algorithm side of machine learning,
    with the prior two chapters detailing and discussing the philosophy and practice
    of machine learning. An important piece to remember is that while our discussion
    may focus on the algorithm in this and the following chapters, the aspects to
    model evaluation detailed in each algorithm are integral components. The topic
    of this chapter centers on the integration of regularization with regression models,
    spurred by a change in motivation from inference in relatively small data (both
    sample size and predictors) with linear regression (using ordinary least squares),
    to more of a focus on prediction in larger data, necessitating various forms of
    regularization. We begin with a thorough overview of regularization in standard
    regression models, covering a number of extensions that take into account varying
    predictor structures.


    # 4.1 Key Terminology


    +   - Link function. A mathematical function that allows the linear model to be
    applied to outcome variables with varying distributions (e.g., binary, count).

    - Logit. A function, also referred as the log-odds, that maps probabilities to
    real numbers. This forms the basis for logistic regression, where predicted probabilities
    are generated with the linear model.

    - Probit. Similar to the log function, the probit is based on using the standard
    normal distribution (as opposed to logistic distribution with logit). While sometimes
    used for binary outcomes, it is more commonly used with ordinal outcomes.

    - Multinomial. A type of regression used with categorical outcome variables that
    are assumed to be nominal.'
