    # 2.5.2 Level of Hypothesis


    Most researchers describe a hypothesis as a specific, well-formulated statement.
    The part of the motivation for this stems from the philosophy of science’s fixation
    on hard sciences, such as physics, where general laws take mathematical forms.
    In reality, particularly in social and behavioral research, a pure emotion — nothing
    but an outpouring of alternative ideas and a consuming curiosity about a certain
    aspect of the world” (Cattell, 1966). A further problem with the term is its generalization
    from an introduction to statistics formulation (i.e., $H_0 = no effect$) to match
    theoretical formulations. A hypothesis taking the form of a single sentence necessarily
    demands some form of reductionism from theory, whereas a hypothesis matching the
    degree of theoretical complexity would require at the very least a paragraph of
    formulation. Even with the more recent calls to match mathematical structures
    in the areas of computational modeling (e.g., Fried & Robinaugh, 2020), the degree
    of complexity necessitates some degree of simplification (DeYoung & Kruger, 2020).


    In more traditional social and behavioral research, stating hypotheses takes the
    form of whether or not an effect is zero. This typically refers to the influence
    of a single variable, often a grouping resulting from an experimental manipulation.
    Other times, nonexperimental research may report hypotheses that refer to whether
    a regression coefficient is nonzero, which can become more complex in the presence
    of more than one predictor. In research settings such as these, where the number
    of variables is small, it is relatively straightforward to state and test hypotheses.
    Factors in more contemporary research make this process more complex: larger numbers
    of variables and the ease of specifying models with complex relationships. Simply
    put, the more variables in an analysis, the more complicated it is to test a purely
    confirmatory model. This process is eased if the majority of the variables are
    included as *confounders*; however, controlling for these variables is more complex
    than researchers assume (Westfall & Yankoni, 2016).


    Next, we discuss complications in the use of hypothesis testing with large numbers
    of variables. The most common way which this occurs'
