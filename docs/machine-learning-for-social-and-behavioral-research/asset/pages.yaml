    of the outcome.


    A limit of bagging is that the decision trees created in the bootstrap samples
    are somewhat related. More specifically, imagine two correlated variables, $x_1$
    and $x_2$, with $x_1$ having a slightly stronger association with the outcome
    $y$. Across bootstrap samples, $x_1$ is going to be selected into the decision
    tree at a much higher frequency than $x_2$ even though $x_1$ and $x_2$ are highly
    correlated. This can lead to decision trees that are more similar to one another
    because of their overreliance on $x_1$ and disregard for $x_2$. To overcome this
    issue, Breiman (2001a) proposed random forests, discussed subsequently, which
    randomly sample predictor variables when partitioning the data.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "144 Machine Learning for Social and Behavioral Research\n\n# 6.3 Random Forests\n\
    \nRandom forests are an extension of bagging that attempts to reduce the similarity\
    \ between the decision trees estimated on each bootstrap sample. Simply stated,\
    \ random forests proceeds in the same way as bagging by bootstrapping the data\
    \ and fitting a decision tree to each bootstrapped dataset. However, decision\
    \ tree construction does not proceed as usual. In random forests, a subset of\
    \ the predictors, as opposed to all predictors in bagging, are considered when\
    \ partitioning the data. This added level of randomness encourages the decision\
    \ trees to differ more from one another, which allows for a more diverse predictor\
    \ space. That is, the decision trees are less likely to pigeonhole the prediction\
    \ space. Once the decision trees are fit to each bootstrapped sampled, predictions\
    \ are made by averaging predictions from the decision trees.\n\nSelecting a random\
    \ subset of predictors for variables that have high correlations with other variables\
    \ to be included in the tree, along with allowing weaker variables to exert an\
    \ influence. This accounts for the main distinction with bagging, and typically\
    \ results in superior performance. More formally, the random forests algorithm\
    \ is explicated in Algorithm 1.\n\n# Algorithm 1 Random Forests Algorithm\n\n\
    +   1. Set $B$, the number of trees\n2. Set $m$, the number of variables to consider\
    \ when making a partition\n3. For $b = 1$ to $B$ repeat\n   (a) Draw a bootstrap\
    \ sample of size $N$ from the data\n   (b) Grow a decision tree $T_b$ on the bootstrap\
    \ sample using a random set of $m$ variables for each partition\n   (c) Use the\
    \ out-of-bag samples to create predictions from the decision tree\n\n+   4. Output\
    \ the ensemble of trees $\\{T_b\\}_1^B$\n\n+   5. Calculate the final predicted\
    \ values for each individual\n\n```\n$f_{rf}^B(x) = \\frac{1}{B} \\sum_{b=1}^B\
    \ T_b(x)$\n```"
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Ensembles


    For random forests, there are two tuning parameters, the number of trees $B$ (in
    bagging) and $m$ the variable subset size when making a partition of the data.
    Typically $B$ is fairly large (i.e., 500 to 2,000) and larger than the number
    of trees needed when bagging because the prediction from each decision tree is
    somewhat poor with random forests. Oftimes, the variable subset size $m$, often
    referred to as $mtry$, is a fairly small number (e.g., $\sqrt{p}$, where $p$ is
    the number of predictor variable). Predictor variables are highly correlated,
    a smaller value of $m$ typically leads to superior performance.


    The optimal value of $m$ can be determined using a grid search, whereas the optimal
    value of $B$ is first examined using the out-of-bag (OOB) prediction error. Whereas
    observations that are left out of the bootstrap sample. Recall that bootstrapping
    is resampling with replacement. Thus, a single observation can appear multiple
    times in a bootstrap sample, whereas another observation can be left out of a
    bootstrap sample entirely. These left-out observations are the OOB observations
    and the prediction error on these OOB observations are a decent approximation
    of the out-of-sample prediction error (Breiman, 1996a). Although the number of
    trees and variable subset size are treated as tuning parameters, the size of each
    decision tree is typically not controlled or varied. Although there is some research
    on this topic (e.g., Segal, 2004), most software programs utilize defaults for
    the decision tree size, mainly specifying the minimum number of cases in a terminal
    node.


    In comparison to bagging, random forests is able to model more nuanced relationships
    in the data, resulting in improved fit. This increased degree of flexibility can
    lead to a propensity to overfit the training dataset, resulting in less dramatic
    improvements in fit in the test set. Random forests were also applied to the ECLS-K
    data as demonstrated in section 6.2, with a sequence of trees and their corresponding
    training and test datasets displayed in 6.3. Relative to both decision trees and
    bagging, random forests demonstrated striking improvements in the training dataset,
    while only incremental improvements are seen in the test dataset. Additionally,
    we can see that random forests required a larger number of trees to achieve a
    minimum misfit in test dataset, which can be attributed to the random selection
    of predictors when partitioning the data.'
  merge: -1
  img_proc: true
