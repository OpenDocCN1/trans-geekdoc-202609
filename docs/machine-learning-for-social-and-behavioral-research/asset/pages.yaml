    displayed in Figures 7.1 and 7.2.


    In Figure 7.1, we can see a predictable decline in R² when the predictors are
    measured with lower reliability values. The thing to note is that when data are
    simulated according to a linear relationship, linear regression will demonstrate
    superior fit to more complex ensemble methods, with this improvement in fit becoming
    larger as reliability decreases. This can be attributed to the degree of noise
    in the data, with larger noise preventing complex algorithms from finding signal.
    Relative to linear regression can also be seen as a type of shrinkage or regularization,
    as demonstrated in Chapter 4, can be a beneficial attribute when there is a lack
    of information in the dataset, typically ascribed to small sample size. Our emphasis
    here is that measurement can be seen in a similar fashion, lowering the amount
    of information in the data, giving preference to simpler models.'
