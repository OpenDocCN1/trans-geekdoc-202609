- pgno: 433
  md: '# About the Authors


    Ross Jacobucci, PhD, is Assistant Professor in Quantitative Psychology at the
    University of Notre Dame. His research is in the development and application of
    machine learning for clinical research, specifically suicide and nonsuicidal self-injury.
    He is also an active developer of open-source software for the R statistical environment,
    with five packages that implement some form of machine learning. For more information,
    see his website, rjacobucci.com.


    Kevin J. Grimm, PhD, is Professor of Psychology at Arizona State University. Dr.
    Grimm''s research interests include multivariate methods for the analysis of change,
    multiple group and latent class models for understanding divergent developmental
    processes, nonlinearity in development, machine learning techniques for psychological
    data, and mathematics reading ability development. His research has been funded
    by the National Science Foundation, the National Institute of Education, and the
    Institute of Education Sciences. Dr. Grimm received the Early Career Research
    Award from the Society of Multivariate Experimental Psychology in 2017. He is
    an author of Growth Modeling: Structural Equation and Multilevel Perspectives,
    which received the inaugural Barbara Byrne Book Award from the Society of Multivariate
    Experimental in 2021. While at the University of California, Davis, Dr. Grimm
    received the Award for Excellence in Service to Graduate Students from the Graduate
    Student Association and was nominated for the Excellence in Education Award from
    the Associated Students of the University of California, Davis.'
  merge: -1
  img_proc: true
- pgno: 434
  md: Zhiyong Zhang, PhD, is Professor in Quantitative Psychology in the Department
    of Psychology at the University of Notre Dame, where he directs the Lab for Big
    Data Methodology (https://bigdatalab.nd.edu). Dr. Zhang has conducted research
    in the areas of Bayesian methods, structural equation modeling, longitudinal data
    analysis, and missing data and nonnormal data analysis. His recent research involves
    the development of new methods and software for social network and text analysis.
    He is the founding editor of the Journal of Behavioral Data Science.
