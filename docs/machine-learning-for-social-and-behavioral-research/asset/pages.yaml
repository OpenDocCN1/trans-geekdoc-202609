    \ $\beta_k = c(\\beta_{k1}, \\beta_{k2}, \\dots, \\beta_{kV})$ is the probability\
    \ that a word is picked given the topic $k$ is selected. Note that the probability\
    \ is different for different words within different topics. For example, \"easy\"\
    \ and \"difficult\" will have"
