    # 11.8 Topic Models


    A body of text can be written around a specific topic or multiple topics. For
    example, in the teaching comments, one comment may focus on teaching effectiveness,
    another comment may simply talk about the personality of a teacher, and some comments
    may have both. Overall, we can view each comment as a combination or mixture of
    different topics. For example, the effectiveness of teaching and the personality
    of teachers can be viewed as two topics associated with certain words or vocabularies.
    Naturally, for example, when writing on teaching effectiveness, words like “prepared,”
    “clarity,” “organized,” and so on, are expected to be used often. When describing
    personality, words such as “nice,” “open,” and “warm” might be more often used
    than the words for teaching effectiveness.


    Topic modeling or topic models assess the topics and associated words in text.
    Latent Dirichlet allocation (LDA) is probably the most widely used method for
    topic modeling that allows the observed words to be explained by latent topics.
    It assumes that each document, for example, a teaching'
