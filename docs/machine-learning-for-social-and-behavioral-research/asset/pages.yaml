- pgno: 68
  md: '# Machine Learning for Social and Behavioral Research


    The first result to highlight is a visual depiction of overfitting in the mean
    MSE values. We see that as the power increases, the training MSE monotonically
    decreases. This is a typical behavior in using flexible algorithms. In contrast,
    the MSE as evaluated on the test set decreases to a power of 3, and then increases
    with each subsequent increase in power. The right pane tells a similar story.
    While the bias decreases with the use of increasing degrees of flexibility, we
    often see a corresponding increase in the variance of fit of the model. This is
    most clear in the MSE evaluated on the test side (right pane). Increasing degrees
    of flexibility often afford better fit on some samples, but at the expense of
    increased uncertainty with respect to fit. Similar behavior would have been seen
    if we tested the decision trees from Section 3.2 in the same way, with larger
    trees meaning mean MSE on the training sample, at the expense of higher mean and
    variance MSE on the test sample.


    There are a few takeaways from this. The first is the importance of including
    some data splitting or resampling in order to derive a less optimistic or more
    realistic assessment of the model bias. We will discuss this further in the Resampling
    section. Additionally, our concern should be with minimizing both bias and variance
    in selecting models. High degrees of variance can be especially problematic with
    small sample sizes, necessitating the use of less flexible algorithms. The method
    of regularization, which we cover in detail in Chapter 4, is very important for
    minimizing variance. Finally, in assessing bias and variance, our aim is not necessarily
    to select a “true” model, but to choose a model that is appropriately flexible
    given the limitations in our data. Again, this becomes particularly evident when
    modeling data with small sample sizes; either being equal, the larger the dataset,
    the more flexible we can validly conclude is the best fitting model. This is further
    demonstrated in Chapter 4, where forms of regularization keep more variables in
    the model with increasing sample sizes.


    In most settings, the number of predictors will be greater than one, making the
    visual inspection of how well our model''s predictions fit our data difficult.
    This necessitates the use of various metrics that shed light on how well our models
    fit, but instead of answering “How well does my model fit within this sample?”,
    we hope to answer “How well will my model fit on a holdout sample?” There are
    numerous methods for accomplishing this, most of involve splitting the sample
    in various ways, known as resampling, to obtain additional information about the
    performance of our models.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 3.5 Resampling


    To answer the question “How well will my model fit on a holdout sample?”, there
    are a number of methods that were developed to provide answers without the need
    for a second dataset. before detailing these methods, it is important to note
    that this question reflects model assessment, which is distinct from model selection.
    Both concepts can be roughly defined as (Hastie, Tibshirani, & Friedman, 2009):


    Model assessment: Estimating the performance of a single model, or after choosing
    a final new data or data that it would be on new data.


    Model selection: Estimating the performance of multiple algorithms/models and
    choosing a final model among these.


    Model assessment can involve the use of only one machine learning or traditional
    statistical method, whereas model selection involves choosing methods. In the
    first example, we may use model assessment to determine how well a quadratic regression
    model fits. Particularly in small sample sizes, assessing the model on the entire
    sample may result in an overly optimistic assessment of fit, whereas the use of
    resampling, could result in a more realistic assessment of fit. Further, when
    testing on a partition not seen by the model, more complex machine learning algorithms
    such as ensembles (e.g., random forests) have high propensity to overfit the data
    when safeguards for both model assessment and selection are not used.


    To determine how well our model''s predictions will generalize and to select competing
    models, there are three general strategies: cross-validation (CV; e.g., Browne,
    2000), bootstrapping (Efron & Tibshirani, 1986), and the use of different forms
    of fit indices that penalize for model complexity. The goal of resampling methods
    (CV and bootstrapping) is to estimate how well our method will perform on independent
    data with the same characteristics as our original. There are multiple variants
    of cross-validation and bootstrapping, but we focus on two approaches. The first
    is referred to as the validation set approach (see Table 3.1; e.g., Harrell, 2015;
    James, Witten, Hastie, & Tibshirani, 2013), also referred to as the Learn Test
    paradigm (McArdle, 2012). The validation set approach is a strategy not unique
    to machine learning, but has been advocated by social and behavioral scientists
    for decades. The issue with this approach is the loss in power by splitting the
    sample into two. A further variant on this approach involves splitting the data
    into three partitions, train, validation, and test (e.g., Hastie et al., 2009).'
  merge: -1
  img_proc: true
