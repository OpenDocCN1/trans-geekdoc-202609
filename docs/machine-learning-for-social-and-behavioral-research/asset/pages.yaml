    lexicon- or dictionary-based method. The method starts by choosing or building
    a sentiment lexicon. The sentiment lexicon consists of a list of words or phases
    and their corresponding sentiment scores. Ideally, the lexicon should be built
    on the particular research question and context. For example, if the purpose is
    to understand the teaching evaluation based on student comments, then the lexicon
