  md: '# Introduction to Text Mining 287


    card number, or even Social Security number (SSN). Some or all information generally
    should be removed before data analysis or data sharing. For the information with
    a clear pattern such as the email address and SSN, one can search and replace
    them by using regular expressions. For the text without a pattern as names, one
    can first build a list of them and then remove them from the text through search
    and replace.


    # Handling Special Characters


    Text data can include special characters or words. For example, if the text is
    written in English, we would expect that it is comprised mostly of English words.
    However, it is possible that foreign languages are used in part of the text. An
    example is the collection of Facebook data in multilingual users may use words
    from other than English in their posts. Another example, emojis are now widely
    used in social media and other forms of communication. When downloading tweets
    from Twitter, the Emojis are often saved as special characters such as in unicode.
    one can handle the special characters based on the purpose of analysis. For example,
    for text in foreign languages, one can simply remove them. For emojis, they can
    also be removed directly. However, if the purpose of analysis is to understand
    the sentiment of texts, the emojis can provide useful information. In this case,
    the emojis can be coded or replaced with some unique and meaningful texts.


    # Abbreviations


    Abbreviations and acronyms are often used in social media. For example, for the
    teaching evaluation data, "HW" was very frequently used as the abbreviation "homework."
    On Facebook, "BFF" is often used to describe a close friendship. Before analysis,
    these abbreviations should be taken care of that they are not treated differently
    from the words that they represent.


    # Spell Checking


    Spelling errors are much more common in reviews and comments such as teaching
    evaluations than in formal writing. Correcting spelling errors can be time-consuming
    and tedious but can increase the analysis quality later on. The typical way to
    correct them is to first get a list of unique words, including the misspelled
    ones from the text data. Then, we can use Hunspell1 (Ooms, 2017), a popular spell
    checker and morphological analyzer to find words that might be misspelled. After
    that, we ask Hunspell'
  merge: -1
  img_proc: true
- pgno: 306
  md: '288 Machine Learning for Social and Behavioral Research


    to suggest potential replacement words for the misspelled ones. Finally, we replace
    the misspelled words with the suggested correct words.


    # Word Stemming


    Sometimes, different forms of a word that mean the same thing might be used. For
    example, "loves," "loving," and "loved" are all tenses of the word "love." "Better"
    and "best" are the comparative and superlative adjectives of "good." In such situations,
    it is often useful to reduce the related words to their word stem, base, or root
    form, e.g., "love" and "good" in the above examples. Many algorithms are available
    to conduct word stemming dating back to the work by Lovins (1968). Programs such
    as Hunspell can be used word stemming.


    # 11.4.2 Text Tokenization


    In analysis, tokenization is the process of breaking text into pieces such as
    keywords, phrases, symbols, and other elements called tokens. Tokens are often
    in the form of individual words, but they can also be sentences, paragraphs, or
    even chapters. They do not necessarily consist only of words. For example, they
    can be special characters such as punctuation marks and emojis, depending on the
    purpose of the analysis. The tokens from tokenization are machine readable and
    can then be analyzed.


    We use the text in the listing below as an example. One way is to tokenize the
    text into individual sentences as tokens (see below). This is typically by dividing
    the text by punctuation marks. Such tokenization can be useful in natural language
    processing where we are interested in the size of a paragraph and the length of
    a sentence. For this example, there are five sentences in the text. Note that
    it does not check whether a sentence is grammatically correct or not.


    +   [1] "My favorite Professor by far."

    [2] "He is very helpful and willing to give you out the best he can."

    [3] "He will not just give you answers however, but help guide you so that you
    can learn it on your own."

    [4] "I definitely recommend taking him for whatever math courses you can."

    [5] "He requires a lot of work, but it pays off in the run!"'
