    Before providing additional description, we first need to explain what we mean
    by both prediction and description. Going back to our definition of prediction
    in Chapter I, our goal in using machine learning for prediction is to minimize
    the distance from $\hat{Y}$ and $Y$, with $\hat{Y}$ being our predicted outcome
    and $Y$ being the observed outcome. Importantly, $Y$ needs to be from a dataset
    that was not used to train the model (see Chapter 3), thus we are able to derive
    a less biased assessment of the model''s predictive performance. $\hat{Y}$ is
    generated from the same dataset of $Y$, however, this is based on a fixed model
    that was created on a different dataset. Once we have both $Y$ and $\hat{Y}$,
    there are a number of performance metrics that we can calculate (see Chapter 3)
    that answer: “How well did we predict $Y$"


    In using machine learning for social and behavioral research, our aim is just
    prediction, but encompasses some degree of balance between prediction and description.
    Importantly, we can view the goals of prediction, description, and explanation
    as existing in a three-dimensional space (Shmueli, 2010). Description in terms
    of modeling the relationship between a set of predictors and an outcome is most
    clearly captured by the generalized linear model, as each coefficient in the model
    can be interpreted. In contrast to description, pure prediction can be best depicted
    in the use of deep learning (Goodfellow, Bengio, & Courville, 2016), where the
    relationship between the predictors and an outcome is a function of an extremely
    large number of parameters, each of which relates the predictor space to the outcome
    in a nonlinear fashion (see Figure 2.3).


    Just as in regression, performance metrics can be calculated, however, understanding
    the relationships between predictors and the outcome is almost impossible. However,
    one of the primary algorithms that we define, random forests, capture extremely
    complex relationships, often demonstrating the best predictive performance relative
    to other algorithms, but also for some degree of interpretation. Individual relationships
    are not as clear as in linear models, however, variable importance metrics are
    calculated to ascertain which variables contribute the most to the prediction
    of the outcome variable.


    While many methods can be used to evaluate prediction, we take a perspective that
    focuses on whether the methods can be used to fix a set of model parameters, and
    then generate individual predictions in settings where data are fed. Instead of
    implementing a screening algorithm in a hospital, where a patient fills out a
    questionnaire, the answers are entered, and used to generate a predicted quantity
