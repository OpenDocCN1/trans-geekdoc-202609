    # 8.5 Can Regularization Improve Generalizability in SEM?


    In Chapter 4, we looked at how the use of regularization, whether it be ridge,
    lasso, or any generalization, can reduce the complexity of our models and produce
    model estimates that result in higher predictive performance in holdout sets.
    Extending this to our prediction of latent Grit factors, we have two avenues where
    we can explore the utility of regularization. The first is using regularized regression
    in the second step with predicting factor scores, and the second option is building
    regularization directly into our SEM model estimation. This latter approach has
    been referred to as regularized SEM (Jacobucci, Grimm, & McArdle, 2016) or penalized
    likelihood for SEM (Huang et al., 2017). Equivalent in the results produced when
    using the same type of regularization, there are different software'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Machine Learning for Social and Behavioral Research


    implementations of these approaches. For our application, we will use the regsem
    package (Li, Jacobucci, & Ammerman, 2021).


    # 8.5.1 Regularized SEM


    As maximum likelihood estimation (MLE) is the most common form of estimation for
    SEM, RegSEM adds a penalty function to the MLE for structural equation models
    (SEMs)


    ```

    $F_{regsem} = F_{ML} + \lambda P(\), \quad (8.1)$

    ```


    where $\lambda$ is the regularization parameter and takes a value between zero
    and infinity. When $\lambda$ is zero, MLE is performed, and when $\lambda$ is
    infinity, all penalized parameters are shrunk to zero. $P()$ is a general function
    for summing the values of one or more of the model''s parameters matrices (i.e.,
    a norm). Two common forms of $P()$ include $(\|\cdot\_1)$, which penalizes the
    sum of the absolute values of the parameters, and ridge $(\|\cdot\_2)$, which
    penalizes the sum of the squared values of the predictors. In comparison to regularized
    regression, where all predictors are typically penalized, in RegSEM it is more
    common to penalize only a subset of parameters. This takes place because there
    are dependencies between parameters in SEM, most notably the factor loadings and
    residual variances. Therefore, it is most typical to only penalize paths in SEM,
    either penalizing all or just a subset.


    In our example, we may wish to penalize the regression parameters (which can be
    labeled r11-r621 for those regressed on Grit1, and r12-r622 for those regressed
    on Grit2) from the covariates to latent G factors. In total, there are 124 regression
    parameters, each of which could be penalized with the justification that by shrinking
    their estimates, we may produce a more generalizable solution in the test sample.
    Using lasso penalties, the absolute value of these 124 parameters would be summed
    after being multiplied by the penalty $\lambda$, added to Equation 8.1, resulting
    in


    ```

    $F_{lasso} = F_{ML} + \lambda * \begin{pmatrix} r11 \ r21 \ \vdots \ r621 \ r12
    \ \vdots \ r622 \end{pmatrix} \quad (8.2)$

    ```'
  merge: -1
  img_proc: true
