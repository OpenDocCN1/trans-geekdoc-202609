  md: '# Machine Learning for Social and Behavioral Research


    Our goal in this is to better prepare researchers for the inevitable trials and
    tribulations that come in analyzing real data with machine learning algorithms,
    particularly so that researchers do not believe that their data are unique in
    the sense that the analysis results are less than perfectly clear.


    # 2.3.2 Abduction


    In a stark contrast to how machine learning was applied in Brandmaier et al. (2017),
    machine learning is often discussed and presented in a relatively mindless way,
    akin to the sole discussion of null hypothesis testing in introductory textbooks
    (Gigerenzer, 2004). While there is certainly a potential benefit to the mindless
    application of black box algorithms to maximize prediction, there is a much larger
    degree of nuance and integration with theory than often discussed. A less discussed
    narrative is in how social and behavioral science is performed, decreasing support
    for hypothetic-deductive methods. This can be seen as a natural product of a concurrent
    rise in the focus on complexity and the inability of researchers to explicitly
    state theories that can be translated to mathematical models. This, paired with
    criticisms of the hypothetic-deductive approach stemming from the replication
    crisis, has made the conditions ripe for the advent of a new modeling paradigm.
    While machine learning can be characterized as a set of algorithms, we see it
    as an alternative method for conducting psychological science.


    As previously mentioned, machine learning has often been described as inductive,
    which is in contrast to the most prominent account of scientific inference, abduction
    (e.g., Haig, 2014). This also relates to whether machine learning can be used
    for explanation; however, before we discuss machine learning and explanation,
    we wish to show how machine learning can be used for abduction. Following Psillos
    (2002) and Cabrera (2020), abduction can be described as a four-step process:


    +   1. F is some fact or collection of facts

    2. Hypothesis H1, if true, would explain F.

    3. H1 is a better explanation of F than its competitors

    4. Therefore, probably, H1 is true


    The important point here is Step 1, where Cabrera (2020) uses the term *facts*,
    whereas Psillos (2002) uses data (facts, observations, giv). This mimics Cattell
    (1966) termed the *inductive-hypothetical-deductive* spiral, which is quite similar
    to most accounts of abduction (also see Box, 1976). However, most areas of social
    and behavioral research have at least some'
