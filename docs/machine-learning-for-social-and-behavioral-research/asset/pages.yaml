- pgno: 116
  md: '# 4.5.4 Group Regularization


    Sometimes in social and behavioral research our predictors are not completely
    independent from one another. Instead, there are groups of variables, for example,
    five items purported to measure one factor of personality, a set of demographic
    variables, In this case, we may not want to select individual predictors, but
    instead select groups of predictors. The use of the group lasso could be portrayed
    as a less theoretical counterpart to hierarchical regression. This refers to hierarchical
    entry of single or sets of predictors. This is distinguished from what has been
    termed hierarchical, multilevel, or mixed effects models. This later form of modeling
    is about the inclusion of random, opposed to solely fixed, effects to account
    for variability by clustering or time. Hierarchical regression is a more theoretical
    form of modeling where predictors are entered based on a prior specified sequence.
    For a scenario where the numbers of variables preclude strong theoretical specification,
    Yuan and Lin (2007) proposed the group lasso


    ```

    $grplasso = \arg\min_{i=1}^{N} (y_i - \beta_0 - \sum_{j=1}^{P} x_{ij}\beta_j)^2
    + \Lambda \sum_{g=1}^{G} \sqrt{p_g}|\beta_g||_2,\quad(4.9)$

    ```


    where $p_g$ accounts for the varying sizes of groups and $\beta_g$ is the vector
    of all $\beta$ coefficients in group $g$. In the group lasso, the lasso penalty
    penalts at the group level, instead of individual parameters being set to 0, entire
    groups of parameters can be pushed to 0. This does not lead to sparsity within
    group, across groups of predictors. An alternative form of group regularization
    is for scenarios where researchers are not interested in selecting groups, but
    also selecting variables within those groups. This is termed bi-level variable
    selection (Breheny & Huang, 2009). When they wish to penalize at the group level,
    researchers have the option to use the group lasso, with some sparse extensions
    (Huang, Breheny, & Ma, 2012). One, the sparse group lasso (srplasso; Friedman,
    Hastie, & Tibshirani, 2010), has the same group lasso as in Equation 4.5, but
    adds a penalty for each individual predictor,


    ```

    $sgrplasso = \arg\min_{i=1}^{N} (y_i - \beta_0 - \sum_{j=1}^{P} x_{ij}\beta_j)^2
    + \lambda_1 \sum_{g=1}^{G} \sqrt{p_g}|\beta_g||_2 + \lambda_2|\beta_j||_1,\quad(4.10)$

    ```


    where $\lambda_1$ represents the group penalization and $\lambda_2$ is for the
    individual $\beta_j$ coefficients. This model produces sparsity at two levels,
    ideal for incorporating group information into variable selection.'
  merge: -1
  img_proc: true
