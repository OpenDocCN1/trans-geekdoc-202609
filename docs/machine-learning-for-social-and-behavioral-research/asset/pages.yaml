    # 11.4.3 Data Matrix Representation


    Tokenization identifies the units of analysis. When a series of texts, collectively
    called a *corpus*, is available, we organize the texts systematically for further
    analysis. As an example, we use the five sentences previously detailed. Therefore,
    the text corpus consists of five units. After tokenization, we can use a document-term
    matrix (DTM) to represent the information in the text corpus. Other data representation
    methods are also available. A DTM is a matrix where the rows represent the documents,
    comments, sentences, or other bodies of words. The columns are the tokens, terms,
    or words used in the document.


    For example, if we treat each sentence as a document and then tokenize the sentences
    into individual words, we can get a DTM shown below (only part of the matrix is
    shown here to save space):'
