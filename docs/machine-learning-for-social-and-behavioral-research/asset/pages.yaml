    # 4.5 Alternative Forms of Regularization


    # 4.5.1 Lasso $P$-Values


    We understand that most researchers in the social and behavioral sciences rely
    on the use of $p$-values to assess the validity of hypotheses. Using a new statistical
    method that signals variables are important, and not variables have significant
    regression coefficients, can be daunting for a number of reasons. First off, it
    is reasonable to assume that because the most common approach to assessing results
    is through the use of $p$-values, that other researchers, and maybe notably journal
    reviewers, may find the changing of frameworks and terminology unconvincing. As
    a result, we now discuss a recently developed method that computes p values for
    coefficients in lasso regression, taking into account adaptive nature of the algorithm.
    This procedure is based on Lockhart, Taylor, Tibshirani, and Tibshirani (2014)
    that builds on one method for computing the entire path, across all penalty values.
    This computational procedure is called *least angle regression* (LARS; Efron,
    Hastie, & Tibshirani, 2004), of which the lasso is a subset. LASS is actually
    computationally very similar to stepwise regression. Stepwise regression and LARS
    when each predictor is introduced one at a time with their correlation with the
    residuals; however in LARS, when each predictor is entered, the beta coefficient
    is restricted (penalized) to some degree. Along the path of the computation, once
    a predictor enters the model, the beta coefficient is gradually increased until
    an additional predictor has equal magnitude of correlation with the residual.
    This has been found to be a computationally simple approach to computing the entire
    lasso regression solution.


    One of the main challenges in computing p values for the lasso is taking into
