    \ background.\n\n# 1.4 Definitions\n\n# 1.4.1 Model vs. Algorithm\n\nOne of the\
    \ confusing pieces of terminology in the realm of machine learning is the use\
    \ of *model* or *algorithm* when referring to specific aspects of the analysis.\
    \ To put it simply, the *algorithm* refers to the type of method (e.g., linear\
    \ regression, random forest), whereas the term *model* refers to the results of\
    \ fitting an algorithm to data. Thus, fitting an *algorithm* to data yields the\
    \ *model*, and a model can take data as input and provide predictions as output.\
    \ Linear regression is an algorithm. After fitting this algorithm to data, we\
    \ get a model, such as: $\\hat{y}_i = 12.3 + 0.3 \\cdot x_{ij}$. The same thing\
    \ occurs for more advanced algorithms as the resulting model can take data as\
    \ input and generate a predicted value for each observation. The fitting process\
    \ typically requires a higher computational burden, and the relationship between\
    \ input and output is more complex, but the procedure across algorithms is similar.\n\
    \n# 1.4.2 Prediction\n\nTo define what we mean by prediction, we first define\
    \ what we mean by the *terms*. In the simplest case, we can use a single sample\
    \ and fit a linear regression model, $y = x\beta + e$, deriving estimates for\
    \ each of the unknown coefficients, comprising the vector $\beta$. With this,\
    \ we now have estimates that can be used to create predictions for the observations\
    \ in this sample, $\\hat{y} = x\\hat{\beta}$, where $\\hat{y}$ is a vector of\
    \ predictions for our sample. Additionally, we follow Shmueli (2010) in assigning\
    \ the term *predictive model* to the regression equation that produces $\beta$.\
    \ More specifically, we can generally refer to the predictive model as $f(x)$,\
    \ differentiating this from $f(x)$, as $f(x)$ is estimated from the data $x$ and\
    \ $y$, whereas $f(x)$ refers to a general function, such as a linear regression\
    \ or a random forest. Because we are using the same sample to estimate $\beta$\
    \ and $\\hat{y}$, there will be some form of positive bias in our predictive performance,\
    \ such as $R^2$. Instead, we can use separate datasets to estimate $\\hat{\beta}$\
    \ as we do to test $\\hat{y}$. In the simplest case"
