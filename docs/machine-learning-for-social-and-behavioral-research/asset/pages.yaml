  md: '# The Practices of Machine Learning


    +   * Resampling. This refers to the general process of selecting observations
    (rows) from a dataset, oftentimes repeated. In the simplest case, this involves
    splitting a dataset into two partitions, while more complicated methods repeat
    this process a large number of times, and may reuse observations for populating
    the newly partitioned datasets (bootstrap sampling). This is done so that the
    data used to train the model is not used to produce metrics, thus deriving less
    biased assessments of prediction performance.


    +   * Predicted probability. When the outcome is binary, many algorithms generate
    probabilities of belonging to the positive class (coded 1, as opposed to 0). This
    vector of probabilities (one for each observation) can be used to assess (using
    area under the receiver operating characteristic curve [AUC]) or area under the
    precision recall curve [AUPRC], to generate predicted class labels based on a
    cutoff, and then further assessed with a good of fit metrics (i.e., accuracy,
    recall).


    # 3.2 Comparing Algorithms and Models


    In machine learning, there is generally no reason to have a priori notion that
    one method will fit better than any other. This is colloquially known as the “No
    Free Lunch” theorem (Wolpert, 1996). In a more recent paper that tested a broad
    spectrum of data mining algorithms (179 in total) across 121 datasets, although
    a method such as random forests (covered in Chapter 6) did well across many types
    of datasets, there was a large degree of variability in which algorithms performed
    best on each dataset (Fernández-Delgado, Cernadas, Barro, & Amorim, 2014). Our
    point is here that in an individual application, there is no reason to necessarily
    believe that one method will outperform others. Instead, we recommend the use
    of multiple types machine learning algorithms, preferably with varying degrees
    of nonlinearity and interpretation. In almost every application, it is worth including
    a linear model, either linear or logistic regression, or without variable selection
    (i.e., Lasso). Just because you may be able to run some nonlinear algorithm (with
    a catchy name), does not mean that it will necessarily outperform the tried-and-true
    linear model. Particularly with smaller sizes or noisy predictors, highly nonlinear
    models may have too high of a propensity to overfit the data, limiting their performance
    when evaluating either with resampling or on a validation dataset.


    Similar to the use of a nomological network for the testing of theories (Cronbach
    & Meehl, 1955), we believe that conclusions achieve stronger'
