  md: '![](img/5047f0f064e22688ceb5d0cdfaf3e964_61_0.png)


    the outcome as predicted by the independent variable(s). We can calculate this
    coefficient by a number of ways. In the ANOVA framework, we can first calculate
    the sum of squares of regression ($SS_{reg}$),


    ```

    $SS_{reg} = \sum_{i}(f(x_i) - \tilde{y})^2,$$

    ```


    where $\tilde{y}$ is the mean outcome of the observed data, and the total sum
    of squares ($SS_{tot}$)


    ```

    $SS_{tot} = \sum_{i}(y_i - \tilde{y})^2$.

    ```


    Given $SS_{reg}$ and $SS_{tot}$, we can then calculate the $R^2$ as


    ```

    $R^2 = \frac{SS_{reg}}{SS_{tot}}$

    ```


    However, we can also calculate the $R^2$ as the squared correlation between the
    vector of predicted responses and actual responses. This is more common in the
    regression, as opposed to ANOVA, framework, and can best visualized in a plot.
    While both the RMSE and $R^2$ are reported in practice, there is some research
    that advocates using the RMSE, not $R^2$, for comparing predictions across models
