    # 3.5.1 k-Fold CV


    By keeping the original sample intact, one can perform numerous variants of CV,
    with the most common being k-fold CV. This involves repeatedly splitting the sample
    into $k$ partitions (i.e., 5 or 10), running the model on $k-1$ combined partitions
    of the data, and then testing the model on the single partition that is held out.
    To make this more concrete, the general strategy is displayed in Figure 3.8 using
    the 5-fold CV as an example. Before starting, we randomly partition the dataset
    into 5 subsets. In the first step of 5-fold CV, we run the model on 4 randomly
    selected and combined subsets'
