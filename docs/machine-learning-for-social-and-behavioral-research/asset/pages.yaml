    # 4.2 Linear Regression


    Ordinary squares (OLS) regression has been, both historically and currently, the
    estimation method of choice for linear regression in the social and behavioral
    sciences. Particularly when the sample size is small and the number of predictors
    is not large, OLS will have the smallest standard errors and be unbiased, if the
    assumptions are met. However, it is increasingly common for researchers to have
    a larger number of predictors, along with the desire to make inferences into more
    than just a functional of predictors. In these cases, OLS no longer the best suited
    tool.


    With respect to the assumptions of OLS and how to test these, we refer to one
    of the many exceptional regression textbooks (e.g. Cohen, Cohen, West, & Aiken,
    2003; Darlington & Hayes, 2017). In many respects, the methods that we discuss
    have many of the same assumptions. In the rest of this chapter, we discuss various
    applications of regularization, and how this addresses a change from the desire
    to make inferences with respect to only a small number of initial variables to
    scenarios with a larger number of variables.


