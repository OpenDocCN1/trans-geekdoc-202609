- pgno: 123
  md: '# # 5 Decision Trees


    Decision trees are one of the core algorithms of machine learning, both as an
    individual algorithm, as well as forming the basis for many more complex algorithms
    (Chapter 6). Their primary benefit is the level of interpretability afforded by
    the visually depicted tree structure along with propensity to identify interaction
    effects without manual specification. We spend the majority of this chapter focused
    on describing the tree creation process and how to interpret the tree structure,
    while ending with details on the specific implementations and nuances in application.


    # ## 5.1 Key Terminology


    +   - Decision tree. Also commonly referred to as classification and regression
    trees, decision trees refer to an algorithm that recursively partitions the predictor
    space to create a nonlinear mapping from predictors to an outcome. The resultant
    mapping is then depicted as an interpretable tree structure.


    +   - Partition. The process of dividing the dataset into subgroups based on predictor
    cutoff values.


    +   - Heterogeneity. In contrast to homogeneity, heterogeneity refers to the existence
    of between-person variability, namely, assuming that an entire sample represents
    a singular population is untenable.


    +   - Node. A group of cases in a tree structure. The root node refers to the
    entire sample that has yet to be partitioned, while the terminal node is the final
