  md: '# The Principles of Machine Learning Research


    may add incremental prediction and/or understanding to the use of traditional,
    linear models. Further, a subset of the algorithms detail allows for the analysis
    of new types of data, such as in the use of social network or text data.


    To replicate how machine learning fits into the current climate of science, we
    propose four principles that we believe will better orient and guide social and
    behavioral researchers in the application of machine learning:


    +   * Principle #1: Machine Learning Is Not Just Lazy Induction

    * Principle #2: Orienting Goals Relative to Prediction, Explanation, and Description

    * Principle #3: Labeling a Study as Exploratory or Confiratory Is Too Simplistic

    * Principle #4: Report Everything


    # 2.3 Principle #1: Machine Learning Is Not Just Lazy Induction


    Machine learning has both benefited and suffered from outlandish claims regarding
    the paradigm shift that will occur. An article maligned, particularly from those
    with a more traditional scientific background, is the article by Anderson (2008)
    in *Wired*. This article provides a convenient bogey man for those espousing traditional
    forms of scientific reasoning, hypothetical-deductive and abstract, in contrast
    to Anderson''s inductive arguments. This debate debacts a large degree of nuance
    inherent in applying machine learning algorithms, and maybe more importantly,
    in the integration of theory with machine learning. This latter piece is often
    neglected in favor of describing machine learning in simplistic, theoretical terms,
    often using the monicker black box or some form of the predictive. While the use
    of machine learning is often motivated by goals that do not take into account
    explanatory or descriptive aims, we view this as a consequence of the majority
    of papers describing machine learning as eschewing theory. Thus, it is our goal
    to provide additional depth regarding the goals of machine learning, as well as
    to describe the potential for incorporating theory.


    As stated previously, the application of machine learning is often dictated in
    large part by the data at hand, lending itself to scenarios where the data contain
    larger numbers of variables, thus larger numbers of'
