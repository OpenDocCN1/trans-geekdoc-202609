- pgno: 154
  md: '# #6 Ensembles


    Decision trees can make flexible, powerful, and interpretable prediction models;
    however, they are not without their limitations. Decision decision trees include
    bias in variable selection, parameter instability, and poor prediction in future
    samples (e.g. Berk, 2008; Hastie et al., 2009). Ensemble methods, where multiple
    prediction models are estimated, were developed to overcome these limitations
    of decision trees. For many ensemble methods, their underlying rationale comes
    from sampling theory; for example say we are trying to estimate a population parameter
    (e.g., mean, regression coefficient). Holding all else constant, our estimate
    of the population parameter improves (and the standard error shrinks) when sample
    size increases. The decision tree estimated in our sample represents a single
    prediction model. Ideally, we would draw samples from the population and estimate
    a decision tree for each sample. Then, the predictions from the ensemble of decision
    trees could be combined to create the final prediction for each individual. Since
    obtaining multiple samples from the population is not feasible, many ensemble
    methods rely on the bootstrap. That is, the data are bootstrapped, a decision
    tree is fit to each bootstrapped sample, and the predictions are averaged to create
    the final prediction model. In this chapter, we review several ensemble methods
    that differ in their approach, but all methods create an ensemble of prediction
    models to create the final prediction model.


    #  6.1 Key Terminology


    +   - Ensemble. A combination of individual models. In this chapter we discuss
    ensemble methods that create a large number of individual decision trees and aggregate
    the predictions.


    +   - Bagging. Creating an ensemble of individual decision trees on independently
    generated bootstrap samples.


    +   - Boosting. Creating an ensemble of individual trees in a sequential process
    using the residuals from the previously created set of trees.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   Permutation. A form of resampling where case outcome values are shuffled
    (permuted) to be used in statistical tests. In more traditional statistical use,
    permutation tests are used to create a null distribution to calculate significance.


    +   Node purity. In a terminal node, the percentage of cases that have the same
    observed outcome value.


    +   Conditional inference forests. An alternative form of random forests that
    use different statistical tests to calculate variable importance.


    +   Gradient. This term is often used to refer to the partial derivatives in optimization,
    in this chapter, the gradient refers to the residuals for each case and how these
    are used to create the new tree.


    +   Learning rate. In gradient boosting, the learning rate refers to how fast
    or slow the residuals (gradient) are updated based on the predictions for each
    tree.


    +   Partial dependency plot. An approximation of the relationship between a predictor
    and outcome while controlling for all other predictors. This is often used for
    ensemble methods given that interpretable “effects” are not generated for individual
    predictors.


    # 6.2 Bagging


    One the first proposed ensemble methods was bootstrap aggregation, or bagging
    (Breiman, 1996a). The algorithm proceeds in two steps. First, a bootstrap sample
    is taken. To create a bootstrap sample, the data are resampled with replacement
    and each bootstrap sample has a size equal to that of the original sample. For
    each bootstrap sample, a decision tree is fit using all predictor variables as
    potential splitting variables. Given that each bootstrap sample is different,
    each tree will have a unique structure manifested in the variables used, splitting
    values chosen, and tree size given the instability of decision trees. Once a series
    of decision trees are estimated, the predicted values for each person from each
    of the trees are output and then averaged to create the final prediction. More
    formally, predictions from a bagging model are created


    ```

    $f_{bag}(x) = \frac{1}{B} \sum_{b=1}^{B} f^{b}(x)$

    ```'
  merge: -1
  img_proc: true
