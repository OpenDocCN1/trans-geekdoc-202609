    \ See Chapter 5 for additional details.\n\n# 9.2 Mixed-Effects Models\n\nThe linear\
    \ mixed-effects model can be written as\n\n```\n$y_{ij} = x_{ij}\\beta_p + z_{ij}u_{ij}\
    \ + e_{ij} \\quad (9.1)$\n```\n\nwhere $y_{ij}$ is the observed outcome score\
    \ for observation $i$ in cluster $j$, $x_{ij}$ is the $p$th predictor variable\
    \ for observation $i$ in cluster $j$, $\beta_p$ is the $p$th fixed effects parameter,\
    \ $z_{ij}$ is the $q$th predictor variable for observation $i$ in cluster $j$,\
    \ $u_{ij}$ is the $q$th random effect for cluster $j$, and $e_{ij}$ is the residual\
    \ for observation $i$ in cluster $j$. The q random effects are not estimated,\
    \ but assumed to follow a multivariate normal distribution with a mean of 0 and\
    \ unknown variance-covariance matrix. That is, $u_{ij} \\sim N(0, G)$, where $G$\
    \ is a covariance matrix. Typically, the residuals $e_{ij}$ are assumed to follow\
    \ a normal distribution with a mean of 0 and an unknown variance. That is, $e_{ij}\
    \ \\sim N(0, R)$, where $R$ is equal to $I\\sigma_e^2$. Lastly, the random effects\
    \ are assumed to be uncorrelated with the random effects (i.e., $cov(e_{ij}, u_{ij})\
    \ = 0$).\n\nAs an example of a mixed-effects model, let's assume we're trying\
