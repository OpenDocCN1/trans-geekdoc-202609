    # 10.2.1 Search Procedure and Evaluation


    In mixture modeling, the number of classes as well as the model and parameters
    for each class are unknown. Because of this, a comprehensive search is often employed.
    To simplify the search process, the model type within each class is assumed to
    be known (e.g., single-confirmatory factor model). This leaves the number of classes
    and the model''s parameters for each class as unknown. To examine this model space,
    multiple models are estimated with a different number of classes and different
    model constraints (e.g., factor loadings of the single-factor model constrained
    to be freely estimated across classes). For example, Ram and Grimm (2009) laid
    out an approach for specifying growth mixture models. In this approach, a finite
    number (e.g., 4) of different model specifications is considered prior to analysis.
    These model specifications are theoretically derived and of interest to the researchers.
    Next, these model specifications are estimated with an increasing number of classes.
    The number of classes is increased until the model fails to converge or model
    fit improves. Once the set of models are estimated, they are compared in terms
    of model fit, model sensitivity, model implications, and classification quality
    to determine an optimal model or an optimal set of models.


    Model comparison by model fit statistics has a vital area of research in finite
    mixture modeling. This work often involves simulations, and researchers have made
    different recommendations regarding which'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Machine Learning for Social and Behavioral Research


    model fit statistics should be employed for comparison. This work also highlights
    how these recommendations can be sensitive to the population considered, models
    specified, and sample sizes evaluated. We first review different model fit statistics
    and then discuss our recommendations. Finite mixture models are typically estimated
    using a form of maximum likelihood estimation, the first model statistics include
    information criteria, such as the Akaike information criterion (AIC), the Bayesian
    information criterion, and variants of these criteria, as the sample size adjusted
    BIC and the corrected log-likelihood (AICc). Information criteria combine the
    model deviance (-2 log-likelihood [-LL]) to assess how well the model captures
    the data and a penalty for the number of estimated parameters. Information criteria
    vary in the size of the penalty. For example, the AIC is -2LL + 2p, where -2LL
    is the model''s deviance and whereas the BIC is -2LL + In(N)p, where In(N) is
    the natural log of the sample size. Thus, the penalty for an estimated parameter
    in the AIC is 2, and the penalty in the BIC is favoring parsimonious models compared
    to AIC when sample size is greater than seven. Information criteria can be used
    to compare both nested and different parameter specifications. When using information
    criteria for comparing models, the model obtaining the lower information criteria
    value is considered the superior fitting model.


    The second group of model fit statistics is the approximate likelihood ratio tests.
    Finite mixture models that only differ in the number of classes are considered;
    however, the difference in their variances under the null hypothesis are not asymptotically
    chi² distributed. Thus, corrections have been proposed, using the Vuong-Moendell-Rubin
    Approximate Likelihood Ratio Test and the Moendell-Rubin Adjusted Likelihood Ratio
    Test (Lo), Mendel, & Rubin, 2001). These likelihood ratio tests provide a statistic
    and associated p-value, which compares the fit of the specified model (the K classes)
    with the fit of the same type of model with one fewer class. In addition to approximate
    likelihood ratio statistics, there is the Bootstrap Likelihood Ratio Test (BLRT,
    McLaughlin, 1987). The BLRT repeatedly simulates data according to the specified
    model and the model with one fewer class, and then estimates the specified distribution
    of likelihood ratio under the null hypothesis. This distribution is then used
    as a comparison distribution to obtain the p-value for the observed likelihood
    ratio. A final approach is based on using k-fold cross validation (Grimm, Mazza,
    & Davoudzadeh, 2017) for model selection in.'
  merge: -1
