    # 8.2 Latent Variables as Predictors


    Presently, we will assume that the outcome of interest (e.g., distal outcome)
    is a singular, observed variable, either assumed to be continuous or binary (most
    of what we discuss generalizes to alternative distributions for an observed outcome).
    The main distinction between these types of outcomes is the type of estimation
    used. Just as in the distinction between linear and logistic regression, in structural
    equation modeling we can account for different types of outcomes by altering the
    form of estimation used. The default in SEM software is maximum likelihood estimation
    (Jreskog, 1969), and the extension full information maximum likelihood (for further
    detail on handling missing data in SEM and the types of missingness, Enders, 2010),
    allows for the inclusion of missing data. When the outcome is categorical, either
    binary or ordered polytous¹, a number of estimation methods are available, with
    the most common being the use of some variant of weighted squares. This alters
    the parameters of the model and their interpretation in a very similar way as
    the interpretation is altered in moving from linear regression to logistic or
    ordinal regression. We note, however, that mainly applies to endogenous (variables
    with paths directed to them) and not exogenous (variables that have paths emanating
    from them).


    When our observed predictors of interest are greater than just a few (e.g., >
    5), we have a number of distinct modeling options. Most often in social and behavioral
    research a least subset of the predictors will come from the same scale, or be
    similar constructs as other predictors. In deciding which modeling strategy is
    most appropriate, a number of additional factors need to be considered. These
    include, but not limited to:


    > Software as Mplus can handle additional outcome types such as poisson, nominal,
    or censored.'
