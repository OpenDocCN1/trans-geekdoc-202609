    # 10.3.3 Focused Assessment


    Given the nonlinearity present in trees, one point of assessment with SEM trees
    may be able to explain or prediction of the latent variables in the model. Analogous
    to the use of linear predictors in a MIMIC model, deviating from the focus on
    derived groups or classes as in a mixture model, this type of modeling requires
    a degree of alteration to be done properly. Most likely, this requires the placement
    of constraints to ensure that we are measuring the same construct across groups
    to assess differences in factor loadings, means, variances and covariances. In
    the case of examining differences in just the latent variables, we instead focus
    on the latent variable means, variances, and covariances, while placing constraints
    on other parts of the model to ensure that our interpretation of each latent variable
    stays consistent across nodes. This is known as measurement invariance (Meredith,
    1993; Reise, Widaman & Pugh, 1993). Although there are many variations to invariance
    testing, notably which set of parameters to constrain to be equal across groups,
    we focus on imposing a strict form of invariance by constraining all of the factor
    intercepts, and residual variances to be equal across groups. This can easily
    be done within the seperate package (using global.invariance = name of parameters),
    allowing only the other parameters (latent variances and covariance) to vary across
    groups.


    In mixture models, it is relatively easy to examine the mean of the latent variables
    across the derived classes. This is accomplished by specifying a reference class
    that has a latent mean of zero, thus freeing the assessment of the latent means
    in other classes. If this constraint was not imposed, the latent means would be
    underspecified. This leads to complications in using SEM trees, it is not possible
    to specify a reference group. As a result, we have to get a little creative in
    order to examine the latent means across groups. The first step is centering the
    intercepts in the model will be zero (or very close). Given this, we do not alter
    any other parts of the model by constraining the intercepts to zero since it matches
    the values at which they would be estimated. This'
