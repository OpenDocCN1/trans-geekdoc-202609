    # 10.2.3 Factor Mixture Models


    In identifying heterogeneity, researchers often have outcome variables of interest
    that they wish to use as a basis for examination. When these observed outcome
    variables come from the same or similar scales, or are the same variables assessed
    at different points in time, it often makes theoretical sense to place constraints
    on their covariance in the form of latent factors. One of the most general formulations
    is factor mixture models (Lubke & Muthén, 2005), whereas classes are estimated
    with respect to some factor model. This model represents a combination of latent
    variable types, a categorical latent variable used as the basis for grouping,
    and a continuous latent variable that summarizes the covariance among observed
    outcome variables. Thus, within each of the classes, a common factor model is
    estimated with a subset of parameters allowed to various classes.


    A nice demonstration of factor mixture models is Arias, Garrido, Jenaro, and Arias
    (2020), where a two-class model is used to detect careless responding. Using survey
    data, they specified single-factor models for each scale within each class. While
    the residual variances and intercepts were specified to be equal across the two
    classes, different loading matrices were used. In the majority class, each loading
    was constrained to 1, or –1, depending on whether the item was positive or negative
    valence. It was hypothesized that careless responders would fill out each item
    the same way regardless of valence, thus this loading matrix would capture'
  merge: -1
  img_proc: true
