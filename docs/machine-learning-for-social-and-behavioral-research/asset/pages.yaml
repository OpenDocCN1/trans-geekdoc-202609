  md: '# 176 Machine Learning for Social and Behavioral Research


    **FIGURE 7.1.** Simulation results across different values of reliability for
    data simulated according to linear relationships.


    ![](img/5047f0f064e22688ceb5d0cdfaf3e964_194_0.png)


    varying the reliability of 0.3, 0.6, or 0.9. Additionally, we varied the sample
