    # 10.3.4 SEM Forests


    Many of the drawbacks of decision trees mentioned in Chapter 5 also apply to SEM
    trees. It is worth noting that the purpose of SEM is to predict an outcome and
    more to identify heterogeneity with respect to a statistical model. For this reason,
    less focus is placed on assessing model performance, particularly because it is
    not in a metric that is easily interpreted as $R^2$ or accuracy. With the issue
    of decision trees being inherently unstable, it is not recommended to follow the
    creation of a tree structure with assessing variable importance with random forests
    or boosting. The analog with respect to SEM is the application of SEM forests
    (Brandmaier et al., 2016). SEM forests applies the trees hundreds of times, each
    using a subset of variates to create each tree (mtry; just as in random forests).
    A great example of the application of SEM forests as a supplement to SEM trees,
    particularly to validate the selection of variables for the tree structure is
    in Brand et al. (2017). In practice, we would expect to see the same variables
    used to create the tree structure appear to have higher relative importance values
    in comparison to those not selected in the tree structure. In SEM forests, variable
    importance is calculated through permutation accuracy, which follows the procedure
    described in Chapter 6. In contrast to random forests, SEM forests’ variable importance
    is based on the decrease in the log-likelihood, which is averaged across the set
    of trees to produce variable estimates for each variable.'
