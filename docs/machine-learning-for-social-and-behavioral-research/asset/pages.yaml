    For example, for h = 1, when both students are male or female, otherwise, h =
    0. In contrast, for the differential homophily effect, the statistic is defined
    as


    ```

    $h_{ij}=h(x_i,x_j)=\begin{cases} 1 & \text{if both } i \text{ and } j \text{ have
    the specific factor level} \ 0 & \text{otherwise.} \end{cases} \quad (12.6)$

