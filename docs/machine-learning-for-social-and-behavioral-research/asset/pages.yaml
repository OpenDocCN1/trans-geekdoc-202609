    \ Consider a 100-word comment with two topics—effectiveness and personality of\
    \ the teacher. In the comment, 70 words are organized around the effectiveness\
    \ of teaching and 30 words on the personality of the teacher. Therefore, the topic\
    \ probabilities are 0.7 and 0.3 for the two topics. A much larger set, for example,\
    \ 1,000 words, can be used to describe the two topics. The 100 words are actually\
    \ selected from them based on the word probability associated with the topics.\n\
    \nClearly, it is critical to specify $\theta$ and $\beta$. LDA assumes that both\
    \ are generated from a Dirichlet distribution. For topic probability, it uses\n\
    \n$\\theta \\sim \\text{Dirichlet}(\\alpha)$\n\nfor each document $m$. For word\
    \ probability, one can use\n\n$\\beta \\sim \\text{Dirichlet}(\\delta)$\n\nIn\
    \ the Dirichlet distribution, $\\alpha$ and $\\delta$ are either predetermined\
    \ or parameters to be estimated.\n\nIn many scenarios, parameters in LDA models\
    \ are not known and need to be estimated. This is a reverse-engineering process\
    \ to find the number of topics, the associated topic probabilities as well as\
