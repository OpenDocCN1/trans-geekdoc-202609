    # 2.5 Principle #3: Labeling a Study as Exploratory or Confirmatory Is Too Simplistic


    Often, the terms exploratory or confirmatory are used to provide a metascription
    of the research conducted and to conduct research that lies on the continuum between
    exploratory and confirmatory. Although this continuum is not difficult to understand,
    at the very least, most researchers agree on the research that falls at the end
    points. Fully confirmatory research entails full theoretical justification for
    study design and the analyses performed (these studies are often experimental
    in nature), whereas exploratory research lacks theoretical justification and is
    described as the “kitchen sink” approach. However, difficulties arise in assessing
    research: theoretical justification for variable inclusion, not what types of
    relationships are examined; partial inclusion of nonoretically justified variables;
    transforming a variable-based sample distribution; and studies with little theoretical
    justification, to name a few. As described above, this becomes increasingly difficult
    as the number of variables increase and as the algorithm options expand.


    Machine learning is often described as the kitchen sink approach: just throw everything
    in and see what comes out. This is often depicted as the miners of the 1800s holding
    up a golden nugget, data mining. In practice, researchers often use theoretical
    justification for the sample and variables analyzed, and may even hypothesize
    on the presence of specific interactions. However, there are no hypotheses for
    every variable included, which variables will be most important, and the degree
    of prediction error. Obviously, these characteristics do not just justify a label
    of confirmatory research, and because there is some theoretical justification,
    it is not entirely exploratory research either. But how much confirmatory (or
    less exploratory) is this than the kitchen sink approach?


