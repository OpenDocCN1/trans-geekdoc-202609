    # 8.7.2 Computational Time and Resources


    Most structural equation models do not take more than a couple of seconds

    to run. However, when testing large models (e.g., more than 20 variables) or

    using different estimators to account for categorical variables, for instance,

    it can change the typical run-times to a couple of minutes. The addition of

    regularization necessitates testing a number of penalty values, along with

    constraining the computational complexity. For most of the models in this chapter,

    run-times were on the order of a few minutes to half an hour. Bayesian

    regularization typically takes much longer to run as it may require a large

    number of samples to converge to stable estimates. This can be sped up by

    using multiple chains, each of which can be run in parallel.'
