  md: '# C ≡ \Lambda\Phi\Lambda''.


    Thus, whereas factor analysis models only the shared variance among a set of variables,
    PCA models the total variance among the variables. A closely related approach
    to PCA is singular value decomposition (SVD). SVD is a general decomposition algorithm
    and is used widely given its efficiency in transforming a data matrix into a set
    of three new matrices


    ```

    x = USV''.

    ```


    From this, we can see that we are decomposing our data matrix x into the three
    matrices. Understanding the meaning of each matrix is beyond the scope of this
    chapter. Given that the decomposition of SVD is in relation to x, we can relate
    these results back to C in that


    ```

    C = V\frac{S^2}{\n-1}V

    ```


    n is the sample size. Given this translation of results between PCA and SVD, it
    is often more efficient to compute the results from PCA by decomposing the data
    matrix with SVD, as opposed to first calculating C. In fact, the built-in function
    for PCA in R uses SVD by default to compute \Lambda and \Phi.


    A great deal of literature exists in psychometrics that has examined and debated
    when it is best to use factors and which components are most appropriate (for
    instance, see Velicer & Jackson, 1990 and the responses). In general, if the goal
    is to simplify a set of predictors that are extremely large or contain redundancy
    (collinear predictors), then PCA may be most appropriate. However, if the goal
    is to extract scores that are thought to reflect latent dimensions that underlie
    the variables of interest, with corresponding psychological interpretation, then
    factor analysis is most appropriate (Widan, 1993).


