  md: '# Ensembles


    et. al., 2015) in R. XGBoost alters the objective function of gradient boosting
    so it includes a regularization component, which smoothens the continuation from
    each of the individual trees. In XGBoost, the objective function is


    ```

    $L^{(t)} = \sum_{i=1}^{n} l(y_i, \hat{y}_i^{(t-1)}) + f_t(x_i) + \Omega(f_t),
    \quad (6.3)$

    ```


    for tree $t$ in the sequence of trees, with $\Omega(f_t)$ being the regularization
    term for tree $t$. This regularization helps to prevent overfitting in the creation
    of each tree, and is combined with the shrinkage component of gradient boosting
    to further reduce the influence of each tree. Moreover, XGBoost implements a number
    of additional components, including features that take advantage of parallel learning,
    sparse data structures, and utilizing approximations to the loss function and
    optimal tree structure to reduce computational complexity. Note that there are
    two variations on XGBoost implemented in the caret package, xgboostlinear and
    xgbTree, with the difference between boosting on linear models (e.g., regression)
    versus decision trees as base learners, respectively.


    # 6.5 Interpretation


    A number of different methods have been developed for investigating the relationships
    between variables when using ensemble algorithms. These can be broken up into
    methods that assess global interpretation or local interpretation. In contrast
    to global interpretation methods, aggregate effects across individuals (rows),
    local interpretation hones in on individual cases. We devote more space to global
    interpretation methods, and only briefly cover local interpretation. For additional
    detail on these approaches, see Molnar (2019).


    # 6.5.1 Global Interpretation


    After testing an ensemble method, such as random forests or gradient boosting,
    researchers may want to dive deeper into the results to determine what types of
    relationships were modeled by the algorithms. Although the totality of a variable''s
    effect can be captured in variable importance, the actual relationship is not
    clear. One approach to probing relationships is using partial dependence plots
    (Friedman, 2001). The idea behind dependence plots is to visualize the effect
    of a variable in a "black box" type algorithm. Broadly speaking, this involves
    examining the effect of $x_1$ on $y$, after accounting for the average effects
    of $x_C$, where $x_C$ represents all other predictors. Note that this is not the
    relationship'
