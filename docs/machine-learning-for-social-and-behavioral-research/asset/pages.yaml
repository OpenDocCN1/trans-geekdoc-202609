  md: '+   Ordinary least squares (OLS). The most common form of estimation in linear
    regression, OLS involves minimizing the sum of squared residuals.


    +   Regularization, shrinkage, or penalized likelihood. An alternative form of
    estimation often used in regression to reduce the propensity to overfit or perform
    variable selection.


    +   Variable selection. A common goal in statistics where alternative type of
    regression (regularization or stepwise) is used to remove predictor variables
    from the model.


    +   Standardization. An important step when applying regularization, standardization
    involves transforming predictor variables to have a mean of 0 (centering) and
    standard deviation (scaling) of 1. This does not alter the relationship between
