    # 11.6 Sentiment Analysis


    Sentiment analysis, also known as opinion mining or emotion AI, is a method of
    text analysis to systematically identify and quantify the affective state and
    subjective information in text. The basic idea is that the text reflects the emotional
    response to an event that a writer experiences (Tauskik & Pennbacker, 2010). For
    example, positive emotion words such as love, nice, and sweet are used in writing
    about a positive event, and negative emotion words such as hurt, ugly, and nasty
    are used in writing about a negative event (Kahn, Tobin, Massey, & Anderson, 2007).
    Most sentiment analyses focus on the polarity of text, where polarity is a measure
    of the extent to which a text is more positive or negative. However, methods are
    also available to look "beyond polarity" to identify dominant emotions such as
    joy, anger, and fear.


    Although more complex methods such as latent semantic analysis and deep learning
    are available, the most common method for sentiment analysis employs the knowledge-based
    or dictionary-based techniques. The dictionary-based techniques identify the sentiment
    of a text based on the presence of predetermined sentiment words such as happy,
    sad, afraid, and'
  merge: -1
  img_proc: true
