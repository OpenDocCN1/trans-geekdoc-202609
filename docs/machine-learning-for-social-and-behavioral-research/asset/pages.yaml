  md: 'Francis, & Booth, 2001), which is implemented as a commercially available software
    program (Pennebaker, Boyd, Jordan, & Blackburn, 2015). LIWC analyzes text according
    to a dictionary comprised of 6,400 words, word stems, and emoticons, largely related
    to psychological processes (e.g., affective, social processes; Pennebaker et al.,
    2015). From this analysis, users get an output of scores on 90 components of the
