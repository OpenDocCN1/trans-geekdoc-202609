    # 7.7 Summary


    In this chapter, we discuss a number of ways and methods for assessing variables
    to be used as predictors. Notably absent was a discussion of error in the outcome
    variable. Similar approaches can be used as explained above if the outcome is
    a scale score, including modeling the latent variable representation in an SEM
    model (see Chapter 8). However, just with a single predictor variable, there is
    no way to overcome the error in an outcome variable when the aim is prediction.
    Finally, it is almost always preferable to use the individual items as opposed
    to scale scores when maximizing predictive performance is the goal. Along with
    this, we recommend assessing the reliability of individual items and scales to
    provide additional information into why some items/scales were more important,
    or why prediction was lower than expected.'
