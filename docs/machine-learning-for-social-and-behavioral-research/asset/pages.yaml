    as well as increase the instability of decision tree results. In this chapter
    we integrate concepts from Chapters 4 and 7 in using structural equation modeling
    (SEM) to account for measurement error while incorporating concepts more traditionally
    used in machine learning.


    The preceding chapters (Chapters 4-6) focused primarily on predictive aims, and,
    to a lesser extent, descriptive aims in assessing relationships and variable importance.
    The idea of prediction in SEM has long been discussed and debated, because of
    the uncertainty regarding the application of SEM for purely predictive purposes,
    caseworkewise. Given that SEM is a multivariate method that encompasses the estimation
    and modeling of covariance matrices, individual responses on X or Y variables
    are not necessary for the majority of models. With this in, and given that SEM
    cannot generate casework for some models (Evermann & Tate, 2016), alternatives
