  md: "# 12.6.6 Terms Related to the Edge Covariates\n\nEdge covariates can also be\
    \ included in ERGM. For example, the covariate could be another network. It can\
    \ also be information derived from latent network such as the shortest path.\n\
    \n# 12.6.7 Latent Space Model\n\nAnother class of network models is constructed\
    \ around latent attributes rather than the observed attributes in ERGM (Snijders,\
    \ 2011). One such model is the latent Euclidean space model proposed by Hoff,\
    \ Raftery, and Handcock(2002). In the model, each node is assumed to be associated\
    \ with a latent position in a Euclidean space. The distance of two nodes in the\
    \ latent space is related to how likely they are connected in the network. $z$\
    \ be a vector of latent positions of node $i$ in the latent space. For nodes $i$\
    \ and $j$, the Euclidean distance between them is:\n\n```\n$d(i, j) = \\sqrt{(z_i\
    \ - z_j)(z_i - z_j)} = \\sqrt{\\sum_{d=1}^{D}(z_{id} - z_{jd})^2} \\quad (12.7)$\n\
    ```\n\nwhere the symbol $(\\cdot)$ is the transpose of the matrix or vector, $D$\
    \ is the dimension of the Euclidean space, $z_i = (z_{i1}, z_{i2}, \\dots, z_{iD})$\
    \ and $z_j = (z_{j1}, z_{j2}, \\dots, z_{jD})$ are the latent positions of nodes\
    \ $i$ and $j$, respectively. With this distance function, the latent space model\
    \ can be written as\n\n```\n$$\\begin{cases} a_{ij} & \\sim \\text{Bernoulli}(p_{ij})\
    \ \\ \\text{logit}(p_{ij}) &= \\alpha + \\beta h'_{ij} - d_{ij} \\end{cases} \\\
    quad (12.8)$\n```\n\nwhere $\\alpha$ is an intercept, $h_{ij}$ is a vector of\
    \ covariates and $\beta$ is the associated coefficients of the covariates. The\
    \ covariates can be related to the nodes/or edges of the network. The coefficient\
    \ for $d_{ij}$ is fixed as $-1$. Therefore, the closer two nodes are in the latent\
    \ space, the higher the probability for them to be related after controlling the\
    \ covariates in the model.\n\nTo fit the latent space model, we need to find the\
    \ dimension of the latent space. One way to determine it is to compare models\
    \ with different latent dimensions based on BIC. For example, for the WeChat network\
    \ data, we fit the model with $D=1, \\dots, 9$:\n\n```\n$$\\begin{cases} a_{ij}\
    \ & \\sim \\text{Bernoulli}(p_{ij}) \\ \\text{logit}(p_{ij}) &= \\alpha - \\sqrt{\\\
    sum_{d=1}^{D}(z_{id} - z_{jd})^2} \\end{cases} \\quad (12.9)$\n```\n\nThe BIC\
    \ for the fitted model is plotted in Figure 12.12. Clearly, the model with 2 latent\
    \ dimensions has the smallest BIC. This means that the"
  merge: -1
