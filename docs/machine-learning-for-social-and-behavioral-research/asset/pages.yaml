  md: '# #2 The Principles of Machine Learning Research


    Applying machine learning takes more than just understanding the methods and algorithms,
    particularly for social and behavioral research. In this chapter, we discuss our
    perspective on the philosophical foundation of applying machine learning in the
    current climate of science, addressing a number of competing notions and ideologies.
    Specifically, we detail how machine learning research is oriented with four principles
    that address the goals of machine learning, accurately labeling and describing
    machine learning research, and how to be transparent about what done.


    # ## 2.1 Key Terminology


    +   - Explanation. Research with the aim of understanding the underlying mechanisms.


    +   - Description. Research with the aim of describing relationships or distributions.


    +   - Prediction. Research with the aim of maximally explaining variability in
    an outcome.


    +   - Inductive. Moves from observation (data) to hypothesis to theory.


    +   - Hypothetico-Deductive. Moves from general to more specific, from theory
    to observation (data) to confirmation.


    +   - Abductive. Moves from observation (data) to deciding among competing theories
    to determine which best explain the observation.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   Exploratory Data Analysis. This has traditionally referred to the use of
    data visualization tools, while in recent years has encompassed the use of machine
    learning as an exploratory analytic tool.


    # 2.2 Overview


    Increases in the application of machine learning have occurred simultaneously
    with an elevated emphasis on the use of exploratory research, best encapsulated
    in the term of data mining. Most conceptualizations eschew the use of hypotheses
    in favor of predictive modeling, or mining to see what golden nuggets are yet
    to be discovered. However, there is a concurrent rise in the re-emphasis of confirmatory
    modeling, mainly by the result of the rise in research that has not been able
    to reproduce findings in social and behavioral research, termed the replication
    crisis (e.g., Maxwell, Lau, & Howard, 2015). Indexed, questions regarding replication
    have spanned disciplines, along with an extension from experimental research to
    the application of highly complex models (e.g., Haibe-Kains et al., 2020). Therefore,
    the fundamental question that a book advocating for the use of machine learning
    has to answer is how we reconcile a advocacy for both exploratory and confirmatory
    research? To address this, we first define and distinguish the concepts of confirmation
    and exploration, concluding with our perspective on how machine learning is paired
    with theory and fits into the current state of science.


    The use of machine learning in social and behavioral research is less a movement
    to replace traditional methods of analysis, and more a necessary addition given
    the increases in the size and kind of available data. The rationale for machine
    learning goes beyond being a necessity and also reflects a change in mindset.
    In the past, scientific culture valued theoretical simplicity, which may be captured
    in: ‘just’ as the ability to devise simple but evocative models is the signature
    of the greatest scientist overaboration and overparameterization is the mark of
    mediocrity.(Box, 1976, p. 176). In contrast, most recent concepts propose that
    truly understanding various phenomena require infinite degrees of complexity (Lin,
    Tegmark & Rolnick, 2017), which may be best encapsulated by the use of black algorithms,
    where complexity is strongly favored over parsimony (e.g., Holm, 2019). These
    competing notions set up a fundamental tension between old and new, parsimony
    versus complexity, linear models versus black algorithms. However, we do not see
    it in terms of a dichotomy. Instead, our fundamental goal in this book is to propose
    the use of methods that'
