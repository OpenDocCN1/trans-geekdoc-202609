  md: "# 12.6 Network Modeling\n\nThe analysis in the previous section utilizes the\
    \ information in a network indirectly. In this section, we introduce several models\
    \ that can directly model a network.\n\n# 12.6.1 Erdos–Rényi Random Graph Model\n\
    \nThe Erdos–Rényi model (Erdos & Rényi, 1960, Gilbert, 1959) is the earliest and\
    \ simplest, the most well-studied and famous statistical model of networks. Formally,\
    \ if a random $N \times N$ adjacency matrix $A$ follows an $ER(N, p)$ distribution,\
    \ then for each element $a_{ij}$ of the matrix, it follows a Bernoulli distribution\
    \ identically and independently\n\n```\n$a_{ij} \\sim \\text{Bernoulli}(p)$\n\
    ```\n\nwhere $N$ is the size of the network and $p$ is the probability of $a_{ij}\
    \ = 1$. For the undirected network, we follow the notation by Gilbert (1959),\
    \ which is more commonly used. Erdos & Rényi (1960) defined the model in terms\
    \ of the number of nodes and edges.\n\nThe model assumes that each edge has a\
    \ fixed probability of being present or absent, independent of the other edges.\
    \ Therefore, networks with the same number of nodes and edges, they all have the\
    \ same probability to be observed. As one imagine, the Erdos–Rényi model would\
    \ typically not fit a real-world network well, unlike the represented by the Erdos–Rényi\
    \ model has clustering, unlike many real social networks. The node degree of Erdos–Rényi\
    \ networks approximately follows a Poisson distribution while observed networks\
    \ often follow a power-law distribution. In real social networks, transitivity\
    \ is often observed where persons who share a friend tend to be friends themselves.\
    \ However, the Erdos–Rényi model assumes they are independent.\n\nTo estimate\
    \ the unknown parameter $p$ in the model, the maximum likelihood estimation (MLE)\
    \ method can be applied. The likelihood function for the model is\n\n```\n$L(p|A)\
    \ = \\prod_{i<j} p^{a_{ij}}(1-p)^{1-a_{ij}}$\n```\n\nfor an undirected network.\
    \ It is easy to see that for a network with $M$ edges, the MLE estimator is\n\n\
    ```\n$\\hat{p} = \\frac{M}{N(N-1)/2}$\n```\n\nFor the WeChat network, we have\
    \ $\\hat{p} = 1722/13530 = 12.7\\%$, which is equal to the density of the network."
  merge: -1
  img_proc: true
