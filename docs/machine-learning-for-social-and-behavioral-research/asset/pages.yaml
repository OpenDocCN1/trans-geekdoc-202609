    # 11.6.1 Simple Dictionary-Based Sentiment Analysis


    In dictionary-based sentiment analysis, one first builds a dictionary of sentiment
    words. In such a dictionary, each word is assigned an emotion or sentiment as
    positive or negative or other categories such as happy, joy, fear, etc. The sentiment
    of each word can be best identified for a particular problem. For example, when
    studying positive and negative affects, one can ask people to identify whether
    a word shows positive or negative meanings. This chapter focuses on the use of
    existing sentiment dictionaries.


    # 11.6.2 Word Sentiment


    In the literature, there are several sentiment dictionaries or lexicons with identified
    word meanings that are widely used including AFINN, nrc, bing, and syuzhet.


    # AFINN


    AFINN is a list of English words labeled by Finn A. Nielsen in 2009–2011 for positivity
    and negativity with an integer between -5 (most negative) and +5 (most positive)
    (Nielsen, 2011). The newest version of AFINN include 2,477 words and phrases.
    Some example words and their associated scores are given below. Example words
    are displayed in Table 11.5, with the word “robust” being labeled as positive
    with a score of +2 but “depressing” labeled as negative with a score -2.


