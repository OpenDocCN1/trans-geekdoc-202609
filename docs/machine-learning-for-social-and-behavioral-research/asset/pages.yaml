    #  4.7 Summary


    In this chapter detailed the application of regularization to regression models,
    with variable selection as a primary focus. The most commonly applied forms of
    regularized regression include both the ridge and lasso, which serve different
    purposes in their application. We explained a number of extensions, including
    the elastic net, the group lasso, hierarchical lasso, and Bayesian forms of regularization.
    The most important component of applying regularization is for researchers to
    clear in their research aims and limitations to their data, as each form of regularization
    applies to specific facets of these two considerations. While our focus in this
    chapter was on the application of regularization to univariate outcomes, we discuss
    the extension of regularization to multivariate outcomes in Chapter 8, with modeling
    measurement error (Chapter 7) as a specific consideration.


    #  4.7.1 Further Reading


    +   - For background or further detail on linear regression, we recommend either
    Cohen et al. (2003) or Darlington and Hayes (2017). Notably, they provide more
    extensive detail regarding assumptions, diagnosing assumption violations, and
    interpretation. However, their book provides a great deal of information on logistic
    or other outcome types. For this, we recommend the book by Fox (2015).


    +   - This book Bayesian estimation and regularization in this chapter and Chapter
    8. We thought it important to introduce these concepts that they are being increasingly
    used in practice. Unfortunately, space constraints limited the amount of background
    we could provide. Fortunately, the past 10 years has seen the publication of a
    number of great resources on Bayesian statistics. We recommend Gel et al. (2013)
    for a more technical background, Kruschke (2014) for a more introductory text,
    or McElreath (2020) for more of a focus on hierarchical models.


    +   - We did not discuss how to handle missingness with regularization models.
    This was little discussed until recently, where Gunn, Hayati'
