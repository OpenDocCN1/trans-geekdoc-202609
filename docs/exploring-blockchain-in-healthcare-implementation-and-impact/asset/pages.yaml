    # The existing system for drug traceability


    Traditional drug supply chain tracking systems are using the following techniques
    for trace-tracking pharmaceutical products:


    +   **Barcode/QRCode/RFID**: Supply chain players have been using barcodes for
    the product identifications, but QR codes are replacing barcodes as an identification
    alternative. **Radio Frequency Identification** is an advanced version of barcodes
    or QR codes and have been extended in the pharmaceutical supply chain. RFID tags
    can be mounted inside the normal labels, allowing operators to track the drug''s
    progress through the journey. The idea around RFID scanning is to reject any product
    that could not be tracked back to the manufacturer through RFID scanning.'
