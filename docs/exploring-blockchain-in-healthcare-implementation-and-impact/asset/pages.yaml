- pgno: 185
  md: '+   - Wireless Sensors Network (WSN): WSN is a collection of the sensor for
    wireless communication. These sensors are small in size, cheap, and have limited
    memory and computational power. In the context of the pharmaceutical supply chain,
    these sensors are distributed in a target area and can form a wireless network,
    for example, to collect environmental attributes like temperature, light intensity,
    humidity, vibrations, etc. This information is collected and sent to a central
    processing unit or sink, where a backend system stores it for further analysis
    and processing. The adaptation rate of the WSN is relatively high as compared
    to similar technologies in the market, considering factors like cost, energy efficiency,
    coverage, network connectivity, Quality of Service (QoS), and fault tolerance.


    +   - Electronic Product Code (EPC): EPC is the naming convention for the products
    that provides a unique identifier to product, including a serial number. EPCs
    are designed in a way that they are scalable and extensible with Electronic Product
    Code Information System (EPCIS). The EPCIS can decouple product identity from
    data as it will store only EPC captured through RFID, etc., and the rest of the
    metadata will be stored in the database. Product metadata can be accessed using
    the EPC as a unique identifier, and the EPC is generally backed by the GS1 standard.


    +   - NFC: NFC Integrated products or their packaging can easily be authenticated
    by leveraging their unique ID and can be traced from manufacturing to use or consumption.
    The information gathered during authentication and tracing can be shared locally
    or via the cloud, and it can also be used for interaction. The NFC can also interact
    with IoT devices and share data with the connected network for tracking and tracing.


    +   - GPS: GPS devices enhance product quality, speedy delivery, efficient routing,
    cost reduction, and overall transportation visibility. GPS-enabled tags always
    notify stakeholders of the location of the pharmaceutical assets to protect them
    from loss, damage, and the theft.


    While item-level barcoding, RFID, and other ways that help automatically identify
    fake products can work well to protect pharmaceutical goods from theft and imitation/forgery,
    they are not entirely free from hassles and loopholes. These technologies prove
    efficient up to an extent, but the'
