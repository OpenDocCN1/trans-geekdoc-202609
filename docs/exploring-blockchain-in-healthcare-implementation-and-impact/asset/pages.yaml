    # Application Blockchain in pharmaceutical supply chain


    In Chapter 2: Blockchain Fundamentals, we learned about Blockchain and its anatomy.
    Just to refresh Blockchain is a distributed network of connected computers that
    share a common ledger of transactions and the need for a central authority. Every
    node on the network maintains a local copy of the ledger, and any small change
    in it is broadcasted to all the participants in the network. Due to its properties,
    Blockchain can bring modern-age cybersecurity to the existing pharmaceutical supply
    chain. In a Blockchain-powered supply chain, if somebody tries to modify or eliminate
    data then it will be rejected by the system, This will increase trust in the system,
    which is the core challenge of the supply chain industry. Blockchain makes it
    convenient to track product manufacturing and distribution paths as it can maintain
    the whole journey of products across the pharmaceutical supply chain, including
    the change in ownership.


    In a Blockchain-based pharmaceutical supply chain network, a product is registered
    on the network when it is created. As soon as this product is registered onto
    the network, it becomes a non-fungible digital asset and can be transferred to
    other stakeholders. In the pharmaceutical supply chain, patients or any other
    stakeholder''s private data is kept secret by default the whole system works on
    public-key cryptography. Furthermore, self-executing the smart contract of the
    Blockchain can add more intelligence to the system to remove intermediaries like
    service intermediaries and data exchange service providers from the supply chain.


    # Value proposition of Blockchain in pharmaceutical supply chain


    Blockchain can make the following value addition to the traditional pharmaceutical
    supply chain:'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   **Trust and transparency:** Each stakeholder of the pharmaceutical supply
    chain, including the manufacturer and patients, will be able to track and trace
    the product throughout the supply chain. This adds trust in the system although
    the Blockchain itself is a trustworthy and ruthless system. Interestingly, patients
    can see the whole lifecycle of the end product through an interface and can check
    if the product is legitimate.


    +   **Track and trace:** Once a product manufacturing is initiated and events
    are logged into the Blockchain, anyone in the network can track-trace the product
    through the whole supply chain, including the ownership of the product when the
    product changes hand.


    +   **Visibility and privacy:** It''s a contradiction that a system can handle
    both visibility and privacy on a network, but it is a viable option on the Blockchain.
    The Blockchain can handle the data available to all stakeholders and guarantee
    its originality while keeping an entity or patient''s private data secret without
    compromising it. This ability comes from the concept of public-key cryptography.
    For example, a product can be verified on the network without exposing the product''s
    manufacturing techniques.


    +   **Security:** Now, it is evident that the Blockchain is a secure ledger as
    it is an immutable system. Data once injected into the network cannot be modified
    and deleted. Also, pharmaceutical companies, along with technology vendors, can
    create a permitted Blockchain network to ensure better security.


    +   **Database modelling:** Every piece of information about the product that
    goes through different stages, for example, R&D, production, clinical trials,
    and distribution, are stored in the Blockchain. This data can be processed through
