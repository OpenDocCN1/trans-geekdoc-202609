    # Blockchain-based healthcare ecosystem


    The ability of Blockchain technology to secure, segment, and share healthcare
    data (or medical data) and automate the complex process using a smart contract
    has made Blockchain the front runner on the technology side to overhaul the entire
    healthcare ecosystem. Modern commercial-grade healthcare frameworks are fragmented
    into different layers like healthcare data source, Blockchain stack, healthcare
    use cases/ applications, and ecosystem stakeholders:


    | Ecosystem Stakeholders |

    | NGOs | Government Bodies | Clinical Trials | FDA | Healthcare Startups |

    | Hospitals | Healthcare Corporates | General Public/ Consumer | Regulators |
    Research Institutes |


    | Healthcare Use Cases |

    | Data Management Services | Healthcare Supply Chain | Insurance Platform | IoT
    for Healthcare | Research & Trials |

    | On-Chain Data | Off-Chain Data |


    | Blockchain Stack |

    | Blockchain Platform | DAPs & Smart Contracts | Integration Layer | API Stack
    | Network Protocol |


    | Healthcare Data Sources |

    | Data Source | IoT and Wearable Devices | Social Platforms | Research Institutes
    | Government |

    | Hospitals | Patients | Labs and Clinics | Practices | Healthcare Companies |


    > Figure 3.1: Blockchain-based healthcare ecosystem


    In the DLT-based healthcare framework illustrated in figure 3.1, all the medical
    and healthcare data is collected from different channels and converted into segmented
    raw data at the first level. Data can be collected from sources like data entry,
    IoT devices, labs, hospitals, insurance'
  merge: -1
