    # # Token standards


    Blockchain token standards are like identifiers that enable applications, such
    as wallets and DApps, to identify the tokens and interact with them accordingly.
    The Ethereum Blockchain community has emerged as the leader in defining token
    standards that are globally accepted. The aforesaid community has derived many
    token standards for the representation of different kind of assets. These token
    standards ease DLT/Blockchain adoption and enable interoperability between multiple
    Blockchain frameworks/platforms. A token standard consists of a set of predefined
    attributes/functions and conditions that can be developed to represent the characteristics
    of an asset. There are many'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'token standards, and the key characteristics of the asset should be assessed
    to choose which token is suitable.


    Ethereum''s developer community evaluates and establishes standard interfaces
    for tokens using solidity coding language. Here are the token standards that are
    widely accepted and in use:


    +   ERC-20 Token Standard: ERC-20 is the most adapted and in use token that provides
    the functionality of "Transfer of value between users as well authorizes someone
    to spend the value on individual''s behalf". ERC-20 lists mandatory and three
    optional functions, along with two events to be implemented by a conforming API.

    ERC-721 Token Standard: It''s a non-fungible token standard where each token is
    distinct and so, enables the tracking of distinguishable assets. Each asset must
    have its ownership individually and be automatically tracked. This token authorizes
    an operator to transfer all or specific assets on one''s behalf. This standard
    requires compliant tokens to implement 10 mandatory functions and 3 events. Moreover,
    this token can handle the specific asset''s transfer of ownership between users.

    ERC-777 Token Standard: ERC-777 Token standard defines advanced features to interact
    with tokens while being compatible with ERC-20 Tokens. It allows operators to
    send tokens on behalf of another address, and methods for sending and receiving
    tokens, provide token holders more control over their tokens. Here, operators
    are certain accounts that have permissions to execute specific tasks. ERC 777
    Token standard has default and regular operators.

    ERC-1155 Token Standard: ERC-1155 token standard allows any combination of fungible
    and non-fungible tokens in a single contract. This standard can handle the transfer
    of multiple tokens at once. The ERC-1155 token standard makes it possible for
    one smart contract to govern an unlimited number of tokens. Each token is semi-fungible,
    unlike ERC-721 non-fungible tokens that can only be owned by one address each.

    ERC-1400 Token Standard: ERC-1400 token standard is designed to enforce regulations
    for security tokens by applying essential laws. It can even apply off-chain data
    to transactions to include necessary real-world input and authorization. This
    token standard provides the ability to transfer ownership of a security token
    among users, but it requires a'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'certificate. Moreover, it manages the documentation associated with a security
    token.


    It is also important to note regarding how assets are tokenized not only depends
