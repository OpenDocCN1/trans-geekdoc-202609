    # Benefits of Blockchain-powered EMR systems


    Blockchain-based EMR systems have impressive benefits when it comes to securing
    patients’ medical data and history. Here are some of the benefits of such systems:


    +   1. Patients become masters of their data as they own and control access to
    their medical data. They do not have to worry about losing this data for future
    references and can also share it with other entities using secure contracts.


    +   2. Data is controlled by a Blockchain network, and no single entity can affect
    the whole network. So, patients'' medical data is available all the time as there
    is no downtime for these systems.


    +   3. Data is secured using public-key cryptography and can be unlocked using
    the private-public key mechanism of Blockchain.


    +   4. Blockchain provides auditing and non-repudiation capabilities. Data on
    the Contract is immutable and time stamped.


    +   5. Smart contract removes dependencies on intermediaries and enables healthcare
    stakeholders to interact with patient’s medical records securely, based on the
    access rights provided by the patient or service provider.


