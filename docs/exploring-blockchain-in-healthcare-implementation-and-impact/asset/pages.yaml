  md: 'The mentioned Blockchain-based architecture consists of three major layers:
    application layer, middleware layer, and **Distributed Ledger Technology (DLT)**
    layer. These layers have functionalities as defined here:


    +   *Application layer:** This layer is the front face or UX layer of the framework,
    and it provides methods for the stakeholders to interact with the Blockchain network.
    Stakeholders like consumers, researchers, providers, etc. interact through the
    web interface, mobile app, or any other possible ways to save, consume, and share
    the genomics information. In the context of genomic data, this layer helps researchers
    and other stakeholders request/transmit an individual''s genetic data, which is
    certified by the underlying Blockchain framework.


    Likewise, heart care users can request for the DNA analysis results or the underlying
    data for different purposes based on the individual''s consent. This data can
    be used in multiple applications, and all the logs regarding the data uses are
    maintained by the Blockchain network.


    +   *Middleware layer:** The middleware layer is the bridge between the frontend
    layer and the Blockchain network. Stakeholders interact with the Blockchain via
    this layer, and it provides adapters and connectors that act as a plug for the
    frontend layer to connect with the Blockchain network. This middleware layer consists
    of APIs, a consent management module, identity services, and other required modules
    for the Blockchain network.


    Based on the Blockchain technology selected for the platform, the respective API
    layer can be designed to facilitate the services on the Blockchain. For example,
    the web3.js API library and other tech stacks will be developed in the middleware
    layer if Ethereum is used as the underlying Blockchain technology. Design-wise,
    the middleware layer is very agile and adaptive.


    +   *DLT layer:** DLT layer or Blockchain layer is the heart of the framework.
    This Blockchain layer handles all the genomic data shared by the individuals.
    Sensitive genomic data can be saved on-chain, and bulky/non-sensitive data can
    be saved into the off-chain DB. While saving data in the off-chain DB, respective
    hashes of the references are saved into the Blockchain. This layer provides the
    ability to handle'
