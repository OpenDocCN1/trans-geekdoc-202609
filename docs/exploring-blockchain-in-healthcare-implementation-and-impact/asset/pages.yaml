    for example, the FDA, for the mass production of the drugs. Once approved, the
    manufacturer pushes patent and license information in the Blockchain through the
    smart contract.


    +   2. The manufacturer raises purchase orders with the supplier based on the
    contract/agreement. The supplier sends raw material to the manufacturer and both
    parties invoke smart contract to log this information and transaction in the Blockchain.'
