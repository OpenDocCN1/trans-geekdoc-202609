  md: '# Government bodies and digital certificates


    Government bodies and establishments across the globe use medical certificates
    and other healthcare certificates extensively for handling administrative processes,
    conducting healthcare drives, obtaining government subsidies, etc. Government
    bodies around the globe use paper-based certificates or digital e-certificates
    to validate citizens'' information and medical data for administrative processes
    like issuing a health card or including the individual in the government insurance
    policy.


    One of the European countries in the Baltic region, Estonia, is dominating the
    Blockchain adoption in almost every domain, including healthcare. The Estonian
    government has partnered with technology companies to roll out its Blockchain-based
    products around healthcare, e-governance, and financial services. (KSI) to secure
    the digital data collected by the government, and the health and medical records
    of the Estonian citizens are managed through KSI technology. So, taking advantage
    of the DLT technology, KSI generates a hash value that represents a larger amount
    of data. This hash value works as a unique reference to the dataset. KSI allows
    officials to monitor changes within databases, that is, who changes a record,
    what changes are implemented, and when they are made. So, any unauthorized tampering
    of the records can be detected and prevented.


    To keep the health data secure, immutable, and available to the citizens in realtime,
    Estonia issues electronic ID-cards through Blockchain platform to ensure information
    integrity and protect the data from internal and cyber threats. This makes forgery
    easily detectable and helps avoid damages to a person''s health data. The Estonian
    government also integrated the system to issue e-medical certificates to citizens
    through the Blockchain platform.


    In another scenario, the government of Singapore has developed a Blockchain-based
    platform that will enable employers to verify the educational qualifications of
    employees and job candidates who have graduated from local universities, polytechnics,
    and other educational institutions. The aforesaid platform is called OpenCerts,
    where individuals receive digital certificates with a unique cryptographic proof
    embedded within secure verification. Individuals do not need to acquire physical
    copies of the certificates of their education, training, etc. issued by the respective
    institutions. These digital certificates can be verified by employers directly
    through the OpenCerts platform, which will check the certificate data against
    its code on the'
  merge: -1
