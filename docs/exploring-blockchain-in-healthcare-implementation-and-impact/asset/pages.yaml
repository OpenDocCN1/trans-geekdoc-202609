  md: '# Table 3.1: Blockchain opportunity in healthcare


    # # Data handling in Blockchain


    We are discussing data sharing and interoperability in the healthcare system,
    so it is important to understand how Blockchain maintains data on the distributed
    ledger. Modern Blockchain systems maintain two types of data or information:


    +   - **On-Chain Data:** On-Chain data is from actual Blockchain transactions
    that are stored on the Blockchain network. It is verified and validated by all
    participants on the network and cannot be modified once saved.

    - **Off-Chain Data:** Off-Chain data is stored in separate traditional databases,
    and its access pointers are provided on the Blockchain network. Off-chain transaction
    or data commit happens outside the Blockchain, where parties involved in the transaction
    agree to have a consensus outside the Blockchain.


    This property of handling on-chain and off-chain data makes Blockchain networks
    more scalable and cost-effective. Healthcare platforms can also opt to store data
    on the Blockchain and be protected by the foundational properties of Blockchain.
    At the same time, they can design a protocol to save large medical data and files
    outside the Blockchain network. Off-chain data can be accessed via encrypted links
    and APIs by a Blockchain network, wherever required. While designing a healthcare
    platform for any use case, it is important to evaluate what data should be stored
    on on-chain and what should be saved offline.


    Here''s a comparison table of on-chain and off-chain data and their pros and cons
    as they are adopted in the healthcare system:


    | On-Chain Data | Off-Chain Data |

    |---|--|

    | Data Fields | Lightweight data fields can be saved on a Blockchain distributed
    network. For example, patient''s demographic data. | Off-Chain data is used to
    store heavy and expensive records as they may increase processing time considerably.
    Sometimes, enterprise crucial data is also stored offline based on the business
    case. Common examples of off- |'
  merge: -1
  img_proc: true
