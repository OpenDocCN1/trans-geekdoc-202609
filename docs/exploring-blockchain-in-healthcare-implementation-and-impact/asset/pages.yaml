    Here, the upper part shows data content for each smart contract type, and the
    lower part shows the relationship between contracts and the network nodes. This
    system implements three types of smart contracts to handle a large amount of healthcare
    data on the EHR system:


    +   Registrar contract (RC): Registrar contract can be looked at as the administrative
    contract and is responsible to allocate identities to the participants. Participants
    are identified in the system based on their public Ethereum address. This system
    can allow the use of any'
