  img_proc: true
- pgno: 62
  md: 'Blockchain does not deal with data and information but also with self-executable
    codes. In Blockchain, self-executable code is called Smart contract. a smart contract
    is a normal program with some predefined conditions and deployed over the Blockchain
    network. These smart contracts can execute any task when specific predefined terms
    and conditions are met. Smart contracts can be compared with typical legal contracts
    where certain actions are taken under certain conditions. Let''s check out an
    example of a pharmaceutical supply chain. A medical facility in the USA places
    an order of some "XYZ" vaccines for patients. A pharmaceutical trader or supplier
    receives the order and accepts it. Interestingly, this order was placed using
    a Blockchain-based platform used as a pharmaceutical marketplace. While placing
    the order, the medical facility enables two conditions with the order using Smart
    contract: the order must be delivered by 10th May, and the vaccine should always
    be stored and transported in temperatures below 2 degrees Celsius; otherwise,
    the order will be rejected. The supplier will pay a $10,000 fine to the facility
    if any of these conditions were not met, and the facility will pay an additional
    $1,000 as a loyalty amount to the supplier if all goes well. Both the parties
    agree on the conditions and write these conditions on the smart contract. Now,
    look at the events and how smart contract plays a role here:


    +   1. Supplier deposits $10,000 into the escrow account, and the medical facility
    deposits $1,000 into the same escrow account.

    2. The supplier delivers the vaccines on 10th May, and the consignment temperature
    was maintained below 2 degrees Celsius all the time. The medical facility acknowledges
    the consignment on the platform.

    3. Smart contract executes and debits the escrow account with $1,000 and sends
    it into the supplier''s account, as decided. The smart contract also debits $10,000
    and sends it to the supplier''s account as all the conditions of the agreement
    were met.

    4. In the second case, the supplier delivers the consignment on 10th May, but
    the consignment''s temperature is found to be 4 degrees Celsius at the time of
    delivery. The medical facility rejects the consignment and updates the platform.

    5. On failure, the smart contract sends $10,000 to the medical facility and returns
    $1,000 to the facility.'
