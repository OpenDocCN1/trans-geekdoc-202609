    |---|---||

    | Pros | - Data can be stored on the Blockchain and will be ready for quick disposal.<br>-
    Interoperable systems.<br>- Immutable data. | - Any type of data can be saved,
    regardless of any file type and size.<br>- Scalability of the Blockchain system
    can be achieved.<br>- Off-chain transactions are fast and instantaneous without
    the higher fees of on-chain transactions. |

    | Cons | - Not created for data-standardization.<br>- The scalability of the system
    is complex.<br>- Transaction cost may be applied. | - No real-time data update
