    # Challenges around tokenization


    Although everything looks great with the emerging token economy, and certain businesses
    and industries can be benefitted if they are early adopters of the technology.
    However, there are some challenges around tokenization as well. Some of these
    challenges are as follows:


    +   * Regulatory uncertainty

    * Lack of common standards

    * Code of conduct uncertainty

    * Lack of sufficient infrastructure for commercial-grade token management

    * Slow adoption of tokenization

    * Complexity in the management of intangible assets

    * Volume and estimation issues


    # Asset Tokenization in Blockchain and its application in the healthcare and insurance
    sector


    The healthcare sector is very aggressive in experimenting with new technologies,
    and it has already started Blockchain-powered platforms. Tokenization is also
    considered as the game-changer in the healthcare sector, including the insurance
    sector. All domains of the healthcare industry have one common precious asset:
    sensitive health and medical data. It'
