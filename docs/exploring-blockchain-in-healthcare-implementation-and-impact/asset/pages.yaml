    details as per the regulations designed by the certificate issuers. The applicant
    can provide this information using a front-end application. The applicant submits
    the requested data for further processing.

    2. After submitting, the input data is saved on the server after confirmation
    from the applicant. This data will be stored locally on the server and Blockchain
    after processing.

    3. The issuer accesses the applicant''s data, generates a digital certificate
    with valid CA, and issues the digital certificate to the applicant. This certificate,
    along with processed data, becomes a transaction and is saved on the Blockchain
    network. Note that the electronic signatures are provided and ensured by authorized
    CA providers only.

