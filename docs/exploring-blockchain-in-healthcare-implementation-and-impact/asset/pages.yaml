    to work on the Blockchain stack to issue such certificates in a secure way, keeping
    in mind that these certificates should be validated in real-time and should not
    lose their integrity. Blockchain technology is used to reduce the incidence of
    certificate forgeries and ensure that the security, validity, and confidentiality
    of graduation certificates would be improved. We will discuss this technological
