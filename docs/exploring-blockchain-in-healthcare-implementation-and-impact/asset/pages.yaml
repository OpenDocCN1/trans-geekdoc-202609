    The healthcare sector is no exception in Blockchain adoption and is exploring
    use cases across the healthcare industries and sub-industries. This chapter intends
    to shed light on Blockchain or distributed ledger technology and how it has evolved
    from a simple white paper to a full commercial-grade technology.


    # Structure


    We will cover the following topics in this chapter:


    +   - Introduction to Blockchain and its anatomy

