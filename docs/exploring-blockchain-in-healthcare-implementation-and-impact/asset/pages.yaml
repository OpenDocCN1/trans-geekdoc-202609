- pgno: 154
  md: 'Till now, we have understood that healthcare systems and organizations are
    complex, fragmented, and data intensive as data is being generated by various
    healthcare stakeholders like patients, providers, and hospitals. As the name suggests,
    HIE is a method of transferring patients'' healthcare and medical data electronically
    among healthcare stakeholders. Interoperability attached with the HIE systems
    requires electronic linkage among systems and organizations so that patients''
    data associated with one establishment can be linked to other systems as well.


    The existing HIE systems lack unified healthcare standards, a non-interoperable
    information system, and the data exchange platform, leading to issues in the secure
    and seamless collection, analysis, and exchange of meaningful healthcare information.
    The Conventional HIE system uses different ways to share healthcare information
    among stakeholders, as follows:


    +   - **Direct mode:** As the name implies, the exchange provider directly shares
    the patient''s medical records with known stakeholders. The data transfer takes
    place in a secure and encrypted manner. This method works well if the provider
    and consumer are known and trusted parties, and it can improve coordination among
    organizations by exchanging patient information over a secure channel.


    +   - **Query-based mode:** In this mode, providers can request a patient''s information
    from other providers. In this type of arrangement, a central repository shares
    patients'' data. Medical data is aggregated from different EHRs in this repository.
    This method has a mechanism to efficiently process cross-EHRs data for offering
    healthcare services to the patient.


    +   - **Patient-centered exchange:** In this model, medical records are transferred
    from providers to patients. This enables patients to engage in their care process
    and manage healthcare information, and it plays a pivotal role in the healthcare
    exchange system. This model reinforces access control over patients'' medical
    and healthcare data.


    # Conventional HIE''s operating model and challenges


    Modern HIE systems process and exchange huge volumes of healthcare data every
    day, and patients expect improved healthcare processes,'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'coordinated and quality care based on the data being exchanged. In the existing
    scenario, patients are concerned about data privacy and security as a large amount
    of personal healthcare data from multiple channels is being shared among multiple
    stakeholders. In some cases, patient gets exchanged without the patient’s consent.
    In modern healthcare, patients are a primary and important stakeholder of the
    HIE system and a significant producer of health information through various channels.
    These challenges may pull away a patient from sharing healthcare information through
    HIE systems.


    Healthcare organizations are well aware of these facts and have tried different
    approaches for secure sharing of data among healthcare entities. The following
    are some of the challenges that modern HIE systems are facing:


    +   * Patients’ concern over privacy and security of healthcare data

    * Lack of control over data collection practices

    * Lack of transparency associated with data sharing mechanism and approach

    * Interoperability challenges

    * HIEs system integration cost

    * Limited third-party access to healthcare data

    * Data export challenges

    * Insufficiencies in standards for electronic health information exchange

    * Ambiguity in the mapping of patients to their health records


    # Blockchain-enabled HIE systems


    Healthcare leaders have already analyzed that Blockchain technology can establish
    coordination and manage communication between healthcare stakeholders. In the
    networked and connected model, all the stakeholders and healthcare companies are
    required to communicate among peers and update the data in real-time for better
    clinical decisions and consultancy.


    Blockchain-based healthcare data sharing systems can efficiently track the records
    of access to patients’ sensitive data stored on the Blockchain network. Blockchain
    can also bring an access control framework to protect patients’ healthcare information
    and provide access rights to the data.'
  merge: -1
  img_proc: true
