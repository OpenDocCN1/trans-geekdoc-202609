- pgno: 226
  md: 'is not just precious but can be well priced if its true potential is unlocked.
    It can be stated that patient''s healthcare data is new oil for the healthcare
    sector.


    Tokenization helps the healthcare sector safeguard patients'' sensitive data like
    PAN, NPPI, ePHI, etc., by replacing these values with non-sensitive values. This
    is an essential step, considering the threats from cybercriminals and the events
    of data breach. An important utility of tokenization is to transfer the power
