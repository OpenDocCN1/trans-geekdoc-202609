    # # An introduction to smart medical equipment


    Broadly speaking, smart equipment is the electronic device connected to other
    networks or a mesh of connected devices via communication protocols like Bluetooth
    or Wi-Fi. In this type of wished network, each device works autonomously and interacts
    with other devices to share information. In the context of the world, smart means
    that the electronic device or hardware is interoperable and can share data with
    other instruments deviating from the basic and inherent purpose. For example,
    a smart pacemaker will always control a patient''s heartbeat, but it will continuously
    share data with the consulting doctor''s device so that they can monitor any abnormality
    in the heart rate as an early warning. We will use the terms IoT, IoMT, and smart
    medical equipment interchangeably throughout this chapter and book.


