    +   - **Off-chain resources:** The Blockchain network can store almost anything,
    it be heavy image files or docs or other resources, but it does so at the cost
    of higher transaction time. Heavy files and data can be stored on off-chain DB
    like IPFS, Storej, etc., for low-cost storage without compromising on transaction
    time. The integrity of data is maintained by assigning a unique hash for every
    file uploaded on the off-chain DB, and the references of these hashes of different
    files are then stored on the Blockchain and accessed through the smart contract.
    Additionally any change that occurs to any of the uploaded files is reflected
    in the associated hash.


    +   - **Data engine for mathematical modeling:** This is an additional layer introduced
    into the network, powered by AI and machine learning, to use the data in a better
