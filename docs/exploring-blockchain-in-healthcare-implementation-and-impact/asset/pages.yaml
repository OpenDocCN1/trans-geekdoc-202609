  md: '# Figure 5.5: Blockchain-based pharmaceutical SCM workflow


    Let''s see how different players in the ecosystem interact with each other through
    a common layer of the Blockchain network:


    +   Once the manufacture invests a new drug after R&D and clinical trials, a block
    is created and information is recorded into the Blockchain network. This information
    will be available in real-time; information regarding is available in the network
    even for products that have already been developed.


    +   After the clinical trial, the sample is sent to the manufacturing unit for
    mass production. The manufacturer sends a purchase order to the raw material supplier
    through a private node, and the same request is logged in the Blockchain network.


    +   The supplier is notified of the new PO, and the supplier accepts the request
    and logs the information in the network through a private node. Payment and settlement
    are done between supplier and manufacturer based on the smart contract terms and
    conditions. All the requests, responses, and other information are maintained
    in the Blockchain network.


    +   The raw material is stored in the warehouse once it is received at the manufacturing
    facility, and all the input parameters are measured, and the relevant information
    is pushed in the Blockchain network. Subsequently, after production, the end product/drug
    is sent for packaging and stored in the warehouse for distribution. The product''s
    information like identifier, barcode, expiry date, batch no, manufacturer date,
    and other important parameters are pushed in the Blockchain network.


    +   Wholesale distributors raise a request with the manufacturer through a private
    node, and the manufacture sends the consignment along with transportation information,
    consignment no, agent''s information, and other information. All information logs
    into the Blockchain network.


    +   Distributors store the product in the warehouse in a large volume and transport
    the product to the providers like hospitals, clinics, and pharmacies. These providers
    can access the specific product''s data from the Blockchain and authenticate the
    product before selling it to'
