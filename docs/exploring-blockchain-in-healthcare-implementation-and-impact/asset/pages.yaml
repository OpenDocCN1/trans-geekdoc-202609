    digitally signed with public-key cryptography using the sender''s private key
    and the receiver''s public key. The block will be added to the Blockchain key
    after that.


    +   6. Further, the doctor accesses the Provider Portal and requests the Blockchain
    network to access the image file to provide medical counseling to the patient.
    Upon request, the smart contract checks the authorization roles and privileges,
