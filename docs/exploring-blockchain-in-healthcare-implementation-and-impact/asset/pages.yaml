- pgno: 153
  md: '+   - Database gatekeeper: This module is responsible for maintaining the off-chain
    database of the system. This provides an interface to access the node''s database
    and is governed by the permission stored on the Blockchain. Database gatekeeper
    consists of the event listeners that track query requests from participants on
    the network. An incoming request contains a query string and reference to the
    PPR contract that has permissions to run it. All the incoming requests are digitally
    signed by the issues, and the gatekeeper is allowed to confirm the identities.
    Once the issuer''s signature is certified and validated, the gatekeeper checks
    the Blockchain contracts to verify that the address issuing the request is allowed
    access to the query. If the address checks out, it runs the query on the node''s
    local database and returns the result to the client.


    +   - EHR manager: The EHR manager can be looked at as the bridge between participants
    and the Blockchain network, and this layer bundles all the software components
    and user interface. The EHR manager renders data from local databases for viewing
    and presents the users with update notifications and data sharing and retrieval
    options. It is cognizant of compatibility for mobile devices as modern users expect
    easy access and high-quality experiences while on the go.


    +   - Miner: This system allows miners to participate in the network and incentivizes
    the miner to contribute their computational power and resources in the network
    to build a trustworthy chain. Ether can be earned by mining, awarding an acceptable
    amount of it to a node that solves the computational puzzle. Healthcare providers
    are also benefited by participating in mining and validating transactions to fund
    the continuation of their activities (posting and updating PPRs, etc.). Likewise,
    when patients wish to share their information, they will be required to spend
    Ether or have the destination party fund them. Seeding with Ether or having them
    pay for it can be determined by healthcare regulations. Other ways to incentivize
    participants can also be explored in this system.


