    the HIE system has the following essential components:


    +   - Data handling: Blockchain-based HIE systems can provide access control frameworks
    to provide a fine grip over read and write operations. Write access to on-chain
    data is provided to specific private keys on the network. Key sharing is normally
    handled by the API layer.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   - Cloud storage: Cloud infrastructure handles the storage of healthcare
    data, and it also provides the ability to handle access rights to patients'' healthcare
    data through application interfaces.


    +   - Access control: Represents permissions that are needed to provide the private
    ''key'' for accessing specific information areas to authorized users by citizen
    or government permissions.


    +   - Blockchain database: It stores a copy of the encrypted health information
    on an on-chain or off-chain database.


    +   - Encryption layer: Any data to be read or written in this will require a
    decryption key, which is provided only to authorized parties, decided either via
    a validation or pre-defined as per the task. The encryption layer works on public-key
    cryptography.


    +   - Nodes: Each node in the network is associated with healthcare stakeholders
    who simultaneously maintain a copy of the healthcare ledger. Different rights
    can be provided to these nodes to access the Blockchain network depending on the
    use case.


    +   - EHR systems: A Blockchain-based HIE can interact with multiple EHRs (including
    EMRs and PHRs) to fetch medical and healthcare data effectively, which later processes
    into the Blockchain network through interfaces. An HIE system can also interact
    with CMS and ERPs depending on the usability and healthcare business case.


    # # Establishing trust in the HIE


    As discussed in the previous section, the primary focus of healthcare organizations
    is to have the trust of the patient in the information exchange system. Trust
    is not something that can be built overnight; it''s a long-term patient-provider
    relationship. Healthcare information sharing is easy if patients trust the system
    or organization, but patients have trust issues with the way the existing HIEs
    work and how their data is handled.


    Blockchain technology can help organizations in building trust with patients as
    Blockchain itself is a truth-less and trust-less system. Interestingly, information
    sharing and storing processes are trusted and secure even if no strong privacy
    and compliance policies are forced into the Blockchain-based system. If marketed
    and guided in the right direction, the general population may believe that Blockchain-based
    HIE systems can take care of'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'the core issues of privacy and security while exchanging sensitive information
    with other stakeholders. This is because of the characteristics and technological
    capabilities of Blockchain, and it may result in higher patient participation
    in the HIE ecosystem.


    It is the responsibility of the healthcare ecosystem partners to indulge in the
    process of creating trust in technology and patient awareness. Any upgrade in
    the conventional HIE system or a Blockchain-based HIE system being include the
    main features of the Blockchain technology: confidentiality, availability, and
    integrity. In this scenario, data integrity is ensured that all stakeholders keep
    copies of the ledger and update the ledger in real-time so that all participants
    have real-time updated data. If patients understand that they are masters of their
    own medical and healthcare information, they will not hesitate to connect other
    channels for data supply for better healthcare services. In addition to patients,
    healthcare organizations can experiment with Blockchain innovations like smart
    contracts and different Blockchain networks.


