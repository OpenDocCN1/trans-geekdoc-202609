    # # Transaction workflow in Blockchain


    Figure 2.5 illustrates how a transaction in the Blockchain network initiated and
    added to the block. The image is self-explanatory, but we will break down the
    steps in pointers here:


    +   - Someone initiates a transaction. In case of cryptocurrencies, this transaction
    initiates through the Wallet.

    - The transaction propagates into the Blockchain network, and transactions are
    broadcasted to all the nodes in the Blockchain network.

    - Miners in the network validate the transaction. Miners run validation using
    consensus algorithms like Proof of Work and Proof of Stack.

    - The verified transaction is added to a new block.

    - New block is created appended to the existing Blockchain network in chronological
    order.

    - Each node contains the same copy of the ledger.

    - Transaction completed.


    ![](img/1e3b2549c903c8e5ca5ce0f7df00079c_61_0.png)'
