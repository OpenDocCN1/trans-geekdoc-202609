    # # Cryptography: Foundation for digital trust


    It is now evident that Blockchain is built over the proven technologies and techniques
    applied differently. Blockchain technology is the orchestration of P-2-P networking,
    cryptography, and cryptographic hash, and all these combined make Blockchain a
    trustless system. Simply put, digital trust is the assurance and confidence users
    have in the technology and processes for executing any type of transaction. It
    is the risk judgment between different parties, and the digital world is all about
    authentication and authorization. In Blockchain, asymmetric cryptography is the
    backbone of digital trust.


    As we are using and will continue to use the term "cryptography," we must understand
    exactly what it is. Going by the simple definition, "cryptography" is the art
    of writing secret code, and it has in ages. With the advancement of computer technology,
    new techniques and forms of cryptography were introduced to establish trust among
    parties. In data or information sharing, cryptography is required when exchanging
    parties are communicating over an untrusted medium (the Internet). Modern cryptographic
    algorithms are designed around mathematical procedures and computational hardness
    assumptions that not other or unknown entities cannot break the system. Here are
    some of the terminologies used while discussing cryptography:


    +   - **Plain Text:** Any message to be transmitted or stored that is well understood
    by the sender or receiver.


    +   - **Cipher Text:** It is encrypted text resulting from applying encryption
    on plain text. Ciphertext can only be converted to plain text using a decryption
    key.


    +   - **Key:** It''s a variable that generates a ciphertext when applied to plain
    text. This ciphertext can only be converted into plain text with the help of a
    suitable decryption key. In a nutshell,


    "Blockchain In Healthcare" + Secret Key = 0xETGDGHU'
