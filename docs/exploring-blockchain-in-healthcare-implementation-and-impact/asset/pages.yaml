    Let''s look at each phase in detail:


    +   1. The first phase in the lifecycle of electronic records is to create raw

    data and process it or retrieve the records from an existing system or

    channel.

    2. In the second phase, the classification of records is executed.

    Classification is required for systematic identification and

    arangement of records into a logical structure derived on the basis of

    business rules.

    3. During the third phase of the lifecycle, records are retrieved and used

    to complete the business process, and data/records can be shared

    among other stakeholders if required, based on mutual consensus.

    4. The fourth phase is a decision-making process based on a set of

    business specifications to determine whether the record is useful for

    future aspects. The record is preserved or destroyed depending on its

    value and benefits.

    5. Disposition of records is the process of transmitting records in

    permanent storage for future use. Records can be archived or deleted

    based on the business decision.


