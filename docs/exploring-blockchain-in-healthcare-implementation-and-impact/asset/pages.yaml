    # Setting up Ethereum development environment


    Ethereum is a public network where developers can write smart contracts and host
    them on the Ethereum network. In this section, we will learn how to set up the
    Ethereum development environment and then deploy and a very simple smart contract.
    There are multiple ways to set up the Ethereum network, but we will learn to set
    up a private Blockchain network in the easiest possible with minimum software
    requirements in this section.


    Here are the steps this section will cover:


    +   - Installing npm and nodejs environment


    +   - Installing Truffle


    +   - Installing Ganache: cli framework


    +   - Write and deploy a sample smart contract


