    # Different Blockchains for managing healthcare data


    In the previous chapters, we learned that there are three types of Blockchain
    networks: public, private, and permission. These Blockchain networks describe
    the behaviors of participating nodes on a network for transactions and validations.
    It is important to understand the types of Blockchain applied to the healthcare
    system for different cases and business requirements.


    +   - Public Blockchain: If a healthcare system is designed in a way that anyone
    around the globe can participate in it, it falls under a public network. Public
    Blockchain networks are built over frameworks like Ethereum. This type of Blockchain
    runs consensus algorithms like PoW/PoS, which makes the validation process cumbersome.
    Additionally, high energy is required to run the validations. There are no conditions
    of access to read data or perform transactions, so these types of Blockchain are
    avoided in EHRs or wherever patient sensitive data is stored.


    +   - Private Blockchain: These are restricted Blockchains where access to the
    system is provided to validated and authentic users inside a closed group or organization.
    A high level of efficiency is required in the'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'validation process as the number of participating nodes in the system are limited.
    Monax, HyperLedger Sawtooth, and private Ethereum are a few examples of private
    Blockchains, Synaptic Health Alliance is an example of a private or permitted
    Blockchain. The multichain framework can be used to build a private/permissioned
    Blockchain.


    +   Consortium or Federated Blockchain: In permitted Blockchain, the nodes in
    the Blockchain are known to the network. Hyperledger Fabric and Ripple are examples
    of permitted Blockchain. This Blockchain network is much more adaptive for healthcare
    use cases. When validating a transaction in this network, selected nodes must
    reach a consensus, create a new block, and finalize the process. B3i, an insurance
    use case network, is a popular example of this network, and Health Utility Network
    is a popular example of federated Blockchain.


    # Components of a Blockchain-based EHR system


    Going forward, let''s check on the architecture of a Blockchain-based EHR system
    and its components. Here are the possible stakeholders or entities participating
    in the network:


    +   Patient: A patient is a key stakeholder in the ecosystem as they are injecting
    personal medical and healthcare data, or data from smart devices/IoMT is being
    injected into the EHRs. Likewise, the patients’ data can be pulled from different
    healthcare systems into a comprehensive EHR system. In a nutshell, the patient
    is the master of their data and can derive control policies for data exposure
    in a Blockchain-based EHR system.


    +   Provider: Providers are the consumers of patients’ data as they need to analyze
    medical data and counsel the patient. These healthcare providers could be hospitals,
    medical practitioners, nursing homes, etc., who access to EHRs to gather patients’
    data. Only the providers authorized by the patient can access the data.


    +   Smart devices/IoMT: In modern times, medical and vital data is also collected
    by smart devices and will be collected by EHRs. Further, IoMT devices like smart
    MRIs, imagining labs, and X-ray devices are connected to EHRs, and real-time data
    is injected into EHR systems.'
