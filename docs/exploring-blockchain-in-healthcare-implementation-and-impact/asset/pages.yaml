  md: 'multiple purposes; the study of genomics is categorized into the following
    types:


    +   - Structural genomics: This type of genomics helps study the structure of
    any protein encoded by the genome. Generally, it deals with the genetic and physical
    map of genomics.


    +   - Functional genomics: This type of genomics uses a sequencing technique to
    collect and processes the data to describe a gene and its respective functions.


    +   - Comparative genomics: It is designed to compare the genetic features of
    different species and helps determine each genetic molecule''s function.


    +   - Mutation Genomics: It is the study of the genome to determine the mutations
    that occur in the genome or DNA. In a nutshell, it is an activity for gene function
    determination.


    Genomics has the potential to tackle genetic diseases by introducing genetic medicine.
    It is essential to gather information about all human genes and their underlying
