- pgno: 20
  md: '# CHAPTER 1


    # An Overview of the Healthcare Industry


    Blockchain is one of the most important and revolutionizing discoveries of recent
    times, and it is already playing a vital role in multiple industries. In the last
    few years, the surge in Blockchain technology use cases pushed technology evangelists
    to scrutinize new ways to implement Blockchain in various industries.


    The healthcare industry is ever-evolving and complex, where multiple stakeholders
    work in silos to run the system smoothly. Many industries and sub-industries are
    underpinned by the healthcare ecosystem, focused on providing better, effective,
    and efficient healthcare facilities to the population. The healthcare industry
    offers products and services to care patients with curative, rehabilitative, preventive,
    or palliative practices. The sharp uptake of digitization in the healthcare industry
    has led to the generation of huge electronic records about patients and other
    related information. The surge of Blockchain technology as a transparent and immutable
    mechanism to store and share data is laying the foundation for new potentials
    of solving serious data privacy, security, and integrity issues in healthcare.
    In this book, we will take a look at the existing healthcare systems and their
    related challenges and how Blockchain can solve those issues to make the healthcare
    system more secure and transparent.


    # Structure


    We will cover the following topics in this chapter:


    +   - Introduction to the healthcare industry

    - Challenges in the healthcare industry

    - How medical records are managed today

    - An overview of the pharmacy business'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   * Introduction to online marketplaces and e-pharmacies

    * Introduction to supply chain in pharmacy business

    * An overview of the healthcare insurance sector and business model

    * Introduction to the Food and Drug Administration (FDA)


    # # Objectives


    This chapter will teach you about the existing healthcare system, its operating
    model, lifecycle, and the challenges faced by the healthcare sector. Going further,
    you will explore the management of medical records and their classifications.
    This chapter also walks you through the pharmaceutical businesses, including pharmacies,
    workflow, brief about their operating model, and the rise of e-pharmacies. Additionally,
    you will understand how the supply chain in the pharmaceutical business works,
    the challenges associated with the existing model, and how new-age technologies
    can reshape the paradigm for the pharmaceutical supply chain. The last module
    of the chapter takes you through the Healthcare Insurance Industry and Food and
    Drug Administration (FDA).


    # # Introduction to the healthcare sector


    Figure 1.1 is an illustration of the key stakeholders in the healthcare ecosystem.
    These stakeholders contribute to the smooth and efficient functioning of the healthcare
    system. Each stakeholder’s roles and responsibilities in the ecosystem are diverse,
    but they are aligned to achieve a common cause.'
  merge: -1
  img_proc: true
