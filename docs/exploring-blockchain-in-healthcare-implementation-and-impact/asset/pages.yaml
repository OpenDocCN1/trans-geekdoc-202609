  md: 'tokenization of assets in the Blockchain is the art of issuing digital tokens
    that represents a real tradable asset. Blockchain tokens can be created or developed
    using Blockchain and can represent a range of assets, like currencies, properties,
    bonds, loyalty points, etc. Blockchain tokens can be transferred between parties
    without relying on a central authority. Blockchain tokens are created through
    Initial Coin Offering (ICO) or Security Token Offering (STO). Security tokens
    can be used to create a digital token to represent an asset. It means that these
    tokens signify a share in the company or ownership in real estate or investment
    fund. These tokens can be traded or exchanged in a specific market.


    Unlike bitcoin, tokens are not native Blockchain features. Instead, the token
    is created over a Blockchain framework and governed by smart contracts. For instance,
    most of the tokens issued on the Ethereum platform are governed by ERC20 smart
    contracts. These ERC20 smart contracts imply a set of rules, events, and functions
    that all respective ERC20 contracts should implement. The value of these ERC20
    tokens is derived from the underlying assets they represent. Any token following
    ERC20 standards can be traded easily over the Ethereum platform. Eventually, this
    economy has the potential to build a more reliable and transparent financial structure
    by reducing resistance in the creation, buying, and selling of assets. Blockchain
    tokens can have benefits like greater liquidity, refined transparency, accessibility,
    instant low-transactions, etc. We will discuss ICOs and Tokens in the upcoming
    chapters.


    # Blockchain''s self-executing contracts


    Conventionally, a contract is a legal document that binds parties to execute tasks,
    procedures, or transactions under the agreed conditions mentioned in the document.
    These contracts are bound by the law of the land. There are multiple examples
    of these contracts, like insurance between parties, shareholding agreements among
    companies, sale and purchase of real estate, etc.


    A smart contract in the Blockchain is somewhat acted differently as compared to
    conventional status, but the motive of smart contracts is the same as of conventional
    contracts--to satisfy the conditions mentioned in the contract. So, smart contracts
    are simply programmable codes built over custom logic and deployed on a Blockchain
    framework. A smart contract automatically executes when predetermined terms and
    conditions are met, based on the rules it was programmed to do. Smart contracts
    are designed to'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'help transfer digital assets between accounts as an atomic transaction. Smart
    contracts are capable of storing data, and this stored data can be used to record
    any information, ledger balance, and data to implement the logic for real-world
    use cases.


    Generally, smart contracts are believed to have signatories, terms of the agreement,
    and contract subject as the main ingredient. Here, signatory refers to the involved
    parties in an agreement. Smart contracts execute only after final approval from
    the parties involved in the form of digital signature. Moreover, the contract''s
    terms should be provided in a smart contract in a predefined coded format so that
    the smart contract can decode the terms and agreement and act upon them.


    Suppose a pharmaceutical manufacturer places an order with a raw material supplier
    using a smart contract. Let''s presume as agreed on a smart contract, the manufacturer
    has to pay 80% of the total amount at the time of buying the raw material from
    the supplier, and the supplier has to ship the consignment upon the receipt of
    payment. The rest of the amount will be paid to the supplier at the time of delivery.
    In this scenario, the manufacturing company places an order with the supplier
    using a smart contract and signs the deal with a digital signature. The manufacturer
    draws a 100% amount into the escrow account associated with the smart contract.
    Once the supplier accepts the order, the smart contract releases 80% of the funds
    from the escrow account to the supplier''s account. On receipt of 80% funds, the
    supplier ships the consignment and submits the required digital document on the
    smart contract. On successful delivery of the raw material, the smart contract
    transfers the remaining 20% amount to the supplier and releases the digital documents
    to the manufacturer. The aforesaid scenario is an example to draw a picture of
    how a smart contract works; real-time use cases can be more complicated. No third
    party was involved in this scenario, and all steps were completed automatically
    by the self-executing smart contract. Here are some of the benefits of smart contracts:


    +   **Autonomy**: Smart contracts do not require any mediation from third parties,
    removing all the associated risks.


    +   **Trust**: All the documents and transactions are saved over the distributed
    ledger, so their immutability and the security of these documents and information
    are guaranteed.


    +   **Backup and safety**: As all the data and files are saved on the Blockchain,
    so these documents can''t be lost and will always be'
