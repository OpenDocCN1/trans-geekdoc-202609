- pgno: 58
  md: 'One should raise the question of what is the need for a decentralized and distributed
    network when we already have a well-functioning centralized system. Centralized
    systems may have helped build the existing network, but they have some disadvantages.


    This debate started with how our financial system has been designed to put all
    the power into a single network or system. Centralization denotes a point of central
    control, like financial institutions or banks in the case of finance or the money
    market. Banks have been running on this concept for long to execute money transfers,
    cross-border remittances, and other financial services, and it is always considered
    secure and stable. Modern financial systems look very secure and stable, but they
    are also heavily impacted by fraud, forgery, double spending, unreliable lending
    issues, and many more issues. The financial crisis of 2008-2009 fueled this debate,
    and that was the time when the world''s first digital currency, that is, Bitcoin,
    came into existence, eliminating the need for a centralized system and distributing
    the administrative power among thousands of nodes. With no centralization, Bitcoin
    or other Blockchain networks are unlikely to be affected by manipulations and
    frauds. Figure 2.2 illustrates a centralized and distributed system:


    ![](img/1e3b2549c903c8e5ca5ce0f7df00079c_58_0.png)


    Figure 2.2: Distributed vs centralized system'
