- pgno: 104
  md: '# CHAPTER 3

    Blockchain''s Application in Healthcare


    In the previous chapter, we learned about Blockchain and its potential to transform
    the way the existing processes, operations, data storage and are handled, regardless
    of the industry or domain. Like in any other industry, Blockchain technology has
    taken the center stage for many new developments in the healthcare sector. Blockchain
    is redefining data modeling and governance practices applied to many healthcare
    legacy systems and applications. Blockchain is not a remedy for healthcare data
    standardization or integration challenges, but it offers a promising framework
    for handling healthcare data and information across a range of applications and
    healthcare stakeholders.


    The healthcare industry is a complex and vast sector that consumes around 10%
    of the GDP of many developed countries. We have seen in the previous chapters,
    the healthcare industry comprises the generalization and commercialization of
    goods and services to provide patients with preventive, curative, palliative,
    and rehabilitative care. The healthcare system is an interconnected system of
    multiple entities that works under heavy regulations and a political environment.
    In a traditional healthcare system, patient data is highly fragmented and rests
    in silos. Inefficiencies and dependency on intermediaries are causing the cost
    of healthcare services to rise. Furthermore, transparency around patient data
    sharing is always under scrutiny the existing systems lack the transparency around
    data sharing, storage and ownership. These are only a few of the challenges that
    the healthcare sector is facing, and it is looking to adopt new infrastructure
    to overcome them. Blockchain has the potential to address existing pain points
    and enables a system that is more efficient, transparent, distributed, and secure.
    In this chapter, we will look at different use cases to see how Blockchain can
    play an important role in the healthcare sector.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Structure


    We will cover the following topics in this chapter:


    +   - Blockchain''s impact in healthcare and its use cases

    - Data handling in Blockchain

    - Blockchain-based EMR system

    - Role of Blockchain in FDA

    - E-prescription and digital certificates

    - Smart labs and IoMT


    # Objectives


    By the end of this chapter, you will know about the applications of Blockchain
    in the healthcare sector. As an extension to the topic, you will learn how data
    is handled in Blockchain and the possible use cases of Blockchain in the healthcare
    sector. Moreover, you will be introduced to the Blockchain-based healthcare ecosystem
    and its components. Going further, you will also walk through a conventional EMR
    (Electronic Medical Record) system and understand the gaps that can be channelized
    using Blockchain technology. Subsequently, you will see how Blockchain can be
    utilized by the FDA (Food & Drug Administration). At last, this chapter will give
    brief overview of Blockchain-based e-prescription systems, smart labs, and digital
    certificates.


    # Blockchain in healthcare


    We have seen that Blockchain technology has immense potential to address the challenges
    faced by the modern healthcare system. The healthcare sector is dealing with the
    growing demand for patient-centric and integrated care services globally. This
    demand pushes it to upgrade its existing IT infrastructure to tackle challenges
    around the current system. Certainly, Blockchain resolves most of the issues in
    healthcare systems, like interoperability, data security, shared information,
    and automated processes. Interestingly, some healthcare industry research indicates
    that Blockchain-powered healthcare systems can save up to $100 billion a year
    by 2005 in cyberattack costs, IT infra and operations cost, support friction cost,
    and'
  merge: -1
  img_proc: true
