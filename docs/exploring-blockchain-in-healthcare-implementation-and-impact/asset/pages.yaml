    # # Blockchain Fork


    To put in simple words, "Blockchain forks are the copies of a Blockchain network".
    In general, Blockchain forks, practically it is done on an open-source system
    or network that is available freely for further upgrades. This helps individual
    and developer communities promote further improvements in the software by changing
    the code in the fork. Bitcoin is one of the most most common Blockchain applications
    having multiple forks.


    Bitcoin, which was developed by Satoshi, is sometimes referred to as Bitcoin Core.
    Many developers and communities have extracted the fork from the'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Bitcoin core over time, and some of the popular forks are given here:


    +   * Bitcoin XT

    * Bitcoin Classic

    * Bitcoin Unlimited

    * Bitcoin Cash

    * Bitcoin Gold

    * SegWit2x


    In the previous modules, we have seen that Bitcoin blocks are created by miners.
    These miners validate and verify a transaction in the network by solving a mathematical
    puzzle (PoW). A transaction is saved in a block once a miner successfully validates
    it. Here, different miners are not in sync or misaligned. Further, a Blockchain
    fork can occur when two miners solve the mathematical puzzle at the same time
    validating a transaction. The fork can also result from deliberate mining, where
    a miner solves and holds the new blocks without broadcasting them immediately.
    Blockchain forks are of two types, as explained here:


    +   * Hard fork: Hard forks are the results of deliberate split action on the
    Blockchain network when a new upgrade is created by a community or a person using
    the core network. Hard forks are generally not backward compatible. A new branch
    created through the hard fork follows the new protocol, which means all the client
    software and virtual machines used for the validation processes will become obsolete,
    and an upgrade is a must. Bitcoin to Bitcoin Cash is one such example. The divergence
    essentially creates two competing blockchains.


    +   * Soft fork: A soft fork is a backward-compatible upgrade, where the upgraded
    nodes can connect with the old ones. This implies that older and upgraded protocols,
    rules, and nodes do not clash. Soft forks are an optional upgrade. This process
    also leads to deviation in the chain when any particular block marked using old
    rules is not processed by the upgraded nodes, but the non-upgraded nodes process
    it. It leads to asynchronization without the users noticing it. For example, Bitcoin''s
    SegWit update was a soft fork.


