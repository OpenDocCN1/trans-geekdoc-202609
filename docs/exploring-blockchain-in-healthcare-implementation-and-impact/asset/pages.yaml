    # Satoshi''s Bitcoin breakthrough


    An anonymous person or persons named "Satoshi" is believed to be the creator and
    inventor of the decentralized cryptocurrency "Bitcoin". Satoshi Nakamoto designed
    and developed Bitcoin after resolving the issue of the Double Spending problem
    for a decentralized digital currency and for creating a new asset.


    Bitcoin came into existence when Satoshi published a whitepaper on A Peer-to-Peer
    Electronic Cash System in 2008. At the beginning of 2009, Satoshi released an
    initial version of the source code and launched Bitcoin by mining the genesis
    block (First Block of Blockchain). Interestingly, Bitcoin came into the market
    when the world was tackling the financial crisis of 2008. Simply put, P-2-P electronic
    cash allows the transfer of payments directly from the sender to the receiver
    without the help of financial institutions like banks. Although US Dollar is the
    strongest Fiat currency in the world, Bitcoin has advantages: it does not run
    and is controlled by a central authority, and it is easier to obtain than other
    fiat currencies.


    Satoshi''s Bitcoin originated from an online community of hobbyists and computer
    scientists to provide a stable, efficient, and verifiable digital currency system
    by applying cryptography and P-2-P networking. Initially, Bitcoin users were largely
    a closed group of computer hobbyists to test and verify the Bitcoin crypto-currency
    using asymmetric cryptography, Proof of Work, and P-2-P networking. As stated
    earlier, the Bitcoin system does not rely on a centralized system or clearing-house
    to verify transactions. Instead, the Bitcoin system is based on a decentralized
    network that utilizes a tremendous amount of computing power to verify and validate
    the transactions on the Bitcoin network. Bitcoin network allows each node to participate
    in the network and verify and validate transactions. These nodes are also called
    "miners" who receive incentives after successfully verifying the transaction.


    Further, the Blockchain ledger is stored locally on each participating node running
    a full version of the Bitcoin software. Blockchain ledger records the history
    of each transaction executed on the distributed network. As of Dec 28, 2020, Bitcoin
    size reached 319.29 GB. We have learned that transactions are'
  merge: -1
