    # # Installing Truffle framework


    Truffle is a development and testing framework for Ethereum Blockchains. It contains
    all the tools to quickly start a personal Blockchain and test and deploy smart
    contracts. Installing the Truffle framework is quite simple--just type the following
    command in the command terminal and hit Enter:


    ```

    npm install -g truffle

    ```


    This command will install the latest truffle version on the machine. The following
    command should be used if a developer comes in a full wants to install a specific
    version of the truffle framework:


    ```

    npm install -g truffle@4.1.133

    ```


    # # Installing Ganache-CLI


    Ganache is a private Blockchain framework that helps develop Ethereum and Corda
    distributed applications. Ganache helps develop, deploy, and test the smart contracts
    on a private network. Ganache comes in a full GUI package, but here we are using
    Ganache-CLI for the development. Just like Ganache, Ganache-CLI also helps simulate
    blockchain client behavior and make developing Ethereum smart contracts faster,
    easier, and safer. Ganache-CLI is also known as the TestRPC network. Again, installation
    is pretty simple--just type the following command in the command terminal:


    ```

    npm install -g ganache-cli

    ```'
