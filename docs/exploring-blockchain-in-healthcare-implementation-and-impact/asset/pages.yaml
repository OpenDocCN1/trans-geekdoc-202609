  md: 'Figure 6.2 depicts a simplified customer journey for a health insurance product.
    Prima facie, it may look like the whole workflow or journey Straight through the
    process (STP), but it''s nothing like that. From product discovery to issuing
    a health policy to getting a claim from the insurer, it is a complex process.
    Multiple stakeholders play important roles in terms of underwriting, issuing a
    policy, handling a claim or reimbursement, etc. Let''s explore the major functions
    of an insurance company to understand the complexity of the workflow.


    +   - Underwriting: Profit margins in the insurance industry depend on analyzing
    the risk involved. Underwriters use a combination of data gathering and analysis
    and other parameters to evaluate if the risk is under the insurer''s standards
    for practical evaluation. In a nutshell, underwriting is the ability to analyze
    the risk involved under specific terms. Underwriters can accept or reject the
    policy based on the risk assessment. Underwriters are the people who establish
    the premium for a specific policy after evaluating the risks around it.

    - Claims: Claims or reimbursements are the actual insurance product component
    as the policy is purchased for hospitalizations or in an emergency. The insurance
    company evaluates the incoming request and determines the amount to be paid back
    to the beneficiary in terms of reimbursement or directly to the healthcare provider
    in case of cashless claims. Generally, cashless claims come through TPAs, who
    work as the claim adjuster. It may work for single or multiple insurers and may
    operate as an independent business unit.

    - Actuarial: An annuity is a professional in the insurance industry who deals
    with the measurement and management of risk and uncertainty, specifically with
    compiling and analyzing statistics to calculate risks and premiums in health insurance.
    Actuaries also help insurance companies determine reserves for expected claims
    and come up with new insurance ideas for the masses.

    - Fund managers: Fund managers are the investment professionals who help maintain
    capital flow in an insurance company through various investments and hedge funds.
    Investments are an important part of the insurance sector, but will not be discussing
    in this book.


