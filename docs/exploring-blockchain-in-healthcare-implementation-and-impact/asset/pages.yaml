    or an Admin user. This function uses the Public Key to identify them on to the
    Blockchain network and the Role which is assigned by the admin to the user. A
    user can be a patient, provider, or regulator based on the assigned role.

    - DeleteParticipant(PublicKey): This function in the smart contract is used to
    delete participants from the network or EHR system. Admin can remove users from
