    # # Food and Drug Administration (FDA) overview


    The FDA’s mission is to ensure the safety of individuals'' health. It ensures
    that any drugs, biological products, medical devices, food supply, cosmetics,
    etc. are as per the standards drawn by FDA and safe for public use. FDA also works
    closely with other stakeholders to introduce innovations and services to make
    healthcare products safe, affordable, and efficient.


    FDA has a well-defined process to take inputs into the advisory committee and
    incorporate them into the review process. For safety reasons, FDA can recall any
    products from the market. No company can launch a new drug, medical device, or
    other related product without approval from the FDA.


    The FDA has been instrumental in guiding the healthcare industry through strong
    leadership and oversight with a mission to protect public health. Some of the
    responsibilities and significant influences are listed here as gathered from the
    FDA’s resources:


    +   * Encouraging stepwise clinical development through guiding principles and
    standards.

    * Higher standards and processes for initial trials.

    * Properly addressing multiplicity through pre-specification of primary and secondary
    outcome measures and primary methods of analysis.

    * Recognizing reliability and interpretability of efficacy which is enhanced by
    assessing effects on direct measures of how a subject "feels, functions or survives".

    * Recognizing the likelihood of being misled when relying on replacement endpoints
    as biomarkers that have simply been shown to be correlated with direct measures
    of tangible benefit and often do not capture risks adequately.

    * Guiding proper designs of non-inferiority trials without compromising safety
    guidelines.

    * Enhancing the quality of trial conduct by encouraging timely enrolment, best
    real-world achievable adherence to experimental and'
