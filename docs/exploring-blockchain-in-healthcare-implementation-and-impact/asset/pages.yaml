    paper-based system, like damaged and lost prescription, dispensing wrong medicine
    due to poor handwriting. Although the e-prescription model is in use, it has challenges
    like interoperability issues among stakeholders, data theft, fragmentation, etc.


    # Key challenges of the existing prescription systems'
