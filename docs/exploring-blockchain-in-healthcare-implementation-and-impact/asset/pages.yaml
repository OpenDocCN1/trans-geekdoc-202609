    by the general public. With the aforesaid intentions, FDA has to deal with large-scale
    data, providing access to transparency of related data and ensuring its security.
    Additionally, the FDA has to deal with counterfeit drugs and products, so it requires
    an effective and efficient surveillance system. While dealing with these visible
    challenges, FDA'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'needs to ensure smooth transition among various collaborators and ecosystem
