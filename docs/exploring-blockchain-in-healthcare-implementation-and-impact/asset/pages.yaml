    # # Traceability of genetic history


    In general, traceability is the ability to verify a living thing''s genetic history,
    native location, history of diseases, etc. through documented records. Every transaction
    in Blockchain gets timestamped, which makes transaction data traceable and verifiable.
    Data gets recorded for the entire process n Blockchain, from data origin to final
    application or storage. All data in Blockchain can be backtracked, and ownership
    of the data can be retrieved throughout its lifecycle.


    The aforementioned Blockchain-based platform also ensures the accuracy and integrity
    of the data stored, as the same version of the historical ledger records are replicated
    in the participating nodes. The goal of using the traceability function in the
    mentioned Blockchain framework is to share the immutable genomic data and information
    with all the stakeholders in the network. Blockchain also ensures the integrity
    of the data and ensures that it does not get tampered with.


    Traceability is an important parameter, considering the development of generic
    drugs, pharmaceutical supply chain, and data sharing using cases. Traceability
    of the genomic data can be analyzed for different applications:


    +   - Pharmaceuticals/precision medicine

    - Drug supply chain

    - Genetic research

    - Government DNA databases

    - Preventive therapies for genetic diseases


    Blockchain traceability can be used to retrieve the audit trail and ownership
    change while using an individual''s genomic data before it can be used for commercial
    or research purposes. Likewise, individuals retrieve the access history of their
    genomic data has been used and by whom. This traceability feature makes the Blockchain
    system more transparent, where each party can audit their respective genomic data.
    Likewise, Blockchain''s property of traceability in human genomics can also be
    applied to other areas like food and supply chain, livestock, and milk industry
    for various applications.'
