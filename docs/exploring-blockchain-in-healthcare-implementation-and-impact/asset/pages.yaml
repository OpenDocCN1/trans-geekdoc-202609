- pgno: 8
  md: '# Preface


    I first got into the world of the Blockchain when I came across the white paper
    written by Satoshi Nakamoto in late 2010. At the time, I had an instinct that
    the technology behind Bitcoin can also be used in other industries. When Blockchain
    frameworks like Ethereum and Hyperledger came up with a similar concept but for
    a broad spectrum of the financial and non-financial use cases, I started exploring
    the applications of Blockchain in sectors like energy, healthcare, and the finance
    and capital market.


    Given this backdrop, I worked on the idea of using Blockchain technology in the
    healthcare industry in this book, considering the existing challenges in different
    verticals of the healthcare sector. This book drafted to discuss the different
    domains of the healthcare industry, their challenges, and how Blockchain technology
    can be used to fill the gaps in these domains and create a new type of connected-healthcare
    system. This book talks about different domains of the healthcare industry, like
    the pharmaceutical supply chain, the healthcare insurance sector, smart labs,
    HIS, and genomics. Each chapter explains the application of Blockchain and smart
    contract in these domains through real-world examples and algorithms to connect
    the dots efficiently.


    This book explains how Blockchain can be utilized to resolve the existing challenges
    and fill in gaps across the healthcare industry or how innovations can be utilized
    in the healthcare sector, as asset tokenization and smart contract. It also explores
    blockchain applications in the healthcare sector by explaining real-world use
    cases and algorithms. Additionally, it covers details around different Blockchain
    frameworks like Ethereum, Hyperledger, and Multichain for different use cases
    where applicable.


    This book is divided into 10 chapters. Initially, we will discuss the healthcare
    industry and Blockchain fundamentals. Then, we will touch upon various sectors
    of the healthcare industry, and you will understand how blockchain frameworks
    can be applied in typical processes in these domains. This book will also explain
    the approach to couple Blockchain with other cutting-edge technologies like AI/
    ML, Cloud Infra, Big Data,'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'and Advanced Analytics. Here’s an overview of what’s covered in each chapter:


    **Chapter 1** is an introduction to the healthcare industry and how medical records
    and processes are handled currently.


    **Chapter 2** provides an insight into the fundamentals of Blockchain. You will
    understand the Blockchain basics and the different Blockchain frameworks available.
    In this chapter, one sample smart contract is developed and deployed on a test
    network.


    **Chapter 3** explains how Blockchain can play a role in healthcare. We will learn
    about the various roles of Blockchain in the healthcare domain.


    **Chapter 4** provides an overview of modern HIS/EHR systems and how patients’
    medical history and data is saved and shared with other parties. Additionally,
    you will learn how patients can own and secure their medical records using Blockchain
    technology.


    **Chapter 5** talks about the use of Blockchain in traceability and provenance
    of pharmaceuticals with authenticity. We will understand how to track and avoid
    illegal trade practices.


    **Chapter 6** looks at Blockchain in healthcare insurance claims. Here, you will
    understand insurance claims processes and their estimation using Blockchain.


    **Chapter 7** focuses on how Blockchain can be used to issue digital medical certificates
    and prescriptions that can be appended to healthcare requests or insurance claims.


    **Chapter 8** discusses the use of Blockchain in fetching and storing medical
    test results, scan results, and other information through smart medical instruments
    and equipment. In this chapter, we will cover smart labs and efficient data storage
    and processing.


    **Chapter 9** takes you through using Blockchain in storing and maintaining organisms’
    genetic information for all eternity. You will learn how to store, trace, and
    apply analytics data generation using Blockchain technology.


    **Chapter 10** focuses on the use of Blockchain in the administration of vaccination
    and healthcare policies. You will also learn to determine and address healthcare
    insurance and policies.'
  merge: -1
  img_proc: true
