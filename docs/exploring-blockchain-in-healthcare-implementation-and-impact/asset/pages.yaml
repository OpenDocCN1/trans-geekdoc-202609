- pgno: 56
  md: '# Objectives


    This chapter will introduce you to the fundamentals of Blockchain and its core
    concepts. You will understand the anatomy of the Blockchain and how the blocks
    are created. This chapter will also walk you through the journey of the Blockchain
    and how Satoshi created the magical world of the distributed network. Going forward,
    you will understand the concept of cryptography and P-2-P networking. You will
    also be introduced to the world of Bitcoin and digital wallets and how mining
    works in a typical Bitcoin network. This chapter will also provide an overview
    of different consensus protocols used in the Blockchain network and different
    types of Blockchain networks based on the use case and business requirements.
    Further, it will explore the concept of tokenization and smart contract in the
    Blockchain network. At last, this chapter will help you understand the development
    framework of the Blockchain by developing, writing, deploying, and running a smart
    contract on a private Blockchain network.


    # Introduction to Blockchain


    In a nutshell, Blockchain is a distributed, decentralized, peer-to-peer, immutable,
    and secure computer network to store information and transfer digital instruments
    of value. Blockchain can be considered as a database built by fixed-length data
    blocks that are chained sequentially, consisting of transactions ranging from
    1 to N. Decentralization in Blockchain indicates that the whole system is not
    owned by a single machine but is managed by multiple computers in the network.
    These independent computers are called "Nodes"


    Blockchain technology relies on three main pillars that were first envisaged by
    the anonymous creator of Bitcoin. These three pillars are:


    +   - **P-2-P networking**: In peer-to-peer networking, multiple computer systems
    are connected that they can share data and information among themselves. In the
    context of Blockchain, the P-2-P network is designed to eliminate the dependency
    on a single central authority. P-2-P network can be compared with BitTorrent as
    a real-world example.


    +   - **Asymmetric cryptography**: Computers or nodes in a Blockchain system communicate
    with each other by sending encrypted messages. Asymmetric cryptography or public-key
    cryptography is a commonly used technique for sharing data among nodes in Blockchain.
    In this'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'method, encryption and decryption happen using two different yet mathematically
    connected cryptographic keys.


    +   - Cryptographic hashing: It''s a method to convert any data to a unique string.
    This unique string can be seen as the "fingerprint" of that data. The hashing
    technique allows swift comparison of a large dataset and a technique to verify
    the data alteration. Merkle tree is a frequently used term in Blockchain. It is
    based on the same hashing technique to verify and compare the data in the network.


    Figure 2.1 shows the evolution of Blockchain networks from a centralized to a
    fully distributed system.


    Let''s look at some common and popular technological use cases to understand the
    difference between centralized networks and distributed Blockchain systems. A
    conventional centralized system is like Dropbox or Google Drive, where anybody
    can upload data or files and other people can download the same using a sharable
    link. On the contrary, Blockchain is like BitTorrent, where a file can be directly
    transferred to other systems as other people also participate in the network.
    With traditional systems, access to something is managed by a username and password,
    defined by the super admin. On the contrary, the Blockchain system has no central
    authority, so it uses cryptography instead of username and password. Blockchain
    defines authority using asymmetric cryptography.


    ![](img/1e3b2549c903c8e5ca5ce0f7df00079c_57_0.png)'
