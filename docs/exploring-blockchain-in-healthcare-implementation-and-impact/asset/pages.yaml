    # Blockchain for issuing medical certificate


    Digital signatures have become a standard in many organizations and establishments
    and have been seen as a key component in security strategy. The organizations
    depend on these certificates and complex algorithms to provide authenticity of
    the certificate and data to protect against frauds. Digital certificates and signatures
    have been in use for some years, but the issues of fraud and forgery have not
    been resolved completely. Further, digital certificates have not been adopted
    in full swing by organizations across the globe, particularly in developing countries
    where paper-based certificates are still in use.


    Moreover, considering the properties of Blockchain, it is now obvious that Blockchain
    can add a layer of security while issuing medical certificates and signatures.
    It can allow multiple signatures, timestamp references, and fingerprint creation
    and distribute all this information on a Blockchain-distributed network. One interesting
    aspect of using Blockchain is that a certificate authority''s dependency can be
    eliminated as Blockchain itself provides asymmetric or public key cryptography,
    which can be used as the digital signatures of a signing authority and can be
    verified easily using the Blockchain network without the need for a third party.
    Blockchain adds the greatest value in the proof-of-work concept—transactions cannot
    be edited or removed, which greatly secures the transactions and signature technologies.'
  merge: -1
  img_proc: true
