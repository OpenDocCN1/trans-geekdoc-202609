    in the health insurance sector, and experts working in the health insurance sector
    say this can benefit the most using the distributed ledger technology. Blockchain
    can revolutionize the healthcare sector by reducing the amount of time and operational
    cost for processing claims and reimbursements. As per Blockchain''s properties
    and operating model, patients are the owners of their medical and health records
    and can share the information as per the requirement on request from an insurer.
    Role-based authentication will allow stakeholders in the insurance ecosystem to
    participate based on the defined roles to avoid identity theft. Blockchain-based
    smart contracts can ensure claim settlements and reimbursements in real-time by
    automating the manual processes involved. Smart contracts can also eliminate the
    role of TPAs in claim settlements.


