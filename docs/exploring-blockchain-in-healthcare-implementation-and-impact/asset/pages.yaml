    and transcripts include confidential information about an individual and should
    not be accessed by an unknown entity or person. On the contrary, medical prescriptions
    and certificates are widely abused and misused, by either the owner or a third
    party. The main reason for this is that paper-based prescriptions and certificates
    are still in practice. Many companies have started issuing digital certificates
    and many hospitals have started using e-prescription software, but this practice
