  md: '# CHAPTER 2


    # Blockchain Fundamentals


    Blockchain is a new and state-of-the-art technology that is revolutionizing the
    conventional methods of information collection, governance, and distribution.
    Blockchain is the most hyped technology since the launch of Bitcoin in 2008. The
    current decade witnessed dramatic trends in Blockchain adoption from POC to full
    commercial use cases. Experts across different industries and domains, including
    finance, supply chain, energy, healthcare, and pharmaceuticals, are fascinated
    by the potential of Blockchain and are trying to replace old legacy systems with
    Blockchain-based systems to become early adopters and reap the benefits of distributed
