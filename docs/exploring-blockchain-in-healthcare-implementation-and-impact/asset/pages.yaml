    # # Tokenization to incentivize individuals for sharing health data


    In general, individuals access their medical records when medical or healthcare
    services are required, and their healthcare data in any form is just sitting there
    in a vacuum otherwise. It does not create any value for the individuals, so this
    data (digital or paper-based) is a sort of liability. What if this data starts
    generating money for the individual by data trading, just like investing money
    into the stock market?


    Does this sound odd? Well, not exactly! Blockchain-tokens can create an ecosystem
    where people can trade their healthcare information. Also, monetization of healthcare
    data can motivate people to participate in the healthcare ecosystem, and this
    can lay the foundation for a validated, verified, and quality data-sharing model.
    This shared data can be utilized by insurance companies and in medical research
    or clinical trials. Interestingly, these tokens can contribute to the reduction
    of health insurance premiums or, in the best-case scenario, a free insurance policy.
    Some research and market studies have established that many people in developing
    countries are willing to share their health data with these stakeholders, and
    this trend is expected to continue in developing countries as well.


    This sounds fascinating! But is it actually possible? The answer is yes; many
    companies in the healthcare sector have started working on tokenized assets using
    Blockchain technology. Blockchain is a known technology for the healthcare sector
    now as many companies are either doing pilot projects or commercial-grade Blockchain
    projects, as discussed in the previous chapters. Blockchain technology can provide
    suitable infrastructure for this sharable tokenomics, where any stakeholder in
    the healthcare ecosystem can request individuals for their healthcare data for
    further use against some incentives.


    Let''s take an example of the healthcare ecosystem, where an individual is the
    key player and is in the center of the ecosystem. Here are the possible anticipated
