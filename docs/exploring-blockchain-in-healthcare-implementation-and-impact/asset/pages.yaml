    # # Blockchain-Powered EMR systems


    While discussing Blockchain, a transaction in the context of healthcare may contain
    documentation and data of the medical services provided to a patient. The documents
    and data may consist of medical records, imaging reports, the patient''s medical
    history, and demographic data. In Blockchain-based EMR systems, patient''s records
    are injected into the Blockchain, and the data is mapped with the patient''s digital
    ID for future references and for sharing with other entities. In the proposed
    solutions, medical records are stored with viewing permission and retrieval instructions.
    This arrangement enables the Blockchain-based smart contract to deal with patients''
    data sharing with other entities via a predefined set of rules and agreements.
    Simply put, smart contracts facilitate the interaction of the patient-provider-consumer-driven
    model where patients are masters of their data as patients'' medical data and
    information can be shared only after the patient''s consent. Figure 3.3 is an
    envisaged model of a Blockchain-based EMR system:'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/1e3b2549c903c8e5ca5ce0f7df00079c_116_0.png)


    # Figure 3.3: Blockchain-based EMR system


    In this Blockchain-based framework, patients'' medical data and records are maintained
    by a single practice. So, whenever a doctor or medical professional creates a
    record, it is processed with a data analytics engine and saved to a local EMR
    database. Then, viewing permissions are enabled by the patient based on the public
    key cryptography, and the data is injected into the Blockchain network. Business
    requirements decide what data should be saved off-chain and on-chain, but the
    basic properties of security, immutability, and distribution are applied to the
    saved information regardless of the mode used. Data generated from IoT devices,
    wearables, sensors, and other microdevices can also be included in the ecosystem
    for better data-driven decision-making.


    Other stakeholders of the healthcare ecosystem can access medical records using
    Blockchain-based smart contracts. These smart contracts can provide data access
    based on the terms and agreements written in the contract. Patients have full
    control of their medical records and information, and other providers, like doctors,
    can access this information only after acquiring the required permission.


    The concept of a Blockchain-based EMR system has been on the rise, and it is being
