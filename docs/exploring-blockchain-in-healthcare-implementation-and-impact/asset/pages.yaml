  md: '# Asset tokenization in Blockchain


    Assets tokenization is a whole new dimension in the Blockchain space, and it is
    important to understand the anatomy and theory of tokenization before digging
    its use case in insurance premium payments and claims. We often hear two terminologies
    in the context of protecting sensitive data: "Encryption" and "Tokenization".
    Check these elucidations to understand the terminologies better.


    Encryption is the process of converting plain text into a non-readable form or
    ciphertext using a predefined encryption algorithm. An encryption key is required
    to decrypt ciphertext to a human-readable format. The same key can be used to
    encrypt and decrypt the token in symmetric-key encryption, while two separate
    keys are used for encryption and decryption in the case of asymmetric key encryption.


    Unlike encryption, tokenization converts the plain text or any data into a random
    string known as a token. These tokens cannot be used to evaluate the value of
    the original data. Tokenization is not new technology; service providers like
    Visa and Mastercard have been using it for the past few years to protect customers''
    credit/debit card data by providing them with a random string or token. In this
    module, tokenization is more bound to Blockchain-issued tokens. From the security
    aspect, tokenization can reduce the risk of data theft as only tokens are exchanged
    for the original data.


    Blockchain is proposing a new "Tokenization (Token Economy)", which can revolutionize
    the way people carry out trade or financial transactions. One interesting example
    is Non-Fungible Tokens (NFTs). NFTs can be anything e.g., drawing, music, precious
    arts, etc. Perhaps the most famous example of NFTs is the digital artist Beeple
    who sold a piece of artwork for $69 million, and Twitter founder Jack Dorsey sold
    his first-ever tweet for $2.9 million. This may sound crazy, but tokenization
    offers the potential for a efficient and fairer financial ecosystem by reducing
    the friction involved in the creation, buying, and selling of assets.


    Using a DLT/Blockchain to create a digital token enables the collaboration of
    different companies, which, in turn, allows the aggregation of otherwise fragmented
    information into one digital token. Moreover, all parties can seamlessly update
    information and verify its correctness. Some of the key benefits of the tokenization
    are as follows:'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   **Greater liquidity:** Tokenization provides more liquidity to an asset
    as these tokens can be traded on a secondary market of the issuer''s choice. This
    opens up opportunities for investors, buyers, and sellers on a border scale and
    can attract greater value from the underlying assets.


    +   **Near real-time transactions:** These tokens are facilitated and processed
    by smart contracts, so transactions between parties can be completed in almost
    real-time without any administrative process or intermediary''s involvement.


    +   **Transparent system:** A token is embedded with the issuer''s information,
    the token-holder''s rights and obligations, and an immutable record of ownership
    and transactions. This adds more transparency to the token as everything can be
    backtracked and assure the parties regarding fair trade.


    +   **Accessibility/assets fractionality:** Tokenization could open up investment
    as horizontally as low investments and less time is required in token transactions.
    Investors can also purchase tokens that are equivalent to a very small percentage
    of the underlying asset. Thus, many individuals can participate with low risk.


