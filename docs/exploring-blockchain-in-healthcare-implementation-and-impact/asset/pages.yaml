  md: 'existing form of IDs instead of using cryptographic keys. This contract is
    designed to regulate the registration of new identities or to change the mapping
    of the existing IDs.


    +   - Patient-Provider Relationship Contract (PPR): This contract is issued between
    two nodes in the Blockchain network, where one node is managing and storing the
    medical records for the other. The PPR is a collection of data pointers and binds
    the permission that identifies the records in the system. Each pointer has a query
    string that returns patient data when executed on the provider''s database. Hash
    of the retrieved patient''s data is attached with the query string to ensure that
    no alteration has been done at the source.


    +   - Summery Contract (SC): Summery Contract helps participants locate their
    medical data history. It maintains a PPRs reference that tracks the engagement
    of all participants in the network. For instance, patients can run SC to retrieve
    references to all the interactions with the providers in the network and vice-versa.


    Considering Blockchain''s property of immutability, any participant can leave
    the network anytime, but they can see their past data and interactions in the
    Blockchain network when they rejoin the network.


