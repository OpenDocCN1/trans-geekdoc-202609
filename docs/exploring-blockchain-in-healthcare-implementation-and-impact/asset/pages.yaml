    # # An introduction to genomics


    Every living thing in the world has a unique set of in-built and inherited properties
    that separate it from the other species. These inherited properties are the blueprint
    for the development of the respective species throughout their lifecycle. These
    blueprints are marked in the DNA of the species. The mentioned blueprint determines
    the development plan for any species. Moreover, one species shares the same development
    plan, which is why all humans have the same physical and internal characteristics.
    DNA is the basic element that separates one species from another.


    Genomics is the study of biomolecules aka DNA to understand the internal structure
    and function of genes and their relative interactions. Genomics includes the sequencing
    of genes, determination of the range of genes, analysis of protein encoded by
    an organism, their internal interactions, and metabolic properties. Scientists
    across the globe are analyzing genomics for'
  merge: -1
  img_proc: true
