    learning, and Big Data can play a pivotal role in data fragmentation before injecting
    the data into the Blockchain.


    The Blockchain technology stack works on top of the data stack as Blockchain acts
    as the bridge between raw data and healthcare platforms or applications. Blockchain
    or DLT layer is what makes the healthcare ecosystem secure, fast, and interoperable.
    Suitable Blockchain fabric, communication protocols, and a consensus model can
    be designed based on the healthcare business use case. Subsequently, transactional
    data can be made on-chain or off-chain, as per requirements. Many Blockchain platforms,
    like Ethereum, Hyperledger Fabric, Ripple, create Decentralized Applications (DAPs).
    All the Blockchain''s basic components, like smart contracts, wallets, and digital
    assets, rest on this layer.


    Healthcare applications or platforms are built over a Blockchain layer based on
    the selected use case. These use cases are most patient-centric and aim to provide
    seamless healthcare and medical services to end-user. Further, these use cases
    are designed in such a way that they resolve the issues in the existing systems,
    like interoperability and data privacy. Apart from standalone applications, IoT
    and wearable-based systems can be placed in this layer. Finally, at the top of
    the hierarchy, all the stakeholders in the healthcare ecosystem can interact with
    the framework. These stakeholders can take advantage of the underlying Blockchain-based
    applications (DAPs). This layer is the combination of patient, service providers,
    regulators, policymakers, etc. These stakeholders interact with the system for
    different purposes, but they are expected to use the system without compromising
    the core idea of the ecosystem.


    # Blockchain in Electronic Medical Records


