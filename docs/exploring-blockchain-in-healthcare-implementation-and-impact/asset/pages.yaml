- pgno: 246
  md: 'Here are some of the key challenges of the existing paper-based or digitized
    prescription model:


    +   * Interoperability issues: Streamlined communication channels do not exist
    among stakeholders. Further, data is not shared between healthcare service providers,
    or there are no 360° views of patients'' healthcare data.

    * Lack of data standardization: Further, there are no data standards while issuing
    prescriptions. The existing model has to deal with data inconsistency and fragmentation,
    so the providers may not have the same data as the patient.

    * Security challenges: The existing systems are centralized, or prescriptions
    are issued on paper, so they are attracting privacy and security issues. On the
    other hand, the existing software systems to issue e-prescriptions are prone to
    cyberattacks and data theft.

    * Illegal trade of drugs: There are no specific measures to track and trace the
    sold medicines, so there are chances of drugs and medical products being dumped
    into illegal trade via reselling.


