  md: '# ## Blockchain system architecture


    Alleviate organizations and insurer''s workload for issuing and verifying the
    digital medical certificates, we can envisage an architecture building on top
    of the existing EHR system. All records, including a patient''s medical and healthcare
    records, go through the Blockchain and are saved into the distributed ledger.
    A patient''s information may also consist of each interaction with the provider
    and the issued medical certificate. All this data can be traversed in real-time
    for auditing and tracking. The ownerships and access rights of the records are
    important pieces of metadata added to the chain in addition to the logs. This
    way, the history of all accesses is stored on the Blockchain that provides a full
    view of all the events that have happened to each record, and guarantees data
    integrity and prevents the misuse of user records.


    In the aforesaid proposition of issuing digital medical certificates through a
    Blockchain network, the underlying system architecture consists of three main
    components:


    +   - Blockchain network: The aforesaid functionality of issuing the digital medical
    certificate can build upon a readymade solution, like Blockchainbased EHR/HIS
    system, to provide a complete picture of the patient''s interaction with the provider
    or doctor. In this case, we are considering using the existing Blockchain-based
    EHR/HIS system to also provide the functionality of issuing the digital certificate
    through the smart contract. We have understood that Blockchain runs on multiple
    nodes, so it is actually a fail-safe system and cannot be hacked.


    This proposition will work on a consortium model as multiple healthcare stakeholders
    have to be onboarded on a common platform.


    +   - Frontend interface: Frontend interfaces (web/mobile/tablet) are the interaction
    junctions from the user''s point of view, whether it is a patient, provider, or
    insurance company, as they need not bother about what is happening in the background.
    All the data enters via this frontend application, so after providing the medical
    services to the patient, the doctor or competent authority enters the details
    required to generate a certificate on the frontend and submits the details. Smart
    contract prepares a certificate, signs the document digitally, and issues it to
    the patient. The patient can download the certificate by accessing the patient'
  merge: -1
  img_proc: true
