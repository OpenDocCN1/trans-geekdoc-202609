    # # The Byzantine Generals Problem


    1982, Robert Shostak, Leslie Lamport, and Marshall Pease came out with a paper
    regarding the Byzantine Generals Problem. This paper was written to resolve the
    issue of trust among computer systems as a reliable computer network or system
    must be able to handle the failure of one or more of its components. It is believed
    that faulty systems or parts may send conflicting information to other components.


    The Byzantine Generals Problem (BGP) is a centuries-old problem of trust, which
    Bitcoin has been solved using the Proof of Work concept. In BGP, imagine multiple
    platoons or divisions of a Byzantine army planning to attack a city, and these
    divisions are dispersed around the city’s periphery. So obviously, each general
    of each division must agree on the war plan—attack or retreat—to capture the city.
    Additionally, it is anticipated that the commanding general must be able to send
    a message of attack or retreat to his lieutenant generals. No possibility can
    be ruled out that some of the lieutenant generals are traitors. These traitors
    cannot reread a false report or alter the message to be shared with the commanding
    general. Figure 2.11 depicts BGP.




    +   * All loyal lieutenant decide on the same action plan

    * A small group of traitors cannot cause the loyal lieutenants to adopt a bad
    strategy'
