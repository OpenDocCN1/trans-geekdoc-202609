- pgno: 195
  md: '+   - The number of samples for each medicinal product each year on be limited.


    +   - Any supply of samples shall be in response to a written request, signed
    and dated, from the prescribing agent.


    +   - Those supplying samples shall maintain an adequate system of control and
    accountability.


    +   - Each sample shall be identical to the smallest presentation on the market.


    +   - Each sample shall be marked ''free medical sample—not for sale'' or shall
    some other wording having the same meaning.


    +   - Each sample shall be accompanied by a copy of the summary of product characteristics.


    +   - No samples of medicinal products containing psychotropic or narcotic substances
    within the meaning of international conventions, such as the United Nations Conventions
    of 1961 and 1971, may be supplied.


    # # Tracking of sample medicine


    The European Commission, with delegation regulation, published accompanying provisions
    to Directive 2001/83, requiring that all medicinal products, including free samples,
    be fashioned with safety features, specifically a unique code and safety features
    that enable users to see whether or not the product has been tampered with. So,
    it requires the serialization of medicinal products. Non-prescription medicinal
    products are generally exempt, whereas only a limited number of designated prescription
    medicines are exempt.


