- raw: "This is the syntax that you should use while defining a function:\n\nfunction\
    \ name\\_of\\_function (argument\\_1, argument\\_2, argument\\_3, …)\n\n{\n\n\
      statement/s\n\n}\n\nYou can retrieve values from your functions by invoking\
    \ the “return” expression inside them. By doing this call, you will stop the function's\
    \ execution and get an immediate value. The example given below will show you\
    \ how to define a function:\n\nfunction square ($a)\n\n{\n\n  return $a\\*$a;\n\
    \n}\n\n## \n\nThe Scope of a Function \n\nEach function has a unique collection\
    \ of variables. The variables  you will define outside the definition of a function\
    \ are inaccessible while you are inside the function. Once you run a function,\
    \ you will also define its parameters. Using a new variable within the function\
    \ defines that variable inside that function only. Additionally, that variable\
    \ will disappear as soon as the function that contains it ends. The code snippet\
    \ given below will illustrate this idea:\n\nfunction example()\n\n{\n\n  $favorite\\\
    _number = 1;\n\n}\n\n$favorite\\_number = 3;\n\nexample();\n\nprint $favorite\\\
    _number;\n\nOnce you call the example() function, the variable named $favorite\\\
    _number inside it won't affect the variable declared outside the function. Thus,\
    \ this snippet will print “3” on your screen.\n\nYou probably want to know how\
    \ you can access and/or modify $favorite\\_number from outside the function. As\
    \ mentioned in the first chapter, you may use the pre-installed array called $GLOBALS\\\
    [\\] to access any variable inside your script. You can rewrite the script given\
    \ above as:\n\nfunction example();\n\n{\n\n  global $favorite\\_number;\n\n  $favorite\\\
    _number = 1;\n\n}\n\n$favorite\\_number = 3;\n\nexample();\n\nprint $favorite\\\
    _number;\n\nWith this code, your screen will display “1.”\n\nAdditionally, the\
    \ global keyword allows you to define which global variable/s you like to access.\
    \ If you will use this feature, the system will import the global variable/s you\
    \ selected to the scope of your function.\n\n## \n\nThe “By Value” Method of Returning\
    \ a Value \n\nYou can use a “return” statement to get values from your functions.\
    \ This kind of statement returns a value “by value.”               Basically,\
    \ it creates a copy of the appropriate value and sends it to the user. Here's\
    \ an example:\n\nfunction sample\\_function($test)\n\n{\n\n  return $GLOBALS\\\
    [$test\\];\n\n}\n\n$numeral = 4;\n\n$sample\\_value = sample\\_function(“numeral”);\n\
    \nprint $sample\\_value;\n\nYou will get “4” if you will run this code snippet.\
    \ However, altering the $sample\\_value variable before “print” will affect that\
    \ variable only. The changes that you will make won't affect $test, which is a\
    \ global variable.\n\n## \n\nThe “By Reference” Method of Returning a Value \n\
    \nIn PHP, you can also use a reference to return values. That means you won't\
    \ get a copy of the variable involved. Rather, you will get the address of that\
    \ variable. This feature allows you to modify any variable from the call's scope.\
    \ To use this method, you need to place “&” before the name of the function and\
    \ within the invoker's code. The following example will show you how this method\
    \ works:\n\nfunction &sample\\_function($fruit)\n\n{\n\n  return $GLOBALS\\[$fruit\\\
    ];\n\n}\n\n$favorite\\_number = 5;\n\n$sample\\_value =& sample\\_function(“favorite\\\
    _number”);\n\nprint $sample\\_value . “\\\\n”;\n\n$sample\\_value = 10;\n\nprint\
    \ $favorite\\_number;\n\nIf you will run the code given above, your screen will\
    \ display these numbers:\n\n5\n\n10\n\nYou were able to modify $favorite\\_number\
    \ using $sample\\_value since  the latter is an active reference to the former.\n\
    \nImportant Note: Programmers rarely use this method. That's because it is inherently\
    \ complex and often leads to bugs.\n\n## \n\nHow to Declare a Function Parameter\
    \ \n\nPHP doesn't have a limit in terms of the number of arguments that you can\
    \ assign to a function. In this language, you can pass arguments using two different\
    \ approaches. The first one, known as “passing by values,” is the most popular.\
    \ Programmers refer to the second method as “passing by references.” You should\
    \ specify the method that you want to use while defining the function. Indicating\
    \ the method during a function call will result to runtime errors.\n\nThe By-Value\
    \ Parameters\n\nThis method accepts any PHP expression. Here, the program will\
    \ evaluate the assigned expression and assign its value to a variable inside the\
    \ function. For instance, in the example given below, $a gets 6 as its value while\
    \ $b gets the value of another variable:\n\nfunction sample($a, $b)\n\n{\n\n \
    \ …\n\n}\n\nsample(2\\*3, $x);\n\nThe By-Reference Parameters \n\nIn this method,\
    \ you need to use variables as arguments. Rather than passing the variable's actual\
    \ value, a variable inside the function refers straight to the selected argument\
    \ whenever activated. Thus, any modification done on the variable within the function\
    \ will also affect the variable outside the function's scope. Here's an example:\n\
    \nfunction sample(&$a)\n\n{\n\n  $a = $a\\*$a;\n\n}\n\n$favorite\\_number = 5;\n\
    \nsample ($favorite\\_number);\n\nprint $favorite\\_number;\n\nThe ampersand sign\
    \ before $a inside the function's parameter requires PHP to use the by-reference\
    \ method. If you will run this code snippet, your screen will show “25.”\n\nThe\
    \ Default Parameters \n\nA default parameter allows you to set default values\
    \ for your functions. Thus, your functions will get a parameter automatically\
    \ if you won't assign one. In the PHP language, you need to use constant values\
    \ while setting default parameters.\n\nHere's an example:\n\nfunction increase(&$number,\
    \ $sample = 5)\n\n{\n\n  $number += $sample;\n\n}\n\n$number = 1;\n\nincrease\
    \ ($number);\n\nincrease ($number, 2);\n\n## \n\nThe Static Variables \n\nSimilar\
    \ to C, the PHP language supports the declaration of static variables. Static\
    \ variables stay as they are between function invocations. However, you can only\
    \ use them inside the function that contains them. You can initialize a static\
    \ variable. The initialization process will take place once the program reaches\
    \ the variable's declaration.\n\nThe following code snippet will show you how\
    \ to declare a static variable:\n\nfunction something\\_useful()\n\n{\n\n  static\
    \ test = true;\n\n  if (test) {\n\n    // Run this code once the function is invoked.\n\
    \n  …\n\n}\n\n  // Run the main logic of the function each time this function\
    \ is invoked.\n\n  …\n\n}\n\n# \n\nChapter 4: Object-Oriented Programming \n\n\
    This chapter will focus on the object-oriented style of programming. It will teach\
    \ you the fundamentals of the object-oriented model. Additionally, it will provide\
    \ you with detailed instructions on how to create and control objects. Study this\
    \ material carefully if you want to be a skilled PHP user.\n\n## Objects – The\
    \ Basics\n\nIn OOP (i.e. object-oriented programming), you will combine codes\
    \ and data to create an object. A computer application created using this style\
    \ consists of different objects that can communicate with each other. Often, these\
    \ objects are self-contained and possess different methods and properties.\n\n\
    Properties serve as an object's data. Thus, these are variables owned by the object\
    \ they point to. The methods, on the other hand, are functions an object supports.\n\
    \nClasses serve as templates for a programming object. They describe the properties\
    \ and methods that an object will possess. In the example given below, the class\
    \ describes a vehicle. For each vehicle inside your computer program, you may\
    \ create an instance of the class to represent that vehicle's data. For instance,\
    \ if two vehicles in your application are named “Car” and “Motorcycle,” you will\
    \ create two instances of your class and initialize the appropriate variable for\
    \ each vehicle. \n\nTo initialize the variables,  you need to invoke the method\
    \ named setName() for the two vehicles. The members and methods that interacting\
    \ objects can utilize are known as the “contract” of the class. For the example\
    \ below, the car's contracts are the “get” and “set” methods, getType() and setType().\n\
    \nClass Vehicle {\n\n  private $type;\n\n  function setType ($type)\n\n  {\n\n\
        $this→type = $type;\n\n  }\n\n  function getType()\n\n  {\n\n    return $this→type;\n\
    \n  }"
  fmt: "\n# 函数定义语法\n\n定义函数时应使用以下语法：\n\n```\nfunction name_of_function (argument_1,\
    \ argument_2, argument_3, …)\n{\n    statement/s\n}\n```\n\n你可以通过在函数内部调用 `return`\
    \ 表达式来获取函数返回值。这样做会停止函数执行并立即返回值。下面的示例展示了如何定义函数：\n\n```\nfunction square ($a)\n\
    {\n    return $a*$a;\n}\n```\n\n# 函数的作用域\n\n每个函数都拥有独立的变量集合。在函数定义外部定义的变量，在函数内部无法访问。运行函数时，其参数也会被定义。在函数内部使用新变量，该变量仅在该函数内部有效，且随函数结束而消失。下面的代码片段演示了这一概念：\n\
    \n```\nfunction example()\n{\n    $favorite_number = 1;\n}\n\n$favorite_number\
    \ = 3;\nexample();\nprint $favorite_number;\n```\n\n调用 `example()` 函数时，函数内部的 `$favorite_number`\
    \ 变量不会影响函数外部声明的同名变量。因此，该片段会在屏幕上输出“3”。\n\n你可能想知道如何从函数外部访问或修改 `$favorite_number`。正如第一章所述，可以使用预装的\
    \ `$GLOBALS[]` 数组来访问脚本中的任意变量。可以将上述脚本重写为：\n\n```\nfunction example()\n{\n    global\
    \ $favorite_number;\n    $favorite_number = 1;\n}\n\n$favorite_number = 3;\nexample();\n\
    print $favorite_number;\n```\n\n运行此代码，屏幕将显示“1”。\n\n此外，`global` 关键字允许指定要访问的全局变量。使用此特性时，系统会将选定的全局变量导入函数的作用域。\n\
    \n# “按值返回”方法\n\n可以使用 `return` 语句从函数获取值。这种语句采用“按值返回”方式。基本上，它会创建相应值的副本并传递给调用者。示例如下：\n\
    \n```\nfunction sample_function($test)\n{\n    return $GLOBALS[$test];\n}\n\n\
    $numeral = 4;\n$sample_value = sample_function(\"numeral\");\nprint $sample_value;\n\
    ```\n\n运行此代码片段将得到“4”。然而，在 `print` 之前修改 `$sample_value` 变量只会影响该变量本身。所做的更改不会影响作为全局变量的\
    \ `$test`。\n\n# “按引用返回”方法\n\n在 PHP 中，也可以通过引用返回值。这意味着你不会得到涉及变量的副本，而是得到该变量的地址。此特性允许从调用作用域修改任何变量。要使用此方法，需要在函数名前和调用者代码中放置\
    \ `&`。以下示例展示了此方法的工作原理：\n\n```\nfunction &sample_function($fruit)\n{\n    return\
    \ $GLOBALS[$fruit];\n}\n\n$favorite_number = 5;\n$sample_value =& sample_function(\"\
    favorite_number\");\nprint $sample_value . \"\\n\";\n$sample_value = 10;\nprint\
    \ $favorite_number;\n```\n\n运行上述代码，屏幕将显示以下数字：\n\n```\n5\n10\n```\n\n你之所以能通过 `$sample_value`\
    \ 修改 `$favorite_number`，是因为前者是后者的活动引用。\n\n> **重要提示**：程序员很少使用此方法，因为它本质上复杂且容易导致\
    \ Bug。\n\n# 如何声明函数参数\n\nPHP 对函数可接受的参数数量没有限制。在 PHP 中，可以通过两种不同方式传递参数。第一种称为“按值传递”，最为常用。第二种称为“按引用传递”。应在定义函数时指定要使用的方法。在函数调用时指定方法会导致运行时错误。\n\
    \n## 按值参数\n\n此方法接受任何 PHP 表达式。程序会计算赋值的表达式，并将其值赋给函数内部的变量。例如，在下面的示例中，`$a` 得到值 6，而\
    \ `$b` 得到另一个变量的值：\n\n```\nfunction sample($a, $b)\n{\n    …\n}\n\nsample(2*3,\
    \ $x);\n```\n\n## 按引用参数\n\n此方法要求使用变量作为参数。函数内部的变量直接引用选定的参数，而不是传递变量的实际值。因此，在函数内部对变量所做的任何修改也会影响函数作用域外的变量。示例如下：\n\
    \n```\nfunction sample(&$a)\n{\n    $a = $a*$a;\n}\n\n$favorite_number = 5;\n\
    sample ($favorite_number);\nprint $favorite_number;\n```\n\n函数参数中 `$a` 前的 `&`\
    \ 符号要求 PHP 使用按引用方法。运行此代码片段，屏幕将显示“25”。\n\n## 默认参数\n\n默认参数允许为函数设置默认值。因此，如果调用时未提供参数，函数将自动获得该参数。在\
    \ PHP 中，设置默认参数需要使用常量值。\n\n示例如下：\n\n```\nfunction increase(&$number, $sample =\
    \ 5)\n{\n    $number += $sample;\n}\n\n$number = 1;\nincrease ($number);\nincrease\
    \ ($number, 2);\n```\n\n# 静态变量\n\n与 C 语言类似，PHP 支持声明静态变量。静态变量在函数调用之间保持不变。但是，只能在包含它们的函数内部使用。可以初始化静态变量。初始化过程在程序到达变量声明时进行一次。\n\
    \n以下代码片段展示了如何声明静态变量：\n\n```\nfunction something_useful()\n{\n    static test =\
    \ true;\n    if (test) {\n        // Run this code once the function is invoked.\n\
    \        …\n    }\n    // Run the main logic of the function each time this function\
    \ is invoked.\n    …\n}\n```\n\n# Chapter 4: Object-Oriented Programming\n\n本章将重点介绍面向对象编程风格。它将教授面向对象模型的基础知识，并提供关于如何创建和控制对象的详细说明。如果你想成为熟练的\
    \ PHP 用户，请仔细学习本材料。\n\n## Objects – The Basics\n\n在 OOP（面向对象编程）中，你将代码和数据组合以创建对象。使用此风格创建的计算机应用程序由不同的对象组成，它们可以相互通信。通常，这些对象是自包含的，并拥有不同的方法和属性。\n\
    \n属性作为对象的数据。因此，它们是所属对象拥有的变量。另一方面，方法是对象支持的函数。\n\n类作为编程对象的模板。它们描述对象将拥有的属性和方法。在下面的示例中，类描述了一个车辆。对于计算机程序中的每个车辆，可以创建一个类的实例来表示该车辆的数据。例如，如果应用程序中的两个车辆名为“Car”和“Motorcycle”，你将创建两个类的实例，并为每个车辆初始化适当的变量。\n\
    \n要初始化变量，需要为这两个车辆调用名为 `setName()` 的方法。交互对象可以利用的成员和方法称为类的“契约”。对于下面的示例，汽车的契约是“get”和“set”方法，即\
    \ `getType()` 和 `setType()`。\n\n```\nClass Vehicle {\n    private $type;\n   \
    \ function setType ($type)\n    {\n        $this→type = $type;\n    }\n    function\
    \ getType()\n    {\n        return $this→type;\n    }\n}\n```\n"
