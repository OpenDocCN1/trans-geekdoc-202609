- raw: "In PHP, you can use classes to declare properties. All of the instances of\
    \ a class have their own copy of the class's properties. However, you can also\
    \ assign static properties to your classes. Unlike a typical property, a static\
    \ property is only available for the class that contains it. Because of this,\
    \ programmers refer to a static property as a “class property.” To define a static\
    \ property, use the following syntax:\n\nclass YourClass {\n\n  static $sampleStaticVariable;\n\
    \n  static $sampleInitializedStaticVariable = 1;\n\n}\n\nWhen accessing a static\
    \ property, you should indicate its name as well as the class it belongs to. Here's\
    \ the syntax:\n\nYourClass: :$sampleInitializedStaticVariable++;\n\nprint MyClass:\
    \ :$sampleInitializedStaticVariable;\n\nYour screen will display “2” if you will\
    \ run the script given above.\n\nIf you want to access a member located inside\
    \ a method of the class, you may specify the property using the “self” prefix.\
    \ This prefix tells PHP that you are referring to the method the property belongs\
    \ to. Check the following syntax:\n\nclass YourClass {\n\n  static $sampleInitializedStaticVariable\
    \ = 1;\n\n  function yourMethod()\n\n  {\n\n    print self: :$sampleInitializedStaticVariable;\n\
    \n  }\n\n}\n\n$object = new yourClass();\n\n$object→ yourMethod();\n\nThis example\
    \ will print “1” on your screen.\n\nThe Static Methods \n\nPHP allows you to declare\
    \ a method as static. Basically, a static method is only available for the class\
    \ that contains it. You can't use the $this variable while dealing with this kind\
    \ of method. Rather, you should use the “self” keyword. Since a static method\
    \ isn't linked to any object, you may call it without generating an instance through\
    \ the “name\\_of\\_class: :method()” syntax. You can also call it within an object's\
    \ instance though “$this→method(). Analyze the following example:\n\nclass Printer\
    \ {\n\n  static function printMessage()\n\n  {\n\n    print “Hi, how are you?”;\n\
    \n    self: :printTabHere();\n\n  }\n\n  static function printTabHere();\n\n \
    \ {\n\n    print “\\\\t”;\n\n  }\n\n}\n\nPrinter: :printMessage();\n\nThis example\
    \ will print “Hi, how are you?” and a tab character on your screen. Although this\
    \ example is a basic one, it shows that you can call a method (i.e. printMessage())\
    \ inside the class even if there's no instance with the class's name. Additionally,\
    \ this example shows how you can use a static method to trigger another method.\n\
    \n## \n\nThe Class Constants \n\nPHP users have used global constants for a long\
    \ time now. You can              define a global constant using “define()”, which\
    \ you've studied back in the first chapter of this book. The current version of\
    \ PHP supports enhanced encapsulation and the definition of constants within classes.\
    \ Just like a static member, a class constant belongs to the class itself. This\
    \ kind of constant is 100% case-sensitive.\n\nThe script given below will show\
    \ you how to declare and access a class constant:\n\nclass ColorEnumeration {\n\
    \n  const YELLOW = “Yellow”;\n\n  const ORANGE = “Orange”;\n\n  const PINK = “Pink”;\n\
    \n  function showPink()\n\n  {\n\n    print self: :PINK;\n\n  }\n\n}\n\nprint\
    \ ColorEnumeration: :YELLOW;\n\n$object = new ColorEnumeration();\n\n$object→showPink();\n\
    \nThis example demonstrates the technique of accessing a class constant both from\
    \ within a method (i.e. using “self”) and through the class's name (i.e. ColorEnumeration).\n\
    \nKeep in mind that you can't change or remove a constant once you have defined\
    \ it. Programmers use constants while working on enumerations or configuration\
    \ values. In these situations, storing data permanently is a must.\n\n## \n\n\
    Cloning an Object \n\nWhile generating a new object, the resulting value serves\
    \ as the handle or identification number of an object. The following code will\
    \ illustrate this idea:\n\n  class YourClass {\n\n    public $sample\\_variable\
    \ = 2;\n\n}\n\n$object\\_1 = new YourClass();\n\n$object\\_2 = $object\\_1;\n\n\
    $object\\_2→sample\\_variable = 3;\n\nprint $object\\_1→sample\\_variable;\n\n\
    Because $object\\_1 is a handle of an object, $object\\_2 will become another\
    \ handle. Thus, if you will change the latter, you will change the object these\
    \ variables are pointing to. If you will run the script given above, your screen\
    \ will show you “3.”\n\nIn some cases, you really need to copy an object. How\
    \ do you accomplish this task? In PHP, you need to use the “clone” construct.\
    \ This pre-installed opemethodrator generates an instance of an object automatically.\
    \ The new instance will have all of the properties of the original object. Additionally,\
    \ you may use the \\_clone() method to perform changes on the new object.\n\n\
    Important Note: Copying a reference results to another reference. You won't get\
    \ an “in-depth” copy from that approach. That means if you will copy a reference\
    \ that points to a different variable, the resulting object will also point to\
    \ that variable.\n\n## \n\nPolymorphism \n\nAccording to some people, polymorphism\
    \ is one of the most crucial aspects of object-oriented programming. Describing\
    \ real-life situations has become simple because you can use inheritance and classes\
    \ in your codes. PHP codes are not just simple collections of data and functions.\
    \ Polymorphism can do a lot of things for you. For example, it can help you complete\
    \ projects by reusing codes or write powerful programs with minimal control statements.\
    \ Analyze the following example:\n\nclass Dog {\n\n  function arf()\n\n  {\n\n\
        print “arf”;\n\n  }\n\n}\n\nclass Bird {\n\n  function tweet()\n\n  {\n\n\
        print “tweet”;\n\n  }\n\n}\n\nfunction giveTheSound($object)\n\n{\n\n  if\
    \ ($object instanceof Dog) {\n\n    $object→arf();\n\n  else if ($object instanceof\
    \ Bird) {\n\n    $object→tweet();\n\n  } else {\n\n    print “The object is invalid”;\n\
    \n  }\n\n  print “\\\\n';\n\n}\n\ngiveTheSound (new Dog ());\n\ngiveTheSound (new\
    \ Bird());\n\nIf you will run this script, you will see the following message\
    \ on your screen:\n\narf\n\ntweet\n\nLet's assume that you need to extend the\
    \ previous example by adding more animals. You'll med to create an “else if” block\
    \ for each new animal. Thus, you'll make a new instance of those animals and write\
    \ more statements to invoke their sounds.\n\nPolymorphism can simplify the task\
    \ given above. Basically, this feature allows you to pass the contents of a class\
    \ to other classes. Here, you can pass the properties and methods of a class to\
    \ the new classes you want to create.\n\nAt this point, you need to create a class,\
    \ name it “Animals”, and establish relationships between this parent class and\
    \ its specific objects. You can perform this inheritance by typing “extends” (i.e.\
    \ another PHP keyword). Here's the syntax:\n\nclass ChildClass extends ParentClass\
    \ {\n\n  …\n\n}\n\nLet's use “inheritance” to rewrite the code given earlier:\n\
    \nclass Animals {\n\n  function giveSound()\n\n  {\n\n  print “The program must\
    \ re-implement this method in  the inheriting classes.”;\n\n  }\n\n}\n\nclass\
    \ Dog extends Animals {\n\n  function giveSound()\n\n  {\n\n    print “arf”;\n\
    \n  }\n\n}\n\nclass Bird extends Animals {\n\n  function giveSound()\n\n  {\n\n\
        print “tweet”;\n\n  }\n\n}\n\nfunction rightSound($object)\n\n{\n\n  if ($object\
    \ instanceof Animals) {\n\n    $object→giveSound();\n\n  } else {\n\n    print\
    \ “The object is invalid”;\n\n  }\n\n  print “\\\\n”\n\nrightSound (new Dog ());\n\
    \nrightSound (new Bird ());\n\nYou'll get the following output:\n\narf\n\ntweet\n\
    \nWith this approach, you don't have to alter “rightSound()” regardless of the\
    \ number of animals you want to add to the code. That's because “instanceof Animals”\
    \ covers any animal that you might add.\n\n# \n\nChapter 5: How to Handle Exceptions\
    \ \n\nProgrammers consider exception handling as the most difficult part of software\
    \ development. In general, errors (e.g. network failure, database failure, program\
    \ bug, etc.) pose serious problems to program developers. For instance, developers\
    \ need to make decisions regarding the errors that occurred, insert checks to\
    \ prevent failure, and invoke the right function to manage it. Additionally, programmers\
    \ need to make sure that their program will work as normal after handling the\
    \ error."
  fmt: "\n# PHP 类与对象进阶\n\n## 静态属性\n\n在 PHP 中，你可以使用类来声明属性。一个类的所有实例都拥有该类属性的各自副本。不过，你也可以为类分配**静态属性**。与普通属性不同，静态属性仅属于包含它的类。因此，程序员将静态属性称为“类属性”。要定义静态属性，请使用以下语法：\n\
    \n```php\nclass YourClass {\n    static $sampleStaticVariable;\n    static $sampleInitializedStaticVariable\
    \ = 1;\n}\n```\n\n访问静态属性时，应指明其名称及所属类。语法如下：\n\n```php\nYourClass::$sampleInitializedStaticVariable++;\n\
    print MyClass::$sampleInitializedStaticVariable;\n```\n\n运行上述脚本，屏幕将显示 `2`。\n\n\
    若要在类的方法内部访问成员，可使用 `self` 前缀指定属性。该前缀告知 PHP 你引用的是该属性所属的方法。语法如下：\n\n```php\nclass\
    \ YourClass {\n    static $sampleInitializedStaticVariable = 1;\n    function\
    \ yourMethod() {\n        print self::$sampleInitializedStaticVariable;\n    }\n\
    }\n$object = new YourClass();\n$object->yourMethod();\n```\n\n此例将在屏幕上输出 `1`。\n\
    \n## 静态方法\n\nPHP 允许将方法声明为静态。从本质上讲，静态方法仅属于包含它的类。处理此类方法时不能使用 `$this` 变量，而应使用 `self`\
    \ 关键字。由于静态方法不与任何对象关联，你可以通过 `ClassName::method()` 语法在无需实例化的情况下调用它。当然，也可以在对象实例中通过\
    \ `$this->method()` 调用。请分析以下示例：\n\n```php\nclass Printer {\n    static function\
    \ printMessage() {\n        print \"Hi, how are you?\";\n        self::printTabHere();\n\
    \    }\n    static function printTabHere() {\n        print \"\\t\";\n    }\n\
    }\nPrinter::printMessage();\n```\n\n此例将在屏幕上输出 `Hi, how are you?` 及一个制表符。尽管这是一个基础示例，但它表明：即使没有类的实例，也可以在类内部通过类名调用方法（即\
    \ `printMessage()`）；此外，还演示了如何使用静态方法触发另一个方法。\n\n## 类常量\n\nPHP 用户早已使用全局常量。你可以使用\
    \ `define()` 定义全局常量（这在本书第一章已学习）。当前 PHP 版本支持增强的封装性以及在类中定义常量。就像静态成员一样，类常量属于类本身。此类常量**完全区分大小写**。\n\
    \n下面的脚本演示如何声明并访问类常量：\n\n```php\nclass ColorEnumeration {\n    const YELLOW = \"\
    Yellow\";\n    const ORANGE = \"Orange\";\n    const PINK = \"Pink\";\n    function\
    \ showPink() {\n        print self::PINK;\n    }\n}\nprint ColorEnumeration::YELLOW;\n\
    $object = new ColorEnumeration();\n$object->showPink();\n```\n\n此例演示了从方法内部（使用\
    \ `self`）和通过类名（即 `ColorEnumeration`）两种方式访问类常量的技巧。\n\n请记住：一旦定义了常量，就无法更改或删除它。程序员在处理枚举或配置值时会使用常量。在这些场景下，永久存储数据是必须的。\n\
    \n## 克隆对象\n\n创建新对象时，返回的值作为该对象的句柄或标识号。以下代码说明了这一概念：\n\n```php\nclass YourClass {\n\
    \    public $sample_variable = 2;\n}\n$object_1 = new YourClass();\n$object_2\
    \ = $object_1;\n$object_2->sample_variable = 3;\nprint $object_1->sample_variable;\n\
    ```\n\n因为 `$object_1` 是一个对象的句柄，`$object_2` 将成为另一个句柄。因此，修改后者将会修改这些变量所指向的同一个对象。运行上述脚本，屏幕将显示\
    \ `3`。\n\n在某些情况下，你确实需要复制一个对象。如何完成此任务？在 PHP 中，需要使用 `clone` 结构。这个预装的操作符会自动生成一个对象的实例。新实例将拥有原对象的所有属性。此外，你可以使用\
    \ `__clone()` 方法对新对象执行修改。\n\n> **重要提示**：复制引用会产生另一个引用。这种方式无法获得“深度”复制。这意味着，如果你复制一个指向另一个变量的引用，生成的对象也将指向该变量。\n\
    \n## 多态\n\n有人认为多态是面向对象编程最关键的方面之一。由于可以在代码中使用继承和类，描述现实场景变得简单。PHP 代码不再只是数据和函数的简单集合。多态能为你做很多事。例如，它可以帮助你通过复用代码完成项目，或以最少的控制语句编写强大的程序。请分析以下示例：\n\
    \n```php\nclass Dog {\n    function arf() {\n        print \"arf\";\n    }\n}\n\
    class Bird {\n    function tweet() {\n        print \"tweet\";\n    }\n}\nfunction\
    \ giveTheSound($object) {\n    if ($object instanceof Dog) {\n        $object->arf();\n\
    \    } else if ($object instanceof Bird) {\n        $object->tweet();\n    } else\
    \ {\n        print \"The object is invalid\";\n    }\n    print \"\\n\";\n}\n\
    giveTheSound(new Dog());\ngiveTheSound(new Bird());\n```\n\n运行此脚本，屏幕将显示：\n\n```\n\
    arf\ntweet\n```\n\n假设你需要通过添加更多动物来扩展上例。你需要为每种新动物创建一个 `else if` 块。因此，你要创建这些动物的新实例并编写更多语句来调用它们的声音。\n\
    \n多态可以简化上述任务。从本质上讲，此特性允许你将一个类的内容传递给其他类。在这里，你可以将一个类的属性和方法传递给你想创建的新类。\n\n此时，你需要创建一个名为\
    \ `Animals` 的类，并建立这个父类与其具体对象之间的关系。可以通过输入 `extends`（即另一个 PHP 关键字）来执行此继承。语法如下：\n\
    \n```php\nclass ChildClass extends ParentClass {\n    // ...\n}\n```\n\n让我们使用“继承”重写前面的代码：\n\
    \n```php\nclass Animals {\n    function giveSound() {\n        print \"The program\
    \ must re-implement this method in the inheriting classes.\";\n    }\n}\nclass\
    \ Dog extends Animals {\n    function giveSound() {\n        print \"arf\";\n\
    \    }\n}\nclass Bird extends Animals {\n    function giveSound() {\n        print\
    \ \"tweet\";\n    }\n}\nfunction rightSound($object) {\n    if ($object instanceof\
    \ Animals) {\n        $object->giveSound();\n    } else {\n        print \"The\
    \ object is invalid\";\n    }\n    print \"\\n\";\n}\nrightSound(new Dog());\n\
    rightSound(new Bird());\n```\n\n输出如下：\n\n```\narf\ntweet\n```\n\n采用这种方法，无论你想向代码中添加多少动物，都无需修改\
    \ `rightSound()`。因为 `instanceof Animals` 涵盖了你可能添加的任何动物。\n\n# 第 5 章：如何处理异常\n\n\
    程序员认为异常处理是软件开发中最困难的部分。通常，错误（如网络故障、数据库故障、程序 Bug 等）给程序开发人员带来严重问题。例如，开发人员需要针对发生的错误做出决策、插入检查以防止故障、并调用正确的函数进行管理。此外，程序员还需要确保程序在处理错误后能正常工作。\n"
