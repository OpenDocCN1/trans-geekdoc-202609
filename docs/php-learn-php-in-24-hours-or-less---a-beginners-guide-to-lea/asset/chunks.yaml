    \ \"C\" Method** (e.g. `/* */`) - This method is taken from the C language. This\
    \ option allows you to create multi-line comments. For instance:\n    ```php\n\
    \    /* This comment\n    spans\n    multiple lines. */\n    ```\n*   **The \"\
    C++\" Method** (i.e. `//`) - Use this method when writing a single-line comment.\
    \ Here's an example:\n    `// This is a sample.`\n\n## Variables\n\nThe variables\
    \ used in PHP are different from those of compiled languages (e.g. C, C++, Java,\
    \ etc.). This difference lies in the fact that PHP variables are \"weakly typed.\"\
    \ Simply put, PHP allows you to use variables even without prior declaration.\
    \ You don't have to declare variables explicitly or assign their type. Thus, you\
    \ can change the data type of your variables whenever you want.\n\nIn the PHP\
    \ language, you should introduce your variables using the dollar sign (i.e. `$`).\
    \ You can use letters, numbers, and underscores when naming your variables. However,\
    \ you can't use a number as the first character of a variable's name. That means\
    \ `$one_apple` is valid while `$1_apple` isn't.\n\nAs mentioned earlier, PHP lets\
    \ you use undeclared variables. The examples given below will illustrate this\
    \ idea:\n\n```php\n$PI = 3.14159;\n$radius = 10;\n```\n\nThis code created two\
    \ variables without declaring their data type. Here, \"PI\" belongs to the floating-point\
    \ type while \"radius\" belongs to the integer type.\n\n**Important Note:** The\
    \ PHP language is not compatible with global variables. Each variable is local\
    \ to its scope. If it is created within a function, it will disappear once the\
    \ function no longer exists.\n\n### Indirect Reference\n\nPHP allows you to access\
    \ a variable using indirect reference. That means you can generate and access\
    \ a variable by name during runtime. Analyze this example:\n\n```php\n$car = \"\
    BMW\";\n$$car = \"Z4\";\nprint $car;\n```\n\nYour screen will display \"Z4\" if\
    \ you will run this code snippet. The second line of this code accesses the variable\
    \ named \"car\" and changes its value. As you can see, that line has an extra\
    \ dollar sign. That sign tells the PHP interpreter that you are referring to the\
    \ value contained by the variable involved. In this example, a new variable named\
    \ \"Z4\" is generated.\n"
  trans: "\n\n# PHP：24 小时或更短时间学会 PHP\n\n## 立即学习 PHP 编程的初学者指南\n\n# 简介\n\n本书将为您提供学习\
    \ PHP 语言基础的详细指导。\n\n这本电子书将解释什么是 PHP，以及它如何帮助您构建 Web 应用程序。除了提供理论解释外，本书还将为您提供实际代码和实用示例。即使您以前从未编程过，也能快速学会这门计算机语言。如果您正在寻找一本全面的\
    \ PHP 参考书，这就是您需要的书。\n\n阅读本书后，您将能够：\n\n*   学习 PHP 的基本要素\n*   了解编写 PHP 脚本时应使用的语法\n\
    *   创建您自己的变量和常量\n*   调用 PHP 的内置方法和函数\n*   在 Web 应用程序中处理错误和异常\n*   安全地接收和存储用户输入\n\
    *   掌握 OOP（即面向对象编程）的基础知识\n*   创建类和子类\n*   了解 PHP 与 MySQL 之间的连接\n\nPHP 是一门优秀的脚本语言。它可以帮助您创建健壮的网站和\
    \ Web 应用程序。如果您想在短短 24 小时内成为高效的 PHP 用户，请仔细阅读本书。\n\n让我们开始这段旅程吧。\n\n# 第 1 章：PHP –\
    \ 基础知识\n\nPHP 语言（即 PHP：Hypertext Processor，超文本预处理器）从其他编程语言（如 C、Perl、Java 等）借用了一些语法。人们认为\
    \ PHP 是一种混合型计算机语言，它吸收了其他语言的最佳功能，形成了一种强大且直观的脚本语言。\n\n在本章中，您将了解 PHP 的基本方面，如变量、注释和语言结构。如果您想成为一名高效的\
    \ PHP 用户，请仔细阅读本章内容。\n\n## HTML 嵌入\n\n您将使用 PHP 创建动态网页。因此，您应该知道如何将其嵌入到最流行的脚本语言中：HTML（即\
    \ HyperText Markup Language，超文本标记语言）。请查看以下代码：\n\n```html\n<HTML>\n<HEAD> This\
    \ is a sample. </HEAD>\n<BODY>\nThis code wants to greet you:\n<?php\n  print\
    \ \"Hi, how are you?\";\n?>\n</BODY>\n</HTML>\n```\n\n此示例向您展示了如何将 PHP 片段嵌入 HTML\
    \ 代码中。每当语言解释器遇到 PHP 的“开始”标签（即 `<?php`）时，它就会执行嵌入的代码，直到遇到“结束”标签（即 `?>`）。在这里，PHP\
    \ 将用适当的输出（如果有）替换 PHP 片段，并将非 PHP 代码（如 HTML）传递给用户的网站客户端。如果您运行上述代码，屏幕将显示如下内容：\n\n\
    ```html\n<HTML>\n<HEAD> This is a sample. </HEAD>\n<BODY>\nThis code wants to\
    \ greet you:\nHi, how are you?\n</BODY>\n</HTML>\n```\n\n## 注释\n\n您还需要学习如何向 PHP\
    \ 代码添加注释。作为一名程序员，您将使用注释为您的工作添加细节和描述，而不影响其输出和行为。PHP 语言支持三种注释方法。这些方法包括：\n\n*   **“Shell”方法**（即\
    \ `#`） - 在此方法中，您将使用井号符号开始注释。此符号仅适用于单行注释。例如：\n    `# This comment is awesome.`\n\
    *   **“C”方法**（如 `/* */`） - 此方法源自 C 语言。此选项允许您创建多行注释。例如：\n    ```php\n    /* This\
    \ comment\n    spans\n    multiple lines. */\n    ```\n*   **“C++”方法**（即 `//`）\
    \ - 编写单行注释时使用此方法。示例如下：\n    `// This is a sample.`\n\n## 变量\n\nPHP 中使用的变量不同于编译型语言（如\
    \ C、C++、Java 等）中的变量。这种差异在于 PHP 变量是“弱类型”的。简单来说，PHP 允许您在无需预先声明的情况下使用变量。您不必显式声明变量或指定其类型。因此，您可以随时更改变量的数据类型。\n\
    \n在 PHP 语言中，您应使用美元符号（即 `$`）引入变量。命名变量时可以使用字母、数字和下划线。但是，不能使用数字作为变量名的第一个字符。这意味着 `$one_apple`\
    \ 是有效的，而 `$1_apple` 则无效。\n\n如前所述，PHP 允许您使用未声明的变量。下面给出的示例将说明这一概念：\n\n```php\n$PI\
    \ = 3.14159;\n$radius = 10;\n```\n\n这段代码在未声明数据类型的情况下创建了两个变量。在这里，“PI”属于浮点类型，而“radius”属于整数类型。\n\
    \n**重要提示：** PHP 语言不兼容全局变量。每个变量均局限于其作用域。如果在函数内部创建，一旦该函数不再存在，该变量就会消失。\n\n### 间接引用\n\
    \nPHP 允许您使用间接引用访问变量。这意味着您可以在运行时通过名称生成并访问变量。分析以下示例：\n\n```php\n$car = \"BMW\";\n\
    $$car = \"Z4\";\nprint $car;\n```\n\n如果您运行此代码片段，屏幕将显示“Z4”。这段代码的第二行访问了名为“car”的变量并更改了其值。正如您所见，该行多了一个美元符号。该符号告诉\
    \ PHP 解释器，您引用的是所涉变量所包含的值。在本例中，生成了一个名为“Z4”的新变量。\n\n"
