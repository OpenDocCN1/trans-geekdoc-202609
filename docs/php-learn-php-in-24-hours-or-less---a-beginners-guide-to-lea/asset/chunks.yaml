    \n# 析构函数\n\n析构函数与构造函数相反。程序员调用它来销毁一个对象（例如当对象的引用不再存在时）。然而，由于 PHP 语言在结束每个请求时都会释放所有系统资源，因此析构函数的用处受到严重限制。你可以利用它们在销毁对象时刷新资源或记录数据。\n\
    \n只有在以下情况下才能调用析构函数：\n\n1.  你正在执行脚本，并且已经销毁了对某个对象的所有引用。\n2.  当应用程序到达脚本末尾且 PHP 终止请求时。\n\
