  trans: "\n\n# 在面向对象编程中，多态性和基类利用发挥着重要作用\n\n基类包含子类，有时需要创建具体的实例。在 PHP 中，程序员使用一种称为“工厂”的设计模式来创建所需的子类。工厂类具有一个接受输入的方法。根据提供的输入，这些类将决定生成哪种类型的实例（通常是子类）。\n\
    \n假设您的网站允许不同类型的用户登录。其中一些人是访客，一些是客户，还有一些是管理员。在这种情况下，大多数程序员将创建一个基类和三个子类。您可以将基类命名为\
    \ `Users`。然后，您可以将子类命名为 `Visitors`、`Customers` 和 `Admins`。基类及其所有子类将包含收集用户相关数据的方法（例如用户的个人偏好以及他/她可以访问的在线资源）。\n\
    \n您可以在任何可能的情况下使用 `Users` 基类来创建一个健壮的网站。这样，您可以泛化您的源代码，并简化新用户类型的添加。\n\n# 观察者模式\n\n\
    使用 PHP 创建的程序会操作信息。在大多数情况下，对某条信息的修改会影响程序源代码的不同部分。例如，如果一位来自亚洲的客户访问 eBay 的美国站点，汇率将影响他/她屏幕上看到的价格。\n\
    \n假设每个编程对象代表一个 eBay 产品。代码中使用的对象直接来自 eBay 的数据库。另一方面，汇率可能来自外部数据源，且不保存在数据库中。每个对象都包含\
    \ `display()` 方法，该方法返回与产品相关的 HTML 内容。\n\n“观察者”设计模式允许对象注册以接收特定信息和/或事件。当信息发生变化或事件发生时，PHP\
    \ 将通知已注册的对象。通过这种方法，您可以将产品项标记为汇率的观察者。此外，您可以在打印项目列表之前，更新已注册编程对象关于汇率的信息。这意味着每个对象都可以更新自身，并在其\
    \ `display()` 方法中包含新信息。\n\n通常，PHP 用户通过一个称为“观察者”的接口来实现观察者模式。需要充当观察者的类应实现此接口。\n\n\
    一个“可观察”对象通常有一个名为 `register` 的方法，它允许“观察者”（即接口）自动注册。\n\n# 第 7 章：使用 PHP 创建应用程序\n\n\
    人们使用 PHP 构建网站。这种计算机语言允许程序员制作动态 Web 应用程序。动态应用程序通过 HTML 表单从用户处收集数据。从用户处获得并保存在网站中的数据是机密的，这使得安全性成为一个严重的关注点。PHP\
    \ 语言具有允许您安全获取和存储数据的功能。PHP 拥有您所需的一切：您只需利用该语言提供的功能来开发应用程序。在本章中，您将学习如何使用 PHP 构建动态\
    \ Web 应用程序。\n\n## PHP 和 HTML\n\n您不必将 PHP 代码嵌入 HTML 文件中。您始终可以生成不包含任何 HTML 元素的 PHP\
    \ 文件。然而，在创建 Web 应用程序时，您很可能会在单个文件中结合使用这两种语言。计算机专家说 PHP 是为网站而创建的，用作 HTML 文档的模板。一旦您向文件中添加\
    \ PHP，该文件将获得 “.php” 或 “.php5” 作为其扩展名。\n\n下面的代码展示了如何结合 PHP 和 HTML：\n\n```html\n\
    <html>\n<head><title>First Sample</title></head>\n<body>\n<?php\n  // This code\
    \ has a data-based “if” statement.\n  if (date('md' == '1225')) {\n    echo 'Merry\
    \ Christmas '\n      'and Happy New Year';\n  } else {\n    echo 'Hi, how are\
    \ you?';\n  }\n?>\n</body>\n</html>\n```\n\n在本例中，`<?php` 部分标志着嵌入式 PHP 代码的开始。另一方面，`?>`\
    \ 部分表示 PHP 代码的结束。您可能注意到，此示例通过 `echo` 发送输出。如果您处理的是如上所示的简单代码，这种方法是可以接受的。但是，如果您在包含单引号/双引号的字符串上使用\
    \ `echo`，您的代码将变得极其复杂。\n\n如果回显的文本是链接（例如 `<a href='https…'>`），此示例将导致错误。这是因为回显文本中的引号将与包围字符串的引号发生冲突。在这种情况下，您可以在处理文本输出前结束\
    \ PHP 部分。然后，在终止“if”语句的代码之前重新开始。这是一个例子：\n\n```html\n<html>\n<head><title>Second\
    \ Sample</title></head>\n<body>\n<?php\n  // This code contains a date-based “if”\
    \ statement.\n  if (date('md' == '1225')) {\n    echo 'Merry Christmas and ' .\
    \ \n      'Happy New Year!';\n  } else {\n    echo 'Hi, how are you?';\n  }\n\
    ?>\n</body>\n</html>\n```\n\n这种编写代码的风格令人困惑。它违反了一个重要的编程原则：“不要混合内容和逻辑。” 下面给出的嵌入风格使用变量来存储字符串并回显该变量：\n\
    \n```php\n<?php\n  // This code contains a date-based “if” statement.\n  if (date\
    \ ('md' == '1225') ) {\n    $message = 'Merry Christmas and Happy New Year!”;\n\
    \  } else {\n    $message =   'Hi, how are you?';\n  }\n?>\n\n<html>\n<head><title>Third\
    \ Sample</title></head>\n<body>\n<?php echo $message; ?>\n</body>\n</html>\n```\n\
    \n## 用户输入\n\n在学习如何在 HTML 文件中包含 PHP 之后，您应该知道如何设置用户指定的操作。例如，一个在线书店需要注册和登录系统。显然，用户需要执行一个操作（例如输入登录凭据）才能“进入”在线商店。这种类型的系统需要基于\
    \ HTML 的表单和一个存储来保存收集到的数据。\n\n对于此示例，您在注册过程中需要从每个用户那里获取几项信息。这些是：姓名、密码和电子邮件地址。分析以下\
    \ HTML 代码：\n\n```html\n<html>\n<head><title>Sign up</title></head>\n<body>\n \
    \ <h1>Register Here</h1>\n  <form method=”get” action=”signup.php”>\n    <table>\n\
    \    <tr><td>Email Address:</td>\n      <td><input type='text' name='email address'/>\
    \ </td></tr>\n    <tr><td>Name:</td>\n      <td><input type='text' name='first\\\
    _last\\_name'/></td></tr>\n    <tr><td>Desired Password:</td>\n      <td><input\
    \ type='password' name='desiredpassword'/></td></tr>\n    <tr>\n      <td colspan\
    \ ='3'>\n      <input type='submit' name='signup' value='Sign up'/>\n      </td>\n\
    \    </tr>\n    </table>\n  </form>\n</body>\n</html>\n```\n\n## 如何安全地处理用户输入\n\
    \n不要信任任何人，特别是使用您网站的人。人们会做出意想不到的事情，无论是意外还是故意。这意味着他们可能会发现您网站中的 Bug 或漏洞。本书的这一部分将讨论可能发生在您网站上的问题。然后，它将讨论您可以用来解决此类问题的技术。\n\
    \n### 常见错误\n\n程序员有时会犯错。如果您订阅与安全相关的电子邮件列表，您会发现每周都有新的 PHP 程序弱点。让我们讨论一些与 PHP 相关的最常见错误：\n\
    \n*   **全局变量** – 在某些情况下，程序开发人员未能正确初始化全局变量。您可以通过将 `register_globals` 指令设置为 “off”\
    \ 来防止此错误。然而，此问题仍可能发生，因此您需要小心。`register_globals` 为开启的用户可能会滥用您的网站应用程序。例如，客户可能仅通过在您的网站上运行任意代码就获得系统的管理员级访问权限。\n\
    \n"
