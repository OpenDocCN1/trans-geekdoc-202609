    # MySQL Improved (mslqi) 简介


    在接下来的页面中，您将了解 **mslqi**（即 MySQL Improved）。此 MySQL 扩展随最新版本的 PHP 一同提供。


    ## MySQL 更多信息


    ### 优点


    *   **流行** – MySQL 在数据库管理行业拥有最大的市场份额。几乎所有的托管服务提供商都提供 MySQL 访问权限。此外，您可以轻松找到关于 MySQL
    的阅读材料。这意味着您可以快速、轻松地获取并学习该数据库管理系统。

    *   **直观** – 一旦建立起 MySQL 数据库，管理数据就会变得简单直接。管理员应配置数据库的初始访问权限。因此，如果您要与他人共享数据库，需要先授予他们
    MySQL 的访问权限。

    *   **免费** – 该数据库管理系统是开源的。这意味着您无需花费任何费用即可使用它。


    ### 缺点


    *   **可能需要购买许可证** – 如果您计划将 MySQL 与任何闭源软件捆绑在一起，则应购买商业许可证。


    ## 数据库查询


    MySQL 支持两种查询：(1) 缓冲查询 和 (2) 非缓冲查询。让我们详细讨论这些查询：


    ### 缓冲查询


    缓冲查询会检索结果并将其存储在客户端机器上。如果用户运行后续查询，其请求将首先经过本地机器的内存。


    缓冲查询的主要优势在于您可以在其中进行搜索。这意味着您可以根据需要控制结果集中的行指针（考虑到信息存储在本地机器上）。其主要缺点是结果需要额外的内存。


    ### 非缓冲查询


    非缓冲查询不允许您移动其行指针。因此，您必须遵循搜索结果的确切顺序。这种查询提供的优势是不需要过多的存储空间。一旦 MySQL 服务器开始返回数据行，您就可以收集并处理它们。在使用非缓冲查询的结果时，您应使用
    `mysqli_fetch_row()` 获取所有行，或使用 `mysqli_free_result()` 释放它们。在您发出这些命令之一之前，服务器不会响应您的请求。


    您应使用的查询类型取决于您的具体情况。在处理巨大的结果集时，非缓冲查询可节省大量计算机内存。如果您不需要对搜索结果进行排序，即使 MySQL 仍在运行查询，您也能通过
    PHP 看到结果的初始行。缓冲查询因其强大的搜索功能而十分方便，能显著提高您的工作效率。由于单个查询完成得很快，MySQL 会立即耗尽结果并将其存储在本地机器上，而不是在处理
    PHP 代码的同时运行搜索。


    在使用 MySQL 并分析结果后，您将知道应使用哪种类型的查询。


    > **重要提示**：运行非缓冲查询时需格外小心。请记住，在您获取或释放当前结果之前，服务器将忽略您的请求。因此，在向服务器发送任何命令之前，您需要发出 `mysqli_fetch_row()`
    或 `mysqli_free_result()`。


    ## 结语


    希望本书能帮助您在短短 24 小时内掌握 PHP 脚本语言的基础知识。您在本书中阅读的代码、说明和解释，已为您在自己的网站和应用程序中使用 PHP 做好了准备。如果您应用本书学到的知识，将很快成为一名熟练的
    PHP 用户。


    下一步是阅读更多关于 PHP 的书籍，并继续编写自己的代码。请记住，编程是一项复杂的活动。您需要从不同来源获取知识，才能成为一名优秀的程序员。通过阅读更多书籍和练习技能，您将能极大地提升编程能力。


    祝您好运！


    Robert Dwight

    '
