    if ($sample < 0 {\n\n  print '$sample is a negative integer';\n\n} elseif ($sample\
    \ == 0) {\n\n  print 'sample is equal to zero';\n\n} elseif ($sample > 0 {\n\n\
      print '$sample is a positive integer';\n\n}\n\nThe “switch” Statement \n\nThe\
    \ syntax of a switch statement is:\n\nswitch (expression) {\n\n  case expression:\n\
    \n    statement/s\n\n  case expression:\n\n    statement/s\n\n  …\n\n  default:\n\
    \n    statement/s\n\n}\n\nProgrammers use switch statements to replace complicated\
    \ if-elseif statements. Switch statements compare an expression against all of\
    \ the possible entries inside their body. If they don't find an exact match, the\
    \ program will run the “default” clause and ignore the rest of the statement.\
    \ In PHP, you may use a “break” statement to terminate the code's execution and\
    \ pass the control to the succeeding scripts. Most programmers place the break\
    \ statement at the last part of the switch structure. Analyze the following example:\n\
    \nswitch ($solution) {\n\n  case 'x':\n\n  case 'x':\n\n    print “The solution\
    \ is correct\\\\n”;\n\n    break;\n\n  case 'u':\n\n  case 'U':\n\n    print “The\
    \ solution is incorrect\\\\n”;\n\n  break;\n\n  default:\n\n    print “Error:\
    \ The system doesn't recognize the solution\\\\n”;\n\n    break;\n\n}\n\n## \n\
    \nThe Loop Structures \n\nYou can use loop structures to repeat certain processes\
    \ in your PHP scripts. For instance, you can use a “loop” to submit the results\
    \ of a query multiple times. In this part of the book, you'll learn about the\
    \ loop structures supported by the PHP language:\n\nThe “while” Loop\n\nWhen writing\
    \ a “while” loop, you should use the following syntax:\n\nwhile (expression)\n\
    \n  statement/s\n\nMost programmers consider “while” loops as the simplest type\
    \ of loops in any language. At the start of each repetition, the program will\
    \ evaluate the loop's truth expression. If the expression's result is true, the\
    \ loop will run all the statements inside it. If the result is false, however,\
    \ the loop will end and pass the program control to the statements after it.\n\
    \nThe “break” and “continue” Clauses \n\nIn PHP, “break” clauses and “continue”\
    \ clauses require the following syntax:\n\nbreak;\n\nbreak expression;\n\ncontinue;\n\
    \ncontinue expression;\n\nThere are times when you need to end the loop during\
    \ an iteration. Because of this, PHP offers “break” statements. If a break statement\
    \ appears as a single line (i.e. break;), the program will affect the innermost\
    \ loop. You can specify the maximum levels you want to work on by setting an argument\
    \ for your “break” clause. Here's the syntax:\n\nbreak x;\n\nThe “do… while” Loop\
    \ \n\nThis is the syntax that you should use while writing a “do… while” loop.\n\
    \ndo\n\n  statement/s\n\nwhile              (expression);\n\nA “do… while” loop\
    \ is like an ordinary “while” loop. The only difference is that a “do… while”\
    \ loop checks its truth expression before ending each iteration. Basically, this\
    \ kind of loop makes sure that your statement/s will run at least once, regardless\
    \ of the truth expression's value.\n\nProgrammers use “do… while” loops to terminate\
    \ code blocks upon satisfying a predetermined condition. Here's an example:\n\n\
    do {\n\n  statement/s\n\n  if ($sample) {\n\n    break;\n\n  }  statement/s\n\n\
      } while (false);\n\nSince a “do… while” loop run at least once, the statement\
    \ or statements you place inside this loop will run once only. Additionally, the\
    \ value of its truth expression always evaluates to false. PHP allows you to place\
    \ break clauses inside a “do… while” loop to terminate its execution anytime.\
    \ Obviously, you may use this kind of loop to facilitate typical reiteration processes.\n\
    \nThe “for” Loop \n\nThe “for” loop of PHP is similar to that of the C language.\
    \ This kind of loop takes three parameters:\n\nfor (start\\_expression; truth\\\
    _expression; increment\\_expression)\n\nUsually, programmers use a single expression\
    \ for each part of the loop (i.e. truth, start, and increment). Thus, you can\
    \ use the following syntax to create a basic “for” loop:\n\nfor (expression; expression;\
    \ expression)\n\nstatement/s\n\nThe PHP interpreter evaluates the “start\\_expression”\
    \ once. This expression initializes the control variable of the loop it belongs\
    \ to. The element named “truth\\_expression”, meanwhile, runs at the start of\
    \ each loop iteration. All of the statements within the “for” loop will run if\
    \ truth\\_expression evaluates to true; if it evaluates to false, the loop will\
    \ end. The interpreter checks the increment\\_expression before ending each iteration.\
    \ Programmers use the increment\\_expression to adjust the value of the loop's\
    \ control variable.\n\nYou can include “continue” and “break” statements in your\
    \ “for” loops. Keep in mind that “continue” forces the PHP interpreter to evaluate\
    \ “increment\\_expression” before checking “truth\\_expression.” The following\
    \ example will show you how a “for” loop works:\n\nfor ($x = 0; $x < 5; $x++)\
    \ {\n\n  print “The square of this variable is “ . $x\\*$x . “\\\\n”;\n\n}\n\n\
    Just like C, PHP allows you to provide multiple expressions for each argument\
    \ of the loop. You just have to delimit those expressions using commas. If you\
    \ will use this option, each argument will take the value of its rightmost expression.\n\
    \nAdditionally, you don't have to provide arguments for your “for” loops. The\
    \ interpreter will just assume that the missing arguments evaluate to true. For\
    \ instance, the code snippet given below will run continuously:\n\nfor ( ; ; )\
    \ {\n\n  print “This loop is infinite\\\\n”;\n\n}\n\n## \n\nThe Code Inclusion\
    \ Structures \n\n You can use a code inclusion structure to organize the source\
    \ of your programs. Aside from turning your complex codes into manageable blocks,\
    \ a code inclusion structure can help you apply your codes on other PHP projects.\n\
    \nThe “include” Statement\n\nJust like other computer languages, PHP supports\
    \ the usage of an “include” statement to divide codes into several files. Dividing\
    \ your source code into different files is often useful for “code recycling” (i.e.\
    \ using the same code on different scripts) or attaining code readability. Whenever\
    \ you execute this statement, PHP will read a file, compile it into workable code,\
    \ and run it.\n\nThe behavior of this statement is similar to that of a function.\
    \ Keep in mind, however, that “include” is a pre-installed construct of the PHP\
    \ language. When writing an “include” statement, you should use the following\
    \ syntax:\n\ninclude name\\_of\\_file;\n\nThe examples given below will show you\
    \ how to write an “include” statement:\n\n*   error\\_files.php\n\n    <?php\n\
    \n      $system\\_ok = 1;\n\n      $system\\_error = 0;\n\n    ?>\n\n*   check.php\n\
    \n    <?php\n\n      include “error\\_files.php”;\n\n      print ('The variable\
    \ named $system\\_error holds ' . “$system\\_error\\\\n”);\n\n    ?>\n\nIf you\
    \ will run this script, your screen will show you the following message:\n\n“The\
    \ variable named $system\\_error holds 0”\n\nThe eval() Function\n\nThis function\
    \ is similar to the “include” statement. However, rather than compiling and running\
    \ codes from a PHP file, it treats codes as basic strings. This feature can help\
    \ you run dynamically generated codes or manually retrieve codes from external\
    \ sources. You should know that using eval() is more complex than writing codes\
    \ manually. Thus, it would be best if you'll avoid using this function.\n\n# \n\
    \nChapter 3: The Functions of PHP \n\nPHP supports built-in and user-defined functions.\
    \ All PHP functions respond to the following call:\n\nfunc (argument\\_1, argument\\\
    _2, argument\\_3, …)\n\nThe arguments that you can include in a call depends on\
    \ the function you're using. You may use any PHP expression as an argument. Actually,\
    \ you can also tag other function calls as arguments. Here is one of the built-in\
    \ functions of this language:\n\n$sample = strlen(“elephant”);\n\nThe strlen()\
    \ function accepts a string and returns its length. Thus, the variable named $sample\
    \ will get 8 as its length, since “elephant” is eight characters long.\n\n## \n\
    \nThe User-Defined Functions "
  fmt: "\n# PHP Control Structures and Functions\n\n## The “elseif” Construct\n\n\
    You can use an “elseif” construct to perform a sequence of conditional assessments\
    \ and only run the code under the first satisfied condition. For instance:\n\n\
    ```\nif ($sample < 0) {\n    print '$sample is a negative integer';\n} elseif\
    \ ($sample == 0) {\n    print 'sample is equal to zero';\n} elseif ($sample >\
    \ 0) {\n    print '$sample is a positive integer';\n}\n```\n\n## The “switch”\
    \ Statement\n\nThe syntax of a `switch` statement is:\n\n```\nswitch (expression)\
    \ {\n    case expression:\n        statement/s\n    case expression:\n       \
    \ statement/s\n    …\n    default:\n        statement/s\n}\n```\n\nProgrammers\
    \ use `switch` statements to replace complicated `if-elseif` statements. `switch`\
    \ statements compare an expression against all of the possible entries inside\
    \ their body. If they don't find an exact match, the program will run the “default”\
    \ clause and ignore the rest of the statement. In PHP, you may use a `break` statement\
    \ to terminate the code's execution and pass the control to the succeeding scripts.\
    \ Most programmers place the `break` statement at the last part of the `switch`\
    \ structure. Analyze the following example:\n\n```\nswitch ($solution) {\n   \
    \ case 'x':\n    case 'X':\n        print \"The solution is correct\\n\";\n  \
    \      break;\n    case 'u':\n    case 'U':\n        print \"The solution is incorrect\\\
    n\";\n        break;\n    default:\n        print \"Error: The system doesn't\
    \ recognize the solution\\n\";\n        break;\n}\n```\n\n## The Loop Structures\n\
    \nYou can use loop structures to repeat certain processes in your PHP scripts.\
    \ For instance, you can use a “loop” to submit the results of a query multiple\
    \ times. In this part of the book, you'll learn about the loop structures supported\
    \ by the PHP language:\n\n### The “while” Loop\n\nWhen writing a “while” loop,\
    \ you should use the following syntax:\n\n```\nwhile (expression)\n    statement/s\n\
    ```\n\nMost programmers consider “while” loops as the simplest type of loops in\
    \ any language. At the start of each repetition, the program will evaluate the\
    \ loop's truth expression. If the expression's result is true, the loop will run\
    \ all the statements inside it. If the result is false, however, the loop will\
    \ end and pass the program control to the statements after it.\n\n### The “break”\
    \ and “continue” Clauses\n\nIn PHP, “break” clauses and “continue” clauses require\
    \ the following syntax:\n\n```\nbreak;\nbreak expression;\ncontinue;\ncontinue\
    \ expression;\n```\n\nThere are times when you need to end the loop during an\
    \ iteration. Because of this, PHP offers `break` statements. If a `break` statement\
    \ appears as a single line (i.e. `break;`), the program will affect the innermost\
    \ loop. You can specify the maximum levels you want to work on by setting an argument\
    \ for your `break` clause. Here's the syntax:\n\n```\nbreak x;\n```\n\n### The\
    \ “do… while” Loop\n\nThis is the syntax that you should use while writing a “do…\
    \ while” loop.\n\n```\ndo\n    statement/s\nwhile (expression);\n```\n\nA “do…\
    \ while” loop is like an ordinary “while” loop. The only difference is that a\
    \ “do… while” loop checks its truth expression before ending each iteration. Basically,\
    \ this kind of loop makes sure that your statement/s will run at least once, regardless\
    \ of the truth expression's value.\n\nProgrammers use “do… while” loops to terminate\
    \ code blocks upon satisfying a predetermined condition. Here's an example:\n\n\
    ```\ndo {\n    statement/s\n    if ($sample) {\n        break;\n    }\n    statement/s\n\
    } while (false);\n```\n\nSince a “do… while” loop runs at least once, the statement\
    \ or statements you place inside this loop will run once only. Additionally, the\
    \ value of its truth expression always evaluates to false. PHP allows you to place\
    \ `break` clauses inside a “do… while” loop to terminate its execution anytime.\
    \ Obviously, you may use this kind of loop to facilitate typical reiteration processes.\n\
    \n### The “for” Loop\n\nThe “for” loop of PHP is similar to that of the C language.\
    \ This kind of loop takes three parameters:\n\n```\nfor (start_expression; truth_expression;\
    \ increment_expression)\n```\n\nUsually, programmers use a single expression for\
    \ each part of the loop (i.e. truth, start, and increment). Thus, you can use\
    \ the following syntax to create a basic “for” loop:\n\n```\nfor (expression;\
    \ expression; expression)\n    statement/s\n```\n\nThe PHP interpreter evaluates\
    \ the `start_expression` once. This expression initializes the control variable\
    \ of the loop it belongs to. The element named `truth_expression`, meanwhile,\
    \ runs at the start of each loop iteration. All of the statements within the “for”\
    \ loop will run if `truth_expression` evaluates to true; if it evaluates to false,\
    \ the loop will end. The interpreter checks the `increment_expression` before\
    \ ending each iteration. Programmers use the `increment_expression` to adjust\
    \ the value of the loop's control variable.\n\nYou can include `continue` and\
    \ `break` statements in your “for” loops. Keep in mind that `continue` forces\
    \ the PHP interpreter to evaluate `increment_expression` before checking `truth_expression`.\
    \ The following example will show you how a “for” loop works:\n\n```\nfor ($x\
    \ = 0; $x < 5; $x++) {\n    print \"The square of this variable is \" . $x * $x\
    \ . \"\\n\";\n}\n```\n\nJust like C, PHP allows you to provide multiple expressions\
    \ for each argument of the loop. You just have to delimit those expressions using\
    \ commas. If you will use this option, each argument will take the value of its\
    \ rightmost expression.\n\nAdditionally, you don't have to provide arguments for\
    \ your “for” loops. The interpreter will just assume that the missing arguments\
    \ evaluate to true. For instance, the code snippet given below will run continuously:\n\
    \n```\nfor ( ; ; ) {\n    print \"This loop is infinite\\n\";\n}\n```\n\n## The\
    \ Code Inclusion Structures\n\nYou can use a code inclusion structure to organize\
    \ the source of your programs. Aside from turning your complex codes into manageable\
    \ blocks, a code inclusion structure can help you apply your codes on other PHP\
    \ projects.\n\n### The “include” Statement\n\nJust like other computer languages,\
    \ PHP supports the usage of an “include” statement to divide codes into several\
    \ files. Dividing your source code into different files is often useful for “code\
    \ recycling” (i.e. using the same code on different scripts) or attaining code\
    \ readability. Whenever you execute this statement, PHP will read a file, compile\
    \ it into workable code, and run it.\n\nThe behavior of this statement is similar\
    \ to that of a function. Keep in mind, however, that `include` is a pre-installed\
    \ construct of the PHP language. When writing an `include` statement, you should\
    \ use the following syntax:\n\n```\ninclude name_of_file;\n```\n\nThe examples\
    \ given below will show you how to write an `include` statement:\n\n**error_files.php**\n\
    \n```\n<?php\n    $system_ok = 1;\n    $system_error = 0;\n?>\n```\n\n**check.php**\n\
    \n```\n<?php\n    include \"error_files.php\";\n    print ('The variable named\
    \ $system_error holds ' . \"$system_error\\n\");\n?>\n```\n\nIf you will run this\
    \ script, your screen will show you the following message:\n\n> “The variable\
    \ named $system_error holds 0”\n\n### The `eval()` Function\n\nThis function is\
    \ similar to the “include” statement. However, rather than compiling and running\
    \ codes from a PHP file, it treats codes as basic strings. This feature can help\
    \ you run dynamically generated codes or manually retrieve codes from external\
    \ sources. You should know that using `eval()` is more complex than writing codes\
    \ manually. Thus, it would be best if you'll avoid using this function.\n\n# Chapter\
    \ 3: The Functions of PHP\n\nPHP supports built-in and user-defined functions.\
    \ All PHP functions respond to the following call:\n\n```\nfunc(argument_1, argument_2,\
    \ argument_3, …)\n```\n\nThe arguments that you can include in a call depends\
    \ on the function you're using. You may use any PHP expression as an argument.\
    \ Actually, you can also tag other function calls as arguments. Here is one of\
    \ the built-in functions of this language:\n\n```\n$sample = strlen(\"elephant\"\
    );\n```\n\nThe `strlen()` function accepts a string and returns its length. Thus,\
    \ the variable named `$sample` will get 8 as its length, since “elephant” is eight\
    \ characters long.\n\n## The User-Defined Functions\n"
  trans: "\n# PHP 控制结构与函数\n\n## “elseif” 结构\n\n您可以使用 “elseif” 结构执行一系列条件判断，并且仅运行第一个满足条件下的代码。例如：\n\
    \n```\nif ($sample < 0) {\n    print '$sample is a negative integer';\n} elseif\
    \ ($sample == 0) {\n    print 'sample is equal to zero';\n} elseif ($sample >\
    \ 0) {\n    print '$sample is a positive integer';\n}\n```\n\n## “switch” 语句\n\
    \n`switch` 语句的语法是：\n\n```\nswitch (expression) {\n    case expression:\n     \
    \   statement/s\n    case expression:\n        statement/s\n    …\n    default:\n\
    \        statement/s\n}\n```\n\n程序员使用 `switch` 语句来替代复杂的 `if-elseif` 语句。`switch`\
    \ 语句将一个表达式与其主体内所有可能的条目进行比较。如果未找到完全匹配项，程序将运行 “default” 子句并忽略该语句的其余部分。在 PHP 中，您可以使用\
    \ `break` 语句来终止代码的执行，并将控制权传递给后续脚本。大多数程序员将 `break` 语句放在 `switch` 结构的最后部分。分析以下示例：\n\
    \n```\nswitch ($solution) {\n    case 'x':\n    case 'X':\n        print \"The\
    \ solution is correct\\n\";\n        break;\n    case 'u':\n    case 'U':\n  \
    \      print \"The solution is incorrect\\n\";\n        break;\n    default:\n\
    \        print \"Error: The system doesn't recognize the solution\\n\";\n    \
    \    break;\n}\n```\n\n## 循环结构\n\n您可以使用循环结构在 PHP 脚本中重复特定过程。例如，您可以使用 “循环” 多次提交查询结果。在本书的这一部分，您将了解\
    \ PHP 语言支持的循环结构：\n\n### “while” 循环\n\n编写 “while” 循环时，应使用以下语法：\n\n```\nwhile (expression)\n\
    \    statement/s\n```\n\n大多数程序员认为 “while” 循环是任何语言中最简单的循环类型。在每次重复开始时，程序将计算循环的真值表达式。如果表达式的结果为\
    \ true，循环将运行其内部的所有语句。然而，如果结果为 false，循环将结束并将程序控制权传递给其后的语句。\n\n### “break” 和 “continue”\
    \ 子句\n\n在 PHP 中，“break” 子句和 “continue” 子句需要以下语法：\n\n```\nbreak;\nbreak expression;\n\
    continue;\ncontinue expression;\n```\n\n有时您需要在迭代过程中结束循环。因此，PHP 提供了 `break` 语句。如果\
    \ `break` 语句作为单行出现（即 `break;`），程序将影响最内层的循环。您可以通过为 `break` 子句设置参数来指定要处理的最大层级。语法如下：\n\
    \n```\nbreak x;\n```\n\n### “do… while” 循环\n\n编写 “do… while” 循环时应使用以下语法。\n\n```\n\
    do\n    statement/s\nwhile (expression);\n```\n\n“do… while” 循环类似于普通的 “while”\
    \ 循环。唯一的区别在于，“do… while” 循环在结束每次迭代**之前**检查其真值表达式。基本上，这种循环确保您的语句**至少运行一次**，无论真值表达式的值如何。\n\
    \n程序员使用 “do… while” 循环在满足预定条件时终止代码块。示例如下：\n\n```\ndo {\n    statement/s\n    if\
    \ ($sample) {\n        break;\n    }\n    statement/s\n} while (false);\n```\n\
    \n由于 “do… while” 循环至少运行一次，您放置在该循环内的语句将仅运行一次。此外，其真值表达式的值始终计算为 false。PHP 允许您在 “do…\
    \ while” 循环内放置 `break` 子句，以随时终止其执行。显然，您可以使用这种循环来促进典型的重复过程。\n\n### “for” 循环\n\n\
    PHP 的 “for” 循环类似于 C 语言。这种循环接受三个参数：\n\n```\nfor (start_expression; truth_expression;\
    \ increment_expression)\n```\n\n通常，程序员为循环的每个部分（即真值、开始和增量）使用单个表达式。因此，您可以使用以下语法创建基本的\
    \ “for” 循环：\n\n```\nfor (expression; expression; expression)\n    statement/s\n\
    ```\n\nPHP 解释器仅计算一次 `start_expression`。该表达式初始化其所属循环的控制变量。名为 `truth_expression`\
    \ 的元素则在每次循环迭代开始时运行。如果 `truth_expression` 计算结果为 true，“for” 循环内的所有语句将运行；如果计算结果为\
    \ false，循环将结束。解释器在结束每次迭代**之前**检查 `increment_expression`。程序员使用 `increment_expression`\
    \ 来调整循环控制变量的值。\n\n您可以在 “for” 循环中包含 `continue` 和 `break` 语句。请记住，`continue` 会强制\
    \ PHP 解释器在检查 `truth_expression` **之前**计算 `increment_expression`。以下示例将向您展示 “for”\
    \ 循环的工作原理：\n\n```\nfor ($x = 0; $x < 5; $x++) {\n    print \"The square of this\
    \ variable is \" . $x * $x . \"\\n\";\n}\n```\n\n就像 C 语言一样，PHP 允许您为循环的每个参数提供多个表达式。您只需使用逗号分隔这些表达式即可。如果您使用此选项，每个参数将取其最右侧表达式的值。\n\
    \n此外，您不必为 “for” 循环提供参数。解释器将假定缺失的参数计算结果为 true。例如，下面的代码片段将持续运行：\n\n```\nfor ( ;\
    \ ; ) {\n    print \"This loop is infinite\\n\";\n}\n```\n\n## 代码包含结构\n\n您可以使用代码包含结构来组织程序的源代码。除了将复杂代码转化为可管理的代码块外，代码包含结构还可以帮助您将代码应用于其他\
    \ PHP 项目。\n\n### “include” 语句\n\n就像其他计算机语言一样，PHP 支持使用 “include” 语句将代码分割到多个文件中。将源代码分割到不同文件中通常有利于\
    \ “代码复用”（即在不同脚本中使用相同代码）或实现代码可读性。每当您执行此语句时，PHP 将读取一个文件，将其编译为可执行代码并运行它。\n\n该语句的行为类似于函数。但请记住，`include`\
    \ 是 PHP 语言的一个预装结构。编写 `include` 语句时，应使用以下语法：\n\n```\ninclude name_of_file;\n```\n\
    \n以下示例将向您展示如何编写 `include` 语句：\n\n**error_files.php**\n\n```\n<?php\n    $system_ok\
    \ = 1;\n    $system_error = 0;\n?>\n```\n\n**check.php**\n\n```\n<?php\n    include\
    \ \"error_files.php\";\n    print ('The variable named $system_error holds ' .\
    \ \"$system_error\\n\");\n?>\n```\n\n如果您运行此脚本，屏幕将显示以下消息：\n\n> “The variable named\
    \ $system_error holds 0”\n\n### `eval()` 函数\n\n此函数类似于 “include” 语句。然而，它不是从 PHP\
    \ 文件编译并运行代码，而是将代码视为基本字符串。此功能可帮助您运行动态生成的代码或从外部来源手动检索代码。您应该知道，使用 `eval()` 比手动编写代码更复杂。因此，最好避免使用此函数。\n\
    \n# 第 3 章：PHP 的函数\n\nPHP 支持内置函数和用户定义函数。所有 PHP 函数均响应以下调用：\n\n```\nfunc(argument_1,\
    \ argument_2, argument_3, …)\n```\n\n您可以在调用中包含的参数取决于您使用的函数。您可以使用任何 PHP 表达式作为参数。实际上，您也可以将其他函数调用作为参数。以下是该语言的内置函数之一：\n\
    \n```\n$sample = strlen(\"elephant\");\n```\n\n`strlen()` 函数接受一个字符串并返回其长度。因此，名为\
    \ `$sample` 的变量将获得 8 作为其长度，因为 “elephant” 有八个字符。\n\n## 用户定义函数\n"
