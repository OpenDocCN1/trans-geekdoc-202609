- raw: "Currently, most computer languages offer their own version of “try/catch/throw”\
    \ (i.e. a popular paradigm for handling exceptions). The construct named “try/catch”\
    \ protects the code it belongs to and informs the computer language about its\
    \ security tasks. Here, the program will “throw” errors and exceptions as soon\
    \ as they are detected. Then, the language (e.g. PHP) will scan its execution\
    \ stack to know whether there's a “try/catch” construct that can handle the problem.\n\
    \nThis method offers a lot of advantages. For example, it allows you to write\
    \ robust programs without having to write “if” statements in each of your code\
    \ blocks. That means you can minimize the codes that you need to write. With the\
    \ “try/catch/throw” paradigm, you can just enclose code blocks with “try/catch”\
    \ constructs and manage errors once they occur. Moreover, upon detecting an exception\
    \ via the “throw” construct, you may go back to a part of the code that can handle\
    \ and continue the program's execution.\n\nThe “try/catch” construct requires\
    \ the following syntax:\n\ntry {\n\n  … // The code block which might encounter\
    \ exceptions.\n\n} catch (ExceptionClass1 $sample\\_exception) {\n\n  … // The\
    \ code you want to use to handle the exception/s.\n\n} catch (ExceptionClass2\
    \ $sample\\_exception) {\n\n}\n\nYou need to place your PHP codes inside “try{}.”\
    \ As you can see, this construct precedes a collection of “catch” clauses, each\
    \ defining what exception it will handle and what name should be used for identifying\
    \ the errors.\n\nWhen the program throws an exception, the initial catch() statement\
    \ will run and PHP will compare the “instanceof” of the code and the specified\
    \ class. If this comparison results to true, PHP will enter the “catch” code block\
    \ and make the exception available under the specified variable identifier. If\
    \ the comparison results to false, however, PHP will check the succeeding catch\
    \ statement. The language's engine will check for other “try/catch” blocks if\
    \ there's no relevant catch statement in the current construct.\n\nHere's the\
    \ syntax of a “throw” statement:\n\nthrow <name\\_of\\_object>;\n\nThis language\
    \ doesn't allow you to throw basic data types (e.g. integers). Actually, PHP offers\
    \ a built-in class for exceptions which is named “Exception.” All of your exception\
    \ classes should inherit from this pre-defined class. If you will try to throw\
    \ objects that are not linked to the “Exception” class, your program will get\
    \ runtime errors.\n\nThe code snippet given below will give you more information\
    \ about the Exception class:\n\nclass Exception {\n\n  function construct (\\\
    [$theMessage \\[,theCode\\]\\]);\n\n  final public getInfo();\n\n  final public\
    \ getCodes();\n\n  final public getFiles();\n\n  final public getLines();\n\n\
      final public getTraces();\n\n  final public getTracesAsStrings();\n\n  protected\
    \ $messages;\n\n  protected $codes;\n\n  protected $files;\n\n  protected $lines;\n\
    \n}\n\nThe following code shows you how to write a complete “try/catch/throw”\
    \ block:\n\nclass NullHandle extends Exception {\n\n  function \\_construct ($sample\\\
    _message)\n\n  {\n\n    parent: : construct ($sample\\_message);\n\n  }\n\n}\n\
    \nfunction printObjects ($object)\n\n{\n\n  if ($object == NULL) {\n\n    throw\
    \ new NullHandle (“The program received a NULL object.”);\n\n  }\n\n  print $object\
    \ . “\\\\n”;\n\n}\n\nclass YourName {\n\n  function \\_construct ($sampleName)\n\
    \n  {\n\n    $this→sampleName = $sampleName;\n\n  }\n\n  function \\_toThisString()\n\
    \n  {\n\n    return $this→sampleName;\n\n  }\n\n  private $sampleName;\n\n}\n\n\
    try {\n\n  printTheObject (new YourName (“John”));\n\n  printTheObject (NULL);\n\
    \n  printTheObject (new YourName (“Mary”));\n\n} catch (NullHandle $sample\\_exception)\
    \ {\n\n  print $sample\\_exception->getMessages();\n\n  print “ in the file ”\
    \ . $sample\\_exception->getFiles();\n\n  print “ on the line ” . $sample\\_exception→getLines()\
    \ . “\\\\t”;\n\n} catch (Exception $sample\\_exception) {\n\n  // The program\
    \ won't reach this part.\n\n}\n\nImportant Note: Follow these rules while using\
    \ exceptions:\n\n1.  Keep in mind that an exception is an exception. You must\
    \ only utilize it to manage problems.\n\n2.  Don't use an exception to control\
    \ the flow of your program. Doing so makes source codes overly complex.\n\n3.\
    \  The data inside an exception should be limited to things related to the error.\
    \ This must not involve any parameter (or extra information).\n\n# \n\nChapter\
    \ 6: The Advanced Concepts of Object-Oriented Programming \n\nThis chapter will\
    \ teach you the advanced concepts and capabilities of object-oriented programming.\
    \ Read this material carefully if you want to learn PHP in just 24 hours.\n\n\
    ## The Overloading Capabilities of OOP\n\nIn the PHP language, C-based programming\
    \ extensions can overload the entire syntax of object definitions. PHP codes,\
    \ on the other hand, can only overload certain subsets of the object syntax. In\
    \ this part of the book, you will learn about the overloading features that you\
    \ can use with PHP:\n\nHow to Overload Methods and Properties\n\nThis language\
    \ allows you to overload method calls and property access. You can achieve these\
    \ things through special methods that will run if the related method or property\
    \ doesn't exist. That means you have lots of flexibility in terms of declaring\
    \ your own functionalities and stopping these actions.\n\nHere are the method\
    \ prototypes that you can implement in PHP:\n\nfunction \\_get ($propertyName)\n\
    \nfunction \\_set ($propertyName, $sampleValue)\n\nfunction \\_call ($sampleMethod,\
    \ $arguments)\n\nLet's discuss each prototype in detail:\n\n*   “\\_get” - This\
    \ method takes the name of a property. Use this prototype to return values.\n\n\
    *   “\\_set” - You can pass the value and name of a property to this method prototype.\n\
    \n*   “\\_call” - With this prototype, you can pass the name of a method and an\
    \ indexed array.\n\nThe code given below will show you how to use the \\_get and\
    \ \\_set functions:\n\nclass CoordinateClass {\n\n  private $array = array ('a'\
    \ => NULL, 'b' => NULL);\n\n  function \\_get ($sampleProperty)\n\n  {\n\n   \
    \ if (array\\_key\\_exists ($sampleProperty, $this→array)) {\n\n      return $this→array\
    \ \\[$sampleProperty\\];\n\n  } else {\n\n    print “The system can't read properties\
    \ aside from a and b\\\\n”;\n\n  }\n\n}\n\nfunction \\_set ($sampleProperty, $sampleValue)\n\
    \n{\n\n  if (array\\_key\\_exists ($property, $this→array)) {\n\n    $this→array\\\
    [$sampleProperty\\] = $sampleValue;\n\n    } else {\n\n      print “The system\
    \ can't write properties aside from a and b\\\\n”;\n\n    }\n\n  }\n\n}\n\n$object→a\
    \ = 10;\n\nprint $object→a;\n\nprint “\\\\n”;\n\n$object→e = 20;\n\nprint $object→e;\n\
    \nIf you will run this script, you will get the following output:\n\n10\n\nThe\
    \ system can't read properties aside from a and b\n\nThe system can't write properties\
    \ aside from a and b\n\nSince “a” exists inside the array of the object, the get\
    \ and set method handlers can read/write the right values. However, while accessing\
    \ “e”, both for writing and reading, array\\_key\\_exists() will give your false.\
    \ Thus, the program will reach the assigned error messages.\n\nYou can use the\
    \ \\_call() prototype for a wide range of purposes. In the following example,\
    \ you will know how to generate a delegation scheme:\n\nclass HiClass {\n\n  function\
    \ show($sampleCount)\n\n  {\n\n    for ($a = 0; $a < $sampleCount; $a++) {\n\n\
          print “Hi, how are you?\\\\n”;\n\n    }\n\n    return $sampleCount;\n\n\
      }\n\n}\n\nclass HiDelegator {\n\n  function \\_construct()\n\n  {\n\n    $this→object\
    \ = new HiClass();\n\n  }\n\n  function \\_call ($sampleMethod, $sampleArguments)             \
    \ \n\n  {\n\n    return call\\_user\\_func\\_array(array ($this→object , $sampleMethod)\
    \ ,\n\n    $sampleArguments;\n\n  }\n\n  private $sampleObject;\n\n}\n\n$sampleObject\
    \ = new HiDelegator();\n\nprint $sampleObject→show(5);\n\nIf you will run this\
    \ script, your screen will show you:\n\nHi, how are you?\n\nHi, how are you?\n\
    \nHi, how are you?\n\nHi, how are you?\n\nHi, how are you?\n\n5\n\nThe function\
    \ named “call\\_user\\_func\\_array()” allows the “\\_call()” prototype to pass\
    \ the call and arguments to HiClass: :show(). Aside from relaying a call to another\
    \ object, you may also return values from the \\_call() method prototype.\n\n\
    How to Overload the Syntax of Array Access "
