  trans: "\n# PHP 运算符\n\n## 比较运算符\n\n*   **`<`** - 使用此运算符判断左侧操作数的值是否小于右侧操作数的值。如果是，将得到\
    \ `true`。例如，`3 < 4` 的结果为 `true`。\n\n*   **`<=`** - 程序员称之为“小于或等于”运算符。如果左侧操作数的值小于或等于第二个操作数，将得到\
    \ `true`。例如，`3 <= 4` 将得到 `true`。\n\n*   **`>=`** - 这是“大于或等于”运算符。如果左侧操作数的值大于或等于右侧操作数的值，将得到\
    \ `true`；否则得到 `false`。例如，`3 >= 4` 的结果为 `false`。\n\n## 逻辑运算符\n\n此类运算符在执行任何比较之前，会将其操作数转换为布尔形式。以下是\
    \ PHP 支持的逻辑运算符：\n\n*   **`&&`** - 称为“逻辑与”运算符。如果两个操作数均为 `true`，将得到 `true`。\n\n\
    *   **`||`** - 程序员称之为“逻辑或”运算符。在 PHP 代码中使用时，如果至少有一个操作数为 `true`，将得到 `true`。\n\n\
    *   **`xor`** - 这是“逻辑异或”运算符。如果仅有一个操作数为 `true`，将得到 `true`。因此，如果两个操作数均为 `true` 或均为\
    \ `false`，将得到 `false`。\n\n> **重要提示：** 逻辑或和逻辑与运算符支持短路求值。这意味着它们无需检查整个表达式即可给出结果。例如，如果第一个操作数为\
    \ `true`，逻辑或将给出 `true`，因为其条件已满足（即至少有一个操作数应为 `true`）。另一方面，如果第一个操作数为 `false`，逻辑与运算符将给出\
    \ `false`。它不再检查第二个操作数，因为无论第二个操作数是什么，指定的条件都无法满足（即两个操作数均须为 `true`）。\n\n## 位运算符\n\
    \n位运算符对其操作数的位级形式进行操作。除非操作数是字符串，否则它们将被转换为各自的二进制形式，然后执行运算。在两个操作数均为字符串的情况下，PHP 将通过匹配字符偏移量来执行运算（例如，系统将字符视为二进制数）。\n\
    \n*   **`&`** - 这是“按位与”运算符。它会在两个操作数均为 `1` 的每个位位置上放置 `1`。\n\n*   **`|`** - 此运算符称为按位或，会在至少有一个操作数为\
    \ `1` 的位位置上放置 `1`。\n\n*   **`^`** - 程序员称之为“按位异或”运算符。它会在仅有一个操作数为 `1` 的每个位位置上放置\
    \ `1`。\n\n## 一元运算符\n\n属于此类型的运算符作用于单个操作数。\n\n### 取反运算符\n\n这些运算符反转其操作数的当前值。PHP 支持两个取反运算符，分别是：\n\
    \n*   **`!`** - 程序员称之为“逻辑非”运算符。如果操作数的值为 `false`，将得到 `true`。反之，如果值为 `true`，此运算符将得到\
    \ `false`。\n\n*   **`~`** - 这是按位取反运算符。它将 `0` 替换为 `1`，反之亦然。\n\n### 自增和自减运算符\n\n\
    这些运算符具有独特的特性——它们作用于变量，而非存储的值。这是因为除了获取运算结果外，它们还会改变存储在变量内部的值。PHP 语言支持两个自增运算符和两个自减运算符。它们是：\n\
    \n*   **`$sample++`** - 这是“后自增”运算符。它返回变量的当前值并将其增加 `1`。\n\n*   **`$sample--`**\
    \ - 程序员称此运算符为“后自减”。基本上，此运算符在将变量值减少 `1` 之前，给出变量的当前值。\n\n*   **`++$sample`** – 此运算符称为“前自增”，它增加其所依附变量的值并返回结果值。\n\
    \n*   **`--$sample`** – 使用此运算符，可在检索输出前将操作数的值减一。\n\n## 强制类型转换运算符\n\nPHP 提供六个强制类型转换运算符，可用于强制类型转换。你应该将运算符放在操作数的左侧。下表列出了\
    \ PHP 中所有的强制类型转换运算符：\n\n*   **`(array)`** – 此运算符将值的数据类型更改为“array”。\n\n*   **`(int)`**\
    \ 或 **`(integer)`** – 使用此运算符将值转换为整数。\n\n*   **`(string)`** – 这是用于从非字符串值创建字符串值的运算符。\n\
    \n*   **`(object)`** – 使用此运算符，可将任何值标记为“object”。\n\n*   **`(real)`**、**`(float)`**\
    \ 或 **`(double)`** – 此运算符允许将任何数据类型的值转换为浮点值。\n\n*   **`(bool)`** 或 **`(boolean)`**\
    \ – 使用此运算符将任何值转换为其布尔形式。\n\n> **请记住** 强制类型转换运算符影响的是变量的值，而非变量本身。例如：\n\n```\n$sample_string\
    \ = \"10\";\n$sample_number = (int) $sample_string;\n```\n\n在此例中，名为 `$sample_number`\
    \ 的变量获得整数 `10` 作为其值。然而，名为 `$sample_string` 的变量仍属于字符串类型。\n\n## 三元运算符\n\n程序员认为问号运算符（即\
    \ `?`）是任何语言中最酷的运算符之一。在 PHP 中，此运算符的格式为：\n\n```\nconditional_statement ? first_expression\
    \ : second_expression\n```\n\n`?` 运算符对 `conditional_statement` 的结果求值。如果结果为 `true`，运算符将返回\
    \ `first_expression` 的值。如果结果为 `false`，运算符将给出 `second_expression` 的值。\n\n下面的代码片段将帮助你理解此运算符的工作原理：\n\
    \n```\n$x = 100;\n$sample_message = isset($a) ? '$x exists' : '$x doesn\\'t exist';\n\
    print $sample_message;\n```\n\n如果你运行此代码，屏幕将打印以下内容：\n\n```\n$x exists\n```\n\n\
    # 第 2 章：控制结构\n\n这种编程语言支持其他计算机语言提供的最佳控制结构。PHP 用户将控制结构分为两类：条件控制和循环控制。条件控制结构影响程序流程，并根据预定标准运行或跳过特定代码。另一方面，循环控制结构根据程序员设定的标准多次运行一段代码。让我们详细讨论每种类型的结构：\n\
    \n## 条件结构\n\n编写程序时需要使用条件语句。这些语句允许程序根据用户的输入及其自身的“决策”表现出不同的行为。在 PHP 中，你可以使用 `if`\
    \ 语句和 `switch` 语句。这些语句是计算机编程中最流行的两种控制结构。\n\n### `if` 语句\n\n此类包含三种语句，分别是：\n\n1.\
    \  `if (conditional_expression)` statement/s\n2.  `elseif (conditional_expression)`\
    \ statement/s\n3.  `elseif (conditional_expression)` statement/s … `else` statements\n\
    \n这些语句被认为是编程和脚本编写中最流行的条件构造。实际上，你会在大多数计算机语言中找到它们。每个 `if` 语句都有一个称为“真值表达式”的条件表达式。如果\
    \ `if` 语句的真值表达式结果为 `true`，其下方的语句或语句组将运行；否则将被忽略。\n\n你可以向 `if` 语句添加 `else` 子句，仅当你提供的条件表达式求值为\
    \ `false` 时运行代码。示例如下：\n\n```\nif ($sample >= 100) {\n    print '$sample is within\
    \ the given range';\n} else {\n    print '$sample is invalid';\n}\n```\n\n正如你所见，花括号定义了每个\
    \ `if` 和 `else` 子句下的语句，将这些语句变为“代码块”。在此例中，由于每个代码块仅包含单条语句，你可以移除花括号。然而，即使在花括号完全可选的情况下，最好仍然编写花括号。花括号能提高\
    \ PHP 代码的可读性。\n\n"
