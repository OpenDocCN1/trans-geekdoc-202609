    \ are `true`.\n\n*   **`||`** - Programmers call this the \"Logical OR\" operator.\
    \ When used in PHP codes, it will give you `true` if at least one of operands\
    \ is `true`.\n\n*   **`xor`** - This is the \"Logical XOR\" operator. It will\
    \ give you `true` if only one of the operands is `true`. Thus, you will get `false`\
    \ if both of the operands are `true` or `false`.\n\n> **Important Note:** The\
    \ Logical OR and Logical AND operators allow short-circuit evaluation. That means\
    \ they can give a result even without checking the entire expression. Logical\
    \ OR, for example, will give you `true` if the first operand is `true`, since\
    \ its condition has already been met (i.e. at least one of the operands should\
    \ be `true`). The Logical AND operator, on the other hand, will give you `false`\
    \ if the first operand is `false`. It won't check the second operand anymore since\
    \ the assigned condition cannot be met no matter what (i.e. both operands should\
    \ be `true`).\n\n## Bitwise Operators\n\nA bitwise operator conducts operations\
    \ on the bitwise form of its operands. Unless the operands are strings, they will\
    \ be converted to their respective binary form, and the operation will run. In\
    \ situations where both of the operands are strings, PHP will perform the operation\
    \ by matching character offsets (e.g. the system will treat the characters as\
    \ binary numbers).\n\n*   **`&`** - This is the \"Bitwise AND\" operator. It will\
    \ place `1` in each position where both operands have `1`.\n\n*   **`|`** - This\
    \ operator, known as Bitwise OR, places `1` in positions where at least one operand\
    \ has `1`.\n\n*   **`^`** - Programmers refer to this as the \"Bitwise XOR\" operator.\
    \ It places `1` in each position where only one of the operands has `1`.\n\n##\
    \ Unary Operators\n\nOperators that belong to this type work on single operands.\n\
    \n### Negation Operators\n\nThese operators reverse the current value of its operand.\
    \ PHP supports two negation operators, which are:\n\n*   **`!`** - Programmers\
    \ call this the \"Logical Negation\" operator. It will give you `true` if the\
    \ operand's value is `false`. If the value is `true`, on the other hand, this\
    \ operator will give you `false`.\n\n*   **`~`** - This is the Bitwise Negation\
    \ operator. It replaces `0` with `1`, and vice versa.\n\n### Increment and Decrement\
    \ Operators\n\nThese operators have a unique characteristic – they work on a variable,\
    \ not on the stored value. This is because aside from getting the result of an\
    \ operation, they also change the value stored inside the variable. The PHP language\
    \ supports two increment operators and two decrement operators. These are:\n\n\
    *   **`$sample++`** - This is the \"Post-increment\" operator. It returns the\
    \ current value of the variable and increases it by `1`.\n\n*   **`$sample--`**\
    \ - Programmers refer to this operator as \"Post-decrement.\" Basically, this\
    \ operator gives the current value of a variable before decreasing it by `1`.\n\
    \n*   **`++$sample`** – This operator, which is called \"Pre-increment,\" increases\
    \ the value of the variable it is attached to and returns the resulting value.\n\
    \n*   **`--$sample`** – With this operator, you can decrease the value of an operand\
    \ by one before retrieving an output.\n\n## Cast Operators\n\nPHP offers six cast\
    \ operators that you can use to force type conversions. You should place the operator\
    \ on the left-side of the operand. The list given below shows all of the cast\
    \ operators in PHP:\n\n*   **`(array)`** – This operator changes the data type\
    \ of a value to \"array.\"\n\n*   **`(int)`** or **`(integer)`** – Use this operator\
    \ to convert values into integers.\n\n*   **`(string)`** – This is the operator\
    \ that you should use to create string values out of non-string ones.\n\n*   **`(object)`**\
    \ – With this operator, you can tag any value as an \"object.\"\n\n*   **`(real)`**,\
    \ **`(float)`** or **`(double)`** – This operator allows you to convert values\
    \ from any data type into floating-point values.\n\n*   **`(bool)`** or **`(boolean)`**\
    \ – Use this operator to convert any value into its Boolean form.\n\n> **Keep\
    \ in mind** that a cast operator affects the value of a variable, not the variable\
    \ itself. For instance:\n\n```\n$sample_string = \"10\";\n$sample_number = (int)\
    \ $sample_string;\n```\n\nIn this example, the variable named `$sample_number`\
    \ gets the integer `10` as its value. The variable called `$sample_string`, however,\
    \ still belongs to the string type.\n\n## The Ternary Operator\n\nProgrammers\
    \ consider the question mark operator (i.e. `?`) as one of the coolest operators\
    \ of any language. In PHP, the format of this operator is:\n\n```\nconditional_statement\
    \ ? first_expression : second_expression\n```\n\nThe `?` operator evaluates the\
    \ result of `conditional_statement`. If the result is `true`, the operator will\
    \ return the value of `first_expression`. If the result is `false`, the operator\
    \ will give you the value of `second_expression`.\n\nThe code snippet given below\
    \ will help you to understand how this operator works:\n\n```\n$x = 100;\n$sample_message\
    \ = isset($a) ? '$x exists' : '$x doesn\\'t exist';\nprint $sample_message;\n\
    ```\n\nIf you will run this code, your screen will print the following:\n\n```\n\
    $x exists\n```\n\n# Chapter 2: The Control Structures\n\nThis programming language\
    \ supports the best control structures offered by other computer languages. PHP\
