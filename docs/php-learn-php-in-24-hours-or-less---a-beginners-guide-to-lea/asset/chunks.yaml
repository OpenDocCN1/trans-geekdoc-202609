- raw: "Important Note: There are no limits regarding the number of indirect references\
    \ that you can use. That means you can place any number of dollar signs before\
    \ a variable's name.\n\nHow to Manage Variables               \n\nThere are three\
    \ constructs that you can use to manage your PHP variables. These constructs allow\
    \ you to verify the existence of certain variables, delete variables, and check\
    \ their truth values. Let's discuss each language construct in detail:\n\n*  \
    \ isset() - This construct checks whether PHP has declared a particular variable.\
    \ It will give you “true” (i.e. a Boolean value) if your chosen variable already\
    \ exists; otherwise, it will give you false. The script given below will illustrate\
    \ this concept:\n\nif (isset ($my\\_name)) {\n\nprint '$my\\_name exists';\n\n\
    }\n\nIf the variable named “my\\_name” exists, your screen will display “$my\\\
    _name exists.” If your code doesn't have that variable, however, you won't get\
    \ any output.\n\n*   unset() - Use this construct to “undeclare” an existing variable.\
    \ If there are no references that point to the variable's value, the memory assigned\
    \ to it will become freed up. Invoking isset() on a variable that you've deleted\
    \ gives you “false.” Here's an example:\n\n$gameconsole = “PlayStation 4”;\n\n\
    unset ($gameconsole);\n\nif (isset ($gameconsole)) {\n\nprint '$gameconsole exists';\n\
    \n}\n\nImportant Note: You can also use unset() and isset() on object properties\
    \ and array elements (you'll learn about these later). The syntax that you should\
    \ use is:\n\n◦       For object properties:\n\n◦       if (isset ($object – property))\
    \ { … }\n\n◦       For array elements:\n\n◦       if isset ($array \\[“offset”}))\
    \ { … }\n\n*   empty() - With this construct, you can check whether a variable\
    \ exists or is set to false. While checking the truth value of a variable, empty()\
    \ will convert the data into Boolean and checks whether it is true or false. Check\
    \ the following script:\n\nif (empty ($gameconsole)) {\n\nprint 'Sorry, this variable\
    \ doesn't have a value';\n\n}\n\nThe Superglobal Variables \n\nIn general, you\
    \ can't use global variables (i.e. variables that you can access from any part\
    \ of your code) in PHP. However, this scripting language has built-in variables\
    \ that act like typical global variables. These variables, known             \
    \ as superglobals, are one of the best tools that you can use while writing PHP\
    \ scripts. Here are some of the superglobals that you will encounter:\n\n*   $\\\
    _ENV\\[\\] - This is an array  that contains environment variables.\n\n*   $\\\
    _GET\\[\\] - This array holds all of the “GET” variables gathered from the user's\
    \ web browser.\n\n*   $\\_POST\\[\\] - This superglobal is similar to $\\_GET.\
    \ The only difference is that $\\_POST involves POST variables only.\n\n*   $\\\
    _SERVER – This kind of array holds the values of web-server variables.\n\n## \n\
    \nThe Data Types \n\nThe PHP language supports eight data types. Five of these\
    \ data types are scalar. The remaining three, however, has unique properties that\
    \ differentiate them from others. As mentioned earlier, a PHP variable can hold\
    \ any data type. Keep in mind that PHP variables behave according to the type\
    \ of data they hold. Here are the data types that you will encounter while using\
    \ PHP:\n\nIntegers\n\nAn integer is a whole number and has the same range as the\
    \ “long” data type of C. In most machines (e.g. Intel Pentium processors), an\
    \ integer is a 32-bit signed number that can be as low as -2,147,483,648 or as\
    \ high as 2,147,483,647.\n\nYou may write an integer in octal (with zero as a\
    \ prefix), in decimal (without any prefix), and in hexadecimal form (with 0x as\
    \ a prefix). Additionally, PHP integers can be positive or negative. Here are\
    \ some examples of valid PHP integers:\n\n*   30000\n\n*   0xCDEF\n\n*   003\n\
    \n*   \\-90\n\nFloating-Point Numbers \n\nA floating-point number, also called\
    \ real number, is PHP's own version of the C language's “double” type. When accessed\
    \ using a typical platform, a floating-point number is 8 bytes in size and can\
    \ reach as high as 1.8E+308 down to 2.2E-308. In general, a floating-point value\
    \ can have an exponent, a decimal point, and “+” or “-” sign. The list given below\
    \ shows some valid floating-point numbers:\n\n*   65.7E43\n\n*   \\-1800.4\n\n\
    *   +0.8e-3\n\nString\n\nIn PHP, strings are sequences of characters (i.e. letters\
    \ and numbers) that are null-terminated all the time. Unlike other computer languages,\
    \ however, PHP remembers the length of a string internally rather than relying\
    \ on the null terminator. This approach allows the PHP interpreter to handle binary\
    \ information easily. For instance, you can use this function to generate images\
    \ on-the-fly and send it to a web browser. The largest size a string can have\
    \ depends on the C compiler and computer that you're using. However, you can be\
    \ sure it can handle 2GB of data without any problems.\n\nImportant Note: Don't\
    \ create programs that verify the limit discussed above. You will likely reach\
    \ the memory limit of your platform first.\n\nWhile adding a string value to your\
    \ PHP code, you may use single quotes, double quotes, or here-docs. Let's discuss\
    \ these options in detail:\n\n*   Single Quotes – This is the simplest option\
    \ that you can use when creating a string. Write your string between a pair of\
    \ quotes. This approach supports two types of escape characters, which are: \\\
    \\' and \\\\\\\\. You will learn about escape characters later.\n\n*   Double\
    \ Quotes – This option is more complex than the previous one. You can use this\
    \ to hold any character. However, when working with a special symbol, you need\
    \ to use the backslash character. Adding a backslash before a special character\
    \ is called “escaping.” Here are the escape characters that you will encounter\
    \ while using PHP:\n\n*   \\\\n – Use this to add a newline character to your\
    \ codes. A newline character is the character you'll get after pressing the Enter\
    \ key.\n\n*   \\\\t – With this, you can add a tab character to your PHP codes.\n\
    \n*   \\\\\\\\ - You can use this symbol to add a backslash character to your\
    \ scripts. As you can see, the backslash character is used to activate the special\
    \ functions of other characters. Thus, you need to type two backslash characters\
    \ in order to get an ordinary backslash.\n\n*   \\\\” - Double quotes are used\
    \ to enclose strings. To add a normal double quote character, you need to introduce\
    \ it using a backslash.\n\n*   \\\\r – This escape symbol allows you to insert\
    \ a line feed to your PHP script.\n\n*   \\\\$ - Use this symbol to add a normal\
    \ dollar sign to your codes. As you know, $ is used to create a PHP variable.\n\
    \n*   \\\\0 – With this symbol, you can add the 0 character of ASCII.\n\n*   \\\
    \\{octal number} – Use this to add an ASCII character to your code. Here, you\
    \ should use the octal representation of the character you want to add.\n\n* \
    \  \\\\x{hexadecimal number} – This escape character is almost identical to the\
    \ octal one. The only difference is that this escape symbol requires the hexadecimal\
    \ representation of the character.\n\nAnother powerful functionality of a double-quoted\
    \ string is that it can hold the notation of an expression or variable. The samples\
    \ given below will help you understand how this function works. The system will\
    \ automatically replace variable references with the value of the variables involved.\
    \ If the value isn't a string, the system will convert that data into its corresponding\
    \ string representation (e.g. 999 will be converted to “999”).\n\n“The answer\
    \ is $answer\\\\n”\n\nThe $i array offset holds $array\\[$i\\]”\n\nIn situations\
    \ where you want to concatenate a string with a value (e.g. an expression or a\
    \ variable) and its syntax is insufficient, you may use the dot operator (i.e.\
    \ “.”) to combine (or concatenate) multiple strings. You'll learn more about this\
    \ operator later.\n\n*   Here-Docs – This option allows you to embed huge pieces\
    \ of content to your codes. These pieces of content may have single quotes or\
    \ double quotes. When using the here-docs delimiter, you won't have to worry about\
    \ escaping your symbols.\n\nBoolean "
  fmt: "\n# Important Note\n\nThere are no limits regarding the number of indirect\
    \ references that you can use. That means you can place any number of dollar signs\
    \ before a variable's name.\n\n# How to Manage Variables\n\nThere are three constructs\
    \ that you can use to manage your PHP variables. These constructs allow you to\
    \ verify the existence of certain variables, delete variables, and check their\
    \ truth values. Let's discuss each language construct in detail:\n\n*   **`isset()`**\
    \ - This construct checks whether PHP has declared a particular variable. It will\
    \ give you \"true\" (i.e. a Boolean value) if your chosen variable already exists;\
    \ otherwise, it will give you false. The script given below will illustrate this\
    \ concept:\n\n```\nif (isset ($my_name)) {\n    print '$my_name exists';\n}\n\
    ```\n\nIf the variable named \"my_name\" exists, your screen will display \"$my_name\
    \ exists.\" If your code doesn't have that variable, however, you won't get any\
    \ output.\n\n*   **`unset()`** - Use this construct to \"undeclare\" an existing\
    \ variable. If there are no references that point to the variable's value, the\
    \ memory assigned to it will become freed up. Invoking `isset()` on a variable\
    \ that you've deleted gives you \"false.\" Here's an example:\n\n```\n$gameconsole\
    \ = \"PlayStation 4\";\nunset ($gameconsole);\nif (isset ($gameconsole)) {\n \
    \   print '$gameconsole exists';\n}\n```\n\n**Important Note:** You can also use\
    \ `unset()` and `isset()` on object properties and array elements (you'll learn\
    \ about these later). The syntax that you should use is:\n\n*   For object properties:\n\
    \    `if (isset ($object->property)) { … }`\n*   For array elements:\n    `if\
    \ (isset ($array[\"offset\"])) { … }`\n\n*   **`empty()`** - With this construct,\
    \ you can check whether a variable exists or is set to false. While checking the\
    \ truth value of a variable, `empty()` will convert the data into Boolean and\
    \ checks whether it is true or false. Check the following script:\n\n```\nif (empty\
    \ ($gameconsole)) {\n    print 'Sorry, this variable doesn\\'t have a value';\n\
    }\n```\n\n# The Superglobal Variables\n\nIn general, you can't use global variables\
    \ (i.e. variables that you can access from any part of your code) in PHP. However,\
    \ this scripting language has built-in variables that act like typical global\
    \ variables. These variables, known as superglobals, are one of the best tools\
    \ that you can use while writing PHP scripts. Here are some of the superglobals\
    \ that you will encounter:\n\n*   **`$_ENV[]`** - This is an array that contains\
    \ environment variables.\n*   **`$_GET[]`** - This array holds all of the \"GET\"\
    \ variables gathered from the user's web browser.\n*   **`$_POST[]`** - This superglobal\
    \ is similar to `$_GET`. The only difference is that `$_POST` involves POST variables\
    \ only.\n*   **`$_SERVER`** - This kind of array holds the values of web-server\
    \ variables.\n\n# The Data Types\n\nThe PHP language supports eight data types.\
    \ Five of these data types are scalar. The remaining three, however, have unique\
    \ properties that differentiate them from others. As mentioned earlier, a PHP\
    \ variable can hold any data type. Keep in mind that PHP variables behave according\
    \ to the type of data they hold. Here are the data types that you will encounter\
    \ while using PHP:\n\n## Integers\n\nAn integer is a whole number and has the\
    \ same range as the \"long\" data type of C. In most machines (e.g. Intel Pentium\
    \ processors), an integer is a 32-bit signed number that can be as low as `-2,147,483,648`\
    \ or as high as `2,147,483,647`.\n\nYou may write an integer in octal (with zero\
    \ as a prefix), in decimal (without any prefix), and in hexadecimal form (with\
    \ `0x` as a prefix). Additionally, PHP integers can be positive or negative. Here\
    \ are some examples of valid PHP integers:\n\n*   `30000`\n*   `0xCDEF`\n*   `003`\n\
    *   `-90`\n\n## Floating-Point Numbers\n\nA floating-point number, also called\
    \ real number, is PHP's own version of the C language's \"double\" type. When\
    \ accessed using a typical platform, a floating-point number is 8 bytes in size\
    \ and can reach as high as `1.8E+308` down to `2.2E-308`. In general, a floating-point\
    \ value can have an exponent, a decimal point, and \"+\" or \"-\" sign. The list\
    \ given below shows some valid floating-point numbers:\n\n*   `65.7E43`\n*   `-1800.4`\n\
    *   `+0.8e-3`\n\n## String\n\nIn PHP, strings are sequences of characters (i.e.\
    \ letters and numbers) that are null-terminated all the time. Unlike other computer\
    \ languages, however, PHP remembers the length of a string internally rather than\
    \ relying on the null terminator. This approach allows the PHP interpreter to\
    \ handle binary information easily. For instance, you can use this function to\
    \ generate images on-the-fly and send it to a web browser. The largest size a\
    \ string can have depends on the C compiler and computer that you're using. However,\
    \ you can be sure it can handle 2GB of data without any problems.\n\n**Important\
    \ Note:** Don't create programs that verify the limit discussed above. You will\
    \ likely reach the memory limit of your platform first.\n\nWhile adding a string\
    \ value to your PHP code, you may use single quotes, double quotes, or here-docs.\
    \ Let's discuss these options in detail:\n\n*   **Single Quotes** – This is the\
    \ simplest option that you can use when creating a string. Write your string between\
    \ a pair of quotes. This approach supports two types of escape characters, which\
    \ are: `\\'` and `\\\\`. You will learn about escape characters later.\n*   **Double\
    \ Quotes** – This option is more complex than the previous one. You can use this\
    \ to hold any character. However, when working with a special symbol, you need\
    \ to use the backslash character. Adding a backslash before a special character\
    \ is called \"escaping.\" Here are the escape characters that you will encounter\
    \ while using PHP:\n    *   `\\n` – Use this to add a newline character to your\
    \ codes. A newline character is the character you'll get after pressing the Enter\
    \ key.\n    *   `\\t` – With this, you can add a tab character to your PHP codes.\n\
    \    *   `\\\\` - You can use this symbol to add a backslash character to your\
    \ scripts. As you can see, the backslash character is used to activate the special\
    \ functions of other characters. Thus, you need to type two backslash characters\
    \ in order to get an ordinary backslash.\n    *   `\\\"` - Double quotes are used\
    \ to enclose strings. To add a normal double quote character, you need to introduce\
    \ it using a backslash.\n    *   `\\r` – This escape symbol allows you to insert\
    \ a line feed to your PHP script.\n    *   `\\$` - Use this symbol to add a normal\
    \ dollar sign to your codes. As you know, `$` is used to create a PHP variable.\n\
    \    *   `\\0` – With this symbol, you can add the 0 character of ASCII.\n   \
    \ *   `\\{octal number}` – Use this to add an ASCII character to your code. Here,\
    \ you should use the octal representation of the character you want to add.\n\
    \    *   `\\x{hexadecimal number}` – This escape character is almost identical\
    \ to the octal one. The only difference is that this escape symbol requires the\
    \ hexadecimal representation of the character.\n\nAnother powerful functionality\
    \ of a double-quoted string is that it can hold the notation of an expression\
    \ or variable. The samples given below will help you understand how this function\
    \ works. The system will automatically replace variable references with the value\
    \ of the variables involved. If the value isn't a string, the system will convert\
    \ that data into its corresponding string representation (e.g. `999` will be converted\
    \ to \"999\").\n\n*   `\"The answer is $answer\\n\"`\n*   `\"The $i array offset\
    \ holds $array[$i]\"`\n\nIn situations where you want to concatenate a string\
    \ with a value (e.g. an expression or a variable) and its syntax is insufficient,\
    \ you may use the dot operator (i.e. `.`) to combine (or concatenate) multiple\
    \ strings. You'll learn more about this operator later.\n\n*   **Here-Docs** –\
    \ This option allows you to embed huge pieces of content to your codes. These\
    \ pieces of content may have single quotes or double quotes. When using the here-docs\
    \ delimiter, you won't have to worry about escaping your symbols.\n\n## Boolean\n"
  trans: "\n\n# 重要提示\n\n关于你可以使用的间接引用数量没有限制。这意味着你可以在变量名前放置任意数量的美元符号。\n\n# 如何管理变量\n\n\
    有三种语言结构可用于管理你的 PHP 变量。这些结构允许你验证特定变量是否存在、删除变量以及检查它们的真值。让我们详细讨论每一种语言结构：\n\n*   **`isset()`**\
    \ - 此结构检查 PHP 是否已声明特定变量。如果你选择的变量已存在，它将返回 \"true\"（即布尔值）；否则返回 false。下面的脚本将演示这一概念：\n\
    \n```\nif (isset ($my_name)) {\n    print '$my_name exists';\n}\n```\n\n如果名为 \"\
    my_name\" 的变量存在，你的屏幕将显示 \"$my_name exists.\" 然而，如果你的代码中没有该变量，你将不会得到任何输出。\n\n*\
    \   **`unset()`** - 使用此结构来“取消声明”一个现有变量。如果没有引用指向该变量的值，分配给它的内存将被释放。对已删除的变量调用 `isset()`\
    \ 将返回 \"false\"。这是一个示例：\n\n```\n$gameconsole = \"PlayStation 4\";\nunset ($gameconsole);\n\
    if (isset ($gameconsole)) {\n    print '$gameconsole exists';\n}\n```\n\n**重要提示：**\
    \ 你也可以在对象属性和数组元素上使用 `unset()` 和 `isset()`（稍后你将学习这些）。你应该使用的语法是：\n\n*   对于对象属性：\n\
    \    `if (isset ($object->property)) { … }`\n*   对于数组元素：\n    `if (isset ($array[\"\
    offset\"])) { … }`\n\n*   **`empty()`** - 使用此结构，你可以检查变量是否存在或是否被设置为 false。在检查变量的真值时，`empty()`\
    \ 会将数据转换为布尔值，并检查它是 true 还是 false。请查看以下脚本：\n\n```\nif (empty ($gameconsole)) {\n\
    \    print 'Sorry, this variable doesn\\'t have a value';\n}\n```\n\n# 超全局变量\n\
    \n通常情况下，你不能在 PHP 中使用全局变量（即可以从代码任何部分访问的变量）。然而，这种脚本语言拥有表现得像典型全局变量的内置变量。这些变量被称为超全局变量，是你编写\
    \ PHP 脚本时可以使用的最佳工具之一。以下是你将遇到的一些超全局变量：\n\n*   **`$_ENV[]`** - 这是一个包含环境变量的数组。\n\
    *   **`$_GET[]`** - 此数组保存从用户网页浏览器收集的所有 \"GET\" 变量。\n*   **`$_POST[]`** - 此超全局变量类似于\
    \ `$_GET`。唯一的区别是 `$_POST` 仅涉及 POST 变量。\n*   **`$_SERVER`** - 此类数组保存 Web 服务器变量的值。\n\
    \n# 数据类型\n\nPHP 语言支持八种数据类型。其中五种是标量类型。然而，剩下的三种具有独特的属性，使它们与其他类型区分开来。如前所述，PHP 变量可以容纳任何数据类型。请记住，PHP\
    \ 变量的行为取决于它们所容纳的数据类型。以下是你在使用 PHP 时将遇到的数据类型：\n\n## 整数\n\n整数是一个整数，其范围与 C 语言的 \"\
    long\" 数据类型相同。在大多数机器上（例如 Intel 奔腾处理器），整数是一个 32 位有符号数，可以低至 `-2,147,483,648` 或高至\
    \ `2,147,483,647`。\n\n你可以用八进制（以零为前缀）、十进制（无前缀）和十六进制（以 `0x` 为前缀）形式书写整数。此外，PHP 整数可以是正数或负数。以下是一些有效\
    \ PHP 整数的示例：\n\n*   `30000`\n*   `0xCDEF`\n*   `003`\n*   `-90`\n\n## 浮点数\n\n\
    浮点数，也称为实数，是 PHP 版本的 C 语言 \"double\" 类型。在典型平台上访问时，浮点数大小为 8 字节，最高可达 `1.8E+308`，最低可至\
    \ `2.2E-308`。通常，浮点值可以包含指数、小数点以及 \"+\" 或 \"-\" 符号。下表列出了一些有效的浮点数：\n\n*   `65.7E43`\n\
    *   `-1800.4`\n*   `+0.8e-3`\n\n## 字符串\n\n在 PHP 中，字符串是字符序列（即字母和数字），始终以空字符结尾。然而，与其他计算机语言不同，PHP\
    \ 在内部记录字符串的长度，而不是依赖空终止符。这种方法使 PHP 解释器能够轻松处理二进制信息。例如，你可以使用此函数即时生成图像并将其发送到网页浏览器。字符串能拥有的最大尺寸取决于你使用的\
    \ C 编译器和计算机。然而，你可以确信它能毫无问题地处理 2GB 的数据。\n\n**重要提示：** 不要创建验证上述限制的程序。你很可能会先达到平台的内存限制。\n\
    \n在将字符串值添加到 PHP 代码时，你可以使用单引号、双引号或 Here-docs。让我们详细讨论这些选项：\n\n*   **单引号** – 这是创建字符串时可使用的最简单选项。在一对引号之间写入你的字符串。此方法支持两种转义字符，分别是：`\\\
    '` 和 `\\\\`。你稍后将了解转义字符。\n*   **双引号** – 此选项比前一个更复杂。你可以用它来容纳任何字符。然而，在处理特殊符号时，你需要使用反斜杠字符。在特殊字符前添加反斜杠称为“转义”。以下是你在使用\
    \ PHP 时将遇到的转义字符：\n    *   `\\n` – 用于在代码中添加换行符。换行符是你按下 Enter 键后得到的字符。\n    *  \
    \ `\\t` – 使用它，你可以在 PHP 代码中添加制表符。\n    *   `\\\\` - 你可以使用此符号在脚本中添加反斜杠字符。正如你所见，反斜杠字符用于激活其他字符的特殊功能。因此，你需要输入两个反斜杠字符才能得到一个普通的反斜杠。\n\
    \    *   `\\\"` - 双引号用于括起字符串。要添加普通的双引号字符，你需要使用反斜杠引入它。\n    *   `\\r` – 此转义符允许你向\
    \ PHP 脚本插入换行符。\n    *   `\\$` - 使用此符号在代码中添加普通的美元符号。正如你所知，`$` 用于创建 PHP 变量。\n  \
    \  *   `\\0` – 使用此符号，你可以添加 ASCII 的 0 字符。\n    *   `\\{八进制数字}` – 用于向代码添加 ASCII\
    \ 字符。此处应使用该字符的八进制表示。\n    *   `\\x{十六进制数字}` – 此转义字符与八进制转义字符几乎相同。唯一的区别是此转义符要求字符的十六进制表示。\n\
    \n双引号字符串的另一个强大功能是它可以容纳表达式或变量的表示法。下面给出的示例将帮助你理解此功能的工作原理。系统将自动用涉及变量的值替换变量引用。如果该值不是字符串，系统会将该数据转换为其对应的字符串表示（例如\
    \ `999` 将转换为 \"999\"）。\n\n*   `\"The answer is $answer\\n\"`\n*   `\"The $i array\
    \ offset holds $array[$i]\"`\n\n在你想要将字符串与值（例如表达式或变量）连接但其语法不足的情况下，你可以使用点运算符（即 `.`）来组合（或连接）多个字符串。你稍后将了解更多关于此运算符的信息。\n\
    \n*   **Here-Docs** – 此选项允许你将大量内容嵌入代码中。这些内容可能包含单引号或双引号。使用 Here-docs 定界符时，你无需担心转义符号。\n\
    \n## 布尔值\n\n"
