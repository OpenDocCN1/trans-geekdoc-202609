    \n[How to Handle User Input Safely](#part0000.xhtml#_Toc447097815)\n\n[Sessions](#part0000.xhtml#_Toc447097816)\n\
    \n[File Uploads](#part0000.xhtml#_Toc447097817)\n\n[Architecture](#part0000.xhtml#_Toc447097818)\n\
    \n[Chapter 8: Databases and the PHP Language](#part0000.xhtml#_Toc447097819)\n\
    \n[MySQL – The Basics](#part0000.xhtml#_Toc447097820)\n\n[More Information about\
    \ MySQL](#part0000.xhtml#_Toc447097821)\n\n[Database Queries](#part0000.xhtml#_Toc447097822)\n\
    \n[Conclusion](#part0000.xhtml#_Toc447097823)\n\n# Introduction\n\nIn this book\
    \ you will find detailed instructions on how to learn the basics of the PHP language.\n\
    \nThis eBook will explain what PHP is and how it can help you in building web\
    \ applications. Aside from giving theoretical explanations, this book will provide\
    \ you with actual codes and practical examples. You will be able to learn this\
    \ computer language quickly even if you have never programmed anything before.\
    \ If you're looking for a comprehensive reference for PHP, this is the book you\
    \ need.\n\nBy reading this book, you will be able to:\n\n*   Learn the fundamental\
    \ elements of PHP\n\n*   Know the syntax that you should use while writing PHP\
    \ scripts\n\n*   Create your own variables and constants\n\n*   Call the built-in\
    \ methods and functions of PHP\n\n*   Handle errors and exceptions in your web\
    \ applications\n\n*   Receive and store user inputs securely\n\n*   Master the\
    \ basics of OOP (i.e. object-oriented programming)\n\n*   Create classes and subclasses\n\
    \n*   Know the connection between PHP and MySQL\n\nPHP is an excellent scripting\
    \ language. It can help you create robust websites and web applications. If you\
    \ want to be an effective PHP user in just 24 hours, read this book carefully.             \
    \ \n\nLet’s begin the journey.\n\n# \n\nChapter 1: PHP – The Basics \n\nThe PHP\
    \ language (i.e. PHP: Hypertext Processor) borrows some of its syntaxes from other\
    \ programming languages (e.g. C, Perl, Java, etc.). People consider PHP as a hybrid\
    \ computer language, acquiring the best functionalities of other languages and\
    \ forming a powerful and intuitive scripting language.\n\nIn this chapter, you'll\
    \ learn about the fundamental aspects of PHP such as variables, comments, and\
    \ language structure. Read this material carefully if you want to be an effective\
    \ PHP user.\n\n## HTML Embedding\n\nYou'll use PHP to create dynamic webpages.\
    \ Thus, you should know how to embed it into the most popular scripting language:\
    \ HTML (i.e. HyperText Markup Language). Check the following code:\n\n<HTML>\n\
    \n<HEAD> This is a sample. </HEAD>\n\n<BODY>\n\nThis code wants to greet you:\n\
    \n<?php\n\n  print “Hi, how are you?”;\n\n?>\n\n</BODY>\n\n</HTML>\n\nThis example\
    \ shows you how to embed PHP snippets into HTML codes. Each time the language\
    \ interpreter encounters the “open” tag of PHP (i.e. <?php), it executes the embedded\
    \ code until it reaches the “close” tag (i.e. ?>). Here, PHP will replace the\
    \ PHP snippet with the appropriate output (if any) and pass the non-PHP code (e.g.\
    \ HTML) to the user's website client. If you will run the code given above, your\
    \ screen will show you this:\n\n<HTML>\n\n<HEAD> This is a sample. </HEAD>\n\n\
    <BODY>\n\nThis code wants to greet you:\n\nHi, how are you?\n\n</BODY>\n\n</HTML>\n\
    \n## Comments\n\nYou also need to learn how to add comments to your PHP codes.\
    \ As a programmer, you will use comments to add details and descriptions to your\
    \ work without affecting its output and behavior. The PHP language supports three\
    \ methods of commenting. These methods are:\n\n*   The “Shell” Method (i.e. #)\
    \ - In this method, you'll begin your comments with the hashtag symbol. This symbol\
    \ only works for single-line comments. For example:\n\n\\# This comment is awesome.\n\
    \n*   The “C” Method (e.g. /\\* \\*/) - This method is taken from the C language.\
    \ This option allows you to create multi-line comments. For instance:\n\n/\\*\
    \ This comment\n\nspans\n\nmultiple lines. \\*/\n\n*   The “C++” Method (i.e.\
    \ //) - Use this method when writing a single-line comment. Here's an example:\n\
    \n*   // This is a sample.\n\n## \n\nVariables \n\nThe variables used in PHP are\
    \ different from those of compiled languages (e.g. C, C++, Java, etc.). This difference\
    \ lies in the fact that PHP variables are “weakly typed.” Simply put, PHP allows\
    \ you to use variables even without prior declaration. You don't have to declare\
    \ variables explicitly or assign their type. Thus, you can change the data type\
    \ of your variables whenever you want.\n\nIn the PHP language, you should introduce\
    \ your variables using the dollar sign (i.e. $). You can use letters, numbers,\
    \ and underscores when naming your variables. However, you can't use a number\
    \ as the first character of a variable's name. That means $one\\_apple is valid\
    \ while $1\\_apple isn't.\n\nAs mentioned earlier, PHP lets you use undeclared\
    \ variables. The examples given below will illustrate this idea:\n\n$PI = 3.14159;\n\
    \n$radius = 10;\n\nThis code created two variables without declaring their data\
    \ type. Here, “PI” belongs to the floating-point type while “radius” belongs to\
    \ the integer type.\n\nImportant Note: The PHP language is not compatible with\
    \ global variables. Each variable is local to its scope. If it is created within\
    \ a function, it will disappear once the function no longer exists.\n\nIndirect\
    \ Reference \n\nPHP allows you to access a variable using indirect reference.\
    \ That means you can generate and access a variable by name during runtime. Analyze\
    \ this example:\n\n$car = “BMW”;\n\n$$car = “Z4”;\n\nprint $car;\n\nYour screen\
    \ will display “Z4” if you will run this code snippet. The second line of this\
    \ code accesses the variable named “car” and changes its value. As you can see,\
    \ that line has an extra dollar sign. That sign tells the PHP interpreter that\
    \ you are referring to the value contained by the variable involved. In this example,\
    \ a new variable named “Z4” is generated."
