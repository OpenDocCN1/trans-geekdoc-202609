    \ queries and (2) unbuffered queries. Let's discuss these queries in detail:\n\
    \nBuffered Queries\n\nA buffered query retrieves the result and stores it in the\
    \ client-side machine. If the user will run subsequent queries, his/her requests\
    \ will go through the memory of his local machine first.\n\nThe main advantage\
    \ of a buffered query is that you can search inside it. That means you can control\
    \ the row pointer inside the result set according to your needs (considering that\
    \ the information is stored in the local machine). Its primary disadvantage, on\
    \ the other hand, is that the results require extra memory.\n\nUnbuffered Queries\n\
    \nAn unbuffered query doesn't allow you to move its row pointer. Thus, you have\
    \ to follow the exact sequence of the search results. The advantage offered by\
    \ this query is that it doesn't require excessive storage space. You may collect\
    \ and process data rows once your MySQL server begins to return them. While using\
    \ the result of an unbuffered query, you should get all of the rows using “mysqli\\\
    _fetch\\_row” or free them using “mysqli\\_free\\_result”. Your server won't respond\
    \ to your requests until you issue one of these commands.\n\nThe kind of query\
    \ that you should use depends on your situation. An unbuffered query allows you\
    \ to save lots of computer memory when working with a huge result set. If you\
    \ don't need to sort the search results, you will be able to see the initial row\
    \ of the results through PHP even if MySQL is still running the query. A buffered\
    \ query is convenient since it offers a powerful search functionality. It can\
    \ boost your productivity significantly. Since individual queries will get completed\
    \ quickly, mysql will immediately drain the results and store them in the local\
    \ machine rather than running the search while working on the PHP codes.\n\nAfter\
