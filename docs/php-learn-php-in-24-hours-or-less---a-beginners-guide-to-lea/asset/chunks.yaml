    \ `3 >= 4` evaluates to `false`.\n\n## Logical Operators\n\nThis kind of operator\
    \ converts its operands to Boolean form before performing any comparison. Here\
    \ are the logical operators that PHP supports:\n\n*   **`&&`** - This is called\
