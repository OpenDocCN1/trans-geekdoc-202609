- raw: "*   “<” - Use this operator to determine whether the left-hand operand's value\
    \ is less than that of the right-hand operand. If it is, you will get true. For\
    \ example, “3 < 4” evaluates to true.\n\n*   “<=” - Programmers refer to this\
    \ as the “less than or equal to” operator. It will give you true if the value\
    \ of the left-hand operand is less than or equal to the second operand. For example,\
    \ “3 <= 4” will give you false.\n\n*   “>=” - This is the “greater than or equal\
    \ to” operator. If the value of the left-hand operand is greater than or equal\
    \ to that of the right-hand one, you will get true; otherwise, you will get false.\
    \ For example, “3 >= 4” evaluates to false.\n\nThe Logical Operators \n\nThis\
    \ kind of operator converts its operands to Boolean form before performing any\
    \ comparison. Here are the logical operators that PHP supports:\n\n*   “&&” -\
    \ This is called the “Logical AND” operator. It will give you true if both of\
    \ the operands are true.\n\n*   “||” - Programmers call this the “Logical OR”\
    \ operator. When used in PHP codes, it will give you true if at least one of operands\
    \ is true.\n\n*   “xor” - This is the “Logical XOR” operator. It will give you\
    \ true if only one of the operands is true. Thus, you will get false if both of\
    \ the operands are true or false.\n\nImportant Note: The Logical OR and Logical\
    \ AND operators allow short-circuit evaluation. That means they can give a result\
    \ even without checking the entire expression. Logical OR, for example, will give\
    \ you true if the first operand is true, since its condition has already been\
    \ met (i.e. at least one of the operands should be true). The Logical AND operator,\
    \ on the other hand, will give you false if the first operand is false. It won't\
    \ check the second operand anymore since the assigned condition cannot be met\
    \ no matter what (i.e. both operands should be true). \n\nThe Bitwise Operators\
    \ \n\nA bitwise operator conducts operations on the bitwise form of its operands.\
    \ Unless the operands are strings, they will be converted to their respective\
    \ binary form, and the operation will run. In situations where both of the operands\
    \ are strings, PHP will perform the operation by matching character offsets (e.g.\
    \ the system will treat the characters as binary numbers).\n\n*   “&” - This is\
    \ the “Bitwise AND” operator. It will place 1 in each position where both operands\
    \ have 1.\n\n*   “|” - This operator, known as Bitwise OR, places 1 in positions\
    \ where at least one operand has 1.\n\n*   “^” - Programmers refer to this as\
    \ the “Bitwise XOR” operator. It places 1 in each position where only one of the\
    \ operands has 1.\n\nThe Unary Operators \n\nOperators that belong to this type\
    \ work on single operands.\n\nThe Negation Operators\n\nThese operators reverse\
    \ the current value of its operand. PHP supports two negation operators, which\
    \ are:\n\n*   “!” - Programmers call this the “Logical Negation” operator. It\
    \ will give you true if the operand's value is false. If the value is true, on\
    \ the other hand, this operator will give you false.\n\n*   “~” - This is the\
    \ Bitwise Negation operator. It replaces 0 with 1, and vice versa.\n\nThe Increment\
    \ and Decrement Operators \n\nThese operators have a unique characteristic – they\
    \ work on a variable, not on the stored value.  This is because aside from getting\
    \ the result of an operation, they also change the value stored inside the variable.\
    \ The PHP language supports two increment operators and two decrement operators.\
    \ These are:\n\n*   $sample++ - This is the “Post-increment” operator. It returns\
    \ the current value of the variable and increases it by 1.\n\n*   $sample-- -\
    \ Programmers refer to this operator as “Post-decrement.” Basically, this operator\
    \ gives the current value of a variable before decreasing it by 1.\n\n*   $++sample\
    \ – This operator, which is called “Pre-increment,” increases the value of the\
    \ variable it is attached to and returns the resulting value.\n\n*   $--sample\
    \ – With this operator, you can decrease the value of an operand by one before\
    \ retrieving an output.\n\nThe Cast Operators \n\nPHP offers six cast operators\
    \ that you can use to force type conversions. You should place the operator on\
    \ the left-side of the operand. The list given below shows all of the cast operators\
    \ in PHP:\n\n*   (array) – This operator changes the data type of a value to “array.”\n\
    \n*   (int) or (integer) – Use this operator to convert values into integers.\n\
    \n*   (string) – This is the operator that you should use to create string values\
    \ out of non-string ones.\n\n*   (object) – With this operator, you can tag any\
    \ value as an “object.”\n\n*   (real), (float) or (double) – This operator allows\
    \ you to convert values from any data type into floating-point values.\n\n*  \
    \ (bool) or (boolean) – Use this operator to convert any value into its Boolean\
    \ form.\n\nKeep in mind that a cast operator affects the value of a variable,\
    \ not the variable itself. For instance:\n\n$sample\\_string “10”;\n\n$sample\\\
    _number = (int) $sample\\_string;\n\nIn this example, the variable named $sample\\\
    _number gets the integer 10 as its value. The variable called $sample\\_string,\
    \ however, still belongs to the string type.\n\nThe Ternary Operator \n\nProgrammers\
    \ consider the question mark operator (i.e. ?) as one of the coolest operators\
    \ of any language. In PHP, the format of this operator is:\n\nconditional\\_statement\
    \ ? first\\_expression : second\\_expression\n\nThe “?” operator evaluates the\
    \ result of “conditional\\_statement.” If the result is true, the operator will\
    \ return the value of “first\\_expression.” If the result is false, the operator\
    \ will give you the value of “second\\_expression.”\n\nThe code snippet given\
    \ below will help you to understand how this operator works:\n\n$x = 100;\n\n\
    $sample\\_message = isset($a) ? '$x exists' : '$x doesn't exist';\n\nprint $sample\\\
    _message;\n\nIf you will run this code, your screen will print the following:\n\
    \n“$x exists”\n\n# \n\nChapter 2: The Control Structures \n\nThis programming\
    \ language supports the best control structures offered by other computer languages.\
    \ PHP users divide control structures into two types: conditional control and\
    \ loop control. A conditional control structure influences the program's flow\
    \ and runs or skips certain codes based on predetermined criteria. A loop control\
    \ structure, on the other hand, runs a piece of code multiple times according\
    \ to the criteria set by the programmer. Let's discuss each type of structures\
    \ in detail:\n\n## Conditional Structures\n\nYou need to use conditional statements\
    \ when writing programs. These statements allow your programs to behave differently\
    \ based on the user's inputs and their own “decisions.” In PHP, you can use “if”\
    \ statements and “switch” statements. These statements are two of the most popular\
    \ control structures in computer programming.\n\nThe “if” Statements\n\nThis category\
    \ consists of three statements, namely:\n\n1.  if (conditional\\_expression)\n\
    \nstatement/s\n\n2.  elseif (conditional\\_expression)\n\nstatement/s\n\n3.  elseif\
    \ (conditional\\_expression)\n\nstatement/s\n\n…\n\nelse\n\nstatements\n\nThese\
    \ statements are considered as the most popular conditional constructs in programming\
    \ and scripting. Actually, you'll find them in most computer languages. Each “if”\
    \ statement has a conditional expression known as the “truth expression.” If an\
    \ “if” statement's truth expression results to true, the statement or group of\
    \ statements under it will run; otherwise, they will be ignored.\n\nYou may place\
    \ an “else” clause to your “if” statement to run codes only if the conditional\
    \ expressions you have provided evaluates to false. Here's an example:\n\nif ($sample\
    \ >= 100) {\n\n  print '$sample is within the given range';\n\n  }  else {\n\n\
        print '$sample is invalid';\n\n}\n\nAs you can see, curly braces define the\
    \ statements under each “if” and “else” clauses, turning these statements into\
    \ a “code block.” In this example, you may remove the curly braces since each\
    \ code block holds a single statement. However, it's still best if you will write\
    \ braces in situations where they are completely optional. Braces improve the\
    \ readability of PHP codes."
  fmt: "\n# PHP Operators\n\n## Comparison Operators\n\n*   **`<`** - Use this operator\
