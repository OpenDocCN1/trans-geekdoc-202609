- raw: "Often, programmers have value or key mappings (also known as “lookup dictionaries”)\
    \ in their program framework. This is the reason why PHP offers associative arrays.\
    \ Basically, associative arrays map string and integer values to other PHP-supported\
    \ values. You've learned about it in a previous chapter. To help you remember\
    \ this concept, here's a code snippet that uses an array to search for a user's\
    \ SSN:\n\nprint “Mike's SSN is “ . $sampleMap \\[“Mike”\\];\n\nAssociative arrays\
    \ become extremely useful if the user has all of the information needed. However,\
    \ if you are dealing with millions of database entries, loading the whole database\
    \ to the $sampleMap associative array to search for a single user is impractical.\
    \ Here, you should create a new method that can search for the person's SSN through\
    \ a database invocation. You can use this approach to rewrite the code snippet\
    \ given above. The new code will look like this:\n\nprint “Mike's SSN is “ . $database→LocateSSN\
    \ (“Mike”);\n\nThis approach works perfectly. However, many programmers opt to\
    \ use the associative syntax when accessing value/key dictionaries. Because of\
    \ this, PHP allow you to overload objects so they behave like typical arrays.\
    \ You can use the syntax of associative arrays, but actually, PHP will call a\
    \ method you wrote, which will run the appropriate database invocation and retrieve\
    \ the needed data.\n\nThe method you want to use for accessing value/key dictionaries\
    \ is up to you. In some cases, it is better to utilize the overloading capability\
    \ of PHP than to invoke methods through verbose codes. In the end, the method\
    \ that you should use depends on your needs and preferences.\n\n## \n\nThe Iterators\
    \ \n\nYou can use the foreach() loop to iterate an object's properties. Here's\
    \ an example:\n\nclass YourClass {\n\n  public $personName = “Mike”;\n\n  public\
    \ $personSex = “male”;\n\n}\n\n$object = new YourClass();\n\nforeach ($object\
    \ as $sampleKey => $sampleValue) {\n\n  print “object \\[$sampleKey\\] = $sampleValue\\\
    \\n”;\n\n}\n\nThis script prints the following message:\n\nobject \\[sampleName\\\
    ] = Mike\n\nobject \\[sampleSex\\] = male\n\nWhile writing object-oriented scripts,\
    \ however, your class might not represent a basic array like the one given above.\
    \ Your code might contain complex information, such as configuration files or\
    \ database queries.\n\nThe PHP language lets you overload the foreach() iteration's\
    \ behavior inside your code. That means you can use foreach() statements according\
    \ to the needs of your program.\n\n## \n\nThe Design Patterns \n\nYou'll encounter\
    \ certain problems while designing your programs. Expert programmers have addressed\
    \ and solved some of these problems, known as “design patterns.” Basically, design\
    \ patterns provide programmers with a common approach to program design. You've\
    \ probably heard application developers say, “This project requires the singleton\
    \ scheme.” In this part of the book, you'll learn about the most important design\
    \ patterns. Read this material carefully – it will help you learn PHP in just\
    \ 24 hours.\n\nThe Strategy Pattern\n\nProgrammers use this pattern when they\
    \ need an algorithm that can be interchanged with different variants. For instance,\
    \ if your code generates an image, you might want to generate GIF files now and\
    \ JPEG ones later.\n\nOften, programmers implement this pattern by declaring a\
    \ base class using an algorithm-based method. The program will implement this\
    \ method by inheriting one or more concrete classes. Somewhere inside the code,\
    \ the programmer will decide which concrete strategy must be used. PHP will substantiate\
    \ that strategy and use it wherever appropriate.\n\nThe example given below shows\
    \ how download servers can choose a file selection scheme based on the web browser\
    \ that accesses them. While generating the HTML containing the download buttons,\
    \ it will generate links to .zip or .tar.gz files based on the OS (i.e. operating\
    \ system) identification of the web browser. To keep things simple, assume that\
    \ when “Win32” exists in $\\_server\\[“HTTPS\\_USER\\_AGENT”\\], you are working\
    \ with a Windows computer and need to generate .zip download links; otherwise,\
    \ you're working with a computer system that needs .tar.gz links.\n\nThis example\
    \ involves two different strategies: .zip and .tar.gz. Analyze the following code:\
    \ it will show you how to write effective strategy patterns:\n\nabstract class\
    \ FileSelectionStrategy {\n\n  abstract function generateLink ($nameOfFile);\n\
    \n}\n\nclass ZipStrategy extends FileSelectionStrategy {\n\n  function generateLink\
    \ ($nameOfFile)\n\n  {\n\n    return “[https://downloads.samplesite.com/$nameOfFile.zip](https://downloads.samplesite.com/$nameOfFile.zip)”;\n\
    \n  }\n\n}\n\nclass TarGzStrategy extends FileSelectionStrategy {\n\n  function\
    \ generateLink ($nameOfFile)\n\n  {\n\n    return “[https://downloads.samplesite.com/$nameOfFile.tar.gz](https://downloads.samplesite.com/$nameOfFile.tar.gz)”;\n\
    \n  }\n\n}\n\nif (strstr($\\_SERVER \\[“HTTPS\\_USER\\_AGENT”\\], “Win32”)) {\n\
    \n  $selectionObject = new ZipStrategy();\n\n} else {\n\n  $selectionObject =\
    \ new TarGzStrategy();\n\n}\n\n$mark\\_filename = $selectionObject→generateLink\
    \ (“Marketing101”);\n\n$sales\\_filename = $selectionObject→generateLink (“Sales101”);\n\
    \nprint <<<EOF\n\n<h1>These free eBooks will help you become a better entrepreneur</h1>\n\
    \n<br>\n\n<a href=”mark\\_filename”>An eBook that focuses on marketing</a><br>\n\
    \n<a href=”sales\\_filename”>An excellent resource for sales-related concerns</a><br>\n\
    \n<br>\n\nEOF;\n\nIf you will access this script using a Windows machine, you'll\
    \ get the following output:\n\n<h1>These free eBooks will help you become a better\
    \ entrepreneur</h1>\n\n<br>\n\n<a href=”[https://downloads.samplesite.com/Marketing101.zip](https://downloads.samplesite.com/Marketing101.zip)”>An\
    \ eBook that focuses on marketing<a><br>\n\n<a href=”[https://downloads.samplesite.com/Sales101.zip](https://downloads.samplesite.com/Sales101.zip)\\\
    >An excellent resource for sales-related concerns</a><br>\n\n<br>\n\n6.3.2 The\
    \ Singleton Pattern \n\nThis is one of the most popular patterns in software design.\
    \ Programmers often encounter situations where they have objects that handle certain\
    \ centralized operations in the program (e.g. logger objects). In these situations,\
    \ programmers prefer to keep things simple by creating a program-wide instance\
    \ that can be accessed by any part of the source code. Particularly, when dealing\
    \ with logger objects, you need each part of the application to access that instance,\
    \ and allow the logging mechanism/s manage log messages based on log level configuration.\
    \ The singleton design pattern is your best bet when facing this kind of situation.\n\
    \nYou can convert your classes into singleton classes by implementing “getInstance()”.\
    \ Basically, “getInstance()” is a static method that returns the lone instance\
    \ of a class. If you will invoke this method for the first time, it will generate\
    \ an instance, save that in a static variable, and return that instance to you.\
    \ Subsequent calls to the “getInstance()” method returns the handle of the instance\
    \ created before. Analyze the following example:\n\nclass SampleLogger {\n\n \
    \ static function getInstance()\n\n  {\n\n    if (self: :$sampleInstance == NULL)\
    \ {\n\n      self: :$sampleInstance = new SampleLogger();\n\n    }\n\n    return\
    \ self: :$sampleInstance;\n\n  }\n\n  private function \\_construct ()\n\n  {\n\
    \n  }\n\n  private function \\_clone ()\n\n  {\n\n  }\n\n  function Log ($sampleString)\n\
    \n  {\n\n    // This code takes care of log-related processes.\n\n  }\n\n  static\
    \ private $sampleInstance = NULL;\n\n}\n\nsampleLogger: :getInstance () →Log (“Check”);\n\
    \nThe important part of this code is “sampleLogger: :getInstance ()”. This part\
    \ allows you to access the “logger” from any part of your code.\n\nFor this application,”clone”\
    \ and “constructor” are tagged as private methods. This approach makes sure that\
    \ the programmer won't create another instance of the sampleLogger class mistakenly.\
    \ Simply put, “getInstance()” serves as the only way for you to access an instance\
    \ of the class.\n\nThe Factory Pattern "
  fmt: "\n程序员通常在程序框架中拥有值或键的映射（也称为“查找字典”）。这就是 PHP 提供关联数组的原因。基本上，关联数组将字符串和整数值映射到其他 PHP\
    \ 支持的值。您已在前一章中了解过它。为了帮助您记住这个概念，这里有一个使用数组搜索用户 SSN 的代码片段：\n\n```php\nprint \"Mike's\
    \ SSN is \" . $sampleMap[\"Mike\"];\n```\n\n如果用户拥有所有所需信息，关联数组将变得极其有用。但是，如果您处理数百万数据库条目，将整个数据库加载到\
    \ `$sampleMap` 关联数组中以搜索单个用户是不切实际的。此时，您应该创建一个新方法，通过数据库调用来搜索该人的 SSN。您可以使用这种方法重写上面给出的代码片段。新代码将如下所示：\n\
    \n```php\nprint \"Mike's SSN is \" . $database->LocateSSN(\"Mike\");\n```\n\n\
    这种方法工作完美。然而，许多程序员在访问值/键字典时选择使用关联数组语法。因此，PHP 允许您重载对象，使其表现得像典型数组一样。您可以使用关联数组的语法，但实际上\
    \ PHP 将调用您编写的方法，该方法将运行适当的数据库调用并检索所需数据。\n\n您想用于访问值/键字典的方法取决于您自己。在某些情况下，利用 PHP 的重载能力比通过冗长的代码调用方法更好。最终，您应该使用的方法取决于您的需求和偏好。\n\
    \n## 迭代器\n\n您可以使用 `foreach()` 循环来迭代对象的属性。这是一个示例：\n\n```php\nclass YourClass {\n\
    \    public $personName = \"Mike\";\n    public $personSex = \"male\";\n}\n\n\
    $object = new YourClass();\n\nforeach ($object as $sampleKey => $sampleValue)\
    \ {\n    print \"object [$sampleKey] = $sampleValue\\n\";\n}\n```\n\n此脚本输出以下信息：\n\
    \n```text\nobject [sampleName] = Mike\nobject [sampleSex] = male\n```\n\n然而，在编写面向对象脚本时，您的类可能不表示像上面那样的基本数组。您的代码可能包含复杂信息，例如配置文件或数据库查询。\n\
    \nPHP 语言允许您在代码内部重载 `foreach()` 迭代的行为。这意味着您可以根据程序的需要使用 `foreach()` 语句。\n\n## 设计模式\n\
    \n在设计程序时，您会遇到某些问题。专家程序员已经解决了其中一些问题，这些解决方案被称为“设计模式”。基本上，设计模式为程序员提供了一种通用的程序设计方法。您可能听过应用程序开发人员说：“这个项目需要单例模式。”在本书的这一部分，您将了解最重要的设计模式。请仔细阅读这些材料——它们将帮助您在\
    \ 24 小时内学会 PHP。\n\n### 策略模式\n\n当程序员需要一种可以与不同变体互换的算法时，会使用此模式。例如，如果您的代码生成图像，您可能现在想生成\
    \ GIF 文件，稍后想生成 JPEG 文件。\n\n通常，程序员通过使用基于算法的方法声明一个基类来实现此模式。程序将通过继承一个或多个具体类来实现此方法。在代码的某处，程序员将决定必须使用哪个具体策略。PHP\
    \ 将实例化该策略，并在适当的地方使用它。\n\n下面给出的示例展示了下载服务器如何根据访问它们的 Web 浏览器选择文件选择方案。在生成包含下载按钮的 HTML\
    \ 时，它将根据 Web 浏览器的操作系统（即 OS）标识生成指向 `.zip` 或 `.tar.gz` 文件的链接。为保持简单，假设当 `$_SERVER[\"\
    HTTPS_USER_AGENT\"]` 中存在“Win32”时，您正在使用 Windows 计算机，需要生成 `.zip` 下载链接；否则，您正在使用需要\
    \ `.tar.gz` 链接的计算机系统。\n\n此示例涉及两种不同的策略：`.zip` 和 `.tar.gz`。分析以下代码：它将向您展示如何编写有效的策略模式：\n\
    \n```php\nabstract class FileSelectionStrategy {\n    abstract function generateLink($nameOfFile);\n\
    }\n\nclass ZipStrategy extends FileSelectionStrategy {\n    function generateLink($nameOfFile)\
    \ {\n        return \"https://downloads.samplesite.com/$nameOfFile.zip\";\n  \
    \  }\n}\n\nclass TarGzStrategy extends FileSelectionStrategy {\n    function generateLink($nameOfFile)\
    \ {\n        return \"https://downloads.samplesite.com/$nameOfFile.tar.gz\";\n\
    \    }\n}\n\nif (strstr($_SERVER[\"HTTPS_USER_AGENT\"], \"Win32\")) {\n    $selectionObject\
    \ = new ZipStrategy();\n} else {\n    $selectionObject = new TarGzStrategy();\n\
    }\n\n$mark_filename = $selectionObject->generateLink(\"Marketing101\");\n$sales_filename\
    \ = $selectionObject->generateLink(\"Sales101\");\n\nprint <<<EOF\n<h1>These free\
    \ eBooks will help you become a better entrepreneur</h1>\n<br>\n<a href=\"$mark_filename\"\
    >An eBook that focuses on marketing</a><br>\n<a href=\"$sales_filename\">An excellent\
    \ resource for sales-related concerns</a><br>\n<br>\nEOF;\n```\n\n如果您使用 Windows\
    \ 机器访问此脚本，将获得以下输出：\n\n```html\n<h1>These free eBooks will help you become a better\
    \ entrepreneur</h1>\n<br>\n<a href=\"https://downloads.samplesite.com/Marketing101.zip\"\
    >An eBook that focuses on marketing</a><br>\n<a href=\"https://downloads.samplesite.com/Sales101.zip\"\
    >An excellent resource for sales-related concerns</a><br>\n<br>\n```\n\n### 单例模式\n\
    \n这是软件设计中最流行的模式之一。程序员经常遇到这样的情况：他们拥有处理程序中某些集中操作的对象（例如记录器对象）。在这些情况下，程序员倾向于通过创建一个程序范围内的实例来保持简单，该实例可以被源代码的任何部分访问。特别是在处理记录器对象时，您需要应用程序的每个部分都能访问该实例，并允许记录机制根据日志级别配置管理日志消息。单例设计模式是应对这种情况的最佳选择。\n\
    \n您可以通过实现 `getInstance()` 将类转换为单例类。基本上，`getInstance()` 是一个静态方法，返回类的唯一实例。如果您第一次调用此方法，它将生成一个实例，将其保存在静态变量中，并将该实例返回给您。后续对\
    \ `getInstance()` 方法的调用将返回之前创建的实例的句柄。分析以下示例：\n\n```php\nclass SampleLogger {\n\
    \    static function getInstance() {\n        if (self::$sampleInstance == NULL)\
    \ {\n            self::$sampleInstance = new SampleLogger();\n        }\n    \
    \    return self::$sampleInstance;\n    }\n\n    private function __construct()\
    \ {\n    }\n\n    private function __clone() {\n    }\n\n    function Log($sampleString)\
    \ {\n        // This code takes care of log-related processes.\n    }\n\n    static\
    \ private $sampleInstance = NULL;\n}\n\nSampleLogger::getInstance()->Log(\"Check\"\
    );\n```\n\n这段代码的重要部分是 `SampleLogger::getInstance()`。这部分允许您从代码的任何部分访问“记录器”。\n\n\
    对于此应用程序，“clone”和“constructor”被标记为私有方法。这种方法确保程序员不会错误地创建 `SampleLogger` 类的另一个实例。简单来说，`getInstance()`\
    \ 是您访问该类实例的唯一途径。\n\n### 工厂模式\n"
  trans: "\n程序员通常在程序框架中拥有值或键的映射（也称为“查找字典”）。这就是 PHP 提供关联数组的原因。基本上，关联数组将字符串和整数值映射到其他\
    \ PHP 支持的值。您已在前一章中了解过它。为了帮助您记住这个概念，这里有一个使用数组搜索用户 SSN 的代码片段：\n\n```php\nprint \"\
    Mike's SSN is \" . $sampleMap[\"Mike\"];\n```\n\n如果用户拥有所有所需信息，关联数组将变得极其有用。但是，如果您处理数百万数据库条目，将整个数据库加载到\
    \ `$sampleMap` 关联数组中以搜索单个用户是不切实际的。此时，您应该创建一个新方法，通过数据库调用来搜索该人的 SSN。您可以使用这种方法重写上面给出的代码片段。新代码将如下所示：\n\
    \n```php\nprint \"Mike's SSN is \" . $database->LocateSSN(\"Mike\");\n```\n\n\
    这种方法工作完美。然而，许多程序员在访问值/键字典时选择使用关联数组语法。因此，PHP 允许您重载对象，使其表现得像典型数组一样。您可以使用关联数组的语法，但实际上\
    \ PHP 将调用您编写的方法，该方法将运行适当的数据库调用并检索所需数据。\n\n您想用于访问值/键字典的方法取决于您自己。在某些情况下，利用 PHP 的重载能力比通过冗长的代码调用方法更好。最终，您应该使用的方法取决于您的需求和偏好。\n\
    \n## 迭代器\n\n您可以使用 `foreach()` 循环来迭代对象的属性。这是一个示例：\n\n```php\nclass YourClass {\n\
    \    public $personName = \"Mike\";\n    public $personSex = \"male\";\n}\n\n\
    $object = new YourClass();\n\nforeach ($object as $sampleKey => $sampleValue)\
    \ {\n    print \"object [$sampleKey] = $sampleValue\\n\";\n}\n```\n\n此脚本输出以下信息：\n\
    \n```text\nobject [sampleName] = Mike\nobject [sampleSex] = male\n```\n\n然而，在编写面向对象脚本时，您的类可能不表示像上面那样的基本数组。您的代码可能包含复杂信息，例如配置文件或数据库查询。\n\
    \nPHP 语言允许您在代码内部重载 `foreach()` 迭代的行为。这意味着您可以根据程序的需要使用 `foreach()` 语句。\n\n## 设计模式\n\
    \n在设计程序时，您会遇到某些问题。专家程序员已经解决了其中一些问题，这些解决方案被称为“设计模式”。基本上，设计模式为程序员提供了一种通用的程序设计方法。您可能听过应用程序开发人员说：“这个项目需要单例模式。”在本书的这一部分，您将了解最重要的设计模式。请仔细阅读这些材料——它们将帮助您在\
    \ 24 小时内学会 PHP。\n\n### 策略模式\n\n当程序员需要一种可以与不同变体互换的算法时，会使用此模式。例如，如果您的代码生成图像，您可能现在想生成\
    \ GIF 文件，稍后想生成 JPEG 文件。\n\n通常，程序员通过使用基于算法的方法声明一个基类来实现此模式。程序将通过继承一个或多个具体类来实现此方法。在代码的某处，程序员将决定必须使用哪个具体策略。PHP\
    \ 将实例化该策略，并在适当的地方使用它。\n\n下面给出的示例展示了下载服务器如何根据访问它们的 Web 浏览器选择文件选择方案。在生成包含下载按钮的 HTML\
    \ 时，它将根据 Web 浏览器的操作系统（即 OS）标识生成指向 `.zip` 或 `.tar.gz` 文件的链接。为保持简单，假设当 `$_SERVER[\"\
    HTTPS_USER_AGENT\"]` 中存在“Win32”时，您正在使用 Windows 计算机，需要生成 `.zip` 下载链接；否则，您正在使用需要\
    \ `.tar.gz` 链接的计算机系统。\n\n此示例涉及两种不同的策略：`.zip` 和 `.tar.gz`。分析以下代码：它将向您展示如何编写有效的策略模式：\n\
    \n```php\nabstract class FileSelectionStrategy {\n    abstract function generateLink($nameOfFile);\n\
    }\n\nclass ZipStrategy extends FileSelectionStrategy {\n    function generateLink($nameOfFile)\
    \ {\n        return \"https://downloads.samplesite.com/$nameOfFile.zip\";\n  \
    \  }\n}\n\nclass TarGzStrategy extends FileSelectionStrategy {\n    function generateLink($nameOfFile)\
    \ {\n        return \"https://downloads.samplesite.com/$nameOfFile.tar.gz\";\n\
    \    }\n}\n\nif (strstr($_SERVER[\"HTTPS_USER_AGENT\"], \"Win32\")) {\n    $selectionObject\
    \ = new ZipStrategy();\n} else {\n    $selectionObject = new TarGzStrategy();\n\
    }\n\n$mark_filename = $selectionObject->generateLink(\"Marketing101\");\n$sales_filename\
    \ = $selectionObject->generateLink(\"Sales101\");\n\nprint <<<EOF\n<h1>These free\
    \ eBooks will help you become a better entrepreneur</h1>\n<br>\n<a href=\"$mark_filename\"\
    >An eBook that focuses on marketing</a><br>\n<a href=\"$sales_filename\">An excellent\
    \ resource for sales-related concerns</a><br>\n<br>\nEOF;\n```\n\n如果您使用 Windows\
    \ 机器访问此脚本，将获得以下输出：\n\n```html\n<h1>These free eBooks will help you become a better\
    \ entrepreneur</h1>\n<br>\n<a href=\"https://downloads.samplesite.com/Marketing101.zip\"\
    >An eBook that focuses on marketing</a><br>\n<a href=\"https://downloads.samplesite.com/Sales101.zip\"\
    >An excellent resource for sales-related concerns</a><br>\n<br>\n```\n\n### 单例模式\n\
    \n这是软件设计中最流行的模式之一。程序员经常遇到这样的情况：他们拥有处理程序中某些集中操作的对象（例如记录器对象）。在这些情况下，程序员倾向于通过创建一个程序范围内的实例来保持简单，该实例可以被源代码的任何部分访问。特别是在处理记录器对象时，您需要应用程序的每个部分都能访问该实例，并允许记录机制根据日志级别配置管理日志消息。单例设计模式是应对这种情况的最佳选择。\n\
    \n您可以通过实现 `getInstance()` 将类转换为单例类。基本上，`getInstance()` 是一个静态方法，返回类的唯一实例。如果您第一次调用此方法，它将生成一个实例，将其保存在静态变量中，并将该实例返回给您。后续对\
    \ `getInstance()` 方法的调用将返回之前创建的实例的句柄。分析以下示例：\n\n```php\nclass SampleLogger {\n\
    \    static function getInstance() {\n        if (self::$sampleInstance == NULL)\
    \ {\n            self::$sampleInstance = new SampleLogger();\n        }\n    \
    \    return self::$sampleInstance;\n    }\n\n    private function __construct()\
    \ {\n    }\n\n    private function __clone() {\n    }\n\n    function Log($sampleString)\
    \ {\n        // This code takes care of log-related processes.\n    }\n\n    static\
    \ private $sampleInstance = NULL;\n}\n\nSampleLogger::getInstance()->Log(\"Check\"\
    );\n```\n\n这段代码的重要部分是 `SampleLogger::getInstance()`。这部分允许您从代码的任何部分访问“记录器”。\n\n\
    对于此应用程序，“clone”和“constructor”被标记为私有方法。这种方法确保程序员不会错误地创建 `SampleLogger` 类的另一个实例。简单来说，`getInstance()`\
    \ 是您访问该类实例的唯一途径。\n\n### 工厂模式\n"
