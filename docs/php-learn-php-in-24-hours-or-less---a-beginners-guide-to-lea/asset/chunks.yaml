- raw: "As mentioned earlier, PHP converts data types automatically. You should know\
    \ that data types are often converted to Boolean during runtime. That's because\
    \ in conditional codes (e.g.  loops, “if” statements, etc.), the system will convert\
    \ the data types involved into Boolean to see whether they satisfy the given condition.\
    \ In addition, the comparison operators of PHP produce Boolean values. Analyze\
    \ the following snippet:\n\n$first\\_value = 3;\n\n$second\\_value = 4;\n\nif\
    \ ($second\\_value > $first\\_value) {\n\n  print “The second value is greater\
    \ than the first one\\\\n.”;\n\n}\n\nHere, the system will check whether the condition\
    \ is met. The result is a Boolean value (i.e. either true or false). If the conditional\
    \ statement evaluates to true, the command included inside the curly braces will\
    \ run.\n\nNull \n\nThis data type can only have one value, which is “NULL.” You\
    \ will use this type to mark empty variables. If you are working with databases,\
    \ you can use “Null” to differentiate invalid values and empty strings.\n\nThe\
    \ isset() operator of this language gives false for Null values if the variable\
    \ being checked exists. When used on other data types, however, isset() will give\
    \ you true if the variable exists.\n\nResource\n\nThis is considered as a special\
    \ type of data. It represents an extension resource of PHP such as an open file.\
    \ Keep in mind that you won't handle a resource variable directly. Rather, you\
    \ will simply send it to different functions that can interact with the involved\
    \ resource.\n\nArrays\n\nIn the PHP language, an array is a group of value/key\
    \ pairs: it indexes keys to their respective values. An array index can take the\
    \ form of a string or integer while values can belong to any data type (even other\
    \ arrays).\n\n*   Declaring an Array – You can use the array() construct when\
    \ declaring an array. This construct requires the following syntax:\n\narray(\\\
    [key\\_to\\_be\\_used =>\\] value, \\[key\\_to\\_be\\_used =>\\] value, ...)\n\
    \nIn this syntax, the “key\\_to\\_be\\_used” entry is completely optional. If\
    \ you won't specify the key, the system will automatically create one for you.\
    \ The key will be the highest available integer plus one. PHP allows you to mix\
    \ keyed and non-keyed arrays inside a single declaration.\n\n*   Accessing an\
    \ Array Element - You need to use the $arr\\[key\\] syntax to access an array\
    \ element. In this syntax, “key” can be a string or an integer. Make sure that\
    \ you will include the quotation marks while using constant strings as keys (e.g.\
    \ $arr\\[“string”\\]. This syntax is extremely useful: you can use it to read\
    \ existing elements or create new ones.\n\n## \n\nConstants \n\nWhile using PHP,\
    \ you can set names, known as constants, for basic values. Just like in other\
    \ languages, you can't alter a PHP constant once you have assigned its value.\
    \ The rules for naming a constant are almost identical to those used in naming\
    \ a variable. The only difference is that a constant doesn't need a dollar sign\
    \ before its name. When declaring constants, most programmers opt for uppercase\
    \ letters. This approach helps them to achieve readability for their codes.\n\n\
    PHP allows you to access a constant at any part of your code. That means you don't\
    \ need to declare them in each of your functions and PHP files. Here's the function\
    \ that you should use when defining a constant:\n\ndefine(“NAME\\_OF\\_CONSTANT”,\
    \ value)\n\nWhere:\n\n*   “NAME\\_OF\\_CONSTANT” is a typical string that consists\
    \ of letters and numbers.\n\n*   value is any PHP expression except objects and\
    \ arrays.\n\nThe code snippet given below will show you how to define and use\
    \ constants:\n\ndefine(“OK” 0);\n\ndefine(“ERROR”, 1);\n\nif ($errorcode == ERROR)\
    \ {\n\n  print(“An error has occured\\\\n”);\n\n}\n\n## \n\nOperators \n\nThe\
    \ PHP language supports three kinds of operators: unary, binary and ternary.\n\
    \nA binary operator requires two operands. For example:\n\n1 + 5\n\n13 \\* 3.14\n\
    \n$x / 10\n\nKeep in mind that you can only conduct a binary operation on values\
    \ that belong to the same data type. If the operands you're working on have different\
    \ data types (e.g. string and integer), the PHP language will perform automatic\
    \ conversion. Thus, it will convert a data type to a different one to attain consistency.\
    \ This automatic conversion works this way:\n\n*   If you are working with an\
    \ integer and a floating-point number, the former will be converted to the data\
    \ type of the latter.\n\n*   If you are dealing with a string and an integer,\
    \ PHP will convert the former.\n\n*   If you're working on a real value and a\
    \ string, PHP will convert the latter.\n\nThe Binary Operators\n\nThe Assignment\
    \ Operators\n\nAn assignment operator allows you to assign values to your variables.\
    \ Here, you should write the variable's name on the left-hand side of the expression.\
    \ Place the value you want to assign at the right-hand side of the expression.\
    \ For instance, in the expression $sample = 10, you will assign 10 to the variable\
    \ named “sample.”\n\nAside from “=”, there are various assignment operators that\
    \ you can use in PHP. These operators, which involve certain mathematical symbols,\
    \ perform an operation and give the result to the left-hand operand. Here are\
    \ some examples:\n\n*   $counter += 1;  /\\* In this expression, PHP will add\
    \ 1 to the current value of the counter. Then, it will assign the sum as the new\
    \ value of that variable. \\*/\n\n*   $fund -= $expenses;  /\\* Here, PHP will\
    \ deduct the value of a variable named expenses from that of “fund” and assign\
    \ the difference as the latter's new value. \\*/\n\nPHP supports the following\
    \ assignment operators:\n\n\\=, -=, /=, \\*=, +=, .=, |=, >>=, <<=, &=,  ^=, and\
    \ &=\n\nThe Numeric Operators \n\nIn general, binary operators require numeric\
    \ operands. If you are dealing with nulls, strings, resources, or Booleans, the\
    \ system will convert the values to numbers before performing any calculation.\
    \ Here are the numeric operators that you will find in PHP:\n\n*   “+” - This\
    \ is called the “Addition” operator. It adds the values of two operands and returns\
    \ the sum.\n\n*   “-” - Programmers refer to this as the “Subtraction” operator.\
    \ It deducts the value of the right-hand operand from that of the left-hand operand\
    \ and returns the difference.\n\n*   “\\*” -  This is the “Multiplication” operator.\
    \ It multiplies the values of two operands and returns the product.\n\n*   “/”\
    \ - With this operator, you can divide the value of the left-hand operand by that\
    \ of the right-hand operand and returns the quotient.\n\n*   “%” - This is the\
    \ “Modulus” operator. It divides the value of the left-hand operand by that of\
    \ the right-hand operand and returns the remainder.\n\nThe Concatenation Operator\
    \ \n\nThis operator allows you to concatenate strings. Since it only works on\
    \ string values, it converts non-string operands before doing any operation. The \
    \ code snippet given below will give you “My favorite number is 23”:\n\n$favorite\\\
    _number = 23;\n\nprint “My favorite number is ” . $favorite\\_number;\n\nThe concatenation\
    \ operator converts the integer $favorite\\_number to a string (i.e. “23”) before\
    \ combining the operands.\n\nThe Comparison Operators \n\nYou can use these operators\
    \ to compare the values of two operands. If you are dealing with two string operands,\
    \ PHP will perform the comparison in a lexicographical manner. Thus, it will give\
    \ a Boolean result. The comparison operators listed below perform automatic data\
    \ type conversions whenever necessary:\n\n*   “==” - This operator checks whether\
    \ the operands have equal values. It will give you true if the values are equal.\
    \ For example, “3 == 4” evaluates to false.\n\n*   “!=” - This is the exact opposite\
    \ of the previous operator. It will give you true if the values inside the operands\
    \ are not equal. For instance, “3 != 4” evaluates to true.\n\n*   “>” - With this\
    \ operator, you can check whether the value of the left-hand operand is greater\
    \ than that of the right-hand operand. If so, you will get true as the result.\
    \ For instance, “3 > 4” will give you false."
  fmt: "\n# PHP Data Types and Operators\n\n## Automatic Type Conversion to Boolean\n\
    \nAs mentioned earlier, PHP converts data types automatically. You should know\
    \ that data types are often converted to Boolean during runtime. That's because\
    \ in conditional codes (e.g., loops, `if` statements, etc.), the system will convert\
    \ the data types involved into Boolean to see whether they satisfy the given condition.\
    \ In addition, the comparison operators of PHP produce Boolean values. Analyze\
    \ the following snippet:\n\n```\n$first_value = 3;\n$second_value = 4;\n\nif ($second_value\
    \ > $first_value) {\n    print \"The second value is greater than the first one\\\
    n.\";\n}\n```\n\nHere, the system will check whether the condition is met. The\
    \ result is a Boolean value (i.e., either `true` or `false`). If the conditional\
    \ statement evaluates to `true`, the command included inside the curly braces\
    \ will run.\n\n## Null\n\nThis data type can only have one value, which is `NULL`.\
    \ You will use this type to mark empty variables. If you are working with databases,\
    \ you can use `Null` to differentiate invalid values and empty strings.\n\nThe\
    \ `isset()` operator of this language gives `false` for `Null` values if the variable\
    \ being checked exists. When used on other data types, however, `isset()` will\
    \ give you `true` if the variable exists.\n\n## Resource\n\nThis is considered\
    \ as a special type of data. It represents an extension resource of PHP such as\
    \ an open file. Keep in mind that you won't handle a resource variable directly.\
    \ Rather, you will simply send it to different functions that can interact with\
    \ the involved resource.\n\n## Arrays\n\nIn the PHP language, an array is a group\
    \ of value/key pairs: it indexes keys to their respective values. An array index\
    \ can take the form of a string or integer while values can belong to any data\
    \ type (even other arrays).\n\n### Declaring an Array\n\nYou can use the `array()`\
    \ construct when declaring an array. This construct requires the following syntax:\n\
    \n```\narray([key_to_be_used =>] value, [key_to_be_used =>] value, ...)\n```\n\
    \nIn this syntax, the `key_to_be_used` entry is completely optional. If you won't\
    \ specify the key, the system will automatically create one for you. The key will\
    \ be the highest available integer plus one. PHP allows you to mix keyed and non-keyed\
    \ arrays inside a single declaration.\n\n### Accessing an Array Element\n\nYou\
    \ need to use the `$arr[key]` syntax to access an array element. In this syntax,\
    \ `key` can be a string or an integer. Make sure that you will include the quotation\
    \ marks while using constant strings as keys (e.g., `$arr[\"string\"]`). This\
    \ syntax is extremely useful: you can use it to read existing elements or create\
    \ new ones.\n\n## Constants\n\nWhile using PHP, you can set names, known as constants,\
    \ for basic values. Just like in other languages, you can't alter a PHP constant\
    \ once you have assigned its value. The rules for naming a constant are almost\
    \ identical to those used in naming a variable. The only difference is that a\
    \ constant doesn't need a dollar sign before its name. When declaring constants,\
    \ most programmers opt for uppercase letters. This approach helps them to achieve\
    \ readability for their codes.\n\nPHP allows you to access a constant at any part\
    \ of your code. That means you don't need to declare them in each of your functions\
    \ and PHP files. Here's the function that you should use when defining a constant:\n\
    \n```\ndefine(\"NAME_OF_CONSTANT\", value)\n```\n\nWhere:\n\n*   `NAME_OF_CONSTANT`\
    \ is a typical string that consists of letters and numbers.\n*   `value` is any\
    \ PHP expression except objects and arrays.\n\nThe code snippet given below will\
    \ show you how to define and use constants:\n\n```\ndefine(\"OK\", 0);\ndefine(\"\
    ERROR\", 1);\n\nif ($errorcode == ERROR) {\n    print(\"An error has occured\\\
    n\");\n}\n```\n\n## Operators\n\nThe PHP language supports three kinds of operators:\
    \ unary, binary and ternary.\n\n### Binary Operators\n\nA binary operator requires\
    \ two operands. For example:\n\n```\n1 + 5\n13 * 3.14\n$x / 10\n```\n\nKeep in\
    \ mind that you can only conduct a binary operation on values that belong to the\
    \ same data type. If the operands you're working on have different data types\
    \ (e.g., string and integer), the PHP language will perform automatic conversion.\
    \ Thus, it will convert a data type to a different one to attain consistency.\
    \ This automatic conversion works this way:\n\n*   If you are working with an\
    \ integer and a floating-point number, the former will be converted to the data\
    \ type of the latter.\n*   If you are dealing with a string and an integer, PHP\
    \ will convert the former.\n*   If you're working on a real value and a string,\
    \ PHP will convert the latter.\n\n#### The Assignment Operators\n\nAn assignment\
    \ operator allows you to assign values to your variables. Here, you should write\
    \ the variable's name on the left-hand side of the expression. Place the value\
    \ you want to assign at the right-hand side of the expression. For instance, in\
    \ the expression `$sample = 10`, you will assign `10` to the variable named `sample`.\n\
    \nAside from `=`, there are various assignment operators that you can use in PHP.\
    \ These operators, which involve certain mathematical symbols, perform an operation\
    \ and give the result to the left-hand operand. Here are some examples:\n\n* \
    \  `$counter += 1;` `/* In this expression, PHP will add 1 to the current value\
    \ of the counter. Then, it will assign the sum as the new value of that variable.\
    \ */`\n*   `$fund -= $expenses;` `/* Here, PHP will deduct the value of a variable\
    \ named expenses from that of \"fund\" and assign the difference as the latter's\
    \ new value. */`\n\nPHP supports the following assignment operators:\n\n`=`, `-=`,\
    \ `/=`, `*=`, `+=`, `.=`, `|=`, `>>=`, `<<=`, `&=`, `^=`, and `&=`\n\n#### The\
    \ Numeric Operators\n\nIn general, binary operators require numeric operands.\
    \ If you are dealing with nulls, strings, resources, or Booleans, the system will\
    \ convert the values to numbers before performing any calculation. Here are the\
    \ numeric operators that you will find in PHP:\n\n*   `+` - This is called the\
    \ \"Addition\" operator. It adds the values of two operands and returns the sum.\n\
    *   `-` - Programmers refer to this as the \"Subtraction\" operator. It deducts\
    \ the value of the right-hand operand from that of the left-hand operand and returns\
    \ the difference.\n*   `*` - This is the \"Multiplication\" operator. It multiplies\
    \ the values of two operands and returns the product.\n*   `/` - With this operator,\
    \ you can divide the value of the left-hand operand by that of the right-hand\
    \ operand and returns the quotient.\n*   `%` - This is the \"Modulus\" operator.\
    \ It divides the value of the left-hand operand by that of the right-hand operand\
    \ and returns the remainder.\n\n#### The Concatenation Operator\n\nThis operator\
    \ allows you to concatenate strings. Since it only works on string values, it\
    \ converts non-string operands before doing any operation. The code snippet given\
    \ below will give you \"My favorite number is 23\":\n\n```\n$favorite_number =\
    \ 23;\nprint \"My favorite number is \" . $favorite_number;\n```\n\nThe concatenation\
    \ operator converts the integer `$favorite_number` to a string (i.e., \"23\")\
    \ before combining the operands.\n\n#### The Comparison Operators\n\nYou can use\
    \ these operators to compare the values of two operands. If you are dealing with\
    \ two string operands, PHP will perform the comparison in a lexicographical manner.\
    \ Thus, it will give a Boolean result. The comparison operators listed below perform\
    \ automatic data type conversions whenever necessary:\n\n*   `==` - This operator\
    \ checks whether the operands have equal values. It will give you `true` if the\
    \ values are equal. For example, `3 == 4` evaluates to `false`.\n*   `!=` - This\
    \ is the exact opposite of the previous operator. It will give you `true` if the\
    \ values inside the operands are not equal. For instance, `3 != 4` evaluates to\
    \ `true`.\n*   `>` - With this operator, you can check whether the value of the\
    \ left-hand operand is greater than that of the right-hand operand. If so, you\
    \ will get `true` as the result. For instance, `3 > 4` will give you `false`.\n"
  trans: "\n# PHP 数据类型和运算符\n\n## 自动类型转换为布尔值\n\n如前所述，PHP 会自动转换数据类型。你应该知道，数据类型在运行时经常会被转换为布尔值。这是因为在条件代码（例如循环、`if`\
    \ 语句等）中，系统会将涉及的数据类型转换为布尔值，以查看它们是否满足给定条件。此外，PHP 的比较运算符会产生布尔值。分析以下代码片段：\n\n```\n\
    $first_value = 3;\n$second_value = 4;\n\nif ($second_value > $first_value) {\n\
    \    print \"The second value is greater than the first one\\n.\";\n}\n```\n\n\
    在这里，系统将检查条件是否满足。结果是一个布尔值（即 `true` 或 `false`）。如果条件语句评估为 `true`，则大括号内的命令将会运行。\n\n\
    ## Null\n\n这种数据类型只能有一个值，即 `NULL`。你将使用此类型来标记空变量。如果你正在使用数据库，可以使用 `Null` 来区分无效值和空字符串。\n\
    \n如果被检查的变量存在，该语言的 `isset()` 运算符会对 `Null` 值返回 `false`。然而，当用于其他数据类型时，如果变量存在，`isset()`\
    \ 将返回 `true`。\n\n## Resource（资源）\n\n这被视为一种特殊的数据类型。它代表 PHP 的扩展资源，例如打开的文件。请记住，你不会直接处理资源变量。相反，你只需将其传递给可以与相关资源交互的不同函数。\n\
    \n## 数组\n\n在 PHP 语言中，数组是一组键值对：它将键索引到各自的值。数组索引可以采用字符串或整数的形式，而值可以属于任何数据类型（甚至是其他数组）。\n\
    \n### 声明数组\n\n声明数组时，你可以使用 `array()` 结构。此结构需要以下语法：\n\n```\narray([key_to_be_used\
    \ =>] value, [key_to_be_used =>] value, ...)\n```\n\n在此语法中，`key_to_be_used` 条目是完全可选的。如果你不指定键，系统将自动为你创建一个。该键将是可用的最大整数加一。PHP\
    \ 允许你在单个声明中混合使用带键和不带键的数组。\n\n### 访问数组元素\n\n你需要使用 `$arr[key]` 语法来访问数组元素。在此语法中，`key`\
    \ 可以是字符串或整数。使用常量字符串作为键时（例如 `$arr[\"string\"]`），请务必包含引号。这种语法非常有用：你可以用它来读取现有元素或创建新元素。\n\
    \n## 常量\n\n在使用 PHP 时，你可以为基本值设置名称，称为常量。就像在其他语言中一样，一旦你分配了 PHP 常量的值，就无法更改它。命名常量的规则与命名变量的规则几乎相同。唯一的区别是常量名称前不需要美元符号。声明常量时，大多数程序员倾向于使用大写字母。这种方法有助于他们实现代码的可读性。\n\
    \nPHP 允许你在代码的任何部分访问常量。这意味着你不需要在每个函数和 PHP 文件中声明它们。以下是定义常量时应使用的函数：\n\n```\ndefine(\"\
    NAME_OF_CONSTANT\", value)\n```\n\n其中：\n\n*   `NAME_OF_CONSTANT` 是一个由字母和数字组成的典型字符串。\n\
    *   `value` 是除对象和数组之外的任何 PHP 表达式。\n\n下面给出的代码片段将向你展示如何定义和使用常量：\n\n```\ndefine(\"\
    OK\", 0);\ndefine(\"ERROR\", 1);\n\nif ($errorcode == ERROR) {\n    print(\"An\
    \ error has occured\\n\");\n}\n```\n\n## 运算符\n\nPHP 语言支持三种运算符：一元、二元和三元。\n\n###\
    \ 二元运算符\n\n二元运算符需要两个操作数。例如：\n\n```\n1 + 5\n13 * 3.14\n$x / 10\n```\n\n请记住，你只能对属于同一数据类型的值执行二元运算。如果你正在处理的操作数具有不同的数据类型（例如字符串和整数），PHP\
    \ 语言将执行自动转换。因此，它会将一种数据类型转换为另一种以实现一致性。这种自动转换的工作方式如下：\n\n*   如果你正在处理整数和浮点数，前者将被转换为后者的数据类型。\n\
    *   如果你正在处理字符串和整数，PHP 将转换前者。\n*   如果你正在处理实数和字符串，PHP 将转换后者。\n\n#### 赋值运算符\n\n赋值运算符允许你将值赋给变量。在这里，你应该将变量名写在表达式的左侧。将你想要赋的值放在表达式的右侧。例如，在表达式\
    \ `$sample = 10` 中，你将把 `10` 赋给名为 `sample` 的变量。\n\n除了 `=` 之外，还有各种赋值运算符可供你在 PHP\
    \ 中使用。这些运算符涉及特定的数学符号，执行运算并将结果赋给左侧操作数。以下是一些示例：\n\n*   `$counter += 1;` `/* 在此表达式中，PHP\
    \ 会将 1 加到 counter 的当前值上。然后，它将把总和作为该变量的新值赋予。 */`\n*   `$fund -= $expenses;` `/*\
    \ 在这里，PHP 会从 \"fund\" 的值中扣除名为 expenses 的变量的值，并将差值作为前者的新值赋予。 */`\n\nPHP 支持以下赋值运算符：\n\
    \n`=`, `-=`, `/=`, `*=`, `+=`, `.=`, `|=`, `>>=`, `<<=`, `&=`, `^=`, 和 `&=`\n\n\
    #### 数值运算符\n\n通常，二元运算符需要数值操作数。如果你处理的是 null、字符串、资源或布尔值，系统将在执行任何计算之前将这些值转换为数字。以下是你将在\
    \ PHP 中找到的数值运算符：\n\n*   `+` - 这称为“加法”运算符。它将两个操作数的值相加并返回总和。\n*   `-` - 程序员称之为“减法”运算符。它从左侧操作数的值中减去右侧操作数的值并返回差值。\n\
    *   `*` - 这是“乘法”运算符。它将两个操作数的值相乘并返回乘积。\n*   `/` - 使用此运算符，你可以将左侧操作数的值除以右侧操作数的值并返回商。\n\
    *   `%` - 这是“取模”运算符。它将左侧操作数的值除以右侧操作数的值并返回余数。\n\n#### 连接运算符\n\n此运算符允许你连接字符串。由于它仅适用于字符串值，因此它会在执行任何操作之前转换非字符串操作数。下面给出的代码片段将输出\
    \ \"My favorite number is 23\"：\n\n```\n$favorite_number = 23;\nprint \"My favorite\
    \ number is \" . $favorite_number;\n```\n\n连接运算符在组合操作数之前将整数 `$favorite_number`\
    \ 转换为字符串（即 \"23\"）。\n\n#### 比较运算符\n\n你可以使用这些运算符来比较两个操作数的值。如果你处理的是两个字符串操作数，PHP\
    \ 将以字典顺序执行比较。因此，它将给出一个布尔结果。下面列出的比较运算符在必要时执行自动数据类型转换：\n\n*   `==` - 此运算符检查操作数是否具有相等的值。如果值相等，它将给你\
    \ `true`。例如，`3 == 4` 评估为 `false`。\n*   `!=` - 这与前一个运算符完全相反。如果操作数内的值不相等，它将给你 `true`。例如，`3\
    \ != 4` 评估为 `true`。\n*   `>` - 使用此运算符，你可以检查左侧操作数的值是否大于右侧操作数的值。如果是，你将得到 `true`\
    \ 作为结果。例如，`3 > 4` 将给你 `false`。\n\n"
