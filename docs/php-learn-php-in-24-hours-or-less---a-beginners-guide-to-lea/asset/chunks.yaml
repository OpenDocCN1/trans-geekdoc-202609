- raw: "In object-oriented programming, polymorphism and base class utilization play\
    \ important roles. Base classes contain subclasses, which sometimes require the\
    \ creation of concrete instances. In PHP, programmers use a design pattern called\
    \ “factory” to create the needed subclasses. Factory classes have a method that\
    \ takes an input. Depending on the input provided, these classes will decide what\
    \ kind of instance to generate (often a subclass).\n\nLet's assume that your website\
    \ allows different types of users to sign in. Some of these people are visitors,\
    \ some are customers, and some are administrators. In this situation, most programmers\
    \ will create a base class and three subclasses. You may name the base class as\
    \ “Users.” Then, you may name the subclasses as “Visitors,” “Customers” and “Admins.”\
    \ The base class and all of its subclasses will contain methods that can collect\
    \ data regarding the user (e.g. the user's personal preferences and the online\
    \ resources he/she can access).\n\nYou can create a robust website by using the\
    \ “Users” base class whenever you can. This way, you can generalize your source\
    \ code and simplify the addition of new user types.\n\nThe Observer Pattern \n\
    \nPrograms created using PHP manipulate information. In most cases, modifications\
    \ done on a piece of information influence different sections of the program's\
    \ source code. For instance, if a customer from Asia visits the U.S. section of\
    \ eBay, exchange rates will affect the prices that he/she will see on his screen.\n\
    \nLet's assume that each programming object represents one eBay product. The objects\
    \ used in the code come straight from eBay's database. The exchange rates, on\
    \ the other hand, will likely come from an external data source and are not saved\
    \ in the database. Each object contains “display()”, a method that returns the\
    \ HTML content related to the product.\n\nThe “observer” design pattern allows\
    \ objects to sign up for specific information and/or events. When the information\
    \ gets changed or an event happens, PHP will notify the registered objects. With\
    \ this approach, you can tag a product item as an observer of the exchange rate.\
    \ Additionally, you may update the registered programming objects about the exchange\
    \ rates prior to printing out item lists. That means each object can update itself\
    \ and include the new information in its display() method.\n\nOften, PHP users\
    \ implement observer patterns through an interface known as the “observer.” Classes\
    \ that need to act as observers should implement this interface.\n\nAn “observable”\
    \ object often has a method named “register,” which lets the “observer” (i.e.\
    \ the interface) to sign up automatically.\n\n# \n\nChapter 7: Using PHP to Create\
    \ an Application \n\nPeople use PHP to build websites. This computer language\
    \ allows programmers to make dynamic web applications. A dynamic application collects\
    \ data from users through HTML forms. The data obtained from users and saved in\
    \ the website is confidential, which makes security a serious concern. The PHP\
    \ language has features that allow you to obtain and store data securely. PHP\
    \ has everything you need: you just need to develop applications using the features\
    \ offered by this language. In this chapter, you'll learn how to use PHP in building\
    \ dynamic web applications.\n\n## PHP and HTML\n\nYou don't have to embed PHP\
    \ codes into HTML files. You can always produce PHP files that don't contain any\
    \ HTML element. When creating web applications, however, you will likely combine\
    \ these languages in a single file. Computer experts say that PHP was created\
    \ for websites, to be used as a template for HTML documents. Once you add PHP\
    \ into a file, that file will get “.php” or “.php5”as its extension.\n\nThe code\
    \ given below shows how you can combine PHP and HTML:\n\n<html>\n\n<head><title>First\
    \ Sample</title></head>\n\n<body>\n\n<?php\n\n  // This code has a data-based\
    \ “if” statement.\n\n  if (date('md' == '1225')) {\n\n    echo 'Merry Christmas\
    \ '\n\n      'and Happy New Year';\n\n  } else {\n\n    echo 'Hi, how are you?';\n\
    \n  }\n\n?>\n\n</body>\n\n</html>\n\nIn this example, the “<?php” part signifies\
    \ the start of the embedded PHP code. The “?>” part, on the other hand, indicates\
    \ the end of the PHP code. You probably noticed that this example sends the output\
    \ through “echo.” This approach is acceptable if you are dealing with simple codes\
    \ such as the one given above. However, if you are using “echo” on strings that\
    \ have single/double quotes, your code will be extremely complicated.\n\nThis\
    \ example will result to an error if the echoed text is a link (e.g. <a href='https…'>).\
    \ That's because the quotes in the echoed text will be in conflict with the quotes\
    \ that encloses the string. In this kind of situation, you may end the PHP part\
    \ before processing the text's output. Then, start it again before the code that\
    \ terminates the “if” statements. Here's an example:\n\n<html>\n\n<head><title>Second\
    \ Sample</title></head>\n\n<body>\n\n<?php\n\n  // This code contains a date-based\
    \ “if” statement.\n\n  if (date('md' == '1225')) {\n\n    echo 'Merry Christmas\
    \ and ' . \n\n      'Happy New Year!';\n\n  } else {\n\n    echo 'Hi, how are\
    \ you?';\n\n  }\n\n?>\n\n</body>\n\n</html>\n\nThis style of writing codes is\
    \ confusing. It violates an important programming principle: “Don't mix content\
    \ and logic.” The embedding style given below uses a variable to store the string\
    \ and echoes that variable:\n\n<?php\n\n  // This code contains a date-based “if”\
    \ statement.\n\n  if (date ('md' == '1225') ) {\n\n    $message = 'Merry Christmas\
    \ and Happy New Year!”;\n\n  } else {\n\n    $message =   'Hi, how are you?';\n\
    \n  }\n\n?>\n\n<html>\n\n<head><title>Third Sample</title></head>\n\n<body>\n\n\
    <?php echo $message; ?>\n\n</body>\n\n</html>\n\n## \n\nUsers' Input \n\nAfter\
    \ learning how to include PHP in an HTML file, you should know how to set user-specified\
    \ actions. For example, an online bookstore requires a registration and login\
    \ system. Obviously, users need to perform an action (e.g. enter login credentials)\
    \ to get “inside” the online shop. This type of system needs HTML-based forms\
    \ and a storage to keep the collected data in.\n\nFor this example, you need several\
    \ things from each user during the registration process. These are: name, password\
    \ and email address. Analyze the following HTML code:\n\n<html>\n\n<head><title>Sign\
    \ up</title></head>\n\n<body>\n\n  <h1>Register Here</h1>\n\n  <form method=”get”\
    \ action=”signup.php”>\n\n    <table>\n\n    <tr><td>Email Address:</td>\n\n     \
    \ <td><input type='text' name='email address'/> </td></tr>\n\n    <tr><td>Name:</td>\n\
    \n      <td><input type='text' name='first\\_last\\_name'/></td></tr>\n\n    <tr><td>Desired\
    \ Password:</td>\n\n      <td><input type='password' name='desiredpassword'/></td></tr>\n\
    \n    <tr>\n\n      <td colspan ='3'>\n\n      <input type='submit' name='signup'\
    \ value='Sign up'/>\n\n      </td>\n\n    </tr>\n\n    </table>\n\n  </form>\n\
    \n</body>\n\n</html>\n\n## \n\nHow to Handle User Input Safely \n\nDon't trust\
    \ anyone, particularly the people who use your website. People do unexpected stuff,\
    \ whether by accident or on purpose. That means they might discover bugs or vulnerabilities\
    \ in your website. This part of the book will discuss the problems that might\
    \ happen to your site. Then, it will discuss the techniques that you can use to\
    \ solve such problems.\n\nCommon Errors\n\nProgrammers make mistakes sometimes.\
    \ If you will subscribe to security-related email lists, you will discover new\
    \ weaknesses of PHP programs each week. Let's discuss some of the most popular\
    \ errors related to PHP:\n\n*   Global Variables – In some cases, program developers\
    \ fail to initialize global variables correctly. You can prevent this mistake\
    \ by setting the 'register\\_globals' directive to “off.” However, this problem\
    \ can still occur so you need to be careful. Users whose register\\_globals are\
    \ on might abuse your website application. For example, customers might gain admin-level\
    \ access to your system just by running arbitrary codes on your site."
