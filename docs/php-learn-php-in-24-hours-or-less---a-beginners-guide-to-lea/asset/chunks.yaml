    # Cross-Site Scripting and SQL Injection


    *   **Cross-Site Scripting** – A hacker might use “cross-site scripting” to run
    client-side languages (e.g. `JavaScript`) to steal cookies and confidential information.
    This scripting technique is easy and simple. The hacker just needs to enter raw
    information into the website''s HTML.

    *   **SQL Injection** – This method requires the hacker to insert malicious codes
    into his/her database queries.


    # Securing Your Scripts


    If you want to secure your `PHP` scripts, never trust your website users. This
    statement, although harsh, is the best advice that you can get regarding security.
    Aside from hacking your website, users might perform strange things accidentally.
    As the programmer, you must ensure that hacking attacks and user mistakes won''t
    cause significant damage on your web application. The following list shows the
    best techniques that you can use in protecting your website:


    *   **Validate Inputs** – You can protect your website by validating all of the
    inputs sent by your users. That means you will check the data of your users''
    “get,” “post” and cookies.


    The first thing you need to do is turn off the “`register_globals`” section of
    `php.ini`. Then, set the highest possible value on the part named “`error_level`”.
    Basically, “`register_globals`” stops the tagging of the request information (e.g.
    session, post, get, etc.) as a global variable in your `PHP` script. The “`error_level`”
    part, on the other hand, will allow notifications for variables that were not
    initialized.


    The methods that you''ll use depend on the types of input you''re dealing with.
    For example, if the parameters contained in the “`GET`” method should be integers,
    you may force these parameters to have that data type. With this technique, all
    non-integer values will become “0.”


    *   **7.3.2.2 HMAC Security** – Hackers usually tamper with the variables within
    a `URL` (e.g. for page redirects or links that forward parameters to the connected
    script). As the programmer, you need to prevent hackers from implementing their
    evil plans. You can use hashes to protect your website. Today, `HMAC` is the ideal
    solution for your hashing needs.


    Programmers consider `HMAC` as an excellent validation algorithm. You should choose
    this over “home-brewed” algorithms. With `HMAC`, your text will undergo a two-step
    encryption procedure.


    # Sessions


    In `PHP`, sessions allow a program to store data for the active “session” (i.e.
    one person who uses the program). Each session has an ID – you can use that piece
    of information to identify the sessions in your `PHP` applications. This language
    generates session IDs by collecting the IP address of the remote user, the time,
    and some additional random data. Then, it will encrypt the collected data using
    the `MD5` algorithm. You can pass this ID to a cookie or add it to the `URLs`
    that the user will use for site navigation.


    To keep your web application secure, you should require users to enable their
    cookies than pass session IDs using `URLs`. As you know, information sent through
    `URLs` might get saved in the server''s records or get discovered by hackers who
    monitor the site''s traffic.


    # File Uploads


    `PHP` has a file upload functionality that you can use to upload different types
    of materials (e.g. images). Since the web browser should do more things than just
    transmit “`POSTs`” with relevant information, you must utilize a special form
    for uploading files. Here''s an example:


    ![](Images/image00117.jpeg)


    This code has an attribute named “`enctype`.” The “`enctype`” attribute informs
    the user''s web browser to transmit a different kind of request. The request needed
    here doesn''t contain “`field=var&field2=var2`.” Rather, the request''s syntax
    resembles a text-based email, with all of its parts serving as form fields.


    ## How to Handle Uploaded Files


    The array named “`$_FILES`” hold a set of data regarding each uploaded file. The
    handler code can use a file''s name to access data about that file. The variable
    called `$_FILES[''book_image'']` holds the following data for each uploaded file:


    *   **name** – This is the file''s name when it was still in the uploader''s local
    machine.

    *   **type** – This indicates the file''s `MIME` (i.e. Multipurpose Internet Mail
    Extensions) type. A `JPG` image can have `image/pjpeg` or `image/jpeg` as its
    `MIME` type. All non-text files have their own `MIME` type.

    *   **tmp_name** – This data serves as the file''s temporary name inside the file
    system of the web server. The `PHP` language will delete this data after completing
    the upload request. That means you should do something about the file''s `tmp_name`
    within the code that takes care of the user''s request (i.e. either transfer or
    delete it).

    *   **error** – This number represents the type of error that occurred (if any).
    You''ll learn more about errors later.

    *   **size** – This part shows the total size of the file.


    Sometimes, users experience errors while uploading a file. Most of these errors
    are linked to the uploaded file''s size. In `PHP`, error codes have a matching
    constant. Here are the errors that you might encounter while using this language:


    | Error Code | Name of Constant | Definition |

    | :--- | :--- | :--- |

    | 0 | `UPLOAD_ERR_OK` | This error code states that the upload process was successful.
    The system didn''t encounter any error. |

    | 1 | `UPLOAD_ERR_INI_SIZE` | This code means the file you want to upload exceeds
    the maximum file size specified in `php.ini`. |

    | 2 | `UPLOAD_ERR_FORM_SIZE` | The file you are working on exceeds the maximum
    file size set for the system. You can''t rely on this code since users can fake
    the size of their files. |

    | 3 | `UPLOAD_ERR_PARTIAL` | The process was unsuccessful. The file received by
    the server is incomplete. |

    | 4 | `UPLOAD_ERR_NO_FILE` | This error code states that the user didn''t upload
    any file. |


    # Architecture


    At this point, you should know how to organize the scripts in your applications.
    This book will focus on the most popular methods of organizing `PHP` codes. Read
    this material carefully: it will help you master the basics of `PHP` in just 24
    hours.


    ## The One Script Approach


    With this approach, you will use a single script to handle the requests of all
    the pages in the website. Programmers usually use the `index.php` script to implement
    this kind of architecture. Here, you can add `URL` parameters (e.g. `?page=register`)
    to pass different types of content. You shouldn''t save all of your codes inside
    `index.php`. It would be best if you will use the `index.php` script to save the
    most important parts of your code.


    ## One Script for Each Function


    Programmers consider this as one of their best options when it comes to program
    architecture. With this approach, you won''t use a primary script (like the one
    discussed above). Rather, you will store your functions inside different scripts
    and access them through their `URL`.


    If you will use this approach, you won''t have to maintain a huge script. The
    main disadvantage of this approach, meanwhile, is that you need to write the basic
    codes inside each script.


    ## Keep Layout and Logic Separated


    Regardless of the approach you''re using, you should always separate the layout
    from your logic. `PHP` offers a lot of techniques to attain this. For example,
    you may use a templating engine.


    # Chapter 8: Databases and the PHP Language


    Almost all `PHP` books deal with databases. Thus, the final chapter of this eBook
    will teach you important things regarding databases. You need to read this material
    carefully since you will surely use databases for your `PHP` applications.


    This chapter will focus on `MySQL`, one of the leading database management systems
    in the world.


    ## MySQL – The Basics


    `PHP` and `MySQL` form a great team: they serve as the main tools for application
    developers. Since you are studying `PHP`, you will encounter (and use) `MySQL`
    on a regular basis. This is the main reason why this book will focus on this database
    management system.

    '
