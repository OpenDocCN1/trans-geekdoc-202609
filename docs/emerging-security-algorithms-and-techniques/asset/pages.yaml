    # 2.4.5 The Field of the Form GF($pⁿ$)


    The polynomials $Z_p[x]$ mod $p(x)$, where $p(x) \in Z_p[x]$, $p(x)$ is irreducible,
    and $deg(p(x)) = n$ (i.e., $n+1$ coefficients), form a finite field. Such a field
    has $p^n$ elements.

    These fields are called Galois fields or $GF(p^n)$ (Benvenuto, 2012).

    The special case $n=1$ reduces to the fields $Z_p$.


    # GF($2^n$)


    The coefficients are bits [0, 1].

    For example, the elements of $GF(2^n)$ can be represented as a byte, one bit for
    each term, and $GF(2^n)$ as a 64-bit word:

    $x^0+x^4+x+1 = 01010011$.


    # 2.5 Schoof–Elkies–Atkin (SEA) Algorithm


    In finding or calculating the number of points on an elliptic curve over a finite
    field, SEA is used, i.e., an algorithm which determines the order of an elliptic
    curve $E$ over the finite field $F_p$. This algorithm is an extension of Schoof''s
    algorithm by Noam Elkies and A. O. L. Atkin to improve its efficiency (under heuristic
    assumptions) (Schoof, 1995).

    Let $L = \{l_1, l_2, ..., l_k\}$ be a set of primes of certain kind known as Elkies
    primes and Atkin primes. A prime $l$ is called an Elkies prime if the characteristic
    equation $\phi^2-t\phi+q=0$ splits over $\mathbb{F}_l$ while Atkin prime is a
    prime which is not Elkies.


    # 2.5.1 Steps of SEA


    Let a prime of finite field, $p$, and an elliptic curve $E: y^2 = x^3 + Ax + B$
    over that field. We want to find $\#E(F_p) = p+1-a_p$. For each Elkies prime,
    we will need a residue $E_i = a_p$ modulo $l$. For each Atkin prime, we will keep
    a set $A_l$ of possible residues of $a_p$ modulo $l$.


    # 2.5.2 Steps of Algorithm (Gaski, 2010)


    +   1. Compute the $j$-invariant $j=j(E).'
