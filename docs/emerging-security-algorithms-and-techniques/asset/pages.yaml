  md: '# 202 Emerging Algorithms and Techniques


    The shared key and the entities'' private key are secret with the corresponding
    participating entities, and an intruder tries to interpret the keys, then he has
    to solve Elliptic Curve Diffie-Hellman (ECDH) protocol. ECDH is a very fast key
    exchange protocol (Schroeppel et al., 1995) and has several advantages over the
    other key exchange methods by providing security to the wireless devices with
    features like web browsing, email, and virtual private networking for the corporate
    networks (Lauter, 2004).


    # 12.2.3 Buchmann–Williams Key Exchange


    Buchmann William is an authenticated key exchange protocol, which is based on
    imaginary quadratic fields. Buchmann–Williams key exchange protocol was proposed
    by Buchmann and William (1988) and was later modified in 1989. In this protocol,
    the participating entities exchanging keys needs to select a value $D$, which
    is very large (~10^{20}), and an ideal value $a$, which can be made public. If
    two entities A and B want to exchange keys, then Buchmann-Williams key exchange
    protocol will work as follows:


    +   1. Entity A will select a random integer $x$ and compute an ideal reduced
    value $b$ such that $b = a^x$ and send the $b$ to entity B.

    2. Entity B will also select a random integer $y$ and compute an ideal reduced
    value $c$ such that $c = a^y$ and send the $c$ to entity A.

    3. Now, entity A computes a reduced ideal value 1 ($c''$), and similarly entity
    B computes a reduced ideal value 2 ($f$), where $f1=f2$ which can be seen in the
    theorem discussed in Buchmann and Williams (1988).


    The idea of Buchmann key exchange protocol can also be used for designing public-key
    cryptography, but the complexity of the protocol is greater than the DHE protocol.


    # 12.2.4 LWE Key Exchange


    Learning With Errors (LWE) was introduced by Oded Regev as a problem in machine
    learning which is hard to be solved. LWE is used in creating cryptosystems (Gentry
    et al., 2008; Regev, 2009; Peikert, 2009; Peikert and Waters, 2011). As LWE has
    been proven to provide the greater security and has good asymptotic efficiency,
    Ding (2012) proposed a secure key exchange based on LWE. For a communication between
    entities A and B over an insecure channel, the LWE key exchange protocol will
    work as follows:


    +   1. The public parameters are $q, n, \alpha$ where $q$ is prime and $q>2$ with
    a uniform random matrix $M \leftarrow \mathbb{Z}_q^{nn}$.

    2. Entity A chooses a secret vector $S_A \leftarrow D_{Z_q, \alpha}$ and computes
    $P_A = MS_A + 2e_A \pmod q$, where $e_A \leftarrow D_{Z_q, \alpha}$, then send
    $P_A$ to entity B.

    3. When entity B receives $P_A$ it will also choose a secret vector $S_B \leftarrow
    D_{Z_q, \alpha}$ and an error $e''_B \leftarrow D_{Z_q, \alpha''}$.

    4. It computes $K_B = P_A^T \cdot S_B + 2e''_B \pmod q$ and $P_B = M^T \cdot S_B
    + 2e_B \pmod q$ sampling $e_B \leftarrow D_{Z_q, \alpha''}$.

    5. Now entity B computes and shares the shared secret $SK_{B} = E(K_B, \sigma)$.
    Finally, entity B sends $(P_B, \sigma)$ to entity A.'
