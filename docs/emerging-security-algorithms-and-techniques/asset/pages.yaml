    WW-IBE scheme is a universal primitive that is used in both key derivations and
    in encryption as it allows more general *patterns*.


    # 10.4.2.2 Algorithm Steps of WKD-IBE


    +   * Wildcards are initiated with the ciphertext to cipher ciphertext decrypt
    by a whole range of the user; they are initiated with secret keys to allow more
    general pattern.

    * Secret keys are combined with *patterns* rather than combining with identity
    vectors.

    * Pattern $P = (P_1, ..., P_l) \in [0, 1]^*$


    +   a. $l \leq L$

    nb. $*$ is wildcard

    c. $C$ is the maximum length of the WKD-IBE scheme.


    So, in *pattern* $P$, each element is either a wildcard or a specific identity
    string.

    For a given *pattern* $P$, the user in the hold of secret keys can produce secret
    keys for pattern $P''$ which matches the pattern $P$.


    ```

    $P'' = (P''_1, ..., P''_l'')$ matches $P$ if and only if,

    ```


    +   a. $l'' \leq l$,

    b. $P_i = P''_i$ and

    c. $P'' \in P$.


    # 10.4.3 Fuzzy Identity-Based Encryption


    We know that in Fuzzy scheme the identities are the arbitrary string of characters,
    but in the new type of IBE, i.e. Fuzzy identity-based encryption (FIBE) a set
    of descriptive attributes are the identities (Chatterjee & Sarkar, 2006a). FIBE
    works on a certain distance between the users which is measured by metric suppose.
    Alice with $\omega$ as the secret key will only able to decrypt the ciphertext
    which is encrypted with $\omega''$ as public key and only if $\omega$ and $\omega''$
    are within a certain distance.


    # 10.4.3.1 Applications of FIBE


    +   * Biometric can be used as identity in FIBE. *Example*: User’s iris scan can
    use as an identity to describe several attributes and the user can encrypt the
    message using their biometric identity.'
