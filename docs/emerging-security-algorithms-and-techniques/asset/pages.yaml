  md: '# Emerging Security Algorithms and Techniques


    The locations at which data are preferred to be located must be less prone to
    natural calamities such as earthquakes and floods, which can damage the data-storing
    servers.


    +   2. Logical and system issues: These issues exist in the operating systems,
    and security here is far more difficult to achieve. These issues consist of infection
    of malware or data theft. It can be a very hard task to secure data from unwanted
    access.


    # 16.3.2 Threats to Database


    +   1. Distributed systems: This may be due to the widespread use of the distributive
    system/server architecture and database being exposed to the threat of unreliable
    networks. Internet and intranet increase the risks.


    +   2. Excessive privileges: This may result in exploitation of data by which
    integrity hindered; for example, we can take of a banking system where the customers
    expect their data to be confidential, but if there is threat of data leak, the
    bank may lose its customers.


    +   3. Not authentication of data: It poses another threat to database security.
    Flexibility in authentication may lead to data theft and transforming its credentials.
    If anyone gets access to data other than the original user, then it is fully capable
    of attacking other systems as well.


    +   4. Loss of data integrity: Loss of integrity to data can result in corrupting
    of it; when an integrity breach is observed, it tends to disrupt the workflow
    causing delay. When integrity is lost, confidentiality is also lost (Malik & Patel,
    2016).


    +   5. SQL injections: The information entered by user acts as data and is comprised
    of the database. SQL injections are statements that are injected by attackers
    to input factual information (Malik & Patel, 2016).


    +   6. Malware: The viruses pose a threat on all systems; if the database gets
    infected, its access by authorized users is hindered, and they are not able to
    use the data, system, and files on the server.


    # 16.3.3 Securing the Database


    There is always a need to build a bolster system which provides a better architecture
    to support the security of the system. It is advisable that normalization should
    be done prior to use, and updating should be avoided at the time data are fed
    for future use. The database can be secured by following certain security aspects
    while using bulk databases (Malik & Patel, 2016):


    +   1. Limiting access: Providing access only to authorized and concerned users,
    i.e., restricting the parts of the database being visible to all public users.
    They can be categorized under private and protected. Rather, of the large sample,
    the person gets abr data by which risk to data is reduced.


    +   2. Fuzzing the data: Fuzz means to blur and add bit distortions. Introducing
    a little unreal data provides ambiguity to existing values, like changing some
    values or changing the set of values to keep original data secure and covert.
    It is the addition of misleading data to keep the probability of misusing data
    zero.'
