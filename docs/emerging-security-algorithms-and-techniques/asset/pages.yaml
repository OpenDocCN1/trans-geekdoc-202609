    The mathematical operations, addition and multiplication, on this set are done
    by performing the operation in question in the set Z of integers, dividing by
    n and keeping the remainder as. This construction yields a field if n is a prime
    number. For example, taking n=2 in the above-mentioned field, i.e., $F_2$.


    For $n=4$ and more generally, for any composite number $n=r \cdot t$, $Z/nZ$ is
    not a field: the product of two non-zero elements is zero since $t=0$ in $Z/nZ$,
    which as explained above, prevents $Z/n$ from being a field. The field $Z/pZ$
    with $p$ elements (p prime) constructed in this way is usually denoted by $F_p$.


    In modular arithmetic 12, $9+4=13$ in $Z$, which divided by 12 leaves remainder
    1. Since 12 is not a prime, $Z/12Z$ is not a field.


    # Remark


    +   * The number of elements in any finite field $F$ has $p^n$, where $p$ is prime
    and $n \ge 1$.

    * The group of positive integers modulo a prime $p$ given by


    > $Z_p \equiv \{1, 2, \dots, p-1\}$ is a field.


    # Satisfaction of Required Properties


    +   * Closure. Yes.

    * Associatively. Yes.

    * Identity. 1.

    * Inverse. Yes.


    # Example


    > $Z_7 = \{1, 2, 3, 4, 5, 6, 7\}$


    $1-1=0, 2^{-1}=4, 3^{-1}=5, 5^{-1}=3, 6^{-1}=7$


    # 2.4.3 Finite Field of the Type $GF(p)$


    The field with $p$ elements can be constructed as the splitting field of the polynomial
    of the form $f(x)=x^p-x$, where $p$ is a prime number.


    This splitting field is an extension of $F_p$, in which the polynomial $f$ has
    $p$ zeros, $i.e.$, it has as many zeros as possible because the degree of $f$
    is $p$. For $p^2=4$, it can be checked by using the above multiplication table
    that all elements of $F_4$ satisfy the equation $x^4=x$, so they are zeros of
    $f$. However in $F_2$ has only two zeros (namely 0 and 1), so $f$ does not split
    into linear factors in this smaller field. Elaborating on further basic field-theoretic
    notions, it can be shown that two finite fields with the same order are isomorphic.
    It is customary to speak the finite field with $p$ elements, denoted by $F_p$,
    or $GF(p)$ (Bussey, 1910). The simplest field is $GF(2)$ (Tables 2.3–2.5).


