    # 15.3 Elliptic-Curve Digital Signature Algorithm


    Elliptic-curve digital signature algorithm (ECDSA) is a significant variation
    of the DSA which uses elliptic-curve cryptography (ECC). ECDSA is also used by
    bitcoin as it ensures that funds can only be spent by their rightful owner. Actually,
    ECDSA is the elliptic curve which is analogous to DSA. It was proposed in the
    year 1992 by Scott Vanstone (Mene Vanstone, 1993). It was accepted by ISO (International
    Standards Organization) in 1998 and was accepted by ANSI (American National Standards
    Institute) in 1999. It was accepted as a standard algorithm by IEEE (Institute
    of Electrical and Electronics Engineers) in the year 2000 (Vanstone, 2003).


    A few concepts related to ECDSA are as follows:


    +   **Private key:** A private key is a secret number which is only known to a
    person who generates it. It is a randomly generated number which is used in bitcoin.
    A person with a private key in bitcoin can spend the funds in bitcoin. The size
    of the private key is single unsigned 256-bit integer, i.e., 32 bytes.

    **Public key:** A public key is a number which corresponds to a private key, but
    it is not kept as a secret, rather exposed publicly. It can be used to determine
    whether a signature is genuine or without requiring the private key to be exposed.

    **Signature:** A signature is a number which is responsible for the signing operation.
    It is generated mathematically from a hash of which is to be signed plus a private
    key. The signature comprises two numbers: $s$ and $p$. By using the public key
    in a mathematical algorithm, it can be determined that the signature was generated
    from a hash and a private key without knowing the private key.


    In the ECC, generally the bit size for the private key needed for ECDSA is twice
    the size of security levels (in bits) (Hankerson et al., 2004). For example, for
    the security level of 90 bits'
