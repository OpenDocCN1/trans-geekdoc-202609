  md: "# Identity-Based Encryption\n\nb. Attribute-based encryption is defined as\
    \ the application in FIBE in which the user\\can encrypt the information to all\
    \ other users having the certain set of attributes.\nThe FIBE provides the advantage\
    \ by storing the document on an untrusted server.\n\n# 10.4.3.2 Algorithm of FIBE\
    \ Scheme\n\n+   1. Setup.\n  a. $e: G \times G \to G_T$ where, $G, G_T \\in q$\
    \ ($q$ is prime).\n  b. $g$ is the generator G.\n  c. Universe $\\mu \\in Z_q$\
    \ of size $|\\mu|$.\n  d. Randomly chosen $t_i, y_i \\in Z_q$. Public parameter,\n\
    \n```\n$T_1 = g^y, \\dots, T_{\\mu1} = g^\\mu, Y = e(g,g)^y$\n```\n\nMaster key:\
    \ $t_1, \\dots, t_{iv}, y$\n\n+   2. Extract: Private key for identity $\\omega$.\n\
    Randomly chosen $d-1$ degree polynomial $p$,\n\n```\n$D_i = g^{p(i)t}$ for $i\
    \ \\in \\omega$ and $p(0)=y$.\n```\n\n+   3. Encrypt.\n  Public key $\\omega'$\
    \ encryption with message $M \\in G_p\n  a. Random values $s \\in Z_q$\n  b. Ciphertext\
    \ $E = (\\omega', E') = \\{E_i, T'_i\\}$, $i \\in \\omega$.\n\n+   4. Decrypt:\
    \ Compute ciphertext $E$,\n\n```\n$E' / \\prod_{i \\in S} (e(D_i, E))^{\\Delta\
    \ S(0)}$\n$= Me(g,g)^y / \\prod_{i \\in S} \\left(e(g^{p(i)t}, g^{yp^{p(i)t}})\\\
    right)^{\\Delta S(0)}$\n$= Me(g,g)^y / \\prod_{i \\in S} \\left(e(g,g)^{yp(i)}\\\
    right)^{\\Delta S(0)}$\n$= M$\n```\n\n# 10.5 Conclusion\n\nIBE scheme is a promising\
    \ solution for resolving the problems emerging with the symmetric and asymmetric\
    \ key management schemes. While there are issues, the comparative simplicity of\
    \ its architecture makes IBE an attractive proposition for diverse systems including\
    \ mobile computing. Moreover, the network world points how significantly lower\
    \ the total cost of ownership of the IBE system is as compared to a total public-key\
    \ system."
